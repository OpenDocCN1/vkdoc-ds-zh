    \ } = **this**.props.args\n\n**return** (\n\n<Rating\n\nsize=\"large\"\n\ndefaultValue={1}\n\
    \nmax={stars_count}\n\nonChange={(_, stars_count) => Streamlit.\n\nsetComponentValue(stars_count)}\n\
    \n/>\n\n)\n\n}\n\n}\n\nexport **default** withStreamlitConnection(RatingStar)\n\
