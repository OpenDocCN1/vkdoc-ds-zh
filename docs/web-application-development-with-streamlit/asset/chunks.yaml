  trans: "\n# Streamlit 组件回调与表单\n\n`on_change(*可调用对象*)` - 当组件值发生变化时调用的回调函数。\n\n`args(*元组*)`\
    \ - 传递给回调函数的参数元组。\n\n`kwargs(*字典*)` - 传递给回调函数的关键字参数字典。\n\n`disabled(*布尔值*)` -\
    \ 用于禁用组件的布尔参数。\n\n以下代码展示了颜色选择组件的实现，默认选择为黑色（十六进制值 `#000000`）。\n\n```\ncolor = st.color_picker(label\
    \ = '选择一个颜色', value = '#000000')\n```\n\n## 表单\n\n你可以使用 Streamlit 的 `st.form(key,\
    \ clear_on_submit=False)` 命令将多个组件封装到一个表单中。使用表单的额外好处是，Streamlit 不会像通常那样在你与表单内任何一个组件交互时重新运行整个脚本。相反，Streamlit\
    \ 只会在你使用 `st.form_submit_button(label='Submit', help=None, on_click, args, kwargs)`\
    \ ➤ `bool` 命令点击相关按钮时，才会重新运行脚本。\n\n### 表 A-37. `st.form` 参数\n\n| **参数** | **描述**\
    \ |\n| --- | --- |\n| `key(*字符串*)` | 用于标识表单的唯一字符串。 |\n| `clear_on_submit(*布尔值*)`\
    \ | 如果此参数设置为 true，则在表单提交组件的值发生变化后，表单内的所有组件都将重置为其默认值。 |\n\n### 表 A-38. `st.form_submit_button`\
    \ 参数\n\n| **参数** | **描述** |\n| --- | --- |\n| `label(*字符串*)` | 按钮上显示的标签。 |\n|\
    \ `help(*字符串或 None*)` | 光标悬停在组件上时显示的工具提示。 |\n| `on_click(*可调用对象*)` | 点击按钮时调用的回调函数。\
    \ |\n| `args(*元组*)` | 传递给回调函数的参数元组。 |\n| `kwargs(*字典*)` | 传递给回调函数的关键字参数字典。 |\n\
    \n以下示例展示了一个 Streamlit 表单和表单提交按钮如何一起使用：\n\n```\nwith st.form('form_1'):\n    radio\
    \ = st.radio('单选按钮', ['你好','世界'])\n    checkbox = st.checkbox('你好世界')\n    if\
    \ st.form_submit_button('提交表单'):\n        st.write('单选: %s' % radio, '复选框:', checkbox)\n\
    ```\n\n## A.1.5 显示交互式组件\n\nStreamlit 使得渲染多媒体内容变得相当简单，无论其来源如何。无论是保存在磁盘上的本地图像、通过\
    \ URL 访问的视频，还是包含声音文件原始数据的数组，你都可以使用 Streamlit 的原生命令来显示和播放多媒体，无需你再做任何额外工作。\n\n###\
    \ 显示图像\n\n我们可以使用以下命令轻松插入图像：`st.image(image, caption, width, use_column_width,\
    \ clamp, channels='RGB', output_format='auto')`。\n\n### 表 A-39. `st.image` 参数\n\
    \n| **参数** | **描述** |\n| --- | --- |\n| `image(*numpy.ndarray, [numpy.ndarray],\
    \ BytesIO, str, 或 [str]*)` | 以下类型的一个或多个：单色图像 (w,h) 或 (w,h,1)，彩色图像 (w,h,3)，RGBA\
