    \ *Cookie Manager*. However, this doesn’t mean all other Streamlit-compatible\
    \ libraries share the same\n\nbehavior, as they can contain a visual aspect to\
    \ them.\n\nChapter 7 ImplementIng SeSSIon State\n\n**7.6 Summary**\n\nIn this\
    \ chapter, we were introduced to storing and accessing session states\n\nwith\
    \ Streamlit natively. The use of session state can be essential in many\n\ncases\
    \ and will be utilized extensively to develop advanced applications in\n\nsubsequent\
    \ chapters. In addition, the reader was acquainted with session\n\nIDs that are\
    \ unique identifiers associated with every new instance of a\n\nStreamlit application\
    \ and shown how they can be used to store session\n\nstate in a persistent manner\
    \ on a PostgreSQL database and also how they\n\ncan be utilized to record and\
    \ visualize user insights. Finally, the reader was\n\nshown how to store and retrieve\
    \ cookies on a browser, which is required\n\nto store session state across multiple\
    \ sessions of a Streamlit application on\n\nthe same browser. This is necessary\
    \ for instances such as when the user\n\nwants to automatically log in without\
    \ re-entring their credentials .\n\n**CHAPTER 8**\n\n**Authentication**\n\n**and\
    \ Application**\n\n**Security**\n\nAfter acquainting ourselves with the necessary\
    \ building blocks of a\n\nwell-structured Streamlit web application, we require\
    \ an additional\n\nfeature to deploy a production-ready application, namely, a\
    \ secure\n\nuser authentication service. Once all users requesting access to the\n\
    \napplication are authenticated, we can guarantee a secure user experience\n\n\
    whereby private data is safe and any unwelcome or malicious requests\n\nare formidably\
    \ denied. In this chapter, we will learn how to establish\n\nuser accounts, verify\
    \ user actions, and implement other housekeeping\n\nmeasures that are expected\
    \ of any well-versed software engineer.\n\n**8.1 Developing User Accounts**\n\n\
    In this chapter, we will build on the example from Chapter[s 5 and](https://doi.org/10.1007/978-1-4842-8111-6_5)\
    \ [6, b](https://doi.org/10.1007/978-1-4842-8111-6_6)y introducing HR admins who\
    \ get to see and add employees and their pay\n\ngrades. Assume there are admins\
    \ responsible to do those actions, and\n\nthe company keeps changing and assigning\
    \ new admins. In this case,\n\nwe need our application to support making more\
    \ admin accounts and\n\nauthorize them.\n\n© Mohammad Khorasani, Mohamed Abdou,\
    \ Javier Hernández Fernández 2022\n\nM. Khorasani et al., *Web Application Development\
    \ with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6_8](https://doi.org/10.1007/978-1-4842-8111-6_8#DOI)\n\
    \n![](index-226_1.jpg)\n\nChapter 8 authentiCation and appliCation SeCurity\n\n\
    Now those actions need authorized people to execute them, so we\n\nmainly need\
    \ three main additions: adding an admin table in our database,\n\nallowing admin\
    \ account creations, and authorizing users with admin\n\naccounts to use the rest\
    \ of the service.\n\n**8.1.1 Hashing**\n\nTo add a new table to the database,\
    \ we will need to follow a step similar to\n\nwhat was done previously and as\
    \ shown in Figure [8-1](#index_split_001.html#p226). Notice that we are storing\
    \ mainly two pieces of information per admin, username\n\nand password hash. The\
    \ hash or a nonguessable representation of the\n\npassword is stored instead of\
    \ the password itself. By doing this, we are\n\nprotecting our users’ privacy\
    \ and credentials in case of a data breach. As if\n\nthis happens, the attacker\
    \ will have to spend billions of years to brute-force\n\nall hashes to find a\
    \ single user’s actual password. So what hashing mainly\n\ndoes is a one-way transformation\
    \ of data that is not reversible.\n\n***Figure 8-1.** Creating a new table to\
    \ store admin credentials, using the* *contents of Flask/create_admins_table.sql*\n\
    \nChapter 8 authentiCation and appliCation SeCurity\n\nAfter creating the new\
    \ table, we will need to create a corresponding\n\nPython class to make an ORM\
    \ for SQLAlchemy as shown in Listin[g 8-1](#index_split_001.html#p228).\n\nHashing\
    \ a password can be done in multiple ways, a few of which can\n\nbe MD5, SHA256,\
    \ SHA512, and others. However, the most commonly\n\nused algorithm by modern systems\
    \ is Bcrypt. Infact Bcrypt is used\n\nby default to protect users’ passwords in\
    \ Linux environments. Before\n\nexplaining how Bcrypt works, we first need to\
    \ know what methods are\n\nused to make a hash more secure.\n\nAs mentioned before,\
    \ hashing transforms data. So, for instance,\n\nthe text\n\nPassword123\n\nmaps\
    \ to\n\n42f749ade7f9e195bf475f37a44cafcb\n\nusing MD5\\. However, a slight modification\
    \ to the original plain text\n\nwould make a bigger difference in the hashed output\
    \ as such:\n\nMD5(Password1239) -> abd7fdbb048a611ea0a0937265765404\n\n**8.1.2\
    \ Salting**\n\nIncluding extra bytes in the password, also known as adding a salt,\
    \ gives\n\na totally different hash. This helps in password reusability cases\
    \ by users\n\nacross different websites, and one has been breached. By doing so,\n\
    \nattackers won’t know whether the same user uses the same password\n\namong multiple\
    \ domains. And it will give them a harder time to break\n\nthe hash. However,\
    \ this trick will not be useful if the attacker knows\n\nthe hashing salt and\
    \ how it is applied. Hence, Bcrypt falls under the\n\nspotlight by introducing\
    \ a cryptographic way to store randomly generated\n\nsalts within the hash. This\
    \ makes it possible to check if a Bcrypt hash is\n\ngenerated from a plain text,\
    \ using an abstracted Bcrypt library’s function,\n\nas shown in Listin[g 8-2.](#index_split_001.html#p228)\n\
    \nChapter 8 authentiCation and appliCation SeCurity\n\n***Listing 8-1.*** Flask/DataBase/Models/Admins.py\n\
    \n**from** sqlalchemy **import** Column, Integer, String\n\n**from** .Base **import**\
    \ Base\n\n**class** Admins(Base):\n\n__tablename__ = 'admins'\n\n**id** = Column(Integer,\
    \ primary_key=True)\n\nusername = Column(String)\n\npassword_hash = Column(String,\
    \ default=True)\n\n**def** to_dict(self):\n\n**return** {\n\n\"id\": self. **id**,\n\
    \n\"username\": self.username,\n\n\"password_hash\": self.password_hash\n\n}\n\
    \n***Listing 8-2.*** Flask/DataBase/Services/HashingService.py\n\n**import** bcrypt\n\
    \n**class** HashingService:\n\n**def** __init__(self, bcrypt_gen_salt: **int**\
    \ = 12):\n\nself.gen_salt = bcrypt_gen_salt\n\n**def** hash_bcrypt(self, plain_text:\
    \ bytes) -> bytes:\n\n**return** bcrypt.hashpw(plain_text, bcrypt.gensalt(self.\n\
    \ngen_salt))\n\n**def** check_bcrypt(self, plain_text: bytes, hashed_password:\n\
    \nbytes) -> **bool**:\n\nChapter 8 authentiCation and appliCation SeCurity\n\n\
    **try:**\n\n**return** bcrypt.checkpw(plain_text, hashed_password)\n\n**except:**\n\
    \n**return** False\n\n**8.2 Verifying User Credentials**\n\nNow after we have\
    \ the needed service and storage support to manage\n\npasswords, we can proceed\
    \ with the backend refactoring to support\n\nauthentication for every route. This\
    \ means we need to intercept every\n\nrequest to the server and decide whether\
    \ it is authenticated or not. In other\n\nwords, we need to have an independent\
    \ piece of software to sit between\n\nthe client’s request and the access controller;\
    \ this is usually referred to as\n\n*middleware* among backend developers. The\
    \ authentication process has to\n\nbe checking for a specific identifier of the\
    \ request that the server can trust; such identifier is referred to as “authentication\
    \ token,” or “token” for short.\n\nThis token shall be issued by the server, and\
    \ it shall be verified.\n\nTokens are mainly either of the two: custom session\
    \ IDs or JWTs. For\n\nthis example, we will proceed with JWTs as it doesn’t require\
    \ the server to\n\nstore it, which makes it stateless. JWTs consist of three main\
    \ parts encoded\n\nin base64 and separated by a period. The first part contains\
    \ information\n\nabout the payload signing mechanism, the second holds the raw\
    \ payload,\n\nand lastly the third contains a password-protected signature of\
    \ the payload\n\nusing the same hashing mechanisms in the first part. This can\
    \ be seen in\n\nmore detail in Figur[e 8-2 fr](#index_split_001.html#p230)om [*jwt.io*.](https://jwt.io)\n\
    \n![](index-230_1.jpg)\n\nChapter 8 authentiCation and appliCation SeCurity\n\n\
    ***Figure 8-2.** JSON Web Token (JWT) content*\n\nSo on a new request, we will\
    \ check the headers for a token. The token’s\n\npayload will be signed, and the\
    \ signature will be compared against the\n\npassed token’s signature; if they\
    \ match, we have confirmed that the token\n\nis issued by the server. And for\
    \ more security purposes, to avoid attackers\n\nstealing other people’s legit\
    \ tokens, we shall have an expiration date *(30*\n\n*days from issuing by default)*,\
    \ which will require the user to log in again upon expiration. Since this will\
    \ contain many logic parts, it is best to isolate it as a whole service to manage\
