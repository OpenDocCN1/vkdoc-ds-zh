- fmt: "# Streamlit Session State\n\nStreamlit’s session state dictionary is composed\
    \ of key-value pairs where each key must be initialized before it can be invoked,\
    \ and each value can consist of a string, integer, list, dictionary, dataframe,\
    \ object, or other variables. To initialize a variable into your session state,\
    \ proceed as follows:\n\n```\nif 'state_1' not in st.session_state:\n    st.session_state['state_1']\
    \ = None\n```\n\n## Accessing Session State Variables\n\nSubsequently, to access\
    \ the variable initialized within the same session, simply invoke it as follows:\n\
    \n```\nstate_1 = st.session_state['state_1']\n```\n\nTo access all of the session\
    \ state variables, use the following command:\n\n```\nst.write(st.session_state)\n\
    ```\n\n![](index-479_1.jpg)\n\nAPPenDiX A STReAMLiT APPLiCATion PRoGRAM inTeRfACe\n\
    \nThis will return the session state dictionary with all of the key-value pairs\
    \ stored as follows:\n\n## Updating Session State Variables\n\nTo update the value\
    \ of the session state variable, proceed as follows:\n\n```\nst.session_state['state_1']\
    \ = 'Hello world'\n```\n\n## Deleting Session State Variables\n\nTo delete a specific\
    \ session state variable, use the following:\n\n```\ndel st.session_state['state_1']\n\
    ```\n\nIn order to delete all of the session state variables at once, you may\
    \ use the following:\n\n```\nfor variable in st.session_state:\n    del st.session_state[variable]\n\
    ```\n\n## Widget Session State\n\nEach widget in Streamlit is automatically associated\
    \ with its own session state variable, where the key is the same key that is invoked\
    \ as an argument to the widget, as shown in the following:\n\n```\nst.button('Random\
    \ button', key='random_button_1')\nst.text_input('Hello world', key='hello_world_input')\n\
    st.write(st.session_state)\n```\n\n![](index-480_1.jpg)\n\nAPPenDiX A STReAMLiT\
    \ APPLiCATion PRoGRAM inTeRfACe\n\nPlease note that modifying the value of a widget’s\
    \ session state after instantiating it is not permitted, and should you attempt\
    \ to do so, a `StreamlitAPIException` error will be thrown. However, setting the\
    \ state of a widget before it is instantiated is permitted, albeit with a one-time\
    \ warning message if the default value of the widget has already been set as an\
    \ argument.\n\nIn addition, widgets with buttons such as `st.button`, `st.download_button`,\
    \ and `st.file_uploader` cannot have their session state values modified; by default,\
    \ they are set to `False` and will be toggled to `True` when they are clicked.\n\
    \n## A.1.10 Data Management\n\nManaging data for optimal use of computing resources\
    \ is of utmost importance for web servers. Given the large scale of data that\
    \ we are exposed to, it is often essential to cache data, functions, and other\
    \ objects for prompt reuse when the need arises. To that end, Streamlit offers\
    \ an in-house capability to cache and reuse data in our applications with tangibly\
    \ positive outcomes. Furthermore, Streamlit also offers the ability to mutate\
    \ data natively without any third-party libraries should the need arise.\n\n###\
    \ Caching Data\n\nStreamlit allows you to cache the results and data of a function\
    \ persistently for later use with the `st.cache(func, persist, allow_output_mutation,\
    \ show_spinner, suppress_st_warning, hash_funcs, max_entries, ttl)` command. This\
    \ feature is particularly useful if you are working with large datasets that will\
    \ take an extended period of time to download or process. With this feature, you\
    \ can enter your data into the cache by invoking the function written below the\
    \ `st.cache` decorator and then recall it on demand when needed without having\
    \ to reexecute the function, even after your script has been rerun.\n\n**Table\
    \ A-51.** `st.cache` parameters\n\n| Parameter | Description |\n|-----------|-------------|\n\
    | `func` (`callable`) | The function to be cached. |\n| `persist` (`boolean`)\
    \ | This parameter specifies whether to keep the cached data persistently or not.\
    \ |\n| `allow_output_mutation` (`boolean`) | Setting the parameter to `True` will\
    \ allow you to override the cached data without receiving a warning from Streamlit.\
    \ |\n| `show_spinner` (`boolean`) | If set to `True`, a spinner will be displayed\
    \ when there is a cache miss. |\n| `suppress_st_warning` (`boolean`) | Setting\
    \ this parameter to `True` will suppress any |"
