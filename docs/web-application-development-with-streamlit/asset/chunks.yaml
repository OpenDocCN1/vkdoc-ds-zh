    structured backend to serve data from a local database by exposing\n\nspecific\
    \ endpoints. And to top it off, we showcased ways to speed up\n\nPython code execution\
    \ whether in Streamlit or the backend server,\n\nby leveraging multiprocessing\
    \ and multithreading with a comparison\n\nbetween each one’s performance and use\
    \ cases.\n\n**CHAPTER 7**\n\n**Implementing Session**\n\n**State**\n\nIn order\
    \ to develop more advanced Streamlit applications, it is vital to\n\nestablish\
    \ session-specific data that can be utilized to deliver a more\n\nenhanced experience\
    \ to the user. Specifically, the application will need\n\nto preserve the user’s\
    \ data and entries using what is referred to as session\n\nstates. These states\
    \ can be set and accessed on demand whenever\n\nnecessary, and they will persist\
    \ whenever the user triggers a rerun of the\n\nStreamlit application or navigates\
    \ from one page to another. In addition,\n\nwe will establish the means to store\
    \ state across multiple sessions with\n\nthe use of cookies that can store data\
    \ on the user’s browser to be accessed\n\nwhen they restart the associated Streamlit\
    \ application. Finally, we will\n\nlearn how to record and visualize rich insights\
    \ of how users are interacting\n\nwith our application, to provide analytics to\
    \ both the developer and\n\nproduct owner alike.\n\n**7.1 Implementing Session\
    \ State Natively**\n\nSince Streamlit version 0.84.1, a native way to store and\
    \ manage session-\n\nspecific data including but not limited to variables, widgets,\
    \ text, images,\n\nand objects has been introduced. The values of session states\
    \ are stored\n\nin a dictionary format, where every value is assigned to a unique\
    \ key to be\n\n© Mohammad Khorasani, Mohamed Abdou, Javier Hernández Fernández\
    \ 2022\n\nM. Khorasani et al., *Web Application Development with Streamlit*,\n\
    \n[https://doi.org/10.1007/978-1-4842-8111-6_7](https://doi.org/10.1007/978-1-4842-8111-6_7#DOI)\n\
    \nChapter 7 ImplementIng SeSSIon State\n\nindexed with. Previously without this\
    \ feature, all variables would be reset\n\nwhenever the user triggered Streamlit\
    \ to rerun the script by interacting\n\nwith the application. Similarly, widgets\
    \ would also be reset to their default\n\nvalue when the user navigated from one\
    \ page to another. However, with\n\nsession state, users can receive an enhanced\
    \ and more personalized\n\nexperience by being able to access variables or entries\
    \ that were made\n\npreviously on other pages within the application. For instance,\
    \ users can\n\nenter their username and password once and continue to navigate\
    \ through\n\nthe application without being prompted to reenter their credentials\n\
    \nagain until they log out. In a nutshell, session states enable us to develop\n\
    \nfar more complex applications which will be discussed extensively in\n\nsubsequent\
    \ chapters.\n\nThe way to set and get session state data can be implemented as\
    \ shown\n\nin Listing [7-1](#index_split_001.html#p202) with the associated output\
    \ in Figure [7-1](#index_split_001.html#p203). Please note that the first two\
    \ key-value entries ( *KeyInput1* and *KeyInput2*) are present even though they\
    \ haven’t been created by the user. Those keys are present to\n\nstore the state\
    \ of the user-modified components, which are the defined text\n\ninput components.\
    \ This means that the developer also has the capability\n\nof modifying the values\
    \ of any component as long as it has a unique key\n\nset with its definition.\
    \ Another caveat is that each session state must be\n\ninvoked before it can be\
    \ read; otherwise, you will be presented with an\n\nerror. To avoid this, ensure\
    \ that you always initialize the state with a null or fault value.\n\n***Listing\
