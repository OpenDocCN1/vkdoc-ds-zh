    \nfont = 'sans serif'\n\n**Using Themes with Custom Components**\n\nIf you are\
    \ developing your own custom Streamlit components, it may be\n\nnecessary to pass\
    \ the application’s theme settings to your component.\n\nPlease ensure that you\
    \ have installed the latest version of *streamlit-*\n\n*component- lib* by using\
    \ the following command:\n\nnpm install streamlit-component-lib\n\nChapter 3 arChiteCting\
    \ the User interfaCe\n\nThis package will automatically update the colors of your\
    \ custom\n\ncomponent to reflect the theme settings of your Streamlit application.\
    \ In\n\naddition, it will allow you to read the theme settings in your JavaScript\n\
    \nand/or CSS script as shown in the following.\n\nAs CSS variables, the object\
    \ settings can be exposed as follows:\n\n--primary-color\n\n--background-color\n\
    \n--secondary-background-color\n\n--text-color\n\n--font\n\nAccordingly, these\
    \ settings can be accessed as follows:\n\n.mySelector {\n\ncolor: var(--primary-color);\n\
    \n}\n\nAlternatively, you may choose to expose the object settings as a ReactJS\n\
    \nprop, which may be accessed as follows:\n\n{\n\n\"primaryColor\": \"\"\n\n\"\
    backgroundColor\": \"\",\n\n\"secondaryBackgroundColor\": \"\",\n\n\"textColor\"\
    : \"\",\n\n\"font\": \"\",\n\n}\n\n**3.1.3 Organizing the Page**\n\nStreamlit\
    \ provides several methods to organize and customize the\n\nfrontend design of\
    \ an application. Namely, as a developer you have the\n\nability to enable a sidebar,\
    \ divide the web page into columns, display\n\nChapter 3 arChiteCting the User\
    \ interfaCe\n\nexpander boxes to hide content, and create containers to bundle\
    \ several\n\nwidgets together. Combined with one another, these features allow\
    \ you to\n\ncustomize your application to a tangibly high degree and offer a tailored\n\
    \nexperience to your users.\n\n**Sidebar**\n\nWith Streamlit, you have the ability\
    \ of subdividing your page with an\n\nelegant sidebar that can be expanded and\
    \ contracted on demand with\n\nthe *st.sidebar* command. In addition, as shown\
    \ in Section 3.1, you\n\nmay configure Streamlit to keep the sidebar expanded,\
    \ contracted, or\n\nautomatically adjusted at the start based on the screen size.\
    \ Practically,\n\nevery Streamlit element and widget with the exception of *st.echo*\
    \ and *st.*\n\n*spinner* can be invoked within the sidebar. You may even render\
    \ other\n\nfeatures related to page organization such as *st.columns*, *st.expander*,\
    \ and *st.container* within the sidebar as shown in Listing [3-5](#index_split_000.html#p107)\
    \ and Figur[e 3-8.](#index_split_000.html#p110)\n\n**Expanders**\n\nWith Streamlit,\
    \ you have the ability to collapse content into expanders,\n\nshould you wish\
    \ to make more efficient use of the space on the main body\n\nor sidebar of your\
    \ application. Expanders can be expanded and contracted\n\non demand or can be\
    \ set to either state at the start. In addition, expanders\n\ncan contain any\
    \ element including columns and containers but not nested\n\nexpanders. An example\
    \ of using expanders is shown in Listin[g 3-5 and](#index_split_000.html#p107)\n\
    \nFigur[e 3-8.](#index_split_000.html#p110)\n\n**Columns**\n\nSimilarly, you can\
    \ divide the main body and sidebar with Streamlit’s\n\ncolumns feature that can\
    \ be called with the *st.columns* command. You\n\nmay specify the number of columns\
    \ you require by writing *st.columns(2)*, or alternatively you may use a list\
    \ to set the number and width of each\n\nChapter 3 arChiteCting the User interfaCe\n\
    \ncolumn arbitrarily by writing *st.columns([2,1])*. Columns can be invoked within\
    \ a *with* statement and can be used concurrently with expanders\n\nand containers;\
    \ however, they may not be nested within one another. An\n\nexample of using columns\
    \ is shown in Listing [3-5](#index_split_000.html#p107) and Figur[e 3-8.](#index_split_000.html#p110)\n\
    \n**Containers**\n\nShould you require to bundle several widgets or elements together,\n\
    \nyou can do so with Streamlit’s container feature that can be called with\n\n\
    the *st.container* command in the main body or sidebar. Containers can\n\nbe invoked\
    \ within a *with* statement and can be used with columns,\n\nexpanders, and even\
    \ nested containers. They can also be altered out of\n\norder, for instance, if\
    \ you display some text out of the container and then\n\ndisplay some more text\
    \ within the container, the latter will be displayed\n\nfirst. An example of using\
    \ containers is shown in Listing [3-5 and F](#index_split_000.html#p107)igure\
    \ [3-8](#index_split_000.html#p110).\n\n***Listing 3-5.*** page_[organization.py](http://organization.py)\n\
    \n**import** streamlit as st\n\n**from** datetime **import** datetime\n\n*#Expander\
