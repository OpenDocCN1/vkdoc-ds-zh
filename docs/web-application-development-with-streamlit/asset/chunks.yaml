    \nwhen using the Cookie Manager. Figur[e 10-14](#index_split_002.html#p322) shows\
    \ a demo of this custom component.\n\n***Listing 10-20.*** CookieManager/frontend/src/CookieManager.tsx\n\
    \n**import** {\n\nStreamlit,\n\nComponentProps,\n\nwithStreamlitConnection,\n\n\
