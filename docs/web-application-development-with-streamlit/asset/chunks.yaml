    \ tCp 22\n\nSmtp: tCp 25\n\nldap(s): tCp 389/636\n\n**1.2.2 Environment Installation\
    \ with Anaconda**\n\nIn order to create a web application run on a local Streamlit\
    \ server for\n\nprototyping and testing, we first need to install and create a\
    \ Python\n\nruntime environment with all the dependencies required for our server.\
    \ In\n\nthis regard, we will be making use of Anaconda which is one of the most\n\
    \nwidely used and supported Python distributions available. First, proceed\n\n\
    with downloading and installing a compatible version of Anaconda. Once\n\nthe\
    \ installation has been successfully completed, you may then create a\n\nvirtual\
    \ environment that will be used to download and install the packages\n\nnecessary\
    \ to run your web application.\n\n**Programmatic Installation**\n\nTo create an\
    \ Anaconda environment through the console, please follow\n\nthese steps:\n\n\
    1\\. To create and install your environment\n\nprogrammatically, enter the following\
    \ commands in\n\nAnaconda Prompt sequentially:\n\nconda create -n <environment\
    \ name>\n\npython=<version number>\n\nWhen conda asks you to proceed, select *y*.\n\
    \nproceed ([y]/n)?\n\nChapter 1 GettinG Started with Streamlit\n\nSubsequently,\
    \ the new environment will be created\n\nin the environments folder within the\
    \ root directory\n\nof Anaconda as *C:/ProgramData/Anaconda3/envs/*.\n\n2\\. Activate\
    \ your environment by typing the following:\n\nconda activate <environment name>\n\
    \n3\\. If you have a list of dependencies, *dependencies.*\n\n*yml*, place it\
    \ in your newly created environment’s\n\ndirectory: C:/ProgramData/Anaconda3/envs/\n\
    \nenvironment name/\n\n4\\. Change your root directory to your environment’s\n\
    \ndirectory by typing the following:\n\ncd C:/ProgramData/Anaconda3/envs/<environment\
    \ name>/\n\n5\\. Ensure that the first line in the *dependencies.yml* is\n\nwritten\
    \ correctly as the name of your environment,\n\n*name: environment name*; otherwise,\
    \ the\n\nenvironment may not be installed.\n\n6\\. Update your environment by\
    \ installing all the\n\ndependencies listed in the file *dependencies.yml* by\n\
    \ntyping the following:\n\nconda env update -f dependencies.yml\n\n7\\. If prompted\
    \ by Anaconda, proceed with updating\n\nyour version of conda by typing the following:\n\
    \nconda update -n base -c defaults conda\n\n8\\. To check the list of environments,\
    \ type the following:\n\nconda info -envs\n\nChapter 1 GettinG Started with Streamlit\n\
    \n9\\. To check the list of dependencies in your\n\nenvironment, type the following:\n\
    \nconda **list**\n\n10\\. To install additional dependencies that may be\n\nrequired\
    \ later, please type the following:\n\nconda install <dependency name>\n\n11\\\
    . Some dependencies may not be available for\n\ndownload via *conda install*;\
