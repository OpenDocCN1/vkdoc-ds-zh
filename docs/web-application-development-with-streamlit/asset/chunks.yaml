    \ 1), columns=['Col1'])\nfig = px.line_polar(df, r=df['Col1'], theta=df.index,\
    \ line_close=True)\nst.plotly_chart(fig)\n```\n\n![](index-429_1.jpg)\n\n# Appendix\
    \ A Streamlit Application Program Interface\n\n## Bokeh\n\nA Bokeh chart can be\
    \ displayed using the command `st.bokeh_chart(figure, use_container_width)`.\n\
    \n### Table A-17. `st.bokeh_chart` parameters\n\n| Parameter | Description |\n\
    |-----------|-------------|\n| `figure` ( `bokeh.plotting.figure.Figure` ) | The\
    \ Bokeh figure object to be rendered. |\n| `use_container_width` ( `bool` ) |\
    \ If this argument is set to `True`, the chart width will be set to the column\
    \ width. |\n\nThe following example shows how to display a Bokeh line chart in\
    \ Streamlit:\n\n```python\nimport pandas as pd\nimport numpy as np\nfrom bokeh.plotting\
    \ import figure\n\ndf = pd.DataFrame(np.random.randn(10, 1), columns=['Col1'])\n\
    fig = figure(x_axis_label='Index', y_axis_label='Col1')\nfig.line(df.index, df['Col1'],\
    \ legend_label='Trend', line_width=2)\nst.bokeh_chart(fig)\n```\n\n![](index-430_1.jpg)\n\
    \n## PyDeck\n\nA PyDeck geospatial map can be displayed using the command `st.pydeck_chart(pydeck_obj,\
    \ use_container_width)`.\n\n### Table A-18. `st.pydeck_chart` parameters\n\n|\
    \ Parameter | Description |\n|-----------|-------------|\n| `spec` ( `pydeck.Deck`\
    \ or `None` ) | The PyDeck figure object to be rendered. |\n\nThe following example\
    \ shows how to display a PyDeck geospatial map in Streamlit:\n\n```python\nimport\
    \ pandas as pd\nimport numpy as np\nimport pydeck as pdk\n\ndf = pd.DataFrame(\n\
    \    np.random.randn(100, 2)/[50, 50] + [29.76, -95.37],\n    columns=['latitude',\
    \ 'longitude']\n)\n\nst.pydeck_chart(pdk.Deck(\n    map_style='mapbox://styles/mapbox/light-v9',\n\
    \    initial_view_state=pdk.ViewState(\n        latitude=29.76,\n        longitude=-95.37,\n\
    \        zoom=12,\n        pitch=40,\n    ),\n    layers=[\n        pdk.Layer(\n\
    \            'HexagonLayer',\n            data=df,\n            get_position='[longitude,\
    \ latitude]',\n            radius=200,\n            elevation_scale=2,\n     \
    \       elevation_range=[0, 500],\n            pickable=True,\n            extruded=True,\n\
    \        ),\n    ],\n))\n```\n\n![](index-432_1.jpg)\n\n## Graphviz\n\nA Graphviz\
    \ chart can be rendered using the command `st.graphviz_chart(figure_or_dot, use_container_width)`.\n\
    \n### Table A-19. `st.graphviz_chart` parameters\n\n| Parameter | Description\
    \ |\n|-----------|-------------|\n| `figure_or_dot` ( `graphviz.dot.Graph`, `graphviz.dot.Digraph`,\
    \ `str` ) | The Graphviz figure object to be rendered. |\n| `use_container_width`\
    \ ( `bool` ) | If this argument is set to `True`, the chart width will be set\
    \ to the column width. |\n\n![](index-433_1.png)\n\nThe following example shows\
    \ how to display a Graphviz graph in Streamlit:\n\n```python\nimport graphviz\
    \ as graphviz\n\nst.graphviz_chart(\"\"\"\ndigraph {\n    A -> {B C} [style=dotted,\
    \ shape=box]\n    B -> C\n    D -> F\n    F -> E\n    E -> A\n    B -> D\n   \
    \ subgraph {\n        rank = same; A; B; C [shape=box];\n        A -> E [color=blue,\
    \ style=dotted]\n    }\n}\n\"\"\")\n```\n\n## Maps\n\nA Streamlit geospatial map\
    \ can be displayed using the command `st.map(data, zoom, use_container_width)`.\n\
    \n### Table A-20. `st.map` parameters\n\n| Parameter | Description |\n|-----------|-------------|\n\
    | `data` ( `pandas.DataFrame`, `pandas.Styler`, `numpy.ndarray`, `Iterable`, `dict`\
    \ ) | The `latitude` and `longitude` of the points to be rendered on the map.\
    \ |\n| `zoom` ( `int` ) | The level of zoom when the map is first rendered. For\
    \ further information, please refer to [https://wiki.openstreetmap.org/wiki/Zoom_levels](https://wiki.openstreetmap.org/wiki/Zoom_levels).\
    \ |\n\nThe following example shows how to display a geospatial map in Streamlit:\n\
    \n```python\nimport pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame(\n \
    \   np.random.randn(100, 2)/[50, 50] + [29.76, -95.37],\n    columns=['latitude',\
    \ 'longitude']\n)\n\nst.map(df)\n```"
