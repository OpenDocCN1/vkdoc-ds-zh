    \ 3-14.** Multipage Streamlit application with subpages*\n\n**3.4 Modularizing\
    \ Application Development**\n\nIn almost every web project, there is a need for\
    \ visual components and\n\ncode parts that manages the overall experience which\
    \ is not directly seen\n\nby the end user, rather experienced. This is what is\
    \ usually referred to as\n\nthe business logic of the application that is responsible\
    \ for controlling and\n\nmanaging intermodule communication, specifically whenever\
    \ there is a\n\nreaction to be made upon user action, or to initiate an action\
    \ by the user\n\nsuch as prompting the user to sign in .\n\n![](index-119_1.png)\n\
    \nChapter 3 arChiteCting the User interfaCe\n\n**3.4.1 Example: Developing a Social**\n\
    \n**Network Application**\n\nFor instance, a simple social network application\
    \ such as the one shown\n\nin Figure [3-15](#index_split_000.html#p119) will need\
    \ components to make a post and to read fields.\n\nThese two seemingly simple\
    \ requirements can be broken down into three\n\nmain parts: views, action handling\
    \ services, database connection or API\n\n(application programming interface)\
    \ client of another backend service.\n\nFor that example, everything will be post-centric,\
    \ which means this should\n\nbe a reusable, shared resource. A basic application\
    \ as such shall have an\n\narchitecture similar to Figur[e 3-16](#index_split_000.html#p120).\n\
    \n***Figure 3-15.** Demo social network app*\n\n![](index-120_1.png)\n\nChapter\
    \ 3 arChiteCting the User interfaCe\n\n***Figure 3-16.** Basic social network\
    \ Streamlit architecture*\n\nTo build the mentioned project, a bottom-top approach\
    \ shall be\n\nfollowed by starting with the most dependent object of the whole\
    \ design,\n\nwhich is the Post class, and topping it with the user-visible views.\
    \ The\n\npost shall be a class as shown in Listin[g 3-14](#index_split_000.html#p120)\
    \ because it encapsulates related data in one form; in Python, we can use the\
    \ *dataclasses* decorator to denote this is just a class to hold data, and we\
    \ can give it a default\n\ninitialization function to fill in values for the declared\
    \ variable. This can be seen as the Pythonic alternative for C#’s DTOs (data transfer\
    \ objects).\n\n***Listing 3-14.*** Models/Post.py\n\n**from** dataclasses **import**\
    \ dataclass\n\n**import** datetime\n\n@dataclass(init=True)\n\n**class** Post:\n\
    \ncreator_name: **str**\n\ncontent: **str**\n\nposting_date: datetime.datetime\n\
    \nChapter 3 arChiteCting the User interfaCe\n\n***Listing 3-15.*** Models/__init__.py\n\
    \n**from** .Post **import** Post\n\nFollowing that, there has to be a data source\
    \ access mechanism with\n\nits only job being to store and write new posts, whether\
    \ directly on a\n\ndatabase or with an external service which can be communicated\
    \ with\n\nHTTP methods or a messaging service, that is, Kafka, RabbitMQ, or AWS’s\n\
    \nSQS. For this example, we will assume a backend service is already built\n\n\
    with two exposed methods, one to add posts and the other to get posts\n\nbetween\
    \ two timestamps, as shown in Listin[g 3-16](#index_split_000.html#p121).\n\n\
    ***Listing 3-16.*** [API.py](http://API.py)\n\n**from** Models **import** Post\n\
    \n**import** datetime\n\n**class** API:\n\n**def** __init__(self, config=None):\n\
    \nself.config = config\n\n**def** add_post(self, post: Post):\n\n*# POST HTTP\
    \ request to backend to add the post*\n\n*# Returns true as in post has been added*\n\
    \n**return** True\n\n**def** get_posts(self, start_date: datetime.datetime,\n\n\
    end_data: datetime.datetime):\n\n*# GET HTTP request to backend to posts within\
    \ a*\n\n*time period*\n\n*# Returns a list of Posts*\n\n**return** [\n\nPost(\n\
    \n\"Adam\", \"Python is a snake\",\n\ndatetime.datetime(year=2021, month=5, day=1)\n\
    \n),\n\nChapter 3 arChiteCting the User interfaCe\n\nPost(\n\n\"Sara\", \"Python\
    \ is a programming language\",\n\ndatetime.datetime(year=2021, month=5, day=3)\n\
    \n)]\n\nOnce we have our API ready, we can start building an internal service\n\
    \nto act the middleware between the visual components and the API, usually\n\n\
    referred to as “Services” among seasoned developers.\n\n***Listing 3-17.*** Ser[vices/AddPost.py](http://addpost.py)\n\
    \n**from** API **import** api_instance\n\n**from** Models **import** Post\n\n\
    **def** add_post(post: Post):\n\n**if** post **is** None **or len**(post.creator_name)\
    \ == 0\n\n**or len**(post.content) == 0:\n\n**return** None\n\ndid_add = api_instance.add_post(post)\n\
    \n**return** did_add\n\n***Listing 3-18.*** Ser[vices/GetFeed.py](http://GetFeed.py)\n\
    \n**from** API **import** api_instance\n\n**import** datetime\n\n**def** get_feed():\n\
    \nto_date = datetime.datetime.now()\n\nfrom_date = to_date - datetime.timedelta(days=1)\n\
    \nposts = api_instance.get_posts(from_date, to_date)\n\n**return** posts\n\nChapter\
    \ 3 arChiteCting the User interfaCe\n\n***Listing 3-19.*** Services/__init__.py\n\
    \n**from** .AddPost **import** add_post\n\n**from** .GetFeed **import** get_feed\n\
    \nEven though the application is not considered complete due to missing\n\nthe\
    \ mostly awaited components that convert it to an interactive web\n\napplication\
    \ by users, it can still be used as a stand-alone service by any\n\nsoftware as\
    \ it is structured end to end to serve a clear purpose of adding\n\nand getting\
    \ posts with filtering applied on passing data. Wrapping it up,\n\nwe will insert\
