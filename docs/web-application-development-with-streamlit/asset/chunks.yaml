    \nas driver:\n\nurl = \"http://127.0.0.1:8501\"\n\ndriver.get(url)\n\ntime.sleep(5)\n\
    \nhtml = driver.page_source\n\n![](index-48_1.jpg)\n\nChapter 1 GettinG Started\
    \ with Streamlit\n\nassert \"Add numbers\" **in** html\n\nassert \"First Number\"\
    \ **in** html\n\nassert \"Second Number\" **in** html\n\n**def** test_logic():\n\
    \nassert calculate_sum(1, 1) == 2\n\nassert calculate_sum(1, -1) == 0\n\nassert\
    \ calculate_sum(1, 9) == 10\n\n**if** __name__ == \"__main__\":\n\ntest_logic()\n\
    \ntest_user_interface()\n\n***Figure 1-12.** Output of Listing [1-1](#index_split_000.html#p47)*\n\
    \nTo test rendering, we first need the application to be running, so it\n\ncan\
    \ be accessed by selenium’s driver, which is Chrome in this example.\n\nTo automate\
    \ launching the application before running the tests, we might\n\nneed to use\
    \ an advanced IDE. PyCharm can do the required job for us.\n\nChapter 1 GettinG\
    \ Started with Streamlit\n\nFirst, we need to set up a running configuration to\
    \ run Streamlit on a\n\nbutton click as seen in Figure [1-13\\. N](#index_split_000.html#p50)ow\
    \ as we have a configuration used to run Streamlit, we can use it as a prerun\
    \ command in another configuration\n\nwhich shall be used for running the unit\
    \ tests (Figur[e 1-14](#index_split_000.html#p52)).\n\n**1.3 How Streamlit Works**\n\
    \nUnlike other web frameworks which send static files to the browser,\n\nStreamlit\
    \ modifies the real DOM and its state to render the final web\n\ndocument from\
    \ the server side. There shall be no security concerns under\n\nnormal user behavior.\
    \ Like PHP, this can be RCE (Remote Code Execution)\n\nsusceptible, if it was\
    \ poorly coded, where user input is not sanitized where\n\nit can be used to execute\
    \ OS-level code.\n\nHaving a Streamlit web application starts from executing the\
    \ binary,\n\nwhether *streamlit.exe* on Windows or *stream-lit.sh* on MacOS or\
    \ Linux, against the target document using the default Python interpreter. This\
    \ will\n\ninitialize the application configuration such as secrets, settings,\
    \ themes,\n\nand, most importantly, the Delta Generator (DG for short) which acts\
    \ as\n\nthe middleman between the Python script and the ReactJS web application\n\
    \nserved by Streamlit.\n\n![](index-50_1.jpg)\n\nChapter 1 GettinG Started with\
    \ Streamlit\n\n***Figure 1-13.** Making a shell command to run once the current*\n\
    \n*configuration is chosen and ran*\n\n**1.3.1 The Streamlit Architecture**\n\n\
    The DG takes care of efficiently transferring HTML components to be\n\nrendered\
    \ on the client side and retrieving back their state. The initial\n\nrender starts\
    \ from the beginning of the Python document and ends at\n\nthe last line. The\
    \ next render does not start from the beginning of the file\n\nexecuted, but from\
    \ the component which had been interacted with by the\n\nuser or changed state;\
    \ this will be covered in detail in later chapters. Every\n\nnew render of a component\
    \ will be queued in the DG, which will later\n\nChapter 1 GettinG Started with\
    \ Streamlit\n\nbe replaced with a new HTML snippet or be newly placed between\
    \ other\n\nrendered HTML components on the final DOM.\n\nStreamlit components\
    \ are queued and rendered individually to avoid\n\nnegatively affecting the user’s\
    \ experience with a blank page if renders take\n\ntoo long. Such delays can occur\
    \ from an extensive ongoing computation,\n\nwaiting for API responses, or even\
    \ sleep functions, as shown in Listing [1-3](#index_split_000.html#p51).\n\n***Listing\
    \ 1-3.*** Code snippet to display random text with a delay within the execution\n\
    \n**import** streamlit as st\n\n**import** time\n\n*# User sees this first*\n\n\
    st.title(\"My Title\")\n\ntime.sleep(2)\n\n![](index-52_1.jpg)\n\nChapter 1 GettinG\
    \ Started with Streamlit\n\n***Figure 1-14.** Choosing a Python interpreter to\
    \ run the unit test file* *but after running the configuration in Figur[e 1-13](#index_split_000.html#p50)*\n\
    \n*# User sees this second after 2 seconds*\n\n*st.write(\"My *markdown* text\
    \ in* **Streamlit**\")\n\nThe end user will notice the page updates to include\
    \ the **st.write**\n\nmessage within two seconds to what seems like a fully loaded\
    \ page.\n\n![](index-53_1.png)\n\n![](index-53_2.png)\n\nChapter 1 GettinG Started\
    \ with Streamlit\n\n**1.3.2 ReactJS in Streamlit**\n\nFor simplicity purposes,\
    \ we kept mentioning that Streamlit inserts HTML\n\nonto the clients’ browser.\
    \ But in reality, it uses ReactJS’s virtual DOM to\n\ninsert elements and manage\
    \ their state. This can be verified by using\n\nChrome’s “React Developer Tools”\
    \ extension as shown in Figur[e 1-17](#index_split_000.html#p54).\n\nKnowing this\
    \ fact and Streamlit’s source code, we can conclude that\n\nStreamlit uses built-in\
    \ ReactJS components grouped to make a fully\n\nfledged JavaScript web application\
    \ with Python! In addition to that, we can\n\nleverage Streamlit’s generic treatment\
    \ of components to build custom and\n\ncomplex ones that are not provided out\
    \ of the box in later chapters.\n\n***Figure 1-15.** End-to-end execution sequence\
    \ for Listin[g 1-3](#index_split_000.html#p51)*\n\n***Figure 1-16.** Streamlit\
    \ output for Listing [1-3](#index_split_000.html#p51)*\n\n![](index-54_1.png)\n\
    \nChapter 1 GettinG Started with Streamlit\n\n***Figure 1-17.** Streamlit output\
    \ for Listing [1-3](#index_split_000.html#p51)*\n\n**1.4 Summary**\n\nA tangible\
    \ part of this chapter covered the trend toward cloud computing\n\nand the advantages\
    \ that it provides to developers, users, and cloud service\n\nproviders alike.\
    \ In addition, we listed the four most commonly used web\n\nframeworks for Python,\
    \ including one microframework – Flask – and three\n\nfull-stack frameworks, Django,\
    \ Dash, and Web2Py. Subsequently, Streamlit\n\nwas introduced as a pure Python\
    \ framework, and we learned how this\n\nposes a competitive advantage over its\
    \ competitors as it bridges the skills\n\ngap and reduces development time from\
    \ weeks to hours. The reader was\n\nthen acquainted with installing and utilizing\
    \ Streamlit to render basic\n\napplications on demand. In the next chapter, we\
    \ will cover the basic\n\nbuilding blocks of Streamlit, offer an exhaustive overview\
    \ of its application\n\nprogramming interface, and show how it can be employed\
    \ to produce our\n\nown customized applications.\n\n**CHAPTER 2**\n\n**Streamlit\
    \ Basics**\n\nStreamlit has made it thoroughly simple to create interfaces, display\n\
    \ntext, visualize data, render widgets, and manage a web application\n\nfrom inception\
    \ to deployment with its convenient and highly intuitive\n\napplication programming\
    \ interface showcased in the Appendix. With\n\nthe techniques covered in this\
    \ chapter, one will learn how to create input\n\nforms, implement conditional\
    \ flow, manage errors, mutate dataframes,\n\nand render basic charts. And upon\
    \ completion of Streamlit basics, a\n\ndeveloper should be able to produce, manage,\
    \ and control a variety of\n\ntrivial web applications and to deploy them locally.\
    \ Such applications\n\ninclude but are not limited to data explorer, machine learning,\
    \ multimedia,\n\ndata wrangling, and other general-purpose applications. Once\
    \ the\n\ndeveloper has mastered the basics of Streamlit, they may then begin to\n\
    \ndevelop more advanced and nontrivial applications that will be addressed\n\n\
    in subsequent chapters.\n\n**2.1 Creating a Basic Application**\n\nPutting Streamlit’s\
    \ mighty API to use, we can render a variety of\n\napplications. From the simplest\
    \ use cases catering to microservices to\n\ncomplex applications with distributed\
    \ systems, Streamlit enables us to\n\naccommodate to our users’ diverse set of\
    \ requirements. To begin with\n\nhowever, we will peruse the more trivial types\
    \ of applications in this\n\nsection before proceeding to more complex ones in\
    \ subsequent sections.\n\n© Mohammad Khorasani, Mohamed Abdou, Javier Hernández\
    \ Fernández 2022\n\nM. Khorasani et al., *Web Application Development with Streamlit*,\n\
    \n[https://doi.org/10.1007/978-1-4842-8111-6_2](https://doi.org/10.1007/978-1-4842-8111-6_2#DOI)\n\
    \nChapter 2 Streamlit BaSiCS\n\n**2.1.1 Generating User Input Forms**\n\nCreating\
    \ forms in Streamlit can be as simple as bundling several text,\n\nnumber, and\
    \ other input widgets together on a page coupled with a button\n\nthat triggers\
    \ an action such as recording the entries on a database or\n\nsaving it to the\
    \ session state. The caveat with this approach is that each\n\ntime the user interacts\
    \ with any of the widgets, Streamlit will automatically\n\nrerun the entire script\
    \ from top to bottom. While this approach provides\n\nthe developer with a logical\
    \ and seamless flow to their program, it may\n\nsometimes be useful to bundle\
    \ input widgets together and have Streamlit\n\nrerun the script only when prompted\
    \ by the user. This can be done using\n\nthe *st.form* command.\n\n***Listing\
    \ 2-1.*** inp[ut_form.py](http://form.py)\n\n**import** streamlit as st\n\nwith\
    \ st.form('feedback_form'):\n\nst.header('Feedback form')\n\n*# Creating columns\
    \ to organize the form*\n\ncol1, col2 = st.columns(2)\n\nwith col1:\n\nname =\
    \ st.text_input('Please enter your name')\n\nrating = st.slider('Please rate this\
    \ app',0,10,5)\n\nwith col2:\n\ndob = st.date_input('Please enter your date of\
    \ birth')\n\nrecommend = st.radio('Would you recommend this app to\n\nothers?',('Yes','No'))\n\
    \nsubmit_button = st.form_submit_button('Submit')\n\n**if** submit_button:\n\n\
    st.write('**Name:**', name, '**Date of birth:**', dob,\n\n'**Rating:**', rating,'**Would\
    \ recommend?:**', recommend)\n\n![](index-57_1.jpg)\n\nChapter 2 Streamlit BaSiCS\n\
    \nA Streamlit form can be called within a *with* statement and using the\n\n*st.form*\
    \ command. In Listin[g 2-1, w](#index_split_000.html#p56)e initially create columns\
    \ with the *st.*\n\n*columns* command to organize the widgets within our form\
    \ into two\n\ncolumns of equal width. In the first column, we place a text input\
    \ and\n\nslider widget using the *st.text_input* and *rating* commands, respectively,\
    \ and in the second column, we place a date input and radio button widget\n\n\
    using the *st.date_input* and *st.radio* commands.\n\nSubsequently, within the\
    \ same *with* statement, we add a form submit\n\nbutton using the *st.form_submit_button*\
    \ command. When this button is\n\nclicked, it will submit the entries of all the\
    \ widgets collectively at once\n\nregardless of how many items are included in\
    \ the form. It is important to\n\nnote that *st.form_submit_button* is not the\
    \ same as *st.button*, and without a form submit button, Streamlit will throw\
    \ an error.\n\nAs shown in Figur[e 2-1](#index_split_000.html#p57), all of the\
    \ widgets will be bundled together in one form with the *st.form* command. Once\
    \ the form submit button is\n\nclicked, all of the entries will be processed collectively\
    \ at once and the\n\noutput processed as shown in Figur[e 2-2.](#index_split_000.html#p58)\n\
    \n***Figure 2-1.** Streamlit input form (output of Listing [2-1)](#index_split_000.html#p56)*\n\
    \n![](index-58_1.png)\n\nChapter 2 Streamlit BaSiCS\n\n***Figure 2-2.** Instantiated\
    \ Streamlit input form (output of Listing [2-1)](#index_split_000.html#p56)*\n\
    \n**2.1.2 Introducing Conditional Flow**\n\nIt may be necessary to introduce conditional\
    \ flow to your Streamlit\n\napplications whereby certain actions will be dependent\
    \ on prior actions\n\nor on the state of widgets. This is especially useful for\
    \ prompting the user\n\nto correctly fill in forms and/or use the application\
    \ correctly. Without\n\nimplementing conditional flow, your application will be\
    \ prone to throwing\n\nerrors should the user make incorrect use of it.\n\n**Example\
    \ 1**\n\n***Listing 2-2.*** conditional_flow_1.py\n\n**import** streamlit as st\n\
    \n**def** display_name(name):\n\nst.info(f'**Name:** {name}')\n\nname = st.text_input('Please\
    \ enter your name')\n\nChapter 2 Streamlit BaSiCS\n\n**if not** name:\n\nst.error('No\
    \ name entered')\n\n**if** name:\n\ndisplay_name(name)\n\nIn Listin[g 2-2](#index_split_000.html#p58),\
    \ to ensure the user has entered an input into the name field, we are using an\
    \ *if* statement to check whether this field is not empty.\n\nIf it is empty,\
    \ the user will be prompted with an error message (Figure [2-3),](#index_split_000.html#p60)\n\
    \nand if it is not empty, a function will be invoked to display the entry\n\n\
    (Figure [2-4).](#index_split_000.html#p60)\n\n**Example 2**\n\n***Listing 2-3.***\
    \ conditional_flow_2.py\n\n**import** streamlit as st\n\n**def** display_name(name):\n\
    \nst.info(f'**Name:** {name}')\n\nname = st.text_input('Please enter your name')\n\
    \n**if not** name:\n\nst.error('No name entered')\n\nst.stop()\n\ndisplay_name(name)\n\
    \nIn Listin[g 2-3](#index_split_000.html#p59), similarly we are using an *if*\
    \ statement to check whether the name field is not empty. The only difference\
    \ here is that we are\n\nutilizing the *st.stop* command to stop the execution\
    \ of the script if the name field is empty. And if it is not empty, we are proceeding\
    \ with the rest\n\nof the script that displays the entered name. The benefit of\
    \ this method\n\nis that it eliminates the need for an additional if statement\
    \ and simplifies\n\nyour script; otherwise, in terms of utility, both examples\
    \ are identical.\n\n![](index-60_1.jpg)\n\n![](index-60_2.jpg)\n\nChapter 2 Streamlit\
    \ BaSiCS\n\n***Figure 2-3.** Implementing conditional flow (output of Listing\
    \ [2-2](#index_split_000.html#p58)* *)* Conditional flow programming can be applied\
    \ to both trivial and\n\nnontrivial applications. Indeed, this technique can be\
    \ scaled and\n\nimplemented with nested if statements, while loops, and other\
    \ methods if\n\nrequired.\n\n***Figure 2-4.** Implementing conditional flow continued\
    \ (output of*\n\n*Listing [2-2)](#index_split_000.html#p58)*\n\n**2.1.3 Managing\
    \ and Debugging Errors**\n\nIf you are running Streamlit in development mode and\
    \ have configured\n\n*showErrorDetails = True* as shown in Table [3- 1](https://doi.org/10.1007/978-1-4842-8111-6_3#Tab1)\
    \ in Section 3.1, then Streamlit will natively display runtime exceptions on the\
    \ web page similar\n\nto how any other IDE would display such messages on the\
    \ console. This\n\nis far from ideal as the user will not be able to make much\
    \ sense of it and\n\nwill be left confused. More importantly, leaving exceptions\
    \ mismanaged\n\ncan trigger a chain of fatal errors in subsequent parts of your\
    \ code that\n\ncan have a cascading effect on other systems. In addition, Streamlit\
    \ will\n\n![](index-61_1.jpg)\n\nChapter 2 Streamlit BaSiCS\n\ndisplay the errorsome\
    \ segment of your code that is causing the exception\n\nto the user, which may\
    \ infringe on intellectual property rights, should your\n\nsource code be subject\
