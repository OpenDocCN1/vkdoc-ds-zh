    # Appendix A: Streamlit Application Program Interface


    The following example shows a simple representation of a JSON object. The interactive
    visualization of Streamlit allows folding and unfolding of the branches.


    ```

    st.json({

    ''A'': ''a'',

    ''B'': ''b'',

    ''C'': [

    ''ca'',

    ''cb'',

    ''cc'',

    ''cd'',

    ],

    ''D'': ''d'',

    })

    ```


    ## `Metric`


    The `st.metric(label, value, delta=None, delta_color=''normal'')` command displays
    in large and bold fonts a metric, indicator, or variable in a dashboard style.
    An optional change of status indicator can be added.


    ![](index-420_1.png)


    ### Table A-11. `st.metric` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `label` (`str`) | The title for the metric. |

    | `value` (`int`, `str`, or `None`) | Value given to the metric. `None` is rendered
    as a long dash. |

    | `delta` (`int`, `str`, or `None`) | Small subindicator below the main one showing
    the change with regard to the last status. For negative numbers (`int` or `float`),
    or strings starting with a minus sign, the arrow will be rendered in red and pointing
    down; all other options will show in green and the arrow pointing up. If the delta
    is set to `None` (the default option), this subindicator will not be presented.
    |

    | `delta_color` (`str`) | This attribute inverses the color and the arrow by default
    for positive and negative values. It is intended for those cases where a negative
    change might be considered good, and vice versa. If set to `"off"`, the delta
    will be shown in gray for all cases. |


    The following example shows a metric indicator of temperature without its delta.
    The indicator is then adjusted with the delta option to reflect the change from
    the previous value.


    ```

    st.metric(''Temperature'', ''26.7 C'', ''2.7 C'')

    ```


    ## A.1.3 Displaying Charts


    Another area that Streamlit excels in is in visualizing data. Whether it is rendering
    a chart using their native command or displaying a third-party chart from Matplotlib,
    Altair, Vega-Lite, Plotly, Bokeh, PyDeck, or Graphviz, Streamlit allows you to
    integrate visualizations effortlessly.


    ### Line, Area, and Bar Charts


    Simple line, area, and bar charts can be rendered using the `st.line_chart`, `st.area_chart`,
    and `st.bar_chart` commands. To display a chart, you may use the following command:
    `st.line_chart / st.area_chart / st.bar_chart(data, width, height, use_container_width)`.


    #### Table A-12. `st.line_chart`, `st.area_chart`, and `st.bar_chart` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `data` (`pandas.DataFrame`, `pandas.Styler`, `pyarrow.Table`, `numpy.ndarray`,
    `Iterable`, `dict`, or `None`) | The data to be plotted. Streamlit''s legacy dataframe
    serialization does not include support for PyArrow tables (i.e., `config.dataframeSerialization
    = ''legacy''`). To utilize PyArrow tables, change the config setting to `config.dataframeSerialization
    = ''arrow''`. |

    | `width` (`int`) | The chart''s width dimensions in pixels. If zero, the width
    is determined automatically. |

    | `height` (`int`) | The chart''s height dimensions in pixels. If zero, the width
    is determined automatically. |

    | `use_container_width` (`bool`) | When `True`, the chart width will adjust to
    the column width. This argument has precedence over the `width` argument. |


    ![](index-422_1.jpg)


    The following example shows the use of the three graphing options stacked and
    limited in height:


    ```

    chart_data = pd.DataFrame(

    np.random.randn(10, 2),

    columns=[''Value 1'', ''Value 2''])

    st.line_chart(chart_data, height=125)

    st.area_chart(chart_data, height=125)

    st.bar_chart(chart_data, height=125)

    ```


    ### `Pyplot`


    A Matplotlib chart can be rendered using the following command: `st.pyplot(fig,
    clear_figure, **kwargs)`.


    #### Table A-13. `st.pyplot` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `fig` (`Matplotlib Figure`) | Figure to be plotted. |

    | `clear_figure` (`bool`) | The figure will be cleared after being rendered when
    `True`. |'
