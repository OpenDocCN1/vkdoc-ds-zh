    \n***Figure 5-12.** Creating user credentials for the database*\n\n**5.2.3 Full-Text\
    \ Indexing**\n\nFull-text indexing indexes every single token, for all the objects\
    \ in all the\n\ndocuments of a database. It is an extremely powerful form of indexing\n\
    \nthat allows you to perform accurate queries and retrieve all matching\n\ndocuments,\
    \ very similar to how search engines work. In MongoDB, you\n\ncan create a full-text\
    \ index on a cloud database as follows:\n\n1\\. To create an index, open the Search\
    \ tab found in\n\nthe *Databases* menu item, and click *Create Search*\n\n*Index*,\
    \ as shown in Figure [5-16](#index_split_001.html#p178).\n\n2\\. Subsequently,\
    \ select the *JSON Editor* from the\n\n*Configuration Method* tab.\n\n![](index-174_1.png)\n\
    \nChapter 5 Database IntegratIon\n\n3\\. Select the database and collection that\
    \ you want to\n\ncreate the index for, enter a name for the index, and\n\nenter\
    \ the following index, as shown in Figure [5-17:](#index_split_001.html#p179)\n\
    \n{\n\n\"mappings\": {\n\n\"dynamic\": true\n\n}\n\n}\n\n***Figure 5-13.** Creating\
    \ a connection string for the database*\n\nChapter 5 Database IntegratIon\n\n\
    **5.2.4 Querying the Database**\n\nTo query your indexed database in MongoDB,\
    \ you should initially connect\n\nto your database with the connection string\
    \ acquired in Figure [5-13,](#index_split_001.html#p174)\n\nby using it to establish\
    \ a client. It will be handy to invoke the client as a\n\nfunction that is cached\
    \ with the *@st.cache* command. This will ensure that each time a query is executed,\
    \ instead of establishing a new client, the one\n\nthat was previously cached\
    \ is used, thereby saving a considerable amount\n\nof runtime and resources as\
    \ shown in the following:\n\n**from** pymongo **import** MongoClient\n\n@st.cache(allow_output_mutation=True,\
    \ hash_funcs={\"_thread.\n\nRLock\": **lambda** _: None})\n\n**def** create_client():\n\
    \n**return** MongoClient('<connection_string>')\n\nSubsequently, you will need\
    \ to create an *Aggregation*, which is simply a multistaged filtering pipeline\
    \ written in JSON containing all the filters you\n\nwant to apply to your data\
    \ in order to query it as follows:\n\n1\\. **Search using fuzzy matching**\n\n\
    In this stage, we need to specify the name of the\n\nindex that we created previously\
    \ to use for searching\n\nthe documents. In addition, we need to input the\n\n\
    user’s *query* with string concatenation; we also\n\nneed to specify the *path*\
    \ or in other words the\n\nobjects to search through in the documents, that\n\n\
    is, borough and street address (nested elements\n\nand/or objects can be accessed\
    \ with a period, i.e.,\n\n*address.street*). Most importantly, however, we need\n\
    \nto enable *fuzzy* matching and specify the number\n\nof single-character edits\
    \ needed to match the query\n\n![](index-176_1.png)\n\nChapter 5 Database IntegratIon\n\
    \nwith the token using *maxEdits*, and we also need\n\nto determine the number\
    \ of characters at the start\n\nof each query that must match the token using\n\
    \n*prefixLength*:\n\n***Figure 5-14.** Creating a connection string for the database*\n\
    \n*(continued)*\n\n'$search': {\n\n'index': 'default',\n\n'text': {\n\n'query':\
    \ '%s' % (address),\n\n'path': ['borough','address.street'],\n\n'fuzzy': {\n\n\
    Chapter 5 Database IntegratIon\n\n'maxEdits': 2,\n\n'prefixLength': 2\n\n}\n\n\
    }\n\n}\n\n2\\. **Project documents with search score**\n\nAt this stage, we will\
    \ pass only the objects that we\n\nwant from the documents and will also compute\
    \ the\n\nrelevance score using the *’searchScore’* tag:\n\n'$project': {\n\n'Name':\
    \ '$name',\n\n'Cuisine': '$cuisine',\n\n'Address': '$address.street',\n\n'Borough':\
    \ '$borough',\n\n'Grade': '$grades.grade',\n\n'Score': {\n\n'$meta': 'searchScore'\n\
    \n}\n\n}\n\n![](index-178_1.jpg)\n\n![](index-178_2.jpg)\n\nChapter 5 Database\
    \ IntegratIon\n\n***Figure 5-15.** Loading a dataset into the database*\n\n***Figure\
    \ 5-16.** Creating a full-text index for the database*\n\n![](index-179_1.jpg)\n\
    \nChapter 5 Database IntegratIon\n\n3\\. **Filter documents**\n\nSubsequently,\
    \ we will filter the passed documents with the\n\nuser entry for the type of cuisine.\
    \ Please note that unlike\n\nfuzzy matching, at this stage queries must be identical\
    \ to\n\nthe tokens in the documents for a successful filtering:\n\n'$match': {\n\
    \n'Cuisine': '%s' % (cuisine)\n\n}\n\n***Figure 5-17.** Creating a full-text index\
    \ for the database (continued)* 4\\. **Limit results**\n\nFinally, at this stage\
    \ we will simply limit the number\n\nof passed results to the number we require:\n\
    \n'$limit': 5\n\nFor information regarding additional options for the aggregation\
    \ pipeline,\n\nplease refer to [*https://docs.mongodb.com/manual/reference/aggregation/*.](https://docs.mongodb.com/manual/reference/aggregation)\n\
    \nChapter 5 Database IntegratIon\n\n**5.2.5 Displaying Tables in Streamlit**\n\
    \nOnce the aggregation pipeline is complete and has passed the queried\n\nresults\
    \ to Python, you will need to perform postprocessing before you\n\ncan render\
    \ the table in Streamlit. Specifically, you will need to convert the\n\nreturned\
    \ object from the MongoDB client into a Pandas dataframe and\n\nspecify the columns\
    \ you want to keep. In addition, you need to parse any\n\nreturned lists (such\
    \ as the restaurant grades) and convert to plain text as\n\nshown in the following:\n\
    \ndf = pd.DataFrame(result)[['Name','Address','Grade','Score']]\n\ndf['Grade']\
    \ = [','.join(**map**(**str**, x)) **for** x **in** df['Grade']]\n\nYou may refer\
    \ to Listin[g 5-4](#index_split_001.html#p180) to peruse the complete code for\
    \ this section. You may also view the associated Streamlit application in\n\n\
    Figur[e 5-18 th](#index_split_001.html#p182)at displays an example of a fuzzy\
    \ matched query and the returned table in Streamlit.\n\n***Listing 5-4.*** [mongodb.py](http://mongodb.py)\n\
    \n**import** streamlit as st\n\n**import** pandas as pd\n\n**from** pymongo **import**\
    \ MongoClient\n\n@st.cache(allow_output_mutation=True,\n\nhash_funcs={\"_thread.RLock\"\
    : **lambda** _: None})\n\n**def** create_client():\n\n**return** MongoClient('<connection_string>')\n\
    \n**def** query(cuisine,address):\n\nresult = create_client()['sample_restaurants']\n\
    \n['restaurants'].aggregate([\n\n{\n\nChapter 5 Database IntegratIon\n\n'$search':\
