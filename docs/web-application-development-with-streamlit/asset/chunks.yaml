    \ | 将该参数设置为 `True` 将允许您覆盖缓存的数据，而不会收到 Streamlit 的警告。 |\n| `show_spinner`（布尔值） |\
    \ 如果设置为 `True`，则在缓存未命中时会显示一个加载动画。 |\n| `suppress_st_warning`（布尔值） | 将该参数设置为 `True`\
    \ 将抑制任何 |\n"
- fmt: "# Appendix A Streamlit Application Program Interface\n\n## Caching with `st.cache`\n\
    \n`warning` (`boolean`) — Warnings about calling embedded functions within a cached\
    \ function.\n\n`hash_funcs` (`dict` or `None`) — With this parameter, you can\
    \ override the reaction of Streamlit to objects within the cache; when the hasher\
    \ encounters a specified object within the dict, it will use the associated function\
    \ in response.\n\n`max_entries` (`int` or `None`) — This parameter specifies the\
    \ maximum number of items to cache, and whenever a new item is added to the list,\
    \ the oldest item will be removed accordingly.\n\n`ttl` (`float` or `None`) —\
    \ This parameter determines the time in seconds to keep an item in the cache;\
    \ if not invoked, the cache will not be cleared.\n\n```python\n@st.cache\ndef\
    \ dataframe(rows):\n    df = pd.DataFrame(\n        np.random.randn(rows, 5),\n\
    \        columns=('col %d' % i for i in range(5)))\n    return df\n\n# Initial\
    \ invocation to cache dataframe\ndf = dataframe(100000)\n\n# Subsequent invocation\
    \ will access the cached dataframe without re-executing function\ndf = dataframe(100000)\n\
    \n# Will re-execute function and recache new dataframe due to modified input parameter\n\
    df = dataframe(200000)\n```\n\n## Caching Functions\n\nStreamlit also allows you\
    \ to cache function executions persistently with the `st.experimental_memo(func,\
    \ persist, show_spinner, suppress_st_warning, max_entries, ttl)` command. This\
    \ feature is indeed very similar to the `st.cache` command. And when you no longer\
    \ need the cache, you may remove it by using the command `st.experimental_memo.clear()`.\
    \ Please note that commands beginning with `experimental` will have this prefix\
    \ removed in future releases once the command has matured.\n\n**Table A-52.**\
    \ `st.experimental_memo` parameters\n\n| Parameter | Description |\n|---|---|\n\
    | `func` (`callable`) | The function to be cached. |\n| `persist` (`boolean`)\
    \ | This parameter specifies whether to keep the cached data persistently or not.\
    \ |\n| `show_spinner` (`boolean`) | If set to `True`, a spinner will be displayed\
    \ when there is a cache miss. |\n| `suppress_st_warning` (`boolean`) | Setting\
    \ this parameter to `True` will suppress any warnings about calling embedded functions\
    \ within a cached function. |\n| `max_entries` (`int` or `None`) | This parameter\
    \ specifies the maximum number of items to cache, and whenever a new item is added\
    \ to the list, the oldest item will be removed accordingly. |\n| `ttl` (`float`\
    \ or `None`) | This parameter determines the time in seconds to keep an item in\
    \ the cache; if not invoked, the cache will not be cleared. |\n\n```python\n@st.experimental_memo\n\
    def dataframe(rows):\n    df = pd.DataFrame(\n        np.random.randn(rows, 5),\n\
    \        columns=('col %d' % i for i in range(5)))\n    return df\n\n# Initial\
    \ invocation to cache function execution\ndf = dataframe(100000)\n\n# Subsequent\
    \ invocation will access the cached execution without re-executing function\n\
    df = dataframe(100000)\n\n# Will re-execute function and recache the new execution\
    \ due to modified input parameter\ndf = dataframe(200000)\n```\n\n## Caching Objects\n\
    \nSimilar to `st.cache`, Streamlit allows you to cache objects persistently with\
    \ the `st.experimental_singleton(func, show_spinner, suppress_st_warning)` command.\
    \ And when you no longer need the cache, you may remove it by using the command\
    \ `st.experimental_singleton.clear()`. It is important to highlight that singleton\
    \ objects must be thread-safe since they will be shared by all users of the application.\
    \ Possible use cases for `st.experimental_singleton` are database connections\
    \ and corpora. However, this is not the case for `st.memo` as each caller will\
    \ receive their own copy of the cached data.\n\n**Table A-53.** `st.experimental_singleton`\
    \ parameters\n\n| Parameter | Description |\n|---|---|\n| `func` (`callable`)\
    \ | The function to be cached. |\n| `show_spinner` (`boolean`) | If set to `True`,\
    \ a spinner will be displayed when there is a cache miss. |\n| `suppress_st_warning`\
    \ (`boolean`) | Setting this parameter to `True` will suppress any warnings about\
    \ calling embedded functions within a cached function. |"
