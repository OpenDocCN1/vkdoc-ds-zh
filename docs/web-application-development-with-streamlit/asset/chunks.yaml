    \nhyperparameters.\n\n4\\. Train the logistic regression model and cache\n\nthe\
    \ function with *st.cache* to reduce runtime on\n\nsubsequent reruns.\n\n5\\.\
    \ Classify test data using the trained logistic\n\nregression model.\n\n6\\. Visualize\
    \ accuracy metrics of classified data.\n\nIn addition, we will implement the technique\
