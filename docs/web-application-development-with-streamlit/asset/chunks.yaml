    \n**1.2.6 Writing and Testing Code with PyCharm**\n\nGenerally speaking, code\
    \ expands over time, whether by making new\n\nmodules in the original code base\
    \ or integrating it with third-party services.\n\nAs a step toward making sure\
    \ the code performs flawlessly, testing can be\n\nutilized. Code testing can be\
    \ broken down to two methods: unit testing and\n\nintegration testing, where both\
    \ can be used to test independent modules\n\nand the whole system end to end,\
    \ respectively. For the sake of this example,\n\nwe will cover unit tests, but\
    \ the same concept can be applied to the other\n\noption. Either way, we need\
    \ to give inputs and compare expected outputs\n\nagainst actual ones. For a simple\
    \ Streamlit application which enables the\n\nuser to calculate the sum of any\
    \ two numbers, we can test two main parts,\n\none being if the web application\
    \ is rendered according to our expectations\n\nand the other to verify the summation\
    \ logic is correct. These are two different unit tests to do, but the first is\
    \ a common thing to do when developing any\n\nfrontend work. Listing [1-1 is the\
    \ s](#index_split_000.html#p47)ample application we are trying to test in this\
    \ example with output of Figur[e 1-12](#index_split_000.html#p48) when ran with\
    \ Streamlit. Listing [1-2](#index_split_000.html#p47)\n\ntests both rendering\
    \ and summation logic of the mentioned example.\n\n***Figure 1-9.** Streamlit\
    \ plotting demo application*\n\n![](index-46_1.jpg)\n\n![](index-46_2.jpg)\n\n\
    Chapter 1 GettinG Started with Streamlit\n\n***Figure 1-10.** Streamlit mapping\
    \ demo application*\n\n***Figure 1-11.** Streamlit dataframe demo application*\n\
    \nChapter 1 GettinG Started with Streamlit\n\n***Listing 1-1.*** main.py\n\n**import**\
    \ streamlit as st\n\n**def** calculate_sum(n1, n2):\n\n**return** n1 + n2\n\n\
    st.title(\"Add numbers\")\n\nn1 = st.number_input(\"First Number\")\n\nn2 = st.number_input(\"\
    Second Number\")\n\n**if** st.button(\"Calculate\"):\n\nst.write(\"Summation is:\
    \ \" + **str**(calculate_sum(n1, n2)))\n\n***Listing 1-2.*** Unit_test.py\n\n\
    **from** main **import** calculate_sum\n\n**from** selenium **import** webdriver\n\
    \n**from** selenium.webdriver.chrome.options **import** Options\n\n**import**\
