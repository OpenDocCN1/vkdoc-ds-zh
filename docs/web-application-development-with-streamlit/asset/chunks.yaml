    \ Applications**\n\nPerhaps, one of the most profusely used forms of data is time-series\
    \ data.\n\nAnything that is indexed by time, date, or a combination of both can\n\
    \nbe regarded as being time-series, such as temperature readings from a\n\nthermostat\
    \ or signals from a SCADA system. Such datasets come with their\n\nown unique\
    \ challenges. From filtering to aggregating and visualizing, time-\n\nseries datasets\
    \ require bespoke wrangling. Luckily with Streamlit we can\n\ncreate a whole slew\
    \ of applications to accommodate such needs as shown\n\nin the following sections.\n\
    \n**11.2.1 Date-Time Filter Application**\n\nFiltering data based on a time range\
    \ is one of those classical functions for\n\npractically any data science application.\
    \ You may only need a subset of the\n\ndata at hand, and you can do so by selecting\
    \ a leading or trailing date-time\n\nto truncate the dataset with. Given that\
    \ timestamps come in a variety of\n\nformats, or sometimes even separated with\
    \ date in one column and time in\n\nanother, it can be rather challenging to create\
    \ a one-size-fits-all solution.\n\nChapter 11 Streamlit USe CaSeS\n\nIn this example,\
    \ we will create a date-time filter for possibly one of the\n\nmost widely used\
    \ date-time formats where date and time are formatted\n\nas *DD/MM/YYYY HH:MM*\
    \ in the first column, and some arbitrary\n\nmeasurements are placed in the second\
    \ column. We will use Streamlit’s\n\nslider command *st.slider* to truncate the\
    \ leading and trailing edges of our time-series dataset and will subsequently\
    \ visualize the filtered data using a\n\nPlotly line chart as shown in Listing\
    \ [11-5 and F](#index_split_002.html#p343)igure [11-6\\. T](#index_split_002.html#p345)his\
    \ application can be utilized with datasets using other date-time formats by simply\n\
    \nmodifying the timestamp format in the code.\n\n***Listing 11-5.*** datetime_filter.py\n\
    \n**import** pandas as pd\n\n**import** streamlit as st\n\n**from** datetime **import**\
    \ datetime\n\n**import** plotly.express as px\n\n*# Streamlit slider function\
    \ used to truncate leading and*\n\n*trailing edges of dataset*\n\n**def** datetime_filter(datetime_col,\
    \ df, **format**):\n\nlead, trail = st.sidebar.slider('Date-time filter', 0,\n\
    \n**len**(df)-1, [0, **len**(df)-1], 1)\n\ndf[datetime_col] = pd.to_datetime(df[datetime_col],\n\
    \n**format**=**format**)\n\nsd = df.loc[lead][datetime_col].strftime('%d %b %Y,\
