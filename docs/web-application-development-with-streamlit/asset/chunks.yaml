    df = pd.read_csv(uploaded_file)\n\ndf_aggregate = aggregate(df, 'datetime', '%d/%m/%Y\
    \ %H:%M')\n\nheatmap(df_aggregate, month_hours, 'value')\n\n***Figure 11-7.**\
    \ Output of Listing [11-6](#index_split_002.html#p346)*\n\nChapter 11 Streamlit\
    \ USe CaSeS\n\n**11.2.3 Time Synchronization Application**\n\nOne of the classical\
    \ problems when dealing with time-series data is that\n\ndifferent datasets might\
    \ not be synchronized with one another. This means\n\nthat even when both datasets\
    \ are representing the same information at\n\nthe exact same time, they may in\
    \ fact have different timestamps, and this\n\nintroduces a whole slew of unintended\
    \ problems. Such discrepancies\n\ncan be attributed to a multitude of reasons,\
    \ namely, the datasets may be\n\nin different time zones where one zone has daylight\
    \ savings while the\n\nother does not. Or perhaps the SCADA systems recording\
    \ the data were\n\nsubjected to errors during operation. Cause aside, it is absolutely\
    \ vital\n\nto synchronize time-series datasets with one another in order to make\n\
    \naccurate use of the data at hand.\n\nTo that end, one can make use of a novel\
    \ technique referred to as\n\n“dynamic time warping” (DTW), which synchronizes\
    \ misaligned datasets\n\nby applying dynamic time offsets wherever necessary to\
    \ maximize the\n\ncorrelation between the two. The advantage of this technique\
    \ is that it\n\napplies as many time offsets as required to achieve the highest\
    \ possible\n\ncorrelation at each timestamp and may even be applied to datasets\
    \ with\n\nvarying lengths. The only caveat is that missing values must be filled\
    \ for\n\nDTW to execute without error.\n\nIn this example, we will create a Streamlit\
    \ application that will\n\nsynchronize a dataset of readings for power vs. voltage,\
    \ where voltage\n\nis misaligned by two hours. As shown in Listin[g 11-7](#index_split_002.html#p350),\
    \ we will define column *power* as the reference dataset, which will be used to\
    \ synchronize column *voltage*, the target dataset. The synchronize function will\
    \ take\n\nthe unsynchronized data shown in Figure [11-8 and offs](#index_split_002.html#p352)et\
    \ the target’s timestamps to synchronize it as shown in Figure [11-9.](#index_split_002.html#p352)\n\
    \nChapter 11 Streamlit USe CaSeS\n\n***Listing 11-7.*** timeseries_synchronization.py\n\
    \n**import** numpy as np\n\n**import** pandas as pd\n\n**import** streamlit as\
    \ st\n\n**from** fastdtw **import** *\n\n**import** plotly.express as px\n\n**from**\
    \ sklearn.metrics **import** r2_score\n\n**from** scipy.spatial.distance **import**\
    \ *\n\n*# Dynamic Time Warping synchronization function*\n\n**def** synchronize(df,\
    \ datetime_col, reference, target):\n\nx = np.array(df_unsynchronized[reference].fillna(0))\n\
    \ny = np.array(df_unsynchronized[target].fillna(0))\n\ndistance, path = fastdtw(x,\
    \ y, dist=euclidean)\n\nresult = []\n\n**for** i **in range**(0, **len**(path)):\n\
    \nresult.append([df_unsynchronized[datetime_col].\n\niloc[path[i][0]],\n\ndf_unsynchronized[reference].iloc[path[i][0]],\n\
    \ndf_unsynchronized[target].iloc[path[i][1]]])\n\ndf_synchronized = pd.DataFrame(data=result,\n\
