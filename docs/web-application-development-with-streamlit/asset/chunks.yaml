- fmt: '# Streamlit Application Programming Interface


    ## Date Input


    A date display input widget can be added to our websites using the following command:
    `st.date_input(label, value, min_value, max_value, key, help, on_change, args,
    kwargs, disabled=False)` ➤ `value`.


    **Table A-32.** `st.date_input` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `label( str )` | Label explaining the intent of the date selection. |

    | `value( datetime.date or datetime.datetime or list/tuple of datetime.date or
    datetime.datetime or None)` | Value showed by this widget during the first render.
    If a list/tuple is provided with zero to two date/datetime values, it will be
    considered as a range. Today is the default value if nothing is selected. |

    | `min_value( datetime.date or datetime.datetime )` | The default minimum selectable
    date. If the value is a date, it will be set to 10 years from now. For intervals
    [start, finish], start – 10 years is assumed. |

    | `max_value( datetime.date or datetime.datetime )` | The maximum selectable date.
    If the value is a date, it will be updated with 10 years added. If the value is
    the period [start, end], it will be updated to end + 10 years. |

    | `key( str or int )` | Unique key, string or integer, to reference the button
    in the code. The parameter is optional and will be automatically generated if
    not provided. |

    | `help( str )` | Tooltip to be displayed when the cursor is hovered over the
    widget. |

    | `on_change( callable )` | Callback function invoked when the widget’s value
    changes. |

    | `args( tuple )` | Tuple of arguments to pass to the callback. |

    | `kwargs( dict )` | Dictionary of keyword arguments to pass to the callback.
    |

    | `disabled( bool )` | Boolean argument used to disable the widget. |


    The following lines of code implement a simple age in days calculator with the
    date input widget, limiting the lower value to those born after 1920:


    ```python

    birth_date = st.date_input(''Date of Birth:'', value = datetime.date(2018,12,29),
    min_value = datetime.date(1920,1,1))

    st.write(''Your age in days:'', datetime.date.today() - birth_date)

    ```


    ## Time Input


    A time input widget can be added to our websites using the following command:
    `st.time_input(label, value, key, help, on_change, args, kwargs, disabled=False)`
    ➤ `value`.


    **Table A-33.** `st.time_input` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `label( str )` | Label of the widget. |

    | `value( datetime.time / datetime.datetime )` | Value showed by this widget during
    the first render. Cast internally to str. Current time is the default. |

    | `key( str or int )` | Unique key, string or integer, to reference the button
    in the code. The parameter is optional and will be automatically generated if
    not provided. |

    | `help( str )` | Tooltip to be displayed when the cursor is hovered over the
    widget. |

    | `on_change( callable )` | Callback function invoked when the widget’s value
    changes. |

    | `args( tuple )` | Tuple of arguments to pass to the callback. |

    | `kwargs( dict )` | Dictionary of keyword arguments to pass to the callback.
    |

    | `disabled( bool )` | Boolean argument used to disable the widget. |


    The example shows the use of the time input with a default value at render time
    of 7.00 am:


    ```python

    sleep_time = st.time_input(''How many hours of sleep are enough? '', ...)

    ```'
