  trans: "\n# 附录 A Streamlit 应用程序接口\n\n## 使用 `st.cache` 进行缓存\n\n`warning` (`boolean`)\
    \ — 关于在缓存函数内调用内嵌函数的警告。\n\n`hash_funcs` (`dict` 或 `None`) — 通过此参数，您可以覆盖 Streamlit\
    \ 对缓存中对象的处理方式；当哈希函数在字典中遇到指定对象时，它将使用关联函数进行响应。\n\n`max_entries` (`int` 或 `None`)\
    \ — 此参数指定要缓存的最大条目数，每当有新条目添加到列表中时，最旧的条目将被相应移除。\n\n`ttl` (`float` 或 `None`) — 此参数决定条目在缓存中的保留时间（秒）；若未设置，缓存将不会被清除。\n\
    \n```python\n@st.cache\ndef dataframe(rows):\n    df = pd.DataFrame(\n       \
    \ np.random.randn(rows, 5),\n        columns=('col %d' % i for i in range(5)))\n\
    \    return df\n\n# 首次调用以缓存数据框\ndf = dataframe(100000)\n\n# 后续调用将访问缓存的数据框，无需重新执行函数\n\
    df = dataframe(100000)\n\n# 由于输入参数已修改，将重新执行函数并缓存新的数据框\ndf = dataframe(200000)\n\
    ```\n\n## 缓存函数\n\nStreamlit 还允许您通过 `st.experimental_memo(func, persist, show_spinner,\
    \ suppress_st_warning, max_entries, ttl)` 命令持久地缓存函数执行结果。此功能与 `st.cache` 命令非常相似。当您不再需要缓存时，可以使用\
    \ `st.experimental_memo.clear()` 命令将其移除。请注意，以 `experimental` 开头的命令在功能成熟后，将在未来版本中移除此前缀。\n\
    \n**表 A-52.** `st.experimental_memo` 参数\n\n| 参数 | 描述 |\n|---|---|\n| `func` (`callable`)\
    \ | 需要缓存的函数。 |\n| `persist` (`boolean`) | 此参数指定是否持久保留缓存数据。 |\n| `show_spinner`\
    \ (`boolean`) | 如果设置为 `True`，则在缓存未命中时将显示加载动画。 |\n| `suppress_st_warning` (`boolean`)\
    \ | 将此参数设置为 `True` 将抑制关于在缓存函数内调用内嵌函数的任何警告。 |\n| `max_entries` (`int` 或 `None`)\
    \ | 此参数指定要缓存的最大条目数，每当有新条目添加到列表中时，最旧的条目将被相应移除。 |\n| `ttl` (`float` 或 `None`) |\
    \ 此参数决定条目在缓存中的保留时间（秒）；若未设置，缓存将不会被清除。 |\n\n```python\n@st.experimental_memo\ndef\
    \ dataframe(rows):\n    df = pd.DataFrame(\n        np.random.randn(rows, 5),\n\
    \        columns=('col %d' % i for i in range(5)))\n    return df\n\n# 首次调用以缓存函数执行结果\n\
    df = dataframe(100000)\n\n# 后续调用将访问缓存的执行结果，无需重新执行函数\ndf = dataframe(100000)\n\n\
    # 由于输入参数已修改，将重新执行函数并缓存新的执行结果\ndf = dataframe(200000)\n```\n\n## 缓存对象\n\n与 `st.cache`\
    \ 类似，Streamlit 允许您通过 `st.experimental_singleton(func, show_spinner, suppress_st_warning)`\
    \ 命令持久地缓存对象。当您不再需要缓存时，可以使用 `st.experimental_singleton.clear()` 命令将其移除。需要特别强调的是，单例对象必须是线程安全的，因为它们将被应用程序的所有用户共享。`st.experimental_singleton`\
    \ 的典型用例包括数据库连接和语料库。然而，对于 `st.memo` 则不是这种情况，因为每个调用者将收到缓存数据的独立副本。\n\n**表 A-53.**\
    \ `st.experimental_singleton` 参数\n\n| 参数 | 描述 |\n|---|---|\n| `func` (`callable`)\
    \ | 需要缓存的函数。 |\n| `show_spinner` (`boolean`) | 如果设置为 `True`，则在缓存未命中时将显示加载动画。 |\n\
    | `suppress_st_warning` (`boolean`) | 将此参数设置为 `True` 将抑制关于在缓存函数内调用内嵌函数的任何警告。 |\n"
- fmt: "# Appendix A Streamlit Application Program Interface\n\n## Caching with `st.experimental_singleton`\n\
    \n```python\n@st.experimental_singleton\ndef load_nlp(lang):\n    nlp = spacy.load('%s_core_news_sm'\
    \ % (lang))\n    return nlp\n```\n\n```python\n# Initial invocation to cache object\n\
    nlp = load_nlp('es')\n# Subsequent invocation will access the cached object without\
    \ re-executing function\nnlp = load_nlp('es')\n# Will re-execute function and\
    \ recache new object due to modified input parameter\nnlp = load_nlp('de')\n```\n\
    \n## Mutate Data\n\nStreamlit allows you to mutate your data and charts in real\
    \ time by adding a dataframe to the end of a table using the `st.add_rows(data,\
    \ **kwargs)` command.\n\n***Table A-54.** `st.add_rows` parameters*\n\n| Parameter\
    \ | Description |\n|-----------|-------------|\n| `data` (Pandas dataframe or\
    \ styler, PyArrow table, Numpy array, dict, None, or iterable) | The dataframe\
    \ to be appended to an existing table. If a PyArrow table is used, you must set\
    \ the `dataFrameSerialization = 'arrow'` in the config file; for further information,\
    \ please refer to Section 3.1. |\n| `**kwargs` (Pandas dataframe, Numpy array,\
    \ dict, None, or iterable) | Should you need to do so, you can pass the dataframe\
    \ to append as a named object, i.e., `'dataset' = df`. |\n\n![](index-486_1.jpg)\n\
    \n## Mutating tables with `st.add_rows`\n\n```python\ntable = st.table(pd.DataFrame(data={'a':[1,2],\
    \ 'b':[3,4]}))\ndf = pd.DataFrame(data={'a':[5,6], 'b':[7,8]})\ntable.add_rows(df)\n\
    ```\n\n## A.1.11 The Hamburger Menu\n\nStreamlit by default is equipped with a\
    \ hamburger menu at the top-right corner of the web page. This menu provides a\
    \ host of additional features that may be of use to the user and developer alike.\
    \ Table A-55 summarizes the available features.\n\n***Table A-55.** Hamburger\
    \ menu features*\n\n| Feature | Description |\n|---------|-------------|\n| Return\
    \ | When clicked, Streamlit will rerun the script from top to bottom. |\n| Settings\
    \ | Opens a window where the user can customize the theme's appearance, color,\
    \ font, and other associated settings. For further information, please refer to\
    \ Section 3.1. |\n| Record a screencast | As the name suggests, this feature allows\
    \ you to record the video and audio feed from your browser window and save it\
    \ in the `webm` format. |\n| Report a bug | This option opens a link to the GitHub\
    \ page where you can report a bug. Alternatively, you may choose to link this\
    \ option to any other URL you require as shown in Section 3.1. |\n| Get help |\
    \ Similarly, this option takes you to the Streamlit discussion page where you\
    \ can raise concerns and ask questions. It may be linked to another URL if required\
    \ as shown in Section 3.1. |\n| About | This option displays a modal window with\
    \ the version of Streamlit that you are using. If needed, you may customize the\
    \ text displayed as shown in Section 3.1. |\n| Clear cache | This feature will\
    \ clear any data stored by the `st.cache` command. For further information, please\
    \ refer to Section 4.1. |\n| Deploy this app | Streamlit allows you to deploy\
    \ your application to their server referred to as Streamlit Cloud directly with\
    \ this option. |\n| Streamlit Cloud | This link takes you to the home page for\
    \ Streamlit Cloud that provides further information about their hosting service.\
    \ |\n| Report a Streamlit bug | Identical to the Report a bug feature, this option\
    \ will take you to the GitHub page where you can raise bugs and concerns. |\n\
    | Visit Streamlit docs | This link will simply take you to Streamlit's API. |\n\
    | Visit Streamlit forums | Likewise, this link will take you to Streamlit's forum.\
