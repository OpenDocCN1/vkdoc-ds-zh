    \nChapter 10 Building Streamlit ComponentS\n\n**10.4 Component in Focus:**\n\n\
    **Extra-Streamlit- Components**\n\nStreamlit as a framework is constantly evolving,\
    \ which means it may\n\nnot offer certain bespoke features that you may need for\
    \ a production-\n\nready web application. Features such as application routing\
    \ and having\n\ncustom URLs for multiple views or saving user-related data on\
    \ the\n\nbrowser side. Apart from our usability requirements, sometimes it may\n\
    \njust be necessary to offer a unique look and feel for the application or to\n\
    \nadd a widget which is not natively supported by Streamlit. Previously,\n\nwe\
    \ learned how to make a simple custom component; however, with\n\ncomponents the\
    \ sky is truly the limit, and in this chapter, we will showcase\n\n*Extra-Streamlit-Components\
    \ (STX)*, an open source collection of intricate Streamlit components and services.\
    \ In addition, we will explain how\n\nevery subcomponent is built from the Streamlit\
    \ and ReactJS perspective,\n\nand hopefully creative developers will be inspired\
    \ enough to unleash\n\ncomponents of their own.\n\n**10.4.1 Stepper Bar**\n\n\
    This is inspired by Material UI’s Stepper. As mentioned before, ReactJS’s\n\n\
