    \ [3-7](#index_split_000.html#p111)*\n\n**3.3 Provisioning Multipage Applications**\n\
    \nPagination and scalability are inherent needs for any web application,\n\nand\
    \ with Streamlit there are indeed multiple ways to address such needs\n\nin intuitive\
    \ and accessible ways. Simply put, the limit to the breadth of an\n\napplication\
    \ when using Streamlit is really the limit of one’s desires.\n\n**3.3.1 Creating\
    \ Pages**\n\nThe need to create pages within any web application is inherent,\
    \ and with\n\nStreamlit you have the option of creating your own pages to organize\
    \ your\n\ncontent accordingly. To begin with, you will require one main script\
    \ that\n\nwill house the main page of your application with routes to all the\
    \ other\n\npages as shown in Listin[g 3-8. I](#index_split_000.html#p113)n this\
    \ main script, you will initially import all of the other pages’ scripts (Listin[gs\
    \ 3-9 and 3-10) b](#index_split_000.html#p114)y writing *from pages.*\n\n*page_1\
    \ import main_page_1*. Please note that if the scripts for the pages are located\
    \ within another folder, then you will need to append the name\n\nof the folder\
    \ to the script name to import it, that is, *from pages.page_1*.\n\nSubsequently,\
    \ you will create a drop-down menu using a widget such as *st.*\n\n*selectbox*\
    \ with the names of each page and create a dictionary that contains the name of\
    \ each page as the key and the function to render the page as\n\nthe value. When\
    \ the user selects a page from the menu, the name is passed\n\nChapter 3 arChiteCting\
    \ the User interfaCe\n\nto the dictionary to acquire the corresponding function\
    \ for that page, and\n\nthen that function is invoked to render the page as shown\
