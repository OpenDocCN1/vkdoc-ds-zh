    \nKnowing this, we will add it to the callback of the rating view in ReactJS\n\
    \nas shown in Listin[g 10-9](#index_split_002.html#p294). Then accordingly change\
    \ the component’s __init__.py content to be as shown in Listing [10-10](#index_split_002.html#p295)\
    \ to forward the return value back to our ran Streamlit file.\n\n***Listing 10-9.***\
    \ Final version of RatingStar.tsx\n\n**import** {\n\nStreamlit,\n\nStreamlitComponentBase,\n\
    \nwithStreamlitConnection,\n\n} from \"streamlit-component-lib\"\n\n**import**\
    \ React, { ReactNode } from \"react\"\n\n**import** { Rating } from \"@mui/material\"\
    \n\n**interface** State {}\n\nChapter 10 Building Streamlit ComponentS\n\n**class**\
