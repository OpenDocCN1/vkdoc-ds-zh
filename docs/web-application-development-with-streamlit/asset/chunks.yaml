    \ reference.](https://docs.streamlit.io/library/api-reference)\n\nxxvii\n\n**CHAPTER\
    \ 1**\n\n**Getting Started**\n\n**with Streamlit**\n\nWith the inundation of data,\
    \ and the pace at which it is created, traditional\n\ncomputing methods possess\
    \ limited means to deliver results. On the other\n\nhand, cloud computing acts\
    \ as an enabler, allowing one to overcome the\n\nlimitations of the former. With\
    \ increased scalability, reduced costs, and\n\nenhanced adaptability, cloud service\
    \ providers, developers, and users alike\n\nstand to gain from the fruits of migrating\
    \ to the cloud.\n\nGiven that Python is currently the scripting language of choice\
    \ for most\n\nof the software development community, it is absolutely vital to\
    \ provide\n\na web framework for developers that would bridge their skills gap.\
    \ While\n\nlegacy frameworks such as Flask and Django solicit a firm understanding\n\
    \nof HTML and CSS, Streamlit is the first major framework that is all pure\n\n\
    Python, thereby reducing development time from weeks to hours.\n\n**1.1 Why Streamlit?**\n\
    \nLimiting oneself to local computing options is simply a figment of the\n\ndistant\
    \ past, given that the cloud unlocks a host of advantages and allows\n\ndevelopers\
    \ to leave a tangibly greater impact on the world. It is for this\n\nvery reason\
    \ that an entire new echelon of developers are beginning to\n\nembrace everything\
    \ cloud, and the rapid transition toward this new\n\n© Mohammad Khorasani, Mohamed\
    \ Abdou, Javier Hernández Fernández 2022\n\nM. Khorasani et al., *Web Application\
    \ Development with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6_1](https://doi.org/10.1007/978-1-4842-8111-6_1#DOI)\n\
    \nChapter 1 GettinG Started with Streamlit\n\nparadigm of computing is a testament\
    \ to that fact. And this is exactly where\n\na pure Python web framework such\
    \ as Streamlit can deliver a lot of value\n\nto developers who want to make the\
    \ transition but who need an enabler\n\nto do so.\n\n**1.1.1 Local vs. the Cloud**\n\
    \nThe cloud is rapidly becoming synonymous with data itself. Quite literally,\n\
    \nwherever there is an abundance of data, it is somehow intertwined with\n\ncloud\
    \ computing. Put into layman’s terms, it is simply inconceivable to\n\nharness\
    \ the value of big data without utilizing the resources of the cloud.\n\nGone\
    \ are the days where one would brandish Microsoft Excel to create a\n\n1990s style\
    \ dashboard for their dataset. With the sheer magnitude of data\n\nexposed to\
    \ us, local computing will not make the cut.\n\nEven still, there are certain\
    \ tangible benefits to local computing,\n\nnamely, prototyping an idea is considerably\
    \ faster, and latency between\n\nnodes and servers is several orders of magnitude\
    \ smaller. This is why\n\nedge computing still holds an “edge” over the cloud,\
    \ no pun intended.\n\nIn addition, there are applications for which security is\
    \ sacrosanct and/\n\nor regulations are inhibiting, and in that case, one may\
    \ be better off\n\ndisconnecting themselves from the world at large. Other than\
    \ that, there\n\nis not much else that one can attribute to the list of benefits\
    \ of local\n\ncomputing. However, there is a plethora of reasons why you should\
    \ steer\n\nclear of it. To name a few, the bottom line will be quite lower with\
    \ the\n\noverheads solicited to run the infrastructure at hand. There will also\
    \ be\n\nvery limited adaptability to fluctuating traffic; imagine the half-time\
    \ surge\n\nin traffic during the Super Bowl, you simply will not be able to scale\
    \ to\n\nmeet demand.\n\nOn the other hand, cloud computing is cheaper to provision,\n\
    \nexceedingly adaptable to demand, highly robust against failure, and\n\nsupremely\
    \ reliable to run. In addition, cloud computing platforms enable\n\nscalability\
    \ in two dimensions – horizontal and vertical. Horizontal for\n\nChapter 1 GettinG\
    \ Started with Streamlit\n\nwhen you need multiple instances of the same computing\
    \ resources and\n\nvertical for when you need bespoke resources, the likes of\
    \ GPUs, TPUs,\n\ndatabase systems, and more. Perhaps, the single most salient\
    \ factor about\n\nthe cloud is that it expands your horizons and allows you to\
    \ offer your\n\nproduct as a service on the World Wide Web. The latest paradigm\
    \ shift in\n\ntech is to offer quite literally anything as a service. The as-a-service\
    \ model\n\n(aaS) can be applied to software (SaaS), machine learning (MLaaS),\
    \ and\n\nany other product that can be offered as a web application on the Internet.\n\
    \nAnd this is precisely where a web framework such as Streamlit fits the bill.\n\
    \nStreamlit is a cloud enabler for those of us in the software development\n\n\
    community that have been unable to deploy our value to the Internet due\n\nto\
    \ a hefty skills gap that has thus far impeded us from doing so. Concisely\n\n\
    put, Streamlit is a means of empowerment for developers at all levels.\n\n**1.1.2\
    \ A Trend Toward Cloud Computing**\n\nCloud computing is north, south, east, and\
    \ west. Academia, the corporate\n\nworld, governments, and even spy agencies are\
    \ shifting from local\n\nto the cloud at a breathtaking pace. With legacy software\
    \ providing\n\nlimited means for growth and return on investments, organizations\
    \ are\n\nincreasingly migrating to cloud service providers who in turn offer agility,\n\
    \neconomies-of-scale, and advanced computing resources. Even CSPs\n\nthemselves\
    \ are jumping on the bandwagon, with the likes of Google and\n\nMicrosoft offering\
    \ their legacy applications on the cloud with Google G\n\nSuite and Microsoft\
    \ Office 365.\n\nEvidently, from a business perspective, the justification is\
    \ even more\n\nso robust. Disruptive businesses are as pervasive as they have\
    \ ever been\n\nand have wholly championed what others had so far been reluctant\
    \ to\n\naccept. Therefore, embracing the cloud is no longer a subjective decision\n\
    \nbut rather a means for survival. With reduced lead time, scalability, limited\n\
    \ncapital investments, and increased innovation, businesses stand to gain\n\n\
    a great deal. From a CSP perspective, this proposition is possibly even\n\n![](index-28_1.jpg)\n\
    \nChapter 1 GettinG Started with Streamlit\n\nmore enticing. Equipped with the\
    \ cloud, CSPs are able to pool resources\n\ntogether, increase resource elasticity,\
    \ and reduce maintenance and\n\noverheads. And perhaps most importantly, from\
    \ a consumer’s point of\n\nview, the cloud is the best thing that ever happened\
    \ since the Internet\n\nitself. As a consumer, the SaaS model offers unparalleled\
    \ flexibility, price\n\ngranularity, and plenty more bang for the buck. In other\
    \ words, the cloud is\n\nwin-win-win; everyone stands to gain.\n\nWhile the trend\
    \ toward cloud computing was already on a healthy\n\ntrajectory, a once-in-a-century\
    \ pandemic doubled as a booster toward\n\neverything cloud. The pandemic all but\
    \ destroyed the stigma associated\n\nwith remote learning, online examinations,\
    \ working from home, and\n\nother dogma that decades of noble efforts by the tech\
    \ community had\n\nfailed to make a dent into. It is fair to assume that from\
    \ here onward, the\n\nprogression toward everything cloud will exceed the prediction\
    \ of pundits.\n\nAnd if numbers alone can serve to indicate where we are heading,\
    \ then\n\none should feast themselves on the omen of Figur[e 1-1.](#index_split_000.html#p28)\n\
    \n***Figure 1-1.** Growth of the public cloud computing market from 2008*\n\n\
    *to 2020\\. Source: [statista.com [13]](http://statista.com)*\n\nChapter 1 GettinG\
    \ Started with Streamlit\n\n**1.1.3 History of Web Frameworks in Python**\n\n\
    Web development can be quite an arduous task, soliciting a\n\nmultidisciplinary\
    \ team with expertise in frontend, backend, and server- side\n\nsoftware development.\
    \ It is for this very reason that full-stack developers\n\nwho brandish the know-how\
    \ for the entire development process are in\n\nsurplus demand and are often in\
    \ receipt of a handsome compensation.\n\nTraditionally, these developers would\
    \ resort to using JavaScript, PHP,\n\nor Perl to develop web applications, with\
    \ Python being sidelined as a local\n\nscripting language. This was due to the\
    \ fact that Python is not inherently\n\ndesigned to run on the Internet and requires\
    \ a web framework to interface\n\nwith web servers and browsers. Over the years\
    \ however, the community\n\nhas developed several novel frameworks that allow\
    \ Python to be utilized\n\neffectively for the Internet. And given Python’s emphasis\
    \ on simplicity,\n\nreadability, rich ecosystem of libraries, and being open source,\
    \ it has\n\nsteadily transformed into one of the main web scripting languages\
    \ of\n\nchoice for many developers. Python has even gained enough traction to\n\
    \nbeing adopted by heavyweights, the likes of Google and Instagram.\n\nGenerally,\
    \ such web frameworks come in two types, full-stack\n\nand nonfull-stack. They\
    \ manage everything from communications\n\nand infrastructure to other lower-level\
    \ abstractions required by web\n\napplications. Nontrivial applications require\
    \ a slew of functionalities\n\nincluding but not limited to interpreting requests,\
    \ producing responses,\n\nstoring data, and rendering user interfaces. For such\
    \ applications, one\n\nwould often utilize a full-stack framework that provides\
    \ an in-house\n\nsolution for all the technical requirements. This contrasts with\
    \ nonfull-\n\nstack frameworks otherwise known as microframeworks that provide\
    \ a\n\nbare minimum level of functionality, typically limited to routing HTTP\n\
    \nrequests to the relevant controllers, dispatching the controller, and\n\nsubsequently\
    \ returning a response. Such frameworks are usually stacked\n\nwith other APIs\
    \ and tools in order to create applications. Some of the most\n\npopular examples\
    \ of each type are listed in the following sections.\n\nChapter 1 GettinG Started\
    \ with Streamlit\n\n**1.1.4 Flask**\n\nFlask was developed in 2010 by Armin Ronacher\
    \ from what was\n\nallegedly an April fool’s joke to begin with. Flask is a nonfull-stack\
    \ or\n\nmicroframework that provisions an application server without offering\n\
    \nmuch else in terms of components. Flask is composed of two main\n\nelements:\
    \ *Werkzeug*, a tool that lends support for HTTP routing, and *Jinja*, a template\
    \ engine used to render basic HTML pages. In addition, Flask\n\nuses *MarkupSafe*\
    \ as a string handling library and *ItsDangerous* as a secure data serialization\
    \ library to store session data as cookies.\n\nFlask is a minimalistic framework\
    \ that is equipped with the bare\n\nminimum of the components required to render\
    \ a web application.\n\nConsequently, the developer is afforded a great deal of\
    \ autonomy and\n\nalso responsibility to create their own application. As a result,\
    \ Flask is best suited for static websites and for experienced developers who\
    \ are able to\n\nprovision most of their own infrastructure and render their own\
    \ interfaces.\n\n**1.1.5 Django**\n\nDjango was developed by a group of web programmers\
    \ in 2003 who\n\nused Python to build web applications. It allows developers to\
    \ create\n\ncomplex applications with relatively less overhead in comparison to\
    \ Flask.\n\nSpecifically, Django enables programmers to render dynamic content\n\
    \nwith enhanced scalability and with in-house capabilities to interface with\n\
    \ndatabase systems using object-relational mapping.\n\nIn addition, there are\
    \ a host of other modules including but not limited\n\nto ecommerce, authentication,\
    \ and caching packages that allow the\n\ndeveloper to readily provision extended\
    \ services. Bundled with a multitude\n\nof other third-party packages, Django\
    \ allows the developer to focus mainly\n\non the idea while not having to worry\
    \ much about the implementation.\n\nChapter 1 GettinG Started with Streamlit\n\
    \n**1.1.6 Dash**\n\nDash is a web framework developed by Plotly to render enterprise-\n\
    \ngrade web applications in Python, R, and even Julia. Given that Plotly\n\npredominantly\
    \ develops data analytics and visualization tools, similarly\n\nDash is more often\
    \ used to create dashboards. Even still, it is indeed\n\npossible to create a\
    \ host of general-purpose applications with due to its\n\nextended customizability.\n\
    \nDash has the ability to natively support D3.js charts and provides\n\ndefault\
    \ HTML and CSS templates to use. However, for more tailored\n\ninterfaces, developers\
    \ must be well versed with frontend programming\n\nthemselves. Furthermore, Dash\
    \ tenders an enterprise package that\n\nenables experienced developers to deploy\
    \ their applications on the cloud\n\nwith production-grade capabilities such as\
    \ authentication and database\n\nsystems.\n\n**1.1.7 Web2Py**\n\nWeb2Py is a full-stack\
    \ web framework for Python which like Django\n\nmakes use of the model view controller\
    \ architectural paradigm. It allows\n\ndevelopers to create primitive yet dynamic\
    \ content with relative ease and\n\ninterfaces natively with database systems.\
    \ The novelty of this framework\n\nas opposed to others is that it comes with\
    \ its own web-based integrated\n\ndevelopment environment equipped with a ticketing\
    \ system for error\n\ntracking and management.\n\nThe main disadvantage however\
    \ is that Web2Py executes objects\n\nand controllers via a single global environment\
    \ that is initiated at each\n\nHTTP request. While this has its benefits, it does\
    \ also carry the pitfalls of\n\nexperiencing compromised performance and incompatibility\
    \ issues with\n\ncertain modules.\n\nChapter 1 GettinG Started with Streamlit\n\
    \n**1.1.8 The Need for a Pure Python**\n\n**Web Framework**\n\nPreviously, the\
    \ community of Python developers would have to suffice\n\nwith deploying their\
    \ software locally as desktop applications unless they\n\ncommanded adept knowledge\
    \ of HTML, CSS, and JavaScript. With Tkinter and\n\nPyQt, programmers can indeed\
    \ produce complex, dynamic, and aesthetically\n\npleasing interfaces, albeit with\
    \ the heartbreak of not being able to render it on the Web. And this has largely\
    \ been the predicament of many Python loyalists,\n\nwho, up until recently, had\
    \ no pure Pythonic way of migrating to the cloud.\n\nIt was always quite demeaning\
    \ to peruse through repository after\n\nrepository of awesome applications developed\
    \ by people who had no other\n\nway of exposing their goodness to the world than\
    \ sharing the source code with\n\nothers hoping that they would be able to replicate\
    \ it locally. Oh, and forget\n\nabout the nontechnical users who had no hope whatsoever\
    \ of executing\n\neven as much as that. Countless noble efforts were left largely\
    \ unutilized in\n\nvain as a result. In other words, the community was in desperate\
    \ need of a\n\nmajor framework that would solicit no additional expertise other\
    \ than the\n\nknowledge of writing your average Python script and being able to\
    \ deploy it\n\ninstantly to a cloud server. Then came along Streamlit and freed\
    \ developers\n\nfrom the shackles of HTML, CSS, and JavaScript. The rest will\
    \ be history.\n\n**1.1.9 Academic Significance**\n\nBeing able to create web apps\
    \ directly from Python easily has made\n\nStreamlit a valuable tool for academia\
    \ [1]. Despite its recent creation,\n\nthe first beta release is dated April 2019;\
    \ research teams worldwide\n\nhave started adopting the framework to showcase\
    \ the outcomes of their\n\nprojects. Today, many publications already mention\
    \ Streamlit as their\n\nvisualization framework covering a wide range of fields.\
    \ Some of these\n\nareas include health [2, 3, 4, 5], computer science [6, 7,\
    \ 8, 9], economics\n\n[11, 10], and civil engineering [12], to mention a few.\n\
    \nChapter 1 GettinG Started with Streamlit\n\n**1.2 Firing It Up**\n\nBeing the\
