- fmt: "complete a task without having access to their username and password. An optional\
    \ value will be supplied to the `<input>` element’s `autocomplete` property. This\
    \ value will be set to `\"new-password\"` for `\"password\"` input types and the\
    \ empty string for `\"default\"` input types. More details in [https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/autocomplete](https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/autocomplete).\n\
    \n`on_change( *callable*)` Callback function invoked when the widget’s value changes.\n\
    \n`args( *tuple*)` Tuple of arguments to pass to the callback.\n\n`kwargs( *dict*)`\
    \ Dictionary of keyword arguments to pass to the callback.\n\n`placeholder( *str\
    \ or None*)` optional string to be displayed if there is no text input.\n\n`disabled(\
    \ *bool*)` Boolean argument used to disable the widget.\n\nThe example shows the\
    \ use of mask text in a single-line text box:\n\n```python\npassword = st.text_input('Insert\
    \ your password:', value='1234',\n                         max_chars=24,\n   \
    \                      type='password')\nst.write('The entered password is', password)\n\
    ```\n\n## Appendix A Streamlit Application Program Interface\n\n### Number Input\n\
    \nA numeric input widget can be added to our websites with the following command:\
    \ `st.number_input(label, min_value, max_value, value=0.0, step=1, format, key,\
    \ help, on_change, args, kwargs, disabled=False)` ➤ `int` or `float`.\n\n**Table\
    \ A-30.** `st.number_input` parameters\n\n| Parameter | Description |\n|-----------|-------------|\n\
    | `label( *str*)` | Label for the number input widget. |\n| `min_value( *int or\
    \ float or None*)` | The minimum accepted value. |\n| `max_value( *int or float\
    \ or None*)` | The maximum accepted value. |\n| `value( *int or float or None*)`\
    \ | First render value of this widget. Defaults to `min_value`, or `0.0` if `min_value`\
    \ is none. |\n| `step( *int or float or None*)` | The stepping interval. By default,\
    \ set to 1 for int and 0.01 for all other options. For no specified values, it\
    \ will default to the `format` parameter. |\n| `format( *str or None*)` | A custom\
    \ format string that specifies how the interface should render numbers in a printf-style\
    \ format. The return value is not affected by the conversion. `%d`, `%e`, `%f`,\
    \ `%g`, and `%i` are supported for formatting int/float values. For date/time/datetime\
    \ formatting, use Moment.js syntax: [https://momentjs.com/docs/#/displaying/format/](https://momentjs.com/docs/#/displaying/format/).\
    \ |\n| `key( *str or int*)` | Unique key, string or integer, to reference the\
    \ button in the code. The parameter is optional and will be automatically generated\
    \ if not provided. |\n| `help( *str*)` | Tooltip to be displayed when the cursor\
    \ is hovered over the widget. |\n| `on_change( *callable*)` | Callback function\
    \ invoked when the widget’s value changes. |\n| `args( *tuple*)` | Tuple of arguments\
    \ to pass to the callback. |\n| `kwargs( *dict*)` | Dictionary of keyword arguments\
    \ to pass to the callback. |\n| `disabled( *bool*)` | Boolean argument used to\
    \ disable the widget. |\n\nA simple 1 to 100 selection, in steps of 1 unit, snippet\
    \ implementation of the number input command is shown as follows:\n\n```python\n\
    selection = st.number_input('Choose a number from 1 to 100:',\n              \
    \              min_value=0, max_value=100, value=50, step=1)\nst.write('The current\
    \ number is ', selection)\n```\n\n### Text Area\n\nA multiline text input can\
    \ be added to our websites with the following command: `st.text_area(label, value,\
    \ height, max_chars, key, help, on_change, args, kwargs, placeholder, disabled=False)`\
    \ ➤ `str`.\n\n**Table A-31.** `st.text_area` parameters\n\n| Parameter | Description\
    \ |\n|-----------|-------------|\n| `label( *str*)` | Label explaining the use\
    \ of the input widget. |\n| `value( *any*)` | Default text shown when the widget\
    \ is first rendered. Internally, this will be cast to `str`. |\n| `height( *int\
    \ or None*)` | Height in pixels of the UI element. |\n| `max_chars( *int or None*)`\
    \ | The maximum number of characters permitted in the text area. |\n| `key( *str\
    \ or int*)` | Unique key, string or integer, to reference the button in the code.\
    \ The parameter is optional and will be automatically generated if not provided.\
    \ |"
