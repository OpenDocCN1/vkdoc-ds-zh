    ## A.1.3 显示图表


    Streamlit 另一个擅长的领域是数据可视化。无论是使用其原生命令渲染图表，还是显示来自 Matplotlib、Altair、Vega-Lite、Plotly、Bokeh、PyDeck
    或 Graphviz 的第三方图表，Streamlit 都能让你轻松集成可视化。


    ### 折线图、面积图和柱状图


    可以使用 `st.line_chart`、`st.area_chart` 和 `st.bar_chart` 命令渲染简单的折线图、面积图和柱状图。要显示图表，可以使用以下命令：`st.line_chart
    / st.area_chart / st.bar_chart(data, width, height, use_container_width)`。


    #### 表 A-12. `st.line_chart`、`st.area_chart` 和 `st.bar_chart` 参数


    | 参数 | 描述 |

    |-----------|-------------|

    | `data` (`pandas.DataFrame`, `pandas.Styler`, `pyarrow.Table`, `numpy.ndarray`,
    `Iterable`, `dict`, 或 `None`) | 要绘制的数据。Streamlit 的旧版数据框序列化不支持 PyArrow 表（即 `config.dataframeSerialization
    = ''legacy''`）。要使用 PyArrow 表，请将配置设置更改为 `config.dataframeSerialization = ''arrow''`。
    |

    | `width` (`int`) | 图表宽度尺寸，单位为像素。如果为零，则自动确定宽度。 |

    | `height` (`int`) | 图表高度尺寸，单位为像素。如果为零，则自动确定高度。 |

    | `use_container_width` (`bool`) | 当为 `True` 时，图表宽度将调整为列宽。此参数优先于 `width` 参数。 |


    ![](img/index-422_1.jpg)


    以下示例展示了三种图表选项的堆叠使用，并限制了高度：


    ```

    chart_data = pd.DataFrame(

    np.random.randn(10, 2),

    columns=[''Value 1'', ''Value 2''])

    st.line_chart(chart_data, height=125)

    st.area_chart(chart_data, height=125)

    st.bar_chart(chart_data, height=125)

