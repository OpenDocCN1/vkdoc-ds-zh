    \n**2.5 Summary**\n\nThis chapter has been a rigorous one indeed. At this point,\
    \ you should\n\nhave gotten up to speed with the gist and essence of Streamlit\
    \ and should\n\nhave also developed a fairly clear idea of its capabilities. You\
    \ have been\n\nintroduced to the diverse set of commands in the Streamlit API\
    \ that pertain\n\nfrom everything related to displaying text, tables, and charts\
    \ to rendering\n\ninteractive widgets, and multimedia objects, to commands that\
    \ allow you\n\nto organize the page and optimize Streamlit for efficient use with\
    \ big data.\n\nIn the latter part of this chapter, we covered the basics of creating\n\
    \na trivial web application. This included creating forms, implementing\n\nconditional\
    \ flow, managing exceptions, mutating data, as well as rendering\n\na variety\
    \ of visualizations, and bundling all of these elements together\n\nin the form\
    \ of one user interface. In short, after having perused this\n\nchapter, you should\
    \ feel confident enough to proceed with developing a\n\nstraightforward web application\
    \ of your own in Streamlit.\n\n**CHAPTER 3**\n\n**Architecting the User**\n\n\
    **Interface**\n\nWith Streamlit, the developer is able to focus on implementing\
    \ their\n\nbackend logic while leaving the frontend implementation largely to\
    \ the\n\nframework itself. In addition, using Streamlit you can render responsive\n\
    \ninterfaces for PC, tablet, and mobile platforms at your fingertips with no\n\
    \nadded overhead. However, should one need to develop more bespoke\n\nand tailored\
    \ applications, Streamlit affords a considerable degree of\n\ncustomization of\
    \ its frontend design to the developer without soliciting\n\nany knowledge of\
    \ HTML, CSS, or JavaScript. One may configure their\n\napplication using a multitude\
    \ of color schemes, fonts, and appearances\n\nboth graphically and programmatically.\n\
    \nFurthermore, Streamlit gives you the ability to immaculately structure\n\nand\
    \ organize the web page using a combination of a sidebar, columns,\n\nexpanders,\
    \ and containers. Together, these elements can offer the user\n\nan enhanced experience\
    \ while making efficient use of the space on the\n\npage. Furthermore, with placeholders\
    \ and progress bars, you can render\n\ndynamic content on demand or in response\
    \ to an event. And most\n\nimportantly, with Streamlit you can create as many\
    \ pages and nested\n\nsubpages as required for your application in a highly modularized\
    \ and\n\nscalable way.\n\n© Mohammad Khorasani, Mohamed Abdou, Javier Hernández\
    \ Fernández 2022\n\nM. Khorasani et al., *Web Application Development with Streamlit*,\n\
    \n[https://doi.org/10.1007/978-1-4842-8111-6_3](https://doi.org/10.1007/978-1-4842-8111-6_3#DOI)\n\
    \nChapter 3 arChiteCting the User interfaCe\n\n**3.1 Designing the Application**\n\
    \nWhile designing a Streamlit application, we can make use of the multitude\n\n\
    of native methods it provides to customize our page to be exactly the way\n\n\
    we want. From color schemes and themes to columns, expanders, sidebar,\n\nand\
    \ placeholders, the number of design permutations we can achieve is\n\nendless.\n\
    \n**3.1.1 Configuring the Page**\n\nWith Streamlit, you have the ability to configure\
    \ several attributes of the\n\nweb page, namely, configuring the page layout,\
    \ initial sidebar state, page\n\ntitle (displayed on the browser), icon, hamburger\
    \ menu state, footer, and\n\nmore. While some of these items can be configured\
    \ within your script, the\n\nrest must be set within the global config file */.streamlit/config.toml*\
    \ that was discussed in Section 1.2.\n\n**Basic Page Configuration**\n\nListin[g\
    \ 3-1 c](#index_split_000.html#p89)an be used to configure the page title, icon,\
    \ layout, initial sidebar state, and menu items as shown in Figure [3-1](#index_split_000.html#p90).\
    \ Please note that the page icon supports *.ico* files. You may use the package\
    \ *Pillow* to import and handle images. The page layout can be *‘centered’* or\
    \ *‘wide’*, and the initial sidebar state can be *‘auto’*, *‘expanded’*, or *‘collapsed’*.\
    \ In addition, you may choose to customize one or more of the following pages\
    \ in the hamburger\n\nmenu: *‘Get help’*, *‘Report a bug’*, or *‘About’*. The\
    \ *Get help* and *Report a bug* pages can only be instantiated with a URL that\
    \ will redirect the user to\n\nanother web page. The *About* page can be instantiated\
    \ as a modal window\n\nthat will appear as shown in Figure [3-2](#index_split_000.html#p90).\n\
