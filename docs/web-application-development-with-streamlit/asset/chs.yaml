  \ `float`），或以减号开头的字符串，箭头将呈红色并向下指向；所有其他选项将显示为绿色并向上指向。如果 delta 设置为 `None`（默认选项），则不会显示此子指示器。\
  \ |\n| `delta_color` (`str`) | 此属性默认反转正负值的颜色和箭头方向。适用于那些负向变化可能被视为好事的情况，反之亦然。如果设置为\
  \ `\"off\"`，则所有情况下 delta 都将显示为灰色。 |\n\n以下示例展示了一个不带 delta 的温度指标指示器。然后通过 delta 选项调整该指示器，以反映相对于上一个值的变化。\n\
