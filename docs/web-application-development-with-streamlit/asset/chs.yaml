- "# 附录 A STREAMLIT 应用程序编程接口\n\n## A.1.4 输入组件\n\nStreamlit 提供了一系列丰富多样的输入组件，使开发者能够满足各种使用场景。从简单的按钮、滑块和表单，到颜色选择器、文件上传器和选择框，Streamlit\
  \ 涵盖了所有类型的输入组件。\n\n### 按钮\n\n通用按钮可以通过命令 `st.button(label, key, help, on_click, args,\
  \ kwargs, disabled=False) -> bool` 为任何需求创建。\n\n![](img/index-436_1.jpg)\n\n**表 A-21.**\
  \ `st.button` 参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `label` ( `str` ) | 按钮上显示的标签。\
  \ |\n| `key` ( `str` 或 `int` ) | 用于在代码中引用该按钮的唯一键，可以是字符串或整数。该参数为可选参数，若未提供将自动生成。 |\n\
  | `help` ( `str` ) | 光标悬停在组件上时显示的工具提示。 |\n| `on_click` ( `callable` ) | 按钮被点击时调用的回调函数。\
  \ |\n| `args` ( `tuple` ) | 传递给回调函数的参数元组。 |\n| `kwargs` ( `dict` ) | 传递给回调函数的关键字参数字典。\
  \ |\n| `disabled` ( `bool` ) | 用于禁用该组件的布尔参数。 |\n\n以下示例展示了当按钮被点击时，如何显示一个简单算术计算的结果：\n\
  \n```python\ndef addition(a,b):\n    result = a + b\n    return result\n\nif st.button('不太有用的按钮',\
  \ key='b1'):\n    st.text('不太有用的按钮已点击')\n    st.write(addition(1,2))\n```\n\n###\
  \ 下载按钮\n\n可以使用以下命令将下载按钮添加到我们的网站中：`st.download_button(label, data, file_name, mime,\
  \ key, help, on_click, args, kwargs, disabled=False) -> bool`。\n\n**表 A-22.** `st.download_button`\
  \ 参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `label` ( `str` ) | 说明按钮用途的标签。 |\n| `data`\
  \ ( `str` 或 `bytes` 或 `file` ) | 要下载的文件内容。使用缓存以避免每次重新运行时重复计算。 |\n| `file_name` (\
  \ `str` ) | 要下载的文件名称。如果未指定，将自动创建名称。 |\n| `mime` ( `str` 或 `None` ) | 数据的 MIME 类型。文本文件默认为\
  \ `\"text/plain\"`，二进制文件默认为 `\"application/octet-stream\"`。 |\n| `key` ( `str` 或\
  \ `int` ) | 用于在代码中引用该按钮的唯一键，可以是字符串或整数。该参数为可选参数，若未提供将自动生成。 |\n| `help` ( `str` )\
  \ | 光标悬停在组件上时显示的工具提示。 |\n| `on_click` ( `callable` ) | 按钮被点击时调用的回调函数。 |\n| `args`\
  \ ( `tuple` ) | 传递给回调函数的参数元组。 |\n| `kwargs` ( `dict` ) | 传递给回调函数的关键字参数字典。 |\n| `disabled`\
  \ ( `bool` ) | 用于禁用该组件的布尔参数。 |\n\n![](img/index-438_1.png)\n\n以下示例展示了如何使用下载按钮将 Pandas\
  \ 数据框下载为 CSV 文件：\n\n```python\nimport pandas as pd\n\ndata = pd.DataFrame({'a':[1,2,3],'b':[4,5,6]}).to_csv().encode('utf-8')\n\
  st.download_button(\n    label='下载 CSV',\n    data=data,\n    file_name='data.csv',\n\
  \    mime='text/csv'\n)\n```\n\n### 复选框\n\n可以使用以下命令将复选框添加到我们的网站中：`st.checkbox(label,\
  \ value, key, help, on_change, args, kwargs, disabled=False) -> bool`。\n\n**表 A-23.**\
  \ `st.checkbox` 参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `label` ( `str` ) | 复选框的标签。\
  \ |\n| `value` ( `bool` ) | 选择首次渲染时复选框是否默认预选。内部会将其转换为 `bool` 类型。 |\n| `key` ( `str`\
  \ 或 `int` ) | 用于在代码中引用该按钮的唯一键，可以是字符串或整数。该参数为可选参数，若未提供将自动生成。 |\n| `help` ( `str`\
  \ ) | 光标悬停在组件上时显示的工具提示。 |\n\n*(续)*\n\n![](img/index-439_1.png)\n\n**表 A-23.** *(续)*\n\
  \n| 参数 | 描述 |\n| :--- | :--- |\n\n\n\n`on_change( *callable*)` 当控件值发生变化时调用的回调函数。\n\
  \n`args( *tuple*)` 传递给回调函数的参数元组。\n\n`kwargs( *dict* )` 传递给回调函数的关键字参数字典。\n\n`disabled(\
  \ *bool* )` 用于禁用控件的布尔参数。\n\n复选框控件选中与未选中的行为如下所示：\n\n```\nchoice = st.checkbox('Healthy\
