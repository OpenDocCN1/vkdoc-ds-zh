  ```\n\n`![](img/index-466_1.jpg)`\n\n## A.1.6 页面结构\n\n使用 Streamlit，您可以通过四种方式组织网页，即：侧边栏、多列布局、可折叠面板和容器，或将它们组合使用以自定义用户体验。此外，您还可以使用占位符有效预留网页空间，以便在需要时按需使用。\n\
  \n### 侧边栏\n\nStreamlit 通过 `st.sidebar` 命令提供一个侧边栏，该侧边栏可根据页面大小展开、收缩或自动部署。您可以通过追加函数的方式向其添加任何其他微件或元素（`st.echo`\
  \ 和 `st.spinner` 除外）。\n\n以下示例展示了如何配合另一个 Streamlit 元素使用侧边栏：\n\n```python\nst.sidebar.title('Hello\
  \ world')\n```\n\n`![](img/index-467_1.jpg)`\n\n### 多列布局\n\n使用多列布局时，您可以通过命令 `st.columns(spec)`\
  \ ➤ `list` 将网页垂直划分为指定宽度的列。该命令返回一个列列表，随后可使用 `with` 语句调用。\n\n**表 A-42.** `st.columns`\
  \ 参数\n\n| 参数 | 说明 |\n| --- | --- |\n| `spec(int 或数字列表)` | 若为整数，则指定创建相同宽度的列数。若使用数字列表，则会为每个数字创建一列，其宽度与该数字成比例。\
  \ |\n\n`![](img/index-468_1.jpg)`\n\n以下示例展示了如何在 Streamlit 应用程序中使用多列布局：\n\n```python\n\
  col1, col2 = st.columns([1,2])\n\nwith col1:\n    st.text_input('Hello')\n\nwith\
  \ col2:\n    st.text_input('World')\n```\n\n### 可折叠面板\n\nStreamlit 通过 `st.expander(label,`\n\
  ```\n\n\n#### `st.expander`\n\n`st.expander()` 是一个可展开或收缩的命令，它可以通过`with`语句来容纳所有其他小部件或元素。\n\
  \n***表 A-43.** `st.expander` 参数*\n\n| 参数 | 描述 |\n|------|------|\n| `label` (`str`)\
  \ | 展开器小部件的显示名称。 |\n| `expanded` (`boolean`) | 将此参数设置为 `True` 将使小部件在启动时处于展开状态。 |\n\
  \n![](img/index-469_1.jpg)\n\n![](img/index-469_2.jpg)\n\n以下示例展示了如何将展开器与另一个 Streamlit\
  \ 元素一起使用：\n\n```\nwith st.expander('Hello world'):\n    st.title('Hello world')\n\
  ```\n\n### `st.container`\n\n使用 Streamlit 的`st.container()`命令，您可以将多个元素组合到一个不可见的容器中。可以使用`with`语句或将\
  \ Streamlit 元素附加到容器名称后面来将元素添加到容器中。元素可以按需且不按顺序添加到容器中。\n\n以下示例展示了如何在 Streamlit 应用程序中使用容器：\n\
  \n```\ncontainer_1 = st.container()\ncontainer_1.write('Hello')\nst.text_input('Hello\
  \ world')\ncontainer_1.write('World')\n```\n\n![](img/index-470_1.png)\n\n### `st.empty`\
  \ (占位符)\n\nStreamlit 允许您通过使用占位符（可通过`st.empty()`命令调用）在网页中预留位置。您可以使用`with`语句或简单地将元素附加到占位符名称后面，将任何单个元素（或容器中的一组元素）添加到占位符中。您可以随时更新元素或用另一个元素替换它，完成后，您可以通过附加`empty()`来清空占位符。占位符对于生成需要定期更新的动态或动画内容特别有用。\n\
  \n```\nimport datetime\n\nclock = st.empty()\nwhile datetime.datetime.now() < datetime.datetime(2022,\
  \ 1, 12):\n    clock.metric(label='Clock', value=datetime.datetime.now().strftime('%H:%M:%S'))\n\
  clock.empty()\n```\n\n## A.1.7 显示状态和进度\n\n根据您的应用程序，您可能需要向用户显示某个活动的状态和/或进度。使用 Streamlit，我们有多种原生方法可以向用户传达操作所处的确切阶段。\n\
  \n![](img/index-471_1.png)\n\n### `st.progress` (进度条)\n\n使用 Streamlit 的`st.progress(value)`命令，您可以实时显示任何活动的进度。\n\
  \n***表 A-44.** `st.progress` 参数*\n\n| 参数 | 描述 |\n|------|------|\n| `value` (`int`\
  \ 或 `float`) | 进度条渲染时的值。`int` 类型的值范围为 0 到 100，`float` 类型的值范围为 0.0 到 1.0。 |\n\n```\n\
  import time\n\ntimer = st.progress(0)\nfor i in range(0,100):\n    timer.progress(i)\n\
  \    time.sleep(1)\n```\n\n### `st.spinner` (旋转加载器)\n\n使用 Streamlit 的`st.spinner(text)`命令，您可以在可执行代码块中显示临时消息。\n\
  \n***表 A-45.** `st.spinner` 参数*\n\n| 参数 | 描述 |\n|------|------|\n| `text` (`str`)\
  \ | 在执行代码块期间临时渲染的消息。 |\n\n![](img/index-472_1.jpg)\n\n![](img/index-472_2.jpg)\n\
  \n```\nimport time\n\nfor i in range(0,100):\n    with st.spinner('剩余时间：**%s 秒**'\
  \ % (100-i)):\n        time.sleep(1)\n```\n\n### `st.success`, `st.info`, `st.warning`,\
  \ `st.error` (消息)\n\n使用命令`st.success(body)`、`st.info(body)`、`st.warning(body)`和`st.error(body)`，您可以分别显示带有绿色、蓝色、黄色和红色封装框的消息。\n\
  \n***表 A-46.** `st.success`、`st.info`、`st.warning` 和 `st.error` 参数*\n\n| 参数 | 描述\
  \ |\n|------|------|\n| `body` (`str`) | 要渲染的消息。 |\n\n```\ncol1, col2, col3, col4\
  \ = st.columns(4)\n\nwith col1:\n    st.success('Hello world')\nwith col2:\n   \
  \ st.info('Hello world')\nwith col3:\n    st.warning('Hello world')\nwith col4:\n\
  \    st.error('Hello world')\n```\n\n![](img/index-473_1.jpg)\n\n### `st.exception`\
  \ (异常)\n\n使用 Streamlit 的`st.exception(exception)`命令，您可以显示异常类型和相应的消息。\n\n\n\n####\
