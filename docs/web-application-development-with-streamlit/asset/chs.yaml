  ### 日期输入


  可使用以下命令向我们的网站添加一个日期显示输入小部件：`st.date_input(label, value, min_value, max_value, key,
  help, on_change, args, kwargs, disabled=False)` ➤ `value`。


  **表 A-32.** `st.date_input` 参数


  | 参数 | 描述 |

  |-----------|-------------|

  | `label( str )` | 用于说明日期选择意图的标签。 |

  | `value( datetime.date 或 datetime.datetime 或包含 datetime.date 或 datetime.datetime
  的列表/元组 或 无值 )` | 此小部件在首次渲染时显示的值。如果提供的列表/元组包含零到两个日期/日期时间值，则会被视为一个范围。如果未选择任何值，默认值为今天。
  |

  | `min_value( datetime.date 或 datetime.datetime )` | 默认的最小可选日期。如果该值是一个日期，则将其设置为从现在起前推
  10 年。对于区间 [start, finish]，默认值为 start - 10 年。 |

  | `max_value( datetime.date 或 datetime.datetime )` | 最大可选日期。如果该值是一个日期，则将其更新为当前值加上
  10 年。如果该值是区间 [start, end]，则将其更新为 end + 10 年。 |

  | `key( str 或 int )` | 用于在代码中引用此按钮的唯一键，可以是字符串或整数。此参数是可选的，如果未提供，将自动生成。 |

  | `help( str )` | 当光标悬停在小部件上时显示的工具提示。 |

