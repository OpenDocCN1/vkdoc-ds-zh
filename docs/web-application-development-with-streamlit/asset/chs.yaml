  \n要停止 Streamlit 应用程序在脚本中特定点的执行，您可以使用 `st.stop()` 命令来防止其余代码被执行：\n\n```python\nst.write('Hello\
  \ world')\nst.stop()\nst.write('Bye world')\n```\n\n## A.1.9 会话状态管理\n\n实现有状态架构对于许多\
  \ Web 应用程序来说至关重要。从存储用户凭证等会话特定数据到其他变量，缺乏这种能力对许多开发者来说可能是一个决定性因素。请想象一下，在您的应用程序中尝试实现逻辑流程，在一个页面上的用户输入用于在另一个页面上生成可视化。如果不将输入存储为会话变量，一旦您导航到另一个页面或简单地重新运行脚本，它就会被重置，导致您无法获得可视化。幸运的是，Streamlit\
  \ 提供了一种原生且高度直观的方式来无缝管理会话状态，使开发者能够提供增强的用户体验。\n\n### 初始化会话状态变量\n\n\n\n"
- "# Streamlit 会话状态\n\nStreamlit 的会话状态字典由键值对组成，其中每个键必须先初始化才能调用，每个值可以是字符串、整数、列表、字典、数据框、对象或其他变量。要将变量初始化到会话状态中，请按如下步骤操作：\n\
  \n```\nif 'state_1' not in st.session_state:\n    st.session_state['state_1'] =\
  \ None\n```\n\n### 访问会话状态变量\n\n随后，要访问在同一会话中初始化的变量，只需按如下方式调用：\n\n```\nstate_1 = st.session_state['state_1']\n\
  ```\n\n要访问所有会话状态变量，请使用以下命令：\n\n```\nst.write(st.session_state)\n```\n\n![](img/index-479_1.jpg)\n\
  \n附录 A Streamlit 应用程序编程接口\n\n这将返回包含所有已存储键值对的会话状态字典，具体示例如下：\n\n### 更新会话状态变量\n\n要更新会话状态变量的值，请按如下步骤操作：\n\
  \n```\nst.session_state['state_1'] = 'Hello world'\n```\n\n### 删除会话状态变量\n\n要删除特定的会话状态变量，请使用以下方法：\n\
  \n```\ndel st.session_state['state_1']\n```\n\n要一次性删除所有会话状态变量，可以使用以下方法：\n\n```\n\
  for variable in st.session_state:\n    del st.session_state[variable]\n```\n\n###\
  \ 组件会话状态\n\nStreamlit 中的每个组件都会自动关联其自身的会话状态变量，其中键与作为参数传递给组件的键相同，如下所示：\n\n```\nst.button('随机按钮',\
  \ key='random_button_1')\nst.text_input('Hello world', key='hello_world_input')\n\
  st.write(st.session_state)\n```\n\n![](img/index-480_1.jpg)\n\n附录 A Streamlit 应用程序编程接口\n\
  \n请注意，在组件实例化后修改其会话状态的值是不允许的，如果尝试这样做，将会抛出 `StreamlitAPIException` 错误。但是，允许在组件实例化之前设置其状态，不过如果组件的默认值已作为参数设置，将会显示一次性警告信息。\n\
  \n此外，对于包含按钮的组件（如 `st.button`、`st.download_button` 和 `st.file_uploader`），其会话状态值不可修改；默认情况下，它们被设置为\
  \ `False`，点击时会切换为 `True`。\n\n## A.1.10 数据管理\n\n对于 Web 服务器而言，管理数据以实现计算资源的最优使用至关重要。考虑到我们面对的数据规模庞大，通常需要缓存数据、函数和其他对象，以便在需要时及时复用。为此，Streamlit\
  \ 提供了一种内置功能，可以在应用程序中缓存和重用数据，并产生显著积极的效果。此外，Streamlit 还提供了在需要时无需任何第三方库即可原生修改数据的能力。\n\
  \n### 缓存数据\n\nStreamlit 允许您使用 `st.cache(func, persist, allow_output_mutation, show_spinner,\
  \ suppress_st_warning, hash_funcs, max_entries, ttl)` 命令持久缓存函数的结果和数据以供后续使用。如果您处理的是需要长时间下载或处理的大型数据集，此功能尤其有用。启用此功能后，您可以通过调用写在\
  \ `st.cache` 装饰器下方的函数将数据存入缓存，然后在需要时按需重新调用，而无需重新执行该函数，即使在脚本重新运行后也不例外。\n\n**表 A-51.**\
  \ `st.cache` 参数\n\n| 参数 | 描述 |\n|-----------|-------------|\n| `func`（可调用对象） | 要缓存的函数。\
  \ |\n| `persist`（布尔值） | 该参数指定是否持久保留缓存的数据。 |\n| `allow_output_mutation`（布尔值） | 将该参数设置为\
  \ `True` 将允许您覆盖缓存的数据，而不会收到 Streamlit 的警告。 |\n| `show_spinner`（布尔值） | 如果设置为 `True`，则在缓存未命中时会显示一个加载动画。\
  \ |\n| `suppress_st_warning`（布尔值） | 将该参数设置为 `True` 将抑制任何 |\n\n\n\n"
- "# 附录 A Streamlit 应用程序接口\n\n#### 使用 `st.cache` 进行缓存\n\n`warning` (`boolean`) — 关于在缓存函数内调用内嵌函数的警告。\n\
  \n`hash_funcs` (`dict` 或 `None`) — 通过此参数，您可以覆盖 Streamlit 对缓存中对象的处理方式；当哈希函数在字典中遇到指定对象时，它将使用关联函数进行响应。\n\
  \n`max_entries` (`int` 或 `None`) — 此参数指定要缓存的最大条目数，每当有新条目添加到列表中时，最旧的条目将被相应移除。\n\n\
  `ttl` (`float` 或 `None`) — 此参数决定条目在缓存中的保留时间（秒）；若未设置，缓存将不会被清除。\n\n```python\n@st.cache\n\
  def dataframe(rows):\n    df = pd.DataFrame(\n        np.random.randn(rows, 5),\n\
  \        columns=('col %d' % i for i in range(5)))\n    return df\n\n##### 首次调用以缓存数据框\n\
  df = dataframe(100000)\n\n##### 后续调用将访问缓存的数据框，无需重新执行函数\ndf = dataframe(100000)\n\
  \n##### 由于输入参数已修改，将重新执行函数并缓存新的数据框\ndf = dataframe(200000)\n```\n\n### 缓存函数\n\nStreamlit\
  \ 还允许您通过 `st.experimental_memo(func, persist, show_spinner, suppress_st_warning,\
  \ max_entries, ttl)` 命令持久地缓存函数执行结果。此功能与 `st.cache` 命令非常相似。当您不再需要缓存时，可以使用 `st.experimental_memo.clear()`\
  \ 命令将其移除。请注意，以 `experimental` 开头的命令在功能成熟后，将在未来版本中移除此前缀。\n\n**表 A-52.** `st.experimental_memo`\
  \ 参数\n\n| 参数 | 描述 |\n|---|---|\n| `func` (`callable`) | 需要缓存的函数。 |\n| `persist`\
  \ (`boolean`) | 此参数指定是否持久保留缓存数据。 |\n| `show_spinner` (`boolean`) | 如果设置为 `True`，则在缓存未命中时将显示加载动画。\
  \ |\n| `suppress_st_warning` (`boolean`) | 将此参数设置为 `True` 将抑制关于在缓存函数内调用内嵌函数的任何警告。\
  \ |\n| `max_entries` (`int` 或 `None`) | 此参数指定要缓存的最大条目数，每当有新条目添加到列表中时，最旧的条目将被相应移除。\
  \ |\n| `ttl` (`float` 或 `None`) | 此参数决定条目在缓存中的保留时间（秒）；若未设置，缓存将不会被清除。 |\n\n```python\n\
  @st.experimental_memo\ndef dataframe(rows):\n    df = pd.DataFrame(\n        np.random.randn(rows,\
  \ 5),\n        columns=('col %d' % i for i in range(5)))\n    return df\n\n####\
  \ 首次调用以缓存函数执行结果\ndf = dataframe(100000)\n\n#### 后续调用将访问缓存的执行结果，无需重新执行函数\ndf = dataframe(100000)\n\
  \n#### 由于输入参数已修改，将重新执行函数并缓存新的执行结果\ndf = dataframe(200000)\n```\n\n### 缓存对象\n\n与\
  \ `st.cache` 类似，Streamlit 允许您通过 `st.experimental_singleton(func, show_spinner, suppress_st_warning)`\
  \ 命令持久地缓存对象。当您不再需要缓存时，可以使用 `st.experimental_singleton.clear()` 命令将其移除。需要特别强调的是，单例对象必须是线程安全的，因为它们将被应用程序的所有用户共享。`st.experimental_singleton`\
  \ 的典型用例包括数据库连接和语料库。然而，对于 `st.memo` 则不是这种情况，因为每个调用者将收到缓存数据的独立副本。\n\n**表 A-53.** `st.experimental_singleton`\
  \ 参数\n\n| 参数 | 描述 |\n|---|---|\n| `func` (`callable`) | 需要缓存的函数。 |\n| `show_spinner`\
  \ (`boolean`) | 如果设置为 `True`，则在缓存未命中时将显示加载动画。 |\n| `suppress_st_warning` (`boolean`)\
  \ | 将此参数设置为 `True` 将抑制关于在缓存函数内调用内嵌函数的任何警告。 |\n\n\n\n"
- "# 附录 A Streamlit 应用程序编程接口\n\n#### 使用 `st.experimental_singleton` 进行缓存\n\n```python\n\
  @st.experimental_singleton\ndef load_nlp(lang):\n    nlp = spacy.load('%s_core_news_sm'\
  \ % (lang))\n    return nlp\n```\n\n```python\n##### 首次调用以缓存对象\nnlp = load_nlp('es')\n\
  ##### 后续调用将访问已缓存的对象，无需重新执行函数\nnlp = load_nlp('es')\n##### 由于输入参数修改，将重新执行函数并缓存新对象\n\
  nlp = load_nlp('de')\n```\n\n### 数据修改\n\nStreamlit 允许您通过使用 `st.add_rows(data, **kwargs)`\
  \ 命令将数据帧添加到表格末尾，从而实时修改数据和图表。\n\n***表 A-54.** `st.add_rows` 参数*\n\n| 参数 | 描述 |\n\
  |-----------|-------------|\n| `data`（Pandas 数据帧或样式器、PyArrow 表、Numpy 数组、字典、None\
  \ 或可迭代对象） | 要追加到现有表格的数据帧。如果使用 PyArrow 表，必须在配置文件中设置 `dataFrameSerialization = 'arrow'`；更多信息请参见第\
  \ 3.1 节。 |\n| `**kwargs`（Pandas 数据帧、Numpy 数组、字典、None 或可迭代对象） | 如有需要，您可以将要追加的数据帧作为命名对象传递，例如\
  \ `'dataset' = df`。 |\n\n![](img/index-486_1.jpg)\n\n#### 使用 `st.add_rows` 修改表格\n\
  \n```python\ntable = st.table(pd.DataFrame(data={'a':[1,2], 'b':[3,4]}))\ndf = pd.DataFrame(data={'a':[5,6],\
  \ 'b':[7,8]})\ntable.add_rows(df)\n```\n\n## A.1.11 汉堡菜单\n\nStreamlit 默认在网页右上角配备了一个汉堡菜单。该菜单提供了一系列可能对用户和开发者都有用的附加功能。表\
  \ A-55 总结了可用的功能。\n\n***表 A-55.** 汉堡菜单功能*\n\n| 功能 | 描述 |\n|---------|-------------|\n\
  | 重新运行 | 点击后，Streamlit 将从头到尾重新运行脚本。 |\n| 设置 | 打开一个窗口，用户可在其中自定义主题的外观、颜色、字体及其他相关设置。更多信息请参见第\
  \ 3.1 节。 |\n| 录制屏幕录像 | 顾名思义，此功能允许您录制浏览器窗口中的视频和音频流，并以 `webm` 格式保存。 |\n| 报告错误 | 此选项会打开一个\
  \ GitHub 页面链接，您可以在其中报告错误。或者，您也可以选择将此选项链接到第 3.1 节所示的任何其他所需 URL。 |\n| 获取帮助 | 同样，此选项会将您带到\
  \ Streamlit 讨论页面，您可以在其中提出问题和疑虑。如果需要，可将其链接到第 3.1 节所示的另一个 URL。 |\n| 关于 | 此选项会显示一个模态窗口，其中包含您正在使用的\
  \ Streamlit 版本。如有需要，您可以按照第 3.1 节所示自定义显示的文本。 |\n| 清除缓存 | 此功能将清除由 `st.cache` 命令存储的所有数据。更多信息请参见第\
  \ 4.1 节。 |\n| 部署此应用 | Streamlit 允许您通过此选项直接将应用程序部署到其名为 Streamlit Cloud 的服务器。 |\n\
  | Streamlit Cloud | 此链接将带您进入 Streamlit Cloud 的主页，该页面提供有关其托管服务的更多信息。 |\n| 报告 Streamlit\
  \ 错误 | 与“报告错误”功能相同，此选项将带您进入 GitHub 页面，您可以在其中报告错误和问题。 |\n| 访问 Streamlit 文档 | 此链接将直接带您进入\
  \ Streamlit 的 API。 |\n| 访问 Streamlit 论坛 | 同样，此链接将带您进入 Streamlit 的论坛。 |\n\n## 参考文献\n\
