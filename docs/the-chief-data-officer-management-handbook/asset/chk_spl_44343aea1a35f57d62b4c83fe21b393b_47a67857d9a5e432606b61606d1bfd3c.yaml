  alternative: 正文前置内容（序言），属于全书统一划分为一章的范围
  counter_evidence:
  - 同“前言”，序言通常与前言、引言等前置内容合并。如果规则要求“统一划分为一章”，那么将“序言”单独分章可能是错误的，除非“前言”已被分章且此处是下一节。但通常前置内容不单独分章，而是作为一个整体章节。
  keep_split: true
- 'no': 90
  overturn_probability: 0.3
  alternative: “引言”可能是“序言”或“前言”的一部分，或者是第一个正式章节前的导论
  counter_evidence:
  - '''## 引言'' 是 H2 标题，通常属于上一级章节（如序言或前言）的子节，而不是最高层级的章标题。根据规则“只划分全书最高层级的大章”，H2 标题通常不触发新章节，除非它是没有编号的独立导论部分。然而，在
    Markdown 中，''##'' 通常表示二级标题。如果 ''前言'' 是 H1 (#)，''序言'' 是 H1 (#)，那么 ''引言'' 作为 H2
    可能隶属于 ''序言'' 或 ''前言''。原判断将其视为独立章节，可能是因为其语义上的独立性，但格式上它是 H2。'
  keep_split: false
