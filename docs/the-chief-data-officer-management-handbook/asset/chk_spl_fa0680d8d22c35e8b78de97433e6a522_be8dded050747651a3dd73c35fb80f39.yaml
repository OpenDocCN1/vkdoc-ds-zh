- 'no': 9120
  overturn_probability: 0.0
  alternative: 一级标题（Appendix/Footnotes），应划分为新章（附录章）
  counter_evidence:
  - 根据规则“文末索引也划分为一章”，以及“前言、序言...统一划分为一章”，脚注部分通常被视为正文结束后的附录部分，应该单独成章或作为独立的部分。
  - 使用 `#` 一级标题，是 Markdown 中最高级别的标题。在正文内容（`##` 和 `###`）结束后出现，标志着主内容的结束和附录的开始，符合分章特征。
  keep_split: true
- 'no': 9124
  overturn_probability: 0.0
  alternative: 一级/二级标题（Index），应划分为新章（索引章）
  counter_evidence:
  - 根据规则“文末索引也划分为一章”，索引（Index）是标准的后端内容，必须独立成章。
  - 虽然使用的是 `##` 而不是 `#`，但在脚注（`#` 一级标题）之后，索引作为新的逻辑块出现，且后续内容均为字母排序的索引条目，不再包含正文结构。因此，从语义和规则角度出发，必须分章。
  keep_split: true
