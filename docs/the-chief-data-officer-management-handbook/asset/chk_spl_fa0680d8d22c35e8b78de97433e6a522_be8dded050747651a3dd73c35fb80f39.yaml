- 'no': 8906
  overturn_probability: 0.1
  alternative: 二级小标题（Section/Subsection），非全书最高层级章
  counter_evidence:
  - 该行使用 `##` (二级标题) 格式。根据规则“只划分全书最高层级的大章”，二级标题通常对应章下的节（Section）或小节，而非新章。
  - 上下文显示该书结构包含 `###` (三级标题，如 8876, 8890, 9012, 9075, 9108)，表明 `##` 可能是中间层级，或者书的最顶层章节使用了
    `#` 或无序号的语义标题。若 `##` 是全书最高层级，则不应有 `###` 这种更细粒度的标题在正文逻辑中频繁出现作为子节点，除非这是多列层级结构。更可能的情况是，这本书的最高层级章节（如第1章、第2章）可能是
    `#` 或类似 `第X章` 的格式，而 `##` 只是其下的部分标题。
  - 前文 8876 (`### 什么是...`) 和 8890 (`### 利用...`) 是更深层级的标题，说明 8906 (`## 支持...`) 相对于这些标题是父级，但相对于全书最大的章节（未在片段中明确展示为
    `#` 或 `第X章`）可能是子级。如果全书有 `# 第一章` 这样的顶层结构，那么 `##` 就不应分章。
  keep_split: false
- 'no': 8981
  overturn_probability: 0.1
  alternative: 二级小标题（Section/Subsection），非全书最高层级章
  counter_evidence:
  - 同样使用 `##` 二级标题格式。根据“只划分全书最高层级的大章”原则，二级标题通常不作为全书的顶级章节划分点，除非该书没有一级标题（`#`）或顶级章节使用非Markdown标题语法。
  - 观察 8906 到 9048 之间，出现了多个 `##` 标题（8906, 8981, 9042, 9048, 9065），它们之间还穿插了 `###` 标题。如果每个
    `##` 都分章，会导致章节过于碎片化。通常在一个大的“部分”或“章”内会有多个 `##` 小节。例如，`## 支持数据驱动的创新` (8906) 可能属于某个更大的章（比如“创新与数据”），而
    `## 组织创新` (8981) 也是同一章或同一部分下的另一个小节。
  - 缺少像 `# 第X章` 这样的顶级标记来确认 `##` 是最高层级。在没有明确顶级编号的情况下，保守策略是认为 `##` 是子层级（节），只有 `#` 或明确的“第X章”才分章。
  keep_split: false
