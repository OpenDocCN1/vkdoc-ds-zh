- "# 选择软件解决方案\n\n## 你需要一个工具来管理数据语言吗？\n\n一个好的工具能让你的工作更轻松。但这并非先决条件。不要等到有工具再行动。术语表太重要了，不能推迟引入。\n\
  \n工具可以实现自动化，但所有活动也可以手动完成。如果你从电子表格开始，其实际使用甚至可能比你在开始前必须猜测更能提供对工具业务需求的洞察。\n\n工具最大的优势是所有信息都可以立即在线获取。人们倾向于下载文件并在离线状态下使用——这是手动管理带来的重大风险，无论是对你的术语表、规则和标准，还是对数据模型而言。\n\
  \n## 有哪些主要需求？\n\n数据专家通常对管理数据语言的工具所需的功能有很好的理解。然而，他们常常低估两个关键需求：\n\n1. **用户体验**  \n\
  \   目标用户是业务人员，而不是 IT 管理员或数据库设计者。\n\n2. **协作能力**  \n   一个良好管理的数据语言的任何方面都不能在象牙塔中创造。它的成长需要每个人的参与。\n\
  \n总而言之，一个工具如果拥有所有必要的技术特性，并且用户体验看起来像下面这个例子，那就是一个好工具。\n\n**示例 8**\n\n我打开浏览器，点击“术语表”的书签。我输入一个表达式或描述。如果找到了我需要的内容——太好了！如果没有，我就描述我需要什么。\n\
  \n我可以处理业务用例：无需勾选复选框，我可以写下“两名员工因未意识到他们用同一个词表达了不同含义而沟通了整整一小时”，或者“我不确定在 X 场景下的收入计算是否应该包含内部收入”。我知道会有一个能干的人阅读这些内容。\n\
  \n系统会创建一个工单，我会在约定时间内（基于记录在案的服务级别协议）收到个人回复。工单管理功能会启动一个流程，与所有相关利益方一起解决该问题。\n\n系统会随时向我通报任何进展，并确保我的工单不会被遗忘。\n\
  \n结果，包括对我们组织语言（即术语表、规则、标准或 CDM）的任何可能变更，都会被广泛传达，我可以在线查阅讨论的历史记录。\n\n你可以将此视为你可以与利益相关方共同开发的用例示例。这些用例有助于确保你解决的是**他们**的业务问题，而不是任何学术性的数据问题。\n\
  \n之后，你可以使用这些用例来检查你的数据语言设置是否按预期工作。\n\n脚注 1 2 3\n\n"
- "# 8. 数据流程\n\n![../images/499948_1_En_8_Chapter/499948_1_En_8_Fig1_HTML.jpg](img/499948_1_En_8_Fig1_HTML.jpg)\n\
  \n*图 8-1 – 流程至关重要*\n\n## 为什么要规定流程？\n\n无论人们是否喜欢，你都需要规定他们应该如何对待数据。否则，你将无法保证所有任务都得到处理，或者所有必要的活动都能正确执行。\n\
  \n描述流程很复杂——因为你不会希望“下一步”是未定义的或含糊不清的。然而，这绝对是一项很快就能见到回报的工作。\n\n考虑到流程的数量及其复杂性，不应期望数据办公室以外的任何人记住所有数据流程。但他们应该知道该问谁或去哪里查找。关于组织概念，请参见第\
  \ 11 章。\n\n开发数据流程的一个好的起点是你的一套数据政策（这也是为什么建议尽早开始制定这些政策的另一个原因）。\n\n每个流程都需要服务于一个目的，即具体化一项政策，并专注于交付具体的、所需的结果。\n\
  \n## 流程开发要点\n\n### 所有权\n\n流程关乎所有权：每一步都需要一个负责人。为了使组织独立于单一个人，负责人应该是职能而非个人。但你总是需要能够确定职责背后的具体人名。\n\
  \n### 现有数据流程\n\n不要重新发明轮子：如果已有运作良好的流程，就将其纳入。这样可以提高它们的接受度。\n\n### 协作\n\n不要闭门开发流程。从目标开始，并就这些目标达成共识。这会增加人们反对那些达成目标的流程的难度。\n\
  \n## 一般性考虑\n\n\n\n### 技术债务处理\n\n紧张的业务时间线可能要求接受临时解决方案。然而，这种接受必须是暂时的。由此产生的“技术债务”需要记录在案，以确保最终获得解决。（参见“项目数据审核流程”部分中的让步处理。）\n\
  \n### 冲突管理\n\n缺乏带宽、资金、专家、时间等因素可能导致相互冲突的需求。这些冲突需要通过站在整个组织的角度（“什么对股东最有利？”）来解决。第 6\
  \ 章介绍的“数据审核与决策流程”，包括其下设机构数据执行委员会和数据管理委员会，将提供必要的跨职能协调机制。\n\n即使模型设计得再好，你也会面临挑战，但你需要主动管理这些挑战。这就是为什么这样一个主流程应该包含一个通用的升级流程（另请参见第\
  \ 2 章中的“决策与升级流程”）。挑战包括（但不限于）实体间的对齐、法律议题、`InfoSec`约束以及预算和资源限制。\n\n### 易用性\n\n关键关注点应是“避免官僚主义”。遵循此流程必须具有吸引力和诱惑力。否则，人们会直接忽略它，或者选择非正式的方式来处理数据。这就是为什么，例如，应该为用户提供一个“帮助他们避免遗漏”的模板，而不是看起来像额外工作的东西。并且，请不要要求用户在首次提交时就提供所有细节——反正你还是需要与请求者沟通的。\n\
  \n### 流程触发器\n\n每个数据流程都需要一个或多个明确定义的“流程触发器”。其目的是：\n\n-   明确在哪些情况下数据流程会被激活\n-   确保在必要时能从其他流程中激活数据流程\n\
  -   告知人们流程如何被触发，以及谁有权触发\n\n一个流程触发器总是伴随着对前置条件和所需提供信息的描述。判断一个流程触发器是否有效且完整必须简单明了。该描述需要从用户的角度出发：我们需要让每个人都能轻松地找到正确的类别以应用正确的流程。\n\
  \n以下是典型流程触发器的列表：\n\n#### 项目批准或资金申请\n\n项目需要符合数据要求才能获得批准，无论是作为初始批准还是项目最终交付物的批准。如果你的组织设有`ARB`（架构评审委员会），其批准也应成为该流程的一部分。\n\
  \n#### 问题报告\n\n如果有人报告某事物存在问题，需要触发正确的流程。此机制不仅适用于业务用户或 IT 专家。它还包括数据办公室内部数据质量评估的任何发现。\n\
  \n#### 变更请求\n\n变更请求的典型例子涉及数据结构、术语、应用程序、数据处理流程、数据源或数据流。\n\n#### 技术债务到期\n\n每个暂时批准的技术债务都附带一个到期日期。在该日期到来时，如果技术债务尚未结清，则必须触发一个数据流程以便对该债务采取行动。建议还设置一个预警触发器，以便及时通知即将到期的债务，从而采取纠正措施。\n\
  \n#### 澄清请求\n\n现有政策或指南可能含糊不清。必须有一个正式的流程供用户请求澄清。此流程可以非常精简，因为它通常不需要对主题本身进行任何更改。\n\n\
  #### 升级\n\n升级常常带有负面的含义。但如果运用得当，升级仅仅是通过将决策权提升到更高层级来帮助解决冲突。重要的是要认识到，在大多数情况下，分歧与个人恩怨或缺乏理解无关。相反，不同的人基于其各自的角色有不同的优先事项。在更高层级解决冲突意味着采取更广阔的视角：我们组织的所有者会如何决策？为了使升级不掺杂情绪，一个描述清晰的升级流程大有裨益。\n\
  \n### 数据审核关口\n\n需要经过数据审核关口的活动标准：\n\n1.  **对数据结构或逻辑的潜在更改**  \n    例如：不同部门之间的数据字段映射；“客户”属性的结构变更\n\
  \n2.  **引入数据处理方式（流程、角色）的变更**  \n    例如：作为引入新的 MDM 解决方案一部分的`主数据`管理\n\n3.  **对数据生命周期（来源、流动、修改、消费）的潜在更改**\
  \  \n    例如：将`主数据`复制到云平台（`Oracle`、`Salesforce`）\n\n4.  **疑似违反数据标准或数据原则的情况**  \n\
  \    例如：重复的参考数据维护，从不可靠来源获取数据\n\n这组标准应能通过始终只要求提供特定类别或入口点所需的信息，来保持流程的精简。\n\n## 具体流程组\n\
  \n\n\n### 数据请求流程\n\n数据请求流程描述了某人如何获取数据或数据访问权限以便处理数据。这涵盖了从支持运营流程到数据科学的所有使用类型，无论是请求单条记录还是一组事务，是一次性请求还是永久数据访问。这并非不必要的官僚程序，因为业务职能对数据未经协调地使用是导致数据误解的首要原因。\n\
  \n来自所有职能领域的数据请求需要以高度透明的方式进行协调和统一，且响应时间要短。你肯定不希望项目因等待数据而延误……\n\n如有必要，需要对请求进行优先级排序。因此，该流程应基于投入和收益来定义标准。\n\
  \n为了让数据办公室能够协调此项活动，需要与所有业务部门建立正式的互动，以确定其具体的数据需求。\n\n这些需求包括：\n\n-   请求的提供方式（访问权限、格式等；一次性与重复性；全量与增量）\n\
  -   时间线与紧急程度\n-   数据内容\n-   依赖关系\n-   所需质量\n\n评估这些需求将引出一系列与数据相关的活动、职责和里程碑。\n\n如果发现直接获取数据是最佳方法，则可能会做出此决定——但必须透明公开，并管理所有相关风险。\n\
  \n所有数据请求者都应首先与数据办公室沟通。他们需要分享其业务目标以及计划的业务流程。\n\n作为回应，数据办公室需要分享现有的目标、指南和治理规则。然后，各工作流应进行差距分析。\n\
  \n某些可交付成果（解决方案、数据）可能已经存在。需要以数据请求者能够自行查阅的方式使其可见——这将有助于聚焦于真正的差距所在。\n\n**不要过度交付！**\
  \ 有时数据请求者并不需要高质量的数据。在这种情况下，数据提供者不应坚持提供更高质量的数据。\n\n同时，数据办公室也承担着咨询角色。数据请求者可能低估了接受低质量数据的长期影响或副作用。任何此类请求都需要在推进前与数据专家进行沟通，以便进行权衡。\n\
  \n一个恰当的设置能让您对每一个数据或数据相关服务的请求做出适当的响应：\n\n-   数据已经可用？直接使用即可。\n-   数据能在规定时间内由某个数据提供团队提供？去做吧！\n\
  -   由于技术原因，数据活动无法并行处理？确定优先级。\n-   数据提供需要更多资金或资源？准备一份资金申请。\n\n它还能让您区分以下情况：\n\n- \
  \  短期、与项目相关、精度需求低的数据（例如，支持规划）\n-   长期、最终、与项目无关的数据获取（塑造长期组织架构）\n\n您需要能够提升数据质量：\n\n\
  -   数据建模和数据映射需要在所有职能活动中一致地应用。\n-   所有数据源需要达成一致（单一事实来源）。\n-   短期差距需要被揭示，并在长期规划中予以覆盖。\n\
  \n### 项目数据评审流程\n\n大多数项目都需要并使用数据，您需要确保他们以正确的方式使用。这就是为什么您需要在整个项目中定义数据控制点，从项目准备阶段就开始，以便及早发现不合规情况，并让请求者有机会重新提交提案，最好是在数据办公室的支持下进行。\n\
  \n只要项目对数据有影响，所有数据方面都需要在批准前通过项目数据评审流程进行审查。这需要成为一个强制性流程，是所有项目获得批准和/或资金支持的前提条件。\n\n\
  该流程描述了此项强制评审的标准、评审步骤、评估领域以及负责方。输出成果是一份数据评审文档，外加一份摘要，该摘要将成为任何项目批准或资金申请的强制性组成部分。摘要列出了所有潜在的偏差、可能的选项以及最终判断。\n\
  \n典型的评审领域包括：CDM 合规性、单一事实来源，以及正确释义和术语。该流程还会确定项目旨在改变当前 CDM 或术语的领域，以确保变更请求得到恰当提交（参见本章后面的“数据逻辑变更流程”）。\n\
  \n主题专家需要从数据角度评判各项计划——面向高管的 PowerPoint 演示并不能保证架构的合规性。\n\n为了提高效率，所有这些都可以成为综合架构评审的一部分，一次性覆盖所有架构方面。这也是任何组织成立架构评审委员会的另一个好理由，该委员会成员来自\
  \ IT 架构团队和数据办公室。\n\n如果架构评审委员会不同意项目方法，则需将案例提交给数据管理委员会，并附上不同的选项以及支持或反对它们的所有已知论据。\n\
  \n项目数据评审流程可能是最常处理“数据特许”的流程：并非所有解决方案都能现实地一次性实现数据合规。只要有充分理由暂时偏离，可能会获得有条件的批准，同时附带有时限的数据特许。\n\
  \n您需要一个专门的流程来处理获得特许的步骤以及现有特许的管理，包括在特许即将到期或已经到期时的跟进。在到期之前，解决方案必须合规，或者（仅在存在充分理由的情况下）需要延长特许期限，并且该解决方案仍保留在待监控的特许清单中。\n\
  \n此流程不仅限于瀑布式项目，敏捷项目需要略微不同的方法，因为你无法为每个冲刺进行全面评审。相反，所有可预见的架构问题应在早期阶段得到覆盖，只有在该计划执行过程中出现新发现时，才会触发另一次评审。\n\
  \n#### 项目何时需要进行数据评审？\n\n并非所有项目都需要进行数据评审。作为一般规则，在以下情况下需要进行评审：\n\n-   涉及处理数据（检索、创建、修改、删除）的流程。\n\
  -   将要构建或更改处理数据（检索、创建、修改、删除）的软件。\n-   业务逻辑的变更导致数据逻辑的变更。\n\n**示例：**\n\n-   当数据源被添加到数据仓库，或者数据仓库中的数据被用于运营目的时\n\
  -   当引入新软件用于在本地（或云端，如果是基于云的话）维护数据时\n-   当某个应用程序需要一个设施代码列表时\n-   当某个应用程序将主数据或事务数据发送给另一个应用程序时\n\
  -   当数据为了在不同法律实体或地理实体之间进行交换而进行映射时\n-   当需要在数据录入时或数据传输后进行数据验证时\n-   当来自不同实体（例如，被收购的组织）的数据被合并到单个数据库时\n\
  -   当数据打算被复制以提供给另一个应用程序或用户组时\n-   当数据隐私（可能）受到影响时\n-   当数据质量是一个关键因素时\n\n\n\n####\
  \ 数据管理并非首要联系人的情况\n\n以下情况听起来可能像是数据相关的话题，但应由其他职能部门牵头：\n\n-   物理数据连接（局域网/广域网）：需与 IT\
  \ 基础设施团队核实。\n-   信息安全：这属于信息安全团队的议题。\n-   数据中心运营。\n-   数据传输协议。\n-   为应对数据量增长而增加的额外硬盘空间。\n\
  -   数据加密算法的实施。\n\n#### 典型的项目数据评审\n\n某个团队提出一种新方案，其中主数据的某些部分将通过电子表格维护并通过电子邮件分发，或者将引入未跨职能部门统一的术语。\n\
  \n-   这种问题将在项目数据评审过程中暴露出来，并与项目团队讨论替代方案。\n-   项目最终决定采用的任何方案，都将通过一份数据评审文件进行评估，该文件首先由您的数据管理委员会审查。\n\
  \n还将提供一份摘要，该摘要将成为项目批准/资金申请的必要组成部分。\n\n### 支持流程\n\n数据团队需要此类流程来为各职能部门提供支持，尤其是在项目前期阶段（在仍有可能时指明正确方向）。\n\
  \n在项目审批过程中才发现不合规的数据处理方式为时已晚。数据专家需要尽早参与项目启动范围界定阶段。这包括数据管理部门的*数据架构师*和*业务专家*。\n\n这些专家将帮助定义合规的方法。他们将协助创建不同的选项以及可能的分阶段方法。他们将定期在数据管理团队内部审查当前的思路状态。\n\
  \n### 数据内容变更流程\n\n对数据内容的变更通常影响有限，因此可以采用精简的流程。风险在于数据处理不合规的情况，例如参考数据被硬编码到应用程序中，导致参考数据存储库的变更无法更新应用程序。\n\
  \n大多数数据变更已经基于运营流程，而这些流程通常由执行业务的职能部门定义。这些流程需要相互配合，有些流程可以根据其他流程的经验进行改进。这是一项长期活动，而进行适当的盘点则是重要的第一步。\n\
  \n最终，对主数据的变更应当成为一个配置问题。大多数组织尚未达到这种成熟度。这就是为什么此类变更通常需要跨各个业务职能部门进行影响评估。此类评估需要成为任何现有功能数据变更流程的一部分。\n\
  \n### 数据质量管理流程\n\n需要监控数据质量，并解决与质量目标的偏差。\n\n根据质量问题的影响程度，您需要采取不同的应对措施：\n\n1.  **接受**\n\
  \    措施：不采取行动，因为影响太小（这就是量化任何报告问题影响的重要性所在）。\n\n2.  **缓解**\n    措施：应用变通方案（例如，人工处理），或实施自动化预处理软件——直到集成完毕，或通过更改映射逻辑（可能会反过来接受其他影响）。\n\
  \n3.  **解决**\n    措施：更改软件（甚至可能是将在两年内退役的遗留软件），或更改流程，或更改业务规则（或上述各项的组合）。\n\n### 数据逻辑变更流程\n\
  \n针对数据结构、数据规则、数据流程或数据术语表的变更，您需要不同的流程。\n\n为避免不协调的数据活动，所有与数据相关的变更请求都需要遵循此流程。最关键的请求是因业务逻辑变更而引起的数据模型变更。\n\
  \n该流程确保对预期变更进行明确描述，并评估其对所有其他职能部门的影响。它将建议一个增强的项目范围，其中发现需要增加必要的活动以避免不良影响。\n\n跨职能的审批流程和让步处理（如前所述）需要成为此流程的一部分。\n\
  \n### 数据术语表流程\n\n您可以想象，仅有一个术语表和一位负责人是不够的。\n\n此外，您还需要制定一个流程，明确在遇到问题、提案或需要澄清时，应与谁沟通。\n\
  \n您还需要定义负责审查任何此类输入的各方，以及最终做出决定或回复的步骤。\n\n### 数据访问请求流程\n\n对数据平台的数据访问需要在用户对灵活性的需求与平台提供商对充分且审慎使用的需求之间取得平衡。\n\
  \n此类流程应旨在将用户数量减少到必要的最低限度，同时为那些具备必要资质和业务需求的少数用户提供足够的平台使用灵活性。\n\n标准：\n\n-   用户是否具备相关技能？\n\
  -   是否有业务上的正当理由？\n\n## 在业务流程中管理数据\n\n数据话题不仅需要通过专门的数据流程来处理。此外，任何现有业务流程中都包含数据组件。\n\
  \n您的数据治理职能应出于以下两个原因对业务流程中的这些部分进行治理：\n\n-   您可能希望确保始终根据您的数据原则、标准和规则来处理数据，即使在涉及数据专家的部门日常工作中也是如此。\n\
  -   不同的业务流程可能共享相同的数据需求。它们应使用相同的数据子流程以确保一致性。这样，应用程序开发将能够使各种业务应用程序使用相同的 API 或 Web\
  \ 服务，从而避免在 IT 方面也出现重复。\n\n但是，如何从业务流程过渡到数据呢？\n\n如果您的组织拥有完善的流程管理职能，那么您的情况就很幸运。一个组织的流程记录得越好，就越容易确定与数据相关的子流程。\n\
  \n如果情况并非如此，您可以利用数据层面来推动流程的规范化文档化。根据应用程序工作流对流程进行重组通常是一个可行的选择。如果您的数据办公室在此过程中支持业务团队，那么确定数据子流程就可以成为一个可喜的附带效应。\n\
  \n您可以通过分析业务流程每个步骤的数据流来确定数据子流程：\n\n-   数据输入在哪里被预期？\n-   数据在哪里被查找？\n-   数据在哪里被验证（通常包括查找要对照验证的数据）？\n\
  -   数据在哪里被修改、合并、删除等等？\n\n将所有的发现和结果记录在业务流程文档以及数据办公室文档中非常重要。您还需要添加对所使用的任何 Web 服务或\
  \ API 的交叉引用。\n\n图 8-2 中显示了一个（简化的）数据子流程示例。\n\n![../images/499948_1_En_8_Chapter/499948_1_En_8_Fig2_HTML.png](img/499948_1_En_8_Fig2_HTML.png)\n\
  \n图 8-2  \n一个数据子流程\n\n另一个动机是，这种方法将技术性数据处理与流程解耦。业务流程所有者无需关心数据子流程的内部细节。只需说明需要*什么*即可，至于*如何*实现可以留给数据专家处理。\n\
  \n"
- "# 9. 角色与职责\n\n![../images/499948_1_En_9_Chapter/499948_1_En_9_Fig1_HTML.jpg](img/499948_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1  \n您是否总是清楚谁负责什么？\n\n\n\n## 角色与职责简介\n\n为什么我们要在考察角色和职责*之前*先讨论流程？\n\n答案很简单：每个角色、每项职责都需要服务于某个目的。任何未在任何流程中出现的角色都是不必要的。\n\
  \n理想的做法是，先从流程中推导出职责。一旦所有职责明确，你就可以塑造与之关联的角色。在此过程中，你需要考虑哪些职责应由不同的角色承担，以及哪些职责应归属于同一个角色。请以职责分离和双人复核原则作为指导。\n\
  \n职责的一个良好起点是我们在第 8 章中讨论过的数据相关流程列表。\n\n基于我们在此处确定的任务，我们已能区分出承担内容职责的职能团队、承担维护职责的职能团队以及集中式数据角色。\n\
  \n在 IT 方面，我们可以识别出技术架构师和应用架构师。其他 IT 人员，如数据库设计师和软件开发人员，也可能在处理数据方面发挥重要作用。不过，我个人建议将内部\
  \ IT 组织交由 CIO 管理，并基于可交付成果与 IT 部门开展协作。\n\n### 数据所有者与数据倡导者\n\n数据管理需要业务部门的参与。你可以通过两种方式让业务人员为数据管理做出贡献并施加影响：代表*组织的某个部门*（例如销售部）或代表*某个数据域*（例如客户或产品）。\n\
  \n区分这两种角色至关重要，因为数据域通常是跨职能的。\n\n到目前为止，这两种角色都还没有一个公认的通用术语。我决定采用常用的“数据所有者”和“数据倡导者”这两个术语，如图\
  \ 9-2 所示。\n\n![../images/499948_1_En_9_Chapter/499948_1_En_9_Fig2_HTML.png](img/499948_1_En_9_Fig2_HTML.png)\n\
  \n图 9-2 数据所有者 vs. 数据倡导者\n\n请随意用符合贵组织习惯和文化的头衔来替换这两个术语。\n\n#### 数据所有者\n\n数据所有者是业务团队的成员，他们从内容角度承担组织数据领域中特定区域的责任，通常是公司数据模型（CDM）的一个子集。数据所有者的职责绝不能重叠。CDM\
  \ 的每一部分都必须明确无误地分配给唯一一位数据所有者。请不要允许存在市场营销客户数据所有者和财务客户数据所有者并存的情况。客户数据所有者必须与所有相关方协调一致。\n\
  \n#### 数据倡导者\n\n数据倡导者可以被视为组织特定部分的数据拥护者。\n\n我们可以区分出职能性数据倡导者（例如，财务数据倡导者）、组织性数据倡导者（例如，子公司数据倡导者）和地域性数据倡导者（例如，东南亚数据倡导者）。在此你可以看到，职责确实可能重叠，但视角不同。\n\
  \n此类数据倡导者起初并不需要具备跨职能的视角。你可以要求每个业务领域的负责人任命一位其信任的数据倡导者，因为该数据倡导者将在整个组织的所有数据讨论中代表该业务领域。\n\
  \n数据倡导者的典型职责：\n\n*   成为面向网络的单一联络点，即处理总部及所有实体提出的跨职能数据议题。\n*   成为所在代表实体或职能部门内部任何人提出的任何数据相关问题、咨询或建议的单一联络点。分享和解释总部的数据信息。确保组织的数据原则在其自身实体内部得到解释和理解。（如果你拥有职责范围重叠的数据倡导者，则应提前确定，例如，是以区域结构还是职能结构为主要结构。）\n\
  *   本地数据网络：了解本地的数据管理员，以便他们能够相互联系。让他们理解自己的工作如何影响其他职能部门数据管理员的工作。\n*   确保将本地专业知识带入全球讨论，例如，关于本地地址处理习惯的知识、最佳的外部数据来源，或影响数据处理的本土法规。\n\
  *   确保本地项目明确考虑数据方面，并从数据角度为其提供支持。与中央数据办公室协作，制定一致的方法。\n*   全面了解本地控制措施，以确保日常的数据质量。\n\
  *   观察本地活动，留意数据相关问题。根据数据发现，开展本地举措和根本原因分析，理想情况下采用六西格玛方法。\n*   整合本地在数据方面的需求：对工具的需求（例如，分析可视化）、数据源、特定国家的数据结构（例如，针对所需的交易许可证）、本地数据源的验证（例如，在法规变更时）。\n\
  *   通过网络确定最佳实践（以及效果**不佳**的方法），为自身开展或支持的本地项目做准备。\n*   当不同职能部门的人员对如何在本地处理数据持有不同看法时，促进相关讨论。\n\
  \n\n\n### 数据创建者与数据消费者\n\n数据创建者和数据消费者是两个重要的利益相关群体，但他们扮演着完全不同的角色。请克制将他们混为一谈的冲动。\n\n\
  这些角色通常不是全职工作。它们描述了业务部门人员在履行其职能职责之外所承担的一系列责任。\n\n**数据创建者**在其日常业务职能中持续维护数据。他们负责数据的内容和质量，但不负责数据的结构。\n\
  \n**数据管家**是组织中数据创建者的一个子群体。他们经验丰富，通常与数据办公室和数据所有者保持长期沟通。在其职能范围内，他们积极关注数据质量问题以及进一步提升数据质量的机会。他们参与数据指标的制定（参见第\
  \ 10 章），并能从数据角度为流程和应用开发提供基于经验的意见。\n\n**数据消费者**是来自所有业务领域和各类职业的人员，他们的共同特点是工作主要依赖数据。他们依赖良好的数据质量，但通常无法立即对其施加影响。\n\
  \n他们亲身体验过使用低质量数据意味着什么。因此，在管理数据质量方面，他们的声音至关重要。\n\n数据消费者中最大的群体是分析与数据科学团队。但还有更多消费者存在于运营流程、财务、客户服务、绩效和监管报告等领域，仅举几例。\n\
  \n你已经可以看到，数据创建者和数据消费者并非互斥的群体。负责丰富数据的角色通常同时属于这两个群体。担任这类职位的人通常是那些最容易说服，让他们认识到需要关注数据质量的人。\n\
  \n同样的道理也适用于数据供应链末端的人员，尤其是财务和分析部门。无论数据供应链中哪个环节出错，都不可避免地会影响到他们。\n\n但是，当这些人理解良好数据质量的必要性时，他们往往倾向于认为自己需要亲自处理数据质量——在使用数据之前先进行修复。这种行为在缺乏主动数据管理传统的组织中尤为常见。\n\
  \n对于这些人来说，关键是要首先理解仅仅为了单一目的而修复数据并非可持续的方法。应鼓励他们*报告*任何观察到的数据问题，这样组织才能找到根本原因，并在问题发生之处予以解决。\n\
  \n但你同时还需展示数据办公室有能力且有意愿沿着数据供应链管理数据质量。只有当数据消费者看到了成效，他们才会把这项工作放心地交给数据办公室。\n\n一个积极管理的数据消费者社群是传递信息的合适途径，也是一个极佳的反馈渠道。\n\
  \n## 其他业务角色\n\n### 业务所有权角色\n\n业务应用所有者和业务流程所有者同样是关键角色。如果执行得当，他们会采取跨职能的视角。\n\n但请不要将这些角色与你的数据所有者角色混淆。它们同等重要，但却是独立、分开的角色。\n\
  \n成熟的组织会协调所有这些角色之间的跨职能对话，通常由首席转型官（若业务模式充满活力）或全球业务服务主管（若业务模式已视为成熟）牵头。数据办公室应参与此类对话。不过，首席数据官不必主导。\n\
  \n在缺乏此类系统性对话的组织中，你可能希望主动出击。你可以以一种方式组织与数据相关的角色，使得组织期望在所有跨职能议题上看到类似的架构。\n\n换句话说，总要有人迈出第一步——为什么不能是你呢？\n\
  \n## 缺乏所有权\n\n在找不到所有者的情况下，请运用“高管所有权”原则：告知负责的高管，他或她是最终所有者。高管通常没有时间，因此会讨厌这个主意。好处是所有权可以向下委托。高管会乐于利用这个选项。\n\
  \n有时你甚至找不到一个自然而然地拥有某软件所有权的职能。对于已存在多年的遗留解决方案，这种情况经常发生。IT 部门可能一直在维护它们，但从未有人主张业务所有权，也没人知道谁在使用该应用程序。但突然你可能需要解决该应用程序中的数据不合规问题。\n\
  \n一个可行但诚然大胆的方法：由数据办公室主张业务所有权。公开宣布停用。找出谁最担忧。那个人就可以成为所有者，以防止不受控制地停用。如果无人响应，则广泛沟通每一步，执行你的停用计划。并准备好回滚计划！\n\
  \n## 集中化角色\n\n遵循辅助性原则（参见第 2 章），某些角色需要集中化，以确保行为一致并避免双重并行工作。\n\n你的数据治理团队应检查任何数据相关流程中的各项活动，判断其是否需要集中管理。\n\
  \n根据组织的结构，成为中央组织一部分的角色集合会有所不同。\n\n虽然你会与业务和 IT 的其他职能部门共同确定一份合适的中央角色清单，但应考虑到这些职能部门通常存在偏见：大多数职能领域倾向于将所有繁重工作集中化，同时乐于接受下放的决策权。\n\
  \n这就是为什么理想情况下，你应在开始对话之前就在数据办公室内部准备好初步的组织架构。这样，当有人提出变更建议时，你可以要求其给出充分的理由。\n\n本章为你提供了一系列集中职责的清单，并细分为可能的团队。这份清单并非详尽无遗或规定性的，而应有助于确定一个良好的初始细节水平。\n\
  \n请记住，数据办公室中合适的团队或团队成员数量取决于组织的规模、数据办公室的预算以及员工队伍的数据素养水平（请回顾第 2 章中有效数据管理的第十个方面）。\n\
  \n以下结构旨在具备可扩展性，即可变数量的职责可以构成一个角色，且单个团队可以涵盖所描述的一个或多个领域。\n\n### 数据治理\n\n以下是数据治理职能的典型职责清单：\n\
  \n- 定义、维护并记录**数据维护**流程。\n- 定义、维护并记录变更数据**结构**的流程（换言之，治理企业数据模型，而数据架构负责其内容）。\n- 管理**外部数据**来源和标准（包括与外部数据供应商的协议）。\n\
  - 制定**培训**并执行**沟通**。\n- 记录并发布**数据政策与标准**。\n- 描述**数据规则**与**逻辑**（依据数据架构的意见）。\n- 管理一个单一的、跨职能的业务术语**词汇表**。\n\
  \n\n\n## 数据质量\n\n很少有哪个数据领域能像数据质量这样，需要像理解数据和人员行为那样，具备深厚的业务知识。以下列出的一个`DQ`职能的职责清单并不声称完整：\n\
  \n*   定义并分类可靠的指标（**数据质量指标** – 参见第 10 章）和**报告**。\n*   管理和衡量**数据质量**；使用度量标准和启发式方法。\n\
  *   验证现有和拟议的关键绩效指标。\n*   与**业务职能和 IT 部门**合作，建立主数据和交易数据的单一视图。\n*   为数据质量建立并发布**仪表盘**。\n\
  *   确定关键问题并进行**根本原因分析**（**六西格玛** – 参见第 11 章）。\n\n### 数据解决方案与项目\n\n数据管理不应局限于扮演数据的规则制定者、警察和服务台角色。必须有人将数据从其象牙塔中解放出来。\n\
  \n换句话说，关于数据的专业知识和认知需要转化为日常流程和应用。\n\n你可能需要承担数据解决方案与项目领域的以下职责：\n\n*   担任所有与数据相关、具有跨职能关联性的主要软件（主要是数据库、数据维护工具和网络服务）的业务负责人。\n\
  *   管理解决方案和实施的**路线图**（需基于业务优先级、技术能力以及自身的成本/收益分析 – 参见第 16 章）。\n*   跨职能协调针对数据解决方案的**变更请求**，并从业务角度领导实施项目。\n\
  *   执行或组织**可用性分析**。\n*   协调由数据倡导者、数据管家、分析团队和主题专家组成的全球**网络**。\n*   在数据相关事务上，主动支持并指导**迁移**和**转型**项目。部署由数据办公室拥有的数据应用程序，并从数据处理角度支持其他应用程序的部署（例如，在特定国家的主数据配置领域）。\n\
  *   管理与数据相关的不合规情况（“数据债务”）。\n*   组织**跨职能**协作。\n\n### 主数据管理\n\n虽然主数据的*维护*通常在各业务职能内部进行，但你需要协调所有这些活动。\n\
  \n以下是一些典型的核心主数据职责：\n\n*   确保**主数据**、**参考数据**和**元数据**得到妥善维护。\n*   协调重大主数据变更的**影响分析**。\n\
  *   监控主数据的正确**使用**。\n*   记录主数据全貌。\n*   担任 MDM 工具的业务负责人或产品负责人。\n\n### 数据架构\n\n数据架构不能在单一业务职能内部完成，也不应由纯技术\
  \ IT 架构师负责。\n\n原因在于，就像建筑物一样，你需要一个单一的、总体的架构来反映你的组织。内容输入必须来自各个业务职能，但所有这些都需要被整合成一个单一的企业数据模型。\n\
  \n在数据标准领域，数据架构与数据治理之间没有客观的界限。一些组织区分组织标准和功能标准：组织标准由数据治理负责，而功能标准则由数据架构负责。\n\n虽然没有绝对的对错，但我个人建议将所有标准的职责交由数据治理负责，而功能专业知识则来自数据架构。这种设置可以避免对边界案例职责归属的不确定性，同时仍能充分利用数据架构的专业知识。\n\
  \n按照这种设置，一个核心数据架构团队的典型任务包括：\n\n*   基于业务流程和能力维护业务**数据模型**。\n*   对数据模型执行**差距分析**。\n\
  *   支持数据治理制定和执行**功能数据标准**。\n*   与其他架构学科保持一致。\n*   **评估**业务变更对数据结构的影响。\n\n### 数据隐私与合规\n\
  \n这些话题比数据办公室的概念更为古老。这就是为什么大多数组织已经有负责人了。而且，坦白地说，你未必需要争夺这里的负责人身份。最终，从组织的角度来看，关键目标是确保有合适的负责人到位。如果情况已经如此，那就没有问题需要解决，所以不必强求。\n\
  \n相反，你需要确保数据办公室在此被认可为利益相关者。在许多组织中，法务部门对合规的含义有深刻的理解——但他们可能无法将其转化为日常工作中可行的实践指南。\n\n\
  这正是数据办公室可以提供支持的地方，包括提供具体的示例和检查清单。\n\n注意：如果没有其他部门承担职责，或者董事会希望数据办公室负责，那就接受吧！数据办公室并非承担数据隐私职责的最差选择。但在这种情况下，应该是由你主动向其他部门寻求建议，例如在法律事务方面。\n\
  \n以下是数据办公室在数据隐私方面典型的职责清单：\n\n*   与法务部门和信息安全部门合作处理**合规**和**数据隐私**事宜。\n*   支持业务职能正确应用数据隐私法规。\n\
  *   确保数据隐私政策和流程目标明确、尽可能清晰无歧义，并得到理解。\n\n### 数据科学\n\n在大多数组织中，集中化所有数据科学活动可能没有意义——你可能会失去数据科学家与其所服务的业务职能之间必要的紧密联系。\n\
  \n然而，建立一个规模虽小但实力强大的核心数据科学团队作为数据办公室的一部分是非常有价值的。理想情况下，你应打造一个数据科学“卓越中心”，作为组织数据科学家社区的科学枢纽——这是职能数据科学家通常没有机会做到的事情。\n\
  \n这样一个卓越中心的典型职责是：\n\n*   评估并在所有业务职能间**共享**数据科学家的**知识**。\n*   在数据科学领域代表你的组织面向**外部世界**（这并不意味着阻碍其他数据科学家的外部联系！）。\n\
  *   运行跨职能的**数据科学**活动（相关性、因果关系、概率、预测）。\n*   与 IT 部门合作构建目标**分析**格局。\n*   探索更新的数据概念，如区块链或物联网（并在可能的情况下邀请职能团队参与）。\n\
  \n### 数据分析与商业智能\n\n同样，大量的数据分析和商业智能（BI）工作应在业务职能内部完成，尤其是随着诸如 BI 自助服务等概念的发展，即使是半专业人士也能更容易地将数据转化为信息。\n\
  \n然而，一个卓越中心在此也能增加价值，作为协调职能，并通过帮助业务职能准确使用数据、工具和算法来发挥作用。与这些业务职能建立友好关系、避免被视为竞争对手至关重要。\n\
  \n以下是一个分析与 BI 卓越中心中你可以看到的职责清单：\n\n*   从技术角度支持职能**分析与 BI 团队**。\n*   在数据分析与 BI 领域代表你的组织面向**外部世界**。\n\
  *   与数据科学和 IT 部门合作构建我们的目标**分析**和**数据可视化**格局。\n*   与业务职能一起运行跨职能的**预测分析**项目。\n*  \
  \ 支持业务**报告**。\n*   研究**大数据**概念：在处理和利用外部及内部海量数据方面，有什么新动向？\n\n\n\n"
- "# 10. 数据质量\n\n![../images/499948_1_En_10_Chapter/499948_1_En_10_Fig1_HTML.jpg](img/499948_1_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1\n\n数据质量？只能祈祷好运……\n\n## 为什么数据质量很重要？\n\n“数据质量”*听上去*很重要。几乎没有人会质疑数据质量的重要性。正因如此，它有可能变成另一个空洞的口号。如果你期望“高数据质量”，会显得非常专业。\n\
  \n是的，数据质量确实重要。数据质量如此重要，以至于我要用一个专用缩写。对我来说，它就是`DQ`，而`DQ`应该被列为你优先事项清单的首位。\n\n遗憾的是，有些人认为，只要没有异常情况发生，良好的数据质量就是常态。\n\
  \n良好的数据质量并非常态。绝非如此。\n\n换句话说，除非一个组织主动且积极地致力于数据质量工作，否则你可以假定该组织的数据质量是糟糕的。\n\n示例 1\n\
  \n一家跨国企业认识到需要清理某些国家分支机构中的地址数据。\n\n该公司决定指派总部的一个庞大团队负责清理工作。\n\n这个团队失败了。\n\n最终，这些数据在语法上正确了，但既不能用于创建客户\
  \ 360 度视图，甚至也不适合用于将客户分配到销售区域。\n\n结果发现问题是多方面的：\n\n*   多年来客户数据采集不完整，导致缺少那些无法从其他数据推导出来的属性。\n\
  \n*   此外，部分国家分支机构被允许将一些数据字段滥用于特定国家的用途，导致这些内容在整个企业背景下毫无用处。^(²⁹)\n\n*   最后，清理客户数据需要大量关于每个国家提供地址的习惯以及公司结构的本地知识。总部团队并不具备这些知识。\n\
  \n## 危险的数据质量立场\n\n在那些没有专门关注数据质量的组织中，我发现了一些不同的模式，在此进行描述。\n\n请根据这些模式检查你自己的组织。提高认识能让你据此调整你的`DQ`策略。\n\
  \n### 假设你的数据质量良好\n\n为什么组织常常专注于分析，而不是覆盖整个数据供应链？\n\n通常，这是因为决策者想当然地认为他们的数据状况良好（“管理良好的组织拥有好数据！”）。\n\
  \n这与一种普遍存在且潜意识里的假设相吻合，即他们所有的数据都是好的，因为到目前为止还没有人抱怨。\n\n有时候，组织的领导者甚至从未考虑过`DQ`。我非常理解他们！想想看：你上次有意识地想到自己的耳朵是什么时候？挺久以前了吧？嗯，这很正常！人们只有在耳朵疼或听力下降时才会想到它们。\n\
  \n我们在`DQ`周围观察到的现象也是如此。它并非高管日常思维过程的一部分。\n\n这意味着我们面对的不是一个智力问题，而是一个*认知*问题。\n\n我建议你首先解决这个问题，然后才提出任何改进数据质量的技术或组织措施。如果没有高层的支持，就很难推进`DQ`工作（更不用说为这类工作争取资金了）。\n\
  \n### 假设你的数据质量足够好\n\n你可能时不时听到过这样的说法：\n\n> *它可能不完美，但到目前为止已经足够好了。我们遵循 80/20 法则，不要小题大做！*\n\
  \n但是，如何判断 20% 的努力是否真的带来了 80% 的质量水平呢？即使如此：80% 真的足够吗？\n\n### 假设你无法衡量数据质量\n\n宿命论者说：\n\
  \n> *你只能根据其他数据来衡量 DQ——而这些数据本身也可能是错的。所以你根本无从知晓！*\n\n是的，`DQ`并不简单。它需要复杂的规划和依赖关系的确定。但衡量数据是可能的——至少在一定程度上是可行的。大多数情况下，合理性检查是有效的。只要你意识到其局限性，任何衡量都比完全不衡量要好。\n\
  \n### 假设糟糕的数据质量是“数据办公室”的任务\n\n谁应该负责修复糟糕的数据？是数据办公室的数据专家吗？\n\n数据质量不足通常**不是**数据本身的问题，而是一个业务问题。在这种情况下，数据专家可以帮助描述问题及其影响。他们甚至可能支持修复数据，但他们不应该独自修复数据，原因有三：\n\
  \n1.  **修复数据所需的内容知识应该由业务负责人掌握。**\n\n2.  **应该迫使业务人员承担起所有权——他们的数据是其业务的核心部分。**\n\n\
  3.  **如果不解决根本原因，数据质量将很快再次恶化。**\n\n谢天谢地，业务职能部门有多种方法可以改进其数据质量。他们可以使用`六西格玛`来确定根本原因，这样他们就不仅仅是治标，而是可以采用经过验证的`六西格玛`方法论来解决这些根本原因。\n\
  \n我鼓励你与所有业务职能部门分享`六西格玛`方法。如果`六西格玛`已经是贵组织工具箱的一部分，那么请支持这些团队将其应用于数据。\n\n有关如何在数据管理背景下使用`六西格玛`的详细信息，请参见第\
  \ 11 章。\n\n### 假设每个人都想要好的数据质量\n\n老实说：组织中的某些人会从糟糕的数据质量中获益。如果没有积极的`DQ`管理和适当的激励措施，他们就找不到任何理由为良好的`DQ`做出贡献。\n\
  \n例如，想想那些典型的业绩不佳者，他们不希望自己的表现通过数据变得可见。\n\n但也有一些日常问题，员工能从糟糕的数据中获益。\n\n示例 2\n\n想象一位负责客户数据录入的员工，他使用的系统会根据元数据验证某些数据字段的格式。\n\
  \n由于录入速度快会得到奖励，这位员工在每小时录入的客户记录数量与录入数据的准确性之间面临冲突：你不能在单个记录上花费太多时间才能达到小时目标。\n\n但有时数据丢失或不一致，查找信息会花费大量时间，例如，查阅客户网站来确定增值税号。\n\
  \n作为一种快速解决方案，这位员工决定在这种情况下输入语法上有效的虚拟数据。结果：绩效目标达成——客户数据错误！\n\n这对这个人有好处——对组织却有坏处。\n\
  \n### 只在陷入困境时才处理数据质量\n\n只要`DQ`没有给你带来明显的痛苦，就很容易忽视它。我们之前将这确定为八种典型行为模式之一——请参见第 1 章。\n\
  \n一个被动应对`DQ`的组织无法避免其影响。它只能推迟影响的发生。\n\n如果不在早期阶段处理，某些信息可能会永久丢失。在这种情况下，事后根本不可能恢复良好的数据质量。\n\
  \n如果一个没有主动`DQ`管理的组织想要基于数据做出决策，它可能会面临以下问题：\n\n![../images/499948_1_En_10_Chapter/499948_1_En_10_Fig2_HTML.jpg](img/499948_1_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2\n\n你有可靠、一致的数据吗？\n\n*   数据不完整或根本无法获取，因为没有计划准备数据以供决策。\n\n*   数据具有歧义性。人们可以根据个人或部门目标对其进行不同的解读。\n\
  \n*   收集和修正所有数据需要很长时间。结果，决策被延迟。\n\n\n\n### 仅面向分析用途的数据质量管理  \n\n在一次大型会议上，一位专家强调了数据质量的重要性。他的要求是：“确保你们数据湖中的数据得到良好维护。”\n\
  \n一个干净的数据湖固然不错。但等到数据入库了才开始关注数据质量，已经太晚了！\n\n遗憾的是，获得可靠分析结果的必要性，往往是驱动数据质量的唯一因素。这也是那些认为数据管理就等同于数据分析的组织的弱点之一。如果它们有数据质量团队，那也是隶属于分析部门的。\n\
  \n这种由分析驱动的数据质量，通常无法触及问题的根本原因。相反，它试图在数据湖中（甚至更晚的阶段）修复数据。\n\n这种视角使得数据质量变得被动：你只有在发现问题后，才试图去修复它。\n\
  \n这种方法还伴随着更多缺点：\n\n-   它制造了一种虚假的数据质量安全感：只要分析部门不抱怨，数据质量问题似乎就不存在。\n-   你通常无法从数据湖中的数据判断其质量是否良好——尤其是当它在语法上是正确的时候。\n\
  -   数据湖中的质量问题不仅可能被忽视——后续分析结果的错误同样可能逃过注意。\n-   如果“那些分析人员在使用数据之前会修复它”，人们就可能不会在日常工作中注重避免数据质量问题。\n\
  -   在任何组织中，数据并非仅在旅程的终点才被使用。在最终进入数据湖之前，它要经历多个阶段。许多数据也用于运营目的，例如生成发票或指导生产流程。这些活动同样需要高质量的数据。那些从运营数据存储库中获取数据的非分析型数据用户，无法从数据湖中的数据修复中获得任何好处。\n\
  -   面向分析的数据质量管理会导致用于运营目的（未清洗）的数据与用于分析目的（已清洗）的数据之间产生不一致。\n-   后期才修复的数据可能早已造成损害，或导致错误的讯息被传递。\n\
  \n**示例 3**  \n客户在网站上输入的数据，可能会在在线预订过程中用来做进一步的决策。这意味着数据甚至在传输到后端之前就已经被使用了。  \n\n如果数据在之后才被修复（例如通过地址验证流程），这对预订过程毫无帮助。\n\
  \n### 在问题首次出现时才进行数据质量管理  \n\n即使数据质量是分析领域之外的话题，人们也常常是在问题变得可见时才去修复数据。但事情可能早在更早的阶段就已出错。这类组织通常面临以下问题：\n\
  \n-   数据的某些方面一旦丢失，就可能再也无法恢复。例如，你无法从一次在线购买的剩余细节中推断出客户的满意度评分。\n-   如果你在数据处理中途修复数据，最终可能会导致修复“前”与“后”的数据不一致。使用未修复数据的流程将无法与使用修复数据的流程匹配。\n\
  -   导致不良数据的流程本身没有得到处理。修复不良数据变成了一项重复发生的、回溯性的工作。\n\n数据质量需要包含预防数据丢失和及时进行恢复活动。如果发现数据导入或数据录入不充分，软件仍可以做出反应，并要求在短时间内填补这一缺口。\n\
  \n### 因为更好的数据质量无法实现或难以实现，而接受低质量数据  \n\n很多时候，尤其是数据科学家，会为了某个项目需要特定类型的数据。他们可能在网上搜索，最终在某个地方找到一个\
  \ CSV 文件，或者从网站上抓取一个表格。\n\n这本身并非无效的方法，即使通常可以从其他地方获得相同但质量更高的数据。然而，在大多数情况下，数据科学家至少可以充分了解任何此类数据存储库的数据质量水平。\n\
  \n我说的不是对给定文件进行无上下文的评估。\n\n相反，数据科学家还应该关注数据来源：数据有多可靠？有多陈旧？有多大偏差？\n\n这甚至已经发展成为一门独立的学科，通常被称为探索性人工智能。\n\
  \n发现偏差是评估数据质量的重要任务之一。这主要不是为了确定恶意的数据伪造。公共机构系统性地共享被操纵的数据文件的情况，肯定属于例外。但偏差早在有人在你看到文件之前就过滤掉所谓的“异常值”，而你却不知晓过滤标准时就已经开始了。\n\
  \n这是一个需要主动数据质量管理的例子：每位数据科学家可以通过跨多个来源进行搜索来降低风险。但这是额外的工作，而成功应用机器学习算法本不需要这样做。\n\n这就是为什么必须鼓励和奖励数据科学家去付出必要的额外努力。\n\
  \n### 未沟通数据质量水平  \n\n有时数据并不完美——但这并不一定使其毫无用处。低质量的数据当然会限制结果的意义，但在许多情况下，有结果总比没有结果更有价值。\n\
  \n然而，为了不过度解读结果，你需要将数据质量水平与结果一同提供。\n\n基于最坏情况设定阈值通常是一个好方法。一个典型且有效的表述可能是：\n\n*根据我们的模型，该关键绩效指标的预期值为\
  \ 80%。但我们有理由假设数据质量较差：(在此处添加原因)。由此产生的置信区间高达 15 个百分点，因此我们可以假设真实值以 0.95 的概率介于 65% 和\
  \ 95% 之间。*\n\n## 如何处理数据质量？\n\n### 数据质量必须是最高管理层关注的议题  \n\n数据质量影响所有其他类型的质量，并且它影响董事会获得的所有信息。\n\
  \n因此，董事会应该对其组织的数据质量感兴趣。他们可以通过（公正、中立的）数据办公室提供的精选聚合指标体系来了解情况。\n\n### 数据质量需要正确的激励 \
  \ \n\n在管理数据质量时，需要平衡“胡萝卜”和“大棒”。仅仅惩罚劣质数据的提供者，你无法实现数据质量。\n\n本质上，需要给人们充分的理由来提供高质量数据，尤其是在他们本身不是其所提供数据的消费者的情况下。\n\
  \n一种平衡的方法介于惩罚性体系（会让人们试图掩盖低质量）和僵化的奖励体系（存在奖励错误行为的风险）之间。\n\n鼓励数据质量的两种方法是透明度和支持：\n\n\
  1.  **透明度**  \n    通过让优秀的工作成果变得可见，更容易实现可持续的数据质量。  \n    最终，数据质量指标的定期沟通可以触发一种“最佳数据质量”的竞赛。这才是你希望人们拥有的思维方式。\n\
  \n2.  **支持**  \n    数据质量的另一个重要能力是提供建议。  \n    说“你的数据质量很低”并不能培养正确的数据质量思维。说“这里有一些想法可以帮助你今后达到数据质量目标”则有助于提高对“某人的数据质量不足”这一信息的接受度。\n\
  \n### 让合适的角色主动站出来  \n\n不要单枪匹马地为高质量数据奋斗。记住，并非数据办公室的日常工作需要高质量数据。\n\n相反，你或许应该确定哪些业务职能需要高质量数据，或者至少能从中受益。让**它们**去要求更好的数据！\n\
  \n你可能需要首先解释不良数据的影响——许多业务职能部门可能并未意识到这一点。然后，给它们发言权——作为它们的倡导者。\n\n\n### 聚焦相关数据\n\n\
  数据可能正确但毫无用处。因此，核查数据的相关性也是恰当数据质量管理的一部分。\n\n数据的相关性往往更多取决于目的，而非数据本身。\n\n有时，你可能会想运行回归分析，来找出某些属性与结果之间可能的因果关系——但常识已经告诉你，其中一些属性根本不存在这种关系。如果你仍然这么做，模型可能会因为检测到相关性而错误地推断出因果关系。\n\
  \n如果你从一开始就将这类数据属性排除在分析之外，就能降低误报的风险。从这个意义上说，探索性数据分析（`EDA`；另见第 20 章）是分析领域数据质量的一个关键方面。\n\
  \n### 保持并获取清洁数据\n\n虽然恰当的数据管理侧重于**保持**数据清洁，但数据**清洗**专家始终是必需的。旧的数据桶总会不断出现，需要清理。即便是清洁的数据也会随时间老化，时常需要再次清洗。\n\
  \n尤其是当你看到数据来自外部来源或特定地理区域时，就需要特定的数据知识才能进行高效清洗。\n\n这也是一个很好的理由，说明为何不应将数据清洗局限于一个中央团队，无论这些专家多么聪明。\n\
  \n**示例 4**\n\n去重工作需要的远不止字符串比较。这就是为什么避免重复和去重不仅仅是数据库操作。它们还需要业务知识。\n\n与其问“记录是否相同，或者足够接近以至于可以假定为相同？”，你或许更应问“这些记录是否指向同一事物？”\n\
  \n如果答案是“是”，那么它们就是重复记录，无论它们看起来多么不同。\n\n举一个具体案例，比较英国这五条地点记录：\n\n1. `W1K 7TN`\n2. `86-90\
  \ Park Ln, Mayfair, London`\n3. `Hotel JW Marriott, Grosvenor House, London`\n4.\
  \ `51°30'36.1\"N 0°09'15.8\"W`\n5. `///ahead.foster.waddle`^((30))\n\n这五条记录中的每一条都毫不含糊地标识了英国伦敦的同一个地点。事实上，它们都指向同一个地方。这意味着它们是重复记录。你需要一些背景信息才能发现这一点，并将它们合并为一条记录。\n\
  \n并且，你或许希望保留每条记录中的详细信息，以便最终记录包含更丰富的信息。这样做有什么好处呢？你可以更轻松地检查新记录是否与这种丰富后的记录一致，并且当用户输入任意不同属性的前几个字符时，你可以提供这条记录，从而支持智能数据录入。\n\
  \n但是请注意，你需要结合数据模型来指明哪些标识符本身是唯一的，哪些只有与其他标识符组合起来才是唯一的：在前面的例子中，英国邮政编码对于该地点是排他性的，而地理坐标可能同样适用于摩天大楼的每一层（这就使得有必要添加一个垂直的\
  \ Z 坐标来确保唯一性），而且伦敦有两座不同的建筑都叫“格罗夫纳之家”。\n\n那么，如何利用人类知识和计算机知识来实施恰当的数据清洗呢？\n\n1.  **利用数据和算法。**\n\
  \n    谢天谢地，大量知识已被融入算法中。专业的地址管理解决方案会指出，前面例子中的所有记录都指向同一个地点。\n\n    这就是为什么在第一步骤中，应该利用现成的计算机知识（通常是能够保证数据和算法自动维护的外部\
  \ API）。\n\n2.  **利用人类专家。**\n\n    但在第二步，你需要人工验证，适用于所有对算法结果信心不足的情况。\n\n    例如，你可以请某个国家的同事来帮助验证和清洗来自该国的客户数据。这些同事可能比高技能的中央团队人员更了解该国的地址结构或法律问题。\n\
  \n3.  **尽早验证。**\n\n    如果你正在导入外部数据，或者将来自收购组织的合并到你的数据存储库中，这个清洗步骤应该在流程早期进行。事后才请当地专家清理可能为时已晚——在早期技术验证步骤中，你可能已经永久丢失了所谓的重复数据。经验法则是“在转换前清洗”。\n\
  \n    因此，不要采用传统的\n    ```\n    [提取]➔[转换]➔[加载]➔[验证]\n    ```\n    你可以将流程增强为\n   \
  \ ```\n    [提取]➔[验证]➔[清洗]➔[转换]➔[加载]➔[验证]\n    ```\n\n### 人人有责\n\n越来越多的数据科学家在寻求高质量数据。但定期清理数据湖就足够了吗？\n\
  \n不，还不够。如前所述，你需要在整个数据供应链中管理数据。应用数据质量的最佳时机是在数据入口处。这可以防止不良数据进入系统。\n\n如果组织将数据质量融入每个处理数据的角色和流程中，就能实现更持久的数据质量。此外，总体工作量也会下降，因为保持数据清洁比事后清理更容易。\n\
  \n### 数据质量需要被衡量\n\n你如何判断你的数据质量是好的？你如何确定随着时间的推移是否有所改进？\n\n方法是引入度量标准和启发式规则，并将其在整个组织内制度化地持续应用。\n\
  \n第二步，你需要定义什么是“足够好”，以及什么样的数据质量水平对应什么样的业务影响。\n\n这有助于你“对照某些标准”来衡量数据质量，以确定是否需要采取行动。\n\
  \n我们将在本章后面详细讨论这部分内容。\n\n### 数据质量需要付诸行动\n\n仅仅发现数据质量糟糕是不够的。必须对此采取行动。\n\n幸运的是，大多数人都会同意这一点。\n\
  \n不幸的是，人们倾向于直接寻求解决方案来修复问题。\n\n**示例 5**\n\n想象一个组织，其销售线索数据库存在重复记录问题。\n\n如果你发现了这个问题，可以快速建立一个去重流程，可能基于外部数据来修复公司名称的拼写错误。\n\
  \n但再深入思考一下，你可能会想了解**为什么**在销售线索中会发现如此多的重复记录。\n\n我曾遇到过这样一个案例。我要求团队进行根本原因分析以确定原因。我们很快意识到，该组织的销售部门设立了一个激励方案，以鼓励销售团队生成销售线索。\n\
  \n现在想象一下，一位销售人员发现了一个潜在客户，并将其录入系统。一条消息弹出，显示“销售线索已注册”。\n\n这位销售人员会倾向于做什么？是的，他或她可能会考虑稍微改变一下拼写，例如，将“组织\
  \ ABC”改为“组织 A.B.C”。\n\n结果是什么？基于错误信息的奖金发放，数据库中拼写略有差异的重复记录，误导性的关键绩效指标（如销售线索转化率）计算，甚至可能导致同一个潜在客户被两个不同的销售计划独立地重复联系两次。\n\
  \n这里需要解决的根本问题，主要不是从数据库中清除重复记录（=治标），而是改变行为，可能通过修改激励方案来实现。\n\n换句话说，你需要处理的是**根本原因**。\n\
  \n\n\n## 业务指标管理\n\n有意义的业务质量指标需要主动管理数据质量。为什么？\n\n人们普遍认为关键绩效指标（`KPIs`）对于指导业务至关重要。但人们往往忘记`KPIs`是基于数据的。低质量的数据会导致无用（甚至具有误导性）的质量指标。\n\
  \n这意味着在管理业务之前，我们需要先管理好数据，以便知道如何指导业务。\n\n数据管理的一个关键方面是定义*数据质量指标*（`DQIs`）。这些`DQIs`需要告诉你我们的数据质量有多好。\n\
  \n在此背景下，我们还需要衡量数据*处理*过程的质量，而不仅仅是最终数据的质量，这一点非常重要。\n\n但如何有效使用`DQIs`呢？以下是一些思考。\n\n\
  ### 衡量团队绩效\n\n你可以定制你的`DQIs`来衡量特定角色或团队的绩效。\n\n正如许多组织对`KPIs`所做的那样，你可以按照组织层级结构定义`DQIs`的层次结构。某一层级上的多个`DQIs`被整合为更上一级的一个`DQI`——这个`DQI`再与其它同样被整合的`DQIs`一起，形成再上一级的组合`DQI`。\n\
  \n这种方法有三个优点：\n\n-   每个组织层级都有数量可控的`DQIs`需要关注——从团队主管（例如销售、财务或客服部门）开始，直至董事会层面，例如`CFO`可能要对名为“财务数据质量”的`DQI`负责。\n\
  -   这种层级结构允许在某个整合`DQI`显示问题时深入探究。\n-   对`DQ`的责任划分清晰明确，毫无歧义。\n\n### 衡量数据一致性\n\n一致性检查不应等待问题出现后才进行。它们应作为一项计划性活动——系统且定期地执行。\n\
  \n你可能还想在应用系统架构发生任何重大变更之前立即运行这些检查。新的算法可能不如其前一个版本那样容错，因此之前未被检测到的数据不一致可能会导致改进后的算法失效。\n\
  \n### 考虑启发式方法\n\n从一个国家的有效邮政编码列表中移除一个邮政编码是允许的——那个村庄可能已被废弃。但如果这种合法操作针对该国一半的邮政编码进行，那就应该拉响警报了。\n\
  \n换句话说，重复执行一个合法操作可能不再具备合法性。但这可能也并非完全无效。算法往往没有足够的信息来做出判断。\n\n这正是启发式方法发挥作用的地方。算法不是完全自主地判定并处理不良数据案例，而是搜索可疑案例并将其报告给人工处理。\n\
  \n这种方法旨在将需要人工审查的案例数量减少到可控范围。这也是为什么这类算法宁可报告大量误报，也不愿错误地接受一个真实错误的原因。\n\n然后，由人工来决定报告的案例是否确实是错误，是误报，还是需要进一步评估才能确定。\n\
  \n此外，此类结果还可用于微调算法，可能借助`AI`的支持。\n\n### 识别不良行为\n\n意外地鼓励不良行为很容易发生，通常是通过通用激励措施的设计或`DQIs`本身造成的。\n\
  \n因此，你应该密切关注所有`DQIs`的设计和使用情况：它们是否会鼓励或奖励不良行为？它们是否仍然反映业务目标？衡量逻辑是否仍然有效？是否需要添加新的`DQIs`？\n\
  \n作为一项常规的预防措施，你可以预见性地安排定期的`DQI`审查，并邀请一个明确的跨职能利益相关者小组参与。数据办公室绝不应孤立地定义`DQIs`。\n\n\
  ### 分解质量衡量\n\n只要有可能，就将你的质量衡量分解到不同的群体中！\n\n这可以让你找出表现最佳的群体，并了解他们采取了哪些不同的做法——前提是群体规模足够大，能够得出具有统计意义的结论。\n\
  \n有时，我们并不清楚哪种质量水平算是“好”或“足够好”。但你始终可以判断趋势：`DQI`是否会随着时间推移而改善？某些行动对特定`DQIs`有何影响？\n\n\
  以下是我认为数据质量指标应涵盖的方面列表：\n\n1.  经典的数据输入错误——通过用户界面或批量上传\n2.  数据传播和使用问题\n3.  数据完整性问题\n\
  4.  数据结构问题（因正确数据存储在不正确的数据模型下导致的错误，例如，主键冲突可能导致记录被拒，而实际上问题出在数据库表的键定义错误）\n5.  数据重复\n\
  6.  数据完整性（即使所有记录都正确，不完整也可能导致错误的比例）\n7.  数据老化问题（曾经正确但未能恰当反映不断变化的现实的记录）\n8.  变更持续时间（数据变更不应耗时过长，否则数据会过时或存在完整性风险）\n\
  9.  已修复问题或错误的百分比\n10. 更新的及时性\n11. 趋势：`DQIs`随时间如何变化？\n12. 合理性检查：语法上有效但“可疑”的情况\n\n\
  分解质量衡量对于让董事会级别关注`DQIs`也至关重要。\n\n我们都知道，几乎没有董事会成员愿意花时间审查一个充满`KPIs`的电子表格。高管们希望通过例外管理，找出关键领域并集中精力解决它们。\n\
  \n与大多数其他指标一样，因此建议创建`DQIs`的层级结构。这个层级结构需要与组织的组织结构相匹配，以便每个`DQI`都有一个明确的责任人，即承担具体角色的个人：\n\
  \n-   任何层级上的任何角色所有者都负责若干相关的`DQIs`。\n-   这些`DQIs`通常被整合为一个汇总的`DQI`，代表该角色所有者的数据质量水平。`DQIs`的选择和权重由角色所有者提出，并报请其直属上级批准。\n\
  -   只要此类`DQI`显示为绿色（即至少达到预先商定的阈值），其他人就不会要求该角色所有者进一步深究。\n-   然而，该责任人会管理下一层级所有更细粒度的`DQIs`，以便在其中一个指标影响其被考核的`DQI`之前采取预防措施。\n\
  -   在奖金与管理者个人绩效挂钩的组织中，此类`DQI`可以成为计算依据的一部分。\n\n\n\n#### 质量管理需覆盖数据\n\n您的组织是否已通过质量管理认证？例如，获得了`ISO\
  \ 29000`系列标准认证？很可能已经认证了！\n\n但是，数据质量管理是否已成为该质量管理体系及认证的明确组成部分？组织内部的质量审计是否涵盖了数据质量？\n\
  \n大多数组织尚未迈出这关键一步。但您应把握这一独特契机，主动与组织的质量管理团队展开对话。\n\n他们可能会惊讶地发现来自意料之外的盟友，因而很乐意联手合作。并且他们应当理解：服务质量、产品质量与合规质量，是如何与底层数据质量紧密相连的。\n\
  \n若您们共同致力于将组织范围的质量管理扩展到覆盖数据，则应借此机会建立一个真正的跨职能架构。\n\n如果您成功将`DQ`评估纳入现有的质量与合规审计中，您将在多个方面受益：\n\
  \n*   借助质量管理组织现有的权威性。\n*   复用已有的组织架构和方法。\n*   将业务质量与数据质量一同审视——反映两者间密切的因果关系。\n* \
  \  无需让繁忙的数据专家耗费时间在数据质量审计上。\n*   非正式地说：您避免了成为\"坏人\"。虽然您制定了`DQ`规则，但由他人协助您执行——而这并不总是与结交朋友同步的。\n\
  \n"
- "# 11. 塑造数据办公室团队\n\n![../images/499948_1_En_11_Chapter/499948_1_En_11_Fig1_HTML.jpg](img/499948_1_En_11_Fig1_HTML.jpg)\n\
  \n**图 11-1** 什么是数据科学家？\n\n## 高效创建数据团队\n\n要确保高效，您需要精心设计并组建您的数据办公室团队。\n\n您的团队需要明确覆盖所有相关数据主题，其角色需对外部世界易于理解，并且团队之间需能高效协作。\n\
  \n不存在唯一最佳的组织结构。也请不要期待我会提出一个通用的组织架构图。相反，我建议提供几组在任何数据办公室组织中都应存在的职责。\n\n## 数据架构与词汇表\n\
  \n### “数据语言”团队\n\n如前所述，数据词汇表、规则、标准及数据模型这些主题紧密相连。这四个领域之间需要大量互动。\n\n因此，即使在较大的组织中，也将它们置于同一部门下是合理的。这样一个部门将负责数据管理的“逻辑”方面。\n\
  \n根据您组织的规模，您可以将该部门分解为子团队。典型的架构包括专门的词汇表管理团队、数据标准团队和数据架构团队。\n\n### 词汇表管理\n\n谁应该负责管理组织的词汇表？我建议您挑选整个数据办公室团队中最不“书呆子气”的成员。\n\
  \n此人需具备卓越的人际交往和沟通能力，因为需要与所有业务职能保持持续对话。此外，还应是一位语言专业人士，对语言的细微差别有良好感知。\n\n掌握多种语言是加分项。其主要目的可能不是创建多语言词汇表，而是能够理解同一事物有多种表达方式。归根结底，数据是“另一种语言”。\n\
  \n### 如何组织数据架构？\n\n企业数据模型（`CDM`）的责任应归属于专门的数据架构团队。\n\n一些组织在其 IT 部门内设有架构团队。他们通常认为架构的所有方面都应由\
  \ IT 负责。\n\n出于充分的理由，这并非专家中的主流观点。\n\n让我们看看一个领先的架构模型——`TOGAF`。³¹ 它将架构分为四类：\n\n*  \
  \ 业务架构\n*   数据架构\n*   解决方案架构\n*   技术架构\n\n顾名思义，业务架构自然是业务部门的职责。应用架构和技术架构是经典的 IT 职责。\n\
  \n数据架构是连接两个世界的桥梁，这正是数据办公室在组织中应如何定位自己的方式。\n\n关于数据架构的边界以及解决方案架构的起点，可能存在一些讨论，尤其是在数据库和接口领域。如有疑问，组织可应用以下标准：任何与逻辑相关的内容归属数据办公室侧，而技术方面则归属\
  \ IT 侧。\n\n根据组织数据环境的复杂程度，将数据架构拆分为逻辑领域（业务数据架构）和技术领域（技术数据架构）可能是合理的。\n\n隶属`CDO`的逻辑团队负责数据架构的业务方面。它定义诸如以下的不同主题：\n\
  \n*   数据的结构（特别是企业数据模型）\n*   数据科学家在数据模型方面拥有何种程度的自由度\n*   必须向谁提供哪些数据，以及预处理的深度\n* \
  \  作为特定`API`的一部分，应提供哪些参数\n\n相应地，技术数据架构将定义`API`的类型、技术数据模型以及数据库内由此产生的表结构。\n\n**图 11-2**\
  \ 简要概述了架构的各个学科及其在组织中的位置。注意，在`DevOps`情况下，与 IT 运维相关的问题通常由应用架构处理。\n\n![../images/499948_1_En_11_Chapter/499948_1_En_11_Fig2_HTML.jpg](img/499948_1_En_11_Fig2_HTML.jpg)\n\
  \n**图 11-2** `TOGAF`模型\n\n尽管可能分属组织的不同部分，但所有架构团队应共同致力于构建统一的企业架构视图。\n\n这种方法创建了一个单一的虚拟团队，同时团队成员向组织的不同部分汇报，从而减少偏见和筒仓思维。\n\
  \n这种联合工作模式应由一个包含所有架构学科代表的委员会来支持。这样的架构审查委员会必须有权共同做出决策，或向更高层的决策流程提交架构声明。\n\n\n\n###\
  \ 如何让数据架构更具吸引力？\n\n`数据架构师`在组织中扮演着充满挑战的角色。\n\n他们往往被视为\"坏蛋\"，主要工作就是告诉业务部门和项目团队什么不该做。因此，这些人通常不会自愿参与其中。\n\
  \n不幸的是，优秀的`数据架构`就像出色的安全保障——其好处通常是无形的。只有糟糕或缺失的数据架构才会产生可见的负面影响。\n\n#### 类比\n\n为什么`数据架构师`在项目团队中往往不如其他架构师受欢迎？\n\
  \n项目团队通常这样看待架构：\n\n`技术架构师`铺设道路，`解决方案架构师`制造汽车，`业务架构师`教人驾驶——而`数据架构师`则告诉他们哪里是红灯、限速多少……\n\
  \n遗憾的是，`数据架构师`通常精通自己的专业领域，但就像许多其他领域的专家一样，他们往往不擅长自我营销。\n\n我记得在一次数据架构会议上，数十位经验丰富的`数据架构师`抱怨说，`解决方案架构师`会被邀请参与项目，而`数据架构师`却不会。一项快速调查显示，其结果是项目团队中`解决方案架构师`与`数据架构师`的平均比例超过\
  \ 20:1。\n\n毫无疑问：你必须帮助你的`数据架构师`。你需要提升他们的价值。仅仅强制要求他们参与是不够的。\n\n不要指望随着时间的推移人们会理解这种需求。他们不会。也就是说，他们不会将任何成功归功于`数据架构`。\n\
  \n事实上，除了`数据治理`之外，`数据架构`是组织中最需要推广和解释的领域，以获得必要且应得的认可。\n\n#### 你能做什么？\n\n- 举出实际案例——来自过去或其他组织的。\n\
  - 描述场景：如果不让`数据架构师`参与，会发生什么？\n- 运用类比（延续前面的类比：遵守交通中的红灯和限速实际上对健康有益）。\n- 强调`数据架构师`工作中的支持性方面——毕竟，他们帮助项目找到可行的数据方案，并帮助避免可能延误项目的错误。\n\
  - 利用你作为`首席数据官`的权威。如果你说`数据架构师`至关重要，那肯定没错。\n- 教导你的`数据架构师`学会自我推销（有时外部培训能创造奇迹）。\n\n\
  #### 分析\n\n为数据利用而建立的组织架构复杂到足以写一本专著，而最佳架构在很大程度上取决于具体情境，例如组织本身、其历史、组织架构以及可用人才的数量。\n\
  \n不过，一些考量可能有助于塑造这样的组织，首先要问：一个单一的`分析`团队对整个组织来说是否真的是最佳选择。\n\n#### 跨部门分析\n\n如何让`分析`\"\
  一体化\"运行？\n\n如果把`分析`交给`IT`部门，最终你会得到一辆一流的赛车却没有驾驶员：所有技术都在，但几乎没人能将其应用到实际问题上。\n\n然而，如果将`分析`交给业务部门，你可能会看到各种职能孤岛的形成，尤其是在大型组织中。我从未见过在这样的组织中能成功形成自组织的跨职能`分析`方法。\n\
  \n相反，你可以预期每个`分析`孤岛会独立发展。它们会有熟悉各自业务领域的专家，从而能够提出正确的问题。\n\n另一方面，技术解决方案可能只能是次等水平，因为职能`分析`部门大多缺乏足够规模来模仿组织的全部`IT`智能。\n\
  \n此外，许多业务主题会被并行多次处理，因为这些`分析`孤岛之间可能互不通气。在那些规模太大而无法由一个中央管理团队管理的组织中，这种情况经常出现。它们要么将管理层划分为职能组，要么划分为地理组。\n\
  \n`联邦制`通常被视为组织上的必要选择。众所周知，定期让几十位管理者围坐一桌是没意义的：你很快会看到一小群人在讨论某个具体业务职能或国家组织特有的议题，而其他人则会感到无聊。\n\
  \n然而，`分析`领域的联邦制方法也伴随着风险。其弊端清单从重复工作到数据解释不一致，不一而足。\n\n你可以通过早期设计一个中央`数据分析`实体作为`数据办公室`的一部分来避免这些弊端，从而为所有这些领域创建共同基础。\n\
  \n可以想象，这样的设计需要权威，因为它要求各职能孤岛放弃部分自主权。\n\n这就是为什么值得为你的组织`管理委员会`编写一个相关的故事。你可以描述当前的架构、它所助长的行为，以及包括财务影响在内的后果。然后提出一个能够应对这种局面、使组织\"\
  面向未来\"的治理结构。\n\n此类提案的典型方面包括：\n\n- `IT`部门的角色——作为拥有技术垄断权的实体，并有义务将各业务职能的`分析`团队视为其客户\n\
  - 所有孤岛之间共同数据标准的必要性，包括它们在`数据办公室`中的职责\n- 数据知识管理的中央协调，包括培训、经验分享、跨孤岛联合专家组和项目\n- 全组织范围内、由业务驱动的`数据分析`优先级\n\
  - 将所有孤岛在各级管理层面上联系起来的协作机构\n\n\n\n### 数据科学\n\n在大型组织中，你会发现两种截然不同的数据科学架构。一种是集中式方法，由一批高度专业的数据科学家组成，通常聚集在总部的某一栋楼或某一层（并且通常向`IT`部门汇报）；另一种是联邦式方法，即数据科学家遍布于各个业务职能部门。\n\
  \n显然，这两种方法各有优缺点。\n\n-   **集中式**方法有利于数据科学家之间紧密协作，交流最新的工具或算法。但他们常常生活在象牙塔中，脱离了本应支持的*业务*。\n\
  -   另一方面，**联邦式**方法让数据科学家接触真实的业务，包括那些让业务人员夜不能寐的问题。但他们彼此分离，提问、交流想法或分享解决方案的机会有限。\n\n\
  因此，我通常建议采用**混合方法**：一种联邦式架构，数据科学家向“他们的”业务职能部门汇报，同时建立一个强大的数据科学网络。\n\n虽然大部分日常工作在各个业务职能部门内进行，但这种模式需要为数据科学家设定专门的时间段进行线下聚会，形式从非正式聊天到跨职能的黑客马拉松。\n\
  \n这样的网络必须足够强大，以确保数据源、算法和逻辑等数据科学宝藏在整个组织内具有可见性和透明度，从而避免单个数据科学家制造“黑箱”。毕竟，不同的数据科学团队可能会因其职能经理的影响而产生职能偏见，并且被驱使为自己的业务职能部门服务。\n\
  \n为了支持联邦式网络中的集中化方面，你甚至可以考虑引入矩阵式组织，即整个组织中所有数据科学家都虚线汇报给`CDO`下属的`数据科学主管`。\n\n此外，除了“本地”团队外，建立一个规模虽小但功能强大的中央数据科学团队可能也是个好主意。这一举措有助于打造中央专业能力，从而能够创建“卓越中心”。此外，它让数据办公室可以直接获取数据科学能力，而无需请求某个业务职能部门“帮忙”。这样的团队可以独立于现有本地团队的任何由职能决定的优先事项，处理跨职能的数据科学工作。\n\
  \n### 数据报告管理\n\n管理者喜欢报告——尤其是带有彩色图表和大字体的报告（这很合理）。但他们真的*需要*它们到什么程度？如何确定一份报告的商业价值？\n\
  \n如果报告管理是集中治理的，那么这一领域可以变得更高效。\n\n这里，“治理”并不意味着完全由中央执行。但是，一个集中的报告和标准库有助于避免重复以及不正确或不一致的逻辑。与其他中央数据管理职能（例如`数据建模`或`主数据管理`）的紧密合作有助于提高报告质量。\n\
  \n集中报告治理的另一个目标是成本意识。当报告由`IT`部门应业务用户请求提供时，或者现有的报告团队创建它们时，这些报告给人的感觉就是“免费的”。但它们并非如此。\n\
  \n一个中央报告团队应该关注什么？以下是我的清单：\n\n1.  **成本管理报告**\n\n    一份报告的典型价格标签会涵盖创建成本、维护成本和复杂性成本（后者随报告总数量的增加呈指数级增长）。\n\
  \n    即使无法进行交叉收费，完全透明地了解这些成本也会激励报告消费者淘汰或共享报告。\n\n2.  **运行报告**\n\n    并非所有业务职能部门都想建立自己的报告团队。有些部门规模太小，或者过于专注于其核心业务目标而无暇顾及。\n\
  \n    这为“自愿”的集中式报告提供了机会。你可以让各部门自行选择是独立完成还是请求中央团队支持。一旦头两个部门请求集中报告服务，协同效应就会显现。\n\n\
  \    中期来看，一个中央报告团队将能够提供标准化报告，与通常由职能或区域报告团队开发的定制报告相比，这些报告对报告请求者来说应该更便宜。\n\n3.  **开发并治理自助服务**\n\
  \n    组织会受益于一个允许自助式报告的环境，这能为业务分析师提供所需的灵活性。然而，自助式报告也需要积极治理，以避免不同业务职能部门创建的报告之间出现不一致。\n\
  \n    你应该确保所有相关管理者都能访问，包括他们的移动设备。并请与`IT`部门合作来实现这一点。这是一项实实在在的成果，管理者可能会因此非常欣赏你。\n\n\
  4.  **促进协作与交流想法**\n\n    在分散式报告中，重复发明轮子的情况屡见不鲜。无论是报告背后的逻辑、数据的特定视图，还是某些可视化工具的使用——为什么不分享想法和经验呢？一个中央团队可以促进这一点，从而在组织内部塑造一个“报告社区”。是由你的数据消费者社区来涵盖这一方面，还是专门塑造一个报告社区，通常取决于你组织的规模。如果社区太小太多，它们将难以达到活跃社区生活所需的临界规模。\n\
  \n最后，提醒一句：集中式职能往往会变得官僚化。这通常伴随着可用性下降和响应速度变慢，而这比什么都更影响用户接受度。\n\n因此，监测此类趋势是`CDO`的一项关键任务，无论是通过与中央报告团队定期评审，还是通过定期的用户调查。\n\
  \n## 文档管理\n\n\n\n### 集中式方法能够创造价值\n\n大多数组织（不仅仅是大型组织）在文档管理方面都面临着一个两难困境。\n\n每当某个部门从纸质文档转向数字化时，他们通常是在引入某个功能软件包的过程中完成的，而文档管理或多或少是该软件包的一个集成组件。在每种情况下，文档管理大多与该软件包所支持的业务流程良好集成——但通常与所有其他业务功能和流程完全分离。\n\
  \n当文档的关联性超出单个部门范围时，这种方法就会成为挑战。这通常发生在端到端流程跨越职能部门边界的情况下。试想一种场景：客户服务部门需要访问客户合同，并且需要将该合同与具体案例（例如客户索赔）关联起来。\n\
  \n这个例子说明，没有简单的解决方案。要么你单独集成每个部门的流程和文档，要么你创建一个组织级的文档管理系统，但它与功能软件不完全集成（如果该部门选择了 SaaS\
  \ 模式，即其软件由组织外部的第三方运行，情况更是如此）。\n\n这个挑战显然无法由多个业务职能部门独立解决。它需要一个中央业务实体（又名数据办公室）和作为技术解决方案提供者的\
  \ IT 部门，与所有业务职能部门紧密合作共同努力。\n\n数字文档还存在其他结构性的挑战，这些挑战绝对可以通过集中式方法最有效地解决，例如：\n\n- **抵触情绪**：人类喜爱纸张握在手中的感觉。\n\
  - **跨不同业务领域的文档与数据关联**：文档可供所有相关职能部门使用。没有一张纸需要被成像和存储超过一次。\n- **OCR 与自动标记**：大多数文档包含所有相关信息，既有结构化的（如账号），也有非结构化的（如客户投诉信中的关键词）。适当的\
  \ OCR 流程有助于自动标记文档。系统性的条形码或二维码编码（例如，对分发给客户的自家表单进行编码）可以降低自动分类的错误率。\n- **技术协同效应**：管理一个归档库比管理多个实例更便宜，即使文档数量更多。\n\
  \n### 数据管理中的文档？\n\n让我们将“文档管理”定义为以可打印且可供人类阅读的独立页面形式维护信息的学科。\n\n文档管理是数据办公室的学科吗？\n\n\
  是的，原因有二：\n\n1.  **文档就是数据。**\n\n    文档并非孤立存在。它们包含有待解读的信息。这甚至适用于不包含任何字母数字字符的抽象艺术图纸。\n\
  \n    有时你甚至无法在传统文档和结构化数据之间划清界限。试想那些存储为数据记录加上模板引用（例如以 XML 文件形式）的文档。或者，试想那些从未被打印，而是直接发送到文档存储库的文档，通常以`pdf`文件或图像的形式存在。\n\
  \n2.  **文档并非孤立存在。**\n\n    没有元数据，文档就毫无意义。你需要元数据，例如标识符、属性或标签，来查找文档、组织文档、归档或删除文档（参考\
  \ GDPR），或将它们与其他数据关联起来。\n\n### 如何组建文档管理团队？\n\n文档在性质上是多样化的，就像任何其他类型的数据一样。它们从数字收据（数量巨大但结构简单）到复杂的维护合同（数量少、包含文本和图表、多个签名、同一文档的多个版本）不一而足。\n\
  \n文档管理团队有两个主要任务：建立文档管理解决方案和日常管理文档。\n\n1.  **日常管理文档**\n\n    许多围绕文档处理的任务可以实现自动化。然而，也存在局限性。\n\
  \n    虽然现代软件可以帮助提取元数据，但最终决定权往往掌握在人类手中。这不仅仅是因为提取逻辑不成熟。有时，文档中包含的元数据质量很差。\n\n    回想一下你见过的文档，它们带有元数据字段“作者”：这个字段有多少次披露了作者的真实姓名？在大多数情况下，它包含的是多年前创建该文档的人的名字。这可能与手头的文档完全不同，后者是从前者复制并修改而来的；有时它甚至是模板的“作者”，即企业设计部门负责模板的人员。\n\
  \n    你可以想象，在这种情况下，自动从现有元数据中提取字段是没有意义的。负责文档管理的人员应该监控这种情况。也有必要与数据质量部门合作，设定正确的指标和目标。\n\
  \n    此外，在涉及文档量预测和性能需求时，文档管理职能部门需要充当与 IT 部门的接口。由于图像文档的体量巨大，文档存储库通常是整个组织中存储密度最高的数据库。\n\
  \n2.  **建立文档管理解决方案**\n\n    文档管理团队需要理解不同的需求。他们需要能够分析软件解决方案，无论是专用的文档管理系统，还是功能型解决方案中的文档处理组件。\n\
  \n    最终，他们需要决定是采用一个或多个专用文档管理解决方案，还是不同的职能部门应该使用与其功能软件解决方案良好集成的文档组件。\n\n    所有这些都需要对业务有深刻的理解以及良好的应用知识。文档管理者需要回答诸如此类的问题：\n\
  \    - “一刀切”的方案是否可行，或者我们是否应该为不同类型的文档采用不同的解决方案？是否存在任何协同效应（共享数据键；或利用单一工作流的益处）能够证明采用单一解决方案是合理的？\n\
  \    - 功能型应用程序能否与中央文档存储库对接，或者中央文档中心是否应该指向各个功能型解决方案中的文档？\n    - 在分布式文档存储库的情况下，我们如何组织中央元数据管理？\n\
  \    - 在分布式文档存储库的情况下，我们如何避免文档重复？如果两个不同的部门（例如，财务部和海关）需要访问同一份实体文档，我们如何确保它只存储一次，但两个部门都能访问，并且两个部门的应用程序都能引用它？\n\
  \n**注意**\n\n在较小的组织中，整个“文档管理团队”可能只有一个人。文档管理甚至可能只是一个人承担的多个角色之一。然而，需要涵盖的主题列表相对独立于你所在组织的规模。\n\
  \n## 数据质量\n\n数据质量有两个组织方面的考量。\n\n一个方面是建立一个承担组织级责任的中央数据质量实体。另一个方面是贯穿整个组织的普遍数据质量责任。\n\
  \n\n\n### 中央数据质量团队\n\n中央数据质量团队需要深入了解业务——因为数据质量始终与业务交付成果直接相关。\n\n您不会希望团队里有一群\"要么百分百完美要么什么都不是\"\
  的学院派人士。在大多数情况下，目标质量水平是成本与收益的函数，因此低于 100%的目标往往才是更优选择。\n\n幸运的是，您无需将昂贵且稀缺的数据科学家调入数据质量团队。具备深厚业务背景的数据分析师完全足以胜任数据质量岗位。\n\
  \n以下是能令您的数据质量团队受益的几项技能：\n\n-   扎实的六西格玛培训（本章后续将讨论）将帮助数据质量团队确定根本原因，并避免通过\"治标不治本\"\
  的捷径来解决问题。\n-   良好的业务理解能力使团队能够确定（并达成共识）合适的数据质量目标。\n-   项目管理技能（瀑布式与敏捷式）有助于开展自身的数据质量改进计划，并从数据角度支持业务项目。\n\
  -   具备管控思维的人员将帮助您监控、报告和跟进数据质量问题。\n\n中央数据质量团队面临的一个重大风险是，它可能被视为\"数据警察\"。相反，您希望他们被看作是业务的支持者。\n\
  \n因此，他们的关注点不应是确保人们正确对待数据，而是将数据作为一种宝贵资源加以推广。\n\n理想情况下，遵守所有数据标准的压力应来自数据消费者自身，而非直接来自总部职能部门（如数据质量负责人）。\n\
  \n实现这一目标的关键在于，除了创建数据驱动型组织外，还要提供行为的*透明度*。\n\n第一步是与所有业务部门协作设定数据质量目标。这样的对话将让您的数据质量团队扮演协调者的角色，因为数据使用者会要求数据创建者确保数据质量达标。\n\
  \n作为第二步，如果您广泛公布目标的达成水平，各团队可能会为了不显得落后而尝试改进其数据处理方式。\n\n### 跨组织的数据质量\n\n每个人都对数据质量负有责任——但您几乎无法触及组织中的每一个人，更不用说在日常工作中影响每一个人了。\n\
  \n这正是数据管理员的用武之地。在完成常规工作的同时，他们应视自己为数据大使，并将数据质量作为一种思维模式加以推广。\n\n## 管理主数据\n\n主数据的管理可分为设计、协调与维护。\n\
  \n### 主数据维护\n\n维护是数据管理员的职责，其首要技能要求是对数据的职能背景有深刻理解。\n\n除非您的组织规模太小，无法在业务部门内设置合格的数据管理员，否则永远不应将此角色集中化。\n\
  \n### 主数据设计\n\n业务部门原则上知道自身需要什么，但他们未必能将需求转化为主数据概念。而且，他们可能主要关注自身的职能需求。\n\n因此，您需要一个集中化团队来设计涵盖全组织、跨职能的主数据目标环境，以及实现该环境的路径。\n\
  \n所有设计工作，包括选择最佳样式，都应密切配合数据架构部门完成。\n\n您并非总能奢侈地从零开始重新设计主数据环境。在大多数情况下，您必须处理遗留环境、隔离的数据存储库，以及因技术需求而在不同位置维护相同数据等问题。\n\
  \n在这种条件下为顺畅运行主数据找到合适的配置，是一项巨大挑战——可能是中央主数据管理团队面临的最大挑战。但您绝不应等待完美环境就绪才开始行动。由于大多数组织中存在海量的技术依赖关系，即使在敏捷组织中，这可能也需要数年时间。\n\
  \n我的务实建议是：组建一个团队，将其 75%的精力用于在现有约束下运行和优化主数据。剩余 25%的精力则用于根据业务需求、技术可能性以及当前运营中的发现来设计目标环境。\n\
  \n### 主数据协调\n\n协调是中央主数据团队的一项关键职责。缺乏协调将导致效率和一致性无法实现，原因如下：\n\n-   每个主数据领域通常由单一职能部门拥有——但数据通常被多个职能部门所需。\n\
  -   此外，虽然每个主数据领域的维护责任应仅由一个职能部门承担，但这在许多组织中并非普遍做法。\n-   主数据质量的标准化衡量方法以及最低质量水平的确定，必须与主数据的所有业务利益相关方共同商定。\n\
  -   每个组织都需要设立单一联系点，供所有人查询主数据的可用性——无论是用于机器操作，还是用于流程自动化（机器人流程自动化，RPA）。\n-   不同业务部门需求的协调、平衡与优先级排序，应交由没有既得职能利益的方完成，以避免结果产生偏差。决策建议的制定同样如此。\n\
  \n## 数据项目办公室\n\n### 又一个额外的管理职能？\n\n数据驱动型组织会开展数据项目。与其它数据相关活动一样，这不应在职能、组织或地理上的孤岛中进行。您更希望看到的是全组织的协调、优先级排序与协作。\n\
  \n在一个管理良好的组织中，各方明确承诺遵循单一数据供应链，该供应链由组织所有部门共享。因此，任何部门都无权单方面更改它，正如任何部门都不应被允许构建平行的数据供应链一样。\n\
  \n您几乎找不到一个仅影响单一职能部门的数据项目。大多数数据项目具有跨职能的相关性，正如数据本质上就是跨职能的一样。甚至不同的专项数据项目之间通常也存在紧密的相互依赖关系。\n\
  \n因此，组织需要管理对其单一数据供应链的所有变更，以实现一致性，包括一致的概念数据模型（CDM）。\n\n此类变更通过项目实现，这就有理由将专门的\"数据项目办公室\"\
  作为数据办公室的一部分。\n\n### 数据项目办公室的职责\n\n典型的项目办公室活动当然也适用于数据项目办公室。\n\n作为一般原则，数据项目办公室会处理那些本会加重各项目负担的行政事务。规划、协调与沟通是另外的常见任务。\n\
  \n但数据项目办公室还会负责以下事项：\n\n-   确保所有人都遵循数据标准与原则，并协助检查合规性。\n-   不仅监控活动的执行情况，还要监控后续可预测功能与收益的交付。考虑到量化数据相关收益的困难，这项任务在处理数据项目时常常被忽略。\n\
  -   最后，它要支持从可能过时的传统项目文化，向渴望有意识地平衡敏捷性与可持续性的现代项目文化过渡。\n\n\n\n### 重点关注领域\n\n与任何其他团队相比，数据项目办公室的设立必须重点关注以下两个方面：\n\
  \n1.  **敏捷性**\n\n在当今的项目管理文化中，几乎没有人期望所有需求都能在项目启动前就收集完毕。越来越多情况下，项目被期望在开发过程中确定业务需求及其优先级并予以实施，包括立即进行实施和部署。\n\
  \n虽然敏捷性是任何现代项目管理的基本组成部分，但在处理数据时尤其需要关注：将速度作为首要关注点的敏捷性会危及互操作性并加剧歧义问题。这就是为什么敏捷数据处理需要纪律性——无论是在管理技术变更还是记录技术变更方面。\n\
  \n您可能需要查阅第 20 章关于 DataOps 的一些思考，这可以成为确保管理良好的敏捷性的有效方法论。\n\n2.  **协作**\n\n从数据的角度来看，任何工作流都不应孤立地进行。相互依赖性既存在于任何单一的瀑布式项目内部，也存在于敏捷项目的不同阶段或冲刺之间。\n\
  \n仔细审视之下，大多数看似独立的项目实际上都存在数据相互依赖性。\n\n### 组织内数据项目办公室的定位\n\n任何数据项目办公室都要负责纯粹的数据项目以及其他项目中的数据相关方面，尤其是在那些没有其他项目管理组织的机构中。\n\
  \n在已有跨职能项目办公室的组织中，数据项目办公室仍有其存在的理由。但在这种情况下，它将更多地扮演支持性角色：它将涵盖通用项目办公室不具备专业知识来处理的所有数据特定项目管理活动。\n\
  \n在通用项目办公室和数据项目办公室共存的情况下，就明确划分职责达成一致至关重要。\n\n这项工作应在设立阶段就完成，并且应包括紧密合作的承诺。\n\n###\
  \ 设立数据项目办公室\n\n第 9 章“数据解决方案与项目”一节中描述的所有职责都将归属于这个团队。\n\n承担这类职责的合适人选，其数据能力仅仅是次要优势。他们首先需要具备强大的项目管理技能（包括瀑布式和敏捷式），以便能够管理自己的项目，**并**从数据角度支持业务或\
  \ IT 项目。\n\n您可能希望在任何项目或 Scrum 团队中都有一位值得信赖的数据代表——不一定是全职资源，但要能接触到所有细节。他们必须能够遵守这些团队的规则，同时以非对抗性的方式强制执行数据需求。\n\
  \n在初步建立阶段，数据项目办公室应专注于其支持者的角色，以赢得认可。\n\n随着人们开始理解这个新实体的价值，合规性的强制执行应逐步加强。\n\n## 数据服务职能\n\
  \n为组织提供一个处理数据事务的单一联系点是有益的。\n\n您正在为组织服务。因此，为什么不效仿专业的客户服务实体，采用后端加前端的组织结构来响应呢？\n\n\
  像往常一样，不同的角色并不一定意味着不同的人员。根据您组织的规模，整个数据服务职能可能仅由一个人组成。（不过，您可能需要确保存在一个备份人员来处理因假期或病假导致的缺勤。）\n\
  \n整个设置的关键目的是提供可供人们交谈的联系人，以及可供人们阅读的文档。\n\n但您还需要后端职能，负责跟进专家、回复请求者，并最终将这两者连接起来。\n\n\
  前端职能是首要联系点。它还负责管理任何服务级别协议（SLA）。\n\n一个工作流工具可以帮助跟进并避免出现无人处理的请求。\n\n在大型组织中，记录工作量并避免因不太重要的请求占用关键资源可能是有意义的。\n\
  \n### 业务服务台\n\n在您的组织中，所有有数据相关问题（或建议、投诉等）的员工都知道该找谁谈吗？\n\n他们需要知道吗？\n\n理想情况下，所有类型的数据相关话题都应有一个单一的联络点。数据办公室在处理案例分类方面应该比任何请求者更有优势。\n\
  \n这就是为什么为数据话题设立一个业务服务台是有意义的，类似于 IT 组织已经使用了几十年的服务台。（您甚至可以考虑与 IT 部门设立一个联合服务台，使请求者更便捷。）\n\
  \n谁会在这样的服务台工作？\n\n没有哪个服务台客服能回答所有内容相关的问题——至少不能在第一次通话中就做到。\n\n这就是为什么您需要通才，他们能充分理解所有内容相关的问题，以便能够确定正确的专家。\n\
  \n那么，您将如何在组织内定位您的数据服务台呢？\n\n即使您说您的服务台是为“一切数据事务”服务的，有些人也不会理解这包含什么，您可能需要帮助他们理解这类服务台的范围。\n\
  \n这就是为什么让业务人员参与服务台的开发是个好主意，包括流程设计以及（理想情况下）支持性工作流解决方案的设计。\n\n在此背景下，主动沟通、提供培训和提供示例是很有益的。任何数据问题都不应因为有人不敢问而未被提出！\n\
  \n为了让数据办公室获得信誉，数据服务台应该接手报告上来的话题，即使这些话题并非正式地“在范围之内”。\n\n事实上，您不能责怪任何人不知道什么属于“数据”范畴。这是一个灰色地带，虽然有些话题在某些组织中被归为“数据”，但在其他组织中则属于不同的职能部门。典型的例子有“与数据相关的欺诈”或“数据安全”。\n\
  \n有时，在您的组织内，某个新话题一直没有人负责。您可以利用这个机会来明确职责，理想情况下是通过数据治理机构，即数据管理委员会或数据执行委员会。\n\n###\
  \ 数据组织联络\n\n数据处理伴随着许多非内容相关的方面。它们涵盖了从文档到数据办公内联网站点，包括在线信息的充分提供。\n\n数据办公室日常工作的一个重要方面是跟进数据让步和数据质量问题。谁负责哪个行动？该行动何时到期？\n\
  \n您可以通过将所有此类活动集中到一个专门的实体中来提高效率。这个团队不需要由数据专家组成。\n\n与数据办公室的其他领域一样，最佳规模取决于您组织的规模。较大的组织将从专门的数据相关活动项目办公室中受益，其中包括项目管理资源。在较小的组织中，首席数据官的助理可以作为任何组织数据话题的联系人。介于两者之间的各种规模也是可行的。\n\
  \n\n\n## 吸引并留住专家人才\n\n数据专家很难吸引，也很难留住。这一点尤其适用于（但不限于）数据科学家。\n\n造成这种情况的原因有很多。当然，数据科学家是稀缺人才。我指的是真正的数据科学家，而不是那些改头换面的分析师或技艺高超的电子表格魔术师。我想到的是那些具备数学背景、编程技能、创造力、好奇心以及自律精神的人。\n\
  \n但那些为数不多的真正专家呢？让我们看看影响专家决定加入、留下或离开的十个方面。\n\n我将重点聚焦于数据科学家，因为这是最具挑战性的员工群体。不过，大多数方面同样适用于其他数据专家。\n\
  \n### 多样性是有益的——作为一种结果\n\n在过去 20 年里，我团队中有来自四大洲、三十多个不同国籍的人。而且，平均有 50%的直接下属是女性。\n\n\
  这有回报吗？是的，绝对有！无论面对什么主题，我总能获得不止一种视角。不同背景的人对事物的看法各不相同，常常能得出令人惊喜的解决方案。多元化群体内的讨论通常更富有成效。\n\
  \n但我是如何做到这一点的呢？我设定过性别平等目标吗？我是否致力于让团队中不同国籍或族裔的代表性达到平衡？\n\n我认为，我在为团队选拔成员时要求相当严格。我希望他们拥有卓越的知识和智力潜力、正确的态度以及必要的软技能。然而，性别、出身和肤色从来都不是我的考量标准。\n\
  \n那么，为什么我的方法总能带来非常多元化的团队呢？\n\n这是因为现实本身就是多元的，没有哪个性别或民族天生优于其他。除了我之前提到的“硬性”标准外，我总是在寻找能够补充团队中已有特征的特质。这种方法带来了性别、出身、年龄以及其他常受歧视属性的广泛多样性。\n\
  \n反之，如果你设定了硬性的平等目标，你往往会被迫选择第二好的候选人。这对你的组织不利，对最佳候选人也不公平。让我们坦诚相待：仅仅因为对方是一个 50 多岁的白人男性就拒绝他，这同样是歧视。\n\
  \n这就是为什么我认为通过实行“反向不平等”来对抗不平等是不可取的——即使你的初衷值得赞赏。\n\n总结我的经验：如果你明确允许多样性，它的力量就会显现，而不是靠强制推行！这能帮助你同时实现多样性**和**最佳团队。\n\
  \n### 人人都想加入谷歌\n\n你的组织有吸引力吗？我是说，*真的*有吸引力？\n\n坦诚地说，大多数组织对外人并没有什么吸引力，无论组织内部的员工激励和文化有多好。\n\
  \n与其他求职者一样，数据科学家也会评估潜在雇主。当然，数据科学家优先考虑列表的首位是数据科学本身。但在工作条件和内容之外，接下来什么最重要呢？\n\n那就是：“这份工作能给我的简历增光添彩吗？”\n\
  \n对某个组织的终身忠诚并不在数据科学家的优先列表上。许多人已经在考虑“可能的下一任雇主”了。\n\n你能想象一位数据科学家自豪地说“我在一家中型公司做数据科学，这家公司生产沥青铣刨机用的注入泵！”吗？相比之下，如果是“我是亚马逊机器学习团队的一员！”呢？\n\
  \n当你的组织既不是谷歌也不是亚马逊时，要吸引优秀的数据科学家，你应该宣传这个职位本身提供的机会，而不是你的组织有多成功。毕竟，成功与否，取决于看待的角度。\n\
  \n### 隔壁的挑战更诱人\n\n篱笆那边的草总是更绿吗？\n\n很可能并非如此，但一个无法比较的人又怎会知道呢？\n\n留住人才的关键在于满意度。快乐的员工较少会将当前职位与理论上的备选方案进行比较。\n\
  \n结论：一位快乐的数据科学家会留下来。\n\n错。\n\n你可能在战略会议上听到过自己说“伟大是优秀的敌人”。但你知道吗？对于数据科学家而言，**伟大的工作是优秀工作的敌人**。\n\
  \n因此，你需要一个持续观察和执行的留存策略。“今天世界上最好的工作”明天可能就变成第二好的了。\n\n首先，你的目标是让你的数据科学家感到快乐。\n\n其次，你还要解释他们为什么应该感到满意，以及为当前的组织工作有哪些特别之处。\n\
  \n这些原因可能是组织特有的，也可能适用于你所在的行业。举一个正面的例子，看看拜耳制药公司的首席数据科学家安吉丽·莫勒的声明：“在医疗健康领域推动数据科学非常有价值，因为它能显著造福患者”（莫勒，2019\
  \ 年）。\n\n通常建议将数据科学家带离他们的舒适区。向他们展示你组织的运营情况。让他们倾听客户的声音。向他们解释他们正在处理的数据意味着什么。\n\n###\
  \ 请不要开会\n\n“团队会议就是团队会议。每个人都必须参加！”你可能听过这种说法。甚至可能就是你说的。\n\n对于许多数据科学家来说，会议完全是浪费时间——甚至比其他员工群体感受更甚。\n\
  \n通常，只要有可能，让他们参加大小会议变成*可选*的，会很有帮助。\n\n在这种情况下，你将需要引入其他沟通方式来接触你的数据科学家。这些方式可能包括在他们工作地点进行个别口头汇报。是的，这工作量更大，但数据科学家通常很欣赏这种努力。\n\
  \n为数据科学家准备相关信息时，像为管理委员会准备汇报那样——简洁明了、切中要点——是个不错的主意。\n\n### 基础设施在哪里？\n\n一位出色的 F1 赛车手不愿意加入一支没有竞争力赛车的车队。\n\
  \n同样，一位优秀的数据科学家会期望所有基础设施都就位并可随时使用。\n\n那些渴望从零开始构建数据科学基础设施的数据科学家，与那些只想做数据科学的数据科学家是不同的。我猜后者会更多。\n\
  \n如果你真的没有任何可以组建数据科学团队的基础，那就试着找那些少数愿意做先驱的人。这类数据科学家可能更贵一些（他们需要有人员管理经验，并且精通技术*和*数据科学！）——但你可以期待他们成为你未来的团队负责人。\n\
  \n他们也可能比一般的数据科学家更忠诚一点——也许不是对组织，而是对他们建立起来的数据科学生态系统。\n\n### 游乐场 vs. 战略\n\n一个漂亮且设施齐全的游乐场足以吸引小孩子。但这种方法对数据科学家也适用吗？\n\
  \n对大多数人来说，不适用。\n\n数据科学家通常希望朝着一个目标努力——可以说是着眼于大局。接受培训和学习新东西对他们来说当然很重要。但大多数人是希望做这些事情是有原因的。\n\
  \n这就是为什么你应该与你的数据科学家分享组织的业务目标和数据目标。\n\n但不是通过开会来分享……\n\n\n\n#### 脱离业务\n\n你是否坐在数据科学的角落里，摆弄着你能获取的数据源，然后等待业务人员带着需求来找你？\n\
  \n有些数据科学家或许确实喜欢这样的安排。然而，他们中的大多数更希望成为宏大图景的一部分。\n\n此外，数据科学家通常在跨学科团队中最高效。毕竟，他们应该有能力解决业务同事所面临的真正挑战。\n\
  \n这就是为什么我始终建议，大多数数据科学家应该与他们的业务伙伴坐得近一些——甚至可以成为业务团队的一员。\n\n同时，让你所在组织的所有数据科学家都感受到自己是数据科学社区的一份子，这一点至关重要。\n\
  \n#### 琐碎低级的工作\n\n新的数据科学团队必须努力争取在业务社区中获得认可——然后才能被委托那些大型、昂贵的项目。这意味着要从小的步骤开始。现实中，这通常是通过一些小忙来体现的：“请帮我找到\
  \ X”，“A 和 B 相关吗？”，“你能从这份列表中剔除异常值吗？”。\n\n一位刚刚从“多维梯度收敛标准”中毕业的数据科学家，在此刻可能会感到被冒犯。为什么他们要学习如此高深的知识，却只是为了回到大学前的水平？\n\
  \n请设法影响团队的积极性。这要回归到基本点：我的首要目标是让我的客户满意。\n\n#### 数据科学也可能很枯燥\n\n想象一位数据科学家，他最终在组织内找到了完美的位置，通过完全与业务团队对齐来服务于更大的蓝图。一切都很好吗？\n\
  \n并不一定。\n\n数据科学家可能会发现自己身处一个“使用者”的境地。他们学习了所有的算法和逻辑，而现在，只需一行代码就能在 `TensorFlow` 中初始化一个模型，再一行代码就能用其他人收集的数据来训练它。\n\
  \n想想典型的电脑游戏开发者：他们通常不喜欢玩自己开发的游戏。优秀的数据科学家也常有同感。\n\n这正是黑客马拉松发挥作用的地方，你也可以与其他组织（当然不是竞争对手）的数据科学家团队举办数据科学竞赛。在这样的竞争环境下，即使是在网络上寻找有用的数据并试图正确理解它，也可能变得有趣。\n\
  \n#### 获得认可？\n\n数据科学家如何才能因其几乎无人能及的惊人脑力劳动而获得认可？\n\n我的意思是，他们如何才能*真正地*被认可？我说的可不是人们承认自己学过物理或数学后，所面对的那种夹杂着敬畏、厌恶和焦虑的复杂情绪！\n\
  \n讲述故事！用业务的语言向你的业务人员传达成功案例。告诉他们，这是仅靠计算机和算法无法做到的事情。\n\n#### 数据科学家 vs. 数据库管理员\n\n\
  所有与数据处理相关的工作都是数据科学家的任务吗？至少是那些“普通”业务团队成员无法完成的工作吗？\n\n如果一位数据科学家在数据的各个方面都表现出色，他们很快就会成为所有数据相关事宜的首选咨询对象。\n\
  \n不幸的是，这其中包含了大量对数据科学家而言是大材小用的数据活动，或者通常需要完全不同资质才能完成的工作。\n\n这些活动中有很大一部分应归入 IT 领域。这就是为什么数据处理应该是数据办公室与\
  \ IT 部门之间的初始对接任务中的重点领域。而且，无论达成何种协议，都应该记录在案并在这两个团队之外进行沟通。如果数据科学家知道，在遇到数据科学领域之外的请求时该向谁求助，这也会有所帮助。\n\
  \n#### 解决世界饥饿问题\n\n但是，如果在某个组织内，一位数据科学家因交付了卓越成果而出名，会发生什么？\n\n期望值会上升。特别是那些第一次看到神经网络如何从（看似）混乱的数据中“学习”模式的业务人员，往往会留下深刻印象。\n\
  \n你该如何应对不切实际的期望？\n\n将这些期望作为内部沟通的一部分进行管理。所有员工都需要理解：\n\n*   数据科学家应该做什么（以及你*不应*期望他们做什么）。\n\
  *   数据科学能实现什么，以及什么是不可能的。（每个人都知道没人能确定下周的彩票号码。不过，有些请求也差不多那样了。）\n\n你可能不想完全揭穿数据科学的神秘面纱。你的专家应该得到他们应得的尊重。但是，当然要防止你的业务同事将数据科学家视为历史上第一批成功的炼金术士。\n\
  \n## 六西格玛\n\n你可能听人说六西格玛已经过时了，或者它已被敏捷所取代。\n\n不要相信他们。迄今为止，还没有任何方法论被证明优于六西格玛。而敏捷则是另一回事。敏捷和六西格玛可以很好地协同工作。\n\
  \n让我们看看六西格玛如何帮助改进数据处理。\n\n### 六西格玛与数据\n\n人们倾向于治标不治本。部分原因是动机错误——人们期望快速解决问题。但另一个原因是，人们认为自己知道原因。乍一看，它似乎如此明显。\n\
  \n但是，人们认为是问题根源的东西，实际上往往本身就是一个症状，是由更深层次的问题引起的。\n\n许多理解这种情况的组织将六西格玛作为核心原则和方法论引入所有业务职能。这既带来了一套工具，也带来了一种不同的思维方式。\n\
  \n但六西格玛与数据有什么关系呢？\n\n联系有两点：\n\n*   首先，没有适当的数据，你几乎无法进行任何根本原因分析。\n*   其次，六西格玛方法论也非常适合解决与数据相关的问题。\n\
  \n有趣的是，大多数与数据相关的问题，其根本原因都会追溯到数据之外。数据问题的典型根本原因包括从缺乏流程知识到导致错误行为的不当激励等。\n\n### 在数据办公室内设立六西格玛\n\
  \n如果数据办公室内设有数据质量团队，这就是对数据问题开展六西格玛计划的地方。如果没有这样的团队，这便是一个建立它的绝佳理由。\n\n数据质量团队应始终扮演数据质量监护人的角色，而非所有者。业务领导者必须承担起所有者的责任。一个问题的业务负责人不应该能够将分析和必要的修复工作“外包”给数据办公室。\n\
  \n这再次清晰地说明了为什么数据办公室必须拥有以下权力（且无需征得所有受影响职能部门的同意）：\n\n*   开展六西格玛计划\n*   对确定的根本原因要求采取行动\n\
  *   组建跨职能团队\n*   通过衡量和咨询来伴随项目进行\n\n这是为什么？设想以下情况：团队 A 引入了一个新流程，减少了团队 A 的工作量。同时，这个流程给使用团队\
  \ A 输出的团队 B 带来了问题。对团队 B 的影响可能超过团队 A 节省的精力。\n\n换句话说，从股东的角度来看，这个新流程是个坏主意。如果从团队 B 开始进行根本原因分析，很快就会发现团队\
  \ A 那边的情况。显然，团队 A 不应该有权力说“别管闲事——这不关你的事！”\n\n这个例子清楚地表明，这样的六西格玛团队绝不能被安置在任何业务职能部门内部，以避免这种不健康的偏见。如果设置得当，由于其向职能上独立的首席数据官汇报，数据办公室是一个完美的场所。\n\
  \n一旦你拥有了所需的授权、必要的数据质量团队结构以及合适的六西格玛专家，你就可以为数据相关问题定义六西格玛流程了。\n\n\n\n### 典型的 DMAIC\
  \ 数据处理流程\n\n在六西格玛中，`DMAIC`代表经典改进流程的五个阶段：**定义**-**测量**-**分析**-**改进**-**控制**。\n\n\
  这些阶段可以轻松用于构建一个**数据驱动的六西格玛流程**，如下所述。通过这些步骤，您将能看出强有力的授权和稳定的治理结构有多么关键。\n\n#### 定义\n\
  \n流程始于问题的登记。^(³²) 流程应为以下来源做好准备：\n\n1.  **通过数据网络报告的问题**  \n    在单个国家出现的问题，可能被认为过于微小或解决成本过高。如果发现它们在全球多个地点重复出现，我们可能就有了充分的商业理由采取行动。\n\
  \n2.  **通过 DQIs 指示的问题**  \n    我们对数据质量的测量越多，暴露的薄弱环节就越多。恰当的根本原因分析有助于避免仓促行动。\n\n3.\
  \  **系统性流程评估**  \n    基于与全球流程负责人及其团队的深入讨论，对所有相关流程进行系统性审查始终是一个好方法。\n\n4.  **此前已知的问题**\
  \  \n    有时问题已存在很长时间。它们可能在过去被收集或报告过，但未得到处理。现在我们有机会评估它们并使其显性化。如果理由充分，就很难忽视。\n\n5.\
  \  **高层管理要求**  \n    有时要求直接来自高层，例如来自关键客户的高管投诉，或高管因数据不可用而感到失望。\n\n一旦登记，该问题将被分配给数据办公室内的数据质量改进分析师（`DQIA`），理想情况下是数据质量团队的成员。\n\
  \n`DQIA`将（预先）评估该案例：这真的是一个问题吗？是否需要分析？是否属于之前报告问题的一部分？这是一个改善客户体验或业务绩效的机会吗？\n\n####\
  \ 测量\n\n使用适当的指标（数据质量指标/`DQIs`）对现状进行测量。\n\n问题的量化也属于此阶段——这是后续能够衡量进展的前提条件。\n\n影响由`DQIA`量化，并构建初步商业案例：问题的影响是否严重到足以启动系统性分析？\n\
  \n如果影响证明有继续推进的必要，`DQIA`将进入下一步。\n\n#### 分析\n\n`DQIA`与所有相关职能中受影响的人员协作，执行根本原因分析。其结果是一个项目建议书，包括可能的工作流及其职能负责人。\n\
  \n如有必要，数据决策机构会被要求首先批准一个预备项目，旨在创建商业案例，确定 IT 成本、项目周期和资源需求。\n\n最终，数据决策机构将被要求对案例进行优先级排序，并做出继续/终止决策。\n\
  \n#### 改进\n\n在最终批准和资金到位后，改进项目的实际执行开始。\n\n项目类型可以多种多样，例如：\n\n1.  **对照术语表进行验证**  \n\
  \    此类项目有助于解决误解。通常从盘点现有文档和 IT 应用程序开始，然后进行协调或标准化项目。\n\n2.  **数据质量评估项目**  \n    此类项目始于将报告的业务问题转化为数据问题。\
  \  \n    需要与 IT 部门紧密合作，以确保使用适当的数据管理解决方案来定位和量化问题。  \n    此类项目的输出可以是评估的制度化（例如，通过数据质量仪表板），或是为解决已确定问题而提出另一个项目的建议。\n\
  \n3.  **数据质量改进项目**  \n    此类项目通常跟随数据质量评估项目之后——理想情况下，评估项目会为此类改进项目提供成本、资源、周期和成功标准。\n\
  \n4.  **参与和知识计划**  \n    评估常常暴露出员工队伍中知识或意识的缺乏。您可以通过一个专门针对培训、改进信息交流或员工参与的项目来解决这一问题。\
  \  \n    这是一个很好的例子，说明数据管理并非纯粹的技术学科。\n\n请注意，这些项目并非都必须由数据办公室的成员来执行。每个项目应由最合适的业务职能部门执行——要么是受影响最大的部门，要么是负责所提议活动的部门。\n\
  \n不同职能部门可以运行此类子工作流——但必须有一个部门牵头并提供项目经理。数据办公室的联络人将跟进状态和进展。\n\n#### 控制\n\n完成改进项目后，需要对结果进行测量。此阶段将由最初问题的数据质量负责人执行。该负责人将向批准该项目的机构报告这些结果。该机构决定项目是否关闭、终止，或在更早阶段重新启动（例如，完善分析或提出不同的项目设置）。\n\
  \n在适用的情况下，项目实施的变更将向更广泛的受众传达。可能需要更新政策和程序，也可能需要修改培训内容。\n\n脚注 1 2\n\n"
- '# 第二部分 数据管理的心理学


  '
- "# 12. 首席数据官的典型挑战\n\n![../images/499948_1_En_12_Chapter/499948_1_En_12_Fig1_HTML.jpg](img/499948_1_En_12_Fig1_HTML.jpg)\n\
  \n图 12-1 数据在您组织中的地位如何？\n\n\n\n## 为什么当首席数据官（CDO）如此艰难？\n\n*商业案例很出色，故事也很引人入胜。数据解决方案相比传统方法的优越性已被证实。资金获批，项目启动。*\n\
  \n*准备工作却一拖再拖。IT 部门抱怨缺乏测试能力。初步结果已经得出，却无法验证。数据专家要么忙着寻求支持，要么无所事事。赞助方保持沉默。项目先是时间耗尽，随后资金见底。它悄无声息地停止了，已经实现的功能也无人问津。*\n\
  \n这种情况听起来是不是很熟悉？欢迎加入这个俱乐部！\n\n让首席数据官的工作充满挑战的，并非技术、绝妙创意或优秀战略的匮乏，而是像这样的情景。\n\n但到底发生了什么？\n\
  \n在这个案例中，常见的情况是业务团队感到不安，而他们的经理则感觉受到了威胁：“他们想告诉我们，电脑能比我们做得更好，尽管我们有几十年的业务经验……？”\n\n\
  结果就是，团队没有提供正确的信息、准确的数据、反馈以及适当的测试等等。\n\n他们中没有人担心个人后果——反正这个项目一开始就没有一个投入的高管赞助人。\n\n\
  **让这个项目失败的并非技术或缺乏商业价值——而是人性！**\n\n这个故事是常态，还是一个悲惨的特例？\n\n不幸的是，在任何数据尚未深深植根于其基因中的组织里，你几乎都不得不预料到这类情况，即使它刚刚设立了\
  \ CDO 职位并承诺为数据办公室提供资金。\n\n要理解失败的原因，我们首先应该看看一个打算设立首席数据官（CDO）的组织其背后的动机。\n\n### 那么，CDO\
  \ 是怎么诞生的？\n\n挑战就从这里开始：很少有组织是因为董事会（a）理解数据能实现什么以及（b）知道需要做什么才能达到目标，才设立 CDO 的。\n\n相反，大公司常常决定设立\
  \ CDO 这个职位，因为“这是当下应该做的正确事情”。通常，某位董事会成员在听到或读到“数据是成功的关键”或“数据是二十一世纪的石油”后，觉得有必要采取行动。\n\
  \n让我们明确一点：这样的组织已经远远领先于其他那些仍然认为他们二十世纪的配置足以应对日益增长的数据量及其机遇的组织。\n\n然而，即使是在许多设立了 CDO\
  \ 职位的组织中，高层管理人员也并不真正了解“数据”意味着什么，以及 CDO 具体应该负责什么。\n\n这常常导致对 CDO 的期望模糊不清，例如“请把我们转型成一个以数据为核心的企业！（完成后记得通知我们一声）”。\n\
  \n### 为什么 CDO 常常在几个月后就离职？\n\n#### 1. 没有工作描述\n\n如果企业内部没人知道“好工作”到底意味着什么，那么因为工作出色而获得奖励就很难了。而且，数据处理方面的巨大改进常常是看不见的，因为所有有形的好处都被那些从数据办公室成果中获益的职能部门领走了。\n\
  \n#### 2. 在组织内没有确立的角色\n\n几位董事会成员可能会张开双臂欢迎 CDO——但其他许多领导者可能不会。他们看不到 CDO 应该填补的空白，甚至可能将这一新职位视为内部竞争。\n\
  \n#### 3. 非理性行为\n\n对首席数据官来说是常识的东西，未必是每位董事会成员合乎逻辑的结论。\n\n高德纳集团数据与分析战略研究副总裁艾伦·邓肯将几乎所有新任\
  \ CDO 的第一个经验总结为：“决策者是情绪化的，而非理性的。光有答案是不够的。”\n\n#### 4. 但期望值很高！\n\n你可能没有被期望去解决世界饥荒问题。但期望值往往也差不多。你的组织想要应对数字时代的挑战，而高层管理者期望\
  \ CDO 能奇迹般地实现这个目标。\n\n这些要点说明了为什么一个好的 CDO 不仅被期望是知识领袖。在接下来的章节中，你将读到我认为对成为成功 CDO 至关重要的其他领导素质。\n\
  \n为了铺垫场景，我将从一系列我见过的许多 CDO 和其他数据领导者面临的挑战开始。\n\n你可能也遇到过以下一种或多种情况：\n\n-   从事数据工作的 IT\
  \ 人员大多不以业务为导向，不会主动确定下一步必要步骤。\n-   大多数数据专家分散在各个业务职能中。\n-   对财务数据的访问被人为限制。\n-   让你的团队传达你们整天在做什么极为困难。\n\
  -   IT 部门仍然在不询问根本业务问题的情况下就满足请求。\n-   信息安全部门的人不与业务部门的数据人员合作。他们按照自己一贯的方式，独立负责信息安全工作。\n\
  -   作为某个业务职能部门一部分的数据管理团队，与该部门合作良好，但数据人员感觉自己被系统地排除在其他业务部门之外，他们的工作遭到这些部门的破坏或重复。\n\n\
  这些都是组织内数据文化不成熟的一些症状。缺乏处理此类情况的既定机制。\n\n如果你不觉得自己完全格格不入，请继续往下读。\n\n在图 12-2 中，我将我的观察归为八类。每一类都可能阻碍你通往数据驱动型组织的旅程，就像巨大的岩石可以阻止河流奔向大海一样。\n\
  \n![../images/499948_1_En_12_Chapter/499948_1_En_12_Fig2_HTML.jpg](img/499948_1_En_12_Fig2_HTML.jpg)\n\
  \n*图 12-2 — CDO 在企业挑战中曲折前行*\n\n你如何应对这些挑战？在许多情况下，没有笔直的道路，所以你也许需要像在丘陵地带蜿蜒的河流一样曲折前进。\n\
  \n以下是我从 CDO 和其他数据领导者的真实经验中总结出的一些建议。\n\n\n\n## 权力之争\n\n你的组织在过去已经形成了自己的运作模式。往往需要数十年才能制定出一套成熟的政策体系，以确保所有议题都被覆盖。\n\
  \n如今，一位首席数据官（CDO）登场了，但其职责却模糊不清。CDO 的典型职责此前一直分散在 IT、法务、风险管理、财务等部门。没有人愿意向这位新来的首席数据官让渡自己的影响力或权力。\n\
  \n如果这场冲突得不到解决，你就会看到无休止的日常权力之争。数据办公室将难以有效运作，甚至无法运作，因为数据团队的成功取决于协作。如何应对这些挑战？以下是我的思考：\n\
  \n1.  **授权。**\n\n    我的第一条建议听起来可能并不复杂，但在很多情况下执行起来颇具挑战性：\n\n    从一开始就向上级争取明确的授权\n\
  \    *  在引入数据办公室的流程中尽早提出\n    *  作为不可协商、不可动摇的授权，如同财务总监（CFO）的授权一样\n    *  由董事会本身传达（而不是让你像举着许可证一样到处展示你的授权）\n\
  \n    向董事会解释采取这种方法的必要性至关重要。你或许可以主动提出由你负责起草授权的具体措辞。毕竟，你才是专家。\n\n    别忘了提供几个选项（所有你认为可以接受的选项），以表明你接受董事会的权威，并且他们有最终决定权。\n\
  \n    这种方法也是检验你所在组织准备情况的早期试金石：如果董事会拒绝给予你这种初始支持，你就应该开始回复猎头了！\n\n2.  **每个议题都有其历史上的“所有者”。**\n\
  \n    但仅有授权可能还不够。你还必须应对那些视你为竞争对手的人。\n\n    针对这种情况，我推荐两条通用原则：\n    *  不在单一领域开战。不要树敌。你需要盟友。\n\
  \    *  分而治之！放弃非关键领域。\n\n    是否需要进一步行动取决于具体情况。你可能会面临以下两种挑战形式：\n\n    **变体 1：“别插手！这是我的数据！”**\n\
  \n    在这种情况下，你可能无需升级事态或寻求董事会的支持。\n\n    毕竟，是有人在阻止组织内的一部分数据接受专业的数据处理。\n\n    让情况透明化，并让其他人去抱怨：那些得不到其他人所获得的、正确数据和优质数据服务的人自然会表达不满。\n\
  \n    **变体 2：“我无需向你汇报！”**\n\n    你是否主要想巩固自己的权力基础？这通常不是 CDO 应有的有益态度。你现在遇到了问题，而且理应是遇到了问题！\n\
  \n    否则，就利用你的可信度来建立信任和长期关系。从那些你感觉在领导层网络中地位最稳固的人开始。并且要诚实！毕竟，你是想支持其他职能部门，而不是成为他们的老板。\n\
  \n## 缺乏认知\n\n如果你听到消防车驶来，却看不到任何火情，你会想知道他们要做什么。此时你有两个选择：\n\n*   你让他们离开，因为你认为他们出现没有理由。\n\
  *   你思考他们出现是否有什么你还未（尚未）意识到的原因。\n\n短暂思考之后，你可能会同意第二种选择更为妥当。也许消防车出动的理由并不像明火那样显而易见。\n\
  \nCDO 首次抵达一个组织，常常是类似的事件。你会观察到同样的两种反应模式：一些人会认为 CDO 的到来必有充分理由，而另一些人则会因为看不到“燃眉之急”而认为设置\
  \ CDO 纯属多余。\n\n你可能想知道哪些相关利益方属于第二类。这类人典型的言论（通常以隐晦的方式表达）包括：\n\n*   “你打算解决什么问题？”\n\
  *   “过去几十年没有 CDO，我们不是一直很成功吗？”\n*   “你在制造重复工作，因为你打算在这里做的每件事都已经有人负责了。”\n\n我们姑且认为这些人是真的不懂，也就是说，这确实是他们真实的想法。\n\
  \n在这种情况下，一个好的反应是以非常谦逊的方式解释背景情况。\n\n你可以邀请团体或个人（对于高层管理人员，建议采用后者）就这个话题进行交流。请不要说教——而是进行开放的对话。倾听和提问是这类对话的主要组成部分。\n\
  \n结果，你不仅可能更好地根据对方的处境来调整你的说辞，也可能更深入地了解组织，包括其不成文的规定。\n\n从内容上看，缺乏认知体现在两个根本问题上：“为什么？”和“为什么是现在？”你该如何回应？\n\
  \n### 为什么我们应该管理数据？\n\n对这个问题最理想的回应是基于事实，描述*整体*的核心理由——也就是你的核心故事！\n\n这个故事不应涉及以数据为中心的技术性论点。“我们需要干净的数据！”对大多数高管来说意义不大。相反，你或许应该提供一个商业层面的理由，思路如下：\n\
  \n数据办公室的首要目标是帮助组织\n*   赚钱\n*   省钱\n*   保持竞争优势\n\n换句话说，CDO 旨在让组织内的其他所有人都能更加成功。\n\n\
  尽可能描述当前工作方式中的差距，以及组织内错失的机会。同时说明你为什么得出这样的判断。（为了在此处具有可信度，你应该先与一线人员沟通，然后再安排与高管的会议！）\n\
  \n你越是能精准地确定那些领导们所面临的业务挑战，并专注于为这些挑战开发解决方案，你就越有可能成为他们认可的、能够解决问题的人。\n\n### 为什么我们应该现在就管理数据？\n\
  \n在回答这个问题时，你或许可以完全同意，过去确实存在积极的数据管理并非必需的时代：哪个组织在 1990 年代需要一位首席数据官呢？\n\n然而，“时代正在改变”，正如鲍勃·迪伦几十年前教导我们的那样。\n\
  \n那么，是什么发生了变化？\n\n首先，人们知道过去几年数据的数量呈指数级增长。大家也都清楚，这种发展势头短期内不会停止。\n\n其次，客户期望已经改变。电子商务的繁荣让许多客户了解到技术上什么是可能的。他们为什么要接受更差的体验呢？\n\
  \n最后，商业决策不应再仅凭直觉做出——无论拥有这种直觉的人经验多么丰富。这个世界对这种管理风格来说已经变得过于复杂。此外，通过数据做出最佳决策的能力，正随着数据量和辅助算法质量的同步快速增长而迅速提升。\n\
  \n## 业务孤岛\n\n专业的数据管理本质上是跨职能的。这样可以避免歧义和重复。\n\n另一方面，职能负责人可能看不到将精力投入到主要使其他部门受益的事情上的价值。他们的考核严格基于自己团队的目标，他们不希望任何精力从达成这些目标中转移。\n\
  \n这种情况有多种表现形式。以下是我非常常见的两种变体。\n\n\n\n### 变体 1：“我们最清楚什么对自己有利。”\n\n这事实上可能是对的！并非所有事都需要集中管理。\n\
  \n如果这种说法频繁出现，它应当为你提供一个绝佳的基础，以便与强大的本地或职能团队共同制定治理模式。\n\n想想看，通过中央赋能，让强大的职能团队贴近其业务伙伴工作。\n\
  \n再想想看，通过人际网络将人们联系起来，实现协同效应。\n\n通过满足人们在某些领域的自主权要求，你应当寻求他们同意将其他议题集中管理，例如在标准化措辞和流程方面。\n\
  \n### 变体 2：“如果我不需要与其他人对齐，我会更快。”\n\n也许你在确保各部门在请求 IT 支持时不会绕过你方面取得了良好进展。然而，他们往往根本不需要\
  \ IT 支持——因为他们已经建立了自己的“影子 IT”团队或结构。\n\n但该如何回应呢？\n\n确实，对齐需要时间。但缺失对齐的后果是什么？\n\n-  \
  \ 活动和沟通局限于职能范围之内。\n-   错失了与其他职能团队交流的机会。\n-   不同部门对于同一议题得出了不同的结论。\n-   数据来源可能存疑。数据可能被误解。\n\
  -   重复进行着已经完成过的工作。\n\n然而，在这种情况下，仅仅依靠基于事实的论点可能并不足够。不进行对齐仍然更快，因此也更具吸引力。\n\n这里有两种额外的活动可能会有所帮助。一是提出一个可靠的商业案例，展示可持续数据工作的长期收益。\n\
  \n二是创造一种双赢局面：你首先需要找出职能负责人或项目经理想要加快进度的*原因*。在许多情况下，是因为他们要履行已承诺时间表的压力。这种情况允许你与项目经理合作：你可以共同在第一次就把事情做对，同时修改时间表使其成为可能。毕竟，修改时间表有其充分的理由，而且这些理由显然不是由于糟糕的项目管理造成的！\n\
  \n这种方法有助于你实现几件事。项目经理获得了足够的时间，同时也有机会交付高质量的工作。如果你给他们真正的选择，绝大多数项目经理会更倾向于后者。\n\n此外，如果成功，你可能为未来类似的情况赢得了一个盟友。而且你也有机会证明，由于第一个项目奠定的坚实基础，未来的项目会变得更简单、更快、更便宜。\n\
  \n## 缺乏所有权\n\n数据所有权是数据管理中一个并不为多数人所熟悉的概念。\n\n但即使在业务团队之间，要达成“让我来负责！”这种意义上的所有权也很困难。一旦某个业务概念被认为是“技术性的”，人们往往乐于将责任外包给\
  \ IT 部门。\n\n而且，说实话，为什么有人要去做别人自愿做的工作呢？在大多数组织中，在过去几十年里，当有必要时，IT 部门已含蓄地接受了数据所有权。\n\n\
  难道不应该就这样保持现状吗？嗯，如果你打算充分利用数据的全部潜力，就不能把关于业务模型及其数据表示的决策留给技术数据建模、软件开发或数据库设计方面的专家。\n\n\
  事实上，正如 Nordea 银行数据治理与信息架构主管 Ole Busk Poulsen 在 2019 年维也纳的一次数据会议上强调的那样：“所有权始于组织高层。”\n\
  \n但是，如何让人们承担起所有权呢？同样，关键是要创造双赢局面。这需要一个强大的数据办公室。你需要与业务职能部门合作，帮助他们理解如何将他们的业务概念转化为数据结构。\n\
  \n同时，你要向 IT 部门解释，你是在让他们工作更轻松：他们不必同时与多个业务职能沟通并平衡相互冲突的需求，而是将数据办公室作为他们的单一联络点和不同业务职能之间的协调者。这让他们能够专注于自己的核心职责：提供满足业务需求的一流\
  \ IT 解决方案。\n\n图 12-3 说明了数据管理组织的这种双赢局面。\n\n![../images/499948_1_En_12_Chapter/499948_1_En_12_Fig3_HTML.jpg](img/499948_1_En_12_Fig3_HTML.jpg)\n\
  \n图 12-3\n\n业务与 IT 之间的协调者\n\n## 旁观态度\n\n并非每个人都是你的朋友或敌人。许多人介于两者之间，你的很多同事可能尚未做出决定。他们会观望一段时间，然后才决定是支持你还是不支持你。\n\
  \n他们在想什么？简单来说，类似于“如果我们喜欢，我们就跟着做。否则，我们继续做自己的事。”\n\n他们是否因为你有授权而被迫支持并跟随你？\n\n-   正式的董事会支持很棒——但强制忠诚不如自愿忠诚有效。\n\
  -   个别高管的信服式支持也很好——但本质上很脆弱：管理者来来去去。\n\n请不要完全依赖高层的支持！即使你拥有这种支持，也要为没有这种支持的时刻做好准备，同时尽可能充分利用最初那些接纳你的人的初始支持。\n\
  \n在任何组织中，都有一些部门不依赖于“被喜爱”。但数据办公室不是法务部或信息安全部！所有团队都应该*想要*与你合作。\n\n但是，如何培养自愿的忠诚度，又如何说服那些尚未决定的人，让他们觉得站在你这边是可取的？\n\
  \n解决这个挑战的关键是让人们想要参与进来。他们需要变得有责任感，并且需要预见到不配合会带来的不利之处。\n\n我的建议：\n\n**努力克服“我们 vs. 他们”的陷阱。**\n\
  \n记住我在第 1 章谈论“集中式数据治理”时说过的话？一个人忠诚的程度和方向通常通过微小的词语表现出来，其中之一就是“我们”。\n\n如果你仔细听一个人说话，你会发现当他说“我们”时，指代的是什么。\n\
  \n你会发现，人们通常指代的是自己所在的部门或团队。这是竖井思维的警示信号。这表明他们意图优化自己所在的部门，而不是寻求组织的整体最优。\n\n员工经常用“我们”来描述全体员工，而用“他们”来描述高管。这种观点也暗示了你组织内部存在着迫在眉睫的利益冲突。\n\
  \n好消息是，你可以影响这种情况。\n\n> 注意\n>\n> 这并不是要改变语言（那只能治标！），而是要鼓励每个人都关注***整个***组织。\n\n你不需要要求人们利他。相反，你要让人们认为“如果这对组织有好处，那对我也一定有好处！”\n\
  \n而在首席执行官（毕竟他代表着整个组织）眼中成为一个优秀的贡献者，对他们来说也是一个完全可接受的动机。\n\n反过来，你可以提出与数据相关的绩效指标（理想情况下甚至可以与奖金挂钩），让人们因在*其他*领域提供了更好的数据以及取得了与数据相关的成功而获得奖励。\n\
  \n一个首席数据官（CDO）和数据办公室，从其定义上来看，着眼的是整个组织而非仅部分部门，因此能立即从这种视角中获益。\n\n一旦某位业务同事（潜意识里！）开始使用“我们”这个词来指代“你和我”，你可能就找到了一个很有前景的合作伙伴。\n\
  \n最终，在高管中，你应该寻求与那些经常使用“我们”来指代整个组织——而用“他们”指代其竞争对手——的人进行合作。\n\n\n\n### 置身事外\n\n*“让我们坐下来看看首席数据官(CDO)如何解决我们所有的数据问题……！”*\n\
  \n置身事外是否令人感到惬意？你可以向后一靠，看着别人试图完成任务。如果那个人成功了，你可以祝贺；如果失败了，承担责任的是那个人，而不是你。\n\n有一定数量的超然同事是没问题的。但当你面对太多置身事外的同僚时，你会作何反应？也许“置身事外”已经发展成组织文化的一部分，因为那些积极参与的人被分配了执行任务，或者积极参与的管理者被视为“资历尚浅”。\n\
  \n通常的经验法则是：让人们负起责任，并奖励那些提供支持的人。\n\n以下步骤可能会有所帮助：\n\n-   公开地与那些与你并肩作战（并且值得这份荣誉！）的人分享成功的荣光。与你合作必须让他们有所回报。赞美不会让你付出任何代价。\n\
  -   将数据办公室的精力集中在支持那些积极参与的同僚的活动上。除非你有一个非常庞大的团队，否则这足以让你忙个不停！\n-   利用你的职权（和治理机制）将数据方面的责任分配给同僚。并利用数据所有权机制。那些置身事外的人最终可能会留下对所有人可见的、糟糕的记录。\n\
  -   邀请知名的支持者加入你的治理机构。让这些机构来决定处理数据时的责任归属。让人们渴望被邀请进入这些委员会，以免决策权落入他人之手。让他们明白要如何才能获得席位。\n\
  -   向置身事外的同僚提议相关数据角色：“鉴于您在分析和市场营销方面的专业知识，我想建议（也可以说：推举）您作为组织的‘数据倡导者’，代表整个市场营销部门！”\n\
  -   证明“数据”是面向未来的，并且会一直存在。描述早期参与者的机会。让人们不想错过这趟列车。\n\n### 怀疑主义\n\n*“又要增加一层官僚机构……！”*\n\
  \n人们见过太多的热潮来了又走，都承诺会带来显著的改进。但大多数不仅未能兑现，反而总是增加了复杂性。\n\n一个新的、专门的数据管理机构可能会引发同样的担忧。你通常会听到这样的说法：“为什么我不能直接找\
  \ IT 部门了？如果中间夹个数据办公室，一切只会变得更慢！”或者“是的，数据很重要。但再增加一个职能又能带来什么附加值呢？”\n\n这种看法可以理解，但很危险。如果不能（迅速！）妥善处理，它会导致人们忽视新的数据办公室，继续像以前一样工作。这种行为已经导致整个数据办公室变得无用和被边缘化。\n\
  \n你不能通过传统的培训来解决这种情况。在这种情况下，人们首先需要的不是*知道*——他们需要的是*看到*。\n\n但是，如何让不同层级、不同角色的员工“看到”呢？\n\
  \n如果你无法通过执行典型的数据办公室活动来立即创造可见的价值，那么就帮你的同事一两个忙吧！\n\n换句话说，倾听他们的担忧——不仅是数据方面的！在你力所能及的地方帮助他们。借给他们一个项目经理来有效地建立他们的项目。让你的词汇表经理从语言角度审阅他们的文档。诸如此类。\n\
  \n这种做法可能看起来会不必要地分散你对“真正任务”的精力。但是，请相信我，这是一项值得投入的精力！\n\n### 业务傲慢\n\n这可能是一个大胆的标题。但是，任何曾有过被同事拒绝帮助经历的人，都知道看到那些自认为可以独自完成一切的人失败是一种什么感觉。\n\
  \n是的，有时候接受支持的建议是困难的——即使你正在挣扎。这是源于你自己的骄傲、感知到的他人的期望，或者是“靠自己独立完成一切”的雄心。\n\n即使这种行为不符合为组织尽最大努力的责任，也没有人会轻易放弃它。\n\
  \n你可以通过双边和多边的方法来解决这类情况。\n\n**双边**方法寻求与拒绝你支持的同事进行个人对话。第一步是找出所观察到行为背后的潜在动机。\n\n然后，你可以根据你对对方的了解来制定你的策略：\n\
  \n-   你可以提议将你的贡献隐藏在幕后，这样同事看起来仍然是成功的。或者你提出一种正式的合作伙伴关系，既能展示目标的达成，也能体现协作。\n-   你可以达成一个协议，例如，一个业务计划的第一阶段在没有数据办公室支持的情况下完成，而第二阶段则从一开始就让数据专家成为团队的一员。\n\
  -   第三种选择是反向寻求帮助，以避免出现别人欠你人情的情况。\n\n**多边**方法旨在建立一种鼓励相互支持的文化。这可能会达到一种程度，即那些不主动寻求帮助的人会显得不好。\n\
  \n当有太多的人真心相信他们自己更懂，或者他们传统的方法优于数据驱动的方法时，通常建议采用这种选项。\n\n然而，如果这些人只占一小部分，你可能什么都不需要做。让他们失败，集中精力支持其他人。\n\
  \n## 总结：成功的先决条件\n\n经历过所有这些挑战，我们看到很多缓解或解决它们的方法。\n\n但同样公平地说，一些成功的先决条件是首席数据官无法控制的。\n\
  \n如果你无法满足以下三个先决条件，那么你作为 CDO 的努力可能会举步维艰。\n\n### 董事会的支持（积极的！）\n\n你需要的是真正的支持，而不是同情。\n\
  \n“这是正确的事情，没有备选方案。我会捍卫并推动它。”这种表态会管用。\n\n“看起来不错。去试试创造价值吧……”这种表态不会让你成功。\n\n不要指望任何董事会成员都已经完美准备好支持你——这是罕见的例外。即使是那些设立你职位的人，可能也只是履行了一种被感知到的义务：“作为一个现代化组织，我们应该有一个\
  \ CDO。”然而，这并不能保证必要的支持。\n\n除了让你的团队能够开展工作，或者在你从零开始组建团队之外，我建议你在头 30 天内把大部分时间花在个人对话上，首先要与日常处理数据的同事交谈，然后是与董事会成员交谈。提出问题，确定痛点。与高管交谈时，始终要解释、说明并概述如果得不到董事会的全力支持会带来的风险。\n\
  \n你不需要所有董事会成员都全心全意支持你。但你身边需要有关键人物。记住，他们不需要理解数据逻辑和算法的细节。但他们必须确信 CDO 和数据办公室是必要的，并且他们必须相信你是担任这个角色的合适人选。\n\
  \n30 天后，你可能希望对自己的处境进行个人评估：你感觉自在吗？如果描述的任何一项挑战变成现实，你有足够多的董事会成员可以依靠吗？你有多大信心董事会会支持你，或者至少不会支持你的任何反对者？\n\
  \n\n\n#### 适当的汇报线\n\n如果你作为首席数据官需要向首席财务官汇报，请设身处地想一想：首席财务官会优先解决财务问题，还是支持客户服务、销售和生产？\n\
  \n答案很简单。如果一位首席财务官“拯救了世界”，却没有解决财务挑战，那么评判结果将是“不及格！”\n\n因此，在这种情况下，该受责备的不应是这位高管，而应是组织的汇报与奖励结构。\n\
  \n职能型高管处理职能型问题——跨职能型高管处理跨职能型问题。道理就是这么简单。\n\n因此，首席数据官应向跨职能型高管汇报，或向拥有明确跨职能授权职能型高管汇报。\n\
  \n遗憾的是，大多数高管职位都是职能型的——无论是市场营销与销售、运营、人力资源，还是财务。有些组织甚至只有两名员工拥有跨职能角色：首席执行官和首席执行官的个人助理。\n\
  \n事实上，考虑到数据主题的关键性，向首席执行官汇报对首席数据官来说并非最差的选择。然而，许多监事会希望数据办公室在证明其价值并证明其关键性之后，才会将首席数据官纳入董事会。首席数据官进入董事会的门槛仍然很高。\n\
  \n在这种情况下，应该设立一个首席转型官、首席创新官或类似的、明确肩负跨职能职责的职位，让首席数据官向其汇报。\n\n如果组织中不存在这些角色，首席执行官可以明确授予董事会某位成员一项额外的跨职能授权，使其在现有职能职责之外，足以管理数据。\n\
  \n不要接受降低标准的安排！这并非关乎你能否身居高位——而是关乎你能否做好自己的工作。\n\n![../images/499948_1_En_12_Chapter/499948_1_En_12_Fig4_HTML.jpg](img/499948_1_En_12_Fig4_HTML.jpg)\n\
  \n图 12-4\n\n不当汇报线示例\n\n#### 明确的期望\n\n你是新任首席数据官，因此人们可能会期望你实现世界和平、消除贫困、预防地震。\n\n对吧？\n\
  \n当然，这显然被大大夸张了，但期望的范围确实很广。从“至少不会造成什么害处……”到“我们期望那 15 个人能把我们从一家实体企业转变为数字企业”。\n\n因此，你的目标不应该是提高或降低期望。相反，你应致力于对首席数据官能够且应该实现的目标，形成一个既雄心勃勃又切合实际的看法。\n\
  \n此外，你应该将期望与假设联系起来：“如果发生了 XYZ，那么我们就能够实现 ABC。”这一点很重要，原因有二：这能降低你受自身无法影响的外部因素的制约程度；同时，这也让你能够预先阐明自己在财务、组织和战略方面的需求。\n\
  \n很快，你可能就希望整合出一份你的 *conditio sine qua non*^(³³)，也就是那些你不愿做出任何承诺的条件。\n\n这些条件可能包括你的预算和人员配置状况，以及所需的最低程度的组织和战略自由。\n\
  \n你当然能够判断在是否接受这份工作邀请之前，应该提出其中多少条件——但迟迟不提其余条件可能并非明智之举。\n\n虽然你会在上任的头 30 天致力于争取高管支持，但在第二个月，结合你的高层目标与计划来提出你的需求，或许是恰当时机。\n\
  \n但不要花太多时间详细阐述那些计划。相反，你应该着手关注最初的“低垂果实”，因为你可能希望在担任首席数据官的头 100 天内，交出一份积极的工作成绩单。\n\n\
  ![../images/499948_1_En_12_Chapter/499948_1_En_12_Fig5_HTML.jpg](img/499948_1_En_12_Fig5_HTML.jpg)\n\
  \n图 12-5\n\n数据——董事会真正关心的是什么\n\n#### 数据事务中明确的角色\n\n你可能希望尽早明确自己大致的职责范围。这有助于避免因其他领域的问题而受到指责。你的首席财务官应该明白，你的团队不应对数据湖配置错误或对关键数据源的访问延迟负责。如果只在你的团队因他人造成的复杂业务项目整体延误而受责后才澄清这些事宜，那听起来像在找借口。\n\
  \n像数据办公室这样的新职能，不可避免地会改变各职能职责之间的界线。\n\n除了在组织层面需要避免职责重叠或空白，你还应在最初几天里防止内部竞争，例如与 IT\
  \ 团队、可能存在的数字化团队、业务转型团队等的竞争。\n\n你还应利用这段时间，概述你关于数据相关决策与协作机构的构想，包括应邀请谁、他们的任务和权限是什么。\n\
  \n虽然你的详细组织架构会随着时间逐步完善，但你或许希望在头 60 天内解决这些根本性的冲突源头。这将使你日后能专注于相关的内容主题。\n\n再次强调，这并非要扩大你的职责范围——而是为了管理期望。\n\
  \n脚注 1\n\n"
- "# 13. 首席数据官如何（不）行事\n\n![../images/499948_1_En_13_Chapter/499948_1_En_13_Fig1_HTML.jpg](img/499948_1_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1\n\n领导者的四个秘诀？\n\n## 不要依赖正式权威\n\n当然，你应该坚持在拥有足够正式权威的前提下起步——但不要依赖它：是的，每个人都应该知道董事会支持你。然而，这只是“必要条件”，而非“充分条件”。\n\
  \n因此，在许多情况下，你将不得不运用非正式的权力。\n\n用 Monty Halls^(³⁴)的话来说，你正面临“人生中需要你引领的时刻”。你不能只是管理、授权或执行。\n\
  \n## 从小处着手，谨慎选择“战场”\n\n你不必在上任头 100 天内就让组织的收入翻倍。相反，问问自己：\n\n- 最显著的痛点是什么？\n- 哪些领域数据处理（最）低效？\n\
  - 哪些是“低垂的果实”？\n- 到目前为止，哪些领域没有人愿意接手？\n\n你最初行动的重要标准不是“效率”，而是“有效性”。换句话说，绝对结果比结果与付出的比例更重要。\n\
  \n劳埃德银行集团应用科学主管 Abhijit Akerkar 给出了一个很好的建议。他说：“不要从你数据最多的地方开始——要从影响最好的地方开始。”\n\n\
  但不要把这理解为建议你不择手段地采取策略。为了避免肮脏的变通方法，你处理即使是最初的那些主题时，也应确保解决方案以后能够推广到具体案例之外。\n\n\n\n##\
  \ 保持谦逊\n\n不要试图摆出无所不知的姿态，也不要假装你的职位本身就赋予了你指挥他人的权力。\n\n正如 Gartner 公司马克·科尔曼在 2017 年伦敦数据与分析大会上所警告的那样：“试图强制控制会招致抵抗，而非合作。”\n\
  \n那么，替代方案是什么呢？\n\n-   与其说“从数据角度看，你需要这样做”，不如问“您想了解您的方法对数据产生的影响吗？”\n-   与其说“数据将比你当前的工作做得更好”，不如说“数据将助您进一步优化工作”。\n\
  -   与其说“你需要控制好你的重复数据”，不如说“我相信你已经很好地控制了重复数据。能否与我分享一下你是怎么做的？”\n\n请注意，第三个问题并非诱导性问题！如果重复数据**没有**得到控制，对方将不得不承认这一点，届时你可以提供帮助。如果数据管理得当，你甚至能从中学习。你可以肯定其方法，并询问双方能否将这一概念推广到组织的其他领域。\n\
  \n### 以协作者姿态示人\n\n并非所有数据活动都需要集中管理。相反，所有处理数据的职能部门都应理解数据。你的数据办公室应在以下方面提供支持：\n\n- \
  \  打好基础：业务团队可以开展工作所依据的基础。\n-   提供可适应不同业务需求的治理框架。\n-   提供培训与教育。\n\n目标可以是让你的同事工作更轻松，以便他们能专注于核心职责。（请记住，他们中的大多数人从事某些基础性工作，仅仅是因为这项工作不可或缺，且没有其他人愿意做。）\n\
  \n**分析示例**：如果业务部门有自己的分析团队，你可能不希望将这一职能剥离。相反，你的团队负责提供基础，即明确定义的“单一事实来源”、无歧义的术语以及企业级标准化数据模型。这样，这些团队就能深入数据，从其职能角度获取洞察，而无需再处理所有基础性工作。请记住，你需要在组织级事实（已预处理）和职能分析的自由度之间找到平衡。\n\
  \n请记住，你可以*主动提出*负责某个部门的分析任务。有些部门可能会乐于接受你的提议（这或许能让你打造出更强大的分析卓越中心）。人们喜欢拥有选择权。只要从数据管理角度看两种选择都可接受，就给予他们这个选择权。\n\
  \n**参考数据管理示例**：业务部门应维护其拥有的数据。数据管理团队甚至可能不需要在此扮演审批角色——只要规则已制定、审批流程已定义即可。\n\n### 避免不当用语\n\
  \n你和团队成员使用的语言与面向内部客户的语言是不同的。市场营销负责人可能不知道什么是实体关系图。然而，从内容上讲，如果用非技术性语言解释，他或她会立刻明白两个实体之间所期望的关系。\n\
  \n此外，你应该从对话对象的角度出发，这不同于你的数据视角。对业务人员而言，遵守企业数据模型并无实际意义——他们看不到遵循 CDM 的任何好处。\n\n最后，问题不仅仅在于避免技术术语。\n\
  \n哪些词汇是业务人员*不想*听到的，即便内容与他们相关？这个清单因组织而异，但以下词汇几乎总会榜上有名：\n\n-   数据\n-   治理\n-   规则；合规\n\
  -   等待；长期\n-   数据模型（包括相关的术语，如对象或基数）\n\n确定适合你所在组织的清单会很有帮助。请为所有这些词汇和表述思考替代方案。向同事们解释，并询问他们如何称呼。在正式启用任何替代术语之前，先与同事进行测试。\n\
  \n### 走出去与人交流\n\n如果不四处走动（或出差），与人交谈，你就不可能有效地将传统组织转变为数据驱动型组织。\n\n或者，正如曾带领 DHL 快递扭亏为盈的首席执行官肯·艾伦所说：“有一件事是肯定的：你不可能坐在办公桌后面就建立起卓越的业务”（Allen,\
  \ 2019）。\n\n数据管理关乎信任，其重要性超过其他一切。\n\n如何赢得信任？面对面与人交谈。拜访他们的工作场所——无论是高管办公室还是流水线。\n\n\
  并且，不要一开始就分享你的真知灼见。要学会倾听和提问。\n\n与那些你期望他们日后阅读并遵循你信息的人建立人际关系至关重要。扪心自问：你*自己*又是以多大的热情去阅读一个陌生人的信息呢？\n\
  \n脚注 1\n\n## 利益相关方\n\n![../images/499948_1_En_14_Chapter/499948_1_En_14_Fig1_HTML.jpg](img/499948_1_En_14_Fig1_HTML.jpg)\n\
  \n图 14-1\n\n并非所有人都喜欢你的信息\n\n### 管理各级利益相关方\n\n与任何其他角色一样，你需要了解自己在组织中的地位，才能规划你的行动方案。为此，你必须：\n\
  \n-   识别你的支持者和反对者\n-   了解他们的知识背景和动机\n-   准确把握他们的支持程度，即他们帮助你实现目标的意愿和能力\n\n利益相关方管理并不局限于高层。实际上，组织内的每一个人都是利益相关方。（你见过哪个领域不处理数据吗？）数据管理不能（也不应该试图）躲在一个舒适的角落里，只与邻近部门打交道……\n\
  \n本章旨在分享关于有效利益相关方管理的一些想法。大多数想法并非数据管理所独有，因为这都关乎如何与跨部门、跨层级的人打交道。\n\n#### 记录你的洞察\n\n\
  你可能已在公司工作多年，并且自信对多数利益相关方已经“了如指掌”。\n\n但是，你知道是什么在驱动他们所有人吗？你确定他们对具体提案会作何反应吗？\n\n为了真正有效地管理利益相关方，你需要付出额外的努力。而这类努力正是我们常常试图避免的：繁琐的记录工作。但我向你保证，这种努力是值得的！以下是我最喜欢的三步法快速总结：\n\
  \n1.  系统地维护一份（可能非常庞大的）利益相关方名单。涵盖所有职能部门和所有地区。\n2.  将利益相关方分为对你的想法和愿景持积极、中立和消极态度三类。\n\
  3.  记录某人是否**积极**支持或抑制。这些人需要特别关注。\n\n\n\n#### 对利益相关者进行分类\n\n你最忠实的支持者通常可以在那些对现状不满的人中找到，尤其是那些你作为`CDO`打算解决的问题所涉及的人。因此，在四处宣讲你的故事时，要留意这些人。\n\
  \n等等——还有第二个标准！你不要那些总是抱怨或对一切都感到不爽的人。你要找的是那些准备并愿意采取行动的人。唉，你得预料到他们只占少数（见图 14-2）。\n\n\
  ![../images/499948_1_En_14_Chapter/499948_1_En_14_Fig2_HTML.png](img/499948_1_En_14_Fig2_HTML.png)\n\
  \n图 14-2\n\n寻找你的支持者\n\n这些人就是你想要让他们参与所有讨论的人，让他们（正确地）觉得，*你*就是他们长久以来一直在等待的那个人。\n\n\
  你如何确定这些支持者？\n\n1. 确定“积极参与者”。\n   并非所有不满且有远见的人都准备好积极支持你。你可以阐述你的愿景，所有人都表示同意。这是否意味着你现在获得了广泛支持？不幸的是，未必如此。你需要进行某种形式的“淘金”，才能最终找到那些“金块”——也就是那些为数不多、会积极支持你的人。在此过程中，你需要识别并暂时排除以下几类人：\n\
  \   - 那些喜欢你的想法，但也能接受现状的人。对他们来说，机会的价值不足以抵消参与可能带来的摩擦。\n   - 那些总是抱怨，但自己没有任何动力去改善任何事情的人。\n\
  \   - 那些有很棒的想法，但没有精力去付诸实施的人。\n   - 那些看到了价值，但希望**你**能包办一切，因为他们要么太懒，要么忙于其他事情的人。\n\
  \   - 那些嘲笑抵制者、以显示自己高人一等的愤世嫉俗者。\n   - 那些假装理解，但实际上毫无头绪的人。\n   - 那些希望你成功，但自己并不需要通过这种改变来（被认为）成功的人。\n\
  \n2. 确定“不满者”和“远见者”。\n   - 如果有问题存在，那么当前必定有人深受其苦——找到他们！沿着层级向上追溯，从告诉你问题的人开始，一直找到那些认为当前状况是个问题的高层管理人员。\n\
  \   - 即使当前没有问题，也可能有人理解数据如何帮助改善现状——找到他们！你可能会找到比管理者更多的专家——这没关系！\n\n剩下的就是那些“金块”——通常是一小部分愿意采取行动的不满者或远见者。我指的是那些公开支持你的想法、抵御阻力的人，那些为你的计划投入时间或资源的人，以及那些与你共担失败风险的人。他们就是你——跨越所有层级——要寻找的人。\n\
  \n#### 确定你的高管盟友\n\n当然，一个强大的盟友比一个积极但却是“纸老虎”要好得多。这就是为什么你应该特别关注那些你希望（且需要）成为你盟友或赞助者的人。这通常会是少数几个有影响力的高管。这些关系值得你投入大量时间和精力。\n\
  \n如果你自己没有担任董事会成员这种奢侈条件，你需要一位执行发起人。而且，这必须是一位积极的发起人！正如 Brent Dykes^(³⁵) 曾经在他的博客上所言：\n\
  \n> 成功与失败的区别，通常归结于发起人的[承诺和参与程度](http://www.computerworld.com/article/2557876/it-project-management/the-elusive-executive-sponsor.html)。没有承诺，一位积极参与的执行发起人可能会参加每一次会议，但只会口头支持——从不以项目成功所需的资源、预算或政治影响力来支持它。没有参与，一位承诺坚定的执行发起人则会变成一个缺席的拉拉队长，他太忙了，以至于无法为项目的成功做出贡献。（Dykes,\
  \ 2016）\n\n#### 了解你盟友的动机\n\n人们站在你这一边可能有各种原因。这很正常。但你始终应该知道*为什么*某个人想要支持你。\n\n-  那些为了“更宏大的利益”而行动的人，通常是最可靠的支持者——但很少是最有影响力的。\n\
  -  那些认为你的敌人也是他们的敌人的人，是危险的支持者。他们的观点可能随时改变，例如当人们调任新职位时。\n-  可能有些人期望你解决他们自己造成的、可能与数据无关的问题。在这里，你需要管理他们的期望，同时确认你将让他们的生活变得更轻松。\n\
  \n总而言之，请记住，你的支持者并不等同于“好人”，正如你的反对者也不一定是“坏人”。你的一些同事可能出于好意而反对你，而另一些人则可能出于自私的原因支持你。\n\
  \n#### 具体建议\n\n1.  **绝不回击。**\n    你的反对者会试图伤害你。不要以牙还牙。旁观者将无法判断谁对谁错。\n\n2.  **与董事会成员保持对话。**\n\
  \    董事会成员应该始终意识到行动的必要性。建议与个别董事会成员定期召开会议，或同意不时地沟通交流，这样你就不会沦为一个乞求者。\n\n3.  **让人们提供资源。**\n\
  \    如果你需要资金，与已有资助的计划合作：尝试创造一个双赢的局面，让他们因你的加入而受益。这种情况常常会激励项目负责人分享他们的预算和资源。此外，值得确定并利用志愿的\
  \ IT 资源：那些喜欢你的想法并有一定精力支持你的人，无需任何正式的资源分配。\n\n4.  **调解，调解，再调解。**\n    不要低估在不同关切之间进行平衡的力量。与个人交谈，与成对的人交谈。倾听！为谈判增加不同的维度，以避免陷入“分蛋糕”的局面，让各方固守自己的“红线”。一个成功的调解者能让双方都受益。\n\
  \n5.  **积极建立信任。**\n    信任几乎不可能通过技巧获得——它必须真正地赢得。你应该通过你的行为证明自己是一个值得信赖的人：\n    -  \
  \ 保持可预测性。\n    -   推广组织目标，而非个人目标。\n    -   信守承诺。\n\n6.  **创造盟友，而非下属。**\n    没有人应该因为被迫而跟随你，更不用说因为恐惧了。另一方面，大多数人不会仅仅因为你是个好人就支持你。因此，专注于创造价值、寻找**共同基础**、并塑造双赢局面至关重要。试点项目大有裨益。它们能让你快速展示切实成果，从而提升接受度。\n\
  \n7.  **投入时间和精力。**\n    我前面已经提到，理解单个参与者为什么会有如此行为至关重要。不要接受简单的答案！有时，你可能需要进行彻底的根源分析，才能触及某人动机的根源。\n\
  \n8.  **与“积极参与者”合作。**\n    你不仅仅是“拥有”支持者——你需要积极地让他们参与进来。这里有一些想法：\n    -   与支持者一起构建论证方案。这需要是一个共同的方案，而不是“你个人的”方案。\n\
  \    -   创建由那些准备按你的思路行动的人组成的虚拟团队。\n    -   让他们发声。不要期望他们盲从你的想法。\n    -   就共同愿景达成一致。与他们所有人一起制定一个可执行的计划。\n\
  \    -   给人们一个（正式或非正式的）角色，使他们成为你事业中的常规组成部分。\n\n\n\n### 为利益相关者量身定制你的故事\n\n大约 500\
  \ 年前，在东方某地，天才奥马尔发明了一种新型茶壶。他采用新型黏土，制成双层结构，中间夹着一层空气。由于使用了预制模具，生产效率高且成本低廉。\n\n他决定将茶壶卖给苏丹。获准觐见后，他讲述道：“看，这个茶壶容量巨大，能长时间保温，手柄非常舒适，而且生产成本比传统茶壶更低！”——“那又怎样！”苏丹说，“我只要吩咐一声就有茶喝，茶水从来都够，有奴隶为我保温，我也从不需要碰手柄。更何况，与我的财富相比，节省的那点钱根本不算什么。我没兴趣！下一位！”\n\
  \n回到家，奥马尔重新思考了一遍。这么多实实在在的优点！苏丹就是不明白——真是个傻瓜！如果他记住了我，以后我再也没法向他推销任何东西了。\n\n奥马尔决定搬到另一个苏丹国，在那里再试一次。但这次，他选择了不同的策略。他明白了，不该责怪苏丹，而该怪自己那套蹩脚的推销说辞。\n\
  \n于是，他确定了宫廷中的相关利益相关者，包括厨师长、苏丹私人奴隶的主管、司酒官和财务官。然后，他与每个人分别约谈。\n\n他向厨师长解释说，他的保温茶壶不需要持续加热，因此相比传统茶壶，能更长时间保持茶香稳定。财务官得知每把茶壶能节省多少钱（以及大量采购能节省巨额开支）。主管则有机会测试茶壶的用户友好性，并确认手柄真的不会发烫——这能为奴隶们省去不少麻烦。后来，奥马尔邀请苏丹的司酒官共饮一杯茶，向他展示自己陶坊生产销售的这些新茶壶使用起来多么方便。\n\
  \n几天后，在一次苏丹与核心顾问的会议上，一名奴隶被烫伤了手指，失手将茶壶摔碎在地上。\n\n愤怒的苏丹召来奴隶的主管，要求他确保此类事情不再发生。主管道歉，并提到一家名为“奥马尔陶坊”的新店有款茶壶，表面不会发烫。司酒官补充说，奥马尔的茶壶几乎从不洒茶。\n\
  \n正在监督顾问会议膳食供应的厨师长也证实，奥马尔陶坊的茶壶能保持茶香，避免茶汤苦涩。\n\n苏丹说道：“奥马尔的茶壶一定很出色！恐怕要花大价钱，但可能值得投资！”\n\
  \n财务官插话道：“如果我没弄错，这些茶壶甚至比我们一直采购的还要便宜。”\n\n“那究竟为什么，”苏丹说，“我们到现在还没买这些茶壶？”不久之后，奥马尔陶坊便被称作“苏丹陛下御用供应商”。\n\
  \n首席数据官们能从这则故事中学到什么？\n\n![../images/499948_1_En_14_Chapter/499948_1_En_14_Fig3_HTML.jpg](img/499948_1_En_14_Fig3_HTML.jpg)\n\
  \n图 14-3\n\n讲述能引起共鸣的故事\n\n1. 光有充分的论据站在你这边是不够的。\n2. 不同的利益相关者关注不同的方面。\n\n### 提出正确的问题\n\
  \n为什么在提出故事或方案之前，先向利益相关者提问并倾听他们如此重要？\n\n你可能已经猜到了：在为利益相关者构思一个恰当的故事之前，你需要了解该利益相关者的立场。\n\
  \n请预料到每个人——不仅仅是高管——都会问“这对我有什么好处？”你需要准备好令人信服地回答。而不同的利益相关者需要不同的答案。\n\n那么，如何为每个利益相关者打造一个完美的故事呢？第一步，专注于利益相关者抱怨或至少认同的任何差距。\n\
  \n这让你能够挑选出一两个对该利益相关者造成严重困扰的弱点，或者你认为自己能提供最有吸引力解决方案的弱点。\n\n你可以从列出现有组织中可以通过数据方法克服的弱点清单开始。第二步，核实关键利益相关者如何看待这些差距：\n\
  \n1. 他们是否认同你的判断？\n2. 如果你向他们解释，他们是否会认同？\n3. 他们认为自己能独立解决，还是通过现有组织解决？\n4. 或者，他们是否会否认弱点的存在（也许因为他们本身就是问题的一部分）？\n\
  \n这份（动态更新的！）文档——一个简单的矩阵就足够了——应该成为你主动管理利益相关者的基础。\n\n你的故事随后应该包含根本原因分析：是什么导致了这种弱点？正如我们从六西格玛中了解到的，通常需要平均问五次“为什么”，才能找到最终的根本原因。\n\
  \n只要有可能，就用真实的案例来丰富你的故事。当你与高管交谈时，如果你使用从他们团队成员那里了解到的案例，可能会更容易引起共鸣。\n\n以下是一些你可以向任何董事会成员提问的问题：\n\
  \n1.  **关于前进方向的初步想法**\n    *   制定一项数据战略来支持公司战略，怎么样？\n    *   开展跨职能协作，怎么样？\n    *\
  \   提高所有员工的数据意识，怎么样？\n    *   定期衡量我们数据质量，怎么样？\n\n2.  **现状问题**\n    *   我们是否拥有合适的人才？\n\
  \    *   我们是否以最佳方式处理数据？\n    *   （**您**是如何处理数据的？）\n    *   我们是否已为数据做好准备？\n    *\
  \   您今天是否感到自信？\n\n3.  **认知**\n    *   您是否了解我们组织的数据质量有多好？无论是用于运营目的，还是用于分析？\n    *\
  \   您是否了解我们拥有哪些数据？\n    *   您是否了解我们可能拥有哪些数据？\n    *   您是否了解数据的价值？\n    *   您是否了解其中的机遇？\n\
  \    *   谁在确保您的数据在整个组织中得到一致管理？\n    *   您发现组织的公关危机有多快？是通过分析社交媒体早期发现，还是通过新闻媒体事后才得知？\n\
  \    *   您能否将 Twitter 上关于贵组织的一条负面推文，与涉及该推文作者的某个特定事件联系起来？\n\n\n\n#### 选择正确的弱点\n\n\
  弱点清单本身在很大程度上取决于组织内的具体情况。因此，重点关注来自*业务*视角的弱点至关重要。\n\n像“缺乏数据所有权”这样的问题，*不*应该被列入这份清单。它更应该被视为你在构建故事时从某个弱点中推导出的根本原因之一。\n\
  \n那么，有哪些典型的业务弱点可以通过数据方法来应对呢？\n\n总的来说，你可以区分高管层关注点和日常业务关注点。\n\n典型的日常业务关注点包括：\n\n-\
  \   我缺乏信息。没有系统的方法来找到我需要的东西。\n-   我通常能发现问题，但不知道问题出在哪里，以及何时发生。\n-   如果我想做任何更改，必须在实际变更前几个月提交申请。\n\
  -   我经常发现自己使用的是过时的信息（而且通常我甚至不知道这些信息是否仍然准确）。\n-   我们的 IT 同事不理解我们的业务。\n-   我们的业务同事不理解基本的\
  \ IT 原则。\n\n高管层的关注点可能包括：\n\n-   我们未能及早发现不良的发展趋势。\n-   我真的很想更多依据事实来做决策。但在很多情况下，我根本没有所有相关信息，有时信息的形式让我需要投入大量时间才能使用。\n\
  -   我们缺乏应对市场变化所需的灵活性。\n-   业务变更（例如，引入、更改或移除产品）耗时太长，涉及多个部门及大量手动工作。\n-   我们似乎在收购的组织（或合并后）存在互操作性问题。\n\
  \n正如你所见，这份清单中完全没有出现“数据”这个词——因为业务人员不会用“数据”来思考。\n\n不要责怪他们。老实说，将业务挑战与数据问题联系起来，并进而与数据解决方案联系起来，是首席数据官（CDO）的责任（也是机遇！）。\n\
  \n在听取利益相关者的意见时，你可能会确定一个反复出现的简短弱点清单。然而，这些弱点在不同的业务职能中通常会有不同的表现形式。\n\n能有机会在整个董事会面前陈述你的故事固然积极，但这应该只是最后一步。在此之前，你需要引导大多数董事会成员完成“他们”各自的个人旅程。你不可能在保持演讲简洁清晰的同时，照顾到每个人的具体痛点。\n\
  \n并且，请记住，你不需要呈现不同的现实。只是每个利益相关者的关注点不同而已。在董事会层面的整体故事绝不能与任何个人故事相矛盾。相反，它应该表明，每个个人故事都与你为整个组织规划的数据故事完美契合。\n\
  \n#### 让数据始终成为议题\n\n不要只做一次展示就销声匿迹。高管们往往记忆力短暂，即使他们当时看起来很感兴趣。你觉得至关重要的头等大事，在董事会成员那里可能只是\
  \ 16 个议程中的第 7 项。\n\n以下是一些让对话持续进行的建议：\n\n1.  **确保你能再次获得邀请。**\n\n    反复请求允许向董事会做展示，这不太体面。相反，你或许希望让他们主动要求你回来。\n\
  \n    最好的机会就是你做展示的那一刻。告诉他们，在你负责的领域将会发生很多事情，并询问他们是否希望随时了解你的进展。\n\n    提供具体的定期更新（但要谦虚——不能指望你能成为董事会常设会议议程的一部分！）。\n\
  \n2.  **创建一个常规的数据主题。**\n\n    即使你不参加所有董事会会议，数据也可以成为常设议程主题之一。\n\n    一个有前景的方法是定义一份数据记分卡。指标是告诉人们所处位置的最短路径，而董事会成员喜欢简洁。\n\
  \n    也许董事会已经有了一份定期分享的关键绩效指标（KPI）清单。典型的例子包括客户满意度或各渠道收入。尝试将“数据”这个主题添加进去。也许你还能想出一个朗朗上口的名字，比如“数据仪表盘”或“数据指南针”。\n\
  \n    理想情况下，你手头应该有一套你日常使用的层级化数据 KPI（我称之为数据质量指标，简称 DQI——参见第 10 章关于业务指标管理的部分）。与董事会分享最顶层的\
  \ DQI，只有在有充分理由时才进行细分。\n\n    但不要只关注问题——也要分享相关的改进成果，并描述它们对组织成功（收入、市场份额、声誉等）的影响。\n\
  \n    所有这些都可以浓缩成一个五分钟的更新。关键信息应该是“一切尽在掌握”（希望你确实如此）。基于这条信息，引起他们的好奇心。除了利己心（“这对我有什么好处？”），好奇心是让高管保持参与的另一大驱动力。\n\
  \n## 塑造你的数据网络\n\n以下是组织数据网络中不同要素可能呈现的样子。\n\n### 职能数据倡导者\n\n关于数据倡导者的著述已经很多，结果导致关于他们角色的观点之多，几乎与使用数据倡导者的组织数量一样多。\n\
  \n我偏好的设置是按部门（例如，地理区域或实体）设立数据倡导者，并搭配作为数据模型特定子集业务管理者的数据业务所有者。每个业务职能以及可能每个地理实体都会选择一名数据倡导者，代表该群体在数据领域的利益和需求。这通常是一位经验丰富、精通数据的职能专家所承担的额外角色。\n\
  \n数据倡导者的角色可能包括：\n\n-   作为与数据网络的单一联络点，即负责处理总部和所有实体间跨职能的数据议题。\n-   作为任何团队成员提出的数据相关疑问、咨询或建议的内部“单一联络点”。分享并解释组织的**数据原则**以及数据办公室发布的所有信息。确保其职责范围内的所有人都理解这些内容。\n\
  -   本地数据网络：了解本地的**数据管理员**，以便能让他们相互联系。帮助他们理解自己的工作如何影响其他职能领域数据管理员的工作。\n-   确保将本地专业知识带入组织范围的讨论中，例如，关于本地地址处理习惯、最佳外部数据来源或影响数据处理的本土法规的知识。\n\
  -   确保职能或地理导向的项目明确考虑数据方面，并从数据角度提供支持。与中央数据管理团队合作，保持方法一致性。\n-   理解本地、部门或职能层面的控制措施，以确保日常数据质量。\n\
  -   观察本地活动，留意数据相关问题。基于数据发现，运用六西格玛方法论开展本地行动和根本原因分析。\n-   整合本地对数据的需求（对工具的要求，例如分析可视化；数据源；特定国家的数据结构，例如所需的交易许可证；验证本地数据源，例如在法规发生变化时）。\n\
  -   通过数据网络确定最佳实践（以及*效果不佳*的方法），为自身开展或支持的本地/职能项目做准备。\n-   当来自不同职能的团队成员对本地数据处理方式有不同看法时，促进讨论。\n\
  \n\n\n### 业务数据负责人\n\n数据所有权并非自然而然产生的。大多数业务团队成员并不习惯为数据负责。\n\n但由于数据本质上是跨职能的，当每个可能的数据元素面临变更建议或挑战时，需要有人来协调所有业务职能部门——这个人就是业务数据负责人。\n\
  \n1.  **数据负责人**\n\n    每位业务数据负责人代表数据模型的一个子集，例如，一个数据域（如“客户”或“产品”）。他或她必须与该数据域的所有利益相关者达成一致，超越其自身的业务领域。\n\
  \n    这通常不是一个专职岗位。对于这一角色，组织需要思想开明、不戴“有色眼镜”的人。他们需要能够促进业务职能部门之间的数据协作。\n\n2.  **数据所有权**\n\
  \n    数据域的必要定义应由您的数据架构师协调。他们可以遵循现有的实际标准或最佳实践，但始终应考虑您组织的特性。\n\n    有时，严格沿着数据域边界划分的业务数据所有权并非最优方案，例如，当不同部门负责域内某个实体的不同属性时。在这种情况下，您可能希望偏离组织的领域模型。如果您的领域模型已经分解为业务对象、子域、实体和/或属性，那么这样做会更简单。\n\
  \n3.  **确定数据负责人**\n\n    但如何实际确定业务数据所有权呢？我通常推荐一个三阶段方法：\n\n    阶段一：数据办公室团队确定所有利益相关者的想法，理想情况是通过个人对话。他们会使用领域模型作为模板，引导潜在的业务数据负责人了解所有域，并记录提案。只要某个域或业务对象有志愿者，就很容易打勾完成。\n\
  \n    阶段二：该团队根据在阶段一对业务了解的情况，为所有未覆盖的领域提出业务域负责人。整体结果将形成第一个全面的业务数据所有权矩阵，即不留任何空白点。\n\
  \n    阶段三：业务数据所有权矩阵发送给所有利益相关者，要求进行审阅。提供严格的审阅规则至关重要，以避免个人意见的不可控混杂：\n    *   不要求审阅者表达他们的偏好或观点。\n\
  \    *   相反，期望他们指出不同意的地方，并且最重要的是，说明*为什么*不同意。\n    *   只有基于有效业务理由的质疑才能被考虑。\n    *\
  \   任何未受到质疑的内容均视为已接受。未（及时）反馈视为完全同意。\n\n所有无异议的反馈将被采纳，有争议的所有权点会被标记出来。\n\n结果将通过（跨职能的）数据决策机构传递，以对剩余争议点做出决策。\n\
  \n由于数据办公室按设计原则在所有权分配上并无利害关系，因此您可以接受任何此类业务决策，而不会危及您的数据使命。\n\n### 数据创建者：数据管理网络\n\n\
  这些人员有权按需维护数据——无论是插入新的国家代码还是修改客户记录。他们通常分布在各个部门。\n\n由于数据创建者的工作会影响其他部门，他们应形成一个持续对话的社区。人们并非被“任命”为数据创建者——他们是因其常规业务角色而成为数据创建者的。\n\
  \n### 数据消费者：分析网络\n\n业务职能部门通常拥有自己独立的分析团队。虽然让既懂业务领域又懂数据的人员参与是好事，但这种设置也带来了诸多挑战：\n\n\
  *   大量不同且不兼容的解决方案，各自拥有其技术和逻辑。\n*   对相同数据的不同解读方式。\n*   在数据来源、应用逻辑等方面缺乏透明度。\n*   没有单一的真实数据源。\n\
  *   未管理的数据血缘。\n*   过多不同用户对数据的不受控使用。\n*   隐藏的宝藏：组织中存在大量有价值的数据和逻辑，但人们并未意识到。\n\n对此，数据办公室和\
  \ IT 部门可以为所有业务职能部门联合建立一个分析网络。以下是该网络需要处理的一些典型议题：\n\n*   目标架构（由 IT 主导）\n*   技术与运营（由\
  \ IT 主导）\n*   塑造一个针对分析的联合治理结构（由数据办公室主导）\n*   就衡量和改进数据质量的集体方法达成一致（由数据办公室主导）\n*  \
  \ 协作：团队间经验交流（由 IT 和数据办公室共同主导）\n\n### 双重忠诚\n\n如何让人们愿意成为数据管理网络或数据分析网络的一员？毕竟，他们身处不同部门，向不同的上级汇报。\n\
  \n您当然不想用跨职能的数据忠诚来取代职能忠诚。好消息是，这两种忠诚并非相互排斥。\n\n人们可以通过正式的汇报关系保持其职能忠诚，同时通过成为数据社区的一部分来表达他们对数据世界的承诺（见图\
  \ 14-4）。因此，他们在与另一方互动时，可以成为各自领域的代表。\n\n![../images/499948_1_En_14_Chapter/499948_1_En_14_Fig4_HTML.jpg](img/499948_1_En_14_Fig4_HTML.jpg)\n\
  \n图 14-4\n\n数据专家应对两个世界都保持忠诚\n\n## 协调您的数据网络\n\n对于数据办公室来说，主动协调数据网络是一个极好的机会。\n\n像 Yammer\
  \ 这样的在线协作平台非常适合此目的。但协作平台需要被积极运营。如果人们发现它有用，就会使用它，特别是当他们的疑问得到解答时——无论是来自社区还是数据办公室。\n\
  \n这有助于达到“临界质量”，在较大的组织中您可以更快地达到这一点。没有人会去查看一个每天活跃用户贡献内容少于一条的在线协作平台。\n\n协作平台的一个关键概念是向所有人开放访问权限。虽然指导委员会通常因成员过多而苦恼，但协作平台会随着每个新增成员而获益。\n\
  \n这一点同样适用于信息共享。如果人们知道有一个共享所有信息的单一平台，每个人都会首先去那里查找。\n\n这就是为什么这样一个平台一旦被接受，也可以成为传播与数据相关的消息和信息的绝佳渠道。\n\
  \n最后，请考虑通过联合倡议、竞赛和奖励，让人们感觉到自己是数据社区的一部分。\n\n您可以将成员身份正式化，使其看起来更有价值。这将允许举办“仅限会员”的会议，让人们作为网络成员感受到自己的价值。像印有“数据社区”标签的咖啡杯这样的小物件，会进一步促进这种归属感。\n\
  \n\n\n"
- "# 根据不同受众制定计划\n\n你无法用同一信息打动所有人。\n\n你不仅需要区分董事会成员和行政文员——在与业务人员和数据达人沟通时，也需要选择不同的措辞。\n\
  \n因此，对受众进行正式分组可能是有意义的，即建立你能以类似方式沟通的正式群体。\n\n首先，数据创建者和数据消费者通常每天没有太多可以互相分享的内容。如果你想讨论参考数据维护，数据消费者会觉得无聊。参考数据维护者也不太关心数据可视化。这就是为什么建立两个独立的网络（或共享聊天论坛内的两个独立区域）通常是合理的。\n\
  \n其次，可能需要将数据消费者进一步细分为运营型消费者和分析型消费者。\n\n第三，你通常会发现“数据”视角和“业务”视角之间存在差异。\n\n-   前者专注于数据相关活动，独立于业务案例方面和优先级排序。\n\
  -   后者从整体业务角度看待数据主题：需求、紧迫性、机会、成本、资源和收益。\n\n经验表明，这两种视角涉及不同的人和角色，因此分开组织是合理的。概览请参见图\
  \ 14-5。\n\n![../images/499948_1_En_14_Chapter/499948_1_En_14_Fig5_HTML.jpg](img/499948_1_En_14_Fig5_HTML.jpg)\n\
  \n图 14-5\n\n面向两个不同的数据受众\n\n## 经常提出的担忧\n\n“常见问题”更具挑战性的兄弟是“常见担忧”。我们在本章中已经涉及了大部分内容，以下是总结。\n\
  \n### 你试图解决什么问题？\n\n高管们有各自的重点和问题。这就是为什么你需要为每个人量身定制故事。\n\n让我们来看三个例子。\n\n**示例 1**\n\
  \n**CFO 的故事**\n\nCFO 深知自己角色的重要性。所以让我们问问 CFO：“谁在做相当于 CFO 职责的数据活动？”\n\n大多数组织的数据量超过了有形资产。同样可以使用示例和报告来展示数据的财务价值。\n\
  \n如果你解释为什么“数据是一项资产”，CFO 会理解。\n\n如果数据存在且价值很高，CFO 最不应该否认应该有高级别人员负责管理它。\n\n**示例 2**\n\
  \n**生产部门的故事**\n\n生产主管可能认为没有必要进行主动的数据管理，因为所有 KPI 都已经存在了。\n\n一个有趣的问题是：“你知道你的 KPI 的准确性吗？”\n\
  \n也许生产主管看待数据类似于电力：它就在那里，你只需要接入一个耗电设备就能让它工作。\n\n你的问题可能是：“你能多快发现正在使用的数据是错误的？”以及“错误的数据引导你的生产过程会有什么后果？”\n\
  \n使用来自操作层面（例如，缺陷传感器的数据）和商业层面（例如，不正确的产品需求数据）的示例至关重要。\n\n**示例 3**\n\n**法务部门的故事**\n\
  \n为什么你所在组织的律师会对数据管理感兴趣？\n\n有趣的问题可能是：“你是否全面了解我们组织隐私政策的遵守情况？我们能确定通过外部审计吗？你能承诺不会保留任何个人数据超过必要时间吗？你知道组织中所有负责个人数据的人员吗？”\n\
  \n此外，你可以询问，如果组织被起诉，是否能够迅速汇集所有信息来证明其清白（或者及早发现确实存在问题）？\n\n显然，还有很多问题可以通过数据管理来解决。维护一个常设的主题列表很有帮助，其中包括所有负责人（或受影响最大的人）。你通常不需要描述你打算如何解决这些问题，因为大多数人更关心最终结果，而不是达成结果的方法。\n\
  \n### 这对我有什么好处？\n\n要使数据办公室成功，他们所做的一切都必须带来益处。不是为了他们自己——这太短视了。不是为了组织——这太遥远了。不，你需要说服个别同事，你的工作能改善他们的处境。\n\
  \n这并不意味着你需要调整你的目标。相反，如果你将预期益处的重点转移一下会有所帮助：从有效但抽象的数据中心目标（如“高质量数据”或“单一数据源”）转向业务团队能够理解的好处。\n\
  \n通常，你会发现人们愿望清单上最重要的是什么——我们称之为“A”。然后你思考数据如何帮助实现这些愿望——我们称之为“B”。那么价值主张就简单地表述为“通过 B\
  \ 实现 A”。\n\n示例多种多样，例如“通过流程自动化降低劳动力成本”、“通过实时提供所有客户和案例相关信息提高联络中心座席的一次解决率”、以及“通过按星期几精确预测需求来减少过度生产”。\n\
  \n“这对我有什么好处？”的第二个组成部分是经常被低估的个人方面：“这对我个人有什么好处？”\n\n请注意，人们通常不会这么直白地说出来——你需要从字里行间去发现。\n\
  \n在一些（理想的）情况下，部门的成功会成为个人的成功。然而，人们通常渴望个人利益，例如日常工作更省力、自身成就更受关注、或者免受同事的无理指责。\n\n最后，有时你可能需要要求人们遵循你的指示，而他们无法获得（部门或个人的）好处。对“这对我有什么好处？”这个问题的诚实回答可能是：“没有。只是从股东的角度来看更好。”\n\
  \n这显然很难推销，因为大多数人不像亚里士多德曾经提倡的那样，纯粹为了行善而行善。\n\n在这种情况下，你可能需要反过来提供一些东西。谢天谢地，数据办公室的产品组合中有如此多的附加价值，你应该能够为每个人提供一些东西——无论是常规的数据服务，还是数据团队有能力做的其他事情，无论是为了满足部门需求还是个人需求。\n\
  \n\n\n### 我没精力处理数据相关的工作\n\n我记得有一位刚上任的 CFO 对 CDO 说：“你有很多有趣的想法。我保证，一旦我有时间，就会仔细研究。但首先，我需要解决几个紧迫的问题。”\n\
  \n在这个案例中，“时间”既指资源的可用性，也指必要的注意力。而目前，注意力都集中在大量具有极高管理能见度的短期议题上。\n\n由于在该组织中，CDO 向 CFO\
  \ 汇报，因此数据办公室团队在其支持角色内尚可自由运作，但短期内无法朝着数据驱动型组织进行战略发展。\n\n从这个故事中，你可以得出两点建议：\n\n1.  **数据需要快速交付价值。**\n\
  \n    如果你通过数据提供附加价值，请不要专注于规模最大或商业案例最突出的举措。\n\n    相反，应从那些你能快速交付、且不需要数据办公室之外投入太多资源的举措开始。这能增加你获得机会来证明自身价值的概率。\n\
  \n2.  **数据不是“额外工作”——它能解决当下问题。**\n\n    利用数据改善业务，并非团队所有其他职责之上的额外任务，因而需要额外资源。相反，它能让解决即便是战术性的问题也变得更容易。\n\
  \n    你可能希望尽早专注于传达这一信息，因为高管们通常不会自然而然地明白这一点。\n\n    你或许记得那个著名的漫画：一个显然刚刚发明了（圆形）轮子的石器时代的人，试图将轮子提供给两个正拼命用方形轮子拉车的同事。这项活动耗费了他们巨大的体力，以至于他们无暇倾听第一个人的提议，而该提议本可立刻让他们的生活轻松许多。\n\
  \n    你还可以用许多其他类比来解释数据带来的机遇。不过，你可能也希望能分享一些来自现实世界的、易于理解的例子。\n\n### 你的战略构想可以明天再看\n\
  \n你是否曾在会计师忙于年终结算时，向他们约过会面？\n\n无论你的战略构想有多棒——在某些情况下，人们总有更紧急的事情要做。\n\n问题在于，当这种情况成为一种常态时。而且，大多数人从\
  \ CEO 到行政文员，手头总有事情要做。\n\n当这被用作借口时，你可能希望利用你的数据治理来设定并沟通正确的优先级。但仅靠这点可能不够。人们不会立即放下手头的工作来与你的团队合作。\n\
  \n通常，允许人们争取一些时间是个好办法。毕竟，他们并非普遍反对你的想法——他们只是现在不想处理它。\n\n那么，为什么不做个交易呢？“你可以在这周末前完成这些工作，然后让你团队的两名成员与我的团队在\
  \ XYZ 项目上合作。”请记录这个约定，即使只是通过一封电子邮件。\n\n这样的协议能让你的对接方进行组织和准备。而且，承诺的影响离兑现越远，每个人都会感觉越自在。\n\
  \n为了防止这种方法拖延你的计划，一旦你意识到需要与另一个团队合作，就应尽早提出。\n\n### 这个工作一直是 IT 部门负责的\n\n在这里，我们可以区分三种不同的情况：\n\
  \n1.  **数据办公室之外的数据团队**\n\n    过去，某些特定的数据工作可能确实由 IT 部门负责。如果这些人或团队做得很好，也许他们应该继续作为数据办公室的一部分做同样的工作。这是一个敏感领域，你应该谨慎倾听和行动。\n\
  \n    在很多情况下，先前负责的团队会很乐意移交所有权——但他们几乎不会放弃自己的资源。正确的顺序仍然是先处理职责问题。一旦职责明确了，你再指出你需要人员来完成这项工作。\n\
  \n2.  **从事数据相关活动的技术团队**\n\n    每当你发现一个*技术型*的 IT 团队以前做过数据工作，你可以解释这种转变是合理的。此类对话中值得探讨的问题包括：\n\
  \    -   他们真的理解你的业务问题吗？\n    -   他们是在为你（或与你一起）解决问题，还是主要提供工具？\n\n    根据对方的回答，你或者会拥有职责转移的充分理由，或者会发现优秀的数据专家就身在一个技术团队中，并且他们可能愿意转到数据办公室。\n\
  \n3.  **尚未覆盖的活动**\n\n    IT 部门可能提供了有限的服务，这在缺乏整体数据战略的组织中很常见。\n\n    这种不完整的服务通常涵盖了所有技术方面，但缺少了数据全面管理中的关键活动，例如端到端视图或跨业务职能的需求对齐。\n\
  \n    这些情况为你解释业务驱动型数据管理的理念提供了绝佳机会。\n\n### 正确的数据处理会危及我的项目\n\n人们常常担心，如果遵循新的数据规则，他们的项目会变得过于复杂、延期完工，和/或超出预算。\n\
  \n在此值得深入探讨一下。\n\n项目经理或产品负责人通常并不反对“一次做对”。他们只是不想自己看起来表现不佳。\n\n给他们提供有力的论据。\n\n-   要么：如果我们多花一个月的时间来确保数据方面的可持续性，整个企业就能做得更好。\n\
  -   要么：如果我们现在不这样做，我们就无法从数据办公室获得上线许可。\n\n你可以通过建立数据相关的透明化体系来支持后一点：\n\n-   每个项目都需要进行数据审查，并且结果必须公开。\n\
  -   需要定义临时让步的标准。\n-   所有这些都必须得到你需设立的数据决策机构的认可。\n\n总而言之，你并非要让项目经理或产品负责人这样的人难做。相反，你为他们争取额外资源或预算提供了有力的理由。几乎没有任何负责人会拒绝获得足够资金和人员来创建可持续解决方案的机会。\n\
  \n\n\n### 如果失败了呢？\n\n人们不确定数据办公室是否会成功，也不知道它能否长久存在。\n\n尤其是在注重政治意识的人群中，只要专门的数据管理可能被证明是一场失败的实验，他们就不愿公开支持新任首席数据官。他们不想押错赌注。\n\
  \n说实话：除非你之前已经在组织中功勋卓著（或者你能定期与 CEO 共进晚餐），否则这些担忧都是合理的。\n\n在这种情况下，把目光投向组织外部会有所帮助。尽管专门的数据管理在你的组织内部可能还是未知领域，但在组织之外，这已经成为跨行业的成熟做法。\n\
  \n而且，首席数据官的数量不仅增长迅猛，而且这种增长趋势已持续了一段时间——长到足以说明这不是一种短暂的昙花一现。\n\n无论你多么确信自己*拥有*适合组织处理数据的正确方法，更明智的做法是强调数据管理并非你独创。\n\
  \n除了那些以数据为主要业务的组织之外，其他许多组织也有大量具体案例可循。你的信息，在大型咨询公司声明的支持下，可以是这样的：\n\n*我们并非第一个设立数据办公室的组织。其他组织之前已经成功实践过。如果我们不这样做，我们就会失败，或者被竞争对手超越。我们根本承受不起回到原点的代价。*\n\
  \n与此同时，你可以通过承诺——作为首席数据官，你将承担风险——并在万一失败时承担责任——来鼓励个人与你合作。\n\n### 没有数据办公室也运行得很好\n\n\
  我仍然听到那位公司元老说：“没有首席数据官，我们几十年来不也一直很成功吗！”\n\n我不得不承认他说得对。而且他的组织内部也从未发生过任何需要变革的事情。\n\n\
  嗯，不是*在*组织内部……\n\n请人们向外看。首先，事物总是在发展。技术在发展，行为在变化，期望在演变。其次，发展的速度在加快。虽然上世纪某种运作模式可以持续数十年，但如今颠覆已成为常态。\n\
  \n那么，哪个领域受到的影响最大？不，不是技术。尽管该领域取得了巨大进步，许多基础商业模式依然未变。汽车、火车和飞机仍然将人类从 A 点运送到 B 点，电脑仍然有屏幕和键盘，电影仍然以矩形格式播放。\n\
  \n我们应预期在未来的几十年里，所有这些领域都会发生根本性的变化。然而，就目前而言，组织需要应对那些已经开始显现的变化。\n\n是的，我指的是数据的世界。当然，未来我们会在数据领域看到许多变化。但与许多其他领域不同，这些变化已经如火如荼。对数据的开发利用多年前就已经走出了实验室。\n\
  \n数据的未来已经开始。\n\n### 我不想改变……\n\n为什么“变革管理”作为一门学科在过去几年里获得了如此多的关注？当我们周围的世界以日益加快的速度变化时，人类适应变化的能力却并没有太大改变。变革更多地被视为一种风险而非机遇。人们倾向于高估负面后果的影响，而低估潜在收益的价值，往往并未意识到这种偏见。\n\
  \n开始主动管理数据意味着一种改变。这就是为什么数据管理就是变革管理。\n\n对未知的恐惧不会以单一的、你可以用准备好的答案来应对的陈述形式出现，就像其他更基于事实的担忧那样。相反，你需要系统地处理这种恐惧。以下是一些思考：\n\
  \n1.  **成为闪亮的榜样。**\n\n    不要要求他人拥抱变化，而是告诉他们*你*是如何做到这一点的。其他人会观察你。他们应该看到你欢迎改变，即使这会危及你自身的安全地位。当然，不要只是装装样子。你需要真正对变革持开放态度，包括未来可能对你当前数据管理方式提出的挑战。\n\
  \n2.  **营造积极的氛围。**\n\n    数据可以是一件令人兴奋的事情。你可以展示各种机遇。目标可以是激发人们的好奇心。给予表达担忧的空间。让人们分享他们的问题和想法，并透明地处理所有这些问题。你可以像推销医疗顾问一样推销数据办公室——帮助你解决当前问题，*并*教你如何从此以后自己照顾好自己。\n\
  \n3.  **化解对未知的恐惧。**\n\n    许多同事可能害怕无法适应新的工作方式。毕竟，人工智能和机器学习对许多人来说是“魔法”的同义词。你的信息可以是这样：“你不需要详细了解这一切。只需要少数人是真正的专家。数据的存在是为了让组织中其他人的工作生活更轻松。”\n\
  \n### 算法会取代我吗\n\n人们会担心数十年的经验和专长变得无用。而且，我们必须诚实地说，一定数量的特定资质在这种情况下会失去相关性。\n\n那些技能将完全不再被需要的人可能会感到恐惧，这也是合理的。但维持现状并不能解决问题：其他组织将获得成本优势，这会使你自身的更多岗位面临风险。\n\
  \n我认为此时有两个信息至关重要：\n\n1.  **技能提升是可能的。**\n\n    几乎没有人会变得无法挽回地多余。变得多余的是经过训练的特定技能，而不是天赋或才智。培训可以利用后者来培养面向未来的技能。\n\
  \n2.  **人工智能与人类相辅相成。**\n\n    人工智能和人类扮演着互补的角色——各自可能达到 90%的水平，而两者的结合可能能达到 97%。此外，人工智能仍专注于重复性、不太复杂的任务。这可以使人类能够专注于更具挑战性的任务——而这些通常也是人们更喜欢的任务！\n\
  \n    以一个可能存在的网球混合体为例：\n    *   **人类**凭借其创造力，仍需要根据即时情况、对手状态的印象以及惊喜因素，来决定击球风格和击球位置。\n\
  \    *   **机器**凭借其精确性，可以确保球准确地落在人类选手想要它落地的位置。\n\n    另一个有利于人类的方面是质量保证的需求：就目前而言，你不会希望用\
  \ AI 来验证 AI 产品。这里你仍然需要人的因素。\n\n    考虑即将出现的用于通过皮肤图像发现癌症的 AI 解决方案。这些解决方案是如何推销给全世界的医生的？他们听到的不是“AI\
  \ 将取代医务人员”，而是这样的信息：“这是一个让你变得更强大的工具。”\n\n    你可能希望为你的员工准备类似的信息。不是为了安抚人心——而是因为事实本就如此。\n\
  \n脚注 1\n\n"
- "# 15. 治理心理学\n\n![../images/499948_1_En_15_Chapter/499948_1_En_15_Fig1_HTML.jpg](img/499948_1_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1\n\n数据或许站在你这边——但这可能还不够！\n\n\n\n## 别在老地方圈地\n\n适当的数据治理是不可或缺的。但这必须是“首席数据官发明的治理”吗？\n\
  \n人们会难以接受一项取代了先前看似运行良好的政策的新政策。\n\n那么，你为何想要改变这样的政策呢？\n\n如果你将现有政策纳入你的整体数据治理框架中，你就能赢得原制定者以及那些乐于遵守原有规则的人成为盟友。\n\
  \n另一个考虑将现有政策或标准视为“少一个燃眉之急”的理由是，这能让你专注于剩下的、真正的差距。\n\n你可以宣称对这些数据治理元素的所有权，而无需改变它们。而在需要调整的地方，例如，为了考虑新的决策主体，你可以强调核心规则保持不变。\n\
  \n有时，你甚至可以将最初为单一业务领域制定的规则或标准进行泛化推广。你通常可以预期，那些工作成果被应用到自身职责范围之外的人会非常忠诚。\n\n这与其说是要不惜一切代价找到最佳方案，不如说是通过同理心赢得人心。如果现有政策或规则有任何改进空间，你仍然可以随着时间的推移进一步优化它——最好是与原制定者一起。\n\
  \n## 设计可接受的初始架构\n\n塑造一个被普遍接受的框架是明智的，数据管理在其中拥有明确定义的角色。\n\n-   一种模式可以是：所有基础性工作要么由\
  \ IT 部门（数据库、基础设施、许可证等）负责，要么由数据管理部门（数据规则、治理、业务对齐、术语表等）负责。\n-   你或许可以（暂时）接受其他团队负责那些你实际上认为是数据管理办公室职责范围的领域。事实上，这可能会帮助你获得支持，并减轻不可避免的权力竞争感。\n\
  -   如果你能出色地解决痛点，组织（通常是董事会）可能会考虑让你也负责其他领域。但不要自己主动去推动，除非你有充分的理由这样做。\n\n## 将你的权威建立在公认的权威之上\n\
  \n来自董事会的总体授权是必需的，但它在日常工作中可能帮不上忙，你也不想整天像出示警徽一样把它亮出来。\n\n因此，审视一下还有什么能增强你的权威会很有帮助——即使它可能不是正式意义上的。\n\
  \n如果你将已知的组织战略转化为数据战略，你应该会很有把握：“为了实现（组织战略 X），我们需要专注于（数据战略 Y）。”\n\n除此之外，你可以尝试引用董事会成员和其他有影响力的高管的话。你可以作为旁白提及，始终避免显得傲慢。\n\
  \n那些积极支持你的人甚至可能会确认你可以引用他们的话（“我们的 CFO 让我也考虑一下……”）。\n\n但你也可以引用那些在言论或书面中支持你观点的人。如果你积极倾听，你会听到许多可能对你有用的说法。例如，他们可能表示认为数据有价值，或者在做出决定之前强调需要更加关注数据。\n\
  \n每当你做会议记录时（这是框定协议的有力工具！），你都要记录下任何此类言论，甚至可以通过提出恰当的问题，把需要说的话“放进”相关高管的嘴里。\n\n最终，人们应该会形成这样一种印象：绝大多数决策者都支持首席数据官和数据办公室的方向。\n\
  \n## 平衡两个极端\n\n如果解决结构性问题的方法是选择正确的极端，那么成功的领导者会多得多：在没有任何专业知识的情况下，你选对的几率也只有 50%。\n\n\
  相反，成功的管理意味着在两个极端之间找到恰当的平衡。这种方法首先包含一个与态度密切相关的初始思考过程，然后是基于密切观察和积极倾听的持续调整过程。\n\n需要平衡的领域有很多。让我以其中四个为例进行说明。\n\
  \n### 在绝对主义与民主之间\n\n绝对主义意味着“我知道答案。我来制定规则。你们必须遵守。”许多部门都倾向于遵循这种方法：我们是专家，而其他人不是。为什么要让他们参与规则的制定呢？\n\
  \n民主则意味着“除非得到多数支持，否则不要制定规则。”采用这种方法，可能会出两个问题。\n\n首先，你可能会面临所有部门都必须为了更大的利益（即股东视角）而让步的情况，而民主会导致多数投票反对股东的利益。其结果是要么形成各自为政的心态（因为各方都同意“各干各的”），要么做出一个让多数利益相关者受益但整体组织却受损的财务上不健康的决定。\n\
  \n其次，重要但令人痛苦的决定（例如财务纪律或法律合规）可能会因为大多数部门不喜欢而被阻挠。\n\n但在两个极端之间，从整体政策角度和具体案例处理角度，都存在一个折中位置：\n\
  \n1.  **治理**\n\n   如果决策的范围受到限制，以避免做出对组织有负面影响的决策，那么民主是可以奏效的——就像宪法在民主制度中防止多数派压制少数派一样。\n\
  \n   首先，一套指导方针框架会有所帮助。它需要足够通用，以便在董事会层面进行处理（例如，“安全至上”或“合规至上”）。\n\n   此外，一份获得认可的数据战略以及一份数据原则清单，将允许利益相关者在不危及数据目标的情况下运用他们的管理自由度。\n\
  \n2.  **个案处理**\n\n   以权威做出决定并不意味着忽视其他意见。\n\n   因此，一个实用的方法是首先让所有利益相关者参与进来，听取所有论点，然后设计一个解决方案。\n\
  \n   让所有利益相关者对该解决方案进行最终评审，作为一项卫生检查是有意义的。它只允许在附带充分理由的情况下提出异议。\n\n   如果你最终做出决定（或者将你的解决方案提交数据委员会审批），那么没有人会感到惊讶，而且每个人都有机会提供有分量的反馈。\n\
  \n### 在集中式与本地化解决方案之间\n\n严格的集中式方法无法考虑本地特性。\n\n然而，本地化方法倾向于产生本地优化的解决方案。稍微不同的本地解决方案可能已经导致不同的“最佳方案”，从而产生大量并存的解决方案。\n\
  \n同样，通过平衡的方法，你会找到最佳方案。\n\n你可以努力寻求一个集中式的解决方案，但同时让所有本地利益相关者以及你的虚拟功能专家网络参与进来。\n\n他们的意见需要有实质内容，并且需要从整体业务案例的角度来看待，而不仅仅是本地案例。\n\
  \n在这种背景下，至关重要的是要有整体业务案例来考虑“复杂性成本”，即必须维护多种不同（通常是本地化）解决方案或解决方案方面所带来的影响。\n\n这种影响呈指数级增长，特别是当你考虑到错误风险以及未来对整个生态系统进行根本性变革所需的上线时间时。\n\
  \n\n\n### 在标准化与个性化之间\n\n每一位首席数据官都迟早会面临这样的两难境地：数据架构师关心数据结构，而分析人员则关心他们的自由度。\n\n同样，你会遇到想要固定模式的数据库设计者，而业务人员则希望拥有自由，让应用程序和数据库能够快速反映业务逻辑的任何变化。\n\
  \n谢天谢地，你不需要在这两个极端之间做出抉择。在“标准化”与“个性化”之间，有一个绝佳的方法，那就是“**可配置化**”。\n\n这种方法对你的企业数据模型会产生影响：如果可能，有效场景不应存在于数据模型之外，甚至不能作为“已批准的例外”。相反，要努力将所有有效的变体都视为数据模型的一部分。\n\
  \n其优点在于，你迫使业务人员思考他们的业务目标和偏好，与此同时，以一种软件架构师能够无歧义地实现数据结构的方式，记录了整个业务模型。\n\n当然，这付出的代价是数据模型变得更加复杂。但这个代价不应太高。当架构师和软件开发人员将业务逻辑落实到应用程序和数据库结构中时，任何额外的细节层级都有助于避免误解。如果有人认为由此产生的数据模型过于复杂，那就提醒他们：这个数据模型反映了组织的业务模型——因此，业务模型本身可能也很复杂。\n\
  \n### 在粗略与完美之间\n\n让我们将理想解决方案的工作量定义为 100%。仅覆盖正常流程、没有任何异常或偏差，需要花费多少工作量呢？\n\n最多只占全部工作量的\
  \ 5%。\n\n人们在压力之下往往倾向于追求这一点：忽略适当的异常处理，从而降低成本和缩短时间。\n\n基于数据的解决方案的一个主要目的，就是处理与正常流程的偏差。原因是这些偏差构成了业务成本的主要部分。\n\
  \n这就是为什么任何人都不应该止步于 5%！\n\n但是，你是否有必要追求 100%的覆盖率？可能不需要。著名的 80/20 法则通常也适用于数据。\n\n用\
  \ 20%的工作量覆盖完美解决方案的 80%，远比仅用 5%的工作量覆盖一个正常的流程要好得多。\n\n并且，请记住，你不需要永久放弃那剩余的 20%。将所有缺口登记为数据让步（Data\
  \ Concessions），随着时间的推移，这些问题可能会被逐步解决。\n\n## 塑造你的数据品牌\n\n对许多员工来说，“数据办公室”可能听起来非常技术化。你应该把它变成一个人们能够产生共鸣的品牌。\n\
  \n如果你的组织政策允许，可以考虑设计一个标志——简单、色彩丰富且积极向上。每当你提供服务或发布消息时，就使用这个标志。\n\n简化数据办公室的职责也是个好主意，这样人们就能更容易地理解它，如图\
  \ 15-2 所示。\n\n![../images/499948_1_En_15_Chapter/499948_1_En_15_Fig2_HTML.png](img/499948_1_En_15_Fig2_HTML.png)\n\
  \n图 15-2\n\n数据办公室简介\n\n## 电梯演讲\n\n每个人都知道电梯演讲的重要性。你的电梯演讲还是最新的吗？\n\n当然，数据管理没有一个通用的电梯演讲。故事在很大程度上取决于组织的情况，也取决于你自己的想法。但有一些模式值得遵循。\n\
  \n试着想出一个通用陈述（你的核心信息，与目标受众无关），然后紧跟一个针对特定目标的特定信息。请记住：每个人看到的问题不同，评判机会的方式也不同，这通常基于他们各自的角色。\n\
  \n1.  **通用信息**\n\n    想出一个能深深印在人们脑海里的、一句话就能讲清楚的故事梗概。例如：“我认为我们需要一个专门的数据权威机构来稳定运营，并支持基于事实的决策。”\n\
  \n    在“数据”方面，我们面临一个特定的挑战：很多人，包括大多数高管，不知道数据是什么，或者他们认为你在谈论 IT。\n\n    这种情况可能需要一个开场白——但同样也不应超过一句话。有时高管不需要理解整个概念——他们只需要相信你。引用外部公认的权威可能会有帮助。\n\
  \n    你的目标应该是让你的对话者想要了解更多信息。你可以做一个大胆的声明，或者简单地激发高管的好奇心。\n\n    想一想，在谈话结束后，董事会成员至少应该记住的一两个关键词。尽管你需要谨慎利用有限的时间，但你应该在时间允许的范围内，尽可能多地使用这一两个关键词。\n\
  \n2.  **针对特定目标的信息**\n\n    为了准备一个好（且简短！）的故事，你需要列出对高管来说所有有意义的事情，这些事情在有数据管理的情况下会比没有数据管理时做得更好。\n\
  \n    一个好的清单可以涵盖以下三个部分：\n    *   我们今天在哪些方面没有达到目标（但数据管理可以帮助解决）？\n    *   我们今天在哪些方面甚至可能超越目标（通过数据管理）？\n\
  \    *   数据管理为更美好的未来提供了哪些机遇？\n\n    现在你可以从这三个主题中各选取最重要的一个点。这样就有了三个强有力的论点，涵盖了广泛的业务领域。\n\
  \n    假设数据根本就不是决策的焦点，那么一个典型的为筹备数据管理办公室而准备的电梯演讲可以是：\n\n    *您认为我们今天在多大程度上基于数据做决策？您是否总是充满信心？*\n\
  \n    *您是否知道我们拥有（或可以获得）大量数据，可以帮助我们做出更好的决策？*\n\n    *我们的组织在您的领域之外拥有大量对您有价值的数据。*\n\
  \n    或者，如果组织的主要问题是每个职能部门都各自为政：\n\n    *我们可以从数据中获得比今天多得多的洞察。所有职能部门都在自行其是。这导致了大量的重复和歧义。并且没有一个职能部门掌握全局。*\n\
  \n    当高管们想要花哨的东西，却没有看到全面的数据图景时：\n\n    *说实话，仅仅建立一个分析团队是不够的。需要做大量的基础工作，将所有业务职能部门整合在一起。数据可能是错误的或不完整的。这就是为什么无论数据在何处被触及，都需要进行管理——而这基本上无处不在。*\n\
  \n    试着把脚伸进门里——获得一个口头的承诺，这样你在后续跟进时就可以引用它：\n\n    *当我向董事会提交我的方案时，您会支持我吗？您愿意抽出 30\
  \ 分钟时间让我事先向您介绍这个方案吗？*\n\n3.  **如果董事会成员问起你的提案**\n\n    *我正在考虑设立一个专门的、有授权的数据办公室。数据不应该是某个现有部门（即使是\
  \ IT 部门）的副业。为了成功运作，我在考虑两个步骤：*\n\n    *步骤一：我希望获得高管的授权，因为我的成功不应该完全取决于自愿接受。*\n\n  \
  \  *步骤二：然后将由我来说服所有职能部门参与进来。毕竟，我是想支持他们，而不是从他们那里夺走任何东西。*\n\n    与大多数说明一样，少即是多。如果有什么不清楚的地方，董事会成员会提问的。\n\
  \n"
- '# 第三部分 数据管理的实践方面


  '
- "# 16. 数据业务案例\n\n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig1_HTML.jpg](img/499948_1_En_16_Fig1_HTML.jpg)\n\
  \n图 16-1\n\nROI 困境\n\n\n\n## 数据的商业案例——为何需要？\n\n不妨想象一下 Gartner 这类机构常用的典型“炒作周期”曲线。\n\
  \n我们正经历一个时期，尤其是围绕**人工智能（AI）**和**机器人流程自动化（RPA）**的最现代数据学科曾被认为即将取代人类智能。\n\n每个组织都在设立\
  \ AI、机器学习或数据科学部门，以免错失良机。这就是 Gartner 所称的“期望膨胀期”。\n\n与此同时，我们已经过了“我们必须无条件去做”的阶段。这并不意味着\
  \ AI 和 RPA 等主题失败了。它们没有，而且每个人都知道有些组织通过部署这些数据学科获得了成功。\n\n然而，我们已经达到了一个阶段：领导者期望数据能够提升自家组织的盈利能力。这就是为什么我们在申请数据项目资金时，会更频繁地听到“让我看到回报”这句话。\n\
  \n这完全合情合理！那些对组织目标没有直接或间接贡献的数据学科，还是让它们留在大学里成熟吧（说得有点夸张）。\n\n我们已经到达 Gartner 的“泡沫破裂谷底期”了吗？还没有，但我们需要努力使其保持浅显，并进入“稳步爬升恢复期”。\n\
  \n一个关键推动因素：商业案例。你应该遵循“没有案例就没有项目”的原则！\n\n请记住，这并非关于探索数据背后的技术。而是关于投资者和预算持有者对数据投资回报率的信心。\n\
  \n为此，商业案例是正确选择。每当需要为一项活动做决策时，商业案例应该有助于将决策建立在事实基础上。\n\n*用事实来论证数据项目是一种极好的方式*——你可以用数据来支撑人们凭直觉无法理解的东西。\n\
  \n另一方面，商业案例需要数字——不仅关于成本，也关于预期收益。\n\n这对数据项目来说尤其是一个挑战。许多数据项目并不直接提供价值，而是使其他活动能够提供这种价值。\n\
  \n这种矛盾的情况值得本书用专门的一章来讨论。让我们从 CDO 的视角来仔细审视商业案例。\n\n## 完美世界中的商业案例\n\n在深入探讨解决方案之前，我们首先应该定义什么是商业案例，然后理解随之而来的挑战和机遇。\n\
  \n### 商业案例的基本理念\n\n**第一步**：比较项目的投资\n\n* 与**最佳替代投资**（如果资金可用）进行比较，和/或\n* 与组织的**资本成本**（如果需要借款）进行比较^(³⁶)\n\
  \n**第二步**：如果项目带来更高回报，就执行它！\n\n诚然，这是一个非常简化的描述——但许多组织中处理商业案例的现实甚至更加简单。\n\n### 随时间变化的资本成本\n\
  \n典型的计算会考虑随时间变化的资本成本。\n\n* 你想知道项目的回报是否高于（假设的）最佳替代投资的利率，即**内部收益率（IRR）**。\n* 首先，你确定通过拟议项目支出或赚取的所有资金，以及“生效日期”（即资金流入或流出的日期）。\n\
  * 第二步，你通过向前或向后应用利率，将所有项目计算到同一个参考日期（通常是“今天”）。如果你从未来向后计算到今天，这被称为“折现”（见图 16-2）。\n\n\
  \  ![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig2_HTML.png](img/499948_1_En_16_Fig2_HTML.png)\n\
  \n  图 16-2 对未来价值进行折现\n\n* 如果参考日期是“今天”，结果被称为**净现值（NPV）**。\n\n诚然，这包含了很多未知因素——但这总比仅凭直觉要好。注意：这同样适用于一般的数据管理。\n\
  \n### 示例 1\n\n假设今天要支付 **$95**，一年后你将收到 **$100**。\n\n假设内部收益率（IRR）为 **5%**。\n\n商业案例将考察这两笔金额今天的价值：\n\
  \n1.  今天到期的 $95。\n2.  一年后会变成 $100 的金额，按 5% 的 IRR 计算：**$100 / 1.05 = $95.24**（公式：`未来金额\
  \ / (1 + IRR)^年数`）\n\n总 NPV 为 `$95 – $95.24 = –$0.24`（负值！）\n\n这个组织会赚钱——但与预定义的替代投资相比，是亏钱的！\n\
  \n在这种情况下，对于组织来说，不执行该项目是更好的选择，因为它们如果把钱投资到别处（或者不用贷款），会赚得更多——前提是它们的 IRR 数字是准确的。\n\n\
  ### 对“风险”的考量\n\n预期在未来赚到的钱必须被视为“有风险”。\n\n* 与此同时，替代方案可能进入市场。\n* 或者目标解决方案，例如一个产品或一个软件，其计划生命周期有限，从而导致收益递减。\n\
  \n当然，你可以设计复杂的公式来确定一个随时间变化的“风险因子”。然而，正如你所知，未来伴随着不确定性。\n\n图 16-3 说明不确定性常常使得计算盈亏平衡点都成为不可能。\n\
  \n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig3_HTML.jpg](img/499948_1_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3 不确定性与时间\n\n这就是为什么大多数组织简单地限制回报计算，例如，三年以后。商业案例会忽略任何在此之后产生的收益。\n\n注意：精确计算是一回事——所有参数是否保持不变则是另一回事。\n\
  \n### 项目选择\n\n如果许多项目都有足够高的 IRR，一个组织可能会限制项目数量，以保持在预定的项目预算之内。结果，即使某些项目被计算为“值得运行”，它们也可能无法越过“水位线”。它们将不会启动。\n\
  \n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig4_HTML.jpg](img/499948_1_En_16_Fig4_HTML.jpg)\n\
  \n图 16-4 项目水位线\n\n或者，一个组织可以获得额外资金，例如来自银行或资本市场。只要适用利率低于项目的 IRR，这样做就是有意义的。\n\n在所有情况下，资源的可用性也必须考虑在内。专业知识可能是一种稀缺资源，无法按需简单获取。这是限制项目数量的另一个上限。\n\
  \n### 一切顺利？\n\n这听起来像是一种科学、不可动摇的方法。从股东的角度来看，只要数据相关项目值得运行，它将有助于它们获得资助和批准。\n\n真的如此吗？\n\
  \n在探讨如何让商业案例为你所用的策略之前，让我们先看看商业案例带来的一些陷阱。\n\n可悲的事实是：\n\n* 商业案例伴随着若干挑战。\n* **数据**商业案例还会附带一些*额外的*挑战。\n\
  \n让我们逐一审视其中的**九**个挑战：**五个**通用挑战，以及**四个**数据项目特有的挑战。\n\n## 通用挑战\n\n\n\n### 商业案例文化\n\
  \n让我们快速做个小测试：大多数人*真正*编写商业案例的目的是什么？\n\n-   判断项目是否应获批\n-   作为一种手段，不惜一切代价推动项目获批\n\n\
  你猜对了：遗憾的是，答案并非第一个选项……\n\n项目经理的典型态度（通常受到不成熟组织文化的鼓励）是这样的：“我得‘调整’它，直到它足够‘好’。如果它不够好，项目无法获批，他们就会认为我是个失败者。而我需要让一些项目获批，才能展示我的价值。”\
  \ 听起来很熟悉吧？\n\n这种行为模式在许多大型跨国公司中都能观察到，即便不是大多数。它导致了次优的资金分配，大量的精力都浪费在“美化案例”上。\n\n对于建立一种有效的商业案例文化，这里有一条经验法则：\n\
  \n不要奖励“漂亮的”商业案例。奖励“诚实的”商业案例。\n\n### 效益的量化\n\n项目所有驱动因素都能被量化吗？比如以下这三个方面？\n\n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig5_HTML.jpg](img/499948_1_En_16_Fig5_HTML.jpg)\n\
  \n**图 16-5** – 难以量化的价值\n\n尝试量化声誉不佳对客户忠诚度的影响。这在论证合规工作的合理性时至关重要。\n\n### 组织内部相互冲突的目标\n\
  \n即使每个单独的目标都是合理的，目标之间也可能相互冲突。一组典型的矛盾目标是可持续性、敏捷性和效率——每一项本身都确实可取——见图 16-6。\n\n在运筹学中，这种情况通常通过一个目标函数来处理，其中不同目标的最优权重是优化任务的主题。\n\
  \n然而，在现实生活中，目标函数\n\n```\na * 可持续性 + b * 敏捷性 + c * 效率 ➔ 最大\n```\n\n的参数 `a`、`b` 和\
  \ `c` 无法客观确定，并且每个业务职能部门都有不同的视角。虽然管理者的奖励方案应旨在使其个人目标与整体组织目标保持一致，但总存在差距。\n\n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig6_HTML.jpg](img/499948_1_En_16_Fig6_HTML.jpg)\n\
  \n**图 16-6** – 平衡可持续性、敏捷性和效率\n\n这三个目标中的每一个都具有需要纳入商业案例的价值。风险管理甚至会添加上事件的*概率*——这是你无法明确确定的另一个方面。\n\
  \n对于数据项目而言，处理所有这些方面是数据办公室（Data Office）的任务。一个拥有足够授权的 `CDO`（首席数据官）应能够基于其跨职能、长期的视角（这是\
  \ `CDO` 角色的重要组成部分）比其他高管更好地代表股东观点。\n\n`CDO` 面临的最大挑战是如何充分支持可持续性目标——经验表明，组织管理层中积极支持该目标的利益相关者很少。有时，只有\
  \ `CDO` 和 `CEO`（首席执行官）支持。如果 `CEO` 即将退休或离职，可能就只剩下 `CDO` 了。\n\n让我们看看组织中其他典型的参与者：\n\
  \n-   典型的**项目经理**旨在最大化敏捷性，以便项目能够快速完成，没有太多“官僚主义负担”。通常情况下，项目经理并不会因可持续性而获得奖励。\n-  \
  \ **首席财务官（CFO）** 关注效率，即追求资金价值最大化，最好能在财年内实现。这包括关注边际成本（`MC`）：一旦额外投入的回报低于某个阈值，`CFO`\
  \ 提供资金的意愿就会急剧下降。\n-   **长期投资者**和所有者通常会将可持续性置于列表前列。对他们来说，只要不产生未来成本，项目花费稍长一点时间也可以接受。\n\
  -   **法务部门**会坚持合规性——这是可持续性目标的一部分。对这个部门而言，其他两个目标可能退居其次。\n\n所有这些参与者都需要参与进来，但你需要强制他们量化自己的偏好——这将允许从组织的角度进行全面的成本/效益比较。\n\
  \n### 事后验证困难\n\n想象一下编写商业案例的典型过程：\n\n-   你为商业案例勤勉地计算了成本和效益。\n-   然后你运行项目，并成功完成了项目！\n\
  -   你确切知道花了多少钱。\n-   但是……*你能证明那些效益吗？？？*\n\n问题：\n\n-   声称的效益不易验证。\n-   确定的效益无法明确地归属于单个项目。\n\
  \n你应该预见商业案例的验证问题，以便更好地准备下一个商业案例。如果你自己都不相信自己编写的商业案例，那么无论如何你都不应该推动这个项目。\n\n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig7_HTML.jpg](img/499948_1_En_16_Fig7_HTML.jpg)\n\
  \n**图 16-7** – 难以量化的效益\n\n### 商业案例快速过时\n\n想象一下，你计算了项目将产生的价值。而且计算得准确又精确。\n\n但时代在变……\n\
  \n事实上，预期的回报距离现在越远，不确定性就越大。\n\n例如，新的技术发展可能会使某个解决方案变得毫无用处。\n\n## 数据相关挑战\n\n数据项目的商业案例有时不免带有讽刺意味：你需要为你的数据编写商业案例，同时你还需要数据来编写商业案例。\n\
  \n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig8_HTML.jpg](img/499948_1_En_16_Fig8_HTML.jpg)\n\
  \n**图 16-8** – 商业案例的“第二十二条军规”\n\n这幅漫画提醒我们一个事实：与数据相关的商业案例相比普通商业案例，某些挑战出现的频率更高。\n\n\
  但我们所说的“与数据相关的商业案例”指的是什么？它是针对旨在利用数据或数据处理的项目所编写的商业案例的简称。这些项目可以多种多样，例如：\n\n-   引入跨职能的主数据管理\n\
  -   订阅外部数据源\n-   组织范围的黑客马拉松\n-   增设数据科学职位\n-   基于网站访客行为的规范分析\n-   从 Hadoop 迁移到 Spark（或任何其他关于技术数据处理的\
  \ IT 项目）\n\n以下是数据项目商业案例中最常见的一些挑战。\n\n\n\n### 数据并不性感\n\n再来个小测验。下面这个故事哪里有问题？\n\n**示例\
  \ 2**\n\n在年度高管会议结束后的晚间聚会上，机器学习负责人正与一位三十多岁的首席商务官女士交谈。当我们走近时，听到他对她说：\n\n“……然后我们改进了`神经网络`，放弃了使用简单的`Hard\
  \ Sigmoid`函数作为激活函数，转而采用`古德曼函数` ![$$ f(x)= gd(x)={\\int}_0^x\\frac{1}{\\cosh t} dt=2\\\
  arctan \\left(\\tanh \\left(\\frac{x}{2}\\right)\\right) $$](img/499948_1_En_16_Chapter_TeX_IEq1.png)*。*\n\
  \n这需要更强的计算能力，但我们观察到了远胜之前的结果！”\n\n首席商务官回答：“酷！我迫不及待想让你向管理董事会展示这些技术细节了！\n\n一旦他们弄懂其工作原理，就会立刻为额外的硬件提供预算！”\n\
  \n与此同时，她看着这位英俊的机器学习专家，心想：“他真可爱！”\n\n你找出所有错误了吗？\n\n答案如下：\n\n1.  你不会看到机器学习人员受邀参加高管会议。\n\
  2.  没有哪位高管会听一个技术呆子讲话。\n3.  董事会成员想知道它**是否**有效，而非**如何**有效。\n4.  别指望任何预算，因为董事会成员自以为懂“数据”，其实根本不懂。\n\
  5.  懂数据并不会让你变得性感！（抱歉实话实说。）\n\n### 确定使能型项目的收益\n\n数据项目通常是“使能型项目”：其价值增值需要通过后续活动实现。例如：\n\
  \n*   `MDM`（主数据管理）提升运营稳定性。\n*   分析为营销部门提供所需的市场洞察，避免将资金浪费在无效的营销活动上。\n*   `SOA`^(³⁷)（面向服务架构）避免数据不一致，从而减少财务部门的人工修正工作量。\n\
  *   数据科学发现此前未知的关联性，从而实现针对特定地域的服务配置。\n\n为什么即便不存在政治或文化问题，使能型项目也常常缺乏资金支持？\n\n你经常面临以下两个问题：\n\
  \n*   几乎没有（或完全没有）*直接的*财务收益。\n*   未来的项目会声称享有这些收益。\n\n打个比方，让我们看看数据领域之外的一个使能型项目。\n\n\
  **示例 3**\n\n哈利法塔的“使能者”：它的地基！\n\n超过 45,000 立方米的混凝土（重逾 110,000 吨）被用于建造这座塔的混凝土和钢结构地基，其中包含\
  \ 192 根深入地下超过 50 米的桩基：该塔 20%的混凝土都隐藏在地面以下！\n\n如果单独为这座塔的地基做商业论证，会是什么样呢？\n\n*成本巨大，没有一间房间，只有一个平台……*\n\
  \n这个案例已经暗示了第一个可能的方法：地基并非单独获批和获得资金——而是与地面上的塔楼作为一个整体项目一同获批。\n\n### 漫长的盈亏平衡点\n\n一项投资需要多快实现盈亏平衡？\n\
  \n一个项目如果长远来看能够“赚钱”，就应该被推进。\n\n现实中，一个组织获批的项目数量取决于其预算。所有其他项目都不会开展，即使它们承诺能为股东带来净收益。\n\
  \n哪些项目会首当其冲成为牺牲品？通常并非那些`ROI`（投资回报率）最差的项目，而是**那些 ROI 在遥远未来的项目**！\n\n图 16-9 展示了一种情况：盈亏平衡点仅在超出组织设定的参考期**之后**才能达到。这样的组织会为此类项目计算出负的`ROI`。\n\
  \n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig9_HTML.png](img/499948_1_En_16_Fig9_HTML.png)\n\
  \n**图 16-9** 参考期后的盈亏平衡点\n\n毫不意外，许多基础性的数据工作都属于此类。\n\n以下是一些有用的类比，用以向高管解释数据项目的情况：\n\
  \n1.  如果没有长远眼光，航空公司就不会购买新飞机。\n2.  在林业领域，采伐成材树木时不栽种新树可以节省成本。然而，这种方法长期来看会毁掉这个组织。\n\
  \n**注：** 一旦你将数据视为一项资产，长远关注甚至能提升组织当前的估值！（请参见本章前文“折现”部分，章节标题为“资本成本随时间变化”）\n\n### 商业领袖的动机\n\
  \n你可能已经注意到，许多项目因非事实原因而被否决。\n\n那么，为什么领导者不支持所有正向的商业论证呢？\n\n是的，有时他们确实**真的**不理解。\n\n\
  但在许多情况下，他们理解，但：\n\n*   看不到对自己有利之处\n*   害怕变革\n*   更愿意遵循自己的议程\n\n数据商业论证面临的一个特殊挑战是，商业领袖更容易蒙混过关！其他高管对此知之甚少，而且几乎没有人会为自己存有疑虑的倡议的商业论证进行辩护或支持。\n\
  \n## 数据商业论证的八个秘诀\n\n与其抱怨我们无法改变的事情，不如思考如何应对当前局面。\n\n考虑到你的商业论证在获批过程中可能遇到的所有障碍，你需要一套灵活的策略！\n\
  \n虽然这套策略不同组织会有所不同，但我想分享关于数据商业论证的八个秘诀——它们可以构成你策略的一部分。\n\n### I. 主动进行利益相关方管理\n\n你还记得数据商业论证的最后一项挑战吗：对你认为显而易见必须做的事，缺乏高管的支持。\n\
  \n这就是为什么利益相关方管理是关键。了解他们，建立信任，塑造双赢局面，并准备好在一定程度内妥协。\n\n如何做到这一点？建立联系。进行单独会谈——正式会议或边喝咖啡边谈都行。\n\
  \n关键方面在于：\n\n1.  **提问并倾听！**  \n    这是我反复强调的一点。它同样适用于商业论证管理。你能借此了解决策者们最重大的痛点。并据此量身定制你的故事。\n\
  \n2.  **引起他们的好奇！让他们眼前一亮！**  \n    开发出对特定高管有意义的示例。示例越具体、越形象越好！  \n    利益相关方管理还涉及一项单调的工作：文档化。创建你的利益相关方地图。确定并记录决策者之间的关系。让决策者了解其朋友或盟友的（正面）观点。\
  \  \n    你还应对利益相关方进行分类。以下是一个可能的类别列表：\n    *   力不从心者：有兴趣但害怕\n    *   抱怨者：过去总是抱怨，现在却不贡献\n\
  \    *   好奇者：常常一无所知但愿意聆听\n    *   自给自足者：认为自己能独立完成一切\n    *   肤浅者：想要光鲜的东西却不愿付出艰苦努力\n\
  \    *   傲慢者：认为数据管理多此一举\n    *   投入者：你的完美合作伙伴\n\n你需要针对每种行为模式制定计划。你也可以规划如何将利益相关方从一种模式转变为另一种模式。\n\
  \n\n\n### II. 培养数据素养与透明度\n\n人们需要理解你在说什么。你需要管理好预期并进行解释，以建立对数据的信任。\n\n**你需要做什么？**\n\
  \n你需要对全体员工进行数据知识培训。\n\n**说起来容易做起来难？**\n\n没错！但你可以采取一些措施来改善现状。理解数据的人（或者至少了解数据能实现什么的人）会更支持你。\n\
  \n首先，要透明，并诚实地告知所有的优缺点。\n\n现在，为了让你业务案例看起来更好看，隐瞒风险可能颇具诱惑力。但不这样做有几个好处：\n\n1.  **有助于强化透明度。**\
  \  \n    一旦你的案例被证明是诚实的，你就有权为所有竞品的业务案例设定标准。\n\n2.  **可以提升你的声誉。**  \n    处理人们通常不理解的事务的管理者，依赖于建立诚实的声誉。毕竟，你不能指望太多人基于对你的计划进行科学评估后而赞同你。他们需要信任你。\n\
  \n3.  **为你留有余地。**  \n    将风险纳入考量可能会使一个项目不如具有相同投资回报率但风险较低的投资有吸引力。但在项目失败时，它可能会为你提供保护——你可以归因于这些风险。\n\
  \n这就是为什么任何风险都应被纳入业务案例中的原因。\n\n其次，不要指望人们会自愿“走进数据的世界”。你最好就在他们所在之处去引导他们。使用他们的语言。并思考那些对他们各自所处情境有意义的类比。\n\
  \n一个很好的例子是，如果你对数据进一步处理，数据的价值会提升。你可以将其与从铁矿石等原材料到飞机这样的最终产品的价值提升进行比较，如图 16-10 所示。\n\
  \n这个例子很容易被理解，并且可以让你将其与数据转化为信息和洞察时的价值提升进行比较（例如，通过构建数据、清洗数据、将合适的数据整合在一起等）。\n\n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig10_HTML.png](img/499948_1_En_16_Fig10_HTML.png)\n\
  \n*图 16-10 价值的演进*\n\n简而言之，你可以将常见的口号“数据 – 洞察 – 行动”与“钢铁 – 飞机 – 航空运输”进行比较。这种比较使得从数据到洞察的路径有多么复杂，相比于从洞察到行动的步骤，变得显而易见。\n\
  \n而且你不必止步于此。正如飞机只有将乘客或货物从 A 点运送到 B 点时才体现价值一样，数据产生的洞察也只有当组织利用它时才能增加价值，例如，通过做出更好的战略或运营决策。\n\
  \n---\n\n### III. 创建并维护数据路线图\n\n只要人们不需要投入资源、资金或遵守规定，他们通常愿意接受路线图上朗朗上口的术语。这就是为什么最好将这两个步骤分开。\n\
  \n作为第一步，你要在不要求具体资源或资金的情况下描述路线图。你通常会解释为什么采取一系列步骤是有意义的。然后你请求大家都对路线图做出承诺。如果人们找不到反对的理由，他们可能会同意。\n\
  \n之后，当你将计划细化为具体项目并需要资金和资源时，你可以引用这个早期的承诺。\n\n一个典型的引用方式可以是：“本项目是我们已批准的、旨在（年份）年底前实现\
  \ MDM 现代化的战略的一部分。”\n\n如果这个承诺来自最高层，这种方法显然更有力。人们在拒绝支持董事会的决定之前可能会三思而后行。\n\n这不仅仅是关于单纯的资金流程。也关乎让整个组织的管理者愿意为你的项目提供资源。\n\
  \n---\n\n### IV. 将数据视为资产\n\n数据不仅越来越频繁地被称为资产。它也与正式认可的资产有很多共同点：\n\n*   使用它能带来切实的商业利益，例如：\n\
  \    *   我们拥有这种资产比没有它时效率更高。\n    *   我们能赢得新客户并留住现有客户。\n*   我们可以将其转化为价值更高的事物。\n*\
  \   它会随时间贬值，需要维护。\n*   拥有它却不使用是一种浪费。\n\n此外，像数据这样的无形资产甚至比有形资产更有优势：\n\n*   它们不会因使用而变少。\n\
  *   它们可以在几秒钟内随处可用，并且每个人都可以同时使用。\n*   虽然“压榨资产”在使用有形资产时通常不可持续，但对于数据这样的无形资产来说，这却是实现其价值的绝佳方法。\n\
  \n尽管如此，许多组织并不将数据视为资产。根据 Gartner 前数据与分析副总裁分析师 Valerie A. Logan 的说法，仅有“8%的组织报告其关键信息资产如同资产负债表上的资产一样被衡量”（Logan,\
  \ 2019）。\n\n或者，正如 Daniel Swarovski Corporation 全球数据与分析主管 Thomas Bodé在 2020 年 2 月巴塞罗那的一次数据会议上所言：“数据是未被充分发掘的资产。”\n\
  \n这种情况应该会激励你，因为它意味着巨大的机遇。\n\n即使法规仍阻止数据被当作资产处理，你也应该探讨这个主题。以下活动可能对你有帮助：\n\n1.  **为数据贴上价格标签。**\
  \  \n    数据应根据其潜在增值获得一个价格标签。  \n    每当作为项目的一部分，数据的价值（通过“提炼”）增加时，你应将此增值计入项目收益——即使实际的增值发生在项目之外。（但要解释你是如何计算的！）\n\
  \n2.  **与用户紧密合作。**  \n    让业务团队参与进来！你们可以共同确定数据供应链中每个步骤的附加价值，例如获取、清洗、丰富、业务指标或报告。\
  \  \n    第二步，让他们对数据的附加价值做出承诺。  \n    来自受益者的价值标签，就是进入业务案例的门票！\n\n3.  **善用类比和示例。**\
  \  \n    有时一个大胆的陈述有助于说明这种等价关系，例如“维护不善的客户数据腐烂得和被遗忘的苹果一样快。”  \n    事实上，随着我们数字时代数据流量的增加，数据越来越可以被归类为快速消费品（FMCG）。即使你不在该行业，你也可以考虑使用这个类比。\n\
  \n4.  **提出正确的问题。**  \n    帮助他人。不要简单地问“这份报告的价值是什么？”  \n    相反，要问“如果没有它，会对你产生什么影响？”\n\
  \n5.  **与 CFO 沟通。**  \n    在大多数组织中，一个很有希望的接触点是首席财务官（CFO）。这个人不仅非常有影响力，而且应该比任何人都更了解资产的特性和关键性。\n\
  \n6.  **制定政策。**  \n    即使“数据作为资产”对资产负债表没有直接影响，例如，根据 IFRS（国际财务报告准则）作为“无形资产”，^( ³⁸\
  \ ) 你也可以努力在组织内部制定政策，允许数据像其他资产一样被对待。  \n    这将使你能够将适用于正式认可资产的原则应用到数据上。\n\n![../images/499948_1_En_16_Chapter/499948_1_En_16_Fig11_HTML.jpg](img/499948_1_En_16_Fig11_HTML.jpg)\n\
  \n*图 16-11 数据是一种资产*\n\n\n\n### V. 必要时以隐秘模式开展工作\n\n根据组织处理数据的成熟度水平，数据驱动型举措可能被迫以“隐秘模式”运行，直到能够展示出首批真实证据。\n\
  \n如果在不考虑未来复用的情况下，直接的业务案例无法展现出足够收益，并且也没有人对长期业务案例感兴趣，那么可能有机会将该想法“隐藏”在另一个已获批的项目之中。\n\
  \n这样一来，就可以先实现几个初步的示例。其价值通常会在下一个用例中变得显而易见。\n\n例如，无需再次实现任何与数据相关的逻辑——只需调用（为第一个用例构建的）Web\
  \ 服务即可。\n\n让第二个用例的项目经理去传播这个消息——人们就会开始相信这个理念。\n\n一旦那些仍想以不规范方式实施的人遭遇到来自他人的阻力，并最终决定遵循规则行事时，你就达成了目标。\n\
  \n### VI. 解释“不这样做”的成本\n\n如我们所知，一个坚实的数据基础往往起着赋能作用，而所有收益都归功于那些受益于这一基础的项目。\n\n与其将部分收益也归因于你的数据基础（并冒着被指责重复计算的风险），不如接受将这些收益分配给那些实施项目的做法。负责这些项目的人可能会感激你帮助他们达成了项目的财务目标。\n\
  \n相反，你可以考虑计算“不创建数据基础的成本”。这种方法可以让你列出所有那些如果没有你的数据贡献，要么根本无法实现，要么至少无法带来同等投资回报的项目。\n\n\
  ### VII. 制定并遵循业务案例规则\n\n你会遇到业务案例受到质疑的情况。例如，人们可能会声称你存在偏见，并试图美化你的业务案例。\n\n我们必须承认，这种指责通常并非凭空捏造。当处理间接收益时（这在数据业务案例中很常见），回应这种质疑就变得更加具有挑战性。\n\
  \n因此，做好准备是很有用的，理想情况下，是通过制定普遍接受的业务案例创建原则来做好准备。而且，如果人们不必同时承诺预算和资源，他们更容易接受（合理的）原则。\n\
  \n这就是为什么你可能希望在创建第一个业务案例之前就做好这一点，因为在那时达成一致对任何人都没有代价！\n\n当然，你会包含本章前面描述的所有标准组成部分，例如“净现值”计算，或考虑收益的最长时间范围。\n\
  \n但是，如果你能够成功纳入软性因素的规则，你就可以为数据相关项目带来更显著的收益。\n\n一个例子是前面描述的“不做的成本”计算。这应该在你的业务案例规则列表中名列前茅，以期成为企业标准。\n\
  \n第二个例子是对*条件性*收益的处理。就像灭火器可能永远用不上一样，你可能永远不会面临安全受损或声誉受损的情况。但是，我们仍然有充分的理由去彻底实施数据保护机制，正如有充分的理由配备灭火器一样。\n\
  \n计算这类收益的一个简单规则是将事件的影响乘以其发生概率。一旦就概率和（正面或负面）影响达成一致，收益计算就变得简单了。\n\n### VIII. 培养企业数据文化\n\
  \n看看你的周围：在你的组织中，是否有某个职能部门或部门的几乎所有项目都能获得批准，而无论参与人员是谁？\n\n为什么会这样？是某种特定类型的项目被视为“理所当然”的、“必须做”的事情吗？\n\
  \n根据一个组织（显性或隐性）的文化，某些方面通常被认为是不可协商的。\n\n*   也许数据保护被认为是一个至关重要的方面，以至于所有相关项目都获得了资助。\n\
  *   也许存在一个得到董事会支持的长远转型计划，以至于各个项目总是试图让自己被视为其中的一部分，以便获得预算。\n\n你的目标应该是让“成为数据驱动型组织”成为那些由董事会支持的目标或计划之一，甚至成为你组织文化的官方组成部分。\n\
  \n## 将数据作为资产的用例\n\n业务案例不仅仅是财务论证。它们也关乎提出理由来说服他人。\n\n### 什么驱动着你的预测？\n\n这是一个真实的故事。我不会透露该组织的名称，并且已经更改了数字。\n\
  \n*该组织的管理层知道员工需要得到激励。他们决定通过分享一个多年前的故事来培养一种敢于行动的态度：*\n\n*在经历了一段困难时期后，该组织必须为未来几年设定目标。所有高管都基于他们悲观的世界观提出了非常保守的目标。*\n\
  \n*CEO 对这些毫无雄心的目标感到沮丧，他站起来说：“我们的目标是实现十亿美元的收入增长！”所有人都震惊了，因为这看起来并不现实。*\n\n*但是，最终他们所有人都接受了这个目标（实际上，他们别无选择）。所有高管都感到面临挑战，并开始努力工作（他们无论如何也会这么做）。*\n\
  \n*几年后，他们从危机中恢复过来，并实现了那个十亿美元的目标。*\n\n*他们说，如果没有这位雄心勃勃的 CEO，这些结果永远不可能实现！*\n\n*多年后，管理层决定用这个故事来解释他们为什么设定雄心勃勃的目标。持怀疑态度的人会被提醒想起当初的成功故事。*\n\
  \n*不幸的是，与此同时，经济已经疲软。市场在萎缩，竞争对手在提供折扣以争夺市场份额。尽管该组织在运营和商业上都表现良好，但收入和利润都在下滑。雄心勃勃的目标并没有带来帮助。相反，它们模糊了局势，因为每个人都认为努力工作就能像上次一样达成目标。*\n\
  \n以下是任何类型财务预测的三个关键经验教训：\n\n1.  雄心可能是预测的一个有用成分——但如果你将整个计划建立在直觉和雄心的混合体上，那你还不如使用随机数生成器。\n\
  2.  忽视外部数据会让你变得盲目。雄心并不能保护你免受市场扭曲的影响。\n3.  仅仅根据过去的发展进行外推也不是一个好主意。外部世界在不断变化，这无法从内部数据中推导出来。\n\
  \n你又是如何做预算预测的呢——基于虚构、直觉，还是数据？\n\n### 数据——为什么是现在\n\n有必要强调的是，过去十到二十年间，数据业务案例的基础已经发生了巨大变化。\n\
  \n*   根据 Gartner^(³⁹)的数据，到 2020 年，将有超过 200 亿个连接的传感器、终端和数字孪生体对应着潜在的数十亿物品。\n*   可用于分析的数据每两年翻一番。\n\
  *   由于必要的计算能力已经具备，旧算法现在可以投入使用。\n*   AI 算法的发展迅速推进，因为它已成为数学研究的一个重点领域。\n*   数据科学家的数量在增加。作为数学研究的一部分，神经网络正成为一门越来越有吸引力的学科。毕竟，数据科学就是应用数学。\n\
  *   客户期望在迅速发展。例如，如果组织询问客户已经提供过的任何信息，客户是无法容忍的。客户知道这是可以避免的。\n\n\n\n### 消费者数据\n\n普通数据能否作为资产发挥作用？\n\
  \n**示例 4**\n\n在我年轻时（我是说，*非常*年轻的时候），我曾靠为一家树木农场分发广告宣传单赚点零花钱。\n\n那些宣传单的目标人群是住在带花园房屋里的人——其他人买了那些树也基本派不上用场。\n\
  \n我被派往富裕的住宅区，并且被告知不要在公寓楼、商店或小公司上浪费时间和传单。\n\n如今，这项工作由邮递员完成——但他们并不核查某个地址是否属于目标群体。\n\
  \n因此，如果缺乏本地知识，树木农场就会浪费大量资金，把传单寄送给四楼的住户，而他们只会纳闷如何在阳台上种树。\n\n现在，想象一下，你拥有描述每个住宅区特征的数据：是乡村还是城区，是富裕还是贫困的定居点，等等。这些数据可以显著减少偏差损失，确保你只向足够富裕的乡村地区分发宣传单。\n\
  \n更进一步：假设你拥有所有地址的数据，包括住房类型、花园大小、房产价值以及其他属性。这将使你能够更好地定制营销活动。\n\n最后，如果你能将这些数据与你的客户档案相结合，你就能确定应该向哪些客户推荐哪种产品。\n\
  \n鉴于与每个数据精细度层级相关联的收益，你可以为你的数据添加一个价值标签。或者，如果你需要先获取这些数据，你就能确定愿意投入多少资金才能使其产生回报。\n\n\
  随着时间的流逝，你的数据会老化，你必须定期更新它们，以防止不可避免的浪费日益加剧。\n\n如果树木农场当年请像我这样的年轻人边分发传单边收集所有必要的数据，他们就能收集到大量有价值的数据，甚至可以将这些数据出售给其他组织（当然，只能在`GDPR`允许的范围内）。\n\
  \n现在，让我们重新审视这个示例：^(⁴⁰) 如果文中将“数据”替换为“魔法粉末”——这个故事也同样说得通（尽管听起来有点像童话故事）。\n\n区别何在？组织可以轻易地将这种“魔法粉末”归类为资产。难道它们至少不应该*将*“数据”也视为资产吗？\n\
  \n**数据管理定理 #10**\n\n**组织应将数据视为资产，无论从法律或税务角度它是否被认定为资产。**\n\n脚注 1 2 3 4 5\n\n"
- "# 17. 数据伦理与合规\n\n![../images/499948_1_En_17_Chapter/499948_1_En_17_Fig1_HTML.jpg](img/499948_1_En_17_Fig1_HTML.jpg)\n\
  \n**图 17-1** 数据也有阴暗面\n\n## 伦理行为与数据？\n\n### 哪些地方可能出错？\n\n众所周知，大多数国家不允许组织因求职者的肤色或宗教信仰而拒绝录用。其原因不难理解。\n\
  \n但并非所有我们利用数据可能造成的恶行都受法律禁止。其中许多行为仅仅是由于出现时间太短而未被写入法律条文。\n\n另一方面，一些绝无恶意且无意造成伤害的活动是被禁止的，组织可能在毫无不良意图的情况下犯错。\n\
  \n考虑到所有这些因素，当你负责组织的数据处理工作时，该如何处理数据伦理问题呢？\n\n首先，让我们看几个存在争议的数据技术和机遇的例子：\n\n*   在追求平均最优化的同时歧视个人\n\
  *   接受以牺牲个人利益为代价的算法错误\n*   未经数据主体同意便使用其个人数据，以保护该人免受无关广告的骚扰\n*   利用数据对抗他人（作为一种武器）来保护自己\n\
  *   分析人们以影响其行为\n*   伪造数据或算法，以改变受众对某个情况的看法\n\n你可能会认为其中一些做法是完全错误的，而另一些则可以接受，或者你会说这取决于具体情况。\n\
  \n无论如何，情况并非一目了然，值得深入审视。\n\n### 我们目前处于何种境地？\n\n随着人们开始了解其中的机遇，他们也逐渐意识到其中的风险。\n\n这包括对未知的恐惧：可能根本不存在危险，但由于缺乏透明度，你无法判断。\n\
  \n作为回应，越来越多的国家对数据处理进行监管，透明度成为监管的一部分。\n\n在经历了几次会计丑闻后，美国将重点放在透明度上。要求组织在财务事项上保持透明的`萨班斯-奥克斯利法案`早在\
  \ 2002 年就已出台。\n\n欧洲的主要关注点是数据隐私。`GDPR`^(⁴¹)于 2018 年 5 月在欧盟生效，经过事实上的宽限期一年后，处罚措施已开始波及整个欧洲的组织。非欧洲组织若想在欧盟开展业务，也必须遵守该法规。\n\
  \n我在美国和其他非欧洲国家的许多同事告诉我，他们认为`GDPR`是对全球数据隐私挑战的一种过度反应。\n\n然而，这不应成为降低合规程度的理由。我通常向我的美国朋友解释，欧洲当局对待`GDPR`的严肃程度，就如同美国当局对待`SOX`合规一样。（猜猜我是如何告诉欧洲人他们需要多么严肃地对待`SOX`的。）\n\
  \n基本上，所有大洲的国家都已将`GDPR`作为制定本国法规的参考点，因为随着技术可能性的发展，数据滥用现象也在增加，而且这不会止步于国界。\n\n但各国并非坐等欧盟法规以便照搬。现有较早的法律例子包括\
  \ 2017 年的《中华人民共和国网络安全法》，或者更早的《俄罗斯联邦个人数据法》（第 152-FZ 号），该法可追溯至 2006 年，尽管在 2015 年因需要对俄罗斯公民的个人数据进行“本地化”而进行了扩展。^(⁴²)\n\
  \n尽管如此，许多围绕数据的潜在不道德行为尚未受到监管。但各国政府的意识正在提高，预计会有更多法规出台，例如在面部识别领域。今天被允许的行为，明天可能会变得非法。\n\
  \n有趣的是，大多数法规都采用“基于同意的模式”：处理个人数据需要得到该人明确的同意。然而，在个人给予同意的情况下（一些垄断者可能不给他们选择的机会），几乎任何对其数据所做的处理通常都是法律允许的。\n\
  \n你可能仍然希望确定剩余的约束条件。例如，许多国家不允许在某些情况下对人员进行定位，即使已获得个人同意。\n\n### 每个企业面临的问题\n\n在这种情况下，组织在确定其数据伦理方向之前，需要问自己几个问题。典型的例子包括：\n\
  \n*   我们是否会从利用存在争议的数据相关技术和机遇中获益？\n*   如果会，这些收益的可持续性如何？\n*   我们是为了更大的利益还是出于经济原因而想要遵循伦理？还是两种动机兼而有之？\n\
  *   伦理行为在多大程度上对我们有意义？\n*   这从经济角度来讲是否划算？是直接的还是间接的？\n*   在法律要求之外践行伦理，是否甚至有意义？\n*\
  \   我们组织内部是否就什么是“合乎伦理”达成共识？\n\n\n\n### 你的选择有哪些？\n\n组织并非被迫在合乎道德与不合乎道德之间做出抉择。让我为你列举几个现实的选项：\n\
  \n1. **合规作为不可妥协的原则**\n\n   你决定不惜一切代价遵守法律。\n\n   在此边界内，商业案例说了算。\n\n   这种方法乍听起来尚可接受。至少在法律合规方面，你立于安全之地。\n\
  \n   但若换个角度审视，风险便显而易见：如果有利可图，你基本上就会采取“只要不禁止就去做”的策略。\n\n   那么，由此产生的风险是什么？\n\n   不幸的是，罚款并非唯一需要考量的负面后果。\n\
  \n   每个人都曾目睹网络舆论风暴在社交媒体上的影响。它们让组织在公众面前形象受损，并影响消费者行为。而这些行为中又有多少是实际违法的呢？仅举两例：法律允许组织以高到将大量患者排除在外的价格销售专利药物，或者用高污染重油为其集装箱船提供燃料。\n\
  \n   如果剑桥分析公司是在获得用户同意的情况下获取所有个人数据，公众的评价也不会从根本上更为有利。这个品牌之所以被摧毁，主要在于其有毒的商业模式。\n\n\
  2. **基于伦理的商业案例**\n\n   在此，你依然会使用（可能很复杂的）商业案例，同时考虑短期和长期成本。\n\n   但除此之外，你会承认伦理行为似乎存在市场。\n\
  \n   你会问：在遵守法律边界内，不考虑伦理方面的风险是什么？\n\n   本质上，你在商业案例中同时考虑了法律与伦理。\n\n   现在你安全了吗？\n\n\
  \   我不得不在此让你失望——仍有相当的风险存在。\n\n   世界比以往任何时候都更具动态性，消费者行为亦是如此。你的商业案例可能无法反映今日之后的客户行为。它可能基于对客户行为过时的认知（依据过去的数字），或者客户偏好在你有机会衡量之后很快发生了变化。\n\
  \n    几年前，当碳中和服务方案出现时，我记得一家快递公司的高管曾问：“究竟有谁会愿意仅仅因为运输方式更环保而自愿为一件货物支付更多费用？”\n\n   \
  \ 而且，确实，这在当时有点难以想象。如今，在客户强烈需求的推动下，组织坚持要求以`CO[2]-neutral`的方式运输他们的货物。没有哪家大型运输服务商能承担得起*不*提供这种服务的后果。\n\
  \n3. **逐案判断，基于商业案例**\n\n   可以根据（可能很复杂的）商业案例来决定是合规还是不合规。这在每个预计不合规能带来某些好处的个案中执行。\n\
  \n   成本/收益计算必须同时考量不合规的直接财务影响和间接影响（声誉等）。\n\n   此外，被抓住的代价要乘以其预期的概率。\n\n   最终，如果这类组织认为自己能侥幸逃脱，就更容易接受不合规。\n\
  \n   例如，决定是否遵守`GDPR`就会变成一个商业案例，需要计算预期罚款和消费者负面反应的成本，再乘以被抓住的概率。\n\n   本质上，如果预计平均能提升股东价值，这样的组织就会接受违法。\n\
  \n   你并不会惊讶于这种做法带来的巨大风险：\n\n   - 无论你计算出被抓住后会有何种影响：你得预料到实际情况会比估计的更糟。法官会区分那些懒得修复已知问题的组织，和那些为了利润明知故犯违法的组织。\n\
  \n   - 组织可能因此倒闭。臭名昭著的剑桥分析公司曾经极为成功：他们做了自己承诺并收钱去做的事。他们是盈利的。然而，由于违反隐私法，他们不得不在 2018\
  \ 年关门歇业。即使牺牲这个组织可能是整场游戏中被算计好的一部分，这个故事也展示了公众反应的潜在力量。\n\n   - 不道德行为不仅危及组织的声誉。管理层的声誉同样面临风险。与不道德行为扯上关系，对你的简历可不太好看。\n\
  \n    但在批评了所有之前处理数据领域伦理问题的方法后，我有什么建议呢？\n\n    以下便是：\n\n4. **伦理作为组织原则**\n\n   在涉及可接受的数据处理方式时，尤其是在`AI`领域，你可能不希望让法律成为你唯一的指南针。\n\
  \n   这正是你组织文化发挥作用的地方。如果没有引导，“如果能做，那就去做”或“只要不禁止就没问题”的文化会迅速滋长。在这种情况下，一旦监管收紧或消费者行为发生变化，要改变员工行为可能会很困难。\n\
  \n   请记住：`AI`的许多方面都还太新，迄今尚未受到监管。预计更多监管很快就会出台。\n\n   如果你被抓住，声称某事“过去没有监管”并不是一个有效的借口。监管机构最多只会给予一个过渡期。\n\
  \n   建立一种谨慎的文化，要比监控所有道德上缺乏指引的员工的活动容易得多。\n\n### 更广阔的视角\n\n我们应该牢记这一点：存在伦理问题的`AI`不过是旧行为披上了现代的外衣。邪恶并非随着`AI`而来。\n\
  \n你可以这样说：存在伦理问题的`HI`（人类智能）由来已久。带有偏见的`AI`算法做出的歧视性决定，与人类传统的歧视性决定如出一辙。主要区别在于，现在组织可以归咎于算法。\n\
  \n当柏林航空于 2019 年破产时，汉莎航空在德国一些国内客运航线上获得了暂时的垄断地位。他们立即提高了票价。\n\n此事曝光后，他们面临了一场公关危机，从网络舆论风暴到抵制呼吁，不一而足。\n\
  \n汉莎航空急忙解释，他们使用一种算法，根据需求和利用率等多种因素来确定最佳票价。虽然这并非谎言，但很容易看出整个过程并非汉莎航空“遭遇天灾”。\n\n而且，该算法并未考虑汉莎航空声誉受损的影响，而这比通过暂时提高票价获得的相对较小的收益更为重要。\n\
  \n一个基于伦理的组织文化，加上具备数据素养的员工队伍，在开发定价算法时，可能就已经考虑到了这一切，例如，通过设定机票价格的上限。\n\n这是否意味着我们不再需要为数据制定商业案例了？你可以这样看：第一道过滤器是你的组织伦理文化，随后是作为财务过滤器的商业案例。\n\
  \n那么，你的股东或所有者会如何看待这种方法呢？他们会不会认为你是在用股东价值来换取伦理？\n\n幸运的是，如果出于利己的动机，你会做出合乎道德的行为。伦理提升组织的价值。消费者的抵制则会摧毁价值。\n\
  \n二十年前，几乎没有人会想到，有朝一日会有大量的人愿意为合乎道德生产的产品或提供的服务支付溢价。\n\n今天我们更清楚了——让我们有勇气通过合乎道德的行为，让我们的组织取得成功！\n\
  \n\n\n## GDPR——都搞定了？\n\n我们已赶在 2018 年 5 月 25 日之前及时完成了 GDPR 项目，现在终于可以松口气了，对吧？\n\n\
  `GDPR`迫使我们以本应始终遵循的方式处理数据。最终，GDPR 的威慑力确保了我们获得支持与资金来做到这一点。\n\n许多组织曾将`GDPR`视为一项带有外部强加截止日期的“一次性项目”。而在多数情况下，目标并非“实现\
  \ X”，而是“在截止日期前足够接近合规要求”。\n\n尽管这是 GDPR 合规的重要组成部分，但我想提请你关注`GDPR`的其他三个方面。在我看来，这些方面至少同样重要。\n\
  \n### 项目结束≠大功告成\n\n这是第一个方面：不要因为 5 月 28 日过去了就停止努力。\n\n这听起来显而易见，因为组织会持续接受审计，而当局如今期望的是组织早期可能被谅解的事项。他们认为，与此同时，所有组织都已拥有足够的时间来真正实现合规。\n\
  \n但现实表明，关注度和资金很快就会转移到别处。`GDPR`从领导层的雷达屏幕上消失，新的、更有趣的话题迅速涌现。\n\n### 隐私必须成为思维方式\n\n\
  第二个方面是关于将`GDPR`视为一种工作方式，而非一个启动、执行并希望大致按时收尾的“一次性项目”。\n\n`GDPR`常常被视为“本职工作之外的额外负担”。相反，它应当成为人们日常工作的*一部分*。\n\
  \n隐私需要成为一种原则。首个“项目”应致力于将数据隐私确立为目标，而非急于实施。\n\n![../images/499948_1_En_17_Chapter/499948_1_En_17_Fig2_HTML.jpg](img/499948_1_En_17_Fig2_HTML.jpg)\n\
  \n图 17-2\n\n数据隐私的最差实践\n\n### 发现商业机遇\n\n我的第三个方面是真正积极的：`GDPR`不仅给组织带来麻烦，它还催生了新的商业模式，并为你提供与竞争对手差异化的机会。\n\
  \n你的客户难道不喜欢听到这样的信息吗？“我们始终会告知您我们如何使用您的数据。我们让您轻松管理我们所了解的关于您的一切。”\n\n站在客户的角度想一想——他/她可能担心什么？如果客户真正信任你，他们不会要求你删除你所了解的关于他/她的信息。\n\
  \n`GDPR`还能在内部起到立竿见影的清洁作用：数据分析人员常常将`C++`或`Java`编程中的“垃圾收集”概念套用到数据收集中：“尽可能多地收集、存储和保留数据——未来可能会有用。”\n\
  \n这种行为是低效的。如果你收集了所有能获取的数据，很可能难以识别其中有价值的部分：你会因为树木而失去整片森林！\n\n用另一个类比来说，你正在制造*噪音*：想象一下在繁忙的市场或火车站里，你难以听清单个声音的困境。\n\
  \n`GDPR`将提供一个工具，促使我们在数据收集时保持谨慎。它有助于组织在无条件收集数据之前进行思考和规划。\n\n最后，道德行为并非成功的敌人！如果你将数据隐私列为组织的优先事项之一，你的长期成功将建立在卓越的声誉之上。客户比以往任何时候都更看重可信赖的行为。\n\
  \n### 建议\n\n基于以上三个方面，我提出以下建议：\n\n1.  **兼顾系统** *与* **文化。**\n\n    明确这两方面同等重要：既有明确交付成果的项目，也需进行文化变革。\n\
  \n2.  **将数据治理扩展到数据隐私。**\n\n    得到妥善治理的数据将使`GDPR`合规变得容易——包括证明合规性的能力。\n\n3.  **将隐私纳入组织价值观。**\n\
  \n    强调数据隐私带来的机遇。请注意，只有当这一价值观至少与其他价值观处于同一水平时，人们才会遵循它。否则，短期利益将被视为高于长期成功因素（例如你如何处理客户及其他相关方的数据）。\n\
  \n4.  **让所有利益相关者参与进来。**\n\n    作为`CDO`，你无法独自完成这一切，`CIO`也不行。需要跨职能的联合力量！此外，组织中的所有职能领导都需要理解不合规的风险以及合规带来的机遇。\n\
  \n脚注 1 2\n\n"
- "# 18. 外部世界\n\n![../images/499948_1_En_18_Chapter/499948_1_En_18_Fig1_HTML.jpg](img/499948_1_En_18_Fig1_HTML.jpg)\n\
  \n图 18-1\n\n沉浸在自己的数据“汤”里？\n\n## 为何要关注组织外部？\n\n没有任何组织是孤立存在的。外部发生的许多事情都会对组织的内部世界产生影响。它们既构成威胁，也带来机遇。\n\
  \n我们有充分的理由有意识地关注组织边界之外正在发生的事情。本章我将探讨一些不那么显而易见的主题。\n\n## 跨组织数据共享\n\n越来越多的组织开始以群体形式共享数据，这已成为当下所谓的“共享经济”的一部分。\n\
  \n### 数据共享的不同方式\n\n数据共享有两种方式：\n\n1.  **双边数据共享**\n\n    这种共享概念通常被称为“数据易货交易”。两个典型例子是：\n\
  \    *   两个组织同意相互提供价值大致相当的数据，且不收取费用。\n\n    *   组织向提供自身数据的客户提供折扣作为回报。\n\n2.  **多边数据共享**\n\
  \n    多个参与方同意共同开发一个数据池，所有方都向其中贡献数据（通常是通过补充缺失数据、移除过期数据或清理错误数据），并且所有方都能加以利用。\n\n \
  \   为确保中立性，第三方提供商负责协调数据交换。他们提供防止数据窃取的方法。此类提供商的例子包括：\n    *   用于客户和供应商数据的“企业数据联盟”^(⁴³)\n\
  \n    *   用于航空业数据的“Skywise”^(⁴⁴)\n\n几乎所有类型的数据都可以进行共享，范围从地址数据到飞行途中收集的传感器数据。\n\n\n\
  \n### 共享数据的动机\n\n为什么组织要这么做？它们难道不是在免费泄露宝贵信息吗？\n\n事实上，有付出才有回报。这既关乎“更多信息”，也关乎“更清洁的信息”。\n\
  \n当竞争对手之间开展合作时，收益是最大的。显然，他们处理的是相似的信息，因此能从彼此的数据中获益更多。\n\n但是，如果所有参与者都赢了，竞争优势又体现在哪里呢？\n\
  \n主要有三个方面：\n\n1.  **行业内的竞争力**\n\n    行业内的特定组织可以共享数据，以获取相对于其他竞争对手的优势。\n\n2.  **行业间的竞争**\n\
  \n    就连整个行业之间也存在竞争！比方说，如果所有铁路运营商的效率都得到同等程度的提升，那么整个铁路行业相比卡车运输行业将获得额外优势。\n\n    或者想象一下，所有快递和包裹承运商通过交换交通数据来进行协作。由此带来的效率提升（成本节约和更快的配送）将使组织更倾向于将零部件从地点\
  \ A 运送到地点 B，而不是在地点 B 生产。结果，整个运输行业都成了赢家。\n\n    这里一个实际的做法可以是在 3D 打印领域达成联合协议。将标准化的打印数据长距离传输，然后在当地打印零部件，最后仅通过卡车完成最后一英里配送——这种方案预计将成为洲际快递运输越来越有吸引力的替代选择。它更便宜、更快速，也更环保。\n\
  \n    在这个更高层次的竞争中，数据共享的组织当然会继续相互竞争。简而言之，它们是在共同扩大市场蛋糕的规模，然后再为争夺这块蛋糕的份额而竞争。\n\n3.\
  \  **对资本的竞争**\n\n    整个行业的盈利能力可以相比其他投资变得更高。一个众所周知的现象是，同一行业的组织会相互影响彼此的估值——如果一家组织公布了糟糕的业绩，其他组织通常也会面临股价下跌。\n\
  \n    现在想象整个行业都变得更高效了。你可以预期投资者会认为该行业的所有组织都更具吸引力。\n\n## 外部数据\n\n### 仅靠内部数据是不够的\n\n\
  你网站上的访客、竞争对手的新闻稿以及 Facebook 有什么共同点？\n\n它们都提供了宝贵的外部数据。获取它、理解它，并将其与你的内部数据融合，你将能更好地理解这个世界。\n\
  \n为了在商业上取得成功，组织需要了解与之互动的所有相关方。纯粹向内看的视角会让你对市场变化视而不见。\n\n使用内部数据，你的销售预测只是对过去数据的简单外推。而加入市场数据则能让你考虑可能影响未来收入发展的外部因素。\n\
  \n认识到你组织之外发生的事情远远超过了 99%，这是很有启发性的！\n\n这一观察甚至适用于大型社交媒体平台。然而，它们在让客户主动向它们提供信息方面做得非常成功。客户自愿与这些平台分享所有个人细节，教会它们我们的整个世界如何发展，因为它们的客户基础足够大，足以代表地球上很大一部分人口。\n\
  \n然而，对于大多数其他组织来说，它们在全球各地和社会各阶层中的足迹并不足够大，无法仅凭客户与它们分享的信息就很好地理解“外面发生了什么”。\n\n### 你能从外部数据中学到什么\n\
  \n内部数据通常是历史数据，即回顾过去。相反，你需要的是能帮助你展望未来的数据。\n\n融合外部数据和内部数据，有助于你将内部数据置于更广阔的背景下审视。\n\n\
  1.  **了解你的客户。**\n\n    社交媒体之所以被发明，就是为了让你的客户免费与你分享那些你直接索取时他们绝不会提供的数据。\n\n    至少，在观察了网络上的人类行为之后，你可能会这么想。\n\
  \n    尤其是你组织方面的失误，会激起客户诚实的反馈。即使他们的本意并非提供免费咨询，你也可以将其视为咨询意见来利用。\n\n    当然，这些评论并不具有代表性，因为人们倾向于对糟糕的经历比符合预期的情形发表更多评论。\n\
  \n    但是，你可以对其进行权衡。这些数据的数量如何随时间变化？你的处境与竞争对手相比如何？\n\n    外部消费者数据的另一个优势是，它并不局限于你现有的客户。\n\
  \n    你可以了解所有潜在未来客户的偏好：\n    *   人们需要什么？\n    *   他们希望如何获得？\n    *   他们愿意付多少钱？\n\
  \    *   他们的质量要求是什么？\n\n2.  **了解你的竞争对手。**\n\n    你的竞争对手绝不会与你（或公众）分享他们的秘密战略。甚至他们的股东也可能无从知晓。\n\
  \n    但是，如果能知道这些岂不很好，对吧？也许他们知道一些你不知道的事情。而且，成功的关键往往不仅在于做正确的事，更在于率先去做。\n\n    你可以比想象中更容易地从公开可用的数据中推断出竞争对手的计划：\n\
  \    *   评估他们的招聘广告，以了解他们未来的关注点：他们打算专注于什么，正在哪里组建团队？\n    *   分析他们沟通的历史信息：虽然你无法从单一信息中判断其方向，但或许能从一年中一系列公开信息的趋势中看出端倪，措辞上的细微变化可能暗示着关注点的转移。\n\
  \    *   竞争对手是否将投资从一个领域转移到另一个领域？你或许无法从单笔投资中看出端倪——但系统性地汇总所有投资信息就能揭示全貌。\n\n    你观察到的变化有助于你及早发现趋势。\n\
  \n3.  **了解你的供应商。**\n\n    其他客户对你的供应商有何评价？你的大多数供应商都有 Facebook 页面，从中你能了解到比任何评级机构都更多的信息。在\
  \ Twitter 上关注正确的主题标签也能提供大量见解。\n\n    除此之外，你当然可以用了解竞争对手的方法来了解你的供应商——相同的方法同样适用。\n\n\
  ## CDM 与外部数据\n\n\n\n### 外部数据结构的挑战\n\n**企业数据模型（`CDM`）是否应考虑外部数据？**\n\n一个组织可能无法影响外部数据的结构——但只要外部数据与组织相关，就需要将其纳入企业数据模型（`CDM`）中。\n\
  \n主要原因在于外部各方（客户、供应商、政府机构）不会遵循任何组织的内部数据结构。\n\n因此，外部数据需要映射到内部信息（即你的组织看待世界的方式）。\n\n\
  **例如：**\n\n-   你的组织内部对全球各国的划分，可能与官方的 ISO 国家代码集不同。这并非易事！即便在 ISO 层面，划分方式也并非明确无误。以加那利群岛为例：你可以将其视为西班牙的一部分，使用\
  \ ISO 代码 `ES`；或者将其标记为 `IC`（Islas Canarias 的缩写），这是加那利群岛专用的 ISO 代码。你必须预见有些客户、供应商或政府机构会使用一种代码，而另一些则使用另一种代码。你的系统需要为此做好准备，并将人工干预的必要性降至最低。\n\
  \n-   官方邮政编码体系的质量因国家而异。虽然其中一些体系可能非常适用于描述销售区域或定义服务价格，但其他国家的邮政编码体系可能过于粗略，或者大部分未被使用。在这种情况下，组织需要自己的内部地理划分。然而，这两种将世界划分为更小地理区域的方式，不应彼此独立。例如，你可以使用官方邮政编码，再通过城市或市镇名称对其进行进一步细分。\n\
  \n-   公共假日可能与你的组织运营日存在差异。想象一下，在一个拥有许多地方性节假日的国家（例如西班牙）运营一个服务机构。该机构可能服务于相邻市镇的客户，而这些市镇的公共假日安排各不相同，因此你的机构即使在地方性节假日期间也可以保持开放。这正是你需要维护的参考数据，以便系统了解每个机构的运营日。\n\
  \n第三方，例如你的客户、供应商、外部合作伙伴，甚至你的员工（在公共假日的情况下），极有可能会引用外部数据的定义。\n\n事实上，你也不希望强迫这些方考虑你的内部逻辑或措辞。这就是为什么内部数据结构永远不应成为任何客户提供物的一部分。\n\
  \n最后，客户订购的是具有明确质量和/或服务水平的最终结果。作为供应商，你的组织应负责以最佳（且最经济）的方式实现这一目标。客户绝不应被你的组织为了自身运营而需要组织的数据所困扰，因为这些数据与客户理解产品无关。\n\
  \n### 对你数据模型的影响\n\n在上述每个示例中，你都需要完全的灵活性，以便独立于你无法控制的数据来维护你的内部数据。毕竟，你不想仅仅因为官方修改了某些邮政编码区域的划分，就被迫更改你依赖邮政编码的销售区域。\n\
  \n同时，外部数据与内部数据之间的关系必须明确定义，以便你的组织软件能够在两个世界之间进行转换。（请记住：在参考数据时代，硬编码不是一个可接受的选项！）\n\n\
  此外，我们还需要在不改变产品承诺的前提下，灵活地调整我们的运营方式。\n\n这就是为什么你通常需要全面且明确地映射外部和内部数据结构。\n\n### 内部数据与外部数据的映射\n\
  \n不幸的是，有两个领域会使映射变得极具挑战性：\n\n1.  **一对多映射**\n\n    当一个组织需要进一步分解外部视图时（例如出于内部处理原因），你面临的就是一对多关系。挑战在于，外部提供的数据缺乏自动分解所需的信息。\n\
  \n    你有三种选择：从客户提供的其他数据中确定所需信息（数据模型应能指明！），向客户索要额外信息，或在内部确定缺失信息。\n\n    你可能需要增强你的\
  \ `CDM`，直到涵盖正确映射所需的所有实体和属性。并且，你需要制定业务规则来描述如何获取缺失信息。\n\n2.  **多对多映射**\n\n    有时，你会在多个方面面临映射的模糊性。\n\
  \n    回想一下本章前面描述的 ISO 国家代码逻辑带来的挑战。\n\n    现在想象一下，你想将这些代码映射到你的*内部*国家结构，其中各个独立的国家组织对特定地理区域拥有各自的损益责任。现在，请思考以下两种情况：\n\
  \n    -   你可能会让圣马力诺由其意大利总部管理，因此从你的组织角度来看，它是意大利的一部分。与此同时，那里的客户会坚持认为他们*不是*意大利人。\n\n\
  \    -   在政治争议地区，收入分配不应取决于客户使用哪个国家代码。\n\n这就是为什么内部与外部数据结构之间的复杂关系需要精确定义的数据模型和映射规则。\n\
  \n并且请不要认为这只是一个技术任务。从内容层面来看，业务利益相关者需要推动开发工作。让相关的数据负责人共同主导讨论。数据架构师则应负责提出正确的问题，并将业务需求转化为数据模型。\n\
  \n\n\n## 数据质量即服务？\n\n即使所有数据在录入时都经过验证和清洗，随着时间的推移，它们也会变得“脏污”。通常不是数据本身发生了变化，而是现实情况变了，使得原本正确的数据变成了不正确的数据。\n\
  \n永久保持海量数据的洁净是一项艰巨的任务，将这项任务外包出去可能是明智之举。\n\n但如何确定要外包什么（以及外包到什么程度）呢？\n\n让我们从始终拥有洁净数据可供使用的目标开始。我希望你考虑三个方面。\n\
  \n首先，无论你的组织是否具备保持数据洁净的能力，让一个组织独自清洗外部数据通常都不是明智的决定。\n\n相反，任何外部数据（除非是按需访问）都应该通过订阅的方式获取，以便保持更新。这样做是出于效率考虑。显然，一个数据供应商为多个订阅者保持数据洁净，比众多组织同时各自清洗同一批数据要高效得多。\n\
  \n其次，由外部组织控制或管理的数据，最好由该组织自身来保持洁净。他们拥有权限，并且熟悉自己的数据。\n\n第三，最好的方法是尽可能实现自动化，无论是通过算法还是通过外部触发器。\n\
  \n在可能的情况下，你应该选择全自动更正（例如，从外部数据提供商获取地址变更信息）。\n\n在所有其他情况下，你的自动质量检查（针对元数据和合理性）会生成警报。第二步，你需要组织对任何报告记录进行人工审查和修复。\n\
  \n可以预见，采用人工智能启发式方法的服务产品数量将会增加。这将使机器预处理进一步成熟，从而减少内部员工需要人工审查的可疑记录数量。\n\n请记住，要将包含个人信息的数据排除在此方法之外（参见第\
  \ 17 章“GDPR——全做完了？”一节）。在所有其他机密数据的情况下，人工智能驱动的启发式方法确实有助于避免将机密数据暴露给外部资源。\n\n凡无法通过全自动化流程修复的数据，你需要决定剩余的手动工作应如何完成，以及由谁来完成。\n\
  \n*   如果内部数据不涉密，且其质量被清晰描述，你可以与流程外包供应商签约，让其清洗你的内部数据。\n*   对于你组织特有的数据，最佳的专业知识可能存在于内部。但通常对你帮助最大的可能不是显而易见的专家，而是在该组织工作了几十年的资深业务能手。\n\
  *   同样的情况也适用于那些需要了解你组织运营所在地本地市场知识的数据。与外部供应商不同，你的本地团队应该具备必要的本地知识。\n\n一个经过验证的方法是：集中协调数据质量工作，同时让本地团队负责。同时，你也可以借此展示出你对他们知识和勤勉的信任。\n\
  \n数据质量改进的简短公式是：\n\n*   能自动化，则自动化。\n*   有好报价，则外包。\n*   其他情况，内部处理。\n*   切勿错过任何改进数据质量的机会！\n\
  \n## 全球标准\n\n### 你自己的标准——虽好但不够好\n\n数据标准是好的。这就是为什么许多组织会定义内部标准来简化信息交换。正如我们所见，这些标准涉及数据管理的广泛领域，例如数据模型、数据词汇表和元数据。\n\
  \n典型的做法是：就标准达成一致，在可能的情况下将它们映射到非标准的实现上，并引入一个存储库来记录所有映射关系。\n\n优点显而易见。你的组织获得了以分阶段方式迁移到这些目标标准的灵活性。你甚至可以整合客户的数据，尽管你通常无权推动客户方的变更。\n\
  \n但在所有这些情况下，其影响仅限于你自己的组织以及少数合作的客户。\n\n在许多情况下，跨组织流程的成功将取决于你*所有*的客户、供应商或合作伙伴都参与进来，即使用同一种数据语言。但他们凭什么愿意接受*你的*标准呢？他们可能需要付出额外的精力来将你的标准映射到他们的标准上。而且他们可能会与你的竞争对手产生问题，因为竞争对手不太可能采用你的标准（除非你的组织拥有设定行业标准的市场力量或权威）。\n\
  \n### 跨组织标准\n\n那么，如何在不需说服他人采用你的标准的情况下，更接近实现跨组织边界无缝、无需映射的数据流呢？\n\n**尽可能采用全球标准！**\n\
  \n你的客户也在使用标准。特别是小型客户，可能没有带宽或专业知识来开发自己的标准。他们通常采用来自标准化机构（如`UN/EDIFACT`、`ISO`或`IEC`）的、成熟的国际公共标准。你的组织规模再大，也不应忽视这种方法。评估这些标准，你会发现，它们中大部分（即使不是全部）也适用于你的组织。\n\
  \n你可能会发现，你的一些客户或供应商已经在使用你正在考虑的标准。这能进一步降低你的迁移工作量，因为它有助于简化你的一些外部接口。\n\n一个优秀的、独立于公司的全球标准示例是`ISO/IEC\
  \ 15459`。该标准定义了一种全球唯一的标识机制，例如用于序列号、包装 ID、批号等，这是实现整个供应链（包括链的可追溯性）无缝数据流的先决条件。\n\n\
  唯一标识使得物理供应链和相应的数据供应链能够完全同步：任何物理交换的单元^(⁴⁵)都可以在描述该交易的电子数据传输时，通过一个代码被唯一地引用。\n\n这种逻辑已经使用了数十年，最早在\
  \ 20 世纪 90 年代初对条形码的内容进行了标准化。如今，它涵盖了*自动识别与数据采集*（`AIDC`）的全部领域，包括二维码和 RFID 标签。\n\n\
  其理念类似于网址的标识：只有顶级域名需要（非常精简的）中央管理。较低级别参与方的标识由相应的高级域名来维护。`ISO/IEC 15459`通过所谓的*发码机构*来组织。\n\
  \n你可以轻易看到立竿见影的好处：\n\n*   不同的发码机构可以自主发布标识符区间，而无需担心任何标识符被多个发码机构重复发布的风险。\n*   组织可以交换货物并唯一地识别它们，无需事先就格式或编号范围进行协调。\n\
  \n你可以在几年前我在 SlideShare 上发布的两份演示文稿中找到关于`ISO/IEC 15459`的更多信息和一个具体应用：\n\n*   (Treder,\
  \ License Plate – The ISO Standard For Transport Package Identifiers, 2012)\n* \
  \  (Treder, Basics of Label and Identifier, 2012)\n\n\n\n### 警惕伪标准！\n\n组织有时会单方面制定“标准”，并希望仅凭其市场力量就能建立这些标准。这些方案是不可持续的，因为竞争对手不愿意采用一个他们无法影响的标准。结果，就会产生相互竞争的替代标准。\n\
  \n因此，您应确保所支持的标准由符合以下三项标准的机构维护：\n\n1.  **非营利**\n\n    一旦组织通过维护标识符或相关服务来盈利，它就不再独立。\n\
  \n    不幸的是，没有人能阻止此类组织自称“非营利”。因此，深入了解幕后情况总是明智之举。有时，组织的法律形式会暴露其商业目的。\n\n    另一个良好的指标是营销活动的程度：如果某个组织在各种渠道积极推广其标准和服务，您就应该保持警惕。\n\
  \n2.  **全球性**\n\n    在我们这个全球化的世界里，国家标准已不再满足唯一标识符的要求。\n\n    相反，您需要确保任何识别标准同样适用于跨境业务。\n\
  \n    如果国家级发行机构是国际标准化机构的成员，并且遵循全球规则以系统性地防止歧义，那么它们是可以接受的。\n\n3.  **独立性**\n\n    真正独立的标准由独立的机构维护。这些机构通常由超国家组织设立或委托进行维护。\n\
  \n    例如，联合国（UN）、国际标准化组织（ISO），或者就全球法人识别编码基金会（GLEIF）而言，是二十国集团（G20）和金融稳定理事会（FSB）。\n\
  \n    除了这三个先决条件之外，全球标准还需要适当的管理，包括参与规则和升级规则。\n\n    成熟的管理模式允许所有用户共同塑造系统，同时防止任何单一方主导。\n\
  \n    这种设置使得社区能够确保数据的所有必要属性通常都得到妥善处理，例如公开可用性或全球一致性。\n\n### 实践方法\n\n但作为一个组织，你能实际做些什么呢？\n\
  \n1.  **了解现有标准和概念。**\n\n    整个组织可能不了解某些全球标准。但即使是组织的 CDO，也可能不了解组织内部至少部分成员已知的标准。这就是为什么你应该四处看看，并与人们交流。\n\
  \n    我非常支持设立一个负责外部数据的数据办公室职能。这样的团队还可以主导对可用独立标准的盘点工作。\n\n2.  **推广独立标准。**\n\n   \
  \ 你可以与业界同行、供应商和客户讨论时提出这个话题。\n\n    只要整个行业就某个独立标准达成一致，他们就可以避免或最小化对单个成员的竞争劣势。相反，他们有可能在与替代行业的竞争中增强整个行业的力量。\n\
  \n    例如，如果整个电视行业通过标准化使其服务更易于使用，他们就能更容易地与流媒体服务竞争。\n\n3.  **参与标准的制定。**\n\n    如何确保全球标准符合您组织的运营需求？\n\
  \n    参与其中！\n\n    全球标准并非从天而降。它们是由人类制定和维护的。而且，由于大多数标准化机构并不雇佣全职专家，它们依赖于各类组织的人员贡献。\n\
  \n    如果您决定让您自己或团队中的某个人参与某些 ISO 标准的制定，您应联系您所在的国家标准化机构，并请求加入合适的工作组。\n\n    这些工作组通常朝着洲际工作组的方向努力。最后，全球工作组会面并讨论、收集和审查提案，并得出最终结论。成为这个过程的一部分，具有极大的力量和影响力。\n\
  \n## 数据的云战略\n\n### 外包到云端\n\n对于许多组织而言，云解决方案已成为数据存储和处理的热门选择——理由充分：\n\n*   共享基础设施允许灵活的扩展，因为需求在现有基础设施的多个用户之间得到平衡。\n\
  *   运营数据中心等非核心活动，可以由专门从事这些领域的第三方更高效地执行。\n*   数据安全、弹性和合规性也可以交由外部专家处理，在法规变更或外部威胁情况下也能利用规模经济。\n\
  \n### 软件即服务\n\n云解决方案通常伴随着 SaaS 产品，这些产品承诺提供类似的优势。\n\n您可能已经注意到，在组织间流程相对标准化的领域，SaaS\
  \ 发展迅速，例如财务（SAP 或 Oracle）或销售（Salesforce.com）。组织很容易将这些任务外包出去，因为它们通常不属于其核心竞争力或独特卖点。\n\
  \n### 智能即服务\n\n下一个合乎逻辑的步骤是：当流程和逻辑被标准化时，“智能”也可以被标准化！\n\n智能即服务（IaaS）并不是一个新词。它可能与 SaaS（软件即服务）的历史一样悠久，因为其理念基本相同。\n\
  \n但到目前为止，尚无全球公认的 IaaS 定义。大多数人同意的一个方面是，IaaS 是 SaaS 的一个子集。\n\n在早期的参考文献中（⁴⁶），IaaS 通常被用来描述我们更恰当地称之为报告即服务（Reporting\
  \ as a Service）的服务：即基于提供的数据创建有用的统计数据和报告的云服务——换句话说，这是所有 SaaS 提供商在其功能性软件解决方案之上都已提供的东西。\n\
  \n但 IaaS 已发展到超越简单报告的范围。它正日益涵盖人工智能（通常也称为 AIaaS）和机器学习。\n\n这一发展代表了 SaaS 中一个日益重要的方面。早期，SaaS\
  \ 开始声称拥有你的数据：现在它正日益涵盖你数据背后的业务逻辑。\n\n其理念似乎是：如果你的数据的创建、修改和运营使用都在云端进行，为何不把分析部分也“放在云端”呢？\n\
  \n当外部数据被标准化时，这种机会会进一步增长。你无需自己获取所有外部数据——IaaS 提供商可以为你完成这一切，在云端整合外部和内部数据，最终为你提供所需的洞察。\n\
  \n这种方法甚至可能缓解隐私方面的担忧。IaaS 提供商可以在以完全匿名的方式向组织提供洞察之前，对个人数据进行聚合。\n\n以交通数据为例：实时交通信息服务（RTTI）从单个车辆收集数据。由此产生的交通信息是完全匿名的。个人信息并非必需。\n\
  \n您不会听到我对迄今为止描述的这些机会提出任何质疑。\n\n然而，云服务、SaaS 和 IaaS 的整个方法都伴随着风险，每个人都应该意识到这些风险。但大多数高管并未意识到。\n\
  \n让我描述其中两个风险：数据模型问题和黑盒问题。\n\n\n\n### 数据模型问题的风险\n\n与多家云服务提供商（或更为普遍的混合云解决方案）合作的企业可能会面临这一挑战：*每个云/SaaS\
  \ 解决方案都带有自身独有的* *数据模型* *和数据结构*。\n\nSaaS 解决方案的数据模型本身就缺乏灵活性——这是其设计使然。如果每个 SaaS 客户都能拥有自己的数据模型，那么共享解决方案根本行不通。\n\
  \n只要两种不同的云解决方案互不兼容，在逻辑上就不可能同时遵循所有这些数据模型。\n\n在这里，功能性云解决方案的孤岛特性与任何企业数据结构的跨职能本质产生了冲突。你为销售团队部署的\
  \ SaaS 解决方案，对客户的定义是从销售角度出发的。这个定义很可能与你财务部门的 SaaS 解决方案中的客户视角大相径庭。\n\nSaaS 自带的数据库结构仅支持单一数据模型。虽然通常可以通过配置获得一定的灵活性，但这种灵活性在设计上受到限制。过多的灵活性将使\
  \ SaaS 产品难以维护。\n\n没有任何组织能够单方面增强 SaaS 提供商核心解决方案的数据模型，无论这种改变多么微小（或多么重要）。\n\n即使在可能进行更改的情况下，这些更改也会使你偏离经过优化的\
  \ SaaS 模型，并且你可能会在后续版本中遇到问题（根据设计，这些版本你无法跳过）。\n\n整个问题其实并不新鲜。早在人们开始谈论 SaaS 之前，就已经有大量资金投入到根据组织的特定需求定制\
  \ SAP 解决方案中。你对 SAP 进行的调整越多，维护它就越困难（也越昂贵！），出现的功能性意外就越多，并且每次新版本发布时面临失去向后兼容性的风险就越高。^(⁴⁷)\n\
  \n在 SaaS 模式下，这一点变得更加具有挑战性。你为“无忧”模式付出的代价是灵活性的丧失。\n\n如果你愿意将自己的数据模型调整为 SaaS 提供商的数据模型，那么你需要为以下挑战做好准备：\n\
  \n1.  **向后兼容性**\n\n    如果你被迫调整会计科目表，你将如何进行同比比较？\n\n    并且，在需要保留 SaaS 之前的数据期间，你是否能够（或愿意）让老旧且难以维护的本地财务系统保持运行？\n\
  \n2.  **SaaS 内部的兼容性**\n\n    一个组织可以调整以适应一个云提供商的数据模型——但如果涉及到两个提供商，比如分别用于销售和财务解决方案，该怎么办？如果它们对“收入”的定义不同呢？如果它们对“地址”的定义差异巨大呢？\n\
  \n    当然，你可以让各个职能流程彼此独立运行，许多组织正是这样做的。但这样做会面临不同数据世界之间不匹配的风险。\n\n**示例 1**\n\n这个真实案例发生在运输行业：\n\
  \n承运商需要为偏远地区考虑更高的运输成本。这将成为标准费率卡和大客户折扣定价流程的一部分。市场营销部门可能也想要使用这些信息。\n\n为了满足所有这些需求，你需要将全球划分成足够精细、明确且互不重叠的地理区域。而且，这个划分在所有职能部门之间必须保持一致！如果某个组织对其所有系统拥有完全控制权，它可以自行决定这样做。\n\
  \n但是，如果不同业务领域的 IT 解决方案由不同的 SaaS 提供商独立管理，那该怎么办呢？\n\n一些提供商可能只使用邮政编码，另一些则采用专有方法来进一步划分邮政编码区域，而第三类提供商可能使用城市和郊区名称。兼容性？毫无可能！\n\
  \n这确实可能是一个巨大的问题。但在日常工作中，你还会面临许多较小的问题：\n\n*   你的财务 SaaS 可能无法妥善处理催款流程，因为它无法识别出多张未付发票属于同一客户。\n\
  \n\n\n*   已提供的服务仍未开票，原因是第三方财务部门的看法与运营部门不同。\n*   职责分离（SoD）可能会失效，因为相关解决方案未能识别出执行两个互补角色的主体是同一方。\n\
  \n如今，由于这一切都发生在云端的某个地方，许多此类案例都未被察觉。而当问题浮出水面时，我们往往倾向于治疗症状，因为要跨越所有这些云孤岛进行根本原因分析非常困难（甚至不可能）。\n\
  \n当涉及分析领域时，情况也并未好转。分析人员将使用哪些数据结构？\n\n在预 IaaS 环境中，情况如何运作？如今，每当数据科学家遇到问题或对组织的数据模型有疑问时，他会/她会去找数据架构师并解决它。这甚至可能导致对当前数据模型提出变更请求。\n\
  \n而在 IaaS 环境中，这通常是一条单行道：IaaS 供应商会告知你数据模型。仅此而已。没有任何机会去审查该模型是否提供了所有细节，以便数据科学家可以在此基础之上开展所有工作。现状就是如此。\n\
  \n想象一下，如果你的分析业务也依赖 SaaS 供应商。你如何确保为特定模型定制的 AI 算法能与其他模型配合使用？请记住，你无法更改它们，因为它们是 SaaS\
  \ 产品的一部分。\n\n职能高管往往不理解不兼容数据模型的风险。他们甚至可能不知道什么是数据模型，在大多数情况下这没问题。但即使是 IT 专家，也往往倾向于相信云解决方案会专业地处理你所有的数据问题。\n\
  \n那么，你该如何解决这个问题呢？\n\n首先，你需要高管支持。这就是为什么你需要先找到真实案例，并与相关高管分享其业务影响。如果你得不到高管的全力支持，你后续所有的行动都可能徒劳无功。\n\
  \n一旦确保了组织的支持，你就需要解决治理问题：任何由你的服务供应商在云端管理的数据，都必须遵守你组织的数据治理规则。\n\n你需要了解云服务提供商的技术灵活性。大多数提供商提供的灵活性远低于其技术能力所能达到的水平。你应该促使他们与包括数据架构师在内的混合团队（而不仅仅是未来的业务用户和\
  \ IT 技术专家）协商解决方案。\n\n任何云项目都必须获得数据架构团队的批准。数据架构团队必须从一开始（即在需求收集和供应商选择阶段）就参与到这类项目中。\n\
  \n在此过程中，他们需要验证数据实体和属性的所有业务定义，以及 ERP 和 CRM 等基于云的业务应用所使用的分析模型和定义，是否符合组织的标准。数据办公室需要确保任何已识别的差距都得到解决，或被记录为一种让步。\n\
  \n但是，一个组织真的应该将自己的命运交到一群数据专家手中吗？数据架构师是否有可能叫停重大的战略举措？这倒未必。\n\n这里的关键是**透明度**！\n\n以下是我对适当数据治理架构的宏观提议——你甚至可以在数据架构之外的领域应用它：\n\
  \n*   任何举措，从一个小迭代到一个多年项目，只有在数据相关影响对所有人都清晰可见的情况下，才能获得批准。\n*   责任归属于数据架构团队。若该团队否决，原始发起人可以向数据执行委员会，并最终向组织的管理委员会提出申诉。\n\
  *   如果管理委员会权衡后认为优势大于不合规的成本，并决定接受负面影响，他们可以给出最终批准。\n*   所有这些都需要记录为**架构让步**。\n\n这种治理架构保留了原有的权力层级，但强制要求董事会做出审慎、信息充分的决策。\n\
  \n## 数据管理定理 #11\n\n有效的数据管理能够在所有管理层级促成审慎、信息充分的决策。\n\n### 黑箱问题的风险\n\n值得注意的是，规模较小的组织无力开发自己的\
  \ AI 基础。他们必须依赖公共提供的分析接口，就像他们已经开始依赖 SaaS 一样。\n\n然而，“作为黑箱的信息”及其背后未公开的逻辑带来了若干风险：\n\n\
  1.  **错误信息**  \n    你的主要解决方案供应商之一应用了错误的数据或逻辑，将会影响很大比例的用户。  \n    人们会相信这些信息，因为他们“以前在别处听说过”——尽管所有信息都指向同一个来源！\
  \  \n    如果政府滥用这种情况系统性地误导民众，那就变得真正危险了。\n\n2.  **不当使用**  \n    你可能高估了所提供信息的准确性。或者，你可能使用了错误的服务来获取你需要的信息。例如，你向路线规划服务询问一个组织的正确地址。该组织可能已经倒闭，但服务提供商并不知情——因为一个已破产组织的人没有任何理由去告知地址数据提供商其已关闭。\n\
  \n3.  **依赖性**  \n    IaaS 市场可能会形成寡头垄断。提供服务需要大量的数据以及维持数据更新的基础设施。没有多少组织能胜任此事。  \n\
  \    想想那些常见的候选者：\n    *   那些能吸引数据科学人才并付得起他们薪酬的公司\n    *   那些已经在提供底层 SaaS 解决方案的公司\n\
  \n\n\n### 合理使用 IaaS 的选项\n\n但什么才是好的应对之策？请考虑以下选项：\n\n1. **尽早考虑你的数据模型。**\n\n世界上有过太多这样的案例：某家云解决方案供应商的\
  \ CEO 与客户的 CFO 一起打高尔夫时，就敲定了选择该云解决方案的决定。^(⁴⁸)\n\n当然，这并不是 CFO 一时冲动做出的决定。相反，它基于双方组织提前共同完成的、大量细致的评估工作。当然，云供应商若非其解决方案足够出色，也不可能变得如此庞大且知名——这种假设可能有助于达成协议。\n\
  \n但是，对数据模型的分析是否包含在了那项评估之中呢？\n\n请记住，数据模型并非 IT 细节。它是你的业务模式形式化的关键组成部分。\n\n那么，你希望将哪些内容纳入决策文件呢？\n\
  \n我想到的是，对数据结构进行差距分析，随后列举几个技术上可行的选项，并确定迁移到其中任一选项所需付出的努力（加上风险）。\n\n这些备选方案可涵盖从直接采用供应商的模型，到将模型调整为当前（或理想）的组织模型。\n\
  \n同时，也应考虑在 SaaS 解决方案中采用供应商的模型，同时将所有分析部分保留在内部。\n\n2. **检查你的灵活性。**\n\n你可能需要抛弃现有的人力资源逻辑或会计科目表，才能转向\
  \ SaaS 和 IaaS。好吧，为什么不呢？\n\n请记住，SaaS 解决方案（包括其分析部分）在其他地方运行良好。它可能与你当前的逻辑不同，但不一定更差。\n\
  \n根据经验法则，你可以假设，在**并非你产品核心**的领域，采用第三方模型是可以接受的。\n\n你的关键差异化领域可能充满了关于你组织的独特知识。当然，你希望从技术上对其进行现代化改造（有些方法可以将大型机迁移到\
  \ SOA，同时不会放弃过去 20 年开发的宝贵逻辑）。但你几乎不会为了迁移到一个花哨的云解决方案而放弃你的竞争优势。\n\n但是，请关注那些支持性领域，那些为了让你的组织凭借其独特产品获得成功而必须正常运作的领域：云解决方案会将这些领域交到那些核心专业知识就在于此的人手中。这一举措能让你将全部精力集中在核心业务上。\n\
  \n3. **确保透明性。**\n\n对于任何公开提供的服务背后的逻辑，能够被知晓和可见，其重要性从未像今天这样突出。\n\n这对于数据网络服务尤其重要——无论是操作查询，还是复杂的分析。\n\
  \n换句话说，如果你不了解某个查询背后的逻辑，在将其用于商业目的之前，你应该提出大量问题。\n\n谢天谢地，全球分析社区是一个非常开放的社区，非常愿意分享甚至源代码（大部分可以在\
  \ GitHub 上轻松获取）。\n\n公有领域不再是什么坏事。其背后的危险会随着透明度而消失。此外，该社区通常足够庞大和活跃，能够发现问题、修复问题并填补漏洞。\n\
  \n4. **避免被供应商锁定。**\n\n无论你有多么喜欢某个特定的供应商（无论是 SaaS 提供商，还是像邓白氏这样的数据提供商），你都应该设计你的架构以保持技术上的独立性。\n\
  \n你可以预料到，比如，Oracle 会激烈抱怨你缺乏将 Oracle Analytics 与 Oracle 云解决方案一起使用的意愿——但没有任何技术理由让你屈服。\n\
  \n（顺便说一句，别让那些供应商告诉你，如果你强迫他们与其它云中的数据处理和数据源协作，你会面临延迟问题。如果长距离数据传输真的是个问题，那么在你与那个 SaaS\
  \ 提供商及其全球分布的数据中心首次合作时，你就应该已经遇到这个问题了。）\n\n总结：你最好确保自己能保持掌控。数据模型是你的，而不是 Oracle、Salesforce.com、Workday\
  \ 等供应商的。\n\n分析也是你的——解决方案提供商可能会为你提供技术平台和花哨的可视化工具，但你应该拥有逻辑和内容的所有权。\n\n## 区块链\n\n关于区块链及其带来的机遇，已经有很多论述。我不想在此重复这些内容。相反，我想分享一些你在实施规划过程中可能会遇到的一些想法。\n\
  \n### 唯一标识与区块链\n\n区块链似乎正在成为用于去中心化、防篡改记录交易和其他涉及多方信息的主要技术。任何类型的合同伙伴都可以将他们的合同信息添加到区块链中，并由成千上万个其他独立方进行签名。这些方无法确认内容是否准确，但他们的签名允许确定该记录是否已被更改。\n\
  \n好东西！\n\n但相关方如何确保该记录中使用的标识符的含义是明确的呢？如果甲方后来声称 `product 12345` 与乙方所假设的完全是两样东西呢？\n\
  \n一种方法是将所有这些信息也存储在区块链中。但这样做当然会产生高度冗余的信息。如果一个组织提供了一种带有数兆字节描述的产品，并且该产品销售了 100 万次，那么区块链就会急剧膨胀。\n\
  \n一个解决方案是创建一个独立的产品区块链，组织在其中将产品文档（包括随时间发生的所有变更）链接到唯一标识符，这样，任何未经授权的更改都无法在无迹可寻的情况下发生。\n\
  \n但是，如何在不再次需要一个集中管理的数据仓库的情况下，明确无误地识别项目呢？数字 `123456` 可能是组织 A、B、C 的序列号、发货号、订单号等等。为了变得明确无误，你必须添加组织标识符。但这个组织标识符从哪里来呢？来自另一个集中维护的仓库？这可能又不是一个普遍全面的仓库，因此不会包含地球上所有的组织。它可能是一个商业管理的仓库，因此依赖于某个有其自身利益、甚至可能倒闭的组织。\n\
  \n那么，什么样的方案才能被认为是至少足够中立且全球性的呢？\n\n我对这个问题的回答是，建议采用全球标准，正如本章前面所述。\n\n事实上，ISO 关于商品、包装、可重复使用容器以及其他一些实体的全球唯一标识概念，在这里也能帮助我们。没有中央权威机构或预设数量参与者的分布式逻辑，受益于那些无需所有参与者之间达成任何正式协议的全球标准。\n\
  \n\n\n## 虚假的安全感\n\n区块链确保对交易的任何追溯性修改都会变得可见。反过来说，如果区块链确认一切正常，那么你就是安全的。\n\n对吧？\n\n\
  嗯，从技术上讲……\n\n说实话，如果你理解相关算法并了解源代码，这确实是成立的。\n\n但请设身处地站在用户的角度想一想——无论是与未知合作伙伴（例如交易比特币）进行交易的个人用户，还是利用区块链保障业务交易安全的企业管理者。\n\
  \n这类用户会使用某种软件将条目添加到区块链中——极有可能的是，用户日常使用的正常软件会在后台默默地完成这一步骤，作为一个附加操作。这一步甚至可能对用户完全透明，用户最多只能看到一条弹窗消息，告知“交易已获得安全保障，无法再被更改”。\n\
  \n然而，这个软件可能是一个恶意软件，或者更可能的是，它是一个被他人入侵的合法软件。你觉得最终用户能分辨出区别吗？\n\n“被入侵”并不一定意味着该软件会一直持续作恶。相反，它可能运行得完全符合预期，除非你与某个特定业务伙伴进行的少数交易。它可能会向区块链创建语法正确但内容错误的条目，每个人都能看到这个偏差，除非……是的，除非恶意软件更进一步，告知用户一切正常。除此之外，用户又如何能察觉呢？\n\
  \n你是否曾亲自（而非通过某个软件）核查过区块链的内容？你信任那个软件吗？它来自哪里？\n\n好吧，你说关键在于对软件进行认证？是的，那的确是重要的一环。但由谁来认证呢？请记住，并没有一个中心化的、中立的权威机构存在。你对证书颁发机构的了解是否足以让你信任该机构？\n\
  \n此外，如果你的软件告诉你它是经过认证的，你又如何知道这是真的呢？你能信任你的软件吗？\n\n这些问题表明，采用区块链的组织需要做的不仅仅是定义业务逻辑并在软件中实现该逻辑（甚至可能仅仅是使用已经内置了所有功能的软件）。\n\
  \n但除此之外，你还应该做什么呢？\n\n首先，围绕区块链的技术知识，组织不应全盘外包。你需要真正理解其运作原理的专家，而不是盲目依赖“黑盒”式的区块链服务。\n\
  \n其次，这些专家需要能够检查源代码，理想情况下还应与信息安全专家一起协作。\n\n第三，不同的专家需要独立审视同一个解决方案。否则，你组织中唯一的区块链大师可能本身就是团伙的一员。\n\
  \n最后，软件应当监控软件。如果你使用现成的软件、SaaS（软件即服务）或公共领域的网络服务，你可能希望添加自己的程序来检查可疑结果。\n\n这是否小题大做了？\n\
  \n请记住，仅凭常识来发现这个领域中的篡改行为正变得越来越困难。这使得该领域对犯罪分子极具吸引力。他们不会笨拙地让整个系统某天突然崩溃——相反，他们会试图让自己的入侵行为不被察觉。\n\
  \n这种情况与第一代银行软件有些相似，当时单个程序员就能添加逻辑，将微量金额转入自己的银行账户。他们能借此持续多年，变得富有，而无人察觉任何资金缺失。\n\n\
  因此，在进入一个新技术的新时代时，从一开始就预见到此类行为，是一个明智之举。\n\n脚注 1 2 3 4 5 6\n\n"
- "# 19. 数据处理\n\n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig1_HTML.jpg](img/499948_1_En_19_Fig1_HTML.jpg)\n\
  \n图 19-1\n\n业务中的数据处理是严肃的\n\n## 虚拟单一事实来源\n\n### VSSoT 是什么样的？\n\n你是否将你组织的数据湖视为你的单一事实来源？或者至少是目标？\n\
  \n你不应该这样认为。\n\n“单一事实来源”**不应**被视为彩虹尽头装满黄金数据的那个桶。\n\n相反，数据始终处于一个旅程中，从其创建或进入组织开始，历经修改，直至消耗和废弃。\n\
  \n数据可能被收集、结构化、转换、合并或联接。每一个新实例，无论是表、数据库还是视图，都应当成为你的虚拟单一事实来源（VSSoT）的一部分。\n\n请记住，创建这样一个新实例并不会使它的任何前身失效。相同的数据可以在不同的表和视图中找到，而选择最合适的来源并不总是件简单的事。\n\
  \n与其他资产不同，数据不会因消耗而减少，因此它可以被反复修改，并以不同的形式和组合使用，而不会减损。修改甚至不是一个线性的过程。想想外联接这样的操作，其中两个表共同创建一个新表。\n\
  \n此外，同一数据的不同演化阶段可以共存。这可能有帮助，但也伴随着风险：消费者可能意外地使用了错误的演化阶段，例如，使用了经过某些记录过滤或聚合后的数据版本，而其结果却用于另一个领域的其他目的。\n\
  \n一个典型案例：“我们一直使用 A 部门的表 X 进行分析。没人告诉我们，有一天 A 部门改变了他们创建表 X 的逻辑。”\n\n这就是为什么在谈论单一事实来源时，需要涵盖**整个数据谱系**：\n\
  \n*   数据的创建或获取需要被明确无误地定义（来源、规则、时间戳）。\n*   数据从一个存储库或阶段到另一个存储库或阶段的旅程必须被明确定义。这包括时间方面的考量，以避免因不同数据元素修改速度不同而导致的不一致。\n\
  *   只要输出结果可供多个消费者使用，对数据的任何操作都需要以明确定义的方式进行。\n*   数据的时效性也需要被明确定义：从何时起数据被视为“过时”？\n\n\
  如果你将图 19-2 扩展，以匹配你组织的数据谱系，你就可以想象你的 VSSoT 的复杂性。所有这些在你的组织中被记录到了什么程度？\n\n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig2_HTML.jpg](img/499948_1_En_19_Fig2_HTML.jpg)\n\
  \n图 19-2\n\n复杂的单一事实来源\n\n\n\n## 如何塑造 VSSoT？\n\n迈向虚拟单一事实来源的第一步是进行清点盘点。\n\n-   绘制数据流图。\n\
  -   增加时间维度（顺序；实时与滞后；单条处理与批量处理）。\n-   理解每次数据转换的目的。\n\n其结果将是一个“虚拟数据源”。在初始阶段，你可以将其转化为你的“虚拟单一事实来源”，然后在第二阶段开始对其进行优化。\n\
  \n这种优化包括评估哪些数据应该集中化，同时也涉及数据流的同步。然而，其目标**并非**构建*一个单一的数据库*！\n\n即使是数据复制也可以与单一事实来源原则兼容——前提是所有“副本”都作为单一来源的一部分进行管理（并进行同步变更）。\n\
  \n例如，数据存储库的物理结构需要支持数据的消费。如果同一份数据要用于完全不同用途，可能需要将其复制到物理上不同的存储库中，例如用于实时操作目的的内存数据库或高度反规范化的表结构，而用于大规模并行分析处理的\
  \ Hadoop 集群或 Spark 弹性分布式数据集（`RDD`）。\n\n边缘计算是数据合理复制的另一个例子——需要以适当且可控的方式进行：如果确保了一致性，就可以将数据移动到边缘——那里靠近客户端，但仍然属于`VSSoT`的一部分！\n\
  \n整个数据供应链需要被完整记录下来，包括业务所有权。理想情况下，每次数据转换步骤都应分配给你现有的某个数据域，这样你就可以复用你现有的、基于域的业务所有权结构及其相关流程。\n\
  \n但不要期望这一切是轻而易举的任务。不同的结构以及可能多种多样的物理数据模型，使得集成不同的数据源和数据转换阶段成为一项具有挑战性的工作。\n\n并且请不要将其视为一次性的活动。新的需求会带来新的转换，这个充满活力的生态系统需要主动管理。\n\
  \n有充分理由表明，在 2018 年的一次会议上，Gartner 集团数据管理策略研究总监 Rick Greenwald 曾预测：“数据集成将成为未来最耗时的任务。”\n\
  \n## 单一逻辑来源\n\n### 面向服务架构（`SOA`）\n\n好的，你已经完全掌控了所有数据。虽然数据是本地维护的，但你的数据有一个集中的（逻辑上的）位置，从而为你的数据创建了虚拟单一事实来源……\n\
  \n……但你的逻辑呢？\n\n你是将逻辑的实现留给客户端应用程序吗？你是否允许它们从单一事实来源获取完美无歧义的数据，然后让它们彼此独立地实现逻辑？\n\n这种方法很容易导致与独立在不同位置维护数据相同的问题。\n\
  \n我偏爱的解决方案基于经典的面向服务架构（`SOA`）。\n\n你可能已经了解到 `SOA` 概念带来的一些优势，包括通过明确定义的请求/响应接口与小型、独立的开发团队合作的可能性，或者支持伴随这种独立性而来的敏捷方法。单一逻辑来源是该架构另一个常常被低估的优势：不仅每个人都使用相同的原始数据——不，任何应用于数据的操作也可以被标准化。\n\
  \n由于需要实现逻辑的人员更少，你降低了不同解读和实现的风险。测试也变得更简单，因为你无需详细测试多个应用程序。\n\n### 分布式逻辑——章鱼原则\n\n\
  `SOA` 通常需要直接实时访问集中提供的 Web 服务，如图 19-3 所示。\n\n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig3_HTML.png](img/499948_1_En_19_Fig3_HTML.png)\n\
  \n图 19-3\n\nWeb 服务原则\n\n但如果这无法实现，你该怎么办？\n\n想想那些你期望使用你 Web 服务的客户或业务合作伙伴：\n\n-   他们可能不愿承担数据连接问题会中断其供应链的风险，因为其软件应用程序的一部分位于中断的另一端。\n\
  -   他们可能担心依赖不受自己控制、运行在另一组织服务器上的软件。（毕竟，你不是 Salesforce 或 SAP，而是一个“普通的”业务合作伙伴。）\n\n\
  如果外部合作伙伴有这种反应，你会退回到旧的工作方式吗？你会再次向他们发送你的数据（包括定期更新），并请求他们模仿你在内部植入的逻辑吗？换句话说，回到石器时代的工作方式？\n\
  \n对此的解决方案**不是**再次将原始数据文件发送给客户端应用程序！\n\n相反，你可以让 Web 服务靠近客户端，如图 19-4 右侧所示。\n\n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig4_HTML.png](img/499948_1_En_19_Fig4_HTML.png)\n\
  \n图 19-4\n\n本地 Web 服务\n\n在实践中，你会向你的业务合作伙伴或客户提供一个作为黑盒运行的软件片段，精确执行你内部软件所做的操作。理想情况下，它将基于相同的源代码。\n\
  \n第二步，你需要确保数据和软件的更新都由该服务控制，并且在后台执行。\n\n结果就是，整个父服务被镜像到子服务，如图 19-5 所示。\n\n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig5_HTML.jpg](img/499948_1_En_19_Fig5_HTML.jpg)\n\
  \n图 19-5\n\n向本地 Web 服务复制数据\n\n这种方法降低了连接问题或你自身基础设施故障的风险。最坏的情况是更新控制器不可用，导致本地 Web 服务基于略微过时的数据运行。\n\
  \n现在想象一下，这种机制被应用于多个本地 Web 服务服务器，运行在各个业务合作伙伴站点：这就是**章鱼**，它的触手象征着将数据*和*逻辑带到客户端附近的能力（图\
  \ 19-6）。\n\n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig6_HTML.jpg](img/499948_1_En_19_Fig6_HTML.jpg)\n\
  \n图 19-6\n\n面向服务架构章鱼\n\n这是“章鱼原则”最关键的一个方面：章鱼代表你的虚拟单一事实来源（`VSSoT`），其触手伸入边缘解决方案。不再由边缘应用程序负责保持其数据和逻辑的最新状态。实际上，整个虚拟的\
  \ `SSoT` 对这些应用程序来说可以（并且应该）是完全不透明的。\n\n边缘应用程序甚至无需关心它调用的是本地还是远程的 Web 服务实例。接口是相同的，差异仅限于\
  \ `IP 地址` 和端口号。\n\n边缘存储库可能仅限于中央 `SSoT` 的子集，无论是属性还是记录。例如，在某个特定国家运行的产品订购服务，无需复制所有其他国家的价格列表。\n\
  \n但章鱼本身需要确保所有被选中复制到边缘存储库的数据保持最新，并且参照完整性得到保证。\n\n\n\n同样，SSoT（单一事实来源）的注册表（即整个地图）也需要保持最新。它的创建并非一次性活动，而需要成为每个正在寻找正确信息的利益相关者永久更新的数据源。\n\
  \n时间维度也起着重要作用：所有数据都必须及时提供给任何客户。延迟通常会导致两个相互依赖的数据源之间出现不一致。\n\n然而，数据也不需要提前到位。在某些情况下，延迟数据流可能会节省费用。\n\
  \n为了找到向客户端提供数据的最合适方式，将错误或延迟数据的风险纳入您的商业案例是很有帮助的。有时这可能会变得极其昂贵，例如，客户根据过时的价目表下单，或者因关键数据尚未复制到客户站点而导致客户供应链中断。在其他情况下，这并不重要，例如，当数据用于粗略指示性能水平，而少量过时信息不会实质性地影响结果时。\n\
  \n在略有过时的信息整体影响有限的情况下，您甚至可以计划定期离线操作，进一步减少对数据连接和更新的依赖。这同样适用于不频繁变化的参考数据。\n\n最后，一个精密的更新机制也会将`logic`更新到任何本地实例。就像您电脑上的大多数第三方软件一样，本地实例会定期检查其是否仍为最新。每当有新版本可用时，本地客户端可以下载其后续版本，并使用更新后的逻辑重新启动。\n\
  \n如今人人都在谈论边缘计算。您可以将八爪鱼原则视为边缘计算的推动者，并产生可复制的结果。\n\n## 配置与标准化\n\n同一表达有多种不同的含义显然不是个好主意。为满足组织内不同业务单元或地理单元的不同需求而建立多个逻辑数据模型，也会造成同样的问题。\n\
  \n但标准化总是答案吗？\n\n在某些情况下，存在采用不同逻辑或不同定义的充分理由。\n\n这正是我推荐采用**配置**的地方：您允许在同一数据模型下存在不同的含义或不同的逻辑。\n\
  \n让我们看两个涵盖常用数据领域的示例。\n\n### 示例 1\n\n**产品：**\n\n设想一个全球运营的组织。根据法规要求，其在某些市场需要不同的产品规格。\n\
  \n这些差异不应被视为例外，而应建模为同一产品在不同市场中的变体。\n\n### 示例 2\n\n**设施：**\n\n任何大公司都必须识别和区分不同类型的设施，无论是办公设施、仓库还是建筑工地。\n\
  \n然而，这些不同类型的设施都不应孤立看待，因为许多属性与所有设施都相关。\n\n这就是为什么所有设施都按照单一逻辑进行识别会带来巨大机遇。\n\n不过，您需要添加设施类型等属性，以便不同的应用程序可以对同一数据集拥有各自的特定视图。\n\
  \n这一切难道不会使数据模型更复杂吗？是的，会！但请记住，数据模型旨在反映业务模型。如果这样的数据模型过于复杂，那么您的业务模型也可能过于复杂。\n\n所以，是的，为什么不要求标准化呢？但请从业务模型开始，而不是数据模型。如果数据模型表明需要采取行动，您可以假设您的业务模型过于复杂，并且您应该从那里入手。\n\
  \n然而，如果组织认为业务复杂程度是合适的，那么您就不能期望它能被一个更简单的数据模型所反映。\n\n数据模型可用于制定协调路线图，同时考虑当前业务需求和技术向后兼容性要求。即使所有系统中的业务逻辑都已完全更新，您仍可能因历史数据而陷入复杂性。并且，您可能会面临逐年数据对比的挑战。但这是变革不可避免的代价。\n\
  \n## “生效日期”概念\n\n“生效日期”将单个属性值替换为该属性的历史值流。这些值中的每一个都有一个“生效日期”和一个“到期日期”。一些附加规则：\n\n\
  -   每当一个值需要更改时，旧值在其有效期的最后一天（或小时、分钟等）到期，并立即在其后创建一个带有“生效日期”的新值（即，时间戳不可能落在到期日期和生效日期之间）。\n\
  \n-   如果一个值不再有效，则不应删除。相反，应保留该值，并为其分配一个“到期日期”，指明其最后一个有效日。\n\n-   如果预计不会过期，则链中最新的值需要将其“到期日期”设置为代表“永久”的值。\n\
  \n对一致性的要求需要所有更改在完全同步的情况下进行应用。如果没有“生效日期”概念，一个邮政编码区域可能被分配给一个尚不存在（或不再存在）的销售区域。维护从独立的数据字段开始，然后是依赖于它们的字段。\n\
  \n但我们为什么需要生效日期概念？并非所有数据更改都能在午夜的一秒内完成应用。“生效日期”概念通过允许修改提前配置来解决此问题。\n\n如果与正确实现的服务导向架构结合使用，它使得在任何时间点应用一致的更改成为可能。所有新值在同一秒内生效，一致性得到保证。\n\
  \n可以通过传递目标值、“生效日期”和“到期日期”的网络服务进行维护。网络服务本身执行技术工作，即进行必要的验证检查，然后将新值插入现有链中。这通常包括更改当前属性值的“生效日期”和/或“到期日期”。\n\
  \n这种方法甚至允许处理范围（例如，邮政编码或数字范围）：如果某个范围的一部分需要更改，我们可以让网络服务自行处理。它可以将整个范围拆分为子范围之下的部分（该部分保持不变）、子范围本身（即将更改的部分）以及子范围之上的部分（该部分也保持不变）。虽然上下范围继承了原始链序列，但中间链会按照前面描述的方式插入新值。\n\
  \n使用可以通过两种方式：要么客户端请求某个特定时刻的快照（默认时刻通常是“现在”），要么请求整个链，并可选择提供开始日期和结束日期（如果两者都未提供，则返回整个链）。\n\
  \n这也允许重新建立过去任何时间点的状态，跨越所有数据源和数据存储库。\n\n在分析中，“生效日期”概念允许在任何给定时间点获取主数据快照。\n\n## 让数据国际化\n\
  \n\n\n### 巴比伦效应\n\n除非你为一家严格的本国机构工作，否则你将不得不处理多种语言。这一挑战适用于供应商、当局和客户。\n\n尤其是客户，不愿意接受组织定义的标准。在与你的组织沟通时，他们总是坚持使用自己的语言作为沟通语言。在大多数情况下，竞争对手在这方面并不存在问题。\n\
  \n当然，你可以简单地存储所有版本并按原样处理。但是，你在阿拉巴马州的仓库员工或孟加拉国的生产人员可能无法理解某个非洲国家的本地表达方式。\n\n没有简单的解决方案。始终将所有内容从源语言翻译成所有其他语言需要付出巨大的努力。此外，你很快就会遇到歧义问题，因为从语言\
  \ A 翻译成语言 B 有多种有效的方式。\n\n### 别名术语\n\n在将本地表达方式翻译成你的内部版本并存储在主数据中之后，你需要能够每当客户在线输入相同的表达方式时，将其与之进行比较。只有当输入的信息与原始术语的翻译方式完全一致时，这才有可能实现。\n\
  \n第一个解决方案是定义一种主导语言，并存储该语言中的所有\"主术语\"。所有本地版本将被添加为\"别名术语\"。\n\n然后可以识别客户使用的任何版本，并将其翻译为\"\
  主术语\"。该版本将供你的组织内所有不了解本地表达方式的员工使用。\n\n例如，你可能希望使用官方英文翻译来存储全球所有城市名称。你会将`Wien`翻译成`Vienna`，这将成为你的\"\
  主名称\"。每当奥地利客户输入`Wien`时，查找操作会返回`Vienna`作为你的内部\"主名称\"。\n\n其他示例包括产品名称、法律用语或国家名称。\n\n\
  ### 音译\n\n但是你将如何处理不同的字母表？\n\n虽然全球主要的六种字母表（拉丁字母、中文汉字、天城文、阿拉伯字母、西里尔字母、达罗毗荼文）覆盖了全球\
  \ 90%的人口，但如果你的组织具有真正的全球影响力，你需要支持前 20 种字母表。而且这些字母表中的大多数都有需要考虑的各种变体。\n\n这便是音译登场的地方。它定义了从一个字母表到另一个字母表的逐字符转换。当目标字母表是拉丁字母时，这种方法也被称为`罗马化`。\n\
  \n除非你通过向目标字符添加符号（附加符号）来扩展音译，否则返回原始单词的路径可能会产生歧义——但这甚至可能是源语言拼写中固有的问题，这意味着（IT 中使用的）字符串比较无论如何都不安全。因此，你应始终存储音译后的版本，并且在将其与提供的单词进行比较之前，也应对后者进行音译。\n\
  \n这种方法显然需要标准化的音译方式。你可能会立即想到 ISO 标准，这是正确的方向。\n\n然而，即便是 ISO 标准有时也存在歧义，有时你需要知道一个提供的单词表示哪种语言，才能选择合适的\
  \ ISO 标准。\n\n这就是为什么每个组织都需要制定自己的内部标准，以获得可重现的结果。\n\n对自动化音译的一个挑战是，它难以处理那些不是基于单个字符的语言。最显著的例子是表意文字，如中文（每个符号代表一个单词）和音节文字，如日语假名（每个符号代表一个音节）。\n\
  \n在某些字母表中，一个字符的音译取决于它后面的字符——这使得实时音译几乎不可能，例如，当有人在数据录入屏幕上输入文本时。\n\n请注意，即使是 ISO 也为俄语西里尔字母或日语文本的`罗马化`提供了不同的标准。在每种情况下，你都需要一个内部标准来执行音译，这样每个单词都可以仅以一种拉丁语版本存储。然后可以立即将输入该单词的每个数据进行罗马化，并与拉丁语参考版本进行比较以找出可能的匹配项。\n\
  \n总而言之，这个话题很复杂。但是，如果你的组织在众多不同国家开展业务，并且涉及到跨境方面，你将不得不解决这个问题。谢天谢地，有解决方案提供商可以协助你做到这一点。\n\
  \n### 特定国家的语言\n\n在为与来自不同国家的客户互动做准备的过程中，请避免过度简化的诱惑，不要仅仅在你准备的语言中选择一个假设的最接近的匹配项。\n\n\
  人们通常更喜欢说英语，而不是说一种与他们自己的语言接近的语言——这通常源于不喜欢的邻国。这里有两个典型的例子：\n\n- 乌克兰人通常懂俄语，但他们不喜欢被迫用俄语交流（而且，顺便提一下，乌克兰西里尔字母与俄语西里尔字母不同！）。\n\
  \n- 法语在法国、比利时、加拿大和瑞士法语区之间存在差异。在避免使用英语外来词方面，其中一些国家比其他更加严格。\n\n这就是为什么你的国际化设置至少应始终基于语言和国家的组合。\n\
  \n幸运的是，许多组织都面临过类似的挑战，因此已经形成了一套事实上的规则和标准，并且有相应的公共网络服务可用。\n\n无论你决定选择哪种来源，你都应将其作为一项正式规则，以便你的组织的互联网（和内联网）呈现、处理算法和存储都能保持一致。\n\
  \n\n\n\n## 数据债务管理\n\n期望所有项目始终追求“一次就做对”，这不过是一种错觉。事实上，在许多情况下，从临时解决方案入手有其充分的理由，例如，当需要快速修补安全漏洞时。\n\
  \n在这种情况下，你是否要放弃对基本数据标准的合规性要求？\n\n如果处理得当，则不必放弃——至少从长远来看不必。\n\n数据债务管理背后的理念是：只在时间维度上做出妥协。\n\
  \n具体来说，你应该坚持在所有情况下都要求数据审批，包括那些“紧急”情况。反之，你可以规定，如果提案本身已包含在指定截止日期前（通常是第二阶段）修复不合规问题的承诺（以及资金和资源！），那么将授予“临时批准”。\n\
  \n或许没什么理由将这种通用方法仅应用于数据相关的合规性。它应该是一种避免长期依赖临时解决方案的通用方法。（另见第 8 章“技术债务处理”一节）\n\n采用敏捷方法的组织对此概念不会陌生。然而，经验表明，恰恰是这些组织在跟进架构债务、并按照约定时间表强制弥补合规差距方面，最不严格。\n\
  \n在此领域的宽容态度，将不可避免地导致债务的迅速累积！\n\n以下是一个可以规范化你的债务管理流程的可行方案：\n\n1.  **设立架构评审委员会。**\n\
  \n   设立一个成员明确的架构评审委员会，覆盖所有架构学科：\n   * 技术架构\n   * 数据架构\n   * 业务架构\n   * 解决方案架构\n\n\
  \   请注意，虽然解决方案架构的职责可能由不同团队分担，但此机构需拥有最终决定权。\n\n2.  **引入强制性评审流程。**\n\n   有效的债务管理需要一个架构评审流程。^(⁴⁹)\n\
  \n   你不仅需要为业务转型项目设置这样的流程。它需要覆盖从组织重大变革项目到日常运营的所有内容，并且应该考虑到架构环境的变化可能使先前合规的解决方案变得无效。\n\
  \n   首先，该流程应描述所有触发事件（即启动该流程的事件）。最常见的触发事件当然是提交项目申请，但相关澄清请求或对已批准项目的变更请求也应涵盖在内。\n\n\
  \   应包含必要信息的精确列表，最好采用核对清单的形式。记住，尽量保持列表精简，避免不必要的官僚负担。必填字段包括建议的完成截止日期以及负责部门。\n\n \
  \  评审流程的主要任务是描述如何处理发现的架构差距。首先，流程需要包含接受临时解决方案的标准，例如，当前违反公共法规或导致重大收入损失的情况。\n\n   与所有流程一样，责任必须明确。谁可以批准、否决或推翻先前的决定？他们的（不）批准标准是什么？升级路径是什么？\n\
  \n3.  **增加“架构债务”流程。**\n\n   在获得企业评审委员会批准豁免后，系统性的跟进是不可或缺的。你应该将其纳入一个描述清晰的流程中。\n\n\
  \   首先，该流程需要确保所有（已批准或已发现的）与架构标准的偏差都得到记录。它应基于明确的标识逻辑，为每个单独的豁免分配唯一标识符。并且，每个豁免都必须记录批准的“到期日期”。\n\
  \n   该流程的主要部分是描述对所有例外情况（从批准到结案）的主动跟进流程。\n\n   最后，该流程应明确所有必要活动的责任。数据办公室需要在所有数据架构事项中扮演主要角色。\n\
  \n4.  **确保完全透明。**\n\n   架构豁免不应在闭门状态下处理。每个人都应了解每个项目、流程或解决方案的合规状态。\n\n   这并不是要让员工受技术细节的困扰。相反，你应该考虑定义良好的度量指标，使架构合规水平以及对批准截止日期的遵守程度都能通过定期发布的\
  \ KPI（关键绩效指标）体现出来。\n\n   所需的可见性应通过持续的沟通来实现。此外，通用培训应使所有相关人员充分了解流程，以便能够遵循它。\n\n##\
  \ 敏捷与数据\n\n### 坚实的基石——为什么？\n\n处理数据时，应该采用敏捷方法还是瀑布方法？\n\n恐怕这可能是个错误的问题……\n\n我们有充分的理由避免在此处做二选一的决定。\n\
  \n每当你需要决定项目方法时，或许可以问：哪些内容可以轻松地以敏捷方式更改，而哪些内容更适合进行仔细的准备和精心的规划？\n\n乍一看，敏捷方法是可行的，因为它避免了瀑布思维带来的许多问题，特别是孤立的职责设置：即使你发现规范不合理，也必须按规范实施。没有人会因为你按规范实施而责备你，但如果你出于最充分的理由偏离规范，一旦出现问题，你就要承担风险。\n\
  \n此外，敏捷方法鼓励组织在必要时改变方向。这对于避免伦敦商学院所说的“承诺升级”至关重要：你明知某件事是错的，却还在继续做下去。\n\n但是，考虑到需要快速响应不断变化的环境，耗时费力的前期工作真的如此重要吗？还是说，总是凭直觉行事更明智？对于你在可预见的未来可能被逻辑束缚的数据架构决策，是否应该以敏捷方式做出？\n\
  \n爱因斯坦曾说过：“如果给我一小时拯救世界，我会花五十五分钟定义问题。” 他说的不是 15 分钟或 30 分钟……\n\n爱因斯坦这样说是基于充分的理由，而这些理由至今仍然有效。\n\
  \n以下是支持基于规划的结构化基础的三点有力理由：\n\n**a) 它能让你在长期保持敏捷。**\n**b) 临时决策会产生相互依赖关系。**\n**c) 快速修复可能治标不治本。**\n\
  \n如果你为意外情况做好准备，那么当情况发生时，你就能更迅速地做出反应。举两个例子：\n\n*   即使是最敏捷的方法，也无法让你快速更改跨多个应用程序和界面的数据库模式。而涉及与供应商和客户进行\
  \ EDI（电子数据交换）时，以敏捷方式更改消息格式尤其复杂。\n*   如果恢复并未纳入最初的考虑范围，那么缺失的数据就无法恢复。\n\n这是否意味着敏捷和规划相互矛盾？\n\
  \n不。敏捷和可持续性是你必须保持平衡的两个重要目标。\n\n一个很好的例子是技术债务的敏捷概念，它允许你快速推进，同时确保不合规问题不会被遗忘。作为适当数据处理流程的一部分（见第\
  \ 8 章“项目数据审查流程”一节），它为你提供了一个平衡快速实施需求与长期视角的工具。\n\n\n\n### 夯实基础——如何做到？\n\n要想长期保持敏捷，你需要落实以下要素（本书已对其中大部分内容进行过讨论）：\n\
  \n- 应用程序能在几分钟内连接的网络服务，理想情况下通过主动管理的企业服务总线实现。\n- 关于信息存储位置的文档化知识。\n- 结构化的变更流程（知道该向谁请示）。\n\
  - 企业级术语表，消除对特定项目术语表的需要。\n- 清晰的数据指南，需在任何活动开始前进行传达。\n- 便于 IT 实施的企业数据模型——他们能直接从业务数据逻辑中推导出数据库模式。\n\
  - 自我维持的六西格玛文化，让员工主动选择使用六西格玛工具（如现场走访、5 个为什么分析法、鱼骨图）来发现根本原因（敏捷不等于“治标不治本”！）。\n\n所有这些方面都必须纳入你的数据治理范畴，因为组织中大多数人会本能地更倾向于追求速效，而非这种可持续的方法。\n\
  \n## 从“快乐路径”开始？\n\n### 什么决定了项目的成败？\n\n无论你采用敏捷模式还是瀑布模式，都希望尽快完成项目。这种愿望本身没有错。毕竟，完成得越早，收益见效也越快。\n\
  \n但你愿意为此付出什么代价？\n\n常见做法是追求 MVP（“最小可行产品”）。然而，除了大家公认 MVP 是指“在生产环境中能发挥作用的最小范围”之外，人们对它的具体内涵并没有统一的标准。\n\
  \n不幸的是，一种普遍的理解是将 MVP 视为仅覆盖“快乐路径”的解决方案。换言之，它只有在所有规则都被遵守时才能良好运行。\n\n持这种观点的人认为，我们应首先专注于“快乐路径”。一旦该路径就绪，再考虑如何处理异常情况。\n\
  \n这种论调的背后通常不是什么深奥的效率最大化理论或经过深思熟虑的投资方式，而仅仅是因为项目时间压力。\n\n根据我对数百个流程的经验，我提出了**80/5 法则**：如果你想覆盖\
  \ 100% 的情况，需要投入 80% 的成本去处理那 5% 偏离“快乐路径”的例外情况。（具体数值未必精确到 80% 或 5%，但量级适用于大多数情况。）\n\
  \n第二点观察是：纠正这些偏差产生了企业成本的大头——要么是这些情况下为了最终达成目标而付出的更高直接成本，要么是因客户满意度下降和声誉受损而带来的间接成本。\n\
  \n这就是为什么“MVP = 快乐路径”的等式缺乏良好的商业理由。\n\n但你需要 100% 的覆盖率吗？可能不需要。我之前提到过著名的 80/20 法则：用\
  \ 20% 的精力覆盖最有益的那 80% 功能，比花五倍的成本去覆盖全部业务需求更经济。\n\n同样，在看待可能偏离“快乐路径”的情况时，你可能花费覆盖 4.999\
  \ 个百分点一半的成本，就能覆盖 5 个百分点中的 4.99 个百分点。为了这么小的增量花这么多钱，实在不值得！\n\n再次强调，不要纠结于精确的数字。而是要弄清楚某个问题的*业务影响*是否值得投入成本去防止其发生。\n\
  \n### 成功的三个维度\n\n最终，如果你想找到最合适的解决方案，就需要基于事实和数据来确定项目范围，而不是凭个人感觉（“我的经验告诉我……”）或受误导的奖励机制（“……按时交付才是关键……”）。\n\
  \n我们在第 16 章讨论过组织内部的目标冲突。项目经理和产品负责人也面临着类似的困境。\n\n任何项目都必须在**成本**（“控制在预算内”）、**速度**（“按时交付”）和**质量**（“满足所有需求”）之间进行优化。\n\
  \n项目经理将如何平衡这些相互矛盾的要求呢？毕竟，创建恰当的加权目标函数这种学术方法既不直接，也无法为项目经理提供可执行的计划。\n\n相反，项目经理会为企业主准备一份提案，希望他们认为该提案已足够平衡。这是一种合理的做法。\n\
  \n但如果项目进行中出了问题怎么办？即使是敏捷方法也可能遇到严重问题，例如，选定的技术解决方案不够完善，或者花了很长时间才找到软件错误。\n\n这类情况需要对三个维度进行重新审视：我们是增加预算，允许更多时间，还是接受质量降低（即在业务需求上妥协）？无论如何，项目经理都会感到不悦——没有人喜欢向指导委员会汇报这种事，即使有绝佳的借口。\n\
  \n那么，项目经理如何才能避免承认失败呢？\n\n- **预算？** 在成熟的组织中，非正式地增加开支额度是很困难的。出于谨慎考虑，可能会准备一些备用资金，但选择通常有限。\n\
  - **时间？** 一旦进度表达成一致并公布，就不能再单方面更改了。这同样适用于敏捷和瀑布模式，即使前者允许将截止日期作为方法论的一部分进行推移。\n- **范围？**\
  \ 未经业务方同意，已达成共识的功能不能从清单中移除（或移至产品待办列表）。非功能性需求（如响应时间或可用性）也是如此。\n- **但等等！** 也许产品可以*在表面之下*进行简化。架构合规性可以被牺牲。例如，信息可以硬编码而不是可配置。新软件可以作为单体模块开发，而不是基于微服务和企服务总线创建模块化解决方案。所有这些都只会给未来的开发带来麻烦……\n\
  \n无论这是项目经理显性还是隐性的想法，都反映了众多项目中的现实。项目经理会首先在不可见的领域以及他/她不受奖励的目标上做出妥协。\n\n这就是为什么首席数据官最希望避免这种情况。在所有架构学科中，数据架构在不被遵守时面临最严重的后果，尤其是在多个项目中形成这种常规模式时。\n\
  \n但你会如何处理这个问题呢？让我提出三个行动领域：\n\n1.  **建立意识。**\n\n没有任何项目是孤立存在的。为了让人们理解项目对组织其他部分的影响，你可以讲述“项目的\
  \ 3+1 个维度”：你不仅需要考虑项目特有的三个参数——**成本**、**时间**和**范围**，还需要考虑企业参数——**架构**。架构合规性越低，对组织其他部分的影响就越大。\n\
  \n2.  **确保架构的参与。**\n\n必须强制要求架构师参与项目的每个阶段或每次迭代（Scrum）。\n\n\n\n在所有计划中，组织需要主动管理其技术债务。跟进数据债务的责任由数据办公室承担。\n\
  \n如果组织采用敏捷方式工作，产品待办事项列表必须包含一个架构待办事项列表。\n\n3. **展示财务影响。**\n\n仅仅基于“秩序原则”或任何其他有效但抽象的理由来要求架构合规性是不明智的。\n\
  \n相反，你应该将视角从孤立项目提升到其对整个组织的影响（股东价值原则）。你可以通过预测架构不合规的影响并为其附加价格标签来做到这一点。\n\n在此，你绝对应该考虑**复杂性成本**，特别是通过说明不断增加的架构违规数量对组织未来业务变更的影响：\n\
  *   成本会上升，因为许多领域必须同时进行评估、调整和测试。\n*   上市时间会增加，因为组织可能没有足够的专家来并行处理所有必要的变更。这也可能需要额外的接口变通方案。\n\
  *   错误风险增加，因为相同的新逻辑必须在大量领域中正确实现。\n\n如果你考虑具体的用例，你会意识到复杂性不仅会让日常工作变得困难，它还会阻碍创新，而创新是成功组织的命脉（图\
  \ 19-7）。虽然这通常难以量化，但其财务影响不应被低估。\n\n这三个步骤应引导出平衡的架构合规方法。\n\n根据组织的整体情况，董事会始终保留否决架构标准的权利。这是他们的正当权利，并且如果他们是有意识且完全透明地做出决定，那么他们这样做是完全可以接受的。\n\
  \n![../images/499948_1_En_19_Chapter/499948_1_En_19_Fig7_HTML.jpg](img/499948_1_En_19_Fig7_HTML.jpg)\n\
  \n图 19-7 复杂性成本\n\n### 一种界定范围的方法\n\n我想你现在想知道如何在理想流程和百分之百解决方案之间找到最优解。\n\n与其仅依靠直觉或\
  \ 30 年的业务经验，你需要数据，以便基于事实做出决策。（这并不令人惊讶，对吧？）\n\n同样，为了获得全貌，你需要考虑“项目的 3+1 个维度”，即项目特定方面以及组织全局视角。\n\
  \n对于后者，你需要了解架构不合规的未来成本，如前所述。对于前者，需要回答以下问题：\n\n*   在相关的业务流程中，哪里可能出错？\n*   失败的（直接和间接）成本是什么（请记住第\
  \ 1 章描述的 1-10-100 规则）？\n*   计划要解决这些问题需要多少成本——无论是构建合适的解决方案还是日常运营？\n\n但是，你如何理解哪里可能出错呢？数据在这里也能提供帮助！\n\
  \n以下方法通常可以结合使用：\n\n1. **用户故事**\n\n    导致当前计划的改进需求应该已经为你提供了大量的用例和用户故事。发现的每一个痛点都有可能形成一个用户故事——通常包括观察到的与理想流程的偏差。\n\
  \n2. **先前的流程结果**\n\n    查看过去类似流程或任何新流程的前身的结果：即使流程完全改变，早期版本或其他领域相关流程的许多参数也可能有助于预测预期的异常甚至其频率。\n\
  \n3. **模拟**\n\n    如果你的组织系统地记录了子流程级别的用户模式（例如，网站访问者的点击行为），你将能够详细说明某些用户群体在特定情况下的反应——即使是在不同的上下文中。\n\
  \n    了解目标流程每个方面的概率，并不能立即告诉你最终的异常及其概率。但它们通常允许你使用大量测试用例运行模拟。在这里，随机数生成器可以模拟先前记录的日常生活的变异性。\n\
  \n    谢天谢地，这类模拟通常不需要个人数据。这就是为什么你可以收集关于网站上客户行为以及办公室电脑前员工行为的匿名数据。\n\n当然，所有这些都是一个迭代过程。基于你的发现，你会设计异常处理流程——但这些流程也需要验证，并且它们会带来新的情况，即“异常的异常”。\n\
  \n请随意首先将所有这些应用于你自己的数据处理流程。这些流程无疑容易偏离理想流程。\n\n脚注 1\n\n"
- "# 20. 分析数据\n\n![../images/499948_1_En_20_Chapter/499948_1_En_20_Fig1_HTML.jpg](img/499948_1_En_20_Fig1_HTML.jpg)\n\
  \n图 20-1 无用的分析\n\n## 有意义分析的前提条件\n\n拥有精确的算法和高质量的数据就足够了吗？\n\n如果你倾向于回答“是”，那么让我试着让你失望……\n\
  \n即使你拥有可靠的数据，并且使用了数学上被证明的算法，结果也可能不是无懈可击的。\n\n以下是两个主要挑战：\n\n*   算法适用性的前提条件\n*   规则含义的模糊解释\n\
  \n让我用应用统计学中著名的`ANOVA`（**方**差**分**析）为例。该方法常用于比较样本中不同组别的变异。我不会详述，但会指出一些潜在的陷阱。\n\n\
  ### 所有前提条件都满足了吗？\n\n通常，数据科学家会感激地接受统计软件提供的数学例程。\n\n然而，这种便捷的访问方式伴随着这些例程被不经意地使用的风险。前提条件和适用性通常未被验证。\n\
  \n我们来看一个典型的例子：单因素方差分析。这种方差分析可靠性的三个关键假设是：\n\n*   响应变量残差（近似）服从正态分布。\n*   总体方差相等（“方差齐性”）。\n\
  *   给定组内的响应是独立同分布的正态随机变量。\n\n在现实中验证这些假设并非易事。例如，你可以根据样本确定残差，但无法验证它们是否服从正态分布。此外，很难判断不同样本的方差是否足够相等。\n\
  \n\n\n### 研究者能否影响结果？\n\n最后一点引出了第二个挑战：即使拥有正确确定的样本和精确的数学公式，许多决策仍留给研究者来决定。这一发现应当让所有将数据科学视为一门基于事实、不容置疑的数学学科的人感到惊讶。\n\
  \n偏差出现在两个阶段：首先是在数据准备阶段，然后是在数据分析阶段。\n\n数据准备阶段，也称为探索性数据分析（`EDA`），是及早发现数据问题、排除初步错误等不可或缺的步骤。如果做得好，它会使分析结果更有意义。但这并非一个数学上精确描述的阶段。大多数决策都留给研究者来做。换句话说，它们基于经验和直觉。\n\
  \n随后的数据分析阶段，尽管有数学算法可用，但也同样为人为偏差留下了很大空间。\n\n我将再次使用`ANOVA`作为例子，说明一种科学方法如何将大量决策和估计留给了人类。\n\
  \n让我们看看苏黎世大学的一份培训教材，在描述了`ANOVA`的执行过程之后：\n\n*\"（……）Levene 检验用于检验不同组具有相同方差的假设。如果 Levene\
  \ 检验**不**显著，则可以认为方差齐性成立。但如果 Levene 检验显著，则违反了`ANOVA`的前提条件之一。`ANOVA`被认为在轻微违反条件下具有容错性。特别是当各组规模足够大且大致相等时，违反通常被认为不成问题。\n\
  \n*如果样本规模差异显著，方差齐性的严重违反会导致 F 检验失真。作为一种替代方案，您可以使用`Brown Forsythe`检验或`Welch`检验，它们是经过调整的\
  \ F 检验。（……）\"*^(⁵⁰)\n\n我已经标出了所有留有解释余地和存在偏差空间的词语——数量惊人！\n\n举个例子，以上文中的术语\"显著\"为例。你可能会争辩说：\"\
  在统计学中，显著和不显著的定义非常精确，不是吗？因此，几乎没有或完全没有误读的空间。\"\n\n确实，\"显著\"和\"不显著\"之间的界限通常是精确**定义**的。然而，这个定义并非来自对可能的最佳（更不用说\"\
  正确\"）阈值的客观确定。\n\n无论你如何衡量显著性，它通常都是一个连续函数。因此，如果你靠近所选阈值，阈值两侧的显著程度几乎是相同的。^(⁵¹)\n\n换句话说，\"\
  客观显著性\"并不存在。虽然在\"显著\"和\"不显著\"之间选择某个分界点总有充分的理由，但其最终确定仍然带有一定的随意性：你总得在某处划一条线。\n\n现实中，想象一下从总体中抽取两个随机样本。毫不奇怪，它们会得出几乎相同的分析结果。现在，要意识到\"\
  几乎\"可能意味着一个结果略低于阈值，而另一个略高于阈值。\n\n在这种情况下你该如何处理？你能抵挡住选择那个支持你最初假设（或你老板期望）的样本的诱惑吗？如果其他人使用了另一个样本呢？基于非常相似的统计结果，你们会得出截然不同的结论。\n\
  \n这个主题是通常不受质疑的数学陈述的典型案例。我邀请你挑战这类陈述，即使它们来自统计教科书。至少，你应该理解其背后的逻辑和决策，以限制人为偏差。\n\n###\
  \ 两种挑战并存的情况\n\n有时你会发现两个问题同时存在：前提条件被列出却没有解释，并且以一种允许偏差的方式呈现。在`BA-Support.com`上可以找到一个很好的例子，同样是关于`ANOVA`：\n\
  \n*\"此检验仅在满足若干前提条件时才能使用。这些条件是：所有组要么包含超过 30 个观测值，要么服从正态分布，同时各组之间必须具有可比较的方差。\n\n*此外，描述组的变量应为名义尺度，而因变量（我们进行比较的变量，或者干脆就是'另一个！'）应为区间尺度。在一些教科书中，你还会读到各组规模应相似，但在`SPSS`中无需担心，因为它有校正不相等样本量的程序。\"\
  \ (`BA-Support`, 2019)*\n\n同样，标出的词语构成了大量可供人为偏差发挥的情况。我邀请你思考以下问题：\n\n- \"30 个观测值\"\
  的阈值从何而来？\n\n- 真的有充分的理由将界限精确划在 30 和 31 个观测值之间吗——低于此就是\"差\"，高于此就是\"好\"？\n\n- \"可比较\"\
  是什么意思？这个决定是否留给了研究者，凭他的/她的经验和直觉？\n\n- \"应\"暗示某事是推荐的而非强制性的。那么，如果你*不*遵循这个建议会发生什么？\n\
  \n- 在不知道某软件使用何种逻辑做出决策的情况下，信任该软件是否明智？\n\n## 人工智能的一般局限性\n\n人工智能带来了数不胜数的机遇。但我们需要意识到它的局限性以及如何应对这些局限。\n\
  \n\n\n### 数据源\n\n即便使用了最优秀的算法，如果输入的数据质量低下，也会得出错误的结果。这应是显而易见的道理。然而，这仍被普遍忽视，因为主要焦点往往在于获取结果。而源自劣质数据的信息，看起来并不比基于高质量数据的信息更差。\n\
  \n因此，在许多情况下，数据科学家在寻找数据时，人们只期望他们从事以下活动：\n\n-   使用关键词搜索网络\n-   在无法以文件格式下载数据时进行屏幕抓取\n\
  -   下载文件（如有必要，获取二手数据）\n-   重复使用他人之前下载过的文件\n-   通过列名或内容等方式推断列的含义\n\n这种方法导致了一系列典型的问题模式，降低了数据的价值：\n\
  \n-   数据的年龄通常不明确。它可能在某个时间点上是准确的，但如今已经过时。（而且“某个时间点”所代表的时间跨度正在不断缩短！）\n-   数据的完整程度通常不明确：数据可能已被过滤，或者采集工作可能提前终止。\n\
  -   列的定义通常靠猜测：由于大多数平面文件或电子表格缺乏适当的说明，数据科学家被迫通过列名等方式来推断其含义。\n-   偏差！通常无法得知一个数据表在创建时是否带有特定的操纵目的。即使提供数据的组织信誉良好，但数据整理过程中仍有人为因素参与。而且仅凭内容本身无法分辨：在数据文件中，一个诚实的“5”和被操纵的“5”看起来完全一样。\n\
  -   另一位数据科学家可能已经移除或合并了与其他列高度相关的列，这在其特定问题的背景下可能有充分的理由。但在后续使用相同数据回答不同问题时，那些细微的差异可能正是有趣的部分。\n\
  \n对此，你可能希望为任何数据科学家的数据获取工作增加具体职责：\n\n1.  **了解来源**  \n    获取有关公开数据创建者和提供者的知识非常重要。没有这些知识，数据就如同互联网上一个正面的产品评价一样无用，因为你不知道评价者究竟是卖家还是收了钱才写的评价。\
  \  \n    类似 `https://datasetsearch.research.google.com`（最终于 2020 年发布）这样的数据搜索门户网站很棒，但它们并非“源头”，也不提供任何数据质量的保证。\n\
  \n2.  **联系提供者**  \n    在某些情况下，与在互联网上找到的数据的原始创建者或提供者取得联系，有助于你理解他们的动机和方法论。  \n   \
  \ 长远来看，良好的关系可能带来获取额外数据的权限，甚至促成双方定期、富有成效的交流。\n\n3.  **了解数据历史**  \n    数据质量并非一成不变的属性。即使数据本身保持不变，其质量也会改变。了解数据源的数据质量历史有助于理解其现状：数据是否得到维护？是否处于持续审查中？还是仅仅是一次性的“发射后不管”努力的成果，无论当初执行得多么严谨？\n\
  \n4.  **阐明数据模型**  \n    数据源所使用的数据模型和术语，很可能与你所在组织对数据元素、关系以及数据结构的定义和命名方式不同。  \n  \
  \  在此时进行一点研究，有助于避免日后出现严重问题，或是未被察觉的误解导致得出错误结论。\n\n5.  **核对多个来源**  \n    很少有信息只通过单一来源获得。因此，寻找同一数据的多个来源是一个好原则，因为它允许你通过比较进行验证。\
  \  \n    请注意，不同方经常相互复制。就像日常生活中的谣言（如果你从不同来源听到，会显得更可信）一样，这可能导致对已确认质量产生虚假的认知。\n\n6.\
  \  **客观地对数据源进行分类**  \n    为了能可重复地评估数据科学项目的结果，你需要对每个数据源的质量进行分类。这对于日后（可能由不同的数据科学家）在另一个上下文中使用相同数据也很重要。\
  \  \n    典型的属性包括内容的可靠性、描述的准确性以及更新的频率。  \n    在判断数据源的偏差程度和可信度时，请记住，这不仅仅关乎数据的收集者。最终的数据可能并非基于事实，而是基于“代表性”调查或估算。\
  \  \n    在全面评估需要付出不可接受的代价时，调查是深入了解情况的有效手段。但是受访者可能存在偏见。  \n    例如，如果你询问 1000 名 CEO\
  \ 其组织的数字化成熟度，或者询问 1,000,000 名客户其满意程度，你获得了全面的样本——但每个答案都可能带有偏见，而且受访者的评判标准可能不同。\n\n\
  7.  **记录你的数据源**  \n    关于数据源的信息（包括数据文件本身及其来源）应同所有其他相关元数据一起进行记录（和维护），以便系统地让所有数据科学家都能获取这些知识。\
  \  \n    文档应包含所有已知属性，例如（已确认的！）列的含义、所覆盖的时间点或时间段、创建年份、应用的任何过滤条件，以及文件创建的原始目的。  \n \
  \   此外，你可能希望对标准和属性进行标准化，以便能够比较任意两个数据源。\n\n8.  **协作**  \n    如果贵组织的政策允许，我鼓励所有数据科学家与更广泛的数据社区合作，不仅限于组织内部。这并非为了披露内部信息，而是关于共享有关外部数据源的信息。\n\
  \n\n\n### 人工智能算法\n\n让我用一个具体例子来说明人工智能的某些局限性。\n\n这个例子是关于人脸识别的，这是神经网络最突出的应用案例之一。\n\n\
  我个人对已有的人脸识别技术成果印象深刻。然而，使用此类算法从求职者名单中筛选合适人选，会带来一些挑战，可能会让你重新考虑其适用性。\n\n我甚至不是在谈论伦理道德方面——就连这项服务本身也不值所投入的金钱！\n\
  \n2019 年秋季，博比·赫拉德发表了一篇题为《AI 与面部分析首次应用于求职面试》的文章。文中描述了一家美国组织开发的软件，“该软件通过分析视频面试中的语调、词汇和面部表情来判断候选人的适合程度”（赫拉德，2019）。\n\
  \n该算法可能会无意中存在偏见。更糟糕的是，它可能是*故意带有偏见*。其创造者可以把它塑造成这样一种模式：让自己的简历获得最高评分，使自己看起来是最有希望的候选人。本质上，人工智能允许人们以一种非常不道德的方式，为自己的职业发展创造绝佳的工作机会。毕竟，它是一个黑箱——其他人永远不会发现……\n\
  \n就我而言，最糟糕的一点是：这种方法会阻碍人力资源部门随着时间的推移而进步！\n\n以下是底层人工智能算法的一些缺陷。你在其他案例中也会发现这些问题：\n\n\
  ![../images/499948_1_En_20_Chapter/499948_1_En_20_Fig2_HTML.jpg](img/499948_1_En_20_Fig2_HTML.jpg)\n\
  \n图 20-2\n\nHR = “人力资源”（Humanoid Resources）？\n\n1.  **过去错误的固化**\n\n过去因某些属性组合而未能被选中的候选人，未来也将不会被选中。如果过去的筛选标准并非最优，那么未来的标准也将如此。\n\
  \n2.  **无法考虑需求模式的变化**\n\n世界在变化，需要不同类型的人才。这种向后看的算法如何能够理解需求的变化呢？\n\n3.  **无法判断学习程度**\n\
  \n无监督学习是进步的关键。然而，在这种情况下，成功率很难被验证，尤其是无法被算法自身验证。这不是算法的问题，而是可用训练数据的问题。毕竟，判断一个新员工是否可以被认为是成功的，往往需要数年时间。\n\
  \n4.  **不知道“为什么”**\n\n与许多人工智能算法一样，这个算法并没有告诉我们*为什么*某些特质在过去更为成功。要确定最佳候选人，你需要基于有意义的参数来构建招聘逻辑。一个无法区分因果关系和相关性的算法既无用又危险。\n\
  \n不要误会我的意思：我们不应认为确定相关性总是足够的！但我们需要清楚，何时需要因果关系，何时可以运用相关性。\n\n当问题是“多做 A 是否就能多得到 B”时，因果关系至关重要。然而，如果我们想验证一个像“寻找\
  \ C 以便发现更多 D”这样的说法，那么运用相关性可能完全没问题。\n\n5.  **无法洞察训练数据之外的信息**\n\n人工智能的一大挑战是结果的适用性。没有任何\
  \ AI 算法能提供其训练数据之外可靠的洞察。如果一个元素在被算法“评估”时，并未包含在算法之前的训练或测试数据中，那么其结果充其量是无用的。这种情况在算法试图改善平均选择（例如，平均需要在地面上钻多少个孔才能找到特定的原材料）时或许可以接受。如果\
  \ 50%的情况得到了改善，而另外 50%只是随机的，你可以认为这是一种成功——总体工作量会下降。但是，当你处理的是个体时，在大多数现代社会，追求平均意义上的改善在伦理上是不可接受的。\n\
  \n为什么我们需要一个具备数据素养的人力资源世界？就是为了防止这类方法成为人力资源部门的工具。没有数据管理员或隐私官应该被迫去指导人力资源人员！\n\n6. \
  \ **法律问题**\n\n使用这类算法的机构通常会强调，它只是评估的一个组成部分，在做出招聘决定前，大部分评估工作仍由人类完成。\n\n然而，这种说法并不适用于那些*在*任何人类首次查看*之前*就被算法过滤掉的简历。无论如何，这些简历仍然是\
  \ 100%由软件处理的，无论随后对其它简历应用了多少人工评估。\n\n这就是为什么这种方法不仅在伦理上值得质疑，而且还违反了现行法律。通用数据保护条例（GDPR）第\
  \ 22 条规定：“数据主体应有权不受完全基于自动化处理的决定所约束。”\n\n总而言之，你不希望失去对流程的控制（如图 20-2 所示）。在这个问题上，我看到的最佳建议来自英国招聘机构汉诺威招聘有限公司。他们在其网站上写道：“最终，你对待候选人和客户数据的方式，应该像你希望自己的数据被对待的方式一样！”（比蒂，2018）。\n\
  \n### 人类行为\n\n“我知道我在做什么”，这是我经常从数据科学家那里听到的话。但仅仅科学家*知道*是不够的。\n\n数据科学关乎可信度。两个同事各自独立研究同一个问题只是时间问题。他们很可能会使用不同的（变体的）方法。请预料到他们会以不同的方式解读相同的情况，并得出不同的结果。\n\
  \n这些结果可能没有根本性差异。但至少它们会有足够的差异，以至于连市场部的外行人都能质疑小数位数所暗示的精确性。\n\n什么有帮助？**透明度**！用通俗易懂的语言分享你在做什么。不要过度承诺——你不需要这样做！解释局限性。说一句“这个结果仅在\
  \ A 和 B 相互独立时才有效，但我们不知道它们独立到何种程度”并无大碍。\n\n\n\n### AI – 何去何从？\n\n围棋被认为是地球上最复杂的棋类游戏之一。你可能读过，2016\
  \ 年，DeepMind 的 AlphaGo 计算机击败了韩国 reigning 世界冠军李世石。这一事件被广泛视为人工智能（AI）发展中的一大步。\n\n我最近读到一篇\
  \ IBM 的文章，其中声称：“李世石被击败的重要成果，并非 DeepMind 的 AI 能学会征服围棋，而在于以此类推，它能学会征服任何比围棋简单的事物——这涵盖了极其庞大的范畴。”\n\
  \n听起来有道理？嗯，可能并非如此。\n\n我对这个说法的主要问题在于“简单”这个词。它的比较级暗示我们谈论的是一个单一维度的尺度。换句话说，你可以得出这样的结论：任何两种基于智力的表现都可以按“难易程度”排序（至少其中一种是“下围棋”）。\n\
  \n但你如何定义“简单”？是击败围棋世界冠军更*简单*，还是说服绑匪释放所有人质并投降更简单？是赢得《危险边缘！》更简单，还是在讨论中说服持不同观点的人更简单？我们显然在这里面对的是人类大脑表现的多重维度。\n\
  \n如果让像 AlphaGo 这样的计算机实时计算足球运动员的最佳下一步动作，（撇开硬件限制不谈），就连本文作者也会表现得比它更胜一筹（这很能说明问题）。但凡看过\
  \ RoboCup——机器人足球世界杯——的人，都会明白我的意思……\n\n我不知道 AI 会发展得多快。不过，一个指标是研究资金的投资。我最近与许多组织的讨论表明，他们正从“我们必须不惜一切代价参与其中”的阶段，转向“给我看价值”的阶段。真正的资金将流向那些带有商业案例的\
  \ AI 研究。\n\n那么，如果你设身处地站在一个组织的角度思考，你会如何思考和行动？\n\n一个管理良好的组织，考虑到客户、股东和员工这常见的利益相关者三角关系，必然会问：“AI\
  \ 如何能让我们更成功？”即使是大学和非营利组织，总体上也越来越被创造切实价值的需求所驱动。\n\n老实说：要让真正的人工智能（指复制人类大脑意义上的）为我们的社会（甚至单个组织）增值，需要长期巨大的投入。那么，是什么推动了组织的投资呢？\n\
  \n首先，组织通常倾向于为每项任务提供专门的解决方案。这并非 AI 所特有。没有哪家汽车制造商愿意投资一款既能运输笨重货物、又能赢得一级方程式赛车、同时还能提供豪华敞篷体验的汽车。通常，三种专门的解决方案能在各自领域以更低的总成本做得更好。为三个不同任务需要三种解决方案这个事实，并不会被视为尴尬之事，这是有充分理由的。\n\
  \n看看机器人学：虽然媒体上充斥着会微笑和握手的人形机器人，但大多数商业驱动的研究仍集中在专用机器人上，它们能以近乎完美的方式精确完成一件事（并且在执行另一任务前至少需要大量的重新配置）。工业界在此领域已研究数十年，并取得了令人瞩目的成功。\n\
  \n其次，进一步发展那些远落后于现有能力（此处指当前人类能力）的东西，其商业案例会很糟糕。投资回报遥不可及，而且毕竟充满不确定性。\n\n正因如此，我相当确信\
  \ AI 的发展将继续专注于那些 AI 已通过专门解决方案提供优于（或可媲美）当前人类表现的领域。模仿人脑中巧妙的机制，例如神经元的工作方式，必将有助于这种方法取得成功。\n\
  \n同时，至少在可预见的未来，我不期望在开发无需为应对新挑战而重新编程的人类大脑克隆体方面取得实质性进展。\n\n这听起来悲观吗？并非本意！\n\n我坚信 AI\
  \ 在*补充*人类能力方面的能力会不断增强。上帝没有把我们造得像神一样（看完晚间新闻后这很容易相信），所以，我们为什么要反过来投入宝贵的脑力去开发类人设备呢？\n\
  \n## 关于分析的推荐\n\n基于我上述所言，我想提出一套指南，你可以要求整个分析团队遵循：我的“12 条分析指南”。\n\n你可以根据自己的发现和优先事项随意调整它们——但我强烈建议制定此类指南，因为它们有助于整个团队采用一致的方法。\n\
  \n### I. 确定所需的精确度\n\n有时，无需考虑所有数学前提条件。\n\n当只需要（通过启发式算法）为第二个算法找到一个预优化的起始点时，尤其如此。在这种情况下，起始点的质量会影响剩余计算工作量，但不会影响最终结果。\n\
  \n然而，有时收敛性无法保证，而且你常常无法在事后验证你的算法加数据是否工作良好。即使你将数据分为训练数据和测试数据，后者也可能无法正确反映现实。\n\n但是，只要你的模型“仅仅”是期望让流程更高效，只要你拥有较短的验证周期，并且能轻松衡量成功与否，你就不应该一开始就坚持最低精度水平。\n\
  \n你是否找到了可能的最佳算法并不重要——如果它能让事情变得更好，它的存在就是合理的。如果某个流程的性能是 70%，而你将其提升到了 80%，这就是增加了价值，尽管\
  \ 80%远低于 100%。\n\n在这种情况下，你可以在几天内将模型投入实际应用——在你并行运行它之后，最终得到的算法会提供改进的结果。\n\n一旦你的解决方案上线，你就处于更有利的位置来进一步微调它，特别是当你能衡量其当前性能与\
  \ 100%之间的差距时。\n\n将这种进展绘制成图表有助于给你的业务客户留下深刻印象：你可以将你的团队所做的事情立即与某个对业务利益相关者重要的指标的改进联系起来。\n\
  \n\n\n### II. 不要仅仅因为公式`它能用`就使用它\n\n假设你遇到一个有趣的案例。问题很明确；基础群体在你的数据库中已经可用。你可以调用统计软件中的一个函数，它会返回一个语法上（和数学上）正确的结果。所有输入参数都可用。诱惑很大。\n\
  \n但公式是否符合目的？也许有更好的方法——甚至可能利用现有的业务信息？\n\n举个例子？你可能使用过无监督学习程序来对你的基础群体进行聚类。聚类的数量遵循科学认可的标准，例如，使用组内距离平方和。你的直觉告诉你，你已经找到了一个很好的折中点——进一步增加聚类数量不会显著提高你定义的分数，同时也要考虑到任何进一步聚类都会带来的聚类规模减小。用经济学的语言来说：你增加聚类数量的边际收益接近于零。\n\
  \n所以，无论你最终决定采用多少个聚类，你的决定都是基于数据、公式、直觉和经验的混合。然而，它可能**没有**基于基础群体的业务背景。\n\n这就是为什么数据科学家需要准备好走出他们的舒适区。在业务方面有很多互补的智慧。例如，与合适的业务人员讨论可能会揭示，从业务角度来看，使用众所周知属性的组合，你的基础群体存在一种自然的聚类划分。\n\
  \n使用业务知识可能不仅比应用像肘部法则（即寻找收益曲线上的强拐点，指示边际收益的显著下降）这样广泛接受但与内容无关的方法更合适。它还会让业务人员更容易理解你在做什么，并且你作为实际问题解决者的可信度也会提高。\n\
  \n### III. 检查所有前提条件\n\n你的基础群体是正态分布吗？真的吗？你能保证完全的统计独立性吗？\n\n你无法从结果判断应用某个方法的所有前提条件是否都已满足。如果某个前提条件几乎不可能满足，你至少应该知道它在多大程度上是满足的。\n\
  \n只要可能，你应该定期验证所有前提条件是否都具备。在某些情况下，你可能会发现对于前提条件成立来说，你的结果太差了——而有时你的结果会证实你关于所有前提条件都已满足的假设。\n\
  \n想想选举民意调查，投票站的人出来时被问到他们刚刚投了哪个党的票。结果随后会作为投票结束后的第一个预测显示出来。调查机构通常会选择那些在上次选举中其联合结果非常接近最终结果的投票站。此外，这些人需要被随机选中，并且所有人都需要自愿地讲真话。\n\
  \n你会记得，这类民意调查的结果通常与选举的最终结果相对接近。但是它们是否达到了如果所有统计前提条件都满足时应该达到的理想水平？答案是否定的。如果你做一些数学计算，你会发现，从统计上讲，所有满足前提条件的民意调查中有\
  \ 98%的结果会比观察到的结果更好！\n\n当然，并非你在业务环境中的所有计算都能像这类民意调查一样迅速得到验证。但如果你有机会，比如说，稍后根据实际销售数据来检查你对整个产品组合销售分布的预测，你就应该这样做，以便更好地感受这些前提条件的有效性。^(⁵³)\n\
  \n### IV. 对局限性保持坦诚\n\n数据和算法都有其固有的局限性。你可能会有理由冒险超越这些限制去使用它们。但要明确你的选择和动机。\n\n有时你可能会被迫进行同比比较，而每年的数据来自两个不同的来源（例如，因为中间引入了新软件，或者因为数据提供者发生了变化）。请将此信息添加到结果的演示文稿中，作为警告。\n\
  \n另一个典型的局限性是你 AI 模型训练数据的来源。你通常无法自己收集这些数据，特别是如果你想将分析建立在数百万条记录的基础上。因此，你最终通常会使用同样有限的几个公开可用的数据存储库。问题在于：你的结果与他人一致并不能证明其正确性。它可能反而表明你们都使用了相同的数据源。\n\
  \n看看用于光学字符识别（OCR）和图像识别的图像库：它们通常是在特定背景下收集的，并且很可能超出该特定背景后就无法使用。\n\n字符识别还带来了另一个挑战：没有\
  \ OCR 算法能够可靠地区分`0`（零）和大写字母`\"O\"`，或者区分`\"I\"`（即盎格鲁-撒克逊风格的数字`\"1\"`）和大写字母`\"I\"`（如果写的时候没有衬线）。同一个图像可能代表两种不同的东西。即使在数字家族内部，欧洲的`\"\
  1\"`和盎格鲁-撒克逊的`\"7\"`看起来可能一模一样。为了安全区分，你还需要考虑上下文。如果你做不到，那就坦诚相告！\n\n### V. 解释你的假设\n\
  \n请再看一下前面的聚类示例，并回想一下本章开头关于方差分析的内容。你做了多少次人工选择？\n\n* 定义一个分数\n* 选择衡量聚类内元素相似度的指标\n*\
  \ 平衡每个聚类内的方差与随聚类数量增加而增加的工作量等。\n\n我们离无监督学习所需的水平还很远，该水平可以让我们把所有决策都留给一个能自主知道要考虑哪些信息的算法。这意味着由人类来做决策是可以的。\n\
  \n但你需要解释这些决策。是哪些假设让你做出了你所做的决定？\n\n\n\n### VI. 切勿制造虚假的精确印象\n\n想象一下，有人收集了一个 40 人团队的护照，记录他们的年龄，并计算了团队的平均年龄。假设计算出的平均年龄四舍五入后为\
  \ 34 岁。\n\n现在再想象另一个人，他不看护照，而是对每位团队成员的年龄进行估算。此人计算的团队平均年龄为 37.575 岁。\n\n哪个人提供的结果更准确？\n\
  \n我想你明白我的用意。\n\n坦率地说明你结果的精确程度，是建立可信度的一部分。与其说“该群体中的客户偿还贷款的可能性是 68%”，你或许更愿意这样表述：\n\
  \n“在满足算法所有前提条件的情况下，有 95%的概率表明，该可能性介于 65%到 71%之间。换句话说，如果该群体的真实可能性为 68%，那么平均每 20 次模拟中有\
  \ 19 次会预测出介于 65%到 71%的可能性。每有一个前提条件未满足，不确定性就会增加。”\n\n这样的表述更难理解，但一旦人们理解了，你就不必一再重复了。你将达成以下目标：\n\
  \n-   你助力你的组织踏上成为数据素养型组织的旅程。他们不需要能证明贝叶斯定理，但应该对数据分析能实现什么有基本的理解。\n-   你管理了预期并保护了自己：人们应该对你的数据有多精确有一个现实的认知。而且你也不想被认为是“被证明错了”。\n\
  \n你始终要留有改进的余地。更多的数据和性能更强的计算机通常会提高准确性。这让你可以为更高的准确性贴上价格标签。如果一位高管对前面例子中六个百分点的范围不满意，你就知道你的提案应该是什么样的了。\n\
  \n### VII. 谨慎地自动化数据准备\n\n数据准备的自动化可以节省大量时间，并通过减少人为因素（包括个人偏见）来提高可复现性。\n\n请注意，这并不保证（甚至不能提高）数据的正确性。除了减少人为错误和加快流程之外，它只是让相同的数据看起来更好，并简化后续处理。然而，这可能会助长对数据质量的错误印象。\n\
  \n### VIII. 使用 DataOps\n\n随着 DevOps 的兴起，即由同一个团队开发和运维软件，人们开始思考将这一理念扩展到数据主题。毫不意外，这个概念被命名为\
  \ DataOps。\n\nDataOps 通过避免不同方只追求各自目标的情况，有助于正确设置激励机制。\n\n此外，审查周期和对数据质量的持续监控有助于发现不合理的数据，例如通过启发式方法。\n\
  \n但请抵制将这种方法局限于分析领域的诱惑。等到为了分析目的而准备之前未经监控的数据时才开始使用 DataOps，就已经太晚了。\n\n### IX. 精妙地权衡\n\
  \n你几乎永远无法找到某个问题的全局最优解。这个世界*就是太复杂了*（双关语）。有太多影响参数，而不同的优化标准通常无法客观地权衡。\n\n这种情况迫使你做出妥协——要么进一步简化你的模型（每个模型在定义上都是简化的），要么减少待评估的选项列表（因为你拥有的选项很可能比已知宇宙中的原子还多）。\n\
  \n你可以在多个层面应用这两种策略。\n\n-   你可以通过构建技术上尽可能复杂的模型来处理简化，也可以在仍然能获得语法有效结果的前提下尽可能简化。\n- \
  \  或者，你可以通过巧妙运用算法来减少选项数量（例如，一旦找到一个被证明优于某组中每个选项的选项，我就不需要评估整个组的选项了）。\n-   此外，你还可以在应用算法之前，基于非科学因素（例如你的业务战略）来减少你的选项列表。例如，你确定了一组选项，并且可以证明全局最优解就在这组选项中。但这些选项中没有一个是符合你组织在产品战略中决定专注的方向的。\n\
  \n但你怎么知道应该在多大程度上妥协呢？同样，你必须进行计算。并且，同样，你很快就会发现自己要找的“最佳”妥协程度是一项极其复杂的计算，复杂到无法执行。\n\n\
  第一个挑战是如何**衡量**你妥协的程度。坚持全面考虑**所有**参数显然意味着零妥协，而随机选择则是 100%的妥协。但你如何确定介于两者之间的任何一种方法到底是多少呢？\n\
  \n复杂性无法通过开发越来越精妙的算法来克服。算法越精妙，它就越复杂。而算法越复杂，你就越难以知道结果的准确性。换句话说，与猜测正确的平衡点相比，你什么也没赢到。\n\
  \n我们常以为，我们被迫径直从老式的直觉转向现代数据科学，并且数据科学将取代直觉。这种思维方式暗示数据科学是解决方案，并将提供终极答案。\n\n相反，最佳选择可能仍然是在两个极端之间保持一个良好平衡的方法。然而，这可能需要改变目标：从旨在找出“正确的商业决策是什么”，转向确定如何以*最恰当*（而非完美）的方式应用数据驱动的方法。\n\
  \n是的，经验和直觉仍然是这项工作的一部分——这凸显了坦陈局限性的重要性（参见指南 IV“坦陈局限性”）。\n\n### X. 排除情感因素\n\n另一个有用的技能是区分“理性”和“感性”决策因素的能力。正如我们所看到的，即使是理性因素也存在缺陷。这就是为什么你至少应该消除诸如骄傲或愤怒之类的情感因素。\n\
  \n你如何培养这种技能？当然，你可以阅读关于情商的书籍（我鼓励你这样做），但与学习科学不同，你不能仅仅“阅读和记忆”。\n\n这就是为什么我建议你与他人一起反思。保持开放的心态，期待他人给你带来惊喜。同样，与科学不同，你会发现两种不同的观点可能都是可以接受的。\n\
  \n因此，这种方法并不意味着在你的大脑知识库中添加另一条知识或一个规则引擎——你可能更希望拓宽你未来决策的基础。\n\n\n\n### XI. 考虑模型之外的变量\n\
  \n在传统建模中，你需要有意识地决定哪些参数要纳入模型。在宏观经济学中，这通常被描述为\"**其他条件不变**\"（拉丁语 *Ceteris Paribus*）：任何你不想（或无法）构建到模型中的变量都被假定为恒定不变。因此，你必须在建模前就预先思考所有可能产生影响的方面，以便有意识地决定是否将它们纳入模型。\n\
  \n而在神经网络中，你往往依赖模型替你完成这项工作。模型会被期望隐含地发现所有相关方面：只要这些方面存在于训练数据中，它们就会自动对训练过程产生积极影响。\n\n\
  然而，这种无需提前考虑所有方面的做法也伴随着风险。风险源于你用于训练和验证模型的样本数据的**代表性**。\n\n事实上，在收集数据时，你可能会遗漏某些方面。你自认为数据具有代表性，但可能无意中忽略了总体中的相关子集。\n\
  \n最常见的遗漏是未考虑**时间**因素。毋庸置疑，任何样本都是在过去收集的。但问题是，自那以后情况可能已经发生了变化！新冠疫情及其带来的消费者偏好剧变就是一个很好的例证。\n\
  \n有些方面的变化你可能甚至从未想到过，但它们却可能对你所评估的内容产生影响。再举一个例子，立法变更或丑闻曝光也可能显著改变人们的购买偏好，因此，事件发生前的样本无法反映当下的现实。\n\
  \n问题在于，这类失败很难被察觉。你会像往常一样用 70%的样本训练模型，用剩余 30%来测试算法。结果，由于测试数据与训练数据反映的是同一段过去的时间，你的测试数据就会证实模型的准确性。\n\
  \n好消息是，你对此可以有所作为。坏消息是，这需要付出额外的努力：你必须考虑所有可能产生影响的方面，即便是那些远离你核心考量的因素。\n\n尤其需要注意的是，仅仅考虑你在样本中发现的所有特征是不够的，无论这个样本多么可靠。在某种程度上，你又回到了确定性模型的艰辛工作中：需要勤勉地审视所有潜在影响因素。\n\
  \n当然，你也可以采取一些缓解措施：尽可能使用涵盖最长时间跨度的训练数据，并按时间段对其进行切分。如果你的模型在处理过去不同时间段的数据时表现相似，那么它至少对*常规*变化（如时尚潮流更迭或政府更替）或*特定*事件（如疫情、自然灾害或奥运会）的存在具有不变性。然而，当训练数据覆盖的所有时间段都位于某个有影响的日子\
  \ X 之前，而你又试图预测日子 X 之后的情况时，这种方法就无济于事了。\n\n以下是我的核心心得：一个优秀的模型需要的远不止一位训练有素的数据科学家——广泛的教育背景几乎同等重要。这是组建混合团队的有力理由，在这样的团队中，不同的技能组合可以相辅相成。\n\
  \n### XII. 全面定义成功\n\n你如何验证某项人工智能举措是否成功？或者，当你迭代改进模型时，如何判断自己是否在正确的方向上前进？\n\n乍一看，如果事先定义并衡量了一个可量化的业务标准，问题就很简单了。你能看到改进，并且能证明你的算法是成功的，即使你不知道自己是否本可以做得更好。\n\
  \n但这种判断可能出错，原因在于除了你所关注的那个单一目标标准外，你未能全面衡量其影响。\n\n想象一下，一个警察局希望主动预防犯罪。我们可以假设他们有足够的历史数据来开发和训练一个算法，以判断任何已知人员近期犯罪的可能性。结果，警察局可以实施一项政策，将那些计算出的犯罪风险超过特定阈值的人关进监狱。\n\
  \n当然，即使是最专制的国家，大概率也不会实施这样的概念。但其背后的原理对你来说可能并不陌生，因为它一直被应用于其他用例。\n\n有趣的一点在于：在上述案例中，你几乎可以肯定地发现，犯罪率确实会下降！人工智能算法会识别出许多真正的危险人物，他们被关在监狱里，从而无法实施犯罪。以安全之名，这项举措将被视为成功。\n\
  \n但难道就没有一些不良副作用吗？\n\n如果在评估中不考虑一项举措的全部影响，你可能会忽略那些可能使整个结果变为负面的关键因素（在此案例中，即基本人权）。\n\
  \n在你的组织中，可能找不到同样极端的例子。但你往往会发现类似的模式。\n\n一个非常简单的例子是评估增加收入的不同措施。如果其中一项措施是提供折扣，你不仅需要验证收入的增长（在此案例中几乎是确定的），还必须考虑折扣对利润率（最终对组织盈利底线）的负面影响。\n\
  \n以下是我的建议：确定所有可能受到数据驱动变革影响的领域，并事先将它们纳入一个整体目标函数中。\n\n这样一个带权重的目标函数也迫使业务相关方理清思路并设定优先事项。\n\
  \n诚然，将所有参数转化为同一个度量标准（最常见的是对组织盈利底线的财务影响）需要大量工作。但幸运的是，数据可以帮助你完成这项工作——而你，正身处数据管理领域！\n\
  \n\n\n## 可解释人工智能（XAI）\n\n与过去基于规则构建算法不同，许多现代人工智能方法都基于学习（因此有了*机器学习*这一说法），无论是通过示例还是通过奖励来学习。\n\
  \n传统的**确认性**方法，正如运筹学领域所熟知并在二十世纪下半叶成熟起来的那样，总是从确定所有规则和约束条件开始。这些规则和约束会被转化为一个模型，然后对其应用一个合适的（经过数学证明的）算法。\n\
  \n这种方法存在两大主要风险：\n\n1.  **易受偏见和欺诈影响**\n\n    确认性方法从一组位于精确算法之外的规则开始。这些规则通常由对底层问题有既得利益的人汇集而成，因此他们可能已有成见，甚至是在朝着预期的结果努力。\n\
  \n    其结果是，边界被忽略、约束被低估或不等式被“调整”。偏见的另一个重要来源是目标函数的创建，即针对整体归一化目标，对不同目标参数进行加权。\n\n \
  \   由此产生的“问题”，通常是一个不等式系统，^(⁵⁴) 可以通过数学精确度进行计算——这暗示了结果是无可争议的正确。然而，如果底层模型受到了偏见的影响，那么结果反映的更可能是研究人员的抱负，而不是客观上的正确最优解。\n\
  \n2.  **模型的不完整性**\n\n    每个优化问题都有无数个参数。任何节点、边界和约束条件的列表都代表了对真实问题的一种简化。\n\n    虽然在早期，计算能力是主要的限制因素，但今天主要的约束是底层业务知识的完备性。如果人们不知道所有的约束条件，就无法将它们添加到模型中。\n\
  \n    当然，模型是对现实的简化。然而，在运筹学中，你无法预先判断模型是否足够代表真实情况，结果同样也不会告诉你这一点。\n\n    只有在现实世界中使用该结果时，你才可能发现模型的好坏。但在大多数情况下，你最终会遇到一个无效的情况，因为某些约束条件在模型中被遗漏了。这种情况需要一个漫长的迭代过程，无法完全交给计算机处理。\n\
  \n这种情况表明，应该扭转方法，并给人工智能的并行发展第二次机会：从数据开始，然后推导出相关性和因果关系。\n\n从基于规则的方法到神经网络的转变，意味着方向的改变：\n\
  \n从 **智慧到数据**（确认性） 转向 **数据到智慧**（探索性/贝叶斯）\n\n你可能已经猜到，这一转变并没有解决人类的所有问题。事实上，它还带来了新的问题。\n\
  \n让我们来看看一些突出的挑战。\n\n### 未知的因果关系\n\n正如我们所看到的，如今的算法就像一个黑箱：你无法再知道神经网络为何得出某个结果。*因果关系不明确*。神经网络完全是关于基于阈值激活和触发的节点……\n\
  \n你如何改进一个你不知道其决策方式的算法？不可能微调规则——毕竟，没有规则，至少在确定性意义上没有。改进神经网络决策质量的唯一方法是通过越来越多的训练。但如果你没有训练数据了呢？\n\
  \n即使你留作验证用途的已知案例证实了足够高的成功率，但误报的情况又如何呢？\n\n想象一个算法能成功识别出 99% 的包含狗的图片。它甚至可能识别出其他图片中的动物类型。\n\
  \n但是，你怎么知道在现实生活中，它不会将一个（未经测试的）任意颜色模式识别为狗呢？“它可能是一只狗”和“它是狗的概率高于它是任何其他动物的概率”之间的阈值，通常是通过手动设置的阈值来确定的。\n\
  \n我几乎可以肯定，随着时间的推移，科学将会更好地理解这些黑箱。但这将是一个漫长而乏味的发现之旅，堪比持续了数十年（并且仍在进行）的对人类大脑本身的理解过程。\n\
  \n### 信任问题\n\n对于患者来说，知道一个模式识别算法在帮助医生检测皮肤癌，通常是可以接受的。毕竟，结果不会比单靠人类判断更差。\n\n但是，对于那些可能对单个个体做出不利决策的算法呢？\n\
  \n一个人工智能算法对其计算的对象一无所知。它通常不能说：“等等，这个被监控摄像头拍到的人不可能是罗纳德·里根——那一定是个狂欢节面具！”相反，我们需要预先丰富或修改数据，因为算法本身不是基于规则的。\n\
  \n你很容易就能想到更多与你我相关的实际例子，比如计算信用评分的人工智能算法。\n\n这种困境的另一个例子是自动驾驶中的算法，它可能不得不在两个预计都会造成伤亡的选项之间做出决定。你会让你的汽车由一个可能得出“你的生命价值低于路上的一群人”这种结论的算法来驾驶吗？\n\
  \n### 伦理问题\n\n基于证据的算法没有良知——而基于规则的算法则可以通过智能地设置边界，或在目标函数中选择不同的权重，使不道德的结果变得不可取，从而避免产生不道德的结果。\n\
  \n但是，如何发现一个人工智能算法认为最优的结果，实际上却是一个不道德的结果呢？\n\n还记得本章前面“人工智能的普遍局限”中的人力资源例子吗：在那里，我们会基于一个连数据科学家都不理解其为何如此决策的算法，系统性地筛选候选人。\n\
  \n这不仅违反了《通用数据保护条例》（GDPR）和其他数据隐私法律，还在*没有*开发者主观意图的情况下，歧视了某些人群！换句话说，仅仅*感觉*自己是合乎伦理的是不够的。数据科学家还需要有意识地寻找可能产生不道德影响的因子，从而*采取*合乎伦理的行动。\n\
  \n\n\n### 出路何在？\n\n这个问题被问得越来越频繁，由此催生了“可解释人工智能”（XAI）这一术语：*理解正在发生的事情*被视为解决`黑箱算法`、`伦理`和`信任`等问题的关键。\n\
  \n这场讨论才刚刚开始，目前尚未有令人满意的答案。\n\n不过，以下问题或许能引导我们进行接下来的对话：\n\n*   数据科学家将如何赢得用户的信任？没有人再相信那种仅凭可能并非最优的经验来筛选候选人的算法。\n\
  *   在哪些情况下，用户会接受“黑箱”，又在何时会拒绝它？\n*   又该如何应对？是否会出现能够回溯决策过程的新算法？从学习型人工智能算法的梯度中推导出“生活规则”在多大程度上成为可能？对已知算法的改进，例如最近被推广的“逐层相关性传播”（LRP），是否足够成熟，能为现有的神经网络增加透明度？或者，是否会由那些设计之初就具备透明度的新方法占据主导地位？例如，你可以从维度较低的子问题入手，这些子问题涉及的方面较少，更容易被理解，并且人类或许仍能理解其中较少的相互依赖关系？\n\
  *   是否有可能对这样一个“黑箱”的输出应用另一种算法，以显示哪些参数（或参数组合）导致了“是/否”的决策？\n*   如果透明度方法得以发展，如何对其进行分类，以便数据科学家知道在哪种情况下可以应用哪种算法？\n\
  *   你认为近期塑造可解释人工智能的举措会很快取得成功吗？或者，人们是否会像“学会”信任他们的网络电视设备或 Alexa 设备那样，逐渐习惯信任人工智能？\n\
  *   在我们的业务生活中，还有哪些地方会遇到黑箱？我们又在哪些方面理所当然地接受了它们？例如，因为组织不愿被迫泄露其商业机密？\n*   如果所有数据科学家都使用同样少量的分析库和训练数据集，那么当其中一个存在偏见时，我们是否会接受其更严重的负面影响？\n\
  *   我们最终是否会拥有主要取决于算法影响力的伦理标准？数据科学家在选择或开发最适合特定问题的算法之前，是否能够（甚至必须）审查法律？组织是否会制定伦理准则（“负责任的人工智能政策”），以赢得超越法律要求的信任？\n\
  *   对于单个数据科学家来说，遵守所有这些“非技术性”准则会有多复杂？对于数据分析主管来说，确保整个团队合规行事又有多复杂？是否有可能对合规性进行审计？\n\n\
  这场讨论并非基于一个假设，即我们可以让所有现有的人工智能算法都足够透明。但对于其中一些算法，这肯定将成为可能，而其他算法则可能实现部分透明。例如，设想一个两步算法：第一阶段基于测试数据的训练来制定一套规则；第二阶段则应用最合适的规则，由于复杂的计算已在第一阶段完成，第二阶段可以近乎实时地进行。这样的算法可以共享在第二阶段中选定并应用了哪些规则。\n\
  \n你仍然不知道**为什么**这些规则在特定情况下被认为是最合适的，但至少你可以检查是否存在潜在缺陷，即某条规则被证明是客观错误或带有歧视性的。\n\n最后，在算法的有效性与“可解释性”之间进行权衡可能既成为可能，也很有必要。人工智能解决方案提供商可能被迫降低算法的有效性，以遵守要求最低程度透明度的法律。\n\
  \n可以预期，此类监管将来自欧盟，这一点可以从其 2020 年 2 月发布的《人工智能白皮书》（欧盟委员会，2020 年）中看出。在该白皮书中，透明度被确定为欧盟委员会人工智能监管框架的七项关键要求之一。\n\
  \n在该白皮书第 15 页，欧盟委员会指出：\n\n> *缺乏透明度（人工智能的不透明性）使得识别和证明可能违反法律的行为变得困难，包括保护基本权利、分配责任以及满足索赔条件的法律规定。因此，为了确保有效适用和执行，可能有必要在某些领域调整或澄清现有立法……*\n\
  \n建议密切关注事态发展，以防您的组织受欧盟立法管辖，或希望在任何一个欧盟国家开展业务。出于伦理原因，无论您身处何种情况，都应考虑这样做！\n\n脚注 1 2\
  \ 3 4 5\n\n"
- "# 21. 危机中的数据管理\n\n![../images/499948_1_En_21_Chapter/499948_1_En_21_Fig1_HTML.jpg](img/499948_1_En_21_Fig1_HTML.jpg)\n\
  \n**图 21-1** 为危机做准备\n\n## 为危机做好准备\n\n### 想象那些难以想象的事\n\n在我担任的一个数据管理职务中，我和我的团队曾为我们能想到的任何危机做好了准备。我们的电脑里装满了优秀的工具和数据。然后，一场勒索软件攻击袭击了整个组织。我们公司并非特定目标，但勒索软件扩散到了我们的网络中。我们所有基于\
  \ Windows 的系统都被感染，网络在几分钟内瘫痪。\n\n一个由才华横溢的数据科学家、数据分析师和项目经理组成的团队最终只能坐在办公桌前，没有一台可用的个人电脑或笔记本电脑。当然，我们所有的危机计划都设想利用计算机来解决问题。\n\
  \n类似地，直到 2019 年，世界各地的组织都拥有出色的应急计划，所有这些计划的第一步都是让人们聚集在一起，共同评估形势并组建行动小组。2020 年初开始的新冠疫情危机需要这样的行动小组，但正是为了对抗这场危机，物理会议突然变得不可能。\n\
  \n当您为危机做准备时，要从过去的危机中吸取教训，但不要止步于此。想象那些难以想象的事！\n\n您可能不必走极端，去为太空中的某个释放强烈无线电波、导致地球电信中断的事件做准备……不过，为什么不呢？\n\
  \n当然，您不必想象*所有*可能引发危机的原因。但换个角度，列出您组织业务中所有不可或缺的方面，怎么样？毕竟，应急计划的适用性通常取决于影响，而不是危机的起因。\n\
  \n要求您的团队打破常规思维，概括过去的危机，梳理几个流程，并确定执行该流程所需的所有方面。\n\n您应该包括那些所有人都认为理所当然的元素——稍后在流程中再来考虑它们的概率。问问自己：“如果\
  \ X 方面不可用，会有什么影响？”记录下所有想法。\n\n在接下来的一轮中，您可以专注于与数据相关的方面。数据在哪些方面是问题的一部分，又在哪些方面可能是解决方案的一部分？\n\
  \n最后，考虑一下概率。大部分准备工作应投入到（非致命性）影响与概率乘积最大的情景中。\n\n\n\n### 做好活动优先级的准备\n\n查看数据办公室成员今天正在进行的工作。所有这些活动都很有用——但哪些是至关重要的？准备好暂停那些在危机期间“仅有用”的活动，从而为危机专项活动腾出精力。\n\
  \n你在正常时期所做的任何准备工作，都能在紧急情况下为你节省宝贵时间。而新冠疫情可能为你提供一个独特的理由，让你在正常职责之外为危机做好准备。\n\n随着时代变迁和人员流动，你可能会希望不时与团队一起审查计划。\n\
  \n### 成为组织危机计划的一部分\n\n对危机的任何应对都需要数据。面对危机，人们可能会重拾旧习，试图自行寻找数据，甚至可能退回到凭直觉做主要决策的状态。\n\
  \n因此，至关重要的是让组织做好准备，在此类情况下依赖数据。数据办公室的角色必须事先制度化——试图在危机期间才这样做可能为时已晚。\n\n这就是为什么你需要将危机管理作为常规沟通的一部分，与其他领导者进行讨论。\n\
  \n此外，你可能会希望确保数据办公室参与任何企业危机前规划，并自动成为危机应对团队的一部分。你不想在危机开始时浪费精力去争取被倾听。大多数灾难都具有跨职能的相关性，数据管理也是如此——这也是数据应处于任何应急计划核心的充分理由。\n\
  \n数据办公室的哪位成员应被任命为“危机负责人”？答案很直接：如果一场危机不值得首席数据官亲自领导，那它就不是真正的危机。\n\n## 掌控危机\n\n###\
  \ 与公司优先级保持一致\n\n所有优先级在危机中都会发生变化，并且随着危机的发展可能持续变化。为了设定正确的数据优先级，与董事会商定的危机优先级保持一致会有所帮助。换句话说，你将执行战略对齐的“快速通道”版本（参见第\
  \ 4 章）。这种方法不仅确保你支持正确的目标，还有助于捍卫你的活动免受批评。\n\n当然，你应该利用作为危机应对团队一员的机会，为优先级的设定过程提供意见。\n\
  \n### 不要试图成为英雄\n\n如果你试图赢得名声，是不会成功的。名声应被视为可能的结果，而非目标。\n\n当年我们遭受勒索软件攻击时，最大的风险是收入损失，因为这会耗尽我们的现金流。其结果是，每个人都竭力确保所有已提供的服务都能实际向客户开具账单。\n\
  \n解决这一挑战可能会让你声名鹊起。但我们认为没有必要成为处理这个问题的第十个团队，也不想让其他人让我们这些数据人员接手。\n\n相反，我们密切观察了局势。我们很快意识到，主要风险与收入损失相反：不同的团队独立恢复了交易数据，这导致一项已提供的服务有被多次开票的风险。\n\
  \n我们决定建立一项交易记录匹配分析。我们几乎无法以 100%的确定性找到两条描述同一笔交易的记录——但我们也不需要。对数百万笔交易进行概率评分的计算，将我们引向了系统性重复产生的区域。\n\
  \n我们的重复项发现为组织增加了价值，与其他所有团队恢复交易的努力相辅相成。最终，我们一起受到了表扬。然而，如果没有人解决重复开票的风险，尽管所有参与方付出了巨大努力，也不会有人得到表扬。\n\
  \n### 准备好你的团队\n\n你的团队绝不能将这种情况视为“某人的危机”，而应视为“我们的危机”。这对于你采取行动的能力至关重要。因此，你应该尽快、尽可能广泛地与团队中的每个人分享这一信息，最好在最初的危机会议上进行（无论是面对面还是远程）。\n\
  \n你可以传达以下信息：\n\n*   明确团队成员每个人比组织更重要。安全和稳定具有最高优先级。\n*   分享当前局势对组织的严重性。坦诚相待。\n*  \
  \ 强调这个团队可以采取行动应对局势：我们或许无法结束危机，或解决所有由此产生的问题，但我们至少能够减轻影响。而这可能对组织的生存至关重要！\n\n### 倾听你的团队\n\
  \n危机期间的第一个问题不是*如何*做正确的事，而是：*什么*是正确的事？\n\n数据办公室的答案不一定非得来自首席数据官一人。很可能会有时间和空间进行头脑风暴——利用好它！即使你已经有想法，也不要过早抛出。并且要准备好，在头脑风暴过程中随时抛弃你的想法。\n\
  \n### 规划你的行动\n\n与所有变革一样，将需要新的活动，某些现有活动会变得更加关键。同时，面对有限的资源，其他任务需要减少甚至停止。在前一类活动中，将有维持业务运行的活动、衡量影响的活动，以及建议战术步骤的活动。\n\
  \n你应该随时准备好一份全面的数据办公室活动清单（以项目符号列表形式），以便危机应对团队甚至董事会可以设定优先级（或者更理想的是，确认你的提议），而不会冒遗漏重要事项的风险。这一步将帮助你停止提供一些人们已习惯但危机期间相关性较低的数据服务。\n\
  \n在组织层面，危机相关的协调活动应整合到数据办公室内部的危机核心团队中。该团队还将与其他实体建立直接沟通渠道，以加快响应速度。\n\n### 管理紧急状态\n\
  \n根据危机的严重程度，公司的一些规则和原则可能需要暂时解除或修改。每当你认为在数据领域需要这样做时，请获得危机应对团队的批准。\n\n有时你可能需要申请全权委托，以免陷入两难境地：既要避免违反组织规则（这可能让你变得脆弱），又不得不为每一次偏离规则进行请示（这可能拖慢你的进度）。\n\
  \n数据领域的典型案例涉及数据隐私或数据安全。当然，你会以必要的谨慎态度使用任何被授予的自由。\n\n## 从危机中学习\n\n### 危机何时结束？\n\n\
  大多数危机并没有一个正式的结束日期。你通常可以预期情况会随时间好转。然而，你应该始终有意识地切换到正常模式。因此，在危机期间就结束标准达成一致是很有用的。\n\n\
  回归“正常模式”可能并不意味着回到危机前组织的运作方式。危机可能已经改变了组织、其行业（通常由技术进步引发），甚至整个世界，正如 2008 年金融危机和 2020\
  \ 年新冠疫情所观察到的那样。\n\n\n\n### 危机即催化剂\n\n危机往往催生创新，而这些创新在正常情况下可能需要数年时间才能获得所有相关利益方的认同。由于许多创新都与数据相关——尤其在数字化领域——此类非常时期正是绝佳机遇。\n\
  \n危机过后，组织需要决定是保留这些创新，还是回归旧有的工作方式。\n\n与此同时，那些在危机期间不得不暂停的某些活动，或许事后发现并无必要。我回想起曾被迫停止的无数报告，最终发现最初的申请者早已离职多年，而这些报告也无人问津。\n\
  \n你不妨借此机会，摒弃所有被证实可有可无的活动——让团队成员将精力投入到创造更高价值的工作中去。\n\n### 经验教训\n\n危机期间，你学会应对危机，但也能收获远超危机本身的经验。你会重新认识自己的组织、行业和客户。因此，不仅要记录\"\
  危机教训\"，更要记录在此阶段发现的各类行为模式，这将是个好习惯。\n\n你甚至可能发现，需要设立一个不同的数据管理组织架构，才能妥善应对危机后的局面。若将发现成果连同初步结论和方案纳入\"\
  经验教训\"文档，将更易于论证变革的合理性——这对于你计划扩充职责或业务领域至关重要。\n\n### 庆祝仪式\n\n如同每个完成的项目，团队应当为共同渡过危机举行庆祝。这往往是首次集体回顾过往的机会。庆祝期间分享的故事（\"\
  还记得当时我们怎么应对……吗？\"）将长久留在人们记忆中，成为组织遗产的一部分，并营造归属感。忠诚正建立于这样的经历。\n\n庆祝能力是刻意宣告危机结束的另一理由，同时需强调善后工作依然繁重。若无明确的时间节点，组织可能在不经意间回归日常运营，而忽视危机期间员工付出的卓越努力与成就。\n\
  \n危机期间，许多员工展现出超乎常规的投入。你或许希望维持这种势头。为此，不应奖励已取得的成果——这会使他们松懈享受。相反，要赞扬他们的付出、勇气和积极进取的态度。这种方式能激励人们将这种表现延续到任何已完成的任务或已克服的危机之外。\n\
  \n## 并购中的数据\n\n![../images/499948_1_En_22_Chapter/499948_1_En_22_Fig1_HTML.jpg](img/499948_1_En_22_Fig1_HTML.jpg)\n\
  \n图 22-1\n规模相当、业务趋同未必降低难度\n\n### 当下问题何在？\n\n众多组织间的合并——无论是强强联合还是收购兼并——都以失败告终。\n\n\
  随着并购在自由市场经济中成为常态，人们逐渐形成共识：多数失败源于对文化与人文因素的忽略。\n\n这一认知促使全球组织更关注并解决并购中的文化问题，从而避免了许多历史性错误。\n\
  \n不幸的是，这种关注度的转移，也导致组织低估了运营兼容性的重要性。\n\n因此，当代多数整合失败案例并非源于文化问题——尽管某些顾问试图让我们相信这一点。\n\
  \n相反，越来越多的并购因平庸的**兼容性**问题而折戟。无论是销售区域不匹配，还是产品组合结构迥异，大多数非技术性兼容问题都围绕**数据**处理方式的不同展开。\n\
  \n因此，数据问题不能作为并购后的补救措施。相反，整合两个或多个组织的所有环节，必须同时从业务视角、技术视角（适用时）和数据视角协同推进。\n\n正因如此，除了制定不同软硬件环境的技术整合方案，成功的整合还需要系统性、跨职能的数据整合策略。\n\
  \n\n\n## 整合规划\n\n典型的整合规划基于若干主题领域，需为这些领域设立工作组，并使其并行启动工作。常见的挑战包括工作组之间的相互依赖关系、以短期成功为导向的激励方案，以及对数据层面的忽视。\n\
  \n处于并购情境中的组织，理想情况下应遵循与任何业务变革流程相同的逻辑步骤顺序，并且从一开始就重点关注数据：\n\n1.  **市场定位**  \n    我们希望合并后的组织代表什么？客户理想中希望从我们组织购买什么？为什么他们会选择我们而非竞争对手？\n\
  \n2.  **目标服务组合**  \n    我们未来的产品和服务是什么？我们打算如何构建和识别它们？预期的复杂度水平如何（例如，按市场或本地化功能单独定义的一系列产品）？我们能将服务组合结构化到何种程度，以便后续步骤（如生产或开票）能够自动化？我们的目标服务组合在哪些方面、在多大程度上偏离了之前的任何一个组合？\n\
  \n3.  **我们的目标流程是什么？**  \n    我们的服务组合需要流程来支撑。必须确定这些流程可以在多大程度上被预先定义，以及在哪些情况下，所提供服务的个性化迫使我们改用策略来应对。\
  \  \n    我们应该设计不同的备选方案，进行比较，并评估每个选项的影响。在确定成本、时间和资源可用性方面，我们应该尽可能精确，这些是在每种情况下选择目标流程的关键因素。\n\
  \n4.  **数据需求是什么？**  \n    我们如何构建数据的各个方面？我们在哪些方面存在数据模型不兼容？我们在哪里可以匹配两个（或更多）数据模型，在哪里可以找到变通方案，以及在数据存储库和日常运营中，哪些情况下无法在不丢失信息的前提下融合两个世界？\
  \  \n    适用与第（iii）点相同的步骤！需要开发不同的目标数据模型，并应用相同的标准来选择一个目标数据模型。这一点至关重要。  \n    在未确定目标数据模型作为工作方向的情况下，绝不允许进行任何软件开发。中间模型是可能的，甚至通常是必要的——但目标模型必须始终明确，并且必须优先考虑。\n\
  \n5.  **技术实施**  \n    基于第（iii）和（iv）点的结果，我们需要制定一份路线图，再次考虑变更成本。即使纯粹的成本计算并不支持，快速见效的方案也是可以接受的。\
  \  \n    这是出于心理层面的考虑：人们需要很快看到成果。如果他们一直等到流程的最后才有人启动最终解决方案，他们就会失去忠诚度。此外，每个人都可以从使用中间解决方案中学习，而这些学习成果可能有助于改进目标解决方案的设计。\
  \  \n    此外，还需要处理一些最终会被废弃的工作，特别是在不同区域以不同速度推进时，为了获得临时的兼容性。^(⁵⁵)  \n    需要规划出所有区域时间表之间的依赖关系，以确定关键路径。没有什么比九个已完成的工作流被迫等待第十个更令人恼火的了。\
  \  \n    不言而喻，这种方法不应被视为严格的顺序流程。它必须被视为一个迭代过程。几乎没有比并购更难提前规划的事情了，因为双方的人员每天都面临着意外。\n\
  \n## 数据方法\n\n以下是在规划作为并购或整合一部分的数据处理时的一些建议。\n\n### 谁应该管理数据整合？\n\n挑战不应由直接受影响的业务部门各自孤立地解决。这种方法很容易导致解决了一个团队的问题，却对其他团队产生不利影响。\n\
  \n每次并购都应从评估整合过程中的数据问题开始。这项活动将产生一份长长的互操作性和报告方面的挑战清单，通常基于数据映射问题。\n\n为了充分应对“并购中的数据”这一议题，应尽早明确数据领导权。如果合并导致两个原有的数据办公室并存，则应尽早决定由谁担任唯一的\
  \ `CDO`，同时两个团队的所有成员都需要为未来的工作做出贡献。在最终领导决策做出之前，尝试与你的同行达成“停火条件下的选美比赛”的共识。如果你获得了领导权，应立即设立一个专门的（临时）实体，负责整个并购计划中的数据方面事宜。如果并购或整合有专门的预算（通常会有），你应该争取合理的份额，这样你就能在不严重影响数据办公室日常工作的前提下处理数据问题。\n\
  \n### 理解动机\n\n无论你面临的是整合还是收购，理解其驱动因素至关重要。这有助于决定是快速整合还是彻底整合（或者在两个极端之间找到平衡的方法）。\n\n\
  一个长期规划的战略性并购更容易采用“一步到位”的方法，而两个都因规模太小而无法生存的参与者进行的生存型并购，则可能首先侧重于“无论如何先让它运转起来”。\n\n\
  在你试图用与数据相关的考量来影响决策之前，必须充分理解管理委员会（甚至可能是潜在的监事会）背后的优先事项。\n\n但你可以大致预期一个组织决定进行统一背后的不同动机，无论是出于并购、战略还是运营上的考量。\n\
  \n一些组织旨在整合以前独立的国家组织或实体，以便能够对其进行统一管理，并更轻松地比较其绩效。\n\n有时，组织希望在所有实体中实现统一的产品供应，或者希望一个单一品牌代表相同的价值主张。\n\
  \n其他组织决定统一，以便能够外包或自动化标准化流程。（经验表明，组织应该在**外包之前**先进行标准化。如果你为同一活动外包了各种不同的流程，管理供应商将变得繁琐，成本可能会失控。^(⁵⁶))\n\
  \n在任何这些情况下，未来数据整合的业务案例通常应基于底层驱动因素的主要目的。\n\n\n\n### 专注于互操作性\n\n在任何合并或收购中，来自不同方的数据都必须汇集到一起——无论是出于运营目的、联合的订单到现金流程、客户可见性，还是财务报告需求。\n\
  \n这就是为什么首要的集成目标是*互操作性*，即一方需要能够捕获、解释和处理来自另一方的数据和/或系统。互操作性的一个重要方面是针对公司处理的所有事物（从原材料到发动机、产品和员工）采用统一的识别逻辑。\n\
  \n这个互操作性目标必须代表“新世界”，而不是两个“旧世界”中的任何一个。这意味着，在大多数情况下，收购组织也需要做出改变（除非收购规模相对较小）。\n\n你还需要为联合报告建立映射。集成过程中典型的业务需求声明如下：\n\
  \n- “财务部门报告被收购组织损益的方式需要一些改变。”\n- “谁能告诉我，一个实体的哪些数据已经可以在另一个实体的数据仓库中获取？”\n\n虽然一个完全集成的组织会在集成完成后自然而然地解答这些问题，但在集成过程之前和期间，你还需要付出额外的努力来建立一个合适的报告环境。\n\
  \n即使在创建联合数据仓库和在不同实体之间物理传输数据方面取得了良好进展，数据元素的**结构和含义也往往存在巨大差异！**\n\n请记住：如果你在任一方堆积了遗留问题，数据挑战将会成倍增加。\n\
  \n> **注意**\n>\n> 这些挑战并非并购所独有。对之前独立的国别组织或实体进行统一化，可能遵循完全相同的方法。从技术上讲，这些不同的实体是刚刚成为同一组织的一部分，还是已经在同一组织内共存多年，这并没有太大区别。\n\
  \n### 制定高层计划\n\n无论整合组织背后是什么驱动力，经验表明你可以应用以下通用步骤序列：\n\n- 确定不同实体中各主题的最佳实践。\n- 以“可复用”的方式解决单个问题。创建通用的流程、指南等。\n\
  - 确定最合适的流程和应用程序（可能来自法人实体、子公司或中央职能部门）。\n- 修改这些流程和 IT 应用程序，使其能够协同工作。\n- 选择一两个初始实体来试点解决方案。\n\
  - 在全球推广时应用试点的经验教训。\n\n### 确定“最佳组合”解决方案\n\n每个实体可能在某些活动中表现最佳，或者使用更好的模型。你可以利用这种情况，构建一个比任何一个实体都更好的目标配置：\n\
  \n- 对所有待集成实体的解决方案和流程进行一次盘点。\n- 使用相同标准对其进行衡量，以了解哪个实体在哪个流程中表现最佳。\n- 确定现有的最佳解决方案。检查它们的兼容性和互操作性。\n\
  - 为目标配置选择最佳的有效组合。你可能需要做出妥协，因为不同实体可能在不同流程中表现最佳，而这些流程可能无法完全互操作。\n\n### 请勿（过多地）并行创新\n\
  \n有时你会面临挑战，即人们不同意在整个集成期间暂停创新。请抵制这种想法。坚持“先统一，后优化”的原则。同时进行统一和优化是失败的秘诀。\n\n此外，不尝试同时进行创新的统一过程会更快，而保持这一过程的短暂至关重要。\n\
  \n更重要的是，通过成功的集成，创新和优化将变得容易得多，因为你可以专注于单一的流程和数据结构版图。\n\n最后，无论你的集成在何处遵循最佳组合方法，你都会在不知不觉中实现创新，因为你正在用更优的解决方案替换现有方案。\n\
  \n## 数据映射\n\n为了成功集成两个或多个不同的实体，你需要对整个组织的所有部分有一个一致的视图。为此，你需要映射数据字段和数据元素。\n\n你应该利用这个机会，并尽可能朝着一个规范化的模型努力，该模型将导向一个达成共识的业务目标状态。\n\
  \n如果这种状态尚未定义，你应将其列为最高优先级——它也是其他集成活动所必需的。\n\n如果这种定义（在技术上或法律上）不可能实现，你的工作则应基于商定的临时步骤，否则任何有针对性的合并活动都不可能进行。\n\
  \n数据映射过程不是一项技术活动！它需要审慎的业务决策。这就是为什么它绝不能仅由 IT 部门来完成。\n\n原因在于映射通常具有歧义性。当你无法找到完美的 1:1\
  \ 映射时，你需要找到一个接近的映射。但应该选择哪种可能的方案呢？这个决定应基于业务考量：你需要考虑对组织业务的直接影响，还要考虑与最终目标的符合性。\n\n\
  一旦所有业务决策做出，数据办公室与 IT 架构团队需要紧密合作，以某种格式记录结果，该格式允许在 IT 应用程序中明确无误地实现底层流程。\n\n典型的产物包括数据流图、实体-关系模型（用于目标步骤和过渡步骤）以及规范数据模型。\n\
  \n### 组织\n\n你的“集成中的数据”组织需要一个联系人，负责所有映射需求。此人通常不执行映射工作，而是协调和统筹所有映射活动。严格的协调至关重要，以避免工作重复以及不同职能计划之间映射的缺口和不一致。\n\
  \n由此实体协调的所有映射计划都需要从数据角度进行**完整性检查**，就像你的组织对其他任何集成活动所做的那样。以下是一个典型的检查清单：\n\n- 业务问题已陈述。\n\
  - 数据负责人已确定并准备好承担业务所有权。\n- 跨职能问题已得到解决。\n- 交付物清晰（需同时考虑业务交付物和数据交付物！）。\n- 底层业务决策已做出。\n\
  - 依赖关系明确。\n- 时间表已定义。\n- 工作已组织。\n- 敏捷变更流程已就绪。\n- 遵循“数据原则”（参见第 6 章）。\n\n一旦你处理了所有这些要点，“数据映射”实体的活动应仅限于监控、盘点和记录。\n\
  \n\n\n### 具体映射案例\n\n没有“一刀切”的解决方案！典型的映射类型包括：\n\n1. **1:1 映射**  \n   这是所有映射案例中最简单的一种，适用于数据中单个元素或结构方面虽然称呼不同但含义完全相同的情况。\
  \  \n   其结果是形成一个传统的**术语表**主题：你需要定义主要表达式以及别名/同义词。这仍然需要各职能部门之间的协作，以确保你能做出最佳选择。\n\n\
  2. **1:n 映射**  \n   1:n 映射的一个典型例子是用代码表示的属性列表：一方针对多个不同变体使用了多个代码，而另一方则将所有变体归入一个代码下，因为它们在操作上没有差异。\
  \  \n   适当的映射需要理解操作层面。你需要与所有受影响的业务职能部门（例如，生产部和产品管理部）紧密合作，以找到最佳的映射方案。  \n   在某些情况下，如果无法通过其他方式避免丢失操作上必要的信息，你甚至可能不得不更改操作流程，以便在跨实体边界的处理过程中正确启用。\n\
  \n3. **n:m 映射**  \n   想象以下情况：在两个需要映射的属性列表中，粒度有时在一方更细，有时在另一方更细。  \n   与上一种情况相比，你面临额外的挑战：你不能简单地决定选择粒度更细的一方并以此为起点。相反，必须接受或解决信息可见性的损失。\
  \  \n   这种情况的解决方案或缓解措施通常通过在集成过程中的变通办法来实现。最大的挑战通常是组织不愿意投入资金修改那些计划在不久后被淘汰的工具和流程。 \
  \ \n   一个典型的解决方案是重新定义现有但未使用的代码。这伴随着歧义或误解的高风险。因此，此类案例需要仔细记录、传达，最重要的是，在所有业务职能部门中一致应用。\n\
  \n4. **无对应代码**  \n   在这种情况下，一方使用的代码或数据元素是另一方所不知道的。  \n   如果目标设置中要求使用此类代码，组织可以借此机会将其引入目前未使用该代码的一方。\
  \  \n   然而，如果该代码在集成后应被淘汰，那么与产品集成活动的协调就至关重要：哪些服务/功能以及可见性将不再作为哪个产品/服务的一部分提供？从何时开始？这些决策将有助于理解变通办法或对现有解决方案的修改是否合理。\n\
  \n5. **一维结构差异**  \n   这里使用的是相同的维度，但结构不同。  \n   一个典型例子是报告日历，其基础周期可能不同。在存在共同分母的情况下，这种差异相对容易映射：如果一方按日历年度报告，而另一方按会计年度报告，你可以使用“月度报告”作为共同基础。\
  \  \n   当你查看周度报告（通常是运营视角）与月度报告（典型的财务视角）时，情况就变得更加复杂。要映射这两个基础周期，可能需要妥协或组织变革。\n\n6.\
  \ **复杂结构差异**  \n   有些情况基于完全不同的逻辑方法，导致数据结构难以映射。  \n   一个来自运输行业的好例子是“货运”（或“托运”）的定义。这远不止是使用了不同的术语。其含义可能在多个维度上有所不同：单件与多件、生命周期、可见性、“合并开票”与“合并运输”、海关处理，等等。没有标准的映射方法，但很明显，需要跨职能协作。\n\
  \n7. **含义代码**  \n   这类代码的一个字段中包含含有信息的子字符串。例如，客户标识符的前两位字符是客户所在的国家代码，或者总账科目代码的第一位数字用于分类科目类型。\
  \  \n   目标模型永远不应预见到“含义代码”。它应该使用定义明确的属性来代替。当你今天面临这样的挑战时，你应该分解代码，并将属性添加到目标规范模型中（无论如何你都需要定义这个模型）。此外，代码结构需要作为元数据的一部分进行规定。克服含义代码的计划需要长远的眼光，以及对建立在此假设基础上的所有应用程序和流程进行详尽的盘点。\n\
  \n脚注 1 2\n\n"
- "# 数据驱动创新\n\n![../images/499948_1_En_23_Chapter/499948_1_En_23_Fig1_HTML.jpg](img/499948_1_En_23_Fig1_HTML.jpg)\n\
  \n*图 23-1*  \n*并非所有人都拥抱创新*\n\n## 数据如何驱动创新？\n\n\n\n### 揭秘创新\n\n第一步，不妨先来揭开“创新”的神秘面纱？\n\
  \n![../images/499948_1_En_23_Chapter/499948_1_En_23_Fig2_HTML.png](img/499948_1_En_23_Fig2_HTML.png)\n\
  \n**图 23-2** – 创新不止于一个好点子\n\n#### 1. 创新总是颠覆性的？\n\n创新未必意味着“下一个重大突破”。你无需设计出一台`永动机`或点铁成金的流程才算创新。若基于一个好想法，渐进式的改进同样极具创新性。\n\
  \n人们可能拒绝将影响力微小但绝妙的想法称为“创新”。但别让这阻碍你在各个层面进行创新！\n\n创新是一种态度。你应该每天都尝试创新。\n\n#### 2. 大公司无法创新？\n\
  \n创新与规模无关。\n\n员工的创新能力与其所在组织的大小无关。\n\n大型组织有时可能因官僚主义而无法快速实现想法——但它们的成熟度常能避免过早实施。这有助于专注于有前景的想法——同时不失创新性。\n\
  \n归根结底，创新主要关乎个人心态，而非组织规模。\n\n#### 3. 创新只属于创意专家？\n\n不，创新并非职业“创新者”或创新部门的专属话题。更重要的是，创新并非创意人士随意脑力活动所产生的不可规划的结果。\n\
  \n创造力对创新确实至关重要，但这既关乎天赋，也同样关乎技巧与组织方法。\n\n请预期创新是 10%的绝妙点子加上 90%的辛勤工作。\n\n图 23-2 表明了创新工作中需投入多少精力来营造一个利于创新的环境，以及将创意转化为具有商业效益的创新成果。\n\
  \n#### 4. 创新需要更多数据？\n\n如今，创新者并不为收集或生成数据而苦恼。大多数组织仅使用了已拥有海量数据中的一小部分。\n\n因此，建议首先专注于挖掘你已经掌握但尚未使用的数据。其次，大量数据可能已被采集，但除了支持日常运营活动外并未被利用。还有第三类数据，可以零成本或低成本收集。\n\
  \n仅这些数据源就蕴藏着巨大的创新潜力，以至于大多数组织甚至没有余力去处理额外的、可能收购而来的数据。\n\n在具体案例中或许存在例外，例如收购你明知会需要的数据，但通常而言，组织应专注于利用现有^(⁵⁷)数据，而不是堆积更多的比特和字节。\n\
  \n而且，你应记得，不应基于未来可能用得上而收集个人数据，以免与 GDPR 等隐私法规冲突。\n\n#### 5. 创新者必须了解自己的产品？\n\n许多组织围绕其产品大力创新，取得了技术上令人瞩目的成果。但工程或流程设计上的精密性并不能保证创新成功。\n\
  \n相反，组织需要预测客户和消费者的想法、渴望和偏好。这包括深刻理解是什么促使他们改变主意。毕竟，你希望理解*并*影响你的客户。\n\n但理解自身业务的需求又如何呢？嗯，对你现有产品过于熟悉甚至可能适得其反。你很容易陷入思维定势。\n\
  \n据报道，柯达数码相机的发明者史蒂文·萨松曾说过：“创新最常来自那些对话题一无所知的人。”\n\n而柯达自身恰恰证明了这一点。想象一下，发明一种与所有现有相机技术都不同的相机技术，这是多么富有创造力。而我们都知道柯达在将这种创造力转化为创新方面有多么失败。他们以为自己知道相机应该是什么样子：*镜头后面必须有一卷胶卷。*真的吗？\n\
  \n创新的一个关键方面是质疑你今天所拥有**一切**的能力。这并非易事，因为审视那些你多年来一直认为不可或缺（甚至可能是你自己开发出来的）的东西，在情感上极具挑战性。\n\
  \n人们需要获得的正是这种能力，而非现有产品的知识。\n\n#### 6. 创新只关注客户？\n\n创新不仅仅在于创造直接影响客户所获价值的新事物。\n\n这里有一个简单的例子：更高效或更环保地进行生产可能极具创新性，但并不一定要改进产品本身。\n\
  \n实际上，通过创新给客户留下深刻印象，却未为其创造切实价值，这也可能是一种理想的（附带）效果。\n\n但创新也可以明确地关注其他相关的利益相关者群体：所有者、供应商和员工。\n\
  \n- “单位投入价值的产出价值”的任何提升通常都受到股东青睐，从而导致组织市场估值上升。投资者对“创新”的定义通常比单纯的客户满意度更广泛。\n- 供应商不仅是创新的良好目标，让你能更高效地获取物资和服务。他们也是沿价值链进行协同创新的绝佳潜在合作伙伴。\n\
  - 创新可以让你的组织对现有和未来员工更具吸引力，即使不触及产品质量或生产效率。改善工作条件、更清晰的职业发展路径或更好的个人发展机会，都可以通过创新实现，而不仅仅是加薪。\n\
  \n### 什么是“数据驱动创新”？\n\n想到数据与创新，你首先会想到什么？是数据处理方法的创新，例如无监督学习的新应用，或是云端的多域主数据管理？\n\n\
  所有这些都既迷人又重要，但时常会掩盖另一个方面：数据管理作为业务创新的推动者。\n\n换句话说，数据驱动型组织不会首先改变创新的人员和流程。相反，他们会为这些人员和流程配备数据和工具，以简化其工作。\n\
  \n而且，探索那些基于数据或后来通过数据验证的、常规却富有创新性的想法，确实蕴含着巨大的机遇。\n\n这就是“数据驱动创新”。它已被视为一门专门学科，人们开始使用缩写`DDI`来指代。经合组织早在\
  \ 2013 年就发布了定义。^(⁵⁸)\n\n必须认识到，`DDI`并非与“传统”创新竞争——它扮演着支持角色。同样的研发实验室将继续致力于创新解决方案，只是越来越多地由数据驱动。\n\
  \n\n\n### 利用数据进行创新\n\n数据不仅仅是运营支持或预测的议题。它可以通过多种方式为创新提供动力。\n\n特别是，数据可以揭示组织内外的相关性和因果关系。它还可以通过确定此前未知的需求或新的产品机会，来回答从未被问及的问题。\n\
  \n但数据也提供了定制产品或服务的替代方法，因为它有助于衡量客户为新产品或不同产品付费的意愿。\n\n归根结底，大多数组织的创新能力并非受限于缺乏创意——只要员工能设身处地从消费者角度思考，创意就会层出不穷。相反，商业化进程常常因为对其商业成功可能性存在相当大的不确定性而被阻碍，换句话说，就是由于风险规避心理。\n\
  \n当然，数据并不局限于验证已有的创意。即使是新产品或服务的开发也可以得到数据的支持，例如，通过模拟数十种属性或成分的数百万种组合——如果手动操作，这需要耗费人类大量时间。\n\
  \n此外，数据可以开辟产品推广的新途径——通过针对个人进行沟通，并展示创新产品如何满足个体不同的需求。\n\n但数据甚至可以支持诸如新生产流程的确定和验证这类普通意义上的创新。这些流程可以让我们以同样的价格生产出更好的产品，或者以更低的价格生产出同样的产品。\n\
  \n## 支持数据驱动的创新\n\n当然，如果只是空想，创新是不会发生的。不创新的组织将被那些积极创新的组织超越。这就是为什么仅仅允许数据驱动的创新是不够的。相反，组织需要主动创建一种数据驱动的文化——不是通过海报和标语，而是通过鼓励和奖励每一个个体。\n\
  \n但是，组织如何有效支持数据驱动的创新呢？\n\n### 找出障碍\n\n数据驱动的创新可能因为多种原因，在组织的不同层面陷入僵局。\n\n1.  **高层管理者。**\n\
  \n    创新是积极的吗？并非所有人都认同！那些帮助打造了成功组织（有时甚至历时数十年）的高管，可能会对现状以及组织过去取得的成就感到非常自豪。\n\n  \
  \  在管理层出现的第二个障碍，是经常将效率提升、成本节约与创新混为一谈：\n\n    **成本节约**会被竞争对手立即复制（或者，或许*你的*组织正在复制竞争对手？），因此你很难仅通过降低成本来赢得市场。\n\
  \n    相比之下，**创新**则是竞争对手难以轻易复制的东西。\n\n2.  **员工队伍。**\n\n    员工队伍已经为数据驱动型组织做好了准备，因为数字原住民是精通数据的。\n\
  \n    真的是这样吗？\n\n    要做出恰当判断，有助益的是认识到：私人数据处理与商业数据处理是不同的。\n\n    想想你的智能手机。它可以通过手指轻点完成一切操作。你不需要与任何人协调。\n\
  \n    这是你在商业中处理数据的方式吗？\n\n    我认为不应该，原因在于以下区别：\n    *   在个人生活中，是**其他人**在确保数据为你**服务**。\n\
  \n    *   在商业生活中，期望的是**你**确保数据为**他人**服务。\n\n    从这个意义上说，我们可以认为，那些**开发**智能手机的人才是精通数据的，而非用户。在你的组织里，你认识多少这样的智能手机开发者？\n\
  \n3.  **中层管理者。**\n\n    组织中有哪位管理者会公开承认反对数据驱动型组织？可能没有！\n\n    事实上，你几乎看不到有人公开反对成为数据驱动型组织的想法。相反，在许多传统组织中，可以观察到以下模式：\n\
  \n4.  **高层推动创新。**\n\n    公开支持数据和数字化是高管们的常见礼节。如果你读过像《福布斯》这样的杂志对 CEO 们的采访，你就会明白我的意思……\n\
  \n5.  **员工乐于接受。**\n\n    如果技术每天都能让你的个人生活更便捷，那么你很可能会在工作场所也欢迎这种进步！只要它不被视为竞争（威胁到自己的工作），数据驱动的进步通常被认为是积极的。\n\
  \n6.  **但****中层管理者****有顾虑。**\n\n    我说的是谁？那些不参与组织战略制定，但管理着规模可观团队（例如，分公司经理）的所有管理者。他们被期望作为倡导者和倍增器，将战略贯彻下去。但是，很多时候，创新正是在这里失去了动力。\n\
  \n    这些管理者是傻瓜吗？他们理解不了吗？\n\n    不，大多数中层管理者足够聪明，通常他们也喜欢创新的想法！但他们有充分的、非常个人化的理由不去推动变革。\n\
  \n    早在 2004 年，当 Rainer Meier 担任德国邮政企业传播部主管时，他就观察到了这一现象。他曾经称之为“中层管理之云”，并将其视为一个管理层级，在这里，知识得以沉淀，而变革则被视为一种威胁（Meier,\
  \ 2004）。\n\n    那么，这些顾虑从何而来？面对这种情况又该如何应对？\n\n    一个希望拥抱变革的管理委员会，或许希望建立一个渠道，让中层管理者能够发出自己的声音。随后，需要发现其中的模式，并对关键（且通常是合理的）问题给出可靠的答案。以下是处理创新时一些典型的顾虑例子：\n\
  \    *   如果我失败了怎么办？我只有一次机会吗？我失去的会不会比得到的多？\n    *   这对我有什么好处？它符合我的职业发展轨迹吗？\n    *\
  \   创新是否会分散我团队日常工作的精力（而这是衡量我的标准）？\n    *   如果我不理解怎么办？毕竟，创新往往伴随着新技术，而这些技术是我 30 年前在大学里没能熟悉的。\n\
  \n    成功的组织会将这些作为领导力发展的一部分，公开处理这些问题。你的组织有这样的计划吗？\n\n\n\n### 组织创新\n\n一个精心构思的框架有助于推动数据驱动的创新。我认为以下三个方面对于建立必要的坚实基础至关重要：\n\
  \n1. **创建合适的组织结构**\n\n在受保护的创新空间中推进创新想法会更容易。否则，创新就会被繁多的日常任务所淹没。\n\n如果您希望让您的组织能够利用数据进行创新，您可能会倾向于采用以数据为中心的研发方法。毕竟，相同的数据源可能为不同的产品或服务领域的创新提供动力。\n\
  \n然而，并非所有创新的数据工作都需要从日常业务中剥离出来并放入研发环境中。即使在常规部门内部，您也可能希望提供组织支持，以便人们能够在不受行政任务干扰的情况下推进创新想法。\n\
  \n如果您的组织足够大，那么投资组建一支训练有素、能将想法变为现实的数据专家团队是一项很好的投资。这些人可以支持来自不同部门、拥有有前景想法的同事。\n\n有时，即使是在阐述创新方法以及处理该方法的过程中，创造性的任务也需要不同的技能组合。因此，如果有人有了一个好主意，不要强迫那个人也完成所有后续步骤。您应该拥有那些既受过培训*并且*愿意接手的人。\n\
  \n2. **管理**整个**创新流程**\n\n有些人倾向于过早地放松下来，通常是在某个中间步骤交付了令人印象深刻的结果之后。\n\n这类结果的例子包括：广受赞誉的概念、已签字的软件以及成功的试点项目。\n\
  \n您需要防止创新流程就此止步。\n\n这时，一个详尽的“创新流程”描述就能派上用场。它涵盖了从构思和研究到产品化的整个链条，以确保在整个过程中，直到最后一步都得到充分关注。\n\
  \n一旦机会出现，一个好的创新流程就能确保该机会被识别、被正式化，并获得优先级的资源和分配——包括那些“苦差事”，例如通常繁琐的业务案例计算。\n\n请注意，形式化并不一定会扼杀创造力。相反，一个精心设计的流程可以防止富有创造力的人分心，同时确保所有必要的非创造性活动得以完成。\n\
  \n此外，所有相关的业务职能部门都需要在早期阶段介入。如果一个创造性的想法在受保护的环境中停留太久，许多关键的、非技术性的副作用就会从视线中消失。\n\n**示例\
  \ 1**\n\n设想一个考虑使用无人机进行货物配送的组织。\n\n仅仅这个创造性的想法本身并非创新！\n\n对这个概念进行试点相对容易，而此类测试的受控环境几乎能保证成功。\n\
  \n通过这样的举措，一个组织可以塑造其作为创新驱动者的声誉，正面的新闻报道也几乎是必然的。\n\n但随后艰苦的工作就开始了：\n\n1. 客户焦点：组织需要确定无人机配送能为客户增加价值的场景。客户为什么要为这样的服务支付（更多）费用？有多少客户会购买这样的产品？\n\
  \n2. 商业焦点：组织必须计算附加值，并通过以商业为导向的试点进行验证。这能为我们带来（更多）收入吗？\n\n3. 运营焦点：必须确定所有可能偏离理想流程的情况，例如故意破坏或无人机之间潜在的碰撞。需要在工程、流程设计和软件方面开发解决方案。结果需要实现可操作化，以便在日常工作中运行并可扩展。\n\
  \n4. 法律焦点：在日益受监管的无人机业务中，合规性至关重要——同时需要预见到新的、尚未监管的方面。安全和保障问题也需要得到妥善处理。\n\n总而言之，您可以预期，直到首次成功试点的努力，仅占整个工作的不到百分之十。\n\
  \n难怪在我们首次在媒体上看到那些著名物流企业的品牌配送无人机照片后的头两年内，没有一家主流物流公司建立起大规模的无人机业务。\n\n3. **使您的数据可用**\n\
  \n您应当组织好数据，以便所有潜在的创新者都能看到哪些数据可供他们使用。\n\n并且请给予他们所有人的访问权限。这种访问应包含来自数据办公室的支持。它还应附带所有关于数据的相关信息，例如其来源的可靠程度、时效、结构及其元数据，还有其质量，例如完整性、格式符合度等等。\n\
  \n考虑到您组织中潜在的创新者可能比有限的数据专家和研究工程师数量更多，这一点是很有帮助的。\n\n### 妥善处理业务案例\n\n在组织的产品组合中增加任何新事物之前，业务案例是不可或缺的。然而，在创新过程中，业务案例不应过早应用，因为这种做法可能会在探索所有使其盈利的选项之前，就扼杀一个有前景的想法。\n\
  \n在缺乏信息来构建全面业务案例的情况下，应预先考虑采取两步走的方法：从一个低成本的预研项目开始，以确定该想法的商业可行性；如果预研项目确认了其创新潜力，再启动实施项目。\n\
  \n### 将数据融入您的创新文化\n\n即使在创新文化高度发达的组织中，人们也常常不认为“数据”是创新的激励因素。他们想到的是头脑风暴、市场分析、创意管理等。\n\
  \n这个时候，“让我们问问数据！”的明确文化会大有帮助。\n\n当然，数据本身永远不会创新，就像赛车本身无法赢得比赛一样。但即使是最好的赛车手也会欢迎更快的赛车。因此，让我们鼓励最优秀的创新者利用数据来提高他们成功的几率！\n\
  \n为了让所有人参与进来（而不仅仅是“天生的创新者”），您绝对应该考虑公开奖励正确的行为：\n\n- 不应只是期待创造性想法出现并转化为创新，而应该让人们积极使用所提供的工具包。\n\
  \n- 创新者应当有勇气在无法再实现盈利时立即停止项目。这需要一种强大的文化，即奖励这种停止行为，而不是将其视为失败。\n\n- “每个部门拥有好故事的想法的数量”可以作为一项公开指标。这也适用于创新过程中的所有后续步骤，包括那些不太吸引人的步骤。\n\
  \n- 在早期阶段，应该允许人们进行探索，例如寻找其原始想法的更好变体。这就是为什么应该鼓励和奖励试错。您可以通过创建“探索空间”以及正式将工作时间用于创造性活动来实现这一点。（请将其视为“研发”的一部分，而不是损失的工作时间。）\n\
  \n好的例子将帮助人们理解数据的力量。这些例子不一定非得来自您自己的组织或您个人的经验，它们只需要是真实且可信的！\n\n\n\n## 将数据构想商业化\n\n\
  根据 NewVantage 在 2019 年的一项调查（Brown, 2019），仅有 **11%** 的首席数据官承担创收责任。\n\n许多组织可能错失了这一机遇，因为越来越多的组织正在将其整个商业模式建立在数据之上。\n\
  \n即使一个组织的主要目标并非直接基于数据商业化，首席数据官也不应该等待业务人员主动寻求帮助。\n\n相反，数据本身可能就蕴藏着机遇——无论是内部使用，还是作为外部产品提供。\n\
  \n### “十万客户”策略\n\n-   关于一个客户的信息只是奇闻轶事。\n-   了解 100 个客户才能获得初步洞察。\n-   拥有 10 万常规客户，从数据角度来看就是一座宝库。\n\
  \n如果你所在的组织拥有如此庞大的客户群，你可能希望制定一项策略来开发这项资产，甚至超越你的核心业务：即从你组织购买产品或服务的个人或组织。\n\n没有任何其他数据领域能像客户数据这样，将自身信息与外部信息结合能带来如此巨大的机遇：社交媒体了解很多你的客户，而这些信息他们永远不会直接与你分享。\n\
  \n**数据管理定理 #12**\n\n> 十万条数据记录的价值，远超一条数据记录价值的十万倍。\n\n以下是为你“十万客户”策略提供的一些思路：\n\n- \
  \  十万客户可能足以创建一个社区：人们围绕你的核心产品交流想法、问题和创意——这一切都在你组织可见的品牌和标志之下进行。\n-   这些客户能让你收集到其他组织（至少是你所在行业之外的组织）无法收集的数据。这些数据可能对其他行业至关重要。\n\
  -   无需处理单个客户数据（请记住通用数据保护条例），一个包含 10 万条匿名记录的样本，就能让你确定具有统计意义的偏好和行为模式——你甚至可以将其出售：其他组织通常对属性层面的相关性和因果性感兴趣，而无需个性化数据。\n\
  -   你可以吸引这些客户使用你的其他服务（从而产生额外收入），他们与你的关系会为他们提供初始优惠。\n-   你可以纵向扩展业务，使客户体验无缝衔接且简单直接。（并非只有像亚马逊这样的大公司才能做到！）\n\
  -   你可以基于交易数据的统计评估（而非猜测）来发现向上销售或交叉销售的机会。\n-   你可以探究流失客户的共同点。这使得你能从客户流失分析转向预防客户流失，在已确定的客户群体离开之前对他们采取行动。\n\
  -   通过分析，你可以更系统地了解你的客户。一家葡萄酒厂不仅能知道有多少客户购买的*白葡萄酒瓶数足以装满一个酒柜*（从而可能对酒柜感兴趣），还能确定对这类产品持开放态度的客户比例。最终，他们甚至能找出哪些客户属性组合预示着购买辅助设备的可能性更高。仅有\
  \ 100 个客户的数据不足以得出这些结论，因为众多属性组合中，很多可能只对应一两个客户。\n-   你可以利用已广受认可的品牌推广完全不同的产品或服务，客户从一开始就能体验到因你的良好品牌而带来的信任感。\n\
  -   对 100 人的民意调查在统计上是存疑的。然而，以合理的成本询问更多人很困难。向 10 万名现有客户提问则为你提供了坚实的统计基础。他们虽然不能代表全体人口，但很可能代表了你的目标群体！\n\
  -   你可以收集到对其他组织有价值的数据，并出售这些数据，甚至可以以原始数据的形式出售。\n\n如果你具备相应的规模，能够反复测试新想法，这是一项相当大的优势。小组织可能很敏捷，但大组织拥有广泛的客户基础*以及*持续尝试的财力。只有当你自己的组织尝试过后，你才知道某些方法是*行不通*的。其他组织可能因为采用了不同的尝试方式而失败——因此，贸然为自己的组织得出结论是有风险的。\n\
  \n尝试一些**古怪**的想法。回顾过去，大多数真正的创新都是这样开始的。假设所有**普通**的想法都已被探索过。通过尝试和失败，你不再会损害自己的声誉。如今，客户欣赏企业家的勇气。\n\
  \n### 数据创新工厂\n\n你是否见过实验室与“正式上线”之间的鸿沟？\n\n我观察到这种“工业化鸿沟”最常出现在“数据产品”中——无论是内部产品还是面向外部客户的产品。它们似乎很容易停留在“学术”层面。\n\
  \n如本章前面所述，数据创新工厂可能是组织数据驱动创新最可持续的方式。它将负责从最初的想法到试点阶段、产品定义，直至对最终成果进行初步评估的所有步骤。\n\n\
  这样一个中央机构还将确保不同的创新想法用相同的标准来衡量。这有助于消除优先级排序中的偏见。\n\n这是你“言行一致”的机会：那些作为数据创新候选的想法，将通过**数据**来进行评判和评级。\n\
  \n\n\n\n"
