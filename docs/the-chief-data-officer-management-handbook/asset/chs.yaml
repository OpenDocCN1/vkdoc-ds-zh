- "# 5. 主数据管理\n\n![../images/499948_1_En_5_Chapter/499948_1_En_5_Fig1_HTML.jpg](img/499948_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n谁拥有数据？\n\n## 静态数据过时了吗？\n\n数据管理关乎分析、机器学习和通过可视化获得的洞察，对吧？那么，为什么这本书在战略部分之后，甚至在介绍数据治理之前，就立即讨论主数据呢？\n\
  \n而且，是的，在敏捷时代，主数据有时听起来像是来自过去的束缚。\n\n但事实远非如此。\n\n在 2019 年 12 月的一篇 LinkedIn 帖子中，“数据耳语者”斯科特·泰勒这样说道：“主数据与宏观趋势无关！”\n\
  \n我完全同意。尽管对主数据的变更可能需要变得越来越敏捷，但对主动管理的主数据的需求不会很快消失。\n\n事务数据反映了日常的交易或事件，通常甚至是作为副产品创建的。相比之下，主数据是有意识地维护以支持业务活动的。\n\
  \n即使分析集中在事务数据（包括大数据）上，仔细观察就会发现，如果没有主数据，任何事务数据都无法被分类和解释（从而提供业务洞察）。\n\n此外，基于不良主数据创建的事务数据将不可避免地继承后者低劣的质量。\n\
  \n而这可能会成为一个代价高昂的问题。我记得有一家公司，销售主管指着桌上的一堆信件对我说，所有这些信都是寄给客户的，并标有“退回寄件人 – 无法投递”。这些客户的服务已经提供，但相应的发票却无法送达。该公司的地址数据太糟糕了，财务影响直接冲击了利润底线！\n\
  \n当然，主数据并不仅限于客户数据，而是与组织的所有领域都相关。我不知道有哪个业务职能*不*需要或不拥有主数据。\n\n而且，数字化甚至加剧了不良主数据对组织各个部分的影响。\n\
  \n2019 年，德勤曾询问首席采购官们在掌握数字复杂性方面面临的最大挑战。高达 60% 的首席采购官提到的最频繁话题是“低劣的主数据质量、标准化和治理”^(²¹)（Delesalle\
  \ & Van Wesemael, 2019）。欢迎来到一个首席数据官变得不可或缺的世界！\n\n## 主数据涵盖哪些内容？\n\n\n\n### 主数据、参考数据与元数据\n\
  \n主数据、参考数据与元数据之间的界线并非完全清晰。不过，我的建议是不要花太多精力去寻找一个完美的定义。你需要有充分的理由来区分任何两种数据类型。否则，这纯粹是一种学术练习。\n\
  \n一个国家的邮政编码格式可以被视为主数据，但也可以被视为元数据。汇率可以被视为参考数据——由于它会不断变化，你也可以将其视为交易数据。\n\n你必须确定一种分类吗？只有当你有实际理由这样做时才需要！\n\
  \n这里提供三个可能促使你进行分类的驱动因素：\n\n- 需要不同的流程\n- 需要变更所有权\n- 变更影响程度不同\n\n这将允许你通过引用主数据、参考数据或元数据，为不同类型的数据定义治理规则。\n\
  \n考虑到这三个方面，有两个标准浮现在脑海中：\n\n1. **不同的流程**\n\n   你最终需要区分**数据结构的变更**和**数据内容的变更**。\n\n\
  \   前者通常会导致应用程序、接口或数据库的重新设计。它们与后者有根本性的不同，后者理想情况下通过配置使应用程序的行为发生变化。数据结构的变更通常需要比数据内容的变更更复杂、不同的流程。\n\
  \n2. **不同的责任归属**\n\n   你会发现，**责任归属**也沿着这些界限有所不同：关于客户、地点和产品的数据由业务人员在其日常工作中定义，因为单个错误的影响有限。任何对构建或指定此类数据的数据进行的变更，都可能影响大量记录。这同样适用于通常以批处理模式进行的大规模数据变更。这就是为什么此类变更的责任应由数据所有者承担，他们有时甚至需要组织影响分析。\n\
  \n因此，我们可以提出以下分类：\n\n1. **交易数据**\n   - 通过执行业务流程创建\n\n2. **元数据**\n   - 指定参考数据、主数据和文档\n\
  \   - 由数据所有者管理\n\n3. **参考数据**\n   - 由用于维护主数据的 IT 应用程序访问\n   - 对参考数据的变更可能会影响主数据。如果某个职位名称被更改或停用，所有拥有该头衔的员工都会受到影响\n\
  \   - 由数据创建者维护\n   - 通常由一组值组成，主数据实体的属性从中选择\n\n4. **主数据**\n   - 由业务部门内的人员维护\n   -\
  \ 单个变更对业务流程的影响很小（甚至没有影响）\n   - 如果单条记录出错，影响通常仅限于处理该记录的交易\n   - 然而，维护过程中的系统性缺陷可能会产生重大的负面影响\n\
  \n如果你选择这些标准作为区分依据，你就可以更容易地为那些仅需在数据维护工具中进行变更的数据，与那些需要评估（并可能变更）组织应用系统架构的数据，定义不同的变更流程。\n\
  \n再次强调，你的定义应由业务目的驱动。如果你打算对两种不同类型的参考数据区别对待，请随意进一步细分。如果你对主数据和参考数据应用完全相同的流程，那么就用一个术语来描述这两者。\n\
  \n但要着眼未来：保持灵活性，以便在未来区分今天看似相似的事物！\n\n请注意，在整本书中，我额外使用了“主数据”这个表述作为涵盖主数据、参考数据和元数据的通用术语。因此，每当我说“MDM”（主数据管理）时，我指的是对所有三种类型数据的管理。你无需遵循这个习惯，但在阅读时应该了解这一点。\n\
  \n### 主数据示例\n\n- 参与方：客户、供应商、外部合作伙伴、员工、政府机构\n- 与服务相关的事物：产品、备件、耗材、物料\n- 公用设施：叉车、机器、车辆、打印机\n\
  - 地理信息：工厂、仓库、办公室、销售区域、地址\n\n\n\n### 参考数据示例\n\n以下示例展示了参考数据的多面性。它们清晰表明，协调参考数据并商定规则是一项核心任务，理想情况下应由数据办公室承担。\n\
  \n#### 汇率\n\n每个跨国组织都需要准确的汇率来进行交易和估值。\n\n汇率计算有多种不同方式，你必须确定交易地点以及采用卖出价还是买入价。同样关键的是，为每笔交易商定基础价格以哪种货币计算。\n\
  \n此外，还需要决定汇率的更新频率——根据用途不同，范围可从实时变动到月度汇率。\n\n如果你遗漏了任何一个方面，都会陷入歧义。这会导致同一笔采购出现两种不同的价格——无论对你的客户或供应商关系，还是对财务核算而言，这都是最坏的情况。\n\
  \n汇率会随着持续的交易而每秒变化。然而，如果考虑每一次变动，就无法建立稳定的工作基础，出口价格也可能持续波动。\n\n波动性货币要求对汇率变化做出快速反应，但你通常不会在采购后的几秒钟内立即卖出外币——无论你的汇率处理多么精确，你都面临着售后货币贬值的风险。\n\
  \n商业伙伴之间的交易汇率通常可以自由商定，但绝不允许存在歧义。\n\n你在税务、关税和报告等领域面临的受监管计算，通常必须遵循外部规则，包括变动频率和舍入规则。\n\
  \n在这两种情况下，存储汇率历史记录都极其重要。否则，你将无法追溯计算过去某笔交易适用的汇率。\n\n所有这些方面都表明，集中处理汇率对任何组织都至关重要。例如，如果销售和财务部门各自为政，你将面临严重的对账问题；而如果将汇率选择权交给商业智能和分析人员，不同的人会得出不同的结果。\n\
  \n我的建议如下：\n- 为此领域谨慎定义并选定一位数据业务负责人。该负责人需要与所有其他利益相关者协调一致。\n- 让数据办公室成为强制性监管者，以避免各自为政。\n\
  - 与数据业务负责人和利益相关者群体共同制定并记录明确的规则。\n- 确保你订阅了所有已商定的汇率来源，并将这些值存储在参考数据存储库中。始终拥有每个来源准确完整的汇率历史记录至关重要。\n\
  - 考虑存储组织自身的特定属性，例如是否接受某种特定货币作为支付方式，以及在哪一波动水平下向风险管理发送警报。\n\n#### 地址数据\n\n地址信息非常复杂。地址本身以及地址与业务方的分配关系都处于持续变化之中。\n\
  \n即使拥有规范地址逻辑的国家也会面临歧义。\n- 地址的典型组成部分通常可以缩写，这会导致同一地址存在不同但有效的拼写方式（例如，\"rd\" 与 \"road\"\
  ）。\n- 地址的某些部分是可选的，即仅为了清晰而提供，并非确定精确位置所必需。\n- 许多国家存在多种有效的地址确定方式，这往往是因为引入了新方法，但人们仍在沿用旧方法。\n\
  - 有些国家拥有完善的地址和邮政编码系统，但几乎无人使用。\n- 不同的字母体系使情况更加复杂。\n\n\n\n所有这些问题都造成了歧义，因此简单的字符串比较不足以确定两个地址是否指定了同一位置。\n\
  \n整个地址管理主题值得用一本专著来讨论。\n\n**建议：**\n- **规范化：** 就单一领先标准和明确的映射规则达成一致（例如，在涉及多种字母表的情况下，要有清晰的音译标准）。\n\
  - **考虑使用地理坐标：** 它们不受拼写和格式的影响，因为它们能明确指定一个物理位置。但要注意：摩天大楼可能容纳数百个组织，它们具有相同的 `x` 和 `y`\
  \ 坐标。而且建筑物的形状通常与一对地理坐标的矩形区域不符。请考虑使用地理围栏技术，并利用第三个坐标进行垂直区分。\n- **考虑使用外部地址清洗服务：** 没有任何组织拥有地球上所有国家/地区的完美地址数据，但一些提供商与不同的本地地址提供商合作，以提供全球范围内的精确地址数据。\n\
  - **出于合规和法律原因：** 为每个当事方保留地址历史记录，并保留客户提供的任何原始地址。\n- **使用特定于国家/地区的地址逻辑：** 包括相关的元数据。您可以自行实现，也可以使用\
  \ API 或外部数据提供商。在任何情况下，都要考虑到每日变更的可能性。\n\n## 3. 语言数据\n\n一种语言就是一种语言？当然，世界比这要复杂得多……\n\
  \n典型的挑战包括：\n- **不同的字母表：**（拉丁语、西里尔语、希伯来语、韩语、中文），其中大多数都有多个子集。\n- **同一国家/地区内同一语言的不同拼写标准：**（挪威语）\n\
  - **音译并非总是明确无误：**（日语的汉字）\n- **同一语言存在多种国家/地区版本：**（英语）\n- **一个国家/地区内存在多种语言：**（印度、瑞士、加拿大）\n\
  \n**建议：**\n- **在处理多种语言时，始终使用 Unicode。**\n- **定义一种内部主导语言和字母表。** 始终映射到您的默认语言。这为您提供了仅需管理\
  \ `(n-1)` 种关系，而不是每两种语言之间的 `n*(n-1)/2` 种关系。\n- **采用国家/地区加语言的组合方式：**（正如大多数语言服务提供商所做的那样），并为每个国家/地区定义一个默认语言。\n\
  - **语言处理必须能够定义组织内不得翻译的特定表达方式：** 例如，作为品牌的一部分。请考虑到，在大多数情况下您仍然需要进行音译。并且，必须能够处理组织范围内所有其他特定表达方式的翻译。\n\
  \n## 4. 组织层级\n\n您的组织是否时常重组？它是否收购并整合其他组织？它是否通过自己的子公司进入新市场？它是否与其他组织合资成立公司？除非您是本地烟囱清洁工，否则您至少会回答一次“是”。\n\
  \n但在这些情况下，谁负责？结构存储在哪里？又是如何存储的？\n\n传统上，财务部门以外的人倾向于认为组织层级结构是直观清晰的。但细节中藏着魔鬼，而且有很多充分的理由可以避免在功能软件中经常出现的硬编码层级结构。\n\
  \n**建议：**\n- **澄清组织层级结构可能存在的不同目的。** 组织的内部结构通常与外部法律结构不同。如有必要，维护两个或更多不同的层级结构。\n- **坚持将此信息的保管权交给数据办公室，**\
  \ 以确保对层级信息进行可持续的、跨职能的、全面的管理。\n- **确定最合适的数据业务负责人。** 根据您组织的概况，负责人可能是财务部、法务部、并购部，甚至是专门的业务转型部门。\n\
  - **设计您的层级数据结构，** 使其能够通过配置来实现变更。\n- **与业务负责人合作处理层级不同演进阶段之间的映射，** 以实现适当的同比比较，这项任务颇具挑战性。这种映射必须提供给所有数据使用者，以确保报告和分析的一致性。\n\
  - **存储的历史数据结构应允许：** 一旦日期确定，就能轻松地将事件和交易分配到层级的正确部分，特别是对于面向法律目的的层级。\n\n### 元数据示例\n\n\
  元数据的类型与其它数据的类型一样多。本质上，元数据描述其他数据。\n\n以下是一些示例：\n\n#### 1. 格式描述\n\n主数据和交易数据的大部分元素都需要格式描述，以便进行数据验证，并在必要时解释数据。典型的例子是账号的长度和格式。\n\
  \n外部数据的格式描述也属于元数据，例如增值税号的格式和长度。\n\n#### 2. 文档信息\n\n**文档的分类和标记：** 存储的原始文档拥有大量的元数据元素，例如格式、页数或最后修改日期。大多数文件格式甚至将部分元数据作为文件本身的一部分进行存储。\n\
  \n**影像文档的元数据标签要少得多：** 例如来源、作者或大小——这里，额外的信息来自 OCR 和文本分析。这就是为何在收到任何此类影像时就应执行这些步骤的原因，以便能够立即找到并有效利用它。\n\
  \n完整的 OCR 和文本分析通常会将整个文档转化为系统化的信息，使原始文档影像成为一个附属方面。在这种情况下，大多数信息可以被视为交易数据，而非元数据。您的划分应再次遵循其目的：哪些数据应受您的元数据策略约束，哪些数据应由您的交易数据策略覆盖？\n\
  \n#### 3. 大数据分类\n\n与影像文档的元数据类似，非结构化的大数据文件也需要元数据，例如日期、来源或使用的字符集。\n\n这些元数据元素是后续步骤中准确解释数据内容所必需的。\n\
  \n从这个意义上说，“非结构化”这个术语即使对于大数据存储库最初的原始版本来说也并不恰当。它将通过初步分析变得越来越结构化，直到您确定了足够的元数据，使其能够应用于分析算法，例如用于模式识别或相关性发现。\n\
  \n此外，元数据发现有助于确保大数据存储库的任何内容与您想要应用的机器学习算法所使用的训练数据相匹配。\n\n有效的元数据管理有助于以结构化的方式完成所有这些工作。\n\
  \n## 管理主数据\n\n### 跨职能的 MDM\n\n主数据大多是跨职能的。换句话说，不止一个团队或部门依赖于某一特定的主数据集。然而，许多组织仍然拥有由不同团队自主维护的、分散的主数据。\n\
  \n## 数据模型\n\n一个透彻的数据模型对于主数据的设计至关重要。\n\n元数据与数据模型密切相关。属性的基数（`cardinality`）和格式需要在数据模型中维护，元数据管理必须从数据模型中获取这些信息。\n\
  \n但是，主数据和参考数据的逻辑和结构也应在数据模型中定义。\n\n作为一般规则，所有业务逻辑和结构应首先放入数据模型。然后，基于数据模型来定义主数据及其维护。\n\
  \n\n\n### 主数据的历史视图\n\n主数据、参考数据和元数据都需要一个历史维度：即属性值随时间推移而发生的变化。\n\n你应该始终能够重现过去某个特定日期（如果你提前维护了主数据，甚至可以是未来某个日期）的情况。出于法律原因、调试目的或场景模拟等需求，你可能都需要这种能力。\n\
  \n这就是为什么 Web 服务应该始终提供一种调用变体：在该调用中提供一个日期，Web 服务返回该日期对应的结果。这有助于你使用过去和未来的数据进行测试、重现案例以评估索赔，以及验证错误消息。\n\
  \n完备的历史记录还能为你提供额外的数据验证机制。例如：\n\n*   在一个状态为“在建中”的设施中，不能有产品生产出来。如果发现此类组合，应向用户标记提示。\n\
  *   你不能向一个不再有效（或尚未生效）的邮政编码发货。历史视图可以在拒绝该邮政编码时添加历史信息：提示“不再有效”或“自……起才有效”比单纯提示“无效！”提供了更丰富的信息。\n\
  *   即使是当前有偿还能力的客户，如果其信用评级在过去两年的大部分时间里一直很差，也可能需要密切监控（或被限制使用信用付款）。\n\n但在处理历史数据时，你也会面临挑战：\n\
  \n*   变更后的同比比较：如果你重组了客户细分，就很难确定每个细分市场客户忠诚度的同比发展情况。\n*   虽然 NoSQL 数据库通常无需重新设计就能处理数据模型的变更，但\
  \ SQL 数据库很容易出现问题。它们无法识别新增的表，会遗漏丢失的表，并且对主键结构的变更很敏感。\n*   即使数据库能够处理结构变更，客户端应用程序也可能无法做到——除非它被有意识地设计成能在不同模式下工作。不幸的是，这种能力通常是硬编码的。更常见的情况是，应用程序被修改以支持新的逻辑，从而失去了支持先前逻辑的能力。\n\
  \n这些案例说明了将软件和数据库的向后兼容性添加到任何变更的需求清单中是多么重要——无论是大型版本发布，还是敏捷项目的迭代冲刺。\n\n## MDM 与主数据软件\n\
  \n### 主数据设计风格\n\n设计和实现主数据并非只有一种方法。根据你的功能性及跨功能性业务需求，你可以为整个主数据环境或其部分选择不同的主数据设计风格。你可能决定采用混合解决方案，无论是临时性的还是作为长期目标的一部分。\n\
  \n典型的主数据设计风格有^(²³)\n\n1.  **集中式**\n\n    从数据质量的角度来看，完全集中的解决方案提供了最安全的方法。它便于组织单一事实来源原则——其中大部分原则已经体现在数据库设计中。\n\
  \n    请注意，集中化的是数据本身，而非维护工作。来自世界各地的数据管理员可以直接在集中式解决方案中维护数据，无论该方案是本地部署还是在云端运行。\n\n\
  2.  **虚拟集中式**\n\n    过去 20 年的技术进步越来越使数据仓库的逻辑结构与其物理设计解耦。大多数数据库解决方案都支持分布式数据库设置，在这种设置下，记录可以分布在多个远程位置，或者数据库会在同一数据库的不同实例之间自动复制所有记录。\n\
  \n    基于云的数据库解决方案甚至不知道还有其他的工作方式。\n\n    因此，全球性的组织覆盖范围不再是维护独立、本地数据库的借口。只有连接性有限的地区才可能有理由保留本地数据仓库——但这些理想情况下应只是单个逻辑数据库的只读副本或缓存。\n\
  \n    提醒一句：在单个物理或虚拟数据库中，主键并不能防止重复。拼写错误和不同的拼写方式可能导致多条记录指向同一个“事物”，而数据库的字符串比较功能可能无法发现这一点。（另见第\
  \ 10 章“保持数据清洁”一节。）\n\n3.  **分布式读取**\n\n    有时，遗留应用程序无法切换为从现代 MDM 解决方案消费数据，例如，当大型机无法调用主数据\
  \ Web 服务，或者修改旧系统的风险被认为过高时。\n\n    在这些情况下，你应至少尝试将这一主数据领域的所有维护工作切换到一个集中式解决方案（除非当前的主数据维护是不可分割的整体遗留系统的一部分）。然后，你可以建立一个复制机制，定期更新任何本地仓库以供本地消费。\n\
  \n    大多数专业的 MDM 解决方案都能支持所有这些风格。但你通常会在遗留基础架构中发现限制。这就是为什么 MDM 软件的一个重要选择标准是其与遗留解决方案共存和交互的能力。\n\
  \n4.  **分布式读写**\n\n    如果技术限制阻止你集中化即使是单一类型的主数据，你可能被迫将其保留在多个仓库中。在这种情况下，你需要确保这些仓库之间的定期同步，以尽可能接近单一事实来源的状态。不过，由于缺乏实时同步，业务流程应假设数据仓库会暂时出现不同步的情况。\n\
  \n    这种方法需要一个主数据源的中央注册表，记录它们之间的相互依赖关系，以及它们的更新和使用频率，这样你就可以系统地自动化同步过程。\n\n5.  **独立式**\n\
  \n    这是遗留环境中最常见的设计风格。它通常在一个缺乏数据治理的组织中历经数十年发展而成，主数据常常被作为孤立的功能实现项目的附属方面来规范和实现。\n\n\
  \    这种风格的优势在于能够快速实现本地或功能性解决方案——但其无数的缺点会让你希望转向其他风格。\n\n    然而，在某些情况下，在不同地点维护的数据在逻辑上确实是独立的。这通常发生在特定主数据仅在有限上下文中有用的情况下。\n\
  \n    在这种情况下，可能没有足够好的商业案例来将这些主数据集成到组织级的主数据环境中。但你不应放弃，而应等待时机，例如，等到各自的功能解决方案被替换或现代化。\n\
  \n    只要组织被迫采用这种主数据设计风格，就必须通过严格的治理来弥补技术支持的不足，以确保手动避免数据质量问题。\n\n    这种劳动密集型的手动数据质量工作需要额外的资源。你可能希望利用这一点来构建商业案例，以转向更可持续的主数据解决方案。\n\
  \n\n\n## 首先明确你的需求\n\n尽管许多软件包都标榜为“MDM”，但这个缩写指的是一种管理主数据的方法，而非一套 IT 解决方案。\n\n咨询公司高德纳一针见血地指出：“MDM\
  \ 是一项复杂且昂贵的工作。作为一种技术驱动的业务举措，仅靠软件本身无法应对这一挑战”（Parker & Walker, 2019）。\n\n正因如此，我强烈建议你将选择主数据软件视为主数据建设之旅的最后一步。尽早了解现有现成解决方案的能力固然不错，但这些能力不应决定业务需求。\n\
  \n如果你不清楚主数据软件应实现什么功能，也没有建立相应的治理机制来确保人们使用该软件，那么你就有可能无法选出最合适的软件解决方案。更糟糕的是，即便选出了方案，也极有可能无法得到恰当使用——甚至完全搁置。\n\
  \n### 确定你的需求\n\n以下是我基于在各类组织中的经验所作的估算：一个组织对主数据解决方案 80%的需求，都可以通过数据管理框架的分析与开发，在前期提前确定。\n\
  \n有趣的是，这 80%的需求中包含许多无需在“对错”之间抉择的决策（因为任何一种方向都可行）。\n\n其他可以（且必须）在前期明确的事项包括：需要访问系统的用户和应用程序数量，以及它们将如何访问数据。这正是为何需要尽早定义数据维护流程。此外，你还必须确定应用架构中的任何约束条件——这并不局限于遗留应用程序。\n\
  \n只有其余 20%的业务需求是在使用主数据解决方案的过程中逐渐形成的。而且，这 20%中的大部分同样属于改进建议，而非“生死攸关”的情况。\n\n原因很简单：大多数主数据解决方案的提供商会定期整合客户的反馈。除非你的组织与其他所有组织完全不同，否则你不太可能提出其他组织从未遇到过的需求。因此，你可以预期多个\
  \ MDM 解决方案都不会对你的组织构成真正的“致命障碍”。\n\n对此，你应在流程早期就熟悉主流主数据解决方案提供商的产品——但不必立即着手筛选备选名单。\n\
  \n相反，这些解决方案的功能特性可以帮助你塑造目标架构，该架构由治理机制、流程以及支撑它们的解决方案共同组成。\n\n### 瀑布式还是敏捷式？\n\n你会选择哪种方法——瀑布式还是敏捷式？能否完全基于敏捷方法来收集需求？\n\
  \n几乎不言而喻，已实施解决方案的持续改进默认应采用敏捷方式。\n\n同样显而易见的是，选择解决方案的过程至少需要部分遵循瀑布式方法，因为你必须在某个时间点做出方向性决策（你不会希望过于频繁地在\
  \ MDM 工具之间切换）。\n\n与此同时，治理框架和主数据流程的开发应以敏捷方式进行。对主数据解决方案需求的文档化，可以是团队真正践行敏捷工作方式时一个令人欣喜的副产品。\n\
  \n你甚至可以使用敏捷方法来开发主数据治理和流程^(²⁴)。在这种情况下，关于治理和流程的用户故事也可以被视为主数据解决方案的用户故事。你的敏捷待办事项列表可以成为确定主数据解决方案需求说明的一部分。\n\
  \n### 自建还是购买？\n\n数十年来，组织一直被迫自行构建主数据解决方案。当时市场上可用的解决方案不够成熟，而且零散割裂：多领域主数据解决方案尚未出现，几乎没有哪个解决方案能与其他方案良好集成，更不用说与数据管理的其他部分（例如数据建模工具）集成。\n\
  \n与此同时，情况已显著改善。解决方案提供商受益于主数据解决方案相对独立的行业特性。这意味着提供商无需投入过多精力为不同行业开发专用解决方案。\n\n但与为满足组织特定需求而定制的内部解决方案相比，即便是这些日益复杂的主数据解决方案也存在一个关键劣势：如果某项功能不可用，你无法简单地自行添加——你必须寄希望于解决方案提供商也认为这是一个好（且紧急）的想法。\n\
  \n对解决方案提供商的依赖是一个挑战，尤其是在使用基于云的解决方案时，其可配置性通常仅限于非核心方面。\n\n如果你当前已有一个或多个遗留的主数据解决方案，暂时保留它们，并先引入与这些遗留方案配合使用的治理流程，或许是合理的做法。你很可能在此过程中学到很多东西，这有助于你日后选择出色的专业解决方案。\n\
  \n要决定自建还是购买，你应诚实评估：你的组织在处理主数据方面，是希望将其打造为竞争优势，还是仅仅作为一种专业的后台活动，以帮助组织专注于业务目标。\n\n第二种方法并无不妥！它的优势在于，你可以选择一套主数据解决方案，并开发部分治理流程来适配该方案。\n\
  \n选择解决方案的过程也会因此变得更容易：你可以列出一系列符合核心需求的选项，然后选择性价比最高的那一个。\n\n脚注 1 2 3 4\n\n"
- "# 6. 数据治理\n\n![../images/499948_1_En_6_Chapter/499948_1_En_6_Fig1_HTML.jpg](img/499948_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n没有治理的数据，不过是一项不具约束力的建议\n\n\n\n## 塑造一套数据原则\n\n在大多数情况下，数据驱动型组织的前进方向会与组织以往的方向有所不同。\n\
  \n除了阐述宏观愿景外，数据办公室团队还需要在非常具体的案例中判断：某项提案是否符合数据战略、是否需要调整，或者是否遗漏了某些内容。\n\n一个由数据专家组成的团队或许能够准确判断每一个具体案例的优劣。一份记录详尽的技术性数据架构文档也无疑能帮助\
  \ IT 部门把事情做对。\n\n但总体理念可能需要一种能被所有人理解的通用导向，无论是资历最深的数据库专家，还是市场营销主管。\n\n哥伦比亚广播公司的杰里米·科恩在\
  \ 2018 年伦敦的一次数据会议上用了这样一个比喻：“指南针胜过地图！我们并非无所不知。”\n\n一套数据原则可以成为你的指南针。\n\n将这些数据原则视为数据的“宪法”。它们可以在标准与政策尚未覆盖的新情况下提供指引方向。\n\
  \n但不要仅仅由你自己起草这些原则并强加于他人——即使你认为自己知道该怎么做！\n\n你或许更希望与来自业务和 IT 各部门的关键数据参与者共同制定这些原则。（请放心，合适的人选会来自你的数据网络内部。）\n\
  \n自己或与整个数据办公室团队一起创建一份初始草案，以确保讨论方向正确，这是完全可以的。你可以将你在组织中已识别出的关键点融入进去。典型的候选点包括：\n\n\
  *   所有数据都有其所有者。\n*   优先关注最关键的数据。\n*   关注根本原因而非表面症状。\n\n但同样重要的是，要尽快让关键人员参与进来，例如通过研讨会的方式，让他们共同拥有最终成果。\n\
  \n虽然你不应接受与数据战略有根本性偏离的内容，但你应该对“无伤大雅”的更改持开放态度，比如措辞上的修改：“你认为你的替代措辞更容易理解？好的，那就用这个吧！”\n\
  \n有时，人们会想出全新的、绝妙的主意。如果你采纳了这些想法，结果不仅会更好，而且你还能赢得这些人的支持！\n\n当然，无论在何时，你都是这份文件的正式所有者，这使你能够对其进行微调，使各方贡献者的意见与你的战略目标保持一致。\n\
  \n最后，请在最终的文件中提及所有贡献者。这一步将真正使其成为“他们的”文件。\n\n当然，你也不想创建一个冗长、难懂的“怪物”。因此，请聚焦于标题——可以添加背景信息，供那些希望更好理解的人阅读。\n\
  \n想一个朗朗上口的标题，以便在你发布某项计划的合规性检查或解释方向时引用。可以考虑“数据信条”或“数据十诫”这类名称。\n\n你可以在图 6-2 中找到一个组织典型的数据原则列表。\n\
  \n![../images/499948_1_En_6_Chapter/499948_1_En_6_Fig2_HTML.png](img/499948_1_En_6_Fig2_HTML.png)\n\
  \n图 6-2：数据原则示例\n\n## 制定数据政策\n\n### 数据政策有何用处？\n\n数据政策对于指导那些你无法（或不愿）逐一规范的个别情况下的员工行为至关重要。它们是沿着整个数据供应链规范数据处理行为的准则。\n\
  \n此外，数据原则和政策应协同作用，使跨职能团队能够推导出具体的规则，以流程或角色与职责的形式覆盖已知情况。\n\n一条经验法则是：只要你有充分理由认为组织内的人员在处理数据时可能不会从组织的最佳利益出发，就需要制定数据政策。典型的动机包括懒惰、无知、自满、自私或考虑不周。\n\
  \n数据政策的目的是通过告知每个人应该（或不应该）用哪些数据做什么以及为什么，将人员行为与组织的目标和价值观统一起来。\n\n### 数据政策需要多具个性化？\n\
  \n与数据原则不同，政策需要覆盖整个组织。它们必须立足于整体战略的背景下，并且必须与组织的其他政策相契合。例如，如果你的组织所有其他政策都依赖于跨职能审批流程，那么基于个人决策权来制定数据政策是没有意义的。\n\
  \n其次，数据政策的内容需要针对你的组织量身定制。不要照搬其他组织的数据政策。这样做很可能不能满足你组织的需求，或者你选择的政策风格与其他政策不匹配，风险太高。\n\
  \n此外，其他组织的数据政策可能基于不同国家的法律环境；根据适用的地域范围，它们可能过于具体或过于笼统。\n\n然而，需要为你的组织制定一套个性化数据政策，这不应阻止你去查阅几份现有的政策，以检查你是否忽略了某些方面。\n\
  \n### 如何确定政策的责任归属？\n\n作为建立数据政策管理的一部分，你可能希望明确责任归属，因为所有权并不总是直观清晰的。\n\n有时，某项典型数据政策的责任已经由另一个团队承担了。\n\
  \n这方面最常见的例子可能就是数据保护政策。其他所有权模糊的典型政策涉及在处理数据时强制执行法律要求，例如 GDPR、SOX（2002 年萨班斯-奥克斯利法案，美国）或\
  \ HIPAA。^(²⁵)\n\n如果另一个部门传统上负责*所有*政策，包括数据政策，那么一个不错的做法是，将整个政策所有权议题作为你首席数据官职责的一部分请其予以澄清。\n\
  \n为此，理想情况下，你应该创建一份你希望自行设计的所有政策的清单，以及另一份你认为应该提供意见的政策清单。\n\n你的主要目标绝对*不应*是争取最大程度的责任权限。相反，你的目标应该是能够为在你的组织中建立强大的数据管理基础。\n\
  \n这就是为什么通常不必为每一份政策的最终归属权而争斗。数据办公室被认可为一个利益相关方通常就足够了。如果用户对原始所有权不满意，让他们自己去表达意见。\n\n\
  因此，让另一个部门（例如法务部或沟通部）负责所有政策的责任，而数据办公室负责数据政策的内容，这完全可以接受。\n\n### 如何确定政策的制定方式？\n\n在组织和结构上，你应该遵循你组织处理其政策的方式。必须明确地表明，数据政策并非独立于组织的政策目录之外。\n\
  \n此外，与组织的其他政策完全保持一致，可以使你能够复用现有的基础设施，从法律审查、发布到强制执行。\n\n你的组织可能拥有中央政策管理机制。在这种情况下，数据办公室需要成为一个被认可的参与方，拥有一些现有政策的所有权，并成为其他政策的正式贡献者/审批者。\n\
  \n如果你的组织尚无任何政策，或者你的组织没有系统性的政策处理方法，我鼓励你自行启动。你甚至可以建立一个项目，使其成为其他团队制定政策的蓝图。\n\n\n\n\
  #### 如何制定一套数据策略？\n\n与数据原则一样，让所有相关利益方参与数据策略的制定至关重要。这些利益方包括策略使用者（所有部门）和主题负责人（例如风险管理或数据隐私管理部门）。\n\
  \n倾听前者的关切至关重要，同时你需要避免在撰写策略时与后者产生竞争。\n\n当然，这种利益相关者驱动的策略制定方法不应阻止你进行充分的准备工作。理想情况下，你应准备比最终目标更多的策略。如果团队不需要从一张白纸开始，他们通常会感到高兴，而你也能在一定程度上设定议程。\n\
  \n#### 数据策略是什么样的？\n\n出于以下三个原因，此处不会提供示例：\n\n1.  互联网和文献中有大量示例，你应该多看一些。\n\n2.  我选择的任何示例都可能被误解为我建议你撰写策略的方式。事实是：数据策略没有唯一有效（甚至是最佳）的结构。\n\
  \n3.  你的数据策略在格式和结构上应与组织的其他策略保持一致。组织 A 成功的数据策略可能在组织 B 中完全不适用。\n\n我建议你始终从策略的目的开始讨论：目标结果是什么？策略应导致或防止发生哪种情况？策略旨在执行哪项（内部或外部）规定？\n\
  \n牢记这一点，你可以决定特定策略是强制性的、有条件的还是建议性的。后者需要在策略中进行合理程度的论证，因为其目的是被自愿遵守。\n\n如果你在制定数据策略方面有相当大的自由度，你可以考虑使用数据原则的结构（如本章前面所述）：每个原则可以附带一条或多条数据策略来具体化。\n\
  \n所有策略都需要获得全球范围内的批准，由管理委员会或由委员会授权做出此类决定的适当审批机构（如本章后面所述）进行。\n\n最终，策略需要被共享，并且相关人员需要接受培训。在这两个方面，你可以复用组织先前为处理策略而建立的任何机制。\n\
  \n最后，请鼓励反馈。你需要了解人们是否接受你的策略。\n\n## 受管理数据的目标状态\n\n列出明确定义数据的前提条件有多种方式。GoFair (2019)\
  \ 提供了一个公开可用的列表。\n\n另一个是“USA”标准（图 6-3）。\n\n![../images/499948_1_En_6_Chapter/499948_1_En_6_Fig3_HTML.jpg](img/499948_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n数据标准（示例）\n\n虽然基本方面总是相似的，但你可能会想开发自己的模型。这将使你能够强调那些对你的组织具有突出重要性的要点。\n\n\
  ## 数据治理的范围\n\n组织内处理数据的哪些方面应属于普遍有效的数据治理范畴？\n\n简短的回答是“所有方面”。\n\n以下是一些典型的问题和答案。\n\n\
  ### 数据是否可能因过于机密而无法被治理？\n\n是的，数据可能因过于机密而无法共享。在这种情况下，数据办公室将专注于定义敏感数据需要如何被治理，谁具体负责，以及谁可以访问这类数据。机密数据本身无需提供给数据办公室。\n\
  \n### 我们不应该豁免研究数据吗？\n\n研究自由通常被认为是创造力的前提条件。\n\n确实，研究人员应该拥有发现新方法和洞察所需的一切自由。\n\n然而，一旦研究结果被共享，就必须能够理解得出这些结果的过程。\n\
  \n这就是为什么治理和文档对于科学模型和算法也同样重要。\n\n### 不同类型的数据需要不同的治理吗？\n\n对参考数据、交易数据和大数据进行差异化管理确实是个好主意。\n\
  \n这些数据类型在复杂性、结构、用途和目标群体方面各不相同。同时，数据隐私和数据保护的级别也会不同。\n\n此外，只读数据不需要像组织内部会发生变化的数据那样多的规则。\n\
  \n元数据也需要自己的一套规则，因为它对互操作性有显著影响。\n\n### 对于我们还不知道的数据呢？\n\n处理我们目前尚未意识到的数据方面的工具是策略。所有数据策略的编写方式应能让每个人都从这些策略中推导出任何新数据方面的处理规则。\n\
  \n例如，如果一项新法律要求在两年内进行变更，策略可以规定任何新法律需要在其生效前至少两个月得到遵守。\n\n那么，如果对于一个新主题没有现成的策略呢？请使用你的数据治理机构和流程，尽可能可持续地处理任何新问题！为了让这种方法得到遵循，使其成为强制性的——是的，通过一项策略！\n\
  \n数据管理定理 #9\n\n数据管理需要集中治理。\n\n执行应默认委派。\n\n## 决策与协作\n\n还有什么比将所有责任都投入到定义明确的治理模型中，并在所有层级实现跨职能代表更好的方法呢？\n\
  \n一个好的起点可以是高层模型，如图 6-4 所示。\n\n![../images/499948_1_En_6_Chapter/499948_1_En_6_Fig4_HTML.jpg](img/499948_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n审核与决策阶梯\n\n如果你从四个不同层级开始，随后可以详细定义每一个层级，并根据组织的结构和需求进行调整。\n\n\n\n## 管理委员会\n\
  \n任何组织都不应将管理委员会排除在数据治理架构之外。\n\n我见过许多案例，尤其是在大型企业中，管理委员会被认为过于战略层面，不适合处理“普通”数据议题。这是一个错失良机！\n\
  \n无论管理委员会是否有意识地决策数据议题，其决策都与组织的数据密不可分。他们直接或间接、有意或无意地影响着数据决策。\n\n普华永道数据分析合伙人、奈耶诺德商业大学雅克·德·斯瓦特教授博士，在\
  \ 2019 年阿姆斯特丹的一次数据会议上直言不讳地说：“重大决策都在董事会会议室做出。”你必须将大数据议题带到那里去。\n\n我们需要明确一点：管理委员会不应被期望讨论常规的数据工作。然而，在有效的数据治理模型中，它需要扮演两个关键角色：\n\
  \n1.  **战略**\n\n    数据战略不能脱离组织的整体战略而独立存在。\n\n    虽然数据战略的制定责任在于首席数据官（CDO），但其获得管理委员会的批准至关重要。数据愿景和数据使命也是如此。\n\
  \n    如果管理委员会没有明确声明数据战略得到全力支持并与整体战略一致，CDO 在执行中将缺乏权威。\n\n    无论 CDO 做什么，都应能够与愿景、使命和战略联系起来：“我们正在做\
  \ A，以实现经管理委员会批准的 X。”\n\n    在批准数据战略的同时，应让管理委员会及时了解执行进度。换句话说，定期向管理委员会进行简短更新必须成为整体数据治理的一部分。这能让董事会成员持续关注该主题，并为\
  \ CDO 开辟一个提出想法或表达关切的渠道。\n\n2.  **升级处理**\n\n    遵循先前描述的辅助性原则，每个层级应尽可能在向上升级前解决争议。\n\
  \n    此外，双方之间的分歧应通过双边方式解决，而不是让所有职能部门都参与进来。董事会层面也是如此，CDO 可以调解两位存在分歧的董事会成员达成一致。\n\n\
  \    然而，每个组织也需要一个正式流程来解决剩余议题。经验表明，即使在下层未达成一致，小问题也不会被纳入董事会议程。应该提供多种选项，以便在任何层面解决此类问题。\n\
  \n### 执行数据决策机构\n\n在管理委员会之下，通常需要一个权威机构来跨职能部门决策数据事务。只有小型组织才会要求管理委员会来做此类决策。\n\n要使这样的机构拥有足够的权威，它需要代表组织的所有领域。这并不意味着整个第二管理层级都需要加入该机构。相反，可以挑选精通数据的高管代表多个领域——前提是他们已获得管理委员会的预先协调和授权。\n\
  \n一个通常可行的做法是让每位董事会成员挑选一名直接下属，代表该董事会成员的整个职责范围。这至少可以作为一个起点，允许进一步微调，例如，当一位董事会成员下属的两个子职能部门过于独立，以至于一位高管无法同时代表两者时。\n\
  \n我在此有意使用“决策机构”一词，因为我不期望该机构*详细讨论*议题——除非他们真的想这样做。在所有其他情况下，我希望参与数据相关讨论的团队能事先就提案达成一致，并让他们的机构成员了解所有已达成一致的意见以及所有剩余的分歧点。\n\
  \n作为必要的数据升级流程的一部分，只有该机构有权向管理委员会进行任何升级。\n\n我将这个机构称为**数据执行委员会**。如果贵组织有命名惯例，你也可以遵循。\n\
  \n### 数据协作组\n\n为了使数据执行委员会能够做出决策，需要一个机构来从内容上准备那些提案、请求或升级材料。\n\n这项工作应由一个跨职能的团队负责人或部门主管小组来完成。\n\
  \n我将这个机构称为**数据管理委员会**，或简称为**数据委员会**。它应由 CDO 主持。\n\n该委员会应定期开会，以制定概念、评审、提议、决策或升级：\n\
  \n- 数据管理委员会评审已确定的数据质量问题。\n- 它决定应由数据办公室处理或由跨职能项目团队开展的新议题。\n- 它要求数据办公室提供关于其计划、活动和进展的最新信息。CDO\
  \ 可以要求自己的团队负责人向该机构做演示。\n- 它评审、预先排序，并就项目提案做出决策，将其纳入组织的项目优先排序或预算编制流程。\n- 最后，所有向数据执行委员会的请求都需经过该机构。\n\
  \n成员应由数据执行委员会的成员任命。数据倡导者通常是一个明智的选择。\n\n虽然数据执行委员会受益于有限的成员数量，但数据管理委员会可能受益于更大的规模，以确保真正跨职能的讨论和覆盖范围。\n\
  \n### 数据社区\n\n数据专家理想情况下应分布在整个组织中。每个部门都应“说数据语言”。不同可能的角色见第 9 章。\n\n除了成为各自团队的一部分外，他们还应形成一个虚拟社区，该社区尤其为数据管理委员会充当主题专家。\n\
  \n人们不需要被指定为数据社区的成员；任何其职责包括维护、保护、共享、改进或解释数据资产的人，都应被视为数据社区的一部分。\n\n然而，这个社区需要积极的引导，以便其成员能够相互协作并相互学习。\n\
  \n该社区应允许这些数据专家带来新想法，并支持跨业务职能的数据项目。该社区的引导者应是数据办公室的一名成员，他也充当连接数据管理委员会的桥梁。\n\n### 数据评审与决策流程\n\
  \n在详细阐述所有数据流程（我们在第 8 章讨论）之前，我们需要处理所有数据流程之母，即“数据评审与决策流程”。\n\n该流程描述了议题如何在主题专家与管理委员会之间的评审和决策阶梯上上下流动。它也涵盖了所有其他相关数据流程的处理。\n\
  \n### 实施速度\n\n数据治理无法一蹴而就。与其说是复杂性问题，不如说是让每个人都参与进来的挑战。\n\n即使你知道方向所在，也建议将旅程分解为小步骤。让人们习惯看到数据被治理。\n\
  \n你也会在迈出每一步的过程中不断学习。你原本期望效果很好的做法可能会变得行不通。替代方案可能会出现并改变你最初的想法。\n\n或者，正如昕诺飞企业信息管理全球副总裁拉基·艾哈迈德在\
  \ 2019 年一次数据会议上所说，“让你的治理框架不断发展。”\n\n一旦你定义好数据治理阶梯的四个层级，关键部分已实施并得到授权评审与决策流程的支持，你就拥有了一个基本的数据治理架构，能够处理所有剩余的议题。\n\
  \n脚注 1\n\n\n\n"
- '# 7. 数据语言


  ![../images/499948_1_En_7_Chapter/499948_1_En_7_Fig1_HTML.jpg](img/499948_1_En_7_Fig1_HTML.jpg)


  图 7-1


  “我们需要一种语言吗？”——“先定义一下‘语言’……”


  ## 语言的特征


  ### 我们不都说英语吗？


  为了让人们相互理解，仅仅让他们坐在同一个房间里，并且所有人都会说会听，是远远不够的。


  只要你设想一个希腊人和一个印度尼西亚人试图交流的情景，这句话的道理就显而易见了。


  这同样适用于不同的行业、组织和部门。正如印度尼西亚人可以学习希腊语并使用词典查词一样，我们也需要语言培训、业务术语词汇表，以及关于如何使用这种语言的精确定义。


  这样一个整体架构包括表述的定义（数据词汇表）、数据规则、数据标准以及企业数据模型。本章将描述一个用于定义组织数据语言的总体框架。


  ### 语言的动态性


  语言并非一成不变，因为它需要反映现实。新事物出现需要命名，新活动也需要恰当的动词。


  为此，人们会复用生活中其他领域的现有词汇和描述，或者从其他语言借词。有时，他们甚至会人为创造新词，这些词通常基于古老语言或缩写而来。^(²⁶)


  以下是围绕英语的三个典型例子：


  **示例 1**


  几个世纪以来，“链条”和“锯子”一直存在，因此当“链锯”被发明时，并不需要创造新词。


  **示例 2**


  在农业领域，人们早在工业革命之前就已经使用“拖拉机”（拉丁语：*trahere* – 意为“牵引”），因此当第一台发动机驱动的设备开始翻耕我们的田地时，这个词便顺理成章地被沿用下来。


  **示例 3**


  古罗马人并不特别擅长数学。如果你尝试用罗马数字计算两个数的乘积，就会明白这一点。


  但他们确实需要进行计算和数字相加。他们用来描述这种活动的动词是“computare”。


  当第一批机器出现，开始代替人类完成这项工作后，将这些机器称为“计算机”似乎就成了顺理成章的事。


  每当需要将整个古老语言（如拉丁语或希伯来语）应用于现代场景时，必须系统地执行扩充词汇的过程，以一致地填补所有空白。如果没有这种协调一致的方法，新创词汇要经过文档记录、标准化并被完全采纳，有时需要花费几个世纪的时间。


  那么，语言的这段历史与数据有什么关系呢？


  为应对新情况而复用现有术语，或基于现有词汇创造新表达的习惯，并不仅限于我们的私人世界。它在我们的日常业务生活中也屡见不鲜，这会导致跨所有业务领域产生歧义的风险。


  而所有这一切同样适用于数据世界。此外，这个数据世界仍然相对年轻。数据语言几乎没有时间发展，导致许多情况和场景缺乏历史上形成的表达方式。


  显然，我们需要采取一些措施来解决这些歧义、命名不当以及缺乏明确指代的问题。这既适用于广义上的业务语言，也特别适用于数据语言。


  ## 数据词汇表


  ### 什么是词汇表？


  词汇表是术语及其定义或解释的存储库。


  现代的词汇表还包含交叉引用、同义词、历史记录、层次结构、关系和归属权。


  在技术上，好的词汇表工具具备 Web 前端、搜索功能以及包含提案功能的变更工作流。


  ### 没有词汇表的风险


  贵组织最大的十个客户是哪些？


  问题很简单？


  你能否回答以下所有问题？


  - 什么是客户？它是指一个“公司”（如“微软”）？是指一个账户（同一费率表涵盖的所有内容）？还是指我方的销售人员与之沟通的物流采购人员？

  - 客户和账户是同一回事吗？

  - 我们使用了多少种不同的“账户”定义？

  - 我们是否将归属于同一客户的所有组织都合并到一起？我们如何判断？

  - 我们认为沃尔沃汽车和沃尔沃卡车是同一家公司的一部分吗？

  - “归属于同一”是什么意思？百分之百？多数股权？合资企业？

  - 我们选择哪个发货期？

  - 我们是否依赖像邓白氏这样的外部供应商提供的数据？我们知道*他们*的定义吗？


  你是否同意，像“最大客户”这样一个看似直截了当的问题，其答案并不一定明确？


  但这是否意味着我们必须放弃，因为无法得到正确答案？选项是否太多了？


  嗯，这其实是一个提出正确问题的问题！


  问问自己：我们想用“十大客户”这个信息来做什么？这个问题可能有助于在特定意义上定义“客户”和“大”。


  **示例 4**


  “一个客户”可以是：


  - 如果在某个特定案例中我们搞砸了，所有面临风险的货运量。注意：在某些情况下，即使同一组织内部的区域机构在物流领域也不相互沟通。

  - 同一首席执行官领导下的所有实体：如果我们希望建立个人层面的、董事会级别的关系，这一点很重要。但我们该如何处理占股 50%的机构？而且，我们是否也应该关注持有我们大部分客户股份的实体（如投资基���、养老基金等）？

  - 同一购买决策下的所有业务：我们如何确定这些决策在哪个层级做出？也许组织的首席执行官并不关心较小的采购决策，将这些决策完全留给各个子公司或部门。


  每个行业都有其特定的语言。同一行业内的不同组织也形成了各自独特的措辞。不同的部门使用不同的术语。员工会根据个人背景赋予业务表达不同的含义。我相信你可以根据自己的经验，在以上列表中继续添加内容。


  所有这一切都会导致以下两种结果：


  - 不同的人用不同的名称称呼同一个对象。

  - 同一个表述被用于指代不同的对象。


  前者虽令人烦恼（你可能需要提问才能理解），但后者则可能极其危险，因为人们可能在讨论相当长一段时间后，才发现他们谈论的是不同的对象。


  我最近与一家大型货运公司的首席财务官交谈。他认为没有必要建立集中管理的词汇表。我问他，在他的公司里，财务部和销售部对“收入”的定义是否相同。他回答说这绝不可能，财务部当然是唯一能定义“收入”的部门。


  当我祝贺他其部门对这个术语被公认的业务所有权时，我问道，财务部对“收入”的定义是否已形成文档并与组织内其他部门共享。他假定前者已经做了，但不知道后者。


  我解释说，销售部门需要一个表述来形容其月度销售额的货币等值。我说我怀疑他们也使用了“收入”这个术语，只是财务部没有意识到而已。然而，他们定义的方式可能不同：为了计算销售代表的奖金，他们会将当月达成的所有销售交易的价值加总。




  ## 通用数据语言的重要性


  首席财务官说：“不对，那是错的！只有当服务实际交付时，我们才能将其计为收入！”我说：“问题就在于此！一旦不同参与方对同一术语有不同理解，中立机构就有充分的理由来进行协调。”


  首席财务官或许确实是“收入”这一术语的所有者——但就这一职责而言，他所在的部门需要与所有其他部门展开对话，以确保所有变体都得到恰当定义，并且命名清晰明确。


  在具备完善数据管理机制的组织中，所有这些不同的定义都将经过讨论、制定并记录，成为组织级术语表的一部分。


  术语表也是确保流程和政策明确无误书写的前提条件。


  此外，相对较新的“数据语言”中包含了一些已在其他语境中使用过的表达方式，缺乏现有的词汇来涵盖这些概念。


  因此，业务文档很容易被误解，因为其中使用的词语和表达可能具有多种不同含义。随着数据相关内容的增加，这一问题会愈发严重。


  ### 常见的混淆情况有哪些？


  如果有人使用了对话伙伴无法理解的表达，这本身已是个问题。如前所述，更糟糕的情况是双方对同一表达有不同的用途。我曾目睹一些会议，与会者相互交谈了数小时，才（和我一样）意识到他们指的是不同的事物。有时甚至是在会议结束很久之后，他们才发现这一分歧，并造成了重大影响。


  为了让这种情况更具体化，我们来看几个人力资源领域的业务示例。


  #### 示例 5


  在重组过程中，人力资源部门提到了“受影响”的员工。他们指的是什么？有些员工会理解为“他们的情况会发生变化。”另一些人则会理解为“那些员工会被解雇。”


  #### 示例 6


  “员工总数”需要定义清楚才能正确映射。兼职人员算作全职员工总数吗？学徒是否包含在内？“非在岗”员工（例如长期病假或休育儿假的员工）呢？


  想象一下，三个被收购的组织继续使用各自原有的 HR 系统，而你在此基础上加装了一个统一的报告工具。你必须将这三个组织的异构数据整合在一起。


  从技术上讲，对不同数据库表进行并集操作很容易。但相同的标签是否代表相同的列定义？只要数据类型兼容，即使定义不同，你甚至不会收到任何警告。


  “员工”是一个典型的实体，可以用多种不同方式来定义。回想一下上面最后一个例子：可能一个组织使用“全职当量”，而另一个组织使用在职人员。一个组织只计算全职员工，而另外两个组织则包含兼职员工。合同工是否包含在内？长期病假员工呢？


  术语表在组织数据的任务中能提供极大的支持。映射可能仍然必要，但现在你知道该如何进行了。


  除此之外，许多与数据相关的术语既需要解释也需要定义。以“数据模型”这个表达为例，它可不是时尚模特的数字等价物。这样的数据模型可能描述了两个主题之间的“关系”——但这并不能说明他们是朋友还是兄弟。


  ## 术语表需要包含哪些内容？


  术语表并不需要帮助确定“正确”的定义。相反，它需要帮助组织就一种明确无误的语言达成一致。


  任何组织都可以自主定义其用语——尽管通常来说，放眼组织之外也是明智之举，以避免在与客户、供应商及其他外部方的对话中产生歧义。


  一个完善的术语表需要包含哪些内容？


  - 定义

  - 同义词

  - 相关术语及差异

  - 对逻辑数据模型和业务流程的引用

  - 谱系

  - 变更请求的工作流


  ## 如何引入术语表？


  你是否需要说服人们术语表是有意义的？可能不需要。更常见的挑战是将多个独立的术语表合并成一个。每个部门主管、每个项目经理、每个业务架构师都曾遇到过歧义和误解的问题。


  一个常见的结论是在各自职责范围内创建术语表。你会在市场部的内网网站上找到“市场术语表”，在大多数项目文件的附录中找到术语表，而大多数专业文档（如政策或专家报告）也都附有各自独立的术语表。


  那么，如何将所有术语表合并成一个？又如何确保将来不会再有人创建另一个单独的术语表？


  这始于授权：你需要一个跨职能、董事会级别的决策，规定术语表的所有权属于数据办公室。


  是的，这个话题重要到值得董事会做决策。


