- "# 1. 了解你的组织\n\n![../images/499948_1_En_1_Chapter/499948_1_En_1_Fig1_HTML.jpg](img/499948_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n智慧企业\n\n每个人都在谈论“数据”。当你询问企业高管数据的重要性时，典型的回应是激烈赞同。事实上，越来越多的组织意识到数据正变得日益重要。\n\
  \n没错，他们可能在多年甚至数十年间没有专门的数据管理也依然成功。但即使不是数据专家也能看到，技术的演进已使数据管理变得势在必行。数据带来了许多机遇，而那些未能利用数据的组织则会面临诸多竞争劣势。\n\
  \n这是否意味着大多数组织都已做好充分准备，来应对数据时代带来的挑战与机遇？\n\n你大概猜到了，这原本是一个反问句。但究竟是什么阻碍了组织从认知到行动的关键一步？\n\
  \n让我们来仔细审视一番。\n\n要改变一个组织，你需要了解这个组织。\n\n要理解当今组织如何处理数据，回顾其历史发展颇有裨益：数据并非突然登上舞台。数据的重要性在过去几十年间是逐步提升的。\n\
  \n因此，通常没有一个明确的时刻或事件促使某个组织决定“我们需要治理和协调数据”。就像寓言中的温水煮青蛙 ^(⁷) 一样，那些本应对数据的“大爆炸”式出现做出反应的组织，却未能意识到数据的渐进式崛起。\n\
  \n相反，组织内各个领域越来越多的优秀人才看到了行动的必要性或机遇。通常，IT 部门成为孵化器，人们在这里意识到技术上的可能性。然而，在许多其他情况下，业务部门\
  \ ^(⁸) 的非技术人员感受到了痛点，并决定为此做点什么。\n\n随着时间的推移，这种发展催生了一些典型的做法（以及随之而来的问题）。让我们仔细看看。\n\n\
  ## 五种隐性的数据治理模式\n\n你无法不治理数据。数据无处不在，人们会处理它。他们会在其被允许的框架内，以及其组织对不被允许活动的容忍范围内，根据各自的具体情况，做他们认为最合适的事情。\n\
  \n这种情况类似于政治国家及其政府体系，这让我可以用政治标签来描述组织处理数据的五种模式（图 1-2）。\n\n我们会看到，作为国家政府形式效果最好的模式，在组织中未必效果最好。这一发现尤其适用于像数据管理这样广泛的议题。\n\
  \n请随意在你的组织中寻找这些模式。识别出模式有助于你应对相关风险。\n\n![../images/499948_1_En_1_Chapter/499948_1_En_1_Fig2_HTML.jpg](img/499948_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n组织中的实际治理模式\n\n### 集权式数据治理\n\n集权式模式往往出现在管理结构严密的组织中。你经常能在传统的实体组织中找到它。我有时也称其为“象牙塔模式”，因为它常常忽略了局部的知识和经验。\n\
  \n在许多情况下，其积极的出发点是组织坚信，在任何情况下，“必须有人负责”。\n\n在现实中，当涉及数据处理时，这种方法常常导致以下情况：\n\n*   组织中所有的数据专家都属于一个中央团队。\n\
  *   其他部门需要向该团队寻求见解。部门的自主活动被禁止或得不到资金支持。\n*   该团队只专注于分析。一些集权式组织也有一个处理主数据的中央团队，但这两个团队通常不被强制合作。\n\
  \n然而，这种非常传统的设置伴随着一些风险：\n\n1.  **脱节**\n\n    人们要么是业务专家，要么是数据专家。他们可能彼此无法理解。可能没有人既懂业务问题，又懂如何通过数据管理来解决这些问题。\n\
  \n2.  **利益冲突**\n\n    数据人员的目标通常与业务部门不同。可能没有一种机制能根据业务相关性来优先安排数据团队的活动。结果，数据团队可能专注于成功率更高的主题，或从数据科学角度看更有趣的项目。\n\
  \n3.  **忠诚度错位**\n\n    当业务团队与他们的中央“服务提供商”之间存在明确界限时，人们不会感觉自己属于一个更大的群体。他们很容易从“他们”（另一方）和“我们”的角度思考问题。结果，数据人员常常不觉得自己是根据其意见所做的业务决策的一部分，也看不到这与他们工作的联系。每当业务团队成功时，他们往往只会与那些他们认为属于“我们”的人庆祝——这常常排除了那些“服务提供商”。\n\
  \n    总而言之，集权式模式已不再适合支持一个日益依赖跨职能协作的商业世界。\n\n\n\n### 民主式数据治理\n\n民主式数据治理听起来不错，对吧？\n\
  \n我们应该认识到，民主是为政治国家这类社群而发展出来的。这类社群的大多数成员都是长期利益相关者，因此对短期收益不太感兴趣。\n\n要从原始的参与模式迈向可持续的民主，这些社群必须引入某些规则，以避免多数人获得短期收益，却对全体人口造成长期负面影响。\n\
  \n**示例**\n\n让我们想象一个孤岛上的社群。为了改善集体生活，他们同意以民主方式做出所有决策。\n\n过了一段时间，这个社群中最贫困的四分之三人口组织起来。他们提议将最富有的四分之一人口的财富平均分配给全体成员。\n\
  \n不幸的是，这个岛上的社群没有保护财产的“规则”。结果，由于 75%的人口投票支持这项提案，一项重新分配财富的法律得以通过。\n\n然而，从那一刻起，人们开始努力避免成为最富有的四分之一人口。生产力和创造力停滞不前，岛上的繁荣遭受了严重打击。\n\
  \n大多数民主政体都成功商定了一套规则来避免此类情况。^(⁹) 他们明白，对多数人立即有利的事情，长远来看可能会危及整个社群。\n\n尽管这样的设置对国家而言非常出色，但对组织来说却被证明并非最佳选择。在这里，管理者可能试图通过争取多数人的同意，来自私地提升自己部门的成功。如果他们的提议为组织三分之二的人带来微薄利益，却对其余三分之一的人造成灾难，他们仍然能够获得多数同意，而对整个组织毫无裨益。\n\
  \n往好了说，这些管理者只能希望组织足够庞大，能够承受他们的自私行为。往坏了说，他们可以随时离开组织，而自己的履历上则增添了一项看似令人印象深刻的成就。\n\n\
  那么，一个典型的民主组织是什么样子的呢？\n\n-   所有部门都参与对话（这绝对是一件好事！）。\n-   总是寻求所有利益相关者的同意（有时甚至是正式批准）。\n\
  -   决策的主要标准是共识或多数投票。\n\n这种设置伴随着不少风险：\n\n-   “多数人同意”并不等同于“最佳解决方案”。多数投票可能只代表少数人的价值，从而对整体组织产生负面影响。\n\
  -   个人议程可能会阻碍组织前进的道路。\n-   管理者因同意同事的提议而获得回报，以便这些同事日后也能同意他们自己的建议。\n-   民主流程可能需要很长时间才能最终做出决策。\n\
  -   缺乏多数支持可能被用作不作为的借口：“我已经尝试了一切，但组织不愿意跟进。”\n\n这个模型的一个重大危险在于，它听起来像是正确的事情。谁又敢说反对民主呢？\n\
  \n### 自由式数据治理\n\n一些组织决定不对数据处理进行规范。\n\n有趣的是，我们主要谈论的并不是那些对数字化等现代数据议题陌生的传统组织。\n\n相反，我们看到相当多的科技初创公司应用了这种模式。大多数情况下，原因是这些组织专注于高速发展其主要业务领域，不希望任何内部法规拖慢他们的脚步。\n\
  \n这种行为让我想起了第一次互联网浪潮中的主角们。他们中的许多人因为缺乏适当的财务设置而失败。当时没有首席财务官（CFO）就相当于今天没有首席数据官（CDO）。而且请期待后果会类似！\n\
  \n自由式数据治理通常具有以下特征：\n\n-   各方完全自治。\n-   数据事务的责任在部门层面定义，程度各不相同。\n-   数据领域存在许多伪专家。\n\
  -   每当人们公开交流数据方法时，他们的重点不是说服他人，而是自我吹捧。\n\n这种环境伴随着一系列广泛的风险：\n\n-   大量孤立设置（例如，多个独立且互不兼容的词汇表）。\n\
  -   业务模式变革缓慢。\n-   人们发现问题，但不知道该找谁谈。\n-   一半人成为宿命论者。另一半人成为利己主义者（略有夸张）。\n-   变革的复杂性：没有人能全面了解某项特定变革的所有影响。这就是为什么重大的业务变革通常需要对\
  \ IT 全景进行完整评估。\n\n### 技术官僚式数据治理\n\n在 2019 年 9 月的一次数据会议上，我听到有人说：“我们数据问题的解决方案不是技术，而是架构！”不用说，这个人是在他所在组织的架构团队工作……\n\
  \n虽然我同意这句话的第一部分，但第二部分反映了一种典型的视角：假设你需要从*解决方案*的正确部分开始。技术官僚方法常常忘记，相反，你应该从*问题*开始。\n\n\
  我给技术官僚组织的建议是：为了有效治理数据，*所有*方面都需要做出贡献——但请考虑顺序，不要从技术开始。（注意：也不要从架构开始！）\n\n但技术官僚组织是什么样子的呢？我们通常会发现这种设置：\n\
  \n-   人们将数据视为一个技术议题。\n-   数据事务的责任已明确定义——但全部都在 IT 部门。\n-   有大量软件用于管理和分析数据——但业务方面几乎没人理解其背景。\n\
  -   方法：“这是解决方案。你有需要解决的问题吗？”\n\n风险：\n\n-   错失了需要同时理解*业务情况*和技术选项的机会。\n-   业务方面越来越脱离：“让\
  \ IT 去处理吧。”\n\nIT 部门常常甚至不认为这种情况是个问题。“它运行着呢……”\n\n\n\n### 无政府式数据治理\n\n通常情况下，资深业务人士习惯于相信他们数十年的经验。利用众多这类资深人士的经验和知识是传统组织的典型做法。\n\
  \n在此类组织中，经验和直觉的运用通常得到了良好的管理。你会发现大量的指导委员会——经理们在那里交换意见，并以某种方式达成决策。然而，从未有人试图描述从“直觉到理性”的路径：如何验证感受，如何正确看待它们，如何将它们与具体的业务目标相匹配？\n\
  \n相反，任何一位经验丰富的经理所说的话都被假定为是该经理执行了可靠（尽管是无意识的）评估过程的结果。\n\n正如你可能猜到的，在这种模式下，除了作为轶事依据外，数据毫无立足之地。（你会把“我这个月已经见过两次这种情况了！”算作运用数据吗？）\n\
  \n几乎没有任何有意识的管理发展会催生出这样一种数据治理模式。\n\n而且，确实，无政府式数据治理并非决策的结果。它恰恰代表了一种没有任何有意识引入模式的状态。\n\
  \n不幸的是，这正是许多组织在数据管理方面所处的状况！\n\n无政府式数据治理通常具有以下特征（我仅稍作夸张）：\n\n-   在受监管领域之外，数据是个无足轻重的话题。\n\
  -   对经理的尊重与其资历成正比。一位服务了 30 年的人肯定懂。\n-   “约翰就是这么说的！”被视为一个有效的论据。\n-   难以理解管理层的决策。\n\
  -   对业务模式实施变革风险很高，因为没人敢质疑高管的决策。\n\n这种治理模式与自由模式有一个共同的关键风险：\n\n-   变革的复杂性：由于缺乏对数据全景的概览，没人能估计变革的影响。这就是为什么任何重大的业务变革都需要对\
  \ IT 系统全景进行全面评估。\n\n在这种环境中，很难通过根本原因分析从失败中吸取教训。相反，人们倾向于回避那些曾经导致失败的决策，而不去探究其因果关系。\n\
  \n![../images/499948_1_En_1_Chapter/499948_1_En_1_Fig3_HTML.jpg](img/499948_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n事实是决策的敌人\n\n## 数据事务中的行为模式\n\n理解你所在组织当前的数据治理方法很重要。然而，具体的行动需要更深入地了解你组织中的人员如何（以及为何）应对数据挑战。\n\
  \n### “数据是 IT 部门的事”\n\n如果你随机询问任何组织的 100 名员工，“数据是 IT 话题吗？”，你至少会听到 95 次“是”。\n\n人们为什么会这么想？毕竟，在计算机出现之前，数据早已存在。\n\
  \n想听个例子吗？这就是！\n\n圣经在描述耶稣基督诞生时是这样开头的：^(¹⁰)\n\n> ^(*1*) *当那些日子，凯撒*奥古斯都 *有旨意下来，叫天下人民都报名上册。*\
  \ ^(*2*) *这是居里扭作*叙利亚 *巡抚的时候，头一次行报名上册的事。* ^(*3*) *众人各归各城，报名上册。*（路加福音，1971）\n\n这次人口普查就是一个古老的数据管理例子。我们可以假设凯撒奥古斯都没有\
  \ IT 部门。不过，他很可能有一个**数据**部门。\n\n让我们来看看 IT 的角色。自从这门学科发展起来，它就一直利用硬件和软件来帮助更有效地处理所有这些数据。\n\
  \n结果，任何想要获取数据的人都必须与 IT 部门沟通。数据的采集、传输和存储也是如此。\n\n而 IT 代表着巨大的进步！没有当今的技术，我们只能利用数据价值的一小部分。凯撒奥古斯都会为能拥有哪怕一部分处理他所收集数据的可能性而兴奋不已。\n\
  \n许多人似乎忘记了：IT 代表信息*技术*，而不是信息本身。IT 旨在为拥有数据的业务职能提供服务，以便利数据的处理。\n\n我们现在能得出结论说我们需要把“数据”从\
  \ IT 部门剥离出来吗？\n\n事实上，数据办公室是否设在 IT 部门之下，对其成功并非至关重要。关键的是其**授权**和支持。而且，数据办公室需要是一个独立的团队，不应与其他任何学科混杂在一起。\n\
  \n在这种情况下，数据办公室应设在其可信度和有效性最高的地方。这可能是 IT 部门，也可能是任何其他职能，具体取决于组织的文化和传统。\n\n尽管有上述陈述，你可能仍希望让员工知道，数据*不是*信息技术。\n\
  \n### “我们可以专注于分析”\n\n数据世界过于庞大且相互关联，无法只聚焦于某一个方面。你需要审视整个数据宇宙才能实现数据可持续管理。但你会一次又一次地发现，人们将“数据”和“分析”混为一谈。\n\
  \n这种情况让我想起一个古老的故事：\n\n*一天，母鸡把小鸡们召集起来，郑重其事地告诉它们：“现在你们长大了，我可以和你们分享一个智慧。到现在为止，你们被告知鸡舍的篱笆就是世界的尽头。”她用翅膀指向地平线，深吸一口气，将她的智慧分享给下一代：“篱笆**不是**世界的尽头！世界的尽头在那边，在森林的边缘……”*\n\
  \n如果一个组织的数据活动直接始于数据科学和分析，你可能无法获得期望的结果。这是因为数据世界的范围超越了分析。\n\n这就是为什么你可能希望首先建立一个恰当的**数据基础**，以确保所使用的数据的结构、用语和质量得到充分理解。这样的基础需要涵盖主数据和事务数据，并且应适用于内部和外部数据。需要正确定义数据治理，以确保每个人都遵守相同的规则。\n\
  \n如果你把数据比作冰山，分析就是可见的部分。记住，这仅仅是远小于整体的一部分！\n\n但是，你如何判断一个组织是对数据有全面的认识，还是只关注分析呢？\n\n\
  看看该组织最高数据负责人的职位描述。即使这个职位被称为“数据管理负责人”或“首席数据官”——如果其描述与首席分析官或机器学习团队负责人的描述相同——那么这个组织可能搞错了方向。\n\
  \n一个典型的警报信号是，组织期望首席数据官能够在技术上指导数据科学家，例如，使用 `Python` 和 `TensorFlow` 实现无监督机器学习模型。这样的组织确实是将首席数据官与数据科学团队负责人混淆了。^(¹¹)\n\
  \n如果不及早解决，这是一种危险的情况，因为这种数据团队会不断产出“成果”，所以差距不会很快显现。\n\n### “这是数字化转型”\n\n数字化转型是需要恰当数据管理的众多领域之一。但它并非唯一的一个。因此，管理组织数据的优先级不应由组织的数字化转型团队（或任何其他需要数据的单一领域）来设定。\n\
  \n数字化转型可能会成为你数据办公室的头号议题。但只有在对所有领域进行跨职能审查之后，你才能确定这一点！\n\n\n\n### 分析瘫痪\n\n有些组织坚信自己是数据驱动的，但实际上，他们却被数据所阻碍。\n\
  \n我指的是那些允许滥用数据的组织。其结果是，数据变成了一种武器，或者人们用数据来质疑每一个他们不喜欢的决策。\n\n如你所知，几乎任何事物你都能用数据证伪——前提是由你来决定使用哪些数据以及如何操作。\n\
  \n但最常见的情况是，人们在没有百分之百的数据支持时就不敢做决定。一个典型例子是在“选择 X”和“不选择 X”之间做抉择，而数据可以证明这两种选择都带有风险。被数据阻碍的组织在这种情况下往往*不做决定*。相反，他们会要求请求者重新评估，并带回更多证据。最终，要么根本不做任何决定，要么请求者会篡改数据，使其完全支持其中一种选项。显然，这两种结果都不可取。\n\
  \n这种行为为数据办公室提供了很好的存在理由。由于其中立性，它没有取悦任何一方的利益。\n\n这也是组织*不应该*拥有超过一位（高层）首席数据官（CDO）的一个充分理由：必须有人拥有最终决定权。\n\
  \n### “数字原住民知道怎么做”\n\n他们真的知道吗？\n\n大多数数字原住民主要熟悉数据的*使用*。他们不一定知道如何获取、管理、组织和提供数据。\n\n\
  这里我们面临两种根本不同的技能集。知道如何在女王餐桌上吃饭，并不意味着你就能成为星级大厨。\n\n数字原住民中最大的问题往往是他们对数据的简化观点。作为现代设备的用户，他们往往只看到其中容易的部分。或者，正如欧洲领先的\
  \ IT 与科技杂志 *c’t* 所言：“虽然所有数字原住民都知道如何在 Instagram 上发一张自拍，但他们中几乎没有人知道什么是命令行，更不用说编程了”（Gieselmann,\
  \ 2020）。^(¹²)\n\n相反，我们需要的是那些知道如何服务这些数字原住民的人。不幸的是，这种人非常罕见。\n\n### “我们的业务部门可以自行处理数据”\n\
  \n人们通常认为职能专家也能够处理自己工作所涉及的数据方面。这种假设在许多情况下不仅是错误的。它还会导致**筒仓思维**、不一致性和重复劳动。\n\n### “一切都没问题”\n\
  \n这是目前为止我从高管那里听到的最常见的说法。他们会问：“你打算解决什么问题？”\n\n在那些尽管从未考虑过专门的数据管理，却已成功运营数十年的传统组织中，你经常能听到这种说法。\n\
  \n但在那些自认为已做好充分准备，可以进行有效报告、数据分析和人工智能的动态初创公司中，你也能找到这种说法。\n\n这种情况最具挑战性。这个问题本身是合理的。但如果提问者不愿意倾听你的意见——或任何其他被视作可信赖顾问的人——那么这个问题将始终得不到答案。\n\
  \n### “整顿一下，打个勾了事”\n\n并非所有组织都意识不到自己面临数据问题。糟糕数据的影响已经变得过于明显，或者所需的数据根本不存在。\n\n但并非所有应对措施都同样适合可持续地解决问题。一个非常危险的选择是“一次性”方法：设立一个项目来解决组织的数据问题，并打算在项目结束后恢复一切照旧。\n\
  \n这种方法是什么样的？这样的组织不会寻找首席数据官（CDO），甚至不会设立数据办公室。相反，他们会聘请一家外部咨询公司，或寻找一位临时的数据经理来“解决我们的数据问题”。\n\
  \n你可能猜到了，这种思路注定会失败，就像你不能指望“一劳永逸”地修好一个技术设备，然后期望它不再出故障一样。\n\n因此，至关重要的是要在组织中灌输这样一种认识：必须像对待其他资产一样对待数据——这意味着需要持续的主动管理。\n\
  \n英飞凌科技公司的首席数据治理总监 Jürgen Schubert 博士是这样说的：“数据不是一个有结束日期的项目。你需要持续不断地投入精力。”\n\n但为什么那些绝不会认为自己可以停止维护有形资产的组织，却认为他们可以一劳永逸地整理好他们的数据呢？\n\
  \n在过去几年里，我遇到了三种主要模式：\n\n1.  **数据不被视为一种资产。**\n\n第一个原因无疑是数据尚未被视为一种具有完整价值的资产。\n\n在这种情况下，我建议明确与组织的传统（有形）资产进行比较，并仔细审视其他无形资产，如专利。人们会发现比他们最初想到的更多的共同点。因此，这种比较通常会产生令人惊讶的效果。\n\
  \n关于数据作为资产的更多思考，请参见第 16 章。\n\n2.  **权宜之计的数据处理。**\n\n一些组织遵循务实的方法：“哪里坏了，我们就修哪里！”他们愿意在必要时再次启动一个新的数据修复项目。\n\
  \n如果你面临这种情况，引用外部专家的知识可能会有所帮助。早在 1993 年（那时几乎没有人谈论数据管理），G. Labovitz 和 Y. Chang 就在他们著名的著作《Making\
  \ Quality Work: A Leadership Guide for the Results-Driven Manager》（Labovitz, Chang,\
  \ & Rosansky, 1993）中描述了**1-10-100 法则**。该法则量化了低质量的隐藏成本。\n\n根据 1-10-100 法则，如果你在错误造成损害之前纠正它，你可以将失败成本降低十倍。如果你从一开始就防止错误发生，你甚至可以将成本降低一百倍。^(¹³)\n\
  \n即使没有科学证据证明精确的因子，这一法则的数量级已经随着时间的推移在各个领域得到证实，包括数据质量领域。\n\n换句话说：是的，持续的数据管理需要花钱。但如果用它来保持你的数据质量处于良好状态，与需要修复数据质量相比，你的组织将节省大量资金；而与数据质量不足所造成的损害相比，你将节省更多的资金。\n\
  \n用你组织中观察到的例子来支撑这一法则应该不难。\n\n你可以在第 10 章中读到更多关于数据质量的内容。\n\n3.  **数据被视为竞争者。**\n\n\
  另一种完全不同的、导致不可持续方法的原因是当前高管们害怕失去影响力或独立性。他们宁愿聘请一个可以随时解聘的外部团队，也不愿接受一个永久的额外权威。\n\n这种局面的挑战在于，没有人会承认自己被这种动机驱使。每当你感觉某位高管“应该更明白事理”时，你可能需要深入挖掘并提出更多问题，以了解敌意行为背后的真正驱动力。\n\
  \n如果你将数据办公室定位为永久的支持来源，你或许就能展示其即时价值。人们需要理解，数据办公室的主要目标是帮助其他职能部门表现得更好，而不是取代它们。\n\n\
  关于利益相关者管理的更多思考，请参见第 4 章。\n\n脚注 1 2 3 4 5 6 7\n\n"
- "# 2. 有效数据管理的各个方面\n\n![../images/499948_1_En_2_Chapter/499948_1_En_2_Fig1_HTML.jpg](img/499948_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n观点很好——数据更佳\n\n\n\n## 成熟度评估\n\n要使数据管理行之有效，需要考虑许多不同方面。本章旨在让你对最关键的要素有一个总体认识，后续章节将进行深入探讨。\n\
  \n在阅读本章时，你或许希望对照“理想状态”对你的组织进行一次**成熟度评估**。我建议你不要在正式化此评估上花费过多精力。能够对其进行衡量就足够了，这样你就可以在推进过程中量化进展。\n\
  \n然而，理解成熟度评估存在两个截然不同的目标群体，这一点至关重要，它们需要完全不同的方法：\n\n-   第一个目标群体包括你自己以及所有已经全身心投入、希望让组织成为数据驱动的人。这个群体需要知道还有多少工作要做、工作在哪里开展，以及阻力会有多大。\n\
  -   第二个群体包括所有仍需被说服“我们目前存在问题”的利益相关方。对于这个群体，差距分析应包含错失的机遇和未解决的问题，以及各自相关的财务影响。\n\n理想情况下，你会同时进行这两项评估。在利益相关方被说服之前，你不会将第一个评估结果用于他们。但一旦他们被说服，这个成熟度评估就为制定路线图和公开讨论优先级奠定了坚实的基础。\n\
  \n## 两大主要差距\n\n正如我们在前一章所见，任何常见的数据治理模型似乎都无法充分应对数据管理和分析带来的挑战与机遇。\n\n那么，所有模型共同的主要差距是什么？\n\
  \n大多数组织面临以下两大挑战：\n\n-   **缺乏协作**\n-   **缺乏业务所有权**\n\n我建议你在评估组织时，密切关注这两个领域。它们会反复出现，并且应该在所有数据管理学科中得到解决。\n\
  \n## 辅助性原则\n\n我们已经看到，历史上形成的处理数据的方式可以用政治学术语来描述。但是，当我们试图开发有用的**解决方案**时，我们在州政府治理领域也能找到很好的类比。\n\
  \n在这两个领域都已被证明成功的一个方法是*辅助性原则*。\n\n**辅助性原则**是“中央权力机构应履行辅助职能，仅执行那些无法在更基层层面完成的任务”的原则。^(¹⁴)\n\
  \n但这个原则在数据管理的背景下意味着什么呢？\n\n你会发现领导者们常常自问：\n\n-   数据应该由一个被充分授权的、高度专业化的中央团队集中管理吗？\n\
  -   还是应该让整个组织的每个人都参与数据管理？\n\n如果你遵循辅助性原则，你会发现它**不是**这两种极端情况。\n\n相反，辅助性原则建议，在合理的地方集中数据职责，而将其他部分留给“现场”——这可能指的是业务职能部门、子公司或地域单元，具体取决于你的组织。\n\
  \n仅靠智能地拆分职责并不能解决你的问题。要使其发挥作用，你需要为所有涉及的团队配备他们所需的一切！\n\n在本书中，你将找到关于数据管理的哪些领域应该委派或集中的建议。现在，我们可以陈述我们的第一个定理。\n\
  \n**数据管理定理 #1**\n\n数据相关职责和活动的组织需要在集中与委派之间进行谨慎的平衡。\n\n-   任何集中都需要充分的理由。\n-   任何委派都必须包含信任和支持。\n\
  \n## 业务导向\n\n技术驱动型的人常常倾向于从解决方案入手。他们的想法是“肯定有一个应用能用到这个新奇的高科技！”\n\n如果你想避免落入闲置高科技的陷阱，就不要从解决方案开始——而要从问题或机遇开始。\n\
  \n经验表明，这种范式转变很难被消化，尤其是对于经验丰富的 IT 领导者。他们习惯于主动提供最先进的解决方案。\n\n为了应对这一挑战，你可以考虑以下三点建议：\n\
  \n-   始终自问：是存在一个问题（某些事情没有按应有的方式运作）、一个机遇（目前运作尚可，但仍有改进空间）还是一项创新（一种新的商业模式）？确定并量化真实的痛点或可能的收益。\n\
  -   寻求对话：共同假设收益，并与相应的业务职能部门一起验证。\n-   培养产品思维：从项目经理到产品负责人的转变对数据管理是有益的。它增加了超越项目结束的长期视角！\n\
  \n我用两个图表来说明这种变化。建议增加业务投入这一点，通过第二个图表中浅色区域的增加来体现。\n\n这就是 IT 团队几十年来一直采用的工作方式。\n\n![../images/499948_1_En_2_Chapter/499948_1_En_2_Fig2_HTML.png](img/499948_1_En_2_Fig2_HTML.png)\n\
  \n图 2-2\n\n传统的步骤顺序\n\n而这是让业务职能尽早参与的新模式。\n\n![../images/499948_1_En_2_Chapter/499948_1_En_2_Fig3_HTML.png](img/499948_1_En_2_Fig3_HTML.png)\n\
  \n图 2-3\n\n业务驱动的方法\n\n这种模式的一个重要方面是缺少严格的交接点：在整个周期中，双方都参与对话。这对于瀑布式项目而言，甚至在产品的整个生命周期中都是可行的。\n\
  \n非常小的公司通常不会面临缺乏业务导向的问题。在这里，IT 人员通常与业务部门关系密切，原因很简单，就是公司规模小。有时，优化流程的人同时也负责后续的软件修改。\n\
  \n然而，这种公认非常有效的方法无法规模化。随着组织的成长，对专业化的需求也随之增加。但角色的专业化需要有意识地在所有这些专家之间组织对话。\n\n这时，主动数据管理便登场了。\n\
  \n业务视角与技术之间的差距主要存在于流程和数据领域。\n\n此外，来自双方的人员常常认为自己很开放，而实际上却不自觉地固守旧有的思维模式。他们中的许多人确信自己的思考和行动是为了组织的利益。\n\
  \n![../images/499948_1_En_2_Chapter/499948_1_En_2_Fig4_HTML.jpg](img/499948_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n分析工作因分析而过载\n\n为了应对这种情况，数据办公室需要具备以下能力的团队成员：\n\n-   理解流程和数据\n-   理解推动 IT\
  \ 专家和业务专业人士前进的动力是什么\n-   设法保持“中立”，即他们不以预设的视角工作，对双方的想法和关切同样开放\n-   能够进行调解并展现同理心\n\
  \n同样，这种数据办公室角色的授权必须来自最高层，而尊重和信誉则需要通过数据办公室自身的出色工作来赢得。\n\n**数据管理定理 #2**\n\n数据管理是每个人的职责——贯穿整个组织。尤其不是\
  \ IT 部门的工作，并且它不从技术开始。\n\n它关乎在深刻理解双方的基础上，在业务与 IT 之间搭建桥梁。\n\n\n\n## 商业导向\n\n除非你为公共或非营利组织工作，否则处理数据需要为股东创造可衡量的价值。\n\
  \n归根结底，任何在数据上投入的组织都希望看到回报。我称之为**数据回报率**。\n\n这个表述源于金融术语“投资回报率”——这对于任何需要花钱的活动都至关重要：只有当它能带来回报时，你才会去做。\n\
  \n“数据回报率”这一表述背后的理念是：处理数据本身并非目的。所有数据活动都必须根据其对组织整体状况的影响来评判。\n\n这包括间接和长期影响，以及潜在问题的规避（这意味着要处理风险）。^(¹⁵)\n\
  \n短期内，一些高管可能会因为“大家都在做”、“这是未来的趋势”或“我们不应落伍”而同意投资数据。然而，从长远来看，尤其是首席财务官会希望看到回报的计算结果。\n\
  \n正如第 16 章所述，构建令人信服的商业案例，其目的并非为了让数据投资看起来足够有吸引力从而获得资金支持。相反，你需要从一开始就具备商业导向。确定一个负面的商业案例并非失败！\n\
  \n### 协作\n\n协作至关重要，原因如下：\n\n-   每位利益相关者都参与其中。\n-   组织的所有领域都参与其中。\n-   组织从全体员工的共同创造力和知识中受益。\n\
  -   它避免了平行的重复工作（这会导致效率低下和不一致）。\n\n遗憾的是，协作不会自动发生。在数据事务上推行协作理念，是首席数据官应首先引入组织的创新之一。\n\
  \n协作需要一个能够促成并推动它的环境。这个环境包括治理和组织架构，但也需要激励机制和培训。人们需要理解为什么离开自己的“孤岛”对他们有益。\n\n## 数据办公室\n\
  \n协调一致的协作需要一个强大的枢纽，且该枢纽不能有任何自身的职能利益。按照定义，数据办公室就是这样一个地方。\n\n如果你想动员并充分利用组织内全体员工的智慧，我强烈建议：\n\
  \n在数据办公室内设立一个专门的协作职能，负责促进和协调所有利益相关者之间的协作。\n\n## 清晰的数据所有权\n\n没有清晰的数据所有权，每个人都会觉得自己有权处理各种数据，而没有人觉得需要对数据负责。这种行为会导致不同“孤岛”之间的不一致。\n\
  \n所有权促使人们相互沟通。“我需要 X，我知道谁拥有它。所以我要去找那个人谈谈”——这才是你希望看到的行为。\n\n## 决策与升级流程\n\n你不需要一个升级流程，因为人们之间相处得很好？\n\
  \n我不同意。\n\n如果你把分歧的结果交给个人关系来处理，很可能无法做出最佳决策。\n\n相反，一个基于事实和规则的决策流程假定：\n\n-   所有各方都怀着善意行事，代表各自的职能立场。\n\
  -   由此得出的结论可能无意识地存在偏见。\n-   但即使是基于事实的职能结论，如果仅局限于对单一职能的影响，也可能并非最优。\n\n数据管理定理 #3\n\
  \n仅仅依据*某些*事实来做决策是不够的。你需要考虑*所有*相关事实——贯穿整个组织。\n\n作为此类决策流程的一部分，“升级”简单来说就是将决策权提升一个层级。理想情况下，你希望将其从部门视角提升到跨职能视角（这有助于减轻偏见），并最终提升到整体“股东”视角（这能消除偏见）。\n\
  \n这样的流程有助于做出不受个人视角和动机影响的决策。\n\n此外，即使是组织中较低层级的员工，也会被鼓励立即提出跨职能的优化方案，因为他们预见到自己将被要求从跨职能的角度思考问题。\n\
  \n## 信息共享\n\n你可能希望同时分享官方信息和想法。而这不是一条单行道。每个人都应该能够以系统化的方式与他人分享自己的想法。\n\n本质上，你需要一个或多个技术平台，但你的治理机制也需要将其宣称为唯一的去处。并且，数据办公室的成员应该被期望成为首批积极使用这些平台的人。\n\
  \n## 数据管理网络\n\n你如何了解组织各个领域的不同视角？毕竟，任何组织都包含以职能为导向的人、以地域为导向的人、以成本为导向的人、以客户为导向的人，以及其他各种不同侧重点的人。\n\
  \n是的，你需要构建一个网络，将所有这些人都汇聚在一起。\n\n除了面向全体员工的协作平台之外，建立一个面向“数据专家”的专用网络也是很好的。\n\n这样的网络应该足够全面，能够覆盖你组织的所有领域，但也应该足够精简，以便能够进行联合电话会议以及其他潜在的联合“实时”活动。因此，一种有前景的方法是，与指定的数据管理员合作，每人代表一个特定的群体。\n\
  \n数据管理网络的一个关键理念是将信息流从“批量模式”转变为“对话模式”。换句话说，讨论应该成为可能。数据办公室工作人员的积极主持将确保讨论聚焦，而文档记录将允许适当的后续跟进。\n\
  \n请记住数据管理定理 #2：数据管理是每个人的工作——在每个组织中都是如此。\n\n## 检查清单\n\n你的方法应该……\n\n-   连接不同部门\n-\
  \   连接业务与 IT\n-   连接数据供应链的所有环节\n-   奖励协作\n-   让人们自愿协作\n-   让合作变得容易\n-   利用协同效应\n\
  -   避免重复和不一致\n-   为所有议题明确指定的联系角色和人员\n\n## 动机\n\n我之前提到过，没有强有力的董事会授权，数据管理永远无法奏效。\n\
  \n同样，仅有强大的授权也是不够的。\n\n那些被强迫服从但内心并不信服的人，可能会找到办法来破坏你的工作。\n\n数据管理定理 #4\n\n首席数据官既需要董事会的授权，也需要员工的理解与支持。\n\
  \n前者必须从一开始就存在。\n\n后者必须由首席数据官来争取实现。\n\n\n\n## 跨职能性\n\n**优化法则**源于运筹学的一个古老发现：\n\n**对整个组织而言最佳的数据方案**\
  \  \n始终优于  \n**所有局部最佳数据方案的总和**。\n\n换言之：如果组织内不同部门各自独立优化，你将无法为组织实现最优配置。\n\n为何如此？\n\
  \n试想那些确实可以独立优化的领域，例如图形加速器、线性方程组或 `MapReduce`。这类方案成功的基本前提是什么？\n\n答案在于**不存在相互依赖关系**！\n\
  \n当某个过程的最终或阶段性结果影响到另一过程的结果时，这两个并行过程就存在相互依赖关系。\n\n任何组织中的数据都面临着同样的情况：数据跨越职能和地域边界。\n\
  \n举例来说？财务部门识别的客户支付信用，应与销售部门共享。销售代表收集的客户信息，应提供给客户服务部门。\n\n人们越来越多地谈论“客户 360”，这绝非偶然：客户各方面的信息（通常由不同部门收集）需要整合汇总，并向组织内所有潜在用户开放。360\
  \ 度全景周期这一概念，恰如其分地体现了其核心理念：从各个角度审视客户。\n\n这种做法并非简单改进各职能的活动。若不能系统性地跨渠道共享客户数据，即便是针对\
  \ B2B 客户的**全渠道解决方案**等重要进展，也根本无法实现。\n\n不过，这种 360 度视角并不仅限于客户数据。产品数据与销售、电子商务、市场营销、生产、财务、客户服务等部门都息息相关。市场洞察则关系到定价、产品开发、市场营销以及研发等众多领域。\n\
  \n从数据角度看，众所周知，局部最优方案的总和通常不等于全局最优方案。如前所述，原因在于不同领域之间存在大量相互依赖关系。\n\n以下两个示例有助于理解这一数学法则：\n\
  \n*   销售部门希望增加收入，最容易的办法是同意折扣。但财务部门则认为折扣会降低利润率。\n*   项目团队希望按时、按预算完成。这可能导致次优方案，因为未考虑对未来项目及其他部门的影响。\n\
  \n这是一个组织层面的挑战：团队成员通常知道什么对组织最有利——但他们惧怕自己的上司，因为上司的激励（无论是正式还是非正式的）都基于其自身负责领域的孤立成果。\n\
  \n我们必须认识到，没有任何一个部门拥有独立的股东。为某个部门创造价值，若导致其他部门成本增加，从全局来看并无意义。\n\n因此，在董事会层面有意识地应对这一局面至关重要：\n\
  \n**通过让所有人始终聚焦于整个组织的利益。**\n\n组织可以通过遵循以下原则来实现这一目标。\n\n### 聚焦组织级目标，而非部门级目标\n\n应鼓励管理者和个人贡献者，如同自己是组织所有者一般行事。这可以通过将每个人的目标与组织目标对齐来实现。\n\
  \n如果不主动处理这个问题，组织最终只能依赖员工偶然拥有“正确态度”。这种方法对某些人有效，但绝不可能适用于所有人。\n\n管理层常常自豪地谈论他们“卓越的员工队伍使我们有别于竞争对手”。坦白说，如果一个行业内的所有优秀人才都恰好决定为你的组织工作，而能力差的人都去了你的竞争对手那里，这简直是难以置信的巧合。\n\
  \n相反，你应该通过激励和奖励机制，让即使是最自私的员工也自愿为组织做出最佳贡献——因为这对他们个人也是最有利的！^(¹⁶)\n\n你还需要定期评估什么能激励员工行动——因为这是会随时间变化的。\n\
  \n### 激励协作\n\n设定协作目标——激励员工在自己负责领域之外创造价值。\n\n这也应纳入商业案例的结构！如果项目能从组织角度创造出最佳解决方案（即其他部门也能受益），那么它们就应该获得更多资源、时间和资金支持。\n\
  \n确保不同部门的成员彼此认识（且信任）也有助于实现这一目标。因此，团队建设活动和全组织范围的成功庆祝活动能够创造非常切实的价值。\n\n### 让“聚焦”成为组织文化的一部分\n\
  \n应培养一种“设身处地站在组织所有者角度思考”的文化（即使没有单一所有者）。\n\n这种文化并不等同于“专注于财务股东价值！”每个组织都必须兼顾股东、员工和客户这三者。明智的所有者恰恰会这么做。许多组织所缺乏的，是一种鼓励**每一位员工**都采取相同视角的文化。\n\
  \n你或许还应收集“全组织思维”的杰出案例，并公开表彰这些典范人物。这些案例不应仅限于团队合作顺畅的情况，也可以包括员工单方面采取行动而使其他部门受益的事例。\n\
  \n认为某些团队比其他团队更重要是有害无益的——即使一个组织将其成功主要归功于某个特定团队（例如工程团队）。相反，人们应该将组织视为一个类似人体的整体：\n\n\
  *   足球运动员或许认为脚是他最重要的身体部位——但如果前交叉韧带（ACL）撕裂了，脚又能做什么呢？这条韧带基本将膝盖固定在一起，膝关节功能失常，再好的脚也无用武之地。\n\
  *   没有强壮的身体来执行指令，大脑又能做什么？\n*   此外，考虑一下身体的所有“支持功能”。你的大肠无疑不是身体中最光鲜的部分——但老兄，如果它工作不正常，人可要遭大罪了！\n\
  *   而且，没有人会问心脏和肺哪个更重要。任何一个器官如果出了问题，整个有机体都将不可避免地衰竭。\n\n**数据管理定理 #5**\n\n`数据管理`需要具备跨职能性——因为数据本身就是跨职能的。\n\
  \n## 变革管理\n\n如今，几乎没有哪个组织是彻底以数据为中心的。换句话说，将焦点放在数据上意味着对几乎所有组织进行一次根本性的变革。\n\n或者，正如生物技术公司`Abcam`的消费者洞察与分析副总裁\
  \ Kirstie Speck 在一次数据会议上所说：“要意识到你们从事的是变革管理行业！算法反而是简单的部分。”\n\n过去几十年间，大多数组织都曾多次面临变革的需求。这促使一门专门管理变革的学科发展起来。你可以认为，由此产生的方法论同样适用于庞大的“数据变革”。\n\
  \n**数据管理定理 #6**\n\n成为数据驱动型组织需要在整个组织范围内推行变革。\n\n\n\n### 数据素养\n\n我记得曾与一家大型企业的产品经理讨论产品与服务的逻辑。他清楚自己商业上想要什么，但却无法将其描述出来。可他早已发现现有的系统架构不够灵活。\n\
  \n当我问及过去现有的产品模型是如何在软件方案中实现的，他回答说：“我不知道。但我是在结果基础上搭建的。我们信息技术部的同事帮我搞定了所有技术工作。”\n\n\
  这不应该是目标！相反，业务人员需要理解如何清晰表达自己的业务需求。他们的想法通常有结构，但自己并未意识到。他们应该意识到。\n\n有时，当被问到正确的问题时，业务管理者可能会自行发现其思维中存在逻辑漏洞——而部门之外的人又如何能发现这一点呢？\n\
  \n毋庸置疑，我与那位产品经理讨论的产品架构不仅灵活性不足，而且在整个组织内的实施也不一致——不同的人对其理解各不相同。业务负责人既无法发现问题，更别提解决问题了。\n\
  \n谢天谢地，你可以通过提升组织的数据素养水平来改善这种情况：\n\n### 帮助员工理解数据\n\n与其将数据逻辑“外包”给信息技术部（后者可能并不完全理解所有的业务动机），更有效的方法是帮助业务人员理解数据的基本原理，并用无歧义的语言表达他们期望的逻辑。\n\
  \n在此背景下，关键的一点是：你的目标不是让所有员工像“学习”词汇一样去“学习”数据。数据本身会不断变化。相反，要训练员工去“思考”。他们应该能够自主做出判断，并自行跟上任何变化。\n\
  \n### 共享知识\n\n2019 年，我在迪拜的一场人工智能大会上发表演讲，迪拜人工智能事务国务部长奥马尔·苏丹·奥拉马发表了开幕致辞。他提醒与会者，中世纪之前的中东地区曾一度在全球科学领域处于领先地位。然而在两百年内，这一优势便丧失了。转折点是什么？\n\
  \n据这位部长所言，转折点是一个名叫约翰内斯·古腾堡的人的一项小发明：机械[活字印刷术](https://en.wikipedia.org/wiki/Movable_type)。\n\
  \n这项发明将书籍（以及书中的知识）普及给了大众——但中东地区除外，那里书籍被禁长达数百年。\n\n迪拜从这段历史中学到了什么？他们不会再让下一次革命从身边溜走。正因如此，他们是唯一设有专职人工智能事务国务部长的国家。\n\
  \n但我们又能从这个故事中学到什么？\n\n如果你想充分利用员工的力量，知识共享至关重要。\n\n组织应该通过让全员接受数据培训来实现知识民主化。\n\n###\
  \ 共享数据\n\n每个人都应该获得可供分析的数据。这不仅限于熟练的数据科学家——即使是蓝领工人都能从描述其直接工作环境的数据中得出有价值的结论。并且，每个人都应被鼓励在基于数据发现问题时勇敢发声。\n\
  \n一个正面例子：“自从三天前我改变了步骤 A 和步骤 B 的顺序，缺陷数量就下降了，这从白板上的数据就能看出来。我会坚持新顺序，并将发现分享给我的主管。”\n\
  \n即便存在信息安全与数据隐私的限制，仍有足够的数据可供全体员工使用，从而为整个组织带来有价值的额外洞察：汇总或匿名化的数据可以揭示趋势，而无需暴露个人身份信息。\n\
  \n### 数据管理定理 #7\n\n数据处理*并非*仅属于少数专家小组的课题。\n\n数据驱动型组织需要提升全体员工的技能，并且需要为他们提供访问所有相关数据的权限。\n\
  \n脚注 1 2 3\n\n"
- "# 3. 数据供应链\n\n![图 3-1：仅关注分析如同蒙眼投飞镖](img/499948_1_En_3_Fig1_HTML.jpg)\n\n*图 3-1：仅关注分析如同蒙眼投飞镖*\n\
  \n数据不会从天而降。它被采集或获取、管理、存储、转换、传输，并最终被使用。\n\n这些环节都不能孤立看待，因为它们彼此紧密依赖。这也就是为什么一个组织的数据办公室应对数据的整个生命周期负责。我将其称为“数据供应链”。\n\
  \n让我们来看看数据供应链的七个步骤。\n\n![图 3-2：数据供应链的七个步骤](img/499948_1_En_3_Fig2_HTML.jpg)\n\n\
  *图 3-2：数据供应链的七个步骤*\n\n\n\n## A. 管理数据源\n\n数据并非凭空存在。其中很大一部分是由你的组织有意识地创造的，一部分是获取的，有时则由第三方提供。即使数据是副产品，它也可能具有很高的价值。\n\
  \n典型的数据来源多种多样，包括：\n\n- 员工的数据录入（通过键盘、语音、扫描仪、摄像头或其他设备）\n- 收到的电子邮件和消息\n- 纸质文档的成像解读\n\
  - 物联网设备\n- 机器\n- 软件（例如，日志文件）\n- 组织间共享的数据\n- 社交媒体\n- 数据科学家在网络上“某处”发现的数据\n- 客户在你的网站上输入的数据\n\
  - 流数据（连续流）\n- 来自外部数据提供商的**主数据**和**事务数据**\n\n如果不全面管理甚至不协调这些多样化的数据源，将会导致问题，其中最严重的四个问题是：\n\
  \n1.  **重复数据采集**  \n    某些类型的数据会被不同职能部门所需。如果没有协调，它们可能会独立采集相同的数据。  \n    我记得有一个组织，其全球总部就与邓白氏公司签了三份独立的合同。这是浪费金钱。为多个用户统一管理数据采集显然更便宜。\
  \  \n    此外，一次性获取数据可以减少总体工作量。这就是为什么即使对于免费获取的数据，这样做也是有意义的。\n\n2.  **数据不一致**  \n \
  \   如果团队彼此独立地搜寻数据，他们最终通常会使用不同的数据源，或者获取相同但时效性不同的数据。  \n    所有这些都破坏了“单一事实来源”原则，尤其是对于那些不受你组织控制的数据而言！\n\
  \n3.  **数据歧义**  \n    在互联网上发现的数据含义可能模棱两可或不清楚。  \n    然而，这类数据是数据科学家常用的信息来源。他们经常下载带有列标题的数据文件，需要解释（避免用“猜测”这个词）其含义。即使他们的假设是正确的，一列的准确定义也可能不清楚。\n\
  \n4.  **偏差风险**  \n    如果每个团队或部门都负责获取所需的外部数据，中立性可能无法得到保证。人们可能会倾向于选择支持他们目标的数据。或者，他们可能会使用多个数据源，并最终选择能带来最有利结果的那个数据源。\n\
  \n你自己的组织情况如何？你的组织中有人了解所有数据源的概况吗？是否有关于外部数据获取的规则，并且这些规则是否得到执行？\n\n所有这些活动都是数据办公室的职责。\n\
  \n但是，如何建立这样一个组织呢？\n\n- 建立一个负责所有外部数据源的中央职能部门。\n- 使该部门成为人们搜索信息的首选之地。\n- 确保该部门协调所有活动并提供完全的透明度。\n\
  - 将执行权和所有权留给专家部门。通过数据治理确保在该部门不知情的情况下不会发生任何事情。\n- 委派该部门澄清所有外部数据的定义。\n- 让他们将所有输入的数据与企业数据模型进行匹配。^(¹⁷)\
  \ 该模型需要将外部数据和内部数据联系起来。一个典型的例子是将邓白氏数据与你的内部客户数据库对齐。\n\n## B. 在输入时验证数据\n\n验证数据的最佳时机是什么时候？是的，在输入时。保持清洁数据的清洁比一遍又一遍地重新验证数据要容易得多。\n\
  \n并非所有数据都需要具有最高质量——但你始终需要知道数据质量有多好。\n\n此外，数据不仅需要验证和清洗。它还需要：\n\n- 与内部数据同步（包括历史数据）\n\
  - 在必要时进行匿名化/混淆处理\n- 用元数据标记\n\n## C. 对数据进行分类\n\n数据有结构，任何想要使用数据的人都必须理解这种结构。\n\n大多数组织在引用数据方面都有现成的结构。但至关重要的是要查看所有数据源，以确保它们尽管来源不同，但能相互匹配。\n\
  \n一个文档完善的数据模型对于记录业务参与者希望如何运营其业务至关重要。同时，它也需要足够好，以便 IT 部门能将其转化为数据库模式（Schema）和解决方案。\n\
  \nIT 架构师不仅需要理解业务数据模型以优化物理实现的数据结构。他们还需要理解数据本身，从而能够提出合适的硬件、平台和解决方案、物理数据模型、容量规划以及数据库类型。\n\
  \n**示例**  \n如果产品特性列表简单明了，IT 架构师会选择关系型数据库。然而，复杂的产品组合可能会导致更复杂的结构：\n\n- 特性可能是可选的、强制的或有条件的。\n\
  - 其中一些可能具有可变数量的参数。\n- 每个参数可能带有不同的度量单位（`kg`/`lb`）。\n\n在这种情况下，`SQL` 数据库可能会变得非常复杂，由多个表组成。此外，其大多数字段都会是空的。这就是为什么\
  \ `NoSQL` 数据库可能是更好的选择。\n\n最终的决定还需要考虑*如何使用*数据。向 `SQL` 数据库中插入记录通常比向 `NoSQL` 数据库插入要快。你可以再次看到，需要大量的业务输入才能决定最佳的\
  \ IT 架构。\n\n即使是未结构化的数据也需要分类。没有哪个有意义的数据源会因其无结构而无法确定和记录其结构。你至少需要相应的元数据来理解数据并能够处理它。所需元数据的级别取决于底层数据的内容及其业务用途。所有这些都是需要从业务人员那里收集的非技术信息。\n\
  \n**总结**：将业务知识和逻辑转化为 IT 架构师所需的信息是数据办公室的一项关键任务。与职能业务代表不同，数据办公室必须始终采取跨职能的视角。\n\n##\
  \ D. 管理数据质量\n\n在接受《Information Age》采访时，Andy Joss^(¹⁸) 说道：\n\n> *人工智能和机器学习很流行。但是，如果你在训练一个\
  \ AI 模型，拥有真正好的数据会让你对获得正确结果更有信心。* (Baxter, 2019)\n\n这是对“垃圾进，垃圾出”这一更直白说法的非常礼貌的转述。\n\
  \n如果你使用的数据质量低劣（或者至少你不知道数据质量是否良好），你就无法相信任何结果。^(¹⁹)\n\n更糟糕的是，你通常无法从结果中判断底层数据是好是坏。这与食物不同，你的味觉或胃会立即对菜肴的质量给出反馈。\n\
  \n想象一下，你计算一个产品发布成功的几率，得到了“62.3%的成功概率”的结果。根据你数据的质量，这个结果可能非常准确，也可能完全是无稽之谈——即使计算方法完美无缺。\n\
  \n现在假设产品发布了。无论它成功还是失败，你事后都无法知道这个预测有多好，因为失败和成功都与预测结果相符。\n\n\n\n### E. 进行数据整理\n\n\
  大量数据可能会让你忽略真正的宝藏。这就像把好酒倒进一桶水里。因此，你应该安装一个永久过滤器，用来检查哪些数据应丢弃，哪些应保留。\n\n此外，需要主动管理数据留存规定。一方面，你通常有义务将某些数据记录保留最短的时间。另一方面，数据隐私法规（如\
  \ GDPR）不允许你无限期地保留所有数据。\n\n无论哪种情况，在此环节的失误都可能导致极其高昂的代价。\n\n### F. 管理数据\n\n仅在存储库中拥有完美的数据并不足以支持其使用。\n\
  \n你还需要确保每个人都使用正确的数据，并且数据能够被可持续地使用。\n\n#### 数据管理的目的\n\n让我们从数据用户的角度来看——你可以将其作为你的检查清单：\n\
  \n用户需要知道什么？\n\n-   我在哪里可以找到我需要的数据？\n-   我如何使用这些数据？\n-   这些数据的解释说明是什么？\n-   谁拥有这些数据（以便我需要进行更改时联系）？\n\
  -   之前是否有人已经开始使用这些数据？我可以重复使用什么？\n\n而用户需要依赖什么？\n\n-   提供给用户的数据是正确的、唯一的真实版本、始终是最新的、与其描述相符，并且具有足够高的可用性。\n\
  -   任何问题和变更都将提前充分沟通。\n-   数据安全和隐私已得到妥善处理。\n\n#### 良好数据管理的各个方面\n\n数据需要以*可持续*的方式使用。换句话说，仅仅在数据获取或首次使用时质量良好是不够的。未来，每当数据的内容或结构发生变化时，新数据都需要被自动使用，无需任何人工干预。\n\
  \n具体来说：\n\n1.  **集中化数据存储**\n\n    不要让人们在原始数据上工作——让他们使用网络服务来更新或使用数据。\n\n2.  **集中化数据逻辑**\n\
  \n    不要在客户端应用程序中实现通用数据逻辑——应集中实现。客户端应用程序应调用网络服务来应用该逻辑。\n\n3.  **让用户理解数据**\n\n  \
  \  要求数据用户与数据所有者沟通。后者是解释数据预期逻辑的最佳人选。\n\n4.  **提供数据访问权限**\n\n    向用户提供他们所需的所有数据的访问权限，同时提供有关数据结构、相互依赖关系、质量、生命周期终结以及任何其他相关属性的信息。\n\
  \n    这适用于所有类型的数据：主数据、元数据和事务数据。\n\n5.  **理解并记录数据转换**\n\n    在整个数据供应链中，数据会被合并、过滤、计算、派生或丰富。许多此类活动在数据管理成为公认学科之前就已经存在了几十年。\n\
  \n    因此，你的数据供应链也早已存在。在大多数情况下，这些不同类型的数据操作和转换背后的逻辑缺乏系统性的文档。\n\n    然而，为了充分管理你的数据供应链，你需要了解正在发生的事情。\n\
  \n    在大多数情况下，从业务方面开始评估，即询问业务所有者数据应如何进行逻辑转换，是*不*有效的。他们通常不具备能够解释的专业知识。\n\n    相反，你需要对前辈们已实现的逻辑进行逆向工程。这是一个漫长而繁琐的过程，包括处理多页\
  \ SQL 操作和 COBOL 源代码等挑战。\n\n    那么，有哪些好处能证明这种努力是值得的呢？\n\n    第一个（也是最重要的）好处是，你将获得关于*当前*对组织数据正在执行的操作的全貌。无论原始数据有多好，如果你不了解它后来是如何被处理的，任何由此产生的数据存储库都是无用的。\n\
  \n    其次，你可以请业务人员根据他们的业务概念来验证结果。对他们来说，验证你呈现给他们的东西，比自己从头开始指定要容易得多。\n\n    第三，你可能能够降低这些数据转换的复杂性。如果业务专家不理解数据转换逻辑，那么一个更简单的逻辑可能也同样有效。\n\
  \n    最后，如果业务人员理解了“他们的”数据正在经历什么，他们会更愿意承担所有权。\n\n    当你发现并记录所有数据操作时，你应该将其置于变更控制之下：未经稳健流程（文档必须是其中的重要组成部分）的批准，不得进行任何更改或添加。\n\
  \n6.  **记录数据使用情况**\n\n    向所有人提供访问权限并不意味着你不需要知道谁在使用数据：如果数据结构或内容发生变更，你需要立即知道谁会受到影响。\n\
  \n    是的，始终记录谁在使用什么会增加大量额外工作。最初，这听起来可能有些矫枉过正。但大多数组织都会发展到知识无法再装进人们脑海的程度。即使某些组织可以，也要考虑到人员离职或退休的情况。文档会一直留存。\n\
  \n#### 向用户提供信息\n\n文档和发布至关重要：数据格式、接口、技术访问描述、数据所有者以及数据变更流程需要对任何（潜在）用户透明。请考虑以下三个组成部分：\n\
  \n1.  **数据目录**\n\n    数据目录为用户提供有关他们所需数据的所有相关信息。\n\n2.  **网络服务目录**\n\n    这是面向应用程序开发人员和数据科学家的数据访问技术描述。没有它，人们可能会重新开发已有逻辑，或不断追踪源代码以寻找合适的网络服务。\n\
  \n3.  **内网网站**\n\n    数据专职团队以外的人员可能不知道去哪里寻找信息，因为他们无法对自身需求进行分类。他们甚至可能不知道数据目录和数据库之间的区别。但他们不应该必须知道这些！\n\
  \n    相反，你应该为他们提供一个单一的信息入口，在那里他们可以以易于理解的方式找到所有信息。\n\n    这样的内网站点随后会以用户友好的方式将用户引导至数据目录或网络服务目录。它还将提供对解释性文档（包括经典演示文件）、数据策略、流程等的访问。\n\
  \n    最后，用户应该找到一个反馈渠道，他们可以通过该渠道向数据办公室指出缺失或错误的信息，并提出改进数据管理的建议。这方面应成为你数据工作流程的一部分。\n\
  \n### G. 使用数据\n\n最后，我们来到了许多组织决定从这一步开始的环节。\n\n但即使是数据的使用，也远不止花哨的数据分析和彩色图表。\n\n组织中的数据使用与其自身一样是多方面的。\n\
  \n典型的使用方式包括：\n\n-   业务运营使用\n-   关键绩效指标（KPI）计算\n-   报表生成\n-   分析（人工智能、数据科学、机器学习）\n\
  -   机器人流程自动化（RPA）\n-   审计支持\n-   用于测试或验证目的\n\n所有这些都需要一致的数据。这就是为什么上述任何步骤都不应交由一个只涵盖所列领域之一或之二的实体来处理。\n\
  \n数据分析人员往往倾向于在使用数据之前先“修复”数据。不要支持这种想法；也不要从分析工作的角度反向推进。这可能会使你的数据对其他重要用途变得毫无价值。\n\n\
  \n\n"
- '# 总结：覆盖整个数据供应链


  我见过太多组织任命一位首席*分析*官，并期望获得卓越洞见。这类组织将其数据关注范围局限于 G 步骤的一个子集。他们甚至未能覆盖数据使用的所有方面，更不用说其之前的关键步骤了。


  让我们再看一下本章的开篇图示。显而易见，“分析”仅仅代表了数据办公室职责中的一小部分。


  ![../images/499948_1_En_3_Chapter/499948_1_En_3_Fig3_HTML.jpg](img/499948_1_En_3_Fig3_HTML.jpg)


  **图 3-3** 数据供应链包含的不仅仅是分析


  为什么高管们常常只关注分析和可视化？因为他们只考虑数据管理中那些*可见*的部分！


  这种做法类似于设计一座仅由高空观景台构成的建筑。你不需要成为建筑师也能明白，重力会阻止这种方案成功。


  相反，使用直升机确实能让你获得期望的视野——但只是暂时的，直到燃料耗尽。


  数据的使用遵循同样的逻辑。这就是为什么覆盖整个数据供应链总能带来回报。打好基础，然后逐层搭建建筑。当你最终抵达观景台时，就能确保它是稳定且可持续的。


  ## 数据管理定理 #8


  数据管理需要覆盖数据供应链的所有环节，从数据的创建或获取，一直到数据的使用。


