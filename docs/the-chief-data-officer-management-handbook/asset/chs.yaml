- "# 前言\n\n在伦敦郊区诺森伯兰公爵城堡阴影下举行的一场相当高端的首席数据官会议上，我沿着自助餐队伍移动。作为活动的主席，我尽职尽责地与每个人交谈，但此时此刻，我有点饿，还有点时差反应。当我反常地独自一人，舀起一块特别美味的鸡肉时，被餐盘对面传来的一声洪亮嗓音吓了一跳。\n\
  \n“我敢打赌你不喜欢最后那位发言人的话？”\n\n出于我的角色，我需要保持外交辞令，不对任何演讲者进行严厉批评。“您说什么？”我回答道。\n\n“我是说，我敢打赌你不喜欢最后那位发言人说的话：大多数首席数据官最终应该演变为首席数据与分析官！”\n\
  \n这个评论在会议期间触动了某根神经，而这位同样在舀鸡肉的仁兄对我的了解足以知道触动了哪根神经。\n\n“*不*！”我喊道，“我*确实*不喜欢！”\n\n“我确定你*确实*不喜欢，”他微笑道。\n\
  \n就这样，我与马丁·特雷德开始了即时的友谊。我们意识到——他比我先意识到——我们是多么志同道合，尤其是在数据的重要性方面。\n\n我是斯科特·泰勒，人称“数据低语者”。我帮助数据平静下来。这就是我们在数据管理领域所做的一切：让数据平静下来。数据是桀骜不驯的，数据是庞大的，数据是非结构化的，它需要被安抚。\n\
  \n和马丁一样，我坚信适当数据管理的战略重要性。我们对管理数据所需的条件有着共同的理解。我们从骨子里理解数据——尤其是基础数据——如何帮助企业成长、改善和保护其业务。我还相信，像分析这样重要的事情，得到了过多的关注和曝光。它们是酷炫、花哨、性感的东西。因此，我成为了默默无闻、相对枯燥但至关重要的东西的倡导者。没有适当的数据基础，就没有分析洞见。\n\
  \n我们都一直在执行这一使命，向组织布道：他们需要关注自己的数据——不仅仅是彩色图表和报告，而是要把基础工作做好。在我看来，数据和数据管理是关于确定真相。分析和商业智能是关于推导意义。我想大多数数据专家已经知道这一点。他们支持它。他们理解它。他们相信它。事实上，我从未遇到过任何一位数据专家认为数据在被恰当用于分析时不会产生更多价值。马丁和我也理解这一点。思考数据和分析时，它们是协同工作的。它们确实需要彼此。这两件事是相关联的，但分开思考会有所帮助。正如马丁所说，“在每个企业中，都需要一个坚实的数据基础，来支撑人们打算用数据做的所有花哨事情。”\n\
  \n当今的宏观趋势就是关于这些“花哨事情”：关于云、数据科学、边缘分析以及其他酷炫事物。这些仍然需要一个坚实的数据基础。无论我们过去在哪里，无论我们现在身处何处，无论我们要走向何方，无论未来是什么，你始终都需要“一个坚实的数据基础来支撑所有花哨的事情。”\n\
  \n我为那些“不花哨”的事情，以及有时默默无闻的*数据*专业人士（如数据管理、数据治理、主数据管理、参考数据管理、主数据、元数据等领域的人）呐喊，他们每天都深知自己的工作具有基础性、是基石，并且能够使企业通过富有洞见的分析而蓬勃发展。\n\
  \n如果你想要一个健康的组织，贯穿你组织的生命线就是你的数据，你必须为此努力。这就像减肥和健身一样。你必须改变饮食。你必须锻炼。你必须理解并掌握基础。你必须付出艰苦的努力。没有捷径可走。\n\
  \n我希望你现在能看出我擅长“谈论数据”。我专注于“战略性的原因”，而不是“实践性的方法”。我假设，既然你在读这本书，你需要的不仅仅是在与 CEO 会面时在电梯里分享的一个好故事。你需要一位经验丰富的数据专业人士的实用建议——一位投入了时间、犯过错误、克服了挑战、庆祝过成功，并且理解首席数据官当前及未来角色的人。这就是为什么*首席数据官管理手册*会成为你宝贵的首选资源。马丁深入挖掘了他广博的专业知识以及其他专业人士分享的经验，帮助你理解几十年来高管层最重要的新增角色——首席数据官——的设计、执行乃至心理学。（注意，这里没有加“分析”二字。）\n\
  \n马丁提供的是你可以付诸行动的建议，而非学术理论。这是一本*手册*，而非教科书。它简单，但并不肤浅。它将帮助你发展技术知识之外所需的技能。希望这本手册能成为你作为现任（甚至是未来）首席数据官日常业务生活中的有益指南。\n\
  \n我曾见过马丁向一屋子的数据领导者演讲。他能用他无尽的热情煽动起人群。他能用他对数据价值和力量的坚定决心激励他们。有时他似乎准备要冲出讲台，卷起袖子，亲自深入你的数据之中。我希望有朝一日你能亲身体验到那种能量；在那之前，你手中握有一个极好的替代品。阅读这本书，你会得到足够多的收获。也许，有一天，你会有幸亲眼目睹他激励他人，甚至只是在自助餐队伍旁与他简单聊聊天。祝阅读愉快！\n\
  \n> 斯科特·泰勒\n> \n> *数据低语者*\n> \n> *MetaMeta Consulting*\n\n"
- '# 序言


  你翻开这本书，一定是有原因的。




  你可能已经被所在组织要求整顿其数据处理流程。你的 CEO 发现某些数据不可用，或者预测虽然精确但却是错误的，可能会因此勃然大怒。


  或者，在观察组织如何处理数据时，你可能曾想过，一定有更好的方法。


  无论如何，你触及了我们这个时代最被低估的商业主题之一：


  **对于人们打算用数据做的所有花哨事情，需要有一个坚实的数据基础。**


  你是否曾想过，为什么如此多的组织将数据称为“二十一世纪的石油”，但同时却很难真正成为数据驱动型组织？


  这个问题没有简单的答案。不同的问题在不同程度上导致了这一困境。


  但如果你想帮助你的组织以商业上成功的方式（无论是短期还是长期）使用数据，理解这些因素至关重要。


  我邀请你深入阅读本书，了解这个学科的先驱者们发现了什么。


  但更重要的是，请结合你所在组织的实际情况，反思你所读到的内容。


  考虑到你有限的空闲时间，几百页关于数据管理的内容是否太多了？别担心，这不是一本小说！你可以从任何地方开始，挑选你最感兴趣的主题，并决定你自己的阅读顺序。你会找到一些交叉引用，但没有一个章节要求你阅读本书的前面部分。


  祝你阅读愉快！


  ## 引言


  首席数据官（`CDO`）的角色正在崛起。


  早在 2018 年，Randy Bean^(¹)就在 Forbes.com 上写道：


  > *在 2012 年首次进行调查时，只有 12%的高管报告其公司已任命了首席数据官，但在过去几年中，这一新的高管职位的采用率出现了显著且稳定的增长。在最近发布的
  2018 年调查中，近三分之二的高管（63.4%）报告其公司已设有`CDO`。显然，首席数据官已成为大多数领先企业中的一个既定职位。*


  而在 2020 年 3 月，Gary Richardson^(²)报告了进一步的增长：


  > *首席数据官（`CDO`）的角色正在行业内演变并获得发展势头——目前 70%的公司已任命了`CDO`，高于 2012 年的 12%。该角色的成功对于业务增长至关重要，并且很明显，`CDO`必须将其角色从防御性数据策略中发展出来，拥抱其作为变革推动者的角色。*
  ^(³)


  然而，与此同时，具有数据思维的人似乎仍然难以在组织中有效地发展数据驱动思维模式。


  我已养成习惯，倾听来自各类组织的数据专家的担忧。^(⁴)这些最初充满热情的变革推动者中，越来越多的人报告说他们的挫败感在上升。大多数人得出的结论是，从下到上在组织中引入以数据为中心的思维几乎是不可能的。


  但即使在顶层，在你预期会拥有足够权威来推动变革的地方，情况似乎也充满挑战。就在 2020 年 2 月，Michael Wade 教授^(⁵)指出，`CDO`的平均任期是
  31 个月，比其他 C 级高管职位要短。^(⁶)


  ### 为什么会这样？


  在大多数情况下，问题不在于他们的概念或知识。你可以假设这些`CDO`中的大多数都是经验丰富的数据专家。


  理解数据的价值及其背后的科学确实很有帮助。但这还不够。挑战在于让人们参与进来——无论是高管还是基层人员。


  一个没有正式权力的`CDO`就像一只没有牙齿的老虎。但仅靠权力并不能让`CDO`成功。


  `CDO`需要发展的技能通常可以分为以下三类：


  1.  数据专业知识

  2.  组织技能与业务导向

  3.  外交与沟通技巧


  几乎没有`CDO`在第一个方面薄弱。`CDO`通常能跟上技术发展的步伐，并且了解他们正在谈论的内容。


  虽然一本数据管理书籍若不涵盖这类别的部分内容将是不完整的，但本书的主要重点在于另外两点。


  对于`CDO`的成功，我建议采取一个三步法：


  1.  理解你的组织。

  2.  发展你的目标架构。

  3.  制定并遵循你的实施计划。


  本书旨在支持你完成这一旅程。它分为三个主要部分：


  *   第一部分（第 1 章至第 11 章）是关于**设计有效的数据办公室**。它涵盖了数据管理组织的结构，以应对当今的差距与机遇。

  *   第二部分（第 12 章至第 15 章），**数据管理心理学**，探讨了将公司转变为数据驱动型组织时的典型挑战。

  *   第三部分（第 16 章至第 23 章）的标题是**数据管理的实践方面**。它涉及数据办公室的典型主题。


  在本书中，我使用缩写`CDO`作为首席数据官的简称。你的职位名称可能不同，因为目前还没有一个事实上的标准。但即使你是*业务信息经理*、*首席数据与分析官*或*数据管理负责人*，也请继续阅读。头衔应该不是我们最关心的问题。


  ## 致谢


  一本普遍适用的书籍无法仅凭个人的经验写成。我要感谢全球数据社区，通过无数次的对话分享了他们的挑战、方法、成功和失败。名单之长足以写满一本书。


  然而，我应该提及那些通过会议、活动和交易会促进数据专业人士之间必要交流的组织。


  我很荣幸受邀在以下组织举办的活动中演讲：**Data Leaders**（英国）、**IQPC**（美国）、**ThinkLinkers**（捷克共和国）、**Corinium
  Global Intelligence**（英国）、**Vonlanthen Group**（捷克共和国）、**GIA Global Group**（捷克共和国）、**Encore
  Media Group**（英国）、**Platinum Global Solutions**（英国）、**Marcus Evans**（捷克共和国）、**Cintona**（瑞士）、**Khaleej
  Times**（阿联酋）、**Information Services Group**（美国）、**Corporate Partners**（捷克共和国）、**Hyperight
  AB**（瑞典）、**Engaged Communications**（德国）、**DataCampus**（德国）、**The Economics Times**（印度）和**IMH**（塞浦路斯）。


  为你们的活动做贡献，并向其他演讲者和参与者学习，总是一次丰富的经历！


  ---


  关于作者

