- "# 数据规则与标准\n\n## 规则与标准的目的\n\n为什么我要在“语言”这一部分讨论数据规则与标准？\n\n虽然“创造表达”和“定义表达”之间的界限是模糊的，但这一切都始于共同语言。\n\
  \n在大多数情况下，你会隐含地建立一条规则，以弥合组织数据语言中的歧义缺口。\n\n如果你详细描述了数据实体及与数据相关的表达，并且将数据实体之间的关系扩展到算法和依赖关系，那么你正处于定义数据规则与标准的过程中。\n\
  \n在数据领域，规则与标准之间并没有学术上严格的划分。我将“规则”用于偏向技术性的指令（包括元数据），而将“标准”用于规范，通常以描述性文本的形式呈现。在您的日常实践中，可以不必拘泥于这种区分。\n\
  \n在任何规则和标准未被遵守的情况下，你需要区分可接受的偏差、暂时可接受的偏差和违规。详细说明这一点也是管理数据规则与标准的一部分。\n\n### 示例 7\n\
  \n一个经典的数据规则会规定，任何地址数据库中的邮政编码格式必须遵循万国邮政联盟公布的格式。^(²⁷) 它会指定细节级别（例如，“每个国家可以有多个邮政编码格式”），以及底层元数据如何编码（例如，作为正则表达式^(²⁸)）。\n\
  \n相应的数据标准会规定，根据 UPU 发布的变更，元数据需要多久更新一次。\n\n理想情况下，数据标准甚至会引用软件开发人员应该用于验证邮政编码的库和对象。它可能会说明使用该库是强制性的，并且不允许直接使用元数据。\n\
  \n如果你有一条数据原则要求使用 API 和 Web 服务而不是直接使用原始数据来开发软件解决方案，那么你可以直接从该原则推导出这个数据标准。\n\n## 数据标准\n\
  \n标准描述了事物应该如何（或不应该如何），作为组织数据处理所达成的目标的一部分。\n\n它的编写方式必须能够让你客观地判定合规性。换句话说，不能存在对数据标准是否被遵守产生分歧的情况。\n\
  \n顺便说一句，第一个标准应该描述标准本身的性质。前面这两段已经勾勒出了这样一个典型的数据标准。\n\n\n\n### 数据规则\n\n`数据规则`将数据描述到最细节的层面，直至元数据结构。\n\
  \n同时，`数据规则`绝不局限于单个实体或属性。例如，它可以规定一个实体中三个属性只能有两个属性具有非零值。\n\n但这些`数据规则`从何而来？\n\n在很大程度上，数据规则基于业务规则。它们是对组织业务应如何运作的转化，以便能够在软件中直接实现。\n\
  \n反之，软件开发者对如何实现的不确定性，是数据规则缺失或不完整的有力指标。`数据办公室`应系统性地利用此类情况作为机会，与业务负责人澄清数据规则（迫使后者思考其背后的业务规则）。\n\
  \n简言之，您可以将`数据规则`视为`企业数据模型`的主要输入。在将`数据规则`转化为`数据模型`的过程中，实现组织业务视图与技术视图匹配的很大一部分工作就此完成。\n\
  \n### 数据规则与标准的制定\n\n如果您的数据规则和标准包含创建所有必要数据流程和 IT 解决方案所需的所有信息，那么它们就是*完整*的。\n\n但请不要将此视为建议您在准备定义流程之前就完成所有数据规则和标准。相反，这应是一个迭代过程：\n\
  \n- 流程的开展会发现数据标准中的缺口。\n- 填补这些缺口将有助于完善流程。\n\n您可以（并且应该）在不同的主题领域并行工作，并处于不同的成熟度水平。\n\
  \n并且，请在`数据规则`和`标准`完善之前就开始使用它们。在许多情况下，只有通过实际应用这些`数据规则`和`标准`，才能发现其中的缺口或不准确之处。\n\n\
  ### 数据规则与标准的文档化\n\n`数据办公室`开发的任何内容当然都需要文档化。但您应该在哪里以及如何文档化`数据规则`和`标准`呢？\n\n与政策不同，`数据规则`和`标准`不能轻易合并到现有的、同类型但与数据无关的存储库中。理想情况下，不应存在其他此类存储库，因为`数据规则`和`标准`应覆盖整个业务。\n\
  \n这种情况为您提供了在`数据办公室`内部开发所需存储库的自由。\n\n`数据规则`和`标准`与术语表密切相关，并且在流程的上下文中是必需的。应通过同一用户界面（例如，同一个`数据办公室`内网站点）提供访问权限。\n\
  \n其他一切则取决于您用于文档化和发布数据相关信息的软件解决方案。集成良好的解决方案允许您将术语表与`数据规则`和`标准`一同维护。\n\n重要的是，不仅要文档化标准和规则本身，还要文档化它们的来源和实施状态。\n\
  \n最后，我个人建议任何定义都不能缺少示例。\n\n## 数据模型\n\n### 数据模型的价值\n\n供应商通常告诉我们，严格的数据模型被高估了，并且`大数据`甚至关注非结构化数据。但果真如此吗？\n\
  \n如果我们说数据是一种语言，那么数据模型可以视为其语法。\n\n有幸学过拉丁语的人可能还记得这样的场景：即使知道句子中的每个单词，也不足以理解句子的含义。我敢打赌，正是在那时你明白了语法的重要性！\n\
  \n数据也是如此。如果你不知道数据之间如何相互关联，以及它们的结构和含义是什么，零散的数据就无法转化为信息。\n\n由于没有结构和逻辑的数据毫无价值，因此您需要为组织的数据建立一套强大、定义明确的“语法”。\n\
  \n### 单一数据模型的价值\n\n并行使用多个数据模型的负面影响并非只是学术理论。今天大多数组织都能观察到这一点。历史常常导致不同团队使用不同的显式或隐式数据模型。\n\
  \n毫不奇怪，大多数不一致之处都可以在不同功能的交界处观察到。大多数功能都了解数据模型中属于自己的部分，但会按照自己的假设来定义其他部分。\n\n所有数据消费者都因缺乏单一数据模型而遭受不一致之苦：\n\
  \n-   在`分析`领域，使用不同的数据模型会导致结果不一致，即使不同团队使用相同的数据集。\n-   如果使用基于不同数据模型的来源中的参数来指导日常运营，则无法实现最优运营。\n\
  -   标准报告显示不一致的信息，并且`KPI`不可靠。\n-   如果无法基于标准数据模型进行业务模式变更，则会变得复杂。\n-   随着数据日益迁移到云端并由第三方`SaaS`提供商管理，数据将不得不符合外部数据模型。\n\
  -   如果您朝着单一事实来源迈进，某些实现可能会因为基于不同的数据模型而崩溃。典型情况是主键冲突或重复项。可能几个月后第一个“重复项”才会导致数据库表崩溃，但它肯定会在某个周末发生……\n\
  \n这就是为什么每个组织都应同意致力于建立一个单一数据模型。它通常被称为**企业数据模型**，缩写为**CDM**。\n\n\n\n### 客户数据示例\n\n\
  外部提供商提供代管客户群的服务。这很简单，对吧？“客户就是客户，客户始终是客户”，而且根据行业不同，客户会拥有一组特定的属性。没有疑问吗？\n\n让我们从两个不同的角度来验证这个假设：\n\
  \n1.  **客户层级**\n    -   您是否希望将一个特定组织与其母公司视为同一个客户？\n    -   如果一家公司持有另一家公司的部分股份：这算作同一家公司吗？如果仅持有很小比例，可能不算？是否存在一个自然阈值？\n\
  \    -   如果两个不同的组织属于同一个企业集团，它们是否应该被关联？\n    -   您的数据模型能否处理客户层级的变化（例如，您的客户之间发生的并购）？\n\
  \n为了理清思路，我们需要做两件事：\n\n首先，我们需要理解客户分类背后的目的（或多个目的）：我们想用这些客户记录做什么？\n\n例如：如果我们希望避免对同一组织给出不一致的定价（“我在\
  \ X 子公司的同事告诉我，他们比我们在 Y 子公司的折扣更大！”），我们可能不得不考虑组织之间的法律和商业关联。\n\n其次，您必须根据业务需求确定所有需要进行分类和归类的客户属性。“是采购协会\
  \ X 的成员”可能是一个在您（或您的云提供商）的“客户”数据模型中缺失的重要属性。\n\n2.  **客户状态**\n\n大多数销售解决方案会区分潜在客户、意向客户、活跃客户、不活跃客户和流失客户。\n\
  -   如果是这样，那么任何一个流失客户不都曾经是潜在客户吗？\n-   一个流失客户能够重新成为意向客户吗？\n-   在与您进行最后一次业务交易后，需要经过多久，您才会将一个流失客户重新视为意向客户？\n\
  -   如果不同客户的关联紧密（见上文第 (i) 点），他们是否可以拥有不同的状态？\n\n现在，想象一下您在不同部门之间共享客户数据。如果你们没有就一个统一的\
  \ `CDM` 达成一致，一个部门可能会过滤掉所有流失客户，因为它专注于销售活动。而其他部门则需要这些数据，因为它们处理海关事务，在这些事务中，即使客户与我们完成最后一笔交易后，客户数据也需要长期保存。\n\
  \n一个过滤不正确的数据流会导致可见的错误吗？不会，所有流程都会无缝运行。这够了吗？不够，这极其危险，因为它隐藏了数据问题：客户记录可能缺失，但系统无法识别这个缺口。\n\
  \n### 分析与数据建模\n\n当您的数据建模师塑造组织的 `CDM` 时，他们需要考虑所有基础元素及其所有属性和关系。\n\n另一方面，分析工作则需要自由地创建新的数据实体、属性和关系，以揭示有价值的洞察。\n\
  \n但界线应该划在哪里？\n\n作为指导原则，任何源自组织业务模型的数据逻辑都应该是中央管控的 `CDM` 的一部分。\n\n此外，分析人员绝不应在他们的可视化工具中重做该\
  \ `CDM`——尽管越来越多的工具提供了这种能力。否则，组织将面临同一份数据在不同的数据模型中独立维护（和建模）的风险。\n\n出于同样的原因，外部数据绝不应直接导入数据可视化工具（除非确实只为单个任务所需）。相反，外部数据需要成为组织“单一事实来源”的一部分，以便所有用户都直接从该来源获取数据，并使用一致的格式和结构。\n\
  \n要在此方面取得成功，您应该让数据分析师能够方便地将数据建模工作留给中央团队——否则，他们可能会为了掌控数据或更快获得结果，而倾向于在自己的工具中建模数据。\n\
  \n首先，您需要明确地定义 `CDM` 涵盖的内容：当过滤条件针对某项具体的分析任务时，您可以保持其灵活性（例如，通过属性组合过滤交易数据以确定相关性）。\n\n\
  每当您的分析人员表示他们需要修改 `CDM` 才能继续时，通常更正确的选择是去处理数据源本身。例如，任何“未知”或“不适用”的值可能都需要从某个从业务角度看应该是纯数值的列中移除。其结果将成为逻辑上的**单一事实来源**的一部分。\n\
  \n为什么您要这样做？首先，不同团队独立进行相同的过滤操作意味着额外的工作量；其次，各团队过滤结果可能略有差异，导致结果无法比较。\n\n从流程上看，任何对核心数据模型扩展的请求都属于“数据逻辑变更”流程组（见第\
  \ 8 章）。此类请求很好地说明了为什么这个流程需要非常敏捷——数据分析师没有时间等待冗长的审批流程。\n\n同时，数据模型的扩展通常不会带来任何向后兼容性问题，因此预计对现有解决方案和数据库的影响是有限的。\n\
  \n\n\n"
- '# 结论


  每个组织都应该拥有一个统一的企业数据模型（CDM）。它需要与术语表以及业务流程紧密关联，并且对组织内的所有人都应具有约束力。


  虽然我们需要处理半结构化和非结构化数据的灵活性，或尝试未来的可能性，但我们现有的业务模型必须由一个定义清晰的 CDM 来描述。


  这样的 CDM 不仅能在不同体系需要对接时避免冲突，还有助于防止数据丢失和误解——这些问题往往不易被察觉。


  “单一事实来源”的理念也同样适用于实体间的格式与关系。


  为了实现这一目标，你可以尝试应用本书中所描述的“数据管理基础 101”。由于其中任何一个步骤都不容易执行，拥有一个框架会大有裨益：


  1. **与**所有相关利益方**讨论**挑战。解释问题所在，争取他们对后续步骤的支持。

  2. **设立**一个**项目**，至少涵盖前两个阶段：制定目标与确定差距。为该项目争取资金和人员（你需要在业务部门和 IT 部门获得资源以支持此阶段）。

  3. **开发**理想的 CDM，即能够准确描述当前业务状况，并具备足够灵活性以覆盖未来变化的**数据模型**。这是一项需要与业务部门紧密合作进行的活动。

  4. **获得**跨职能部门的**批准**，以确认该理想 CDM。

  5. **盘点**现有的数据模型——包括隐式模型和显式模型。有时你需要对现有应用程序进行逆向工程。

  6. **记录**所有**偏差**。

  7. **评估**当前及未来偏离理想 CDM 所产生的负面**影响**。请利益相关方量化这种影响。数据办公室团队只需提供支持。

  8. 基于影响和优先级，**制定**一份**路线图**。这可能是一份多年的路线图，但它应涵盖通向全面实施 CDM 的整个过程。

  9. **获得**你的**路线图批准**，将步骤 7 的成果作为你的商业案例。在采取后续任何步骤时，你都应能引用该批准。

  10. **将实施工作**作为统一计划下的各个独立项目来**运行**。虽然数据办公室无需亲自运行每个实施项目（它们甚至可能是其他项目的子项目），但你需要掌控整个计划。


  最大的挑战是说服业务人员，让他们相信组织需要朝着单一 CDM 努力。至关重要的是，要帮助他们看到投资的回报，即“数据回报率”。


  考虑到你组织内（特别是你的数据办公室团队）的带宽，你可能会觉得这个计划过于庞大。不过，请随意从小处着手！


  对于你的团队来说，从一个子集开始（“客户”通常是一个不错的选择）总比完全不开始要好。而且，第一个子集的任何可见成功都可能增加业务部门对你总体目标的认可。


