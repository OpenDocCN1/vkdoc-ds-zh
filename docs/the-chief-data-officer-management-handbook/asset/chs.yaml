- '# 第一部分：设计有效的数据办公室


  ## 设计有效的数据办公室


  > *尚未建立数据战略和强大数据管理功能的公司需要迅速赶上，或者开始规划退出。*

  >

  > ——Thomas H. Davenport，“你的数据战略是什么？” (Davenport, 2017)




