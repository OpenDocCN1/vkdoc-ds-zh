- '# 通过细化实现类层次结构的接口


  到目前为止，在给出的示例中，我们有一个抽象类定义了一个接口，然后由不同的具体类来实现它。在`stack`的例子中，不同的实现为我们提供了不同的时间复杂度权衡，但这些不同实现在概念上都只是栈。在图形对象的例子中，各种具体类在概念上是不同的对象，但它们都可以被视为图形对象，从而通过通用接口进行操作。这些是软件设计中常见的模式，但当子类（例如不同类型的图形对象）代表不同的概念类时，它们通常也可以扩展接口。


  以统计模型为例。这些通常被实现为类，这些类实现一些泛型函数，例如`predict`或`coef`，这为我们提供了统一的模型接口，使得在分析中能够切换不同的模型而无需对分析代码进行重大重写。所有模型实现的泛型函数为我们提供了最抽象类型的模型接口。例如，所有模型都必须实现`predict`和`coef`，我们才能在分析代码中将它们作为即插即用的替代品，但不同类型的模型可能会向此接口添加并非所有模型都适用的附加功能。例如，我们可以想象决策树会添加用于剪枝的功能，例如一个`prune`函数。如果所有决策树实现都有一个`prune`函数，我们可以更换决策树的实现并且仍然重用我们的代码，但由于`prune`并非为所有模型实现，我们只能用一个决策树实现替换另一个决策树，而不是任意类型的模型。我们会说决策树是模型的**特化**。所有决策树都是模型，但并非所有模型都是决策树。在类的术语中，我们会有一个模型的超类和一个决策树的子类，该子类向模型的接口添加了如`prune`这样的函数。如果我们有决策树的不同实现，决策树类通常也是抽象的，不同的实现会继承自这个类，而不是更通用的模型类（见图
  2-4）。


  ![A451015_1_En_2_Fig4_HTML.gif](img/A451015_1_En_2_Fig4_HTML.gif)


  **图 2-4.** 模型层次结构，其中决策树是`Model`类的特化，它添加了`prune`函数，并为我们提供了一个额外的抽象类，决策树的实例必须实现此类。


  另一个例子，我们可以考虑参考书目，它本质上是一个出版物列表。有不同类型的出版物，但所有出版物至少有一个名称和一个或多个作者，因此表示出版物的最抽象方式将只具有这两个属性。我们可能希望对出版物列表做的一件事是计算文献计量学指标，例如一篇出版物有多少次引用。如果每篇出版物都有一个它所引用的其他著作的列表，那么我们可以从所有相关出版物的数据库中计算出这个数字。如果我们有给定作者创建的所有出版物的列表，我们也可以计算这位特定作者收到了多少引用，或者推导出如
  h 指数这样的统计数据。


  有不同类型的出版物，因此我们可以为书籍和文章等创建子类。一本书将有一个相关的出版商和一个 ISBN，而期刊文章将有一个相关的期刊和（通常）可以在期刊中找到该文章的页码。如果我们为了简化，只允许这两种类型的出版物，我们可以将其表示为图
  2-5 所示的类层次结构。


  ![A451015_1_En_2_Fig5_HTML.gif](img/A451015_1_En_2_Fig5_HTML.gif)


  **图 2-5.** 参考书目对象的层次结构。通用的`Publication`类为每篇出版物提供名称、作者列表和引用的其他出版物列表。两种具体类型的出版物，`Article`和`Book`，添加了额外的属性。


  在这个层次结构中，所有函数都只是访问对象的属性；也就是说，它们只是提取存储在这些对象中的数据。通常，通过函数访问属性，而不是访问作为对象表示形式一部分的列表或向量，是一个好主意。这允许您更改数据的表示方式，而无需修改除了访问器函数之外的任何代码。如果您的代码仅通过函数访问您的对象，那么您就封装了实现细节，后续更新代码将比原来简单得多。


  还要注意，在这两种具体类型的出版物之间，没有一个访问器函数需要不同。抽象的`Publication`类访问`name`和`authors`，其他类中提供的附加属性是互不相交的。因此，不需要为这个类层次结构实现泛型函数。我们可以只使用普通的旧函数来完成。


  ```

  # publication interface

  publication <- function(name, authors, citations) {

  structure(list(name = name, authors = authors,

  citations = citations),

  class = "publication")

  }

  name <- function(pub) pub$name

  authors <- function(pub) pub$authors

  # articles

  article <- function(name, authors, citations, journal, pages) {

  structure(list(name = name, authors = authors,

  citations = citations,

  journal = journal, pages = pages),

  class = c("article", "publication"))

  }

  journal <- function(pub) pub$journal

  pages <- function(pub) pub$pages

  # book

  book <- function(name, authors, citations, publisher, ISBN) {

  structure(list(name = name, authors = authors,

  citations = citations,

  publisher = publisher, ISBN = ISBN),

  class = c("book", "publication"))

  }

  publisher <- function(pub) pub$publisher

  ISBN <- function(pub) pub$ISBN

  ```


  对于在不同类中为相同的概念操作获得不同行为，泛型函数是完美的，但是当我们能够使用普通的旧函数获得期望的操作时，就没有理由调用泛型函数。


  出版物的实现很简单，除了构造函数中设置的`class`属性。在这里，我们将类设置为类名的列表，而不仅仅是类名。这就是我们指定`"book"`对象或`"article"`对象也是一个`"publication"`对象的方式。我们设想的这种设计要求书籍和文章都是出版物，但由于
  S3 类只是表示为字符串的名称，我们无法在 R 中明确这一点。相反，我们通过让`class`属性成为类名的列表来表示类层次结构，从最特殊的对象到最抽象的对象沿层次结构向上。R
  如何解释这样的类名列表，以及它如何使用它来查找泛型函数的正确实现，是下一章的主题。


  拥有类似于我们这里为出版物创建的类层次结构并不少见，但它存在一些轻微的问题。要访问书籍特有的属性，您需要知道您正在处理的对象是一本书；处理聚合的出版物而无需编写专门处理书籍或文章的代码，正是使用面向对象并创建出版物层次结构的目的所在。拥有子类向其超类接口添加函数的类层次结构并没有错，但如果您发现自己在编写这样的层次结构，您应该仔细思考如何访问和操作来自该层次结构的对象。




  '
- '# 函数放置与通用函数设计


  通常，最好将函数放置在层级中尽可能高的合理位置，以确保层级中的尽可能多的类都能支持这些函数。对于通用函数，不同的子类可以用非常不同的方式实现这些方法，但你操作的所有对象至少会实现你所调用的方法。以我们这里设计的出版物类层次结构为例，如果我们想编写可重用的代码，唯一真正能做的操作就是访问名称和作者信息，以及构建引用图谱。只有当我们显式检查当前正在访问的是书籍还是文章时，才能以类型安全的方式访问书籍和文章所特有的属性。


  我们可能需要编写代码来格式化出版物，以生成出版物列表等。这需要用到存储在书籍和文章中的信息，但由于直接访问这些信息首先需要测试对象的类别，代码会变得有些繁琐且可能容易出错。更糟糕的是，如果我们在层次结构中添加另一种出版物类型（例如，会议投稿），我们就需要更新所有执行此类检查并针对不同类进行不同处理的代码，以同时处理这种新类型。这正是为了避免这种情况，我们需要通用函数。因此，正确的设计是：拥有一个用于格式化引用的通用函数，并针对不同的子类进行特化实现。


  ```

  format <- function(publ) UseMethod("format")

  format.article <- function(publ) {

  paste(name(publ), authors(publ),

  journal(publ), pages(publ), sep = ", ")

  }

  format.book <- function(publ) {

  paste(name(publ), authors(publ),

  publisher(publ), ISBN(publ), sep = ", ")

  }

  ```


  然后，我们可以在另一个通用函数 `print` 中使用这个 `format` 函数来显示出版物：


  ```

  print.publication <- function(x, ...) print(format(x))

  ```


  当我们通过子类化来扩展接口时，我们添加了一些只有部分对象支持的函数。有时这是必要的，因为某些操作确实只对特定对象有意义——例如，修剪决策树是有意义的，但修剪像线性模型这样的对象则没有意义——但作为一般规则，我建议将这种特化保持在最低限度。拥有一个由或多或少特化的类组成的大型层次结构可能感觉像是一个好的设计，但当你必须处理来自该层次结构的对象时，你希望它们尽可能相似。你希望能够使用相同的（通用）函数处理所有这些对象。因此，一般来说，你希望在任何情况下都坚持使用最抽象的接口。你不妨在设计代码时就考虑到这一点。


  能够统一处理对象也是为什么我们将图形对象集合本身也设计成一个图形对象的原因。如果我们没有这样做，那么我们就需要显式处理对象集合并编写递归函数来遍历它们。通过使集合成为图形对象的一个类，我们可以将这种复杂性隐藏在通用函数中。这是一种非常常见的技巧，被称为**组合设计模式**。


  '
- "# 实现重用\n\n最容易编写的代码是已经写好的代码。如果你能重用现有代码，这总是比编写新代码更好。你不需要花时间编写代码，而且如果现有代码已经存在了一段时间，那么它很可能经过了充分的测试，因此比你引入的新代码更可能正确。因此，作为程序员，你的目标应该是编写尽可能少的新代码，尽管这听起来有些矛盾。\n\
  \n然而，重用代码的正确方法，不是简单地将现有代码块从一个程序复制并粘贴到另一个地方。这样做你确实重用了代码，但最终你会得到两份相同的代码。如果在未来的某个时间点，你发现必须修改这段代码（也许是因为尽管经过了测试，其中仍然隐藏了一个错误），你将不得不记住在两个地方都进行修改。当你有这样的重复代码时，很难记住，如果这两个副本开始变得不一致，维护起来将是一场噩梦。\n\
  \n重用代码的方法是编写可以在许多不同上下文中使用的函数。编写那些能处理单一问题、并处理好它的函数，同时尽量减少对它们将被调用的上下文的假设。使用小的、可重用的构建块来构建程序，这样会使你的代码更易于维护和扩展。\n\
  \n然而，在面向对象编程中，我们经常为代码重用添加另一个维度。当一个类定义了通用函数时，该类及其所有子类的所有实现都必须实现这些通用函数。如果每个类都以独特的方式实现所有通用函数，那么重用的机会就很小，但所有东西都独特的情况很少见。通常，对于给定问题，存在很好的默认解决方案，适用于大多数类，只有少数类需要实现特殊的函数。在面向对象编程中，你希望在类层次结构中最高的可能级别上实现函数，并让子类在可能的情况下通过调用通用函数，而不是提供它们自己特化的函数，来重用这些实现。层次结构中的任何类都可能需要特化一个通用函数的子集，而任何子类都应该使用其上层结构中最特化的那个版本。但一般来说，一个子类只应在自己的通用函数版本与超类中定义的版本不同时才定义自己的版本，其余的函数它应该直接重用。我们说它从其超类**继承**了这些函数，而通用函数的查找机制在很大程度上自动完成了这一点。\n\
  \n在日常的 R 编程中，深度类层次结构很少使用。与其编造一个不切实际的人为示例，或者展示那些与类层次结构介绍关系不大的示例代码，我将使用抽象的例子来说明。如果你对\
  \ R 中面向对象编程的实际应用更感兴趣，我在第 4 章给出了一个现实的例子，尽管那个例子只有一层深度。\n\n\n\n## 类层次结构中的方法查找\n\n正如我们之前看到的，对于一个泛型函数`f`，调用`f(x)`会使\
  \ R 寻找一个名称派生自`class(x)`的函数。如果`class(x)`是单个字符串，例如`\"A\"`，它将寻找`f.A`。如果 R 找到这样一个函数，它将调用它；如果没有，它将寻找`f.default`并调用它。否则，如果不存在`f.default`，它将放弃并给出错误。这是当对象的类是单个字符串时\
  \ R 的行为。如果它是一系列类名，则 R 会按顺序遍历此序列，并尝试为序列中的每个类寻找函数。\n\n考虑下面定义的三个类`A`、`B`和`C`。\n\n```\n\
  A <- function() {\nstructure(list(), class = \"A\")\n}\nB <- function() {\nstructure(list(),\
  \ class = c(\"B\", \"A\"))\n}\nC <- function() {\nstructure(list(), class = c(\"\
  C\", \"B\", \"A\"))\n}\n```\n\n由于类仅由字符串表示，我们并没有真正地明确定义它们；我们只是有三个函数，用于创建设置了`class`属性的对象。创建对象的函数称为构造函数，对于\
  \ S3 系统来说，这实际上是定义类的唯一方式。\n\n我们可以创建这些类的实例并检查它们的类。\n\n```\nx <- A()\ny <- B()\nz <-\
  \ C()\nclass(x)\n## [1] \"A\"\nclass(y)\n## [1] \"B\" \"A\"\nclass(z)\n## [1] \"\
  C\" \"B\" \"A\"\n```\n\n如果我们定义一个只有默认实现的泛型函数：\n\n```\nf <- function(x) UseMethod(\"\
  f\")\nf.default <- function(x) print(\"f.default\")\n```\n\n在所有三个对象上调用它都只会给出默认行为。\n\
  \n```\nf(x)\n## [1] \"f.default\"\nf(y)\n## [1] \"f.default\"\nf(z)\n## [1] \"f.default\"\
  \n```\n\n另一方面，如果我们定义一个具有默认实现和针对类`A`的实现泛型函数，则在三个对象上调用它都会导致调用`A`函数。\n\n```\ng <- function(x)\
  \ UseMethod(\"g\")\ng.default <- function(x) print(\"g.default\")\ng.A <- function(x)\
  \ print(\"g.A\")\ng(x)\n## [1] \"g.A\"\ng(y)\n## [1] \"g.A\"\ng(z)\n## [1] \"g.A\"\
  \n```\n\n对于`x`，我们知道为什么会发生这种情况。R 寻找`g.A`并找到了它。对于`y`，R 寻找`g.B`但没有找到。如果`y`的类只是`\"B\"\
  `，那么搜索将结束，R 将调用`g.default`。但是`y`的类同时包含`\"B\"`和`\"A\"`，所以当 R 找不到`g.B`时，它转而搜索`g.A`，它确实存在，于是调用它。类似地，当我们调用`g(z)`时，R\
  \ 首先搜索`g.C`，没找到，然后搜索`g.B`，也没找到，最后发现`g.A`存在并调用它。所以三次调用都是同一个`g.A`函数。类`B`和`C`从类`A`继承了`g`的实现。\n\
  \n我们现在可以尝试添加一个针对类`A`和`B`都有实现的泛型函数。\n\n```\nh <- function(x) UseMethod(\"h\")\nh.default\
  \ <- function(x) print(\"h.default\")\nh.A <- function(x) print(\"h.A\")\nh.B <-\
  \ function(x) print(\"h.B\")\nh(x)\n## [1] \"h.A\"\nh(y)\n## [1] \"h.B\"\nh(z)\n\
  ## [1] \"h.B\"\n```\n\n在这种情况下，调用`h(x)`会调用`h.A`——自然地，`x`的唯一类是`A`并且`h.A`已实现——而调用`h(y)`和`h(z)`都会调用`h.B`。在这两种情况下，类`B`在类序列中都出现在类`A`之前，并且由于`h.B`存在，它被调用，匹配函数的搜索停止。`h.A`函数存在，但我们在第一次匹配后停止搜索，所以永远不会找到它。\n\
  \n为了完整性，如果我们添加一个对所有三个类都有实现的函数，每个对象都会调用最特化的函数。\n\n```\ni <- function(x) UseMethod(\"\
  i\")\ni.default <- function(x) print(\"i.default\")\ni.A <- function(x) print(\"\
  i.A\")\ni.B <- function(x) print(\"i.B\")\ni.C <- function(x) print(\"i.C\")\ni(x)\n\
  ## [1] \"i.A\"\ni(y)\n## [1] \"i.B\"\ni(z)\n## [1] \"i.C\"\n```\n\n## 在构造函数中确保层次结构正确\n\
  \n当我们在上面创建三个类`A`、`B`和`C`时，我们在每个构造函数中显式地创建了代表类层次结构的类列表。对于我们这里的小型层次结构来说，这没有问题，因为我们将所有三个类定义在一起，并且知道它们应该协同工作。但是，如果代码变得更为复杂，这就引入了一个潜在的出错源。例如，我们可能想在某个时候在`A`和`B`之间插入另一个类。我们可能会记得更新`B`的类列表，但我们还会记得更新`C`的吗？如果`C`在一个不同的文件中，并且我们已经好几年没修改过它了怎么办？\n\
  \n由于类层次结构完全由这些类列表表示——没有显式的层次结构，只有这些隐式的列表——我们必须格外小心，确保我们的代码始终与我们的设计相匹配。我们应该避免在每个构造函数中显式地表示层次结构。\n\
  \n确保这一点的一种方法是在定义新类时始终调用直接超类的构造函数。R 对类层次结构一无所知，并且在您创建`class`列表之前，它不知道您有哪些超类。因此，没有自动的方法来做到这一点；您必须手动调用超类的构造函数，以这种方式获取一个对象，然后将新的类名前置到其`class`列表中。\n\
  \n```\nA <- function() {\nstructure(list(), class = \"A\")\n}\nB <- function() {\n\
  this <- A()\nclass(this) <- c(\"B\", class(this))\nthis\n}\nC <- function() {\n\
  this <- B()\nclass(this) <- c(\"C\", class(this))\nthis\n}\n```\n\n使用这种编程习惯还可以避免另一个潜在的出错源。类的构造函数通常会创建一个对象，其属性处于构造函数期望的一致状态。如果您不调用构造函数，而是在子类的构造函数中设置这些属性，您可能会破坏超类所依赖的不变量。在编写子类构造函数时，您可能会小心避免这样做，但超类的实现可能会在未来被更改。当这种情况发生时，子类的实现可能会被破坏。试图调试一个由于代码中完全不同的位置发生更改而出现的错误是件很痛苦的事情。\n\
  \n通常，更好的做法是始终调用超类的构造函数，然后在返回子类对象之前修改结果对象。\n\n\n\n## `NextMethod`\n\n在定制泛型函数时，我们并不总是需要从零开始实现所有功能。有时我们可以重用更抽象类的实现，只需要稍作调整即可。我们总是可以通过函数的完整名称显式调用超类的函数，但这仅在类实际实现自己的版本时才有效。如果只是继承，这种方法就行不通了，而且每次修改类层次结构时都必须小心，以免破坏此类直接调用所依赖的假设。\n\
  \n更好的解决方案是使用 `NextMethod` 函数。该函数允许您以类似于 `UseMethod` 的方式调用继承的函数，并且会使用 `class` 序列。`NextMethod`\
  \ 函数与 `UseMethod` 一样具有神奇之处。它知道您正在实现哪个泛型函数——尽管与 `UseMethod` 一样，您可以覆盖这一点——并且它将在您函数的第一个对象的\
  \ `class` 序列中进行搜索。同样，您可以覆盖此行为，但这是一种非常常见的惯用法，您可能不应该这样做。不过，与 `UseMethod` 不同，它不会终止调用它的函数，并且您可以使用它返回的值。\n\
  \n举个例子，我们可以考虑上一章末尾讨论的参考书目对象。这里我们有超类 `\"publication\"` 和两个子类 `\"article\"` 与 `\"\
  book\"`，我们还有一个用于格式化引用的泛型方法 `format`。我们可以为 publication 类编写一个 `format` 函数来格式化名称和作者列表，在方法的特化版本中，我们可以调用\
  \ `NextMethod` 来获取此字符串，并使用子类中可用的信息来扩展它。\n\n```\nformat.publication <- function(publ)\
  \ {\npaste(name(publ), authors(publ), sep = \", \")\n}\nformat.article <- function(publ)\
  \ {\npaste(NextMethod(), journal(publ), pages(publ), sep = \", \")\n}\nformat.book\
  \ <- function(publ) {\npaste(NextMethod(), publisher(publ), ISBN(publ), sep = \"\
  , \")\n}\n```\n\n当我们调用 `NextMethod` 时，R 将在 `class` 序列中搜索——从上次搜索结束的地方开始——寻找实现了我们当前正在评估的泛型函数的类。\n\
  \n我们可以使用 `A`、`B` 和 `C` 类来观察这个过程的实际效果。如果我们定义全部调用 `NextMethod` 的函数，并对这三个类中的每一个类的对象进行评估，我们会看到：`A`\
  \ 对象 `x` 将评估 `A` 方法和默认函数；`B` 对象 `y` 将评估 `B` 函数，然后在默认版本之前继续评估 `A` 函数；而 `C` 对象 `z`\
  \ 将评估所有函数。\n\n```\nf <- function(x) UseMethod(\"f\")\nf.default <- function(x) print(\"\
  f.default\")\nf.A <- function(x) {\nprint(\"f.A\")\nNextMethod()\n}\nf.B <- function(x)\
  \ {\nprint(\"f.B\")\nNextMethod()\n}\nf.C <- function(x) {\nprint(\"f.C\")\nNextMethod()\n\
  }\nf(x)\n## [1] \"f.A\"\n## [1] \"f.default\"\nf(y)\n## [1] \"f.B\"\n## [1] \"f.A\"\
  \n## [1] \"f.default\"\nf(z)\n## [1] \"f.C\"\n## [1] \"f.B\"\n## [1] \"f.A\"\n##\
  \ [1] \"f.default\"\n```\n\n如果我们实现另一个函数，只针对类 `A` 和 `C` 实现版本而不为 `B` 实现，我们将看到 `C`\
  \ 对象评估 `C` 版本然后评估 `A` 版本；由于没有 `B` 版本，调用 `NextMethod` 时的搜索将找不到它，因此会继续搜索到 `A` 版本。\n\
  \n```\nj <- function(x) UseMethod(\"j\")\nj.default <- function(x) print(\"j.default\"\
  )\nj.A <- function(x) {\nprint(\"j.A\")\nNextMethod()\n}\nj.C <- function(x) {\n\
  print(\"j.C\")\nNextMethod()\n}\nj(x)\n## [1] \"j.A\"\n## [1] \"j.default\"\nj(y)\n\
  ## [1] \"j.A\"\n## [1] \"j.default\"\nj(z)\n## [1] \"j.C\"\n## [1] \"j.A\"\n## [1]\
  \ \"j.default\"\n```\n\n所有的方法分派——这个查找泛型函数实现的技术术语——完全基于 `class` 属性中的类列表。类层次结构并没有显式表示，`class`\
  \ 列表是否反映了您心目中的类层次结构设计由您自己负责。如果我们反转 `class` 列表的顺序，R 同样可以正常工作。\n\n```\nf(z)\n## [1]\
  \ \"f.C\"\n## [1] \"f.B\"\n## [1] \"f.A\"\n## [1] \"f.default\"\nclass(z) <- rev(class(z))\n\
  f(z)\n## [1] \"f.A\"\n## [1] \"f.B\"\n## [1] \"f.C\"\n## [1] \"f.default\"\n```\n\
  \n如果我们反转类的顺序，`UseMethod` 对第一个函数的搜索会从最抽象的类开始，然后顺着列表向下寻找，直到找到一个实现。在本例中，它会立刻找到，而对 `NextMethod`\
  \ 的调用只是像以前一样，从 `UseMethod` 或前一个 `NextMethod` 调用结束的地方继续搜索。默认函数始终是最后一个，因为一旦遍历完列表，就会调用默认函数。如果\
  \ `A` 类是 `C` 特化的抽象类，这当然会导致错误的行为。您将调用抽象函数而非特化函数。但是，将泛型函数解析为具体类的机制并不了解类层次结构，因此它只会遍历列表进行搜索。\n\
  \n这也意味着，您可以编写不同的类，它们对其他类的层次结构持有完全不同的看法。如果一个 `class` 列表是 `c(\"A\", \"B\", \"C\")`，而另一个是\
  \ `c(\"B\", \"C\", \"A\")`，那么第一个列表认为 `C` 最抽象，`A` 最派生；而第二个列表认为 `A` 最抽象，`B` 最派生。R\
  \ 如何查找要调用的函数的机制足够简单，但是如果您开始编写代码，使得您的类层次结构取决于您正在查看的对象，那么您就踏上了通往混乱的道路。\n\n## 4. 统计模型\n\
  \n老实说，在大多数日常的 R 编程中，您不会使用面向对象编程。您在 R 中进行的大多数分析都涉及数据转换，通常实现为某种数据流，这用函数式编程来捕捉最为合适。当您编写这样的流水线时，您可能会使用多态函数，但很少需要创建自己的类。然而，如果您需要实现一个新的统计模型，您通常确实希望创建一个新类。\n\
  \n大量数据分析需要您推断感兴趣的参数，或者构建一个模型来预测数据的属性，但在许多情况下，您不一定需要确切知道我们是如何构建模型的，它是如何推断参数的，或者它是如何预测新值的。您可以使用\
  \ `coefficients` 函数从拟合模型中获取推断的参数，或者使用 `predict` 函数来预测新值，并且您几乎可以将这两个函数用于任何统计模型。这是因为大多数模型都实现为类，并实现了泛型函数\
  \ `coefficients` 和 `predict`。\n\n作为面向对象编程实际应用的示例，我们可以在本章中实现我们自己的模型。我们将保持其简单性，以便专注于编程方面而非统计理论，但仍然实现一些\
  \ R 内置功能中没有的东西。我们将实现一个贝叶斯线性回归的版本。\n\n\n\n## 贝叶斯线性回归\n\n线性回归的最简单形式是用一条直线拟合数据点。假设我们有向量\
  \ `x` 和 `y`，我们希望得到系数 `w[1]` 和 `w[2]`，使得 `y[i] = w[1] + w[2] x[i] + e[i]`，其中 `e`\
  \ 是误差向量，我们希望尽可能减小这些误差。当我们将其视为一个统计问题时，通常假设误差是独立同分布的正态分布，因此我们希望误差的方差最小。当使用 `lm` 函数拟合线性模型时，你会得到权重\
  \ `w[1]` 和 `w[2]` 的最大似然值，但如果你想进行贝叶斯统计，你应该将这个权重向量 `w` 视为一个随机变量，并根据数据 `x` 和 `y` 进行拟合，这意味着将其从先验分布更新到后验分布。\n\
  \n线性回归权重的一个典型分布是正态分布。如果我们假设权重的先验分布是多元正态分布，那么给定数据后，其后验分布也将是正态分布，这使得数学处理非常方便。\n\n\
  我们将假设 `w` 的先验分布是一个均值为零、分量独立的正态分布，因此其协方差矩阵是对角阵。这意味着，平均而言，我们认为正在拟合的直线是平坦的且通过平面原点，但我们对此的置信程度取决于协方差矩阵中的值。我们将用一个所谓的超参数\
  \ `a` 来参数化这个过程，它是权重分量的精度——方差的倒数。协方差矩阵的对角线上将是 `1/a`，非对角线元素为零。\n\n我们可以用多元正态分布的均值和协方差矩阵来表示权重的分布，并根据精度构建先验分布，如下所示：\n\
  \n```\nweight_distribution <- function(mu, S) {\nstructure(list(mu = mu, S = S),\
  \ class = \"wdist\")\n}\nprior_distribution <- function(a) {\nmu = c(0, 0)\nS =\
  \ diag(1/a, nrow = 2, ncol = 2)\nweight_distribution(mu, S)\n}\n```\n\n我们给权重分布分配了一个类，只是为了将它们与普通列表区分开来，但除此之外，这里没有什么特别之处。\n\
  \n如果我们想从这个分布中抽样，可以使用 `MASS` 包中的 `mvrnorm` 函数。\n\n```\nsample_weights <- function(n,\
  \ distribution) {\nMASS::mvrnorm(n = n,\nmu = distribution$mu,\nSigma = distribution$S)\n\
  }\n```\n\n我们可以尝试从先验分布中抽取一些直线样本并绘制它们。当然，我们可以将样本 `w` 向量作为平面上的点来绘制，但由于它们代表直线，我们将以这种方式显示它们（见图\
  \ 4-1）。\n\n![A451015_1_En_4_Fig1_HTML.jpg](img/A451015_1_En_4_Fig1_HTML.jpg)\n图\
  \ 4-1. 直线的先验样本\n\n```\nprior <- prior_distribution(1)\n(w <- sample_weights(5, prior))\n\
  ##            [,1]        [,2]\n## [1,]  0.6029080 -0.84085548\n## [2,]  0.4721664\
  \  1.38435934\n## [3,]  0.6353713 -1.25549186\n## [4,]  0.2857736  0.07014277\n\
  ## [5,] -0.1381082  1.71144087\nplot(c(-1, 1), c(-1, 1), type = 'n',\nxlab = '',\
  \ ylab = '')\nplot_lines <- function(w) {\nfor (i in 1:nrow(w)) {\nabline(a = w[i,\
  \ 1], b = w[i, 2])\n}\n}\nplot_lines(w)\n```\n\n### 用数据更新分布\n\n当我们观察到匹配的 `X` 和 `y`\
  \ 值形式的数据时，必须更新 `w` 向量以反映这一点，这意味着更新权重的分布。我不会推导数学公式（毕竟这不是一本数学教科书），但如果 `mu0` 是先验均值，`S0`\
  \ 是先验协方差矩阵，则后验均值和协方差矩阵的计算如下：\n\n```\nS <- solve(S0 + b * t(X) %*% X)\nmu <- S %*%\
  \ (solve(S0) %*% mu0 + b * t(X) %*% y)\n```\n\n你无法直接执行此处的代码——它依赖于我们尚未定义的变量——但这是我们稍后定义函数的主体部分。其中涉及一点关于先验分布和观测值的线性代数。在这些表达式中，我们之前未见过的参数是\
  \ `b` 和 `X`。前者是误差项的精度——我们假设已知并将其表示为这个超参数——后者捕捉了 `x` 值。我们不能单独使用 `x`，因为我们想用两个权重来表示直线。当我们为\
  \ `y[i]` 的估计值写下 `w[1] + w[2] * x[i]` 时，我们可以将其视为 `w` 和 `c(0,x[i])` 的向量积，这正是我们所做的。我们将所有\
  \ `x[i]` 表示为矩阵 `X` 中的行 `c(0,x[i])`。因此，用这种表示法，我们估计 `y[i] = w[1] * X[i, 1] + w[2]\
  \ * X[I, 2]`，或者 `y = X %*% w`。\n\n作为一个拟合函数，我们可以将其写成这样：\n\n```\nfit_posterior <-\
  \ function(x, y, b, prior) {\nmu0 <- prior$mu\nS0 <- prior$S\nX <- matrix(c(rep(1,\
  \ length(x)), x), ncol = 2)\nS <- solve(S0 + b * t(X) %*% X)\nmu <- S %*% (solve(S0)\
  \ %*% mu0 + b * t(X) %*% y)\nweight_distribution(mu = mu, S = S)\n}\n```\n\n我们可以尝试绘制一些点，用这些点拟合模型，然后绘制从后验中抽取的直线样本。现在这些直线应该围绕点分布，而不像从先验中抽取的样本那样。我们用于拟合模型的点越多，从后验中抽取的直线样本围绕点分布的范围就越紧密（见图\
  \ 4-2）。\n\n![A451015_1_En_4_Fig2_HTML.jpg](img/A451015_1_En_4_Fig2_HTML.jpg)\n图\
  \ 4-2. 后验直线样本\n\n```\nx <- rnorm(20)\ny <- 0.2 + 1.3 * x + rnorm(20)\nplot(x, y)\n\
  posterior <- fit_posterior(x, y, 1, prior)\nw <- sample_weights(5, posterior)\n\
  plot_lines(w)\n```\n\n### 迭代贝叶斯更新\n\n我们这里将权重分布从先验更新到后验的方式，并不要求先验分布必须是使用变量 `a` 创建的那个确切分布。任何分布都可以用作先验，并且在贝叶斯统计中，随着越来越多的数据加入，不断更新后验分布并不罕见。我们可以从刚刚创建的先验开始，用一些数据拟合它来获得一个后验分布。然后，如果我们获得更多数据，可以将第一个后验分布用作先验来拟合更多数据，并获得一个新的后验分布，该分布捕捉了从看到所有数据中获得的知识。如果我们从一开始就拥有所有数据，这样做没有特别的好处，但在一个数据流式传输的应用中，我们可以利用这一点，在每次新数据可用时快速更新我们的知识。\n\
  \n由于本书不是关于贝叶斯统计的，并且我们仅将贝叶斯线性回归作为编写新统计模型的一个例子，我们将不在此进一步探讨。\n\n\n\n## 模型矩阵\n\n我们拟合后验分布时使用的\
  \ `X` 矩阵，就是所谓的**模型矩阵**或**设计矩阵**的一个例子。以这种方式使用矩阵，将响应变量 `y` 拟合到某个表达式（此处是 `1 + x`，从某种意义上说，我们使用了行\
  \ `c(1, x[i])`），是一种通用的数据拟合方法。线性模型之所以被称为“线性”，并不是因为我们用一条线来拟合数据，而是因为在我们拟合的模型中，权重（即我们拟合的\
  \ `w` 向量）在数学意义上是线性使用的。如果我们已将权重拟合到向量 `w`，那么我们拟合的直线由 `X %*% w` 给出。也就是说，我们的直线是模型矩阵和权重向量的矩阵乘积。结果是一条直线，是因为\
  \ `X` 具有我们赋予它的形式，但模型要成为线性模型，它不一定非得代表一条直线。我们可以在拟合模型之前，以任何方式转换输入数据（此处是我们的向量 `x`）。你可能之前使用过对数变换，或将数据拟合到多项式，这些也都是线性模型的例子。\n\
  \n只要以不同方式构造 `X` 矩阵，你就可以使用我们上面编写的函数来拟合各种经过转换的数据。只要你拥有的每个数据点都成为 `X` 中的一行，无论你做什么都可以。数学原理是相同的。例如，要将数据拟合为二次方程而非直线，你只需让\
  \ `X` 的第 i 行为 `c(1, x[i], x[i]**2)` 即可。\n\n在 R 中，你有一个非常强大的机制，可以从公式构造模型矩阵。每当你使用诸如\
  \ `y ~ x + z` 这样的公式将 `y` 拟合到两个变量 `x` 和 `z` 时，你就在使用这个特性。该公式会被翻译成一个模型矩阵，一旦你有了这个矩阵，执行模型拟合的代码就无需了解关于你数据的任何其他信息。\n\
  \n用于将公式转换为模型矩阵的函数称为 `model.matrix`。尽管其名称中有一个句点，但它并非泛型函数。这只是一个由于历史原因而不太理想的命名。\n\n\
  该函数将接受一个公式作为输入并生成一个模型矩阵。它会通过在其作用域内查找来获取公式中变量的值，我们可以像这样使用它：\n\n```\nx <- rnorm(5)\n\
  y <- 1.2 + 2 * x + rnorm(5)\nmodel.matrix(y ~ x)\n```\n\n然而，依赖这样的全局变量是风险较高的编码方式，因此我们通常将数据放入数据框中。\n\
  \n```\nd <- data.frame(x, y)\n```\n\n如果我们这样做，就可以向 `model.matrix` 函数提供一个数据框，它会从那里获取变量。\n\
  \n```\nmodel.matrix(y ~ x, data = d)\n```\n\n如果公式使用的变量在数据框中找不到，`model.matrix` 仍会在调用作用域中查找缺失的变量，但这确实是风险很高的编码方式，因此你应该避免这种情况。\n\
  \n公式决定了模型矩阵的构造方式。公式 `y ~ x` 给出了我们上面使用的模型矩阵，其中第一列有 1 用于捕获截距，第二列有 `x` 值用于捕获直线的斜率。我们可以使用公式\
  \ `y ~ x - 1` 来移除截距：\n\n```\nmodel.matrix(y ~ x - 1, data = d)\n```\n\n我们也可以添加项；例如，我们可以通过构造以下模型矩阵将数据拟合到二次公式：\n\
  \n```\nmodel.matrix(y ~ x + I(x**2), data = d)\n```\n\n这里，我们需要将平方后的 `x` 包装在函数 `I`\
  \ 中，以便让 R 使用 `x` 的实际平方值。在公式内部，乘积被解释为交互作用，但通过将 `x**2` 包装在 `I` 中，我们明确地使其成为 `x` 值的平方。\n\
  \n模型矩阵不包含响应变量 `y`，所以我们无法从中获取它。相反，我们可以使用一个相关的函数 `model.frame`，它也会为我们提供响应变量的列。\n\n\
  ```\nmodel.frame(y ~ x + I(x**2), data = d)\n```\n\n然后，你可以使用函数 `model.response`\
  \ 提取响应变量，像这样：\n\n```\nmodel.response(model.frame(y ~ x + I(x**2), data = d))\n```\n\
  \n有了这套机制，我们可以将分布和模型拟合推广到适用于通用公式。我们可以像这样编写先验函数：\n\n```\nprior_distribution <- function(formula,\
  \ a, data) {\n  n <- ncol(model.matrix(formula, data = data))\n  mu <- rep(0, n)\n\
  \  S <- diag(1/a, nrow = n, ncol = n)\n  weight_distribution(mu, S)\n}\n```\n\n\
  理想情况下，先验不应依赖于任何数据，但模型矩阵的形式确实取决于我们使用的数据类型。数值数据在模型矩阵中表示为单列，但因子在公式中会作为每个水平的二进制向量来处理，因此我们确实需要知道我们将需要什么类型的数据。我们本可以在这里将\
  \ `n` 作为参数添加，并使函数独立于任何数据，但我选择了包含一个数据框作为另一种解决方案。不过，我们并不使用实际数据；我们只是用它来获取模型框架的列数。\n\
  \n然而，拟合数据的函数变化较小。它只是使用 `model.matrix` 函数来构造模型矩阵，而不是像我们之前那样显式构造。\n\n```\nfit_posterior\
  \ <- function(formula, b, prior, data) {\n  mu0 <- prior$mu\n  S0 <- prior$S\n \
  \ X <- model.matrix(formula, data = data)\n  S <- solve(S0 + b * t(X) %*% X)\n \
  \ mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)\n  weight_distribution(mu = mu,\
  \ S = S)\n}\n```\n\n准备好这些之后，我们可以像以前一样拟合直线，但现在使用公式。\n\n```\nd <- {\n  x <- rnorm(5)\n\
  \  y <- 1.2 + 2 * x + rnorm(5)\n  data.frame(x = x, y = y)\n}\nprior <- prior_distribution(y\
  \ ~ x, 1, d)\nposterior <- fit_posterior(y ~ x, 1, prior, d)\nposterior\n```\n\n\
  如果我们想拟合二次函数，则无需更改任何函数，只需提供不同的公式即可。\n\n```\nprior <- prior_distribution(y ~ x + I(x**2),\
  \ 1, d)\nposterior <- fit_posterior(y ~ x + I(x**2), 1, prior, d)\nposterior\n```\n\
  \n\n\n## 构建拟合模型对象\n\n现在，我们想将拟合模型包装在一个类中，以便为它们编写一个构造函数。对于拟合模型，传统做法是将公式、数据以及函数调用与拟合模型本身一起包含在对象中，因此我们将把这些作为属性放入对象中。构造函数可能如下所示：\n\
  \n```\nblm <- function(formula, b, data, prior = NULL, a = NULL) {\nif (is.null(prior))\
  \ {\nif (is.null(a)) stop(\"Without a prior you must provide a.\")\nprior <- prior_distribution(formula,\
  \ a, data)\n} else {\nif (inherits(prior, \"blm\")) {\nprior <- prior$prior\n}\n\
  }\nif (!inherits(prior, \"wdist\")) {\nstop(\"The provided prior does not have the\
  \ expected type.\")\n}\nposterior <- fit_posterior(formula, b, prior, data)\nstructure(\n\
  list(formula = formula,\ndata = model.frame(formula, data),\ndist = posterior,\n\
  call = match.call()),\nclass = \"blm\"\n)\n}\n```\n\n构造函数开头的测试允许我们将先验指定为正态分布或先前拟合的\
  \ `blm` 对象。如果我们得到一个先验分布，我们可能还应该检查这个先验是否与实际公式兼容，但我将让你自己编写这样的检查来尝试一下。\n\n如果我们打印使用\
  \ `blm` 函数拟合的对象，它们将仅以列表形式打印，但我们可以通过特化 `print` 泛型函数来提供我们自己的 `print` 函数。这里，传统做法是提供用于指定模型的函数调用，所以我目前就只做这些。\n\
  \n```\nprint.blm <- function(x, ...) {\nprint(x$call)\n}\n```\n\n我们必须匹配泛型函数的参数，这就是参数是\
  \ `x` 和...的原因。然而，我们所做的只是打印对象的 `call` 属性。\n\n现在，我们可以像这样拟合数据并获得一个 `blm` 对象：\n\n```\n\
  (model <- blm(y ∼ x + I(x**2), a = 1, b = 1, data = d))\n## blm(formula = y ∼ x\
  \ + I(x²), b = 1, data = d, a = 1)\n```\n\n## 系数与置信区间\n\n一旦我们有了一个拟合模型，我们可能想获取拟合值。传统上这是通过泛型函数\
  \ `coef` 完成的，它应该简单地返回这些值。对于贝叶斯线性回归模型，拟合值是整个分布，但我们可以将均值作为点估计并返回它们，从而实现如下的 `coef`\
  \ 函数：\n\n```\ncoef.blm <- function(object, ...) {\nt(object$dist$mu)\n}\ncoef(model)\n\
  ##      (Intercept)         x    I(x²)\n## [1,]    1.190673 0.2815418 0.1185518\n\
  ```\n\n这里，我变换了均值矩阵，以使系数的形式类似于使用 `lm` 函数拟合的传统线性模型所得到的系数，除此之外，该函数只是返回均值。\n\n对于经典的频率派模型，我们通常还想要参数的置信区间，传统方法是使用\
  \ `confint` 函数。这个函数的签名为：\n\n```\nconfint(object, parm, level = 0.95, ...)\n```\n\
  \n`object` 参数是拟合模型，`parm` 包含我们想要获取置信区间的参数。如果缺失，我们应该返回所有模型参数，而 `level` 参数则指定我们所需的置信水平区间。\n\
  \n同样，对于贝叶斯模型，我们拥有整个分布而不仅仅是置信区间，但我们可以通过获取每个参数边际分布的分位数来得到类似的结果。参数服从正态分布，我们可以分别从均值和协方差矩阵获取均值和标准差。之后，我们可以使用\
  \ `qnorm` 函数获取分位数，并像这样构造区间：\n\n```\nconfint.blm <- function(object, parm, level\
  \ = 0.95, ...) {\nif (missing(parm)) {\nparm <- rownames(object$dist$mu)\n}\nmeans\
  \ <- object$dist$mu[parm,]\nsds <- sqrt(diag(object$dist$S)[parm])\nlower_q <- qnorm(p\
  \ = (1-level)/2,\nmean = means,\nsd = sds)\nupper_q <- qnorm(p = 1 - (1-level)/2,\n\
  mean = means,\nsd = sds)\nquantiles <- cbind(lower_q, upper_q)\nquantile_names <-\
  \ paste(\n100 * c((1-level)/2, 1 - (1 -level)/2),\n\"%\",\nsep = \"\"\n)\ncolnames(quantiles)\
  \ <- quantile_names\nquantiles\n}\nconfint(model)\n##                   2.5%   \
  \ 97.5%\n## (Intercept)  0.3754236 2.005923\n## x           -1.4001225 1.963206\n\
  ## I(x²)      -1.8222478 2.059351\n```\n\n\n\n## 预测响应变量\n\n当需要为新数据预测响应变量时，模型矩阵的构建需要额外处理。即使模型矩阵实际上并不包含响应变量列，但如果我们在创建模型矩阵时没有响应变量，仍然会收到错误信息。如果我们移除之前创建数据框时使用的\
  \ `x` 和 `y` 变量，就能看到这种情况。\n\n```\nrm(x) ; rm(y)\n```\n\n如果从同时包含 `x` 和 `y` 的数据框构建模型矩阵，则一切正常。\n\
  \n```\nmodel.matrix(y ∼ x + I(x**2), data = d)\n##   (Intercept)           x   \
  \   I(x²)\n## 1           1 -0.20409732 0.041655716\n## 2           1 -0.22561419\
  \ 0.050901761\n## 3           1  0.34702845 0.120428747\n## 4           1  0.03236784\
  \ 0.001047677\n## 5           1  0.41353129 0.171008128\n## attr(,\"assign\")\n\
  ## [1] 0 1 2\n```\n\n但是，如果我们创建一个只包含 `x` 值的数据框，就会得到一个错误。\n\n```\ndd <- data.frame(x\
  \ = rnorm(5))\nmodel.matrix(y ∼ x + I(x**2), data = dd)\n## Error in eval(expr,\
  \ envir, enclos): object 'y' not found\n```\n\n当然，这成了一个*问题*，因为我们恰恰是在没有响应变量时才需要预测它。这有点讽刺，考虑到模型矩阵实际上从不包含响应变量；但这就是\
  \ R 的工作方式。\n\n为了在构建模型矩阵之前从公式中移除响应变量，我们需要使用函数 `delete.response`。不幸的是，这个函数不能直接作用于公式，而是作用于所谓的\"\
  terms\"对象。我们可以使用 `terms` 函数将公式转换为其 terms 对象。因此，要移除公式中的响应项，我们需要以下结构：\n\n```\ndelete.response(terms(y\
  \ ∼ x))\n```\n\n结果是一个 `terms` 对象，但由于 `terms` 类是 `formula` 类的特化，我们可以直接将其与 `model.matrix`\
  \ 函数一起使用来构建模型矩阵。\n\n```\nmodel.matrix(delete.response(terms(y ∼ x)), data = dd)\n\
  ##   (Intercept)           x\n## 1           1  0.49841617\n## 2           1 -1.74230249\n\
  ## 3           1  0.97552910\n## 4           1 -0.02408287\n## 5           1  0.67568448\n\
  ## attr(,\"assign\")\n## [1] 0 1\n```\n\n现在，对于实际的数据预测，我们通常使用泛型函数 `predict`。这个函数的签名如下：\n\
  \n```\nfunction(object, ...)\n```\n\n坦率地说，这没什么用。不过，我们可以像 `lm` 类那样为其添加参数，比如添加一个 `newdata`\
  \ 参数。我们将从 `newdata` 构建一个模型矩阵，并为此数据进行预测。如果我们只想要新数据的点估计，我们可以简单地取均值权重与模型矩阵中每一行的内积，因此我们可以像这样实现\
  \ `predict` 函数：\n\n```\npredict.blm <- function(object, newdata, ...) {\nupdated_terms\
  \ <- delete.response(terms(object$formula))\nX <- model.matrix(updated_terms, data\
  \ = newdata)\npredictions <- vector(\"numeric\", length = nrow(X))\nfor (i in seq_along(predictions))\
  \ {\npredictions[i] <- t(object$dist$mu) %*% X[i,]\n}\npredictions\n}\npredict(model,\
  \ d)\n## [1] 1.138150 1.133188 1.302653 1.199910 1.327373\n```\n\n为了检查模型，我们可以将预测值与真实响应值绘制成散点图。不过，考虑到我们目前使用的数据只有五个数据点，我们并不期望预测结果特别好，也不期望这样的图能展示太多信息，但我们可以尝试用更多数据点来绘图。\n\
  \n![A451015_1_En_4_Fig3_HTML.jpg](img/A451015_1_En_4_Fig3_HTML.jpg)\n\n图 4-3. 真实值\
  \ vs. 预测值\n\n```\nd <- {\nx <- rnorm(50)\ny <- 0.2 + 1.4 * x + rnorm(50)\ndata.frame(x\
  \ = x, y = y)\n}\nmodel <- blm(y ∼ x, d, a = 1, b = 1)\nplot(d$y, predict(model,\
  \ d),\nxlab = \"True responses\",\nylab = \"Predicted responses\")\n```\n\n对原始数据进行预测非常常见，因此有另一个泛型函数来完成这个任务，叫做\
  \ `fitted`。我们可以这样实现它：\n\n```\nfitted.blm <- function(object, ...) {\npredict(object,\
  \ newdata = object$data, ...)\n}\n```\n\n有了这个函数，我们就可以这样创建绘图：\n\n```\nplot(d$y, fitted(model),\n\
  xlab = \"True responses\",\nylab = \"Predicted responses\")\n```\n\n当然，我们能做的不仅仅是简单的点估计预测。我们有一个权重的*分布*，这意味着直线的斜率和截距并不是固定的。至少在概念上，它们是从一个分布中抽取的。斜率的微小变化不会对我们在数据主体区域附近的预测确定性产生太大影响，但对于靠近数据边缘的数据点，由于这个原因，不确定性会更大。我们在做预测时可以考虑这个分布，从而获得预测的误差范围。如果\
  \ `X` 是模型矩阵，`S` 是后验的协方差矩阵，那么第 i 个预测的方差由下式给出：\n\n```\n1/b + t(X[i,]) %*% S %*% X[i,]\n\
  ```\n\n我们没有将精度参数 `b` 存储在拟合模型对象中，所以如果我们想要获取误差范围，就需要保留它。因此，更新你的 `blm` 函数以返回这个结构：\n\
  \n```\nstructure(\nlist(formula = formula,\ndata = model.frame(formula, data),\n\
  dist = posterior,\nprecision = b,\ncall = match.call()),\nclass = \"blm\"\n)\n```\n\
  \n现在，我们可以扩展我们的 `predict` 函数，添加一个选项，如果为 `TRUE`，则同时返回区间：\n\n```\npredict.blm <- function(object,\
  \ newdata,\nintervals = FALSE,\nlevel = 0.95,\n...) {\nupdated_terms <- delete.response(terms(object$formula))\n\
  X <- model.matrix(updated_terms, data = newdata)\npredictions <- vector(\"numeric\"\
  , length = nrow(X))\nfor (i in seq_along(predictions)) {\npredictions[i] <- t(object$dist$mu)\
  \ %*% X[i,]\n}\nif (!intervals) return(predictions)\nS <- model$dist$S\nb <- model$precision\n\
  sds <- vector(\"numeric\", length = nrow(X))\nfor (i in seq_along(predictions))\
  \ {\nsds[i] <- sqrt(1/b + t(X[i,]) %*% S %*% X[i,])\n}\nlower_q <- qnorm(p = (1-level)/2,\n\
  mean = predictions,\nsd = sds)\nupper_q <- qnorm(p = 1 - (1-level)/2,\nmean = predictions,\n\
  sd = sds)\nintervals <- cbind(lower_q, predictions, upper_q)\ncolnames(intervals)\
  \ <- c(\"lower\", \"mean\", \"upper\")\nas.data.frame(intervals)\n}\nmodel <- blm(y\
  \ ∼ x, d, a = 1, b = 1)\n```\n\n使用这个 `predict` 函数，我们还可以在预测值周围绘制误差条，见图 4-4。在图中，我也绘制了\
  \ x = y 的直线。如果我们做出准确的预测，数据点应该落在这条线上。由于数据中存在一些随机性，我们不期望完全落在线上，但我们期望有 95% 的时间与这条线重叠。\n\
  \n![A451015_1_En_4_Fig4_HTML.jpg](img/A451015_1_En_4_Fig4_HTML.jpg)\n\n图 4-4. 带有置信区间的预测值\
  \ vs. 真实值\n\n```\nrequire(ggplot2)\npredictions <- fitted(model, intervals = TRUE)\n\
  ggplot(cbind(data.frame(y = d$y), predictions),\naes(x = y, y = mean)) +\ngeom_point()\
  \ +\ngeom_errorbar(aes(ymin = lower, ymax = upper)) +\ngeom_abline(slope = 1) +\n\
  xlab(\"True responses\") +\nylab(\"Predictions\") +\ntheme_minimal()\n```\n\n当然，对于统计模型我们还能做更多，也可以添加更多泛型函数来为一类模型提供统一的接口，但我希望这个例子至少能让你体会到将模型表示为类的用处。\n\
  \n\n\n"
- "# 5. 运算符重载\n\n运算符重载，即为诸如 `+` 或 `-` 这样的运算符赋予新的或额外的功能，其本身并非面向对象编程的固有特性。但由于它可以被视为为函数添加多态性，因此在介绍了通过泛型函数实现的多态性之后，将这部分内容放在这里非常自然。\n\
  \n关于运算符重载是好是坏，观点不一。有些语言允许；有些则不允许。有些语言允许你创建自己的中缀运算符，但不允许更改现有的；还有些语言只是不一致地允许对内置对象进行某些运算符重载，但对用户定义的则不行。反对重载的一个论点是运算符的预期行为。我们根深蒂固地认为\
  \ `+` 意味着加法，如果它还表示字符串连接，我们可能会难以接受。当然，这个论点忽略了我们对 `+` 同时用于整数和浮点数加法并无问题的事实。另一个论点，在我看来更有说服力，是记住一个运算符的功能比记住一个函数的功能更难，因为函数名至少给了我们一些关于函数用途的提示。事实是，如果谨慎使用，中缀运算符可以为我们提供比简单函数调用更方便的语法。你可能觉得\
  \ `2 * x + 5` 比 `plus(times(2, x), 5)` 更容易阅读，大多数编程语言（Lisp 方言是一个明显的例外）也更倾向于前者而不是后者。对于用户定义或用户重载的运算符也是如此。使用\
  \ `magrittr` 的管道运算符 `%>%` 可以让分析工作流的可读性大大提高，而 `ggplot2` 对 `+` 的重载也让绘图代码更易读。\n\n由于在\
  \ R 语言中，你既可以重载现有运算符，也可以创建自己的新运算符，因此你必须为任何给定的情况选择最合适的方式。我的经验法则是：除非使用现有运算符感觉非常自然，否则优先考虑新的中缀运算符。当然，这是一个非常主观的评价，但有些操作看起来就像“加法”——我会说\
  \ `ggplot2` 中的组合操作可以被如此合理化——而其他操作则不像，比如 `magrittr` 中的管道操作。这是一个需要判断的决定，你始终可以通过代码实验来找到你认为最自然的方式。\n\
  \n在本章中，我们将看到如何重载运算符。我不会介绍如何创建中缀运算符。如果你对此感兴趣，可以在我的《R 语言函数式编程》一书中找到相关描述。\n\n## 函数与运算符\n\
  \nR 语言中的每一个操作都涉及一个函数调用。控制结构、下标、甚至括号都涉及函数，自然，运算符也涉及函数调用。这意味着运算符可以被覆盖。你可以通过定义一个新版本的\
  \ `+` 来替换其原有的实现。但你其实不应该这样做。用用户定义的运算符替换内置运算符会影响你所有的代码，降低运行速度，并且很可能引入难以发现的错误。不过，为你自己的类定义运算符时无需这样做。运算符是泛型的，你可以为它们定义专门的版本，实现任何运算符应如何处理你定义的新类。\n\
  \n为了说明如何做到这一点，我们定义一个对某个数字 `n` 取模的算术类。这里我假设 `value` 是某种数值类型——在生产代码中，我们会为此编写测试，但在此示例中，我们只是隐含地假定——并且我们使用一个属性来存储数字\
  \ `n`。然后我们计算值对 `n` 取模的结果，设置类，并返回结果。\n\n```\nmodulus <- function(value, n) {\n  result\
  \ <- value %% n\n  attr(result, \"modulus\") <- n\n  class(result) <- c(\"modulus\"\
  , class(value))\n  result\n}\n```\n\n为了美观地打印此类的值，我们定义 `print` 方法。我们希望使用基础类型打印值 `x`，但在其上方附加一行显示\
  \ `n`。如果我们直接调用 `print(x)`，由于 `x` 的类型，我们会递归回到 `print.modulus`，但我们可以使用函数 `unclass`\
  \ 来去除 `x` 的类。不过，它并不能完全去除类型。如果 `x` 是数值类型，`unclass` 只是将 `x` 还原为该类型。当我们打印带有属性的基本值时，属性也会被打印出来，所以我们在打印还原后的\
  \ `x` 之前要去掉所有属性。这里我们本可以直接调用 `print(x)`，但 `NextMethod()` 同样有效，所以我在此使用了它。\n\n```\n\
  print.modulus <- function(x, ...) {\n  cat(\"Modulus\", attr(x, \"modulus\"), \"\
  values:\\n\")\n  # 移除属性以获得纯数值打印\n  x <- unclass(x)\n  attributes(x) <- NULL\n  NextMethod()\n\
  }\n(x <- modulus(1:6, 3))\n## Modulus 3 values:\n## [1] 1 2 0 1 2 0\n```\n\n###\
  \ 定义单运算符\n\n我们可以通过定义函数 `` `+.modulus` `` 来为此类型定义加法的含义：\n\n```\n`+.modulus` <- function(x,\
  \ y) {\n  n <- attr(x, \"modulus\")\n  x <- unclass(x)\n  y <- unclass(y)\n  modulus(x\
  \ + y, n)\n}\n```\n\n我们首先从 `x` 中获取 `n`。然后去除两个操作数的类信息，以便调用原始的 `+` 来计算它们的和。如果我们不这样做，当我们尝试将\
  \ `x` 和 `y` 相加时，又会发生递归调用。接着我们计算结果并使用 `modulus` 构造函数以正确的类型返回它。\n\n这类运算符函数的调度与我们之前看到的泛型函数略有不同。对于泛型函数，调度基于第一个参数的类型（至少除非你明确说明否则如此），但对于运算符，调度基于两个操作数的类型。如果两者都有一个实现了该运算符的类，它们必须是相同的类。如果其中只有一个有类（这里原始类如\
  \ `\"numeric\"` 或 `\"integer\"` 不算），那么调度就基于那个有类的操作数。因此，如果 `x` 是 `\"modulus\"` 类型，那么\
  \ `x + 1:6` 和 `1:6 + x` 都会调用 `` `+.modulus` ``。\n\n```\nx + 1:6\n## Modulus 3 values:\n\
  ## [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus values:\n## numeric(0)\n```\n\n第一个表达式符合我们的预期，但第二个没有。这不是因为调度没有生效，而是因为我们只从第一个操作数获取了\
  \ `n`。由于我们只能保证两个操作数中有一个是 `\"modulus\"` 类型，我们需要检查两者。我们可以简单地通过检查属性 `\"modulus\"` 是否为\
  \ `NULL` 来做到：\n\n```\n`+.modulus` <- function(x, y) {\n  n <- ifelse(!is.null(attr(x,\
  \ \"modulus\")),\n              attr(x, \"modulus\"), attr(y, \"modulus\"))\n  x\
  \ <- unclass(x)\n  y <- unclass(y)\n  modulus(x + y, n)\n}\nx + 1:6\n## Modulus\
  \ 3 values:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus 3 values:\n## [1] 2 1 0 2 1\
  \ 0\n```\n\n根据我们希望此类加法具有的语义，我们可能不允许 `n` 不同的类型相加。如果我们现在将这样的类型相加，`n` 将从第一个操作数获取。\n\
  \n```\ny <- modulus(1:6, 2)\nx + y\n## Modulus 3 values:\n## [1] 2 2 1 1 0 0\n```\n\
  \n通过多加一点检查，我们可以确保两个操作数是兼容的：\n\n```\n`+.modulus` <- function(x, y) {\n  nx <- attr(x,\
  \ \"modulus\")\n  ny <- attr(y, \"modulus\")\n  if (!is.null(nx) && !is.null(ny)\
  \ && nx != ny)\n    stop(\"Incompatible types\")\n  n <- ifelse(!is.null(nx), nx,\
  \ ny)\n  x <- unclass(x)\n  y <- unclass(y)\n  modulus(x + y, n)\n}\nx + y\n## Error\
  \ in `+.modulus`(x, y): Incompatible types\ny <- modulus(rev(1:6), 3)\nx + y\n##\
  \ Modulus 3 values:\n## [1] 1 1 1 1 1 1\n```\n\n\n\n### 分组运算符\n\n使用泛型函数，我们可以为用户定义的类型定义所有相关的运算符，但也可以在一个函数\
  \ `Ops` 中处理所有运算符。此函数被称为“分组泛型方法”，因为它处理一组泛型函数；其他分组方法包括 `Math`、`Complex` 和 `Summary`，这些我们在此不作讨论。\n\
  \n如果我们定义函数 `Ops.modulus`，它将为所有 `modulus` 对象上未定义运算符函数的情况被调用。也就是说，如果我们像上面那样定义了 ``\
  \ `+.modulus` ``，那么该函数将优先于 `Ops.modulus` 被调用；否则，如果一个或两个操作数的类型是 `modulus`，那么 `Ops.modulus`\
  \ 将被调用。\n\n我们可以这样定义它：\n\n```\nOps.modulus <- function(e1, e2) {\nnx <- attr(e1,\
  \ \"modulus\")\nny <- attr(e2, \"modulus\")\nif (!is.null(nx) && !is.null(ny) &&\
  \ nx != ny)\nstop(\"Incompatible types\")\nn <- ifelse(!is.null(nx), nx, ny)\nresult\
  \ <- unclass(NextMethod()) %% n\nmodulus(result, n)\n}\n```\n\n函数开头对输入值的测试与 `` `+.modulus`\
  \ `` 中的相同。测试之后，我们使用 `NextMethod` 来调用基于底层类型的操作。这会从操作数中剥离 `modulus` 类，并计算我们当前正在处理的任何操作。我们对结果进行\
  \ `unclass` 处理，这是必要的，因为结果将继承 `Ops` 操作数的属性，所以如果我们不这样做，结果将具有 `modulus` 类，然后我们计算模数\
  \ `n`。如果我们不进行 `unclass` 处理，这将导致递归调用，但由于我们确实移除了类，我们只在底层类型中计算模数。最后，我们为结果创建一个 `modulus`\
  \ 对象。\n\n定义了这个函数后，我们就能一次性获得所有二元运算符。\n\n```\ny <- modulus(rev(1:6), 3)\nx - y\n##\
  \ Modulus 3 values:\n## [1] 1 0 2 1 0 2\nx * y\n## Modulus 3 values:\n## [1] 0 1\
  \ 0 0 1 0\n```\n\n这也包括比较运算符：\n\n```\nx == y\n## Modulus 3 values:\n## [1] 0 1 0\
  \ 0 1 0\nx == x\n## Modulus 3 values:\n## [1] 1 1 1 1 1 1\nx != y\n## Modulus 3\
  \ values:\n## [1] 1 0 1 1 0 1\nx != x\n## Modulus 3 values:\n## [1] 0 0 0 0 0 0\n\
  ```\n\n它甚至包括一元运算符。但是，如果我们使用一元负号，函数调用中的参数 `e2` 将会缺失，目前我们没有正确处理这种情况。\n\n```\n- x\n\
  ## Error in Ops.modulus(x): argument \"e2\" is missing, with no default\n```\n\n\
  不过，我们可以通过检查 `e2` 是否缺失来轻松修复这个问题。除此之外，函数将按原样工作。\n\n```\nOps.modulus <- function(e1,\
  \ e2) {\nnx <- attr(e1, \"modulus\")\nny <- if (!missing(e2)) attr(e2, \"modulus\"\
  ) else NULL\nif (!is.null(nx) && !is.null(ny) && nx != ny)\nstop(\"Incompatible\
  \ types\")\nn <- ifelse(!is.null(nx), nx, ny)\nresult <- unclass(NextMethod()) %%\
  \ n\nmodulus(result, n)\n}\n- x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n```\n\
  \n## 单位示例\n\n作为一个稍微复杂一些的示例，我们定义一个类，用于将物理单位与数值关联起来。这将允许我们检查所操作的单位是否兼容——这样我们就不会从秒中减去米等等——并且会将单位分析作为算术操作的一部分。这个示例是\
  \ `units` 包的一个简化版本。`units` 包还处理单位转换和单位简化。这里我们只实现简单的符号单位算术以及一个简单的单位相等性检查。\n\n其思想是拥有物理单位的表示，然后将这些单位与数值关联起来。这里的物理单位指的是像平方公里、米每秒等单位。通常，这些将是符号表达式，但我们只考虑稍简单一些的情况，即单位是物理常数的分数。在这种情况下，我们可以将这些单位表示为分子的项列表和分母的项列表。如果我们始终保持这些列表有序，我们就有了它们的规范表示，并且我们可以通过检查分子和分母列表是否相等来检查两个单位是否相等。我们可以像这样实现构造函数：\n\
  \n```\nsymbolic_unit <- function(nominator, denominator = \"\") {\nnon_empty <-\
  \ function(x) x != \"\"\nnominator <- sort(Filter(non_empty, nominator))\ndenominator\
  \ <- sort(Filter(non_empty, denominator))\nstructure(list(nominator = nominator,\n\
  denominator = denominator),\nclass = \"symbolic_unit\")\n}\n```\n\n我们可以将这些单位转换为分数的字符串表示，以便美观地打印。\n\
  \n```\nas.character.symbolic_unit <- function(x, ...) {\nformat_terms <- function(terms,\
  \ op) {\nif (length(terms) == 0) return(\"1\")\npaste0(terms, collapse = op)\n}\n\
  nominator <- format_terms(x$nominator, \"*\")\ndenominator <- format_terms(x$denominator,\
  \ \"/\")\npaste(nominator, \"/\", denominator)\n}\nprint.symbolic_unit <- function(x,\
  \ ...) {\ncat(as.character(x, ...), \"\\n\")\n}\n(x <- symbolic_unit(\"m\"))\n##\
  \ m / 1\n(y <- symbolic_unit(\"m\", \"s\"))\n## m / s\n```\n\n比较两个符号单位涉及检查分子和分母是否相等。\n\
  \n```\n`==.symbolic_unit` <- function(x, y) {\nif (!(inherits(x, \"symbolic_unit\"\
  ) &&\ninherits(y, \"symbolic_unit\")))\nstop(\"Incompatible types\")\nreturn(identical(x$nominator,\
  \ y$nominator) &&\nidentical(x$denominator, y$denominator))\n}\n`!=.symbolic_unit`\
  \ <- function(x, y) !(x == y)\nx == y\n## [1] FALSE\nx != y\n## [1] TRUE\n```\n\n\
  只有当物理量具有相同单位时，才能进行加减运算；但乘除单位总是可能的。然后，通过对（符号）单位执行与对量相同的操作来获得结果单位。为了能够处理这一点，我们定义符号单位的乘法和除法。\n\
  \n```\n`*.symbolic_unit` <- function(x, y) {\nsymbolic_unit(c(x$nominator, y$nominator),\n\
  c(x$denominator, y$denominator))\n}\n`/.symbolic_unit` <- function(x, y) {\nsymbolic_unit(c(x$nominator,\
  \ y$denominator),\nc(x$denominator, y$nominator))\n}\nx * y\n## m*m / s\nx / y\n\
  ## m*s / m\n```\n\n现在我们已经具备了表示单位所需的一切。我们只需要定义将单位与量关联起来的类。这个类与我们之前编写的 `modulus` 类非常相似。我们取一个（数值）值，将一个符号单位作为属性关联起来，并设置类。\n\
  \n```\nunits <- function(value, nominator, denominator = \"\") {\nattr(value, \"\
  units\") <- symbolic_unit(nominator, denominator)\nclass(value) <- c(\"units\",\
  \ class(value))\nvalue\n}\n```\n\n美观打印遵循我们在 `modulus` 中看到的模式。我们需要剥离类和属性以使用底层的打印方法（通过\
  \ `NextMethod` 调用），但仅此而已。\n\n```\nprint.units <- function(x, ...) {\ncat(\"Units:\
  \ \", as.character(attr(x, \"units\")), \"\\n\")\n# remove attributes to get plain\
  \ numeric printing\nx <- unclass(x)\nattributes(x) <- NULL\nNextMethod()\n}\n(x\
  \ <- units(1:6, \"m\"))\n## Units:  m / 1\n## [1] 1 2 3 4 5 6\n```\n\n\n\n处理 `units`\
  \ 的运算符比处理 `modulus` 稍显复杂。我们需要区分两种运算符：一种是要求单位必须匹配的，另一种是需要构造新单位的。前者包括加法、减法和比较运算（假设我们仅当数值及其关联单位均一致时才认为它们相等）；后者包括乘法和除法，其结果的单位必须由操作数计算得出。对于逻辑运算符如何处理物理量（如果确实有意义的话）并不显而易见，因此对于不属于这两类范畴的运算符，我们应该默认采用底层类型的处理方式。\n\
  \n我们利用 `Ops` 组函数来实现这些运算符。在该函数内部，我们可以通过变量 `.Generic` 访问当前正在被求值的实际运算符。这不是函数的参数，但当函数被调用时，它会被设置为正在求值的运算符，我们可以通过\
  \ `switch` 语句来检查并妥善处理。\n\n```\nOps.units =\", \">\")) {\nif (!is.null(su1) && !is.null(su2)\
  \ && su1 != su2)\nstop(\"Incompatible units\")\nsu <- ifelse(!is.null(su1), su1,\
  \ su2)\nreturn(NextMethod())\n}\nif (.Generic == \"*\" || .Generic == \"/\") {\n\
  if (is.null(su1))\nsu1 <- symbolic_unit(\"\")\nif (is.null(su2))\nsu2 <- symbolic_unit(\"\
  \")\nsu <- switch(.Generic, \"*\" = su1 * su2, \"/\" = su1 / su2)\nresult <- NextMethod()\n\
  attr(result, \"units\") <- su\nreturn(result)\n}\n# 对于其余运算符，我们并无良策处理单位\n# 因此我们剥离单位信息，回归到数值运算\n\
  e1 <- unclass(e1)\ne2 <- unclass(e2)\nattributes(e1) <- attributes(e2) <- NULL\n\
  NextMethod()\n}\n```\n\n通过如此定义的单位运算符，我们可以将单位与标量结合：\n\n```\n2 * x\n## Units:  m /\
  \ 1\n## [1]  2  4  6  8 10 12\nx + 2\n## Units:  m / 1\n## [1] 3 4 5 6 7 8\nx -\
  \ 2\n## Units:  m / 1\n## [1] -1  0  1  2  3  4\n```\n\n如果我们尝试相加两个单位不兼容的量，将会收到错误信息。\n\
  \n```\n(y <- units(1:6, \"m\", \"s\"))\n## Units:  m / s\n## [1] 1 2 3 4 5 6\nx\
  \ + y\n## Error in Ops.units(x, y): Incompatible units\n```\n\n然而，当单位兼容时，我们便可以进行加减运算。\n\
  \n```\n(z <- units(1:6, \"m\"))\n## Units:  m / 1\n## [1] 1 2 3 4 5 6\nx + z\n##\
  \ Units:  m / 1\n## [1]  2  4  6  8 10 12\nx - z\n## Units:  m / 1\n## [1] 0 0 0\
  \ 0 0 0\n```\n\n乘法和除法始终是允许的，结果的单位由操作数推导得出。\n\n```\n2 * x\n## Units:  m / 1\n## [1]\
  \  2  4  6  8 10 12\nx * y\n## Units:  m*m / s\n## [1]  1  4  9 16 25 36\nx / y\n\
  ## Units:  m*s / m\n## [1] 1 1 1 1 1 1\n```\n\n"
- '# S4 类


  S3 类系统是面向对象编程的“蛮荒西部”。类的层次结构仅通过 `class` 属性隐式存在，任何类都可以任意实现或不实现泛型方法，而无需检查接口和类层次结构是否被正确设计。一切都依赖于约定俗成，完全依赖程序员来确保任何形式的系统一致性。


  S3 系统因其极其简单易用、易于编写新类而广受欢迎。在大多数情况下，我们追求简洁性而非复杂的设计，S3 在这些场景下完全能满足需求。当我们实现一个新的统计模型时，很少需要一个复杂的类层次结构。大多数抽象数据结构只有少数几个关联操作，在编写具体实现时，要记住并实现所有这些操作并不困难。然而，一旦软件复杂度达到一定程度，就需要更多的结构化支持。我们不希望设计仅仅存在于编程约定中，而是希望在代码中将其明确阐述。


  S4 系统提供了一个结构更严谨的面向对象系统。在此，类和类层次结构被显式创建；它们不仅仅是 `class` 属性中的一个字符串。为了获得 S4 所允许的额外结构，在创建类和方法时需要多写一点代码，但总的来说，该系统的工作方式与
  S3 非常相似。如果你熟悉 S3，那么学习 S4 应该没有问题。


  ## 定义 S4 类


  在 S4 中，类是显式创建的。要创建新类，我们使用 `methods` 包中的 `setClass` 函数。该函数接受参数来指定该类对象应具有的属性、属性的默认值、该类如何融入类层次结构，以及所创建类的许多其他属性。所有这些属性都有默认值，因此我们可以仅通过指定类名来创建一个新类。


  作为一个示例，我们考虑之前用 S3 实现的栈数据结构。要创建一个抽象栈类，我们可以这样写：


  ```

  library(methods)

  Stack <- setClass("Stack")

  ```


  这将创建一个名为 `"Stack"` 的新类。我们没有指定类的任何属性，因此 S4 会假设它是一个不应被实例化的抽象类，如果我们尝试实例化，将会出错。


  我们可以像这样创建基于向量的栈类：


  ```

  VectorStack <- setClass("VectorStack",

  slots = c(

  elements = "vector"

  ),

  contains = "Stack")

  ```


  这里我们向 `setClass` 传递了两个参数：`slots` 和 `contains`。`slots` 参数是该类对象应具有的属性列表。这里指定它应包含一个名为
  `elements` 的向量。`contains` 参数指定新类应继承哪些超类。我们将 `VectorStack` 设为 `Stack` 的子类。


  由于 `VectorStack` 具有槽，它不被视为抽象类（我们可以通过向 `contains` 参数添加 `"VIRTUAL"` 来显式使其成为抽象类，但我们确实希望能够实例化它）。我们可以通过调用
  `VectorStack` 来创建该类的对象。


  ```

  (vs <- VectorStack())

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## logical(0)

  ```


  我们可以将 `elements` 作为命名参数传递给 `VectorStack`。


  ```

  (vs <- VectorStack(elements = 1:4))

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## [1] 1 2 3 4

  ```


  位置参数在此不适用；必须是命名参数。


  一旦我们有了一个 `VectorStack` 类的对象，我们可以使用以下符号访问其元素：


  ```

  vs@elements

  ## [1] 1 2 3 4

  ```


  通常，`@` 用于访问 S4 对象的槽。


  捕获 `setClass` 的结果并将其用作构造对象的函数，是我创建 S4 构造函数时首选的方式，但严格来说，这并不是必需的。一旦使用 `setClass` 创建了一个类，你也可以直接使用类名和
  `new` 函数来创建对象。


  ```

  new("VectorStack", elements = 1:4)

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## [1] 1 2 3 4

  ```




  ## 通用函数


  在 S3 系统中，我们像创建普通函数一样创建通用函数，只不过它会调用 `UseMethod`。而在 S4 中，我们必须使用 `setGeneric` 函数显式定义通用函数。`setGeneric`
  的第一个参数是通用函数的名称。如果要将一个现有函数变为通用函数，只需以其名称调用 `setGeneric`，这将以该现有函数作为默认实现来创建通用函数。然而，通常情况下，我们使用
  `setGeneric` 来创建一个全新的通用函数，此时我们需要通过参数 `def` 提供函数的定义。这个函数扮演着 S3 中函数定义的角色：它应该简单地调用
  `standardGeneric` 函数，这是 S4 中与 `UseMethod` 对等的功能。


  我们可以像这样定义栈（stack）抽象数据结构的接口：


  ```

  setGeneric("top",

  def = function(stack) standardGeneric("top"))

  setGeneric("pop",

  def = function(stack) standardGeneric("pop"))

  setGeneric("push",

  def = function(stack, element) standardGeneric("push"))

  setGeneric("is_empty",

  def = function(stack) standardGeneric("is_empty"))

  ```


  为了提供通用函数的实现，我们使用函数 `setMethod`。我们需要提供通用函数的名称、方法的签名（即用于分派方法的类型），以及函数的定义。


  当调用通用函数时，具体的实现会根据传递给函数的参数的类型来选择。这就是我们所说的*动态分派*。在 S3 中，它基于单个参数（通常是第一个），但在 S4 中，我们可以基于更复杂的类型信息进行分派。为了获得与
  S3 类似的行为，我们只需提供一个仅包含类名的签名。这样，S4 就会根据传递给通用函数的第一个参数的类来选择给定的实现。


  我们可以这样实现向量栈（VectorStack）：


  ```

  setMethod("top", signature = "VectorStack",

  definition = function(stack) stack@elements[1])

  setMethod("pop", signature = "VectorStack",

  definition = function(stack) {

  VectorStack(elements = stack@elements[-1])

  })

  setMethod("push", signature = "VectorStack",

  definition = function(stack, element) {

  VectorStack(elements = c(element, stack@elements))

  })

  setMethod("is_empty", signature = "VectorStack",

  definition = function(stack) length(stack@elements) == 0)

  ```


  这些实现只是我们在 S3 实现中定义的函数的变体，并且我们可以像以前一样使用这个类。


  ```

  stack <- VectorStack()

  stack <- push(stack, 1)

  stack <- push(stack, 2)

  stack <- push(stack, 3)

  stack

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## [1] 3 2 1

  while (!is_empty(stack)) {

  stack <- pop(stack)

  }

  stack

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## numeric(0)

  ```


  ## 槽原型


  当你创建一个对象时，如果没有为槽（slot）提供值，你将得到默认值，通常是空向量或空列表。例如，如果我们创建一个表示自然数的类，我们可以这样写：


  ```

  NaturalNumber <- setClass("NaturalNumber",

  slots = c(

  n = "integer"

  ))

  ```


  如果我们实例化它时不提供参数，该对象将为其本应表示的自然数包含一个空向量。


  ```

  (n <- NaturalNumber())

  ## An object of class "NaturalNumber"

  ## Slot "n":

  ## integer(0)

  ```


  如果我们想要其他默认值，可以使用 `setClass` 的 `prototype` 参数。例如，我们可以声明默认的自然数是零。


  ```

  NaturalNumber <- setClass("NaturalNumber",

  slots = c(

  n = "integer"

  ),

  prototype = list(

  n = as.integer(0)

  ))

  ```


  现在，当我们创建一个对象时，它会从原型（prototype）中获取默认值。


  ```

  (n <- NaturalNumber())

  ## An object of class "NaturalNumber"

  ## Slot "n":

  ## [1] 0

  ```


  当然，这并不妨碍我们在创建对象时指定其他值作为参数。


  ```

  (n <- NaturalNumber(n = as.integer(1)))

  ## An object of class "NaturalNumber"

  ## Slot "n":

  ## [1] 1

  ```


  ## 对象有效性


  我们在指定槽时给出的类型，对对象施加了类型约束。当我们声明 `NaturalNumber` 中的 `n` 槽应为整数（integer）时，我们就限制了可以分配给该槽的值。如果我们尝试分配一个
  `numeric` 类型的值，将会得到一个错误。


  对于自然数，我们不想包含负整数，但由于负整数仍是整数，所以分配这样的值并没有约束。


  ```

  n@n <- as.integer(-1)

  ```


  我们可以通过 `setClass` 的 `validity` 参数对对象施加进一步的约束。这个参数应该是一个测试对象是否有效的函数。如果有效，它应该返回 `TRUE`。否则，应返回
  `FALSE`。


  ```

  NaturalNumber <- setClass("NaturalNumber",

  slots = c(

  n = "integer"

  ),

  prototype = list(

  n = as.integer(0)

  ),

  validity = function(object) {

  if (object@n < 0) {

  return("negative natural number")

  }

  return(TRUE)

  })

  ```


  有了这个有效性检查，尝试编写以下代码将导致错误：


  ```

  n <- NaturalNumber(n = as.integer(-1))

  ```


  然而，有效性测试只在创建对象时执行。我们可以修改对象并将其置于无效状态。


  ```

  n@n <- as.integer(-1)

  ```


  这种行为是必要的，因为在修改对象时，很可能在完成修改之前都处于无效状态。但是，当你在任何时候完成对象的修改后，都可以调用 `validObject` 函数再次检查有效性，使用方法如下：


  ```

  validObject(n)

  ```


  当然，在这种情况下会失败，因为我们刚刚将 `n` 留在了无效状态。




  ## 泛型函数与类层次结构


  要了解 S4 如何处理类层次结构和泛型函数，我们回到前面提到的 `A`、`B`、`C` 示例。我们可以像下面这样构造这些类和三个对象：


  ```

  A <- setClass("A", contains = "NULL")

  B <- setClass("B", contains = "A")

  C <- setClass("C", contains = "B")

  x <- A()

  y <- B()

  z <- C()

  ```


  这里我让 `A` 继承自伪类 `"NULL"`，使其成为非抽象类，这样即使它没有任何槽，我也可以实例化它。


  我们可以定义一个泛型函数 `f`，并且只针对类 `A` 实现它，像这样：


  ```

  setGeneric("f", def = function(x) standardGeneric("f"))

  setMethod("f", signature = "A",

  definition = function(x) print("A::f"))

  ```


  如果我们这样做，那么当我们在所有三个对象上调用它时，就会调用这个版本。


  ```

  f(x)

  ## [1] "A::f"

  f(y)

  ## [1] "A::f"

  f(z)

  ## [1] "A::f"

  ```


  如果我们定义另一个函数 `g`，并为 `A` 和 `B` 都实现它，那么在 `x` 上调用它将调用 `A` 版本。在 `y` 和 `z` 上调用它将调用 `B`
  版本，因为对于这两个类来说，这是该函数最特化的形式。


  ```

  setGeneric("g", def = function(x) standardGeneric("g"))

  setMethod("g", signature = "A",

  definition = function(x) print("A::g"))

  setMethod("g", signature = "B",

  definition = function(x) print("B::g"))

  g(x)

  ## [1] "A::g"

  g(y)

  ## [1] "B::g"

  g(z)

  ## [1] "B::g"

  ```


  如果我们定义一个函数，并为所有三个类都实现了它，那么在 `x`、`y` 和 `z` 上调用它时，在所有三种情况下都会调用最特化的版本。


  ```

  setGeneric("h", def = function(x) standardGeneric("h"))

  setMethod("h", signature = "A",

  definition = function(x) print("A::h"))

  setMethod("h", signature = "B",

  definition = function(x) print("B::h"))

  setMethod("h", signature = "C",

  definition = function(x) print("C::h"))

  h(x)

  ## [1] "A::h"

  h(y)

  ## [1] "B::h"

  h(z)

  ## [1] "C::h"

  ```


  S4 中 `NextMethod` 的对应物是 `callNextMethod`，其工作方式非常相似。


  ```

  setMethod("h", signature = "A",

  definition = function(x) {

  print("A::h")

  })

  setMethod("h", signature = "B",

  definition = function(x) {

  print("B::h")

  callNextMethod()

  })

  setMethod("h", signature = "C",

  definition = function(x) {

  print("C::h")

  callNextMethod()

  })

  h(x)

  ## [1] "A::h"

  h(y)

  ## [1] "B::h"

  ## [1] "A::h"

  h(z)

  ## [1] "C::h"

  ## [1] "B::h"

  ## [1] "A::h"

  ```


  不存在像 `.default` 这样的方法版本，但我们可以使用 `setGeneric` 函数来创建一个。如果我们定义一个普通的旧函数，并仅以其名称调用 `setGeneric`，那么该函数将成为当我们没有更特化版本时调用的默认函数。


  ```

  d <- function(x) print("default::d")

  setGeneric("d")

  d(x)

  ## [1] "default::d"

  d(y)

  ## [1] "default::d"

  d(z)

  ## [1] "default::d"

  ```


  当然，这在我们特化方法并使用 `callNextMethod` 时也同样有效。


  ```

  setMethod("d", signature = "A",

  definition = function(x) {

  print("A::d")

  callNextMethod()

  })

  setMethod("d", signature = "B",

  definition = function(x) {

  print("B::d")

  callNextMethod()

  })

  setMethod("d", signature = "C",

  definition = function(x) {

  print("C::d")

  callNextMethod()

  })

  d(x)

  ## [1] "A::d"

  ## [1] "default::d"

  d(y)

  ## [1] "B::d"

  ## [1] "A::d"

  ## [1] "default::d"

  d(z)

  ## [1] "C::d"

  ## [1] "B::d"

  ## [1] "A::d"

  ## [1] "default::d"

  ```


  ## 要求实现方法


  我们之前定义的抽象类 `Stack` 没有任何实际用途。它是一个没有任何关联数据或函数的抽象类。栈接口中的所有函数都在 `VectorStack` 中实现，我们从继承
  `Stack` 中并没有获得任何好处。然而，在 S4 中，我们可以形式化像栈这样的接口，并确保接口的实现实际上实现了接口中的所有函数。


  这其实作用不大。R 中的类型检查非常少，你也不会从 S4 得到太多帮助，但有一种方法至少可以在你调用一个尚未实现的泛型函数时，使错误信息更具参考性。


  让我们实现一个非功能性的栈。我们可以为基于列表的栈创建这个类。它继承自 `Stack`，但不添加任何槽或功能。


  ```

  ListStack <- setClass("ListStack", contains = "Stack")

  ```


  即使没有实现，我们也可以创建一个 `ListStack` 类型的对象。`Stack` 类是抽象的，因为我们没有给它添加任何槽，但 `ListStack` 不会被视为抽象类，即使它也没有添加任何槽，因为它
  `contains` 一个超类。然而，如果我们在 `ListStack` 上调用 `pop`，我们会得到一个错误，这是正确的。我们期望在这里得到一个错误，在这种情况下，从错误信息中很可能不难弄清楚问题所在。错误会告诉我们
  R 无法找到该函数的继承方法。但是，如果 `Stack` 实现了 `pop` 的版本，或者我们设置了默认函数，那么我们反而会调用那个版本，这虽然是一个错误，但可能不会抛出错误信息。


  我们可以使用 `requireMethods` 函数来指定 `Stack` 的所有子类必须实现栈接口：


  ```

  requireMethods(functions = c("top", "pop", "push", "is_empty"),

  signature = "Stack")

  ```


  通过这样做，我们确保在 `ListStack` 上调用这些方法中的任何一个时，都会得到错误信息。


  ```

  pop(stack)

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## numeric(0)

  ```


  这对于确保接口正确实现来说，并不是一个很强大的安全检查，我通常认为它的用处不大，但如果你需要，它就在那里。


  ## 构造函数


  在创建对象时，你可以通过提供命名参数来为槽赋值，但你也可以通过 `initialize` 方法获得对对象初始化的更多控制。这个方法充当构造函数的角色，只是它不创建对象；它只负责设置属性，使对象处于一致状态。如果你定义了这个函数，它将替换默认的构造函数，你将负责决定构造函数应该接受哪些参数、如何设置槽以及是否应该调用其超类的构造函数。


  下面展示了一个非常简单的示例，其中我们有一个超类和一个子类：


  ```

  A <- setClass("A", slots = list(x = "numeric", y = "numeric"))

  B <- setClass("B", contains = "A", slots = list(z = "numeric"))

  setMethod("initialize", signature = "A",

  definition = function(.Object, x, y) {

  print("A initialize")

  .Object@x <- x

  .Object@y <- y

  .Object

  })

  ## [1] "initialize"

  setMethod("initialize", signature = "B",

  definition = function(.Object, z) {

  .Object <- callNextMethod(.Object, x = z, y = z)

  .Object@z <- z

  .Object

  })

  ## [1] "initialize"

  (a <- A(x = 1:3, y = 4:6))

  ## [1] "A initialize"

  ## An object of class "A"

  ## Slot "x":

  ## [1] 1 2 3

  ##

  ## Slot "y":

  ## [1] 4 5 6

  (b <- B(z = 6:9))

  ## [1] "A initialize"

  ## An object of class "B"

  ## Slot "z":

  ## [1] 6 7 8 9

  ##

  ## Slot "x":

  ## [1] 6 7 8 9

  ##

  ## Slot "y":

  ## [1] 6 7 8 9

  ```




  ## 基于类型签名的分派


  到目前为止，我们在定义特定方法时使用的签名仅包含类名。如果我们以这种方式使用它们，S4 方法的工作方式与 S3 泛型函数相同，但 S4 方法的分派机制更为通用，可以根据函数所有参数的类型进行分派。


  例如，我们可以定义一个双参数函数 `f`，并根据两个参数的类型以不同方式进行细化。比如，当参数为数值型时使用一个版本，当参数为逻辑型时使用另一个版本。


  ```

  setGeneric("f", def = function(x, y) standardGeneric("f"))

  setMethod("f", signature = c("numeric", "numeric"),

  definition = function(x, y) x + y)

  setMethod("f", signature = c("logical", "logical"),

  definition = function(x, y) x & y)

  ```


  当调用 `f` 时，系统会根据参数类型选择合适的函数。


  ```

  f(2, 3)

  ## [1] 5

  f(TRUE, FALSE)

  ## [1] FALSE

  ```


  类型匹配遵循从最具体到最抽象的原则，对于类来说遵循类的层次结构，对于数值则按整数 > 数值型 > 复数型的优先级进行匹配。因此，如果我们定义一个 `f` 版本，使其第一个值匹配整数类型，那么当提供整数参数时就会调用该版本，而使用
  `numeric` 值调用时则使用上面定义的版本。


  ```

  setMethod("f", signature = c("integer", "complex"),

  definition = function(x, y) x - y)

  f(2, 2)

  ## [1] 4

  f(as.integer(2), 2)

  ## [1] 4

  ```


  在这里，第二个参数会匹配任何复数，但我们可以将其特化以匹配整数和数值型：


  ```

  setMethod("f", signature = c("integer", "numeric"),

  definition = function(x, y) 2*x + y)

  f(as.integer(2), 2)

  ## [1] 6

  ```


  如果我们像之前在类的情况下那样，只给签名一个字符串，那么它只根据第一个参数的类型进行分派。


  ```

  setMethod("f", signature = "character",

  definition = function(x, y) x)

  f("foo", "bar")

  ## [1] "foo"

  ```


  通常，如果没有为所有参数提供类型，签名列表仅匹配参数前缀的类型。


  ```

  setGeneric("g", def = function(x, y, z) standardGeneric("g"))

  setMethod("g", signature = "character",

  definition = function(x, y, z) "g(character)")

  setMethod("g", signature = c("numeric", "character"),

  definition = function(x, y, z) "g(numeric, character)")

  g("foo", NA, NA)

  ## [1] "g(character)"

  g(12, "bar", NA)

  ## [1] "g(numeric, character)"

  ```


  如果你想匹配任何类型，可以使用类型 `"ANY"`。


  ```

  setMethod("f", signature = "ANY",

  definition = function(x, y) "any")

  f(list(), NULL)

  ## [1] "any"

  ```


  这可以用来定义一个通用的默认实现，当没有更具体的实现匹配参数时使用。


  你甚至可以使用类型 `"missing"` 来匹配某些参数未提供的情况。


  ```

  setMethod("f", signature = c("ANY", "missing"),

  definition = function(x, y) "missing")

  f(list(), NULL)

  ## [1] "any"

  f(list())

  ## [1] "missing"

  ```


  在这里，第一个调用匹配了接受任意参数的版本，因为第二个参数并未缺失，它只是 `NULL`；而另一个调用则匹配了第二个参数缺失的、更具体的签名。


  ## 运算符重载


  S4 也支持运算符重载，其方式与 S3 非常相似，只是使用泛型方法的分派机制。我们可以尝试将模数类实现为一个 S4 类，如下所示：


  ```

  modulus <- setClass("modulus",

  slots = c(

  value = "numeric",

  n = "numeric"

  ))

  setMethod("show", signature = "modulus",

  definition = function(object) {

  cat("Modulus", object@n, "values:\n")

  print(object@value)

  })

  (x <- modulus(value = 1:6, n = 3))

  ## Modulus 3 values:

  ## [1] 1 2 3 4 5 6

  ```


  我们在这里实现的 `show` 方法等同于 S3 中的 `print` 方法，我们用它来漂亮地打印 `modulus` 对象。


  如果我们想实现单个运算符，可以像处理 S3 泛型函数那样，为其定义特定方法。但是我们可以利用签名类型匹配来捕获参数的不同组合，而不必像在 S3 中那样在泛型函数的开头编写类型检查代码。


  下面我们处理模数运算所需的三种情况：两个操作数都是 `modulus` 对象，以及其中一个操作数是 `modulus` 对象而另一个是 `numeric` 的两种情况。


  ```

  setMethod("+", signature = c("modulus", "modulus"),

  definition = function(e1, e2) {

  if (e1@n != e2@n) stop("Incompatible modulus")

  modulus(value = e1@value + e2@value,

  n = e1@n)

  })

  setMethod("+", signature = c("modulus", "numeric"),

  definition = function(e1, e2) {

  modulus(value = e1@value + e2,

  n = e1@n)

  })

  setMethod("+", signature = c("numeric", "modulus"),

  definition = function(e1, e2) {

  modulus(value = e1 + e2@value,

  n = e2@n)

  })

  ```


  现在，我们可以在加法运算中组合 `numeric` 和 `modulus` 类型，并且无需在函数中显式检查类型，因为类型分派机制已经为我们处理了。


  ```

  x + 1:6

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  1:6 + x

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  ```


  我们还处理了两个 `modulus` 对象的情况，并检查它们的 `n` 槽是否相等。


  ```

  y <- modulus(value = 1:6, n = 2)

  x + y

  ## Error in x + y: Incompatible modulus

  y <- modulus(value = 1:6, n = 3)

  x + y

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  ```


  S4 中也有函数组解决方案，为了定义算术运算，我们需要 `Arith` 组。其工作方式与 S3 中的 `Ops` 泛型函数非常相似，只是我们再次可以使用类型匹配，而不是在函数内部显式检查参数类型。


  ```

  setMethod("Arith",

  signature = c("modulus", "modulus"),

  definition = function(e1, e2) {

  if (e1@n != e2@n) stop("Incompatible modulus")

  modulus(value = callGeneric(e1@value, e2@value),

  n = e1@n)

  })

  setMethod("Arith",

  signature = c("modulus", "numeric"),

  definition = function(e1, e2) {

  modulus(value = callGeneric(e1@value, e2),

  n = e1@n)

  })

  setMethod("Arith",

  signature = c("numeric", "modulus"),

  definition = function(e1, e2) {

  modulus(value = callGeneric(e1, e2@value),

  n = e2@n)

  })

  x * y

  ## Modulus 3 values:

  ## [1]  1  4  9 16 25 36

  2 * x

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  ```




  '
- '# 结合 S3 与 S4 类系统


  你可以在一定程度上结合使用 S3 和 S4 类系统。这两种系统不同，我**不推荐**尝试编写将 S3 和 S4 类层次结构紧密连接起来的软件。那样只会导致徒增烦恼与无尽调试。但如果你已有
  S3 代码，并希望用 S4 编写扩展，这是可以做到的。


  假设我们有一个 S3 类 `X`，它拥有泛型函数 `foo` 和 `bar`。


  ```

  X <- function(x) {

  structure(list(x = x), class = "X")

  }

  foo <- function(x) UseMethod("foo")

  bar <- function(x) UseMethod("bar")

  foo.X <- function(x) "foo"

  bar.X <- function(x) x$x

  x <- X(5)

  foo(x)

  ## [1] "foo"

  bar(x)

  ## [1] 5

  ```


  如果我们想编写 `X` 的一个子类，称之为 `Y`，并且希望用 S4 来编写 `Y`，我们不能在 `setClass` 的 `contains` 选项中直接使用
  `X`。虽然语法上可以，但当你尝试实例化该类的对象时会出错。S4 系统不知道任何名为 `X` 的类，因此我们首先需要让它识别。我们可以使用 `setOldClass`
  函数来实现。


  ```

  setOldClass("X")

  ```


  这有两个作用：它让 S4 知道这个类的存在，以便我们可以继承它；同时，它使得为该类定义的任何泛型函数都能被我们通过 `setMethod` 来特化。因此，调用
  `setOldClass` 后，我们就可以将 `X` 的一个子类定义为 S4 类。


  ```

  Y <- setClass("Y", contains = "X")

  ```


  在 `Y` 类型的对象上调用 `foo` 或 `bar` 同样会通过动态分派系统工作，由于没有更匹配的 `foo.Y` 函数，会调用 `foo.X`。


  ```

  y <- Y()

  foo(y)

  ## [1] "foo"

  ```


  如果我们愿意，可以通过实现 `foo.Y` 来为 `Y` 对象创建特化版本的 `foo`。


  ```

  foo.Y <- function(x) "Y::foo"

  foo(y)

  ## [1] "Y::foo"

  ```


  当然，这属于 S3 中特化泛型函数的方式，既然我们现在处理的是 S4 类，最好使用 `setMethod`。


  与 `foo` 类似，调用 `bar` 会触发 `bar.X`。但在这里会导致错误，因为即使 S4 知道 `X` 类，它也不知道该类的构造函数或所创建的 `X`
  对象的内部表示。


  ```

  bar(y)

  ## Error in x$x: $ operator not defined for this S4 class

  ```


  在 S3 中没有构造函数或对象表示的形式化定义，只有非正式的编码约定，所以 S4 无法知道 `bar` 函数期望从 `X` 对象中获取什么。S3 和 S4 的自动集成程度是有限的，需要一些编码工作才能使
  S3 版本的功能也适用于 S4 类。


  ```

  Y <- setClass("Y", contains = "X", slots = c(x = "ANY"))

  setMethod("bar", signature = "Y",

  definition = function(x) x@x)

  y <- Y(x = 13)

  bar(y)

  ## [1] 13

  ```


  我**不建议**混合使用 S3 和 S4。如果你已有使用 S3 系统编写的代码，继续坚持使用 S3 可能比尝试结合两个系统更好。但是，如果你正在使用 S4 编写代码，并且需要引入一些
  S3 类的功能，上述方法是可行的。


  ## R6 类系统


  我们要看的最后一个对象系统是 R6 系统。这个系统与 S3 和 S4 非常不同，对于 R 语言整体而言也很不寻常，因为它引入了**可变数据**。在 R 中，数据通常是不可变的，任何看似修改对象的操作实际上都是通过复制数据和构造新对象来实现的。在
  R 中唯一能修改的东西是环境；你不能修改数据。然而，R6 系统使用环境来提供给我们可以修改的对象。这在 R 中是不寻常的，但其语义却与大多数其他语言中实现面向对象的方式相似，即方法修改对象而非创建新对象。如果你从其他编程语言转到
  R，R6 系统可能让你感到更熟悉；但由于它给 R 带来了副作用，如果你更熟悉 R 的传统特性，它可能会让你感到意外。如果你有两个指向同一个 R6 对象的引用，并通过其中一个变量修改了它，另一个变量所指对象的状态也会随之改变。这在另外两个类系统中是不会发生的。


  R6 系统是对这种语义的更好实现，相较于内置的引用类系统（RC），后者也称为 R5。在来自 S 语言的 S3 和 S4 对象系统之后，R5 本是 R 中实现的下一个对象系统的自然名称。因为
  R6 与 R5 具有相同的语义，并且被认为是其更好的实现，我将不再进一步讨论 R5。




  ## 定义类


  类的定义需要使用 `R6` 包中的 `R6Class` 函数。与 S4 的 `setClass` 类似，我们需要为类指定一个名称，并且有多个可选参数用于定义该类的对象应具有的外观和行为。与
  S4 不同的是，我们需要保存调用 `R6Class` 的返回值，以便用它来创建该类的对象。在 S4 中这只是一种约定，但只要我们知道类的名称就可以创建对象。而在
  R6 中，类名主要用于设置 `class` 属性，以便对象可以与 S3 多态交互。我们用来创建对象的是 `R6Class` 的返回值。


  例如，我们再次实现一个栈。这次我将不麻烦地创建一个抽象超类，而是直接实现一个 `VectorStack`。一种实现可能如下所示：


  ```

  library(R6)

  VectorStack <- R6Class("VectorStack",

  private = list(elements = NULL),

  public = list(

  top = function() {

  private$elements[1]

  },

  pop = function() {

  private$elements <-

  private$elements[-1]

  invisible(self)

  },

  push = function(e) {

  private$elements <-

  c(e, private$elements)

  invisible(self)

  },

  is_empty = function() {

  length(private$elements) == 0

  }

  ))

  ```


  在这里，除了类名，我们向 `R6Class` 传入了两个参数：`private` 和 `public`。这两个参数用于定义类的属性，无论是存储在对象中的值还是可以在对象上调用的方法。对于两者，参数都是列表。列表元素的名称成为属性的名称，而其值——理所当然地——成为属性的值。


  这两个参数的区别在于，`public` 列表中的属性可以在任何地方访问，而 `private` 列表中的属性只能在为该类定义的方法中访问。在方法中，你可以使用变量
  `self` 访问 `public` 列表中的元素，并使用变量 `private` 访问 `private` 列表中的属性。在这个 `VectorStack`
  实现中，我们将用于存储栈的向量设为私有，并将栈接口实现为公共方法。在方法内部，我们通过 `private$elements` 访问元素，在 `push` 和 `pop`
  方法中，我们使用变量 `self` 返回对象本身。我们将对象包裹在 `invisible` 中返回，这样在调用这些方法时它不会自动打印出来，但我们并非必须这样做。我们甚至根本不必为这些方法返回对象，但这样做允许我们链式调用方法，正如我们将在下面看到的，因此这是一个好的实践。


  请注意，`self` 和 `private` 对象并不是方法的参数。它们只是作为 R6 用于实现其可变对象语义的一部分魔法，存在于函数的命名空间中。


  我们通过这种方式创建的 `VectorStack` 对象本身并不是构造函数，这与 S4 不同。它是一个所谓的对象生成器。要创建一个对象，我们使用这个生成器的 `new`
  属性，如下所示：


  ```

  (stack <- VectorStack$new())

  ## <VectorStack>

  ##   Public:

  ##     clone: function (deep = FALSE)

  ##     is_empty: function ()

  ##     pop: function ()

  ##     push: function (e)

  ##     top: function ()

  ##   Private:

  ##     elements: NULL

  ```


  打印这个对象相当冗长，但如果我们为类定义 `print` 方法，就可以修改它的显示方式。


  ```

  VectorStack <- R6Class("VectorStack",

  private = list(elements = NULL),

  public = list(

  # ... 其余的方法

  print = function() {

  cat("Stack elements:\n")

  print(private$elements)

  }

  ))

  ```


  这不会修改现有对象。


  ```

  stack

  ## <VectorStack>

  ##   Public:

  ##     clone: function (deep = FALSE)

  ##     is_empty: function ()

  ##     pop: function ()

  ##     push: function (e)

  ##     top: function ()

  ##   Private:

  ##     elements: NULL

  ```


  但是，如果我们创建一个新对象，它就会生效。


  ```

  (stack <- VectorStack$new())

  ## Stack elements:

  ## NULL

  ```


  我们可以使用 `$` 索引访问栈对象的（公共）属性，如果属性是函数，则可以调用方法：


  ```

  stack$push(1)$push(2)$push(3)

  stack

  ## Stack elements:

  ## [1] 3 2 1

  while (!stack$is_empty()) stack$pop()

  stack

  ## Stack elements:

  ## numeric(0)

  ```


  这里之所以能够链式调用 `push`，是因为 `push` 方法返回了对象本身。与之前返回新对象的实现不同，对于 R6 对象，修改的是现有对象。我们不需要将三次
  `push` 调用的结果重新赋值给 `stack`，也不需要将 `pop` 的调用结果重新赋值给 `stack`。在这些函数中返回对象本身允许我们链式调用方法，但仅此而已。R6
  对象不是不可变的。


  ## 对象初始化


  如果我们想在构造对象时设置其属性，需要做的工作比在 S4 中稍多一些。我们不能仅仅在构造函数中使用命名参数；这样的调用会给我们一个错误：


  ```

  stack <- VectorStack$new(elements = 1:4)

  ```


  为了能够以这种方式初始化对象，我们需要显式地为其编写一个函数。这个函数必须是一个名为 `initialize` 的 `public` 方法。如果你希望构造函数接受参数，则必须在此函数中指定参数。你不能将此函数设为
  `private`；将一个名为 `initialize` 的函数放在 `private` 列表中是一个错误。


  要用一系列元素初始化 `VectorStack` 对象，我们可以像这样实现它的 `initialize` 函数：


  ```

  VectorStack <- R6Class("VectorStack",

  private = list(elements = NULL),

  public = list(

  initialize = function(elements = NULL) {

  private$elements <- elements

  },

  # ... 其余的方法

  ))

  ```


  有了这个初始化函数，我们现在就可以用已初始化的 `elements` 构造对象了。


  ```

  (stack <- VectorStack$new(elements = 1:4))

  ## Stack elements:

  ## [1] 1 2 3 4

  ```




  '
- "# 私有与公共属性\n\n栈中的元素是私有的，因此我们无法像访问公共方法那样访问它们。你可能希望`stack$elements`会报错，但遗憾的是并非如此。\n\
  \n```\nstack$elements\n## NULL\n```\n\n这是因为访问一个不包含某个键的列表会返回`NULL`，你看到的行为正是如此。\n\n\
  ```\nlist()$elements\n## NULL\n```\n\n通过这个小例子，我们可以看到私有与公共属性之间的区别：\n\n```\nA <- R6Class(\"\
  A\", public = list(x = 5), private = list(y = 13))\n```\n\n根据类`A`的这个定义，我们应该能够访问对象的`x`属性，事实也确实如此。\n\
  \n```\na <- A$new()\na$x\n## [1] 5\na$x <- 7\na$x\n## [1] 7\n```\n\n我们也可以获取`y`，但它的行为与我们上面看到的栈的行为一致，并且我们不允许修改它，因为它并非对象真正的属性。\n\
  \n```\na$y\n## NULL\na$y <- 12\n## Error in a$y <- 12: cannot add bindings to a\
  \ locked environment\na$y\n## NULL\n```\n\n通常，你不能像在 S3 中那样，仅仅通过为`$`索引赋值来为 R6 对象创建新属性。属性必须在类定义中定义。如果你尝试类似下面的操作，将会收到错误：\n\
  \n```\na$z <- \"foo\"\n```\n\n你可以修改公共的数据属性，正如我们上面对于`x`所做的，但请不要自作聪明地尝试修改方法。首先，为单个对象更改方法本身就是非常糟糕的做法，但幸运的是，这在\
  \ R6 中也是“被禁止的”，如果你尝试，同样会收到错误。\n\n通常，将数据保持为私有，而将属于类接口一部分的方法设为公共，被认为是良好的实践。这有几个原因：如果数据只能通过类的方法进行修改，那么你对对象的状态就有更多的控制权，可以确保在所有方法调用前后对象始终处于有效状态；但（或许更重要的是）隐藏对象的内部表示，可以限制类与使用该类的代码之间的依赖关系。如果任何代码都能访问对象的内部运作，那么很可能最终会有大量代码这样做。这意味着，如果你改变了类的对象的表示方式，就必须修改所有使用该类的代码。另一方面，如果代码仅通过公共接口访问对象，那么只要你保持公共接口不变，就可以随心所欲地修改所有私有属性。当然，你可能需要修改类的一些方法，但改动范围将仅限于此。\n\
  \n在 R6 系统中，私有属性只能由你为该类定义的方法或子类中定义的方法访问。如果你熟悉 C++ 或 Java 等语言，这可能会让你惊讶，但 R6 中的私有属性更类似于那些语言中的*受保护*属性，而非*私有*属性。\n\
  \n## 活动绑定\n\n有一种方法可以获得访问数据属性的语法，而无需实际这样做。如果你的代码已经使用了公共属性，而你又想将其改为函数以隐藏或修改实现细节，你可以利用这一点。如果你只是更喜欢数据的语法而非方法调用，也可以使用它。\n\
  \n这是通过 `R6Class` 的 `active` 参数实现的。在这里，你可以提供一个属性列表，就像 `private` 和 `public` 一样，但这些属性应该是函数，它们将定义一个类似值调用的语法来调用这些函数。\n\
  \n举个例子，我们可以拿向量栈中的元素为例。我们希望可以写 `stack$elements`，但又不希望将元素设为公共。因此，我们为 `elements` 写一个函数，并将其添加到\
  \ `active` 中。同一个名称不能同时出现在 `private` 和 `active`（或 `public`）中，所以我们首先必须更改私有数据属性的名称，当然还要更新所有现有的方法。完成这些之后，我们可以像这样添加\
  \ `active` 函数：\n\n```\nVectorStack <- R6Class(\"VectorStack\",\nprivate = list(elements_\
  \ = NULL),\npublic = list(\n# ... 方法\n),\nactive = list(\nelements = function(value)\
  \ {\nif (!missing(value))\nstop(\"elements are read-only\")\nprivate$elements_\n\
  }\n))\n```\n\n`active` 列表中的函数应该接受一个参数 `value`。当我们读取属性时，这个值将是缺失的；当我们给属性赋值时，它将包含数据。在这个实现中，我们认为给元素赋值是一个错误，当读取属性时，我们返回私有的\
  \ `elements_`。\n\n这将为我们提供元素：\n\n```\nstack <- VectorStack$new(elements = 1:4)\n\
  stack$elements\n## [1] 1 2 3 4\n```\n\n同时，这将引发一个错误：\n\n```\nstack$elements <- rev(1:3)\n\
  ## Error in (function (value) : elements are read-only\n```\n\n你可以使用这些 `active`\
  \ 函数来修改你赋的值，无论是为了保证对象的一致性，还是为了模拟一个并非直接存储，而是可以从其他数据计算得出的“虚拟”属性。这一切都取决于你选择如何使用它们。\n\
  \n## 继承\n\n我们指定类层次结构的方式，以及方法调用被派发到最具体方法实现的方式，相对比较直接。我们可以拿之前见过两次的三个类为例，在 R6 中实现它。要指定一个类继承自另一个类，我们使用\
  \ `R6Class` 的 `inherit` 参数；而要编写一个方法的更特化版本，我们只需将方法添加到 `public` 或 `private` 列表中。总体而言，与\
  \ S3 和 S4 相比，在 R6 中编写方法和类层次结构的代码要简单得多。\n\n```\nA <- R6Class(\"A\",\npublic = list(\n\
  f = function() print(\"A::f\"),\ng = function() print(\"A::g\"),\nh = function()\
  \ print(\"A::h\")\n))\nB <- R6Class(\"B\", inherit = A,\npublic = list(\ng = function()\
  \ print(\"B::g\"),\nh = function() print(\"B::h\")\n))\nC <- R6Class(\"C\", inherit\
  \ = B,\npublic = list(\nh = function() print(\"C::h\")\n))\n```\n\n实例化这些类的对象的方式并无意外；我们必须使用对象生成器中的\
  \ `new` 方法。\n\n```\nx <- A$new()\ny <- B$new()\nz <- C$new()\n```\n\n对于方法 `f`，我们只有类\
  \ `A` 的实现，因此在所有三个对象上调用 `f` 都将调用该版本。除了方法调用的语法与 S3 和 S4 的实现不同之外，这里没有意外。\n\n```\nx$f()\n\
  ## [1] \"A::f\"\ny$f()\n## [1] \"A::f\"\nz$f()\n## [1] \"A::f\"\n```\n\n对于 `g`，我们在\
  \ `A` 和 `B` 中都有实现，`C` 对象将调用 `B` 的实现，因为这是该类最具体的版本。\n\n```\nx$g()\n## [1] \"A::g\"\
  \ny$g()\n## [1] \"B::g\"\nz$g()\n## [1] \"B::g\"\n```\n\n最后，对于 `h`，我们在三个类中都有实现，因此我们为三个对象调用了不同的方法。\n\
  \n```\nx$h()\n## [1] \"A::h\"\ny$h()\n## [1] \"B::h\"\nz$h()\n## [1] \"C::h\"\n\
  ```\n\n关于 R6 中继承和方法派发的工作原理，不应该有任何意外之处。\n\n\n\n## S3 系统与运算符重载的交互\n\n虽然我们无法为 R6 对象定义新的运算符，但可以利用\
  \ S3 系统来实现这一目标。从 R6 对象生成器创建的对象会被赋予一个`class`属性——这是一个列表，包含我们创建生成器时为类指定的名称，以及`\"R6\"\
  `——因此我们可以为它们定义泛型函数的特化方法。\n\n我们可以用 R6 这样实现`modulus`类：\n\n```\nmodulus <- R6Class(\"\
  modulus\",\n  private = list(\n    value_ = c(),\n    n_ = c()\n  ),\n  public =\
  \ list(\n    initialize = function(value, n) {\n      private$value_ <- value\n\
  \      private$n_ <- n\n    },\n    print = function() {\n      cat(\"Modulus\"\
  , private$n_, \"values:\\n\")\n      print(private$value_)\n    }\n  ),\n  active\
  \ = list(\n    value = function(value) {\n      if (missing(value)) private$value_\n\
  \      else private$value_ <- value %% private$n_\n    },\n    n = function(value)\
  \ {\n      if (!missing(value)) stop(\"Cannot change n\")\n      private$n_\n  \
  \  }\n  )\n)\n(x <- modulus$new(value = 1:6, n = 3))\n## Modulus 3 values:\n## [1]\
  \ 1 2 3 4 5 6\n```\n\n在这个类定义中有几点需要注意。我们在`private`列表中定义了用于保存数据的属性，定义了一个初始化函数和一个打印函数，然后定义了两个`active`属性用于访问数据。我们允许该类的使用者修改`value`，但不允许修改`n`（这没有特别的理由，只是为了展示两种不同的行为示例），并且对于`value`属性，我们确保在将数据存储到私有变量`value_`之前对其进行修改。\n\
  \n此类对象的`class`属性包含以下内容：\n\n```\nclass(x)\n## [1] \"modulus\" \"R6\"\n```\n\n这意味着我们可以像这样使用\
  \ S3 系统为该类定义算术运算：\n\n```\nOps.modulus <- function(e1, e2) {\n  nx <- ny <- NULL\n\
  \  if (inherits(e1, \"modulus\")) nx <- e1$n\n  if (inherits(e2, \"modulus\")) ny\
  \ <- e2$n\n  if (!is.null(nx) && !is.null(ny) && nx != ny)\n    stop(\"Incompatible\
  \ types\")\n  n <- ifelse(!is.null(nx), nx, ny)\n  v1 <- e1\n  v2 <- e2\n  if (inherits(e1,\
  \ \"modulus\")) v1 <- e1$value\n  if (inherits(e2, \"modulus\")) v2 <- e2$value\n\
  \  e1 <- v1 ; e2 <- v2\n  result <- NextMethod() %% n\n  modulus$new(result, n)\n\
  }\n```\n\n其实现与 S3 版本略有不同，因为对象中的数据表示方式不同，但总体的控制流程是相同的。通过这个定义，我们就实现了模运算：\n\n```\n\
  x + 1:6\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus 3 values:\n\
  ## [1] 2 1 0 2 1 0\n2 * x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n```\n\n如果你基于一个\
  \ R6 类（如`modulus`）创建子类，你得到的`class`属性也会反映这一点，因此 S3 的派发机制在 R6 系统中对于子类也同样有效：\n\n```\n\
  modulus2 <- R6Class(\"modulus2\", inherit = modulus)\ny <- modulus2$new(value =\
  \ 1:2, n = 3)\nclass(y)\n## [1] \"modulus2\" \"modulus\"  \"R6\"\nx + y\n## Modulus\
  \ 3 values:\n## [1] 2 1 1 0 0 2\n```\n\n话虽如此，也不要过于疯狂地将 R6 和 S3 组合使用；这只会让你的代码维护者（很可能包括未来的你自己）感到困惑。\n\
  \n## 结论\n\n关于 R 语言面向对象编程的这本书到此就结束了。你现在已经了解了 R 中三种不同的面向对象编程系统，以及如何使用它们来定义类层次结构和多态函数。\n\
  \n至少在 S3 和 S4 系统中，R 的面向对象编程与大多数其他面向对象编程语言有所不同。大多数语言认为对象是可变的，大多数面向对象的软件设计都涉及将对象相互引用关联起来，使得它们的行为依赖于其他对象不断变化的状态。R6\
  \ 系统更接近这种类型的语言设计。然而，S3 和 S4 系统结合了两种强大的编程语言范式：函数式编程和面向对象编程。基于参数类型的动态函数派发与高阶函数式编程的结合，使你能够构建灵活且可扩展的软件。\n\
  \n在同一门语言中存在三种截然不同的面向对象编程系统可能会让人困惑，我建议你在任何一个单独的项目中坚持使用一种。然而，了解所有三种系统，并了解使用它们的优缺点，能让你为任何特定的工作选择正确的工具。S3\
  \ 系统是三者中最简单的，适用于在短时间内快速搭建和运行小型模型。S4 更正式的类结构使得组织更复杂的框架更容易，而 R6 的引用语义则使得实现传统的可变数据结构比在\
  \ R 中通常能轻易实现的方式更简单。\n\n当然，熟悉这些系统需要实践，仅仅阅读本书并不能让你成为面向对象编程的专家。但你现在掌握的知识已足够让你开始实践了。\n\
