- '# 引言


  欢迎阅读《R 语言面向对象编程》。我编写这本书是为了提供超越大多数 R 语言教科书典型入门水平的教学材料。本书旨在介绍 R 中的对象和类，以及如何在 R 中进行面向对象编程。面向对象编程基于对象的概念，并以对象可执行的操作以及对象之间如何通信来设计程序。


  这通常被理解为具有状态的对象，对对象的操作会改变对象状态。以银行账户这类对象为例，其状态是账户余额，存入或取出资金会改变其状态。我们对对象执行的操作在文献中常被称为"方法"，但在某些编程语言中，其概念模型是对象之间相互通信并发送消息，而你对对象执行的操作就是它对接收到的消息的响应方式。


  在 R 中，数据是不可变的，因此你不会编写改变对象状态的代码。相反，你将对象视为值来处理，当需要新的"状态"时，对对象的操作会创建新对象。R 中的对象和类更像是抽象数据结构。你拥有值以及可以对这些值执行的相关操作。这类抽象数据结构在不同编程语言中以不同方式实现。大多数面向对象语言使用类和类层次结构来实现它们，而许多函数式语言则通过某种类型规范来定义哪些函数可以应用于对象。


  类型决定了你能对对象做什么。例如，你可以对数字进行加法运算，对字符串进行拼接操作，但你实际上不能对字符串做加法，也不能对数字做拼接。在某些编程语言（即所谓的静态类型语言）中，你将类型与变量关联，这限制了变量可以引用的对象，并在代码运行前实现某些一致性检查。在这类语言中，你可以通过定义可执行的操作来指定新类型，然后需要为引用这些类型的变量添加类型规范。其他编程语言（称为动态类型语言）则不将类型与变量关联，而是允许它们引用任何类型的对象。R
  是动态类型的，因此你不会通过类型规范来指定抽象数据类型。你能对对象执行的操作仅由你可以对对象调用的函数决定。你仍然可以将这些视为抽象数据结构的规范；然而，它们只是隐式定义的。


  抽象数据结构可以通过不同方式实现，这正是其抽象性的体现，而将实现与接口分离的方式是通过多态或泛型函数，这是一种基于面向对象编程的构造。泛型函数通过类机制实现，这也源自面向对象编程。类所实现的函数决定了该类中对象的接口，通过构建类的层次结构，你可以在类之间共享通用函数的实现。


  抽象数据结构在算法编程中常用于实现高效的代码，但这种编程通常并非 R 程序的目标。在 R 中，我们更关注将数据拟合到模型等操作，这通常不需要算法数据结构。然而，拟合模型也是我在本书中所用术语意义上的抽象数据结构示例。模型具有抽象接口，允许我们绘制拟合模型、为新数据预测新的响应变量等，我们可以对这类操作使用相同的泛型函数。不同模型实现了各自版本的泛型函数，因此你可以编写通用代码，例如使其能在线性模型、决策树或神经网络上工作。


  面向对象编程最初并未内置在 R 语言中，而是后来添加的，不幸的是，添加了不止一种面向对象系统。实际上，在 R 中有三种不同的方式来实现面向对象构造，各有优缺点，而且这三种系统无法很好地协同工作。我将在本书中涵盖所有三种系统（S3、S4
  和 R6），但重点放在 S3 系统上，它是所谓的"tidyverse"（包括诸如`tidyr`、`dplyr`、`ggplot2`等包）的基础，这些包如今构成了大多数数据分析流水线的基础。


  在开发自己的软件时，我强烈建议你坚持使用一种面向对象系统，而不是混合使用它们，但选择哪一种则取决于个人偏好以及你的代码打算与哪些其他包协同工作。




  '
- '# 我读过的多数关于面向对象编程的书籍和课程，都聚焦于面向对象建模与软件设计。其核心在于如何利用面向对象思想来构建你对软件的思考方式，以及软件如何反映你在其中试图建模的现实世界中的物理或概念方面。例如，如果你要实现一个处理会计的软件，你会将账户建模为具有存取款操作的对象。你会尽可能地将问题域中的概念直接映射到软件中。这是一种强大的软件设计方法，但软件中总有些方面难以直接融入此类建模，尤其是在算法编程和数据结构设计方面。例如，搜索树和排序算法通常并不反映问题域中的具体事物。


  然而，面向对象编程也是设计算法和数据结构时一个非常强大的工具。我学习编程时，算法与数据结构课程与面向对象编程课程是分开讲授的。将面向对象编程与算法编程结合起来，是我通过编写软件自学的。我认为这很遗憾，因为两者实际上非常契合。


  在本书中，我将尝试把面向对象技术既作为设计软件的建模方法，也作为开发可复用算法软件的工具。多态性——面向对象编程的基石——本身就很适合开发灵活的算法，并将抽象数据类型的不同具体实现结合起来，为具体问题定制抽象算法。R
  语言的主要应用领域是机器学习和数据科学，在这些领域，高效且灵活的算法比问题域建模更重要，因此本书的很大一部分将聚焦于面向对象编程的这些方面。


  要阅读本书，你需要掌握 R 编程的基础知识：如何操作数据以及如何编写函数。我们不会涉及特别复杂的 R 编程，所以你不必具备在 R 中进行函数式编程的基础知识，但如果你想学习这部分内容，我建议阅读本系列的第一本书，那本书正是关于此内容的。不过，即使你没有读过那本书，也应该能跟上本书的进度。


  '
