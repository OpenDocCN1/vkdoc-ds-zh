- "# 1. 类与泛型函数\n\nR 语言实现面向对象编程的方式是通过泛型函数和类。如前所述，R 语言实际上有三种实现此功能的系统，分别称为`S3`、`S4`和`R6`。在本章中，我仅会描述`S3`系统，它是三者中最简单的一种，但我将在后面的章节中回到另外两种系统进行讨论。\n\
  \n\n\n## 泛型函数\n\n“泛型函数”这一术语指的是能够用于多种数据类型的函数。由于 R 语言是动态类型语言，这意味着在运行程序之前不会进行类型一致性检查，因此类型检查实际上只取决于你能否按照函数尝试的方式对数据进行操作。这也被称为“鸭子类型”，源自那句谚语“如果它走路像鸭子……”。如果你能对某个数据对象执行所需操作，那么它就具备了正确的类型。泛型函数发挥作用的地方在于，当你希望对不同类型对象执行相同语义的操作，但该操作的实现方式却取决于具体类型时。泛型函数就是能在不同类型对象上以不同方式工作的函数。因此，它们也被称为多态函数。\n\
  \n为了将讨论从抽象层面拉回到更具体的内容，让我们考虑一种抽象数据类型，比如栈。栈是由我们能在其上执行的操作来定义的，例如：\n\n*   获取栈顶元素\n*\
  \   从栈中弹出第一个元素\n*   向栈顶压入一个新元素\n\n为了给栈提供一个基础情形，我们通常还需要一种方法：\n\n*   创建一个空栈\n*   检查栈是否为空\n\
  \n这五个操作定义了一个栈是什么，但我们可以用多种不同的方式来实现一个栈。通过我们能在栈上执行的操作来定义栈，这使其成为一种抽象数据类型。要实现一个栈，我们需要一个具体的实现。\n\
  \n在静态类型的编程语言中，我们会通过这五个操作来定义栈的类型。具体如何实现取决于编程语言的类型和具体的语言，但通常，在静态类型的函数式语言中，你会为栈定义一个签名——即这五个操作的函数及其类型；而在面向对象语言中，你则会定义一个抽象的父类。\n\
  \n在 R 语言中，类型是隐式定义的，但对于栈，我们同样需要定义这五个函数。这些函数应该是泛型的，并且实际上不包含任何实现；实现会放入栈的具体实现中。\n\n\
  在定义栈的五个函数中，有一个比较特殊。创建空栈不能作为一个泛型函数。当我们创建一个栈时，总是需要一个具体的实现。但其他四个函数可以定义为泛型函数。定义泛型函数需要使用\
  \ `UseMethod` 函数，这四个函数可以定义如下：\n\n```\ntop <- function(stack) UseMethod(\"top\")\n\
  pop <- function(stack) UseMethod(\"pop\")\npush <- function(stack, element) UseMethod(\"\
  push\")\nis_empty <- function(stack) UseMethod(\"is_empty\")\n```\n\n`UseMethod`\
  \ 在这里的作用是，在 S3 面向对象编程系统中，将调用分派到不同的具体函数实现。当它被调用时，它会寻找某个函数的具体实现，并用调用泛型函数时的参数来调用它。我们很快会看到这种查找机制是如何工作的。\n\
  \n在定义泛型函数时，你也可以指定“默认”函数。当 `UseMethod` 找不到具体的实现时，就会调用这些默认函数。这些默认函数在大多数情况下可以提供一个通用的默认行为时特别有用，这样并非所有具体类都需要自己实现。但始终建议实现它们，即使它们唯一的作用是告知你未找到实际实现。例如：\n\
  \n```\ntop.default <- function(stack) .NotYetImplemented()\npop.default <- function(stack)\
  \ .NotYetImplemented()\npush.default <- function(stack, element) .NotYetImplemented()\n\
  is_empty.default <- function(stack) .NotYetImplemented()\n```\n\n## 类\n\n要实现抽象数据类型的具体实现，我们需要使用类。在\
  \ S3 系统中，你只需在对象上设置一个属性，即可创建类并将类分配给对象。类的名称就是定义它的全部依据，因此不涉及真正的类型检查。任何对象都可以拥有一个名为 “class”\
  \ 的属性，并且任何字符串都可以作为类的名称。\n\n我们可以使用向量来实现一个具体的栈。要定义这个类，我们只需要为它选一个名字。我们可以使用 `vector_stack`。我们通过一个创建空栈的函数来创建这样一个栈，并在该函数中使用\
  \ `class<-` 修改函数来设置 “class” 属性。\n\n```\nempty_vector_stack <- function() {\nstack\
  \ <- vector(\"numeric\")\nclass(stack) <- \"vector_stack\"\nstack\n}\nstack <- empty_vector_stack()\n\
  stack\n## numeric(0)\n## attr(,\"class\")\n## [1] \"vector_stack\"\nattributes(stack)\n\
  ## $class\n## [1] \"vector_stack\"\nclass(stack)\n## [1] \"vector_stack\"\n```\n\
  \n这个空栈是一个数值型向量，这只是因为我们需要为空向量指定某种类型，但向其中压入其他值只会强制进行类型转换，所以我们也可以将其他基本类型放入其中。它仅限于基本数据类型，因为向量不能包含复杂数据；对于复杂数据，我们需要使用列表。如果需要处理复杂数据，我们可以轻松地将实现改为使用列表而不是向量。\n\
  \n我们将元素放在向量的前面来实现压入操作，通过获取除第一个元素之外的所有元素来实现弹出操作，当然，通过索引第一个元素来获取栈顶元素。这样的实现看起来如下：\n\
  \n```\ntop.vector_stack <- function(stack) stack[1]\npop.vector_stack <- function(stack)\
  \ {\nnew_stack <- stack[-1]\nclass(new_stack) <- \"vector_stack\"\nnew_stack\n}\n\
  push.vector_stack <- function(element, stack) {\nnew_stack <- c(element, stack)\n\
  class(new_stack) <- \"vector_stack\"\nnew_stack\n}\nis_empty.vector_stack <- function(stack)\
  \ length(stack) == 0\n```\n\n你会注意到这些函数的名称由两部分组成。在“.”（点号）之前是定义栈的泛型函数名，在点号之后是类的名称。这种名称格式具有语义上的意义；泛型函数正是通过它来确定，基于提供给它们的数据应该调用哪个具体函数。\n\
  \n当泛型函数调用 `UseMethod` 时，该函数会检查调用该泛型函数时的第一个值是否关联了一个类。如果是，它会获取该类的名称，并查看是否能找到一个函数，该函数的名称是点号前的泛型函数名（即传递给\
  \ `UseMethod` 的名称参数，不一定是调用 `UseMethod` 的函数名）加上点号后的类名。如果能找到，则调用该函数。如果找不到，它会转而查找后缀为\
  \ `.default` 的函数，如果存在则调用该函数。\n\n这种查找机制赋予了函数名称语义意义，因此你确实不应该在函数名中使用点号，除非你希望 R 以这种方式解释名称。R\
  \ 的内置函数在这方面并不严谨——R 语言历史久远，在函数命名方式上并不十分一致——但如果你不希望意外地实现一个作为泛型函数具体实现的函数，就不应该这样做。\n\
  \n因此，如果我们在一个向量栈上调用 `push`，那么被调用的将是 `push.vector_stack` 而不是 `push.default`。\n\n```\n\
  stack <- push(stack, 1)\nstack <- push(stack, 2)\nstack <- push(stack, 3)\nstack\n\
  ## [1] 1 2 3\n## attr(,\"class\")\n## [1] \"vector_stack\"\n```\n\n在 `push.vector_stack`\
  \ 中，我们显式地设置了连接后新向量的类。如果我们不这样做，创建的就只是一个普通的向量——`c` 函数的第二个参数的“栈属性”不会传递到连接后的向量上——这样我们返回的就不是一个栈了。通过设置新向量的类，我们确保返回的是一个栈。\n\
  \n\n\n当我们移除向量的第一个元素时，其类属性不会保留，因此我们也必须在`pop.vector_stack`函数中显式地设置类属性。否则，只有第一次弹出元素时我们才会得到一个栈，之后它就只是一个普通的向量。通过显式设置类属性，我们确保该函数返回一个栈，以便我们可以再次将其用于泛型函数。\n\
  \n```\nwhile (!is_empty(stack)) {\nstack <- pop(stack)\n}\n```\n\n剩余的两个函数`top`和`is_empty`不返回栈对象，它们也不应该返回，因此我们不需要在那里设置类属性。\n\
  \n我们可以通过将类创建代码封装到另一个函数中，来避免在每次更新（即返回一个新值时；我们实际上从未在此修改过对象）时都需要显式设置类属性。这样的版本如下所示：\n\
  \n```\nmake_vector_stack <- function(elements) {\nstructure(elements, class = \"\
  vector_stack\")\n}\nempty_vector_stack <- function() {\nmake_vector_stack(vector(\"\
  numeric\"))\n}\ntop.vector_stack <- function(stack) stack[1]\npop.vector_stack <-\
  \ function(stack) {\nmake_vector_stack(stack[-1])\n}\npush.vector_stack <- function(stack,\
  \ element) {\nmake_vector_stack(c(element, stack))\n}\nis_empty.vector_stack <-\
  \ function(stack) length(stack) == 0\n```\n\n我们当然仍然在创建更新后的栈时设置了类属性，只不过这是隐式完成的——通过使用`make_vector_stack`将向量转换为栈。该函数使用`structure`函数来设置类属性，但除此之外，栈的表示仍与之前一样，是一个向量。\n\
  \n## 多态性的实际应用\n\n使用泛型函数的意义在于，我们可以为抽象操作提供不同的实现。对于栈，我们可以尝试不同的表示方式。向量版本的缺点在于，每次返回一个修改后的栈时，都需要创建一个新向量，这需要从旧向量中复制所有元素。这使得操作的时间复杂度与向量大小成线性关系。而使用链表，我们可以使其成为常数时间操作。这样的实现如下所示：\n\
  \n```\nmake_list_node <- function(head, tail) {\nlist(head = head, tail = tail)\n\
  }\nmake_list_stack <- function(elements) {\nstructure(list(elements = elements),\
  \ class = \"list_stack\")\n}\nempty_list_stack <- function() make_list_stack(NULL)\n\
  top.list_stack <- function(stack) stack$elements$head\npop.list_stack <- function(stack)\
  \ make_list_stack(stack$elements$tail)\npush.list_stack <- function(stack, element)\
  \ {\nmake_list_stack(make_list_node(element, stack$elements))\n}\nis_empty.list_stack\
  \ <- function(stack) is.null(stack$elements)\nstack <- empty_list_stack()\nstack\
  \ <- push(stack, 1)\nstack <- push(stack, 2)\nstack <- push(stack, 3)\nstack\n##\
  \ $elements\n## $elements$head\n## [1] 3\n##\n## $elements$tail\n## $elements$tail$head\n\
  ## [1] 2\n##\n## $elements$tail$tail\n## $elements$tail$tail$head\n## [1] 1\n##\n\
  ## $elements$tail$tail$tail\n## NULL\n##\n##\n##\n##\n## attr(,\"class\")\n## [1]\
  \ \"list_stack\"\n```\n\n通常，在使用列表时，我们会使用`NULL`作为终止列表的基础情况。当我们需要为元素关联一个类时，就不能简单地用这种方式包装列表并使用`NULL`。你不能将类设置为`NULL`。因此，我们将实际列表包装在另一个列表中，并在其中设置类属性。真实数据存储在这个列表的`elements`中，但除了需要使用对象的这个列表元素外，我们处理列表的方式与通常处理链表的方式相同。\n\
  \n现在我们有了栈接口的两种不同实现，但——这正是使用泛型函数的意义所在——只要代码仅通过泛型接口访问栈，使用栈的代码就不需要知道它操作的是哪种实现。\n\n\
  我们可以在下面的小函数中看到这一点，该函数通过先将元素全部压入栈，然后再将它们全部弹出，来反转一个序列。\n\n```\nstack_reverse <- function(empty,\
  \ elements) {\nstack <- empty\nfor (element in elements) {\nstack <- push(stack,\
  \ element)\n}\nresult <- vector(class(top(stack)), length(elements))\nfor (i in\
  \ seq_along(result)) {\nresult[i] <- top(stack)\nstack <- pop(stack)\n}\nresult\n\
  }\nstack_reverse(empty_vector_stack(), 1:5)\n## [1] 5 4 3 2 1\nstack_reverse(empty_list_stack(),\
  \ 1:5)\n## [1] 5 4 3 2 1\n```\n\n由于`stack_reverse`函数仅通过抽象接口引用具体的栈，我们可以向其传入向量栈或列表栈，它都能执行相同的操作。只要具体的数据结构都正确地实现了抽象接口，那么只使用泛型函数的代码就能在任何实现上工作。\n\
  \n单一的具體实现在所有情况下都很少是最优的，因此，能够将作用于抽象数据类型的算法与具体实现结合起来是有意义的，具体取决于我们需要解决的特定问题。对于这两种栈实现，它们通常都能同样良好地工作，但如上所述，向量实现的最坏情况时间复杂度是二次方，而列表实现是线性时间。因此，对于大型栈，我们预期列表实现是最佳选择；但对于小型栈，以我们的方式操作列表实现会产生更多开销（例如查找变量名和链接列表等操作），所以对于短栈，向量实现更快。\n\
  \n```\nlibrary(microbenchmark)\nmicrobenchmark(stack_reverse(empty_vector_stack(),\
  \ 1:10),\nstack_reverse(empty_list_stack(), 1:10))\n## Unit: microseconds\n##  \
  \                                     expr\n##  stack_reverse(empty_vector_stack(),\
  \ 1:10)\n##    stack_reverse(empty_list_stack(), 1:10)\n##      min       lq   \
  \  mean   median       uq\n##  195.787 217.2255 245.5698 229.8335 252.4785\n## \
  \ 235.270 257.0180 283.9289 271.5655 289.5300\n##       max neval cld\n##   965.714\
  \   100  a\n##  1174.888   100   b\nmicrobenchmark(stack_reverse(empty_vector_stack(),\
  \ 1:1000),\nstack_reverse(empty_list_stack(), 1:1000))\n## Unit: milliseconds\n\
  ##                                         expr\n##  stack_reverse(empty_vector_stack(),\
  \ 1:1000)\n##    stack_reverse(empty_list_stack(), 1:1000)\n##       min       lq\
  \     mean   median       uq\n##  28.22786 32.30359 37.77813 34.25044 36.49355\n\
  ##  23.38964 24.40046 26.14922 25.47550 26.65488\n##        max neval cld\n##  124.57810\
  \   100   b\n##   61.01179   100  a\n```\n\n绘制不同栈长度下的时间使用情况更能说明问题：随着栈变长，列表实现相对于向量实现会越来越快。\n\
  \n![A451015_1_En_1_Fig1_HTML.jpg](img/A451015_1_En_1_Fig1_HTML.jpg)\n\n图 1-1. 使用两种不同栈进行反转的时间消耗\n\
  \n只有当栈非常短时，向量实现才更可取——二次方与线性时间复杂度的差异在 n 非常小时就会体现出来——但通常，不同的使用场景会偏好不同的实现。通过编写多态的代码，我们确保可以在不修改使用算法的代码的情况下，更改数据结构的实现。\n\
  \n\n\n## 设计接口\n\n具有多态性的并非只有泛型函数。任何仅通过泛型函数操作数据的函数也都具有多态性。我们之前用栈实现的逆序函数，将空栈作为参数传入，而这个空栈决定了我们具体使用哪种栈的实现。在该函数中，我们从未引用任何真实实现的细节。倘若我们直接在函数内部创建一个空栈，那么即使其他部分都仅通过泛型函数的接口访问实现，该函数也会被绑定到单一实现上。\n\
  \n要想充分利用多态性，你需要尽可能将函数设计成具有多态性。这需要满足两个条件：\n\n1.  除非万不得已，否则不要引用具体实现。\n2.  任何时候必须引用具体类型的实现细节时，都要通过泛型函数来进行。\n\
  \n逆序函数具有多态性，因为它没有引用任何具体实现。具体使用哪种栈由参数决定，而它对特定栈实现执行的操作都通过泛型函数完成。\n\n在编程热情高涨时，人们很容易破坏这些规则。在算法中使用参数来确定数据结构并不难，但如果你正在编写的算法使用了多种不同的数据结构，你可能不想把所有不同的具体实现都作为参数。不过，你确实应该这么做。只需编写一个包装该算法并提供具体实现的函数即可——如果你不想记住算法所需的所有具体数据结构的话。这样你就能两全其美。\n\
  \n更常见的情况是，你想访问具体实现的细节。例如，假设你想弹出元素直到看到某个特定元素，但前提是该元素必须在栈中。如果我们习惯于使用基于向量的栈实现，那么很自然地会写出这样的函数：\n\
  \n```\npop_until <- function(stack, element) {\n  if (!(element %in% stack)) return(stack)\n\
  \  s <- stack\n  while (top(s) != element) s <- pop(s)\n  s\n}\n```\n\n（既然我们要编写一个实用函数，不如就用\
  \ `magrittr` 管道的风格来写吧。）\n\n```\npop_until %\npush(1) %>%\npush(2) %>%\npush(3) %T>%\
  \ print\n## [1] 3 2 1\n## attr(,\"class\")\n## [1] \"vector_stack\"\npop_until(vector_stack,\
  \ 1)\n## [1] 1\n## attr(,\"class\")\n## [1] \"vector_stack\"\npop_until(vector_stack,\
  \ 5)\n## [1] 3 2 1\n## attr(,\"class\")\n## [1] \"vector_stack\"\n```\n\n这里我们使用\
  \ `%in%` 函数来测试元素是否在栈中（同时使用 `magrittr` 管道操作符来创建测试用的栈）。只要栈是向量栈，这段代码就能正常工作；但如果栈是基于列表实现的，它就会失效。你不会收到错误信息；`%in%`\
  \ 测试将始终返回 `FALSE`，因此如果你替换了栈的实现，就会得到不正确的代码，而它甚至不会提醒你它无法工作。\n\n依赖实现细节是破坏多态对象接口最糟糕的做法。这不仅会将你绑定到单一实现上，还会让你完全依赖于该具体数据的具体实现方式。如果该实现发生了变化，使用它的算法就会出问题。于是，你既不能更改实现，又不得不在实现变更时修改使用它的算法。运气好的话，如果你破坏了接口，可能会收到错误消息；但就像我们刚看到的情况（如果你不信，可以自己试试），你甚至可能连错误消息都得不到。该函数只会始终返回原始栈，即使你想要弹出的元素就在栈中。\n\
  \n```\nlist_stack <- list_stack() %>%\n  push(1) %>%\n  push(2) %>%\n  push(3)\n\
  pop_until(list_stack, 1)\n```\n\n如果你编写的算法要操作多态对象，请尽可能遵循它所提供的接口。对于 `pop_until` 函数，我们完全可以仅使用栈接口来轻松实现。\n\
  \n```\npop_until <- function(stack, element) {\n  s <- stack\n  while (!is_empty(s)\
  \ && top(s) != element) s <- pop(s)\n  if (is_empty(s)) stack else s\n}\n```\n\n\
  如果使用现有接口无法满足需求，你应该考虑对其进行扩展。你随时都可以编写适用于某个类的新泛型函数。\n\n```\ncontains <- function(stack,\
  \ element) {\n  UseMethod(\"contains\")\n}\ncontains.default <- function(stack,\
  \ element) {\n  .NotYetImplemented()\n}\ncontains.vector_stack <- function(stack,\
  \ element) {\n  element %in% stack\n}\n```\n\n你无需为抽象数据类型的所有实现都编写具体函数来添加泛型函数。如果你有一个会报错的默认实现，并且你对自己使用的任何代码都编写了适当的单元测试，那么当你的算法试图使用尚未实现的函数时，你将收到错误提示，届时再补充实现即可。\n\
  \n如果抽象数据类型来自其他包，添加新的泛型函数并不像一开始就使用原始接口那么理想。如果该包中的实现在后续发生了变化，你新增的泛型函数可能会出错——并且可能是无声无息地出错。不过，结合适当的单元测试，这仍然比在其他函数中直接访问具体实现细节要好得多。\n\
  \n设计接口是一门艺术。在创建自己的抽象类型时，你需要仔细思考该类型应该具备哪些操作。操作数量不宜过多，否则会增加他人实现该类型其他版本的工作量；他们需要实现所有操作，而具体取决于这些操作是什么，这可能会涉及大量工作。另一方面，操作数量也不能太少，否则使用该类型的算法常常不得不破坏接口来获取实现细节，从而破坏这些算法的多态性。\n\
  \n你在算法课程中学到的抽象数据类型，就是最小化且功能强大的接口的绝佳范例。它们定义了完成有用工作所需的最少操作数量，同时仍能以最少的工作量实现具体的栈、队列、字典等。\n\
  \n在设计你自己的类型时，请努力达成这种最小化接口的境界。\n\n\n\n## 多态性的实用性\n\n多态性不仅对传统意义上的抽象数据结构有用。多态性让你能够实现抽象数据结构，从而使算法可以在抽象接口上运行，永远无需知道它们操作的是哪个具体实现。但泛型函数在许多我们通常不认为是数据结构的场景中也同样有用。\n\
  \n在 `R` 语言中，你经常会将统计模型拟合到数据上。这些模型不完全是数据结构，但它们拥有一个抽象接口。你拟合一个具体的模型，例如线性模型，但一旦你有了一个拟合好的模型，就会有许多对所有模型都有用的通用操作。你可能想对新数据预测响应变量，或者想获取拟合值的残差。这些操作对所有模型来说都是一样的——尽管不同模型实现这些操作的方式会不同——因此它们可以从泛型化中获益。事实上，它们正是如此。实现这两个操作的函数\
  \ `predict` 和 `residuals` 就是泛型函数，每个模型都可以实现自己的版本。\n\n有一长串常用于拟合模型的标准函数，所有这些函数都是作为泛型函数实现的。如果你编写的分析代码仅使用这些泛型函数来操作拟合模型，那么你可以在任何时候更改模型，并复用所有代码而无需修改。\n\
  \n打印和绘图函数也是如此。`print` 和 `plot` 都是泛型函数，它们针对不同的数据类型（通常也针对不同的拟合模型）都有具体的实现。平日里我们可能不会过多思考这一点，但如果没有像这样的泛型函数，例如，我们就需要使用不同的函数来显示向量和显示矩阵。\n\
  \n在不同数据类型之间进行转换也是一种常见操作，而多态性在此再次显示出极大的实用性（且在 `R` 中经常使用）。要将一种数据结构转换为向量，你会使用 `as.vector`\
  \ 函数——这个名字不太理想，因为它看起来像是一个专门针对 `vector` 的泛型函数 `as`，但实际上它是一个名为 `as.vector` 的泛型函数。要将一个因子转换为向量，实际调用的是具体实现\
  \ `as.vector.factor`。\n\n一个需要将某些输入数据转换为向量的算法可以使用 `as.vector` 函数，这样只要数据类型实现了 `as.vector`\
  \ 函数，该算法就无需关心实际数据是如何实现的。\n\n### 多态性与算法编程\n\n将多态性作为设计算法（尤其是实现算法）的一个组成部分，在课堂和教科书中并不常见，但它可能是编写可复用软件的一个重要方面。你可能不认为\
  \ `R` 是一种用来实现算法的语言，但每当你编写数据分析流程、操作数据框或拟合模型时，你都可以将其视为实现或使用算法。我们希望数据分析高效，因此也希望算法高效，但我们还想编写能够多次使用的代码，以避免重复造轮子。这意味着我们需要编写能够用于不同数据的代码，而在许多情况下，这涉及到将具体数据隐藏在泛型接口之后。\n\
  \n就拿一个简单的排序函数来说。对于许多排序算法，要对元素进行排序，你所需要做的仅仅是确定一个元素是否小于另一个元素。如果你在实现这类算法时硬编码了比较操作（例如使用整数比较或浮点数比较），那么你只能对这些类型的对象进行排序。一般来说，如果你硬编码了比较操作，那么你需要为每种要排序的元素类型提供不同的实现。\n\
  \n正因如此，大多数语言都会在其运行库中提供一个泛型排序函数，你可以提供它应该使用的比较功能，通常要么是通过向该函数传递一个比较函数，要么是通过允许你为新的类型指定一个比较函数。不幸的是，`R`\
  \ 中的 `sort` 函数并非此类——它确实允许你为新的类型定义排序，但它要求输入数据为原子形式，因此你不能向其提供复杂数据类型的序列——仅限于简单的数值、布尔或字符串类型。通常，你可以将数据转换为矩阵或类似形式，然后通过这种方式进行排序，但如果你实际上有一个复杂数据的列表，则无法使用该函数。\n\
  \n不过，我们可以轻松地自己实现一个函数来完成这个任务，我们可以称其为 `sort_list`——不要与内置函数 `sort.list` 混淆，后者实际上做的并不是对列表排序……\n\
  \n\n\n### 排序列表\n\n归并排序的直接实现可能如下所示：\n\n```\nmerge_lists <- function(x, y) {\nif (length(x)\
  \ == 0) return(y)\nif (length(y) == 0) return(x)\nif (x[[1]] < y[[1]]) {\nc(x[1],\
  \ merge_lists(x[-1], y))\n} else {\nc(y[1], merge_lists(x, y[-1]))\n}\n}\nsort_list\
  \ <- function(x) {\nif (length(x) <= 1) return(x)\nstart <- 1\nend <- length(x)\n\
  middle <- end %/% 2\nmerge_lists(sort_list(x[start:middle]),\nsort_list(x[(middle+1):end]))\n\
  }\n```\n\n这个实现虽然能完成功能，但归并函数的运行时间是二次的，因为它像 `x[-1]` 和 `y[-1]` 那样通过下标取值时会复制列表，并且在递归调用中组合结果时也会复制。我们可以编写一个稍微复杂一点的函数，使用迭代方法而非递归，在线性时间内完成归并：\n\
  \n```\nmerge_lists <- function(x, y) {\nn <- length(x) + length(y)\nresult <- vector(\"\
  list\", length = n)\ni <- 1\nj <- 1\nfor (k in 1:n) {\nif (i <= length(x) && (j\
  \ > length(y) || x[[i]] < y[[j]])) {\nresult[[k]] <- x[[i]]\ni <- i + 1\n} else\
  \ {\nresult[[k]] <- y[[j]]\nj <- j + 1\n}\n}\nresult\n}\nsort_list <- function(x)\
  \ {\nif (length(x) <= 1) return(x)\nstart <- 1\nend <- length(x)\nmiddle <- end\
  \ %/% 2\nmerge_lists(sort_list(x[start:middle]),\nsort_list(x[(middle+1):end]))\n\
  }\n```\n\n在排序函数的递归调用中我们仍然会复制，但复制量不会超过后续要归并的量，因此至少渐近运行时间是可接受的。\n\n使用此函数，我们可以对元素之间能用\
  \ `\"<\"` 判断大小的列表进行排序。不过，内置的 `\"<\"` 函数不一定适用于你自定义的类。\n\n```\nmake_tuple <- function(x,\
  \ y) {\nstructure(c(x, y), class = \"tuple\")\n}\nx <- list(make_tuple(1,2), make_tuple(2,0),\
  \ make_tuple(1,1))\nsort_list(x)\n## Warning in if (x[[i]] < y[[j]]) {: the condition\
  \ has length > 1 and only the first element will be\n## used\n## Warning in if (x[[i]]\
  \ < y[[j]]) {: the condition has length > 1 and only the first element will be\n\
  ## used\n## Warning in if (x[[i]] < y[[j]]) {: the condition has length > 1 and\
  \ only the first element will be\n## used\n## [[1]]\n## [1] 1 1\n## attr(,\"class\"\
  )\n## [1] \"tuple\"\n##\n## [[2]]\n## [1] 1 2\n## attr(,\"class\")\n## [1] \"tuple\"\
  \n##\n## [[3]]\n## [1] 2 0\n## attr(,\"class\")\n## [1] \"tuple\"\n```\n\n有几种方法可以解决这个问题。一种选择是定义一个通用的比较函数：我们可以称它为\
  \ `less`，然后在归并函数中使用它。\n\n```\nmerge_lists <- function(x, y) {\nn <- length(x) +\
  \ length(y)\nresult <- vector(\"list\", length = n)\ni <- 1\nj <- 1\nfor (k in 1:n)\
  \ {\nif (i <= length(x) && (j > length(y) || less(x[[i]], y[[j]]))) {\nresult[[k]]\
  \ <- x[[i]]\ni <- i + 1\n} else {\nresult[[k]] <- y[[j]]\nj <- j + 1\n}\n}\nresult\n\
  }\nless <- function(x, y) UseMethod(\"less\")\nless.numeric <- function(x, y) x\
  \ < y\nless.tuple <- function(x, y) x[1] < y[1] || x[2] < y[2]\nsort_list(x)\n##\
  \ [[1]]\n## [1] 1 1\n## attr(,\"class\")\n## [1] \"tuple\"\n##\n## [[2]]\n## [1]\
  \ 1 2\n## attr(,\"class\")\n## [1] \"tuple\"\n##\n## [[3]]\n## [1] 2 0\n## attr(,\"\
  class\")\n## [1] \"tuple\"\n```\n\n不过，我们需要为所有希望排序的类型定义 `less` 的具体实现。另一种方式是可以告诉 `R`\
  \ 如何处理我们自定义类型的 `\"<\"` 操作符，我们将在后面的章节中了解如何实现。采用这种方法，所有可以通过这种方式比较的对象都能获得排序功能。第三种可能性是将\
  \ `less` 作为排序函数的一个参数：\n\n```\nmerge_lists <- function(x, y, less) {\n# 函数体与之前相同\n\
  }\nsort_list <- function(x, less = `<`) {\nif (length(x) <= 1) return(x)\nresult\
  \ <- vector(\"list\", length = length(x))\nstart <- 1\nend <- length(x)\nmiddle\
  \ <- end %/% 2\nmerge_lists(sort_list(x[start:middle], less),\nsort_list(x[(middle+1):end],\
  \ less),\nless)\n}\nunlist(sort_list(as.list(sample(1:5))))\n## [1] 1 2 3 4 5\n\
  tuple_less <- function(x, y) x[1] < y[1] || x[2] < y[2]\nsort_list(x, tuple_less)\n\
  ## [[1]]\n## [1] 1 1\n## attr(,\"class\")\n## [1] \"tuple\"\n##\n## [[2]]\n## [1]\
  \ 1 2\n## attr(,\"class\")\n## [1] \"tuple\"\n##\n## [[3]]\n## [1] 2 0\n## attr(,\"\
  class\")\n## [1] \"tuple\"\n```\n\n我们将默认的 `less` 函数设置为 `\"<\"`，但对于这种比较函数不适用的类型，我们可以提供其他函数。\n\
  \n### 关于算法实现的灵活性的通用评论\n\n一般来说，你希望算法实现能够通过提供多态性的接口来适应变化，无论是为特定函数提供选项（如上面我们对 `less`\
  \ 所做的），还是为抽象数据类型使用通用函数。\n\n在为特定用途实现算法时，你可能能够尝试最优的数据结构和操作实现，但通过提供修改函数的接口，你可以使代码更具可复用性。即使在算法对不同应用都能正确执行的情况下，你仍然可能希望提供灵活性；算法的性能通常取决于具体使用场景。在渐近分析中，我们通常偏好理论上运行时间更优的实现，但在实践中，我们希望代码运行最快，而这并不一定是渐近最快的算法。使用“大\
  \ O”分析时，我们忽略了常数，但这些常数很重要，因此你希望你的实现的用户能够替换算法实现中使用的数据结构和操作。\n\n要弄清楚如何在实现中最佳地提供这种灵活性，通常需要一些实践。对于抽象数据结构，通用函数通常是最好的方法。对于上面排序示例中的比较功能，三种解决方法（通用函数、操作符重载或提供带有良好默认值的函数）可能同样有效。但就像设计良好的软件界面需要进行实验和思考一样，算法编程也需要如此。\n\
  \n### 关于 `UseMethod` 的更多内容\n\n`UseMethod` 函数是我们用来定义通用函数的工具，它通过我们之前看到的名称查找机制，负责找到合适的具体实现。不过，我之前遗漏了一些关于\
  \ `UseMethod` 的细节。\n\n首先，它实际上并不像一个普通函数那样工作。它看起来像一个函数，并且在很大程度上确实是一个函数，但如果你仅仅把它当作其他函数来对待，可能会得到意想不到的效果。\n\
  \n其次，如果你在调用 `UseMethod` 之前对局部变量进行了赋值，你可以将这些局部变量传递到具体实现中。让我们看一个简单的例子。\n\n```\nfoo\
  \ <- function(object) UseMethod(\"foo\")\nfoo.numeric <- function(object) object\n\
  foo(4)\n## [1] 4\nbar <- function(object) {\nx <- 2\nUseMethod(\"bar\")\n}\nbar.numeric\
  \ <- function(object) x + object\nbar(4)\n## [1] 6\n```\n\n这里的 `foo` 函数使用了我们之前看到的模式。它只是调用了\
  \ `UseMethod`。然后我们定义了一个具体函数，当 `foo` 被应用于数字时调用。数字具有类，这个类是 `numeric`。（严格来说，数字除了这个类还有更多属性，但目前我们无需担心。）`foo`\
  \ 的行为并无异常。\n\n然而，对于 `bar`，我们在调用 `UseMethod` 之前赋值了一个局部变量。这个变量 `x` 在 `bar.numeric`\
  \ 被调用时是可见的。在普通函数调用中，你需要采取措施才能访问调用作用域，因此这里的 `UseMethod` 的行为不像普通函数。\n\n在对 `UseMethod`\
  \ 的调用中，它的行为也不同于普通函数。你不能将 `UseMethod` 用作表达式的一部分。\n\n```\nbaz <- function(object)\
  \ UseMethod(\"baz\") + 2\nbaz.numeric <- function(object) object\nbaz(4)\n## [1]\
  \ 4\n```\n\n当 `UseMethod` 被调用时，具体函数会完全接管控制权，而对 `UseMethod` 的调用永远不会返回。在这方面，它与 `return`\
  \ 函数类似。因此，任何包含 `UseMethod` 的表达式都不会被求值，而在 `UseMethod` 调用之后放置的任何代码也永远不会被执行。\n\n`UseMethod`\
  \ 函数除了通用函数的名称外，还接受第二个参数。这个参数是用于分发通用函数的对象——即其类型决定了要调用的具体函数的对象。如果你不想基于调用 `UseMethod`\
  \ 的函数的第一个参数进行分发，可以使用这个参数。由于基于第一个函数参数的类型进行分发是非常常见的模式，在调用 `UseMethod` 时使用另一个对象可能会引起混淆，我建议除非你有非常充分的理由，否则不要这样做。\n\
  \n\n\n"
- "# 2. 类层次结构\n\n多态性不仅仅体现在抽象数据类型可以有不同的具体实现上。大多数面向对象编程语言中的一个基本概念是类和类层次结构。类层次结构服务于两个概念上不同的目的：优化对象接口和代码复用。严格来说，这两个概念在\
  \ R 中都不需要类层次结构，因为 R 是动态类型语言，不像 C++ 或 Java 等编程语言那样，类层次结构与静态类型系统交织在一起。尽管如此，类层次结构为思考软件设计提供了一个极其有用的框架，在动态类型语言中尤其如此。\n\
  \n我们将在接下来的两节中详细讨论这两个概念，但简而言之，接口描述了某个类的对象必须实现哪些（泛型）函数，而层次结构则基于这些函数，以“更抽象/更优化”的关系将接口链接在一起。在此上下文中，代码复用仅指编写能够操作多种类对象的函数——本质上就是我们在前一章中看到的多态函数类型——并将此类函数作为泛型函数本身融入类层次结构中。\n\
  \n## 接口与实现\n\n我们可以将类的接口视为可以应用于该类对象的一系列操作或方法。在 R 中，这意味着我们可以用这些对象作为参数，以有意义的方式调用哪些函数。\n\
  \n如果我们从抽象数据结构（例如上一章中的栈）的角度来思考，这些数据结构是由它们所支持的操作来定义的。你可以对栈进行压入（push）和弹出（pop）操作，检查它是否为空，并且可以获取顶部元素；这些函数，连同创建栈的方式，共同定义了什么是“栈性”。至少，只要这四个函数也具有我们与栈相关联的语义，便是如此。\n\
  \n在抽象层面上，我们可以通过形式参数和语义来描述一个函数的接口。例如，我们可以将函数 `push` 与其两个形式参数（一个栈和一个元素）以及这样的语义关联起来：它应该返回栈，但顶部已添加了该元素。如果我们将\
  \ `push` 操作与这两个属性（形式参数和语义）关联起来，我们就得到了一个所谓的抽象函数。正如我们所看到的，我们可以用不同的具体方式来实现这些抽象函数，但调用这些具体函数的人只需关心抽象描述即可确保功能正确性（尽管性能当然也可能是一个考虑因素，但这里我们并未将其与抽象函数的接口相关联）。\n\
  \n有了这个抽象函数的定义，我们可以说一个抽象数据类型是由一组抽象函数定义的。如果我们将一组抽象函数称为一个接口，那么抽象数据类型就是由一个接口定义的。我们可以通过编写接口中所有抽象函数的实现来实现一个抽象数据结构。这可以称为该接口的一个（具体）实现，或类似的说法。仅通过了解抽象数据类型的接口，我们就可以推理算法和设计软件；如果我们有不同的接口实现可供选择，那么理论上任何实现都可以使用。\n\
  \n像接口和实现这样的概念不仅在抽象数据结构方面有用。对于程序中你想要操作的任何类型的数据，你都可以构思出一组可以对该数据执行的有意义的操作，从而为该数据类型创建一个接口，并且你可以为这些操作编写不同的函数，以创建不同的实现。\n\
  \n### 多态性与接口\n\n如果我们回到接口的思考上，可以说如果一个类实现了构成接口的所有抽象函数，那么该类就实现了一个接口。这仅仅意味着，如果我们取这个类的对象，我们就有具体的函数可以为接口中的每个抽象函数调用。然而，如果没有泛型/多态函数，对于实现给定接口的每个类，我们需要知道哪个具体函数映射到哪个抽象函数。将一个接口的实现替换为另一个实现，将需要重写使用该实现的代码。因此，自然而然，我们也会要求具体函数的名称与抽象函数的名称相匹配。\n\
  \n这显然直接对应到泛型函数。如果我们每当想到抽象函数时，就将其映射到一个泛型函数——一个仅调用 `UseMethod` 的函数——并且每当我们想到具体函数时，就将其视为泛型函数的实现——一个名称中带有句点的函数——那么我们就拥有了一种近乎自动的方法，可以将接口和实现的概念映射到代码中。\n\
  \n由于 R 不进行任何静态类型检查，你几乎无法保证以这种方式编写的类确实实现了一个给定的接口。泛型函数中没有任何东西明确地将它们绑定为一个接口，因此对于你决定实现的任何类，你都可以实现任意子集的泛型函数。接口和实现是设计概念，你可以很容易地将设计映射到\
  \ R 代码中，但 R 并不强制要求你的代码与你的设计相匹配。\n\n\n\n### 抽象类与具体类\n\n在设计软件时，我们通常将接口和实现统称为类。面向对象的软件思维方式是：你操纵的每一段数据都是一个对象，所有对象都有一个决定其行为的类。这里所说的“行为”，指的是我们可以在对象上调用哪些函数。这种思维方式在可以修改数据且对象因此拥有状态的语言中更有意义。无论如何，你可以将所有数据视为对象，它们拥有相关联的类，这些类决定了你能对它们执行哪些操作。\n\
  \n因此，一个类既封装了你能对对象做什么（即你拥有的接口），也封装了如何做到（即接口是如何实现的）。\n\n对象拥有类，类决定了你能对对象做什么，但类存在于由更抽象或更衍生的类组成的层级结构中。一个基于向量的栈实现是一个栈。它当然是一种特殊的栈，但它仍然是栈。“栈”这个通用概念比基于向量的实现更抽象，因此可以将向量实现视为栈的一种特化——即一种使用向量实现的栈。\n\
  \n我们通常将类层级关系理解为“是一个（is-a）”关系。栈的向量实现“是一个”栈。基于列表的实现也是如此。如果你有一个更专业类的对象，你也应该能够将其视为一个更抽象类的对象。如果你有一个向量栈，你可以将其视为一个栈，因为它的类是向量栈类，而该类是栈类的一个特例。\n\
  \n最接近接口和实现概念的就是抽象类和具体类。抽象类本质上就是一个接口。它不过是对你可以用此类的对象执行哪些操作的描述；它没有任何关联的实现。另一方面，具体类则为你可以在给定类的对象上调用的所有函数提供了实现。不过，很多时候，类只实现了其接口描述的部分函数，而非全部，因此在实际操作中，这种区分并不那么清晰。\n\
  \n我们常常用类似图 2-1 所示的图表来展示类及其关系。这里，`Stack` 以斜体显示，表示它是一个抽象类。类名下方列出了你可以在该类上调用的方法，而从一个类指向另一个类的箭头表示一个类派生自另一个类。在这里我们看到，向量栈和列表栈（此处称为\
  \ `VectorStack` 和 `ListStack`）都派生自 `Stack`。\n\n![A451015_1_En_2_Fig1_HTML.gif](img/A451015_1_En_2_Fig1_HTML.gif)\n\
  \n图 2-1. 栈的类层级结构\n\n这两个具体类只实现了抽象类中列出的方法，因此，我们不会总是在派生类中再次列出这些方法。需要理解的是，任何在更抽象类中实现的方法，在更衍生的类中也会被实现。\n\
  \n### 在 R 中实现抽象类与具体类\n\n在上一章中，我们已经看到了如何使用属性 `class` 来决定为给定对象调用泛型函数的哪个版本。这种调度泛型函数的方式是\
  \ S3 系统实现类的方法，但从某种意义上说，它只处理了抽象函数的具体实现。有一个泛型方法 `foo`：\n\n```\nfoo <- function(object)\
  \ UseMethod(\"foo\")\n```\n\n我们为类 `bar` 实现了它：\n\n```\nfoo.bar <- function(object)\
  \ ...\n```\n\n这仅仅告诉了 R 语言，类 `bar` 是如何实现 `foo` 函数的。如果 `foo` 是一个由多个函数组成的接口的一部分，那么在\
  \ R 代码中并没有明确声明这一点。\n\n如果我们把接口看作一组抽象函数，那么在 R 中，将这些函数视为一个整体只是我们非正式地做的事情。由于抽象类本质上就是接口，我们可以对抽象类做同样的事。在上一章中，当我们实现基于向量的栈时，我们通过将构造函数\
  \ `empty_vector_stack` 返回的对象的 `class` 属性设置为 `vector_stack`，并实现了我们认为属于栈接口的四个函数：`push`、`pop`、`top`\
  \ 和 `is_empty`。在整个过程中，我们从未指明存在某个抽象的栈类，并且 `vector_stack` 是它的一个特化。\n\n由于以这种方式实现的类机制本质上是在单个函数级别上运作的——我们有泛型函数以及根据函数名称进行调度的实现——因此，类及其关系在\
  \ R 中可能会变得非常混乱。你可以通过以比语言要求更结构化的方式来思考你的软件设计，从而缓解这一问题。在设计软件时始终牢记类的概念，通过定义一组泛型函数来实现抽象类——你可以使用注释将它们分组并记录这些函数构成了一个接口。确保在定义实现某个接口的具体类时，没有忘记接口中的任何一个函数。你可能不会实现所有函数；有时有充分的理由不去实现，有时只是出于实用主义，没有实现那些可能难以实现但目前还不需要的功能。不过，请确保这是一个有意识的选择，而不是你单纯忘记了某个函数。\n\
  \n你可以使用函数 `methods` 来获取某个类实现的所有方法的列表：\n\n```\nmethods(class = \"vector_stack\")\n\
  ## [1] is_empty pop      push     top\n## see '?methods' for accessing help and\
  \ source code\n```\n\n并检查你是否实现了所有功能。你也可以使用此函数来获取所有实现了某个特定泛型函数的类的列表：\n\n```\nmethods(\"\
  top\")\n## [1] top.default      top.list_stack\n## [3] top.vector_stack\n## see\
  \ '?methods' for accessing help and source code\n```\n\n\n\n### 另一个示例：图形对象\n\n类层次结构所依赖的“is-a”关系，比仅仅拥有抽象类及其实现要灵活得多。它为我们提供了一种建模方式，来表现某些对象确实属于不同但相关的类，同时也提供了一种机制，让我们可以将接口视为其他接口的特化。\n\
  \n例如，考虑一个应用程序，我们在其中操作一些图形对象——也许是作为某个新可视化包的一部分。这个应用程序中最基础的类是 `GraphicalObject`，它的对象可以被\
  \ `draw`（绘制）。能够绘制对象是我们处理图形对象所需的最基本操作。图形对象还有一个“边界框”（bounding box）——一个能够告诉我们图形大小的矩形，这在绘制对象时可能是必需的。\n\
  \n这个类是抽象的，不仅是因为我们正在定义一个接口以便拥有不同的实现（就像我们处理栈那样），更是因为在如此抽象的层级上拥有一个图形接口并没有实际意义。一个具体到确实可以拥有其实例对象的类是\
  \ `Point`（点），它代表单个点的图形对象。其他类可以是 `Circle`（圆）和 `Rectangle`（矩形）。\n\n为了便于处理多个图形对象，我们还在接口中提供了一个类\
  \ `Composite`（组合），用于捕获一组图形对象。\n\n![A451015_1_En_2_Fig2_HTML.gif](img/A451015_1_En_2_Fig2_HTML.gif)\n\
  \n图 2-2. 图形对象的类层次结构。从 `Composite` 指向 `GraphicalObject` 的箭头（起点为菱形，终点为箭头）表示 `Composite`\
  \ 由一组 `GraphicalObject` 组成。\n\n将一个对象集合视为与其组件同类的对象，是一种所谓的**设计模式**（design pattern），它使得在此应用程序中处理复杂图形变得更加容易。我们可以将图形对象分组到一个层次结构中——类似于在绘图工具中对对象进行分组——并且我们无需在代码中显式检查当前操作的是单个对象还是一个对象集合。一个对象集合本身也是一个图形对象，我们可以直接将其当作图形对象来处理。\n\
  \n实现这个类层次结构相当直接。抽象类 `GraphicalObject` 并没有显式表示，但我们需要将其方法作为泛型函数来使用。\n\n```\ndraw <-\
  \ function(object) UseMethod(\"draw\")\nbounding_box <- function(object) UseMethod(\"\
  bounding_box\")\n```\n\n在构造图形对象时，我们需要设置它们的类，以下是具体类的构造函数：\n\n```\npoint <- function(x,\
  \ y) {\n  object <- c(x, y)\n  class(object) <- \"point\"\n  names(object) <- c(\"\
  x\", \"y\")\n  object\n}\nrectangle <- function(x1, y1, x2, y2) {\n  object <- c(x1,\
  \ y1, x2, y2)\n  class(object) <- \"rectangle\"\n  names(object) <- c(\"x1\", \"\
  y1\", \"x2\", \"y2\")\n  object\n}\ncircle <- function(x, y, r) {\n  object <- c(x,\
  \ y, r)\n  class(object) <- \"circle\"\n  names(object) <- c(\"x\", \"y\", \"r\"\
  )\n  object\n}\ncomposite <- function(...) {\n  object <- list(...)\n  class(object)\
  \ <- \"composite\"\n  object\n}\n```\n\n我们将图形对象实现为向量，除了组合对象用列表表示，以便它能包含不同类型的其他图形对象。点只是坐标向量，矩形由两个坐标（左下角和右上角）表示，圆则由中心点和半径表示。\n\
  \n对于 `draw` 方法，我们可以直接使用基本的图形函数：\n\n```\ndraw.point <- function(object) {\n  points(object[\"\
  x\"], object[\"y\"])\n}\ndraw.rectangle <- function(object) {\n  rect(object[\"\
  x1\"], object[\"y1\"], object[\"x2\"], object[\"y2\"])\n}\ndraw.circle <- function(object)\
  \ {\n  plotrix::draw.circle(object[\"x\"], object[\"y\"], object[\"r\"])\n}\ndraw.composite\
  \ <- function(object) {\n  invisible(Map(draw, object))\n}\n```\n\n除了圆（为了方便，我们使用了\
  \ `plotrix` 包中的 `draw.circle` 函数），我们可以使用基本的图形函数。对于集合类，我们只需对集合中的所有组件调用 `draw`。我们将对\
  \ `Map` 的调用包装在 `invisible` 中，是因为我们不希望在命令行调用该函数时每次都打印出一个对象列表，否则实现是直接的。\n\n利用这些函数，我们可以构建图形元素的绘图，见图\
  \ 2-3。\n\n![A451015_1_En_2_Fig3_HTML.gif](img/A451015_1_En_2_Fig3_HTML.gif)\n\n\
  图 2-3. 图形元素绘图\n\n```\nplot(c(0, 10), c(0, 10),\n     type = 'n', axes = FALSE, xlab\
  \ = '', ylab = '')\ndraw(point(5,5))\ndraw(rectangle(2.5, 2.5, 7.5, 7.5))\ndraw(circle(5,\
  \ 5, 4))\ncorners <- composite(point(2.5, 2.5), point(2.5, 7.5),\n             \
  \        point(7.5, 2.5), point(7.5, 7.5))\ndraw(corners)\n```\n\n这里我们必须设置绘图区域的大小，使其能真正包含我们想要显示的元素。我们有\
  \ `bounding_box` 函数用于计算该区域，并且可以像这样实现不同的方法：\n\n```\nbounding_box.point <- function(object)\
  \ {\n  c(object[\"x\"], object[\"y\"], object[\"x\"], object[\"y\"])\n}\nbounding_box.rectangle\
  \ <- function(object) {\n  c(object[\"x1\"], object[\"y1\"], object[\"x2\"], object[\"\
  y2\"])\n}\nbounding_box.circle <- function(object) {\n  c(object[\"x\"] - object[\"\
  r\"], object[\"y\"] - object[\"r\"],\n    object[\"x\"] + object[\"r\"], object[\"\
  y\"] + object[\"r\"])\n}\nbounding_box.composite <- function(object) {\n  if (length(object)\
  \ == 0) return(c(NA, NA, NA, NA))\n  bb <- bounding_box(object[[1]])\n  x1 <- bb[1]\n\
  \  y1 <- bb[2]\n  x2 <- bb[3]\n  y2 <- bb[4]\n  for (element in object) {\n    bb\
  \ <- bounding_box(element)\n    x1 <- min(x1, bb[1])\n    y1 <- min(y1, bb[2])\n\
  \    x2 <- max(x2, bb[3])\n    y2 <- max(y2, bb[4])\n  }\n  c(x1, y1, x2, y2)\n\
  }\n```\n\n有了它，我们可以将所有希望绘制的图形元素收集到一个组合对象中，并在绘制前计算边界框。\n\n```\nall <- composite(\n\
  \  point(5,5),\n  rectangle(2.5, 2.5, 7.5, 7.5),\n  circle(5, 5, 4),\n  composite(point(2.5,\
  \ 2.5), point(2.5, 7.5),\n            point(7.5, 2.5), point(7.5, 7.5))\n)\nbb <-\
  \ bounding_box(all)\nplot(c(bb[1], bb[3]), c(bb[2], bb[4]),\n     type = 'n', axes\
  \ = FALSE, xlab = '', ylab = '')\ndraw(all)\n```\n\n当然，结果与图 2-3 所示完全相同。\n\n\n\n\
  ## 作为带有细化功能的接口的类层次结构\n\n在之前的示例中，我们有一个抽象类定义了接口，然后由不同的具体类来实现它。以栈为例，不同的实现为我们提供了不同的时间复杂度权衡，但不同的实现概念上都是栈。对于图形对象而言，各种具体类在概念上是不同的对象，只是这些对象都可以被视为图形对象，从而通过通用接口进行操作。这些是软件设计中常见的模式，但当子类（例如不同类型的图形对象）代表不同的概念类时，它们通常也可以扩展接口。\n\
  \n以统计模型为例。这些模型通常被实现为某些通用函数（例如 `predict` 或 `coef`）的类，这些函数为我们提供了统一的模型接口，使得我们能够在分析中切换不同模型，而无需对分析代码进行重大重写。所有模型实现的通用函数为最抽象的模型类型提供了一个接口。例如，所有模型都必须实现\
  \ `predict` 和 `coef`，这样我们才能在分析代码中将它们作为即插即用的替代品使用。但不同类型的模型可能会在接口中添加并非所有模型都相关的额外功能。例如，我们可以设想决策树增加了修剪树的功能，比如一个\
  \ `prune` 函数。如果所有决策树实现都有一个 `prune` 函数，我们就可以替换决策树的实现并仍然复用我们的代码，但由于并非所有模型都实现了 `prune`，我们只能将一个决策树实现替换为另一个决策树，而不能替换为任意类型的模型。我们可以说决策树是模型的特化形式。所有决策树都是模型，但并非所有模型都是决策树。在类的层面上，我们会有一个模型的超类，以及一个决策树的子类，它向模型接口中添加了诸如\
  \ `prune` 之类的函数。如果我们有不同的决策树实现，那么决策树类通常也是抽象的，不同的实现将继承自这个类，而不是更通用的模型类（参见图 2-4）。\n\n\
  ![A451015_1_En_2_Fig4_HTML.gif](img/A451015_1_En_2_Fig4_HTML.gif)\n\n**图 2-4.**\
  \ 模型层次结构，其中决策树是 `Model` 类的特化形式，该类添加了 `prune` 函数，并为我们提供了一个额外的抽象类，决策树的实例必须实现该类\n\n\
  作为另一个例子，我们可以考虑一个参考文献列表，它本质上是一系列出版物的列表。存在不同类型的出版物，但所有出版物至少都有一个名称和一位或多位作者，因此表示出版物的最抽象方式只需包含这两个属性。对一系列出版物，我们可能想做的其中一件事是计算文献计量指标，例如每篇出版物的引用次数。如果每篇出版物都有一个其所引用的其他作品的列表，那么我们可以从所有相关出版物的数据库中计算出这个引用次数。如果我们有一位给定作者的所有出版物的列表，我们还可以计算出该作者获得的引用次数，或推导出诸如\
  \ h 指数之类的统计数据。\n\n存在不同类型的出版物，因此我们可以为书籍和文章等创建子类。书籍会有一个关联的出版商和一个 ISBN，而期刊文章会有一个关联的期刊以及（通常）文章在期刊中所在的页码。为简单起见，如果我们只允许这两种类型的出版物，我们可以将其表示为图\
  \ 2-5 所示的类层次结构。\n\n![A451015_1_En_2_Fig5_HTML.gif](img/A451015_1_En_2_Fig5_HTML.gif)\n\
  \n**图 2-5.** 参考文献对象的层次结构。通用的 `Publication` 类为每篇出版物赋予一个名称、一个作者列表以及一个其他出版物引用列表。两种具体类型的出版物，`Article`\
  \ 和 `Book`，则添加了额外的属性。\n\n在这个层次结构中，所有函数都只是访问对象的属性；也就是说，它们只是提取存储在这些对象中的数据。通过函数访问属性，而不是访问作为对象表示一部分的列表或向量，通常是一个好主意。它允许你更改数据的表示方式，而无需修改访问函数之外的任何代码。如果你的代码仅通过函数访问对象，那么你就封装了实现细节，以后更新代码将比不这样做简单得多。\n\
  \n还要注意，在这两种具体类型的出版物之间，没有任何访问函数需要有所不同。抽象类 `Publication` 访问 `name` 和 `authors`，而其他类中提供的附加属性是不相交的。正因如此，没有必要为实现此类层次结构而使用通用函数。我们可以仅使用普通的旧式函数来实现它。\n\
  \n```\n## 出版物接口\npublication <- function(name, authors, citations) {\nstructure(list(name\
  \ = name, authors = authors,\ncitations = citations),\nclass = \"publication\")\n\
  }\nname <- function(pub) pub$name\nauthors <- function(pub) pub$authors\n## 文章\n\
  article <- function(name, authors, citations, journal, pages) {\nstructure(list(name\
  \ = name, authors = authors,\ncitations = citations,\njournal = journal, pages =\
  \ pages),\nclass = c(\"article\", \"publication\"))\n}\njournal <- function(pub)\
  \ pub$journal\npages <- function(pub) pub$pages\n## 书籍\nbook <- function(name, authors,\
  \ citations, publisher, ISBN) {\nstructure(list(name = name, authors = authors,\n\
  citations = citations,\npublisher = publisher, ISBN = ISBN),\nclass = c(\"book\"\
  , \"publication\"))\n}\npublisher <- function(pub) pub$publisher\nISBN <- function(pub)\
  \ pub$ISBN\n```\n\n通用函数非常适合在相同概念操作下为不同类提供不同行为，但当我们能使用普通旧式函数获得所需操作时，就没有必要调用通用函数了。\n\
  \n出版物的实现是直接的，除了在构造函数中设置的 `class` 属性。这里我们将类设置为类名列表，而不仅仅是类名。这就是我们指定一个 `\"book\"` 对象或\
  \ `\"article\"` 对象同时也是 `\"publication\"` 对象的方式。我们想要的设计要求书籍和文章都是出版物，但由于 S3 类只是表示为字符串的名称，我们无法在\
  \ R 中明确这一点。相反，我们通过让 `class` 属性成为类名列表来表示类层次结构，该列表从最特化的对象向上追溯到最抽象的对象。R 如何解释这种类名列表，以及如何用它来找到通用函数的正确实现，是下一章的主题。\n\
  \n创建一个类似于我们为出版物所做的类层次结构并不罕见，但它存在一些小问题。要访问书籍特有的属性，你需要知道你正在处理的对象是一本书；在不编写专门处理书籍或文章的特化代码的情况下，聚合处理出版物，这才是使用面向对象编程以及首先构建出版物层次结构的初衷。拥有一个子类为其超类接口添加函数的类层次结构本身并没有问题，但如果你发现自己正在编写这样的层次结构，你应该仔细考虑应该如何访问和操作该层次结构中的对象。\n\
  \n\n\n通常来说，将函数置于层次结构中尽可能高的位置是最佳做法，这样就能确保层次结构中尽可能多的类能够支持这些函数。通过泛型函数，不同的子类可以用截然不同的方式实现这些方法，但你操作的所有对象至少都会实现你调用它们的方法。在我们这里设计的出版物类层次结构中，如果要编写可重用的代码，唯一能真正做的事情就是访问名称和作者，以及构建引用关系图。书籍和文章的特殊属性只有在我们明确检查访问的是书籍还是文章时，才能以类型安全的方式使用。\n\
  \n我们可能希望编写一些代码来格式化出版物，以便制作出版物列表等。这里我们需要书籍和文章中存储的信息，但由于直接访问这些信息需要我们首先测试对象的类别，因此代码会有些繁琐，而且很可能容易出错。更糟的是，如果我们在层次结构中添加另一种出版物类型（例如，会议论文），我们就需要更新所有执行这种类别检查并以不同方式处理不同类别的代码，以便也能处理这种新类型。正是为了避免这种情况，我们才需要泛型函数，因此正确的设计应该是拥有一个用于格式化引文的泛型函数，并为其子类进行特化。\n\
  \n```\nformat <- function(publ) UseMethod(\"format\")\nformat.article <- function(publ)\
  \ {\n  paste(name(publ), authors(publ),\n        journal(publ), pages(publ), sep\
  \ = \", \")\n}\nformat.book <- function(publ) {\n  paste(name(publ), authors(publ),\n\
  \        publisher(publ), ISBN(publ), sep = \", \")\n}\n```\n\n然后，我们可以在另一个泛型函数 `print`\
  \ 中使用这个 `format` 函数来显示出版物：\n\n```\nprint.publication <- function(x, ...) print(format(x))\n\
  ```\n\n当我们通过创建子类来扩展接口时，我们添加的函数只有一部分对象会支持。有时，当某些操作确实只对某些对象有意义时——比如修剪决策树，修剪像线性模型这样的东西就没有意义——这是必要的，但作为一般原则，我建议你将这种特化降到最低。拥有一个由或多或少特化的类组成的大型层次结构，可能感觉像是一个好的设计，但当你要处理来自该层次结构的对象时，你希望它们尽可能相似。你希望能够使用相同的（泛型）函数来处理所有这些对象，因此，总的来说，在任何情况下你都希望坚持使用最抽象的接口。你最好在设计代码时就考虑到这一点。\n\
  \n能够统一地处理对象也是我们将图形对象的集合本身设为一个图形对象的原因。如果我们不这样做，那么我们就需要显式地处理对象集合，并编写递归函数来遍历它们。通过将集合设为一个图形对象类，我们可以将此复杂性隐藏在泛型函数中。这是一个非常常见的技巧，被称为组合设计模式。\n\
  \n"
- '# 3. 实现复用


  最容易编写的代码是已经存在的代码。如果你能重用现有代码，这总是比编写新代码要好。你无需花费时间编写代码，而且如果现有代码已经存在了一段时间，它很可能是经过良好测试的，因此比引入的新代码更可能正确。所以，作为程序员，你的目标应该是编写尽可能少的新代码，尽管这听起来有些矛盾。


  然而，重用代码的方法并不是将现有代码块从程序的一个地方复制粘贴到另一个地方。这样你确实重用了代码，但最终你会得到两份相同的代码。如果将来某天你发现需要修改这段代码（也许是因为尽管经过了测试，里面还是隐藏着一个
  bug），你必须记得在两个地方都进行修改。当你有这样重复的代码时，很难记住这一点，而如果这两份拷贝开始出现差异，维护起来将是一场噩梦。


  重用代码的方法是编写可以在许多不同上下文中使用的函数。编写专门处理单个问题并能出色解决问题的函数，同时对你调用它们的上下文做尽可能少的假设。用小巧、可重用的构建块来构建程序，会使你的代码更易于维护，也更易于扩展。


  然而，在面向对象编程中，我们通常还会为代码重用增加另一个方面。当一个类定义了泛型函数时，该类及其所有子类的实现都必须实现这些泛型函数。如果每个类都以独特的方式实现所有泛型函数，那么重用的机会就很少，但所有实现都完全独特的情况很少见。通常，对于一个给定的问题，存在一些适用于大多数类的良好默认解决方案，只有少数类才需要实现专门的函数。在面向对象编程中，你应该在类层次结构中尽可能高的层级上实现函数，并让子类在可能的情况下通过调用通用函数（而不是提供它们自己专门的函数）来重用这些实现。层次结构中的任何类都可能需要对一部分泛型函数进行特化，而任何子类都应该使用其层次结构中其上级最特化的函数。但总的来说，子类只应在所需功能与其超类中定义的版本不同的情况下，才定义自己的泛型函数版本。其余的函数它应该直接重用。我们说它从其超类中**继承**了这些函数，而泛型函数的查找机制在很大程度上实现了这一过程的自动化。


  在日常的 R 编程中，深层类层次结构很少被用到。与其编造一个对实际代码来说不现实的人为例子——也为了避免给出那些大部分代码与类层次结构介绍无关的例子——我将使用抽象的例子。如果你对面向对象编程在
  R 中的实际应用更感兴趣，我在第 4 章中给出了一个实际的例子，尽管那只是一个单层深度的类。



  ## 类层次结构中的方法查找


  正如我们之前所见，对于泛型函数 `f`，调用 `f(x)` 会使 R 查找名称源自 `class(x)` 的函数。如果 `class(x)` 是单个字符串，例如
  `"A"`，它将查找 `f.A`。如果 R 找到了这样的函数，就会调用它；如果没找到，则会查找 `f.default` 并调用它。否则，若没有 `f.default`，R
  将放弃并返回错误。这是当对象类为单个字符串时 R 的行为。如果它是一个类名序列，R 则会遍历这个序列，并依次尝试为序列中的每个类查找函数。


  考虑下面定义的三个类 `A`、`B` 和 `C`。


  ```

  A <- function() {

  structure(list(), class = "A")

  }

  B <- function() {

  structure(list(), class = c("B", "A"))

  }

  C <- function() {

  structure(list(), class = c("C", "B", "A"))

  }

  ```


  由于类仅由字符串表示，我们并没有真正显式地定义它们；我们只有三个函数来创建设置了类属性的对象。创建对象的函数被称为构造器，对于 S3 系统来说，这实际上是定义类的唯一方式。


  我们可以创建这些类的实例并检查它们的类。


  ```

  x <- A()

  y <- B()

  z <- C()

  class(x)

  ## [1] "A"

  class(y)

  ## [1] "B" "A"

  class(z)

  ## [1] "C" "B" "A"

  ```


  如果我们定义一个只有默认实现的泛型函数：


  ```

  f <- function(x) UseMethod("f")

  f.default <- function(x) print("f.default")

  ```


  对所有三个对象调用它只会得到默认行为。


  ```

  f(x)

  ## [1] "f.default"

  f(y)

  ## [1] "f.default"

  f(z)

  ## [1] "f.default"

  ```


  另一方面，如果我们定义一个具有默认实现和 `A` 类实现的泛型函数，那么对这三个对象调用它都会调用 `A` 函数。


  ```

  g <- function(x) UseMethod("g")

  g.default <- function(x) print("g.default")

  g.A <- function(x) print("g.A")

  g(x)

  ## [1] "g.A"

  g(y)

  ## [1] "g.A"

  g(z)

  ## [1] "g.A"

  ```


  对于 `x`，我们明白为什么会这样。R 查找 `g.A` 并找到了它。而对于 `y`，R 查找 `g.B` 却未找到。如果 `y` 的类只是 `"B"`，那么查找就会结束，R
  会调用 `g.default`。但 `y` 的类既是 `"B"` 又是 `"A"`，所以当 R 找不到 `g.B` 时，它会转而查找 `g.A`。由于 `g.A`
  确实存在，R 就会调用它。类似地，当我们调用 `g(z)` 时，R 首先查找 `g.C`，未找到；接着查找 `g.B`，也未找到；最后发现 `g.A` 存在，于是调用它。因此，这三个调用都指向同一个
  `g.A` 函数。类 `B` 和 `C` 从类 `A` 继承了 `g` 的实现。


  现在，我们尝试添加一个同时对 `A` 和 `B` 类有实现的泛型函数。


  ```

  h <- function(x) UseMethod("h")

  h.default <- function(x) print("h.default")

  h.A <- function(x) print("h.A")

  h.B <- function(x) print("h.B")

  h(x)

  ## [1] "h.A"

  h(y)

  ## [1] "h.B"

  h(z)

  ## [1] "h.B"

  ```


  在这种情况下，调用 `h(x)` 会调用 `h.A`——显然，`x` 的唯一类是 `A` 且 `h.A` 已实现——而调用 `h(y)` 和 `h(z)` 都会调用
  `h.B`。在这两种情况下，类序列中类 `B` 出现在类 `A` 之前，并且因为 `h.B` 存在而被调用，匹配函数的查找就此停止。虽然 `h.A` 函数存在，但我们在首次匹配后就停止了查找，所以永远不会到达它。


  为了完整性，如果我们添加一个对这三个类都有实现的函数，那么每个类都会被调用其最专门的函数。


  ```

  i <- function(x) UseMethod("i")

  i.default <- function(x) print("i.default")

  i.A <- function(x) print("i.A")

  i.B <- function(x) print("i.B")

  i.C <- function(x) print("i.C")

  i(x)

  ## [1] "i.A"

  i(y)

  ## [1] "i.B"

  i(z)

  ## [1] "i.C"

  ```


  ## 在构造器中正确建立层次结构


  当我们上面创建三个类 `A`、`B` 和 `C` 时，我们在每个构造器中显式创建了代表类层次结构的类列表。对于像这里这样的小型层次结构（所有三个类彼此邻近定义，且我们知道它们应该协同工作）来说，这没问题。但如果代码增长到更复杂的情况，它确实会引入潜在的错误来源。例如，我们可能希望在某个时候将另一个类插入到
  `A` 和 `B` 之间的层次结构中。我们或许记得更新 `B` 的类列表，但我们是否也会记得更新 `C` 的呢？如果 `C` 在不同的文件中，而且我们已经多年没有修改过它了呢？


  由于类层次结构完全由这些类列表表示——没有显式的层次结构，只有这些隐式列表——我们必须格外小心，以确保我们的代码始终符合我们的设计。我们应该避免在每个构造器中显式地表示层次结构。


  确保这一点的一种方法是，在定义新类时，始终调用其直接超类的构造器。R 对类层次结构一无所知，并且在您创建 `class` 列表之前，它也不知道您拥有哪个超类。因此，没有自动的方法来做到这一点；你必须手动调用超类的构造器，以这种方式获取一个对象，然后将新的类名添加到其
  `class` 列表的前面。


  ```

  A <- function() {

  structure(list(), class = "A")

  }

  B <- function() {

  this <- A()

  class(this) <- c("B", class(this))

  this

  }

  C <- function() {

  this <- B()

  class(this) <- c("C", class(this))

  this

  }

  ```


  使用这种编程惯用法还能让您避免另一个潜在的错误来源。类的构造器通常会创建一个带有属性的对象，并期望这些属性在其函数中处于一致的状态。如果您不调用超类的构造器，而是在子类的构造器中设置这些属性，就可能违反超类所依赖的不变约束。在编写子类构造器时，您可能会小心避免这样做，但超类的实现将来可能会被更改。一旦发生这种情况，子类的实现就可能被破坏。尝试调试因代码在其他完全不相关的位置发生更改而出现的错误，简直是地狱般的体验。


  通常，更好的做法是始终调用超类的构造器，然后在返回子类对象之前对生成的对象进行修改。



  ## `NextMethod`


  当专化泛型函数时，我们并不总是需要从头实现所有功能。有时我们可以复用更抽象类中的实现；只需对它们的结果稍作调整。我们可以使用函数的全名显式调用超类的函数，但这仅在类实际实现了自己的版本时才有效。如果类只是继承了它，则此方法无效，并且每次修改类层次结构时都必须小心，以免破坏此类直接调用所依赖的假设。


  更好的解决方案是使用`NextMethod`函数。此函数允许你以类似`UseMethod`的方式调用继承的函数，并使用`class`序列。`NextMethod`函数在魔法程度上与`UseMethod`类似。它知道你正在实现哪个泛型函数——尽管像`UseMethod`一样，你可以覆盖这一点——并且它会搜索你函数第一个对象的`class`序列。同样，你可以覆盖这一点，但这是一个非常常见的惯用法，你可能不应该这样做。与`UseMethod`不同，它不会终止你调用它的函数，并且你可以使用它返回的值。


  例如，我们可以考虑上一章末尾讨论的书目对象。这里我们有超类`"publication"`和两个子类`"article"`和`"book"`，并且我们有一个用于格式化引文的泛型方法`format`。我们可以为`publication`类编写一个`format`函数，用于格式化姓名和作者列表，并在方法的专化中调用`NextMethod`来获取此字符串，并用子类中可用的信息扩展它。


  ```

  format.publication <- function(publ) {

  paste(name(publ), authors(publ), sep = ", ")

  }

  format.article <- function(publ) {

  paste(NextMethod(), journal(publ), pages(publ), sep = ", ")

  }

  format.book <- function(publ) {

  paste(NextMethod(), publisher(publ), ISBN(publ), sep = ", ")

  }

  ```


  当我们调用`NextMethod`时，R 将搜索`class`序列——从上次搜索结束的地方开始——寻找一个实现了我们当前正在评估的泛型函数的类。


  我们可以使用`A`、`B`和`C`类来实际查看这一点。如果我们定义所有都调用`NextMethod`的函数，并对这三个类中的每一个对象进行评估，我们将看到`A`对象`x`会评估`A`方法和默认函数；`B`对象`y`会评估`B`函数，然后在默认版本之前继续评估`A`函数；而`C`对象`z`会评估所有函数。


  ```

  f <- function(x) UseMethod("f")

  f.default <- function(x) print("f.default")

  f.A <- function(x) {

  print("f.A")

  NextMethod()

  }

  f.B <- function(x) {

  print("f.B")

  NextMethod()

  }

  f.C <- function(x) {

  print("f.C")

  NextMethod()

  }

  f(x)

  ## [1] "f.A"

  ## [1] "f.default"

  f(y)

  ## [1] "f.B"

  ## [1] "f.A"

  ## [1] "f.default"

  f(z)

  ## [1] "f.C"

  ## [1] "f.B"

  ## [1] "f.A"

  ## [1] "f.default"

  ```


  如果我们实现另一个函数，其中我们只为`A`和`C`类实现版本，而不为`B`实现，我们将看到`C`对象评估`C`版本，然后评估`A`版本；由于没有`B`版本，调用`NextMethod`时的搜索将找不到它，因此将继续到`A`版本。


  ```

  j <- function(x) UseMethod("j")

  j.default <- function(x) print("j.default")

  j.A <- function(x) {

  print("j.A")

  NextMethod()

  }

  j.C <- function(x) {

  print("j.C")

  NextMethod()

  }

  j(x)

  ## [1] "j.A"

  ## [1] "j.default"

  j(y)

  ## [1] "j.A"

  ## [1] "j.default"

  j(z)

  ## [1] "j.C"

  ## [1] "j.A"

  ## [1] "j.default"

  ```


  所有方法分派——即查找泛型函数实现的技术术语——完全基于`class`属性中的类列表。类层次结构并未显式表示，确保`class`列表反映出你所设想的类层次结构设计是你的责任。如果我们反转`class`列表的顺序，R
  同样可以轻松地处理它。


  ```

  f(z)

  ## [1] "f.C"

  ## [1] "f.B"

  ## [1] "f.A"

  ## [1] "f.default"

  class(z) <- rev(class(z))

  f(z)

  ## [1] "f.A"

  ## [1] "f.B"

  ## [1] "f.C"

  ## [1] "f.default"

  ```


  如果我们反转类的顺序，`UseMethod`中对第一个函数的搜索只是从最抽象的类开始，并沿着列表向下工作，直到找到实现。在这种情况下，它会立即找到它，并且对`NextMethod`的调用会像之前一样，从`UseMethod`或先前`NextMethod`调用结束的地方继续搜索。默认函数总是在最后，因为一旦你遍历完列表，就会调用默认函数。如果`A`类是一个`C`专化的抽象类，这当然会给出不正确的行为。你将调用抽象函数而不是专化函数。但是将泛型函数解析为具体类的机制并不了解类层次结构，因此它只会搜索列表。


  这也意味着你可以编写不同的类，这些类认为其他类的层次结构完全不同。如果一个`class`列表是`c("A", "B", "C")`，另一个是`c("B", "C",
  "A")`，第一个认为`C`是最抽象的，`A`是最衍生的类，而第二个认为`A`是最抽象的，`B`是最衍生的。R 寻找要调用函数的机制足够简单，但如果你开始编写代码，其中你的类层次结构取决于你所查看的对象，那么你就走上了疯狂之路。


  '
- "# 4. 统计模型\n\n说实话，在大多数日常 R 编程中，你不会使用面向对象编程。你在 R 中进行的大多数分析涉及数据转换，通常实现为某种数据流，这最好通过函数式编程来捕获。当你编写此类管道时，你可能会使用多态函数，但很少需要创建自己的类。然而，如果你需要实现一个新的统计模型，你通常确实希望创建一个新类。\n\
  \n大量数据分析要求你推断感兴趣的参数，或者你构建一个模型来预测数据的属性，但在许多此类情况下，你不一定需要确切知道我们是如何构建模型的、它如何推断参数，或者它如何预测新值。你可以使用`coefficients`函数从拟合模型中获取推断的参数，或者使用`predict`函数预测新值，并且你可以将这两个函数与几乎任何统计模型一起使用。这是因为大多数模型都是作为实现了泛型函数`coefficients`和`predict`的类来实现的。\n\
  \n作为面向对象编程的实际示例，我们可以在本章中实现我们自己的模型。我们将保持简单，以便专注于编程方面而非统计理论，但仍然实现一些 R 尚未内置的东西。我们将实现贝叶斯线性回归的一个版本。\n\
  \n\n\n## 贝叶斯线性回归\n\n线性回归的最简单形式是对数据点拟合一条直线。假设我们有向量 `x` 和 `y`，并且希望得到系数 `w[1]` 和 `w[2]`，使得\
  \ `y[i] = w[1] + w[2] x[i] + e[i]`，其中 `e` 是我们希望尽可能小的误差向量。当将其视为统计问题时，我们通常假设误差服从相同的正态分布，因此我们希望误差的方差最小。使用\
  \ `lm` 函数拟合线性模型时，你会得到权重 `w[1]` 和 `w[2]` 的最大似然值，但如果你希望进行贝叶斯统计，则应将此权重向量 `w` 视为一个随机变量，并根据\
  \ `x` 中的数据对其进行拟合，而 `y` 则意味着将其从先验分布更新为后验分布。\n\n线性回归权重的一个典型分布是正态分布。如果我们认为权重的多元正态分布是先验分布，那么给定数据后它们的后验分布也将是正态分布，这使得数学计算非常方便。\n\
  \n我们将假设 `w` 的先验分布是均值为零且分量独立的正态分布，因此协方差矩阵是对角矩阵。这意味着，平均而言，我们认为要拟合的直线是平坦的并通过平面原点，但我们对此信念的强弱取决于协方差矩阵中的值。我们将用一个所谓的超参数\
  \ `a` 来参数化它，该超参数是权重分量的精度（即方差的倒数）。协方差矩阵的对角线为 `1/a`，非对角线元素为零。\n\n我们可以将权重的分布表示为多元正态分布的均值和协方差矩阵，并像这样从精度构造先验分布：\n\
  \n```\nweight_distribution <- function(mu, S) {\nstructure(list(mu = mu, S = S),\
  \ class = \"wdist\")\n}\nprior_distribution <- function(a) {\nmu = c(0, 0)\nS =\
  \ diag(1/a, nrow = 2, ncol = 2)\nweight_distribution(mu, S)\n}\n```\n\n我们给权重分布指定了一个类，只是为了将其与普通列表区分开，除此之外没什么特别之处。\n\
  \n如果我们希望从此分布中采样，可以使用 `MASS` 包中的 `mvrnorm` 函数。\n\n```\nsample_weights <- function(n,\
  \ distribution) {\nMASS::mvrnorm(n = n,\nmu = distribution$mu,\nSigma = distribution$S)\n\
  }\n```\n\n我们可以尝试从先验分布中采样一些直线并绘制出来。当然，我们可以将采样的 `w` 向量绘制为平面上的点，但由于它们代表直线，我们将以直线形式展示它们（见图\
  \ 4-1）。\n\n![A451015_1_En_4_Fig1_HTML.jpg](img/A451015_1_En_4_Fig1_HTML.jpg)\n\n\
  **图 4-1.** 从直线的先验分布中采样的样本\n\n```\nprior <- prior_distribution(1)\n(w <- sample_weights(5,\
  \ prior))\n##            [,1]        [,2]\n## [1,]  0.6029080 -0.84085548\n## [2,]\
  \  0.4721664  1.38435934\n## [3,]  0.6353713 -1.25549186\n## [4,]  0.2857736  0.07014277\n\
  ## [5,] -0.1381082  1.71144087\nplot(c(-1, 1), c(-1, 1), type = 'n',\nxlab = '',\
  \ ylab = '')\nplot_lines <- function(w) {\nfor (i in 1:nrow(w)) {\nabline(a = w[i,\
  \ 1], b = w[i, 2])\n}\n}\nplot_lines(w)\n```\n\n当我们观察到匹配的 `X` 和 `y` 值形式的数据时，必须更新\
  \ `w` 向量以反映这一点，这意味着更新权重的分布。我不会推导数学公式（毕竟这不是一本数学教科书），但如果 `mu0` 是先验均值，`S0` 是先验协方差矩阵，那么后验均值和协方差矩阵的计算如下：\n\
  \n```\nS <- solve(S0 + b * t(X) %*% X)\nmu <- S %*% (solve(S0) %*% mu0 + b * t(X)\
  \ %*% y)\n```\n\n你无法直接执行这里的代码——它依赖于我们尚未定义的变量——但它是我们稍后定义的函数的主体。这涉及到一些线性代数，涉及先验分布和观测值。这些表达式中我们之前未见过的参数是\
  \ `b` 和 `X`。前者是误差项的精度——我们假设已知并用此超参数表示——后者则捕获了 `x` 值。我们不能单独使用 `x`，因为我们想用两个权重来表示直线。当我们将\
  \ `y[i]` 的估计值写成 `w[1] + w[2] * x[i]` 时，我们可以将其视为 `w` 和 `c(0, x[i])` 的向量积，这也正是我们实际做的。我们将所有\
  \ `x[i]` 表示为矩阵 `X` 中的行 `c(0, x[i])`。因此，在此记法中，我们估计 `y[i] = w[1] * X[i, 1] + w[2]\
  \ * X[i, 2]`，或者 `y = X %*% w`。\n\n作为拟合函数，我们可以这样编写：\n\n```\nfit_posterior <- function(x,\
  \ y, b, prior) {\nmu0 <- prior$mu\nS0 <- prior$S\nX <- matrix(c(rep(1, length(x)),\
  \ x), ncol = 2)\nS <- solve(S0 + b * t(X) %*% X)\nmu <- S %*% (solve(S0) %*% mu0\
  \ + b * t(X) %*% y)\nweight_distribution(mu = mu, S = S)\n}\n```\n\n我们可以尝试绘制一些点，将模型拟合到这些点，然后绘制从后验分布中采样的直线。与从先验分布采样的直线不同，这些直线现在应该落在点周围。用于拟合模型的点越多，从后验分布采样的直线落在点周围的紧密程度就越高（见图\
  \ 4-2）。\n\n![A451015_1_En_4_Fig2_HTML.jpg](img/A451015_1_En_4_Fig2_HTML.jpg)\n\n\
  **图 4-2.** 后验直线的样本\n\n```\nx <- rnorm(20)\ny <- 0.2 + 1.3 * x + rnorm(20)\nplot(x,\
  \ y)\nposterior <- fit_posterior(x, y, 1, prior)\nw <- sample_weights(5, posterior)\n\
  plot_lines(w)\n```\n\n我们在这里将权重的分布从先验分布更新为后验分布的方式，并不要求先验分布必须是我们使用变量 `a` 创建的精确分布。任何分布都可以用作先验，并且在贝叶斯统计中，随着数据不断增加而更新后验分布的情况并不少见。我们可以从刚刚创建的先验开始，将其拟合到一些数据上以获得后验分布。然后，如果我们获得更多数据，就可以将第一个后验分布作为先验来拟合更多数据，并得到一个新的后验分布，该分布捕获了我们从所有数据中获得的知识。如果我们一开始就拥有所有数据，这样做并没有特别的好处，但在数据流式传入的应用中，我们可以利用这一点，在每次新数据可用时快速更新我们的知识。\n\
  \n由于本书并非关于贝叶斯统计，并且我们仅将贝叶斯线性回归作为编写新统计模型的一个示例，因此我们不再对此进行深入探讨。\n\n\n\n## 模型矩阵\n\n我们拟合后验时使用的`X`矩阵就是所谓模型矩阵或设计矩阵的一个例子。以这种方式使用矩阵，将响应变量`y`拟合到某个表达式（此处为`1\
  \ + x`，从某种意义上说，我们使用了行`c(1, x[i])`）是一种通用的数据拟合方法。线性模型被称为线性，并非因为我们用一条直线拟合数据，而是因为我们拟合的权重（即`w`向量）在拟合模型中以数学意义上的线性方式被使用。如果我们将权重拟合到向量`w`，那么拟合出的直线由`X\
  \ %*% w`给出。也就是说，我们的直线是模型矩阵与权重向量的矩阵乘积。之所以得到一条直线，是因为`X`具有我们赋予它的形式，但对于一个线性模型而言，它并不一定要代表一条直线。我们可以在拟合模型之前，以任何想要的方式转换输入数据（此处为我们的向量`x`）。你可能以前用过对数变换，或者将数据拟合到多项式，这些也都是线性模型的例子。\n\
  \n如果你以不同的方式构建`X`矩阵，就可以使用我们上面编写的函数来拟合各种类型的转换后数据。只要每个数据点在`X`中成为一行，你做什么变换都没关系，数学原理是相同的。例如，要将二次方程而非直线拟合到数据，你只需让`X`的第\
  \ i 行变为`c(1, x[i], x[i]**2)`即可。\n\n在 R 中，你有一个非常强大的机制，可以根据公式构建模型矩阵。每当你使用类似`y ∼ x\
  \ + y`这样的公式将`y`拟合到两个变量`x`和`z`时，就使用到了这个特性。该公式会被转换为一个模型矩阵，一旦你得到了这个矩阵，执行模型拟合的代码就不需要再了解关于数据的任何其他信息。\n\
  \n用于将公式转换为模型矩阵的函数叫做`model.matrix`。尽管它的名字中有一个点，但它并不是一个泛型函数。只是由于历史原因，它有一个不太合适的名字。\n\
  \n该函数将公式作为输入，并生成一个模型矩阵。它会通过在其作用域中查找来获取公式中变量的值。我们可以像这样使用它：\n\n```\nx <- rnorm(5)\n\
  y <- 1.2 + 2 * x + rnorm(5)\nmodel.matrix(y ∼ x)\n##   (Intercept)          x\n\
  ## 1           1 -1.1365828\n## 2           1  0.8548304\n## 3           1 -0.5783704\n\
  ## 4           1  0.4963615\n## 5           1 -0.7600579\n## attr(,\"assign\")\n\
  ## [1] 0 1\n```\n\n不过，像这样依赖全局变量是有风险的编码方式，所以我们通常会将数据放入一个数据框中。\n\n```\nd <- data.frame(x,\
  \ y)\n```\n\n如果这样做，我们可以向`model.matrix`函数提供一个数据框，它会从其中获取变量。\n\n```\nmodel.matrix(y\
  \ ∼ x, data = d)\n##   (Intercept)          x\n## 1           1 -1.1365828\n## 2\
  \           1  0.8548304\n## 3           1 -0.5783704\n## 4           1  0.4963615\n\
  ## 5           1 -0.7600579\n## attr(,\"assign\")\n## [1] 0 1\n```\n\n如果公式中使用了的变量在数据框中未找到，`model.matrix`仍然会在调用作用域中查找缺失的变量，但这确实是风险极高的编码方式，因此你应该避免这样做。\n\
  \n公式决定了模型矩阵的构建方式。公式`y ∼ x`给出了我们上面使用的模型矩阵，其中第一列的 1 用于捕获截距，第二列是`x`值，用于捕获直线的斜率。我们可以使用公式`y\
  \ ∼ x - 1`来移除截距项：\n\n```\nmodel.matrix(y ∼ x - 1, data = d)\n##            x\n##\
  \ 1 -1.1365828\n## 2  0.8548304\n## 3 -0.5783704\n## 4  0.4963615\n## 5 -0.7600579\n\
  ## attr(,\"assign\")\n## [1] 1\n```\n\n我们也可以添加项；例如，可以通过构建以下模型矩阵来将二次公式拟合到数据：\n\n\
  ```\nmodel.matrix(y ∼ x + I(x**2), data = d)\n##   (Intercept)          x    I(x²)\n\
  ## 1           1 -1.1365828 1.2918205\n## 2           1  0.8548304 0.7307351\n##\
  \ 3           1 -0.5783704 0.3345123\n## 4           1  0.4963615 0.2463748\n##\
  \ 5           1 -0.7600579 0.5776881\n## attr(,\"assign\")\n## [1] 0 1 2\n```\n\n\
  在这里，我们需要将平方后的`x`包裹在函数`I`中，以便让 R 使用`x`实际平方后的值。在公式内部，乘积项会被解释为交互作用，但通过将`x**2`包裹在`I`中，我们明确地使其成为了`x`值的平方。\n\
  \n模型矩阵不包含响应变量`y`，因此我们无法从中获取它。相反，我们可以使用一个相关的函数`model.frame`，它也会为我们提供一个响应变量的列。\n\n\
  ```\nmodel.frame(y ∼ x + I(x**2), data = d)\n##            y          x       I(x²)\n\
  ## 1 -1.4145519 -1.1365828 1.291820....\n## 2  0.8073317  0.8548304 0.730735....\n\
  ## 3 -0.2584431 -0.5783704 0.334512....\n## 4  0.9203396  0.4963615 0.246374....\n\
  ## 5 -0.5997820 -0.7600579 0.577688....\n```\n\n然后，你可以使用函数`model.response`提取响应变量，如下所示：\n\
  \n```\nmodel.response(model.frame(y ∼ x + I(x**2), data = d))\n##          1   \
  \       2          3          4\n## -1.4145519  0.8073317 -0.2584431  0.9203396\n\
  ##          5\n## -0.5997820\n```\n\n有了这些机制，我们可以推广我们的分布和模型拟合，使其能够处理通用的公式。我们可以像这样编写先验函数：\n\
  \n```\nprior_distribution <- function(formula, a, data) {\nn <- ncol(model.matrix(formula,\
  \ data = data))\nmu <- rep(0, n)\nS <- diag(1/a, nrow = n, ncol = n)\nweight_distribution(mu,\
  \ S)\n}\n```\n\n理想情况下，先验不应依赖于任何数据，但模型矩阵的形式确实依赖于我们使用的数据类型。数值型数据在模型矩阵中会表示为单列，而因子在公式中则会针对每个水平处理为一个二元向量，因此我们确实需要知道将要处理的是哪种类型的数据。我们本可以将`n`作为一个参数添加进来，使函数独立于任何数据，但我选择了包含一个数据框作为另一种解决方案。不过，我们并不使用实际的数据；我们只是用它来获取模型框架中的列数。\n\
  \n然而，用于拟合数据的函数变化较小。它只是使用`model.matrix`函数来构建模型矩阵，而不是像之前那样显式构建。\n\n```\nfit_posterior\
  \ <- function(formula, b, prior, data) {\nmu0 <- prior$mu\nS0 <- prior$S\nX <- model.matrix(formula,\
  \ data = data)\nS <- solve(S0 + b * t(X) %*% X)\nmu <- S %*% (solve(S0) %*% mu0\
  \ + b * t(X) %*% y)\nweight_distribution(mu = mu, S = S)\n}\n```\n\n有了这些之后，我们可以像以前一样拟合一条直线，但现在使用的是公式。\n\
  \n```\nd <- {\nx <- rnorm(5)\ny <- 1.2 + 2 * x + rnorm(5)\ndata.frame(x = x, y =\
  \ y)\n}\nprior <- prior_distribution(y ∼ x, 1, d)\nposterior <- fit_posterior(y\
  \ ∼ x, 1, prior, d)\nposterior\n## $mu\n##                  [,1]\n## (Intercept)\
  \ 1.1979166\n## x           0.2875647\n##\n## $S\n##             (Intercept)   \
  \        x\n## (Intercept)  0.16935519 -0.04441203\n## x           -0.04441203 \
  \ 0.73364645\n##\n## attr(,\"class\")\n## [1] \"wdist\"\n```\n\n相反，如果我们想拟合一个二次函数，我们不需要修改任何函数，只需提供一个不同的公式即可。\n\
  \n```\nprior <- prior_distribution(y ∼ x + I(x**2), 1, d)\nposterior <- fit_posterior(y\
  \ ∼ x + I(x**2), 1, prior, d)\nposterior\n## $mu\n##                  [,1]\n## (Intercept)\
  \ 1.1906733\n## x           0.2815418\n## I(x²)      0.1185518\n##\n## $S\n##  \
  \           (Intercept)           x      I(x²)\n## (Intercept)  0.17301554 -0.04136841\
  \ -0.05990922\n## x           -0.04136841  0.73617725 -0.04981521\n## I(x²)    \
  \  -0.05990922 -0.04981521  0.98053972\n##\n## attr(,\"class\")\n## [1] \"wdist\"\
  \n```\n\n\n\n## 构建拟合模型对象\n\n现在，我们希望将拟合后的模型封装到一个类中，以便为其编写构造函数。对于拟合模型，传统上会将公式、数据和函数调用与拟合模型一同包含，因此我们将把这些内容作为对象的属性。构造函数可以如下所示：\n\
  \n```\nblm <- function(formula, b, data, prior = NULL, a = NULL) {\n  if (is.null(prior))\
  \ {\n    if (is.null(a)) stop(\"未提供先验时，必须提供 a 参数。\")\n    prior <- prior_distribution(formula,\
  \ a, data)\n  } else {\n    if (inherits(prior, \"blm\")) {\n      prior <- prior$prior\n\
  \    }\n  }\n  if (!inherits(prior, \"wdist\")) {\n    stop(\"提供的先验分布类型不符合预期。\"\
  )\n  }\n  posterior <- fit_posterior(formula, b, prior, data)\n  structure(\n  \
  \  list(formula = formula,\n         data = model.frame(formula, data),\n      \
  \   dist = posterior,\n         call = match.call()),\n    class = \"blm\"\n  )\n\
  }\n```\n\n构造函数开头的检查允许我们将先验指定为正态分布或一个先前拟合的 `blm` 对象。如果获得一个先验分布，我们可能还应检查该先验是否与实际公式兼容，不过我会让您自行编写这样的检查来尝试一下。\n\
  \n如果打印使用 `blm` 函数拟合的对象，它们会以列表形式输出，但我们可以通过特化 `print` 泛型函数来提供自己的 `print` 函数。按惯例，这里应输出用于指定模型的函数调用，因此目前我仅实现此功能。\n\
  \n```\nprint.blm <- function(x, ...) {\n  print(x$call)\n}\n```\n\n我们必须与泛型函数的参数匹配，这就是为什么参数是\
  \ `x` 和 `...`。不过我们做的仅仅是打印对象的 `call` 属性。\n\n现在，我们可以像这样拟合数据并获取一个 `blm` 对象：\n\n```\n\
  (model <- blm(y ~ x + I(x**2), a = 1, b = 1, data = d))\n## blm(formula = y ~ x\
  \ + I(x²), b = 1, data = d, a = 1)\n```\n\n## 系数与置信区间\n\n一旦有了拟合模型，我们可能希望获取拟合值。传统上，这通过泛型函数\
  \ `coef` 实现，它应直接返回这些值。对于贝叶斯线性回归模型，拟合值是完整的分布，但我们可以取均值作为点估计并返回，因此可以这样实现 `coef` 函数：\n\
  \n```\ncoef.blm <- function(object, ...) {\n  t(object$dist$mu)\n}\ncoef(model)\n\
  ##      (Intercept)         x    I(x²)\n## [1,]    1.190673 0.2815418 0.1185518\n\
  ```\n\n这里，我转置了均值矩阵，使系数的格式与传统线性模型（使用 `lm` 函数拟合）得到的格式相似，除此之外，该函数仅返回均值。\n\n对于经典的频率学派模型，我们通常还需要参数的置信区间，传统上使用\
  \ `confint` 函数获取。该函数的签名如下：\n\n```\nconfint(object, parm, level = 0.95, ...)\n```\n\
  \n`object` 参数是拟合模型，`parm` 包含我们需要置信区间的参数。如果缺失，应返回所有模型参数，而 `level` 参数指定了置信水平。\n\n\
  同样，对于贝叶斯模型，我们拥有完整的分布而不仅仅是置信区间，但我们可以通过获取每个参数边缘分布的分位数来获得类似结果。参数服从正态分布，我们可以分别从均值和协方差矩阵中获取均值和标准差。之后，我们可以使用\
  \ `qnorm` 函数获取分位数，并像这样构建区间：\n\n```\nconfint.blm <- function(object, parm, level\
  \ = 0.95, ...) {\n  if (missing(parm)) {\n    parm <- rownames(object$dist$mu)\n\
  \  }\n  means <- object$dist$mu[parm,]\n  sds <- sqrt(diag(object$dist$S)[parm])\n\
  \  lower_q <- qnorm(p = (1-level)/2,\n                   mean = means,\n       \
  \            sd = sds)\n  upper_q <- qnorm(p = 1 - (1-level)/2,\n              \
  \     mean = means,\n                   sd = sds)\n  quantiles <- cbind(lower_q,\
  \ upper_q)\n  quantile_names <- paste(\n    100 * c((1-level)/2, 1 - (1 -level)/2),\n\
  \    \"%\",\n    sep = \"\"\n  )\n  colnames(quantiles) <- quantile_names\n  quantiles\n\
  }\nconfint(model)\n##                   2.5%    97.5%\n## (Intercept)  0.3754236\
  \ 2.005923\n## x           -1.4001225 1.963206\n## I(x²)      -1.8222478 2.059351\n\
  ```\n\n\n\n## 预测响应变量\n\n当涉及到对新数据的响应变量进行预测时，模型矩阵还需要进行一些额外工作。如果在创建模型矩阵时我们没有响应变量，即使模型矩阵实际上并不包含该变量的列，也会收到错误信息。如果我们删除之前创建数据框时使用的\
  \ `x` 和 `y` 变量，就能看到这一点。\n\n```\nrm(x) ; rm(y)\n```\n\n如果我们从包含 `x` 和 `y` 的数据框构建模型矩阵，则没有问题。\n\
  \n```\nmodel.matrix(y ∼ x + I(x**2), data = d)\n##   (Intercept)           x   \
  \   I(x²)\n## 1           1 -0.20409732 0.041655716\n## 2           1 -0.22561419\
  \ 0.050901761\n## 3           1  0.34702845 0.120428747\n## 4           1  0.03236784\
  \ 0.001047677\n## 5           1  0.41353129 0.171008128\n## attr(,\"assign\")\n\
  ## [1] 0 1 2\n```\n\n然而，如果我们创建一个只包含 `x` 值的数据框，就会收到错误。\n\n```\ndd <- data.frame(x\
  \ = rnorm(5))\nmodel.matrix(y ∼ x + I(x**2), data = dd)\n## Error in eval(expr,\
  \ envir, enclos): object 'y' not found\n```\n\n这当然是个问题，因为我们的兴趣恰恰是在没有响应变量时对其进行预测。这颇具讽刺意味，因为模型矩阵实际上从不包含响应变量；尽管如此，这就是\
  \ R 的工作方式。\n\n要在构建模型矩阵之前从公式中移除响应变量，我们需要使用 `delete.response()` 函数。不幸的是，这个函数不能直接作用于公式，而是作用于所谓的“项”（terms）对象。我们可以使用\
  \ `terms()` 函数将公式转换为它的项。因此，要从公式中移除项，我们需要采用以下结构：\n\n```\ndelete.response(terms(y\
  \ ∼ x))\n```\n\n结果是一个 `terms` 对象，但由于 `terms` 类是 `formula` 类的特化，我们可以直接将其与 `model.matrix()`\
  \ 函数一起使用来构建模型矩阵。\n\n```\nmodel.matrix(delete.response(terms(y ∼ x)), data = dd)\n\
  ##   (Intercept)           x\n## 1           1  0.49841617\n## 2           1 -1.74230249\n\
  ## 3           1  0.97552910\n## 4           1 -0.02408287\n## 5           1  0.67568448\n\
  ## attr(,\"assign\")\n## [1] 0 1\n```\n\n现在，对于实际预测数据，我们传统上使用 `predict()` 泛型函数。该函数具有以下签名：\n\
  \n```\nfunction(object, ...)\n```\n\n坦率地说，这没什么用。不过，我们可以像 `lm` 类那样为其添加参数，向其添加一个 `newdata`\
  \ 参数。我们将根据 `newdata` 构建一个模型矩阵，并对其中的数据进行预测。如果我们只需要新数据的点估计值，可以简单地计算权重均值与模型矩阵每一行的内积，因此我们可以像这样实现\
  \ `predict()` 函数：\n\n```\npredict.blm <- function(object, newdata, ...) {\n  updated_terms\
  \ <- delete.response(terms(object$formula))\n  X <- model.matrix(updated_terms,\
  \ data = newdata)\n  predictions <- vector(\"numeric\", length = nrow(X))\n  for\
  \ (i in seq_along(predictions)) {\n    predictions[i] <- t(object$dist$mu) %*% X[i,]\n\
  \  }\n  predictions\n}\npredict(model, d)\n## [1] 1.138150 1.133188 1.302653 1.199910\
  \ 1.327373\n```\n\n为了检查模型，我们可以将预测值与真实响应值绘制成图。不过，对于我们目前使用的只有五个数据点的数据，我们预期预测效果不会特别好，也不指望这样的图能展示多少信息，但我们可以尝试使用更多的数据点（见图\
  \ 4-3）。\n\n![A451015_1_En_4_Fig3_HTML.jpg](img/A451015_1_En_4_Fig3_HTML.jpg)\n\n\
  图 4-3. 真实值与预测值对比\n\n```\nd <- {\n  x <- rnorm(50)\n  y <- 0.2 + 1.4 * x + rnorm(50)\n\
  \  data.frame(x = x, y = y)\n}\nmodel <- blm(y ∼ x, d, a = 1, b = 1)\nplot(d$y,\
  \ predict(model, d),\n     xlab = \"真实响应\",\n     ylab = \"预测响应\")\n```\n\n对原始数据进行预测非常常见，以至于存在另一个用于此目的的泛型函数，名为\
  \ `fitted()`。我们可以这样实现它：\n\n```\nfitted.blm <- function(object, ...) {\n  predict(object,\
  \ newdata = object$data, ...)\n}\n```\n\n有了这个函数，我们可以像下面这样创建图表：\n\n```\nplot(d$y,\
  \ fitted(model),\n     xlab = \"真实响应\",\n     ylab = \"预测响应\")\n```\n\n当然，我们能做的不仅仅是预测点估计值。我们有一个权重分布，这意味着直线的斜率和截距并非固定不变。至少在概念上，它们是从一个分布中抽取的。斜率微小的变化，对于数据主体部分附近的预测准确性影响不大，但靠近数据边缘的数据点则会因此产生更大的不确定性。在进行预测时，我们可以将此分布考虑在内，从而获得预测的误差条。如果\
  \ `X` 是模型矩阵，`S` 是后验的协方差矩阵，那么第 i 个预测值的方差由下式给出：\n\n```\n1/b + t(X[i,]) %*% S %*% X[i,]\n\
  ```\n\n我们并没有在拟合的模型对象中存储精度参数 `b`，所以如果想获取误差条，需要将其保留下来。因此，请更新你的 `blm()` 函数，使其返回如下结构：\n\
  \n```\nstructure(\n  list(formula = formula,\n       data = model.frame(formula,\
  \ data),\n       dist = posterior,\n       precision = b,\n       call = match.call()),\n\
  \  class = \"blm\"\n)\n```\n\n现在，我们可以扩展我们的 `predict()` 函数，增加一个选项，当该选项为 `TRUE` 时，也返回置信区间：\n\
  \n```\npredict.blm <- function(object, newdata,\n                        intervals\
  \ = FALSE,\n                        level = 0.95,\n                        ...)\
  \ {\n  updated_terms <- delete.response(terms(object$formula))\n  X <- model.matrix(updated_terms,\
  \ data = newdata)\n  predictions <- vector(\"numeric\", length = nrow(X))\n  for\
  \ (i in seq_along(predictions)) {\n    predictions[i] <- t(object$dist$mu) %*% X[i,]\n\
  \  }\n  if (!intervals) return(predictions)\n  S <- model$dist$S\n  b <- model$precision\n\
  \  sds <- vector(\"numeric\", length = nrow(X))\n  for (i in seq_along(predictions))\
  \ {\n    sds[i] <- sqrt(1/b + t(X[i,]) %*% S %*% X[i,])\n  }\n  lower_q <- qnorm(p\
  \ = (1-level)/2,\n                   mean = predictions,\n                   sd\
  \ = sds)\n  upper_q <- qnorm(p = 1 - (1-level)/2,\n                   mean = predictions,\n\
  \                   sd = sds)\n  intervals <- cbind(lower_q, predictions, upper_q)\n\
  \  colnames(intervals) <- c(\"lower\", \"mean\", \"upper\")\n  as.data.frame(intervals)\n\
  }\nmodel <- blm(y ∼ x, d, a = 1, b = 1)\n```\n\n有了这个 `predict()` 函数，我们还可以在预测值周围绘制误差条，参见图\
  \ 4-4。在该图中，我还绘制了 `x = y` 的直线。如果预测准确，数据点应落在这条线上。由于数据中存在一些随机性，我们不期望完全落在线上，但我们期望在 95%\
  \ 的时间内该线能与误差条重叠。\n\n![A451015_1_En_4_Fig4_HTML.jpg](img/A451015_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4. 带置信区间的预测值与真实值对比\n\n```\nrequire(ggplot2)\npredictions <- fitted(model,\
  \ intervals = TRUE)\nggplot(cbind(data.frame(y = d$y), predictions),\n       aes(x\
  \ = y, y = mean)) +\n  geom_point() +\n  geom_errorbar(aes(ymin = lower, ymax =\
  \ upper)) +\n  geom_abline(slope = 1) +\n  xlab(\"真实响应\") +\n  ylab(\"预测值\") +\n\
  \  theme_minimal()\n```\n\n当然，对于统计模型，我们能做的还有很多，还可以为其添加更多泛型函数，为模型类提供统一的接口。但我希望这个示例至少能让你了解到，将模型表示为一个类是多么有用。\n\
  \n\n\n"
- "# 5. 运算符重载\n\n重载运算符，即赋予 `+` 或 `-` 等运算符新的或额外的功能，本质上并非面向对象特性。但由于这可以看作是为函数增加了多态性，因此在学习了基于泛型函数的多态之后，在此处讨论运算符重载显得顺理成章。\n\
  \n关于运算符重载是优是劣，众说纷纭。有些语言支持重载，有些则不支持。有些语言允许你创建自己的中缀运算符，但不能修改现有运算符；还有些语言则前后矛盾，允许对内置对象进行某些运算符重载，却不允许对用户自定义对象进行重载。反对重载的一个论点是运算符的预期行为。我们对\
  \ `+` 代表加法这一概念根深蒂固，以至于无法接受它同时表示字符串拼接。当然，这种论点忽略了我们早已习惯用 `+` 同时进行整数和浮点数的加法。另一个论点，在我看来也更站得住脚，是记住运算符的功能比记住函数的功能更难，因为函数名至少能给我们一些关于其用途的提示。事实上，如果使用得当，中缀运算符能提供比简单函数调用更便捷的语法。你可能会觉得\
  \ `2 * x + 5` 比 `plus(times(2, x), 5)` 更易读，而且大多数编程语言（Lisp 方言是明显的例外）也更倾向于前者。对于用户自定义或用户重载的运算符也是如此。使用\
  \ `magrittr` 的管道运算符 `%>%` 能让分析工作流程更易读，而 `ggplot2` 对 `+` 的重载则让绘图代码更清晰易读。\n\n由于在 R\
  \ 中既可以重载现有运算符，也可以创建新运算符，因此你需要针对每种情况选择最合适的方式。我的经验法则是：除非使用现有运算符感觉自然，否则优先考虑使用新的中缀运算符。当然，这完全是主观判断，但有些运算看起来确实像是“加法”——我认为在\
  \ `ggplot2` 中组合图层可以归为此类——而其他像 `magrittr` 中的管道运算则不然。这需要你做出判断，你也可以不断尝试代码，看看哪种方式最自然。\n\
  \n本章我们将学习如何重载运算符。我不会介绍如何创建中缀运算符。如果你对此感兴趣，可以参考我的《R 函数式编程》一书。\n\n## 函数与运算符\n\nR 中的每个操作都涉及函数调用。控制结构、下标操作，甚至括号都与函数有关，同样，运算符也涉及函数调用。这意味着运算符可以被重写。你可以通过定义\
  \ `+` 的一个新版本，来替换 `+` 的现有实现。但你确实不应该这么做。用用户自定义的运算符替换内置运算符会影响你所有的代码，拖慢速度，并且极易引入难以发现的错误。不过，为你自己的类定义运算符并不需要这样操作。运算符是泛型的，你可以定义它们的特化版本，实现任何运算符应如何处理你定义的新类。\n\
  \n为了说明如何实现，我们定义一个用于“取模 n”的算术类。这里我假设 `value` 是某种数值类型——在生产代码中，我们会为此编写测试，但在示例中，我们只是隐式地这么假设——然后我们使用一个属性来存储模数\
  \ `n`。接着计算 `value` 对 `n` 取模的结果，设置类，并返回结果。\n\n```\nmodulus <- function(value, n)\
  \ {\n  result <- value %% n\n  attr(result, \"modulus\") <- n\n  class(result) <-\
  \ c(\"modulus\", class(value))\n  result\n}\n```\n\n为了美观地打印该类的值，我们定义了 `print` 方法。我们想要以底层类型的方式打印值\
  \ `x`，但上方附带一行显示 `n`。如果直接调用 `print(x)`，我们会递归回到 `print.modulus`，因为 `x` 的类型就是 `modulus`。但我们可以使用\
  \ `unclass` 函数来移除 `x` 的类型。不过，这并不能完全去掉类型。如果 `x` 是数值类型，`unclass` 只会将其降级为该类型。当我们打印带有属性的原始值时，属性也会被打印出来，所以我们在打印降级后的\
  \ `x` 之前需要去掉所有属性。这里我们可以直接调用 `print(x)`，但使用 `NextMethod()` 也行，我在这里就用了这个方法。\n\n```\n\
  print.modulus <- function(x, ...) {\n  cat(\"Modulus\", attr(x, \"modulus\"), \"\
  values:\\n\")\n  # 移除属性以获得纯数值打印效果\n  x <- unclass(x)\n  attributes(x) <- NULL\n\
  \  NextMethod()\n}\n(x <- modulus(1:6, 3))\n## Modulus 3 values:\n## [1] 1 2 0 1\
  \ 2 0\n```\n\n### 定义单个运算符\n\n我们可以通过定义函数 `` `+.modulus` `` 来定义加法对此类型意味着什么：\n\n```\n\
  `+.modulus` <- function(x, y) {\n  n <- attr(x, \"modulus\")\n  x <- unclass(x)\n\
  \  y <- unclass(y)\n  modulus(x + y, n)\n}\n```\n\n我们首先从 `x` 中获取 `n`。然后移除两个操作数的类信息，以便调用原始的\
  \ `+` 来计算它们的和。如果不这样做，当我们尝试将 `x` 与 `y` 相加时，又会发生递归，然后我们只需计算结果，并使用 `modulus` 构造函数返回具有正确类型的结果。\n\
  \n这类运算符函数的分派与我们之前看到的泛型函数略有不同。在泛型函数中，分派基于第一个参数的类型（除非你明确指定其他方式），但对于运算符，分派基于两个操作数的类型。如果两个操作数都有实现了某个运算符的类，那么它们的类必须相同。如果只有一个操作数有类（这里\
  \ `\"numeric\"` 或 `\"integer\"` 这样的原始类不计算在内），则分派基于该操作数进行。因此，如果 `x` 的类型是 `\"modulus\"\
  `，那么 `x + 1:6` 和 `1:6 + x` 都会调用 `` `+.modulus` ``。\n\n```\nx + 1:6\n## Modulus 3\
  \ values:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus values:\n## numeric(0)\n```\n\
  \n第一个表达式符合预期，但第二个却没有。这不是因为分派没起作用，而是因为我们只从第一个操作数中获取了 `n`。由于我们只能保证两个操作数中有一个是 `\"modulus\"\
  ` 类型，所以我们需要同时检查两个操作数。我们可以简单地通过检查属性 `\"modulus\"` 是否为 `NULL` 来实现：\n\n```\n`+.modulus`\
  \ <- function(x, y) {\n  n <- ifelse(!is.null(attr(x, \"modulus\")),\n         \
  \     attr(x, \"modulus\"), attr(y, \"modulus\"))\n  x <- unclass(x)\n  y <- unclass(y)\n\
  \  modulus(x + y, n)\n}\nx + 1:6\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n1:6\
  \ + x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n```\n\n根据我们想让这些类型的加法具有何种语义，我们可能不希望允许具有不同\
  \ `n` 的类型相加。如果按照目前的方式相加，`n` 是从第一个操作数中取得的。\n\n```\ny <- modulus(1:6, 2)\nx + y\n\
  ## Modulus 3 values:\n## [1] 2 2 1 1 0 0\n```\n\n通过增加一点检查，我们可以确保两个操作数是兼容的：\n\n```\n\
  `+.modulus` <- function(x, y) {\n  nx <- attr(x, \"modulus\")\n  ny <- attr(y, \"\
  modulus\")\n  if (!is.null(nx) && !is.null(ny) && nx != ny)\n    stop(\"Incompatible\
  \ types\")\n  n <- ifelse(!is.null(nx), nx, ny)\n  x <- unclass(x)\n  y <- unclass(y)\n\
  \  modulus(x + y, n)\n}\nx + y\n## Error in `+.modulus`(x, y): Incompatible types\n\
  y <- modulus(rev(1:6), 3)\nx + y\n## Modulus 3 values:\n## [1] 1 1 1 1 1 1\n```\n\
  \n\n\n### 分组运算符\n\n通过使用泛型函数，我们可以为用户自定义类型定义所有相关的运算符，但也可以在一个单独的函数`Ops`中处理所有运算符。这个函数被称为“分组泛型方法”（group\
  \ generic method），因为它处理一组泛型函数；其他分组方法还包括`Math`、`Complex`和`Summary`，这些我们在此不作详述。\n\n\
  如果我们定义了函数`Ops.modulus`，那么对于`modulus`对象中未定义运算符函数的所有运算符，都会调用该函数。也就是说，如果我们像上面那样定义了``\
  \ `+.modulus` ``，那么该函数将优先于`Ops.modulus`被调用；但除此之外，如果其中一个操作数或两个操作数都是`modulus`类型，则会调用`Ops.modulus`。\n\
  \n我们可以这样定义它：\n\n```\nOps.modulus <- function(e1, e2) {\nnx <- attr(e1, \"modulus\"\
  )\nny <- attr(e2, \"modulus\")\nif (!is.null(nx) && !is.null(ny) && nx != ny)\n\
  stop(\"Incompatible types\")\nn <- ifelse(!is.null(nx), nx, ny)\nresult <- unclass(NextMethod())\
  \ %% n\nmodulus(result, n)\n}\n```\n\n函数开头的输入值测试与`` `+.modulus` ``相同。测试之后，我们使用`NextMethod`来调用基于底层类型的运算。这会将`modulus`类从操作数中剥离，并执行我们当前处理的任何运算。我们对结果使用`unclass`，这是必需的，因为结果会继承`Ops`操作数的属性，如果不这样做，结果将具有`modulus`类，然后我们计算模`n`。如果不使用`unclass`，这将变成一个递归调用，但由于我们去除了类，我们只是在底层类型上进行取模运算。最后，我们创建一个结果的`modulus`对象。\n\
  \n定义了此函数后，我们就能一次性获得所有二元运算符。\n\n```\ny <- modulus(rev(1:6), 3)\nx - y\n## Modulus\
  \ 3 values:\n## [1] 1 0 2 1 0 2\nx * y\n## Modulus 3 values:\n## [1] 0 1 0 0 1 0\n\
  ```\n\n这也包括比较运算符：\n\n```\nx == y\n## Modulus 3 values:\n## [1] 0 1 0 0 1 0\nx ==\
  \ x\n## Modulus 3 values:\n## [1] 1 1 1 1 1 1\nx != y\n## Modulus 3 values:\n##\
  \ [1] 1 0 1 1 0 1\nx != x\n## Modulus 3 values:\n## [1] 0 0 0 0 0 0\n```\n\n它甚至还包括一元运算符。然而，如果我们使用一元负号，参数`e2`在函数调用中将会缺失，而我们现在并未正确处理这种情况。\n\
  \n```\n- x\n## Error in Ops.modulus(x): argument \"e2\" is missing, with no default\n\
  ```\n\n不过，我们只需检查`e2`是否缺失，就能轻松修复此问题。除此之外，该函数将按原样工作。\n\n```\nOps.modulus <- function(e1,\
  \ e2) {\nnx <- attr(e1, \"modulus\")\nny <- if (!missing(e2)) attr(e2, \"modulus\"\
  ) else NULL\nif (!is.null(nx) && !is.null(ny) && nx != ny)\nstop(\"Incompatible\
  \ types\")\nn <- ifelse(!is.null(nx), nx, ny)\nresult <- unclass(NextMethod()) %%\
  \ n\nmodulus(result, n)\n}\n- x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n```\n\
  \n### 单位示例\n\n以一个稍微复杂的示例来说明，我们定义一个用于将物理单位与数值关联的类。这将使我们能够检查所操作的单位是否兼容——这样我们就不会将米与秒相减等——并将单位分析作为算术运算的一部分。这个示例是`units`包的简化版本。`units`包还处理单位换算和单位化简。在这里，我们仅实现符号单位的简单算术运算及其简单的相等性检查。\n\
  \n其思路是表示物理单位，然后将它们与数值关联起来。这里的物理单位指的是诸如平方公里、米每秒等单位。通常，这些将是符号表达式，但我们只考虑稍简单的情况，即单位是物理常数的分数。在这种情况下，我们可以将它们表示为分子项列表和分母项列表。如果我们始终保持这些列表有序，我们就有了它们的规范表示，并且可以通过检查分子和分母列表的相等性来检查两个单位是否相等。我们可以像这样实现构造函数：\n\
  \n```\nsymbolic_unit <- function(nominator, denominator = \"\") {\nnon_empty <-\
  \ function(x) x != \"\"\nnominator <- sort(Filter(non_empty, nominator))\ndenominator\
  \ <- sort(Filter(non_empty, denominator))\nstructure(list(nominator = nominator,\n\
  denominator = denominator),\nclass = \"symbolic_unit\")\n}\n```\n\n我们可以将这些单位转换为分数形式的字符串表示，以便美观地打印输出。\n\
  \n```\nas.character.symbolic_unit <- function(x, ...) {\nformat_terms <- function(terms,\
  \ op) {\nif (length(terms) == 0) return(\"1\")\npaste0(terms, collapse = op)\n}\n\
  nominator <- format_terms(x$nominator, \"*\")\ndenominator <- format_terms(x$denominator,\
  \ \"/\")\npaste(nominator, \"/\", denominator)\n}\nprint.symbolic_unit <- function(x,\
  \ ...) {\ncat(as.character(x, ...), \"\\n\")\n}\n(x <- symbolic_unit(\"m\"))\n##\
  \ m / 1\n(y <- symbolic_unit(\"m\", \"s\"))\n## m / s\n```\n\n比较两个符号单位涉及检查分子和分母是否相等。\n\
  \n```\n`==.symbolic_unit` <- function(x, y) {\nif (!(inherits(x, \"symbolic_unit\"\
  ) &&\ninherits(y, \"symbolic_unit\")))\nstop(\"Incompatible types\")\nreturn(identical(x$nominator,\
  \ y$nominator) &&\nidentical(x$denominator, y$denominator))\n}\n`!=.symbolic_unit`\
  \ <- function(x, y) !(x == y)\nx == y\n## [1] FALSE\nx != y\n## [1] TRUE\n```\n\n\
  物理量的加减运算只有在它们具有相同单位时才可能进行，但单位之间的乘除运算则始终可行。得到的单位是通过对（符号）单位执行与对数量相同的操作来获得的。为了能够处理这个问题，我们在符号单位上定义了乘法和除法。\n\
  \n```\n`*.symbolic_unit` <- function(x, y) {\nsymbolic_unit(c(x$nominator, y$nominator),\n\
  c(x$denominator, y$denominator))\n}\n`/.symbolic_unit` <- function(x, y) {\nsymbolic_unit(c(x$nominator,\
  \ y$denominator),\nc(x$denominator, y$nominator))\n}\nx * y\n## m*m / s\nx / y\n\
  ## m*s / m\n```\n\n现在，表示单位所需的一切都已就绪。我们只需定义用于将单位与数量关联的类。这个类与我们之前编写的`modulus`类非常相似。我们取一个（数值）值，在属性中关联一个符号单位，并设置类。\n\
  \n```\nunits <- function(value, nominator, denominator = \"\") {\nattr(value, \"\
  units\") <- symbolic_unit(nominator, denominator)\nclass(value) <- c(\"units\",\
  \ class(value))\nvalue\n}\n```\n\n美观打印输出遵循我们在`modulus`中看到的模式。我们需要剥离类和属性，以使用通过`NextMethod`调用的底层打印方法，但仅此而已。\n\
  \n```\nprint.units <- function(x, ...) {\ncat(\"Units: \", as.character(attr(x,\
  \ \"units\")), \"\\n\")\n# remove attributes to get plain numeric printing\nx <-\
  \ unclass(x)\nattributes(x) <- NULL\nNextMethod()\n}\n(x <- units(1:6, \"m\"))\n\
  ## Units:  m / 1\n## [1] 1 2 3 4 5 6\n```\n\n\n\n## 处理 `units` 的运算符\n\n处理 `units`\
  \ 的运算符仅比处理 `modulus` 稍显复杂。我们需要区分两种运算符：一种要求单位匹配，另一种则需要构造新单位。前者是加法、减法和比较运算（假设我们只认为在数量和关联单位上都一致的数值相等）；后者是乘法和除法，其结果单位必须根据操作数计算得出。如何处理物理量上的逻辑运算符并不明确（如果这甚至有意义的话），因此对于不属于这两类的运算符，我们应默认使用底层类型的处理方式。\n\
  \n我们使用 `Ops` 组函数来实现这些运算符。在此函数内部，我们可以通过变量 `.Generic` 获取正在评估的实际运算符。这不是函数的参数，但在函数被调用时会被设置为正在评估的运算符，我们可以通过\
  \ switch 检查该运算符并进行相应处理。\n\n```\nOps.units =\", \">\")) {\nif (!is.null(su1) && !is.null(su2)\
  \ && su1 != su2)\nstop(\"Incompatible units\")\nsu <- ifelse(!is.null(su1), su1,\
  \ su2)\nreturn(NextMethod())\n}\nif (.Generic == \"*\" || .Generic == \"/\") {\n\
  if (is.null(su1))\nsu1 <- symbolic_unit(\"\")\nif (is.null(su2))\nsu2 <- symbolic_unit(\"\
  \")\nsu <- switch(.Generic, \"*\" = su1 * su2, \"/\" = su1 / su2)\nresult <- NextMethod()\n\
  attr(result, \"units\") <- su\nreturn(result)\n}\n# 对于剩余运算符，我们没有很好的方法处理单位，\n# 因此移除该信息，回归到数值本身\n\
  e1 <- unclass(e1)\ne2 <- unclass(e2)\nattributes(e1) <- attributes(e2) <- NULL\n\
  NextMethod()\n}\n```\n\n通过这种单位运算符的定义，我们可以将单位与标量结合：\n\n```\n2 * x\n## Units:  m /\
  \ 1\n## [1]  2  4  6  8 10 12\nx + 2\n## Units:  m / 1\n## [1] 3 4 5 6 7 8\nx -\
  \ 2\n## Units:  m / 1\n## [1] -1  0  1  2  3  4\n```\n\n如果我们尝试将两个类型不兼容的量相加，将会收到警告，提示这是不正确的。\n\
  \n```\n(y <- units(1:6, \"m\", \"s\"))\n## Units:  m / s\n## [1] 1 2 3 4 5 6\nx\
  \ + y\n## Error in Ops.units(x, y): Incompatible units\n```\n\n然而，当单位兼容时，我们可以进行加法和减法。\n\
  \n```\n(z <- units(1:6, \"m\"))\n## Units:  m / 1\n## [1] 1 2 3 4 5 6\nx + z\n##\
  \ Units:  m / 1\n## [1]  2  4  6  8 10 12\nx - z\n## Units:  m / 1\n## [1] 0 0 0\
  \ 0 0 0\n```\n\n乘法和除法始终允许进行，结果单位由操作数推导得出。\n\n```\n2 * x\n## Units:  m / 1\n## [1]\
  \  2  4  6  8 10 12\nx * y\n## Units:  m*m / s\n## [1]  1  4  9 16 25 36\nx / y\n\
  ## Units:  m*s / m\n## [1] 1 1 1 1 1 1\n```\n\n"
- '# S4 类


  S3 类体系是面向对象编程的狂野西部。类层次结构仅通过 `class` 属性隐式存在，泛型方法可由任何类实现或不实现，且无需检查接口和类层次结构设计是否正确实现。一切都依赖于约定，确保任何类似一致性的工作完全由程序员负责。


  S3 系统之所以流行，是因为它非常易于使用和编写新类。在大多数情况下，我们倾向于简单而非复杂的设计，而在这些情况下，S3 完美满足我们的需求。当我们实现一个新的统计模型时，很少需要复杂的类层次结构。大多数抽象数据结构只有少数相关操作，在编写具体版本时记住全部实现也没有问题。然而，当软件达到一定复杂度时，就需要更多的结构。与其让设计仅隐式存在于编程约定中，我们希望它在代码中被明确陈述。


  S4 系统提供了一个结构更严谨的面向对象系统。在这里，类和类层次结构是显式创建的；它们不仅仅是 `class` 属性中的字符串。为了获得 S4 允许的附加结构，在创建类和方法时需要多写一些代码，但整体系统与
  S3 非常相似。如果你熟悉 S3，那么学习 S4 应该不成问题。


  ## 定义 S4 类


  在 S4 中，类是显式创建的。要创建一个新类，我们使用 `methods` 包中的 `setClass` 函数。该函数接受一些参数，用于指定该类对象应包含哪些属性、属性应具有的默认值、该类如何融入类层次结构，以及创建类的许多其他属性。所有这些属性都有默认值，因此我们只需指定类名即可创建新类。


  作为示例，我们考虑之前用 S3 实现的栈数据结构。要创建一个抽象栈类，我们可以这样写：


  ```

  library(methods)

  Stack <- setClass("Stack")

  ```


  这将创建一个名为 `"Stack"` 的新类。我们没有指定该类的任何属性，因此 S4 会假定它是一个不应被实例化的抽象类，如果我们尝试实例化，将会报错。


  我们可以像这样创建基于向量的栈类：


  ```

  VectorStack <- setClass("VectorStack",

  slots = c(

  elements = "vector"

  ),

  contains = "Stack")

  ```


  这里我们为 `setClass` 使用了两个参数：`slots` 和 `contains`。`slots` 参数是该类对象应具有的属性列表。这里指定它应包含一个名为
  `elements` 的向量。`contains` 参数指定新类应具有哪些超类。我们将 `VectorStack` 设为 `Stack` 的子类。


  由于 `VectorStack` 具有槽（slots），它不被视为抽象类（我们可以通过向 `contains` 参数添加 `"VIRTUAL"` 来显式使其抽象，但我们希望能够实例化它）。我们可以通过调用
  `VectorStack` 来创建该类对象。


  ```

  (vs <- VectorStack())

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## logical(0)

  ```


  我们可以将 `elements` 作为命名参数传递给 `VectorStack`。


  ```

  (vs <- VectorStack(elements = 1:4))

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## [1] 1 2 3 4

  ```


  此处不能使用位置参数；必须是命名参数。


  一旦有了 `VectorStack` 类的对象，我们可以使用以下符号访问元素：


  ```

  vs@elements

  ## [1] 1 2 3 4

  ```


  通常，`@` 用于访问 S4 对象的槽。


  捕获 `setClass` 的结果并将其作为构造函数使用，是我个人创建 S4 构造器的首选方式，但严格来说这不是必需的。一旦用 `setClass` 构建了类，你就可以使用函数
  `new`，仅通过类名来创建对象。


  ```

  new("VectorStack", elements = 1:4)

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## [1] 1 2 3 4

  ```




  ## 泛型函数


  在 S3 系统中，我们创建泛型函数的方式与创建普通函数相同，都是通过调用`UseMethod`来实现的。在 S4 中，我们必须使用`setGeneric`函数显式地定义泛型函数。`setGeneric`的第一个参数是泛型函数的名称。如果你有一个已有的函数想使其成为泛型函数，只需调用`setGeneric`并传入函数名，就会创建一个以该现有函数为默认实现的泛型函数。不过，通常我们会用`setGeneric`来创建一个全新的泛型函数，在这种情况下，还需要提供该函数的定义。这通过参数`def`来完成。该函数的作用与
  S3 中的函数定义相同：它应简单地调用函数`standardGeneric`，即 S4 中与`UseMethod`对应的函数。


  我们可以像下面这样定义栈抽象数据结构的接口：


  ```

  setGeneric("top",

  def = function(stack) standardGeneric("top"))

  setGeneric("pop",

  def = function(stack) standardGeneric("pop"))

  setGeneric("push",

  def = function(stack, element) standardGeneric("push"))

  setGeneric("is_empty",

  def = function(stack) standardGeneric("is_empty"))

  ```


  为了提供泛型函数的实现，我们使用`setMethod`函数。我们需要提供泛型函数的名称、方法的签名（用于分派方法的类型），以及函数的定义。


  当调用泛型函数时，会根据函数参数的类型选择具体的实现。这就是我们所说的动态分派，在 S3 中它基于单个参数（通常是第一个参数），但在 S4 中，我们可以基于更复杂的类型信息进行分派。为了获得类似于
  S3 的行为，只需提供一个类名作为签名即可。这样，S4 会根据泛型函数第一个参数的类来选择给定的实现。


  我们可以像下面这样实现向量栈：


  ```

  setMethod("top", signature = "VectorStack",

  definition = function(stack) stack@elements[1])

  setMethod("pop", signature = "VectorStack",

  definition = function(stack) {

  VectorStack(elements = stack@elements[-1])

  })

  setMethod("push", signature = "VectorStack",

  definition = function(stack, element) {

  VectorStack(elements = c(element, stack@elements))

  })

  setMethod("is_empty", signature = "VectorStack",

  definition = function(stack) length(stack@elements) == 0)

  ```


  这些实现只是我们在 S3 实现中定义的函数的变体，我们可以像之前一样使用这个类。


  ```

  stack <- VectorStack()

  stack <- push(stack, 1)

  stack <- push(stack, 2)

  stack <- push(stack, 3)

  stack

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## [1] 3 2 1

  while (!is_empty(stack)) {

  stack <- pop(stack)

  }

  stack

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## numeric(0)

  ```


  ### 槽位原型


  当你创建对象时，如果没有为槽位提供值，则会获得默认值，这些默认值通常是空向量或空列表。例如，如果要创建一个用于表示自然数的类，可以这样编写：


  ```

  NaturalNumber <- setClass("NaturalNumber",

  slots = c(

  n = "integer"

  ))

  ```


  如果我们不带参数实例化它，该对象将包含一个空向量，用于表示它应该代表的自然数。


  ```

  (n <- NaturalNumber())

  ## An object of class "NaturalNumber"

  ## Slot "n":

  ## integer(0)

  ```


  如果希望使用其他默认值，可以使用`setClass`的`prototype`参数。例如，我们可以指定默认的自然数为零。


  ```

  NaturalNumber <- setClass("NaturalNumber",

  slots = c(

  n = "integer"

  ),

  prototype = list(

  n = as.integer(0)

  ))

  ```


  现在，当我们创建对象时，它将从原型中获取默认值。


  ```

  (n <- NaturalNumber())

  ## An object of class "NaturalNumber"

  ## Slot "n":

  ## [1] 0

  ```


  当然，这并不妨碍我们在创建对象时将其他值作为参数传入。


  ```

  (n <- NaturalNumber(n = as.integer(1)))

  ## An object of class "NaturalNumber"

  ## Slot "n":

  ## [1] 1

  ```


  ### 对象有效性


  当我们指定槽位时给出的类型对对象施加了类型约束。当我们声明`NaturalNumber`中的`n`槽位应为整数时，我们就限制了可以分配给该槽位的值。如果我们尝试分配一个`numeric`值，将会得到错误。


  对于自然数，我们不希望包含负整数，但由于负整数仍然是整数，因此没有约束阻止分配这样的值。


  ```

  n@n <- as.integer(-1)

  ```


  我们可以通过`setClass`的`validity`参数对对象施加进一步的约束。该参数应为一个函数，用于测试对象是否有效。如果有效，应返回`TRUE`；否则应返回`FALSE`。


  ```

  NaturalNumber = 0

  })

  ```


  有了这个有效性检查，尝试执行以下操作将会导致错误：


  ```

  n <- NaturalNumber(n = as.integer(-1))

  ```


  不过，有效性测试仅在创建对象时进行。我们可以修改对象并将其置于无效状态。


  ```

  n@n <- as.integer(-1)

  ```


  这种行为是必要的，因为在修改对象时，它很可能在修改完成之前处于无效状态。但是，在修改对象完成后的任何时候，都可以调用`validObject`函数来再次检查有效性，如下所示：


  ```

  validObject(n)

  ```


  当然，在这里它会失败，因为我们刚刚将`n`置于无效状态。




  ## 泛型函数与类继承体系


  为了解 S4 如何处理类继承和泛型函数，我们回到之前的 `A`、`B`、`C` 示例。我们可以这样构建类以及三个对象：


  ```

  A <- setClass("A", contains = "NULL")

  B <- setClass("B", contains = "A")

  C <- setClass("C", contains = "B")

  x <- A()

  y <- B()

  z <- C()

  ```


  这里我让 `A` 继承自伪类 `"NULL"`，使其非抽象，这样即使它没有任何槽位也能实例化。


  我们可以定义一个泛型函数 `f`，并仅为类 `A` 实现它，如下所示：


  ```

  setGeneric("f", def = function(x) standardGeneric("f"))

  setMethod("f", signature = "A",

  definition = function(x) print("A::f"))

  ```


  如果这样做，那么当我们对所有三个对象调用它时，都会调用这个版本。


  ```

  f(x)

  ## [1] "A::f"

  f(y)

  ## [1] "A::f"

  f(z)

  ## [1] "A::f"

  ```


  如果我们定义另一个函数 `g`，并为 `A` 和 `B` 都实现它，那么对 `x` 调用它将调用 `A` 版本。对 `y` 和 `z` 调用它则会调用 `B`
  版本，因为这是针对这两个类的最特化函数形式。


  ```

  setGeneric("g", def = function(x) standardGeneric("g"))

  setMethod("g", signature = "A",

  definition = function(x) print("A::g"))

  setMethod("g", signature = "B",

  definition = function(x) print("B::g"))

  g(x)

  ## [1] "A::g"

  g(y)

  ## [1] "B::g"

  g(z)

  ## [1] "B::g"

  ```


  如果我们定义一个为所有三个类都实现的函数，那么对 `x`、`y` 和 `z` 调用它时，在三种情况下都会调用最特化的版本。


  ```

  setGeneric("h", def = function(x) standardGeneric("h"))

  setMethod("h", signature = "A",

  definition = function(x) print("A::h"))

  setMethod("h", signature = "B",

  definition = function(x) print("B::h"))

  setMethod("h", signature = "C",

  definition = function(x) print("C::h"))

  h(x)

  ## [1] "A::h"

  h(y)

  ## [1] "B::h"

  h(z)

  ## [1] "C::h"

  ```


  在 S4 中，与 `NextMethod` 对应的函数是 `callNextMethod`，其工作方式非常相似。


  ```

  setMethod("h", signature = "A",

  definition = function(x) {

  print("A::h")

  })

  setMethod("h", signature = "B",

  definition = function(x) {

  print("B::h")

  callNextMethod()

  })

  setMethod("h", signature = "C",

  definition = function(x) {

  print("C::h")

  callNextMethod()

  })

  h(x)

  ## [1] "A::h"

  h(y)

  ## [1] "B::h"

  ## [1] "A::h"

  h(z)

  ## [1] "C::h"

  ## [1] "B::h"

  ## [1] "A::h"

  ```


  方法本身没有 `.default` 版本，但我们可以使用 `setGeneric` 函数来创建一个。如果我们定义一个普通函数，并仅通过其名称调用 `setGeneric`，那么当我们没有更特化的版本时，该函数将成为默认调用的函数。


  ```

  d <- function(x) print("default::d")

  setGeneric("d")

  d(x)

  ## [1] "default::d"

  d(y)

  ## [1] "default::d"

  d(z)

  ## [1] "default::d"

  ```


  当然，当我们在特化时使用 `callNextMethod`，这也同样有效。


  ```

  setMethod("d", signature = "A",

  definition = function(x) {

  print("A::d")

  callNextMethod()

  })

  setMethod("d", signature = "B",

  definition = function(x) {

  print("B::d")

  callNextMethod()

  })

  setMethod("d", signature = "C",

  definition = function(x) {

  print("C::d")

  callNextMethod()

  })

  d(x)

  ## [1] "A::d"

  ## [1] "default::d"

  d(y)

  ## [1] "B::d"

  ## [1] "A::d"

  ## [1] "default::d"

  d(z)

  ## [1] "C::d"

  ## [1] "B::d"

  ## [1] "A::d"

  ## [1] "default::d"

  ```


  ### 要求实现方法


  我们之前定义的抽象类 `Stack` 没什么实际用途。它是一个没有关联数据或函数的抽象类。堆栈接口中的所有函数都在 `VectorStack` 中实现了，我们并没有从继承
  `Stack` 中得到任何好处。然而，在 S4 中，我们可以将诸如堆栈之类的接口形式化，并确保接口的实现确实实现了接口中的所有函数。


  这并不算多。R 中的类型检查很少，你从 S4 那里也得不到太多帮助，但至少有一种方法可以在调用尚未实现的泛型函数时让错误消息更具信息性。


  让我们实现一个不起作用的堆栈。我们可以为基于列表的堆栈创建这个类。它继承自 `Stack`，但不添加任何槽位或功能。


  ```

  ListStack <- setClass("ListStack", contains = "Stack")

  ```


  即使没有实现，我们也可以创建一个 `ListStack` 类型的对象。`Stack` 类是抽象的，因为我们没有向它添加任何槽位，但 `ListStack` 并不被解释为抽象的，即使它也没有添加任何槽位，因为它
  `contains` 一个超类。然而，如果我们对 `ListStack` 调用 `pop`，我们会得到一个错误，这确实是应该的。我们期望在这里得到一个错误，并且在这种情况下，从错误消息中很可能不难找出问题所在。错误会告诉我们
  R 无法找到该函数的继承方法。但如果 `Stack` 实现了 `pop` 的某个版本，或者我们设置了默认函数，那么我们会转而调用那个版本，这本身会是一个错误，但可能不会触发错误消息。


  我们可以使用函数 `requireMethods` 来指定 `Stack` 的所有子类必须实现堆栈接口：


  ```

  requireMethods(functions = c("top", "pop", "push", "is_empty"),

  signature = "Stack")

  ```


  通过这样做，我们确保对 `ListStack` 调用这些方法中的任何一个都会给我们一条错误消息。


  ```

  pop(stack)

  ## An object of class "VectorStack"

  ## Slot "elements":

  ## numeric(0)

  ```


  这对于接口的正确实现来说，算不上什么安全检查，我通常也觉得它没什么用，但如果你需要，它就在那里。


  ### 构造函数


  当你创建对象时，可以通过提供具名参数来为槽位提供值，但你也可以通过 `initialize` 方法对对象初始化获得更多控制。这个方法起到构造函数的作用，只是它不创建对象；它只负责设置属性，使对象保持一致的状态。如果你定义了这个函数，它会替换默认构造函数，并且由你来控制构造函数应该接受哪些参数、如何设置槽位，以及是否应该调用其超类的构造函数。


  下面是一个非常简单的例子，其中我们有一个超类和一个子类：


  ```

  A <- setClass("A", slots = list(x = "numeric", y = "numeric"))

  B <- setClass("B", contains = "A", slots = list(z = "numeric"))

  setMethod("initialize", signature = "A",

  definition = function(.Object, x, y) {

  print("A initialize")

  .Object@x <- x

  .Object@y <- y

  .Object

  })

  ## [1] "initialize"

  setMethod("initialize", signature = "B",

  definition = function(.Object, z) {

  .Object <- callNextMethod(.Object, x = z, y = z)

  .Object@z <- z

  .Object

  })

  ## [1] "initialize"

  (a <- A(x = 1:3, y = 4:6))

  ## [1] "A initialize"

  ## An object of class "A"

  ## Slot "x":

  ## [1] 1 2 3

  ##

  ## Slot "y":

  ## [1] 4 5 6

  (b <- B(z = 6:9))

  ## [1] "A initialize"

  ## An object of class "B"

  ## Slot "z":

  ## [1] 6 7 8 9

  ##

  ## Slot "x":

  ## [1] 6 7 8 9

  ##

  ## Slot "y":

  ## [1] 6 7 8 9

  ```




  ## 基于类型签名的方法分派


  到目前为止，我们在定义特定方法时所使用的签名只包含一个类名。如果我们这样使用，S4 方法的工作方式与 S3 泛型函数类似，但 S4 的分派机制比这更通用，它可以根据函数所有参数的类型进行分派。


  例如，我们可以定义一个包含两个参数的函数 `f`，并根据这两个参数的类型以不同的方式对其进行细化。比如，我们可以有一个参数为数值型时的版本，以及另一个参数为逻辑型时的版本。


  ```

  setGeneric("f", def = function(x, y) standardGeneric("f"))

  setMethod("f", signature = c("numeric", "numeric"),

  definition = function(x, y) x + y)

  setMethod("f", signature = c("logical", "logical"),

  definition = function(x, y) x & y)

  ```


  当调用 `f` 时，会根据参数的类型选择相应的函数。


  ```

  f(2, 3)

  ## [1] 5

  f(TRUE, FALSE)

  ## [1] FALSE

  ```


  类型匹配遵循类的继承层级，从最具体到最抽象。对于数值，它会优先匹配整型，然后才是数值型和复数型。因此，如果我们为 `f` 定义一个匹配第一个参数为整型的版本，那么当传入整型参数时，会调用这个版本；而当传入`numeric`类型的值时，则会调用上面定义的版本。


  ```

  setMethod("f", signature = c("integer", "complex"),

  definition = function(x, y) x - y)

  f(2, 2)

  ## [1] 4

  f(as.integer(2), 2)

  ## [1] 4

  ```


  这里，第二个参数可以匹配任何复数类型，但我们可以将其特化，以匹配整型和数值型：


  ```

  setMethod("f", signature = c("integer", "numeric"),

  definition = function(x, y) 2*x + y)

  f(as.integer(2), 2)

  ## [1] 6

  ```


  如果我们只为签名提供一个字符串（就像之前处理类时那样），它只会根据第一个参数的类型进行分派。


  ```

  setMethod("f", signature = "character",

  definition = function(x, y) x)

  f("foo", "bar")

  ## [1] "foo"

  ```


  通常，如果你没有为所有参数提供类型，签名列表只会匹配函数参数列表前缀部分的类型。


  ```

  setGeneric("g", def = function(x, y, z) standardGeneric("g"))

  setMethod("g", signature = "character",

  definition = function(x, y, z) "g(character)")

  setMethod("g", signature = c("numeric", "character"),

  definition = function(x, y, z) "g(numeric, character)")

  g("foo", NA, NA)

  ## [1] "g(character)"

  g(12, "bar", NA)

  ## [1] "g(numeric, character)"

  ```


  如果你想匹配任意类型，可以使用 `"ANY"` 类型。


  ```

  setMethod("f", signature = "ANY",

  definition = function(x, y) "any")

  f(list(), NULL)

  ## [1] "any"

  ```


  这可以用来定义一个通用的默认实现，当没有更具体的实现能匹配参数时，就会调用它。


  你甚至可以使用 `"missing"` 类型来匹配某些参数未提供的情况。


  ```

  setMethod("f", signature = c("ANY", "missing"),

  definition = function(x, y) "missing")

  f(list(), NULL)

  ## [1] "any"

  f(list())

  ## [1] "missing"

  ```


  在这里，第一个调用匹配了接受任意参数的版本，因为第二个参数并非缺失，它只是 `NULL`；而另一个调用则匹配了更具体的签名，即第二个参数是缺失的情况。


  ## 运算符重载


  S4 也支持运算符重载，方式与 S3 非常相似，只是使用了针对泛型方法的方法机制。我们可以像这样尝试将模数类实现为一个 S4 类：


  ```

  modulus <- setClass("modulus",

  slots = c(

  value = "numeric",

  n = "numeric"

  ))

  setMethod("show", signature = "modulus",

  definition = function(object) {

  cat("Modulus", object@n, "values:\n")

  print(object@value)

  })

  (x <- modulus(value = 1:6, n = 3))

  ## Modulus 3 values:

  ## [1] 1 2 3 4 5 6

  ```


  我们在这里实现的 `show` 方法是 `print` 的 S4 等价物，用于美化打印 `modulus` 对象。


  如果我们接着想要实现单个运算符，可以像为 S3 定义泛型函数那样，特化该运算符对应的方法。但我们可以使用签名类型匹配来捕获不同的参数组合，而不必像在 S3 中那样，在泛型函数开头编写类型检查代码。


  下面我们处理了模数运算所需的三种情况：两个操作数都是 `modulus` 对象，以及一个操作数是 `modulus` 对象而另一个是 `numeric` 的两种情况。


  ```

  setMethod("+", signature = c("modulus", "modulus"),

  definition = function(e1, e2) {

  if (e1@n != e2@n) stop("Incompatible modulus")

  modulus(value = e1@value + e2@value,

  n = e1@n)

  })

  setMethod("+", signature = c("modulus", "numeric"),

  definition = function(e1, e2) {

  modulus(value = e1@value + e2,

  n = e1@n)

  })

  setMethod("+", signature = c("numeric", "modulus"),

  definition = function(e1, e2) {

  modulus(value = e1 + e2@value,

  n = e2@n)

  })

  ```


  现在，我们可以将 `numeric` 和 `modulus` 进行加法运算了，而且由于类型分派已经为我们处理了类型检查，我们无需在函数内部显式检查类型。


  ```

  x + 1:6

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  1:6 + x

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  ```


  我们还处理了两个 `modulus` 对象相加的情况，并检查它们的 `n` 槽位是否相等。


  ```

  y <- modulus(value = 1:6, n = 2)

  x + y

  ## Error in x + y: Incompatible modulus

  y <- modulus(value = 1:6, n = 3)

  x + y

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  ```


  S4 也支持函数组解决方案。要定义算术运算，我们需要使用 `Arith` 函数组。它的工作方式与 S3 中的 `Ops` 泛型函数非常相似，区别在于，我们再次可以使用类型匹配，而无需在函数内部显式检查参数类型。


  ```

  setMethod("Arith",

  signature = c("modulus", "modulus"),

  definition = function(e1, e2) {

  if (e1@n != e2@n) stop("Incompatible modulus")

  modulus(value = callGeneric(e1@value, e2@value),

  n = e1@n)

  })

  setMethod("Arith",

  signature = c("modulus", "numeric"),

  definition = function(e1, e2) {

  modulus(value = callGeneric(e1@value, e2),

  n = e1@n)

  })

  setMethod("Arith",

  signature = c("numeric", "modulus"),

  definition = function(e1, e2) {

  modulus(value = callGeneric(e1, e2@value),

  n = e2@n)

  })

  x * y

  ## Modulus 3 values:

  ## [1]  1  4  9 16 25 36

  2 * x

  ## Modulus 3 values:

  ## [1]  2  4  6  8 10 12

  ```




  ## 结合 S3 与 S4 类


  你可以在有限程度上结合 S3 和 S4。这两种体系各不相同，我不建议你尝试编写将 S3 和 S4 类层次结构紧密联系在一起的软件，这只会导致痛苦与懊悔。但如果你已有
  S3 代码，并希望用 S4 编写扩展，这也是可行的。


  假设我们有一个 S3 类 `X`，以及泛型函数 `foo` 和 `bar`。


  ```

  X <- function(x) {

  structure(list(x = x), class = "X")

  }

  foo <- function(x) UseMethod("foo")

  bar <- function(x) UseMethod("bar")

  foo.X <- function(x) "foo"

  bar.X <- function(x) x$x

  x <- X(5)

  foo(x)

  ## [1] "foo"

  bar(x)

  ## [1] 5

  ```


  如果我们想编写 `X` 的一个子类，不妨称之为 `Y`，并且希望用 S4 来编写 `Y`，则不能在 `setClass` 的 `contains` 选项中使用
  `X`。其实你确实可以用，但如果尝试实例化该类的对象，则会出错。S4 系统并不知道存在名为 `X` 的类，因此我们首先需要让它知道这个类。我们可以通过使用 `setOldClass`
  函数来实现这一点。


  ```

  setOldClass("X")

  ```


  这做了两件事：它让 S4 知道了这个类，以便我们可以继承它；同时，它使为该类定义的任何泛型函数都成为可以通过 `setMethod` 进行特化的函数。因此，在调用
  `setOldClass` 之后，我们可以将 `X` 的子类创建为 S4 类。


  ```

  Y <- setClass("Y", contains = "X")

  ```


  对类型为 `Y` 的对象调用 `foo` 或 `bar` 也会通过动态分派系统工作，并会调用 `foo.X`，因为没有更匹配的 `foo.Y` 存在。


  ```

  y <- Y()

  foo(y)

  ## [1] "foo"

  ```


  如果愿意，我们可以通过实现 `foo.Y` 来为 `Y` 对象创建一个特化版本的 `foo`。


  ```

  foo.Y <- function(x) "Y::foo"

  foo(y)

  ## [1] "Y::foo"

  ```


  当然，这属于 S3 方式下精炼泛型函数的做法，而由于我们现在处理的是 S4 类，使用 `setMethod` 会更好。


  与 `foo` 类似，调用 `bar` 会调用 `bar.X`。此时会导致错误，因为尽管 S4 知道 `X` 类，但它并不知道构造函数或其所创建的 `X` 对象的表示方式。


  ```

  bar(y)

  ## Error in x$x: $ operator not defined for this S4 class

  ```


  在 S3 中，没有关于构造函数或对象表示形式的正式定义，只有非正式的编码惯例，因此 S4 无法知道 `bar` 函数期望从 `X` 对象中获取什么。我们自动集成
  S3 和 S4 的能力是有限的，需要编写一些代码才能使 S3 版本的功能也与 S4 类相匹配。


  ```

  Y <- setClass("Y", contains = "X", slots = c(x = "ANY"))

  setMethod("bar", signature = "Y",

  definition = function(x) x@x)

  y <- Y(x = 13)

  bar(y)

  ## [1] 13

  ```


  我不建议混合使用 S3 和 S4。如果代码是用 S3 系统编写的，那么坚持使用 S3 可能比尝试将这两种系统结合起来更好。但如果你是用 S4 编写代码，需要包含一些来自
  S3 类的功能，那么上述方法就是可行的做法。


  '
- "# R6 类\n\n我们要看的最后一个对象系统是 R6 系统。这个系统与 S3 和 S4 非常不同，在 R 中通常也不常见，因为它引入了可变数据。在 R 中，数据通常是不可变的，任何看似修改对象的操作实际上都是通过复制数据并构造新对象来实现的。在\
  \ R 中，唯一可以修改的是环境；你不能修改数据。然而，R6 系统利用了环境来提供可以修改的对象。这在 R 中并不常见，但其语义类似于大多数其他语言中面向对象的实现方式，即方法修改对象而不是创建新对象。如果你是从其他编程语言转到\
  \ R，R6 系统可能更熟悉；但如果你更熟悉 R 本身，它引入的副作用可能会让你感到惊讶。如果有两个引用指向同一个 R6 对象，并通过其中一个变量修改它，那么另一个变量所引用的对象状态也会改变。这种情况在另外两个类系统中是不会发生的。\n\
  \n与内置的引用类（RC）系统（也称为 R5）相比，R6 系统是这种语义的更好实现。R5 是 R 中继 S3 和 S4 对象系统之后实现的下一个对象系统的自然名称，而\
  \ S3 和 S4 最初源自 S 语言。由于 R6 具有与 R5 相同的语义，并且被认为是其更好的实现，因此我不再进一步介绍 R5。\n\n\n\n## 定义类\n\
  \n类通过 `R6` 包中的 `R6Class` 函数来定义。与 S4 中的 `setClass` 类似，我们需要为类指定名称，并可以使用多个可选参数来定义该类对象的外观和行为。与\
  \ S4 不同的是，我们需要捕获对 `R6Class` 调用的结果才能创建类对象。在 S4 中，这是一种约定，但只要知道类的名称，我们就能创建对象。在 R6 中，名称主要用于设置\
  \ `class` 属性，以便对象能够与 S3 的多态性进行交互。我们使用 `R6Class` 的返回值来创建对象。\n\n举例来说，我们再次实现一个栈。这次我不会纠结于抽象超类，而是直接实现一个\
  \ `VectorStack`。一种实现方式如下：\n\n```r\nlibrary(R6)\nVectorStack <- R6Class(\"VectorStack\"\
  ,\nprivate = list(elements = NULL),\npublic = list(\ntop = function() {\nprivate$elements[1]\n\
  },\npop = function() {\nprivate$elements <-\nprivate$elements[-1]\ninvisible(self)\n\
  },\npush = function(e) {\nprivate$elements <-\nc(e, private$elements)\ninvisible(self)\n\
  },\nis_empty = function() {\nlength(private$elements) == 0\n}\n))\n```\n\n这里，除了类名之外，我们还使用了\
  \ `R6Class` 的两个参数：`private` 和 `public`。这些参数用于定义类的属性，可以是存储在对象中的值，也可以是我们可以对对象调用的方法。对于这两个参数，其值都是列表。列表元素的名称为属性名称，值即为属性值。\n\
  \n这两个参数的区别在于，`public` 列表中的属性可以在任何地方被访问，而 `private` 列表中的属性只能在为类定义的方法中访问。在方法中，您可以通过变量\
  \ `self` 访问 `public` 列表中的元素，并通过变量 `private` 访问 `private` 列表中的属性。在这个 `VectorStack`\
  \ 实现中，我们将用于存储栈的向量设为私有，并将栈接口实现为公有方法。在方法内部，我们通过 `private$elements` 访问元素，并在 `push`\
  \ 和 `pop` 中通过变量 `self` 返回对象本身。我们将此对象包裹在 `invisible` 中返回，以便在调用这些方法时不会自动打印，但这并非强制要求。对于这些方法，我们完全可以不返回任何对象，但返回对象本身允许我们进行方法链式调用（如下文所示），因此这是一种良好实践。\n\
  \n请注意，`self` 和 `private` 对象并不是方法的参数。它们作为 R6 实现其可变对象语义的魔法的一部分，存在于函数的命名空间中。\n\n我们以这种方式创建的\
  \ `VectorStack` 对象本身并不是构造函数（如 S4 那样）。它是一个所谓的对象生成器。要创建对象，我们使用该生成器的属性 `new`，如下所示：\n\
  \n```r\n(stack <- VectorStack$new())\n##   Public:\n##     clone: function (deep\
  \ = FALSE)\n##     is_empty: function ()\n##     pop: function ()\n##     push:\
  \ function (e)\n##     top: function ()\n##   Private:\n##     elements: NULL\n\
  ```\n\n打印这个对象会显得相当冗长，但如果为类定义 `print` 方法，我们就可以修改它的显示方式。\n\n```r\nVectorStack <- R6Class(\"\
  VectorStack\",\nprivate = list(elements = NULL),\npublic = list(\n# ... 其余方法\nprint\
  \ = function() {\ncat(\"栈元素：\\n\")\nprint(private$elements)\n}\n))\n```\n\n这并不会修改现有的对象。\n\
  \n```r\nstack\n## \n##   Public:\n##     clone: function (deep = FALSE)\n##    \
  \ is_empty: function ()\n##     pop: function ()\n##     push: function (e)\n##\
  \     top: function ()\n##   Private:\n##     elements: NULL\n```\n\n不过，如果创建一个新对象，它就会生效。\n\
  \n```r\n(stack <- VectorStack$new())\n## 栈元素：\n## NULL\n```\n\n我们可以通过 `$` 索引访问栈对象的（公有）属性，如果属性是函数，则调用相应方法：\n\
  \n```r\nstack$push(1)$push(2)$push(3)\nstack\n## 栈元素：\n## [1] 3 2 1\nwhile (!stack$is_empty())\
  \ stack$pop()\nstack\n## 栈元素：\n## numeric(0)\n```\n\n这里能够实现链式调用 `push`，是因为 `push`\
  \ 方法返回了对象本身。与先前 `push` 返回新对象的实现不同，对于 R6 对象，现有对象会被修改。我们不需要将三次 `push` 调用的结果重新赋值给 `stack`，也不需要将\
  \ `pop` 的调用结果重新赋值给 `stack`。在这些函数中返回对象本身允许我们进行链式方法调用，其作用也仅限于此。R6 对象不是不可变的。\n\n###\
  \ 对象初始化\n\n如果希望在构造对象时设置属性，我们需要比在 S4 中做更多的工作。我们不能仅使用构造函数中的命名参数；以下调用会报错：\n\n```r\n\
  stack <- VectorStack$new(elements = 1:4)\n```\n\n要能够以这种方式初始化对象，我们需要显式编写一个函数。该函数必须是一个名为\
  \ `initialize` 的 `public` 方法。如果希望构造函数接受参数，则必须在此函数中指定参数。您不能将此函数设为 `private`；将名为 `initialize`\
  \ 的函数放入 `private` 列表会报错。\n\n为了用一个元素序列初始化 `VectorStack` 对象，我们可以像下面这样实现其 `initialize`\
  \ 函数：\n\n```r\nVectorStack <- R6Class(\"VectorStack\",\nprivate = list(elements\
  \ = NULL),\npublic = list(\ninitialize = function(elements = NULL) {\nprivate$elements\
  \ <- elements\n},\n# ... 其余方法\n))\n```\n\n有了这个初始化函数，我们现在就可以构造带有初始化 `elements` 的对象了。\n\
  \n```r\n(stack <- VectorStack$new(elements = 1:4))\n## 栈元素：\n## [1] 1 2 3 4\n```\n\
  \n\n\n### 私有属性和公共属性\n\n栈中的元素是私有的，因此我们不能像访问公共方法那样直接访问它们。你可能会期望 `stack$elements` 会报错，但可惜并不会。\n\
  \n```\nstack$elements\n## NULL\n```\n\n这是因为使用一个不存在的键去访问列表时会返回 `NULL`，你遇到的就是这种机制。\n\
  \n```\nlist()$elements\n## NULL\n```\n\n通过下面这个小例子，我们可以看出私有属性和公共属性的区别：\n\n```\nA\
  \ <- R6Class(\"A\", public = list(x = 5), private = list(y = 13))\n```\n\n根据类 `A`\
  \ 的这个定义，我们应该能够访问对象的 `x` 属性，事实也确实如此。\n\n```\na <- A$new()\na$x\n## [1] 5\na$x <-\
  \ 7\na$x\n## [1] 7\n```\n\n我们也可以尝试获取 `y`，但它的行为与我们之前看到的栈的情况相同，而且我们无法修改它，因为它实际上并不是该对象的一个属性。\n\
  \n```\na$y\n## NULL\na$y <- 12\n## Error in a$y <- 12: cannot add bindings to a\
  \ locked environment\na$y\n## NULL\n```\n\n一般来说，你不能像在 S3 中那样，仅通过向 `$` 索引的值赋值来为 R6\
  \ 对象创建新属性。属性必须在类定义中声明。如果你尝试类似下面这样的操作，就会报错：\n\n```\na$z <- \"foo\"\n```\n\n你可以修改公共数据属性，就像我们上面修改\
  \ `x` 那样，但不要企图耍小聪明去修改方法。一开始就为单个对象更改方法是非常糟糕的实践，幸运的是，在 R6 中这也是“被禁止的”，如果你尝试的话，将会收到错误提示。\n\
  \n通常，将数据设为私有并将作为类接口一部分的方法设为公共，被认为是良好的实践。这有几个原因：如果数据只能通过类的方法来修改，那么你就能更好地控制对象的状态，并确保在调用所有方法前后，对象始终处于有效状态。但（也许更重要的是）将对象的表示方式隐藏起来，可以限制该类与使用该类的代码之间的依赖关系。如果任何代码都能访问对象的内部工作方式，那么最终很可能会有大量代码依赖于此。这意味着，如果你改变了类对象的表示方式，就必须修改所有使用该类的代码。反之，如果代码仅通过公共接口访问对象，那么只要你保持公共接口不变，就可以随心所欲地修改所有私有属性。当然，你需要修改该类的某些方法，但修改范围将被限制在类内部。\n\
  \n在 R6 系统中，私有属性只能由你为该类定义的方法或在其子类中定义的方法访问。如果你习惯使用像 C++ 或 Java 这样的语言，这可能会让你感到惊讶。实际上，R6\
  \ 中的私有属性类似于那些语言中的受保护（protected）属性，而非私有（private）属性。\n\n### 主动绑定\n\n有一种方法可以让你在语法上像访问数据属性那样，但实际上并未直接访问它们。如果你有一段代码已经使用了某个公共属性，而你想将其改为一个函数以隐藏或修改实现细节，就可以使用这种方法。如果你只是更喜欢数据属性的语法而非方法调用，也可以使用它。\n\
  \n这是通过 `R6Class` 的 `active` 参数实现的。在这里，你可以像为 `private` 和 `public` 参数一样提供一个属性列表，但这些属性应该是函数，它们将为调用这些函数定义一种类似值的语法。\n\
  \n举个例子，我们可以看看向量栈中的元素。我们希望可以写成 `stack$elements`，但又不想让元素变成公共的。因此，我们为 `elements` 编写一个函数并将其添加到\
  \ `active` 中。我们不能在 `private` 和 `active`（或 `public`）中使用相同的名称，所以必须先更改私有数据属性的名称，当然还要更新所有现有的方法。完成这些操作后，我们可以像这样添加\
  \ `active` 函数：\n\n```\nVectorStack <- R6Class(\"VectorStack\",\nprivate = list(elements_\
  \ = NULL),\npublic = list(\n# ... 方法\n),\nactive = list(\nelements = function(value)\
  \ {\nif (!missing(value))\nstop(\"elements are read-only\")\nprivate$elements_\n\
  }\n))\n```\n\n`active` 列表中的函数应接受一个参数 `value`。当我们读取属性时，`value` 会缺失；当我们为属性赋值时，`value`\
  \ 将包含数据。在此实现中，我们将赋值给元素视为错误，并在读取属性时返回私有的 `elements_`。\n\n这样我们就可以获取元素了：\n\n```\nstack\
  \ <- VectorStack$new(elements = 1:4)\nstack$elements\n## [1] 1 2 3 4\n```\n\n同时，下面这种操作会引发错误：\n\
  \n```\nstack$elements <- rev(1:3)\n## Error in (function (value) : elements are\
  \ read-only\n```\n\n你可以使用这些 `active` 函数来修改你赋予的值，无论是为了确保对象一致性，还是为了伪造一个并非直接存储，而是隐含存在（可通过其他数据计算得出）的属性。这完全取决于你如何使用它们。\n\
  \n## 继承\n\n在 R6 中，指定类层次结构以及将方法调用分派到最具体的方法实现的方式相对直接。我们可以以之前见过两次的三个类为例，在 R6 中实现它。要指定一个类继承自另一个类，我们使用\
  \ `R6Class` 的 `inherit` 参数；要编写一个方法的更具体版本，我们只需将该方法添加到 `public` 或 `private` 列表中。总的来说，在\
  \ R6 中编写方法和类层次结构的代码比在 S3 和 S4 中都更简单。\n\n```\nA <- R6Class(\"A\",\npublic = list(\n\
  f = function() print(\"A::f\"),\ng = function() print(\"A::g\"),\nh = function()\
  \ print(\"A::h\")\n))\nB <- R6Class(\"B\", inherit = A,\npublic = list(\ng = function()\
  \ print(\"B::g\"),\nh = function() print(\"B::h\")\n))\nC <- R6Class(\"C\", inherit\
  \ = B,\npublic = list(\nh = function() print(\"C::h\")\n))\n```\n\n实例化这些类的对象时没有意外之处；我们必须使用对象生成器中的\
  \ `new` 方法。\n\n```\nx <- A$new()\ny <- B$new()\nz <- C$new()\n```\n\n对于方法 `f`，我们只在类\
  \ `A` 中有一个实现，因此在三个对象上调用 `f` 都会调用该版本。除了方法调用的语法与 S3 和 S4 的实现不同之外，这里没有意外。\n\n```\n\
  x$f()\n## [1] \"A::f\"\ny$f()\n## [1] \"A::f\"\nz$f()\n## [1] \"A::f\"\n```\n\n\
  对于 `g`，我们在 `A` 和 `B` 中都有实现，而 `C` 对象将调用 `B` 的实现，因为这是对该类来说最具体的方法。\n\n```\nx$g()\n\
  ## [1] \"A::g\"\ny$g()\n## [1] \"B::g\"\nz$g()\n## [1] \"B::g\"\n```\n\n最后，对于 `h`，我们在所有三个类中都有实现，因此三个对象会调用不同的方法。\n\
  \n```\nx$h()\n## [1] \"A::h\"\ny$h()\n## [1] \"B::h\"\nz$h()\n## [1] \"C::h\"\n\
  ```\n\n关于 R6 中继承和方法分派的工作原理，应该没有任何令人意外的地方。\n\n\n\n## 与 S3 交互及运算符重载\n\n我们没有为 R6 对象定义新运算符的机制，但可以利用\
  \ S3 系统来实现。由 R6 对象生成器创建的对象会被赋予一个 `class` 属性，该属性是一个列表，包含创建生成器时指定的类名以及 `\"R6\"`，因此我们可以为它们定义泛型函数的特化版本。\n\
  \n我们可以像这样用 R6 实现 `modulus` 类：\n\n```\nmodulus <- R6Class(\"modulus\",\nprivate =\
  \ list(\n  value_ = c(),\n  n_ = c()\n),\npublic = list(\n  initialize = function(value,\
  \ n) {\n    private$value_ <- value\n    private$n_ <- n\n  },\n  print = function()\
  \ {\n    cat(\"模数\", private$n_, \"值:\\n\")\n    print(private$value_)\n  }\n),\n\
  active = list(\n  value = function(value) {\n    if (missing(value)) private$value_\n\
  \    else private$value_ <- value %% private$n_\n  },\n  n = function(value) {\n\
  \    if (!missing(value)) stop(\"无法修改 n\")\n    private$n_\n  }\n))\n(x <- modulus$new(value\
  \ = 1:6, n = 3))\n## 模数 3 值:\n## [1] 1 2 3 4 5 6\n```\n\n在这个类定义中有几个要点。我们在 `private`\
  \ 列表中定义了存放数据的属性，定义了初始化函数和打印函数，然后定义了两个用于访问数据的 `action` 属性。我们允许类的使用者修改 `values`，但不能修改\
  \ `n`（没有特别的理由，只是为了展示两种不同的行为）。对于 `values` 属性，我们确保在将数据存入私有变量 `values_` 之前对其进行修改。\n\
  \n该类对象的 `class` 属性包含以下内容：\n\n```\nclass(x)\n## [1] \"modulus\" \"R6\"\n```\n\n这意味着我们可以像这样使用\
  \ S3 系统为该类定义算术运算：\n\n```\nOps.modulus <- function(e1, e2) {\n  nx <- ny <- NULL\n\
  \  if (inherits(e1, \"modulus\")) nx <- e1$n\n  if (inherits(e2, \"modulus\")) ny\
  \ <- e2$n\n  if (!is.null(nx) && !is.null(ny) && nx != ny)\n    stop(\"类型不兼容\")\n\
  \  n <- ifelse(!is.null(nx), nx, ny)\n  v1 <- e1\n  v2 <- e2\n  if (inherits(e1,\
  \ \"modulus\")) v1 <- e1$value\n  if (inherits(e2, \"modulus\")) v2 <- e2$value\n\
  \  e1 <- v1 ; e2 <- v2\n  result <- NextMethod() %% n\n  modulus$new(result, n)\n\
  }\n```\n\n该实现与 S3 版本略有不同，因为对象中数据的表示方式不同，但总体控制流程是相同的。有了这个定义，我们就实现了模数算术。\n\n```\n\
  x + 1:6\n## 模数 3 值:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## 模数 3 值:\n## [1] 2 1 0 2 1 0\n\
  2 * x\n## 模数 3 值:\n## [1] 2 1 0 2 1 0\n```\n\n如果你为 R6 类（如 `modulus`）创建子类，会得到一个同样反映该继承关系的\
  \ `class` 属性，因此 S3 的分派机制也适用于 R6 系统中的子类。\n\n```\nmodulus2 <- R6Class(\"modulus2\"\
  , inherit = modulus)\ny <- modulus2$new(value = 1:2, n = 3)\nclass(y)\n## [1] \"\
  modulus2\" \"modulus\"  \"R6\"\nx + y\n## 模数 3 值:\n## [1] 2 1 1 0 0 2\n```\n\n话虽如此，也不要过度混用\
  \ R6 和 S3；这只会让你的代码维护者感到困惑（很可能未来的你也包括在内）。\n\n"
- "# 8. 结论\n\n这本关于 R 语言面向对象编程的书籍到此结束。现在你已经了解了 R 中三种不同的面向对象编程系统，以及如何使用它们来定义类层次结构和多态函数。\n\
  \nR 中的面向对象编程，至少对于 S3 和 S4 系统而言，与大多数其他面向对象编程语言不同。大多数语言认为对象是可变的，并且大多数面向对象软件设计涉及将对象通过引用相互连接，使得它们的行为依赖于其他对象的不断变化的状态。R6\
  \ 系统更接近这类语言设计。尽管如此，S3 和 S4 系统结合了两种强大的编程语言范式：函数式编程和面向对象编程。基于参数类型的动态函数分派与高级函数式编程的结合，使你能够构建灵活且可扩展的软件。\n\
  \n在同一个语言中存在三种截然不同的面向对象编程系统可能会令人困惑，我建议你在任何一个项目中只坚持使用其中一种。然而，了解这三种系统以及使用它们的优缺点，能让你为特定任务选择正确的工具。S3\
  \ 系统是三者中最简单的，非常适合在短时间内快速搭建一个小型模型。S4 系统更正式的类定义使得构建更复杂的框架变得更容易，而 R6 系统的引用语义使得实现传统的可变数据结构比在\
  \ R 中其他方式更简单。\n\n当然，熟悉这些系统需要练习，你不会仅仅通过阅读这本书就成为面向对象编程的专家。不过，你现在已经掌握了足够的知识，可以开始实践了。\n\
