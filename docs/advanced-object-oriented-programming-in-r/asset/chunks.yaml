    \ n)\n}\n```\n\n该实现与 S3 版本略有不同，因为对象中数据的表示方式不同，但总体控制流程是相同的。有了这个定义，我们就实现了模数算术。\n\
    \n```\nx + 1:6\n## 模数 3 值:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## 模数 3 值:\n## [1] 2\
    \ 1 0 2 1 0\n2 * x\n## 模数 3 值:\n## [1] 2 1 0 2 1 0\n```\n\n如果你为 R6 类（如 `modulus`）创建子类，会得到一个同样反映该继承关系的\
    \ `class` 属性，因此 S3 的分派机制也适用于 R6 系统中的子类。\n\n```\nmodulus2 <- R6Class(\"modulus2\"\
    , inherit = modulus)\ny <- modulus2$new(value = 1:2, n = 3)\nclass(y)\n## [1]\
    \ \"modulus2\" \"modulus\"  \"R6\"\nx + y\n## 模数 3 值:\n## [1] 2 1 1 0 0 2\n```\n\
    \n话虽如此，也不要过度混用 R6 和 S3；这只会让你的代码维护者感到困惑（很可能未来的你也包括在内）。\n\n# 8. 结论\n\n这本关于 R 语言面向对象编程的书籍到此结束。现在你已经了解了\
    \ R 中三种不同的面向对象编程系统，以及如何使用它们来定义类层次结构和多态函数。\n\nR 中的面向对象编程，至少对于 S3 和 S4 系统而言，与大多数其他面向对象编程语言不同。大多数语言认为对象是可变的，并且大多数面向对象软件设计涉及将对象通过引用相互连接，使得它们的行为依赖于其他对象的不断变化的状态。R6\
    \ 系统更接近这类语言设计。尽管如此，S3 和 S4 系统结合了两种强大的编程语言范式：函数式编程和面向对象编程。基于参数类型的动态函数分派与高级函数式编程的结合，使你能够构建灵活且可扩展的软件。\n\
    \n在同一个语言中存在三种截然不同的面向对象编程系统可能会令人困惑，我建议你在任何一个项目中只坚持使用其中一种。然而，了解这三种系统以及使用它们的优缺点，能让你为特定任务选择正确的工具。S3\
