- fmt: '# Designing Interfaces


    It’s not just generic functions that are polymorphic. Any function that manipulates
    data only through generic functions is also polymorphic. The reversal function
    we implemented using a stack takes the empty stack as an argument, and this empty
    stack determines which actual stack implementation we use. Nowhere in the function
    do we refer to any details of a real implementation. If we had, instead, created
    an empty stack inside this function then, despite otherwise only accessing the
    implementation through the interface of the generic functions, the function would
    be bound to a single implementation.


    To get the most out of polymorphism, you will want to design your functions to
    be as polymorphic as possible. This requires two things:

    1.  Don’t refer to concrete implementations unless you really have to.

    2.  Any time you do have to refer to implementation details of a concrete type,
    do so through a generic function.


    The reversal function is polymorphic because it doesn’t refer to any concrete
    implementation. The choice of which concrete stack to use is determined by a parameter,
    and the operations it performs on the specific stack implementation all go through
    generic functions.


    It can be very tempting to break these rules in the heat of programming. Using
    a parameter to determine data structures in an algorithm isn’t that difficult
    to do, but if you are writing an algorithm that uses several different data structures,
    you might not want to have all the different concrete implementations as parameters.
    You really ought to do it, though. Just write a function that wraps the algorithm
    and provides implementations if you don’t want to remember all the concrete data
    structures where the algorithm is needed. That way you get the best of both worlds.


    More often, you will want to access the details of a concrete implementation.
    Imagine, for example, that you want to pop elements until you see a specific one,
    but only if that element is on the stack. If we are used to working with the vector
    implementation of the stack, then it would be natural to write a function like
    this:


    ```

    pop_until %

    push(1) %>%

    push(2) %>%

    push(3) %T>% print

    ## [1] 3 2 1

    ## attr(,"class")

    ## [1] "vector_stack"

    pop_until(vector_stack, 1)

    ## [1] 1

    ## attr(,"class")

    ## [1] "vector_stack"

    pop_until(vector_stack, 5)

    ## [1] 3 2 1

    ## attr(,"class")

    ## [1] "vector_stack"

    ```


    Here we use the `%in%` function to test if the element is on the stack (and we
    use the `magrittr` pipe operator to create a stack for our test). This works fine,
    as long as the stack is a vector stack , but it will not work if the stack is
    implemented as a list. You won’t get an error message; the `%in%` test will just
    always return `FALSE`, so if you replace the stack implementation you have incorrect
    code that doesn’t even inform you that it isn’t working.


    Relying on implementation details is the worst thing you can do to break the interface
    of polymorphic objects. Not only do you tie yourself to a single implementation,
    but you also tie yourself to exactly how that concrete data is implemented. If
    that implementation changes, your algorithm using it will break. So now you either
    can’t change the implementation, or you will have to change the algorithm that
    it uses when it does. If you are lucky, you might get an error message if you
    break the interface, but as in the case we just saw (and you can try it yourself
    if you don’t believe me), you won’t even get that. The function will just always
    return the original stack, even when the element you want to pop to is on it.


    ```

    list_stack %

    push(1) %>%

    push(2) %>%

    push(3)

    pop_until(list_stack, 1)

    ```


    If you write an algorithm that operates on a polymorphic object, stick to the
    interface it has, if at all possible. For the `pop_until` function we can easily
    implement it using just the stack interface.


    ```

    pop_until <- function(stack, element) {

    s <- stack

    while (!is_empty(s) && top(s) != element) s <- pop(s)

    if (is_empty(s)) stack else s

    }

    ```


    If you cannot achieve what you need using the interface, you should instead extend
    it. You can always write new generic functions that work on a class.


    ```

    contains <- function(stack, element) {

    UseMethod("contains")

    }

    contains.default <- function(stack, element) {

    .NotYetImplemented()

    }

    contains.vector_stack <- function(stack, element) {

    element %in% stack

    }

    ```


    You do not need to implement concrete functions for all implementations of an
    abstract data type to add a generic function. If you have a default implementation
    that gives you an error—and you have proper unit tests for any code you use—you
    will get an error if your algorithm attempts to use the function if it isn’t implemented
    yet, and you can add it at that point.


    Adding new generic functions is not as ideal as using the original interface in
    the first place if the abstract data type is from another package. If the implementation
    in that package changes at a later point, your new generic function might break—and
    might break silently. Still, combined with proper unit tests, it is a much better
    solution than simply accessing the detailed implementation in your other functions.


    ## Designing Minimal and Powerful Interfaces


    Designing interfaces is a bit of an art. When you create your own abstract types,
    you want to think carefully about which operations the type should have. You don’t
    want to have too many operations. That would make it harder for people implementing
    other versions of the type; they would need to implement all the operations ,
    and depending on what those operations are, this could involve a lot of work.
    On the other hand, you can’t have too few operations, because then algorithms
    using the type will often have to break the interface to get to implementation
    details, which will break the polymorphism of those algorithms.


    The abstract data types you learn about in an algorithms class are good examples
    of minimal yet powerful interfaces. They define the minimum number of operations
    necessary to get useful work done, yet still make implementations of concrete
    stacks, queues, dictionaries, etc. possible with minimal work.


    When designing your own types, try to achieve the same kind of minimal interfaces.'
