  trans: '

    # 构建拟合模型对象


    现在，我们想将拟合模型包装在一个类中，以便为它们编写一个构造函数。对于拟合模型，传统做法是将公式、数据以及函数调用与拟合模型本身一起包含在对象中，因此我们将把这些作为属性放入对象中。构造函数可能如下所示：


    ```

    blm <- function(formula, b, data, prior = NULL, a = NULL) {

    if (is.null(prior)) {

    if (is.null(a)) stop("Without a prior you must provide a.")

    prior <- prior_distribution(formula, a, data)

    } else {

    if (inherits(prior, "blm")) {

    prior <- prior$prior

    }

    }

    if (!inherits(prior, "wdist")) {

    stop("The provided prior does not have the expected type.")

    }

    posterior <- fit_posterior(formula, b, prior, data)

    structure(

    list(formula = formula,

    data = model.frame(formula, data),

    dist = posterior,

    call = match.call()),

    class = "blm"

    )

    }

    ```


    构造函数开头的测试允许我们将先验指定为正态分布或先前拟合的 `blm` 对象。如果我们得到一个先验分布，我们可能还应该检查这个先验是否与实际公式兼容，但我将让你自己编写这样的检查来尝试一下。


    如果我们打印使用 `blm` 函数拟合的对象，它们将仅以列表形式打印，但我们可以通过特化 `print` 泛型函数来提供我们自己的 `print` 函数。这里，传统做法是提供用于指定模型的函数调用，所以我目前就只做这些。


    ```

    print.blm <- function(x, ...) {

    print(x$call)

    }

    ```


    我们必须匹配泛型函数的参数，这就是参数是 `x` 和...的原因。然而，我们所做的只是打印对象的 `call` 属性。


    现在，我们可以像这样拟合数据并获得一个 `blm` 对象：


    ```

    (model <- blm(y ∼ x + I(x**2), a = 1, b = 1, data = d))

    ## blm(formula = y ∼ x + I(x²), b = 1, data = d, a = 1)

    ```


    ## 系数与置信区间


    一旦我们有了一个拟合模型，我们可能想获取拟合值。传统上这是通过泛型函数 `coef` 完成的，它应该简单地返回这些值。对于贝叶斯线性回归模型，拟合值是整个分布，但我们可以将均值作为点估计并返回它们，从而实现如下的
    `coef` 函数：


    ```

    coef.blm <- function(object, ...) {

    t(object$dist$mu)

    }

    coef(model)

    ##      (Intercept)         x    I(x²)

    ## [1,]    1.190673 0.2815418 0.1185518

    ```


    这里，我变换了均值矩阵，以使系数的形式类似于使用 `lm` 函数拟合的传统线性模型所得到的系数，除此之外，该函数只是返回均值。


    对于经典的频率派模型，我们通常还想要参数的置信区间，传统方法是使用 `confint` 函数。这个函数的签名为：


    ```

    confint(object, parm, level = 0.95, ...)

    ```


    `object` 参数是拟合模型，`parm` 包含我们想要获取置信区间的参数。如果缺失，我们应该返回所有模型参数，而 `level` 参数则指定我们所需的置信水平区间。


    同样，对于贝叶斯模型，我们拥有整个分布而不仅仅是置信区间，但我们可以通过获取每个参数边际分布的分位数来得到类似的结果。参数服从正态分布，我们可以分别从均值和协方差矩阵获取均值和标准差。之后，我们可以使用
    `qnorm` 函数获取分位数，并像这样构造区间：


    ```

    confint.blm <- function(object, parm, level = 0.95, ...) {

    if (missing(parm)) {

    parm <- rownames(object$dist$mu)

    }

    means <- object$dist$mu[parm,]

    sds <- sqrt(diag(object$dist$S)[parm])

    lower_q <- qnorm(p = (1-level)/2,

    mean = means,

    sd = sds)

    upper_q <- qnorm(p = 1 - (1-level)/2,

    mean = means,

    sd = sds)

    quantiles <- cbind(lower_q, upper_q)

    quantile_names <- paste(

    100 * c((1-level)/2, 1 - (1 -level)/2),

    "%",

    sep = ""

    )

    colnames(quantiles) <- quantile_names

    quantiles

    }

    confint(model)

    ##                   2.5%    97.5%

    ## (Intercept)  0.3754236 2.005923

    ## x           -1.4001225 1.963206

    ## I(x²)      -1.8222478 2.059351

    ```

    '
- fmt: '# Predicting Response Variables


    When it comes to predicting response variables for new data, there is a little
    more work to be done for the model matrix. If we don’t have the response variable
    when we create a model matrix, we will get an error, even though the model matrix
    doesn’t actually contain a column with it. We can see this if we remove the `x`
    and `y` variables we used when creating the data frame earlier.


    ```

    rm(x) ; rm(y)

    ```


    We are fine if we build a model matrix from the data frame that has both `x` and
    `y`.


    ```

    model.matrix(y ∼ x + I(x**2), data = d)

    ##   (Intercept)           x      I(x^2)

    ## 1           1 -0.20409732 0.041655716

    ## 2           1 -0.22561419 0.050901761

    ## 3           1  0.34702845 0.120428747

    ## 4           1  0.03236784 0.001047677

    ## 5           1  0.41353129 0.171008128

    ## attr(,"assign")

    ## [1] 0 1 2

    ```


    If we create a data frame that only has `x` values, though, we get an error.


    ```

    dd <- data.frame(x = rnorm(5))

    model.matrix(y ∼ x + I(x**2), data = dd)

    ## Error in eval(expr, envir, enclos): object ''y'' not found

    ```


    This, of course, is a problem since we are interested in predicting response variables
    exactly when we do not have them. This is ironic, considering that the model matrix
    never actually contains the response variable; nevertheless, this is how R works.


    To remove the response variable from a formula, before we construct a model matrix,
    we need to use the function `delete.response`. Unfortunately, this function does
    not work directly on formulae, but on so-called "terms" objects. We can translate
    a formula into its terms using the `terms` function. So to remove the terms from
    a formula, we need the following construction:


    ```

    delete.response(terms(y ∼ x))

    ```


    The result is a `terms` object, but since the `terms` class is a specialization
    of the `formula` class, we can use it directly with the `model.matrix` function
    to construct the model matrix.


    ```

    model.matrix(delete.response(terms(y ∼ x)), data = dd)

    ##   (Intercept)           x

    ## 1           1  0.49841617

    ## 2           1 -1.74230249

    ## 3           1  0.97552910

    ## 4           1 -0.02408287

    ## 5           1  0.67568448

    ## attr(,"assign")

    ## [1] 0 1

    ```


    Now, for actually predicting data, we traditionally use the `predict` generic
    function. This function has the following signature:


    ```

    function(object, ...)

    ```


    Which, quite frankly, isn’t that useful. We can add to it, though, as the `lm`
    class does, so we can add a parameter `newdata` to it. From `newdata` we will
    construct a model matrix and make predictions for the data in this. If we just
    want point estimates for the new data, we can simply take the inner product of
    the mean weights and each row in the model matrix so we can implement the `predict`
    function like this:


    ```

    predict.blm <- function(object, newdata, ...) {

    updated_terms <- delete.response(terms(object$formula))

    X <- model.matrix(updated_terms, data = newdata)

    predictions <- vector("numeric", length = nrow(X))

    for (i in seq_along(predictions)) {

    predictions[i] <- t(object$dist$mu) %*% X[i,]

    }

    predictions

    }

    predict(model, d)

    ## [1] 1.138150 1.133188 1.302653 1.199910 1.327373

    ```


    To check the model, we can plot the predicted values against the true response
    values. With the data we have used up till now, though, with only five data points,
    we don’t expect the predictions to be particularly good, and we don’t expect such
    a plot to show much, but we can try with a few more data points.


    ![A451015_1_En_4_Fig3_HTML.jpg](A451015_1_En_4_Fig3_HTML.jpg)


    Figure 4-3. True versus predicted values


    ```

    d <- {

    x <- rnorm(50)

    y <- 0.2 + 1.4 * x + rnorm(50)

    data.frame(x = x, y = y)

    }

    model <- blm(y ∼ x, d, a = 1, b = 1)

    plot(d$y, predict(model, d),

    xlab = "True responses",

    ylab = "Predicted responses")

    ```


    Predicting values for the original data is so common that there is another generic
    function for doing this, called `fitted`. We can implement it like this:


    ```

    fitted.blm <- function(object, ...) {

    predict(object, newdata = object$data, ...)

    }

    ```


    With this function, we could then create the plot as follows:


    ```

    plot(d$y, fitted(model),

    xlab = "True responses",

    ylab = "Predicted responses")

    ```


    We can, of course, do more than simply predict point estimates. We have a distribution
    of weights, which means that the slope and intercept of a line aren’t fixed. They
    are, conceptually at least, drawn from a distribution. Slight changes in the slope
    won’t have much of an impact on how certain we are in the predictions near the
    main mass of the data, but data points further towards the edges of the data will
    have a larger uncertainty because of this. We can take the distribution into account
    when we make predictions to get error bars for the predictions. If `X` is the
    model matrix and `S` the covariance matrix for the posterior, then the variance
    for the ith prediction is given by:


    ```

    1/b + t(X[i,]) %*% S %*% X[i,]

    ```


    We don’t have the precision parameter, `b`, stored in the fitted model object,
    so if we want to get error bars, we need to keep that around. So update your `blm`
    function to return this structure:


    ```

    structure(

    list(formula = formula,

    data = model.frame(formula, data),

    dist = posterior,

    precision = b,

    call = match.call()),

    class = "blm"

    )

    ```


    Now, we can extend our `predict` function with an option that, if `TRUE`, returns
    intervals as well:


    ```

    predict.blm <- function(object, newdata,

    intervals = FALSE,

    level = 0.95,

    ...) {

    updated_terms <- delete.response(terms(object$formula))

    X <- model.matrix(updated_terms, data = newdata)

    predictions <- vector("numeric", length = nrow(X))

    for (i in seq_along(predictions)) {

    predictions[i] <- t(object$dist$mu) %*% X[i,]

    }

    if (!intervals) return(predictions)

    S <- model$dist$S

    b <- model$precision

    sds <- vector("numeric", length = nrow(X))

    for (i in seq_along(predictions)) {

    sds[i] <- sqrt(1/b + t(X[i,]) %*% S %*% X[i,])

    }

    lower_q <- qnorm(p = (1-level)/2,

    mean = predictions,

    sd = sds)

    upper_q <- qnorm(p = 1 - (1-level)/2,

    mean = predictions,

    sd = sds)

    intervals <- cbind(lower_q, predictions, upper_q)

    colnames(intervals) <- c("lower", "mean", "upper")

    as.data.frame(intervals)

    }

    model <- blm(y ∼ x, d, a = 1, b = 1)

    ```


    With this `predict` function, we can plot error bars around our predictions as
    well, see Figure 4-4. In the figure, I also plot the x = y line. If we make accurate
    predictions, the point should lie on this line. Since there is some stochasticity
    in the data, we don’t expect to be exactly on it, but we do expect to overlap
    the line 95% of the time.


    ![A451015_1_En_4_Fig4_HTML.jpg](A451015_1_En_4_Fig4_HTML.jpg)


    Figure 4-4. Predictions versus true values with confidence intervals


    ```

    require(ggplot2)

    predictions <- fitted(model, intervals = TRUE)

    ggplot(cbind(data.frame(y = d$y), predictions),

    aes(x = y, y = mean)) +

    geom_point() +

    geom_errorbar(aes(ymin = lower, ymax = upper)) +

    geom_abline(slope = 1) +

    xlab("True responses") +

    ylab("Predictions") +

    theme_minimal()

    ```


    There is, of course, much more we can do with a statistical model, and more generic
    functions we could add to it to provide a uniform interface to a class of models,
    but I hope this example has at least given you an impression of how representing
    a model as a class can be useful.'
