  raw: '## Interaction with S3 and Operator Overloading


    We don’t have a mechanism for defining new operators for R6 objects, but we can
    use the S3 system for this. Objects create from R6 object generators are assigned
    a `class` attribute, a list of the name we give the class when creating the generator
    and `"R6"`, so we can define generic function specializations for them.


    We can implement the `modulus` class in R6 like this:


    ```

    modulus <- R6Class("modulus",

    private = list(

    value_ = c(),

    n_ = c()

    ),

    public = list(

    initialize = function(value, n) {

    private$value_ <- value

    private$n_ <- n

    },

    print = function() {

    cat("Modulus", private$n_, "values:\n")

    print(private$value_)

    }

    ),

    active = list(

    value = function(value) {

    if (missing(value)) private$value_

    else private$value_ <- value %% private$n_

    },

    n = function(value) {

    if (!missing(value)) stop("Cannot change n")

    private$n_

    }

    ))

    (x <- modulus$new(value = 1:6, n = 3))

    ## Modulus 3 values:

    ## [1] 1 2 3 4 5 6

    ```


    There are a few things going on in this class definition. We define the attributes
    for holding the data in the `private` list, define an initialization function
    and a print function, and then we define two `action` attributes for accessing
    the data. We allow users of the class to modify `values` but not `n` (for no good
    reason other than it gives us an example of two different behaviors), and for
    the `values` attribute we make sure that we modify the data before we store it
    in the private `values_` variable.


    The `class` attribute of objects of this class contains this:


    ```

    class(x)

    ## [1] "modulus" "R6"

    ```


    This means that we can define arithmetic operations on the class using the S3
    system like this:


    ```

    Ops.modulus <- function(e1, e2) {

    nx <- ny <- NULL

    if (inherits(e1, "modulus")) nx <- e1$n

    if (inherits(e2, "modulus")) ny <- e2$n

    if (!is.null(nx) && !is.null(ny) && nx != ny)

    stop("Incompatible types")

    n <- ifelse(!is.null(nx), nx, ny)

    v1 <- e1

    v2 <- e2

    if (inherits(e1, "modulus")) v1 <- e1$value

    if (inherits(e2, "modulus")) v2 <- e2$value

    e1 <- v1 ; e2 <- v2

    result <- NextMethod() %% n

    modulus$new(result, n)

    }

    ```


    The implementation is slightly different from the S3 version, because the data
    in the objects are represented differently, but the general control flow is the
    same, and with this definition we have modulus arithmetic.


    ```

    x + 1:6

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    1:6 + x

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    2 * x

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    ```


    If you make subclasses of an R6 class like `modulus`, you will get a `class` attribute
    that also reflects this, so the S3 dispatch mechanism will also work for sub-classes
    in the R6 system.


    ```

    modulus2 <- R6Class("modulus2", inherit = modulus)

    y <- modulus2$new(value = 1:2, n = 3)

    class(y)

    ## [1] "modulus2" "modulus"  "R6"

    x + y

    ## Modulus 3 values:

    ## [1] 2 1 1 0 0 2

    ```


    That being said, don’t go crazy with combining R6 and S3 either; it will only
    confuse the maintainers of your code (which are likely to include yourself sometime
    in the future) .


    # 8. Conclusions


    This concludes this book on object-oriented programming in R. You now know the
    three different systems for object-oriented programming in R and how to use them
    to define class hierarchies and polymorphic functions.


    Object-oriented programming in R, at least for the S3 and S4 system, differs from
    most other object-oriented programming languages. Most languages consider objects
    mutable, and most object-oriented software designs involve wiring up objects with
    references to each other such that their behavior depends on the changing states
    of other objects. The R6 system is closer to this type of language design. Still,
    the S3 and S4 systems combine two powerful programming language paradigms: functional
    programming and object-oriented programming. The combination of dynamic function
    dispatch based on the argument types and high-level functional programming lets
    you construct flexible and extensible software.


    It can be confusing with three very different systems for object-oriented programming
    in the same language, and I would recommend that you stick to one for any single
    project. Knowing all three, however, and knowing the pros and cons of using them
    lets you pick the right tool for any particular job. The S3 system is the simplest
    of the three and useful for getting a small model up and running in short time.
    The more formal classes of S4 makes it easier to structure more complex frameworks,
    and the reference semantics of R6 make it simpler to implement traditional mutable
    data structures than you can otherwise easily do in R.


    Getting familiar with these systems, of course, requires practice and you will
    not be an expert object-oriented programming just from reading this book. You
    know enough now, though, to get started.


