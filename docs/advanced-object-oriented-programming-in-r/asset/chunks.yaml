- fmt: '## Generic Functions


    In the S3 system, we create generic functions just as normal functions that call
    `UseMethod`. In S4 we have to define generic functions explicitly using the `setGeneric`
    function. The first argument of `setGeneric` is the name of the generic function.
    If you have an existing function that you want to make generic, calling `setGeneric`
    with its name will create a generic function with the existing function as the
    default implementation. Typically, though, we use `setGeneric` to create a brand
    new generic function, and in that case, we need to provide a definition of the
    function as well. This we do through the parameter `def`. This function plays
    the role that the function definition in S3 has: it should simply call the function
    `standardGeneric`, which is S4''s analogue to `UseMethod`.


    We can define the interface of the stack abstract data structure like this:


    ```

    setGeneric("top",

    def = function(stack) standardGeneric("top"))

    setGeneric("pop",

    def = function(stack) standardGeneric("pop"))

    setGeneric("push",

    def = function(stack, element) standardGeneric("push"))

    setGeneric("is_empty",

    def = function(stack) standardGeneric("is_empty"))

    ```


    To provide implementations of generic functions we use the function `setMethod`.
    We need to provide the name of the generic function, the signature of the method
    (which is the type(s) used for dispatching the method), and the definition of
    the function.


    When a generic function is called, the concrete implementation is chosen based
    on the type of the arguments to the function. This is what we call dynamic dispatch,
    and in S3 it is based on a single argument—typically the first—but in S4 we can
    dispatch based on more complex type information. To get behavior similar to S3
    we just provide a signature that is a class name. This, then, makes S4 choose
    a given implementation based on the class of the first argument to the generic
    function.


    We can implement the vector stack thus:


    ```

    setMethod("top", signature = "VectorStack",

    definition = function(stack) stack@elements[1])

    setMethod("pop", signature = "VectorStack",

    definition = function(stack) {

    VectorStack(elements = stack@elements[-1])

    })

    setMethod("push", signature = "VectorStack",

    definition = function(stack, element) {

    VectorStack(elements = c(element, stack@elements))

    })

    setMethod("is_empty", signature = "VectorStack",

    definition = function(stack) length(stack@elements) == 0)

    ```


    The implementations are just variations of the functions we defined in the S3
    implementation, and we can use the class just as before.


    ```

    stack <- VectorStack()

    stack <- push(stack, 1)

    stack <- push(stack, 2)

    stack <- push(stack, 3)

    stack

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 3 2 1

    while (!is_empty(stack)) {

    stack <- pop(stack)

    }

    stack

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## numeric(0)

    ```


    ### Slot Prototypes


    When you create an object, and you don''t provide values for the slots, you will
    get default values, which are often empty vectors or empty lists. For example,
    if we create a class for representing natural numbers, we can write the class
    like this:


    ```

    NaturalNumber <- setClass("NaturalNumber",

    slots = c(

    n = "integer"

    ))

    ```


    If we instantiate it without arguments the object will contain an empty vector
    for the natural number it is supposed to represent.


    ```

    (n <- NaturalNumber())

    ## An object of class "NaturalNumber"

    ## Slot "n":

    ## integer(0)

    ```


    If, instead, we want other default values, we can use the `prototype` argument
    to `setClass`. For example, we can state that the default natural number is zero.


    ```

    NaturalNumber <- setClass("NaturalNumber",

    slots = c(

    n = "integer"

    ),

    prototype = list(

    n = as.integer(0)

    ))

    ```


    Now, when we create an object, it will get the default value from the prototype.


    ```

    (n <- NaturalNumber())

    ## An object of class "NaturalNumber"

    ## Slot "n":

    ## [1] 0

    ```


    This, of course, doesn''t prevent us from specifying other values as arguments
    when we create an object.


    ```

    (n <- NaturalNumber(n = as.integer(1)))

    ## An object of class "NaturalNumber"

    ## Slot "n":

    ## [1] 1

    ```


    ### Object Validity


    The type we give slots when we specify them puts type constraints on objects.
    When we declared that the `n` slot in `NaturalNumber` should be an integer, we
    constrained the values we can assign to that slot. If we try to assign a `numeric`
    instead, we will get an error.


    For natural numbers, we do not want negative integers to be included, but since
    negative integers are still integers, there is no constraint to assigning such
    a value.


    ```

    n@n <- as.integer(-1)

    ```


    We can put further constraints on objects via the `validity` argument to `setClass`.
    This argument should be a function that tests if an object is valid. If it is,
    it should return `TRUE`. Otherwise, it should return `FALSE`.


    ```

    NaturalNumber <- setClass("NaturalNumber",

    slots = c(

    n = "integer"

    ),

    prototype = list(

    n = as.integer(0)

    ),

    validity = function(object) {

    if (object@n < 0) {

    return("negative natural number")

    }

    return(TRUE)

    })

    ```


    With this validity checking, attempting to write the following will result in
    an error:


    ```

    n <- NaturalNumber(n = as.integer(-1))

    ```


    The validity test is only done when creating objects, though. We can modify objects
    and put them in an invalid state.


    ```

    n@n <- as.integer(-1)

    ```


    This behavior is necessary since, when modifying an object, it is likely to be
    in an invalid state until we are done modifying it. At any point when you are
    done modifying an object, though, you can call the `validObject` function to check
    the validity again, using the following:


    ```

    validObject(n)

    ```


    This would fail in this case, of course, since we just left `n` in an invalid
    state.'
