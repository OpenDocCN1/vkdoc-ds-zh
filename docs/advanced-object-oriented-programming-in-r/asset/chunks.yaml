  trans: '

    # 结合 S3 与 S4 类系统


    你可以在一定程度上结合使用 S3 和 S4 类系统。这两种系统不同，我**不推荐**尝试编写将 S3 和 S4 类层次结构紧密连接起来的软件。那样只会导致徒增烦恼与无尽调试。但如果你已有
    S3 代码，并希望用 S4 编写扩展，这是可以做到的。


    假设我们有一个 S3 类 `X`，它拥有泛型函数 `foo` 和 `bar`。


    ```

    X <- function(x) {

    structure(list(x = x), class = "X")

    }

    foo <- function(x) UseMethod("foo")

    bar <- function(x) UseMethod("bar")

    foo.X <- function(x) "foo"

    bar.X <- function(x) x$x

    x <- X(5)

    foo(x)

    ## [1] "foo"

    bar(x)

    ## [1] 5

    ```


    如果我们想编写 `X` 的一个子类，称之为 `Y`，并且希望用 S4 来编写 `Y`，我们不能在 `setClass` 的 `contains` 选项中直接使用
    `X`。虽然语法上可以，但当你尝试实例化该类的对象时会出错。S4 系统不知道任何名为 `X` 的类，因此我们首先需要让它识别。我们可以使用 `setOldClass`
    函数来实现。


    ```

    setOldClass("X")

    ```


    这有两个作用：它让 S4 知道这个类的存在，以便我们可以继承它；同时，它使得为该类定义的任何泛型函数都能被我们通过 `setMethod` 来特化。因此，调用
    `setOldClass` 后，我们就可以将 `X` 的一个子类定义为 S4 类。


    ```

    Y <- setClass("Y", contains = "X")

    ```


    在 `Y` 类型的对象上调用 `foo` 或 `bar` 同样会通过动态分派系统工作，由于没有更匹配的 `foo.Y` 函数，会调用 `foo.X`。


    ```

    y <- Y()

    foo(y)

    ## [1] "foo"

    ```


    如果我们愿意，可以通过实现 `foo.Y` 来为 `Y` 对象创建特化版本的 `foo`。


    ```

    foo.Y <- function(x) "Y::foo"

    foo(y)

    ## [1] "Y::foo"

    ```


    当然，这属于 S3 中特化泛型函数的方式，既然我们现在处理的是 S4 类，最好使用 `setMethod`。


    与 `foo` 类似，调用 `bar` 会触发 `bar.X`。但在这里会导致错误，因为即使 S4 知道 `X` 类，它也不知道该类的构造函数或所创建的 `X`
    对象的内部表示。


    ```

    bar(y)

    ## Error in x$x: $ operator not defined for this S4 class

    ```


    在 S3 中没有构造函数或对象表示的形式化定义，只有非正式的编码约定，所以 S4 无法知道 `bar` 函数期望从 `X` 对象中获取什么。S3 和 S4
    的自动集成程度是有限的，需要一些编码工作才能使 S3 版本的功能也适用于 S4 类。


    ```

    Y <- setClass("Y", contains = "X", slots = c(x = "ANY"))

    setMethod("bar", signature = "Y",

    definition = function(x) x@x)

    y <- Y(x = 13)

    bar(y)

    ## [1] 13

    ```


    我**不建议**混合使用 S3 和 S4。如果你已有使用 S3 系统编写的代码，继续坚持使用 S3 可能比尝试结合两个系统更好。但是，如果你正在使用 S4
    编写代码，并且需要引入一些 S3 类的功能，上述方法是可行的。


    ## R6 类系统


    我们要看的最后一个对象系统是 R6 系统。这个系统与 S3 和 S4 非常不同，对于 R 语言整体而言也很不寻常，因为它引入了**可变数据**。在 R 中，数据通常是不可变的，任何看似修改对象的操作实际上都是通过复制数据和构造新对象来实现的。在
    R 中唯一能修改的东西是环境；你不能修改数据。然而，R6 系统使用环境来提供给我们可以修改的对象。这在 R 中是不寻常的，但其语义却与大多数其他语言中实现面向对象的方式相似，即方法修改对象而非创建新对象。如果你从其他编程语言转到
    R，R6 系统可能让你感到更熟悉；但由于它给 R 带来了副作用，如果你更熟悉 R 的传统特性，它可能会让你感到意外。如果你有两个指向同一个 R6 对象的引用，并通过其中一个变量修改了它，另一个变量所指对象的状态也会随之改变。这在另外两个类系统中是不会发生的。


    R6 系统是对这种语义的更好实现，相较于内置的引用类系统（RC），后者也称为 R5。在来自 S 语言的 S3 和 S4 对象系统之后，R5 本是 R 中实现的下一个对象系统的自然名称。因为
    R6 与 R5 具有相同的语义，并且被认为是其更好的实现，我将不再进一步讨论 R5。

    '
- fmt: '# Defining Classes


    Classes are defined using the `R6Class` function from the package `R6`. Similar
    to `setClass` from S4, we need to give the class a name, and we have a number
    of optional arguments for defining how objects of the class should look and behave.
    Unlike S4, we need to capture the result from the call to `R6Class` in order to
    create objects of the class. In S4 this is a convention, but we can create objects
    as long as we know the name of a class. In R6, the name is mainly used to set
    the `class` attribute so the objects can interact with S3 polymorphism. It is
    the return value of `R6Class` we use to create objects.


    As an example, once again we implement a stack. This time I will not bother with
    an abstract super class but just implement a `VectorStack` directly. One implementation
    can look like this:


    ```

    library(R6)

    VectorStack <- R6Class("VectorStack",

    private = list(elements = NULL),

    public = list(

    top = function() {

    private$elements[1]

    },

    pop = function() {

    private$elements <-

    private$elements[-1]

    invisible(self)

    },

    push = function(e) {

    private$elements <-

    c(e, private$elements)

    invisible(self)

    },

    is_empty = function() {

    length(private$elements) == 0

    }

    ))

    ```


    Here, besides the class name, we use two arguments to `R6Class`: `private` and
    `public`. These are used to define attributes of the class, either values stored
    in objects or methods we can call on the objects. For both, the arguments are
    lists. The names used for the list elements become the names of the attributes
    and the values—naturally, the attribute values.


    The difference between the two arguments is that attributes in the `public` list
    can be accessed anywhere while attributes in the `private` list can only be accessed
    in methods you define for the class. In methods, you can access elements in the
    `public` list using the variable `self`, and you can access attributes in the
    `private` list using the variable `private`. In this `VectorStack` implementation,
    we have made the vector used for storing the stack private, and we have implemented
    the stack interface as public methods. Inside the methods we access the elements
    as `private$elements`, and in `push` and `pop` we return the object itself using
    the variable `self`. We return this object wrapped in `invisible`, so it isn’t
    automatically printed when we call these methods, but we didn’t have to. We didn’t
    have to return an object at all for these methods, but doing so allows us to chain
    together method calls, as we will see below, so it is good practice.


    Notice that the `self` and `private` objects are not arguments to the methods.
    They just exist in the namespace of the functions as part of the magic R6 uses
    to implement its mutable object semantics.


    The `VectorStack` object we create this way is not a constructor function itself,
    as it was for S4. It is a so-called object generator. To create an object we use
    the attribute `new` of this generator thus:


    ```

    (stack <- VectorStack$new())

    ## <VectorStack>

    ##   Public:

    ##     clone: function (deep = FALSE)

    ##     is_empty: function ()

    ##     pop: function ()

    ##     push: function (e)

    ##     top: function ()

    ##   Private:

    ##     elements: NULL

    ```


    Printing this object is rather verbose, but if we define the method `print` for
    the class we can modify how it is displayed.


    ```

    VectorStack <- R6Class("VectorStack",

    private = list(elements = NULL),

    public = list(

    # ... rest of the methods

    print = function() {

    cat("Stack elements:\n")

    print(private$elements)

    }

    ))

    ```


    This doesn’t modify the existing object.


    ```

    stack

    ## <VectorStack>

    ##   Public:

    ##     clone: function (deep = FALSE)

    ##     is_empty: function ()

    ##     pop: function ()

    ##     push: function (e)

    ##     top: function ()

    ##   Private:

    ##     elements: NULL

    ```


    It has an effect if we create a new one, however.


    ```

    (stack <- VectorStack$new())

    ## Stack elements:

    ## NULL

    ```


    We can access the (public) attributes of the stack object, and call methods if
    the attributes are functions, using `$` indexing:


    ```

    stack$push(1)$push(2)$push(3)

    stack

    ## Stack elements:

    ## [1] 3 2 1

    while (!stack$is_empty()) stack$pop()

    stack

    ## Stack elements:

    ## numeric(0)

    ```


    The chained call to `push` here is possible because the `push` method returns
    the object itself. Unlike the previous implementations where `push` returns a
    new object, for the R6 object, the existing object is modified. We do not need
    to assign the result of the three `push` calls back to `stack`, and we do not
    need to assign the calls to `pop` back to `stack` either. Returning the object
    itself in these functions allows us to chain method calls, but that is all this
    does. The R6 object is not immutable.


    ## Object Initialization


    If we want to set attributes of objects when constructing them, we need to do
    a little more work than in S4. We cannot just use named arguments in the constructor;
    this call would give us an error:


    ```

    stack <- VectorStack$new(elements = 1:4)

    ```


    To be able to initialize objects this way, we need to explicitly write a function
    for it. This function must be a `public` method called `initialize`. If you want
    the constructor to take arguments, you must specify the arguments in this function.
    You cannot make this function `private`; it is an error to put a function named
    `initialize` in the `private` list.


    To initialize `VectorStack` objects with a sequence of elements we can implement
    its `initialize` function like this:


    ```

    VectorStack <- R6Class("VectorStack",

    private = list(elements = NULL),

    public = list(

    initialize = function(elements = NULL) {

    private$elements <- elements

    },

    # ... rest of the methods

    ))

    ```


    With this initialization function we can now construct objects with `elements`
    initialized.


    ```

    (stack <- VectorStack$new(elements = 1:4))

    ## Stack elements:

    ## [1] 1 2 3 4

    ```'
