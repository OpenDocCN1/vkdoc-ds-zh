    # 定义类


    类的定义需要使用 `R6` 包中的 `R6Class` 函数。与 S4 的 `setClass` 类似，我们需要为类指定一个名称，并且有多个可选参数用于定义该类的对象应具有的外观和行为。与
    S4 不同的是，我们需要保存调用 `R6Class` 的返回值，以便用它来创建该类的对象。在 S4 中这只是一种约定，但只要我们知道类的名称就可以创建对象。而在
    R6 中，类名主要用于设置 `class` 属性，以便对象可以与 S3 多态交互。我们用来创建对象的是 `R6Class` 的返回值。


    例如，我们再次实现一个栈。这次我将不麻烦地创建一个抽象超类，而是直接实现一个 `VectorStack`。一种实现可能如下所示：


    ```

    library(R6)

    VectorStack <- R6Class("VectorStack",

    private = list(elements = NULL),

    public = list(

    top = function() {

    private$elements[1]

    },

    pop = function() {

    private$elements <-

    private$elements[-1]

    invisible(self)

    },

    push = function(e) {

    private$elements <-

    c(e, private$elements)

    invisible(self)

    },

    is_empty = function() {

    length(private$elements) == 0

    }

    ))

    ```


    在这里，除了类名，我们向 `R6Class` 传入了两个参数：`private` 和 `public`。这两个参数用于定义类的属性，无论是存储在对象中的值还是可以在对象上调用的方法。对于两者，参数都是列表。列表元素的名称成为属性的名称，而其值——理所当然地——成为属性的值。


    这两个参数的区别在于，`public` 列表中的属性可以在任何地方访问，而 `private` 列表中的属性只能在为该类定义的方法中访问。在方法中，你可以使用变量
    `self` 访问 `public` 列表中的元素，并使用变量 `private` 访问 `private` 列表中的属性。在这个 `VectorStack`
    实现中，我们将用于存储栈的向量设为私有，并将栈接口实现为公共方法。在方法内部，我们通过 `private$elements` 访问元素，在 `push` 和
    `pop` 方法中，我们使用变量 `self` 返回对象本身。我们将对象包裹在 `invisible` 中返回，这样在调用这些方法时它不会自动打印出来，但我们并非必须这样做。我们甚至根本不必为这些方法返回对象，但这样做允许我们链式调用方法，正如我们将在下面看到的，因此这是一个好的实践。


    请注意，`self` 和 `private` 对象并不是方法的参数。它们只是作为 R6 用于实现其可变对象语义的一部分魔法，存在于函数的命名空间中。


    我们通过这种方式创建的 `VectorStack` 对象本身并不是构造函数，这与 S4 不同。它是一个所谓的对象生成器。要创建一个对象，我们使用这个生成器的
    `new` 属性，如下所示：


    ```

    (stack <- VectorStack$new())

    ## <VectorStack>

    ##   Public:

    ##     clone: function (deep = FALSE)

    ##     is_empty: function ()

    ##     pop: function ()

    ##     push: function (e)

    ##     top: function ()

    ##   Private:

    ##     elements: NULL

    ```


    打印这个对象相当冗长，但如果我们为类定义 `print` 方法，就可以修改它的显示方式。


    ```

    VectorStack <- R6Class("VectorStack",

    private = list(elements = NULL),

    public = list(

    # ... 其余的方法

    print = function() {

    cat("Stack elements:\n")

    print(private$elements)

    }

    ))

    ```


    这不会修改现有对象。


    ```

    stack

    ## <VectorStack>

    ##   Public:

    ##     clone: function (deep = FALSE)

    ##     is_empty: function ()

    ##     pop: function ()

    ##     push: function (e)

    ##     top: function ()

    ##   Private:

    ##     elements: NULL

    ```


    但是，如果我们创建一个新对象，它就会生效。


    ```

    (stack <- VectorStack$new())

    ## Stack elements:

    ## NULL

    ```


    我们可以使用 `$` 索引访问栈对象的（公共）属性，如果属性是函数，则可以调用方法：


    ```

    stack$push(1)$push(2)$push(3)

    stack

    ## Stack elements:

    ## [1] 3 2 1

    while (!stack$is_empty()) stack$pop()

    stack

    ## Stack elements:

    ## numeric(0)

    ```


    这里之所以能够链式调用 `push`，是因为 `push` 方法返回了对象本身。与之前返回新对象的实现不同，对于 R6 对象，修改的是现有对象。我们不需要将三次
    `push` 调用的结果重新赋值给 `stack`，也不需要将 `pop` 的调用结果重新赋值给 `stack`。在这些函数中返回对象本身允许我们链式调用方法，但仅此而已。R6
    对象不是不可变的。


    ## 对象初始化


    如果我们想在构造对象时设置其属性，需要做的工作比在 S4 中稍多一些。我们不能仅仅在构造函数中使用命名参数；这样的调用会给我们一个错误：


    ```

    stack <- VectorStack$new(elements = 1:4)

    ```


    为了能够以这种方式初始化对象，我们需要显式地为其编写一个函数。这个函数必须是一个名为 `initialize` 的 `public` 方法。如果你希望构造函数接受参数，则必须在此函数中指定参数。你不能将此函数设为
    `private`；将一个名为 `initialize` 的函数放在 `private` 列表中是一个错误。


    要用一系列元素初始化 `VectorStack` 对象，我们可以像这样实现它的 `initialize` 函数：


    ```

    VectorStack <- R6Class("VectorStack",

    private = list(elements = NULL),

    public = list(

    initialize = function(elements = NULL) {

    private$elements <- elements

    },

    # ... 其余的方法

    ))

    ```


    有了这个初始化函数，我们现在就可以用已初始化的 `elements` 构造对象了。


    ```

    (stack <- VectorStack$new(elements = 1:4))

    ## Stack elements:

    ## [1] 1 2 3 4

    ```

    '
- fmt: '# Private and Public Attributes


    The elements in the stack are private, so we cannot access them the same way we
    can the public methods. You might hope that `stack$elements` would then give you
    an error, but unfortunately not.


    ```

    stack$elements

    ## NULL

    ```


    This is because accessing a list with a key it doesn’t contain gives you `NULL`
    and it is this behavior you are getting.


    ```

    list()$elements

    ## NULL

    ```


    We can see the difference between private and public attributes with this little
    example:


    ```

    A <- R6Class("A", public = list(x = 5), private = list(y = 13))

    ```


    With this definition of class `A`, we should be able to access object’s `x` attributes,
    and we can.


    ```

    a <- A$new()

    a$x

    ## [1] 5

    a$x <- 7

    a$x

    ## [1] 7

    ```


    We can also get `y`, but it has the behavior we saw above for stacks, and we are
    not allowed to modify it since it isn’t really an attribute of the object.


    ```

    a$y

    ## NULL

    a$y <- 12

    ## Error in a$y <- 12: cannot add bindings to a locked environment

    a$y

    ## NULL

    ```


    In general, you cannot create new attributes to R6 objects just by assigning to
    `$` indexed values, as you can in S3. Attributes must be defined in the class
    definition. If you tried something like this, you would get an error:


    ```

    a$z <- "foo"

    ```


    You can modify public data attributes, as we saw above for `x`, but don’t try
    to be clever and modify methods. It is really bad practice to change methods for
    a single object to begin with, but luckily it is also “verboten” in R6, and you
    would get you an error if you tried.


    In general, it is considered good practice to keep data private and methods that
    are part of a class interface public. There are several reasons for this: if data
    is only modified through a class’s methods then you have more control over the
    state of objects and can ensure that an object is always in a valid state before
    and after all method calls, but (perhaps more importantly) keeping the representation
    of objects hidden away limits the dependency between a class and code that uses
    the class. If any code can access the inner workings of objects, there is a good
    chance that eventually a lot of code will. This means that you will have to modify
    all the uses of a class if you change how objects of the class are represented.
    If on the other hand, the code only accesses objects through a public interface,
    then you can modify all the private attributes as much as you want as long as
    you keep the public interface unchanged. You will, of course, have to modify some
    of the class’s methods, but changes will be limited to that.


    In the R6 system, private attributes can be accessed only by methods you define
    for the class or in methods defined in sub-classes. If you are used to languages
    such as C++ or Java, this might surprise you, but the private attributes in R6
    are similar to the protected attributes in those languages and not the private
    attributes .


    ## Active Bindings


    There is a way of getting the syntax of accessing data attributes without actually
    doing so. If you have code that already uses a public attribute and you want to
    change that into a function to hide or modify implementation details, you can
    use this. You can also use it if you just like the syntax for data better than
    method calls.


    This is achieved through the `active` argument to `R6Class`. Here you can provide
    a list of attributes, as for `private` and `public`, but these attributes should
    be functions, and they will define a value-like syntax for calling the functions.


    As an example, we can take the elements in the vector stack. We want to be able
    to write `stack$elements`, but we do not want to make the elements public. So
    we write a function for `elements` and add it to `active`. We cannot have the
    same name used both in `private` and `active` (or in `public` for that matter),
    so we have to change the name for the private data attribute first, and of course
    update all the existing methods. After doing that, we can add the `active` function
    like this:


    ```

    VectorStack <- R6Class("VectorStack",

    private = list(elements_ = NULL),

    public = list(

    # ... methods

    ),

    active = list(

    elements = function(value) {

    if (!missing(value))

    stop("elements are read-only")

    private$elements_

    }

    ))

    ```


    Functions in the `active` list should take one argument, `value`. This value will
    be missing when we read the attribute, and it will contain data when we assign
    to the attribute. In this implementation, we consider assigning to the elements
    an error and we return the private `elements_` when we read the attribute .


    This will give us the elements:


    ```

    stack <- VectorStack$new(elements = 1:4)

    stack$elements

    ## [1] 1 2 3 4

    ```


    Meanwhile this will raise an error:


    ```

    stack$elements <- rev(1:3)

    ## Error in (function (value) : elements are read-only

    ```


    You can use these `active` functions to modify values you assign, whether to ensure
    object consistency, or to fake an attribute that isn’t directly stored but exists
    implicitly by being computable from other data. It all depends on how you choose
    to use them.


    # Inheritance


    The way we specify class hierarchies, and the way method calls are dispatched
    to the most specialized implementation of a method, is relatively straightforward.
    We can take the example of three classes we have seen two times earlier and implement
    it in R6. To specify that one class inherits from another, we use the `inherit`
    argument to `R6Class`, and to write a more specialized version of a method, we
    simply add the method to the `public` or `private` lists. Overall, writing methods
    and class hierarchies is done with much simpler code in R6 than in both S3 and
    S4.


    ```

    A <- R6Class("A",

    public = list(

    f = function() print("A::f"),

    g = function() print("A::g"),

    h = function() print("A::h")

    ))

    B <- R6Class("B", inherit = A,

    public = list(

    g = function() print("B::g"),

    h = function() print("B::h")

    ))

    C <- R6Class("C", inherit = B,

    public = list(

    h = function() print("C::h")

    ))

    ```


    There are no surprises in how we instantiate objects of the classes; we have to
    use the `new` method in the object generators.


    ```

    x <- A$new()

    y <- B$new()

    z <- C$new()

    ```


    For method `f` we only have an implementation for class `A`, so calling `f` on
    all three objects will call that version. Except that the method call has a different
    syntax from the implementations for S3 and S4, there are no surprises here .


    ```

    x$f()

    ## [1] "A::f"

    y$f()

    ## [1] "A::f"

    z$f()

    ## [1] "A::f"

    ```


    For `g`, we have implementations in both `A` and `B`, and the `C` object will
    call the `B` implementation since this is the most specialized for that class.


    ```

    x$g()

    ## [1] "A::g"

    y$g()

    ## [1] "B::g"

    z$g()

    ## [1] "B::g"

    ```


    Finally, for `h` we have implementations in all three classes, so we call different
    methods for the three objects.


    ```

    x$h()

    ## [1] "A::h"

    y$h()

    ## [1] "B::h"

    z$h()

    ## [1] "C::h"

    ```


    There should not be any surprises in how inheritance and method dispatching works
    in R6 .'
