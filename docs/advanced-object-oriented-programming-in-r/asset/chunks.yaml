    author has received or derive statistics such as the h-index.


    There are different types of publications, so we can create sub-classes for books
    and articles, for example. A book will have an associated publisher and an ISBN
    while journal articles will have an associated journal and (typically) the page-numbers
    in the journal where the article can be found. If we, for simplicity, only allow
    those two types of publications , we can represent it as the class hierarchy shown
    in Figure [2-5](#A451015_1_En_2_Chapter.html#Fig5).


    ![A451015_1_En_2_Fig5_HTML.gif](A451015_1_En_2_Fig5_HTML.gif)


    Figure 2-5.


    Hierarchy of bibliography objects . The generic Publication class gives each publication
    a name and a list of authors and a list of other publications cited. Two concrete
    types of publications, Article and Book, add extra attributes.


    In this hierarchy, all the functions simply access attributes of objects; that
    is, they just extract data that is stored in these. Accessing attributes via functions,
    as opposed to accessing lists or vectors that are part of an object’s representation,
    is generally a good idea. It allows you to change how you represent data without
    having to change any code besides the accessor function. If your code only accesses
    your objects through functions, then you have encapsulated the implementation
    details, and updating your code later will be much simpler than it would otherwise
    be.


    Notice also that none of the accessor functions needs to differ between the two
    concrete types of publications. The abstract Publication class accesses `name`
    and `authors` and the additional attributes provided in the other classes are
    disjunct. Because of this, there is no need to have generic functions for implementing
    this class hierarchy. We can do it using just plain old functions.


    ```

    # publication interface

    publication <- function(name, authors, citations) {

    structure(list(name = name, authors = authors,

    citations = citations),

    class = "publication")

    }

    name <- function(pub) pub$name

    authors <- function(pub) pub$authors

    # articles

    article <- function(name, authors, citations, journal, pages) {

    structure(list(name = name, authors = authors,

    citations = citations,

    journal = journal, pages = pages),

    class = c("article", "publication"))

    }

    journal <- function(pub) pub$journal

    pages <- function(pub) pub$pages

    # book

    book <- function(name, authors, citations, publisher, ISBN) {

    structure(list(name = name, authors = authors,

    citations = citations,

    publisher = publisher, ISBN = ISBN),

    class = c("book", "publication"))

    }

    publisher <- function(pub) pub$publisher

    ISBN <- function(pub) pub$ISBN

    ```


    Generic functions are perfect for getting different behavior in different classes
    for the same conceptual operation, but when we can get the action we desire using
    plain old functions there is no reason to invoke generic functions.


    The implementation of publications is straightforward except when it comes to
    the `class` attributes set in the constructor functions. Here we set the classes
    to lists of class names instead of just the class names. This is how we specify
    that a `"book"` object or an `"article"` object is also a `"publication"` object.
    The design we have in mind requires that books and articles are publications,
    but since S3 classes are just names represented as strings, we cannot make this
    explicit in R. Instead we represent the class hierarchy by having the `class`
    attributes be lists of class names, going up the hierarchy from the most specialized
    to the most abstract object. How R interprets such a list of class names, and
    how it uses it to find the right implementations of generic functions, is the
    topic of the next chapter.


    It is not uncommon to have a class hierarchy similar to the one we made here for
    publications , but there are some slight problems with it. To access book-specific
    attributes, you need to know that the object you are working on is a book; treating
    publications in aggregates without having to write specialized code for dealing
    with books or articles is the purpose of using object-orientation and having the
    publication hierarchy to begin with. There is nothing wrong with having a class
    hierarchy where sub-classes add functions to the interface of their superclass,
    but if you find yourself writing such a hierarchy, you should think carefully
    about how objects from the hierarchy should be accessed and manipulated.'
  trans: '

    # 通过细化实现类层次结构的接口


    到目前为止，在给出的示例中，我们有一个抽象类定义了一个接口，然后由不同的具体类来实现它。在`stack`的例子中，不同的实现为我们提供了不同的时间复杂度权衡，但这些不同实现在概念上都只是栈。在图形对象的例子中，各种具体类在概念上是不同的对象，但它们都可以被视为图形对象，从而通过通用接口进行操作。这些是软件设计中常见的模式，但当子类（例如不同类型的图形对象）代表不同的概念类时，它们通常也可以扩展接口。


    以统计模型为例。这些通常被实现为类，这些类实现一些泛型函数，例如`predict`或`coef`，这为我们提供了统一的模型接口，使得在分析中能够切换不同的模型而无需对分析代码进行重大重写。所有模型实现的泛型函数为我们提供了最抽象类型的模型接口。例如，所有模型都必须实现`predict`和`coef`，我们才能在分析代码中将它们作为即插即用的替代品，但不同类型的模型可能会向此接口添加并非所有模型都适用的附加功能。例如，我们可以想象决策树会添加用于剪枝的功能，例如一个`prune`函数。如果所有决策树实现都有一个`prune`函数，我们可以更换决策树的实现并且仍然重用我们的代码，但由于`prune`并非为所有模型实现，我们只能用一个决策树实现替换另一个决策树，而不是任意类型的模型。我们会说决策树是模型的**特化**。所有决策树都是模型，但并非所有模型都是决策树。在类的术语中，我们会有一个模型的超类和一个决策树的子类，该子类向模型的接口添加了如`prune`这样的函数。如果我们有决策树的不同实现，决策树类通常也是抽象的，不同的实现会继承自这个类，而不是更通用的模型类（见图
    2-4）。


    ![A451015_1_En_2_Fig4_HTML.gif](img/A451015_1_En_2_Fig4_HTML.gif)


    **图 2-4.** 模型层次结构，其中决策树是`Model`类的特化，它添加了`prune`函数，并为我们提供了一个额外的抽象类，决策树的实例必须实现此类。


    另一个例子，我们可以考虑参考书目，它本质上是一个出版物列表。有不同类型的出版物，但所有出版物至少有一个名称和一个或多个作者，因此表示出版物的最抽象方式将只具有这两个属性。我们可能希望对出版物列表做的一件事是计算文献计量学指标，例如一篇出版物有多少次引用。如果每篇出版物都有一个它所引用的其他著作的列表，那么我们可以从所有相关出版物的数据库中计算出这个数字。如果我们有给定作者创建的所有出版物的列表，我们也可以计算这位特定作者收到了多少引用，或者推导出如
    h 指数这样的统计数据。


    有不同类型的出版物，因此我们可以为书籍和文章等创建子类。一本书将有一个相关的出版商和一个 ISBN，而期刊文章将有一个相关的期刊和（通常）可以在期刊中找到该文章的页码。如果我们为了简化，只允许这两种类型的出版物，我们可以将其表示为图
    2-5 所示的类层次结构。


    ![A451015_1_En_2_Fig5_HTML.gif](img/A451015_1_En_2_Fig5_HTML.gif)


    **图 2-5.** 参考书目对象的层次结构。通用的`Publication`类为每篇出版物提供名称、作者列表和引用的其他出版物列表。两种具体类型的出版物，`Article`和`Book`，添加了额外的属性。


    在这个层次结构中，所有函数都只是访问对象的属性；也就是说，它们只是提取存储在这些对象中的数据。通常，通过函数访问属性，而不是访问作为对象表示形式一部分的列表或向量，是一个好主意。这允许您更改数据的表示方式，而无需修改除了访问器函数之外的任何代码。如果您的代码仅通过函数访问您的对象，那么您就封装了实现细节，后续更新代码将比原来简单得多。


    还要注意，在这两种具体类型的出版物之间，没有一个访问器函数需要不同。抽象的`Publication`类访问`name`和`authors`，其他类中提供的附加属性是互不相交的。因此，不需要为这个类层次结构实现泛型函数。我们可以只使用普通的旧函数来完成。


    ```

    # publication interface

    publication <- function(name, authors, citations) {

    structure(list(name = name, authors = authors,

    citations = citations),

    class = "publication")

    }

    name <- function(pub) pub$name

    authors <- function(pub) pub$authors

    # articles

    article <- function(name, authors, citations, journal, pages) {

    structure(list(name = name, authors = authors,

    citations = citations,

    journal = journal, pages = pages),

    class = c("article", "publication"))

    }

    journal <- function(pub) pub$journal

    pages <- function(pub) pub$pages

    # book

    book <- function(name, authors, citations, publisher, ISBN) {

    structure(list(name = name, authors = authors,

    citations = citations,

    publisher = publisher, ISBN = ISBN),

    class = c("book", "publication"))

    }

    publisher <- function(pub) pub$publisher

    ISBN <- function(pub) pub$ISBN

    ```


    对于在不同类中为相同的概念操作获得不同行为，泛型函数是完美的，但是当我们能够使用普通的旧函数获得期望的操作时，就没有理由调用泛型函数。


    出版物的实现很简单，除了构造函数中设置的`class`属性。在这里，我们将类设置为类名的列表，而不仅仅是类名。这就是我们指定`"book"`对象或`"article"`对象也是一个`"publication"`对象的方式。我们设想的这种设计要求书籍和文章都是出版物，但由于
    S3 类只是表示为字符串的名称，我们无法在 R 中明确这一点。相反，我们通过让`class`属性成为类名的列表来表示类层次结构，从最特殊的对象到最抽象的对象沿层次结构向上。R
    如何解释这样的类名列表，以及它如何使用它来查找泛型函数的正确实现，是下一章的主题。


    拥有类似于我们这里为出版物创建的类层次结构并不少见，但它存在一些轻微的问题。要访问书籍特有的属性，您需要知道您正在处理的对象是一本书；处理聚合的出版物而无需编写专门处理书籍或文章的代码，正是使用面向对象并创建出版物层次结构的目的所在。拥有子类向其超类接口添加函数的类层次结构并没有错，但如果您发现自己在编写这样的层次结构，您应该仔细思考如何访问和操作来自该层次结构的对象。

    '
- fmt: '# 函数放置与通用函数设计


    通常最好将函数在层级中放置在尽可能高的合理位置，以确保层级中的尽可能多的类都支持它们。对于通用函数，不同的子类可以以非常不同的方式实现这些方法，但你操作的所有对象至少会实现你调用的方法。对于我们在这里设计的出版物类层次结构，如果我们想编写可重用的代码，唯一真正能做的就是访问名称和作者以及构建引用图。只有在我们显式检查正在访问的是书籍和文章时，才能以类型安全的方式访问书籍和文章的特有属性。


    我们可能需要代码来格式化出版物以制作出版物列表等。这里我们需要存储在书籍和文章中的信息，但由于直接访问这些信息首先需要测试对象的类别，代码会有些繁琐且可能容易出错。更糟的是，如果我们在层次结构中添加另一种出版物类型（例如，会议贡献），我们需要更新所有执行此类检查并以不同方式处理不同类的代码，以同时处理这种类型。这正是为了避免这种情况，我们需要通用函数，因此正确的设计是拥有一个用于格式化引用的通用函数，并针对子类进行特化。


    ```

    format <- function(publ) UseMethod("format")

    format.article <- function(publ) {

    paste(name(publ), authors(publ),

    journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(name(publ), authors(publ),

    publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    然后，我们可以在另一个通用函数`print`中使用这个`format`函数来显示出版物：


    ```

    print.publication <- function(x, ...) print(format(x))

    ```


    当我们通过子类化来扩展接口时，我们添加了只有一部分对象支持的函数。有时这是必要的，当有些操作确实只对某些对象有意义时——比如修剪决策树，修剪像线性模型这样的东西是没有意义的——但作为一般规则，我建议你将这种特化保持在最低限度。拥有一个由或多或少的特化类组成的大型层次结构可能感觉像是一个好的设计，但当你必须处理来自该层次结构的对象时，你希望它们尽可能相似。你希望能够使用相同的（通用）函数处理所有这些对象，因此，一般来说，你希望在任何情况下都坚持使用最抽象的接口。你不妨在设计代码时就考虑到这一点。


    能够统一处理对象也是我们将图形对象集合本身也设计成一个图形对象的原因。如果我们没有这样做，那么我们需要显式处理对象集合并编写递归函数来遍历它们。通过使集合成为图形对象的一个类，我们可以将这种复杂性隐藏在通用函数中。这是一种非常常见的技巧，被称为组合设计模式。


    # 实现重用


    最容易编写的代码是已经写好的代码。如果你能重用现有代码，这总是比编写新代码更好。你不必花时间编写代码，而且如果现有代码已经存在了一段时间，那么它很可能经过了充分的测试，因此比你引入的新代码更可能正确。因此，作为程序员，你的目标应该是编写尽可能少的新代码，尽管这听起来有些矛盾。


    然而，重用代码的方法不是将现有代码块从程序中的一个地方复制并粘贴到另一个地方。这样你确实重用了代码，但最终你会得到两份相同的代码。如果在未来的某个时间点，你发现必须修改这段代码（也许是因为尽管经过了测试，其中仍然隐藏了一个错误），你将不得不记住在两个地方都进行修改。当你有这样的重复代码时，很难记住，如果这两个副本开始变得不一致，维护起来将是一场噩梦。


    重用代码的方法是编写可以在许多不同上下文中使用的函数。编写处理单个问题的函数，并很好地处理它，同时尽量少地假设它们将被调用的上下文。用小的、可重用的构建块构建程序，使你的代码更易于维护和扩展。


    然而，在面向对象编程中，我们经常为代码重用添加另一个方面。当一个类定义通用函数时，该类及其所有子类的所有实现都必须实现这些通用函数。如果每个类都以独特的方式实现所有通用函数，那么重用的机会就很小，但所有东西都是独特的这种情况很少见。通常，对于给定问题，有很好的默认解决方案适用于大多数类，而只有少数类需要实现特殊函数。在面向对象编程中，你希望在类层次结构中最高的可能级别上实现函数，并让子类在可能的情况下通过调用通用函数而不是提供它们自己特化的函数来重用这些实现。层次结构中的任何类可能都需要特化一个通用函数的子集，而任何子类都应该使用其上层次结构中最特化的函数，但一般来说，它只应在自己的通用函数版本与超类中定义的版本不同时才定义自己的版本。其余的函数它应该直接重用。我们说它从其超类继承了这些函数，并且通用函数的查找机制在很大程度上自动完成了这一点。


    在日常的R编程中很少使用深度类层次结构，与其编造一个人为的例子（对实际代码不现实），也不展示那些大部分代码与类层次结构介绍无关的例子，我将使用抽象的例子。如果你对R中面向对象编程的实际应用更感兴趣，我在第[4](#A451015_1_En_4_Chapter.html)章给出了一个现实的例子，尽管那个例子只有一层深。'
  raw: 'It is generally best to put functions as high up in the hierarchy as it makes
    sense to do, thus ensuring that as many classes from the hierarchy as possible
    will support them. With generic functions, the different subclasses can implement
    the methods very differently, but all objects you manipulate will at least implement
    the methods you call them on. With the publication class hierarchy we have designed
    here, the only things we can really do if we want to write reusable code are to
    access names and authors and construct graphs of citations. The special attributes
    for books and articles are only available in a type-safe way if we explicitly
    check that we are accessing books and articles, respectively.


    We would probably like code to format publications for making publication lists
    and such. Here we would need the information stored in books and articles, but
    since accessing these directly requires that we first test the class of the objects,
    the code would be a bit cumbersome and likely also error-prone. Worse, if we added
    another publication type to the hierarchy (for example, conference contributions),
    we would need to update all code that does this class checking and handles the
    different classes in different ways to handle this type as well. It is exactly
    to avoid this that we need generic functions, so the right design would be to
    have a generic function for formatting citations and specialize it for the sub-classes.


    ```

    format <- function(publ) UseMethod("format")

    format.article <- function(publ) {

    paste(name(publ), authors(publ),

    journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(name(publ), authors(publ),

    publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    We could then use this `format` function in another generic function, `print`,
    for displaying publications:


    ```

    print.publication <- function(x, ...) print(format(x))

    ```


    When we subclass to extend an interface, we add functions that only a subset of
    objects will support. Sometimes this is necessary when there are operations that
    truly only make sense for some objects—like pruning decision trees, where pruning
    something like a linear model is not meaningful—but as a general rule, I would
    suggest that you keep specialization like this to a minimum. It might feel like
    a good design to have a large hierarchy of more or less specialized classes, but
    when you have to work with objects from the hierarchy you want them to be as similar
    as you can get them. You want to be able to treat all of them using the same (generic)
    functions, so, in general, you want to stick to the most abstract interface in
    any case. You might as well design your code with that in mind.


    Being able to treat objects uniformly is also the reason we made a collection
    of graphical objects be a graphical object in itself. If we had not, then we would
    need to explicitly deal with collections of objects and write recursive functions
    to traverse them. By making the collection a class of graphical objects, we could
    hide this complexity in the generic functions. This is a very common trick and
    is called the composite design pattern .


    # 3. Implementation Reuse


    The easiest code to write is the code that is already written. If you can reuse
    existing code, it is always better than writing new code. You don’t have to spend
    time writing the code, and if the existing code has been around for a while there
    is a good chance that it is well tested and thus more likely to be correct than
    the new code you introduce. So your aim as a programmer should be to write as
    little new code as possible, paradoxical as it sounds.


    The way to reuse code, however, is not to copy chunks of existing code from one
    place in your program and paste it into another. You will be reusing the code
    this way, true, but you will end up with two copies of the same code. If you find,
    at some point in the future, that you have to modify this code, perhaps because
    there was a bug hidden in it despite the tests, you will have to remember to change
    it both places. It is hard to remember when you have such duplicated code and
    if the two copies start drifting apart, it is a nightmare trying to maintain it.


    The way to reuse code is to write functions that can be used in many different
    contexts. Write functions to deal with a single problem, and deal with it well,
    while assuming little about the context in which they will be called. Constructing
    a program out of small, reusable building blocks makes your code easier to maintain
    and simpler to extend.


    In object-oriented programming, we often add another aspect to code reuse, however.
    When a class defines generic functions , all implementations of the class and
    its subclasses must implement these generic functions. If each class implements
    all of the generic functions in unique ways, there is little opportunity for reuse,
    but it is rarely the case that everything is unique. Often there are good default
    solutions to a given problem that will work for most classes, while only a few
    classes need to implement special functions. In object-oriented programming, you
    want to implement functions at the highest level in the class hierarchy where
    it is possible and let subclasses reuse these implementations when possible by
    calling general functions instead of providing their own specialized functions.
    Any class in the hierarchy might have to specialize a subset of the generic functions,
    and any subclass of should use the most specialized function in the hierarchy
    above it, but in general it should only define its own version of generic functions
    if they are different from the ones defined in its superclasses. The remaining
    functions it should just reuse. We say that it inherits such functions from its
    superclass and the look-up mechanism for generic functions automates this to a
    high degree.


    Deep class hierarchies are rarely used in day-to-day R programming, and rather
    than making up an artificial example that wouldn’t be realistic for actual code—and
    rather than presenting examples where much of the code would not be relevant for
    the presentation of class hierarchies—I will use abstract examples. If you are
    more interested in realistic use of object-orientated programming in R, I give
    a realistic example in Chapter [4](#A451015_1_En_4_Chapter.html), although one
    that is only a single class deep.'
  trans: '

    # 函数放置与通用函数设计


    通常，最好将函数放置在层级中尽可能高的合理位置，以确保层级中的尽可能多的类都能支持这些函数。对于通用函数，不同的子类可以用非常不同的方式实现这些方法，但你操作的所有对象至少会实现你所调用的方法。以我们这里设计的出版物类层次结构为例，如果我们想编写可重用的代码，唯一真正能做的操作就是访问名称和作者信息，以及构建引用图谱。只有当我们显式检查当前正在访问的是书籍还是文章时，才能以类型安全的方式访问书籍和文章所特有的属性。


    我们可能需要编写代码来格式化出版物，以生成出版物列表等。这需要用到存储在书籍和文章中的信息，但由于直接访问这些信息首先需要测试对象的类别，代码会变得有些繁琐且可能容易出错。更糟糕的是，如果我们在层次结构中添加另一种出版物类型（例如，会议投稿），我们就需要更新所有执行此类检查并针对不同类进行不同处理的代码，以同时处理这种新类型。这正是为了避免这种情况，我们需要通用函数。因此，正确的设计是：拥有一个用于格式化引用的通用函数，并针对不同的子类进行特化实现。


    ```

    format <- function(publ) UseMethod("format")

    format.article <- function(publ) {

    paste(name(publ), authors(publ),

    journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(name(publ), authors(publ),

    publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    然后，我们可以在另一个通用函数 `print` 中使用这个 `format` 函数来显示出版物：


    ```

    print.publication <- function(x, ...) print(format(x))

    ```


    当我们通过子类化来扩展接口时，我们添加了一些只有部分对象支持的函数。有时这是必要的，因为某些操作确实只对特定对象有意义——例如，修剪决策树是有意义的，但修剪像线性模型这样的对象则没有意义——但作为一般规则，我建议将这种特化保持在最低限度。拥有一个由或多或少特化的类组成的大型层次结构可能感觉像是一个好的设计，但当你必须处理来自该层次结构的对象时，你希望它们尽可能相似。你希望能够使用相同的（通用）函数处理所有这些对象。因此，一般来说，你希望在任何情况下都坚持使用最抽象的接口。你不妨在设计代码时就考虑到这一点。


    能够统一处理对象也是为什么我们将图形对象集合本身也设计成一个图形对象的原因。如果我们没有这样做，那么我们就需要显式处理对象集合并编写递归函数来遍历它们。通过使集合成为图形对象的一个类，我们可以将这种复杂性隐藏在通用函数中。这是一种非常常见的技巧，被称为**组合设计模式**。


    # 实现重用


    最容易编写的代码是已经写好的代码。如果你能重用现有代码，这总是比编写新代码更好。你不需要花时间编写代码，而且如果现有代码已经存在了一段时间，那么它很可能经过了充分的测试，因此比你引入的新代码更可能正确。因此，作为程序员，你的目标应该是编写尽可能少的新代码，尽管这听起来有些矛盾。


    然而，重用代码的正确方法，不是简单地将现有代码块从一个程序复制并粘贴到另一个地方。这样做你确实重用了代码，但最终你会得到两份相同的代码。如果在未来的某个时间点，你发现必须修改这段代码（也许是因为尽管经过了测试，其中仍然隐藏了一个错误），你将不得不记住在两个地方都进行修改。当你有这样的重复代码时，很难记住，如果这两个副本开始变得不一致，维护起来将是一场噩梦。


    重用代码的方法是编写可以在许多不同上下文中使用的函数。编写那些能处理单一问题、并处理好它的函数，同时尽量减少对它们将被调用的上下文的假设。使用小的、可重用的构建块来构建程序，这样会使你的代码更易于维护和扩展。


    然而，在面向对象编程中，我们经常为代码重用添加另一个维度。当一个类定义了通用函数时，该类及其所有子类的所有实现都必须实现这些通用函数。如果每个类都以独特的方式实现所有通用函数，那么重用的机会就很小，但所有东西都独特的情况很少见。通常，对于给定问题，存在很好的默认解决方案，适用于大多数类，只有少数类需要实现特殊的函数。在面向对象编程中，你希望在类层次结构中最高的可能级别上实现函数，并让子类在可能的情况下通过调用通用函数，而不是提供它们自己特化的函数，来重用这些实现。层次结构中的任何类都可能需要特化一个通用函数的子集，而任何子类都应该使用其上层结构中最特化的那个版本。但一般来说，一个子类只应在自己的通用函数版本与超类中定义的版本不同时才定义自己的版本，其余的函数它应该直接重用。我们说它从其超类**继承**了这些函数，而通用函数的查找机制在很大程度上自动完成了这一点。


    在日常的 R 编程中，深度类层次结构很少使用。与其编造一个不切实际的人为示例，或者展示那些与类层次结构介绍关系不大的示例代码，我将使用抽象的例子来说明。如果你对
    R 中面向对象编程的实际应用更感兴趣，我在第 4 章给出了一个现实的例子，尽管那个例子只有一层深度。

    '
- fmt: '## 类层次结构中的方法查找


    正如我们之前看到的，对于一个泛型函数`f`，调用`f(x)`会使R寻找一个名称派生自`class(x)`的函数。如果`class(x)`是单个字符串，例如`"A"`，它将寻找`f.A`。如果R找到这样一个函数，它将调用它；如果没有，它将寻找`f.default`并调用它。否则，如果不存在`f.default`，它将放弃并给出错误。这是当对象的类是单个字符串时R的行为。如果它是一系列类名，则R会按顺序遍历此序列，并尝试为序列中的每个类寻找函数。


    考虑下面定义的三个类`A`、`B`和`C`。


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    structure(list(), class = c("B", "A"))

    }

    C <- function() {

    structure(list(), class = c("C", "B", "A"))

    }

    ```


    由于类仅由字符串表示，我们并没有真正地明确定义它们；我们只是有三个函数，用于创建设置了`class`属性的对象。创建对象的函数称为构造函数，对于S3系统来说，这实际上是定义类的唯一方式。


    我们可以创建这些类的实例并检查它们的类。


    ```

    x <- A()

    y <- B()

    z <- C()

    class(x)

    ## [1] "A"

    class(y)

    ## [1] "B" "A"

    class(z)

    ## [1] "C" "B" "A"

    ```


    如果我们定义一个只有默认实现的泛型函数：


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    ```


    在所有三个对象上调用它都只会给出默认行为。


    ```

    f(x)

    ## [1] "f.default"

    f(y)

    ## [1] "f.default"

    f(z)

    ## [1] "f.default"

    ```


    另一方面，如果我们定义一个具有默认实现和针对类`A`的实现泛型函数，则在三个对象上调用它都会导致调用`A`函数。


    ```

    g <- function(x) UseMethod("g")

    g.default <- function(x) print("g.default")

    g.A <- function(x) print("g.A")

    g(x)

    ## [1] "g.A"

    g(y)

    ## [1] "g.A"

    g(z)

    ## [1] "g.A"

    ```


    对于`x`，我们知道为什么会发生这种情况。R寻找`g.A`并找到了它。对于`y`，R寻找`g.B`但没有找到。如果`y`的类只是`"B"`，那么搜索将结束，R将调用`g.default`。但是`y`的类同时包含`"B"`和`"A"`，所以当R找不到`g.B`时，它转而搜索`g.A`，它确实存在，于是调用它。类似地，当我们调用`g(z)`时，R首先搜索`g.C`，没找到，然后搜索`g.B`，也没找到，最后发现`g.A`存在并调用它。所以三次调用都是同一个`g.A`函数。类`B`和`C`从类`A`继承了`g`的实现。


    我们现在可以尝试添加一个针对类`A`和`B`都有实现的泛型函数。


    ```

    h <- function(x) UseMethod("h")

    h.default <- function(x) print("h.default")

    h.A <- function(x) print("h.A")

    h.B <- function(x) print("h.B")

    h(x)

    ## [1] "h.A"

    h(y)

    ## [1] "h.B"

    h(z)

    ## [1] "h.B"

    ```


    在这种情况下，调用`h(x)`会调用`h.A`——自然地，`x`的唯一类是`A`并且`h.A`已实现——而调用`h(y)`和`h(z)`都会调用`h.B`。在这两种情况下，类`B`在类序列中都出现在类`A`之前，并且由于`h.B`存在，它被调用，匹配函数的搜索停止。`h.A`函数存在，但我们在第一次匹配后停止搜索，所以永远不会找到它。


    为了完整性，如果我们添加一个对所有三个类都有实现的函数，每个对象都会调用最特化的函数。


    ```

    i <- function(x) UseMethod("i")

    i.default <- function(x) print("i.default")

    i.A <- function(x) print("i.A")

    i.B <- function(x) print("i.B")

    i.C <- function(x) print("i.C")

    i(x)

    ## [1] "i.A"

    i(y)

    ## [1] "i.B"

    i(z)

    ## [1] "i.C"

    ```


    ## 在构造函数中确保层次结构正确


    当我们在上面创建三个类`A`、`B`和`C`时，我们在每个构造函数中显式地创建了代表类层次结构的类列表。对于我们这里的小型层次结构来说，这没有问题，因为我们将所有三个类定义在一起，并且知道它们应该协同工作。但是，如果代码变得更为复杂，这就引入了一个潜在的出错源。例如，我们可能想在某个时候在`A`和`B`之间插入另一个类。我们可能会记得更新`B`的类列表，但我们还会记得更新`C`的吗？如果`C`在一个不同的文件中，并且我们已经好几年没修改过它了怎么办？


    由于类层次结构完全由这些类列表表示——没有显式的层次结构，只有这些隐式的列表——我们必须格外小心，确保我们的代码始终与我们的设计相匹配。我们应该避免在每个构造函数中显式地表示层次结构。


    确保这一点的一种方法是在定义新类时始终调用直接超类的构造函数。R对类层次结构一无所知，并且在您创建`class`列表之前，它不知道您有哪些超类。因此，没有自动的方法来做到这一点；您必须手动调用超类的构造函数，以这种方式获取一个对象，然后将新的类名前置到其`class`列表中。


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    this <- A()

    class(this) <- c("B", class(this))

    this

    }

    C <- function() {

    this <- B()

    class(this) <- c("C", class(this))

    this

    }

    ```


    使用这种编程习惯还可以避免另一个潜在的出错源。类的构造函数通常会创建一个对象，其属性处于构造函数期望的一致状态。如果您不调用构造函数，而是在子类的构造函数中设置这些属性，您可能会破坏超类所依赖的不变量。在编写子类构造函数时，您可能会小心避免这样做，但超类的实现可能会在未来被更改。当这种情况发生时，子类的实现可能会被破坏。试图调试一个由于代码中完全不同的位置发生更改而出现的错误是件很痛苦的事情。


    通常，更好的做法是始终调用超类的构造函数，然后在返回子类对象之前修改结果对象。'
  raw: '## Method Lookup in Class Hierarchies


    As we saw earlier, for a generic function `f` calling `f(x)` will make R look
    for a function with a name derived from `class(x)`. If `class(x)` is a single
    string, say `"A"`, it will look for `f.A`. If R finds such a function it will
    call it, and if it doesn’t, it will look for `f.default` and call that. Otherwise,
    it will give up and give you an error if there is no `f.default`. This is how
    R behaves if the class of an object is a single string. If it is a sequence of
    class names, it instead goes through this sequence and attempts to find functions
    for each of the classes in the sequence in turn.


    Consider the three classes `A`, `B`, and `C`, defined below.


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    structure(list(), class = c("B", "A"))

    }

    C <- function() {

    structure(list(), class = c("C", "B", "A"))

    }

    ```


    Since classes are just represented by strings, we are not really explicitly defining
    them; we just have three functions that create objects with the class attribute
    set. Functions that create objects are known as constructors and for the S3 system,
    this is really the only way of defining classes.


    We can create instances of these and check their classes.


    ```

    x <- A()

    y <- B()

    z <- C()

    class(x)

    ## [1] "A"

    class(y)

    ## [1] "B" "A"

    class(z)

    ## [1] "C" "B" "A"

    ```


    If we define a generic function that only has a default implementation


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    ```


    calling it on all three objects will just give us the default behavior.


    ```

    f(x)

    ## [1] "f.default"

    f(y)

    ## [1] "f.default"

    f(z)

    ## [1] "f.default"

    ```


    If, on the other hand, we define a generic function that has a default implementation
    and an implementation for the class `A`, calling it on the three objects all results
    in the `A` function being called.


    ```

    g <- function(x) UseMethod("g")

    g.default <- function(x) print("g.default")

    g.A <- function(x) print("g.A")

    g(x)

    ## [1] "g.A"

    g(y)

    ## [1] "g.A"

    g(z)

    ## [1] "g.A"

    ```


    For `x` we know why this happens. R looks for `g.A` and finds it. For `y`, on
    the other hand, R looks for `g.B` and doesn’t find it. If the class of `y` was
    just `"B"` that would be the end of the search and R would call `g.default`. But
    the class of `y` is both `"B"` and `"A"`, so when R doesn’t find `g.B` it instead
    searches for `g.A`, which does exist, and invokes that. Similarly, when we call
    `g(z)`, R first searches for `g.C`, doesn’t find it, and so it then searches for
    `g.B`, which it also doesn’t find. It then finally finds that `g.A` exists and
    it calls that. So all three calls are to the same `g.A` function. Classes `B`
    and `C` inherited the implementation of `g` from class `A`.


    We can now try adding a generic function with implementations for both class `A`
    and `B`.


    ```

    h <- function(x) UseMethod("h")

    h.default <- function(x) print("h.default")

    h.A <- function(x) print("h.A")

    h.B <- function(x) print("h.B")

    h(x)

    ## [1] "h.A"

    h(y)

    ## [1] "h.B"

    h(z)

    ## [1] "h.B"

    ```


    In this case, calling `h(x)` invokes `h.A`—naturally, the only class for `x` is
    `A` and `h.A` is implemented—while calling `h(y)` and `h(z)` both invokes `h.B`.
    In both cases, class `B` is found before class `A` in the class sequence, and
    since `h.B` exists it is invoked, and the search for matching functions stops.
    The `h.A` function exists, but we stop searching after the first match, so we
    never get to it.


    For completeness, if we add a function that has implementations for all the three
    classes, the most specialized function will be called for each.


    ```

    i <- function(x) UseMethod("i")

    i.default <- function(x) print("i.default")

    i.A <- function(x) print("i.A")

    i.B <- function(x) print("i.B")

    i.C <- function(x) print("i.C")

    i(x)

    ## [1] "i.A"

    i(y)

    ## [1] "i.B"

    i(z)

    ## [1] "i.C"

    ```


    ## Getting the Hierarchy Correct in the Constructors


    When we created the three classes `A`, `B`, and `C` above we explicitly created
    the class list representing the class hierarchy in each constructor. This is fine
    for a small hierarchy like the one we have here, where we define all three classes
    close together and know that they are supposed to work together, but it does introduce
    a potential source of errors if the code grows into something more complex. For
    example, we might at some point want to put another class into the hierarchy between
    `A` and `B`. We might remember to update the class list for `B`, but will we also
    remember to update it for `C`? If `C` is in a different file, perhaps, and we
    haven’t modified it in years?


    Since the class hierarchy is entirely represented in these class lists—there is
    no explicit hierarchy, but only these implicit lists—we must be extra careful
    to ensure that our code always matches our design. We should avoid explicitly
    representing the hierarchy in every constructor.


    One way to ensure this is to always invoke the immediate superclass constructor
    when you define a new class. R doesn’t know anything about class hierarchies,
    and it doesn’t know which superclass you have until after you have created the
    `class` list. Consequently, there is no automatic way of doing this; you must
    manually call the constructor of the superclass, obtain an object this way, and
    then prepend the new class name to its `class` list.


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    this <- A()

    class(this) <- c("B", class(this))

    this

    }

    C <- function() {

    this <- B()

    class(this) <- c("C", class(this))

    this

    }

    ```


    Using this programming idiom also saves you from another potential error source.
    The constructor of a class often creates an object with attributes that it expects
    to be in a consistent state in its functions. If you do not call the constructor,
    but set up these attributes in the constructor of a subclass, you might violate
    invariants the superclass depends upon. You will probably be careful not to do
    that when you write the subclass constructor, but the superclass implementation
    could be changed in the future. When that happens, the subclass implementation
    could be broken. It is hell to try to debug an error that shows up because the
    code has changed in an entirely different location in the code.


    You are generally better off if you always call the constructor of the superclass
    and then modify the resulting object before you return the object of the subclass.'
