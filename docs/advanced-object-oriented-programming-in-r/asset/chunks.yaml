  trans: '

    ## 贝叶斯线性回归


    线性回归的最简单形式是用一条直线拟合数据点。假设我们有向量 `x` 和 `y`，我们希望得到系数 `w[1]` 和 `w[2]`，使得 `y[i] = w[1]
    + w[2] x[i] + e[i]`，其中 `e` 是误差向量，我们希望尽可能减小这些误差。当我们将其视为一个统计问题时，通常假设误差是独立同分布的正态分布，因此我们希望误差的方差最小。当使用
    `lm` 函数拟合线性模型时，你会得到权重 `w[1]` 和 `w[2]` 的最大似然值，但如果你想进行贝叶斯统计，你应该将这个权重向量 `w` 视为一个随机变量，并根据数据
    `x` 和 `y` 进行拟合，这意味着将其从先验分布更新到后验分布。


    线性回归权重的一个典型分布是正态分布。如果我们假设权重的先验分布是多元正态分布，那么给定数据后，其后验分布也将是正态分布，这使得数学处理非常方便。


    我们将假设 `w` 的先验分布是一个均值为零、分量独立的正态分布，因此其协方差矩阵是对角阵。这意味着，平均而言，我们认为正在拟合的直线是平坦的且通过平面原点，但我们对此的置信程度取决于协方差矩阵中的值。我们将用一个所谓的超参数
    `a` 来参数化这个过程，它是权重分量的精度——方差的倒数。协方差矩阵的对角线上将是 `1/a`，非对角线元素为零。


    我们可以用多元正态分布的均值和协方差矩阵来表示权重的分布，并根据精度构建先验分布，如下所示：


    ```

    weight_distribution <- function(mu, S) {

    structure(list(mu = mu, S = S), class = "wdist")

    }

    prior_distribution <- function(a) {

    mu = c(0, 0)

    S = diag(1/a, nrow = 2, ncol = 2)

    weight_distribution(mu, S)

    }

    ```


    我们给权重分布分配了一个类，只是为了将它们与普通列表区分开来，但除此之外，这里没有什么特别之处。


    如果我们想从这个分布中抽样，可以使用 `MASS` 包中的 `mvrnorm` 函数。


    ```

    sample_weights <- function(n, distribution) {

    MASS::mvrnorm(n = n,

    mu = distribution$mu,

    Sigma = distribution$S)

    }

    ```


    我们可以尝试从先验分布中抽取一些直线样本并绘制它们。当然，我们可以将样本 `w` 向量作为平面上的点来绘制，但由于它们代表直线，我们将以这种方式显示它们（见图
    4-1）。


    ![A451015_1_En_4_Fig1_HTML.jpg](img/A451015_1_En_4_Fig1_HTML.jpg)

    图 4-1. 直线的先验样本


    ```

    prior <- prior_distribution(1)

    (w <- sample_weights(5, prior))

    ##            [,1]        [,2]

    ## [1,]  0.6029080 -0.84085548

    ## [2,]  0.4721664  1.38435934

    ## [3,]  0.6353713 -1.25549186

    ## [4,]  0.2857736  0.07014277

    ## [5,] -0.1381082  1.71144087

    plot(c(-1, 1), c(-1, 1), type = ''n'',

    xlab = '''', ylab = '''')

    plot_lines <- function(w) {

    for (i in 1:nrow(w)) {

    abline(a = w[i, 1], b = w[i, 2])

    }

    }

    plot_lines(w)

    ```


    ### 用数据更新分布


    当我们观察到匹配的 `X` 和 `y` 值形式的数据时，必须更新 `w` 向量以反映这一点，这意味着更新权重的分布。我不会推导数学公式（毕竟这不是一本数学教科书），但如果
    `mu0` 是先验均值，`S0` 是先验协方差矩阵，则后验均值和协方差矩阵的计算如下：


    ```

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    ```


    你无法直接执行此处的代码——它依赖于我们尚未定义的变量——但这是我们稍后定义函数的主体部分。其中涉及一点关于先验分布和观测值的线性代数。在这些表达式中，我们之前未见过的参数是
    `b` 和 `X`。前者是误差项的精度——我们假设已知并将其表示为这个超参数——后者捕捉了 `x` 值。我们不能单独使用 `x`，因为我们想用两个权重来表示直线。当我们为
    `y[i]` 的估计值写下 `w[1] + w[2] * x[i]` 时，我们可以将其视为 `w` 和 `c(0,x[i])` 的向量积，这正是我们所做的。我们将所有
    `x[i]` 表示为矩阵 `X` 中的行 `c(0,x[i])`。因此，用这种表示法，我们估计 `y[i] = w[1] * X[i, 1] + w[2]
    * X[I, 2]`，或者 `y = X %*% w`。


    作为一个拟合函数，我们可以将其写成这样：


    ```

    fit_posterior <- function(x, y, b, prior) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- matrix(c(rep(1, length(x)), x), ncol = 2)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    我们可以尝试绘制一些点，用这些点拟合模型，然后绘制从后验中抽取的直线样本。现在这些直线应该围绕点分布，而不像从先验中抽取的样本那样。我们用于拟合模型的点越多，从后验中抽取的直线样本围绕点分布的范围就越紧密（见图
    4-2）。


    ![A451015_1_En_4_Fig2_HTML.jpg](img/A451015_1_En_4_Fig2_HTML.jpg)

    图 4-2. 后验直线样本


    ```

    x <- rnorm(20)

    y <- 0.2 + 1.3 * x + rnorm(20)

    plot(x, y)

    posterior <- fit_posterior(x, y, 1, prior)

    w <- sample_weights(5, posterior)

    plot_lines(w)

    ```


    ### 迭代贝叶斯更新


    我们这里将权重分布从先验更新到后验的方式，并不要求先验分布必须是使用变量 `a` 创建的那个确切分布。任何分布都可以用作先验，并且在贝叶斯统计中，随着越来越多的数据加入，不断更新后验分布并不罕见。我们可以从刚刚创建的先验开始，用一些数据拟合它来获得一个后验分布。然后，如果我们获得更多数据，可以将第一个后验分布用作先验来拟合更多数据，并获得一个新的后验分布，该分布捕捉了从看到所有数据中获得的知识。如果我们从一开始就拥有所有数据，这样做没有特别的好处，但在一个数据流式传输的应用中，我们可以利用这一点，在每次新数据可用时快速更新我们的知识。


    由于本书不是关于贝叶斯统计的，并且我们仅将贝叶斯线性回归作为编写新统计模型的一个例子，我们将不在此进一步探讨。

    '
- fmt: "## Model Matrices\n\nThe `X` matrix we used when fitting the posterior is\
    \ an example of a so-called model matrix or design matrix. Using a matrix this\
    \ way, fitting a response variable, `y`, to some expression, here `1 + x` (in\
    \ a sense, we used the rows `c(1, x[i])`), is a general approach to fitting data.\
    \ Linear models are called linear not because we fit data with a line, but because\
    \ the weights, the `w` vector we fit, are used linearly, in the mathematical sense,\
    \ in the fitted model. If we have fitted the weights to the vector `w`, the line\
    \ we have fitted is given by `X %*% w`. That is, our line is the matrix product\
    \ of the model matrix and the weight vector. The result is a line because `X`\
    \ has the form we gave it, but it doesn’t have to represent a line for the model\
    \ to be a linear model. We can transform the input data (here our vector `x`)\
    \ in any way we want to before we fit the model. You might have used log-transformations\
    \ before, or fitted data to a polynomial, and those would also be examples of\
    \ linear models.\n\nYou can fit various kinds of transformed data using the function\
    \ we wrote above if you just construct the `X` matrix in different ways. As long\
    \ as each data point you have becomes a row in `X`, it doesn’t matter what you\
    \ do. The same mathematics work. To fit a quadratic equation to the data instead\
    \ of a line, you just have to make the ith row of `X` be `c(1, x[i], x[i]**2)`,\
    \ for example.\n\nIn R, you have a very powerful mechanism for constructing model\
    \ matrices from formulae. Whenever you have used a formula such as `y ~ x + z`\
    \ to fit `y` to two variables, `x` and `z`, you have used this feature. The formula\
    \ is translated into a model matrix, and once you have the matrix, the code that\
    \ does the model fitting doesn’t need to know anything else about your data.\n\
    \nThe function you use to translate a formula into a model matrix is called `model.matrix`.\
    \ Even though it has a period in its name, it isn’t a generic function. It just\
    \ has an unfortunate name for historical reasons.\n\nThe function will take a\
    \ formula as input and produce a model matrix. It will find the values for the\
    \ variables in the formula by looking in its scope, and we can use it like this:\n\
    \n```\nx <- rnorm(5)\ny <- 1.2 + 2 * x + rnorm(5)\nmodel.matrix(y ~ x)\n```\n\n\
    Relying on global variables like this is risky coding, though, so we often put\
    \ our data in a data frame instead.\n\n```\nd <- data.frame(x, y)\n```\n\nIf we\
    \ do this, we can provide a data frame to the `model.matrix` function and it will\
    \ get the variables from there.\n\n```\nmodel.matrix(y ~ x, data = d)\n```\n\n\
    If the formula uses variables that are not found in the data frame, the `model.matrix`\
    \ will still find the missing variables in the calling scope, but this is really\
    \ risky coding, so you should avoid this.\n\nThe formula determines how the model\
    \ matrix is constructed. The formula `y ~ x` gives us the model matrix we used\
    \ above, where we have 1 to capture the intercept in the first column, and we\
    \ have the `x` values in the second column to capture the incline of the line.\
    \ We can remove the intercept using the formula `y ~ x - 1`:\n\n```\nmodel.matrix(y\
    \ ~ x - 1, data = d)\n```\n\nWe can also add terms; for example, we can fit a\
    \ quadratic formula to the data by constructing this model matrix:\n\n```\nmodel.matrix(y\
    \ ~ x + I(x**2), data = d)\n```\n\nHere, we need to wrap the squared `x` in the\
    \ function `I` to get R to use the actually squared values of `x`. Inside formulae,\
    \ products are interpreted as interaction, but by wrapping `x**2` in `I`, we make\
    \ it the square of the `x` values explicitly.\n\nThe model matrix doesn’t include\
    \ the response variable, `y`, so we cannot get that from it. Instead, we can use\
    \ a related function, `model.frame`, that also gives us a column for the response.\n\
    \n```\nmodel.frame(y ~ x + I(x**2), data = d)\n```\n\nYou can then extract the\
    \ response variable using the function `model.response`, like this:\n\n```\nmodel.response(model.frame(y\
    \ ~ x + I(x**2), data = d))\n```\n\nWith that machinery in place, we can generalize\
    \ our distributions and model fitting to work with general formulae. We can write\
    \ the prior function like this:\n\n```\nprior_distribution <- function(formula,\
    \ a, data) {\n  n <- ncol(model.matrix(formula, data = data))\n  mu <- rep(0,\
    \ n)\n  S <- diag(1/a, nrow = n, ncol = n)\n  weight_distribution(mu, S)\n}\n\
    ```\n\nIdeally, a prior shouldn’t depend on any data, but the form of a model\
    \ matrix does depend on the type of the data we use. Numerical data will be represented\
    \ as a single column in the model matrix, but factors are handled as a binary\
    \ vector for each level in a formula, so we do need to know what kind of data\
    \ we are going to need. We could have added `n` as a parameter here and made the\
    \ function independent of any data, but I chose to include a data frame as another\
    \ solution. We don’t use the actual data, though; we just use it to get the number\
    \ of columns in the model frame.\n\nThe function for fitting the data changes\
    \ less, though. It just uses the `model.matrix` function to construct the model\
    \ matrix instead of the explicit construction we did earlier.\n\n```\nfit_posterior\
    \ <- function(formula, b, prior, data) {\n  mu0 <- prior$mu\n  S0 <- prior$S\n\
    \  X <- model.matrix(formula, data = data)\n  S <- solve(S0 + b * t(X) %*% X)\n\
    \  mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)\n  weight_distribution(mu\
    \ = mu, S = S)\n}\n```\n\nWith that in place, we can fit a line as before, but\
    \ now using a formula.\n\n```\nd <- {\n  x <- rnorm(5)\n  y <- 1.2 + 2 * x + rnorm(5)\n\
    \  data.frame(x = x, y = y)\n}\nprior <- prior_distribution(y ~ x, 1, d)\nposterior\
    \ <- fit_posterior(y ~ x, 1, prior, d)\nposterior\n```\n\nIf we, instead, want\
    \ to fit a quadratic function, we do not need to change any of the functions,\
    \ we can just provide a different formula.\n\n```\nprior <- prior_distribution(y\
    \ ~ x + I(x**2), 1, d)\nposterior <- fit_posterior(y ~ x + I(x**2), 1, prior,\
    \ d)\nposterior\n```"
  raw: '## Model Matrices


    The `X` matrix we used when fitting the posterior is an example of a so-called
    model matrix or design matrix. Using a matrix this way, fitting a response variable,
    `y`, to some expression, here `1 + x` (in a sense, we used the rows `c(1, x[i])`),
    is a general approach to fitting data. Linear models are called linear not because
    we fit data with a line, but because the weights, the `w` vector we fit, are used
    linearly, in the mathematical sense, in the fitted model. If we have fitted the
    weights to the vector `w`, the line we have fitted is given by `X %*% w`. That
    is, our line is the matrix product of the model matrix and the weight vector.
    The result is a line because `X` has the form we gave it, but it doesn’t have
    to represent a line for the model to be a linear model. We can transform the input
    data (here our vector `x`) in any way we want to before we fit the model. You
    might have used log-transformations before, or fitted data to a polynomial , and
    those would also be examples of linear models.


    You can fit various kinds of transformed data using the function we wrote above
    if you just construct the `X` matrix in different ways. As long as each data point
    you have becomes a row in `X`, it doesn’t matter what you do. The same mathematics
    work. To fit a quadratic equation to the data instead of a line, you just have
    to make the ith row of `X` be `c(1, x[i], x[i]**2)`, for example.


    In R, you have a very powerful mechanism for constructing model matrices from
    formulae. Whenever you have used a formula such as `y ∼ x + y` to fit `y` to two
    variables, `x` and `z`, you have used this feature. The formula is translated
    into a model matrix, and once you have the matrix, the code that does the model
    fitting doesn’t need to know anything else about your data.


    The function you use to translate a formula into a model matrix is called `model.matrix`.
    Even though it has a period in its name, it isn’t a generic function. It just
    has an unfortunate name for historical reasons.


    The function will take a formula as input and produce a model matrix. It will
    find the values for the variables in the formula by looking in its scope, and
    we can use it like this:


    ```

    x <- rnorm(5)

    y <- 1.2 + 2 * x + rnorm(5)

    model.matrix(y ∼ x)

    ##   (Intercept)          x

    ## 1           1 -1.1365828

    ## 2           1  0.8548304

    ## 3           1 -0.5783704

    ## 4           1  0.4963615

    ## 5           1 -0.7600579

    ## attr(,"assign")

    ## [1] 0 1

    ```


    Relying on global variables like this is risky coding, though, so we often put
    our data in a data frame instead.


    ```

    d <- data.frame(x, y)

    ```


    If we do this, we can provide a data frame to the `model.matrix` function and
    it will get the variables from there.


    ```

    model.matrix(y ∼ x, data = d)

    ##   (Intercept)          x

    ## 1           1 -1.1365828

    ## 2           1  0.8548304

    ## 3           1 -0.5783704

    ## 4           1  0.4963615

    ## 5           1 -0.7600579

    ## attr(,"assign")

    ## [1] 0 1

    ```


    If the formula uses variables that are not found in the data frame, the `model.matrix`
    will still find the missing variables in the calling scope, but this is really
    risky coding, so you should avoid this.


    The formula determines how the model matrix is constructed. The formula `y ∼ x`
    gives us the model matrix we used above, where we have 1 to capture the intercept
    in the first column, and we have the `x` values in the second column to capture
    the incline of the line. We can remove the intercept using the formula `y ∼ x
    - 1`:


    ```

    model.matrix(y ∼ x - 1, data = d)

    ##            x

    ## 1 -1.1365828

    ## 2  0.8548304

    ## 3 -0.5783704

    ## 4  0.4963615

    ## 5 -0.7600579

    ## attr(,"assign")

    ## [1] 1

    ```


    We can also add terms; for example, we can fit a quadratic formula to the data
    by constructing this model matrix:


    ```

    model.matrix(y ∼ x + I(x**2), data = d)

    ##   (Intercept)          x    I(x^2)

    ## 1           1 -1.1365828 1.2918205

    ## 2           1  0.8548304 0.7307351

    ## 3           1 -0.5783704 0.3345123

    ## 4           1  0.4963615 0.2463748

    ## 5           1 -0.7600579 0.5776881

    ## attr(,"assign")

    ## [1] 0 1 2

    ```


    Here, we need to wrap the squared `x` in the function `I` to get R to use the
    actually squared values of `x`. Inside formulae, products are interpreted as interaction,
    but by wrapping `x**2` in `I`, we make it the square of the `x` values explicitly.


    The model matrix doesn’t include the response variable, `y`, so we cannot get
    that from it. Instead, we can use a related function, `model.frame`, that also
    gives us a column for the response.


    ```

    model.frame(y ∼ x + I(x**2), data = d)

    ##            y          x       I(x^2)

    ## 1 -1.4145519 -1.1365828 1.291820....

    ## 2  0.8073317  0.8548304 0.730735....

    ## 3 -0.2584431 -0.5783704 0.334512....

    ## 4  0.9203396  0.4963615 0.246374....

    ## 5 -0.5997820 -0.7600579 0.577688....

    ```


    You can then extract the response variable using the function `model.response`,
    like this:


    ```

    model.response(model.frame(y ∼ x + I(x**2), data = d))

    ##          1          2          3          4

    ## -1.4145519  0.8073317 -0.2584431  0.9203396

    ##          5

    ## -0.5997820

    ```


    With that machinery in place, we can generalize our distributions and model fitting
    to work with general formulae. We can write the prior function like this:


    ```

    prior_distribution <- function(formula, a, data) {

    n <- ncol(model.matrix(formula, data = data))

    mu <- rep(0, n)

    S <- diag(1/a, nrow = n, ncol = n)

    weight_distribution(mu, S)

    }

    ```


    Ideally, a prior shouldn’t depend on any data, but the form of a model matrix
    does depend on the type of the data we use. Numerical data will be represented
    as a single column in the model matrix, but factors are handled as a binary vector
    for each level in a formula, so we do need to know what kind of data we are going
    to need. We could have added `n` as a parameter here and made the function independent
    of any data, but I chose to include a data frame as another solution. We don’t
    use the actual data, though; we just use it to get the number of columns in the
    model frame.


    The function for fitting the data changes less, though. It just uses the `model.matrix`
    function to construct the model matrix instead of the explicit construction we
    did earlier.


    ```

    fit_posterior <- function(formula, b, prior, data) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- model.matrix(formula, data = data)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    With that in place, we can fit a line as before, but now using a formula.


    ```

    d <- {

    x <- rnorm(5)

    y <- 1.2 + 2 * x + rnorm(5)

    data.frame(x = x, y = y)

    }

    prior <- prior_distribution(y ∼ x, 1, d)

    posterior <- fit_posterior(y ∼ x, 1, prior, d)

    posterior

    ## $mu

    ##                  [,1]

    ## (Intercept) 1.1979166

    ## x           0.2875647

    ##

    ## $S

    ##             (Intercept)           x

    ## (Intercept)  0.16935519 -0.04441203

    ## x           -0.04441203  0.73364645

    ##

    ## attr(,"class")

    ## [1] "wdist"

    ```


    If we, instead, want to fit a quadratic function , we do not need to change any
    of the functions, we can just provide a different formula.


    ```

    prior <- prior_distribution(y ∼ x + I(x**2), 1, d)

    posterior <- fit_posterior(y ∼ x + I(x**2), 1, prior, d)

    posterior

    ## $mu

    ##                  [,1]

    ## (Intercept) 1.1906733

    ## x           0.2815418

    ## I(x^2)      0.1185518

    ##

    ## $S

    ##             (Intercept)           x      I(x^2)

    ## (Intercept)  0.17301554 -0.04136841 -0.05990922

    ## x           -0.04136841  0.73617725 -0.04981521

    ## I(x^2)      -0.05990922 -0.04981521  0.98053972

    ##

    ## attr(,"class")

    ## [1] "wdist"

    ```'
  trans: "\n## 模型矩阵\n\n我们拟合后验分布时使用的 `X` 矩阵，就是所谓的**模型矩阵**或**设计矩阵**的一个例子。以这种方式使用矩阵，将响应变量\
    \ `y` 拟合到某个表达式（此处是 `1 + x`，从某种意义上说，我们使用了行 `c(1, x[i])`），是一种通用的数据拟合方法。线性模型之所以被称为“线性”，并不是因为我们用一条线来拟合数据，而是因为在我们拟合的模型中，权重（即我们拟合的\
    \ `w` 向量）在数学意义上是线性使用的。如果我们已将权重拟合到向量 `w`，那么我们拟合的直线由 `X %*% w` 给出。也就是说，我们的直线是模型矩阵和权重向量的矩阵乘积。结果是一条直线，是因为\
    \ `X` 具有我们赋予它的形式，但模型要成为线性模型，它不一定非得代表一条直线。我们可以在拟合模型之前，以任何方式转换输入数据（此处是我们的向量 `x`）。你可能之前使用过对数变换，或将数据拟合到多项式，这些也都是线性模型的例子。\n\
    \n只要以不同方式构造 `X` 矩阵，你就可以使用我们上面编写的函数来拟合各种经过转换的数据。只要你拥有的每个数据点都成为 `X` 中的一行，无论你做什么都可以。数学原理是相同的。例如，要将数据拟合为二次方程而非直线，你只需让\
    \ `X` 的第 i 行为 `c(1, x[i], x[i]**2)` 即可。\n\n在 R 中，你有一个非常强大的机制，可以从公式构造模型矩阵。每当你使用诸如\
    \ `y ~ x + z` 这样的公式将 `y` 拟合到两个变量 `x` 和 `z` 时，你就在使用这个特性。该公式会被翻译成一个模型矩阵，一旦你有了这个矩阵，执行模型拟合的代码就无需了解关于你数据的任何其他信息。\n\
    \n用于将公式转换为模型矩阵的函数称为 `model.matrix`。尽管其名称中有一个句点，但它并非泛型函数。这只是一个由于历史原因而不太理想的命名。\n\
    \n该函数将接受一个公式作为输入并生成一个模型矩阵。它会通过在其作用域内查找来获取公式中变量的值，我们可以像这样使用它：\n\n```\nx <- rnorm(5)\n\
    y <- 1.2 + 2 * x + rnorm(5)\nmodel.matrix(y ~ x)\n```\n\n然而，依赖这样的全局变量是风险较高的编码方式，因此我们通常将数据放入数据框中。\n\
    \n```\nd <- data.frame(x, y)\n```\n\n如果我们这样做，就可以向 `model.matrix` 函数提供一个数据框，它会从那里获取变量。\n\
    \n```\nmodel.matrix(y ~ x, data = d)\n```\n\n如果公式使用的变量在数据框中找不到，`model.matrix`\
    \ 仍会在调用作用域中查找缺失的变量，但这确实是风险很高的编码方式，因此你应该避免这种情况。\n\n公式决定了模型矩阵的构造方式。公式 `y ~ x` 给出了我们上面使用的模型矩阵，其中第一列有\
    \ 1 用于捕获截距，第二列有 `x` 值用于捕获直线的斜率。我们可以使用公式 `y ~ x - 1` 来移除截距：\n\n```\nmodel.matrix(y\
    \ ~ x - 1, data = d)\n```\n\n我们也可以添加项；例如，我们可以通过构造以下模型矩阵将数据拟合到二次公式：\n\n```\nmodel.matrix(y\
    \ ~ x + I(x**2), data = d)\n```\n\n这里，我们需要将平方后的 `x` 包装在函数 `I` 中，以便让 R 使用 `x` 的实际平方值。在公式内部，乘积被解释为交互作用，但通过将\
    \ `x**2` 包装在 `I` 中，我们明确地使其成为 `x` 值的平方。\n\n模型矩阵不包含响应变量 `y`，所以我们无法从中获取它。相反，我们可以使用一个相关的函数\
    \ `model.frame`，它也会为我们提供响应变量的列。\n\n```\nmodel.frame(y ~ x + I(x**2), data = d)\n\
    ```\n\n然后，你可以使用函数 `model.response` 提取响应变量，像这样：\n\n```\nmodel.response(model.frame(y\
    \ ~ x + I(x**2), data = d))\n```\n\n有了这套机制，我们可以将分布和模型拟合推广到适用于通用公式。我们可以像这样编写先验函数：\n\
    \n```\nprior_distribution <- function(formula, a, data) {\n  n <- ncol(model.matrix(formula,\
    \ data = data))\n  mu <- rep(0, n)\n  S <- diag(1/a, nrow = n, ncol = n)\n  weight_distribution(mu,\
    \ S)\n}\n```\n\n理想情况下，先验不应依赖于任何数据，但模型矩阵的形式确实取决于我们使用的数据类型。数值数据在模型矩阵中表示为单列，但因子在公式中会作为每个水平的二进制向量来处理，因此我们确实需要知道我们将需要什么类型的数据。我们本可以在这里将\
    \ `n` 作为参数添加，并使函数独立于任何数据，但我选择了包含一个数据框作为另一种解决方案。不过，我们并不使用实际数据；我们只是用它来获取模型框架的列数。\n\
    \n然而，拟合数据的函数变化较小。它只是使用 `model.matrix` 函数来构造模型矩阵，而不是像我们之前那样显式构造。\n\n```\nfit_posterior\
    \ <- function(formula, b, prior, data) {\n  mu0 <- prior$mu\n  S0 <- prior$S\n\
    \  X <- model.matrix(formula, data = data)\n  S <- solve(S0 + b * t(X) %*% X)\n\
    \  mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)\n  weight_distribution(mu\
    \ = mu, S = S)\n}\n```\n\n准备好这些之后，我们可以像以前一样拟合直线，但现在使用公式。\n\n```\nd <- {\n  x <-\
    \ rnorm(5)\n  y <- 1.2 + 2 * x + rnorm(5)\n  data.frame(x = x, y = y)\n}\nprior\
    \ <- prior_distribution(y ~ x, 1, d)\nposterior <- fit_posterior(y ~ x, 1, prior,\
    \ d)\nposterior\n```\n\n如果我们想拟合二次函数，则无需更改任何函数，只需提供不同的公式即可。\n\n```\nprior <- prior_distribution(y\
    \ ~ x + I(x**2), 1, d)\nposterior <- fit_posterior(y ~ x + I(x**2), 1, prior,\
    \ d)\nposterior\n```\n"
- fmt: '# Constructing Fitted Model Objects


    Now, we want to wrap fitted models in a class so we can write a constructor for
    them. For fitted models, it is traditional to include the formula, the data, and
    the function call together with the fitted model, so we will put those as attributes
    in the objects. The constructor could look like this:


    ```

    blm <- function(formula, b, data, prior = NULL, a = NULL) {

    if (is.null(prior)) {

    if (is.null(a)) stop("Without a prior you must provide a.")

    prior <- prior_distribution(formula, a, data)

    } else {

    if (inherits(prior, "blm")) {

    prior <- prior$prior

    }

    }

    if (!inherits(prior, "wdist")) {

    stop("The provided prior does not have the expected type.")

    }

    posterior <- fit_posterior(formula, b, prior, data)

    structure(

    list(formula = formula,

    data = model.frame(formula, data),

    dist = posterior,

    call = match.call()),

    class = "blm"

    )

    }

    ```


    The tests at the beginning of the constructor allow us to specify the prior as
    either a normal distribution or a previously fitted `blm` object. If we get a
    prior distribution, we probably should also check that this prior is compatible
    with the actual formula, but I will let you write such a check yourself to try
    that out.


    If we print objects fitted using the `blm` function, they will just be printed
    as a list, but we can provide our own `print` function by specializing the `print`
    generic function. Here, it is tradition to provide the function call used to specify
    the model, so that is all I will do for now.


    ```

    print.blm <- function(x, ...) {

    print(x$call)

    }

    ```


    We have to match the parameters of the generic function, which is why the arguments
    are `x` and…. All we do, however, is print the `call` attribute of the object.


    Now, we can fit data and get a `blm` object like this:


    ```

    (model <- blm(y ∼ x + I(x**2), a = 1, b = 1, data = d))

    ## blm(formula = y ∼ x + I(x^2), b = 1, data = d, a = 1)

    ```


    ## Coefficients and Confidence Intervals


    Once we have a fitted model, we might want to get the fitted values. This is traditionally
    done using the generic function `coef`, which should simply return those. For
    the Bayesian linear regression model, the fitted values are whole distributions,
    but we can take the mean values as point estimates and return those, and so implement
    the `coef` function like this:


    ```

    coef.blm <- function(object, ...) {

