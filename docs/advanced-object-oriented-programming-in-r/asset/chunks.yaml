    ## [1] "h.B"

    ```


    在这种情况下，调用`h(x)`会调用`h.A`——自然地，`x`的唯一类是`A`并且`h.A`已实现——而调用`h(y)`和`h(z)`都会调用`h.B`。在这两种情况下，类`B`在类序列中都出现在类`A`之前，并且由于`h.B`存在，它被调用，匹配函数的搜索停止。`h.A`函数存在，但我们在第一次匹配后停止搜索，所以永远不会找到它。


    为了完整性，如果我们添加一个对所有三个类都有实现的函数，每个对象都会调用最特化的函数。


    ```

    i <- function(x) UseMethod("i")

    i.default <- function(x) print("i.default")

    i.A <- function(x) print("i.A")

    i.B <- function(x) print("i.B")

    i.C <- function(x) print("i.C")

    i(x)

    ## [1] "i.A"

    i(y)

    ## [1] "i.B"

    i(z)

    ## [1] "i.C"

    ```


    ## 在构造函数中确保层次结构正确


    当我们在上面创建三个类`A`、`B`和`C`时，我们在每个构造函数中显式地创建了代表类层次结构的类列表。对于我们这里的小型层次结构来说，这没有问题，因为我们将所有三个类定义在一起，并且知道它们应该协同工作。但是，如果代码变得更为复杂，这就引入了一个潜在的出错源。例如，我们可能想在某个时候在`A`和`B`之间插入另一个类。我们可能会记得更新`B`的类列表，但我们还会记得更新`C`的吗？如果`C`在一个不同的文件中，并且我们已经好几年没修改过它了怎么办？


    由于类层次结构完全由这些类列表表示——没有显式的层次结构，只有这些隐式的列表——我们必须格外小心，确保我们的代码始终与我们的设计相匹配。我们应该避免在每个构造函数中显式地表示层次结构。


    确保这一点的一种方法是在定义新类时始终调用直接超类的构造函数。R 对类层次结构一无所知，并且在您创建`class`列表之前，它不知道您有哪些超类。因此，没有自动的方法来做到这一点；您必须手动调用超类的构造函数，以这种方式获取一个对象，然后将新的类名前置到其`class`列表中。


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    this <- A()

    class(this) <- c("B", class(this))

    this

    }

    C <- function() {

    this <- B()

    class(this) <- c("C", class(this))

    this

    }

    ```


    使用这种编程习惯还可以避免另一个潜在的出错源。类的构造函数通常会创建一个对象，其属性处于构造函数期望的一致状态。如果您不调用构造函数，而是在子类的构造函数中设置这些属性，您可能会破坏超类所依赖的不变量。在编写子类构造函数时，您可能会小心避免这样做，但超类的实现可能会在未来被更改。当这种情况发生时，子类的实现可能会被破坏。试图调试一个由于代码中完全不同的位置发生更改而出现的错误是件很痛苦的事情。


    通常，更好的做法是始终调用超类的构造函数，然后在返回子类对象之前修改结果对象。

    '
- fmt: '# `NextMethod`


    When we specialize generic functions, we do not always need to implement everything
    from scratch either. Sometimes we can reuse implementations from more abstract
    classes; we just need to tweak the results of them a little. We can always call
    the function of a superclass explicitly using the full name of the function, but
    this will only work if the class actually implements its own version. It will
    not work if it just inherits it, and you have to be careful every time you modify
    the class hierarchy that you are not breaking assumptions underlying such direct
    calls.


    A better solution is to use the `NextMethod` function. This function lets you
    call inherited functions in a way that resembles `UseMethod`, and that uses the
    `class` sequence. The `NextMethod` function is magical in a similar way to `UseMethod`.
    It knows which generic function you are implementing—although, as with `UseMethod`
    you can override this—and it will search through the `class` sequence of the first
    object of your function. Again, you can override this, but it is such a common
    idiom that you probably shouldn''t. Unlike `UseMethod`, though, it doesn''t terminate
    the function you call it from, and you can use the value it returns.


    As an example, we can consider the bibliography objects we discussed at the end
    of the previous chapter. Here we had the superclass `"publication"` and the two
    subclasses `"article"` and `"book"`, and we had a generic method, `format`, for
    formatting citations. We can write a `format` function for the publication class
    that formats the name and the authors'' list, and in the specializations of the
    method, we can call `NextMethod` to obtain this string and extend it with information
    available in the sub-classes.


    ```

    format.publication <- function(publ) {

    paste(name(publ), authors(publ), sep = ", ")

    }

    format.article <- function(publ) {

    paste(NextMethod(), journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(NextMethod(), publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    When we call `NextMethod`, R will search through the `class` sequence—starting
    where it left off last time it did the search—for a class that implements the
    generic function we are currently evaluating.


    We can use the `A`, `B`, and `C` classes to see this in action. If we define functions
    that all call `NextMethod` and evaluate it for objects of each of the three classes,
    we will see that the `A` object, `x`, will evaluate the `A` method and the default
    function; the `B` object, `y` will evaluate the `B` function and then continue
    with the `A` function before the default version; and the `C` object, `z`, will
    evaluate all the functions.


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    f.A <- function(x) {

    print("f.A")

    NextMethod()

    }

    f.B <- function(x) {

    print("f.B")

    NextMethod()

    }

    f.C <- function(x) {

    print("f.C")

    NextMethod()

    }

    f(x)

    ## [1] "f.A"

    ## [1] "f.default"

    f(y)

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    ```


    If we implement another function, where we only implement version for classes
    `A` and `C` but not for `B`, we will see the `C` objects evaluating the `C` version
    and then the `A` version; since there is no `B` version, the search when we call
    `NextMethod` will not find it and will thus continue to the `A` version.


    ```

    j <- function(x) UseMethod("j")

    j.default <- function(x) print("j.default")

    j.A <- function(x) {

    print("j.A")

    NextMethod()

    }

    j.C <- function(x) {

    print("j.C")

    NextMethod()

    }

    j(x)

    ## [1] "j.A"

    ## [1] "j.default"

    j(y)

    ## [1] "j.A"

    ## [1] "j.default"

    j(z)

    ## [1] "j.C"

    ## [1] "j.A"

    ## [1] "j.default"

    ```


    All the method dispatching—the technical term for this looking up of implementations
    of generic functions—is entirely based on the list of classes in the `class` attribute.
    Class hierarchies are not explicitly represented and it is your own responsibility
    that the `class` lists reflect the design of class hierarchies you have in mind.
    If we reverse the order of the `class` list, R is just as happy to work with this.


    ```

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    class(z) <- rev(class(z))

    f(z)

    ## [1] "f.A"

    ## [1] "f.B"

    ## [1] "f.C"

    ## [1] "f.default"

    ```


    If we reverse the order of the classes, the search for the first function in `UseMethod`
    just starts at the most abstract class and works its way down the list until it
    finds an implementation. In this case, it finds it right away, and the calls to
    `NextMethod` just continue searching from where `UseMethod` or previous `NextMethod`
    calls ended, exactly like before. The default function is always last here because
    once you get through the list, the default is invoked. If the `A` class is an
    abstract class that `C` specializes, this will, of course, give you incorrect
    behavior. You would invoke the abstract and not the specialized function. But
    the mechanism for resolving generic functions into concrete classes does not know
    about class hierarchies, so it will just search through the list.


    This also means that you can write different classes that consider the hierarchy
    of other classes to be completely different. If one `class` list is `c("A", "B",
    "C")` and another is `c("B", "C", "A")`, the first considers `C` the most abstract
    and `A` the most derived class, while the second considers `A` the most abstract
    and `B` the most derived. The mechanism for how R finds the function to call is
    simple enough, but if you begin writing code where your class hierarchy depends
    on which object you are looking at, you are on the road to madness.


    ## 4. Statistical Models


    Truth be told, you won’t be using object-oriented programming in most day-to-day
    R programming. Most analyses you do in R involve the transformation of data, typically
    implemented as some sort of data flow, which is best captured by functional programming.
    When you write such pipelines, you will probably be using polymorphic functions,
    but you rarely need to create your own classes. If you need to implement a new
    statistical model, however, you usually do want to create a new class.


    A lot of data analysis requires that you infer parameters of interest or you build
    a model to predict properties of your data, but in many of those cases, you don’t
    necessarily need to know exactly how we constructed the model, how it infers parameters,
    or how it predicts new values. You can use the `coefficients` function to get
    inferred parameters from a fitted model, or you can use the `predict` function
    to predict new values, and you can use those two functions with almost any statistical
    model. That is because most models are implemented as classes with implementations
    for the generic functions `coefficients` and `predict`.


    As an example of object-oriented programming in action, we can implement our own
    model in this chapter. We will keep it simple, so we can focus on the programming
    aspects and not the statistical theory, but still implement something that isn’t
    already built into R. We will implement a version of Bayesian linear regression.'
