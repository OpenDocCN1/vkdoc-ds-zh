- fmt: "# Designing Interfaces\n\nIt’s not just generic functions that are polymorphic.\
    \ Any function that manipulates data only through generic functions is also polymorphic.\
    \ The reversal function we implemented using a stack takes the empty stack as\
    \ an argument, and this empty stack determines which actual stack implementation\
    \ we use. Nowhere in the function do we refer to any details of a real implementation.\
    \ If we had, instead, created an empty stack inside this function then, despite\
    \ otherwise only accessing the implementation through the interface of the generic\
    \ functions, the function would be bound to a single implementation.\n\nTo get\
    \ the most out of polymorphism, you will want to design your functions to be as\
    \ polymorphic as possible. This requires two things:\n\n1. Don’t refer to concrete\
    \ implementations unless you really have to.  \n2. Any time you do have to refer\
    \ to implementation details of a concrete type, do so through a generic function.\n\
    \nThe reversal function is polymorphic because it doesn’t refer to any concrete\
    \ implementation. The choice of which concrete stack to use is determined by a\
    \ parameter, and the operations it performs on the specific stack implementation\
    \ all go through generic functions.\n\nIt can be very tempting to break these\
    \ rules in the heat of programming. Using a parameter to determine data structures\
    \ in an algorithm isn’t that difficult to do, but if you are writing an algorithm\
    \ that uses several different data structures, you might not want to have all\
    \ the different concrete implementations as parameters. You really ought to do\
    \ it, though. Just write a function that wraps the algorithm and provides implementations\
    \ if you don’t want to remember all the concrete data structures where the algorithm\
    \ is needed. That way you get the best of both worlds.\n\nMore often, you will\
    \ want to access the details of a concrete implementation. Imagine, for example,\
    \ that you want to pop elements until you see a specific one, but only if that\
    \ element is on the stack. If we are used to working with the vector implementation\
    \ of the stack, then it would be natural to write a function like this:\n\n```\n\
    pop_until %\npush(1) %>%\npush(2) %>%\npush(3) %T>% print\n## [1] 3 2 1\n## attr(,\"\
    class\")\n## [1] \"vector_stack\"\npop_until(vector_stack, 1)\n## [1] 1\n## attr(,\"\
    class\")\n## [1] \"vector_stack\"\npop_until(vector_stack, 5)\n## [1] 3 2 1\n\
    ## attr(,\"class\")\n## [1] \"vector_stack\"\n```\n\nHere we use the `%in%` function\
    \ to test if the element is on the stack (and we use the `magrittr` pipe operator\
    \ to create a stack for our test). This works fine, as long as the stack is a\
    \ vector stack, but it will not work if the stack is implemented as a list. You\
    \ won’t get an error message; the `%in%` test will just always return `FALSE`,\
    \ so if you replace the stack implementation you have incorrect code that doesn’t\
    \ even inform you that it isn’t working.\n\nRelying on implementation details\
    \ is the worst thing you can do to break the interface of polymorphic objects.\
    \ Not only do you tie yourself to a single implementation, but you also tie yourself\
    \ to exactly how that concrete data is implemented. If that implementation changes,\
    \ your algorithm using it will break. So now you either can’t change the implementation,\
    \ or you will have to change the algorithm that it uses when it does. If you are\
    \ lucky, you might get an error message if you break the interface, but as in\
    \ the case we just saw (and you can try it yourself if you don’t believe me),\
    \ you won’t even get that. The function will just always return the original stack,\
    \ even when the element you want to pop to is on it.\n\n```\nlist_stack %\npush(1)\
    \ %>%\npush(2) %>%\npush(3)\npop_until(list_stack, 1)\n```\n\nIf you write an\
    \ algorithm that operates on a polymorphic object, stick to the interface it has,\
    \ if at all possible. For the `pop_until` function we can easily implement it\
    \ using just the stack interface.\n\n```\npop_until <- function(stack, element)\
    \ {\n  s <- stack\n  while (!is_empty(s) && top(s) != element) s <- pop(s)\n \
    \ if (is_empty(s)) stack else s\n}\n```\n\nIf you cannot achieve what you need\
    \ using the interface, you should instead extend it. You can always write new\
    \ generic functions that work on a class.\n\n```\ncontains <- function(stack,\
    \ element) {\n  UseMethod(\"contains\")\n}\ncontains.default <- function(stack,\
    \ element) {\n  .NotYetImplemented()\n}\ncontains.vector_stack <- function(stack,\
    \ element) {\n  element %in% stack\n}\n```\n\nYou do not need to implement concrete\
    \ functions for all implementations of an abstract data type to add a generic\
    \ function. If you have a default implementation that gives you an error—and you\
    \ have proper unit tests for any code you use—you will get an error if your algorithm\
    \ attempts to use the function if it isn’t implemented yet, and you can add it\
    \ at that point.\n\nAdding new generic functions is not as ideal as using the\
    \ original interface in the first place if the abstract data type is from another\
    \ package. If the implementation in that package changes at a later point, your\
    \ new generic function might break—and might break silently. Still, combined with\
    \ proper unit tests, it is a much better solution than simply accessing the detailed\
    \ implementation in your other functions.\n\nDesigning interfaces is a bit of\
    \ an art. When you create your own abstract types, you want to think carefully\
    \ about which operations the type should have. You don’t want to have too many\
    \ operations. That would make it harder for people implementing other versions\
    \ of the type; they would need to implement all the operations, and depending\
    \ on what those operations are, this could involve a lot of work. On the other\
    \ hand, you can’t have too few operations, because then algorithms using the type\
    \ will often have to break the interface to get to implementation details, which\
    \ will break the polymorphism of those algorithms.\n\nThe abstract data types\
    \ you learn about in an algorithms class are good examples of minimal yet powerful\
    \ interfaces. They define the minimum number of operations necessary to get useful\
    \ work done, yet still make implementations of concrete stacks, queues, dictionaries,\
    \ etc. possible with minimal work.\n\nWhen designing your own types, try to achieve\
    \ the same kind of minimal interfaces."
  raw: '## Designing Interfaces


    It’s not just generic functions that are polymorphic. Any function that manipulates
    data only through generic functions is also polymorphic. The reversal function
    we implemented using a stack takes the empty stack as an argument, and this empty
    stack determines which actual stack implementation we use. Nowhere in the function
    do we refer to any details of a real implementation. If we had, instead, created
    an empty stack inside this function then, despite otherwise only accessing the
    implementation through the interface of the generic functions, the function would
    be bound to a single implementation.


    To get the most out of polymorphism, you will want to design your functions to
    be as polymorphic as possible. This requires two things:


    1.  Don’t refer to concrete implementations unless you really have to.  

    2.  Any time you do have to refer to implementation details of a concrete type,
    do so through a generic function.


    The reversal function is polymorphic because it doesn’t refer to any concrete
    implementation. The choice of which concrete stack to use is determined by a parameter,
    and the operations it performs on the specific stack implementation all go through
    generic functions.


    It can be very tempting to break these rules in the heat of programming. Using
    a parameter to determine data structures in an algorithm isn’t that difficult
    to do, but if you are writing an algorithm that uses several different data structures,
    you might not want to have all the different concrete implementations as parameters.
    You really ought to do it, though. Just write a function that wraps the algorithm
    and provides implementations if you don’t want to remember all the concrete data
    structures where the algorithm is needed. That way you get the best of both worlds.


    More often, you will want to access the details of a concrete implementation.
    Imagine, for example, that you want to pop elements until you see a specific one,
    but only if that element is on the stack. If we are used to working with the vector
    implementation of the stack, then it would be natural to write a function like
    this:


    ```

    pop_until %

    push(1) %>%

    push(2) %>%

    push(3) %T>% print

    ## [1] 3 2 1

    ## attr(,"class")

    ## [1] "vector_stack"

    pop_until(vector_stack, 1)

    ## [1] 1

    ## attr(,"class")

    ## [1] "vector_stack"

    pop_until(vector_stack, 5)

    ## [1] 3 2 1

    ## attr(,"class")

    ## [1] "vector_stack"

    ```


    Here we use the `%in%` function to test if the element is on the stack (and we
    use the `magrittr` pipe operator to create a stack for our test). This works fine,
    as long as the stack is a vector stack , but it will not work if the stack is
    implemented as a list. You won’t get an error message; the `%in%` test will just
    always return `FALSE`, so if you replace the stack implementation you have incorrect
    code that doesn’t even inform you that it isn’t working.


    Relying on implementation details is the worst thing you can do to break the interface
    of polymorphic objects. Not only do you tie yourself to a single implementation,
    but you also tie yourself to exactly how that concrete data is implemented. If
    that implementation changes, your algorithm using it will break. So now you either
    can’t change the implementation, or you will have to change the algorithm that
    it uses when it does. If you are lucky, you might get an error message if you
    break the interface, but as in the case we just saw (and you can try it yourself
    if you don’t believe me), you won’t even get that. The function will just always
    return the original stack, even when the element you want to pop to is on it.


    ```

    list_stack %

    push(1) %>%

    push(2) %>%

    push(3)

    pop_until(list_stack, 1)

    ```


    If you write an algorithm that operates on a polymorphic object, stick to the
    interface it has, if at all possible. For the `pop_until` function we can easily
    implement it using just the stack interface.


    ```

    pop_until <- function(stack, element) {

    s <- stack

    while (!is_empty(s) && top(s) != element) s <- pop(s)

    if (is_empty(s)) stack else s

    }

    ```


    If you cannot achieve what you need using the interface, you should instead extend
    it. You can always write new generic functions that work on a class.


    ```

    contains <- function(stack, element) {

    UseMethod("contains")

    }

    contains.default <- function(stack, element) {

    .NotYetImplemented()

    }

    contains.vector_stack <- function(stack, element) {

    element %in% stack

    }

    ```


    You do not need to implement concrete functions for all implementations of an
    abstract data type to add a generic function. If you have a default implementation
    that gives you an error—and you have proper unit tests for any code you use—you
    will get an error if your algorithm attempts to use the function if it isn’t implemented
    yet, and you can add it at that point.


    Adding new generic functions is not as ideal as using the original interface in
    the first place if the abstract data type is from another package. If the implementation
    in that package changes at a later point, your new generic function might break—and
    might break silently. Still, combined with proper unit tests, it is a much better
    solution than simply accessing the detailed implementation in your other functions.


    Designing interfaces is a bit of an art. When you create your own abstract types,
    you want to think carefully about which operations the type should have. You don’t
    want to have too many operations. That would make it harder for people implementing
    other versions of the type; they would need to implement all the operations ,
    and depending on what those operations are, this could involve a lot of work.
    On the other hand, you can’t have too few operations, because then algorithms
    using the type will often have to break the interface to get to implementation
    details, which will break the polymorphism of those algorithms.


    The abstract data types you learn about in an algorithms class are good examples
    of minimal yet powerful interfaces. They define the minimum number of operations
    necessary to get useful work done, yet still make implementations of concrete
    stacks, queues, dictionaries, etc. possible with minimal work.


    When designing your own types, try to achieve the same kind of minimal interfaces.'
  trans: "\n# 设计接口\n\n具有多态性的并非只有泛型函数。任何仅通过泛型函数操作数据的函数也都具有多态性。我们之前用栈实现的逆序函数，将空栈作为参数传入，而这个空栈决定了我们具体使用哪种栈的实现。在该函数中，我们从未引用任何真实实现的细节。倘若我们直接在函数内部创建一个空栈，那么即使其他部分都仅通过泛型函数的接口访问实现，该函数也会被绑定到单一实现上。\n\
    \n要想充分利用多态性，你需要尽可能将函数设计成具有多态性。这需要满足两个条件：\n\n1.  除非万不得已，否则不要引用具体实现。\n2.  任何时候必须引用具体类型的实现细节时，都要通过泛型函数来进行。\n\
    \n逆序函数具有多态性，因为它没有引用任何具体实现。具体使用哪种栈由参数决定，而它对特定栈实现执行的操作都通过泛型函数完成。\n\n在编程热情高涨时，人们很容易破坏这些规则。在算法中使用参数来确定数据结构并不难，但如果你正在编写的算法使用了多种不同的数据结构，你可能不想把所有不同的具体实现都作为参数。不过，你确实应该这么做。只需编写一个包装该算法并提供具体实现的函数即可——如果你不想记住算法所需的所有具体数据结构的话。这样你就能两全其美。\n\
    \n更常见的情况是，你想访问具体实现的细节。例如，假设你想弹出元素直到看到某个特定元素，但前提是该元素必须在栈中。如果我们习惯于使用基于向量的栈实现，那么很自然地会写出这样的函数：\n\
    \n```\npop_until <- function(stack, element) {\n  if (!(element %in% stack)) return(stack)\n\
    \  s <- stack\n  while (top(s) != element) s <- pop(s)\n  s\n}\n```\n\n（既然我们要编写一个实用函数，不如就用\
    \ `magrittr` 管道的风格来写吧。）\n\n```\npop_until %\npush(1) %>%\npush(2) %>%\npush(3)\
    \ %T>% print\n## [1] 3 2 1\n## attr(,\"class\")\n## [1] \"vector_stack\"\npop_until(vector_stack,\
    \ 1)\n## [1] 1\n## attr(,\"class\")\n## [1] \"vector_stack\"\npop_until(vector_stack,\
    \ 5)\n## [1] 3 2 1\n## attr(,\"class\")\n## [1] \"vector_stack\"\n```\n\n这里我们使用\
    \ `%in%` 函数来测试元素是否在栈中（同时使用 `magrittr` 管道操作符来创建测试用的栈）。只要栈是向量栈，这段代码就能正常工作；但如果栈是基于列表实现的，它就会失效。你不会收到错误信息；`%in%`\
    \ 测试将始终返回 `FALSE`，因此如果你替换了栈的实现，就会得到不正确的代码，而它甚至不会提醒你它无法工作。\n\n依赖实现细节是破坏多态对象接口最糟糕的做法。这不仅会将你绑定到单一实现上，还会让你完全依赖于该具体数据的具体实现方式。如果该实现发生了变化，使用它的算法就会出问题。于是，你既不能更改实现，又不得不在实现变更时修改使用它的算法。运气好的话，如果你破坏了接口，可能会收到错误消息；但就像我们刚看到的情况（如果你不信，可以自己试试），你甚至可能连错误消息都得不到。该函数只会始终返回原始栈，即使你想要弹出的元素就在栈中。\n\
    \n```\nlist_stack <- list_stack() %>%\n  push(1) %>%\n  push(2) %>%\n  push(3)\n\
    pop_until(list_stack, 1)\n```\n\n如果你编写的算法要操作多态对象，请尽可能遵循它所提供的接口。对于 `pop_until`\
    \ 函数，我们完全可以仅使用栈接口来轻松实现。\n\n```\npop_until <- function(stack, element) {\n  s <-\
    \ stack\n  while (!is_empty(s) && top(s) != element) s <- pop(s)\n  if (is_empty(s))\
    \ stack else s\n}\n```\n\n如果使用现有接口无法满足需求，你应该考虑对其进行扩展。你随时都可以编写适用于某个类的新泛型函数。\n\n\
    ```\ncontains <- function(stack, element) {\n  UseMethod(\"contains\")\n}\ncontains.default\
    \ <- function(stack, element) {\n  .NotYetImplemented()\n}\ncontains.vector_stack\
    \ <- function(stack, element) {\n  element %in% stack\n}\n```\n\n你无需为抽象数据类型的所有实现都编写具体函数来添加泛型函数。如果你有一个会报错的默认实现，并且你对自己使用的任何代码都编写了适当的单元测试，那么当你的算法试图使用尚未实现的函数时，你将收到错误提示，届时再补充实现即可。\n\
    \n如果抽象数据类型来自其他包，添加新的泛型函数并不像一开始就使用原始接口那么理想。如果该包中的实现在后续发生了变化，你新增的泛型函数可能会出错——并且可能是无声无息地出错。不过，结合适当的单元测试，这仍然比在其他函数中直接访问具体实现细节要好得多。\n\
    \n设计接口是一门艺术。在创建自己的抽象类型时，你需要仔细思考该类型应该具备哪些操作。操作数量不宜过多，否则会增加他人实现该类型其他版本的工作量；他们需要实现所有操作，而具体取决于这些操作是什么，这可能会涉及大量工作。另一方面，操作数量也不能太少，否则使用该类型的算法常常不得不破坏接口来获取实现细节，从而破坏这些算法的多态性。\n\
    \n你在算法课程中学到的抽象数据类型，就是最小化且功能强大的接口的绝佳范例。它们定义了完成有用工作所需的最少操作数量，同时仍能以最少的工作量实现具体的栈、队列、字典等。\n\
    \n在设计你自己的类型时，请努力达成这种最小化接口的境界。\n"
- fmt: '# The Usefulness of Polymorphism


    Polymorphism isn’t only useful for what we would traditionally call abstract data
    structures. Polymorphism gives you the means to implement abstract data structures,
    so algorithms work on the abstract interface and never need to know which concrete
    implementation they are operating on, but generic functions are useful for many
    cases that we do not traditionally think of as data structures.


    In `R`, you often fit statistical models to data. Such models are not really data
    structures, but there is an abstract interface to them. You fit a concrete model,
    for example, a linear model, but once you have a fitted model, there are many
    common operations that are useful for all models. You might want to predict response
    variables for new data, or you might want to get the residuals of your fitted
    values. These operations are the same for all models—although how different models
    implement the operations will be different—and so they can benefit from being
    generic. Indeed, they are. The functions `predict` and `residuals`, which implement
    those two operations, are generic functions, and each model can implement its
    own version of them.


    There is an extensive list of standard functions that are frequently used on fitted
    models, and all of these are implemented as generics. If you write analysis code
    that operates on fitted models using only those generic functions, you can change
    the model at any time and reuse all the code without modifying it.


    The same goes for printing and plotting functions. Both `print` and `plot` are
    generic functions, and they have concrete implementations for different data types
    (and usually also for different fitted models). It is not something we think much
    about from day to day, but if we didn’t have generic functions like these, we
    would need to use different functions for displaying vectors and for displaying
    matrices, for example.


    Converting between different data types is also a frequent operation, and again
    polymorphism is highly useful (and frequently used in `R`). To translate a data
    structure into a vector, you use the `as.vector` function—an unfortunate name
    since it looks like a generic function `as` with a specialization for `vector`,
    but actually is a generic function named `as.vector`. To translate a factor into
    a vector, it is the concrete implementation `as.vector.factor` that gets called.


    An algorithm that needs to translate some input data into a vector can use the
    `as.vector` function and then doesn’t have to worry about what the actual data
    is implemented as, as long as the data type has an implementation of the `as.vector`
    function.


    ## Polymorphism and Algorithmic Programming


    Polymorphism as a component of designing algorithms, and especially implementing
    algorithms, is not often covered in classes and textbooks but can be an important
    aspect of writing reusable software. You might not think of `R` as a language
    where you implement algorithms, but whenever you write a data analysis pipeline,
    whenever you manipulate data frames, and whenever you fit a model, you can think
    of that as implementing or using an algorithm. We want our data analysis to be
    efficient, so we want our algorithms to be efficient, but we also want to write
    code that can be used more than once so we don’t have to repeat ourselves. This
    means that we need to write code that can be used with different data and in many
    instances this involves hiding concrete data behind generic interfaces.


    Take something as simple as a sorting function. For many sorting algorithms, all
    you need to be able to do to sort elements is determine whether one element is
    smaller than another. If you hardwire in an implementation of such an algorithm
    where the comparison used is interfering or floating point comparison, then you
    can only sort objects of these types. In general, if you hardwire comparisons,
    you need a different implementation for each type of elements you want to sort.


    Because of this, most languages provide you with a generic sorting function as
    part of their runtime library where you can provide the comparison functionality
    it should use, typically either as a function provided to the function or by allowing
    you to specify a comparison function for new types. Unfortunately, the `sort`
    function in `R` is not of this kind—it does allow you to define sorting for new
    types, but it wants its input to be in atomic form, so you cannot give it sequences
    of complex data types—anything beyond simple numerical, boolean, or string types.
    Usually, you can change your data to a matrix or something similar and sort it
    this way, but if you actually have a list of complex data, you cannot use it.


    We can easily implement our own function for doing this, however, and we can call
    it `sort_list`—not to be confused with the built-in function `sort.list` that
    actually does something other than sort lists…'
