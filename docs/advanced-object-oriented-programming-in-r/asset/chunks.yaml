  trans: '

    ### 排序列表


    归并排序的直接实现可能如下所示：


    ```

    merge_lists <- function(x, y) {

    if (length(x) == 0) return(y)

    if (length(y) == 0) return(x)

    if (x[[1]] < y[[1]]) {

    c(x[1], merge_lists(x[-1], y))

    } else {

    c(y[1], merge_lists(x, y[-1]))

    }

    }

    sort_list <- function(x) {

    if (length(x) <= 1) return(x)

    start <- 1

    end <- length(x)

    middle <- end %/% 2

    merge_lists(sort_list(x[start:middle]),

    sort_list(x[(middle+1):end]))

    }

    ```


    这个实现虽然能完成功能，但归并函数的运行时间是二次的，因为它像 `x[-1]` 和 `y[-1]` 那样通过下标取值时会复制列表，并且在递归调用中组合结果时也会复制。我们可以编写一个稍微复杂一点的函数，使用迭代方法而非递归，在线性时间内完成归并：


    ```

    merge_lists <- function(x, y) {

    n <- length(x) + length(y)

    result <- vector("list", length = n)

    i <- 1

    j <- 1

    for (k in 1:n) {

    if (i <= length(x) && (j > length(y) || x[[i]] < y[[j]])) {

    result[[k]] <- x[[i]]

    i <- i + 1

    } else {

    result[[k]] <- y[[j]]

    j <- j + 1

    }

    }

    result

    }

    sort_list <- function(x) {

    if (length(x) <= 1) return(x)

    start <- 1

    end <- length(x)

    middle <- end %/% 2

    merge_lists(sort_list(x[start:middle]),

    sort_list(x[(middle+1):end]))

    }

    ```


    在排序函数的递归调用中我们仍然会复制，但复制量不会超过后续要归并的量，因此至少渐近运行时间是可接受的。


    使用此函数，我们可以对元素之间能用 `"<"` 判断大小的列表进行排序。不过，内置的 `"<"` 函数不一定适用于你自定义的类。


    ```

    make_tuple <- function(x, y) {

    structure(c(x, y), class = "tuple")

    }

    x <- list(make_tuple(1,2), make_tuple(2,0), make_tuple(1,1))

    sort_list(x)

    ## Warning in if (x[[i]] < y[[j]]) {: the condition has length > 1 and only the
    first element will be

    ## used

    ## Warning in if (x[[i]] < y[[j]]) {: the condition has length > 1 and only the
    first element will be

    ## used

    ## Warning in if (x[[i]] < y[[j]]) {: the condition has length > 1 and only the
    first element will be

    ## used

    ## [[1]]

    ## [1] 1 1

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[2]]

    ## [1] 1 2

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[3]]

    ## [1] 2 0

    ## attr(,"class")

    ## [1] "tuple"

    ```


    有几种方法可以解决这个问题。一种选择是定义一个通用的比较函数：我们可以称它为 `less`，然后在归并函数中使用它。


    ```

    merge_lists <- function(x, y) {

    n <- length(x) + length(y)

    result <- vector("list", length = n)

    i <- 1

    j <- 1

    for (k in 1:n) {

    if (i <= length(x) && (j > length(y) || less(x[[i]], y[[j]]))) {

    result[[k]] <- x[[i]]

    i <- i + 1

    } else {

    result[[k]] <- y[[j]]

    j <- j + 1

    }

    }

    result

    }

    less <- function(x, y) UseMethod("less")

    less.numeric <- function(x, y) x < y

    less.tuple <- function(x, y) x[1] < y[1] || x[2] < y[2]

    sort_list(x)

    ## [[1]]

    ## [1] 1 1

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[2]]

    ## [1] 1 2

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[3]]

    ## [1] 2 0

    ## attr(,"class")

    ## [1] "tuple"

    ```


    不过，我们需要为所有希望排序的类型定义 `less` 的具体实现。另一种方式是可以告诉 `R` 如何处理我们自定义类型的 `"<"` 操作符，我们将在后面的章节中了解如何实现。采用这种方法，所有可以通过这种方式比较的对象都能获得排序功能。第三种可能性是将
    `less` 作为排序函数的一个参数：


    ```

    merge_lists <- function(x, y, less) {

    # 函数体与之前相同

    }

    sort_list <- function(x, less = `<`) {

    if (length(x) <= 1) return(x)

    result <- vector("list", length = length(x))

    start <- 1

    end <- length(x)

    middle <- end %/% 2

    merge_lists(sort_list(x[start:middle], less),

    sort_list(x[(middle+1):end], less),

    less)

    }

    unlist(sort_list(as.list(sample(1:5))))

    ## [1] 1 2 3 4 5

    tuple_less <- function(x, y) x[1] < y[1] || x[2] < y[2]

    sort_list(x, tuple_less)

    ## [[1]]

    ## [1] 1 1

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[2]]

    ## [1] 1 2

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[3]]

    ## [1] 2 0

    ## attr(,"class")

    ## [1] "tuple"

    ```


    我们将默认的 `less` 函数设置为 `"<"`，但对于这种比较函数不适用的类型，我们可以提供其他函数。


    ### 关于算法实现的灵活性的通用评论


    一般来说，你希望算法实现能够通过提供多态性的接口来适应变化，无论是为特定函数提供选项（如上面我们对 `less` 所做的），还是为抽象数据类型使用通用函数。


    在为特定用途实现算法时，你可能能够尝试最优的数据结构和操作实现，但通过提供修改函数的接口，你可以使代码更具可复用性。即使在算法对不同应用都能正确执行的情况下，你仍然可能希望提供灵活性；算法的性能通常取决于具体使用场景。在渐近分析中，我们通常偏好理论上运行时间更优的实现，但在实践中，我们希望代码运行最快，而这并不一定是渐近最快的算法。使用“大
    O”分析时，我们忽略了常数，但这些常数很重要，因此你希望你的实现的用户能够替换算法实现中使用的数据结构和操作。


    要弄清楚如何在实现中最佳地提供这种灵活性，通常需要一些实践。对于抽象数据结构，通用函数通常是最好的方法。对于上面排序示例中的比较功能，三种解决方法（通用函数、操作符重载或提供带有良好默认值的函数）可能同样有效。但就像设计良好的软件界面需要进行实验和思考一样，算法编程也需要如此。


    ## 关于 `UseMethod` 的更多内容


    `UseMethod` 函数是我们用来定义通用函数的工具，它通过我们之前看到的名称查找机制，负责找到合适的具体实现。不过，我之前遗漏了一些关于 `UseMethod`
    的细节。


    首先，它实际上并不像一个普通函数那样工作。它看起来像一个函数，并且在很大程度上确实是一个函数，但如果你仅仅把它当作其他函数来对待，可能会得到意想不到的效果。


    其次，如果你在调用 `UseMethod` 之前对局部变量进行了赋值，你可以将这些局部变量传递到具体实现中。让我们看一个简单的例子。


    ```

    foo <- function(object) UseMethod("foo")

    foo.numeric <- function(object) object

    foo(4)

    ## [1] 4

    bar <- function(object) {

    x <- 2

    UseMethod("bar")

    }

    bar.numeric <- function(object) x + object

    bar(4)

    ## [1] 6

    ```


    这里的 `foo` 函数使用了我们之前看到的模式。它只是调用了 `UseMethod`。然后我们定义了一个具体函数，当 `foo` 被应用于数字时调用。数字具有类，这个类是
    `numeric`。（严格来说，数字除了这个类还有更多属性，但目前我们无需担心。）`foo` 的行为并无异常。


    然而，对于 `bar`，我们在调用 `UseMethod` 之前赋值了一个局部变量。这个变量 `x` 在 `bar.numeric` 被调用时是可见的。在普通函数调用中，你需要采取措施才能访问调用作用域，因此这里的
    `UseMethod` 的行为不像普通函数。


    在对 `UseMethod` 的调用中，它的行为也不同于普通函数。你不能将 `UseMethod` 用作表达式的一部分。


    ```

    baz <- function(object) UseMethod("baz") + 2

    baz.numeric <- function(object) object

    baz(4)

    ## [1] 4

    ```


    当 `UseMethod` 被调用时，具体函数会完全接管控制权，而对 `UseMethod` 的调用永远不会返回。在这方面，它与 `return` 函数类似。因此，任何包含
    `UseMethod` 的表达式都不会被求值，而在 `UseMethod` 调用之后放置的任何代码也永远不会被执行。


    `UseMethod` 函数除了通用函数的名称外，还接受第二个参数。这个参数是用于分发通用函数的对象——即其类型决定了要调用的具体函数的对象。如果你不想基于调用
    `UseMethod` 的函数的第一个参数进行分发，可以使用这个参数。由于基于第一个函数参数的类型进行分发是非常常见的模式，在调用 `UseMethod`
    时使用另一个对象可能会引起混淆，我建议除非你有非常充分的理由，否则不要这样做。

