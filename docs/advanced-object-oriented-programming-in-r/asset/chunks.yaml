  trans: '

    # 作为带有细化功能的接口的类层次结构


    在之前的示例中，我们有一个抽象类定义了接口，然后由不同的具体类来实现它。以栈为例，不同的实现为我们提供了不同的时间复杂度权衡，但不同的实现概念上都是栈。对于图形对象而言，各种具体类在概念上是不同的对象，只是这些对象都可以被视为图形对象，从而通过通用接口进行操作。这些是软件设计中常见的模式，但当子类（例如不同类型的图形对象）代表不同的概念类时，它们通常也可以扩展接口。


    以统计模型为例。这些模型通常被实现为某些通用函数（例如 `predict` 或 `coef`）的类，这些函数为我们提供了统一的模型接口，使得我们能够在分析中切换不同模型，而无需对分析代码进行重大重写。所有模型实现的通用函数为最抽象的模型类型提供了一个接口。例如，所有模型都必须实现
    `predict` 和 `coef`，这样我们才能在分析代码中将它们作为即插即用的替代品使用。但不同类型的模型可能会在接口中添加并非所有模型都相关的额外功能。例如，我们可以设想决策树增加了修剪树的功能，比如一个
    `prune` 函数。如果所有决策树实现都有一个 `prune` 函数，我们就可以替换决策树的实现并仍然复用我们的代码，但由于并非所有模型都实现了 `prune`，我们只能将一个决策树实现替换为另一个决策树，而不能替换为任意类型的模型。我们可以说决策树是模型的特化形式。所有决策树都是模型，但并非所有模型都是决策树。在类的层面上，我们会有一个模型的超类，以及一个决策树的子类，它向模型接口中添加了诸如
    `prune` 之类的函数。如果我们有不同的决策树实现，那么决策树类通常也是抽象的，不同的实现将继承自这个类，而不是更通用的模型类（参见图 2-4）。


    ![A451015_1_En_2_Fig4_HTML.gif](img/A451015_1_En_2_Fig4_HTML.gif)


    **图 2-4.** 模型层次结构，其中决策树是 `Model` 类的特化形式，该类添加了 `prune` 函数，并为我们提供了一个额外的抽象类，决策树的实例必须实现该类


    作为另一个例子，我们可以考虑一个参考文献列表，它本质上是一系列出版物的列表。存在不同类型的出版物，但所有出版物至少都有一个名称和一位或多位作者，因此表示出版物的最抽象方式只需包含这两个属性。对一系列出版物，我们可能想做的其中一件事是计算文献计量指标，例如每篇出版物的引用次数。如果每篇出版物都有一个其所引用的其他作品的列表，那么我们可以从所有相关出版物的数据库中计算出这个引用次数。如果我们有一位给定作者的所有出版物的列表，我们还可以计算出该作者获得的引用次数，或推导出诸如
    h 指数之类的统计数据。


    存在不同类型的出版物，因此我们可以为书籍和文章等创建子类。书籍会有一个关联的出版商和一个 ISBN，而期刊文章会有一个关联的期刊以及（通常）文章在期刊中所在的页码。为简单起见，如果我们只允许这两种类型的出版物，我们可以将其表示为图
    2-5 所示的类层次结构。


    ![A451015_1_En_2_Fig5_HTML.gif](img/A451015_1_En_2_Fig5_HTML.gif)


    **图 2-5.** 参考文献对象的层次结构。通用的 `Publication` 类为每篇出版物赋予一个名称、一个作者列表以及一个其他出版物引用列表。两种具体类型的出版物，`Article`
    和 `Book`，则添加了额外的属性。


    在这个层次结构中，所有函数都只是访问对象的属性；也就是说，它们只是提取存储在这些对象中的数据。通过函数访问属性，而不是访问作为对象表示一部分的列表或向量，通常是一个好主意。它允许你更改数据的表示方式，而无需修改访问函数之外的任何代码。如果你的代码仅通过函数访问对象，那么你就封装了实现细节，以后更新代码将比不这样做简单得多。


    还要注意，在这两种具体类型的出版物之间，没有任何访问函数需要有所不同。抽象类 `Publication` 访问 `name` 和 `authors`，而其他类中提供的附加属性是不相交的。正因如此，没有必要为实现此类层次结构而使用通用函数。我们可以仅使用普通的旧式函数来实现它。


    ```

    # 出版物接口

    publication <- function(name, authors, citations) {

    structure(list(name = name, authors = authors,

    citations = citations),

    class = "publication")

    }

    name <- function(pub) pub$name

    authors <- function(pub) pub$authors

    # 文章

    article <- function(name, authors, citations, journal, pages) {

    structure(list(name = name, authors = authors,

    citations = citations,

    journal = journal, pages = pages),

    class = c("article", "publication"))

    }

    journal <- function(pub) pub$journal

    pages <- function(pub) pub$pages

    # 书籍

    book <- function(name, authors, citations, publisher, ISBN) {

    structure(list(name = name, authors = authors,

    citations = citations,

    publisher = publisher, ISBN = ISBN),

    class = c("book", "publication"))

    }

    publisher <- function(pub) pub$publisher

    ISBN <- function(pub) pub$ISBN

    ```


    通用函数非常适合在相同概念操作下为不同类提供不同行为，但当我们能使用普通旧式函数获得所需操作时，就没有必要调用通用函数了。


    出版物的实现是直接的，除了在构造函数中设置的 `class` 属性。这里我们将类设置为类名列表，而不仅仅是类名。这就是我们指定一个 `"book"` 对象或
    `"article"` 对象同时也是 `"publication"` 对象的方式。我们想要的设计要求书籍和文章都是出版物，但由于 S3 类只是表示为字符串的名称，我们无法在
    R 中明确这一点。相反，我们通过让 `class` 属性成为类名列表来表示类层次结构，该列表从最特化的对象向上追溯到最抽象的对象。R 如何解释这种类名列表，以及如何用它来找到通用函数的正确实现，是下一章的主题。


    创建一个类似于我们为出版物所做的类层次结构并不罕见，但它存在一些小问题。要访问书籍特有的属性，你需要知道你正在处理的对象是一本书；在不编写专门处理书籍或文章的特化代码的情况下，聚合处理出版物，这才是使用面向对象编程以及首先构建出版物层次结构的初衷。拥有一个子类为其超类接口添加函数的类层次结构本身并没有问题，但如果你发现自己正在编写这样的层次结构，你应该仔细考虑应该如何访问和操作该层次结构中的对象。

    '
- fmt: 'It is generally best to put functions as high up in the hierarchy as it makes
    sense to do, thus ensuring that as many classes from the hierarchy as possible
    will support them. With generic functions, the different subclasses can implement
    the methods very differently, but all objects you manipulate will at least implement
    the methods you call them on. With the publication class hierarchy we have designed
    here, the only things we can really do if we want to write reusable code are to
    access names and authors and construct graphs of citations. The special attributes
    for books and articles are only available in a type-safe way if we explicitly
    check that we are accessing books and articles, respectively.


    We would probably like code to format publications for making publication lists
    and such. Here we would need the information stored in books and articles, but
    since accessing these directly requires that we first test the class of the objects,
    the code would be a bit cumbersome and likely also error-prone. Worse, if we added
    another publication type to the hierarchy (for example, conference contributions),
    we would need to update all code that does this class checking and handles the
    different classes in different ways to handle this type as well. It is exactly
    to avoid this that we need generic functions, so the right design would be to
    have a generic function for formatting citations and specialize it for the sub-classes.


    ```

    format <- function(publ) UseMethod("format")

    format.article <- function(publ) {

    paste(name(publ), authors(publ),

    journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(name(publ), authors(publ),

    publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    We could then use this `format` function in another generic function, `print`,
    for displaying publications:


    ```

    print.publication <- function(x, ...) print(format(x))

    ```


    When we subclass to extend an interface, we add functions that only a subset of
    objects will support. Sometimes this is necessary when there are operations that
    truly only make sense for some objects—like pruning decision trees, where pruning
    something like a linear model is not meaningful—but as a general rule, I would
    suggest that you keep specialization like this to a minimum. It might feel like
    a good design to have a large hierarchy of more or less specialized classes, but
    when you have to work with objects from the hierarchy you want them to be as similar
    as you can get them. You want to be able to treat all of them using the same (generic)
    functions, so, in general, you want to stick to the most abstract interface in
    any case. You might as well design your code with that in mind.


    Being able to treat objects uniformly is also the reason we made a collection
    of graphical objects be a graphical object in itself. If we had not, then we would
    need to explicitly deal with collections of objects and write recursive functions
    to traverse them. By making the collection a class of graphical objects, we could
    hide this complexity in the generic functions. This is a very common trick and
    is called the composite design pattern.


    # 3. Implementation Reuse


    The easiest code to write is the code that is already written. If you can reuse
    existing code, it is always better than writing new code. You don’t have to spend
    time writing the code, and if the existing code has been around for a while there
    is a good chance that it is well tested and thus more likely to be correct than
    the new code you introduce. So your aim as a programmer should be to write as
    little new code as possible, paradoxical as it sounds.


    The way to reuse code, however, is not to copy chunks of existing code from one
    place in your program and paste it into another. You will be reusing the code
    this way, true, but you will end up with two copies of the same code. If you find,
    at some point in the future, that you have to modify this code, perhaps because
    there was a bug hidden in it despite the tests, you will have to remember to change
    it both places. It is hard to remember when you have such duplicated code and
    if the two copies start drifting apart, it is a nightmare trying to maintain it.


    The way to reuse code is to write functions that can be used in many different
    contexts. Write functions to deal with a single problem, and deal with it well,
    while assuming little about the context in which they will be called. Constructing
    a program out of small, reusable building blocks makes your code easier to maintain
    and simpler to extend.


