- fmt: '# Generic Functions and Class Hierarchies


    To see how S4 handles class hierarchies and generic functions, we return to the
    `A`, `B`, `C` example from earlier. We can construct the classes and the three
    objects thus:


    ```

    A <- setClass("A", contains = "NULL")

    B <- setClass("B", contains = "A")

    C <- setClass("C", contains = "B")

    x <- A()

    y <- B()

    z <- C()

    ```


    Here I let `A` inherit from the pseudo-class `"NULL"` to make it non-abstract
    so that I can instantiate it even though it doesn’t have any slots.


    We can define a generic function `f` and only implement it for class `A`, like
    so:


    ```

    setGeneric("f", def = function(x) standardGeneric("f"))

    setMethod("f", signature = "A",

    definition = function(x) print("A::f"))

    ```


    If we do, then this version will be called when we call it on all three objects.


    ```

    f(x)

    ## [1] "A::f"

    f(y)

    ## [1] "A::f"

    f(z)

    ## [1] "A::f"

    ```


    If we define another function, `g`, that we implement for both `A` and `B`, then
    calling it on `x` will call the `A` version. Calling it on `y` and `z` will invoke
    the `B` version since this is the most specialized form of the function for those
    two classes.


    ```

    setGeneric("g", def = function(x) standardGeneric("g"))

    setMethod("g", signature = "A",

    definition = function(x) print("A::g"))

    setMethod("g", signature = "B",

    definition = function(x) print("B::g"))

    g(x)

    ## [1] "A::g"

    g(y)

    ## [1] "B::g"

    g(z)

    ## [1] "B::g"

    ```


    If we define a function that we implement for all three classes, then calling
    it on `x`, `y`, and `z` will invoke the most specialized version in all three
    cases.


    ```

    setGeneric("h", def = function(x) standardGeneric("h"))

    setMethod("h", signature = "A",

    definition = function(x) print("A::h"))

    setMethod("h", signature = "B",

    definition = function(x) print("B::h"))

    setMethod("h", signature = "C",

    definition = function(x) print("C::h"))

    h(x)

    ## [1] "A::h"

    h(y)

    ## [1] "B::h"

    h(z)

    ## [1] "C::h"

    ```


    The analogue of `NextMethod` in S4 is called `callNextMethod` and it works very
    similarly.


    ```

    setMethod("h", signature = "A",

    definition = function(x) {

    print("A::h")

    })

    setMethod("h", signature = "B",

    definition = function(x) {

    print("B::h")

    callNextMethod()

    })

    setMethod("h", signature = "C",

    definition = function(x) {

    print("C::h")

    callNextMethod()

    })

    h(x)

    ## [1] "A::h"

    h(y)

    ## [1] "B::h"

    ## [1] "A::h"

    h(z)

    ## [1] "C::h"

    ## [1] "B::h"

    ## [1] "A::h"

    ```


    There is no `.default` version of methods as such, but we can use the `setGeneric`
    function to create one. If we define a plain old function and call `setGeneric`
    just with its name, that function will become the default function called when
    we do not have a more specialized version.


    ```

    d <- function(x) print("default::d")

    setGeneric("d")

    d(x)

    ## [1] "default::d"

    d(y)

    ## [1] "default::d"

    d(z)

    ## [1] "default::d"

    ```


    This, of course, also works when we specialize and use `callNextMethod`.


    ```

    setMethod("d", signature = "A",

    definition = function(x) {

    print("A::d")

    callNextMethod()

    })

    setMethod("d", signature = "B",

    definition = function(x) {

    print("B::d")

    callNextMethod()

    })

    setMethod("d", signature = "C",

    definition = function(x) {

    print("C::d")

    callNextMethod()

    })

    d(x)

    ## [1] "A::d"

    ## [1] "default::d"

    d(y)

    ## [1] "B::d"

    ## [1] "A::d"

    ## [1] "default::d"

    d(z)

    ## [1] "C::d"

    ## [1] "B::d"

    ## [1] "A::d"

    ## [1] "default::d"

    ```


    ## Requiring Methods


    The abstract class `Stack` we defined earlier didn’t serve any purpose. It is
    an abstract class with no associated data or functions. All functions in the stack
    interface were implemented in `VectorStack`, and we didn’t gain anything from
    inheriting from `Stack`. In S4, however, we can formalize interfaces such as stacks
    and ensure that implementations of an interface actually implement all the functions
    in the interface.


    It’s not much. There is very little type checking in R, and you won’t get much
    assistance from S4 either, but there is a way of at least making the error messages
    more informative when you invoke a generic function that hasn’t been implemented.


    Let’s implement a non-functioning stack. We can make this class for the list-based
    stack. It inherits from `Stack`, but it doesn’t add any slots or any functionality.


    ```

    ListStack <- setClass("ListStack", contains = "Stack")

    ```


    Even without an implementation, we can create an object of type `ListStack`. The
    `Stack` class is abstract because we didn’t add any slots to it, but the `ListStack`
    is not interpreted as abstract, even though it doesn’t add any slots either because
    it `contains` a superclass. If we were to call `pop` on a `ListStack`, however,
    we would get an error, and rightly so. We would expect to get an error here, and
    in this case it probably isn’t hard to figure out, from the error message, what
    is wrong. The error would tell us that R was unable to find an inherited method
    for the function. But if either `Stack` implemented a version of `pop`, or we
    had set a default function, we would instead be calling that, which would be an
    error but might not invoke an error message.


    We can specify that all sub-classes of `Stack` must implement the stack interface
    using the function `requireMethods`:


    ```

    requireMethods(functions = c("top", "pop", "push", "is_empty"),

    signature = "Stack")

    ```


    By doing this we ensure that calling any of these methods on `ListStack` will
    give us an error message.


    ```

    pop(stack)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## numeric(0)

    ```


    It is not much of a safety check for the correct implementation of an interface,
    and I usually don’t see much use for it, but it is there if you want it.


    ## Constructors


    You can provide values for slots when you create objects by providing them as
    named arguments, but you can also get more control over object initialization
    through the method `initialize`. This method works as a constructor, except that
    it doesn’t create an object; it is just responsible for setting attributes to
    leave it in a consistent state. If you define this function, it replaces the default
    constructor, and you are in charge of which arguments the constructor should take,
    how it should set slots, and whether it should call the constructor of its superclass.


    A very simple example, where we have one superclass and one subclass, is shown
    below:


    ```

    A <- setClass("A", slots = list(x = "numeric", y = "numeric"))

    B <- setClass("B", contains = "A", slots = list(z = "numeric"))

    setMethod("initialize", signature = "A",

    definition = function(.Object, x, y) {

    print("A initialize")

    .Object@x <- x

    .Object@y <- y

    .Object

    })

    ## [1] "initialize"

    setMethod("initialize", signature = "B",

    definition = function(.Object, z) {

    .Object <- callNextMethod(.Object, x = z, y = z)

    .Object@z <- z

    .Object

    })

    ## [1] "initialize"

    (a <- A(x = 1:3, y = 4:6))

    ## [1] "A initialize"

    ## An object of class "A"

    ## Slot "x":

    ## [1] 1 2 3

    ##

    ## Slot "y":

    ## [1] 4 5 6

    (b <- B(z = 6:9))

    ## [1] "A initialize"

    ## An object of class "B"

    ## Slot "z":

    ## [1] 6 7 8 9

    ##

    ## Slot "x":

    ## [1] 6 7 8 9

    ##

    ## Slot "y":

    ## [1] 6 7 8 9

    ```'
  raw: '## Generic Functions and Class Hierarchies


    To see how S4 handles class hierarchies and generic functions , we return to the
    `A`, `B`, `C` example from earlier. We can construct the classes and the three
    objects thus:


    ```

    A <- setClass("A", contains = "NULL")

    B <- setClass("B", contains = "A")

    C <- setClass("C", contains = "B")

    x <- A()

    y <- B()

    z <- C()

    ```


    Here I let `A` inherit from the pseudo-class `"NULL"` to make it non-abstract
    so that I can instantiate it even though it doesn’t have any slots.


    We can define a generic function `f` and only implement it for class `A`, like
    so:


    ```

    setGeneric("f", def = function(x) standardGeneric("f"))

    setMethod("f", signature = "A",

    definition = function(x) print("A::f"))

    ```


    If we do, then this version will be called when we call it on all three objects.


    ```

    f(x)

    ## [1] "A::f"

    f(y)

    ## [1] "A::f"

    f(z)

    ## [1] "A::f"

    ```


    If we define another function, `g`, that we implement for both `A` and `B`, then
    calling it on `x` will call the `A` version. Calling it on `y` and `z` will invoke
    the `B` version since this is the most specialized form of the function for those
    two classes.


    ```

    setGeneric("g", def = function(x) standardGeneric("g"))

    setMethod("g", signature = "A",

    definition = function(x) print("A::g"))

    setMethod("g", signature = "B",

    definition = function(x) print("B::g"))

    g(x)

    ## [1] "A::g"

    g(y)

    ## [1] "B::g"

    g(z)

    ## [1] "B::g"

    ```


    If we define a function that we implement for all three classes, then calling
    it on `x`, `y`, and `z` will invoke the most specialized version in all three
    cases.


    ```

    setGeneric("h", def = function(x) standardGeneric("h"))

    setMethod("h", signature = "A",

    definition = function(x) print("A::h"))

    setMethod("h", signature = "B",

    definition = function(x) print("B::h"))

    setMethod("h", signature = "C",

    definition = function(x) print("C::h"))

    h(x)

    ## [1] "A::h"

    h(y)

    ## [1] "B::h"

    h(z)

    ## [1] "C::h"

    ```


    The analogue of `NextMethod` in S4 is called `callNextMethod` and it works very
    similarly.


    ```

    setMethod("h", signature = "A",

    definition = function(x) {

    print("A::h")

    })

    setMethod("h", signature = "B",

    definition = function(x) {

    print("B::h")

    callNextMethod()

    })

    setMethod("h", signature = "C",

    definition = function(x) {

    print("C::h")

    callNextMethod()

    })

    h(x)

    ## [1] "A::h"

    h(y)

    ## [1] "B::h"

    ## [1] "A::h"

    h(z)

    ## [1] "C::h"

    ## [1] "B::h"

    ## [1] "A::h"

    ```


    There is no `.default` version of methods as such, but we can use the `setGeneric`
    function to create one. If we define a plain old function and call `setGeneric`
    just with its name, that function will become the default function called when
    we do not have a more specialized version.


    ```

    d <- function(x) print("default::d")

    setGeneric("d")

    d(x)

    ## [1] "default::d"

    d(y)

    ## [1] "default::d"

    d(z)

    ## [1] "default::d"

    ```


    This, of course, also works when we specialize and use `callNextMethod.`


    ```

    setMethod("d", signature = "A",

    definition = function(x) {

    print("A::d")

    callNextMethod()

    })

    setMethod("d", signature = "B",

    definition = function(x) {

    print("B::d")

    callNextMethod()

    })

    setMethod("d", signature = "C",

    definition = function(x) {

    print("C::d")

    callNextMethod()

    })

    d(x)

    ## [1] "A::d"

    ## [1] "default::d"

    d(y)

    ## [1] "B::d"

    ## [1] "A::d"

    ## [1] "default::d"

    d(z)

    ## [1] "C::d"

    ## [1] "B::d"

    ## [1] "A::d"

    ## [1] "default::d"

    ```


    ### Requiring Methods


    The abstract class `Stack` we defined earlier didn’t serve any purpose. It is
    an abstract class with no associated data or functions. All functions in the stack
    interface were implemented in `VectorStack`, and we didn’t gain anything from
    inheriting from `Stack`. In S4, however, we can formalize interfaces such as stacks
    and ensure that implementations of an interface actually implement all the functions
    in the interface.


    It’s not much. There is very little type checking in R, and you won’t get much
    assistance from S4 either, but there is a way of at least making the error messages
    more informative when you invoke a generic function that hasn’t been implemented.


    Let’s implement a non-functioning stack. We can make this class for the list-based
    stack . It inherits from `Stack`, but it doesn’t add any slots or any functionality.


    ```

    ListStack <- setClass("ListStack", contains = "Stack")

    ```


    Even without an implementation, we can create an object of type `ListStack`. The
    `Stack` class is abstract because we didn’t add any slots to it, but the `ListStack`
    is not interpreted as abstract, even though it doesn’t add any slots either because
    it `contains` a superclass. If we were to call `pop` on a `ListStack`, however,
    we would get an error, and rightly so. We would expect to get an error here, and
    in this case it probably isn’t hard to figure out, from the error message, what
    is wrong. The error would tell us that R was unable to find an inherited method
    for the function. But if either `Stack` implemented a version of `pop`, or we
    had set a default function, we would instead be calling that, which would be an
    error but might not invoke an error message.


    We can specify that all sub-classes of `Stack` must implement the stack interface
    using the function `requireMethods` :


    ```

    requireMethods(functions = c("top", "pop", "push", "is_empty"),

    signature = "Stack")

    ```


    By doing this we ensure that calling any of these methods on `ListStack` will
    give us an error message.


    ```

    pop(stack)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## numeric(0)

    ```


    It is not much of a safety check for the correct implementation of an interface,
    and I usually don’t see much use for it, but it is there if you want it.


    ## Constructors


    You can provide values for slots when you create objects by providing them as
    named arguments, but you can also get more control over object initialization
    through the method `initialize`. This method works as a constructor, except that
    it doesn’t create an object; it is just responsible for setting attributes to
    leave it in a consistent state. If you define this function, it replaces the default
    constructor, and you are in charge of which arguments the constructor should take,
    how it should set slots, and whether it should call the constructor of its superclass.


    A very simple example, where we have one superclass and one subclass, is shown
    below:


    ```

    A <- setClass("A", slots = list(x = "numeric", y = "numeric"))

    B <- setClass("B", contains = "A", slots = list(z = "numeric"))

    setMethod("initialize", signature = "A",

    definition = function(.Object, x, y) {

    print("A initialize")

    .Object@x <- x

    .Object@y <- y

    .Object

    })

    ## [1] "initialize"

    setMethod("initialize", signature = "B",

    definition = function(.Object, z) {

    .Object <- callNextMethod(.Object, x = z, y = z)

    .Object@z <- z

    .Object

    })

    ## [1] "initialize"

    (a <- A(x = 1:3, y = 4:6))

    ## [1] "A initialize"

    ## An object of class "A"

    ## Slot "x":

    ## [1] 1 2 3

    ##

    ## Slot "y":

    ## [1] 4 5 6

    (b <- B(z = 6:9))

    ## [1] "A initialize"

    ## An object of class "B"

    ## Slot "z":

    ## [1] 6 7 8 9

    ##

    ## Slot "x":

    ## [1] 6 7 8 9

    ##

    ## Slot "y":

    ## [1] 6 7 8 9

    ```'
  trans: '

    # 泛型函数与类继承体系


    为了解 S4 如何处理类继承和泛型函数，我们回到之前的 `A`、`B`、`C` 示例。我们可以这样构建类以及三个对象：


    ```

    A <- setClass("A", contains = "NULL")

    B <- setClass("B", contains = "A")

    C <- setClass("C", contains = "B")

    x <- A()

    y <- B()

    z <- C()

    ```


    这里我让 `A` 继承自伪类 `"NULL"`，使其非抽象，这样即使它没有任何槽位也能实例化。


    我们可以定义一个泛型函数 `f`，并仅为类 `A` 实现它，如下所示：


    ```

    setGeneric("f", def = function(x) standardGeneric("f"))

    setMethod("f", signature = "A",

    definition = function(x) print("A::f"))

    ```


    如果这样做，那么当我们对所有三个对象调用它时，都会调用这个版本。


    ```

    f(x)

    ## [1] "A::f"

    f(y)

    ## [1] "A::f"

    f(z)

    ## [1] "A::f"

    ```


    如果我们定义另一个函数 `g`，并为 `A` 和 `B` 都实现它，那么对 `x` 调用它将调用 `A` 版本。对 `y` 和 `z` 调用它则会调用 `B`
    版本，因为这是针对这两个类的最特化函数形式。


    ```

    setGeneric("g", def = function(x) standardGeneric("g"))

    setMethod("g", signature = "A",

    definition = function(x) print("A::g"))

    setMethod("g", signature = "B",

    definition = function(x) print("B::g"))

    g(x)

    ## [1] "A::g"

    g(y)

    ## [1] "B::g"

    g(z)

    ## [1] "B::g"

    ```


    如果我们定义一个为所有三个类都实现的函数，那么对 `x`、`y` 和 `z` 调用它时，在三种情况下都会调用最特化的版本。


    ```

    setGeneric("h", def = function(x) standardGeneric("h"))

    setMethod("h", signature = "A",

    definition = function(x) print("A::h"))

    setMethod("h", signature = "B",

    definition = function(x) print("B::h"))

    setMethod("h", signature = "C",

    definition = function(x) print("C::h"))

    h(x)

    ## [1] "A::h"

    h(y)

    ## [1] "B::h"

    h(z)

    ## [1] "C::h"

    ```


    在 S4 中，与 `NextMethod` 对应的函数是 `callNextMethod`，其工作方式非常相似。


    ```

    setMethod("h", signature = "A",

    definition = function(x) {

    print("A::h")

    })

    setMethod("h", signature = "B",

    definition = function(x) {

    print("B::h")

    callNextMethod()

    })

    setMethod("h", signature = "C",

    definition = function(x) {

    print("C::h")

    callNextMethod()

    })

    h(x)

    ## [1] "A::h"

    h(y)

    ## [1] "B::h"

    ## [1] "A::h"

    h(z)

    ## [1] "C::h"

    ## [1] "B::h"

    ## [1] "A::h"

    ```


    方法本身没有 `.default` 版本，但我们可以使用 `setGeneric` 函数来创建一个。如果我们定义一个普通函数，并仅通过其名称调用 `setGeneric`，那么当我们没有更特化的版本时，该函数将成为默认调用的函数。


    ```

    d <- function(x) print("default::d")

    setGeneric("d")

    d(x)

    ## [1] "default::d"

    d(y)

    ## [1] "default::d"

    d(z)

    ## [1] "default::d"

    ```


    当然，当我们在特化时使用 `callNextMethod`，这也同样有效。


    ```

    setMethod("d", signature = "A",

    definition = function(x) {

    print("A::d")

    callNextMethod()

    })

    setMethod("d", signature = "B",

    definition = function(x) {

    print("B::d")

    callNextMethod()

    })

    setMethod("d", signature = "C",

    definition = function(x) {

    print("C::d")

    callNextMethod()

    })

    d(x)

    ## [1] "A::d"

    ## [1] "default::d"

    d(y)

    ## [1] "B::d"

    ## [1] "A::d"

    ## [1] "default::d"

    d(z)

    ## [1] "C::d"

    ## [1] "B::d"

    ## [1] "A::d"

    ## [1] "default::d"

    ```


    ## 要求实现方法


    我们之前定义的抽象类 `Stack` 没什么实际用途。它是一个没有关联数据或函数的抽象类。堆栈接口中的所有函数都在 `VectorStack` 中实现了，我们并没有从继承
    `Stack` 中得到任何好处。然而，在 S4 中，我们可以将诸如堆栈之类的接口形式化，并确保接口的实现确实实现了接口中的所有函数。


    这并不算多。R 中的类型检查很少，你从 S4 那里也得不到太多帮助，但至少有一种方法可以在调用尚未实现的泛型函数时让错误消息更具信息性。


    让我们实现一个不起作用的堆栈。我们可以为基于列表的堆栈创建这个类。它继承自 `Stack`，但不添加任何槽位或功能。


    ```

    ListStack <- setClass("ListStack", contains = "Stack")

    ```


    即使没有实现，我们也可以创建一个 `ListStack` 类型的对象。`Stack` 类是抽象的，因为我们没有向它添加任何槽位，但 `ListStack`
    并不被解释为抽象的，即使它也没有添加任何槽位，因为它 `contains` 一个超类。然而，如果我们对 `ListStack` 调用 `pop`，我们会得到一个错误，这确实是应该的。我们期望在这里得到一个错误，并且在这种情况下，从错误消息中很可能不难找出问题所在。错误会告诉我们
    R 无法找到该函数的继承方法。但如果 `Stack` 实现了 `pop` 的某个版本，或者我们设置了默认函数，那么我们会转而调用那个版本，这本身会是一个错误，但可能不会触发错误消息。


    我们可以使用函数 `requireMethods` 来指定 `Stack` 的所有子类必须实现堆栈接口：


    ```

    requireMethods(functions = c("top", "pop", "push", "is_empty"),

    signature = "Stack")

    ```


    通过这样做，我们确保对 `ListStack` 调用这些方法中的任何一个都会给我们一条错误消息。


    ```

    pop(stack)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## numeric(0)

    ```


    这对于接口的正确实现来说，算不上什么安全检查，我通常也觉得它没什么用，但如果你需要，它就在那里。


    ## 构造函数


    当你创建对象时，可以通过提供具名参数来为槽位提供值，但你也可以通过 `initialize` 方法对对象初始化获得更多控制。这个方法起到构造函数的作用，只是它不创建对象；它只负责设置属性，使对象保持一致的状态。如果你定义了这个函数，它会替换默认构造函数，并且由你来控制构造函数应该接受哪些参数、如何设置槽位，以及是否应该调用其超类的构造函数。


    下面是一个非常简单的例子，其中我们有一个超类和一个子类：


    ```

    A <- setClass("A", slots = list(x = "numeric", y = "numeric"))

    B <- setClass("B", contains = "A", slots = list(z = "numeric"))

    setMethod("initialize", signature = "A",

    definition = function(.Object, x, y) {

    print("A initialize")

    .Object@x <- x

    .Object@y <- y

    .Object

    })

    ## [1] "initialize"

    setMethod("initialize", signature = "B",

    definition = function(.Object, z) {

    .Object <- callNextMethod(.Object, x = z, y = z)

    .Object@z <- z

    .Object

    })

    ## [1] "initialize"

    (a <- A(x = 1:3, y = 4:6))

    ## [1] "A initialize"

    ## An object of class "A"

    ## Slot "x":

    ## [1] 1 2 3

    ##

    ## Slot "y":

    ## [1] 4 5 6

    (b <- B(z = 6:9))

    ## [1] "A initialize"

    ## An object of class "B"

    ## Slot "z":

    ## [1] 6 7 8 9

    ##

    ## Slot "x":

    ## [1] 6 7 8 9

    ##

    ## Slot "y":

    ## [1] 6 7 8 9

    ```

    '
- fmt: '# Dispatching on Type-Signatures


    The signatures we have used so far when defining specialized methods consisted
    of just a class name. If we use them this way, S4 methods work just as S3 generic
    functions, but the dispatch mechanism for S4 methods is more general than this
    and it is possible to dispatch based on the type of all a function’s arguments.


    For example, we can define a function `f` of two arguments and refine it in different
    ways based on the type of the two arguments. We could have, say, one version when
    the arguments are numeric and another when they are logical.


    ```

    setGeneric("f", def = function(x, y) standardGeneric("f"))

    setMethod("f", signature = c("numeric", "numeric"),

    definition = function(x, y) x + y)

    setMethod("f", signature = c("logical", "logical"),

    definition = function(x, y) x & y)

    ```


    When calling `f`, the appropriate function is then selected based on the type
    of the arguments.


    ```

    f(2, 3)

    ## [1] 5

    f(TRUE, FALSE)

    ## [1] FALSE

    ```


    The type matching goes from most specific to most abstract, following class hierarchies
    for classes, and would match integer over numeric over complex for numerical values.
    So, if we define a version of `f` that matches integers for the first value, it
    will call that one when we give it an integer and the version defined above when
    we call it with `numeric` values.


    ```

    setMethod("f", signature = c("integer", "complex"),

    definition = function(x, y) x - y)

    f(2, 2)

    ## [1] 4

    f(as.integer(2), 2)

    ## [1] 4

    ```


    Here, the second argument would catch any complex number, but we can specialize
    it to match integers and numeric instead:


    ```

    setMethod("f", signature = c("integer", "numeric"),

    definition = function(x, y) 2*x + y)

    f(as.integer(2), 2)

    ## [1] 6

    ```


    If we just give the signature a single string, as we did in the cases with classes
    earlier, it just dispatches on the type of the first argument.


    ```

    setMethod("f", signature = "character",

    definition = function(x, y) x)

    f("foo", "bar")

    ## [1] "foo"

    ```


    In general, the signature list just matches types for a prefix of parameters if
    you do not provide types for all of them.


    ```

    setGeneric("g", def = function(x, y, z) standardGeneric("g"))

    setMethod("g", signature = "character",

    definition = function(x, y, z) "g(character)")

    setMethod("g", signature = c("numeric", "character"),

    definition = function(x, y, z) "g(numeric, character)")

    g("foo", NA, NA)

    ## [1] "g(character)"

    g(12, "bar", NA)

    ## [1] "g(numeric, character)"

    ```


    If you want to match any type whatsoever, you can use the type `"ANY"`.


    ```

    setMethod("f", signature = "ANY",

    definition = function(x, y) "any")

    f(list(), NULL)

    ## [1] "any"

    ```


    This can be used to define a catch-all default implementation for when no more
    specific implementation matches the arguments.


    You can even match for cases when some arguments are not provided, using the type
    `"missing"`.


    ```

    setMethod("f", signature = c("ANY", "missing"),

    definition = function(x, y) "missing")

    f(list(), NULL)

    ## [1] "any"

    f(list())

    ## [1] "missing"

    ```


    Here, the first call matches the version that takes any arguments because the
    second argument is not missing, it is just `NULL`, while the other matches the
    more specific signature where the second argument is missing.


    # Operator Overloading


    S4 also supports operator overloading and in much the same way as S3 does, just
    using the method mechanism for generic methods. We can try implementing the modulus
    class as an S4 class like this:


    ```

    modulus <- setClass("modulus",

    slots = c(

    value = "numeric",

    n = "numeric"

    ))

    setMethod("show", signature = "modulus",

    definition = function(object) {

    cat("Modulus", object@n, "values:\n")

    print(object@value)

    })

    (x <- modulus(value = 1:6, n = 3))

    ## Modulus 3 values:

    ## [1] 1 2 3 4 5 6

    ```


    The `show` method we implemented here is the S4 equivalent of `print` and we use
    it to pretty-print `modulus` objects.


    If we then want to implement a single operator, we can specialize the method for
    it, just as we did with generic functions for S3. But we can use the signature
    type matching to capture different combinations of arguments, instead of writing
    type-checking code at the beginning of the generic function as we had to for S3.


    Below we handle the three cases we want for modulus arithmetic: the case where
    both operands are `modulus` objects and the two cases where one of them is a `modulus`
    object and the other is `numeric`.


    ```

    setMethod("+", signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = e1@value + e2@value,

    n = e1@n)

    })

    setMethod("+", signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = e1@value + e2,

    n = e1@n)

    })

    setMethod("+", signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = e1 + e2@value,

    n = e2@n)

    })

    ```


    Now we can combine `numeric` and `modulus` in addition, and we didn’t have to
    explicitly check the type in the functions since the type dispatch handled that
    for us.


    ```

    x + 1:6

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    1:6 + x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    We also handle the case with two `modulus` objects and check that their `n` slots
    are equal.


    ```

    y <- modulus(value = 1:6, n = 2)

    x + y

    ## Error in x + y: Incompatible modulus

    y <- modulus(value = 1:6, n = 3)

    x + y

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    We also have function group solutions in S4, and for defining arithmetic operations,
    we need the group `Arith`. This works much as the `Ops` generic function in S3
    except that we, again, can use type matching instead of explicitly checking the
    type of the arguments inside the function(s).


    ```

    setMethod("Arith",

    signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = callGeneric(e1@value, e2@value),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1@value, e2),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1, e2@value),

    n = e2@n)

    })

    x * y

    ## Modulus 3 values:

    ## [1]  1  4  9 16 25 36

    2 * x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```'
  raw: '## Dispatching on Type-Signatures


    The signatures we have used so far when defining specialized methods consisted
    of just a class name. If we use them this way, S4 methods work just as S3 generic
    functions, but the dispatch mechanism for S4 methods is more general than this
    and it is possible to dispatch based on the type of all a function’s arguments.


    For example, we can define a function `f` of two arguments and refine it in different
    ways based on the type of the two arguments. We could have, say, one version when
    the arguments are numeric and another when they are logical.


    ```

    setGeneric("f", def = function(x, y) standardGeneric("f"))

    setMethod("f", signature = c("numeric", "numeric"),

    definition = function(x, y) x + y)

    setMethod("f", signature = c("logical", "logical"),

    definition = function(x, y) x & y)

    ```


    When calling `f`, the appropriate function is then selected based on the type
    of the arguments.


    ```

    f(2, 3)

    ## [1] 5

    f(TRUE, FALSE)

    ## [1] FALSE

    ```


    The type matching goes from most specific to most abstract, following class hierarchies
    for classes, and would match integer over numeric over complex for numerical values.
    So, if we define a version of `f` that matches integers for the first value, it
    will call that one when we give it an integer and the version defined above when
    we call it with `numeric` values.


    ```

    setMethod("f", signature = c("integer", "complex"),

    definition = function(x, y) x - y)

    f(2, 2)

    ## [1] 4

    f(as.integer(2), 2)

    ## [1] 4

    ```


    Here, the second argument would catch any complex number, but we can specialize
    it to match integers and numeric instead:


    ```

    setMethod("f", signature = c("integer", "numeric"),

    definition = function(x, y) 2*x + y)

    f(as.integer(2), 2)

    ## [1] 6

    ```


    If we just give the signature a single string, as we did in the cases with classes
    earlier, it just dispatches on the type of the first argument.


    ```

    setMethod("f", signature = "character",

    definition = function(x, y) x)

    f("foo", "bar")

    ## [1] "foo"

    ```


    In general, the signature list just matches types for a prefix of parameters if
    you do not provide types for all of them.


    ```

    setGeneric("g", def = function(x, y, z) standardGeneric("g"))

    setMethod("g", signature = "character",

    definition = function(x, y, z) "g(character)")

    setMethod("g", signature = c("numeric", "character"),

    definition = function(x, y, z) "g(numeric, character)")

    g("foo", NA, NA)

    ## [1] "g(character)"

    g(12, "bar", NA)

    ## [1] "g(numeric, character)"

    ```


    If you want to match any type whatsoever, you can use the type `"ANY"`.


    ```

    setMethod("f", signature = "ANY",

    definition = function(x, y) "any")

    f(list(), NULL)

    ## [1] "any"

    ```


    This can be used to define a catch-all default implementation for when no more
    specific implementation matches the arguments.


    You can even match for cases when some arguments are not provided, using the type
    `"missing"`.


    ```

    setMethod("f", signature = c("ANY", "missing"),

    definition = function(x, y) "missing")

    f(list(), NULL)

    ## [1] "any"

    f(list())

    ## [1] "missing"

    ```


    Here, the first call matches the version that takes any arguments because the
    second argument is not missing, it is just `NULL`, while the other matches the
    more specific signature where the second argument is missing.


    ## Operator Overloading


    S4 also supports operator overloading and in much the same way as S3 does, just
    using the method mechanism for generic methods. We can try implementing the modulus
    class as an S4 class like this:


    ```

    modulus <- setClass("modulus",

    slots = c(

    value = "numeric",

    n = "numeric"

    ))

    setMethod("show", signature = "modulus",

    definition = function(object) {

    cat("Modulus", object@n, "values:\n")

    print(object@value)

    })

    (x <- modulus(value = 1:6, n = 3))

    ## Modulus 3 values:

    ## [1] 1 2 3 4 5 6

    ```


    The `show` method we implemented here is the S4 equivalent of `print` and we use
    it to pretty-print `modulus` objects.


    If we then want to implement a single operator, we can specialize the method for
    it, just as we did with generic functions for S3\. But we can use the signature
    type matching to capture different combinations of arguments, instead of writing
    type-checking code at the beginning of the generic function as we had to for S3.


    Below we handle the three cases we want for modulus arithmetic: the case where
    both operands are `modulus` objects and the two cases where one of them is a `modulus`
    object and the other is `numeric`.


    ```

    setMethod("+", signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = e1@value + e2@value,

    n = e1@n)

    })

    setMethod("+", signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = e1@value + e2,

    n = e1@n)

    })

    setMethod("+", signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = e1 + e2@value,

    n = e2@n)

    })

    ```


    Now we can combine `numeric` and `modulus` in addition, and we didn’t have to
    explicitly check the type in the functions since the type dispatch handled that
    for us.


    ```

    x + 1:6

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    1:6 + x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    We also handle the case with two `modulus` objects and check that their `n` slots
    are equal.


    ```

    y <- modulus(value = 1:6, n = 2)

    x + y

    ## Error in x + y: Incompatible modulus

    y <- modulus(value = 1:6, n = 3)

    x + y

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    We also have function group solutions in S4, and for defining arithmetic operations,
    we need the group `Arith`. This works much as the `Ops` generic function in S3
    except that we, again, can use type matching instead of explicitly checking the
    type of the arguments inside the function(s).


    ```

    setMethod("Arith",

    signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = callGeneric(e1@value, e2@value),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1@value, e2),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1, e2@value),

    n = e2@n)

    })

    x * y

    ## Modulus 3 values:

    ## [1]  1  4  9 16 25 36

    2 * x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```'
  trans: '

    # 基于类型签名的方法分派


    到目前为止，我们在定义特定方法时所使用的签名只包含一个类名。如果我们这样使用，S4 方法的工作方式与 S3 泛型函数类似，但 S4 的分派机制比这更通用，它可以根据函数所有参数的类型进行分派。


    例如，我们可以定义一个包含两个参数的函数 `f`，并根据这两个参数的类型以不同的方式对其进行细化。比如，我们可以有一个参数为数值型时的版本，以及另一个参数为逻辑型时的版本。


    ```

    setGeneric("f", def = function(x, y) standardGeneric("f"))

    setMethod("f", signature = c("numeric", "numeric"),

    definition = function(x, y) x + y)

    setMethod("f", signature = c("logical", "logical"),

    definition = function(x, y) x & y)

    ```


    当调用 `f` 时，会根据参数的类型选择相应的函数。


    ```

    f(2, 3)

    ## [1] 5

    f(TRUE, FALSE)

    ## [1] FALSE

    ```


    类型匹配遵循类的继承层级，从最具体到最抽象。对于数值，它会优先匹配整型，然后才是数值型和复数型。因此，如果我们为 `f` 定义一个匹配第一个参数为整型的版本，那么当传入整型参数时，会调用这个版本；而当传入`numeric`类型的值时，则会调用上面定义的版本。


    ```

    setMethod("f", signature = c("integer", "complex"),

    definition = function(x, y) x - y)

    f(2, 2)

    ## [1] 4

    f(as.integer(2), 2)

    ## [1] 4

    ```


    这里，第二个参数可以匹配任何复数类型，但我们可以将其特化，以匹配整型和数值型：


    ```

    setMethod("f", signature = c("integer", "numeric"),

    definition = function(x, y) 2*x + y)

    f(as.integer(2), 2)

    ## [1] 6

    ```


    如果我们只为签名提供一个字符串（就像之前处理类时那样），它只会根据第一个参数的类型进行分派。


    ```

    setMethod("f", signature = "character",

    definition = function(x, y) x)

    f("foo", "bar")

    ## [1] "foo"

    ```


    通常，如果你没有为所有参数提供类型，签名列表只会匹配函数参数列表前缀部分的类型。


    ```

    setGeneric("g", def = function(x, y, z) standardGeneric("g"))

    setMethod("g", signature = "character",

    definition = function(x, y, z) "g(character)")

    setMethod("g", signature = c("numeric", "character"),

    definition = function(x, y, z) "g(numeric, character)")

    g("foo", NA, NA)

    ## [1] "g(character)"

    g(12, "bar", NA)

    ## [1] "g(numeric, character)"

    ```


    如果你想匹配任意类型，可以使用 `"ANY"` 类型。


    ```

    setMethod("f", signature = "ANY",

    definition = function(x, y) "any")

    f(list(), NULL)

    ## [1] "any"

    ```


    这可以用来定义一个通用的默认实现，当没有更具体的实现能匹配参数时，就会调用它。


    你甚至可以使用 `"missing"` 类型来匹配某些参数未提供的情况。


    ```

    setMethod("f", signature = c("ANY", "missing"),

    definition = function(x, y) "missing")

    f(list(), NULL)

    ## [1] "any"

    f(list())

    ## [1] "missing"

    ```


    在这里，第一个调用匹配了接受任意参数的版本，因为第二个参数并非缺失，它只是 `NULL`；而另一个调用则匹配了更具体的签名，即第二个参数是缺失的情况。


    # 运算符重载


    S4 也支持运算符重载，方式与 S3 非常相似，只是使用了针对泛型方法的方法机制。我们可以像这样尝试将模数类实现为一个 S4 类：


    ```

    modulus <- setClass("modulus",

    slots = c(

    value = "numeric",

    n = "numeric"

    ))

    setMethod("show", signature = "modulus",

    definition = function(object) {

    cat("Modulus", object@n, "values:\n")

    print(object@value)

    })

    (x <- modulus(value = 1:6, n = 3))

    ## Modulus 3 values:

    ## [1] 1 2 3 4 5 6

    ```


    我们在这里实现的 `show` 方法是 `print` 的 S4 等价物，用于美化打印 `modulus` 对象。


    如果我们接着想要实现单个运算符，可以像为 S3 定义泛型函数那样，特化该运算符对应的方法。但我们可以使用签名类型匹配来捕获不同的参数组合，而不必像在 S3
    中那样，在泛型函数开头编写类型检查代码。


    下面我们处理了模数运算所需的三种情况：两个操作数都是 `modulus` 对象，以及一个操作数是 `modulus` 对象而另一个是 `numeric` 的两种情况。


    ```

    setMethod("+", signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = e1@value + e2@value,

    n = e1@n)

    })

    setMethod("+", signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = e1@value + e2,

    n = e1@n)

    })

    setMethod("+", signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = e1 + e2@value,

    n = e2@n)

    })

    ```


    现在，我们可以将 `numeric` 和 `modulus` 进行加法运算了，而且由于类型分派已经为我们处理了类型检查，我们无需在函数内部显式检查类型。


    ```

    x + 1:6

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    1:6 + x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    我们还处理了两个 `modulus` 对象相加的情况，并检查它们的 `n` 槽位是否相等。


    ```

    y <- modulus(value = 1:6, n = 2)

    x + y

    ## Error in x + y: Incompatible modulus

    y <- modulus(value = 1:6, n = 3)

    x + y

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    S4 也支持函数组解决方案。要定义算术运算，我们需要使用 `Arith` 函数组。它的工作方式与 S3 中的 `Ops` 泛型函数非常相似，区别在于，我们再次可以使用类型匹配，而无需在函数内部显式检查参数类型。


    ```

    setMethod("Arith",

    signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = callGeneric(e1@value, e2@value),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1@value, e2),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1, e2@value),

    n = e2@n)

    })

    x * y

    ## Modulus 3 values:

    ## [1]  1  4  9 16 25 36

    2 * x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```

    '
- fmt: '# Combining S3 and S4 Classes


    You can, to a limited degree, combine S3 and S4. The two systems are different
    and trying to write software that connects S3 and S4 class-hierarchies intimately
    is not something I will recommend. It only leads to weeping and gnashing of teeth.
    But if you have existing S3 code and you want to write an extension in S4 you
    can do this.


    Let’s say we have an S3 class, `X`, with generic functions `foo` and `bar`.


    ```

    X <- function(x) {

    structure(list(x = x), class = "X")

    }

    foo <- function(x) UseMethod("foo")

    bar <- function(x) UseMethod("bar")

    foo.X <- function(x) "foo"

    bar.X <- function(x) x$x

    x <- X(5)

    foo(x)

    ## [1] "foo"

    bar(x)

    ## [1] 5

    ```


    If we want to write a subclass of `X`, let’s call it `Y`, and we want to write
    `Y` in S4, we cannot use `X` in the `contains` option to `setClass`. Well, you
    can, but if you try to instantiate objects of the class you will get an error.
    The S4 system doesn’t know about any class called `X` so we first have to make
    it aware of it. We can do that using the function `setOldClass`.


    ```

    setOldClass("X")

    ```


    This does two things: it lets S4 know about the class so we can inherit from it,
    and it makes any generic function defined for the class into functions we can
    specialize with `setMethod`. So after calling `setOldClass` we can make a sub-class
    of `A` as an S4 class.


    ```

    Y <- setClass("Y", contains = "X")

    ```


    Calling `foo` or `bar` on an object of type `Y` will also work with the dynamic
    dispatch system and will invoke `foo.Y` since there is no better matching `foo.Y`.


    ```

    y <- Y()

    foo(y)

    ## [1] "foo"

    ```


    If we want to, we could make a specialized version of `foo` for `Y` objects by
    implementing `foo.Y`.


    ```

    foo.Y <- function(x) "Y::foo"

    foo(y)

    ## [1] "Y::foo"

    ```


    Of course, this would be the S3 of refining generic functions, and since we are
    working with an S4 class now it is better to use `setMethod`.


    Similar to `foo`, calling `bar` invokes `bar.X`. In this case it results in an
    error because, even though S4 knows about the `X` class, it doesn’t know about
    the constructor function or the representation of `X` objects it creates.


    ```

    bar(y)

    ## Error in x$x: $ operator not defined for this S4 class

    ```


    There is no formal definition of constructors or object representations in S3,
    only informal coding conventions, so no way for S4 to know about what the `bar`
    function expects to be able to get out of an `X` object. There is a limit to how
    well we can integrate S3 and S4 automatically, and some coding is needed to get
    the functionality of the S3 version to also match the S4 class.


    ```

    Y <- setClass("Y", contains = "X", slots = c(x = "ANY"))

    setMethod("bar", signature = "Y",

    definition = function(x) x@x)

    y <- Y(x = 13)

    bar(y)

    ## [1] 13

    ```


    I don’t recommend mixing S3 and S4. If you have code written using the S3 system
    you are probably better off sticking with S3 rather than trying to combine the
    two systems, but if you are writing code using S4 and need to include a little
    functionality from S3 classes, this is the way to do it.


    # R6 Classes


    The last object system we will look at is the R6 system. This system is very unlike
    S3 and S4, and unusual for R in general, since it introduces mutable data. Data
    is usually immutable in R, and anything resembling object modification is really
    implemented by copying data and constructing new objects. The only things you
    can modify in R are environments; you cannot modify data. The R6 system, however,
    uses environments to give us objects we can modify. It’s unusual in R, but the
    semantics are then similar to how object-orientation is implemented in most other
    languages, where methods modify objects rather than create new objects. If you
    come to R from a different programming language, the R6 system might be more familiar
    to you, but since it introduces side effects to R, it might surprise you if you
    are more familiar with R. If you have two references to an R6 object and modify
    it through one variable, it will also change the state of the object the other
    variable is referring to. This does not happen for the other two class systems.


    The R6 system is a better implementation of this semantics than the built-in reference
    class (RC) system, also known as R5. R5 is the natural name for the next object
    system implemented in R, after the object systems S3 and S4, which are originally
    from the S language. Because R6 has the same semantics as R5 and is considered
    a better implementation of it, I will not cover R5 further.'
