  trans: '

    ## 多态性的实用价值


    多态性不仅适用于传统意义上的抽象数据结构。多态性为实现抽象数据结构提供了手段，使得算法可以基于抽象接口工作，无需了解其操作的具体实现。然而，泛型函数在许多我们通常不视为数据结构的场景中也同样实用。


    在 R 语言中，经常需要将统计模型拟合到数据上。这类模型并非真正的数据结构，但它们拥有一个抽象接口。例如，你可能拟合一个线性模型这样的具体模型，但一旦获得拟合模型，就会有许多对所有模型都通用的操作。你可能需要预测新数据的响应变量，或者获取拟合值的残差。这些操作对所有模型都是相同的——尽管不同模型实现这些操作的方式各异——因此它们都能受益于泛型机制。事实上确实如此。实现这两项操作的函数
    `predict` 和 `residuals` 都是泛型函数，每种模型都可以提供自己的实现版本。


    存在一个广泛应用于拟合模型的标准函数列表，所有这些函数都是作为泛型实现的。如果你编写的分析代码仅使用这些泛型函数来操作拟合模型，那么你可以在任何时候更换模型，并复用所有代码而无需修改。


    打印和绘图函数也是如此。`print` 和 `plot` 都是泛型函数，它们针对不同的数据类型（通常也针对不同的拟合模型）都有具体的实现。我们日常可能不太会思考这个问题，但如果没有这类泛型函数，我们就需要使用不同的函数来显示向量和矩阵等。


    在不同数据类型之间转换也是常见的操作，同样多态性非常有用（并且在 R 语言中频繁使用）。要将数据结构转换为向量，你可以使用 `as.vector` 函数——这个名字容易引起误解，因为它看起来像是泛型函数
    `as` 针对 `vector` 的特化版本，但实际上它是一个名为 `as.vector` 的泛型函数。要将因子转换为向量，被调用的是具体实现 `as.vector.factor`。


    一个需要将某些输入数据转换为向量的算法，可以使用 `as.vector` 函数。这样，只要该数据类型实现了 `as.vector` 函数，算法就不必关心实际数据是以何种形式实现的。


    ## 多态性与算法编程


    多态性作为算法设计，特别是算法实现的一个组成部分，在课程和教科书中并不常被提及，但它对于编写可复用软件至关重要。你可能不会将 R 语言视为实现算法的语言，但每当你编写数据分析流程、操作数据框或拟合模型时，都可以将其视为在实现或使用一个算法。我们希望数据分析高效，因此希望算法高效，同时也希望编写可以多次使用的代码以避免重复。这意味着我们需要编写能够处理不同数据的代码，而这通常涉及将具体数据隐藏在泛型接口之后。


    以排序函数这样简单的功能为例。对于许多排序算法，要对元素排序，你需要能够判断一个元素是否小于另一个元素。如果你在一个算法实现中硬编码了整数或浮点数比较，那么你只能排序这些类型的对象。一般来说，如果你硬编码了比较操作，那么每种要排序的元素类型都需要一个不同的实现。


    因此，大多数语言在其运行时库中提供了泛型排序函数，允许你指定应使用的比较功能，通常是通过向函数提供一个比较函数，或者允许你为新的数据类型指定比较函数。遗憾的是，R
    语言中的 `sort` 函数不属于这种类型——它确实允许你为新类型定义排序规则，但它要求输入为原子形式，因此你不能给它传递复杂数据类型的序列——任何超出简单数值型、布尔型或字符串型的内容。通常，你可以将数据转换为矩阵或类似结构来进行排序，但如果你实际拥有一个复杂数据列表，则无法使用它。


    不过，我们可以轻松地实现自己的函数来完成这个任务，我们可以将其命名为 `sort_list`——注意不要与内置函数 `sort.list` 混淆，后者实际上并不是对列表进行排序……

    '
- fmt: '### Sorting Lists


    A straightforward implementation of merge sort could look like this:


    ```

    merge_lists <- function(x, y) {

    if (length(x) == 0) return(y)

    if (length(y) == 0) return(x)

    if (x[[1]] < y[[1]]) {

    c(x[1], merge_lists(x[-1], y))

    } else {

    c(y[1], merge_lists(x, y[-1]))

    }

    }

    sort_list <- function(x) {

    if (length(x) <= 1) return(x)

    start <- 1

    end <- length(x)

    middle <- end %/% 2

    merge_lists(sort_list(x[start:middle]),

    sort_list(x[(middle+1):end]))

    }

    ```


    It gets the job done, but the merge function is quadratic in running time since
    it copies lists when it subscripts like `x[-1]` and `y[-1]` and when it combines
    the results in the recursive calls. We can make a slightly more complicated function
    that does the merging in linear time using an iterative approach rather than a
    recursive:


    ```

    merge_lists  length(x)) {

    result[k:n] <- y[j:length(y)]

    } else {

    result[k:n] <- x[i:length(x)]

    }

    result

    }

    ```


    We are still copying in the recursive calls of the sorting function, but we are
    not copying more than we will merge later, so the asymptotic running time is okay,
    at least.


    With this function, we can sort lists of elements where `"<"` can be used to determine
    if one element is less than another. The built-in `"<"` function, however, doesn’t
    necessarily work on your own classes.


    ```

    make_tuple  1 and only the first element will be

    ## used

    ## Warning in if (x[[i]]  1 and only the first element will be

    ## used

    ## Warning in if (x[[i]]  1 and only the first element will be

    ## used

    ## [[1]]

    ## [1] 1 1

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[2]]

    ## [1] 1 2

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[3]]

    ## [1] 2 0

    ## attr(,"class")

    ## [1] "tuple"

    ```


    There are several ways we can fix this. One option is to define a generic function
    for comparison: we could call it `less`, and then use that in the merge function.


    ```

    merge_lists  length(x)) {

    result[k:n] <- y[j:length(y)]

    } else {

    result[k:n] <- x[i:length(x)]

    }

    result

    }

    less <- function(x, y) UseMethod("less")

    less.numeric <- function(x, y) x < y

    less.tuple <- function(x, y) x[1] < y[1] || x[2] < y[2]

    sort_list(x)

    ## [[1]]

    ## [1] 1 1

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[2]]

    ## [1] 1 2

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[3]]

    ## [1] 2 0

    ## attr(,"class")

    ## [1] "tuple"

    ```


    We would need to define concrete implementations of `less` for all types we wish
    to sort, though. Alternatively, we can tell R how to handle `"<"` for our own
    types, and we will see how in a later chapter. With that approach, we will get
    sorting functionality for all objects that can be compared this way. A third possibility
    is to make `less` a parameter of the sorting function:


    ```

    merge_lists <- function(x, y, less) {

    # Same function body as before

    }

    sort_list <- function(x, less = `<`) {

    if (length(x) <= 1) return(x)

    result <- vector("list", length = length(x))

    start <- 1

    end <- length(x)

    middle <- end %/% 2

    merge_lists(sort_list(x[start:middle], less),

    sort_list(x[(middle+1):end], less),

    less)

    }

    unlist(sort_list(as.list(sample(1:5))))

    ## [1] 1 2 3 4 5

    tuple_less <- function(x, y) x[1] < y[1] || x[2] < y[2]

    sort_list(x, tuple_less)

    ## [[1]]

    ## [1] 1 1

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[2]]

    ## [1] 1 2

    ## attr(,"class")

    ## [1] "tuple"

    ##

    ## [[3]]

    ## [1] 2 0

    ## attr(,"class")

    ## [1] "tuple"

    ```


    We make the default `less` function `"<"` but can provide another for types where
    this comparison function doesn’t work.


    ### General Comments on Flexible Implementations of Algorithms


    As a general rule, you want to make your algorithm implementations adaptable by
    providing handles for polymorphism, either by providing options for certain functions
    (like we did with `less` above) or by using generic functions for abstract data
    types.


    You might be able to experiment with optimal data structures and implementation
    of operations when you implement an algorithm for a given use, but by providing
    handles for modifying your function you make the code more reusable. Even in cases
    where the algorithm will perform correctly for different applications, you might
    still want to provide flexibility; the performance of algorithms often depends
    on the usage. In an asymptotic analysis we generally prefer implementations that
    have theoretical better running times, but in practice, we want the fastest code,
    and that is not necessarily the asymptotically fastest algorithms. We hide away
    constants when we use "big-O" analysis, but those constants matter, so you want
    users of your implementations to be able to replace data structures and operations
    used in your algorithm implementations.


    Figuring out how to best provide this flexibility in your implementations often
    requires some experimentation. For abstract data structures, generic functions
    are usually the best approach. For something like comparison in the sorting example
    above, all three solutions (generic functions, operator overloading, or providing
    a function with a good default) are probably equally good. But just as experimentation
    and some thinking are involved in designing good software interfaces, the same
    is needed in algorithmic programming.


    ## More on `UseMethod`


    The `UseMethod` function is what we use to define a generic function, and it takes
    care of finding the appropriate concrete implementation using the name lookup
    we saw earlier. There are some details about `UseMethod` I left out before, though.


    First of all, it doesn’t actually work as a function normally does. It looks like
    a function, and to a large degree it is a function, but if you treat it just as
    any other function you might get effects you didn’t expect.


    Second of all, you can pass local variables along to concrete implementations
    if you assign them before you call `UseMethod`. Let’s consider a simple case.


    ```

    foo <- function(object) UseMethod("foo")

    foo.numeric <- function(object) object

    foo(4)

    ## [1] 4

    bar <- function(object) {

    x <- 2

    UseMethod("bar")

    }

    bar.numeric <- function(object) x + object

    bar(4)

    ## [1] 6

    ```


    Here the `foo` function uses the pattern we saw earlier. It just calls `UseMethod`.
    We then define a concrete function to be called if `foo` is invoked on a number.
    Numbers have classes, and that class is `numeric`. (Technically, there is more
    to numbers than this class, but for now, we don’t need to worry about that.) Nothing
    strange is going on with `foo`.


    With `bar`, however, we assign a local variable before we invoke `UseMethod`.
    This variable, `x`, is visible when `bar.numeric` is called. With a normal function
    call, you have to take steps to get access to the calling scope, so here `UseMethod`
    does not behave like a normal function.


    In the call to `UseMethod`, it doesn’t behave like a normal function either. You
    cannot use `UseMethod` as part of an expression.


    ```

    baz <- function(object) UseMethod("baz") + 2

    baz.numeric <- function(object) object

    baz(4)

    ## [1] 4

    ```


    When `UseMethod` is invoked, the concrete function takes over completely, and
    the call to `UseMethod` never returns. In this way, it is similar to the `return`
    function. Any expression you put `UseMethod` in is not evaluated because of this,
    and any code you might put after the `UseMethod` call is never evaluated.


    The `UseMethod` function takes a second argument, besides the name of the generic
    function. This is the object that is used to dispatch the generic function on—the
    object whose type determines the concrete function that will be called—and this
    argument can be used if you do not want to dispatch based on the first argument
    of the function that calls `UseMethod`. Since dispatching on the type of the first
    function argument is such a common pattern, using another object in the call to
    `UseMethod` can cause confusion, and I recommend that you do not do this unless
    you have very good reasons for it.'
