  trans: '

    # `NextMethod`


    在定制泛型函数时，我们并不总是需要从零开始实现所有功能。有时我们可以重用更抽象类的实现，只需要稍作调整即可。我们总是可以通过函数的完整名称显式调用超类的函数，但这仅在类实际实现自己的版本时才有效。如果只是继承，这种方法就行不通了，而且每次修改类层次结构时都必须小心，以免破坏此类直接调用所依赖的假设。


    更好的解决方案是使用 `NextMethod` 函数。该函数允许您以类似于 `UseMethod` 的方式调用继承的函数，并且会使用 `class` 序列。`NextMethod`
    函数与 `UseMethod` 一样具有神奇之处。它知道您正在实现哪个泛型函数——尽管与 `UseMethod` 一样，您可以覆盖这一点——并且它将在您函数的第一个对象的
    `class` 序列中进行搜索。同样，您可以覆盖此行为，但这是一种非常常见的惯用法，您可能不应该这样做。不过，与 `UseMethod` 不同，它不会终止调用它的函数，并且您可以使用它返回的值。


    举个例子，我们可以考虑上一章末尾讨论的参考书目对象。这里我们有超类 `"publication"` 和两个子类 `"article"` 与 `"book"`，我们还有一个用于格式化引用的泛型方法
    `format`。我们可以为 publication 类编写一个 `format` 函数来格式化名称和作者列表，在方法的特化版本中，我们可以调用 `NextMethod`
    来获取此字符串，并使用子类中可用的信息来扩展它。


    ```

    format.publication <- function(publ) {

    paste(name(publ), authors(publ), sep = ", ")

    }

    format.article <- function(publ) {

    paste(NextMethod(), journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(NextMethod(), publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    当我们调用 `NextMethod` 时，R 将在 `class` 序列中搜索——从上次搜索结束的地方开始——寻找实现了我们当前正在评估的泛型函数的类。


    我们可以使用 `A`、`B` 和 `C` 类来观察这个过程的实际效果。如果我们定义全部调用 `NextMethod` 的函数，并对这三个类中的每一个类的对象进行评估，我们会看到：`A`
    对象 `x` 将评估 `A` 方法和默认函数；`B` 对象 `y` 将评估 `B` 函数，然后在默认版本之前继续评估 `A` 函数；而 `C` 对象 `z`
    将评估所有函数。


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    f.A <- function(x) {

    print("f.A")

    NextMethod()

    }

    f.B <- function(x) {

    print("f.B")

    NextMethod()

    }

    f.C <- function(x) {

    print("f.C")

    NextMethod()

    }

    f(x)

    ## [1] "f.A"

    ## [1] "f.default"

    f(y)

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    ```


    如果我们实现另一个函数，只针对类 `A` 和 `C` 实现版本而不为 `B` 实现，我们将看到 `C` 对象评估 `C` 版本然后评估 `A` 版本；由于没有
    `B` 版本，调用 `NextMethod` 时的搜索将找不到它，因此会继续搜索到 `A` 版本。


    ```

    j <- function(x) UseMethod("j")

    j.default <- function(x) print("j.default")

    j.A <- function(x) {

    print("j.A")

    NextMethod()

    }

    j.C <- function(x) {

    print("j.C")

    NextMethod()

    }

    j(x)

    ## [1] "j.A"

    ## [1] "j.default"

    j(y)

    ## [1] "j.A"

    ## [1] "j.default"

    j(z)

    ## [1] "j.C"

    ## [1] "j.A"

    ## [1] "j.default"

    ```


    所有的方法分派——这个查找泛型函数实现的技术术语——完全基于 `class` 属性中的类列表。类层次结构并没有显式表示，`class` 列表是否反映了您心目中的类层次结构设计由您自己负责。如果我们反转
    `class` 列表的顺序，R 同样可以正常工作。


    ```

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    class(z) <- rev(class(z))

    f(z)

    ## [1] "f.A"

    ## [1] "f.B"

    ## [1] "f.C"

    ## [1] "f.default"

    ```


    如果我们反转类的顺序，`UseMethod` 对第一个函数的搜索会从最抽象的类开始，然后顺着列表向下寻找，直到找到一个实现。在本例中，它会立刻找到，而对 `NextMethod`
    的调用只是像以前一样，从 `UseMethod` 或前一个 `NextMethod` 调用结束的地方继续搜索。默认函数始终是最后一个，因为一旦遍历完列表，就会调用默认函数。如果
    `A` 类是 `C` 特化的抽象类，这当然会导致错误的行为。您将调用抽象函数而非特化函数。但是，将泛型函数解析为具体类的机制并不了解类层次结构，因此它只会遍历列表进行搜索。


    这也意味着，您可以编写不同的类，它们对其他类的层次结构持有完全不同的看法。如果一个 `class` 列表是 `c("A", "B", "C")`，而另一个是
    `c("B", "C", "A")`，那么第一个列表认为 `C` 最抽象，`A` 最派生；而第二个列表认为 `A` 最抽象，`B` 最派生。R 如何查找要调用的函数的机制足够简单，但是如果您开始编写代码，使得您的类层次结构取决于您正在查看的对象，那么您就踏上了通往混乱的道路。


    ## 4. 统计模型


    老实说，在大多数日常的 R 编程中，您不会使用面向对象编程。您在 R 中进行的大多数分析都涉及数据转换，通常实现为某种数据流，这用函数式编程来捕捉最为合适。当您编写这样的流水线时，您可能会使用多态函数，但很少需要创建自己的类。然而，如果您需要实现一个新的统计模型，您通常确实希望创建一个新类。


    大量数据分析需要您推断感兴趣的参数，或者构建一个模型来预测数据的属性，但在许多情况下，您不一定需要确切知道我们是如何构建模型的，它是如何推断参数的，或者它是如何预测新值的。您可以使用
    `coefficients` 函数从拟合模型中获取推断的参数，或者使用 `predict` 函数来预测新值，并且您几乎可以将这两个函数用于任何统计模型。这是因为大多数模型都实现为类，并实现了泛型函数
    `coefficients` 和 `predict`。


    作为面向对象编程实际应用的示例，我们可以在本章中实现我们自己的模型。我们将保持其简单性，以便专注于编程方面而非统计理论，但仍然实现一些 R 内置功能中没有的东西。我们将实现一个贝叶斯线性回归的版本。

    '
- fmt: '## Bayesian Linear Regression


    The simplest form of linear regression fits a line to data points. Imagine we
    have vectors `x` and `y`, and we wish to produce coefficients `w[1]` and `w[2]`
    such that `y[i] = w[1] + w[2] x[i] + e[i]` where the `e` is a vector of errors
    that we want to make as small as possible. We typically assume that the errors
    are identically normally distributed when we consider it a statistical problem,
    and so we want to have the minimal variance of the errors. When fitting linear
    models with the `lm` function, you get the maximum likelihood values for the weights
    `w[1]` and `w[2]`, but if you wish to do Bayesian statistics you should instead
    consider this weight vector `w` as a random variable, and fit it to the data in
    `x`, while `y` means updating it from its prior distribution to its posterior
    distribution.


    A typical distribution for linear regression weights is the normal distribution.
    If we consider the weights'' multivariate normal distributed as their prior distribution,
    then their posterior distribution given the data will also be normally distributed,
    which makes the mathematics very convenient.


    We will assume that the prior distribution of `w` is a normal distribution with
    mean zero and independent components, so a diagonal covariance matrix. This means
    that, on average, we believe the line we are fitting to be flat and going through
    the plane origin, but how strongly we believe this depend on values in the covariance
    matrix. This we will parameterize with a so-called hyperparameter, `a`, that is
    the precision—one over the variance—of the weight components. The covariance matrix
    will have `1/a` on its diagonal and zeros off-diagonal.


    We can represent a distribution over weights as the mean and covariance matrix
    of a multinomial normal distribution and construct the prior distribution from
    the precision like this:


    ```

    weight_distribution <- function(mu, S) {

    structure(list(mu = mu, S = S), class = "wdist")

    }

    prior_distribution <- function(a) {

    mu = c(0, 0)

    S = diag(1/a, nrow = 2, ncol = 2)

    weight_distribution(mu, S)

    }

    ```


    We give the weights distribution a class, just to distinguish them from plain
    lists, but otherwise, there is nothing special to see here.


    If we wish to sample from this distribution, we can use the `mvrnorm` function
    from the `MASS` package.


    ```

    sample_weights <- function(n, distribution) {

    MASS::mvrnorm(n = n,

    mu = distribution$mu,

    Sigma = distribution$S)

    }

    ```


    We can try to sample some lines from the prior distribution and plot them. We
    can, of course, plot the sample `w` vectors as points in the plane, but since
    they represent lines, we will display them as such (see Figure [4-1](#A451015_1_En_4_Chapter.html#Fig1)).


    ![A451015_1_En_4_Fig1_HTML.jpg](A451015_1_En_4_Fig1_HTML.jpg)

    Figure 4-1. Samples from the prior of lines


    ```

    prior <- prior_distribution(1)

    (w <- sample_weights(5, prior))

    ##            [,1]        [,2]

    ## [1,]  0.6029080 -0.84085548

    ## [2,]  0.4721664  1.38435934

    ## [3,]  0.6353713 -1.25549186

    ## [4,]  0.2857736  0.07014277

    ## [5,] -0.1381082  1.71144087

    plot(c(-1, 1), c(-1, 1), type = ''n'',

    xlab = '''', ylab = '''')

    plot_lines <- function(w) {

    for (i in 1:nrow(w)) {

    abline(a = w[i, 1], b = w[i, 2])

    }

    }

    plot_lines(w)

    ```


    ### Updating the Distribution with Data


    When we observe data in the form of matching `X` and `y` values, we must update
    the `w` vector to reflect this, which means updating the distribution of the weights.
    I won''t derive the math (this is not a math textbook, after all), but if `mu0`
    is the prior mean and `S0` the prior covariance matrix, then the posterior mean
    and covariance matrix are computed thus:


    ```

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    ```


    You cannot execute the code as it is right here—it depends on variables we haven''t
    defined—but it is the body of the function we define shortly. It is a little bit
    of linear algebra that involves the prior distribution and the observed values.
    The parameters we haven''t seen before in these expressions are `b` and `X`. The
    former is the precision of the error terms—which we assume to know and represent
    as this hyperparameter—and the latter captures the `x` values. We cannot use `x`
    alone because we want to use two weights to represent lines. When we write `w[1]
    + w[2] * x[i]` for the estimate of `y[i]`, we can think of it as the vector product
    of `w` and `c(0,x[i])`, which is exactly what we do. We represent all `x[i]` as
    rows `c(0,x[i])` in the matrix `X`. So we estimate `y[i] = w[1] * X[i, 1] + w[2]
    * X[I, 2]` in this notation, or `y = X %*% w`.


    As a fitting function, we can write it as this:


    ```

    fit_posterior <- function(x, y, b, prior) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- matrix(c(rep(1, length(x)), x), ncol = 2)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    We can try to plot some points, fit the model to these, and then plot lines sampled
    from the posterior. These should fall around the points now, unlike the lines
    sampled from the prior. The more points we use to fit the model, the tighter that
    lines sampled from the posterior will fall around the points (see Figure [4-2](#A451015_1_En_4_Chapter.html#Fig2)).


    ![A451015_1_En_4_Fig2_HTML.jpg](A451015_1_En_4_Fig2_HTML.jpg)

    Figure 4-2. Samples of posterior lines


    ```

    x <- rnorm(20)

    y <- 0.2 + 1.3 * x + rnorm(20)

    plot(x, y)

    posterior <- fit_posterior(x, y, 1, prior)

    w <- sample_weights(5, posterior)

    plot_lines(w)

    ```


    ### Iterative Bayesian Updating


    The way we update the distribution of weights here from the prior distribution
    to the posterior doesn''t require that the prior distribution is the exact one
    we created using the variable `a`. Any distribution can be used as the prior,
    and in Bayesian statistics, it would not be unusual to update a posterior distribution
    as more and more data is added. We can start with the prior we just created and
    fit it to some data to get a posterior. Then if we get more data, we can use the
    first posterior as a prior for fitting more data and getting a new posterior that
    captures the knowledge we have gained from seeing all the data. If we have all
    the data from the get-go, there is no particular benefit to doing this, but in
    an application where data comes streaming, we can exploit this to quickly update
    our knowledge each time new data is available.


    Since this book is not about Bayesian statistics, and since we only use Bayesian
    linear regression as an example of writing a new statistical model, we will not
    explore this further here.'
