    ## Slot Prototypes

    ## Object Validity

    ## Generic Functions and Class Hierarchies

    ## Requiring Methods

    ## Constructors

    ## Dispatching on Type-Signatures

    ## Operator Overloading

    ## Combining S3 and S4 Classes


    # Chapter 7: R6 Classes


    ## Defining Classes

    ## Object Initialization

    ## Private and Public Attributes

    ## Active Bindings

    ## Inheritance

    ## References to Objects and Object Sharing

    ## Interaction with S3 and Operator Overloading


    # Chapter 8: Conclusions


    # Classes and Generic Functions


    R’s approach to object-oriented programming is through generic functions and classes.
    As mentioned in the introduction, R actually has three systems for implementing
    this, called `S3`, `S4`, and `R6`. In this chapter, I will only describe the `S3`
    system, which is the simplest of the three, but I will return to the other two
    systems in later chapters.'
