- fmt: "# Interaction with S3 and Operator Overloading\n\nWe don’t have a mechanism\
    \ for defining new operators for R6 objects, but we can use the S3 system for\
    \ this. Objects create from R6 object generators are assigned a `class` attribute,\
    \ a list of the name we give the class when creating the generator and `\"R6\"\
    `, so we can define generic function specializations for them.\n\nWe can implement\
    \ the `modulus` class in R6 like this:\n\n```\nmodulus <- R6Class(\"modulus\"\
    ,\nprivate = list(\n  value_ = c(),\n  n_ = c()\n),\npublic = list(\n  initialize\
    \ = function(value, n) {\n    private$value_ <- value\n    private$n_ <- n\n \
    \ },\n  print = function() {\n    cat(\"Modulus\", private$n_, \"values:\\n\"\
    )\n    print(private$value_)\n  }\n),\nactive = list(\n  value = function(value)\
    \ {\n    if (missing(value)) private$value_\n    else private$value_ <- value\
    \ %% private$n_\n  },\n  n = function(value) {\n    if (!missing(value)) stop(\"\
    Cannot change n\")\n    private$n_\n  }\n))\n(x <- modulus$new(value = 1:6, n\
    \ = 3))\n## Modulus 3 values:\n## [1] 1 2 3 4 5 6\n```\n\nThere are a few things\
    \ going on in this class definition. We define the attributes for holding the\
    \ data in the `private` list, define an initialization function and a print function,\
    \ and then we define two `action` attributes for accessing the data. We allow\
    \ users of the class to modify `values` but not `n` (for no good reason other\
    \ than it gives us an example of two different behaviors), and for the `values`\
    \ attribute we make sure that we modify the data before we store it in the private\
    \ `values_` variable.\n\nThe `class` attribute of objects of this class contains\
    \ this:\n\n```\nclass(x)\n## [1] \"modulus\" \"R6\"\n```\n\nThis means that we\
    \ can define arithmetic operations on the class using the S3 system like this:\n\
