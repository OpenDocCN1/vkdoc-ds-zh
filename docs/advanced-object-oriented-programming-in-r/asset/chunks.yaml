  trans: '

    # 2. 类层次结构


    多态性的含义远不止是拥有不同具体实现的抽象数据类型。在大多数面向对象的编程语言中，一个基本概念是类和类层次结构。类层次结构服务于两个概念上不同的目的：对象接口的细化和代码复用。严格来说，这两个概念在
    R 语言中都不需要类层次结构，因为 R 是动态类型的，不像 C++ 或 Java 等语言，其类层次结构与静态类型系统紧密交织。尽管如此，类层次结构提供了一个思考软件设计的框架，这非常有用，尤其是在动态类型语言中。


    我们将在接下来的两节中详细探讨这两个概念，但简而言之，接口描述了一个给定类的对象必须实现哪些（泛型）函数，而层次结构则根据这些函数，以“更抽象/更细化”的关系将接口链接起来。在上下文中，代码复用仅仅是指编写能够操作不止一类对象的函数——本质上就是我们上一章看到的多态函数类型——并将这类函数本身作为泛型函数纳入类层次结构。


    ## 接口与实现


    我们可以将一个类的接口视为我们可以应用于该类对象的操作或方法类型。在 R 中，这意味着我们可以以有意义的方式调用哪些函数，并将这些对象作为参数传递。


    如果我们从抽象数据结构的角度思考，例如上一章中的栈，它们是由其支持的操作定义的。你可以对栈进行压入（push）和弹出（pop）操作，检查它是否为空，并且可以获取顶部元素；这些函数，连同创建栈的方法，共同定义了“栈性”。至少，只要这四个函数也具备我们与栈关联的语义。


    在抽象层面，我们可以通过形式参数和语义来描述一个函数的接口。例如，我们可以将函数 `push` 与其两个形式参数——一个栈和一个元素——以及它应该返回添加了该元素到顶部的栈的语义关联起来。如果我们用形式参数和语义这两个属性来关联
    `push` 操作，我们就得到了一个可以称之为抽象函数的东西。正如我们所见，我们可以用不同的具体方式实现这样的抽象函数，但这些具体函数的调用者只需关心抽象描述就能确保功能正确性（尽管性能当然也可能是一个考量点，但此处我们并未将其与抽象函数的接口关联）。


    有了抽象函数的这个定义，我们可以说一个抽象数据类型是由一组抽象函数定义的。如果我们称一组抽象函数为一个接口，那么一个抽象数据类型就是由一个接口定义的。我们可以通过编写接口中所有抽象函数的实现来实现一个抽象数据结构。这可以称之为接口的（具体）实现或类似的说法。我们仅通过了解抽象数据类型的接口就可以推理算法和设计软件，并且如果我们有接口的不同实现可供选择，那么理论上可以使用其中任何一个。


    接口和实现等概念不仅在设计抽象数据结构时有用。对于你想在程序中操作的任何类型的数据，你都可以想出可以对该数据执行的一组有意义的操作，从而为该数据类型创建一个接口，并且你可以以不同的方式为这些操作编写函数，以创建不同的实现。


    ### 多态性与接口


    如果我们回过头来思考接口，我们可以说，如果一个类实现了构成接口的所有抽象函数，那么它就实现了一个接口。这仅仅意味着，如果我们取这个类的对象，我们就拥有了可以针对接口中每个抽象函数调用的具体函数。然而，如果没有泛型/多态函数，对于实现给定接口的每个类，我们需要知道哪个具体函数映射到哪个抽象函数。将一个接口的实现替换为另一个将需要重写使用该实现的代码。因此很自然地，我们也会要求具体函数的名称与抽象函数的名称相匹配。


    这显然直接映射到了泛型函数。如果每当我们想到抽象函数时，就将其映射到一个泛型函数——一个简单调用 `UseMethod` 的函数——而每当想到具体函数时，就想到一个泛型函数的实现——一个名称中带有句点的函数——那么我们就有了一个几乎自动的将接口和实现概念映射到代码的方式。


    由于 R 不进行任何静态类型检查，你几乎无法保证以这种方式编写的类确实实现了给定的接口。泛型函数中没有任何东西明确地将它们作为一个接口绑定在一起，因此对于你决定实现的任何类，你可以实现泛型函数的任意子集。接口和实现是设计概念，你可以非常容易地将设计映射到
    R 代码中，但 R 并不强制你的代码与设计匹配。

    '
- fmt: '### Abstract and Concrete Classes


    We often unify interfaces and implementations as just classes, at least when designing
    software. The object-oriented way to think about software is this: every piece
    of data you manipulate is an object and all objects have a class that determines
    their behavior. By “behavior,” we just mean which functions we can call on an
    object. This way of thinking makes a little more sense in languages where you
    can modify data and where objects thus have a state. Regardless, you can think
    of all data as objects with associated classes that determine what you can do
    with them.


    A class thus encapsulates both what you can do with objects—the interface you
    have for them—but also how it is done—how the interface is implemented.


    Objects have classes, and classes determine what you can do with objects, but
    classes live in hierarchies of more abstract or more derived classes. A vector-based
    implementation of a stack is a stack. It is a special kind of stack, sure, but
    it is still a stack. The general concept of what a stack is is more general than
    vector-based implementations, so the vector implementation can be thought of as
    a specialisation of a stack—that is, one that is implemented using a vector.


    We generally think about class hierarchies as part of “is-a” relationships. A
    vector implementation of a stack “is-a” stack. So is a list-based implementation.
    If you have an object of a more specialised class you should also be able to treat
    it as an object of a more abstract class. If you have a vector stack, you can
    treat it as a stack because its class is a vector stack class and that is a special
    case of the stack class.


    The closest we get to interfaces and implementations is abstract classes and concrete
    classes. An abstract class is essentially exactly an interface. It is nothing
    more than a description of what you can do with objects of this class; there is
    no implementation associated with it. Concrete classes, on the other hand, have
    implementations for all the functions you can call on objects of the given class.
    Quite often, though, classes implement some but not all the functions their interface
    describes, so the distinction is not that clean in practise.


    We often show classes and their relationships in diagrams as that shown in Figure
    [2-1](#A451015_1_En_2_Chapter.html#Fig1). Here `Stack` is shown in italics to
    indicate that it is an abstract class. Below the class name is listed the methods
    you can call on the class, and errors from one class to another indicate that
    one class is derived from another. Here we see that vector and list stacks, here
    called `VectorStack` and `ListStack` are derived from `Stack`.


    ![A451015_1_En_2_Fig1_HTML.gif](A451015_1_En_2_Fig1_HTML.gif)


    Figure 2-1. Class hierarchy for stacks


    The two concrete classes only implement the methods also listed in the abstract
    class, and because of this, we won’t always list the methods again in the derived
    classes. It is to be understood that any method implemented in a more abstract
    class will also be implemented in more derived classes.


    ## Implementing Abstract and Concrete Classes in R


    We already saw, in the previous chapter, how the attribute `class` is used to
    determine which version of a generic function is called for a given object. This
    approach for dispatching generic functions is the S3 system’s way of implementing
    classes, but in some sense only handles concrete implementations of abstract functions.
    Having a generic method `foo`


    ```

    foo <- function(object) UseMethod("foo")

    ```


    that we implement for a class `bar`


    ```

    foo.bar <- function(object) ...

    ```


    only tells R how class `bar` implements the `foo` function. If `foo` is part of
    an interface that consists of several functions, it is not explicitly stated in
    the R code.


    If we think of interfaces as a set of abstract functions, then considering these
    as part of a whole is something we only do informally in R. Since abstract classes
    are nothing more than interfaces, we can do the same for abstract classes. When
    we implemented the vector-based stack in the previous chapter, we did so by setting
    the `class` attribute of the objects we returned from the constructor function
    `empty_vector_stack` to `vector_stack` and by implementing the four functions
    we considered part of the stack interface: `push`, `pop`, `top`, and `is_empty`.
    At no point did we specify that there existed some abstract stack class and that
    `vector_stack` is a specialization of it.


    Since the class mechanism implemented this way is essentially working on a per-function
    level—we have generic functions and implementations of these that are dispatched
    based on their name—classes and their relationships can be a very messy affair
    in R. You can alleviate this by thinking about your software design in a more
    structured way than the language requires. Design your software with classes in
    mind, implement abstract classes by defining a set of generic functions—you can
    use comments to group them together and to document that these constitute an interface.
    Make sure that when you define a concrete class implementing an interface that
    you don’t forget about any of the functions in the interface. You might not implement
    them all; sometimes there are good reasons to, and sometimes you are just being
    pragmatic and not implementing something that might be difficult to achieve, but
    that you don’t need yet. Make sure that this is a conscious choice, though, and
    that you haven’t simply forgotten a function.


    You can use the function `methods` to get a list of all the methods implemented
    by a class


    ```

    methods(class = "vector_stack")

    ## [1] is_empty pop      push     top

    ## see ''?methods'' for accessing help and source code

    ```


    and check if you have everything implemented. You can also use this function to
    get a list of all classes that implement a given generic function.


    ```

    methods("top")

    ## [1] top.default      top.list_stack

    ## [3] top.vector_stack

    ## see ''?methods'' for accessing help and source code

    ```'
