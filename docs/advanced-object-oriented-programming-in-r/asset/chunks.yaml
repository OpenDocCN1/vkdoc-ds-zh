- fmt: '# 2. Class Hierarchies


    There is more to polymorphism than merely abstract data types that can have different
    concrete implementations. A fundamental concept found in most object-oriented
    programming languages is classes and class hierarchies. Class hierarchies serve
    two conceptually different purposes: refinement of object interfaces and code
    reuse. Neither concept, strictly speaking, requires class hierarchies in R, since
    R is dynamically typed, unlike programming languages such as C++ or Java where
    class hierarchies and the static type system are intertwined. Nevertheless, class
    hierarchies provide a framework for thinking about software design that is immensely
    useful, not least in dynamically typed languages.


    We will go into details of the two concepts in the two following sections, but
    in short, interfaces describe which (generic) functions objects of a given class
    must implement, and hierarchies chain together interfaces in “more-abstract/more-refined”
    relationships based on these functions. Code-reuse, in this context, refers simply
    to writing functions that can operate on more than one class of objects—essentially
    just the type of polymorphic functions we saw in the previous chapter—and fitting
    such functions into class hierarchies as generic functions themselves.


    ## Interfaces and Implementations


    We can think of the interface of a class as the kinds of operations, or methods,
    which we can apply to objects of the class. In R, this means which functions we
    can call with such objects as arguments in a meaningful way.


    If we think in terms of abstract data structures, such as the stack from the last
    chapter, these are defined by which operations they support. You can push and
    pop from a stack, check if it is empty, and you can get the top element; those
    functions, together with a way of creating a stack, define what “stack-ness” is.
    At least, as long as those four functions also have the semantics we associate
    with a stack.


    At an abstract level, we can describe the interface of a function by its formal
    arguments and its semantics. We can, for example, associate with a function push
    its two formal parameters, a stack and an element, and the semantics that it should
    return the stack but with the element added to the top. If we associate the push
    operation with these two attributes, the formal parameters and the semantics,
    we have what we could call an abstract function. As we saw, we can implement such
    abstract functions in different concrete ways, but a caller of these concrete
    functions need only worry about the abstract description to ensure correctness
    of functionality (although performance can of course also be a concern and not
    something we associated with the interface of an abstract function here).


    With this definition of abstract functions, we can say that an abstract data type
    is defined by a set of abstract functions. If we call a set of abstract functions
    an interface, then an abstract data type is defined by an interface. We can implement
    an abstract data structure by writing an implementation of all the abstract functions
    in the interface. This we might call a (concrete) implementation of the interface
    or something along those lines. We can reason about algorithms and design software
    just from knowing the interface of an abstract data type, and if we have different
    implementations of the interface to choose from, then any of them could, in theory,
    be used.


    Concepts such as interfaces and implementations are not just useful when it comes
    to abstract data structures. For any type of data you want to manipulate in a
    program, you could think up a set of meaningful operations you could do on that
    data, thus creating an interface for the type of data, and you could write functions
    for those operations in different ways to create different implementations.


    ### Polymorphism and Interfaces


    If we go back to thinking about interfaces, we can say that a class implements
    an interface if it implements all the abstract functions that make up the interface.
    This simply means that, if we take objects of this class, we have concrete functions
    we can call for each of the abstract functions in the interface. Without generic/polymorphic
    functions, however, we would need to know which concrete function maps to which
    abstract function for each class that implements a given interface. Exchanging
    one implementation of an interface with another would require a rewrite of the
    code that uses the implementation. So naturally, we would also require that the
    names of the concrete functions match the names of the abstract functions.


    This obviously maps directly to generic functions. If, whenever we think abstract
    function, we map that to a generic function—one that simply calls `UseMethod`—and
    whenever we think concrete function we think implementation of a generic function—a
    function with a period in its name—then we have an almost automatic way of mapping
    the concepts of interfaces and implementations into code.


    Since R doesn’t do any static type checking, there is very little you can do to
    guarantee that a class you write this way actually implements a given interface.
    There is nothing in generic functions that explicitly binds them together as an
    interface, so for any class you decide to implement, you can implement an arbitrary
    subset of generic functions. Interfaces and implementations are design concepts,
    and you can map the design into R code very easily, but R does not enforce that
    your code matches your design.'
