- fmt: "## Interaction with S3 and Operator Overloading\n\nWe don’t have a mechanism\
    \ for defining new operators for R6 objects, but we can use the S3 system for\
    \ this. Objects created from R6 object generators are assigned a `class` attribute—a\
    \ list containing the name we give the class when creating the generator, plus\
    \ `\"R6\"`—so we can define generic function specializations for them.\n\nWe can\
    \ implement the `modulus` class in R6 like this:\n\n```\nmodulus <- R6Class(\"\
    modulus\",\n  private = list(\n    value_ = c(),\n    n_ = c()\n  ),\n  public\
    \ = list(\n    initialize = function(value, n) {\n      private$value_ <- value\n\
    \      private$n_ <- n\n    },\n    print = function() {\n      cat(\"Modulus\"\
    , private$n_, \"values:\\n\")\n      print(private$value_)\n    }\n  ),\n  active\
    \ = list(\n    value = function(value) {\n      if (missing(value)) private$value_\n\
    \      else private$value_ <- value %% private$n_\n    },\n    n = function(value)\
    \ {\n      if (!missing(value)) stop(\"Cannot change n\")\n      private$n_\n\
    \    }\n  )\n)\n(x <- modulus$new(value = 1:6, n = 3))\n## Modulus 3 values:\n\
    ## [1] 1 2 3 4 5 6\n```\n\nThere are a few things going on in this class definition.\
    \ We define the attributes for holding the data in the `private` list, define\
    \ an initialization function and a print function, and then we define two `active`\
    \ attributes for accessing the data. We allow users of the class to modify `value`\
    \ but not `n` (for no good reason other than it gives us an example of two different\
    \ behaviors), and for the `value` attribute we make sure that we modify the data\
    \ before we store it in the private `value_` variable.\n\nThe `class` attribute\
    \ of objects of this class contains this:\n\n```\nclass(x)\n## [1] \"modulus\"\
    \ \"R6\"\n```\n\nThis means that we can define arithmetic operations on the class\
    \ using the S3 system like this:\n\n```\nOps.modulus <- function(e1, e2) {\n \
    \ nx <- ny <- NULL\n  if (inherits(e1, \"modulus\")) nx <- e1$n\n  if (inherits(e2,\
    \ \"modulus\")) ny <- e2$n\n  if (!is.null(nx) && !is.null(ny) && nx != ny)\n\
    \    stop(\"Incompatible types\")\n  n <- ifelse(!is.null(nx), nx, ny)\n  v1 <-\
    \ e1\n  v2 <- e2\n  if (inherits(e1, \"modulus\")) v1 <- e1$value\n  if (inherits(e2,\
    \ \"modulus\")) v2 <- e2$value\n  e1 <- v1 ; e2 <- v2\n  result <- NextMethod()\
    \ %% n\n  modulus$new(result, n)\n}\n```\n\nThe implementation is slightly different\
    \ from the S3 version because the data in the objects are represented differently,\
    \ but the general control flow is the same. With this definition we have modulus\
    \ arithmetic:\n\n```\nx + 1:6\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n1:6 +\
    \ x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n2 * x\n## Modulus 3 values:\n##\
    \ [1] 2 1 0 2 1 0\n```\n\nIf you make subclasses of an R6 class like `modulus`,\
    \ you will get a `class` attribute that also reflects this, so the S3 dispatch\
    \ mechanism will also work for sub-classes in the R6 system:\n\n```\nmodulus2\
    \ <- R6Class(\"modulus2\", inherit = modulus)\ny <- modulus2$new(value = 1:2,\
    \ n = 3)\nclass(y)\n## [1] \"modulus2\" \"modulus\"  \"R6\"\nx + y\n## Modulus\
    \ 3 values:\n## [1] 2 1 1 0 0 2\n```\n\nThat being said, don’t go crazy with combining\
    \ R6 and S3 either; it will only confuse the maintainers of your code (which are\
    \ likely to include yourself sometime in the future).\n\n## Conclusions\n\nThis\
    \ concludes this book on object-oriented programming in R. You now know the three\
    \ different systems for object-oriented programming in R and how to use them to\
    \ define class hierarchies and polymorphic functions.\n\nObject-oriented programming\
    \ in R, at least for the S3 and S4 system, differs from most other object-oriented\
    \ programming languages. Most languages consider objects mutable, and most object-oriented\
    \ software designs involve wiring up objects with references to each other such\
    \ that their behavior depends on the changing states of other objects. The R6\
    \ system is closer to this type of language design. Still, the S3 and S4 systems\
    \ combine two powerful programming language paradigms: functional programming\
    \ and object-oriented programming. The combination of dynamic function dispatch\
    \ based on the argument types and high-level functional programming lets you construct\
    \ flexible and extensible software.\n\nIt can be confusing with three very different\
    \ systems for object-oriented programming in the same language, and I would recommend\
    \ that you stick to one for any single project. Knowing all three, however, and\
    \ knowing the pros and cons of using them lets you pick the right tool for any\
    \ particular job. The S3 system is the simplest of the three and useful for getting\
    \ a small model up and running in short time. The more formal classes of S4 make\
    \ it easier to structure more complex frameworks, and the reference semantics\
    \ of R6 make it simpler to implement traditional mutable data structures than\
    \ you can otherwise easily do in R.\n\nGetting familiar with these systems, of\
    \ course, requires practice and you will not be an expert object-oriented programmer\
    \ just from reading this book. You know enough now, though, to get started.\n\n\
    ### Index\n* A\n    * Algorithms, implementations\n* B\n    * Bayesian linear\
