  trans: '

    # 贝叶斯线性回归


    线性回归的最简单形式是对数据点拟合一条直线。假设我们有向量 `x` 和 `y`，并且希望得到系数 `w[1]` 和 `w[2]`，使得 `y[i] = w[1]
    + w[2] x[i] + e[i]`，其中 `e` 是我们希望尽可能小的误差向量。当将其视为统计问题时，我们通常假设误差服从相同的正态分布，因此我们希望误差的方差最小。使用
    `lm` 函数拟合线性模型时，你会得到权重 `w[1]` 和 `w[2]` 的最大似然值，但如果你希望进行贝叶斯统计，则应将此权重向量 `w` 视为一个随机变量，并根据
    `x` 中的数据对其进行拟合，而 `y` 则意味着将其从先验分布更新为后验分布。


    线性回归权重的一个典型分布是正态分布。如果我们认为权重的多元正态分布是先验分布，那么给定数据后它们的后验分布也将是正态分布，这使得数学计算非常方便。


    我们将假设 `w` 的先验分布是均值为零且分量独立的正态分布，因此协方差矩阵是对角矩阵。这意味着，平均而言，我们认为要拟合的直线是平坦的并通过平面原点，但我们对此信念的强弱取决于协方差矩阵中的值。我们将用一个所谓的超参数
    `a` 来参数化它，该超参数是权重分量的精度（即方差的倒数）。协方差矩阵的对角线为 `1/a`，非对角线元素为零。


    我们可以将权重的分布表示为多元正态分布的均值和协方差矩阵，并像这样从精度构造先验分布：


    ```

    weight_distribution <- function(mu, S) {

    structure(list(mu = mu, S = S), class = "wdist")

    }

    prior_distribution <- function(a) {

    mu = c(0, 0)

    S = diag(1/a, nrow = 2, ncol = 2)

    weight_distribution(mu, S)

    }

    ```


    我们给权重分布指定了一个类，只是为了将其与普通列表区分开，除此之外没什么特别之处。


    如果我们希望从此分布中采样，可以使用 `MASS` 包中的 `mvrnorm` 函数。


    ```

    sample_weights <- function(n, distribution) {

    MASS::mvrnorm(n = n,

    mu = distribution$mu,

    Sigma = distribution$S)

    }

    ```


    我们可以尝试从先验分布中采样一些直线并绘制出来。当然，我们可以将采样的 `w` 向量绘制为平面上的点，但由于它们代表直线，我们将以直线形式展示它们（见图 4-1）。


    ![A451015_1_En_4_Fig1_HTML.jpg](img/A451015_1_En_4_Fig1_HTML.jpg)


    **图 4-1.** 从直线的先验分布中采样的样本


    ```

    prior <- prior_distribution(1)

    (w <- sample_weights(5, prior))

    ##            [,1]        [,2]

    ## [1,]  0.6029080 -0.84085548

    ## [2,]  0.4721664  1.38435934

    ## [3,]  0.6353713 -1.25549186

    ## [4,]  0.2857736  0.07014277

    ## [5,] -0.1381082  1.71144087

    plot(c(-1, 1), c(-1, 1), type = ''n'',

    xlab = '''', ylab = '''')

    plot_lines <- function(w) {

    for (i in 1:nrow(w)) {

    abline(a = w[i, 1], b = w[i, 2])

    }

    }

    plot_lines(w)

    ```


    当我们观察到匹配的 `X` 和 `y` 值形式的数据时，必须更新 `w` 向量以反映这一点，这意味着更新权重的分布。我不会推导数学公式（毕竟这不是一本数学教科书），但如果
    `mu0` 是先验均值，`S0` 是先验协方差矩阵，那么后验均值和协方差矩阵的计算如下：


    ```

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    ```


    你无法直接执行这里的代码——它依赖于我们尚未定义的变量——但它是我们稍后定义的函数的主体。这涉及到一些线性代数，涉及先验分布和观测值。这些表达式中我们之前未见过的参数是
    `b` 和 `X`。前者是误差项的精度——我们假设已知并用此超参数表示——后者则捕获了 `x` 值。我们不能单独使用 `x`，因为我们想用两个权重来表示直线。当我们将
    `y[i]` 的估计值写成 `w[1] + w[2] * x[i]` 时，我们可以将其视为 `w` 和 `c(0, x[i])` 的向量积，这也正是我们实际做的。我们将所有
    `x[i]` 表示为矩阵 `X` 中的行 `c(0, x[i])`。因此，在此记法中，我们估计 `y[i] = w[1] * X[i, 1] + w[2]
    * X[i, 2]`，或者 `y = X %*% w`。


    作为拟合函数，我们可以这样编写：


    ```

    fit_posterior <- function(x, y, b, prior) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- matrix(c(rep(1, length(x)), x), ncol = 2)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    我们可以尝试绘制一些点，将模型拟合到这些点，然后绘制从后验分布中采样的直线。与从先验分布采样的直线不同，这些直线现在应该落在点周围。用于拟合模型的点越多，从后验分布采样的直线落在点周围的紧密程度就越高（见图
    4-2）。


    ![A451015_1_En_4_Fig2_HTML.jpg](img/A451015_1_En_4_Fig2_HTML.jpg)


    **图 4-2.** 后验直线的样本


    ```

    x <- rnorm(20)

    y <- 0.2 + 1.3 * x + rnorm(20)

    plot(x, y)

    posterior <- fit_posterior(x, y, 1, prior)

    w <- sample_weights(5, posterior)

    plot_lines(w)

    ```


    我们在这里将权重的分布从先验分布更新为后验分布的方式，并不要求先验分布必须是我们使用变量 `a` 创建的精确分布。任何分布都可以用作先验，并且在贝叶斯统计中，随着数据不断增加而更新后验分布的情况并不少见。我们可以从刚刚创建的先验开始，将其拟合到一些数据上以获得后验分布。然后，如果我们获得更多数据，就可以将第一个后验分布作为先验来拟合更多数据，并得到一个新的后验分布，该分布捕获了我们从所有数据中获得的知识。如果我们一开始就拥有所有数据，这样做并没有特别的好处，但在数据流式传入的应用中，我们可以利用这一点，在每次新数据可用时快速更新我们的知识。


    由于本书并非关于贝叶斯统计，并且我们仅将贝叶斯线性回归作为编写新统计模型的一个示例，因此我们不再对此进行深入探讨。

    '
- fmt: '# Model Matrices


    The `X` matrix we used when fitting the posterior is an example of a so-called
    model matrix or design matrix. Using a matrix this way, fitting a response variable,
    `y`, to some expression, here `1 + x` (in a sense, we used the rows `c(1, x[i])`),
    is a general approach to fitting data. Linear models are called linear not because
    we fit data with a line, but because the weights, the `w` vector we fit, are used
    linearly, in the mathematical sense, in the fitted model. If we have fitted the
    weights to the vector `w`, the line we have fitted is given by `X %*% w`. That
    is, our line is the matrix product of the model matrix and the weight vector.
    The result is a line because `X` has the form we gave it, but it doesn’t have
    to represent a line for the model to be a linear model. We can transform the input
    data (here our vector `x`) in any way we want to before we fit the model. You
    might have used log-transformations before, or fitted data to a polynomial, and
    those would also be examples of linear models.


    You can fit various kinds of transformed data using the function we wrote above
    if you just construct the `X` matrix in different ways. As long as each data point
    you have becomes a row in `X`, it doesn’t matter what you do. The same mathematics
    work. To fit a quadratic equation to the data instead of a line, you just have
    to make the ith row of `X` be `c(1, x[i], x[i]**2)`, for example.


    In R, you have a very powerful mechanism for constructing model matrices from
    formulae. Whenever you have used a formula such as `y ∼ x + y` to fit `y` to two
    variables, `x` and `z`, you have used this feature. The formula is translated
    into a model matrix, and once you have the matrix, the code that does the model
    fitting doesn’t need to know anything else about your data.


    The function you use to translate a formula into a model matrix is called `model.matrix`.
    Even though it has a period in its name, it isn’t a generic function. It just
    has an unfortunate name for historical reasons.


    The function will take a formula as input and produce a model matrix. It will
    find the values for the variables in the formula by looking in its scope, and
    we can use it like this:


    ```

    x <- rnorm(5)

    y <- 1.2 + 2 * x + rnorm(5)

    model.matrix(y ∼ x)

    ##   (Intercept)          x

    ## 1           1 -1.1365828

    ## 2           1  0.8548304

    ## 3           1 -0.5783704

    ## 4           1  0.4963615

    ## 5           1 -0.7600579

    ## attr(,"assign")

    ## [1] 0 1

    ```


    Relying on global variables like this is risky coding, though, so we often put
    our data in a data frame instead.


    ```

    d <- data.frame(x, y)

    ```


    If we do this, we can provide a data frame to the `model.matrix` function and
    it will get the variables from there.


    ```

    model.matrix(y ∼ x, data = d)

    ##   (Intercept)          x

    ## 1           1 -1.1365828

    ## 2           1  0.8548304

    ## 3           1 -0.5783704

    ## 4           1  0.4963615

    ## 5           1 -0.7600579

    ## attr(,"assign")

    ## [1] 0 1

    ```


    If the formula uses variables that are not found in the data frame, the `model.matrix`
    will still find the missing variables in the calling scope, but this is really
    risky coding, so you should avoid this.


    The formula determines how the model matrix is constructed. The formula `y ∼ x`
    gives us the model matrix we used above, where we have 1 to capture the intercept
    in the first column, and we have the `x` values in the second column to capture
    the incline of the line. We can remove the intercept using the formula `y ∼ x
    - 1`:


    ```

    model.matrix(y ∼ x - 1, data = d)

    ##            x

    ## 1 -1.1365828

    ## 2  0.8548304

    ## 3 -0.5783704

    ## 4  0.4963615

    ## 5 -0.7600579

    ## attr(,"assign")

    ## [1] 1

    ```


    We can also add terms; for example, we can fit a quadratic formula to the data
    by constructing this model matrix:


    ```

    model.matrix(y ∼ x + I(x**2), data = d)

    ##   (Intercept)          x    I(x^2)

    ## 1           1 -1.1365828 1.2918205

    ## 2           1  0.8548304 0.7307351

    ## 3           1 -0.5783704 0.3345123

    ## 4           1  0.4963615 0.2463748

    ## 5           1 -0.7600579 0.5776881

    ## attr(,"assign")

    ## [1] 0 1 2

    ```


    Here, we need to wrap the squared `x` in the function `I` to get R to use the
    actually squared values of `x`. Inside formulae, products are interpreted as interaction,
    but by wrapping `x**2` in `I`, we make it the square of the `x` values explicitly.


    The model matrix doesn’t include the response variable, `y`, so we cannot get
    that from it. Instead, we can use a related function, `model.frame`, that also
    gives us a column for the response.


    ```

    model.frame(y ∼ x + I(x**2), data = d)

    ##            y          x       I(x^2)

    ## 1 -1.4145519 -1.1365828 1.291820....

    ## 2  0.8073317  0.8548304 0.730735....

    ## 3 -0.2584431 -0.5783704 0.334512....

    ## 4  0.9203396  0.4963615 0.246374....

    ## 5 -0.5997820 -0.7600579 0.577688....

    ```


    You can then extract the response variable using the function `model.response`,
    like this:


    ```

    model.response(model.frame(y ∼ x + I(x**2), data = d))

    ##          1          2          3          4

    ## -1.4145519  0.8073317 -0.2584431  0.9203396

    ##          5

    ## -0.5997820

    ```


    With that machinery in place, we can generalize our distributions and model fitting
    to work with general formulae. We can write the prior function like this:


    ```

    prior_distribution <- function(formula, a, data) {

    n <- ncol(model.matrix(formula, data = data))

    mu <- rep(0, n)

    S <- diag(1/a, nrow = n, ncol = n)

    weight_distribution(mu, S)

    }

    ```


    Ideally, a prior shouldn’t depend on any data, but the form of a model matrix
    does depend on the type of the data we use. Numerical data will be represented
    as a single column in the model matrix, but factors are handled as a binary vector
    for each level in a formula, so we do need to know what kind of data we are going
    to need. We could have added `n` as a parameter here and made the function independent
    of any data, but I chose to include a data frame as another solution. We don’t
    use the actual data, though; we just use it to get the number of columns in the
    model frame.


    The function for fitting the data changes less, though. It just uses the `model.matrix`
    function to construct the model matrix instead of the explicit construction we
    did earlier.


    ```

    fit_posterior <- function(formula, b, prior, data) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- model.matrix(formula, data = data)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    With that in place, we can fit a line as before, but now using a formula.


    ```

    d <- {

    x <- rnorm(5)

    y <- 1.2 + 2 * x + rnorm(5)

    data.frame(x = x, y = y)

    }

    prior <- prior_distribution(y ∼ x, 1, d)

    posterior <- fit_posterior(y ∼ x, 1, prior, d)

    posterior

    ## $mu

    ##                  [,1]

    ## (Intercept) 1.1979166

    ## x           0.2875647

    ##

    ## $S

    ##             (Intercept)           x

    ## (Intercept)  0.16935519 -0.04441203

    ## x           -0.04441203  0.73364645

    ##

    ## attr(,"class")

    ## [1] "wdist"

    ```


    If we, instead, want to fit a quadratic function, we do not need to change any
    of the functions, we can just provide a different formula.


    ```

    prior <- prior_distribution(y ∼ x + I(x**2), 1, d)

    posterior <- fit_posterior(y ∼ x + I(x**2), 1, prior, d)

    posterior

    ## $mu

    ##                  [,1]

    ## (Intercept) 1.1906733

    ## x           0.2815418

    ## I(x^2)      0.1185518

    ##

    ## $S

    ##             (Intercept)           x      I(x^2)

    ## (Intercept)  0.17301554 -0.04136841 -0.05990922

    ## x           -0.04136841  0.73617725 -0.04981521

    ## I(x^2)      -0.05990922 -0.04981521  0.98053972

    ##

    ## attr(,"class")

    ## [1] "wdist"

    ```'
