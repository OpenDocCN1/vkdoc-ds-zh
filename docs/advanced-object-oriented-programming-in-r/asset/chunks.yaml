    \ named `initialize` in the `private` list.\n\nTo initialize `VectorStack` objects\
    \ with a sequence of elements we can implement its `initialize` function like\
    \ this:\n\n```\nVectorStack <- R6Class(\"VectorStack\",\nprivate = list(elements\
    \ = NULL),\npublic = list(\ninitialize = function(elements = NULL) {\nprivate$elements\
    \ <- elements\n},\n# ... rest of the methods\n))\n```\n\nWith this initialization\
    \ function we can now construct objects with `elements` initialized.\n\n```\n\
    (stack <- VectorStack$new(elements = 1:4))\n## Stack elements:\n## [1] 1 2 3 4\n\
    ```"
