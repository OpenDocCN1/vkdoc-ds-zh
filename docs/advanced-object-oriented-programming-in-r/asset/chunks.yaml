- fmt: 'Most books I have read on object-oriented programming, and the classes I have
    taken on object-oriented programming, have centered on object-oriented modeling
    and software design. There, the focus is on how object-orientation can be used
    to structure how you think about your software and how the software can reflect
    physical or conceptual aspects of the world that you try to model in your software.
    If, for instance, you implement software for dealing with accounting, you would
    model accounts as objects with operations for inserting and withdrawing money.
    You would try to, as much as possible, map concepts from the problem domain to
    software as directly as possible. This is a powerful approach to designing your
    software, but there are always aspects of software that do not readily fit into
    such modeling, especially when it comes to algorithmic programming and design
    of data structures. Search trees and sorting algorithms, for instance, are usually
    not reflecting anything concrete in a problem domain.


    Object-oriented programming, however, is also a very powerful tool to use when
    designing algorithms and data structures. The way I was taught programming, algorithms
    and data structures were covered in separate classes from those in which I was
    taught object-orientation. Combining object-orientation and algorithmic programming
    were something I had to teach myself by writing software. I think this was a pity
    since the two really fit together well.


    In this book, I will try to cover object-orientation both as a modeling technique
    for designing software but also as a tool for developing reusable algorithmic
    software. Polymorphism, a cornerstone of object-oriented programming, lends itself
    readily to developing flexible algorithms and to combining different concrete
    implementations of abstract data types to tailor abstract algorithms to concrete
    problems. A main use of R is machine learning and data science where efficient
    and flexible algorithms are more important than modeling a problem domain, so
    much of the book will focus on those aspects of object-oriented programming.


    To read this book, you need to know the fundamentals of R programming: how to
    manipulate data and how to write functions. We will not see particularly complex
    R programming, so you do not need a fundamental knowledge of how to do functional
    programming in R, but should you want to learn how, I suggest reading the first
    book in this series which is about exactly that. You should be able to follow
    the book without having read it, though.


