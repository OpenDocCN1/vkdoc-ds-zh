    ### 分组运算符


    使用泛型函数，我们可以为用户定义的类型定义所有相关的运算符，但也可以在一个函数 `Ops` 中处理所有运算符。此函数被称为“分组泛型方法”，因为它处理一组泛型函数；其他分组方法包括
    `Math`、`Complex` 和 `Summary`，这些我们在此不作讨论。


    如果我们定义函数 `Ops.modulus`，它将为所有 `modulus` 对象上未定义运算符函数的情况被调用。也就是说，如果我们像上面那样定义了 ``
    `+.modulus` ``，那么该函数将优先于 `Ops.modulus` 被调用；否则，如果一个或两个操作数的类型是 `modulus`，那么 `Ops.modulus`
    将被调用。


    我们可以这样定义它：


    ```

    Ops.modulus <- function(e1, e2) {

    nx <- attr(e1, "modulus")

    ny <- attr(e2, "modulus")

    if (!is.null(nx) && !is.null(ny) && nx != ny)

    stop("Incompatible types")

    n <- ifelse(!is.null(nx), nx, ny)

    result <- unclass(NextMethod()) %% n

    modulus(result, n)

    }

    ```


    函数开头对输入值的测试与 `` `+.modulus` `` 中的相同。测试之后，我们使用 `NextMethod` 来调用基于底层类型的操作。这会从操作数中剥离
    `modulus` 类，并计算我们当前正在处理的任何操作。我们对结果进行 `unclass` 处理，这是必要的，因为结果将继承 `Ops` 操作数的属性，所以如果我们不这样做，结果将具有
    `modulus` 类，然后我们计算模数 `n`。如果我们不进行 `unclass` 处理，这将导致递归调用，但由于我们确实移除了类，我们只在底层类型中计算模数。最后，我们为结果创建一个
    `modulus` 对象。


    定义了这个函数后，我们就能一次性获得所有二元运算符。


    ```

    y <- modulus(rev(1:6), 3)

    x - y

    ## Modulus 3 values:

    ## [1] 1 0 2 1 0 2

    x * y

    ## Modulus 3 values:

    ## [1] 0 1 0 0 1 0

    ```


    这也包括比较运算符：


    ```

    x == y

    ## Modulus 3 values:

    ## [1] 0 1 0 0 1 0

    x == x

    ## Modulus 3 values:

    ## [1] 1 1 1 1 1 1

    x != y

    ## Modulus 3 values:

    ## [1] 1 0 1 1 0 1

    x != x

    ## Modulus 3 values:

    ## [1] 0 0 0 0 0 0

    ```


    它甚至包括一元运算符。但是，如果我们使用一元负号，函数调用中的参数 `e2` 将会缺失，目前我们没有正确处理这种情况。


    ```

    - x

    ## Error in Ops.modulus(x): argument "e2" is missing, with no default

    ```


    不过，我们可以通过检查 `e2` 是否缺失来轻松修复这个问题。除此之外，函数将按原样工作。


    ```

    Ops.modulus <- function(e1, e2) {

    nx <- attr(e1, "modulus")

    ny <- if (!missing(e2)) attr(e2, "modulus") else NULL

    if (!is.null(nx) && !is.null(ny) && nx != ny)

    stop("Incompatible types")

    n <- ifelse(!is.null(nx), nx, ny)

    result <- unclass(NextMethod()) %% n

    modulus(result, n)

    }

    - x

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    ```


    ## 单位示例


    作为一个稍微复杂一些的示例，我们定义一个类，用于将物理单位与数值关联起来。这将允许我们检查所操作的单位是否兼容——这样我们就不会从秒中减去米等等——并且会将单位分析作为算术操作的一部分。这个示例是
    `units` 包的一个简化版本。`units` 包还处理单位转换和单位简化。这里我们只实现简单的符号单位算术以及一个简单的单位相等性检查。


    其思想是拥有物理单位的表示，然后将这些单位与数值关联起来。这里的物理单位指的是像平方公里、米每秒等单位。通常，这些将是符号表达式，但我们只考虑稍简单一些的情况，即单位是物理常数的分数。在这种情况下，我们可以将这些单位表示为分子的项列表和分母的项列表。如果我们始终保持这些列表有序，我们就有了它们的规范表示，并且我们可以通过检查分子和分母列表是否相等来检查两个单位是否相等。我们可以像这样实现构造函数：


    ```

    symbolic_unit <- function(nominator, denominator = "") {

    non_empty <- function(x) x != ""

    nominator <- sort(Filter(non_empty, nominator))

    denominator <- sort(Filter(non_empty, denominator))

    structure(list(nominator = nominator,

    denominator = denominator),

    class = "symbolic_unit")

    }

    ```


    我们可以将这些单位转换为分数的字符串表示，以便美观地打印。


    ```

    as.character.symbolic_unit <- function(x, ...) {

    format_terms <- function(terms, op) {

    if (length(terms) == 0) return("1")

    paste0(terms, collapse = op)

    }

    nominator <- format_terms(x$nominator, "*")

    denominator <- format_terms(x$denominator, "/")

    paste(nominator, "/", denominator)

    }

    print.symbolic_unit <- function(x, ...) {

    cat(as.character(x, ...), "\n")

    }

    (x <- symbolic_unit("m"))

    ## m / 1

    (y <- symbolic_unit("m", "s"))

    ## m / s

    ```


    比较两个符号单位涉及检查分子和分母是否相等。


    ```

    `==.symbolic_unit` <- function(x, y) {

    if (!(inherits(x, "symbolic_unit") &&

    inherits(y, "symbolic_unit")))

    stop("Incompatible types")

    return(identical(x$nominator, y$nominator) &&

    identical(x$denominator, y$denominator))

    }

    `!=.symbolic_unit` <- function(x, y) !(x == y)

    x == y

    ## [1] FALSE

    x != y

    ## [1] TRUE

    ```


    只有当物理量具有相同单位时，才能进行加减运算；但乘除单位总是可能的。然后，通过对（符号）单位执行与对量相同的操作来获得结果单位。为了能够处理这一点，我们定义符号单位的乘法和除法。


    ```

    `*.symbolic_unit` <- function(x, y) {

    symbolic_unit(c(x$nominator, y$nominator),

    c(x$denominator, y$denominator))

    }

    `/.symbolic_unit` <- function(x, y) {

    symbolic_unit(c(x$nominator, y$denominator),

    c(x$denominator, y$nominator))

    }

    x * y

    ## m*m / s

    x / y

    ## m*s / m

    ```


    现在我们已经具备了表示单位所需的一切。我们只需要定义将单位与量关联起来的类。这个类与我们之前编写的 `modulus` 类非常相似。我们取一个（数值）值，将一个符号单位作为属性关联起来，并设置类。


    ```

    units <- function(value, nominator, denominator = "") {

    attr(value, "units") <- symbolic_unit(nominator, denominator)

    class(value) <- c("units", class(value))

    value

    }

    ```


    美观打印遵循我们在 `modulus` 中看到的模式。我们需要剥离类和属性以使用底层的打印方法（通过 `NextMethod` 调用），但仅此而已。


    ```

    print.units <- function(x, ...) {

    cat("Units: ", as.character(attr(x, "units")), "\n")

    # remove attributes to get plain numeric printing

    x <- unclass(x)

    attributes(x) <- NULL

    NextMethod()

    }

    (x <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    ```

    '
- fmt: '处理 `units` 的运算符比处理 `modulus` 稍微复杂一些。我们需要区分两种运算符：一种是要求单位必须匹配的，另一种是需要构建新单位的。前者包括加法、减法和比较运算（假设我们只认为在数量和关联单位上都一致时数值才相等）；后者包括乘法和除法，其结果单位必须由操作数计算得出。对于逻辑运算符如何处理物理量（如果这确实有意义的话）并不明显，因此对于不属于这两类的运算符，我们应该默认使用底层类型的处理方式。


    我们使用 `Ops` 组函数来实现这些运算符。在这个函数内部，我们可以通过变量 `.Generic` 获取正在被求值的实际运算符。这不是函数的参数，但在函数被调用时它会被设置为正在求值的运算符，我们可以通过在其上进行切换来检查并适当处理运算符。


    ```

    Ops.units =", ">")) {

    if (!is.null(su1) && !is.null(su2) && su1 != su2)

    stop("Incompatible units")

    su <- ifelse(!is.null(su1), su1, su2)

    return(NextMethod())

    }

    if (.Generic == "*" || .Generic == "/") {

    if (is.null(su1))

    su1 <- symbolic_unit("")

    if (is.null(su2))

    su2 <- symbolic_unit("")

    su <- switch(.Generic, "*" = su1 * su2, "/" = su1 / su2)

    result <- NextMethod()

    attr(result, "units") <- su

    return(result)

    }

    # For the remaining operators we don''t really have a good

    # way of treating the units so we strip that info and go

    # back to numeric values

    e1 <- unclass(e1)

    e2 <- unclass(e2)

    attributes(e1) <- attributes(e2) <- NULL

    NextMethod()

    }

    ```


    通过这样定义的单位运算符，我们可以将单位与标量结合起来：


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x + 2

    ## Units:  m / 1

    ## [1] 3 4 5 6 7 8

    x - 2

    ## Units:  m / 1

    ## [1] -1  0  1  2  3  4

    ```


    如果我们尝试添加两个类型不兼容的量，将会收到错误提示。


    ```

    (y <- units(1:6, "m", "s"))

    ## Units:  m / s

    ## [1] 1 2 3 4 5 6

    x + y

    ## Error in Ops.units(x, y): Incompatible units

    ```


    然而，当单位兼容时，我们可以进行加减运算。


    ```

    (z <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    x + z

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x - z

    ## Units:  m / 1

    ## [1] 0 0 0 0 0 0

    ```


    乘法和除法总是允许的，结果单位由操作数推导得出。


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x * y

    ## Units:  m*m / s

    ## [1]  1  4  9 16 25 36

    x / y

    ## Units:  m*s / m

    ## [1] 1 1 1 1 1 1

    ```


    # S4 类


    S3 类系统是面向对象编程的“狂野西部”。类的层次结构仅通过 `class` 属性隐式存在，并且任何类都可以实现或不实现泛型方法，而无需检查接口和类层次结构设计是否正确实现。一切都依赖于约定，完全由程序员来确保任何类似一致性的东西。


    S3 系统因其非常易于使用和编写新类而流行。在大多数情况下，我们倾向于简单性而非复杂的设计，在这些情况下，S3 非常适合我们的需求。当我们实现一个新的统计模型时，很少需要一个复杂的类层次结构。大多数抽象数据结构只有少数关联的操作，当我们在编写它们的具体版本时，记住实现所有这些操作并不困难。然而，一旦软件达到一定的复杂程度，就需要更多的结构。我们不希望设计仅存在于编程约定中，而是希望它在代码中明确陈述。


    S4 系统提供了一个结构更严谨的面向对象系统。在这里，类和类层次结构是显式创建的；它们不仅仅是 `class` 属性中的字符串。为了获得 S4 允许的额外结构，在创建类和方法时需要多写一点代码，但总体而言，该系统的工作方式与
    S3 非常相似。如果你熟悉 S3，那么学习 S4 应该不成问题。


    ## 定义 S4 类


    在 S4 中，类是显式创建的。要创建一个新类，我们使用 `methods` 包中的 `setClass` 函数。这个函数接受参数，指定该类的对象应具有哪些属性、属性的默认值、该类如何融入类层次结构，以及所创建类的许多其他属性。所有这些属性都有默认值，因此我们可以仅通过指定其名称来创建一个新类。


    作为一个例子，我们考虑之前在 S3 中实现的栈数据结构。要创建一个抽象栈类，我们可以这样写：


    ```

    library(methods)

    Stack <- setClass("Stack")

    ```


    这将创建一个名为 `"Stack"` 的新类。我们没有指定类的任何属性，因此 S4 会假设它是一个不应被实例化的抽象类，如果我们尝试实例化，将会出错。


    我们可以像这样创建基于向量的栈类：


    ```

    VectorStack <- setClass("VectorStack",

    slots = c(

    elements = "vector"

    ),

    contains = "Stack")

    ```


    这里我们向 `setClass` 传入了两个参数：`slots` 和 `contains`。`slots` 参数是该类对象应具有的属性列表。这里指定它应包含一个名为
    `elements` 的向量。`contains` 参数指定新类应具有哪些超类。我们将 `VectorStack` 设为 `Stack` 的子类。


    由于 `VectorStack` 具有槽，它不被视为抽象类（我们可以通过向 `contains` 参数添加 `"VIRTUAL"` 来显式使其成为抽象类，但我们确实希望能够实例化它）。我们可以通过调用
    `VectorStack` 来创建该类的对象。


    ```

    (vs <- VectorStack())

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## logical(0)

    ```


    我们可以将 `elements` 作为命名参数传给 `VectorStack`。


    ```

    (vs <- VectorStack(elements = 1:4))

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```


    位置参数在这里不起作用；必须是命名参数。


    一旦我们有了一个 `VectorStack` 类的对象，我们可以使用以下符号访问元素：


    ```

    vs@elements

    ## [1] 1 2 3 4

    ```


    通常，`@` 用于访问 S4 对象的槽。


    捕获 `setClass` 的结果并将其用作构造对象的函数是我创建 S4 构造函数的首选方式，但严格来说，这并非必需。一旦使用 `setClass` 构建了一个类，你就可以直接使用类名和
    `new` 函数来创建对象。


    ```

    new("VectorStack", elements = 1:4)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```'
  raw: 'Handling operators for `units` is only slightly more involved than it was
    for `modulus`. We need to distinguish between operators where we require that
    the units match and those where we need to construct new units. The former of
    those are addition, subtraction, and comparisons, assuming we only want to consider
    numbers equal if they agree in both quantity and associated units; the latter
    are multiplication and division where the resulting units must be computed from
    the operands. It is not obvious how to handle logical operators on physical quantities,
    if that is something that even makes sense, so for operators that do not fall
    into these two categories, we should just default to what the underlying type
    does.


    We implement the operators using the `Ops` group function. Inside this function,
    we can get hold of the actual operator being evaluated using the variable `.Generic`.
    This is not a parameter of the function, but it will be set to the operator being
    evaluated when the function is called, and we can check the operator and handle
    it appropriately by switching on it.


    ```

    Ops.units =", ">")) {

    if (!is.null(su1) && !is.null(su2) && su1 != su2)

    stop("Incompatible units")

    su <- ifelse(!is.null(su1), su1, su2)

    return(NextMethod())

    }

    if (.Generic == "*" || .Generic == "/") {

    if (is.null(su1))

    su1 <- symbolic_unit("")

    if (is.null(su2))

    su2 <- symbolic_unit("")

    su <- switch(.Generic, "*" = su1 * su2, "/" = su1 / su2)

    result <- NextMethod()

    attr(result, "units") <- su

    return(result)

    }

    # For the remaining operators we don''t really have a good

    # way of treating the units so we strip that info and go

    # back to numeric values

    e1 <- unclass(e1)

    e2 <- unclass(e2)

    attributes(e1) <- attributes(e2) <- NULL

    NextMethod()

    }

    ```


    With this definition of the units operators we can combine units with scalars:


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x + 2

    ## Units:  m / 1

    ## [1] 3 4 5 6 7 8

    x - 2

    ## Units:  m / 1

    ## [1] -1  0  1  2  3  4

    ```


    If we attempt to add two quantities with incompatible types we will be warned
    that this is incorrect.


    ```

    (y <- units(1:6, "m", "s"))

    ## Units:  m / s

    ## [1] 1 2 3 4 5 6

    x + y

    ## Error in Ops.units(x, y): Incompatible units

    ```


    When the units are compatible, though, we can add and subtract.


    ```

    (z <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    x + z

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x - z

    ## Units:  m / 1

    ## [1] 0 0 0 0 0 0

    ```


    Multiplication and division are always permissible and the resulting units are
    derived from the operands.


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x * y

    ## Units:  m*m / s

    ## [1]  1  4  9 16 25 36

    x / y

    ## Units:  m*s / m

    ## [1] 1 1 1 1 1 1

    ```


    # 6. S4 Classes


    The S3 class system is the wild west of object-oriented programming. Class hierarchies
    only exist implicitly through the `class` attributes, and generic methods can
    be implemented or not by any class whatsoever, with no check that interfaces and
    class hierarchy designs are implemented correctly. Everything depends on conventions
    and it is entirely up to the programmer to ensure anything resembling consistency.


    The S3 system is popular because it is very easy to use and to write new classes.
    In most cases, we would prefer simplicity over elaborate design, and in those
    cases, S3 is perfect for our needs. When we implement a new statistical model,
    we rarely need a complex class hierarchy. Most abstract data structures have only
    a few associated operations, and we have no problem remembering to implement them
    all when we write concrete versions of them. Once software reaches a certain level
    of complexity, however, more structure is needed. Rather than having the design
    exist only implicitly in programming conventions we want it explicitly stated
    in the code.


    The S4 system provides a more structured object-oriented system. Here classes
    and class hierarchies are explicitly created; they are not merely strings in a
    `class` attribute. To obtain the added structure that S4 allows, a little more
    code is needed when creating classes and methods, but overall the system works
    very similar to S3\. If you are comfortable with S3, then, learning S4 should
    not pose a problem.


    ## Defining S4 Classes


    In S4, classes are explicitly created. To create a new class, we use the function
    `setClass` from the `methods` package. This function takes arguments that specify
    which attributes the objects of the class should hold, what default values the
    attributes should have, how the class fits into a class hierarchy, and many other
    properties of the created class. All these properties have default values so we
    can create a new class just by specifying its name.


    As an example, we consider the stack data structure we implemented in S3 earlier.
    To make an abstract stack class we can write:


    ```

    library(methods)

    Stack <- setClass("Stack")

    ```


    This creates a new class called `"Stack"`. We have not specified any attributes
    of the class, so S4 will assume that it is an abstract class that is not supposed
    to be instantiated and we will get an error if we try.


    We can create the vector-based stack class like this:


    ```

    VectorStack <- setClass("VectorStack",

    slots = c(

    elements = "vector"

    ),

    contains = "Stack")

    ```


    Here we use two arguments to `setClass`: `slots` and `contains`. The `slots` argument
    is a list of attributes that objects of the class should have. Here specify that
    it should contain a vector called `elements`. The `contains` argument specifies
    which superclasses the new class should have. We make `VectorStack` a subclass
    of `Stack`.


    Since `VectorStack` has slots, it is not considered an abstract class (we can
    explicitly make it so by adding `"VIRTUAL"` to the `contains` argument, but we
    do want to be able to instantiate it). We can create objects of the class by calling
    `VectorStack`.


    ```

    (vs <- VectorStack())

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## logical(0)

    ```


    We can specify the `elements` as a named argument to `VectorStack`.


    ```

    (vs <- VectorStack(elements = 1:4))

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```


    Positional arguments will not work here; it has to be a named argument.


    Once we have an object of class `VectorStack` we can access the elements with
    this notation:


    ```

    vs@elements

    ## [1] 1 2 3 4

    ```


    In general, `@` is used to access slots of S4 objects.


    Capturing the result of `setClass` and using it as a function to construct objects
    is my preferred way of creating S4 constructors, but strictly speaking, it isn’t
    necessary. Once a class is built with `setClass` you can create objects just using
    the name of the class, using the function `new`.


    ```

    new("VectorStack", elements = 1:4)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```'
