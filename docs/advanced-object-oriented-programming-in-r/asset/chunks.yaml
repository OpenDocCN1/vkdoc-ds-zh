  trans: '

    # 接口设计


    不仅通用函数具有多态性。任何仅通过通用函数操作数据的函数同样具有多态性。我们使用栈实现的逆转函数将空栈作为参数，而这个空栈决定了我们实际使用哪个栈的实现。在该函数中，我们没有在任何地方引用任何具体实现的细节。如果相反，我们在这个函数内部创建了一个空栈，那么，尽管在其他地方只通过通用函数的接口访问实现，该函数也将被绑定到单一实现上。


    为了最大程度地发挥多态性的优势，你需要尽可能地设计你的函数使其具备多态性。这需要做到两点：

    1.  除非确实必要，否则不要引用具体实现。

    2.  任何需要引用具体类型实现细节的时候，都通过通用函数来实现。


    逆转函数具有多态性，因为它没有引用任何具体实现。选择使用哪个具体的栈是由参数决定的，并且它对特定栈实现执行的所有操作都通过通用函数进行。


    在编程时，很容易一时冲动违反这些规则。使用参数来决定算法中使用的数据结构并不是那么困难，但如果你编写的算法使用了多个不同的数据结构，你可能不希望将所有不同的具体实现都作为参数。然而，你真的应该这样做。如果你不想记住所有需要该算法的具体数据结构位置，只需编写一个封装该算法并提供实现的函数即可。这样你就可以两全其美。


    更多时候，你可能会想要访问具体实现的细节。例如，假设你想弹出元素，直到看到某个特定元素为止，但前提是该元素在栈上。如果我们习惯于处理栈的向量实现，那么很自然地会写出这样的函数：


    ```

    pop_until %

    push(1) %>%

    push(2) %>%

    push(3) %T>% print

    ## [1] 3 2 1

    ## attr(,"class")

    ## [1] "vector_stack"

    pop_until(vector_stack, 1)

    ## [1] 1

    ## attr(,"class")

    ## [1] "vector_stack"

    pop_until(vector_stack, 5)

    ## [1] 3 2 1

    ## attr(,"class")

    ## [1] "vector_stack"

    ```


    这里我们使用 `%in%` 函数来测试元素是否在栈上（我们使用 `magrittr` 管道操作符为测试创建了一个栈）。只要栈是向量栈，这工作得很好，但如果栈是以链表形式实现的，它将无法工作。你不会得到错误信息；`%in%`
    测试将总是返回 `FALSE`，所以如果你更换了栈的实现，你会得到一个错误的代码，甚至不会告诉你它没有正常工作。


    依赖实现细节是破坏多态对象接口所能做的最糟糕的事情。你不仅将自己绑定到单一实现，而且还将自己绑定到该具体数据的确切实现方式。如果该实现发生变化，使用它的算法就会崩溃。所以现在你既不能改变实现，又必须在实现改变时修改使用它的算法。如果运气好，如果破坏了接口你可能会收到错误信息，但就像我们刚刚看到的情况（如果你不相信我，可以自己试试），你可能连这个都得不到。该函数将总是返回原始的栈，即使你想要弹出的元素就在栈上。


    ```

    list_stack %

    push(1) %>%

    push(2) %>%

    push(3)

    pop_until(list_stack, 1)

    ```


    如果你编写一个操作多态对象的算法，尽可能坚持使用其已有的接口。对于 `pop_until` 函数，我们可以很容易地仅使用栈接口来实现它。


    ```

    pop_until <- function(stack, element) {

    s <- stack

    while (!is_empty(s) && top(s) != element) s <- pop(s)

    if (is_empty(s)) stack else s

    }

    ```


    如果使用该接口无法实现你的需求，你应该对其进行扩展。你总是可以编写适用于某个类的新通用函数。


    ```

    contains <- function(stack, element) {

    UseMethod("contains")

    }

    contains.default <- function(stack, element) {

    .NotYetImplemented()

    }

    contains.vector_stack <- function(stack, element) {

    element %in% stack

    }

    ```


    你不需要为抽象数据类型的所有实现都添加具体函数来实现一个通用函数。如果你有一个返回错误的默认实现——并且对你使用的任何代码都有适当的单元测试——那么如果你的算法尝试使用尚未实现的函数，你会收到错误，并且你可以在那时添加它。


    如果抽象数据类型来自另一个包，添加新的通用函数不如一开始就使用原始接口理想。如果那个包中的实现在后续发生变化，你的新通用函数可能会崩溃——并且可能是静默崩溃。尽管如此，结合适当的单元测试，这仍然比简单地在其他函数中访问详细实现要好得多。


    ## 设计最小化且功能强大的接口


    设计接口是一门艺术。当你创建自己的抽象类型时，你需要仔细考虑该类型应该具备哪些操作。你不想拥有太多操作。这会让实现该类型其他版本的人感到困难；他们需要实现所有操作，并且根据这些操作是什么，这可能涉及大量工作。另一方面，你不能有太少的操作，因为那样使用该类型的算法将经常不得不破坏接口来获取实现细节，这会破坏这些算法的多态性。


    算法课程中学到的抽象数据类型是*最小化且功能强大*的接口的绝佳例子。它们定义了完成有用工作所需的最少数量的操作，同时仍然使具体的栈、队列、字典等的实现成为可能，且工作量最小。


    在设计你自己的类型时，努力实现同样类型的最小化接口。

    '
- fmt: '## The Usefulness of Polymorphism


    Polymorphism isn’t only useful for what we would traditionally call abstract data
    structures. Polymorphism gives you the means to implement abstract data structures,
    so algorithms work on the abstract interface and never need to know which concrete
    implementation they are operating on, but generic functions are useful for many
    cases that we do not traditionally think of as data structures.


    In R, you often fit statistical models to data. Such models are not really data
    structures, but there is an abstract interface to them. You fit a concrete model,
    for example, a linear model, but once you have a fitted model, there are many
    common operations that are useful for all models. You might want to predict response
    variables for new data, or you might want to get the residuals of your fitted
    values. These operations are the same for all models—although how different models
    implement the operations will be different—and so they can benefit from being
    generic. Indeed, they are. The functions `predict` and `residuals`, which implement
    those two operations, are generic functions, and each model can implement its
    own version of them.


    There is an extensive list of standard functions that are frequently used on fitted
    models, and all of these are implemented as generics. If you write analysis code
    that operates on fitted models using only those generic functions, you can change
    the model at any time and reuse all the code without modifying it.


    The same goes for printing and plotting functions. Both `print` and `plot` are
    generic functions, and they have concrete implementations for different data types
    (and usually also for different fitted models). It is not something we think much
    about from day to day, but if we didn’t have generic functions like these, we
    would need to use different functions for displaying vectors and for displaying
    matrices, for example.


    Converting between different data types is also a frequent operation, and again
    polymorphism is highly useful (and frequently used in R). To translate a data
    structure into a vector, you use the `as.vector` function—an unfortunate name
    since it looks like a generic function `as` with a specialization for `vector`,
    but actually is a generic function named `as.vector`. To translate a factor into
    a vector, it is the concrete implementation `as.vector.factor` that gets called.


    An algorithm that needs to translate some input data into a vector can use the
    `as.vector` function and then doesn’t have to worry about what the actual data
    is implemented as, as long as the data type has an implementation of the `as.vector`
    function.


    ## Polymorphism and Algorithmic Programming


    Polymorphism as a component of designing algorithms, and especially implementing
    algorithms, is not often covered in classes and textbooks but can be an important
    aspect of writing reusable software. You might not think of R as a language where
    you implement algorithms, but whenever you write a data analysis pipeline, whenever
    you manipulate data frames, and whenever you fit a model, you can think of that
    as implementing or using an algorithm. We want our data analysis to be efficient,
    so we want our algorithms to be efficient, but we also want to write code that
    can be used more than once so we don’t have to repeat ourselves. This means that
    we need to write code that can be used with different data and in many instances
    this involves hiding concrete data behind generic interfaces.


    Take something as simple as a sorting function. For many sorting algorithms, all
    you need to be able to do to sort elements is determine whether one element is
    smaller than another. If you hardwire in an implementation of such an algorithm
    where the comparison used is interfering or floating point comparison, then you
    can only sort objects of these types. In general, if you hardwire comparisons,
    you need a different implementation for each type of elements you want to sort.


    Because of this, most languages provide you with a generic sorting function as
    part of their runtime library where you can provide the comparison functionality
    it should use, typically either as a function provided to the function or by allowing
    you to specify a comparison function for new types. Unfortunately, the `sort`
    function in R is not of this kind—it does allow you to define sorting for new
    types, but it wants its input to be in atomic form, so you cannot give it sequences
    of complex data types—anything beyond simple numerical, boolean, or string types.
    Usually, you can change your data to a matrix or something similar and sort it
    this way, but if you actually have a list of complex data, you cannot use it.


    We can easily implement our own function for doing this, however, and we can call
    it `sort_list`—not to be confused with the built-in function `sort.list` that
    actually does something other than sort lists…'
