  trans: '

    # 模型矩阵


    我们拟合后验时使用的`X`矩阵就是所谓模型矩阵或设计矩阵的一个例子。以这种方式使用矩阵，将响应变量`y`拟合到某个表达式（此处为`1 + x`，从某种意义上说，我们使用了行`c(1,
    x[i])`）是一种通用的数据拟合方法。线性模型被称为线性，并非因为我们用一条直线拟合数据，而是因为我们拟合的权重（即`w`向量）在拟合模型中以数学意义上的线性方式被使用。如果我们将权重拟合到向量`w`，那么拟合出的直线由`X
    %*% w`给出。也就是说，我们的直线是模型矩阵与权重向量的矩阵乘积。之所以得到一条直线，是因为`X`具有我们赋予它的形式，但对于一个线性模型而言，它并不一定要代表一条直线。我们可以在拟合模型之前，以任何想要的方式转换输入数据（此处为我们的向量`x`）。你可能以前用过对数变换，或者将数据拟合到多项式，这些也都是线性模型的例子。


    如果你以不同的方式构建`X`矩阵，就可以使用我们上面编写的函数来拟合各种类型的转换后数据。只要每个数据点在`X`中成为一行，你做什么变换都没关系，数学原理是相同的。例如，要将二次方程而非直线拟合到数据，你只需让`X`的第
    i 行变为`c(1, x[i], x[i]**2)`即可。


    在 R 中，你有一个非常强大的机制，可以根据公式构建模型矩阵。每当你使用类似`y ∼ x + y`这样的公式将`y`拟合到两个变量`x`和`z`时，就使用到了这个特性。该公式会被转换为一个模型矩阵，一旦你得到了这个矩阵，执行模型拟合的代码就不需要再了解关于数据的任何其他信息。


    用于将公式转换为模型矩阵的函数叫做`model.matrix`。尽管它的名字中有一个点，但它并不是一个泛型函数。只是由于历史原因，它有一个不太合适的名字。


    该函数将公式作为输入，并生成一个模型矩阵。它会通过在其作用域中查找来获取公式中变量的值。我们可以像这样使用它：


    ```

    x <- rnorm(5)

    y <- 1.2 + 2 * x + rnorm(5)

    model.matrix(y ∼ x)

    ##   (Intercept)          x

    ## 1           1 -1.1365828

    ## 2           1  0.8548304

    ## 3           1 -0.5783704

    ## 4           1  0.4963615

    ## 5           1 -0.7600579

    ## attr(,"assign")

    ## [1] 0 1

    ```


    不过，像这样依赖全局变量是有风险的编码方式，所以我们通常会将数据放入一个数据框中。


    ```

    d <- data.frame(x, y)

    ```


    如果这样做，我们可以向`model.matrix`函数提供一个数据框，它会从其中获取变量。


    ```

    model.matrix(y ∼ x, data = d)

    ##   (Intercept)          x

    ## 1           1 -1.1365828

    ## 2           1  0.8548304

    ## 3           1 -0.5783704

    ## 4           1  0.4963615

    ## 5           1 -0.7600579

    ## attr(,"assign")

    ## [1] 0 1

    ```


    如果公式中使用了的变量在数据框中未找到，`model.matrix`仍然会在调用作用域中查找缺失的变量，但这确实是风险极高的编码方式，因此你应该避免这样做。


    公式决定了模型矩阵的构建方式。公式`y ∼ x`给出了我们上面使用的模型矩阵，其中第一列的 1 用于捕获截距，第二列是`x`值，用于捕获直线的斜率。我们可以使用公式`y
    ∼ x - 1`来移除截距项：


    ```

    model.matrix(y ∼ x - 1, data = d)

    ##            x

    ## 1 -1.1365828

    ## 2  0.8548304

    ## 3 -0.5783704

    ## 4  0.4963615

    ## 5 -0.7600579

    ## attr(,"assign")

    ## [1] 1

    ```


    我们也可以添加项；例如，可以通过构建以下模型矩阵来将二次公式拟合到数据：


    ```

    model.matrix(y ∼ x + I(x**2), data = d)

    ##   (Intercept)          x    I(x²)

    ## 1           1 -1.1365828 1.2918205

    ## 2           1  0.8548304 0.7307351

    ## 3           1 -0.5783704 0.3345123

    ## 4           1  0.4963615 0.2463748

    ## 5           1 -0.7600579 0.5776881

    ## attr(,"assign")

    ## [1] 0 1 2

    ```


    在这里，我们需要将平方后的`x`包裹在函数`I`中，以便让 R 使用`x`实际平方后的值。在公式内部，乘积项会被解释为交互作用，但通过将`x**2`包裹在`I`中，我们明确地使其成为了`x`值的平方。


    模型矩阵不包含响应变量`y`，因此我们无法从中获取它。相反，我们可以使用一个相关的函数`model.frame`，它也会为我们提供一个响应变量的列。


    ```

    model.frame(y ∼ x + I(x**2), data = d)

    ##            y          x       I(x²)

    ## 1 -1.4145519 -1.1365828 1.291820....

    ## 2  0.8073317  0.8548304 0.730735....

    ## 3 -0.2584431 -0.5783704 0.334512....

    ## 4  0.9203396  0.4963615 0.246374....

    ## 5 -0.5997820 -0.7600579 0.577688....

    ```


    然后，你可以使用函数`model.response`提取响应变量，如下所示：


    ```

    model.response(model.frame(y ∼ x + I(x**2), data = d))

    ##          1          2          3          4

    ## -1.4145519  0.8073317 -0.2584431  0.9203396

    ##          5

    ## -0.5997820

    ```


    有了这些机制，我们可以推广我们的分布和模型拟合，使其能够处理通用的公式。我们可以像这样编写先验函数：


    ```

    prior_distribution <- function(formula, a, data) {

    n <- ncol(model.matrix(formula, data = data))

    mu <- rep(0, n)

    S <- diag(1/a, nrow = n, ncol = n)

    weight_distribution(mu, S)

    }

    ```


    理想情况下，先验不应依赖于任何数据，但模型矩阵的形式确实依赖于我们使用的数据类型。数值型数据在模型矩阵中会表示为单列，而因子在公式中则会针对每个水平处理为一个二元向量，因此我们确实需要知道将要处理的是哪种类型的数据。我们本可以将`n`作为一个参数添加进来，使函数独立于任何数据，但我选择了包含一个数据框作为另一种解决方案。不过，我们并不使用实际的数据；我们只是用它来获取模型框架中的列数。


    然而，用于拟合数据的函数变化较小。它只是使用`model.matrix`函数来构建模型矩阵，而不是像之前那样显式构建。


    ```

    fit_posterior <- function(formula, b, prior, data) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- model.matrix(formula, data = data)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    有了这些之后，我们可以像以前一样拟合一条直线，但现在使用的是公式。


    ```

    d <- {

    x <- rnorm(5)

    y <- 1.2 + 2 * x + rnorm(5)

    data.frame(x = x, y = y)

    }

    prior <- prior_distribution(y ∼ x, 1, d)

    posterior <- fit_posterior(y ∼ x, 1, prior, d)

    posterior

    ## $mu

    ##                  [,1]

    ## (Intercept) 1.1979166

    ## x           0.2875647

    ##

    ## $S

    ##             (Intercept)           x

    ## (Intercept)  0.16935519 -0.04441203

    ## x           -0.04441203  0.73364645

    ##

    ## attr(,"class")

    ## [1] "wdist"

    ```


    相反，如果我们想拟合一个二次函数，我们不需要修改任何函数，只需提供一个不同的公式即可。


    ```

    prior <- prior_distribution(y ∼ x + I(x**2), 1, d)

    posterior <- fit_posterior(y ∼ x + I(x**2), 1, prior, d)

    posterior

    ## $mu

    ##                  [,1]

    ## (Intercept) 1.1906733

    ## x           0.2815418

    ## I(x²)      0.1185518

    ##

    ## $S

    ##             (Intercept)           x      I(x²)

    ## (Intercept)  0.17301554 -0.04136841 -0.05990922

    ## x           -0.04136841  0.73617725 -0.04981521

    ## I(x²)      -0.05990922 -0.04981521  0.98053972

    ##

    ## attr(,"class")

    ## [1] "wdist"

    ```

    '
- fmt: "# Constructing Fitted Model Objects\n\nNow, we want to wrap fitted models\
    \ in a class so we can write a constructor for them. For fitted models, it is\
    \ traditional to include the formula, the data, and the function call together\
    \ with the fitted model, so we will put those as attributes in the objects. The\
    \ constructor could look like this:\n\n```\nblm <- function(formula, b, data,\
    \ prior = NULL, a = NULL) {\n  if (is.null(prior)) {\n    if (is.null(a)) stop(\"\
    Without a prior you must provide a.\")\n    prior <- prior_distribution(formula,\
    \ a, data)\n  } else {\n    if (inherits(prior, \"blm\")) {\n      prior <- prior$prior\n\
    \    }\n  }\n  if (!inherits(prior, \"wdist\")) {\n    stop(\"The provided prior\
    \ does not have the expected type.\")\n  }\n  posterior <- fit_posterior(formula,\
    \ b, prior, data)\n  structure(\n    list(formula = formula,\n         data =\
    \ model.frame(formula, data),\n         dist = posterior,\n         call = match.call()),\n\
    \    class = \"blm\"\n  )\n}\n```\n\nThe tests at the beginning of the constructor\
    \ allow us to specify the prior as either a normal distribution or a previously\
    \ fitted `blm` object. If we get a prior distribution, we probably should also\
    \ check that this prior is compatible with the actual formula, but I will let\
    \ you write such a check yourself to try that out.\n\nIf we print objects fitted\
    \ using the `blm` function, they will just be printed as a list, but we can provide\
    \ our own `print` function by specializing the `print` generic function. Here,\
    \ it is tradition to provide the function call used to specify the model, so that\
    \ is all I will do for now.\n\n```\nprint.blm <- function(x, ...) {\n  print(x$call)\n\
    }\n```\n\nWe have to match the parameters of the generic function, which is why\
    \ the arguments are `x` and `...`. All we do, however, is print the `call` attribute\
    \ of the object.\n\nNow, we can fit data and get a `blm` object like this:\n\n\
    ```\n(model <- blm(y ~ x + I(x**2), a = 1, b = 1, data = d))\n## blm(formula =\
    \ y ~ x + I(x^2), b = 1, data = d, a = 1)\n```\n\n# Coefficients and Confidence\
    \ Intervals\n\nOnce we have a fitted model, we might want to get the fitted values.\
    \ This is traditionally done using the generic function `coef`, which should simply\
    \ return those. For the Bayesian linear regression model, the fitted values are\
    \ whole distributions, but we can take the mean values as point estimates and\
    \ return those, and so implement the `coef` function like this:\n\n```\ncoef.blm\
    \ <- function(object, ...) {\n  t(object$dist$mu)\n}\ncoef(model)\n##      (Intercept)\
    \         x    I(x^2)\n## [1,]    1.190673 0.2815418 0.1185518\n```\n\nHere, I\
    \ transform the mean matrix to get the coefficients in a form similar to what\
    \ you would get with a traditional linear model, as fitted with the function `lm`,\
    \ but other than that, the function just returns the means.\n\nFor classical frequentist\
    \ models, we often also want the confidence intervals for the parameters, and\
    \ the traditional way to get those is using the `confint` function. This function\
    \ has the signature:\n\n```\nconfint(object, parm, level = 0.95, ...)\n```\n\n\
    The `object` parameter is the fitted model, and the `parm` contains the parameters\
    \ we want the confidence intervals for. If it is missing we should return all\
    \ the model parameters, and the `level` parameter specifies at which confidence\
    \ levels we want the intervals.\n\nAgain, for a Bayesian model, we have whole\
    \ distributions and not just confidence intervals, but we can get something similar\
    \ for our model by getting the quantiles from the marginal distributions for each\
    \ parameter. The parameters are normally distributed, and we can get the means\
    \ and standard deviations from the means and covariance matrix, respectively.\
    \ After that, we can get the quantiles using the `qnorm` function and construct\
    \ intervals like this:\n\n```\nconfint.blm <- function(object, parm, level = 0.95,\
    \ ...) {\n  if (missing(parm)) {\n    parm <- rownames(object$dist$mu)\n  }\n\
    \  means <- object$dist$mu[parm,]\n  sds <- sqrt(diag(object$dist$S)[parm])\n\
    \  lower_q <- qnorm(p = (1-level)/2,\n                   mean = means,\n     \
    \              sd = sds)\n  upper_q <- qnorm(p = 1 - (1-level)/2,\n          \
    \         mean = means,\n                   sd = sds)\n  quantiles <- cbind(lower_q,\
    \ upper_q)\n  quantile_names <- paste(\n    100 * c((1-level)/2, 1 - (1 -level)/2),\n\
    \    \"%\",\n    sep = \"\"\n  )\n  colnames(quantiles) <- quantile_names\n  quantiles\n\
    }\nconfint(model)\n##                   2.5%    97.5%\n## (Intercept)  0.3754236\
    \ 2.005923\n## x           -1.4001225 1.963206\n## I(x^2)      -1.8222478 2.059351\n\
    ```"
  raw: '## Constructing Fitted Model Objects


    Now, we want to wrap fitted models in a class so we can write a constructor for
    them. For fitted models, it is traditional to include the formula, the data, and
    the function call together with the fitted model, so we will put those as attributes
    in the objects. The constructor could look like this:


    ```

    blm <- function(formula, b, data, prior = NULL, a = NULL) {

    if (is.null(prior)) {

    if (is.null(a)) stop("Without a prior you must provide a.")

    prior <- prior_distribution(formula, a, data)

    } else {

    if (inherits(prior, "blm")) {

    prior <- prior$prior

    }

    }

    if (!inherits(prior, "wdist")) {

    stop("The provided prior does not have the expected type.")

    }

    posterior <- fit_posterior(formula, b, prior, data)

    structure(

    list(formula = formula,

    data = model.frame(formula, data),

    dist = posterior,

    call = match.call()),

    class = "blm"

    )

    }

    ```


    The tests at the beginning of the constructor allow us to specify the prior as
    either a normal distribution or a previously fitted `blm` object. If we get a
    prior distribution, we probably should also check that this prior is compatible
    with the actual formula , but I will let you write such a check yourself to try
    that out.


    If we print objects fitted using the `blm` function, they will just be printed
    as a list, but we can provide our own `print` function by specializing the `print`
    generic function. Here, it is tradition to provide the function call used to specify
    the model, so that is all I will do for now.


    ```

    print.blm <- function(x, ...) {

    print(x$call)

    }

    ```


    We have to match the parameters of the generic function, which is why the arguments
    are `x` and…. All we do, however, is print the `call` attribute of the object.


    Now, we can fit data and get a `blm` object like this:


    ```

    (model <- blm(y ∼ x + I(x**2), a = 1, b = 1, data = d))

    ## blm(formula = y ∼ x + I(x^2), b = 1, data = d, a = 1)

    ```


    ## Coefficients and Confidence Intervals


    Once we have a fitted model, we might want to get the fitted values. This is traditionally
    done using the generic function `coef`, which should simply return those. For
    the Bayesian linear regression model, the fitted values are whole distributions,
    but we can take the mean values as point estimates and return those, and so implement
    the `coef` function like this:


    ```

    coef.blm <- function(object, ...) {

    t(object$dist$mu)

    }

    coef(model)

    ##      (Intercept)         x    I(x^2)

    ## [1,]    1.190673 0.2815418 0.1185518

    ```


    Here, I transform the mean matrix to get the coefficients in a form similar to
    what you would get with a traditional linear model, as fitted with the function
    `lm`, but other than that, the function just returns the means.


    For classical frequentist models, we often also want the confidence intervals
    for the parameters, and the traditional way to get those is using the `confint`
    function. This function has the signature:


    ```

    confint(object, parm, level = 0.95, ...)

    ```


    The `object` parameter is the fitted model, and the `parm` contains the parameters
    we want the confidence intervals for. If it is missing we should return all the
    model parameters, and the `level` parameter specifies at which confidence levels
    we want the intervals.


    Again, for a Bayesian model, we have whole distributions and not just confidence
    intervals, but we can get something similar for our model by getting the quantiles
    from the marginal distributions for each parameter. The parameters are normally
    distributed, and we can get the means and standard deviations from the means and
    covariance matrix, respectively. After that, we can get the quantiles using the
    `qnorm` function and construct intervals like this:


    ```

    confint.blm <- function(object, parm, level = 0.95, ...) {

    if (missing(parm)) {

    parm <- rownames(object$dist$mu)

    }

    means <- object$dist$mu[parm,]

    sds <- sqrt(diag(object$dist$S)[parm])

    lower_q <- qnorm(p = (1-level)/2,

    mean = means,

    sd = sds)

    upper_q <- qnorm(p = 1 - (1-level)/2,

    mean = means,

    sd = sds)

    quantiles <- cbind(lower_q, upper_q)

    quantile_names <- paste(

    100 * c((1-level)/2, 1 - (1 -level)/2),

    "%",

    sep = ""

    )

    colnames(quantiles) <- quantile_names

    quantiles

    }

    confint(model)

    ##                   2.5%    97.5%

    ## (Intercept)  0.3754236 2.005923

    ## x           -1.4001225 1.963206

    ## I(x^2)      -1.8222478 2.059351

    ```'
  trans: "\n# 构建拟合模型对象\n\n现在，我们希望将拟合后的模型封装到一个类中，以便为其编写构造函数。对于拟合模型，传统上会将公式、数据和函数调用与拟合模型一同包含，因此我们将把这些内容作为对象的属性。构造函数可以如下所示：\n\
    \n```\nblm <- function(formula, b, data, prior = NULL, a = NULL) {\n  if (is.null(prior))\
    \ {\n    if (is.null(a)) stop(\"未提供先验时，必须提供 a 参数。\")\n    prior <- prior_distribution(formula,\
    \ a, data)\n  } else {\n    if (inherits(prior, \"blm\")) {\n      prior <- prior$prior\n\
    \    }\n  }\n  if (!inherits(prior, \"wdist\")) {\n    stop(\"提供的先验分布类型不符合预期。\"\
    )\n  }\n  posterior <- fit_posterior(formula, b, prior, data)\n  structure(\n\
    \    list(formula = formula,\n         data = model.frame(formula, data),\n  \
    \       dist = posterior,\n         call = match.call()),\n    class = \"blm\"\
    \n  )\n}\n```\n\n构造函数开头的检查允许我们将先验指定为正态分布或一个先前拟合的 `blm` 对象。如果获得一个先验分布，我们可能还应检查该先验是否与实际公式兼容，不过我会让您自行编写这样的检查来尝试一下。\n\
    \n如果打印使用 `blm` 函数拟合的对象，它们会以列表形式输出，但我们可以通过特化 `print` 泛型函数来提供自己的 `print` 函数。按惯例，这里应输出用于指定模型的函数调用，因此目前我仅实现此功能。\n\
    \n```\nprint.blm <- function(x, ...) {\n  print(x$call)\n}\n```\n\n我们必须与泛型函数的参数匹配，这就是为什么参数是\
    \ `x` 和 `...`。不过我们做的仅仅是打印对象的 `call` 属性。\n\n现在，我们可以像这样拟合数据并获取一个 `blm` 对象：\n\n```\n\
    (model <- blm(y ~ x + I(x**2), a = 1, b = 1, data = d))\n## blm(formula = y ~\
    \ x + I(x²), b = 1, data = d, a = 1)\n```\n\n# 系数与置信区间\n\n一旦有了拟合模型，我们可能希望获取拟合值。传统上，这通过泛型函数\
    \ `coef` 实现，它应直接返回这些值。对于贝叶斯线性回归模型，拟合值是完整的分布，但我们可以取均值作为点估计并返回，因此可以这样实现 `coef` 函数：\n\
    \n```\ncoef.blm <- function(object, ...) {\n  t(object$dist$mu)\n}\ncoef(model)\n\
    ##      (Intercept)         x    I(x²)\n## [1,]    1.190673 0.2815418 0.1185518\n\
    ```\n\n这里，我转置了均值矩阵，使系数的格式与传统线性模型（使用 `lm` 函数拟合）得到的格式相似，除此之外，该函数仅返回均值。\n\n对于经典的频率学派模型，我们通常还需要参数的置信区间，传统上使用\
    \ `confint` 函数获取。该函数的签名如下：\n\n```\nconfint(object, parm, level = 0.95, ...)\n\
    ```\n\n`object` 参数是拟合模型，`parm` 包含我们需要置信区间的参数。如果缺失，应返回所有模型参数，而 `level` 参数指定了置信水平。\n\
    \n同样，对于贝叶斯模型，我们拥有完整的分布而不仅仅是置信区间，但我们可以通过获取每个参数边缘分布的分位数来获得类似结果。参数服从正态分布，我们可以分别从均值和协方差矩阵中获取均值和标准差。之后，我们可以使用\
    \ `qnorm` 函数获取分位数，并像这样构建区间：\n\n```\nconfint.blm <- function(object, parm, level\
    \ = 0.95, ...) {\n  if (missing(parm)) {\n    parm <- rownames(object$dist$mu)\n\
    \  }\n  means <- object$dist$mu[parm,]\n  sds <- sqrt(diag(object$dist$S)[parm])\n\
    \  lower_q <- qnorm(p = (1-level)/2,\n                   mean = means,\n     \
    \              sd = sds)\n  upper_q <- qnorm(p = 1 - (1-level)/2,\n          \
    \         mean = means,\n                   sd = sds)\n  quantiles <- cbind(lower_q,\
    \ upper_q)\n  quantile_names <- paste(\n    100 * c((1-level)/2, 1 - (1 -level)/2),\n\
    \    \"%\",\n    sep = \"\"\n  )\n  colnames(quantiles) <- quantile_names\n  quantiles\n\
    }\nconfint(model)\n##                   2.5%    97.5%\n## (Intercept)  0.3754236\
    \ 2.005923\n## x           -1.4001225 1.963206\n## I(x²)      -1.8222478 2.059351\n\
    ```\n"
- fmt: "# Predicting Response Variables\n\nWhen it comes to predicting response variables\
    \ for new data, there is a little more work to be done for the model matrix. If\
    \ we don’t have the response variable when we create a model matrix, we will get\
    \ an error, even though the model matrix doesn’t actually contain a column with\
    \ it. We can see this if we remove the `x` and `y` variables we used when creating\
    \ the data frame earlier.\n\n```\nrm(x) ; rm(y)\n```\n\nWe are fine if we build\
    \ a model matrix from the data frame that has both `x` and `y`.\n\n```\nmodel.matrix(y\
    \ ∼ x + I(x**2), data = d)\n##   (Intercept)           x      I(x^2)\n## 1   \
    \        1 -0.20409732 0.041655716\n## 2           1 -0.22561419 0.050901761\n\
    ## 3           1  0.34702845 0.120428747\n## 4           1  0.03236784 0.001047677\n\
    ## 5           1  0.41353129 0.171008128\n## attr(,\"assign\")\n## [1] 0 1 2\n\
    ```\n\nIf we create a data frame that only has `x` values, though, we get an error.\n\
    \n```\ndd <- data.frame(x = rnorm(5))\nmodel.matrix(y ∼ x + I(x**2), data = dd)\n\
    ## Error in eval(expr, envir, enclos): object 'y' not found\n```\n\nThis, of course,\
    \ is a problem since we are interested in predicting response variables exactly\
    \ when we do not have them. This is ironic, considering that the model matrix\
    \ never actually contains the response variable; nevertheless, this is how R works.\n\
    \nTo remove the response variable from a formula, before we construct a model\
    \ matrix, we need to use the function `delete.response()`. Unfortunately, this\
    \ function does not work directly on formulae, but on so-called “terms” objects.\
    \ We can translate a formula into its terms using the `terms()` function. So to\
    \ remove the terms from a formula, we need the following construction:\n\n```\n\
    delete.response(terms(y ∼ x))\n```\n\nThe result is a `terms` object, but since\
    \ the `terms` class is a specialization of the `formula` class, we can use it\
    \ directly with the `model.matrix()` function to construct the model matrix.\n\
    \n```\nmodel.matrix(delete.response(terms(y ∼ x)), data = dd)\n##   (Intercept)\
    \           x\n## 1           1  0.49841617\n## 2           1 -1.74230249\n##\
    \ 3           1  0.97552910\n## 4           1 -0.02408287\n## 5           1  0.67568448\n\
    ## attr(,\"assign\")\n## [1] 0 1\n```\n\nNow, for actually predicting data, we\
    \ traditionally use the `predict()` generic function. This function has the following\
    \ signature:\n\n```\nfunction(object, ...)\n```\n\nWhich, quite frankly, isn’t\
    \ that useful. We can add to it, though, as the `lm` class does, so we can add\
    \ a parameter `newdata` to it. From `newdata` we will construct a model matrix\
    \ and make predictions for the data in this. If we just want point estimates for\
    \ the new data, we can simply take the inner product of the mean weights and each\
    \ row in the model matrix so we can implement the `predict()` function like this:\n\
    \n```\npredict.blm <- function(object, newdata, ...) {\n  updated_terms <- delete.response(terms(object$formula))\n\
    \  X <- model.matrix(updated_terms, data = newdata)\n  predictions <- vector(\"\
    numeric\", length = nrow(X))\n  for (i in seq_along(predictions)) {\n    predictions[i]\
    \ <- t(object$dist$mu) %*% X[i,]\n  }\n  predictions\n}\npredict(model, d)\n##\
    \ [1] 1.138150 1.133188 1.302653 1.199910 1.327373\n```\n\nTo check the model,\
    \ we can plot the predicted values against the true response values. With the\
    \ data we have used up till now, though, with only five data points, we don’t\
    \ expect the predictions to be particularly good, and we don’t expect such a plot\
    \ to show much, but we can try with a few more data points (see Figure [4-3](#A451015_1_En_4_Chapter.html#Fig3)).\n\
    \n![A451015_1_En_4_Fig3_HTML.jpg](A451015_1_En_4_Fig3_HTML.jpg)\n\nFigure 4-3.\
    \ True versus predicted values\n\n```\nd <- {\n  x <- rnorm(50)\n  y <- 0.2 +\
    \ 1.4 * x + rnorm(50)\n  data.frame(x = x, y = y)\n}\nmodel <- blm(y ∼ x, d, a\
    \ = 1, b = 1)\nplot(d$y, predict(model, d),\n     xlab = \"True responses\",\n\
    \     ylab = \"Predicted responses\")\n```\n\nPredicting values for the original\
    \ data is so common that there is another generic function for doing this, called\
    \ `fitted()`. We can implement it like this:\n\n```\nfitted.blm <- function(object,\
    \ ...) {\n  predict(object, newdata = object$data, ...)\n}\n```\n\nWith this function,\
    \ we could then create the plot as follows:\n\n```\nplot(d$y, fitted(model),\n\
    \     xlab = \"True responses\",\n     ylab = \"Predicted responses\")\n```\n\n\
    We can, of course, do more than simply predict point estimates. We have a distribution\
    \ of weights, which means that the slope and intercept of a line aren’t fixed.\
    \ They are, conceptually at least, drawn from a distribution. Slight changes in\
    \ the slope won’t have much of an impact on how certain we are in the predictions\
    \ near the main mass of the data, but data points further towards the edges of\
    \ the data will have a larger uncertainty because of this. We can take the distribution\
    \ into account when we make predictions to get error bars for the predictions.\
    \ If `X` is the model matrix and `S` the covariance matrix for the posterior,\
    \ then the variance for the ith prediction is given by:\n\n```\n1/b + t(X[i,])\
    \ %*% S %*% X[i,]\n```\n\nWe don’t have the precision parameter, `b`, stored in\
    \ the fitted model object, so if we want to get error bars, we need to keep that\
    \ around. So update your `blm()` function to return this structure:\n\n```\nstructure(\n\
    \  list(formula = formula,\n       data = model.frame(formula, data),\n      \
    \ dist = posterior,\n       precision = b,\n       call = match.call()),\n  class\
    \ = \"blm\"\n)\n```\n\nNow, we can extend our `predict()` function with an option\
    \ that, if `TRUE`, returns intervals as well:\n\n```\npredict.blm <- function(object,\
    \ newdata,\n                        intervals = FALSE,\n                     \
    \   level = 0.95,\n                        ...) {\n  updated_terms <- delete.response(terms(object$formula))\n\
    \  X <- model.matrix(updated_terms, data = newdata)\n  predictions <- vector(\"\
    numeric\", length = nrow(X))\n  for (i in seq_along(predictions)) {\n    predictions[i]\
    \ <- t(object$dist$mu) %*% X[i,]\n  }\n  if (!intervals) return(predictions)\n\
    \  S <- model$dist$S\n  b <- model$precision\n  sds <- vector(\"numeric\", length\
    \ = nrow(X))\n  for (i in seq_along(predictions)) {\n    sds[i] <- sqrt(1/b +\
    \ t(X[i,]) %*% S %*% X[i,])\n  }\n  lower_q <- qnorm(p = (1-level)/2,\n      \
    \             mean = predictions,\n                   sd = sds)\n  upper_q <-\
    \ qnorm(p = 1 - (1-level)/2,\n                   mean = predictions,\n       \
    \            sd = sds)\n  intervals <- cbind(lower_q, predictions, upper_q)\n\
    \  colnames(intervals) <- c(\"lower\", \"mean\", \"upper\")\n  as.data.frame(intervals)\n\
    }\nmodel <- blm(y ∼ x, d, a = 1, b = 1)\n```\n\nWith this `predict()` function,\
    \ we can plot error bars around our predictions as well, see Figure [4-4](#A451015_1_En_4_Chapter.html#Fig4).\
    \ In the figure, I also plot the `x = y` line. If we make accurate predictions,\
    \ the point should lie on this line. Since there is some stochasticity in the\
    \ data, we don’t expect to be exactly on it, but we do expect to overlap the line\
    \ 95% of the time.\n\n![A451015_1_En_4_Fig4_HTML.jpg](A451015_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4. Predictions versus true values with confidence intervals\n\n```\n\
    require(ggplot2)\npredictions <- fitted(model, intervals = TRUE)\nggplot(cbind(data.frame(y\
    \ = d$y), predictions),\n       aes(x = y, y = mean)) +\n  geom_point() +\n  geom_errorbar(aes(ymin\
    \ = lower, ymax = upper)) +\n  geom_abline(slope = 1) +\n  xlab(\"True responses\"\
    ) +\n  ylab(\"Predictions\") +\n  theme_minimal()\n```\n\nThere is, of course,\
    \ much more we can do with a statistical model, and more generic functions we\
    \ could add to it to provide a uniform interface to a class of models, but I hope\
    \ this example has at least given you an impression of how representing a model\
    \ as a class can be useful."
  raw: '## Predicting Response Variables


    When it comes to predicting response variables for new data, there is a little
    more work to be done for the model matrix. If we don’t have the response variable
    when we create a model matrix, we will get an error, even though the model matrix
    doesn’t actually contain a column with it. We can see this if we remove the `x`
    and `y` variables we used when creating the data frame earlier.


    ```

    rm(x) ; rm(y)

    ```


    We are fine if we build a model matrix from the data frame that has both `x` and
    `y`.


    ```

    model.matrix(y ∼ x + I(x**2), data = d)

    ##   (Intercept)           x      I(x^2)

    ## 1           1 -0.20409732 0.041655716

    ## 2           1 -0.22561419 0.050901761

    ## 3           1  0.34702845 0.120428747

    ## 4           1  0.03236784 0.001047677

    ## 5           1  0.41353129 0.171008128

    ## attr(,"assign")

    ## [1] 0 1 2

    ```


    If we create a data frame that only has `x` values, though, we get an error.


    ```

    dd <- data.frame(x = rnorm(5))

    model.matrix(y ∼ x + I(x**2), data = dd)

    ## Error in eval(expr, envir, enclos): object ''y'' not found

    ```


    This, of course, is a problem since we are interested in predicting response variables
    exactly when we do not have them. This is ironic, considering that the model matrix
    never actually contains the response variable; nevertheless, this is how R works.


    To remove the response variable from a formula, before we construct a model matrix,
    we need to use the function `delete.response`. Unfortunately, this function does
    not work directly on formulae, but on so-called “terms” objects. We can translate
    a formula into its terms using the `terms` function. So to remove the terms from
    a formula, we need the following construction:


    ```

    delete.response(terms(y ∼ x))

    ```


    The result is a `terms` object, but since the `terms` class is a specialization
    of the `formula` class, we can use it directly with the `model.matrix` function
    to construct the model matrix.


    ```

    model.matrix(delete.response(terms(y ∼ x)), data = dd)

    ##   (Intercept)           x

    ## 1           1  0.49841617

    ## 2           1 -1.74230249

    ## 3           1  0.97552910

    ## 4           1 -0.02408287

    ## 5           1  0.67568448

    ## attr(,"assign")

    ## [1] 0 1

    ```


    Now, for actually predicting data, we traditionally use the `predict` generic
    function. This function has the following signature:


    ```

    function(object, ...)

    ```


    Which, quite frankly, isn’t that useful. We can add to it, though, as the `lm`
    class does, so we can add a parameter `newdata` to it. From `newdata` we will
    construct a model matrix and make predictions for the data in this. If we just
    want point estimates for the new data, we can simply take the inner product of
    the mean weights and each row in the model matrix so we can implement the `predict`
    function like this:


    ```

    predict.blm <- function(object, newdata, ...) {

    updated_terms <- delete.response(terms(object$formula))

    X <- model.matrix(updated_terms, data = newdata)

    predictions <- vector("numeric", length = nrow(X))

    for (i in seq_along(predictions)) {

    predictions[i] <- t(object$dist$mu) %*% X[i,]

    }

    predictions

    }

    predict(model, d)

    ## [1] 1.138150 1.133188 1.302653 1.199910 1.327373

    ```


    To check the model, we can plot the predicted values against the true response
    values. With the data we have used up till now, though, with only five data points,
    we don’t expect the predictions to be particularly good, and we don’t expect such
    a plot to show much, but we can try with a few more data points (see Figure [4-3](#A451015_1_En_4_Chapter.html#Fig3)).


    ![A451015_1_En_4_Fig3_HTML.jpg](A451015_1_En_4_Fig3_HTML.jpg)


    Figure 4-3.


    True versus predicted values


    ```

    d <- {

    x <- rnorm(50)

    y <- 0.2 + 1.4 * x + rnorm(50)

    data.frame(x = x, y = y)

    }

    model <- blm(y ∼ x, d, a = 1, b = 1)

    plot(d$y, predict(model, d),

    xlab = "True responses",

    ylab = "Predicted responses")

    ```


    Predicting values for the original data is so common that there is another generic
    function for doing this, called `fitted`. We can implement it like this:


    ```

    fitted.blm <- function(object, ...) {

    predict(object, newdata = object$data, ...)

    }

    ```


    With this function, we could then create the plot as follows:


    ```

    plot(d$y, fitted(model),

    xlab = "True responses",

    ylab = "Predicted responses")

    ```


    We can, of course, do more than simply predict point estimates. We have a distribution
    of weights, which means that the slope and intercept of a line aren’t fixed. They
    are, conceptually at least, drawn from a distribution. Slight changes in the slope
    won’t have much of an impact on how certain we are in the predictions near the
    main mass of the data, but data points further towards the edges of the data will
    have a larger uncertainty because of this. We can take the distribution into account
    when we make predictions to get error bars for the predictions. If `X` is the
    model matrix and `S` the covariance matrix for the posterior, then the variance
    for the ith prediction is given by:


    ```

    1/b + t(X[i,]) %*% S %*% X[i,]

    ```


    We don’t have the precision parameter, `b`, stored in the fitted model object,
    so if we want to get error bars, we need to keep that around. So update your `blm`
    function to return this structure:


    ```

    structure(

    list(formula = formula,

    data = model.frame(formula, data),

    dist = posterior,

    precision = b,

    call = match.call()),

    class = "blm"

    )

    ```


    Now, we can extend our `predict` function with an option that, if `TRUE`, returns
    intervals as well:


    ```

    predict.blm <- function(object, newdata,

    intervals = FALSE,

    level = 0.95,

    ...) {

    updated_terms <- delete.response(terms(object$formula))

    X <- model.matrix(updated_terms, data = newdata)

    predictions <- vector("numeric", length = nrow(X))

    for (i in seq_along(predictions)) {

    predictions[i] <- t(object$dist$mu) %*% X[i,]

    }

    if (!intervals) return(predictions)

    S <- model$dist$S

    b <- model$precision

    sds <- vector("numeric", length = nrow(X))

    for (i in seq_along(predictions)) {

    sds[i] <- sqrt(1/b + t(X[i,]) %*% S %*% X[i,])

    }

    lower_q <- qnorm(p = (1-level)/2,

    mean = predictions,

    sd = sds)

    upper_q <- qnorm(p = 1 - (1-level)/2,

    mean = predictions,

    sd = sds)

    intervals <- cbind(lower_q, predictions, upper_q)

    colnames(intervals) <- c("lower", "mean", "upper")

    as.data.frame(intervals)

    }

    model <- blm(y ∼ x, d, a = 1, b = 1)

    ```


    With this `predict` function, we can plot error bars around our predictions as
    well, see Figure [4-4](#A451015_1_En_4_Chapter.html#Fig4). In the figure, I also
    plot the x = y line. If we make accurate predictions, the point should lie on
    this line. Since there is some stochasticity in the data, we don’t expect to be
    exactly on it, but we do expect to overlap the line 95% of the time.


    ![A451015_1_En_4_Fig4_HTML.jpg](A451015_1_En_4_Fig4_HTML.jpg)


    Figure 4-4.


    Predictions versus true values with confidence intervals


    ```

    require(ggplot2)

    predictions <- fitted(model, intervals = TRUE)

    ggplot(cbind(data.frame(y = d$y), predictions),

    aes(x = y, y = mean)) +

    geom_point() +

    geom_errorbar(aes(ymin = lower, ymax = upper)) +

    geom_abline(slope = 1) +

    xlab("True responses") +

    ylab("Predictions") +

    theme_minimal()

    ```


    There is, of course, much more we can do with a statistical model, and more generic
    functions we could add to it to provide a uniform interface to a class of models,
    but I hope this example has at least given you an impression of how representing
    a model as a class can be useful.'
  trans: "\n# 预测响应变量\n\n当涉及到对新数据的响应变量进行预测时，模型矩阵还需要进行一些额外工作。如果在创建模型矩阵时我们没有响应变量，即使模型矩阵实际上并不包含该变量的列，也会收到错误信息。如果我们删除之前创建数据框时使用的\
    \ `x` 和 `y` 变量，就能看到这一点。\n\n```\nrm(x) ; rm(y)\n```\n\n如果我们从包含 `x` 和 `y` 的数据框构建模型矩阵，则没有问题。\n\
    \n```\nmodel.matrix(y ∼ x + I(x**2), data = d)\n##   (Intercept)           x \
    \     I(x²)\n## 1           1 -0.20409732 0.041655716\n## 2           1 -0.22561419\
    \ 0.050901761\n## 3           1  0.34702845 0.120428747\n## 4           1  0.03236784\
    \ 0.001047677\n## 5           1  0.41353129 0.171008128\n## attr(,\"assign\")\n\
    ## [1] 0 1 2\n```\n\n然而，如果我们创建一个只包含 `x` 值的数据框，就会收到错误。\n\n```\ndd <- data.frame(x\
    \ = rnorm(5))\nmodel.matrix(y ∼ x + I(x**2), data = dd)\n## Error in eval(expr,\
    \ envir, enclos): object 'y' not found\n```\n\n这当然是个问题，因为我们的兴趣恰恰是在没有响应变量时对其进行预测。这颇具讽刺意味，因为模型矩阵实际上从不包含响应变量；尽管如此，这就是\
    \ R 的工作方式。\n\n要在构建模型矩阵之前从公式中移除响应变量，我们需要使用 `delete.response()` 函数。不幸的是，这个函数不能直接作用于公式，而是作用于所谓的“项”（terms）对象。我们可以使用\
    \ `terms()` 函数将公式转换为它的项。因此，要从公式中移除项，我们需要采用以下结构：\n\n```\ndelete.response(terms(y\
    \ ∼ x))\n```\n\n结果是一个 `terms` 对象，但由于 `terms` 类是 `formula` 类的特化，我们可以直接将其与 `model.matrix()`\
    \ 函数一起使用来构建模型矩阵。\n\n```\nmodel.matrix(delete.response(terms(y ∼ x)), data = dd)\n\
    ##   (Intercept)           x\n## 1           1  0.49841617\n## 2           1 -1.74230249\n\
    ## 3           1  0.97552910\n## 4           1 -0.02408287\n## 5           1 \
    \ 0.67568448\n## attr(,\"assign\")\n## [1] 0 1\n```\n\n现在，对于实际预测数据，我们传统上使用 `predict()`\
    \ 泛型函数。该函数具有以下签名：\n\n```\nfunction(object, ...)\n```\n\n坦率地说，这没什么用。不过，我们可以像 `lm`\
    \ 类那样为其添加参数，向其添加一个 `newdata` 参数。我们将根据 `newdata` 构建一个模型矩阵，并对其中的数据进行预测。如果我们只需要新数据的点估计值，可以简单地计算权重均值与模型矩阵每一行的内积，因此我们可以像这样实现\
    \ `predict()` 函数：\n\n```\npredict.blm <- function(object, newdata, ...) {\n  updated_terms\
    \ <- delete.response(terms(object$formula))\n  X <- model.matrix(updated_terms,\
    \ data = newdata)\n  predictions <- vector(\"numeric\", length = nrow(X))\n  for\
    \ (i in seq_along(predictions)) {\n    predictions[i] <- t(object$dist$mu) %*%\
    \ X[i,]\n  }\n  predictions\n}\npredict(model, d)\n## [1] 1.138150 1.133188 1.302653\
    \ 1.199910 1.327373\n```\n\n为了检查模型，我们可以将预测值与真实响应值绘制成图。不过，对于我们目前使用的只有五个数据点的数据，我们预期预测效果不会特别好，也不指望这样的图能展示多少信息，但我们可以尝试使用更多的数据点（见图\
    \ 4-3）。\n\n![A451015_1_En_4_Fig3_HTML.jpg](img/A451015_1_En_4_Fig3_HTML.jpg)\n\
    \n图 4-3. 真实值与预测值对比\n\n```\nd <- {\n  x <- rnorm(50)\n  y <- 0.2 + 1.4 * x + rnorm(50)\n\
    \  data.frame(x = x, y = y)\n}\nmodel <- blm(y ∼ x, d, a = 1, b = 1)\nplot(d$y,\
    \ predict(model, d),\n     xlab = \"真实响应\",\n     ylab = \"预测响应\")\n```\n\n对原始数据进行预测非常常见，以至于存在另一个用于此目的的泛型函数，名为\
    \ `fitted()`。我们可以这样实现它：\n\n```\nfitted.blm <- function(object, ...) {\n  predict(object,\
    \ newdata = object$data, ...)\n}\n```\n\n有了这个函数，我们可以像下面这样创建图表：\n\n```\nplot(d$y,\
    \ fitted(model),\n     xlab = \"真实响应\",\n     ylab = \"预测响应\")\n```\n\n当然，我们能做的不仅仅是预测点估计值。我们有一个权重分布，这意味着直线的斜率和截距并非固定不变。至少在概念上，它们是从一个分布中抽取的。斜率微小的变化，对于数据主体部分附近的预测准确性影响不大，但靠近数据边缘的数据点则会因此产生更大的不确定性。在进行预测时，我们可以将此分布考虑在内，从而获得预测的误差条。如果\
    \ `X` 是模型矩阵，`S` 是后验的协方差矩阵，那么第 i 个预测值的方差由下式给出：\n\n```\n1/b + t(X[i,]) %*% S %*%\
    \ X[i,]\n```\n\n我们并没有在拟合的模型对象中存储精度参数 `b`，所以如果想获取误差条，需要将其保留下来。因此，请更新你的 `blm()`\
    \ 函数，使其返回如下结构：\n\n```\nstructure(\n  list(formula = formula,\n       data = model.frame(formula,\
    \ data),\n       dist = posterior,\n       precision = b,\n       call = match.call()),\n\
    \  class = \"blm\"\n)\n```\n\n现在，我们可以扩展我们的 `predict()` 函数，增加一个选项，当该选项为 `TRUE`\
    \ 时，也返回置信区间：\n\n```\npredict.blm <- function(object, newdata,\n              \
    \          intervals = FALSE,\n                        level = 0.95,\n       \
    \                 ...) {\n  updated_terms <- delete.response(terms(object$formula))\n\
    \  X <- model.matrix(updated_terms, data = newdata)\n  predictions <- vector(\"\
    numeric\", length = nrow(X))\n  for (i in seq_along(predictions)) {\n    predictions[i]\
    \ <- t(object$dist$mu) %*% X[i,]\n  }\n  if (!intervals) return(predictions)\n\
    \  S <- model$dist$S\n  b <- model$precision\n  sds <- vector(\"numeric\", length\
    \ = nrow(X))\n  for (i in seq_along(predictions)) {\n    sds[i] <- sqrt(1/b +\
    \ t(X[i,]) %*% S %*% X[i,])\n  }\n  lower_q <- qnorm(p = (1-level)/2,\n      \
    \             mean = predictions,\n                   sd = sds)\n  upper_q <-\
    \ qnorm(p = 1 - (1-level)/2,\n                   mean = predictions,\n       \
    \            sd = sds)\n  intervals <- cbind(lower_q, predictions, upper_q)\n\
    \  colnames(intervals) <- c(\"lower\", \"mean\", \"upper\")\n  as.data.frame(intervals)\n\
    }\nmodel <- blm(y ∼ x, d, a = 1, b = 1)\n```\n\n有了这个 `predict()` 函数，我们还可以在预测值周围绘制误差条，参见图\
    \ 4-4。在该图中，我还绘制了 `x = y` 的直线。如果预测准确，数据点应落在这条线上。由于数据中存在一些随机性，我们不期望完全落在线上，但我们期望在\
    \ 95% 的时间内该线能与误差条重叠。\n\n![A451015_1_En_4_Fig4_HTML.jpg](img/A451015_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4. 带置信区间的预测值与真实值对比\n\n```\nrequire(ggplot2)\npredictions <- fitted(model,\
    \ intervals = TRUE)\nggplot(cbind(data.frame(y = d$y), predictions),\n       aes(x\
    \ = y, y = mean)) +\n  geom_point() +\n  geom_errorbar(aes(ymin = lower, ymax\
    \ = upper)) +\n  geom_abline(slope = 1) +\n  xlab(\"真实响应\") +\n  ylab(\"预测值\"\
    ) +\n  theme_minimal()\n```\n\n当然，对于统计模型，我们能做的还有很多，还可以为其添加更多泛型函数，为模型类提供统一的接口。但我希望这个示例至少能让你了解到，将模型表示为一个类是多么有用。\n"
- fmt: "# 5. Operator Overloading\n\nOverloading operators, that is, giving operators\
    \ such as `+` or `-` new or additional functionality, is not inherently object-oriented,\
    \ but since it can be thought of as adding polymorphism to functions it fits in\
    \ naturally here after we have gone through polymorphism through generic functions.\n\
    \nOpinions vary on whether overloading operators is good or bad practice. Some\
    \ languages allow it; others do not. Some languages allow you to make your own\
    \ infix operators but not change existing ones, and some languages are just inconsistent\
    \ in allowing some operator overloading for built-in objects but not for user-defined.\
    \ One argument against overloading is the expected behavior of operators. It is\
    \ so ingrained in us to expect `+` to mean addition that we cannot handle if it\
    \ also means string concatenation. This argument, of course, ignores that we have\
    \ no problem with using `+` for both integer and floating point addition. Another\
    \ argument, and in my opinion a more valid one, is that it is harder to remember\
    \ what an operator does than what a function does since the function name at least\
    \ gives us some hint as to the function’s purpose. The truth is that infix operators,\
    \ when carefully used, can provide us with a more convenient syntax than simple\
    \ function calls. You probably find `2 * x + 5` easier to read than `plus(times(2,\
    \ x), 5)`, and most programming languages, with Lisp dialects being a noticeable\
    \ exception, prefer the former to the latter. The same goes for user-defined or\
    \ user-overloaded operators. Using `magrittr`’s pipe operator, `%>%`, makes analysis\
    \ workflows much easier to read, and `ggplot2`’s overloading of `+` makes plotting\
    \ code much easier to read.\n\nSince, in R, you can both overload existing operators\
    \ and create your own, you have to choose which is most appropriate for any given\
    \ situation. My rule of thumb is to prefer new infix operators unless it feels\
    \ natural to use an existing one. That is, of course, a terribly subjective evaluation,\
    \ but some operations just seem like “addition”—I would say combining operations\
    \ in `ggplot2` can be justified as such—while others don’t, like pipeline operations\
    \ in `magritte`. It is a judgment call, and you can always experiment with your\
    \ code to see what you feel is most natural.\n\nIn this chapter, we will see how\
    \ we can overload operators. I will not cover how you create infix operators.\
    \ If you are interested, I describe those in my Functional Programming in R book.\n\
    \n## Functions and Operators\n\nEvery operation in R involves a function call.\
    \ Control structures, subscripting, even parenthesis involve functions, and, naturally,\
    \ operators involve function calls as well. This means that operators can be overridden.\
    \ You can replace one implementation of `+` with another just by defining a new\
    \ version of `+`. But you really shouldn’t. Replacing the built-in operators with\
    \ user-defined ones will affect all your code, slow it down, and is very likely\
    \ to introduce hard-to-find bugs. You don’t have to do this to define operators\
    \ for your own classes, though. The operators are generic, and you can define\
    \ specialized versions of them, implementing how any operator should handle new\
    \ classes you define.\n\nTo illustrate how this is done, we define a class for\
    \ arithmetic modulus some number `n`. Here I assume that `value` is some numeric\
    \ type—in production code, we would write tests for this, but in the example,\
    \ we just implicitly assume this—and we use an attribute to store the number `n`.\
    \ We then compute the value modulus `n`, set the class, and return the result.\n\
    \n```\nmodulus <- function(value, n) {\n  result <- value %% n\n  attr(result,\
    \ \"modulus\") <- n\n  class(result) <- c(\"modulus\", class(value))\n  result\n\
    }\n```\n\nTo pretty-print values of the class, we define the `print` method. We\
    \ want to print values, `x`, using the underlying type but with a line above giving\
    \ us `n`. If we just call `print(x)` we would recurse back to `print.modulus`\
    \ since that is the type of `x`, but we can use the function `unclass` to get\
    \ rid of the type of `x`. It doesn’t completely get rid of the type, though. If\
    \ `x` is a numeric type, `unclass` just reduces `x` to that. When we print primitive\
    \ values with attributes the attributes are printed as well, so we get rid of\
    \ all attributes before we print the reduced `x`. Here we could directly call\
    \ `print(x)` but `NextMethod()` works as well, so that is what I have used here.\n\
    \n```\nprint.modulus <- function(x, ...) {\n  cat(\"Modulus\", attr(x, \"modulus\"\
    ), \"values:\\n\")\n  # remove attributes to get plain numeric printing\n  x <-\
    \ unclass(x)\n  attributes(x) <- NULL\n  NextMethod()\n}\n(x <- modulus(1:6, 3))\n\
    ## Modulus 3 values:\n## [1] 1 2 0 1 2 0\n```\n\n### Defining Single Operators\n\
    \nWe can define what addition means for this type by defining the function ``\
    \ `+.modulus` ``:\n\n```\n`+.modulus` <- function(x, y) {\n  n <- attr(x, \"modulus\"\
    )\n  x <- unclass(x)\n  y <- unclass(y)\n  modulus(x + y, n)\n}\n```\n\nWe first\
    \ get `n` from `x`. Then we remove the class information from the two operands\
    \ so we can call the primitive `+` to calculate their sum. If we didn’t do this,\
    \ we would again recurse when we tried to add `x` to `y`, and we would then simply\
    \ calculate the result and use the `modulus` constructor to return it with the\
    \ right type.\n\nDispatching of such operator-functions works a little different\
    \ from the generic functions we have seen earlier. There, the dispatch is based\
    \ on the type of the first argument, at least unless you explicitly state otherwise,\
    \ but for operators, the dispatch is based on the type of both operands. If both\
    \ have a class that implements an operator, they must have the same class. If\
    \ only one of them have a class, and here primitive classes such as `\"numeric\"\
    ` or `\"integer\"` do not count, then the dispatch is based on that. So if `x`\
    \ is of type `\"modulus\"` then both `x + 1:6` and `1:6 + x` will call `` `+.modulus`\
    \ ``.\n\n```\nx + 1:6\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus\
    \ values:\n## numeric(0)\n```\n\nThe first expression does what we expect, but\
    \ the second does not. This is not because the dispatch is not working but because\
    \ we got `n` from the first operand only. Since we are only guaranteed that one\
    \ of the two operands have type `\"modulus\"` we need to check both. We can do\
    \ this simply by checking if the attribute `\"modulus\"` is `NULL` or not:\n\n\
    ```\n`+.modulus` <- function(x, y) {\n  n <- ifelse(!is.null(attr(x, \"modulus\"\
    )),\n              attr(x, \"modulus\"), attr(y, \"modulus\"))\n  x <- unclass(x)\n\
    \  y <- unclass(y)\n  modulus(x + y, n)\n}\nx + 1:6\n## Modulus 3 values:\n##\
    \ [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n```\n\n\
    Depending on which semantic we want addition of these types to have, we might\
    \ not want to allow addition of types with different `n`. If we add such types\
    \ now, the `n` is taken from the first operand.\n\n```\ny <- modulus(1:6, 2)\n\
    x + y\n## Modulus 3 values:\n## [1] 2 2 1 1 0 0\n```\n\nWith a little more check\
    \ we ensure that the two operands are compatible:\n\n```\n`+.modulus` <- function(x,\
    \ y) {\n  nx <- attr(x, \"modulus\")\n  ny <- attr(y, \"modulus\")\n  if (!is.null(nx)\
    \ && !is.null(ny) && nx != ny)\n    stop(\"Incompatible types\")\n  n <- ifelse(!is.null(nx),\
    \ nx, ny)\n  x <- unclass(x)\n  y <- unclass(y)\n  modulus(x + y, n)\n}\nx + y\n\
    ## Error in `+.modulus`(x, y): Incompatible types\ny <- modulus(rev(1:6), 3)\n\
    x + y\n## Modulus 3 values:\n## [1] 1 1 1 1 1 1\n```"
  raw: '# 5. Operator Overloading


    Overloading operators, that is, giving operators such as `+` or `-` new or additional
    functionality, is not inherently object-oriented, but since it can be thought
    of as adding polymorphism to functions it fits in naturally here after we have
    gone through polymorphism through generic functions.


    Opinions vary on whether overloading operators is good or bad practice. Some languages
    allow it; others do not. Some languages allow you to make your own infix operators
    but not change existing ones, and some languages are just inconsistent in allowing
    some operator overloading for built-in objects but not for user-defined. One argument
    against overloading is the expected behavior of operators. It is so ingrained
    in us to expect `+` to mean addition that we cannot handle if it also means string
    concatenation. This argument, of course, ignores that we have no problem with
    using `+` for both integer and floating point addition. Another argument, and
    in my opinion a more valid one, is that it is harder to remember what an operator
    does than what a function does since the function name at least gives us some
    hint as to the function’s purpose. The truth is that infix operators, when carefully
    used, can provide us with a more convenient syntax than simple function calls.
    You probably find `2 * x + 5` easier to read than `plus(times(2, x), 5)`, and
    most programming languages, with Lisp dialects being a noticeable exception, prefer
    the former to the latter. The same goes for user-defined or user-overloaded operators.
    Using `magrittr`’s pipe operator, `%>%`, makes analysis workflows much easier
    to read, and `ggplot2`’s overloading of `+` makes plotting code much easier to
    read.


    Since, in R, you can both overload existing operators and create your own, you
    have to choose which is most appropriate for any given situation. My rule of thumb
    is to prefer new infix operators unless it feels natural to use an existing one.
    That is, of course, a terribly subjective evaluation, but some operations just
    seem like “addition”—I would say combining operations in `ggplot2` can be justified
    as such—while others don’t, like pipeline operations in `magritte`. It is a judgment
    call, and you can always experiment with your code to see what you feel is most
    natural.


    In this chapter, we will see how we can overload operators. I will not cover how
    you create infix operators. If you are interested, I describe those in my Functional
    Programming in R book.


    ## Functions and Operators


    Every operation in R involves a function call. Control structures, subscripting,
    even parenthesis involve functions, and, naturally, operators involve function
    calls as well. This means that operators can be overridden. You can replace one
    implementation of `+` with another just by defining a new version of `+`. But
    you really shouldn’t. Replacing the built-in operators with user-defined ones
    will affect all your code, slow it down, and is very likely to introduce hard-to-find
    bugs. You don’t have to do this to define operators for your own classes, though.
    The operators are generic, and you can define specialized versions of them, implementing
    how any operator should handle new classes you define.


    To illustrate how this is done, we define a class for arithmetic modulus some
    number `n`. Here I assume that `value` is some numeric type—in production code,
    we would write tests for this, but in the example, we just implicitly assume this—and
    we use an attribute to store the number `n`. We then compute the value modulus
    `n`, set the class, and return the result.


    ```

    modulus <- function(value, n) {

    result <- value %% n

    attr(result, "modulus") <- n

    class(result) <- c("modulus", class(value))

    result

    }

    ```


    To pretty-print values of the class, we define the `print` method. We want to
    print values, `x`, using the underlying type but with a line above giving us `n`.
    If we just call `print(x)` we would recurse back to `print.modulus` since that
    is the type of `x`, but we can use the function `unclass` to get rid of the type
    of `x`. It doesn’t completely get rid of the type, though. If `x` is a numeric
    type, `unclass` just reduces `x` to that. When we print primitive values with
    attributes the attributes are printed as well, so we get rid of all attributes
    before we print the reduced `x`. Here we could directly call `print(x)` but `NextMethod()`
    works as well, so that is what I have used here.


    ```

    print.modulus <- function(x, ...) {

    cat("Modulus", attr(x, "modulus"), "values:\n")

    # remove attributes to get plain numeric printing

    x <- unclass(x)

    attributes(x) <- NULL

    NextMethod()

    }

    (x <- modulus(1:6, 3))

    ## Modulus 3 values:

    ## [1] 1 2 0 1 2 0

    ```


    ### Defining Single Operators


    We can define what addition means for this type by defining the function `` `+.modulus`
    ``:


    ```

    `+.modulus` <- function(x, y) {

    n <- attr(x, "modulus")

    x <- unclass(x)

    y <- unclass(y)

    modulus(x + y, n)

    }

    ```


    We first get `n` from `x`. Then we remove the class information from the two operands
    so we can call the primitive `+` to calculate their sum. If we didn’t do this,
    we would again recurse when we tried to add `x` to `y`, and we would then simply
    calculate the result and use the `modulus` constructor to return it with the right
    type.


    Dispatching of such operator-functions works a little different from the generic
    functions we have seen earlier. There, the dispatch is based on the type of the
    first argument, at least unless you explicitly state otherwise, but for operators,
    the dispatch is based on the type of both operands. If both have a class that
    implements an operator, they must have the same class. If only one of them have
    a class, and here primitive classes such as `"numeric"` or `"integer"` do not
    count, then the dispatch is based on that. So if `x` is of type `"modulus"` then
    both `x + 1:6` and `1:6 + x` will call `` `+.modulus` ``.


    ```

    x + 1:6

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    1:6 + x

    ## Modulus values:

    ## numeric(0)

    ```


    The first expression does what we expect, but the second does not. This is not
    because the dispatch is not working but because we got `n` from the first operand
    only. Since we are only guaranteed that one of the two operands have type `"modulus"`
    we need to check both. We can do this simply by checking if the attribute `"modulus"`
    is `NULL` or not:


    ```

    `+.modulus` <- function(x, y) {

    n <- ifelse(!is.null(attr(x, "modulus")),

    attr(x, "modulus"), attr(y, "modulus"))

    x <- unclass(x)

    y <- unclass(y)

    modulus(x + y, n)

    }

    x + 1:6

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    1:6 + x

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    ```


    Depending on which semantic we want addition of these types to have, we might
    not want to allow addition of types with different `n`. If we add such types now,
    the `n` is taken from the first operand.


    ```

    y <- modulus(1:6, 2)

    x + y

    ## Modulus 3 values:

    ## [1] 2 2 1 1 0 0

    ```


    With a little more check we ensure that the two operands are compatible:


    ```

    `+.modulus` <- function(x, y) {

    nx <- attr(x, "modulus")

    ny <- attr(y, "modulus")

    if (!is.null(nx) && !is.null(ny) && nx != ny)

    stop("Incompatible types")

    n <- ifelse(!is.null(nx), nx, ny)

    x <- unclass(x)

    y <- unclass(y)

    modulus(x + y, n)

    }

    x + y

    ## Error in `+.modulus`(x, y): Incompatible types

    y <- modulus(rev(1:6), 3)

    x + y

    ## Modulus 3 values:

    ## [1] 1 1 1 1 1 1

    ```'
  trans: "\n# 5. 运算符重载\n\n重载运算符，即赋予 `+` 或 `-` 等运算符新的或额外的功能，本质上并非面向对象特性。但由于这可以看作是为函数增加了多态性，因此在学习了基于泛型函数的多态之后，在此处讨论运算符重载显得顺理成章。\n\
    \n关于运算符重载是优是劣，众说纷纭。有些语言支持重载，有些则不支持。有些语言允许你创建自己的中缀运算符，但不能修改现有运算符；还有些语言则前后矛盾，允许对内置对象进行某些运算符重载，却不允许对用户自定义对象进行重载。反对重载的一个论点是运算符的预期行为。我们对\
    \ `+` 代表加法这一概念根深蒂固，以至于无法接受它同时表示字符串拼接。当然，这种论点忽略了我们早已习惯用 `+` 同时进行整数和浮点数的加法。另一个论点，在我看来也更站得住脚，是记住运算符的功能比记住函数的功能更难，因为函数名至少能给我们一些关于其用途的提示。事实上，如果使用得当，中缀运算符能提供比简单函数调用更便捷的语法。你可能会觉得\
    \ `2 * x + 5` 比 `plus(times(2, x), 5)` 更易读，而且大多数编程语言（Lisp 方言是明显的例外）也更倾向于前者。对于用户自定义或用户重载的运算符也是如此。使用\
    \ `magrittr` 的管道运算符 `%>%` 能让分析工作流程更易读，而 `ggplot2` 对 `+` 的重载则让绘图代码更清晰易读。\n\n由于在\
    \ R 中既可以重载现有运算符，也可以创建新运算符，因此你需要针对每种情况选择最合适的方式。我的经验法则是：除非使用现有运算符感觉自然，否则优先考虑使用新的中缀运算符。当然，这完全是主观判断，但有些运算看起来确实像是“加法”——我认为在\
    \ `ggplot2` 中组合图层可以归为此类——而其他像 `magrittr` 中的管道运算则不然。这需要你做出判断，你也可以不断尝试代码，看看哪种方式最自然。\n\
    \n本章我们将学习如何重载运算符。我不会介绍如何创建中缀运算符。如果你对此感兴趣，可以参考我的《R 函数式编程》一书。\n\n## 函数与运算符\n\nR\
    \ 中的每个操作都涉及函数调用。控制结构、下标操作，甚至括号都与函数有关，同样，运算符也涉及函数调用。这意味着运算符可以被重写。你可以通过定义 `+` 的一个新版本，来替换\
    \ `+` 的现有实现。但你确实不应该这么做。用用户自定义的运算符替换内置运算符会影响你所有的代码，拖慢速度，并且极易引入难以发现的错误。不过，为你自己的类定义运算符并不需要这样操作。运算符是泛型的，你可以定义它们的特化版本，实现任何运算符应如何处理你定义的新类。\n\
    \n为了说明如何实现，我们定义一个用于“取模 n”的算术类。这里我假设 `value` 是某种数值类型——在生产代码中，我们会为此编写测试，但在示例中，我们只是隐式地这么假设——然后我们使用一个属性来存储模数\
    \ `n`。接着计算 `value` 对 `n` 取模的结果，设置类，并返回结果。\n\n```\nmodulus <- function(value, n)\
    \ {\n  result <- value %% n\n  attr(result, \"modulus\") <- n\n  class(result)\
    \ <- c(\"modulus\", class(value))\n  result\n}\n```\n\n为了美观地打印该类的值，我们定义了 `print`\
    \ 方法。我们想要以底层类型的方式打印值 `x`，但上方附带一行显示 `n`。如果直接调用 `print(x)`，我们会递归回到 `print.modulus`，因为\
    \ `x` 的类型就是 `modulus`。但我们可以使用 `unclass` 函数来移除 `x` 的类型。不过，这并不能完全去掉类型。如果 `x` 是数值类型，`unclass`\
    \ 只会将其降级为该类型。当我们打印带有属性的原始值时，属性也会被打印出来，所以我们在打印降级后的 `x` 之前需要去掉所有属性。这里我们可以直接调用 `print(x)`，但使用\
    \ `NextMethod()` 也行，我在这里就用了这个方法。\n\n```\nprint.modulus <- function(x, ...) {\n\
    \  cat(\"Modulus\", attr(x, \"modulus\"), \"values:\\n\")\n  # 移除属性以获得纯数值打印效果\n\
    \  x <- unclass(x)\n  attributes(x) <- NULL\n  NextMethod()\n}\n(x <- modulus(1:6,\
    \ 3))\n## Modulus 3 values:\n## [1] 1 2 0 1 2 0\n```\n\n### 定义单个运算符\n\n我们可以通过定义函数\
    \ `` `+.modulus` `` 来定义加法对此类型意味着什么：\n\n```\n`+.modulus` <- function(x, y) {\n\
    \  n <- attr(x, \"modulus\")\n  x <- unclass(x)\n  y <- unclass(y)\n  modulus(x\
    \ + y, n)\n}\n```\n\n我们首先从 `x` 中获取 `n`。然后移除两个操作数的类信息，以便调用原始的 `+` 来计算它们的和。如果不这样做，当我们尝试将\
    \ `x` 与 `y` 相加时，又会发生递归，然后我们只需计算结果，并使用 `modulus` 构造函数返回具有正确类型的结果。\n\n这类运算符函数的分派与我们之前看到的泛型函数略有不同。在泛型函数中，分派基于第一个参数的类型（除非你明确指定其他方式），但对于运算符，分派基于两个操作数的类型。如果两个操作数都有实现了某个运算符的类，那么它们的类必须相同。如果只有一个操作数有类（这里\
    \ `\"numeric\"` 或 `\"integer\"` 这样的原始类不计算在内），则分派基于该操作数进行。因此，如果 `x` 的类型是 `\"modulus\"\
    `，那么 `x + 1:6` 和 `1:6 + x` 都会调用 `` `+.modulus` ``。\n\n```\nx + 1:6\n## Modulus\
    \ 3 values:\n## [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus values:\n## numeric(0)\n\
    ```\n\n第一个表达式符合预期，但第二个却没有。这不是因为分派没起作用，而是因为我们只从第一个操作数中获取了 `n`。由于我们只能保证两个操作数中有一个是\
    \ `\"modulus\"` 类型，所以我们需要同时检查两个操作数。我们可以简单地通过检查属性 `\"modulus\"` 是否为 `NULL` 来实现：\n\
    \n```\n`+.modulus` <- function(x, y) {\n  n <- ifelse(!is.null(attr(x, \"modulus\"\
    )),\n              attr(x, \"modulus\"), attr(y, \"modulus\"))\n  x <- unclass(x)\n\
    \  y <- unclass(y)\n  modulus(x + y, n)\n}\nx + 1:6\n## Modulus 3 values:\n##\
    \ [1] 2 1 0 2 1 0\n1:6 + x\n## Modulus 3 values:\n## [1] 2 1 0 2 1 0\n```\n\n\
    根据我们想让这些类型的加法具有何种语义，我们可能不希望允许具有不同 `n` 的类型相加。如果按照目前的方式相加，`n` 是从第一个操作数中取得的。\n\n\
    ```\ny <- modulus(1:6, 2)\nx + y\n## Modulus 3 values:\n## [1] 2 2 1 1 0 0\n```\n\
    \n通过增加一点检查，我们可以确保两个操作数是兼容的：\n\n```\n`+.modulus` <- function(x, y) {\n  nx <- attr(x,\
    \ \"modulus\")\n  ny <- attr(y, \"modulus\")\n  if (!is.null(nx) && !is.null(ny)\
    \ && nx != ny)\n    stop(\"Incompatible types\")\n  n <- ifelse(!is.null(nx),\
    \ nx, ny)\n  x <- unclass(x)\n  y <- unclass(y)\n  modulus(x + y, n)\n}\nx + y\n\
    ## Error in `+.modulus`(x, y): Incompatible types\ny <- modulus(rev(1:6), 3)\n\
    x + y\n## Modulus 3 values:\n## [1] 1 1 1 1 1 1\n```\n"
- fmt: '### Group Operators


    Using generic functions, we can define all relevant operators for a user-defined
    type, but it is also possible to handle all operators in a single function, `Ops`.
    This function is called a “group generic method” because it handles a group of
    generic functions; other group methods are `Math`, `Complex`, and `Summary`, which
    we will not cover here.


    If we define the function `Ops.modulus`, it will be called for all operators of
    `modulus` objects where the operator function is not defined. That is, if we have
    defined `` `+.modulus` `` as above, that function will be preferred over `Ops.modulus`,
    but otherwise, if one or both of the operands are of type `modulus`, then `Ops.modulus`
    will be called.


    We can define it like this:


    ```

    Ops.modulus <- function(e1, e2) {

    nx <- attr(e1, "modulus")

    ny <- attr(e2, "modulus")

    if (!is.null(nx) && !is.null(ny) && nx != ny)

    stop("Incompatible types")

    n <- ifelse(!is.null(nx), nx, ny)

    result <- unclass(NextMethod()) %% n

    modulus(result, n)

    }

    ```


    The testing of input values at the beginning of the function is the same as for
    `` `+.modulus` ``. After the testing, we use `NextMethod` to call the operation
    using the underlying type. This strips the `modulus` class from the operands and
    evaluates whatever operation we are currently handling. We `unclass` the result,
    necessary because the result will inherit the attributes of the operands of `Ops`,
    so if we don’t the result will have class `modulus`, and we then compute modulus
    `n`. If we didn’t `unclass`, this would be a recursive call, but since we do remove
    the class we just do modulus in the underlying type. We finally create a `modulus`
    object of the result.


    With this function defined we get all binary operators in one go.


    ```

    y <- modulus(rev(1:6), 3)

    x - y

    ## Modulus 3 values:

    ## [1] 1 0 2 1 0 2

    x * y

    ## Modulus 3 values:

    ## [1] 0 1 0 0 1 0

    ```


    This includes comparison operators as well:


    ```

    x == y

    ## Modulus 3 values:

    ## [1] 0 1 0 0 1 0

    x == x

    ## Modulus 3 values:

    ## [1] 1 1 1 1 1 1

    x != y

    ## Modulus 3 values:

    ## [1] 1 0 1 1 0 1

    x != x

    ## Modulus 3 values:

    ## [1] 0 0 0 0 0 0

    ```


    It even includes unary operators. If we use a unary minus, however, the argument
    `e2` will be missing in the function call, which we do not handle correctly right
    now.


    ```

    - x

    ## Error in Ops.modulus(x): argument "e2" is missing, with no default

    ```


    We can easily fix this, however, by checking if `e2` is missing. Otherwise, the
    function will work as it is.


    ```

    Ops.modulus <- function(e1, e2) {

    nx <- attr(e1, "modulus")

    ny <- if (!missing(e2)) attr(e2, "modulus") else NULL

    if (!is.null(nx) && !is.null(ny) && nx != ny)

    stop("Incompatible types")

    n <- ifelse(!is.null(nx), nx, ny)

    result <- unclass(NextMethod()) %% n

    modulus(result, n)

    }

    - x

    ## Modulus 3 values:

    ## [1] 2 1 0 2 1 0

    ```


    ### Units Example


    For a slightly more involved example, we define a class for associating physical
    units with values. This will allow us to check that units we manipulate are compatible—so
    we do not subtract meters from seconds and such—and will do unit analysis as part
    of arithmetic operations. The example is a simplified version of the package `units`.
    The `units` package also handles unit conversion and unit simplification. Here
    we just implement a simple arithmetic of symbolic units and a simple equality
    check of them.


    The idea is to have a representation of physical units and then associate these
    to numeric values. Physical units, here, refers to units like square kilometres,
    metres per second, etc. In general, these will be symbolic expressions, but we
    will only consider the slightly simpler situation where the units are a fraction
    of physical constants. In that case, we can represent these as a list of terms
    in the nominator and a list of terms in the denominator. If we always keep these
    lists sorted, we have a canonical representation of them, and we can check equality
    of two units by checking equality of the nominator and denominator lists. We can
    implement the constructor like this:


    ```

    symbolic_unit <- function(nominator, denominator = "") {

    non_empty <- function(x) x != ""

    nominator <- sort(Filter(non_empty, nominator))

    denominator <- sort(Filter(non_empty, denominator))

    structure(list(nominator = nominator,

    denominator = denominator),

    class = "symbolic_unit")

    }

    ```


    We can translate these units into a string representation of the fraction for
    pretty-printing.


    ```

    as.character.symbolic_unit <- function(x, ...) {

    format_terms <- function(terms, op) {

    if (length(terms) == 0) return("1")

    paste0(terms, collapse = op)

    }

    nominator <- format_terms(x$nominator, "*")

    denominator <- format_terms(x$denominator, "/")

    paste(nominator, "/", denominator)

    }

    print.symbolic_unit <- function(x, ...) {

    cat(as.character(x, ...), "\n")

    }

    (x <- symbolic_unit("m"))

    ## m / 1

    (y <- symbolic_unit("m", "s"))

    ## m / s

    ```


    Comparing two symbolic units involves checking that the nominator and denominator
    are equal.


    ```

    `==.symbolic_unit` <- function(x, y) {

    if (!(inherits(x, "symbolic_unit") &&

    inherits(y, "symbolic_unit")))

    stop("Incompatible types")

    return(identical(x$nominator, y$nominator) &&

    identical(x$denominator, y$denominator))

    }

    `!=.symbolic_unit` <- function(x, y) !(x == y)

    x == y

    ## [1] FALSE

    x != y

    ## [1] TRUE

    ```


    Adding and subtracting physical quantities is only possible if they have the same
    units, but it is always possible to multiply and divide units. The resulting unit
    is then obtained by doing the same operation on the (symbolic) units as you do
    on the quantities. To be able to handle this, we define multiplication and division
    on symbolic units.


    ```

    `*.symbolic_unit` <- function(x, y) {

    symbolic_unit(c(x$nominator, y$nominator),

    c(x$denominator, y$denominator))

    }

    `/.symbolic_unit` <- function(x, y) {

    symbolic_unit(c(x$nominator, y$denominator),

    c(x$denominator, y$nominator))

    }

    x * y

    ## m*m / s

    x / y

    ## m*s / m

    ```


    We now have everything in place to represent units. We just need to define the
    class for associating units with quantities. This class is very similar to the
    `modulus` class we wrote earlier. We take a (numeric) value, associate a symbolic
    unit in an attribute, and set the class.


    ```

    units <- function(value, nominator, denominator = "") {

    attr(value, "units") <- symbolic_unit(nominator, denominator)

    class(value) <- c("units", class(value))

    value

    }

    ```


    Pretty-printing follows the pattern we saw with `modulus`. We need to strip the
    class and attributes to use the underlying print method, called through `NextMethod`,
    but that is all there is to it.


    ```

    print.units <- function(x, ...) {

    cat("Units: ", as.character(attr(x, "units")), "\n")

    # remove attributes to get plain numeric printing

    x <- unclass(x)

    attributes(x) <- NULL

    NextMethod()

    }

    (x <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    ```'
