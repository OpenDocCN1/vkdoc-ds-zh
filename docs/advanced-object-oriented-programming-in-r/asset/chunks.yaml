    ```

    as.character.symbolic_unit <- function(x, ...) {

    format_terms <- function(terms, op) {

    if (length(terms) == 0) return("1")

    paste0(terms, collapse = op)

    }

    nominator <- format_terms(x$nominator, "*")

    denominator <- format_terms(x$denominator, "/")

    paste(nominator, "/", denominator)

    }

    print.symbolic_unit <- function(x, ...) {

    cat(as.character(x, ...), "\n")

    }

    (x <- symbolic_unit("m"))

    ## m / 1

    (y <- symbolic_unit("m", "s"))

    ## m / s

    ```


    Comparing two symbolic units involves checking that the nominator and denominator
    are equal.


    ```

    `==.symbolic_unit` <- function(x, y) {

    if (!(inherits(x, "symbolic_unit") &&

    inherits(y, "symbolic_unit")))

    stop("Incompatible types")

    return(identical(x$nominator, y$nominator) &&

    identical(x$denominator, y$denominator))

    }

    `!=.symbolic_unit` <- function(x, y) !(x == y)

    x == y

    ## [1] FALSE

    x != y

    ## [1] TRUE

    ```


    Adding and subtracting physical quantities is only possible if they have the same
    units, but it is always possible to multiply and divide units. The resulting unit
    is then obtained by doing the same operation on the (symbolic) units as you do
    on the quantities. To be able to handle this, we define multiplication and division
    on symbolic units.


    ```

    `*.symbolic_unit` <- function(x, y) {

    symbolic_unit(c(x$nominator, y$nominator),

    c(x$denominator, y$denominator))

    }

    `/.symbolic_unit` <- function(x, y) {

    symbolic_unit(c(x$nominator, y$denominator),

    c(x$denominator, y$nominator))

    }

    x * y

    ## m*m / s

    x / y

    ## m*s / m

    ```


    We now have everything in place to represent units. We just need to define the
    class for associating units with quantities. This class is very similar to the
    `modulus` class we wrote earlier. We take a (numeric) value, associate a symbolic
    unit in an attribute, and set the class.


    ```

    units <- function(value, nominator, denominator = "") {

    attr(value, "units") <- symbolic_unit(nominator, denominator)

    class(value) <- c("units", class(value))

    value

    }

    ```


    Pretty-printing follows the pattern we saw with `modulus`. We need to strip the
    class and attributes to use the underlying print method, called through `NextMethod`,
    but that is all there is to it.


    ```

    print.units <- function(x, ...) {

    cat("Units: ", as.character(attr(x, "units")), "\n")

    # remove attributes to get plain numeric printing

    x <- unclass(x)

    attributes(x) <- NULL

    NextMethod()

    }

    (x <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    ```'
