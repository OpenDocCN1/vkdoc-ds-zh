    # 1. Classes and Generic Functions


    R’s approach to object-oriented programming is through generic functions and classes.
    As mentioned in the introduction, R actually has three systems for implementing
    this, called S3, S4, and R6\. In this chapter, I will only describe the S3 system,
    which is the simplest of the three, but I will return to the other two systems
    in later chapters.'
  trans: '

    我所阅读过的关于面向对象编程的大多数书籍，以及我上过的面向对象编程课程，都侧重于面向对象建模和软件设计。其重点在于如何利用面向对象技术来构建你对软件的思考方式，以及软件如何反映你试图在软件中建模的现实世界或概念领域的物理或概念层面。例如，如果你开发一个处理会计的软件，你会将账户建模为对象，并为其定义存款和取款等操作。你会尽可能地尝试将问题域中的概念直接映射到软件中。这是一种设计软件的强大方法，但软件中总有一些方面不易适应此类建模，尤其是在涉及算法编程和数据结构设计时。例如，搜索树和排序算法通常并不反映问题域中的任何具体事物。


    然而，面向对象编程也是设计算法和数据结构时一个非常强大的工具。在我学习编程时，算法和数据结构是在与面向对象课程分开的课程中讲授的。将面向对象和算法编程结合起来，是我后来通过编写软件自学掌握的。我认为这是一种遗憾，因为这两者实际上非常契合。


    在本书中，我将尝试既将面向对象作为一种软件设计的建模技术，也将其作为开发可重用算法软件的工具来介绍。多态性是面向对象编程的基石，它非常适合用于开发灵活的算法，以及将抽象数据类型的不同具体实现结合起来，从而将抽象算法适配到具体问题中。R
    的一个主要用途是机器学习和数据科学，在这些领域，高效灵活的算法比建模问题域更重要，因此本书的大部分内容将聚焦于面向对象编程的这些方面。


    要阅读本书，你需要了解 R 编程的基础知识：如何操作数据以及如何编写函数。我们不会涉及特别复杂的 R 编程，所以你不需要具备在 R 中进行函数式编程的基础知识，但如果你想学习相关方法，我建议阅读本系列的第一本书，该书专门介绍了这一点。不过，即使没读过那本书，你也应该能够理解本书内容。


