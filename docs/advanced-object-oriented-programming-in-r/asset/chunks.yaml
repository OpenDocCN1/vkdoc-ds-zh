- fmt: "### Another Example: Graphical Objects\n\nThe “is-a” relationship underlying\
    \ a class hierarchy is more flexible than just having abstract classes and implementations\
    \ of these. It provides us with both a way of modeling that some objects really\
    \ are of different but related classes, and it provides us with a mechanism for\
    \ thinking about interfaces as specializations of other interfaces.\n\nLet us\
    \ consider, for example, an application where we operate on some graphical object—perhaps\
    \ as part of a new visualization package. The most basic class of this application\
    \ is the `GraphicalObject` whose objects you can `draw`. Being able to draw objects\
    \ is the most basic operation we need for graphical objects. Graphical objects\
    \ also have a “bounding box”—a rectangle that tells us how large the shape is,\
    \ something we might need when drawing objects.\n\nThis class is abstract, not\
    \ just because we are defining an interface so we can have different implementations,\
    \ like with did with the stack, but because it doesn’t really make sense to have\
    \ a graphical interface at this abstract level. A concrete class that it does\
    \ make sense to have objects of is `Point`, which is a graphical object representing\
    \ a single point. Other classes could be `Circle` and `Rectangle`.\n\nFor dealing\
    \ with more than one graphical object, in an interface which makes that easy,\
    \ we also have a class, `Composite`, that captures a collection of graphical objects.\n\
    \n![A451015_1_En_2_Fig2_HTML.gif](A451015_1_En_2_Fig2_HTML.gif)\n\nFigure 2-2.\n\
    \nClass hierarchy for graphical objects. The arrow from `Composite` to `GraphicalObject`,\
    \ with a diamond starting point and an arrow endpoint, indicates that a `Composite`\
    \ consists of a collection of `GraphicalObject`s.\n\nTreating a collection of\
    \ objects as an object of the same class as its components is a so-called design\
    \ pattern and it makes it easier to deal with complex figures in this application.\
    \ We can group together graphical objects in a hierarchy—similar to how you would\
    \ group objects in a drawing tool—and we would not need to explicitly check in\
    \ our code if we are working on a single object or a collection of objects. A\
    \ collection of objects is also a graphical object, and we can just treat it as\
    \ such.\n\nImplementing this class hierarchy is fairly straightforward. The abstract\
    \ class `GraphicalObject` is not explicitly represented, but we need its methods\
    \ as generic functions.\n\n```\ndraw <- function(object) UseMethod(\"draw\")\n\
    bounding_box <- function(object) UseMethod(\"bounding_box\")\n```\n\nWhen constructing\
    \ graphical objects, we need to set their class, and these could be the constructors\
    \ for the concrete classes:\n\n```\npoint <- function(x, y) {\n  object <- c(x,\
    \ y)\n  class(object) <- \"point\"\n  names(object) <- c(\"x\", \"y\")\n  object\n\
    }\nrectangle <- function(x1, y1, x2, y2) {\n  object <- c(x1, y1, x2, y2)\n  class(object)\
    \ <- \"rectangle\"\n  names(object) <- c(\"x1\", \"y1\", \"x2\", \"y2\")\n  object\n\
    }\ncircle <- function(x, y, r) {\n  object <- c(x, y, r)\n  class(object) <- \"\
    circle\"\n  names(object) <- c(\"x\", \"y\", \"r\")\n  object\n}\ncomposite <-\
    \ function(...) {\n  object <- list(...)\n  class(object) <- \"composite\"\n \
    \ object\n}\n```\n\nWe just implement the graphical objects as vectors, except\
    \ for the composite that we represent as a list so it can contain different types\
    \ of other graphical objects. The points are just vectors of coordinates, the\
    \ rectangles are represented by two coordinates, the rectangle’s lower left and\
    \ upper right corners, and circles are represented by a center point and a radius.\n\
    \nFor the `draw` methods, we can just use basic graphics functions:\n\n```\ndraw.point\
    \ <- function(object) {\n  points(object[\"x\"], object[\"y\"])\n}\ndraw.rectangle\
    \ <- function(object) {\n  rect(object[\"x1\"], object[\"y1\"], object[\"x2\"\
    ], object[\"y2\"])\n}\ndraw.circle <- function(object) {\n  plotrix::draw.circle(object[\"\
    x\"], object[\"y\"], object[\"r\"])\n}\ndraw.composite <- function(object) {\n\
    \  invisible(Map(draw, object))\n}\n```\n\nWe can use basic graphics functions\
    \ except for the circles, where we use the `draw.circle` function from the `plotrix`\
    \ package for convenience. For the collection class, we just call `draw` on all\
    \ of the collection’s components. We wrap the call to `Map` in `invisible` because\
    \ we don’t want to print a list of objects every time we call the function on\
    \ the command prompt, but otherwise the implementation is straightforward.\n\n\
    With these functions, we can construct plots of graphical elements, see Figure\
    \ [2-3](#A451015_1_En_2_Chapter.html#Fig3).\n\n![A451015_1_En_2_Fig3_HTML.gif](A451015_1_En_2_Fig3_HTML.gif)\n\
    \nFigure 2-3.\n\nPlot of graphical elements\n\n```\nplot(c(0, 10), c(0, 10),\n\
    \     type = 'n', axes = FALSE, xlab = '', ylab = '')\ndraw(point(5,5))\ndraw(rectangle(2.5,\
    \ 2.5, 7.5, 7.5))\ndraw(circle(5, 5, 4))\ncorners <- composite(point(2.5, 2.5),\
    \ point(2.5, 7.5),\n                     point(7.5, 2.5), point(7.5, 7.5))\ndraw(corners)\n\
    ```\n\nHere we have to set the size of the plot so it actually contains the elements\
    \ we want to display. We have the `bounding_box` function for calculating what\
    \ that area is, and we can implement the different methods like this:\n\n```\n\
    bounding_box.point <- function(object) {\n  c(object[\"x\"], object[\"y\"], object[\"\
    x\"], object[\"y\"])\n}\nbounding_box.rectangle <- function(object) {\n  c(object[\"\
    x1\"], object[\"y1\"], object[\"x2\"], object[\"y2\"])\n}\nbounding_box.circle\
    \ <- function(object) {\n  c(object[\"x\"] - object[\"r\"], object[\"y\"] - object[\"\
    r\"],\n    object[\"x\"] + object[\"r\"], object[\"y\"] + object[\"r\"])\n}\n\
    bounding_box.composite <- function(object) {\n  if (length(object) == 0) return(c(NA,\
    \ NA, NA, NA))\n  bb <- bounding_box(object[[1]])\n  x1 <- bb[1]\n  y1 <- bb[2]\n\
    \  x2 <- bb[3]\n  y2 <- bb[4]\n  for (element in object) {\n    bb <- bounding_box(element)\n\
    \    x1 <- min(x1, bb[1])\n    y1 <- min(y1, bb[2])\n    x2 <- max(x2, bb[3])\n\
    \    y2 <- max(y2, bb[4])\n  }\n  c(x1, y1, x2, y2)\n}\n```\n\nWith that, we can\
    \ collect all the graphical elements we wish to plot in a composite object and\
    \ calculate the bounding box before we plot.\n\n```\nall <- composite(\n  point(5,5),\n\
    \  rectangle(2.5, 2.5, 7.5, 7.5),\n  circle(5, 5, 4),\n  composite(point(2.5,\
    \ 2.5), point(2.5, 7.5),\n            point(7.5, 2.5), point(7.5, 7.5))\n)\nbb\
    \ <- bounding_box(all)\nplot(c(bb[1], bb[3]), c(bb[2], bb[4]),\n     type = 'n',\
    \ axes = FALSE, xlab = '', ylab = '')\ndraw(all)\n```\n\nThe result is, of course,\
    \ just the same as seen in Figure [2-3](#A451015_1_En_2_Chapter.html#Fig3)."
  raw: '### Another Example: Graphical Objects


    The “is-a” relationship underlying a class hierarchy is more flexible than just
    having abstract classes and implementations of these. It provides us with both
    a way of modeling that some objects really are of different but related classes,
    and it provides us with a mechanism for thinking about interfaces as specializations
    of other interfaces.


    Let us consider, for example, an application where we operate on some graphical
    object—perhaps as part of a new visualization package. The most basic class of
    this application is the GraphicalObject whose objects you can `draw`. Being able
    to draw objects is the most basic operation we need for graphical objects. Graphical
    objects also have a “bounding box”—a rectangle that tells us how large the shape
    is, something we might need when drawing objects.


    This class is abstract, not just because we are defining an interface so we can
    have different implementations, like with did with the stack, but because it doesn’t
    really make sense to have a graphical interface at this abstract level. A concrete
    class that it does make sense to have objects of is Point, which is a graphical
    object representing a single point. Other classes could be Circle and Rectangle.


    For dealing with more than one graphical object, in an interface which makes that
    easy, we also have a class, Composite, that captures a collection of graphical
    objects.


    ![A451015_1_En_2_Fig2_HTML.gif](A451015_1_En_2_Fig2_HTML.gif)


    Figure 2-2.


    Class hierarchy for graphical objects. The arrow from Composite to GraphicalObject,
    with a diamond starting point and an arrow endpoint, indicates that a Composite
    consists of a collection of GraphicalObjects.


    Treating a collection of objects as an object of the same class as its components
    is a so-called design pattern and it makes it easier to deal with complex figures
    in this application. We can group together graphical objects in a hierarchy—similar
    to how you would group objects in a drawing tool—and we would not need to explicitly
    check in our code if we are working on a single object or a collection of objects.
    A collection of objects is also a graphical object, and we can just treat it as
    such.


    Implementing this class hierarchy is fairly straightforward. The abstract class
    GraphicalObject is not explicitly represented, but we need its methods as generic
    functions.


    ```

    draw <- function(object) UseMethod("draw")

    bounding_box <- function(object) UseMethod("bounding_box")

    ```


    When constructing graphical objects, we need to set their class, and these could
    be the constructors for the concrete classes:


    ```

    point <- function(x, y) {

    object <- c(x, y)

    class(object) <- "point"

    names(object) <- c("x", "y")

    object

    }

    rectangle <- function(x1, y1, x2, y2) {

    object <- c(x1, y1, x2, y2)

    class(object) <- "rectangle"

    names(object) <- c("x1", "y1", "x2", "y2")

    object

    }

    circle <- function(x, y, r) {

    object <- c(x, y, r)

    class(object) <- "circle"

    names(object) <- c("x", "y", "r")

    object

    }

    composite <- function(...) {

    object <- list(...)

    class(object) <- "composite"

    object

    }

    ```


    We just implement the graphical objects as vectors, except for the composite that
    we represent as a list so it can contain different types of other graphical objects.
    The points are just vectors of coordinates, the rectangles are represented by
    two coordinates, the rectangle’s lower left and upper right corners, and circles
    are represented by a center point and a radius.


    For the `draw` methods, we can just use basic graphics functions:


    ```

    draw.point <- function(object) {

    points(object["x"], object["y"])

    }

    draw.rectangle <- function(object) {

    rect(object["x1"], object["y1"], object["x2"], object["y2"])

    }

    draw.circle <- function(object) {

    plotrix::draw.circle(object["x"], object["y"], object["r"])

    }

    draw.composite <- function(object) {

    invisible(Map(draw, object))

    }

    ```


    We can use basic graphics functions except for the circles, where we use the `draw.circle`
    function from the `plotrix` package for convenience. For the collection class,
    we just call `draw` on all of the collection’s components. We wrap the call to
    `Map` in `invisible` because we don’t want to print a list of objects every time
    we call the function on the command prompt, but otherwise the implementation is
    straightforward.


    With these functions, we can construct plots of graphical elements, see Figure
    [2-3](#A451015_1_En_2_Chapter.html#Fig3).


    ![A451015_1_En_2_Fig3_HTML.gif](A451015_1_En_2_Fig3_HTML.gif)


    Figure 2-3.


    Plot of graphical elements


    ```

    plot(c(0, 10), c(0, 10),

    type = ''n'', axes = FALSE, xlab = '''', ylab = '''')

    draw(point(5,5))

    draw(rectangle(2.5, 2.5, 7.5, 7.5))

    draw(circle(5, 5, 4))

    corners <- composite(point(2.5, 2.5), point(2.5, 7.5),

    point(7.5, 2.5), point(7.5, 7.5))

    draw(corners)

    ```


    Here we have to set the size of the plot so it actually contains the elements
    we want to display. We have the `bounding_box` function for calculating what that
    area is, and we can implement the different methods like this:


    ```

    bounding_box.point <- function(object) {

    c(object["x"], object["y"], object["x"], object["y"])

    }

    bounding_box.rectangle <- function(object) {

    c(object["x1"], object["y1"], object["x2"], object["y2"])

    }

    bounding_box.circle <- function(object) {

    c(object["x"] - object["r"], object["y"] - object["r"],

    object["x"] + object["r"], object["y"] + object["r"])

    }

    bounding_box.composite <- function(object) {

    if (length(object) == 0) return(c(NA, NA, NA, NA))

    bb <- bounding_box(object[[1]])

    x1 <- bb[1]

    y1 <- bb[2]

    x2 <- bb[3]

    y2 <- bb[4]

    for (element in object) {

    bb <- bounding_box(element)

    x1 <- min(x1, bb[1])

    y1 <- min(y1, bb[2])

    x2 <- max(x2, bb[3])

    y2 <- max(y2, bb[4])

    }

    c(x1, y1, x2, y2)

    }

    ```


    With that, we can collect all the graphical elements we wish to plot in a composite
    object and calculate the bounding box before we plot.


    ```

    all <- composite(

    point(5,5),

    rectangle(2.5, 2.5, 7.5, 7.5),

    circle(5, 5, 4),

    composite(point(2.5, 2.5), point(2.5, 7.5),

    point(7.5, 2.5), point(7.5, 7.5))

    )

    bb <- bounding_box(all)

    plot(c(bb[1], bb[3]), c(bb[2], bb[4]),

    type = ''n'', axes = FALSE, xlab = '''', ylab = '''')

    draw(all)

    ```


    The result is, of course, just the same as seen in Figure [2-3](#A451015_1_En_2_Chapter.html#Fig3).'
  trans: "\n### 另一个示例：图形对象\n\n类层次结构所依赖的“is-a”关系，比仅仅拥有抽象类及其实现要灵活得多。它为我们提供了一种建模方式，来表现某些对象确实属于不同但相关的类，同时也提供了一种机制，让我们可以将接口视为其他接口的特化。\n\
    \n例如，考虑一个应用程序，我们在其中操作一些图形对象——也许是作为某个新可视化包的一部分。这个应用程序中最基础的类是 `GraphicalObject`，它的对象可以被\
    \ `draw`（绘制）。能够绘制对象是我们处理图形对象所需的最基本操作。图形对象还有一个“边界框”（bounding box）——一个能够告诉我们图形大小的矩形，这在绘制对象时可能是必需的。\n\
    \n这个类是抽象的，不仅是因为我们正在定义一个接口以便拥有不同的实现（就像我们处理栈那样），更是因为在如此抽象的层级上拥有一个图形接口并没有实际意义。一个具体到确实可以拥有其实例对象的类是\
    \ `Point`（点），它代表单个点的图形对象。其他类可以是 `Circle`（圆）和 `Rectangle`（矩形）。\n\n为了便于处理多个图形对象，我们还在接口中提供了一个类\
    \ `Composite`（组合），用于捕获一组图形对象。\n\n![A451015_1_En_2_Fig2_HTML.gif](img/A451015_1_En_2_Fig2_HTML.gif)\n\
    \n图 2-2. 图形对象的类层次结构。从 `Composite` 指向 `GraphicalObject` 的箭头（起点为菱形，终点为箭头）表示 `Composite`\
    \ 由一组 `GraphicalObject` 组成。\n\n将一个对象集合视为与其组件同类的对象，是一种所谓的**设计模式**（design pattern），它使得在此应用程序中处理复杂图形变得更加容易。我们可以将图形对象分组到一个层次结构中——类似于在绘图工具中对对象进行分组——并且我们无需在代码中显式检查当前操作的是单个对象还是一个对象集合。一个对象集合本身也是一个图形对象，我们可以直接将其当作图形对象来处理。\n\
    \n实现这个类层次结构相当直接。抽象类 `GraphicalObject` 并没有显式表示，但我们需要将其方法作为泛型函数来使用。\n\n```\ndraw\
    \ <- function(object) UseMethod(\"draw\")\nbounding_box <- function(object) UseMethod(\"\
    bounding_box\")\n```\n\n在构造图形对象时，我们需要设置它们的类，以下是具体类的构造函数：\n\n```\npoint <- function(x,\
    \ y) {\n  object <- c(x, y)\n  class(object) <- \"point\"\n  names(object) <-\
    \ c(\"x\", \"y\")\n  object\n}\nrectangle <- function(x1, y1, x2, y2) {\n  object\
    \ <- c(x1, y1, x2, y2)\n  class(object) <- \"rectangle\"\n  names(object) <- c(\"\
    x1\", \"y1\", \"x2\", \"y2\")\n  object\n}\ncircle <- function(x, y, r) {\n  object\
    \ <- c(x, y, r)\n  class(object) <- \"circle\"\n  names(object) <- c(\"x\", \"\
    y\", \"r\")\n  object\n}\ncomposite <- function(...) {\n  object <- list(...)\n\
    \  class(object) <- \"composite\"\n  object\n}\n```\n\n我们将图形对象实现为向量，除了组合对象用列表表示，以便它能包含不同类型的其他图形对象。点只是坐标向量，矩形由两个坐标（左下角和右上角）表示，圆则由中心点和半径表示。\n\
    \n对于 `draw` 方法，我们可以直接使用基本的图形函数：\n\n```\ndraw.point <- function(object) {\n  points(object[\"\
    x\"], object[\"y\"])\n}\ndraw.rectangle <- function(object) {\n  rect(object[\"\
    x1\"], object[\"y1\"], object[\"x2\"], object[\"y2\"])\n}\ndraw.circle <- function(object)\
    \ {\n  plotrix::draw.circle(object[\"x\"], object[\"y\"], object[\"r\"])\n}\n\
    draw.composite <- function(object) {\n  invisible(Map(draw, object))\n}\n```\n\
    \n除了圆（为了方便，我们使用了 `plotrix` 包中的 `draw.circle` 函数），我们可以使用基本的图形函数。对于集合类，我们只需对集合中的所有组件调用\
    \ `draw`。我们将对 `Map` 的调用包装在 `invisible` 中，是因为我们不希望在命令行调用该函数时每次都打印出一个对象列表，否则实现是直接的。\n\
    \n利用这些函数，我们可以构建图形元素的绘图，见图 2-3。\n\n![A451015_1_En_2_Fig3_HTML.gif](img/A451015_1_En_2_Fig3_HTML.gif)\n\
    \n图 2-3. 图形元素绘图\n\n```\nplot(c(0, 10), c(0, 10),\n     type = 'n', axes = FALSE,\
    \ xlab = '', ylab = '')\ndraw(point(5,5))\ndraw(rectangle(2.5, 2.5, 7.5, 7.5))\n\
    draw(circle(5, 5, 4))\ncorners <- composite(point(2.5, 2.5), point(2.5, 7.5),\n\
    \                     point(7.5, 2.5), point(7.5, 7.5))\ndraw(corners)\n```\n\n\
    这里我们必须设置绘图区域的大小，使其能真正包含我们想要显示的元素。我们有 `bounding_box` 函数用于计算该区域，并且可以像这样实现不同的方法：\n\
    \n```\nbounding_box.point <- function(object) {\n  c(object[\"x\"], object[\"\
    y\"], object[\"x\"], object[\"y\"])\n}\nbounding_box.rectangle <- function(object)\
    \ {\n  c(object[\"x1\"], object[\"y1\"], object[\"x2\"], object[\"y2\"])\n}\n\
    bounding_box.circle <- function(object) {\n  c(object[\"x\"] - object[\"r\"],\
    \ object[\"y\"] - object[\"r\"],\n    object[\"x\"] + object[\"r\"], object[\"\
    y\"] + object[\"r\"])\n}\nbounding_box.composite <- function(object) {\n  if (length(object)\
    \ == 0) return(c(NA, NA, NA, NA))\n  bb <- bounding_box(object[[1]])\n  x1 <-\
    \ bb[1]\n  y1 <- bb[2]\n  x2 <- bb[3]\n  y2 <- bb[4]\n  for (element in object)\
    \ {\n    bb <- bounding_box(element)\n    x1 <- min(x1, bb[1])\n    y1 <- min(y1,\
    \ bb[2])\n    x2 <- max(x2, bb[3])\n    y2 <- max(y2, bb[4])\n  }\n  c(x1, y1,\
    \ x2, y2)\n}\n```\n\n有了它，我们可以将所有希望绘制的图形元素收集到一个组合对象中，并在绘制前计算边界框。\n\n```\nall <-\
    \ composite(\n  point(5,5),\n  rectangle(2.5, 2.5, 7.5, 7.5),\n  circle(5, 5,\
    \ 4),\n  composite(point(2.5, 2.5), point(2.5, 7.5),\n            point(7.5, 2.5),\
    \ point(7.5, 7.5))\n)\nbb <- bounding_box(all)\nplot(c(bb[1], bb[3]), c(bb[2],\
    \ bb[4]),\n     type = 'n', axes = FALSE, xlab = '', ylab = '')\ndraw(all)\n```\n\
    \n当然，结果与图 2-3 所示完全相同。\n"
- fmt: '# Class Hierarchies As Interfaces with Refinements


    In the examples so far, we have had an abstract class defining an interface and
    then different concrete classes implementing it. In the case of the stack, the
    different implementations gave us different time-complexity tradeoffs, but the
    different implementations were conceptually all just stacks. In the case of the
    graphical objects, the various concrete classes were conceptually different objects,
    just objects that can all be treated as graphical objects and thus manipulated
    through the general interface. These are common patterns in software design, but
    when sub-classes (such as the different types of graphical objects) represent
    different conceptual classes, they can often also extend the interface.


    Take, for instance, statistical models. These are usually implemented as classes
    that implement some generic functions, such as `predict` or `coef`, that give
    us a uniform interface to models and make it possible to switch between different
    models in analysis without major rewrites of our analysis code. The generic functions
    implemented by all models give us an interface for the most abstract kind of models.
    All models must implement `predict` and `coef`, for example, for us to be able
    to use them as drop-in replacements in our analysis code, but different types
    of models might add additional functionality to this interface that is not relevant
    for all models. We could, for example, imagine that decision trees add functionality
    for pruning trees, e.g. a function `prune`. If all decision tree implementations
    have a `prune` function, we can replace the implementation of decision trees and
    still reuse our code, but because `prune` is not implemented for all models, we
    can only replace one implementation of a decision tree with another decision tree,
    not any kind of model. We would say that decision trees are specializations of
    models. All decision trees are models, but not all models are decision trees.
    In term of classes, we would have a super-class for models and a sub-class for
    decision trees that adds to the interface of models functions such as `prune`.
    If we have different implementations of decision trees, the decision tree class
    would typically also be abstract, and different implementations would inherit
    from this class rather than the more general model class (see Figure [2-4](#A451015_1_En_2_Chapter.html#Fig4)).


    ![A451015_1_En_2_Fig4_HTML.gif](A451015_1_En_2_Fig4_HTML.gif)


    **Figure 2-4.** Hierarchy of models where decision trees are specializations of
    the `Model` class that adds the `prune` function and gives us an additional abstract
    class that instances of decision trees must implement


    As another example, we can consider a bibliography, which is essentially a list
    of publications. There are different kinds of publications, but all have at least
    a name and one or more authors, so the most abstract way of representing publications
    would just have those two attributes. One thing we might want to do with a list
    of publications is to calculate bibliometrics, such as how many citations a publication
    has. If each publication has a list of other works it cites, then we could calculate
    this from a database of all relevant publications. If we have a list of all publications
    a given author has created, we could also calculate how many citations this particular
    author has received or derive statistics such as the h-index.


    There are different types of publications, so we can create sub-classes for books
    and articles, for example. A book will have an associated publisher and an ISBN
    while journal articles will have an associated journal and (typically) the page-numbers
    in the journal where the article can be found. If we, for simplicity, only allow
    those two types of publications, we can represent it as the class hierarchy shown
    in Figure [2-5](#A451015_1_En_2_Chapter.html#Fig5).


    ![A451015_1_En_2_Fig5_HTML.gif](A451015_1_En_2_Fig5_HTML.gif)


    **Figure 2-5.** Hierarchy of bibliography objects. The generic `Publication` class
    gives each publication a name and a list of authors and a list of other publications
    cited. Two concrete types of publications, `Article` and `Book`, add extra attributes.


    In this hierarchy, all the functions simply access attributes of objects; that
    is, they just extract data that is stored in these. Accessing attributes via functions,
    as opposed to accessing lists or vectors that are part of an object’s representation,
    is generally a good idea. It allows you to change how you represent data without
    having to change any code besides the accessor function. If your code only accesses
    your objects through functions, then you have encapsulated the implementation
    details, and updating your code later will be much simpler than it would otherwise
    be.


    Notice also that none of the accessor functions needs to differ between the two
    concrete types of publications. The abstract `Publication` class accesses `name`
    and `authors` and the additional attributes provided in the other classes are
    disjunct. Because of this, there is no need to have generic functions for implementing
    this class hierarchy. We can do it using just plain old functions.


    ```

    # publication interface

    publication <- function(name, authors, citations) {

    structure(list(name = name, authors = authors,

    citations = citations),

    class = "publication")

    }

    name <- function(pub) pub$name

    authors <- function(pub) pub$authors

    # articles

    article <- function(name, authors, citations, journal, pages) {

    structure(list(name = name, authors = authors,

    citations = citations,

    journal = journal, pages = pages),

    class = c("article", "publication"))

    }

    journal <- function(pub) pub$journal

    pages <- function(pub) pub$pages

    # book

    book <- function(name, authors, citations, publisher, ISBN) {

    structure(list(name = name, authors = authors,

    citations = citations,

    publisher = publisher, ISBN = ISBN),

    class = c("book", "publication"))

    }

    publisher <- function(pub) pub$publisher

    ISBN <- function(pub) pub$ISBN

    ```


    Generic functions are perfect for getting different behavior in different classes
    for the same conceptual operation, but when we can get the action we desire using
    plain old functions there is no reason to invoke generic functions.


    The implementation of publications is straightforward except when it comes to
    the `class` attributes set in the constructor functions. Here we set the classes
    to lists of class names instead of just the class names. This is how we specify
    that a `"book"` object or an `"article"` object is also a `"publication"` object.
    The design we have in mind requires that books and articles are publications,
    but since S3 classes are just names represented as strings, we cannot make this
    explicit in R. Instead we represent the class hierarchy by having the `class`
    attributes be lists of class names, going up the hierarchy from the most specialized
    to the most abstract object. How R interprets such a list of class names, and
    how it uses it to find the right implementations of generic functions, is the
    topic of the next chapter.


    It is not uncommon to have a class hierarchy similar to the one we made here for
    publications, but there are some slight problems with it. To access book-specific
    attributes, you need to know that the object you are working on is a book; treating
    publications in aggregates without having to write specialized code for dealing
    with books or articles is the purpose of using object-orientation and having the
    publication hierarchy to begin with. There is nothing wrong with having a class
    hierarchy where sub-classes add functions to the interface of their superclass,
    but if you find yourself writing such a hierarchy, you should think carefully
    about how objects from the hierarchy should be accessed and manipulated.'
