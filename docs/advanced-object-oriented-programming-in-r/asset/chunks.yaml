    stack\n## Stack elements:\n## [1] 3 2 1\nwhile (!stack$is_empty()) stack$pop()\n\
    stack\n## Stack elements:\n## numeric(0)\n```\n\nThe chained call to `push` here\
    \ is possible because the `push` method returns the object itself. Unlike the\
    \ previous implementations where `push` returns a new object, for the R6 object,\
    \ the existing object is modified. We do not need to assign the result of the\
    \ three `push` calls back to `stack`, and we do not need to assign the calls to\
    \ `pop` back to `stack` either. Returning the object itself in these functions\
    \ allows us to chain method calls, but that is all this does. The R6 object is\
    \ not immutable.\n\n### Object Initialization\n\nIf we want to set attributes\
    \ of objects when constructing them, we need to do a little more work than in\
    \ S4\\. We cannot just use named arguments in the constructor; this call would\
    \ give us an error:\n\n```\nstack <- VectorStack$new(elements = 1:4)\n```\n\n\
