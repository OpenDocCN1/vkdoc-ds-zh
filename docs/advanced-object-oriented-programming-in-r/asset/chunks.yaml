- fmt: '## Dispatching on Type-Signatures


    The signatures we have used so far when defining specialized methods consisted
    of just a class name. If we use them this way, S4 methods work just as S3 generic
    functions, but the dispatch mechanism for S4 methods is more general than this
    and it is possible to dispatch based on the type of all a function’s arguments.


    For example, we can define a function `f` of two arguments and refine it in different
    ways based on the type of the two arguments. We could have, say, one version when
    the arguments are numeric and another when they are logical.


    ```

    setGeneric("f", def = function(x, y) standardGeneric("f"))

    setMethod("f", signature = c("numeric", "numeric"),

    definition = function(x, y) x + y)

    setMethod("f", signature = c("logical", "logical"),

    definition = function(x, y) x & y)

    ```


    When calling `f`, the appropriate function is then selected based on the type
    of the arguments.


    ```

    f(2, 3)

    ## [1] 5

    f(TRUE, FALSE)

    ## [1] FALSE

    ```


    The type matching goes from most specific to most abstract, following class hierarchies
    for classes, and would match integer over numeric over complex for numerical values.
    So, if we define a version of `f` that matches integers for the first value, it
    will call that one when we give it an integer and the version defined above when
    we call it with `numeric` values.


    ```

    setMethod("f", signature = c("integer", "complex"),

    definition = function(x, y) x - y)

    f(2, 2)

    ## [1] 4

    f(as.integer(2), 2)

    ## [1] 4

    ```


    Here, the second argument would catch any complex number, but we can specialize
    it to match integers and numeric instead:


    ```

    setMethod("f", signature = c("integer", "numeric"),

    definition = function(x, y) 2*x + y)

    f(as.integer(2), 2)

    ## [1] 6

    ```


    If we just give the signature a single string, as we did in the cases with classes
    earlier, it just dispatches on the type of the first argument.


    ```

    setMethod("f", signature = "character",

    definition = function(x, y) x)

    f("foo", "bar")

    ## [1] "foo"

    ```


    In general, the signature list just matches types for a prefix of parameters if
    you do not provide types for all of them.


    ```

    setGeneric("g", def = function(x, y, z) standardGeneric("g"))

    setMethod("g", signature = "character",

    definition = function(x, y, z) "g(character)")

    setMethod("g", signature = c("numeric", "character"),

    definition = function(x, y, z) "g(numeric, character)")

    g("foo", NA, NA)

    ## [1] "g(character)"

    g(12, "bar", NA)

    ## [1] "g(numeric, character)"

    ```


    If you want to match any type whatsoever, you can use the type `"ANY"`.


    ```

    setMethod("f", signature = "ANY",

    definition = function(x, y) "any")

    f(list(), NULL)

    ## [1] "any"

    ```


    This can be used to define a catch-all default implementation for when no more
    specific implementation matches the arguments.


    You can even match for cases when some arguments are not provided, using the type
    `"missing"`.


    ```

    setMethod("f", signature = c("ANY", "missing"),

    definition = function(x, y) "missing")

    f(list(), NULL)

    ## [1] "any"

    f(list())

    ## [1] "missing"

    ```


    Here, the first call matches the version that takes any arguments because the
    second argument is not missing, it is just `NULL`, while the other matches the
    more specific signature where the second argument is missing.


    ## Operator Overloading


    S4 also supports operator overloading and in much the same way as S3 does, just
    using the method mechanism for generic methods. We can try implementing the modulus
    class as an S4 class like this:


    ```

    modulus <- setClass("modulus",

    slots = c(

    value = "numeric",

    n = "numeric"

    ))

    setMethod("show", signature = "modulus",

    definition = function(object) {

    cat("Modulus", object@n, "values:\n")

    print(object@value)

    })

    (x <- modulus(value = 1:6, n = 3))

    ## Modulus 3 values:

    ## [1] 1 2 3 4 5 6

    ```


    The `show` method we implemented here is the S4 equivalent of `print` and we use
    it to pretty-print `modulus` objects.


    If we then want to implement a single operator, we can specialize the method for
    it, just as we did with generic functions for S3. But we can use the signature
    type matching to capture different combinations of arguments, instead of writing
    type-checking code at the beginning of the generic function as we had to for S3.


    Below we handle the three cases we want for modulus arithmetic: the case where
    both operands are `modulus` objects and the two cases where one of them is a `modulus`
    object and the other is `numeric`.


    ```

    setMethod("+", signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = e1@value + e2@value,

    n = e1@n)

    })

    setMethod("+", signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = e1@value + e2,

    n = e1@n)

    })

    setMethod("+", signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = e1 + e2@value,

    n = e2@n)

    })

    ```


    Now we can combine `numeric` and `modulus` in addition, and we didn’t have to
    explicitly check the type in the functions since the type dispatch handled that
    for us.


    ```

    x + 1:6

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    1:6 + x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    We also handle the case with two `modulus` objects and check that their `n` slots
    are equal.


    ```

    y <- modulus(value = 1:6, n = 2)

    x + y

    ## Error in x + y: Incompatible modulus

    y <- modulus(value = 1:6, n = 3)

    x + y

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```


    We also have function group solutions in S4, and for defining arithmetic operations,
    we need the group `Arith`. This works much as the `Ops` generic function in S3
    except that we, again, can use type matching instead of explicitly checking the
    type of the arguments inside the function(s).


    ```

    setMethod("Arith",

    signature = c("modulus", "modulus"),

    definition = function(e1, e2) {

    if (e1@n != e2@n) stop("Incompatible modulus")

    modulus(value = callGeneric(e1@value, e2@value),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("modulus", "numeric"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1@value, e2),

    n = e1@n)

    })

    setMethod("Arith",

    signature = c("numeric", "modulus"),

    definition = function(e1, e2) {

    modulus(value = callGeneric(e1, e2@value),

    n = e2@n)

    })

    x * y

    ## Modulus 3 values:

    ## [1]  1  4  9 16 25 36

    2 * x

    ## Modulus 3 values:

    ## [1]  2  4  6  8 10 12

    ```'
