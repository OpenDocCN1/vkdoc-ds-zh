    aspect of writing reusable software. You might not think of R as a language where
    you implement algorithms, but whenever you write a data analysis pipeline, whenever
    you manipulate data frames, and whenever you fit a model, you can think of that
    as implementing or using an algorithm. We want our data analysis to be efficient,
