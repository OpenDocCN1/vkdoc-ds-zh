    # 处理 `units` 的运算符


    处理 `units` 的运算符仅比处理 `modulus` 稍显复杂。我们需要区分两种运算符：一种要求单位匹配，另一种则需要构造新单位。前者是加法、减法和比较运算（假设我们只认为在数量和关联单位上都一致的数值相等）；后者是乘法和除法，其结果单位必须根据操作数计算得出。如何处理物理量上的逻辑运算符并不明确（如果这甚至有意义的话），因此对于不属于这两类的运算符，我们应默认使用底层类型的处理方式。


    我们使用 `Ops` 组函数来实现这些运算符。在此函数内部，我们可以通过变量 `.Generic` 获取正在评估的实际运算符。这不是函数的参数，但在函数被调用时会被设置为正在评估的运算符，我们可以通过
    switch 检查该运算符并进行相应处理。


    ```

    Ops.units =", ">")) {

    if (!is.null(su1) && !is.null(su2) && su1 != su2)

    stop("Incompatible units")

    su <- ifelse(!is.null(su1), su1, su2)

    return(NextMethod())

    }

    if (.Generic == "*" || .Generic == "/") {

    if (is.null(su1))

    su1 <- symbolic_unit("")

    if (is.null(su2))

    su2 <- symbolic_unit("")

    su <- switch(.Generic, "*" = su1 * su2, "/" = su1 / su2)

    result <- NextMethod()

    attr(result, "units") <- su

    return(result)

    }

    # 对于剩余运算符，我们没有很好的方法处理单位，

    # 因此移除该信息，回归到数值本身

    e1 <- unclass(e1)

    e2 <- unclass(e2)

    attributes(e1) <- attributes(e2) <- NULL

    NextMethod()

    }

    ```


    通过这种单位运算符的定义，我们可以将单位与标量结合：


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x + 2

    ## Units:  m / 1

    ## [1] 3 4 5 6 7 8

    x - 2

    ## Units:  m / 1

    ## [1] -1  0  1  2  3  4

    ```


    如果我们尝试将两个类型不兼容的量相加，将会收到警告，提示这是不正确的。


    ```

    (y <- units(1:6, "m", "s"))

    ## Units:  m / s

    ## [1] 1 2 3 4 5 6

    x + y

    ## Error in Ops.units(x, y): Incompatible units

    ```


    然而，当单位兼容时，我们可以进行加法和减法。


    ```

    (z <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    x + z

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x - z

    ## Units:  m / 1

    ## [1] 0 0 0 0 0 0

    ```


    乘法和除法始终允许进行，结果单位由操作数推导得出。


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x * y

    ## Units:  m*m / s

    ## [1]  1  4  9 16 25 36

    x / y

    ## Units:  m*s / m

    ## [1] 1 1 1 1 1 1

    ```


    # S4 类


    S3 类体系是面向对象编程的狂野西部。类层次结构仅通过 `class` 属性隐式存在，泛型方法可由任何类实现或不实现，且无需检查接口和类层次结构设计是否正确实现。一切都依赖于约定，确保任何类似一致性的工作完全由程序员负责。


    S3 系统之所以流行，是因为它非常易于使用和编写新类。在大多数情况下，我们倾向于简单而非复杂的设计，而在这些情况下，S3 完美满足我们的需求。当我们实现一个新的统计模型时，很少需要复杂的类层次结构。大多数抽象数据结构只有少数相关操作，在编写具体版本时记住全部实现也没有问题。然而，当软件达到一定复杂度时，就需要更多的结构。与其让设计仅隐式存在于编程约定中，我们希望它在代码中被明确陈述。


    S4 系统提供了一个结构更严谨的面向对象系统。在这里，类和类层次结构是显式创建的；它们不仅仅是 `class` 属性中的字符串。为了获得 S4 允许的附加结构，在创建类和方法时需要多写一些代码，但整体系统与
    S3 非常相似。如果你熟悉 S3，那么学习 S4 应该不成问题。


    ## 定义 S4 类


    在 S4 中，类是显式创建的。要创建一个新类，我们使用 `methods` 包中的 `setClass` 函数。该函数接受一些参数，用于指定该类对象应包含哪些属性、属性应具有的默认值、该类如何融入类层次结构，以及创建类的许多其他属性。所有这些属性都有默认值，因此我们只需指定类名即可创建新类。


    作为示例，我们考虑之前用 S3 实现的栈数据结构。要创建一个抽象栈类，我们可以这样写：


    ```

    library(methods)

    Stack <- setClass("Stack")

    ```


    这将创建一个名为 `"Stack"` 的新类。我们没有指定该类的任何属性，因此 S4 会假定它是一个不应被实例化的抽象类，如果我们尝试实例化，将会报错。


    我们可以像这样创建基于向量的栈类：


    ```

    VectorStack <- setClass("VectorStack",

    slots = c(

    elements = "vector"

    ),

    contains = "Stack")

    ```


    这里我们为 `setClass` 使用了两个参数：`slots` 和 `contains`。`slots` 参数是该类对象应具有的属性列表。这里指定它应包含一个名为
    `elements` 的向量。`contains` 参数指定新类应具有哪些超类。我们将 `VectorStack` 设为 `Stack` 的子类。


    由于 `VectorStack` 具有槽（slots），它不被视为抽象类（我们可以通过向 `contains` 参数添加 `"VIRTUAL"` 来显式使其抽象，但我们希望能够实例化它）。我们可以通过调用
    `VectorStack` 来创建该类对象。


    ```

    (vs <- VectorStack())

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## logical(0)

    ```


    我们可以将 `elements` 作为命名参数传递给 `VectorStack`。


    ```

    (vs <- VectorStack(elements = 1:4))

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```


    此处不能使用位置参数；必须是命名参数。


    一旦有了 `VectorStack` 类的对象，我们可以使用以下符号访问元素：


    ```

    vs@elements

    ## [1] 1 2 3 4

    ```


    通常，`@` 用于访问 S4 对象的槽。


    捕获 `setClass` 的结果并将其作为构造函数使用，是我个人创建 S4 构造器的首选方式，但严格来说这不是必需的。一旦用 `setClass` 构建了类，你就可以使用函数
    `new`，仅通过类名来创建对象。


    ```

    new("VectorStack", elements = 1:4)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```

