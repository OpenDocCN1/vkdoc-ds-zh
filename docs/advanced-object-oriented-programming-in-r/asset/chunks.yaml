    # 类与泛型函数


    R 实现面向对象编程的方式是通过泛型函数和类。如引言所述，R 实际上有三种系统来实现这一点，分别称为 `S3`、`S4` 和 `R6`。在本章中，我将只描述三者中最简单的
    `S3` 系统，但在后续章节中会介绍另外两种系统。

