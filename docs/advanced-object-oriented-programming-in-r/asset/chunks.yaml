    处理 `units` 的运算符比处理 `modulus` 稍显复杂。我们需要区分两种运算符：一种是要求单位必须匹配的，另一种是需要构造新单位的。前者包括加法、减法和比较运算（假设我们仅当数值及其关联单位均一致时才认为它们相等）；后者包括乘法和除法，其结果的单位必须由操作数计算得出。对于逻辑运算符如何处理物理量（如果确实有意义的话）并不显而易见，因此对于不属于这两类范畴的运算符，我们应该默认采用底层类型的处理方式。


    我们利用 `Ops` 组函数来实现这些运算符。在该函数内部，我们可以通过变量 `.Generic` 访问当前正在被求值的实际运算符。这不是函数的参数，但当函数被调用时，它会被设置为正在求值的运算符，我们可以通过
    `switch` 语句来检查并妥善处理。


    ```

    Ops.units =", ">")) {

    if (!is.null(su1) && !is.null(su2) && su1 != su2)

    stop("Incompatible units")

    su <- ifelse(!is.null(su1), su1, su2)

    return(NextMethod())

    }

    if (.Generic == "*" || .Generic == "/") {

    if (is.null(su1))

    su1 <- symbolic_unit("")

    if (is.null(su2))

    su2 <- symbolic_unit("")

    su <- switch(.Generic, "*" = su1 * su2, "/" = su1 / su2)

    result <- NextMethod()

    attr(result, "units") <- su

    return(result)

    }

    # 对于其余运算符，我们并无良策处理单位

    # 因此我们剥离单位信息，回归到数值运算

    e1 <- unclass(e1)

    e2 <- unclass(e2)

    attributes(e1) <- attributes(e2) <- NULL

    NextMethod()

    }

    ```


    通过如此定义的单位运算符，我们可以将单位与标量结合：


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x + 2

    ## Units:  m / 1

    ## [1] 3 4 5 6 7 8

    x - 2

    ## Units:  m / 1

    ## [1] -1  0  1  2  3  4

    ```


    如果我们尝试相加两个单位不兼容的量，将会收到错误信息。


    ```

    (y <- units(1:6, "m", "s"))

    ## Units:  m / s

    ## [1] 1 2 3 4 5 6

    x + y

    ## Error in Ops.units(x, y): Incompatible units

    ```


    然而，当单位兼容时，我们便可以进行加减运算。


    ```

    (z <- units(1:6, "m"))

    ## Units:  m / 1

    ## [1] 1 2 3 4 5 6

    x + z

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x - z

    ## Units:  m / 1

    ## [1] 0 0 0 0 0 0

    ```


    乘法和除法始终是允许的，结果的单位由操作数推导得出。


    ```

    2 * x

    ## Units:  m / 1

    ## [1]  2  4  6  8 10 12

    x * y

    ## Units:  m*m / s

    ## [1]  1  4  9 16 25 36

    x / y

    ## Units:  m*s / m

    ## [1] 1 1 1 1 1 1

    ```


    # S4 类


    S3 类系统是面向对象编程的“蛮荒西部”。类的层次结构仅通过 `class` 属性隐式存在，任何类都可以任意实现或不实现泛型方法，而无需检查接口和类层次结构是否被正确设计。一切都依赖于约定俗成，完全依赖程序员来确保任何形式的系统一致性。


    S3 系统因其极其简单易用、易于编写新类而广受欢迎。在大多数情况下，我们追求简洁性而非复杂的设计，S3 在这些场景下完全能满足需求。当我们实现一个新的统计模型时，很少需要一个复杂的类层次结构。大多数抽象数据结构只有少数几个关联操作，在编写具体实现时，要记住并实现所有这些操作并不困难。然而，一旦软件复杂度达到一定程度，就需要更多的结构化支持。我们不希望设计仅仅存在于编程约定中，而是希望在代码中将其明确阐述。


    S4 系统提供了一个结构更严谨的面向对象系统。在此，类和类层次结构被显式创建；它们不仅仅是 `class` 属性中的一个字符串。为了获得 S4 所允许的额外结构，在创建类和方法时需要多写一点代码，但总的来说，该系统的工作方式与
    S3 非常相似。如果你熟悉 S3，那么学习 S4 应该没有问题。


    ## 定义 S4 类


    在 S4 中，类是显式创建的。要创建新类，我们使用 `methods` 包中的 `setClass` 函数。该函数接受参数来指定该类对象应具有的属性、属性的默认值、该类如何融入类层次结构，以及所创建类的许多其他属性。所有这些属性都有默认值，因此我们可以仅通过指定类名来创建一个新类。


    作为一个示例，我们考虑之前用 S3 实现的栈数据结构。要创建一个抽象栈类，我们可以这样写：


    ```

    library(methods)

    Stack <- setClass("Stack")

    ```


    这将创建一个名为 `"Stack"` 的新类。我们没有指定类的任何属性，因此 S4 会假设它是一个不应被实例化的抽象类，如果我们尝试实例化，将会出错。


    我们可以像这样创建基于向量的栈类：


    ```

    VectorStack <- setClass("VectorStack",

    slots = c(

    elements = "vector"

    ),

    contains = "Stack")

    ```


    这里我们向 `setClass` 传递了两个参数：`slots` 和 `contains`。`slots` 参数是该类对象应具有的属性列表。这里指定它应包含一个名为
    `elements` 的向量。`contains` 参数指定新类应继承哪些超类。我们将 `VectorStack` 设为 `Stack` 的子类。


    由于 `VectorStack` 具有槽，它不被视为抽象类（我们可以通过向 `contains` 参数添加 `"VIRTUAL"` 来显式使其成为抽象类，但我们确实希望能够实例化它）。我们可以通过调用
    `VectorStack` 来创建该类的对象。


    ```

    (vs <- VectorStack())

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## logical(0)

    ```


    我们可以将 `elements` 作为命名参数传递给 `VectorStack`。


    ```

    (vs <- VectorStack(elements = 1:4))

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```


    位置参数在此不适用；必须是命名参数。


    一旦我们有了一个 `VectorStack` 类的对象，我们可以使用以下符号访问其元素：


    ```

    vs@elements

    ## [1] 1 2 3 4

    ```


    通常，`@` 用于访问 S4 对象的槽。


    捕获 `setClass` 的结果并将其用作构造对象的函数，是我创建 S4 构造函数时首选的方式，但严格来说，这并不是必需的。一旦使用 `setClass`
    创建了一个类，你也可以直接使用类名和 `new` 函数来创建对象。


    ```

    new("VectorStack", elements = 1:4)

    ## An object of class "VectorStack"

    ## Slot "elements":

    ## [1] 1 2 3 4

    ```

