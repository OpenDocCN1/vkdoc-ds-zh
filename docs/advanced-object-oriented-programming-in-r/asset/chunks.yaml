    i.C <- function(x) print("i.C")

    i(x)

    ## [1] "i.A"

    i(y)

    ## [1] "i.B"

    i(z)

    ## [1] "i.C"

    ```


    ## Getting the Hierarchy Correct in the Constructors


    When we created the three classes `A`, `B`, and `C` above we explicitly created
    the class list representing the class hierarchy in each constructor. This is fine
    for a small hierarchy like the one we have here, where we define all three classes
    close together and know that they are supposed to work together, but it does introduce
    a potential source of errors if the code grows into something more complex. For
    example, we might at some point want to put another class into the hierarchy between
    `A` and `B`. We might remember to update the class list for `B`, but will we also
    remember to update it for `C`? If `C` is in a different file, perhaps, and we
    haven’t modified it in years?


    Since the class hierarchy is entirely represented in these class lists—there is
    no explicit hierarchy, but only these implicit lists—we must be extra careful
    to ensure that our code always matches our design. We should avoid explicitly
    representing the hierarchy in every constructor.


    One way to ensure this is to always invoke the immediate superclass constructor
    when you define a new class. R doesn’t know anything about class hierarchies,
    and it doesn’t know which superclass you have until after you have created the
    `class` list. Consequently, there is no automatic way of doing this; you must
    manually call the constructor of the superclass, obtain an object this way, and
    then prepend the new class name to its `class` list.


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    this <- A()

    class(this) <- c("B", class(this))

    this

    }

    C <- function() {

    this <- B()

    class(this) <- c("C", class(this))

    this

    }

    ```


    Using this programming idiom also saves you from another potential error source.
    The constructor of a class often creates an object with attributes that it expects
    to be in a consistent state in its functions. If you do not call the constructor,
    but set up these attributes in the constructor of a subclass, you might violate
    invariants the superclass depends upon. You will probably be careful not to do
    that when you write the subclass constructor, but the superclass implementation
    could be changed in the future. When that happens, the subclass implementation
    could be broken. It is hell to try to debug an error that shows up because the
    code has changed in an entirely different location in the code.


    You are generally better off if you always call the constructor of the superclass
    and then modify the resulting object before you return the object of the subclass.'
  trans: '

    # 类层次结构中的方法查找


    正如我们之前所见，对于泛型函数 `f`，调用 `f(x)` 会使 R 查找名称源自 `class(x)` 的函数。如果 `class(x)` 是单个字符串，例如
    `"A"`，它将查找 `f.A`。如果 R 找到了这样的函数，就会调用它；如果没找到，则会查找 `f.default` 并调用它。否则，若没有 `f.default`，R
    将放弃并返回错误。这是当对象类为单个字符串时 R 的行为。如果它是一个类名序列，R 则会遍历这个序列，并依次尝试为序列中的每个类查找函数。


    考虑下面定义的三个类 `A`、`B` 和 `C`。


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    structure(list(), class = c("B", "A"))

    }

    C <- function() {

    structure(list(), class = c("C", "B", "A"))

    }

    ```


    由于类仅由字符串表示，我们并没有真正显式地定义它们；我们只有三个函数来创建设置了类属性的对象。创建对象的函数被称为构造器，对于 S3 系统来说，这实际上是定义类的唯一方式。


    我们可以创建这些类的实例并检查它们的类。


    ```

    x <- A()

    y <- B()

    z <- C()

    class(x)

    ## [1] "A"

    class(y)

    ## [1] "B" "A"

    class(z)

    ## [1] "C" "B" "A"

    ```


    如果我们定义一个只有默认实现的泛型函数：


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    ```


    对所有三个对象调用它只会得到默认行为。


    ```

    f(x)

    ## [1] "f.default"

    f(y)

    ## [1] "f.default"

    f(z)

    ## [1] "f.default"

    ```


    另一方面，如果我们定义一个具有默认实现和 `A` 类实现的泛型函数，那么对这三个对象调用它都会调用 `A` 函数。


    ```

    g <- function(x) UseMethod("g")

    g.default <- function(x) print("g.default")

    g.A <- function(x) print("g.A")

    g(x)

    ## [1] "g.A"

    g(y)

    ## [1] "g.A"

    g(z)

    ## [1] "g.A"

    ```


    对于 `x`，我们明白为什么会这样。R 查找 `g.A` 并找到了它。而对于 `y`，R 查找 `g.B` 却未找到。如果 `y` 的类只是 `"B"`，那么查找就会结束，R
    会调用 `g.default`。但 `y` 的类既是 `"B"` 又是 `"A"`，所以当 R 找不到 `g.B` 时，它会转而查找 `g.A`。由于 `g.A`
    确实存在，R 就会调用它。类似地，当我们调用 `g(z)` 时，R 首先查找 `g.C`，未找到；接着查找 `g.B`，也未找到；最后发现 `g.A` 存在，于是调用它。因此，这三个调用都指向同一个
    `g.A` 函数。类 `B` 和 `C` 从类 `A` 继承了 `g` 的实现。


    现在，我们尝试添加一个同时对 `A` 和 `B` 类有实现的泛型函数。


    ```

    h <- function(x) UseMethod("h")

    h.default <- function(x) print("h.default")

    h.A <- function(x) print("h.A")

    h.B <- function(x) print("h.B")

    h(x)

    ## [1] "h.A"

    h(y)

    ## [1] "h.B"

    h(z)

    ## [1] "h.B"

    ```


    在这种情况下，调用 `h(x)` 会调用 `h.A`——显然，`x` 的唯一类是 `A` 且 `h.A` 已实现——而调用 `h(y)` 和 `h(z)`
    都会调用 `h.B`。在这两种情况下，类序列中类 `B` 出现在类 `A` 之前，并且因为 `h.B` 存在而被调用，匹配函数的查找就此停止。虽然 `h.A`
    函数存在，但我们在首次匹配后就停止了查找，所以永远不会到达它。


    为了完整性，如果我们添加一个对这三个类都有实现的函数，那么每个类都会被调用其最专门的函数。


    ```

    i <- function(x) UseMethod("i")

    i.default <- function(x) print("i.default")

    i.A <- function(x) print("i.A")

    i.B <- function(x) print("i.B")

    i.C <- function(x) print("i.C")

    i(x)

    ## [1] "i.A"

    i(y)

    ## [1] "i.B"

    i(z)

    ## [1] "i.C"

    ```


    ## 在构造器中正确建立层次结构


    当我们上面创建三个类 `A`、`B` 和 `C` 时，我们在每个构造器中显式创建了代表类层次结构的类列表。对于像这里这样的小型层次结构（所有三个类彼此邻近定义，且我们知道它们应该协同工作）来说，这没问题。但如果代码增长到更复杂的情况，它确实会引入潜在的错误来源。例如，我们可能希望在某个时候将另一个类插入到
    `A` 和 `B` 之间的层次结构中。我们或许记得更新 `B` 的类列表，但我们是否也会记得更新 `C` 的呢？如果 `C` 在不同的文件中，而且我们已经多年没有修改过它了呢？


    由于类层次结构完全由这些类列表表示——没有显式的层次结构，只有这些隐式列表——我们必须格外小心，以确保我们的代码始终符合我们的设计。我们应该避免在每个构造器中显式地表示层次结构。


    确保这一点的一种方法是，在定义新类时，始终调用其直接超类的构造器。R 对类层次结构一无所知，并且在您创建 `class` 列表之前，它也不知道您拥有哪个超类。因此，没有自动的方法来做到这一点；你必须手动调用超类的构造器，以这种方式获取一个对象，然后将新的类名添加到其
    `class` 列表的前面。


    ```

    A <- function() {

    structure(list(), class = "A")

    }

    B <- function() {

    this <- A()

    class(this) <- c("B", class(this))

    this

    }

    C <- function() {

    this <- B()

    class(this) <- c("C", class(this))

    this

    }

    ```


    使用这种编程惯用法还能让您避免另一个潜在的错误来源。类的构造器通常会创建一个带有属性的对象，并期望这些属性在其函数中处于一致的状态。如果您不调用超类的构造器，而是在子类的构造器中设置这些属性，就可能违反超类所依赖的不变约束。在编写子类构造器时，您可能会小心避免这样做，但超类的实现将来可能会被更改。一旦发生这种情况，子类的实现就可能被破坏。尝试调试因代码在其他完全不相关的位置发生更改而出现的错误，简直是地狱般的体验。


    通常，更好的做法是始终调用超类的构造器，然后在返回子类对象之前对生成的对象进行修改。'
- fmt: '## `NextMethod`


    当专化泛型函数时，我们并不总是需要从头实现所有功能。有时我们可以复用更抽象类中的实现；只需对它们的结果稍作调整。我们可以使用函数的全名显式调用超类的函数，但这仅在类实际实现了自己的版本时才有效。如果类只是继承了它，则此方法无效，并且每次修改类层次结构时都必须小心，以免破坏此类直接调用所依赖的假设。


    更好的解决方案是使用`NextMethod`函数。此函数允许你以类似`UseMethod`的方式调用继承的函数，并使用`class`序列。`NextMethod`函数在魔法程度上与`UseMethod`类似。它知道你正在实现哪个泛型函数——尽管像`UseMethod`一样，你可以覆盖这一点——并且它会搜索你函数第一个对象的`class`序列。同样，你可以覆盖这一点，但这是一个非常常见的惯用法，你可能不应该这样做。与`UseMethod`不同，它不会终止你调用它的函数，并且你可以使用它返回的值。


    例如，我们可以考虑上一章末尾讨论的书目对象。这里我们有超类`"publication"`和两个子类`"article"`和`"book"`，并且我们有一个用于格式化引文的泛型方法`format`。我们可以为`publication`类编写一个`format`函数，用于格式化姓名和作者列表，并在方法的专化中调用`NextMethod`来获取此字符串，并用子类中可用的信息扩展它。


    ```

    format.publication <- function(publ) {

    paste(name(publ), authors(publ), sep = ", ")

    }

    format.article <- function(publ) {

    paste(NextMethod(), journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(NextMethod(), publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    当我们调用`NextMethod`时，R 将搜索`class`序列——从上次搜索结束的地方开始——寻找一个实现了我们当前正在评估的泛型函数的类。


    我们可以使用`A`、`B`和`C`类来实际查看这一点。如果我们定义所有都调用`NextMethod`的函数，并对这三个类中的每一个对象进行评估，我们将看到`A`对象`x`会评估`A`方法和默认函数；`B`对象`y`会评估`B`函数，然后在默认版本之前继续评估`A`函数；而`C`对象`z`会评估所有函数。


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    f.A <- function(x) {

    print("f.A")

    NextMethod()

    }

    f.B <- function(x) {

    print("f.B")

    NextMethod()

    }

    f.C <- function(x) {

    print("f.C")

    NextMethod()

    }

    f(x)

    ## [1] "f.A"

    ## [1] "f.default"

    f(y)

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    ```


    如果我们实现另一个函数，其中我们只为`A`和`C`类实现版本，而不为`B`实现，我们将看到`C`对象评估`C`版本，然后评估`A`版本；由于没有`B`版本，调用`NextMethod`时的搜索将找不到它，因此将继续到`A`版本。


    ```

    j <- function(x) UseMethod("j")

    j.default <- function(x) print("j.default")

    j.A <- function(x) {

    print("j.A")

    NextMethod()

    }

    j.C <- function(x) {

    print("j.C")

    NextMethod()

    }

    j(x)

    ## [1] "j.A"

    ## [1] "j.default"

    j(y)

    ## [1] "j.A"

    ## [1] "j.default"

    j(z)

    ## [1] "j.C"

    ## [1] "j.A"

    ## [1] "j.default"

    ```


    所有方法分派——即查找泛型函数实现的技术术语——完全基于`class`属性中的类列表。类层次结构并未显式表示，确保`class`列表反映出你所设想的类层次结构设计是你的责任。如果我们反转`class`列表的顺序，R
    同样可以轻松地处理它。


    ```

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    class(z) <- rev(class(z))

    f(z)

    ## [1] "f.A"

    ## [1] "f.B"

    ## [1] "f.C"

    ## [1] "f.default"

    ```


    如果我们反转类的顺序，`UseMethod`中对第一个函数的搜索只是从最抽象的类开始，并沿着列表向下工作，直到找到实现。在这种情况下，它会立即找到它，并且对`NextMethod`的调用会像之前一样，从`UseMethod`或先前`NextMethod`调用结束的地方继续搜索。默认函数总是在最后，因为一旦你遍历完列表，就会调用默认函数。如果`A`类是一个`C`专化的抽象类，这当然会给出不正确的行为。你将调用抽象函数而不是专化函数。但是将泛型函数解析为具体类的机制并不了解类层次结构，因此它只会搜索列表。


    这也意味着你可以编写不同的类，这些类认为其他类的层次结构完全不同。如果一个`class`列表是`c("A", "B", "C")`，另一个是`c("B",
    "C", "A")`，第一个认为`C`是最抽象的，`A`是最衍生的类，而第二个认为`A`是最抽象的，`B`是最衍生的。R 寻找要调用函数的机制足够简单，但如果你开始编写代码，其中你的类层次结构取决于你所查看的对象，那么你就走上了疯狂之路。


    # 4. 统计模型


    说实话，在大多数日常 R 编程中，你不会使用面向对象编程。你在 R 中进行的大多数分析涉及数据转换，通常实现为某种数据流，这最好通过函数式编程来捕获。当你编写此类管道时，你可能会使用多态函数，但很少需要创建自己的类。然而，如果你需要实现一个新的统计模型，你通常确实希望创建一个新类。


    大量数据分析要求你推断感兴趣的参数，或者你构建一个模型来预测数据的属性，但在许多此类情况下，你不一定需要确切知道我们是如何构建模型的、它如何推断参数，或者它如何预测新值。你可以使用`coefficients`函数从拟合模型中获取推断的参数，或者使用`predict`函数预测新值，并且你可以将这两个函数与几乎任何统计模型一起使用。这是因为大多数模型都是作为实现了泛型函数`coefficients`和`predict`的类来实现的。


    作为面向对象编程的实际示例，我们可以在本章中实现我们自己的模型。我们将保持简单，以便专注于编程方面而非统计理论，但仍然实现一些 R 尚未内置的东西。我们将实现贝叶斯线性回归的一个版本。'
  raw: '## `NextMethod`


    When we specialize generic functions , we do not always need to implement everything
    from scratch either. Sometimes we can reuse implementations from more abstract
    classes; we just need to tweak the results of them a little. We can always call
    the function of a superclass explicitly using the full name of the function, but
    this will only work if the class actually implements its own version. It will
    not work if it just inherits it, and you have to be careful every time you modify
    the class hierarchy that you are not breaking assumptions underlying such direct
    calls.


    A better solution is to use the `NextMethod` function. This function lets you
    call inherited functions in a way that resembles `UseMethod`, and that uses the
    `class` sequence. The `NextMethod` function is magical in a similar way to `UseMethod`.
    It knows which generic function you are implementing—although, as with `UseMethod`
    you can override this—and it will search through the `class` sequence of the first
    object of your function. Again, you can override this, but it is such a common
    idiom that you probably shouldn’t. Unlike `UseMethod`, though, it doesn’t terminate
    the function you call it from, and you can use the value it returns.


    As an example, we can consider the bibliography objects we discussed at the end
    of the previous chapter. Here we had the superclass `"publication"` and the two
    subclasses `"article"` and `"book"`, and we had a generic method, `format`, for
    formatting citations. We can write a `format` function for the publication class
    that formats the name and the authors’ list, and in the specializations of the
    method, we can call `NextMethod` to obtain this string and extend it with information
    available in the sub-classes.


    ```

    format.publication <- function(publ) {

    paste(name(publ), authors(publ), sep = ", ")

    }

    format.article <- function(publ) {

    paste(NextMethod(), journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(NextMethod(), publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    When we call `NextMethod`, R will search through the `class` sequence—starting
    where it left off last time it did the search—for a class that implements the
    generic function we are currently evaluating.


    We can use the `A`, `B`, and `C` classes to see this in action. If we define functions
    that all call `NextMethod` and evaluate it for objects of each of the three classes,
    we will see that the `A` object, `x`, will evaluate the `A` method and the default
    function; the `B` object, `y` will evaluate the `B` function and then continue
    with the `A` function before the default version; and the `C` object, `z`, will
    evaluate all the functions.


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    f.A <- function(x) {

    print("f.A")

    NextMethod()

    }

    f.B <- function(x) {

    print("f.B")

    NextMethod()

    }

    f.C <- function(x) {

    print("f.C")

    NextMethod()

    }

    f(x)

    ## [1] "f.A"

    ## [1] "f.default"

    f(y)

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    ```


    If we implement another function, where we only implement version for classes
    `A` and `C` but not for `B`, we will see the `C` objects evaluating the `C` version
    and then the `A` version; since there is no `B` version, the search when we call
    `NextMethod` will not find it and will thus continue to the `A` version.


    ```

    j <- function(x) UseMethod("j")

    j.default <- function(x) print("j.default")

    j.A <- function(x) {

    print("j.A")

    NextMethod()

    }

    j.C <- function(x) {

    print("j.C")

    NextMethod()

    }

    j(x)

    ## [1] "j.A"

    ## [1] "j.default"

    j(y)

    ## [1] "j.A"

    ## [1] "j.default"

    j(z)

    ## [1] "j.C"

    ## [1] "j.A"

    ## [1] "j.default"

    ```


    All the method dispatching—the technical term for this looking up of implementations
    of generic functions—is entirely based on the list of classes in the `class` attribute.
    Class hierarchies are not explicitly represented and it is your own responsibility
    that the `class` lists reflect the design of class hierarchies you have in mind.
    If we reverse the order of the `class` list, R is just as happy to work with this.


    ```

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    class(z) <- rev(class(z))

    f(z)

    ## [1] "f.A"

    ## [1] "f.B"

    ## [1] "f.C"

    ## [1] "f.default"

    ```


    If we reverse the order of the classes, the search for the first function in `UseMethod`
    just starts at the most abstract class and works its way down the list until it
    finds an implementation. In this case, it finds it right away, and the calls to
    `NextMethod` just continue searching from where `UseMethod` or previous `NextMethod`
    calls ended, exactly like before. The default function is always last here because
    once you get through the list, the default is invoked. If the `A` class is an
    abstract class that `C` specializes, this will, of course, give you incorrect
    behavior. You would invoke the abstract and not the specialized function. But
    the mechanism for resolving generic functions into concrete classes does not know
    about class hierarchies, so it will just search through the list.


    This also means that you can write different classes that consider the hierarchy
    of other classes to be completely different. If one `class` list is `c("A", "B",
    "C")` and another is `c("B", "C", "A")`, the first considers `C` the most abstract
    and `A` the most derived class, while the second considers `A` the most abstract
    and `B` the most derived. The mechanism for how R finds the function to call is
    simple enough, but if you begin writing code where your class hierarchy depends
    on which object you are looking at, you are on the road to madness.


    # 4. Statistical Models


    Truth be told, you won’t be using object-oriented programming in most day-to-day
    R programming. Most analyses you do in R involve the transformation of data, typically
    implemented as some sort of data flow, which is best captured by functional programming.
    When you write such pipelines, you will probably be using polymorphic functions,
    but you rarely need to create your own classes. If you need to implement a new
    statistical model, however, you usually do want to create a new class.


    A lot of data analysis requires that you infer parameters of interest or you build
    a model to predict properties of your data, but in many of those cases, you don’t
    necessarily need to know exactly how we constructed the model, how it infers parameters,
    or how it predicts new values. You can use the `coefficients` function to get
    inferred parameters from a fitted model, or you can use the `predict` function
    to predict new values, and you can use those two functions with almost any statistical
    model. That is because most models are implemented as classes with implementations
    for the generic functions `coefficients` and `predict` .


    As an example of object-oriented programming in action, we can implement our own
    model in this chapter. We will keep it simple, so we can focus on the programming
    aspects and not the statistical theory, but still implement something that isn’t
    already built into R. We will implement a version of Bayesian linear regression.'
  trans: '

    ## `NextMethod`


    当专化泛型函数时，我们并不总是需要从头实现所有功能。有时我们可以复用更抽象类中的实现；只需对它们的结果稍作调整。我们可以使用函数的全名显式调用超类的函数，但这仅在类实际实现了自己的版本时才有效。如果类只是继承了它，则此方法无效，并且每次修改类层次结构时都必须小心，以免破坏此类直接调用所依赖的假设。


    更好的解决方案是使用`NextMethod`函数。此函数允许你以类似`UseMethod`的方式调用继承的函数，并使用`class`序列。`NextMethod`函数在魔法程度上与`UseMethod`类似。它知道你正在实现哪个泛型函数——尽管像`UseMethod`一样，你可以覆盖这一点——并且它会搜索你函数第一个对象的`class`序列。同样，你可以覆盖这一点，但这是一个非常常见的惯用法，你可能不应该这样做。与`UseMethod`不同，它不会终止你调用它的函数，并且你可以使用它返回的值。


    例如，我们可以考虑上一章末尾讨论的书目对象。这里我们有超类`"publication"`和两个子类`"article"`和`"book"`，并且我们有一个用于格式化引文的泛型方法`format`。我们可以为`publication`类编写一个`format`函数，用于格式化姓名和作者列表，并在方法的专化中调用`NextMethod`来获取此字符串，并用子类中可用的信息扩展它。


    ```

    format.publication <- function(publ) {

    paste(name(publ), authors(publ), sep = ", ")

    }

    format.article <- function(publ) {

    paste(NextMethod(), journal(publ), pages(publ), sep = ", ")

    }

    format.book <- function(publ) {

    paste(NextMethod(), publisher(publ), ISBN(publ), sep = ", ")

    }

    ```


    当我们调用`NextMethod`时，R 将搜索`class`序列——从上次搜索结束的地方开始——寻找一个实现了我们当前正在评估的泛型函数的类。


    我们可以使用`A`、`B`和`C`类来实际查看这一点。如果我们定义所有都调用`NextMethod`的函数，并对这三个类中的每一个对象进行评估，我们将看到`A`对象`x`会评估`A`方法和默认函数；`B`对象`y`会评估`B`函数，然后在默认版本之前继续评估`A`函数；而`C`对象`z`会评估所有函数。


    ```

    f <- function(x) UseMethod("f")

    f.default <- function(x) print("f.default")

    f.A <- function(x) {

    print("f.A")

    NextMethod()

    }

    f.B <- function(x) {

    print("f.B")

    NextMethod()

    }

    f.C <- function(x) {

    print("f.C")

    NextMethod()

    }

    f(x)

    ## [1] "f.A"

    ## [1] "f.default"

    f(y)

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    ```


    如果我们实现另一个函数，其中我们只为`A`和`C`类实现版本，而不为`B`实现，我们将看到`C`对象评估`C`版本，然后评估`A`版本；由于没有`B`版本，调用`NextMethod`时的搜索将找不到它，因此将继续到`A`版本。


    ```

    j <- function(x) UseMethod("j")

    j.default <- function(x) print("j.default")

    j.A <- function(x) {

    print("j.A")

    NextMethod()

    }

    j.C <- function(x) {

    print("j.C")

    NextMethod()

    }

    j(x)

    ## [1] "j.A"

    ## [1] "j.default"

    j(y)

    ## [1] "j.A"

    ## [1] "j.default"

    j(z)

    ## [1] "j.C"

    ## [1] "j.A"

    ## [1] "j.default"

    ```


    所有方法分派——即查找泛型函数实现的技术术语——完全基于`class`属性中的类列表。类层次结构并未显式表示，确保`class`列表反映出你所设想的类层次结构设计是你的责任。如果我们反转`class`列表的顺序，R
    同样可以轻松地处理它。


    ```

    f(z)

    ## [1] "f.C"

    ## [1] "f.B"

    ## [1] "f.A"

    ## [1] "f.default"

    class(z) <- rev(class(z))

    f(z)

    ## [1] "f.A"

    ## [1] "f.B"

    ## [1] "f.C"

    ## [1] "f.default"

    ```


    如果我们反转类的顺序，`UseMethod`中对第一个函数的搜索只是从最抽象的类开始，并沿着列表向下工作，直到找到实现。在这种情况下，它会立即找到它，并且对`NextMethod`的调用会像之前一样，从`UseMethod`或先前`NextMethod`调用结束的地方继续搜索。默认函数总是在最后，因为一旦你遍历完列表，就会调用默认函数。如果`A`类是一个`C`专化的抽象类，这当然会给出不正确的行为。你将调用抽象函数而不是专化函数。但是将泛型函数解析为具体类的机制并不了解类层次结构，因此它只会搜索列表。


    这也意味着你可以编写不同的类，这些类认为其他类的层次结构完全不同。如果一个`class`列表是`c("A", "B", "C")`，另一个是`c("B",
    "C", "A")`，第一个认为`C`是最抽象的，`A`是最衍生的类，而第二个认为`A`是最抽象的，`B`是最衍生的。R 寻找要调用函数的机制足够简单，但如果你开始编写代码，其中你的类层次结构取决于你所查看的对象，那么你就走上了疯狂之路。


    # 4. 统计模型


    说实话，在大多数日常 R 编程中，你不会使用面向对象编程。你在 R 中进行的大多数分析涉及数据转换，通常实现为某种数据流，这最好通过函数式编程来捕获。当你编写此类管道时，你可能会使用多态函数，但很少需要创建自己的类。然而，如果你需要实现一个新的统计模型，你通常确实希望创建一个新类。


    大量数据分析要求你推断感兴趣的参数，或者你构建一个模型来预测数据的属性，但在许多此类情况下，你不一定需要确切知道我们是如何构建模型的、它如何推断参数，或者它如何预测新值。你可以使用`coefficients`函数从拟合模型中获取推断的参数，或者使用`predict`函数预测新值，并且你可以将这两个函数与几乎任何统计模型一起使用。这是因为大多数模型都是作为实现了泛型函数`coefficients`和`predict`的类来实现的。


    作为面向对象编程的实际示例，我们可以在本章中实现我们自己的模型。我们将保持简单，以便专注于编程方面而非统计理论，但仍然实现一些 R 尚未内置的东西。我们将实现贝叶斯线性回归的一个版本。

    '
- fmt: '# Bayesian Linear Regression


    The simplest form of linear regression fits a line to data points. Imagine we
    have vectors `x` and `y`, and we wish to produce coefficients `w[1]` and `w[2]`
    such that `y[i] = w[1] + w[2] x[i] + e[i]` where the `e` is a vector of errors
    that we want to make as small as possible. We typically assume that the errors
    are identically normally distributed when we consider it a statistical problem,
    and so we want to have the minimal variance of the errors. When fitting linear
    models with the `lm` function, you get the maximum likelihood values for the weights
    `w[1]` and `w[2]`, but if you wish to do Bayesian statistics you should instead
    consider this weight vector `w` as a random variable, and fit it to the data in
    `x`, while `y` means updating it from its prior distribution to its posterior
    distribution.


    A typical distribution for linear regression weights is the normal distribution.
    If we consider the weights’ multivariate normal distributed as their prior distribution,
    then their posterior distribution given the data will also be normally distributed,
    which makes the mathematics very convenient.


    We will assume that the prior distribution of `w` is a normal distribution with
    mean zero and independent components, so a diagonal covariance matrix. This means
    that, on average, we believe the line we are fitting to be flat and going through
    the plane origin, but how strongly we believe this depend on values in the covariance
    matrix. This we will parameterize with a so-called hyperparameter, `a`, that is
    the precision—one over the variance—of the weight components. The covariance matrix
    will have `1/a` on its diagonal and zeros off-diagonal.


    We can represent a distribution over weights as the mean and covariance matrix
    of a multinomial normal distribution and construct the prior distribution from
    the precision like this:


    ```

    weight_distribution <- function(mu, S) {

    structure(list(mu = mu, S = S), class = "wdist")

    }

    prior_distribution <- function(a) {

    mu = c(0, 0)

    S = diag(1/a, nrow = 2, ncol = 2)

    weight_distribution(mu, S)

    }

    ```


    We give the weights distribution a class, just to distinguish them from plain
    lists, but otherwise, there is nothing special to see here.


    If we wish to sample from this distribution, we can use the `mvrnorm` function
    from the `MASS` package.


    ```

    sample_weights <- function(n, distribution) {

    MASS::mvrnorm(n = n,

    mu = distribution$mu,

    Sigma = distribution$S)

    }

    ```


    We can try to sample some lines from the prior distribution and plot them. We
    can, of course, plot the sample `w` vectors as points in the plane, but since
    they represent lines, we will display them as such (see Figure 4-1).


    ![A451015_1_En_4_Fig1_HTML.jpg](A451015_1_En_4_Fig1_HTML.jpg)


    **Figure 4-1.** Samples from the prior of lines


    ```

    prior <- prior_distribution(1)

    (w <- sample_weights(5, prior))

    ##            [,1]        [,2]

    ## [1,]  0.6029080 -0.84085548

    ## [2,]  0.4721664  1.38435934

    ## [3,]  0.6353713 -1.25549186

    ## [4,]  0.2857736  0.07014277

    ## [5,] -0.1381082  1.71144087

    plot(c(-1, 1), c(-1, 1), type = ''n'',

    xlab = '''', ylab = '''')

    plot_lines <- function(w) {

    for (i in 1:nrow(w)) {

    abline(a = w[i, 1], b = w[i, 2])

    }

    }

    plot_lines(w)

    ```


    When we observe data in the form of matching `X` and `y` values, we must update
    the `w` vector to reflect this, which means updating the distribution of the weights.
    I won’t derive the math (this is not a math textbook, after all), but if `mu0`
    is the prior mean and `S0` the prior covariance matrix, then the posterior mean
    and covariance matrix are computed thus:


    ```

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    ```


    You cannot execute the code as it is right here—it depends on variables we haven’t
    defined—but it is the body of the function we define shortly. It is a little bit
    of linear algebra that involves the prior distribution and the observed values.
    The parameters we haven’t seen before in these expressions are `b` and `X`. The
    former is the precision of the error terms—which we assume to know and represent
    as this hyperparameter—and the latter captures the `x` values. We cannot use `x`
    alone because we want to use two weights to represent lines. When we write `w[1]
    + w[2] * x[i]` for the estimate of `y[i]`, we can think of it as the vector product
    of `w` and `c(0, x[i])`, which is exactly what we do. We represent all `x[i]`
    as rows `c(0, x[i])` in the matrix `X`. So we estimate `y[i] = w[1] * X[i, 1]
    + w[2] * X[i, 2]` in this notation, or `y = X %*% w`.


    As a fitting function, we can write it as this:


    ```

    fit_posterior <- function(x, y, b, prior) {

    mu0 <- prior$mu

    S0 <- prior$S

    X <- matrix(c(rep(1, length(x)), x), ncol = 2)

    S <- solve(S0 + b * t(X) %*% X)

    mu <- S %*% (solve(S0) %*% mu0 + b * t(X) %*% y)

    weight_distribution(mu = mu, S = S)

    }

    ```


    We can try to plot some points, fit the model to these, and then plot lines sampled
    from the posterior. These should fall around the points now, unlike the lines
    sampled from the prior. The more points we use to fit the model, the tighter that
    lines sampled from the posterior will fall around the points (see Figure 4-2).


    ![A451015_1_En_4_Fig2_HTML.jpg](A451015_1_En_4_Fig2_HTML.jpg)


    **Figure 4-2.** Samples of posterior lines


    ```

    x <- rnorm(20)

    y <- 0.2 + 1.3 * x + rnorm(20)

    plot(x, y)

    posterior <- fit_posterior(x, y, 1, prior)

    w <- sample_weights(5, posterior)

    plot_lines(w)

    ```


    The way we update the distribution of weights here from the prior distribution
    to the posterior doesn’t require that the prior distribution is the exact one
    we created using the variable `a`. Any distribution can be used as the prior,
    and in Bayesian statistics, it would not be unusual to update a posterior distribution
    as more and more data is added. We can start with the prior we just created and
    fit it to some data to get a posterior. Then if we get more data, we can use the
    first posterior as a prior for fitting more data and getting a new posterior that
    captures the knowledge we have gained from seeing all the data. If we have all
    the data from the get-go, there is no particular benefit to doing this, but in
    an application where data comes streaming, we can exploit this to quickly update
    our knowledge each time new data is available.


    Since this book is not about Bayesian statistics, and since we only use Bayesian
    linear regression as an example of writing a new statistical model, we will not
    explore this further here.'
