    languages, where methods modify objects rather than create new objects. If you
    come to R from a different programming language, the R6 system might be more familiar
    to you, but since it introduces side effects to R, it might surprise you if you
    are more familiar with R. If you have two references to an R6 object and modify
    it through one variable, it will also change the state of the object the other
    variable is referring to. This does not happen for the other two class systems.


    The R6 system is a better implementation of this semantics than the built-in reference
    class (RC) system, also known as R5\. R5 is the natural name for the next object
    system implemented in R, after the object systems S3 and S4, which are originally
    from the S language. Because R6 has the same semantics as R5 and is considered
    a better implementation of it, I will not cover R5 further.'
  trans: '

    # 结合 S3 与 S4 类


    你可以在有限程度上结合 S3 和 S4。这两种体系各不相同，我不建议你尝试编写将 S3 和 S4 类层次结构紧密联系在一起的软件，这只会导致痛苦与懊悔。但如果你已有
    S3 代码，并希望用 S4 编写扩展，这也是可行的。


    假设我们有一个 S3 类 `X`，以及泛型函数 `foo` 和 `bar`。


    ```

    X <- function(x) {

    structure(list(x = x), class = "X")

    }

    foo <- function(x) UseMethod("foo")

    bar <- function(x) UseMethod("bar")

    foo.X <- function(x) "foo"

    bar.X <- function(x) x$x

    x <- X(5)

    foo(x)

    ## [1] "foo"

    bar(x)

    ## [1] 5

    ```


    如果我们想编写 `X` 的一个子类，不妨称之为 `Y`，并且希望用 S4 来编写 `Y`，则不能在 `setClass` 的 `contains` 选项中使用
    `X`。其实你确实可以用，但如果尝试实例化该类的对象，则会出错。S4 系统并不知道存在名为 `X` 的类，因此我们首先需要让它知道这个类。我们可以通过使用
    `setOldClass` 函数来实现这一点。


    ```

    setOldClass("X")

    ```


    这做了两件事：它让 S4 知道了这个类，以便我们可以继承它；同时，它使为该类定义的任何泛型函数都成为可以通过 `setMethod` 进行特化的函数。因此，在调用
    `setOldClass` 之后，我们可以将 `X` 的子类创建为 S4 类。


    ```

    Y <- setClass("Y", contains = "X")

    ```


    对类型为 `Y` 的对象调用 `foo` 或 `bar` 也会通过动态分派系统工作，并会调用 `foo.X`，因为没有更匹配的 `foo.Y` 存在。


    ```

    y <- Y()

    foo(y)

    ## [1] "foo"

    ```


    如果愿意，我们可以通过实现 `foo.Y` 来为 `Y` 对象创建一个特化版本的 `foo`。


    ```

    foo.Y <- function(x) "Y::foo"

    foo(y)

    ## [1] "Y::foo"

    ```


    当然，这属于 S3 方式下精炼泛型函数的做法，而由于我们现在处理的是 S4 类，使用 `setMethod` 会更好。


    与 `foo` 类似，调用 `bar` 会调用 `bar.X`。此时会导致错误，因为尽管 S4 知道 `X` 类，但它并不知道构造函数或其所创建的 `X`
    对象的表示方式。


    ```

    bar(y)

    ## Error in x$x: $ operator not defined for this S4 class

    ```


    在 S3 中，没有关于构造函数或对象表示形式的正式定义，只有非正式的编码惯例，因此 S4 无法知道 `bar` 函数期望从 `X` 对象中获取什么。我们自动集成
    S3 和 S4 的能力是有限的，需要编写一些代码才能使 S3 版本的功能也与 S4 类相匹配。


    ```

    Y <- setClass("Y", contains = "X", slots = c(x = "ANY"))

    setMethod("bar", signature = "Y",

    definition = function(x) x@x)

    y <- Y(x = 13)

    bar(y)

    ## [1] 13

    ```


    我不建议混合使用 S3 和 S4。如果代码是用 S3 系统编写的，那么坚持使用 S3 可能比尝试将这两种系统结合起来更好。但如果你是用 S4 编写代码，需要包含一些来自
    S3 类的功能，那么上述方法就是可行的做法。


    # R6 类


    我们要看的最后一个对象系统是 R6 系统。这个系统与 S3 和 S4 非常不同，在 R 中通常也不常见，因为它引入了可变数据。在 R 中，数据通常是不可变的，任何看似修改对象的操作实际上都是通过复制数据并构造新对象来实现的。在
    R 中，唯一可以修改的是环境；你不能修改数据。然而，R6 系统利用了环境来提供可以修改的对象。这在 R 中并不常见，但其语义类似于大多数其他语言中面向对象的实现方式，即方法修改对象而不是创建新对象。如果你是从其他编程语言转到
    R，R6 系统可能更熟悉；但如果你更熟悉 R 本身，它引入的副作用可能会让你感到惊讶。如果有两个引用指向同一个 R6 对象，并通过其中一个变量修改它，那么另一个变量所引用的对象状态也会改变。这种情况在另外两个类系统中是不会发生的。


    与内置的引用类（RC）系统（也称为 R5）相比，R6 系统是这种语义的更好实现。R5 是 R 中继 S3 和 S4 对象系统之后实现的下一个对象系统的自然名称，而
    S3 和 S4 最初源自 S 语言。由于 R6 具有与 R5 相同的语义，并且被认为是其更好的实现，因此我不再进一步介绍 R5。

    '
- fmt: "## Defining Classes\n\nClasses are defined using the `R6Class` function from\
    \ the package `R6`. Similar to `setClass` from S4, we need to give the class a\
    \ name, and we have a number of optional arguments for defining how objects of\
    \ the class should look and behave. Unlike S4, we need to capture the result from\
    \ the call to `R6Class` in order to create objects of the class. In S4 this is\
    \ a convention, but we can create objects as long as we know the name of a class.\
    \ In R6, the name is mainly used to set the `class` attribute so the objects can\
    \ interact with S3 polymorphism. It is the return value of `R6Class` we use to\
    \ create objects.\n\nAs an example, once again we implement a stack. This time\
    \ I will not bother with an abstract super class but just implement a `VectorStack`\
    \ directly. One implementation can look like this:\n\n```r\nlibrary(R6)\nVectorStack\
    \ <- R6Class(\"VectorStack\",\nprivate = list(elements = NULL),\npublic = list(\n\
    top = function() {\nprivate$elements[1]\n},\npop = function() {\nprivate$elements\
    \ <-\nprivate$elements[-1]\ninvisible(self)\n},\npush = function(e) {\nprivate$elements\
    \ <-\nc(e, private$elements)\ninvisible(self)\n},\nis_empty = function() {\nlength(private$elements)\
    \ == 0\n}\n))\n```\n\nHere, besides the class name, we use two arguments to `R6Class`:\
    \ `private` and `public`. These are used to define attributes of the class, either\
    \ values stored in objects or methods we can call on the objects. For both, the\
    \ arguments are lists. The names used for the list elements become the names of\
    \ the attributes and the values—naturally, the attribute values.\n\nThe difference\
    \ between the two arguments is that attributes in the `public` list can be accessed\
    \ anywhere while attributes in the `private` list can only be accessed in methods\
    \ you define for the class. In methods, you can access elements in the `public`\
    \ list using the variable `self`, and you can access attributes in the `private`\
    \ list using the variable `private`. In this `VectorStack` implementation, we\
    \ have made the vector used for storing the stack private, and we have implemented\
    \ the stack interface as public methods. Inside the methods we access the elements\
    \ as `private$elements`, and in `push` and `pop` we return the object itself using\
    \ the variable `self`. We return this object wrapped in `invisible`, so it isn't\
    \ automatically printed when we call these methods, but we didn't have to. We\
    \ didn't have to return an object at all for these methods, but doing so allows\
    \ us to chain together method calls, as we will see below, so it is good practice.\n\
    \nNotice that the `self` and `private` objects are not arguments to the methods.\
    \ They just exist in the namespace of the functions as part of the magic R6 uses\
    \ to implement its mutable object semantics.\n\nThe `VectorStack` object we create\
    \ this way is not a constructor function itself, as it was for S4. It is a so-called\
    \ object generator. To create an object we use the attribute `new` of this generator\
    \ thus:\n\n```r\n(stack <- VectorStack$new())\n##   Public:\n##     clone: function\
    \ (deep = FALSE)\n##     is_empty: function ()\n##     pop: function ()\n##  \
    \   push: function (e)\n##     top: function ()\n##   Private:\n##     elements:\
    \ NULL\n```\n\nPrinting this object is rather verbose, but if we define the method\
    \ `print` for the class we can modify how it is displayed.\n\n```r\nVectorStack\
    \ <- R6Class(\"VectorStack\",\nprivate = list(elements = NULL),\npublic = list(\n\
    # ... rest of the methods\nprint = function() {\ncat(\"Stack elements:\\n\")\n\
    print(private$elements)\n}\n))\n```\n\nThis doesn't modify the existing object.\n\
    \n```r\nstack\n## \n##   Public:\n##     clone: function (deep = FALSE)\n##  \
    \   is_empty: function ()\n##     pop: function ()\n##     push: function (e)\n\
    ##     top: function ()\n##   Private:\n##     elements: NULL\n```\n\nIt has an\
    \ effect if we create a new one, however.\n\n```r\n(stack <- VectorStack$new())\n\
    ## Stack elements:\n## NULL\n```\n\nWe can access the (public) attributes of the\
    \ stack object, and call methods if the attributes are functions, using `$` indexing:\n\
    \n```r\nstack$push(1)$push(2)$push(3)\nstack\n## Stack elements:\n## [1] 3 2 1\n\
    while (!stack$is_empty()) stack$pop()\nstack\n## Stack elements:\n## numeric(0)\n\
    ```\n\nThe chained call to `push` here is possible because the `push` method returns\
    \ the object itself. Unlike the previous implementations where `push` returns\
    \ a new object, for the R6 object, the existing object is modified. We do not\
    \ need to assign the result of the three `push` calls back to `stack`, and we\
    \ do not need to assign the calls to `pop` back to `stack` either. Returning the\
    \ object itself in these functions allows us to chain method calls, but that is\
    \ all this does. The R6 object is not immutable.\n\n### Object Initialization\n\
    \nIf we want to set attributes of objects when constructing them, we need to do\
    \ a little more work than in S4. We cannot just use named arguments in the constructor;\
    \ this call would give us an error:\n\n```r\nstack <- VectorStack$new(elements\
    \ = 1:4)\n```\n\nTo be able to initialize objects this way, we need to explicitly\
    \ write a function for it. This function must be a `public` method called `initialize`.\
    \ If you want the constructor to take arguments, you must specify the arguments\
    \ in this function. You cannot make this function `private`; it is an error to\
    \ put a function named `initialize` in the `private` list.\n\nTo initialize `VectorStack`\
    \ objects with a sequence of elements we can implement its `initialize` function\
    \ like this:\n\n```r\nVectorStack <- R6Class(\"VectorStack\",\nprivate = list(elements\
    \ = NULL),\npublic = list(\ninitialize = function(elements = NULL) {\nprivate$elements\
    \ <- elements\n},\n# ... rest of the methods\n))\n```\n\nWith this initialization\
    \ function we can now construct objects with `elements` initialized.\n\n```r\n\
    (stack <- VectorStack$new(elements = 1:4))\n## Stack elements:\n## [1] 1 2 3 4\n\
    ```"
