    When a class defines generic functions, all implementations of the class and its
    subclasses must implement these generic functions. If each class implements all
    of the generic functions in unique ways, there is little opportunity for reuse,
    but it is rarely the case that everything is unique. Often there are good default
    solutions to a given problem that will work for most classes, while only a few
    classes need to implement special functions. In object-oriented programming, you
    want to implement functions at the highest level in the class hierarchy where
    it is possible and let subclasses reuse these implementations when possible by
    calling general functions instead of providing their own specialized functions.
    Any class in the hierarchy might have to specialize a subset of the generic functions,
    and any subclass of should use the most specialized function in the hierarchy
    above it, but in general it should only define its own version of generic functions
    if they are different from the ones defined in its superclasses. The remaining
    functions it should just reuse. We say that it inherits such functions from its
    superclass and the look-up mechanism for generic functions automates this to a
    high degree.


