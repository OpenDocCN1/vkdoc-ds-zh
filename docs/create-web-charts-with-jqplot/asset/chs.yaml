  \ {\n       xaxis: {\n          renderer: $.jqplot.CategoryAxisRenderer\n      \
  \ }\n    }\n});\n\nvar plot2 = $.jqplot ('chart2', [data1, data2, data3, data4],{});\n\
  \nvar plot3 = $.jqplot ('chart3', [pie1], {\n    seriesDefaults: {\n       renderer:\
  \ jQuery.jqplot.PieRenderer,\n       rendererOptions: {\n          showDataLabels:\
  \ true,\n          dataLabels: 'value',\n          fill: false,\n          sliceMargin:\
  \ 6,\n          lineWidth: 5\n       }\n    }\n});\n```\n\n现在，需要在 `$(document).ready()`\
  \ 函数的末尾添加 jQueryUI 的 `tabs()` 函数，如代码清单 11-4 所示。\n\n***代码清单 11-4***. ch11_01.html\n\
  \n```javascript\n$(document).ready(function(){\n...\n    $(\"#tabs\").tabs();\n\
  });\n```\n\n此调用创建了选项卡容器，因此您需要将选项卡绑定到您的图表上（参见代码清单 11-5）。\n\n***代码清单 11-5***. ch11_01.html\n\
  \n```javascript\n$('#tabs').bind('tabsshow', function(event, ui) {\n    if (ui.index\
