- "# 使用 jqPlot 创建饼图和环形图\n\n饼图和环形图是展示数据构成部分分解的绝佳方式。饼图是一种被划分为多个扇区（或“切片”）的圆形图表，其主要目的是说明各部分的比例关系：每个切片的弧长与其所代表的数量成正比。环形图与饼图非常相似，但中心有一个孔洞，并且支持多个序列的比较。在本章中，你将了解这两种图表。本章最后将讨论多维饼图。\n\
  \n## 饼图\n\n在 jqPlot 中，数据默认被解释为折线图。如果你想以饼图形式展示数据，则需要包含`PieRenderer`插件：\n\n```html\n\
  <script type=\"text/javascript\" src=\"../src/plugins/jqplot.pieRenderer.min.js\"\
  >\n</script>\n```\n\n或者，如果你更喜欢使用内容分发网络（CDN）服务，可以按如下方式操作：\n\n```html\n<script type=\"\
  text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n    /jqplot.pieRenderer.min.js\"\
  ></script>\n```\n\n为了更好地理解这个插件的使用，我们以一个人在特定时期内摄入的食物量为例。在这种情况下，饼图被证明是数据表示的最佳选择。所有摄入的食物构成整个群体，而各种类型的食物则是你想要比较的组成部分。每种类型的食物将由一个通过不同颜色标识的切片表示。每个切片的大小将精确地反映出该食物类型在一个人饮食中所占的比例。你可以从一个包含`[label,\
  \ amount]`值对的数据数组开始，如清单 6-1 所示。\n\n***清单 6-1***。Ch6_01a.html\n\n```javascript\n\
  var data = [['乳制品', 212],['肉类', 140], ['谷物', 276],\n             ['鱼类', 131],['蔬菜',\
  \ 510], ['水果', 325]];\n```\n\n现在，你可以定义选项了。如清单 6-2 所示，你需要激活该插件并将其应用于`defaultSeries`对象。\n\
  \n***清单 6-2***。Ch6_01a.html\n\n```javascript\nvar options = {\n    seriesDefaults:\
  \ {\n       renderer: jQuery.jqplot.PieRenderer,\n       rendererOptions: {\n  \
  \       showDataLabels: true\n      }\n   }\n};\n\n$.jqplot ('myChart', [data],\
  \ options);\n```\n\n图 6-1 展示了一个未指定额外属性的简单饼图。\n\n![9781484208632_Fig06-01.jpg](img/9781484208632_Fig06-01.jpg)\n\
  \n图 6-1。一个简单的饼图\n\n如图 6-1 所示，饼图在其扇区内默认显示百分比。相反，如果你想显示数值，如图 6-2 右上角所示，你需要在`renderOptions`中的`dataLabels`属性上设置`'value'`，如清单\
  \ 6-3 所示。\n\n![9781484208632_Fig06-02.jpg](img/9781484208632_Fig06-02.jpg)\n\n图\
  \ 6-2。设置饼图的不同方式\n\n***清单 6-3***。Ch6_01b.html\n\n```javascript\nrendererOptions:\
  \ {\n    showDataLabels: true,\n    dataLabels: 'value'\n}\n```\n\n如果你想添加边距来分隔饼图的切片，如图\
  \ 6-2 左下角所示，我们需要将`sliceMargin`属性设置为 6（参见清单 6-4）。\n\n***清单 6-4***。Ch6_01c.html\n\n\
  ```javascript\nrendererOptions: {\n    showDataLabels: true,\n    dataLabels: 'value',\n\
  \    sliceMargin: 6\n}\n```\n\n此外，如果你想显示带有空心切片的饼图，如图 6-2 右下角所示，你可以将`fill`属性设置为`'false'`，并将`lineWidth`属性设置为\
  \ 5，以便用稍粗的线条为切片描边（参见清单 6-5）。\n\n***清单 6-5***。Ch6_01d.html\n\n```javascript\nrendererOptions:\
  \ {\n    showDataLabels: true,\n    dataLabels: 'value',\n    sliceMargin: 6,\n\
  \    fill: false,\n    // 用稍粗的线条为切片描边。\n    lineWidth: 5\n}\n```\n\n## 环形图\n\n\n\
  \n"
- "# 饼图与环形图\n\n饼图的主要问题之一是它无法同时显示多个数据系列。因此，您必须决定是使用饼图分别表示每个系列，还是（更推荐）使用环形图（donut chart，也拼写为“doughnut\
  \ chart”）。这种图表所需的选项与饼图完全相同；因此，从饼图到环形图的转换是立即可行的。您将通过一个简单的示例了解这种转换的简便性。\n\n首先，与饼图一样，您需要包含一个特定的插件才能获得环形图：\n\
  \n```html\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.donutRenderer.min.js\"\
  > </script>\n```\n\n您需要在`options`对象中做的唯一更改是，在渲染器调用中将`pieRenderer`对象替换为`DonutRenderer`，然后在`rendererOptions`对象中修改第一个扇区的起始角度。默认情况下，图表从圆的左侧开始，但通常它应该从顶部开始。因此，有必要将`startAngle`属性设置为-90\
  \ 度（参见清单 6-6）。\n\n***清单 6-6***. Ch6_02.html\n\n```javascript\nvar options = {\n\
  \    seriesDefaults: {\n    // Make this a pie chart.\n       renderer:$.jqplot.DonutRenderer,\n\
  \       rendererOptions: {\n          showDataLabels: true,\n          dataLabels:\
  \ 'value',\n          sliceMargin: 3,\n          startAngle: -90\n       }\n   \
  \ }\n};\njQuery.jqplot ('myChart', [data], options);\n```\n\n这样，您就得到了一个环形图（参见图 6-3），它与图\
  \ 6-2 右下角的饼图非常相似。\n\n![9781484208632_Fig06-03.jpg](img/9781484208632_Fig06-03.jpg)\n\
  \n图 6-3. 一个简单的环形图\n\n但是，我们选择使用环形图而不是饼图，是因为它允许我们同时表示多个数据系列，从而比较其组成部分的比例。因此，继续这个示例，您可以比较两组不同人群消耗的食物。清单\
  \ 6-7 说明了如何添加另一个数据数组。\n\n***清单 6-7***. Ch6_02.html\n\n```javascript\nvar data2 =\
  \ [\n    ['Dairy', 185],['Meat', 166], ['Grains', 243],\n    ['Fish', 166],['Vegetables',\
  \ 499], ['Fruit', 370]\n];\n```\n\n将这个第二个数组添加到`data`中，您修改了代码：\n\n```javascript\n\
  $.jqplot ('myChart', [data, data2], options);\n```\n\n图 6-4 展示了报告两个数据系列的环形图。\n\n\
  ![9781484208632_Fig06-04.jpg](img/9781484208632_Fig06-04.jpg)\n\n图 6-4. 一个多系列环形图\n\
  \n查看图 6-4，您会立刻发现缺少了一些基本的东西：图例。图例是必需的，因为插件会自动为每个扇区分配一种颜色，如果没有颜色参考，就很难理解图表。因此，在将图例的`show`属性设置为`'true'`之后，您可以选择图例的位置。为了确定将图例放置在哪个位置，jqPlot\
  \ 使用`location`属性，该属性可以分配与基本方向相对应的值：`'n'`（北）、`'s'`（南）、`'e'`（东）和`'w'`（西）。但是，也可以使用组合，例如`'ne'`，表示东北位置。\n\
  \n假设您决定将图例放在图表的右侧，那么您将`'e'`赋值给`location`属性（参见清单 6-8）。\n\n***清单 6-8***. Ch6_02.html\n\
  \n```javascript\nlegend: {\n    show:true,\n    location: 'e'\n}\n```\n\n图例会像图 6-5\
  \ 所示，自动报告数据数组中包含的标签。\n\n![9781484208632_Fig06-05.jpg](img/9781484208632_Fig06-05.jpg)\n\
  \n图 6-5. 带图例的多系列环形图\n\n## 多层饼图\n\n多层饼图是一种现代格式，非常适合可视化用于显示层次关系的数据。这种图表提供了一种层次结构，从圆心的一个根节点开始，您可以随着成员关系逐渐向外圈移动而进行跟踪。为了更好地理解这种图表，让我们以一系列动物为例，并逐步确定它们的层次分组。\n\
  \n作为输入数据数组，您需要插入三个数组（参见清单 6-9）。这将生成三个层次级别。在第一个数组中，您插入最底层，直到第三个数组，它代表根节点。\n\n***清单\
  \ 6-9***. Ch6_03.html\n\n```javascript\nvar data = [['Cat', 1],['Dog', 1], ['Mouse',\
  \ 1],['Snake', 1],\n    ['Turtle', 1], ['Jellyfish', 1], ['Cuttlefish', 1]];\nvar\
  \ data2 = [['Mammals', 3],['Reptiles', 2], ['Mollusks', 2]];\nvar data3 = [['Vertebrates',\
  \ 5],['Invertebrates', 2]];\n```\n\n要生成多层饼图，您实际上需要修改一个环形图，将内孔的直径设置为零。在这种情况下，您需要显示由标签表示的动物或动物组的名称，而不是显示数值；您必须将`dataLabels`属性设置为`'label'`。最后要修改的是颜色集。jqPlot\
  \ 提供的默认颜色并不合适，有必要为层次结构的每个级别定义一组颜色。最好为属于同一组的动物分配相似的颜色，并对层次结构的后续级别也这样做。在清单 6-10 中，特别注意分配给每个系列（层次级别）的颜色序列。\n\
  \n***清单 6-10***. Ch6_03.html\n\n```javascript\nvar options = {\n    seriesDefaults:\
  \ {\n       renderer:$.jqplot.DonutRenderer,\n       rendererOptions: {\n      \
  \    showDataLabels: true,\n          dataLabels: 'label',\n          startAngle:\
  \ -90,\n          innerDiameter: 0,\n          ringMargin: 2,\n          shadow:\
  \ false\n       }\n    },\n    series: [\n    {\n       seriesColors: ['#4bb2c5',\
  \ '#4baacc', '#4b88aa', '#bbb2c5',\n                      '#bbaa99', '#c5dd99',\
  \ '#dddd77']\n    },\n    {\n       seriesColors:  ['#4bbbbb', '#ccb2c5', '#c5ff99']\n\
  \    },\n    {\n       seriesColors:  ['#aa5555', '#a3ffaa']\n    }]\n};\n\n$.jqplot\
  \ ('myChart', [data, data2, data3], options);\n```\n\n最后，您的努力得到了回报，得到了图 6-6 中的多层饼图。\n\
  \n![9781484208632_Fig06-06.jpg](img/9781484208632_Fig06-06.jpg)\n\n图 6-6. 一个多层饼图\n\
  \n## 总结\n\n在本章中，您已经了解了 jqPlot 库如何允许您通过**饼图**（使用单个数据系列）或**环形图**（使用多个数据系列）来表示数据，同时快速了解了一些主要属性以及如何在选项中设置它们。在本章的最后部分，您创建了一个**多层饼图**：这是一个经典的示例，展示了如何通过适当修改某些属性来生成一种库未提供的标准图表类型。\n\
  \n在下一章中，您将看到 jqPlot 库如何让您实现**蜡烛图**，以及如何处理这种图表基础的特定数据格式**开盘-最高-最低-收盘 (OHLC)**。\n\n"
- '# 第 7 章


  


  '
- "# 使用 jqPlot 绘制蜡烛图\n\n\n\n## K 线图\n\nK 线图广泛应用于分析货币随时间的变化或价格走势。这种图表由一系列称为 K 线的垂直柱状图组成。它们显示给定时间段内的开盘价、收盘价、最低价和最高价（参见图\
  \ 7-1）。因此，这种图表通常被称为 OHLC 图（当它报告开盘-最高-最低-收盘值时）或 HLC 图（当它仅报告最高-最低-收盘值时）。\n\n![9781484208632_Fig07-01.jpg](img/9781484208632_Fig07-01.jpg)\n\
  \n图 7-1. 表示 OHLC 数据的不同方式：(a) 线形，(b) 实体\n\nK 线可以描绘为简单的线条，或描绘为两端带有线条（称为影线或阴影）的方框（称为实体）。每根\
  \ K 线的高度表示给定时间段内的价格范围。在方框表示法中，实体是开盘价和收盘价之间的区域。然而，如果 K 线由一条简单的垂直线表示，则两个小的水平刻度表示开盘价（左侧刻度）和收盘价（右侧刻度）。此外，在\
  \ K 线图中，数据点的颜色根据价格是上涨还是下跌而不同。\n\n在本章中，你将看到如何表示特定的`OHLC`数据。你还将学习如何使用线条或实体来格式化此类图表。不过，首先你需要引入`OHLCRenderer`插件。\n\
  \n## OHLC 图\n\n要使 jqPlot 能够绘制 K 线图，你必须在网页中包含一个特定的插件：`OHLCRenderer`。\n\n你还需要包含`DateAxisRenderer`插件，因为在\
  \ K 线图中，你通常将日期值放在 x 轴上：\n\n```\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.dateAxisRenderer.min.js\"\
  >\n</script>\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.ohlcRenderer.min.js\"\
  >\n</script>\n```\n\n关于输入数据数组，你必须遵循特定的顺序：\n\n`['时间戳', 开盘价, 最高价, 最低价, 收盘价]`\n\n在本例中，你将使用一组在线可用的真实数据。这些数据来自一个由名为\
  \ Dukascopy 的免费工具生成的逗号分隔值（CSV）文件，该工具也可在线获取（`www.dukascopy.com`）。你选择了 2012 年大约一个月期间的欧元兑美元汇率值。让我们将所有值赋给一个变量，如代码清单\
  \ 7-1 所示。\n\n***代码清单 7-1***. Ch7_01a.html\n\n```\nvar ohlc = [\n['8/08/2012 0:00:01',\
  \ 1.238485, 1.2327, 1.240245, 1.23721],\n['8/09/2012 0:00:01', 1.23721, 1.22671,\
  \ 1.23873, 1.229295],\n['8/10/2012 0:00:01', 1.2293, 1.22417, 1.23168, 1.228975],\n\
  ['8/12/2012 0:00:01', 1.229075, 1.22747, 1.22921, 1.22747],\n['8/13/2012 0:00:01',\
  \ 1.227505, 1.22608, 1.23737, 1.23262],\n['8/14/2012 0:00:01', 1.23262, 1.23167,\
  \ 1.238555, 1.232385],\n['8/15/2012 0:00:01', 1.232385, 1.22641, 1.234355, 1.228865],\n\
  ['8/16/2012 0:00:01', 1.22887, 1.225625, 1.237305, 1.23573],\n['8/17/2012 0:00:01',\
  \ 1.23574, 1.22891, 1.23824, 1.2333],\n['8/19/2012 0:00:01', 1.23522, 1.23291, 1.235275,\
  \ 1.23323],\n['8/20/2012 0:00:01', 1.233215, 1.22954, 1.236885, 1.2351],\n['8/21/2012\
  \ 0:00:01', 1.23513, 1.23465, 1.248785, 1.247655],\n['8/22/2012 0:00:01', 1.247655,\
  \ 1.24315, 1.254415, 1.25338],\n['8/23/2012 0:00:01', 1.25339, 1.252465, 1.258965,\
  \ 1.255995],\n['8/24/2012 0:00:01', 1.255995, 1.248175, 1.256665, 1.2512],\n['8/26/2012\
  \ 0:00:01', 1.25133, 1.25042, 1.252415, 1.25054],\n['8/27/2012 0:00:01', 1.25058,\
  \ 1.249025, 1.25356, 1.25012],\n['8/28/2012 0:00:01', 1.250115, 1.24656, 1.257695,\
  \ 1.2571],\n['8/29/2012 0:00:01', 1.25709, 1.251895, 1.25736, 1.253065],\n['8/30/2012\
  \ 0:00:01', 1.253075, 1.248785, 1.25639, 1.25097],\n['8/31/2012 0:00:01', 1.25096,\
  \ 1.249375, 1.263785, 1.25795],\n['9/02/2012 0:00:01', 1.257195, 1.256845, 1.258705,\
  \ 1.257355],\n['9/03/2012 0:00:01', 1.25734, 1.25604, 1.261095, 1.258635],\n['9/04/2012\
  \ 0:00:01', 1.25865, 1.25264, 1.262795, 1.25339],\n['9/05/2012 0:00:01', 1.2534,\
  \ 1.250195, 1.26245, 1.26005],\n['9/06/2012 0:00:01', 1.26006, 1.256165, 1.26513,\
  \ 1.26309],\n['9/07/2012 0:00:01', 1.26309, 1.262655, 1.281765, 1.281625],\n['9/09/2012\
  \ 0:00:01', 1.28096, 1.27915, 1.281295, 1.279565],\n['9/10/2012 0:00:01', 1.27957,\
  \ 1.27552, 1.28036, 1.27617],\n['9/11/2012 0:00:01', 1.27617, 1.2759, 1.28712, 1.28515],\n\
  ['9/12/2012 0:00:01', 1.28516, 1.281625, 1.29368, 1.290235]];\n```\n\n在`options`中，你通过在`series`对象上调用`OHLCRenderer`插件来激活它。因为你需要处理\
  \ x 轴上的日期值，所以必须在`xaxis`对象中激活`dateAxisRenderer`对象。对于这种类型的图表，最好定义你想要表示的时间段，而不考虑输入数据，以便更精确地控制显示内容。为此，你在`xaxis`对象中指定了`min`和`max`属性。你还可以看到，使用`dateAxisRenderer`，你可以使用文字表达式（`'1\
  \ day'`、`'n days'`、`'1 week'`、`'n weeks'`、`'1 month'`、`'n months'`，其中`n`是任何大于 1\
  \ 的整数）来选择刻度间隔。此外，请注意`yaxis`尚未定义，或者说 y 值已归属于`y2axis`。这样做是为了让 y 轴位于图表的右侧边缘，而不是默认的左侧边缘（参见代码清单\
  \ 7-2）。\n\n***代码清单 7-2***. ch12_01a.html\n\n```\nvar options = {\n    title: 'EUR-USD\
  \ Exchange',\n    seriesDefaults:{ yaxis: 'y2axis'},\n    axes: {\n       xaxis:\
  \ {\n          renderer: $.jqplot.DateAxisRenderer,\n          tickOptions: {formatString:\
  \ '%b %e'},\n          min: \"08-07-2012 16:00\",\n          max: \"09-12-2012 16:00\"\
  ,\n          tickInterval: \"1 weeks\"\n       },\n       y2axis: {\n          tickOptions:{\
  \ formatString: '$%.2f'}\n       }\n    },\n    series: [{ renderer: $.jqplot.OHLCRenderer}]\n\
  };\n\n$.jqplot('myChart', [ohlc], options);\n```\n\n现在你得到了图 7-2 中所示的 OHLC 图。\n\n\
  ![9781484208632_Fig07-02.jpg](img/9781484208632_Fig07-02.jpg)\n\n图 7-2. 一个带线条的 OHLC\
  \ 图\n\n\n\n## 使用真实 K 线实体和影线\n\n你刚刚看到的 K 线图是用条形线格式化的。如果你想要一个带有真实 K 线实体和影线的盒子表示，你需要设置一个额外的属性：`candlestick`（参见清单\
  \ 7-3）。\n\n***清单 7-3***。`ch12_01b.html`\n\n```\nseries: [{\n    renderer: $.jqplot.OHLCRenderer,\n\
  \    rendererOptions:{ candleStick: true }\n}]\n```\n\n现在，让我们看看替代条形线上水平刻度的真实 K 线实体。在图\
  \ 7-3 中，白色盒子表示价格上涨（开盘价低于收盘价），黑色盒子表示价格下跌（收盘价低于开盘价）。\n\n![9781484208632_Fig07-03.jpg](img/9781484208632_Fig07-03.jpg)\n\
  \n图 7-3。带有盒子的 OHLC 图表\n\n## 比较 K 线图\n\n有时，你需要比较特定时间点代表不同类别的 K 线图。在这种情况下，x 轴上没有日期，而是主题本身的名称。输入数据数组将有所不同；你必须使用从中获取数据的类别标签来分隔\
  \ OHLC 数据。对于每个实体，你插入一个包含五个值的数组：\n\n`[n, open, max, min, close]`\n\n在这里，`n`是一个整数，对应于刻度数组的索引，而不是时间戳。因此，你在`data1`数组中定义这些\
  \ OHLC 值，如清单 7-4 所示。在`ticks`数组中，你使用四个不同的标签来指示四个 OHLC 值中的每一个。\n\n***清单 7-4***。`Ch7_02.html`\n\
  \n```\nvar data1 = [[1, 75, 80, 40, 55], [2, 30, 60, 15, 50],\n             [3,\
  \ 64, 75, 48, 50], [4, 67, 78, 20, 36]];\nvar ticks = ['Apple', 'Ubuntu', 'Microsoft',\
  \ 'Android'];\n```\n\n你将调用`DateAxisRenderer`插件替换为调用`CategoryAxisRenderer`插件：\n\n\
  ```\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.categoryAxisRenderer.min.js\"\
  >\n</script>\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.ohlcRenderer.min.js\"\
  >\n</script>\n```\n\n正如你在清单 7-5 中所见，`options`中的设置非常简单。首先，你必须在`renderer`属性中将`$.jqplot.DateAxisRenderer`替换为`$.jqplot.CategoryAxisRenderer`。此外，你将`ticks`数组分配给`xaxis`中的`ticks`对象。\n\
  \n***清单 7-5***。`Ch7_02.html`\n\n```\nvar options = {\n    axes: {\n       xaxis:\
  \ {\n          renderer: $.jqplot.CategoryAxisRenderer,\n          ticks: ticks\n\
  \       },\n    },\n    series: [{\n       renderer: $.jqplot.OHLCRenderer,\n  \
  \     rendererOptions:{ candleStick: true}\n    }]\n};\n\n$.jqplot ('myChart', [data1],\
  \ options);\n```\n\n这个图表完美地展示了带有真实 K 线实体的盒子表示；当价格下跌时盒子被填充，当价格上涨时盒子为空（参见图 7-4）。\n\
  \n![9781484208632_Fig07-04.jpg](img/9781484208632_Fig07-04.jpg)\n\n图 7-4。一个比较性的\
  \ K 线图\n\n## 总结\n\n在本章中，你已经了解了如何通过**K 线图**来表示特定的**OHLC**数据。你还学习了如何使用线条或真实 K 线实体来格式化此类图表。\n\
  \n在下一章中，我将讨论一整类具有共同特征的图表：它们的目标是表示数据的**分布**。通过这次探索，你将发现如何使用 jqPlot 库实现**散点图**、**气泡图**和**块图**。\n\
  \n"
- '# 第 8 章


  


  '
- "# 使用 jqPlot 绘制散点图和气泡图\n\n在本章中，我将讨论一类在表示数据分布时特别有用的图表。你可能会经常发现自己对一组数据如何沿着由 x 轴和 y\
  \ 轴定义的两个不同参数所定义的空间进行分布感兴趣。这种数据分布可以暗示相关性或聚类。\n\n散点图是显示数据分布的最佳选择，尤其是在需要分析大量数据集时。因此，你将首先通过一个简单的示例学习如何实现这种图表。随后，你将看到一旦定义了两个不同的数据组（聚类），如何通过趋势线突出显示\
  \ x 和 y 变量之间的相关性。\n\n最后，你将分析另外两种类型的图表：气泡图和块图。这些可以被视为散点图的变体——其中数据点被替换为气泡或块。当你需要用三个不同的参数表示数据时（散点图仅适用于两个参数），会使用气泡图；第三个参数由气泡的半径表示。块图是一种特殊的散点图，其中你使用包含标签的盒子来代替数据点。\n\
  \n## 散点图（xy 图）\n\n乍一看，你可能会认为散点图（也称为散点图或 xy 图）是一种点未连接的折线图，但这将是一个错误。实际上，散点图以及气泡图和块图是一种特殊类型的图表。在散点图中，点由`(x,\
  \ y)`对表示，但你可以得到许多具有相同 x 值的点，这使得用线连接它们既困难又没有必要。折线图的目的是跟踪 y 值在 x 值范围内的变化过程。散点图的目的是显示一组可能具有某种关系（可能是非线性的）也可能没有关系的点的集合。此外，你可能想要分析这些点及其在`(x,\
  \ y)`空间中的分布，例如，当它们分布在空间上分离的组中时。\n\n你使用默认设置（如折线图），禁用点之间的连线。让我们以两个可能呈现某种关系的`(x, y)`数据集合为例，如清单\
  \ 8-1 所示。\n\n***清单 8-1***。`Ch8_04a.html`\n\n```\nvar data = [[400, 35], [402, 37],\
  \ [650, 55], [653, 56], [650, 50],\n            [700, 55], [600, 37], [601, 43],\
  \ [450, 38], [473, 37],\n            [480, 42], [417, 37], [510, 41], [553, 44],\
  \ [570, 39],\n            [527, 41], [617, 41], [625, 49]];\nvar data2 = [[100,\
  \ 40], [600, 80], [200, 50], [300, 55], [400, 60],\n             [500, 70], [123,\
  \ 43], [110, 41], [157, 45], [160, 48],\n             [237, 49], [248, 55], [287,\
  \ 50], [321, 59], [359, 52],\n             [387, 62], [466, 68], [533, 74], [344,\
  \ 60], [323, 51],\n             [430, 65]];\n```\n\n你输入的点不遵循任何顺序，这与折线图中的点不同。如前所述，你使用默认设置，通过将`showLine`属性设置为`false`来禁用点之间的连线（参见清单\
  \ 8-2）。\n\n***清单 8-2***。`Ch8_04a.html`（使用`false`禁用点之间的连线）\n\n```\nvar options =\
  \ {\n    title: 'Scatter Chart',\n    seriesDefaults: {\n       showLine: false,\n\
  \       showMarkers: true\n    }\n};\n$.jqplot ('myChart', [data, data2], options);\n\
  ```\n\n\n\n由此，您将得到如图 8-1 所示的散点图，其中两组数据覆盖了图表的不同区域。这些数据点被清晰地划分为不同的组别。\n\n![9781484208632_Fig08-01.jpg](img/9781484208632_Fig08-01.jpg)\n\
  \n图 8-1. 散点图\n\n只有当两组数据都呈现出来时，判断它们遵循线性趋势还是指数趋势才有意义。此时，您可以使用`jqPlot`的趋势线功能。因此，您需要引入`Trendline`插件：\n\
  \n```\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.trendline.min.js\"\
  ></script>\n```\n\n或者，如果您更倾向于使用内容分发网络（CDN）服务，可以按如下方式操作：\n\n```\n<script type=\"\
  text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.trendline.min.js\"\
  ></script>\n```\n\n然后，为两个序列都激活`Trendline`插件，并为每条线分配不同的颜色（参见代码清单 8-3）。\n\n***代码清单\
  \ 8-3***. Ch8_04b.html\n\n```\nvar options = {\n    title: 'Scatter Chart',\n  \
  \  seriesDefaults: {\n       showLine: false,\n       showMarkers: true\n    },\n\
  \    series: [{\n       trendline: {\n          show: true,\n          color: '#0000ff',\n\
  \          type: 'exponential'\n       }\n    },{\n       trendline: {\n       \
  \   show: true,\n          color: '#ff0000'\n       }\n    }]\n};\n```\n\n最终，您将得到一个包含两个不同序列的散点图，每个序列都带有各自的趋势线，如图\
  \ 8-2 所示。\n\n![9781484208632_Fig08-02.jpg](img/9781484208632_Fig08-02.jpg)\n\n图\
  \ 8-2. 带趋势线的散点图\n\n## 气泡图\n\n当您需要以三维方式展示数据时，可以使用气泡图。每个实体由一个独立值的三元组`(v1, v2, v3)`表示。其中两个值通过绘制一个以`(x,\
  \ y)`点为中心的圆盘来表示。第三个值则通过圆盘半径`(r)`来表示。因此，`(v1, v2, v3)`三元组必须转换为`(x, y, r)`。这三个值`(v1,\
  \ v2, v3)`中哪个是半径，哪个是`x`或`y`，取决于图表设计者的技巧。\n\n与 xy 图表类似，气泡图常用于识别所表示数据之间可能存在的关系，甚至观察它们是否属于不同的组别。这种方法常见于科学、医学和经济数据分析中。\n\
  \n`jqPlot`中有一个专门用于气泡图的插件：`BubbleRenderer`。因此，您需要在网页中包含此插件：\n\n```\n<script type=\"\
  text/javascript\" src=\"../src/plugins/jqplot.bubbleRenderer.min.js\"></script>\n\
  ```\n\n或者，如果您更倾向于使用 CDN 服务，可以按如下方式操作：\n\n```\n<script type=\"text/javascript\" src=\"\
  http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.bubbleRenderer.min.js\"></script>\n\
  ```\n\n输入数据数组的每个项目包含四个值：\n\n`[x, y, radius, <label or object>]`\n\n前两个值代表`(x, y)`坐标，第三个值（注意！）与气泡的半径成正比，最后一个值代表参考标签（实际上，您也可以传递一个对象；稍后会详细介绍）。代码清单\
  \ 8-4 定义了一个数组，其中包含七个欧洲国家的特征值：`x`值代表国土面积；`y`值代表人口；半径代表经济价值。第四个值是报告国家名称的标签。\n\n***代码清单\
  \ 8-4***. Ch8_01a.html\n\n```\nvar data = [[301,60,29392,\"Italy\"], [675,65,34205,\"\
  France\"],\n            [506,46,30625,\"Spain\"], [357,81,37896,\"Germany\"],\n\
  \            [450,9,37333,\"Sweden\"], [30,11,37736,\"Belgium\"],\n            [132,11,27624,\"\
  Greece\"]];\n```\n\n现在，让我们分析如何设置`options`变量（参见代码清单 8-5）。您需要在`seriesDefault`对象中激活`BubbleRenderer`插件，并将`bubbleGradients`属性设置为`true`。这将为“气泡”填充颜色渐变，从而产生立体感：使圆盘看起来像是球体。如您所见，对于此插件，您无需创建一个包含气泡标签的数组，然后将其显式分配给`options`中的某个对象；标签会自动从输入数据数组中读取。需要在`options`中指定的设置很少且简单。\n\
  \n***代码清单 8-5***. Ch8_01a.html (设置`options`变量)\n\n```\nvar options = {\n    title:\
  \ 'Bubble Chart with Gradient Fills',\n    seriesDefaults: {\n       renderer: $.jqplot.BubbleRenderer,\n\
  \       rendererOptions: {\n          bubbleGradients: true\n       },\n       shadow:\
  \ true\n    },\n    axes: {\n       xaxis: {\n          label: \"Total area [*1000\
  \ km3]\"\n       },\n       yaxis: {\n          label: \"Population [million]\"\n\
  \       }\n    }\n};\n\n$.jqplot ('myChart', [data], options);\n```\n\n最后，仅需这几行代码，您就能得到图\
  \ 8-3 中展示的精美气泡图。\n\n![9781484208632_Fig08-03.jpg](img/9781484208632_Fig08-03.jpg)\n\
  \n图 8-3. 气泡图\n\n之前，我们提到了在输入数据数组中将对象作为第四个值传递的可能性。这里，我们将详细说明这涉及什么。您可以同时传递一个对象，该对象允许您定义每个单独元素（气泡）的标签和颜色。使用前面的示例（参见代码清单\
  \ 8-5），您可以附加与默认序列不同的颜色。例如，假设您想强调某个国家相对于其他国家的价值。您选择瑞典，并为其分配红色。您为其他国家分配各种深浅不同的棕色。然后，将瑞典的数据移动到一个新的数组`data2`中；这是为了确保“瑞典”气泡始终位于前景，并且不会被其他气泡遮挡（参见代码清单\
  \ 8-6）。\n\n***代码清单 8-6***. Ch8_02.html\n\n```\nvar data = [[301, 60, 29392, {label:\
  \ 'Italy',color:'#b39524'}],\n            [675, 65, 34205, {label: 'France', color:'#c39564'}],\n\
  \            [506, 46, 30625, {label: 'Spain',color:'#a39544'}],\n            [357,\
  \ 81, 37896, {label: 'Germany', color:'#b39524'}],\n            [30, 11, 37736,\
  \ {label: 'Belgium',color:'#c39544'}],\n            [132, 11, 27624, {label: 'Greece',\
  \ color:'#a39564'}]];\nvar data2 = [[450, 9, 37333, {label: 'Sweden', color:'#ff2524'}]];\n\
  ```\n\n使用相同的`options`，您只需修改`jqplot()`函数，如代码清单 8-7 所示。您采用这个捷径，因为知道最右侧的数组项将是最后绘制的，因此会出现在前景中。\n\
  \n***代码清单 8-7***. Ch8_02.html (修改`jqplot()`函数)\n\n```\n$.jqplot ('myChart',[data,\
  \ data2], options);\n```\n\n图 8-4 展示了结果。\n\n![9781484208632_Fig08-04.jpg](img/9781484208632_Fig08-04.jpg)\n\
  \n图 8-4. 选定国家位于前景的气泡图\n\n默认的颜色序列在这里很适合您，但您决定将渐变填充改为透明效果。为此，您必须添加`bubbleAlpha`属性，并为其分配所需的透明度值，如代码清单\
  \ 8-8 所示。\n\n***代码清单 8-8***. Ch8_01b.html\n\n\n```javascript\nseriesDefaults: {\n\
  \    renderer: $.jqplot.BubbleRenderer,\n    rendererOptions: {\n       bubbleGradients:\
  \ true,\n       bubbleAlpha: 0.6\n    },\n    shadow: true\n},\n```\n\n图 8-5 展示了带有渐变填充和透明效果的气泡图，透过该效果可以隐约看到底层的气泡。\n\
  \n![9781484208632_Fig08-05.jpg](img/9781484208632_Fig08-05.jpg)\n\n图 8-5. 带透明度的气泡图\n\
  \n## 块状图\n\n块状图（也称为块状图）与气泡图非常相似，但它使用矩形而非圆形。在这里，矩形的大小除了为那些在给定 `(x, y)` 坐标对上应用标签的矩形提供空间外，没有其他意义。\n\
  \n与气泡图一样，需要在网页中包含 `BlockRenderer` 插件：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"../src/plugins/jqplot.blockRenderer.min.js\"></script>\n```\n\n或者，如果你更倾向于使用\
  \ CDN 服务，可以按如下方式操作：\n\n```html\n<script type=\"text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.blockRenderer.min.js\"\
  ></script>\n```\n\n在本示例中，你将使用三个数据系列。输入数据数组的格式应为：\n\n`[x, y, '标签']`,\n\n现在，定义三个不同的数组，如代码清单\
  \ 8-9 所示。\n\n***代码清单 8-9***. Ch8_03.html\n\n```javascript\nvar data1 = [[10, 30,\
  \ '铜'], [100, 40, '金'], [50, 50, '银'],\n             [12, 78, '铅'], [44, 66, '黄铜']];\n\
  var data2 = [[68, 15, '枫木'], [33, 22, '橡木'], [10, 90, '乌木'],\n             [94,\
  \ 30, '山毛榉'], [70, 70, '白蜡木']];\nvar data3 = [[22, 16, 'PVC'], [56, 76, 'PE'], [33,\
  \ 78, 'PET'],\n             [27, 60, 'PC'], [70, 44, 'PU']];\n```\n\n在 `options`\
  \ 中，你只需在 `seriesDefault` 对象中激活 `BlockRenderer` 插件（参见代码清单 8-10）。\n\n***代码清单 8-10***.\
  \ Ch8_03.html（激活 `BlockRenderer` 插件）\n\n```javascript\nvar options = {\n    seriesDefaults:{\n\
  \       renderer: $.jqplot.BlockRenderer\n    }\n};\n\n$.jqplot ('myChart', [data1,\
  \ data2, data3], options);\n```\n\n图 8-6 展示了你刚刚定义的块状图，其中每个系列用不同的颜色标记。\n\n![9781484208632_Fig08-06.jpg](img/9781484208632_Fig08-06.jpg)\n\
  \n图 8-6. 块状图\n\n## 本章小结\n\n在本章中，你学习了如何表示**分布**。你可能会经常发现自己对研究数据在空间中的分布方式感兴趣，以便发现任何可能的趋势或聚类。根据你想要突出显示的内容，你可以选择通过**散点图**、**气泡图**或**块状图**来表示数据。此外，你还了解了如何突出显示分布的趋势。\n\
  \n在下一章中，我将汇集其他类型的图表，这些图表你尚未接触过，但它们是 jqPlot 库中的标准类型。首先，你将学习**漏斗图**以及如何通过 `options`\
  \ 设置其属性。然后，你将了解**贝塞尔曲线**——它们是什么，以及如何通过 jqPlot 实现。\n\n"
- '# 第 9 章


  


  '
- "# 使用 jqPlot 创建漏斗图\n\n漏斗图用于展示数据在逐级向下传递时逐渐减少的过程。该图表由一个倒置的金字塔或漏斗组成，分为不同的层级。每个层级都有其自己的区域，该区域与给定的百分比值成比例。漏斗图与饼图类似，两者都将整体划分为各个组成部分。但是，漏斗图指定了层级，这些层级以非常精确的顺序依次排列。这种顺序可以表示层级顺序、流程步骤等。饼图无法做到这一点。\n\
  \n## 创建漏斗图\n\n即使对于这种专门的图表，jqPlot 也提供了一个特定的插件：`FunnelRenderer`。因此，你需要包含它：\n\n```html\n\
  <script type=\"text/javascript\" src=\"../src/plugins/jqplot.funnelRenderer.min.js\"\
  ></script>\n```\n\n或者，如果你更倾向于使用内容分发网络（CDN）服务，可以按如下方式操作：\n\n```html\n<script type=\"\
  text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.funnelRenderer.min.js\"\
  ></script>\n```\n\n使用 jqPlot 时，你必须了解此渲染器插件的一个特定行为：`FunnelRenderer` 会按降序重新排列数据。最大值显示在漏斗顶部，较小的值则放在下方。每个漏斗部分的面积对应于其数据点的值相对于所有值总和（百分比）的比例。使用此渲染器时，你需要为输入数据数组使用以下格式：\n\
  \n`['标签', 值]`\n\n因此，对于此示例，定义数据数组如下所示：\n\n```javascript\nvar data = [['索尼', 1], ['三星',\
  \ 13], ['LG', 14], ['飞利浦', 5]];\n```\n\n对于 `options`，你必须在 `seriesDefaults` 对象中激活\
  \ `FunnelRenderer` 插件，并且可以选择添加一个图例来报告系列的标签，如代码清单 9-1 所示。\n\n***代码清单 9-1***. Ch9_01a.html\n\
  \n```javascript\nvar options = {\n    seriesDefaults: {\n       renderer: $.jqplot.FunnelRenderer\n\
  \    },\n    title: {\n       text: '基本漏斗图'\n    },\n    legend: {\n       location:\
  \ 'e',\n       show: true\n    }\n};\n\n$.jqplot('myChart', [data], options);\n\
  ```\n\n图 9-1 是一个基本的漏斗图。\n\n![9781484208632_Fig09-01.jpg](img/9781484208632_Fig09-01.jpg)\n\
  \n图 9-1. 一个简单的漏斗图\n\n如你所见，项目的顺序已更改，值最高的元素位于顶部，依此类推，直到值最低的项目。这是基本图表，但你可以对其进行丰富，例如，通过添加报告百分比的标签。为此，你必须添加\
  \ `dataLabel` 属性，将其设置为 `'percent'`，然后通过将 `showDataLabel` 设置为 `'true'` 来启用它（参见代码清单\
  \ 9-2）。\n\n***代码清单 9-2***. Ch9_01b.html\n\n```javascript\nseriesDefaults: {\n  \
  \  renderer: $.jqplot.FunnelRenderer,\n    rendererOptions: {\n       dataLabels:\
  \ 'percent',\n       showDataLabels: true\n    }\n},\n```\n\n如图 9-2 所示，百分比值现在显示在漏斗图的相应部分中。\n\
  \n![9781484208632_Fig09-02.jpg](img/9781484208632_Fig09-02.jpg)\n\n图 9-2. 带有图例和百分比的漏斗图\n\
  \n你可以进行进一步的更改。例如，假设你想要减小漏斗部分之间的间距，如图 9-3 所示。你可以通过传递给 `sectionMargin` 属性的值来实现这一点。通过将\
  \ `sectionMargin` 属性赋值为 `0`，你可以完全消除各部分之间的间距（参见代码清单 9-3）。\n\n***代码清单 9-3***. Ch9_01c.html\n\
  \n```javascript\nrendererOptions: {\n    dataLabels: 'percent',\n    showDataLabels:\
  \ true,\n    sectionMargin: 0\n}\n```\n\n![9781484208632_Fig09-03.jpg](img/9781484208632_Fig09-03.jpg)\n\
  \n图 9-3. 各部分之间无间距的漏斗图\n```\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n# 排版后的内容\n\n或者，您可能希望将各个扇区表示为未填充状态，并增加其边界线的宽度，如图 9-4 所示。为此，您需要使用两个属性：`fill` 和\
  \ `lineWidth`。首先，将 `fill` 属性设置为 `'false'`，这会使 jqPlot 绘制一个空白的扇区；然后，将 `lineWidth`\
  \ 属性设置为 4，从而增加扇区边缘的厚度，使其更加清晰可见（请参阅代码清单 9-4）。\n\n![9781484208632_Fig09-04.jpg](img/9781484208632_Fig09-04.jpg)\n\
  \n图 9-4. 一个未填充扇区的漏斗图\n\n***代码清单 9-4***. Ch9_01d.html\n\n```\nrendererOptions: {\n\
  \    dataLabels: 'percent',\n    showDataLabels: true,\n    fill: false,\n    lineWidth:\
  \ 4\n}\n```\n\n## 总结\n\n在本章中，您学习了如何制作特定类型的漏斗图，以及如何通过 `options` 更改它们的属性。\n\n在下一章中，我将介绍一个在前几章中已经提及的主题：控件。我将阐述在图表中引入控件的重要性，并理解每个控件背后都隐藏着一个\
  \ `options` 的属性。这为用户提供了实时选择属性值的机会。\n\n# 第 10 章\n\n\n\n\
  # 为图表添加控件\n\n有时，在运行时直接从浏览器更改设置，然后使用这些新设置重新绘制图表会非常有用。一种典型的方法是添加活动控件。这些控件使图表具有交互性，允许用户实时做出选择，例如决定图表的呈现方式。通过插入控件，您赋予用户控制图表属性值的能力，而这些属性值通常需要在\
  \ `options` 中设置。\n\n在本章中，您将学习如何在网页中引入控件。您还将考虑导致选择一种控件而非另一种的因素。一系列以三种最常用控件为例的示例，将带您更深入地探讨这个主题。\n\
  \n## 添加控件\n\n一种对控件进行分组的方式是根据其功能。某些控件（例如，按钮、菜单）作为开关（命令控件）工作，用户可以通过它们触发特定事件或启动命令。其他控件（例如，复选框、单选按钮、组合框、滑块）则绑定到特定的值或属性。使用这类控件，用户可以通过文本字段（文本区域）进行选择或输入值。还有一些控件（例如，滚动条）具有导航功能，特别适用于需要移动对象的情况，例如移动列表中的选中项或框架/网页中的大图。\n\
  \n在这里，您将研究那些与值相关联的控件，这些控件允许用户通过做出选择来与图表进行交互。这些控件应以某种图形方式表示特定属性可以取的值（这些值通常就是您在 `options`\
  \ 对象中分配给属性的值，但仅限于您希望提供给用户的那部分）。您对控件的选择将取决于要设置的属性及其可以取的值：\n\n*   要允许用户从一组值中做出单一选择（例如，三种可能的颜色之一），选择互斥的单选按钮作为控件是最佳的（参见图\
  \ 10-1a）。\n*   要允许用户选择图表中应显示哪些系列，您需要使用复选框（参见图 10-1b）。\n*   要允许用户在特定属性的值范围内进行选择（例如，通过调整定义颜色的红绿蓝\
  \ (RGB) 值来更改对象的颜色），滑块通常是最佳选择（参见图 10-1c）（在这种情况下，您将使用三个滑块作为控件，分别对应红色、绿色和蓝色）。\n\n![9781484208632_Fig10-01.jpg](img/9781484208632_Fig10-01.jpg)\n\
  \n图 10-1. 三种最常用的控件：(a) 单选按钮，(b) 复选框，(c) 滑块\n\n可能的控件列表并不仅限于此。但是，理解这些控件背后的机制，能使图表开发人员处理绝大多数情况，包括那些最复杂的情况。\n\
  \n在接下来的示例中，您将了解如何将这三种控件应用到您的图表中。\n\n## 使用单选按钮\n\n为了说明控件的使用，让我们首先看看单选按钮。单选按钮是一组以列表形式分组的小按钮（参见图\
  \ 10-1a）。它们通常表示为小的空心圆圈，旁边带有文本。如前所述，这种类型的控件与某个值或属性相关联。单选按钮的特殊之处在于它们的值是互斥的；因此，用户只能选择其中一个。\n\
  \n举例来说，我们以一个简单的多系列折线图为例，您希望允许用户决定显示哪个系列，而不是显示所有系列。要进行选择，用户将单击其中一个单选按钮，用圆点填充该圆圈。与该控件对应的系列随后将被绘制在图表上。\n\
  \n### 添加单选按钮控件\n\n首先，您需要编写 HTML 页面，并导入所有必要的库（参见代码清单 10-1）。\n\n***代码清单 10-1***. ch10_01.html\n\
  \n```\n<HTML>\n<HEAD>\n<TITLE>使用控件选择系列</TITLE>\n<!--[if lt IE 9]>\n<script type=\"\
  text/javascript\" src=\"../src/excanvas.js\"></script>\n<![endif]-->\n<script type=\"\
  text/javascript\" src=\"../src/jquery.min.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"../src/jquery.jqplot.min.js\"></script>\n<link rel=\"stylesheet\" type=\"\
  text/css\" href=\"../src/jquery.jqplot.min.css\"/>\n<script>\n$(document).ready(function(){\n\
  \n//在此处添加您的代码\n\n});\n</script>\n</HEAD>\n<BODY>\n<div id=\"myChart\" style=\"height:\
  \ 300px; width: 500px;\"></div>\n    <!-- 在此处添加包含控件的表格 -->\n</BODY>\n</HTML>\n```\n\
  \n或者，如果您更喜欢使用内容分发网络 (CDN) 服务，可以使用以下代码：\n\n```\n<!--[if lt IE 9]>\n<script src=\"\
  http://cdn.jsdelivr.net/excanvas/r3/excanvas.js\"></script>\n<![endif]-->\n<script\
  \ src=\"http://code.jquery.com/jquery-1.9.1.min.js\"></script>\n<script type=\"\
  text/javascript\"\n    src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/jquery.jqplot.min.js\"\
  ></script>\n<link rel=\"stylesheet\" type=\"text/css\"\n    href=\"http://cdn.jsdelivr.net/jqplot/1.0.8/jquery.jqplot.min.css\"\
  />\n```\n\n您从一个折线图开始，其中将表示四组值。每个系列中的每个元素将由一个 (x, y) 值对表示；您将这四个系列的值插入到 jQuery `$(document).ready()`\
  \ 函数内定义的数据集中，如代码清单 10-2 所示。\n\n***代码清单 10-2***. ch10_01.html\n\n\n```javascript\n\
  var dataSet = {\n    data1: [[1, 1], [2, 2], [3, 3], [4, 2], [5, 3], [6, 4]],\n\
  \    data2: [[1, 3], [2, 4], [3, 5], [4, 6], [5, 5], [6, 7]],\n    data3: [[1, 5],\
  \ [2, 6], [3, 8], [4, 9], [5, 7], [6, 9]],\n    data4: [[1, 7], [2, 8], [3, 9],\
  \ [4, 11], [5, 10], [6, 11]]\n};\n```\n\n但是，与之前用不同颜色的线条显示所有四个序列不同，这次你为用户提供了每次只显示一个序列的机会。图表在浏览器中加载后，用户将能够选择四个序列中的任意一个并在它们之间切换，而无需加载新页面。\n\
  \n你首先只展示第一个序列（`data1`）（参见清单 10-3）。\n\n***清单 10-3***. ch10_01.html\n\n```javascript\n\
  var options = {\n    seriesDefaults: {\n       showMarker: false\n    },\n    title:\
  \ '序列选择',\n    axes: {\n       xaxis: {},\n       yaxis: {\n          min: 0,\n\
  \          max: 12\n       }\n    }\n};\n\nvar plot1 = $.jqplot ('myChart', [dataSet.data1],\
  \ options);\n```\n\n![图片](img/sq.jpg) **注意** 在此示例中，你将 `$.jqplot()` 函数返回的值存储在 `plot1`\
  \ 变量中。这使你能够访问 `jqplot` 对象的内容、更改其值并调用其方法，包括 `replot()` 函数，该函数允许你重新绘制图表并包含新的更改。\n\n\
  用户将从一组可能的选项中选择一个；单选按钮是实现此目的的最佳控件选择。因此，让我们为每个单选按钮分配一个序列。如清单 10-4 所示，所有控件（按钮）都包含在表格内的一个内部列表中。每个按钮由一个\
  \ `<input>` 元素指定，其中四个序列也作为值被指定。\n\n***清单 10-4***. ch10_01.html\n\n```html\n<table>\n\
  <tr>\n  <td>\n    <div>\n      <ul>\n        <li><input name=\"dataSeries\" value=\"\
  data1\" type=\"radio\" checked />第一序列</li>\n        <li><input name=\"dataSeries\"\
  \ value=\"data2\" type=\"radio\" />第二序列</li>\n        <li><input name=\"dataSeries\"\
  \ value=\"data3\" type=\"radio\" />第三序列</li>\n        <li><input name=\"dataSeries\"\
  \ value=\"data4\" type=\"radio\" />第四序列</li>\n       </ul>\n    </div> </td>\n</tr>\n\
  </table>\n```\n\n然而，仅在 HTML 页面中设置控件定义是不够的；你还必须创建将单选按钮与 jqPlot 图表关联起来的函数。根据哪个单选按钮处于\
  \ `checked` 状态，图表中将加载数据集中的不同集合。\n\n当用户选择不同的单选按钮时，会将 `checked` 属性从 `'false'` 更改为\
  \ `'true'`。单选按钮的状态变化会触发 `change()` 函数，该函数会检测到此事件。此函数将数据集中的新集合分配给 `plot1` 变量（包含有关\
  \ jqPlot 图表的所有信息），并最终强制重新绘制图表。这样，新数据就会在图表中呈现，而无需重新加载页面（参见清单 10-5）。\n\n***清单 10-5***.\
  \ ch10_01.html\n\n```javascript\n$(document).ready(function(){\n    ...\n    var\
  \ plot1 = $.jqplot ('myChart', [dataSet.data1], options);\n    $(\"input[type=radio][name=dataSeries]\"\
  ).attr(\"checked\", false);\n    $(\"input[type=radio][name=dataSeries][value=data1]\"\
  ).attr(\"checked\", true);\n    $(\"input[type=radio][name=dataSeries]\").change(function(){\n\
  \       var val = $(this).val();\n       plot1.series[0].data = dataSet[val];\n\
  \       plot1.replot();\n    });\n});\n```\n\n要自定义控件表格内的元素，你可以添加一些层叠样式表（CSS）样式，如清单\
  \ 10-6 所示。\n\n***清单 10-6***. ch10_01.html\n\n```css\n<style>\nli {\n    font-family:\
  \ \"Verdana\";\n    font-size: 16px;\n    font-weight: bold;\n    text-shadow: 1px\
  \ 2px 2px #555555;\n    margin: 3px;\n    list-style: none;\n}\n</style>\n```\n\n\
  如果你在浏览器中加载此网页，你将得到图 10-2 中的图表。\n\n![9781484208632_Fig10-02.jpg](img/9781484208632_Fig10-02.jpg)\n\
  \n图 10-2. 使用单选按钮可以选择仅显示一个数据序列\n\n现在，用户可以选择图表中要显示的序列。通过选择单选按钮作为控件，图表每次将只显示一组数据。\n\
  \n## 在图表绘制完成后访问属性\n\n到目前为止，你已使用 `options` 对象来定义图表的属性值（通过更改默认值），然后将其作为参数传递给 `$.jqplot()`\
  \ 函数。但这仅适用于在图表绘制之前对其进行设置。如果之后需要访问属性值，该怎么办？\n\n事实上，通过将控件作为参数引入，你也引入了在图表绘制后更改这些属性的可能性。因此，必须有一种方法来访问这些值、编辑它们，然后运行命令重新绘制图表（就像你使用\
  \ `replot()` 函数时一样）（参见清单 10-5）。\n\n你已经看到，你可以将 `$.jqplot()` 函数返回的整个 `jqplot` 对象作为值接收，并将其存储在一个变量中（在前面的示例中，是\
  \ `plot1` 变量），以便稍后访问其内容。\n\n一个 `jqplot` 对象几乎包含了定义整个 jqPlot 库的所有对象及其属性和方法，并且每个特定的实例（例如\
  \ `plot1`）都是在特定图表的表示中实现的。\n\n因此，当你编写 JavaScript 代码来定义处理特定事件（例如用户使用控件）的函数时，你可以在页面绘制图表后访问这些值并更改它们，然后运行命令以所需的更改重新绘制图表。这为你需要的图表增加了交互性。\n\
  \n继续前面的示例（参见清单 10-1 到 10-6），你会注意到所有线条都绘制为蓝色。现在让我们做一些更改，以便这次用户可以选择绘制序列的颜色。\n\n为此，你在表格中添加另一组控件：第二列单选按钮，每个按钮代表一种颜色（参见清单\
  \ 10-7）。\n\n***清单 10-7***. ch10_02.html\n\n```html\n<table>\n<tr>\n  <td>\n    <div>\n\
  \       <ul>\n          <li><input name=\"dataSeries\" value=\"data1\" type=\"radio\"\
  \ checked />第一序列</li>\n          <li><input name=\"dataSeries\" value=\"data2\"\
  \ type=\"radio\" />第二序列</li>\n          <li><input name=\"dataSeries\" value=\"\
  data3\" type=\"radio\" />第三序列</li>\n          <li><input name=\"dataSeries\" value=\"\
  data4\" type=\"radio\" />第四序列</li>\n      </ul>\n    </div>\n  </td>\n  <td>\n \
  \   <div>\n       <ul>\n          <li><input name=\"colors\" value=\"#4bb2c5\" type=\"\
  radio\" checked />蓝色</li>\n          <li><input name=\"colors\" value=\"#ff3333\"\
  \ type=\"radio\" />红色</li>\n          <li><input name=\"colors\" value=\"#44bb44\"\
  \ type=\"radio\" />绿色</li>\n          <li><input name=\"colors\" value=\"#ffaa22\"\
  \ type=\"radio\" />橙色</li>\n      </ul>\n    </div>\n  </td>\n</tr>\n</table>\n\
  ```\n\n接下来，将清单 10-8 中以粗体突出显示的行添加到你的 JavaScript 代码中。\n\n***清单 10-8***. ch10_02.html\n\
  \n```javascript\n$(\"input[type=radio][name=dataSeries]\").attr(\"checked\", false);\n\
  $(\"input[type=radio][name=dataSeries][value=data1]\").attr(\"checked\", true);\n\
  $(\"input[type=radio][name=dataSeries]\").change(function(){\n    var val = $(this).val();\n\
  \    plot1.series[0].data = dataSet[val];\n    plot1.series[0].renderer.shapeRenderer.strokeStyle\
  \ = col;\n    plot1.replot();\n});\n\nvar col = \"#4bb2c5\";\n$(\"input[type=radio][name=colors]\"\
  ).change(function(){\n    col = $(this).val();\n});\n```\n\n图 10-3 展示了用户如何通过选择四种不同颜色来决定要表示的数据系列。这是一个通过添加控件来增强用户与图表之间交互性的示例。\n\
  \n![9781484208632_Fig10-03.jpg](img/9781484208632_Fig10-03.jpg)\n\n图 10-3. 用户可以选择不同的颜色与系列组合\n\
  \n## 使用滑块\n\n在前一个示例中，用户首先通过勾选第二列中的某个单选按钮来设置颜色，然后从第一列中选择要用该颜色表示的数据系列。因此，这个过程涉及两次选择，且发生在两个不同的时间点。这一次，我们将保持第一列不变（用户从中选择要显示的数据系列，且互斥），但用一组三个滑块来替换单选按钮列。在这种场景下，用户选择要显示的数据系列，当该系列以预定义颜色绘制在图表上后，用户可以通过调整构成颜色的三个\
  \ RGB 值来修改它。现在，我们有了一个选择，随后进行微调。\n\n当需要在一个给定范围内滚动连续值来改变某个属性的值时，滑块就是所需的控件类型。在本例中，需要三个滑块，分别对应红色、绿色和蓝色，这样用户就可以调整\
  \ RGB 值来获得所需的颜色。\n\n沿用上一个示例（参见代码清单 10-7 和 10-8），我们首先选择 jQuery 界面库（jQuery UI）来获取滑块（关于如何使用\
  \ jQuery UI 组件实现滑块的详细信息，请参见第 2 章）。因此，在将滑块添加到网页之前，必须导入该库的所有必要文件：\n\n```html\n<link\
  \ rel=\"stylesheet\"\n    href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n<script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n\
  ```\n\n![Image](img/sq.jpg) **注意** 如果你在本书附带的源代码所提供的工作区中工作（参见附录 A），可以使用以下引用访问工作区中已包含的库：\n\
  \n```html\n<link rel=\"stylesheet\" href=\"../src/css/smoothness/jquery-ui-1.10.3.custom.min.css\"\
  />\n<script type=\"text/javascript\" src=\"../src/js/jquery-ui-1.10.3.custom.min.js\"\
  ></script>\n```\n\n导入所有文件后，就可以开始在 HTML 表格中插入三个滑块了。如代码清单 10-9 所示，我们删除了包含单选按钮的第二列，并用一组\
  \ `<div>` 元素替换它（如果你直接从这一步开始，可以复制整个代码清单，而不仅仅是粗体文本）。jQuery UI 会将它们转换为滑块（参见第 2 章）。\n\
  \n***代码清单 10-9***. ch10_04.html\n\n```html\n<table>\n<tr>\n   <td>\n      <div>\n\
  \         <ul>\n           <li><input name=\"dataSeries\" value=\"data1\" type=\"\
  radio\" checked />第一系列</li>\n           <li><input name=\"dataSeries\" value=\"\
  data2\" type=\"radio\" />第二系列</li>\n           <li><input name=\"dataSeries\" value=\"\
  data3\" type=\"radio\" />第三系列</li>\n           <li><input name=\"dataSeries\" value=\"\
  data4\" type=\"radio\" />第四系列</li>\n         </ul>\n      </div>\n   </td>\n   <td>\n\
  \       <div id=\"red\">\n          <div id=\"slider-text\">\n             <div\
  \ id=\"0\">0</div>\n             <div id=\"1\">255</div>\n          </div>\n   \
  \    </div>\n       <div id=\"green\">\n          <div id=\"slider-text\">\n   \
  \          <div id=\"0\">0</div>\n             <div id=\"1\">255</div>\n       \
  \   </div>\n       </div>\n       <div id=\"blue\">\n          <div id=\"slider-text\"\
  >\n             <div id=\"0\">0</div>\n             <div id=\"1\">255</div>\n  \
  \        </div>\n       </div>\n   </td>\n</tr>\n</table>\n```\n\n此外，我们还为每个滑块添加了两个数值，并使用了\
  \ `slider-text id`。这些值只是用于显示三个滑块所覆盖的值范围（0–255）的最小值和最大值的标签。当需要在网页中为每个滑块表示一个刻度时，这种方法非常有用。\n\
  \n现在，让我们添加所有 CSS 样式指令，以确保这些新控件能够在现有页面的上下文中正确显示（参见代码清单 10-10）。\n\n***代码清单 10-10***.\
  \ ch10_04.html\n\n```css\n<style>\n...\n#red, #green, #blue {\n    float: left;\n\
  \    margin: 15px;\n    left: 50px;\n}\n#red .ui-slider-range {\n    background:\
  \ #ef2929;\n}\n#red .ui-slider-handle {\n    border-color: #ef2929;\n}\n#green .ui-slider-range\
  \ {\n    background: #8ae234;\n}\n#green .ui-slider-handle {\n    border-color:\
  \ #8ae234;\n}\n#blue .ui-slider-range {\n    background: #729fcf;\n}\n#blue .ui-slider-handle\
  \ {\n    border-color: #729fcf;\n}\n#slider-text div {\n    font-family: \"Verdana\"\
  ;\n    font-size: 10px;\n    position: relative;\n    left: 17px;\n}\n</style>\n\
  ```\n\n关于 JavaScript 代码部分，我们只保留管理用于选择所需系列的单选按钮的部分，并将其与处理通过三个滑块调整的 RGB 值的新代码部分集成，如代码清单\
  \ 10-11 所示。然后，这三个 RGB 值通过一个适当的函数转换为十六进制数字，并组合成 HTML 颜色代码，该代码由井号（`#`）后跟六个十六进制字符（`'rrggbb'`）表示，其中每对字符代表一个从\
  \ 0 到 255 的值，并转换为十六进制格式。\n\n***代码清单 10-11***. ch10_04.html\n\n```javascript\n$(document).ready(function(){\n\
  \n...\n\n$(\"input[type=radio][name=dataSeries]\").attr(\"checked\", false);\n \
  \   $(\"input[type=radio][name=dataSeries][value=data1]\").attr(\"checked\", true);\n\
  \    $(\"input[type=radio][name=dataSeries]\").change(function(){\n       var val\
  \ = $(this).val();\n       plot1.series[0].data = dataSets[val];\n       plot1.series[0].renderer.shapeRenderer.strokeStyle\
  \ = \"#\" + col;\n       plot1.replot();\n    });\n\nvar col = \"4bb2c5\";\n\nfunction\
  \ hexFromRGB(r, g, b) {\n       var hex = [\n          r.toString(16),\n       \
  \   g.toString(16),\n          b.toString(16)\n       ];\n       $.each(hex, function(nr,\
  \ val) {\n          if ( val.length === 1 ) {\n             hex[nr] = \"0\" + val;\n\
  \          }\n       });\n       return hex.join(\"\").toUpperCase();\n   };\n\n\
  $(\"#red, #green, #blue\").slider({\n       orientation: \"vertical\",\n       range:\
  \ \"min\",\n       max: 255,\n       change: refreshPlot\n    });\n\n// 将 col 设置为默认值\
  \ \"#4bb2c5\";\n    $(\"#red\").slider(\"value\", 255);\n    $(\"#green\").slider(\"\
  value\", 140);\n    $(\"#blue\").slider(\"value\", 60);\n```\n\n```javascript\n\
  function refreshPlot() {\n    var r = $(\"#red\").slider(\"value\");\n    var g\
  \ = $(\"#green\").slider(\"value\");\n    var b = $(\"#blue\").slider(\"value\"\
  );\n    var col = hexFromRGB(r, g, b);\n    plot1.series[0].renderer.shapeRenderer.strokeStyle\
  \ = \"#\" + col;\n    plot1.replot();\n}\n\n$(\"[id=0]\").css('top','90px');\n$(\"\
  [id=1]\").css('top','-20px');\n```\n\n清单 10-11 中的最后两行代码使用了 jQuery 的 `css()` 函数，为特定的\
  \ HTML 元素选择集分配 CSS 样式（参见第 2 章）。该选择针对所有 `id = 0` 和 `id = 1` 的元素，即包含滑块刻度标签的 `<div>`\
  \ 元素。通过设置 CSS 的 `top` 属性，可以将每个刻度标签放置在对应滑块旁边的特定高度位置。\n\n在图 10-4 中，用户可以通过三个滑块修改 RGB\
  \ 值，来决定要显示的数据系列并更改其颜色。\n\n![9781484208632_Fig10-04.jpg](img/9781484208632_Fig10-04.jpg)\n\
  \n图 10-4. 添加了三个滑块控件以调整 RGB 级别的图表\n\n## 使用复选框\n\n在前面的示例中，用户只能从可显示的多个数据系列中选择一个。然而，用户通常希望能够决定哪些系列应该显示，哪些不应该显示，例如，同时显示两个或更多数据集。这涉及到在同一组内进行多项选择。为了让用户能够做出这种选择，你必须使用复选框。\n\
  \n通常，复选框以列表形式分组，由空框表示（参见图 10-1）。与单选按钮不同，这些控件不是互斥的，而是多选的。因此，你可以选择它们所代表的所有值、部分值或完全不选（而使用单选按钮时，必须选中一个项目）。\n\
  \n与单选按钮类似，每个数据系列都有一个复选框，如果某个复选框被选中，则对应的系列会显示在图表中。然而，与单选按钮不同的是，复选框彼此独立：它们的状态（选中或未选中）不会影响其他复选框的状态。\n\
  \n通常，当你有一组复选框时，添加两个具有“全选/取消全选”功能的按钮会非常有用，从而允许用户一键选择/取消选择所有复选框。\n\n使用前面的示例（参见清单 10-9\
  \ 到 10-11），数据集和选项设置保持不变；唯一需要更改的是传递给 `$.jqplot()` 函数的数据。在这种情况下，整个数据集将作为参数传递。\n\n\
  ```javascript\nvar plot1 = $.jqplot ('myChart', [dataSet.data1, dataSet.data2, dataSet.data3,\
  \ dataSet.data4], options);\n```\n\n让我们删除包含先前控件（单选按钮、滑块）的表格，并用一个包含复选框的新表格替换它，如清单\
  \ 10-12 所示（如果你直接从这里开始，可以复制整个清单，无需考虑之前的控件）。此外，除了对应各个系列的四个控件外，你还可以在末尾添加一个按钮来管理“全选/取消全选”功能。\n\
  \n***清单 10-12***. ch10_03.html\n\n```html\n<table>\n<tr>\n   <td>\n      <div>\n\
  \        <ul>\n          <li><input name=\"data1\" type=\"checkbox\" checked />第一系列</li>\n\
  \          <li><input name=\"data2\" type=\"checkbox\" checked />第二系列</li>\n   \
  \       <li><input name=\"data3\" type=\"checkbox\" checked />第三系列</li>\n      \
  \    <li><input name=\"data4\" type=\"checkbox\" checked />第四系列</li>\n         \
  \ <li><input type=\"button\" name=\"checkall\" value=\"取消全选\"></li>\n        </ul>\n\
  \      </div>\n    </td>\n</tr>\n</table>\n```\n\n与单选按钮一样，你需要添加 jQuery 方法来绑定这些控件触发的事件。首先，定义每个复选框的状态。通常，它们应该全部被选中。然后，定义五个\
  \ jQuery 方法，用于启用或禁用要显示的数据系列，并强制重新绘制图表。\n\n从代码中，你必须删除所有处理先前控件的行，并在其位置写入清单 10-13 中的方法。\n\
  \n***清单 10-13***. ch10_03.html\n\n```javascript\n$(\"input[type=checkbox][name=data1]\"\
  ).change(function(){\n    if(this.checked){\n       plot1.series[0].data = dataSet.data1;\n\
  \       plot1.replot();\n    } else {\n       plot1.series[0].data = [];\n     \
  \  plot1.replot();\n    }\n});\n\n$(\"input[type=checkbox][name=data2]\").change(function(){\n\
  \    if(this.checked){\n       plot1.series[1].data = dataSet.data2;\n       plot1.replot();\n\
  \    } else {\n       plot1.series[1].data = [];\n       plot1.replot();\n    }\n\
  });\n\n$(\"input[type=checkbox][name=data3]\").change(function(){\n    if(this.checked){\n\
  \       plot1.series[2].data = dataSet.data3;\n       plot1.replot();\n    } else\
  \ {\n       plot1.series[2].data = [];\n       plot1.replot();\n    }\n});\n\n$(\"\
  input[type=checkbox][name=data4]\").change(function(){\n    if(this.checked){\n\
  \       plot1.series[3].data = dataSet.data4;\n       plot1.replot();\n    } else\
  \ {\n       plot1.series[3].data = [];\n       plot1.replot();\n    }\n});\n\n$(\"\
  input[type=button][name=checkall]\").click(function(){\n    if(this.value == \"\
  全选\"){\n       plot1.series[0].data = dataSet.data1;\n       plot1.series[1].data\
  \ = dataSet.data2;\n       plot1.series[2].data = dataSet.data3;\n       plot1.series[3].data\
  \ = dataSet.data4;\n       $(\"input[type=checkbox][name=data1]\").prop(\"checked\"\
  , true);\n       $(\"input[type=checkbox][name=data2]\").prop(\"checked\", true);\n\
  \       $(\"input[type=checkbox][name=data3]\").prop(\"checked\", true);\n     \
  \  $(\"input[type=checkbox][name=data4]\").prop(\"checked\", true);\n       this.value\
  \ = \"取消全选\";\n       plot1.replot();\n    } else {\n       plot1.series[0].data\
  \ = [];\n       plot1.series[1].data = [];\n       plot1.series[2].data = [];\n\
  \       plot1.series[3].data = [];\n       $(\"input[type=checkbox][name=data1]\"\
  ).prop(\"checked\", false);\n       $(\"input[type=checkbox][name=data2]\").prop(\"\
  checked\", false);\n       $(\"input[type=checkbox][name=data3]\").prop(\"checked\"\
  , false);\n       $(\"input[type=checkbox][name=data4]\").prop(\"checked\", false);\n\
  \       this.value = \"全选\";\n       plot1.replot();\n    }\n});\n```\n\n如图 10-5\
  \ 所示，用户现在可以选择希望在图表中显示的数据系列。\n\n![9781484208632_Fig10-05.jpg](img/9781484208632_Fig10-05.jpg)\n\
  \n图 10-5. 带有复选框和按钮的自定义图例\n\n如果你点击标有“取消全选”的按钮，所有复选框都将被取消选中，对应的数据系列将在图表中隐藏。随后，该按钮将显示标签“全选”。此时再次点击它，所有复选框都将被选中，对应的数据系列将显示在图表中。\n\
  \n最后一个示例中涵盖的功能与 *EnhancedLegendRenderer* 插件提供的图例非常相似（参见第 5 章中的“处理图例”部分）。在那种情况下，通过点击对应数据系列的彩色方块，你可以决定该系列是否应在图表中显示。但是，在这里，你还增加了一键全选和取消全选所有系列的可能性，而此功能目前尚未在该插件中实现（尽管有人正在提议添加）。这是另一个关于如何通过使用控件来扩展库所提供功能的小例子。\n\
  \n## 总结\n\n\n# 第 11 章 将 jqPlot 图表嵌入 jQuery 小部件\n\n在本章中，你已经了解了如何使用各种控件（例如**单选按钮**、**滑块**和**复选框**）来增强图表的交互性。随着控件的引入，我们作为程序员不再是唯一能够直接控制图表属性值的人；通过此类控件，用户也能够做出适当的选择。\n\
  \n此外，你还学习了如何将**jQuery UI 小部件**与`jqPlot`库集成，并将这些小部件**作为控件**使用。在下一章中，你将通过使用 jQuery\
  \ UI 小部件**作为容器**来完善这一集成。这种组合极大地扩展了使用`jqPlot`库开发和呈现图表的可能性。\n\n---\n\n## 将 jqPlot\
  \ 图表嵌入 jQuery 小部件\n\n在第 2 章中，你看到了几个将 jQuery UI 小部件用作容器的示例。在本章中，你将利用这种能力在这些容器内呈现图表。这使你能够利用\
  \ jQuery UI 小部件的巨大潜力，进一步改进图表的呈现方式。\n\n结合 jQuery UI 和`jqPlot`库的优势是多方面的：你可以在网页中占用相同空间的情况下显示更多图表，同时保持页面上下文的整洁有序。另一个优势是\
  \ jQuery UI 小部件可以调整大小，用户甚至也可以调整`jqPlot`图表的大小。\n\n在本章中，你将探讨三个简单的案例，这些案例将充分展示上述优势。你还会更加熟练地使用\
  \ jQuery UI 小部件，甚至比在第 2 章中更加得心应手。\n\n### 在选项卡中显示 jqPlot 图表\n\n你将用作容器的第一个小部件是**选项卡**（参见第\
  \ 2 章中的“选项卡”一节）。将图表插入选项卡内部，可以在有限区域内于同一页面上显示不同的图表。在此示例中，你将在三个选项卡（分别名为`Tab 1`、`Tab\
  \ 2`和`Tab 3`）中放置三个不同的`jqPlot`图表。在第一个选项卡中放置柱状图，第二个选项卡中放置多系列折线图，最后一个选项卡中放置饼图。你不会详细分析这些图表，因为它们与前面章节中使用的图表类型完全相同。每种图表类型都需要其特定的插件，清单\
  \ 11-1 列出了所需的插件。\n\n***清单 11-1***. `ch11_01.html`\n\n```html\n<!--[if lt IE 9]>\n\
  <script src=\"http://cdn.jsdelivr.net/excanvas/r3/excanvas.js\"></script>\n<![endif]-->\n\
