  JavaScript 示例中使用的数据类型。


  我曾提到，大部分工作将由专门的 JavaScript 库完成。在下一章中，你将学习`jQuery`库。这个库将为你提供一系列直接在 DOM 层面操作的工具。在本书后续内容中，你会发现掌握这个库至关重要：许多图形库（包括
  jqPlot）都构建于其上。


