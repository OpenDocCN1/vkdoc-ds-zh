  \n您将使用三种不同的图表，这些图表在前面的章节中已经使用过（折线图见第 4 章，柱状图见第 5 章，饼图见第 6 章）。因此，本章不再赘述其设置细节。将它们添加到我们的网页中，并将通常的目标名称\
  \ `myChart` 替换为 `chart1`、`chart2` 和 `chart3`。如代码清单 11-3 所示，在这些图表中，您直接在三个 `jqplot()`\
  \ 函数内定义了 `options` 对象。它们的返回值分别存储在三个不同的变量中：`plot1`、`plot2` 和 `plot3`。这些变量将用于在 JavaScript\
  \ 代码中处理各自的图表。\n\n***代码清单 11-3***. Ch11_01.html\n\n```javascript\nvar bar1 = [['Germany',\
  \ 12], ['Italy', 8], ['Spain', 6],\n            ['France', 10], ['UK', 7]];\nvar\
  \ data1 = [1, 2, 3, 2, 3, 4];\nvar data2 = [3, 4, 5, 6, 5, 7];\nvar data3 = [5,\
  \ 6, 8, 9, 7, 9];\nvar data4 = [7, 8, 9, 11, 10, 11];\nvar pie1 = [\n    ['Dairy',\
  \ 212], ['Meat', 140], ['Grains', 276],\n    ['Fish', 131], ['Vegetables', 510],\
  \ ['Fruit', 325]\n];\n\nvar plot1 = $.jqplot ('chart1', [bar1], {\n    title: 'Foreigner\
