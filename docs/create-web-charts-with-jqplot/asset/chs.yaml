  \ src=\"../src/plugins/jqplot.barRenderer.min.js\"></script>\n```\n\n随着网页中引入如此多的图形元素，层叠样式表（CSS）的使用变得愈发重要。您需要定义一些设置来修改选项卡的外观，使其符合您的需求。请在代码清单\
  \ 11-2 中添加样式设置。\n\n***代码清单 11-2***. ch11_01.html\n\n```css\n<style>\n.ui-tabs {\n\
