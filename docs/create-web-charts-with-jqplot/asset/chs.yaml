  \n图 11-4。可调整大小的折线图\n\n### 三个可拖动的折线图\n\n从上一个示例开始，您将通过将另外两个折线图放置在两个独立的容器中来添加它们。这里的目标——除了使所有三个容器都可调整大小之外——是使容器可拖动。最终结果是一个包含三个折线图的网页，可以通过拖动来更改它们的位置，甚至可以交换它们的位置。\n\
