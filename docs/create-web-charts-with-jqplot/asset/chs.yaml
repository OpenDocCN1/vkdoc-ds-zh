- "# 第 2 章\n\n\n\n## jQuery 基础\n\n在上一章中，你了解了 DOM 树，并看到 HTML\
  \ 文档由许多元素组成，这些元素可以从初始上下文中创建、修改和删除。这些操作由浏览器通过 JavaScript 命令执行，如前所述，这些命令既可以在页面加载时执行，也可以作为后续事件的结果来执行。为此，人们开发了一个以简单且成熟的方式管理所有这些操作的\
  \ JavaScript 库。这个库就是 jQuery，它完全开源。它由 Jon Resig 于 2006 年创建，并由一个开发团队持续改进。由于其相对于经典\
  \ JavaScript 的实用性以及操作 DOM 元素的能力，jQuery 目前是使用最广泛的 JavaScript 库，并成为所有 Web 开发人员的参考基准。\n\
  \n任何计划在网页中包含 jQuery 库的开发人员都会很快发现伴随这个 UI 库的著名格言的真谛：\"Write less, do more.\"（写得更少，做得更多）。秉承这一口号的精神，jQuery\
  \ 在 JavaScript 代码开发中引入了三个新概念——在使用该 UI 库提供的方法时，你需要牢记这些概念：\n\n*   通过层叠样式表（CSS）选择器选择要应用\
  \ jQuery 方法的 HTML 页面元素（选择集）\n*   构建 jQuery 方法链，可依次应用于同一选择集\n*   使用 jQuery 包装器进行隐式迭代\n\
  \n在本章中，在了解了如何将 jQuery 库包含到你将开发的网页中之后，将介绍\"选择集\"的概念。选择集是 jQuery 库的基础，理解它们以及如何实现它们非常重要，因为本书将始终讨论它们。通过一系列小示例并使用方法链技术，你将浏览\
  \ jQuery 库提供的一系列函数，这些函数允许你操作选择集，以创建、隐藏和更改各种 DOM 元素及其内容。在本章的最后部分，我将介绍`jQuery 用户界面库`（`jQuery\
  \ UI`），并说明其一些最常用的小部件。你将了解它们的基本特性，并发现如何将它们整合到网页中。\n\n本章的目的是让你快速了解 jQuery——其功能和基本概念。详细描述其每个方法超出了本书的范围。在本书的所有示例中，这些方法将在上下文中进行解释。不过，你可能还需要查阅\
  \ jQuery 官方网站（`http://jquery.com/`）上的文档。\n\n## 包含 jQuery 库\n\n现在，有两种方法可以将 jQuery\
  \ 库包含到你的网页中。\n\n*   **本地方法**：在本地下载必要的库，然后将它们添加到网页中。\n*   **CDN 方法**：直接设置指向提供这些 JavaScript\
  \ 库的网站的链接。\n\n提供这些库的网站被称为内容分发网络（CDN）。CDN 是一个大型服务器系统，为最终用户提供高可用性和高性能的内容。当用户尝试访问文件时，CDN\
  \ 会选择离用户最近的服务器。最常用的 CDN 之一是 Google Hosted Libraries。该服务为 Web 应用程序提供对许多最流行的开源 JavaScript\
  \ 库（如 jQuery）的可靠访问。\n\n要从该服务加载库，你需要复制以下 HTML 片段并将其直接粘贴到你的网页中：\n\n```\n<script src=\"\
  http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js\">\n</script>\n\
  ```\n\n另一个可以获取任何版本 jQuery 库的 CDN 站点是 jQuery 本身的官方 CDN 站点：`code.jquery.com`。如果你更喜欢使用该站点的\
  \ URL，则需要复制并粘贴此 HTML 片段：\n\n```\n<script src=\"http://code.jquery.com/jquery-1.9.1.min.js\"\
  ></script>\n```\n\n![Image](img/sq.jpg) **注意** 本章中的所有示例均使用 jQuery 库的 1.9.1 版本。\n\
  \n如果你选择采用本地方式，则需要复制并粘贴 jQuery 库的相对路径。该路径会有所不同，具体取决于库位于 Web 服务器或你的 PC 上的位置。最佳实践是创建一个合适的本地目录，用于加载你需要包含的所有库。\n\
  \n例如，你可能决定将 jQuery 库放在一个`src`目录中，而将正在开发的网页放在一个`charts`目录中，如图 2-1 所示。在这种情况下，你必须使用此相对路径：\n\
  \n```\n<script src=\"../src/js/jquery-1.9.1.js\"></script>\n```\n\n![9781484208632_Fig02-01.jpg](img/9781484208632_Fig02-01.jpg)\n\
  \n图 2-1. Web 服务器上目录组织方式的示例\n\n![Image](img/sq.jpg) **注意** 关于如何在 Web 服务器或 PC 上设置工作区以开发本书示例的详细信息，请参阅附录\
  \ A。你还会找到关于库的不同版本、如何下载它们以及如何将它们包含在工作区中的信息。\n\n## 选择集\n\n选择集是一组被选中以便以某种方式进行操作的 HTML\
  \ 元素。实际上，这是 jQuery 背后的主要概念。让我们以代码清单 2-1 中的简单 HTML 页面为例：\n\n***代码清单 2-1***. ch2_01a.html\n\
  \n```\n<HTML>\n<HEAD>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js\"\
  ></script>\n</HEAD>\n<BODY>\n<div> 这是第一段文本</div>\n<div class=\"selected\"> 这是第二段文本</div>\n\
  <div> 这是最后一段文本</div>\n</BODY>\n</HTML>\n```\n\n在这个页面中，有三个包含不同文本的`<div>`元素。列表中的第二个元素被标记了类名`'selected'`。要选择所有三个元素，你可以使用选择器`'div'`，它会在页面的所有元素中识别出它们。\n\
  \n接下来，你编写`jQuery()`函数，并将选择器作为参数传递。这样，你就选择了这三个元素及其内容。要获取文本，你使用`text()`函数，将其链接到`jQuery()`函数调用之后，并在`<head>`部分的末尾添加这一行，如代码清单\
  \ 2-2 所示。\n\n***代码清单 2-2***. ch2_01a.html\n\n```\n<script>\nvar text = jQuery('div').text();\n\
  console.log(text);\n</script>\n```\n\n三个`<div>`元素中包含的所有文本都已分配给变量`text`。要查看其内容（这在调试中非常有用），你可以使用`console.log()`函数，然后在\
  \ Google Chrome 中，通过右键单击页面直接选择\"检查\"（参见图 2-2）。\n\n![9781484208632_Fig02-02.jpg](img/9781484208632_Fig02-02.jpg)\n\
  \n\n\n图 2-2. 变量 `text` 包含了三个 `<div>` 元素中的文本\n\n根据你进行选择的频率，你也可以使用 `$()` 来调用此函数，如代码清单\
  \ 2-3 所示。在本书提供的示例中，我们将使用此选项。\n\n***代码清单 2-3***. ch2_01b.html\n\n```\n<script>\n\
  var text = $('div').text();\nconsole.log(text);\n</script>\n```\n\n相比之下，如果你只想选择三个\
  \ `<div>` 元素中的一个，可以通过为每个元素分配一个类名，然后对所选元素的名称（而非标签元素）应用选择器来区分它们（代码清单 2-4）。\n\n***代码清单\
  \ 2-4***. ch2_01c.html\n\n```\n<script>\nvar text = $('.selected').text();\nconsole.log(text);\n\
  </script>\n```\n\n在这种情况下，变量 `text` 仅包含第二个 `<div>` 元素的文本，如图 2-3 所示。\n\n![9781484208632_Fig02-03.jpg](img/9781484208632_Fig02-03.jpg)\n\
  \n图 2-3. 在 Google Chrome 浏览器中通过“检查元素”功能显示的 `text` 变量内容\n\n一旦你理解了如何进行选择，你就会发现如何通过更改其内容或属性来操作任何元素。你甚至可以添加其他元素或从页面中移除某个元素。在这方面，jQuery\
  \ 凭借其提供的大量方法，为我们提供了必要的工具。\n\n## 方法链\n\njQuery 的设计允许 jQuery 方法进行链式调用。一旦选定了一个元素或一组元素，下一步就是对其应用一系列方法。这一系列方法可以通过链式调用来编写。\n\
  \n使用前面的示例（参见代码清单 2-1），假设你想将第二个 `<div>` 元素中的文本替换为另一句话，并隐藏其他两个元素，使它们不再出现在网页中。为此，你将把“This\
  \ is the second text”这一行替换为新的“This is a new text”，同时隐藏其他文本。图 2-4 显示了应用任何更改之前的情况。\n\
  \n![9781484208632_Fig02-04.jpg](img/9781484208632_Fig02-04.jpg)\n\n图 2-4. 未使用 jQuery\
  \ 方法链时网页显示的文本\n\n现在，应用以下方法链：\n\n```\n$('div').hide().filter('.selected').text('This\
  \ is a new text').show();\n```\n\n所有三个 `<div>` 元素都被包含在选择中，然后被隐藏。在你所做的选择中，只有类名为 `'selected'`\
  \ 的元素及其内容被替换为新文本。只有这些最后的元素需要被显示。因此，在这条命令链的末尾，结果将是\n\n![9781484208632_unFig02-01.jpg](img/9781484208632_unFig02-01.jpg)\n\
  \n## 包装集\n\n当涉及 jQuery 时，我们处理的是包装集。在前面的示例中，有三个 `<div>` 元素。你经常会进行包含多个元素的选择，但你永远不需要指定程序循环。在这里，当你应用\
  \ `hide()` 方法来隐藏所有三个元素时，你并没有使用 `for` 或 `while` 结构（即 `$('div').each(function() {}`）。因此，**包装集**可以被定义为一组可以进行任何操作的元素（选择），就好像它是一个单一项目一样。\n\
  \n## jQuery 与 DOM\n\njQuery 是一个主要工作在文档对象模型（DOM）上的库，并且其所有功能都始终引用 DOM。jQuery 与 DOM\
  \ 一样，将每个网页视为一个树形结构，其中每个标签（也称为元素）都是一个节点。这棵树的根是文档，它是包含 DOM 中所有其他元素的元素。jQuery 提供了一组简化此类对象操作的方法，使你能够为页面增加动态效果。\n\
  \n## `ready()` 方法\n\n如果你想编写操作 DOM 元素的 JavaScript 代码，DOM 需要在你操作之前加载完成。但是，你需要在浏览器完全加载所有资源之前进行操作。为此，jQuery\
  \ 为你提供了 `ready()` 方法。这是一个绑定到文档对象的 DOM 上的自定义事件处理程序。`ready()` 方法只接受一个参数：一个包含代码的函数，该代码应在\
  \ DOM 加载完成后、但在用户能在浏览器中看到所有资源之前立即执行。\n\n```\n$(document).ready(function() {\n   \
  \ // 我们在这里编写 JavaScript 代码。\n});\n```\n\n## 通过选择遍历 DOM\n\n你已经了解了如何使用一个特定的 CSS 选择器作为参数来识别并选择一组\
  \ DOM 元素。然而，jQuery 的潜力不止于此；从选择在 DOM 中的位置出发，可以遍历 DOM 以获得一组新的选定元素进行操作。jQuery 为我们提供了一组可应用于选择的方法。\n\
  \n让我们以代码清单 2-5 中的简单 HTML 代码为例：\n\n***代码清单 2-5***. ch2_03a.html\n\n```\n<HTML>\n\
  <HEAD>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js\"\
  ></script>\n</HEAD>\n<BODY>\n<div class=\"fruits\">\n    <div>苹果</div>\n    <div>橙子</div>\n\
  \    <div>香蕉</div>\n    <div>草莓</div>\n</div>\n</BODY>\n</HTML>\n```\n\n此页面将显示四种水果的列表。正如你已经看到的，如果你使用\
  \ `'div'` 作为选择器进行选择，你将得到一个包含五个元素的序列：\n\n```\n<div class=\"fruits\">\n    <div>苹果</div>\n\
  \    <div>橙子</div>\n    <div>香蕉</div>\n    <div>草莓</div>\n</div>\n<div>苹果</div>\n\
  <div>橙子</div>\n<div>香蕉</div>\n<div>草莓</div>\n```\n\n你需要特别注意第一个 `<div>` 元素。你会在选择中找到其他四个\
  \ `<div>` 水果元素，尽管它们随后会在后续元素中重复出现。这是因为选择器 `'div'` 会选择每个元素及其内容，而不管其中的某个元素是否也会被选中。每当你想要对此类选择进行进一步操作时，考虑到这一点非常重要。\n\
  \n现在，如果你编写代码清单 2-6 中的代码片段，你将在一个警告对话框中看到文本，如图 2-5 所示。你可以看到最后一行文本包含了所有水果。\n\n***代码清单\
  \ 2-6***. ch2_03a.html\n\n```\n<script>\n    var text = $('div').text();\n    alert(text);\n\
  </script>\n```\n\n![9781484208632_Fig02-05.jpg](img/9781484208632_Fig02-05.jpg)\n\
  \n图 2-5. 警告对话框显示了选择中包含的元素内的文本\n\n然而，通常你需要直接访问选择的特定值。例如，要直接访问当前选择的第二个元素，你可以编写\n\n\
  ```\nvar text = $('div:eq(1)').text();\n```\n\n你使用了函数 `eq()` 并传入了你想要选择的元素在选择中的索引。现在，你只得到这个文本：\n\
  \n![9781484208632_unFig02-02.jpg](img/9781484208632_unFig02-02.jpg)\n\n类似地，如果你想选择序列中的第三个元素，你可以直接编写\n\
  \n```\nvar text = $('div:eq(2)').text();\n```\n\n\n\n或者，如果你愿意，也可以使用`next()`方法进行遍历，将选择从一个元素移动到下一个元素：\n\
  \n```\nvar text = $('div:eq(1)').next().text();\n```\n\n然后你会得到这个警告消息：\n\n![9781484208632_unFig02-03.jpg](img/9781484208632_unFig02-03.jpg)\n\
  \n现在，让我们看一个示例，演示选择集与 DOM 结构之间的区别。这有时会引起混淆。你必须记住，`eq()`方法会创建一种子选择；而`next()`、`prev()`、`parent()`、`children()`、`nextAll()`和`prevAll()`则是将选择集移动到\
  \ DOM 上的其他位置。\n\n事实上，如果你编写以下链式调用：\n\n```\nvar text = $('div:eq(1)').prev().text();\n\
  ```\n\n你不会得到任何结果，因为`'div:eq(1)'`选中的元素在列表中是第一个（但在选择集中是第二个）。因此，如果你尝试将选择集移动到 DOM 中的前一个元素，你不会得到任何结果。如果你想将选择集移动到名为`'fruits'`的父元素，则需要使用`parent()`方法：\n\
  \n```\nvar text = $('div:eq(1)').parent().text();\n```\n\n现在，你得到了父元素，它与选择集中的第一个元素相同。图\
  \ 2-6 展示了结果。\n\n![9781484208632_Fig02-06.jpg](img/9781484208632_Fig02-06.jpg)\n\n\
  图 2-6。警告对话框显示了第一个元素中的四种水果\n\n如果你编写以下命令：\n\n```\nvar text = $('div:eq(0)').text();\n\
  ```\n\n你会得到相同的结果。\n\n## 创建并插入新元素\n\n到目前为止，你已经看到，通过在`jQuery()`函数或其别名`$()`中传递一个参数，你可以获得\
  \ DOM 中所有具有该标签或相同类名的元素的选择集。现在，假设你传递的参数是一个 HTML 页面中不存在的标签。这时，你刚刚创建了一个要添加到 DOM 中的新元素。此外，这个元素无论从哪方面来说都是一个选择集，因此可以对其进行任何类型的操作，即使它尚未被实际添加到网页中。通过在方法链的末尾添加一些特定的\
  \ jQuery 方法，你将决定将新创建的元素插入到何处。\n\n例如，如前面的示例所示，通过编写以下代码片段：\n\n```\n$('<div>Lemon</div>').appendTo('div:eq(2)');\n\
  ```\n\n你在水果列表中创建了一个新元素。然后，你将其追加到选择集中的第三个元素（列表中的第二个元素）之后。图 2-7 展示了应用更改后网页中列表的显示效果。\n\
  \n![9781484208632_Fig02-07.jpg](img/9781484208632_Fig02-07.jpg)\n\n图 2-7。列表可以动态增加，添加新元素\n\
  \n有许多方法可以指定在何处以及如何插入刚创建的元素：`prepend()`、`after()`、`before()`、`append()`、`appendTo()`、`prependTo()`、`insertAfter()`、`insertBefore()`、`wrap()`、`wrapAll()`、`wrapInner()`等等。\n\
  \n有关这些函数使用的更多详细信息，建议读者查阅 jQuery 官方网站（`http://jquery.com/`）上的文档。\n\n## 移除、隐藏和替换元素\n\
  \n另一组非常有用的 jQuery 方法包括那些允许我们从页面（从 DOM 中）删除静态元素，或者至少隐藏它们的方法。有时，这些方法甚至对于用一个元素替换另一个元素也很有用。\n\
  \n要从列表中移除“Orange”水果，只需编写：\n\n```\n$('div:eq(2)').remove();\n```\n\n![9781484208632_unFig02-04.jpg](img/9781484208632_unFig02-04.jpg)\n\
  \n如果你想隐藏它，可以编写：\n\n```\n$('div:eq(2)').hide();\n  ...\n$('div:eq(2)').show();\n\
  ```\n\n然而，在这种情况下，在后续的代码中，仍然可以再次显示“Orange”。\n\n如果你改用`remove()`（参见清单 2-7），则选择器`'div:eq(2)'`对应的元素会发生变化，并且无法恢复被移除的元素。\n\
  \n***清单 2-7***。ch2_04c.html\n\n```\n$('div:eq(2)').remove();\nvar text = $('div:eq(2)').text();\n\
  alert(text); //返回 'Banana'\n```\n\n最后，如果你想用“Pineapple”替换“Orange”，可以使用`replaceWith()`方法，如下所示：\n\
  \n```\n$('div:eq(2)').replaceWith('<div>Pineapple<div>');\n```\n\n现在，你有了一个新的水果列表，如图\
  \ 2-8 所示。\n\n![9781484208632_Fig02-08.jpg](img/9781484208632_Fig02-08.jpg)\n\n图\
  \ 2-8。列表可以通过移除某些元素来动态缩减\n\n## jQuery UI：小部件\n\n除了 jQuery 库之外，还有另一个库可以帮助你将交互式和图形化对象集成到网页中：jQuery\
  \ UI。这个库提供了一整套工具，例如小部件、主题、效果和交互，它们丰富了网页，将其转变为高度交互的 Web 应用程序。就我们的目的而言，小部件尤其值得关注。这些小型的图形化应用程序可以成为有价值的工具，当添加到你的网页中时，它们能使你的图表更具交互性。小部件促进了网页底层程序之间的交互，并且通常本身就是真正的迷你应用程序。在最简单的形式中，小部件表现为表格、折叠面板、组合框，甚至是按钮。\n\
  \n与 jQuery 库一样，如果你想集成其小部件，你需要将插件文件包含到网页中。你还必须包含代表主题的 CSS 文件。这可以通过 Google 托管库服务来完成：\n\
  \n```\n<link rel=\"stylesheet\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  \ />\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js\"\
  >\n</script>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/jquery-ui.min.js\"\
  >\n</script>\n```\n\n你也可以从官方的 CDN jQuery 网站下载：\n\n```\n<link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\" />\n\
  <script src=\"http://code.jquery.com/jquery-1.9.1.min.js\"></script>\n<script src=\"\
  http://code.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n```\n\n如果你更喜欢在本地下载库，或者使用本书附带的源代码中的工作区（参见附录\
  \ A），你可以按如下方式引用库：\n\n```\n<link rel=\"stylesheet\" href=\"../src/css/smoothness/jquery-ui-1.10.3.custom.min.css\"\
  \ />\n<script src=\"../src/js/jquery-1.9.1.js\"></script>\n<script src=\"../src/js/jquery-ui-1.10.3.custom.min.js\"\
  ></script>\n```\n\n![Image](img/sq.jpg) **注意**  本书中用于 jQuery UI 小部件的主题是`smoothness`。可用主题列表非常广泛，涵盖了多种颜色和形状的组合。这个丰富的列表可以在\
  \ ThemeRoller（`http://jqueryui.com/themeroller`）上找到。ThemeRoller 是 jQuery 官方网站上的一个页面，它允许你预览小部件，然后从可用的主题中下载你喜欢的主题。\n\
  \n访问 jQuery UI 官方网站（`http://jqueryui.com/`）时，你会注意到这个库提供的小部件数量众多。在这里，我将只讨论最常见的示例，特别是那些最有可能被集成到包含图表的页面中的示例。\n\
  \n正如你将在本书中看到的，其中一些小部件将用作容器，利用其特殊功能，例如调整大小和封装，包括：\n\n*   折叠面板\n*   选项卡\n\n其他小部件将用于替换\
  \ HTML 提供的简单控件，因为前者更加先进且功能丰富，包括以下内容：\n\n*   按钮\n*   组合框\n*   菜单\n*   滑块\n\n还有一些小部件将执行指示器的功能。通过这些，你将看到如何集成特定的小部件类别：\n\
  \n*   进度条\n\n### 折叠面板\n\n\n\n### 手风琴部件\n\n手风琴部件是一组可折叠的面板，能让网页在紧凑的空间内展示大量信息。每个面板可以容纳一个主题区域，或者如你将在后续章节中看到的，不同类型的图表。点击每个面板的标签即可显示内容，使用户无需切换页面就能在不同面板间移动。根据用户的选择，手风琴的面板会展开或收缩，因此在任何给定时间，只有一个面板会显示其内容。\n\
  \n要在页面中获得手风琴部件，你需要编写的 HTML 结构由一个包含所有面板的外部 `<div>` 标签组成。每个面板则由一对 `<h3>` 标签之间的标题和一对\
  \ `<div></div>` 标签（内容位于其间）来指定。清单 2-8 展示了一个包含四个面板的简单手风琴。\n\n***清单 2-8***。 `ch2_05.html`\n\
  \n```\n<div id=\"accordion\">\n    <h3>第一个标题</h3>\n    <div>第一个内容面板</div>\n    <h3>第二个标题</h3>\n\
      <div>第二个内容面板</div>\n    <h3>第三个标题</h3>\n    <div>第三个内容面板</div>\n    <h3>第四个标题</h3>\n\
      <div>第四个内容面板</div>\n</div>\n```\n\n在 JavaScript 代码中，你需要添加清单 2-9 中的代码片段来获得手风琴部件。\n\
  \n***清单 2-9***。 `ch2_05.html`\n\n```\n$(function() {\n    $(\"#accordion\").accordion();\n\
  });\n```\n\n图 2-9 展示了我们的手风琴。\n\n![9781484208632_Fig02-09.jpg](img/9781484208632_Fig02-09.jpg)\n\
  \n图 2-9。 手风琴由可折叠的面板组成，适合在有限的空间内容纳信息\n\n但是，这还不够。如果你能控制手风琴的样式就更好了。这可以通过添加清单 2-10 中给出的代码来实现。\n\
  \n***清单 2-10***。 `ch2_05.html`\n\n```\n<style type=\"text/css\">\n    .ui-accordion\
  \ {\n        width: 690px;\n        margin: 2em auto;\n    }\n    .ui-accordion-header\
  \ {\n        font-size: 15px;\n        font-weight: bold;\n    }\n    .ui-accordion-content\
  \ {\n        font-size: 12px;\n    }\n</style>\n```\n\n结果如图 2-10 所示。\n\n![9781484208632_Fig02-10.jpg](img/9781484208632_Fig02-10.jpg)\n\
  \n图 2-10。 通过修改 CSS 样式属性，你可以随心所欲地改变手风琴的外观\n\n### 标签页\n\n在功能上与手风琴非常相似的部件是带有标签页的面板。在这里，每个面板都是唯一的，但顶部有多个标签页，由不同的标题标识。尽管如此，这个部件提供了在有限空间内展示大量信息的可能性，并且用户一次只能选择一个标签页来查看其内容。更显著的区别在于失去了面板的垂直展开特性。\n\
  \n要在网页中获得标签页部件，你需要编写的 HTML 结构比前一个稍微复杂一些。标题放在一个无序列表 `<ul>` 中，其中的每个列表项 `<li>` 必须引用一个锚点标签\
  \ `<a>`。每个标签页的内容都包含在一对 `<div></div>` 标签中，并带有一个 `id` 属性，该属性与锚点标签中的引用相对应（参见清单 2-11）。\n\
  \n***清单 2-11***。 `ch2_06.html`\n\n```\n<div id=\"tabs\">\n  <ul>\n    <li><a href=\"\
  #tabs-1\">第一个标题</a></li>\n    <li><a href=\"#tabs-2\">第二个标题</a></li>\n    <li><a\
  \ href=\"#tabs-3\">第三个标题</a></li>\n    <li><a href=\"#tabs-4\">第四个标题</a></li>\n\
    </ul>\n  <div id=\"tabs-1\">\n    <p>第一个标签页面板</p>\n  </div>\n  <div id=\"tabs-2\"\
  >\n    <p>第二个标签页面板</p>\n  </div>\n   <div id=\"tabs-3\">\n    <p>第三个标签页面板</p>\n\
    </div>\n  <div id=\"tabs-4\">\n    <p>第四个标签页面板</p>\n  </div>\n</div>\n```\n\n\
  在 JavaScript 代码中，你需要指定标签页部件，如清单 2-12 所示。\n\n***清单 2-12***。 `ch2_06.html`\n\n```\n\
  $(function() {\n    $(\"#tabs\").tabs();\n});\n```\n\n还必须定义 CSS 样式类，如清单 2-13 所示。\n\
  \n***清单 2-13***。 `ch2_06.html`\n\n```\n<style type=\"text/css\">\n    .ui-tabs {\n\
        width: 690px;\n      margin: 2em auto;\n    }\n    .ui-tabs-header {\n      font-size:\
  \ 15px;\n      font-weight: bold;\n    }\n    .ui-tabs-panel {\n      font-size:\
  \ 12px;\n    }\n</style>\n```\n\n当过程完成后，你将得到图 2-11 所示的部件。\n\n![9781484208632_Fig02-11.jpg](img/9781484208632_Fig02-11.jpg)\n\
  \n图 2-11。 标签页部件由占据同一区域的多个面板组成\n\n### 按钮\n\n在所有可用的部件中，按钮仍然是最常用的。以前，在网页中插入按钮有两种方式。第一种是经典方法，使用标签\
  \ `<input type=\"button\"/>`。一种更现代的方法是清单 2-14。\n\n***清单 2-14***。 `ch2_07.html`\n\
  \n```\n<button>一个按钮元素</button>\n<input type=\"submit\" value=\"一个提交按钮\" />\n<a href=\"\
  #\">一个锚点</a>\n```\n\n如果没有进一步的说明或 JavaScript 代码，当你加载页面时，你会看到图 2-12 中展示的按钮。\n\n![9781484208632_Fig02-12.jpg](img/9781484208632_Fig02-12.jpg)\n\
  \n图 2-12。 网页展示了三种类型的按钮：一个简单的按钮元素、一个提交按钮和一个锚点按钮\n\n要使用 JavaScript 函数来引用它们，请编写清单 2-15\
  \ 中提供的代码片段。\n\n***清单 2-15***。 `ch2_07.html`\n\n```\n$(function() {\n    $(\"input[type=submit],\
  \ a, button\")\n      .button()\n      .click(function(event) {\n         event.preventDefault();\n\
        });\n});\n```\n\n通过这种方式，你将获得一组更美观的按钮，如图 2-13 所示。\n\n![9781484208632_Fig02-13.jpg](img/9781484208632_Fig02-13.jpg)\n\
  \n图 2-13。 这三种类型的按钮现在由 jQuery UI 按钮部件表示\n\n你可以通过添加图标来丰富你的按钮。jQuery UI 提供了大量的图标集，但你也可以使用更大的自定义图标。清单\
  \ 2-16 展示了如何将四个按钮写入你的网页：\n\n***清单 2-16***。 `ch2_08.html`\n\n```\n<button>仅带图标的按钮</button>\n\
  <button>左侧带自定义图标的按钮</button>\n<button>带两个图标的按钮</button>\n<button>带两个图标且无文本的按钮</button>\n\
  ```\n\n\n\n您添加了四个按钮来突出显示四种可能的情况：一个只有图标的按钮；一个左侧带有文本和图标的按钮；一个两侧都带有文本和图标的按钮；以及一个有两个图标但没有文本的按钮（参见图\
  \ 2-14）。查看 HTML 代码，您会发现实际上所有四个按钮内部都有文本，但可以禁用此功能以获得没有文本的按钮。代码清单 2-17 演示了如何为不同按钮分配图标，图标名称被分配给\
  \ `primary` 和 `secondary`（可选）属性。此外，通过将 `text` 属性设置为 `'false'`，您可以获得一个没有文本的按钮。\n\n\
  ***代码清单 2-17***. ch2_08.html\n\n```\n$(function() {\n    $(\"button:first\").button({\n\
          icons: {\n            primary: \"ui-icon-locked\"\n        },\n        text:\
  \ false\n    }).next().button({\n        icons: {\n            primary: \"ui-icon-italy\"\
  \n        }\n    }).next().button({\n        icons: {\n            primary: \"ui-icon-gear\"\
  ,\n            secondary: \"ui-icon-triangle-1-s\"\n        }\n    }).next().button({\n\
          icons: {\n            primary: \"ui-icon-gear\",\n            secondary:\
  \ \"ui-icon-triangle-1-s\"\n        },\n        text: false\n    });\n});\n```\n\
  \n要插入自定义图标，您需要使用 `url()` 函数将其地址定义为 CSS 文件，如代码清单 2-18 所示。\n\n***代码清单 2-18***. ch2_08.html\n\
  \n```\n<style>\n.ui-button .ui-icon-italy {\n    background-image: url(\"icon/exit24x24.png\"\
  );\n    width: 24px;\n    height: 24px;\n}\n</style>\n```\n\n图 2-14 展示了您刚刚创建的一组按钮。\n\
  \n![9781484208632_Fig02-14.jpg](img/9781484208632_Fig02-14.jpg)\n\n图 2-14. 每个按钮都可以轻松地通过图标进行丰富\n\
  \n### 组合框\n\n组合框是网页和许多应用程序中另一个广泛使用的控件。组合框是一个可编辑的下拉菜单，用户可以通过它选择一个条目。要在页面中插入组合框，您需要定义一个特定的元素结构，如代码清单\
  \ 2-19 所示。\n\n***代码清单 2-19***. ch2_09.html\n\n```\n<div class=\"ui-widget\">\n    <label>选择您的目的地：</label>\n\
      <select id=\"combobox\">\n        <option value=\"\">选择一个...</option>\n        <option\
  \ value=\"Amsterdam\">阿姆斯特丹</option>\n        <option value=\"London\">伦敦</option>\n\
          <option value=\"Rome\">罗马</option>\n    </select>\n</div>\n```\n\n接下来，您需要使用\
  \ JavaScript 代码引用此结构，首先使用 `$()` 选择元素，然后将其激活为 jQuery 组合框小部件：\n\n```\n$(function()\
  \ {\n     $(\"#combobox\").combobox();\n});\n```\n\n让我们添加一点 CSS 样式：\n\n```\n<style>\n\
      .ui-widget {\n       font-size: 18px;\n    }\n</style>\n```\n\n图 2-15 展示了组合框小部件，它代表了实现事件捕获的整个系列功能的起点。\n\
  \n![9781484208632_Fig02-15.jpg](img/9781484208632_Fig02-15.jpg)\n\n图 2-15. 组合框是一个下拉菜单，允许用户在多个选项中进行选择\n\
  \n### 菜单\n\n刚刚考虑了组合框，您不能忽视在主页上包含交互式菜单的可能性。通过这样的菜单，用户可以做出系列选择，例如选择如何表示图表的选项。\n\n\
  在 HTML 中，无序列表定义为 `<ul>`，列表项定义为 `<li>`。如果您想添加一个子菜单作为项目，只需插入一个嵌入的无序列表 `<ul>`。为了说明如何构建菜单，让我们看一下代码清单\
  \ 2-20。\n\n***代码清单 2-20***. ch2_10.html\n\n```\n<ul id=\"menu\">\n    <li class=\"\
  ui-state-disabled\"><a href=\"#\">高级</a></li>\n    <li><a href=\"#\">筛选</a></li>\n\
      <li>\n        <a href=\"#\">缩放</a>\n        <ul>\n            <li><a href=\"\
  #\">10%</a></li>\n            <li><a href=\"#\">25%</a></li>\n            <li><a\
  \ href=\"#\">50%</a></li>\n            <li><a href=\"#\">100%</a></li>\n        </ul>\n\
      </li>\n</ul>\n```\n\n与前面的小部件一样，您必须通过添加以下函数来激活菜单：\n\n```\n$(function() {\n    $(\"\
  #menu\").menu();\n});\n```\n\n您还需要包含 CSS 样式设置：\n\n```\n<style>\n    .ui-menu {\n\
          width: 150px;\n    }\n</style>\n```\n\n现在，页面上就有了一个菜单，如图 2-16 所示。\n\n![9781484208632_Fig02-16.jpg](img/9781484208632_Fig02-16.jpg)\n\
  \n图 2-16. 下拉菜单让您对不同的选项进行分类\n\n### 滑块\n\n当您开始开发各种类型的图表时，您会发现每次都需要设置几个参数。用户可以通过滑块实时修改这些参数。这些滑块使用户能够在特定范围内更改参数。\n\
  \n与许多其他小部件一样，首先您需要添加 `<div>` 元素来在网页中表示滑块。\n\n```\n<div id=\"slider\"></div>\n```\n\
  \n然后，像往常一样，您使用 JavaScript 函数激活该小部件，并在其中指定小部件的属性。例如，要指定滑块手柄的默认位置，您可以将 `value` 属性设置为\
  \ 0 到 100 之间的百分比值。类似地，可以通过将字符串 `'horizontal'` 或 `'vertical'` 赋值给 `orientation` 属性来设置方向。对于\
  \ `range` 属性，您可以指示滑块覆盖的范围（滑块轨道的阴影区域）应从 `'min'` 值还是 `'max'` 值开始（参见图 2-19）。因此，如果您将\
  \ `range` 属性设置为 `'min'`，则范围将从最小值延伸到滑块手柄。`animation` 属性是另一个需要考虑的设置。滑块小部件内置了动画：当用户单击滑块轨道时，手柄会从其当前位置移动到单击点；这可以缓慢或快速完成。您可以通过将\
  \ `animation` 属性设置为 `'fast'` 或 `'slow'` 来选择手柄移动的速度。属性 `'true'` 和 `'false'` 表示动画是启用还是禁用（参见代码清单\
  \ 2-21）。\n\n***代码清单 2-21***. ch2_12.html\n\n```\n$(function() {\n    $(\"#slider\"\
  ).slider({\n        value: 60,\n        orientation: 'horizontal',\n        range:\
  \ 'min',\n        animate: 'slow'\n    });\n});\n```\n\n一旦定义了滑块的基本属性，您就需要决定其大小（以及手柄的大小）并添加\
  \ CSS 样式设置。当您定义滑块的长度和宽度时，需要考虑您选择的方向，并相应地设置 `height` 和 `width` 属性。在这种情况下，我们希望水平显示滑块；因此，`width`\
  \ 属性将远大于 `height` 属性（参见代码清单 2-22）。\n\n***代码清单 2-22***. ch2_12.html\n\n```\n<style>\n\
      .ui-slider {\n       width: 400px;\n       height: 10px;\n    }\n    .ui-slider\
  \ .ui-slider-handle {\n       width: 12px;\n       height: 20px;\n    }\n</style>\n\
  ```\n\n如果您在浏览器中加载该网页，您将看到滑块（参见图 2-17）。\n\n![9781484208632_Fig02-17.jpg](img/9781484208632_Fig02-17.jpg)\n\
  \n图 2-17. 滑块是一种允许您在范围内选择数值的小部件\n\n\n\n有时，您需要使用多个滑块，并且需要将它们水平排列（例如，在立体声音响的均衡器中可以找到类似的结构）。在指定多个滑块时，无需定义多个\
  \ `<div>` 元素：只需一个带有 `\"eq\"` 作为其 `id` 的 `<div>` 元素即可标记。然后，在此元素内，将每个滑块定义为一个包含其默认值（即各个手柄在滑块轨道上的位置）的配对，如代码清单\
  \ 2-23 所示。\n\n***代码清单 2-23***. ch2_13.html\n\n```\n<div id=\"eq\">\n    <span>88</span>\n\
      <span>77</span>\n    <span>55</span>\n    <span>33</span>\n    <span>40</span>\n\
      <span>45</span>\n    <span>70</span>\n</div>\n```\n\n现在，您必须实现一个 JavaScript 函数，这次稍微复杂一些。首先，使用\
  \ `$(\"#eq > span\")` 选择器，对七个元素进行选择。然后，使用 `parseInt()` 函数，将配对中包含的所有值依次赋值给相应的 `value`\
  \ 属性，以便手柄处于图 2-18 所示的位置（参见代码清单 2-24）。\n\n***代码清单 2-24***. ch2_13.html\n\n```\n$(function()\
  \ {\n    $('#eq > span').each(function() {\n        // read initial values from\
  \ markup and remove that\n        var value = parseInt($(this).text(), 10);\n        $(this).empty().slider({\n\
              value: value,\n            range: 'min',\n            animate: 'slow',\n\
              orientation: 'vertical'\n        });\n    });\n});\n```\n\n即使对于这种类似均衡器的结构，也需要添加一些\
  \ CSS 样式设置，例如不同滑块之间的边距（参见代码清单 2-25）。\n\n***代码清单 2-25***. ch2_13.html\n\n```\n<style>\n\
      #eq span {\n      height:180px;\n      float:left;\n      margin:15px;\n      width:10px;\n\
      }\n</style>\n```\n\n最终，您会得到图 2-18 所示的条形图。\n\n![9781484208632_Fig02-18.jpg](img/9781484208632_Fig02-18.jpg)\n\
  \n图 2-18. 滑块也可以成组排列，以实现更复杂的控制（例如，均衡器）\n\n### 进度条\n\n当您开发复杂操作时，系统可能需要很长时间才能完成任务。在用户等待期间，为了防止系统看起来像被锁定，通常会用进度条来表示已完成任务的百分比。定义一个进度条非常简单：\n\
  \n```\n<div id=\"progressbar\"></div>\n```\n\n您还必须编写相应的 JavaScript 函数来激活进度条，如代码清单\
  \ 2-26 所示。\n\n***代码清单 2-26***. ch2_11a.html\n\n```\n$(function() {\n    $(\"#progressbar\"\
  ).progressbar({\n        value: 37\n    });\n});\n```\n\n接下来，添加 CSS 样式设置，如代码清单 2-27\
  \ 所示。\n\n***代码清单 2-27***. ch2_11a.html\n\n```\n<style>\n    .ui-progressbar {\n\
         height: 20px;\n       width: 600px;\n    }\n</style>\n```\n\n但是，您得到的结果并非预期效果；您会得到一个静态进度条，固定在\
  \ 37% 的位置（参见图 2-19）。\n\n![9781484208632_Fig02-19.jpg](img/9781484208632_Fig02-19.jpg)\n\
  \n图 2-19. 使用进度条，您可以显示进程的状态\n\n要获得一个功能完整的进度条，您需要将其 `value` 属性设置为一个计数器值，该计数器值直接与底层进程的迭代相关联。此外，如果您想增加进度条的动态效果，可以使用动画图形交换格式（GIF）图像作为其背景。代码清单\
  \ 2-28 展示了向进度条添加 CSS 样式属性。\n\n***代码清单 2-28***. ch2_11b.html\n\n```\n<style>\n    .ui-progressbar\
  \ {\n       height: 20px;\n       width: 600px;\n    }\n    .ui-progressbar .ui-progressbar-value\
  \ {\n       background-image: url(images/pbar-ani.gif);\n    }\n</style>\n```\n\n\
  图 2-20 中的 GIF 图像能更好地体现操作的进度感。\n\n![9781484208632_Fig02-20.jpg](img/9781484208632_Fig02-20.jpg)\n\
  \n图 2-20. 带有动画 GIF 的进度条为网页赋予了高度动态的外观\n\n![Image](img/sq.jpg) **注意** 适用于任何类型进度条的动画\
  \ GIF 可以轻松安全地从网站 ajaxload (`www.ajaxload.info`) 获取。只需选择您想要使用的进度条类型，然后选择前景色和背景色，该网站就会自动生成动画\
  \ GIF 的预览。如果图像符合您的要求，您可以继续下载。\n\n或者，您也可以使用本书附带的代码中提供的动画 GIF（`pbar-ani.gif`），它位于图表/图像目录中（您可以在\
  \ Apress 网站 [`www.apress.com`] 的源代码/下载区域找到代码示例）。\n\n## 关于 jQuery 库的总结性思考\n\n到现在为止，您可能想知道为什么我们要从一个库（jQuery）开始，它显然与图表开发或一般的数据可视化无关。您已经看到\
  \ jQuery UI 库为我们提供了图形元素，但其用途与您对图表的预期相去甚远。\n\n实际上，我们必须从这里开始。您已经决定使用 JavaScript 语言，目标是在网页中实现图形元素（这些元素无非就是\
  \ DOM 元素）。这一切的核心是通过这个库引入的概念。选择器、方法链、结构、使用 CSS 样式的实践——这些是 Web 编程的基础，更是图表开发的基础。而获得这些基础知识的最佳方式莫过于使用\
  \ jQuery 库。\n\n随着您阅读本书的深入，您会发现 jqPlot 库必须包含 jQuery 库。这就是了解 jQuery 的重要性所在。\n\n##\
  \ 本章小结\n\n在开始直接使用 JavaScript 开发图表之前，有必要介绍一些构成此类代码开发基础的基本工具。因此，在本第二章中，向您介绍了 **jQuery**\
  \ 和 **jQuery UI** 库。通过 jQuery，您学会了如何通过选择器和方法链动态操作 DOM 元素。通过 **jQuery UI**，您发现了如何使用交互式图形元素（**jQuery\
  \ UI 小部件**）来丰富您的页面。\n\n在下一章中，您将迈出使用 jqPlot 库的第一步。具体来说，您将了解该库的设计方式以及关键概念，例如插件和选项。\n\
  \n"
- "# 第 3 章\n\n\n\n## 初识 jqPlot\n\n在本章中，您将了解该库的基本概念。在了解了库的结构及其组成文件之后，您将开始理解仅用几行代码制作图表是多么容易。\n\
  \n\n\n## jqPlot 库\n\n通过一系列示例，并借助插件的使用，你将逐步学会如何呈现任何类型的图表。所有操作都将通过 `$.jqPlot()` 函数完成，该函数的三个参数定义了\
  \ jqPlot 库的所有特性：目标画布、输入数据数组和选项对象。\n\n最后，在简要说明如何通过层叠样式表（CSS）样式来自定义图表之后，你将快速了解模块化思维如何让你的实现变得有序、可维护且可复用。那么，让我们开始介绍这个精彩的库吧。\n\
  \n## jqPlot 库\n\n`jqPlot` 是一个专门用于在网页中生成图表的 JavaScript 库。`jqPlot` 完全用纯 JavaScript\
  \ 编写，是一个开源项目，自 2009 年以来由 Chris Leonello 全面开发和维护。当与 jQuery 库结合使用时，其功能才能发挥到极致。正是由于这个原因，再加上其简洁性，`jqPlot`\
  \ 成为当今最流行的图表表示库之一。\n\n`jqPlot` 非常成功，几乎取代了之前的其他库，例如 Flot，`jqPlot` 保留了 Flot 的许多方面，包括外观和感觉。事实上，`jqPlot`\
  \ 的作者经常承认他曾是 Flot 的忠实用户，但随着时间的推移，他逐渐认识到其局限性。这个旧库缺乏许多功能；此外，其架构结构使其难以扩展。因此，Leonello\
  \ 觉得有必要创建一个新库，保留 Flot 中所有好的特性，同时允许其发展壮大。于是，他完全重写了其架构。`jqPlot` 具有高度模块化的结构，并且正如你将看到的，它基于大量的插件，每个插件都扮演着特定的角色。因此，它最强大的特性是其可插拔性。用户绘制的每个对象，无论是线条、坐标轴、阴影还是网格本身，都由一个插件处理。每个图表元素都有可自定义的设置选项，每个添加的插件都可以扩展图表的功能。\n\
  \n插件的数量逐渐增加，进一步拓宽了库的应用目标。`jqPlot` 现在是一个多功能且可扩展的库，适合那些希望仅需几步就能开发出专业图表的人。\n\n在大多数情况下，`jqPlot`\
  \ 允许你无需添加太多代码行就能绘制出漂亮的图表。事实上，你会看到 `jqPlot`（甚至可能比 jQuery 更甚）秉承了“写得更少，做得更多”的理念。我认为这是该库最受赞赏的一点。每天，越来越多的开发者加入到\
  \ `jqPlot` 用户的行列中。\n\n## 包含基本文件\n\n当你决定利用 `jqPlot` 在你的网站上绘制图表时，作为起点，需要包含一组关键文件。\n\
  \n如前所述，`jqPlot` 本质上是 jQuery 的一个扩展，因此使用它需要包含 jQuery 插件（参见表 3-1）。你可以从 `jqPlot` 官方网站（`www.jqplot.com`）下载此插件，以及构成\
  \ `jqPlot` 库的所有其他插件，包括 CSS 文件。这些文件根据发布版本被分组到不同的发行包中。\n\n表 3-1. jqPlot 的发行版本及其所基于的\
  \ jQuery 版本\n\n| jqPlot 版本 | jQuery 版本 |\n| --- | --- |\n| 1.0.6–1.0.8 | 1.9.1 |\n\
  | 1.0.2–1.0.5 | 1.6.4 |\n\n![Image](img/sq.jpg) **注意** 本书中的所有示例均使用 `jqPlot` 库的 1.0.8\
  \ 版本。\n\n然而，有一小组文件代表了库的核心，如果你想包含 `jqPlot` 提供的所有功能，这些文件是必不可少的。这组基本文件包括 jQuery 插件、`jqPlot`\
  \ 插件和一个 `jqPlot` CSS 文件。还有一个文件需要导入，但仅当你想在低于版本 9 的 Internet Explorer 浏览器中加载页面时才需要：一个\
  \ ExplorerCanvas（`excanvas`）脚本。这个可选文件弥补了 HTML5 引入的画布功能的缺失。\n\n因此，在你的网页的 `<head></head>`\
  \ 标签内，你将包含这些文件（有关如何设置工作区的更多信息，请参见附录 A）：\n\n```\n<!--[if lt IE 9]><script type=\"\
  text/javascript\" src=\"../src/excanvas.js\"></script><![endif]-->\n<script type=\"\
  text/javascript\" src=\"../src/jquery.min.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"../src/jquery.jqplot.min.js\"></script>\n<link rel=\"stylesheet\" type=\"\
  text/css\" href=\"../src/jquery.jqplot.min.css\"/>\n```\n\n除了从网站下载 `jqPlot` 库并在本地使用外，你也可以像使用\
  \ jQuery 一样，使用内容分发网络（CDN）服务。`jsDelivr`（`www.jsdelivr.com/#!jqplot`）是一个提供所有最新 `jqPlot`\
  \ 发行版的 CDN 网站。如果你想使用此服务，可以按如下方式修改 URL：\n\n```\n<!--[if lt IE 9]><script type=\"\
  text/javascript\" src=\"http://cdn.jsdelivr.net/excanvas/r3/excanvas.js\">\n</script><![endif]-->\n\
  <script src=\"http://code.jquery.com/jquery-1.9.1.min.js\"></script>\n<script type=\"\
  text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/jquery.jqplot.min.js\"\
  >\n</script>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"http://cdn.jsdelivr.net/jqplot/1.0.8/jquery.jqplot.min.css\"\
  />\n```\n\n你很快就会发现，在网络中你会遇到类似的文件，有些带有缩写“min”（表示“压缩版”），有些则没有。你应该始终尝试使用 min 版本，即这些文件的压缩版本。它们加载速度更快。只有当你的意图是修改这些库的内部时，才应该使用它们的普通版本（不带“min”）。\n\
  \n## 图表基础\n\n现在你已经了解了 `jqPlot` 库的结构，并查看了使用它所需的一组文件，你可以开始学习如何在你的网页中使用这些文件了。在图表开发中，有两个基本步骤：创建一个用于呈现图表的区域，以及插入一个用于调用\
  \ `jqPlot` 库提供的所有函数、变量和对象系列的 JavaScript 代码部分。\n\n### 添加图表容器\n\n`jqPlot` 库要求在 HTML\
  \ 页面的 `<body>` 部分内定义一个容器（一个 `<div>` 元素）。此容器将作为库的画布。\n\n在本章中，此容器被称为**目标**。在网页中，每个目标（在此例中为图表容器）都由一个特定的\
  \ `id` 标识。在本书中，你总会看到 `myChart` 作为目标的标识符，但它可以取任何名称，并且你必须始终记住，同一个网页可能分配有多个目标。此外，为目标指定宽度和高度也很重要。这些将定义网页内绘图区域的大小（参见清单\
  \ 3-1）。\n\n***清单 3-1***. Ch3_01.html\n\n```\n<BODY>\n   ...\n   <div id=\"myChart\"\
  \ style=\"height:400px; width:500px;\"></div>\n   ...\n</BODY>\n```\n\n### 创建图表\n\
  \n\n\n要输入代码，`jqPlot`命令和几乎所有 JavaScript 代码都必须包含在`<scripts>`标签内。但是，一个网页分为两个部分：`head`和`body`。那么，插入\
  \ JavaScript 代码的最佳位置是哪里？虽然可以将代码放在库的两个部分中，但根据库的不同，最好只放在其中一个部分。考虑到`jqPlot`的工作方式，您应该将代码放在`<head></head>`标签之间。\n\
  \n此外，`jqPlot`是`jQuery`的一个扩展，因此如果您希望代码被执行，您需要在`$(document).ready()`函数内部调用其所有方法（参见清单\
  \ 3-2）。\n\n***清单 3-2***. `Ch3_01.html`\n\n```\n$(document).ready(function(){\n \
  \   // 在此处插入所有 jqPlot 代码。\n});\n```\n\n然后，要创建实际的图表，您必须使用目标元素的`id`来调用`$.jqplot`插件，您希望在该元素中绘制图表。此调用由以下`jQuery`函数执行：\n\
  \n```\n$.jqplot(target, data, options);\n```\n\n`jqplot()`函数有三个参数：`target`，即要渲染图表的`target`元素的\
  \ ID——您在图表容器中指定的`id`属性；`data`，由数据系列的数组组成；以及`options`，这是`jqPlot`的主要特性。在`options`中，您将输入必要的自定义设置，以使图表更符合您的需求和品味。\n\
  \n如果您不定义任何`options`（是的，它是可选的！），您可以按照标准选项的设置生成图表。事实上，许多选项已经定义好了，您不必在每次开发图表时都更改所有设置。如果标准选项满足您的要求，则无需定义它们。这将为您节省大量时间，并避免编写许多行代码。例如，让我们编写清单\
  \ 3-3 中的函数。\n\n***清单 3-3***. `Ch3_01.html`\n\n```\n$(document).ready(function(){\n\
  \    $.jqplot ('myChart', [[100, 110, 140, 130, 80, 75, 120, 130, 100]]);\n});\n\
  ```\n\n只需几行代码，您就可以生成如图 3-1 所示的图表。\n\n![9781484208632_Fig03-01.jpg](img/9781484208632_Fig03-01.jpg)\n\
  \n图 3-1. 仅用几行代码创建的折线图\n\n从您刚才看到的内容可以推断，如果您不指定任何`options`，默认结果将是一个折线图，并且您添加的数据将按此方式解释。因此，数组中的值是`y`值，其序列的索引显示在`x`轴上。在后面的章节中，您将学习如何解释这些值，以及如何从线性图表中获得不同类型的图表。\n\
  \n## 使用`jqPlot`插件\n\n最新的`jqPlot`发行版提供了大约三十个插件（有关所有`jqPlot`插件的列表，请参见附录 B）。每个插件都专门执行特定任务，其名称通常能指示其功能。在接下来的章节中，您将了解许多这些插件——它们的用途和主要选项。\n\
  \n例如，以`BarRenderer`为例。如果您希望输入数据被解释为条形图，则需要此插件：\n\n```\n$.jqplot ('myChart', [[100,\
  \ 110, 140, 130, 80, 75, 120, 130, 100]],\n{\n    series:[{renderer: $.jqplot.BarRenderer}]\n\
  });\n```\n\n在`jqPlot`中，我们通常将插件称为渲染器。这是因为框架的架构规定每个插件必须覆盖一个特定任务。如果开发者认为有必要，则会包含它。此外，真正的渲染器应尽可能相互独立。实际上，您可以添加任意数量的插件，并且它们的顺序通常不重要。有些插件不需要您指定任何额外的选项或设置；它们已经定义好，并且仅通过被包含就直接激活。其中一个插件是`Highlighter`，它高亮显示鼠标附近的数据点。但是，如果您对默认设置不满意，您可以随时用新值定义属性；这些插件还包含额外的、可设置的属性。其他插件提供的功能需要在`options`参数中指定才能被激活。\n\
  \n因此，`jqPlot`库的基本元素以及由包含的插件逐步引入的附加组件，都可以通过一系列属性来表征（其方式与 CSS 样式非常相似）。`jqPlot`库将这些属性称为`options`。\n\
  \n## 理解`jqPlot`选项\n\n有效使用`jqPlot`的关键在于理解`jqPlot`的选项。图表中任何对象的属性都由属性定义，这些属性可以取不同的值。理解如何通过我将称之为`options`的对象类型来设置和使用这些属性非常重要。\n\
  \n### 插入选项\n\n到目前为止，您已经了解了如何在 JavaScript 代码中调用`jqplot()`函数，以及如何包含插件和数据，但您尚未观察到如何输入选项。您可以通过以下方式将不同的属性传递给`$.jqplot()`函数来自定义默认折线图：\n\
  \n```\n$(document).ready(function(){\n    $.jqplot ('myChart', [[100, 110, 140,\
  \ 130, 80, 75, 120, 130, 100]],\n    {\n        // 所有属性在此处。\n    });\n});\n```\n\
  \n首先要注意的是，在调用`$.jqplot()`之后，无法直接在图表对象中设置属性。充其量，这不会产生任何效果。您必须在`options`参数中传递所有属性。\n\
  \n`options`参数在其每个属性中代表`jqPlot`对象。表征图表的一切都由许多属性表示，这些属性被设置为特定值。这些值区分条形图和折线图，调节线条的描边或轴的长度，指示是否显示图例及其位置，等等。通常，在包含各种插件时，无需为所有属性指定值；它们已经设置为默认值。正是由于这些默认值，在添加插件时，您无需添加一行代码即可实现一个漂亮的图表。如果您显式指定一个属性，实际上是在覆盖一个已用默认值定义的属性的值。\n\
  \n因为我们的目标是设置`jqPlot`对象，并且由于该对象由一系列组件组成，因此有必要构建一个`options`对象，其结构完美地反映这些组件，通过定义一系列具有其属性的对象。回忆与组件对应的对象，并在`options`对象内部为其某个属性赋值，您将覆盖默认值并更改`jqPlot`对象相应组件的属性。您可以在`options`对象内部定义的最常用对象包括：\n\
  \n*   `seriesColors`\n*   `stackSeries`\n*   `title`\n*   `axesDefaults`\n*   `axes`\n\
  *   `seriesDefaults`\n*   `series`\n*   `legend`\n*   `grid`\n*   `cursor`\n*  \
  \ `highlighter`\n\n每个名称都反映了图表中其属性值更改将受到影响的组件。这些对象由一系列定义明确的属性构建而成，每个属性都有自己的默认值。\n\
  \n\n\n这是 `jqPlot` 对象的结构：\n\n`jqplot` 对象 ![image](img/arrow.jpg) 组件对象 ![image](img/arrow.jpg)\
  \ 对象属性 ![image](img/arrow.jpg) 默认值\n\n在清单 3-4 中，你可以看到定义 `options` 对象时需要遵循的对应结构。\n\
  \n***清单 3-4***. Ch3_02c.html\n\n```\nvar options = {\n    axes:{\n       yaxis:{\n\
  \          min: 70,\n          max: 150\n       },\n       ...\n    },\n    ...\n\
  };\n```\n\n我认为最容易添加到图表中的对象是 `title`。它不包含任何属性，并且通常可以被视为 `jqPlot` 对象本身的属性。此外，可以直接为其设置一个文本值，该文本将成为图表的标题。鉴于其简单性，`title`\
  \ 是理解如何使用选项的一个很好的起点（清单 3-5）。\n\n***清单 3-5***. Ch3_02a.html\n\n```\n$(document).ready(function(){\n\
  \    $.jqplot ('myChart', [[100, 110, 140, 130, 80, 75, 120, 130, 100]],\n    {\n\
  \        title: 'My first jqPlot chart'\n    });\n});\n```\n\n如果你愿意，也可以使用 `jqplot()`\
  \ 函数在外部定义对象的属性，将属性赋值给一个变量。然后，这个变量将作为参数传递给 `jqPlot()` 函数，如清单 3-6 所示。这个变量实际上就是 `options`\
  \ 对象。\n\n***清单 3-6***. Ch3_02a.html\n\n```\nvar options = { title: 'My first jqPlot\
  \ chart' };\n$.jqplot ('myChart', [[100, 110, 140, 130, 80, 75, 120, 130, 100]],\
  \ options);\n```\n\n在这两种情况下，你现在都会得到一个顶部带有标题的图表（参见图 3-2）。\n\n![9781484208632_Fig03-02.jpg](img/9781484208632_Fig03-02.jpg)\n\
  \n图 3-2. 为折线图添加标题\n\n为了更好地理解如何在 `options` 对象中设置 `jqPlot` 属性，让我们以 jqPlot 网站的 API\
  \ 文档部分（`www.jqplot.com/docs/files/jqplot-core-js.html`）为例。假设你想隐藏图表中的网格线。在属于 `grid`\
  \ 对象的属性列表中，你会找到你要找的内容：\n\n```\nthis.drawGridlines = true.\n```\n\n`this` 是网格的实例，`true`\
  \ 是在创建 `jqplot` 对象时分配给它的默认值。因为你希望隐藏网格（与默认行为不同），所以需要在 `jqPlot` 对象中将值 `true` 替换为值\
  \ `false`。为此，你必须在 `options` 对象定义中添加 `drawGridlines` 属性，保持 `object:{property:attribute}`\
  \ 的结构。\n\n```\noptions = {grid:{drawGridlines: false}};\n```\n\n现在，你得到了一个没有网格线的图表（参见图\
  \ 3-3）。\n\n![9781484208632_Fig03-03.jpg](img/9781484208632_Fig03-03.jpg)\n\n图 3-3.\
  \ 隐藏折线图中的网格线\n\n有关可设置属性的完整列表，你可以访问 jqPlot 官方网站（`www.jqplot.com/docs/index/General.html`）或阅读每个发行版中包含的\
  \ `jqPlotOptions.txt` 文件。\n\n## 处理坐标轴选项\n\n坐标轴的处理方式与其他普通组件对象略有不同，因为它们有四个不同的子对象，即\
  \ `xaxis`、`yaxis`、`x2axis` 和 `y2axis`。因此，为了说明坐标轴，我们需要一个嵌套层次更深的例子。假设你想指定 y 轴的 `min`\
  \ 和 `max` 属性。为此，你需要按照清单 3-7 所示的结构来指定 `options` 对象。\n\n***清单 3-7***. Ch3_02c.html\n\
  \n```\nvar options = {\n    axes:{\n        yaxis:{\n            min: 70,\n    \
  \        max: 150\n        }\n    }\n};\n```\n\n现在，y 轴的范围介于你在 `options` 中定义的 `max`\
  \ 和 `min` 属性之间（参见图 3-4）。\n\n![9781484208632_Fig03-04.jpg](img/9781484208632_Fig03-04.jpg)\n\
  \n图 3-4. 聚焦于 y 轴特定范围的折线图\n\n为了方便起见，jqPlot 提供了一个便捷的快捷方式，使我们能够一次性为所有坐标轴的属性赋予相同的值：`axesDefaults`\
  \ 对象。如果你想为 x 轴和 y 轴（或 x2 轴和 y2 轴）设置相同的值，只需为 `axesDefaults` 选项对象指定这些属性，赋值一次即可（参见清单\
  \ 3-8）。\n\n***清单 3-8***. Ch3_02d.html\n\n```\n$(document).ready(function(){\n\n\
  var options = {\n       axesDefaults:{\n          min: 0,\n          max: 20\n \
  \      }\n   };\n   $.jqplot ('myChart', [[1,4,8,13,8,7,12,10,5]], options);\n});\n\
  ```\n\n## 插入数据系列\n\n之前，你了解了如何使用标准选项设置生成一个简单的折线图（参见“创建图表”部分）。在该示例中，数据数组直接作为第二个参数传递给\
  \ `$.jqplot()` 函数。但是，你也可以在外部将数据数组定义为一个变量，然后将其作为第二个参数传递。\n\n```\n$(document).ready(function(){\n\
  \    var data = [[100,110,140,130,80,75,120,130,100]];\n    $.jqplot ('myChart',\
  \ data);\n});\n```\n\n这里，你看到的是对应于 y 轴值的单个数据系列。但是，正如你将看到的，也可以将数据作为 (x, y) 值对传递，并且还可以一次传递多个数据系列。这些输入模式各不相同，具体取决于你正在设计的图表以及所使用的各种插件的要求。例如，如果你想输入多个数据系列，则需要声明四个不同的数组，如清单\
  \ 3-9 所示。\n\n***清单 3-9***. Ch3_03a.html\n\n```\n$(document).ready(function(){\n\
  \    var series1 = [1, 2, 3, 2, 3, 4];\n    var series2 = [3, 4, 5, 6, 5, 7];\n\
  \    var series3 = [5, 6, 8, 9, 7, 9];\n    var series4 = [7, 8, 9, 11, 10, 11];\n\
  \    $.jqplot ('myChart', [series1, series2, series3, series4]);\n});\n```\n\njqPlot\
  \ 能够管理多个系列，而无需在 `options` 中指定任何属性。实际上，浏览器将显示一个折线图，其线条数量与数据系列数量相同，每条线条颜色不同，如图 3-5\
  \ 所示。\n\n![9781484208632_Fig03-05.jpg](img/9781484208632_Fig03-05.jpg)\n\n图 3-5.\
  \ 每个系列颜色不同的多系列折线图\n\n如你所见，在外部定义数据系列不仅使代码更易读、更整洁，还有助于将来对数据进行扩展和操作。利用 JavaScript 提供的所有工具，你可以创建、操作、排序、计算和处理无限多样的数据。\n\
  \n甚至可以更改数据系列的 `options` 对象属性。这些系列按照特定顺序插入到一个数组中，该数组作为第二个参数传递给 `$.jqplot()` 函数。这个顺序将反映在\
  \ `jqPlot` 对象内部 `series` 对象的创建中。例如，如果你只想让第二个系列不显示其标记点，则需要为第一个系列的属性留空（以免覆盖其属性），然后在第二个位置将\
  \ `showMarker` 属性设置为 `'false'`。这样，jqPlot 将只覆盖第二个系列属性的值。要实现这一点，你必须按照清单 3-10 所示编写\
  \ `options` 对象。\n\n***清单 3-10***. Ch3_03b.html\n\n\n```javascript\n$(document).ready(function(){\n\
  \    var series1 = [1, 2, 3, 2, 3, 4];\n    var series2 = [3, 4, 5, 6, 5, 7];\n\
  \    var series3 = [5, 6, 8, 9, 7, 9];\n    var series4 = [7, 8, 9, 11, 10, 11];\n\
  \    var options = {\n       series: [ {},\n              {\n                showMarker:\
  \ false\n              }]\n       }\n\n$.jqplot ('myChart', [series1, series2, series3,\
  \ series4], options);\n});\n```\n\n这些设置的结果是生成一个包含四个序列的图表，如图 3-6 所示。请注意，从上往下数的第三个序列没有标记点。\n\
  \n![9781484208632_Fig03-06.jpg](img/9781484208632_Fig03-06.jpg)\n\n图 3-6. 一个包含无标记序列的多序列图表\n\
  \n如果你决定在 `axesDefaults` 中设置 `showMarker` 属性，而不是在 `axes` 对象中设置，那么你将一次性为所有序列赋予相同的值（参见代码清单\
  \ 3-11）。\n\n***代码清单 3-11***. Ch3_03c.html\n\n```javascript\n$(document).ready(function(){\n\
  \    var series1 = [1, 2, 3, 2, 3, 4];\n    var series2 = [3, 4, 5, 6, 5, 7];\n\
  \    var series3 = [5, 6, 8, 9, 7, 9];\n    var series4 = [7, 8, 9, 11, 10, 11];\n\
  \    var options = {\n       seriesDefaults: { showMarker: false }\n    };\n   \
  \ $.jqplot ('myChart', [series1, series2, series3, series4], options);\n});\n```\n\
  \n现在，图表中的所有序列都不再显示任何标记点（参见图 3-7）。\n\n![9781484208632_Fig03-07.jpg](img/9781484208632_Fig03-07.jpg)\n\
  \n图 3-7. 一个无标记的多序列图表\n\n还有第三种方式可以将数据作为数组输入。你刚刚看到了一个例子，其中为每个序列定义了一个数组，然后将它们全部收集在一个数组中传递给\
  \ `$.jqplot()` 函数：\n\n```javascript\n    var series1 = [1, 2, 3, 2, 3, 4];\n   \
  \ var series2 = [3, 4, 5, 6, 5, 7];\n    var series3 = [5, 6, 8, 9, 7, 9];\n   \
  \ var series4 = [7, 8, 9, 11, 10, 11];\n    $.jqplot ('myChart', [series1, series2,\
  \ series3, series4], options);\n```\n\n但是，也可以将所有序列定义在一个名为 `dataSets` 的单一变量中：\n\n\
  ```javascript\n    var dataSets = {\n       data1: [[1,1], [2,2], [3,3], [4,2],\
  \  [5,3],  [6,4]],\n       data2: [[1,3], [2,4], [3,5], [4,6],  [5,5],  [6,7]],\n\
  \       data3: [[1,5], [2,6], [3,8], [4,9],  [5,7],  [6,9]],\n       data4: [[1,7],\
  \ [2,8], [3,9], [4,11], [5,10], [6,11]]\n    };\n```\n\n一旦声明了 `dataSets` 变量，为了访问这些值，你需要指定其中的序列，并使用\
  \ `dataSets.` 作为前缀。因此，当你需要将四个序列作为 `jqplot()` 函数的第二个参数单独传递时，必须按照以下方式操作：\n\n```javascript\n\
  $.jqplot ('myChart', [dataSets.data1, dataSets.data2, dataSets.data3, dataSets.data4],\
  \ options);\n```\n\n尽管目前来看，整个操作可能显得过于繁琐，但稍后你会看到，在某些特殊情况下，将所有数据收集到一个数据集中会非常有用。\n\n\
  ## 渲染器与插件：进一步澄清\n\n通常，渲染器是一个附加到图表中某个对象上以绘制它的对象。而插件除了添加绘图功能外，还可以执行其他功能，例如事件处理、进行计算以及处理字符串和值（如日期）的格式。因此，可以将渲染器视为一种绘图插件，但反过来并不总是成立。\n\
  \n让我们通过一些例子更详细地探讨这个细微差别。例如，你已经看到，仅输入单个数据序列，默认情况下就可以得到一个折线图（参见“创建图表”一节）。如果你想将此序列渲染为条形图，则需要将\
  \ `barRenderer` 插件附加到 `options` 中的 `seriesDefaults` 对象上。此外，当从折线图切换到条形图时，有必要在 x 轴上创建类别，以便条形之间能够良好地分隔开。为此，你需要将\
  \ `CategoryAxisRenderer` 附加到 `options` 中的 `axes` 对象上（参见代码清单 3-12）。\n\n***代码清单 3-12***.\
  \ Ch3_04a.html\n\n```javascript\n$(document).ready(function(){\n    var data = [[100,\
  \ 110, 140, 130, 80, 75, 120, 130, 100]];\n    var options = {\n       seriesDefaults:\
  \ {\n         renderer: $.jqplot.BarRenderer\n       },\n       axes:{\n       \
  \  xaxis:{\n           renderer: $.jqplot.CategoryAxisRenderer\n         }\n   \
  \   }\n    }\n    $.jqplot ('myChart', data, options);\n});\n```\n\n然而，仅仅在 `options`\
  \ 中调用这两个渲染器是不够的。你还必须在页面中加载它们，因此需要包含相应的插件，如代码清单 3-13 和 3-14（CDN 服务）所示。\n\n***代码清单\
  \ 3-13***. Ch3_04a.html\n\n```html\n<script type=\"text/javascript\" src=\"../src/jquery.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"../src/jquery.jqplot.min.js\"\
  ></script>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"../src/jquery.jqplot.min.css\"\
  />\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.barRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.categoryAxisRenderer.min.js\"\
  ></script>\n```\n\n***代码清单 3-14***. Ch3_04a.html\n\n```html\n<script src=\"http://code.jquery.com/jquery-1.9.1.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/jquery.jqplot.min.js\"\
  ></script>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"http://cdn.jsdelivr.net/jqplot/1.0.8/jquery.jqplot.min.css\"\
  />\n<script type=\"text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.barRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.categoryAxisRenderer.min.js\"\
  ></script>\n```\n\n如果你在浏览器中重新加载页面，折线图就会变成条形图，如图 3-8 所示。\n\n![9781484208632_Fig03-08.jpg](img/9781484208632_Fig03-08.jpg)\n\
  \n图 3-8. 一个条形图\n\n通过将这两个渲染器调用到 `options` 中，你便用这些类别渲染器替换了图表中所有序列的默认渲染器。这些渲染器本身又有多个设置为默认值的属性，这些属性同样可以被修改。其中许多属性可能是该特定渲染器所特有的，因此它们会被添加到\
  \ `jqplot` 对象中已定义的属性中，以便为图表引入新功能。\n\n即使对于这类附加属性，你也可以通过 `options` 对象更改默认值。首先，将所需的渲染器赋值给\
  \ `renderer` 属性。然后，在 `rendererOptions` 属性中指定你想要设置的所有属性。所有这些属性都将在你想要操作的那个组件对象中指定。例如，如果你希望某个给定序列的每个条形都有不同的颜色，你需要更改\
  \ `varyBarColor` 属性，将其默认值 `false` 替换为 `true`（参见代码清单 3-15）。\n\n***代码清单 3-15***. Ch3_04b.html\n\
  \n\n```javascript\nvar options = {\n    seriesDefaults: {\n        renderer: $.jqplot.BarRenderer,\n\
  \        rendererOptions: {\n           varyBarColor: true\n        }\n    },\n\
  \    axes:{\n       xaxis:{\n          renderer: $.jqplot.CategoryAxisRenderer\n\
  \      }\n    }\n}\n```\n\n通过刚才所做的更改，`BarRenderer` 插件会自动为每个条形分配不同的颜色（参见图 3-9）。\n\
  \n![9781484208632_Fig03-09.jpg](img/9781484208632_Fig03-09.jpg)\n\n图 3-9. 不同颜色的条形图\n\
  \n插件还具有可在 `options` 对象内部设置的特定属性。如前所述，并非所有 jqPlot 插件都是渲染器，那些不是渲染器的插件在 jqPlot 发行版中很容易识别，因为它们的文件名中不包含\
  \ `renderer` 一词。这些插件执行与图表中特定类型组件不直接相关的特定功能。此类功能总体上增强了 jqPlot 的能力。例如，`Highlighter`\
  \ 是一个在鼠标悬停时高亮显示数据点的插件。正如你将看到的，该插件内部包含一系列工具，用于处理数据值的格式说明符，并可以显示具有 HTML 结构的工具提示内容。其他值得注意的插件包括\
  \ `Trendline`，它会自动计算并绘制已绘制数据的趋势线；`Cursor`，它表示图表中显示的鼠标光标；以及 `PointLabels`，它会在数据点处放置标签。\n\
  \n## CSS 自定义\n\njqPlot 图表的许多样式都是通过 CSS 完成的。每个发行版中都提供了 `jquery.jqplot.css` 文件，它是为了获得\
  \ jqPlot 图表而需要在网页中包含的三个基本文件之一。\n\n构成图表的所有组件都可以通过 CSS 进行自定义，而无需在 `options` 对象中设置它们的任何属性。这是为了保持与网页中所有其他对象的一致性：图表及其内部（画布内）所有内容的样式，都必须像任何其他\
  \ HTML 对象一样，由 CSS 文件管理。控制 jqPlot 对象样式的 CSS 类名称以 `.jqplot-*` 前缀开头。例如，影响所有坐标轴的样式类是\
  \ `.jqplot-axis`。\n\n为了说明如何使用 CSS 修改图表的某些元素，让我们看看如何更改图表标题的字体和字号。与任何 HTML 元素一样，你只需调用\
  \ `jqPlot` 元素的 CSS 选择器并修改属性即可。因此，在这种情况下，你在代码清单 3-16 中添加了 CSS 样式设置。\n\n***代码清单 3-16***.\
  \ Ch3_02e.html\n\n```css\n<style>\n    .jqplot-title {\n        font: italic bold\
  \ 22px arial, sans-serif;\n    }\n</style>\n```\n\n使用这条新的 CSS 语句，你更改了标题的样式，如图 3-10\
  \ 所示。\n\n![9781484208632_Fig03-10.jpg](img/9781484208632_Fig03-10.jpg)\n\n图 3-10.\
  \ 应用于标题的两种不同 CSS 样式\n\n## 模块化思维\n\n当事情变得越来越复杂，需要添加到网站中的代码行数变得很多时，最好以模块化的方式进行思考。创建独立的模块不仅能提供更好的可见性和易于维护性，还能促进你所创建内容的可重用性。让我们分析一下代码清单\
  \ 3-17 中网页的当前情况。\n\n***代码清单 3-17***. Ch3_05a.html\n\n```html\n<HTML>\n<HEAD>\n<TITLE>我的第一个图表</TITLE>\n\
  <script type=\"text/javascript\" src=\"../src/jquery.min.js\"></script>\n<script\
  \ type=\"text/javascript\" src=\"../src/jquery.jqplot.min.js\"></script>\n<link\
  \ rel=\"stylesheet\" type=\"text/css\" href=\"../src/jquery.jqplot.min.css\"/>\n\
  <style>\n    .jqplot-title {\n        font: italic bold 22px arial, sans-serif;\n\
  \    }\n</style>\n<script class=\"code\" type=\"text/javascript\">\n$(document).ready(function(){\n\
  \    var data = [[100, 110, 140, 130, 80, 75, 120, 130, 100]];\n    $(document).ready(function(){\n\
  \        $.jqplot ('myChart', data,\n        {\n            title: '我的第一个 jqPlot\
  \ 图表'\n        });\n    });\n});\n</script>\n</HEAD>\n<BODY>\n    <div id=\"myChart\"\
  \ style=\"height:400px; width:500px;\"></div>\n</BODY>\n</HTML>\n```\n\n如果你在浏览器中加载此网页，你将得到图\
  \ 3-11 中的折线图。\n\n![9781484208632_Fig03-11.jpg](img/9781484208632_Fig03-11.jpg)\n\
  \n图 3-11. 一个简单的折线图\n\n显而易见，控制页面样式的部分包含在 `<style></style>` 标签对中，而 JavaScript 或 jqPlot\
  \ 代码则包含在 `<script></script>` 标签对中。这是我们添加代码行的两个主要区域。但有趣的是，这两个部分可以被复制并粘贴到两个独立的外部文件中。样式部分将被复制到一个我们称之为\
  \ `myCss.css` 的文件中（参见代码清单 3-18）。\n\n***代码清单 3-18***. myCss.css\n\n```css\n.jqplot-title\
  \ {\n    font: italic bold 22px arial, sans-serif;\n}\n```\n\nJavaScript 代码将被复制到一个我们命名为\
  \ `myJS.js` 的文件中（参见代码清单 3-19）。\n\n***代码清单 3-19***. myJS.js\n\n```javascript\n$(document).ready(function(){\n\
  \    var data = [[100, 110, 140, 130, 80, 75, 120, 130, 100]];\n    $.jqplot ('myChart',\
  \ data,\n    {\n       title: '我的第一个 jqPlot 图表'\n    });\n});\n```\n\n现在，你可以通过删除复制的部分并包含两个新创建的文件来更改你的\
  \ HTML 页面（参见代码清单 3-20）。\n\n***代码清单 3-20***. Ch3_05b.html\n\n```html\n<HTML>\n<HEAD>\n\
  \    <TITLE>我的第一个图表</TITLE>\n    <script type=\"text/javascript\" src=\"../src/jquery.min.js\"\
  ></script>\n    <script type=\"text/javascript\" src=\"../src/jquery.jqplot.min.js\"\
  ></script>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"../src/jquery.jqplot.min.css\"\
  />\n    <script type=\"text/javascript\" src=\"myJS.js\"></script>\n    <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"myCss.css\"/>\n</HEAD>\n<BODY>\n   <div id=\"\
  myChart\" style=\"height:400px; width:500px;\"></div>\n</BODY>\n</HTML>\n```\n\n\
  如果你现在在浏览器中加载该页面，与 JavaScript 代码和 CSS 样式位于同一页面的初始情况相比，你将看不到任何区别（参见图 3-11）。\n\n了解以模块化方式工作的可能性将使你能够编写可被多个图表重用的代码。当你想要创建，例如，一组标准的\
  \ CSS 样式来分配一个对所有图表通用的图形主题时，这会非常有用。或者，如果你已经开发了 JavaScript 方法，其应用在许多其他情况下都很有价值，那么你可以将这些方法作为外部文件包含在你个人库的每个\
  \ HTML 页面中。\n\n## 总结\n\n\n\n"
- '# 排版后的内容


  在本章中，你迈出了使用 `jqPlot` 库的第一步。具体来说，你了解了该库的设计方式以及一些关键概念，例如插件和选项。通过一系列示例，你逐步学会了如何使用传递给
  `$.jqPlot()` 函数的三个不同参数：`target`（即 `jqPlot` 库的画布）、输入 `data`（其格式和多种输入模式），以及尤为重要的 `options`
  对象，通过它来配置库中所有组件的设置。`options` 将成为你在后续章节中看到的所有实现的核心。


  在接下来的章节中，你将更具体地使用 `jqPlot` 库，实现所有最常见的图表类型。在下一章中，你将开始学习折线图。


  ## 第 4 章


  


  '
- "# 使用 jqPlot 绘制折线图\n\n在上一章中，你了解了 `jqPlot` 的最基本用法：只需一组数据即可绘制一条折线，无需任何额外选项。你看到，要创建最基本的图表类型——折线图，并不需要包含插件。\n\
  \n在本章中，你将开始更详细地研究 `jqPlot` 库所提供的可能性，探索各种插件及其功能。首先，由于折线图是在笛卡尔坐标轴上绘制的，你将学习使用 `(x,\
  \ y)` 值对作为输入数据。接着，你将研究坐标轴以及如何使用适当的插件来创建它们。你还将详细分析如何实现与坐标轴相关的各种元素，如刻度、坐标轴标签和网格。随后将讨论对数刻度。\n\
  \n接下来，你将学习如何通过同时处理多个数据系列来实现多系列折线图。你将发现如何通过设置线条和标记来修改图案、形状甚至颜色。此外，你还会了解如何通过调整浏览器绘制图表的速度来创建动画。\n\
  \n而且，你将探究 `jqPlot` 库如何处理不同格式的日期和时间值。你还将看到如何使用 HTML 格式自定义某些元素，以及如何高亮数据点。在本章的最后部分，你将处理更复杂的情况，例如生成趋势线和处理带状图。\n\
  \n## 使用 `(x, y)` 值对作为输入数据\n\n到目前为止，为简单起见，输入数据都是以 `y` 值数组的形式传递的（参见代码清单 4-1）。如果 `jqPlot`\
  \ 只找到 `y` 值，则会根据它们在数组中的顺序，将 `x` 值分配为 1、2、3 等。\n\n***代码清单 4-1***。`Ch4_01.html`\n\n\
  ```\n$(document).ready(function(){\n    var plot1 = $.jqplot ('myChart', [[100,110,140,130,80,75,120,130,100]]);\n\
  });\n```\n\n在图 4-1 中，你可以看到 `x` 轴上有一系列整数，它们是作为数据传递的数组的索引。\n\n![9781484208632_Fig04-01.jpg](img/9781484208632_Fig04-01.jpg)\n\
  \n图 4-1。`x` 轴显示的是插入值的索引\n\n当处理线性图时，最好使用 `(x, y)` 值对数组，因为这样可以避免许多复杂情况，例如需要按特定顺序输入数据，而这并不总是可行或正确的。实际上，使用值对时，数据不必按\
  \ `x` 值递增的顺序列出；`jqPlot` 会为你完成排序。此外，`x` 值不必等距，可以遵循任意分布。在代码清单 4-2 中，插入了 `(x, y)` 值对，其中\
  \ `x` 值既未排序也未均匀分布。\n\n***代码清单 4-2***。`Ch4_02.html`\n\n```\n$(document).ready(function(){\n\
  \    var data = [[[10,100], [80,130], [65,75], [40,130],\n                 [60,80],\
  \ [30,140], [70,120], [20,110], [95,100]]];\n    $.jqplot ('myChart', data);\n});\n\
  ```\n\n在图 4-2 中，你可以看到 `jqPlot` 如何对图表中的所有点进行排序，无论它们输入的顺序如何，也无论它们是否沿 `x` 轴均匀分布。\n\n\
  ![9781484208632_Fig04-02.jpg](img/9781484208632_Fig04-02.jpg)\n\n图 4-2。一个简单的折线图，`x`\
  \ 轴上的点分布不均匀\n\n## 开发折线图的第一步：坐标轴\n\n在详细研究折线图的更复杂方面之前，让我们先检查一下这种图表所基于的基础：坐标轴。如果你想开发一个能够完美可视化数据的图表，坐标轴的适当管理至关重要。为此，你需要充分理解\
  \ `jqPlot` 库通过 `options` 对象中的特定属性所提供的操作模式。\n\n### 添加标题和坐标轴标签\n\n开发图表时，第一步是添加标题并管理坐标轴标签，使用\
  \ `CanvasAxisLabelRenderer` 插件。\n\n但是，为了正常运行，此插件需要另一个提供文字功能的插件：`CanvasTextRenderer`。使用此插件，你可以直接在画布元素上渲染标签文本。这使你可以像处理其他图形元素一样处理文本，从而能够根据需要旋转文本。默认情况下，`y`\
  \ 轴上的坐标轴标签现在旋转了 90 度，如图 4-3 所示。\n\n![9781484208632_Fig04-03.jpg](img/9781484208632_Fig04-03.jpg)\n\
  \n图 4-3。如果不包含 `CanvasAxisLabelRenderer` 插件，`y` 轴标签是水平的。包含该插件后，`y` 轴标签会垂直旋转\n\n要集成这一新功能，你需要将这两个插件添加到基本插件集中：\n\
  \n```\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.canvasTextRenderer.min.js\"\
  >\n</script>\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.canvasAxisLabelRenderer.min.js\"\
  ></script>\n```\n\n或者，如果你更喜欢使用内容分发网络（CDN）服务，可以按如下方式操作：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n    /jqplot.canvasTextRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n\
  \    /jqplot.canvasAxisLabelRenderer.min.js\"></script>\n```\n\n创建 `options` 变量后，你必须在其中指定一些属性，如代码清单\
  \ 4-3 所示。你已经了解了如何通过向 `title` 对象分配字符串来添加标题。然后，需要显式调用 `canvasAxisLabelRenderer` 对象以激活其功能，通过在\
  \ `axesDefaults` 对象内部执行此操作，它将适用于所有坐标轴。要为 `x` 轴和 `y` 轴标签分配文本，你必须在 `axes` 对象的 `xaxis`\
  \ 和 `yaxis` 子对象中设置 `label` 属性。其树状结构将允许你在每个单独坐标轴的级别上进行不同的更改。\n\n***代码清单 4-3***。`ch9_03a.html`\n\
  \n```\n$(document).ready(function(){\n    var data = [[100, 110, 140, 130, 80, 75,\
  \ 120, 130, 100]] ;\n    var options = {\n       title: '我的折线图',\n       axesDefaults:\
  \ {\n          labelRenderer: $.jqplot.CanvasAxisLabelRenderer\n       },\n    \
  \   axes: {\n          xaxis: {\n             label: \"X 轴\"\n          },\n   \
  \       yaxis: {\n             label: \"Y 轴\"\n          }\n       }\n    };\n \
  \   $.jqplot ('myChart', data, options);\n});\n```\n\n图 4-4 展示了上述代码生成的图表。\n\n\n\n\
  ![9781484208632_Fig04-04.jpg](img/9781484208632_Fig04-04.jpg)\n\n图 4-4. Y 轴标签垂直方向的折线图\n\
  \n## 坐标轴属性\n\n与坐标轴标签类似，在 `axes` 对象中也可以指定多个属性。例如，观察图表（参见图 9-4），可以看到线条从 x 值 1 开始，而\
  \ x 轴从值 0 开始，因此留下了一段空白。在 x 范围的末端（9 到 10 之间）也出现了另一段空白。如果要控制这些间距（坐标轴边界与数据集端点之间的距离），必须使用\
  \ `pad` 属性。通过应用内边距，可以扩展数据边界之上和之下的范围。数据范围会乘以这个因子，以确定坐标轴的最小和最大边界。值 0 将被解释为无内边距，`pad`\
  \ 将被设置为 1。因此，通过向 `xaxis` 对象添加 `pad` 属性并将其设置为 1（参见代码清单 4-4），可以得到图 4-5 中的图表。\n\n***代码清单\
  \ 4-4***. Ch4_03b.html\n\n```\nxaxis: {\n    label: \"X Axis\",\n    pad: 1\n},\n\
  ```\n\n![9781484208632_Fig04-05.jpg](img/9781484208632_Fig04-05.jpg)\n\n图 4-5. 与图\
  \ 4-4 相同的折线图，x 轴的 `pad` 设置为 1\n\n现在，x 轴从值 1 开始，到值 9 结束，与表示数据系列的线条一致。为了更好地理解内边距的概念，现在将\
  \ `pad` 属性设置为 2（参见代码清单 4-5）。这意味着要将当前范围（即 10）扩展两倍。结果将得到一个 x 轴范围从 –4 到 14 的图表，如图 4-6\
  \ 所示。这是因为 jqPlot 倾向于以对称的方式保持数据，将其显示在中间。\n\n***代码清单 4-5***. Ch4_03c.html\n\n```\n\
  xaxis: {\nlabel: \"X Axis\",\npad: 2\n},\n```\n\n![9781484208632_Fig04-06.jpg](img/9781484208632_Fig04-06.jpg)\n\
  \n图 4-6. 相同的折线图，x 轴的 `pad` 设置为 2\n\n另一种控制数据显示范围的方法是使用 `min` 和 `max` 属性（参见代码清单 4-6）。\n\
  \n***代码清单 4-6***. Ch4_03d.html\n\n```\nxaxis: {\n    label: \"X Axis\",\n    min:\
  \ 1,\n    max: 9\n},\n```\n\n图 4-7 显示了具有新范围的 x 轴。\n\n![9781484208632_Fig04-07.jpg](img/9781484208632_Fig04-07.jpg)\n\
  \n图 4-7. 相同的折线图，x 轴定义了 `max` 和 `min`\n\n其他有用的属性是那些控制细分（分割轴）及其底层数值项的属性：`ticks` 属性。由于它们的使用不仅限于\
  \ `axes` 对象下的简单选项——它们本身就是一个对象，并且需要渲染器插件才能工作——因此对它们的处理需要单独一节来讨论。\n\n## 坐标轴刻度\n\n\
  `tick`（刻度）是一个组件，用于在图表中显示刻度线或网格线的值。刻度在图表中的行为可以在 `options` 的 `axes` 对象内部指定，并且刻度本身作为一个对象，在\
  \ `tickOption` 属性内部可以设置多个属性。例如，可能需要为每个坐标轴设置特定数量的网格线。这可以通过多种方式实现。最简单的方法是直接指定 `numberTicks`\
  \ 属性（参见代码清单 4-7）。如果将其值设置为 5，则 x 轴上将得到五个刻度：0、3、6、9 和 12（参见图 4-8）。\n\n***代码清单 4-7***.\
  \ Ch4_03e.html\n\n```\nxaxis: {\n    label: \"X Axis\",\n    numberTicks: 5\n},\n\
  ```\n\n![9781484208632_Fig04-08.jpg](img/9781484208632_Fig04-08.jpg)\n\n图 4-8. x\
  \ 轴上具有预设数量刻度的折线图\n\n这同样可以应用于 y 轴。在这种情况下，需要在 `yaxis` 对象中设置相同的属性。从图中可以看出，x 轴划分的间隔是均匀的，因此刻度是等距的。另一种方法是直接定义希望在图表上显示的刻度，如代码清单\
  \ 4-8 所示。\n\n***代码清单 4-8***. Ch4_03f.html\n\n```\nxaxis: {\n    label: \"X Axis\"\
  ,\n    ticks: [0,3,6,9,12]\n},\n```\n\n这将生成相同的图表（参见图 4-9）。\n\n![9781484208632_Fig04-09.jpg](img/9781484208632_Fig04-09.jpg)\n\
  \n图 4-9. x 轴上直接定义刻度的折线图\n\n但是，当希望沿坐标轴不均匀分布刻度时，通常更倾向于使用这种方法，如代码清单 4-9 所示。网格线也会跟随这种不均匀性，因为它将在每个刻度对应的位置绘制（参见图\
  \ 4-10）。\n\n***代码清单 4-9***. Ch4_03g.html\n\n```\nxaxis: {\n    label: \"X Axis\"\
  ,\n    ticks: [1,2,3,7,9]\n},\n```\n\n![9781484208632_Fig04-10.jpg](img/9781484208632_Fig04-10.jpg)\n\
  \n图 4-10. x 轴上具有非均匀预设刻度的折线图\n\n刻度在图表中非常重要，以至于有一个专门针对它们的插件：`CanvasAxisTickRenderer`。\n\
  \n如果希望在保留刻度值的同时创建一个没有网格线的图表，可以将 `showGridLine` 属性设置为 `'false'`。但是，在此之前，需要先在网页中包含该插件：\n\
  \n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"../src/jquery.jqplot.min.css\"\
  \ />\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.canvasTextRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.canvasAxisLabelRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.canvasAxisTickRenderer.min.js\"\
  ></script>\n```\n\n或者，如果更喜欢使用 CDN 服务，可以按如下方式操作：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n    /jqplot.canvasTextRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n\
  \    /jqplot.canvasAxisLabelRenderer.min.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n    /jqplot.canvasAxisTickRenderer.min.js\"\
  ></script>\n```\n\n然后，必须在 `axesDefaults` 对象内部进行设置，因为希望隐藏两个坐标轴的网格线。记得使用 `tickRenderer`\
  \ 属性调用刚刚包含的插件（参见代码清单 4-10）。此外，不要忘记删除在 `xaxis` 对象内部定义的 `ticks` 属性。\n\n***代码清单 4-10***.\
  \ Ch4_04a.html\n\n```\naxesDefaults: {\n    labelRenderer: $.jqplot.CanvasAxisLabelRenderer,\n\
  \    tickRenderer: $.jqplot.AxisTickRenderer,\n    tickOptions: {\n       showGridline:\
  \ false\n    }\n},\naxes: {\n    xaxis: {\n       label: \"X Axis\"  //remove the\
  \ comma here\n    },\n```\n\n如图 4-11 所示，得到一个没有网格的图表。\n\n![9781484208632_Fig04-11.jpg](img/9781484208632_Fig04-11.jpg)\n\
  \n图 4-11. 没有网格线的折线图\n\n\n\n有时，您可能需要仅隐藏一个轴上的网格线，例如 x 轴（参见图 4-12）。在这种情况下，您只需在 `xaxis`\
  \ 对象内部调用渲染器。在代码清单 4-11 中，您可以看到必须从 `axesDefaults` 中移除并写入 `xaxis` 对象内的代码行。\n\n![9781484208632_Fig04-12.jpg](img/9781484208632_Fig04-12.jpg)\n\
  \n图 4-12。仅显示水平网格线的折线图\n\n***代码清单 4-11***。ch9_04b.html\n\n```\naxesDefaults: {\n\
  \    labelRenderer: $.jqplot.CanvasAxisLabelRenderer\n    //删除所有以下行\n    //tickRenderer:\
  \ $.jqplot.AxisTickRenderer,\n    //tickOptions: {\n    //showGridline: false\n\
  \    //}\n},\naxes: {\n    xaxis: {\n       label: \"X 轴\",\n       tickRenderer:\
  \ $.jqplot.AxisTickRenderer,\n       tickOptions: {\n          showGridline: false\n\
  \       }\n    },\n    ...\n```\n\n您可能想要添加的另一个功能是允许将数值格式化为字符串。这种功能最常见的应用场景是在 y 轴上显示百分比值。为此，您需要在数值后添加字符\
  \ `'%'`，如代码清单 4-12 所示。\n\n***代码清单 4-12***。Ch4_04c.html\n\n```\nyaxis: {\n    label:\
  \ \"Y 轴\",\n    tickRenderer: $.jqplot.AxisTickRenderer,\n    tickOptions: {\n \
  \      formatString:'%d%'\n    }\n}\n```\n\n如图 4-13 所示，图表现在在 y 轴上显示百分比值。\n\n![9781484208632_Fig04-13.jpg](img/9781484208632_Fig04-13.jpg)\n\
  \n图 4-13。在 y 轴上显示百分比的折线图\n\n稍后，您将看到其他情况，其中这种字符串格式化被证明是一个非常强大的工具（请参阅“处理日期值”一节）。\n\
  \n## 使用对数刻度\n\n根据您希望在图表中表示的数据趋势，有时需要在一个或两个轴上使用对数刻度。jqPlot 支持对数刻度，只需在您的网页中包含 `LogAxisRenderer`\
  \ 插件即可。\n\n```\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.logAxisRenderer.min.js\"\
  ></script>\n```\n\n**对数刻度**\n\n对数刻度使用与数量级（通常为十）相对应的间隔，而不是标准的线性刻度。这允许您在一个轴上表示大范围的值\
  \ (v)。\n\n![9781484208632_unFig04-01.jpg](img/9781484208632_unFig04-01.jpg)\n\n\
  ![9781484208632_unFig04-02.jpg](img/9781484208632_unFig04-02.jpg)\n\n对数是书写指数的另一种方式，您可以用它来分离指数\
  \ (x) 并将其放置在轴上。\n\n![9781484208632_unFig04-03.jpg](img/9781484208632_unFig04-03.jpg)\n\
  \n![9781484208632_unFig04-04.jpg](img/9781484208632_unFig04-04.jpg)\n\n例如，对数刻度上增加一个点对应数值增加\
  \ 10 倍。同样，增加两个点对应数值增加 100 倍。以此类推。\n\n在您希望以对数刻度表示数据的轴上，只需添加带有插件引用的 `renderer` 属性即可。在这种情况下，您需要创建一个大致遵循指数趋势的数据数组。因此，您可以使用代码清单\
  \ 4-13 中的 [x, y] 对数组。\n\n***代码清单 4-13***。Ch4_11.html\n\n```\nvar data = [[0,1.2],[10,2.4],[20,5.6],[30,12],[40,23],\n\
  \            [50,60],[60,120],[70,270],[80,800]];\n```\n\n接下来，将 y 轴设置为对数刻度，如代码清单\
  \ 4-14 所示。\n\n***代码清单 4-14***。Ch4_11.html\n\n```\n$.jqplot ('myChart', [data],{\n\
  \    axes:{\n    xaxis:{},\n    yaxis:{ renderer: $.jqplot.LogAxisRenderer }\n \
  \   }\n});\n```\n\n在图 4-14 中，您可以看到数据在半对数刻度（一个轴上的对数刻度）下如何呈现近似直线的形状。\n\n![9781484208632_Fig04-14.jpg](img/9781484208632_Fig04-14.jpg)\n\
  \n图 4-14。y 轴采用半对数刻度的折线图\n\n## 多系列折线图\n\n既然已经很好地指定了用于表示折线图的轴，现在是时候讨论多系列折线图了。通常，您需要在同一图表中显示多个数据系列。事实上，图表的目的大多正是为了比较不同的数据系列。\n\
  \njqPlot 库为我们提供了管理多系列图表所需的工具。通过作用于线条和标记的图案、形状和颜色，可以引入有助于表示不同数据系列的图形效果。\n\n### 多个数据系列\n\
  \n到目前为止，您只处理了单个数据集。但有时，您希望同时表示多个数据集。在第 1 章中，您了解到在 jqPlot 中，多个系列的处理方式与单个系列相同。每个系列必须首先单独定义，将其赋值给一个变量，然后与其他系列组合成一个数组。然后将此数组作为第二个参数传递给\
  \ `jqPlot()` 函数（参见代码清单 4-15）。\n\n***代码清单 4-15***。Ch4_05a.html\n\n```\n$(document).ready(function(){\n\
  \    var data1 = [1, 2, 3, 2, 3, 4];\n    var data2 = [3, 4, 5, 6, 5, 7];\n    var\
  \ data3 = [5, 6, 8, 8, 7, 9];\n    var data4 = [7, 8, 9, 9, 10, 11];\n    var options\
  \ = {\n       title:'多个数据数组'\n    };\n    $.jqplot ('myChart', [data1, data2, data3,\
  \ data4], options);\n});\n```\n\n图 4-15 显示了来自代码清单 4-15 的多系列图表结果。\n\n![9781484208632_Fig04-15.jpg](img/9781484208632_Fig04-15.jpg)\n\
  \n图 4-15。多系列折线图\n\n系统会自动为每个系列分配不同的颜色。这个颜色序列在 jqPlot 中被定义为默认值。以下是 jqPlot 将按顺序分配给系列的颜色：\n\
  \n```\nseriesColors: [  \"#4bb2c5\", \"#c5b47f\", \"#EAA228\", \"#579575\",\n  \
  \               \"#839557\", \"#958c12\", \"#953579\", \"#4b5de4\",\n          \
  \       \"#d8b83f\", \"#ff5800\", \"#0085cc\"]\n```\n\n这些值代表 `'#rrggbb'`，其中 *rr*、*gg*\
  \ 和 *bb* 分别是红色、绿色和蓝色的十六进制值。浏览器组合这些值以生成系列所需的所有颜色。\n\n当系列超过 11 个时，jqPlot 会从头开始重复该序列。如果您不希望这样，或者只是需要以不同方式处理，您可以在\
  \ `seriesColors` 属性中定义一个包含不同颜色序列的数组，例如代码清单 4-16 中给出的系列。图 4-16 显示了一种灰色变化，但请运行示例，亲自看看区别（颜色范围从蓝色到紫色）。\n\
  \n***代码清单 4-16***。Ch4_05b.html\n\n```\nvar options = {\n    seriesColors: [\"#105567\"\
  ,\"#805567\",\"#bb5567\",\"#ff5567\"],\n    title:'多个数据数组'\n};\n```\n\n![9781484208632_Fig04-16.jpg](img/9781484208632_Fig04-16.jpg)\n\
  \n图 4-16。使用自定义颜色集的多系列折线图\n\n![Image](img/sq.jpg) **注意**  要检查颜色代码，我建议访问网站 HTML 颜色代码（`http://html-color-codes.info`）。\n\
  \n\n\n你也可以使用两个函数来指定特定颜色：`rgba(r, g, b, a)` 和 `rgb(r, g, b)`。你可以将这些函数直接插入到要分配给 `seriesColors`\
  \ 属性的数组的每个值中，如代码清单 4-17 所示。\n\n***代码清单 4-17***。Ch4_05c.html\n\n```\nseriesColors:\
  \ [\"rgba(16,85,103,0.2)\", \"rgba(128,85,103,0.6)\",\n               \"rgb(187,85,103)\"\
  , \"rgb(250,85,103)\"],\n```\n\n之前，你一直通过组合实现特定颜色所需的红、绿、蓝光来指定颜色，而使用 `rgba()` 函数时，引入了一个新变量\
  \ `a`。这个 `a`（代表“alpha”）表示颜色的不透明度/透明度级别。如图 4-17 所示，定义较低的 alpha 值可以让你看到彩色对象背后的内容。\n\
  \n![9781484208632_Fig04-17.jpg](img/9781484208632_Fig04-17.jpg)\n\n图 4-17。具有不同透明度级别的多系列折线图\n\
  \n## 平滑折线图\n\n除了选择是否显示点标记以及连接它们的直线之外，你通常还会决定是否希望获得平滑的曲线进展，如图 4-18 所示。这可以通过使用 `smooth`\
  \ 属性并将其设置为 `'true'` 来实现（参见代码清单 4-18）。\n\n![9781484208632_Fig04-18.jpg](img/9781484208632_Fig04-18.jpg)\n\
  \n图 4-18。具有平滑线条的多系列折线图\n\n***代码清单 4-18***。Ch4_06.html\n\n```\n$(document).ready(function(){\n\
  \    var data1 = [1, 2, 3, 2, 3, 4];\n    var data2 = [3, 4, 5, 6, 5, 7];\n    var\
  \ data3 = [5, 6, 8, 8, 7, 9];\n    var data4 = [7, 8, 9, 9, 10, 11];\n    var options\
  \ = {\n       title:'Multiple Data Arrays',\n       seriesDefaults: {\n        \
  \  rendererOptions: {\n             smooth: true\n          }\n       }\n    };\n\
  \    $.jqplot ('myChart', [data1, data2, data3, data4], options);\n});\n```\n\n\
  ## 线条与标记样式\n\n在设计折线图时，需要考虑的另一个关键方面是线条和标记的显示方式。你可以使用线条、一系列标记或两者结合来表示图表。默认情况下，jqPlot\
  \ 会为每个系列显示点标记，对应每个 [x, y] 数据点，并用一条线按顺序连接它们。\n\n所有这些都可以通过属于系列对象的两个关键属性来控制：`linePattern`\
  \ 和 `lineWidth`；同时添加 `markerOptions` 属性，还可以影响标记组件的另外两个属性：`style` 和 `size`。代码清单 4-19\
  \ 是这些设置的一个示例。\n\n***代码清单 4-19***。Ch4_07a.html\n\n```\n$(document).ready(function(){\n\
  \    var data1 = [1, 2, 3, 2, 3, 4];\n    var data2 = [3, 4, 5, 6, 5, 7];\n    var\
  \ data3 = [5, 6, 8, 9, 7, 9];\n    var data4 = [7, 8, 9, 11, 10, 11];\n    var options\
  \ = {\n       title: 'Multiple Data Arrays',\n       series:[{\n          linePattern:\
  \ 'dashed',\n          lineWidth:2,\n          markerOptions: { style: 'diamond'\
  \ }\n       },\n       {\n          showLine:false,\n          markerOptions: {\
  \ size: 7, style: 'x' }\n       },\n       {\n          markerOptions: { style:\
  \ 'circle' }\n       },\n       {\n          lineWidth:5,\n          linePattern:\
  \ 'dotted',\n          markerOptions: { style: 'filledSquare', size: 10 }\n    \
  \   }]\n    }\n    $.jqplot ('myChart', [data1, data2, data3, data4], options);\n\
  });\n```\n\n图 4-19 展示了代码清单 4-19 中设置的结果。\n\n![9781484208632_Fig04-19.jpg](img/9781484208632_Fig04-19.jpg)\n\
  \n图 4-19。在折线图中可以设置不同的标记和图案\n\n图表上的线条可以通过 `linePattern` 属性绘制为实线、虚线或点线。默认情况下，绘制的每条线都是实线，因此如果你希望线条具有不同的样式，则必须在\
  \ `options` 中指定。你在代码清单 4-19 中看到，可以将 `linePattern` 属性设置为 `'dotted'` 或 `'dashed'`，以分别获得点线或虚线。在代码清单\
  \ 4-20 中，你可以看到还可以通过将格式定义为一个数组（`[破折号长度, 间隙长度, 等等]`）来获得自定义的线条图案。当分配给 `linePattern`\
  \ 属性的数组具有偶数个元素时，线条看起来效果最好，这样线条以破折号开始，以间隙结束。`linePattern` 属性还可以使用破折号（`-`）和点（`.`）字符的简写字符串表示法来创建自定义图案。代码清单\
  \ 4-20 提供了示例。\n\n***代码清单 4-20***。Ch4_07b.html\n\n```\nvar options = {\n    title:\
  \ 'Multiple Data Arrays',\n    seriesDefaults: {\n       showMarker: false\n   \
  \ },\n    series: [{ linePattern: 'dashed'},\n              { linePattern: 'dotted'},\n\
  \              { linePattern: [4, 3, 1, 3, 1, 3]},\n              { linePattern:\
  \ '-.'}]\n};\n```\n\n图 4-20 展示了代码清单 4-20 中使用的自定义线条图案示例。\n\n![9781484208632_Fig04-20.jpg](img/9781484208632_Fig04-20.jpg)\n\
  \n图 4-20。具有不同图案的多系列折线图\n\n## 动画图表\n\n当你在浏览器中加载网页时，你会注意到图表几乎是瞬间绘制完成的。你可以根据自己的偏好降低绘制速度；较慢的速度会在绘制图表元素时产生浮动效果（参见代码清单\
  \ 4-21）。\n\n***代码清单 4-21***。Ch4_23.html\n\n```\nvar options = {\n    title: 'Multiple\
  \ Data Arrays',\n    seriesDefaults: {\n       showMarker: false,\n       rendererOptions:\
  \ {\n          smooth: true,\n          animation: { show: true  }\n       }\n \
  \   }\n};\n```\n\n图 4-21 展示了图表绘制的顺序，使其具有动画外观。\n\n![9781484208632_Fig04-21.jpg](img/9781484208632_Fig04-21.jpg)\n\
  \n图 4-21。一个动画多系列折线图\n\n## 多个 Y 轴\n\njqPlot 支持相对于同一个 X 轴的多个 Y 轴。当你想在单个图表中显示分布在不同的\
  \ Y 尺度上但具有相同 X 值的不同系列时，这非常有用。在这种情况下，明智的做法是将 Y 轴设置为对应系列的颜色，以便你可以确定任何给定点的正确 Y 值。作为输入数据，让我们创建三个数据数组，它们包含相同的\
  \ X 值，但 Y 值分布在不同的范围内，如代码清单 4-22 所示。使用相同的 X 值不是强制性的，但这样做是明智的。\n\n***代码清单 4-22***。Ch4_12.html\n\
  \n```\nvar data1 = [[10, 200], [20, 230], [30, 214], [40, 212], [50, 225], [60,\
  \ 234]];\nvar data2 = [[10, 455], [20, 470], [30, 465], [40, 432], [50, 455], [60,\
  \ 464]];\nvar data3 = [[10, 40], [20, 60], [30, 54], [40, 52], [50, 65], [60, 54]];\n\
  ```\n\n\n\n为了能够轻松比较不同的数值序列，为每个 y 轴指定正确的取值范围非常重要（参见清单 4-23）。在`series`对象中，你需要显式指定三个值，每个值将一个序列分配给不同的\
  \ y 轴。如果你想保留某个特定序列的默认设置（即沿默认 y 轴显示），你仍然必须在该序列对应的位置分配一个空对象`{}`。实际上，在本例中，`series`数组的第一个元素就是一个空对象`{}`。\n\
  \n***清单 4-23***。`Ch4_12.html`\n\n```\nvar options = {\n    series:[\n      {},\n\
  \      {yaxis: 'y2axis'},\n      {yaxis: 'y3axis'}\n    ],\n    axesDefaults:{useSeriesColor:\
  \ true},\n    axes:{\n       xaxis: {min: 0, max: 70},\n       yaxis: {min: 190,\
  \ max: 240},\n       y2axis: {min: 430, max: 480},\n       y3axis: {min: 35, max:\
  \ 80}\n    }\n};\n$.jqplot ('myChart', [data1, data2, data3], options);\n```\n\n\
  此外，你需要为`axesDefaults`对象设置`useSeriesColor`属性为`'true'`。这样做之后，jqPlot 会将序列的颜色分配给对应的\
  \ y 轴。因此，通过使用三种默认颜色，第一个序列将显示为浅蓝色，第二个为橙色，第三个为灰棕色。\n\n图 4-22 展示了这三个序列，每个序列都根据其 y 轴的值进行表示。这些轴在此处以不同的灰度显示，但实际上它们会呈现与相关序列对应的颜色。\n\
  \n![9781484208632_Fig04-22.jpg](img/9781484208632_Fig04-22.jpg)\n\n图 4-22。具有多个 y\
  \ 轴的多序列折线图\n\n## 使用 JavaScript 处理数据\n\n如前所述，最好在`jqPlot`函数外部单独定义数据数组。你已经了解了如何创建包含数值（y\
  \ 值或`[x, y]`对）的数组。然而，由于 jqPlot 属于 JavaScript 世界，还有另一种通常被证明非常有用的方法：通过 JavaScript\
  \ 方法生成数据序列。\n\n### 使用数学函数生成数据\n\njqPlot 库基于 JavaScript，并且与所有编程语言一样，它允许你实现生成值序列作为输入数据的函数。例如，清单\
  \ 4-24 使用了三个最常用且最著名的数学函数（正弦、余弦、幂），并通过它们创建了一个数据数组。\n\n***清单 4-24***。`Ch4_08a.html`\n\
  \n```\n$(document).ready(function(){\n    var options = {\n       title:'Math function\
  \ Arrays'\n    };\n\nvar cosPoints = [];\n    for (var i=0; i< 2 * Math.PI; i +=\
  \ 0.1){\n       cosPoints.push([i, Math.cos(i)]);\n    }\n\nvar sinPoints = [];\n\
  \    for (var i=0; i< 2 * Math.PI; i += 0.1){\n       sinPoints.push([i, 2 * Math.sin(i-.8)]);\n\
  \    }\n\nvar powPoints = [];\n    for (var i=0; i< 2 * Math.PI; i += 0.1) {\n \
  \      powPoints.push([i, 2.5 + Math.pow(i/4, 2)]);\n    }\n\n$.jqplot ('myChart',\
  \ [cosPoints, sinPoints, powPoints], options);\n});\n```\n\n图 4-23 展示了清单中三个函数生成的点如何在折线图上形成这三个数学函数的特征趋势。\n\
  \n![9781484208632_Fig04-23.jpg](img/9781484208632_Fig04-23.jpg)\n\n图 4-23。一个折线图，展示了由数学函数生成的三组不同的数据序列\n\
  \n由于这是一个点密度很高的函数，并且目标是突出趋势，因此最好不要显示标记点（参见图 4-24）。同时，最好在`options`中启用平滑处理，如清单 4-25\
  \ 所示。\n\n![9781484208632_Fig04-24.jpg](img/9781484208632_Fig04-24.jpg)\n\n\n\n图\
  \ 4-24. 同一折线图，但渲染得更清晰易读\n\n***代码清单 4-25***. `Ch4_08b.html`\n\n```\nvar options =\
  \ {\n    title: '数学函数数组',\n    seriesDefaults: {\n       rendererOptions: {\n  \
  \        smooth: true\n       },\n       markerOptions: { show: false }\n    }\n\
  };\n```\n\n## 生成随机数据\n\n您刚刚了解了如何通过数学函数生成输入数据。同样地，有时也需要生成随机数据。例如，假设您刚刚编写完 `jqPlot`\
  \ 图表，想尝试输入一些模拟数据。为此，最好使用随机生成的数据。代码清单 4-26 中的函数会生成随机数据，每个数据点都根据前一个点的值生成。每一步中，新值由加到前一个数或从前一个数中减去的随机数决定。这会生成一个连续的数据序列，其起始值作为参数传递给该函数。\n\
  \n***代码清单 4-26***. `Ch4_09.html`\n\n```\nfunction generateRandomData(npts, start,\
  \ delta) {\n    var data = [];\n    if (delta == null) {\n       delta = start;\n\
  \       start = (Math.random() - 0.5) * 2 * delta;\n    }\n    for (j=0; j<npts;\
  \ j++) {\n       data.push([j, start]);\n       start += (Math.random() - 0.5) *\
  \ 2 * delta;\n    }\n    return data;\n}\n```\n\n您使用了三个参数：`npts` 是要生成的数据点数量，`start`\
  \ 是起始值，`delta` 是每一步随机增加或减少的最大值。该函数返回一个数组，该数组将作为输入数据传递给图表。您可以在外部定义它：\n\n```\nvar\
  \ data = generateRandomData(30, 100, 1);\n$.jqplot('myChart', [data]);\n```\n\n\
  或者，您也可以直接传递它：\n\n```\n$.jqplot ('myChart', [makeContinuousData(30, 100, 1)]);\n\
  ```\n\n结果，您会得到类似图 4-25 所示的图表（每次都会不同）。\n\n![9781484208632_Fig04-25.jpg](img/9781484208632_Fig04-25.jpg)\n\
  \n图 4-25. 表示随机数据序列的折线图\n\n## 处理日期值\n\n一种常用的值类型是日期类型，尤其是在其他图表（例如柱状图）中。这些特殊值处理起来并不容易，`jqPlot`\
  \ 为此提供了一个插件：`DateAxisRenderer`。该插件扩展了 JavaScript 原生的日期处理能力，允许您以任何明确的形式表示日期值，而不仅仅是毫秒。\n\
  \n### `DateAxisRenderer` 插件\n\n日期有多种表示方式，其格式因国家和用途而异。日期由日、月、年指示符组成。这些指示符可以按不同顺序排列，可以使用一位、两位或四位数字；或者，您甚至可能只想使用其中一两个指示符（例如，月、年）。此外，各种字符用作分隔符。例如，以\
  \ `04/07/2012` 为例：“4”代表第四个月（四月），“7”代表该月的第七天，“2012”代表年份。这样的日期可以有多种显示方式：`'07/04/2012'`、`'07/04/12'`、`'04/07/12'`、`'7-Apr-12'`、`'7-Apr'`、`'Apr-12'`、`'7\
  \ April'`、`'2012'` 等等。\n\n日期值的标准格式如下：\n\n```\n'YYYY-MM-DD HH:MM<PM or AM>'\n```\n\
  \n这个字符串包含了所有必要的信息——也许有点太多了。实际上，您通常只需要日期信息的一部分：有时，您可能只需要报告日和月，或者，如果涉及时间，您可能只需要处理小时和分钟，等等。\n\
  \n一旦包含了 `DateAxisRenderer` 插件，`jqPlot` 几乎可以接受任何可识别的值。在内部解析该值后，它将在您调用该插件的轴上渲染，并以\
  \ `tickOptions.formatString` 中指定的格式呈现。\n\n表 4-1 显示了可接受的格式代码。\n\n表 4-1. `jqPlot`\
  \ 接受的日期和时间格式\n\n| 代码 | 结果 | 描述 |\n| --- | --- | --- |\n| **年份** |   |   |\n| `%Y`\
  \ | 2008 | 四位数的年份 |\n| `%y` | 08 | 两位数的年份 |\n| **月份** |   |   |\n| `%m` | 09 | 两位数的月份\
  \ |\n| `%#m` | 9 | 一位或两位数的月份 |\n| `%B` | September | 完整的月份名称 |\n| `%b` | Sep | 缩写的月份名称\
  \ |\n| **日** |   |   |\n| `%d` | 05 | 两位数的月份中的日期 |\n| `%#d` | 5 | 一位或两位数的月份中的日期\
  \ |\n| `%e` | 5 | 一位或两位数的月份中的日期 |\n| `%A` | Sunday | 完整的星期几名称 |\n| `%a` | Sun |\
  \ 缩写的星期几名称 |\n| `%w` | 0 | 星期几的数字（0 = 星期日，6 = 星期六） |\n| `%o` | th | 月份中日期后的序数后缀字符串\
  \ |\n| **小时** |   |   |\n| `%H` | 23 | 24 小时制的小时（两位数） |\n| `%#H` | 3 | 24 小时制整数格式的小时（一位或两位数）\
  \ |\n| `%I` | 11 | 12 小时制的小时（两位数） |\n| `%#I` | 3 | 12 小时制整数格式的小时（一位或两位数） |\n| `%p`\
  \ | `pm` | `AM` 或 `PM` |\n| **分钟** |   |   |\n| `%M` | 09 | 分钟（两位数） |\n| `%#M` |\
  \ 9 | 分钟（一位或两位数） |\n| **秒** |   |   |\n| `%S` | 02 | 秒（两位数） |\n| `%#S` | 2 | 秒（一位或两位数）\
  \ |\n| `%s` | 1206567625723 | Unix 时间戳（自 1970-01-01 00:00:00 以来的秒数） |\n| **毫秒**\
  \ |   |   |\n| `%N` | 008 | 毫秒（三位数） |\n| `%#N` | 8 | 毫秒（一位到三位数） |\n| **时区** |  \
  \ |   |\n| `%O` | 360 | 本地时间与格林威治标准时间 (GMT) 之间的分钟差 |\n| `%Z` | Mountain Standard\
  \ Time (MST) | 时区名称，由浏览器报告 |\n| `%G` | –06:00 | 与 GMT 之间的小时和分钟差 |\n| **快捷方式** |\
  \   |   |\n| `%F` | 2008-03-26 | `%Y-%m-%d` |\n| `%T` | 05:06:30 | `%H:%M:%S` |\n\
  | `%X` | 05:06:30 | `%H:%M:%S` |\n| `%x` | 03/26/08 | `%m/%d/%y` |\n| `%D` | 03/26/08\
  \ | `%m/%d/%y` |\n| `%#c` | Wed Mar 26 15:31:00 2008 | `%a %b %e %H:%M:%S %Y` |\n\
  | `%v` | 3-Sep-2008 | `%e-%b-%Y` |\n| `%R` | 15:31 | `%H:%M` |\n| `%r` | 3:31:00\
  \ PM | `%I:%M:%S %p` |\n| **字符** |   |   |\n| `%n` | \\n | 换行 |\n| `%t` | \\t |\
  \ 制表符 |\n| `%%` | % | 百分号 |\n\n为了更清楚地了解 `jqPlot` 如何处理日期值，让我们看一系列说明各种格式的示例。但是，无论格式如何，您都必须始终在网页的\
  \ `<head>` 部分包含 `DateAxisRenderer` 插件。\n\n```\n<script type=\"text/javascript\"\n\
  \    src=\"../src/plugins/jqplot.dateAxisRenderer.min.js\"></script>\n```\n\n###\
  \ 处理不同格式的日期值\n\n第一个示例处理一段时间内的汇率，数据点为逐日值。为此，输入数据数组内部应包含一系列 `[x, y]` 值，其中 `x` 是日期值。`x`\
  \ 值的序列不必符合时间顺序；`jqPlot` 会沿 x 轴对这些点进行排序。在代码清单 4-27 中，您使用了一系列 `x` 输入值，前五个采用了不同的格式。\n\
  \n***代码清单 4-27***. `Ch4_13a.html`\n\n```\nvar line1 = [['14-Oct-2012', 1300.41],\
  \ ['2012-10-15', 1310.50],\n             ['2012/10/16', 1322.88], ['17 Oct 2012',\
  \ 1312.41],\n             ['10/18/2012', 1308.16], ['19-Oct-2012', 1310.71],\n \
  \            ['20-Oct-2012', 1305.01],['21-Oct-2012', 1300.85],\n             ['22-Oct-2012',\
  \ 1290.67]];\n```\n\n\n\n接下来，你需要在 `options` 的 `xaxis` 对象中调用渲染器来激活它。你希望表示月份中的日期，以便跟踪汇率走势，因此将设置输出格式，不包含年份（年份保持不变）。此外，在开头，你希望以数字形式显示月份中的日期，然后显示月份的前三个字符，两者之间用空格分隔。简单来说，在清单\
  \ 4-28 中，格式将是 `'%d %b'`，其中 `%d` 代表数字形式的日期，`%b` 代表月份的前三个字符。`y` 值是美元，因此你需要为 `y` 轴的刻度添加美元符号（`$`）作为前缀。为此，你也必须为\
  \ `y` 轴刻度使用 `formatString` 属性。\n\n**清单 4-28**. Ch4_13a.html\n\n```\nvar options\
  \ = {\n    title: 'Handling Date Values',\n    axes:{\n       xaxis:{\n        \
  \  renderer: $.jqplot.DateAxisRenderer,\n          tickOptions:{\n             formatString:'%d\
  \ %b'\n          }\n       },\n       yaxis:{\n          tickOptions:{\n       \
  \      formatString:'$%d'\n          }\n       }\n    }\n};\n$.jqplot('myChart',\
  \ [line1], options);\n```\n\n图 4-26 显示了 `y` 轴上带有前缀 `$` 的美元值，以及 `x` 轴上的日期和月份。这只是你可以设置用来表示刻度值的几种格式之一。\n\
  \n![9781484208632_Fig04-26.jpg](img/9781484208632_Fig04-26.jpg)\n\n图 4-26. 在 `x`\
  \ 轴上带有日期值的折线图\n\n## 处理时间值\n\n假设你想绘制一个表示博物馆参观人数的图表。可以在输入数据中明确指定时间（小时、分钟、秒）。这样你就可以像之前的示例（参见清单\
  \ 4-27）一样处理这些时间值，例如，创建一个包含某一天收集的数据的图表。同样，日期可以使用之前讨论过的任何格式进行设置。你可以用多种方式表示时间：12 小时制，带有\
  \ `am` 或 `pm` 后缀；或者直接使用 24 小时制，可以包含或忽略秒和分钟。清单 4-29 展示了一个包含以 2 小时间隔的时间值序列的数组。\n\n\
  **清单 4-29**. Ch4_13b.html\n\n```\nvar line1 = [['2012-10-14 08:00AM', 30],['2012-10-14\
  \ 10:00AM', 60],\n             ['2012-10-14 00:00PM', 120], ['2012-10-14 02:00PM',\
  \ 60],\n             ['2012-10-14 04:00PM', 100], ['2012-10-14 06:00PM', 40]];\n\
  ```\n\n关于输出格式，你必须记得也要管理时间格式；因为你只对一天中的小时数感兴趣，所以将 `'%R'` 设置为 `'formatString'`（参见清单\
  \ 4-30）。\n\n**清单 4-30**. Ch4_13b.html\n\n```\nvar options = {\n    title: 'Museum\
  \ Visitors',\n    axes:{\n       xaxis:{\n          label: 'time',\n          renderer:$.jqplot.DateAxisRenderer,\n\
  \          tickOptions:{\n             formatString: '%R'\n          }\n       },\n\
  \       yaxis:{\n          label: 'visitors'\n       }\n    }\n};\n$.jqplot('myChart',\
  \ [line1], options);\n```\n\n浏览器将显示图 4-27 中的图表。\n\n![9781484208632_Fig04-27.jpg](img/9781484208632_Fig04-27.jpg)\n\
  \n图 4-27. 在 `x` 轴上带有时间值的柱状图\n\n## 高亮显示\n\n你可以为图表添加的一个引人注目的效果是高亮显示（即让图表对鼠标悬停做出反应）。例如，`Highlighter`\
  \ 插件会以漂亮的动态效果高亮显示鼠标附近的数据点。通过显示包含数据点值的工具提示，可以增强此效果。\n\n### 光标高亮器\n\n以下示例将帮助你熟悉高亮显示功能。此功能非常重要，它包括在鼠标悬停在图表中的特定元素上时激活一个事件。通常，这些元素是表示数据的元素，例如，在折线图中，这些元素由点（或者更准确地说，由标记）表示；你会看到这也适用于其他类型的图表：柱状图中的柱子、饼图中的扇区等。\n\
  \n默认情况下，触发的事件只是数据的高亮显示，通过一个显示其 (`x`, `y`) 值的工具提示来表示。\n\n要将这些功能添加到你的图表中，你必须包含一组插件：\n\
  \n```\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.highlighter.min.js\"\
  >\n</script>\n<script type=\"text/javascript\" src=\"../src/plugins/jqplot.cursor.min.js\"\
  >\n</script>\n```\n\n在清单 4-31 中，作为输入数据，你使用了一系列 [`x`, `y`] 对，其中 `x` 轴是日期值，`y` 轴是数值。\n\
  \n**清单 4-31**. Ch4_14a.html\n\n```\nvar line1 = [['14-Oct-12', 1300.41], ['15-Oct-12',\
  \ 1310.50],['16-Oct-12', 1322.88],\n             ['17-Oct-12', 1312.41],['18-Oct-12',\
  \ 1308.16],['19-Oct-12', 1310.71],\n             ['20-Oct-12', 1305.01],['21-Oct-12',\
  \ 1300.85],['22-Oct-12', 1290.67]];\n```\n\n正如你已经看到的，为了处理日期值，你需要包含 `DateAxisRenderer`\
  \ 插件。\n\n```\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.dateAxisRenderer.min.js\"\
  ></script>\n```\n\n在清单 4-32 中，你看到了 `options` 对象，其中包含两个新对象：`highlighter` 和 `cursor`。\n\
  \n**清单 4-32**. Ch4_14a.html\n\n```\nvar options = {\n    title: 'Data Point Highlighting',\n\
  \    axes:{\n       xaxis:{\n          renderer: $.jqplot.DateAxisRenderer,\n  \
  \        tickOptions:{\n             formatString: '%b&nbsp;%#d'\n          }\n\
  \       },\n       yaxis:{\n          tickOptions:{\n             formatString:\
  \ '$%d'\n          }\n       }\n    },\n    highlighter:{\n       show: true,\n\
  \       sizeAdjust: 7.5\n    },\n    cursor:{\n       show: false\n    }\n};\n```\n\
  \n在图 4-28 中，当光标移动到图表上的数据点时，会出现一个工具提示。默认情况下，此工具提示使用轴格式化程序报告 `x` 和 `y` 值，并用逗号分隔，但可以使用不同的格式字符串进行自定义。\n\
  \n![9781484208632_Fig04-28.jpg](img/9781484208632_Fig04-28.jpg)\n\n图 4-28. 折线图上的数据点高亮显示\n\
  \n在清单 4-32 中，你会注意到光标已被禁用，通过将其 `show` 属性设置为 `'false'`（默认情况下是启用的）。如清单 4-33 所示启用它，你会看到鼠标光标在进入图表区域时发生变化，并在右下角显示一个可选的工具提示，报告鼠标位置。该工具提示可以位于固定位置，也可以跟随鼠标移动。指针样式默认为\
  \ `'crosshair'`，也可以自定义。\n\n**清单 4-33**. Ch4_14b.html\n\n```\n    ...\n    highlighter:\
  \ {\n       show: true,\n       sizeAdjust: 7.5\n    },\n    cursor: {\n       show:\
  \ true,\n       tooltipLocation:'ne'\n    }\n});\n```\n\n图 4-29 显示了一个报告光标坐标的工具提示。请注意，光标在图表中间由一个黑色十字表示。\n\
  \n![9781484208632_Fig04-29.jpg](img/9781484208632_Fig04-29.jpg)\n\n图 4-29. 显示光标坐标的折线图\n\
  \n### 使用 HTML 格式的高亮显示\n\n\n\n你可以使用 HTML 标签作为格式来更改工具提示的内容。这使得自定义的可能性几乎无限。实际上，你可以将工具提示视为一个小型网页，在其中添加任何类型的元素，例如图像或锚点链接（更多详情，请参见第\
  \ 5 章）。例如，你可以使用代码清单 4-34 中所示的设置，将一个 HTML 格式字符串分配给 `formatString` 属性。\n\n***代码清单\
  \ 4-34***. Ch4_14c.html\n\n```\nhighlighter: {\n    show: true,\n    sizeAdjust:\
  \ 7.5,\n    showMarker: false,\n    tooltipAxes: 'xy',\n    yvalues: 4,\n    formatString:'<table\
  \ class=\"jqplot-highlighter\"> \\\n                  <tr><td>date:</td><td>%s</td></tr>\
  \ \\\n                  <tr><td>value:</td><td>%s</td></tr></table>'\n},\n```\n\n\
  结果，带有内容的工具提示将像一个小型 HTML 页面一样运行，如图 4-30 所示。\n\n![9781484208632_Fig04-30.jpg](img/9781484208632_Fig04-30.jpg)\n\
  \n图 4-30. 带有 HTML 工具提示的折线图\n\n## 与图表交互：限制线和缩放\n\n一旦你拥有一个图形和元素设置良好的折线图，下一步就是引入交互元素。例如，用户可能需要使用阈值来查看哪些数据超出了这些值。用户可能还需要改变这个阈值，以确定哪些数据在阈值之内，哪些在阈值之外。通常，会表示大量数据。在这种情况下，用户可能只需要分析一个细节。\n\
  \njqPlot 库通过限制线和缩放为这两种情况提供了解决方案。让我们详细看一些解决这些问题的示例。\n\n### 在图表上绘制限制线\n\n另一个非常有用的功能是\
  \ `CanvasOverlay` 插件。它允许你在图表上绘制水平线和垂直线，目的是指示一个限制、阈值、截止日期或划定一个特定范围。这可以通过在网页中包含 `CanvasOverlay`\
  \ 插件来实现：\n\n```\n<script type=\"text/javascript\"\n    src=\"../src/plugins/jqplot.canvasOverlay.min.js\"\
  ></script>\n```\n\n通过包含此插件，你在 `options` 中获得了一个新对象：`canvasOverlay`。在此对象中，你将定义一个对象数组及其属性。这些对象中的每一个都将由绘制在画布上的一条线表示，jqPlot\
  \ 在该画布上创建你的图表。`canvasOverlay` 中已经定义了五种类型的对象：\n\n*   `horizontalLine`\n*   `verticalLine`\n\
  *   `dashedHorizontalLine`\n*   `dashedVerticalLine`\n*   `Line (通用)`\n\n要了解如何将这些限制线插入到你的图表中，让我们从一个简单的折线图开始，你希望在该图表中显示两条不同颜色的水平限制线：一条标记上限的红色线和一条标记下限的蓝色虚线。\n\
  \n在代码清单 4-35 中，你定义了两个对象：一个用于下限的 `horizontalLine` 和一个用于上限的 `dashedHorizontalLine`。定义了两条线之后，你必须指定它们的属性。它们的属性（例如\
  \ y 值、`lineWidth` 和 `color`）的含义是显而易见的。`lineCap` 属性指定了线条末端的类型；它可以是 `round`、`butt`\
  \ 或 `square`。\n\n***代码清单 4-35***. Ch4_15.html\n\n```\n$(document).ready(function(){\n\
  \    var data = [100, 110, 140, 130, 80, 75, 120, 130, 100];\n    var options =\
  \ {\n       canvasOverlay: {\n          show: true,\n          objects: [\n    \
  \      {horizontalLine: {\n              y: 70,\n              lineWidth: 3,\n \
  \             color: 'rgb(255, 0, 0)',\n              shadow: true,\n          \
  \    lineCap: 'butt'\n          }},\n          {dashedHorizontalLine: {\n      \
  \        y: 145,\n              lineWidth: 4,\n              color: 'rgb(0, 0, 255)',\n\
  \              shadow: false,\n              dashPattern: [8, 16],\n           \
  \   lineCap: 'round'\n          }}\n          ]\n       }\n    };\n    $.jqplot('myChart',\
  \ [data], options);\n});\n```\n\n图 4-31 显示了在值 70 和 145 之间划定折线图范围的两条限制线。\n\n![9781484208632_Fig04-31.jpg](img/9781484208632_Fig04-31.jpg)\n\
  \n图 4-31. 带有下限和上限的折线图\n\n你刚刚看到了如何在两条限制线之间划定折线图的范围。在更复杂的情况下（但本例并非如此，这种情况不太常见），改变这些限制线的值，从而能够随意移动它们可能会很方便，例如，通过点击一系列按钮。在下一个示例中，你将通过添加用于在图表表面滑动限制线的按钮，继续实现当前图表。\n\
  \n### 向图表添加按钮\n\n使用前面的示例（参见代码清单 4-35），你现在将看到如何向图表添加按钮。按钮可以放置在网页的任何部分，因为它们位于画布之外。在这里，它们的功能是允许你通过点击按钮随意移动限制线。\n\
  \n为此，你将需要四个按钮：两个用于向上移动限制线，两个用于向下移动限制线，标签如下：\n\n*   下限上移\n*   下限下移\n*   上限上移\n* \
  \  上限下移\n\n你可以将代码清单 4-36 中定义的四个按钮添加到网页 `<body>` 部分的任何位置。\n\n***代码清单 4-36***. Ch4_16.html\n\
  \n```\n<div>\n    <button onclick=\"lineup(myPlot, 'lowlimit')\">下限上移</button>\n\
  \    <button onclick=\"linedown(myPlot, 'lowlimit')\">下限下移</button>\n</div>\n<div>\n\
  \    <button onclick=\"lineup(myPlot, 'hilimit')\">上限上移</button>\n    <button onclick=\"\
  linedown(myPlot, 'hilimit')\">上限下移</button>\n</div>\n```\n\n这些行将生成图 4-32 中所示的四个按钮。\n\
  \n![9781484208632_Fig04-32.jpg](img/9781484208632_Fig04-32.jpg)\n\n图 4-32. 为移动限制线而添加到图表中的按钮\n\
  \n在第 2 章中，你了解了可用作控件的 jQuery 用户界面库（jQuery UI）小部件。鉴于这类控件的潜力，建议使用该库提供的按钮小部件（有关如何使用这些小部件的更多信息，请参见第\
  \ 10 章）。如果你想使用 jQuery UI 小部件来替换这四个按钮，你需要包含以下插件：\n\n```\n<link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/ui/1.10.3/themes/smoothness\n    /jquery-ui.css\"\
  \ />\n<script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n\
  ```\n\n但是，如果你更愿意引用本地安装的库（参见附录 A），则必须包含以下代码：\n\n```\n<link rel=\"stylesheet\" href=\"\
  ../src/css/smoothness/jquery-ui-1.10.3.custom.min.css\" />\n<script src=\"../src/js/jquery-ui-1.10.3.custom.min.js\"\
  ></script>\n```\n\n并且，在 HTML 页面的 `<body>` 部分，添加代码清单 4-37 中的代码。\n\n***代码清单 4-37***.\
  \ Ch4_16.html\n\n\n\n```html\n<script>\n$(function() {\n    $('button')\n      \
  \ .button()\n       .click(function(event) {\n          event.preventDefault();\n\
  \       });\n});\n</script>\n```\n\n现在，按钮以 jQuery UI 样式显示（或者更准确地说，使用了众多主题中的“平滑”主题），如图\
  \ 4-33 所示。\n\n![9781484208632_Fig04-33.jpg](img/9781484208632_Fig04-33.jpg)\n\n\
  图 4-33。相同的四个按钮，但使用 jQuery UI 显示\n\n此时，这些按钮完全处于非活动状态。你需要开发两个 JavaScript 函数；当按下按钮时，这些函数将被执行。第一个函数\
  \ `lineup()` 将增加作为参数传递的线条的 `y` 值（上限或下限），然后强制重新绘制图表。第二个函数 `linedown()` 将减小 `y` 值。这两个函数必须位于\
  \ jQuery 函数 `$(document).ready()` 外部（参见清单 4-38）。\n\n***清单 4-38***。Ch4_16.html\n\n\
  ```\nfunction lineup(plot, name) {\n    var co = plot.plugins.canvasOverlay;\n \
  \   var line = co.get(name);\n    line.options.y += 5;\n    co.draw(plot);\n}\n\n\
  function linedown(plot, name) {\n    var co = plot.plugins.canvasOverlay;\n    var\
  \ line = co.get(name);\n    line.options.y -= 5;\n    co.draw(plot);\n}\n```\n\n\
  下一步是将 `$.jqplot()` 函数返回的对象赋值给一个变量：\n\n```\nmyPlot = $.jqplot('myChart', [data],\
  \ options);\n```\n\n![Image](img/sq.jpg) **注意** 注意不要写成 `var myPlot`，否则按下按钮时你将看不到图表有任何变化。\n\
  \n最后一步是命名 `canvasOverlay` 对象内的两条线条，如清单 4-39 所示。\n\n***清单 4-39***。Ch4_16.html\n\n\
  ```\nobjects: [\n    {horizontalLine: {\n       name: 'lowlimit',\n       y: 70,\n\
  \       lineWidth: 3,\n       color: 'rgb(255, 0, 0)',\n       shadow: true,\n \
  \      lineCap: 'butt'\n    }},\n    {dashedHorizontalLine: {\n       name: 'hilimit',\n\
  \       y: 145,\n       lineWidth: 4,\n       color: 'rgb(0, 0, 255)',\n       shadow:\
  \ false,\n       dashPattern: [8, 16],\n       lineCap: 'round'\n    }}\n]\n```\n\
  \n最终，你会得到一个包含四个按钮的图表，如图 4-34 所示。\n\n![9781484208632_Fig04-34.jpg](img/9781484208632_Fig04-34.jpg)\n\
  \n图 4-34。一个带有可改变上下阈值按钮的折线图\n\n有时，你需要向图表中添加垂直线，尤其是在需要标记截止日期时。在这种情况下，我们将采用类似的方法，但会有些不同。例如，假设你想在折线图中放置一条代表截止日期的单条垂直线。在这种情况下，你可以使用清单\
  \ 4-40 中的代码。\n\n***清单 4-40***。Ch4_17.html\n\n```\n$(document).ready(function(){\n\
  \    var data = [100, 110, 140, 130, 80, 75, 120, 130, 100];\n    var options =\
  \ {\n       canvasOverlay: {\n          show: true,\n          objects: [\n    \
  \      {verticalLine: {\n             name: 'lowlimit',\n             x: 5,\n  \
  \           lineWidth: 3,\n             color: 'rgb(50, 200, 50)',\n           \
  \  shadow: true,\n             lineCap: 'butt',\n             yOffset: 0\n     \
  \     }}\n          ]\n       }\n    };\n    myPlot = $.jqplot('myChart', [data],\
  \ options);\n});\n```\n\n这次，你只需要两个按钮。\n\n```\n<div>\n    <button onclick=\"lineright(myPlot,\
  \ 'lowlimit')\">推迟截止日期</button>\n    <button onclick=\"lineleft(myPlot, 'lowlimit')\"\
  >提前截止日期</button>\n</div>\n```\n\n现在，你必须开发两个 JavaScript 函数，当按下按钮时，这些函数将水平移动限制线。与之前看到的\
  \ JavaScript 函数一样，清单 4-41 中的两个函数必须放置在 jQuery 函数 `$(document).ready()` 外部。\n\n***清单\
  \ 4-41***。Ch4_17.html\n\n```\nfunction lineright(plot, name) {\n    var co = plot.plugins.canvasOverlay;\n\
  \    var line = co.get(name);\n    line.options.x += 1;\n    co.draw(plot);\n}\n\
  \nfunction lineleft(plot, name) {\n    var co = plot.plugins.canvasOverlay;\n  \
  \  var line = co.get(name);\n    line.options.x -= 1;\n    co.draw(plot);\n}\n```\n\
  \n结果如图 4-35 所示，图表中间有一条绿色的垂直线。通过点击两个按钮，该线条将向左移动（如果你想提前截止日期）或向右移动（如果你想推迟截止日期）。\n\n\
  ![9781484208632_Fig04-35.jpg](img/9781484208632_Fig04-35.jpg)\n\n图 4-35。一个带有绿色水平限制线的折线图\n\
  \n## 缩放\n\n通常，当你处理大量数据时，最终图表上的线条会由数千个点组成。正是在这种情况下，缩放功能变得不可或缺。从宏观视图开始，你可以放大线条的某一部分，以获得数据的微观视图。\n\
  \n`Cursor` 插件也启用了图表缩放功能。通过在图表上单击并拖动光标，你可以放大并滚动图表的较小区域。如果双击，你可以重置所有内容并返回宏观视图。因此，你需要在网页中包含\
  \ `Cursor` 插件，并且由于 `x` 轴上有日期值，因此还必须包含 `DateAxisRenderer` 插件：\n\n```\n<script type=\"\
  text/javascript\"\n    src=\"../src/plugins/jqplot.dateAxisRenderer.min.js\"></script>\n\
  <script type=\"text/javascript\" src=\"../src/plugins/jqplot.cursor.min.js\"></script>\n\
  ```\n\n或者，如果你更喜欢使用 CDN 服务，可以按如下方式操作：\n\n```\n<script type=\"text/javascript\" src=\"\
  http://cdn.jsdelivr.net/jqplot/1.0.8/plugins\n    /jqplot.dateAxisRenderer.min.js\"\
  ></script>\n<script type=\"text/javascript\"\n    src=\"http://cdn.jsdelivr.net/jqplot/1.0.8/plugins/jqplot.cursor.min.js\"\
  ></script>\n```\n\n清单 4-42 展示了大量传入数据的可用性。\n\n***清单 4-42***。Ch4_18.html\n\n\n\n```\n\
