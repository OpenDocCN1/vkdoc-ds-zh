  \n图 11-1. 一个包含三个选项卡的页面，每个选项卡内含有不同的图表\n\n## 在折叠面板中使用 jqPlot 图表\n\n另一种常用的 jQuery 容器是*折叠面板*。这次，您将把前面的三个图表放入折叠面板中。网页需要包含的插件列表与上一个示例相同。您需要对\
  \ CSS 样式进行一些修改；折叠面板有特定的 CSS 类，需要指定其属性。这些内容如代码清单 11-7 所示。\n\n***代码清单 11-7***. ch11_02.html\n\
  \n```css\n<style type=\"text/css\">\n.ui-accordion {\n    width: 690px;\n    margin:\
  \ 2em auto;\n}\n.ui-accordion-header {\n    font-size: 12px;\n}\n.ui-accordion-content\
  \ {\n    font-size: 14px;\n}\n.jqplot-target {\n    font-size: 18px;\n}\nol.description\
  \ {\n    list-style-position: inside;\n    font-size: 15px;\n    margin: 1.5em auto;\n\
  \    padding: 0 15px;\n    width: 600px;\n}\n.section {\n      width: 400px;\n \
  \     height: 200px;\n      margin-top: 20px;\n      margin-left: 20px;\n}\n</style>\n\
  ```\n\n与上一个示例一样，您必须创建 jQueryUi 小部件。可以通过调用 `accordion()` 函数来实现：\n\n```javascript\n\
  $(\"#accordion\").accordion();\n```\n\n您还需要将此折叠面板绑定到您的图表上，如代码清单 11-8 所示。当您选择一个折叠面板选项卡时，该事件会通过调用\
  \ `replot()` 函数确保相应的图表在其中被重新绘制。\n\n***代码清单 11-8***. ch11_02.html\n\n```javascript\n\
  $('#accordion').bind('accordionchange', function(event, ui) {\n    var index = $(this).find(\"\
  h3\").index ( ui.newHeader[0]);\n    if (index === 0) {\n       plot1.replot();\n\
  \    }\n    else if (index === 1) {\n       plot2.replot();\n    }\n    else if\
  \ (index === 2) {\n       plot3.replot();\n    }\n});\n```\n\n\n\n如您所见，定义手风琴的方式与定义选项卡非常相似。同样，您现在需要定义将在\
  \ HTML 代码中转换为手风琴选项卡的 `<div>` 元素（请参阅清单 11-9）。\n\n***清单 11-9***。 `ch11_02.html`\n\n\
  ```\n<div id=\"accordion\" style=\"margin-top:50px\">\n  <h3><a href=\"#\">第 1 部分</a></h3>\n\
    <div>\n    <p>这是柱状图</p>\n    <div class=\"section\" id=\"chart1\" data-height=\"\
  200\" data-width=\"400\"></div>\n  </div>\n\n<h3><a href=\"#\">第 2 部分</a></h3>\n\
    <div>\n    <p>这是多系列折线图</p>\n    <div class=\"section\" id=\"chart2\" data-height=\"\
  200\" data-width=\"400\"></div>\n  </div>\n\n<h3><a href=\"#\">第 3 部分</a></h3>\n\
    <div>\n    <p>这是饼图</p>\n    <div class=\"section\" id=\"chart3\" data-height=\"\
  200\" data-width=\"400\"></div> </div>\n</div>\n```\n\n如图 11-2 所示，结果与之前类似，但这次是通过垂直滑动手风琴选项卡来替换不同的图表。\n\
  \n![9781484208632_Fig11-02.jpg](img/9781484208632_Fig11-02.jpg)\n\n图 11-2。包含三个图表的手风琴小部件\n\
  \n## 可调整大小和可拖动的图表\n\n您可以在图表中广泛利用的另外两个功能是允许用户调整容器区域的大小和拖动容器区域。网页中的可调整大小框架允许您任意更改其大小及其包含的对象的大小。此功能可以与页面内拖动元素的功能相结合，从而使它们能够占据相对于原始位置的不同位置。\n\
  \n除了使页面布局具有流动性之外，当您希望用户交互式地管理页面上不同框架所占用的空间时，此功能有时也很有用（请参阅图 11-3）。\n\n![9781484208632_Fig11-03.jpg](img/9781484208632_Fig11-03.jpg)\n\
  \n图 11-3。将图表封装在 jQueryUI 容器中，您可以调整其大小并在页面上移动它们\n\n在本节中，您将看到两个示例。在第一个示例中，您将重点介绍应用于折线图的调整大小操作。您将看到调整包含在容器中的图表大小是多么容易。在第二个示例中，您将通过添加另外两个折线图来进一步扩展该示例。一旦为所有三个图表启用了可拖动属性，您将看到如何根据自己的喜好更改它们的位置，甚至交换它们。\n\
  \n### 可调整大小的折线图\n\n在此示例中，您将使用一个简单的折线图。因此，您将不再需要包含所有 jqPlot 插件，除了 jQuery 容器和基本 jqPlots\
