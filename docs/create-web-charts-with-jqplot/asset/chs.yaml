  \n## 完成工作空间\n\n设置好 Aptana Studio 工作空间并创建项目后，您就完成了工作空间的配置。\n\n让我们打开文档根目录，并创建一个名为\
  \ `src` 的新目录。现在，您将在整本书中使用的工作空间由两个目录组成：\n\n*   `src`\n*   `charts`\n\n`src` 目录应包含所有与库相关的文件。\n\
