- '# 5. 民主被黑，第一部分


  俄罗斯干预与新冷战


  社交媒体为活动人士群体以及极端分子和施虐者群体提供了发现彼此并协调行动的能力。同样的工具可以被合法社群以及不诚实的参与者——甚至是试图干涉他国选举进程的外国政府——用来传播政治信息。这就是我们今天所处的环境，美国、北约、欧盟及其（潜在）盟友正受到俄罗斯信息战运动的攻击。在本章中，我们将解析他们的一些行动，这些行动在
  2016 年美国总统大选中达到高潮，最后我们将展望未来的威胁与防御措施。


  ## 发生了什么？


  2018 年 11 月 8 日。数亿美国人——以及世界各地的许多人——观看了美国总统大选结果的揭晓。赔率和民调都指向希拉里·克林顿的胜利。问题仅仅是胜利的规模有多大，以及她的政党是否也能控制国会。


  当然，结果并非如此。尽管克林顿赢得了普选票，但唐纳德·特朗普在关键的摇摆州获胜，这使他在选举人团中占得先机，成为美国第 45 任总统。


  几乎在他被主要新闻网络宣布为推定获胜者之后，专家和学者们就开始问："发生了什么？" 即使是一些支持特朗普胜过克林顿的人也对他的胜利感到惊讶。矛头迅速指向了民调机构及其方法——这些方法仍在为互联网和智能手机时代（而不是每个家庭一部固定电话的时代）进行更新。他们还指向了主流媒体中被认为存在的偏见，这些偏见从单一角度进行报道，而对其他角度视而不见。许多对两党制及主要政党提名人感到不满的选民要么待在家里，要么投票给第三方候选人，这引来了部分民主党人的愤怒。而且，与获胜候选人输掉普选票时常见的情况一样，有人呼吁废除选举人团制度。


  但对许多人来说，责任主要在于希拉里·克林顿本人。不仅旧丑闻挥之不去——班加西事件、她对比尔担任总统期间性行为不当指控的回应、她作为全民医保过去支持者的"社会主义"倾向——而且新丑闻不断出现。她使用私人电子邮件服务器处理国务院公务，这表明她存在安全风险。该服务器上丢失的电子邮件必定包含机密信息（这将是违法的）或涉及其他邪恶活动的证据。私人通信显示，民主党全国委员会采取措施，确保更温和的克林顿赢得党内提名，而非民主社会主义者伯尼·桑德斯。大选前三周，时任
  FBI 局长詹姆斯·科米宣布司法部将重新调查克林顿的私人电子邮件服务器案。更不用说那些更边缘的谣言了——克林顿曾下令为她杀人，^(¹²⁸) 参与"灵性烹饪"，^(¹²⁹)
  或是一个大规模儿童性交易团伙的中心人物^(¹³⁰)——后者虽毫无根据，却导致一名男子持枪前往华盛顿特区的一家披萨店进行"调查"。（这些阴谋论没有一个完全消失。）结果，许多原本会在克林顿和特朗普之间支持克林顿的温和派和桑德斯支持者，要么投票给第三方，要么出于抗议而弃权，这至少部分导致了特朗普的胜利。


  虽然这些丑闻中有些至少包含一丝真相，且大多数曾被许多美国人真心诚意地传播，但在 2017 年，越来越清楚的是，还有其它力量在起作用。是的，克林顿似乎深陷丑闻泥潭，是的，特朗普似乎代表了许多"主流"记者和政治操盘手过于忽视的人和想法。但是，我们现在知道，并非所有这些都是自发的。有人黑进了
  DNC 服务器，窃取了克林顿竞选主席约翰·波德斯塔的电子邮件，并放大了其中包含的丑闻以及社交媒体上支持特朗普的运动。许多阴谋论，即使不是被创造的，也是由在多个社交媒体平台上运营假账号的不诚实操盘手传播和放大的。正如研究人员和美国情报界现在所同意的，所有迹象都指向一个主要罪魁祸首：俄罗斯。


  不幸的是，导致许多人沦为俄罗斯活动——以及同时发生的其他影响力行动——受害者的同样的缺乏细致辨别，也导致许多人要么将俄罗斯视为一个妖怪，为其不喜欢的任何叙事和政治胜利负责，要么将宣传问题廉价地归结为"俄罗斯[推特]机器人"并一笑了之。前者导致我们忽视了其他外国行为体以及国内不良行为者和普通公民在虚假信息传播中的作用。后者则导致我们彻底忽视了该问题的广度和严重性。


  ## 认识新战争，与（冷）战如出一辙


  现实情况是，俄罗斯声称自己处于"针对美利坚合众国"以及我们北约盟友的"信息战"状态。^(¹³¹) 多年来，俄罗斯一直利用网站、博客和社交媒体作为其针对美国、英国、欧盟、北约、乌克兰和叙利亚反对派的信息武库中的最新工具。他们的目标是扩大其"帝国"，^(¹³²)
  充实普京的"核心圈子"，削弱欧盟和北约，诋毁西方民主，并——至少在俄罗斯周边地区——推广一种非自由主义的伪民主，在这种民主下，少数腐败的寡头可以为了自身利益管理国家经济。^(¹³³)


  但俄罗斯并非唯一的参与者。俄罗斯在美国和欧洲扶持的极右翼民粹主义团体是真实存在的。引发这些反移民民粹主义者愤怒和行动的难民危机也是真实的——尽管俄罗斯在叙利亚等地的活动无疑加剧了这场危机。在俄罗斯介入并向这些群体伸出援手之前——如果他们确实需要的话——这些群体已经在各自国家内部产生了影响，并且无论他们可能从俄罗斯或其盟友那里得到什么帮助，他们继续拥有真实的影响力。


  还有其他国家利用在线宣传来推进其地缘政治目标。七个威权国家拥有影响力行动和宣传的预算，^(¹³⁴) 推特最近宣布发现了一起针对其平台上西方用户的伊朗行动。来自美国、英国和以色列的私营公司无疑是主要参与者。而玩家门（GamerGate）的喷子们也并未消失。


  在下文中，我们将审视这个新的战场，了解这场全球信息战的整体格局。参与者是谁，进行了哪些战斗，平台和政府如何回应，以及我们如何走到了 2016 年的境地——在那里，俄罗斯的影响力行动在美国总统选举中发挥了重要且可能具有决定性的作用。




  ### 乌克兰“分离主义者”


  要开始探究俄罗斯的在线虚假信息，没有比乌克兰更合适的地方了。根据兰德公司一项关于俄罗斯在乌克兰影响力行动的详尽研究，“2014 年吞并克里米亚，标志着俄罗斯网络宣传在世界舞台上的首次亮相。”¹³⁵
  为了与在乌克兰的军事行动以及旨在争取国际社会承认其入侵行为的外交行动相配合，俄罗斯在乌克兰境内外同时开展了信息战，旨在向克里米亚人、乌克兰人以及更广泛的国际社会强化“克里米亚属于俄罗斯”这一观念。


  兰德公司的研究发现，俄罗斯在克里米亚入侵事件周围的影响力行动存在几个重要方面。首先，他们针对的是克里米亚和乌克兰东部的俄罗斯族裔，其中许多人都是苏联时期移民的后代。俄语媒体在乌克兰的信息格局中仍占主导地位，俄方利用这一切入点来宣扬俄罗斯与乌克兰俄罗斯族裔之间的团结。这带来了三重好处：宣扬克里米亚的俄罗斯属性、在更广泛的乌克兰境内鼓励亲俄政治活动，以及支持亲俄的乌克兰分离主义运动（同时对这些分离主义者提供军事支持）。作为回应，乌克兰于
  2014 年部分封锁了俄罗斯媒体的访问权限，但截至 2017 年，俄罗斯社交媒体平台`VKontakte`仍然是乌克兰最受欢迎的网站，其次是美国所有的`Facebook`。¹³⁶


  俄罗斯还利用其如今标准化的“欧洲怀疑论”叙事来针对乌克兰人，以防止欧盟和/或北约扩张至俄罗斯的主要贸易伙伴之一，并直接推进到俄罗斯的西南边境。与这种欧洲怀疑论相伴而来的是关于乌克兰政治领导层腐败的叙事。俄罗斯媒体经常将乌克兰描绘成由白人至上主义法西斯分子统治的国家。¹³⁷
  当然，俄罗斯则被塑造成乌克兰稳定的邻国和朋友，是传统道德和基督教价值观的坚定捍卫者。


  在“远邦”——即那些与俄罗斯或历史上华约成员国不接壤的世界更遥远成员——俄罗斯则用多种语言推进叙事，呼应了其在更近地区传播的许多亲俄反乌信息。虽然俄罗斯在近处的目标是让乌克兰重回其势力范围（若非直接控制），其在全球的目标则主要是避免外部干预。通过渲染乌克兰腐败、俄罗斯美德、克里米亚在历史和民族属性上属于俄罗斯、煽动对全球冲突升级的恐惧，以及播撒对美、欧、北约的不信任，俄罗斯促使国际社会接受克里米亚的吞并，或至少不要进行干预。


  俄罗斯反乌克兰影响力行动中最典型的例子，或许涉及围绕 2014 年 7 月马来西亚航空 17 号班机空难编造的虚假叙事。尽管西方情报机构和荷兰主导的联合调查组得出结论，认为俄罗斯和/或俄罗斯支持的乌克兰分离主义者应对此负责，¹³⁸
  但俄罗斯利用这场悲剧将乌克兰军队抹黑为不道德且无能的，同时将自身塑造为一个重要的稳定力量。然而，在此过程中，俄罗斯的宣传机构抛出了多种相互矛盾的解释。因为，尽管让人们相信反乌克兰叙事有其价值，但俄罗斯也明白自己迟早会暴露。不过，通过不同渠道向不同受众传播多种叙事，他们能制造混乱，让调查人员忙于应付，并延长普遍的困惑感。对许多人而言，那种“我不知道该信谁或信什么”的感觉——“宣传导致的瘫痪”¹³⁹——会比最终调查结论的知晓时间持续得更久，尤其当俄罗斯的混淆视听使调查结果延迟发布，直到新的新闻故事占据了新闻周期时。


  值得注意的是，尽管在其他地方“机器人”被广泛提及，但在乌克兰，机器人似乎只扮演了很小的角色。据乌克兰媒体与宣传研究员玛丽亚·日丹诺娃和达里亚·奥尔洛娃称，“自动化机器人在乌克兰似乎不那么普遍。”相反，“手动维护的虚假账户是针对乌克兰公众的在线宣传活动最常用的工具之一。”¹⁴⁰
  这可能是因为相较于`Facebook`这类自动化更困难（因而成本更高）的平台，`Twitter`这类对机器人友好的平台在乌克兰的普及率相对较低。


  尽管吞并事件发生在 2014 年，全球的注意力在很大程度上已转向别处，但俄罗斯围绕乌克兰的信息战仍在持续，甚至以英语进行。在我对俄罗斯虚假信息的研究中，我会定期遇到（对我来说）新的网站以及`Twitter`和`Facebook`账户，它们传播反乌克兰叙事，并鼓吹顿涅茨克、卢甘斯克和新俄罗斯地区“分离主义者”的自决权。这些资产一旦建立起来，俄罗斯很少会主动移除它们——尽管可能会重新调整其用途。相反，这些成本低廉、有时效果显著的行动会一直持续，直到这些资产被攻破或由其所在平台删除为止。




  ### 波罗的海的积极措施


  瑞典与芬兰长期以来在俄罗斯（以及前苏联和华约国家）与北约之间扮演着重要的缓冲角色。正因如此，冷战期间苏联间谍在瑞典异常活跃，他们搜集情报并开展行动，以期阻止北约向东扩张。到了
  21 世纪，俄罗斯面临的威胁更多来自经济层面而非军事层面（尽管俄罗斯宣称情况相反）。为了将石油等出口物资运出波罗的海，俄罗斯必须经过丹麦（北约和欧盟成员国）与瑞典之间的海域。考虑到美国及北约自
  2009 年以来对俄罗斯寡头集团施加的经济压力（包括制裁），以及对其地缘政治盟友伊朗实施的更为严厉的制裁，北约通过瑞典进行渗透的威胁是真实存在的：这不是军事入侵的威胁，而是通过瑞典或借助瑞典之手在波罗的海实施贸易封锁的威胁。


  因此，当瑞典在 2015 年开始考虑与北约签署一项允许北约军事力量进入瑞典领土的协议时，俄罗斯行动了。这次行动发生在信息空间。


  2015 年初，国有宣传机构“卫星通讯社”推出了一个瑞典语网站。通过该网站、由“今日俄罗斯”（一家国际性的俄罗斯国有媒体）运营的电视网络以及众多秘密渠道，俄罗斯向瑞典倾泻了大量宣传内容。这些宣传包括标准的俄罗斯叙事：反北约信息、对即将到来的核战争（当然，是由美国领导的北约行动引发的）的恐惧煽动、关于欧盟正在衰落的论调，甚至还有反转基因和反移民的叙事。当然，这还伴随着围绕瑞典-北约协议的虚假叙事的传播和放大。


  研究人员马丁·克拉格和塞巴斯蒂安·奥斯伯格对此次俄罗斯影响力行动进行了深入研究。他们发现，与俄罗斯的常见做法一致，“误导性的半真半假是常态”，而“彻头彻尾的捏造只在有限范围内发生”。虽然他们确实发现了一些容易被揭穿的捏造和伪造信息，但大多数俄罗斯信息都放大了瑞典文化中早已存在的亲俄叙事，尤其是来自边缘群体的叙事。


  其中有一系列虚假叙事尤为突出。从 2014 年底开始，瑞典海岸或其附近多次发现不明身份的外国潜艇。这些目击事件可信，并在合法的主流媒体上得到报道。但这并非瑞典海岸首次发生与外籍潜艇有关的怪事。克拉格和奥斯伯格写道：


  - 1981 年，苏联潜艇`S-363`在瑞典南海岸搁浅后，媒体上很快出现了一封据称由瑞典驻华盛顿大使威廉·瓦赫特迈斯特撰写的伪造电报。电报表达了这位大使对斯德哥尔摩与华盛顿之间一项秘密协议的极度失望，该协议允许美国潜艇在战时使用瑞典军事基地。这封电报很快被证实是苏联的伪造品，但其内容仍在瑞典的辩论中流传。


  俄罗斯的宣传者利用这一点，不仅散布关于 2014-2015 年潜艇的虚假谣言，还明确将其与那些陈旧、虚假（但仍被许多人相信）的关于美国/北约与瑞典之间存在秘密军事安排的谣言联系起来，这些安排据说会激怒俄罗斯，并让瑞典处于第三次（核）世界大战的前线。


  瑞典-北约东道国协议于 2016 年 5 月获得批准，但俄罗斯的影响力行动至今仍在瑞典持续。据一名据称曾在俄罗斯互联网研究机构（负责“拉赫塔项目”的组织）秘密工作的记者称，俄罗斯宣传者将目光投向了瑞典
  2018 年的全国大选。这完全合情合理。俄罗斯所感知到的北约威胁并未消失，而且，如果说有什么变化，那就是俄罗斯在波罗的海和斯堪的纳维亚地区的军事压力似乎在不断增加。没有理由预期俄罗斯在瑞典的信息战会在短期内有所放松。


  ## 奇幻熊与 2016 年网络迷因大战


  俄罗斯已知或涉嫌开展了许多其他线上信息战行动，但其中受到最详细审查的可能就是他们影响 2016 年美国总统大选的努力。俄罗斯在 2016 年美国总统大选前后实施了*至少*四项影响力行动，旨在清除西方对其地缘政治目标的阻碍，特别是取消奥巴马时期对俄罗斯及俄罗斯寡头的制裁。所有这些行动——以及美国公众（尚）未意识到的其他可能行动——都由总统行政当局，即弗拉基米尔·弗拉基米罗维奇·普京及其最亲密的同僚指挥。


  第一项影响力行动是俄罗斯军事情报机构内部一个名为`APT28`（又称“奇幻熊”）的黑客团队的工作。“奇幻熊”入侵了关键的民主党目标，并公开了有损其声誉的材料，以抹黑他们并削弱希拉里·克林顿的胜选机会。第二项公开影响力行动是由互联网研究机构在脸书、Instagram、推特、YouTube、Tumblr、Medium
  等社交媒体平台上进行的。他们制造并放大了支持唐纳德·特朗普、诋毁希拉里·克林顿，以及鼓励美国政治左翼诸多团体投第三党或退出选举进程的媒体内容。这两项行动都直接针对美国公民，并在网上公开进行。


  另外两项更隐秘、更侧重于商业的行动也同时进行。其中一项涉及通过建立俄罗斯特工（如玛利亚·布蒂娜）与美国公众人物和商业领袖之间的关系来培养人力资产，这些人大多（但不限于）属于政治右翼。以玛利亚·布蒂娜为例（她于
  2018 年因密谋危害美国被定罪），其目标似乎是建立俄罗斯与美国保守派之间的团结，可能是希望说服他们在掌权时取消对俄罗斯的制裁。另一项行动则是俄罗斯寡头和商业领袖试图与唐纳德·特朗普及其家人、亲信和顾问建立财务关系。这与普京的总统行政当局处理与俄罗斯寡头和商业领袖关系的方式几乎如出一辙。俄罗斯的政府与商业之间运作着一种交换关系，使参与这种关系的人致富，并使其竞争对手难以开展业务，至少无法在公平的竞争环境中立足。在美国，腐败的个人可能会（试图）用贿赂来换取公职人员的有利立法；而在俄罗斯，更常见的做法是建立商业关系或共同拥有某项资产，公职人员颁布有利的法律或法规以促进企业发展，从而使腐败的商人和腐败的官员都中饱私囊。（想要深入了解这类行为，请参见《普京的盗贼统治：谁拥有俄罗斯？》）




  这些人际关系至关重要，因为它们是公众影响力行动的最终目标。与一位房地产大亨兼真人秀明星建立密切的商业往来固然重要，但如果这位资产成为美国总统，这种商业纽带或个人关系就会呈指数级地增值。这位资产不仅是“身居高位的朋友”，而且还有个人财务动机，要为他的外国商业伙伴的利益服务。更甚者，如果这些伙伴或与他们协作的其他人掌握了关于这位未来总统或其核心圈子的
  `kompromat`（情报界术语，指“黑料”），情况会更是如此。尽管对这些所谓的及试图建立的关系进行调查可能引人入胜，但这终究不是本书的主题。


  这本书是关于大数据和信息如何能够影响人民、改变历史的。因此，我将聚焦于 `GRU`（俄罗斯总参谋部情报总局）和 `IRA`（互联网研究机构）的活动，这两个组织在总统选举的最后几周里，成功影响了公共舆论，散播了谎言，并设定了绝大部分的议程。我们可能永远无法知道他们的活动赢得了或失去了多少张选票——无论是普选票还是选举人团票。但毫无疑问，他们的活动影响了美国人在投票时所关注的问题。甚至在
  2018 年底，他们在 2016 年发布的内容仍在流传并驱动着政治对话。（这还暂且不提他们从那以后所做的工作，无论是否被侦测到。）


  让我们从“奇幻熊”（Fancy Bear）开始说起。


  ### 奇幻熊攻陷民主党


  `GRU`可能早就将目光投向美国一段时间了。近年来，他们显然一直密切关注着西方。例如，2015 年 4 月，“奇幻熊”入侵了法国的 TV5Monde 电视台，并在该国家电视网络上发布消息，如：“法国的士兵们，远离‘伊斯兰国’！你们有机会拯救你们的家人，请把握机会。‘网络哈里发国’将继续对‘伊斯兰国’的敌人发动网络圣战。”虽然最初的迹象指向可能是
  ISIS 的袭击，但安全专家最终确定，这次攻击的来源是一个与`GRU`相关的 IP 地址。^(¹⁵⁰)


  他们意图采取行动以影响或诋毁 2016 年美国总统大选结果的最早直接迹象之一出现在 2015 年 10 月。当时，`GRU`开始针对民主党全国委员会（`DNC`）选民保护主任普拉特·威利的电子邮件账户。据《芝加哥论坛报》报道，“奇幻熊”黑客“在六个月内试图闯入他的收件箱多达
  15 次”。^(¹⁵¹) 这自然引发了人们对可能入侵投票机、在有全电子投票的选区更改票数的担忧。


  尽管网络安全专家普遍认为，俄罗斯在 2016 年并未更改美国任何电子投票计票结果，但他们*确实*成功入侵并窃取了伊利诺伊州等州的选民登记记录中美国公民的个人信息。^(¹⁵²)
  全美的选举官员都加强了选举安全，有些地方甚至恢复使用纸质选票，至少作为备份。但即使在 2018 年 11 月美国中期选举临近之际，全美的安全专家和选举官员仍担心，如果攻击*真的*到来，全国许多选区可能无法抵御对票数的攻击。但即便是这，也不是许多选举官员最大的恐惧。正如国家公共广播电台（NPR）在一篇关于伊利诺伊州数据泄露的报道中所说：


  - 伊利诺伊州正在投入数百万美元的联邦资金，帮助该州一些较小的投票管辖区保护其数据和设备。有些县甚至没有自己的 IT 人员。但这里的官员不太担心硬件和软件。他们更担心的是，即使是一次不大的漏洞，也可能削弱选民对我们选举机制的信心。^(¹⁵³)


  在选举日更改票数或让机器瘫痪，可能是对美国民主体制的一次毁灭性攻击，但也许同样有效——而且肯定更具*成本效益*——的做法是*诋毁*选举结果。如果选民信心被削弱到足够程度，可能会降低投票率。而从未投出的选票是无法重新计算的。如果你将这种对选民信心的打击精准地对准某个严重倾向一方的特定人口群体或地理区域，你就能可预见且不可逆转地压制某一政党的选票。如果这一切发生在一个拥有大量选举人票且最终票数接近的“摇摆大州”，你*理论上*可以左右一场选举。


  左右选举并非唯一的目标。诋毁选举过程可以使结果受到质疑，如果有足够多的公民认为选举不合法，可能会使胜选者难以执政。这似乎是“奇幻熊”成功入侵希拉里竞选团队和民主党全国委员会这一猖獗行动背后的根本动机。




  ### 奇幻熊是如何入侵的


  你看过电影《战争游戏》（1983 年）吗？这部影片虽不算新，却完美诠释了那种黑客思维，而这正是奇幻熊在 2016 年大选前所用具体技术的基础。在《战争游戏》中，主角大卫·莱特曼想修改自己高中的生物成绩，以免上暑期班。学校的成绩数据库（在
  1983 年这多少有些令人震惊）可以通过“在线”方式访问——即通过兼容计算机经由电话线拨号接入。数据库受定期变更的密码保护，大卫既没有密码，而且即便有密码也很快会失效。大卫本可以尝试暴力破解法，比如通过算法生成随机密码，直到猜中正确的那个——如果密码足够简单且时间充裕，这种方法或许可行。但这会在很长一段时间内使系统登录尝试次数激增，从而增加他的攻击被发现的可能性。于是，他采用了一种*人类情报*（HumInt
  发音为 *hyoo-mint*）方法。他（有意地？）在学校定期惹麻烦，被送到校长办公室谈话。在那里，他发现数据库密码的存放位置，并定期记下更新的新密码。他惹麻烦的频率足够高，以至于他出现在密码记录地点附近所引发的警惕，远低于从家中电话号码的计算机多次尝试登录所引发的警觉。因此，他的密码窃取和成绩篡改未被学校察觉。


  电影稍后部分，大卫正在搜索一家电子游戏公司的服务器，以便在新游戏发布前（而且很可能，是为了避免支付 20 世纪 80 年代初新电脑软件的价格！）抢先试玩。当他探查游戏公司地理区域附近的电话号码时，偶然发现了其他几个有趣的计算机连接。在为他想要打动的女同学预订了一次虚假的巴黎之旅后，他发现了一个军事服务器，里面包含一些游戏，这些游戏教授在冷战高峰期可能对决策者和谈判者有用的战略。他咨询了两位计算机同好，他们告诉他，他永远无法突破主系统的安全防线。但可以寻找一个“后门”——原始程序员留下的、不为现任系统管理员所知的秘密进入方法。结果发现，服务器上的一款游戏包含一个名字：福肯的迷宫。大卫在图书馆进行了一番研究，发现了一位开发者和发明家史蒂文·福肯，他曾有过与政府合作或为其工作的经历。在调查福肯的生平后，大卫发现了福肯的“后门”密码，并成功进入了系统。（然后差点引发第三次世界大战……）


  自 20 世纪 80 年代初以来，加密和在线计算机安全技术已呈指数级增长。在不了解系统的情况下使用暴力破解法几乎注定失败，因为加密数据远比通过计算发现加密“密钥”要容易得多。（而且，由于这两种过程依赖同类型的计算机处理器，这种情况在短期内仍将持续。）


  但自 20 世纪 80 年代以来，技术在复杂性和普及性方面也急剧增长。而自那时起，人类大脑管理这种复杂性的能力并未提高。我们会犯错。专家级开发者不仅会在代码中留下后门，还会留下废弃函数、单元测试、分析追踪器、对其他人的代码的依赖（当*其他*代码中发现安全漏洞时，这些依赖并不总是及时更新）、在系统过载被迫重启时被触发的权限过于宽松的网页应用安装脚本，或者因用户安装后未能更新权限而留下的开放接口。更不用说用户的错误，例如弱密码、重复使用密码、不必要地用管理员设置运行错误的应用程序，以及不知不觉地安装和使用需要超出必要系统权限的应用程序……并因其自身糟糕的安全设置而使这些“门”保持敞开。


  正如虚构的黑客大卫·莱特曼利用人类情报和传统研究来降低计算问题的复杂性一样，像奇幻熊这样的现实黑客也利用人类情报——并利用人类的错误——作为其切入点。


  奇幻熊在 2016 年选择的武器是电子邮件。具体来说，是一种名为*鱼叉式钓鱼*的欺诈性电子邮件。你可能熟悉*钓鱼*——那些通常写得很拙劣的邮件，声称“你的邮箱已满”或“你的银行账户被冻结”，并告诉你点击邮件中的链接并提供个人登录信息（包括用户名和密码）来解决问题。鱼叉式钓鱼类似于钓鱼，但不同之处在于，钓鱼是将邮件广泛撒网，希望能捕捉到*某类*用户的数据（就像用一根钓线或渔网只想捕捉到*某些*鱼），而鱼叉式钓鱼攻击则针对特定的用户或用户群体（就像用鱼叉瞄准*特定*的鱼）。


  这些电子邮件看起来不像“你的银行账户被冻结”，而更像是：“嘿，[你的真名]，我是[你老板的真名]。我正开会脱不开身，需要你中午前帮我把某件事做了。”邮件里几乎总有一个欺诈性链接，点击后可能会让发件人访问你系统中的某部分，或者向你索要同样能达到此目的的信息。或者，它可能看起来像一封发送到你
  Gmail 账户的、制作精良的谷歌安全通知副本，附带一个按钮让你点击以处理他们在你账户上检测到的安全问题。他们可能想获取你电子邮件账户的内容、你 G Suite
  账户中的公司文档、访问你的摄像头和麦克风，或者他们试图在你的电脑上安装一个键盘记录器，以收集每一次击键信息，包括用户名、密码、网址和你所写消息的内容。其中任何一项都可能让他们获取情报——如同事和客户的邮箱地址、内部报告、财务文件等——或者*抹黑材料*——一旦公开可能损害你或你公司声誉的信息。


  2016 年 3 月 10 日，当希拉里·克林顿成为民主党总统候选人的局势明朗后，她的竞选团队开始收到来自奇幻熊的鱼叉式钓鱼邮件。3 月 19 日，俄罗斯军事情报局（GRU）的黑客开始针对其竞选主席约翰·波德斯塔的个人
  Gmail 账户。对竞选团队的攻击在 3 月和 4 月持续进行，同时也扩展到与竞选相关的其他团体，如克林顿基金会、美国进步中心、ShareBlue 等。


  攻击成功了。波德斯塔的一名工作人员在 3 月 19 日点击了发送到波德斯塔个人 Gmail 账户的一封欺诈性谷歌安全警报中的链接，并输入了他的用户名和密码。两次。4
  月下旬，特朗普顾问乔治·帕帕佐普洛斯得到消息，称俄罗斯已从“数千封电子邮件”中获取了克林顿的*抹黑材料*。^(¹⁵⁴)




  大约在同一时间，奇幻熊将目标对准了民主党全国委员会。但这次鱼叉式网络钓鱼攻击的目标不仅仅是电子邮件。这些邮件中的欺诈链接在点击时具有在电脑上安装恶意软件的能力，而下载到民主党全国委员会电脑上的恶意软件让俄罗斯总参谋部情报总局得以访问这些电脑以及该委员会服务器上的数据。^(¹⁵⁵)


  俄罗斯并没有仅仅坐拥从这些攻击中获取的`kompromat`。2016 年 4 月，美国情报机构如今认为与俄罗斯有关的两个网站被注册：`electionleaks.com`和`dcleaks.com`。同年
  6 月，`dcleaks.com`和“黑客”Guccifer 2.0 的博客（美国情报界同样认为这可能是俄罗斯总参谋部情报总局的一次行动）开始发布针对民主党获取的`kompromat`——包括关于民主党全国委员会领导层如何保护克林顿免受伯尼·桑德斯挑战的信息。这除其他外，还导致了桑德斯支持者对民主党全国委员会提起诉讼——以及可能来自左翼人士的大量抗议投票（要么不投票，要么投票给吉尔·斯坦这样的第三方候选人），从而在选举中损害了克林顿的选情。^(¹⁵⁶)


  同样在 2016 年 6 月，朱利安·阿桑奇宣布维基解密已获取了针对希拉里·克林顿的`kompromat`。（阿桑奇否认俄罗斯是这些数据的来源。）同年 7 月，维基解密开始发布这些`kompromat`，并战略性地安排这些信息在选举剩余过程中陆续发布，最终于
  2016 年 10 月 7 日公布了波德斯塔的电子邮件——同一天（且紧随其后），“特朗普门”的`Access Hollywood`录音带也被曝光。^(¹⁵⁷)


  尽管我们永远无法完全了解俄罗斯总参谋部情报总局行动的全部影响范围，但有几个后果很可能归因于奇幻熊从克林顿竞选团队和民主党全国委员会获取的`kompromat`的发布。首先，关于民主党全国委员会如何压制桑德斯赢得提名机会的揭露，疏远了许多倾向左派的选民——这很可能压制了来自更左翼（在初选和党团会议中支持桑德斯的人）和中间派（这些人可能因对特朗普反感却仍不愿投票给克林顿）的克林顿选票。这种情况很可能因俄罗斯互联网研究机构（我们稍后将详细解析）发起的支持吉尔·斯坦和“绝不选克林顿”的运动而进一步加剧。


  波德斯塔电子邮件中包含的其他细节，很可能也压制了克林顿左翼和中间派潜在支持者的投票率——或至少是他们的热情。正如杰夫·斯坦为`Vox`所写：


  *   到目前为止，波德斯塔的电子邮件中实际上没有一条爆出关于这位有望成为下任总统的女性的任何新丑闻。相反，它们大多只是进一步揭示了我们已经知道的克林顿多重争议背后丑陋的一面：克林顿基金会与其捐赠者之间可疑的关系、克林顿与华尔街权势利益集团的亲密关系，以及她与富裕竞选捐款人的联系。^(158))


  克林顿基金会的争议对于她在被特朗普疏远的中间派中的潜在支持尤其具有破坏性。这些人中许多过去曾投票给共和党，并对共和党提名人感到不满。但围绕她的腐败传闻，加上共和党人对克林顿这个姓氏的偏见，很可能使得许多温和派和失望的共和党人在
  2016 年难以投票给民主党。与华尔街和富裕捐赠者的联系，很可能损害了克林顿在前桑德斯支持者中的机会，这些人一直要求克林顿公布她过去有偿向银行家和其他美国富人发表的私人演讲内容。其中一些内容令人尴尬或难堪，但有些内容也削弱了克林顿在其竞选政策纲领之外的左翼人士中争取支持的能力。


  我还认为，长达数月对“克林顿电子邮件”的痴迷，加剧了联邦调查局局长詹姆斯·科米 2016 年 10 月 28 日声明的影响，他当时宣布重新调查克林顿在担任国务卿期间使用私人电子邮件服务器一事。这项调查因在前国会议员安东尼·韦纳的调查中浮出水面的证据而重启，韦纳分居的妻子胡玛·阿贝丁是克林顿的高级助手。^(159))
  科米调查的是克林顿的私人电子邮件服务器可能包含机密信息的可能性，并非俄罗斯或维基解密发布的电子邮件内容，但一个充斥着对“克林顿电子邮件”模糊提及的快节奏新闻周期，很可能意味着这些新闻报道相互叠加，共同影响选民。


  然而，也许最重要的是，俄罗斯总参谋部情报总局发布针对克林顿和民主党全国委员会的`kompromat`，意味着*俄罗斯得以在很大程度上为总统选举设定了议程*。记者们仔细研究泄露的内容以寻找独家新闻，然后进行报道。这些记者在辩论中也提出了关于这些文件内容的问题。而候选人在整个竞选过程中都面临着来自记者和选民的关于这些文件的质询。每一个关于这些俄罗斯`kompromat`的问题——无论该问题本身所代表的担忧多么合理——都是一个没有涉及竞选活动所提出的政策纲领的问题。花费在追查安全隐忧和准备这些问题答案上的时间，都是竞选团队用于构建和捍卫自身纲领的时间。在相当程度上，俄罗斯黑客决定了美国选民会将其有限的注意力投入到哪些议题上，并据此决定他们在
  11 月 8 日如何投票。我和我的同事们将这种对公共信息的操纵称为“武器化的真相”。对于安全研究人员来说，奇幻熊数据泄露的内容看起来是真实的——它们不是“假新闻”。但它们意在操纵公共话语和个人行为。无论我们是否将其称为“虚假信息”（我是这样认为的，因为不诚实的操纵是行动的核心），它无疑是信息战的一个组成部分——而且由于基于事实，它可能是一种极其有效的手段。




  ### 拉赫塔项目


  当然，俄罗斯并非仅仅通过发布被黑客窃取和泄露的文件来操纵美国的公共话语。他们的互联网研究机构（`IRA`）还通过一场专业的社交媒体操纵运动，对美国发动了信息战。`IRA`
  广泛行动的细节主要记录在美国司法部于 2018 年对关键俄罗斯个人及有限责任公司提出的起诉书中，以及为美国参议院情报特别委员会（`SSCI`）准备并于 2018
  年 12 月发布的两份报告中，这些报告对`Twitter`、`Facebook`（包括`Instagram`）和`Google`（`YouTube`）向`SSCI`提供的数据进行了详细分析。^(¹⁶⁰)


  这些文件中描绘的画面——很可能仍不完整——是一场大规模、专业化的公众注意力操纵活动，其手段结合了“武器化的真相”、部分真相、彻头彻尾的谎言以及压制选民的说法，旨在让唐纳德·特朗普当选美国总统，同时抹黑希拉里·克林顿的潜在总统任期以及整个民主进程。此外，大选结束后，`IRA`
  继续试图操纵和破坏美国社会的稳定，甚至在`Instagram`等平台上*增加*了针对某些美国社群的活动。尽管目前可获得的数据表明，政府和平台的活动已显著削弱了`IRA`发动基于社交媒体的信息战的能力，但同样清楚的是，俄罗斯团体仍在试图通过针对美国的在线媒体来操纵公众舆论并抹黑其批评者。


  虽然俄罗斯的影响力行动可以追溯到更早，即使在美国也是如此，但如今著名的旨在操纵 2016 年大选的行动，始于 2014 年 4 月`IRA`“翻译项目”的成立，该项目旨在研究在线平台（包括`YouTube`、`Facebook`、`Instagram`和`Twitter`）上的美国社会和政治团体。2014
  年 5 月，这项内部称为“拉赫塔项目”的行动战略被确定：“传播对候选人及整个政治体系的不信任”^(¹⁶¹)，其具体目标是干预 2016 年美国大选。^(¹⁶²)
  到 2014 年 6 月，`IRA`特工已亲自在美国本土进行实地情报搜集（随后于 2014 年 11 月再次行动）。^(¹⁶³) 到 2016 年 9 月，拉赫塔项目的*月度*预算约为
  125 万美元。^(¹⁶⁴)


  根据`IRA`起诉书：


  *   被告及其同谋者通过欺诈和欺骗手段，创建了数百个社交媒体账号，并利用这些账号将某些虚构的美国人物角色发展为美国的“舆论领袖”。


  `组织`的员工（被称为“专员”）的任务是创建看起来由美国人运营的社交媒体账号。这些专员被分为日班和夜班，并被告知要按照美国相应时区发帖。该`组织`还分发美国节假日清单，以便专员们可以制定并发布相应的账号活动。专员们被指示撰写与美国相关的话题，如美国外交政策和美国经济问题。他们还被指示通过“支持激进团体、对社会和经济状况不满的用户以及反对派社会运动”来制造“政治热度”。^(¹⁶⁵)


  这包括将传播信息聚焦于移民、黑人的命也是命与警察暴力、警察的命也是命、宗教和地方分离主义等主题。这些话题通过提供给`IRA`“专员”的内部文件进行指导，作为他们创作内容的基础。2016
  年 9 月，一份内部备忘录强调，“在 11 月大选之前，必须加大批评希拉里·克林顿的力度”。^(¹⁶⁶)


  然而，司法部在对关键`IRA`官员和空壳公司提起的诉讼中公开的内部文件，仅为我们了解他们针对美国人的实际行动打开了一扇小窗。为了真正了解他们做了什么以及他们的内容是如何传播的，参议院情报特别委员会委托两个小组分析`Twitter`、`Facebook`和`Google`提供给参议院的私有数据并报告其发现。我和几位同事有幸为其中一份报告做出了贡献。虽然这些数据集都缺失了关键的元数据（而且我认为，还缺少更多关于`IRA`及其他俄罗斯机构针对美国进行宣传的例子），但它们展现了一场*庞大*且*专业*的行动，远远超出了平台高管们最初的声明。无法量化这场运动可能改变了多少张选票，或至少影响了多少，但无法否认的是，这场运动，连同“
  fancy bear ”的行动，是影响选举基调、成为公共话语中心议题以及围绕选举的媒体报道的重要因素。所有这些因素加在一起，无疑影响了*一些*选票，并自此引发了人们对
  2016 年大选合法性的质疑，以及对先前和后续选举受到外国影响的担忧。


  但他们的行动到底是什么样的？又有多普遍呢？


  首先，`IRA` 围绕 2016 年美国大选的影响力行动触及了所有主要平台，甚至一些次要平台。除了`Facebook`、`Instagram`、`Twitter`和`YouTube`之外，`IRA`活动的证据还出现在`Google
  Plus`、`Vine`、`Gab`、`Meetup`、`VKontakte`、`LiveJournal`、`Reddit`、`Tumblr`、`Pinterest`、`Medium`，甚至`Pokémon
  Go`上。^(¹⁶⁷) 这还不包括万维网，`IRA`（以及俄罗斯政府的其他分支或承包商）在那里拥有网站、博客和亲克里姆林宫的“智库”期刊。这个`IRA`网络资产“像一家精明的营销机构一样运作”，拥有数十名真实人员发布、分享、转发和评论彼此的模因、博客和推文。正如我和同事们在为`SSCI`撰写的报告中所写的那样，“它远远不止是
  Facebook 高管最初声称的 10 万美元的 Facebook 广告。广告参与度只是更广泛、有机驱动的影响力行动中的一个次要因素。”^(¹⁶⁸) 拉赫塔项目的总预算超过
  2500 万美元，^(¹⁶⁹) 这笔钱主要用于支付员工工资，让他们创建的不是广告，而是*有机的*内容：由`IRA`“专员”精心打造的虚假人物和群组所拥有的用户账号和主页分享的推文、帖子、模因、视频、活动。总体而言，`IRA`在大选前后发布的内容估计触及了`Facebook`上
  1.26 亿美国人、`Instagram`上 2000 万美国人以及`Twitter`上 140 万美国人。这绝非小规模行动。




  同样重要的是要注意，`IRA`（互联网研究机构）总的来说并没有运营一个被称为 `botnet`（僵尸网络）的自动化账户网络。`IRA` 的员工需要完成每日的原创帖子、评论、分享和点赞配额。这些主要是由人工操作的账户，试图“将宣传无缝地编织进看似普通人的非政治性闲聊之中。”^(¹⁷⁰)
  因此，他们的员工班次与美国时区保持一致（参见之前讨论过的`DoJ`（美国司法部）起诉书），并有一套奖金和罚款制度，鼓励各个“专员”制作高参与度的内容。^(¹⁷¹)
  为了显得更像真正的美国人，`IRA`的“专员”们会参与标签游戏^(¹⁷²)，并发布大量非政治性内容。


  `Project Lakhta`（拉克塔项目）远不止是将支持特朗普和反对克林顿的信息抛入网络空间以期触及受众那么简单。事实上，与选举相关的帖子仅占`IRA` Facebook
  内容的 7%、Instagram 内容的 18%和 Twitter 内容的 6%。^(¹⁷³) 相反，`IRA`创建了我与同事们所称的“媒体幻象”——一个虚假的、相互关联的多平台媒体环境，用欺骗性和操纵性的信息针对多个不同的社群。^(¹⁷⁴)
  这种“幻象”包含了相当一部分非政治内容，而在涉及政治的内容中，它通常聚焦于当前引发分歧的社会议题，这些议题会激发（或削弱）不同社群成员的热情，而非针对具体的候选人。这种幻象针对三大类社群——右倾美国人、左倾美国人和非裔美国人——以及更精准定位的子社群，如支持分裂的得克萨斯人、民主社会主义者、福音派基督徒等。并且，这种幻象用真实新闻、假新闻、不真诚的对话，以及——可能最重要的——表情包战争来针对他们。


  在针对美国社群方面，`IRA`无论是在线上还是线下在美国本土都做足了功课。（并且，就像任何一家数字营销公司一样，他们根据用户参与数据不断调整信息内容。）在许多情况下，他们用为该社群量身定制的特定信息来针对他们，这当然符合克里姆林宫的议程。例如，他们针对右翼美国人，用能激励他们出来投票反对民主党或温和派候选人的叙事——关于移民和持枪权的恐吓性叙事、鼓舞人心的基督教主题叙事，以及关于克林顿涉嫌腐败的警告。他们针对左倾美国人，用会削弱他们热情的叙事，使他们对克林顿的支持变得不冷不热，或鼓励他们投给第三方或进行抗议性投票——叙事涉及克林顿涉嫌腐败、`DNC`（民主党全国委员会）不民主的初选过程剥夺了伯尼·桑德斯的公平机会，以及将克林顿标榜为糟糕女权主义者的女权主义和交叉性叙事。他们还针对非裔美国人，用更尖锐的、旨在总体上使他们远离民主进程的关于警察暴行或两党种族主义倾向的选民压制叙事。最终目标是鼓励人们投票给特朗普，如果无法让左派转而投票给特朗普，则降低民主党选民以及倾向于投票给民主党的人口群体的投票率。他们主要通过一般性的社会和政治叙事来实现这一目标，而非通过具体提及候选人的帖子。


  然而请注意，这些叙事大多是关于不信任和恐惧——而非碰巧与俄罗斯目标一致的、积极的美国美德。是的，存在一些高参与度的爱国账号和亲基督教账号，但总体而言，即使是这些账号，其目的也是创造一个“自己人/外人”的框架，该框架可以在其他情境中，利用关于对外来者的恐惧或愤怒的叙事来运作。例如，许多亲基督教的账号会将选举框定为耶稣与一个被表情包化的、恶魔般的希拉里·克林顿形象之间的精神之战。^(¹⁷⁵)
  爱国账号会为反移民、反穆斯林、反 LGBTQ、或反任何可能被解读为违背“传统”美国价值观的内容奠定基础。这种负面性是次要目标的一部分：在美国社会中制造分裂、不信任和普遍的社会不和谐。无论谁赢得选举，如果美国人更加分裂，更专注于分裂性的国内问题，他们对于北约盟友来说就不是那么好的合作伙伴，对克里姆林宫地缘政治目标的威胁也就更小。


  这个次要目标就是为什么针对美国的`IRA`行动在 2016 年 11 月并未停止的原因。事实上，就在美国政府与公众于 2017 年初开始意识到俄罗斯的影响力行动之后，当
  Twitter 和 Facebook 上开始出现账号封禁时，`IRA`针对美国受众的 Instagram 活动反而增加了。诚然，所有主要平台上的影响力行动仍在继续，但社交媒体公司提供的数据清楚地表明，2017
  年 *Instagram 上的活动* 尤其增加了，特别是那些煽动非裔美国人和反特朗普“抵抗派”社会恐惧的内容。^(¹⁷⁶) 2017 年，`IRA`针对右倾受众，主要发布反克林顿信息，巩固对特朗普的支持，并散布关于平台审查保守派（随着俄罗斯账号开始被封禁）的叙事；针对左倾受众，他们散布反选举人团叙事，煽动对选举过程的不满；他们针对所有人散布反罗伯特·穆勒的叙事，试图抹黑对俄罗斯干预选举及其可能与特朗普竞选团队勾结的调查。


  ### 接下来怎么办？


  正如我们在参议院报告中所总结的，“在可预见的未来，美国似乎很可能会继续面临俄罗斯的干涉。”^(¹⁷⁷) 在 2016 年大选的余波中，许多`IRA`最优秀的对美行动资产已被清除，许多关键领导层和空壳公司已被起诉。这使得他们在美国进行高影响力行动变得更加困难，但并非不可能。我和同事们持续在社交媒体上观察到疑似俄罗斯的宣传，包括针对
  2018 年美国中期选举的内容。^(¹⁷⁸) 目前尚不清楚他们在多大程度上可能已经奏效，但他们并未消失。除了在线宣传，我们还知道，克莱尔·麦卡斯基尔（未成功）竞选连任美国参议员的行动遭到了黑客攻击，这很可能是由`GRU`（俄罗斯军事情报机构）所为。^(¹⁷⁹)
  俄罗斯国有、英语的大众媒体，如`RT`（今日俄罗斯）和`Sputnik`（卫星通讯社），以及数百个与克里姆林宫有关联或结盟的博客和“期刊”在英文网络上泛滥。我们还知道，俄罗斯的地缘政治盟友伊朗已被确认为某些在线虚假信息行动的来源，迄今为止，这些行动受到研究人员的直接审查比俄罗斯的行动要少。我们甚至还没有讨论俄罗斯涉嫌参与
  2016 年英国脱欧公投，或 2017 年针对埃马纽埃尔·马克龙法国总统竞选活动的“黑料-泄露”行动。


  至少就目前而言，这就是新常态。




  ## 总结


  本章中，我们详细审视了俄罗斯在冷战旧战场上的社交媒体虚假信息行动。在乌克兰的多平台影响行动先于并支持了其在克里米亚和乌克兰东部的军事行动。电视和网络上的恐吓性叙事试图阻止瑞典（及芬兰）与其北约伙伴合作，以免威胁到俄罗斯的能源产业。而俄罗斯军事情报机构（格鲁乌）和一家俄罗斯承包商（互联网研究机构）的行动，则试图在
  2016 年破坏并抹黑美国的民主进程，并让唐纳德·特朗普当选为美国总统。


  这些行动利用了西方一些最伟大的美德：言论自由、新闻自由、开放性和技术进步。但它们同样利用了人类根本的弱点：难以区分网络虚实、部落主义以及对“他者”的恐惧等认知局限。这些弱点，加上社会演进和立法总是落后于技术创新的现实，意味着我们很可能将在未来很长一段时间内，持续应对网络虚假信息的问题。


  但这不仅仅是北约国家和前苏联加盟共和国的问题。这是一个全球性问题，因为国内外团体都在试图利用网络媒体操纵他人，以谋取自身利益。而在那些不仅技术是新的，就连*民主*也是新事物的国家，网络虚假信息对言论自由和信息自由流动构成了更大的威胁，而这两者对民主的蓬勃发展都至关重要。


  这正是下一章的主题。


