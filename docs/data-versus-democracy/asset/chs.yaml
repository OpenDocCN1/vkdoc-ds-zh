- '# 6. 黑客民主，第二部分


  全球南方的谣言、机器人与种族灭绝


  新技术既非天生良善，也非天生邪恶，更非天生中立。当涉及新的沟通和信息共享方式时，新技术会不可逆转地改变一个社区的社会结构，让新事物成为可能，同时也让旧有的行事方式变得不可及。当一个社区正经历社会变革或紧张局势时，这只会火上浇油。获取信息的新途径可以带来积极的社会变革，但像社交媒体这样的工具也可能被武器化。新技术加上新的社会结构，可能会给社会带来巨大的不稳定和不确定性。这个故事——远不止是外国干预——在全球南方已反复上演。




  ## 一场数字革命


  技术改变了我们保存和传播思想与故事的能力，改变了我们联系和交流的方式，改变了我们能够互动的人群，改变了我们能看到的事物，也改变了监督传播渠道的权力结构。^(¹⁸⁰)


  泽伊内普·图费克奇的这些话语，框定了她对数字平台（如社交媒体）如何改变并影响我们生活和工作的社会政治结构的讨论。可以这样理解：在汽车发明之前，许多西方社区规模较小，我们居住的地方离工作场所、礼拜场所、子女接受教育的学校，甚至食物种植地都非常近。如今有了汽车、卡车、公交车、火车和飞机，我们无需再住在离这些场所如此近的地方。在某些情况下，人们居住得更为分散；而在另一些情况下，人们仍然居住和工作在一起，但支撑这些社区的农场却远在天边。我的父母和祖父母都在同一个县长大并定居；我的父母各自就读于他们父母曾就读的同一所高中，而这两所高中就在相邻的城镇；当我上高中时（在更远的一个城镇），我还曾在我父母和祖父母的母校参加的田径比赛中竞争。但当我上大学时，我去了外州，这个中西部男孩遇到了并娶了一位新英格兰女孩，此后我们几乎在美国的每个地区都居住过。我们的孩子甚至都不是出生在同一个州。


  正如工业技术及其配套基础设施的引入，逐渐导致了社会结构和人际关系的重大变化一样，^(¹⁸¹)数字技术的引入也带来了同样的变化，只不过速度更快。对于像我这样的人来说，这些变化意味着即使我们相隔千里，也能与家人保持联系。这意味着我可以追求一份需要多次跨州搬迁的职业。这意味着我可以通过在线进行职业发展，从而在不重返学校（并支付学费）的情况下实现职业转型。而这还意味着我的配偶可以亲自在一个州从事她的职业，而我则在另一个州为一家公司远程工作。数字革命对我及我的家庭来说是一次重大的范式转变。


  但对于许多人而言，这场革命并非数字化的。


  图费克奇关于技术改变社会结构力量的引文，主要是针对“阿拉伯之春”——2011 年席卷北非和中东、导致多个专制政府被推翻的抗议浪潮。在突尼斯、埃及等地多次尝试重大政府变革均告失败后，革命于
  2011 年席卷了阿拉伯世界的大部分地区。2011 年有何不同？


  在“阿拉伯之春”之前，这些国家的人们很容易生活在一种“多元无知”的状态中——当你因为根本不知道有多少人同意你的观点而感到孤立时，就会产生这种状态。当一个政府控制着大众媒体，而人们除了在少数值得信赖的朋友和家人面前之外不敢发声时，就很容易忽略还有数百万其他人也和你一样对现状不满。但数字技术，尤其是社交媒体，改变了这一点。正如图费克奇所写：“多亏了一个`Facebook`页面，也许历史上第一次，互联网用户可以点击‘是’来接受一场革命的电子邀请。”^(¹⁸²)


  这正是 2011 年在埃及发生的事情。


  2010 年，一名叫哈立德·赛义德的男子拍摄了埃及警察涉嫌“分赃毒品突袭战利品”的视频。^(¹⁸³)他广泛分享了这段视频，但 6 月 6 日，他在警方拘留期间死亡。许多人认为他的死是警方对他揭露其涉嫌腐败行为的报复。7
  月 19 日，一名活动人士创建了一个`Facebook`页面^(¹⁸⁴)，以引起人们对赛义德遭遇的关注。该页面名为“我们都是哈立德·赛义德”，据创建该页面的活动人士称，“因为我们所有人随时都可能面临同样的命运。”^(¹⁸⁵)


  时间快进到 2011 年 1 月。1 月 25 日是埃及的一个节日，名义上是纪念警察，但经常被用作反政府抗议的契机。^(¹⁸⁶)“我们都是哈立德·赛义德”页面发布了一个活动邀请——在开罗的解放广场举行抗议。该邀请迅速病毒式传播，最终有数十万埃及人加入了一场为期
  18 天的抗议活动。起初，穆巴拉克政府对这种在线“点击行动主义”不以为然。但正如在突尼斯一样，过去六个月的在线活动已经充分搅动了局势，促使人们走上街头。而当他们走上街头时，他们的“多元无知”就消失了。通过`Facebook`和解放广场，渴望变革的埃及人意识到他们并不孤单。他们呼吁穆巴拉克下台。当穆巴拉克意识到他既无法忽视抗议者，也无法安抚他们，更无法将所有人监禁或杀害时，他让步了。抗议开始十八天后，他将权力移交给了军方。^(¹⁸⁷)


  数字连接——特别是`Facebook`——永远地改变了埃及。如同在突尼斯一样，埃及的反政府公民能够互相发现、招募他人并组织起一场推翻政府的集会。但这并非事情的终点。并没有立即举行选举。相反，军方介入维持秩序，直到能够举行选举。而当选举举行时，那些推翻政府的活动人士并未充分组织成一个政党，甚至不是一个有意义的投票集团。穆斯林兄弟会介入了解放广场抗议留下的权力真空，在
  2012 年赢得选举，^(¹⁸⁸)并迅速试图将埃及推向一个更右倾的伊斯兰政府。这遭到了许多参与 1 月 25 日革命的埃及人的反对，并最终导致了一场政变^(¹⁸⁹)和提前选举，使现任埃及总统塞西上台执政。^(¹⁹⁰)


  1 月 25 日革命后随之而来的动荡清楚地表明了一件事：数字连接并非一股必然的民主力量。尽管它能改变社会结构，但并不一定会带来平等的参与、平等的代表权和透明的治理。而且，它不会以相同的方式改变每一个社会。就大多数“阿拉伯之春”国家的情况而言，数字连接和社交网络起到了催化剂的作用。它使已有的不满浮出水面，将潜在的革命者聚集在一起，并且——由于现有政府领导人对其力量缺乏理解而未加阻碍——以如此之快的速度颠覆了社会结构，以至于活动人士都无法跟上。`Facebook`的“无摩擦设计”^(¹⁹¹)使革命变得如此容易，以至于没有人慢下来去做社区组织、政党建设以及规划未来这些必要的工作。




  ### 这是我们在世界各地反复看到的一种模式，但在全球南方或许更为突出


  无论是埃及、巴西还是缅甸，年轻的民主制度与新兴技术的结合都可能引发动荡。当一个人正经历社会剧变、政治或民族冲突时，如果同时给予他言论自由*和*一部智能手机，结果充其量将是难以预测的。即便*每个人都怀着最好的意图*，情况也是如此。但当他们并非如此时，结果可能是灾难性的。


  归根结底，即使没有外国国家行为体的参与，社交媒体和数字连接也是一把双刃剑。新技术既非天生善良，也非天生邪恶，*更非天生中立*。每项技术都有特定的*可供性*和特定的*局限性*，虽然它们可能不带有价值判断，但确实倾向于产生某种特定的社会效应。当一个社会已经经历社会冲突或剧变时，这些效应往往会变得更加剧烈且更难预测。对于许多在几乎同一时间经历社会变革和快速技术应用的国家来说，这种技术——无论是好是坏（或两者兼有）——已永远改变了那些社会。


  #### 巴西的机器人水军


  巴西的政治格局充满忧患、支离破碎且不稳定。它是一个年轻的民主国家，直到 1985 年才摆脱独裁统治。截至 2014 年，巴西国会两院中有 28 个政党拥有代表席位，治理几乎完全通过联盟方式进行。这可能导致令人不安甚至灾难性的联盟，例如
  2014 年使迪尔玛·罗塞夫连任总统的那个联盟。作为 2010 年联盟建设的一部分，她任命了另一党派的成员米歇尔·特梅尔作为她的副总统竞选搭档。然而，当罗塞夫在
  2014 年连任后几乎立即爆发弹劾呼声时，特梅尔加入了反对派。2016 年罗塞夫被罢免后，特梅尔成为新总统。虽然巴西普通公民确实提出了关于罗塞夫执政的真正问题，但看来社交媒体机器人水军在影响公众情绪并促成最终成功的弹劾呼声方面发挥了重要作用。


  基于社交媒体的虚假信息是巴西政治中的常态。在巴西，政治竞选活动花钱在社交媒体上传播信息是违法的。巴西法律还规定，所有社交媒体竞选活动必须由“自然人”控制——即不能通过自动化运行。^(¹⁹²)
  然而，由于这些法律执行起来极其困难，自动化操作和网络谣言已成为巴西从总统选举到地方选举的众多政治竞选活动中不可或缺的一部分。


  在迪尔玛·罗塞夫的案例中，她的竞选团队和 2014 年总统选举对手阿埃西奥·内维斯的竞选团队似乎都使用了社交媒体机器人水军来传播竞选信息或互相抹黑。根据研究员丹·阿尔瑙多的说法，内维斯在总统竞选中使用机器人水军的程度比罗塞夫更广泛。^(¹⁹³)
  然而，一旦罗塞夫赢得选举，大多数反罗塞夫的机器人水军仍保持在线，并几乎立即加入了支持弹劾的运动。用阿尔瑙多的话说，“线上竞选从未结束，这些网络成为了制造弹劾支持的关键工具。”^(¹⁹⁴)
  雪上加霜的是，罗塞夫的社交媒体工具现在属于政府，这意味着更严格的限制和监督，这使支持弹劾的网络在线上占据了明显优势。


  机器人水军可能产生各种影响。有时这些影响微乎其微，甚至为零。毕竟，如果没有受众，即使是最活跃、最煽动性的机器人水军也只是在对着空气“大喊大叫”。2018 年的情况尤其如此，因为各平台已采取措施预防（即使无法根除）由自动化驱动的滥用行为。例如，推特现在更积极地删除机器人水军，并阻止新账户出现在搜索结果中或推动“热门”话题，直到它们显示出“有机”使用的迹象。脸书则大幅收紧了通过其应用程序编程接口（`API`）可执行的操作，使得自动化操作变得更加困难。然而在
  2014 年，平台的开放程度要大得多，自动发布的帖子、评论、转发/分享以及点赞/收藏在两个平台上都易于大规模管理，从而导致了脸书新闻推送和推特实时“趋势”中算法内容筛选被“入侵”。事实上，正如阿尔瑙多所述，在推特上“[关于罗塞夫弹劾运动]被转发最多的消息是由机器人水军生成的。”^(¹⁹⁵)


  我们无法量化自动化及其他虚假/欺诈性在线活动对巴西选举和弹劾结果究竟产生了多大影响。然而，从最常被分享内容的互动水平以及尽管违法却持续存在的竞选资金投入来看，其影响不容小觑。而当推特趋势、脸书新闻推荐以及
  YouTube 的“接下来播放”自动播放视频对用户遇到的内容产生重大影响时，即使直接影响力很小，一旦被操纵的输出成为后续算法分析的输入，这种影响也会被放大。（请回想第
  3 章关于算法反馈循环的讨论。）




  ## 在菲律宾“武器化”的 Facebook


  巴西并非唯一一个在选举结束后，其首次创建的社交媒体虚假信息机制仍被保留并改造后继续运作的国家。2016 年 5 月，在罗德里戈·杜特尔特总统当选后，菲律宾民众目睹了他竞选团队强大的社交媒体宣传机器成为新政府的关键组成部分。


  罗德里戈·杜特尔特一开始就处于劣势。如果以传统媒体的竞选支出来看，他可供使用的资金比一些对手要少。然而，他拥有一套强大的社交媒体机器。杜特尔特的团队转向线上，因为“有限的竞选资金迫使他们创造性地利用社交媒体空间。”^(¹⁹⁶)
  他们充分利用了 Facebook 在选举前为总统候选人提供的“培训课程”。在一个智能手机数量超过人口数量、且 97%的网民都使用 Facebook 的国家，^(¹⁹⁷)
  对 Facebook 的精通被证明是不可或缺的。


  杜特尔特的社交媒体团队由尼克·加布纳达领导，由数百名有联系的志愿者组成。“这是一场去中心化的竞选活动：每个小组创作自己的内容，但竞选叙事和关键的每日信息由中央统一确定，并层层传达执行。”^(¹⁹⁸)
  （这与我们在上一章探讨的同一年俄罗斯在美国的行动策略相似。）值得注意的是，杜特尔特支持者所推广的内容不仅仅是政策立场和无害的支持声明。许多杜特尔特支持者呼吁对其批评者实施暴力，导致
  2016 年 3 月出现网络暴民威胁要对一小群反对杜特尔特的学生施暴甚至杀害的情况。^(¹⁹⁹) 记者玛丽亚·雷萨（Rappler 网站创始人）称这是一种旨在恐吓或压制批评者的“千刀万剐”策略，即大量用户用网络威胁淹没目标。^(²⁰⁰)


  杜特尔特成为总统后，问题变得更糟。劳伦·埃特写道：“自 2016 年 5 月当选以来，杜特尔特已将 Facebook 变成一件武器。那些曾不择手段帮助杜特尔特获胜的
  Facebook 红人被带进了马拉卡南宫。”^(²⁰¹) 加布纳达告诉另一位 Rappler 记者：“（选举后）有必要继续竞选，因为他们只获得了‘40%的选票’，需要更多支持才能让杜特尔特有效执政。”^(²⁰²)


  这远不止是总统发推文，甚至是一个机器人团队放大他的信息那么简单。这是一项旨在巩固杜特尔特权力并压制反对者（无论是政客还是记者）的协调媒体战略的一部分。选举后不久，杜特尔特抵制私人媒体长达两个月，拒绝与任何独立记者交谈，仅通过国家控制的媒体推送宣传。与此同时，亲杜特尔特的网络喷子和傀儡账号（由真人控制的虚假账户）攻击批评政府的独立记者。当雷萨发表揭露其中许多活动的文章《宣传战》时，她立即遭到亲杜特尔特网络喷子的攻击，包括死亡和强奸威胁，以及要求她离开菲律宾的呼声。用雷萨的话说，自杜特尔特当选以来，“当有人在
  Facebook 上批评警方或政府时，立即就会有人发起攻击。”^(²⁰³)


  根据埃特的说法，这不仅仅是杜特尔特政府“入侵”系统或利用 Facebook 定向广告功能那么简单。除了向菲律宾总统竞选活动提供培训课程外，选举后 Facebook“开始深化与新政府的合作关系。”^(²⁰⁴)
  这并非特例，而是“Facebook 为世界各地政府所做的事情……提供‘白手套’服务，以帮助其最大限度地发挥平台潜力并采用最佳实践。”埃特继续说道：


  *   尽管杜特尔特禁止独立媒体进入黎刹典礼厅现场直播他的就职典礼，但新政府却安排活动在 Facebook 上直播，让世界各地的菲律宾人在迎接他们的新强人时，能够获得就职典礼前后活动的内部视角。


  尽管 Facebook 此后增加了对杜特尔特批评者进行即时代码攻击的某些操作的难度，但在杜特尔特的统治下，对独立记者的攻击仍在继续。2018 年 11 月，菲律宾政府宣布打算指控雷萨的媒体机构
  Rappler 逃税。Rappler 将这一指控定性为“恐吓和骚扰”。^(²⁰⁵)


  这个问题似乎不会很快消失。




  ### 缅甸的权力巩固


  杜特尔特政府并非唯一利用`Facebook`作为武器对付本国人民的政府。近期调查还揭露了缅甸军方针对该国少数族裔罗兴亚人开展的大规模信息行动。


  暴力和压迫在缅甸并不新鲜。缅甸是一个年轻的半民主国家，长期被独裁者和专制统治者掌控。政府压迫与不可信的国有媒体在这个国家屡见不鲜。佛教徒占多数的群体与罗兴亚人之间也存在长期的暴力冲突。罗兴亚人是穆斯林少数族裔，他们在
  1982 年几乎一夜之间失去了公民权。^(²⁰⁶)


  多年来，罗兴亚人一直遭受来自政府的法律歧视，以及来自不认同其宗教或族裔身份同胞的暴力。除了在教育、工作和法律地位上延续宗教歧视外，缅甸的佛教徒群体（常由僧侣领导）还定期举行集会，散播针对罗兴亚人的仇恨言论。这些集会甚至时常导致部分罗兴亚人丧生。


  暴力行为的规模以及针对罗兴亚人的精准程度，促使全球监督机构将反罗兴亚暴力定性为（未遂的）种族灭绝行为。^(²⁰⁷)


  缅甸在宣传方面也有着“悠久的历史”。《连线》杂志的蒂莫西·麦克劳林写道：“缅甸几十年来一直依赖国家运营的宣传报纸。”^(²⁰⁸) 几乎在整个大众传媒技术（报纸、广播、电视、互联网）的历史中，缅甸政府都控制着主要的媒体传播渠道。因此，对于如今生活在缅甸的人来说，他们一生中大部分时间所熟知的信息来源只有两种：独裁统治下的国有媒体，以及当地的谣言或闲言碎语。据美国前驻缅甸大使德里克·米切尔称：“缅甸是一个靠谣言运转的国家。”^(²⁰⁹)
  这一判断也与`Facebook`委托进行的一份人权影响评估报告不谋而合，该报告将缅甸描述为一个直到 2013 年左右仍“充斥着谣言的社会”。^(²¹⁰)


  所有这一切都发生在智能手机、`Facebook`或万维网出现之前。然而，数字技术的到来无异于往缅甸已经燃起的火焰上浇油。


  过去十年间，缅甸发生了两大关键变化：互联网（对大多数缅甸人而言，互联网基本等同于`Facebook`）的到来，以及（部分层面的）代议制民主的出现。


  尽管此前统治缅甸的军政府在 2011 年被解散，但人们普遍认为，缅甸首次真正开放的选举是在 2015 年举行的。^(²¹¹) 2015 年，部分缅甸人已经能够接入互联网，但正是在此之后，政府对新闻的审查以及对网络言论的控制才开始显著减弱（尽管并未完全消失）。由于数字技术的扩张恰逢长期存在的言论自由限制被削弱，缅甸普通民众普遍缺乏在互联网这样开放的信息环境中生存所必需的媒体和数字素养。而且，鉴于“对于缅甸
  2000 万联网公民中的绝大多数人来说，`Facebook`就是互联网”，^(²¹²fn212)) 这种媒体素养的缺失在`Facebook`的平台上感受最为深切。


  负面结果最初体现在缅甸佛教徒与穆斯林之间的整体关系上。新获得的言论自由以及能够接触到覆盖面广泛的平台，加剧了这两个群体间长期存在的敌意。同时，随着部分反罗兴亚人的歧视被写入法律，数字连接的增强尤其助长了佛教徒多数群体对穆斯林的压迫。正如布鲁金斯学会的一份报告所指出的：“独裁管制和新闻审查的突然取消——伴随着互联网和手机普及率的迅速攀升——为针对罗兴亚人的网络仇恨言论和仇外民族主义浪潮打开了闸门。”^([²¹³)


  即使在早期，仇恨言论及其引发的暴力行为也并非未知的问题。第一波借助社交媒体加剧的暴力事件发生在 2014 年。麦克劳林写道：“如果没有`Facebook`，这些骚乱就不会发生。”^(²¹⁴)
  就像推翻政府的“阿拉伯之春”起义一样，缅甸不断增强的连接性将紧张局势推过了临界点，使得 2014 年的大规模骚乱成为可能。麦克劳林还写道，`Facebook`在
  2014 年骚乱发生前，曾“至少收到过两次关于仇恨言论可能升级为暴力的直接警告”，但该公司将缅甸视为“连接机遇”，因而忽视了其平台上日益加剧的仇恨言论，以及这些言论可能在“现实生活”中煽动暴力的可能性。话虽如此，在
  2013 年，人权观察组织也*同样*否认了`Facebook`上仇恨言论激增是一个严重问题。对大多数人来说，首要的人权问题是如何增加数字技术的接入，以及这种接入必然会带来的社会、教育、经济和政治利益。


  当然，事与愿违。缅甸公民习惯了国家宣传与地方谣言工厂的结合体，他们并没有立即利用社交媒体，用平衡、深刻的新闻报道来取代国家宣传渠道。相反，他们在很大程度上将自己参与信息经济的角色转移到了这个新平台上——换句话说，他们把`Facebook`变成了他们过去习惯参与的那种地方谣言工厂的放大版。在一个被如此深层次的社会、政治和宗教紧张局势所困扰的国家，结果导致了虚假信息、错误信息和仇恨言论的增加，并进而造成了现实的人身伤害——这至少事后看来，并不令人意外。


  数字素养的匮乏、传播和轻信谣言的天性，以及根深蒂固的种族紧张关系，共同构成了缅甸军方针对本国人民发动心理战的背景。


  煽动针对罗兴亚人暴力的谣言和仇恨言论并非仅仅来自佛教徒公民，其中许多来源于缅甸军方。正如保罗·莫泽尔为《纽约时报》报道的那样，“一场在`Facebook`上持续了长达五年的系统性运动”中，“缅甸军方人员……将社交网络变成了种族清洗的工具。”^(²¹⁵)
  数百名军方人员在`Facebook`上创建虚假账号，用于监视公民、散布虚假信息、压制政府批评者、挑起对立团体间的争论，并发布关于罗兴亚人的“煽动性言论”。





  虽然这一行动主要发生在 Facebook 上，但它具有多面性。除了煽动性文字外，缅甸军方还使用了图片、模因和点对点信息，其中包括 Facebook Messenger
  上的数字式“连锁信”。在此次行动中，自动化技术并*没有*显著出现。与菲律宾一样，没有大规模机器人账号的参与。一支名副其实的“水军”部队通过数字化的“马甲”账号实时发动信息战。这与俄罗斯互联网研究机构在
  2016 年美国大选期间实施的操作之间惊人的相似并非巧合。虽然没有证据表明俄罗斯参与了缅甸军方的行动，但*确有*证据显示，缅甸军官曾前往俄罗斯学习其信息战策略。^(²¹⁶)


  在这场心理战（或称 PsyOp）中，军方的主要目标是罗兴亚人。但在 2017 年，他们的一些操作针对双方，同时向佛教徒和穆斯林传播虚假信息，告知每一方对方即将发动攻击。据莫祖尔称，“这场宣传活动的目的……是制造广泛的不安和恐惧感，而这种感觉只能通过军方的保护来解决。”这个初生的年轻民主政体对直至不久前还在统治国家的军方构成了威胁。他们利用民众普遍缺乏数字媒体素养以及不熟悉民主自由表达的弱点，将这一脆弱性转化为武器，瞄准了自己的人民。而通过针对本就已是网络虚假信息和仇恨言论受害者的罗兴亚人，他们无异于在已有的火上浇油，极大地加剧了二十一世纪最大的人道主义危机之一。


  ## 2018 年拉美选举中的成功案例


  2018 年夏季是拉丁美洲政治活动繁忙的季节。哥伦比亚和墨西哥举行了总统选举，委内瑞拉上演了伪装成选举的政治闹剧，尼加拉瓜则发生了重大动荡，反政府抗议活动层出不穷。那年夏天，我主要致力于监测和报道哥伦比亚与墨西哥的选举，并更广泛地研究拉丁美洲的（虚假）信息环境。我们没有观察到任何达到美国、菲律宾或缅甸那种规模的事件——这很可能（也希望！）是因为社交平台吸取了一些教训，并开始实施改革，使得开展有效的虚假信息操作变得更加困难（尽管绝非不可能）。然而，也出现了一种反趋势：不是由一个单一的不良行为者发起支持或反对特定候选人、政党或群体的宣传活动，而是我们观察到了许多服务于各种候选人和利益集团的小规模操作。我们还观察到一个新趋势，它或许可以解释
  Twitter 和 Facebook 上的小规模操作，但也对民主制度在不久的将来构成了重大威胁：点对点信息传播。让我们来剖析这些趋势。


  首先，社交网络。正如我和同事在我们的选举后报告中所总结的：


  -   我们分析了通过关键词搜索在 Twitter 上广泛收集的内容，以及在 Facebook 上更具针对性的目标。总体而言，我们发现在墨西哥有九个协调网络人为地放大支持或反对某个候选人或政党的声音，在哥伦比亚有两个协调网络。虽然哥伦比亚协调信息操作的规模明显较小，但其中一项操作具有国际重点，旨在煽动哥伦比亚、墨西哥、尼加拉瓜、委内瑞拉和加泰罗尼亚的反政府情绪和行动。虽然其中一些网络难以归属，但我们追溯到了某些负责人，并且其中至少有两个显示出外国介入的迹象。^(²¹⁷)


  这些网络大多自动化程度不高且手段简陋，据我们判断，其影响也微乎其微。事实上，其中一个仅在线约 48 小时的网络，恰恰展示了社交平台在检测和移除*僵尸网络*方面取得的进展。这是一个由
  38 个 Twitter 账号组成的网络，由一个我们在 Facebook 上追踪到的个人控制，每个账号每天发布数百条消息，这些消息从一个可选的小型帖子库中提取，导致每个帖子的数百个相同副本在整个网络中传播。这些信息总是反对最终获得第二名的总统候选人里卡多·阿纳亚，或者支持希望渺茫的候选人海梅·罗德里格斯·卡尔德隆（绰号“野马”）。我们将这个僵尸网络戏称为“野马机器人”。





  ### 牛仔机器人与社交媒体虚假信息的斗争


  牛仔机器人的存在时间非常短暂。我们几乎立刻发现了它们，并向`Twitter`举报，而在我们举报后的几小时内——也就是它们上线仅两天后——这些账号就被封禁了。导致封禁的原因是否就是我们的举报，这点不得而知。事实上，自
  2016 年以来，`Twitter`在识别大规模自动化操作和封禁账号方面已经进步了很多，不再依赖用户或研究人员的举报。这显然是一件好事。但我们也发现了数个与牛仔机器人类似的网络，它们为不同的候选人助阵，而其中只有一部分在选举前被平台封禁（如果它们被处理了的话）。同样值得注意的是，在实时发生的事件过程中——比如
  2017 年 8 月的“团结右翼”集会，或 2017 年 4 月的叙利亚化学武器袭击——一个机器人或虚假账号网络能在不到 48 小时内造成巨大破坏，尤其是当它们正在放大由真人或真人操控的非自动化虚假账号所推动的（虚假）叙事时。例如，我们在`Twitter`上发现了另一个反安纳亚网络，它利用自动化手段推广一系列`YouTube`视频，散布已被证伪的关于安纳亚涉嫌腐败的谣言。通过在总统大选最终辩论当晚及次日进行针对性操作，它们得以在公众注意力自然消退之前，不受账号封禁的干扰执行其行动。


  #### 拉丁美洲更隐秘的僵尸网络


  一个更加隐秘且持续时间更长的僵尸网络出现，旨在煽动拉丁美洲及其他地区的反政府情绪，甚至鼓吹暴力。该网络中的账号通常是在行动开始前几天或几周创建的，主要向委内瑞拉、哥伦比亚和尼加拉瓜的目标受众推送反政府信息，并附上`YouTube`及两个新创建网站的链接。


  这些账号的个人资料主题千篇一律，资料中给出的所在地看似虚假（在某些情况下，它们声称居住的城市-国家组合根本就不存在）。尽管这些账号自称是不同国家的不同个体，但它们发布的内容通常完全相同，而且总是节奏快、数量大。除了在委内瑞拉和尼加拉瓜传播反政府信息外，这些账号还积极尝试将哥伦比亚总统候选人古斯塔沃·佩特罗与`FARC`恐怖组织联系起来。`FARC`与哥伦比亚曾处于战争状态，直到
  2016 年签署了一项不得人心的和平协议。佩特罗对和平协议的支持，加上他的左翼政治立场，使他容易被描绘成共产主义者或恐怖分子，这个僵尸网络抓住了这一点。（佩特罗最终在决选中输给了右翼民粹主义者、批评哥伦比亚-`FARC`和平协议的伊万·杜克。）尽管该僵尸网络的大部分帖子是西班牙语，但偶尔也会夹杂一些英语推文，其中包括科技教程以及一个关注美国敏感社会问题的网站的链接。


  偶尔还会出现`Twitter`自动化与分析工具（哎呀）。


  很明显，拉丁美洲这个特定僵尸网络背后的个人或团体正在采取措施隐藏其地理位置。也有迹象表明他们可能并非来自拉丁美洲，例如偶然发布的英语内容，以及将讲同一种语言但居住在不同国家——甚至不同大陆——的目标受众混为一谈，其中还包括针对加泰罗尼亚用户的帖子。这很可能是一场外国影响力行动。但不幸的是——或者说幸运的是？——在我们可以做出高可信度的来源评估之前，该网络已被`Twitter`关闭。


  #### 最大威胁：点对点消息


  然而，拉丁美洲最大的威胁并非`Twitter`，也不是`Facebook`、`Instagram`或`YouTube`，而是点对点消息，主要是 Facebook
  旗下的平台`WhatsApp`。


  `WhatsApp`是一个消息服务，支持通过加密的数据连接进行文本、语音和视频通话，以及文件共享。对一些人来说，它代表了一种比`Facebook`或`Twitter`更私密（且更少被监控）的联系亲友的方式。对另一些人而言，它通过
  Wi-Fi 或数据连接提供语音、视频和文本服务，为他们节省了每月的电话费。无论出于何种原因，`WhatsApp`在世界某些地区越来越受欢迎，尤其是西班牙语世界。在许多`Facebook`使用率正在下降、而`Twitter`从未真正流行的地方，`WhatsApp`上却活跃着数字社区和信息共享。例如，根据哈佛大学尼曼实验室的数据，`WhatsApp`是墨西哥最受欢迎的社交平台。^(²¹⁸)


  `WhatsApp`和其他私密消息应用（如`Signal`、`Facebook Messenger`、`Slack`，甚至老式的短信和电子邮件）给虚假信息研究人员和事实核查员带来了巨大挑战。由于许多使用该应用的用户具有高度的连接性，真假信息都容易在`WhatsApp`上传播，甚至变得病毒式扩散。但由于消息是私密且加密的，没有简单的方法可以查看`WhatsApp`上以及哪些社区中正在流行什么。


  #### 为何私密消息如此难以监管


  正如我们已经探讨过的，心理学家和谣言专家迪方佐和博尔吉亚确定了影响一个人是否相信他们所遇到的言论的四个主要因素：


  -   该言论符合此人已有的态度（确认偏差）。

  -   该言论来自可信的来源（在社交媒体上，这通常指分享它的人，而非言论的真正来源）。

  -   该言论被反复遇到（这有助于形成*知觉流畅性*）。

  -   该言论没有伴随反驳。^(²¹⁹)


  或许应对像`WhatsApp`这类私密聊天应用上的虚假信息和错误信息，最大的障碍在于：我们不知道哪些言论被反复遇到（从而成为病毒式传播），这些言论的来源是什么，它们触及了哪些受众（以及这些受众已经持有何种偏见），因此事实核查员不知道哪些内容需要反驳。由于这些障碍，当我与关注拉丁美洲的研究人员和政策制定者交流时，点对点消息是他们最大的担忧。而且，鉴于反监控的迹象已显而易见，这在那些`Facebook`、`Instagram`和`Twitter`仍占主导地位的国家的研究人员和政策制定者中，也正成为一种日益增长的忧虑。^(²²⁰)


  #### 一线希望：Verificado 2018


  但希望并未完全破灭。2018 年墨西哥选举期间发起的一项倡议证明，在`WhatsApp`等私密通讯应用上揭露和反驳谣言及虚假信息是可能的。这项倡议名为`Verificado
  2018`。


  `Verificado 2018`是`Animal Político`、`Al Jazeera`和`Pop-Up Newsroom`之间的合作项目，并得到了`Facebook
  Journalism Project`和`Google News Initiative`的支持。他们的目标是揭穿与选举相关的虚假言论，并采用符合用户使用这些平台方式的方法。鉴于`WhatsApp`在墨西哥社交媒体格局中的主导地位，`Verificado`将其工作重点放在了那里。


  由于`WhatsApp`是一个点对点平台，其核心是向个人或亲友小群体分享消息，因此`Verificado`采取了小规模、社交化的方式来核查事实。他们设立了一个`WhatsApp`账户，让*个人*可以向他们发送需要核实的信息。`Verificado`的研究人员则会*逐一*回复他们的研究结果。这种个性化的接触方式（可以想象，当收到关于同一言论的多个查询时，其中必然涉及大量复制粘贴工作）对平台而言更为自然，并允许用户像在平台上与其他人互动那样，与`Verificado`进行交流。




  如今，在一场包含数千个单独竞选活动的大规模大选期间，面对一场协调一致的信息造假运动，`cut-and-paste`（复制粘贴）手法的扩展能力只能到此为止。因此，Verificado
  团队还设计其辟谣内容，以促进在 `WhatsApp` 上广泛分享，甚至达到病毒式传播。他们每天多次更新自己的公开状态，发布一条根据收到的私信而生成的辟谣信息。这些状态信息随后可以在平台上分享，类似于推文或
  Facebook 上的公开帖子。他们还制作了类似表情包的图片，其中包含虚假声明以及他们加盖的`真/假`评估印章。这促进了用户的参与，在用户心中将其`真/假`评估与原始图片关联起来，并且比单纯的文字或网页文章链接更能促进病毒式传播（不过，他们也在自己的网站上发布了更长篇的辟谣文章）。^(²²¹)


  出于与难以研究`WhatsApp`上错误信息和信息造假的覆盖范围与影响力相同的原因，衡量 Verificado 2018 年工作的覆盖范围与影响力也很困难。但共识是，在一个充斥着谣言、复杂的选举周期中，他们对信息环境产生了不容忽视的积极影响，并且在解决私人化的、病毒式传播的错误/虚假信息问题上，取得的进展比迄今为止几乎任何人都要大。他们的合作甚至赢得了一个“在线新闻奖”。^(²²²)


  点对点的信息造假不会消失。随着用户越来越担心社交媒体上的隐私、监控、定向广告和骚扰，他们常常退回到与亲近小团体之间的私人数字通讯中。对许多人来说，社交媒体的蜜月期已经结束，那些偶然建立全球联系的日子一去不复返。安全、保障和隐私成为新的关键词。在某些情况下，这意味着减少了接触谣言和心理战的机会。在另一些情况下，这仅仅意味着这些威胁更难追踪。这绝不是一个已经解决的问题，但像
  Verificado 2018 这样的例子给了我们希望，解决方案是可能的，而且我们可能已经掌握了一些行之有效的方法。


  ## 总结


  在本章中，我们探讨了全球南方地区近期的在线信息造假活动。从拉丁美洲到北非，再到东南亚，我们看到了社交媒体平台是如何放大谣言、使仇恨言论主流化，并成为心理战行动工具的。在某些情况下，这些错误信息和虚假信息不仅助长了政治运动和心理困扰，还引发了线下的暴力行为，甚至煽动了种族清洗和种族灭绝的火焰。


  在线信息造假问题比许多西方人所意识到的更为庞大和多样化。它比“假新闻”更严重，比俄罗斯和美国的另类右翼更严重，比世界上的班农家族和默瑟家族更严重，比推特机器人更严重，甚至比社交网络平台本身更严重。只要有信息存在，就有虚假信息存在，我们星球上没有任何社会能对此免疫。这是一个全球性问题，也是一个人类问题，它由技术推波助澜（而非创造）。当我们寻求解决问题时，我们需要一个全球性的、人性的——当然，也是技术性的——解决方案。


