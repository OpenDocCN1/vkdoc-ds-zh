- "# 1. 请注意\n\n## 信息过剩如何影响我们消费媒体的方式\n\n本章将阐释从信息经济向注意力经济的转变，并阐述这对互联网上信息创造、分享和消费方式的影响。从信息匮乏时代过渡到信息过剩时代后，信息已不再是足以驱动经济的可货币化商品。人类注意力作为供应有限的可货币化商品，其焦点地位使内容推荐算法在我们的信息格局和经济中占据了关键位置。本章为这些算法的出现勾勒出总体的经济、认知和技术背景。\n\
  \n\n\n### 品味是如何形成的\n\n你最喜欢的甜点是什么？\n\n我可能最喜欢一块美味的无面粉巧克力蛋糕。配上覆盆子、黑莓，或许再加点冰淇淋……当然，还得配上一杯浓缩咖啡、美式咖啡或一杯醇厚的黑啤酒——这种饮品能够化解甜腻、清爽味蕾，让每一口都像第一口那样美妙。\n\
  \n光是*写*这段文字，我就感觉自己长了好几斤。为什么所有好吃的东西都对身体这么不好？！\n\n真是这样吗？\n\n当我第一次在大学学习进化心理学时，我记得学到人类通常进化出了对*对我们有益*事物的偏好。^(¹¹)\
  \ 那些安全且有助于我们至少活到生育年龄、从而传递基因的事物。那些将某事与积极情绪联系起来的人，会更频繁地去做那件事。而我们将之与负面情绪联系的事物，往往会选择回避。我们寻求快乐多于痛苦，而那些以帮助生存和繁衍的事物为乐的祖先，嗯，他们确实存活了下来并繁衍了后代。那些以危险事物为乐的人，嗯，他们的基因就没那么容易被传递给后代。结果就是，我们二十一世纪人类所继承的基因，通常会使我们对有益于物种的事物感到愉悦，而对会危及集体生存的事物则产生痛苦以警示我们远离。\n\
  \n当然，这种对生物学和社会学上对物种有益事物的情感偏好，这种“品味”，也适用于食物。对我们有益的食物往往会带给我们愉悦感，而对我们有害的食物则往往味道很差，或引发我们的呕吐反射。\n\
  \n等等。这听起来好像反了。我不是刚刚还在哀叹所有*好吃*的东西实际上都对我们*有害*吗？！\n\n这个进化拼图还有另一块。这些进化出的偏好，被称为“适应机制”，帮助我们的祖先适应他们的环境。是*他们的*环境。让我们回到那块无面粉巧克力蛋糕。它的成分是什么？可可（当然）、糖、盐、黄油，以及大量的鸡蛋。从营养学角度看，这里面没有太多我们今天常听到的维生素、矿物质或纤维。相反，它们含有碳水化合物——准确说是“简单”糖分——脂肪和蛋白质。现代营养学家也经常提到这些东西。它们会导致超重、肥胖、心脏病、糖尿病、肾病，甚至牙龈疾病和蛀牙。这些成分位于食物金字塔的较上层，是我们应该少量摄入的东西。\n\
  \n既然我们应该少量摄入它们，那为什么我们进化出了如此强烈的偏好呢？对于身处富裕西方社会的我们来说，每天摄入 2000 卡路里轻而易举。但决定我们*今天*烹饪口味的基因，并非在如此丰饶的时代被筛选出来的。这些基因自数万至数十万年前的更新世时期以来就几乎没有变化。^(¹²)\
  \ 我们隐喻意义上的“味蕾”，是在还没有杂货店、快餐店、高级餐厅、百乐餐、冰箱、冰柜，甚至还没有农业的时代发展起来的。早在人类建造拖拉机、犁、马鞍，甚至弓箭之前很久，我们现代的食物偏好就已经被写入了基因密码中。\n\
  \n碳水化合物、脂肪、蛋白质。虽然今天我们强调过量摄入它们的危害，但它们都是身体产生能量、构建肌肉、保持良好运转所必需的。在一个拥有高效农耕和狩猎技术的社会中，这些物质相对容易获得，更不用说能够长期保存食物及其全部营养价值的技术了。但在\
  \ 15 万年前的非洲大草原上，我们的祖先可没有这样的技术。那些生物必需品——碳水化合物、脂肪、蛋白质——是*稀缺的*。极其稀缺。那些乐于摄入它们的人类会主动寻找，并因此更有可能找到并生存下来。在那个许多人类生活在饥饿边缘的时代，那些不去寻找这些珍贵成分的人，往往无法存活下来将他们的基因传递给我们。是幸存者编写了我们的基因密码，正是他们对那些在远古时代稀缺但至关重要的东西的品味，主宰着我们今天的烹饪偏好。\n\
  \n所以，我们热爱像无面粉巧克力蛋糕这样的东西。这并不是因为我们的祖先进化出了对巧克力蛋糕的品味，而是因为它完美结合了他们进化出偏好的所有那些必需但稀缺的东西。\n\
  \n我之前提到过，我们的基因密码自更新世以来变化不大。这是因为生活在丰饶时代的人类无法改写基因密码！如果大多数人类不再生活在饥饿的边缘，那么就不会发生与食物相关的自然选择。死亡驱动进化，基因缺陷被淘汰，而不是反过来。以过敏为例：我和配偶的过敏都非常严重，如果我们早生\
  \ 100 年，我们俩可能都会在生育前因过敏性休克而死。多亏了现代医学，我们活了下来！而且我们都把自己的过敏基因传给了孩子，导致他们生命最初的几年里就出现了一些严重的医疗状况。一旦我们不再处于灭绝边缘，那些*健康*优势就不再是*进化*优势了。因此，那些在我们物种遥远过去具有优势的东西，至今仍在主导着我们的偏好。\n\
  \n\n\n### 供给与需求：为何信息经济已难以为继\n\n我听到你们中有人问：\"所有这些与大数据、'假新闻'和宣传有什么关系？\"\n\n一切皆有关系。\n\
  \n我们祖先对食物的味觉是在食物*匮乏*的时代形成的。那些必不可少但稀缺的食材，成了最受偏爱和追捧的味道。然而，在*丰裕*的时代，这些偏好不再适用，尤其是当那些少量摄入必不可少、但过量摄入却有害的成分变得唾手可得时。我们对食物的天然本能，在相对丰裕的时代已变得危险。\n\
  \n我们消费信息的方式也是如此。我们处理信息的方式基于一段进化史——以及一种教育经历——在这段历史中，信息是*稀缺*的，或者至少是*昂贵*的。我们大部分控制感官与大脑连接的认知系统，早在智人出现之前就已进化成型。^(¹³)\
  \ 我们遗传密码的主体，早在文字发明之前就已相当固定，更不用说印刷术、大众传媒、广播、电视或算法新闻推送了。^(¹⁴) 我们判断现实、辨别安全与危险的本能，并不适应我们生活的媒体环境。我们如此适应信息匮乏的状态，以至于消费现代媒体就像试图对着消防水带喝水。\n\
  \n除此之外，我们大多数人接受的教育是在一个没有互联网的时代设计并为之服务的。那些能帮助一个没有电脑的家庭——甚至是在公共图书馆——判断所读信息真实性的工具和技巧，并未针对互联网生活进行优化。事实很简单：*我们大多数人不知道如何在互联网上核实事实*。我们不知道怎么做，也不知道如何*让自己*去做。当这种情况发生在一个社交媒体平台上——我们可以用手指轻点就能分享读到的任何内容——我们便加剧了问题，因为我们不加批判地*消费*媒体，导致我们不加批判地*发布*媒体。每次我们阅读时没有充分启用我们的\"\
  垃圾检测器\"，我们就不经意地传播了更多\"垃圾\"。那么，我们的社交媒体\"信息流\"就不仅仅变成了消防水带，而是一条充满污水的消防水带。寻找有益身心的内容变得越发困难。\n\
  \n这种转变不仅仅是进化或教育的问题。这也是关于经济的问题。我们都了解工业革命，当时——至少在西方——封建的、以农业为基础的经济（以及随之而来的社会秩序）让位于以市场为基础的工业经济。土地、血统或神权的统治让位于金钱和劳动的统治。贵族被商人取代。农场被工厂（以及后来的工厂化农场）取代。一种全新的社会秩序出现了。正如经济学家迈克尔·H·戈德哈伯所写：\n\
  \n* 当时的欧洲在 15 世纪仍大致沿封建路线统治，封建领主们想当然地认为，新世界将成为更大规模封建经济的空间，由公爵、伯爵、男爵和侯爵统治新发现大陆上的农奴。他们确实开始建立这个体系，但这并非最终在新空间中繁荣起来的东西。相反，刚刚起步的资本主义、市场导向的工业经济发现新大陆的土壤更为适宜。它在北美变得如此强大，以至于当它跨洋回流时，最终完成了在西欧以及随后在世界其他地区的主导地位。^(¹⁵)\n\
  \n换句话说，民主革命之所以在北美欧洲移民中爆发，然后才点燃欧洲本土，是有原因的。缺乏根深蒂固的贵族制度，以及对贸易和物质商品（由奴隶带回欧洲）的重视，使新大陆成为了一种不同的经济空间——在这里，物质商品的采矿与生产、运输能力，以及将其转化为*资本*的能力赋予了人们权力。这种以市场为基础的资本主义，以及任何人通过劳动和智慧在社会上改善自身地位的理念，构成了这个新共和国的基础（尽管有时更多是理论上而非实践上）。最终，它确实到达了欧洲，因为封建主义在许多地方逐渐让位于市场资本主义。\n\
  \n但这并非人类面临的唯一一次社会经济转型。封建主义不是第一个社会制度，资本主义也不是最后一个。（它甚至不是当今存在的唯一制度！）而且资本主义本身有多种形式。一些人指出，从基于商品和服务的经济到*信息*经济是重要的经济转型。这并非意味着西方资本主义消失了，而是曾经适用于材料（商品）和劳动（服务）的供需法则，现在适用于信息（数据）。\n\
  \n这样想吧。当某样东西稀缺但又令人向往时，我们称之为\"珍贵\"。黄金、白银、肥沃的土壤、脂肪、碳水化合物、蛋白质等。在市场经济中，如果需求高而供应低，人们会竞相交易，在资本主义经济中，他们用金钱交易。其价格上升，反映了社会赋予它的价值。如果供应高而需求低，价格下降，反映了社会赋予它的相对较低的价值。\n\
  \n在工业经济中，维持运转的供需方程涉及材料和劳动力——你能得到什么，你能用它制造什么，你能把它运到哪里？控制原材料和劳动力的人说了算。但是，当我们非常擅长制造东西，以至于供应压倒了需求，*即使是对我们最需要的东西*，比如食物、衣服或住房，会发生什么？这就是许多发达国家发生的情况，因为机械化和自动化使生产效率极高，推动供应飙升，同时大幅减少了对人类劳动力的需求——进而降低了其货币价值。当这两件事发生时，没人有钱花，而当他们花钱时，东西又太便宜，以至于没人*能*赚钱。经济便停滞不前。\n\
  \n但是，正如保罗·梅森在他的著作《后资本主义：我们未来的指南》^(¹⁶)中所指出的，资本主义相当有韧性。当一个经济领域的供需方程自我崩溃时，另一个领域往往会取而代之。在过去几十年里，随着生产成本（以及随之而来的劳动工资）在富裕的西方普遍下降，*信息*应运而生，取而代之。换句话说，现在说了算的不再是控制材料和劳动力的人，而是管理*信息*的人，他们对经济——以及社会秩序——拥有最强的掌控力。\n\
  \n然而，在我们进入一个新的、可能持续数世纪的信息资本主义时代之前，另一件事发生了。摩尔定律发生了。以工程师兼英特尔联合创始人戈登·摩尔命名的摩尔定律指出，半导体电路中给定空间内可容纳的晶体管数量大约每两年翻一番。^(¹⁷)\
  \ 在经济由信息供需主导的时代，这种处理信息能力的指数级增长是一个问题。再加上*存储*信息成本同样迅速下降，以及*复制*信息过程变得极其简单，信息经济在有机会独立发展之前，就已经被宣判了死刑。\n\
  \n\n\n### 排版后的内容\n\n早在 1984 年的第一次黑客大会上，斯图尔特·布兰德（Stewart Brand）就曾有名言：\n\n*   一方面，信息希望变得昂贵，因为它非常有价值。在正确的地方获得正确的信息可以改变你的人生。另一方面，信息希望变得免费，因为传播信息的成本正在变得越来越低。所以，你看到了这两者之间的斗争。^(¹⁸)\n\
  \n暂且不论“信息希望免费”这句话已成为一个有问题的口号，这种二元性（科利·多克托罗称之为“一个相当不错的禅宗公案”^(¹⁹)）正是将经济建立在信息基础上的根本问题。我们无法做到这一点。这就是为什么许多出版商和新闻媒体公司难以从印刷和广播转向数字化的原因。这也是为什么我们会有付费墙、广告拦截器和广告拦截器拦截器。你无法建立一个基于廉价生产、廉价复制并且——既然我们有了互联网——廉价获取的商品的市场经济。一些经济学家，如前文提到的保罗·梅森，认为这意味着资本主义本身已经死亡，信息时代将迎来一个准社会主义的*后资本主义*新时代。也许他们是对的。\n\
  \n或者，也许还存在另一种商品，而坚韧的资本主义仍有挣扎的余地。\n\n当戈德哈伯描述从封建主义到资本主义的转变时，他并没有止步于此。他实际上是在论述一种新经济的出现。不仅如此，还是一种新的*类型*的经济。\n\
  \n*   当代的经济思想源于那种以市场为基础的工业主义，这与之前的以封建自给农业为基础的经济截然不同。我们倾向于认为，正如我们所受的教育那样，经济法则是永恒不变的。这显然是错误的。这些法则只适用于特定的时期和特定的空间类型。封建主义的典型景观，点缀着小块田地、围墙村落和城堡，与工业化的城市、烟囱工厂、铁路、运河或高速公路景观截然不同。网络空间的“景观”也许只存在于我们的脑海中，但即便如此，它也是我们越来越多地生活的地方，而且它的面貌与前两者都截然不同。如果网络空间发展到涵盖地球上数十亿人之间的互动，那么这些互动类型将完全不同于过去几个世纪或更久以前盛行的模式。\n\
  \n*   如果你想在这个新世界里茁壮成长，你就不能误以为今天的公爵和伯爵们会自然继续繁荣下去，而是要学会用该经济形态固有的方式来思考。^(²⁰)\n\n这些术语是什么？戈德哈伯在\
  \ 1997 年，即万维网发明仅仅几年后（如果我没记错的话，也是我收到第一个`Juno`电子邮件账户的那一年）写作时，将这种新经济称为*注意力经济*。（戈德哈伯并非第一个使用这个术语的人，但他是最早详细讨论万维网的出现可能对我们后工业社会的社会经济结构意味着什么的人之一）。在注意力经济中，支配经济增长的供需方程不再涉及信息的供给与需求，而是*人类注意力的供给与需求*。正如马修·克劳福德所说，“注意力是一种资源——一个人只有这么多。”^(²¹)\
  \ 并且，随着信息变得越来越便宜、越来越容易创建、获取、分发和复制，注意力变得越来越稀缺，至少从那些从事信息行业的人的角度来看是如此。\n\n正如戈德哈伯所描述的，这不仅仅是可销售材料从一种类型向另一种类型的简单转变。这是一个完全不同的系统。在金钱流动方向与商品和服务*相反*（一种现代形式的贸易）的地方，金钱与注意力的流动方向*相同*。是的，我们仍然在购买东西（是的，内容生产者仍然购买广告，这有点像购买注意力），但我们越来越多地不是为了购买我们想要或需要的东西。我们是为了获得娱乐，而争夺我们注意力的赢家将得到我们的金钱。这意味着不同种类的交易、不同种类的销售和营销策略，以及这些交易发生的不同种类的市场。（用工业术语来说：`Facebook`是一家媒体公司、一个社交俱乐部、一个公共集会空间，还是一家广告代理商？）\n\
  \n### 如果你不为产品付费，你就是产品：注意力作为商品，参与度作为货币\n\n当谈到虚假信息和宣传时，这种经济转型有几个方面是至关重要的。首先，焦点——或者说瓶颈——是我们的注意力。我们认知系统的局限性是保持供需方程平衡的经济基石。如果我们要成为批判性的消费者，我们至少需要理解这一点。我们的注意力是在线、电视以及任何媒体形式中交易的主要“商品”。在很多方面，我们在这些交易中扮演着*更*核心的经济角色，即使我们的金钱没有参与其中。我们的注意力是商品，我们的“参与度”是货币——而且，巧合的是，*这就是追踪我们在线活动对于从事信息行业的公司如此重要的原因*。只要注意力经济存在，像`Cambridge\
  \ Analytica`这样的公司就会存在——这些公司利用关于客户、竞争对手甚至选民的数据，向他们提供定制广告，其明确目的是影响甚至操纵他们的行为。^(²²)\n\
  \n其次，因为我们的注意力是新经济的主要商品，我们日常使用的数字平台*旨在操纵和衡量我们的注意力*。正如前谷歌员工兼技术评论家特里斯坦·哈里斯所说，“一小部分人，在少数几家科技公司工作，通过他们的选择，将会引导今天十亿人的想法。”^(²³)\
  \ 或者用一种可能不那么反乌托邦的语气来说，我们最常使用的技术，就是那些被设计得如此出色以至于让我们不断回头的技术。但是，就像食物、酒精、性、开车、运动一样，即使是好的东西，如果漫不经心或过度使用，也会变得危险。\n\
  \n但无可否认的事实是，当平台通过广告赚钱时，更多的人在这些平台上花费更多的时间，它们就能赚更多的钱。然而，事情是这样的。虽然当你看到广告时（称为*展示*），它们能赚*一些*钱，但当你*点击*广告时，它们能赚多得多的钱。^(²⁴)\
  \ 但那次点击会让你离开平台，再也看不到另一个广告。除非这个平台如此之好，如此令人向往，如此值得你关注，以至于在你短暂访问网络其他地方后，你会很快回来。\n\n\
  换句话说，注意力经济使得将平台设计成令人上瘾的模式成为一项有利可图的生意。^(²⁵) 这对个人和社会来说都非常危险。当这些平台日益成为许多人获取新闻的渠道，也成为我们在最放松、最被动时经常使用的平台时，上瘾就成了我们许多人处理当今最重要议题的方式。哈里斯说，“我认为没有比这更紧迫的问题了……它正在改变我们的民主。”^(²⁶)\n\
  \n或者换一种说法，这次带有更强烈的反乌托邦色彩：我们的社交媒体平台是为宣传而设计的。\n\n\n\n### 算法推荐：人生一切问题的成因与解方\n\n我们先退一步，从整体上看一下这个过程是如何运作的。（我们将在第\
  \ 3 章中详细展开。）用户想要内容。无论是文字、音乐、电视、电影，所有这些媒体需求本质上都是对信息的需求。然而，信息无处不在。尽管我们对各种媒体的需求很高，但供给远远超过了需求。内容的数量以及我们获取内容的便捷性，都确保了总有大量免费或低成本的媒体可供我们访问。\n\
  \n当然，问题在于内容创作者需要获得报酬，否则他们就无法创作这些内容。（虽然许多内容创作者将其作为副业，但如果不再有电影制作人、词曲作者、小说家或记者将其手艺作为全职、长期的职业生涯，我们的社会无疑会变得贫瘠。）供需关系如此有利于消费者，以至于创作媒体的平均成本正迅速趋近于零^(²⁷)。然而，令人惊叹的是，人们仍然在媒体上花费大量——非常多的——金钱。但随着供应和访问量持续增加，分得一杯羹的机会正在迅速减少。因此，内容创作者要想赚钱，就必须在喧嚣中脱颖而出，成为吸引我们注意力的那一个。\n\
  \n媒体消费者想要内容。媒体生产者需要消费者的注意力。不仅如此，媒体消费者想要剔除所有垃圾，找到好东西——无论是娱乐、教育还是新闻。而媒体生产者需要让自己的内容出现在*正确*的受众面前——那些真正在乎到愿意为自己辛苦赚来的钱买单的人。\n\
  \n消费者想找到合适的媒体。创作者想找到合适的受众。而他们正试图在网络上找到彼此。听起来有点像婚恋网站。在某些方面，这*正是*它的本质。\n\n从核心来看，婚恋网站就是一个推荐引擎。通过收集关于你的数据，并将其与其他人的数据进行对比，它会推荐你可能合拍的人。输入数据可能来自一份冗长的问卷或心理人格测试，也可能仅仅来自你的行为——数百次左滑右滑。但归根结底，过程是一样的。获取输入数据，通过算法运行，产生推荐。（并且，在更好的系统中，收集有关推荐效果的数据，以便改进算法。）\n\
  \n在将消费者与内容匹配，或媒体生产者与受众匹配时，过程也是相同的。微调算法来匹配用户与内容，最大化契合度，让消费者对自己的选择满意，让生产者因劳动而获得报酬。然而，与婚恋网站的重大区别在于，如果婚恋网站成功，你找到了人生挚爱，就再也不需要那个网站了。但如果媒体推荐引擎成功，你不仅会在周五晚上找到一部好电影，还会在周六回来再看一部。而且请记住，*平台*本身也在争夺我们的注意力。`Netflix`、`Hulu`、`Amazon`、`Pandora`、`Spotify`、`Twitter`、`Facebook`……它们让我们回访的次数越多，无论我们消费什么媒体，它们自己赚的钱也就越多。\n\
  \n这看起来是一个三赢的局面。平台提供推荐；我们找到“个性化”的娱乐选择，最大化我们的观看/聆听/阅读乐趣；内容创作者有办法为自己的作品找到*正确*的受众，以最小的努力最大化收入；而我们每次给某首曲目点赞或点踩，或给某部电影评分时，推荐都会变得更好——对我们和内容创作者都是如此。随着推荐越来越好，平台也收获了自身的回报。（当一个媒体平台也从事内容创作业务时，这对它们来说是双重收益。）\n\
  \n但这个系统并非没有缺陷。我已经讨论过它如何从根本上为我们的上瘾做好准备，促使我们无意识地、出于习惯而非刻意地回访。但还有其他问题。为了做出最佳的推荐，平台需要大量关于我们和内容的数据来喂养其算法。随着平台竞争日益激烈，计算资源越来越廉价，平台收集的关于我们的输入数据量正迅速增加。\n\
  \n这种数据收集常常在我们不知情的情况下发生。我们可能同意了服务条款，但这些条款所隐含的细节并不总是透明的，而且在我们已经深度融入平台后，它们有时还会发生变化。这种数据收集也发生在我们*放松警惕*的时候，在我们最不警惕自己向谁、为了什么目的提供了什么信息的时候。这不是我们的银行对账单、抵押贷款协议、主要学期论文——那些我们小心翼翼、深思熟虑对待的东西。这是我们在每天早晨第一杯咖啡前，有时甚至是在起床前阅读的东西。这是我们开车上班或跑步时聆听的东西。这是我们睡前小酌时观看的东西。我们谈论的是我们听的音乐、看的节目、读的新闻、我们对它们的评论、我们“赞”的朋友孩子的照片、我们用愤怒表情回应的新闻故事、我们花最多时间看的图片，更不用说我们点击的广告了（以及在某些情况下，随之而来的信用卡消费）。所有这些都被记录下来，其中大部分被平台使用，甚至交易或出售，以便推送最有可能让我们在其平台上停留最久、回访最频繁的内容。这种数据收集导致了黑客攻击、泄密、泄漏，以及在某些情况下，那些对我们了解得有点过多的定向广告。（还记得几年前那个案例吗？一位家长在女儿公布消息之前，就因为收到的广告发现自己十几岁的女儿怀孕了。^(²⁸)）\n\
  \n还有另一个问题。为了让平台最大化吸引我们的注意力，并最大化收集数据，它们往往力求成为一站式商店。`Amazon`、`Facebook` 和 `Google`（以及它们之前的\
  \ `Yahoo!`）或许是这方面最好的例子。同一个“信息流”既为我们提供新闻，也为我们提供远方亲戚的更新，对某些人来说还充当着职业发展网络。然后，广告鼓励我们加入能结识有共同宗教信仰的人的群组，或者仅仅是买一双新鞋或一部升级版智能手机。通过这种多样化的内容来最大化我们的注意力，平台同时也*分散*了我们的注意力。正如琳达·斯通所说，它们将我们推入一种“持续部分注意”的状态，没有任何一件事能主导我们的思维。^(²⁹)\
  \ 这不仅让我们无法缓慢而深入地思考任何一件事，还会导致我们不断地在不同的焦点之间来回切换。由此产生的“注意瞬盲”（正如一些认知心理学家所称的^(³⁰）是一段再次寻找方向的时间。而当我们不断地喘口气、在地图上找到自己的位置、切换认知任务时，我们便发现自己陷入了斯通所说的“一种人为的持续危机感”。这不仅仅是心理问题，更是思考问题。我们无法慢下来，无法深入钻研，无法批判性思考。而我们在这些平台上花费的时间越多，我们处于“注意瞬盲”、持续认知危机中的时间也就越多。\n\
  \n当我们发现自己经常*在我们获取大部分新闻的平台*上处于这种心理状态时，我们就被完美地预设为易受宣传影响。但究竟什么是宣传呢？\n\n\n\n### 宣传的定义\n\
  \n*宣传*一词源于*传播*（propagate）——意为扩散。在其最古老的语境中，它仅指通过口耳相传或印刷媒体传播信息。从这个意义上说，它既类似于*出版*（公开发布），也类似于*布道*（分享好消息）。但在现代，这个词已带上了更为险恶的色彩。在他*的经典著作《宣传：塑造人们的态度》中，雅克·埃吕尔写道：\n\
  \n> 宣传是由有组织的群体采用的一套方法，该群体希望通过心理操纵，使大众在心理上达成统一，并被纳入一个组织，从而在行动上实现主动或被动的参与。^(³¹)\n\n\
  我认为这一定义很有帮助，但对于数字时代而言仍显不足。将*组织*视为核心主体，并以扩张该组织为目标，这只能解释我们在网上所见宣传活动的冰山一角。如今，成为某个组织的正式成员这一概念，在很大程度上已被参与某种运动所取代，且参与程度各有不同。这种“成员身份”内涵的差异，以及现代公民所能接触到的各类信息和媒介，都要求我们在定义宣传时加入一些不同的细微差别。\n\
  \n有鉴于此，我将宣传定义为：使用一种或多种媒介传播信息，旨在*通过心理操纵*（而非理性讨论）改变他人的思想或行为。非宣传并非不存在偏见——我们都有偏见。宣传是（通常有目的地）试图隐藏偏见，将非事实呈现为事实，不完整地或剥离其关键背景地呈现事实，引导思想远离那些能让我们批判性地识破偏见、辨别真伪的理性思考过程。宣传可能涉及*虚假信息*（（源自俄语*dezinformatsiya*）——一种有目的的欺骗或操纵行为——或*错误信息*，即无意中传播的虚假陈述和谬论。在网上，我们经常看到两者协同作用——一个有目的的欺骗行为，以某种方式传播，使得被欺骗者真诚地帮助其扩散。我将这种多阶段宣传称为*信息洗白*，因为最初的虚假信息通过善意的人们被洗白，他们的行为既传播了信息，又掩盖了信息来源。\n\
  \n有了这些定义，我们就能明白媒体成瘾、侵入式数据收集和持续的“注意力眨眼”是如何让我们容易成为信息操作的受害者的。我们在鼓励浅层思维的平台上花费的时间越多，我们就越少批判性地审视我们所接触的信息及其来源。我们的媒体消费行为越“社交化”，我们就越容易放松警惕。我们切换认知档位的频率越高，我们在需要时深入思考的能力就越差。而收集到的关于我们的数据越多，这些信息操作就能变得越精细、越具有针对性。哈罗德·D·拉斯韦尔写道，宣传试图将他人置于从属地位，“同时降低获取权力的物质成本”。^(³²)而我们基于算法的现代媒体平台，或许提供了人类历史上实现这种成本降低的最大机遇。\n\
  \n但并非全无希望。埃吕尔写道：“宣传使得[民主]的真正行使几乎不可能”（第 xvi 页）。随着社交媒体为宣传机器提供动力，许多批评者正在敲响现代民主的丧钟。然而，那些助长信息操作、加剧社会两极分化并可能左右选举的工具，*恰恰也是能帮助我们抵抗的工具*。埃吕尔还写道，由于宣传使人非人化，并削弱了我们个人和集体的能动性，“宣传在简单对话开始的地方停止”（第\
  \ 6 页）。而开启这种对话的最佳地点，莫过于社交媒体了。\n\n我理解。轻易地否定社交媒体，甚至整个网络，并怀念旧式的人际联系（顺便说一句，这些联系实际上并未消失）是很容易的。但正如新媒体学者克莱·舍基所说：“我们正处于其中的变化并非微不足道，也并非可有可无，但其轮廓也并非一成不变。”他继续说道：\n\
  \n> 我们较旧的消费习惯并非美德，它们只是生活在信息获取匮乏环境中的副作用。对我们刚刚脱离的偶然匮乏的怀旧只是一种插曲；主戏是努力塑造这个世界有史以来最伟大的表达能力的扩张。^(³³)\n\
  \n如今的媒体格局与仅仅十年前相比已是天壤之别。就像社交媒体信息流的不断更新时常提醒我们的那样，在这个美丽新世界里，没有什么是永恒不变的。至少现在还没有。我们有机会塑造它，既作为内容的消费者，也作为支撑这些平台的内容的生产者。\n\
  \n但要进行抵抗、重新绘制媒体和社会的蓝图，我们首先需要了解它是如何运作的。在接下来的两章中，我们将深入探讨我们*自身*在接触信息时是如何工作的，然后探讨*系统*是如何工作的。这些知识，加上本书后半部分探讨的例子（既有充满希望的，也有令人遗憾的），将为我们寻求解决宣传问题提供必要的立足点。\n\
  \n但现在，我想与大家分享我听过的一些关于新媒体的最佳建议。\n\n> 向那些让你注意力自动化的机器中撒点沙子。\n> \n> ——霍华德·莱茵戈德^(³⁴)\n\
  \n## 本章小结\n\n在本章中，我们了解到西方资本主义已从基于商品的经济转变为基于注意力的经济。日益支配我们与信息互动方式的供求方程式，处理的是人类注意力的有限供应和日益增长的需求，而非信息、商品或服务。\n\
  \n算法推荐引擎和社交媒体信息流被创造出来，旨在帮助用户找到最相关的内容，并帮助媒体生产者找到最合适的受众。但是，媒体生产者争夺我们注意力的方式，为使算法运行而挖掘的大量个人数据，以及我们认知系统自然运作的方式，这三者结合起来，使得现代媒体格局成为宣传的温床。\n\
  \n然而，如果我们理解了经济、生物和技术，我们就能开始对抗这些负面影响，甚至可以利用同样的工具来解决宣传问题。\n\n脚注 1 2 3 4 5 6 7 8 9\
