- '# 4. 国内动荡


  弗格森、玩家门与美国另类右翼的兴起


  在迈克尔·布朗被枪击后的整整两天里，密苏里州弗格森市爆发了大规模抗议和集会，主流新闻媒体，甚至脸书上都鲜有报道。然而，全国相当一部分人都知道了这些抗议活动、主要的影响人物，以及新兴的“黑人的命也是命”运动。通过推特，抗议者们得以协调行动，躲避催泪瓦斯和
  LRAD（远程声学设备），甚至将手机充电宝送到运动领袖手中。推特（和 Vine）上的这些活动将事件直接呈现在公众眼前，并最终进入了美国主流新闻媒体的视野。这场分水岭式的运动让许多人认识到了大众新闻媒体的局限性，以及参与式媒体在塑造对话和推动社会变革方面的力量。但这并非其全部影响。


  几乎在弗格森骚乱的同时，一群网络“喷子”（骚扰者、施虐者及其他不良行为者，通常公开活动）出现了，他们向“社会正义战士”发动了一场文化战争，认为这些人是他们线上游戏社区世界的威胁。许多游戏设计师和评论家——尤其是三位女性——发现自己成为了虚假信息、有组织的网络骚扰，以及对她们自身及其朋友和家人安全可信威胁的受害者。社交平台和执法部门的反应迟缓且无效，许多人的生活因此被彻底改变。对许多人来说，玩家门是一个关键事件，它让社交媒体（包括推特“机器人”（自动账户）和“傀儡号”（由匿名真人实时管理的虚假账户））的阴暗力量为更广泛的人群所认识。但那些阴暗力量并未止步……


  在本章中，我们将探讨社交媒体的某些相同赋能如何被用来发展政治光谱各方的运动——既有旨在建设的运动，也有意在破坏的运动。这些运动将深刻改变美国的政治版图，并且很可能产生长远影响。


  ## 人群控制：弗格森的推文如何引导主流媒体与公众意识


  在宣布对枪击迈克尔·布朗的达伦·威尔逊不予起诉时，圣路易斯检察官鲍勃·麦卡洛克表示：


  > 这项调查中遇到的最大挑战，便是 24 小时新闻周期及其对任何可谈论之事的贪婪渴求。紧随其后的，是社交媒体上无休止的谣言。^(⁷⁵)


  抗议领袖德雷·麦基森在推特上回应道：


  > 麦卡洛克又对社交媒体进行了挖苦。但如果没有推特，他本可以说服全世界我们根本不存在。#Ferguson^(⁷⁶)


  社交与独立媒体已成为 21 世纪（反）社会活动运动的基石。阿拉伯之春、弗格森、#玩家门、#黑人的命也是命、#蓝人的命也是命、#我也是——所有这些运动都依赖社交媒体来实现其目的。这一点在弗格森事件中尤为明显，新兴的活动领袖德雷·麦基森（`@deray`）、乔内塔·埃尔齐（`@Nettaaaaaaaa`）和泰夫·坡（`@tefpoe`）利用推特在圣路易斯地区组织抗议活动，并警告活动人士注意警方的存在和行动。与此同时，抗议者利用推特、Instagram
  和 Vine 记录据称的警方暴力行为，并在警方设立的新闻禁区之外“报道”事件。而许多遭受警方侵害^(⁷⁷)或勇敢地融入抗议者（在禁区之外）之中的记者，则使用推特、Vine
  和视频直播实时发布新闻。


  这些社交媒体平台的去中心化特性，使得团体和个人能够绕过主流媒体渠道，快速传播信息。它们也允许，或许甚至是要求，一种不同的活动领导方式。在弗格森，这招致了奥普拉·温弗瑞等人的批评，他们呼吁这场运动需要更多领导力^(⁷⁸)——换句话说，需要一个中心化的声音。但正如活动人士（当然是在推特上）的回应所表明的，这场运动确实有领导力——只不过是一种不同类型的领导力。


  肖恩·金对奥普拉的回应很能说明问题：


  > 我爱`@Oprah`。曾是`@Morehouse`的奥普拉学者。她的话暗示了一件事……她对弗格森的所有了解都来自晚间新闻。^(⁷⁹)


  这里的指责并非奥普拉错了，而是她获得了错误的信息。她并不理解这场运动所使用的媒体，也不理解运动围绕着这些媒体进行组织的方式有何不同。


  奥普拉并非个例。尽管弗格森抗议主要是线下抗议，但其影响范围、持久性和影响力在很大程度上得益于社交媒体，尤其是推特和 Vine。要理解弗格森事件如何展开，及其对兴起的#黑人的命也是命运动的影响，就需要理解社交媒体的格局，以及活动人士如何利用它来协调行动、传播信息和引导叙事。




  ### 2014 年 8 月 9 日：弗格森发生了什么


  我最初是在推特上得知这个消息的。2014 年，这句话几乎可以指代任何事情。那一年毫无疑问是我在推特上最活跃的一年。我将它用于研究、教学（我甚至*让*我的学生在课堂上发推文，并通过公开的推特聊天采访来访学者），以及与全球其他研究者合作。我办公室有两台电脑显示器，其中一台经常完全用来运行`TweetDeck`，这是我首选的推特客户端。一位学术同行说，我的设置看起来就像在交易股票，因为几列不断更新的推文飞速从屏幕上滚过。


  但这一次，我指的是弗格森。8 月 9 日迈克尔·布朗被枪杀，警察将他的遗体留在街上数小时，以及随后几天的悼念活动和守夜仪式。


  我最初是在推特上得知此事，当时我的一位住在圣路易斯的大学朋友正在参加其中一场守夜活动，哀悼者离开教堂后，迎接他们的是身着防暴装备的警察。我最初是在推特上得知，警察设立了新闻禁区，禁止记者行使第一修正案赋予的观察和报道抗议活动及警方回应的权利。^(⁸⁰)
  我最初是在推特上得知，记者韦斯利·洛厄里和瑞安·赖利在一家麦当劳给手机充电时被捕。^(⁸¹) 我最初是在推特上得知，警察向人群发射催泪瓦斯，人群中包括婴儿和幼儿。我最初是在推特上得知，警察使用了远程声学设备（LRAD），这种心理武器会让人群迷失方向，并可能导致永久性听力损伤。我最初是在推特上得知，国际特赦组织已向弗格森派遣观察员，以观察和记录警方可能侵犯人权的行为。^(⁸²)


  连续好几天，我都是最先在推特上得知这一切。事实上，至少有三天，我*只*在推特上得知这些消息。（还有 Vice News 的直播流——我也是在推特上得知的）。我记得看到一些特别令人不安的事件发生时，我问我的妻子——她从没有过推特账号——*你能相信弗格森正在发生什么吗？！*
  她回答说，大意是：*弗格森是什么？*


  当时，我用推特，她用脸书，而且我们家里没有电视。我们在社交媒体或主流新闻网站上获取新闻。而我的推特信息流被弗格森刷屏，她的脸书信息流（和许多美国人一样）却被冰桶挑战和朋友们孩子的可爱照片占据。而且至少在两天里，主流媒体似乎也还没听说弗格森。


  弗格森事件不仅尖锐地暴露了警察暴力、警察军事化和种族不公的弊端，也尖锐地暴露了主流媒体与社交媒体之间的差异，以及由算法驱动的社交平台（如脸书）与仍然按时间倒序排列的推特信息流之间的区别。虽然三者——主流媒体、算法社交媒体和按时间倒序的社交媒体——都能让某些人获得更多信息和/或更大的受众，但每种平台都偏向不同的声音和不同的信息，并且每种平台都利于不同形式的群体组织。


  ### 一场运动在“无领袖”活动家于推特上组织时浮现


  当我在远处观察弗格森事件的发展时，我实时看到了组织结构的涌现。起初，几乎谈不上有什么组织。亲身在场的人和不在场的人都在分享信息——有些是真的，有些后来被辟谣。这些内容大多带有`#ferguson`话题标签，我在`TweetDeck`上单独开了一列来追踪它（旁边一列是我认为报道可信的记者的推文）。我早期观察到的内容很原始——信息、情绪、去中心化，没有统一的社区声音。


  然而，当地社区有需求，这些需求塑造了他们的对话，对话开始呈现出结构。当警察设置路障时，抗议者互相通报警察的位置和他们自己的位置，以便他们能够避免被捕、逃离催泪瓦斯，或组成更大的面对面群体互相支持。当警察拿出催泪瓦斯、LRAD
  或开始发射橡皮子弹时，抗议者互相分享这些信息。有些人将此视为避开该区域的信号，而另一些人则视为带着相机涌入、记录大多数媒体没有报道的事件的信号。当人们需要医疗救助而救护车无法穿过警戒线或抗议人群时，他们利用推特向可能提供帮助的人传递消息。当然，有经验的抗议者分享了应对警察新战术的建议——在哪里可以找到防毒面具，如何自制防毒面具，为什么应该用牛奶而不是水冲洗眼睛，在哪里可以买到耳塞等等。


  推特给了每个参与者一个平台，而`#ferguson`话题标签给了这些参与者听众。推特还允许人们从远处“参与”——表达声援、联系中西部其他城市的组织、提供专家战术建议。但随着骚乱消息的传播，推特也允许人们进行干扰，无论是当地还是远距离的干扰。许多在*谈论*弗格森的人和那些试图在*弗格森当地*组织的人使用了相同的话题标签。并非所有谈论弗格森的人都在帮忙，也并非每条被转发的信息都值得传播。


  但这个话题标签不仅给了个人一个广播平台，它还给了人们一种相互找到彼此的方式——一个“被黑掉的公共空间”^(⁸³)，它像一个数字社区中心一样运作。这导致了真实的个人联系和对话——一种建立社区的方式，也是一种筛查煽动者的方式。很快，出现了一些声音，他们（1）确证在场，（2）可靠，（3）容易联系，并且（4）有广泛的传播力。当话题标签变得嘈杂，或社区中每个人都没有时间核实每一条事实主张时，这些声音就成为了可以信赖的领导者。他们不仅是了解并发布最佳信息的人，也是可靠的传播渠道——可以在分享信息时@他们，以便他们能将有用且紧迫的信息传播给社区。


  其中一位涌现出来的领导者甚至不是来自圣路易斯。来自明尼苏达州的一位中学管理员德雷·麦凯森，^(⁸⁴) 在网上听说了抗议活动，并很快亲自南下支持这场运动，主要是在周末。凭借他对抗议和推特的专业知识，他迅速成为了这场运动中涌现的领导者之一。也成为警察的目标。在接受《大西洋月刊》采访时，他谈到了弗格森抗议领导层涌现的性质：




  > 弗格森存在于抗议的传统之中。但弗格森的不同之处，或者说弗格森的重要意义在于，这场运动是由普通民众发起的。……抗议活动形成了一些组织结构，这些结构确实很强大。但发起抗议时并不需要这些结构。……`Twitter`
  让这一切成为可能。^(⁸⁵)


  `McKesson` 在这次采访中没有具体说明这些结构大多是什么。但我们已经注意到了其中的几个。首先，正如 `McKesson` 在那次采访中所强调的，一场运动可以由任何人发起。社交媒体赋予每个人发声的机会，如果被合适的核心群体听到，就能迅速放大到全国乃至全球观众面前。运动的领导力也是涌现的。最终成为领导者的人，可能是像圣路易斯市议员
  `Antonio French` 这样在当地根基深厚的人——他是 `Twitter` 上的主要声音之一，并因涉嫌非法集会而被捕^(⁸⁶)；也可能像 `McKesson`
  这样从外地来到弗格森加入并接过接力棒的人；还可能是像 `Alicia Barza`——`#blacklivesmatter` 的创始人——这样，原本就在向全国听众讲述警察手中种族不公问题的人。`#blacklivesmatter`
  运动早于弗格森事件，但因弗格森事件而获得了更广泛的公众关注。^(⁸⁷)


  或许最重要的是，这场运动的结构灵活且能应对当下的需求。涌现出的领导者和传播策略是面对意外情况时特定需求的结果。标签与 `@` 提及的结合、公开推文与私密直接消息的分叉使用、文字与嵌入式
  `Vine` 视频及直播的运用，乃至手机的共享与充电——所有这些涌现出的具体实践，都诞生于当下的需求，并结合了技术的可供性与局限性。对于运动外部——或只是缺乏
  `Twitter` 素养——的许多人来说，这看起来可能混乱且“无计划”，但鉴于社区对这些工具的熟练运用，它赋予了参与者原本不具备的灵活性。事实上，如果没有 `Twitter`
  和 `Vine`，很可能根本就不会有所谓运动发生。或者，用 `McKesson` 的话说：“如果不是社交媒体，密苏里州会让你相信我们根本不存在。”^(⁸⁸)


  ### 谁来决定讲述哪些故事？


  尽管 `Twitter` 具备促进社区组织和信息传播的能力，但其整体用户基数仍然相当小。根据 `Pew Research` 的数据，2014 年只有不到四分之一的美国成年人使用
  `Twitter`。^(⁸⁹) 考虑到骚乱的种族色彩以及美国高度分化的社交媒体生态，^(⁹⁰) 新闻需要那么长时间才能进入主流视野也就不足为奇了。事实上，在第一篇关于骚乱的主流新闻报道之前，带有
  `#ferguson` 标签的推文已经超过了 100 万条。^(⁹¹) 弗格森警方积极控制和封锁新闻的做法更是雪上加霜：他们将（大多数）记者限制在“记者围栏”内，使其远离实际冲突现场，并向他们提供警方的新闻稿；逮捕正在拍摄警方行动的《华盛顿邮报》和《赫芬顿邮报》记者；甚至向
  `Al Jazeera` 的一个摄制组发射橡皮子弹。^(⁹²)


  但最终，主流媒体确实听到了这个故事——不仅是警方的说法，也包括抗议者的声音。联邦调查局也听到了，并对弗格森警察局的行为进行了调查（并随后予以谴责）。国际特赦组织也派出了观察员，他们同样指出了针对抗议者的人权侵犯行为。


  但如果这个故事没能被广泛传播呢？如果它仅仅停留在弗格森呢？


  从一开始，不只是全国性主流媒体没有报道弗格森事件。Facebook 也出奇地沉默。如前所述，当 `Twitter` 按时间倒序排列的信息流被 `#ferguson`
  占据时（对许多美国人来说），Facebook 的算法信息流却并非如此，有时甚至对同一个人也是如此。^(⁹³) 算法会做出“决策”，而这些决策影响了我们所看到的内容。^(⁹⁴)
  无论出于何种原因，Facebook 在 2014 年的算法“认定”向大多数用户推送`冰桶挑战`比推送弗格森骚乱是更合适的内容主题。只有在 `Twitter` 上，一条推文或转发会立即将该内容置于每个关注者信息流的顶端，这个故事才有机会被广泛传播。这不仅增加了这些信息被看到的可能性（相对于淡化它们的算法而言），也使该平台对组织活动非常有用，从而确保了来自弗格森核心地带的新推文（和转发）源源不断。


  `Twitter` 现在不再是这样了。弗格森事件后不久，`Twitter` 推出了“当你不在时”功能——在原本的时间倒序时间线中插入算法推荐的内容。^(⁹⁵)
  2016 年，`Twitter` 将算法时间线设为默认设置。尽管它允许用户选择切换到按时间倒序查看所关注账号的推文，但应用程序经常自动恢复到算法默认状态。


  引入算法的原因很简单。算法能提高用户参与度，使新用户更容易上手使用该服务。^(⁹⁶) 这两者都能增加广告收入，帮助 `Twitter` 盈利。但这引出了一个重要问题：下一个弗格森事件发生时会怎样？我们能听到吗？还是说我们已经错过了？


  最终，`Twitter` 对弗格森人民以及那场线上线下混合诞生的运动——物理世界与数字世界是其本质的关键组成部分——而言，是一个净收益因素。它促进了沟通与协调，也让信息的传播范围远超五年前所能达到的水平。


  尽管这对 `#ferguson` 和 `#blacklivesmatter` 来说是有益的，但它并非对所有人都有利。




  ## 你不能只是戒掉网络：Gamergate 如何将社交媒体变成“现实”武器


  2014 年，一群活动人士开始涌现、组织，并在`Twitter`上在全国范围内传播他们的信息。他们发起的战斗并不新鲜，但某些策略是新的，他们的组织方式以及意识到自己既众多且强大也是新的。这个由精通技术的活动人士组成的松散联盟找到了彼此，招募了其他人，并抵抗了敌人的攻势。他们的在线策略产生的影响在“现实”（即物理）世界中具有显著效果。


  虽然这些陈述对于弗格森的抗议者来说都是正确的，但这实际上并不是我在这里要讨论的内容。2014 年，另一个群体也登上了全国舞台，也主要是通过`Twitter`。这个群体就是
  Gamergate。这个群体不是为了社会正义而战，而是发起了一场明确的*反*社会战斗，对抗他们所谓的“社会正义战士”或`SJW`。这些 Gamergate 成员——主要是年轻、白人、异性恋、男性——谴责游戏的多元化，认为这是对异性恋白人男性“少数群体”的攻击。但这不仅仅是言辞或观念之战，而是一场涉及人身暴力威胁的战斗，这些威胁如此真实，以至于收到威胁的人为保命而逃亡。而且这并没有止步于
  Gamergate。正是从那个群体中形成了一种新的运动——所谓的另类右翼。这场运动不仅在 2016 年美国总统大选中在改变基调（以及可能改变一些选票）方面发挥了关键作用，而且他们的文化战争还导致了
  2016 年 12 月华盛顿特区一家披萨店的枪击事件，以及 2017 年 8 月弗吉尼亚州夏洛茨维尔社会活动家希瑟·海耶的死亡。


  但在我们深入讨论另类右翼之前，首先需要剖析导致其崛起的那些事件：Gamergate。


  ### 佐伊·奎因与那篇来自地狱的博客文章


  2013 年，独立游戏开发者佐伊·奎因发布了一款游戏《抑郁探询》。这不是你刻板印象中的游戏。当然，这恰恰是重点所在。自 20 世纪 80 年代以来，公众对电子游戏的看法一直由角色扮演游戏（例如《魔兽世界》）、第一人称射击游戏（例如《使命召唤》）和体育游戏主导。在这些刻板印象游戏中，对竞争、征服和暴力的强调与刻板印象中的*游戏玩家*——一个居住在郊区的青春期（异性恋、白人）男性——紧密相连。游戏本身、竞争甚至暴力都没有固有的男性气质。但在西方文化，特别是美国文化中，竞争性、领导力和英雄主义（常常与“好人”的暴力行为混淆）不幸地与某种男性气质的观念纠缠在一起。


  奎因的游戏——以及她作为游戏玩家的形象——几乎完全是相反的。一位认同酷儿身份的女性，她还将芯片植入体内以便成为“半机械人”，奎因代表了游戏玩家截然不同的形象。同样，她的游戏《抑郁探询》并非旨在让玩家在杀死纳粹或保护地球免受外星人入侵时获得肾上腺素激增。它甚至不追求好玩。相反，《抑郁探询》旨在提高人们对个体经历抑郁时的感受的认识，这是奎因本人也曾经历的。无论它是否是一款“好”游戏（我本人从未玩过），它一定会作为一款重要的游戏载入史册——不仅因为它展示了一款游戏可能是什么样子，而且因为围绕它而形成的运动。


  我真希望我在谈论的是一场支持和鼓励拓展公众对游戏（或玩家）可能性的认知的运动。不幸的是，随之而来的并非那样的运动。


  奎因此前已经因为她的游戏及其获得的媒体关注而面临来自“传统”/刻板印象游戏玩家的一些反弹。一款像《抑郁探询》那样突破界限的游戏，尤其是一款由来自 LGBTQ 社群的女性游戏开发者创作的，必然会成为评论文章的话题，而这自然导致了一些负面（以及正面）的回应。但就在
  2014 年 8 月，另一件事发生了。


  奎因和她的男友埃隆·乔尼分手了。过程并不愉快。包括奎因本人在内的其他人已经写过相关细节，所以我就不多赘述了。关键结果是，乔尼在一次预谋的愤怒中，发布了一篇博客文章，指控奎因与游戏新闻网站`Kotaku`的一名记者睡觉，以换取对她游戏的正面评价。然而，这种评价根本不存在。尽管如此，多年来对游戏多元化的积怨，加上一篇特意为了利用这种愤怒而精心撰写的博文，最终导致了网络上的大爆发。对“佐伊之文”的讨论催生了自己的子版块
  *quinnspiracy*，并主导了`4chan`——一个孕育了表情包、rickroll、“史诗级失败”和川普列车，以及大量性别歧视、种族歧视，偶尔还有协调性网络骚扰活动的超级极客网站——以及`8chan`——一个供那些认为`4chan`过于“政治正确”的人使用的网站（用本·施雷金格的话来说，`8chan`之于`4chan`，就像
  ISIS 之于基地组织）。





  ### 反社会媒体：家庭心理虐待手段的升级


  这场讨论并未止步于言语交锋。事态迅速演变为暴力行为。当乔尼的帖子发布后，奎因回忆收到一位朋友的消息：“你刚被狠批了一顿。”^(¹⁰⁴) 此后不久，旧短信、私密照片乃至彻头彻尾的捏造内容便充斥于互联网的阴暗角落。她遭遇了人肉搜索——个人隐私信息遭公开曝光——完全陌生的人不分昼夜地给她打电话。家人也遭到人肉搜索，涉及隐私、威胁性的媒体内容被寄送给他们，甚至通过邮寄方式。她早已遗忘的账号遭到黑客入侵。尽管这类事件此前也发生在人们身上——尤其是女性身上——但这一次却迟迟无法平息。^(¹⁰⁵)
  数月后，2015 年 1 月，奎因撰写了题为《八月永不终结》的博客文章，记录持续的袭击。^(¹⁰⁶) 在其 2017 年出版的《崩溃覆盖》一书序言中，奎因写道：“多数恋爱以分手告终。有时分手疯狂到让你对朋友、家人和心理咨询师讲述一个恐怖故事……而我的分手需要联合国介入。”^(¹⁰⁷)


  事后回顾，甚至在事件演变过程中就已清晰：这已远超《抑郁探索》或佐伊·奎因个人范畴。正如亚当·鲍德温所言，**玩家门**是一场针对奎因——以及游戏开发者布丽安娜·吴和女权主义游戏评论家安妮塔·萨凯西安，以及任何公开声援她们的人——的猛烈宣泄，但这股怨气已酝酿多时。^(¹⁰⁸)
  玩家门爆发恰逢独立游戏产业真正腾飞之时，绝非偶然——彼时，刻板印象中的游戏与玩家正被日益多元的游戏市场“排挤”，而这类市场面向的玩家群体也日趋多样化。^(¹⁰⁹)


  尽管玩家门的社会学现象既引人入胜又令人痛心，但对于此类书籍而言，重要的是其策略及其后续影响。玩家门事件中出现了若干关键战术趋势，并延续至后续行动中，威胁着美国及其他地区的公共讨论，甚至危及选举的公正性。


  正如弗格森抗议者组织线上活动一样，玩家门支持者也通过网络组织起来。但关键区别在于：他们并非利用推文等流行平台来组织招募以发动街头活动，而是借助知名度较低的平台，如
  `4chan`、`8chan` 及更阴暗的 subreddit 子版块来策划行动，再在推文等更公开的社交媒体上实施。换言之，推文并非组织平台，而是战场。他们在此处操控马甲账号和机器人，散布人肉信息和针对目标的谎言、宣传其行动使命，并直接对目标发动攻击。


  使用自动化账号（即机器人）传播虚假信息也是玩家门的显著特征。我记得首次在推文中使用“玩家门”一词时，几乎立刻收到数个无可靠个人身份信息的账号回复。一条是滑稽的玩家门口号：“实际上，玩家门关乎游戏新闻业的伦理。”另一条指向一段批评
  Kotaku 网站伦理的 YouTube 视频。这些回复与我推文内容毫无关联，显然是企图恐吓任何胆敢公开讨论该运动的局外人的恐吓战术。


  这些机器人会对各类推文作出反应。有几次——甚至直到 2017 年——只要我发布包含“doxxed”一词的推文，一个头像为东正教犹太男子油画、用户名含反犹侮辱语的机器人便会立即回复，声称“doxxed”是“doxed”的拼写错误。（`dox`
  的过去式可接受一个或两个 X，我恰好偏爱两个 X。）这种自动化恐吓虽技术成本低廉，却能在社会层面有效压制某些声音，并对该运动的公共讨论施加不成比例的控制。


  ### 毫无准备：平台、警方与法院（未能）如何应对


  尽管谎言、定向骚扰与人身暴力威胁不断，玩家门的受害者却难以从平台和执法机构获得帮助。执法部门不知如何处理奎因的报案。^(¹¹⁰) 布丽安娜·吴呼吁联邦政府调查并起诉
  `8chan` 所有者，但未获成功。^(¹¹¹) 推文以“言论自由”为由极度犹豫关闭账户。在一起刑事骚扰案（被告获判无罪）中，法官竟建议奎因若想避免骚扰，或许应远离互联网。当她提醒法官，作为独立游戏开发者，她的工作不仅需要线上存在，还需活跃的社交媒体账号时，法官回应道：“你是个聪明的孩子……换个职业吧。”^(¹¹²)


  尽管攻击从未完全停止，奎因、萨凯西安与吴勇敢抗争，成为推动游戏行业及社交媒体平台变革的强音。奎因和萨凯西安曾向联合国谈及网络虐待与骚扰。^(¹¹³) 奎因创立了名为“崩溃覆盖网络”的公司，帮助遭受协同网络攻击的个人与平台合作，关闭那些在攻击过程中违反法律和服务条款的账号。^(¹¹⁴)
  吴甚至竞选过美国国会议员。^(¹¹⁵) 尽管玩家门试图将她们——以及众多女性、有色人种和 LGBTQ 群体成员——排挤出游戏行业，但这三人仍坚持从事游戏相关工作。


  然而，除了奎因、萨凯西安、吴等人将玩家门的根本社会问题——以及 `4chan`、`8chan`、Reddit 和推文等平台如何助长其行动——带入公众视野外，玩家门期间还涌现出其他关键人物与运动。玩家门支持者自身也发现了自己的力量。


  玩家门支持者并非仅仅是网络上的恶棍。他们是一群精通技术的个体，许多人将大量生命沉浸在网络上，尤其活跃于 `4chan` 等图像论坛。这些论坛的便利条件与局限性，以及基于平台结构形成的社区实践，催生了玩家门群体特定的战术优势，并使其运用于玩家门之外。例如，`4chan`
  是一个内容帖子会被快速删除的平台。类似地，Reddit 的点赞/点踩系统，加上网站首页对高互动内容的突出展示，激励并奖励病毒式内容的创作。尤其是一些 `4chan`
  资深用户，往往对什么内容会火有敏锐直觉，或至少掌握该平台上内容是否成功的证据。这种对传播模式的洞察力——常结合对细节的执念（一些 `4chan` 用户无耻地将此称为“武器化的自闭症”^(¹¹⁶)）以及推文自动化技能——使他们在创造和传播模因及其他潜在病毒内容时占据优势。




  '
- '# GamerGate 与另类右翼的崛起


  GamerGate 还使几位关键人物成为该运动的领导者，其领导力超越了 GamerGate 本身。在这方面，两位关键人物是前 Breitbart 编辑`Milo
  Yiannopoulos`和独立评论员/煽动者`Mike Cernovich`。¹¹⁷两人都利用其社交媒体影响力维持着这场运动（`Yiannopoulos`后来因动员骚扰《捉鬼敢死队》女星`Leslie
  Jones`而被 Twitter 封禁，¹¹⁸`Mike Cernovich`则在传播`#pizzagate`阴谋论中发挥了关键作用¹¹⁹）。两人都能利用自己在
  GamerGate 社群内外的可信度，在各种精通技术、反女权、极右翼甚至极端主义社群之间搭建桥梁。正如 Twitter 在弗格森抗议者、新兴的 Black Lives
  Matter 运动以及其他各种现有组织和同情者之间建立了联系，Twitter 也使各种反女权主义、在某些情况下公然宣扬白人至上的群体凝聚成一个松散但 interconnected
  的运动，这一运动被称为另类右翼（alt-right）。


  ### 另类右翼的兴起


  `#GamerGate`有若干关键的社会脉络。首先是对游戏世界中普遍存在的女权主义（特别是）与多样性（总体上）的反对。其次是群体动态——在网络更深、更隐蔽的角落进行的“行动”的社会组织，这些行动发生在更开放的网络上。同时，还存在一种自由意志主义与极右翼政治的不安共存，伴随着一种“说真的，谁在乎？！？！”的心态。前者围绕“言论自由”和反政治正确的意识形态集结，后者则“为了好玩”（即
  LOLs）加入这些行动。¹²⁰


  这些趋势并未消失，即使 GamerGate 最终开始平息。尽管从真正意义上说，GamerGate 从未平息。它只是将焦点从游戏转向了政治。


  几位记者和新媒体学者都曾撰文论述这一转变。作家`Dale Beran`在谈到 4chan 时写道，他们“唯一真正的政治声明”是“既然我们有了互联网，所有信息都是自由的”。¹²¹
  具体到 GamerGate，社会正义战士正在侵犯这种自由，因为他们“向电子游戏中添加了不必要的元素，即那些促进性别平等的元素”，而这是“少数活动家改变电子游戏的大阴谋”的一部分。一些人自行其是，在网上挖掘信息以揭露这一阴谋，既然“所有信息都是自由的”，那么分享和披露他们发现的信息就是完全可以接受的——不，这是他们作为公民的责任。


  这听起来应该很熟悉。一个由沉默但强大的少数派实施的深层阴谋，旨在以社会正义为幌子剥夺多数派的自由——这种信息在美国 2016 年总统大选期间（以及全球其他一些政治背景下，我们将在后续章节探讨其中一些）引起了许多人的共鸣。而这种由民主党“全球主义者”及其全球同伙实施的“深层政府”阴谋，正是后来被称为另类右翼的运动的关键底层政治理论之一，也是特朗普总统首任幕僚长`Steve
  Bannon`的信仰基础。¹²²


  但 GamerGate 与另类右翼之间的相似之处不仅仅在于意识形态。另类右翼的许多成员与 GamerGate 相同。在一篇具有里程碑意义的调查报道中，`Joe
  Bernstein`的文章《Alt-White：Breitbart 机器如何洗白种族主义仇恨》详细记录了两个运动之间的许多具体联系。¹²³ 具体来说，在 GamerGate
  期间声名鹊起的`Milo Yiannopoulos`，在担任 Breitbart 编辑期间与`Steve Bannon`和 Mercer 家族（主要的右翼政治捐赠者，曾大力资助英国
  2016 年 Vote Leave 运动）密切合作，并帮助`Bannon`将“4chan 的智囊和 GamerGate 老手”招致麾下。`Bernstein`对大量
  Breitbart 电子邮件和其他此前秘密文件的深入挖掘揭示了从`Yiannopoulos`延伸出去的联系网络，不仅包括`Bannon`和 Mercer 家族，还包括白人至上主义者`Richard
  Spencer`、`Devin Saucier`（来自被南方贫困法律中心归类为仇恨网站的 American Renaissance）、新纳粹仇恨网站 The Daily
  Stormer 的管理员`Andrew “Weev” Auernheimer`、被起诉并驱逐出境的前特朗普幕僚`Sebastian Gorka`和`Michael
  Flynn`（通过其子`Michael Flynn Jr.`），甚至还有《鸭子王朝》的`Phil Robertson`。尽管 Breitbart 的高层呈现了一个不那么明显的种族主义版本的另类右翼，但`Bernstein`的调查清楚地表明，实际的新纳粹分子——比如那些在弗吉尼亚州夏洛茨维尔组织“团结右翼”集会的人——与在特朗普白宫最高层工作的`Bannon`等人之间，仅仅差一封转发的电子邮件。


  然而，对我们而言更重要的是，GamerGate 的战术延续到了另类右翼中。在 Politico 的一篇文章《世界战争备忘录》中，`Ben Schreckinger`写道，4chan
  的文化和 GamerGate 的战术是如何进入 2016 年美国总统选举的。¹²⁴ 事实上，在许多方面，我们可以将希拉里·克林顿视为最引人注目的 GamerGate
  受害者。


  `Schreckinger`写道，“白人至上主义的另类右翼是在 4chan 的熔炉中锻造出来的”，这个社群“专注于性别政治”。一些 4chan 成员视自己为与左派交战。另一些人则将推选像唐纳德·特朗普这样的人担任总统视为一个巨大的恶作剧，或“宇宙玩笑”。确实是为了好玩。


  就像 GamerGate 一样，这些 4chan 老手将 4chan 的“/pol/”版块（“政治不正确”的缩写）作为“集结地”。像在 GamerGate 中一样，他们精通一个原本是图像论坛、需要持续参与才能防止帖子被删除的平台，这意味着他们对创造和传播病毒式传播的内容颇为了解。他们利用了这一优势。


  很多在 4chan 上构思的内容都被植入或开始在 Reddit 上进行市场测试。即使在大多数不太体面的子版块中，用户通常也比 4chan 上的用户更主流。4chan
  上的佼佼者往往跨界来到 Reddit，在这里，点赞和点踩系统有助于筛选出最具病毒式传播潜力的内容。（不过`Schreckinger`声称，另类右翼者“操纵规则”以推广他们的一些内容。¹²⁵）


  那些在 4chan 和 Reddit 上证明最成功、对“正常人”最具可及性的内容，随后被植入 Twitter 和 Facebook，在那里，他们很容易像 GamerGate
  时期那样启动同样的自动（机器人）和马甲账号。


  但还有一点。另类右翼并非完全是志同道合者相互发现并在线组织的草根运动。还有资金雄厚的政治操盘手，他们在 GamerGate 期间观察到了这个社群的力量，并愿意让他们在选举政治中发挥作用。根据`Schreckinger`的说法，在竞选初期，特朗普团队就在监控
  Reddit，特别是名为 The_Donald 的子版块。`Schreckinger`将 The_Donald 描述为“4chan 与主流网络之间的渠道”，许多起源于
  4chan 的 meme 和视频通过 The_Donald 进入了主流——包括一些被特朗普竞选团队工作人员甚至唐纳德·特朗普本人分享的内容。据称，这个渠道在 Steve
  Bannon 负责特朗普竞选活动期间最为强大。




