    But other differences are learned. We learn language, bodily gestures, faces,
    and skills through repeated exposure. Because the brain conserves energy by preactivating
    parts of memory that it anticipates us needing, and because it’s more likely to
    anticipate something that we encounter regularly than something we encounter rarely
    (let alone something entirely new), the brain preactivates the resources needed
    to parse *familiar* things far more readily than the resources needed to parse
    *unfamiliar* things. As a result, the brain processes familiar things faster and
    more easily than it processes unfamiliar things. Finally, since fast, easy processing
    is associated with a positive reaction, familiar things tend to lead to more positive
    emotions than unfamiliar things, all else being equal.


    This makes sense. When a piece of music ends the way we might expect, that feels
    good. No surprises. Everything is in its right place. And that’s true even when
    we don’t know enough music theory to explain what “should” happen or why. It’s
    why a clean house or a well-kept garden makes us feel relaxed, even at home—when
    everything is “as it should be,” our brain has an easy time making sense of the
    environment, even if it’s a new one. (Remember, aeons of evolutionary history
    mean we’re always looking for danger! A clean environment, with everything in
    its place, makes it easier for us to get a handle on what’s out there and makes
    it safe to let our guard down.)


    A number of scientific studies have demonstrated these principles at work. In
    one particularly famous study, researchers showed their subjects (who had no knowledge
    of the Chinese language) a series of Chinese characters and asked them to provide
    an adjective that they thought the character might stand for. Characters that
    the subjects had already seen earlier in the study tended to be attributed adjectives
    with a more positive connotation than characters the subjects were seeing for
    the first time.^([^(44)](#fn44))


    While it seems like a simple enough study, it’s actually rather remarkable that
    previous exposure to a character can lead to a discernible and statistically significant
    increase in the positivity associated with that character. And this kind of phenomenon
    happens regardless of whether the subject recognizes the object! That’s because
    we build up this “statistical” awareness unconsciously.


    I’ve always been taken by music cognition studies, and they provide some of the
    most interesting insights into these kinds of phenomena. A number of studies have
    been done to measure how humans internalize the patterns in the music they hear.^([^(45)](#fn45))
    From testing infants’ musical expectations by tracking the movement of their head
    or eyes, to asking people to sing the note they think might come next, to having
    subjects rate how well a note “fits” with a melody, to giving subjects money and
    asking them to bet on which note will come next, these studies come at the question
    from just about every angle. But they generally come to the same conclusion: humans
    are really good at learning patterns through repeated exposure and making predictions
    and judgments in accordance with the patterns we learned, even if we can’t explain
    the reason behind those judgments.


    One study^([^(46)](#fn46)) presented Western musicians with a melody one note
    at a time, but the melody was from a style that was unfamiliar to all of them—Balinese
    *gamelan* music. (If you’ve never heard, or *seen*, Balinese gamelan music performed
    before, find a few videos on YouTube. It’s incredible.) This music not only follows
    different rules than Western classical music, pop music, jazz, blues, country,
    bluegrass, you name it. It is based on an entirely different system of scales
    than Western music. You cannot play Beethoven on a gamelan, nor could you perform
    a gamelan piece on a piano. It simply wouldn’t work. That, plus the musicians’
    lack of exposure to the style, made it an excellent means to test how a human,
    in this case an expert Western musician, might approach “learning” a completely
    new musical style from scratch.


    The experimenters played first one note of the gamelan melody and asked each subject
    to predict what note they thought most likely to come next. The guesses were just
    that: guesses. No better than chance at predicting the next note. After two notes,
    three notes, still fairly wild guesses. But as the melody progressed, and the
    subjects had more context for their predictions, their predictions improved. To
    be clear, they were not learning the *rules* of the musical style. In fact, they
    missed some core elements of the musical style completely. But they were learning
    the *statistics* of the style, the basic tendencies and proportions. After hearing
    enough of the melody, if the melody so far had more *C’s* than *E-flats*, they
    would predict C more often than E-flat. And by the end of the melody, though they
    weren’t exactly gamelan experts, their predictive powers were noticeably better
    than chance.


    This ability to learn patterns quickly, with detail, and unconsciously is a core
    part of our humanity. It’s a large part of how we learned our first language.
    We weren’t born with an English gene, or a Japanese gene, or a Farsi gene. We
    didn’t sit down at the blackboard for lessons on how to move the lips, jaw, and
    tongue to say “mama” or “dada.” We are born with a genetic predisposition to learn,
    and our brain hones in on the patterns we hear most often and does all it can
    to emulate them—and to improve upon our ability to emulate them. The ability to
    make predictions and evaluations based on those patterns is also part and parcel
    to being human—even leading to our deepest flaws, including responding negatively,
    even violently, to the unfamiliar. Our racism, sexism, homophobia, transphobia,
    xenophobia, … they all stem from a negative reaction to the unfamiliar, and our
    ancient association of the unfamiliar with danger and threat.


    Now, of course there are other factors in how we appraise things. As discussed
    previously, the associations our brains have formed over time, as we have repeatedly
    engaged things *in context* (rather than in an experiment), also play a huge role.
    But all things being equal, familiarity, even unconscious familiarity, leads to
    a more positive appraisal of an object, a person, or an idea.


    This core psychological principle forms the basis of much practice in advertising.
    Think of product placement. The subtle inclusion of a product in a film or television
    show, often paid for just like a commercial, by making that product slightly more
    familiar, slightly more preactivated, primes you to appraise it more positively
    when deciding whether or not to purchase it in the future. They might hit you
    over the head with it—like Reese’s Pieces in the movie E.T.—or it might be more
    subtle—like the label on the can of soda sitting on the edge of the table just
    inside the frame—but the principle remains the same: repeated engagement leads
    to positive appraisal, all other factors being equal.'
