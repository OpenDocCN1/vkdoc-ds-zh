- fmt: '# Bias Amplification in Social Media


    Bias amplification can be even stronger on social media platforms like Facebook
    or Twitter. There the content of a user’s feed is already filtered by the people
    they are friends with and the pages they “like.” Since we are already prone to
    associate more with people like us in some way than those who are not, that already
    represents a significant potential filter bubble. When our past engagement data
    and the results of the collaborative filtering process are also taken into account,
    the content we see can be extremely narrow. Intervening by following pages and
    befriending people who represent a wider range of perspectives can only help so
    much, as it affects the first filter, but not the collaborative engagement-based
    filter. This is why close friends or family members who have many friends in common
    may still see radically different content in their feeds. And since both the networks
    of friends/pages/groups we have curated and the posts we “like” and otherwise
    engage with tend to reflect our personal biases and limits of perspective, the
    content we encounter on the platform will tend to reflect those biases and limited
    perspectives as well.


    ## Propagation of Biased Content


    That leads to a second point: if the content served up to me by algorithmic recommendation
    is biased in ways that reflect how I already think about the world, I am not only
    more likely to engage with that bias, *I am more likely to spread it*. An increasing
    number of people are finding their news on social media platforms.^([^(64)](#fn64))
    But if it’s easier to *find* information in a one-stop shop like Facebook or Twitter,
    just think of how much easier it is to *share* information found on that platform.
    With just a tap or two, I can repropagate an article, photo, or video I encounter—without
    necessarily even *reading* the article or watching the entire video, if the previewed
    content gets me excited enough. And this is true for algorithmic feeds like Twitter
    and Facebook in a way that isn’t true for expertly curated content like that found
    in a print newspaper or a college textbook.


    ## The Feedback Loop of Bias Amplification


    This sharing optimization compounds the filter bubble effect. Because it is easier
    to find information that reflects my existing biases *and easier to share it*,
    my contributions to others’ social feeds will reflect my biases even more than
    if I only shared content that I found elsewhere on the internet. And, of course,
    the same is true for their contributions to my feed. This creates a feedback loop
    of bias amplification: I see things in accordance with my bias, I share a subset
    of that content that is chosen in accordance with that bias, and that feeds into
    the biased content the people in my network consume, from which they choose a
    subset in accordance with their bias to share with me, and so on. Just like the
    image search results in the Introduction (but likely more extreme), left unchecked
    this feedback loop will continue to amplify the biases already present among users,
    and the process will accelerate the more people find their news via social media
    feeds and the more targeted the algorithm becomes. And given the way that phenomena
    like clickbait can dominate our attention, not only will the things that reflect
    our own bias propagate faster in an algorithmically driven content stream, but
    so will content engineered to manipulate our attention. Put together, clickbait
    that confirms our preexisting biases should propagate at disproportionally high
    speeds. And that, in fact, is what we’ve seen happen in critical times like the
    lead up to the 2016 U.S. presidential election.^([^(65)](#fn65)) But, perhaps
    most importantly, the skewed media consumption that results will feed into our
    personal and social stereotypes about the world, influencing our behavior and
    relationships both online and in person.


    ## One-Way vs. Multi-Sided Amplification


    Sometimes bias amplification works one-way. In cases like gender, racial, and
    other demographic representation we considered in the Introduction, the dominant
    group has been dominant long enough that algorithms tend to amplify the pervasive
    bias in that same, singular direction. But this is not always the case. When it
    comes to politics where, especially in the United States, we are relatively equally
    divided into two groups, the amplification of bias is not one-sided, but two-sided
    or multisided. The result, then, is *polarization*.


    ## Polarization as a Consequence


    Polarization is easy enough to grasp. It simply means the increase in ideological
    difference and/or animosity between two or more opposing groups.^([^(66)](#fn66))
    Digital polarization is in large part a result of the bias-amplification feedback
    loop applied to already like-minded groups. As biases get amplified within a group,
    it becomes more and more of a “filter bubble” or “echo chamber,” where content
    uncritically promotes in-group thinking and uncritically vilifies the opposition.
    Adding fuel to the fire, we also know (as discussed in Chapter [2](#469027_1_En_2_Chapter.xhtml))
    that engagement increases when content is emotionally evocative—both positive
    and negative, and especially anger. This means not only more content supporting
    your view and discounting others, but more content is shared and reshared that
    encourages anger toward those outside the group. This makes it harder to listen
    to the other side even when more diverse content does make it through the filter.'
