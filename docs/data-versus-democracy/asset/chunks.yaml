- fmt: '# The Bronco Bots and the Battle Against Disinformation on Social Media


    The Bronco Bots were very short-lived. We discovered them almost immediately and
    reported them to `Twitter`, and within hours of our report—and just two days after
    they came online—they were suspended. It may or may not have been our report that
    resulted in the suspensions. In fact, `Twitter` has gotten much better since 2016
    at identifying mass automation and suspending the accounts independent of any
    reports from users or researchers. That’s obviously a good thing. But we discovered
    several networks similar to the Bronco Bots, supporting a variety of candidates,
    and only some of them were suspended by the platform before the election (if at
    all). It’s also worth noting that in the course of an event unfolding in real
    time—like the Unite the Right rally in August 2017 or the chemical weapons attack
    in Syria in April 2017—a network of bots or fake accounts can do a lot of damage
    in less than 48 hours, especially if they are amplifying a (false) narrative being
    pushed by real people or by nonautomated fake accounts controlled by real people.
    For example, we uncovered another anti-Anaya network on `Twitter` using automation
    to amplify a set of `YouTube` videos advancing already debunked rumors about alleged
    corruption from Anaya. By targeting the evening of and the day after the final
    presidential debate, they were able to conduct their operation without worry of
    account suspensions interfering until attention had already organically dwindled.


    ## A More Insidious Botnet in Latin America


    A more insidious, and longer-lasting, botnet arose to stoke anti-government sentiment,
    and even promote violence, across Latin America and elsewhere. The accounts in
    this network were generally created a few days or weeks before operations began
    and primarily pushed anti-government messages to targeted audiences in Venezuela,
    Colombia, and Nicaragua, with links to content on `YouTube` and two recently created
    web sites.


    The account profiles were all variations on a theme, and locations given in the
    account profiles appeared to be fake (in some cases, the city-country combinations
    they claim as home simply do not exist). Though these accounts claimed to be different
    individuals in different countries, the content posted to these accounts was often
    identical and always fast-paced and high-volume. In addition to anti-government
    messaging in Venezuela and Nicaragua, these accounts actively attempted to link
    Colombian presidential candidate Gustavo Petro to the `FARC` terrorist organization.
    `FARC` and Colombia were at war until an unpopular peace deal was signed in 2016.
    Petro’s support for the peace deal, combined with his leftist politics, left him
    open to characterizations of being a communist or a terrorist, which this botnet
    seized upon. (Petro ultimately lost the runoff election to Iván Duque, a right-wing
    populist and critic of the Colombia-`FARC` peace agreement.) While most posts
    from this botnet were in Spanish, a few English tweets slid through now and then.
    These included links to tech tutorials and a site that focuses on sensitive social
    issues in the United States.


    And occasionally `Twitter` automation and analytics tools (oops).


    It is clear that the individual or group behind this particular botnet in Latin
    America was taking steps to mask their location. There were also indications that
    they may not be from Latin America, such as the accidental posting of English-language
    content and the lumping together of target audiences speaking the same language,
    but living in different countries—even continents, with the inclusion of posts
    targeting users in Catalonia. This may indeed have been a foreign influence operation.
    But unfortunately—or is it fortunately?—the network was taken down by `Twitter`
    before we could make a high-confidence origin assessment.


    ## The Biggest Threat: Peer-to-Peer Messaging


    The biggest threat in Latin America wasn’t `Twitter`, though. It also wasn’t `Facebook`,
    or `Instagram`, or `YouTube`. It was peer-to-peer messaging, primarily on the
    Facebook-owned platform, `WhatsApp`.


    `WhatsApp` is a messaging service that supports text, voice, and video calling,
    as well as file sharing, over an encrypted data connection. For some people, it
    represents a less public (and less surveilled) way to connect with friends and
    family than `Facebook` or `Twitter`. For others it provides voice, video, and
    text all over wifi or a data connection, saving them money on their monthly phone
    bills. Regardless of the reason, `WhatsApp` is becoming increasingly popular in
    some parts of the world, particularly the Spanish-speaking world. In many places
    where `Facebook` usage is on the wane, and `Twitter` never really made a splash,
    `WhatsApp` is alive with digital communities and information sharing. For instance,
    according to Harvard’s Nieman Lab, `WhatsApp` is the most popular social platform
    in Mexico.^([^(218)](#fn218))


    `WhatsApp` and other private messaging apps (like `Signal`, `Facebook Messenger`,
    `Slack`, even good-old-fashioned text messaging and email) pose a significant
    challenge for disinformation researchers and fact-checkers. Because of the high
    level of connectivity for many who use the app, it is easy for both true and false
    information to spread, even to become viral, on `WhatsApp`. But because the messages
    are private and encrypted, there is no easy way to see what is trending on `WhatsApp`
    and in what communities.


    ## Why Private Messaging Is So Hard to Police


    As we’ve already explored, psychologists and rumor experts DiFonzo and Borgia
    identify four primary factors that contribute to whether or not someone believes
    a claim that they encounter:


    -   The claim agrees with that person’s existing attitudes (confirmation bias).

    -   The claim comes from a credible source (which on social media often means
    the person who shared it, not the actual origin of the claim).

    -   The claim has been encountered repeatedly (which contributes to *perceptual
    fluency*).

    -   The claim is not accompanied by a rebuttal.^([^(219)](#fn219))


    Perhaps the biggest obstacle to countering disinformation and misinformation on
    private chat apps like `WhatsApp` is that we don’t know what claims are encountered
    repeatedly (going viral), what the sources of those claims are, or what audiences
    they are reaching (and what biases they already hold), and so fact-checkers don’t
    know what needs rebutting. Because of these obstacles, when I talk to researchers
    and policymakers concerned with Latin America, peer-to-peer messaging is their
    biggest fear. And having seen the anti-surveillance writing on the wall, it’s
    a growing fear among researchers and policymakers in countries where `Facebook`,
    `Instagram`, and `Twitter` still dominate, too.^([^(220)](#fn220))


    ## A Glimmer of Hope: Verificado 2018


    But all hope is not lost. One initiative that took place during the 2018 Mexican
    election proved that it is possible to expose and rebut rumors and misinformation
    on private communication apps like `WhatsApp`. That initiative was called `Verificado
    2018`.


    `Verificado 2018` was a collaboration between `Animal Político`, `Al Jazeera`,
    and `Pop-Up Newsroom`, supported by the `Facebook Journalism Project` and the
    `Google News Initiative`. Their goal was to debunk false election-related claims
    and to do so in ways that are in line with how users use the platforms the claims
    are on. Because of `WhatsApp`’s dominance in the Mexican social media landscape,
    `Verificado` focused heavily on operations there.


    Because `WhatsApp` is a peer-to-peer platform, oriented around sharing messages
    with individuals or small groups of friends and family, `Verificado` took a small-scale,
    social approach to fact-checking. They set up a `WhatsApp` account where *individuals*
    could send them information in need of verification. `Verificado`’s researchers
    would then respond *individually* with the results of their research. This personal
    touch (which one has to assume involved a fair bit of copy-and-paste when they
    received multiple inquiries about the same claim) was more organic to the platform
    and allowed users to interact with `Verificado` more like the way they interact
    with others on the platform.'
