- fmt: '# 5. Democracy Hacked, Part 1


    Russian Interference and the New Cold War


    Social media empowers communities of activists, as well as groups of extremists
    and abusers, to discover each other and coordinate their activity. The same tools
    can be used to spread political messages, both by legitimate communities and by
    disingenuous actors—even foreign states seeking to interfere in the electoral
    process of another country. That’s the environment we find ourselves in today,
    as the United States, NATO, the EU, and their (potential) allies are under attack
    from a Russian campaign of information warfare. In this chapter, we’ll unpack
    some of their operations, culminating in the 2016 U.S. presidential election,
    and conclude with a view toward future threats and defenses.


    ## What Happened?


    November 8, 2018. Hundreds of millions of Americans—and many others throughout
    the world—watched the results of the U.S. presidential election roll in. The odds
    and the polls all pointed to a Hillary Clinton victory. The question was simply
    how big a victory, and whether her party would control Congress as well.


    Of course, that’s not how things turned out. Even though Clinton won the popular
    vote, Donald Trump won victories in key swing states, giving him the edge in the
    Electoral College to become the 45th president of the United States.


    Almost immediately after he was declared the presumptive winner by the major news
    networks, pundits and scholars began to ask, “What happened?” Even some who supported
    Trump over Clinton were surprised at his victory. Fingers quickly pointed at pollsters
    and their methods, which are still being updated for the age of the internet and
    smartphones (as opposed to one-per-family landlines). They also pointed to perceived
    biases in the mainstream media, reporting from one perspective and blind to others.
    Many voters disaffected with the two-party system and the major parties’ nominees
    stayed home or voted for a third-party candidate, winning them the ire of some
    Democrats. And, as is frequently the case when the winning candidate loses the
    popular vote, there were calls for the abolition of the Electoral College.


    But to many, the blame lay primarily at the feet of Hillary Clinton herself. Not
    only would old scandals simply not go away—Benghazi, her response to allegations
    of sexual impropriety against her husband Bill when he was president, her “socialist”
    tendencies as a past supporter of universal health care—but new ones kept popping
    up. Her use of a private email server for official State Department business suggested
    that she was a security risk. The missing emails from that server surely must
    have contained classified information (which would be illegal) or reference to
    other nefarious activities. Private communications revealed that the Democratic
    National Committee took steps to ensure that the more moderate Clinton won the
    party’s nomination over democratic socialist Bernie Sanders. Three weeks before
    the election, then FBI Director James Comey announced that the Department of Justice
    was reopening the case of Clinton’s private email server. And that’s to say nothing
    of the more fringe rumors that Clinton had ordered murders be committed on her
    behalf,^([^(128)](#fn128)) was involved in “spirit cooking,”^([^(129)](#fn129))
    or sat at the center of a massive child sex trafficking ring^([^(130)](#fn130))—the
    latter of which, though baseless, led a man to bring a gun to a D.C. pizza parlor
    to “investigate.” (None of these conspiracy theories have completely gone away.)
    As a result, many moderates and Sanders supporters who otherwise would have supported
    Clinton over Trump voted third party or abstained in protest, at least partially
    contributing to Trump’s victory.


    While some of these scandals had at least a kernel of truth to them and most had
    been shared in earnest by many Americans, it became clearer and clearer throughout
    2017 that there were other forces at work. Yes, Clinton appeared mired in scandal,
    and yes Trump seemed to represent people and ideas that many “mainstream” journalists
    and political operatives paid too little attention to. But, we now know, not all
    of that was organic. Someone had hacked the DNC server, stolen the emails of Clinton’s
    campaign chair, John Podesta, and boosted both the scandals they contained and
    the pro-Trump movements on social media. Many of the conspiracy theories were
    circulated and amplified, if not created, by disingenuous operatives running fake
    accounts on a variety of social media platforms. As researchers and the American
    intelligence community now agree, all signs point to one primary culprit: Russia.


    Unfortunately, the same lack of nuance that led many to fall prey to Russia’s
    activities—and to other influence operations that took place at the same time—has
    led many to either make Russia a boogeyman, responsible for all narratives and
    political victories they dislike, or to cheapen the propaganda problem as “Russian
    [Twitter] bots” and laugh it off. The former causes us to overlook both other
    foreign actors and the role that domestic bad actors and regular citizens play
    in the spread of disinformation. The latter causes us to overlook both the breadth
    and the gravity of the problem altogether.


    ## Meet the New War, Same as the (C)old War


    The reality is that Russia describes itself as being in a state of “information
    warfare against the United States of America” as well as our NATO allies.^([^(131)](#fn131))
    For years, Russia has been using web sites, blogs, and social media as the latest
    tools in their information arsenal against the United States, the United Kingdom,
    the EU, NATO, Ukraine, and Syrian rebels. Their goals are to enlarge their “empire,”^([^(132)](#fn132))
    enrich Putin’s “inner circle,” weaken the EU and NATO, discredit Western democracy,
    and—at least in the immediate regions surrounding Russia—promote an illiberal
    faux democracy, where a few corrupt oligarchs can manage a state economy in their
    own favor.^([^(133)](#fn133))


    But Russia is not the only player. The far-right, populist groups that Russia
    has bolstered in the United States and Europe are real. The refugee crisis triggering
    the anger and activism of those anti-immigrant populists is also real—though Russia’s
    activity in Syria and elsewhere certainly fuel that crisis. These groups were
    already having an impact within their own countries before Russia stepped in and
    lent them a hand—if they even needed to—and they continue to have a real influence,
    irrespective of any help they might get from Russia or their allies.


    And there are other nations using online propaganda to further their geopolitical
    aims. Seven authoritarian nations have a budget for influence operations and propaganda,^([^(134)](#fn134))
    and Twitter recently announced discovery of an Iranian operation aimed at Western
    users of their platform. Private companies from the United States, the United
    Kingdom, and Israel are certainly major players. And the GamerGate trolls haven’t
    gone away, either.


    In what follows, we’ll survey this new theater of battle, getting the lay of the
    land in this global information war. Who are the players, what battles have been
    fought, how have platforms and governments responded, and how we got to where
    we ended up in 2016, where Russian influence operations played a significant,
    and possibly decisive, role in the election of the president of the United States.'
