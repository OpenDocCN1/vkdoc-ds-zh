  trans: '

    ### 奇幻熊是如何入侵的


    你看过电影《战争游戏》（1983 年）吗？这部影片虽不算新，却完美诠释了那种黑客思维，而这正是奇幻熊在 2016 年大选前所用具体技术的基础。在《战争游戏》中，主角大卫·莱特曼想修改自己高中的生物成绩，以免上暑期班。学校的成绩数据库（在
    1983 年这多少有些令人震惊）可以通过“在线”方式访问——即通过兼容计算机经由电话线拨号接入。数据库受定期变更的密码保护，大卫既没有密码，而且即便有密码也很快会失效。大卫本可以尝试暴力破解法，比如通过算法生成随机密码，直到猜中正确的那个——如果密码足够简单且时间充裕，这种方法或许可行。但这会在很长一段时间内使系统登录尝试次数激增，从而增加他的攻击被发现的可能性。于是，他采用了一种*人类情报*（HumInt
    发音为 *hyoo-mint*）方法。他（有意地？）在学校定期惹麻烦，被送到校长办公室谈话。在那里，他发现数据库密码的存放位置，并定期记下更新的新密码。他惹麻烦的频率足够高，以至于他出现在密码记录地点附近所引发的警惕，远低于从家中电话号码的计算机多次尝试登录所引发的警觉。因此，他的密码窃取和成绩篡改未被学校察觉。


    电影稍后部分，大卫正在搜索一家电子游戏公司的服务器，以便在新游戏发布前（而且很可能，是为了避免支付 20 世纪 80 年代初新电脑软件的价格！）抢先试玩。当他探查游戏公司地理区域附近的电话号码时，偶然发现了其他几个有趣的计算机连接。在为他想要打动的女同学预订了一次虚假的巴黎之旅后，他发现了一个军事服务器，里面包含一些游戏，这些游戏教授在冷战高峰期可能对决策者和谈判者有用的战略。他咨询了两位计算机同好，他们告诉他，他永远无法突破主系统的安全防线。但可以寻找一个“后门”——原始程序员留下的、不为现任系统管理员所知的秘密进入方法。结果发现，服务器上的一款游戏包含一个名字：福肯的迷宫。大卫在图书馆进行了一番研究，发现了一位开发者和发明家史蒂文·福肯，他曾有过与政府合作或为其工作的经历。在调查福肯的生平后，大卫发现了福肯的“后门”密码，并成功进入了系统。（然后差点引发第三次世界大战……）


    自 20 世纪 80 年代初以来，加密和在线计算机安全技术已呈指数级增长。在不了解系统的情况下使用暴力破解法几乎注定失败，因为加密数据远比通过计算发现加密“密钥”要容易得多。（而且，由于这两种过程依赖同类型的计算机处理器，这种情况在短期内仍将持续。）


    但自 20 世纪 80 年代以来，技术在复杂性和普及性方面也急剧增长。而自那时起，人类大脑管理这种复杂性的能力并未提高。我们会犯错。专家级开发者不仅会在代码中留下后门，还会留下废弃函数、单元测试、分析追踪器、对其他人的代码的依赖（当*其他*代码中发现安全漏洞时，这些依赖并不总是及时更新）、在系统过载被迫重启时被触发的权限过于宽松的网页应用安装脚本，或者因用户安装后未能更新权限而留下的开放接口。更不用说用户的错误，例如弱密码、重复使用密码、不必要地用管理员设置运行错误的应用程序，以及不知不觉地安装和使用需要超出必要系统权限的应用程序……并因其自身糟糕的安全设置而使这些“门”保持敞开。


    正如虚构的黑客大卫·莱特曼利用人类情报和传统研究来降低计算问题的复杂性一样，像奇幻熊这样的现实黑客也利用人类情报——并利用人类的错误——作为其切入点。


    奇幻熊在 2016 年选择的武器是电子邮件。具体来说，是一种名为*鱼叉式钓鱼*的欺诈性电子邮件。你可能熟悉*钓鱼*——那些通常写得很拙劣的邮件，声称“你的邮箱已满”或“你的银行账户被冻结”，并告诉你点击邮件中的链接并提供个人登录信息（包括用户名和密码）来解决问题。鱼叉式钓鱼类似于钓鱼，但不同之处在于，钓鱼是将邮件广泛撒网，希望能捕捉到*某类*用户的数据（就像用一根钓线或渔网只想捕捉到*某些*鱼），而鱼叉式钓鱼攻击则针对特定的用户或用户群体（就像用鱼叉瞄准*特定*的鱼）。


    这些电子邮件看起来不像“你的银行账户被冻结”，而更像是：“嘿，[你的真名]，我是[你老板的真名]。我正开会脱不开身，需要你中午前帮我把某件事做了。”邮件里几乎总有一个欺诈性链接，点击后可能会让发件人访问你系统中的某部分，或者向你索要同样能达到此目的的信息。或者，它可能看起来像一封发送到你
    Gmail 账户的、制作精良的谷歌安全通知副本，附带一个按钮让你点击以处理他们在你账户上检测到的安全问题。他们可能想获取你电子邮件账户的内容、你 G Suite
    账户中的公司文档、访问你的摄像头和麦克风，或者他们试图在你的电脑上安装一个键盘记录器，以收集每一次击键信息，包括用户名、密码、网址和你所写消息的内容。其中任何一项都可能让他们获取情报——如同事和客户的邮箱地址、内部报告、财务文件等——或者*抹黑材料*——一旦公开可能损害你或你公司声誉的信息。


    2016 年 3 月 10 日，当希拉里·克林顿成为民主党总统候选人的局势明朗后，她的竞选团队开始收到来自奇幻熊的鱼叉式钓鱼邮件。3 月 19 日，俄罗斯军事情报局（GRU）的黑客开始针对其竞选主席约翰·波德斯塔的个人
    Gmail 账户。对竞选团队的攻击在 3 月和 4 月持续进行，同时也扩展到与竞选相关的其他团体，如克林顿基金会、美国进步中心、ShareBlue 等。


    攻击成功了。波德斯塔的一名工作人员在 3 月 19 日点击了发送到波德斯塔个人 Gmail 账户的一封欺诈性谷歌安全警报中的链接，并输入了他的用户名和密码。两次。4
    月下旬，特朗普顾问乔治·帕帕佐普洛斯得到消息，称俄罗斯已从“数千封电子邮件”中获取了克林顿的*抹黑材料*。^(¹⁵⁴)

    '
- fmt: 'Around the same time, Fancy Bear targeted the Democratic National Committee.
    But this spearphishing attempt didn’t just target emails. The fraudulent link
    in those emails contained the power to install malware on the computer when clicked,
    and malware downloaded onto DNC computers gave the GRU access to data on both
    those computers and the DNC servers.^([^(155)](#fn155))


    Russia didn’t just sit on the `kompromat` they gained from these attacks. In April
    2016, two web sites, now believed by U.S. intelligence agencies to be connected
    to Russia, were registered: `electionleaks.com` and `dcleaks.com`. In June, both
    `dcleaks.com` and the blog of “hacker” Guccifer 2.0 (also believed by the U.S.
    intelligence community to be a likely GRU operation) began to publish `kompromat`
    gained against the Democratic Party—including information about how the DNC leadership
    worked to protect Clinton from the challenge posed by Bernie Sanders. This led
    to, among other things, a suit against the DNC from Sanders supporters—and likely
    a number of protest votes from leftists (either no-votes or votes for a third-party
    candidate like Jill Stein), hurting Clinton in the election.^([^(156)](#fn156))


    Also in June 2016, Julian Assange announced that WikiLeaks had obtained `kompromat`
    on Hillary Clinton. (Assange denied that Russia was the source of the data.) In
    July, WikiLeaks began to publish that `kompromat`, strategically scheduling the
    release of that information over the course of the remainder of the election,
    culminating in the release of the Podesta emails on October 7, 2016—the same day
    (and soon after) the Trump-compromising `Access Hollywood` tape was released.^([^(157)](#fn157))


    Though we’ll never know the full extent of the impact of the GRU’s operation,
    there were several fallouts that we can likely attribute to the release of the
    `kompromat` Fancy Bear obtained from the Clinton campaign and the DNC. First,
    the revelations about the way the DNC held back Sanders’ chances at winning the
    nomination alienated many left-leaning voters—likely depressing votes for Clinton
    both from those further left (who supported Sanders in the primaries and caucuses)
    and those toward the middle (who may have been demotivated to vote for Clinton,
    in spite of distaste for Trump). This was likely exacerbated by pro-Jill-Stein
    and “never Clinton” campaigns conducted by Russia’s Internet Research Agency (which
    we’ll unpack shortly).


    Other details contained in the Podesta emails likely depressed turnout—or at least
    enthusiasm—among those same potential Clinton supporters on her left and in the
    middle. As Jeff Stein wrote for `Vox`:


    *   None of the Podesta emails has so far actually broken any fresh scandals about
    the woman on track to be the next president. Instead, they’ve mostly revealed
    an underbelly of ugliness to the multiple Clinton controversies that we’ve already
    known about: the questionable relationship between the Clinton Foundation and
    its donors, Clinton’s ease with powerful interests on Wall Street, her ties to
    wealthy campaign contributors.^([^(158)](#fn158))


    The Clinton Foundation controversies were likely particularly damaging to Clinton’s
    potential support among centrists turned off by Trump. Many of them had voted
    for Republicans in the past and were dissatisfied by the GOP’s nominee. But narratives
    of corruption around her, combined with Republican prejudices against the Clinton
    name, likely made it difficult for a number of moderates and dejected Republicans
    to vote Democrat in 2016. The ties to Wall Street and wealthy donors likely hurt
    Clinton’s chances with former Sanders supporters, who had been calling for Clinton
    to release the content of the private speeches she had been paid to give to bankers
    and other wealthy Americans in the past. Some of that content was awkward or embarrassing,
    but some of it also undercut Clinton’s ability to garner support among those to
    the left of her campaign’s policy platform.


    I also think it is likely that the months-long obsession with “Clinton’s emails”
    compounded the impact of FBI Director James Comey’s announcement on October 28,
    2016, that he was reopening the investigation into Clinton’s use of a private
    email server while Secretary of State. That investigation was reopened due to
    evidence that surfaced during the investigation of former Congressman Anthony
    Weiner, whose estranged wife, Huma Abedin, was a top Clinton aide.^([^(159)](#fn159))
    Comey was investigating the possibility that Clinton’s private email server may
    have contained classified information, not the content of emails published by
    Russia or WikiLeaks, but a fast-moving news cycle replete with vague references
    to “Clinton’s emails” likely meant that these news stories compounded each other’s
    impact on voters.


    Perhaps most significantly, though, is that the GRU’s release of `kompromat` on
    Clinton and the DNC meant that *Russia got to set a significant portion of the
    agenda of the presidential election*. Journalists pored over leaked content looking
    for scoops, which they reported. Those same journalists posed questions about
    the content of these documents in debates. And the candidates faced questions
    about these documents all along the campaign trail, from both journalists and
    voters. Every question about this Russian `kompromat`—however legitimate a concern
    that question represented—was a question that didn’t address the policy platforms
    set forth by the campaigns. The hours spent chasing down security concerns and
    prepping answers to these questions were hours not spent by the campaigns building
    and defending their own platform. To a nontrivial extent, Russian hackers determined
    the issues that American voters would devote their limited attention to, and on
    which they would determine how to cast their votes on November 8. My colleagues
    and I call this manipulation of public messaging “weaponized truth.” The contents
    of Fancy Bear’s data dumps appeared authentic to security researchers—they were
    not “fake news.” But they were meant to manipulate public discourse and individuals’
    behavior. Whether or not we call that “disinformation” (I do, because disingenuous
    manipulation is at the core of the operation), it is certainly a component of
    information warfare—and because of its basis in facts, it can be an incredibly
    effective one.'
