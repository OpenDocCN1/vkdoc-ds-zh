    期间声名鹊起的`Milo Yiannopoulos`，在担任 Breitbart 编辑期间与`Steve Bannon`和 Mercer 家族（主要的右翼政治捐赠者，曾大力资助英国
    2016 年 Vote Leave 运动）密切合作，并帮助`Bannon`将“4chan 的智囊和 GamerGate 老手”招致麾下。`Bernstein`对大量
    Breitbart 电子邮件和其他此前秘密文件的深入挖掘揭示了从`Yiannopoulos`延伸出去的联系网络，不仅包括`Bannon`和 Mercer 家族，还包括白人至上主义者`Richard
    Spencer`、`Devin Saucier`（来自被南方贫困法律中心归类为仇恨网站的 American Renaissance）、新纳粹仇恨网站 The
    Daily Stormer 的管理员`Andrew “Weev” Auernheimer`、被起诉并驱逐出境的前特朗普幕僚`Sebastian Gorka`和`Michael
    Flynn`（通过其子`Michael Flynn Jr.`），甚至还有《鸭子王朝》的`Phil Robertson`。尽管 Breitbart 的高层呈现了一个不那么明显的种族主义版本的另类右翼，但`Bernstein`的调查清楚地表明，实际的新纳粹分子——比如那些在弗吉尼亚州夏洛茨维尔组织“团结右翼”集会的人——与在特朗普白宫最高层工作的`Bannon`等人之间，仅仅差一封转发的电子邮件。


    然而，对我们而言更重要的是，GamerGate 的战术延续到了另类右翼中。在 Politico 的一篇文章《世界战争备忘录》中，`Ben Schreckinger`写道，4chan
    的文化和 GamerGate 的战术是如何进入 2016 年美国总统选举的。¹²⁴ 事实上，在许多方面，我们可以将希拉里·克林顿视为最引人注目的 GamerGate
    受害者。


    `Schreckinger`写道，“白人至上主义的另类右翼是在 4chan 的熔炉中锻造出来的”，这个社群“专注于性别政治”。一些 4chan 成员视自己为与左派交战。另一些人则将推选像唐纳德·特朗普这样的人担任总统视为一个巨大的恶作剧，或“宇宙玩笑”。确实是为了好玩。


    就像 GamerGate 一样，这些 4chan 老手将 4chan 的“/pol/”版块（“政治不正确”的缩写）作为“集结地”。像在 GamerGate
    中一样，他们精通一个原本是图像论坛、需要持续参与才能防止帖子被删除的平台，这意味着他们对创造和传播病毒式传播的内容颇为了解。他们利用了这一优势。


    很多在 4chan 上构思的内容都被植入或开始在 Reddit 上进行市场测试。即使在大多数不太体面的子版块中，用户通常也比 4chan 上的用户更主流。4chan
    上的佼佼者往往跨界来到 Reddit，在这里，点赞和点踩系统有助于筛选出最具病毒式传播潜力的内容。（不过`Schreckinger`声称，另类右翼者“操纵规则”以推广他们的一些内容。¹²⁵）


    那些在 4chan 和 Reddit 上证明最成功、对“正常人”最具可及性的内容，随后被植入 Twitter 和 Facebook，在那里，他们很容易像 GamerGate
    时期那样启动同样的自动（机器人）和马甲账号。


    但还有一点。另类右翼并非完全是志同道合者相互发现并在线组织的草根运动。还有资金雄厚的政治操盘手，他们在 GamerGate 期间观察到了这个社群的力量，并愿意让他们在选举政治中发挥作用。根据`Schreckinger`的说法，在竞选初期，特朗普团队就在监控
    Reddit，特别是名为 The_Donald 的子版块。`Schreckinger`将 The_Donald 描述为“4chan 与主流网络之间的渠道”，许多起源于
    4chan 的 meme 和视频通过 The_Donald 进入了主流——包括一些被特朗普竞选团队工作人员甚至唐纳德·特朗普本人分享的内容。据称，这个渠道在
    Steve Bannon 负责特朗普竞选活动期间最为强大。

