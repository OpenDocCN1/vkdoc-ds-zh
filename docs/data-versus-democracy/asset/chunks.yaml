- fmt: '# GamerGate与另类右翼的崛起


    GamerGate还使几位关键人物成为该运动的领导者，其领导力超越了GamerGate本身。在这方面，两位关键人物是前Breitbart编辑`Milo Yiannopoulos`和独立评论员/煽动者`Mike
    Cernovich`。^(117)两人都利用其社交媒体影响力维持着这场运动（`Yiannopoulos`后来因动员骚扰《捉鬼敢死队》女星`Leslie Jones`而被Twitter封禁，^(118)`Mike
    Cernovich`则在传播`#pizzagate`阴谋论中发挥了关键作用^(119)）。两人都能利用自己在GamerGate社群内外的可信度，在各种精通技术、反女权、极右翼甚至极端主义社群之间搭建桥梁。正如Twitter在弗格森抗议者、新兴的Black
    Lives Matter运动以及其他各种现有组织和同情者之间建立了联系，Twitter也使各种反女权主义、在某些情况下公然宣扬白人至上的群体凝聚成一个松散但
    interconnected 的运动，这一运动被称为另类右翼（alt-right）。


    ## 另类右翼的兴起


    `#GamerGate`有若干关键的社会脉络。首先是对游戏世界中普遍存在的女权主义（特别是）与多样性（总体上）的反对。其次是群体动态——在网络更深、更隐蔽的角落进行的“行动”的社会组织，这些行动发生在更开放的网络上。同时，还存在一种自由意志主义与极右翼政治的不安共存，伴随着一种“说真的，谁在乎？！？！”的心态。前者围绕“言论自由”和反政治正确的意识形态集结，后者则“为了好玩”（即LOLs）加入这些行动。^(120)


    这些趋势并未消失，即使GamerGate最终开始平息。尽管从真正意义上说，GamerGate从未平息。它只是将焦点从游戏转向了政治。


    几位记者和新媒体学者都曾撰文论述这一转变。作家`Dale Beran`在谈到4chan时写道，他们“唯一真正的政治声明”是“既然我们有了互联网，所有信息都是自由的”。^(121)
    具体到GamerGate，社会正义战士正在侵犯这种自由，因为他们“向电子游戏中添加了不必要的元素，即那些促进性别平等的元素”，而这是“少数活动家改变电子游戏的大阴谋”的一部分。一些人自行其是，在网上挖掘信息以揭露这一阴谋，既然“所有信息都是自由的”，那么分享和披露他们发现的信息就是完全可以接受的——不，这是他们作为公民的责任。


    这听起来应该很熟悉。一个由沉默但强大的少数派实施的深层阴谋，旨在以社会正义为幌子剥夺多数派的自由——这种信息在美国2016年总统大选期间（以及全球其他一些政治背景下，我们将在后续章节探讨其中一些）引起了许多人的共鸣。而这种由民主党“全球主义者”及其全球同伙实施的“深层政府”阴谋，正是后来被称为另类右翼的运动的关键底层政治理论之一，也是特朗普总统首任幕僚长`Steve
    Bannon`的信仰基础。^(122)


    但GamerGate与另类右翼之间的相似之处不仅仅在于意识形态。另类右翼的许多成员与GamerGate相同。在一篇具有里程碑意义的调查报道中，`Joe Bernstein`的文章《Alt-White：Breitbart机器如何洗白种族主义仇恨》详细记录了两个运动之间的许多具体联系。^(123)
    具体来说，在GamerGate期间声名鹊起的`Milo Yiannopoulos`，在担任Breitbart编辑期间与`Steve Bannon`和Mercer家族（主要的右翼政治捐赠者，曾大力资助英国2016年Vote
    Leave运动）密切合作，并帮助`Bannon`将“4chan的智囊和GamerGate老手”招致麾下。`Bernstein`对大量Breitbart电子邮件和其他此前秘密文件的深入挖掘揭示了从`Yiannopoulos`延伸出去的联系网络，不仅包括`Bannon`和Mercer家族，还包括白人至上主义者`Richard
    Spencer`、`Devin Saucier`（来自被南方贫困法律中心归类为仇恨网站的American Renaissance）、新纳粹仇恨网站The Daily
    Stormer的管理员`Andrew “Weev” Auernheimer`、被起诉并驱逐出境的前特朗普幕僚`Sebastian Gorka`和`Michael
    Flynn`（通过其子`Michael Flynn Jr.`），甚至还有《鸭子王朝》的`Phil Robertson`。尽管Breitbart的高层呈现了一个不那么明显的种族主义版本的另类右翼，但`Bernstein`的调查清楚地表明，实际的新纳粹分子——比如那些在弗吉尼亚州夏洛茨维尔组织“团结右翼”集会的人——与在特朗普白宫最高层工作的`Bannon`等人之间，仅仅差一封转发的电子邮件。


    然而，对我们而言更重要的是，GamerGate的战术延续到了另类右翼中。在Politico的一篇文章《世界战争备忘录》中，`Ben Schreckinger`写道，4chan的文化和GamerGate的战术是如何进入2016年美国总统选举的。^(124)
    事实上，在许多方面，我们可以将希拉里·克林顿视为最引人注目的GamerGate受害者。


    `Schreckinger`写道，“白人至上主义的另类右翼是在4chan的熔炉中锻造出来的”，这个社群“专注于性别政治”。一些4chan成员视自己为与左派交战。另一些人则将推选像唐纳德·特朗普这样的人担任总统视为一个巨大的恶作剧，或“宇宙玩笑”。确实是为了好玩。


    就像GamerGate一样，这些4chan老手将4chan的“/pol/”版块（“政治不正确”的缩写）作为“集结地”。像在GamerGate中一样，他们精通一个原本是图像论坛、需要持续参与才能防止帖子被删除的平台，这意味着他们对创造和传播病毒式传播的内容颇为了解。他们利用了这一优势。


    很多在4chan上构思的内容都被植入或开始在Reddit上进行市场测试。即使在大多数不太体面的子版块中，用户通常也比4chan上的用户更主流。4chan上的佼佼者往往跨界来到Reddit，在这里，点赞和点踩系统有助于筛选出最具病毒式传播潜力的内容。（不过`Schreckinger`声称，另类右翼者“操纵规则”以推广他们的一些内容。^(125)）


    那些在4chan和Reddit上证明最成功、对“正常人”最具可及性的内容，随后被植入Twitter和Facebook，在那里，他们很容易像GamerGate时期那样启动同样的自动（机器人）和马甲账号。


    但还有一点。另类右翼并非完全是志同道合者相互发现并在线组织的草根运动。还有资金雄厚的政治操盘手，他们在GamerGate期间观察到了这个社群的力量，并愿意让他们在选举政治中发挥作用。根据`Schreckinger`的说法，在竞选初期，特朗普团队就在监控Reddit，特别是名为The_Donald的子版块。`Schreckinger`将The_Donald描述为“4chan与主流网络之间的渠道”，许多起源于4chan的meme和视频通过The_Donald进入了主流——包括一些被特朗普竞选团队工作人员甚至唐纳德·特朗普本人分享的内容。据称，这个渠道在Steve
    Bannon负责特朗普竞选活动期间最为强大。'
  raw: 'GamerGate also allowed several key figures to emerge as leaders of the movement,
    whose leadership persisted beyond the bounds of GamerGate itself. Two key figures
    in that regard are former Breitbart editor, Milo Yiannopoulos, and independent
    pundit/provocateur, Mike Cernovich.^([^(117)](#fn117)) Both used their social
    media prowess to keep the movement going (Yiannopoulos, was later banned from
    Twitter for his role in mobilizing a harassment campaign against *Ghostbusters*
    star, Leslie Jones,^([^(118)](#fn118)) and Mike Cernovich played a key role in
    spreading the #pizzagate conspiracy theory^([^(119)](#fn119))). And both were
    able to use their credibility inside and outside the GamerGate community to build
    bridges between a variety of tech-fluent, antifeminist, far-right, and even extremist
    communities. Much like Twitter enabled bridges to be built between Ferguson protesters,
    the emerging Black Lives Matter movement, and a variety of other existing organizations
    and sympathizers, Twitter also enabled various antifeminist, and in some cases
    blatantly white nationalist, groups to coalesce into a loose, but connected, movement
    that has been dubbed the alt-right.


    ### The Emergence of the Alt-Right


    There were several key social strands to #GamerGate. First was the opposition
    to feminism, specifically, and diversity, generally, in the world of gaming. Second
    was the group dynamic—the social organizing on the deeper, darker corners of the
    web for “ops” that took place on the more open web. There was also an uneasy juxtaposition
    of libertarian and far-right politics alongside a “seriously, who CARES?!?!” mentality.
    The former rallied around an ideology of “free speech” and antipolitical correctness,
    the latter joined in these ops “for the lulz” (i.e., LOLs).^([^(120)](#fn120))


    These trends didn’t go away, even as GamerGate finally started to die down. Though
    in a very real sense, GamerGate never died down. It just shifted its focus from
    games to politics.


    Several journalists and new media scholars have written about this transition.
    Author Dale Beran writes of 4chan in general that their “only real political statement”
    is that “all information was free now that we had the internet.”^([^(121)](#fn121))
    Regarding GamerGate in particular, social justice warriors were encroaching on
    that freedom by “adding unwanted elements into their video games, namely things
    that promoted gender equality,” and that this was part of “a grand conspiracy
    perpetrated by a few activists to change video games.” Some took it upon themselves
    to dig for information online that would uncover this conspiracy, and since “all
    information [is] free,” it was perfectly acceptable—nay, it was their duty as
    citizens—to share and expose the information they uncovered.


    This should sound familiar. The idea of a deep conspiracy carried out by a silent
    but powerful minority, directed at taking away the freedom of the majority under
    the banner of social justice—that is messaging that resonated with many during
    the 2016 presidential election in the United States (among other political contexts
    around the globe, some of which we will explore in the chapters to follow). And
    this “Deep State” conspiracy perpetrated by the “globalists” of the Democratic
    Party and their cronies throughout the world was one of the key underlying political
    theories of the movement that became known as the alt-right, as well as the foundational
    belief system for President Trump’s first chief of staff, Steve Bannon.^([^(122)](#fn122))


    But the similarities between GamerGate and the alt-right are not simply ideological.
    The alt-right is made up of many of the same people as GamerGate. In a landmark
    piece of investigative journalism, Joe Bernstein’s article “Alt-White: How the
    Breitbart Machine Laundered Racist Hate” chronicles many of the specific connections
    between these movements.^([^(123)](#fn123)) Specifically, Milo Yiannopoulos, who
    rose to prominence during GamerGate, worked closely with Steve Bannon and the
    Mercer family (major right-wing political donors who, among other things, substantially
    funded UK’s Vote Leave campaign in 2016) while an editor at Breitbart and helped
    Bannon bring “the 4chan savants and GamerGate vets” into the fold. Bernstein’s
    deep dive into a trove of Breitbart emails and other previously secret documents
    reveals connections fanning out from Yiannopoulos not just to Bannon and the Mercers,
    but white nationalist Richard Spencer, Devin Saucier (of American Renaissance,
    categorized as a hate web site by the Southern Poverty Law Center), Andrew “Weev”
    Auernheimer (administrator of neo-Nazi hate site, The Daily Stormer), indicted
    and ousted former Trump staffers Sebastian Gorka and Michael Flynn (through his
    son Michael Flynn, Jr.), and even *Duck Dynasty*’s Phil Robertson. While the top
    brass at Breitbart presented a less explicitly racist version of the alt-right,
    Bernstein’s investigation makes it clear that actual neo-Nazis—like those who
    organized the Unite the Right rally in Charlottesville, Va.—were just a forwarded
    email away from Bannon and others who worked at the highest levels of the Trump
    White House.


    More important for our considerations, though, is that the *tactics* of GamerGate
    continued into the alt-right. In an article for Politico, “World War Meme,” Ben
    Schreckinger writes about how the culture of 4chan and the tactics of GamerGate
    made their way into the 2016 U.S. presidential election.^([^(124)](#fn124)) In
    fact, in many ways, we can see Hillary Clinton as simply the highest profile GamerGate
    victim.


    Schreckinger writes that “the white nationalist alt-right was forged in the crucible
    of 4chan,” a community that was “preoccupied with gender politics.” Some 4chan
    members saw themselves at war with the left. Others saw electing someone like
    Donald Trump to the presidency as a massive prank, or “cosmic joke.” For the lulz,
    indeed.


    Just like GamerGate, these 4chan vets used 4chan’s “/pol/” board (short for “politically
    incorrect”) as a “staging ground.” Like in GamerGate, their fluency with a platform
    that was originally an image board and which requires constant engagement to keep
    a thread from getting deleted meant that they knew a thing or two about creating
    and propagating viral media. They used this to their advantage.


    Much of what was workshopped in 4chan was seeded or market tested on Reddit. Even
    in most of the less savory subreddits, users tend to be more mainstream than those
    on 4chan. The cream of the crop on 4chan often crossed over to Reddit, where the
    system of up- and downvotes helped filter for the most viral-ready content. (Though
    Schreckinger claims that alt-righters “juiced the rules” to promote some of their
    content, anyway.^([^(125)](#fn125)))


    The content that proved the most successful on 4chan and Reddit—the most accessible
    to “normies”—was then seeded on Twitter and Facebook, where it was easy for them
    to spin up the same kinds of automated (bot) and sockpuppet accounts that they
    did during GamerGate.


    But there was one more wrinkle. The alt-right wasn’t entirely a grassroots movement
    of like-minded individuals who found each other and organized online. There were
    also well-funded political operatives who had observed the power of this community
    during GamerGate and were willing to put them to work in electoral politics. According
    to Schreckinger, early on in the election, the Trump campaign was monitoring Reddit,
    in particular one subreddit named The_Donald. Schreckinger describes The_Donald
    as “a conduit between 4chan and the mainstream web,” and numerous memes and videos
    that originated on 4chan made it through The_Donald into the mainstream—including
    some that were shared by Trump campaign staffers and even Donald Trump himself.
    And this conduit was allegedly the strongest during the time that Steve Bannon
    was in charge of Trump’s campaign.'
