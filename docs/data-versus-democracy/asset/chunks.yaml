- fmt: "# The Mob Rules -or- Who Decides What Stories Get Told? [redux]\n\nUltimately,\
    \ we’ll never know the full impact that social platforms had on these domestic\
    \ U.S. social issues in 2014 and beyond. We won’t know how many lives were saved\
    \ (or lost) by the increased public awareness and mobilization around police violence\
    \ and racial discord. We’ll never know how the lives of the victims of `GamerGate`\
    \ would have been different if the social web hadn’t provided their attackers\
    \ the platforms for finding each other and microtargeting their messages of hate\
    \ and violence. We’ll never know how many votes were changed or suppressed by\
    \ influence operations leading up to the 2016 election.\n\nOf course, there are\
    \ some things we *do* know. We know that police violence and racial tension did\
    \ not begin, or end, in Ferguson. We know that prominent women—especially those\
    \ who rock the boat or speak out about injustices—have always been targeted more\
    \ than men in the same position, especially in the world of tech. We know that\
    \ the influence operations perpetrated by alt-right meme warriors (as well as\
    \ some on the left, and—as we’ll explore in the next chapter—foreign agents seeking\
    \ to interfere in U.S. politics) changed the tone of the election and influenced\
    \ the topics we were debating.\n\nAnd we know that social media played a significant\
    \ role in shaping how all of these events turned out. As `DeRay McKesson` said,\
    \ those of us outside the St. Louis area might not have ever known about Ferguson—let\
    \ alone joined in or raised our collective voices—were it not for `Twitter`. On\
    \ the other hand, the same openness that allowed activists to organize in Ferguson\
    \ allowed attackers to organize and perpetrate their attacks against women and\
    \ their allies during `GamerGate`. But from yet another perspective, that openness\
    \ is what gave voice, reach, and new business opportunity to independent game\
    \ developers like `Quinn` and `Wu` and critics like `Sarkeesian`. And for better\
    \ or for worse, the affordances of forums like `4chan`, with its disappearing\
    \ threads, and `Reddit`, with its upvotes and downvotes, honed the skills of those\
    \ who sought to create and propagate viral media beyond those platforms.\n\nTo\
    \ some extent, we will always have to take the good with the bad when it comes\
    \ to technology. But that doesn’t mean that the tools—or the people and companies\
    \ who create and maintain those tools—are neutral. And it certainly doesn’t mean\
    \ that they don’t bear at least *some* responsibility for what happens on their\
    \ platforms, even if in some cases that responsibility is moral and ethical rather\
    \ than explicitly legal.\n\nWhen a judge tells an independent online game developer\
    \ to stay off the internet and find a new career if she wants to avoid harassment\
    \ and abuse, that’s akin to telling someone to avoid the mall or the grocery store.\
    \ The internet is a core part of our lives in the twenty-first century, and social\
    \ media is a “mediated public space,” where those who own and run the “private”\
    \ platforms have a responsibility to at least do their due diligence toward providing\
    \ safe access for those they invite to make use of those platforms. But we don’t\
    \ need to wait for them to do it. Like during many technological revolutions in\
    \ past centuries, it will take the will and the work of the people at large to\
    \ shape the evolution of these “mediated public spaces” and to advocate for legislative\
    \ change where necessary to ensure fair, safe access for all.\n\nTo that end,\
    \ I leave you with two inspirational quotes from two prominent women in tech.\n\
    \n> People believe they are powerless and alone, but the only thing that keeps\
    \ people powerless and alone is that same belief. People, working together, are\
    \ immensely and terrifyingly powerful.\n> \n> —Quinn Norton^([^(126)](#fn126))\n\
    \n> Although what was done to me wavs heinous, those responsible for obliterating\
    \ my old life have overlooked one important thing: I’m better at games than they\
    \ are.\n> \n> —Zoë Quinn^([^(127)](#fn127))\n\n## Summary\n\nIn this chapter,\
    \ we explored three distinct but related historical events where the affordances\
    \ and limitations of social media platforms had a significant impact on the way\
    \ those events played out: the protests following the shooting of `Michael Brown`\
    \ in Ferguson, Missouri, the `GamerGate` attacks on prominent women in the video\
    \ game industry, and the mobilization of the alt-right during the 2016 U.S. presidential\
    \ election. In each case, the affordances of platforms like `Twitter`, `4chan`,\
    \ and `Reddit`—combined with the ideology and customs of the communities that\
    \ inhabited them—led to particular kinds of novel “operations.” Social media is\
    \ a powerful tool for community organizing and for recruiting new members to a\
    \ movement. But it is not always used for social good, and the limitations of\
    \ these platforms and the online space in general can pose challenges to law enforcement,\
    \ and on the grander scale to legislators and platform administrators, as they\
    \ seek to balance the rights of free speech and free assembly with the rights\
    \ to life, liberty, and safety.\n\nIn many ways, 2014 was a beginning, or at least\
    \ a point of major acceleration, when it comes to social media’s impact on society.\
    \ And it wasn’t just in the United States. In the chapters that follow, we’ll\
    \ unpack operations outside those borders, including operations that cross borders.\
    \ Operations that involve far more than serendipitous community organizing.\n\n\
