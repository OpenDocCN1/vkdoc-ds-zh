  trans: '

    ### 注意力的触发机制


    注意力是极其昂贵的。如此高度的神经激活状态，更不用说随之而来的信息处理过程，都需要消耗大量的能量。这种能量得来不易。因此，大脑会将绝大部分时间和数据处理在较低的激活状态，远离消耗巨大的意识层面，仅留下极少数的时间窗口。


    当然，这样一个高效有序的系统需要结构支撑——这些规则决定了我们关注什么，以及何时关注。对于外部刺激——视觉、听觉、嗅觉——存在着许多基于数千年自然选择形成的优先级规则。


    正如我们之前讨论过的，我们的基因密码很大程度上是由远古祖先在求生存的过程中书写的。^(³⁹) 因此，15 万年前在稀树草原上关乎生死存亡的事物，如今更有可能主宰我们的注意力。如果有人从你背后悄悄靠近，突然发出一声巨响，你会跳起来，猛吸一口气（倒吸一口凉气），汗毛倒竖（这是我们祖先为了让自己看起来比实际更庞大、更凶猛而留下的痕迹），心跳也会加速（准备为肌肉输送这口额外的氧气，无论它们是为了战斗还是逃跑）。也许令人惊讶的是，如果他们再次悄悄靠近你，但这次提前告知了你，其中一些反射依然会发生，*即使你早就知道它要来*。我们的一些祖先之所以能幸存下来，正是因为这些反射如此迅速和可靠，以至于大脑永远无法关闭它们。（事实上，其中一些被称为“脊髓反射”^(⁴⁰)的反应是由脊髓直接指挥的，因为我们的神经冲动以光速从大脑往返一趟，实在是太慢了！）而那些幸存下来的祖先，将他们躲避剑齿虎的基因传递给了我们。


    其他记忆——那些对祖先生存不那么关键的记忆——可以被我们有意识地回忆起来。那个人是谁？他的电话号码是多少？我进这个房间是要拿什么东西来着？


    还有一些记忆感觉更自然，更像是自动化的。我们可能需要费点力气才能记住新同事上班第二天的名字，但要记住配偶、伴侣或孩子的名字则毫不费力。这是因为，在我们这个“大数据”大脑内部，隐藏着世界上最先进的预测分析引擎。我们经常访问的数据会比很少访问的数据保持更“激活”的状态，就像那些尽管我们试图按字母顺序排列，却总会跑到橱柜最显眼位置的香料一样。与我们已经激活度较高的记忆相关联的某些记忆，其激活度也会随之升高。这就是为什么我们可能一时想不起某个密码或电话号码，但当我们坐在键盘前或拿起电话时，它却自然而然地冒出来了。认知科学家称这种现象为*启动效应*。


    `启动效应`是大脑管理记忆过程中至关重要的一环。它能预见我们的需求，及时提供我们所需的信息以快速做出反应（以备不时之需），并且在此过程中保持低能耗。但由于`启动效应`是我们管理自身注意力的关键要素，它也可能被他人利用，与处理刺激的硬连线式进化规则相结合，以此来控制我们的注意力，并至少在某种程度上控制我们看待世界的方式。


    ### 熟悉催生可信：无意识记忆的作用


    我们无时无刻不在评估我们所感知的一切。是安全还是危险？是好还是坏？是令人兴奋还是无聊？是意料之中还是出乎意料？这些评估会转化为我们所体验到的情感。当某事物既令人惊讶又危险时，结果就是恐惧。如果这种令人惊讶且危险的感知长时间占据我们的注意力，结果就是恐怖。另一方面，如果那个令人惊讶的事物结果并不危险，结果可能变成笑声——或者正如认知科学家大卫·休伦所称的“愉悦的喘息”（这是对你因即刻恐惧反应而吸入的所有氧气的一种处理方式）。^(⁴¹)
    如果某事物可预测且无害，结果可能就是无聊，尤其是当这种状态持续很长时间时（想象一下你觉得索然无味却又无法脱身的音乐会或讲座）。另一方面，如果某事物难以预测，但也无害，结果可能是茫然失措，如果这种状态持续很长时间，就会变成沮丧。^(⁴²)
    这正是某些人在听先锋派音乐时所感到的那种毛骨悚然，或是他们在体验其他先锋派艺术形式时所感到的厌恶的核心。它不过是音乐、画作或雕塑，但事实上它如此强烈、如此长久地攫取我们的注意力，而大脑却不知如何理解它，从进化角度看，这是一件非常糟糕的事情。我们的祖先进化出对这种情境的情感反应，促使他们将来试图避开这些情境，这完全合情合理。


    情感可能是一件非常复杂的事情。关于情感认知科学的著作可谓汗牛充栋。但就理解人类如何与网络媒体互动这一目的而言，我们只需涵盖几个关键要素。这些要素会影响我们识别网上虚假信息、错误信息和“假新闻”的能力（或无能），以及会促进社会极化的因素。我们从简单而强大的一点开始讲起：*单纯曝光效应*。


    由于我们的进化历史，我们总是在评估所遇到或感知到的事物——即刺激——是积极的还是消极的。（科学家将刺激的积极或消极性质称为其*效价*。）我们关乎生死的进化历史意味着，我们做出这些评估的速度非常之快。这些瞬间判断可以拯救我们的生命，但如果它们在某些社交场合无意识地发生，就可能形成过度概括、刻板印象，甚至导致性别歧视和种族主义。


    当我们遇到某个刺激时，促成积极情感的一个因素是大脑处理其感知信息的容易程度——这被称为*感知流畅性*。如果大脑能够快速、毫不费力地处理、理解和评估这个刺激，结果就是产生积极的情感或情绪。例如，这就是为什么钢琴上（以及耳蜗中）相邻的音符听起来是“不和谐”的，而不是形成悦耳的和弦。^(⁴³)
    那些让大脑处理起来更困难的东西——相似的颜色、声音或外观——会使得区分感知到的项目并按大脑喜欢的方式对其进行分类变得困难。


    颜色、音高等方面的差异，在很大程度上是先天固化的差异。我们或许能通过艺术和音乐训练，做出比普通人更精细的判断，但精细程度也有限。我们内耳和视网膜的物理限制决定了我们的感知能力能发展到何种精细程度。

