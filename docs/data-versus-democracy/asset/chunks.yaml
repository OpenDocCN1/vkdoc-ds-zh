- fmt: 'This polarization is the result of more than just emotion, though. People
    tend to engage with things that reinforce their existing point of view, what scientists
    call *confirmation bias* —if I agree with it already, there must be something
    good about it. This includes things that seem to confirm its accuracy—after all,
    it feels good to discover new information that proves you were right all along!—or
    to confirm the inaccuracy of the people who hold a different position. We have
    an evolved (and important!) predisposition to dislike, and avoid, circumstances
    that surprise us with our own faults. In a past era of regular predator-prey interactions,
    such situations were often deadly. But when it comes to political debate online,
    that evolved predisposition encourages us to avoid situations where we can grow
    intellectually, ethically, and morally, both as individuals and as a society.
    By avoiding nuance and succumbing to `confirmation bias`, we again move further
    from the center—and from those we disagree with. We build our own personal echo
    chambers, all the while believing that we are basing opinions on a *wider* base
    of information, thanks to the wonders of the world-wide web. Under this delusion,
    and without intervention, society becomes more fragmented, and it is harder for
    people from differing ideologies to find common ground.


    Though we live in the most information-rich, most connected era in human history,
    the way our minds *naturally* deal with such information abundance means our generation
    is probably the most susceptible to propaganda in human history. But I stress
    *naturally*. Our genetic predispositions, hard won by our ancestors as they fought
    off threats from every side, are in many ways a tremendous gift. But in an era
    where most of us are *not* regularly threatened by predators, but by people who
    would seek to use media to manipulate our attention to influence our minds and
    our behavior, we are *naturally* equipped with the wrong tools for dealing with
    these threats. We have a great instinct for what to do when a predator surprises
    us from behind, or when we are low on calories and confronted with a bounty of
    food to eat. But we have no instinct for `digital disinformation`.


    However, we *have* evolved the capacity to learn, to analyze, to reason, to communicate,
    to persuade with logic. These are not our *automatic* instincts. But if we direct
    our minds appropriately—if we master our own attention in the right ways at the
    right times—we can resist this manipulation and build a better society. But it
    takes work. And before that, it takes an understanding of the problem.


    That’s what we’ll explore in this book.


    ### Where We’re Headed


    We’ll begin by unpacking the “propaganda problem.” Why is our conscious attention
    so limited? How limited is it? And what are the implications for how we engage
    information in the digital age? We’ll also explore the algorithmic basis of social
    media and other content recommendation systems (like Pandora, Netflix, and Amazon)—how
    they work technically, how they interact with the strengths and limitations of
    our cognitive system, and how they can be “hacked” to influence our thoughts and
    actions.


    Then we’ll explore several case studies in how social media–based operations have
    significantly impacted public consciousness—even public action. From the Ferguson
    protests, organized and proliferated on Twitter and Vine, which led to significant
    growth of the Black Lives Matter movement, to the coordinated harassment of female
    game designers and critics on Twitter known as GamerGate, to the influence operations—both
    domestic and international—at work in recent elections and political uprisings
    in Ukraine, Sweden, the United States, Turkey, Brazil, the Philippines, Myanmar,
    Mexico, and Colombia.


    We live in an era different from any we’ve ever seen before. We have the tools,
    the information, and the interpersonal connections to accomplish amazing things.
    But like the discovery of fire or the harnessing of nuclear energy, our newfound
    digital capabilities also leave us vulnerable to human-made disaster, the likes
    of which we’ve only begun to dream up. This power can be used for good, used for
    evil, or treated as a toy. By too often making digital technology a mere plaything,
    we open ourselves to those who may use it for our undoing. But with a little education,
    a little regulation, and a lot of care, we can turn this digital technology back
    into a beacon of hope.


    It is my aim in this book to bring that education, foster that care, and, yes,
    encourage that regulation. Because if we work together, and we get it right, we
    *can* do some amazing things.


    So let’s get started.


    ## Acknowledgments


    How do you write the acknowledgments section for a book like this? If researching
    and writing this book has taught me anything, it’s that some things are best said
    in private and, if possible, in person. So in lieu of public acknowledgments,
    I have decided to give a personal, hand-written note to those who educated, inspired,
    or otherwise helped me on this project. And hopefully, that note will be delivered
    in person and accompanied by a drink or a meal.


    However, there is one group of people too large to thank individually, but whose
    influence and motivation have been immeasurable. To all my students over the years,
    who have inspired me with their hard work, their brilliance, and their desire
    to make the world a better place, I thank you. May each of you make your own dent
    in the universe and nudge humanity, even a little bit, in the right direction.


