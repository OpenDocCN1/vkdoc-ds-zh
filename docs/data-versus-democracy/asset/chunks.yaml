    # 这是我们在世界各地反复看到的一种模式，但在全球南方或许更为突出


    无论是埃及、巴西还是缅甸，年轻的民主制度与新兴技术的结合都可能引发动荡。当一个人正经历社会剧变、政治或民族冲突时，如果同时给予他言论自由*和*一部智能手机，结果充其量将是难以预测的。即便*每个人都怀着最好的意图*，情况也是如此。但当他们并非如此时，结果可能是灾难性的。


    归根结底，即使没有外国国家行为体的参与，社交媒体和数字连接也是一把双刃剑。新技术既非天生善良，也非天生邪恶，*更非天生中立*。每项技术都有特定的*可供性*和特定的*局限性*，虽然它们可能不带有价值判断，但确实倾向于产生某种特定的社会效应。当一个社会已经经历社会冲突或剧变时，这些效应往往会变得更加剧烈且更难预测。对于许多在几乎同一时间经历社会变革和快速技术应用的国家来说，这种技术——无论是好是坏（或两者兼有）——已永远改变了那些社会。


    ## 巴西的机器人水军


    巴西的政治格局充满忧患、支离破碎且不稳定。它是一个年轻的民主国家，直到 1985 年才摆脱独裁统治。截至 2014 年，巴西国会两院中有 28 个政党拥有代表席位，治理几乎完全通过联盟方式进行。这可能导致令人不安甚至灾难性的联盟，例如
    2014 年使迪尔玛·罗塞夫连任总统的那个联盟。作为 2010 年联盟建设的一部分，她任命了另一党派的成员米歇尔·特梅尔作为她的副总统竞选搭档。然而，当罗塞夫在
    2014 年连任后几乎立即爆发弹劾呼声时，特梅尔加入了反对派。2016 年罗塞夫被罢免后，特梅尔成为新总统。虽然巴西普通公民确实提出了关于罗塞夫执政的真正问题，但看来社交媒体机器人水军在影响公众情绪并促成最终成功的弹劾呼声方面发挥了重要作用。


    基于社交媒体的虚假信息是巴西政治中的常态。在巴西，政治竞选活动花钱在社交媒体上传播信息是违法的。巴西法律还规定，所有社交媒体竞选活动必须由“自然人”控制——即不能通过自动化运行。^(¹⁹²)
    然而，由于这些法律执行起来极其困难，自动化操作和网络谣言已成为巴西从总统选举到地方选举的众多政治竞选活动中不可或缺的一部分。


    在迪尔玛·罗塞夫的案例中，她的竞选团队和 2014 年总统选举对手阿埃西奥·内维斯的竞选团队似乎都使用了社交媒体机器人水军来传播竞选信息或互相抹黑。根据研究员丹·阿尔瑙多的说法，内维斯在总统竞选中使用机器人水军的程度比罗塞夫更广泛。^(¹⁹³)
    然而，一旦罗塞夫赢得选举，大多数反罗塞夫的机器人水军仍保持在线，并几乎立即加入了支持弹劾的运动。用阿尔瑙多的话说，“线上竞选从未结束，这些网络成为了制造弹劾支持的关键工具。”^(¹⁹⁴)
    雪上加霜的是，罗塞夫的社交媒体工具现在属于政府，这意味着更严格的限制和监督，这使支持弹劾的网络在线上占据了明显优势。


    机器人水军可能产生各种影响。有时这些影响微乎其微，甚至为零。毕竟，如果没有受众，即使是最活跃、最煽动性的机器人水军也只是在对着空气“大喊大叫”。2018 年的情况尤其如此，因为各平台已采取措施预防（即使无法根除）由自动化驱动的滥用行为。例如，推特现在更积极地删除机器人水军，并阻止新账户出现在搜索结果中或推动“热门”话题，直到它们显示出“有机”使用的迹象。脸书则大幅收紧了通过其应用程序编程接口（`API`）可执行的操作，使得自动化操作变得更加困难。然而在
    2014 年，平台的开放程度要大得多，自动发布的帖子、评论、转发/分享以及点赞/收藏在两个平台上都易于大规模管理，从而导致了脸书新闻推送和推特实时“趋势”中算法内容筛选被“入侵”。事实上，正如阿尔瑙多所述，在推特上“[关于罗塞夫弹劾运动]被转发最多的消息是由机器人水军生成的。”^(¹⁹⁵)


    我们无法量化自动化及其他虚假/欺诈性在线活动对巴西选举和弹劾结果究竟产生了多大影响。然而，从最常被分享内容的互动水平以及尽管违法却持续存在的竞选资金投入来看，其影响不容小觑。而当推特趋势、脸书新闻推荐以及
    YouTube 的“接下来播放”自动播放视频对用户遇到的内容产生重大影响时，即使直接影响力很小，一旦被操纵的输出成为后续算法分析的输入，这种影响也会被放大。（请回想第
    3 章关于算法反馈循环的讨论。）

