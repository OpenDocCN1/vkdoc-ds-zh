    Then we’ll explore several case studies in how social media–based operations have
    significantly impacted public consciousness—even public action. From the Ferguson
    protests, organized and proliferated on Twitter and Vine, which led to significant
    growth of the Black Lives Matter movement , to the coordinated harassment of female
    game designers and critics on Twitter known as GamerGate , to the influence operations—both
    domestic and international—at work in recent elections and political uprisings
    in Ukraine, Sweden, the United States, Turkey, Brazil, the Philippines, Myanmar,
    Mexico, and Colombia.


    We live in an era different from any we’ve ever seen before. We have the tools,
    the information, and the interpersonal connections to accomplish amazing things.
    But like the discovery of fire or the harnessing of nuclear energy, our newfound
    digital capabilities also leave us vulnerable to human-made disaster, the likes
    of which we’ve only begun to dream up. This power can be used for good, used for
    evil, or treated as a toy. By too often making digital technology a mere plaything,
    we open ourselves to those who may use it for our undoing. But with a little education,
    a little regulation, and a lot of care, we can turn this digital technology back
    into a beacon of hope.


    It is my aim in this book to bring that education, foster that care, and, yes,
    encourage that regulation. Because if we work together, and we get it right, we
    *can* do some amazing things.


    So let’s get started.


    Acknowledgments


    How do you write the acknowledgments section for a book like this? If researching
    and writing this book has taught me anything, it’s that some things are best said
    in private and, if possible, in person. So in lieu of public acknowledgments,
    I have decided to give a personal, hand-written note to those who educated, inspired,
    or otherwise helped me on this project. And hopefully, that note will be delivered
    in person and accompanied by a drink or a meal.


    However, there is one group of people too large to thank individually, but whose
    influence and motivation have been immeasurable. To all my students over the years,
    who have inspired me with their hard work, their brilliance, and their desire
    to make the world a better place, I thank you. May each of you make your own dent
    in the universe and nudge humanity, even a little bit, in the right direction.


