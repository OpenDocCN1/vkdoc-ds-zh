  trans: '

    ### 反社会媒体：家庭心理虐待手段的升级


    这场讨论并未止步于言语交锋。事态迅速演变为暴力行为。当乔尼的帖子发布后，奎因回忆收到一位朋友的消息：“你刚被狠批了一顿。”^(¹⁰⁴) 此后不久，旧短信、私密照片乃至彻头彻尾的捏造内容便充斥于互联网的阴暗角落。她遭遇了人肉搜索——个人隐私信息遭公开曝光——完全陌生的人不分昼夜地给她打电话。家人也遭到人肉搜索，涉及隐私、威胁性的媒体内容被寄送给他们，甚至通过邮寄方式。她早已遗忘的账号遭到黑客入侵。尽管这类事件此前也发生在人们身上——尤其是女性身上——但这一次却迟迟无法平息。^(¹⁰⁵)
    数月后，2015 年 1 月，奎因撰写了题为《八月永不终结》的博客文章，记录持续的袭击。^(¹⁰⁶) 在其 2017 年出版的《崩溃覆盖》一书序言中，奎因写道：“多数恋爱以分手告终。有时分手疯狂到让你对朋友、家人和心理咨询师讲述一个恐怖故事……而我的分手需要联合国介入。”^(¹⁰⁷)


    事后回顾，甚至在事件演变过程中就已清晰：这已远超《抑郁探索》或佐伊·奎因个人范畴。正如亚当·鲍德温所言，**玩家门**是一场针对奎因——以及游戏开发者布丽安娜·吴和女权主义游戏评论家安妮塔·萨凯西安，以及任何公开声援她们的人——的猛烈宣泄，但这股怨气已酝酿多时。^(¹⁰⁸)
    玩家门爆发恰逢独立游戏产业真正腾飞之时，绝非偶然——彼时，刻板印象中的游戏与玩家正被日益多元的游戏市场“排挤”，而这类市场面向的玩家群体也日趋多样化。^(¹⁰⁹)


    尽管玩家门的社会学现象既引人入胜又令人痛心，但对于此类书籍而言，重要的是其策略及其后续影响。玩家门事件中出现了若干关键战术趋势，并延续至后续行动中，威胁着美国及其他地区的公共讨论，甚至危及选举的公正性。


    正如弗格森抗议者组织线上活动一样，玩家门支持者也通过网络组织起来。但关键区别在于：他们并非利用推文等流行平台来组织招募以发动街头活动，而是借助知名度较低的平台，如
    `4chan`、`8chan` 及更阴暗的 subreddit 子版块来策划行动，再在推文等更公开的社交媒体上实施。换言之，推文并非组织平台，而是战场。他们在此处操控马甲账号和机器人，散布人肉信息和针对目标的谎言、宣传其行动使命，并直接对目标发动攻击。


    使用自动化账号（即机器人）传播虚假信息也是玩家门的显著特征。我记得首次在推文中使用“玩家门”一词时，几乎立刻收到数个无可靠个人身份信息的账号回复。一条是滑稽的玩家门口号：“实际上，玩家门关乎游戏新闻业的伦理。”另一条指向一段批评
    Kotaku 网站伦理的 YouTube 视频。这些回复与我推文内容毫无关联，显然是企图恐吓任何胆敢公开讨论该运动的局外人的恐吓战术。


    这些机器人会对各类推文作出反应。有几次——甚至直到 2017 年——只要我发布包含“doxxed”一词的推文，一个头像为东正教犹太男子油画、用户名含反犹侮辱语的机器人便会立即回复，声称“doxxed”是“doxed”的拼写错误。（`dox`
    的过去式可接受一个或两个 X，我恰好偏爱两个 X。）这种自动化恐吓虽技术成本低廉，却能在社会层面有效压制某些声音，并对该运动的公共讨论施加不成比例的控制。


    ### 毫无准备：平台、警方与法院（未能）如何应对


    尽管谎言、定向骚扰与人身暴力威胁不断，玩家门的受害者却难以从平台和执法机构获得帮助。执法部门不知如何处理奎因的报案。^(¹¹⁰) 布丽安娜·吴呼吁联邦政府调查并起诉
    `8chan` 所有者，但未获成功。^(¹¹¹) 推文以“言论自由”为由极度犹豫关闭账户。在一起刑事骚扰案（被告获判无罪）中，法官竟建议奎因若想避免骚扰，或许应远离互联网。当她提醒法官，作为独立游戏开发者，她的工作不仅需要线上存在，还需活跃的社交媒体账号时，法官回应道：“你是个聪明的孩子……换个职业吧。”^(¹¹²)


    尽管攻击从未完全停止，奎因、萨凯西安与吴勇敢抗争，成为推动游戏行业及社交媒体平台变革的强音。奎因和萨凯西安曾向联合国谈及网络虐待与骚扰。^(¹¹³) 奎因创立了名为“崩溃覆盖网络”的公司，帮助遭受协同网络攻击的个人与平台合作，关闭那些在攻击过程中违反法律和服务条款的账号。^(¹¹⁴)
    吴甚至竞选过美国国会议员。^(¹¹⁵) 尽管玩家门试图将她们——以及众多女性、有色人种和 LGBTQ 群体成员——排挤出游戏行业，但这三人仍坚持从事游戏相关工作。


    然而，除了奎因、萨凯西安、吴等人将玩家门的根本社会问题——以及 `4chan`、`8chan`、Reddit 和推文等平台如何助长其行动——带入公众视野外，玩家门期间还涌现出其他关键人物与运动。玩家门支持者自身也发现了自己的力量。


    玩家门支持者并非仅仅是网络上的恶棍。他们是一群精通技术的个体，许多人将大量生命沉浸在网络上，尤其活跃于 `4chan` 等图像论坛。这些论坛的便利条件与局限性，以及基于平台结构形成的社区实践，催生了玩家门群体特定的战术优势，并使其运用于玩家门之外。例如，`4chan`
    是一个内容帖子会被快速删除的平台。类似地，Reddit 的点赞/点踩系统，加上网站首页对高互动内容的突出展示，激励并奖励病毒式内容的创作。尤其是一些 `4chan`
    资深用户，往往对什么内容会火有敏锐直觉，或至少掌握该平台上内容是否成功的证据。这种对传播模式的洞察力——常结合对细节的执念（一些 `4chan` 用户无耻地将此称为“武器化的自闭症”^(¹¹⁶)）以及推文自动化技能——使他们在创造和传播模因及其他潜在病毒内容时占据优势。

