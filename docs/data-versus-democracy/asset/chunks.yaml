    ## 在菲律宾“武器化”的 Facebook


    巴西并非唯一一个在选举结束后，其首次创建的社交媒体虚假信息机制仍被保留并改造后继续运作的国家。2016 年 5 月，在罗德里戈·杜特尔特总统当选后，菲律宾民众目睹了他竞选团队强大的社交媒体宣传机器成为新政府的关键组成部分。


    罗德里戈·杜特尔特一开始就处于劣势。如果以传统媒体的竞选支出来看，他可供使用的资金比一些对手要少。然而，他拥有一套强大的社交媒体机器。杜特尔特的团队转向线上，因为“有限的竞选资金迫使他们创造性地利用社交媒体空间。”^(¹⁹⁶)
    他们充分利用了 Facebook 在选举前为总统候选人提供的“培训课程”。在一个智能手机数量超过人口数量、且 97%的网民都使用 Facebook 的国家，^(¹⁹⁷)
    对 Facebook 的精通被证明是不可或缺的。


    杜特尔特的社交媒体团队由尼克·加布纳达领导，由数百名有联系的志愿者组成。“这是一场去中心化的竞选活动：每个小组创作自己的内容，但竞选叙事和关键的每日信息由中央统一确定，并层层传达执行。”^(¹⁹⁸)
    （这与我们在上一章探讨的同一年俄罗斯在美国的行动策略相似。）值得注意的是，杜特尔特支持者所推广的内容不仅仅是政策立场和无害的支持声明。许多杜特尔特支持者呼吁对其批评者实施暴力，导致
    2016 年 3 月出现网络暴民威胁要对一小群反对杜特尔特的学生施暴甚至杀害的情况。^(¹⁹⁹) 记者玛丽亚·雷萨（Rappler 网站创始人）称这是一种旨在恐吓或压制批评者的“千刀万剐”策略，即大量用户用网络威胁淹没目标。^(²⁰⁰)


    杜特尔特成为总统后，问题变得更糟。劳伦·埃特写道：“自 2016 年 5 月当选以来，杜特尔特已将 Facebook 变成一件武器。那些曾不择手段帮助杜特尔特获胜的
    Facebook 红人被带进了马拉卡南宫。”^(²⁰¹) 加布纳达告诉另一位 Rappler 记者：“（选举后）有必要继续竞选，因为他们只获得了‘40%的选票’，需要更多支持才能让杜特尔特有效执政。”^(²⁰²)


    这远不止是总统发推文，甚至是一个机器人团队放大他的信息那么简单。这是一项旨在巩固杜特尔特权力并压制反对者（无论是政客还是记者）的协调媒体战略的一部分。选举后不久，杜特尔特抵制私人媒体长达两个月，拒绝与任何独立记者交谈，仅通过国家控制的媒体推送宣传。与此同时，亲杜特尔特的网络喷子和傀儡账号（由真人控制的虚假账户）攻击批评政府的独立记者。当雷萨发表揭露其中许多活动的文章《宣传战》时，她立即遭到亲杜特尔特网络喷子的攻击，包括死亡和强奸威胁，以及要求她离开菲律宾的呼声。用雷萨的话说，自杜特尔特当选以来，“当有人在
    Facebook 上批评警方或政府时，立即就会有人发起攻击。”^(²⁰³)


    根据埃特的说法，这不仅仅是杜特尔特政府“入侵”系统或利用 Facebook 定向广告功能那么简单。除了向菲律宾总统竞选活动提供培训课程外，选举后 Facebook“开始深化与新政府的合作关系。”^(²⁰⁴)
    这并非特例，而是“Facebook 为世界各地政府所做的事情……提供‘白手套’服务，以帮助其最大限度地发挥平台潜力并采用最佳实践。”埃特继续说道：


    *   尽管杜特尔特禁止独立媒体进入黎刹典礼厅现场直播他的就职典礼，但新政府却安排活动在 Facebook 上直播，让世界各地的菲律宾人在迎接他们的新强人时，能够获得就职典礼前后活动的内部视角。


    尽管 Facebook 此后增加了对杜特尔特批评者进行即时代码攻击的某些操作的难度，但在杜特尔特的统治下，对独立记者的攻击仍在继续。2018 年 11 月，菲律宾政府宣布打算指控雷萨的媒体机构
    Rappler 逃税。Rappler 将这一指控定性为“恐吓和骚扰”。^(²⁰⁵)


    这个问题似乎不会很快消失。

    '
- fmt: '# Consolidating Power in Myanmar


    The Duterte administration is not the only government to use `Facebook` as a weapon
    against their own people. Recent investigations have also uncovered a large-scale
    information operation being conducted by the Myanmar military against the minority
    Rohingya people of Myanmar.


    Violence and oppression are nothing new in Myanmar. Myanmar is a young quasi-democracy.
    It has long been ruled by dictators and autocrats, and neither government oppression
    nor untrustworthy state-controlled media are strangers in that country. There
    is also a long history of violence between the Buddhist majority and the Rohingya
    people, a Muslim minority population that lost their rights to citizenship almost
    overnight in 1982.^([^(206)](#fn206))


    For years, the Rohingya have been on the receiving end of legal discrimination
    from their government and violence from their compatriots who do not share their
    religious or ethnic identity. In addition to perpetuating religious discrimination
    in education, work, and legal standing, Myanmar’s Buddhist population, often led
    by their monks, have routinely held rallies where they spew hate speech at the
    Rohingya. Not infrequently these rallies have even resulted in the death of some
    Rohingya people.


    Both the scale of the violence and the specificity with which the Rohingya are
    targeted led global watchdog agencies to characterize the anti-Rohingya violence
    as an act of (attempted) genocide.^([^(207)](#fn207))


    Myanmar also has a “rich history” of propaganda. Timothy McLaughlin of *Wired*
    magazine writes that “Myanmar had spent decades reliant on state-run propaganda
    newspapers.”^([^(208)](#fn208)) For just about the entire history of mass media
    technology—newspapers, radio, television, the internet—Myanmar’s government has
    controlled the primary channels of media distribution. And so for those living
    in Myanmar today, they have known two main sources of information throughout the
    bulk of their lives: state-controlled media in a dictatorship and local rumors
    or gossip. According to former U.S. ambassador to Myanmar, Derek Mitchell, “Myanmar
    is a country run by rumors,”^([^(209)](#fn209)) and this assessment is shared
    by a Human Rights Impact Assessment commissioned by `Facebook`, which characterized
    Myanmar as a “rumor-filled society” up to around 2013.^([^(210)](#fn210))


    All of this was happening well before smartphones, `Facebook`, or the world-wide
    web entered the scene. Nevertheless, the arrival of digital technology threw fuel
    onto the fires already burning in Myanmar.


    Two key things have changed in Myanmar in the last ten years: the arrival of the
    internet (which for most in Myanmar basically means `Facebook`) and the advent
    of (some aspects of) representative democracy.


    While the military junta that had previously governed Myanmar was dissolved in
    2011, it is generally understood that the first truly open elections in Myanmar
    took place in 2015.^([^(211)](#fn211)) A number of people in Myanmar already had
    access to the internet in 2015, but it was after this point when the government’s
    censorship of the press and control over online speech began to diminish significantly,
    though not completely. As a result of digital technology expanding at the same
    time that long-standing limits on free speech were diminishing, the general populace
    of Myanmar exhibited a general lack of media and digital literacies necessary
    to navigate such an open information environment as the internet. And since “for
    the majority of Myanmar’s 20 million internet-connected citizens, `Facebook` is
    the internet,”^([^(212)](#fn212)) this lack of media literacy was felt most poignantly
    on `Facebook`’s platform.


    The negative results were first seen in the general relationship between Buddhists
    and Muslims in Myanmar. The long-standing animosity between these groups was exacerbated
    by the newfound freedom of expression and access to a platform with significant
    reach. And with some aspects of anti-Rohingya discrimination baked into the law,
    the oppression of Muslims at the hands of the Buddhist majority was particularly
    facilitated by increased digital connectivity. As a report from the Brookings
    Institution wrote, “the sudden rollback of authoritarian controls and press censorship—along
    with the rapid expansion of internet and mobile phone penetration—opened the floodgates
    to a deluge of online hate speech and xenophobic nationalism directed at the Rohingya.”^([^(213)](#fn213))


    The hate speech and the physical violence it spawned were not unknown problems,
    even in the early days. The first wave of social media–enhanced violence came
    in 2014. McLaughlin writes that “the riots wouldn’t have happened without `Facebook`.”^([^(214)](#fn214))
    Much like the Arab Spring uprisings that brought down governments, the increased
    connectivity in Myanmar pushed tensions over a critical threshold, making the
    large-scale riots of 2014 possible. McLaughlin also writes that `Facebook` “had
    at least two direct warnings” of rising hate speech potentially leading to violence
    before those 2014 riots, but because the company saw Myanmar as a “connectivity
    opportunity,” they dismissed the rising hate speech on their platforms and the
    notion that it could incite violence in “real life.” That said, in 2013, the group
    Human Rights Watch *also* dismissed the idea that rising hate speech on `Facebook`
    was a significant problem. For most people, the primary human rights issue was
    one of increasing access to digital technology, as well as the social, educational,
    economic, and political benefits that such access would surely bring.


    Of course, that’s not what happened. Myanmar’s citizens, so used to a combination
    of state-run propaganda and local rumor mills, did not immediately use social
    media to supplant state-run propaganda outlets with balanced and nuanced journalism.
    Rather, they largely transferred their participatory roles from the information
    economy they knew into this new platform—in other words, they made `Facebook`
    into a large-scale version of the local rumor mills to which they were accustomed
    to contributing. In a country plagued by such deep-seated social, political, and
    religious tension, it is no surprise—at least in hindsight—that the result was
    an increase in disinformation, misinformation, and hate speech that contributed
    to offline physical harm as well.


    This dearth of digital literacy, propensity toward spreading and believing rumor,
    and deep-seated ethnic tension served as the backdrop for the psychological warfare
    that the Myanmar military would use against its own people.


    The rumors and the hate speech that encouraged violence against the Rohingya didn’t
    just come from Buddhist citizens, many of them came from the Myanmar military.
    As Paul Mozur reported for *The New York Times*, there was a “systematic campaign
    on `Facebook` that stretched back half a decade” in which “Myanmar military personnel
    … turned the social network into a tool for ethnic cleansing.”^([^(215)](#fn215))
    Hundreds of military personnel created fake accounts on `Facebook` and used them
    to surveil citizens, spread disinformation, silence critics of the government,
    stoke arguments between rival groups, and post “incendiary comments” about the
    Rohingya.'
  raw: '## Consolidating Power in Myanmar


    The Duterte administration is not the only government to use Facebook as a weapon
    against their own people. Recent investigations have also uncovered a large-scale
    information operation being conducted by the Myanmar military against the minority
    Rohingya people of Myanmar.


    Violence and oppression are nothing new in Myanmar. Myanmar is a young quasi-democracy.
    It has long been ruled by dictators and autocrats, and neither government oppression
    nor untrustworthy state-controlled media are strangers in that country. There
    is also a long history of violence between the Buddhist majority and the Rohingya
    people, a Muslim minority population that lost their rights to citizenship almost
    overnight in 1982.^([^(206)](#fn206))


    For years, the Rohingya have been on the receiving end of legal discrimination
    from their government and violence from their compatriots who do not share their
    religious or ethnic identity. In addition to perpetuating religious discrimination
    in education, work, and legal standing, Myanmar’s Buddhist population, often led
    by their monks, have routinely held rallies where they spew hate speech at the
    Rohingya. Not infrequently these rallies have even resulted in the death of some
    Rohingya people.


    Both the scale of the violence and the specificity with which the Rohingya are
    targeted led global watchdog agencies to characterize the anti-Rohingya violence
    as an act of (attempted) genocide.^([^(207)](#fn207))


    Myanmar also has a “rich history” of propaganda. Timothy McLaughlin of *Wired*
    magazine writes that “Myanmar had spent decades reliant on state-run propaganda
    newspapers.”^([^(208)](#fn208)) For just about the entire history of mass media
    technology—newspapers, radio, television, the internet—Myanmar’s government has
    controlled the primary channels of media distribution. And so for those living
    in Myanmar today, they have known two main sources of information throughout the
    bulk of their lives: state-controlled media in a dictatorship and local rumors
    or gossip. According to former U.S. ambassador to Myanmar, Derek Mitchell, “Myanmar
    is a country run by rumors,”^([^(209)](#fn209)) and this assessment is shared
