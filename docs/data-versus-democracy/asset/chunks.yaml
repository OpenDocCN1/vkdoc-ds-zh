- fmt: '### Antisocial Media: When Domestic Psychological Abuse Tactics Scale Up


    The discussion didn’t just stop at discussion. Things quickly turned violent.
    When Gjoni’s post went live, Quinn recounts receiving a message from a friend,
    “you just got helldumped something fierce.”^([^(104)](#fn104)) Shortly thereafter,
    old text messages, intimate photos, and flat-out fabrications were all over the
    darker corners of the internet. She was doxxed—her personal information, or private
    “docs,” were published online—and complete strangers were calling her at all hours
    of the day and night. Family members were doxxed, and compromising, intimate,
    and/or threatening media were sent to her family, including via the mail. Accounts
    she forgot she had were hacked. And while this kind of thing has happened to people—especially
    women—before,^([^(105)](#fn105)) this time it just wasn’t stopping. Months later,
    in January 2015, Quinn wrote a blog post about the ongoing attacks entitled “August
    Never Ends.”^([^(106)](#fn106)) And in the introduction to her 2017 book, *Crash
    Override*, Quinn wrote, “Most relationships end in a breakup. Sometimes that breakup
    is so crazy that it becomes a horror story you tell your friends, family, and
    therapist. … My breakup required the intervention of the United Nations.”^([^(107)](#fn107))


    In retrospect, and even as it was unfolding, it was clear that this was bigger
    than *Depression Quest* or Zoë Quinn. *GamerGate*, as Adam Baldwin dubbed it,
    was an outburst aimed at Quinn—and game developer Brianna Wu and feminist game
    critic Anita Sarkeesian^([^(108)](#fn108)) and pretty much anyone who spoke up
    publicly on their behalf—but it had been festering for some time. It’s no coincidence
    that GamerGate rose at the same time that the indie gaming industry was really
    taking off—a time when the stereotypical game and gamer were being “pushed out”
    by an increasingly diverse market of games developed with an increasingly diverse
    group of gamers in mind.^([^(109)](#fn109))


    As fascinating—and truly gut-wrenching—as the sociology of GamerGate is, it’s
    the tactics and the follow-up that are important for a book like this. Several
    key tactical trends emerged during GamerGate and continued on into subsequent
    campaigns, threatening public discourse in the United States and elsewhere, and
    even the integrity of our elections.


    Just as the Ferguson activists organized online, GamerGaters organized online.
    But there was a key difference. They weren’t using a popular platform like Twitter
    to organize and recruit for an event that was primarily taking place on the streets.
    Instead, they used less well-known platforms like `4chan`, `8chan`, and the seedier
    subreddits to organize and recruit for operations that took place on more public
    social media, like Twitter. In other words, Twitter wasn’t the organizing platform,
    it was the theater of battle. It was where they fired up their sockpuppets and
    bots to spread doxxes and lies about their targets, propaganda about their mission,
    and attacks directed specifically at their targets.


    The use of automated accounts, or bots, to spread disinformation was also a distinctive
    hallmark of GamerGate. I remember the first time I tweeted about GamerGate, using
    the term itself. I almost immediately received several replies from accounts with
    no credible personally identifiable information. One was a post containing the
    farcical GamerGate catch phrase, “actually, GamerGate is about ethics in gaming
    journalism.” Another was a link to a YouTube video critiquing the ethics of Kotaku.
    None were at all a response to the content of my tweet, rather they were clearly
    a scare tactic meant to intimidate any outsiders to the movement who dare speak
    up about it.


    These bots would respond to a variety of kinds of tweets. Several times, including
    once as late as 2017, if I posted a tweet containing the word “doxxed,” a bot
    with an oil painting of an orthodox Jewish man as a profile picture and an anti-Semitic
    slur as a profile name would immediately reply to tell me that “doxxed” was a
    misspelling of “doxed.” (The past tense of `dox` is acceptable both with one or
    two Xs, and I happen to prefer two.) This automated intimidation was a technologically
    cheap but socially powerful way to silence some voices and exert disproportionate
    control over the public discourse around the movement.


    ### Unprepared: How Platforms, Police, and the Courts (Failed to) Respond


    Despite the lies, the targeted harassment, and the physical threats of violence,
    it was difficult for the victims of GamerGate to receive help, both from platforms
    and from law enforcement. Law enforcement didn’t know what to do with Quinn’s
    police reports.^([^(110)](#fn110)) Brianna Wu unsuccessfully called for the federal
    government to investigate and prosecute the owner of `8chan`.^([^(111)](#fn111))
    Citing “free speech,” Twitter was exceedingly hesitant to shut down accounts.
    And a judge in a criminal harassment case (the accused was acquitted) suggested
    that if Quinn wanted to avoid harassment, perhaps she should stay off the internet.
    When she reminded him that her work as an independent game developer required
    not only an online presence, but a public social media presence, he responded,
    “You’re a smart kid. … Find a different career.”^([^(112)](#fn112))


    While the attacks have never completely stopped, Quinn, Sarkeesian, and Wu have
    braved the fight and emerged as strong voices for change both in the gaming industry
    and at the social media platforms. Quinn and Sarkeesian spoke to the United Nations
    about online abuse and harassment.^([^(113)](#fn113)) Quinn founded a company
    called the Crash Override Network that helps individuals targeted by coordinated
    online abuse work with the platforms to shut down those who break the law and
    the Terms of Service in the course of their attacks.^([^(114)](#fn114)) Wu even
    ran for U.S. Congress.^([^(115)](#fn115)) And all three of them continue to work
    in gaming, despite GamerGate’s efforts to push them—and many other women, people
    of color, and members of the LGBTQ community—out.


    But in addition to the public awareness that Quinn, Sarkeesian, Wu, and others
    have brought to the social problems at the root of GamerGate—and the ways that
    platforms like `4chan`, `8chan`, Reddit, and Twitter have enabled their campaigns—other
    key figures and movements emerged during GamerGate. GamerGaters themselves also
    discovered their power.


    GamerGaters weren’t just jerks on the internet. They were a group of tech-fluent
    individuals, many of whom had spent significant portions of their lives online,
    particularly on image boards like `4chan`. The affordances and limitations of
    those forums, and the community practices that emerged in light of those platform
    structures, facilitated certain tactical strengths within the GamerGate community
    that they used beyond GamerGate itself. For instance, `4chan` is a platform where
    threads of content are deleted relatively quickly. Similarly, Reddit’s system
    of upvotes and downvotes, coupled with its highlighting of high-engagement content
    on the front page of the site, motivates and rewards the creation of viral content.
    `4chan` veterans, in particular, often have a keen sense of what will go viral,
    or at the very least, evidence of what did and didn’t go viral on their platform.
    This awareness of patterns of virality, often combined with an obsession over
    detail—what some `4chan` users reprehensibly call “weaponized autism”^([^(116)](#fn116))—and
    skills in Twitter automation, gives them an advantage when it comes to creating
    and spreading memes and other potentially viral content.'
