  trans: '

    # 供给与需求：为何信息经济已难以为继


    我听到你们中有人问："所有这些与大数据、''假新闻''和宣传有什么关系？"


    一切皆有关系。


    我们祖先对食物的味觉是在食物*匮乏*的时代形成的。那些必不可少但稀缺的食材，成了最受偏爱和追捧的味道。然而，在*丰裕*的时代，这些偏好不再适用，尤其是当那些少量摄入必不可少、但过量摄入却有害的成分变得唾手可得时。我们对食物的天然本能，在相对丰裕的时代已变得危险。


    我们消费信息的方式也是如此。我们处理信息的方式基于一段进化史——以及一种教育经历——在这段历史中，信息是*稀缺*的，或者至少是*昂贵*的。我们大部分控制感官与大脑连接的认知系统，早在智人出现之前就已进化成型。^(¹³)
    我们遗传密码的主体，早在文字发明之前就已相当固定，更不用说印刷术、大众传媒、广播、电视或算法新闻推送了。^(¹⁴) 我们判断现实、辨别安全与危险的本能，并不适应我们生活的媒体环境。我们如此适应信息匮乏的状态，以至于消费现代媒体就像试图对着消防水带喝水。


    除此之外，我们大多数人接受的教育是在一个没有互联网的时代设计并为之服务的。那些能帮助一个没有电脑的家庭——甚至是在公共图书馆——判断所读信息真实性的工具和技巧，并未针对互联网生活进行优化。事实很简单：*我们大多数人不知道如何在互联网上核实事实*。我们不知道怎么做，也不知道如何*让自己*去做。当这种情况发生在一个社交媒体平台上——我们可以用手指轻点就能分享读到的任何内容——我们便加剧了问题，因为我们不加批判地*消费*媒体，导致我们不加批判地*发布*媒体。每次我们阅读时没有充分启用我们的"垃圾检测器"，我们就不经意地传播了更多"垃圾"。那么，我们的社交媒体"信息流"就不仅仅变成了消防水带，而是一条充满污水的消防水带。寻找有益身心的内容变得越发困难。


    这种转变不仅仅是进化或教育的问题。这也是关于经济的问题。我们都了解工业革命，当时——至少在西方——封建的、以农业为基础的经济（以及随之而来的社会秩序）让位于以市场为基础的工业经济。土地、血统或神权的统治让位于金钱和劳动的统治。贵族被商人取代。农场被工厂（以及后来的工厂化农场）取代。一种全新的社会秩序出现了。正如经济学家迈克尔·H·戈德哈伯所写：


    * 当时的欧洲在 15 世纪仍大致沿封建路线统治，封建领主们想当然地认为，新世界将成为更大规模封建经济的空间，由公爵、伯爵、男爵和侯爵统治新发现大陆上的农奴。他们确实开始建立这个体系，但这并非最终在新空间中繁荣起来的东西。相反，刚刚起步的资本主义、市场导向的工业经济发现新大陆的土壤更为适宜。它在北美变得如此强大，以至于当它跨洋回流时，最终完成了在西欧以及随后在世界其他地区的主导地位。^(¹⁵)


    换句话说，民主革命之所以在北美欧洲移民中爆发，然后才点燃欧洲本土，是有原因的。缺乏根深蒂固的贵族制度，以及对贸易和物质商品（由奴隶带回欧洲）的重视，使新大陆成为了一种不同的经济空间——在这里，物质商品的采矿与生产、运输能力，以及将其转化为*资本*的能力赋予了人们权力。这种以市场为基础的资本主义，以及任何人通过劳动和智慧在社会上改善自身地位的理念，构成了这个新共和国的基础（尽管有时更多是理论上而非实践上）。最终，它确实到达了欧洲，因为封建主义在许多地方逐渐让位于市场资本主义。


    但这并非人类面临的唯一一次社会经济转型。封建主义不是第一个社会制度，资本主义也不是最后一个。（它甚至不是当今存在的唯一制度！）而且资本主义本身有多种形式。一些人指出，从基于商品和服务的经济到*信息*经济是重要的经济转型。这并非意味着西方资本主义消失了，而是曾经适用于材料（商品）和劳动（服务）的供需法则，现在适用于信息（数据）。


    这样想吧。当某样东西稀缺但又令人向往时，我们称之为"珍贵"。黄金、白银、肥沃的土壤、脂肪、碳水化合物、蛋白质等。在市场经济中，如果需求高而供应低，人们会竞相交易，在资本主义经济中，他们用金钱交易。其价格上升，反映了社会赋予它的价值。如果供应高而需求低，价格下降，反映了社会赋予它的相对较低的价值。


    在工业经济中，维持运转的供需方程涉及材料和劳动力——你能得到什么，你能用它制造什么，你能把它运到哪里？控制原材料和劳动力的人说了算。但是，当我们非常擅长制造东西，以至于供应压倒了需求，*即使是对我们最需要的东西*，比如食物、衣服或住房，会发生什么？这就是许多发达国家发生的情况，因为机械化和自动化使生产效率极高，推动供应飙升，同时大幅减少了对人类劳动力的需求——进而降低了其货币价值。当这两件事发生时，没人有钱花，而当他们花钱时，东西又太便宜，以至于没人*能*赚钱。经济便停滞不前。


    但是，正如保罗·梅森在他的著作《后资本主义：我们未来的指南》^(¹⁶)中所指出的，资本主义相当有韧性。当一个经济领域的供需方程自我崩溃时，另一个领域往往会取而代之。在过去几十年里，随着生产成本（以及随之而来的劳动工资）在富裕的西方普遍下降，*信息*应运而生，取而代之。换句话说，现在说了算的不再是控制材料和劳动力的人，而是管理*信息*的人，他们对经济——以及社会秩序——拥有最强的掌控力。


    然而，在我们进入一个新的、可能持续数世纪的信息资本主义时代之前，另一件事发生了。摩尔定律发生了。以工程师兼英特尔联合创始人戈登·摩尔命名的摩尔定律指出，半导体电路中给定空间内可容纳的晶体管数量大约每两年翻一番。^(¹⁷)
    在经济由信息供需主导的时代，这种处理信息能力的指数级增长是一个问题。再加上*存储*信息成本同样迅速下降，以及*复制*信息过程变得极其简单，信息经济在有机会独立发展之前，就已经被宣判了死刑。

    '
- fmt: '# 排版后的内容


    早在1984年的第一次黑客大会上，斯图尔特·布兰德（Stewart Brand）就曾有名言：


    *   一方面，信息希望变得昂贵，因为它非常有价值。在正确的地方获得正确的信息可以改变你的人生。另一方面，信息希望变得免费，因为传播信息的成本正在变得越来越低。所以，你看到了这两者之间的斗争。^([^(18)](#fn18))


    暂且不论“信息希望免费”这句话已成为一个有问题的口号，这种二元性（科利·多克托罗称之为“一个相当不错的禅宗公案”^([^(19)](#fn19))）正是将经济建立在信息基础上的根本问题。我们无法做到这一点。这就是为什么许多出版商和新闻媒体公司难以从印刷和广播转向数字化的原因。这也是为什么我们会有付费墙、广告拦截器和广告拦截器拦截器。你无法建立一个基于廉价生产、廉价复制并且——既然我们有了互联网——廉价获取的商品的市场经济。一些经济学家，如前文提到的保罗·梅森，认为这意味着资本主义本身已经死亡，信息时代将迎来一个准社会主义的*后资本主义*新时代。也许他们是对的。


    或者，也许还存在另一种商品，而坚韧的资本主义仍有挣扎的余地。


    当戈德哈伯描述从封建主义到资本主义的转变时，他并没有止步于此。他实际上是在论述一种新经济的出现。不仅如此，还是一种新的*类型*的经济。


    *   当代的经济思想源于那种以市场为基础的工业主义，这与之前的以封建自给农业为基础的经济截然不同。我们倾向于认为，正如我们所受的教育那样，经济法则是永恒不变的。这显然是错误的。这些法则只适用于特定的时期和特定的空间类型。封建主义的典型景观，点缀着小块田地、围墙村落和城堡，与工业化的城市、烟囱工厂、铁路、运河或高速公路景观截然不同。网络空间的“景观”也许只存在于我们的脑海中，但即便如此，它也是我们越来越多地生活的地方，而且它的面貌与前两者都截然不同。如果网络空间发展到涵盖地球上数十亿人之间的互动，那么这些互动类型将完全不同于过去几个世纪或更久以前盛行的模式。


    *   如果你想在这个新世界里茁壮成长，你就不能误以为今天的公爵和伯爵们会自然继续繁荣下去，而是要学会用该经济形态固有的方式来思考。^([^(20)](#fn20))


    这些术语是什么？戈德哈伯在1997年，即万维网发明仅仅几年后（如果我没记错的话，也是我收到第一个`Juno`电子邮件账户的那一年）写作时，将这种新经济称为*注意力经济*。（戈德哈伯并非第一个使用这个术语的人，但他是最早详细讨论万维网的出现可能对我们后工业社会的社会经济结构意味着什么的人之一）。在注意力经济中，支配经济增长的供需方程不再涉及信息的供给与需求，而是*人类注意力的供给与需求*。正如马修·克劳福德所说，“注意力是一种资源——一个人只有这么多。”^([^(21)](#fn21))
    并且，随着信息变得越来越便宜、越来越容易创建、获取、分发和复制，注意力变得越来越稀缺，至少从那些从事信息行业的人的角度来看是如此。


    正如戈德哈伯所描述的，这不仅仅是可销售材料从一种类型向另一种类型的简单转变。这是一个完全不同的系统。在金钱流动方向与商品和服务*相反*（一种现代形式的贸易）的地方，金钱与注意力的流动方向*相同*。是的，我们仍然在购买东西（是的，内容生产者仍然购买广告，这有点像购买注意力），但我们越来越多地不是为了购买我们想要或需要的东西。我们是为了获得娱乐，而争夺我们注意力的赢家将得到我们的金钱。这意味着不同种类的交易、不同种类的销售和营销策略，以及这些交易发生的不同种类的市场。（用工业术语来说：`Facebook`是一家媒体公司、一个社交俱乐部、一个公共集会空间，还是一家广告代理商？）


    ## 如果你不为产品付费，你就是产品：注意力作为商品，参与度作为货币


    当谈到虚假信息和宣传时，这种经济转型有几个方面是至关重要的。首先，焦点——或者说瓶颈——是我们的注意力。我们认知系统的局限性是保持供需方程平衡的经济基石。如果我们要成为批判性的消费者，我们至少需要理解这一点。我们的注意力是在线、电视以及任何媒体形式中交易的主要“商品”。在很多方面，我们在这些交易中扮演着*更*核心的经济角色，即使我们的金钱没有参与其中。我们的注意力是商品，我们的“参与度”是货币——而且，巧合的是，*这就是追踪我们在线活动对于从事信息行业的公司如此重要的原因*。只要注意力经济存在，像`Cambridge
    Analytica`这样的公司就会存在——这些公司利用关于客户、竞争对手甚至选民的数据，向他们提供定制广告，其明确目的是影响甚至操纵他们的行为。^([^(22)](#fn22))


    其次，因为我们的注意力是新经济的主要商品，我们日常使用的数字平台*旨在操纵和衡量我们的注意力*。正如前谷歌员工兼技术评论家特里斯坦·哈里斯所说，“一小部分人，在少数几家科技公司工作，通过他们的选择，将会引导今天十亿人的想法。”^([^(23)](#fn23))
    或者用一种可能不那么反乌托邦的语气来说，我们最常使用的技术，就是那些被设计得如此出色以至于让我们不断回头的技术。但是，就像食物、酒精、性、开车、运动一样，即使是好的东西，如果漫不经心或过度使用，也会变得危险。


    但无可否认的事实是，当平台通过广告赚钱时，更多的人在这些平台上花费更多的时间，它们就能赚更多的钱。然而，事情是这样的。虽然当你看到广告时（称为*展示*），它们能赚*一些*钱，但当你*点击*广告时，它们能赚多得多的钱。^([^(24)](#fn24))
    但那次点击会让你离开平台，再也看不到另一个广告。除非这个平台如此之好，如此令人向往，如此值得你关注，以至于在你短暂访问网络其他地方后，你会很快回来。


    换句话说，注意力经济使得将平台设计成令人上瘾的模式成为一项有利可图的生意。^([^(25)](#fn25)) 这对个人和社会来说都非常危险。当这些平台日益成为许多人获取新闻的渠道，也成为我们在最放松、最被动时经常使用的平台时，上瘾就成了我们许多人处理当今最重要议题的方式。哈里斯说，“我认为没有比这更紧迫的问题了……它正在改变我们的民主。”^([^(26)](#fn26))


    或者换一种说法，这次带有更强烈的反乌托邦色彩：我们的社交媒体平台是为宣传而设计的。'
  raw: 'All the way back in 1984 at the first Hackers Conference, Stewart Brand famously
    said:


    *   On the one hand, information wants to be expensive, because it’s so valuable.
    The right information in the right place just changes your life. On the other
    hand, information wants to be free, because the cost of getting it out is getting
    lower and lower all the time. So you have these two fighting against each other.^([^(18)](#fn18))


    Setting aside the problematic mantra that “information wants to be free” has become,
    this duality (which Cory Doctorow calls “quite a good Zen koan”^([^(19)](#fn19)))
    is the fundamental problem of basing an economy on information. We can’t. This
    is why so many publishers and news media companies have struggled to move from
    print and broadcast to digital. This is why we have paywalls, ad blockers, ad
    blocker blockers. You can’t have a market capitalism that’s based around a commodity
    that is cheap to produce, cheap to copy, and—now that we have the internet—cheap
    to access. Some economic voices, like the aforementioned Paul Mason, suggest that
    this means capitalism itself is dead, and that the information age will usher
    in a new, quasi-socialist era of *postcapitalism*. And maybe they’re right.


    Or maybe there’s another commodity, and the resilient capitalism still has a little
    fight left in it.


    When Goldhaber described the transition from feudalism to capitalism, he didn’t
    stop there. He was actually writing about the emergence of a new economy. And
    not just that, but a new *kind* of economy.


    *   Contemporary economic ideas stem from that selfsame market-based industrialism,
    which was thoroughly different from the feudal, subsistence-farming-based economy
    that preceded it. We tend to think, as we are taught, that economic laws are timeless.
    That is plain wrong. Those laws hold true in particular periods and in a particular
    kind of space. The characteristic landscape of feudalism, dotted with small fields,
    walled villages, and castles, differs markedly from the industrial landscape of
    cities, smokestack factories and railroads, canals, or superhighways. The "landscape"
    of cyberspace exists only in our minds, perhaps, but even so it is where we are
    increasingly coming to live, and it looks nothing like either of those others.
    If cyberspace grows to encompass interactions between the billions of people now
    on the planet, those kinds of interaction will be utterly different from what
    prevailed for the last few centuries, or ever before.


    *   If you want to thrive in this new world, it behooves you not to mistake it
    for a place where the dukes and earls of today will naturally continue to prosper,
    but rather to learn to think in terms of the economy natural to it.^([^(20)](#fn20))


    What are these terms? Goldhaber, writing in 1997, just a few short years after
    the invention of the world-wide web (and, if I’m not mistaken, the year I received
    my first Juno email account), calls this new economy the *attention economy* .
    (Goldhaber wasn’t the first to use the term, but he was one of the first to discuss
    in some detail what the advent of the web might mean for the socioeconomic structures
    of our post-industrial society.) In an attention economy, the supply-and-demand
    equation that governs economic growth does not concern the supply and demand of
    information, but the *supply and demand of human attention*. As Matthew Crawford
    says, “Attention is a resource—a person has only so much of it.”^([^(21)](#fn21))
    And as information becomes cheaper and easier to create, access, distribute, and
    copy, attention becomes increasingly scarce, at least from the perspective of
    those who deal in information.


    As Goldhaber describes it, this isn’t a mere shift from one kind of material for
    sale to another. It’s a totally different kind of system. Where money moves in
    the *opposite* direction as goods and services (a modern version of trade), money
    moves in the *same* direction as attention. Yes, we’re still buying things (and
    yes, content producers still buy advertising, which is kind of like buying attention),
    but increasingly we don’t set out to buy what we want or need. We set out to be
    entertained, and the winners of the battle for our attention are the ones that
    receive our money. This means different kinds of transactions, different kinds
    of sales and marketing strategies, and different kinds of markets in which these
    transactions take place. (In industrial terms: is Facebook a media company, a
    social club, a public gathering space, or an advertising agency?)


    ## If You Don’t Pay for the Product, You Are the Product: Attention as Commodity,
    Engagement as Currency


    When it comes to disinformation and propaganda, there are a couple aspects of
    this economic transition that are critical to understand. First of all, the focus—the
    choke point, if you will—is our attention. The limits of our cognitive system
    are the bedrock of the economy that keeps the supply-and-demand equation in balance.
    If we are to be critical consumers, we have to get our heads around that, at least
    a little bit. Our attention is the primary “good” being traded online, on TV,
    in any form of media. In many ways, we play a *more* central economic role in
    these transactions, even if our money isn’t involved. Our attention is the commodity,
    our “engagement” the currency—and, coincidentally, *this is why tracking our activity
    online is so important to companies that deal in information*. As long as the
    attention economy exists, Cambridge Analyticas will exist—companies that leverage
    data about customers, competitors, and even voters to provide tailored advertising
    to them with the express purpose of influencing, even manipulating, their behavior.^([^(22)](#fn22))


    Second, because our attention is the chief commodity of the new economy, the digital
    platforms that we use daily *are designed to manipulate and measure our attention*.
    As former Google employee and tech critic, Tristan Harris, put it, “A handful
    of people, working at a handful of technology companies, through their choices
    will steer what a billion people are thinking today.”^([^(23)](#fn23)) Or put
    in perhaps a less dystopian tone, the tech that we use most is the tech designed
    to be so good that we keep coming back. But like food, alcohol, sex, driving a
    car, playing a sport, even good things can become dangerous when engaged carelessly
    or in excess.


    But there’s no escaping the fact that when platforms make their money off of advertising,
    they make more money when more people spend more time on those platforms. Here’s
    the thing, though. While they make *some* money when you see an ad (called an
    *impression*), they make far more money when you *click* on the ad.^([^(24)](#fn24))
    But that click takes you away from the platform, never to see another ad. Unless
    the platform is so good, so desirable, so worthy of your attention, that you come
    back soon after that trip elsewhere on the web.


    In other words, the attention economy makes it good business sense to design platforms
    for addiction.^([^(25)](#fn25)) That’s incredibly dangerous, both for individuals
    and for society. And when those platforms are increasingly the source of news
    for many individuals, as well as platforms often engaged when we are at our most
    relaxed, passive addiction becomes the way that many of us deal with the most
    important issues of the day. Harris says, “I don’t know a more urgent problem
    than this. … It’s changing our democracy.”^([^(26)](#fn26))


    Or put another way, this time with a more dystopian slant, our social media platforms
    are designed for propaganda.'
