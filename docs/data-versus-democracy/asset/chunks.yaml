    # 7. 结论


    我们该何去何从？


    信息过剩、人类认知的局限性、过度的数据挖掘以及算法化的内容推送，这些因素共同使我们极易受到宣传和信息造假的影响。这个问题是庞大的，跨平台、跨社群的，解决方案也同样如此。但我们可以采取一些措施——无论是作为个人还是社会——来遏制信息造假问题，保护我们的思想和社群免受认知黑客的攻击。

    '
- fmt: '## The Propaganda Problem


    Over the course of this book, we’ve explored a number of problems that leave us
    vulnerable to disinformation, propaganda, and cognitive hacking.


    Some of these are based in human psychology. `Confirmation bias` predisposes us
    to believe claims that are consistent with what we already believe and closes
    our mind to claims that challenge our existing worldview. `Attentional blink`
    makes it difficult for us to keep our critical faculties active when encountering
    information in a fast-paced, constantly changing media environment. `Priming`
    makes us vulnerable to mere repetition, especially when we’re not conscious of
    that repetition, as repeated exposure to an idea makes it easier for our minds
    to process, and thus believe, that idea. All of these traits, developed over aeons
    of evolutionary history, make it easy for us to form biases and stereotypes that
    get reinforced, even amplified, over time, without any help from digital technology.


    Some of the problems are technical. The excessive mining of personal data, combined
    with `collaborative filtering`, enables platforms to hyper-target users with media
    that encourages online “engagement,” but also reinforces the biases that led to
    that targeting. Targeted advertising puts troves of that user data *functionally*—if
    not *actually*—at the fingertips of those who would use it to target audiences
    for financial or political gain.


    Some of the problems are social. The rapidly increasing access to information
    and people that digital technology affords breaks us out of our `pluralistic ignorance`,
    but we often aren’t ready to deal with the social implications of information
    traveling through and between communities based primarily on what sociologists
    call `weak ties`.


    When information abundance, human psychology, data-driven user profiling, and
    algorithmic content recommendation combine, the result—unchecked—can be disastrous
    for communities. And that appears to be even more the case in communities for
    whom democracy and (relatively) free speech are also new concepts.


    Disinformation is fundamentally a *human* problem. Yes, technology plays its part,
    and as argued earlier in this book, new technology is neither inherently bad nor
    inherently good *nor inherently neutral*. Each new technology has its own affordances
    and limitations that, like the human mind, make certain vulnerabilities starker
    than others. But ultimately, there is no purely technical solution to the problem.
    Disinformation is a behavior, perpetrated by people, against people, in accordance
    with the fundamental traits (and limitations) of human cognition and human community.
    The solution necessarily will be human as well.


    Of course, that doesn’t mean that the solution will be simple. Technology changes
    far more rapidly than human biology evolves, and individuals are *adopting* new
    technologies faster than communities are *adapting* to them. Lawmakers and regulators
    are probably the furthest behind, as many of the laws that govern technology today—in
    the United States, at least—were written before the advent of the internet.^([^(223)](#fn223))
    Perhaps most striking, though, is the surprise that many of the inventors of these
    technologies experience when they witness the nefarious ways in which their inventions
    are put to use. If the inventors, whose imagination spawned these tools, can’t
    envision all of the negative ends to which these technologies can be directed,
    what chance do users, communities, and lawmakers have?!


    The solutions may not be simple, and we may not be able to anticipate and prevent
    all antisocial uses of new technology, but there are certainly things we can do
    to make progress.


    Consider the bias-amplification flow chart from Chapter `3`. It is tuned primarily
    for search engines, but it applies to most platforms that provide users with content
    algorithmically. Each of these elements represents something that bad actors can
    exploit or hack. But they each also represent a locus of resistance for those
    of us seeking to counter disinformation.


    For example, the Myanmar military manipulated existing social stereotypes to encourage
    violence against the Rohingya people and dependence on the military to preserve
    order in the young quasi-democratic state. Using information about those existing
    stereotypes, they created media that would exacerbate those existing biases, encouraging
    and amplifying calls to violence. They not only directly created pro-violence
    media and amplified existing calls to violence, they also affected the content
    database feeding users’ Facebook timelines and created content that encouraged
    user engagement with the pro-violence messages. Thus, the model, which took that
    content and user activity history as inputs, further amplified the biased media
    delivered to users in their feeds. And then the cycle began again.


    Similar cycles of bias amplification have led to increased political polarization
    in the United States, as we explored in Chapters `4` and `5`. Even the perpetrators
    of harassment during GamerGate, many of whom we would likely consider to be radicalized
    already, engaged in a game of trying to outdo each other in engagement, victim
    reaction, or just plain “lulz.” Since content that hits the emotions hardest,
    especially anger, tends to correlate with stronger reactions, it’s not surprising
    that the abhorrence of GamerGate accelerated furiously at times, as GamerGaters
    sought to “win” the game.


    Users can counter this vicious cycle, in part, by being conscious of their own
    personal and community biases and engaging in activity that provides less problematic
    inputs to the model. I *don’t* mean employing “bots for good” or “Google-bombing”
    with positive, inspirational messages. I’m a firm believer that any manipulative
    behavior, even when employed with good intentions, ultimately does more social
    harm than social good. Rather, what I mean is using one’s awareness of existing
    individual and community biases and making conscious choices to resist our “defaults”
    and the biases they represent.


    For example, one of my digital storytelling students was a young woman of color
    who realized that when she chose visual media for her blog posts, she was choosing
    the “default” American image—one that was very white- and male-oriented. So she
    resolved in her future projects to include images that represent her own demographic,
    doing a small part to bring the media landscape more in line with the diversity
    that is actually present in our society. Remember, it’s the defaults—both mental
    and algorithmic—that tend to reinforce existing bias. So by choosing non-defaults
    in our own media creation and consumption, and by being purposeful in the media
    we engage with, we can increase the diversity, accuracy, and even justice of the
    content and user activity that feeds into content recommendation models.'
  raw: '## The Propaganda Problem


    Over the course of this book, we’ve explored a number of problems that leave us
    vulnerable to disinformation, propaganda, and cognitive hacking.


    Some of these are based in human psychology. *Confirmation bias* predisposes us
    to believe claims that are consistent with what we already believe and closes
    our mind to claims that challenge our existing worldview. *Attentional blink*
    makes it difficult for us to keep our critical faculties active when encountering
    information in a fast-paced, constantly changing media environment. *Priming*
    makes us vulnerable to mere repetition, especially when we’re not conscious of
    that repetition, as repeated exposure to an idea makes it easier for our minds
    to process, and thus believe, that idea. All of these traits, developed over aeons
    of evolutionary history, make it easy for us to form biases and stereotypes that
    get reinforced, even amplified, over time, without any help from digital technology.


    Some of the problems are technical. The excessive mining of personal data, combined
    with *collaborative filtering* , enables platforms to hyper-target users with
    media that encourages online “engagement,” but also reinforces the biases that
    led to that targeting. Targeted advertising puts troves of that user data *functionally*—if
    not *actually*—at the fingertips of those who would use it to target audiences
    for financial or political gain.


    Some of the problems are social. The rapidly increasing access to information
    and people that digital technology affords breaks us out of our *pluralistic ignorance*
    , but we often aren’t ready to deal with the social implications of information
    traveling through and between communities based primarily on what sociologists
    call *weak ties* .


    When information abundance, human psychology, data-driven user profiling, and
    algorithmic content recommendation combine, the result—unchecked—can be disastrous
    for communities. And that appears to be even more the case in communities for
    whom democracy and (relatively) free speech are also new concepts.


    Disinformation is fundamentally a *human* problem. Yes, technology plays its part,
    and as argued earlier in this book, new technology is neither inherently bad nor
    inherently good *nor inherently neutral*. Each new technology has its own affordances
    and limitations that, like the human mind, make certain vulnerabilities starker
    than others. But ultimately, there is no purely technical solution to the problem.
    Disinformation is a behavior, perpetrated by people, against people, in accordance
    with the fundamental traits (and limitations) of human cognition and human community.
    The solution necessarily will be human as well.


    Of course, that doesn’t mean that the solution will be simple. Technology changes
    far more rapidly than human biology evolves, and individuals are *adopting* new
    technologies faster than communities are *adapting* to them. Lawmakers and regulators
    are probably the furthest behind, as many of the laws that govern technology today—in
    the United States, at least—were written before the advent of the internet.^([^(223)](#fn223))
    Perhaps most striking, though, is the surprise that many of the inventors of these
    technologies experience when they witness the nefarious ways in which their inventions
    are put to use. If the inventors, whose imagination spawned these tools, can’t
    envision all of the negative ends to which these technologies can be directed,
    what chance do users, communities, and lawmakers have?!


    The solutions may not be simple, and we may not be able to anticipate and prevent
    all antisocial uses of new technology, but there are certainly things we can do
    to make progress.


    Consider the bias-amplification flow chart from Chapter [3](#469027_1_En_3_Chapter.xhtml).
    It is tuned primarily for search engines, but it applies to most platforms that
    provide users with content algorithmically. Each of these elements represents
    something that bad actors can exploit or hack. But they each also represent a
    locus of resistance for those of us seeking to counter disinformation.


    For example, the Myanmar military manipulated existing social stereotypes to encourage
    violence against the Rohingya people and dependence on the military to preserve
    order in the young quasi-democratic state. Using information about those existing
    stereotypes, they created media that would exacerbate those existing biases, encouraging
    and amplifying calls to violence. They not only directly created pro-violence
    media and amplified existing calls to violence, they also affected the content
    database feeding users’ Facebook timelines and created content that encouraged
    user engagement with the pro-violence messages. Thus, the model, which took that
    content and user activity history as inputs, further amplified the biased media
    delivered to users in their feeds. And then the cycle began again.


    Similar cycles of bias amplification have led to increased political polarization
    in the United States, as we explored in Chapters [4](#469027_1_En_4_Chapter.xhtml)
    and [5](#469027_1_En_5_Chapter.xhtml). Even the perpetrators of harassment during
    GamerGate, many of whom we would likely consider to be radicalized already, engaged
    in a game of trying to outdo each other in engagement, victim reaction, or just
    plain “lulz.” Since content that hits the emotions hardest, especially anger,
    tends to correlate with stronger reactions, it’s not surprising that the abhorrence
    of GamerGate accelerated furiously at times, as GamerGaters sought to “win” the
    game.


    Users can counter this vicious cycle, in part, by being conscious of their own
    personal and community biases and engaging in activity that provides less problematic
    inputs to the model. I *don’t* mean employing “bots for good” or “Google-bombing”
    with positive, inspirational messages. I’m a firm believer that any manipulative
    behavior, even when employed with good intentions, ultimately does more social
    harm than social good. Rather, what I mean is using one’s awareness of existing
    individual and community biases and making conscious choices to resist our “defaults”
    and the biases they represent.


    For example, one of my digital storytelling students was a young woman of color
    who realized that when she chose visual media for her blog posts, she was choosing
    the “default” American image—one that was very white- and male-oriented. So she
    resolved in her future projects to include images that represent her own demographic,
    doing a small part to bring the media landscape more in line with the diversity
    that is actually present in our society. Remember, it’s the defaults—both mental
    and algorithmic—that tend to reinforce existing bias. So by choosing non-defaults
    in our own media creation and consumption, and by being purposeful in the media
    we engage with, we can increase the diversity, accuracy, and even justice of the
    content and user activity that feeds into content recommendation models.'
  trans: '

    ## 宣传问题


    在本书中，我们探讨了一系列让我们容易受到虚假信息、宣传和认知黑客攻击的问题。


    其中一些问题源于人类心理。`确认偏误`使我们倾向于相信符合我们已有信念的说法，而对挑战我们现有世界观的言论关闭心扉。`注意瞬盲`使得我们在快节奏、不断变化的媒体环境中遇到信息时，难以保持批判性思考的活跃状态。`启动效应`让我们容易受到单纯的重复影响，尤其是当我们没有意识到这种重复时——因为反复接触某个想法会使大脑更容易处理并进而相信该想法。所有这些在漫长进化史中形成的特质，使得我们即使在没有数字技术助推的情况下，也容易形成并随着时间的推移不断强化甚至放大偏见与刻板印象。


    一些问题是技术层面的。对个人数据的过度挖掘，加上`协同过滤`，使得平台能够向用户超精准投放鼓励在线“互动”的媒体内容，但这同时也强化了导致这种精准投放的偏见。精准广告投放将海量用户数据*功能上*——即使不是*实际上*——置于那些为谋取经济或政治利益而利用这些数据定向影响受众的人手中。


    一些问题是社会层面的。数字技术带来的信息和人际接触的快速增加，打破了我们的`多元无知`状态，但我们往往还没准备好应对信息主要基于社会学家所称的`弱连接`在社群内部及社群之间传播所带来的社会影响。


    当信息过剩、人类心理、数据驱动的用户画像以及算法内容推荐结合在一起时，其结果一旦失去控制，可能对社群造成灾难性后果。而对于那些民主和（相对）言论自由本身还是新概念的社群来说，情况似乎更是如此。


    虚假信息本质上是一个*人*的问题。没错，技术在其中扮演了角色，正如本书前文所论证的，新技术既非天生有害，也非天生有益，*更非天生中立*。每一项新技术都有其特定的可供性与局限性，就像人类心智一样，会使某些脆弱性比其他方面更为突出。但归根结底，这个问题没有纯粹的技术解决方案。虚假信息是一种行为，由人实施，针对他人，遵循人类认知和人类社群的基本特征（与局限性）。解决方案也必然是人性的。


    当然，这并不意味着解决方案会很简单。技术变化的速度远快于人类生物进化的速度，而个人*采用*新技术的速度，也快于社群*适应*新技术的速度。立法者和监管者可能落后得最远——如今美国至少许多监管技术的法律，都是在互联网出现之前制定的。^(²²³)
    但最令人震惊的，或许是这些技术的许多发明者在目睹自己的发明被用于邪恶目的时所表现出的惊讶。如果连这些构思出工具的发明者都无法预见技术可能被导向的所有负面用途，用户、社群和立法者又能有多大机会呢？！


    解决方案可能并不简单，我们或许无法预见并阻止所有反社会性地使用新技术的行为，但我们肯定可以采取一些措施来取得进展。


    回想一下第`3`章的偏见放大流程图。它主要针对搜索引擎进行了优化，但同样适用于大多数通过算法向用户提供内容的平台。这些要素中的每一个都代表着不良行为者可以利用或攻击的环节。但同时，它们也代表了我们这些寻求对抗虚假信息的人的抵抗节点。


    例如，缅甸军方操纵现有的社会刻板印象，煽动针对罗兴亚人的暴力行为，并迫使这个年轻准民主国家的人民依赖军队来维持秩序。他们利用关于这些现有刻板印象的信息，制作了会加剧这些现有偏见的媒体内容，鼓励并放大暴力呼声。他们不仅直接制作了鼓吹暴力的媒体内容并放大了现有的暴力呼声，还影响了向用户
    Facebook 动态推送内容的数据库，并制作了鼓励用户与暴力信息互动的帖子。因此，该模型将这些内容与用户活动历史作为输入，进一步放大了推送到用户信息流中的偏见媒体。然后，这个循环再次开始。


    正如我们在第`4`章和第`5`章中探讨的，类似的偏见放大循环也导致了美国政治极化的加剧。甚至在“玩家门”事件中实施骚扰的肇事者——其中许多人我们可能认为已经激进化了——也参与了一场在互动程度、受害者反应，或者仅仅是“找乐子”方面互相较劲的游戏。由于最能触动情绪（尤其是愤怒）的内容往往与更强烈的反应相关，“玩家门”事件的恶劣程度有时会急剧加速升级，这并不令人意外——因为参与者试图在游戏中“获胜”。


    用户可以在一定程度上对抗这种恶性循环，方法是意识到自己个人和所在社群的偏见，并参与那些能为模型提供较少问题输入的行为。我*不是*指使用“善意机器人”或通过积极励志的信息进行“谷歌炸弹攻击”。我坚信，任何操纵性行为，即使出于良好意图，最终造成的社会危害也大于社会效益。相反，我指的是利用对现有个人和社群偏见的认识，做出有意识的选择，以抵制我们的“默认设置”及其所代表的偏见。


    例如，我的一名数字叙事课程学生是一位有色人种年轻女性，她意识到当为自己的博文选择视觉媒体时，她总是选择“默认的”美国形象——那种非常偏向白人和男性取向的形象。因此，她在未来的项目中决心纳入能够代表自己人口群体的图片，为促使媒体图景更符合我们社会实际存在的多样性尽一份绵力。请记住，正是这些默认设置——无论是心理上的还是算法上的——往往会强化现有的偏见。因此，通过在我们自己的媒体创作和消费中选择非默认项，并通过有目的地选择我们接触的媒体，我们可以增加输入内容推荐模型的内容和用户活动的多样性、准确性，甚至公正性。

    '
- fmt: '# 排版后的文本


    然而，针对系统性问题的个体解决方案所能做到的十分有限。但正如凯西·奥尼尔（Cathy O‘Neil）在其著作《数学杀伤性武器》（*Weapons of Math
    Destruction*）中所论证的，那些被用来针对受害者并助长不公正的相同数据、模型和算法，也可以被主动用来以有助于纠正不公正的方式进行干预。^([^(224)](#fn224))
    活动家、平台和监管机构可以利用用户活动数据和内容数据库来识别社会偏见——甚至是无意识的系统性偏见——并利用这些认知来触发对输入，甚至模型本身的改变。这些改变可以对抗由技术自然产生的偏见放大效应——甚至可能对抗社会中存在的偏见。这正是谷歌为了解决“大屠杀是否发生过？”问题，以及我们在第三章中讨论的搜索“黑人女孩”（"black
    girls"）时产生的压迫性图像问题所做的事情。


    现在，这种旨在纠正社会不公正的企业或政府方法迅速招致了关于审查的指责。对内容和算法推荐进行干预，只会以牺牲用户言论自由为代价，引入程序员的偏见，使平台成为有偏见的真理和言论自由的仲裁者。这是一个非常现实的担忧，尤其是看到平台在尝试内容审核时屡屡失败。但是，如果我们从认识到内容推荐引擎默认会放大现有的社会偏见，并且这种偏见放大本身限制了某些社群的言论自由（有时甚至是生存自由）出发，这就能为我们提供一个框架，用以思考如何调整算法和政策，以尊重所有人生活、自由和言论自由的权利。这同样不是一个容易解决的问题，但只要无所作为会使情况更糟（当前数据肯定表明情况如此），我们就需要不断地重新构想和重新实现我们日常生活中所依赖的技术。


    再以俄罗斯2016年的活动为例。与缅甸军方不同，他们的许多活动始于社群建设。他们分享的信息在许多方面是无害的，或者至少是*典型的*内群体情感表达。这使得他们能够建立起庞大的社群，这些社群中的成员“喜欢”（既有现实意义上的喜欢，也有脸书意义上的喜欢）耶稣、老兵、种族平等、德克萨斯州或环境。更尖锐的攻击和更两极分化的信息往往稍后出现，一旦用户点击了“喜欢”页面、关注了账号，或者定期与互联网研究机构（IRA）“专家”创建的帖子进行互动。结果是出现了“媒体幻象”，在某种意义上也是“社群幻象”，用户的活跃历史告诉内容推荐模型，向他们提供不成比例数量的来自IRA控制账户或代表克里姆林宫同情观点的内容。这不仅让IRA在选举临近时，为他们最激烈的支持特朗普、反对克林顿和压制投票的信息拥有了现成的受众。这也意味着，那些与IRA内容进行过互动的用户更有可能看到来自*真实美国人*的内容，这些美国人持有的观点无论多么真实和个人化，碰巧与克里姆林宫的利益一致。通过早期强化现有的社会偏见和个人兴趣，IRA得以“入侵”模型，使得最有可能参与克里姆林宫友好信息的用户看到更多此类内容，即使信息来源是合法的。


    这是一种情境，在此情境下，将虚假信息视为*操纵行为*与将虚假信息视为*欺骗性信息*之间的对比变得尤为清晰。通过研究并利用现有的社会偏见，IRA能够利用这些人们真诚持有的信念，努力操纵不知情的美国人，使其采取他们可能原本不会采取的行动。无论这些帖子和表情包是否属实，这一点都是成立的。


    再多的个人事实核查也无法解决这个问题。这首先且首要是一个*行为*问题，只有通过大规模的数据分析才能被识别和解决：跨社群、跨平台、跨长时间跨度。但是，如果平台、政府和/或第三方研究人员进行了这种大规模分析，并且因为这些协调一致的、非自然的、操纵性的行为而封禁账号，那么那些更老练的国家行为体就会失去许多操纵社群为其不自觉地效力的最佳工具。在这个过程中，我们都将重获信息空间的正直性。


    这种正直来之不易，尤其是当我们面对来自像军队或国家资助机构这样老练行为体的影响行动时。正如俄罗斯的行动尤其表明的那样，虚假信息是国际性的、跨平台的，并且将事实与虚构同样武器化。因此，没有任何一个实体拥有所有必要的数据或专业知识来解决这个问题。平台没有彼此的数据，也没有情报或执法机构掌握的数据。而且，它们没有情报机构、大学和非营利智库所拥有的文化或语言专家。政府没有平台的数据——并且只能在特定法律情况下收集数据——也没有许多拥有丰富工程经验的员工。而第三方研究人员虽然有时在不同领域拥有更健康的专家组合，但他们直接访问平台数据的权限也更少。正如美国政府在9/11袭击后意识到的那样，信息共享和协同利用各种领域的专业知识将是应对最复杂虚假信息战役的关键。考虑到西方政府在监视本国公民方面正当面临的法律限制，以及科技公司之间的竞争关系，很可能需要精心构建的公共-私营合作伙伴关系，才能应对全球社会日益面临的信息虚假防御需求。'
  raw: 'However, individual solutions to systemic problems can only go so far. But
    as Cathy O’Neil argues in her book *Weapons of Math Destruction*, the same data,
    models, and algorithms that are used to target victims and promote injustices
    can be used to proactively intervene in ways that help correct injustices.^([^(224)](#fn224))
    Activists, platforms, and regulators can use user activity data and content databases
    to identify social biases—even unconscious, systemic biases—and use those realizations
    to trigger changes to the inputs, or even the model itself. These changes can
    counter the bias amplification naturally produced by the technology—and possibly
    even counter the bias existing in society. This is what Google did to correct
    the “Did the holocaust happen?” problem, as well as the oppressive images that
    resulted from searches for “black girls” that we discussed in Chapter [3](#469027_1_En_3_Chapter.xhtml).


    Now, such corporate or governmental approaches to rectifying social injustices
    lead quickly to claims of censorship. Intervening in the content and algorithmic
    recommendations will simply bring in the bias of programmers, at the expense of
    the free speech of users, making the platforms the biased arbiters of truth and
    free expression. This is a very real concern, especially seeing how often platforms
    have failed when they have attempted to moderate content. But if we begin from
    the realization that content recommendation engines amplify existing social bias
    by default, and that that bias amplification itself limits the freedom of expression
    (and, sometimes, the freedom simply to live) of certain communities, it can give
    us a framework for thinking about how we can tune algorithms and policies to respect
    all people’s rights to life, liberty, and free expression. Again, it’s not a simple
    problem to solve, but as long as doing nothing makes it worse (and current data
    certainly suggests that it does), we need to constantly reimagine and reimplement
    the technology we rely on in our daily lives.


    Take Russia’s activity in 2016 as another example. In contrast to the Myanmar
    military, much of their activity began with community building. They shared messages
    that were in many ways innocuous, or at least *typical*, expressions of in-group
    sentiment. This allowed them to build large communities of people who “like” (in
    both the real-world sense and the Facebook sense) Jesus, veterans, racial equity,
    Texas, or the environment. The more poignant attacks and more polarizing messages
    often came later, once users had liked pages, followed accounts, or engaged regularly
    with posts created by IRA “specialists.” The result was a “media mirage,” and
    in some sense a “community mirage,” where users’ activity histories told the content
    recommendation model to serve them a disproportional amount of content from IRA-controlled
    accounts or representing Kremlin-sympathetic views. This not only gave the IRA
    a ready-made audience for their fiercest pro-Trump, anti-Clinton, and vote-suppression
    messages as the election neared. It also meant that users who had engaged with
    IRA content were more likely to see content from *real Americans* who held views
    that, no matter how real and personal, happened to align with the Kremlin’s interests.
    By reinforcing existing social biases and personal interests early on, the IRA
    were able to “hack” the model so that users most likely to engage Kremlin-friendly
    messages saw more of them, even if the sources were legitimate.


    This is a situation where the contrast between disinformation as *manipulative
    behavior* and disinformation as *deceptive messages* comes into sharp relief.
    By researching and weaponizing existing social biases, the IRA was able to wield
    those earnestly held beliefs in their efforts to manipulate unwitting Americans
    into taking actions they may or may not have otherwise taken. And that was true
    regardless of whether or not the posts and memes were factual.


    No amount of individual fact-checking will solve this problem. This is first and
    foremost a *behavioral* issue that can only be seen and solved with the analysis
    of data on the large scale: cross-community, cross-platform, over long stretches
    of time. But if platforms, governments, and/or third-party researchers conduct
    that large-scale analysis, and accounts are suspended for this coordinated, inorganic,
    manipulative behavior, then those more sophisticated state actors lose many of
    their best tools for manipulating communities into unwittingly doing their bidding.
    And in the process, we all regain the integrity of our information space.


    That integrity doesn’t come easy, especially when we are facing influence operations
    from sophisticated actors like a military or state-sponsored firm. As Russia’s
    operations in particular demonstrate, disinformation is international and cross-platform
    and weaponizes fact and fiction alike. As a result, no one entity has all of the
    necessary data or expertise to solve the problem. Platforms don’t have each other’s
    data, nor the data held by intelligence or law enforcement agencies. And they
    do not have the cultural or linguistic experts that the intelligence agencies,
    universities, and nonprofit think-tanks do. Governments don’t have the platforms’
    data—and can only collect data under certain legal circumstances—nor do they have
    many employees with significant engineering experience. And while third-party
    researchers have, at times, a healthier mix of experts in different areas, they
    also have less direct access to  platform data. Just like the U.S. government
    realized after the September 11 attacks, information sharing and the collaborative
    utilization of a variety of areas of expertise will be key to addressing the most
    sophisticated disinformation campaigns. And given the legal constraints Western
    governments rightly face when it comes to surveilling their own citizens, and
    the competitive relationship the tech companies have with each other, it is likely
    that carefully structured public-private partnerships will be required to address
    the disinformation defense needs that societies around the globe are increasingly
    encountering.'
