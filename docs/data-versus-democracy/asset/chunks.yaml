    # 3. Swimming Upstream


    How Content Recommendation Engines Impact Information and Manipulate Our Attention


    As we have shifted from an information economy to an attention economy in the
    past two decades, we have almost simultaneously shifted from mass media to social
    media. The drastic increase in available media necessitates a way for individuals
    to sift through the media that is literally at their fingertips. Content recommendation
    systems have emerged as the technological solution to this social/informational
    problem. Understanding how recommendation system algorithms work, and how they
    reinforce (and even exaggerate) unconscious human bias, is essential to understanding
    the way data influences opinion.'
  raw: '## Summary


    Let’s sum up what we’ve learned. The brain is a large and complex information
    system, with optimized storage solutions and a powerful predictive analytics engine.
    It’s the real intelligence that the best AI systems are still trying to catch
    up to. The result of the brain’s optimized information storage and predictive
    analytics algorithms is a bottleneck called attention—the small amount of information
    we can “think about” at any given time, including memories and signals from our
    five senses. Biologically, attention is incredibly powerful, but also incredibly
    expensive, and therefore incredibly limited. Over the course of human evolution,
    we have evolved processes for prioritizing the information that makes it into
    conscious attention, including both hard-wired rules by which certain kinds of
    stimuli will always take priority as well as the capability to *learn* new priorities
    and connections that govern our attention.


    One of the main things we learn is statistical frequency (familiarity). Memories
    we engage frequently stay “preactivated,” ready for easy access. We also learn
    relationships between memories and stimuli, and when we interact with one thing
    in our memory, all of the things our brain has related it to will also raise in
    their level of activation, making it easier for us to process what we predict.


    We also know that, all else being equal, when a perception is easy to process,
    we form a positive emotional response. And that unconscious familiarity can be
    a powerful driver of positive responses to things we perceive.


    Of course, the degree to which something is familiar, whether or not we are aware
    of that familiarity, and what associations (positive and negative) we might have
    already made with that thing is highly individual. And while advertisers have
    been dividing us into groups for decades, and serving up ads likely to be the
    most effective for the particular group(s) we belong to, the optimal solution
    will be individualized.


    But there are a few problems with completely individualized advertising. First,
    in order to work, it requires access to tons of data about us as individuals—much
    of which we likely view as private. This includes knowledge of what we’ve seen,
    heard, smelled, tasted, touched, in what contexts we’ve interacted with it, and
    how we reacted to it in those different contexts. Where relevant data is absent,
    it requires a means of filling in the gaps (more on that in Chapter [3](#469027_1_En_3_Chapter.xhtml)).
    Assuming advertisers have the data needed to manipulate us in the way they desire,
    this completely individualized advertising can have effects on both our behavior
    and our psychology that were *not* intended, or even thought of, by the advertisers.
    And the effects—both intended and unintended—are more difficult to regulate, as
    the groups of people who see the same advertisements are far smaller and more
    diffuse than TV markets or subscribers to a particular magazine. Finally, what
    happens when the (private) data collected to make this hyper-targeted advertising
    effective is sold, leaked, or hacked?


    We’ll unpack these questions in Chapter [4](#469027_1_En_4_Chapter.xhtml) and
    beyond. But first, let’s get our heads around how the attention economy, our cognitive
    limitations, and personalized, targeted content work together in the increasingly
    central feature of modern human society: the algorithmic news feed.


