  trans: '

    ## 有哪些新内容？


    在线广告有时会令人毛骨悚然。


    不久前，我妻子在 Facebook 上注意到一则奇怪的广告。Facebook 提示她可能对一套露台坐垫感兴趣。*真有意思*，她想，*我刚刚跟妈妈通电话，她正说自己在外面找这种坐垫呢！*
    几周后，类似的事情又发生了，这次是一盏她从一家多年未光顾的商店买的台灯，但她父母恰好去过那家店。我问她上个月去父母家时，是否在父母的电脑上登录过 Facebook，答案当然是肯定的。她用完时确保退出了登录，但
    Facebook 安装在父母浏览器中的 Cookie 仍然存在，继续回传数据，而她的父母正在网上购买坐垫和台灯。经过几次网络搜索（和信用卡付款）后，她父母的购物记录与她在
    Facebook 服务器上的个人资料同步了。于是，当她的父母浏览家居用品时，她在信息流中看到了类似商品的广告。


    在这种情况下，Facebook 犯了一个错误，将她的在线身份与她父母的混为一谈。但有时，这些平台又*太*准确了。


    你可能听说过几年前新闻中的这个故事。一位父亲收到 Target 寄给他的青少年女儿的广告邮件，愤怒不已，邮件鼓励她购买尿布、婴儿床、婴儿服装和其他与怀孕相关的商品。“你们是在鼓励她怀孕吗？”据报道他这样质问商店经理。几天后，经理打电话给这位父亲再次道歉。但父亲告诉他：“结果发现，我家里发生了一些我完全不知道的事情。[我女儿]的预产期在八月。我欠你一个道歉。”^(⁵¹)


    原来，像当今许多零售商一样，Target 正在使用顾客的购买历史来预测未来的购买行为，并根据这些预测向他们发送广告和个性化优惠券，所有这些都是为了说服现有顾客将
    Target 变成他们的“一站式商店”。


    但不仅仅是广告商将用户数据输入预测模型以生成超精准结果。在萨菲亚·乌莫贾·诺布尔的著作《算法的压迫：搜索引擎如何强化种族主义》中，她讲述了一个令人痛心的谷歌搜索故事。诺布尔想寻找关于作为美国农村有色人种年轻女性成长的资源，与女儿及其朋友分享，于是她拿起笔记本电脑，在谷歌上搜索“黑人女孩”。她写道：


    * 我几乎无意中让她们看到了广告商对她们最直观、最赤裸裸的描绘之一：黑人女孩仍然是色情网站的素材，被非人化为商品、产品和性满足的对象。我合上笔记本电脑，把注意力转移到我们可以做的有趣事情上，比如去街边看场电影。^(⁵²)


    诺布尔的书中充满了其他搜索示例，就像我们在第 1 章中探讨的那样，它们基于社会的偏见和成见返回预测结果——搜索“大猩猩”的图片会返回非裔美国人的图片，搜索“女孩”比搜索“男孩”返回更年长和更性感化的结果，等等。在这些情况下，结果并非“个性化”——诺布尔显然不是在寻找谷歌搜索引擎在搜索结果首页提供给她的色情内容。这些结果反映了创建算法的*程序员*的偏见，以及那些搜索“黑人女孩”并显然更频繁点击色情链接（而非包含旨在赋权有色人种年轻女性资源的网站）的*用户*的偏见。然后，这些偏见会返回预测大多数用户“想要”看到的结果。


    谷歌此后已解决了这类问题。现在，在我的电脑上（关闭安全搜索）搜索像“黑人女孩”这样中性的词，会返回像“黑人女孩摇滚！”和“黑人女孩编程”这样的网站，以及穿着整齐的黑人女性图片。（请注意，只有少数图片包含真正的*女孩*，而非成年女性。进步就是进步，但我们仍需努力……）


    但搜索本身不中立时会发生什么？如果搜索明确带有种族主义色彩呢？


    2015 年，恐怖分子迪伦·鲁夫在南卡罗来纳州查尔斯顿犯下大规模谋杀案之前，留下了一份“宣言”。在这份宣言中，他*声称*（让我明确一下，我对任何恐怖分子宣言中的说法都持极度怀疑态度）是谷歌搜索促使他进行“种族战争”。据鲁夫说，他搜索了“黑人对白人的犯罪”，结果页面为他提供了自我激进化所需的所有信息。^(⁵³)
    此后，谷歌也进行了更新以纠正此类搜索，以至于今天在我电脑上该搜索的前十项结果中有三项指向美国政府的官方犯罪统计数据。但在 2015 年，寻找按人口统计分类的政府犯罪统计数据的人很少使用像“黑人对白人的犯罪”或“黑人对黑人的犯罪”这样的术语。这些短语通常被种族主义者使用，无论是在他们的搜索中还是在他们的网站上。这种搜索本身就反映了搜索引擎用户可能的种族主义倾向，即使是“中立”的算法也可能预测种族主义网站是最理想的结果。


    现在，让我明确一点。当一个显然有能力在教堂的圣经学习班中杀害九名无辜陌生人的人搜索“黑人对白人的犯罪”时，这个人已经走在激进化道路上了。迪伦·鲁夫并不是*被*谷歌搜索激进化。但鉴于所有搜索引擎都能对像“黑人女孩”这样的“中立”搜索返回有偏见的结果，那么当输入本身带有偏见、甚至充满仇恨时，预测结果可能会多么有偏见，这一点至关重要。


    搜索引擎算法的偏见放大效应，或许在几年前《卫报》记者卡罗尔·卡德瓦拉德身上发生的事情中表现得最为明显。她写道：


    > 一周前，我在谷歌搜索框中输入了“did the hol”，并点击了其自动补全建议“Did the Holocaust happen?”（大屠杀真的发生过吗？）。在列表顶部，有一个指向
    Stormfront（一个新纳粹白人至上主义网站）的链接，以及一篇题为“大屠杀没有发生的十大原因”的文章。^(⁵⁴)


    也许比反犹搜索结果更令人愤慨的是谷歌的初步回应。谷歌发表声明称：“我们很伤心地看到仇恨组织仍然存在。仇恨网站出现在搜索结果中并不意味着谷歌赞同这些观点。”但他们当时拒绝从其搜索结果中移除新纳粹网站。


    最终，谷歌确实进行了干预，并纠正了该搜索的结果，^(⁵⁵) 以至于今天在谷歌上搜索“大屠杀真的发生过吗？”会返回一整页证实其确实发生过的结果，并解释了大屠杀否认现象。在我刚才的搜索中，在第一页结果中甚至还有一篇来自《卫报》关于这一搜索词丑闻历史的文章。

    '
- fmt: '# 算法偏见与内容推荐


    Google 最初的回应——即算法是中性的，手动修改搜索结果是不恰当的，无论这些结果多么令人反感——触及了我们将在本章中探讨的核心问题。这种*算法中立性*的观点是一个数据科学谬误。开发机器学习模型总是意味着在输出不符合模型的期望或需求时对算法进行调整。这是因为错误和偏见总会悄然潜入系统，有时只有在算法大规模运行时才能被检测到。


    然而，就搜索结果而言，模型是不断演化的，每天都有数百万次搜索被执行，每一次搜索都会实时改变模型所“训练”的数据集。搜索引擎算法不仅会传播其*程序员*有意或无意的偏见，它也可能被其*用户*有意或无意地操控。


    若不加以控制，内容推荐算法就会成为偏见的放大器。这对社交网络信息流和搜索引擎而言同样如此。从宏观层面理解它们的工作原理，有助于我们更好地理解网络自我激进化、党派两极分化，以及行为者如何大规模操纵平台以推进其议程。它还能帮助我们更批判性地思考在个人社交信息流和搜索结果中遇到的信息，并为我们提供在在线信息空间推动积极变革所需的立足点。


    那么，让我们深入探讨……


    ## 信息流如何运作


    社交媒体和搜索算法是重要的商业机密。除了直接参与这些算法开发的开发者之外，没有人能百分之百确定它们在所有细节上是如何运作的。然而，凭借对机器学习算法一般原理的了解，再加上观察模型输入和输出的经验，我们可以逆向推导出相当多的细节。再结合这些模型背后的数据科学家发表的研究论文，我们就能相当清晰地描绘出它们的工作原理及其对社会的影响。


    让我们以搜索引擎为例。当某人执行图像搜索时，搜索算法（或称模型）会考虑搜索词之外的许多输入，以决定输出——即结果图像的排序，将最可能被点击的图像置于列表顶部。


    除了搜索查询本身，模型还会考虑来自我个人资料和过去活动的信息。^([^(56)](#fn56)) 例如，如果我的资料显示我目前居住在美国，我看到的搜索结果可能与资料显示我居住在印度或委内瑞拉时不同。在大多数平台上，我的个人资料还包含关于性别、年龄、教育程度、婚姻状况、种族等信息，这些信息要么是我主动提供的，要么是平台根据我的活动推断出来的。^([^(57)](#fn57))
    当然，推断数据并不完美——我的一个 Google 账户认为我是男性，另一个认为我是女性，并且两者对我音乐和体育品味的判断都大错特错——但它与用户提供的数据一起被用于个性化内容。


    根据平台的不同，各种类型的过往活动会被加权，以决定算法推荐的内容。对于搜索引擎来说，这可能包括过去的搜索记录和我们点击过的结果。对于广告平台，它可能包括在合作商店的购买记录、在合作电商网站浏览过的产品，或者我们所在区域中许多社交媒体联系人常去的零售商。对于社交网络内容信息流，它可能包括我们发布的内容类型，以及我们“参与度”最高的内容类型，这些参与度通过点赞/收藏、评论、点击来衡量，在某些情况下，还包括我们在滚动浏览之前花在查看内容上的时间。^([^(58)](#fn58))


    但还有第三类输入，也许是最重要的一类，帮助模型决定我们看到的内容：*与我们无关的数据*。


    这当然包括所考虑内容本身的信息——使该内容独一无二的数据和元数据、关于其流行度的一般信息等。但它也包含*其他用户*的活动信息。^([^(59)](#fn59))


    来自其他用户的数据对于任何内容推荐引擎都至关重要。没有这些数据，推荐就只能依据用户过往的活动来决定接下来要展示的最佳内容。由于每个人和每种情况都是独特的，那么少量的数据能提供的决策上下文将非常有限。在许多情况下，算法就像在盲目飞行，没有相关的数据可供参考来做出预测。因此，算法的推荐效果会相当糟糕。'
  raw: 'Google’s initial response—that the algorithm was neutral, and that it would
    be inappropriate to alter the search results manually, regardless of how reprehensible
    they may be—hits at the core of what we will unpack in this chapter. This idea
    of *algorithmic neutrality* is a data science fallacy. Developing a machine learning
    model always means refining the algorithm when the outputs do not match the expectations
    or demands of the model. That’s because mistakes and biases always creep into
    the system, and sometimes they can only be detected once the algorithm is put
    to work at a large scale.


    In the case of search results, though, the model is constantly evolving, as millions
    of searches are performed each day, each one altering the dataset the model is
    “trained” on in real time. Not only will a search engine algorithm propagate the
    conscious and unconscious bias of its *programmers*, it is also open to being
    gamed consciously or unconsciously by its *users*.


    Left unchecked, a content recommendation algorithm is a bias amplifier. That is
    as true for social network feeds as for search engines. Understanding how they
    work on a general level can help us better understand online self-radicalization,
    partisan polarization, and how actors can manipulate platforms to advance their
    agendas on a massive scale. It can also help us think more critically about the
    information we encounter in our own social feeds and search results, and give
    us the foothold needed to effect positive change in the online information space.


    So let’s dive in…


    ## How the Stream Works


    Social media and search algorithms are important trade secrets. Outside of the
    developers who work on those algorithms directly, no one can know with 100% certainty
    how they work in all the gory details. However, equipped with a knowledge of how
    machine learning algorithms work in general, alongside experiences of seeing the
    inputs and outputs of the models , we can reverse engineer a fair amount of the
    details. Add that to research papers published by the data scientists behind these
    models, and we can paint a fairly good picture of how they work and the effects
    they have on society.


    Let’s use a search engine as an example. When someone performs an image search,
    the search algorithm, or model, considers a number of inputs alongside the search
    term in order to determine the output—the result images in an order that surfaces
    the images most likely to be clicked at the top of the list.


    In addition to the search query itself, the model considers information from my
    user profile and past activity.^([^(56)](#fn56)) For example, if my profile tells
    it that I currently live in the United States, I’ll likely see different results
    than if my profile tells the model I live in India or Venezuela. My profile for
    most platforms also contains information about my gender, age, education, marital
    status, race, etc., either because I provided that information or because the
    platform inferred it from my activity.^([^(57)](#fn57)) Inferred data is, of course,
    imperfect—one of my Google accounts thinks I’m male, another thinks I’m female,
    and both have wildly misidentified my taste in music and sports—but it is used
    to personalize content alongside user-provided data.


    Depending on the platform, various kinds of past activity are weighed to determine
    the content recommended by the algorithm. For a search engine, that may be past
    searches and the results we clicked. For advertising platforms, it may include
    purchase made at partner stores, products viewed on partner e-commerce web sites,
    or retailers in our area frequented by many of our social media contacts. For
    a social network content feed, it likely includes the kinds of content we post
    and the kinds of content we “engage” most, measured by likes/favorites, comments,
    clicks, and in some cases, the amount of time we spend looking at it before we
    scroll by.^([^(58)](#fn58))


    But there’s a third, and probably the most important, category of inputs that
    help the model determine the content we see: *data that has nothing to do with
    us*.


    This, of course, includes information about the content under consideration—the
    data and metadata that makes that content unique, general information about its
    popularity, etc. But it also contains information about the activity of *other
    users*.^([^(59)](#fn59))


    Data from other users is key for any content recommendation engine. Without that
    data, the recommendation would only have past user activity as the basis for determining
    the best content to surface next. Because every person and situation is unique,
    that small amount of data would provide very little context in which to make a
    decision. In many cases, it would be flying blind, with no relevant data to draw
    on to make a prediction. As a result, the algorithm’s recommendations would be
    rather poor.'
