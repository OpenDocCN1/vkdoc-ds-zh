  trans: '

    大约在同一时间，奇幻熊将目标对准了民主党全国委员会。但这次鱼叉式网络钓鱼攻击的目标不仅仅是电子邮件。这些邮件中的欺诈链接在点击时具有在电脑上安装恶意软件的能力，而下载到民主党全国委员会电脑上的恶意软件让俄罗斯总参谋部情报总局得以访问这些电脑以及该委员会服务器上的数据。^(¹⁵⁵)


    俄罗斯并没有仅仅坐拥从这些攻击中获取的`kompromat`。2016 年 4 月，美国情报机构如今认为与俄罗斯有关的两个网站被注册：`electionleaks.com`和`dcleaks.com`。同年
    6 月，`dcleaks.com`和“黑客”Guccifer 2.0 的博客（美国情报界同样认为这可能是俄罗斯总参谋部情报总局的一次行动）开始发布针对民主党获取的`kompromat`——包括关于民主党全国委员会领导层如何保护克林顿免受伯尼·桑德斯挑战的信息。这除其他外，还导致了桑德斯支持者对民主党全国委员会提起诉讼——以及可能来自左翼人士的大量抗议投票（要么不投票，要么投票给吉尔·斯坦这样的第三方候选人），从而在选举中损害了克林顿的选情。^(¹⁵⁶)


    同样在 2016 年 6 月，朱利安·阿桑奇宣布维基解密已获取了针对希拉里·克林顿的`kompromat`。（阿桑奇否认俄罗斯是这些数据的来源。）同年 7
    月，维基解密开始发布这些`kompromat`，并战略性地安排这些信息在选举剩余过程中陆续发布，最终于 2016 年 10 月 7 日公布了波德斯塔的电子邮件——同一天（且紧随其后），“特朗普门”的`Access
    Hollywood`录音带也被曝光。^(¹⁵⁷)


    尽管我们永远无法完全了解俄罗斯总参谋部情报总局行动的全部影响范围，但有几个后果很可能归因于奇幻熊从克林顿竞选团队和民主党全国委员会获取的`kompromat`的发布。首先，关于民主党全国委员会如何压制桑德斯赢得提名机会的揭露，疏远了许多倾向左派的选民——这很可能压制了来自更左翼（在初选和党团会议中支持桑德斯的人）和中间派（这些人可能因对特朗普反感却仍不愿投票给克林顿）的克林顿选票。这种情况很可能因俄罗斯互联网研究机构（我们稍后将详细解析）发起的支持吉尔·斯坦和“绝不选克林顿”的运动而进一步加剧。


    波德斯塔电子邮件中包含的其他细节，很可能也压制了克林顿左翼和中间派潜在支持者的投票率——或至少是他们的热情。正如杰夫·斯坦为`Vox`所写：


    *   到目前为止，波德斯塔的电子邮件中实际上没有一条爆出关于这位有望成为下任总统的女性的任何新丑闻。相反，它们大多只是进一步揭示了我们已经知道的克林顿多重争议背后丑陋的一面：克林顿基金会与其捐赠者之间可疑的关系、克林顿与华尔街权势利益集团的亲密关系，以及她与富裕竞选捐款人的联系。^(158))


    克林顿基金会的争议对于她在被特朗普疏远的中间派中的潜在支持尤其具有破坏性。这些人中许多过去曾投票给共和党，并对共和党提名人感到不满。但围绕她的腐败传闻，加上共和党人对克林顿这个姓氏的偏见，很可能使得许多温和派和失望的共和党人在
    2016 年难以投票给民主党。与华尔街和富裕捐赠者的联系，很可能损害了克林顿在前桑德斯支持者中的机会，这些人一直要求克林顿公布她过去有偿向银行家和其他美国富人发表的私人演讲内容。其中一些内容令人尴尬或难堪，但有些内容也削弱了克林顿在其竞选政策纲领之外的左翼人士中争取支持的能力。


    我还认为，长达数月对“克林顿电子邮件”的痴迷，加剧了联邦调查局局长詹姆斯·科米 2016 年 10 月 28 日声明的影响，他当时宣布重新调查克林顿在担任国务卿期间使用私人电子邮件服务器一事。这项调查因在前国会议员安东尼·韦纳的调查中浮出水面的证据而重启，韦纳分居的妻子胡玛·阿贝丁是克林顿的高级助手。^(159))
    科米调查的是克林顿的私人电子邮件服务器可能包含机密信息的可能性，并非俄罗斯或维基解密发布的电子邮件内容，但一个充斥着对“克林顿电子邮件”模糊提及的快节奏新闻周期，很可能意味着这些新闻报道相互叠加，共同影响选民。


    然而，也许最重要的是，俄罗斯总参谋部情报总局发布针对克林顿和民主党全国委员会的`kompromat`，意味着*俄罗斯得以在很大程度上为总统选举设定了议程*。记者们仔细研究泄露的内容以寻找独家新闻，然后进行报道。这些记者在辩论中也提出了关于这些文件内容的问题。而候选人在整个竞选过程中都面临着来自记者和选民的关于这些文件的质询。每一个关于这些俄罗斯`kompromat`的问题——无论该问题本身所代表的担忧多么合理——都是一个没有涉及竞选活动所提出的政策纲领的问题。花费在追查安全隐忧和准备这些问题答案上的时间，都是竞选团队用于构建和捍卫自身纲领的时间。在相当程度上，俄罗斯黑客决定了美国选民会将其有限的注意力投入到哪些议题上，并据此决定他们在
    11 月 8 日如何投票。我和我的同事们将这种对公共信息的操纵称为“武器化的真相”。对于安全研究人员来说，奇幻熊数据泄露的内容看起来是真实的——它们不是“假新闻”。但它们意在操纵公共话语和个人行为。无论我们是否将其称为“虚假信息”（我是这样认为的，因为不诚实的操纵是行动的核心），它无疑是信息战的一个组成部分——而且由于基于事实，它可能是一种极其有效的手段。

    '
- fmt: '### Project Lakhta


    Of course, Russia did not just manipulate American public discourse via the release
    of hacked and leaked documents. Their Internet Research Agency (`IRA`) also conducted
    information warfare against the United States through an expert social media manipulation
    campaign. The details of the `IRA`’s extensive operations are detailed primarily
    in indictments issued in 2018 by the U.S. Department of Justice against key Russian
    individuals and LLCs and in two reports prepared for the U.S. Senate Select Committee
    on Intelligence (`SSCI`) and released in December 2018, providing a detailed analysis
    of data provided to `SSCI` by `Twitter`, `Facebook` (including `Instagram`), and
    `Google` (`YouTube`).^([^(160)](#fn160))


    The picture portrayed in these documents—which is likely still incomplete—is one
    of large-scale, expert manipulation of public attention through a combination
    of “weaponized truth,” partial truths, flat-out lies, and voter suppression narratives,
    aimed at the election of Donald Trump as president of the United States and discrediting
    the potential presidency of Hillary Clinton and the democratic process in general.
    Further, after the election, the `IRA` continued to attempt to manipulate and
    destabilize American society, even *increasing* their activity aimed at certain
    American communities on platforms like `Instagram`. And though the data currently
    available suggests that government and platform activities have significantly
    hindered the `IRA`’s ability to wage social media–based information warfare, it
    is also clear that Russian groups are still attempting to manipulate public opinion
    and discredit their critics via U.S.-targeted online media.


    While Russian influence operations go back much further, even in the United States,
    the now-famous operation aimed at manipulating the 2016 election ratchets up in
    April 2014 with the formation of the `IRA`’s “translator project,” aimed at studying
    U.S. social and political groups on online platforms, including `YouTube`, `Facebook`,
    `Instagram`, and `Twitter`. In May 2014, the strategy for this operation, known
    internally as “Project Lakhta,” was set: “spreading distrust towards the candidates
    and the political system in general”^([^(161)](#fn161)) with the objective of
    interfering in the 2016 U.S. election, specifically.^([^(162)](#fn162)) By June
    2014, `IRA` operatives were already conducting in-person intelligence gathering
    physically in the United States (with a subsequent trip in November 2014).^([^(163)](#fn163))
    By September 2016, Project Lakhta’s *monthly* budget was approximately 1.25 million
    dollars.^([^(164)](#fn164))


    According to the `IRA` indictment:


    *   Defendants and their co-conspirators, through fraud and deceit, created hundreds
    of social media accounts and used them to develop certain fictitious U.S. personas
    into “leader[s] of public opinion” in the United States.


    `ORGANIZATION` employees, referred to as “specialists,” were tasked to create
    social media accounts that appeared to be operated by U.S. persons. The specialists
    were divided into day-shift and night-shift hours and instructed to make posts
    in accordance with the appropriate U.S. time zone. The `ORGANIZATION` also circulated
    lists of U.S. holidays so that specialists could develop and post appropriate
    account activity. Specialists were instructed to write about topics germane to
    the United States such as U.S. foreign policy and U.S. economic issues. Specialists
    were directed to create “political intensity through supporting radical groups,
    users dissatisfied with [the] social and economic situation and oppositional social
    movements.”^([^(165)](#fn165))


    This included focusing messaging around themes like immigration, Black Lives Matter
    and police brutality, Blue Lives Matter, religion, and regional secession, among
    others. These topics were guided through internal documents provided to `IRA`
    “specialists” to use as the basis of their content, and in September 2016, one
    internal memo stressed that “it is imperative to intensify criticizing Hillary
    Clinton” in advance of the November election.^([^(166)](#fn166))


    The internal documents made public by the Department of Justice in their indictments
    of key IRA officials and shell companies only provide a small window into their
    actual operations targeting Americans, though. To really see what they did and
    how their content spread, the Senate Select Committee on Intelligence commissioned
    two groups to analyze private data provided to the Senate by `Twitter`, `Facebook`,
    and `Google` and report their findings. Several of my colleagues and I had the
    honor of contributing to one of those reports. While those datasets were all missing
    key metadata (and, I believe, further examples of `IRA` and other Russian agencies’
    U.S.-directed propaganda), they exhibit a *massive* and *professional* operation
    that far exceeds the initial statements made by platform executives. It is impossible
    to quantify how many votes this campaign may have changed, or at least influenced,
    but it is impossible to deny that this operation, in conjunction with Fancy Bear’s
    work, was a significant factor in the tone of the election, the issues that took
    center stage in public discourse, and the media coverage around the election.
    All of this together certainly influenced *some* votes and has since cast doubt
    on the legitimacy of the 2016 election and fear about foreign influence of previous
    and subsequent elections.


    But just what did their operation look like? And how pervasive was it?


    To start with, `IRA` influence operations around the 2016 U.S. election hit every
    major platform, and even some minor ones. In addition to `Facebook`, `Instagram`,
    `Twitter`, and `YouTube`, evidence of `IRA` operations has surfaced on `Google
    Plus`, `Vine`, `Gab`, `Meetup`, `VKontakte`, `LiveJournal`, `Reddit`, `Tumblr`,
    `Pinterest`, `Medium`, and even `Pokémon Go`.^([^(167)](#fn167)) That’s to say
    nothing of the world-wide web, where the `IRA` (and other branches or contractors
    of the Russian government) have web sites, blogs, and pro-Kremlin “think-tank”
    journals. This network of `IRA` web assets was “run like a sophisticated marketing
    agency” with dozens of real people posting, sharing, retweeting, and commenting
    on each other’s memes, blogs, and tweets. As my colleagues and I wrote in our
    report for `SSCI`, “it was far more than only $100,000 of Facebook ads, as originally
    asserted by Facebook executives. The ad engagements were a minor factor in a much
    broader, organically-driven influence operation.”^([^(168)](#fn168)) The overall
    budget for Project Lakhta exceeded $25 million,^([^(169)](#fn169)) which primarily
    went to paying employees to create not ads but *organic* content: tweets, posts,
    memes, videos, events, all shared from user accounts and pages belonging to fake
    personas and groups carefully crafted by `IRA` “specialists.” Overall, `IRA` content
    pre- and post-election reached an estimated 126 million Americans on `Facebook`,
    20 million on `Instagram`, and 1.4 million on `Twitter`. This was no tiny operation.'
  raw: '### Project Lakhta


    Of course, Russia did not just manipulate American public discourse via the release
    of hacked and leaked documents. Their Internet Research Agency (IRA) also conducted
    information warfare against the United States through an expert social media manipulation
    campaign. The details of the IRA’s extensive operations are detailed primarily
    in indictments issued in 2018 by the U.S. Department of Justice against key Russian
    individuals and LLCs and in two reports prepared for the U.S. Senate Select Committee
    on Intelligence (SSCI) and released in December 2018, providing a detailed analysis
    of data provided to SSCI by Twitter, Facebook (including Instagram), and Google
    (YouTube).^([^(160)](#fn160))


    The picture portrayed in these documents—which is likely still incomplete—is one
    of large-scale, expert manipulation of public attention through a combination
    of “weaponized truth,” partial truths, flat-out lies, and voter suppression narratives,
    aimed at the election of Donald Trump as president of the United States and discrediting
    the potential presidency of Hillary Clinton and the democratic process in general.
    Further, after the election, the IRA continued to attempt to manipulate and destabilize
    American society, even *increasing* their activity aimed at certain American communities
    on platforms like Instagram. And though the data currently available suggests
    that government and platform activities have significantly hindered the IRA’s
    ability to wage social media–based information warfare, it is also clear that
    Russian groups are still attempting to manipulate public opinion and discredit
    their critics via U.S.-targeted online media.


    While Russian influence operations go back much further, even in the United States,
    the now-famous operation aimed at manipulating the 2016 election ratchets up in
    April 2014 with the formation of the IRA’s “translator project,” aimed at studying
    U.S. social and political groups on online platforms, including YouTube, Facebook,
    Instagram, and Twitter. In May 2014, the strategy for this operation, known internally
    as “Project Lakhta,” was set: “spreading distrust towards the candidates and the
    political system in general”^([^(161)](#fn161)) with the objective of interfering
    in the 2016 U.S. election, specifically.^([^(162)](#fn162)) By June 2014, IRA
    operatives were already conducting in-person intelligence gathering physically
    in the United States (with a subsequent trip in November 2014).^([^(163)](#fn163))
    By September 2016, Project Lakhta’s *monthly* budget was approximately 1.25 million
    dollars.^([^(164)](#fn164))


    According to the IRA indictment:


    *   Defendants and their co-conspirators, through fraud and deceit, created hundreds
    of social media accounts and used them to develop certain fictitious U.S. personas
    into “leader[s] of public opinion” in the United States.


    ORGANIZATION employees, referred to as “specialists,” were tasked to create social
    media accounts that appeared to be operated by U.S. persons. The specialists were
    divided into day-shift and night-shift hours and instructed to make posts in accordance
    with the appropriate U.S. time zone. The ORGANIZATION also circulated lists of
    U.S. holidays so that specialists could develop and post appropriate account activity.
    Specialists were instructed to write about topics germane to the United States
    such as U.S. foreign policy and U.S. economic issues. Specialists were directed
    to create “political intensity through supporting radical groups, users dissatisfied
    with [the] social and economic situation and oppositional social movements.”^([^(165)](#fn165))


    This included focusing messaging around themes like immigration, Black Lives Matter
    and police brutality, Blue Lives Matter, religion, and regional secession, among
    others. These topics were guided through internal documents provided to IRA “specialists”
    to use as the basis of their content, and in September 2016, one internal memo
    stressed that “it is imperative to intensify criticizing Hillary Clinton” in advance
    of the November election.^([^(166)](#fn166))


    The internal documents made public by the Department of Justice in their indictments
    of key IRA officials and shell companies only provide a small window into their
    actual operations targeting Americans, though. To really see what they did and
    how their content spread, the Senate Select Committee on Intelligence commissioned
    two groups to analyze private data provided to the Senate by Twitter, Facebook,
    and Google and report their findings. Several of my colleagues and I had the honor
    of contributing to one of those reports. While those datasets were all missing
    key metadata (and, I believe, further examples of IRA and other Russian agencies’
    U.S.-directed propaganda), they exhibit a *massive* and *professional* operation
    that far exceeds the initial statements made by platform executives. It is impossible
    to quantify how many votes this campaign may have changed, or at least influenced,
    but it is impossible to deny that this operation, in conjunction with Fancy Bear’s
    work, was a significant factor in the tone of the election, the issues that took
    center stage in public discourse, and the media coverage around the election.
    All of this together certainly influenced *some* votes and has since cast doubt
    on the legitimacy of the 2016 election and fear about foreign influence of previous
    and subsequent elections.


    But just what did their operation look like? And how pervasive was it?


    To start with, IRA influence operations around the 2016 U.S. election hit every
    major platform, and even some minor ones. In addition to Facebook, Instagram,
    Twitter, and YouTube, evidence of IRA operations has surfaced on Google Plus,
    Vine, Gab, Meetup, VKontakte, LiveJournal, Reddit, Tumblr, Pinterest, Medium,
    and even Pokémon Go.^([^(167)](#fn167)) That’s to say nothing of the world-wide
    web, where the IRA (and other branches or contractors of the Russian government)
    have web sites, blogs, and pro-Kremlin “think-tank” journals. This network of
    IRA web assets was “run like a sophisticated marketing agency” with dozens of
    real people posting, sharing, retweeting, and commenting on each other’s memes,
    blogs, and tweets. As my colleagues and I wrote in our report for SSCI, “it was
    far more than only $100,000 of Facebook ads, as originally asserted by Facebook
    executives. The ad engagements were a minor factor in a much broader, organically-driven
    influence operation.”^([^(168)](#fn168)) The overall budget for Project Lakhta
    exceeded $25 million,^([^(169)](#fn169)) which primarily went to paying employees
    to create not ads but *organic* content: tweets, posts, memes, videos, events,
    all shared from user accounts and pages belonging to fake personas and groups
    carefully crafted by IRA “specialists.” Overall, IRA content pre- and post-election
    reached an estimated 126 million Americans on Facebook, 20 million on Instagram,
    and 1.4 million on Twitter. This was no tiny operation.'
  trans: '

    ### 拉赫塔项目


    当然，俄罗斯并非仅仅通过发布被黑客窃取和泄露的文件来操纵美国的公共话语。他们的互联网研究机构（`IRA`）还通过一场专业的社交媒体操纵运动，对美国发动了信息战。`IRA`
    广泛行动的细节主要记录在美国司法部于 2018 年对关键俄罗斯个人及有限责任公司提出的起诉书中，以及为美国参议院情报特别委员会（`SSCI`）准备并于 2018
    年 12 月发布的两份报告中，这些报告对`Twitter`、`Facebook`（包括`Instagram`）和`Google`（`YouTube`）向`SSCI`提供的数据进行了详细分析。^(¹⁶⁰)


    这些文件中描绘的画面——很可能仍不完整——是一场大规模、专业化的公众注意力操纵活动，其手段结合了“武器化的真相”、部分真相、彻头彻尾的谎言以及压制选民的说法，旨在让唐纳德·特朗普当选美国总统，同时抹黑希拉里·克林顿的潜在总统任期以及整个民主进程。此外，大选结束后，`IRA`
    继续试图操纵和破坏美国社会的稳定，甚至在`Instagram`等平台上*增加*了针对某些美国社群的活动。尽管目前可获得的数据表明，政府和平台的活动已显著削弱了`IRA`发动基于社交媒体的信息战的能力，但同样清楚的是，俄罗斯团体仍在试图通过针对美国的在线媒体来操纵公众舆论并抹黑其批评者。


    虽然俄罗斯的影响力行动可以追溯到更早，即使在美国也是如此，但如今著名的旨在操纵 2016 年大选的行动，始于 2014 年 4 月`IRA`“翻译项目”的成立，该项目旨在研究在线平台（包括`YouTube`、`Facebook`、`Instagram`和`Twitter`）上的美国社会和政治团体。2014
    年 5 月，这项内部称为“拉赫塔项目”的行动战略被确定：“传播对候选人及整个政治体系的不信任”^(¹⁶¹)，其具体目标是干预 2016 年美国大选。^(¹⁶²)
    到 2014 年 6 月，`IRA`特工已亲自在美国本土进行实地情报搜集（随后于 2014 年 11 月再次行动）。^(¹⁶³) 到 2016 年 9 月，拉赫塔项目的*月度*预算约为
    125 万美元。^(¹⁶⁴)


    根据`IRA`起诉书：


    *   被告及其同谋者通过欺诈和欺骗手段，创建了数百个社交媒体账号，并利用这些账号将某些虚构的美国人物角色发展为美国的“舆论领袖”。


    `组织`的员工（被称为“专员”）的任务是创建看起来由美国人运营的社交媒体账号。这些专员被分为日班和夜班，并被告知要按照美国相应时区发帖。该`组织`还分发美国节假日清单，以便专员们可以制定并发布相应的账号活动。专员们被指示撰写与美国相关的话题，如美国外交政策和美国经济问题。他们还被指示通过“支持激进团体、对社会和经济状况不满的用户以及反对派社会运动”来制造“政治热度”。^(¹⁶⁵)


    这包括将传播信息聚焦于移民、黑人的命也是命与警察暴力、警察的命也是命、宗教和地方分离主义等主题。这些话题通过提供给`IRA`“专员”的内部文件进行指导，作为他们创作内容的基础。2016
    年 9 月，一份内部备忘录强调，“在 11 月大选之前，必须加大批评希拉里·克林顿的力度”。^(¹⁶⁶)


    然而，司法部在对关键`IRA`官员和空壳公司提起的诉讼中公开的内部文件，仅为我们了解他们针对美国人的实际行动打开了一扇小窗。为了真正了解他们做了什么以及他们的内容是如何传播的，参议院情报特别委员会委托两个小组分析`Twitter`、`Facebook`和`Google`提供给参议院的私有数据并报告其发现。我和几位同事有幸为其中一份报告做出了贡献。虽然这些数据集都缺失了关键的元数据（而且我认为，还缺少更多关于`IRA`及其他俄罗斯机构针对美国进行宣传的例子），但它们展现了一场*庞大*且*专业*的行动，远远超出了平台高管们最初的声明。无法量化这场运动可能改变了多少张选票，或至少影响了多少，但无法否认的是，这场运动，连同“
    fancy bear ”的行动，是影响选举基调、成为公共话语中心议题以及围绕选举的媒体报道的重要因素。所有这些因素加在一起，无疑影响了*一些*选票，并自此引发了人们对
    2016 年大选合法性的质疑，以及对先前和后续选举受到外国影响的担忧。


    但他们的行动到底是什么样的？又有多普遍呢？


    首先，`IRA` 围绕 2016 年美国大选的影响力行动触及了所有主要平台，甚至一些次要平台。除了`Facebook`、`Instagram`、`Twitter`和`YouTube`之外，`IRA`活动的证据还出现在`Google
    Plus`、`Vine`、`Gab`、`Meetup`、`VKontakte`、`LiveJournal`、`Reddit`、`Tumblr`、`Pinterest`、`Medium`，甚至`Pokémon
    Go`上。^(¹⁶⁷) 这还不包括万维网，`IRA`（以及俄罗斯政府的其他分支或承包商）在那里拥有网站、博客和亲克里姆林宫的“智库”期刊。这个`IRA`网络资产“像一家精明的营销机构一样运作”，拥有数十名真实人员发布、分享、转发和评论彼此的模因、博客和推文。正如我和同事们在为`SSCI`撰写的报告中所写的那样，“它远远不止是
    Facebook 高管最初声称的 10 万美元的 Facebook 广告。广告参与度只是更广泛、有机驱动的影响力行动中的一个次要因素。”^(¹⁶⁸) 拉赫塔项目的总预算超过
    2500 万美元，^(¹⁶⁹) 这笔钱主要用于支付员工工资，让他们创建的不是广告，而是*有机的*内容：由`IRA`“专员”精心打造的虚假人物和群组所拥有的用户账号和主页分享的推文、帖子、模因、视频、活动。总体而言，`IRA`在大选前后发布的内容估计触及了`Facebook`上
    1.26 亿美国人、`Instagram`上 2000 万美国人以及`Twitter`上 140 万美国人。这绝非小规模行动。

    '
- fmt: 'It’s also important to note that the `IRA`, by and large, did not operate
    a network of automated accounts, known as a `botnet`. `IRA` employees were expected
    to meet daily quotas of organic posts, comments, shares, and likes. These were
    mainly human-operated accounts that sought to “weave propaganda seamlessly into
    what appeared to be the nonpolitical musings of an everyday person.”^([^(170)](#fn170))
    Thus, they had employee shifts that lined up with U.S. time zones (see the `DoJ`
    indictment previously discussed) and a system of bonuses and fines that encouraged
    individual “specialists” to produce high-engagement content.^([^(171)](#fn171))
    To appear even more like real Americans, `IRA` “specialists” played hashtag games^([^(172)](#fn172))
    and posted a high volume of nonpolitical content.


    `Project Lakhta` involved far more than pro-Trump and anti-Clinton messages blasted
    into the ether in the hopes of reaching an audience. In fact, election-related
    posts only accounted for 7% of `IRA` Facebook content, 18% of Instagram content,
    and 6% of Twitter content.^([^(173)](#fn173)) Rather, the `IRA` created what my
    colleagues and I call a “media mirage”—a false, interconnected, multiplatform
    media landscape, targeting multiple different communities with deceptive, manipulative
    messaging.^([^(174)](#fn174)) This “mirage” included a significant portion of
    apolitical content, and where the content was political, it was often focused
    on current divisive social issues that energized (or de-energized) members of
    different communities, rather than specific candidates. This mirage targeted three
    general communities—right-leaning Americans, left-leaning Americans, and African
    Americans—as well as more hyper-targeted subcommunities like pro-secessionist
    Texans, democratic socialists, evangelical Christians, etc. And this mirage targeted
    them with real news, fake news, disingenuous conversation, and—likely most significant—meme
    warfare.


    The `IRA` had done their homework—both online and on the ground in the United
    States—when it came to targeting American communities. (And they constantly retooled
    their messaging based on user engagement stats, just like one would expect from
    a digital marketing firm.) In many cases, they targeted communities with specific
    messages tailored for that community, which, of course, fit the Kremlin’s agenda.
    For example, they targeted right-wing Americans with narratives that would get
    them energized to come out and vote against democratic or moderate candidates—fearmongering
    narratives about immigration and gun rights, inspirational Christian-themed narratives,
    and warnings about Clinton’s alleged corruption. They targeted left-leaning Americans
    with narratives that would de-energize them, turning their Clinton support lukewarm
    or encouraging a third-party or write-in protest vote—narratives about Clinton’s
    alleged corruption, the `DNC`’s undemocratic primary process that denied Bernie
    Sanders a fair shot, feminist and intersectional narratives that labeled Clinton
    a bad feminist. And they targeted African Americans with even more poignant voter-suppression
    narratives about police brutality or the racist tendencies of both parties that
    were intended to turn them off from the democratic process in general. The ultimate
    goal was to encourage votes for Trump and—if not possible to flip a leftist to
    vote Trump—to depress turnout from Democrats and from demographics that tended
    to vote Democrat. And they pursued this goal more through general social and political
    narratives than through posts that referenced the candidates specifically.


    Notice, though, that most of these narratives are about distrust and fear—not
    positive American virtues that happened to be consistent with Russian aims. Yes,
    there were some high-engagement patriotic accounts and pro-Christianity accounts,
    but overall, even these accounts were about creating an insider/outsider framework
    that could be operationalized in other contexts with narratives of fear or anger
    about outsiders. Many of the pro-Christianity accounts, for example, would frame
    the election as a spiritual battle between Jesus and a memeified, demonic depiction
    of Hillary Clinton.^([^(175)](#fn175)) Pro-patriotism accounts would lay the groundwork
    for anti-immigration, anti-Muslim, anti-LGBTQ, or anti-anything-that-could-be-construed-as-contrary-to-“traditional”-American-values
    content. This negativity was part of a secondary goal: to sow division, distrust,
    and general social discord in American society. Regardless of who wins the election,
    if Americans are more divided and more focused on divisive domestic issues, they
    are less of a partner to NATO allies and less of a threat to the Kremlin’s geopolitical
    aims.


    This secondary goal is why U.S.-directed `IRA` operations didn’t cease in November
    2016. In fact, even as the U.S. government and public started to become aware
    of Russian influence operations after the fact in early 2017, and account takedowns
    started to occur on Twitter and Facebook, `IRA` Instagram activity aimed at U.S.
    audiences increased. To be sure, influence operations continued on all major platforms,
    but the data provided by the social media companies tell a clear story of *increased*
    activity on Instagram in particular in 2017, especially content stoking social
    fears among African Americans and the anti-Trump “resistance.”^([^(176)](#fn176))
    `IRA` activity in 2017 targeted right-leaning audiences with predominately anti-Clinton
    messaging, solidifying support for Trump, and narratives about platform censorship
    of conservatives (as Russian accounts began to be taken down); they targeted left-leaning
    audiences with anti-Electoral College narratives, stoking dissatisfaction with
    the electoral process; and they targeted everyone with anti-Robert Mueller narratives,
    attempting to discredit the investigation of Russian interference in the election
    and potential collusion with the Trump campaign.


    ### What Now?


    As we conclude in our Senate report, “it appears likely that the United States
    will continue to face Russian interference for the foreseeable future.”^([^(177)](#fn177))
    In the fallout from the 2016 election, many of the `IRA`’s best U.S.-directed
    assets have been taken down and many of their key leadership and shell corporations
    have been indicted. This makes it far more difficult for them to conduct a high-impact
    operation in the United States. But not impossible. My colleagues and I have continued
    to observe likely Russian propaganda on social media, including content directed
    at the 2018 U.S. midterms.^([^(178)](#fn178)) It’s not clear yet to what extent
    they may have been effective, but they have not disappeared. In addition to online
    propaganda, we also know that Claire McCaskill’s (unsuccessful) reelection campaign
    to the U.S. Senate was the target of hacking, likely by the `GRU`.^([^(179)](#fn179))
    Russia’s state-run, English-language mass media outlets, like `RT` and `Sputnik`,
    and hundreds of Kremlin-linked and Kremlin-aligned blogs and “journals” abound
    on the English-language web. We also know that Russia’s geopolitical ally, Iran,
    has been identified as the source of online disinformation operations, which so
    far have received less direct scrutiny from researchers than Russia’s operations.
    And we haven’t even discussed Russia’s suspected involvement in the UK Brexit
    referendum of 2016 or the hack-and-dump operation targeting Emmanuel Macron’s
    presidential campaign in France in 2017.


    At least for now, this is the new normal.'
