    # 2. 系统中的齿轮


    我们大脑的局限性如何让我们容易受到认知黑客的攻击


    在注意力经济中，理解认知心理学能让情报提供者（或虚假信息散布者）在影响舆论方面占据巨大优势。什么能吸引注意力？如何保持注意力？以及，随着时间的推移，如何以服务于你目的的方式操纵注意力？这些都是我们在完全理解技术在影响舆论方面所扮演的角色之前，需要找到答案的关键问题。


    ## 标题党：接下来发生的事你绝对想不到！


    你难道不讨厌标题党吗？那些诸如“这位父亲在婴儿床上发现一条响尾蛇，接下来发生的事你绝对想不到！”或“你死前必须尝试的 27 个新晚餐计划！”之类的网络标题。尽管听起来廉价又俗气，但这些标题都经过精心设计，基于对数百万用户在线点击习惯的研究。搜索一下“如何写出病毒式传播的标题”，你会发现无数营销指南告诉你使用奇数和能营造紧迫感的短语。


    为什么这些标题（以及附带的文章）变得如此无处不在？标题党或许比其他任何东西都更能代表现代网络生活的面貌。免费内容的丰富性和注意力经济的局限性，让媒体机构争相争夺点击量及其代表的广告收入。但是，由于即使是高质量的信息也能毫不费力、无需花钱就能轻易获取，许多媒体机构不再竞争提供最佳内容，而是竞争提供最吸引眼球的内容。


    这是因为在注意力经济中，茁壮成长的不是那些控制信息的人——那些拥有最大图书馆或最佳内容渠道的人。在注意力经济中，茁壮成长的是那些控制注意力的人——那些能掌控自己注意力，以及能吸引并保持他人注意力的人。


    但注意力到底是什么？为什么我们在任何特定时刻意识到的一两件事，能如此轻易地主宰我们大脑中储存的大量记忆？


    ### 映射认知系统


    想想你的电脑。它将数据存储在不同的地方——硬盘、内存、处理器缓存——每一个都有其独特的功能以及优势和劣势。硬盘是最大的数据存储设备。即使是我 13 英寸的笔记本电脑，硬盘也能容纳
    1TB 的数据。但与其他数据存储设备相比，它在访问、写入和擦除数据方面也是最慢、效率最低的。


    另一方面，`RAM`（随机存取存储器）则小得多，但更快、更灵活。由于其强大功能和有限的容量，应用程序不断争夺对其的访问权，内存管理是优化任何应用或算法性能的关键要素。


    更小、更强大的是处理器上的缓存。这是动作发生的地方。但它受到处理器本身能力的严格限制。这是因为，如果你不能*利用*数据做点什么，数据存储就毫无意义。计算机的数据处理能力最终决定了我们能用数据做什么。


    这个硬盘、内存、缓存、处理器的模型，是类比人类认知系统的一个有用模型。当然，这是一个过度简化，但这是一个有用的起点，特别是如果我们想知道大脑如何与（大）数据交互的话。


    在许多方面，大脑就是一个大硬盘。毕竟，我们把计算机的数据存储称为“内存”是有原因的。大脑和硬盘都以微小的、按层级组织的信息单元存储信息，这些单元通过电信号被激活、传输和复制。一些认知科学家甚至用“比特”这个术语来描述我们大脑处理的信息。^(³⁵)


    但是，大脑并没有将大容量/慢速存储、快速/高效存储和数据处理分成不同的器官，而是全部在一个极其复杂且灵活的器官中完成。然而，大脑的能力*确实*与计算机的工作方式类似地进行了划分。（嗯，严格来说，是*计算机*像*大脑*一样工作。）大脑存储能力中最大的一部分效率较低，且“处理器”无法直接访问。这通常被称为*长期记忆*（`LTM`）——我们在这里存储生活事件的记忆（*情景记忆*）、身体技能和流程（*程序性记忆*），以及重要信息，如朋友的身份或词语的含义（*语义记忆*）。^(³⁶)
    它的容量巨大。每个人类大脑都包含整个宇宙（恒星、行星和星系）的信息复杂性。^(³⁷) 但我们无法同时访问所有信息。这对大脑来说太多了。我们需要一些东西来帮助我们管理所有这些数据。


    ## 意识注意力的局限性


    这就是工作记忆的作用。工作记忆是科学家所谓的“中央执行系统”（大脑的`CPU`）和几个用于短期、高效存储的独立资源（通常称为*短期记忆*，`STM`——大脑的`RAM`）的组合。^(³⁸)


    这样想吧。曾经形成的每一个记忆——你经历过的每一件事、你知道的每一个词、每一位朋友和家人、你掌握的每一项技能——都存储在你的长期记忆（`LTM`）中的某个地方。由于访问这些记忆需要消耗能量（以电信号的形式），所以只有一部分记忆被“激活”，就像启动并准备使用的应用程序，或者从书架上取下准备阅读的书籍。这就是短期记忆（`STM`）。当一个事物被激活并放入`STM`后，它只会停留很短的时间。除非我们额外努力让它保持活跃。（认知音乐学家称这种努力为“复述”，但这实际上很像在图书馆的书到期前续借。）当记忆处于`STM`中时，我们可以对它们做更多的事情——排序、建立它们之间的联系，并构建更高级别的分组（称为*图式*）。但是，只有一部分我们调入`STM`的内容会形成意识觉知——即*此刻*正在被处理的少量信息。这些信息构成了我们*注意力*的焦点。'
- fmt: '### The Triggers of Attention


    Attention is incredibly expensive. Such a high level of neural activation, not
    to mention the processing that goes on, requires large amounts of energy. That
    energy comes at a premium. And so the brain keeps all but a tiny window of time
    and data at a lower state of activation, away from the costly power of consciousness.


    Of course, such an efficient and orderly system requires structure—rules that
    decide what we pay attention to, and when. When it comes to external stimuli—sights,
    sounds, smells—there are many rules of prioritization based on millennia of natural
    selection.


    As we’ve already discussed, our genetic code was largely written by our ancient
    ancestors as they fought for survival.^([^(39)](#fn39)) Thus, things that meant
    life or death on the savannah 150,000 years ago are more likely to command our
    attention today. If someone sneaks up behind you and makes a loud, sudden noise,
    you’ll jump, suck in extra oxygen (gasp), your hair will stand on end (the vestige
    of our ancestors making themselves look bigger and fiercer than they are), and
    your heart will speed up (preparing to deliver that extra oxygen to your muscles,
    whether they need it for fight or for flight). Perhaps surprisingly, if they sneak
    up on you again, but this time they tell you first, some of those reflexes will
    still kick in, *even though you knew it was coming*. Some of our ancestors survived
    because these reflexes were so fast and reliable that the brain could never turn
    them off. (In fact, some of these reflexes, called “spinal reflexes,”^([^(40)](#fn40))
    are directed by the spinal cord, because the speed-of-light trip of our nerve
    impulses all the way to the brain and back simply takes too long!) And those ancestors
    who survived passed their saber-tooth-tiger-evading genes onto us.


    Other memories—those less critical to our ancestors’ survival—can be recalled
    on purpose. Who is that? What’s their phone number? I came into this room for
    something, what was it?


    Still others feel more natural, more automatic. We may have to actively recall
    our new colleague’s name on their second day of work, but it doesn’t take any
    work at all to remember our spouse’s, partner’s, or child’s name. That’s because
    inside our “big data” brain lies the world’s most advanced predictive analytics
    engine. Data we access often remains more “activated” than data seldom accessed,
    like the spices that always end up in the front and center of the cabinet, despite
    our attempts to alphabetize. Memories that are related to other memories we’ve
    already brought to a higher state of activation will likewise raise in activation.
    This is why we might not remember that password or that phone number out of the
    blue, but when we sit at the keyboard or pick up the phone, it just comes to us.
    Cognitive scientists call this *priming*.


    `Priming` is an essential part of how our brain manages our memories. It anticipates
    our needs, delivers what we need in time to respond quickly (just in case), and
    it does so while keeping energy usage low. But because `priming` is such a key
    element of how we manage our own attention, it can also be used by others, in
    combination with hard-wired evolutionary rules for processing stimuli, to command
    our attention and to control, at least in part, the way we think about the world.


    ### Familiarity Breeds Believability: The Role of Unconscious Memory


    We are constantly evaluating everything we perceive. Is it safe or dangerous?
    Is it good or bad? Is it exciting or boring? Did we expect it, or was it a surprise?
    These evaluations feed into what we experience as emotions. When something is
    surprising and dangerous, the result is fear. If that surprising and dangerous
    perception holds our attention for a long time, the result is terror. If, on the
    other hand, that surprising thing turns out to be not very dangerous at all, the
    result might be laughter—or as cognitive scientist David Huron calls it, “pleasurable
    panting” (what you do with all that oxygen your immediate fear responses sucked
    in).^([^(41)](#fn41)) If something is predictable and harmless, the result might
    be boredom, especially if that something keeps going on for a long time (think
    of a concert or a lecture you found uninteresting, but had no way to escape).
    On the other hand, if something is difficult to predict, but also harmless, the
    result can be disorientation, and if it goes on for a long time, frustration.^([^(42)](#fn42))
    This is the core of the creepy-crawly feeling some people get when listening to
    avant-garde music, or the repulsion they feel when they experience other avant-garde
    art forms. It’s just music, or a painting, or a sculpture, but the fact that it
    arrests our attention so strongly, for so long, but the brain doesn’t know how
    to make sense of it, that’s a very bad thing, evolutionarily speaking. And it
    makes perfect sense that our ancestors would have evolved an emotional response
    to such situations that would cause them to try and avoid them in the future.


    Emotion can be a very complex thing. Entire books have been written about the
    cognitive science of emotion. But for our purposes in understanding how humans
    interact with online media, we’ll cover just a few key elements. Things that affect
    our ability (or inability) to recognize disinformation, misinformation, and “fake
    news” online, as well as things that promote social polarization. We’ll start
    with something simple, yet powerful: the *mere exposure effect*.


    Because of our evolutionary past, we are always assessing whether something we
    encounter or perceive—a stimulus—is positive or negative. (Scientists call the
    positivity or negativity of a stimulus its *valence*.) Our life-or-death evolutionary
    history means that we make some of these assessments very quickly. These snap
    judgments can save our lives, but if they happen unconsciously in certain social
    settings, they can form the stuff of overgeneralizations, stereotypes, and even
    lead to sexism and racism.


    One factor that contributes to a positive affect when we encounter a stimulus
    is the ease with which our brain can process what it perceives—called *perceptual
    fluency*. If the brain can process, understand, and evaluate the stimulus quickly
    and without difficulty, the result is a positive affect or emotion. This is why,
    for example, notes right next to each other on the piano (and the cochlea) are
    “dissonant” rather than forming a pleasant chord.^([^(43)](#fn43)) Things that
    make it harder for the brain to process—similar colors, sounds, or appearances—make
    it hard to distinguish perceived items and place them into categories, the way
    the brain likes.


    Differences in color, musical pitch, and the like are, for the most part, hard-wired
    differences. We may be able through artistic and musical training to make finer
    judgments than the average person, but not much finer. There are physical limitations
    in our inner ear and on our retina that determine how finely we can develop our
    perceptual abilities.'
