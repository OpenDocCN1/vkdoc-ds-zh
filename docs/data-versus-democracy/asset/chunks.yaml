  trans: '

    ### 2014 年 8 月 9 日：弗格森发生了什么


    我最初是在推特上得知这个消息的。2014 年，这句话几乎可以指代任何事情。那一年毫无疑问是我在推特上最活跃的一年。我将它用于研究、教学（我甚至*让*我的学生在课堂上发推文，并通过公开的推特聊天采访来访学者），以及与全球其他研究者合作。我办公室有两台电脑显示器，其中一台经常完全用来运行`TweetDeck`，这是我首选的推特客户端。一位学术同行说，我的设置看起来就像在交易股票，因为几列不断更新的推文飞速从屏幕上滚过。


    但这一次，我指的是弗格森。8 月 9 日迈克尔·布朗被枪杀，警察将他的遗体留在街上数小时，以及随后几天的悼念活动和守夜仪式。


    我最初是在推特上得知此事，当时我的一位住在圣路易斯的大学朋友正在参加其中一场守夜活动，哀悼者离开教堂后，迎接他们的是身着防暴装备的警察。我最初是在推特上得知，警察设立了新闻禁区，禁止记者行使第一修正案赋予的观察和报道抗议活动及警方回应的权利。^(⁸⁰)
    我最初是在推特上得知，记者韦斯利·洛厄里和瑞安·赖利在一家麦当劳给手机充电时被捕。^(⁸¹) 我最初是在推特上得知，警察向人群发射催泪瓦斯，人群中包括婴儿和幼儿。我最初是在推特上得知，警察使用了远程声学设备（LRAD），这种心理武器会让人群迷失方向，并可能导致永久性听力损伤。我最初是在推特上得知，国际特赦组织已向弗格森派遣观察员，以观察和记录警方可能侵犯人权的行为。^(⁸²)


    连续好几天，我都是最先在推特上得知这一切。事实上，至少有三天，我*只*在推特上得知这些消息。（还有 Vice News 的直播流——我也是在推特上得知的）。我记得看到一些特别令人不安的事件发生时，我问我的妻子——她从没有过推特账号——*你能相信弗格森正在发生什么吗？！*
    她回答说，大意是：*弗格森是什么？*


    当时，我用推特，她用脸书，而且我们家里没有电视。我们在社交媒体或主流新闻网站上获取新闻。而我的推特信息流被弗格森刷屏，她的脸书信息流（和许多美国人一样）却被冰桶挑战和朋友们孩子的可爱照片占据。而且至少在两天里，主流媒体似乎也还没听说弗格森。


    弗格森事件不仅尖锐地暴露了警察暴力、警察军事化和种族不公的弊端，也尖锐地暴露了主流媒体与社交媒体之间的差异，以及由算法驱动的社交平台（如脸书）与仍然按时间倒序排列的推特信息流之间的区别。虽然三者——主流媒体、算法社交媒体和按时间倒序的社交媒体——都能让某些人获得更多信息和/或更大的受众，但每种平台都偏向不同的声音和不同的信息，并且每种平台都利于不同形式的群体组织。


    ### 一场运动在“无领袖”活动家于推特上组织时浮现


    当我在远处观察弗格森事件的发展时，我实时看到了组织结构的涌现。起初，几乎谈不上有什么组织。亲身在场的人和不在场的人都在分享信息——有些是真的，有些后来被辟谣。这些内容大多带有`#ferguson`话题标签，我在`TweetDeck`上单独开了一列来追踪它（旁边一列是我认为报道可信的记者的推文）。我早期观察到的内容很原始——信息、情绪、去中心化，没有统一的社区声音。


    然而，当地社区有需求，这些需求塑造了他们的对话，对话开始呈现出结构。当警察设置路障时，抗议者互相通报警察的位置和他们自己的位置，以便他们能够避免被捕、逃离催泪瓦斯，或组成更大的面对面群体互相支持。当警察拿出催泪瓦斯、LRAD
    或开始发射橡皮子弹时，抗议者互相分享这些信息。有些人将此视为避开该区域的信号，而另一些人则视为带着相机涌入、记录大多数媒体没有报道的事件的信号。当人们需要医疗救助而救护车无法穿过警戒线或抗议人群时，他们利用推特向可能提供帮助的人传递消息。当然，有经验的抗议者分享了应对警察新战术的建议——在哪里可以找到防毒面具，如何自制防毒面具，为什么应该用牛奶而不是水冲洗眼睛，在哪里可以买到耳塞等等。


    推特给了每个参与者一个平台，而`#ferguson`话题标签给了这些参与者听众。推特还允许人们从远处“参与”——表达声援、联系中西部其他城市的组织、提供专家战术建议。但随着骚乱消息的传播，推特也允许人们进行干扰，无论是当地还是远距离的干扰。许多在*谈论*弗格森的人和那些试图在*弗格森当地*组织的人使用了相同的话题标签。并非所有谈论弗格森的人都在帮忙，也并非每条被转发的信息都值得传播。


    但这个话题标签不仅给了个人一个广播平台，它还给了人们一种相互找到彼此的方式——一个“被黑掉的公共空间”^(⁸³)，它像一个数字社区中心一样运作。这导致了真实的个人联系和对话——一种建立社区的方式，也是一种筛查煽动者的方式。很快，出现了一些声音，他们（1）确证在场，（2）可靠，（3）容易联系，并且（4）有广泛的传播力。当话题标签变得嘈杂，或社区中每个人都没有时间核实每一条事实主张时，这些声音就成为了可以信赖的领导者。他们不仅是了解并发布最佳信息的人，也是可靠的传播渠道——可以在分享信息时@他们，以便他们能将有用且紧迫的信息传播给社区。


    其中一位涌现出来的领导者甚至不是来自圣路易斯。来自明尼苏达州的一位中学管理员德雷·麦凯森，^(⁸⁴) 在网上听说了抗议活动，并很快亲自南下支持这场运动，主要是在周末。凭借他对抗议和推特的专业知识，他迅速成为了这场运动中涌现的领导者之一。也成为警察的目标。在接受《大西洋月刊》采访时，他谈到了弗格森抗议领导层涌现的性质：

    '
- fmt: '> Ferguson exists in a tradition of protest. But what is different about Ferguson,
    or what is important about Ferguson, is that the movement began with regular people.
    … There are structures that have formed as a result of protest, that are really
    powerful. It is just that you did not need those structures to begin protest.
    … `Twitter` allowed that to happen.^([^(85)](#fn85))


    `McKesson` doesn’t go into specifics in this interview about what most of those
    structures are. But we’ve already noted several of them. First, as `McKesson`
    does stress in that interview, a movement can begin with anyone. Social media
    gives everyone a voice, and if it’s heard by the right core group of people, it
    can rapidly be amplified to a national or international audience. The leadership
    of the movement is also emergent. It may end up being people with deep local roots—like
    St. Louis alderman, `Antonio French`, who was a major voice on `Twitter` and who
    was arrested for alleged unlawful assembly^([^(86)](#fn86))—it may be people who
    come to Ferguson from elsewhere to join in and take up the charge—like `McKesson`—or
    it may be people who are already speaking to a national audience about racial
    injustice at the hands of the police—like `Alicia Barza`, the founder of `#blacklivesmatter`,
    a movement that predated Ferguson but which rose to much greater public visibility
    as a result of Ferguson.^([^(87)](#fn87))


    Perhaps most importantly, the structure of the movement was agile and responsive
    to the needs of the moment. The leaders and the communicative strategies that
    emerged were the result of specific needs in the face of unanticipated circumstances.
    The combination of hashtags and `@`-mentions, the bifurcation of public tweets
    and direct private messages, the use of text and embedded `Vine` videos and livestreams,
    even the sharing and charging of phones—all of these specific practices that emerged
    were born of the needs of the moment, in conjunction with the affordances and
    limitations of the technology. To many outside the movement—or simply lacking
    in `Twitter` literacy—it likely seemed chaotic and “unplanned,” but given the
    community’s fluency with the tools, it allowed them a flexibility they would not
    have otherwise had. In fact, without `Twitter` and `Vine`, it’s likely there would
    not have been a movement to speak of. Or, in the words of `McKesson`, “Missouri
    would have convinced you that we did not exist if it were not for social media.”^([^(88)](#fn88))


    ### Who Decides What Stories Get Told?


    For all of `Twitter`’s ability to facilitate both community organizing and the
    proliferation of the message, its overall user base is still fairly small. According
    to `Pew Research`, less than one-fourth of American adults used `Twitter` in 2014.^([^(89)](#fn89))
    And given the racial tinge to the unrest and the high degree of social media segregation
    in the United States,^([^(90)](#fn90)) it’s no surprise that it took so much time
    for the news to hit the mainstream. In fact, there were over 1 million tweets
    with the `#ferguson` hashtag before the first mainstream news story about the
    unrest.^([^(91)](#fn91)) It didn’t help that Ferguson police were actively working
    to control and contain the story, relegating (most) journalists to a “press pen”
    where they were kept far from the physical confrontations and fed police press
    releases, arresting journalists from *The Washington Post* and *The Huffington
    Post* while they filmed police activity, and even firing rubber bullets at a camera
    crew from `Al Jazeera`.^([^(92)](#fn92))


    But ultimately, the mainstream media did hear the story—and not just the police’s
    story, but the protester’s story as well. The FBI heard the story, too, and investigated
    (and later censured) the Ferguson Police Department for their actions. Amnesty
    International sent observers who also called out human rights violations perpetrated
    against the protesters.


    But what if the story hadn’t broken through? What if it had stayed in Ferguson?


    It wasn’t just the national mainstream media that wasn’t covering Ferguson from
    the start. Facebook was eerily silent, too. As discussed earlier, while `Twitter`’s
    reverse-chronological-order feed was dominated by `#ferguson` for many Americans,
    `Facebook`’s algorithmic feed was not, sometimes even for the same people.^([^(93)](#fn93))
    Algorithms make “decisions,” and what they decide impacts what we see.^([^(94)](#fn94))
    For whatever reason, `Facebook`’s algorithm in 2014 “decided” that the `Ice Bucket
    Challenge` was a more appropriate content topic to deliver to most of its users
    than the Ferguson unrest. It was only on `Twitter`, where a tweet or a retweet
    immediately put that content at the very top of every follower’s feed, that the
    story had an opportunity to take off. This not only increased the likelihood of
    those messages being seen (relative to an algorithm that deemphasized them), it
    also made the platform useful for organizing, which ensured that the tweets (and
    retweets) from the heart of Ferguson kept coming.


    `Twitter` doesn’t work that way anymore. Not long after Ferguson, `Twitter` introduced
    “While you were away”—an algorithmic interjection into an otherwise reverse-chronological-order
    timeline.^([^(95)](#fn95)) And in 2018, `Twitter` made an algorithmic timeline
    the default. Though they gave users the option to switch to a reverse chronology
    of the accounts they follow, the apps frequently return to the algorithmic default.


    The reason for the algorithm is simple. The algorithm increases engagement and
    makes the service easy for new users to catch on to.^([^(96)](#fn96)) Both of
    those things increase advertising income and help `Twitter` make a profit. But
    that raises an important question: What happens to the next Ferguson? Will we
    hear about it? Or did we already miss it?


    In the end, `Twitter` was a net positive for the people of Ferguson and the movement
    that was born hybrid—the physical and the digital each being critical components
    of its nature. It facilitated communication and coordination, as well as the spread
    of a message far wider than would have been possible even five years earlier.


    As good as that was for `#ferguson` and `#blacklivesmatter`, it wasn’t good for
    everyone.'
  raw: '> Ferguson exists in a tradition of protest. But what is different about Ferguson,
    or what is important about Ferguson, is that the movement began with regular people.
    … There are structures that have formed as a result of protest, that are really
    powerful. It is just that you did not need those structures to begin protest.
    … Twitter allowed that to happen.^([^(85)](#fn85))


    McKesson doesn’t go into specifics in this interview about what most of those
    structures are. But we’ve already noted several of them. First, as McKesson does
    stress in that interview, a movement can begin with anyone. Social media gives
    everyone a voice, and if it’s heard by the right core group of people, it can
    rapidly be amplified to a national or international audience. The leadership of
    the movement is also emergent. It may end up being people with deep local roots—like
    St. Louis alderman, Antonio French, who was a major voice on Twitter and who was
    arrested for alleged unlawful assembly^([^(86)](#fn86))—it may be people who come
    to Ferguson from elsewhere to join in and take up the charge—like McKesson—or
    it may be people who are already speaking to a national audience about racial
    injustice at the hands of the police—like Alicia Barza, the founder of #blacklivesmatter,
    a movement that predated Ferguson but which rose to much greater public visibility
    as a result of Ferguson.^([^(87)](#fn87))


    Perhaps most importantly, the structure of the movement was agile and responsive
    to the needs of the moment. The leaders and the communicative strategies that
    emerged were the result of specific needs in the face of unanticipated circumstances.
    The combination of hashtags and @-mentions, the bifurcation of public tweets and
    direct private messages, the use of text and embedded Vine videos and livestreams,
    even the sharing and charging of phones—all of these specific practices that emerged
    were born of the needs of the moment, in conjunction with the affordances and
    limitations of the technology. To many outside the movement—or simply lacking
    in Twitter literacy—it likely seemed chaotic and “unplanned,” but given the community’s
    fluency with the tools, it allowed them a flexibility they would not have otherwise
    had. In fact, without Twitter and Vine, it’s likely there would not have been
