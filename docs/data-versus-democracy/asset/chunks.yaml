    # Part II Case Studies


    # 4. Domestic Disturbance


    Ferguson, GamerGate, and the Rise of the American Alt-Right


    For two whole days after the shooting of Michael Brown, major protests and rallies
    were taking place in Ferguson, Missouri, with hardly a mention in the mainstream
    news media, or even on Facebook. Yet a major portion of the country knew about
    the protests, the major influencers, and the emerging movement known as Black
    Lives Matter. Through Twitter, protesters were able to coordinate their activities,
    avoid tear gas and LRADs (long-range acoustic devices), even get phone charging
    battery packs to movement leaders. That activity on Twitter (and Vine) brought
    the events directly to the public eye and eventually to American mainstream news
    media. This watershed movement made many aware of the limitations of mass news
    media and the power of participatory media to shape conversations and effect social
    change. But those haven’t been the only effects.


    Almost simultaneously with the Ferguson unrest, a group of online “trolls” (harassers,
    abusers, and other kinds of bad actors, typically operating in the open) emerged
    to fight a culture war against “social justice warriors” they saw as threats to
    their world of online gaming communities. A number of game designers and critics—three
    women in particular—found themselves the victims of disinformation, coordinated
    online harassment, and credible threats on their safety and that of their friends
    and family. Social platforms and law enforcement were slow and ineffective in
    their responses, and many lives were drastically changed by these attacks. For
    many, GamerGate was the pivotal event that made the dark powers of social media—including
    Twitter “bots” (automated accounts) and “sockpuppets” (fake accounts, managed
    by anonymous humans in real time)—apparent to a larger population. But those dark
    powers weren’t finished…


    In this chapter, we’ll explore how some of the same affordances of social media
    can be used to grow movements on all sides of the political spectrum—movements
    meant to build up and movements meant to tear down. Movements that would change
    the American political landscape drastically, and likely for the long haul.


    ## Crowd Control: How the Tweets of Ferguson Steered Mainstream Media and Public
    Awareness


    When announcing that there would be no indictment of Darren Wilson after the shooting
    of Michael Brown, St. Louis prosecutor Bob McCulloch stated:


    > The most significant challenge encountered in this investigation has been the
    24-hour news cycle and its insatiable appetite for something, for anything to
    talk about. Following closely behind with the non-stop rumors on social media.^([^(75)](#fn75))


    Protest leader DeRay McKesson responded on Twitter:


    > McCulloch takes another dig at social media. But were it not for Twitter, he
    would’ve convinced the world that we didn’t exist. #Ferguson^([^(76)](#fn76))


    Social and independent media have become cornerstones of (anti-)social activist
    movements in the twenty-first century. Arab Spring, Ferguson, #GamerGate, #BlackLivesMatter,
    #BlueLivesMatter, #MeToo—all have relied on social media to accomplish their purposes.
    This was seen clearly in Ferguson, where emergent activist leaders DeRay McKesson
    (`@deray`), Johnetta Elzie (`@Nettaaaaaaaa`), and Tef Poe (`@tefpoe`) used Twitter
    to organize protests around St. Louis and to warn activists of police presence
    and activity. At the same time, protesters used Twitter, Instagram, and Vine to
    document alleged police brutality and to “cover” events outside the police-imposed
    press pen. And many of the journalists victimized by the police^([^(77)](#fn77))
    or brave enough to embed themselves with the protesters (outside said press pen)
    used Twitter, Vine, and live-streamed video to get news out in real time.


    The decentralized nature of these social media platforms empowers groups and individuals
    to get messages out fast, bypassing mainstream media outlets. They also allow
    for, perhaps even require, a different kind of activist leadership. In Ferguson,
    this led to criticism from figures like Oprah Winfrey calling for more leadership
    from the movement^([^(78)](#fn78))—in other words, a centralized voice. But as
    activist responses made clear (on Twitter, of course), the movement does have
    leadership—only leadership of a different kind.


    Shaun King’s response to Oprah was telling:


    > I love `@Oprah`. Was an Oprah Scholar `@Morehouse`. Her quote suggests 1 thing...
    All she learned about Ferguson came from the nightly news.^([^(79)](#fn79))


    The accusation was not that Oprah was wrong but that Oprah had the wrong information.
    That she doesn’t understand the media being used by the movement and the difference
    in how the movement organizes around those media.


    Oprah was not alone. Though Ferguson was primarily an in-person protest, its reach,
    longevity, and impact were in large part facilitated by social media, in particular
    Twitter and Vine. Understanding how Ferguson played out, and the impact it had
    on the rising #BlackLivesMatter movement, requires understanding the social media
    landscape and how it was used by activists to coordinate action, spread their
    message, and steer the narrative.'
