  trans: '

    同样重要的是要注意，`IRA`（互联网研究机构）总的来说并没有运营一个被称为 `botnet`（僵尸网络）的自动化账户网络。`IRA` 的员工需要完成每日的原创帖子、评论、分享和点赞配额。这些主要是由人工操作的账户，试图“将宣传无缝地编织进看似普通人的非政治性闲聊之中。”^(¹⁷⁰)
    因此，他们的员工班次与美国时区保持一致（参见之前讨论过的`DoJ`（美国司法部）起诉书），并有一套奖金和罚款制度，鼓励各个“专员”制作高参与度的内容。^(¹⁷¹)
    为了显得更像真正的美国人，`IRA`的“专员”们会参与标签游戏^(¹⁷²)，并发布大量非政治性内容。


    `Project Lakhta`（拉克塔项目）远不止是将支持特朗普和反对克林顿的信息抛入网络空间以期触及受众那么简单。事实上，与选举相关的帖子仅占`IRA`
    Facebook 内容的 7%、Instagram 内容的 18%和 Twitter 内容的 6%。^(¹⁷³) 相反，`IRA`创建了我与同事们所称的“媒体幻象”——一个虚假的、相互关联的多平台媒体环境，用欺骗性和操纵性的信息针对多个不同的社群。^(¹⁷⁴)
    这种“幻象”包含了相当一部分非政治内容，而在涉及政治的内容中，它通常聚焦于当前引发分歧的社会议题，这些议题会激发（或削弱）不同社群成员的热情，而非针对具体的候选人。这种幻象针对三大类社群——右倾美国人、左倾美国人和非裔美国人——以及更精准定位的子社群，如支持分裂的得克萨斯人、民主社会主义者、福音派基督徒等。并且，这种幻象用真实新闻、假新闻、不真诚的对话，以及——可能最重要的——表情包战争来针对他们。


    在针对美国社群方面，`IRA`无论是在线上还是线下在美国本土都做足了功课。（并且，就像任何一家数字营销公司一样，他们根据用户参与数据不断调整信息内容。）在许多情况下，他们用为该社群量身定制的特定信息来针对他们，这当然符合克里姆林宫的议程。例如，他们针对右翼美国人，用能激励他们出来投票反对民主党或温和派候选人的叙事——关于移民和持枪权的恐吓性叙事、鼓舞人心的基督教主题叙事，以及关于克林顿涉嫌腐败的警告。他们针对左倾美国人，用会削弱他们热情的叙事，使他们对克林顿的支持变得不冷不热，或鼓励他们投给第三方或进行抗议性投票——叙事涉及克林顿涉嫌腐败、`DNC`（民主党全国委员会）不民主的初选过程剥夺了伯尼·桑德斯的公平机会，以及将克林顿标榜为糟糕女权主义者的女权主义和交叉性叙事。他们还针对非裔美国人，用更尖锐的、旨在总体上使他们远离民主进程的关于警察暴行或两党种族主义倾向的选民压制叙事。最终目标是鼓励人们投票给特朗普，如果无法让左派转而投票给特朗普，则降低民主党选民以及倾向于投票给民主党的人口群体的投票率。他们主要通过一般性的社会和政治叙事来实现这一目标，而非通过具体提及候选人的帖子。


    然而请注意，这些叙事大多是关于不信任和恐惧——而非碰巧与俄罗斯目标一致的、积极的美国美德。是的，存在一些高参与度的爱国账号和亲基督教账号，但总体而言，即使是这些账号，其目的也是创造一个“自己人/外人”的框架，该框架可以在其他情境中，利用关于对外来者的恐惧或愤怒的叙事来运作。例如，许多亲基督教的账号会将选举框定为耶稣与一个被表情包化的、恶魔般的希拉里·克林顿形象之间的精神之战。^(¹⁷⁵)
    爱国账号会为反移民、反穆斯林、反 LGBTQ、或反任何可能被解读为违背“传统”美国价值观的内容奠定基础。这种负面性是次要目标的一部分：在美国社会中制造分裂、不信任和普遍的社会不和谐。无论谁赢得选举，如果美国人更加分裂，更专注于分裂性的国内问题，他们对于北约盟友来说就不是那么好的合作伙伴，对克里姆林宫地缘政治目标的威胁也就更小。


    这个次要目标就是为什么针对美国的`IRA`行动在 2016 年 11 月并未停止的原因。事实上，就在美国政府与公众于 2017 年初开始意识到俄罗斯的影响力行动之后，当
    Twitter 和 Facebook 上开始出现账号封禁时，`IRA`针对美国受众的 Instagram 活动反而增加了。诚然，所有主要平台上的影响力行动仍在继续，但社交媒体公司提供的数据清楚地表明，2017
    年 *Instagram 上的活动* 尤其增加了，特别是那些煽动非裔美国人和反特朗普“抵抗派”社会恐惧的内容。^(¹⁷⁶) 2017 年，`IRA`针对右倾受众，主要发布反克林顿信息，巩固对特朗普的支持，并散布关于平台审查保守派（随着俄罗斯账号开始被封禁）的叙事；针对左倾受众，他们散布反选举人团叙事，煽动对选举过程的不满；他们针对所有人散布反罗伯特·穆勒的叙事，试图抹黑对俄罗斯干预选举及其可能与特朗普竞选团队勾结的调查。


    ### 接下来怎么办？


    正如我们在参议院报告中所总结的，“在可预见的未来，美国似乎很可能会继续面临俄罗斯的干涉。”^(¹⁷⁷) 在 2016 年大选的余波中，许多`IRA`最优秀的对美行动资产已被清除，许多关键领导层和空壳公司已被起诉。这使得他们在美国进行高影响力行动变得更加困难，但并非不可能。我和同事们持续在社交媒体上观察到疑似俄罗斯的宣传，包括针对
    2018 年美国中期选举的内容。^(¹⁷⁸) 目前尚不清楚他们在多大程度上可能已经奏效，但他们并未消失。除了在线宣传，我们还知道，克莱尔·麦卡斯基尔（未成功）竞选连任美国参议员的行动遭到了黑客攻击，这很可能是由`GRU`（俄罗斯军事情报机构）所为。^(¹⁷⁹)
    俄罗斯国有、英语的大众媒体，如`RT`（今日俄罗斯）和`Sputnik`（卫星通讯社），以及数百个与克里姆林宫有关联或结盟的博客和“期刊”在英文网络上泛滥。我们还知道，俄罗斯的地缘政治盟友伊朗已被确认为某些在线虚假信息行动的来源，迄今为止，这些行动受到研究人员的直接审查比俄罗斯的行动要少。我们甚至还没有讨论俄罗斯涉嫌参与
    2016 年英国脱欧公投，或 2017 年针对埃马纽埃尔·马克龙法国总统竞选活动的“黑料-泄露”行动。


    至少就目前而言，这就是新常态。

    '
- fmt: '# Summary


    In this chapter, we took a detailed look at Russian disinformation operations
    on social media throughout the old battlefield of the Cold War. Multiplatform
    influence operations in Ukraine preceded and supported military operations in
    Crimea and eastern Ukraine. Fearmongering narratives on television and online
    sought to discourage cooperation between Sweden (and Finland) and their NATO friends
    that might threaten the Russian energy industry. And operations from Russian military
    intelligence (the GRU) and a Russian contractor (the IRA) sought to destabilize
    and discredit the U.S. democratic process in 2016 and elect Donald Trump as president
    of the United States.


    These operations preyed upon some of the West’s greatest virtues: freedom of speech,
    freedom of the press, openness, and technological advances. But they also preyed
    upon fundamental human weaknesses: cognitive limits that make it difficult to
    sort fact from fiction online, tribalism, and fear of the “other.” These weaknesses,
    combined with the reality that social evolution and legislation will always trail
    behind technical innovation, mean that we’re likely going to be dealing with the
    problem of online disinformation for a long time to come.


    But this isn’t just a problem for NATO countries and the former Soviet republics.
    This is a global problem, as both foreign and domestic groups seek to use online
    media to manipulate others, to their own advantage. And in countries where not
    only is the technology new, but *democracy* is new, online disinformation poses
    an even greater threat to free speech and the free flow of information, both of
    which are vital for a democracy to thrive.


    That’s the subject of the next chapter.


