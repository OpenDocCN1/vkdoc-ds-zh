- fmt: '# But What Can I Do?


    It’s clear that disinformation is a large-scale problem that requires large-scale
    solutions. Platforms, governments, and researchers must all do their part to address
    this rapidly evolving problem collaboratively. But is there anything that individuals
    can do?


    We’ve already addressed a few ways that individuals can alter the inputs that
    big data algorithms use to determine the content that we see on our favorite platforms.
    Mindfulness about what we consume, what we engage, what we share, and what we
    create is absolutely essential, both to fight “fake news” and to fight the amplification
    of social bias and polarizing messaging.


    Similarly, we can limit the data about us that individual algorithms have access
    to. Consuming some content offline, registering for different services with different
    email addresses, using different browsers for different services, even paying
    cash and avoiding buyer rewards programs can keep our personal data in different,
    smaller piles rather than one big one that many platforms can access. The result
    may be less relevant ads (is that really a problem?!), but also less effective
    hyper-targeting with messages designed to manipulate.


    But ultimately, some networked activism and collective political action will be
    necessary. Elected leaders, regulators, and platform executives need to be involved
    in solving the propaganda problem, and to do that they need to be motivated—electorally,
    legally, financially. But for that to work, we don’t just need governments and
    corporations working together, all of us need to work together.


    Democracy depends on the free flow of information, both to inform and to afford
    all of us the chance to deliberate and persuade each other. If we can’t trust
    the integrity of the information we consume, we can’t trust the democratic process.


    I opened Chapter [6](#469027_1_En_6_Chapter.xhtml) with a quote from Zeynep Tufekci
    that bears repeating. “Technologies alter our ability to preserve and circulate
    ideas and stories, the ways in which we connect and converse, the people with
    whom we can interact, the things that we can see, and the structures of power
    that oversee the means of contact.”^([^(225)](#fn225)) *Technologies alter the
    structures of power*. That’s not necessarily a bad thing (remember Ferguson),
    nor is it necessarily a good thing (remember GamerGate), but it’s absolutely not
    a neutral thing. It’s up to us to invent, implement, and rein in technologies
    in ways that bring our vision of what the world could be to fruition.


    Too often we are passive, going with the flow, letting the affordances of the
    technology—and its manipulation by more motivated, and often less ethical, actors—determine
    the future we are building. If we want to make a positive mark on the universe,
    we need mindfulness, deliberateness, and collaboration, as we step into the next
    chapter of our history. The problem likely won’t go away anytime soon. But that
    shouldn’t stop us from working to minimize its effects and harness the power of
    new technologies for good.


