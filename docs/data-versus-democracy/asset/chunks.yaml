- fmt: '从这样的角度来思考：在很多方面，内容推荐引擎就像一个约会应用，只不过它匹配的是人与内容，而不是人与人。只有在约会应用的情况下，才有可能在开始匹配前要求用户提供最少量的数据，从而确保可以根据完整的个人资料来过滤和排序匹配对象。^(60)
    用于为医学院毕业生分配实习医院的算法也是如此。^(61) 但在搜索引擎、社交网络、甚至是“个性化”教育应用的情况下，算法需要过滤和排序用户从未接触过的内容。解决方案是通过一个称为*协同过滤*的过程，将用户的数据与其他用户的数据结合起来。


    要理解协同过滤，让我们考虑一个简化的音乐品味画像。假设在任何给定的音乐曲目中，存在或不存在一些音乐特征：失真吉他、三角钢琴、女高音演唱、大调、小调、快节奏、慢节奏、即兴器乐独奏等。其中一些特征是二元的（要么有风笛，要么没有），而其他特征则存在于一个量级上（失真吉他的相对音量、实际的节奏测量以*每分钟节拍数*为单位等）。模型包含的特征越多，它就能做出越精细的预测。但模型包含的特征越多，它进行这些预测所需的数据就越多。并且，用户画像中至少缺失部分数据的可能性也就越大。


    这导致了一个悖论：为了确保良好的用户体验，尤其是在吸引新用户时，应用需要在选择歌曲前尽可能多地收集相关数据。另一方面，为了确保良好的用户体验，应用需要以尽可能短的延迟提供好歌——没有时间进行用户引导。


    为了提供高质量的用户体验，算法需要一种无需完整画像就能做出良好预测的方法。这就是协同过滤的用武之地。


    协同过滤提供了一种通过与其他用户比较来填补用户画像空白的方法。^(62) 其背后的理论是：如果用户 A 和用户 B 在他们都有数据的特征上具有相似的品味，那么在他们中一人缺失数据的特征上，他们也很可能具有相似的品味。换句话说，如果一个朋友和我都喜欢失真吉他、快节奏，并且不喜欢爵士乐，那么我对各种古典音乐特征的品味将用于为该朋友提供音乐推荐，而他们对乡村音乐的品味将用于影响我的音乐推荐。我们不完整但重叠的画像将“协同”地“过滤”彼此的音乐推荐——因此得名。


    随着数百万（或者，在 Facebook 的例子中，是*数十亿*）用户向同一个模型贡献数据，算法理论上可以将所有这些用户聚类成数万或数十万个“协同”组，这些组的画像将合并成一个超级画像。该超级画像可用于为组内所有数百或数千名用户过滤和排序潜在内容，其中每个人都将体验到一种“个性化”体验——一种与他们认识的任何其他人都不同的体验。


    这些聚类可以在不同的细节层面上运作。当我加入 Pandora 并选择预加载的 New Wave 电台作为我的首次收听体验时，它会根据资料库中有 New Wave
    电台的其他用户的品味来推送歌曲。但是，当我给 The Cure、Depeche Mode 和 A Flock of Seagulls 点赞，而又给 The
    Smiths 和大多数 Duran Duran 的歌曲点了踩时，它就开始将我归入一个较小的听众聚类，这类听众更喜欢“Space Age Love Song”而不是“Girls
    on Film”。


    总而言之，当模型能够访问更多数据时——包括更多独特的*观测值*和每个观测值的更多*特征*——它就能做出更好的预测。然而，模型考虑的特征越多，每个用户的画像就越有可能缺失关键特征。因此，一个额外的算法模型会根据用户*已知*特征的相似性将他们聚类，从而创建一个超级画像，该画像将提供数据来填补*未知*特征。然后，预测模型使用这些新近完整的画像来生成内容推荐。这导致了一种“个性化”体验，这种体验在很多方面实际上是一种基于聚类的体验。他们与许多其他用户有相似的体验，只是他们不与那些用户互动，所以他们的体验*感觉*是独特的。


    ## 偏见放大器


    回想一下我们在第 [1](#469027_1_En_1_Chapter.xhtml) 章中进行的图像搜索：*doctor*、*nurse*、*professor*、*teacher*
    等。正如该章所讨论的，算法与使用它的人类之间的反馈循环，会将已经存在的人类偏见放大并传播。通过对协同过滤的工作方式有了更多了解，我们现在可以为那个反馈循环增加一些细微差别。


    图 [3-1](#469027_1_En_3_Chapter.xhtml#Fig1) 展示了反馈循环，人类偏见正是通过这个循环被放大，并通过未经检查的算法内容推送得以传播。当用户执行搜索时，模型会将搜索词以及搜索相关的元数据（地点、时间等）作为输入，同时还包括来自用户画像和活动历史的数据，以及来自平台数据库的其他信息，如内容特征以及其他相似用户的画像和偏好。基于这些数据，模型会根据关于用户最可能参与的内容的预测，交付经过过滤和排序的结果。^(63)


    ![../images/469027_1_En_3_Chapter/469027_1_En_3_Fig1_HTML.png](images/469027_1_En_3_Chapter/469027_1_En_3_Fig1_HTML.png)


    图 3-1. 人类-算法交互的反馈循环


    但这并非整个过程。当我们执行搜索，或者打开 Facebook 或 Twitter 应用时，我们会对这些算法选择的内容进行操作。考虑引言中的图像搜索——*doctor*、*nurse*、*professor*、*teacher*
    等——假设我想创建一个健康相关活动的网页。我在搜索医生和护士的库存图片以包含在宣传册中。当我搜索医生的图片时，搜索结果将根据搜索引擎了解（和猜测）的关于我的信息、它了解（和猜测）的与被认为品味相似的用户的信息、其数据库中的内容，以及它知道的内容和一般参与情况的一般信息进行过滤。正如我们从引言中了解到的，存在于世界上的关于医生是什么样子/应该是什么样子的偏见会影响搜索结果，而这些结果反过来又会影响我们对世界的看法和我们的偏见，这将进一步影响后续的搜索结果，以此类推。


    但是我们可以为这种理解增加一些细微差别。首先，由于协同过滤的过程，我*已经*经历的偏见*以及已经与我相似的人的偏见*，将是那些最强烈地影响我搜索输出结果的偏见。这在
    Dylann Roof 据称搜索“black on white crime”的事件中体现得最为明显。任何可能会对他的仇恨极端主义至少提供一点制约的客观犯罪统计数据，都被这样一个事实所掩盖：来自具有与
    Roof 相似互联网使用模式的用户对“black on white crime”这个特定短语的搜索，可能会从他的搜索结果中过滤掉更客观、更温和的内容。'
  raw: 'Think about it this way. In many respects, a content recommendation engine
    is like a dating app, except instead of matching a person with another person,
    it matches a person with content. Only in the case of a dating app, it’s possible
    to require a minimum amount of data from a user before proceeding, ensuring that
    user matches can be filtered and ranked according to complete profiles.^([^(60)](#fn60))
    The same is true for the algorithms that assign medical school graduates with
    residencies.^([^(61)](#fn61)) But in the case of search engines, social networks,
    and even “personalized” educational apps, the algorithm needs to filter and rank
    content that’s unlike any the user has engaged with before. The solution is to
    join the user’s data with that of other users in a process called *collaborative
    filtering*.


    To understand collaborative filtering, let’s consider a simplistic profile for
    musical taste. Suppose there were a number of musical features that were present
    or absent in any given musical track: distortion guitar, grand piano, operatic
    soprano vocals, major key, minor key, fast tempo, slow tempo, improvised instrumental
    solos, etc. Some of these are binary (either there are bagpipes or there aren’t),
    and others exist on a scale (the relative volume of that distortion guitar, the
    actual tempo measurement in *beats per minute*, etc.). The more features the model
    contains, the more refined predictions it can make. But the more features the
    model contains, the more data it needs to make those predictions. And the more
    likely it is that at least some of that data is missing from a user’s profile.


    This leads to a paradox: to ensure a good user experience, especially when trying
    to hook new users, the app needs to collect as much relevant data as possible
    before choosing the song. On the other hand, to ensure a good user experience,
    the app needs to serve up good songs with as little delay as possible—no time
    for onboarding.


    In order to provide a quality user experience, the algorithm needs a way to make
    good predictions without a complete profile. That’s where collaborative filtering
    comes in.


    Collaborative filtering provides a way to fill in the gaps of a user’s profile
    by comparing them with other users.^([^(62)](#fn62)) The theory behind it is this:
    if user A and user B have similar tastes for the features they both have data
    on, they are likely to have similar tastes for the features where one of them
    is missing data. In other words, if a friend and I both like distortion guitar,
    fast tempos, and dislike jazz, then my tastes about various classical music features
    will be used to make music recommendations for that friend, and their taste about
    country music will be used to inform my music recommendations. Our incomplete
    but overlapping profiles will “collaborate” to “filter” each other’s musical recommendations—hence
    the name.


    With millions (or, in Facebook’s case, *billions*) of users contributing data
    to the same model, the algorithm can theoretically cluster all of those users
    into tens or hundreds of thousands of “collaborative” groups, whose profiles will
    be combined into one super-profile. That super-profile can be used to filter and
    rank potential content for all of those hundreds or thousands of users in the
    group, and each one of them will encounter a “personalized” experience—one that
    is different from anyone else they know.


    The clusters can operate at various levels of detail. When I join Pandora and
    select the preloaded New Wave station as my first listening experience, it serves
    up songs based on the taste of other users with a New Wave station in their library.
    But as I give a thumbs up to The Cure, Depeche Mode, and A Flock of Seagulls and
    a thumbs down to The Smiths and most songs by Duran Duran, it starts to align
    me with a smaller cluster of listeners who prefer “Space Age Love Song” to “Girls
    on Film.”


    To summarize, models make better predictions when they have access to more data—both
    more unique *observations* and more *features* for each observation. However,
    the more features a model takes into account, the more likely it is that each
    user’s profile will be missing critical features. So an additional algorithmic
    model will cluster users together according to their similarity of *known* features,
    so that a super-profile can be created which will provide data to fill in the
    *unknown* features. The predictive model then uses these newly complete profiles
    to generate content recommendations. This leads to a “personalized” experience
    that, in many ways, amounts to a cluster-based experience. They have a similar
    experience to many other users, they simply don’t interact with those other users,
    so their experience *feels* unique.


    ## Bias Amplifier


    Think back to the image searches we performed in Chapter [1](#469027_1_En_1_Chapter.xhtml):
    *doctor*, *nurse*, *professor*, *teacher*, etc. As discussed in that chapter,
    the feedback loop between the algorithm and the humans that use it takes already
    existing human biases and amplifies them. With a bit more understanding of how
    collaborative filtering works, we can now add some nuance to that feedback loop.


    Figure [3-1](#469027_1_En_3_Chapter.xhtml#Fig1) illustrates the feedback loop(s)
    by which human biases are amplified and propagated through unchecked algorithmic
    content delivery. When a user performs a search, the model takes their search
    terms and any metadata around the search (location, timing, etc.) as inputs, along
    with data about the user from their profile and activity history, and other information
    from the platform’s database, like content features and the profiles and preferences
    of other similar users. Based on this data, the model delivers results—filtered
    and ranked content, according to predictions made about what the user is most
    likely to engage with.^([^(63)](#fn63))


    ![../images/469027_1_En_3_Chapter/469027_1_En_3_Fig1_HTML.png](images/469027_1_En_3_Chapter/469027_1_En_3_Fig1_HTML.png)


    Figure 3-1.


    The feedback loop of human-algorithm interaction


    But that’s not the entire process. When we perform a search or we open up our
    Facebook or Twitter app, we do something with that algorithmically selected content.
    Consider the image searches from the Introduction—*doctor*, *nurse*, *professor*,
    *teacher*, etc.—and let’s assume I want to create a web page for a health-related
    event. I search for stock images of doctors and nurses to include in that brochure.
    When I search for an image of a doctor, the search results will be filtered according
    to what the search knows (and guesses) about me, what it knows (and guesses) about
    users assessed to have similar tastes, what content it has in its database, and
    what general information it knows about that content and general engagement with
    it. As we know from the Introduction, the biases about what a doctor does/should
    look like that are present in the world will influence the search results, and
    the results will in turn influence our perception of the world and our biases,
    which will influence further search results, etc.


    But we can add some nuance to that understanding. First, because of the processes
    of collaborative filtering , the biases I already experience *and the biases of
    people already similar to me* are the ones that will most strongly influence the
    output for my search. This is most starkly seen in Dylann Roof’s alleged search
    for “black on white crime.” Any objective crime statistics that might have offered
    at least a small check on his hateful extremism was masked by the fact that searches
    for the specific phrase “black on white crime” from users with similar internet
    usage patterns to Roof’s were likely to filter out the more objective and moderate
    content from his results.'
