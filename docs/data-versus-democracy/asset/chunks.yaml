    # 牛仔机器人与社交媒体虚假信息的斗争


    牛仔机器人的存在时间非常短暂。我们几乎立刻发现了它们，并向`Twitter`举报，而在我们举报后的几小时内——也就是它们上线仅两天后——这些账号就被封禁了。导致封禁的原因是否就是我们的举报，这点不得而知。事实上，自
    2016 年以来，`Twitter`在识别大规模自动化操作和封禁账号方面已经进步了很多，不再依赖用户或研究人员的举报。这显然是一件好事。但我们也发现了数个与牛仔机器人类似的网络，它们为不同的候选人助阵，而其中只有一部分在选举前被平台封禁（如果它们被处理了的话）。同样值得注意的是，在实时发生的事件过程中——比如
    2017 年 8 月的“团结右翼”集会，或 2017 年 4 月的叙利亚化学武器袭击——一个机器人或虚假账号网络能在不到 48 小时内造成巨大破坏，尤其是当它们正在放大由真人或真人操控的非自动化虚假账号所推动的（虚假）叙事时。例如，我们在`Twitter`上发现了另一个反安纳亚网络，它利用自动化手段推广一系列`YouTube`视频，散布已被证伪的关于安纳亚涉嫌腐败的谣言。通过在总统大选最终辩论当晚及次日进行针对性操作，它们得以在公众注意力自然消退之前，不受账号封禁的干扰执行其行动。


    ## 拉丁美洲更隐秘的僵尸网络


    一个更加隐秘且持续时间更长的僵尸网络出现，旨在煽动拉丁美洲及其他地区的反政府情绪，甚至鼓吹暴力。该网络中的账号通常是在行动开始前几天或几周创建的，主要向委内瑞拉、哥伦比亚和尼加拉瓜的目标受众推送反政府信息，并附上`YouTube`及两个新创建网站的链接。


    这些账号的个人资料主题千篇一律，资料中给出的所在地看似虚假（在某些情况下，它们声称居住的城市-国家组合根本就不存在）。尽管这些账号自称是不同国家的不同个体，但它们发布的内容通常完全相同，而且总是节奏快、数量大。除了在委内瑞拉和尼加拉瓜传播反政府信息外，这些账号还积极尝试将哥伦比亚总统候选人古斯塔沃·佩特罗与`FARC`恐怖组织联系起来。`FARC`与哥伦比亚曾处于战争状态，直到
    2016 年签署了一项不得人心的和平协议。佩特罗对和平协议的支持，加上他的左翼政治立场，使他容易被描绘成共产主义者或恐怖分子，这个僵尸网络抓住了这一点。（佩特罗最终在决选中输给了右翼民粹主义者、批评哥伦比亚-`FARC`和平协议的伊万·杜克。）尽管该僵尸网络的大部分帖子是西班牙语，但偶尔也会夹杂一些英语推文，其中包括科技教程以及一个关注美国敏感社会问题的网站的链接。


    偶尔还会出现`Twitter`自动化与分析工具（哎呀）。


    很明显，拉丁美洲这个特定僵尸网络背后的个人或团体正在采取措施隐藏其地理位置。也有迹象表明他们可能并非来自拉丁美洲，例如偶然发布的英语内容，以及将讲同一种语言但居住在不同国家——甚至不同大陆——的目标受众混为一谈，其中还包括针对加泰罗尼亚用户的帖子。这很可能是一场外国影响力行动。但不幸的是——或者说幸运的是？——在我们可以做出高可信度的来源评估之前，该网络已被`Twitter`关闭。


    ## 最大威胁：点对点消息


    然而，拉丁美洲最大的威胁并非`Twitter`，也不是`Facebook`、`Instagram`或`YouTube`，而是点对点消息，主要是 Facebook
    旗下的平台`WhatsApp`。


    `WhatsApp`是一个消息服务，支持通过加密的数据连接进行文本、语音和视频通话，以及文件共享。对一些人来说，它代表了一种比`Facebook`或`Twitter`更私密（且更少被监控）的联系亲友的方式。对另一些人而言，它通过
    Wi-Fi 或数据连接提供语音、视频和文本服务，为他们节省了每月的电话费。无论出于何种原因，`WhatsApp`在世界某些地区越来越受欢迎，尤其是西班牙语世界。在许多`Facebook`使用率正在下降、而`Twitter`从未真正流行的地方，`WhatsApp`上却活跃着数字社区和信息共享。例如，根据哈佛大学尼曼实验室的数据，`WhatsApp`是墨西哥最受欢迎的社交平台。^(²¹⁸)


    `WhatsApp`和其他私密消息应用（如`Signal`、`Facebook Messenger`、`Slack`，甚至老式的短信和电子邮件）给虚假信息研究人员和事实核查员带来了巨大挑战。由于许多使用该应用的用户具有高度的连接性，真假信息都容易在`WhatsApp`上传播，甚至变得病毒式扩散。但由于消息是私密且加密的，没有简单的方法可以查看`WhatsApp`上以及哪些社区中正在流行什么。


    ## 为何私密消息如此难以监管


    正如我们已经探讨过的，心理学家和谣言专家迪方佐和博尔吉亚确定了影响一个人是否相信他们所遇到的言论的四个主要因素：


    -   该言论符合此人已有的态度（确认偏差）。

    -   该言论来自可信的来源（在社交媒体上，这通常指分享它的人，而非言论的真正来源）。

    -   该言论被反复遇到（这有助于形成*知觉流畅性*）。

    -   该言论没有伴随反驳。^(²¹⁹)


    或许应对像`WhatsApp`这类私密聊天应用上的虚假信息和错误信息，最大的障碍在于：我们不知道哪些言论被反复遇到（从而成为病毒式传播），这些言论的来源是什么，它们触及了哪些受众（以及这些受众已经持有何种偏见），因此事实核查员不知道哪些内容需要反驳。由于这些障碍，当我与关注拉丁美洲的研究人员和政策制定者交流时，点对点消息是他们最大的担忧。而且，鉴于反监控的迹象已显而易见，这在那些`Facebook`、`Instagram`和`Twitter`仍占主导地位的国家的研究人员和政策制定者中，也正成为一种日益增长的忧虑。^(²²⁰)


    ## 一线希望：Verificado 2018


    但希望并未完全破灭。2018 年墨西哥选举期间发起的一项倡议证明，在`WhatsApp`等私密通讯应用上揭露和反驳谣言及虚假信息是可能的。这项倡议名为`Verificado
    2018`。


    `Verificado 2018`是`Animal Político`、`Al Jazeera`和`Pop-Up Newsroom`之间的合作项目，并得到了`Facebook
    Journalism Project`和`Google News Initiative`的支持。他们的目标是揭穿与选举相关的虚假言论，并采用符合用户使用这些平台方式的方法。鉴于`WhatsApp`在墨西哥社交媒体格局中的主导地位，`Verificado`将其工作重点放在了那里。


    由于`WhatsApp`是一个点对点平台，其核心是向个人或亲友小群体分享消息，因此`Verificado`采取了小规模、社交化的方式来核查事实。他们设立了一个`WhatsApp`账户，让*个人*可以向他们发送需要核实的信息。`Verificado`的研究人员则会*逐一*回复他们的研究结果。这种个性化的接触方式（可以想象，当收到关于同一言论的多个查询时，其中必然涉及大量复制粘贴工作）对平台而言更为自然，并允许用户像在平台上与其他人互动那样，与`Verificado`进行交流。

    '
- fmt: 'Now, in the face of a coordinated disinformation campaign during the course
    of a massive general election that involved thousands of individual races, `cut-and-paste`
    only scales so far. So Verificado also crafted their debunks in ways that would
    promote widespread sharing, even virality, on `WhatsApp`. Multiple times a day,
    they updated their public status with one of the debunks that was prompted by
    a private message they received. These statuses could then be shared across the
    platform, much like tweets or public Facebook posts. They also created meme-like
    images that contained the false claim along with their `true/false` evaluation
    stamped on it. This promoted user engagement, associated their `true/false` evaluation
    with the original image in users’ minds, and promoted viral sharing more than
    simple text or a link to a web article would (though, they did post longer-form
    debunks on their web site as well).^([^(221)](#fn221))


    For the same reasons that it is difficult to study the reach and impact of misinformation
    and disinformation on `WhatsApp`, it’s difficult to quantify the reach and impact
    of Verificado 2018’s work. But the consensus is that they had a nontrivial, positive
    impact on the information landscape during a complicated, rumor-laden election
    cycle, and they made more progress on the problem of private, viral mis-/disinformation
    than just about anyone else to date. They even won an Online Journalism Award
    for their collaboration.^([^(222)](#fn222))


    Peer-to-peer disinformation isn’t going away. As users are increasingly concerned
    about privacy, surveillance, targeted advertising, and harassment on social media,
    they are often retreating to private digital communication among smaller groups
    of people close to them. For many, the social media honeymoon is over, the days
    of serendipitous global connection gone. Safety, security, and privacy are the
    new watchwords. In some cases, this means less exposure to rumors and psychological
    warfare. In other cases, it simply means those threats are harder to track. This
    is by no means a solved problem, but examples like Verificado 2018 give us hope
    that solutions are possible and that we might already have a few tricks up our
    collective sleeves that can help.


    ## Summary


    In this chapter, we’ve explored recent online disinformation operations in the
    Global South. From Latin America to Northern Africa to Southeast Asia, we have
    seen the way that social media platforms have amplified rumors, mainstreamed hate
    speech, and served as vehicles for psychological warfare operations. In some cases,
    this misinformation and disinformation has fueled not only political movements
    and psychological distress but has also motivated offline physical violence and
    even fanned the flames of ethnic cleansing and genocide.


    The problem of online disinformation is bigger and more diverse than many in the
    West realize. It’s bigger than “fake news,” bigger than Russia and the American
    alt-right, bigger than the Bannons and the Mercers of the world, bigger than Twitter
    bots, and even bigger than social network platforms. As long as there has been
    information, there has been disinformation, and no society on our planet is immune
    from that. This is a global problem, and a human problem, fueled—but not created—by
    technology. As we seek to solve the problem, we’ll need a global, human—and, yes,
    technical—solution.


