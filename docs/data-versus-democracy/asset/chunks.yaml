  trans: '

    ## 排版后文本


    但其他差异则是后天习得的。我们通过反复接触来学习语言、肢体动作、面部表情和技能。由于大脑会通过预激活它预期我们将要用到的记忆部分来节省能量，并且它更可能预期我们经常遇到的事物，而不是很少遇到的事物（更不用说全新的东西了），因此大脑预激活解析*熟悉*事物所需的资源，远比解析*陌生*事物所需的资源要容易得多。结果，大脑处理熟悉事物的速度比处理陌生事物更快、更轻松。最终，由于快速、轻松的处理与积极反应相关联，在其他条件相同的情况下，熟悉的事物往往比陌生事物引发更积极的情感。


    这是有道理的。当一段音乐以我们预期的方式结束时，感觉会很好。没有意外。一切都在它该在的位置。即使我们不懂足够的乐理来解释“应该”发生什么或为什么，情况也是如此。这就是为什么一个整洁的房子或一个打理得很好的花园会让我们感到放松，即便是回到自己家——当一切都“如其本然”时，我们的大脑很容易理解环境，即使这是一个新环境。（记住，漫长的进化史意味着我们总是在搜寻危险！一个整洁的环境，万物各归其位，能让我们更容易掌握外界情况，并让我们得以放心地放松警惕。）


    大量科学研究已经证明了这些原理的作用。在一项特别著名的研究中，研究人员向他们的受试者（对中文一无所知）展示了一系列汉字，并要求他们提供一个他们觉得这个字可能代表的形容词。那些受试者在研究早期已经见过的汉字，往往会被赋予比他们首次见到的汉字更积极的形容词。⁴⁴


    虽然这看起来像是一项足够简单的研究，但先前接触过一个汉字就能导致与该汉字相关的积极情感出现可察觉且统计上显著的增加，这实际上相当引人注目。而且，无论受试者是否认出这个物体，这类现象都会发生！这是因为我们无意识地建立了这种“统计性”意识。


    我一直对音乐认知研究很着迷，它们为这类现象提供了一些最有趣的见解。许多研究旨在测量人类如何内化他们所听到的音乐中的模式。⁴⁵ 从通过追踪婴儿头部或眼睛的移动来测试他们的音乐期望，到要求人们唱出他们认为可能出现的下一个音符，再到让受试者评价某个音符与旋律的“契合度”，以及给受试者钱让他们押注下一个音符是什么，这些研究几乎从各个角度探讨了这个问题。但它们普遍得出相同的结论：人类非常擅长通过反复接触来学习模式，并根据我们学到的模式做出预测和判断，即使我们无法解释这些判断背后的原因。


    一项研究⁴⁶让西方音乐家一次听一个音符来感受一段旋律，但这旋律来自一种对他们来说都不熟悉的风格——巴厘岛*甘美兰*音乐。（如果你以前从未听过或*见过*巴厘岛甘美兰音乐表演，去
    YouTube 上找几个视频看看吧。那真是令人难以置信。）这种音乐不仅遵循着与西方古典音乐、流行音乐、爵士、蓝调、乡村音乐、蓝草音乐等等不同的规则。它基于一套与西方音乐完全不同的音阶体系。你无法在甘美兰乐器上演奏贝多芬，也无法在钢琴上演奏甘美兰乐曲。这根本行不通。这一点，加上音乐家们对这种风格缺乏接触，使其成为测试一个人（在这种情况下是一位西方音乐专家）如何从头开始“学习”一种全新音乐风格的绝佳手段。


    实验者首先播放了甘美兰旋律的一个音符，并要求每位受试者预测他们认为最有可能出现的下一个音符。这些猜测仅此而已：只是猜测。预测下一个音符的准确率并不比随机猜测高。听了两个、三个音符后，猜测仍然相当随意。但随着旋律的推进，受试者有了更多背景信息用于预测，他们的预测准确性提高了。需要明确的是，他们并没有学会这种音乐风格的*规则*。事实上，他们完全错过了这种音乐风格的一些核心元素。但他们正在学习该风格的*统计学特征*，即基本的倾向和比例。在听到足够多的旋律后，如果到目前为止的旋律中*C*音多于*降
    E*音，他们就预测 C 音的频率会高于降 E 音。到旋律结束时，尽管他们并非真正的甘美兰专家，但他们的预测能力已明显优于随机猜测。


    这种快速、细致且无意识地学习模式的能力，是我们人性的核心部分。这是我们学习母语的重要方式之一。我们并非生来就带有英语基因、日语基因或波斯语基因。我们也没有坐在黑板前上课，学习如何移动嘴唇、下巴和舌头来说出“妈妈”或“爸爸”。我们生来就具有学习的遗传倾向，而我们的大脑会锁定我们最常听到的模式，并尽其所能去模仿它们——并提高我们模仿它们的能力。基于这些模式做出预测和评估的能力也是人性的固有组成部分——甚至导致了我们最深的缺陷，包括对陌生事物做出消极甚至暴力的反应。我们的种族主义、性别歧视、恐同症、跨性别恐惧症、仇外心理……它们都源于对陌生事物的消极反应，以及我们古老的将陌生与危险和威胁联系起来的联想。


    现在，当然，我们评估事物时还有其他因素在起作用。如前所述，我们的大脑随着我们在*情境中*（而非在实验中）反复接触事物而形成联想，也扮演着巨大的角色。但在所有条件相同的情况下，熟悉感，甚至无意识的熟悉感，会导致对物体、人或想法更积极的评价。


    这一核心心理学原理构成了广告中许多实践的基础。想想植入式广告。在电影或电视节目中巧妙地包含一个产品（通常就像商业广告一样需要付费），通过使该产品稍微更熟悉一点、稍微更容易被预激活，就能在你未来决定是否购买它时，促使你对其做出更积极的评价。他们可能会直白地展示它——比如电影《E.T.》中的
    Reese''s Pieces 巧克力——或者可能更含蓄——比如画面边缘桌子上的那罐苏打水的标签——但原理是一样的：在所有其他因素相同的情况下，反复接触会导致积极的评价。'
- fmt: '# The Power of White Earbuds


    One wildly successful example from the world of advertising is the white Apple
    earbud.^([^(47)](#fn47)) Part of the marketing around the `iPod` itself was its
    small size, even its hideability (“1,000 songs in your pocket”). The `iPod` couldn’t
    fulfill its own identity as a stealthy device while also being its own marketing
    campaign—“Look at that! I must have one!” However, at that point in time, white
    earbuds were extremely rare. By bequeathing a pair of standout white earbuds with
    every new `iPod` (and later, `iPhone`), the device could keep its low profile,
    tucked away in every listener’s pocket, while the earbuds could play the marketing
    game.


    `Apple` capitalized on this with its visual advertising campaign. Remember the
    commercials, posters, and magazine ads with a black silhouette of a person dancing
    in front of a background made up of a single, solid, bright color?^([^(48)](#fn48))
    The person dancing was always holding an `iPod` in their hand (also part of the
    black silhouette). The only other element in the photo or video was the pair of
    `Apple` earbuds. White. Stark against the black and fuchsia/orange/green. The
    visual focal point of the advertisement. The earbuds highlighted in this ad campaign
    and the earbuds seen on the street or in the train reinforced each other, generating
    a sense of ubiquity and raising the familiarity of the symbol. Never before had
    the color of the wire between someone’s ear and their pocket primed us to think
    (usually positively) about a specific brand. But by picking something rare yet
    visible and reinforcing it with their visual advertising materials in a way that
    took advantage of the way our brain works, `Apple` was able to do just that.


    ## The Sweet Spot of Familiarity


    Now, familiarity itself is no guarantee of a positive response. Those same white
    earbuds, once they reach a point of market saturation, can start to stand out
    too much. Some people recognize the gimmick. Others simply want to avoid being
    like everyone else. And so *how much is too much?* is a question advertisers have
    been asking themselves for decades. A single Superbowl ad isn’t worth the expensive
    investment if you have no marketing budget left afterward. But the same commercial
    seen during every commercial break of every show is also counterproductive. Remember
    that when something is too familiar, but arrests our attention anyway, the waste
    of resources can lead to a negative reaction. Finding the sweet spot (which is
    different for every individual) is a major part of the advertising game.^([^(49)](#fn49))


    ## Association and Appraisal


    Also remember that when two things are associated in our memory, activating one
    will activate the other at the same time.^([^(50)](#fn50)) So while repeated exposure
    to white earbuds might boost familiarity with both the earbuds and the device
    they come with, that only leads to a positive appraisal if you don’t already have
    a negative association with the earbuds, the `iPod`, or the `Apple` corporation.
    This is why after major scandals, companies often rebrand, either renaming a product
    or renaming the company altogether.


    ## Implications for Social Media and Big Data


    I imagine you can already see potential implications here for social media and
    big data analytics. If seeing something too often is bad, not often enough is
    ineffective, and the sweet spot is different for each person, then individualizing
    how often someone sees an ad would optimize its effect. Likewise, if associations
    in a person’s memory affect the positive or negative appraisal they have when
    seeing or hearing something, and if different people have different associations,
    then individualizing the content of an ad would likewise optimize its effect.


    Of course, individuals aren’t *entirely* unique. Though you and I might react
    differently to the same ad, we might react similarly *enough* to someone else
    that showing us the same content, on the same schedule, would have more or less
    the same effect. And so advertisers have been grouping us together for ages—single
    men ages 18–25, tweenage girls from upper-middle-class families, retired working-class
    widowers on medicare, city dwellers, suburbanites, homesteaders, you name it.
    Marketers divide people into groups based on demographics, do their market research,
    and target ads to groups accordingly. This is why there are a lot more toy commercials
    during children’s television shows than during daytime soap operas, for example.


    But TV ads can’t really target as precisely as advertisers might like. Are the
    people most likely to buy product X or vote for candidate Y really all watching
    the same show at the same time in the same broadcast/cable/satellite market? Surely
    our identities are not defined and clustered according to our television viewing
    habits, our morning-commute radio preferences, and our magazine subscriptions!


    ## The Internet and Microtargeting


    The internet drastically altered this equation. Web technology allows advertisers
    (and purveyors of all kinds of information) to microtarget very small groups of
    people—even individuals, if they *really* know what they’re doing. (Targeting
    individuals with ads is forbidden on most major online platforms, but there are
    ways around that for the more talented, if less ethical, information operatives.)
    If the optimal content and timing is *individual*, if the groups of people with
    similar preferences and associations do not line up with TV show viewership or
    commute schedule, then targeting online starts to make more sense. And in a media
    environment where every web site visited, every link clicked, every image or video
    viewed, every song listened to, every like, every retweet, every `:rage:` emoticon
    is logged *and available to advertisers* (at least as filters), well … then we
    can really start to put our knowledge of human cognition to work in our marketing
    practices.


    In a world where every “sponsored post” is effectively an advertisement, advertising
    is not simply about selling things. It’s about political campaigns. It’s about
    journalists and freelance writers promoting their work. It’s about indie musicians
    finding an audience. It’s about inventors crowdfunding their prototypes. Anyone
    who wants to communicate information or effect human behavior, and who has the
    money to support it, can target individuals in finely grained ways without ever
    scraping a single bit of data themselves. And in spite of all the limitations
    put in place by the platforms, unethical operators can do some really shady things.
    (More on *that* in the chapters to come.)'
