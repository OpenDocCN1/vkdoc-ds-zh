    > 弗格森存在于抗议的传统之中。但弗格森的不同之处，或者说弗格森的重要意义在于，这场运动是由普通民众发起的。……抗议活动形成了一些组织结构，这些结构确实很强大。但发起抗议时并不需要这些结构。……`Twitter`
    让这一切成为可能。^(⁸⁵)


    `McKesson` 在这次采访中没有具体说明这些结构大多是什么。但我们已经注意到了其中的几个。首先，正如 `McKesson` 在那次采访中所强调的，一场运动可以由任何人发起。社交媒体赋予每个人发声的机会，如果被合适的核心群体听到，就能迅速放大到全国乃至全球观众面前。运动的领导力也是涌现的。最终成为领导者的人，可能是像圣路易斯市议员
    `Antonio French` 这样在当地根基深厚的人——他是 `Twitter` 上的主要声音之一，并因涉嫌非法集会而被捕^(⁸⁶)；也可能像 `McKesson`
    这样从外地来到弗格森加入并接过接力棒的人；还可能是像 `Alicia Barza`——`#blacklivesmatter` 的创始人——这样，原本就在向全国听众讲述警察手中种族不公问题的人。`#blacklivesmatter`
    运动早于弗格森事件，但因弗格森事件而获得了更广泛的公众关注。^(⁸⁷)


    或许最重要的是，这场运动的结构灵活且能应对当下的需求。涌现出的领导者和传播策略是面对意外情况时特定需求的结果。标签与 `@` 提及的结合、公开推文与私密直接消息的分叉使用、文字与嵌入式
    `Vine` 视频及直播的运用，乃至手机的共享与充电——所有这些涌现出的具体实践，都诞生于当下的需求，并结合了技术的可供性与局限性。对于运动外部——或只是缺乏
    `Twitter` 素养——的许多人来说，这看起来可能混乱且“无计划”，但鉴于社区对这些工具的熟练运用，它赋予了参与者原本不具备的灵活性。事实上，如果没有
    `Twitter` 和 `Vine`，很可能根本就不会有所谓运动发生。或者，用 `McKesson` 的话说：“如果不是社交媒体，密苏里州会让你相信我们根本不存在。”^(⁸⁸)


    ### 谁来决定讲述哪些故事？


    尽管 `Twitter` 具备促进社区组织和信息传播的能力，但其整体用户基数仍然相当小。根据 `Pew Research` 的数据，2014 年只有不到四分之一的美国成年人使用
    `Twitter`。^(⁸⁹) 考虑到骚乱的种族色彩以及美国高度分化的社交媒体生态，^(⁹⁰) 新闻需要那么长时间才能进入主流视野也就不足为奇了。事实上，在第一篇关于骚乱的主流新闻报道之前，带有
    `#ferguson` 标签的推文已经超过了 100 万条。^(⁹¹) 弗格森警方积极控制和封锁新闻的做法更是雪上加霜：他们将（大多数）记者限制在“记者围栏”内，使其远离实际冲突现场，并向他们提供警方的新闻稿；逮捕正在拍摄警方行动的《华盛顿邮报》和《赫芬顿邮报》记者；甚至向
    `Al Jazeera` 的一个摄制组发射橡皮子弹。^(⁹²)


    但最终，主流媒体确实听到了这个故事——不仅是警方的说法，也包括抗议者的声音。联邦调查局也听到了，并对弗格森警察局的行为进行了调查（并随后予以谴责）。国际特赦组织也派出了观察员，他们同样指出了针对抗议者的人权侵犯行为。


    但如果这个故事没能被广泛传播呢？如果它仅仅停留在弗格森呢？


    从一开始，不只是全国性主流媒体没有报道弗格森事件。Facebook 也出奇地沉默。如前所述，当 `Twitter` 按时间倒序排列的信息流被 `#ferguson`
    占据时（对许多美国人来说），Facebook 的算法信息流却并非如此，有时甚至对同一个人也是如此。^(⁹³) 算法会做出“决策”，而这些决策影响了我们所看到的内容。^(⁹⁴)
    无论出于何种原因，Facebook 在 2014 年的算法“认定”向大多数用户推送`冰桶挑战`比推送弗格森骚乱是更合适的内容主题。只有在 `Twitter`
    上，一条推文或转发会立即将该内容置于每个关注者信息流的顶端，这个故事才有机会被广泛传播。这不仅增加了这些信息被看到的可能性（相对于淡化它们的算法而言），也使该平台对组织活动非常有用，从而确保了来自弗格森核心地带的新推文（和转发）源源不断。


    `Twitter` 现在不再是这样了。弗格森事件后不久，`Twitter` 推出了“当你不在时”功能——在原本的时间倒序时间线中插入算法推荐的内容。^(⁹⁵)
    2016 年，`Twitter` 将算法时间线设为默认设置。尽管它允许用户选择切换到按时间倒序查看所关注账号的推文，但应用程序经常自动恢复到算法默认状态。


    引入算法的原因很简单。算法能提高用户参与度，使新用户更容易上手使用该服务。^(⁹⁶) 这两者都能增加广告收入，帮助 `Twitter` 盈利。但这引出了一个重要问题：下一个弗格森事件发生时会怎样？我们能听到吗？还是说我们已经错过了？


    最终，`Twitter` 对弗格森人民以及那场线上线下混合诞生的运动——物理世界与数字世界是其本质的关键组成部分——而言，是一个净收益因素。它促进了沟通与协调，也让信息的传播范围远超五年前所能达到的水平。


    尽管这对 `#ferguson` 和 `#blacklivesmatter` 来说是有益的，但它并非对所有人都有利。

    '
- fmt: '## You Can’t Just Quit the Internet: How GamerGate Turned Social Media into
    a “Real-life” Weapon


    In 2014, a group of activists began to emerge, organize, and spread their message
    nationally on `Twitter`. The battle they were fighting was not new, but some of
    the tactics were, as were the means by which they organized and the realization
    that they were both many and powerful. This loose coalition of tech-fluent activists
    found each other, recruited others, and resisted the advances of the enemy. The
    impacts of their tactics online had a noticeable impact on the “real” (i.e., physical)
    world.


    While those statements are all true relative to the protesters of Ferguson, that’s
    not actually what I’m talking about here. In 2014, another group emerged onto
    the national scene, also largely via `Twitter`. That group was GamerGate. Rather
    than fighting for social justice, this group fought a decidedly *anti*social battle
    against those they dubbed “social justice warriors,” or `SJWs`. These GamerGaters—predominately
    young, white, straight, and male—decried the diversification of gaming, considering
    it an attack against the straight white male “minority.” But it wasn’t just a
    battle of words or ideas, it was a battle that involved threats of physical violence,
    threats so real that the recipients of those threats fled for their lives. And
    it didn’t just stop with GamerGate. Out of that very group formed a new movement—the
    so-called alt-right. This movement not only played a pivotal role in shifting
    the tone—and probably some votes—in the 2016 U.S. presidential election, but their
    culture war led to a shooting at a Washington, D.C., pizza parlor in December
    2016 and the death of social activist Heather Heyer in Charlottesville, Virginia,
    in August 2017.


    But before we get into the alt-right, first we need to unpack the events that
    led to its rise: GamerGate.


    ### Zoë Quinn and the Blog Post from Hell


    In 2013, independent game developer, Zoë Quinn, released the game *Depression
    Quest*. It wasn’t your stereotypical game. Of course, that’s kind of the point.
    Ever since the 1980s, the public perception of video games has been one dominated
    by role-playing games (e.g., *World of Warcraft*), first-person shooters (e.g.,
    *Call of Duty*), and sports games. The emphasis on competition, conquest, and
    violence in these stereotypical games is very closely tied to the stereotypical
    *gamer*—a suburban, adolescent (straight, white) male. Now there’s nothing inherently
    masculine about games, nor about competition, nor even violence. But in Western
    culture, particularly in the United States, competitiveness, leadership, and heroism
    (too often confused with violence from one of the “good guys”) have unfortunately
    become intertwined with an idea of what masculinity looks like.


    Quinn’s game—and her image as a gamer—could hardly be more opposite. A queer-identifying
    woman, who also implanted a chip into her body so she could become a “cyborg,”
    Quinn represents a very different image of a gamer. Likewise, her game *Depression
    Quest* sought not to give players a rush of adrenaline while killing Nazis or
    protecting Earth from an alien invasion. It wasn’t even meant to be fun. Instead,
    *Depression Quest* sought to raise awareness of what individuals go through when
    they experience depression, something Quinn herself has experienced. Whether or
    not it is a “good” game (I’ve never played it myself), it will certainly go down
    in history as an important game—not only for what it demonstrates that a game
    could be, but because of the movement that built up around it.


    I wish I were talking about a movement that supported and encouraged expanding
    public ideas of what a game(r) could be. Unfortunately, that’s not the movement
    that followed.


    Quinn had already faced some blowback from “traditional”/stereotypical gamers
    about her game and the press that it received. A game that pushed the boundaries
    the way *Depression Quest* did, especially one created by a female gamer from
    the LGBTQ community, was bound to be fodder for thinkpieces, and that naturally
    led to some negative (as well as positive) responses. But in August 2014, something
    else happened.


    Quinn and her boyfriend, Eron Gjoni, broke up. It didn’t go well. Others, including
    Quinn herself, have written about the details, so I won’t bother with most of
    them. The key outcome was that Gjoni, in a bout of premeditated rage, published
    a blog post accusing Quinn of sleeping with a journalist at the gaming news web
    site, `Kotaku`, in exchange for a positive review of her game. That review never
    existed. Nonetheless, the combination of years of pent up resentment about the
    diversification of gaming and a blog post crafted specifically to take advantage
    of that rage led to an online explosion. Discussion of “the Zoë post” spawned
    its own subreddit, *quinnspiracy*, and dominated `4chan`—a site for super-nerds
    that birthed memes, rickrolling, “epic fail,” and the Trump Train, as well as
    copious sexism, racism, and, occasionally, the coordinated online harassment campaign—and
    `8chan`—a site for people who think `4chan` is too “politically correct.” (In
    the words of Ben Schreckinger, `8chan` is the ISIS to `4chan`’s Al Qaeda.)'
