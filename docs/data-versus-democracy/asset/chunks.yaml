- fmt: '## “Weaponizing” Facebook in the Philippines


    Brazil isn’t the only country to see a social media disinformation apparatus continue
    on, retooled, after the election for which it was first created. In May 2016,
    after the election of President Rodrigo Duterte, the citizens of the Philippines
    saw his campaign’s powerful social media propaganda outfit become a critical part
    of the new president’s administration.


    Rodrigo Duterte started off at a disadvantage. If campaign spending on traditional
    media is any indication, he had less funds to work with than some of his rivals.
    However, he had a powerful social media apparatus. Duterte’s team was driven online
    because “limited campaign funds forced them to be creative in using the social
    media space.”^([^(196)](#fn196)) They took advantage of “training sessions” that
    Facebook provided to the presidential candidates ahead of the election. In a country
    with more smartphones than people and where 97% of the people who are online are
    on Facebook,^([^(197)](#fn197)) that Facebook mastery proved indispensable.


    Headed by Nic Gabunada, Duterte’s social media team consisted of several hundred
    connected volunteers. “It was a decentralized campaign: each group created its
    own content, but the campaign narrative and key daily messages were centrally
    determined and cascaded for execution.”^([^(198)](#fn198)) (This is a similar
    playbook to the Russian operations in the United States that same year that we
    explored in the previous chapter.) Notably, the content being advanced by Duterte’s
    supporters were not simply policy positions and innocuous statements of support.
    Many Duterte supporters called for violence against his critics, leading to situations
    like an online mob in March 2016 threatening violence, even death, against a small
    group of students opposed to Duterte.^([^(199)](#fn199)) Journalist Maria Ressa
    (founder of Rappler) calls this a “death by a thousand cuts” strategy to intimidate
    or silence critics, where a large number of users overwhelm a target with online
    threats.^([^(200)](#fn200))


    The problem only got worse after Duterte became president. Lauren Etter writes:
    “Since being elected in May 2016, Duterte has turned Facebook into a weapon. The
    same Facebook personalities who fought dirty to see Duterte win were brought inside
    the Malacañang Palace.”^([^(201)](#fn201)) Gabunada told another Rappler journalist
    that “there was a need to continue campaigning [after the election] because they
    got ‘only 40% of the votes’ and needed more than that to allow Duterte to effectively
    govern.”^([^(202)](#fn202))


    This involved far more than a president tweeting or even a team of bots amplifying
    his messages. It was part of a coordinated media strategy aimed at consolidating
    Duterte’s power and silencing his opponents, whether politicians or journalists.
    Soon after the election, Duterte boycotted private media for two months, refusing
    to talk to any independent reporters and only pushing propaganda through state-controlled
    media. Simultaneously, pro-Duterte trolls and sockpuppets (fake accounts controlled
    by real humans) attacked independent journalists that criticized the government.
    When Ressa published her article, “Propaganda War,” which unveiled many of these
    activities, she was immediately attacked by pro-Duterte trolls, including both
    death and rape threats and calls for her to leave the country. In Ressa’s words,
    since Duterte’s election, “when someone criticizes the police or government on
    Facebook, immediate attacks are posted.”^([^(203)](#fn203))


    According to Etter, this isn’t simply a case of the Duterte administration “hacking”
    the system or taking advantage of Facebook’s targeted advertising features. In
    addition to providing training sessions to the Philippine presidential campaigns,
    after the election Facebook “began deepening its partnerships with the new administration.”^([^(204)](#fn204))
    This wasn’t exceptional, but “what [Facebook] does for governments all over the
    world … offering white-glove services to help it maximize the platform’s potential
    and use best practices.” Etter continues:


    *   Even as Duterte banned the independent press from covering his inauguration
    live from inside Rizal Ceremonial Hall, the new administration arranged for the
    event to be streamed on Facebook, giving Filipinos around the world insider access
    to pre- and post-ceremonial events as they met their new strongman.


    Though Facebook has since made it more difficult to perform some aspects of the
    instant trolling that has plagued Duterte critics, the attacks on independent
    journalists continue under Duterte’s rule. In November 2018, the Philippine government
    announced its intent to charge Ressa’s media outlet, Rappler, with tax evasion.
    Rappler characterized the accusations as “intimidation and harassment.”^([^(205)](#fn205))


    It doesn’t look like this problem is going away any time soon.'
