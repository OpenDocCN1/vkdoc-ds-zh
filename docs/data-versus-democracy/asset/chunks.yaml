    # 引言：从稀缺到丰裕


    ## 信息简史与宣传问题


    自我们拥有信息以来，虚假信息便随之存在。自广告诞生以来，试图进行“心理特征画像”的尝试便从未停止。自印刷术发明以来，我们便一直担忧大众媒体的腐蚀性影响。但在过去十年中，出现了一些新情况。信息的丰裕程度是我们在一二十年前无法想象的，而推荐引擎——一种基于个人数据档案、通过算法筛选内容的全新科学——主导着现代媒体格局。在本引言中，我们将厘清误解，聚焦问题的核心——即信息丰裕、人类心理、用户数据画像与媒体推荐算法之间的交汇点。这正是宣传渗入现代社会的途径。


    ### 现状概览


    你是否曾使用搜索引擎寻找过库存照片？也许你需要在博客文章中插入一个漂亮的标题图，为家庭节日信件找些风景素材，或是为办公室派对传单设计背景。搜索结果可能相当不错，尤其是在使用专业库存图片网站（并且懂得如何选择搜索词）时。


    但你是否曾用普通搜索引擎搜索过某些通用类别的图片？不妨试试。搜索*医生*的图片，然后搜索*护士*。再搜索*教授*，接着搜索*教师*。你看到了什么？


    很可能你会发现一些相当明显的刻板印象。头发花白的教授穿着粗花呢外套，在黑板前讲课。教师同样站在黑板前，对着热切的学生微笑。医生穿着白大褂，娴熟地使用听诊器或在患者病历上做记录。护士穿着蓝色刷手服，同样精通于病历和仪器。你懂的。


    然而，如果你走进一所中小学、大学、医院或全科诊所，会发现现实与这些图像几乎毫无相似之处。多数中小学和大学早已抛弃粉笔，转而使用白板和电子投影仪。面向一排排学生进行讲座式教学的情况也越来越少，尤其是针对低龄学生。而且，顺便提一句，所有这些专业人士的着装往往比搜索结果图像中的对象更随意，当然也更多样化。


    搜索引擎并没有呈现现实。它们提供的是我们*预期*会看到的结果。结合人工编程、用户交互数据以及两者间不断重复的反馈循环，这些搜索结果会逐渐变得与我们脑海中的一般化印象越来越相似。我们心中的刻板印象决定了我们点击什么，而这些点击行为则构成了搜索引擎算法所用的原始数据。反过来，这些算法会根据我们的集体点击行为，形成对预期用户行为的一般化模型，并基于这些数据向你推送最可能点击的结果。我们感知、归纳、搜索、点击；机器感知（点击行为）、归纳、返回结果。


    事情并未就此结束。这些搜索结果在网络上和印刷品中被*广泛使用*（这难道不正是我们当初搜索的目的吗？）。这些图像成为我们世界观背景的一部分，并进一步强化了我们头脑中的一般化印象。由此形成了一个无尽的循环：人类感知
    → 人类归纳 → 人类行为 → 机器感知 → 机器归纳 → 机器行为 → 人类感知 → 人类行为……而在每次反馈循环的迭代中，刻板印象会变得更加刻板。现实被遗失了。然而，由于这些刻板印象已成为我们媒体景观的一部分，在某种意义上，现实也被*塑造*了。


    但你注意到这些图片结果中另一个奇怪的现象了吗？


    那些医生中有多少是男性，多少是女性？护士的情况又如何？据《华尔街日报》报道，2012 年美国 32%的医生是女性，且这一比例正在上升。¹(¹) 你的搜索结果中是否显示了这一比例？根据美国国家教育统计中心的数据，美国
    49%的终身教职大学教师和 57%的非终身教职大学教师是女性。²(²) 你搜索的*教授*结果与之相比如何？

    '
- fmt: '你的搜索结果很可能更多地反映了刻板印象，而非现实。这在一定程度上要归咎于我们的大脑。大脑会对我们在世界中所感知到的事物进行概括，而这些概括使我们能够对世界做出预测，从而帮助我们更高效地与之互动。认知科学家还发现，当我们形成概括——即所谓的“图式”（`schema`）——时，我们往往会通过与其他图式进行对比来定义这些图式。换句话说，我们会强调它们之间的*差异*，常常使它们在头脑中变得比现实中*更加泾渭分明*。虽然这种在头脑中定义思想和类别的方法通常很有帮助，但有时它也会适得其反，因为它会强化我们环境中的*偏见*，包括我们接触到的（充满刻板印象的）媒体。而当人类概括、机器概括和媒体呈现的反馈循环上线时，这种偏见就会以接近光速的速度传播和再现。


    这一切都是相互关联的——我们的媒体、记忆、身份和社会。我们与世界互动的方式，直接受到我们拥有的世界“心理地图”的影响——什么是真实的，什么不是，以及一切都应归属于哪里。虽然这张心理地图主要是根据我们的经验形成的（并得益于数十万年的人类进化），但它越来越多地受到我们所消费媒体的影响。


    我说“越来越多”，并非因为我们的大脑发生了某种变化，而是因为我们的媒体格局在过去一个世纪——甚至过去十年——发生了翻天覆地的变化。我们已经从信息匮乏走向信息过剩，从媒体荒漠走向媒体无处不在。对于这个星球上的大多数人——尽管重要的是，并非所有人——而言，我们接触现有信息和媒体的渠道也已同样迅速地扩展。我们的生活经验正越来越多地通过媒体来传递。


    ### 注意力的局限


    但有一件重要的事情*没有*改变：人类身体（包括大脑）的极限。诚然，过去一个世纪里，大多数社会的婴儿死亡率 ^([³](#fn3)) 和预期寿命 ^([⁴](#fn4))
    有所改善，并且由于科学和人文学科的进步，许多人的生活质量得到了提高。然而，人类的认知系统——大脑与身体、记忆与感官的相互作用——早在数万年前就已基本定型。^([⁵](#fn5))
    我们大脑所能容纳的信息量没有改变，有意识的*注意力*的极限也没有改变。


    随着所有媒体都在争抢我们的注意力，这种注意力已成为我们最宝贵——或许也是我们最常忽视——的资源。


    让我们暂时回到搜索引擎的世界。它们是可能被入侵的。我指的不是全面的安全漏洞（虽然这当然也可能），而是它们可能被动机强烈的用户操纵。就像用户点击的内容会（部分）决定搜索结果排名一样，用户搜索的词汇也会（部分）决定输入时自动补全弹出的词汇。（找点乐子，去谷歌搜索你的家乡国家或州，比如“Why
    is [Colorado] so”，看看谷歌认为你可能想怎样完成这个搜索。）如果输入搜索引擎的搜索词可以决定自动补全词汇，那么一群愿意投入时间的人就可以反复搜索同一件事，直到它主导自动补全结果，从而增加看到它、受其影响并点击它的人数。


    这种事在2016年就真实发生了。所谓“另类右翼”运动（右翼极端分子，通常与宣扬白人至上、反犹太主义、极端大男子主义反女权主义等仇恨观点的团体有关）的成员成功操纵了谷歌的自动补全，使其推荐带有种族主义色彩的搜索词和亲另类右翼的信息。^([⁶](#fn6))
    当谷歌了解到这种操纵行为后，他们对系统进行了修改。但没有一个系统能完全抵御入侵。


    就连人类的心灵也不例外。


    ### 认知入侵


    任何部分或全部基于统计数据得出结论的系统，都可能通过操纵统计数据而被利用。人类大脑的运作方式正是如此——随着时间的推移，我们感知到的事物被聚合在一起，形成概括性的图式，这些图式会随着新信息而不断变化（当然，更根深蒂固的图式变化得更慢）。通过改变大脑的统计输入，“入侵者”就能影响我们大脑形成的图式。这种*认知入侵*不仅影响我们如何定义事物，还影响我们将什么与它们联系起来，以及我们对它们反应的积极或消极程度。正如操纵谷歌的另类右翼人士只是少数用户，却依然能够影响该平台一样，即便是小规模的认知入侵者，只要他们能够操纵我们所消费的、围绕特定议题的足够多的媒体内容，就能对我们“心理地图”（及其影响的行为）产生显著影响。


    现在，在你开始想到“俄罗斯人！俄罗斯人！”之前，有必要指出，很多认知“入侵”是无意的。（我们稍后会在本书中讨论俄罗斯政府支持的影响力行动，但它们只是更大问题的一部分。）也就是说，我们日常使用的媒体平台的结构，影响着我们感知世界的方式。


    例如，我们知道用户更倾向于参与能引发强烈情感的媒体内容，尤其是当这种情感是愤怒时。^([⁷](#fn7)) 我们还知道，人们正越来越多地通过社交媒体平台消费新闻，^([⁸](#fn8))
    而社交媒体平台通过一种算法来推送内容，该算法旨在最大化“参与度”（点击、点赞、收藏、分享、愤怒表情等），而最大化参与度的努力往往转化为最大化强烈情感，尤其是愤怒。因此，研究政治和数字媒体的人观察到围绕政治议题的两极化加剧——强烈的情感、减少的细微差别，以及意识形态立场向远离政治中心的方向聚集，这就不足为奇了。


    我们注意力自然会被能引发强烈情感的事物所吸引，而这种现象因对我们注意力的*争夺*而加剧，因为数据量以及数据生产者的数量正以令人瞠目结舌的速度增长。2013年，科学家估计全球90%的数据仅是在此前两年内产生的。^([⁹](#fn9))
    到了2015年，仅`Facebook`的用户数就超过了2008年*整个互联网*的用户数。^([^(10)](#fn10)) 再加上许多家庭电视频道的激增，以及其他数字屏幕的便携普及，我们整个社会都沉浸在视觉和听觉媒体中，而这一切是我们进化史上从未准备过的。随着每一则商业媒体都在争夺我们的注意力，它们都试图通过超越对手来做到这一点。其结果是一场认知操纵的数字军备竞赛，加剧了吸引眼球媒体已经造成的危险和极化效应。'
  raw: 'Chances are your search results were more stereotype than reality. That’s
    partly our brains’ fault. Our brains make generalizations about what we perceive
    in the world, and those generalizations allow us to make predictions about the
    world that help us interact with it more efficiently. Cognitive scientists have
    also found that when we form generalizations—called *schemas* —we tend to define
    those schemas , in part, by contrast with other schemas. In other words, we emphasize
    their *differences* , often making them *more distinct* from each other in our
    minds than they are in reality. While this method of defining ideas and categories
    in our mind is usually helpful, it sometimes works against us by reinforcing the
    *bias* of our environment, including the (stereotype-ridden) media we encounter.
    And when the feedback loop of human generalizations, machine generalizations,
    and media representation goes online, that bias gets propagated and reinscribed
    at near light speed.


    It’s all connected—our media, our memory, our identity, our society. The way we
    interact with the world is directly influenced by the “mental map” we have of
    the world—what’s real, what’s not, and where it all belongs. And while that mental
    map is primarily formed in light of our experiences (with a little help from hundreds
    of thousands of years of human evolution ), that map is increasingly influenced
    by the media that we consume.


    I say “increasingly” not because something in our brains has changed, but because
    our media landscape has changed so drastically in the last century—even the last
    decade. We have moved from information scarcity to information abundance, from
    media desert to media ubiquity. And for most—though, importantly, not all—humans
    on this planet, our access to the information and media that exists has expanded
    just as rapidly. Our lived experiences are increasingly mediated through media.


    ### The Limits of Attention


    But one important thing has *not* changed: the limits of the human body, including
    the brain. Sure, infant mortality ^([³](#fn3)) and life expectancy ^([⁴](#fn4))
    have improved in most societies over the past century, and quality of life has
    improved for many as the result of scientific and humanistic advancement. But
    the human cognitive system —the interaction of the brain and the body, memory
    and the senses—took its more-or-less modern form tens of thousands of years ago.
    ^([⁵](#fn5)) The amount of information our brains can hold has not changed, nor
    has the limits of conscious *attention* .


    And with all the media clamoring for our attention, that attention has become
    our most precious—if also our most overlooked—resource.


    Let’s step back to the world of search engines for a moment. They can be hacked.
    I don’t mean a full-on security breach (though that’s certainly possible). I mean
    they can be manipulated by highly motivated users. Just as what people click on
    determines (in part) the search result rankings, the terms that people search
    for determine (in part) the terms that pop up on autocomplete as you type. (For
    some fun, go to Google and search for your home country/state: “Why is [Colorado]
    so” and see how Google thinks you might want to complete that search.) If the
    searches typed into a search engine can determine the autocomplete terms, then
    a group of people willing to put the time in can search for the same thing over
    and over again until it dominates the autocomplete results, increasing the number
    of people who see it, are influenced by it, and click on it.


    This very thing happened in 2016\. Members of the so-called alt- right movement
    (right-wing extremists, often affiliated with groups espousing hateful views like
    white supremacy, anti-Semitism, and hyper-masculine antifeminism) successfully
    manipulated Google’s autocomplete to suggest racist searches and pro-alt-right
    messages. ^([⁶](#fn6)) When this manipulation was brought to Google’s attention,
    they responded with changes to the system. But no system is completely impervious
    to hacking.


    Not even the human mind .


    ### Cognitive Hacking


    Any system that draws conclusions based on statistics, in part or in whole, can
    be gamed by a manipulation of the statistics. That’s how the human brain works—over
    time, the things we perceive are aggregated together into generalized schemas
    , which are constantly changing with new information. (The more established schemas
    change more slowly, of course.) By altering the statistical input of the brain,
    a “hacker” can impact the schemas our brain forms. This *cognitive hacking* impacts
    not only how we define things but also what we associate them with and how positively
    or negatively we react to them. And just as the alt- right Google hackers were
    a minority of Googlers who were still able to impact the platforms, even small
    groups of cognitive hackers can have a noticeable impact on our “mental map” (and
    the actions it influences) if they can manipulate a large enough portion of the
    media we consume around a particular issue.


    Now before you start thinking “The Russians! The Russians!”, it’s worth noting
    that a lot of cognitive “hacking” is inadvertent. (We will get to Russian, state-sponsored
    influence operations later in this book, but they are but a part of a much bigger
    problem.) That is, the structure of the media platforms we use on a daily basis
    has an impact on the way we perceive the world.


    For example, we know that users engage more with media that elicits strong emotions,
    particularly if that emotion is anger. ^([⁷](#fn7)) We also know that people are
    increasingly consuming news via social media platforms, ^([⁸](#fn8)) which deliver
    content based on an algorithm that seeks to maximize “ engagement ” (clicks, likes,
    favorites, shares, angry emoji, etc.), and attempts to maximize engagement often
    translate into maximizing strong emotions, especially anger. It’s no surprise,
    then, that those who study politics and digital media observe an increased polarization
    around political issues—strong emotions, diminished nuance, and ideological positions
    clumped further from the center .


    This natural draw of our attention to things that elicit strong emotions is exacerbated
    by the *competition* for our attention, as the amount of data, and data producers,
    is growing at mind-boggling rates. In 2013, scientists estimated that 90% of the
    data in the entire world had been created in the previous two years alone. ^([⁹](#fn9))
    And by 2015, Facebook alone had more users than *the entire internet* did in 2008\.
    ^([^(10)](#fn10)) Add to that the proliferation of TV channels in many households,
    and the portable prevalence of other digital screens, and we have a society marinated
    in visual and aural media that our evolutionary history simply did not prepare
    us for. As every bit of commercial media competes for our attention, each one
    does so by trying to outdo the other. The result is a digital arms race of cognitive
    manipulation, amplifying the already dangerous, polarizing effects of attention-grabbing
    media.'
  trans: '

    你的搜索结果很可能更多地反映了刻板印象，而非现实。这在一定程度上要归咎于我们的大脑。大脑会对我们在世界中所感知到的事物进行概括，而这些概括使我们能够对世界做出预测，从而帮助我们更高效地与之互动。认知科学家还发现，当我们形成概括——即所谓的“图式”（`schema`）——时，我们往往会通过与其他图式进行对比来定义这些图式。换句话说，我们会强调它们之间的*差异*，常常使它们在头脑中变得比现实中*更加泾渭分明*。虽然这种在头脑中定义思想和类别的方法通常很有帮助，但有时它也会适得其反，因为它会强化我们环境中的*偏见*，包括我们接触到的（充满刻板印象的）媒体。而当人类概括、机器概括和媒体呈现的反馈循环上线时，这种偏见就会以接近光速的速度传播和再现。


    这一切都是相互关联的——我们的媒体、记忆、身份和社会。我们与世界互动的方式，直接受到我们拥有的世界“心理地图”的影响——什么是真实的，什么不是，以及一切都应归属于哪里。虽然这张心理地图主要是根据我们的经验形成的（并得益于数十万年的人类进化），但它越来越多地受到我们所消费媒体的影响。


    我说“越来越多”，并非因为我们的大脑发生了某种变化，而是因为我们的媒体格局在过去一个世纪——甚至过去十年——发生了翻天覆地的变化。我们已经从信息匮乏走向信息过剩，从媒体荒漠走向媒体无处不在。对于这个星球上的大多数人——尽管重要的是，并非所有人——而言，我们接触现有信息和媒体的渠道也已同样迅速地扩展。我们的生活经验正越来越多地通过媒体来传递。


    ### 注意力的局限


    但有一件重要的事情*没有*改变：人类身体（包括大脑）的极限。诚然，过去一个世纪里，大多数社会的婴儿死亡率 ^(³) 和预期寿命 ^(⁴) 有所改善，并且由于科学和人文学科的进步，许多人的生活质量得到了提高。然而，人类的认知系统——大脑与身体、记忆与感官的相互作用——早在数万年前就已基本定型。^(⁵)
    我们大脑所能容纳的信息量没有改变，有意识的*注意力*的极限也没有改变。


    随着所有媒体都在争抢我们的注意力，这种注意力已成为我们最宝贵——或许也是我们最常忽视——的资源。


    让我们暂时回到搜索引擎的世界。它们是可能被入侵的。我指的不是全面的安全漏洞（虽然这当然也可能），而是它们可能被动机强烈的用户操纵。就像用户点击的内容会（部分）决定搜索结果排名一样，用户搜索的词汇也会（部分）决定输入时自动补全弹出的词汇。（找点乐子，去谷歌搜索你的家乡国家或州，比如“Why
    is [Colorado] so”，看看谷歌认为你可能想怎样完成这个搜索。）如果输入搜索引擎的搜索词可以决定自动补全词汇，那么一群愿意投入时间的人就可以反复搜索同一件事，直到它主导自动补全结果，从而增加看到它、受其影响并点击它的人数。


    这种事在 2016 年就真实发生了。所谓“另类右翼”运动（右翼极端分子，通常与宣扬白人至上、反犹太主义、极端大男子主义反女权主义等仇恨观点的团体有关）的成员成功操纵了谷歌的自动补全，使其推荐带有种族主义色彩的搜索词和亲另类右翼的信息。^(⁶)
    当谷歌了解到这种操纵行为后，他们对系统进行了修改。但没有一个系统能完全抵御入侵。


    就连人类的心灵也不例外。


    ### 认知入侵


    任何部分或全部基于统计数据得出结论的系统，都可能通过操纵统计数据而被利用。人类大脑的运作方式正是如此——随着时间的推移，我们感知到的事物被聚合在一起，形成概括性的图式，这些图式会随着新信息而不断变化（当然，更根深蒂固的图式变化得更慢）。通过改变大脑的统计输入，“入侵者”就能影响我们大脑形成的图式。这种*认知入侵*不仅影响我们如何定义事物，还影响我们将什么与它们联系起来，以及我们对它们反应的积极或消极程度。正如操纵谷歌的另类右翼人士只是少数用户，却依然能够影响该平台一样，即便是小规模的认知入侵者，只要他们能够操纵我们所消费的、围绕特定议题的足够多的媒体内容，就能对我们“心理地图”（及其影响的行为）产生显著影响。


    现在，在你开始想到“俄罗斯人！俄罗斯人！”之前，有必要指出，很多认知“入侵”是无意的。（我们稍后会在本书中讨论俄罗斯政府支持的影响力行动，但它们只是更大问题的一部分。）也就是说，我们日常使用的媒体平台的结构，影响着我们感知世界的方式。


    例如，我们知道用户更倾向于参与能引发强烈情感的媒体内容，尤其是当这种情感是愤怒时。^(⁷) 我们还知道，人们正越来越多地通过社交媒体平台消费新闻，^(⁸)
    而社交媒体平台通过一种算法来推送内容，该算法旨在最大化“参与度”（点击、点赞、收藏、分享、愤怒表情等），而最大化参与度的努力往往转化为最大化强烈情感，尤其是愤怒。因此，研究政治和数字媒体的人观察到围绕政治议题的两极化加剧——强烈的情感、减少的细微差别，以及意识形态立场向远离政治中心的方向聚集，这就不足为奇了。


    我们注意力自然会被能引发强烈情感的事物所吸引，而这种现象因对我们注意力的*争夺*而加剧，因为数据量以及数据生产者的数量正以令人瞠目结舌的速度增长。2013
    年，科学家估计全球 90%的数据仅是在此前两年内产生的。^(⁹) 到了 2015 年，仅`Facebook`的用户数就超过了 2008 年*整个互联网*的用户数。^(¹⁰)
    再加上许多家庭电视频道的激增，以及其他数字屏幕的便携普及，我们整个社会都沉浸在视觉和听觉媒体中，而这一切是我们进化史上从未准备过的。随着每一则商业媒体都在争夺我们的注意力，它们都试图通过超越对手来做到这一点。其结果是一场认知操纵的数字军备竞赛，加剧了吸引眼球媒体已经造成的危险和极化效应。

