    # 7. Conclusion


    Where Do We Go from Here?


    Information abundance, the limits of human cognition, excessive data mining, and
    algorithmic content delivery combine to make us incredibly vulnerable to propaganda
    and disinformation. The problem is massive, cross-platform, and cross-community,
    and so is the solution. But there are things we can do—as individuals and as societies—to
    curb the problem of disinformation and secure our minds and communities from cognitive
    hackers.'
  trans: '

    如今，在一场包含数千个单独竞选活动的大规模大选期间，面对一场协调一致的信息造假运动，`cut-and-paste`（复制粘贴）手法的扩展能力只能到此为止。因此，Verificado
    团队还设计其辟谣内容，以促进在 `WhatsApp` 上广泛分享，甚至达到病毒式传播。他们每天多次更新自己的公开状态，发布一条根据收到的私信而生成的辟谣信息。这些状态信息随后可以在平台上分享，类似于推文或
    Facebook 上的公开帖子。他们还制作了类似表情包的图片，其中包含虚假声明以及他们加盖的`真/假`评估印章。这促进了用户的参与，在用户心中将其`真/假`评估与原始图片关联起来，并且比单纯的文字或网页文章链接更能促进病毒式传播（不过，他们也在自己的网站上发布了更长篇的辟谣文章）。^(²²¹)


    出于与难以研究`WhatsApp`上错误信息和信息造假的覆盖范围与影响力相同的原因，衡量 Verificado 2018 年工作的覆盖范围与影响力也很困难。但共识是，在一个充斥着谣言、复杂的选举周期中，他们对信息环境产生了不容忽视的积极影响，并且在解决私人化的、病毒式传播的错误/虚假信息问题上，取得的进展比迄今为止几乎任何人都要大。他们的合作甚至赢得了一个“在线新闻奖”。^(²²²)


    点对点的信息造假不会消失。随着用户越来越担心社交媒体上的隐私、监控、定向广告和骚扰，他们常常退回到与亲近小团体之间的私人数字通讯中。对许多人来说，社交媒体的蜜月期已经结束，那些偶然建立全球联系的日子一去不复返。安全、保障和隐私成为新的关键词。在某些情况下，这意味着减少了接触谣言和心理战的机会。在另一些情况下，这仅仅意味着这些威胁更难追踪。这绝不是一个已经解决的问题，但像
    Verificado 2018 这样的例子给了我们希望，解决方案是可能的，而且我们可能已经掌握了一些行之有效的方法。


    ## 总结


    在本章中，我们探讨了全球南方地区近期的在线信息造假活动。从拉丁美洲到北非，再到东南亚，我们看到了社交媒体平台是如何放大谣言、使仇恨言论主流化，并成为心理战行动工具的。在某些情况下，这些错误信息和虚假信息不仅助长了政治运动和心理困扰，还引发了线下的暴力行为，甚至煽动了种族清洗和种族灭绝的火焰。


    在线信息造假问题比许多西方人所意识到的更为庞大和多样化。它比“假新闻”更严重，比俄罗斯和美国的另类右翼更严重，比世界上的班农家族和默瑟家族更严重，比推特机器人更严重，甚至比社交网络平台本身更严重。只要有信息存在，就有虚假信息存在，我们星球上没有任何社会能对此免疫。这是一个全球性问题，也是一个人类问题，它由技术推波助澜（而非创造）。当我们寻求解决问题时，我们需要一个全球性的、人性的——当然，也是技术性的——解决方案。


