  trans: '

    # 缅甸的权力巩固


    杜特尔特政府并非唯一利用`Facebook`作为武器对付本国人民的政府。近期调查还揭露了缅甸军方针对该国少数族裔罗兴亚人开展的大规模信息行动。


    暴力和压迫在缅甸并不新鲜。缅甸是一个年轻的半民主国家，长期被独裁者和专制统治者掌控。政府压迫与不可信的国有媒体在这个国家屡见不鲜。佛教徒占多数的群体与罗兴亚人之间也存在长期的暴力冲突。罗兴亚人是穆斯林少数族裔，他们在
    1982 年几乎一夜之间失去了公民权。^(²⁰⁶)


    多年来，罗兴亚人一直遭受来自政府的法律歧视，以及来自不认同其宗教或族裔身份同胞的暴力。除了在教育、工作和法律地位上延续宗教歧视外，缅甸的佛教徒群体（常由僧侣领导）还定期举行集会，散播针对罗兴亚人的仇恨言论。这些集会甚至时常导致部分罗兴亚人丧生。


    暴力行为的规模以及针对罗兴亚人的精准程度，促使全球监督机构将反罗兴亚暴力定性为（未遂的）种族灭绝行为。^(²⁰⁷)


    缅甸在宣传方面也有着“悠久的历史”。《连线》杂志的蒂莫西·麦克劳林写道：“缅甸几十年来一直依赖国家运营的宣传报纸。”^(²⁰⁸) 几乎在整个大众传媒技术（报纸、广播、电视、互联网）的历史中，缅甸政府都控制着主要的媒体传播渠道。因此，对于如今生活在缅甸的人来说，他们一生中大部分时间所熟知的信息来源只有两种：独裁统治下的国有媒体，以及当地的谣言或闲言碎语。据美国前驻缅甸大使德里克·米切尔称：“缅甸是一个靠谣言运转的国家。”^(²⁰⁹)
    这一判断也与`Facebook`委托进行的一份人权影响评估报告不谋而合，该报告将缅甸描述为一个直到 2013 年左右仍“充斥着谣言的社会”。^(²¹⁰)


    所有这一切都发生在智能手机、`Facebook`或万维网出现之前。然而，数字技术的到来无异于往缅甸已经燃起的火焰上浇油。


    过去十年间，缅甸发生了两大关键变化：互联网（对大多数缅甸人而言，互联网基本等同于`Facebook`）的到来，以及（部分层面的）代议制民主的出现。


    尽管此前统治缅甸的军政府在 2011 年被解散，但人们普遍认为，缅甸首次真正开放的选举是在 2015 年举行的。^(²¹¹) 2015 年，部分缅甸人已经能够接入互联网，但正是在此之后，政府对新闻的审查以及对网络言论的控制才开始显著减弱（尽管并未完全消失）。由于数字技术的扩张恰逢长期存在的言论自由限制被削弱，缅甸普通民众普遍缺乏在互联网这样开放的信息环境中生存所必需的媒体和数字素养。而且，鉴于“对于缅甸
    2000 万联网公民中的绝大多数人来说，`Facebook`就是互联网”，^(²¹²fn212)) 这种媒体素养的缺失在`Facebook`的平台上感受最为深切。


    负面结果最初体现在缅甸佛教徒与穆斯林之间的整体关系上。新获得的言论自由以及能够接触到覆盖面广泛的平台，加剧了这两个群体间长期存在的敌意。同时，随着部分反罗兴亚人的歧视被写入法律，数字连接的增强尤其助长了佛教徒多数群体对穆斯林的压迫。正如布鲁金斯学会的一份报告所指出的：“独裁管制和新闻审查的突然取消——伴随着互联网和手机普及率的迅速攀升——为针对罗兴亚人的网络仇恨言论和仇外民族主义浪潮打开了闸门。”^([²¹³)


    即使在早期，仇恨言论及其引发的暴力行为也并非未知的问题。第一波借助社交媒体加剧的暴力事件发生在 2014 年。麦克劳林写道：“如果没有`Facebook`，这些骚乱就不会发生。”^(²¹⁴)
    就像推翻政府的“阿拉伯之春”起义一样，缅甸不断增强的连接性将紧张局势推过了临界点，使得 2014 年的大规模骚乱成为可能。麦克劳林还写道，`Facebook`在
    2014 年骚乱发生前，曾“至少收到过两次关于仇恨言论可能升级为暴力的直接警告”，但该公司将缅甸视为“连接机遇”，因而忽视了其平台上日益加剧的仇恨言论，以及这些言论可能在“现实生活”中煽动暴力的可能性。话虽如此，在
    2013 年，人权观察组织也*同样*否认了`Facebook`上仇恨言论激增是一个严重问题。对大多数人来说，首要的人权问题是如何增加数字技术的接入，以及这种接入必然会带来的社会、教育、经济和政治利益。


    当然，事与愿违。缅甸公民习惯了国家宣传与地方谣言工厂的结合体，他们并没有立即利用社交媒体，用平衡、深刻的新闻报道来取代国家宣传渠道。相反，他们在很大程度上将自己参与信息经济的角色转移到了这个新平台上——换句话说，他们把`Facebook`变成了他们过去习惯参与的那种地方谣言工厂的放大版。在一个被如此深层次的社会、政治和宗教紧张局势所困扰的国家，结果导致了虚假信息、错误信息和仇恨言论的增加，并进而造成了现实的人身伤害——这至少事后看来，并不令人意外。


    数字素养的匮乏、传播和轻信谣言的天性，以及根深蒂固的种族紧张关系，共同构成了缅甸军方针对本国人民发动心理战的背景。


    煽动针对罗兴亚人暴力的谣言和仇恨言论并非仅仅来自佛教徒公民，其中许多来源于缅甸军方。正如保罗·莫泽尔为《纽约时报》报道的那样，“一场在`Facebook`上持续了长达五年的系统性运动”中，“缅甸军方人员……将社交网络变成了种族清洗的工具。”^(²¹⁵)
    数百名军方人员在`Facebook`上创建虚假账号，用于监视公民、散布虚假信息、压制政府批评者、挑起对立团体间的争论，并发布关于罗兴亚人的“煽动性言论”。

    '
- fmt: 'While this operation primarily took place on Facebook, it was multifaceted.
    In addition to incendiary text, the Myanmar military also used images, memes,
    and peer-to-peer messages, including digital “chain letters” on Facebook Messenger.
    One thing that did *not* appear prominently in this operation is automation. Like
    in the Philippines, there was no significant presence of bots. A literal army
    of trolls waged information warfare by means of digital sockpuppets in real time.
    The similarity to the operations perpetrated by Russia’s Internet Research Agency
    during the 2016 U.S. elections is hardly coincidental. Though there is no evidence
    that Russia was involved in the Myanmar military’s operation, there *is* evidence
    that Myanmar military officers traveled to Russia and studied their information
    warfare tactics.^([^(216)](#fn216))


    The military’s primary target in this psychological warfare operation—or PsyOp—was
    the Rohingya people. But in 2017, some of their operations aimed at both sides,
    spreading disinformation to both Buddhists and Muslims, telling each that an attack
    was immanent from the other side. According to Mozur, “the purpose of the campaign
    … was to generate widespread feelings of vulnerability and fear that could be
    solved only by the military’s protection.” The fledgling, young democracy posed
    a threat to the military that until very recently ran the country. They took advantage
    of the people’s general lack of digital media literacy and their inexperience
    with democratic free expression, and turned that vulnerability into a weapon aimed
    at their own people. And by targeting the Rohingya, who were already the victims
    of misinformation and hate speech online, they threw fuel on an existing fire,
    contributing significantly to one of the largest humanitarian crises of the twenty-first
    century.


    ## Success in the Latin American Elections of 2018


    Summer 2018 was a busy time for Latin American politics. There were presidential
    elections in Colombia and Mexico, political theater masquerading as an election
    in Venezuela, and major unrest in Nicaragua, which was riddled with anti-government
    protests. I spent the summer primarily focused on monitoring and reporting on
    the elections in Colombia and Mexico and studying the Latin American (dis)information
    landscape more broadly. We observed nothing at the scale of what took place in
    the United States, the Philippines, or Myanmar—likely (hopefully!) because the
    social platforms have learned some lessons and started to implement changes that
    make it harder (though by no means impossible) to conduct effective disinformation
    operations. However, a counter-trend also emerged, where instead of one bad actor
    launching a campaign for or against a particular candidate, party, or people group,
    we observed many smaller operations in service of a variety of candidates and
    interest groups. We also observed a new trend that may explain the smaller-scale
    operations on Twitter and Facebook, but also poses a major threat to democracies
    in the near future: peer-to-peer messaging. Let’s unpack these trends.


    First, the social networks. As my colleagues and I summarize in our postelection
    report:


    - We analyzed content broadly collected on Twitter via key search terms, as well
    as more selective targets on Facebook. Overall, we found evidence of nine coordinated
    networks artificially amplifying messages in favor of or against a candidate or
    party in Mexico, and two coordinated networks in Colombia. While the volume of
    coordinated information operations in Colombia was noticeably lower, one of those
    operations was international in focus, aimed at stoking anti-government sentiment
    and action in Colombia, Mexico, Nicaragua, Venezuela, and Catalonia. While some
    of these networks were difficult to attribute, we traced some back to the responsible
    person(a)s, and at least two of them show indications of foreign involvement.^([^(217)](#fn217))


    Most of these networks were automated networks with little sophistication and,
    as far as we could tell, little impact. In fact, one of them, which was only online
    for roughly 48 hours, demonstrates the progress that the social platforms have
    made in detecting and removing *botnets*. This was a network of 38 Twitter accounts,
    controlled by an individual we traced on Facebook, each posting hundreds of messages
    per day that were taken from a small library of posts to choose from, resulting
    in hundreds of identical copies of each of these posts across the network. These
    messages were always in opposition to Ricardo Anaya, the presidential candidate
    who ultimately finished second, or in support of long-shot candidate Jaime Rodríguez
    Calderón, nicknamed “El Bronco.” We dubbed this botnet the Bronco Bots.'
