- fmt: 'These human relationships are of the utmost importance, as they are the end
    goal of the public influence operations. As significant as a close business tie
    with a real estate mogul and reality TV star is, that business tie or personal
    relationship becomes exponentially more valuable if that asset becomes the president
    of the United States. Not only is that asset a “friend in high places,” but that
    asset also has a personal financial motivation to work in the interests of his
    foreign business associates. Even more so should those associates, or others with
    whom they are coordinating, come to possess `kompromat` (the intelligence industry’s
    term for compromising material) about the would-be president or his inner circle.
    As tantalizing as the investigation into these alleged and attempted relationships
    can be, they are ultimately not what this book is about.


    This book is about how big data and information can influence people and alter
    history. And so, I will focus on the activity of the `GRU` and the `IRA`, two
    organizations that were successful at influencing public discourse, spreading
    falsehood, and setting the lion’s share of the agenda in the final weeks of the
    presidential election. We may never know how many votes—popular or in the Electoral
    College—were won or lost by their activities. But there is no doubt that their
    activity influenced the issues that Americans took with them into the voting booth,
    and even at the end of 2018, the content they published in 2016 is still circulating
    and driving political conversations. (And that’s to say nothing of the work they
    have done since then, both detected and undetected.)


    Let’s start with Fancy Bear.


    ### Fancy Bear Crashes the Democratic Party


    The `GRU` has likely been focused on the United States for some time. They have
    certainly had their eyes fixed on the West in recent years. For example, in April
    2015, Fancy Bear hacked into TV5Monde in France and posted messages on the national
    television network like, “Soldiers of France, stay away from the Islamic State!
    You have the chance to save your families, take advantage of it. The CyberCaliphate
    continues its cyberjihad against the enemies of Islamic State.” While initial
    signs pointed to a possible ISIS attack, security experts ultimately determined
    the source of the attack to be an IP address associated with the `GRU`.^([^(150)](#fn150))


    One of the earliest direct signs that they intended to conduct an operation to
    influence or discredit the outcome of the 2016 U.S. presidential election was
    in October 2015, when the `GRU` began targeting the email account of Democratic
    National Committee (`DNC`) director of voter protection, Pratt Wiley. According
    to the *Chicago Tribune*, Fancy Bear hackers “tried to pry open his inbox as many
    as 15 times over six months.”^([^(151)](#fn151)) This, of course, raised the specter
    of possible hacks into voting machines to change vote counts in precincts with
    fully electronic voting.


    While cybersecurity experts generally agree that Russia did not change any electronic
    vote tallies in the United States in 2016, they *did* manage to break in and steal
    personal information about U.S. citizens from voter registration records in states
    such as Illinois.^([^(152)](#fn152)) Election officials across the United States
    shored up election security and in some cases returned to paper ballots, at least
    as a backup. But even as the U.S. midterm election approached in November 2018,
    security experts and election officials across the United States were worried
    that many precincts around the country would not be able to withstand an attack
    on vote tallies if it *did* come. But even that isn’t the greatest fear of many
    election officials. As NPR reported in a story about the Illinois data breach:


    - Illinois is investing a few million dollars in federal money to help some of
    the state''s smaller voting jurisdictions secure their data and equipment. Some
    counties don’t even have their own IT staff. But officials here are less worried
    about hardware and software. They’re more concerned that even a modest breach
    could undermine voter confidence in the machinery of our elections.^([^(153)](#fn153))


    Where changing voter tallies or bringing down machines on election day could be
    a devastating attack on the U.S. democratic system, perhaps just as effective—and
    certainly more *cost-*effective—would be a *discrediting* of the election results.
    If voter confidence were brought down far enough, it could depress turnout. And
    you can’t recount votes that were never cast. If you targeted that voter confidence
    to a specific demographic or geographic region that leaned heavily one way, you
    could depress votes for a single party predictably and irreversibly. And if that
    took place in a large swing state with a large pool of electoral votes and a close
    final tally, you *could* theoretically swing an election.


    Swinging an election isn’t the only end game. Discrediting the process can call
    the results into question, and if enough citizens feel the election was illegitimate,
    it can make it difficult for the election winners to govern. This appears to be
    the underlying motivation of Fancy Bear’s wildly successful campaign to hack the
    Clinton campaign and the Democratic National Committee.'
