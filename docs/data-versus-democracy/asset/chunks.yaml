  trans: '

    # 社交媒体中的偏见放大


    在 Facebook 或 Twitter 等社交媒体平台上，偏见放大效应可能更为显著。用户信息流的内容已经过好友筛选和点赞页面的过滤。由于我们本就倾向于与同类人（而非异己者）建立更多联系，这本身已构成一个巨大的潜在过滤气泡。当过去的互动数据及协同过滤结果也被纳入考量时，我们能看到的内容会变得极为狭窄。即便关注立场更多元的页面或与观点相异者交友来干预，其效果也有限——这只能影响第一层过滤器，却无法改变基于协同互动的过滤器。正因如此，拥有许多共同好友的密友或家人，仍可能在各自的信息流中看到截然不同的内容。由于我们精心维护的好友/页面/群组网络，以及“点赞”和其他互动行为，往往反映着个人偏见与视野局限，我们在平台上接触到的内容自然也会呈现这些偏见与局限。


    ## 偏见内容的传播


    这就引出了第二点：如果算法推荐给我的内容以反映我既有思维方式的方式呈现偏见，我不仅更可能*与这种偏见互动*，*更有可能传播它*。越来越多的人通过社交媒体平台获取新闻。^(⁶⁴)
    但既然在 Facebook 或 Twitter 这类一站式平台*找到*信息如此便捷，不妨想想在平台上*分享*信息有多容易。只需轻点一两次，我就能转发遇到的某篇文章、照片或视频——甚至不必*阅读*全文或看完视频，只要预览内容足够吸引我。这一点在
    Twitter 和 Facebook 等算法信息流中尤为突出，但与纸质报纸或大学教材中专家策划的内容截然不同。


    ## 偏见放大的反馈循环


    这种分享优化进一步加剧了过滤气泡效应。由于更容易找到反映既有偏见的*信息*，也更容易将其分享，我对他人的信息流的贡献将比单纯分享互联网上其他内容时更能体现个人偏见。当然，他人对我信息流的贡献也是如此。这就形成了一个偏见放大的反馈循环：我看到符合偏见的内容，从中筛选部分内容进行分享（筛选依旧基于偏见），这些内容进入我社交网络中他人的偏见内容池，他们再从中筛选符合自身偏见的内容分享回来，如此循环往复。正如引言中的图像搜索结果（可能更极端），若不加以控制，这种反馈循环将持续放大用户已有的偏见，且随着越来越多人通过社交媒体信息流获取新闻、算法越发精准，这一进程会不断加速。考虑到点击诱饵等现象能主导我们的注意力，在算法驱动的内容流中，不仅反映自身偏见的内容会加速传播，那些精心设计以操控注意力的内容同样如此。两者结合，证实我们既有偏见的点击诱饵应以不成比例的高速度传播。事实上，这正是我们在
    2016 年美国总统大选前等关键时期所目睹的现象。^(⁶⁵) 但或许最重要的是，由此产生的扭曲媒体消费将强化我们个人和社会的刻板印象，影响线上线下的行为与关系。


    ## 单向放大与多向放大


    有时偏见放大是单向的。在引言中讨论的性别、种族及其他人口统计特征代表性问题中，主导群体已长期占据优势，算法往往倾向于放大同一方向的普遍偏见。但情况并非总是如此。在政治领域（尤其在美国），群体相对均等地分为两派，偏见的放大就不是单向的，而是双向或多向的。其结果便是*极化*。


    ## 极化效应


    极化不难理解。它指两个或多个对立群体间意识形态差异和/或敌意的加剧。^(⁶⁶) 数字极化在很大程度上是偏见放大反馈循环作用于已趋同群体后的结果。随着偏见在群体内被放大，它逐渐成为“过滤气泡”或“回音室”，其中内容不加批判地推崇群体内思维，并毫无保留地诋毁对立群体。火上浇油的是，我们还知道（如第
    2 章所述），当内容激发情感共鸣——无论是积极还是消极情绪，尤其是愤怒——互动频率会显著提升。这意味着不仅支持你观点、否定其他观点的内容增多，而且引发对群体外成员愤怒的内容被大量分享和转发。这使得即便更多元的内容成功穿透过滤器，倾听对立声音也变得更加困难。

    '
- fmt: '# Letting Your Guard Down


    There’s another major problem that, left unchecked, causes algorithmically selected
    content to increase bias, polarization, and even the proliferation of “fake news.”
    Social platforms are designed for optimal engagement and primed for believability.
    Or, in the words of Renee DiResta, “Our political conversations are happening
    on an infrastructure built for viral advertising, and we are only beginning to
    adapt.”^([^(67)](#fn67))


    There are several facets to this. First, social media encourages a relaxed posture
    toward information consumption and evaluation. By putting important news and policy
    debates alongside cat GIFs, baby pictures, commercial advertisements, and party
    invitations, social media puts us in a very different—and less critical—posture
    than a book, newspaper, or even magazine. Many users check social media when they
    are waiting in line at the store, riding the bus or train to work, even lying
    in bed. The relaxed posture can be great for social interactions, but that inhibition
    relaxation combined with the “attentional blink” that comes from shifting between
    cute cats and neo-Nazi counterprotests can make it difficult to think critically
    about what we believe and what we share.


    Second, social media platforms are designed to promote engagement, even to the
    point of addiction. The change from a star to a heart for a Twitter “favorite,”
    the increased emotion-based engagements on Facebook, all of these measures were
    taken in order to increase user engagement. And they worked.^([^(68)](#fn68))
    Meanwhile, former employees of Google, Twitter, and Facebook have gone public
    with ways the platforms have been designed to promote addictive behavior,^([^(69)](#fn69))
    and an increasing number of Silicon Valley tech employees have announced that
    they severely limit—or even prohibit—screen time for their own children.^([^(70)](#fn70))
    Promoting engagement, even addictive behavior, alongside relaxed posturing is
    mostly harmless when it comes to baby pictures and cute cat videos, but it is
    not a recipe for careful, critical thinking around the major issues of the day.


    Adding fuel to this fire, a recent study suggests that people judge the veracity
    of content on social media not by the *source* of the content but by the credibility
    of the *person who shared it*.^([^(71)](#fn71)) This means that even when we exercise
    critical thinking, we might be thinking critically about the wrong things. And
    platforms aren’t much help here. Most social platforms take steps to highlight
    the sharer (bold text, profile picture, placement in the upper left of the “card”)
    and downplay the originating source (smaller, lighter text, placement in the lower
    left of the card)—assuming the domain hosting the article is the primary source
    of the narrative, anyway.^([^(72)](#fn72)) This only exacerbates the tendency
    to judge a message by the messenger instead of the source.


    Psychologists Nicholas DiFonzo and Prashant Bordia study the spread of rumors
    online, and they have identified four primary factors that contribute to whether
    or not someone believes a new idea or claim of fact they encounter:


    - The claim agrees with that person’s existing attitudes (confirmation bias).

    - The claim comes from a credible source (which on social media often means the
    person who shared it, not the actual origin of the claim).

    - The claim has been encountered repeatedly (which contributes to *perceptual
    fluency*).

    - The claim is not accompanied by a rebuttal.^([^(73)](#fn73))


    In many ways, social media is engineered to bolster these factors, even for false
    narratives. We’ve already seen how engineering for engagement via collaborative
    filtering exacerbates the problem of confirmation bias and how on social media
    we often evaluate the wrong source. We’ve also discussed at length how repetition,
    especially when unconscious, can erode our ability to critically evaluate a false
    narrative. Both Twitter’s retweet feature and Facebook’s resurfacing of a story
    in our feeds every time it receives a new comment facilitate this. After all,
    we wouldn’t want to miss out on a lively discussion among our friends! And we
    know that rebuttals spread far more slowly than the viral lies they seek to correct.^([^(74)](#fn74))
    Social platforms as they exist today really are built to foster a sense of believability,
    regardless of what the truth really is.


    Taking all these facts together, the deck is stacked against us for critical information
    consumption. Social platforms are designed in ways that make critical consumption
    hard and the sharing of unsubstantiated “truthy” claims easy. At the same time,
    more of us are getting more of our news from our social feeds, and we haven’t
    even talked about the role that social media plays in how print, radio, and television
    journalists find their scoops and frame their stories. Left unchecked, fake news,
    filter bubbles, and polarization will only get worse. And given the importance
    of an informed electorate to a democratic republic, the algorithmic news feed
    represents a real threat to democracy.


    That said, platforms have made changes in both attitudes and algorithms over the
    past two years. They still have a ways to go, and new “hacks” to the system are
    emerging all the time, but it feels to those of us who research this problem like
    we are finally headed in the right direction. It’s time to capitalize on that
    and press forward as hard as we can, before new tactics and waning public pressure
    usher in a new era of complacency.'
