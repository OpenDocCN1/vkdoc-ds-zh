- fmt: '## Summary


    So far, we’ve unpacked a lot of “theory” behind disinformation and online propaganda.
    The limits of human cognition, along with the affordances of social platforms
    and content recommendation algorithms, make it easy for half-truths and outright
    lies to spread, for biases to amplify, and for ideologically motivated groups
    to drift further away from each other—and further from the possibility of meaningful
    dialog and compromise.


    These problems aren’t simply organic. They don’t only happen by accident, as flawed
    but well-meaning people interact on platforms designed by other flawed but well-meaning
    people. Polarization, bias, and distrust-at-scale are also fostered by bad actors,
    including state actors, who take advantage of these flawed systems and our increasing
    reliance on them.


    In the remainder of this book, we will walk through several case studies that
    lay out a number of specific disinformation campaigns, or *influence operations*,
    that starkly depict the dangers we face when we rely uncritically on a small number
    of algorithmically driven platforms for our information consumption and political
    exchanges. But embedded in some of these case studies—and the way the public,
    governments, and/or platforms have responded to them—is hope as well. There are
    personal habits, platform modifications, and governmental tactics that work, which
    help digital media, even social media, become (again?) a force for good in the
    world.


    That’s what we’ll explore together in the second half of this book…


