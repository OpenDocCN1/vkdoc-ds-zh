    # Part I The Propaganda Problem


    # 1. Pay Attention


    ## How Information Abundance Affects the Way We Consume Media


    This chapter will explain the shift from an information economy to an attention
    economy and lay out the implications for how information is created, shared, and
    consumed on the internet. Having transitioned from a time of information scarcity
    to information abundance, information is no longer a sufficiently monetizable
    commodity to drive an economy. The focus of human attention as the monetizable
    commodity in limited supply gives content recommendation algorithms a pivotal
    place in our information landscape and our economy. This chapter lays out the
    general economic, cognitive, and technological backdrop for the emergence of those
    algorithms.'
