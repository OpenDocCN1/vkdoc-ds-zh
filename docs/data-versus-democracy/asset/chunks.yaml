    \   [11](#469027_1_En_1_Chapter.xhtml#Fn11_source)   [12](#469027_1_En_1_Chapter.xhtml#Fn12_source)\
    \   [13](#469027_1_En_1_Chapter.xhtml#Fn13_source)   [14](#469027_1_En_1_Chapter.xhtml#Fn14_source)\
    \   [15](#469027_1_En_1_Chapter.xhtml#Fn15_source)   [16](#469027_1_En_1_Chapter.xhtml#Fn16_source)\
