  raw: '# 2. Cog in the System


    How the Limits of Our Brains Leave Us Vulnerable to Cognitive Hacking


    In an attention economy, understanding cognitive psychology gives an informer
    (or a disinformer) a major advantage in influencing opinion. What attracts attention?
    How do you hold attention? And how, over time, do you manipulate attention in
    ways that serve your purposes? These are key questions that we need to find answers
    to before we can fully grasp the role technology plays in influencing opinion.


    ## Clickbait: You Won’t Believe What Happens Next!


    Don’t you hate clickbait? Those online titles like “This Father Found a Rattlesnake
    in his Infant’s Crib, and You Won’t Believe What Happened Next!” or “27 New Dinner
    Plans that You Need to Try Before You Die!” As cheap and as cheesy as they sound,
    these titles are highly engineered, based on research into the clicking habits
    of millions of users online. Search something like “how to write a viral headline,”
    and you’ll find no limit of marketing how-to’s telling you to use odd numbers
    and phrases that create a sense of urgency.


    Why have these titles (and, for that matter, the articles attached to them) become
    so ubiquitous? Clickbait represents, perhaps better than anything else, life on
    the modern web. The abundance of free content and the limits of the attention
    economy have media outlets competing for clicks and the advertising dollars they
    represent. But because even high-quality information can be readily found with
    little effort, or money, many media outlets no longer compete to have the best
    content, but to have the most attention-grabbing content.


    That’s because in an attention economy, those who thrive aren’t those who control
    information—the ones with access to the biggest libraries or the best content.
    In an attention economy, those who thrive are those who control attention—those
    who can master their own attention and those who can attract, and hold, the attention
    of others.


    But just what is attention? And why is it that the one, two, or three things we’re
    aware of at any given moment can so readily dominate the massive store of memories
    we have tucked away in our brains?


    ### Mapping the Cognitive System


    Think of your computer. It stores data in several different places—the hard drive,
    RAM, the processor’s cache—each with its own function, and with its characteristic
    strengths and weaknesses. The hard drive is the largest data store. Even my 13-inch
    laptop can hold a terabyte of data on its hard drive. But compared to other data
    stores, it is also the slowest and least efficient when it comes to accessing,
    writing, and erasing data.


    RAM (random access memory) , on the other hand, is considerably smaller, but also
    faster and more flexible. Because of its power, and its limited size, applications
    are constantly vying for access to it, and memory management is a key element
    of optimizing the performance of any app or algorithm.


    Even smaller—and more powerful—is the cache memory that lives on the processor
    itself. This is where the action happens. But it is severely limited according
    to what the processor itself is capable of. That’s because data storage means
    nothing if you can’t *do* something with it. The computer’s data processing capability
    ultimately sets the limits for what we can do with data.


    This hard drive, RAM, cache, processor model is a helpful analog for the human
    cognitive system. It’s an oversimplification, of course, but it’s a helpful starting
    point, especially if we want to know how the brain interacts with (big) data.


    In many ways, the brain is one big hard drive. There’s a reason that we refer
    to a computer’s data storage as “memory,” after all. Both the brain and the hard
    drive store information in small, hierarchically organized units, which are activated,
    transferred, and copied via electrical signals. Some cognitive scientists even
    use the language of “bits” to describe the information our brains process.^([^(35)](#fn35))


    But rather than having separate organs for large/slow storage, fast/efficient
    storage, and data processing, the brain does it all in one massively complex,
    and flexible, organ. However, the brain’s capabilities *are* separated analogously
    to how a computer works. (Well, technically, it’s the *computer* that works like
    the *brain*.) The largest share of the brain’s storage capability is less efficient
    and not directly accessible to the “processor.” This is typically called *long-term
    memory* (LTM)—where we keep memories of life events (*episodic memory*), physical
    skills and processes (*procedural memory*), and important information like the
    identity of friends or the meaning of words (*semantic memory*).^([^(36)](#fn36))
    It’s massive. Each human brain contains the informational complexity of the entire
    universe of stars, planets, and galaxies.^([^(37)](#fn37)) But we can’t access
    it all at once. That’s just too much for the brain to handle. We need something
    to help us manage all of that data.


    ## The Limits of Conscious Attention


    That’s where working memory comes in. Working memory is the combination of what
    scientists call the “central executive” (the brain’s CPU) and several independent
    resources for short-term, high-efficiency storage, often called *short-term memory*
    (STM—the brain’s RAM).^([^(38)](#fn38))


    Think of it this way. Every memory ever formed—every event you’ve experienced,
    every word you know, every friend and family member, every skill you’ve formed—is
    stored somewhere in your long-term memory (LTM). Because it takes energy (in the
    form of electrical signals) to access these memories, only some of those memories
    are “activated,” like an application launched and ready to use, or books taken
    off the shelf and ready to be read. This is short-term memory (STM). When something
    is activated and placed in STM, it’s only there for a short amount of time. That
    is, unless we do extra work to keep it alive. (Cognitive musicologists call that
    work “rehearsal,” but it’s actually a lot like renewing a library book before
    it’s due.) When memories are in STM, we can do more with them—put them in order,
    forge relationships between them, and build higher-level groupings of them (called
    *schemas*). But only some of what we’ve called into STM forms conscious awareness—the
    small amount of information being processed *right now*. That’s the information
    that makes up the focus of our *attention*.'
