- fmt: '# How Taste Is Made


    What’s your favorite dessert?


    Mine is probably a nice flourless chocolate cake. With raspberries, blackberries,
    maybe some ice cream, … and, of course, something like an espresso, Americano,
    or a full-bodied stout to drink—something that can cut through that richness and
    cleanse the palate so that each bite is as wonderful as the first.


    I feel like I gained a few pounds just *writing* that paragraph. Why is it that
    everything that tastes so good is so bad for you?!


    Or is it?


    When I first studied evolutionary psychology in college, I remember learning that
    humans generally evolved preferences for things that are *good for us*.^([^(11)](#fn11))
    Things that are safe and help us live at least to the age of reproduction, so
    we can pass on our genes. Humans who associate something with a positive emotion
    will do that thing more often. Things that we associate with negative emotions
    we tend to avoid. We seek out pleasure more than pain, and our ancestors who took
    pleasure in things that helped them survive and reproduce, well, they survived
    and reproduced. Those who took pleasure in things that put them in danger, well,
    less of those genes were passed on to future generations. The result is that the
    genes we twenty-first-century humans have inherited generally make us feel pleasure
    around things that are good for the species, but produce pain to warn us away
    from things that would jeopardize our collective survival.


    Of course, this emotional preference, this *taste*, for things that are biologically
    and socially good for the species also applies to food. Foods that are good for
    us tend to give us pleasure, while things that are bad for us tend to taste bad,
    or trigger our gag reflex.


    Wait a second. That seems backward. Didn’t I just lament about how everything
    that tastes *good* is actually *bad* for us?!


    There’s another piece to this evolutionary puzzle. Those evolved preferences,
    called “adaptations,” helped our ancestors adapt to their environment. To *their*
    environment. Let’s go back to that flourless chocolate cake. What are the ingredients?
    Cocoa (of course), sugar, salt, butter, and lots and lots of eggs. Nutritionally
    speaking, there’s not a lot of vitamins, minerals, or fiber—things we hear a lot
    about today. Instead there are carbohydrates—“simple” sugars, to be precise—fat,
    and protein. We hear a lot about these things from modern nutritionists, too.
    They lead to overweight, obesity, heart disease, diabetes, kidney disease, even
    gum disease and tooth decay. These ingredients sit nearer the top of the food
    pyramid, things we should consume sparingly.


    If we should consume them sparingly, then why did we evolve such a strong taste
    for them? For those of us in the affluent West, 2000 calories a day are easy to
    come by. But the genes that determine our culinary tastes *today* were not selected
    in an era of such abundance. Those genes have changed little since the Pleistocene
    period, tens to hundreds of thousands of years ago.^([^(12)](#fn12)) Our metaphorical
    palates were developed in a time before grocery stores, fast food restaurants,
    fine dining, potlucks, refrigerators, freezers, even a time before agriculture.
    Long before humans built a tractor, a plow, a saddle, even a bow and arrow, our
    modern food preferences were being written into our genetic code.


    Carbohydrates, fat, protein. While today we highlight the dangers of consuming
    them in excess, all of them are essential for our bodies to produce energy, build
    muscle, and keep in good working order. All of them are relatively easy to come
    by in a society with the technology to farm and hunt efficiently, not to mention
    the technology to preserve food and all its nutritional value for long stretches
    of time. But 150,000 years ago on the African savannah, our ancestors had no such
    technology. Those biological essentials—carbs, fat, protein—were *scarce*. Incredibly
    scarce. The human who took pleasure in consuming them would seek them out and,
    presumably, be more likely to find them and survive. And in an era when many humans
    lived on the brink of starvation, those who did not seek out those precious ingredients
    often did not survive to pass along their genes to us. It was the survivors who
    authored our genetic code, and it is their taste for what was scarce but essential
    aeons ago that governs our culinary predilections today.


    And so we love things like flourless chocolate cake. Not because our ancestors
    adapted a taste for chocolate cake, but because it’s the perfect combination of
    all the essential, but scarce, things they evolved a taste for.


    I mentioned before that our genetic code hasn’t changed much since the Pleistocene
    era. That’s because humans living in an era of abundance don’t get to write the
    genetic code! If most of humanity is no longer living on the cusp of starvation,
    there is no food-related natural selection going on. Death drives evolution, and
    genetic flaws get selected out, not the other way around. Take allergies as an
    example: my spouse and I have severe enough allergies that had we lived 100 years
    earlier, we both would have died from anaphylaxis before we reproduced. Thanks
    to modern medicine, we survived! And we both passed our allergy genes onto our
    children, leading to some severe medical situations in just the first few years
    of their lives. Once we’re no longer on the brink of extinction, those *health*
    advantages aren’t *evolutionary* advantages. And so, what was advantageous in
    our species’ distant past still governs our preferences today.'
