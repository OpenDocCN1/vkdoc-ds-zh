  trans: '

    ## 你不能只是戒掉网络：Gamergate 如何将社交媒体变成“现实”武器


    2014 年，一群活动人士开始涌现、组织，并在`Twitter`上在全国范围内传播他们的信息。他们发起的战斗并不新鲜，但某些策略是新的，他们的组织方式以及意识到自己既众多且强大也是新的。这个由精通技术的活动人士组成的松散联盟找到了彼此，招募了其他人，并抵抗了敌人的攻势。他们的在线策略产生的影响在“现实”（即物理）世界中具有显著效果。


    虽然这些陈述对于弗格森的抗议者来说都是正确的，但这实际上并不是我在这里要讨论的内容。2014 年，另一个群体也登上了全国舞台，也主要是通过`Twitter`。这个群体就是
    Gamergate。这个群体不是为了社会正义而战，而是发起了一场明确的*反*社会战斗，对抗他们所谓的“社会正义战士”或`SJW`。这些 Gamergate
    成员——主要是年轻、白人、异性恋、男性——谴责游戏的多元化，认为这是对异性恋白人男性“少数群体”的攻击。但这不仅仅是言辞或观念之战，而是一场涉及人身暴力威胁的战斗，这些威胁如此真实，以至于收到威胁的人为保命而逃亡。而且这并没有止步于
    Gamergate。正是从那个群体中形成了一种新的运动——所谓的另类右翼。这场运动不仅在 2016 年美国总统大选中在改变基调（以及可能改变一些选票）方面发挥了关键作用，而且他们的文化战争还导致了
    2016 年 12 月华盛顿特区一家披萨店的枪击事件，以及 2017 年 8 月弗吉尼亚州夏洛茨维尔社会活动家希瑟·海耶的死亡。


    但在我们深入讨论另类右翼之前，首先需要剖析导致其崛起的那些事件：Gamergate。


    ### 佐伊·奎因与那篇来自地狱的博客文章


    2013 年，独立游戏开发者佐伊·奎因发布了一款游戏《抑郁探询》。这不是你刻板印象中的游戏。当然，这恰恰是重点所在。自 20 世纪 80 年代以来，公众对电子游戏的看法一直由角色扮演游戏（例如《魔兽世界》）、第一人称射击游戏（例如《使命召唤》）和体育游戏主导。在这些刻板印象游戏中，对竞争、征服和暴力的强调与刻板印象中的*游戏玩家*——一个居住在郊区的青春期（异性恋、白人）男性——紧密相连。游戏本身、竞争甚至暴力都没有固有的男性气质。但在西方文化，特别是美国文化中，竞争性、领导力和英雄主义（常常与“好人”的暴力行为混淆）不幸地与某种男性气质的观念纠缠在一起。


    奎因的游戏——以及她作为游戏玩家的形象——几乎完全是相反的。一位认同酷儿身份的女性，她还将芯片植入体内以便成为“半机械人”，奎因代表了游戏玩家截然不同的形象。同样，她的游戏《抑郁探询》并非旨在让玩家在杀死纳粹或保护地球免受外星人入侵时获得肾上腺素激增。它甚至不追求好玩。相反，《抑郁探询》旨在提高人们对个体经历抑郁时的感受的认识，这是奎因本人也曾经历的。无论它是否是一款“好”游戏（我本人从未玩过），它一定会作为一款重要的游戏载入史册——不仅因为它展示了一款游戏可能是什么样子，而且因为围绕它而形成的运动。


    我真希望我在谈论的是一场支持和鼓励拓展公众对游戏（或玩家）可能性的认知的运动。不幸的是，随之而来的并非那样的运动。


    奎因此前已经因为她的游戏及其获得的媒体关注而面临来自“传统”/刻板印象游戏玩家的一些反弹。一款像《抑郁探询》那样突破界限的游戏，尤其是一款由来自 LGBTQ
    社群的女性游戏开发者创作的，必然会成为评论文章的话题，而这自然导致了一些负面（以及正面）的回应。但就在 2014 年 8 月，另一件事发生了。


    奎因和她的男友埃隆·乔尼分手了。过程并不愉快。包括奎因本人在内的其他人已经写过相关细节，所以我就不多赘述了。关键结果是，乔尼在一次预谋的愤怒中，发布了一篇博客文章，指控奎因与游戏新闻网站`Kotaku`的一名记者睡觉，以换取对她游戏的正面评价。然而，这种评价根本不存在。尽管如此，多年来对游戏多元化的积怨，加上一篇特意为了利用这种愤怒而精心撰写的博文，最终导致了网络上的大爆发。对“佐伊之文”的讨论催生了自己的子版块
    *quinnspiracy*，并主导了`4chan`——一个孕育了表情包、rickroll、“史诗级失败”和川普列车，以及大量性别歧视、种族歧视，偶尔还有协调性网络骚扰活动的超级极客网站——以及`8chan`——一个供那些认为`4chan`过于“政治正确”的人使用的网站（用本·施雷金格的话来说，`8chan`之于`4chan`，就像
    ISIS 之于基地组织）。


