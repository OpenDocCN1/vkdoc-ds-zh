    # 6. Democracy Hacked, Part 2


    Rumors, Bots, and Genocide in the Global South


    New technology is neither inherently good, nor inherently bad, nor inherently
    neutral. When it comes to new ways to communicate and to share information, new
    technology irreversibly alters the social structure of a community, making new
    things possible and rendering the old ways of doing things inaccessible. When
    a community is already experiencing social change or tension, this only adds fuel
    to the fire. New access to information can lead to positive social change, but
    tools like social media can also be turned into a weapon. New tech plus new social
    structures can bring great instability and uncertainty to a society. That story—far
    more than foreign meddling—has played out repeatedly throughout the Global South.'
