    Today,” an international, Russian-state-owned media outlet), and numerous covert
    channels, Russia flooded Sweden with propaganda.^([^(142)](#fn142)) This propaganda
    included standard Russian narratives: anti-NATO messaging, fear mongering about
    impending nuclear war (caused, of course, by U.S.-led NATO action), narratives
    about how the EU is in decline, and even anti-GMO and anti-immigration narratives.^([^(143)](#fn143))
    This was, of course, alongside the dissemination and amplification of false narratives
    surrounding the Sweden-NATO agreement.


    Researchers Martin Kragh and Sebastian Åsberg studied this Russian influence operation
    extensively. They found that, like is common for Russia, “Misleading half-truths
    are the norm” and “outright fabrications occur on a limited scope.”^([^(144)](#fn144))
    While they did find a number of easily disproven fabrications and forgeries, most
    Russian messaging amplified Russia-friendly narratives that already existed in
    Swedish culture, particularly from groups on the fringe.


    One sequence of false narratives stands out, in particular. Beginning in late
    2014, there were several sightings of unidentified foreign submarines on or near
    the Swedish coast. These sightings were credible and were reported in legitimate,
    mainstream outlets. But these weren’t the first time that strange things had happened
    involving foreign submarines on the Swedish coast. Kragh and Åsberg write:


    *   When the Soviet submarine S-363 ran aground in 1981 on the south coast of
    Sweden, a forged telegram soon appeared in media purportedly written by the Swedish
    ambassador to Washington, Wilhelm Wachtmeister. The telegram expresses the ambassador’s
    profound disappointment over a secret agreement between Stockholm and Washington,
    providing U.S. sub-marines access to Swedish military bases in wartime. The telegram
    was immediately revealed as a Soviet forgery, but its content continued to circulate
    in the Swedish debate.^([^(145)](#fn145))


    Russian propagandists capitalized on this, not only spreading false rumors about
    the 2014–2015 submarines but explicitly connecting them to the old, false (yet
    still believed by many) rumors of secret military arrangements between the United
    States/NATO and the Swedish that might anger Russia and put Sweden on the frontlines
    of a (nuclear) World War III.


    The Sweden-NATO host agreement was ratified in May 2016, but Russian influence
    operations continue in Sweden to this day. According to a journalist who allegedly
    worked undercover in Russia’s Internet Research Agency (the ones responsible for
    Project Lakhta), Russian propagandists had their sights set on Sweden’s 2018 national
    election.^([^(146)](#fn146)) And it only makes sense. The NATO threat that Russia
    perceives hasn’t gone away, and if anything, Russian military pressure seems to
    be increasing in the Baltic and Scandinavia.^([^(147)](#fn147)) There’s no reason
    to expect Russian information warfare in Sweden to let up any time soon.


    ## Fancy Bear and the Great Meme War of 2016


    Russia is known or suspected to have conducted numerous other campaigns of information
    warfare online, but the one that has likely received the most detailed scrutiny
    is their effort to influence the 2016 U.S. presidential election. Russia conducted
    *at least* four influence operations around the 2016 U.S. presidential election
    aimed at removing Western roadblocks to Russian geopolitical aims, in particular
    the removal of Obama-era sanctions against Russia and Russian oligarchs. All of
    these operations—and likely others of which the American public is not (yet) aware—are
    directed from the Presidential Administration: Vladimir Vladimirovich Putin and
    his closest associates.


    The first influence operation was the work of a team of hackers within Russian
    military intelligence (the GRU), a team known as APT28, or Fancy Bear. Fancy Bear
    hacked key Democrat targets and made public compromising material to discredit
    them and hurt Hillary Clinton’s chances of winning the election. The second public
    influence operation was undertaken by the Internet Research Agency (IRA) on social
    media platforms like Facebook, Instagram, Twitter, YouTube, Tumblr, Medium, and
    others. They created and amplified media that supported Donald Trump, denigrated
    Hillary Clinton, and encouraged many groups on the American political left to
    vote third party or disengage from the electoral process. Both of these operations
    were aimed directly at American citizens, and took place in public, online.


    Two other more covert and more business-oriented operations were conducted simultaneously.
    One involved the cultivation of human assets by building relationships between
    Russian operatives like Maria Butina and American public figures and business
    leaders, mostly (but not exclusively) on the political right. In the case of Maria
    Butina, who was convicted for conspiracy against the United States in 2018, the
    goal appears to have been to build solidarity between Russia and American conservatives,
    possibly in the hopes of convincing them to eliminate sanctions against Russia
    if/when they came to power.^([^(148)](#fn148)) The other operation saw Russian
    oligarchs and business leaders seeking to cultivate financial relationships with
    Donald Trump, his family, and his close associates and advisors. This is hardly
    different from how Putin’s Presidential Administration relates to Russia’s oligarchs
    and business leaders. Russia operates under a quid pro quo relationship between
    the government and businesses, enriching those involved in this relationship,
    and making it difficult for their competitors to do business, at least on a level
    playing field. Where in the United States a corrupt individual may (attempt to)
    bribe a public official with a payout in return for favorable legislation, in
    Russia it is more common to enter into a business relationship, or joint ownership
    of an asset, where the government official enacts favorable legislation or regulation
    so that the business thrives, enriching both the corrupt business person and the
    corrupt public official. (For a deep dive into these kinds of practices, see *Putin’s
    Kleptocracy: Who Owns Russia?*^([^(149)](#fn149)))'
