- fmt: '### How Fancy Bear Got In


    Have you ever seen the movie *WarGames* (1983)? It’s not exactly recent, but it
    illustrates perfectly the kind of hacker mindset that underlies the specific techniques
    used by Fancy Bear leading up to the 2016 election. In *WarGames*, the protagonist,
    David Lightman, wants to change his high school biology grade to avoid going to
    summer school. The school’s grade database is (somewhat shockingly for 1983) accessible
    “online”—that is, by modem access over the phone lines from a compatible computer.
    The database is protected by a password that changes on a regular basis, which
    David doesn’t have, and would only last for a short time anyway. David could try
    a brute-force method, like algorithmically generating random passwords until he
    guesses the correct one, which could work with a simple enough password and a
    lot of time. But it would spike system login attempts over a prolonged period
    of time, raising the likelihood that his attack would be detected. Instead, he
    uses a *human intelligence* or HumInt (pronounced *hyoo-mint*) method. He (purposefully?)
    gets in trouble at school on a regular basis and sent to the main office for a
    talk with the principal. While there, he discovers where the database password
    is kept and regularly notes the new password as it is changed. He gets in trouble
    frequently enough that his presence near the location the password is written
    raises less red flags than multiple access attempts from the computer at his home
    phone number would. And so his password theft and grade change go undetected by
    the school.


    A little later in the movie, David is searching for the servers of a video game
    company so he can attempt to play a new game before it is released (and, presumably,
    without paying the price of new computer software in the early 1980s!). As he
    probes phone numbers in the geographical vicinity of the video game company, he
    stumbles upon a few other interesting computer connections. After making a phony
    reservation for a trip to Paris with a female classmate he wants to impress, he
    discovers what turns out to be a military server containing games that teach the
    kinds of strategy that could be helpful to decision-makers and negotiators at
    the height of the Cold War. He consults two fellow computer geeks, who tell him
    he’ll never get through the primary system security. But he could look for a “back
    door”—a secret method of entry placed by the original programmer(s) unknown to
    the current system administrators. It turns out that one of the games on the server
    contains a name: Falken’s Maze. David does some digging at the library and discovers
    a developer and inventor, Steven Falken, who had a history of working with and
    for the government. Upon researching his life, David discovers Falken’s “back
    door” password and gains entry to the system. (And almost starts World War III…)


    Encryption and online computer security has increased exponentially since the
    early 1980s. Brute-force methods, without any knowledge of the system, are nearly
    doomed to failure, as it is far, far easier to encrypt data than it is to computationally
    discover the encryption “key.” (And because the same kinds of computer processors
    are responsible for both processes, that will continue to be the case for some
    time.)


    But technology has also increased drastically since the 1980s, in both complexity
    and ubiquity. What hasn’t increased since then is the human brain’s capacity to
    manage that complexity. We make mistakes. Expert developers don’t just leave back
    doors in their code, they leave obsolete functions, unit tests, analytic trackers,
    dependencies on other people’s code that isn’t always updated when security vulnerabilities
    are discovered in that *other* code, overly permissible web app installation scripts
    that are triggered when a system is overloaded and forced to restart—or left open
    when a user fails to update permissions after installation. And that’s to say
    nothing of user error like bad passwords, reused passwords, unnecessarily running
    the wrong app with administrator settings, and unknowingly installing and using
    apps that require more system access than necessary … and leave those doors open
    through their own poor security settings.


    Just as fictional hackers like David Lightman used HumInt and traditional research
    to reduce the complexity of a computational problem, real-life hackers like those
    of Fancy Bear use human intelligence—and capitalize on human error—as their point
    of entry.


    Fancy Bear’s weapon of choice in 2016 was email. Specifically, a type of fraudulent
    email called *spearphishing*. You may be familiar with *phishing*—those usually
    poorly written emails saying “your email inbox is full” or “your bank account
    is frozen,” and that to fix the problem you have to click on a link in the email
    and provide your personal login details—including your username and password—to
    solve the problem. Spearphishing is like phishing, except instead of sending the
    email out into the wild in the hopes of catching *some* users’ data (like “fishing”
    with a line or a net just aims at catching *some* fish), spearphishing attacks
    are directed at a specific user or group of users (like a spear is aimed at a
    *specific* fish).


    These emails look less like “your bank account is frozen” and more like “Hey [your
    real name], it’s [your boss’s real name]. I’m stuck in a meeting and need you
    to do X for me by lunch time.” There’s almost always a fraudulent link to click
    on that will potentially give the sender of the email access to some part of your
    system, or request information from you that will do the same. Or it may look
    like a really good copy of a Google security notice sent to your Gmail account,
    with a button to click on to address the security concern they detected on your
    account. They might be after the contents of your email account, the company documents
    in your G Suite account, access to your camera and microphone, or they might be
    trying to install a keylogger on your computer that will collect every keystroke,
    including usernames, passwords, URLs, and the content of the messages you write.
    Any of these can give them access to intelligence—such as the email addresses
    of coworkers and clients, internal reports, financial documents, etc.—or *kompromat*—information
    that could compromise the integrity of you or your firm if it became public.


    On March 10, 2016, once it had become clear that Hillary Clinton would become
    the democratic nominee for president, her campaign team first started receiving
    spearphishing emails from Fancy Bear. On March 19, GRU hackers began targeting
    the personal Gmail account of her campaign chair, John Podesta. The attacks on
    the campaign continued through March and April, but also branched out to other
    groups linked with the campaign, such as the Clinton Foundation, the Center for
    American Progress, ShareBlue, and others.


    The campaign was successful. One of Podesta’s staffers had clicked on the link
    in a fraudulent Google security alert sent to Podesta’s personal Gmail account
    on March 19 and entered his username and password. Twice. In late April, word
    reached Trump advisor, George Papadopoulos, that Russia had obtained *kompromat*
    on Clinton from “thousands of emails.”^([^(154)](#fn154))'
