  trans: '

    ## 一场数字革命


    技术改变了我们保存和传播思想与故事的能力，改变了我们联系和交流的方式，改变了我们能够互动的人群，改变了我们能看到的事物，也改变了监督传播渠道的权力结构。^(¹⁸⁰)


    泽伊内普·图费克奇的这些话语，框定了她对数字平台（如社交媒体）如何改变并影响我们生活和工作的社会政治结构的讨论。可以这样理解：在汽车发明之前，许多西方社区规模较小，我们居住的地方离工作场所、礼拜场所、子女接受教育的学校，甚至食物种植地都非常近。如今有了汽车、卡车、公交车、火车和飞机，我们无需再住在离这些场所如此近的地方。在某些情况下，人们居住得更为分散；而在另一些情况下，人们仍然居住和工作在一起，但支撑这些社区的农场却远在天边。我的父母和祖父母都在同一个县长大并定居；我的父母各自就读于他们父母曾就读的同一所高中，而这两所高中就在相邻的城镇；当我上高中时（在更远的一个城镇），我还曾在我父母和祖父母的母校参加的田径比赛中竞争。但当我上大学时，我去了外州，这个中西部男孩遇到了并娶了一位新英格兰女孩，此后我们几乎在美国的每个地区都居住过。我们的孩子甚至都不是出生在同一个州。


    正如工业技术及其配套基础设施的引入，逐渐导致了社会结构和人际关系的重大变化一样，^(¹⁸¹)数字技术的引入也带来了同样的变化，只不过速度更快。对于像我这样的人来说，这些变化意味着即使我们相隔千里，也能与家人保持联系。这意味着我可以追求一份需要多次跨州搬迁的职业。这意味着我可以通过在线进行职业发展，从而在不重返学校（并支付学费）的情况下实现职业转型。而这还意味着我的配偶可以亲自在一个州从事她的职业，而我则在另一个州为一家公司远程工作。数字革命对我及我的家庭来说是一次重大的范式转变。


    但对于许多人而言，这场革命并非数字化的。


    图费克奇关于技术改变社会结构力量的引文，主要是针对“阿拉伯之春”——2011 年席卷北非和中东、导致多个专制政府被推翻的抗议浪潮。在突尼斯、埃及等地多次尝试重大政府变革均告失败后，革命于
    2011 年席卷了阿拉伯世界的大部分地区。2011 年有何不同？


    在“阿拉伯之春”之前，这些国家的人们很容易生活在一种“多元无知”的状态中——当你因为根本不知道有多少人同意你的观点而感到孤立时，就会产生这种状态。当一个政府控制着大众媒体，而人们除了在少数值得信赖的朋友和家人面前之外不敢发声时，就很容易忽略还有数百万其他人也和你一样对现状不满。但数字技术，尤其是社交媒体，改变了这一点。正如图费克奇所写：“多亏了一个`Facebook`页面，也许历史上第一次，互联网用户可以点击‘是’来接受一场革命的电子邀请。”^(¹⁸²)


    这正是 2011 年在埃及发生的事情。


    2010 年，一名叫哈立德·赛义德的男子拍摄了埃及警察涉嫌“分赃毒品突袭战利品”的视频。^(¹⁸³)他广泛分享了这段视频，但 6 月 6 日，他在警方拘留期间死亡。许多人认为他的死是警方对他揭露其涉嫌腐败行为的报复。7
    月 19 日，一名活动人士创建了一个`Facebook`页面^(¹⁸⁴)，以引起人们对赛义德遭遇的关注。该页面名为“我们都是哈立德·赛义德”，据创建该页面的活动人士称，“因为我们所有人随时都可能面临同样的命运。”^(¹⁸⁵)


    时间快进到 2011 年 1 月。1 月 25 日是埃及的一个节日，名义上是纪念警察，但经常被用作反政府抗议的契机。^(¹⁸⁶)“我们都是哈立德·赛义德”页面发布了一个活动邀请——在开罗的解放广场举行抗议。该邀请迅速病毒式传播，最终有数十万埃及人加入了一场为期
    18 天的抗议活动。起初，穆巴拉克政府对这种在线“点击行动主义”不以为然。但正如在突尼斯一样，过去六个月的在线活动已经充分搅动了局势，促使人们走上街头。而当他们走上街头时，他们的“多元无知”就消失了。通过`Facebook`和解放广场，渴望变革的埃及人意识到他们并不孤单。他们呼吁穆巴拉克下台。当穆巴拉克意识到他既无法忽视抗议者，也无法安抚他们，更无法将所有人监禁或杀害时，他让步了。抗议开始十八天后，他将权力移交给了军方。^(¹⁸⁷)


    数字连接——特别是`Facebook`——永远地改变了埃及。如同在突尼斯一样，埃及的反政府公民能够互相发现、招募他人并组织起一场推翻政府的集会。但这并非事情的终点。并没有立即举行选举。相反，军方介入维持秩序，直到能够举行选举。而当选举举行时，那些推翻政府的活动人士并未充分组织成一个政党，甚至不是一个有意义的投票集团。穆斯林兄弟会介入了解放广场抗议留下的权力真空，在
    2012 年赢得选举，^(¹⁸⁸)并迅速试图将埃及推向一个更右倾的伊斯兰政府。这遭到了许多参与 1 月 25 日革命的埃及人的反对，并最终导致了一场政变^(¹⁸⁹)和提前选举，使现任埃及总统塞西上台执政。^(¹⁹⁰)


    1 月 25 日革命后随之而来的动荡清楚地表明了一件事：数字连接并非一股必然的民主力量。尽管它能改变社会结构，但并不一定会带来平等的参与、平等的代表权和透明的治理。而且，它不会以相同的方式改变每一个社会。就大多数“阿拉伯之春”国家的情况而言，数字连接和社交网络起到了催化剂的作用。它使已有的不满浮出水面，将潜在的革命者聚集在一起，并且——由于现有政府领导人对其力量缺乏理解而未加阻碍——以如此之快的速度颠覆了社会结构，以至于活动人士都无法跟上。`Facebook`的“无摩擦设计”^(¹⁹¹)使革命变得如此容易，以至于没有人慢下来去做社区组织、政党建设以及规划未来这些必要的工作。

    '
- fmt: '# This is a pattern we see repeatedly throughout the world, but perhaps more
    starkly in the Global South


    Whether Egypt, Brazil, or Myanmar, young democracies and new technology can be
    a volatile mix. Hand someone experiencing social upheaval and political or ethnic
    conflict both freedom of speech *and* a smartphone at the same time, and the results
    will be unpredictable at best. That’s true *even when everyone is acting with
    the best of intentions*. But when they’re not, the results can be disastrous.


    Ultimately, social media and digital connectivity are a mixed bag, even when foreign
    state actors aren’t involved. New technology is neither inherently good nor inherently
    bad, *nor is it inherently neutral*. Every technology has certain *affordances*
    and certain *limitations*, and though they may not be value-laden, they do tend
    toward certain kinds of social effects. When a society is already experiencing
    social conflict or upheaval, those effects often become more drastic and less
    predictable. For many countries experiencing social change and rapid technological
    adoption at roughly the same time, that tech has, for better or for worse (or
    a little of both), changed those societies forever.


    ## Bots in Brazil


    Brazil’s political landscape is fraught, fractured, and unstable. It is a young
    democracy, born out of dictatorship only in 1985. As of 2014, there were 28 political
    parties with representation in Brazil’s two chambers of Congress, and governance
    almost exclusively happens by coalition. This can lead to uncomfortable, even
    disastrous alliances, like the one that reelected Dilma Rousseff to the presidency
    in 2014. As part of her coalition building in 2010, she named a member of another
    party, Michel Temer, to be her vice presidential running mate. However, when calls
    for Rousseff’s impeachment came almost immediately after her reelection in 2014,
    Temer joined the opposition. When Rousseff was removed from office in 2016, Temer
    became the new president. While there were certainly real issues about Rousseff’s
    presidency raised by real Brazilian citizens, it appears that social media bots
    played a significant role in swaying public sentiment and contributing to the
    calls for impeachment that were ultimately successful.


    Social media–based disinformation is a staple of Brazilian politics. Political
    campaigns paying for the propagation of information on social media are illegal
    in Brazil. Brazilian law also dictates that all social media campaign activity
    must be controlled by “natural persons”—that is, not run via automation.^([^(192)](#fn192))
    However, as these laws are difficult-to-impossible to enforce, automation and
    online rumors are part and parcel to many political campaigns in Brazil from the
    presidency down to local elections.


    In the case of Dilma Rousseff, it appears that both her campaign and that of her
    2014 presidential election opponent, Aécio Neves, used social media bots to spread
    campaign messages and/or smear each other. According to researcher Dan Arnaudo,
    Neves used bots more extensively in the presidential campaign than Rousseff.^([^(193)](#fn193))
    Once Rousseff won the election, though, most of the anti-Rousseff bots stayed
    online and almost immediately joined the pro-impeachment campaign. In Arnaudo’s
    words, “The online electoral campaign never ended, and these networks became key
    tools for generating support for impeachment.”^([^(194)](#fn194)) Adding insult
    to injury, the fact that Rousseff’s social media apparatus now belonged to the
    administration meant tighter restrictions and stricter oversight, giving the pro-impeachment
    networks a distinct advantage online.


    Bots can have a variety of effects. Sometimes those effects are minimal, even
    null. After all, without an audience, even the most active and inflammatory bots
    are just “shouting” into the proverbial wind. This is particularly the case now
    in 2018, as platforms have taken measures to prevent (if not eliminate) automation-fueled
    abuse. For instance, Twitter is now more aggressive about deleting bots and preventing
    new accounts from appearing in search results or driving traffic toward “trending”
    topics until they demonstrate signs of “organic” use. Facebook has drastically
    pulled back on what can be done via their application programming interface (`API`),
    making automation far more difficult to accomplish. However, in 2014, the doors
    to the platforms were far more open, and automated posts, comments, retweets/shares,
    and likes/favorites were easy to manage at scale on both platforms, leading to
    the “hacking” of algorithmic content selection in Facebook’s news feed and Twitter’s
    real-time “trends.” In fact, as Arnaudo states, on Twitter “the most retweeted
    messages [around the Rousseff impeachment campaign] were generated by bots.”^([^(195)](#fn195))


    It is impossible to quantify exactly how much impact automation and other inauthentic/fraudulent
    online activities had on Brazil’s election and impeachment results. However, it
    is clear from both the engagement levels of the most shared content and from the
    continued financial investment of campaigns—despite its illegality—that the impact
    is not trivial. And when Twitter trends, Facebook news recommendations, and YouTube’s
    “Up Next” autoplay videos significantly impact the content that users encounter,
    even small direct impact can be compounded when manipulated output becomes input
    for subsequent algorithmic analysis. (Think back to Chapter [3](#469027_1_En_3_Chapter.xhtml)’s
    discussion of the algorithmic feedback loop.)'
