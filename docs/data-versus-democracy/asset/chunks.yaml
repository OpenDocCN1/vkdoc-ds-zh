    like social media, transform and interact with the kinds of societal and political
    structures in which we live and work. Think about it this way: before the invention
    of the automobile, many Western communities were smaller, and we lived much closer
    to where we worked, where we worshiped, where our children were educated, even
    where our food was grown. Now that we have cars, trucks, buses, trains, and airplanes,
    we don’t need to live so close to those things. In some cases, people live more
    spread out; in others, people still live and work close together, but the farms
    that sustain those communities are far away. My parents and grandparents all grew
    up—and stayed—in the same county; my parents each went to the same high school
    as their parents did, in towns right next to each other; and when I was in high
    school (one more town over), I competed in track meets against my parents’ and
    grandparents’ alma maters. But when I went to college, I went out of state, and
