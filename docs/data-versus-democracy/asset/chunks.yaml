- fmt: '# Algorithmic Recommendation: The Cause of, and Solution to, All of Life’s
    Problems


    Let’s take a step back and get a general view on how this works. (We’ll go into
    much more detail in Chapter [3](#469027_1_En_3_Chapter.xhtml).) Users want content.
    Whether that’s text, music, TV, movies, all of that media demand is at its essence
    a demand for information. However, information is everywhere. As high as our demand
    for these various media is, supply far outstrips it. Both the amount of content
    and the ease with which we can access that content ensure that there’s always
    plenty of free or inexpensive media we can access.


    The problem, of course, is that content producers need to get paid, or they can’t
    produce that content. (And while many content producers do it as a side hustle,
    our society would surely be impoverished if there were no longer any filmmakers,
    songwriters, novelists, or journalists who embarked on their craft as a full-time,
    long-term career.) The supply-and-demand equation is so in favor of the consumer
    that the average cost of creating media is rapidly approaching null.^([^(27)](#fn27))
    The amazing thing, though, is that people are still spending money—a *lot* of
    it—on media. But as supply and access continue to increase, the chance of getting
    a piece of that pie is rapidly diminishing. So for a content producer to make
    money, they need to cut through the noise and be the ones to get our attention.


    Media consumers want content. Media producers need consumers’ attention. More
    than that, media consumers want to cut through all the crap and find the good
    stuff—whether that’s entertainment, education, or news. And media producers need
    to get their content in front of the *right* audience—the ones that might actually
    care enough to spend their hard-earned money on it.


    Consumers want to find the right media. Creators want to find the right audience.
    And they’re trying to find each other on the web. Kind of sounds like a dating
    site. In some ways, that’s *exactly* what it is.


    At its core, a dating site is a recommendation engine. By taking data about you
    and comparing it with data about other people, it recommends people with whom
    you might be compatible. The input data may come from an extended survey or a
    psychological personality test, or the input data could simply come from your
    behavior—hundreds of swipes, left and right. But ultimately, the process is the
    same. Take input data, run it through an algorithm, make recommendations. (And,
    in the better systems, collect data about how good the recommendation was, so
    the algorithm can be improved.)


    When it comes to matching consumers with content, or media producers with audiences,
    the process is the same. Fine-tune an algorithm that matches a user with content,
    maximizing the compatibility so that consumers are happy with their choice, and
    producers get paid for their labor. The big difference with a dating site, though,
    is that if a dating site is successful, and you find the love of your life, you
    never need the dating site again. But if the media recommendation engine is successful,
    you’ll not only find a great movie Friday night, you’ll also come back for another
    one on Saturday. And remember, the *platforms* are also competing for our attention.
    `Netflix`, `Hulu`, `Amazon`, `Pandora`, `Spotify`, `Twitter`, `Facebook`, … the
    more they get us to come back, the more money *they* make, too, regardless of
    what media we consume.


    This seems like a win-win-win situation. Platforms make recommendations; we find
    “personalized” entertainment choices that maximize our viewing/listening/reading
    pleasure; content producers have a way to find the *right* audience for their
    work, maximizing their income with minimal effort; and every time we give that
    track a thumbs up or thumbs down or rate that movie, the recommendations get better—for
    us and for the content producers. And as the recommendations get better, the platforms
    yield their own rewards. (When a media platform is also in the content creation
    business, it’s a double win for them.)


    But the system is not without its flaws. I’ve already discussed how it essentially
    primes us for addiction, prompting us to come back unconsciously, out of habit,
    rather than deliberately. But there are other problems. In order to make the best
    recommendations, platforms need lots of data about both us and the content to
    feed their algorithms. As platform competition gets fiercer, and computational
    resources cheaper, the amount of input data collected about us increases rapidly.


    This data collection often happens without our knowledge. We may agree to the
    Terms of Service, but the details implied by those terms are not always transparent,
    and they sometimes change after we’re already pretty well baked into the platform.
    This data collection also happens *when our guard is down*, when we’re the least
    vigilant about what information we’re providing to whom and to what ends. This
    isn’t our bank statement, our mortgage agreement, our major term papers—the things
    we are careful and deliberate about. This is what we read first thing in the morning,
    before our first cup of coffee, sometimes before we get out of bed. This is what
    we listen to as we drive to work or go for a run. This is what we watch while
    we have a drink before bed. We’re talking the music we listen to, the shows we
    watch, the news we read, what we say about it, the friends’ pictures of their
    kids that we “like,” the news stories that we respond to with a rage emoji, the
    pictures we spend the most time looking at, never mind the ads we click (and,
    in some cases, the credit card purchases that follow). All of that is logged,
    and much of it is used, even traded or sold, by the platforms, in order to serve
    up the content most likely to keep us on their platforms the longest and coming
    back the most often. This data collection leads to hacks, breaches, leaks, and,
    in some cases, targeted ads that know a bit too much about us. (Remember the case
    a few years back of the parent who found out their teenage daughter was pregnant
    because of the advertisements they received, before their daughter broke the news?^([^(28)](#fn28)))


    There’s another problem. For a platform to maximize our attention, and their data
    collection, they often strive to be one-stop shops. `Amazon`, `Facebook`, and
    `Google` (and before them, `Yahoo!`) are perhaps the best examples of this. The
    same “news feed” that gives us our news also gives us updates from our extended
    family, and for some serves as a professional development network. Then the ads
    encourage us to join groups where we can connect with people who share our religious
    convictions, or simply to buy a new pair of shoes or an upgraded smartphone. By
    maximizing our attention through such diverse content, the platform also *divides*
    our attention. They push us deeper into a state of “continuous partial attention,”
    as Linda Stone calls it, where no one thing dominates our thinking.^([^(29)](#fn29))
    This not only keeps us from thinking slowly and deeply about any one thing, but
    it causes us to constantly shift back and forth between different focuses. The
    resulting “attentional blink” (as some cognitive psychologists call it)^([^(30)](#fn30))
    is a time of once again finding our bearings. And when we’re constantly catching
    our breath, finding our place on the map, switching cognitive tasks, we find ourselves
    in what Stone calls “an artificial sense of constant crisis.” And that’s not just
    a psychological problem, that’s a thinking problem. We can’t slow down, we can’t
    dive deep, we can’t think critically. And the more time we spend on these platforms,
    the more time we spend in “attentional blink,” in constant cognitive crisis.


    When we find ourselves regularly in this psychological state *on the platforms
    where we find much of our news*, we are perfectly primed for propaganda. But just
    what is propaganda?'
