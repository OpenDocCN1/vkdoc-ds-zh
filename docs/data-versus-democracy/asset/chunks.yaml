- fmt: '# Supply and Demand: Why an Information Economy Is No Longer Sustainable


    So I hear some of you asking, “What does all of this have to do with big data,
    ‘fake news,’ and propaganda?”


    Everything.


    Our ancestors’ taste for food was determined in a time of food *scarcity*. The
    ingredients that were essential but scarce became the ingredients that were most
    preferred and sought out. However, in an era of *abundance*, those preferences
    don’t fit, especially when the same ingredients that are essential in small to
    moderate amounts become harmful in large amounts. Our natural instincts for food
    have become dangerous in an era of relative abundance.


    The same can be said of how we consume information. The way we deal with information
    is based on an evolutionary history—and an educational experience—in which information
    was *scarce* or at the very least *expensive*. Most of our cognitive system, which
    governs how our senses connect to our brain, evolved before *Homo sapiens* even
    existed.^([^(13)](#fn13)) The bulk of our genetic code was pretty well fixed long
    before the invention of writing, let alone the printing press, mass media, radio,
    television, or the algorithmic news feed.^([^(14)](#fn14)) Our instincts for determining
    reality, for parsing safety from danger, are not adapted to the media environment
    in which we live. We’re so tuned for information scarcity that consuming modern
    media is like trying to drink from a firehose.


    On top of that, most of us received an education that was designed during and
    for an internet-free world. The tools and techniques that help someone at a computer-free
    home, or even in the public library, judge the veracity of a claim they read are
    not fine-tuned for life on the internet. The truth is, simply put, that *most
    of us don’t know how to fact-check on the internet*. We don’t know how to do it,
    we don’t know how to *make* ourselves do it. And when that happens on a social
    media platform where we can share everything we read with the tap of a finger,
    we compound the problem, as our uncritical *consumption* of media leads to uncritical
    *publishing* of media. Every time we read without our “crap detector” fully engaged,
    the more “crap” we inadvertently pass along. Our social media “stream” then doesn’t
    just become a firehose, it becomes a firehose full of sewage. Finding something
    edifying becomes all the more difficult.


    This transformation isn’t just about evolution or education. It’s also about the
    economy. We’ve all learned about the industrial revolution, when—at least in the
    West—the feudal, agrarian-based economy (and the accompanying social order) gave
    way to a market-based, industrial economy. Rule by land, blood, or divine right
    gave way to rule by money and labor. The aristocracy was replaced by merchants.
    Farms by factories (and, later, factory farms). And a whole new social order emerged.
    As economist Michael H. Goldhaber writes:


    * Europe back then in the 15th century was still ruled pretty much on feudal lines,
    and the feudal lords took it for granted that the new world would be a space for
    more of a feudal economy, with dukes and counts and barons and earls ruling over
    serfs throughout the newly discovered continents. They did in fact begin to set
    up that system, but it was not what turned out to flourish in the new space. Instead,
    the capitalist, market-based industrial economy, then just starting out, found
    the new soil much more congenial. Eventually it grew so strong in North America
    that, when it re-crossed the ocean, it finally completed its move to dominance
    in Western Europe and then elsewhere in the world.^([^(15)](#fn15))


    In other words, there’s a reason democratic revolution exploded among Europeans
    in North America before it ignited Europe itself. The lack of an established aristocracy
    and an emphasis on trade and material goods (brought home to Europe on the backs
    of slaves) made the New World a different kind of economic space—one where the
    mining and production of material goods, the ability to move it, and the ability
    to convert it into *capital* gave one power. This market-based capitalism, and
    with it the idea that anyone could better themselves in society through labor
    and intelligence, formed the basic of the new republic (if, at times, in theory
    more than in practice). Eventually it did reach Europe, as feudalism slowly gave
    way in many places to market capitalism.


    But this isn’t the only socioeconomic transition humanity has faced. Feudalism
    was not the first social system, nor is capitalism the last. (It’s not even the
    only system around today!) And capitalism itself comes in many forms. Some have
    marked an important economic transition from a goods-and-services-based economy
    to an *information* economy. The idea is not that Western capitalism has gone
    away, but that the rules of supply and demand that once applied to materials (goods)
    and labor (services) now apply to information (data).


    Think of it this way. When something is scarce, but desirable, we call it “precious.”
    Gold, silver, fertile soil, fats, carbs, protein, etc. In a market-driven economy,
    if demand is high and supply low, people compete to trade for it, and in a capitalist
    economy, they trade money for it. Its cost goes up, a reflection of the value
    that society ascribes to it. If supply is high and demand is low, price goes down,
    a reflection of the relatively low value given to it by society.


    In an industrial economy, the supply-and-demand equation that keeps things moving
    involves materials and labor—what can you get, what can you make with it, where
    can you deliver it? The people who control the raw materials and the labor rule
    the roost. But what happens when we get so good at making things that supply overpowers
    demand *even for the things we need most*, like food, clothes, or housing? This
    is what has happened in many developed countries, as mechanization and automation
    have made production so efficient as to drive supply sky high, and at the same
    time drastically reducing the need—and therefore the monetary value—of human labor.
    When those two things happen, no one has any money to spend, and when they do
    spend it, things are so cheap that no one *makes* any money. The economy grinds
    to a halt.


    But, as Paul Mason has noted in his book *Postcapitalism: A Guide to Our Future*,^([^(16)](#fn16))
    capitalism is rather resilient. As the supply-and-demand equation collapses in
    on itself in one economic sphere, another one often emerges to take its place.
    In the past few decades, as the cost of production (and, thus, the wages for labor)
    has generally decreased in the affluent West, *information* has emerged to take
    its place. In other words, it was no longer those who controlled materials and
    labor who ruled the roost, it was those who managed *information* who had the
    strongest hold on the economy—and the social order.


    But before we could enter into a new, centuries-long era of info-capitalism, something
    else happened. Moore’s Law happened. Named after engineer and Intel co-founder
    Gordon Moore, Moore’s Law states that the number of transistors that fit in a
    given amount of space in a semiconductor circuit doubles roughly every two years.^([^(17)](#fn17))
    In an era where the economy is ruled by supply and demand of information, that
    exponential growth of the ability to process information is a problem. Add to
    that the just as rapidly diminishing cost of *storing* information, and the absolutely
    trivial process of *copying* information, and the information economy was served
    a death warrant before it ever had a chance to go out on its own.'
