  trans: '

    # 5. 民主被黑，第一部分


    俄罗斯干预与新冷战


    社交媒体为活动人士群体以及极端分子和施虐者群体提供了发现彼此并协调行动的能力。同样的工具可以被合法社群以及不诚实的参与者——甚至是试图干涉他国选举进程的外国政府——用来传播政治信息。这就是我们今天所处的环境，美国、北约、欧盟及其（潜在）盟友正受到俄罗斯信息战运动的攻击。在本章中，我们将解析他们的一些行动，这些行动在
    2016 年美国总统大选中达到高潮，最后我们将展望未来的威胁与防御措施。


    ## 发生了什么？


    2018 年 11 月 8 日。数亿美国人——以及世界各地的许多人——观看了美国总统大选结果的揭晓。赔率和民调都指向希拉里·克林顿的胜利。问题仅仅是胜利的规模有多大，以及她的政党是否也能控制国会。


    当然，结果并非如此。尽管克林顿赢得了普选票，但唐纳德·特朗普在关键的摇摆州获胜，这使他在选举人团中占得先机，成为美国第 45 任总统。


    几乎在他被主要新闻网络宣布为推定获胜者之后，专家和学者们就开始问："发生了什么？" 即使是一些支持特朗普胜过克林顿的人也对他的胜利感到惊讶。矛头迅速指向了民调机构及其方法——这些方法仍在为互联网和智能手机时代（而不是每个家庭一部固定电话的时代）进行更新。他们还指向了主流媒体中被认为存在的偏见，这些偏见从单一角度进行报道，而对其他角度视而不见。许多对两党制及主要政党提名人感到不满的选民要么待在家里，要么投票给第三方候选人，这引来了部分民主党人的愤怒。而且，与获胜候选人输掉普选票时常见的情况一样，有人呼吁废除选举人团制度。


    但对许多人来说，责任主要在于希拉里·克林顿本人。不仅旧丑闻挥之不去——班加西事件、她对比尔担任总统期间性行为不当指控的回应、她作为全民医保过去支持者的"社会主义"倾向——而且新丑闻不断出现。她使用私人电子邮件服务器处理国务院公务，这表明她存在安全风险。该服务器上丢失的电子邮件必定包含机密信息（这将是违法的）或涉及其他邪恶活动的证据。私人通信显示，民主党全国委员会采取措施，确保更温和的克林顿赢得党内提名，而非民主社会主义者伯尼·桑德斯。大选前三周，时任
    FBI 局长詹姆斯·科米宣布司法部将重新调查克林顿的私人电子邮件服务器案。更不用说那些更边缘的谣言了——克林顿曾下令为她杀人，^(¹²⁸) 参与"灵性烹饪"，^(¹²⁹)
    或是一个大规模儿童性交易团伙的中心人物^(¹³⁰)——后者虽毫无根据，却导致一名男子持枪前往华盛顿特区的一家披萨店进行"调查"。（这些阴谋论没有一个完全消失。）结果，许多原本会在克林顿和特朗普之间支持克林顿的温和派和桑德斯支持者，要么投票给第三方，要么出于抗议而弃权，这至少部分导致了特朗普的胜利。


    虽然这些丑闻中有些至少包含一丝真相，且大多数曾被许多美国人真心诚意地传播，但在 2017 年，越来越清楚的是，还有其它力量在起作用。是的，克林顿似乎深陷丑闻泥潭，是的，特朗普似乎代表了许多"主流"记者和政治操盘手过于忽视的人和想法。但是，我们现在知道，并非所有这些都是自发的。有人黑进了
    DNC 服务器，窃取了克林顿竞选主席约翰·波德斯塔的电子邮件，并放大了其中包含的丑闻以及社交媒体上支持特朗普的运动。许多阴谋论，即使不是被创造的，也是由在多个社交媒体平台上运营假账号的不诚实操盘手传播和放大的。正如研究人员和美国情报界现在所同意的，所有迹象都指向一个主要罪魁祸首：俄罗斯。


    不幸的是，导致许多人沦为俄罗斯活动——以及同时发生的其他影响力行动——受害者的同样的缺乏细致辨别，也导致许多人要么将俄罗斯视为一个妖怪，为其不喜欢的任何叙事和政治胜利负责，要么将宣传问题廉价地归结为"俄罗斯[推特]机器人"并一笑了之。前者导致我们忽视了其他外国行为体以及国内不良行为者和普通公民在虚假信息传播中的作用。后者则导致我们彻底忽视了该问题的广度和严重性。


    ## 认识新战争，与（冷）战如出一辙


    现实情况是，俄罗斯声称自己处于"针对美利坚合众国"以及我们北约盟友的"信息战"状态。^(¹³¹) 多年来，俄罗斯一直利用网站、博客和社交媒体作为其针对美国、英国、欧盟、北约、乌克兰和叙利亚反对派的信息武库中的最新工具。他们的目标是扩大其"帝国"，^(¹³²)
    充实普京的"核心圈子"，削弱欧盟和北约，诋毁西方民主，并——至少在俄罗斯周边地区——推广一种非自由主义的伪民主，在这种民主下，少数腐败的寡头可以为了自身利益管理国家经济。^(¹³³)


    但俄罗斯并非唯一的参与者。俄罗斯在美国和欧洲扶持的极右翼民粹主义团体是真实存在的。引发这些反移民民粹主义者愤怒和行动的难民危机也是真实的——尽管俄罗斯在叙利亚等地的活动无疑加剧了这场危机。在俄罗斯介入并向这些群体伸出援手之前——如果他们确实需要的话——这些群体已经在各自国家内部产生了影响，并且无论他们可能从俄罗斯或其盟友那里得到什么帮助，他们继续拥有真实的影响力。


    还有其他国家利用在线宣传来推进其地缘政治目标。七个威权国家拥有影响力行动和宣传的预算，^(¹³⁴) 推特最近宣布发现了一起针对其平台上西方用户的伊朗行动。来自美国、英国和以色列的私营公司无疑是主要参与者。而玩家门（GamerGate）的喷子们也并未消失。


    在下文中，我们将审视这个新的战场，了解这场全球信息战的整体格局。参与者是谁，进行了哪些战斗，平台和政府如何回应，以及我们如何走到了 2016 年的境地——在那里，俄罗斯的影响力行动在美国总统选举中发挥了重要且可能具有决定性的作用。

    '
- fmt: '# Ukrainian “Separatists”


    There’s no better place to start exploring Russian online disinformation than
    Ukraine. According to an exhaustive RAND study on Russian influence operations
    in Ukraine, “The annexation of Crimea in 2014 kicked off the debut of online Russian
    propaganda on the world stage.”^(135) Coordinated with military operations in
    Ukraine and worldwide diplomatic operations aimed at global recognition of the
    invasion, Russia conducted information warfare both within Ukraine and without,
    in order to reinforce the idea of Crimea’s “Russianness” to Crimeans, Ukrainians,
    and the larger global community.


    The RAND study found several important strains in Russia’s influence operations
    around the Crimean invasion. First, they targeted ethnic Russians in Crimea and
    eastern Ukraine, many of whom were Soviet-era transplants and their descendants.
    Russian-language media still dominates the Ukrainian information landscape, and
    they took advantage of this inroad to promote unity between Russia and ethnically
    Russian Ukrainians. This had the triple advantage of promoting the Russianness
    of Crimea, encouraging pro-Russia political activity within Ukraine more broadly,
    and supporting pro-Russia Ukrainian separatist movements (in conjunction with
    military support of those same separatists). Ukraine has responded, in part, by
    blocking Russian media access in 2014, but as of 2017, the Russian social media
    platform `VKontakte` was still the most popular in Ukraine, followed by American-owned
    `Facebook`.^(136)


    Russia also targeted Ukrainians with its now standard Euro-skeptic narratives,
    lest the EU and/or NATO expand to encompass one of Russia’s chief trade partners
    and line itself up on Russia’s southwestern border. Paired with this Euro-skepticism
    came the narratives of corruption around Ukrainian political leadership. Russian
    outlets often portrayed Ukraine as being governed by white supremacist fascists.^(137)
    Russia, of course, was Ukraine’s stable neighbor and friend, stalwart of traditional
    moral, Christian values.


    In the “far abroad”—more distant members of the world community, not sharing a
    border with Russia or one of its historical Warsaw Pact vassals—Russia advanced
    narratives in a variety of languages echoing many of the pro-Russia and anti-Ukraine
    messages it shared more locally. While the goal locally was to bring Ukraine back
    into Russia’s sphere of influence—if not its direct control—the goal globally
    was primarily one of non-intervention. By advancing narratives of Ukrainian corruption,
    Russian virtue, Crimea’s historical and ethnic Russianness, promoting fear of
    escalated global conflict, and sowing distrust of the United States, EU, and NATO,
    Russia encouraged the global community to accept Crimea’s annexation, or at least
    not to intervene.


    Perhaps the starkest example of Russia’s anti-Ukrainian influence operations involves
    the false narratives around the tragedy that occurred to Malaysia Airlines Flight
    17 in July 2014. While Western intelligence and the Dutch-led Joint Investigation
    Team have concluded that Russia and/or Russian-backed Ukrainian separatists are
    to blame,^(138) Russia used the tragedy to smear Ukrainian forces as immoral and
    incompetent and Russia as an important stabilizing force. Along the way, though,
    multiple contradictory explanations were advanced by Russian propaganda outlets.
    Because, for all the value of people believing the anti-Ukrainian narrative, Russia
    had to know they would be found out. However, by advancing multiple narratives
    through different outlets to different audiences, they sow confusion, give the
    investigators more to investigate, and prolong the general sense of disorientation.
    And for many, that sense of “I don’t know whom or what to believe”—“paralysis
    through propaganda”^(139)—will last longer than knowledge of the ultimate finding
    of investigators, especially if those findings are delayed by Russian obfuscation
    until new stories dominate the news cycle.


    It’s important to note that, for all the talk of bots in other locales, bots appear
    to have played only small roles in Ukraine. According to Ukrainian media and propaganda
    researchers Mariia Zhdanova and Dariya Orlova, “automated bots seem to be less
    widespread in Ukraine.” Instead, “manually maintained fake accounts are one of
    the most popular instruments for online campaigns” aimed at the Ukrainian public.^(140)
    This may be due to the relatively low saturation in Ukraine of bot-friendly platforms
    like `Twitter`, when compared to platforms like `Facebook`, where automation is
    more difficult and therefore more expensive.


    Though the annexation happened in 2014, and global attention has largely been
    turned elsewhere, Russia’s information warfare around Ukraine is ongoing, even
    in English. In my research into Russian disinformation, I regularly encounter
    new (to me) web sites and `Twitter` and `Facebook` accounts advancing anti-Ukraine
    narratives and promoting the right to self-rule of the “separatists” in Donetsk,
    Luhansk, and Novorossiya. Once these assets are developed, it is rare that Russia
    removes them voluntarily—though they may retask them. Rather, the inexpensive,
    and at times effective, operations continue on, until the asset is compromised
    or deleted by the platform on which it operates.'
