    Social media–based disinformation is a staple of Brazilian politics. Political
    campaigns paying for the propagation of information on social media are illegal
    in Brazil. Brazilian law also dictates that all social media campaign activity
    must be controlled by “natural persons”—that is, not run via automation.^([^(192)](#fn192))
    However, as these laws are difficult-to-impossible to enforce, automation and
    online rumors are part and parcel to many political campaigns in Brazil from the
    presidency down to local elections.


    In the case of Dilma Rousseff , it appears that both her campaign and that of
    her 2014 presidential election opponent, Aécio Neves, used social media bots to
    spread campaign messages and/or smear each other. According to researcher Dan
    Arnaudo, Neves used bots more extensively in the presidential campaign than Rousseff.^([^(193)](#fn193))
    Once Rousseff won the election, though, most of the anti-Rousseff bots stayed
    online and almost immediately joined the pro-impeachment campaign. In Arnaudo’s
    words, “The online electoral campaign never ended, and these networks became key
    tools for generating support for impeachment.”^([^(194)](#fn194)) Adding insult
    to injury, the fact that Rousseff’s social media apparatus now belonged to the
    administration meant tighter restrictions and stricter oversight, giving the pro-impeachment
    networks a distinct advantage online.


    Bots can have a variety of effects. Sometimes those effects are minimal, even
    null. After all, without an audience, even the most active and inflammatory bots
    are just “shouting” into the proverbial wind. This is particularly the case now
    in 2018, as platforms have taken measures to prevent (if not eliminate) automation-fueled
    abuse. For instance, Twitter is now more aggressive about deleting bots and preventing
    new accounts from appearing in search results or driving traffic toward “trending”
    topics until they demonstrate signs of “organic” use. Facebook has drastically
    pulled back on what can be done via their application programming interface (API),
    making automation far more difficult to accomplish. However, in 2014, the doors
    to the platforms were far more open, and automated posts, comments, retweets/shares,
    and likes/favorites were easy to manage at scale on both platforms, leading to
    the “hacking” of algorithmic content selection in Facebook’s news feed and Twitter’s
    real-time “trends.” In fact, as Arnaudo states, on Twitter “the most retweeted
    messages [around the Rousseff impeachment campaign] were generated by bots.”^([^(195)](#fn195))


    It is impossible to quantify exactly how much impact automation and other inauthentic/fraudulent
    online activities had on Brazil’s election and impeachment results. However, it
    is clear from both the engagement levels of the most shared content and from the
    continued financial investment of campaigns—despite its illegality—that the impact
    is not trivial. And when Twitter trends, Facebook news recommendations, and YouTube’s
    “Up Next” autoplay videos significantly impact the content that users encounter,
    even small direct impact can be compounded when manipulated output becomes input
    for subsequent algorithmic analysis. (Think back to Chapter [3](#469027_1_En_3_Chapter.xhtml)’s
    discussion of the algorithmic feedback loop.)'
