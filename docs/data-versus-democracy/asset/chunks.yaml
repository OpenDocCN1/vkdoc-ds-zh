  trans: '

    # 白色耳机的力量


    广告界有一个极为成功的例子，那就是苹果的白色耳机。^(⁴⁷) 围绕`iPod`自身的营销策略之一便是其小巧的尺寸，甚至是可以隐藏这一点（“把 1000 首歌装进口袋”）。但`iPod`无法在保持其作为隐蔽设备身份的同时，又充当自己的营销活动——“快看！我一定要有一个！”
    然而，在那个时代，白色耳机极为罕见。通过为每一台全新的`iPod`（以及后来的`iPhone`）配备一副醒目的白色耳机，这款设备得以保持低调，悄悄藏在每位听者的口袋里，而耳机则承担起营销游戏的重任。


    `苹果`公司利用这一点，展开了其视觉广告攻势。还记得那些广告、海报和杂志广告吗？黑色剪影的人物在一块由单一、纯粹、亮色构成的背景前跳舞。^(⁴⁸) 跳舞的人手里总是拿着一个`iPod`（同样是黑色剪影的一部分）。照片或视频中唯一的另一个元素就是那副`苹果`耳机。白色的。在黑色与紫红/橙色/绿色的背景上显得格外醒目。整个广告的视觉焦点。广告宣传中突出的耳机，与人们在街头或地铁上看到的耳机相互强化，营造出一种无处不在的感觉，并提升了这一符号的熟悉度。此前，从未有哪种连接耳朵和口袋的线缆颜色，能让我们如此强烈地（通常是积极地）联想到某个特定品牌。但通过选择一种罕见却又显眼的东西，并利用我们大脑的运作方式，通过视觉广告材料对其进行强化，`苹果`公司成功做到了这一点。


    ## 熟悉度的“甜蜜点”


    然而，熟悉度本身并不能保证带来积极反响。那些同样的白色耳机，一旦达到市场饱和点，就可能变得过于显眼。一些人会认清其中的把戏。另一些人只是想避免和别人一样。因此，*“多少才算太多？”*
    是广告商几十年来一直自问的问题。如果之后没有营销预算了，单凭一个超级碗广告不值得投入巨资。但如果同一个商业广告在每一个节目的每一次广告时段都出现，也会适得其反。请记住，当某样东西过于熟悉，却仍强行吸引我们注意力时，对资源的浪费可能会导致负面反应。找到这个“甜蜜点”（这对每个人来说都不同）是广告游戏中的一个关键部分。^(⁴⁹)


    ## 关联与评价


    也请记住，当两件事物在我们的记忆中相关联时，激活其中一件会同时激活另一件。^(⁵⁰) 因此，虽然反复接触白色耳机可能会提升对耳机及其配套设备（如`iPod`）的熟悉度，但只有在你对耳机、`iPod`或`苹果`公司本身没有负面联想时，这才会导向积极的评价。这就是为什么在重大丑闻之后，公司常常会重塑品牌，要么重命名产品，要么彻底更改公司名称。


    ## 对社交媒体与大数据的启示


    我想你大概已经能看出这对社交媒体和大数据分析的潜在启示了。如果看某样东西太频繁效果不好，不够频繁又没效果，而每个人的“甜蜜点”又不同，那么将某人看到广告的频率个性化就能优化广告效果。同样地，如果一个人记忆中的关联会影响他看到或听到某事物时的积极或消极评价，并且不同的人有不同的关联，那么将广告内容个性化同样可以优化其效果。


    当然，每个个体*并非*完全独一无二。尽管你我对同一个广告的反应可能不同，但我们与其他人*足够*相似的反应，使得用相同频率向我们展示相同内容，会产生大致相同的效果。因此，广告商们长期以来一直将我们分门别类——18-25
    岁的单身男性、来自中上阶层家庭的青春期少女、已退休的享受医保的工人阶级鳏夫、城市居民、郊区居民、农场主，等等等等。市场营销人员根据人口统计数据将人们分组，进行市场调研，并据此投放定向广告。这就是为什么儿童电视节目中的玩具广告比日间肥皂剧里多得多的原因。


    但是，电视广告无法像广告商希望的那样精准投放。那些最有可能购买 X 产品或投票给 Y 候选人的人，真的都在同一时间、同一广播电视/有线电视/卫星电视市场观看同一个节目吗？显然，我们的身份并非由我们的电视观看习惯、通勤早间的广播喜好以及杂志订阅来界定和聚合的！


    ## 互联网与微目标定位


    互联网彻底改变了这种格局。网络技术使得广告商（以及各种信息的传播者）能够对非常小的群体（甚至是个人，如果他们*真的*知道自己在做什么的话）进行微目标定位。（在大多数主流在线平台上，针对个人投放广告是被禁止的，但对于那些更有天赋、但道德感不那么强的信息操作者来说，总有绕过限制的方法。）如果最佳内容和投放时机是*因人而异*的，如果具有相似偏好和关联的群体与电视节目收视率或通勤时间表并不吻合，那么在线定向投放就开始变得更有意义了。在一个媒体环境中，当每一次访问的网站、点击的链接、观看的图片或视频、收听的歌曲、每一个“赞”、每一次转发、每一个`:rage:`表情都被记录*并对广告商开放*（至少作为筛选条件），那么……我们就能真正开始将我们对人类认知的了解应用于营销实践中。


    在一个每条“推广帖”实际上都是一则广告的世界里，广告已经不仅仅是关于推销商品了。它关乎政治竞选。关乎记者和自由撰稿人推广他们的作品。关乎独立音乐人寻找听众。关乎发明家为他们的原型产品众筹。任何想要传达信息或影响人类行为，并且有资金支持的人，都可以以极其精细的方式定位个体，而无需自己抓取一丁点数据。并且，尽管平台设置了许多限制，不道德的操作者仍能做出一些非常见不得光的事。（关于*这一点*，后续章节会有更多讨论。）

    '
- fmt: '## Summary


    Let’s sum up what we’ve learned. The brain is a large and complex information
    system, with optimized storage solutions and a powerful predictive analytics engine.
    It’s the real intelligence that the best AI systems are still trying to catch
    up to. The result of the brain’s optimized information storage and predictive
    analytics algorithms is a bottleneck called attention—the small amount of information
    we can “think about” at any given time, including memories and signals from our
    five senses. Biologically, attention is incredibly powerful, but also incredibly
    expensive, and therefore incredibly limited. Over the course of human evolution,
    we have evolved processes for prioritizing the information that makes it into
    conscious attention, including both hard-wired rules by which certain kinds of
    stimuli will always take priority as well as the capability to *learn* new priorities
    and connections that govern our attention.


    One of the main things we learn is statistical frequency (familiarity). Memories
    we engage frequently stay “preactivated,” ready for easy access. We also learn
    relationships between memories and stimuli, and when we interact with one thing
    in our memory, all of the things our brain has related it to will also raise in
    their level of activation, making it easier for us to process what we predict.


    We also know that, all else being equal, when a perception is easy to process,
    we form a positive emotional response. And that unconscious familiarity can be
    a powerful driver of positive responses to things we perceive.


    Of course, the degree to which something is familiar, whether or not we are aware
    of that familiarity, and what associations (positive and negative) we might have
    already made with that thing is highly individual. And while advertisers have
    been dividing us into groups for decades, and serving up ads likely to be the
