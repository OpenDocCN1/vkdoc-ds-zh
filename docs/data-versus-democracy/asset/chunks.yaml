  trans: '

    # 算法推荐：人生一切问题的成因与解方


    我们先退一步，从整体上看一下这个过程是如何运作的。（我们将在第 3 章中详细展开。）用户想要内容。无论是文字、音乐、电视、电影，所有这些媒体需求本质上都是对信息的需求。然而，信息无处不在。尽管我们对各种媒体的需求很高，但供给远远超过了需求。内容的数量以及我们获取内容的便捷性，都确保了总有大量免费或低成本的媒体可供我们访问。


    当然，问题在于内容创作者需要获得报酬，否则他们就无法创作这些内容。（虽然许多内容创作者将其作为副业，但如果不再有电影制作人、词曲作者、小说家或记者将其手艺作为全职、长期的职业生涯，我们的社会无疑会变得贫瘠。）供需关系如此有利于消费者，以至于创作媒体的平均成本正迅速趋近于零^(²⁷)。然而，令人惊叹的是，人们仍然在媒体上花费大量——非常多的——金钱。但随着供应和访问量持续增加，分得一杯羹的机会正在迅速减少。因此，内容创作者要想赚钱，就必须在喧嚣中脱颖而出，成为吸引我们注意力的那一个。


    媒体消费者想要内容。媒体生产者需要消费者的注意力。不仅如此，媒体消费者想要剔除所有垃圾，找到好东西——无论是娱乐、教育还是新闻。而媒体生产者需要让自己的内容出现在*正确*的受众面前——那些真正在乎到愿意为自己辛苦赚来的钱买单的人。


    消费者想找到合适的媒体。创作者想找到合适的受众。而他们正试图在网络上找到彼此。听起来有点像婚恋网站。在某些方面，这*正是*它的本质。


    从核心来看，婚恋网站就是一个推荐引擎。通过收集关于你的数据，并将其与其他人的数据进行对比，它会推荐你可能合拍的人。输入数据可能来自一份冗长的问卷或心理人格测试，也可能仅仅来自你的行为——数百次左滑右滑。但归根结底，过程是一样的。获取输入数据，通过算法运行，产生推荐。（并且，在更好的系统中，收集有关推荐效果的数据，以便改进算法。）


    在将消费者与内容匹配，或媒体生产者与受众匹配时，过程也是相同的。微调算法来匹配用户与内容，最大化契合度，让消费者对自己的选择满意，让生产者因劳动而获得报酬。然而，与婚恋网站的重大区别在于，如果婚恋网站成功，你找到了人生挚爱，就再也不需要那个网站了。但如果媒体推荐引擎成功，你不仅会在周五晚上找到一部好电影，还会在周六回来再看一部。而且请记住，*平台*本身也在争夺我们的注意力。`Netflix`、`Hulu`、`Amazon`、`Pandora`、`Spotify`、`Twitter`、`Facebook`……它们让我们回访的次数越多，无论我们消费什么媒体，它们自己赚的钱也就越多。


    这看起来是一个三赢的局面。平台提供推荐；我们找到“个性化”的娱乐选择，最大化我们的观看/聆听/阅读乐趣；内容创作者有办法为自己的作品找到*正确*的受众，以最小的努力最大化收入；而我们每次给某首曲目点赞或点踩，或给某部电影评分时，推荐都会变得更好——对我们和内容创作者都是如此。随着推荐越来越好，平台也收获了自身的回报。（当一个媒体平台也从事内容创作业务时，这对它们来说是双重收益。）


    但这个系统并非没有缺陷。我已经讨论过它如何从根本上为我们的上瘾做好准备，促使我们无意识地、出于习惯而非刻意地回访。但还有其他问题。为了做出最佳的推荐，平台需要大量关于我们和内容的数据来喂养其算法。随着平台竞争日益激烈，计算资源越来越廉价，平台收集的关于我们的输入数据量正迅速增加。


    这种数据收集常常在我们不知情的情况下发生。我们可能同意了服务条款，但这些条款所隐含的细节并不总是透明的，而且在我们已经深度融入平台后，它们有时还会发生变化。这种数据收集也发生在我们*放松警惕*的时候，在我们最不警惕自己向谁、为了什么目的提供了什么信息的时候。这不是我们的银行对账单、抵押贷款协议、主要学期论文——那些我们小心翼翼、深思熟虑对待的东西。这是我们在每天早晨第一杯咖啡前，有时甚至是在起床前阅读的东西。这是我们开车上班或跑步时聆听的东西。这是我们睡前小酌时观看的东西。我们谈论的是我们听的音乐、看的节目、读的新闻、我们对它们的评论、我们“赞”的朋友孩子的照片、我们用愤怒表情回应的新闻故事、我们花最多时间看的图片，更不用说我们点击的广告了（以及在某些情况下，随之而来的信用卡消费）。所有这些都被记录下来，其中大部分被平台使用，甚至交易或出售，以便推送最有可能让我们在其平台上停留最久、回访最频繁的内容。这种数据收集导致了黑客攻击、泄密、泄漏，以及在某些情况下，那些对我们了解得有点过多的定向广告。（还记得几年前那个案例吗？一位家长在女儿公布消息之前，就因为收到的广告发现自己十几岁的女儿怀孕了。^(²⁸)）


    还有另一个问题。为了让平台最大化吸引我们的注意力，并最大化收集数据，它们往往力求成为一站式商店。`Amazon`、`Facebook` 和 `Google`（以及它们之前的
    `Yahoo!`）或许是这方面最好的例子。同一个“信息流”既为我们提供新闻，也为我们提供远方亲戚的更新，对某些人来说还充当着职业发展网络。然后，广告鼓励我们加入能结识有共同宗教信仰的人的群组，或者仅仅是买一双新鞋或一部升级版智能手机。通过这种多样化的内容来最大化我们的注意力，平台同时也*分散*了我们的注意力。正如琳达·斯通所说，它们将我们推入一种“持续部分注意”的状态，没有任何一件事能主导我们的思维。^(²⁹)
    这不仅让我们无法缓慢而深入地思考任何一件事，还会导致我们不断地在不同的焦点之间来回切换。由此产生的“注意瞬盲”（正如一些认知心理学家所称的^(³⁰）是一段再次寻找方向的时间。而当我们不断地喘口气、在地图上找到自己的位置、切换认知任务时，我们便发现自己陷入了斯通所说的“一种人为的持续危机感”。这不仅仅是心理问题，更是思考问题。我们无法慢下来，无法深入钻研，无法批判性思考。而我们在这些平台上花费的时间越多，我们处于“注意瞬盲”、持续认知危机中的时间也就越多。


    当我们发现自己经常*在我们获取大部分新闻的平台*上处于这种心理状态时，我们就被完美地预设为易受宣传影响。但究竟什么是宣传呢？

    '
- fmt: "# Propaganda Defined\n\nThe word *propaganda* comes from the word *propagate*—to\
    \ spread. In its oldest context, it simply refers to the spreading of a message,\
    \ whether through word of mouth or through print media. It’s similar both to *publishing*\
    \ (making public) and to *evangelizing* (sharing good news), in that sense. But\
    \ in more modern times, it’s taken on a more sinister tone. In his classic text\
    \ *Propaganda: The Formation of Men’s Attitudes*, Jacques Ellul writes:\n\n> Propaganda\
    \ is a set of methods employed by an organized group that wants to bring about\
    \ the active or passive participation in its actions of a mass of individuals,\
    \ psychologically unified through psychological manipulation and incorporated\
    \ in an organization.^([^(31)](#fn31))\n\nI find this definition helpful, but\
    \ also insufficient for the digital age. The idea of an *organization* being the\
    \ core agent, and expansion of that organization being the goal, only accounts\
    \ for a small part of the propaganda activities we see online. The idea of being\
    \ a card-carrying member of an organization has largely been supplanted these\
    \ days by participation in a movement, with various degrees of possible participation.\
    \ This difference in what movement “membership” entails, as well as the different\
    \ kinds of messages and media available to modern citizens, requires some different\
    \ nuances in how we define propaganda.\n\nWith that in mind, I define propaganda\
    \ as the use of one or more media to communicate a message, with the aim of changing\
    \ someone’s mind or actions *via psychological manipulation*, rather than reasoned\
    \ discourse. Non-propaganda is not the absence of bias—we’re all biased. Propaganda\
    \ is the (usually purposeful) attempt to hide the bias, to present non-facts as\
    \ facts, to present facts incompletely or stripped of their essential context,\
    \ to steer the mind away from the processes of reason that allow us to read through\
    \ bias critically and to discern facts from fiction, truth from lies. Propaganda\
    \ can involve *disinformation* (from the Russian *dezinformatsiya*)—a purposeful\
    \ attempt to deceive or manipulate—or *misinformation*, an inadvertent spreading\
    \ of falsehoods and fallacies. Online, we often see both working in concert—a\
    \ purposeful attempt to deceive, shared in such a way that the deceived help to\
    \ propagate it, but in earnest. I call this multistage propaganda *information\
    \ laundering*, since the original disinformation is laundered through well-meaning\
    \ people, whose activity both spreads the message and obscures the source.\n\n\
    With these definitions, we can see how media addiction, invasive data collection,\
    \ and constant “attentional blink” all prime us to be victims of information operations.\
    \ The more we spend time on platforms that promote superficial thinking, the less\
    \ critically we examine the information we engage and the sources from which it\
    \ comes. The more “social” our media consumption behaviors, the more we let our\
    \ guard down. The more we shift cognitive gears, the less capable we are of going\
    \ deep when we need to. And the more data is collected about us, the more sophisticated\
    \ and personally targeted those operations can be. Harold D. Lasswell writes that\
    \ propaganda seeks to subordinate others “while reducing the material cost to\
    \ power,”^([^(32)](#fn32)) and our modern, algorithmically based media platforms\
    \ provide perhaps the greatest opportunity in human history to accomplish that\
    \ cost reduction.\n\nBut all hope is not lost. Ellul writes: “Propaganda renders\
    \ the true exercise of [democracy] almost impossible” (p. xvi). And as social\
    \ media feeds the propaganda machine, many critics are sounding the death knell\
    \ of modern democracy. However, the very tools that facilitate the information\
    \ operations increasing social polarization and potentially swinging elections\
    \ *are the same tools that can help us resist*. Ellul also writes that because\
    \ propaganda dehumanizes and reduces our personal and collective agency, “Propaganda\
    \ ceases where simple dialogue begins” (p. 6). And where better to start that\
    \ dialogue than on social media?\n\nI understand. It can be easy to dismiss social\
    \ media, even the web, and pine for the older forms of human connection (none\
    \ of which have actually disappeared, by the way). But as new media scholar Clay\
    \ Shirky puts it, “The change we are in the middle of isn’t minor and it isn’t\
    \ optional, but nor are its contours set in stone.” He continues:\n\n> Our older\
    \ habits of consumption weren’t virtuous, they were just a side-effect of living\
    \ in an environment of impoverished access. Nostalgia for the accidental scarcity\
    \ we’ve just emerged from is just a sideshow; the main event is trying to shape\
    \ the greatest expansion of expressive capability the world has ever known.^([^(33)](#fn33))\n\
    \nThe media landscape is a very different place than it was even just ten years\
    \ ago. As the constant updates to our social media feeds remind us regularly,\
    \ nothing is set in stone in this Brave New World. Not yet. We have the opportunity\
    \ to shape it, as both consumers and producers of the content that keeps those\
    \ platforms afloat.\n\nBut to do that work of resistance, of redrawing the blueprints\
    \ of media and society, first we need to know how it works. In the next two chapters,\
    \ we’ll dive deeply into how *we* work when we engage information, and then into\
    \ how the *systems* work. That knowledge, plus the examples—both hopeful and tragic—explored\
    \ in the latter half of this book, will give us the foothold we need as we seek\
    \ to solve the propaganda problem.\n\nBut for now, I’ll leave you with some of\
    \ the best new media advice I’ve ever heard.\n\n> Throw some sand into the machinery\
    \ that automatizes your attention.\n> \n> —Howard Rheingold^([^(34)](#fn34))\n\
    \n## Summary\n\nIn this chapter we’ve learned that Western capitalism has moved\
    \ from a commodity-based economy to an attention-based economy. The supply-and-demand\
    \ equation that increasingly governs the way we interact with information deals\
    \ with the limited supply and increasing demand of human attention, rather than\
    \ information, goods, or services.\n\nAlgorithmic recommendation engines and social\
    \ media feeds have been created to help users find the most relevant content and\
    \ to help media producers find the most appropriate audiences. But the ways in\
    \ which media producers compete for our attention, the amount of personal data\
    \ mined to make the algorithms work, and the natural way our cognitive systems\
    \ function all combine to make the modern media landscape ripe for propaganda.\n\
    \nHowever, if we understand the economy, biology, and technology, we can begin\
    \ to counter the negative effects and even use the same tools to undo the propaganda\
    \ problem.\n\nFootnotes [1](#469027_1_En_1_Chapter.xhtml#Fn1_source) [2](#469027_1_En_1_Chapter.xhtml#Fn2_source)\
    \ [3](#469027_1_En_1_Chapter.xhtml#Fn3_source) [4](#469027_1_En_1_Chapter.xhtml#Fn4_source)\
