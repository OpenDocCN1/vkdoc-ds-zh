  \ = desktop_serps_df[~desktop_serps_df['url'].isnull()].copy()\ndesktop_serps_select\
  \ = desktop_serps_select[desktop_serps_select['url'].str.contains('|'.join(selected_sites))]\n\
  desktop_serps_select\n```\n\n![](img/537787_1_En_3_Figaf_HTML.jpg)\n\n一张表格截图，列标题包括：关键词、排名\
