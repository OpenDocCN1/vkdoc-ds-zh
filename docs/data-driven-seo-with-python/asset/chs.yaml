  \ 0)) all_users\nfrom google_analytics.multichannel_ga_monthly\nwhere channel in\
  \ ('Organic Traffic', 'All Users')\ngroup by yearMonth\n)\n)\nwhere\nDATE_DIFF(CURRENT_DATE(),\
  \ PARSE_DATE('%Y-%m-%d', CONCAT(SUBSTR(CAST(yearMonth AS STRING), 1, 4),\"-\",\n\
  SUBSTR(CAST(yearMonth AS STRING), 5, 2),\"-\",'01')), MONTH) <= 12\ngroup by yearMonth,\
  \ channel\norder by yearMonth LIMIT 100;\n```\n\n以下 SQL 将按月生成用户流量统计，并包含同比数据：\n\n\
  ```sql\nselect\nyearMonth,\nCASE\nWHEN channel = 'All Users' THEN \"non_seo\"\n\
  ELSE channel\nEND as channel,\nusers_yoy\nfrom google_analytics.multichannel_ga_monthly\n\
  where\nchannel in (\"All Users\", \"Organic Traffic\")\nand\nDATE_DIFF(CURRENT_DATE(),\
