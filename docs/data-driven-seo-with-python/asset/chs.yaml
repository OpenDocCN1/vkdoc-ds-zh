  \n一张包含 10 行 3 列的表格截图，展示了标题、计数和 `pos_n` 列的数据框。\n\n该数据框看起来包含了更合理的内容标题，但 `\"company\"\
  ` 除外，它在页面中的排序位置也靠后得多（第 25 位）。\n\n让我们进一步筛选：\n\n```\nheadings_tosum_filtered = headings_tosum_agg.copy()\n\
  ```\n\n移除位置在 10 或以上的标题，因为这些标题不太可能包含实际的内容章节。注意，10 是一个任意数字，根据内容性质可以调整。\n\n```\nheadings_tosum_filtered\
  \ = headings_tosum_filtered.loc[headings_tosum_filtered['count'] < 10 ]\n```\n\n\
  统计标题中的单词数量：\n\n```\nheadings_tosum_filtered['tokens'] = headings_tosum_filtered['heading'].str.count('\
  \ ') + 1\n```\n\n通过移除文本两侧的空格来清理标题：\n\n```\nheadings_tosum_filtered['heading'] =\
  \ headings_tosum_filtered['heading'].str.strip()\n```\n\n使用冒号作为标点符号分割标题，并提取冒号右侧的部分：\n\
  \n```\nheadings_tosum_filtered['heading'] =  headings_tosum_filtered['heading'].str.split(':').str[-1]\n\
  ```\n\n对句点应用相同原则：\n\n```\nheadings_tosum_filtered['heading'] =  headings_tosum_filtered['heading'].str.split('.').str[-1]\n\
