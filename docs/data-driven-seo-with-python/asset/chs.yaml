  \ API，但 Python 中有一些包（例如 `pytrends`）可以自动提取这些数据，具体方法如下：\n\n```python\nimport pandas\
  \ as pd\nfrom pytrends.request import TrendReq\nimport time\n```\n\n#### 单个关键词\n\
