  \   [1., 1.],\n       [1., 1.]])\n```\n\n使用负二项分布拟合按 `ab_group` 分组的会话模型：\n\n```python\n\
  ab_model = NegativeBinomial(test_analytics_expand['sessions'],\n               \
  \             X).fit()\n```\n\n打印模型摘要：\n\n```python\nab_model.summary()\n```\n\n\
