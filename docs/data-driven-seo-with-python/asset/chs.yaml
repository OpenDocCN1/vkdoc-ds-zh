  \ SERP 数据\n\n导入 SERP 数据，这些数据将构成发现 Google 对排名前十的网站所奖励内容的基础：\n\n```\nserps_input =\
  \ pd.read_csv('data/serps_input_' + target + '.csv')\nserps_input\n```\n\n结果如下：\n\
  \n![](img/537787_1_En_4_Fign_HTML.jpg)\n\n一张包含 5 行 7 列表格的截图，展示了 SERP 数据条目的数据框。列名分别为\
  \ `keyword`、`rank`、`url`、`serps_results_count`、`domain`、`title` 和 `is_video`。\n\n\
  `tldextract` 包中的 `extract` 函数可用于从 URL 中提取主机名和域名：\n\n```\nfrom tldextract import\
