  \n\n# 水平条形图绘制\n\n一个水平条形图绘制了会话数与受影响 URL 数量之间的关系。估计值如下：外部 IA（信息架构）5 个，错误 35 个，其他 50\
  \ 个，丢失内容 375 个。\n\n**图 9-9**  \nGoogle Search Console (GSC) 受影响 URL 数量的柱状图（按技术 SEO\
  \ 诊断分类）\n\n概览部分已完成；接下来按内容类型进行细分。我们将使用内容片段标签来获取点击影响统计数据：\n\n```python\ndiagnosis_seg_clicks\
  \ = perf_diags.groupby(['diagnosis', 'segment']).agg({'clicks_delta': 'sum'}).reset_index()\n\
  diagnosis_seg_urls = perf_diags.groupby(['diagnosis', 'segment']).agg({'url': 'count'}).reset_index()\n\
  diagnosis_seg_stats = diagnosis_seg_clicks.merge(diagnosis_seg_urls,\non = ['diagnosis',\
  \ 'segment'], how = 'left')\ndiagnosis_seg_stats['clicks_p_url'] = (diagnosis_seg_stats['clicks_delta']\
  \ / diagnosis_seg_stats['url']).round(2)\ndiagnosis_seg_stats.sort_values('clicks_p_url')\n\
