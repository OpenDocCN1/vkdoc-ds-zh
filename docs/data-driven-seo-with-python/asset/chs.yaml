  ```\n\n结果如下：\n\n![](img/537787_1_En_4_Figc_HTML.jpg)\n\n一个包含 11 行 5 列的表格截图，展示了用于构建关键词的数据框，并与对应主题进行了映射。包含主题、关键词、关键词的搜索引擎结果数量、主题结果和主题组。\n\
