  keyword_mapping_grp = keyword_mapping_grp.groupby('topic').first().reset_index()\n\
  keyword_mapping_grp\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figf_HTML.jpg)\n\n一个包含\
