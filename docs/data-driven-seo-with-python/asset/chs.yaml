  \ '')\ngetstat_after['phase'] = 'after'\ngetstat_after = getstat_after.rename(columns\
  \ = {'result types for dec 17, 2020': 'snippets'})\ngetstat_after = getstat_after[['keyword',\
  \ 'market', 'phase', 'device', 'search_volume', 'rank', 'url', 'site', 'snippets']]\n\
  getstat_after['search_volume'] = np.where(getstat_after['search_volume'] == 0, 1,\
  \ getstat_after['search_volume'])\ngetstat_after['count'] = 1\ngetstat_after['rank_profile']\
  \ = np.where(getstat_after['rank'] < 4, 'top3',\nnp.where(getstat_after['rank']\
