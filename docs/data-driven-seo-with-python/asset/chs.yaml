  ### 关键词蚕食\n\n在确定性能表现后，我们的注意力转向了性能的潜在驱动因素，例如关键词蚕食。当同一网站有多个 URL 针对单个关键词出现在搜索结果中时，就会发生关键词蚕食。\n\
  \n我们将从使用重复的 SERP 数据集开始，统计每个关键词下同一网站的 URL 数量。这需要对关键词和网站使用`groupby()`函数：\n\n```python\n\
  cannibals_before_agg = getstat_before.groupby(['keyword', 'site']).agg({'count':\
  \ 'sum'}).reset_index()\n```\n\n在此阶段，我们希望隔离出被蚕食的 SERP 行。这意味着这些 URL 所在的关键词结果中，出现了同一网站的其他\
  \ URL。\n\n```python\ncannibals_before_agg = cannibals_before_agg[cannibals_before_agg['count']\
  \ > 1]\n```\n\n我们将计数重置为 1，以便进行进一步的求和聚合：\n\n```python\ncannibals_before_agg['count']\
  \ = 1\n```\n\n接下来，我们按关键词聚合，统计 SERP 数据中被蚕食的 URL 数量：\n\n```python\ncannibals_before_agg\
  \ = getstat_before[getstat_before['device'] == 'desktop']\ncannibals_before_agg\
  \ = cannibals_before_agg.groupby(['keyword']).agg({'count': 'sum'}).reset_index()\n\
  cannibals_before_agg = cannibals_before_agg.rename(columns = {'count': 'cannibals'})\n\
  cannibals_before_agg\n```\n\n结果如下：\n\n![](img/537787_1_En_10_Figae_HTML.jpg)\n\n\
  一个表格展示了包含 2 列和 10 行的列表。列包括`keywords`和`cannibals`。\n\n你可能会认为这些数字包含了每个网站的一个 URL，而这些\
  \ URL 严格来说并不属于关键词蚕食。然而，这种宽松的计算方法简单易行，足以让我们了解关键词蚕食的趋势。\n\n让我们看看更新后 SERP 的关键词蚕食情况：\n\
