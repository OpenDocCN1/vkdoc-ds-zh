  \ 函数对这些网站进行分类和标记。\n\n### 顶级竞争对手\n\n为了找到顶级竞争对手网站，我们将聚合“之前”和“之后”的数据集，以计算出基于覆盖范围和搜索量加权排名平均值的可见性指数：\n\
  \n```\nplayers_before = getstat_bef_unique\nprint(players_before.columns)\nplayers_before_rank\
