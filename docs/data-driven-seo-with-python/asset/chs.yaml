  \ PS5 那样出现突然激增的情况。\n\n## 按搜索意图聚类\n\n搜索意图是用户在 Google 上搜索时输入的查询背后的含义。因此，你可能会遇到以下查询：\n\
  \n- “风衣”\n- “女士风衣”\n- “人寿保险”\n\n“风衣”与“女士风衣”具有相同的搜索意图，但与“人寿保险”的意图不同。要解决这个问题，只需比较这两个搜索短语在\
  \ Google 中排名前 10 的网站，就能强烈暗示 Google 如何看待这两个短语之间的搜索意图。\n\n这不是一个完美的方法，但它效果很好，因为你使用的是排名结果，这些结果是\
  \ Google 迄今为止所学到的关于哪些内容能满足搜索查询意图的所有知识的提炼（基于每年数万亿次的全球搜索）。因此，可以合理地推断，如果两个搜索查询具有足够相似的\
  \ SERP，那么这些关键词之间就共享搜索意图。\n\n这在很多方面都很有用：\n\n- **排名跟踪成本**：如果你的预算有限，那么了解搜索意图意味着你可以避免跟踪与已跟踪关键词具有相同意图的关键词，从而避免产生额外费用。但这存在风险，因为消费者会发生变化，未被跟踪的关键词可能不再具有相同的意图。\n\
  - **核心更新**：随着消费者搜索模式的变化，意图也会发生变化，这意味着你可以通过比较更新前后关键词的搜索意图聚类，来查看关键词是否改变了聚类，这将有助于指导你的应对策略。\n\
  - **关键词内容映射**：了解意图意味着你可以成功地将关键词映射到着陆页。这对于确保你的网站架构包含与用户搜索需求相匹配的着陆页尤其有用。\n- **付费搜索广告**：良好的关键词内容映射也意味着你可以改善付费搜索活动的账户结构和由此产生的质量得分。\n\
  \n### 起点\n\n好了，开始聚类。我们假设你已经将每个关键词的前 100 个 SERP^(³) 结果存储为一个 Python 数据框 `serps_input`。这些数据很容易从排名跟踪工具中获得，尤其是如果它们有\
  \ API 的话：\n\n```\nserps_input\n```\n\n结果如下：\n\n![](img/537787_1_En_2_Fign_HTML.jpg)\n\
  \n一个包含 5 列 15 行的表格截图。列标题为 keyword、rank、url 和 serps results count。\n\n这里，我们使用的是 DataForSEO\
  \ 的 SERP API，^(⁴) 并且我们将列名从 `rank_absolute` 重命名为 `rank`。\n\n### 筛选第 1 页数据\n\n由于 DataForSEO\
  \ 对单个结果的编号包含在轮播、其他人还问等组件中，因此我们需要比较每个 SERP 的前 20 个结果，以获得第 1 页的近似结果。我们还将过滤掉值为 `None`\
  \ 的 URL。我们将采用的编程方法是“拆分-应用-合并”。什么是拆分-应用-合并？\n\n- 将数据框拆分为关键词组\n- 对每个组应用过滤公式\n- 合并每个组的关键词\n\
  \n具体操作如下：\n\n拆分：\n\n```\nserps_grpby_keyword = serps_input.groupby(\"keyword\")\n\
  ```\n\n在合并之前应用函数：\n\n```\ndef filter_twenty_urls(group_df):\n    filtered_df = group_df.loc[group_df['url'].notnull()]\n\
  \    filtered_df = filtered_df.loc[filtered_df['rank'] <= 20]\n    return filtered_df\n\
  filtered_serps = serps_grpby_keyword.apply(filter_twenty_urls)\n```\n\n合并并为列名添加前缀：\n\
  \n```\nnormed = normed.add_prefix('normed_')\n```\n\n与初始数据框连接：\n\n```\nfiltered_serps_df\
  \ = pd.concat([filtered_serps], axis=0)\n```\n\n\n\n### 将排名 URL 转换为字符串\n\n为了比较每个关键词的\
  \ SERP，我们需要将 SERP 的 URL 转换为字符串。这是因为存在一对多（一个关键词对应多个 SERP URL）的关系。实现这一目标的方法很简单：再次使用“拆分-应用-合并”方法，将每个关键词的\
  \ URL 字符串连接起来。使用 SAC 将结果转换为字符串：\n\n```\nfiltserps_grpby_keyword = filtered_serps_df.groupby(\"\
  keyword\")\ndef string_serps(df):\ndf['serp_string'] = ''.join(df['url'])\nreturn\
  \ df\nCombine\nstrung_serps = filtserps_grpby_keyword.apply(string_serps)\n```\n\
  \n与初始数据框连接并清理：\n\n```\nstrung_serps = pd.concat([strung_serps],axis=0)\nstrung_serps\
  \ = strung_serps[['keyword', 'serp_string']]#.head(30)\nstrung_serps = strung_serps.drop_duplicates()\n\
  strung_serps\n```\n\n结果如下：\n\n![](img/537787_1_En_2_Figo_HTML.jpg)\n\n一个包含 3 列 15\
  \ 行的表格截图。列标题为 keyword 和`serp_string`。行索引从 0 开始，到 120 结束。\n\n现在我们有了一个显示关键词及其 SERP\
  \ 字符串的表格，可以开始比较 SERP 了。以下是“fifa 19 ps4”的 SERP 字符串示例：\n\n```\nstrung_serps.loc[1,\
  \ 'serp_string']\n```\n\n结果如下：\n\n```\n'https://www.amazon.co.uk/Electronic-Arts-221545-FIFA-PS4/dp/B07DLXBGN8https://www.amazon.co.uk/FIFA-19-GAMES/dp/B07DL2SY2Bhttps://www.game.co.uk/en/fifa-19-2380636https://www.ebay.co.uk/b/FIFA-19-Sony-PlayStation-4-Video-Games/139973/bn_7115134270https://www.pricerunner.com/pl/1422-4602670/PlayStation-4-Games/FIFA-19-Compare-Priceshttps://pricespy.co.uk/games-consoles/computer-video-games/ps4/fifa-19-ps4--p4766432https://store.playstation.com/en-gb/search/fifa%2019https://www.amazon.com/FIFA-19-Standard-PlayStation-4/dp/B07DL2SY2Bhttps://www.tesco.com/groceries/en-GB/products/301926084https://groceries.asda.com/product/ps-4-games/ps-4-fifa-19/1000076097883https://uk.webuy.com/product-detail/?id=5030945121916&categoryName=playstation4-software&superCatName=gaming&title=fifa-19https://www.pushsquare.com/reviews/ps4/fifa_19https://en.wikipedia.org/wiki/FIFA_19https://www.amazon.in/Electronic-Arts-Fifa19SEPS4-Fifa-PS4/dp/B07DVWWF44https://www.vgchartz.com/game/222165/fifa-19/https://www.metacritic.com/game/playstation-4/fifa-19https://www.johnlewis.com/fifa-19-ps4/p3755803https://www.ebay.com/p/22045274968'\n\
  ```\n\n### 比较 SERP 距离\n\nSERP 比较将使用字符串距离技术，这使我们能够看出一个关键词的 SERP 与其他关键词的 SERP 之间的相似或差异程度。这项技术与遗传学家比较\
  \ DNA 序列的方法类似。\n\n自然，我们需要将 SERP 转换为 Python 可以比较的格式。为此，我们需要将每个 SERP 转换为字符串，然后将它们并排放置。按关键词对表格进行分组：\n\
  \n```\nfiltserps_grpby_keyword = filtered_serps_df.groupby(\"keyword\")\ndef string_serps(df):\n\
  df['serp_string'] = ' '.join(df['url'])\nreturn df\n```\n\n使用上述函数进行合并：\n\n```\n\
  strung_serps = filtserps_grpby_keyword.apply(string_serps)\n```\n\n与初始数据框连接并清理：\n\
  \n```\nstrung_serps = pd.concat([strung_serps],axis=0)\nstrung_serps = strung_serps[['keyword',\
  \ 'serp_string']]#.head(30)\nstrung_serps = strung_serps.drop_duplicates()\n#strung_serps['serp_string']\
  \ = strung_serps.serp_string.str.replace(\"https://www\\.\", \"\")\nstrung_serps.head(15)\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_2_Figp_HTML.jpg)\n\n一个包含 3 列 15 行的表格截图。列标题为\
  \ keyword 和`serp_string`。行索引从 0 开始，到 120 结束。\n\n现在，我们已将关键词及其各自的 SERP 全部转换为字符串，并放入单个单元格中。例如，“beige\
  \ trench coats”的搜索结果如下：\n\n```\n'https://www.zalando.co.uk/womens-clothing-coats-trench-coats/_beige/\
  \ https://www.asos.com/women/coats-jackets/trench-coats/cat/?cid=15143 https://uk.burberry.com/womens-trench-coats/beige/\
  \ https://www2.hm.com/en_gb/productpage.0751992002.xhtml https://www.hobbs.com/clothing/coats-jackets/trench/beige/\
  \ https://www.zara.com/uk/en/woman-outerwear-trench-l1202.xhtml https://www.ebay.co.uk/b/Beige-Trench-Coats-for-Women/63862/bn_7028370345\
  \ https://www.johnlewis.com/browse/women/womens-coats-jackets/trench-coats/_/N-flvZ1z0rnyl\
  \ https://www.elle.com/uk/fashion/what-to-wear/articles/g30975/best-trench-coats-beige-navy-black/'\n\
  ```\n\n是时候将它们并排放置了。我们实际上是在对列自身进行乘积运算，即求平方，以便获得所有可能的 SERP 组合，从而将 SERP 并排放置。\n\n添加一个对齐\
  \ SERP 的函数：\n\n```\ndef serps_align(k, df):\nprime_df = df.loc[df.keyword == k]\n\
  prime_df = prime_df.rename(columns = {\"serp_string\" : \"serp_string_a\", 'keyword':\
  \ 'keyword_a'})\ncomp_df = df.loc[df.keyword != k].reset_index(drop=True)\nprime_df\
  \ = prime_df.loc[prime_df.index.repeat(len(comp_df.index))].reset_index(drop=True)\n\
  prime_df = pd.concat([prime_df, comp_df], axis=1)\nprime_df = prime_df.rename(columns\
  \ = {\"serp_string\" : \"serp_string_b\", 'keyword': 'keyword_b', \"serp_string_a\"\
  \ : \"serp_string\", 'keyword_a': 'keyword'})\nreturn prime_df\n```\n\n在单个关键词上测试该函数：\n\
  \n```\nserps_align('ps4', strung_serps)\n```\n\n设置所需的数据框列：\n\n```\ncolumns = ['keyword',\
  \ 'serp_string', 'keyword_b', 'serp_string_b']\nmatched_serps = pd.DataFrame(columns=columns)\n\
  matched_serps = matched_serps.fillna(0)\n```\n\n为每个关键词调用该函数：\n\n```\nfor q in queries:\n\
  temp_df = serps_align(q, strung_serps)\nmatched_serps = matched_serps.append(temp_df)\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_2_Figq_HTML.jpg)\n\n一个包含 5 列 10 行的表格。列标题为 keyword、`serp_string`、`keyword_b`和`serp_string_b`。行索引从\
  \ 0 到 4，结束于 267 和 271。\n\n上述结果显示，所有关键词的 SERP 都与其他关键词及其 SERP 进行了并排比较。接下来，我们将通过比较`serp_strings`来推断关键词意图的相似性，但在此之前，先对\
  \ Levenshtein、Jaccard 等方法做一个说明。\n\n\n\n莱文斯坦距离是基于编辑次数的度量，即把一个字符串（本例中为 `serp_string`）转换为另一个字符串（`serps_string_b`）所需的编辑次数。这种方法效果不佳，因为\
  \ SERP 字符串中的网站是独立的标记，而非一个连续的字符串。\n\nSørensen-Dice 系数更好，因为它基于标记，即将每个独立网站视为独立的项目或标记。使用集合相似度方法，其逻辑是找出共同的标记，然后通过合并两个集合，用共同标记数除以总标记数。它不考虑顺序，因此我们需要更进一步。\n\
  \nM 度量同时考虑了标记重叠和标记顺序，即对顺序靠前的标记（即排名更高的网站/标记）赋予比靠后标记更高的权重。遗憾的是，目前没有现成的 API，因此我们在此为您编写了函数：\n\
  \n```\nimport py_stringmatching as sm\nws_tok = sm.WhitespaceTokenizer()\n```\n\n\
  仅比较前 `k_urls` 个结果：\n\n```\ndef serps_similarity(serps_str1, serps_str2, k=15):\n\
  denom = k+1\nnorm = sum([2*(1/i - 1.0/(denom)) for i in range(1, denom)])\n#用于对\
  \ URL 进行分词\nws_tok = sm.WhitespaceTokenizer()\n#仅保留前 k 个 URL\nserps_1 = ws_tok.tokenize(serps_str1)[:k]\n\
  serps_2 = ws_tok.tokenize(serps_str2)[:k]\n#获取匹配项的位置\nmatch = lambda a, b: [b.index(x)+1\
  \ if x in b else None for x in a]\n#位置交集，形式为 [(pos_1, pos_2), ...]\npos_intersections\
  \ = [(i+1,j) for i,j in enumerate(match(serps_1, serps_2)) if j is not None]\npos_in1_not_in2\
  \ = [i+1 for i,j in enumerate(match(serps_1, serps_2)) if j is None]\npos_in2_not_in1\
  \ = [i+1 for i,j in enumerate(match(serps_2, serps_1)) if j is None]\na_sum = sum([abs(1/i\
  \ -1/j) for i,j in pos_intersections])\nb_sum = sum([abs(1/i -1/denom) for i in\
  \ pos_in1_not_in2])\nc_sum = sum([abs(1/i -1/denom) for i in pos_in2_not_in1])\n\
  intent_prime = a_sum + b_sum + c_sum\nintent_dist = 1 - (intent_prime/norm)\nreturn\
  \ intent_dist\n```\n\n应用该函数：\n\n```\nmatched_serps['si_simi'] = matched_serps.apply(lambda\
  \ x: serps_similarity(x.serp_string, x.serp_string_b), axis=1)\nmatched_serps[[\"\
  keyword\", \"keyword_b\", \"si_simi\"]]\n```\n\n这是生成的数据框：\n\n![](img/537787_1_En_2_Figr_HTML.jpg)\n\
  \n一个包含 4 列 10 行的表格截图。列标题为 keyword、keyword b 和 s i s i m i。行从 267 开始，到 271 结束。\n\n\
  在将关键词排序到主题组之前，我们先为每个关键词添加搜索量。这可以是一个导入的表格，如下面名为 `keysv_df` 的表格：\n\n```\nkeysv_df\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_2_Figs_HTML.jpg)\n\n一个包含 3 列 20 行的表格截图。列标题为\
  \ keyword 和 search volume。行从 0 开始，到 19 结束。\n\n现在让我们合并数据。我们在这里所做的是让 Python 能够根据 SERP\
  \ 相似度对关键词进行分组，并根据搜索量最高的关键词来命名主题组。\n\n根据相似度阈值按搜索意图对关键词进行分组。在本例中，关键词搜索结果必须具有 40% 或更高的相似度。这个数字是基于反复试验得出的，具体数值可能因搜索空间、语言或其他因素而异。\n\
