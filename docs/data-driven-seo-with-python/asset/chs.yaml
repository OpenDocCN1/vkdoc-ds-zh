  \ client import RestClient\ntarget_bu = 'boundless'\ntarget_site = 'https://boundlesshq.com/'\n\
  target_name = target_bu\n```\n\n我们首先使用 `pandas.read_csv` 函数获取目标关键词的搜索引擎结果页面（SERPs）。我们关注的是\
  \ URL，它将作为查询 Google PageSpeed API 的输入，从而获取核心网页指标（CWV）的度量值：\n\n```python\ndesktop_serps_df\
  \ = pd.read_csv('data/1_desktop' + client_name + '_serps.csv')\ndesktop_serps_df\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_3_Figae_HTML.jpg)\n\n一张表格截图，列标题包括：关键词、排名 _ 绝对、URL\
  \ 和设备。列出了 11 个 URL，设备均为桌面端。\n\nSERPs 数据可能会有些杂乱，最终业务方只关心其直接竞争对手，因此我们将创建一个列表来筛选相应的\
  \ SERPs：\n\n```python\nselected_sites = [target_site, 'https://papayaglobal.com/',\
