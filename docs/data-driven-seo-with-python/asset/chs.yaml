  \ 为 1663，nofollow 为 993，重定向为 13。\n\n### 合并数据\n\n现在，来自各自工具源的数据已导入，可以准备进行合并。通常，数据集之间的公共列（称为“主键”）是\
  \ URL，因为这是搜索引擎排名的依据。\n\n我们将从将 SERP 数据与爬取数据合并开始。在此之前，我们只需要包含竞争对手网站的 SERP 数据。\n\n\
  ```\nplayer_serps = serps_df[serps_df['site'].isin(player_sites_lst)]\n```\n\n通过使用`.merge()`函数实现类似\
  \ VLOOKUP 的操作，将竞争对手 SERP 数据与排名 URL 的爬取数据合并：\n\n```\nplayer_serps_crawl = player_serps.merge(cleaner_crawl,\
  \ on = ['url'], how = 'left')\nplayer_serps_crawl = player_serps_crawl.rename(columns\
  \ = {'site_x': 'site'})\n```\n\n使用`.drop()`函数删除不必要的列：\n\n```\nplayer_serps_crawl.drop(['site_y',\
  \ 'sitefile'], axis = 1, inplace = True)\nplayer_serps_crawl\n```\n\n结果如下：\n\n![](img/537787_1_En_6_Figl_HTML.jpg)\n\
  \n一个包含 4 行 9 列的数据表，表头为：关键词、排名、url、位置代码、语言代码、搜索引擎结果数量、网站、排名概况和品牌化（针对关键词 msofas uk）。数据显示了在同一位置和同一语言下的\
  \ 3 个不同 url 和网站，排名分别为 8、55 和 77。\n\n下一步是使用`merge()`函数将反向链接权威数据与包含 SERP 和爬取指标的数据集合并：\n\
  \n```\nplayer_serps_crawl_auth = player_serps_crawl.copy()\nplayer_serps_crawl_auth\
  \ = player_serps_crawl_auth.merge(auth_df_raw, on = ['url'], how = 'left')\nplayer_serps_crawl_auth.drop(['sitefile'],\
  \ axis = 1, inplace = True)\nplayer_serps_crawl_auth\n```\n\n数据现已合并，每个 SERP URL\
  \ 的站内和站外 SEO 数据都存储在一个数据框中：\n\n![](img/537787_1_En_6_Figm_HTML.jpg)\n\n一个包含 4 行 9\
  \ 列的数据表，表头为：关键词、排名、url、位置代码、语言代码、搜索引擎结果数量、网站、排名概况和品牌化（针对关键词 msofas uk）。数据显示了在同一位置和同一语言下的\
  \ 3 个不同 url 和网站，排名分别为 8、55 和 77。\n\n### 衍生新特征\n\n合并数据的一大好处是，你可以衍生出可能无法从单个数据集中获得的新特征。例如，一个非常有用的特征是，比较标题标签与目标搜索短语的相似度（或差异度）。这使用了爬取数据中排名\
  \ URL 的标题标签和 SERP 关键词。这些新特征为我们提供了额外的假设，以便后续使用机器学习过程进行测试。\n\n我们将从创建一个新的数据框开始，并衍生多个新数据特征，这些特征将作为额外的列存储：\n\
  \n```\nhypo_serps_features = player_serps_crawl_auth.copy()\n```\n\n添加`regional_tld`，用于指示排名\
  \ URL 是否进行了区域化：\n\n```\nregional_tlds = ['.uk']\nhypo_serps_features['regional_tld']\
  \ = np.where(hypo_serps_features['site'].str.contains('|'.join(regional_tlds)),\
  \ 1, 0)\n```\n\n使用`sorensen_dice()`函数添加一个指标，用于衡量目标关键词在标题标签中的使用程度：\n\n```\nhypo_serps_features['title']\
  \ = hypo_serps_features['title'].astype(str)\nhypo_serps_features['title_relevance']\
  \ = hypo_serps_features.loc[:, ['title', 'keyword']].apply(\nlambda x: sorensen_dice(*x),\
  \ axis=1)\n```\n\n我们还对衡量标题标签与 H1 标题一致性的影响程度感兴趣：\n\n```\nhypo_serps_features['h1']\
  \ = hypo_serps_features['h1'].astype(str)\nhypo_serps_features['title_h1'] = hypo_serps_features.loc[:,\
  \ ['title', 'h1']].apply(\nlambda x: sorensen_dice(*x), axis=1)\n```\n\n标题标签中是否包含品牌名称重要吗？让我们来一探究竟：\n\
  \n```\nhypo_serps_features['site'] = hypo_serps_features['site'].astype(str)\nhypo_serps_features['hostname']\
  \ = hypo_serps_features['site'].apply(lambda x: extract(x))\nhypo_serps_features['hostname']\
  \ = hypo_serps_features['hostname'].str.get(1)\nhypo_serps_features['title'] = hypo_serps_features['title'].str.lower()\n\
  hypo_serps_features['title_branded'] = hypo_serps_features.loc[:,\n['title', 'hostname']].apply(\n\
  lambda x: sorensen_dice(*x), axis=1)\n```\n\n另一个有用的特征是 URL 参数，即排名 URL 中的问号：\n\n\
  ```\nhypo_serps_features['url_params'] = np.where(hypo_serps_features['url'].str.contains('\\\
  ?'), '1', '0')\nhypo_serps_features['url_params'] = hypo_serps_features['url_params'].astype('category')\n\
  ```\n\n另一个测试是排名 URL 是否包含 Google Analytics 代码。这不太可能产生什么影响，但如果数据可用，何乐而不为呢？\n\n```\n\
  hypo_serps_features['google_analytics_code'] = np.where(hypo_serps_features[\n'google_analytics_code'].str.contains('UA'),\
  \ '1', '0')\nhypo_serps_features['google_analytics_code'] = hypo_serps_features['google_analytics_code'].astype('category')\n\
  ```\n\nGoogle Tag Manager 代码也是如此：\n\n```\nhypo_serps_features['google_tag_manager_code']\
  \ = np.where(\nhypo_serps_features['google_tag_manager_code'].str.contains('GTM'),\
  \ '1', '0')\nhypo_serps_features['google_tag_manager_code'] = hypo_serps_features['google_tag_manager_code'].astype('category')\n\
  ```\n\n虽然跟踪代码本身不太可能解释排名差异，但同一跟踪代码的重复实例可能具有解释力：\n\n```\nhypo_serps_features['google_tag_manager_code_second_']\
  \ = np.where(\nhypo_serps_features['google_tag_manager_code_second_'].str.contains('GTM'),\
  \ '1', '0')\nhypo_serps_features['google_tag_manager_code_second_'] = hypo_serps_features[\n\
  'google_tag_manager_code_second_'].astype('category')\n```\n\n添加了一个缓存控制测试，用于检查其是私有、公共还是其他类型，并将其转换为类别。\n\
  \n\n\n`hypo_serps_features['cache_privacy'] = np.where(\nhypo_serps_features['cache-control'].str.contains('private'),\
  \ 'private', '0')\nhypo_serps_features['cache_privacy'] = np.where(\nhypo_serps_features['cache-control'].str.contains('public'),\
  \ 'public', hypo_serps_features['cache_privacy'])\nhypo_serps_features['cache_privacy']\
  \ = np.where(\nhypo_serps_features['cache-control'].str.contains('0'), 'other',\
  \ hypo_serps_features['cache_privacy'])\nhypo_serps_features['cache_privacy'] =\
  \ hypo_serps_features['cache_privacy'].astype('category')\n```\n\n此外，还通过提取 `cache-control`\
  \ 字符串中的数值部分添加了缓存年龄。这是通过按 `=` 号分割字符串，然后使用 `.get()` 函数，再转换为数值浮点数据类型来实现的：\n\n```\n\
  hypo_serps_features['cache_age'] = hypo_serps_features['cache-control'].str.split('\\\
  =')\nhypo_serps_features['cache_age'] = hypo_serps_features['cache_age'].str.get(-1)\n\
  hypo_serps_features['cache_age'] = np.where(hypo_serps_features['cache_age'].isnull(),\
  \ 0,\nhypo_serps_features['cache_age'])\nhypo_serps_features['cache_age'] = np.where(hypo_serps_features['cache_age'].str.contains('[a-z]'),\n\
  0, hypo_serps_features['cache_age'])\nhypo_serps_features['cache_age'] = hypo_serps_features['cache_age'].astype(float)\n\
  ```\n\n以下是一个测试排名 URL 是否为规范 URL 的代码：\n\n```\nhypo_serps_features['self_canonicalised']\
  \ = np.where(hypo_serps_features[\n'canonical_url'] == hypo_serps_features['url'],\
  \ 1, 0)\n```\n\n我们删除了诸如 `canonical_url` 之类的标识符，因为这些是标识单行的个体记录，对分析没有任何帮助。\n\n我们只对这个独特数据值本身的特征或趋势感兴趣。\n\
  \n我们还删除了可能冗余或不感兴趣的假设，例如 HTTP 协议。这取决于你自己的 SEO 经验和判断。\n\n```\nhypo_serps_features.drop(['cache-control',\
  \ 'canonical_url', 'base_url', 'crawl_status', 'host', 'encoding', 'indexable_status',\
  \ 'meta_robots_response_', 'title', 'title_response_', 'title_second_', 'title_render_status',\
  \ 'meta_description', 'meta_description_response_',  'h1', 'h1_second_', 'h2', 'h2_second_',\
  \ 'open_graph_audio', 'twitter_card_site', 'twitter_card_creator', 'twitter_card_description',\
  \ 'twitter_card_image_url', 'twitter_card_title', 'content-security-policy', 'referrer-policy',\
  \ 'hostname', 'open_graph_description', 'open_graph_image_url', 'open_graph_locale',\
  \ 'open_graph_site_name', 'open_graph_title' , 'open_graph_url', 'meta_robots_rendered_',\
  \ 'twitter_card_description', 'twitter_card_title', 'http_protocol', 'http_status_code'\
  \ ], axis = 1, inplace = True)\n```\n\n完成后，我们将创建另一个数据框副本并导出为 CSV，为机器学习做准备，从单层因子开始：\n\
  \n```\nhypo_serps_pre_slf = hypo_serps_features.copy()\nhypo_serps_pre_slf.to_csv('data/'+\
  \ geo_market +'_hypo_serps_pre_slf.csv', index = False)\nhypo_serps_pre_slf\n```\n\
  \n结果如下：\n\n![](img/537787_1_En_6_Fign_HTML.jpg)\n\n一个包含 1294 行和 340 列的表，表头为关键词、排名、URL、位置代码、语言代码、搜索结果数量、网站、排名概况，以及按关键词分类的品牌化。数据中展示了同一位置、语言和品牌下的不同\
  \ URL 和网站。\n\n### 单层因子 (SLFs)\n\n单层因子是指任何列中所有值都相同的情况，这不仅冗余，还会导致机器学习代码失败。例如，所有排名\
  \ URL 的标题可能都是品牌化的，在这种情况下，这些列应该被移除。\n\n为了移除 SLF，我们将逐列遍历数据框，识别出包含 70% 或更多相同值的列，并将这些列名存储在一个列表中。70%\
  \ 是一个任意阈值；你可以选择 80% 或 90%；然而，这可能会带来移除一些有洞察力的排名因子的风险——即使这些因子只适用于少数 URL，而这些 URL 可能恰恰是排名最高的\
  \ URL。\n\n```\nslf_cols = []\nslf_limit = .7\nfor col in hypo_serps_pre_slf.columns:\n\
  if hypo_serps_pre_slf[col].value_counts().iat[0] >= (hypo_serps_pre_slf.shape[0]\
  \ * slf_limit):\nslf_cols.append(col)\nslf_cols\n```\n\n包含 70% 相同数据的列打印如下，并将从数据集中移除：\n\
  \n```\n['location_code',\n'language_code',\n'rank_profile',\n'branded',\n'count',\n\
  'crawl_depth',\n'is_subdomain',\n'no_query_string_keys',\n'query_string_contains_filtered_parameters',\n\
  'query_string_contains_more_than_three_keys',\n'query_string_contains_paginated_parameters',\n\
  'query_string_contains_repetitive_parameters',\n'query_string_contains_sorted_parameters',\n\
  'scheme',...\n```\n\n让我们使用 `groupby()` 函数检查其中几个 SLF 排名因子。从 `branded` 开始，我们可以看到所有排名\
  \ URL 的标题都是品牌化的，因此这些可以移除：\n\n```\nhypo_serps_pre_slf.groupby('branded')['count'].sum().sort_values()\n\
  branded\ngeneric    1294\nName: count, dtype: int64\nhypo_serps_pre_slf.groupby('url_params')['count'].sum().sort_values\n\
  ```\n\n参数化 URL 似乎也是冗余的，只有 17 个 URL 是参数化的。然而，这些可能仍会以意想不到的方式提供洞察。\n\n识别出 SLF 后，我们将在新的数据框中处理它们，使用列表推导式将其移除：\n\
  \n```\nhypo_serps_pre_mlfs = hypo_serps_pre_slf.copy()\n```\n\n要移除的列列表需要进一步细化，因为我们希望保留前面提到的\
  \ `url_params` 列以及 `count` 列，以便在后续过程中进行进一步聚合：\n\n```\nslf_cols = [elem for elem\
  \ in slf_cols if not elem in ['count', 'url_params']]\n```\n\n删除 SLF 列：\n\n```\n\
  hypo_serps_pre_mlfs.drop(slf_cols, axis = 1, inplace = True)\nhypo_serps_pre_mlfs\n\
  ```\n\n生成的 `hypo_serps_pre_mlfs` 数据框已移除 SLF 列：\n\n![](img/537787_1_En_6_Figo_HTML.jpg)\n\
  \n一个包含 1294 行和 175 列的表，表头为关键词、排名、URL、搜索结果数量、网站、计数、令牌计数、令牌大小，以及用于关键词分类的压缩。数据展示了不同的排名网站和\
  \ URL，令牌计数范围为 2 到 4，令牌大小为中等和长，压缩方式为 brotli、gzipped 和 nan。\n\n### 重新缩放数据\n\n无论你使用的是线性回归等线性模型还是决策树，两者都能从数据重新缩放中受益，因为数据变得“标准化”，使得机器学习在比较排名与页面速度等因素时更容易检测到变化：\n\
  \n```\nhypo_serps_preml_prescale = hypo_serps_pre_mlfs.copy()\n```\n\n使用 `.dtypes`\
  \ 将列分为数值列和非数值列，以便重新缩放数值列：\n\n```\nhypo_serps_preml_num = hypo_serps_preml_prescale.select_dtypes(include=np.number)\n\
  hypo_serps_preml_num_colnames = hypo_serps_preml_num.columns\n```\n\n非数值列保存到另一个数据框中，用于后续合并：\n\
  \n```\nhypo_serps_preml_nonnum = hypo_serps_preml_prescale.select_dtypes(exclude=np.number)\n\
  hypo_serps_preml_num\n```\n\n生成的 `hypo_serps_preml_num` 如下所示，仅包含数值列，已准备好进行重新缩放：\n\
  \n![](img/537787_1_En_6_Figp_HTML.jpg)\n\n\n\n一个包含 1294 行和 136 列的表，表头为`rank`、`se_results_count`、`count`、`token_count`、`expires_date`、`no_cookies`、`file_size_kib`、`total_page_size_kib`、`no_canonical_links`、`total_canonicals`和`no_internal`。所有字段的数据均为数值型。\n\
  \n我们将使用`sklearn` API 预处理函数中的`MinMaxScaler()`：\n\n```python\nfrom sklearn import\
  \ preprocessing\n```\n\n将列值转换为`numpy`数组，然后使用`MinMaxScaler()`函数重新缩放数据：\n\n```python\n\
  x = hypo_serps_preml_num.values\nmin_max_scaler = preprocessing.MinMaxScaler()\n\
  x_scaled = min_max_scaler.fit_transform(x)\nhypo_serps_preml_num_scaled = pd.DataFrame(x_scaled,\
  \ index=hypo_serps_preml_num.index, columns = hypo_serps_preml_num_colnames)\nhypo_serps_preml_num_scaled\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_6_Figq_HTML.jpg)\n\n一个包含 1294 行和 136 列的表，表头为`rank`、`se_results_count`、`count`、`token_count`、`expires_date`、`no_cookies`、`file_size_kib`、`total_page_size_kib`、`no_canonical_links`和`total_canonicals`。列中的数据以`numpy`数组形式呈现，例如`rank`为`0.069307`、`count`为`0.0`、`token_count`为`0.2`、`no_cookies`为`0.12500`、`file_size`为`0.481670`。\n\
  \n### 近零方差（NZVs）\n\n下一步是消除与 SLFs 相似的冗余数值数据列，这些列被称为近零方差（NZVs）。虽然数值不同，但可能没有足够的变异来可靠地解释排名位置的差异，因此我们希望移除这些列。\n\
  \n为了识别 NZVs，我们将使用 SK Learn API 中的`VarianceThreshold`函数：\n\n```python\nfrom sklearn.feature_selection\
  \ import VarianceThreshold\nvariance = hypo_serps_preml_num_scaled.var()\ncolumns\
  \ = hypo_serps_preml_num_scaled.columns\n```\n\n保存方差大于阈值的变量名称：\n\n```python\nhighvar_variables\
  \ = [ ]\nnz_variables = [ ]\n```\n\n我们将遍历数值列，将阈值设置为 7%，即数据中必须至少有 7%的变异才能保留在数据集中。同样，7%是一个任意选择。高变异列存储在我们之前创建的`highvar_variables`列表中：\n\
  \n```python\nfor i in range(0,len(variance)):\nif variance[i]>=0.07:\nhighvar_variables.append(columns[i])\n\
  else:\nnz_variables.append(columns[i])\nhighvar_variables\n```\n\n`highvar_variables`如下所示：\n\
  \n```python\n['rank',\n'no_canonical_links',\n'total_canonicals',\n'no_internal_followed_linking_urls',\n\
  'no_internal_followed_links',\n'no_internal_linking_urls',\n'no_internal_links_to_url',\n\
  'url_rank', ...]\nnz_variables\n```\n\n结果如下：\n\n```python\n['se_results_count',\n\
  'count',\n'token_count',\n'expires_date',\n'no_cookies',\n'file_size_kib_',\n'total_page_size_kib_',\
  \ ...]\n```\n\n识别并存储在`nz_variables`中的 NZVs 如上所示。我们可以看到，例如，更多的网页在搜索查询中的关键词数量（`token_count`）和\
  \ HTML 页面大小（`total_page_size_kib_`）上具有高度相似的值，因此我们很乐意移除这些列。\n\n这是一个快速的合理性检查，以确保没有列同时被列为高变异和\
  \ NZV：\n\n```python\n[x for x in highvar_variables if x in nz_variables]\n```\n\n\
  返回一个空列表，因此幸运的是没有交叉：\n\n```python\n[]\n```\n\n让我们检查一下识别出的几个 NZV 列。尽管被识别为 NZV，但`title_relevance`仍有一些变异，如下所示使用`describe()`函数。我们可以看到数据范围从\
  \ 0 到 1，四分位距为 0.32 到 0.62，当然这是在重新缩放之后。根据 SEO 经验，我们将保留`title_relevance`，因为它是一个重要的排名因素：\n\
  \n```python\nhypo_serps_preml_num_scaled['title_relevance'].describe()\n```\n\n\
  结果如下：\n\n```python\ncount    1294.000000\nmean        0.478477\nstd         0.199106\n\
  min         0.000000\n25%         0.323529\n50%         0.512712\n75%         0.622487\n\
  max         1.000000\nName: title_relevance, dtype: float64\n```\n\n另一方面，`scaled_images`列是\
  \ NZV，如下所示，大多数值为零，直到第 75 百分位数的 0.17，显示出非常小的变异，因此应排除：\n\n```python\nhypo_serps_preml_num_scaled['scaled_images'].describe()\n\
  ```\n\n结果如下：\n\n```python\ncount    977.000000\nmean       0.114348\nstd       \
  \ 0.163530\nmin        0.000000\n25%        0.000000\n50%        0.000000\n75% \
  \       0.179487\nmax        1.000000\nName: scaled_images, dtype: float64\n```\n\
  \n我们将重新定义`highvar_variables`列表，以包含我们认为应保留在数据集中的一些 NZVs：\n\n```python\nhighvar_variables\
  \ = highvar_variables + ['title_relevance', 'title_branded', 'no_content_words',\
  \ 'first_contentful_paint', 'scaled_images', 'no_outgoing_links']\n```\n\n保存一个新的数据框，仅包含`highvar_variables`中列出的列：\n\
  \n```python\nhypo_serps_preml_num_highvar = hypo_serps_preml_num_scaled[highvar_variables]\n\
  hypo_serps_preml_num_highvar\n```\n\n`hypo_serps_preml_num_highvar`数据框如下所示，已从 136\
  \ 列减少到 38 列，移除了 98 列。\n\n![](img/537787_1_En_6_Figr_HTML.jpg)\n\n一个包含 1294 行和 38\
  \ 列的表，表头为`rank`、`no_canonical_links`、`total_canonicals`、`no_internal_followed_linking_urls`、`no_internal_followed_links`、`no_internal_linking_urls`和`no_internal_links_to_url`。一行中显示的数据分别为`0.069307`、`0.0`、`0.0`、`0.966667`、`0.496454`、`0.966667`和`0.496454`。\n\
  \n接下来，我们还将使用`statsmodels` API 中的`variance_inflation_factor()`函数来检测较大的方差膨胀因子（VIF），从而移除彼此高度相关的排名因素（称为多重共线性）。多重共线性是一个问题，因为它会降低用于建模搜索结果排名的排名特征的统计显著性。\n\
  \n排名特征或任何建模变量上的较大方差膨胀因子（VIF）暗示着与其他排名因素的高度相关关系。移除这些变量将提高模型的预测一致性，即在做出预测时更稳定且误差更小。\n\
  \n```python\nfrom statsmodels.stats.outliers_influence import variance_inflation_factor\n\
  ```\n\n移除包含缺失值（`np.nan`）和无穷值（`np.inf`、`-np.inf`）的行：\n\n```python\nvif_input = hypo_serps_preml_num_highvar[~hypo_serps_preml_num_highvar.isin([np.nan,\
  \ np.inf, -np.inf]).any(1)]\nStore in X_variables.\nX_variables = vif_input\n```\n\
  \n通过应用`variance_inflation_factor()`函数确定高度相关的列：\n\n```python\nvif_data = pd.DataFrame()\n\
  vif_data[\"feature\"] = X_variables.columns\nvif_data[\"vif\"] = [variance_inflation_factor(X_variables.values,\
  \ i) for i in range(len(X_variables.columns))]\nvif_data.sort_values('vif')\n```\n\
  \n使用`describe()`函数打印 VIF 数据分布，以了解列间相关性的水平，并将其作为我们拒绝列的标准：\n\n```python\nvif_data['vif'].describe()\n\
  ```\n\n结果如下：\n\n```python\ncount      38.000000\nmean             inf\nstd     \
  \         NaN\nmin         3.254763\n25%        26.605281\n50%        76.669063\n\
  75%      3504.833113\nmax              inf\nName: vif, dtype: float64\n```\n\n在确定了\
  \ VIF 范围后，我们将丢弃任何 VIF 高于中位数的排名因素。从技术上讲，最佳实践是 VIF 为 5 或以上即为高度相关；然而，在这种情况下，我们只是希望移除过度相关的排名因素，这仍然是一种改进：\n\
  \n```python\nhypo_serps_preml_lowvif = hypo_serps_preml_num_highvar.copy()\nvif_exclude_df\
  \ = vif_data.loc[vif_data['vif'] > vif_data['vif'].median()]\nvif_exclude_cols =\
  \ vif_exclude_df['feature'].tolist()\nhypo_serps_preml_lowvif.drop(vif_exclude_cols,\
  \ inplace = True, axis = 1)\nhypo_serps_preml_lowvif\n```\n\n\n\n我们现在已经从 38 列减少到了\
  \ 19 列。正如你可能已经逐渐意识到的那样，机器学习并非简单地将数字代入就能得到结果，因为必须做大量工作才能将数据整理成可用的格式。\n\n![](img/537787_1_En_6_Figs_HTML.jpg)\n\
  \n一个包含 1294 行和 19 列的数据表，表头为`rank`，无锚点文本，无出站导航链接，包含文档文件、脚本（含未使用的 JS）、总计浪费的 JS 资源（KB）以及性能评分。`rank`为\
  \ 0.69307 时显示的数据依次为 0.000000、0.696884、0.000000、0.023256、0.029986、0.191919；`rank`为\
  \ 0.752475 时，各列数据均为`NaN`。\n\n### 中位数填充\n\n我们希望尽可能多地保留数据行，因为任何列中存在缺失值的行都将被移除。一种技术是使用中位数填充，即估算给定数据列的中位数来替换缺失值。当然，由于我们是在不同站点之间进行比较，在领域级别而非整个列上计算中位数可能更有意义。因此，在可能的情况下，我们将在领域级别使用中位数填充，否则在列级别使用。\n\
  \n导入库以检测`for`循环中使用的数据类型，从而识别非数值列以进行中位数填充：\n\n```\nfrom pandas.api.types import is_string_dtype\n\
  from pandas.api.types import is_numeric_dtype\nhypo_serps_preml_median = hypo_serps_preml_lowvif.copy()\n\
  ```\n\n设置变量，以便`for`循环可以对整个列以及在领域级别（`\"site\"`）执行`groupby()`操作：\n\n```\nhypo_serps_preml_median['site']\
  \ = hypo_serps_preml_prescale['site']\nhypo_serps_preml_median['project'] = 'competitors'\n\
  for col, col_val in hypo_serps_preml_median.iteritems():\nif col in ['http_status_code']\
  \ or not is_numeric_dtype(hypo_serps_preml_median[col]):\ncontinue\nhypo_serps_preml_median[col].fillna(hypo_serps_preml_median.groupby('site')[col].transform('median'),\
  \ inplace=True)\nhypo_serps_preml_median[col].fillna(hypo_serps_preml_median.groupby('project')[col].transform('median'),\
  \ inplace=True)\nhypo_serps_preml_median.drop(['site', 'project'], axis = 1, inplace\
  \ = True)\nhypo_serps_preml_median\n```\n\n结果是一个缺失值更少的数据框，提高了数据保留率。\n\n![](img/537787_1_En_6_Figt_HTML.jpg)\n\
  \n一个包含 1294 行和 19 列的数据表，表头为`rank`，无锚点文本，无出站导航链接，包含文档文件、脚本（含未使用的 JS）、总计浪费的 JS 资源（KB）以及性能评分。`rank`为\
  \ 0.752475 时显示的数据不再是`NaN`，而是依次为 0.007692、0.453258、0.166667、0.139535、0.297817 和 0.262626。\n\
  \n### 独热编码\n\n独热编码是一种帮助统计模型将分类数据转换为它们更容易解释的二进制格式（0 和 1）的技术。它通过为给定分类数据列的每个值创建额外的列来实现这一点。然后根据数据点，在相应的列中分配值为\
  \ 1 或 0。这里不举例说明，我们将直接运行代码，结果在生成的数据框中应该显而易见。\n\n我们不想为关键词和 URL 等列创建独热编码，因为它们不是排名因素，因此我们将从数据框中删除这些列：\n\
  \n```\nstop_cols = ['keyword', 'url', 'site']\nhypo_serps_preml_cat = hypo_serps_preml_nonnum.drop(stop_cols,\
  \ axis = 1)\n```\n\n将分类数据列存储在一个列表中：\n\n```\ncategorical_cols = hypo_serps_preml_cat.columns.tolist()\n\
  ```\n\n使用列表推导式更新`categorical_cols`列表，确保排除停止列：\n\n```\ncategorical_cols = [feat for\
  \ feat in categorical_cols if feat not in stop_cols]\ncategorical_cols\n```\n\n\
  以下是即将进行独热编码的分类列：\n\n```\n['token_size',\n'compression',\n'connection',\n'charset',\n\
  'canonical_status',\n'canonical_url_render_status',\n'flesch_kincaid_reading_ease',\n\
  'sentiment',\n'contains_paginated_html', ... ]\nhypo_serps_preml_cat\n```\n\n以下是仅选择了独热编码列的数据框。\n\
  \n![](img/537787_1_En_6_Figu_HTML.jpg)\n\n一个包含 1294 行和 38 列的数据表，表头为`token size`、`http\
  \ status code`、`compression`、`connection`、`charset`、`canonical status`、`canonical\
  \ url render status`、`flesch kincaid reading ease`和`sentiment`。数据读取为：middle 或 long、200\
  \ 或`NaN`、brotli、gzipped 或`NaN`、no data 或`NaN`、utf-B 或`NaN`、missing、to self 或`NaN`、no\
  \ change、created 或`NaN`、very easy、fairly easy、standard 或`NaN`，以及 neutral、positive\
  \ 或`NaN`。\n\n将使用`get_dummies()`为每个分类排名因素创建独热编码列：\n\n```\nhypo_serps_preml_ohe =\
  \ pd.get_dummies(hypo_serps_preml_cat, columns = categorical_cols)\nhypo_serps_preml_ohe\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_6_Figv_HTML.jpg)\n\n一个包含 1294 行和 95 列的数据表，表头为`token\
  \ size head`、`token size long`、`token size middle`、`compression brotli`、`compression\
  \ gzipped`、`connection nodata`、`connection keep alive`、`keep alive`和`charset UTF`。列中的数据填充为\
  \ 0 或 1。\n\n通过独热编码，分类列已从 38 列扩展到 95 列。例如，`compression`列已被两个新列`compression_Brotli`和`compression_Gzipped`替代，因为该排名因素只有两个值。\n\
  \n### 消除缺失值\n\n在清理和转换了数值和分类数据列之后，我们现在准备合并数据并消除缺失值。\n\n使用`concat()`合并数据框：\n\n```\n\
  hypo_serps_preml_ready = pd.concat([hypo_serps_preml_ohe, hypo_serps_preml_median],\
  \ axis = 1)\nhypo_serps_preml_ready\n```\n\n数据框现在合并为一个名为`\"hypo_serps_preml_ready\"\
  `的单一数据框。\n\n![](img/537787_1_En_6_Figw_HTML.jpg)\n\n一个包含 1294 行和 114 列的数据表，表头为`token\
  \ size head`、`token size long`、`token size middle`、`compression brotli`、`compression\
  \ gzipped`、`connection nodata`、`connection keep alive`、`keep alive`和`charset UTF`。列中的数据填充为\
  \ 0 或 1。\n\n下一个准备步骤是消除`\"NA\"`值，因为机器学习算法不太能处理单元格值为“不可用”的情况。\n\n首先，通过计算每列空值的总和并除以总行数，检查哪些列包含一定比例的缺失值：\n\
  \n```\npercent_missing = hypo_serps_preml_ready.isnull().sum() * 100 / len(hypo_serps_preml_ready)\n\
  ```\n\n我们将缺失数据的计算结果放入一个单独的数据框，然后对值进行排序：\n\n```\nmissing_value_df = pd.DataFrame({'column_name':\
  \ hypo_serps_preml_ready.columns,\n'percent_missing': percent_missing})\nmissing_value_df.sort_values('percent_missing')\n\
  ```\n\n我们可以看到没有列包含缺失值，这是个好消息，可以进入下一阶段。如果存在缺失值，这些列将被移除，因为我们已经尽力改进了数据以达到目前的状态。\n\n\
  ![](img/537787_1_En_6_Figx_HTML.jpg)\n\n一个包含 114 行和 2 列的数据表，表头为`column name`和`percent\
  \ missing`。数据中没有包含缺失值的列。所有列的缺失百分比均为 0.0。\n\n### 对 SERP 进行建模\n\n快速提醒一下，对 SERP 进行建模是一个公式，它将根据\
  \ SEO 特征预测排名，即：\n\n```\nrank ~ w_1*feature_1 + w_2*feature_2 + … + w_n*feature_n\n\
  ```\n\n`~` 表示“由……解释”。`n` 是第 n 个特征。`w` 是特征的权重。\n\n以下是一些值得提及的要点：\n\n*   将数据集拆分为测试集（20%）和训练集（80%）。模型将从大部分数据集（训练集）中学习，并应用于测试集（模型之前未见过的数据）。我们这样做是为了了解模型在真实场景中的实际表现。\n\
  \n\n\n我们将使用基于决策树的模型，即随机森林。随机森林使用多个决策树并取所有决策树的平均值，以得到最终最能泛化数据集的模型，因此很可能在未见数据上表现良好。随机森林还可以处理线性模型无法处理的非线性关系。\n\
  \n设置随机种子是为了控制模型的随机性，使结果可重现，以便其他 SEO/数据科学家可以使用相同的数据评估研究并得到相同的结果。\n\n将使用交叉验证来使模型尽可能稳健，且不进行超参数调优。\n\
  \n通常，随机森林模型（或任何机器学习模型）在拥有 10,000 行或更多数据时表现最佳，但数据量少得多时仍能提供有价值的见解。\n\n导入相关的 API 和库，这些主要来自`scikit-learn`，一个用于\
  \ Python 的免费机器学习软件库：\n\n```\nfrom sklearn.model_selection import cross_val_score\n\
  from sklearn.model_selection import RepeatedKFold\nfrom sklearn.ensemble import\
  \ RandomForestRegressor\nfrom sklearn.model_selection import train_test_split\n\
  from sklearn.preprocessing import StandardScaler\nimport category_encoders as ce\n\
  from sklearn import metrics\nhypo_serps_ml = hypo_serps_preml_ready.copy()\n```\n\
  \n对数据进行编码：\n\n```\nencoder = ce.HashingEncoder()\nserps_features_ml_encoded = encoder.fit_transform(hypo_serps_ml)\n\
  serps_features_ml_encoded\n```\n\n结果如下：\n\n![](img/537787_1_En_6_Figy_HTML.jpg)\n\
  \n一个包含 1294 行和 114 列的表，表头为`token size head`、`token size long`、`token size middle`、`compression\
  \ brotli`、`compression gzipped`、`connection nodata`、`connection keep alive`、`keep\
  \ alive`和`charset UTF`。数据在列中重复相同的值，值为 0 或 1。\n\n将目标变量设置为`rank`，这是我们希望解释并指导 SEO 建议的结果：\n\
  \n```\ntarget_var = 'rank'\n```\n\n将排名因子数据分配给`X`，将`rank`分配给`y`：\n\n```\nX, y = serps_features_ml_encoded.drop(target_var,\
  \ axis=1), serps_features_ml_encoded[target_var]\n```\n\n为了训练模型，我们使用`RandomForestRegressor`，因为它往往比线性回归模型提供更好的结果。您可以并行尝试的替代方案包括`XGBoost`、`LightGBM`（尤其适用于更大的数据集）和`AdaBoost`。\n\
  \n实例化模型：\n\n```\nregressor = RandomForestRegressor(n_estimators=20, random_state=1231)\n\
  ```\n\n对模型进行交叉验证。当模型进行交叉验证时，实际上是通过进一步划分训练数据集来评估模型，以查看模型在所有训练数据上的泛化能力，并希望也能泛化到真实世界。\n\
  \n在我们的案例中，我们将模型分割五次，并将结果存储在`n_scores`中：\n\n```\nn_scores = cross_val_score(regressor,\
  \ X, y, scoring='neg_mean_absolute_error', cv=5, n_jobs=-1)\nn_scores\n```\n\n将数据随机分割为训练集和测试集：\n\
  \n```\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2,\
  \ random_state=1231)\n```\n\n基于训练集拟合机器学习模型：\n\n```\nregressor.fit(X_train, y_train)\n\
  ```\n\n在测试数据集上测试模型，并将预测结果存储到`y_pred`中：\n\n```\ny_pred = regressor.predict(X_test)\n\
  ```\n\n### 评估 SERPs ML 模型\n\n现在我们有了模型，可以测试其有效性。一般原则是：\n\n*   向`predict`命令提供测试数据集和模型\n\
  *   计算均方根误差（RMSE）和`r-squared`\n\n由于排名建模和预测是一个回归问题，我们使用`RMSE`和`r-squared`作为评估指标。那么它们告诉我们什么？\n\
  `RMSE`告诉我们预测排名的平均误差范围。例如，`RMSE`为 5 意味着模型预测的排名位置平均会与真实值相差±5。\n`r-squared`的正式名称为“决定系数”。这意味着什么？实际上，`r-squared`表示数据集中可以被模型解释的数据点比例。它通过取相关系数（`r`）的平方来计算，因此得名`r-squared`。`r-squared`为\
  \ 0.4 意味着 40%的数据可以被模型解释。\n要警惕`r-squared`为 1 或任何接近 1 的模型，尤其是在 SEO 中。很可能代码中存在错误，或者模型过拟合，或者您为\
  \ Google 工作。无论如何，您都需要调试。\n\n`r-squared`远不如`RMSE`有用，因此我们在此不详细讨论。但是，如果您仍然想了解`r-squared`，可以通过运行以下命令查看训练模型（即基于训练数据）的`r-squared`：\n\
  \n```\nprint('MAE: %.3f (%.3f)' % (np.mean(n_scores), np.std(n_scores)))\nprint('Mean\
  \ Absolute Error:', metrics.mean_absolute_error(y_test, y_pred))\nprint('Mean Squared\
  \ Error:', metrics.mean_squared_error(y_test, y_pred))\nprint('Root Mean Squared\
  \ Error:', np.sqrt(metrics.mean_squared_error(y_test, y_pred)))\nMAE: -0.222 (0.010)\n\
  Mean Absolute Error: 0.23340777636881724\nMean Squared Error: 0.0861631648297419\n\
  Root Mean Squared Error: 0.2935356278712039\n```\n\n您可能想知道这些指标的良好或合理值是多少。事实是，这取决于您需要模型有多好以及您打算如何使用它。\n\
  如果您打算将模型用作自动化 SEO 系统的一部分，该系统将直接对您的内容管理系统（CMS）进行更改，那么`RMSE`需要非常准确，因此可能不超过五个排名位置。即便如此，这也取决于您排名的起始位置，因为对于已经在第一页排名的页面来说，五个位置的差异与在第三页排名的页面相比，意义完全不同！\n\
  如果模型的预期用例仅仅是深入了解驱动排名的因素，以及您应该优先进行 A/B 测试或优化的内容，那么`RMSE`为 20 或更小是可以接受的。\n\n### 排名的最具预测性驱动因素\n\
  \n那么机器学习模型能告诉我们什么秘密？我们将提取排名因子和模型重要性数据到一个数据框中：\n\n```\ndf_imp = pd.DataFrame({\"\
  feature\": X.columns.values,\n\"importance\": regressor.feature_importances_,\n\
  })\ndf_imp = df_imp.sort_values('importance', ascending = False)\ndf_imp = df_imp\n\
  df_imp\n```\n\n以下数据框结果显示了按重要性降序排列的最具影响力的 SERP 特征或排名因子。\n\n![](img/537787_1_En_6_Figz_HTML.jpg)\n\
  \n一个包含 113 行和 2 列的表，列名为`feature`和`importance`，显示了影响数据的 SERP 特征。数据读取`title relevance`具有高重要性`466.821502`，而`viewport\
  \ error initial scale missing`具有最小重要性`0.002879`。\n\n使用`plotnine`库将重要性数据绘制成条形图：\n\
  \n```\nRankFactor_plt = (ggplot(df_imp.head(7), aes(x = 'reorder(feature, importance)',\
  \ y = 'importance')) +\ngeom_bar(stat = 'identity', fill = 'blue', alpha = 0.6)\
  \ +\nlabs(y = 'Google Influence', x = '') +\ntheme_classic() +\ncoord_flip() +\n\
  theme(legend_position = 'none')\n)\nRankFactor_plt.save(filename = 'images/1_RankFactor_plt.png',\
  \ height=5, width=5, units = 'in', dpi=1000)\nRankFactor_plt\n```\n\n\n\n# 在此特定案例中，图\
  \ 6-3 显示，最重要的因素是 `title_relevance`，它衡量的是标题标签与目标关键词之间的字符串距离。这是通过字符串重叠度来衡量的，即目标关键词在标题标签字符串中所占的比例。\n\
  \n![](img/537787_1_En_6_Fig3_HTML.png)\n\n一幅展示各因素与谷歌影响力关系的水平条形图。标题相关性（title relevance）的条形是最具影响力的因素，数值为\
  \ 450，而内容词数量（no content words）的条形数值为 30。\n\n**图 6-3**  \n变量重要性图，展示了由机器学习算法识别出的最具影响力的排名因素\n\
  \n对于 SEO 从业者来说，这并不意外；然而，其价值在于为那些不理解优化标题标签必要性的非专业商业受众提供了经验证据。这类数据也可用于争取非 SEO 同事（如开发人员）的支持，以便优先处理\
  \ SEO 变更请求。\n\n该行业中其他值得注意的因素如下：\n\n- `no_cookies`：Cookie 的数量\n- `dom_ready_time_ms`：页面速度的衡量指标\n\
  - `no_template_words`：主体内容区域之外的单词数量\n- `link_root_domains_links`：指向根域名的链接数量\n- `no_scaled_images`：需要浏览器缩放才能渲染的缩放图片数量\n\
  \n每个市场或行业都各不相同，因此上述内容并非适用于整个 SEO 领域的通用结论！\n\n### 排名因素的价值几何\n\n现在你已经有了模型，你可能希望将你的发现传达给同事和客户。我们将研究其中一个排名因素，以此为例说明如何传达机器学习模型的发现。\n\
  \n将最具影响力的排名因素存储在一个列表中：\n\n```\ninfluencers = ['title_relevance', 'no_outgoing_navigation_links',\
  \ 'title_branded', 'performance_score', 'first_contentful_paint', 'title_h1', 'no_content_words']\n\
  ```\n\n选择 `performance_score` 作为我们想要研究的排名因素。根据 Python 的零索引，这将是列表中的第四个元素，索引为 3：\n\
  \n```\ni = 3\n```\n\n计算统计数据，以平均网站 CWV 性能和谷歌排名：\n\n```\nnum_factor_agg = hypo_serps_features.groupby(['site']).agg({str(influencers[i]):\
  \ 'mean', 'rank': 'mean', 'se_results_count': 'sum', 'count': 'sum'}).reset_index()\n\
  num_factor_agg = num_factor_agg.sort_values(str(influencers[i]))\n```\n\n为了在图表中向客户展示与竞争对手不同的颜色，我们将创建一个新列\
  \ `target`，如果该网站是客户网站，则值为 1，否则为 0：\n\n```\nnum_factor_agg['target'] = np.where(num_factor_agg['site'].str.contains(hostname),\
  \ 1, 0)\nnum_factor_agg\n```\n\n以下是用于生成图 6-4 中图表的数据框。\n\n![](img/537787_1_En_6_Figaa_HTML.jpg)\n\
  \n一个包含 11 行 6 列的表格，表头为：网站（site）、性能得分（performance score）、排名（rank）、搜索结果数量（se results\
  \ count）、计数（count）和目标（target）。网站 johnsankey dot co dot uk 的目标值为 1，其他网站的目标值为 0。\n\
  \n此函数根据你希望拟合的直线（1 次）或曲线（2 次或更高次）返回多项式最佳拟合线：\n\n```\ndef poly(x, degree=1):\n   \
  \ \"\"\"\n    拟合多项式\n    这些是非正交因子，但如果仅用于平滑处理而非外推预测，则可能无关紧要。\n    \"\"\"\n    d =\
  \ {}\n    for i in range(degree+1):\n        if i == 1:\n            d['x'] = x\n\
  \        else:\n            d[f'x**{i}'] = np.power(x, i)\n    return pd.DataFrame(d)\n\
  ```\n\n绘制图表：\n\n```\nnum_factor_viz_plt = (\n    ggplot(num_factor_agg,\n      \
  \     aes(x = str(influencers[i]), y = 'rank', fill = 'target', colour = 'target',\
  \ #shape = 'cat_item',\n               size = 'se_results_count')) +\n    geom_point(alpha\
  \ = 0.3) +\n    geom_smooth(method = 'lm', se = False, formula = 'y ~ poly(x, degree=1)',\
  \ colour = 'blue', size = 1.5) +\n    labs(y = '谷歌排名', x = str(influencers[i]))\
  \ +\n    scale_y_reverse() +\n    scale_size_continuous(range = [5, 20]) +\n   \
  \ theme(legend_position = 'none', axis_text_x=element_text(rotation=0, hjust=1,\
  \ size = 12))\n)\nnum_factor_viz_plt\n```\n\n通过绘制各网站的平均核心网页指标（CWV）与平均谷歌排名的关系图（图\
  \ 6-4），并包含一条最佳拟合线，我们可以估算出 CWV 每单位改进对排名的影响。在此案例中，CWV 每提升 1 个单位，排名大约提升 0.5 个位置。\n\n\
  ![](img/537787_1_En_6_Fig4_HTML.jpg)\n\n一个气泡图，展示了谷歌排名与性能得分的最佳拟合线。该图呈现正斜率。\n\n**图\
  \ 6-4**  \n比较谷歌排名与 CWV 性能得分的网站气泡图\n\n### 排名因素的获胜基准\n\n获胜基准似乎也是 70，这对开发人员来说可能是个安慰，因为要达到\
  \ 90 分或以上的分数可能需要耗费大量资源。多亏了机器学习，我们不仅能够发现最重要的因素，在进行深入分析时，还能看到获胜基准。\n\n### 让你的模型更稳健的技巧\n\
  \n当然，没有模型是完美的，也永远不会完美。模型的实用性取决于：\n\n-   你的想象力、创造力、SEO 知识以及提出对模型构建有信息价值的假设的能力\n-\
  \   你将这些假设转化为可在你网站和竞争对手网站上收集为数据的可衡量指标的能力\n-   你构建对模型识别模式有意义的数据结构的方式\n\n### 付诸行动\n\
  \n有了模型输出，你现在可以就你的 SEO 策略做出一些决策，包括：\n\n-   你希望在全站范围内进行的“无需动脑”的更改，例如网站速度或增加品牌搜索量（通过程序化广告、内容营销或两者结合）\n\
  -   对你模型中包含的因素进行拆分 A/B 测试\n-   对排名因素本身进行进一步研究，以指导你的建议\n\n### 自动化此分析\n\n上述机器学习应用非常适合获得一些想法，用于进行拆分\
  \ A/B 测试，并通过基于证据的变更请求来改进 SEO 计划。同样重要的是要认识到，当这种分析持续进行时，其效果会更加强大。为什么？因为机器学习分析只是对某个时间点搜索引擎结果页面（SERP）的快照。持续的数据收集和分析流意味着你可以更真实地了解你的行业在\
  \ SERP 中实际发生的情况。\n\n这就是专为 SEO 构建的数据仓库和仪表盘系统发挥作用的地方，这些产品如今已经可用。这些系统的作用是：\n\n-   每天从你喜欢的\
  \ SEO 工具中摄取数据\n-   整合数据\n-   使用机器学习在你选择的前端（如 Google Data Studio）中像之前一样呈现洞察\n\n要构建你自己的自动化系统，你需要在云基础设施（如亚马逊云服务（AWS）或谷歌云平台（GCP））中部署所谓的\
  \ ETL，即提取、转换和加载，以便你的数据收集、分析和可视化在一个地方实现自动化。这在第 8 章中有更详细的说明。\n\n## 总结\n\n在本章中，你学到了：\n\
  \n-   理解用于竞争对手分析的排名因素背后的数据科学原理\n-   如何整合数据源\n-   如何为机器学习准备数据\n-   如何训练机器学习模型\n-\
  \   如何使用模型输出来生成 SEO 建议\n\n\n\n# SEO 中的竞争对手研究与分析\n\nSEO 中的竞争对手研究与分析之所以困难，是因为存在大量可用的排名因素，且需要控制的变量众多。由于涉及的数据量庞大，电子表格工具难以胜任，更不用说像`Python`这样的数据科学语言所提供的统计能力了。\n\
  \n在使用机器学习（ML）进行 SEO 竞争对手分析时，重要的是要理解这是一个回归问题，目标变量是谷歌排名，而假设则是排名因素。\n\n在第 7 章中，我们将介绍实验，这些实验自然是在竞争对手统计分析结果之后进行的。\n\
  \n# 7. 实验\n\n从数据或你自己的思维实验中发掘出可以应用到你的网站上、并带来真正、显著的自然流量提升的见解，是相当令人兴奋的。随着诸如 Distilled\
  \ ODN 和 RankScience 等拆分测试平台的兴起，实验在 SEO 中扮演着越来越重要的角色，这并不令人意外。\n\n如果你运营的是一个小型网站，那么导致负面影响的改动可能无关紧要，或者该改动看似是显而易见的\
  \ SEO 最佳实践，那么你可以放弃正式的实验，而专注于实施你认为必要的改动。\n\n另一方面，如果你是在一个大型企业网站上工作，无论是内部团队还是作为代理机构的一部分，那么任何改动都将产生重大影响，你需要确保测试这些改动，以便了解其影响（包括正面和负面），同时也有助于塑造你的理解，为形成新的待测试假设提供信息。\n\
  \n### 实验如何融入 SEO 流程\n\n要成功进行实验和 A/B 拆分测试，你需要一个从想法产生（也称为假设）到实施的完整流程。我们概述了以下步骤：\n\n\
  1.  假设生成\n2.  实验设计\n3.  运行实验\n4.  评估\n5.  实施\n\n我们将在以下章节中介绍这些步骤。\n\n### 生成假设\n\n\
  在任何实验开始之前，你需要围绕你的假设来构建它，即你相信什么会显著改变你的目标变量或结果指标，例如，自然展示次数或已爬取的 URL。\n\n这一步至关重要，因为如果没有清晰的假设，你就无法知道要测试什么来影响你的结果指标。所以，思考一下你想从哪些方面学习，以帮助你提升\
  \ SEO 表现。\n\n假设的来源有多个方面：\n\n*   竞争对手分析\n*   网站文章和社交媒体\n*   你/你团队的想法\n*   最近的网站更新\n\
  *   会议活动和行业同行\n*   过去的实验失败案例\n\n我通常喜欢使用这样的格式：“*我们相信*谷歌会给予那些被网站其他重要页面链接的 URL 更高的权重。”然后，这个陈述会被扩展，以考虑你提议测试的内容以及你将如何衡量（例如，“当……时，我们将知道该假设是否有效”）。\n\
  \n### 竞争对手分析\n\n你进行的竞争对手分析（在第 6 章中解释过）将是测试想法的自然来源，因为它们具有一定的统计基础，能够揭示你的竞争对手正在做或没有做哪些事情来获得更优的自然流量表现。这些假设还有一个额外的好处，即从一开始就知道你将测试的指标是什么。毕竟，你首先需要将数据纳入你的分析中。\n\
  \n### 网站文章和社交媒体\n\n我们经常读到一些研究、文章和社交媒体梗，声称它们驱动或降低了自然流量表现。这并不是说这些说法不真实或没有根据。然而，这些说法并不适用于你的具体情况，如果它们成为了新闻，那么很可能值得测试。顺便提一下，在数据科学真正兴起之前的\
  \ SEO 职业生涯早期，真正了解你的数据的最佳方式就是测试我们在网上读到的所有关于 SEO 的内容，例如 Webmaster World、BlackHatWorld\
  \ 论坛等，看看哪些有效，哪些无效。如果你的网站没有被谷歌从索引中移除，你就不会被视为一个受人尊敬的 SEO，或者也许你只是没有大胆地进行实验。其本质就是为搜索引擎进行“优化”。\n\
  \n当然，情况已经发生了变化，我们大多数从事 SEO 的人现在是为品牌和成熟企业工作。因此，一些创造性的、狂野的实验可能不合适，或者会限制职业发展，我们并不提倡这样做。\n\
  \n### 你/你团队的想法\n\n测试假设并不局限于你直接的 SEO 团队（内部或代理机构），甚至不限于你的数字营销团队。这可以是对网站有任何接触并有任何想法的同事。他们的大部分想法可能不值得投入资源进行实验。然而，他们的想法，因为他们（应该）关心业务，所以值得考虑。当然，从\
  \ SEO 的角度来看，你直接的 SEO 团队可能对需要测试的事情有更好的想法。\n\n### 最近的网站更新\n\n通常，在大型网站更新影响你的自然流量之前进行测试是更好的。然而，由于其他相互竞争的优先级或紧迫的时间表，你可能没有这样的奢侈条件。尽管如此，如果一个产品更新预计会影响你的自然流量，无论好坏，例如推出一个精简的顶级导航，你最好能知道原因并抢在全面发布之前，这样你就可以测试它，以了解其对\
  \ SEO 的影响。\n\n### 会议活动和行业同行\n\n为什么要把你的想法局限于线上和你的公司呢？参加行业活动不仅是寻找新的 SEO 测试内容的好方法，而且还可以在活动中遇到可能正在解决相同问题的人。思想的多样性受到高度重视，并可能带来突破性的实验想法。\n\
  \n### 过去的实验失败案例\n\n如果失败了，那就尝试、再尝试、再尝试。通常，如果一个实验失败了，往往是因为实验没有达到所需的样本量，或者实验设计或运行不正确。从中学习并重复迭代。无论是设计、正确运行，还是重新制定你的假设，都要去做，并持续迭代，直到获得期望的结果。你可能会走向与最初失败的实验不同的方向，但在这个过程中你会学到很多东西。\n\
  \n### 实验设计\n\n在决定了要测试哪些假设之后，你现在就可以设计你的实验了。在下面的代码示例中，我们将设计一个实验，以查看一个测试项（可以是任何东西，比如主标题下方的一段文字）在\
  \ URL 层面对自然展示次数的影响。\n\n让我们从导入 API 开始：\n\n```python\nimport re\nimport time\nimport\
  \ random\nimport pandas as pd\nimport numpy as np\nimport datetime\nimport requests\n\
  import json\nfrom datetime import timedelta\nfrom glob import glob\nimport os\n\
  from plotnine import *\nimport matplotlib.pyplot as plt\nfrom pandas.api.types import\
  \ is_string_dtype\nfrom pandas.api.types import is_numeric_dtype\nfrom datetime\
  \ import datetime, timedelta\n```\n\n这些是执行实际拆分测试所需的：\n\n```python\nfrom statsmodels.discrete.discrete_model\
  \ import NegativeBinomial\nfrom statsmodels.tools.tools import add_constant\nfrom\
  \ collections import Counter\nimport uritools\npd.set_option('display.max_colwidth',\
  \ None)\n%matplotlib inline\n```\n\n\n\n因为我们使用的是网站分析数据（常见品牌包括 Google、Looker、Adobe），这些数据可以轻松地从按日期划分的落地页报告中导出。如果网站规模较大，则可能需要使用\
  \ API（Google Analytics 相关 API 请参见第 8 章）。\n\n根据你使用的网站分析工具，列名可能有所不同；但是，如果你想测试不同 URL\
  \ 组在时间维度上的展示次数差异，你需要以下字段：\n\n- `Date`\n- `Landing page URL`\n- `Sessions`\n\n除了`Sessions`，也可以测试其他指标，例如展示次数、点击率、排名等。\n\
  \n假设你有一个 CSV 导出文件，使用`pd.read_csv`从网站分析工具中读取数据：\n\n```python\nanalytics_raw = pd.read_csv(\"\
  data/expandable-content.csv\")\n```\n\n打印各列的数据类型，检查是否有数值数据被导入为字符串类型（需要转换）：\n\n```python\n\
  print(analytics_raw.dtypes)\nlanding_page     object\ndate             object\n\
  sessions        float64\ndtype: object\n```\n\n会话数据是数值型浮点数，这没问题；但日期数据被归类为“`object`”，这意味着需要将其转换为日期格式。\n\
  \n我们将使用`.copy()`方法创建数据框的副本。这样，我们做的任何修改都不会影响原始导入的表。这样一来，如果对修改不满意，我们无需从头重新导入。\n\n\
  ```python\nanalytics_clean = analytics_raw.copy()\n```\n\n日期列使用`to_datetime()`函数，该函数接收列和日期格式，然后进行归一化处理，将字符串转换为日期格式。\n\
  \n这对于后续填充缺失日期和绘制时间序列数据非常重要：\n\n```python\nanalytics_clean['date'] = pd.to_datetime(analytics_clean['date'],\
  \ format='%d/%m/%Y').dt.normalize()\nanalytics_clean\n```\n\n下面的 Pandas 数据框展示了`analytics_clean`，现在数据已转换为可用格式，便于进一步操作，例如绘制会话随时间变化的图表。\n\
  \n![](img/537787_1_En_7_Figa_HTML.jpg)\n\n一个包含 157678 行和 3 列的表，展示了 `www.next.com/shop`\
  \ 落地页的详细信息、日期和会话数。\n\n让我们使用`.describe()`探索会话的分布情况：\n\n```python\nanalytics_raw.describe()\n\
  ```\n\n以下截图展示了会话的分布情况，包括计数（数据点数量）、平均值（均值）等。\n\n![](img/537787_1_En_7_Figb_HTML.jpg)\n\
  \n一个表格展示了会话的详细信息：计数、均值、标准差、最小值、25%、50%、75% 和最大值。\n\n我们可以看到，每个 URL 在任意给定日期的平均会话数约为\
  \ 2，但标准差为 4，表明波动很大。鉴于均值为 2，而一个落地页的会话数不可能为 –2（均值 2 减去标准差 4），这意味着某些异常页面获得了极高的会话数，这解释了波动的原因。\n\
  \n现在查看日期：\n\n```python\nanalytics_clean['date'].describe()\n```\n\n结果如下：\n\n```\n\
  count                  157678\nunique                     28\ntop       2019-08-18\
  \ 00:00:00\nfreq                     6351\nfirst     2019-08-06 00:00:00\nlast \
  \     2019-09-02 00:00:00\nName: date, dtype: object\n```\n\n除了数据日期范围大约在八月份之外，没有太多其他信息。\n\
  \n## 零膨胀\n\n网站分析通常只在网页有展示时才会记录数据。那么，当页面没有展示时，该怎么办呢？\n\n零膨胀是指为那些在特定日期没有记录到自然展示的页面添加空记录。如果我们不进行零膨胀，那么对于某个网页，甚至对于一组页面（例如\
  \ A 和 B），数据的均值都会产生偏差。\n\n例如，URL X 在分析工具记录的某段时间内的 10 天里获得了 90 次会话，这可能会让你认为日均展示次数是\
  \ 9 次。然而，由于这些会话只发生在 10 天内，你的计算会误导你认为该 URL 的表现比实际更好。通过零膨胀数据，即为 30 天期间内 URL X 没有自然展示的天数添加空行，计算出的平均值将恢复到预期的每天\
  \ 3 次。\n\n零膨胀还为我们提供了另一个有用的特性，那就是泊松分布。解释泊松分布超出了本书的范围。但你需要知道的是，当我们测试 A 组和 B 组之间的差异时，泊松分布常用于罕见事件。两组之间任何统计上显著的差异，都有望表明测试组\
  \ B 的零值显著少于 A 组。科学原理讲够了，我们开始实践吧。\n\n有一种更简单（但不太容易理解）的方法来填充缺失日期。本章将介绍两种方法，先从较长但更易读的方法开始。\n\
  \n这里，我们使用`date_range()`函数，根据分析数据框中的最小和最大日期设置日期范围，间隔为一天。这被保存到一个名为`datelist`的变量对象中：\n\
  \n```python\ndatelist = pd.date_range(start=analytics_clean['date'].min(),\nend=analytics_clean['date'].max(),\
  \ freq='1d')\n```\n\n`nd`是日期范围内的天数，`nu`是我们需要日期的唯一落地页列表的长度：\n\n```python\nnd = len(datelist)\n\
  nu = len(analytics_clean['landing_page'].unique())\n```\n\n这里，我们通过落地页和日期的交叉乘积，创建一个包含所有可能的落地页和日期组合的数据框：\n\
  \n```python\nanalytics_expanded = pd.DataFrame({'landing_page': analytics_clean['landing_page'].unique().tolist()\
  \ * nd,\n'date':np.repeat(datelist, nu)})\n```\n\n然后，我们查找哪些日期和落地页有对应的会话记录：\n\n```python\n\
  analytics_expanded = analytics_expanded.merge(analytics_clean, how='left')\n```\n\
  \n任何不匹配（因此为空）的记录都用零填充：\n\n```python\nanalytics_expanded[['date','sessions']] = analytics_expanded.groupby('landing_page')[\n\
  ['date', 'sessions']].fillna(0)\n```\n\n将会话数据转换为数值型浮点数，以便于数据处理：\n\n```python\nanalytics_expanded['sessions']\
  \ = analytics_expanded['sessions'].astype('int64')\nanalytics_expanded\n```\n\n\
  得到的数据框`analytics_expanded`如下所示，是我们准备好进行拆分测试的零膨胀数据框。请注意，原始分析数据有 157,678 行，经过零膨胀后，现在有\
  \ 807,212 行。\n\n![](img/537787_1_En_7_Figc_HTML.jpg)\n\n一个包含 807212 行和 3 列的表，展示了\
  \ `www.next.com/shop` 落地页的详细信息、日期和会话数。\n\n让我们使用`.describe()`探索数据，它将告诉我们经过零膨胀后会话分布的变化：\n\
  \n```python\nanalytics_expanded.describe()\n```\n\n以下截图展示了零膨胀后的会话分布情况。\n\n![](img/537787_1_En_7_Figd_HTML.jpg)\n\
  \n一个表格展示了会话的详细信息：计数、均值、标准差、最小值、25%、50%、75% 和最大值。\n\n差异巨大！均值从 2.16 下降了超过 75%，降至 0.42，并且几乎没有任何页面在不到一个月的时间内获得超过一次会话。\n\
  \n## 拆分 A/A 分析\n\n\n\nA/A 测试是这样一个过程：我们在一个时间段内对相同的项目进行自我测试。这是由 SearchPilot（前身为 Distilled\
  \ ODN）推广的一种拆分测试类型，如图 7-1 所示。\n\n![](img/537787_1_En_7_Fig1_HTML.jpg)\n\n该图表展示了置信区间的正面示例。它标明了上限、下限、估计的累积影响，以及测试开始日期后\
  \ 95% 确信存在提升的时间点。底部的文本框说明，测试的真实影响有 95% 的可能性。\n\n图 7-1 SearchPilot 的拆分 A/B 分析**来源**：[`www.searchpilot.com/features/seo-a-b-testing/`](http://www.searchpilot.com/features/seo-a-b-testing/)\n\
  \n例如，我们选取一个 URL 样本，并在对该样本实施测试之前对其性能进行基准测试，以观察是否会产生显著影响。\n我们进行 A/A 测试的主要动机是确定 A/B\
  \ 测试设计是否足够可靠，可以继续进行。我们期望看到的是 A 之前和 A 之后之间没有差异。\n我们将测试 13 天，假设在此期间没有进行任何更改，尽管在实际环境中，你会在测试前检查是否一切未变。\n\
  为什么是 13 天？这是一个任意数字；然而，后续会给出确定稳健 A/B 测试样本量的方法，以确保检测到的任何差异都是显著的。同样的方法也可以在这里应用。\n\n\
  这个 A/A 测试仅仅是为了说明如何创建数据结构并进行测试。因此，如果你想进行“SearchPilot”风格的拆分测试，那么除了样本量和测试周期的确定之外，以下代码将帮助你运行它：\n\
  \n```\naa_test_period = 13\n```\n\n将截止日期设置为最新日期减去测试周期：\n\n```\ncutoff = analytics_expanded['date'].max()\
  \ -  timedelta(days = aa_test_period)\n```\n\n为 A/A 测试创建一个名为 `analytics_phased`\
  \ 的数据框副本：\n\n```\nanalytics_phased = analytics_expanded.copy()\n```\n\n根据日期在截止日期之前还是之后设置\
  \ A/A 分组：\n\n```\nanalytics_phased['aa_group'] = np.where(analytics_expanded['date']\
  \ < cutoff, \"pre_test\", \"test_period\")\nanalytics_phased\n```\n\n这应该会产生以下输出：\n\
  \n![](img/537787_1_En_7_Fige_HTML.jpg)\n\n一个包含 807212 行和 4 列的表格，列出了着陆页、日期、会话以及分组（如\
  \ `pre_test` 和 `test_period`）的详细信息。\n\n在测试之前，让我们通过分析来确定两个 A/A 组的统计属性，这可以预示实际拆分 A/A\
  \ 测试的结果可能是什么。\n\n第一个函数是 `day_range()`，它返回日期范围内的天数，即最新日期减去最早日期：\n\n```\ndef day_range(date):\n\
  return (max(date) - min(date)).days\n```\n\n首先，我们通过过滤非零会话的数据，然后按 A/A 组聚合日期范围和平均值来计算均值：\n\
  \n```\naa_means = (\nanalytics_phased.loc[analytics_phased[\"sessions\"] != 0]\n\
  .groupby([\"aa_group\"])\n.agg({\"date\": [\"min\", \"max\", day_range], \"sessions\"\
  : \"mean\"})\n)\naa_means\n```\n\n生成的 `aa_means` 数据框显示以下输出：\n\n![](img/537787_1_En_7_Figf_HTML.jpg)\n\
  \n一个表格显示了名为 `pre-test` 和 `test-period` 的两个 A/A 组的最小和最大日期、日期范围以及平均会话数的详细信息。\n\n我们可以看到日期范围和日期范围是正确的，并且每组的平均值在四舍五入为整数时大致相同。\n\
  \n```\naa_means = analytics_phased.loc[analytics_phased['sessions'] != 0]\n```\n\
  \n让我们确定组间的变异：\n\n```\naa_zeros = analytics_phased.copy()\n```\n\n创建一个零值列，以便我们统计零值及其比率：\n\
  \n```\naa_zeros['zeros'] = np.where(aa_zeros['sessions'] == 0, 1, 0)\naa_zeros['rows']\
  \ = 1\n```\n\n按 A/A 组聚合零值数量和总数据点数：\n\n\n```python\naa_means_sigmas = aa_zeros.groupby('aa_group').agg({'zeros':\
  \ sum, 'rows': sum}).reset_index()\n```\n\n计算变异“sigma”，即零值占总可能会话数的 99.5%：\n\n```python\n\
  aa_means_sigmas['sigma'] = aa_means_sigmas['zeros']/aa_means_sigmas['rows'] * 0.995\n\
  aa_means_sigmas\n```\n\n这将产生以下输出：\n\n![](img/537787_1_En_7_Figg_HTML.jpg)\n\n该表格显示了名为“pre-test”和“test-period”的两个\
  \ A/A 组的零值、行数和 sigma 的详细信息。\n\n我们可以看到，在截断点前后变异非常相似，这让我们对 URL 足够稳定以进行 A/B 测试有了一定的信心。\n\
  \n使用`.merge()`函数（Python 中 Excel 的`vlookup`的等效函数）将它们合并：\n\n```python\naa_means_stats.merge(aa_means_sigmas,\
  \ on = 'aa_group', how = 'left')\n```\n\n这将产生以下输出：\n\n![](img/537787_1_En_7_Figh_HTML.jpg)\n\
  \n该表格显示了名为“pre-test”和“test-period”的两个 A/A 组的最小日期、最大日期、会话数、日期范围、零值、行数和 sigma 的详细信息。\n\
  \n如果你正在进行 A/A 测试以查看优化的效果，那么你会希望看到`test_period`组报告更高的会话率，同时 sigma 相同或更低。这将表明你的优化成功增加了\
  \ SEO 流量。\n\n让我们使用`plotnine`的直方图绘制功能来可视化分布：\n\n```python\naa_test_plt = (\nggplot(analytics_phased,\n\
