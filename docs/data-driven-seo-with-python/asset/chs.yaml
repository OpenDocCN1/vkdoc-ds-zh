  \n\n\n### 标题聚类\n\n之所以要进行聚类，是因为作者们会使用不同的词语来描述同一个章节标题，并刻意为之，以避免侵犯版权和抄袭。然而，谷歌足够智能，能够识别出“网络研讨会最佳实践”和“网络研讨会的最佳实践”是同一回事。\n\
  \n为了利用谷歌的知识，我们将借助搜索引擎结果页面（SERP）来查看每个标题的搜索结果是否足够相似，从而判断它们是否表达相同的意思（即，其底层含义或意图是否相同）。\n\
  \n我们将创建一个列表，并使用搜索意图聚类代码（参见第 2 章）将标题归类到不同的主题中：\n\n```\nheadings_to_cluster = headings_tosum_filtered[['heading']].drop_duplicates()\n\
  headings_to_cluster = headings_to_cluster.loc[~headings_to_cluster['heading'].isnull()]\n\
  headings_to_cluster = headings_to_cluster.rename(columns = {'heading': 'keyword'})\n\
  headings_to_cluster\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figy_HTML.jpg)\n\n一张包含\
  \ 206 行 1 列的表格截图，展示了关键词条目的数据框。\n\n将标题按搜索意图聚类后，我们导入结果：\n\n```\ntopic_keyw_map = pd.read_csv('data/topic_keyw_map.csv')\n\
  ```\n\n让我们将关键词列重命名为标题，以便稍后用于与 SERP 数据框进行连接：\n\n```\ntopic_keyw_map = topic_keyw_map.rename(columns\
  \ = {'keyword': 'heading'})\ntopic_keyw_map\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figz_HTML.jpg)\n\
  \n一张包含 10 行 3 列的表格截图，展示了主题、标题和主题结果条目的数据框。\n\n该数据框显示了标题及其作为“主题”的含义。下一步是获取一些统计数据，看看一个主题由多少个标题构成。由于主题是标题的核心含义，这将构成每个目标关键词的核心内容部分。\n\
  \n```\ntopic_keyw_map_agg = topic_keyw_map.copy()\ntopic_keyw_map_agg['count'] =\
  \ 1\ntopic_keyw_map_agg = topic_keyw_map_agg.groupby('topic').agg({'count': 'sum'}).reset_index()\n\
  topic_keyw_map_agg = topic_keyw_map_agg.sort_values('count', ascending = False)\n\
  topic_keyw_map_agg\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figaa_HTML.jpg)\n\n一张包含\
  \ 18 行 2 列的表格截图，展示了主题和计数字段的数据框。\n\n“创建有效的网络研讨会”是最受欢迎的内容部分。\n\n现在，这些数据将与 SERP 合并，以便我们将建议的内容映射到目标关键词：\n\
  \n```\nserps_topics_merge = serps_headings.copy()\n```\n\n为了成功合并，我们需要将标题转换为小写：\n\
  \n```\nserps_topics_merge['heading'] = serps_topics_merge['heading'].str.lower()\n\
  serps_topics_merge = serps_topics_merge.merge(topic_keyw_map, on = 'heading', how\
  \ = 'left')\nserps_topics_merge\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figab_HTML.jpg)\n\
  \n一张包含 5 行 12 列的表格截图，展示了与 SERP 合并后的条目数据框。列标题依次为：域名、标题、视频、主机、网站、位置、标题、项目、主题、主题结果和计数。\n\
  \n```\nkeyword_topics_summary = serps_topics_merge.groupby(['keyword', 'topic']).agg({'count':\
  \ 'sum'}).reset_index().sort_values(['keyword', 'count'], ascending = False)\n```\n\
  \n计数将被重置为 1，这样我们就可以计算每个目标关键词的建议内容部分数量：\n\n```\nkeyword_topics_summary['count'] =\
  \ 1\nkeyword_topics_summary\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figac_HTML.jpg)\n\
  \n一张包含 26 行 3 列的表格截图，展示了关键词、主题和计数字段的数据框。\n\n上述数据框显示了应为每个目标关键词编写的内容部分（主题）。\n\n```\n\
  keyword_topics_summary.groupby(['keyword']).agg({'count': 'sum'}).reset_index()\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_4_Figad_HTML.jpg)\n\n一张包含 8 行 2 列的表格截图，展示了关键词和计数字段的数据框。\n\
  \n“网络研讨会最佳实践”将拥有最多的内容，而其他目标关键词平均会有大约两个核心内容部分。\n\n### 反思\n\n对于 B2B 营销来说，这种方法效果非常好，因为它是一种很好的方式，可以自动化大多数\
  \ SEO 专业人员都会经历的手动流程（即，查看排名前 10 的页面覆盖了哪些内容），尤其是在你需要为大量关键词创建内容时。\n\n我们使用了 H1 和 H2\
  \ 标签，因为如果使用正文中更多的文本（例如 H3 或`<p>`段落，即使在过滤掉停用词之后），会给字符串距离计算引入更多噪音。\n\n有时，你会得到一些相当不错的可靠建议；然而，在向你的创意团队或代理机构提出内容需求之前，应该先对输出结果进行审查。\n\
  \n## 总结\n\nSEO 的许多方面都旨在提供比竞争对手更好的内容和用户体验。本章重点介绍了：\n\n*   **关键词映射**：将关键词分配给现有内容，并识别创建新内容的机会。\n\
  \n*   **内容差距分析**：识别关键内容以及你网站中的内容缺口。\n\n*   **内容创作**：为你的目标搜索短语，找到排名靠前的文章所共有的核心内容。\n\
  \n下一章将讨论 SEO 的第三大支柱：权威性。\n\n"
- "# 5. 权威性\n\n可以说，权威性占据了谷歌算法的 50%。你可以倾尽全力优化你的网站，创建完美的内容，并以完美的用户体验呈现，这些内容托管在拥有最完美信息架构的网站上，但最终却发现，当按页面标题搜索时（假设这不是一个独特的搜索短语），它在谷歌搜索结果中毫无踪影。这是为什么呢？\n\
  \n你将在本章中了解这一点以及以下内容：\n\n*   什么是网站权威性，以及它如何影响 SEO\n\n*   品牌搜索如何影响搜索可见性\n\n*   回顾单站点和多站点分析\n\
  \n## 一些 SEO 历史\n\n要回答这个问题，我们必须了解搜索引擎的演变过程，以及 1998 年谷歌出现之前的情况有多么混乱。即使谷歌出现后，情况依然混乱且发展迅速。\n\
  \n在谷歌之前，大多数搜索引擎，如 AltaVista、雅虎和 Ask（Jeeves），主要关注页面内容中嵌入的关键词。这使得搜索引擎相对容易被各种技巧所操纵，包括在白色背景上使用白色文字隐藏关键词，或者大量重复关键词。\n\
  \n当谷歌出现时，他们做了几件与众不同的事情，这基本上颠覆了其他竞争搜索引擎。\n\n第一件事是，他们的算法根据页面的权威性（换句话说，就是文档或网站的可信度）对页面进行排名，而不仅仅是根据关键词相关性匹配文档。当时的权威性由谷歌通过指向你网站的其他网站链接数量来衡量。这与博士论文中的引用方式非常相似。链接（或引用）越多，网络上的随机用户找到你内容的可能性就越高。这使得\
  \ SEO 更难被操纵，并且结果（暂时但显著地）相对于竞争对手更可靠。\n\n他们做的第二件事是与雅虎合作，雅虎公开承认其搜索结果由谷歌提供支持。那么接下来发生了什么？人们不再使用雅虎，而是直接使用谷歌，绕过了作为中间人的雅虎搜索引擎，剩下的就是历史了——或者说，并非如此。\n\
  \n\n\n### 一点历史背景\n\n尽管谷歌占据了搜索市场的绝大部分份额，但 SEO 行业还是摸清了谷歌算法的大致原理，并开始策划链接流行度方案，例如交换链接（即互惠链接）以及从私密网络创建/租用链接（不幸的是，这种做法至今依然存在）。谷歌则用熊猫和企鹅等反垃圾算法予以回应，这些算法或多或少地摧毁了这些方案，以至于品牌领域的大多数企业不得不转向广告和数字公关。而且，这确实有效。\n\
  \n## 权威、链接及其他\n\n尽管存在普遍的误解，认为反向链接就是权威。但我们有大量证据表明，权威是链接和广告共同作用的结果，也就是说，权威并不仅仅通过链接来衡量。请参考图\
  \ 5-1。\n\n![](img/537787_1_En_5_Fig1_HTML.png)\n\n一张散点图估算了平均谷歌排名与每周非搜索支出之间的关系。平均谷歌排名随着非搜索支出的增加而提高。图中绘制了一条回归线，位于平均谷歌排名\
  \ 15 到 20 之间，该线逐渐上升，最终在非搜索支出约为 40000 时达到排名 15。\n\n**图 5-1** 排名与权威之间的正相关关系\n\n图 5-1\
  \ 只是众多展示排名与权威之间正相关关系的例子之一。在这个案例中，权威是非搜索广告的产物。为什么会这样呢？因为优质的链接和有效的广告能够提升品牌印象，而品牌印象本身也与排名呈正相关。\n\
  \n我们接下来要做的是展示数据科学如何帮助你：\n\n*   检查你自己的链接\n*   分析你竞争对手的链接\n*   寻找权力网络\n*   确定优质链接的关键要素\n\
  \n## 检查你自己的链接\n\n如果你曾经想分析自己网站的反向链接，你很可能会使用像 AHREFs 和 SEMRush 这样比较流行的工具。这些服务会遍历网络，获取一份链接到你网站的域名列表，并附带域名评级和其他描述你反向链接质量的信息，它们将这些数据存储在庞大的索引中，以供查询。\n\
  \n反向链接在谷歌算法中扮演着重要角色，这已不是什么秘密。因此，在与竞争对手进行比较之前，至少先了解自己的网站是很有意义的，而前者正是我们今天要做的事情。\n\n\
  虽然大部分分析可以在电子表格中完成，但 Python 具有某些优势。除了能处理海量行数之外，它还能更轻松地查看统计方面的情况，例如数据分布。\n\n### 导入并清理目标链接数据\n\
  \n我们将从英国家具行业挑选一个小型网站（没有特殊原因），并使用 Python 进行一些基础分析。\n\n那么，一个网站的反向链接对 SEO 的价值是什么？简单来说，我认为是质量和数量。质量对于专家来说是主观的，但对于谷歌来说，通过权威性和内容相关性等指标，质量是确定的。\n\
  \n我们将首先利用现有数据评估链接质量，然后再评估数量。开始编码。\n\n```python\nimport re\nimport time\nimport random\n\
  import pandas as pd\nimport numpy as np\nimport datetime\nfrom datetime import timedelta\n\
  from plotnine import *\nimport matplotlib.pyplot as plt\nfrom pandas.api.types import\
  \ is_string_dtype\nfrom pandas.api.types import is_numeric_dtype\nimport uritools\n\
  pd.set_option('display.max_colwidth', None)\n%matplotlib inline\nroot_domain = 'johnsankey.co.uk'\n\
  hostdomain = 'www.johnsankey.co.uk'\nhostname = 'johnsankey'\nfull_domain = 'https://www.johnsankey.co.uk'\n\
  target_name = 'John Sankey'\n```\n\n我们首先导入数据，并清理列名，使其在后续阶段更易于处理和输入。\n\n```python\n\
  target_ahrefs_raw = pd.read_csv(\n'data/johnsankey.co.uk-refdomains-subdomains__2022-03-18_15-15-47.csv')\n\
  ```\n\n列表推导式是一种强大且资源占用较少的方法，用于清理列名。\n\n```python\ntarget_ahrefs_raw.columns = [col.lower()\
  \ for col in target_ahrefs_raw.columns]\n```\n\n这个列表推导式指示 Python 将数据框列中的每个列名（`col`）转换为小写。\n\
  \n```python\ntarget_ahrefs_raw.columns = [col.replace(' ','_') for col in target_ahrefs_raw.columns]\n\
  target_ahrefs_raw.columns = [col.replace('.','_') for col in target_ahrefs_raw.columns]\n\
  target_ahrefs_raw.columns = [col.replace('__','_') for col in target_ahrefs_raw.columns]\n\
  target_ahrefs_raw.columns = [col.replace('(','') for col in target_ahrefs_raw.columns]\n\
  target_ahrefs_raw.columns = [col.replace(')','') for col in target_ahrefs_raw.columns]\n\
  target_ahrefs_raw.columns = [col.replace('%','') for col in target_ahrefs_raw.columns]\n\
  ```\n\n重复上述几行代码的另一种方法是，将函数调用链式连接起来，在一行代码中处理所有列：\n\n```python\ntarget_ahrefs_raw.columns\
  \ = [col.lower().replace(' ','_').replace('.','_').replace('__','_').replace('(','').replace(')','').replace('%','')\
  \ for col in target_ahrefs_raw.columns]\n```\n\n虽然不是严格必需的，但我喜欢有一个标准的计数列用于聚合，以及一个单一的值列\
  \ `project`，以便在需要时对整个表进行分组：\n\n```python\ntarget_ahrefs_raw['rd_count'] = 1\ntarget_ahrefs_raw['project']\
  \ = target_name\nTarget_ahrefs_raw\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figa_HTML.jpg)\n\
  \n一个表格展示了一组域名的详细信息，包括它们的域名评级、可追踪的引用域名、可追踪的链接域名、流量、指向目标的链接、新增链接、丢失链接以及可追踪链接。\n\n\
  现在我们有了一个列名清晰的数据框。下一步是清理实际的表格值，使其对分析更有用。\n\n复制上一个数据框并赋予新名称：\n\n```python\ntarget_ahrefs_clean_dtypes\
  \ = target_ahrefs_raw.copy()\n```\n\n清理 `dofollow_ref_domains` 列，该列告诉我们网站链接拥有的引用域名数量。在这里，我们将把破折号转换为零，然后将整个列转换为整数类型。\n\
  \n从引用域名开始：\n\n```python\ntarget_ahrefs_clean_dtypes['dofollow_ref_domains'] = np.where(target_ahrefs_clean_dtypes['dofollow_ref_domains']\
  \ == '-',\n0, target_ahrefs_clean_dtypes['dofollow_ref_domains'])\ntarget_ahrefs_clean_dtypes['dofollow_ref_domains']\
  \ = target_ahrefs_clean_dtypes['dofollow_ref_domains'].astype(int)\n```\n\n然后是链接域名：\n\
  \n\n\n```python\ntarget_ahrefs_clean_dtypes['dofollow_linked_domains'] = np.where(target_ahrefs_clean_dtypes['dofollow_linked_domains']\
  \ == '-',\n0, target_ahrefs_clean_dtypes['dofollow_linked_domains'])\ntarget_ahrefs_clean_dtypes['dofollow_linked_domains']\
  \ = target_ahrefs_clean_dtypes['dofollow_linked_domains'].astype(int)\n```\n\n“首次发现”告诉我们链接首次被找到的日期（即被发现并添加到\
  \ Ahrefs 索引中的日期）。我们将把字符串转换为 Python 可以处理的日期格式，然后利用它来推导链接的年龄：\n\n```python\ntarget_ahrefs_clean_dtypes['first_seen']\
  \ = pd.to_datetime(target_ahrefs_clean_dtypes['first_seen'], format='%d/%m/%Y %H:%M')\n\
  ```\n\n将 `first_seen` 转换为日期也意味着我们可以按年月进行时间聚合，因为网站的链接并非总是每天都会获取：\n\n```python\ntarget_ahrefs_clean_dtypes['month_year']\
  \ = target_ahrefs_clean_dtypes['first_seen'].dt.to_period('M')\n```\n\n链接年龄的计算方法是：用今天的日期减去首次发现的日期。然后将其转换为数字格式，并除以一个巨大的数字，以得到天数：\n\
  \n```python\ntarget_ahrefs_clean_dtypes['link_age'] = dt.datetime.now() - target_ahrefs_clean_dtypes['first_seen']\n\
  target_ahrefs_clean_dtypes['link_age'] = target_ahrefs_clean_dtypes['link_age']\n\
  target_ahrefs_clean_dtypes['link_age'] = target_ahrefs_clean_dtypes['link_age'].astype(int)\n\
  target_ahrefs_clean_dtypes['link_age'] = (target_ahrefs_clean_dtypes['link_age']/(3600\
  \ * 24 * 1000000000)).round(0)\ntarget_ahrefs_clean_dtypes\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figb_HTML.png)\n\
  \n一个表格展示了 do-follow 链接域名、流量、指向目标的链接、新链接、丢失链接、do-follow 链接、首次发现日期、RD 数量、项目、年月以及链接年龄的详细信息。\n\
  \n数据类型清理完毕，并创建了一些新的数据特征（注意之前添加的列），有趣的部分可以开始了。\n\n## 针对域名权威度\n\n我们分析的第一部分评估链接质量，首先使用\
  \ `describe()` 函数汇总整个数据框，以获取所有列的描述性统计信息：\n\n```python\ntarget_ahrefs_analysis =\
  \ target_ahrefs_clean_dtypes\ntarget_ahrefs_analysis.describe()\n```\n\n结果如下：\n\n\
  ![](img/537787_1_En_5_Figc_HTML.jpg)\n\n一个表格展示了计数、均值、标准差、最小值、最大值，以及 25%、50%、75%\
  \ 分位数的域名评分、do-follow 引用域名、do-follow 链接域名、流量、指向目标的链接、新链接、丢失链接、do-follow 链接、RD 数量和链接年龄的值。\n\
  \n因此，从上表中，我们可以看到平均值（均值）、引用域名的数量（107）以及变异情况（第 25 百分位数等）。\n\n引用域名的平均域名评分（相当于 Moz 的域名权威度）是\
  \ 27。这是好事吗？在缺乏该市场领域竞争对手数据进行比较的情况下，很难判断，这正是你作为 SEO 从业者的经验发挥作用的地方。然而，我确信我们都同意它可以更高——因为它的评分范围在\
  \ 0 到 100 之间。要提高多少才能带来改变则是另一个问题。\n\n上表可能有点枯燥且难以直观理解，因此我们将绘制一个直方图，以便更直观地理解引用域名的权威度：\n\
  \n```python\ndr_dist_plt = (\nggplot(target_ahrefs_analysis,\naes(x = 'dr')) +\n\
  geom_histogram(alpha = 0.6, fill = 'blue', bins = 100) +\nscale_y_continuous() +\n\
  theme(legend_position = 'right'))\ndr_dist_plt\n```\n\n该分布严重偏斜，显示大多数引用域名的权威度评分为零（图\
  \ 5-2）。在零分之外，分布看起来相当均匀，在不同权威度水平上的域名数量大致相等。\n\n![](img/537787_1_En_5_Fig2_HTML.png)\n\
  \n一个条形图展示了不同域名评分的计数。它显示域名评分为 0 时的最大计数约为 30。域名评分高于 75 的数量非常少。\n\n**图 5-2** 反向链接配置文件中域名评分的分布\n\
  \n\n\n### 域名权威度随时间的变化\n\n现在，我们将域名权威度作为链接质量的代理指标，以时间序列的形式进行分析。如果按日期绘制链接数量，时间序列会显得相当杂乱且实用性较低，如下所示：\n\
  \n```\ndr_firstseen_plt = (\nggplot(target_ahrefs_analysis, aes(x = 'first_seen',\
  \ y = 'dr', group = 1)) +\ngeom_line(alpha = 0.6, colour = 'blue', size = 2) +\n\
  labs(y = '域名评级', x = '年月') +\nscale_y_continuous() +\nscale_x_date() +\ntheme(legend_position\
  \ = 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n)\n)\ndr_firstseen_plt.save(filename\
  \ = 'images/1_dr_firstseen_plt.png',\nheight=5, width=10, units = 'in', dpi=1000)\n\
  dr_firstseen_plt\n```\n\n正如你所料，该图看起来非常杂乱，它实际上只展示了某个引用域名的`DR`（域名评级）在特定时间点的数值（图 5-3）。此图表的价值在于，如果你有一个负责获取链接的团队，你可以大致监控链接质量随时间的变化。\n\
  \n![](img/537787_1_En_5_Fig3_HTML.png)\n\n折线图展示了 2016 年 1 月至 2022 年 1 月期间域名评级的波动情况。评级在\
  \ 2017 年至 2018 年以及 2021 年至 2022 年期间达到 75 以上。\n\n**图 5-3** – 随时间获取的反向链接域名评级\n\n为了获得更平滑的视图：\n\
  \n```\ndr_firstseen_smooth_plt = (\nggplot(target_ahrefs_analysis, aes(x = 'first_seen',\
  \ y = 'dr', group = 1)) +\ngeom_smooth(alpha = 0.6, colour = 'blue', size = 3, se\
  \ = False) +\nlabs(y = '域名评级', x = '年月') +\nscale_y_continuous() +\nscale_x_date()\
  \ +\ntheme(legend_position = 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n\
  ))\ndr_firstseen_smooth_plt.save(filename = 'images/1_dr_firstseen_smooth_plt.png',\n\
  height=5, width=10, units = 'in', dpi=1000)\ndr_firstseen_smooth_plt\n```\n\n使用`geom_smooth()`可以得到一个噪声较少的视图，并展示域名评级随时间的变化情况，从而体现质量的稳定性（图\
  \ 5-4）。同样，这也与所获取链接的质量相关。\n\n![](img/537787_1_En_5_Fig4_HTML.png)\n\n面积图展示了 2016\
  \ 年 1 月至 2022 年 1 月期间域名评级的变化趋势。它表明域名评级最初达到最大值，随后逐年逐渐下降。\n\n**图 5-4** – 随时间获取的反向链接域名评级（平滑处理）\n\
  \n这并不能完全描述网站整体权威度随时间的变化，因为所获取链接的价值会随时间累积保留；因此，需要采用不同的数学方法。\n\n为了查看网站权威度随时间的变化，我们将按月计算域名评级的滚动平均值。请注意`expanding()`函数的使用，它指示\
  \ Pandas 在每一新行中包含所有之前的行：\n\n```\ntarget_rd_cummean_df = target_ahrefs_analysis\n\
  target_rd_mean_df = target_rd_cummean_df.groupby(['month_year'])['dr'].sum().reset_index()\n\
  target_rd_mean_df['dr_runavg'] = target_rd_mean_df['dr'].expanding().mean()\ntarget_rd_mean_df.head(10)\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_5_Figd_HTML.jpg)\n\n表格展示了 2015 年至 2018 年期间 9\
  \ 个实例的域名评级及域名评级滚动平均值的详细信息。\n\n现在我们有了一个表格，可以用来生成图表并进行可视化。\n\n```\ndr_cummean_smooth_plt\
  \ = (\nggplot(target_rd_mean_df, aes(x = 'month_year', y = 'dr_runavg', group =\
  \ 1)) +\ngeom_line(alpha = 0.6, colour = 'blue', size = 2) +\n#labs(y = 'GA 会话数',\
  \ x = '日期') +\nscale_y_continuous() +\nscale_x_date() +\ntheme(legend_position =\
  \ 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n))\ndr_cummean_smooth_plt\n\
  ```\n\n因此，目标网站最初拥有高权威度的链接（可能是宣布商业品牌的公关活动），但随后四年内权威度逐渐下降，之后通过获取新的高权威度链接再次回升（图 5-5）。\n\
  \n![](img/537787_1_En_5_Fig5_HTML.png)\n\n折线图展示了 2016 年 1 月至 2022 年 1 月期间域名评级累积平均值的变化趋势。它表明在\
  \ 2021 年 1 月之后评级急剧上升。\n\n**图 5-5** – 反向链接的累积平均域名评级随时间的变化\n\n最重要的是，我们可以看到网站整体权威度随时间的变化，这或许也是像谷歌这样的搜索引擎看待它的方式。\n\
  \n对此分析的一个很好的扩展是重新生成数据框，以便我们能够绘制基于累积的随时间分布图。这样我们不仅能观察到中位数质量，还能看到随时间的变化情况。\n\n以上就是关于链接质量的分析，那么链接数量呢？\n\
  \n\n\n### 定位链接数量\n\n质量是一回事；高质量链接的数量则完全是另一回事，这正是我们接下来要分析的。\n\n我们将像之前的操作一样，使用扩展函数来计算截至当前所获链接的累计总和：\n\
  \n```\ntarget_count_cumsum_df = target_ahrefs_analysis\nprint(target_count_cumsum_df.columns)\n\
  target_count_cumsum_df = target_count_cumsum_df.groupby(['month_year'])['rd_count'].sum().reset_index()\n\
  target_count_cumsum_df['count_runsum'] = target_count_cumsum_df['rd_count'].expanding().sum()\n\
  target_count_cumsum_df['link_velocity'] = target_count_cumsum_df['rd_count'].diff()\n\
  target_count_cumsum_df\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Fige_HTML.jpg)\n\n\
  该表格展示了 2015 年至 2018 年期间，10 个实例的引荐域名数量、累计总和以及链接速度值的详细信息。\n\n以上是数据，接下来是图表。\n\n```\n\
  target_count_plt = (\nggplot(target_count_cumsum_df, aes(x = 'month_year', y = 'rd_count',\
  \ group = 1)) +\ngeom_line(alpha = 0.6, colour = 'blue', size = 2) +\nlabs(y = 'Count\
  \ of Referring Domains', x = 'Month Year') +\nscale_y_continuous() +\nscale_x_date()\
  \ +\ntheme(legend_position = 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n\
  ))\ntarget_count_plt.save(filename = 'images/3_target_count_plt.png',\nheight=5,\
  \ width=10, units = 'in', dpi=1000)\ntarget_count_plt\n```\n\n这是引荐域名数量的非累计视图。同样，这对于评估团队获取链接的效率非常有用（图\
  \ 5-6）。\n\n![](img/537787_1_En_5_Fig6_HTML.png)\n\n折线图展示了 2016 年 1 月至 2022 年 1 月期间引荐域名的数量。它显示出自\
  \ 2021 年 1 月后，数量呈上升趋势，并伴有多个波峰和波谷。\n\n**图 5-6** 引荐域名数量随时间变化\n\n但或许这对于搜索引擎如何看待一个网站拥有的引荐域名总数来说，用处不大。\n\
  \n```\ntarget_count_cumsum_plt = (\nggplot(target_count_cumsum_df, aes(x = 'month_year',\
  \ y = 'count_runsum', group = 1)) +\ngeom_line(alpha = 0.6, colour = 'blue', size\
  \ = 2) +\nscale_y_continuous() +\nscale_x_date() +\ntheme(legend_position = 'right',\n\
  axis_text_x=element_text(rotation=90, hjust=1)\n))\ntarget_count_cumsum_plt\n```\n\
  \n累计视图向我们展示了引荐域名的总数（图 5-7）。当然，这并非完全准确的图景，因为一些引荐域名可能已经丢失，但足以让我们了解网站的大致状况。\n\n![](img/537787_1_En_5_Fig7_HTML.png)\n\
  \n折线图展示了 2016 年 1 月至 2022 年 1 月期间引荐域名累计总和的趋势。它显示出自始至终的逐步增长。\n\n**图 5-7** 引荐域名累计总和随时间变化\n\
  \n我们看到，从 2017 年开始的接下来四年里，链接稳步增加，然后在 2021 年 3 月左右再次加速。这与我们之前看到的域名评分随时间变化的趋势一致。\n\n\
  一个有用的扩展，用于将其与性能关联起来，可能是加入以下因素：\n\n-   引荐域名网站流量\n-   随时间变化的平均排名\n\n## 分析竞争对手的链接\n\
  \n和上次一样，我们将一个网站的反向链接对 SEO 的价值定义为质量和数量的乘积——质量指域名权威（或 AHREFs 的等效域名评分），数量指引荐域名的数量。\n\
  \n同样，我们将先利用现有数据评估链接质量，然后再评估数量。开始编码。\n\n```\nimport re\nimport time\nimport random\n\
  import pandas as pd\nimport numpy as np\nimport datetime\nfrom datetime import timedelta\n\
  from plotnine import *\nimport matplotlib.pyplot as plt\nfrom pandas.api.types import\
  \ is_string_dtype\nfrom pandas.api.types import is_numeric_dtype\nimport uritools\n\
  pd.set_option('display.max_colwidth', None)\n%matplotlib inline\nroot_domain = 'johnsankey.co.uk'\n\
  hostdomain = 'www.johnsankey.co.uk'\nhostname = 'johnsankey'\nfull_domain = 'https://www.johnsankey.co.uk'\n\
  target_name = 'John Sankey'\n```\n\n### 数据导入与清洗\n\n我们设置好文件目录，以便能够读取一个文件夹中的多个 AHREFs\
  \ 导出数据文件。这比逐个读取每个文件要快得多、枯燥少得多且效率更高，尤其是当你有超过十个文件时：\n\n```\nahrefs_path = 'data/'\n\
  ```\n\n来自 OS 模块的`listdir()`函数允许我们列出子目录中的所有文件：\n\n```\nahrefs_filenames = os.listdir(ahrefs_path)\n\
  ahrefs_filenames\n```\n\n结果如下：\n\n```\n['www.davidsonlondon.com--refdomains-subdomain__2022-03-13_23-37-29.csv',\n\
  'www.stephenclasper.co.uk--refdomains-subdoma__2022-03-13_23-47-28.csv',\n'www.touchedinteriors.co.uk--refdomains-subdo__2022-03-13_23-42-05.csv',\n\
  'www.lushinteriors.co--refdomains-subdomains__2022-03-13_23-44-34.csv',\n'www.kassavello.com--refdomains-subdomains__2022-03-13_23-43-19.csv',\n\
  'www.tulipinterior.co.uk--refdomains-subdomai__2022-03-13_23-41-04.csv',\n'www.tgosling.com--refdomains-subdomains__2022-03-13_23-38-44.csv',\n\
  'www.onlybespoke.com--refdomains-subdomains__2022-03-13_23-45-28.csv',\n'www.williamgarvey.co.uk--refdomains-subdomai__2022-03-13_23-43-45.csv',\n\
  'www.hadleyrose.co.uk--refdomains-subdomains__2022-03-13_23-39-31.csv',\n'www.davidlinley.com--refdomains-subdomains__2022-03-13_23-40-25.csv',\n\
  'johnsankey.co.uk-refdomains-subdomains__2022-03-18_15-15-47.csv']\n```\n\n列出文件后，我们现在使用`for`循环逐个读取它们，并将它们添加到一个数据框中。在读取文件时，我们将使用一些字符串操作来创建一个新列，其中包含我们正在导入的数据的站点名称：\n\
  \n```\nahrefs_df_lst = list()\nahrefs_colnames = list()\nfor filename in ahrefs_filenames:\n\
  df = pd.read_csv(ahrefs_path + filename)\ndf['site'] = filename\ndf['site'] = df['site'].str.replace('www.',\
  \ '', regex = False)\ndf['site'] = df['site'].str.replace('.csv', '', regex = False)\n\
  df['site'] = df['site'].str.replace('-.+', '', regex = True)\nahrefs_colnames.append(df.columns)\n\
  ahrefs_df_lst.append(df)\ncomp_ahrefs_df_raw = pd.concat(ahrefs_df_lst)\ncomp_ahrefs_df_raw\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_5_Figf_HTML.jpg)\n\n该表格展示了一组域名的详细信息，包括它们的域名评分、dofollow\
  \ 引荐域名、dofollow 链接域名、流量、指向目标的链接、新链接、丢失链接、dofollow 链接、首次发现日期以及站点名称。\n\n现在我们已经将每个站点的原始数据整合到一个数据框中，下一步是整理列名，使其更易于使用。可以使用自定义函数，但我们只需使用列表推导式来链式调用函数：\n\
  \n```\ncompetitor_ahrefs_cleancols = comp_ahrefs_df_raw.copy()\ncompetitor_ahrefs_cleancols.columns\
  \ = [col.lower().replace(' ','_').replace('.','_').replace('__','_').replace('(','')\n\
  .replace(')','').replace('%','')\nfor col in competitor_ahrefs_cleancols.columns]\n\
  ```\n\n拥有一个计数列和一个单值列（`project`）对于`groupby`和聚合操作非常有用：\n\n```\ncompetitor_ahrefs_cleancols['rd_count']\
  \ = 1\ncompetitor_ahrefs_cleancols['project'] = target_name\ncompetitor_ahrefs_cleancols\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_5_Figg_HTML.jpg)\n\n该表格展示了一组域名的详细信息，包括它们的域名评分、dofollow\
  \ 引荐域名、dofollow 链接域名、流量、指向目标的链接、新链接、丢失链接和 dofollow 链接。\n\n列现在已清理干净，接下来我们将清理行数据：\n\
  \n```\ncompetitor_ahrefs_clean_dtypes = competitor_ahrefs_cleancols\n```\n\n对于引荐域名，我们将连字符替换为零，并将数据类型设置为整数（即整数）。对于链接域名，也将重复此操作：\n\
  \n\n\n```python\ncompetitor_ahrefs_clean_dtypes['dofollow_ref_domains'] = np.where(competitor_ahrefs_clean_dtypes['dofollow_ref_domains']\
  \ == '-',\n0, competitor_ahrefs_clean_dtypes['dofollow_ref_domains'])\ncompetitor_ahrefs_clean_dtypes['dofollow_ref_domains']\
  \ = competitor_ahrefs_clean_dtypes['dofollow_ref_domains'].astype(int)\n# linked_domains\n\
  competitor_ahrefs_clean_dtypes['dofollow_linked_domains'] = np.where(competitor_ahrefs_clean_dtypes['dofollow_linked_domains']\
  \ == '-',\n0, competitor_ahrefs_clean_dtypes['dofollow_linked_domains'])\ncompetitor_ahrefs_clean_dtypes['dofollow_linked_domains']\
  \ = competitor_ahrefs_clean_dtypes['dofollow_linked_domains'].astype(int)\n```\n\
  \n`First seen` 为我们提供了一个发现链接的时间点，我们可以用它来进行时间序列绘图和推导链接年龄。我们将使用 `to_datetime` 函数将其转换为日期格式：\n\
  \n```python\ncompetitor_ahrefs_clean_dtypes['first_seen'] = pd.to_datetime(competitor_ahrefs_clean_dtypes['first_seen'],\n\
  format='%d/%m/%Y %H:%M')\ncompetitor_ahrefs_clean_dtypes['first_seen'] = competitor_ahrefs_clean_dtypes['first_seen'].dt.normalize()\n\
  competitor_ahrefs_clean_dtypes['month_year'] = competitor_ahrefs_clean_dtypes['first_seen'].dt.to_period('M')\n\
  ```\n\n要计算 `link_age`，我们只需从今天的日期中减去 `first seen` 日期，并将差值转换为数字：\n\n```python\ncompetitor_ahrefs_clean_dtypes['link_age']\
  \ = dt.datetime.now() - competitor_ahrefs_clean_dtypes['first_seen']\ncompetitor_ahrefs_clean_dtypes['link_age']\
  \ = competitor_ahrefs_clean_dtypes['link_age']\ncompetitor_ahrefs_clean_dtypes['link_age']\
  \ = competitor_ahrefs_clean_dtypes['link_age'].astype(int)\ncompetitor_ahrefs_clean_dtypes['link_age']\
  \ = (competitor_ahrefs_clean_dtypes['link_age']/(3600 * 24 * 1000000000)).round(0)\n\
  ```\n\n`target` 列帮助我们区分“客户”网站和竞争对手，这对于后续的可视化很有用：\n\n```python\ncompetitor_ahrefs_clean_dtypes['target']\
  \ = np.where(competitor_ahrefs_clean_dtypes['site'].str.contains('johns'),\n1, 0)\n\
  competitor_ahrefs_clean_dtypes['target'] = competitor_ahrefs_clean_dtypes['target'].astype('category')\n\
  competitor_ahrefs_clean_dtypes\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figh_HTML.jpg)\n\
  \n一个表格展示了流量、目标链接、新链接、丢失链接、dofollow 链接、首次发现日期、丢失次数、网站名称、RD 数量、项目名称、年月、链接年龄和目标的详细信息。\n\
  \n现在，数据在列标题和行值方面都已清理干净，我们准备开始进行分析。\n\n## 优质链接的剖析\n\n当我们之前分析一个目标网站（“John Sankey”）时，我们（和全球\
  \ SEO 行业的其他人一样）假设域名评级（`DR`）是衡量链接质量的最佳、最可靠的指标。\n\n但我们应该这样认为吗？让我们做一个快速粗略的分析，看看情况是否确实如此，或者我们是否能找到更好的指标。我们将从在网站层面聚合链接特征开始：\n\
  \n```python\ncompetitor_ahrefs_aggs = competitor_ahrefs_analysis.groupby('site').agg({'link_age':\
  \ 'mean',\n'dofollow_links': 'mean',    'domain': 'count', 'dr': 'mean', 'dofollow_ref_domains':\
  \ 'mean',  'traffic_': 'mean', 'dofollow_linked_domains': 'mean',    'links_to_target':\
  \ 'mean',  'new_links': 'mean',     'lost_links': 'mean'}).reset_index()\ncompetitor_ahrefs_aggs\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_5_Figi_HTML.jpg)\n\n一个表格展示了 11 个网站的详细信息，包括它们的链接年龄、dofollow\
  \ 链接、域名评级、dofollow 引用域、dofollow 链接域、流量、目标链接和新链接。\n\n生成的表格向我们展示了每个链接特征的聚合统计数据。接下来，读取\
  \ SEMRush 域名级别数据的列表（由于只有 11 个网站，这些数据是通过手动数据录入逐字输入的）：\n\n```python\nsemrush_viz =\
  \ [10100, 2300, 931, 2400, 911, 2100, 1800, 136, 838, 428, 1100, 1700]\ncompetitor_ahrefs_aggs['semrush_viz']\
  \ = semrush_viz\ncompetitor_ahrefs_aggs\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figj_HTML.jpg)\n\
  \n一个表格展示了链接年龄、dofollow 链接、域名评级、dofollow 引用域、流量、dofollow 链接域、目标链接、新链接、丢失链接和 SEMRush\
  \ 可见度的详细信息。\n\nSEMRush 可见度数据现已附加，因此我们可以准备计算 R 平方（即决定系数），它将告诉我们哪个链接特征最能解释 SEMRush\
  \ 可见度的变化：\n\n```python\ncompetitor_ahrefs_r2 = competitor_ahrefs_aggs.corr() **\
  \ 2\ncompetitor_ahrefs_r2 = competitor_ahrefs_r2[['semrush_viz']].reset_index()\n\
  competitor_ahrefs_r2 = competitor_ahrefs_r2.sort_values('semrush_viz', ascending\
  \ = False)\ncompetitor_ahrefs_r2\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figk_HTML.jpg)\n\
  \n一个表格展示了 11 个索引的详细信息及其 SEMRush 可见度。它根据 SEMRush 可见度数据按降序显示数值。\n\n自然，我们期望 `semrush_viz`\
  \ 与自身完美相关。令人惊讶的是，`DR`（域名评级）并不能很好地解释 SEMRush 的差异，其 R 平方仅为 21%。\n\n另一方面，`traffic_`（即引用域的流量值）相关性更好。仅凭这一点，我们就准备忽略\
  \ `dr`。让我们通过可视化来检查这一点：\n\n```python\ncomp_correl_trafficviz_plt = (\nggplot(competitor_ahrefs_aggs,\n\
  aes(x = 'traffic_', y = 'semrush_viz')) +\ngeom_point(alpha = 0.4, colour = 'blue',\
  \ size = 2) +\ngeom_smooth(method = 'lm', se = False, colour = 'red', size = 3,\
  \ alpha = 0.4)\n)\ncomp_correl_trafficviz_plt.save(filename = 'images/2_comp_correl_trafficviz_plt.png',\n\
  height=5, width=10, units = 'in', dpi=1000)\ncomp_correl_trafficviz_plt\n```\n\n\
  这并不十分令人信服（图 5-8），因为缺少超过 2,000,000 的引用域。这是否意味着我们应该放弃使用 `traffic_` 作为衡量标准？\n\n![](img/537787_1_En_5_Fig8_HTML.png)\n\
  \n一个带有 SEMRush 可见度与流量回归线的散点图，显示了该线的上升趋势。它表明，当流量计数超过 600 万时，SEMRush 可见度数据达到约 10000。\n\
  \n**图 5-8** SEMRush 可见度（`semrush_viz`）与网站反向链接的 AHREFs 总流量（`traffic_`）的散点图\n\n不一定。可见度为\
  \ 10,000 的异常数据点不一定是错误的。该网站在现实世界中确实具有卓越的可见度和更多的引荐流量，因此这并不意味着该网站的数据应该被移除。\n\n如果有的话，应该收集更多来自同一领域更多域名的数据。或者，采用更彻底的处理方法将涉及获取页面级别的\
  \ SEMRush 可见度数据，并将其与页面级别的链接特征指标相关联。\n\n展望未来，我们将使用 `traffic_` 作为我们的质量衡量标准。\n\n\n\n\
  ### 链接质量\n\n我们从链接质量开始，我们最近发现，应该用 `traffic_` 来衡量链接质量，而非行业公认的标准。\n\n首先，我们使用 `describe()`\
  \ 函数来检查每个链接特征的分布属性：\n\n```\ncompetitor_ahrefs_analysis = competitor_ahrefs_clean_dtypes\n\
  competitor_ahrefs_analysis[['traffic_']].describe()\n```\n\n生成的表格显示了一些基本统计量，包括均值、标准差（`std`）以及四分位数指标（第\
  \ 25、50 和 75 百分位数），这能让您很好地了解大多数引荐域名的流量分布情况。\n\n![](img/537787_1_En_5_Figl_HTML.jpg)\n\
  \n该表格展示了流量值的计数、标准差、最小值、25%、50%、75% 和最大值。\n\n因此，毫不意外的是，如果我们看中位数，那么大多数竞争对手的引荐域名的流量（估计值）为零。只有处于第\
  \ 75 百分位数或以上的域名才有流量。\n\n我们还可以使用 `geom_boxplot` 函数绘制（并通过可视化确认）它们的分布，以便并排比较各个网站：\n\
  \n```\ncomp_dr_dist_box_plt = (\nggplot(competitor_ahrefs_analysis, #.loc[competitor_ahrefs_analysis['dr']\
  \ > 0],\naes(x = 'reorder(site, traffic_)', y = 'traffic_', colour = 'target'))\
  \ +\ngeom_boxplot(alpha = 0.6) +\nscale_y_log10() +\ntheme(legend_position = 'none',\n\
  axis_text_x=element_text(rotation=90, hjust=1)\n))\ncomp_dr_dist_box_plt.save(filename\
  \ = 'images/4_comp_traffic_dist_box_plt.png',\nheight=5, width=10, units = 'in',\
  \ dpi=1000)\ncomp_dr_dist_box_plt\n```\n\n`comp_dr_dist_box_plt` 并排比较了各网站引荐域名的流量分布（图\
  \ 5-9），其中最值得注意的是四分位距（IQR）。竞争对手用红色表示，客户用蓝色表示。\n\n![](img/537787_1_En_5_Fig9_HTML.png)\n\
  \n箱线图展示了 12 个域名的流量计数。其中，域名 William garvey dot co dot u k 的上四分位数接近流量值 1e5，而域名 David\
  \ Linley dot com 的上须线则跨越了流量值 1e8。\n\n**图 5-9** 每个网站的反向链接流量（`traffic_`）箱线图\n\n四分位距是指数据在第\
  \ 25 百分位数和第 75 百分位数之间的范围。其目的在于告诉我们：\n\n-   大部分数据位于何处\n-   有多少数据偏离中位数（中心点）\n\n在这个案例中，IQR\
  \ 量化了每个网站引荐域名获得的流量及其变异性。\n\n我们还可以看到，“John Sankey”的引荐域名流量中位数排名第三，这在链接质量方面与竞争对手相比表现不错。箱体的大小（其\
  \ IQR）并非最长（围绕其中位数相当一致），但也不像 Stephen Clasper 那样短（更一致，中位数更高，并且来自高于中位数的引荐域名的反向链接更多）。\n\
  \n与其他域名相比，“Touched Interiors”的 DR 范围最为多样化，这可能表明其在链接获取方面的标准略微宽松。或者，是否因为随着品牌在网络上知名度和可见度的提高，该品牌自然地从零流量的引荐域名中吸引了更多链接？也许两者兼而有之。\n\
  \n接下来，我们绘制每个竞争对手的域名质量随时间变化的图表：\n\n```\ncomp_traf_timeseries_plt = (\nggplot(competitor_ahrefs_analysis,\n\
  aes(x = 'first_seen', y = 'traffic_',\ngroup = 'site', colour = 'site')) +\ngeom_smooth(alpha\
  \ = 0.4, size = 2, se = False,\nmethod='loess'\n) +\nscale_x_date() +\ntheme(legend_position\
  \ = 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n)\n)\ncomp_traf_timeseries_plt.save(filename\
  \ = 'images/4_comp_traffic_timeseries_plt.png',\nheight=5, width=10, units = 'in',\
  \ dpi=1000)\ncomp_traf_timeseries_plt\n```\n\n我们特意避免使用 `scale_y_log10()`，因为它会使用对数刻度转换垂直轴。为什么？因为那样看起来会非常杂乱，难以识别出任何突出的竞争对手。\n\
  \n图 5-10 展示了随时间推移获取的链接质量，其中表现突出的网站是 David Linley、T Gosling 和 John Sankey。\n\n![](img/537787_1_En_5_Fig10_HTML.jpg)\n\
  \n时间序列图展示了 2014 年 1 月至 2022 年 1 月期间 12 个网站的流量计数。其中，网站 David Linley dot com 的流量最高。\n\
  \n**图 5-10** 时间序列图，展示了每个网站各引荐域名随时间变化的流量\n\n其余网站在链接获取表现方面基本持平。David Linley 起步很高，随后链接质量急剧下降，直到\
  \ 2020 年和 2021 年才再次提升。\n\n现在，我们对不同网站的表现有了一些概念，我们真正想要的是按 `month_year` 计算的累积链接质量，因为这很可能符合搜索引擎评估网站权威性的累加方式。\n\
  \n我们将使用我们信赖的 `groupby()` 和 `expanding().mean()` 函数来计算我们想要的累积统计量：\n\n```\ncompetitor_traffic_cummean_df\
  \ = competitor_ahrefs_analysis.copy()\ncompetitor_traffic_cummean_df = competitor_traffic_cummean_df.groupby(['site',\
  \ 'month_year'])['traffic_'].sum().reset_index()\ncompetitor_traffic_cummean_df['traffic_runavg']\
  \ = competitor_traffic_cummean_df['traffic_'].expanding().mean()\ncompetitor_traffic_cummean_df\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_5_Figm_HTML.jpg)\n\n表格展示了流量和流量运行平均值的详细信息。顶部显示了网站\
  \ David Linley dot com 在 2013 年至 2014 年间的 5 个实例。底部显示了网站 William garvey dot co dot\
  \ u k 在 2021 年至 2022 年间的 5 个实例。\n\n科学计数法格式的数字用处不大，表格本身也是如此，但至少数据框已准备好为以下图表提供数据：\n\
  \n```\ncompetitor_traffic_cummean_plt = (\nggplot(competitor_traffic_cummean_df,\
  \ aes(x = 'month_year', y = 'traffic_runavg', group = 'site', colour = 'site'))\
  \ +\ngeom_line(alpha = 0.6, size = 2) +\nlabs(y = 'Cumu Avg of traffic_', x = 'Month\
  \ Year') +\nscale_y_continuous() +\nscale_x_date() +\ntheme(legend_position = 'right',\n\
  axis_text_x=element_text(rotation=90, hjust=1)\n))\ncompetitor_traffic_cummean_plt.save(filename\
  \ = 'images/4_competitor_traffic_cummean_plt.png',\nheight=5, width=10, units =\
  \ 'in', dpi=1000)\ncompetitor_traffic_cummean_plt\n```\n\n代码对网站进行了颜色编码，以便更容易区分各个网站。\n\
  \n因此，正如我们所料，David Linley 的链接获取团队表现出色，因为随着时间的推移，他们的权威性在所有竞争对手中取得了突飞猛进的增长（图 5-11）。\n\
  \n![](img/537787_1_En_5_Fig11_HTML.jpg)\n\n时间序列图展示了 2014 年 1 月至 2022 年 1 月期间 12\
  \ 个网站的平均流量计数。其中，网站 Davids on London dot com 初始流量最高，而 David Linley dot com 在 2022\
  \ 年左右流量更高。\n\n**图 5-11** 每个网站累积平均反向链接流量的时间序列图\n\n所有其他竞争对手基本都趋于平稳。这反映在 David Linley\
  \ 卓越的 SEMRush 可见度上（图 5-12）。\n\n![](img/537787_1_En_5_Fig12_HTML.jpg)\n\n柱状图展示了 12\
  \ 个网站的 SEMRush 可见度。其中，网站 David Linley dot com 的可见度最高，约为 10000。\n\n**图 5-12** 柱状图，展示了每个网站的\
  \ SEMRush 可见度\n\n我们能学到什么？在我们有限的数据研究中，到目前为止，我们可以看到“稳扎稳打”并不能赢得胜利。相反，网站需要大力争取来自高流量网站的链接。\n\
  \n\n\n### 链接数量\n\n以上分析了质量；那么来自引用域名的链接数量又如何呢？\n\n我们的方法是使用 `groupby()` 函数计算引用域名的累积总和：\n\
  \n```\ncompetitor_count_cumsum_df = competitor_ahrefs_analysis\ncompetitor_count_cumsum_df\
  \ = competitor_count_cumsum_df.groupby(['site', 'month_year'])['rd_count'].sum().reset_index()\n\
  ```\n\n`expanding()` 函数允许计算窗口随行数增长，这正是我们实现累积总和的方式：\n\n```\ncompetitor_count_cumsum_df['count_runsum']\
  \ = competitor_count_cumsum_df['rd_count'].expanding().sum()\ncompetitor_count_cumsum_df\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_5_Fign_HTML.jpg)\n\n该表格展示了两个网站（各 5 个实例）的引用域名数量、累计总和计数以及链接速度的详细信息。表格上半部分显示了\
  \ David Linley dot com 在 2013 年至 2014 年间的详细信息。下半部分显示了 William garvey dot co dot\
  \ u k 在 2021 年至 2022 年间的详细信息。\n\n结果是一个包含 `site`、`month_year` 和 `count_runsum`（累计总和）的数据框，其格式非常适合输入图表——我们现在将按如下方式运行：\n\
  \n```\ncompetitor_count_cumsum_plt = (\nggplot(competitor_count_cumsum_df, aes(x\
  \ = 'month_year', y = 'count_runsum',\ngroup = 'site', colour = 'site')) +\ngeom_line(alpha\
  \ = 0.6, size = 2) +\nlabs(y = '引用域名累计总和', x = '年月') +\nscale_y_continuous() +\n\
  scale_x_date() +\ntheme(legend_position = 'right',\naxis_text_x=element_text(rotation=90,\
  \ hjust=1)\n))\ncompetitor_count_cumsum_plt.save(filename = 'images/5_count_cumsum_smooth_plt.png',\n\
  height=5, width=10, units = 'in', dpi=1000)\ncompetitor_count_cumsum_plt\n```\n\n\
  `competitor_count_cumsum_plt` 图（图 5-13）显示了自 2014 年以来每个网站的引用域名数量。非常有趣的是，每个网站开始获取链接时的起始位置各不相同。\n\
  \n![](img/537787_1_En_5_Fig13_HTML.jpg)\n\n该时间序列图展示了 12 个网站在 2014 年 1 月至 2022 年\
  \ 1 月期间引用域名的累计总和。它表明 David Linley dot com 网站多年来一直拥有最高值。\n\n**图 5-13** 每个网站引用域名累计总和的时间序列图\n\
  \n例如，William Garvey 起步时就有超过 5000 个域名。我很想知道他们的数字公关团队是谁。\n\n我们还可以看到增长速度，例如，尽管 Hadley\
  \ Rose 在 2018 年才开始获取链接，但真正起飞是在 2021 年中左右。\n\n### 链接速度\n\n让我们来看看链接速度：\n\n```\ncompetitor_velocity_cumsum_plt\
  \ = (\nggplot(competitor_count_cumsum_df, aes(x = 'month_year', y = 'link_velocity',\n\
  group = 'site', colour = 'site')) +\ngeom_line(alpha = 0.6, size = 2) +\nlabs(y\
  \ = '引用域名累计总和', x = '年月') +\nscale_y_log10() +\nscale_x_date() +\ntheme(legend_position\
  \ = 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n))\ncompetitor_velocity_cumsum_plt.save(filename\
  \ = 'images/5_competitor_velocity_cumsum_plt.png',\nheight=5, width=10, units =\
  \ 'in', dpi=1000)\ncompetitor_velocity_cumsum_plt\n```\n\n该视图显示了各网站获取链接的相对速度（图 5-14）。这是一个不常见但很有用的视图，因为对于任何给定的月份，你可以通过线条的高度看出哪个网站获取的链接最多。\n\
  \n![](img/537787_1_En_5_Fig14_HTML.jpg)\n\n该时间序列图展示了 12 个网站在 2014 年 1 月至 2022 年\
  \ 1 月期间的链接速度。2018 年之后，各网站的链接速度均有所提升。\n\n**图 5-14** 显示每个网站链接速度的时间序列图\n\n多年来，David\
  \ Linley 一直在这场竞赛中领先，直到 Hadley Rose 出现。\n\n### 链接资本\n\n如同生活中衡量的大多数事物一样，最终价值由速率和数量的乘积决定。因此，我们将应用相同的原则来确定网站权威性的整体价值，并将其称为“链接资本”。\n\
  \n我们首先合并链接数量和平均流量（作为权威性的衡量标准）的累计平均统计数据：\n\n```\ncompetitor_capital_cumu_df = competitor_count_cumsum_df.merge(competitor_traffic_cummean_df,\n\
  on = ['site', 'month_year'], how = 'left'\n)\ncompetitor_capital_cumu_df['auth_cap']\
  \ = (competitor_capital_cumu_df['count_runsum'] * competitor_capital_cumu_df['traffic_runavg']).round(1)*0.001\n\
  competitor_capital_cumu_df['auth_velocity'] = competitor_capital_cumu_df['auth_cap'].diff()\n\
  competitor_capital_cumu_df\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figo_HTML.jpg)\n\
  \n该表格展示了网站名称、年月、引用域名数量、累计总和、链接速度、流量、流量运行平均值、权威资本和权威速度的详细信息。\n\n合并后的表格生成了新列 `auth_cap`（衡量整体权威性）和\
  \ `auth_velocity`（权威性增加的速度）。\n\n让我们在图 5-15 中看看竞争对手在总权威性方面随时间的变化情况。\n\n![](img/537787_1_En_5_Fig15_HTML.jpg)\n\
  \n该时间序列图展示了 12 个网站在 2014 年 1 月至 2022 年 1 月期间的权威资本。它表明 John Sankey dot co dot u k\
  \ 网站拥有最高值。\n\n**图 5-15** 各网站权威资本随时间变化的时间序列图\n\n该图显示了几个网站随时间变化的链接资本。非常有趣的是，Hadley\
  \ Rose 如何凭借第三高且最稳定的高流量反向链接网站，在不到一年的时间内迅速增加数量，从而成为最具权威性的网站。这使得他们在同一时间段内超越了所有竞争对手（基于数量同时保持质量）。\n\
  \n那么权威性增加的速度又如何呢？接下来，我们将绘制每个网站权威速度随时间变化的图表：\n\n```\ncompetitor_capital_veloc_plt\
  \ = (\nggplot(competitor_capital_cumu_df, aes(x = 'month_year', y = 'auth_velocity',\n\
  group = 'site', colour = 'site')) +\ngeom_line(alpha = 0.6, size = 2) +\nlabs(y\
  \ = '权威资本', x = '年月') +\nscale_y_continuous() +\nscale_x_date() +\ntheme(legend_position\
  \ = 'right',\naxis_text_x=element_text(rotation=90, hjust=1)\n))\ncompetitor_capital_veloc_plt.save(filename\
  \ = 'images/6_auth_veloc_smooth_plt.png',\nheight=5, width=10, units = 'in', dpi=1000)\n\
  competitor_capital_veloc_plt\n```\n\n唯一突出的只有 David Linley 和 Hadley Rose（图 5-16）。David\
  \ Linley 是否应该保持其链接获取计划的质量和速度？\n\n![](img/537787_1_En_5_Fig16_HTML.jpg)\n\n该折线图展示了\
  \ 12 个网站在 2014 年 1 月至 2022 年 1 月期间的权威资本。它表明 David Linley dot com 网站在 2022 年出现了一个急剧的峰值。\n\
  \n**图 5-16** 各网站链接资本速度随时间变化图\n\n我们毫不怀疑，在其他条件相同的情况下，它将迎头赶上甚至超越 Hadley Rose。\n\n\n\
  \n## 寻找权力网络\n\n在 SEO 术语中，权力网络是指一组指向目标关键词排名靠前网站的网站群。因此，从这些网站获取反向链接到你的网站，将提升你的权威性，从而提高网站的排名潜力。\n\
  \n这有效吗？根据我们的经验，答案是肯定的。\n\n在进入代码之前，我们先讨论一下理论。1996 年，网络搜索质量尚处于起步阶段，高度依赖于页面上的关键词。\n\
  \n为此，计算机科学家乔恩·克莱因伯格发明了超链接诱导主题搜索（HITS）算法，该算法后来成为 Ask 搜索引擎的核心算法。\n\n正如他在论文《[超链接环境中的权威来源](http://www.cs.cornell.edu/home/kleinber/auth.pdf)》（1999\
  \ 年）中所描述的，其核心思想是一种链接分析算法，用于评估网页的权威值和中心值。权威值衡量页面的内容价值，而中心值则衡量其指向其他页面的链接价值。\n\n从数据驱动的\
  \ SEO 角度来看，我们不仅对获取这些链接感兴趣，还希望以数据驱动的方式找出这些中心网站是什么。\n\n为了实现这一目标，我们将对引荐域名及其流量水平进行分组，以计算网站数量：\n\
  \n```\npower_doms_strata = competitor_ahrefs_analysis.groupby(['domain', 'traffic_']).agg({'rd_count':\
  \ 'count'})\npower_doms_strata = power_doms_strata.reset_index().sort_values('traffic_',\
  \ ascending = False)\n```\n\n一个引荐域名只有在链接到超过两个域名时，才能被视为中心域名或权力域名，因此我们将过滤掉不符合条件的域名。为什么是三个或更多？因为一个可能是偶然，两个是巧合，三个才是有意为之。\n\
  \n```\npower_doms_strata = power_doms_strata.loc[power_doms_strata['rd_count'] >\
  \ 2]\npower_doms_strata\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figp_HTML.jpg)\n\n\
  一个表格显示了 10 个域名的域名名称、流量和引荐域名数量的详细信息。底部文字显示：156 行，3 列。\n\n该表格展示了引荐域名、它们的流量，以及这些提供反向链接的域名所链接到的（我们家具类）网站数量。\n\
  \n由于我们以数据为驱动，不满足于一个列表，因此我们将使用统计方法来帮助理解权力分布，然后再进一步过滤列表：\n\n```\npd.set_option('display.float_format',\
  \ str)\npower_doms_stats = power_doms_strata.describe()\npower_doms_stats\n```\n\
  \n结果如下：\n\n![](img/537787_1_En_5_Figq_HTML.jpg)\n\n一个表格展示了流量和引荐域名数量的统计信息，包括计数、均值、标准差、最小值、25%、50%、75%和最大值。\n\
  \n我们看到分布严重正偏态，大多数高流量的引荐域名位于第 75 百分位或更高。这些正是我们想要的。让我们进行可视化：\n\n```\npower_doms_stats_plt\
  \ = (\nggplot(power_doms_strata, aes(x = 'traffic_')) +\ngeom_histogram(alpha =\
  \ 0.6, binwidth = 10) +\nlabs(y = '权力域名数量', x = 'traffic_') +\nscale_y_continuous()\
  \ +\ntheme(legend_position = 'right',\naxis_text_x=element_text(rotation = 90, hjust=1)\n\
  ))\npower_doms_stats_plt.save(filename = 'images/7_power_doms_stats_plt.png',\n\
  height=5, width=10, units = 'in', dpi=1000)\npower_doms_stats_plt\n```\n\n如前所述，分布严重偏斜，这在直方图中更为明显。最后，我们将过滤出最强大的域名列表：\n\
  \n```\npower_doms = power_doms_strata.loc[power_doms_strata['traffic_'] > power_doms_stats['traffic_'][-2]]\n\
  ```\n\n尽管我们对中心网站感兴趣，但我们还是按流量对数据框进行排序，因为这些网站拥有最高的权威性：\n\n```\npower_doms = power_doms.sort_values('traffic_',\
  \ ascending = False)\npower_doms\n```\n\n结果如下：\n\n![](img/537787_1_En_5_Figr_HTML.jpg)\n\
  \n一个表格显示了 21 个域名的流量和引荐域名数量的详细信息。\n\n到目前为止，最强大的是《每日邮报》，因此在这种情况下，开始为聘请一位优秀的数字公关顾问或全职员工做预算。还有其他出版商网站，如《旗帜晚报》（`standard.co.uk`）和《泰晤士报》。\n\
  \n有些链接更容易、更快获得，例如`yell.com`和 Thomson 本地目录。\n\n然后还有更多针对特定市场的出版商，例如《理想家居》、《家居与花园》、《Livingetc》和《住宅与花园》。\n\
  \n这可能是你的首选切入点。\n\n这项分析可以通过多种方式进一步改进，例如：\n\n* 更细化地寻找权力页面（为你的竞争对手提供动力的单个反向链接 URL）\n\
  * 检查反向链接页面（或首页）的相关性，看它是否影响可见性，并据此过滤相关性\n* 将相关性与流量结合，为中心网站过滤生成综合评分\n\n## 更进一步\n\n\
  当然，前面的讨论只是冰山一角，因为它只是对一个网站的简单探索，因此很难推断出任何有助于在竞争激烈的搜索空间中提升排名的有用信息。\n\n以下是进一步数据探索和分析的一些领域：\n\
  \n* 将社交媒体分享数据添加到目标 URL、引荐域名和引荐页面\n* 将整体网站可见性与引荐域名的滚动平均流量随时间变化进行关联\n* 绘制引荐域名流量随时间变化的分布图\n\
  * 在主机名上添加搜索量数据，以查看引荐域名获得的品牌搜索次数，作为权威性的替代衡量指标\n* 将爬取数据与目标 URL 关联，以测试：\n  * 内容相关性\n\
  \  * 通过确认 HTTP 响应（即 200）来判断页面是否可被索引\n\n当然，上述想法并非详尽无遗。一些建模扩展需要应用第 6 章中概述的机器学习技术。\n\
  \n## 总结\n\n反向链接，作为搜索引擎衡量网站权威性的表现，对任何网站的搜索结果排名都具有难以置信的影响力。在本章中，你学习了：\n\n* 什么是网站权威性以及它如何影响\
  \ SEO\n* 品牌搜索如何影响搜索可见性\n* 单一网站分析\n* 竞争对手权威性分析\n  * *链接剖析*：`R²`如何显示引荐域名流量比域名评级更能预测可见性\n\
  \  * 分析多个网站如何为权威性洞察增加丰富性和背景信息\n* 在单一和多个网站分析中\n  * 权威性 – 分布及随时间变化\n  * 链接数量和速度\n\n\
  在下一章中，我们将使用数据科学来分析关键词搜索结果中的竞争对手。\n\n"
- "# 6. 竞争对手\n\n哪个有自尊的 SEO 不做竞争对手分析来找出自己遗漏了什么？早在 2007 年，Andreas 回忆说，他使用电子表格收集 SERP\
  \ 数据，列代表竞争的各个方面，例如指向首页的链接数量、页面数量、字数等。事后看来，这个想法是对的，但由于 Excel 难以在短时间内进行统计上稳健的分析，执行起来几乎无望——而你现在将很快学会使用机器学习来完成这项工作。\n\
  \n## 还有算法恢复！\n\n这些应用不仅对一般的竞争对手 SEO 分析有用，对于从谷歌更新中恢复也很有用，尤其是当你没有更新前的 SERP 数据副本来对比之前有效的方法和现在有效的方法时。\n\
  \n如果你确实拥有更新前的 SERP 数据，那么你只需对更新前的 SERP 重复分析，并将分析结果与更新后的 SERP 进行比较即可。\n\n\n\n## 定义问题\n\
  \n在急于行动之前，我们先来思考一下挑战。面对超过 10,000 个排名因素，既没有足够的时间，也没有足够的预算来学习和优化所有高优先级的 SEO 项目。\n\n\
  我们建议通过排除干扰，并利用机器学习分析竞争对手数据，来发现那些能对你的 SEO 活动产生决定性影响的排名因素，从而找到：\n\n-   哪些排名因素最能解释网站间排名的差异\n\
  -   获胜的基准是什么\n-   该因素每变化一个单位，对排名的影响价值有多大\n\n### 结果指标\n\n需要明确的是，结果变量应为在谷歌搜索引擎中的排名。只要你能从可靠的排名检测工具中获取数据，这种方法也适用于任何其他搜索引擎（例如必应、Yandex、百度等）。\n\
  \n#### 为什么选择排名？\n\n因为与用户会话不同，排名不会随天气、一年中的时间等因素而变化——查询时效性除外。它可能是最干净的指标。无论如何，排名代表了排名\
  \ URL 的内容最能满足搜索查询的顺序——想想看，这正是 RankBrain 的核心。因此，实际上，我们正在研究如何针对任何由 RankBrain 驱动的谷歌更新进行优化。\n\
  \n从数据角度来看，排名位置必须是一种浮点数值数据类型，在 Python 中称为`float`（在 R 中称为`double`）。\n\n### 特征\n\n\
  既然我们已经确定了结果指标，现在必须确定自变量，也就是模型输入，也称为特征。特征的数据类型会有所不同，例如：\n\n-   `first_paint_ms` 将是数值型。\n\
  -   `flesch_kincaid_reading_ease` 将是字符型。\n\n自然地，为了进行最全面的竞争对手研究，你希望涵盖尽可能多有意义的特征，包括技术、内容/用户体验和站外因素。\n\
  \n## 数据策略\n\n现在我们知道了结果和特征，该做什么呢？鉴于排名是数值型的，并且我们想要解释排名之间的差异，这是一个连续变量（即，排名从第一到第二，再到第三，等等），那么此处的竞争对手分析就是一个回归问题。用数学术语表示就是：\n\
  \n```\nrank ~ w_1*feature_1 + w_2*feature_2 + … + w_n*feature_n\n```\n\n`~` 表示“由……解释”。\
  \  \n`n` 是第 n 个特征。  \n`w` 是该特征的权重。\n\n需要明确的是，这并不总是一个线性回归练习。线性回归假设所有特征都以线性方式表现——数据点都将沿着一条直线拟合。虽然对于某些特征（如页面加载速度）在大多数情况下可能如此，但对于其他特征则不然。\n\
  \n例如，许多排名因素在某些行业表现出非线性特征。例如，标题标签的字符数通常是非线性的，存在一个最佳点。\n\n如图 6-1 所示，我们可以看到最佳拟合线呈 n\
  \ 形，表明当标题中网站名称字符占比接近 28%时，排名会上升，而网站偏离该标题标签品牌占比的获胜基准越远，排名则越低。\n\n![](img/537787_1_En_6_Fig1_HTML.jpg)\n\
  \n一张散点图，带有谷歌排名与标题品牌占比的最佳拟合线。最大散点位于 0.25，10 处，纵轴标记为 0、40、30、20 和 10。该线绘制了一条正弦曲线。\n\
  \n**图 6-1** 标题标签品牌化（占总字符数的比例）与平均谷歌排名位置的散点图\n\n关于收集哪些特征，搜索引擎是对 URL 进行排名，而不是域名，因此我们将重点关注前者。这将为你节省数据收集的成本和时间，以及整合实际数据的工作。然而，缺点是你将无法包含全域名特征，例如排名\
  \ URL 与首页的距离。\n\n为此，我们将使用一种基于决策树的算法，称为`随机森林`。还有其他算法，如决策树，以及更好的算法如 AdaBoost 和 XGBoost。数据科学家通常会试验多种模型，然后根据模型稳定性和预测准确性选择最佳的一个。\n\
  \n然而，我们的目的是让你入门；这些模型可能会产生相似的结果，因此我们为你节省时间，同时最重要的是，为你提供分析 SERP 竞争对手以进行 SEO 的机器学习技术背后的直觉。\n\
  \n## 数据来源\n\n虽然我们无法获知谷歌的内部数据（除非你为谷歌工作），但我们严重依赖第三方工具来提供数据。这些工具是第三方而非第一方的原因是，研究中所有网站的数据必须具有可比性——除非你极不可能拥有竞争对手的数据。没有？那我们继续。\n\
  \n你的数据来源将取决于你希望测试哪些类型的特征来对 SERP 竞争对手进行建模。\n\n**排名：** 这将来自你的排名检测工具，而非 Google Search\
  \ Console。所以，这些工具包括 getSTAT、SEO Monitor、Rank Ranger 或 DataForSEO SERPs API。还有其他工具，但我们没有或没有直接测试其\
  \ API 的经验，因此无法提及。为什么是这三个？因为它们都允许你导出研究中包含的每个关键词的前 100 个 URL。这一点很重要，因为从一开始我们就不想假设你的\
  \ SERP 竞争对手是谁。我们只想提取数据并对其进行探究。\n\n对于特征：\n\n**站内：** 要测试站内因素是否能解释你的关键词集的排名差异，可以使用标题标签长度、页面速度、字数、阅读易读性等特征，以及你的排名检测工具能告诉你的关于\
  \ URL 的任何信息。你也可以推导出自己的特征，例如通过计算标题标签与目标关键词之间的字符串距离来得出标题相关性。请放心，我们稍后会向你展示如何操作。\n\n\
  对于竞争不那么激烈的行业和小型数据集（每个网站少于 250,000 个 URL），像 Screaming Frog 或 Sitebulb 这样的工具就足够了。对于大型数据集和竞争激烈的行业，你的竞争对手很可能会屏蔽桌面版网站审计工具，因此你将不得不求助于企业级工具，这些工具从云端爬取并拥有\
  \ API。根据我们的个人经验，我们发现 Botify 不仅两者兼备，而且运行良好，因为大多数企业品牌都在使用它，所以在爬取时不会被屏蔽！\n\n**站外：**\
  \ 要测试站外因素的影响，请选择一个拥有良好 API 的可靠来源。根据我们的经验，AHREFs 和 BuzzSumo 效果很好，能提供诸如域名评级、各平台社交分享次数以及反向链接\
  \ URL 上的内部链接数量等指标。两者都有 API，允许你将站外数据的收集自动化到你的 R 工作空间中。\n\n\n\n## 探索、清洗与转换\n\n拿到数据后，数据科学实践要求你探索数据，以便：\n\
  \n- **理解分布**：数据是否存在偏态或多峰（即分布中有多个峰值）？\n- **检查数据质量**：是否存在过多的缺失值？是否存在单水平因子？\n- **发现可用于衍生新特征的信息**\n\
  \n其核心思想是通过剔除无信息或无用的特征和行，来提升输入模型的数据质量。探索数据还能帮助你理解模型在解释搜索查询空间中的排名因素时的局限性。\n\n在合并到\
  \ SERP 数据之前，我们先进行探索。\n\n总结整体流程如下：\n\n1. 导入数据——包括排名数据和特征数据\n2. 聚焦竞争对手\n3. 合并数据\n\
  4. 衍生新特征\n5. 处理单水平因子（SLF）\n6. 数据重缩放\n7. 处理近零方差（NZV）\n8. 中位数填充\n9. 独热编码（OHE）\n10.\
  \ 剔除缺失值\n11. 对 SERP 进行建模\n12. 评估 SERP 机器学习模型\n13. 排名的最强预测驱动因素\n14. 每个排名因素的价值\n15.\
  \ 排名因素的优胜基准\n\n当然，内容很多，我们会逐一简要说明，并在机器学习能揭示的关于竞争对手的更有趣秘密上深入展开。\n\n### 导入数据——包括 SERP\
  \ 数据和特征数据\n\n可以通过从相关 SEO 工具导入 CSV 下载文件来完成，或者为了更自动化的体验，使用工具提供商的 API 将数据导入数据框（Python\
  \ 中的电子表格版本）。以下是一些导入 CSV 数据的入门代码：\n\n对于正则表达式（regex），尽管字符串方法默认包含正则表达式功能：\n\n```python\n\
  import re\nimport time\nimport random\nimport pandas as pd\nimport numpy as np\n\
  import datetime\nimport re\nimport time\nimport requests\nimport json\nfrom datetime\
  \ import timedelta\n```\n\n用于导入多个文件：\n\n```python\nfrom glob import glob\nimport\
  \ os\n```\n\n用于计算两个文本字符串之间重叠部分的字符串方法：\n\n```python\nfrom textdistance import sorensen_dice\n\
  ```\n\n用于提取 URL 的各个部分：\n\n```python\nimport uritools\nfrom tldextract import extract\n\
  ```\n\n用于数据可视化：\n\n```python\nfrom plotnine import *\nimport matplotlib.pyplot as\
  \ plt\npd.set_option('display.max_colwidth', None)\n%matplotlib inline\n```\n\n\
  一些变量在开始时初始化，这样当你将脚本复用于其他客户或网站时，只需覆盖以下变量值：\n\n```python\nroot_url = 'https://www.johnsankey.co.uk'\n\
  target_site = 'www.johnsankey.co.uk'\nroot_domain = 'johnsankey.co.uk'\nhostname\
  \ = 'johnsankey'\ntarget_name = 'sankey'\ngeo_market = 'uk'\n```\n\n用于数据子集划分或过滤的社交网站列表：\n\
  \n```python\nsocial_sites = ['facebook.com', 'instagram.com', 'linkedin.com', 'twitter.com',\
  \ 'pinterest.com', 'tiktok.com', 'foursquare.com', 'reddit.com']\n```\n\n### 从关键词入手\n\
  \n与 SEO 中几乎所有事情一样，要始终以终为始。这通常意味着要明确你希望网站排名的目标关键词，以及它们对应的 SERP 数据，我们将把这些数据加载到 Pandas\
  \ 数据框中：\n\n```python\nserps_raw = pd.read_csv('data/keywords_serps.csv')\n```\n\n\
  为了让数据框更易于处理，我们将使用列表推导式将列名转换为小写，并将标点符号和空格替换为下划线：\n\n```python\nserps_raw.columns\
  \ = [x.lower().replace(' ', '_').replace(',', '_').replace('__', '_') for x in serps_raw.columns]\n\
  ```\n\n`rank_absolute`列被替换为更简洁、更熟悉的`rank`：\n\n```python\nserps_raw = serps_raw.rename(columns\
  \ = {'rank_absolute': 'rank'})\nserps_raw\n```\n\n结果如下：\n\n![](img/537787_1_En_6_Figa_HTML.jpg)\n\
  \n一个包含 25735 行和 6 列的表。列标题为`keyword`、`rank`、`url`、`location code`、`language code`、`se\
  \ results count`，行中填充了所有关键词数据。\n\n`serps_raw`数据框包含超过 25000 行 SERP 数据，共 6 列，覆盖所有关键词：\n\
  \n```python\nserps_df = serps_raw.copy()\n```\n\n将 URL 列设置为字符串类型，以便于数据操作：\n\n```python\n\
  serps_df['url'] = serps_df['url'].astype(str)\n```\n\n第一个操作是提取`site`列的域名。`site`列将应用`uritools`\
  \ API 函数去除路径部分，然后使用列表推导式将 URL 拆分为其组成部分的列表：\n\n```python\nserps_df['site'] = [uritools.urisplit(x).authority\
  \ if uritools.isuri(x) else x for x in serps_df['url']]\n```\n\n拆分后，我们将提取列表中的内容，取最后三个组成部分：\n\
  \n```python\nserps_df['site'] = ['.'.join(s.split('.')[-3:]) for s in serps_df['site']]\n\
  ```\n\n接下来，我们希望将排名分层，以便获得排名类别。虽然在本练习中可能不会用到，但这是处理 SERP 数据时的标准做法。\n\n```python\n\
  serps_df['rank_profile'] = np.where(serps_df['rank'] < 11, 'page_1', 'page_2')\n\
  serps_df['rank_profile'] = np.where(serps_df['rank'] < 3, 'top_3',\nserps_df['rank_profile'])\n\
  ```\n\n为了避免`search_volumes`为零的情况，我们将使用`np.where()`将其设置为 1，以防止除零错误：\n\n```python\n\
  serps_df['se_results_count'] = np.where(serps_df['se_results_count'] == 0, 1, serps_df['se_results_count'])\n\
  ```\n\n我们将设置一个`count`列，以便更快速地进行聚合：\n\n```python\nserps_df['count'] = 1\n```\n\n\
  我们还会计算搜索字符串中的关键词数量，在数据科学领域称为词元：\n\n```python\nserps_df['token_count'] = serps_df['keyword'].str.count('\
  \ ') + 1\n```\n\n然后，根据词元长度将这些关键词分为头部、中部和尾部：\n\n```python\nbefore_length_conds =\
  \ [\nserps_df['token_count'] == 1,\nserps_df['token_count'] == 2,\nserps_df['token_count']\
  \ > 2]\nlength_vals = ['head', 'middle', 'long']\nserps_df['token_size'] = np.select(before_length_conds,\
  \ length_vals)\nserps_df\n```\n\n结果如下：\n\n![](img/537787_1_En_6_Figb_HTML.jpg)\n\
  \n一个包含 25735 行和 12 列的表。列标题为`keyword`、`rank`、`url`、`location code`、`language code`、`se\
  \ results count`和`site`，行中按关键词分类填充了数据。\n\n\n\n## 聚焦竞争对手\n\nSERP 数据能有效告诉我们，在排名作为结果指标的情况下，谷歌奖励了哪些内容。然而，这些数据中很多可能包含噪声，并且其中一些列很可能包含能够解释内容间排名差异的排名因素。\n\
  \n内容之所以存在噪声，是因为 SERP 中可能包含来自某些网站（如评论和参考类网站）的内容，商业网站很难从中学习。最终，在进行这项分析时，SEO 主要关注的是在考虑其他网站之前，如何超越竞争对手的网站。\n\
  \n因此，你需要筛选出竞争对手，以使你的研究更有意义。例如，如果你的客户或品牌处于网络研讨会技术领域，那么将`Wikipedia.com`或`Amazon.com`纳入数据集就没有意义，因为它们并不直接与你的品牌竞争。\n\
  \n你真正需要的是近乎直接或直接的竞争对手，即“撞脸”网站，这样你才能比较它们做了或没做什么，从而使其排名比你高或低。\n\n这种方法的缺点在于，通过剔除非竞争对手，你无法全面了解谷歌希望从\
  \ SERP 中获得什么。这是因为 SERP 需要作为一个整体来分析，这在第 10 章中有所涉及。然而，本章是关于竞争对手分析的，所以我们继续往下进行。\n\n\
  为了找到竞争对手，我们需要进行一些聚合操作，首先从计算“触达量”（即排名在前 10 位的内容数量）开始：\n\n```\nmajor_players_reach\
  \ = serps_df.loc[serps_df['rank'] < 10]\n```\n\n将 SERP 过滤或限制在前 10 名后，我们将按网站聚合前 10\
  \ 名的总数，使用`groupby`按网站分组并求和`count`列：\n\n```\nmajor_players_reach = major_players_reach.groupby('site').agg({'count':\
  \ sum}).reset_index()\n```\n\n然后，我们将按触达量的降序对网站进行排序：\n\n```\nmajor_players_reach\
  \ = major_players_reach.sort_values('count', ascending = False)\n```\n\n触达量指标通过提供数量，基本能说明问题，但我们还需要通过计算中位数来获取排名。这将有助于对触达量水平相当的网站进行排序。\n\
  \n```\nmajor_players_rank = serps_df.groupby('site').agg({'rank': 'median'}).reset_index()\n\
  major_players_rank = major_players_rank.sort_values('rank')\n```\n\n按搜索引擎结果数量进行聚合，有助于衡量关键词的整体竞争度，该指标通过平均值进行聚合。这些数据由\
  \ DataForSEO 的 SERP API 独家提供。不过，你也可以轻松地用其他 SERP 跟踪工具（如 SEO Monitor）提供的更常见的搜索量指标来替代。\n\
  \n```\nmajor_players_searches = serps_df.groupby('site').agg({'se_results_count':\
  \ 'mean'}).reset_index()\nmajor_players_searches = major_players_searches.sort_values('se_results_count')\n\
  ```\n\n排名和搜索结果聚合数据通过`merge()`函数连接到触达数据上，形成一张表。这相当于以`site`列作为合并依据进行`vlookup`操作：\n\
  \n```\nmajor_players_stats = major_players_reach.merge(major_players_rank, on =\
  \ 'site', how = 'left')\nmajor_players_stats = major_players_stats.merge(major_players_searches,\
  \ on = 'site', how = 'left')\n```\n\n利用所有数据，我们将计算一个整体可见性指标，该指标将触达量的平方除以排名。对触达量进行平方是为了避免那些只有少数前\
  \ 10 名但排名非常高的网站出现在列表顶部。\n\n排名作为除数，是因为排名数字越小越好；因此，除以一个较小的数字会提高网站的可见性值，前提是其排名更高：\n\
  \n```\nmajor_players_stats['visibility'] = ((major_players_stats['reach'] ** 2)\
  \ / major_players_stats['rank']).round()\n```\n\n排除社交媒体网站，以聚焦于商业竞争对手：\n\n```\nmajor_players_stats\
  \ = major_players_stats.loc[~major_players_stats['site'].str.contains('|'.join(social_sites))]\n\
  ```\n\n将`count`重命名为`reach`：\n\n```\nmajor_players_stats = major_players_stats.rename(columns\
  \ = {'count': 'reach'})\n```\n\n移除包含`nan`值的网站：\n\n```\nmajor_players_stats = major_players_stats.loc[major_players_stats['site']\
  \ != 'nan']\nmajor_players_stats.head(10)\n```\n\n结果如下：\n\n![](img/537787_1_En_6_Figc_HTML.jpg)\n\
  \n一个包含 11 行 5 列的表格，列标题为网站、触达量、排名、搜索结果数量和可见性。网站`furniturevillage.co.uk`的数据显示为：触达量\
  \ 60，排名 12，可见性等于 60 乘以 60 再除以 12，即 300。\n\n该数据框显示了预计会主导 SERP 的前 20 个特色网站。其中一些排名靠前的网站并非直接竞争对手（可能无法爬取！），因此这些网站将被移除，因为我们希望从最直接的竞争对手那里学习，了解他们最高效的\
  \ SEO 策略。\n\n因此，我们将选择最直接的竞争对手，并将其存储在一个列表`player_sites_lst`中：\n\n```\nplayer_sites_lst\
  \ = ['sofology.co.uk', 'www.designersofas4u.co.uk', 'www.heals.com', 'darlingsofchelsea.co.uk',\
  \ 'www.made.com', 'www.sofasandstuff.com', 'www.arloandjacob.com', 'loaf.com', 'www.made.com',\
  \ 'theenglishsofacompany.co.uk', 'willowandhall.co.uk', root_domain]\n```\n\n该列表将用于过滤\
