  \ team`、`overview`、`virtual events` 和 `partner program`。\n\n**图 3-17** 最常用锚点文本的词云\n\
  \n从这一点出发，接下来的行动是寻找半自动化的规则来提高锚点文本的相关性，由于这些锚点位于页眉或页脚中，这一任务会相对容易一些。\n\n## 核心网页指标 (CWV)\n\
  \n核心网页指标 (CWV) 是 Google 的一项倡议，旨在帮助网站提供更好的用户体验。这包括速度、加载期间的页面稳定性，以及网页变得可供用户交互所需的时间。那么，如果\
  \ CWV 是关于用户的，为什么它会被放在技术部分呢？\n\n那些较少被宣传的技术性 SEO 优势，有助于 Google（以及其他搜索引擎）主要节省计算资源来抓取和渲染网站。因此，这对于搜索引擎、用户和网站管理员来说是一个巨大的三赢局面。\n\
  \n所以，通过追求 CWV，你实际上是在增加你的抓取和渲染预算，这有利于你的技术性 SEO。\n\n然而，技术性 SEO 对营销团队的吸引力不大，而如果你能暗示排名提升的好处来证明改进\
  \ CWV 的网站开发工作是合理的，那么向营销团队推销起来就容易得多。这正是我们在本节中要努力实现的目标。\n\n我们将从整体概况开始，展示整体的竞争格局，然后再深入分析网站本身，以便利用数据来确定开发的优先级。\n\
  \n\n\n#### 景观\n\n```python\nimport re\nimport time\nimport random\nimport pandas\
