  \n![](img/537787_1_En_9_Fig11_HTML.png)\n\n一张水平条形图展示了会话数与可用恢复点击量的关系。估算值如下：修复并移除指向错误\
  \ URL 的链接，12.5；创建整合，70；无需进一步操作，299。\n\n**图 9-11** 按技术 SEO 诊断结果估算的可用恢复点击量条形图\n\n\
  ## 总结\n\n本章涵盖了网站迁移映射的内容，以便你能够设定新网站的结构，并半自动化地生成迁移 URL。使用的一些技术如下：\n\n*   字符串操作\n*\
  \   通过将数据框行转换为列表来对其进行迭代\n*   使用 NLP 比较 URL 字符串\n\n虽然这些技术被应用于加速网站迁移的数据处理，但它们也可以轻松应用于其他场景。在下一章中，我们将展示如何利用数据更好地理解算法更新。\n\
  \n# 10. Google 更新\n\n正如死亡和税收是人生的必然，算法更新也是任何 SEO 职业生涯中的必然。没错，Google 会频繁更改其排名算法，这意味着你的网站（以及许多其他网站）可能会在排名上出现波动，进而影响流量。这些变化可能是积极的，也可能是消极的，在某些情况下，你甚至察觉不到任何影响。\n\
  \n\n\n## 算法更新分析\n\n为了进一步说明问题，Google 本身对于算法更新的内容以及企业和 SEO 专业人士应如何应对，给出的信息相当模糊。自然，除了提供“出色的用户体验”和“创建引人入胜的内容”之外，Google\
  \ 缺乏指导性建议，这意味着 SEO 必须使用各种分析工具来寻找答案。幸运的是，对于 SEO 来说：\n\n-   Google 是一个算法系统。这意味着排名因素的变化很可能是一致且可预测的，而不是由人为因素随意决定的。这些变化很可能事先经过了测试。\n\
  -   Google 算法变化的结果通过搜索引擎结果页面（SERPs）进入公共领域，这意味着有数据可供分析，即使这违反了 Google 网站管理员指南。\n-\
  \   即使没有 SERPs，Google Search Console 也是了解 Google 更新性质的重要数据源。\n\n在本章中，我们将介绍算法更新分析，即在算法更新事件前后，在不同层面分析搜索结果的差异：\n\
  \n-   域名\n-   结果类型\n-   关键词自相残杀\n-   关键词\n-   客户跟踪查询（目标）内\n-   分段的 SERPs\n\n###\
  \ 算法更新\n\n这里的一般方法是比较 Google 算法更新前后阶段的性能。在本例中，我们将重点关注一家新上市的 webinar 公司 `ON24`。`ON24`\
  \ 受到了 2019 年 12 月核心更新的影响。\n\n通过一些分析和可视化，我们可以了解更新的情况。除了常用的库，我们还将从 `getSTAT`（一个企业级排名跟踪平台，网址为\
  \ `getstat.com`）导入 SERPs 数据：\n\n```python\nimport re\nimport time\nimport random\n\
  import pandas as pd\nimport numpy as np\nimport datetime\nimport re\nimport time\n\
  import requests\nimport json\nfrom datetime import timedelta\nfrom glob import glob\n\
  import os\nfrom textdistance import sorensen_dice\nfrom plotnine import *\nimport\
  \ matplotlib.pyplot as plt\nfrom pandas.api.types import is_string_dtype\nfrom pandas.api.types\
  \ import is_numeric_dtype\nimport uritools\npd.set_option('display.max_colwidth',\
  \ None)\n%matplotlib inline\nroot_domain = 'on24.com'\nhostdomain = 'www.on24.com'\n\
  hostname = 'on24'\nfull_domain = 'https://www.on24.com'\ntarget_name = 'ON24'\n\
  getstat_raw.head()\n```\n\n以下是 `getSTAT` 数据的打印输出：\n\n![](img/537787_1_En_10_Figa_HTML.jpg)\n\
  \n一个表格列出了 13 列和 5 行。行编号为 0-4，对应 6 sense webinars。列包括关键词、市场、位置、设备、全球月搜索量、区域月搜索量、排名、2020\
  \ 年 11 月 19 日的结果类型、2020 年 11 月 19 日的协议、2020 年 11 月 19 日的排名 URL、2020 年 12 月 17 日的结果类型、2020\
  \ 年 12 月 17 日的协议以及 2020 年 12 月 17 日的排名 URL。\n\n为了使列名更便于数据处理，我们将进行一些清理：\n\n```python\n\
  getstat_cleancols = getstat_raw\n```\n\n转换为小写：\n\n```python\ngetstat_cleancols.columns\
  \ = [x.lower() for x in getstat_cleancols.columns]\n```\n\n鉴于 `ON24` 是一个全球品牌，并使用单一网站来捕获全球所有英语搜索，我们使用全球月搜索量而不是通常的区域（国家级别）数字。因此，我们将全局搜索量重命名为搜索量：\n\
  \n```python\ngetstat_cleancols = getstat_cleancols.rename(columns = {'global monthly\
  \ search volume': 'search_volume'})\n```\n\n我们过滤掉品牌搜索的行，因为我们期望 `ON24` 在其自有品牌上排名良好，而我们更关注一般的核心更新：\n\
  \n```python\ngetstat_cleancols = getstat_cleancols[~getstat_cleancols['keyword'].str.contains('24')]\n\
  getstat_cleancols\n```\n\n现在列名已变为小写，并且一些列已重命名：\n\n![](img/537787_1_En_10_Figb_HTML.jpg)\n\
  \n一个表格列出了 10 列和 27560 行，这里只展示了其中的 10 行。行编号从 0 到 4，对应 6 sense webinars 和 zoom webinars，编号从\
  \ 27635 到 27639。列标题是关键词、市场、位置、设备、搜索量、区域月搜索量、排名、2020 年 11 月 19 日的结果类型、2020 年 11 月\
  \ 19 日的协议以及 2020 年 11 月 19 日的排名 URL。\n\n为了简化计算，我们将数据框按列拆分为“之前”和“之后”。拆分后的数据将被聚合，然后相互比较。\n\
  \n我们从“之前”数据框开始，选择“之前”的列：\n\n```python\ngetstat_before = getstat_cleancols[['keyword',\
  \ 'market', 'location', 'device', 'search_volume', 'rank',\n'result types for nov\
  \ 19, 2020', 'protocol for nov 19, 2020',\n'ranking url on nov 19, 2020']]\n```\n\
  \n我们构建完整的 URL：\n\n```python\ngetstat_before['url'] = getstat_before['protocol for\
  \ nov 19, 2020'] + '://' + getstat_before['ranking url on nov 19, 2020']\n```\n\n\
  更改 URL 列的值，如果存在任何空白（空值），则将其替换为 `''` 而不是 `NaN`（非数字）。这有助于避免稍后聚合时出现错误。\n\n```python\n\
  getstat_before['url'] = np.where(getstat_before['url'].isnull(), '', getstat_before['url'])\n\
  ```\n\n我们将使用 `urisplit` 函数（嵌入在列表推导式中）来提取域名，从而派生站点名称。这对于在站点级别汇总性能非常有用。\n\n```python\n\
  getstat_before['site'] = [uritools.urisplit(x).authority if uritools.isuri(x) else\
  \ x for x in getstat_before['url']]\n```\n\n我们初始化一个名为 `strip_subdomains` 的列表，以帮助剥离\
  \ URL 的字符串组件：\n\n```python\nstrip_subdomains = ['hub\\.', 'blog\\.', 'www\\.', 'impact\\\
  .', 'harvard\\.', 'its\\.', 'is\\.', 'support\\.']\n```\n\n我们更改 `site` 字段，将 `site`\
  \ 列中找到的任何 `strip_subdomains` 字符串替换为空：\n\n```python\ngetstat_before['site'] = getstat_before['site'].str.replace('|'.join(strip_subdomains),\
  \ '')\n```\n\n我们设置一个新列 `phase` 为 `\"before\"`：\n\n```python\ngetstat_before['phase']\
  \ = 'before'\n```\n\n对排名位置数据进行分层有助于我们执行更详细的聚合，以便将性能分解为 Google 的前 3 名、第 1 页等。这使用了\
  \ `np.where`，它是 Excel 中 `if` 函数的 Python 等价物：\n\n```python\ngetstat_before['rank_profile']\
  \ = np.where(getstat_before['rank'] < 11, 'page_1', 'page_2')\ngetstat_before['rank_profile']\
  \ = np.where(getstat_before['rank'] < 3, 'top_3',\ngetstat_before['rank_profile'])\n\
  ```\n\n在这里，我们将重命名一些列，因为我们不需要列标题中的月份年份：\n\n```python\ngetstat_before = getstat_before.rename(columns\
  \ = {'result types for nov 19, 2020': 'snippets'})\n```\n\n列选择并非绝对必要，但它确实有助于清理数据框并提醒我们正在处理的内容：\n\
  \n```python\ngetstat_before = getstat_before[['keyword', 'market', 'phase', 'device',\
  \ 'search_volume', 'rank',\n'url', 'site', 'snippets', 'rank_profile']]\n```\n\n\
  我们将零搜索量设置为 1，以便稍后在推导计算时不会出现“除以零错误”：\n\n```python\ngetstat_before['search_volume']\
  \ = np.where(getstat_before['search_volume'] == 0, 1, getstat_before['search_volume'])\n\
  ```\n\n初始化一个新列 `count`，这在聚合时也很有用：\n\n```python\ngetstat_before['count'] = 1\n```\n\
  \n有时，您需要按头部、中部和长尾来剖析 SERPs。为了实现这一点，我们将初始化一个名为 `token_count` 的列，该列计算单词之间的空格数（并加 1），以提取\
  \ `keyword` 列中的查询词数：\n\n```python\ngetstat_before['token_count'] = getstat_before['keyword'].str.count('\
  \ ') + 1\n```\n\n得益于词数统计，我们使用 `np.select()` 函数对查询长度进行分类。\n\n\n```python\nbefore_length_conds\
  \ = [\ngetstat_before['token_count'] == 1,\ngetstat_before['token_count'] == 2,\n\
  getstat_before['token_count'] > 2]\nlength_vals = ['head', 'middle', 'long']\ngetstat_before['token_size']\
  \ = np.select(before_length_conds, length_vals)\ngetstat_before\n```\n\n以下是添加了额外特征后的“之前”数据集，以便分析更具实用性。\n\
  \n![](img/537787_1_En_10_Figc_HTML.jpg)\n\n一个表格展示了包含 9 列 10 行的列表。列标题如下：`search volume`、`rank`、`URL`、`site`、`snippets`、`rank\
  \ profile`、`count`、`token count`和`token size`。各行包含关键词的详细信息。\n\n让我们对“之后”数据集重复数据转换步骤：\n\
  \n```python\ngetstat_after = getstat_cleancols[['keyword', 'market', 'location',\
  \ 'device', 'search_volume', 'rank',\n'result types for dec 17, 2020', 'protocol\
  \ for dec 17, 2020',\n'ranking url on dec 17, 2020']]\ngetstat_after['url'] = getstat_after['protocol\
  \ for dec 17, 2020'] + '://' + getstat_after['ranking url on dec 17, 2020']\ngetstat_after['url']\
