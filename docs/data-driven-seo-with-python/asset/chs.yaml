  \ sense 网络研讨会、两个 a b m 和五个 zoom 网络研讨会。列标题如下：`keyword`、`market`、`phase`、`device`、`search\
  \ volume`、`rank`、`URL`、`site`和`snippets`。\n\n两个数据集都去重后，我们可以开始从不同角度进行聚合分析，并生成洞察。\n\
  \n### 域名\n\n任何算法更新中最常见的问题之一是哪些网站获得了流量，哪些网站流失了流量。我们将首先筛选出排名前 10 的网站，计算其“覆盖范围”，并按网站汇总：\n\
  \n```python\nbefore_unq_reach = getstat_bef_unique\nbefore_unq_reach = before_unq_reach[before_unq_reach['rank']\
  \ < 11 ]\nbefore_unq_reach = before_unq_reach.groupby(['site']).agg({'count': 'sum'}).reset_index()\n\
  ```\n\n将`count`重命名为`reach`：\n\n```python\nbefore_unq_reach = before_unq_reach.rename(columns\
  \ = {'count': 'reach'})\nbefore_unq_reach = before_unq_reach[['site', 'reach']]\n\
  ```\n\n将空值替换为零：\n\n```python\nbefore_unq_reach['reach'] = np.where(before_unq_reach['reach'].isnull(),\
  \ 0, before_unq_reach['reach'])\nbefore_unq_reach.sort_values('reach', ascending\
  \ = False).head(10)\n```\n\n不出所料，谷歌在所有网站中拥有最多的关键词曝光量。紧随其后的是 HubSpot，然后是 ON24，即我们关注的网站。请注意，这是在谷歌更新之前的情况。\n\
  \n![](img/537787_1_En_10_Figg_HTML.jpg)\n\n一个表格展示了包含 3 列和 10 行的列表。列标题如下：`site`和`reach`。行中包含频繁被覆盖的网站。热门网站包括`google.com`、`hubspot.com`和`on24.com`。\n\
  \n我们将对更新后的域名覆盖范围重复进行聚合：\n\n```python\nafter_unq_reach = getstat_aft_unique\nafter_unq_reach\
  \ = after_unq_reach[after_unq_reach['rank'] < 11 ]\nafter_unq_reach = after_unq_reach.groupby(['site']).agg({'count':\
  \ 'sum'}).reset_index()\nafter_unq_reach = after_unq_reach.rename(columns = {'count':\
  \ 'reach'})\nafter_unq_reach['reach'] = np.where(after_unq_reach['reach'].isnull(),\
  \ 0, after_unq_reach['reach'])\nafter_unq_reach = after_unq_reach[['site', 'reach']]\n\
  after_unq_reach.sort_values('reach', ascending = False).head(10)\n```\n\n结果如下：\n\
  \n![](img/537787_1_En_10_Figh_HTML.jpg)\n\n一个表格展示了包含 3 列和 10 行的列表。列包括`site`和`reach`。行中包含频繁被覆盖的网站。热门网站包括`google.com`（覆盖\
  \ 1011 次）、`hubspot.com`（覆盖 304 次）和`on24.com`（覆盖 222 次）。\n\n谷歌在其自身更新后成为了更大的赢家。HubSpot\
  \ 略有损失，而 ON24 几乎未变。或者至少表面上看是这样，我们稍后深入分析时会看到更多细节。\n\n与其用肉眼观察两个独立的数据框，不如将它们合并起来进行并排比较：\n\
  \n```python\ncompare_reach_loser = before_unq_reach.merge(after_unq_reach, on =\
  \ ['site'], how = 'outer')\n```\n\n将列重命名为更友好的名称：\n\n```python\ncompare_reach_loser\
  \ = compare_reach_loser.rename(columns = {'reach_x': 'before_reach', 'reach_y':\
  \ 'after_reach'})\ncompare_reach_loser['before_reach'] = np.where(compare_reach_loser['before_reach'].isnull(),\n\
  0, compare_reach_loser['before_reach'])\n```\n\n将空值替换为零，以防止下一步出错：\n\n```python\n\
  compare_reach_loser['after_reach'] = np.where(compare_reach_loser['after_reach'].isnull(),\n\
  0, compare_reach_loser['after_reach'])\n```\n\n创建新列，量化更新前后覆盖范围的差异：\n\n```python\n\
  compare_reach_loser['delta_reach'] = compare_reach_loser['after_reach'] - compare_reach_loser['before_reach']\n\
  compare_reach_loser = compare_reach_loser.sort_values('delta_reach')\ncompare_reach_loser\
  \ = compare_reach_loser[['site', 'before_reach', 'after_reach', 'delta_reach']]\n\
  compare_reach_loser.head(10)\n```\n\n结果如下：\n\n![](img/537787_1_En_10_Figi_HTML.jpg)\n\
  \n一个表格展示了包含 4 列和 10 行的列表。列标题为`site`、`before reach`、`after reach`和`delta reach`。行按损失降序排列，包括`workcast.com`、`hubspot.com`、`podcastinsights.com`、`marketo.com`等。\n\
  \n迄今为止，损失最大的似乎是 WorkCast（网络研讨会软件领域的主要参与者），其次是 HubSpot。正如你将意识到的，将表格分别聚合后再合并，使得比较变得容易得多。让我们重复操作以找出赢家：\n\
  \n```python\ncompare_reach_winners = compare_reach_loser.sort_values('delta_reach',\
