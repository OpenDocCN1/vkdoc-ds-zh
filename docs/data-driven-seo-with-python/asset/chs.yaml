  \ of [0-9]', regex = True)]\n```\n\n移除单词数少于 5 个或超过 12 个的标题：\n\n```\nheadings_tosum_filtered\
  \ = headings_tosum_filtered.loc[headings_tosum_filtered['tokens'].between(5, 12)]\n\
  headings_tosum_filtered = headings_tosum_filtered.sort_values('count', ascending\
  \ = False)\nheadings_tosum_filtered = headings_tosum_filtered.loc[headings_tosum_filtered['heading']\
  \ != '' ]\nheadings_tosum_filtered.head(10)\n```\n\n结果如下：\n\n![](img/537787_1_En_4_Figx_HTML.jpg)\n\
