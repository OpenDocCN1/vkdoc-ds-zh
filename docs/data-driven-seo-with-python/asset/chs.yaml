  \ 映射后的数据框。列标题为 URL、n-gram 和点击量。\n\n现在表格中的 n-gram 标签更加合理，可以对其进行汇总聚合，以选出每个 URL 最常见的标签：\n\
  \n```python\nbigram_stats = bigrams_df[['ngram', 'clicks']]\nbigram_stats = bigram_stats[bigram_stats.ngram.str.contains(r'[\\\
