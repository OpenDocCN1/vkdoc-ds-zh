  \n结果是一个数据框，显示了每个 URL 的所有 CWV 得分。\n\n## 数据转换\n\n转换通过 API 或其他方式从数据源提取的数据，其目的是：\n\n\
  *   清理数据，以便进一步计算指标\n*   推导有意义的统计数据，例如月环比（MoM）差异\n*   将数据插入（即加载）到数据仓库中\n\n代码将继续处理之前提取的\
  \ Google Analytics (GA) 数据，我们将涵盖上述几点。\n\n我们首先复制 GA 数据框：\n\n```python\ndf_clean =\
  \ df.copy()\n```\n\n将 `averageSessionDuration` 重新配置为秒数：\n\n```python\ndf_clean['averageSessionDuration']\
  \ = (df_clean['averageSessionDuration'] / 60).round(1)\n```\n\n基于时间和日历日期单位创建新列，以便于转换：\n\
  \n```python\ndf_clean['month'] = df_clean['dateRange'].dt.strftime('%m')\ndf_clean['year']\
  \ = df_clean['dateRange'].dt.strftime('%Y')\ndf_clean['month_year'] = df_clean['dateRange'].dt.strftime('%Y-%m')\n\
  df_clean\n```\n\n结果如下：\n\n![](img/537787_1_En_8_Figf_HTML.jpg)\n\n一个数据框的截图，其中包含趋势数据的新列。列标题为\
  \ `landing page`、`data range`、`active users`、`screen page views per session`、`bounce\
  \ rate`、`average session duration`、`user conversion rate`、`ecommerce purchases`\
  \ 和 `month`。\n\n数据格式化后，我们可以开始转换以推导趋势数据的新列，例如：\n\n*   平均值\n*   标准差（用于衡量变异）\n*   周期性变化（例如月环比）\n\
  \n让我们复制一份并重命名，以反映我们正在按着陆页和月份进行聚合：\n\n```python\nga4_lp_agg_month = df_clean.copy()\n\
  ```\n\n\n我们将创建一些基本的汇总统计量，即使用 `groupby()` 和 `agg()` 函数计算各种 GA 指标的平均值（“mean”）和总和（“sum”）：\n\
  \n```\nga4_lp_agg_month_basic = ga4_lp_agg_month.groupby(['landingPage', 'month_year']).agg({'activeUsers':'sum',\n\
  'screenPageViewsPerSession':'mean',\n'bounceRate':'mean',\n'averageSessionDuration':'mean',\n\
  'userConversionRate':'mean',\n'ecommercePurchases':'sum'\n}).reset_index()\nga4_lp_agg_month_basic\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_8_Figg_HTML.jpg)\n\n一张数据框截图，条目按着陆页和年月汇总。列标题分别为：着陆页、年月、活跃用户、每次会话浏览页数、跳出率、平均会话时长、用户转化率和电子商务购买量。\n\
  \n如上所示的指标按着陆页和 `month_year` 汇总，可用于为基础 SEO 仪表盘报告系统提供数据。通常在所有情况下，我们都会追踪平均值和标准差。平均值能为我们提供一个有用的指标，表明某个渠道在性能方面处于什么水平，因为它会指出在给定时间点，对于给定数据类别，大多数数据点位于或将要位于何处。正如每一位统计学家（以及许多具备统计意识的人）会告诉你的那样，平均值在单独用于推断甚至决策时可能很危险。这就是为什么我们还要追踪标准差，因为这个指标能告诉我们某个指标的变异情况，即其一致性如何。\n\
  \n实际上，标准差告诉我们数据点与平均值的接近程度。我们能从中推断出什么？我们可以推断出哪些平均值更值得信赖或依赖，以便在月份之间进行比较。因此，标准差可以在一定程度上告诉我们平均值的质量，以便我们对数据建立信心、进行比较，并了解我们追踪的指标随时间的变化情况。\n\
  \n例如，你可能会发现标准差在增加或减少，因此应该尝试理解其背后的原因。可能是：\n\n*   谷歌通过算法更新带来的变化？\n*   用户行为、查询搜索意图、品牌定位或市场的变化？\n\
  *   网站的用户体验、内容或架构的变化？\n\n追踪标准差可以帮助你发现某些事情是在变好还是变坏：\n\n```\nga4_lp_agg_month = df_clean.copy()\n\
  ```\n\n执行聚合以得出各种平均值和标准差统计量：\n\n```\nga4_lp_agg_month_mean = ga4_lp_agg_month.groupby(['landingPage',\n\
  'month_year']).agg({'activeUsers':'mean',\n}).reset_index()\nga4_lp_agg_month_mean\
  \ = ga4_lp_agg_month_mean.rename(columns = {'activeUsers':'activeUsers_avg'})\n\
  ```\n\n“mean”计算平均值，而“std”计算标准差：\n\n```\nga4_lp_agg_month_std = ga4_lp_agg_month.groupby(['landingPage',\n\
  'month_year']).agg({'activeUsers':'std',\n'bounceRate':'std',\n}).reset_index()\n\
  ```\n\n重命名列：\n\n```\nga4_lp_agg_month_std = ga4_lp_agg_month_std.rename(columns\
  \ = {'activeUsers':'activeUsers_std',\n'bounceRate':'bounceRate_std'\n})\n```\n\n\
  将数据连接到之前创建的基础数据框：\n\n```\nga4_lp_agg_month_stats = ga4_lp_agg_month_basic.merge(ga4_lp_agg_month_mean,\n\
  on = ['landingPage', 'month_year'], how = 'left')\nga4_lp_agg_month_stats = ga4_lp_agg_month_stats.merge(ga4_lp_agg_month_std,\n\
  on = ['landingPage', 'month_year'], how = 'left')\nga4_lp_agg_month_stats.head()\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_8_Figh_HTML.jpg)\n\n一张显示新增列结果的截图。列标题分别为：每次会话浏览页数、跳出率、平均会话时长、用户转化率、电子商务购买量、活跃用户平均值和标准差、跳出率标准差。\n\
  \n我们现在可以看到之前创建的额外列。下一段代码计算各种性能数据的环比。\n\n首先，我们对值进行排序，使每个着陆页的行按月份顺序排列，因为环比计算将依赖于行的位置：\n\
  \n```\nga4_lp_agg_month_moms = ga4_lp_agg_month_stats.sort_values(['landingPage',\
  \ 'month_year'])\n```\n\n我们只计算 `activeUsers` 和 `bounceRate` 的月度统计量；但是，你可以对所有其他指标列使用相同的方法。首先，我们使用\
  \ `shift()` 函数计算当前行与上一行（上个月）的绝对变化。\n\n请注意，`shift()` 函数传入的参数是“1”，表示 1 行。如果你想计算同比差异，那么可以传入“12”（即\
  \ `.shift(12)`），它会查看前 12 行的值。\n\n```\nga4_lp_agg_month_moms['activeUsers_delta']\
  \ = ga4_lp_agg_month_moms['activeUsers'] - ga4_lp_agg_month_moms['activeUsers'].shift(1)\n\
  ```\n\n然后，通过将绝对变化除以当前月份的值并乘以 100 来计算环比：\n\n```\nga4_lp_agg_month_moms['activeUsers_mom']\
  \ = ((ga4_lp_agg_month_moms['activeUsers_delta'] / ga4_lp_agg_month_moms['activeUsers'].shift(1)\
  \ * 100)).round(1)\n```\n\n对跳出率重复此过程：\n\n```\nga4_lp_agg_month_moms['bounceRate_delta']\
  \ = ga4_lp_agg_month_moms['bounceRate'] - ga4_lp_agg_month_moms['bounceRate'].shift(1)\n\
  ga4_lp_agg_month_moms['bounceRate_mom'] = ((ga4_lp_agg_month_moms['bounceRate_delta']\
  \ / ga4_lp_agg_month_moms['bounceRate'].shift(1) * 100)).round(1)\nga4_lp_agg_month_moms\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_8_Figi_HTML.jpg)\n\n一张数据框截图，包含额外列。列标题分别为：每次会话浏览页数、跳出率、平均会话时长、用户转化率、电子商务购买量、活跃用户标准差、跳出率标准差。\n\
  \n新增了差值（delta）和环比（month-on-month）列。注意第一行的 NaN，这是因为没有前一行供 `shift()` 函数使用。要覆盖 NaN，你可以使用\
  \ `np.where()` 函数将 `.isnull()` 替换为零。另一种方法是使用特殊函数来避免对行进行排序。但是，如果你计划将其自动化成一个包罗万象的\
  \ SEO 数据仓库仪表盘报告系统，那么在云端运行时，这种方法可能在计算上更昂贵。\n\n完成后，你就可以上传到你选择的数据仓库了。\n\n## 加载数据\n\n\
  正如本章前面提到的，加载涉及将转换后的数据移入数据仓库。上传后，最好检查你的数据模式并预览你上传的内容。\n\n以下 SQL 将按月份和渠道生成用户趋势：\n\n\
  \n\n```sql\nselect yearMonth, channel, sum(users) as users from (\nselect yearMonth,\
  \ 'organic' as channel, users_sum  as users from\ngoogle_analytics.multichannel_ga_monthly\n\
  where channel in ('Organic Traffic')\nand\nDATE_DIFF(CURRENT_DATE(), PARSE_DATE('%Y-%m-%d',\
  \ CONCAT(SUBSTR(CAST(yearMonth AS STRING), 1, 4),\"-\",\nSUBSTR(CAST(yearMonth AS\
  \ STRING), 5, 2),\"-\",'01')), MONTH) <= 12\nunion all\nselect yearMonth, 'non_seo'\
  \ as channel, all_users - organic as users\nfrom (\nSELECT yearMonth\n, MAX(IF(channel\
