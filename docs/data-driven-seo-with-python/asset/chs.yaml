  first\")\n```\n\n#### 按查询类型分段\n\n下一步是按类型对查询进行分段。这样做的原因是，我们希望在细分市场内比较展示量，而不是与整个网站进行比较。\n\
  \n这使得数据在突出细分市场内的机会方面更有意义。否则，如果我们将展示量与网站平均值进行比较，可能会错失有价值的搜索查询机会。\n\n我们在 Python 中使用的方法是，根据\
  \ `query` 列中找到的修饰符字符串进行分类：\n\n```\nretail_vex = ['cdkeys', 'argos', 'smyth', 'amazon',\
  \ 'cyberpunk', 'GAME']\nplatform_vex = ['ps5', 'xbox', 'playstation', 'switch',\
  \ 'ps4', 'nintendo']\ntitle_vex = ['blackops', 'pokemon', 'minecraft', 'mario',\
