  \ URL、未命名 20、最终目标 URL、内容相似度等。\n\n### 对 URL 进行分段\n\n有了所有这些审计 URL，我们希望理解它们，以便能够按内容类型辨别趋势。由于手头没有训练好的神经网络，我们将使用一种虽然粗糙但有用的方法，即按\
