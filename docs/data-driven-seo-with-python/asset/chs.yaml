  \ 和 describe。\n\n该表格描述了按爬取深度或站点层级划分的内部链接分布。任何距离首页 3 次或更多点击的 URL，平均预计有 2 个内部链接。这很可能是博客内容，因为营销团队会制作大量此类内容。\n\
  \n为了以图形方式可视化：\n\n```\nfrom plotnine import *\nimport matplotlib.pyplot as plt\n\
