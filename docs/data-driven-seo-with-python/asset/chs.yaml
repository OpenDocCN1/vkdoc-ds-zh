  \ Holland、艺术家以及构建进度。\n\n定义了站点节点（稍后会派上用场）后，我们将查找父节点和子节点的配对。\n\n### 识别父节点和子节点\n\n\
  子节点是距离父节点仅一次点击的直属页面。为此，我们需要几个函数。`apply_pcn` 函数将数据帧视为行集合，并应用第二个函数。这种方法比使用 `.iterrows()`\
  \ 逐行遍历数据帧更快，后者以速度极慢而闻名。\n`parent_child_nodes` 函数将获取行，将其转换为列表，然后使用列表推导式忽略空白单元格（`NaN`，即“非数字”的缩写），并将内容追加到列表\
  \ `pairs` 中。\n完成后，`pairs` 列表将被放入一个新的数据帧 `parent_child_map` 中。\n\n让我们逐行迭代以选取配对：\n\
  \n```\npairs = []\ndef parent_child_nodes(row):\ndata = row.values.tolist()\ndata\
  \ = [e for e in data if str(e) not in ('nan')]\nprint(data)\npairs.append(data)\n\
  def apply_pcn(df):\nreturn df.apply(\nlambda row:\nparent_child_nodes(\nrow),\n\
  axis=1\n)\napply_pcn(hierarchy_raw)\nparent_child_map = pd.DataFrame(pairs,columns=['parent',\
  \ 'child'])\nparent_child_map\n```\n\n我们现在有了一个显示父节点和子节点的表格：\n\n![](img/537787_1_En_9_Figc_HTML.jpg)\n\
