  \n\n\n### 内部链接不足的页面权威 URL\n\n将 URL 按 PA（页面权威）等级分组后，我们需要检查它们的内链数量是否与其权威等级不匹配。我们将阈值设定为\
  \ 40%，即任何 URL 在其 PA 等级下内链数量低于该阈值，即被视为“链接不足”。\n\n在此阶段，选择 40%并非绝对重要，因为每个网站（甚至每个市场）情况各异。存在更科学的方法来确定最佳阈值，例如分析搜索空间中的顶级竞争对手；但现阶段，我们暂以\
  \ 40%作为阈值。\n\n```\ndef quantile_lower(x):\nreturn x.quantile(.4).round(0)\nquantiled_pageau\
  \ = intlinks_pageauth.groupby('pa_band').agg({'no_internal_links_to_url': [quantile_lower]}).reset_index()\n\
  quantiled_pageau.columns = ['_'.join(col) for col in quantiled_pageau.columns.values]\n\
  quantiled_pageau = quantiled_pageau.rename(columns = {'pa_band_': 'pa_band',\n'no_internal_links_to_url_quantile_lower':\
  \ 'pa_intlink_lowqua'})\nquantiled_pageau\n```\n\n结果如下：\n\n![](img/537787_1_En_3_Figw_HTML.jpg)\n\
  \n一张表格截图，列标题为`pa_band`和`pa_intlink_lowqua`，行条目为 0 到 4 的数字。\n\n基于 PageRank，我们现在得到了预期的内链最低阈值。接下来合并数据，标记出那些在其权威等级下链接不足的\
  \ URL：\n\n```\nintlinks_pageauth_underidx = intlinks_pageauth.merge(quantiled_pageau,\
  \ on = 'pa_band', how = 'left')\ndef pa_intlinkscount_underover(row):\nif row['pa_intlink_lowqua']\
  \ > row['no_internal_links_to_url']:\nval = 1\nelse:\nval = 0\nreturn val\nintlinks_pageauth_underidx['pa_int_uidx']\
  \ = intlinks_pageauth_underidx.apply(pa_intlinkscount_underover, axis=1)\n```\n\n\
  此函数将允许我们进行聚合，以查看每个 PageRank 等级下有多少个 URL，以及其中有多少是链接不足的：\n\n```\npageauth_agged =\
  \ intlinks_pageauth_underidx.groupby('pa_band').agg({'pa_int_uidx': ['sum', 'count']}).reset_index()\n\
  pageauth_agged.columns = ['_'.join(col) for col in pageauth_agged.columns.values]\n\
  pageauth_agged['uidx_prop'] = pageauth_agged.pa_int_uidx_sum / pageauth_agged.pa_int_uidx_count\
  \ * 100\nprint(pageauth_agged)\n```\n\n结果如下：\n\n```\npa_band_  pa_int_uidx_sum \
