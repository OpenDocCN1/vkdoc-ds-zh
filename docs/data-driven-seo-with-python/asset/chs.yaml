  \ 110 和 115。数值为估算值。\n\n**图 9-6** 按内容细分领域划分的 Google Search Console (GSC) URL 数量变更前后的柱状图\n\
  \n然而，“文档”和“其他”类别的数量大幅减少，“帮助”、“销售”和“库存”类别也略有减少。那么 Google 排名位置又如何呢？\n\n```python\n\
  segment_rank_plt = (\nggplot(gsc_long_seg_stats,\naes(x = 'reorder(segment_two,\
