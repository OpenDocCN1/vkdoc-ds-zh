  \ 3-5）。\n\n![](img/537787_1_En_3_Fig5_HTML.png)\n\n一个带有散点的箱线图展示了指向 URL 的内部链接数量与站点层级的关系。站点层级\
  \ 1 的范围最大，其下四分位数和上四分位数大约在 6000 到 9000 之间，其次是站点层级 2。\n\n**图 3-5**  \n按站点层级划分的内部链接数量的箱线图分布（纵轴取对数）\n\
  \n例如，更明显的是，站点层级 2 上页面的入站内部链接中位数远高于较低层级。\n\n同样非常明显的是，站点层级 3 和 4 中页面的内部入站链接变异高于层级\
  \ 5 和 6。\n\n不过请记住，前面的示例是通过对同一输入变量使用对数刻度实现的。\n\n我们在这里学到的是，创建一个对内部链接取对数的新变量，将能提供一个更有帮助的视角来比较层级\
  \ 2 到 10。\n\n我们将通过创建一个新的列变量 `log_intlinks` 来实现这一点，该变量是内部链接计数的对数。为了避免对零取对数产生负无穷值，我们将在计算中加上\
  \ 0.01：\n\n\n\n```python\nredir_live_urls['log_intlinks'] = np.log2(redir_live_urls['no_internal_links_to_url']\
  \ + .01)\n```\n\n现在，我们将使用新的对数化变量进行绘图：\n\n```python\nintlink_dist_plt = (ggplot(redir_live_urls,\
  \ aes(x = 'crawl_depth', y = 'log_intlinks')) +\ngeom_boxplot(fill = 'blue', alpha\
  \ = 0.8) +\nlabs(y = '# 指向 URL 的内部链接对数', x = '站点层级') +\ntheme_classic() +\ntheme(legend_position\
  \ = 'none')\n)\nintlink_dist_plt.save(filename = 'images/1c_loglinks_dist_plt.png',\
  \ height=5, width=5, units = 'in', dpi=1000)\nintlink_dist_plt\n```\n\n`intlink_dist_plt`\
  \ 图（图 3-6）与对数化刻度非常相似，只是这次数字更易读，因为我们使用了常规刻度作为纵轴。比较平均值和变异程度也更容易。\n\n![](img/537787_1_En_3_Fig6_HTML.png)\n\
  \n带点的箱线图展示了指向 URL 的对数化内部链接数量与站点层级的关系。站点层级 1 的范围最大，其下四分位数和上四分位数大约在 12 到 13 之间，其次是站点层级\
  \ 2，范围在 1 到 3 之间。\n\n**图 3-6** 按站点层级划分的对数化内部链接箱线图分布\n\n### 站点层级中链接不足的 URL\n\n现在我们已经了解了站点深度层级上分布的整体情况，可以开始深入挖掘，看看每个站点层级有多少\
  \ URL 存在链接不足的问题。\n\n例如，如果某个站点层级上，指向 URL 的内部链接数量的第 35 百分位数为 10，那么有多少 URL 低于该百分位数？\n\
  \n这正是我们要找出的答案。为什么是 35%而不是 25%？这其实无关紧要，只需要选择一个较低的分界点即可，因为分界点是人为设定的。\n\n第一步是计算非对数和对数版本的内部链接平均值，稍后这些平均值将合并到主数据框中：\n\
  \n```python\nintlink_dist = redir_live_urls.groupby('crawl_depth').agg({'no_internal_links_to_url':\
  \ ['mean'],\n'log_intlinks': ['mean']\n}).reset_index()\nintlink_dist.columns =\
  \ ['_'.join(col) for col in intlink_dist.columns.values]\nintlink_dist = intlink_dist.rename(columns\
  \ = {'no_internal_links_to_url_mean': 'avg_int_links',\n'log_intlinks_mean': 'logavg_int_links',\n\
  })\nintlink_dist\n```\n\n结果如下：\n\n![](img/537787_1_En_3_Figp_HTML.jpg)\n\n一张表格截图，数据位于列标题\
  \ `crawl_depth`、`avg_int_links` 和 `logavg_int_links` 下。行条目为数字 0 到 11。\n\n平均值已按站点层级排列。注意，对数列如何帮助减少不同爬取深度之间数值范围的极端性和偏态性，例如，平均值的范围从\
  \ 4239 到 0.06，而对数平均值的范围从 12 到-6.39，这使得数据更容易标准化。\n\n现在，我们将所有站点层级的下分位数设置为 35%。这将使用自定义函数\
  \ `quantile_lower`：\n\n```python\ndef quantile_lower(x):\n    return x.quantile(.35).round(0)\n\
  \nquantiled_intlinks = redir_live_urls.groupby('crawl_depth').agg({'log_intlinks':\n\
  [quantile_lower]}).reset_index()\nquantiled_intlinks.columns = ['_'.join(col) for\
  \ col in quantiled_intlinks.columns.values]\nquantiled_intlinks = quantiled_intlinks.rename(columns\
  \ = {'crawl_depth_': 'crawl_depth',\n'log_intlinks_quantile_lower': 'sd_intlink_lowqua'})\n\
  quantiled_intlinks\n```\n\n结果如下：\n\n![](img/537787_1_En_3_Figq_HTML.jpg)\n\n一张表格截图，数据位于列标题\
  \ `crawl_depth` 和 `sd_intlink_lowqua` 下。行条目为数字 0 到 11。\n\n下分位数统计已设置完成。四分位数仅限于第 25\
  \ 百分位数，而分位数则可以将下限设置为任意数值，例如第 11、18、24 百分位数等，这就是我们使用分位数而非四分位数的原因。接下来的步骤是将数据合并到主数据框中，然后应用一个函数来标记在其给定站点层级中链接不足的\
  \ URL：\n\n```python\nredir_live_urls_underidx = redir_live_urls.merge(quantiled_intlinks,\
  \ on = 'crawl_depth', how = 'left')\n```\n\n以下函数用于评估 URL 的链接数量是否低于下分位数。如果是，则 `sd_int_uidx`\
  \ 的值为 1，否则为 0：\n\n```python\ndef sd_intlinkscount_underover(row):\n    if row['sd_intlink_lowqua']\
  \ > row['log_intlinks']:\n        val = 1\n    else:\n        val = 0\n    return\
  \ val\n\nredir_live_urls_underidx['sd_int_uidx'] = redir_live_urls_underidx.apply(sd_intlinkscount_underover,\
  \ axis=1)\n```\n\n还有一些代码用于处理“未设置”的情况，这些实际上是被孤立的 URL。在此例中，我们将这些 URL 设置为 1——表示它们链接不足：\n\
  \n```python\nredir_live_urls_underidx['sd_int_uidx'] = np.where(redir_live_urls_underidx['crawl_depth']\
  \ == 'Not Set', 1,\nredir_live_urls_underidx['sd_int_uidx'])\nredir_live_urls_underidx\n\
  ```\n\n结果如下：\n\n![](img/537787_1_En_3_Figr_HTML.png)\n\n一张表格截图，数据位于列标题 `url`、`crawl_depth`、`http_status_code`、`indexable`、`indexable_status`、`no_internal_links_to_url`、`title`\
  \ 以及其他 3 个列下。\n\n\n\n数据框显示，该列已到位，将内部链接不足的 URL 标记为 `1`。标记好 URL 后，我们就可以概览 URL 的链接不足情况，这可以通过按爬取深度聚合，并求和链接不足的\
  \ URL 总数来实现：\n\n```\nintlinks_agged = redir_live_urls_underidx.groupby('crawl_depth').agg({'sd_int_uidx':\
  \ ['sum', 'count']}).reset_index()\n```\n\n下面一行代码通过列表推导式插入下划线来整理列名：\n\n```\nintlinks_agged.columns\
  \ = ['_'.join(col) for col in intlinks_agged.columns.values]\nintlinks_agged = intlinks_agged.rename(columns\
  \ = {'crawl_depth_': 'crawl_depth'})\n```\n\n为了得到比例（或百分比），我们将总和除以计数并乘以 100：\n\n\
  ```\nintlinks_agged['sd_uidx_prop'] = (intlinks_agged.sd_int_uidx_sum) / intlinks_agged.sd_int_uidx_count\
  \ * 100\nprint(intlinks_agged)\n```\n\n结果如下：\n\n```\ncrawl_depth  sd_int_uidx_sum\
  \  sd_int_uidx_count  sd_uidx_prop\n0            0                0            \
  \      1      0.000000\n1            1               38                 66     57.575758\n\
  2            2               67                169     39.644970\n3            3\
  \               75                280     26.785714\n4            4            \
  \   57                253     22.529644\n5            5               31       \
  \         201     15.422886\n6            6                9                122\
  \      7.377049\n7            7                9                 64     14.062500\n\
  8            8                3                 17     17.647059\n9            9\
  \                2                  6     33.333333\n10          10            \
  \    0                  1      0.000000\n11     Not Set             2303       \
  \        2303    100.000000\n```\n\n因此，尽管第 1 层和第 2 层的内容链接数量多于任何较低层级，但它们的链接不足 URL\
  \ 比例高于任何其他站点层级（当然，除了“未设置”中的孤立页面）。\n\n例如，首页正下方的页面中有 57% 存在链接不足的情况。\n\n让我们进行可视化：\n\
  \n```\n# plot the table\ndepth_uidx_plt = (ggplot(intlinks_agged, aes(x = 'crawl_depth',\
  \ y = 'sd_int_uidx_sum')) +\ngeom_bar(stat = 'identity', fill = 'blue', alpha =\
  \ 0.8) +\nlabs(y = '# Under Linked URLs', x = 'Site Level') +\nscale_y_log10() +\n\
  theme_classic() +\ntheme(legend_position = 'none')\n)\ndepth_uidx_plt.save(filename\
  \ = 'images/1_depth_uidx_plt.png', height=5, width=5, units = 'in', dpi=1000)\n\
  depth_uidx_plt\n```\n\n使用 `depth_uidx_plt` 进行可视化是很好的，因为我们还可以看到（图 3-7）第 2、3 和 4 层在数量上拥有最多的链接不足\
  \ URL。\n\n![](img/537787_1_En_3_Fig7_HTML.png)\n\n柱状图展示了从 0 到 10 以及“未设置”的站点层级中，链接不足\
  \ URL 的数量。 “未设置”范围包含超过 1000 个链接不足的 URL。 其他站点层级则少于 100 个链接不足的 URL。\n\n**图 3-7** 按站点层级划分的内部链接不足\
  \ URL 数量的柱状图\n\n让我们绘制 `intlinks_agged` 表格：\n\n```\ndepth_uidx_prop_plt = (ggplot(intlinks_agged,\
  \ aes(x = 'crawl_depth', y = 'sd_uidx_prop')) +\ngeom_bar(stat = 'identity', fill\
  \ = 'blue', alpha = 0.8) +\nlabs(y = '% URLs Under Linked', x = 'Site Level') +\n\
  theme_classic() +\ntheme(legend_position = 'none')\n)\ndepth_uidx_prop_plt.save(filename\
  \ = 'images/1_depth_uidx_prop_plt.png', height=5, width=5, units = 'in', dpi=1000)\n\
  depth_uidx_prop_plt\n```\n\n绘制 `depth_uidx_prop_plt`（图 3-8），我们看到尽管第 1 层的数量较低，但其比例却更高。\
  \ 直观上，这表明有太多页面从首页链接，但链接分配不均。\n\n![](img/537787_1_En_3_Fig8_HTML.png)\n\n柱状图绘制了从\
  \ 0 到 10 以及“未设置”的站点层级中，链接不足 URL 的百分比值。 在其他站点层级范围中，“未设置”范围的比例大约超过了 100%。\n\n**图 3-8**\
  \ 按站点层级划分的内部链接不足 URL 比例的柱状图\n\n并非所有处于某个站点层级且链接不足的 URL 都一定是个问题，或者可能更多是设计使然。 然而，它们值得审查，因为也许它们本应处于该站点层级，或者毕竟它们确实应该获得更多的内部链接。\n\
  \n以下代码将链接不足的 URL 导出到一个 CSV 文件，该文件可以在 Microsoft Excel 中查看：\n\n```\nunderlinked_urls\
  \ = redir_live_urls_underidx.loc[redir_live_urls_underidx.sd_int_uidx == 1]\nunderlinked_urls\
  \ = underlinked_urls.sort_values(['crawl_depth', 'no_internal_links_to_url'])\n\
  underlinked_urls.to_csv('exports/underlinked_urls.csv')\n```\n\n\n\n### 按页面权威度划分\n\
  \n来自外部网站的入站链接是 PageRank（或者，如果我们保持搜索引擎中立的话，称为页面权威度）的来源。\n\n鉴于并非所有页面都能获得入站链接，SEO 通常希望让没有反向链接的页面被更频繁地抓取。因此，分析并探索如何将这些\
  \ PageRank 重新分配给网站内其他页面是合理的。\n\n我们首先将 AHREFs 数据附加到主数据框上，这样就能按页面权威度查看内部链接。\n\n```python\n\
  intlinks_pageauth = redir_live_urls_underidx.merge(ahrefs_df, on = 'url', how =\
  \ 'left')\nintlinks_pageauth.head()\n```\n\n结果如下：\n\n![](img/537787_1_En_3_Figs_HTML.jpg)\n\
  \n一张表格的截图，其列标题为：`url`、`crawl_depth`、`http_status_code`、`indexable_status`、`no_internal_links_to_url`、`title`、`log_internal_links`、`page_authority`和`referring_domains`。\n\
  \n现在我们在 URL 级别拥有了页面权威度和引荐域名。可以预见，首页拥有大量引荐域名（超过 3000 个），并且页面级权威度最高，达到 81。\n\n像往常一样，我们将进行一些聚合操作，并探索\
  \ PageRank（可与页面权威度互换使用）的分布情况。\n\n首先，我们清理数据，确保将空值替换为零：\n\n```python\nintlinks_pageauth['page_authority']\
  \ = np.where(intlinks_pageauth['page_authority'].isnull(),\n0, intlinks_pageauth['page_authority'])\n\
  ```\n\n按页面权威度聚合：\n\n```python\nintlinks_pageauth.groupby('page_authority').agg({'no_internal_links_to_url':\
  \ ['describe']})\n```\n\n结果如下：\n\n![](img/537787_1_En_3_Figt_HTML.jpg)\n\n一张表格的截图，展示了页面权威度、计数、平均值、`std`、最小值、25%、50%、75%和最大值的数据列表。表格顶部的文字为`no_internal_links_to_url`和`describe`。\n\
  \n上表展示了不同页面权威度级别下内部链接的分布情况。\n\n在较低级别，大多数 URL 大约有两个内部链接。\n\n一张图表将为我们呈现全貌：\n\n```python\n\
  # distribution of page_authority\npage_authority_dist_plt = (ggplot(intlinks_pageauth,\
  \ aes(x = 'page_authority')) +\ngeom_histogram(fill = 'blue', alpha = 0.6, bins\
  \ = 30 ) +\nlabs(y = '# URLs', x = 'Page Authority') +\n#scale_y_log10() +\ntheme_classic()\
  \ +\ntheme(legend_position = 'none')\n)\npage_authority_dist_plt.save(filename =\
  \ 'images/2_page_authority_dist_plt.png',\nheight=5, width=5, units = 'in', dpi=1000)\n\
  page_authority_dist_plt\n```\n\n`page_authority_dist_plt`（图 3-9）所示的分布，在绘制原始数据时呈现严重的负偏态。网站中大多数\
  \ URL 的 PageRank 为 15，而权威度更高的 URL 数量急剧减少。大量 URL 没有权威度，因为它们成为了孤页。\n\n![](img/537787_1_En_3_Fig9_HTML.png)\n\
  \n一张柱状图，绘制了 URL 数量（从 0 到 2000）与页面权威度（从 0 到 80）的关系。页面权威度为 0 时有 1300 个 URL，页面权威度在\
  \ 12 左右时有 1900 个 URL。数值为近似值。\n\n**图 3-9**  \n按页面权威度划分的 URL 分布\n\n使用对数刻度，我们可以比较更高权威度级别的情况：\n\
  \n```python\n# distribution of page_authority\npage_authority_dist_plt = (ggplot(intlinks_pageauth,\
  \ aes(x = 'page_authority')) +\ngeom_histogram(fill = 'blue', alpha = 0.6, bins\
  \ = 30 ) +\nlabs(y = '# URLs (Log)', x = 'Page Authority') +\nscale_y_log10() +\n\
  theme_classic() +\ntheme(legend_position = 'none')\n)\npage_authority_dist_plt.save(filename\
  \ = 'images/2_page_authority_dist_log_plt.png',\nheight=5, width=5, units = 'in',\
  \ dpi=1000)\npage_authority_dist_plt\n```\n\n突然间，`page_authority_dist_plt`（图 3-10）显示的视图变得更有趣了，因为权威度每增加一个单位，URL\
  \ 数量就减少到之前的十分之一——这是一种相当严苛的 PageRank 分布。\n\n![](img/537787_1_En_3_Fig10_HTML.png)\n\
  \n一张柱状图，以对数刻度绘制了 URL 数量与页面权威度的关系。图表趋势在页面权威度 0 到 40 之间是动态变化的。\n\n**图 3-10**  \n按对数刻度划分的\
  \ URL 分布图\n\n鉴于这个更具洞察力的视图，对`page_authority`取对数以形成新的列变量`log_pa`是合理的：\n\n```python\n\
  intlinks_pageauth['page_authority'] = np.where(intlinks_pageauth['page_authority']\
  \ == 0, .1, intlinks_pageauth['page_authority'])\nintlinks_pageauth['log_pa'] =\
