  \ = False).reset_index()\nplayers_before_agg = players_before_rank.merge(players_before_reach,\
  \ on = 'site', how = 'left')\nplayers_before_agg['visi'] = players_before_agg['count']\
  \ / players_before_agg['wavg_rank']\nplayers_before_agg = players_before_agg.sort_values('visi',\
