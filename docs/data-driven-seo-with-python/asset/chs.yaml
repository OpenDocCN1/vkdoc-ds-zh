  \ `x1` 表示）平均多展示了 2.24 次页面浏览量。就显著性而言，LLR p 值为零，因此差异由随机噪声引起的可能性极低。有趣的是，用于衡量 `ab_group`\
  \ 对会话本身解释程度的伪 R 方非常低，仅为 0.029，这意味着该模型噪声很大，需要更多其他因素来预测流量水平，而不仅仅是 `ab_group`。\n\n\
  ## 非结论性实验的结果\n\n实验可能因多种原因未能达到预期效果：\n\n*   预期差异过高——因此考虑修改并重新运行实验。\n*   假设需要以不同方式检验——或许使用不同的衡量指标或不同的检验方法。\n\
  *   需要不同的时间段——即使满足了样本量要求，也可能是由于季节性效应，例如一年中的特定时间，或者数据在完整一周运行之前就满足了样本要求，或者谷歌没有机会处理这些变化（参见之前的讨论）。\n\
  *   其他外部因素。\n\n通过从一开始就设定你的假设，无论结果如何，你都会学到一些东西，并且能够制定一个合理的计划向前推进，无论是进行下一次测试，还是在全站范围内实施你的测试。\n\
  \n## 总结\n\n实验一直是 SEO 专家技能的一部分，用于确定哪些策略可能有效，即使有时缺乏科学严谨性。在企业环境中，由于对收入的影响以及需要在全站推广更改之前证明建议是有益的，严谨的实验设计至关重要。虽然有工具可以在这方面提供帮助，但了解\
  \ SEO 拆分测试背后的数据科学以及必须牢记的注意事项也很有用。在本章中，我们涵盖了\n\n*   实验在 SEO 中的重要性\n*   生成假设\n*  \
  \ 实验设计\n*   运行你的实验\n*   评估你的实验\n*   以及如果你的实验“失败”了该怎么办\n\n在下一章中，我们将介绍以仪表板形式呈现的 SEO\
  \ 报告。\n\n# 8. 仪表板\n\n虽然性能仪表板系统本身并不能直接解决 SEO 问题，但拥有这样的基础设施可以成为一个非常有用的数据存储库，用于支持 SEO\
  \ 科学，并创建可视化图表来传达有用的趋势、变化、威胁和机遇。更重要的是，SEO 数据丰富，有大量的数据源和许多你可以衡量的东西，因此整体情况可能看起来非常嘈杂，最糟糕的情况下，如果你无法清晰地看到并获取信号，这些数据可能毫无用处。拥有一个使用精心设计和深思熟虑的仪表板的性能报告系统，将有助于从嘈杂的数据中突出最重要的趋势。这也将更容易识别因果关系。我们将提供一些用\
  \ SQL 编写的代码，以帮助你理解如何实现一些最有价值的可视化。\n\n## 数据源\n\n你希望为仪表板使用的数据源类型是那些 (a) 提供 API 并且\
  \ (b) 显然能增加信息以更有效地理解你的 SEO 性能的数据源。这些可能包括（并且这绝非详尽无遗）：\n\n*   *网站分析*：Google Analytics\
  \ (GA)、Adobe Analytics、Looker、Segment\n*   *站长工具*：Google Search Console (GSC)、Bing\
  \ Webmaster\n*   *云端网络爬虫*：DeepCrawl、OnCrawl 和 Botify\n*   *SERP*：getSTAT、SEO Monitor、DataForSEO、AWR、AccuRanker\n\
  *   *链接检查器*：AHREFs、Majestic、DataForSEO\n*   *社交媒体*：BuzzSumo\n*   *关键词*：SEMRush、Keywords.io\n\
  *   *广告平台*：Google Ads、DV360\n\n## 不要直接接入 Google Data Studio\n\n谷歌提供了便捷的连接器来接入数据源，例如\
  \ Google Analytics (GA) 和 Google Search Console (GSC)。这允许将数据直接导入 Google Data Studio\
  \ (GDS)，从而使 SEO 仪表板变得简单。然而，这是一个错失的机会，因为在 GDS 中无法叠加这两个数据源之间的数据。GDS 是一个用于可视化数据的前端。如果没有一个在数据源和前端之间进行处理的流程，数据就是原始的、未经提炼的，并且对于发现趋势和揭示洞察来说用处不大。\n\
  \n\n\n## 使用数据仓库\n\n这时就需要像 Google BigQuery 或 Amazon Redshift 这样的数据仓库登场了。你将数据存储在这些数据仓库中，而前端（无论是\
  \ GDS、Tableau、DOMO 还是其他工具）都会使用自定义的结构化查询语言（SQL）来查询数据仓库，并以适合驱动你所需图表的格式获取数据。我们将与你分享\
  \ SQL 代码和一些图表，帮助你构建自己的 SEO 仪表板。不过，在开始构建之前，你需要先将数据导入数据仓库。那么，我们该如何实现呢？\n\n## 提取、转换和加载（ETL）\n\
  \n提取、转换和加载（ETL）是一种方法，字面意思如下：\n\n*   *提取*：从你的数据源 API 中提取数据。\n*   *转换*：根据提取的数据运行计算并创建新的计算字段。\n\
  *   *加载*：将转换后的数据加载到数据仓库中。\n\n根据你选择的云平台、团队云工程技能以及预算，你可以采用多种配置方案。\n\n## 提取数据\n\n提取过程通常是自动化的，通过运行脚本的虚拟机每天查询你的\
  \ API（称为“轮询”）。数据会存储在存储空间或数据仓库中。即使你没有云工程技能，也可以通过 CSV 格式将数据上传到数据仓库。\n\n以下是从多个 API\
  \ 提取数据的代码，这些 API 主要包括 Google 产品以及一些（并非全部）较为知名的 SEO 流程：\n\n*   Google Analytics\n\
  *   Google Search Console\n*   DataForSEO SERPs API\n*   Google PageSpeed API\n\n\
  现在，我们将提供 Python 代码，让你连接到这些 API。这些代码不仅可用于报告目的，还可以进行调整，以支持其他章节中涵盖的其他 SEO 科学活动。\n\n\
  ### Google Analytics\n\n流量仍然是增长的关键杠杆，而 Google Analytics 作为网站分析工具被广泛使用。然而，更多的自然搜索流量并不总是直接与更多收入相关，但它可能通过其他方式表明用户参与度。以下将详细介绍从最知名且最常用的网站分析\
  \ API（即 Google Analytics 版本 4）中提取数据的代码。\n\n#### 导入 API 库\n\n```\nimport pandas as\
  \ pd\nfrom pathlib import Path\nimport os\nfrom datetime import date, timedelta\n\
  ```\n\n#### 设置凭证密钥的文件路径\n\n设置凭证密钥的文件路径，该文件是一个 JSON 文件，可从你的 Google Cloud Platform\
  \ 账户的 API 库 ➤ 凭据中获取：\n\n```\ncredentials_path = Path(\"keys/xxxxx.json\")\ncredentials_path_str\
  \ = str(credentials_path.absolute())\nos.environ[\"GOOGLE_APPLICATION_CREDENTIALS\"\
  ] = credentials_path_str\n```\n\n#### 从 Google 库中导入其他 API\n\n```\nfrom google.analytics.data_v1beta\
  \ import BetaAnalyticsDataClient\nfrom google.analytics.data_v1beta.types import\
  \ DateRange\nfrom google.analytics.data_v1beta.types import Dimension\nfrom google.analytics.data_v1beta.types\
  \ import Metric\nfrom google.analytics.data_v1beta.types import RunReportRequest\n\
  client = BetaAnalyticsDataClient()\n```\n\n#### 定义一个函数来运行聚合报告\n\n定义一个函数来运行聚合报告，该函数需要日期范围和\
  \ GA4 账户的属性 ID。在此函数中，我们使用输入参数查询 API 以构建请求，其中包含我们想要的指标，并存储 API 响应。\n\n我们将维度设置为 `landingPage`，因为我们希望按此维度细分流量数据。也可以使用其他维度，这些维度列在此处（[`https://developers.google.com/analytics/devguides/reporting/data/v1/api-schema`](https://developers.google.com/analytics/devguides/reporting/data/v1/api-schema)）。\n\
  \n```\ndef aggregated_run_report(client, property_id=\"[your-GA-property-id]\",\
  \ date_ranges=[DateRange(start_date=\"2020-03-31\", end_date=\"today\")]):\nrequest\
  \ = RunReportRequest(\nproperty=f\"properties/{property_id}\",\ndimensions=[Dimension(name=\"\
  landingPage\")],\nmetrics=\n[\nMetric(name=\"activeUsers\"),\nMetric(name=\"screenPageViewsPerSession\"\
  ),\nMetric(name=\"bounceRate\"),\nMetric(name=\"averageSessionDuration\"),\nMetric(name=\"\
  userConversionRate\"),\nMetric(name=\"ecommercePurchases\"),\n],\ndate_ranges=date_ranges,\n\
  )\nresponse = client.run_report(request)\nreturn response\nresponse = aggregated_run_report(client)\n\
  print(\"Report result:\")\nfor row in response.rows:\nprint(row.dimension_values[0].value,\
  \ row.metric_values[0].value)\nReport result:\n/ 11347\n/blog/sell-airtime-over-charged-your-line-dont-panic\
  \ 8423\n/faq 4870\n/blog/sell-airtime-over-charged-your-line-dont-panic 2355\n/privacy\
  \ 1338\n```\n\n#### 将 API 响应转换为数据框\n\n下一个函数使用 API 响应结果行，并将其打包成一个数据框：\n\n```\ndef\
  \ ga4_response_to_df(response):\ndim_len = len(response.dimension_headers)\nmetric_len\
  \ = len(response.metric_headers)\nall_data = []\nfor row in response.rows:\nrow_data\
  \ = {}\nfor i in range(dim_len):\nrow_data.update({response.dimension_headers[i].name:\
  \ row.dimension_values[i].value})\nfor i in range(metric_len):\nrow_data.update({response.metric_headers[i].name:\
  \ row.metric_values[i].value})\nall_data.append(row_data)\ndf = pd.DataFrame(all_data)\n\
  return df\ndf = ga4_response_to_df(response)\ndf.info()\n```\n\n结果如下：\n\n```\nRangeIndex:\
  \ 418 entries, 0 to 417\nData columns (total 8 columns):\n\n"
- "#   Column      Non-Null Count  Dtype\n---  ------      ------------  -----\n0\
  \   landingPage 418 non-null    object\n1   dateRange   418 non-null    object\n\
  2   activeUsers 418 non-null    object\n3   screenPageViewsPerSession  418 non-null\
  \    object\n4   bounceRate  418 non-null    object\n5   averageSessionDuration\
  \     418 non-null    object\n6   userConversionRate         418 non-null    object\n\
  7   ecommercePurchases         418 non-null    object\ndtypes: object(8)\nmemory\
  \ usage: 26.2+ KB\n```\n\n通过 `df.info()` 打印数据框的属性，可以告诉我们数据类型，它们看起来都是字符串。对于着陆页来说这没问题，但对于指标（例如\
  \ `activeUsers`）则不然，在进一步处理数据之前，应将其转换为数值类型。\n\n```\ndf.head()\n```\n\n以下生成的数据框显示了维度\
  \ `landingPage` 以及各个指标。数据是在整个日期范围内聚合的。\n\n![](img/537787_1_En_8_Figa_HTML.jpg)\n\
  \n一个数据框的截图，展示了维度条目及其对应的指标。列标题分别为：着陆页、数据范围、活跃用户、每次会话的屏幕页面浏览量、跳出率、平均会话时长、用户转化率和电子商务购买量。\n\
  \n但假设你还希望数据按日期细分。\n\n以下函数将实现这一点，默认天数参数设置为两年：\n\n```\ndef dated_run_report_to_df(client,\
  \ property_id=\"xxxxxxxxx\", n_days=365*2):\ndate_ranges = []\ncount = 0\ndf_output\
  \ = pd.DataFrame()\nfor i in range(n_days):\ncount += 1\ncurrent = date.today()\
