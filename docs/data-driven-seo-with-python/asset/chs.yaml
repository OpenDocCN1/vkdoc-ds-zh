  **图 2-3** Google Trends 关键词的时间序列图\n\n## 预测未来需求\n\n了解过去五年发生的事情固然很好，但展望未来可能发生的情况也同样重要。幸运的是，Python\
  \ 提供了实现这一目标的工具。预测最常见的应用场景是客户提案和报告。\n\n### 探索数据\n\n```python\nimport pandas as pd\n\
  from statsmodels.tsa.statespace.sarimax import SARIMAX\nfrom statsmodels.graphics.tsaplots\
  \ import plot_acf, plot_pacf\nfrom statsmodels.tsa.seasonal import seasonal_decompose\n\
  from sklearn.metrics import mean_squared_error\nfrom statsmodels.tools.eval_measures\
  \ import rmse\nimport warnings\nwarnings.filterwarnings(\"ignore\")\nfrom pmdarima\
  \ import auto_arima\n```\n\n导入 Google Trends 数据：\n\n```python\ndf = pd.read_csv(\"\
  exports/keyword_gtrends_df.csv\", index_col=0)\ndf.head()\n```\n\n结果如下：\n\n![](img/537787_1_En_2_Figj_HTML.jpg)\n\
  \n一个包含 4 列 5 行的表格截图。列标题分别为序号、日期、查询和点击量。行从 1815 到 1819，它们的点击量分别为 12、11、10、10 和 10。\n\
  \n正如我们所料，Google Trends 的数据是一个非常简单的包含日期、查询和点击量的时间序列，跨越五年时间。现在将数据框从长格式转换为宽格式：\n\n\
  ```python\ndf_unstacked = ps_trends.set_index([\"date\", \"query\"]).unstack(level=-1)\n\
  df_unstacked.columns.set_names(['hits', 'query'], inplace=True)\nps_unstacked =\
  \ df_unstacked.droplevel('hits', axis=1)\nps_unstacked.columns = [c.replace(' ',\
  \ '_') for c in ps_unstacked.columns]\nps_unstacked = ps_unstacked.reset_index()\n\
  ps_unstacked.head()\n```\n\n结果如下：\n\n![](img/537787_1_En_2_Figk_HTML.jpg)\n\n一个包含\
  \ 4 列 5 行的表格截图。列标题分别为序号、日期、p s 4 和 p s 5。行从 0 到 4。p s 4 的数据分别为 30、30、29、27 和 27，而所有\
  \ p s 5 的数据均为 0。\n\n我们不再有 `hits` 列，因为这些值现在作为查询值分别位于各自的列中。这种格式不仅适用于 SARIMA（我们将在下面探讨），也适用于神经网络，例如长短期记忆网络（LSTM）。让我们绘制数据：\n\
  \n```python\nps_unstacked.plot(figsize=(10,5))\n```\n\n从图（图 2-4）中，你会注意到“PS4”和“PS5”的曲线特征是不同的。\n\
  \n![](img/537787_1_En_2_Fig4_HTML.jpg)\n\n一个关于 p s 4 和 p s 5 的时间序列多线图。p s 4 的线条有多个峰值，而\
  \ p s 5 的峰值大约在 225 处。\n\n**图 2-4** ps4 和 ps5 的时间序列图\n\n对于不玩游戏的人来说，“PS4”是索尼 PlayStation\
  \ 游戏机的第四代，“PS5”是第五代。“PS4”的搜索量具有很强的季节性，并且具有规律的模式，直到“PS5”出现时才发生变化。“PS5”在五年前并不存在，这解释了前一张图中前四年没有趋势的原因。\n\
  \n\n\n#### 分解趋势\n\n现在我们来分解每个趋势的季节性（或非季节性）特征：\n\n```\nps_unstacked.set_index(\"date\"\
  , inplace=True)\nps_unstacked.index = pd.to_datetime(ps_unstacked.index)\nquery_col\
  \ = 'ps5'\na = seasonal_decompose(ps_unstacked[query_col], model = \"add\")\na.plot();\n\
  ```\n\n图 2-5 展示了时间序列数据以及整体平滑趋势，该趋势显示其从 2020 年开始上升。\n\n![](img/537787_1_En_2_Fig5_HTML.jpg)\n\
  \n4 个折线图。1. `ps5` 与 2016 年 7 月至 2021 年 1 月期间的关系。2. 趋势与时间期间的关系。3. 季节性成分与时间期间的关系。4.\
  \ 残差与时间期间的关系。\n\n**图 2-5** `ps5` 时间序列的分解\n\n季节性趋势图显示了重复出现的峰值，这表明从 2016 年起就存在季节性，尽管考虑到从\
  \ 2016 年到 2020 年时间序列相当平坦，这一结论似乎并不可靠。同样可疑的是，季节性图显示出一个几乎均匀的周期性重复模式，缺乏噪声。\n\n残差（Resid）显示了在剔除季节性和趋势后，时间序列数据剩余部分的任何模式。实际上，在\
  \ 2020 年之前，由于大部分时间都为零，所以几乎没有任何模式。\n\n对于“ps4”，请参见图 2-6。\n\n![](img/537787_1_En_2_Fig6_HTML.jpg)\n\
  \n4 个时间序列图，分别展示 2016 年 7 月至 2021 年 1 月期间的 `ps4`、趋势、季节性成分和残差。`ps4` 和季节性成分有许多峰值，趋势有一个宽峰，残差则为散点图。\n\
  \n**图 2-6** `ps4` 时间序列的分解\n\n我们可以看到短期（季节性）和长期（趋势）的波动，并伴有一些噪声（残差）。下一步是使用增强迪基-福勒检验（ADF）来统计检验给定的时间序列是否平稳：\n\
  \n```\nfrom pmdarima.arima import ADFTest\nadf_test = ADFTest(alpha=0.05)\nadf_test.should_diff(ps_unstacked[query_col])\n\
  PS4: (0.09760939899434763, True)\nPS5: (0.01, False)\n```\n\n我们可以看到，前面显示的“PS5”的\
  \ p 值大于 0.05，这意味着该时间序列数据不平稳，因此需要进行差分。另一方面，“PS4”的 p 值为 0.01，小于 0.05，表明它是平稳的，不需要进行差分。\n\
  \n所有这些工作的意义在于理解，如果我们手动构建一个预测谷歌搜索趋势的模型，将会使用哪些参数。\n\n#### 拟合你的 SARIMA 模型\n\n由于我们稍后将使用自动化方法来估计最佳拟合模型参数，因此我们不会为\
  \ SARIMA 模型估计参数数量。\n\n为了估计 SARIMA 模型的参数，请注意我们将 `m` 设置为 52，因为一年有 52 周，这也是谷歌趋势中周期的间隔方式。我们还将所有参数初始值设为\
  \ 0，以便让 `auto_arima` 承担繁重的工作，并搜索最适合数据预测的参数值：\n\n```\nps5_s = auto_arima(ps_unstacked['ps4'],\n\
  trace=True,\nm=52, #每个季节有 52 个周期（周数据）\nstart_p=0,\nstart_d=0,\nstart_q=0,\nseasonal=False)\n\
  ```\n\n这将产生以下结果：\n\n```\nPerforming stepwise search to minimize aic\nARIMA(3,0,3)(0,0,0)[0]\
  \             : AIC=1842.301, Time=0.26 sec\nARIMA(0,0,0)(0,0,0)[0]            \
  \ : AIC=2651.089, Time=0.01 sec\nARIMA(1,0,0)(0,0,0)[0]             : AIC=1865.936,\
  \ Time=0.02 sec\nARIMA(0,0,1)(0,0,0)[0]             : AIC=2370.569, Time=0.05 sec\n\
  ARIMA(2,0,3)(0,0,0)[0]             : AIC=1845.911, Time=0.12 sec\nARIMA(3,0,2)(0,0,0)[0]\
  \             : AIC=1845.959, Time=0.16 sec\nARIMA(4,0,3)(0,0,0)[0]            \
  \ : AIC=1838.349, Time=0.34 sec\nARIMA(4,0,2)(0,0,0)[0]             : AIC=1846.701,\
  \ Time=0.22 sec\nARIMA(5,0,3)(0,0,0)[0]             : AIC=1843.754, Time=0.25 sec\n\
  ARIMA(4,0,4)(0,0,0)[0]             : AIC=1842.801, Time=0.27 sec\nARIMA(3,0,4)(0,0,0)[0]\
  \             : AIC=1841.447, Time=0.36 sec\nARIMA(5,0,2)(0,0,0)[0]            \
  \ : AIC=1841.893, Time=0.24 sec\nARIMA(5,0,4)(0,0,0)[0]             : AIC=1845.734,\
  \ Time=0.29 sec\nARIMA(4,0,3)(0,0,0)[0] intercept   : AIC=1824.187, Time=0.82 sec\n\
  ARIMA(3,0,3)(0,0,0)[0] intercept   : AIC=1824.769, Time=0.34 sec\nARIMA(4,0,2)(0,0,0)[0]\
  \ intercept   : AIC=1826.970, Time=0.34 sec\nARIMA(5,0,3)(0,0,0)[0] intercept  \
  \ : AIC=1826.789, Time=0.44 sec\nARIMA(4,0,4)(0,0,0)[0] intercept   : AIC=1827.114,\
  \ Time=0.43 sec\nARIMA(3,0,2)(0,0,0)[0] intercept   : AIC=1831.587, Time=0.32 sec\n\
  ARIMA(3,0,4)(0,0,0)[0] intercept   : AIC=1825.359, Time=0.42 sec\nARIMA(5,0,2)(0,0,0)[0]\
  \ intercept   : AIC=1827.292, Time=0.40 sec\nARIMA(5,0,4)(0,0,0)[0] intercept  \
  \ : AIC=1829.109, Time=0.51 sec\nBest model:  ARIMA(4,0,3)(0,0,0)[0] intercept\n\
  Total fit time: 6.601 seconds\n```\n\n上述输出显示，获得最佳结果的参数是：\n\n```\nPS4: ARIMA(4,0,3)(0,0,0)\n\
  PS5: ARIMA(3,1,3)(0,0,0)\n```\n\n打印模型摘要时，PS5 的估计值会进一步详细说明：\n\n```\nps5_s.summary()\n\
  ```\n\n这将产生以下结果：\n\n![](img/537787_1_En_2_Figl_HTML.jpg)\n\n一张 `ps5` 摘要的截图，包含因变量、模型、日期、时间、样本、观测数、对数似然、AIC、BIC、HQIC\
  \ 以及协方差类型。显示了一个 7 列 9 行的表格。\n\n其原理是，该函数旨在最小化由赤池信息准则（AIC）和贝叶斯信息准则（BIC）衡量的误差概率：\n\n\
  ```\nAIC = -2Log(L) + 2(p + q + k + 1)\n```\n\n其中 `L` 是数据的似然值，如果 `c ≠ 0`，则 `k =\
  \ 1`；如果 `c = 0`，则 `k = 0`。\n\n```\nBIC = AIC + [log(T) - 2] + (p + q + k + 1)\n\
  ```\n\n通过最小化 AIC 和 BIC，我们得到了 `p` 和 `q` 的最佳估计参数。\n\n\n\n#### 测试模型\n\n现在我们已经有了参数，可以开始对两种产品进行预测：\n\
  \n```\nps4_order = ps4_s.get_params()['order']\nps4_seasorder = ps4_s.get_params()['seasonal_order']\n\
  ps5_order = ps5_s.get_params()['order']\nps5_seasorder = ps5_s.get_params()['seasonal_order']\n\
  params = {\n\"ps4\": {\"order\": ps4_order, \"seasonal_order\": ps4_seasorder},\n\
  \"ps5\": {\"order\": ps5_order, \"seasonal_order\": ps5_seasorder}\n}\n```\n\n创建一个空列表来存储预测结果：\n\
  \n```\nresults = []\nfig, axs = plt.subplots(len(X.columns), 1, figsize=(24, 12))\n\
  ```\n\n遍历各列以拟合最佳 SARIMA 模型：\n\n```\nfor i, col in enumerate(X.columns):\narima_model\
  \ = SARIMAX(train_data[col],\norder = params[col][\"order\"],\nseasonal_order =\
  \ params[col][\"seasonal_order\"])\narima_result = arima_model.fit()\n```\n\n进行预测：\n\
  \n```\narima_pred = arima_result.predict(start = len(train_data),\nend = len(X)-1,\
  \ typ=\"levels\")\\\n.rename(\"ARIMA 预测值\")\n```\n\n绘制预测结果：\n\n```\ntest_data[col].plot(figsize\
  \ = (8,4), legend=True, ax=axs[i])\narima_pred.plot(legend = True, ax=axs[i])\n\
  arima_rmse_error = rmse(test_data[col], arima_pred)\nmean_value = X[col].mean()\n\
  results.append((col, arima_pred, arima_rmse_error, mean_value))\nprint(f'列: {col}\
  \ --> RMSE 误差: {arima_rmse_error} - 均值: {mean_value}\\n')\n```\n\n得到如下结果：\n\n```\n\
  Column: ps4 --> RMSE Error: 8.626764032898576 - Mean: 37.83461538461538\nColumn:\
  \ ps5 --> RMSE Error: 27.552818032476257 - Mean: 3.973076923076923\n```\n\n对于 `ps4`，从开始到三月份搜索值开始出现偏差之前，预测都相当准确（图\
  \ 2-7），而 `ps5` 的预测则似乎完全不佳，这并不令人意外。\n\n![](img/537787_1_En_2_Fig7_HTML.jpg)\n\n一张关于\
  \ ps5 和 ARIMA 预测值在 1 月至 6 月间的双折线图。1. 图中的两条线均在 1 月前出现峰值，随后平行下降。2. ARIMA 预测线呈波浪状峰值，而\
  \ ps5 线则趋于平缓。\n\n图 2-7\n\n比较 `ps4` 和 `ps5` 预测值与实际数据的时间序列折线图\n\n预测结果表明，当历史数据足够充分时，模型表现良好，直到数据发生突变（例如\
  \ `PS4` 从三月份开始的情况）。对于 `PS5`，模型几乎从一开始就毫无效果。我们知道这一点是因为 `PS4` 的均方根误差（RMSE）为 8.62，不到\
  \ `PS5` 的 RMSE（27.5）的三分之一，而鉴于 Google Trends 的取值范围为 0 到 100，这相当于 27% 的误差幅度。\n\n####\
  \ 预测未来\n\n现在，我们将基于目前掌握的数据，进行一次鲁莽的未来预测尝试：\n\n```\noos_train_data = ps_unstacked\n\
  oos_train_data.tail()\n```\n\n得到如下结果：\n\n![](img/537787_1_En_2_Figm_HTML.jpg)\n\n\
  一张包含 3 列 5 行的表格截图。列标题为：日期、ps4 和 ps5。行数据从 2021 年 5 月 9 日开始，到 2021 年 6 月 6 日结束。\n\n\
  从上表摘录可以看出，我们现在使用了所有可用数据。接下来，我们将通过以下代码预测未来六个月（定义为 26 周）：\n\n```\noos_results = []\n\
  weeks_to_predict = 26\nfig, axs = plt.subplots(len(ps_unstacked.columns), 1, figsize=(24,\
  \ 12))\n```\n\n再次遍历各列，每次拟合最佳模型：\n\n```\nfor i, col in enumerate(ps_unstacked.columns):\n\
  s = auto_arima(oos_train_data[col], trace=True)\noos_arima_model = SARIMAX(oos_train_data[col],\n\
  order = s.get_params()['order'],\nseasonal_order = s.get_params()['seasonal_order'])\n\
  oos_arima_result = oos_arima_model.fit()\n```\n\n进行预测：\n\n```\noos_arima_pred =\
  \ oos_arima_result.predict(start = len(oos_train_data),\nend = len(oos_train_data)\
  \ + weeks_to_predict, typ=\"levels\").rename(\"ARIMA 预测值\")\n```\n\n绘制预测结果：\n\n\
  ```\noos_arima_pred.plot(legend = True, ax=axs[i])\naxs[i].legend([col]);\nmean_value\
  \ = ps_unstacked[col].mean()\noos_results.append((col, oos_arima_pred, mean_value))\n\
  print(f'列: {col} - 均值: {mean_value}\\n')\n```\n\n以下是输出结果：\n\n\n\n```\nPerforming\
