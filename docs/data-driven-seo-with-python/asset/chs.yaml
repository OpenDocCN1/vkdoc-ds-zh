  \ = getstat_after['snippets'].str.split().str.len()\nafter_length_conds = [\ngetstat_after['token_count']\
  \ == 1,\ngetstat_after['token_count'] == 2,\ngetstat_after['token_count'] > 2,\n\
  ]\ngetstat_after['token_size'] = np.select(after_length_conds, length_vals)\ngetstat_after\n\
  ```\n\n`getstat_after` 是“之后”数据集转换的结果，现已完成，使我们能够进入下一步——对数据进行去重：\n\n![](img/537787_1_En_10_Figd_HTML.jpg)\n\
  \n一个表格展示了包含 9 列 10 行的列表。列标题如下：`search volume`、`rank`、`URL`、`site`、`snippets`、`rank\
  \ profile`、`count`、`token count`和`token size`。各行包含关键词的详细信息。\n\n### 去重\n\n去重的原因是搜索引擎经常在同一\
  \ SERP 中对多个 URL 进行排名。如果你想要评估 SERP 的份额或内容蚕食率（即同一域名的多个 URL 争夺同一排名，最终限制了能达到的最高排名），这没有问题。但在我们的用例中，我们只关心哪些网站排在前面、排名顺序如何以及出现的频率，因此去重是关键。\n\
  \n使用转换后的数据集，我们将按`site`分组，在去重后的数据集中选择并保留排名最高的 URL：\n\n```python\ngetstat_bef_unique\
  \ = getstat_before.sort_values('rank').groupby(['site', 'device', 'keyword']).first()\n\
  getstat_bef_unique = getstat_bef_unique.reset_index()\ngetstat_bef_unique = getstat_bef_unique[getstat_bef_unique['site']\
  \ != '']\ngetstat_bef_unique = getstat_bef_unique.sort_values(['keyword', 'device',\
  \ 'rank'])\ngetstat_bef_unique = getstat_bef_unique[['keyword', 'market', 'phase',\
  \ 'device', 'search_volume',\n'rank', 'url', 'site', 'snippets', 'rank_profile',\
  \ 'count', 'token_count','token_size']]\ngetstat_bef_unique\n```\n\n结果如下：\n\n![](img/537787_1_En_10_Fige_HTML.jpg)\n\
