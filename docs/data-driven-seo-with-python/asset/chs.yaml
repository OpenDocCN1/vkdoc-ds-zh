  \ 74。点击前阶段，股票类别的数值较低，为 5。数值为估算值。\n\n**图 9-7** 按内容细分领域划分的 Google Search Console (GSC)\
  \ 排名位置平均值变更前后的柱状图\n\n因此，流量损失与排名下降之间存在一定的相关性。总体结论是，正如最初所怀疑的那样，自然搜索表现下滑的部分原因是季节性和网站迁移共同作用的结果。\n\
  \n### 诊断\n\n那么，我们看到库存等类别的排名下降了，但原因是什么？为了理解问题所在，我们现在将性能数据与爬取数据合并，以帮助我们诊断问题。我们还将附加细分领域名称，以便按内容区域进行诊断。\n\
  \n在合并之前，选择我们需要的点击量和排名列：\n\n```python\ngsc_before_diag = gsc_before[['url', 'clicks',\
  \ 'segment_two', 'position']]\ngsc_after_diag = gsc_after[['url', 'clicks', 'segment_two',\
  \ 'position']]\n```\n\n现在进行合并，创建一个新的数据框 `gsc_ba_diag`，以便我们比较迁移前后在 URL 级别的性能。\n\n\
  我们使用外连接来捕获迁移前后的所有 URL。如果我们使用左连接（相当于 Excel 中的`vlookup`），Pandas 会默认使用内连接，这意味着我们会遗漏那些迁移后没有数据的\
  \ URL。\n\n```python\ngsc_ba_diag = gsc_before_diag.merge(gsc_after_diag, on = ['url',\
  \ 'segment_two'], how = 'outer')\n```\n\n\n由于前后数据框的列名相同，Pandas 会将其视为非预期情况，并正确判断这些列是不同的，因此会添加后缀\
  \ `_x` 和 `_y`。所以我们将其重命名，使其更便于用户理解：\n\n```\ngsc_ba_diag = gsc_ba_diag.rename(columns\
  \ = {'segment_two': 'segment',\n'clicks_x': 'clicks_before', 'clicks_y': 'clicks_after',\
  \ 'position_x': 'rank_before', 'position_y': 'rank_after' })\n```\n\n合并后，我们预计会看到一些行在迁移前或（更可能）迁移后存在空值的点击数据。因此，我们清理数据，将排名中的“非数字”（NaN）值替换为\
  \ 100，将点击中的 NaN 值替换为 0：\n\n```\ngsc_ba_diag['rank_before'] = np.where(gsc_ba_diag['rank_before'].isnull(),\
  \ 100, gsc_ba_diag['rank_before'])\ngsc_ba_diag['rank_after'] = np.where(gsc_ba_diag['rank_after'].isnull(),\
  \ 100,\ngsc_ba_diag['rank_after'])\ngsc_ba_diag['clicks_before'] = np.where(gsc_ba_diag['clicks_before'].isnull(),\
  \ 0,  gsc_ba_diag['clicks_before'])\ngsc_ba_diag['clicks_after'] = np.where(gsc_ba_diag['clicks_after'].isnull(),\
  \ 0,\ngsc_ba_diag['clicks_after'])\n```\n\n数据已转换为宽格式并清理了空值，现在我们可以计算迁移前后的点击和排名差异，具体操作如下：\n\
  \n```\ngsc_ba_diag['rank_delta'] = gsc_ba_diag['rank_before'] - gsc_ba_diag['rank_after']\n\
  gsc_ba_diag['clicks_delta'] = gsc_ba_diag['clicks_after'] - gsc_ba_diag['clicks_before']\n\
  gsc_ba_diag\n```\n\n结果如下：\n\n![](img/537787_1_En_9_Figbq_HTML.jpg)\n\n一张包含 464 行和\
  \ 8 列的表格截图，展示了阶段变更前 GSC URL 的数据框。列标题分别为 `url`、`clicks_before`、`segment`、`rank_before`、`clicks_after`、`rank_after`、`rank_delta`\
  \ 和 `clicks_delta`。\n\n性能差异数据现已就位，因此我们可以将爬取数据与性能数据合并到一个新的数据框中，恰当地命名为 `perf_crawl`。\n\
  \n由于我们拥有所有需要的 URL，而爬取数据中包含大量不需要的 URL，因此我们将提取所需的 URL（`perf_crawl`），并与 `merge` 函数中指定的爬取数据进行左连接。这相当于\
  \ Excel 中的 `vlookup`，只会合并所需的爬取 URL。\n\n```\nperf_crawl = gsc_ba_diag.merge(audit_urls_map,\
  \ on = 'url', how = 'left')\nperf_crawl = perf_crawl[['url', 'segment', 'clicks_after',\
  \ 'clicks_before', 'clicks_delta', 'crawl_depth',\n'host', 'crawl_source', 'http_status_code',\
  \ 'indexable_status', 'canonical_url',\n'canonical_status', 'redirect_url', 'redirect_url_status_code',\n\
  'final_redirect_url', 'final_redirect_url_status_code', 'urls_with_similar_content',\n\
  'ult_dest_url', 'content_simi']]\nperf_crawl\n```\n\n结果如下：\n\n![](img/537787_1_En_9_Figbr_HTML.png)\n\
  \n一张包含 464 行和 19 列的表格截图，展示了爬取 URL 的数据框。列标题包括 `url`、`segment`、`clicks_after`、`clicks_before`、`clicks_delta`、`crawl_depth`、`host`\
  \ 等。\n\n更多有趣的工作在等着我们，现在我们要对这些 URL 进行诊断。为此，我们将在数据中使用一组条件，当条件满足时，将赋予一个诊断值。这正是你 SEO\
  \ 经验发挥作用的地方，因为你识别模式的能力决定了你将设置如下条件：\n\n```\nperf_diags = perf_crawl.copy()\n```\n\
  \n创建条件列表：\n\n```\nmodifier_conds = [\n(perf_crawl['http_status_code'] == '200')\
  \ & (perf_crawl['crawl_source'] != 'Crawler'),\n(perf_crawl['redirect_url_status_code']\
  \ == '301'),\n(perf_crawl['http_status_code'].isnull()),\nperf_crawl['http_status_code'].isin(['400',\
  \ '403', '404']),\n(perf_diags['canonical_status'] != 'Missing') & (perf_diags['indexable_status']\
  \ == 'Noindex'),\nperf_diags['content_simi'] < 1\n]\n```\n\n创建每个条件对应的赋值列表：\n\n```\n\
  segment_values = ['outside_ia', 'redirect_chain', 'lost_content', 'error', 'robots_conflict',\
  \ 'lost_content']\n```\n\n创建一个新列，并使用 `np.select` 将我们的列表作为参数为其赋值：\n\n```\nperf_diags['diagnosis']\
  \ = np.select(modifier_conds, segment_values, default = 'other')\nperf_diags['diagnosis']\
  \ = np.where((perf_diags['diagnosis'] == 'redirect_chain') & (perf_diags['content_simi']\
  \ < 1),\n'lost_content', perf_diags['diagnosis'])\nperf_diags\n```\n\n结果如下：\n\n\
  ![](img/537787_1_En_9_Figbs_HTML.jpg)\n\n一张表格截图，展示了包含相似内容的 URL 诊断数据框。列标题包括 `final_redirect_url`、`final_redirect_url_status_code`、`urls_with_similar_content`、`ult_dest_url`、`content_simi`\
  \ 和 `diagnosis`。\n\n根据我们刚刚创建的规则，新增了一个 `diagnosis` 列，帮助我们在 URL 层面理解发生了什么。\n\n每个 URL\
  \ 都被标记后，我们可以开始量化诊断结果：\n\n```\ndiagnosis_clicks = perf_diags.groupby('diagnosis').agg({'clicks_delta':\
  \ 'sum'}).reset_index()\ndiagnosis_urls = perf_diags.groupby('diagnosis').agg({'url':\
  \ 'count'}).reset_index()\ndiagnosis_stats = diagnosis_clicks.merge(diagnosis_urls,\
  \ on = 'diagnosis', how = 'left')\ndiagnosis_stats['clicks_pURL'] = (diagnosis_stats['clicks_delta']\
  \ / diagnosis_stats['url']).round(2)\ndiagnosis_stats\n```\n\n结果如下：\n\n![](img/537787_1_En_9_Figbt_HTML.jpg)\n\
  \n一张表格截图，展示了 URL 诊断的数据框。列标题包括 `diagnosis`、`clicks_delta`、`url` 和 `clicks_pURL`。\n\
  \n根据分析，总点击损失中约有 25% 是由错误代码（HTTP 服务器状态 4XX）和内容丢失（URL 重定向到父文件夹）造成的。受影响的 URL 中，大部分是那\
  \ 373 个重定向的 URL，这占了网站的大部分。其他（无 URL）意味着流量损失可能是季节性的和/或迁移错误的间接影响。\n\n如果你想分享你的发现，可以使用以下代码为同事进行可视化：\n\
  \n```\ndiagnosis_plt = (\nggplot(diagnosis_stats,\naes(x = 'reorder(diagnosis, -clicks_delta)',\
  \ y = 'clicks_delta')) +\ngeom_bar(stat = 'identity', alpha = 0.6, position = 'dodge',\
  \ fill = 'blue') +\nposition=position_stack(vjust=0.01)) +\nlabs(y = 'GSC Clicks\
  \ Impact', x = '') +\ncoord_flip() +\ntheme(legend_position = 'right',\naxis_text_x=element_text(rotation=90,\
  \ hjust=1)\n)\n)\ndiagnosis_plt.save(filename = 'images/3_diagnosis_plt.png', height=5,\
  \ width=10, units = 'in', dpi=1000)\ndiagnosis_plt\n```\n\n“其他”（可能是季节性因素）是点击损失的主要原因（图\
  \ 9-8），其次是 `lost_content`（即 URL 重定向）。\n\n![](img/537787_1_En_9_Fig8_HTML.png)\n\n\
  一张水平条形图，展示了会话数与 GSC 点击影响的关系。估计值如下：错误，负 15。内容丢失，负 85。其他，负 298。\n\n**图 9-8** 按技术 SEO\
  \ 诊断分类的 Google Search Console (GSC) 点击影响条形图\n\n但受影响的 URL 数量是多少呢？\n\n```\ndiagnosis_count_dat\
  \ = perf_diags.groupby('diagnosis').agg({'url': 'count'}).reset_index()\nprint(diagnosis_count_dat)\n\
  diagnosis_urlcount_plt = (\nggplot(diagnosis_count_dat,\naes(x = 'reorder(diagnosis,\
