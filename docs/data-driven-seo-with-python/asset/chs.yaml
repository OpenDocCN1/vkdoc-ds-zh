- "# 11. SEO 的未来\n\n将数据科学方法应用于 SEO 的探索，最终会引发关于 SEO 作为一个行业和职业演变的进一步问题。随着付费搜索日益自动化和商品化，SEO\
  \ 是否也会发生同样的情况？为了回答这个问题，让我们回顾一下本书中数据科学如何应用于 SEO，以及自动化的局限性和机遇。\n\n### 聚合\n\n`聚合`是一种数据分析技术，将数据按组级别汇总，例如按内容组统计平均点击次数。在\
  \ Microsoft Excel 中，这可以通过数据透视表实现。`聚合`是可以且应该通过自动化实现的技术。`聚合`已被用于帮助我们理解 SEO 中众多不同的领域（本书已涵盖）。借助提供的代码，这可以集成到基于云的数据管道中，用于\
  \ SEO 应用，以加载数据仓库并驱动仪表板。对于大多数用例，`聚合`已经足够。然而，对于数据的科学探索和假设检验，我们需要考虑数据的分布、变异及其他统计特性。\n\
  \n用于报告和 SEO 咨询中许多分析方面的`聚合`当然可以自动化，并在云端执行。鉴于 Apache 已有的数据管道技术，这相当容易实现。\n\n### 分布\n\
  \n统计分布之所以强大，是因为我们能够理解什么是正常情况，从而识别出任何显著高于或低于性能的数据。我们利用分布来发现增长关键词，即 Google Search\
  \ Console (GSC) 中展示次数超过其排名位置第 95 百分位数的关键词。我们还利用分布来识别网站架构和层级中缺乏内部链接的内容。\n\n这也可以在云端实现自动化，从而可能催生为\
  \ SEO 行业发布的应用，用于自动识别内部链接机会。当然，存在一个轻微的风险，即所有内部链接都纯粹基于分布进行，而未考虑并非针对搜索渠道的内容，这需要成为软件设计的一部分。\n\
  ```\n\n\n### 字符串匹配\n\n使用 Sorensen-Dice 算法的字符串匹配已被应用于帮助将内容与 URL 进行匹配，适用于关键词映射、迁移规划等用例。由于该算法相对快速且扩展性良好，结果尚可，但它首先依赖于描述性的\
  \ URL 和标题标签。它还依赖于预处理，例如在应用字符串匹配之前移除 URL 的网站域名部分，这很容易自动化。较难处理的是，需要人为判断标题和 URL 别名在多大程度上相似才算良好匹配。阈值应该设为\
  \ 70%、83% 还是 92%？\n\n这不太容易，并且可能需要某种形式的 AI 进行自我学习，更具体地说，是循环神经网络（RNN）。当然，这并非不可能，因为你需要确定一个衡量结果好坏的指标，才知道如何训练模型。此外，你至少需要一百万个数据点来训练模型。\n\
  \n关键词映射的一个关键问题是：“对于搜索 X 关键词的用户来说，哪个 URL 是最佳的衡量指标是什么？”RNN 在这里可能很有用，因为它可以从排名靠前的 SERP\
  \ 内容中学习，将其简化为一个对象，然后将网站内容与该对象进行比较，从而将关键词映射到 URL。\n\n对于将已失效的 URL（带有反向链接）重定向到返回 200\
  \ HTTP 响应的有效 URL，这可能更直接，不需要 AI。你可以使用基于决策树的算法，利用用户行为来确定最佳的替换 URL，也就是说，在可用的其他 URL\
  \ 选项中，“URL A”上的用户总是会前往 URL X。\n\n非 AI 解决方案不依赖于数百万的 SERP 或互联网数据，因此在内部构建成本（相对）较低。另一方面，基于\
  \ AI 的解决方案很可能要么作为 SaaS 构建，要么由像亚马逊、Quora 或 Tripadvisor 这样依赖自然流量的超大型企业品牌构建。\n\n###\
  \ 聚类\n\n在本书中，聚类被用于通过大规模比较搜索结果来确定搜索意图。其原理基于比较数据点之间的距离，当距离相对较小时，就存在一个聚类。本书未采用词干提取，因为尽管它速度快，但缺乏所需的精度。\n\
  \n聚类不仅有助于理解关键词，还有助于对关键词进行分组以报告性能，以及对内容进行分组以设置网站层级结构。作为 SEO 专家，你的想象力就是极限。SEO 市场中已经存在通过比较搜索结果来根据搜索意图对关键词进行聚类的应用，因此\
  \ Artios、Keyword Insights、Keyword Cupid、SEO Scout 等公司已经可以在云端实现自动化。\n\n### 机器学习建模\n\
  \n试图理解自然搜索中的运作方式是 SEO 的诸多乐趣和考验之一，尤其是在当前谷歌更新的时代。机器学习辅助建模在这方面有所帮助，因为你实际上是将数据输入到机器学习算法中，它会显示出算法更新背后最具影响力的因素。\n\
  \n机器学习模型当然可以部署到云端，作为自动化应用的一部分，用于突出显示最具影响力的 SERP 因素和反向链接的质量，作为更广泛的仪表盘智能系统或独立应用的一部分。\n\
  \n由于不需要神经网络，构建和部署的成本相对较低，这使得 SEO 专业人员能够专注于理解模型输出以及如何应用它们。\n\n### 集合论\n\n集合论是指我们比较数据集（可以理解为列表），例如关键词，并将它们与另一个集合进行比较。这可以用来查看两个数据集之间的差异。它被用于内容差距分析，以找到共同的关键词（即两个网站关键词的交集），并找到目标网站与核心关键词集之间的差距。\n\
  \n这相当直接，并且可以使用 SEMRush 和 AHREFs 等工具轻松实现自动化。那么为什么还要用 Python 来做呢？因为它是免费的，并且让你对所需的交集程度有更多控制。\n\
  \n确定完美的交集程度则不那么明确，因为这需要研究和开发来确定所需的交集程度，而这又取决于被取交集网站的数量。\n\n然而，关键在于首先要知道将哪些竞争对手纳入集合中，这对于机器来说可能不太容易辨别。\n\
  \n### 计算机能做什么和不能做什么\n\n从上述内容中，我们看到了一个共同模式，即当涉及到诸如响应统计属性或基于数值模式做出决策等直接任务时，计算机表现出色（尽管需要一些数据清理和准备工作）。\n\
  \n当问题有些模糊且需要解释（例如语言）时，计算机仍然可以应对挑战，但这需要大量的资源来获取数据和训练 AI 模型。\n\n### 给 SEO 专家的话\n\n\
  我们应该学习用于数据分析的 Python，因为这是我们生成见解和相应建议的方式。不利用技术和数据科学思维来解决 SEO 问题是没有道理的，尤其是当 SERP 由一个一致（因此更可预测）的算法决定时。\n\
  \n学习 Python 和数据科学不仅有助于让你的 SEO 职业生涯面向未来，还能让你更深入地理解搜索引擎的工作原理（鉴于它们是数学化的），并使你能够投入更多的时间和精力来定义要测试的假设并创建\
  \ SEO 解决方案。花更少的时间收集和分析数据，花更多的时间响应数据，这才是当下的要务。\n\n在指定云应用（无论是报告、自动化还是其他方面）时，你也能更好地与软件工程师合作。\n\
  \n当然，创造力源于知识，因此你对 SEO 了解得越多，你就越能向数据提出更好的问题，从而产生更好的见解和更有针对性的建议。\n\n## 总结\n\n在本章中，我们从非常高的层面整合了用于使\
  \ SEO 数据驱动化的思路和技术：\n\n*   聚合\n*   分布\n*   字符串匹配\n*   聚类\n*   机器学习建模\n*   集合论\n\n\
