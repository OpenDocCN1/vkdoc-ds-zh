  \ 0, 0, 0]],\n        ...\n```\n\n得到的结果符合预期。\n\n## 使用 SLP 进行学习与预测\n\n现在你已经了解了如何使用\
  \ TensorFlow 获取训练集、测试集和验证集，是时候使用神经网络进行分析了，这与你在第 9 章使用的方法非常相似。让我们从一个单层感知器（SLP）开始。\n\
  \n首先定义一个模型，它包含一个具有十个输出的单稠密层，这十个输出对应于 0 到 9 的十个数字，也对应于待识别手写数字的十个类别。在这个单层之上，你将添加两个层：`Normalization`和`Flatten`。前者将图像的像素值从\
  \ 0 到 255 归一化到 0 到 1 的范围，后者将 28x28 图像的二维数组转换为一维数组。\n\n\n```python\nmodel = tf.keras.Sequential([\n\
  \    tf.keras.layers.Normalization(),\n    tf.keras.layers.Flatten(input_shape=(28,\
  \ 28)),\n    tf.keras.layers.Dense(10, activation='sigmoid')\n])\n```\n\n在模型定义完成后，您可以对其进行编译，设置`Adam`为优化器，并将`sparse_categorical_crossentropy`作为损失函数。随后，使用\
  \ 20 个周期（epochs）开始训练模型。\n\n```python\nmodel.compile(\n    optimizer='adam',\n  \
  \  loss='sparse_categorical_crossentropy',\n    metrics=['accuracy'])\nh = model.fit(train_features,\
  \ train_labels, epochs=20)\n```\n\n输出：\n```\nEpoch 1/20\n1719/1719 [==============================]\
  \ - 3s 1ms/step - loss: 10.6817 - accuracy: 0.8341\nEpoch 2/20\n1719/1719 [==============================]\
  \ - 2s 1ms/step - loss: 6.1368 - accuracy: 0.8759\nEpoch 3/20\n1719/1719 [==============================]\
  \ - 3s 2ms/step - loss: 5.7782 - accuracy: 0.8798\nEpoch 4/20\n1719/1719 [==============================]\
  \ - 3s 1ms/step - loss: 5.5405 - accuracy: 0.8824\nEpoch 5/20\n1719/1719 [==============================]\
  \ - 2s 1ms/step - loss: 5.4812 - accuracy: 0.8840\nEpoch 6/20\n1719/1719 [==============================]\
  \ - 2s 1ms/step - loss: 5.3873 - accuracy: 0.8851\nEpoch 7/20\n1719/1719 [==============================]\
  \ - 2s 1ms/step - loss: 5.3120 - accuracy: 0.8861\n...\n```\n\n现在，通过图形监控损失（loss）的趋势，来检查`history`中的学习阶段。\n\
  \n```python\nacc_set = h.history['loss']\nepoch_set = h.epoch\nplt.plot(epoch_set,\
  \ acc_set, 'o', label='Training phase')\nplt.ylabel('loss')\nplt.xlabel('epoch')\n\
