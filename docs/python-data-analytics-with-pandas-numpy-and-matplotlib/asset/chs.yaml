  \n十个散点图和折线图绘制了糖尿病数据集中的十个生理因素。所有图中的拟合线均呈上升趋势，但图 1 中的拟合线呈下降趋势。所有图中的散点分布在拟合线周围及其附近。\n\
  \n**图 8-11** 十个线性图表，显示生理因素与糖尿病进展之间的相关性\n\n## 支持向量机 (SVM)\n\n*支持向量机* 是一系列机器学习技术，最初由\
  \ Vapnik 及其同事在 90 年代初于 AT&T 实验室开发。这类方法的基础实际上是一种名为 *支持向量* 的算法，它是早期算法 *广义肖像* 的泛化，该算法于\
  \ 1963 年同样由 Vapnik 在俄罗斯开发。\n\n简单来说，SVM 分类器是二元或判别模型，作用于两个类别的区分。其主要任务基本上是区分新观测值属于两个类别中的哪一个。在学习阶段，这些分类器将观测值投影到一个称为\
  \ *决策空间* 的多维空间中，并构建一个称为 *决策边界* 的分隔面，将该空间划分为两个归属区域。在最简单的情况下，即线性情况下，决策边界将由一个平面（在三维空间中）或一条直线（在二维空间中）表示。在更复杂的情况下，分隔面是具有越来越复杂形状的曲面。\n\
  \n对于 SVM 也是如此，数据点分布在一个多维空间中，每个轴对应特定特征值的分布。SVM 的目的是找到一个超平面，将空间分隔成两个类别（见图 8-12）。\n\
  \n![](img/336498_3_En_8_Fig12_HTML.jpg)\n\n特征 2 与特征 1 的散点图和折线图。图中包含一条斜线，将类别 A 和\
  \ B 分开。线上方的点代表类别 A，线下方的点代表类别 B。它们分别形成聚集区域。\n\n**图 8-12** SVM 将决策空间划分为两个区域，每个类别一个区域，并定义一条直线（决策边界）\n\
  \n所定义的直线不能仅限于将两个类别的点彼此分开，还必须满足特定要求。SVM 会找到距离分割线最近的点。这些点被称为“支持向量”，该算法也因此得名（见图 8-13）。\n\
  \n![](img/336498_3_En_8_Fig13_HTML.jpg)\n\n特征 2 与特征 1 的散点图与折线图。图中包含一条标记为“决策边界”的斜线，将类别\
  \ A 与 B 分开。到该直线距离最近的两个类别的点即为支持向量。间隔是支持向量之间的距离。\n\n**图 8-13** SVM 优化决策边界，最大化支持向量点之间的间隔\n\
  \n支持向量与决策边界（直线）之间的距离称为间隔。SVM 的任务是最大化这个间隔。当间隔达到最大值时，决策边界即为最优。\n\nSVM 是一种非常灵活的技术，适用于许多应用场景。它既可以用于回归，即\
  \ *SVR（支持向量回归）*，也可以用于分类，即 *SVC（支持向量分类）*。\n\n\n\n### 支持向量分类（SVC）\n\n如果你想更好地理解此算法的工作原理，可以从最简单的情况入手，即线性二维情况，其中决策边界是一条将决策区域一分为二的直线。以一个简单的训练集为例，该训练集中有一些点被分配到两个不同的类别。该训练集将包含\
  \ 11 个点（观测值），这些点具有两个不同属性，其值介于 0 到 4 之间。这些值将存储在一个名为`x`的 NumPy 数组中。这些点所属的类别（两个类别之一）由另一个名为`y`的数组中的\
  \ 0 或 1 值定义。\n\n通过散点图可视化这些点在空间中的分布，该空间随后将被定义为决策空间（见图 8-14）。\n\n![](img/336498_3_En_8_Fig14_HTML.png)\n\
  \n一张散点图在分布空间中绘制了两个不同类别的点。这两个类别的近似点如下所示：\n1.  (1.0, 2)、(1.0, 1.50)、(1.0, 3)、(1.5,\
  \ 2)、(2, 3) 和 (2.5, 1.5)\n2.  (2.0, 1.0)、(3.0, 1.0)、(3.5, 1.0)、(3.0, 2.00)、(3.0,\
  \ 2.00) 和 (3.5, 3.00)\n\n**图 8-14** 训练集的散点图展示了决策空间\n\n```\nimport numpy as np\n\
  import matplotlib.pyplot as plt\nfrom sklearn import svm\nx = np.array([[1,3],[1,2],[1,1.5],[1.5,2],[2,3],[2.5,1.5],\n\
  [2,1],[3,1],[3,2],[3.5,1],[3.5,3]])\ny = [0]*6 + [1]*5\nplt.scatter(x[:,0],x[:,1],c=y,s=50,alpha=0.9)\n\
  ```\n\n现在，您已经定义了训练集，可以应用 SVC（支持向量分类）算法了。该算法将创建一条直线（决策边界），以便将决策区域分成两部分（见图 8-15），这条直线将被放置的位置会使得训练集中最近观测值之间的距离最大化。这个条件应产生两个不同的部分，同一类别的所有点都应包含在其中。\n\
  \n接着，您将 SVC 算法应用于该训练集。为此，首先使用`SVC()`构造函数定义模型，并将内核设置为线性。（*内核*是用于模式分析的一类算法。）然后，您使用`fit()`函数，并将训练集作为参数传递给它。模型训练完成后，您可以使用`decision_function()`函数绘制决策边界。然后，您绘制散点图，并为决策空间的两个部分提供不同的颜色。\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import\
  \ svm\nx = np.array([[1,3],[1,2],[1,1.5],[1.5,2],[2,3],[2.5,1.5],\n[2,1],[3,1],[3,2],[3.5,1],[3.5,3]])\n\
  y = [0]*6 + [1]*5\nsvc = svm.SVC(kernel='linear').fit(x,y)\nX,Y = np.mgrid[0:4:200j,0:4:200j]\n\
  Z = svc.decision_function(np.c_[X.ravel(),Y.ravel()])\nZ = Z.reshape(X.shape)\n\
  plt.contourf(X,Y,Z > 0,alpha=0.1)\nplt.contour(X,Y,Z,colors=['k'], linestyles=['-'],levels=[0])\n\
  plt.scatter(x[:,0],x[:,1],c=y,s=50,alpha=0.9)\n```\n\n在图 8-15 中，您可以看到包含两个类别的两个部分。可以说划分是成功的，除了浅色部分中有一个暗点。\n\
  \n![](img/336498_3_En_8_Fig15_HTML.png)\n\n一个散点与区域图展示了两个不同类别的决策边界。代表决策边界的直线在 (1.25,\
  \ 0) 和 (3.25, 4.0) 之间延伸。属于第一类的点 (2.5, 1.25) 被绘制在了第二类区域中。数值为近似值。\n\n**图 8-15** 决策区域被分成两部分\n\
  \n一旦模型训练完毕，就很容易理解预测是如何进行的。从图形上看，根据新观测值所处的位置，您将知道它属于两个类别中的哪一个。\n\n相反，从更程序化的角度来看，`predict()`函数将返回其对应所属类别的编号（`0`\
  \ 表示蓝色类别，`1` 表示红色类别）。\n\n```\nsvc.predict([[1.5,2.5]])\nOut[ ]: array([0])\nsvc.predict([[2.5,1]])\n\
  Out[ ]: array([1])\n```\n\nSVC 算法中的一个相关概念是*正则化*。它由`C`参数设置，较小的`C`值意味着使用分离线周围许多或所有观测值来计算间隔（更强的正则化），而较大的`C`值意味着使用靠近分离线的观测值来计算间隔（更弱的正则化）。除非另有说明，`C`的默认值等于`1`。您可以通过`support_vectors`数组来标识并高亮参与间隔计算的这些点。\n\
  \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import\
  \ svm\nx = np.array([[1,3],[1,2],[1,1.5],[1.5,2],[2,3],[2.5,1.5],\n[2,1],[3,1],[3,2],[3.5,1],[3.5,3]])\n\
  y = [0]*6 + [1]*5\nsvc = svm.SVC(kernel='linear',C=1).fit(x,y)\nX,Y = np.mgrid[0:4:200j,0:4:200j]\n\
  Z = svc.decision_function(np.c_[X.ravel(),Y.ravel()])\nZ = Z.reshape(X.shape)\n\
  plt.contourf(X,Y,Z > 0,alpha=0.1)\nplt.contour(X,Y,Z,colors=['k','k','k'], linestyles=['--','-','--'],levels=[-1,0,1])\n\
  plt.scatter(svc.support_vectors_[:,0],svc.support_vectors_[:,1],s=120,facecolors='r')\n\
  plt.scatter(x[:,0],x[:,1],c=y,s=50,alpha=0.9)\n```\n\n这些点在散点图中由带圆圈的标记表示。此外，它们将位于分离线附近的一个评估区域内（参见图\
  \ 8-16 中的虚线）。\n\n![](img/336498_3_En_8_Fig16_HTML.png)\n\n一个散点与区域图绘制了具有较大 C 值时的点数。决策边界的直线在\
  \ (1.25, 0) 和 (3.25, 4.0) 之间延伸。一条斜线穿过第一类中的 (1.25, 2) 和 (2, 3) 点。另一条斜线穿过第二类中的 (3,\
  \ 1.7) 和 (3.5, 3) 点。\n\n**图 8-16** 参与计算的点数取决于 C 参数\n\n为了观察对决策边界的影响，您可以将值限制为 `C =\
  \ 0.1`。看看将有多少点被纳入考虑。\n\n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
  from sklearn import svm\nx = np.array([[1,3],[1,2],[1,1.5],[1.5,2],[2,3],[2.5,1.5],\n\
  [2,1],[3,1],[3,2],[3.5,1],[3.5,3]])\ny = [0]*6 + [1]*5\nsvc = svm.SVC(kernel='linear',C=0.1).fit(x,y)\n\
  X,Y = np.mgrid[0:4:200j,0:4:200j]\nZ = svc.decision_function(np.c_[X.ravel(),Y.ravel()])\n\
  Z = Z.reshape(X.shape)\nplt.contourf(X,Y,Z > 0,alpha=0.1)\nplt.contour(X,Y,Z,colors=['k','k','k'],\
  \ linestyles=['--','-','--'],levels=[-1,0,1])\nplt.scatter(svc.support_vectors_[:,0],svc.support_vectors_[:,1],s=120,facecolors='w')\n\
  plt.scatter(x[:,0],x[:,1],c=y,s=50,alpha=0.9)\n```\n\n被纳入考虑的点数增加了，因此分离线（决策边界）的方向发生了改变。但现在有两个点位于错误的决策区域中（参见图\
  \ 8-17）。\n\n![](img/336498_3_En_8_Fig17_HTML.png)\n\n一个散点与区域图绘制了当 C = 0.1 时的点数。决策边界的直线在\
  \ (1.80, 0) 和 (3, 4.0) 之间延伸。一条斜线穿过第一类中的 (1.0, 2.0) 点。另一条斜线穿过 (3.5, 1.0) 点。数值为近似值。\n\
  \n**图 8-17** 当 C 减小时，参与计算的点数会增加\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 非线性 SVC\n\n到目前为止，你已经看到了 SVC 线性算法，它定义了一条旨在分割两个类别的分隔线。还存在更复杂的 SVC 算法，它们基于相同的原理（即最大化与表面最近的点之间的距离）来建立曲线（2D）或曲面（3D）。本节将研究使用多项式核的系统。\n\
  \n顾名思义，你可以定义一个多项式曲线，将决策区域划分为两部分。多项式的次数可以通过 `degree` 选项来定义。即使在这种情况下，`C` 是正则化系数。尝试应用一个采用三次多项式核且\
  \ `C` 系数等于 `1` 的 SVC 算法。\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nfrom sklearn import svm\nx = np.array([[1,3],[1,2],[1,1.5],[1.5,2],[2,3],[2.5,1.5],\n\
  [2,1],[3,1],[3,2],[3.5,1],[3.5,3]])\ny = [0]*6 + [1]*5\nsvc = svm.SVC(kernel='poly',C=1,\
  \ degree=3).fit(x,y)\nX,Y = np.mgrid[0:4:200j,0:4:200j]\nZ = svc.decision_function(np.c_[X.ravel(),Y.ravel()])\n\
  Z = Z.reshape(X.shape)\nplt.contourf(X,Y,Z > 0,alpha=0.1)\nplt.contour(X,Y,Z,colors=['k','k','k'],\
  \ linestyles=['--','-','--'],levels=[-1,0,1])\nplt.scatter(svc.support_vectors_[:,0],svc.support_vectors_[:,1],s=120,facecolors='w')\n\
  plt.scatter(x[:,0],x[:,1],c=y,s=50,alpha=0.9)\n```\n\n你将得到如图 8-18 所示的情况。\n\n![](img/336498_3_En_8_Fig18_HTML.png)\n\
  \n一张散点与区域图绘制了多项式核的决策边界。它包括一条将决策区域划分为两部分的多项式曲线。两部分以不同的阴影显示。它包括两条虚线曲线，用于最大化最近点到表面的距离。\n\
  \n**图 8-18** 使用带有多项式核的 SVC 的决策空间\n\n另一种类型的非线性核是*径向基函数 (RBF)*。在这种情况下，分隔曲线倾向于相对于训练集的观测点来径向定义区域。\n\
  \n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import\
  \ svm\nx = np.array([[1,3],[1,2],[1,1.5],[1.5,2],[2,3],[2.5,1.5],\n[2,1],[3,1],[3,2],[3.5,1],[3.5,3]])\n\
  y = [0]*6 + [1]*5\nsvc = svm.SVC(kernel='rbf', C=1, gamma=3).fit(x,y)\nX,Y = np.mgrid[0:4:200j,0:4:200j]\n\
  Z = svc.decision_function(np.c_[X.ravel(),Y.ravel()])\nZ = Z.reshape(X.shape)\n\
  plt.contourf(X,Y,Z > 0,alpha=0.1)\nplt.contour(X,Y,Z,colors=['k','k','k'], linestyles=['--','-','--'],levels=[-1,0,1])\n\
  plt.scatter(svc.support_vectors_[:,0],svc.support_vectors_[:,1],s=120,facecolors='w')\n\
  plt.scatter(x[:,0],x[:,1],c=y,s=50,alpha=0.9)\n```\n\n在图 8-19 中，你可以看到决策的两个部分，并且训练集的所有点都正确地定位在其中。\n\
  \n![](img/336498_3_En_8_Fig19_HTML.png)\n\n一张散点与区域图绘制了带有训练集观测点的决策部分。它由两个不同阴影的部分组成。训练集的点用虚线圆圈定位。\n\
  \n**图 8-19** 使用带有 RBF 核的 SVC 的决策区域\n\n### 使用鸢尾花数据集绘制不同的 SVM 分类器\n\n刚才看到的 SVM 示例基于一个非常简单的数据集。本节将针对使用\
  \ SVC 的分类问题使用更复杂的数据集。事实上，它将使用之前用过的数据集：鸢尾花数据集。\n\n之前使用的 SVC 算法从只包含两个类别的训练集中学习。在这种情况下，您将把案例扩展到三个分类，因为鸢尾花数据集被分为三个类别，对应于三种不同的花卉。\n\
  \n在这种情况下，决策边界相互交叉，将决策区域（2D）或决策体积（3D）细分为多个部分。\n\n线性模型都具有线性决策边界（相交的超平面），而具有非线性核（多项式或高斯\
  \ RBF）的模型则具有非线性决策边界。这些边界更加灵活，其形状取决于核的类型及其参数。\n\n```python\nimport numpy as np\n\
  import matplotlib.pyplot as plt\nfrom sklearn import svm, datasets\niris = datasets.load_iris()\n\
  x = iris.data[:,:2]\ny = iris.target\nh = .05\nsvc = svm.SVC(kernel='linear',C=1.0).fit(x,y)\n\
  x_min,x_max = x[:,0].min() - .5, x[:,0].max() + .5\ny_min,y_max = x[:,1].min() -\
  \ .5, x[:,1].max() + .5\nh = .02\nX, Y = np.meshgrid(np.arange(x_min, x_max, h),\
  \ np.arange(y_min,y_max,h))\nZ = svc.predict(np.c_[X.ravel(),Y.ravel()])\nZ = Z.reshape(X.shape)\n\
  plt.contourf(X,Y,Z,alpha=0.1)\nplt.contour(X,Y,Z,colors='k')\nplt.scatter(x[:,0],x[:,1],c=y)\n\
  ```\n\n在图 8-20 中，决策空间被决策边界分割成了三个部分。\n\n![](img/336498_3_En_8_Fig20_HTML.png)\n\n\
  一张散点与区域图绘制了被分割成三个部分的决策边界，并带有数据点簇。线性和非线性模型由相应的决策边界分隔。\n\n**图 8-20** 决策边界将决策区域划分为三个不同的部分\n\
  \n现在是时候应用非线性核来生成非线性决策边界了，例如多项式核。\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nfrom sklearn import svm, datasets\niris = datasets.load_iris()\nx = iris.data[:,:2]\n\
  y = iris.target\nh = .05\nsvc = svm.SVC(kernel='poly',C=1.0,degree=3).fit(x,y)\n\
  x_min,x_max = x[:,0].min() - .5, x[:,0].max() + .5\ny_min,y_max = x[:,1].min() -\
  \ .5, x[:,1].max() + .5\nh = .02\nX, Y = np.meshgrid(np.arange(x_min, x_max, h),\
  \ np.arange(y_min,y_max,h))\nZ = svc.predict(np.c_[X.ravel(),Y.ravel()])\nZ = Z.reshape(X.shape)\n\
  plt.contourf(X,Y,Z,alpha=0.1)\nplt.contour(X,Y,Z,colors='k')\nplt.scatter(x[:,0],x[:,1],c=y)\n\
  ```\n\n图 8-21 展示了多项式决策边界与线性情况相比，如何以截然不同的方式分割区域。\n\n![](img/336498_3_En_8_Fig21_HTML.jpg)\n\
  \n一张散点与区域图绘制了多项式决策边界。它包括三度。其中一个度形成了一个独立的簇。决策边界被划分为三个区域，每个区域有不同的阴影。\n\n**图 8-21**\
  \ 即使在多项式情况下，三个部分也几乎保持不变\n\n现在你可以应用 RBF 核来观察区域分布上的差异。只需在 `svm.SVC()` 函数中将内核值更新为 `rbf`\
  \ 即可。\n\n```python\nsvc = svm.SVC(kernel='rbf', gamma=3, C=1.0).fit(x,y)\n```\n\n\
  图 8-22 展示了 RBF 核如何生成径向区域。\n\n![](img/336498_3_En_8_Fig22_HTML.png)\n\n一张散点与区域图绘制了径向决策边界。它被分为三个区域，具有不同的阴影。两个度各自形成了独立的簇，并带有各自的决策边界。\n\
  \n**图 8-22** RBF 核定义了径向决策区域\n\n\n\n### 支持向量回归（SVR）\n\n`SVC()` 方法可以扩展用来解决回归问题。这种方法被称为*支持向量回归*。\n\
  \n由 `SVC()` 生成的模型实际上并不依赖完整的训练集，而仅使用了部分元素，即那些最接近决策边界的元素。类似地，由 `SVR()` 生成的模型也仅依赖于训练集的一个子集。\n\
  \n本节演示了 `SVR` 算法如何使用你在本章中见过的糖尿病数据集。作为示例，它仅引用了第三项生理数据。该算法执行了三种不同的回归：一种线性回归和两种非线性（多项式）回归。线性情况会产生一条直线，因为线性预测模型与之前见过的线性回归非常相似，而多项式回归是基于二次和三次构建的。`SVR()`\
  \ 函数与之前见过的 `SVC()` 函数几乎完全相同。\n\n唯一需要考虑的是，测试数据集必须按升序排序。\n\n```python\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\nfrom sklearn import svm\nfrom sklearn\
  \ import datasets\ndiabetes = datasets.load_diabetes()\nx_train = diabetes.data[:-20]\n\
  y_train = diabetes.target[:-20]\nx_test = diabetes.data[-20:]\ny_test = diabetes.target[-20:]\n\
  x0_test = x_test[:,2]\nx0_train = x_train[:,2]\nx0_test = x0_test[:,np.newaxis]\n\
  x0_train = x0_train[:,np.newaxis]\nx0_test.sort(axis=0)\nx0_test = x0_test*100\n\
  x0_train = x0_train*100\nsvr = svm.SVR(kernel='linear',C=1000)\nsvr2 = svm.SVR(kernel='poly',C=1000,degree=2)\n\
  svr3 = svm.SVR(kernel='poly',C=1000,degree=3)\nsvr.fit(x0_train,y_train)\nsvr2.fit(x0_train,y_train)\n\
  svr3.fit(x0_train,y_train)\ny = svr.predict(x0_test)\ny2 = svr2.predict(x0_test)\n\
  y3 = svr3.predict(x0_test)\nplt.scatter(x0_test,y_test,color='k')\nplt.plot(x0_test,y,color='b')\n\
  plt.plot(x0_test,y2,c='r')\nplt.plot(x0_test,y3,c='g')\n```\n\n三条回归曲线用三种颜色表示。线性回归为蓝色（直线）；二次多项式（向上凹的曲线，即抛物线）为红色；三次多项式为绿色（见图\
  \ 8-23）。\n\n![](img/336498_3_En_8_Fig23_HTML.png)\n\n散点图和线图绘制了糖尿病的测试数据集。它包含三种不同的回归：一种线性回归和两种多项式回归。这三条曲线以不同颜色区分。两条多项式曲线代表了二次和三次多项式。散点分布在重叠线条的内部和周围。\n\
  \n**图 8-23** 从训练集出发，三条回归曲线产生了截然不同的趋势\n\n## 结论\n\n在本章中，你看到了使用 `scikit-learn` 库解决回归和分类问题的简单案例。通过一些实际示例，我们以实践的方式介绍了预测模型验证阶段的许多概念。\n\
  \n在下一章中，你将看到一个完整的案例，通过一个实际示例讨论数据分析的所有步骤。所有内容均在 IPython Notebook 中实现，这是一个交互式且创新的环境，非常适合分享数据分析的每一步。它包含交互式文档，可用作报告或网络演示。\n\
  \n"
- "# 9. 深度学习与 TensorFlow\n\n本章概述了深度学习的世界及其技术所依托的人工神经网络。此外，在用于深度学习的 Python 框架中，你将使用\
  \ *TensorFlow*，它是研究和开发深度学习分析技术的绝佳工具。借助这个库，你将了解如何开发构成深度学习基础的不同神经网络模型。特别是在本第三版中，解释和示例代码基于新的\
  \ TensorFlow 2.x 版本，该版本整合了 Keras，并对模块和实现范式进行了彻底的革新。\n\n## 人工智能、机器学习和深度学习\n\n对于任何从事数据分析领域的人来说，这三个术语在互联网、文本以及与此主题相关的研讨会上都非常常见。但它们之间是什么关系？它们实际上又包含什么内容？\n\
  \n在本节中，你将阅读到这三个术语的详细定义。你将了解到，在近几十年里，为了创建越来越复杂的算法，并能够越来越高效地进行预测和数据分类，机器学习是如何应运而生的。然后，你将了解到，由于新的技术创新，特别是\
  \ GPU 计算能力的实现，基于神经网络的深度学习技术是如何被开发出来的。\n\n### 人工智能\n\n*人工智能* 一词最早由约翰·麦卡锡在 1956 年提出，当时技术世界充满了巨大的希望和热情。那是在电子学和像整个房间一样大的计算机的黎明时期，它们只能做几项简单的计算，但与人类相比，它们做得高效且快速。当时人们已经预见了电子智能未来可能的发展。\n\
  \n但无需深入科幻小说的世界，当前最适合人工智能（常被称为 AI）的定义，可以简要概括为以下这句话：\n\n> *计算机能够自动执行那些看似仅与人类智能相关的操作。*\n\
  \n因此，人工智能的概念是一个动态的概念，它随着机器本身的进步以及“人类专属”概念的变化而变化。在 60 年代和 70 年代，我们将人工智能视为计算机执行计算和寻找复杂问题数学解决方案的能力，这些问题是“伟大科学家专属的”。而在\
  \ 80 年代和 90 年代，AI 在评估风险、资源和决策方面的能力得以成熟。到了 2000 年，随着计算机计算潜力的持续增长，这些系统通过机器学习进行学习的可能性也被添加到定义中。\n\
  \n最后，在最近几年，人工智能的概念聚焦于视觉和听觉识别操作，而这些操作直到最近还被认为是“人类专属的”。\n\n这些操作包括：\n\n*   图像识别\n*\
  \   目标检测\n*   目标分割\n*   语言翻译\n*   自然语言理解\n*   语音识别\n\n得益于深度学习技术，这些问题仍在研究中。\n\n###\
  \ 机器学习是人工智能的一个分支\n\n在上一章中，你已经详细了解了机器学习，其中包含了许多用于分类或预测数据的不同技术的示例。\n\n*机器学习（ML）*，连同其所有的技术和算法，是人工智能的一个庞大分支。事实上，当你使用能够学习（学习系统）来解决各种不久前还被“认为是人类专属”的问题时，你就在引用它，同时仍处于人工智能的范畴内。\n\
  \n\n\n### 深度学习是机器学习的一个分支\n\n在机器学习技术中，可以进一步定义一个子类，称为深度学习。你在第 8 章中看到，机器学习使用的系统能够学习，这可以通过系统内部的特性（通常是固定模型的参数）来实现，这些特性会响应于旨在用于学习（训练集）的输入数据而进行修改。\n\
  \n深度学习技术则向前迈进了一步。实际上，深度学习系统的结构设计使得这些内在特征并非预先存在于模型中，而是由系统在学习过程中自动提取和检测。在能够做到这一点的系统中，本章特别指的是人工神经网络。\n\
  \n### 人工智能、机器学习与深度学习间的关系\n\n总而言之，在本节中，你已经了解到机器学习和深度学习实际上是人工智能的子类。图 9-1 直观地展示了这些类别之间的关系。\n\
  \n![](img/336498_3_En_9_Fig1_HTML.png)\n\n一幅三个椭圆嵌套在一起的示意图。从最内层到最外层的椭圆，标签依次为：深度学习、机器学习、人工智能。\n\
  \n图 9-1\n\n人工智能、机器学习与深度学习间的关系示意图\n\n## 深度学习\n\n在本节中，你将了解促成深度学习发展的一些关键因素，并看到在最近几年里取得了哪些重大进展。\n\
  \n### 神经网络与 GPU\n\n在上一节中，你了解到在人工智能领域，深度学习直到最近几年才流行起来，正是为了解决视觉和听觉识别问题。\n\n在深度学习的背景下，近年来开发了许多计算技术和算法，充分发挥了\
  \ `Python` 语言的潜力。但深度学习的理论基础实际上可以追溯到多年前。事实上，神经网络的概念是在 1943 年被提出的，而关于人工神经网络及其应用的首批理论研究则是在\
  \ 20 世纪 60 年代发展起来的。\n\n事实是，直到最近几年，神经网络及其相关的深度学习技术才被证明在解决许多人工智能问题上非常有用。这是因为直到现在才出现了能够以实用且高效的方式实现这些技术的硬件。\n\
  \n实际上，在应用层面，深度学习需要极其复杂的数学运算，这涉及数百万甚至数十亿的参数。即便是上世纪 90 年代功能强大的 CPU，也无法有效执行这类运算。即使在今天，尽管\
  \ CPU 的性能有了显著提升，但计算过程仍然需要很长的处理时间。这种低效率源于 CPU 的特殊架构，其设计初衷是为了高效执行神经网络并不需要的数学运算。\n\n\
  近几十年来，得益于视频游戏市场巨大的商业推动力，一种新型硬件——*图形处理器（GPU）*得以发展。事实上，这类处理器被设计用于管理越来越高效的矢量计算，例如矩阵乘法，这是实现\
  \ 3D 现实模拟和渲染所必需的。\n\n得益于这项技术创新，许多深度学习技术得以实现。实际上，为了实现神经网络及其学习过程，会使用张量（多维矩阵）进行大量的数学运算。这正是\
  \ GPU 能够更高效完成的工作。得益于它们的贡献，深度学习的处理速度提升了数个数量级（从数月缩短到数天）。\n\n### 数据可用性：开放数据源、物联网与大数据\n\
  \n影响深度学习发展的另一个非常重要的因素是可供访问的庞大数据库。事实上，数据是神经网络运行的基本要素，无论是对于学习阶段还是验证阶段都是如此。\n\n得益于互联网在全球的普及，现在每个人都能访问和产生数据。虽然几年前只有少数组织提供用于分析的数据，但如今，得益于\
  \ `IoT`（物联网），许多传感器和设备都在获取数据并将其在网络上共享。不仅如此，就连社交媒体和搜索引擎（如 Facebook、谷歌等）也能收集海量数据，实时分析连接到其服务的数百万用户（称为*大数据*）。\n\
  \n如今，许多与你希望用深度学习技术解决的问题相关的数据都容易获得，其中许多是免费形式的（作为开放数据源）。\n\n### Python\n\n促成深度学习技术巨大成功和广泛普及的另一个因素是\
  \ `Python` 编程语言。\n\n在过去，规划神经网络系统非常复杂。唯一能够胜任这项任务的语言是 `C++`，这是一种非常复杂、难以使用且只有少数专家掌握的语言。此外，为了使用\
  \ GPU（此类计算所必需的），还必须了解 `CUDA`（统一计算设备架构），即 `NVIDIA` 显卡的硬件开发架构及其全部技术规格。\n\n如今，得益于 `Python`，神经网络和深度学习技术的编程已经变得高层化。实际上，程序员不再需要考虑显卡（GPU）的架构和技术规格，可以完全专注于与深度学习相关的部分。此外，`Python`\
  \ 语言的特性使程序员能够开发出简单直观的代码。你在上一章中已经通过机器学习体验过这一点，深度学习亦是如此。\n\n### 深度学习 Python 框架\n\n\
  在过去两年中，许多开发者组织和社区一直在开发 `Python` 框架，这些框架极大地简化了深度学习技术的计算和应用。人们对此热情高涨，其中许多库几乎是以竞争的方式执行相同的操作，但它们各自基于不同的内部机制。\n\
  \n在如今可免费获得的这些框架中，值得提一下一些正在获得成功的框架。\n\n*   `TensorFlow` 是一个用于数值计算的开源库，其使用基于数据流图。在这些图中，节点代表数学运算，边代表张量（多维数据数组）。其架构非常灵活，可以将计算分布到多个\
  \ CPU 和多个 GPU 上。\n*   `Caffe2` 是一个为简化深度学习工作而开发的框架。它允许你利用云端 GPU 的能力来测试模型和算法计算。\n\
  *   `PyTorch` 是一个完全基于 GPU 使用的科学计算框架。它工作方式高效，是近期开发的，目前尚未完全成熟。但它已经证明了自己是科学研究的强大工具。\n\
  *   `Theano` 是科学领域中最常用的 `Python` 库，用于开发、定义和评估数学表达式及物理模型。不幸的是，开发团队已宣布将不再发布新版本。然而，由于无论是在文献中还是在网络上，都有大量使用该库开发的程序，它仍然是一个参考框架。\n\
  \n\n\n## 人工神经网络\n\n*人工神经网络*是深度学习的基本要素，也是几乎所有深度学习技术的基础。事实上，这类系统之所以能够学习，得益于其参考生物神经回路而构建的特殊结构。\n\
  \n在本节中，你将详细了解人工神经网络是什么以及它们是如何构建的。\n\n### 人工神经网络的结构\n\n人工神经网络是通过连接结构中重复出现的简单基本组件而创建的复杂结构。根据这些基本组件的数量和连接类型，会形成越来越复杂的网络，其架构各异，每一种架构在解决不同深度学习问题的学习和能力方面都呈现出独特的特点。\n\
  \n图 9-2 展示了一个通用人工神经网络的结构示例。\n\n![](img/336498_3_En_9_Fig2_HTML.png)\n\n一个人工神经网络模型的示意结构图。它由若干输入层、隐藏层和输出层组成。节点用深色圆圈表示，边用箭头指示。\n\
  \n图 9-2\n\n一个通用人工神经网络结构的示意图\n\n这些基本单元被称为*节点*（如图 9-2 中所示的深色圆圈），它们在生物模型中模拟了神经网络中神经元的功能。这些人工神经元执行非常简单的操作，类似于其生物对应物。当它们接收到的输入信号总和超过激活阈值时，它们就会被激活。\n\
  \n这些节点可以通过称为*边*的连接相互传输信号，边模拟了生物突触的功能（如图 9-2 中所示的箭头）。通过这些边，一个神经元发出的信号会传递到下一个神经元，并起到过滤器的作用。也就是说，一条边会根据预设规则（通常每条边都应用一个不同的*权重*），将神经元的输出信息转换为抑制性或兴奋性信号，从而降低或增强其强度。\n\
  \n神经网络有一定数量的节点用于从外部接收输入信号（见图 9-2）。这第一组节点通常被表示在神经网络示意图的最左端一列。这组节点代表了神经网络的第一层（*输入层*）。根据接收到的输入信号，这些神经元中的一部分（或全部）会被激活，处理接收到的信号，并通过边将结果作为输出传输给另一组神经元。\n\
  \n这第二组节点位于神经网络中的中间位置，被称为*隐藏层*。这是因为这组神经元既不与外部进行输入通信，也不进行输出通信，因此是隐藏起来的。如图 9-2 所示，这些神经元中的每一个都有许多输入边，通常与前一层所有神经元相连。这些隐藏神经元同样会在总输入信号超过某个阈值时被激活。如果被激活，它们将处理信号并将其传输给另一组神经元（在图\
  \ 9-2 所示示意图的右向方向上）。这组神经元可以是另一个隐藏层，或者是*输出层*，也就是将结果直接发送到外部的最后一层。\n\n总的来说，数据流会进入神经网络（从左到右），根据其结构以或简单或复杂的方式进行处理，并产生一个输出结果。\n\
  \n神经网络的行为、能力和效率将完全取决于节点如何连接，以及分配给每一层的总层数和神经元数量。所有这些因素共同定义了*神经网络架构*。\n\n### 单层感知器（SLP）\n\
  \n*单层感知器（SLP）* 是最简单的神经网络模型，由弗兰克·罗森布拉特于 1958 年设计。其架构如图 9-3 所示。\n\n![](img/336498_3_En_9_Fig3_HTML.png)\n\
  \n一个单层感知器的神经网络模型。它由两个输入层组成，之后是权重 1 和权重 2，最后以一个输出层结束。\n\n图 9-3\n\n单层感知器（SLP）架构\n\n\
  单层感知器（SLP）的结构非常简单；它是一个没有隐藏层的两层神经网络，其中若干输入神经元通过不同的连接向一个输出神经元发送信号，每条连接都有自己的权重。图 9-4\
  \ 更详细地展示了这类神经网络的内部工作机制。\n\n![](img/336498_3_En_9_Fig4_HTML.png)\n\n一个复杂的单层感知器神经网络模型。它由若干输入、权重，之后是\
  \ sigma 函数、激活函数组成，最后以两个数学运算结束。\n\n图 9-4\n\n一个更详细的单层感知器（SLP）表示图，其中内部操作以数学形式表达\n\n\
  该结构的边在此数学模型中通过一个由神经元本地记忆组成的权重向量来表示。\n\n![](img/336498_3_En_9_Chapter_TeX_Equa.png)\n\
  \n输出神经元接收一个输入向量信号 `xi`，每个信号来自不同的神经元。\n\n![](img/336498_3_En_9_Chapter_TeX_Equb.png)\n\
  \n然后它通过加权和对输入信号进行处理。\n\n![](img/336498_3_En_9_Chapter_TeX_Equc.png)\n\n输出神经元感知到总信号\
  \ `s`。如果该信号超过神经元的激活阈值，神经元将被激活，发送值 `1`；否则，它将保持未激活状态，发送 `-1`。\n\n![](img/336498_3_En_9_Chapter_TeX_Equd.png)\n\
  \n这是最简单的*激活函数*（见图 9-5 中的函数 A），但你也可以使用其他更复杂的函数，例如 sigmoid 函数（见图 9-5 中的函数 D）。\n\n\
  ![](img/336498_3_En_9_Fig5_HTML.jpg)\n\n四个 X 对 Y 的曲线图。A. 双极阈值函数。位于正值和负值之间。B. 单极阈值函数。位于正值上。C.\
  \ 单极 sigmoid 函数，位于正值上。D. 双极 sigmoid 函数，位于正值和负值之间。\n\n图 9-5\n\n激活函数的一些示例\n\n现在你已经了解了\
  \ SLP 神经网络的结构，接下来可以看看它们是如何学习的。\n\n神经网络的学习过程被称为*学习阶段*，它是迭代进行的。也就是说，会执行预定数量的神经网络操作周期。在每个周期中，`wi`\
  \ 突触的权重都会被略微修改。每个学习周期被称为一个*时期（epoch）*。为了进行学习，你必须使用适当的输入数据，称为*训练集*（你已经在第 8 章中深入使用过它们）。\n\
  \n\n\n## 神经网络中的监督学习\n\n在训练集中，针对每个输入值，都能获得期望的输出值。通过比较神经网络产生的输出值与期望值，可以分析差异并修改权重值，同时还能降低这些差异。在实践中，这是通过最小化特定于深度学习问题的`成本函数（损失）`来实现的。事实上，不同连接的权值会在每个周期（epoch）被修改，以最小化成本（`损失`）。\n\
  \n总之，监督学习被应用于神经网络。\n\n学习阶段结束后，会进入`评估阶段`，在此阶段，已学习过的`SLP`感知机必须分析另一组输入（测试集），这组输入的结果也是已知的。通过评估获得值与期望值的差异，就能了解神经网络解决深度学习问题的能力水平。通常会用猜对案例与猜错案例的百分比来表示这个值，它被称为`准确率`。\n\
  \n### 多层感知机 (MLP)\n\n一种更复杂且高效的架构是`多层感知机 (MLP)`。在这种结构中，输入层和输出层之间有一个或多个隐藏层。该架构如图 9-6\
  \ 所示。\n\n![多层感知机的神经网络模型。它由一定数量的输入层、两个隐藏层和输出层组成。](img/336498_3_En_9_Fig6_HTML.png)\n\
  \n图 9-6：多层感知机 (MLP) 架构\n\n学习阶段结束后，会进入`评估阶段`，在此阶段，已学习过的`SLP`感知机必须分析另一组输入（测试集），这组输入的结果也是已知的。通过评估获得值与期望值的差异，就能了解神经网络解决深度学习问题的能力水平。通常会用猜对案例与猜错案例的百分比来表示这个值，它被称为`准确率`。\n\
  \n尽管更加复杂，但`MLP`神经网络模型主要基于与`SLP`神经网络模型相同的概念。即使在`MLP`中，每个连接也都被分配了权重。这些权重必须基于对训练集的评估来最小化，这与`SLP`非常相似。同样地，每个节点都必须通过激活函数处理所有传入信号，即使这次由于存在多个隐藏层，使得神经网络能够学习更多内容，`更有效地适应`深度学习试图解决的问题类型。\n\
  \n另一方面，从实践角度来看，这种系统更高的复杂度需要更复杂的算法来支持学习阶段和评估阶段。其中之一是`反向传播算法`，它用于有效地修改各个连接的权重以最小化成本函数，从而使输出值快速且渐进地收敛于期望值。\n\
  \n其他算法则专门用于成本（或误差）函数的最小化阶段，通常被称为`梯度下降`技术。\n\n对这些算法的研究和详细分析超出了本文的范围，本文仅对该论题起到介绍作用，目标是尽可能保持深度学习主题的简单和清晰。如果你有兴趣，我建议你通过各类书籍和互联网进一步深入研究该主题。\n\
  \n### 人工神经网络与生物神经网络的对应关系\n\n到目前为止，你已经看到了深度学习如何使用称为人工神经网络的基本结构来模拟人脑的功能，特别是在处理信息的方式上。\n\
  \n在最高阅读层面上，这两个系统之间也存在真实的对应关系。事实上，你刚刚看到神经网络具有基于神经元层的结构。第一层处理传入信号，然后将其传递到下一层，下一层再处理它，依此类推，直到得出最终结果。对于每一层神经元，传入的信息都以某种方式被处理，生成相同信息的`不同表示层次`。\n\
  \n事实上，人工神经网络整个运作过程无非是将信息转化为越来越抽象层次的过程。\n\n这种运作方式与大脑皮层中发生的情况完全相同。例如，当眼睛接收到一个图像时，图像信号会经过多个处理阶段（就像神经网络的层），在这些阶段中，例如，首先检测图形的轮廓（边缘检测），然后是几何形状（形状感知），接着是识别物体及其名称。因此，传入的信息经历了不同概念层次的转换，从图像，到线条，到几何图形，最终到达一个单词。\n\
  \n## TensorFlow\n\n在本章的前面部分，你看到了 Python 中有几个框架允许你开发深度学习项目。其中之一是`TensorFlow`。在本节中，你将详细了解这个框架，包括它是如何工作的，以及如何利用它来实现深度学习的神经网络。\n\
  \n### TensorFlow：谷歌的框架\n\n`TensorFlow` ([`www.tensorflow.org`](http://www.tensorflow.org))\
  \ 是由 Google Brain Team 开发的一个库，该团队是谷歌领导下的一个名为 Machine Learning Intelligence 的研究组织。\n\
  \n这个库的目的是为机器学习和深度学习研究领域提供一个优秀的工具。\n\n`TensorFlow` 的第一个版本由谷歌于 2017 年 2 月发布，在一年半的时间里，发布了众多更新，极大地增强了这个库的潜力、稳定性和可用性。这主要归功于大量专业人员和研究人员对该框架的充分使用。目前，`TensorFlow`\
  \ 已经是一个成熟的深度学习框架，互联网上有丰富的文档、教程和项目可供参考。\n\n除了主包之外，随着时间的推移，还发布了其他许多库，包括：\n\n*   `TensorBoard`\
  \ — 一个用于可视化`TensorFlow`内部图的工具包 ([`https://github.com/tensorflow/tensorboard`](https://github.com/tensorflow/tensorboard))。\n\
  *   `TensorFlow Fold` — 生成优美的动态计算图 ([`https://github.com/tensorflow/fold`](https://github.com/tensorflow/fold))\n\
  *   `TensorFlow Transform` — 创建和管理输入数据管道 ([`https://github.com/tensorflow/transform`](https://github.com/tensorflow/transform))\n\
  \n\n\n### TensorFlow：数据流图\n\nTensorFlow（[`www.tensorflow.org`](http://www.tensorflow.org)）是一个由谷歌大脑团队开发的库，该团队隶属于机器学习情报组，是一个由谷歌领导的研发机构。\n\
  \nTensorFlow 完全基于图的结构化与使用，以及数据在其中的流动，并利用这些图来进行数学计算。\n\n在 TensorFlow 运行时系统内部创建的图被称为*数据流图*，它会根据作为计算基础的数学模型在运行时构建。实际上，TensorFlow\
  \ 允许你通过一系列在代码中实现的指令来定义任何数学模型。TensorFlow 会负责将该模型在内部转换成数据流图。\n\n当你构建深度学习神经网络模型时，它会被转换成数据流图。鉴于神经网络结构与图的数学表示之间巨大的相似性，很容易理解为什么这个库非常适合用于开发深度学习项目。\n\
  \nTensorFlow 并不局限于深度学习，它也可以用于表示人工神经网络。许多其他计算和分析方法都可以通过这个库来实现，因为任何物理系统都可以用数学模型来表示。事实上，这个库还可以用于实现其他机器学习技术，例如通过计算偏微分来研究复杂的物理系统，等等。\n\
  \n数据流图中的节点代表数学运算，而图中的边则代表张量（多维数据数组）。TensorFlow 这个名称源于这些张量代表了数据通过图的流动，这些图可用于建模人工神经网络。\n\
  \n## 开始使用 TensorFlow 编程\n\n现在你已经大致了解了 TensorFlow 框架的构成，可以开始使用这个库进行工作了。在本节中，你将了解如何安装这个框架，理解旧版\
  \ 1.x 与新版之间的区别，以及新版的关键特性。\n\n### TensorFlow 2.x 与 TensorFlow 1.x 对比\n\n正如本章开头所预期的，在第三版中，与使用\
  \ TensorFlow 进行深度学习相关的文本和示例代码已完全重写。这是因为自 2019 年以来，引入了新版的 TensorFlow 2.x。它带来了许多变化。TensorFlow\
  \ 1.x 版本中的许多模块已被移除或转移。`Keras` 已完全被整合为一个神经网络管理模块，因此，之前的大多数编程机制和范式（例如，第二版中使用 TensorFlow\
  \ 1.x 的那些）已不再兼容。\n\n鉴于近年来使用 TensorFlow 1.x 开发了大量程序，确保这些程序能够继续兼容并因此可用非常重要。为了迅速解决这个问题，谷歌提供了一种无需大量重写即可继续使用旧代码的方法。\n\
  \n在代码开头，你只需替换经典的导入语句：\n\n```\nimport tensorflow as tf\n```\n\n为以下语句：\n\n```\nimport\
  \ tensorflow.compat.v1 as tf\n```\n\n这个替换通常应能保证使用 TensorFlow 1.x 开发的代码完美执行，即使你当前的版本是\
  \ TensorFlow 2.x。\n\n对于当前的项目，如果你正准备使用 TensorFlow 开发一个新的深度学习项目，唯一合理的方式是遵循 TensorFlow\
  \ 2.x 的范式。这就是本章只提及这个最新版本，而没有转录旧代码的原因。\n\n### 安装 TensorFlow\n\n在开始工作之前，你需要在你的电脑上安装这个库。\n\
  \n如果 TensorFlow 库已经安装，那么确定当前的版本很有用，特别是考虑到 TensorFlow 1.x 和 TensorFlow 2.x 之间的差异。你可以通过打开一个\
  \ Python 会话并输入以下代码行来轻松查明：\n\n```\nimport tensorflow as tf\ntf.__version__\n```\n\
  \n如果存在 1.x 版本，最好的方式是创建一个新的虚拟环境，在其中安装 2.x 版本，同时不影响系统上已安装模块的配置。如果系统中没有这个库，你可以轻松地安装\
  \ TensorFlow 2.x。如之前章节所述，最优解决方案是拥有 Anaconda 平台，并从 Navigator 中以图形方式安装 TensorFlow\
