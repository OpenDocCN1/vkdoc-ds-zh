  你还需要定义一个新的 `Template` 对象。


  ```

  choropleth2 = jinja2.Template("""

  require(["d3","queue","topojson"], function(d3,queue,topojson){

  var data = []

  d3.select("#choropleth2 svg").remove()

  var width = 960,

  height = 600;

  var rateById = d3.map();

  var quantize = d3.scale.quantize()

  .domain([0, 1000000])

  .range(d3.range(9).map(function(i) { return "q" + i + "-9"; }));

  var projection = d3.geo.albersUsa()

  .scale(1280)

  .translate([width / 2, height / 2]);

  var path = d3.geo.path()

  .projection(projection);

  var svg = d3.select("#choropleth2").append("svg")

  .attr("width", width)

  .attr("height", height);

  queue()

  .defer(d3.json, "us.json")

  .defer(d3.csv,"population.csv", function(d) { rateById.set(d.id, +d.pop); })

  .await(ready);

  function ready(error, us) {

  if (error) throw error;

  svg.append("g")

  .attr("class", "counties")

  .selectAll("path")

  .data(topojson.feature(us, us.objects.counties).features)

  .enter().append("path")

  .attr("class", function(d) { return quantize(rateById.get(d.id)); })

  .attr("d", path);

  svg.append("path")

  .datum(topojson.mesh(us, us.objects.states, function(a, b) { return a !== b; }))

  .attr("class", "states")

  .attr("d", path);

  }

  });

  """);

  ```


