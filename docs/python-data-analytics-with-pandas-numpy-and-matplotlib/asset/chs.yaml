  \ = PCA(n_components=3).fit_transform(iris.data)\n#SCATTERPLOT 3D\nfig = plt.figure()\n\
  ax = Axes3D(fig)\nax.set_title('Iris Dataset by PCA', size=14)\nax.scatter(x_reduced[:,0],x_reduced[:,1],x_reduced[:,2],\
  \ c=species)\nax.set_xlabel('First eigenvector')\nax.set_ylabel('Second eigenvector')\n\
  ax.set_zlabel('Third eigenvector')\nax.w_xaxis.set_ticklabels(())\nax.w_yaxis.set_ticklabels(())\n\
  ax.w_zaxis.set_ticklabels(())\n```\n\n结果将是图 8-6 所示的散点图。三个鸢尾花物种彼此之间被很好地表征，形成了各自的聚类。\n\
  \n![](img/336498_3_En_8_Fig6_HTML.png)\n\n一个三维散点图，展示了通过 PCA 分析得出的鸢尾花数据集的第一个、第二个和第三个特征向量。这三个物种以不同的颜色呈现，并形成了彼此分离的聚类。\n\
  \n图 8-6\n三维散点图，显示了代表每个鸢尾花物种的三个聚类\n\n\n\n## K-近邻分类器\n\n现在，你将执行一项*分类*任务，为了用`scikit-learn`库完成此操作，你需要一个*分类器*。\n\
  \n给定一个鸢尾花的新测量值，分类器的任务是确定它属于三个物种中的哪一个。最简单的分类器是*最近邻*。该算法在训练集中寻找最接近新测试样本的观测值。\n\n事实上，KNN\
  \ 算法背后的机制是机器学习中最简单、最直接的方法之一。尽管如此，KNN 仍然是该领域最常用的技术之一，不仅用于分类，还用于回归和异常检测等其他问题。\n\n\
  该算法首先计算待分类的新数据点在（多维）特征空间中与所有已知类别（或已被评估过的）数据点之间的距离。要计算两点之间的距离，可以使用不同的技术，例如欧几里得距离（我们都在学校学过）、闵可夫斯基距离、曼哈顿距离等。欧几里得方法看似最佳，但实际上对于高维数据，它的效果不再那么理想。\n\
  \n一旦距离计算完成，KNN 算法就会在所有点中选出距离待分类点最近的 K 个点。这个 K 值正是“K-近邻”算法名称的由来。在分类问题中，新点将被判定给 K\
  \ 个近邻中拥有最多点的类别。见图 8-7。\n\n![](img/336498_3_En_8_Fig7_HTML.jpg)\n\nK N N 算法的示意图。从一个包含\
  \ A、B、C 三个类别的三维平面开始。从所有三个类别中圈出 K 个最近的点。这里，选中的新点属于 A 类。\n\n**图 8-7** KNN 的分类机制\n\n\
  此时需要考虑的一个非常重要的概念是*训练集*和*测试集*（已在第 1 章中介绍过）。实际上，如果你只有一个单一的数据集，重要的是不要将同一组数据既用于测试又用于训练。在这方面，数据集中的元素被分为两部分，一部分用于训练算法，另一部分用于执行验证。\n\
  \n因此，在继续之前，你必须将你的鸢尾花数据集分为两部分。然而，明智的做法是先随机打乱数组元素，然后再进行划分。事实上，数据通常是按特定顺序收集的，而在你的案例中，鸢尾花数据集的条目是按物种排序的。为了混合数据集的元素，你可以使用一个名为\
  \ `random.permutation()` 的 NumPy 函数。混洗后的数据集包含 150 个不同的观测值；前 140 个用作训练集，其余 10 个用作测试集。\n\
  \n```\nimport numpy as np\nfrom sklearn import datasets\nnp.random.seed(0)\niris\
  \ = datasets.load_iris()\nx = iris.data\ny = iris.target\ni = np.random.permutation(len(iris.data))\n\
  x_train = x[i[:-10]]\ny_train = y[i[:-10]]\nx_test = x[i[-10:]]\ny_test = y[i[-10:]]\n\
