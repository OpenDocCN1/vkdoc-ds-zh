  \n如果使用单个数据框中的点绘制经典散点图：\n\n```python\nplt.plot(df_ravenna['wind_deg'],df_ravenna['wind_speed'],'ro')\n\
  ```\n\n你会得到如图 10-20 所示的图表，这显然信息量不大。\n\n![](img/336498_3_En_10_Fig20_HTML.png)\n\n\
  一个散点图表示 360 度范围内点的分布。y 轴数值范围从 1 到 6，而 x 轴范围从 75 到 250。图形初始下降陡峭，随后波动并向末端延伸。\n\n**图\
  \ 10-20** – 表示 360 度分布的散点图\n\n要表示 360 度范围内的点分布，最好使用另一种可视化类型：*极坐标图*。你在第 8 章已经见过这种图表。\n\
  \n首先需要创建一个直方图，将数据分布到 360 度区间内，该区间被分成八个区间（bin），每个区间为 45 度。\n\n```python\nhist, bins\
  \ = np.histogram(df_ravenna['wind_deg'],8,[0,360])\nprint(hist)\nprint(bins)\n```\n\
  \n返回的值是每个区间内的出现次数，由一个名为 `hist` 的数组表示：\n\n```\nOut [ ]:\n[ 0  5 11  1  0  1  0  0]\n\
  ```\n\n以及一个名为 `bins` 的数组，它定义了 360 度范围内每个区间的边界。\n\n```\nOut [ ]:\n[   0\\.   45\\\
  .   90\\.  135\\.  180\\.  225\\.  270\\.  315\\.  360.]\n```\n\n这些数组将有助于正确定义待绘制的极坐标图。为此，你需要利用第\
  \ 8 章中的部分代码来创建一个函数。这个函数名为 `showRoseWind()`，它需要三个不同的参数：`values` 是包含要显示值的数组，此处为 `hist`\
  \ 数组；`city_name` 是一个字符串，包含要显示为图表标题的城市名称；`max_value` 是一个整数，用于设定显示蓝色的最大值。\n\n定义此类函数有助于避免多次重复编写相同的代码，并能生成更具模块化的代码，使你能够专注于函数内特定操作相关的概念。\n\
  \n```python\ndef showRoseWind(values,city_name,max_value):\n    N = 8\n    theta\
  \ = np.arange(0.,2 * np.pi, 2 * np.pi / N)\n    radii = np.array(values)\n    plt.axes([0.025,\
  \ 0.025, 0.95, 0.95], polar=True)\n    colors = [(1-x/max_value, 1-x/max_value,\
  \ 0.75) for x in radii]\n    plt.bar(theta +np.pi/8, radii, width=(2*np.pi/N), bottom=0.0,\
  \ color=colors)\n    plt.title(city_name,x=0.2, fontsize=20)\n```\n\n一个发生变化的方面是颜色映射。在这种情况下，扇区颜色越接近蓝色，其代表的值越大。\n\
  \n定义好函数后，你就可以使用它：\n\n```python\nshowRoseWind(hist,'Ravenna',max(hist))\n```\n\n\
  执行这段代码，你将获得一个如图 10-21 所示的极坐标图。\n\n![](img/336498_3_En_10_Fig21_HTML.png)\n\n\n\n\
  ### 极坐标图\n\n极坐标图展示了 Ravenna 在 0 到 360 度范围内值的分布情况。图中存在 5 个同心圆，从内向外分别对应值 2、4、6、8 和\
  \ 10。90 度到 135 度之间的区域被着色。\n\n**图 10-21**\n\n极坐标图表示 360 度范围内值的分布\n\n如图 10-20 所示，有一个\
  \ 360 度的范围被划分为八个区域，每个区域为 45 度（即区间），在径向上表示值的刻度。在这八个区域中，每个区域都用一个可变长度的切片来表示，该长度精确对应相应的值。切片在径向上延伸得越长，表示的值就越大。为了提高图表的可读性，引入了一个颜色标度，该标度与切片的延伸程度相对应。切片越宽，颜色越趋向于深蓝色。\n\
  \n此极坐标图提供了关于风向将如何在径向上分布的信息。在此案例中，一天中的大部分时间风纯粹地向西南/西方向吹。\n\n一旦定义了`showRoseWind`函数，就可以很容易地观察十个样本城市中任何一个城市的风况。\n\
  \n```\nhist, bin = np.histogram(df_ferrara['wind_deg'],8,[0,360])\nprint(hist)\n\
  showRoseWind(hist,'Ferrara', 15.0)\nOut [ ]:\n[7 2 3 3 3 2 0 0]\n```\n\n图 10-22\
  \ 展示了这十个城市的极坐标图。\n\n![](img/336498_3_En_10_Fig22_HTML.png)\n\n一组 10 个极坐标图展示了 Torino、Cesena、Faenza、Ferrara、Piacenza、Mantova、Bologna、Asti、Milano\
  \ 和 Ravenna 等城市的风向。每张图表以较深的色调突出显示不同的角度区域。\n\n**图 10-22**\n\n极坐标图显示风向分布\n\n#### 计算风速的平均分布\n\
  \n另一个与风速相关的量也可以表示为 360 度上的分布。\n\n现在定义一个名为`RoseWind_Speed`的特性，它将允许计算 360 度所划分的八个区间中每个区间的平均风速。\n\
  \n```\ndef RoseWind_Speed(df_city):\ndegs = np.arange(45,361,45)\ntmp =  []\nfor\
  \ deg in degs:\ntmp.append(df_city[(df_city['wind_deg']>(deg-46)) & (df_city['wind_deg']<deg)]['wind_speed'].mean())\n\
  return np.nan_to_num(tmp)\n```\n\n此函数返回一个包含八个平均风速的 NumPy 数组。该数组将用作`ShowRoseWind_Speed()`函数的第一个参数，该函数是之前用于绘制极坐标图的`ShowRoseWind()`函数的改进版本。\n\
  \n```\ndef showRoseWind_Speed(speeds,city_name):\nN = 8\ntheta = np.arange(0,2 *\
  \ np.pi, 2 * np.pi / N)\nradii = np.array(speeds)\nplt.axes([0.025, 0.025, 0.95,\
  \ 0.95], polar=True)\ncolors = [(1-x/10.0, 1-x/10.0, 0.75) for x in radii]\nbars\
  \ = plt.bar(theta+np.pi/8, radii, width=(2*np.pi/N), bottom=0.0, color=colors)\n\
  plt.title(city_name,x=0.2, fontsize=20)\nshowRoseWind_Speed(RoseWind_Speed(df_ravenna),'Ravenna')\n\
  ```\n\n图 10-23 展示了风速分布在 360 度范围内对应的 RoseWind 图。\n\n![](img/336498_3_En_10_Fig23_HTML.png)\n\
  \n一张 Ravenna 的极坐标图，表示从 0 到 360 度、间隔为 45 度的角度分布。图中存在 4 个从内到外值为 1 到 4 的同心圆。0 到 90\
  \ 度之间的区域以较深的色调着色，而其他区域则颜色较浅。\n\n**图 10-23**\n\n此极坐标图表示 360 度内风速的分布\n\n在完成所有这些工作后，可以借助\
