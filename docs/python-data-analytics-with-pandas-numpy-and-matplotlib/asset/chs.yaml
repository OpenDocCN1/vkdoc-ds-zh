  `NumPy` 是一个用于 Python 科学计算，特别是数据分析的基础包。事实上，这个库是大量数学和科学 Python 包的基础，其中就包括你将在本书后续内容中看到的
  `pandas` 库。这个专注于数据分析的库完全是利用 `NumPy` 引入的概念开发的。实际上，标准 Python 库提供的内置工具对于数据分析中的大多数计算来说可能过于简单或不够用。


  掌握 `NumPy` 库的知识对于能够使用所有科学计算 Python 包至关重要，特别是使用和理解 `pandas` 库。`pandas` 库是后续章节的主要主题。


  如果你已经熟悉这个库，可以直接进入下一章；否则，你可以将本章视为复习基本概念或通过运行本章示例来重新熟悉它的途径。


  ## NumPy：历史沿革


  在 Python 语言的早期，开发者需要执行数值计算，尤其是在科学界使用该语言时。


  第一次尝试是 Jim Hugunin 在 1995 年开发的 `Numeric`，随后出现了另一个名为 `Numarray` 的替代包。这两个包都专门用于数组计算，并且各有其适用场景下的优势。因此，它们根据实际情况被区别使用。这种模棱两可的情况后来促成了统一这两个包的想法。Travis
  Oliphant 为此开始开发 `NumPy` 库。其第一个版本（v 1.0）于 2006 年发布。


  从那时起，`NumPy` 被证明是用于科学计算的 Python 扩展库，并且目前是用于计算多维数组和大数组最广泛使用的包。此外，该包附带了一系列函数，可以让你以极高效率对数组执行操作，并进行高级数学计算。


  目前，`NumPy` 是开源软件，采用 BSD 许可证。许多贡献者扩展了这个库的潜力。现在，`NumPy` 已发布到 1.24 版本。如图 3-1 所示，该库正在持续开发中，大约每六个月发布一个版本。


