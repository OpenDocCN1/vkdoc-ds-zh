  D3 库创建相同的表示。




  ## JavaScript 的 D3 库


  D3 是一个 JavaScript 库，允许直接检查与操作 DOM 对象（HTML5），但它专门用于数据可视化，并且在这一领域表现出色。事实上，D3 这个名称来源于“数据驱动文档”中包含的三个字母
  D。D3 完全由迈克·博斯托克开发。


  事实证明，得益于其所基于的技术——JavaScript、SVG 和 CSS，这个库非常通用且功能强大。D3 将强大的可视化组件与数据驱动的 DOM 操作方法相结合。通过这种方式，D3
  充分利用了现代浏览器的能力。


  考虑到即便是 Jupyter Notebook 也是网页对象，并使用与当前浏览器相同的基础技术，尽管它是一个 JavaScript 库，但在 Notebook
  中使用它的想法并不像初看上去那么离谱。


  对于那些不熟悉 JavaScript D3 库并想了解更多相关信息的人，我建议阅读另一本书，即 F. Nelli 所著的 *《使用 D3 创建网页图表》*（Apress,
  2014 年）。


  事实上，Jupyter Notebook 拥有一个名为 `%%javascript` 的神奇函数，可以将 JavaScript 代码集成到 Python 代码中。


  但是，JavaScript 代码与 Python 类似，也需要你导入一些库。这些库可以在线获取，并且每次执行时都需要加载。在 HTML 中，导入库的过程有一个特定的结构：


  ```html

  <script src="https://d3js.org/d3.v3.min.js"></script>

  ```


  这是一个 HTML 标签。要在 Jupyter Notebook 中执行导入，你应该使用以下不同的结构：


  ```javascript

  %%javascript

  require.config({

  paths: {

  d3: ''//cdnjs.cloudflare.com/ajax/libs/d3/3.5.5/d3.min''

  }

  });

  ```


  使用 `require.config()`，你可以导入所有必要的 JavaScript 库。


  此外，如果你熟悉 HTML 代码，你肯定知道如果需要增强 HTML 页面的可视化能力，就需要定义 CSS 样式。相应地，在 Jupyter Notebook 中，你也可以定义一组
  CSS 样式。为此，你可以借助属于 `IPython.core.display` 模块的 `HTML()` 函数来编写 HTML 代码。因此，请按如下方式进行适当的
  CSS 定义：


  ```python

  from IPython.display import display, Javascript, HTML

  display(HTML("""

  <style>

  .bar {

  fill: steelblue;

  }

  .bar:hover{

  fill: brown;

  }

  .axis {

  font: 10px sans-serif;

  }

  .axis path,

  .axis line {

  fill: none;

  stroke: #000;

  }

  .x.axis path {

  display: none;

  }

  </style>

  <div id="chart_d3"></div>

  """))

  ```


  在上述代码的底部，请注意 `<div>` HTML 标签被标识为 `chart_d3`。这个标签标识了图表将要呈现的位置。


  现在，你需要使用 D3 库提供的函数来编写 JavaScript 代码。使用 `Jinja2` 库提供的 `Template` 对象，你可以定义动态的 JavaScript
  代码，在其中你可以根据 pandas 数据帧中包含的值来替换文本。


  如果你的系统尚未安装 `Jinja2` 库，你可以随时使用 Anaconda 进行安装。


  ```bash

  conda install jinja2

  ```


  或者使用这个命令：


  ```bash

  pip install jinja2

  ```


  安装完这个库后，你就可以定义模板了。


  ```python

  import jinja2

  myTemplate = jinja2.Template("""

  require(["d3"], function(d3){

  var data = []

  {% for row in data %}

  data.push({ ''state'': ''{{ row[1] }}'', ''population'': ''{{ row[4] }}''  });

  {% endfor %}

  d3.select("#chart_d3 svg").remove()

  var margin = {top: 20, right: 20, bottom: 30, left: 40},

  width = 800 - margin.left - margin.right,

  height = 400 - margin.top - margin.bottom;

  var x = d3.scale.ordinal()

  .rangeRoundBands([0, width], .25);

  var y = d3.scale.linear()

  .range([height, 0]);

  var xAxis = d3.svg.axis()

  .scale(x)

  .orient("bottom");

  var yAxis = d3.svg.axis()

  .scale(y)

  .orient("left")

  .ticks(10)

  .tickFormat(d3.format(''.1s''));

  var svg = d3.select("#chart_d3").append("svg")

  .attr("width", width + margin.left + margin.right)

  .attr("height", height + margin.top + margin.bottom)

  .append("g")

  .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

  x.domain(data.map(function(d) { return d.state; }));

  y.domain([0, d3.max(data, function(d) { return d.population; })]);

  svg.append("g")

  .attr("class", "x axis")

  .attr("transform", "translate(0," + height + ")")

  .call(xAxis);

  svg.append("g")

  .attr("class", "y axis")

  .call(yAxis)

  .append("text")

  .attr("transform", "rotate(-90)")

  .attr("y", 6)

  .attr("dy", ".71em")

  .style("text-anchor", "end")

  .text("Population");

  svg.selectAll(".bar")

  .data(data)

  .enter().append("rect")

  .attr("class", "bar")

  .attr("x", function(d) { return x(d.state); })

  .attr("width", x.rangeBand())

  .attr("y", function(d) { return y(d.population); })

  .attr("height", function(d) { return height - y(d.population); });

  });

  """);

  ```


  还没结束。现在是时候启动你刚刚定义的 D3 图表的呈现了。你还需要编写命令，将包含在 pandas 数据帧中的数据传递给模板，以便它们可以直接集成到之前编写的
  JavaScript 代码中。JavaScript 代码（或者更确切地说，刚刚定义的模板）的呈现是通过调用 `render()` 函数来执行的。


  ```python

  display(Javascript(myTemplate.render(

  data=states.sort_values([''POPESTIMATE2022''], ascending=False)[:10].itertuples()

  )))

  ```


