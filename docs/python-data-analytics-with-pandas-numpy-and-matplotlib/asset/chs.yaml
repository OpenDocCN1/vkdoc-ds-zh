  \ 双层隐藏层 MLP 在学习过程中损失的变化趋势\n\n从图 9-16 可以看出，这种情况下的学习速度比之前快得多（在第 1000 轮时效果已经不错了）。\n\
  \n```\ntest_loss, test_acc = model.evaluate(test_features, test_labels, verbose=2)\n\
  Out [ ]:\n1/1 - 0s - loss: 0.0951 - accuracy: 1.0000 - 124ms/epoch - 124ms/step\n\
