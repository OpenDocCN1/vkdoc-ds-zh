  \n```\ntrain_features = tf.convert_to_tensor(inputX)\ntrain_labels = tf.convert_to_tensor(inputY)\n\
  train_features\nOut [ ]:\n\ntrain_labels\nOut [ ]:\n\n```\n\n现在，您可以基于图 9-11 中的神经网络构建单层感知器模型，并将各个\
  \ Keras 层添加到模型定义中。\n\n![](img/336498_3_En_9_Fig11_HTML.png)\n\n一个单层感知器的示例神经网络模型。它由两个输入`X1`和`X2`构成，其后跟随两个输入层，以及两个带有两个输出`Y1`和`Y2`的输出层。\n\
  \n图 9-11\n本例中使用的单层感知器模型\n\n```\nmodel = tf.keras.Sequential([\ntf.keras.layers.Dense(2),\n\
  tf.keras.layers.Dense(2)\n])\n```\n\n如您所见，这是一个非常简单的模型，但足以应对诸如本例这类简单场景中的预测任务。\n\n\
  由于这是一个二分类问题，您可以在编译时选择`BinaryCrossentropy`作为损失函数。\n\n```\nmodel.compile(optimizer='SGD',\n\
  loss=tf.keras.losses.BinaryCrossentropy(from_logits=True),\nmetrics=['accuracy'])\n\
  ```\n\n模型编译完成后，即可进入训练阶段。选择 200 个周期，这应该足够让模型进行充分学习。\n\n```\nh = model.fit(train_features,\
  \ train_labels, epochs=2000)\nOut [ ]:\nEpoch 1/2000\n1/1 [==============================]\
  \ - 1s 637ms/step - loss: 2.0271 - accuracy: 0.5455\nEpoch 2/2000\n1/1 [==============================]\
  \ - 0s 4ms/step - loss: 1.9807 - accuracy: 0.5455\nEpoch 3/2000\n1/1 [==============================]\
  \ - 0s 5ms/step - loss: 1.9356 - accuracy: 0.5455\nEpoch 4/2000\n1/1 [==============================]\
  \ - 0s 9ms/step - loss: 1.8918 - accuracy: 0.5455\nEpoch 5/2000\n1/1 [==============================]\
  \ - 0s 8ms/step - loss: 1.8493 - accuracy: 0.5455\nEpoch 6/2000\n1/1 [==============================]\
  \ - 0s 6ms/step - loss: 1.8079 - accuracy: 0.5455\nEpoch 7/2000\n...\n```\n\n在输出中，您将看到每个周期完整的学习情况，并通过滚动条显示各个周期的完成进度。每个输出行旁边会相应地显示损失值和准确率值。\n\
  \n然而，很明显，这种输出方式并非理解神经网络模型在学习阶段表现的最佳途径。为此，我将输出结果保存在返回值`h`（代表历史记录）中，您可以利用它进行图形化展示，从而辅助分析。\n\
  \n从历史变量中提取各个时期对应的损失值。\n\n```\nacc_set = h.history['loss']\nepoch_set = h.epoch\n\
  ```\n\n借助`matplotlib`库，将这些值绘制成图表，以图形方式观察学习进度。\n\n```\n# 返回包含每第 100 个元素的新列表\nplt.plot(epoch_set[0::100],acc_set[0::100],\
  \ 'o', label='Training phase')\nplt.ylabel('loss')\nplt.xlabel('epoch')\nplt.legend()\n\
  ```\n\n结果，您将获得一个类似于图 9-12 所示的图表。\n\n![](img/336498_3_En_9_Fig12_HTML.jpg)\n\n训练阶段的损失值与周期数关系图。该图包含\
  \ 1750 个周期，最终损失值约为 1。训练阶段的损失值逐渐下降。\n\n图 9-12\n学习阶段中损失值的变化情况。\n\n现在进入测试阶段，定义另外两个张量。\n\
  \n\n\n```\ntestX = np.array([[1.,2.25],[1.25,3.],\n[2,2.5],[2.25,2.75],\n[2.5,3.],[2.,0.9],\n\
  [2.5,1.2],[3.,1.25],\n[3.,1.5],[3.5,2.],\n[3.5,2.5]])\ntestY = [[1.,0.]]*5 + [[0.,1.]]*6\n\
  test_features = tf.convert_to_tensor(testX)\ntest_labels = tf.convert_to_tensor(testY)\n\
  ```\n\n评估新训练的 SLP 模型的精度。\n\n```\ntest_loss, test_acc = model.evaluate(test_features,\
  \ test_labels, verbose=2)\nOut [ ]:\n1/1 - 0s - loss: 0.1812 - accuracy: 1.0000\
  \ - 233ms/epoch - 233ms/step\n```\n\n如您所见，考虑到分类的简单性，精度达到了最高水平。因此，您可以预期新训练的模型具有非常好的预测水平。\n\
  \n现在进入正式的分类阶段，向神经网络传递大量数据（笛卡尔平面上的点），而不知道它们属于哪个类别。事实上，这正是神经网络告知您可能类别的时刻。\n\n为此，程序模拟实验数据，在笛卡尔平面上创建完全随机的点。例如，您可以生成一个包含\
  \ 1,000 个随机点的数组。\n\n```\nexp_features = 3*np.random.random((1000,2))\n```\n\n现在，您使用\
  \ Softmax 扩展模型，以获得不同点属于这两个类别的概率输出。\n\n```\nprobability_model = tf.keras.Sequential([\n\
  model,\ntf.keras.layers.Softmax()\n])\n```\n\n现在，使用您刚刚扩展的模型对实验数据进行预测。\n\n```\npredictions\
  \ = probability_model.predict(exp_features)\n```\n\n让我们确定单个点属于这两个类别的概率。例如，第一个点：\n\
  \n```\npredictions[0]\nOut [ ]:\narray([0.073105 , 0.9268949], dtype=float32)\n\
  ```\n\n另一方面，如果我们想直接知道它属于两个类别中的哪一个，我们编写以下代码来获取它所属的类别（0 表示第一类，1 表示第二类）：\n\n```\nnp.argmax(predictions[0])\n\
  Out [ ]:\n\n```\n\n除了以文本方式逐点分析之外，还有一种图形化方式来可视化这些预测的结果。在之前的散点图中，您用两种颜色（黄色和紫色）对笛卡尔平面上的点进行了分类。现在，既然您考虑了某个点属于这两个类别的概率，那么对于所有中间概率，将显示渐变的中间颜色。它将根据距离某个类别的接近程度，从黄色渐变为紫色。\n\
  \n```\nyc = predictions[:,1]\nplt.scatter(exp_features[:,0],exp_features[:,1],c=yc,\
  \ s=50, alpha=1)\nplt.show()\n```\n\n运行代码，您将得到一个如图 9-13 所示的散点图。\n\n![](img/336498_3_En_9_Fig13_HTML.jpg)\n\
  \n散点图描绘了两个类别的中间概率。这些点被三种不同的色调对角分隔。平面上确定了两种色调，一种在右上角，一种在左下角。中间的色调表示不确定区域。\n\n**图\
  \ 9-13** 包含所有实验点及其所属类别估计的散点图\n\n如您根据色调所见，平面上划分出两个分类区域，中央部分（绿色）的颜色渐变表示不确定区域。\n\n\
  通过决定根据点属于某一类或另一类的概率来建立分类结果，可以使分类结果更易于理解和清晰。如果某点属于某个类别的概率大于 0.5，则该点属于该类别。\n\n您可以通过要求每个点根据最可能的选项属于一个或另一个类别来修改先前的散点图。\n\
  \n```\nyc = np.round(predictions[:,1])\nplt.scatter(exp_features[:,0],exp_features[:,1],c=yc,\
  \ s=50, alpha=1)\nplt.show()\n```\n\n运行代码，您将得到一个如图 9-14 所示的散点图。\n\n![](img/336498_3_En_9_Fig14_HTML.jpg)\n\
  \n散点图描绘了两个类别的预测点。这些点被对角划分为两个区域。右上部分和左下部分属于两个不同的类别。它们通过两种色调进行区分。\n\n**图 9-14** 这些点划分出对应于两个类别的两个区域\n\
  \n在图 9-14 所示的散点图中，您可以清晰地看到表征两个所属类别的笛卡尔平面的两个区域。\n\n### 使用 TensorFlow 的多层感知器（带一个隐藏层）\n\
  \n在本节中，您将处理与上一节相同的问题，但使用的是 MLP（多层感知器）神经网络。\n\n启动一个新的 Jupyter Notebook，或者继续使用同一个，但重置内核。\n\
  \n正如您在本章前面所看到的，MLP 神经网络与 SLP 神经网络的不同之处在于它可以有一个或多个隐藏层。\n\n为了构建这个模型（与之前的模型相比，它有一个包含两个神经元的隐藏层），您定义一个与之前类似的模型，但带有一个中间的\
  \ `Dense` 层。\n\n```\nmodel = tf.keras.Sequential([\ntf.keras.layers.Dense(2),\n\
  tf.keras.layers.Dense(2),\ntf.keras.layers.Dense(2)\n])\n```\n\n下一步是编译模型，选择一种优化方法。对于\
  \ MLP 神经网络，**Adam** 优化方法是一个不错的选择。相反，保持损失函数和评估指标不变。\n\n```\nmodel.compile(optimizer='Adam',\n\
  loss=tf.keras.losses.BinaryCrossentropy(from_logits=True),\nmetrics=['accuracy'])\n\
  ```\n\n与之前的 SLP 模型一样，使用相同的训练数据集对其进行训练。\n\n```\nh = model.fit(train_features, train_labels,\
  \ epochs=2000)\nOut [ ]:\nEpoch 1/2000\n1/1 [==============================] - 0s\
  \ 426ms/step - loss: 1.8568 - accuracy: 0.4545\nEpoch 2/2000\n1/1 [==============================]\
  \ - 0s 3ms/step - loss: 1.8473 - accuracy: 0.4545\nEpoch 3/2000\n1/1 [==============================]\
  \ - 0s 3ms/step - loss: 1.8378 - accuracy: 0.4545\nEpoch 4/2000\n1/1 [==============================]\
  \ - 0s 646us/step - loss: 1.8284 - accuracy: 0.4545\nEpoch 5/2000\n1/1 [==============================]\
  \ - 0s 0s/step - loss: 1.8190 - accuracy: 0.4545\nEpoch 6/2000\n1/1 [==============================]\
  \ - 0s 0s/step - loss: 1.8097 - accuracy: 0.4545\nEpoch 7/2000\n1/1 [==============================]\
  \ - 0s 14ms/step - loss: 1.8004 - accuracy: 0.4545\nEpoch 8/2000\n...\n```\n\n提取训练历史记录并创建相同的图表，以显示模型在训练过程中的行为。\n\
  \n```\nacc_set = h.history['loss']\nepoch_set = h.epoch# 返回较大列表中每第 50 个元素的列表\nplt.plot(epoch_set[0::50],acc_set[0::50],\
  \ 'o', label='训练阶段')\nplt.ylabel('损失')\nplt.xlabel('周期')\nplt.legend()\n```\n\n\
  运行之前的代码，您将得到一个如图 9-15 所示的图表。\n\n![](img/336498_3_En_9_Fig15_HTML.jpg)\n\n训练阶段损失值与周期的折线图。点从\
  \ 0 周期时的损失值 1.8 开始，到 2000 周期时的 0.3 结束。值为近似值。\n\n**图 9-15** MLP 模型的学习曲线显示了两个不同的优化阶段\n\
  \n如您所见，即使是一个更复杂的神经网络也显示出不同的学习阶段。在这种情况下，选择 2000 个周期对于提高模型的预测能力至关重要。如果您在 1000 个周期处停止，损失值将为\
  \ 0.7，而不是 0.2。\n\n作为测试这最后一个模型的结果，您获得了 100% 的精度和 0.1 的损失值。\n\n```\ntest_loss, test_acc\
  \ = model.evaluate(test_features, test_labels, verbose=2)\nOut [ ]:\n1/1 - 0s -\
  \ loss: 0.1602 - accuracy: 1.0000 - 105ms/epoch - 105ms/step\n```\n\n\n\n### 使用\
  \ TensorFlow 实现多层感知机（含两个隐藏层）\n\n在本节中，你将拓展之前的网络结构，在第一个隐藏层中加入两个神经元（共四个），并添加一个包含两个神经元的第二个隐藏层。\n\
  \n和之前一样，启动一个新的 Jupyter Notebook 并编写之前示例的必要代码，或重启内核并执行包含必要代码的单元格。\n\n```\nmodel =\
  \ tf.keras.Sequential([\n    tf.keras.layers.Dense(2),\n    tf.keras.layers.Dense(4),\n\
  \    tf.keras.layers.Dense(2),\n    tf.keras.layers.Dense(2)\n])\nmodel.compile(optimizer='Adam',\n\
  \              loss=tf.keras.losses.BinaryCrossentropy(from_logits=True),\n    \
  \          metrics=['accuracy'])\n```\n\n然后，使用与之前相同的训练数据集来训练这个新的双层隐藏层 MLP 模型。\n\n\
  ```\nh = model.fit(train_features, train_labels, epochs=2000)\nOut [ ]:\nEpoch 1/2000\n\
  1/1 [==============================] - 1s 826ms/step - loss: 0.6980 - accuracy:\
  \ 0.4545\nEpoch 2/2000\n1/1 [==============================] - 0s 3ms/step - loss:\
  \ 0.6970 - accuracy: 0.4545\nEpoch 3/2000\n1/1 [==============================]\
