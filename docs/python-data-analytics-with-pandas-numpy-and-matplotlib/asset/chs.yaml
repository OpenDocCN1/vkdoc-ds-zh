  \ 提供广泛的数据集，其中包含从全球气候和环境观测中收集的数据。\n- **世界卫生组织** ([`www.who.int/data/collections`](http://www.who.int/data/collections))\
  \ 管理和维护与全球健康和福祉相关的广泛数据集合。\n- **世界银行开放数据** ([`https://data.worldbank.org/`](https://data.worldbank.org/))\
  \ 提供可用世界银行数据集的列表，涵盖金融和银行数据、发展指标以及自 1947 年至今世界银行贷款项目的信息。\n- **Data.gov** ([`https://data.gov`](https://data.gov))\
  \ 旨在收集并提供对美国政府的开放数据（即在联邦、州、地方和部落各级收集的广泛政府信息）的访问。\n- **欧盟开放数据门户** ([`https://data.europa.eu/en`](https://data.europa.eu/en))\
