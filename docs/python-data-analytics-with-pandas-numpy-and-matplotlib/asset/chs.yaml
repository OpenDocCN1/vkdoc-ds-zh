  ## pandas 数据结构简介


  pandas 的核心是两个主要的数据结构，数据分析过程中通常进行的所有操作都集中在这两个结构上：


  *   Series

  *   Dataframes


  *Series*（序列），正如你将看到的，是一种旨在容纳一维数据序列的数据结构，而 *Dataframe*（数据框）则是一种更复杂的数据结构，旨在包含具有多个维度的情况。


  尽管这些数据结构并非解决问题的万能方法，但它们为大多数应用提供了有效且稳健的工具。事实上，它们仍然非常易于理解和使用。此外，许多更复杂的数据结构情况仍然可以追溯到这两种简单的情况。


  然而，它们的特性建立在一个特定功能之上——在其结构中集成了索引对象和标签。你将看到，这个功能使得这些数据结构易于操作。


  ### Series（序列）


  *Series* 是 pandas 库中用于表示一维数据结构的对象，类似于数组，但具有一些额外的功能。其内部结构很简单（见图 4-6），由两个相互关联的数组组成。主数组保存数据（任何
  NumPy 类型的数据），其中每个元素都与另一个称为*索引*的数组中的标签相关联。


  ![](img/336498_3_En_4_Fig6_HTML.jpg)


  一个表示序列的表格包含两列，分别标注为索引和值。索引列下 4 行的数据如下：0, 1, 2, 3。值列下 4 行的数据如下：12, 负 4, 7, 9。


  **图 4-6** 序列对象的结构


  #### 声明一个 Series


  要创建图 4-1 中指定的序列，只需调用 `Series()` 构造函数，并传入一个包含要加入值的数组作为参数。


  ```

  >>> s = pd.Series([12,-4,7,9])

  >>> s

  0    12

  1    -4

  2     7

  3     9

  dtype: int64

  ```


  正如你从序列的输出中所见，左侧是索引中的值（一系列标签），右侧是对应的值。


  如果在定义序列时没有指定任何索引，默认情况下，pandas 会分配从 0 开始递增的数值作为标签。在这种情况下，标签对应于序列对象中元素的位置（在数组中的索引）。


  然而，通常更可取的做法是使用有意义的标签来创建序列，以便区分和识别每个项目，而无需考虑它们在序列中的插入顺序。


  在这种情况下，在调用构造函数时，需要包含 `index` 选项，并分配一个包含标签的字符串数组。


  ```

  >>> s = pd.Series([12,-4,7,9], index=[''a'',''b'',''c'',''d''])

  >>> s

  a    12

  b    -4

  c     7

  d     9

  dtype: int64

  ```


  如果你想单独查看组成此数据结构的两个数组，可以按如下方式调用序列的两个属性：`index` 和 `values`。


  ```

  >>> s.values

  array([12, -4,  7,  9], dtype=int64)

  >>> s.index

  Index([''a'', ''b'', ''c'', ''d''], dtype=''object'')

  ```


  #### 选择内部元素


  你可以像选择普通 NumPy 数组一样，通过指定键来选择单个元素。


  ```

  >>> s[2]

  ```


  或者，你也可以指定与索引位置对应的标签。


  ```

  >>> s[''b'']

  ```


  以同样的方式选择 NumPy 数组中的多个项目，你可以指定以下内容：


  ```

  >>> s[0:2]

  a    12

  b    -4

  dtype: int64

  ```


  在这种情况下，你可以使用对应的标签，但需在数组中指定标签列表。


  ```

  >>> s[[''b'',''c'']]

  b   -4

  c    7

  dtype: int64

  ```


  #### 为元素赋值


  现在你已经知道如何选择单个元素，那么也知道了如何为它们赋予新值。事实上，你可以通过索引或标签来选择值。


  ```

  >>> s[1] = 0

  >>> s

  a    12

  b     0

  c     7

  d     9

  dtype: int64

  >>> s[''b''] = 1

  >>> s

  a    12

  b     1

  c     7

  d     9

  dtype: int64

  ```


  #### 从 NumPy 数组和其他 Series 定义 Series


  你可以从 NumPy 数组或现有的序列开始定义一个新的序列。


  ```

  >>> arr = np.array([1,2,3,4])

  >>> s3 = pd.Series(arr)

  >>> s3

  0    1

  1    2

  2    3

  3    4

  dtype: int64

  >>> s4 = pd.Series(s)

  >>> s4

  a    12

  b     4

  c     7

  d     9

  dtype: int64

  ```


  请始终牢记，NumPy 数组或原始序列中包含的值不是被复制过来的，而是通过引用传递的。也就是说，对象是动态地插入到新的序列对象中的。如果它发生了变化，例如其内部元素值发生变化，那么这些变化也会在
  new 序列对象中出现。


  ```

  >>> s3

  0    1

  1    2

  2    3

  3    4

  dtype: int64

  >>> arr[2] = -2

  >>> s3

  0    1

  1    2

  2   -2

  3    4

  dtype: int64

  ```


  正如你在本例中所看到的，通过更改 `arr` 数组的第三个元素，代码也修改了 `s3` 序列中的对应元素。



  好的，这是根据您的要求翻译后的中文文档。



  #### 筛选值


  得益于选择 `NumPy` 库作为 `pandas` 库的基础，并因此应用于其数据结构，许多适用于 `NumPy` 数组的操作也被扩展到了 Series 中。其中之一就是通过条件筛选数据结构中包含的值。


  例如，如果你需要知道 Series 中哪些元素大于 `8`，你可以编写如下代码：


  ```

  >>> s[s > 8]

  a    12

  d     9

  dtype: int64

  ```


  #### 运算与数学函数


  其他操作，如运算符（`+`、`-`、`*` 和 `/`）以及适用于 `NumPy` 数组的数学函数，也可以扩展到 Series 中。


  对于运算符，你可以直接编写算术表达式。


  ```

  >>> s / 2

  a    6.0

  b   -2.0

  c    3.5

  d    4.5

  dtype: float64

  ```


  然而，对于 `NumPy` 的数学函数，你必须指定以 `np` 引用的函数，并将 Series 实例作为参数传入。


  ```

  >>> np.log(s)

  a    2.484907

  b    0.000000

  c    1.945910

  d    2.197225

  dtype: float64

  ```


  #### 值评估


  Series 中经常有重复的值。这时你可能需要获取关于这些样本的更多信息，包括是否存在任何重复值，以及某个特定值是否存在于该 Series 中。


  在这方面，你可以声明一个包含许多重复值的 Series。


  ```

  >>> serd = pd.Series([1,0,2,1,2,3], index=[''white'',''white'',''blue'',''green'',''green'',''yellow''])

  >>> serd

  white     1

  white     0

  blue      2

  green     1

  green     2

  yellow    3

  dtype: int64

  ```


  要了解 Series 中包含的所有值（排除重复项），你可以使用 `unique()` 函数。返回值是一个数组，包含 Series 中的唯一值，尽管顺序可能不固定。


  ```

  >>> serd.unique()

  array([1, 0, 2, 3], dtype=int64)

  ```


  与 `unique()` 类似的一个函数是 `value_counts()`，它不仅返回唯一值，还会计算这些值在 Series 中出现的次数。


  ```

  >>> serd.value_counts()

  2    2

  1    2

  3    1

  0    1

  dtype: int64

  ```


  最后，`isin()` 用于评估成员关系，即给定的值列表。此函数告诉你这些值是否包含在数据结构中。返回的布尔值在筛选 Series 或 DataFrame 列中的数据时非常有用。


  ```

  >>> serd.isin([0,3])

  white     False

  white      True

  blue      False

  green     False

  green     False

  yellow     True

  dtype: bool

  >>> serd[serd.isin([0,3])]

  white     0

  yellow    3

  dtype: int64

  ```


  #### NaN 值


  前面的例子尝试计算负数的对数，结果得到了 `NaN`。这个特定的值 `NaN`（Not a Number，非数字）在 `pandas` 数据结构中用于表示存在空字段或无法用数值定义的内容。


  通常，这些 `NaN` 值是一个问题，必须通过某种方式进行管理，尤其是在数据分析期间。这些数据通常在从有问题的来源提取数据或来源缺少数据时生成。此外，正如你刚刚看到的，`NaN`
  值也可能在特殊情况下生成，例如计算负值的对数，或某些计算或函数执行过程中出现异常。在后面的章节中，你将看到如何应用不同的策略来解决 `NaN` 值的问题。


  尽管 `NaN` 值具有问题性质，但 `pandas` 允许你显式地定义 `NaN` 并将它们添加到数据结构（如 Series）中。在包含值的数组中，你可以在任何想要定义缺失值的地方输入
  `np.NaN`。


  ```

  >>> s2 = pd.Series([5,-3,np.NaN,14])

  >>> s2

  0     5.0

  1    -3.0

  2   NaN

  3    14.0

  dtype: float64

  ```


  `isnull()` 和 `notnull()` 函数对于识别没有值的索引非常有用。


  ```

  >>> s2.isnull()

  0    False

  1    False

  2     True

  3    False

  dtype: bool

  >>> s2.notnull()

  0     True

  1     True

  2    False

  3     True

  dtype: bool

  ```


  实际上，这些函数返回两个包含布尔值的 Series，根据对应项是否为 `NaN` 值来包含 `True` 和 `False` 值。`isnull()` 函数对
  Series 中的 `NaN` 值返回 `True`；反过来，`notnull()` 函数在值不是 `NaN` 时返回 `True`。这些函数通常被放在过滤器内部以构成条件。


  ```

  >>> s2[s2.notnull()]

  0     5.0

  1    -3.0

  3    14.0

  dtype: float64

  >>> s2[s2.isnull()]

  2   NaN

  dtype: float64

  ```


  #### Series 作为字典


  另一种看待 Series 的方式是将其视为一个 `dict`（字典）对象。这种相似性在定义 Series 对象时也得到了利用。事实上，你可以从之前定义好的 `dict`
  创建一个 Series。


  ```

  >>> mydict = {''red'': 2000, ''blue'': 1000, ''yellow'': 500,

  ''orange'': 1000}

  >>> myseries = pd.Series(mydict)

  >>> myseries

  red       2000

  blue      1000

  yellow     500

  orange    1000

  dtype: int64

  ```


  从这个例子可以看出，索引数组由键填充，而数据则由相应的值填充。你也可以单独定义索引数组。在这种情况下，会检查 `dict` 的键与索引标签数组之间的对应关系。如果存在不匹配，`pandas`
  会添加 `NaN` 值。


  ```

  >>> colors = [''red'',''yellow'',''orange'',''blue'',''green'']

  >>> myseries = pd.Series(mydict, index=colors)

  >>> myseries

  red       2000.0

  yellow     500.0

  orange    1000.0

  blue      1000.0

  green      NaN

  dtype: float64

  ```


  #### Series 之间的运算


  你已经看到了如何在 Series 和标量值之间执行算术运算。在两个 Series 之间执行运算也是可能的，但这时标签也会发挥作用。


  事实上，这类数据结构的一大潜力在于，Series 可以通过识别它们之间对应的标签，来对齐地址不同的数据。


  在下面的例子中，你将两个仅在标签上有一些共同元素的 Series 相加。


  ```

  >>> mydict2 = {''red'':400,''yellow'':1000,''black'':700}

  >>> myseries2 = pd.Series(mydict2)

  >>> myseries + myseries2

  black      NaN

  blue       NaN

  green      NaN

  orange     NaN

  red       2400.0

  yellow    1500.0

  dtype: float64

  ```


  你得到一个新的 Series 对象，其中只有具有相同标签的项被相加了。存在于两个 Series 之一中的所有其他标签仍然会被添加到结果中，但其值为 `NaN`。


  ### DataFrame


  *DataFrame* 是一种表格化的数据结构，与电子表格非常相似。这种数据结构旨在将 Series 扩展到多个维度。实际上，DataFrame 由有序的列集合组成（参见图
  4-7），每一列都可以包含不同类型的值（数值型、字符串、布尔型等）。


  一个数据框结构包含 2 列：索引和列。列有三个子列，分别标记为颜色、对象和价格。行展示了各列对应的数据。


  **图 4-7** DataFrame 结构


  与 Series（其有一个包含每个元素关联标签的索引数组）不同，DataFrame 有两个索引数组。第一个与行关联的索引数组，其功能与 Series 中的索引数组非常相似。实际上，每个标签都与该行中的所有值相关联。第二个数组包含一系列标签，每个标签都与一个特定的列相关联。


  DataFrame 也可以被理解为一个由 Series 组成的 `dict`，其中键是列名，值是构成 DataFrame 各列的 Series。此外，每个 Series
  中的所有元素都根据一个称为*索引*的标签数组进行映射。





  #### 定义数据框


  创建新数据框最常见的方式是将一个`dict`对象传递给`DataFrame()`构造函数。这个`dict`对象包含你想定义的每一列的键，并为每个键对应一个包含值的数组。


  ```

  >>> data = {''color'' : [''blue'',''green'',''yellow'',''red'',''white''],

  ''object'' : [''ball'',''pen'',''pencil'',''paper'',''mug''],

  ''price'' : [1.2,1.0,0.6,0.9,1.7]}

  >>> frame = pd.DataFrame(data)

  >>> frame

  color  object price

  0    blue    ball   1.2

  1   green     pen   1.0

  2  yellow  pencil   0.6

  3     red   paper   0.9

  4   white     mug   1.7

  ```


  如果你正在使用 Jupyter 并运行此命令，你将不会得到与在 Python 控制台中相同的经典输出。相反，你会得到数据框的图形化表示，如图 4-8 所示。


  ![](img/336498_3_En_4_Fig8_HTML.jpg)


  一个包含 color、object 和 price 三列以及从 0 到 4 共 5 行的表格。color 列下 5 行的数据如下：blue、green、yellow、red、white。object
  列下 5 行的数据如下：ball、pen、pencil、paper、mug。price 列下 5 行的数据如下：1.2、1.0、0.6、0.9、1.7。


  **图 4-8** 在 Jupyter Notebook 上运行后得到的数据框图形化结果


  如果你想从中创建数据框的`dict`对象包含的数据多于你感兴趣的部分，你可以进行选择。在数据框的构造函数中，你可以使用`columns`选项指定一个列序列。列将按照序列的顺序创建，无论它们在`dict`对象中是如何存放的。


  ```

  >>> frame2 = pd.DataFrame(data, columns=[''object'',''price''])

  >>> frame2

  object price

  0    ball   1.2

  1     pen   1.0

  2  pencil   0.6

  3   paper   0.9

  4     mug   1.7

  ```


  即使对于数据框对象，如果没有在`index`数组中显式指定标签，pandas 也会自动分配一个从 0 开始的数字序列。相反，如果你想为数据框的索引分配标签，则必须使用`index`选项并为其分配一个包含标签的数组。


  ```

  >>> frame2 = pd.DataFrame(data, index=[''one'',''two'',''three'',''four'',''five''])

  >>> frame2

  color  object  price

  one      blue    ball    1.2

  two     green     pen    1.0

  three  yellow  pencil    0.6

  four      red   paper    0.9

  five    white     mug    1.7

  ```


  既然我已经介绍了这两个名为`index`和`columns`的新选项，那么很容易想象出定义数据框的另一种方法。你可以不使用`dict`对象，而是在构造函数中按以下顺序定义三个参数：一个数据矩阵、一个分配给`index`选项的包含标签的数组，以及一个分配给`columns`选项的包含列名的数组。


  在许多示例中，正如你从现在开始将在本书中看到的，为了快速简便地创建一个值矩阵，你可以使用`np.arange(16).reshape((4,4))`，它会生成一个从
  0 递增到 15 的 4x4 矩阵。


  ```

  >>> frame3 = pd.DataFrame(np.arange(16).reshape((4,4)),

  ...                   index=[''red'',''blue'',''yellow'',''white''],

  ...                   columns=[''ball'',''pen'',''pencil'',''paper''])

  >>> frame3

  ball  pen  pencil  paper

  red        0    1       2      3

  blue       4    5       6      7

  yellow     8    9      10     11

  white     12   13      14     15

  ```


  #### 选择元素


  如果你想知道数据框的所有列名，可以在数据框对象实例上指定`columns`属性。


  ```

  >>> frame.columns

  Index([''colors'', ''object'', ''price''], dtype=''object'')

  ```


  类似地，要获取索引列表，你应该指定`index`属性。


  ```

  >>> frame.index

  RangeIndex(start=0, stop=5, step=1)

  ```


  你也可以使用`values`属性获取数据结构中包含的整个数据集。


  ```

  >>> frame.values

  array([[''blue'', ''ball'', 1.2],

  [''green'', ''pen'', 1.0],

  [''yellow'', ''pencil'', 0.6],

  [''red'', ''paper'', 0.9],

  [''white'', ''mug'', 1.7]], dtype=object)

  ```


  或者，如果你只对选择某一列的内容感兴趣，可以写入该列的名称。


  ```

  >>> frame[''price'']

  0    1.2

  1    1.0

  2    0.6

  3    0.9

  4    1.7

  Name: price, dtype: float64

  ```


  如你所见，返回值是一个 Series 对象。另一种实现方式是使用列名作为数据框实例的一个属性。


  ```

  >>> frame.price

  0    1.2

  1    1.0

  2    0.6

  3    0.9

  4    1.7

  Name: price, dtype: float64

  ```


  对于数据框中的行，可以使用`loc`属性并传入要提取的行的索引值。


  ```

  >>> frame.loc[2]

  color     yellow

  object    pencil

  price        0.6

  Name: 2, dtype: object

  ```


  返回的对象又是一个 Series，其中列名变成了数组索引的标签，值则成为了 Series 的数据。


  要选择多行，你可以指定一个包含要插入的行序列的数组：


  ```

  >>> frame.loc[[2,4]]

  color  object  price

  2  yellow  pencil    0.6

  4   white     mug    1.7

  ```


  如果你需要提取数据框的一部分，选择要提取的行，可以使用索引的引用编号。实际上，你可以将一行视为数据框的一部分，它以行的索引作为起始值（在接下来的例子中为 0），并以你想要的行之上的行作为结束值（在接下来的例子中）。


  ```

  >>> frame[0:1]

  color object  price

  0  blue   ball    1.2

  ```


  如你所见，返回值是一个包含单行的 DataFrame 对象。如果你需要多行，必须扩展选择范围。


  ```

  >>> frame[1:3]

  color  object  price

  1   green     pen    1.0

  2  yellow  pencil    0.6

  ```


  最后，如果你想要获取数据框中的单个值，可以先使用列名，然后再使用行的索引或标签。


  ```

  >>> frame[''object''][3]

  ''paper''

  ```




  ## 赋值


  一旦你理解了如何访问构成数据框（dataframe）的各种元素，你就可以遵循相同的逻辑来添加或修改其中的值。


  例如，你已经看到，在数据框结构中，索引数组由 `index` 属性指定，包含列名的行由 `columns` 属性指定。那么，你也可以使用 `name` 属性为这两个子结构分配一个标签来标识它们。


  ```

  >>> frame.index.name = ''id''

  >>> frame.columns.name = ''item''

  >>> frame

  item   color  object  price

  id

  0       blue    ball    1.2

  1      green     pen    1.0

  2     yellow  pencil    0.6

  3        red   paper    0.9

  4      white     mug    1.7

  ```


  pandas 数据结构的最佳特性之一是其高度的灵活性。实际上，你可以在任何层级进行干预以改变内部数据结构。例如，一个非常常见的操作是添加一个新列。


  你可以通过简单地给数据框的实例赋值并指定一个新的列名来实现这一点。


  ```

  >>> frame[''new''] = 12

  >>> frame

  colors  object price  new

  0    blue    ball   1.2   12

  1   green     pen   1.0   12

  2  yellow  pencil   0.6   12

  3     red   paper   0.9   12

  4   white     mug   1.7   12

  ```


  从这个结果可以看出，新增了一个名为 `new` 的列，其值为 `12`，并复制到了每个元素中。


  但是，如果你想更新某个列的内容，则必须使用一个数组。


  ```

  >>> frame[''new''] = [3.0,1.3,2.2,0.8,1.1]

  >>> frame

  color  object  price  new

  0    blue    ball    1.2  3.0

  1   green     pen    1.0  1.3

  2  yellow  pencil    0.6  2.2

  3     red   paper    0.9  0.8

  4   white     mug    1.7  1.1

  ```


  如果你想更新整列，可以采用类似的方法，例如使用 `np.arange()` 函数用预定的序列更新列的值。


  数据框的列也可以通过将序列（series）赋值给其中一列来创建，例如通过使用 `np.arange()` 指定一个包含递增数值的序列。


  ```

  >>> ser = pd.Series(np.arange(5))

  >>> ser

  0    0

  1    1

  2    2

  3    3

  4    4

  dtype: int32

  >>> frame[''new''] = ser

  >>> frame

  color  object  price  new

  0    blue    ball    1.2    0

  1   green     pen    1.0    1

  2  yellow  pencil    0.6    2

  3     red   paper    0.9    3

  4   white     mug    1.7    4

  ```


  最后，要更改单个值，只需选中该项并赋予其新值。这个操作看起来非常简单直观。为了访问元素，我可以想到先插入列索引，再插入行索引，从而获取当前值。


  实际上，如果我编写以下命令：


  ```

  >>> frame[''price''][2]

  0.6

  ```


  我确实得到了数据框中相应元素的值。但如果我尝试对该元素进行赋值以修改其值，则会收到一个警告消息。


  ```

  >>> frame[''price''][2] = 3.3

  SettingWithCopyWarning:

  A value is trying to be set on a copy of a slice from a DataFrame

  ```


  然而，如果检查数据框内部，我发现该元素的值已经被修改了。


  ```

  >>> frame

  color  object  price  new

  0    blue    ball    1.2    0

  1   green     pen    1.0    1

  2  yellow  pencil    3.3    2

  3     red   paper    0.9    3

  4   white     mug    1.7    4

  ```


  实际上，该消息警告你，这种命名方式在处理内部切片（可能生成副本或视图）时可能导致赋值错误。在这个简单案例中不会发生，但在更复杂的情况（涉及带有索引列表和条件的复杂索引赋值）下，则可能发生。因此，编写先前命令的更正确、更清晰的方式是通过
  `loc()` 函数定义数据框切片的索引以进行选择/赋值。


  ```

  >>> frame.loc[ 2, ''price''] = 3.3

  ```


  ## 值成员资格


  你已经见过应用于序列（series）以确定值集合成员资格的 `isin()` 函数。这个功能同样适用于数据框对象。


  ```

  >>> frame.isin([1.0,''pen''])

  color object  price  new

  0  False  False  False  False

  1  False   True   True  True

  2  False  False  False  False

  3  False  False  False  False

  4  False  False  False  False

  ```


  你将得到一个包含布尔值的数据框，其中 `True` 表示满足成员资格条件的值。如果你将返回的值作为条件传递，你将得到一个新的数据框，其中只包含满足条件的值。


  ```

  >>> frame[frame.isin([1.0,''pen''])]

  color object  price  new

  0   NaN    NaN    NaN  NaN

  1   NaN    pen    1.0  1.0

  2   NaN    NaN    NaN  NaN

  3   NaN    NaN    NaN  NaN

  4   NaN    NaN    NaN  NaN

  ```


  ## 删除列


  如果你想删除整列及其所有内容，请使用 `del` 命令。


  ```

  >>> del frame[''new'']

  >>> frame

  colors  object price

  0    blue    ball   1.2

  1   green     pen   1.0

  2  yellow  pencil   3.3

  3     red   paper   0.9

  4   white     mug   1.7

  ```


  ## 过滤


  即使是数据框，你也可以通过应用某些条件来进行过滤。例如，假设你想获取所有列值低于某个阈值的元素，例如价格低于 1.2 的元素。你只需将此条件插入数据框的索引中。


  ```

  >>> frame[frame[''price''] < 1.2]

  colors  object price

  1   green     pen   1.0

  3     red   paper   0.9

  ```


  你将得到一个数据框，其中仅包含价格低于 1.2 的元素，并保持其原始位置。这样，你就对数据框的元素执行了过滤操作。


  ## 从嵌套字典创建数据框


  Python 中一种非常常见的数据结构是嵌套的 `dict`，如下所示：


  ```

  nestdict = { ''red'': { 2012: 22, 2013: 33 },

  ''white'': { 2011: 13, 2012: 22, 2013: 16},

  ''blue'': {2011: 17, 2012: 27, 2013: 18}}

  ```


  当这种数据结构被直接作为参数传递给 `DataFrame()` 构造器时，pandas 会将其解释为：外部键作为列名，内部键作为索引标签。


  在解释嵌套结构的过程中，可能并非所有字段都能成功匹配。pandas 通过向缺失值添加 `NaN` 值来弥补这种不一致。


  ```

  >>> nestdict = {''red'':{2012: 22, 2013: 33},

  ...             ''white'':{2011: 13, 2012: 22, 2013: 16},

  ...             ''blue'': {2011: 17, 2012: 27, 2013: 18}}

  >>> frame2 = pd.DataFrame(nestdict)

  >>> frame2

  red  white  blue

  2012  22.0     22    27

  2013  33.0     16    18

  2011   NaN     13    17

  ```


  ## 数据框的转置


  在处理表格数据结构时，你可能需要执行的操作之一是转置（即列变为行，行变为列）。pandas 允许你以非常简单的方式实现这一点。你可以通过在数据框后添加 `T`
  属性来获取其转置。


  ```

  >>> frame2.T

  2012  2013  2011

  red    22.0  33.0   NaN

  white  22.0  16.0  13.0

  blue   27.0  18.0  17.0

  ```



