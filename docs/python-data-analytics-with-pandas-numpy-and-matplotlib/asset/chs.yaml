  \ 和 (0.075, 175) 之间。数值为近似值。\n\n**图 8-10**\n\n\n\n线性回归表示特征与目标之间的线性相关性。\n\n实际上，糖尿病数据集中有十个生理因素。因此，为了更全面地了解整个训练集，你可以为每个生理特征创建一个线性回归模型，从而生成十个模型，并通过线性图表观察每个模型的结果。\n\
