  ## 前言


  距离本书上一版出版已有大约五年时间。在起草第三版时，我对文字和代码都进行了一些必要的修改。首先，所有 Python 代码已移植到 3.8 及以上版本，并且删除了所有对
  Python 2.x 版本的引用。部分章节由于内容不再兼容而需要完全重写。我指的是 TensorFlow 3.x，与上一版涵盖的 TensorFlow 2.x
  相比，它已经完全革新了整个参考系统。在五年间，使用 2.x 版本开发的深度学习模块和代码已被证明完全不可用。`Keras` 及其所有模块已并入 TensorFlow
  库，取代了所有执行类似功能的类、函数和模块。神经网络模型的构建、其学习阶段以及所使用的函数都已完全改变。因此，在这一版中，您将有机会学习 TensorFlow
  3.x 的方法，并熟悉新版本中的概念和新的范式。关于数据可视化，我决定在 matplotlib 章节中增加关于 `Seaborn` 库的信息。尽管仍处于 0.x
  版本，但 `Seaborn` 已被证明是 matplotlib 在数据分析方面一个非常有用的扩展，这要归功于其统计图形显示以及与 pandas 数据框的兼容性。我希望，通过这个全面更新的第三版，我能进一步激发您使用
  Python 学习并深化数据分析的热情。这本书现在将成为您宝贵的学习工具，未来也能作为可靠的手册。


  > —Fabio Nelli


