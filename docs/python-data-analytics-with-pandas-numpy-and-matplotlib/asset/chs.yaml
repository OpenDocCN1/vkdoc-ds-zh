  \n**图 12-8** SLP 神经网络学习阶段的损失趋势\n\n您也可以使用以下代码行对模型进行数值化评估：\n\n```python\nmodel.evaluate(test_features,\
  \ test_labels)\n```\n\n输出：\n```\n313/313 [==============================] - 1s 1ms/step\
  \ - loss: 5.8654 - accuracy: 0.8925\n[5.865407466888428, 0.8924999833106995]\n```\n\
  \n从这些数值可以看出，0.89 的准确率并非最优，且损失值似乎没有大幅下降，而是稳定在 5.86 左右。\n\n让我们看看这个模型如何识别那些既未用于学习也未用于测试的手写数字。为此，我们额外留出了一个第三个数据集：`exp_features`。您在模型中添加了`Softmax`层，以便输出属于各个类别的概率。然后，让新训练好的\
  \ SLP 模型进行预测。\n\n```python\nprobability_model = tf.keras.Sequential([\n    model,\n\
  \    tf.keras.layers.Softmax()\n])\npredictions = probability_model.predict(exp_features)\n\
  ```\n\n输出：\n```\n157/157 [==============================] - 0s 981us/step\n```\n\
  \n现在取第一张待预测的图像，并查看其在十个数字上的识别概率。\n\n```python\npredictions[0]\n```\n\n输出：\n```\n\
