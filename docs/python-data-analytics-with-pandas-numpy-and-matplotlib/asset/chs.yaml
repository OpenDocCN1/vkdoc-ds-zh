  ```\n\n现在你拥有一个由 140 个观测值训练而成的、包含 `knn` 分类器的预测模型，接下来你将检验其有效性。该分类器应能正确预测测试集中十个观测值对应的鸢尾花物种。为了获得预测结果，你必须使用\
  \ `predict()` 函数，该函数将直接应用到预测模型 `knn` 上。最后，将预测结果与 `y_test` 中包含的实际观测结果进行比较。\n\n```\n\
  knn.predict(x_test)\nOut[ ]: array([1, 2, 1, 0, 0, 0, 2, 1, 2, 0])\ny_test\nOut[\
