  除了需要一个可运行的 Python 平台外，该库没有任何其他要求，因此安装它应该不会造成任何问题。通常，该模块作为基本包存在于大多数 Python 发行版中；但是，如果没有，你可以在之后安装它。


  然而，无论你使用什么平台，与你将在本书中使用的所有其他库一样，对于 `NumPy`，也建议使用 `Anaconda` 发行版的平台。这可以让你干净地管理 `NumPy`
  的安装方面，并轻松创建和管理用于安装它的虚拟环境。这样，你就可以使用不同的 Python 版本和 `NumPy` 版本来测试和开发代码，而无需每次都卸载并重新安装所有内容。


