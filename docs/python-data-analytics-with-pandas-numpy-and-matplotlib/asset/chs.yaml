  \ - 0s 0s/step - loss: 0.6938 - accuracy: 0.4545\nEpoch 7/2000\n1/1 [==============================]\
  \ - 0s 3ms/step - loss: 0.6931 - accuracy: 0.4545\nEpoch 8/2000\n1/1 [==============================]\
  \ - 0s 0s/step - loss: 0.6925 - accuracy: 0.4545\n...\n```\n\n对于这个模型，你还可以通过图表展示损失值随训练轮次增加的变化，来分析神经网络的学习阶段。\n\
  \n```\nacc_set = h.history['loss']\nepoch_set = h.epoch\n# 从一个大列表中每 50 项提取一项并返回列表\n\
  plt.plot(epoch_set[0::50], acc_set[0::50], 'o', label='训练阶段')\nplt.ylabel('损失')\n\
  plt.xlabel('轮次')\nplt.legend()\n```\n\n运行代码后，你将得到如图 9-16 所示的图表。\n\n![](img/336498_3_En_9_Fig16_HTML.jpg)\n\
