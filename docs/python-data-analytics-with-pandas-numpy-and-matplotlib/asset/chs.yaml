  \n## 结论\n\n在本章中，你了解了机器学习中一个以神经网络为计算结构的分支——深度学习。你阅读了深度学习基本概念的概述，这包括神经网络及其结构。最后，借助\
  \ TensorFlow 库，你实现了不同类型的神经网络，例如单层感知机和多层感知机。\n\n深度学习及其各种技术和算法是一个非常复杂的主题，在一章中很难充分讲解。然而，你现在已经熟悉了深度学习，可以开始实现更复杂的神经网络了。\n\
  \n"
- "# 10. 示例——气象数据\n\n互联网上较易获取的一类数据是气象数据。许多网站提供关于气压、温度、湿度、降雨量等多种气象参数的历史数据。你只需指定地点和日期，就能得到一个包含气象站测量数据集的文件。这些数据蕴藏着广泛的信息。正如你在本书第一章中读到的，数据分析的目的是将原始数据转化为信息，再进一步转化为知识。\n\
  \n在本章中，你将看到一个如何使用气象数据的简单示例。这个示例有助于你大致了解如何应用前几章中提到的许多技术。\n\n## 待检验的假设：临海距离的影响\n\n\
  在撰写本章时，正值夏初，气温不断升高。每逢周末，许多内陆居民会前往山区村庄或海滨城市，以享受一丝清凉，远离内陆城市的闷热天气。这一现象一直让我好奇：临海距离对气候有何影响？\n\
  \n这个简单的问题可以成为数据分析的一个良好起点。我并不想将本章内容伪装成严谨的科学结论；它只是为了给那些热爱数据分析的人提供一种将知识付诸实践的方式，以回答这个问题——临海距离对当地气候有何影响（如果有的话）？\n\
  \n\n\n### 研究中的系统：亚得里亚海与波河平原\n\n问题定义之后，就需要寻找一个非常适合研究数据、并为该问题提供合适背景的系统。\n\n首先，你需要一片海。好吧，我人在意大利，有很多海可以选择，因为意大利是一个被海洋包围的半岛。为什么要把自己局限在意大利呢？嗯，这个问题涉及一种典型的意大利人行为，即他们在夏季会躲到靠近海的地方，以避开内陆的炎热。由于不清楚其他国家的人是否有同样行为，我将只把意大利作为研究系统。\n\
  \n但我们应该考虑研究意大利的哪些区域呢？我们能否评估不同距离下海洋的影响？这会带来很多问题。事实上，意大利山区众多，且没有太多内陆延伸数千公里、地形均匀的土地。因此，为了评估海洋的影响，我把山脉排除在外，因为它们可能会引入许多其他影响气候的因素，例如海拔。\n\
  \n意大利非常适合进行这项评估的区域是波河平原。这片平原从亚得里亚海开始，向内陆延伸数百公里（见图 10-1）。它被山脉环绕，但山谷的宽度减轻了任何山脉效应。这里也有许多城镇，因此很容易选择一组离海越来越远的城市，以便在这次评估中覆盖近\
  \ 400 公里的距离。\n\n![](img/336498_3_En_10_Fig1_HTML.png)\n\n一张谷歌地图截图，突出显示了意大利北部地区，包括米兰、都灵、热那亚、博洛尼亚、威尼斯和其他地点。\n\
  \n**图 10-1** – 波河平原与亚得里亚海图像（谷歌地图）\n\n第一步是选择一组十个城市作为参考标准。选择这些城市是为了覆盖整个平原的范围（见图 10-2）。\n\
  \n![](img/336498_3_En_10_Fig2_HTML.png)\n\n一张谷歌地图截图，在意大利地图上突出显示了米兰、都灵、阿斯蒂、皮亚琴察、曼托瓦、费拉拉、博洛尼亚、法恩扎、切塞纳、拉文纳和科马基奥等地区。\n\
  \n**图 10-2** – 选为样本的十个城市（还有一个用作离海距离的参考点）\n\n在图 10-2 中，你可以看到被选中用于分析天气数据的十个城市：五个城市在最初的\
  \ 100 公里内，另外五个分布在剩余的 300 公里内。\n\n以下是选定的城市：\n\n-   费拉拉\n-   都灵\n-   曼托瓦\n-   米兰\n\
  -   拉文纳\n-   阿斯蒂\n-   博洛尼亚\n-   皮亚琴察\n-   切塞纳\n-   法恩扎\n\n现在你需要确定这些城市离海的距离。你可以通过多种步骤获得这些数值。在这种情况下，你可以使用\
  \ TheDistanceNow 网站（[`www.thedistancenow.com/`](http://www.thedistancenow.com/)）提供的服务，该网站支持多种语言（见图\
  \ 10-3）。\n\n![](img/336498_3_En_10_Fig3_HTML.jpg)\n\n一张 Distance Now 网页的截图。标题写着测量城市间的距离。它提供两个文本框用于输入城市名称。有一个标有“开始”的按钮用于测量距离。\n\
  \n**图 10-3** – TheDistanceNow 网站允许你计算两个城市之间的距离\n\n借助这项服务，可以计算出这些城市离海的近似距离。你可以通过选择一个沿海城市作为目的地来实现。对于其中许多城市，可以选择科马基奥市作为参考点来计算离海的距离（见图\
  \ 10-2）。一旦确定了这十个城市的距离，你将得到表 10-1 中所示的值。\n\n**表 10-1** – 十个城市离海的距离\n\n| 城市 | 距离（公里）\
  \ | 备注 |\n| :--- | :--- | :--- |\n| 拉文纳 | 8 | 使用谷歌地球测量 |\n| 切塞纳 | 14 | 使用谷歌地球测量\
  \ |\n| 法恩扎 | 37 | 法恩扎-拉文纳距离 + 8 公里 |\n| 费拉拉 | 47 | 费拉拉-科马基奥距离 |\n| 博洛尼亚 | 71 | 博洛尼亚-科马基奥距离\
  \ |\n| 曼托瓦 | 121 | 曼托瓦-科马基奥距离 |\n| 皮亚琴察 | 200 | 皮亚琴察-科马基奥距离 |\n| 米兰 | 250 | 米兰-科马基奥距离\
  \ |\n| 阿斯蒂 | 315 | 阿斯蒂-科马基奥距离 |\n| 都灵 | 357 | 都灵-科马基奥距离 |\n\n## 寻找数据源\n\n一旦定义了所研究的系统，就需要建立一个数据源，从中获取所需数据。通过浏览互联网，你可以发现许多提供世界各地不同地点气象数据的网站。其中一个网站是\
  \ OpenWeather，网址为 `openweathermap.org`（见图 10-4）。\n\n![](img/336498_3_En_10_Fig4_HTML.jpg)\n\
  \n一张截图显示了伦敦的天气详情，以及一张每小时气温预报的折线图和一张 8 天预报表格。顶部是一张伦敦地图，表明一小时内无降水。\n\n**图 10-4** –\
  \ OpenWeather 网站\n\n在你注册账户并收到一个应用程序 ID 代码后，该网站允许你通过指定城市，以 URL 请求的方式捕获数据。\n\n```\n\
  https://api.openweathermap.org/data/2.5/weather?q=Atlanta,US&appid=5807ad2a45eb6bf4e81d137dafe74e15\n\
  ```\n\n此请求将返回一个 JSON 文件，其中包含有关该城市当前天气状况的所有信息（见图 10-5）。此 JSON 文件将提交给 Python pandas\
  \ 库进行数据分析。\n\n![](img/336498_3_En_10_Fig5_HTML.png)\n\n一张截图显示了搜索栏中的一个 URL，以及底部的一个\
  \ JSON 文件。JSON 文件代表了亚特兰大的天气，其中包括薄雾、气压、温度、湿度、风、气压和云层的详细信息。\n\n**图 10-5** – 包含所查询城市气象数据的\
  \ JSON 文件\n\n\n\n## 在 Jupyter Notebook 上进行数据分析\n\n本章讲解如何使用 Jupyter Notebook 进行数据分析。它允许你逐步输入并学习代码片段。\n\
  \n服务启动后，创建一个新的 Notebook。\n\n首先，导入必要的库：\n\n```\nimport numpy as np\nimport pandas\
  \ as pd\nimport datetime\n```\n\n第一步是通过特定请求研究从站点接收到的数据结构。\n\n从研究选定的城市中选择一个城市，例如费拉拉，并使用指定的\
  \ URL 请求其当前气象数据。在没有浏览器的情况下，可以使用 `request.get().text` 函数获取页面的文本内容。由于获取的内容是 JSON 格式，你可以直接使用\
  \ `json.load()` 函数按照此格式读取接收到的文本。\n\n```\nimport json\nimport requests\nferrara =\
  \ json.loads(requests.get('https://api.openweathermap.org/data/2.5/weather?q=Ferrara,IT&appid=5807ad2a45eb6bf4e81d137dafe74e15').text)\n\
  ```\n\n现在你可以查看包含费拉拉市气象数据的 JSON 文件内容。\n\n```\nferrara\nOut [ ]:\n{'coord': {'lon':\
  \ 11.8333, 'lat': 44.8},\n'weather': [{'id': 804,\n'main': 'Clouds',\n'description':\
  \ 'overcast clouds',\n'icon': '04d'}],\n'base': 'stations',\n'main': {'temp': 292.51,\n\
  'feels_like': 292.22,\n'temp_min': 292.04,\n'temp_max': 293.74,\n'pressure': 1017,\n\
  'humidity': 66,\n'sea_level': 1017,\n'grnd_level': 1017},\n'visibility': 10000,\n\
  'wind': {'speed': 2.68, 'deg': 50, 'gust': 7.76},\n'clouds': {'all': 100},\n'dt':\
  \ 1685511558,\n'sys': {'type': 2,\n'id': 2007888,\n'country': 'IT',\n'sunrise':\
  \ 1685503859,\n'sunset': 1685558996},\n'timezone': 7200,\n'id': 3177088,\n'name':\
  \ 'Provincia di Ferrara',\n'cod': 200}\n```\n\n当你想要分析 JSON 文件的结构时，以下命令很有用：\n\n```\n\
  list(ferrara.keys())\nOut [ ]:\n['coord',\n'weather',\n'base',\n'main',\n'visibility',\n\
  'wind',\n'clouds',\n'dt',\n'sys',\n'id',\n'name',\n'cod']\n```\n\n这样，你就可以获得构成 JSON\
  \ 文件内部结构的所有键的列表。一旦知道了这些键的名称，就可以轻松访问内部数据。\n\n```\nprint('Coordinates = ', ferrara['coord'])\n\
  print('Weather = ', ferrara['weather'])\nprint('base = ', ferrara['base'])\nprint('main\
  \ = ', ferrara['main'])\nprint('visibility = ', ferrara['visibility'])\nprint('wind\
  \ = ', ferrara['wind'])\nprint('clouds = ', ferrara['clouds'])\nprint('dt = ', ferrara['dt'])\n\
  print('sys = ', ferrara['sys'])\nprint('id = ', ferrara['id'])\nprint('name = ',\
  \ ferrara['name'])\nprint('cod = ', ferrara['cod'])\nOut [ ]:\nCoordinates =  {'lon':\
