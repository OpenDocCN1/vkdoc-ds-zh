  \ 442 个整数值。\n\n## 线性回归：最小二乘回归\n\n线性回归是一种使用训练集中包含的数据来构建线性模型的过程。最简单的模型基于一条`直线`的方程，并用两个参数\
  \ `a` 和 `b` 来表征它。计算这些参数的目标是使残差平方和尽可能小。\n\n![$$ y={a}^{\\ast }x+c $$\n\n在这个表达式中，`x`\
  \ 是训练集，`y` 是目标值，`b` 是斜率，`c` 是模型所表示的`直线`的截距。在 `scikit-learn` 中，要使用线性回归的预测模型，必须导入\
  \ `linear_model` 模块，然后使用制造者 `LinearRegression()` 构造函数创建预测模型，并将其命名为 `linreg`。\n\n\
  ```python\nfrom sklearn import linear_model\nlinreg = linear_model.LinearRegression()\n\
  ```\n\n为了练习一个线性回归的示例，你可以使用前面描述的糖尿病数据集。首先，你需要将 442 名患者分成一个训练集（由前 422 名患者组成）和一个测试集（由最后\
  \ 20 名患者组成）。\n\n```python\nfrom sklearn import datasets\ndiabetes = datasets.load_diabetes()\n\
  x_train = diabetes.data[:-20]\ny_train = diabetes.target[:-20]\nx_test = diabetes.data[-20:]\n\
  y_test = diabetes.target[-20:]\n```\n\n现在，通过使用 `fit()` 函数将训练集应用于预测模型。\n\n```python\n\
  linreg.fit(x_train,y_train)\nOut[ ]: LinearRegression()\n```\n\n模型训练完成后，你可以使用预测模型的\
