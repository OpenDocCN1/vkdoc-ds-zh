- '# 11. 在 IPython Notebook 中嵌入 JavaScript D3 库


  在本章中，你将学习如何通过在 Jupyter Notebook 中包含 JavaScript D3 库来扩展图形表示的能力。该库具有巨大的图形潜力，并允许你构建即使是`matplotlib`库也无法表示的图形表示。


  在讲解各种示例的过程中，你将看到如何利用 Jupyter Notebook 强大的集成能力，在 Python 环境中实现 JavaScript 代码。你还将了解使用
  pandas 数据框中包含的数据以及基于 JavaScript 代码的表示的不同方式。




  ## 人口统计数据开放数据源


  在本章中，你将使用人口统计数据作为执行分析的数据集。本章以美国人口普查局网站（[www.​census.​gov](http://www.census.gov)）作为人口统计数据的数据源（见图
  11-1）。


