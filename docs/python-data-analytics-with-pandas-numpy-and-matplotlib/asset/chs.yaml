  \n## 使用多层感知器（MLP）进行学习与预测\n\n鉴于 SLP 模型的成绩尚可，本节将构建一个更为复杂的神经网络，拥有更多层和更多神经元。该网络使用带有一个隐藏层的多层感知器（MLP）模型来预测手写数字。此外，它将第一层的神经元数量增加到\
  \ 256 个，并为其隐藏层再增加 128 个神经元。输出层保持不变，为十个神经元（待分类的十个数字）。\n\n```\nmodel = tf.keras.Sequential([\n\
  \    tf.keras.layers.Normalization(),\n    tf.keras.layers.Flatten(input_shape=(28,\
  \ 28)),\n    tf.keras.layers.Dense(256, activation='sigmoid'),\n    tf.keras.layers.Dense(128,\
  \ activation='sigmoid'),\n    tf.keras.layers.Dense(10, activation='sigmoid')\n\
  ])\n```\n\n您可以编译模型，并使用与前一个模型相同数量（20）的轮次进行训练。\n\n```\nmodel.compile(optimizer='adam',\n\
  \              loss='sparse_categorical_crossentropy',\n              metrics=['accuracy'])\n\
  h = model.fit(train_features, train_labels, epochs=20)\nOut [ ]:\nEpoch 1/20\n1719/1719\
  \ [==============================] - 4s 2ms/step - loss: 0.4885 - accuracy: 0.8658\n\
  Epoch 2/20\n1719/1719 [==============================] - 4s 2ms/step - loss: 0.3243\
  \ - accuracy: 0.9013\nEpoch 3/20\n1719/1719 [==============================] - 3s\
  \ 2ms/step - loss: 0.2935 - accuracy: 0.9093\nEpoch 4/20\n1719/1719 [==============================]\
  \ - 3s 2ms/step - loss: 0.2630 - accuracy: 0.9171\nEpoch 5/20\n1719/1719 [==============================]\
  \ - 3s 2ms/step - loss: 0.2423 - accuracy: 0.9250\nEpoch 6/20\n1719/1719 [==============================]\
  \ - 3s 2ms/step - loss: 0.2370 - accuracy: 0.9268\nEpoch 7/20\n...\n```\n\n您也可以以图形方式观察模型学习阶段中的损失趋势。\n\
  \n```\nacc_set = h.history['loss']\nepoch_set = h.epoch\nplt.plot(epoch_set, acc_set,\
  \ 'o', label='Training phase')\nplt.ylabel('loss')\nplt.xlabel('epoch')\nplt.legend()\n\
  ```\n\n执行上述代码，您将得到如图 12-13 所示的图。\n\n![](img/336498_3_En_12_Fig13_HTML.jpg)\n\n一个关于损失值与轮次的数据点图。数据代表训练阶段。该图从(0.0,\
  \ 0.49)开始，下降至(0.9, 0.3)，然后逐渐减少到(18, 0.10)。数据为估计值。\n\n### 图 12-13\n图像显示了训练阶段中损失值是如何被优化的\n\
