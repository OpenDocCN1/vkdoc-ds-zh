  ## pandas：Python 数据分析库


  pandas 是一个用于高度专业化数据分析的开源 Python 库。它目前是所有使用 Python 语言的专业人士为分析和决策的统计目的而需要学习的参考点。


  该库主要由 Wes McKinney 从 2008 年开始设计并开发。2012 年，他的一位同事 Sien Chang 加入了开发。他们共同建立了 Python
  社区中使用最广泛的库之一。


  pandas 源于对特定数据分析库的需求，该库能以尽可能简单的方式提供所有用于数据处理、数据提取和数据操作的工具。


  这个 Python 包是基于 NumPy 库设计的。这一选择对于 pandas 的成功和快速传播至关重要。事实上，这一选择不仅使该库与大多数其他模块兼容，而且还利用了
  NumPy 模块的高质量。


  另一个基本选择是为数据分析设计专门的*ad hoc*数据结构。实际上，与其使用 Python 内置或其他库提供的现有数据结构，不如开发两种新的数据结构。


  这些数据结构旨在处理关系数据或有标签数据，从而使您能够管理与 SQL 关系数据库和 Excel 电子表格设计的功能相似的数据。


  事实上，在整本书中，您将看到一系列用于数据分析的基本操作，这些操作通常在数据库表和电子表格上使用。pandas 实际上提供了一组扩展的函数和方法，使您能够高效地执行这些操作。


  因此，pandas 的主要目的是为所有接近数据分析世界的人提供所有的构建模块。




  ## 安装 pandas


  安装 pandas 库最简单且通用的方法是使用预打包的解决方案，即通过 Anaconda 发行版进行安装。事实上，多年来，该发行版已围绕数据分析环境不断发展，成为了该领域从业者的参考平台。除了
  pandas，它还可提供许多其他专门用于数据分析、机器学习和数据可视化的库。它还提供了实用的开发与分析工具，以及 Jupyter Notebook。


  ### 通过 Anaconda 安装


