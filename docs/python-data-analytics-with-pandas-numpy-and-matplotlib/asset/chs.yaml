  \ d\nDownload which package (l=list; x=cancel)?\nIdentifier> gutenberg\n```\n\n\
  此时，包将开始下载。\n\n当你已经知道要下载的包名称时，只需输入命令`nltk.download()`，并将包名称作为参数传入。这将不会打开 NLTK 下载器工具，而是直接下载所需的包。因此，之前的操作等效于编写：\n\
  \n```\nnltk.download ('gutenberg')\n```\n\n下载完成后，你可以通过`fileids()`函数查看包的内容，该函数会显示其中包含的文件名称。\n\
  \n```\ngb = nltk.corpus.gutenberg\nprint (\"Gutenberg files:\", gb.fileids ())\n\
  ```\n\n终端上将显示一个数组，其中包含`gutenberg`包中的所有文本文件。\n\n```\nOut [ ]:\nGutenberg files :\
  \  ['austen-emma.txt', 'austen-persuasion.txt', 'austen-sense.txt', 'bible-kjv.txt',\
  \ 'blake-poems.txt', 'bryant-stories.txt', 'burgess-busterbrown.txt', 'carroll-alice.txt',\
  \ 'chesterton-ball.txt', 'chesterton-brown.txt', 'chesterton-thursday.txt', 'edgeworth-parents.txt',\
  \ 'melville-moby_dick.txt', 'milton-paradise.txt', 'shakespeare-caesar.txt', 'shakespeare-hamlet.txt',\
  \ 'shakespeare-macbeth.txt', 'whitman-leaves.txt']\n```\n\n要访问其中一个文件的内部内容，你首先选择一个文件，例如莎士比亚的《麦克白》（`shakespeare-macbeth.txt`），然后将其赋值给一个方便的变量。一种提取模式是用于提取单词，即你想创建一个以单词为元素的数组。为此，你需要使用`words()`函数。\n\
  \n```\nmacbeth = nltk.corpus.gutenberg.words ('shakespeare-macbeth.txt')\n```\n\n\
  如果你想查看此文本的长度（以单词计），可以使用`len()`函数。\n\n```\nlen (macbeth)\nOut [ ]:\n\n```\n\n用于这些示例的文本因此由\
  \ 23,140 个单词组成。\n\n`macbeth`变量是一个包含文本单词的长数组。如果你想查看文本的前十个单词，可以编写以下命令。\n\n```\nmacbeth\
  \ [:10]\nOut [ ]:\n['[',\n'The',\n'Tragedie',\n'of',\n'Macbeth',\n'by',\n'William',\n\
  'Shakespeare',\n'1603',\n']']\n```\n\n如你所见，前十个单词包含了作品标题，但也包含了方括号，它们表示句子的开始和结束。如果你使用`sents()`函数进行句子提取模式，你会得到一个结构更清晰的数组，每个句子作为一个元素。这些元素本身又是以单词为元素的数组。\n\
  \n```\nmacbeth_sents = nltk.corpus.gutenberg.sents ('shakespeare-macbeth.txt')\n\
  macbeth_sents [: 5]\nOut [ ]:\n[['[',\n'The',\n'Tragedie',\n'of',\n'Macbeth',\n\
  'by',\n'William',\n'Shakespeare',\n'1603',\n']'],\n['Actus', 'Primus', '.'],\n['Scoena',\
  \ 'Prima', '.'],\n['Thunder', 'and', 'Lightning', '.'],\n['Enter', 'three', 'Witches',\
  \ '.']]\n```\n\n## 使用 NLTK 搜索单词\n\n当你拥有 NLTK 语料库（即从文本中提取的单词数组）时，最基本的操作之一是在其内部进行搜索。搜索的概念与你习惯的略有不同。\n\
  \n`concordance()`函数会查找作为参数传入的单词在语料库中的所有出现位置。第一次运行此命令时，系统需要几秒钟才能返回结果。后续运行会更快。实际上，第一次在语料库上执行此命令时，它会为搜索创建内容索引，该索引将在后续调用中使用。这解释了为什么系统第一次需要更长时间。\n\
  \n首先，确保语料库是一个`nltk.Text`对象，然后在内部搜索单词`'Stage'`。\n\n```\ntext = nltk.Text(macbeth)\n\
  text.concordance('Stage')\nOut [ ]:\nDisplaying 3 of 3 matches:\nnts with Dishes\
  \ and Seruice ouer the Stage . Then enter Macbeth Macb . If it we\nwith mans Act\
  \ , Threatens his bloody Stage : byth ' Clock ' tis Day , And yet d\nstruts and\
  \ frets his houre vpon the Stage , And then is heard no more . It is\n```\n\n你得到了文本中三个不同的出现位置。\n\
  \nNLTK 中另一种搜索单词的形式是上下文搜索。即，查找你所搜索单词的前一个词和后一个词。为此，你必须使用`common_contexts()`函数。\n\n\
  ```\ntext.common_contexts(['Stage'])\nOut [ ]:\nthe_ bloody_: the_,\n```\n\n如果你查看之前搜索的结果，可以看到这三个结果与上述内容相符。\n\
  \n一旦你理解了 NLTK 在搜索中如何处理单词及其上下文的概念，就很容易理解同义词的概念。即，假设所有具有相同上下文的单词都可能是同义词。要搜索所有与所搜索单词具有相同上下文的单词，你必须使用`similar()`函数。\n\
  \n```\ntext.similar('Stage')\nOut [ ]:\nfogge ayre bleeding reuolt good shew heeles\
  \ skie other sea feare\nconsequence heart braine seruice herbenger lady round deed\
  \ doore\n```\n\n对于那些不习惯处理和\n\n\n\n下载所有停用词后，你可以只选择与英文相关的部分，并将其保存在变量 `sw` 中。\n\n```\n\
  sw = set(nltk.corpus.stopwords.words ('english'))\nprint(len(sw))\nlist(sw) [:10]\n\
  Out [ ]:\n\n['through',\n'are',\n'than',\n'nor',\n'ain',\n\"didn't\",\n'didn',\n\
  \"shan't\",\n'down',\n'our']\n```\n\n根据 NLTK，英文词汇中共有 179 个停用词。现在你可以使用这些停用词来过滤 `macbeth`\
  \ 变量。\n\n```\nmacbeth_filtered = [w for w in macbeth if w.lower() not in sw]\nfd\
  \ = nltk.FreqDist (macbeth_filtered)\nfd.most_common(10)\nOut [ ]:\n[(',', 1962),\n\
  ('.', 1235),\n(\"'\", 637),\n(':', 477),\n('?', 241),\n('Macb', 137),\n('haue',\
  \ 117),\n('-', 100),\n('Enter', 80),\n('thou', 63)]\n```\n\n现在返回了前十个最常见的单词，可以看到停用词已被去除，但结果仍不尽人意。实际上，单词中仍然存在标点符号。要消除所有标点，你可以修改之前的代码，在过滤器中插入一个包含标点符号的标点数组。这个标点数组可以通过导入\
  \ `string` 函数获得。\n\n```\nimport string\npunctuation = set (string.punctuation)\n\
  macbeth_filtered2 = [w.lower () for w in macbeth if w.lower () not in sw and w.lower\
  \ () not in punctuation]\n```\n\n现在你可以重新计算单词的频率分布。\n\n```\nfd = nltk.FreqDist (macbeth_filtered2)\n\
  fd.most_common(10)\nOut [ ]:\n[('macb', 137),\n('haue', 122),\n('thou', 90),\n('enter',\
  \ 81),\n('shall', 68),\n('macbeth', 62),\n('vpon', 62),\n('thee', 61),\n('macd',\
  \ 58),\n('vs', 57)]\n```\n\n最终，你得到了想要的结果。\n\n## 从文本中选择单词\n\n另一种处理和分析数据的方式是根据特定特征从文本体中提取单词。例如，你可能对基于单词长度提取单词感兴趣。\n\
  \n为了获取所有最长的单词，例如长度超过 12 个字符的单词，你可以输入以下命令。\n\n```\nlong_words = [w for w in macbeth\
  \ if len(w)> 12]\n```\n\n现在所有长度超过 12 个字符的单词都已存入 `long_words` 变量中。你可以使用 `sort()`\
  \ 函数按字母顺序列出它们。\n\n```\nsorted(long_words)\nOut [ ]:\n['Assassination',\n'Chamberlaines',\n\
  'Distinguishes',\n'Gallowgrosses',\n'Metaphysicall',\n'Northumberland',\n'Voluptuousnesse',\n\
  'commendations',\n'multitudinous',\n'supernaturall',\n'vnaccompanied']\n```\n\n\
  如你所见，共有 11 个单词符合这个标准。\n\n另一个例子是查找所有包含特定字符序列的单词，例如 `'ious'`。你只需更改 `for in` 循环中的条件即可获得所需的选择。\n\
  \n```\nious_words = [w for w in macbeth if 'ious' in w]\nious_words = set(ious_words)\n\
  sorted(ious_words)\nOut [ ]:\n['Auaricious',\n'Gracious',\n'Industrious',\n'Iudicious',\n\
  'Luxurious',\n'Malicious',\n'Obliuious',\n'Pious',\n'Rebellious',\n'compunctious',\n\
  'furious',\n'gracious',\n'pernicious',\n'pernitious',\n'pious',\n'precious',\n'rebellious',\n\
  'sacrilegious',\n'serious',\n'spacious',\n'tedious']\n```\n\n这个例子使用了 `sort()` 并对列表进行了集合转换，从而去除了重复单词。这两个例子只是向你展示此工具的潜力及其过滤单词的简便性的起点。\n\
  \n## 双词组与搭配\n\n文本分析的另一个基本要素是考虑单词对（*双词组*）而不是单个单词。例如，单词“is”和“yellow”构成一个双词组，因为它们的组合是可能且是有意义的。因此可以在文本数据中找到“is\
  \ yellow”。我们都知道，在某些文学作品中，有些双词组非常常见，以至于它们几乎总是同时出现。例如，“fast food”、“pay attention”、“good\
  \ morning”等。这些双词组被称为*搭配*。\n\n文本分析还可以涉及在所分析的文本中查找任何双词组。要找到它们，只需使用 `bigrams()` 函数。为了从双词组中排除停用词和标点，你必须使用已经过滤过的单词集，例如\
  \ `macbeth_filtered2`。\n\n```\nbgrms = nltk.FreqDist(nltk.bigrams(macbeth_filtered2))\n\
  bgrms.most_common(15)\nOut [ ]:\n[(('enter', 'macbeth'), 16),\n(('exeunt', 'scena'),\
  \ 15),\n(('thane', 'cawdor'), 13),\n(('knock', 'knock'), 10),\n(('st', 'thou'),\
  \ 9),\n(('thou', 'art'), 9),\n(('lord', 'macb'), 9),\n(('haue', 'done'), 8),\n(('macb',\
  \ 'haue'), 8),\n(('good', 'lord'), 8),\n(('let', 'vs'), 7),\n(('enter', 'lady'),\
  \ 7),\n(('wee', 'l'), 7),\n(('would', 'st'), 6),\n(('macbeth', 'macb'), 6)]\n```\n\
  \n通过显示文本中最常见的双词组，可以发现语言搭配。\n\n除了双词组，还可以有基于三词组的搭配，即三个单词的组合。在这种情况下，使用 `trigrams()`\
  \ 函数。\n\n```\ntgrms = nltk.FreqDist(nltk.trigrams (macbeth_filtered2))\ntgrms.most_common(10)\n\
  Out [ ]:\n[(('knock', 'knock', 'knock'), 6),\n(('enter', 'macbeth', 'macb'), 5),\n\
  (('enter', 'three', 'witches'), 4),\n(('exeunt', 'scena', 'secunda'), 4),\n(('good',\
  \ 'lord', 'macb'), 4),\n(('three', 'witches', '1'), 3),\n(('exeunt', 'scena', 'tertia'),\
  \ 3),\n(('thunder', 'enter', 'three'), 3),\n(('exeunt', 'scena', 'quarta'), 3),\n\
  (('scena', 'prima', 'enter'), 3)]\n```\n\n## 预处理步骤\n\n文本预处理是文本分析中最重要和基础的阶段之一。在从各种可用来源收集要分析的文本后，你会发现，为了在各种\
  \ NLP 技术中使用文本，有必要对其进行清洗、转换，然后专门准备使其可用。本节介绍一些更常见的预处理操作。\n\n*小写转换* 可能是最频繁和常见的操作，不仅在预处理阶段，在分析的后继阶段也是如此。事实上，文本中包含许多字符大写的单词。大多数解析技术都要求将所有单词转为小写，这样“word”和“Word”就被视为同一个单词。\n\
  \n在 Python 中，这个操作非常简单（不需要使用 `nltk` 库），因为字符串变量具有 `lower()` 方法来应用转换。\n\n```\ntext\
  \ = 'This is a Demo Sentence'\nlower_text = text.lower()\nlower_text\nOut [ ]:\n\
  'this is a demo sentence'\n```\n\n*单词分词* 是 NLP 中另一个非常常见的操作。文本由单词组成，单词之间有空格。因此，将文本转换为单词列表的操作对于能够用计算机处理文本至关重要。NLTK\
  \ 提供了 `word_tokenize()` 函数来实现此目的。但首先你需要从 `nltk` 下载 `'punkt'` 资源。\n\n```\nnltk.download('punkt')\n\
  text = 'This is a Demo Sentence'\ntokens = nltk.word_tokenize(text)\ntokens\nOut\
  \ [ ]:\n['This', 'is', 'a', 'Demo', 'Sentence']\n```\n\n分词也可以在更高层次上进行，即通过将组成文本的句子分开，并将它们转换为列表中的元素，而不是单个单词。在这种情况下，使用\
  \ `sent_tokenize()` 函数。\n\n```\ntext = 'This is a Demo Sentence. This is another\
  \ sentence'\ntokens = nltk.sent_tokenize(text)\ntokens\nOut [ ]:\n['This is a Demo\
  \ Sentence.', 'This is another sentence']\n```\n\n另一个常见的预处理操作是*标点符号去除*。通常你需要对从社交网络或网络产品评论中获取的评论进行分析。许多此类文本富含标点符号，这会影响到其中单词的正确分词。对于这个操作，NLTK\
  \ 提供了一个特殊的 tokenizer 对象，叫做 `RegexpTokenizer`，它允许你通过正则表达式定义分词标准。下面的示例设置了 `RegexpTokenizer`\
  \ 以去除文本中存在的所有标点符号。\n\n\n```python\nfrom nltk.tokenize import RegexpTokenizer\ntext\
  \ = 'This% is a #!!@ Sentence full of punctuation marks :-) '\nregexpt = RegexpTokenizer(r'[a-zA-Z0-9]+')\n\
  tokens = regexpt.tokenize(text)\ntokens\nOut [ ]:\n['This', 'is', 'a', 'Sentence',\
  \ 'full', 'of', 'punctuation', 'marks']\n```\n\n*停用词移除*操作则更为复杂。实际上，停用词并不是可以通过正则表达式丢弃的特殊字符，而是那些“无法为文本提供信息”的真实单词。这些单词显然与每种语言相关，并且在不同语言中有所变化。在英语中，像“the”、“a”、“on”和“in”这类词基本上就是停用词。要从被分析的文本中移除它们，你可以按如下方式操作。\n\
  \n首先，从 `nltk` 加载停用词，然后将其导入代码中。执行常规的词元化操作，之后再移除英语停用词。\n\n```python\nnltk.download('stopwords')\n\
  from nltk.corpus import stopwords\ntext = 'This is a Demo Sentence. This is another\
  \ sentence'\neng_sw = stopwords.words('english')\ntokens = nltk.word_tokenize(text)\n\
  clean_tokens = [word for word in tokens if word not in eng_sw]\nclean_tokens\nOut\
  \ [ ]:\n['This', 'Demo', 'Sentence', '.', 'This', 'another', 'sentence']\n```\n\n\
  另一种预处理操作涉及语言学。诸如*词干提取*和*词形还原*之类的操作，通过评估单词的语言学词根（前者）和词元（后者）来对单个单词进行处理。词干提取会将所有具有相同词根的单词归组，将它们视为同一个单词。而词形还原则是查找一个单词或动词的所有屈折形式，并将它们归到同一个词元下，将它们视为同一个单词。\n\
  \n因此，就词干提取而言，你在词元中就能获得文本所包含单词的所有词根。从 NLTK 中导入一个可用的词干提取器 `SnowballStemmer`，并将其设置为英语。然后对单词执行经典的分词操作。只有在此时，才通过将单词转换为其语言学词根来完成清洗。\n\
  \n```python\nfrom nltk.stem import SnowballStemmer\ntext = 'This operation operates\
  \ for the operator curiosity. A decisive decision'\nstemmer = SnowballStemmer('english')\n\
  tokens = nltk.word_tokenize(text)\nstemmed_tokens = [stemmer.stem(word) for word\
  \ in tokens]\nprint(stemmed_tokens)\nOut [ ]:\n['this', 'oper', 'oper', 'for', 'the',\
  \ 'oper', 'curios', '.', 'a', 'decis', 'decis']\n```\n\n至于词形还原，操作非常相似。但首先需要从 `nltk`\
  \ 下载两个组件，例如 `WordNet` 和 `Omw`。对文本执行经典的分词操作，然后定义一个词形还原器。此时，将其应用于词元，以对单个单词进行词形还原。所有屈折形式都被合并在一起，包括单复数单词和动词的时态变化。\n\
  \n```python\nnltk.download('omw-1.4')\nnltk.download('wordnet')\nfrom nltk.stem\
  \ import WordNetLemmatizer\ntext = 'A verb: I split, it splits. Splitted verbs.'\n\
  tokens = nltk.word_tokenize(text)\nlmtzr = WordNetLemmatizer()\nlemma_tokens = [lmtzr.lemmatize(word)\
  \ for word in tokens]\nprint(lemma_tokens)\nOut [ ]:\n['A', 'verb', ':', 'I', 'split',\
  \ ',', 'it', 'split', '.', 'Splitted', 'verb', '.']\n```\n\n## 使用网络上的文本\n\n到目前为止，你已经看到了一系列示例，这些示例使用了\
  \ NLTK 库中作为 `gutenberg` 有序包含的文本（称为语料库）。但实际上，你需要访问互联网来提取文本，并将其收集为语料库，以便使用 NLTK 进行分析。在本节中，你将看到此类操作有多么简单。首先，需要导入一个允许你连接网页内容的库。`urllib`\
  \ 库非常适合此目的，因为它允许你从互联网下载文本内容，包括 HTML 页面。\n\n因此，首先从 `urllib` 库中导入专门处理此类操作的 `request()`\
  \ 函数。\n\n```python\nfrom urllib import request\n```\n\n然后，需要编写包含待提取文本页面的 URL。仍然以\
  \ `gutenberg` 项目为例，你可以选择，例如，一本陀思妥耶夫斯基写的书（[www.gutenberg.org](http://www.gutenberg.org)）。网站上提供不同格式的文本；本例使用原始格式（`.txt`）的文本。\n\
  \n```python\nurl = \"http://www.gutenberg.org/files/2554/2554-0.txt\"\nresponse\
  \ = request.urlopen(url)\nraw = response.read().decode('utf8')\n```\n\n原始文本中包含了从互联网下载的整本书的文本内容。务必检查所下载内容。为此，查看前\
  \ 75 个字符就足够了。\n\n```python\nraw[:75]\nOut [ ]:\n'\\ufeffThe Project Gutenberg EBook\
  \ of Crime and Punishment, by Fyodor Dostoevsky\\r'\n```\n\n如你所见，这些字符对应着文本的标题。你可以看到文本的第一个单词处还有一个错误。实际上存在\
  \ Unicode 字符 `BOM \\ufeff`。出现这种情况是因为本例使用了 `utf8` 解码系统，这在大多数情况下有效，但在此例中不行。本例中最合适的系统是\
  \ `utf-8-sig`。用正确的值替换不正确的值。\n\n```python\nraw = response.read().decode('utf8-sig')\n\
  raw[:75]\nOut [ ]:\n'The Project Gutenberg EBook of Crime and Punishment, by Fyodor\
  \ Dostoevsky\\r\\n'\n```\n\n为了能够对其进行处理，必须将其转换为与 NLTK 兼容的语料库。为此，请输入以下转换命令。\n\n```python\n\
  tokens = nltk.word_tokenize(raw)\nwebtext = nltk.Text(tokens)\n```\n\n这些命令所做的无非是使用\
  \ `nltk.word_tokenize()` 函数将字符文本分割成词元（即单词），然后使用 `nltk.Text()` 将词元转换为适合 NLTK 的文本主体。\n\
  \n你可以通过输入以下命令来查看标题：\n\n```python\nwebtext[:12]\nOut [ ]:\n['The',\n'Project',\n\
  'Gutenberg',\n'EBook',\n'of',\n'Crime',\n'and',\n'Punishment',\n',',\n'by',\n'Fyodor',\n\
  'Dostoevsky']\n```\n\n现在，你有了一个正确的语料库，可以在此基础上进行分析。\n\n## 从 HTML 页面提取文本\n\n在前一个示例中，你从互联网下载的文本创建了一个\
  \ NLTK 语料库。但互联网上的大多数文档都是以 HTML 页面形式存在的。在本节中，你将了解如何从 HTML 页面中提取文本。\n\n你仍然使用 `urllib`\
  \ 库的 `request()` 函数来下载网页的 HTML 内容。\n\n```python\nurl = \"https://news.bbc.co.uk/2/hi/health/2284783.stm\"\
  \nhtml = request.urlopen(url).read().decode('utf8')\nhtml[:120]\nOut [ ]:\n'\\r\\\
  n\\r\\n<hea'\n```\n\n不过，现在转换成 NLTK 语料库需要一个额外的库 `bs4 (BeautifulSoup)`，它为你提供了能够识别\
  \ HTML 标签并提取其中所含文本的合适解析器。\n\n```python\nfrom bs4 import BeautifulSoup\nraw = BeautifulSoup(html,\
  \ \"lxml\").get_text()\ntokens = nltk.word_tokenize(raw)\ntext = nltk.Text(tokens)\n\
  ```\n\n现在，在这种情况下你也拥有了一个语料库，尽管你通常需要执行比前一种情况更复杂的清洗操作，才能消除那些你不感兴趣的单词。\n```\n\n\n##\
  \ 情感分析\n\n*情感分析*是一个近期才发展起来的新研究领域，旨在评估人们对特定话题的看法。该学科基于多种文本分析技术，其应用领域主要集中于社交媒体和论坛（*观点挖掘*）。通过用户的评论和反馈，情感分析算法能够根据特定关键词评估用户的好感度或评价。这种好感度被称为*观点*，具有三种可能值：正面、中性或负面。因此，观点评估本质上是一种分类问题。\n\
  \n许多情感分析技术实际上是分类算法，与你在前几章（参见第 8 章和第 9 章）学习的机器学习和深度学习算法类似。为了更好地理解这种方法，我以官方网站（[www.nltk.org/book/ch06.html](http://www.nltk.org/book/ch06.html)）上使用朴素贝叶斯算法的分类教程为例，该网站还提供了许多其他有用的示例，以帮助更好地理解该库。\n\
  \n作为训练集，该示例使用了 NLTK（自然语言工具包）中的另一个语料库：`movie_reviews`。该语料库包含大量电影评论，每条评论都包含一段长度不等的文本，以及一个用于指明该评论是正面还是负面的字段。因此，它是一个很好的学习材料。\n\
  \n本教程的目的是找出负面文档中重复出现最多的词，或者正面文档中重复出现较多的词，从而聚焦于与观点相关的关键词。该评估通过 NLTK 中集成的朴素贝叶斯分类器进行。\n\
  \n首先，名为`movie_reviews`的语料库至关重要。\n\n```\nnltk.download('movie_reviews')\nOut [ ]:\n\
  [nltk_data] Downloading package movie_reviews to\n[nltk_data]     C:\\Users\\nelli\\\
  AppData\\Roaming\\nltk_data...\n[nltk_data]   Package movie_reviews is already up-to-date!\n\
  True\n```\n\n然后，你从获取的语料库中构建训练集，创建一个名为`documents`的元素对数组。该数组的第一个字段包含单条评论的文本，第二个字段包含其负面或正面评价。最后，你以随机顺序打乱数组中的所有元素。\n\
  \n```\nimport random\nreviews = nltk.corpus.movie_reviews\ndocuments = [(list(reviews.words(fileid)),\
  \ category)\nfor category in reviews.categories()\nfor fileid in reviews.fileids(category)]\n\
  random.shuffle(documents)\n```\n\n为了更好地理解这一点，我们仔细查看一下`documents`的内容。第一个元素包含两个字段；第一个字段是包含所有使用词汇的评论。\n\
  \n```\nfirst_review = ' '.join(documents[0][0])\nprint(first_review)\nOut [ ]:\n\
  topless women talk about their lives falls into that category that i mentioned in\
  \ the devil ' s advocate : movies that have a brilliant beginning but don ' t know\
  \ how to end . it begins by introducing us to a selection of characters who all\
  \ know each other . there is liz , who oversleeps and so is running late for her\
  \ appointment, prue who is getting married,...\n```\n\n第二个字段则包含该评论的评价：\n\n```\n\
  documents[0][1]\nOut [ ]:\n'neg'\n```\n\n但训练集尚未准备好；实际上，你需要创建语料库中所有单词的频率分布。然后使用`list()`函数将该分布转换为列表。\n\
  \n```\nall_words = nltk.FreqDist(w.lower() for w in reviews.words())\nword_features\
  \ = list(all_words)\n```\n\n下一步是定义一个用于计算特征（即足以确定评论观点的关键词）的函数。\n\n```\ndef document_features(document,\
  \ word_features):\n    document_words = set(document)\n    features = {}\n    for\
  \ word in word_features:\n        features['{}'.format(word)] = (word in document_words)\n\
  \    return features\n```\n\n定义好`document_features()`函数后，你就可以从文档中创建特征集。\n\n```\n\
  featuresets = [(document_features(d,word_features), c) for (d,c) in documents]\n\
  ```\n\n目标是创建整个电影语料库中包含的所有单词的集合，分析每个单词在单条评论中是否存在（`True`或`False`），并查看它们对评论的正面或负面判断贡献了多少。一个词在负面评论中出现得越频繁，而在正面评论中出现得越少，它就越容易被评估为“负面”词。反之亦然，用于评估“正面”词。\n\
  \n要确定如何将该特征集划分为训练集和测试集，你首先需要知道它包含多少个元素。\n\n```\nlen(featuresets)\nOut [ ]:\n```\n\
  \n为了评估模型的准确性，你使用该集的前 1,500 个元素作为训练集，后 500 个元素作为测试集。\n\n```\ntrain_set, test_set\
  \ = featuresets[1500:], featuresets[:500]\n```\n\n最后，你应用 NLTK 库提供的朴素贝叶斯分类器对该问题进行分类。然后，你将测试集提交给模型，计算其准确性。\n\
  \n```\nclassifier = nltk.NaiveBayesClassifier.train(train_set)\nprint(nltk.classify.accuracy(classifier,\
  \ test_set))\nOut [ ]:\n0.85\n```\n\n该准确性不如前几章的例子高，但这里你处理的是文本中包含的词汇，因此相对于数值问题，创建精确模型是非常困难的。\n\
  \n现在你已经完成了分析，可以查看哪些词在评估评论的负面或正面观点时权重最大。\n\n```\nclassifier.show_most_informative_features(10)\n\
  Out [ ]:\nMost Informative Features\ncompelling = True              pos : neg  \
  \  =     11.9 : 1.0\noutstanding = True              pos : neg    =     11.2 : 1.0\n\
  lame = True              neg : pos    =     10.2 : 1.0\nextraordinary = True   \
  \           pos : neg    =      9.7 : 1.0\nlucas = True              pos : neg \
  \   =      9.7 : 1.0\nbore = True              neg : pos    =      8.3 : 1.0\ncatch\
  \ = True              neg : pos    =      8.3 : 1.0\njourney = True            \
  \  pos : neg    =      8.3 : 1.0\nmagnificent = True              pos : neg    =\
  \      8.3 : 1.0\ntriumph = True              pos : neg    =      8.3 : 1.0\n```\n\
  \n查看结果，你不会惊讶地发现，单词“badly”是一个负面观点词，而“finest”是一个正面观点词。有趣的是，“julie”是一个负面观点词。\n\n##\
  \ 结论\n\n在本章中，你初步了解了文本分析的世界。事实上，还有许多其他技术和示例可以讨论。然而，在学完本章后，你应该熟悉了分析的这个分支，并且尤其开始了解\
  \ NLTK（自然语言工具包）库，这是一个用于文本分析的强大工具。\n\n"
- "# 14. 使用 OpenCV 进行图像分析与计算机视觉\n\n在前面的章节中，数据分析完全集中在数值数据和表格化数据上，而在上一章中，你了解了如何处理和分析文本形式的数据。本书以介绍数据分析的最后一个方面——*图像分析*——作为恰当的收尾。本章将介绍计算机视觉和人脸识别等主题。你将看到深度学习技术是如何成为这类分析的基础的。此外，还将介绍另一个名为`openCV`的库，它一直是图像分析的参考标准。\n\
  \n\n\n## 图像分析与计算机视觉\n\n在本书中，你已经看到分析的目的在于从被研究的系统中提取新信息、提炼新概念与特征。你之前用数字和文本数据完成了这一过程，而图像同样可以做到。这一分析分支被称为*图像分析*，其基础是应用于图像的计算技术（称为图像滤波器），你将在后续章节中了解这些技术。\n\
  \n近年来，尤其是得益于深度学习的发展，图像分析在解决此前无法实现的问题上取得了巨大突破，由此催生了一门名为*计算机视觉*的新学科。\n\n在第 9 章中，你学习了人工智能——这是处理纯粹\"\
  人类相关\"问题的计算分支。计算机视觉正是其中的一部分，因为其目标是复制人脑感知图像的方式。\n\n事实上，\"看见\"不仅仅是获取二维图像，更重要的是对该区域内容的解读。捕获的图像会被分解并加工成逐渐抽象的表示层次（轮廓、图形、物体和文字），从而能被人类思维所识别。\n\
  \n同样地，计算机视觉旨在处理二维图像并从中提取相同的表示层次。这是通过多种操作实现的，这些操作可分类如下：\n\n*   *检测*：检测图像中的形状、物体或其他研究对象（例如，寻找汽车）\n\
  *   *识别*：将识别出的对象归入通用类别（例如，按品牌和类型细分汽车）\n*   *辨识*：识别出前一类别中的某个具体实例（例如，找到我的车）\n\n##\
  \ OpenCV 与 Python\n\n*OpenCV（开源计算机视觉库）* 是一个用 C++ 编写的、专用于计算机视觉和图像分析的库（[`https://opencv.org/`](https://opencv.org/)）。这个由\
  \ Gary Bradsky 设计的强大库最初是 Intel 的一个项目，首个版本于 2000 年发布。随着时间的推移，它以开源许可证形式发布，并逐渐普及，目前已达到\
  \ 4.8 版本（2023 年 6 月）。目前，OpenCV 支持众多与计算机视觉和机器学习相关的算法，并且功能与日俱增。\n\n它的实用性和广泛传播恰恰源于其竞争对手：`matlab`。实际上，需要处理图像分析的人有两种选择：购买\
  \ `matlab` 软件包，或者编译并安装开源版本的 OpenCV。显而易见，许多人选择了第二种方案。\n\n## OpenCV 与深度学习\n\n计算机视觉与深度学习之间有着密切的联系。由于\
  \ 2017 年是深度学习发展的关键一年（阅读我在 [`www.meccanismocomplesso.org/en/2017-the-year-of-deep-learning-frameworks/`](http://www.meccanismocomplesso.org/en/2017-the-year-of-deep-learning-frameworks/)\
  \ 发表的相关文章），OpenCV 3.3 新版本的发布增强了该库的功能，引入了许多深度学习及神经网络的新特性。实际上，该库有一个名为 `dnn`（深度神经网络）的模块专门负责这一领域。该模块专门为与多种深度学习框架（包括\
  \ Caffe2、TensorFlow 和 PyTorch）配合使用而开发（关于这些框架的信息，请参见第 9 章）。\n\n## 安装 OpenCV\n\n你可以通过官方网站\
  \ ([`https://opencv.org/releases/`](https://opencv.org/releases/)) 在许多操作系统（Windows、iOS\
  \ 和 Android）上安装 OpenCV 软件包。\n\n如果你使用 Anaconda 作为分发介质，我推荐采用此方法。安装过程非常简单且干净。\n\n```\n\
  conda install opencv\n```\n\n遗憾的是，对于 Linux 系统，没有官方的 PyPI 包（即通过 `pip` 安装）可用。需要手动安装，其过程可能因使用的发行版和版本而异。互联网上有许多相关流程，有些或多或少是可行的。\n\
  \n## 图像处理与分析初步\n\n本节旨在让你熟悉 `opencv` 库。首先，你将学习如何加载和显示图像。接着，你将对其进行一些简单操作，如两幅图像的相加、相减，并查看图像融合的示例。所有这些操作都非常有用，因为它们构成许多其他图像分析操作的基础。\n\
  \n### 开始之前\n\n安装好 `opencv` 库后，你可以在 Jupyter QtConsole 或 Jupyter Notebook 中打开一个 IPython\
  \ 会话。\n\n在开始编程之前，你需要导入 `openCV` 库。\n\n```\nimport numpy as np\nimport cv2\n```\n\
  \n### 加载并显示图像\n\n首先，主要因为 OpenCV 处理的是图片，所以了解如何在 Python 程序中加载图像、进行操作处理，并最终查看结果就显得至关重要。\n\
  \n你需要做的第一件事是使用 `openCV` 库读取包含图像的文件。你可以使用 `imread()` 方法来完成此操作。此方法读取 JPG 等压缩格式的文件，并将其转换为由对应色阶和位置的数值矩阵组成的数据结构。\n\
  \n> 注意：你可以在本书的源代码中找到这些图像和文件。\n\n```\nimg = cv2.imread('italy2018.jpg')\n```\n\n\
  如果你对更多细节感兴趣，可以直接查看图像的内容。你会看到一个数组的数组，每个数组对应图像的一个特定位置，并且每个位置都由 0 到 255 之间的数字特征化。\n\
  \n实际上，如果你查看图像第一个元素的内容，会得到以下结果。\n\n```\nimg[0]\nOut [ ]:\narray([[38, 43, 11],\n\
  [37, 42, 10],\n[36, 41,  9],\n...,\n[24, 37, 15],\n[22, 36, 12],\n[23, 36, 12]],\
  \ dtype=uint8)\n```\n\n继续编写代码，你现在使用 `matplotlib` 库来显示加载到 `img` 变量中的图像。首先，从 `matplotlib`\
  \ 库中导入绘图所需的内容：\n\n```\nfrom matplotlib import pyplot as plt\n```\n\n现在，你可以使用 `pyplot`\
  \ 的 `imshow()` 方法来显示已加载的图像。由于 OpenCV 中默认的颜色格式是 BGR（蓝、绿、红），因此通过 `cv2.COLOR_BGR2RGB`\
  \ 指定转换为 RGB 格式非常重要。此外，由于 `pyplot` 是为绘图而设置的，你需要移除显示的坐标轴和刻度，因此通过设置 `plt.axis` 为 `off`\
  \ 来禁用它们。\n\n```\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img, cv2.COLOR_BGR2RGB))\n\
  plt.show()\n```\n\n执行此命令时，将打开一个新窗口并显示图 14-1 中的图像。\n\n![](img/336498_3_En_14_Fig1_HTML.jpg)\n\
  \n一张照片显示意大利国家队的一群队员正在操场上慢跑，他们穿着队服。\n\n**图 14-1** 意大利国家足球队训练时的照片\n\n### 处理图像\n\n\
  现在你已经学会了如何查看文件系统中的现有图像，可以进入下一步：通过对图像执行操作来处理图像，并将结果保存到新文件中。\n\n继续之前的示例，你将使用相同的代码。不过这次，你将执行一个简单的图像处理，例如，分解三个\
  \ RGB 通道。然后，你将交换这些通道以形成一幅新图像。这幅新图像的所有颜色都将改变。\n\n加载图像后，将其分解为三个 RGB 通道。你可以使用 `split()`\
  \ 方法轻松做到这一点。\n\n```\nb,r,g = cv2.split(img)\n```\n\n现在重新组合这三个通道，但需要改变顺序，例如交换红色通道和绿色通道。你可以使用\
  \ `merge()` 方法轻松地重新组合通道。\n\n```\nimg2 = cv2.merge((b,g,r))\n```\n\n\n\n新图像存储在 `img2`\
  \ 变量中。在一个新窗口中，将其与原始图像一同显示。\n\n```\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img2,\
  \ cv2.COLOR_BGR2RGB))\nplt.show()\n```\n\n运行程序后，会出现一个显示颜色已改变的新窗口（如图 14-2 所示）。\n\n\
  ![](img/336498_3_En_14_Fig2_HTML.jpg)\n\n一张经过处理的照片，描绘了意大利国家队的一群男子在操场上慢跑。照片的颜色已从\
  \ BGR 转换为 RGB。\n\n**图 14-2** 处理后的图像颜色已改变\n\n### 保存新图像\n\n最后，你需要通过文件系统保存新图像。在程序末尾，添加一个\
  \ `imwrite()` 方法，并指定要保存的新文件名，文件也可以有其他格式，例如 PNG。\n\n```\ncv2.imwrite('italy2018altered.png',\
  \ img2)\nOut [ ]:\nTrue\n```\n\n执行此命令后，你会注意到工作区中出现了一个新的 `italy2018altered.png` 文件。\n\
  \n## 图像基本运算\n\n最基本的运算是两幅图像的加法。使用 `openCV` 库，此操作非常简单，你可以通过 `cv2.add()` 函数来实现。得到的结果将是两幅图像的组合。但请记住，要进行加法运算的两幅图像必须具有相同的尺寸。在本例中，两幅图像都是\
  \ 512x331 像素。\n\n你需要做的第一件事是加载另一幅尺寸相同的图像，在本例中是 `soccer.jpg`（你可以在源代码中找到它）。\n\n```\n\
  img2 = cv2.imread('soccer.jpg')\nplt.axis('off')\nplt.imshow(img2)\nplt.show()\n\
  ```\n\n执行代码后，你将得到图 14-3 所示的图像。\n\n![](img/336498_3_En_14_Fig3_HTML.jpg)\n\n一张足球躺在操场上的照片。\n\
  \n**图 14-3** 一张尺寸相同（512x331 像素）的新图像\n\n现在，使用 `add()` 函数将两幅图像相加。\n\n```\nimg3 = cv2.add(img,\
  \ img2)\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img3, cv2.COLOR_BGR2RGB))\nplt.show()\n\
  ```\n\n执行此代码后，你将得到两幅图像的组合（如图 14-4 所示）。遗憾的是，效果并不理想。\n\n![](img/336498_3_En_14_Fig4_HTML.jpg)\n\
  \n一幅两幅照片组合的插图，描绘了意大利国家队男子在操场上慢跑以及一个足球。\n\n**图 14-4** 通过将两幅图像相加得到的新图像\n\n结果并非你所期望。实际上是白色占主导，这是对每个像素分别计算\
  \ RGB 三个值简单算术和的结果。实际上，你知道 RGB 三个分量各取值 0 到 255。因此，如果某个像素值的总和大于 255（这很有可能），该值仍将为 255。因此，简单的图像加法并不会产生两幅图像融合的效果，而是逐渐向白色偏移。稍后你将学习如何将两幅图像相加，以创建一幅融合了两幅图像各一半的新图像（这不是算术和）。\n\
  \n你可以通过相减两幅图像来做同样的事情。此操作可以使用 `cv2.subtract()` 函数执行。这次你预期会得到一幅越来越偏向黑色的图像。将 `cv2.add()`\
  \ 函数替换为以下内容。\n\n```\nimg3 = cv2.subtract(img, img2)\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img3,\
  \ cv2.COLOR_BGR2RGB))\nplt.show()\n```\n\n运行程序后，你将得到一幅暗得多的图像（尽管你可能看不太清），如图 14-5\
  \ 所示。\n\n![](img/336498_3_En_14_Fig5_HTML.jpg)\n\n一幅照片描绘了将足球从意大利国家队男子慢跑和足球的组合照片中移除后的效果。足球的轮廓以暗色调呈现。\n\
  \n**图 14-5** 从一幅图像中减去另一幅图像得到的新图像\n\n请注意，如果反过来，从第二幅图像中减去第一幅图像，效果会更差。\n\n```\nimg3\
  \ = cv2.subtract(img2, img)\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img3, cv2.COLOR_BGR2RGB))\n\
  plt.show()\n```\n\n你会得到一幅发黑的图像，如图 14-6 所示。\n\n![](img/336498_3_En_14_Fig6_HTML.jpg)\n\
  \n一幅照片描绘了将球员群体从意大利国家队男子慢跑和足球的组合照片中移除后的效果。球员的轮廓以暗色调呈现。\n\n**图 14-6** 从一幅图像中减去另一幅图像得到的新图像\n\
  \n然而，这有助于我们了解运算子的顺序对结果很重要。\n\n更具体地说，你已经看到，用 `opencv` 库创建的图像不过是一个数组的数组，它完全符合 NumPy\
  \ 的规则。因此，你可以使用 NumPy 提供的矩阵间运算，例如矩阵加法。但要注意，结果肯定是不一样的。\n\n```\nimg = img1 + img2\n\
  ```\n\n实际上，`cv2.add()` 和 `cv2.subtract()` 函数会将值保持在 0 到 255 之间，无论运算子的值是多少。如果和超过 255，结果会以不同的方式解释，从而产生非常奇怪的色彩效果（可能是取\
  \ 255 的模）。当减法产生负值时也是如此；结果将为 0。算术运算不具备此特性。\n\n不过，你可以直接尝试一下。\n\n```\nimg3 = img +\
  \ img2\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img3, cv2.COLOR_BGR2RGB))\nplt.show()\n\
  ```\n\n执行此代码后，你会得到一幅色彩对比非常强烈的图像（即超过 255 的那些点），如图 14-7 所示。\n\n![](img/336498_3_En_14_Fig7_HTML.jpg)\n\
  \n一幅插图表示将意大利国家队男子慢跑和足球的两张照片相加，结果产生了高色彩对比度的 RGB 色调。\n\n**图 14-7** 将两幅图像作为两个 NumPy\
  \ 矩阵相加得到的图像\n\n## 图像混合\n\n在前面的例子中，你看到两幅图像的相加或相减并不会产生介于两者之间的中间图像，而是使颜色向白色或黑色改变。正确的操作称为*混合*。也就是说，你可以想象将两幅图像叠加在一起，一幅放在上面，并使其逐渐变得越来越透明。通过逐渐调整透明度，你得到两幅图像的混合，从而创建一幅位于中间的新图像。混合操作并非简单的加法；其公式对应以下方程。\n\
  \n`img = α · img1 + (1 – α) · img2`，其中 `0 ≥ α ≥ 1`\n\n从这个方程可以看出，两幅图像有两个数值系数，取值范围在\
  \ 0 到 1 之间。随着 α 参数的增长，你会从第一幅图像平滑过渡到第二幅图像。`opencv` 库通过 `cv2.addWeighted()` 函数提供了混合操作。\n\
  \n因此，如果你想在两幅源图像之间创建一幅中间图像，可以使用以下代码。\n\n```\nimg3 = cv2.addWeighted(img, 0.3, img2,\
  \ 0.7, 0)\nplt.axis('off')\nplt.imshow(cv2.cvtColor(img3, cv2.COLOR_BGR2RGB))\n\
  plt.show()\n```\n\n结果将是一幅类似于图 14-8 所示的图像。\n\n![](img/336498_3_En_14_Fig8_HTML.jpg)\n\
  \n一幅插图表示将意大利国家队男子慢跑和足球的两张照片进行混合，呈现出透明叠加的效果。\n\n**图 14-8** 通过图像混合得到的新图像\n\n\n\n##\
  \ 图像分析\n\n上一节示例的目的是理解图像不过是 NumPy 数组。因此，这些数值矩阵是可以被处理的。所以，你可以实现许多数学函数来处理这些矩阵中的数值，从而获得新图像。这些通过运算得到的新图像，将用于提供新的信息。\n\
  \n这就是*图像分析*的基本概念。从原始图像（矩阵）到结果图像（矩阵）所进行的数学运算被称为*图像滤镜*（见图 14-9）。要理解这个过程，你肯定接触过照片编辑应用（如\
  \ Photoshop）。无论如何，你肯定见过可以应用到照片上的滤镜。这些滤镜实质上就是*算法*（一系列数学运算），用于修改原始图像矩阵中的数值。\n\n![](img/336498_3_En_14_Fig9_HTML.jpg)\n\
  \n两幅插图。A，图像 A 显示一个方框内的笑脸符号。通过应用图像滤镜生成图像 B，它是图像 A 的彩色版本。B，通过 F 括号表示从 A 到 B 的矩阵变化。矩阵有\
  \ m 列和 n 行。\n\n图 14-9 图像分析基础的图像滤镜示意图\n\n## 边缘检测与图像梯度分析\n\n在前面的章节中，你学习了一些对图像分析有用的基本操作。在本节中，你将从一个真实的图像分析案例开始，即*边缘检测*。\n\
  \n### 边缘检测\n\n在分析图像时，尤其是在计算机视觉领域，基本操作之一是理解图像的内容，例如物体和人。首先需要理解图像中可能呈现的形式。要理解所呈现的几何形状，就必须识别出将物体与背景或其他物体区分开来的轮廓。这正是边缘检测的任务。\n\
  \n在边缘检测领域，已经开发了大量算法和技术，它们利用不同的原理来确定物体的轮廓。其中许多技术基于颜色梯度的原理，并利用图像梯度分析过程。\n\n### 图像梯度理论\n\
  \n在可应用于图像的各种操作中，有图像的*卷积*运算，即应用特定的滤镜来编辑图像，以获取信息或其他用途。你已经知道，图像被表示为一个大的数值矩阵，其中每个像素的颜色由矩阵中\
  \ 0 到 255 之间的数字表示。卷积过程通过应用数学运算（*图像滤镜*）处理所有这些数值，并在一个相同尺寸的新矩阵中生成新的数值。\n\n其中一种运算是*导数*。简单来说，导数是能够计算数值变化速率（在空间、时间等方面）的数学运算。导数在图像情况下为何重要？因为它与颜色变化有关，这种变化称为*梯度*。能够计算颜色的梯度是检测图像边缘的绝佳工具。事实上，你的眼睛之所以能区分图像中图形的轮廓，正是由于颜色之间的跳跃。此外，你的眼睛能够通过从亮到暗的各种颜色深浅（即梯度）来感知深度。\n\
  \n由此可见，测量图像中的梯度对于检测图像边缘至关重要。这可以通过对图像执行一个简单的运算（即滤镜）来完成。\n\n为了从数学角度更好地理解这一点，请看图 14-10。\n\
  \n![](img/336498_3_En_14_Fig10_HTML.png)\n\n图像 A 和 B 的两个水平渐变块及其各自的图表。在图像 A 中，块的右侧有一个较暗的区域，而在图像\
  \ B 中，左右角都有暗区。在图表 A 中，线条呈上升趋势，而在图表 B 中，线条呈钟形趋势。\n\n图 14-10 图像梯度理论示意图\n\n如图 14-10\
  \ 所示，边缘无非是一种色调到另一种色调的快速过渡。为简化起见，0 代表黑色，1 代表白色。所有灰色阴影都是 0 到 1 之间的浮点值。如果将所有对应的梯度值绘制成图表，就会得到函数`f()`。如图所示，存在一个从\
  \ 0 到 1 的突变，这指示了边缘。函数`f()`的导数产生函数`f'()`。可以看到，色调的最大变化会导致数值接近 1。因此，在颜色转换时，你会得到一个图像，其中白色将指示边缘。\n\
  \n## 使用图像梯度分析进行边缘检测的实践示例\n\n进入实践部分，你将使用两张专门为测试轮廓分析而创建的图像，因为它们包含几个重要特征。\n\n第一张图像（如图\
  \ 14-11 所示）由黑白两色构成的两个箭头组成，对应文件`blackandwhite.jpg`。在这张图像中，颜色对比非常强烈，并且箭头的轮廓具有所有可能的朝向（水平、垂直和对角线）。这张测试图像将评估边缘检测在黑白色调系统中的效果。\n\
  \n![](img/336498_3_En_14_Fig11_HTML.png)\n\n一幅深色背景上两个颜色较浅、相互指向的箭头的插图。\n\n图 14-11\
  \ 代表两个箭头的黑白图像\n\n第二张图像`gradients.jpg`展示了不同的灰色渐变，当这些渐变彼此相邻放置时，会形成矩形，其边缘包含了所有可能的渐变和色调组合（如图\
  \ 14-12 所示）。这张图像是评估系统真实边缘检测能力的一个良好测试。\n\n![](img/336498_3_En_14_Fig12_HTML.jpg)\n\
  \n两幅水平与垂直方向的两组灰色渐变图案彼此相邻排列的插图，每组有十行十列，形成一个方块。\n\n图 14-12 一组彼此相邻放置的灰色渐变\n\n现在你可以开始编写边缘检测所需的代码。你将使用`matplotlib`在同一窗口中显示不同的图像。在此测试中，你将使用\
  \ OpenCV 提供的两种不同类型的图像滤镜：*sobel*和*laplacian*。实际上，它们的名称对应于对矩阵（图像）执行的数学运算的名称。`openCV`库提供了`cv2.Sobel()`和`cv2.Laplacian()`来应用这两种计算。\n\
  \n首先，从分析应用于`blackandwhite.jpg`图像的边缘检测开始。\n\n```python\nfrom matplotlib import pyplot\
  \ as plt\nimg = cv2.imread('blackandwhite.jpg',0)\nlaplacian = cv2.Laplacian(img,\
  \ cv2.CV_64F)\nsobelx = cv2.Sobel(img,cv2.CV_64F,1,0,ksize=5)\nsobely = cv2.Sobel(img,cv2.CV_64F,0,1,ksize=5)\n\
  plt.subplot(2,2,1),plt.imshow(img,cmap = 'gray')\nplt.title('Original'), plt.xticks([]),\
  \ plt.yticks([])\nplt.subplot(2,2,2),plt.imshow(laplacian,cmap = 'gray')\nplt.title('Laplacian'),\
  \ plt.xticks([]), plt.yticks([])\nplt.subplot(2,2,3),plt.imshow(sobelx,cmap = 'gray')\n\
  plt.title('Sobel Y'), plt.xticks([]), plt.yticks([])\nplt.subplot(2,2,4),plt.imshow(sobely,cmap\
  \ = 'gray')\nplt.title('Sobel Y'), plt.xticks([]), plt.yticks([])\nplt.show()\n\
  ```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将以下英文文本翻译为中文。\n\n\n当你运行这段代码时，你会得到一个包含四个方框的窗口（如图\
  \ 14-13 所示）。第一个方框是原始的黑白图像，而其他三个方框是三种滤波器应用于该图像后的结果。\n\n![](img/336498_3_En_14_Fig13_HTML.png)\n\
  \n4 张插图。A，原始图像，两个较浅色的箭头在深色背景上相对。B，拉普拉斯算子，箭头区域在灰色背景上被突出显示。C 和 D，Sobel X 和 Y，箭头的部分边缘在灰色背景上被检测到。\n\
  \n**图 14-13** 对 `blackandwhite.jpg` 图像应用边缘检测的结果\n\n关于 Sobel 滤波器，即使仅限于水平或垂直方向，边缘检测也是完美的。对角线在两种情况下都可见，因为它们同时具有水平和垂直分量，但\
  \ Sobel X 中的水平边缘和 Sobel Y 中的垂直边缘无论如何都无法被检测到。通过组合两个滤波器（两个导数的计算）得到拉普拉斯滤波器，边缘的确定是全向的，但会损失一些分辨率。实际上，你可以看到对应边缘的波纹更加柔和。灰度着色对于检测边缘和梯度非常有用，但如果你只对检测边缘感兴趣，则必须在\
  \ `cv2.CV_8U` 中设置输出图像文件。\n\n因此，你可以在之前代码的滤波器函数中将输出数据类型从 `cv2.CV_64F` 更改为 `cv2.CV_8U`。如下所示，替换传递给两个图像滤波器的参数。\n\
  \n```python\nlaplacian = cv2.Laplacian(img, cv2.CV_8U)\nsobelx = cv2.Sobel(img,cv2.CV_8U,1,0,ksize=5)\n\
  sobely = cv2.Sobel(img,cv2.CV_8U,0,1,ksize=5)\n```\n\n运行代码，你将得到类似的结果（如图 14-14 所示），但这次只有黑白两种颜色，边缘在黑色背景上以白色显示。\n\
  \n![](img/336498_3_En_14_Fig14_HTML.jpg)\n\n4 张深色背景上的插图。A，原始图像，两个较浅色的箭头相对。B，拉普拉斯算子，箭头区域被突出显示。C\
  \ 和 D，Sobel X 和 Y，检测到箭头的部分边缘。\n\n**图 14-14** 对 `blackandwhite.jpg` 图像应用边缘检测的结果\n\
  \n如果你仔细观察 Sobel 滤波器 X 和 Y 的面板，你会立刻注意到有些不对劲。缺失的边缘在哪里？在图 14-15 中留意这个问题。\n\n![](img/336498_3_En_14_Fig15_HTML.png)\n\
  \n4 张深色背景上的插图。A，原始图像，两个较浅色的箭头相对。B，拉普拉斯算子，箭头区域被突出显示。C 和 D，Sobel X 和 Y，检测到箭头的部分边缘。缺失的部分被圈出并标有问号。\n\
  \n**图 14-15** `blackandwhite.jpg` 图像中缺失的边缘\n\n实际上，转换数据时出现了问题。用 `cv2.CV_64F` 值在灰度中报告的梯度，在从黑色变为白色时由正值（正斜率）表示。然而，在从白色变为黑色时，它们由负值（负斜率）表示。在从\
  \ `cv2.CV_64F` 转换到 `cv2.CV_8U` 的过程中，所有负斜率都被归零，从而导致与这些边缘相关的信息丢失。当程序显示图像时，从白色到黑色的边缘不会显示出来。为了克服这个问题，你应该在滤波器输出中保持\
  \ `cv2.CV_64F` 格式的数据（而不是 `cv2.CV_8U`），然后计算绝对值，最后再转换为 `cv2.CV_8U`。\n\n对代码进行以下修改：\n\
  \n```python\nlaplacian64 = cv2.Laplacian(img, cv2.CV_64F)\nsobelx64 = cv2.Sobel(img,cv2.CV_64F,1,0,ksize=5)\n\
  sobely64 = cv2.Sobel(img,cv2.CV_64F,0,1,ksize=5)\nlaplacian = np.uint8(np.absolute(laplacian64))\n\
  sobelx = np.uint8(np.absolute(sobelx64))\nsobely = np.uint8(np.absolute(sobely64))\n\
  plt.subplot(2,2,1),plt.imshow(img,cmap = 'gray')\nplt.title('Original'), plt.xticks([]),\
  \ plt.yticks([])\nplt.subplot(2,2,2),plt.imshow(laplacian,cmap = 'gray')\nplt.title('Laplacian'),\
  \ plt.xticks([]), plt.yticks([])\nplt.subplot(2,2,3),plt.imshow(sobelx,cmap = 'gray')\n\
  plt.title('Sobel Y'), plt.xticks([]), plt.yticks([])\nplt.subplot(2,2,4),plt.imshow(sobely,cmap\
  \ = 'gray')\nplt.title('Sobel Y'), plt.xticks([]), plt.yticks([])\nplt.show()\n\
  ```\n\n现在，如果你执行它，你将得到正确的表示，即箭头边缘在黑色背景上以白色显示（如图 14-16 所示）。正如你所看到的，Sobel X 和 Sobel\
  \ Y 中没有出现边缘，因为它们与检测方向（水平和垂直）平行。\n\n![](img/336498_3_En_14_Fig16_HTML.png)\n\n4 张深色背景上的插图。A，原始图像，两个较浅色的箭头相对。B，拉普拉斯算子，箭头区域被突出显示。C\
  \ 和 D，Sobel X 和 Y，检测到箭头的整个边缘。\n\n**图 14-16** 对 `blackandwhite.jpg` 图像应用边缘检测的结果\n\
  \n除了边缘之外，你还会发现拉普拉斯和 Sobel 滤波器也可以检测灰度梯度的级别。将你所学的应用到 `gradient.jpg` 图像上。你需要对之前的代码做一些修改，只保留一个图像（拉普拉斯）可见。\n\
  \n```python\nfrom matplotlib import pyplot as plt\nimg = cv2.imread('gradients.jpg',0)\n\
  laplacian = cv2.Laplacian(img, cv2.CV_64F)\nsobelx = cv2.Sobel(img,cv2.CV_64F,1,0,ksize=5)\n\
  sobely = cv2.Sobel(img,cv2.CV_64F,0,1,ksize=5)\nlaplacian64 = cv2.Laplacian(img,\
  \ cv2.CV_64F)\nsobelx64 = cv2.Sobel(img,cv2.CV_64F,1,0,ksize=5)\nsobely64 = cv2.Sobel(img,cv2.CV_64F,0,1,ksize=5)\n\
  laplacian = np.uint8(np.absolute(laplacian64))\nsobelx = np.uint8(np.absolute(sobelx64))\n\
  sobely = np.uint8(np.absolute(sobely64))\nplt.imshow(laplacian,cmap = 'gray')\n\
  plt.title('Laplacian'), plt.xticks([]), plt.yticks([])\nplt.show()\n```\n\n通过执行这段代码，你将获得一张在黑色背景上显示白色边缘的图像（如图\
  \ 14-17 所示）。\n\n![](img/336498_3_En_14_Fig17_HTML.jpg)\n\n2 张插图，显示了并排的水平方向和垂直方向的两组渐变图案。它在深色背景上描绘了部分白色边缘。\n\
  \n**图 14-17** 对 `gradients.jpg` 图像应用边缘检测的结果\n\n## 一个深度学习示例：人脸检测\n\n在本章的最后部分，你将注意力转移到另一个在计算机视觉中被高度研究和应用的案例：人脸检测。这比边缘检测复杂得多，并且基于识别图像中的人脸。鉴于问题的复杂性，人脸检测使用了深度学习。事实上，这项技术的基础是专门设计用于识别照片中不同主体（包括人脸）的神经网络。物体检测技术的工作原理也非常相似。这个例子对于充分理解计算机视觉的核心——解释照片中存在的主体——非常有用。\n\
  \n在这个例子中，你将使用一个已经训练好的神经网络。事实上，为此类问题训练一个神经网络可能是一项复杂的操作，需要大量的时间和资源。幸运的是，网络上已经有一些经过训练的神经网络可以执行这类操作。对于这个测试，你将使用一个使用\
  \ `Caffe2` 框架开发的模型（更多信息请参见第 9 章）。\n\n\n\n当您希望在 OpenCV 环境中使用 Caffe 模型的深度神经网络模块时，需要以下两类文件：\n\
  \n- 一个 *prototxt* 文件，用于定义模型架构（即各层本身）。您将使用从网络下载的 `deploy.prototxt.txt` 文件（[`github.com/opencv/opencv/blob/master/samples/dnn/face_detector/deploy.prototxt`](https://github.com/opencv/opencv/blob/master/samples/dnn/face_detector/deploy.prototxt)）。\n\
  - 一个 *caffemodel* 文件，其中包含深度神经网络中各实际层的权重。该文件最为关键，因为它包含了该神经网络为执行特定任务而进行的所有“学习”。针对您的需求，可在此处获取一个\
  \ `caffemodel` 文件：[`github.com/opencv/opencv_3rdparty/tree/dnn_samples_face_detector_20170830`](https://github.com/opencv/opencv_3rdparty/tree/dnn_samples_face_detector_20170830)。\n\
  \n**注意：** 您也可以在本节源代码中找到这些文件。\n\n现在您已拥有所需的一切，首先上传神经网络模型及所有学习相关信息。`opencv` 库支持多种深度学习框架，并内置了许多辅助功能。特别地（正如本章开头所述），OpenCV\
  \ 拥有 `dnn` 模块，专门负责此类操作。\n\n要加载已学习的神经网络，您可以使用 `dnn.readNetFromCaffe()` 函数。\n\n```\n\
  net = cv2.dnn.readNetFromCaffe('deploy.prototxt.txt', 'res10_300x300_ssd_iter_140000.caffemodel')\n\
  ```\n\n作为测试图像，您可以使用意大利国家队球员的照片 `italy2018.jpg`。这张图片是一个绝佳示例，因为其中包含许多人脸。\n\n```\n\
  image = cv2.imread('italy2018.jpg')\n(h, w) = image.shape[:2]\n```\n\n另一个名为 `dnn.blobFromImage()`\
  \ 的函数负责对图像进行预处理，以适应神经网络的需求。例如，将图像调整为 300x300 像素，以便使用针对该尺寸图像训练好的 `caffemodel` 文件。\n\
  \n```\nblob = cv2.dnn.blobFromImage(cv2.resize(image, (300, 300)), 1.0, (300, 300),\
  \ (104.0, 177.0, 123.0))\n```\n\n然后定义一个置信度阈值，其推荐值为 0.5。\n\n```\nconfidence_threshold\
  \ = 0.5\n```\n\n最后执行人脸检测测试。\n\n```\nnet.setInput(blob)\ndetections = net.forward()\n\
  for i in range(0, detections.shape[2]):\n    confidence = detections[0, 0, i, 2]\n\
  \    if confidence > confidence_threshold:\n        box = detections[0, 0, i, 3:7]\
  \ * np.array([w, h, w, h])\n        (startX, startY, endX, endY) = box.astype(\"\
  int\")\n        text = \"{:.2f}%\".format(confidence * 100)\n        y = startY\
  \ - 10 if startY - 10 > 10 else startY + 10\n        cv2.rectangle(image, (startX,\
  \ startY), (endX, endY),(0, 0, 255), 2)\n        cv2.putText(image, text, (startX,\
  \ y), cv2.FONT_HERSHEY_SIMPLEX, 0.45, (0, 0, 255), 2)\nplt.axis('off')\nplt.imshow(cv2.cvtColor(image,\
  \ cv2.COLOR_BGR2RGB))\nplt.show()\n```\n\n执行代码后，将弹出一个窗口，显示人脸检测的处理结果（如图 14-18 所示）。结果令人难以置信，因为所有球员的面部均被检测到。您可以看到每张人脸被红色方框圈出，并在图像中以置信度百分比高亮显示。根据测试开始时指定的\
  \ `confidence_threshold` 参数，所有置信度百分比均大于 50%。\n\n![](img/336498_3_En_14_Fig18_HTML.jpg)\n\
  \n一张照片展示了意大利国家队队员在操场慢跑的场景。每位球员的面部均被边界框识别，并标注了置信度百分比。\n\n**图 14-18** 国家队足球运动员的面部均已准确识别。\n\
  \n\n\n## 结论\n\n在本章中，你看到了构成图像分析（尤其是计算机视觉）基础的一些简单技术示例。实际中，你了解了图像如何通过滤镜进行处理，以及如何利用边缘检测构建一些复杂的技术。你还看到了计算机视觉如何通过使用深度学习神经网络来识别图像中的人脸（即人脸检测）。\n\
  \n希望本章能成为你深入探索该主题的良好起点。如果你有兴趣，可以在我的网站 [`https://meccanismocomplesso.org`](https://meccanismocomplesso.org)\
  \ 找到关于此主题的深入信息。\n\n"
