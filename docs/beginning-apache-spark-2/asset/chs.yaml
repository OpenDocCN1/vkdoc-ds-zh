- '# 函数


  DataFrame API 旨在对数据集中的单行进行操作或转换，例如过滤或分组。如果我们要转换数据集中每一行某个列的值，例如将字符串从大写转换为驼峰式，那么我们会使用函数来完成。函数本质上是应用于列的方法。Spark
  SQL 提供了大量常用的内置函数，同时也为我们提供了一种创建自定义函数的简便方法。


  ## 使用内置函数


  要高效地使用 Spark SQL 执行分布式数据处理，你必须熟练掌握 Spark SQL 的内置函数。这些内置函数旨在运行时生成优化代码，因此最好优先使用它们，然后再尝试创建自己的函数。这些函数的一个共同点是，它们都设计为将同一行的一个或多个列作为输入，并且只返回单个列作为输出。Spark
  SQL 提供了超过 200 个内置函数，它们被分为不同的类别。这些函数可以在 DataFrame 操作中使用，例如 `select`、`filter`、`groupBy`
  等。有关内置函数的完整列表，请参阅 `https://spark.apache.org/docs/latest/api/scala/index.html#org.apache.spark.sql.functions$`
  上的 Spark API Scala 文档。表 5-3 将它们分为不同的类别。


  **表 5-3** 每个类别的部分内置函数


  | 类别 | 描述 |

  | --- | --- |

  | 日期时间 | `unix_timestamp`, `from_unixtime`, `to_date`, `current_date`, `current_timesatmp`,
  `date_add`, `date_sub`, `add_months`, `datediff`, `months_between`, `dayofmonth`,
  `dayofyear`, `weekofyear`, `second`, `minute`, `hour`, `month` |

  | 字符串 | `concat`, `length`, `levenshtein`, `locate`, `lower`, `upper`, `ltrim`,
  `rtrim`, `trim`, `lpad`, `rpad`, `repeat`, `reverse`, `split`, `substring`, `base64`
  |

  | 数学 | `cos`, `acos`, `sin`, `asin`, `tan`, `atan`, `ceil`, `floor`, `exp`, `factorial`,
  `log`, `pow`, `radian`, `degree`, `sqrt`, `hex`, `unhex` |

  | 加密 | `cr32`, `hash`, `md5`, `sha1`, `sha2` |

  | 聚合 | `approx._count_distinct`, `countDistinct`, `sumDistinct`, `avg`, `corr`,
  `count`, `first`, `last`, `max`, `min`, `skewness`, `sum` |

  | 集合 | `array_contain`, `explode`, `from_json`, `size`, `sort_array`, `to_json`,
  `size` |

  | 窗口 | `dense_rank`, `lag`, `lead`, `ntile`, `rank`, `row_number` |

  | 杂项 | `coalesce`, `isNan`, `isnull`, `isNotNull`, `monotonically_increasing_id`,
  `lit`, `when` |


  这些函数大多易于理解且使用简单。以下各节将提供一些有趣函数的工作示例。


  ### 使用日期时间函数


  你使用 Spark 进行数据分析的次数越多，就越有可能遇到包含一个或多个日期或时间相关列的数据集。Spark 内置的日期时间函数大致分为以下三类：将日期或时间戳从一种格式转换为另一种格式、执行日期时间计算以及从日期或时间戳中提取特定值。


  日期和时间转换函数有助于将字符串转换为日期、时间戳或 Unix 时间戳，反之亦然。它在内部使用 Java 日期格式模式语法，该语法记录在 [`http://docs.oracle.com/javase/tutorial/i18n/format/simpleDateFormat.html`](http://docs.oracle.com/javase/tutorial/i18n/format/simpleDateFormat.html)
  中。这些函数使用的默认日期格式是 `yyyy-MM-dd HH:mm:ss`。因此，如果日期或时间戳列的日期格式不同，则需要向这些转换函数提供该模式。清单 5-34
  展示了一个将字符串类型的日期和时间戳转换为 Spark 日期和时间戳类型的示例。


  ```

  // 最后两列不遵循默认日期格式

  val testDateTSDF = Seq((1, "2018-01-01", "2018-01-01 15:04:58:865", "01-01-2018",
  "12-05-2017 45:50"))

  .toDF("id", "date", "timestamp", "date_str", "ts_str")

  // 将这些字符串转换为日期、时间戳和 Unix 时间戳

  // 并指定自定义的日期和时间戳格式

  val testDateResultDF =  testDateTSDF.select(to_date(''date).as("date1"),

  to_timestamp(''timestamp).as("ts1"),

  to_date(''date_str, "MM-dd-yyyy").as("date2"),

  to_timestamp(''ts_str, "MM-dd-yyyy mm:ss").as("ts2"),

  unix_timestamp(''timestamp).as("unix_ts")).show(false)

  // date1 和 ts1 分别是 date 和 timestamp 类型

  testDateResultDF.printSchema

  |-- date1: date (nullable = true)

  |-- ts1: timestamp (nullable = true)

  |-- date2: date (nullable = true)

  |-- ts2: timestamp (nullable = true)

  |-- unix_ts: long (nullable = true)

  testDateResultDF.show

  +---------+-------------------+----------+--------------------+-----------+

  |    date1|                ts1|     date2|                 ts2|    unix_ts|

  +---------+-------------------+----------+--------------------+-----------+

  |2018-01-01| 2018-01-01 15:04:58| 2018-01-01| 2017-12-05 00:45:50| 1514847898|

  +---------+-------------------+----------+--------------------+-----------+

  清单 5-34

  将字符串类型的日期和时间戳转换为 Spark 日期和时间戳类型。

  ```


  使用 `date_format` 函数并指定自定义日期格式，或使用 `from_unixtime` 函数将 Unix 时间戳（以秒为单位）转换为字符串，同样可以轻松地将日期或时间戳转换为时间字符串。有关转换示例，请参见清单
  5-35。


  ```

  testDateResultDF.select(date_format(''date1, "dd-MM-YYYY").as("date_str"),

  date_format(''ts1, "dd-MM-YYYY HH:mm:ss").as("ts_str"),

  from_unixtime(''unix_ts,"dd-MM-YYYY HH:mm:ss").as("unix_ts_str")).show

  +-----------+--------------------+--------------------+

  |   date_str|              ts_str|         unix_ts_str|

  +-----------+--------------------+--------------------+

  | 01-01-2018| 01-01-2018 15:04:58| 01-01-2018 15:04:58|

  +-----------+--------------------+--------------------+

