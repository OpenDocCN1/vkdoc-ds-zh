- '# 6. Spark Streaming


  除了批数据处理之外，流数据处理已成为任何希望利用实时数据价值以增强竞争优势或改善用户体验的企业必备的能力。随着物联网的出现，实时数据的体量和速度比以往任何时候都增长得更快。对于
  Facebook、LinkedIn 和 Twitter 等互联网公司而言，其平台上每秒发生的数百万次社交活动都以流数据的形式呈现。


  从高层次来看，流处理是关于对无界数据流进行持续处理。以大规模、容错且一致的方式做到这一点是一项相当具有挑战性的任务。幸运的是，像 Spark、Flink、Samza、Heron
  和 Kafka 这样的流处理引擎在过去几年中一直在稳步且显著地成熟，使企业能够构建和运营复杂的流处理应用程序。


  随着社区对如何最好地将日益成熟的流处理引擎应用于其业务需求的理解加深，越来越多有趣的实时数据处理用例涌现出来。例如，Uber 利用流处理能力近乎实时地了解其平台上的乘客和司机数量，这些近乎实时的洞察影响着业务决策，例如将城市中低需求区域的过剩司机转移到高需求区域。大多数互联网公司在发布新功能或尝试新设计时，都会利用某种
  A/B 实验系统进行 A/B 测试。流处理通过将了解实验效果所需的时间从几天缩短到几小时，从而能够更快地对实验做出反应。欺诈检测是一个拥抱流处理的领域，因为它能从对欺诈活动的即时洞察中获益，从而可以阻止或监控这些活动。对于拥有数百个在线服务的大型公司来说，一个常见需求是通过流数据处理近乎实时地处理生成的大量日志来监控其健康状况。还有更多有趣的实时数据处理用例，其中一些将在本章中分享。


  本章首先描述一些有用的流处理概念，然后简要介绍流处理引擎的格局。接着，本章的其余部分将详细描述 Spark 流处理引擎及其提供的 API。




  '
- '# 流处理


  在大数据领域，随着 Hadoop 的引入，批数据处理广为人知。流行的 `MapReduce` 框架是 Hadoop 生态系统中的组件之一，它凭借其强大的能力和稳健性成为了批数据处理领域的王者。在批数据处理领域经历了一段创新期后，该领域的大部分挑战如今都已得到充分理解。自那以后，大数据开源社区已将关注点和创新方向转向了流数据处理领域。


  批数据处理是指对固定的输入数据集运行计算逻辑，并在最后产生结果。这意味着当处理到数据集末尾时，处理过程就会停止。相比之下，流数据处理是对无界数据集运行计算逻辑，因此处理过程是持续且长期运行的。尽管批数据和流数据的主要区别在于数据的有界性，但由于数据无界的特性、实时数据的到达顺序、数据到达的不同速率，以及在机器故障情况下对正确性和低延迟的期望，流数据处理比批数据处理要复杂和具有挑战性得多。


  在批数据处理领域，由于输入数据集规模庞大，一个复杂的批处理作业耗时数小时完成的情况并不少见。而在流数据处理领域，人们期望流处理引擎能够尽可能快速高效地处理传入的数据流，从而能够快速做出反应或提取洞察，以此提供低延迟和高吞吐量。执行任何有意义且有趣的流数据处理，通常都需要以容错的方式维护某种状态。例如，一个股票交易流处理应用希望维护并显示当天交易最活跃的前
  10 或 20 只股票。为了实现这一目标，每只股票的实时计数必须由流处理引擎代表应用来维护，或者由应用自身来维护。通常，状态会保存在内存中，并由磁盘等弹性存储作为后盾，这样状态就能抵御机器故障。


  流数据处理并非孤立运作。有时需要与批数据处理协同工作，以丰富传入的流数据。一个很好的例子是，当页面浏览流处理应用需要根据用户位置计算其页面浏览统计信息时，它就需要将用户点击和流数据与成员数据关联起来。一个好的流处理引擎应提供一种简便的方法，无需太多精力就能将批数据与流数据关联起来。


  流数据处理的一个常见用例是对传入的数据执行某些聚合操作，然后将汇总后的数据写入外部数据接收端，供 Web 应用或数据分析引擎消费。这里的期望是，在面对故障（无论是机器故障还是数据处理应用中的某些错误）时，能够实现端到端、恰好一次的数据保证。关键在于流处理引擎如何处理故障，以确保传入数据既不丢失，也不会被重复计数。


  随着流处理引擎的成熟，它们不仅提供了所需的分布式系统特性，如快速、可扩展和容错，还通过将抽象层次从低级 API 提升到高级声明式语言（如 SQL），提供了简单且对开发者友好的方式来执行数据流计算。借助这一进步，构建一个自助式流处理平台变得更加容易，使产品团队能够通过利用公司内各种产品生成的数据或事件，快速做出有意义的业务决策。请记住，数据流处理的目标之一就是及时提取业务洞察，以便企业能够快速做出反应或采取业务行动。


  总而言之，流数据处理有其自身的一系列独特挑战，这些挑战源于处理连续且无界的数据。当你着手构建长期运行的流数据处理应用，或评估某个特定的流处理引擎时，务必留意这些挑战。这些挑战如下：


  *   以可靠的方式为数据流应用维护可能很大的状态

  *   高效快速地传递消息供应用处理

  *   处理乱序到达的流数据

  *   与批数据关联以丰富传入的流数据

  *   即使在发生故障时，也能实现端到端、恰好一次的数据传递保证

  *   处理不均匀的数据到达速率


  ## 概念


  为了有效地进行流数据处理，理解以下核心且通用的概念至关重要。这些重要概念非常适用于在任何流处理引擎上开发流应用。了解这些概念在评估流处理引擎时会很有用；它们还能让你提出正确的问题，以了解特定流处理引擎在以下每个领域提供了多少支持：


  *   数据传递语义

  *   时间概念

  *   窗口




  '
- '# 数据投递语义


  当一条数据进入流处理引擎时，引擎有责任将其投递给流应用程序进行处理。即使在故障场景下，流处理引擎也能提供三种类型的保障。


  - **至多一次**：这意味着流处理引擎保证每条数据最多被投递给应用程序一次，但也可能为零次。换句话说，数据存在丢失的可能性，因此应用程序可能完全看不到该数据。对于某些用例来说，这是可以接受的，但对于其他用例则不然。其中一个例子是金融交易处理应用程序。数据丢失可能导致无法向客户收费，从而造成收入减少。


  - **至少一次**：这意味着流处理引擎保证每条数据会被投递给应用程序一次或多次。在这种情况下不会丢失数据，但可能出现重复计数或三次计数的情况。以金融交易处理应用程序为例，这意味着同一笔交易会被多次执行，从而引发客户投诉。这种保障比"至多一次"更强，因为不会丢失任何数据。


  - **恰好一次**：这意味着流处理引擎保证每条数据仅被投递给应用程序一次，不多也不少。在这种情况下，既不会丢失数据，也不会出现重复计数。大多数现代流行的流处理引擎都提供这种保障。在这三种保障中，这是构建关键业务流应用程序最理想的选择。


  看待这些投递语义的一种方式是，它们构成了一个频谱，其中"至多一次"是最弱的保障，"恰好一次"是最强的保障，如图 6-1 所示。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig1_HTML.jpg](img/419951_1_En_6_Fig1_HTML.jpg)


  图 6-1


  投递语义频谱


  在评估流处理引擎时，不仅要理解其提供的保障级别，还要理解该保障背后的实现方式。大多数现代流处理引擎结合使用检查点（check-pointing）和预写日志（write-ahead
  log）技术来提供"恰好一次"的保障。


  '
- '# 时间概念


  在流数据处理领域，时间概念非常重要，因为它能让你从时间维度理解正在发生的事情。例如，在实时异常检测应用程序中，时间概念能让你洞察过去五分钟内或一天中某个时段发生的可疑交易数量。


  有两种重要的时间类型：事件时间和处理时间。如图 6-2 所示，事件时间代表数据被创建的时间，该信息通常编码在数据中。例如，对于测量世界某处海洋温度的物联网设备，事件时间就是温度被测量的时刻。温度数据的编码可能包含温度值本身和一个时间戳。处理时间则代表流处理引擎处理一条数据的时间。在海洋温度物联网设备的例子中，处理时间就是流处理引擎开始对温度数据执行转换或聚合操作时的时钟时间。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig2_HTML.jpg](img/419951_1_En_6_Fig2_HTML.jpg)


  图 6-2


  事件时间和处理时间


  要真正理解传入数据流背后的情况，必须能够根据事件时间处理传入数据，因为事件时间代表了数据被创建的时间点。在理想状态下，数据会在创建后不久到达并被处理，因此事件时间和处理时间之间的差距很小。但在现实中，情况往往并非如此，因此延迟会根据阻碍数据在创建后立即到达的条件而随时间变化。延迟越大，就越需要能够使用事件时间而非处理时间来处理数据。图
  6-3 说明了事件时间和处理时间之间的关系，并展示了现实中延迟可能呈现的样子。时间概念与接下来要描述的窗口概念密切相关。为了处理无界的传入数据流，流数据处理领域的一种常见做法是使用开始时间和结束时间作为边界，将传入数据划分为多个数据块。很明显，使用事件时间作为时间边界更为合理。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig3_HTML.jpg](img/419951_1_En_6_Fig3_HTML.jpg)


  图 6-3


  事件时间与处理时间之间的延迟




  ### 窗口化


  鉴于流式数据的无界特性，对传入的流式数据拥有全局视图是不可行的。因此，为了从传入数据中提取任何有意义的价值，你需要将其分块处理。例如，假设一个交通流量传感器每
  20 秒发出一次车辆计数，计算最终总和是不可行的。相反，更合理的做法是询问每分钟或每五分钟有多少辆车经过该传感器。在这种情况下，你需要将交通计数数据分别划分为一分钟或五分钟的块。每个块被称为一个*窗口*。


  窗口化是一种常见的流式数据处理模式，它将无界的传入数据流根据时间边界划分为块，这些时间边界可以是事件时间或处理时间，尽管前者更常用于反映数据的实际状况。然而，由于数据可能不会按照其创建顺序到达，或者可能因网络拥塞而延迟，因此不可能始终拥有在该时间窗口内创建的所有数据。


  有三种常用的窗口化模式，大多数现代流处理引擎都支持它们。图 6-4 展示了这三种模式。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig4_HTML.jpg](img/419951_1_En_6_Fig4_HTML.jpg)


  图 6-4：三种常用的窗口化模式


  固定/滚动窗口基本上将传入的数据流划分为固定大小的段，每个段都有一个窗口长度、一个开始时间和一个结束时间。每条传入的数据将被分配到一个且仅一个固定/滚动窗口中。有了每个窗口中的这一小批数据，在执行求和、最大值或平均值等聚合操作时就很容易进行推理。


  滑动窗口是另一种将传入数据流划分为固定大小段的方式，每个段都有一个窗口长度和一个滑动间隔。如果滑动间隔与窗口长度相同，那么它就等同于固定/滚动窗口。图 6-4
  中的示例显示滑动间隔小于窗口长度。这意味着一条或多条数据将被包含在多个滑动窗口中。由于窗口的重叠，聚合结果将比固定/滚动窗口更平滑。


  会话窗口类型通常用于分析用户在网站上的行为。与固定/滚动窗口和滑动窗口不同，它没有预定的窗口长度。相反，它通常由一个超过某个阈值的不活动间隔来决定。例如，Facebook
  上的会话窗口长度由用户执行的活动持续时间决定，例如浏览用户动态、发送消息等。


  ### 流处理引擎概览


  开源社区在提出流式数据处理解决方案方面不乏创新。事实上，目前有多种流处理引擎。一些早期的流处理引擎是因需求而生，一些较晚的则源于研究项目，还有一些是从批处理引擎演变而来。本节介绍几个流行的流处理引擎：Apache
  Storm、Apache Samza、Apache Flink、Apache Kafka Streams、Apache Apex 和 Apache Beam。


  Apache Storm 是流式数据处理领域的先驱之一，其流行主要与 Twitter 进行的大规模流处理有关。Apache Storm 于 2011 年首次发布，并于
  2014 年成为 Apache 顶级项目。2015 年，Twitter 放弃了 Apache Storm，转而使用 Heron，后者是 Apache Storm
  的下一代产品。Heron 比 Apache Storm 资源效率更高，吞吐量也更好。


  Apache Samza 由 LinkedIn 创建，用于帮助解决其流处理需求，并于 2013 年开源。它被设计为与 Kafka 紧密协作，并运行在 Hadoop
  YARN 之上，以实现进程隔离、安全性和容错性。Apache Samza 被设计用于处理流，这些流由有序、可分区、可重放且容错的不可变消息集组成。


  Apache Flink 最初是作为名为 Stratosphere: Information Management on the Cloud 的研究项目的一个分支开始的。它于
  2015 年成为 Apache 顶级项目，此后作为高吞吐量、低延迟的流引擎稳步获得普及。Apache Flink 与 Apache Storm 和 Apache
  Samza 的一个关键区别在于，Apache Flink 在同一引擎中同时支持批处理和流处理。


  Apache Kafka 已从分布式发布-订阅消息系统演变为分布式流平台。它由 LinkedIn 创建，并于 2012 年成为 Apache 顶级项目。与其他流处理引擎不同，Kafka
  的流处理能力被打包成一个轻量级库，这使得编写实时流应用程序变得容易。


  Apache Apex 是该领域相对较新的成员。它由一家名为 DataTorrent 的公司开发，该公司于 2016 年决定将其开源。Apache Apex 被认为是一个统一的流和批处理
  Hadoop YARN 原生平台。


  Apache Beam 是一个相当有趣的项目，于 2016 年出自 Google。该项目背后的主要思想是提供一个强大且易于使用的模型，用于流处理和批处理，并且该模型可跨多种运行时平台（如
  Apache Flink、Apache Spark 和 Google Cloud DataFlow）移植。换句话说，可以将 Apache Beam 视为大数据的超级
  API。


  有两种标准的流处理模型，前面提到的每个流处理引擎（Apache Beam 除外）都采用其中一种。这两种模型称为*逐条记录*和*微批处理*，如图 6-5 所示。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig5_HTML.jpg](img/419951_1_En_6_Fig5_HTML.jpg)


  图 6-5：两种不同的流处理模型


  两种模型都有其固有的优缺点。逐条记录模型顾名思义；它会在每条输入数据到达时立即处理。因此，该模型提供了尽可能低的延迟。微批处理模型会等待并根据可配置的批处理间隔累积一小批输入数据，然后并行处理每个批次。很明显，微批处理模型无法提供与另一种模型相同的延迟水平。然而，在吞吐量方面，微批处理具有更高的速率，因为一批数据以优化的方式处理，因此与另一种模型相比，每条数据的成本较低。一个有趣的附带说明是，在逐条记录模型之上构建微批处理模型是相当容易的。


  在列出的所有流处理引擎中，只有 Apache Spark 采用了微批处理模型；不过，已经有一些工作正在进行以支持逐条记录模型。




  '
- '# Spark Streaming 概述


  Apache Spark 统一数据处理平台之所以广受欢迎，其中一个因素便是它既能执行批处理，也能执行流处理。


  在简要介绍了流处理的复杂性与挑战，以及几个核心概念之后，本章的剩余部分将聚焦于 Spark 流处理主题。首先，我们将对 Spark 第一代流处理引擎（称为 `DStream`）的部分功能进行简要且高层次的了解。然后，本章的大部分内容将详细介绍
  Spark 的第二代流处理引擎，即 `Structured Streaming`。新的 Spark 流处理应用程序应基于 `Structured Streaming`
  进行开发，以利用其提供的一些独特且高级的功能。


  ## Spark DStream


  Spark 第一代流处理引擎于 2012 年推出，该引擎的主要编程抽象称为*离散化流*，即 `DStream`。其工作原理是采用微批处理模型，将传入的数据流划分为多个批次，然后由
  Spark 批处理引擎进行处理。当 `RDD` 是主要的编程抽象模型时，这种方法非常合理。每个批次在内部由一个 `RDD` 表示。一个批次中的数据量是传入数据速率和批次间隔的函数。图
  6-6 从高层次展示了 `DStream` 的工作方式。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig6_HTML.jpg](img/419951_1_En_6_Fig6_HTML.jpg)


  **图 6-6** Spark DStream


  可以从来自 Kafka、AWS Kinesis、文件或套接字等源头的输入数据流创建 `DStream`。创建 `DStream` 时需要的关键信息之一是批次间隔，该间隔可以以秒或毫秒为单位。使用
  `DStream`，您可以对传入的数据流应用高级数据处理函数，例如 `map`、`filter`、`reduce` 或 `reduceByKey`。此外，您还可以通过提供窗口长度和滑动间隔，在固定/滚动窗口或滑动窗口上执行归约和计数等窗口操作。需要注意的一点是，窗口长度和滑动间隔必须是批次间隔的倍数。例如，如果批次间隔为三秒，并且使用固定/滚动间隔，则窗口长度和滑动间隔可以是六秒。`DStream`
  支持在跨批次数据执行计算时维护任意状态，但这需要手动操作，且有些繁琐。使用 `DStream` 可以做的很酷的事情之一是将其与另一个 `DStream` 或表示静态数据的
  `RDD` 进行连接。在所有处理逻辑完成后，您可以使用 `DStream` 将数据写入外部系统，例如数据库、文件系统或 HDFS。


  任何新的 Spark 流处理应用程序都应基于第二代 Spark 流处理引擎 `Structured Streaming` 进行开发，这将在下一节中介绍。在本节的剩余部分，您将看到一个小的单词计数
  Spark `DStream` 应用程序；目的是让您了解典型的 Spark `DStream` 应用程序是什么样的。清单 6-1 包含了单词计数应用程序的代码，这是
  Apache Spark 的一个示例（参见 [`https://bit.ly/2G8N30G`](https://bit.ly/2G8N30G)）。


  ```

  object NetworkWordCount {

  def main(args: Array[String]) {

  // 创建上下文，批次大小为 1 秒

  val sparkConf = new SparkConf().setAppName("NetworkWordCount")

  val ssc = new StreamingContext(sparkConf, Seconds(1))

  val host = "localhost"

  val port = 9999

  val lines = ssc.socketTextStream(host, port, StorageLevel.MEMORY_AND_DISK_SER)

  val words = lines.flatMap(_.split(" "))

  val wordCounts = words.map(x => (x, 1)).reduceByKey(_ + _)

  wordCounts.print()

  ssc.start()

  ssc.awaitTermination()

  }

  }

  ```


  **清单 6-1** Apache Spark DStream 单词计数应用程序


  在构建 `DStream` 应用程序时，有几个重要的步骤。`DStream` 应用程序的入口点是 `StreamingContext`，其中一个必需的输入是批次间隔，它定义了
  Spark 用于将传入数据批处理到 `RDD` 中进行处理的时间段。它也代表了 Spark 何时应执行流应用程序计算逻辑的触发点。例如，如果批次间隔为三秒，那么
  Spark 会将这三秒间隔内到达的所有数据分批；在该间隔结束后，它会将该批数据转换为 `RDD`，并根据您提供的处理逻辑进行处理。创建 `StreamingContext`
  后，下一步是通过定义输入源来创建 `DStream` 实例。前面的示例将输入源定义为读取文本行的套接字。在此之后，您需要为新创建的 `DStream` 提供处理逻辑。前面示例中的处理逻辑并不复杂。一旦在一秒后获得了包含多行文本的
  `RDD`，Spark 就会执行将每行拆分为单词、将每个单词转换为单词与计数 1 的元组，最后对相同单词的计数进行求和的逻辑。最后，计数结果会打印在控制台上。请记住，流应用程序是一个长期运行的应用程序；因此，它需要一个信号来启动接收和处理传入数据流的任务。该信号通过调用
  `StreamingContext` 的 `start()` 函数发出，这通常放在文件的末尾。`awaitTermination()` 函数用于等待流应用程序的执行停止，同时也作为一种机制，防止驱动程序在流应用程序运行时退出。在典型的程序中，一旦最后一行代码执行完毕，程序就会退出。然而，一个长期运行的流应用程序一旦启动就需要持续运行，并且只有在您明确停止它时才会结束。


  ## Spark Structured Streaming


  `Structured Streaming` 是 Spark 的第二代流处理引擎。它的设计目标是更快、更具可扩展性、更容错，并解决第一代流处理引擎的缺点。它旨在让开发人员能够构建端到端的流处理应用程序，这些应用程序可以使用简单的编程模型实时响应数据，该模型构建在
  Spark SQL 引擎经过优化且坚实的基础上。`Structured Streaming` 的一个显著特点是它为工程师提供了一种独特且简单的方式来构建流处理应用程序。


  构建生产级流处理应用程序需要克服许多挑战，基于此，`Structured Streaming` 引擎旨在帮助应对这些挑战：


  *   处理端到端的可靠性并保证正确性

  *   对各种传入数据执行复杂转换

  *   基于事件时间处理数据，并轻松处理乱序数据

  *   与各种数据源和数据接收器集成


  以下各节将介绍 `Structured Streaming` 引擎的各个方面，以及它为应对这些挑战所提供的支持。




  ### 概述


  结构化流有两个关键思想。第一个是将流式计算视为与批处理相同的方式，即将传入的数据流视为一张输入表，当新一批数据到达时，将其视为追加到输入表的一组新行，如图 6-7
  所示。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig7_HTML.jpg](img/419951_1_En_6_Fig7_HTML.jpg)


  图 6-7


  将流式数据视为持续更新的表


  另一种理解传入数据流的方式是，它不过是一张持续追加数据的表。这个简单但激进的想法有许多影响。其中之一是能够利用 Scala、Java 或 Python 中现有的
  `DataFrame` 和 `Dataset` 结构化 API 来执行流式计算，并由结构化流引擎负责在新流式数据到达时增量且持续地运行它们。图 6-8 直观地比较了在
  Spark 中执行批处理和流处理的过程。另一个影响是，前一章讨论的同一个 Catalyst 引擎被用于优化通过结构化 API 表达的流式计算。你从使用结构化 API
  中获得的知识可以直接迁移到构建运行在 Spark 结构化流引擎上的流式应用程序。唯一需要额外学习的是流处理领域特有的部分，例如事件时间处理和维护状态。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig8_HTML.jpg](img/419951_1_En_6_Fig8_HTML.jpg)


  图 6-8


  Spark 中批处理与流处理的比较


  第二个关键思想是与存储系统的事务性集成，以提供端到端的精确一次（exactly once）保证。这里的目标是确保从存储系统读取数据的服务应用程序能够看到流式应用程序已处理数据的一致快照。传统上，开发人员有责任确保在将数据从流式应用程序发送到外部存储系统时没有重复数据或数据丢失。这是流式应用程序开发者提出的痛点之一。在内部，结构化流引擎已经提供了精确一次保证，现在，只要外部存储系统支持事务，同样的保证也扩展到了这些系统。


  从 Apache Spark 2.3 开始，结构化流引擎的处理模型已扩展为支持一种称为*连续处理*的新模型。之前的处理模型是微批处理模型，这也是默认模型。鉴于微批处理模型的特性，它适用于能够容忍
  100 毫秒级别端到端延迟的用例。对于需要低至 1 毫秒端到端延迟的其他用例，则应使用连续处理模型；然而，截至 Apache Spark 2.3，该模型仍处于实验状态，并且在允许的流式计算方面有一些限制。


  ### 核心概念


  本节介绍在构建流式应用程序之前需要理解的一组核心概念。流式应用程序的主要部分包括：指定一个或多个流式数据源，以 `DataFrame` 转换的形式提供处理传入数据流的逻辑，定义输出模式和触发器，最后指定一个数据接收器来写入结果。由于输出模式和触发器都有默认值，如果它们的默认值满足你的用例，则它们是可选的。图
  6-9 概述了前面提到的步骤。可选步骤用星号标记。


  ![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig9_HTML.jpg](img/419951_1_En_6_Fig9_HTML.jpg)


  图 6-9


  结构化流应用程序的核心组成部分


  以下各节将详细描述这些概念中的每一个。


  #### 数据源


  让我们从数据源开始。对于批处理，数据源是驻留在某个存储系统（如本地文件系统、HDFS 或 S3）上的静态数据集。结构化流中的数据源则完全不同。它们产生的数据是连续的，可能永远不会结束，并且产生速率会随时间变化。结构化流提供了以下开箱即用的数据源：


  *   *Kafka 数据源*：需要 Apache Kafka 0.10 或更高版本。这是生产环境中最流行的数据源。使用此数据源需要基本了解 Kafka 的工作原理。连接和读取
  Kafka 主题的数据需要提供一组特定的设置。更多详细信息，请参阅 Spark 网站上的 Kafka 集成指南。


  *   *文件数据源*：文件位于本地文件系统、HDFS 或 S3 上。当新文件被放入目录时，此数据源会拾取它们进行处理。支持常用的文件格式，例如文本、CSV、JSON、ORC
  和 Parquet。有关支持的文件格式的最新列表，请参阅 `DataStreamReader` 接口。使用此数据源时的一个良好实践是，先将输入文件完整写入，然后再将它们移动到该数据源的路径中。


  *   *Socket 数据源*：仅用于测试目的。它从监听特定主机和端口的套接字读取 UTF-8 数据。


  *   *Rate 数据源*：仅用于测试和基准测试目的。此数据源可以配置为每秒生成一定数量的事件，每个事件包含一个时间戳和一个单调递增的值。这是学习结构化流时最容易使用的数据源。


  数据源需要为结构化流提供的一个关键属性是能够跟踪流中的读取位置，以便实现端到端的精确一次保证。例如，Kafka 数据源提供 Kafka 偏移量来跟踪主题分区的读取位置。此属性决定了特定数据源是否具有容错能力。表
  6-1 描述了每个开箱即用数据源的一些选项。


  表 6-1


  开箱即用的数据源


  | 名称 | 容错 | 配置 |

  | --- | --- | --- |

  | 文件 | 是 | `path`：输入目录的路径`maxFilesPerTrigger`：每个触发器读取的最大新文件数`latestFirst`：是否优先处理最新文件（按修改时间）
  |

  | Socket | 否 | 需要以下配置：`host`：要连接的主机`port`：要连接的端口 |

  | Rate | 是 | `rowsPerSecond`：每秒生成的行数`rampUpTime`：达到 `rowsPerSecond` 之前的启动时间（秒）`numPartitions`：分区数
  |

  | Kafka | 是 | `kafka.bootstrap.servers`：Kafka 代理的 `host:port` 逗号分隔列表`subscribe`：主题的逗号分隔列表更多详细信息，请参阅
  Spark 网站上的 Kafka 集成指南（`https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html`）。
  |


  Apache Spark 2.3 引入了 DataSource V2 API，这是一组官方支持的接口，供 Spark 开发者开发能够轻松与结构化流集成的自定义数据源。借助这套定义明确的
  API，自定义结构化流数据源的数量将在不久的将来大幅增加。




  ### 输出模式


  输出模式用于告知 Structured Streaming 如何将输出数据写入接收器。这一概念是 Spark 流式处理所独有的，共有三种选项。


  - **追加模式**：若未指定输出模式，此为默认模式。在此模式下，仅结果表中新增的行会被发送至指定的输出接收器。

  - **完整模式**：整个结果表都会被写入输出接收器。

  - **更新模式**：仅结果表中被更新的行会被写入输出接收器。未发生变化的行则不会被写出。


  输出模式是一个需要花些时间才能适应的概念，因为它涉及多个维度。面对这三种选项，人们自然会好奇在何种情况下应使用某一种输出模式而非其他模式。当你通过几个示例进行实践后，这一概念会变得更加清晰。


  ### 触发器类型


  触发器是另一个需要理解的重要概念。Structured Streaming 引擎利用触发器信息来决定何时运行流式应用程序中提供的流式计算逻辑。表 6-2 描述了不同的触发器类型。


  **表 6-2** 触发器类型


  | 类型 | 描述 |

  | --- | --- |

  | 未指定（默认） | 对于此默认类型，Spark 将使用微批处理模式，并在上一批数据处理完成后立即处理下一批数据。 |

  | 固定间隔 | 对于此类型，Spark 将使用微批处理模式，并根据用户提供的间隔时间处理数据批次。如果由于某种原因，上一批数据的处理时间超过了间隔时间，则下一批数据会在上一批处理完成后立即开始处理。换句话说，Spark
  不会等待下一个间隔边界。 |

  | 一次性 | 此触发器类型用于对当前可用的数据批次进行一次性处理，处理完成后 Spark 会立即停止流式应用程序。当数据量极低时，此触发器类型非常有用，因为每天仅启动集群处理几次数据更具成本效益。
  |

  | 连续 | 此触发器类型调用新的连续处理模式，该模式专为需要极低延迟的某些流式应用程序而设计。这是 Spark 2.3 中新增的实验性处理模式。 |


  ### 数据接收器


  数据接收器与数据源相对，用于存储流式应用程序的输出。重要的是要了解哪些接收器支持哪种输出模式，以及它们是否具备容错能力。下文简要描述了每种接收器，表 6-3 则概述了每种接收器的各种选项。


  **表 6-3** 开箱即用的数据接收器


  | 名称 | 支持的输出模式 | 容错 | 配置 |

  | --- | --- | --- | --- |

  | 文件 | 追加 | 是 | `path`：输入目录的路径。支持所有常见的文件格式。更多详情请参阅 `DataFrameWriter`。 |

  | Foreach | 追加、更新、完整 | 取决于实现 | 这是一个非常灵活的接收器，其实现方式特定。请参阅下文详情。 |

  | 控制台 | 追加、更新、完整 | 否 | `numRows`：每次触发器打印的行数。默认值为 20 行。`truncate`：指定当每行过长时是否截断。默认值为
  true。 |

  | 内存 | 追加、完整 | 否 | 无 |

  | Kafka | 追加、更新、完整 | 是 | `kafka.bootstrap.servers`：Kafka 代理的 `host:port` 逗号分隔列表。`topic`：要写入数据的
  Kafka 主题。更多详情请参阅 Spark 网站上的 Kafka 集成指南（`https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html`）。
  |


  - **Kafka 接收器**：需要 Apache Kafka 0.10 或更高版本。连接 Kafka 集群需要一组特定的设置。更多详情请参阅 Spark 网站上的
  Kafka 集成指南。

  - **文件接收器**：这是文件系统、HDFS 或 S3 上的目标位置。支持常用的文件格式，如文本、CSV、JSON、ORC 和 Parquet。有关支持的文件格式的最新列表，请参阅
  `DataStreamReader` 接口。

  - **Foreach 接收器**：用于对输出中的行执行任意计算。

  - **控制台接收器**：仅用于测试和调试目的，且适用于低数据量场景。每次触发器时，输出会打印到控制台。

  - **内存接收器**：仅用于处理低数据量时的测试和调试目的。它使用驱动程序的内存来存储输出。


  为了使 Structured Streaming 能够提供端到端的精确一次保证，数据接收器必须支持的一个重要属性是幂等性，以处理重新处理的情况。换句话说，它必须能够处理对相同数据的多次写入（发生在不同时间），使得最终结果与仅写入一次相同。多次写入是故障场景下重新处理数据的结果。


  为了帮助巩固对上述核心概念的理解，下一节将提供示例，展示在 Spark 中构建 Structured Streaming 应用程序时，各个部分如何协同工作。


  ### 水印


  **水印**是流式处理引擎中常用的一种技术，用于处理那些比大约同时创建的其他数据晚到很多的数据。当流式计算逻辑需要维护某种状态时，延迟数据会给流式处理引擎带来挑战。例如，当存在聚合或连接操作时就会出现这种情况。流式应用程序开发者可以指定一个阈值，告知
  Structured Streaming 引擎数据在事件时间上预计会延迟多久。有了这些信息，Structured Streaming 引擎可以决定是处理还是丢弃某条延迟数据。更重要的是，Structured
  Streaming 使用指定的阈值来决定何时可以丢弃旧状态。如果没有这些信息，Structured Streaming 将需要无限期地维护所有状态，这会导致流式应用程序出现内存不足的问题。任何执行某种聚合或连接操作的生产级
  Structured Streaming 应用程序都需要指定水印。这是一个重要的概念，后续章节将对此主题进行更详细的讨论和说明。




  ### 注意


  Apache Kafka 已成为大数据领域中最受欢迎的开源技术之一。它在大数据平台的架构中扮演着关键角色，充当着各种数据生产者和消费者之间的粘合剂。从高层来看，Kafka
  是一个分布式、容错的发布-订阅消息系统，用于摄取实时数据流。Kafka 中的数据单元被称为*消息*。消息被组织成主题（topic），主题又被分割成多个分区（partition），以便能够并行消费消息。每个分区的消息都存储在一个结构类似于提交日志的文件中。每个分区的数据文件包含一个有序的、不可变的消息序列。每条消息都会被分配一个顺序
  ID，通常被称为*偏移量*。当新消息到达一个分区时，它们会被简单地追加到分区文件的末尾。这一关键设计点使得 Kafka 能够处理高摄取率。每个分区都可以复制到多个副本。这种仅追加式的消息写入方式以及分区复制，是
  Kafka 提供冗余和可扩展性的关键因素。每个主题都有一个基于大小或时间的保留期配置，超过保留期的消息会被标记为删除。有关 Kafka 的更多详细信息，请访问[`https://kafka.apache.org/documentation/`](https://kafka.apache.org/documentation/)。


  ### 结构化流应用程序


  本节将通过一个 Spark 结构化流示例应用程序，来了解如何将上述概念映射到代码中。以下示例是关于处理来自文件数据源的一小组移动操作事件。每个事件包含三个字段：


  *   *id*：表示手机的唯一 ID。在提供的示例数据集中，手机 ID 类似于`phone1`、`phone2`、`phone3`等。

  *   *action*：表示用户执行的操作。操作的可能值为`open`和`close`。

  *   *ts*：表示用户执行操作时的时间戳。这是事件时间。


  移动事件数据被分割成三个 JSON 文件，它们位于`chapter6/data/mobile`目录中。为了模拟数据流行为，这些 JSON 文件将按特定顺序复制到输入文件夹中，然后检查输出以验证你的理解。


  让我们通过使用 DataFrame 读取数据来探索移动事件数据。参见清单 6-2。


  ```

  val mobileDataDF = spark.read.json("/chapter6/data/mobile")

  mobileDataDF.printSchema

  |-- action: string (nullable = true)

  |-- id: string (nullable = true)

  |-- ts: string (nullable = true)

  file1.json

  {"id":"phone1","action":"open","ts":"2018-03-02T10:02:33"}

  {"id":"phone2","action":"open","ts":"2018-03-02T10:03:35"}

  {"id":"phone3","action":"open","ts":"2018-03-02T10:03:50"}

  {"id":"phone1","action":"close","ts":"2018-03-02T10:04:35"}

  file2.json

  {"id":"phone3","action":"close","ts":"2018-03-02T10:07:35"}

  {"id":"phone4","action":"open","ts":"2018-03-02T10:07:50"}

  file3.json

  {"id":"phone2","action":"close","ts":"2018-03-02T10:04:50"}

  {"id":"phone5","action":"open","ts":"2018-03-02T10:10:50"}

  清单 6-2

  读取移动数据并打印其模式

  ```


  默认情况下，结构化流在从基于文件的数据源读取数据时需要指定模式。这是合理的，因为最初目录可能为空，因此结构化流无法推断模式。但是，如果你确实希望它推断模式，可以将配置`spark.sql.streaming.schemaInference`设置为
  true。在本示例中，你将显式创建一个模式。清单 6-3 包含一段用于创建移动事件数据模式的代码。


  ```

  import org.apache.spark.sql.types._

  import org.apache.spark.sql.functions._

  val mobileDataSchema = new StructType().add("id", StringType, false)

  .add("action", StringType, false)

  .add("ts", TimestampType, false)

  清单 6-3

  为移动事件数据创建模式

  ```


  让我们从一个处理移动事件数据的简单用例开始。目标是使用一个固定窗口（窗口长度为十秒）来生成每种操作类型的计数。清单 6-4 中的三行代码将有助于实现这一目标。第一行代码演示了如何使用基于文件的数据源，通过`DataStreamReader`从目录读取数据。预期的数据格式是
  JSON，模式已在清单 6-3 中定义。返回的对象是一个 DataFrame，你在第 4 章中已经熟悉了它。然而，这个 DataFrame 是一个流式 DataFrame，因此当调用`isStreaming`函数时，返回值应为
  true。这个简单应用程序中的流式计算逻辑在第二行代码中表达，它使用`action`列和基于`ts`列的固定窗口执行分组转换。敏锐的读者可能已经注意到了这一点，但为了强调事件时间这一点，分组转换中的固定窗口是基于移动事件数据中嵌入的时间戳的。第三行代码非常重要，因为它定义了输出模式和数据接收器，最重要的是，它告诉结构化流引擎开始增量地运行我们在第二行代码中表达的流式计算逻辑。更详细地说，第三行代码使用`actionCountDF`
  DataFrame 的`DataFrameWriter`实例来指定控制台作为数据接收器，这意味着输出将被打印到控制台供你检查。然后它将输出模式定义为“complete”，以便你可以看到结果表中的所有记录。最后，它调用`DataStreamWriter`的`start()`函数来启动执行，这意味着基于文件的数据源将开始处理放入`/<path>/chapter6/data/input`目录的文件。另一个需要注意的重要事项是，`start`函数将返回一个`StreamingQuery`类的实例，该实例代表一个查询的句柄，该查询在新数据到达时会在后台持续执行。你可以使用`mobileConsoleSQ`流式查询来检查流式应用程序中计算的状态和进度。


