  ### 使用 File 数据源


  File 数据源是最容易理解和使用的一种。假设需要处理定期复制到某个目录中的新文件，那么这将是该场景下的完美数据源。它开箱即用地支持所有常用的文件格式，包括文本、CSV、JSON、ORC
  和 Parquet。有关支持的文件格式的完整列表，请查阅 `DataStreamReader` 接口。在 File 数据源支持的四个选项中，只有用于读取文件的输入目录是必需的。


  当新文件被复制到指定目录时，File 数据源会拾取所有这些文件进行处理。也可以配置 File 数据源，使其仅选择性地拾取固定数量的新文件进行处理。用于指定文件数量的选项是
  `maxFilesPerTrigger`。清单 6-17 提供了一个示例，演示如何从目录中读取 JSON 移动数据事件，并使用清单 6-3 中定义的相同模式。File
  数据源支持的另一个有趣的可选选项是，是否在处理旧文件之前先处理最新文件。文件的最后时间戳用于判断哪个文件更新。默认行为是从最旧的文件开始处理到最新的文件。当有大量积压文件需要处理，并且你想优先处理新文件时，这个特定选项会非常有用。


  ```

  val mobileSSDF = spark.readStream.schema(mobileDataSchema).json("")

  // 如果我们想指定 maxFilesPerTrigger

  val mobileSSDF =  spark.readStream.schema(mobileDataSchema).

  option("maxFilesPerTrigger", 5).json("")

  // 如果我们想先处理新文件

  val mobileSSDF =  spark.readStream.schema(mobileDataSchema).

  option("latestFirst", "true").json("")

  清单 6-17

  使用 File 数据源

  ```




  ### 使用 Kafka 数据源


  Kafka 数据源可能是生产环境流式应用中最常用的数据源。要高效使用该数据源，你需要掌握一定的 Kafka 基础知识。从高层来看，该数据源扮演着 Kafka 消费者的角色；因此，它所需的信息与
  Kafka 消费者所需的信息类似。其中包含两项必填信息和若干可选信息。


  两项必填信息分别是：要连接的 Kafka 服务器列表，以及要读取数据的一个或多个主题信息。为了支持多种方式选择要读取数据的主题及主题分区，它提供了三种不同的方式来指定这些信息。你只需选择最适合自己用例的方式即可。表
  6-5 详细说明了这两项必填选项。


  **表 6-5** Kafka 数据源的必填选项


  | 选项 | 值 | 描述 |

  | --- | --- | --- |

  | `kafka.bootstrap.servers` | `host1:port1`, `host2:port2` | 这是 Kafka 代理服务器列表，以逗号分隔。请咨询你的
  Kafka 管理员以获取要使用的主机名和端口号。 |

  | `subscribe` | `topic1`, `topic2` | 这是该数据源要读取数据的主题名称列表，以逗号分隔。 |

  | `subscribePattern` | `topic.*` | 这是一个正则表达式模式，用于指定要读取数据的主题。这比 `subscribe` 选项更灵活一些。
  |

  | `assign` | `{ topic1: [1,2], topic2: [3,4] }` | 使用此选项，你可以指定要读取数据的具体主题分区列表。此信息必须以
  JSON 格式提供。 |


  指定这些必填选项后，你可以选择性地指定表 6-6 中的选项，该表仅包含一些常用选项。有关可选选项的完整列表，请参阅 Structured Streaming 和
  Kafka 集成指南，网址为 [`https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html`](https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html)。这些选项之所以是可选的，是因为它们都有默认值。


  `startingOffsets` 和 `endingOffsets` 选项允许你精细控制从特定主题的特定分区的特定点开始处理 Kafka 中的数据。这种灵活性在以下场景中极为有用：因故障或软件新版本引入的某些错误而需要重新处理数据时，或者重新训练机器学习模型时。能够重新处理
  Kafka 中的数据是 Kafka 在大数据处理领域广受欢迎的原因之一。显而易见，Kafka 数据源使用 `startingOffsets` 来确定从 Kafka
  中的何处开始读取数据，因此，一旦处理开始，该选项便不再使用。Kafka 数据源使用 `endingOffsets` 选项来确定何时停止从 Kafka 读取数据。例如，如果你希望流式应用从
  Kafka 读取最新数据并继续处理新传入的数据，那么 `startingOffsets` 和 `endingOffsets` 的值都应为 `latest`。


  **表 6-6** Kafka 数据源的可选选项


  | 选项 | 默认值 | 值 | 描述 |

  | --- | --- | --- | --- |

  | `startingOffsets` | `latest` | `earliest`、`latest` 或每个主题起始偏移量的 JSON 字符串，例如 `{
  "topic1": { "0":45, "1": -1}, "topic2": { "0":-2} }` | `earliest` 表示主题的开头。`latest`
  表示主题中的最新数据。使用 JSON 字符串格式时，-2 表示特定分区中的最早偏移量，-1 表示特定分区中的最新偏移量。 |

  | `endingOffsets` | `latest` | `latest` 或 JSON 字符串，例如 `{ "topic1": { "0":45, "1":
  -1}, "topic2": { "0":-2} }` | `latest` 表示主题中的最新数据。使用 JSON 字符串格式时，-1 表示特定分区中的最新偏移量。自然，-2
  不适用于此选项。 |

  | `maxOffsetsPerTrigger` | `none` | 长整型，例如 500 | 此选项是一种速率限制机制，用于控制每个触发间隔要处理的记录数。如果指定了值，它表示所有分区中的记录总数，而非每个分区。
  |


  默认情况下，Kafka 数据源不包含在 [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html)
  提供的 Apache Spark 二进制包中。如果你打算从 Spark shell 使用 Kafka 数据源，那么务必使用一个额外选项启动 Spark shell，以要求其下载并包含正确的
  JAR 文件。Structured Streaming 和 Kafka 集成文档的部署部分（[`https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html`](https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html)）提供了关于该额外选项的信息。它类似于清单
  6-18 所示。


