  ### 通过读取 Parquet 文件创建 DataFrame


  Parquet 是 Hadoop 生态系统中最流行的开源列式存储格式之一，它诞生于 Twitter。它之所以流行，是因为它是一种自描述的数据格式，并且通过利用压缩技术以高度紧凑的结构存储数据。列式存储格式旨在很好地适应数据分析工作负载，在这种工作负载中，数据分析过程中只使用一小部分列。Parquet
  将每列的数据存储在一个单独的文件中；因此，数据分析中不需要的列就不必被不必要地读取。在支持具有嵌套结构的复杂数据类型方面，它也非常灵活。像 CSV 和 JSON
  这样的文本文件格式适用于小文件，并且它们是人类可读的。对于处理存储在长期存储中的大型数据集，Parquet 是一种更好的文件格式，可以降低存储成本并加快读取步骤。如果你查看一下
  `chapter4/data/movies` 文件夹中的 `movies.parquet` 文件，你会发现它的大小大约是 `movies.csv` 的六分之一。


  Spark 与 Parquet 文件格式配合得非常好，事实上 Parquet 是 Spark 中用于读取和写入数据的默认文件格式。由于 Parquet 文件是自包含的，即模式存储在
  Parquet 数据文件内部，因此在 Spark 中使用 Parquet 很容易。代码清单 4-16 展示了一个读取 Parquet 文件的示例。注意，你不需要提供模式或要求
  Spark 推断模式。Spark 可以从 Parquet 文件中检索模式。


  Spark 在从 Parquet 读取数据时所做的很酷的优化之一是，它按列批次进行解压缩和解码。


  ```

  // Parquet 是默认格式，因此读取时无需指定格式

  val movies9 = spark.read.load("/book/chapter4/data/movies/movies.parquet")

  movies9.printSchema

  |-- actor_name: string (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: long (nullable = true)

  // 如果我们想更明确一些，可以指定 parquet 函数的路径

  val movies10 = spark.read.parquet("/book/chapter4/data/movies/movies.parquet")

  movies10.printSchema

  |-- actor_name: string (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: long (nullable = true)

  代码清单 4-16

  在 Spark 中读取 Parquet 文件

  ```




