  使用线性回归算法预测房价\n```\n\nRMSE 代表*均方根误差*。在此例中，RMSE 值约为 37,000 美元，这表明还有很大的改进空间。\n\n###\
  \ 推荐\n\n推荐系统是最直观、最著名的机器学习应用之一。这大概是因为几乎每个人都曾在亚马逊和 Netflix 等热门网站上看到过推荐系统的实际应用。事实上，互联网上几乎每一个热门网站都有一个或多个推荐系统的实例。常见的推荐系统例子包括\
  \ Spotify 上你可能喜欢的歌曲、Twitter 上你可能想关注的人、Coursera 或 Udacity 上你可能喜欢的课程等等。很酷的一点是，推荐系统对用户和网站背后的公司都有好处。用户无需花费太多精力就能愉快地找到或发现他们喜欢的物品。公司则会因为用户参与度和忠诚度的提高以及利润的增长而感到满意。如果一个推荐系统设计得当且性能良好，那将是一个双赢的局面。\n\
  \n构建推荐系统的常见方法包括基于内容的过滤、协同过滤以及两者的混合。第一种方法需要收集被推荐物品的信息以及每个用户的画像。第二种方法则需要通过显式或隐式方式仅收集用户的活动或行为。显式行为的例子包括在亚马逊上对电影或物品进行评分。隐式行为的例子包括观看电影预告片或描述。第二种方法背后的直觉是“群体智慧”的概念，即过去意见一致的人在未来也倾向于意见一致。\n\
  \n本节将重点介绍协同过滤方法，其中一种流行的算法叫做 `ALS`，它代表*交替最小二乘法*。该算法所需的唯一输入是用户-物品评分矩阵，通过一个称为*矩阵分解*的过程来发现用户偏好和物品属性。一旦找到这两部分信息，就可以用来预测用户对未曾见过的物品的偏好。MLlib\
  \ 提供了 `ALS` 算法的实现。\n\n#### 模型超参数\n\nMLlib 中实现的 `ALS` 算法有几个你需要了解的重要超参数。以下部分仅包含其中一部分。请查阅\
  \ [`https://spark.apache.org/docs/latest/ml-collaborative-filtering.html`](https://spark.apache.org/docs/latest/ml-collaborative-filtering.html)\
  \ 上的文档。\n\n*   *rank*：此参数指定在训练过程中将要学习的关于用户和物品的潜在因子或属性的数量。`rank` 的最优值通常通过实验以及对准确描述一个物品所需属性数量的直觉来确定。默认值为\
  \ 10。\n*   *regParam*：这是用于处理过拟合的正则化量。此参数的最优值通常通过实验确定。默认值为 0.1。\n*   *implicitPrefs*：`ALS`\
  \ 算法同时支持显式和隐式的用户活动或行为。此参数用于指示输入数据代表哪一种。默认值为 false，表示活动或行为是显式的。\n\n\n\n#### 示例\n\n\
  你将通过一个示例来构建电影推荐系统，该示例使用来自 `grouplens.com` 的电影评分数据集，数据地址为 [`https://grouplens.org/datasets/movielens/`](https://grouplens.org/datasets/movielens/)。具体使用的数据集是最新的\
  \ MovieLens 100k 数据集，下载地址为 [`http://files.grouplens.org/datasets/movielens/ml-latest-small.zip`](http://files.grouplens.org/datasets/movielens/ml-latest-small.zip)。该数据集包含约\
  \ 700 名用户对 9000 部电影的大约 100,000 条评分。压缩包中包含四个文件：`links.csv`、`movies.csv`、`ratings.csv`\
  \ 和 `tags.csv`。文件 `ratings.csv` 中的每一行代表一位用户对一部电影的一条评分，格式如下：`userId`、`movieId`、`rating`、`timestamp`。评分范围为\
  \ 0 到 5，以半星为增量。\n\n清单 8-20 中的代码使用一组参数训练 ALS 算法，然后基于 RMSE 指标评估模型性能。此外，它还会调用 `ALSModel`\
