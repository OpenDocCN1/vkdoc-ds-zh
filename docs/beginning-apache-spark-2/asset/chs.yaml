- '# Spark SQL（高级）


  第 4 章介绍了 Spark SQL 模块的基本元素，包括核心抽象、用于操作结构化数据的结构化操作，以及对从各种数据源读取数据和向各种数据源写入数据的支持。在此基础之上，本章将介绍
  Spark SQL 模块的一些高级功能，并深入幕后，解释 Catalyst 优化器和 Tungsten 引擎提供的优化和执行效率。为了帮助您执行复杂的分析，Spark
  SQL 提供了一组强大且灵活的聚合能力、连接多个数据集的能力、大量内置的高性能函数以及一组高级分析函数。本章将详细讨论这些主题。


  ## 聚合


  对大数据执行任何有意义的分析通常都涉及某种聚合，以汇总数据，从而提取模式或洞察，或生成汇总报告。聚合通常需要对整个数据集或一个或多个列进行某种形式的分组，然后对每个组应用聚合函数，例如求和、计数或求平均值。Spark
  提供了许多常用的聚合函数，以及将值聚合到一个集合中的能力，然后可以进一步分析该集合。行的分组可以在不同级别进行，Spark 支持以下级别：


  - 将 `DataFrame` 视为一个组。

  - 使用一个或多个列将 `DataFrame` 分成多个组，并对每个组执行一个或多个聚合。

  - 将 `DataFrame` 分成多个窗口，并执行移动平均、累积求和或排名。如果窗口基于时间，则可以使用滚动窗口或滑动窗口进行聚合。


  ### 聚合函数


  在 Spark 中，所有聚合都是通过函数完成的。聚合函数旨在对一组行执行聚合，无论这组行是 `DataFrame` 中的所有行还是子组行。Scala 语言聚合函数的完整列表文档可在
  `http://spark.apache.org/docs/latest/api/scala/index.html#org.apache.spark.sql.functions$`
  找到。对于 Spark Python API，有时某些函数的可用性存在差距。




  ### 常用聚合函数


  本节介绍一组常用的聚合函数，并提供使用示例。表 5-1 描述了这些聚合函数。完整列表请参见前文提到的网址。


  **表 5-1** 常用聚合函数


  | 操作 | 描述 |

  | --- | --- |

  | `count(col)` | 返回每组中的项目数量。 |

  | `countDistinct(col)` | 返回每组中不重复的项目数量。 |

  | `approx_count_distinct(col)` | 返回每组中不重复项目的近似数量。 |

  | `min(col)` | 返回每组中指定列的最小值。 |

  | `max(col)` | 返回每组中指定列的最大值。 |

  | `sum(col)` | 返回每组中指定列值的总和。 |

  | `sumDistinct(col)` | 返回每组中指定列不重复值的总和。 |

  | `avg(col)` | 返回每组中指定列值的平均值。 |

  | `skewness(col)` | 返回每组中指定列值分布的偏度。 |

  | `kurtosis(col)` | 返回每组中指定列值分布的峰度。 |

  | `variance(col)` | 返回每组中指定列值的无偏方差。 |

  | `stddev(col)` | 返回每组中指定列值的标准差。 |

  | `collect_list(col)` | 返回每组中指定列值的集合。返回的集合可能包含重复值。 |

  | `collect_set(col)` | 返回每组中不重复值的集合。 |


  为了演示这些函数的用法，我们将使用航班摘要数据集，该数据集源自 Kaggle 网站（[`https://www.kaggle.com/usdot/flight-delays/data`](https://www.kaggle.com/usdot/flight-delays/data)）上提供的数据文件。该数据集包含
  2015 年美国国内航班的延误和取消情况。代码清单 5-1 包含了通过读取该数据集创建 DataFrame 的代码。


