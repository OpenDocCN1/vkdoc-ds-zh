  | --- | --- | --- |

  | 文本文件 | 文本 | 无结构。 |

  | CSV | 文本 | 逗号分隔值。可用于指定其他分隔符。列名可从表头中引用。 |

  | JSON | 文本 | 流行的半结构化格式。列名和数据类型自动推断。 |

  | Parquet | 二进制 | （默认格式。）Hadoop 社区中流行的二进制格式。 |

  | ORC | 二进制 | Hadoop 社区中另一种流行的二进制格式。 |

  | JDBC | 二进制 | 用于读写关系型数据库的常见格式。 |


  ### 通过读取文本文件创建 DataFrame


  文本文件包含非结构化数据。当它被读入 Spark 时，每一行成为 DataFrame 中的一行。在 [`www.gutenberg.org/`](http://www.gutenberg.org/)
  上有许多纯文本格式的免费书籍可供下载。对于纯文本文件，一种常见的解析每行单词的方法是以空格作为分隔符进行拆分。这与典型的单词计数示例的工作方式类似。读取文本文件的示例请参见清单
  4-11。


  ```

  val textFile = spark.read.text("README.md")

  textFile.printSchema

  |-- value: string (nullable = true)

  // 显示 5 行，不截断

  textFile.show(5, false)

  +-------------------------------------------------------------------------+

  |value                                                                    |

  +-------------------------------------------------------------------------+

  |# Apache Spark                                                           |

  |                                                                         |

  |Spark is a fast and general cluster computing system for Big Data. It provides
  |

  |high-level APIs in Scala, Java, Python, and R, and an optimized engine that    |

  |supports general computation graphs for data analysis. It also supports a      |

  +-------------------------------------------------------------------------+

  清单 4-11

  从 Spark Shell 中将 README.md 文件作为文本文件读取

  ```


  如果文本文件包含可用于解析每行中列的分隔符，那么最好使用 CSV 格式读取它，这将在下一节中介绍。




  ### 通过读取 CSV 文件创建 DataFrame


  一种流行的文本文件格式是 CSV，它代表*逗号分隔值*。诸如 Microsoft Excel 之类的流行工具可以轻松地以 CSV 格式导入和导出数据。Spark
  中的 CSV 解析器设计得非常灵活，可以使用用户提供的分隔符来解析文本文件。逗号分隔符恰好是默认分隔符。这意味着你可以使用 CSV 格式来读取制表符分隔的文本文件或其他带有任意分隔符的文本文件。


  有些 CSV 文件有表头，有些则没有。由于列值可能包含逗号，因此使用特殊字符对其进行转义是一种好做法。表 4-4 描述了使用 CSV 格式时的常用选项。有关完整的选项列表，请参阅
  Spark GitHub 上的 `CSVOptions` 类（ [`https://github.com/apache/spark`](https://github.com/apache/spark)
  ）。


  **表 4-4** CSV 常用选项


  | 键 | 值 | 默认值 | 描述 |

  | --- | --- | --- | --- |

  | `sep` | 单个字符 | `,` | 这是一个用作每列分隔符的单个字符。 |

  | `header` | true, false | `false` | 如果值为 true，则表示文件中的第一行代表列名。 |

  | `escape` | 任意字符 | `\` | 用于转义列值中与 `sep` 相同的字符的字符。 |

  | `inferSchema` | true, false | `false` | 指定 Spark 是否应尝试根据列值推断列类型。 |


  将 `header` 和 `inferSchema` 选项指定为 true 则无需指定模式。否则，你需要手动定义模式，或以编程方式创建它并将其传递给 `schema`
  函数。如果 `inferSchema` 选项为 false 且未提供模式，Spark 将假定所有列的数据类型为字符串类型。


  你用作示例的数据文件位于 `data/chapter4` 文件夹中，名为 `movies.csv`。此文件包含每列的表头：`actor`、`title`、`year`。清单
  4-12 提供了一些读取 CSV 文件的示例。


  ```

  val movies = spark.read.option("header","true").csv("/book/chapter4/data/movies/movies.csv")

  movies.printSchema

  |-- actor: string (nullable = true)

  |-- title: string (nullable = true)

  |-- year: string (nullable = true)

  // 现在尝试推断模式

  val movies2 = spark.read.option("header","true").option("inferSchema","true")

  .csv("/book/chapter4/data/movies/movies.csv")

  movies2.printSchema

  |-- actor: string (nullable = true)

  |-- title: string (nullable = true)

  |-- year: integer (nullable = true)

  // 现在尝试手动提供模式

  import org.apache.spark.sql.types._

  val movieSchema = StructType(Array(StructField("actor_name", StringType, true),

  StructField("movie_title", StringType, true),

  StructField("produced_year", LongType, true)))

  val movies3 = spark.read.option("header","true").schema(movieSchema)

  .csv("/book/chapter4/data/movies/movies.csv")

  movies3.printSchema

  |-- actor_name: string (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: long (nullable = true)

  movies3.show(5)

  +-----------------+--------------+--------------+

  |       actor_name|   movie_title| produced_year|

  +-----------------+--------------+--------------+

  |McClure, Marc (I)| Freaky Friday|          2003|

  |McClure, Marc (I)|  Coach Carter|          2005|

  |McClure, Marc (I)|   Superman II|          1980|

  |McClure, Marc (I)|     Apollo 13|          1995|

  |McClure, Marc (I)|      Superman|          1978|

  +-----------------+--------------+--------------+

  ```


  **清单 4-12** 使用各种选项读取 CSV 文件


  第一个示例通过将第一行指定为表头来读取文件 `movies.csv`。Spark 能够识别列名。但是，由于你没有指定 `inferSchema` 选项，所有列的类型都是
  `string`。第二个示例添加了 `inferSchema` 选项，Spark 能够识别列类型。第三个示例提供了一个模式，其列名与表头中的不同，因此 Spark
  使用模式中的列名。


  现在，让我们尝试读取一个使用不同分隔符（不是逗号）的文本文件。这次是制表符。在这种情况下，你需要为 Spark 将使用的 `sep` 选项指定一个值。请参阅清单
  4-13，了解读取 `data/chapter4` 文件夹中名为 `movies.tsv` 的文件的示例。


  ```

  val movies4 = spark.read.option("header","true").option("sep", "\t")

  .schema(movieSchema).csv("/book/chapter4/data/movies/movies.tsv")

  movies.printSchema

  |-- actor_name: string (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: long (nullable = true)

  ```


  **清单 4-13** 使用 CSV 格式读取 TSV 文件


  如你所见，处理逗号分隔值以及其他分隔符的文本文件非常容易。




  ### 通过读取 JSON 文件创建 DataFrame


  JSON 是 JavaScript 社区中一种广为人知的格式。它被认为是一种半结构化格式，因为每个对象（即行）都有结构，且每个列都有名称。在 Web 应用开发领域，JSON
  是一种广泛使用的数据格式，用于在后端服务器和浏览器端之间传输数据。JSON 的优势之一在于它提供了一种灵活的格式，可以模拟任何用例；它还能支持嵌套结构。JSON
  的一个缺点与冗余性有关。列名在数据文件的每一行中都会重复出现（想象一下你的数据文件有 100 万行）。


  Spark 可以轻松读取 JSON 文件中的数据。然而，有一件事你需要特别注意。一个 JSON 对象可以表示为单行或多行，这一点你需要告知 Spark。鉴于 JSON
  数据文件只包含列名而不包含数据类型，Spark 是如何得出模式（schema）的呢？Spark 会尽力通过解析一组样本记录来推断模式。用于采样的记录数量由 `samplingRatio`
  选项决定，其默认值为 1.0。因此，读取大型 JSON 文件的代价相当高。在这种情况下，你可以降低 `samplingRatio` 的值来加快数据加载过程。表
  4-5 描述了 JSON 格式的常用选项。


  **表 4-5** JSON 常用选项


  | 键 | 值 | 默认值 | 描述 |

  | --- | --- | --- | --- |

  | `allowComments` | true, false | false | 忽略 JSON 文件中的注释 |

  | `multiLine` | true, false | false | 将整个文件视为一个跨越多行的大型 JSON 对象 |

  | `samplingRatio` | 0.3 | 1.0 | 指定用于推断模式的采样大小 |


  代码清单 4-14 展示了读取 JSON 文件的两个示例。第一个示例简单地读取一个 JSON 文件，没有覆盖任何选项值。注意，Spark 会根据 JSON 文件中的信息自动检测列名和数据类型。第二个示例则指定了一个模式。


  ```

  val movies5 = spark.read.json("/book/chapter4/data/movies/movies.json")

  movies.printSchema

  |-- actor_name: string (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: long (nullable = true)

  // 指定模式以覆盖 Spark 的推断模式。

  // 将 producted_year 指定为整数类型

  import org.apache.spark.sql.types._

  val movieSchema2 = StructType(Array(StructField("actor_name", StringType, true),

  StructField("movie_title", StringType, true),

  StructField("produced_year", IntegerType, true)))

  val movies6 = spark.read.option("inferSchema","true").schema(movieSchema2)

  .json("/book/chapter4/data/movies/movies.json")

  movies6.printSchema

  |-- actor_name: string (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: integer (nullable = true)

  代码清单 4-14

  读取 JSON 文件的各种示例

  ```


  当模式中指定的列数据类型与 JSON 文件中的值不匹配时会发生什么？默认情况下，当 Spark 遇到损坏的记录或解析错误时，它会将该行所有列的值设置为 null。除了得到
  null 值，你也可以让 Spark 快速失败。代码清单 4-15 通过将 `mode` 选项指定为 `failFast`，告知 Spark 的解析逻辑快速失败。


  ```

  // 将 actor_name 的数据类型设置为 BooleanType

  import org.apache.spark.sql.types._

  val badMovieSchema = StructType(Array(StructField("actor_name", BooleanType, true),

  StructField("movie_title", StringType, true),

  StructField("produced_year", IntegerType, true)))

  val movies7 = spark.read.schema(badMovieSchema)

  .json("/book/chapter4/data/movies/movies.json")

  movies7.printSchema

  |-- actor_name: boolean (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: integer (nullable = true)

  movies7.show(5)

  +----------+-----------+-------------+

  |actor_name|movie_title|produced_year|

  +----------+-----------+-------------+

  |      null|       null|         null|

  |      null|       null|         null|

  |      null|       null|         null|

  |      null|       null|         null|

  |      null|       null|         null|

  +----------+-----------+-------------+

  // 告知 Spark 在遇到解析错误时快速失败

  val movies8 = spark.read.option("mode","failFast").schema(badMovieSchema)

  .json("/book/chapter4/data/movies/movies.json")

  movies8.printSchema

  |-- actor_name: boolean (nullable = true)

  |-- movie_title: string (nullable = true)

  |-- produced_year: integer (nullable = true)

  // Spark 在执行操作时会抛出 RuntimeException

  movies8.show(5)

  ERROR Executor: Exception in task 0.0 in stage 3.0 (TID 3)

  java.lang.RuntimeException: Failed to parse a value for data type BooleanType (current
  token: VALUE_STRING).

