  ### 连接实现概述


  连接是 Spark 中最昂贵的操作之一。从高层次来看，Spark 使用两种不同的策略来连接两个数据集。它们是 **Shuffle 哈希连接**和**广播连接**。选择特定策略的主要标准基于两个数据集的大小。当两个数据集都很大时，使用
  Shuffle 哈希连接策略。当其中一个数据集的大小足够小，可以放入执行器的内存时，则使用广播连接策略。以下各节详细介绍了每种连接策略的工作原理。


  #### Shuffle 哈希连接


  从概念上讲，连接是将两个数据集中满足连接表达式指定条件的行的列组合起来。为此，那些具有相同列值的行需要被放置在同一分区上。Shuffle 哈希连接实现包含两个步骤。第一步是计算每个数据集中每行在连接表达式中的列的哈希值，然后将具有相同哈希值的行
  Shuffle 到同一分区。为了确定特定行将被移动到哪个分区，Spark 执行一个简单的算术运算，即计算哈希值对分区数取模。一旦第一步完成，第二步就将那些具有相同列哈希值的行的列组合起来。从高层次来看，这两个步骤类似于
  MapReduce 编程模型中的步骤。


  图 5-2 展示了 Shuffle 哈希连接中发生的 Shuffle 过程。如前所述，这是一个昂贵的操作，因为它需要通过网络在众多机器之间移动大量数据。当通过网络移动数据时，数据通常会经历数据序列化和反序列化过程。想象一下对两个大型数据集执行连接，每个数据集的大小为
  100GB。在这种情况下，需要移动大约 200GB 的数据。在连接两个大型数据集时，完全避免 Shuffle 哈希连接是不可能的，但重要的是要时刻注意尽可能减少连接它们的频率。


  ![../images/419951_1_En_5_Chapter/419951_1_En_5_Fig2_HTML.png](img/419951_1_En_5_Fig2_HTML.png)


  图 5-2


  Shuffle 哈希连接


  #### 广播哈希连接


  此连接策略仅适用于其中一个数据集足够小，可以放入内存的情况。知道 Shuffle 哈希连接是一种昂贵的操作后，广播哈希连接避免了 Shuffle 两个数据集，而只
  Shuffle 较小的那个。与 Shuffle 哈希连接策略类似，该策略也包含两个步骤。第一步是将整个较小数据集的副本广播到较大数据集的每个分区。第二步是遍历较大数据集中的每一行，并在较小数据集中查找具有匹配列值的对应行。图
  5-3 展示了较小数据集的广播过程。


  ![../images/419951_1_En_5_Chapter/419951_1_En_5_Fig3_HTML.png](img/419951_1_En_5_Fig3_HTML.png)


  图 5-3


  广播哈希连接


  很容易理解，在可能的情况下，广播哈希连接是首选。Spark SQL 在大多数情况下，可以根据读取数据集时获得的一些统计信息，自动判断是使用广播哈希连接还是 Shuffle
  哈希连接。但是，在使用 `join` 转换时，可以向 Spark SQL 提供提示以使用广播哈希连接。清单 5-33 提供了一个示例。


  ```

  import org.apache.spark.sql.functions.broadcast

  // 打印执行计划以验证是否使用了广播哈希连接策略

  employeeDF.join(broadcast(deptDF), employeeDF.col("dept_no") === deptDF.col("id")).explain()

  // 使用 SQL

  spark.sql("select /*+ MAPJOIN(departments) */ * from employees JOIN departments
  on dept_no == id").explain()

  == Physical Plan ==

  *BroadcastHashJoin [dept_no#30L], [id#41L], Inner, BuildRight

  :- LocalTableScan [first_name#29, dept_no#30L]

  +- BroadcastExchange HashedRelationBroadcastMode(List(input[0, bigint, false]))

  +- LocalTableScan [id#41L, name#42]

  清单 5-33

  提供提示以对广播的 deptDF 使用广播哈希连接

  ```




