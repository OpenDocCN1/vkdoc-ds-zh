  ```


  ### 理解数据混洗


  某些键/值转换和操作需要将数据从多个分区移动到其他分区，即跨执行器和机器移动。这个过程称为*混洗*，熟悉它非常重要，因为它是一项开销很大的操作。在混洗过程中，数据需要被序列化、写入磁盘、通过网络传输，最后反序列化。完全避免混洗是不可能的，但有一些技术或最佳实践可以最小化混洗数据的需求。混洗数据会增加
  Spark 作业中数据处理完成的延迟。


  让我们以 `reduceByKey` 转换为例来理解混洗。此转换需要读取所有分区的数据，以找到 RDD 中所有键的所有值，并且对于每个键，它将来自不同分区的所有值汇集在一起以计算最终值。为了准备混洗，每个分区根据目标分区对数据进行排序，然后将它们写入单个文件。在目标分区上，它将根据其分区索引读取此文件的相关块。


  通常，任何执行某种按键分组、聚合或连接的转换或操作都需要执行数据混洗。以下是属于此类别的部分转换：`groupByKey`、`reduceByKey`、`aggregateByKey`
  和 `join`。




  '
- '# 享受 RDD 持久化的乐趣


  Spark 区别于其他数据处理引擎或框架的显著特性之一，是能够将 RDD 的数据持久化到集群中所有执行器的内存中。一旦 RDD 的数据持久化到内存，那么后续对该数据的任何计算都将非常快速，通常比不在内存中的数据快十倍以上。有两个典型的用例可以极大地受益于持久化到内存的数据。第一个是数据探索或交互式分析。假设有一个几百
  GB 的大型服务日志文件，需要针对各种类型的异常进行分析。第一步是将该日志文件过滤为仅包含关键字 `Exception` 的行，然后将该数据集缓存到内存中。后续对各种类型异常的探索性和交互式分析可以在内存中的该数据集上进行，并且速度会非常快。第二个用例是迭代算法。机器学习算法本质上通常是迭代的，这意味着它们会运行多次迭代来优化损失函数。在此过程中，它们可能会使用一个或多个在每次迭代中不变的数据集；因此，如果这些数据集被持久化，将有助于加快算法完成所需的时间。


  持久化一个 RDD 非常简单，只需调用转换操作 `persist()` 或 `cache()` 即可。由于它们是转换操作，只有在后续执行行动操作时，RDD 才会被持久化到内存中。默认情况下，Spark
  会将数据集持久化在内存中。一个需要提出的问题是，如果 Spark 应用程序中所有执行器的内存不足以将 RDD 持久化到内存中，会发生什么情况。例如，假设一个 Spark
  应用程序有十个执行器，每个执行器有 6GB 的 RAM。如果你想要持久化到内存的 RDD 大小为 70GB，那么它无法容纳在 60GB 的 RAM 中。这就是存储级别概念的用武之地。在将
  RDD 的数据持久化到内存时，你可以指定两个选项：位置和序列化。位置选项决定 RDD 的数据应存储在内存中、磁盘上还是两者的组合。序列化选项决定 RDD 中的数据是否应存储为序列化对象。这两个选项代表了你在
  CPU 时间和内存使用方面所做的不同类型的权衡。有关上述两个选项的详细信息，请参见表 3-6。


  **表 3-6** 持久化 RDD 的存储选项


  | 选项 | 内存空间 | CPU 时间 | 在内存中 | 在磁盘上 |

  | --- | --- | --- | --- | --- |

  | `MEMORY_ONLY` | 高 | 低 | 是 | 否 |

  | `MEMORY_AND_DISK` | 高 | 中 | 部分 | 部分 |

  | `MEMORY_ONLY_SER` | 低 | 高 | 是 | 否 |

  | `MEMORY_AND_DISK_SER` | 低 | 高 | 部分 | 部分 |

  | `DISK_ONLY` | 低 | 高 | 否 | 是 |


  如果不再需要将 RDD 的数据持久化在内存中，你可以使用 `unpersist()` 函数将其从内存中移除，以便为其他 RDD 腾出空间。Spark 集群通常具有有限的内存；如果你持续持久化
  RDD，Spark 将使用 LRU 驱逐策略自动驱逐最近未被访问的 RDD。


  ## 总结


  在本章中，你学习了以下内容：


  - 在 Spark 中，RDD 是概念和编程模型方面的基础抽象。其他编程抽象都构建在 RDD 之上。


  - RDD 提供了丰富的操作集，使得在 Spark 中执行数据分析变得容易。操作分为两种类型：转换操作和行动操作。转换操作被设计为惰性求值，以便为 Spark
  提供执行优化的机会。行动操作是急切求值的，它们会触发对调用行动操作之前所有转换逻辑的计算。


  - Pair RDD 提供了基于键进行分组、聚合和连接数据集的额外能力。


  - 数据混洗是一个代价高昂但必要的数据移动过程，因此 Spark 开发人员熟悉它非常重要。目标不是消除混洗过程，而是最小化 Spark 应用程序中需要发生混洗的次数。


  - RDD 持久化是加速 Spark 作业中计算逻辑的好方法。理解不同的存储级别将使你有信心为你的用例选择合适的一个，并在 CPU 时间和空间效率方面做出正确的权衡。


