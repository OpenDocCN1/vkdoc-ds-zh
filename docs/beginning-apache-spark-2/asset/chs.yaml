  csv\").option(\"header\", \"true\")\n.option(\"inferSchema\",\"true\")\n.load(\"\
  /train.csv\")\n// 选择用作特征的列\nval cols = SeqString\nval colNames = cols.map(n => col(n))\n\
  // 仅选择需要的列\nval skinny_house_data = house_data.select(colNames:_*)\n// 通过将 \"1stFlrSF\"\
  \ 和 \"2ndFlrSF\" 列的值相加，创建一个名为 \"TotalSF\" 的新列\n// 将 \"SalePrice\" 列转换为 double 类型\n\
  val skinny_house_data1 = skinny_house_data.withColumn(\"TotalSF\", col(\"1stFlrSF\"\
  ) +\ncol(\"2ndFlrSF\"))\n.drop(\"1stFlrSF\", \"2ndFlrSF\")\n.withColumn(\"SalePrice\"\
  , $\"SalePrice\".cast(\"double\"))\n// 检查名为 \"SalePrice\" 的标签列的统计信息\nskinny_house_data1.describe(\"\
  SalePrice\").show\n+--------+-------------------+\n| summary|          SalePrice|\n\
  +--------+-------------------+\n|   count|               1460|\n|    mean| 180921.19589041095|\n\
  |  stddev|  79442.50288288663|\n|     min|            34900.0|\n|     max|     \
  \      755000.0|\n+--------+-------------------+\n// 创建估计器和转换器以设置管道\n// 将无效分类值的处理策略设置为跳过，以避免在评估时出错\n\
  val roofStyleIndxr = new StringIndexer().setInputCol(\"RoofStyle\")\n.setOutputCol(\"\
  RoofStyleIdx\")\n.setHandleInvalid(\"skip\")\nval heatingIndxr = new StringIndexer().setInputCol(\"\
  Heating\")\n.setOutputCol(\"HeatingIdx\")\n.setHandleInvalid(\"skip\")\nval linearRegression\
  \ = new LinearRegression().setLabelCol(\"SalePrice\")\n// 组装器，用于将特征组装成特征向量\nval\
  \ assembler = new VectorAssembler().setInputCols(\nArray(\"LotArea\", \"RoofStyleIdx\"\
  , \"HeatingIdx\",\n\"LotArea\", \"BedroomAbvGr\", \"KitchenAbvGr\", \"GarageCars\"\
  ,\n\"TotRmsAbvGrd\", \"YearBuilt\", \"TotalSF\"))\n.setOutputCol(\"features\")\n\
  // 设置管道\nval pipeline = new Pipeline().setStages(Array(roofStyleIndxr, heatingIndxr,\
  \ assembler, linearRegression))\n// 将数据拆分为训练集和测试集\nval Array(training, test) = skinny_house_data1.randomSplit(Array(0.8,\
