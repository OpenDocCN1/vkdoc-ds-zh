- "# Kafka 数据源模式\n\nKafka 数据源的一个独特之处在于，它返回的流式 `DataFrame` 具有固定的模式，如清单 6-19 所示。`value`\
  \ 列包含 Kafka 中每条消息的实际内容，列类型为二进制。Kafka 并不关心每条消息的具体内容，因此将其视为二进制数据块。模式中的其余列包含每条消息的元数据。如果消息在发送到\
  \ Kafka 时已采用某种二进制格式序列化，那么你需要一种方法，在 Spark 处理这些消息之前，使用 Spark SQL 函数或 UDF 对其进行反序列化。在以下示例中，内容是字符串，因此你只需将其转换为\
  \ `String` 类型。出于演示目的，清单 6-20 对 `value` 列进行了类型转换，并选择了一些与元数据相关的列进行显示。\n\n```\nval\
  \ pvValueDF = pvDF.selectExpr(\"partition\",\"offset\",\"CAST(key AS STRING)\",\
  \ \"CAST(value AS STRING)\")\n.as[(String, Long, String, String)]\n清单 6-20\n将消息内容转换为字符串类型\n\
  ```\n\n清单 6-21 中的示例包含了几种指定 Kafka 主题、分区和偏移量以从 Kafka 读取消息的变体。\n\n```\n// 从多个主题读取，使用默认的\
  \ startingOffsets 和 endingOffsets\nval kafkaDF = spark.readStream.format(\"kafka\"\
  )\n.option(\"kafka.bootstrap.servers\",\"server1:9092,server2:9092\")\n.option(\"\
  subscribe\", \"topic1,topic2\")\n.load()\n// 使用 subscribePattern 从多个主题读取\nval kafkaDF\
  \ = spark.readStream.format(\"kafka\")\n.option(\"kafka.bootstrap.servers\",\"server1:9092,server2:9092\"\
  )\n.option(\"subscribePattern\", \"topic*\").load()\n// 使用 JSON 格式从分区的特定偏移量读取\n\
  // Scala 中的三重引号格式用于转义 JSON 字符串中的双引号\nVal kafkaDF = spark.readStream.format(\"kafka\"\
  )\n.option(\"kafka.bootstrap.servers\",\"localhost:9092\")\n.option(\"subscribe\"\
  , \"topic1,topic2\")\n.option(\"startingOffsets\", \"\"\" {\"topic1\": {\"0\":51}\
  \ } \"\"\")\n.load()\n清单 6-21\n指定 Kafka 主题、分区和偏移量的各种示例\n```\n\n## 使用自定义数据源\n\n在\
  \ Spark 2.3 之前，数据源 API 存在局限性且扩展性不强。因此，对于 Spark 开发者来说，构建自定义数据源颇具挑战性。从 Spark 2.3 开始，引入了数据源\
  \ V2 API，以解决 V1 中的问题，并提供一套清晰、可扩展且易于使用的新 API。数据源 V2 API 仅在 Scala 中可用。\n\n本节旨在快速概述使用数据源\
  \ V2 API 构建自定义数据源所涉及的接口和主要 API。一些值得参考的优秀示例是内置数据源的实现，例如 `RateSourceProvider.scala`、`RateSourceProviderV2.scala`\
  \ 和 `KafkaSourceProvider.scala` 类。\n\n所有自定义数据源都必须实现一个名为 `DataSourceV2` 的标记接口，然后可以选择实现\
  \ `ContinuousReadSupport` 或 `MicroBatchReadSupport` 接口，或两者都实现。例如，`KafkaSourceProvider.scala`\
  \ 实现了这两个接口，因为它允许用户根据用例选择使用哪种处理模式。这两个接口各自都有一个工厂方法，分别用于创建 `ContinuousReader` 或 `MicroBatchReader`\
  \ 的实例。自定义数据源实现的大部分工作将在于实现这两个接口中定义的 API。\n\n我实现了一个有趣且非容错的数据源，用于从 Wikipedia IRC 服务器读取维基编辑内容。使用\
  \ Spark Structured Streaming 分析各种 Wikipedia 站点的维基编辑内容相当容易。有关更多详细信息，请参阅 GitHub 仓库中的\
  \ `README.md` 文件（[`https://github.com/beginning-spark/book/tree/master/chapter6/custom-data-source`](https://github.com/beginning-spark/book/tree/master/chapter6/custom-data-source)）。要在\
  \ Spark shell 中使用此自定义数据源，第一步是从上述 GitHub 仓库下载 `streaming_sources-assembly-0.0.1.jar`\
  \ JAR 文件。清单 6-22 描述了其余步骤。\n\n```\n// 启动 spark-shell 并加载 streaming_sources-assembly-0.0.1.jar\n\
  bin/spark-shell --jars /streaming_sources-assembly-0.0.1.jar\n// 一旦 spark-shell\
  \ 成功启动\n// 定义数据源提供者名称\nval provideClassName = \"org.structured_streaming_sources.wikedit.WikiEditSourceV2\"\
  \n// 使用自定义数据源并订阅英文 Wikipedia 编辑频道\nval wikiEditDF = spark.readStream.format(provideClassName).option(\"\
  channel\", \"#en.wikipedia\").load()\n// 检查 wikiEditDF 流式 DataFrame 的模式\nwikiEditDF.printSchema\n\
  |-- timestamp: timestamp (nullable = true)\n|-- channel: string (nullable = true)\n\
  |-- title: string (nullable = true)\n|-- diffUrl: string (nullable = true)\n|--\
  \ user: string (nullable = true)\n|-- byteDiff: integer (nullable = true)\n|-- summary:\
  \ string (nullable = true)\n// 仅选择几列进行分析\nval wikiEditSmallDF = wikiEditDF.select(\"\
  timestamp\", \"user\", \"channel\", \"title\")\n// 启动流式查询并将维基编辑内容输出到控制台\nval wikiEditQS\
  \ = wikiEditSmallDF.writeStream.format(\"console\").option(\"truncate\", \"false\"\
  ).start()\n// 等待几秒钟让数据流入，结果可能如下所示\n+-----------------------+------------+--------------+-------------------------+\n\
  |          timestamp|            user|       channel|                    title|\n\
  +-----------------------+------------+--------------+-------------------------+\n\
  | 2018-03-24 15:36:39.409| 6.62.103.211| #en.wikipedia|       Thomas J.R. Hughes|\n\
  | 2018-03-24 15:36:39.412| .92.206.108| #en.wikipedia|List of international schools|\n\
  +-----------------------+------------+--------------+-------------------------+\n\
  // 停止查询流\nwikiEditQS.stop\n清单 6-22\n使用自定义数据源分析维基编辑内容\n```\n\n请注意，自定义数据源名称是数据源提供者的完全限定类名。它不像内置数据源那样简短，因为内置数据源已在名为\
  \ `org.apache.spark.sql.sources.DataSourceRegister` 的文件中注册了它们的短名称。\n\n## 使用数据接收器\n\
  \n流式应用程序的最后一步通常涉及将计算结果写入某个外部系统或存储系统。Structured Streaming 提供了五个内置接收器。其中三个用于生产环境，另外两个用于测试目的。以下各节将详细介绍每个接收器，并提供使用它们的示例代码。\n\
  \n\n\n### 使用文件数据接收器\n\n`File` 数据接收器是一个相当直观易懂且易于使用的数据接收器。你唯一需要提供的必要选项是输出目录。由于 `File`\
  \ 数据接收器具有容错性，Structured Streaming 需要一个检查点位置来写入进度信息和其他元数据，以便在发生故障时帮助恢复。\n\n清单 6-23\
  \ 中的示例配置了 `Rate` 数据源，使其每秒生成十行数据，将生成的行发送到两个分区，并以 JSON 格式将数据写入指定目录。\n\n```\nval rateSourceDF\
  \ = spark.readStream.format(\"rate\")\n.option(\"rowsPerSecond\",\"10\")\n.option(\"\
  numPartitions\",\"2\")\n.load()\nval rateSQ = rateSourceDF.writeStream.outputMode(\"\
  append\")\n.format(\"json\")\n.option(\"path\", \"/tmp/output\")\n.option(\"checkpointLocation\"\
  , \"/tmp/ss/cp\")\n.start()\n// 使用下面这行代码停止写入数据\nrateSQ.stop\n清单 6-23\n将数据从 Rate\
  \ 数据源写入文件接收器\n```\n\n由于分区数配置为两个，每次 Structured Streaming 在触发点写入数据时，输出文件夹中都会写入两个文件。因此，如果你检查输出文件夹，会看到文件名以\
  \ `part-00000` 或 `part-00001` 开头的文件。`Rate` 数据源配置为每秒十行，并且有两个分区；因此，每个输出包含五行，如清单 6-24\
  \ 所示。\n\n```\n{\"timestamp\":\"2018-03-24T17:42:08.182-07:00\",\"value\":205}\n\
  {\"timestamp\":\"2018-03-24T17:42:08.282-07:00\",\"value\":206}\n{\"timestamp\"\
  :\"2018-03-24T17:42:08.382-07:00\",\"value\":207}\n{\"timestamp\":\"2018-03-24T17:42:08.482-07:00\"\
  ,\"value\":208}\n{\"timestamp\":\"2018-03-24T17:42:08.582-07:00\",\"value\":209}\n\
  清单 6-24\n每个输出文件的内容\n```\n\n### 使用 Kafka 数据接收器\n\n在 Structured Streaming 中，将流式 DataFrame\
  \ 的数据写入 `Kafka` 数据接收器比从 `Kafka` 数据源读取数据要简单一些。`Kafka` 数据接收器可以通过表 6-7 中列出的四个选项进行配置。其中三个选项是必需的。需要理解的重要选项是键和值，它们与\
  \ Kafka 消息的结构相关。如前所述，Kafka 中的数据单元是消息，本质上是一个键值对。值的作用相当明显，即保存消息的实际内容，它对 Kafka 来说没有意义。就\
  \ Kafka 而言，值只是一堆字节。然而，键被 Kafka 视为元数据的一部分，它与值一起保存在 Kafka 消息中。当消息发送到 Kafka 并提供了键时，Kafka\
  \ 会利用它作为路由机制，通过对键进行哈希运算，并对主题的分区数取模，来确定特定 Kafka 消息应发送到哪个分区。这意味着所有具有相同键的消息将被路由到同一个分区。如果消息中没有提供键，那么\
  \ Kafka 无法保证该消息发送到哪个分区，并且 Kafka 会采用轮询算法来平衡各分区之间的消息。\n\n**表 6-7** Kafka 数据接收器的选项\n\
  \n| 选项 | 值 | 描述 |\n| --- | --- | --- |\n| `kafka.bootstrap.servers` | `host1:port1`,\
  \ `host2:port2` | 这是一个以逗号分隔的 Kafka 代理服务器列表。请咨询你的 Kafka 管理员以获取要使用的主机名和端口号。 |\n| `topic`\
  \ | `topic1` | 这是一个单一的主题名称。 |\n| `key` | 字符串或二进制 | 此键用于确定 Kafka 消息应发送到哪个分区。所有具有相同键的\
  \ Kafka 消息将进入同一个分区。这是一个可选选项。 |\n| `value` | 字符串或二进制 | 这是消息的内容。对 Kafka 来说，它仅仅是一个字节数组，对\
  \ Kafka 没有意义。 |\n\n有两种提供主题名称的方法。第一种方法是在设置 `Kafka` 数据接收器时在配置中提供主题名称，第二种方法是在流式 DataFrame\
  \ 中定义一个名为 `topic` 的列；该列的值将用作主题名称。\n\n如果流式 DataFrame 中存在名为 `key` 的列，则该列的值将用作消息键。由于键是可选的元数据，因此流式\
  \ DataFrame 中并非绝对需要包含此列。另一方面，必须提供值，并且 `Kafka` 数据接收器期望流式 DataFrame 中有一个名为 `value`\
  \ 的列。\n\n清单 6-25 提供了一个设置 `Rate` 数据源，然后将数据写入名为 `rates` 的 Kafka 主题的示例。如果你打算使用 Spark\
  \ shell 尝试以下代码，请确保按照前面所述，使用适当的参数启动 Spark shell，以包含 `org.apache.spark:spark-sql-kafka-0-10_2.11:2.3.0`\
  \ JAR 文件及其依赖项。\n\n\n\n### 注意\n\n开始使用 Kafka 的最简单方法是下载 Confluent Platform 包，然后按照入门指南进行操作。更多信息请访问\
  \ [`https://docs.confluent.io/current/getting-started.html`](https://docs.confluent.io/current/getting-started.html)。下载完成后，将压缩的\
  \ TAR 文件解压到一个目录中。要启动服务器（Zookeeper、Kafka Broker、Schema Registry），请使用命令行 `./bin/confluent\
  \ start`。每个服务器都监听在特定的端口上。所有命令行工具都位于 `bin` 目录中，并且几乎所有这些工具都需要 Zookeeper 或 Kafka Broker\
  \ 的主机和端口。在运行清单 6-25 中的代码之前，请确保创建一个名为 `rates` 的主题。执行此操作的命令如下：`bin/kafka-topics --create\
  \ --zookeeper localhost:2181 --replication-factor 1 --partitions 2 --topic rates`。要列出活动主题的列表，请使用此命令：`./bin/kafka-topics\
  \ --zookeeper localhost:2181 --list`。\n\n```scala\nimport org.apache.spark.sql.functions._\n\
  // 设置每秒 10 行的速率数据源，并使用两个分区\nval ratesSinkDF = spark.readStream.format(\"rate\")\n\
  .option(\"rowsPerSecond\",\"10\")\n.option(\"numPartitions\",\"2\").load()\n// 转换\
  \ ratesSinkDF 以创建名为 \"key\" 和 \"value\" 的列\n// value 列包含一个 JSON 字符串，该字符串包含两个字段：timestamp\
  \ 和 value\nval ratesSinkForKafkaDF = ratesSinkDF.select($\"value\".cast(\"string\"\
  ) as \"key\",\nto_json(struct(\"timestamp\",\"value\")) as \"value\")\n// 设置一个流式查询，使用主题\
  \ \"rates\" 将数据写入 Kafka\nval rateSinkSQ = ratesSinkForKafkaDF.writeStream\n.outputMode(\"\
  append\")\n.format(\"kafka\")\n.option(\"kafka.bootstrap.servers\",\"localhost:9092\"\
  )\n.option(\"topic\",\"rates\")\n.option(\"checkpointLocation\", \"/Users/hluu/tmp/ss/cp\"\
  )\n.start()\n// 向 Kafka 写入大量消息不需要很长时间，因此几秒钟后，可以随时停止\n// rateSinkSQL\nrateSinkSQ.stop\n\
  ```\n\n**清单 6-25** 将数据从速率数据源写入文件接收器\n\n要从 Kafka 中的 `rates` 主题读取数据，请使用清单 6-21 中列出的示例代码，并为\
  \ `kafka.bootstrap.servers` 和主题名称等选项替换适当的值。从 Kafka 的 `rates` 主题返回的数据将类似于清单 6-26。\n\
  \n```\n+---------+-------+-------+-------------------------------------------------------------+\n\
