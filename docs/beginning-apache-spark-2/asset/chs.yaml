  #### `saveAsTextFile(path)`


  与之前的操作不同，此操作不会向驱动程序返回任何内容。相反，它会将 RDD 中的每一行作为字符串写入指定的路径。如果一个 RDD 有五个分区，`saveAsTextFile`
  操作会将每个分区中的行写入其自己的文件；因此，在指定路径下会有五个部分文件。请注意，此操作接受的是路径名而不是文件名，并且如果指定路径已存在，则会失败。此行为的目的是防止意外覆盖现有数据。


  ## 使用键/值对 RDD


  到目前为止，你使用的 RDD 中每一行代表一个单一值，例如整数或字符串。在许多用例中，需要按某个键进行分组、聚合或连接两个 RDD。例如，如果你有一个包含城市级别人口的数据集，并且想要汇总到州级别，那么你需要按州对这些行进行分组，并对每个州中所有城市的人口求和。Spark
  为这些用例提供了一种特定的 RDD 类型，称为*键/值对* RDD。要成为键/值对 RDD，每一行必须由一个元组组成，其中第一个元素代表键，第二个元素代表值。键和值的类型可以是简单类型（如整数或字符串），也可以是复杂类型（如对象、值的集合或另一个元组）。


  键值对 RDD 附带一组 API，允许你对键执行通用操作，例如分组、聚合和连接。以下部分介绍如何创建键/值对 RDD 以及如何使用相关的转换和操作。


  ### 创建键/值对 RDD


  在 Scala 中，创建键值对 RDD 的最简单方法是将每行的数据组织成两部分：键和值。然后使用内置的 Scala 类 `Tuple2`，它是使用括号的简写形式。参见代码清单
  3-48 了解创建键值对 RDD 的示例。


  ```

  val rdd = sc.parallelize(List("Spark","is","an", "amazing", "piece", "of","technology"))

  val pairRDD = rdd.map(w => (w.length,w))

  pairRDD.collect().foreach(println)

  代码清单 3-48

  创建一个键值对 RDD

  ```


  代码清单 3-48 为每一行创建了一个元组，其中键是长度，值是单词。它们被包裹在一对括号内。一旦每行以这种方式组织，你就可以通过按键分组轻松发现具有相同长度的单词。参见代码清单
  3-49 了解在 `pairRDD` 上调用 `collect` 操作的输出。


  ```

  (5,Spark)

  (2,is)

  (2,an)

  (7,amazing)

  (5,piece)

  (2,of)

  (10,technology)

  代码清单 3-49

  键值对 RDD 的输出

  ```


  键值对 RDD 中的键和值可以是标量值或复杂值，复杂值可以是对象、对象集合或另一个元组。因此，它非常灵活。


  ### 注意


  当在键值对 RDD 中使用自定义对象作为键时，该对象的类必须同时定义自定义的 `equals()` 和 `hashCode()` 方法。




  '
- '# 键/值对 RDD 转换操作


  除了表 3-4 中列出的转换操作外，键/值对 RDD 还拥有一些专门针对键进行操作的额外转换操作。


  **表 3-4** 配对 RDD 的常用转换操作


  | 名称 | 描述 |

  | --- | --- |

  | `groupByKey([numTasks])` | 将相同键的所有值分组在一起。对于一个 `(K,V)` 对的数据集，返回的 RDD 类型为 `(K, Iterable<V>)`。
  |

  | `reduceByKey(func, [numTasks])` | 首先对具有相同键的值进行分组，然后应用指定的 `func` 将值列表缩减为单个值。对于一个
  `(K,V)` 对的数据集，返回的 RDD 类型为 `(K, V)`。 |

  | `sortByKey([ascending], [numTasks])` | 根据键对行进行排序。默认情况下，键按升序排序。 |

  | `join(otherRDD, [numTasks])` | 通过匹配两个 RDD 中的键来连接它们的行。返回的 RDD 的每一行都包含一个元组，其中第一个元素是键，第二个元素是另一个包含两个
  RDD 值的元组。 |


  表 3-4 中列出的一些转换操作有一个可选的 `numTasks` 参数，该参数用于控制 Spark 在父 RDD 上执行转换操作时的并行度。默认情况下，并行度等于父
  RDD 的分区数。在调优过程中，如果认为通过增加并行度可以更快地完成转换操作，那么你可以为 `numTasks` 指定一个大于父 RDD 分区数的值。


  以下部分提供了使用表 3-4 中列出的配对 RDD 转换操作的示例。


  ## `groupByKey([numTasks])`


  这个转换操作正如其名。它会将所有具有相同键的行分组到一行中。本质上，返回的 RDD 中的行数将与父 RDD 中唯一键的数量相同。返回的 RDD 中的每一行都包含一个唯一的键以及该键对应的值列表。请参阅清单
  3-50 了解如何使用此转换操作；清单 3-51 显示了输出结果。


  ```

  val rdd = sc.parallelize(List("Spark","is","an", "amazing", "piece", "of","technology"))

  val pairRDD = rdd.map(w => (w.length,w))

  val wordByLenRDD = pairRDD.groupByKey()

  wordByLenRDD.collect().foreach(println)

  清单 3-50

  使用 groupByKey 转换操作按单词长度对单词进行分组

  ```


  ```

  (10,CompactBuffer(technology))

  (2,CompactBuffer(is, an, of))

  (5,CompactBuffer(Spark, piece))

  (7,CompactBuffer(amazing))

  清单 3-51

  使用 groupByKey 转换操作按单词长度分组后的输出结果

  ```


  通常，在执行 `groupByKey` 转换操作后，需要对每个键的值列表进行一些处理。如果该处理是使用符合交换律和结合律的二元操作来完成的，那么最好使用 `reduceByKey`
  转换操作来加速处理逻辑。你可以在下一节中找到更多关于此的详细信息。


  ## `reduceByKey(func, [numTasks])`


  此转换操作通常用于将相同键的所有值缩减为单个值。该过程分两步进行，如图 3-1 所示。第一步是将相同键的值分组在一起，第二步是将给定的 `reduce` 函数应用于每个键的值列表。此转换操作的实现包含一个内置优化，可以在两个级别上执行此两步过程。第一个级别是在每个单独的分区内，第二个级别是在所有分区之间。通过首先在每个单独的分区内应用此转换操作，它将同一分区内具有相同键的所有行折叠为一行，从而显著减少了需要在多个分区之间移动的数据量。请参阅清单
  3-52 了解如何使用此转换操作；清单 3-53 显示了输出结果。


  ![../images/419951_1_En_3_Chapter/419951_1_En_3_Fig1_HTML.png](img/419951_1_En_3_Fig1_HTML.png)


  **图 3-1** `reduceByKey` 转换操作中的两步过程


  ```

  val candyTx = sc.parallelize(List(("candy1", 5.2), ("candy2", 3.5),

  ("candy1", 2.0), ("candy2", 6.0), ("candy3", 3.0))

  val summaryTx = candyTx.reduceByKey((total, value) => total + value)

  summaryTx.collect()

  清单 3-52

  使用 reduceByKey 转换操作计算总价

  ```


  ```

  (candy1,7.2)

  (candy2,9.5)

  (candy3,3.0)

  清单 3-53

  计算总价后 reduceByKey 的输出结果

  ```


  ## `sortByKey([ascending],[numTasks])`


  这个转换操作很容易理解。它根据键对行进行排序，并且可以选择指定结果是按升序（默认）还是降序排列。以清单 3-52 中的示例为基础，交换键和值，这样你就可以根据交易金额对行进行排序。请参阅清单
  3-54 了解按交易金额排序的示例；清单 3-55 显示了输出结果。


  ```

  val summaryByPrice = summaryTx.map(t => (t._2, t._1)).sortByKey()

  summaryByPrice.collect

  清单 3-54

  使用 sortByKey 转换操作按价格排序

  ```


  ```

  Array[(Double, String)] = Array((3.0,candy3), (7.2,candy1), (9.5,candy2))

  清单 3-55

  使用 sortByKey 转换操作按价格排序后的输出结果

  ```


  如果你想按价格降序排序，只需将第一个参数的值设置为 `false`。请参阅清单 3-56 了解降序排序的示例，并参阅清单 3-57 查看输出结果。


  ```

  val summaryByPrice = summaryTx.map(t => (t._2, t._1)).sortByKey(false)

  summaryByPrice.collect

  清单 3-56

  使用 sortByKey 转换操作按价格降序排序

  ```


  ```

  (9.5,candy2)

  (7.2,candy1)

  (3.0,candy3)

  清单 3-57

  使用 sortByKey 转换操作按价格降序排序后的输出结果

