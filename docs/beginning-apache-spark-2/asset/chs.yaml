  \n**图 2-11** 如果没有语法错误，Spark Shell 会返回函数签名\n\n为了找出 `ages` 数组中的奇数年龄，你将利用 `Array` 类中的\
  \ `filter` 函数。\n\n```\nscala> ages.filter(age => isOddAge(age)).foreach(println)\n\
  ```\n\n上一行代码执行过滤，然后遍历结果以打印出奇数年龄。在 Scala 中，使用函数链式调用来使代码简洁是一种常见做法。Spark Shell 的输出见图\
  \ 2-12。\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig12_HTML.jpg](img/419951_1_En_2_Fig12_HTML.jpg)\n\
  \n**图 2-12** 过滤并仅打印奇数年龄的输出\n\n现在，让我们对之前定义的 Scala 变量和函数尝试使用名为 `:type` 的 Shell 命令。当你使用\
  \ Spark Shell 一段时间后，可能会忘记某个变量的数据类型或函数的返回类型，这时这个命令就派上用场了。使用 `:type` 命令的示例见图 2-13。\n\
  \n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig13_HTML.jpg](img/419951_1_En_2_Fig13_HTML.jpg)\n\
  \n**图 2-13** `:type` 命令的输出\n\n为了学习 Spark，并不一定要精通 Scala 编程语言。但是，你必须熟悉并能够运用 Scala\
  \ 的基础知识。这里有一个很好的资源，教你学习刚好够用的 Scala 来学习 Spark：[`https://github.com/deanwampler/JustEnoughScalaForSpark`](https://github.com/deanwampler/JustEnoughScalaForSpark)。该资源曾在多个与\
  \ Spark 相关的会议上展示过。\n\n### Spark UI 及与 Spark 的基本交互\n\n在上一节中，我提到 Spark Shell 是一个 Scala\
  \ 应用程序。这只说对了一部分。Spark Shell 实际上是一个用 Scala 编写的 Spark 应用程序。当 Spark Shell 启动时，会初始化并设置好一些供你使用的东西，包括\
  \ Spark UI 和一些重要的变量。\n\n\n\n### Spark UI\n\n如果你仔细查看图 2-2 或图 2-3 中 Spark shell 的输出，你会看到一行类似下面的内容。你的\
  \ Spark shell 中的 URL 可能略有不同，但重要的是这个 URL。\n\n```\nSpark context Web UI available\
  \ at http://192.168.1.73:4042\n```\n\n如果你在 Spark shell 中将浏览器指向该 URL，浏览器将显示类似图 2-14\
  \ 的内容。\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig14_HTML.jpg](img/419951_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14\n\nSpark UI\n\nSpark UI 是一个旨在帮助监控和调试 Spark 应用程序的 Web 应用程序。它包含 Spark 应用程序的详细运行时信息和各种资源消耗情况。运行时信息包含各种指标，这些指标对于诊断\
  \ Spark 应用程序的性能问题非常有帮助。需要注意的一点是，Spark UI 仅在 Spark 应用程序运行时才可用。\n\nSpark UI 顶部的导航栏包含指向各个选项卡的链接，包括\
  \ Jobs、Stages、Storage、Environment、Executors 和 SQL。现在，我将简要介绍 Environment 和 Executors\
  \ 选项卡，并在后续章节中描述其余选项卡。\n\nEnvironment 选项卡包含 Spark 应用程序运行环境的基本信息。其分区包括 Runtime Information、Spark\
  \ Properties、System Properties 和 Classpath Entries。表 2-3 提供了关于这些区域的详细信息。\n\n表 2-3\n\
  \nEnvironment 选项卡内各分区信息\n\n| 名称 | 描述 |\n| --- | --- |\n| Runtime Information | 此部分包含\
  \ Spark 所依赖的各种组件的位置和版本，包括 Java 和 Scala。 |\n| Spark Properties | 此区域包含在 Spark 应用程序中配置的基本属性和高级属性。基本属性包括应用程序的基本信息，例如应用程序\
  \ ID、名称等。高级属性用于开启或关闭 Spark 的某些功能，或以最适合特定应用程序的方式进行调整。有关可配置属性的完整列表，请参见 [`https://spark.apache.org/docs/latest/configuration.html`](https://spark.apache.org/docs/latest/configuration.html)。\
  \ |\n| System Properties | 这些属性主要位于操作系统和 Java 层面，并非 Spark 特有。 |\n| Classpath Entries\
  \ | 此区域包含 Spark 应用程序中使用的类路径和 JAR 文件列表。 |\n\nExecutors 选项卡包含支持 Spark 应用程序的每个执行器的摘要和细分信息。这些信息包括某些资源的容量以及每个执行器中的使用量。资源包括内存、磁盘、CPU\
  \ 等。Summary 部分提供了 Spark 应用程序中所有执行器资源消耗的概览。更多详情请参见图 2-15。\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig15_HTML.png](img/419951_1_En_2_Fig15_HTML.png)\n\
  \n图 2-15\n\n仅使用单个执行器的 Spark 应用程序的 Executors 选项卡\n\n### Spark 的基本交互\n\n一旦 Spark shell\
  \ 成功启动，一个名为 `spark` 的显著变量就会被初始化，并可在 Spark shell 中使用。这个 `spark` 变量是名为 `SparkSession`\
  \ 的类的一个实例。让我们使用 `:type` 命令来验证这一点。\n\n```\nscala>:type spark\n```\n\nSpark shell\
  \ 会显示其类型，如图 2-16 所示。\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig16_HTML.jpg](img/419951_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16\n\n显示 spark 变量的类型\n\n`SparkSession` 类是在 Spark 2.0 中引入的，旨在提供与底层 Spark 功能交互的单一入口点。该类提供了用于从非结构化文本文件以及各种格式（包括\
  \ JSON、CSV、Parquet、ORC 等）的结构化和二进制数据中读取数据的 API。此外，`SparkSession` 还提供了检索和设置 Spark\
  \ 相关配置的功能。\n\n让我们开始在 Spark shell 中与 `spark` 变量交互，打印出一些有用的信息，例如版本和现有配置。在 Spark shell\
  \ 中，输入以下代码以打印 Spark 版本（输出见图 2-17）：\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig17_HTML.jpg](img/419951_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17\n\nSpark 版本输出\n\n```\nscala> spark.version\n```\n\n为了更规范一些，你可以使用上一节学到的\
  \ `println` 函数来打印 Spark 版本，如图 2-18 所示。\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig18_HTML.jpg](img/419951_1_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18\n\n使用 println 函数显示 Spark 版本\n\n```\nscala> println(\"Spark version:\" +\
  \ spark.version)\n```\n\n要查看 Spark shell 中配置的默认配置，你可以访问 `spark` 的 `conf` 变量。以下是在\
  \ Spark shell 中显示默认配置的代码（输出如图 2-19 所示）：\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig19_HTML.jpg](img/419951_1_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19\n\nSpark shell 应用程序中的默认配置\n\n```\nscala> spark.conf.getAll.foreach(println)\n\
  ```\n\n要查看可以从 `spark` 访问的完整可用对象集，你可以利用 Spark shell 的代码补全功能。\n\n```\nscala> spark.\n\
  ```\n\n图 2-20 包含了上一条命令的结果。\n\n![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig20_HTML.jpg](img/419951_1_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20\n\n可以从 spark 变量访问的完整变量列表\n\n后续章节将提供更多使用 `spark` 与底层 Spark 功能交互的示例。\n\n\n\
  \n"
- '# Databricks 简介


  `Databricks` 是一款由名为 `Databricks` 的公司提供的商业产品，该公司是 `Apache Spark` 背后的主要推动力量。根据其产品文档，`Databricks`
  是一个运行在云端的即时数据平台，并且是完全托管的。该平台的主要目标是简化大数据处理，让任何人都能轻松构建和部署高级分析解决方案。它围绕 `Apache Spark`
  构建，并为全球客户提供四大核心价值主张。详情请参见图 2-21。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig21_HTML.jpg](img/419951_1_En_2_Fig21_HTML.jpg)


  图 2-21


  Databricks 平台


  *   完全托管的 Spark 集群

  *   用于探索和可视化的交互式工作区

  *   生产流水线调度器

  *   为您喜爱的基于 Spark 的应用提供支持的平台


  `Databricks` 产品有两个版本：完整平台版和社区版。完整平台版是付费产品，供公司利用 `Databricks` 产品中的所有高级功能。社区版是免费的，非常适合那些想要试用
  `Databricks` 并学习 `Apache Spark` 的用户。


  下一节将介绍 `Databricks` 社区版的基本功能，以便您使用 `Databricks` 来学习 `Apache Spark`。一旦您熟悉了 `Databricks`，您会发现学习
  `Spark`、执行数据分析或构建 `Spark` 应用程序变得简单直观。本节并非旨在成为 `Databricks` 产品的全面指南。未来的所有示例都将在 `Spark`
  shell 中完成。有关 `DataBricks` 的全面指南，请参阅 [`https://docs.databricks.com/user-guide/index.html`](https://docs.databricks.com/user-guide/index.html)。


  使用 `Databricks` 的第一步是在 `Databricks` 社区版上注册一个免费账户，网址为 [`https://accounts.cloud.databricks.com/registration.html#signup/community`](https://accounts.cloud.databricks.com/registration.html#signup/community)。这个过程非常简单快捷，几分钟内即可创建账户。在注册表单中提供并提交必要信息后，您将收到一封来自
  `Databricks` 的确认邮件，内容类似于图 2-22。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig22_HTML.jpg](img/419951_1_En_2_Fig22_HTML.jpg)


  图 2-22


  Databricks 用于确认电子邮件地址的邮件


  点击上一封邮件中的链接，您将进入 `Databricks` 登录表单，如图 2-23 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig23_HTML.jpg](img/419951_1_En_2_Fig23_HTML.jpg)


  图 2-23


  Databricks 登录页面


  使用您在注册步骤中提供的电子邮件和密码成功登录后，您将看到 `Databricks` 欢迎页面，如图 2-24 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig24_HTML.png](img/419951_1_En_2_Fig24_HTML.png)


  图 2-24


  Databricks 欢迎页面


  随着时间的推移，欢迎页面可能会发生变化，因此可能不完全像图 2-24 所示。您可以随意浏览页面顶部的那些特色笔记本。


  本节的目标是在 `Databricks` 中创建一个笔记本，以便您可以学习上一节中介绍的命令。为此，您需要执行以下操作：


  1.  创建一个集群。

  2.  创建一个文件夹。

  3.  创建一个笔记本。


  ## 创建集群


  `Databricks` 社区版（CE）最酷的功能之一是它免费提供一个具有 6GB 内存的单节点 `Spark` 集群。在撰写本书时，此单节点集群托管在 `AWS`
  云上。每个 `Databricks` CE 账户一次只能创建一个集群。只要集群正在使用，它就会保持运行状态。如果集群空闲一段时间（两小时），`Databricks`
  会自动将其关闭。这意味着您可以自行关闭集群，也可以让 `Databricks` 代您关闭。


  要创建集群，请单击页面左侧垂直导航栏中的 `Clusters` 图标。`Clusters` 页面如图 2-25 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig25_HTML.png](img/419951_1_En_2_Fig25_HTML.png)


  图 2-25


  无活动集群的 Databricks Clusters 页面


  现在单击 `Create Cluster` 按钮，调出 `New Cluster` 表单，如图 2-26 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig26_HTML.png](img/419951_1_En_2_Fig26_HTML.png)


  图 2-26


  创建集群表单


  此表单上唯一必填的字段是 `Cluster Name`。表 2-4 简要描述了所有字段。


  表 2-4


  Databricks 新集群表单上的字段


  | 名称 | 描述 |

  | --- | --- |

  | 集群名称 | 这是用于标识集群的唯一名称。名称的每个单词之间可以有空格。例如，可以命名为“my spark cluster”。 |

  | Databricks 运行时版本 | `Databricks` 支持多个版本的 `Spark`。出于学习目的，请选择已为您自动填写的**最新版本**。每个版本都绑定到特定的
  `AWS` 镜像。 |

  | 实例 | 对于 CE 版，没有其他选择可用。 |

  | AWS – 可用区 | 这允许您决定单节点集群将在哪个 `AWS` 可用区中运行。根据您的位置，选项可能有所不同。 |

  | Spark – Spark 配置 | 这允许您指定启动 `Spark` 集群时应包含的任何特定于应用程序的配置。例如，包括 `JVM` 配置、启用某些 `Spark`
  功能的能力等。 |


  填写 `Cluster Name` 字段后，单击 `Create Cluster` 按钮。根据具体情况，创建单节点 `Spark` 集群可能需要一分钟到十分钟的时间。`Spark`
  集群成功创建后，集群名称旁边会出现一个绿点，如图 2-27 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig27_HTML.png](img/419951_1_En_2_Fig27_HTML.png)


  图 2-27


  集群成功创建后


  您可以随意单击集群名称或此页面上的各种链接进行探索。请注意，如果您尝试按照前面的步骤创建另一个 `Spark` 集群，`Databricks` 将不允许您在已有正在运行的集群时执行此操作。


  要停止活动的 `Spark` 集群，请单击 `Actions` 列中的方形按钮。


  有关在 `Databricks` 上创建和管理 `Spark` 集群的更多信息，请参阅 [`https://docs.databricks.com/user-guide/clusters/index.html`](https://docs.databricks.com/user-guide/clusters/index.html)。


  让我们继续下一步，即创建一个文件夹。




  ### 创建文件夹


  在介绍如何创建文件夹之前，有必要先花点时间描述一下 Databricks 中的工作区概念。理解工作区最简单的方式是将其视为计算机上的根文件夹，这意味着你可以将文件放在其中，或创建文件夹来以特定方式组织文件。


  要创建文件夹，请点击页面左侧垂直导航栏中的 `Workspace` 图标。`Workspace` 列将滑出，如图 2-28 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig28_HTML.png](img/419951_1_En_2_Fig28_HTML.png)


  图 2-28


  工作区列


  现在点击 `Workspace` 列右上角的下拉箭头，将出现一个级联下拉菜单，如图 2-29 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig29_HTML.jpg](img/419951_1_En_2_Fig29_HTML.jpg)


  图 2-29


  用于创建文件夹的菜单项


  选择 `Folder` 菜单项将弹出 `New Folder Name` 对话框，如图 2-30 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig30_HTML.jpg](img/419951_1_En_2_Fig30_HTML.jpg)


  图 2-30


  新建文件夹名称对话框


  现在你可以输入一个文件夹名称，例如 `Chapter 2`，然后点击 `Create Folder` 按钮完成操作。`Chapter 2` 文件夹现在应该会出现在
  `Workspace` 列中，如图 2-31 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig31_HTML.jpg](img/419951_1_En_2_Fig31_HTML.jpg)


  图 2-31


  `Chapter 2` 文件夹出现在 `Workspace` 列中


  在继续创建笔记本之前，值得一提的是还有另一种创建文件夹的方法：将鼠标指针放在 `Workspace` 列中的任意位置并右键单击，然后会出现相同的菜单选项。


  有关使用工作区和创建文件夹的更多详细信息，请查看 [`https://docs.databricks.com/user-guide/workspace.html`](https://docs.databricks.com/user-guide/workspace.html)。


  ### 创建笔记本


  接下来，你需要在 `Chapter 2` 文件夹中创建一个 Scala 笔记本。首先在 `Workspace` 列中选择 `Chapter 2` 文件夹。`Chapter
  2` 列会在 `Workspace` 列之后滑出，看起来如图 2-32 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig32_HTML.jpg](img/419951_1_En_2_Fig32_HTML.jpg)


  图 2-32


  `Chapter 2` 列出现在 `Workspace` 列的右侧


  现在，你可以点击 `Chapter 2` 列右上角的下拉箭头，或者在 `Chapter 2` 列中的任意位置右键单击，以调出菜单，如图 2-33 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig33_HTML.jpg](img/419951_1_En_2_Fig33_HTML.jpg)


  图 2-33


  创建笔记本菜单项


  选择 `Notebook` 菜单项将弹出 `Create Notebook` 对话框。为你的笔记本命名，并确保在 `Language` 字段中选择 `Scala`
  选项。集群的值应自动填充，因为 Databricks CE 版本一次只能有一个集群。你的对话框应该看起来如图 2-34 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig34_HTML.jpg](img/419951_1_En_2_Fig34_HTML.jpg)


  图 2-34


  已选择 `Scala` 语言选项的 `Create Notebook` 对话框


  点击 `Create` 按钮后，将创建一个新的笔记本，如图 2-35 所示。


  ![../images/419951_1_En_2_Chapter/419951_1_En_2_Fig35_HTML.png](img/419951_1_En_2_Fig35_HTML.png)


  图 2-35


  新的 Scala 笔记本


  如果你从未使用过 IPython Notebook，笔记本的概念一开始可能看起来有点奇怪。不过，一旦你习惯了，你就会喜欢上它。


  *笔记本*本质上是一个交互式计算环境（类似于 Spark shell，但要好得多），你可以在其中执行 Spark 代码，使用 Markdown 或 HTML 以富文本格式记录代码，并通过各种类型的图表和图形可视化数据分析结果。


  下一节将仅介绍一些基本指令，以帮助你高效使用 Spark 笔记本。有关如何使用 Databricks 笔记本并进行交互的完整指令列表，请参阅 [`https://docs.databricks.com/user-guide/notebooks/index.html`](https://docs.databricks.com/user-guide/notebooks/index.html)。


  一个 Spark 笔记本包含一组单元格，每个单元格包含一个代码块，用于执行或标记为文档用途。




  ### 注意


  使用 Spark 笔记本的一个良好实践是将数据处理逻辑拆分为多个逻辑组，使每个组位于一个或多个单元格中。这与开发可维护软件应用程序的实践类似。


