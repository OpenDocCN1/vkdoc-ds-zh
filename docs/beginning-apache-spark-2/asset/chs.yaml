  \ 进行用户会话化\n\n本用例使用 `flatMapGroupsWithState` API 执行用户会话化，该 API 支持每个组输出多行。在此示例中，会话化处理逻辑基于用户活动。当执行\
  \ `login` 操作时创建会话，当执行 `logout` 操作时结束会话。如果用户在 30 分钟内没有活动，会话将自动结束。您将利用前面描述的超时功能来执行此检测。在输出方面，每当会话开始或结束时，该信息将被发送到输出。输出信息包括用户\
  \ ID、会话开始和结束时间以及访问的页面数。\n\n本用例的数据位于目录 `<path>/chapter7/data/sessionization` 中，该目录包含三个文件。其内容如清单\
  \ 7-15 所示。文件 `file1.json` 包含 `user1` 的活动，其中包括一个 `login` 操作，但没有 `logout` 操作。文件 `file2.json`\
  \ 包含 `user2` 的所有活动，包括 `login` 和 `logout` 操作。文件 `file3.json` 仅包含 `user3` 的 `login`\
  \ 操作。三个文件中用户活动的时间戳设置方式使得在处理 `file3.json` 时，`user1` 的会话将超时。这是因为到那时，`user1` 的空闲时间已超过\
  \ 30 分钟。\n\n```\n// file1.json\n{\"user\":\"user1\",\"action\":\"login\",\"page\"\
  :\"page1\", \"ts\":\"2017-09-06T08:08:53\"}\n{\"user\":\"user1\",\"action\":\"click\"\
