  ### `limit(n)`


  此转换通过获取前`n`行返回一个新的`DataFrame`。此转换通常在排序完成后使用，以根据排序顺序找出前`n`行或后`n`行。清单 4-29 展示了一个使用`limit`转换来找出名字最长的前十位演员的示例。


