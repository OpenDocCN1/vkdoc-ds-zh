  :\"send\",\"page\":\"page3\", \"ts\":\"2017-09-06T08:11:10\"}\n// file2.json\n{\"\
  user\":\"user2\",\"action\":\"login\", \"page\":\"page1\", \"ts\":\"2017-09-06T08:44:12\"\
  }\n{\"user\":\"user2\",\"action\":\"view\", \"page\":\"page7\", \"ts\":\"2017-09-06T08:45:33\"\
  }\n{\"user\":\"user2\",\"action\":\"view\", \"page\":\"page8\", \"ts\":\"2017-09-06T08:55:58\"\
  }\n{\"user\":\"user2\",\"action\":\"view\", \"page\":\"page6\", \"ts\":\"2017-09-06T09:10:58\"\
  }\n{\"user\":\"user2\",\"action\":\"logout\",\"page\":\"page9\", \"ts\":\"2017-09-06T09:16:19\"\
  }\n// file3.json\n{\"user\":\"user3\",\"action\":\"login\", \"page\":\"page4\",\
  \ \"ts\":\"2017-09-06T09:17:11\"}\n清单 7-15\n用户活动数据\n```\n\n接下来，您将准备几个类和两个函数，以将用户会话化逻辑应用于上述数据。对于此用例，用户活动输入数据由类\
  \ `UserActivity` 表示。用户会话数据的中间状态由类 `UserSessionState` 表示，用户会话输出由类 `UserSessionInfo`\
  \ 表示。清单 7-16 显示了这三个类的代码。\n\n```\ncase class UserActivity(user:String, action:String,\
  \ page:String, ts:java.sql.Timestamp)\n// lastTS 字段用于存储最大的用户活动时间戳，该信息用于\n// 设置每个用户会话的超时值\n\
  case class UserSessionState(var user:String, var status:String, var startTS:java.sql.Timestamp,\n\
  var endTS:java.sql.Timestamp, var lastTS:java.sql.Timestamp,\nvar numPage:Int)\n\
  // 结束时间戳在会话结束时填充。\ncase class UserSessionInfo(userId:String, start:java.sql.Timestamp,\
  \ end:java.sql.Timestamp,  numPage:Int)\n清单 7-16\n用于输入、中间状态和输出的 Scala 样例类\n```\n\
  \n\n\n接下来定义两个函数。第一个函数名为`updateUserActivity`，负责根据单个用户活动更新用户会话状态。它会根据用户执行的操作适当更新会话开始或结束时间，同时更新最新活动时间戳。第二个函数名为`updateAcrossAllUserActivities`，是作为回调函数传入`flatMapGroupsWithState`的函数。该函数有两个主要职责：一是处理中间会话状态的超时，并在出现此类情况时更新用户会话结束时间；二是确定何时以及向输出发送什么内容。期望的输出是在用户会话开始时输出一行，在用户会话结束时输出另一行。这两个函数的逻辑见清单\
  \ 7-17。\n\n```scala\nimport org.apache.spark.sql.streaming.GroupState\nimport scala.collection.mutable.ListBuffer\n\
  \ndef updateUserActivity(userSessionState:UserSessionState, userActivity:UserActivity)\
  \ : UserSessionState = {\n  userActivity.action match {\n    case \"login\" => {\n\
  \      userSessionState.startTS = userActivity.ts\n      userSessionState.status\
  \ = \"Online\"\n    }\n    case \"logout\" => {\n      userSessionState.endTS =\
  \ userActivity.ts\n      userSessionState.status = \"Offline\"\n    }\n    case\
  \ _ => {\n      userSessionState.numPage += 1\n      userSessionState.status = \"\
  Active\"\n    }\n  }\n  userSessionState.lastTS = userActivity.ts\n  userSessionState\n\
  }\n\ndef updateAcrossAllUserActivities(user:String, inputs:Iterator[UserActivity],\n\
  \    oldState: GroupState[UserSessionState]) : Iterator[UserSessionInfo] = {\n \
  \ var userSessionState = if (oldState.exists) oldState.get else UserSessionState(user,\
  \ \"\",\n    new java.sql.Timestamp(System.currentTimeMillis), null, null, 0)\n\
  \  var output = ListBuffer[UserSessionInfo]()\n  inputs.toList.sortBy(_.ts.getTime).foreach(\
  \ userActivity => {\n    userSessionState = updateUserActivity(userSessionState,\
  \ userActivity)\n    oldState.update(userSessionState)\n    if (userActivity.action\
  \ == \"login\") {\n      output += UserSessionInfo(user, userSessionState.startTS,\n\
  \        userSessionState.endTS, 0)\n    }\n  })\n  val sessionTimedOut = oldState.hasTimedOut\n\
  \  val sessionEnded = !Option(userSessionState.endTS).isEmpty\n  val shouldOutput\
  \ = sessionTimedOut || sessionEnded\n  shouldOutput match {\n    case true => {\n\
  \      if (sessionTimedOut) {\n        userSessionState.endTS = new java.sql.Timestamp(oldState.getCurrentWatermarkMs)\n\
  \      }\n      oldState.remove()\n      output += UserSessionInfo(user, userSessionState.startTS,\n\
  \        userSessionState.endTS, userSessionState.numPage)\n    }\n    case _ =>\
  \ {\n      // extend session\n      oldState.update(userSessionState)\n      oldState.setTimeoutTimestamp(userSessionState.lastTS.getTime,\"\
  30 minutes\")\n    }\n  }\n  output.iterator\n}\n```\n*清单 7-17 执行用户会话化的函数*\n\n设置步骤现已完成，接下来将在清单\
  \ 7-18 的结构化流应用程序中将回调函数接入`flatMapGroupsWithState`函数。在此示例中，它将利用超时功能，因此需要设置水印和事件时间超时类型。模拟流数据的步骤与之前的某个示例类似，如下所示：\n\
  \n1. 在目录`<path>/chapter7/data`下创建一个名为`input`的目录。如果该目录已存在，则删除其中的所有文件。\n2. 运行清单 7-18\
  \ 中的代码。\n3. 将`file1.json`复制到`input`目录，然后观察输出。对`file2.json`和`file3.json`重复此步骤。\n\n\
  ```scala\nimport org.apache.spark.sql.streaming.{GroupStateTimeout, OutputMode}\n\
  import org.apache.spark.sql.types._\nimport org.apache.spark.sql.functions._\n\n\
  val userActivitySchema = new StructType().add(\"user\", StringType, false)\n  .add(\"\
  action\", StringType, false)\n  .add(\"page\", StringType, false)\n  .add(\"ts\"\
  , TimestampType, false)\n\nval userActivityDF = spark.readStream.schema(userActivitySchema).json(\"\
  /chapter7/data/input\")\n\n// convert to DataSet of type UserActivity\nval userActivityDS\
  \ = userActivityDF.withWatermark(\"ts\", \"30 minutes\").as[UserActivity]\n\n//\
  \ specify the event-time timeout type and wire in the call-back function\nval userSessionDS\
  \ = userActivityDS.groupByKey(_.user)\n  .flatMapGroupsWithState[UserSessionState,UserSessionInfo]\n\
  \    (OutputMode.Append,GroupStateTimeout.EventTimeTimeout)\n    (updateAcrossAllUserActivities)\n\
  \n// setup the output and start the streaming query\nval userSessionSQ = userSessionDS.writeStream\n\
  \  .format(\"console\")\n  .option(\"truncate\",false)\n  .outputMode(\"append\"\
  )\n  .start()\n\n// only run this line of code below after done copying over file3.json\n\
  userSessionSQ.stop\n\n// the output after processing file1.json\n+-------+--------------------+-----+--------+\n\
  | userId|               start| end | numPage|\n+-------+--------------------+-----+--------+\n\
  | user1 | 2017-09-06 08:08:53| null|    0   |\n+-------+--------------------+-----+--------+\n\
  \n// the output after processing file2.json\n+-------+--------------------+--------------------+--------+\n\
  | userId|               start|                 end| numPage|\n+-------+--------------------+--------------------+--------+\n\
  | user2 | 2017-09-06 08:44:12|                null|       0|\n| user2 | 2017-09-06\
  \ 08:44:12| 2017-09-06 09:16:19|       3|\n+-------+--------------------+--------------------+--------+\n\
  \n// the output after processing file3.json\n+-------+--------------------+--------------------+--------+\n\
  | userId|               start|                 end| numPage|\n+-------+--------------------+--------------------+--------+\n\
  | user1 | 2017-09-06 08:08:53| 2017-09-06 08:46:19|       2|\n| user3 | 2017-09-06\
  \ 09:17:11|                null|       0|\n+-------+--------------------+--------------------+--------+\n\
  ```\n*清单 7-18 在流式应用程序中使用任意状态处理执行用户会话化*\n\n处理`file1.json`中的用户活动后，输出中只有一行。这是符合预期的，因为每当函数`updateAcrossAllUserActivities`在用户活动中看到`login`操作时，它都会向输出`ListBuffer`中添加一个`UserSessionInfo`类的实例。处理`file2.json`后，输出中有两行：一行对应`login`操作，另一行对应`logout`操作。现在`file3.json`只包含`user3`的一个用户活动（操作为`login`），但输出中包含两行。`user1`的那一行是检测到`user1`会话已超时的结果，这意味着由于`user1`缺乏活动，水印已超过该特定会话的超时值。\n\
  \n如前两个用例所示，结构化流中的任意状态处理功能提供了一种灵活且强大的方式，可以在每个分组上应用用户定义的处理逻辑，并完全控制向输出发送的内容和时机。\n\n\
  \n\n"
- "# 处理重复数据\n\n数据去重是数据处理领域的常见需求，在批处理中实现起来并不困难。但在流处理中，由于流式数据的无界特性，这一任务更具挑战性。实时流式数据中的重复数据，通常是因为数据生产者在不稳定的网络连接下，为确保特定数据被发送和处理而多次发送同一数据所致。\n\
  \n幸运的是，Structured Streaming 让流式应用能够轻松实现数据去重，这些应用可以通过在数据到达时丢弃重复数据，从而保证精确一次处理。Structured\
  \ Streaming 提供的数据去重功能可以配合水印使用，也可以不配合。但需要注意的关键点是，在不指定水印的情况下进行数据去重时，Structured Streaming\
  \ 需要维护的状态会随着流式应用的生命周期无限增长，这可能导致内存溢出问题。使用水印后，早于水印的延迟数据会被自动丢弃，以避免任何重复的可能性。\n\nStructured\
  \ Streaming 执行数据去重的 API 非常简单，它只有一个输入参数，即用于唯一标识每一行的列名列表。这些列的值将用于执行重复检测，Structured\
  \ Streaming 会将其作为中间状态存储。用于演示数据去重功能的示例数据与移动事件数据具有相同的模式。计数聚合将基于 `id` 列的分组进行。`id` 和\
  \ `ts` 列都用作去重的用户自定义键。此示例的数据位于 `<path>/chapter7/data/deduplication` 目录下，包含两个文件：`file1.json`\
  \ 和 `file2.json`。这些文件的内容如代码清单 7-19 所示。\n\n```\n// file1.json - 每一行在 id 和 ts 列上都是唯一的\n\
  {\"id\":\"phone1\",\"action\":\"open\",\"ts\":\"2018-03-02T10:15:33\"}\n{\"id\"\
  :\"phone2\",\"action\":\"open\",\"ts\":\"2018-03-02T10:22:35\"}\n{\"id\":\"phone3\"\
  ,\"action\":\"open\",\"ts\":\"2018-03-02T10:23:50\"}\n// file2.json - 前两行与上面 file1.json\
  \ 的前两行重复\n// 第三行是唯一的\n// 第四行是唯一的，但它是延迟到达的，因此不会被处理\n{\"id\":\"phone1\",\"action\"\
  :\"open\",\"ts\":\"2018-03-02T10:15:33\"}\n{\"id\":\"phone2\",\"action\":\"open\"\
  ,\"ts\":\"2018-03-02T10:22:35\"}\n{\"id\":\"phone4\",\"action\":\"open\",\"ts\"\
  :\"2018-03-02T10:29:35\"}\n{\"id\":\"phone5\",\"action\":\"open\",\"ts\":\"2018-03-02T10:01:35\"\
  }\n代码清单 7-19\n数据去重示例的样本数据\n```\n\n为了模拟数据去重，首先在 `<path>/chapter7/data` 目录下创建一个名为\
  \ `input` 的目录。然后运行代码清单 7-20 中的代码。下一步是将 `file1.json` 文件复制到 `input` 目录并检查输出。最后一步是将\
  \ `file2.json` 文件复制到 `input` 目录并检查输出。\n\n```\nimport org.apache.spark.sql.types._\n\
  import org.apache.spark.sql.functions._\nval mobileDataSchema = new StructType().add(\"\
  id\", StringType, false)\n.add(\"action\", StringType, false)\n.add(\"ts\", TimestampType,\
  \ false)\n// mobileDataSchema 在前一个示例中定义\nval mobileDupSSDF = spark.readStream.schema(mobileDataSchema)\n\
