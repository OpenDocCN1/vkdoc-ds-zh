  |        1|   9350| 583249| {\"timestamp\":\"2018-03-25T09:53:52.582-07:00\",\"\
  value\":583249}|\n|        1|   9351| 583250| {\"timestamp\":\"2018-03-25T09:53:52.682-07:00\"\
  ,\"value\":583250}|\n|        1|   9352| 583251| {\"timestamp\":\"2018-03-25T09:53:52.782-07:00\"\
  ,\"value\":583251}|\n|        1|   9353| 583256| {\"timestamp\":\"2018-03-25T09:53:53.282-07:00\"\
  ,\"value\":583256}|\n|        1|   9354| 583261| {\"timestamp\":\"2018-03-25T09:53:53.782-07:00\"\
  ,\"value\":583261}|\n|        1|   9355| 583266| {\"timestamp\":\"2018-03-25T09:53:54.282-07:00\"\
  ,\"value\":583266}|\n|        1|   9356| 583267| {\"timestamp\":\"2018-03-25T09:53:54.382-07:00\"\
  ,\"value\":583267}|\n|        1|   9357| 583274| {\"timestamp\":\"2018-03-25T09:53:55.082-07:00\"\
