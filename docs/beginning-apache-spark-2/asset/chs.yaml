  与 `collect` 操作类似，此操作会将整个数据集以映射形式带回驱动程序端，其中每个条目代表一行。示例见清单 3-62，输出见清单 3-63。


  ```

  val candyTx = sc.parallelize(List(("candy1", 5.2), ("candy2", 3.5), ("candy1", 2.0),
  ("candy3", 6.0)))

  candyTx.collectAsMap()

