  #### 使用原始数据框


  连接后的数据框会记住在连接过程中哪些列来自哪个原始数据框。为了消除特定列来自哪个数据框的歧义，你可以告诉 Spark 用其原始数据框名称作为前缀。请参阅清单 5-31
