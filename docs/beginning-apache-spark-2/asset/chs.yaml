  对于生产环境且长时间运行的流式应用程序，有必要调用 `StreamingQuery.awaitTermination()` 函数，这是一个阻塞调用，用于防止驱动程序进程退出，并让流式查询持续运行，处理数据源中新到达的数据。


  在学习并尝试 Structured Streaming 时，有时你可能希望停止流式查询以更改输出模式、触发器或其他配置。你可以使用 `StreamingQuery.stop()`
  函数来阻止数据源接收新数据，并停止流式查询中逻辑的持续执行。有关管理流式查询的示例，请参见清单 6-9。


