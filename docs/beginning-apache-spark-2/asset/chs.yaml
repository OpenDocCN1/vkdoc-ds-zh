- '# 1. Apache Spark 简介


  现在学习 Spark 正是最佳时机。Spark 因其易用性、速度和灵活性，已成为大数据堆栈中的关键组件之一。这个可扩展的数据处理系统正被众多小型和大型公司广泛采用，包括
  Facebook、Microsoft、Netflix 和 LinkedIn。本章提供 Spark 的高级概述，包括核心概念、架构以及 Apache Spark
  堆栈中的各种组件。


  ### 概述


  Spark 是一个通用的分布式数据处理引擎，专为速度、易用性和灵活性而设计。这三项特性的结合使得 Spark 在业界如此受欢迎并被广泛采用。


  Apache Spark 网站声称，它运行某些数据处理作业的速度比 Hadoop MapReduce 快 100 倍。事实上，在 2014 年，Spark 赢得了
  Daytona GraySort 竞赛，这是对 100TB 数据（一万亿条记录）进行排序的行业基准测试。Databricks 提交的结果声称，Spark 能够以比
  Hadoop MapReduce 之前保持的世界纪录快三倍的速度、使用少十倍的资源对 100TB 数据进行排序。


  自 Spark 项目启动以来，易用性一直是 Spark 创建者的主要关注点之一。它提供了 80 多个高级、常用的数据处理操作符，使开发人员、数据科学家和数据分析师能够轻松构建各种有趣的数据应用程序。此外，这些操作符支持多种语言，即
  Scala、Java、Python 和 R。软件工程师、数据科学家和数据分析师可以选择他们喜欢的语言，使用 Spark 解决大规模数据处理问题。


  在灵活性方面，Spark 提供了一个单一统一的数据处理堆栈，可用于解决多种类型的数据处理工作负载，包括批处理、交互式查询、机器学习算法所需的迭代处理，以及用于近乎实时提取可操作洞察的实时流处理。在
  Spark 出现之前，每种类型的工作负载都需要不同的解决方案和技术。现在，公司可以仅利用 Spark 来满足其大部分数据处理需求。使用单一技术堆栈将有助于大幅降低运营成本和资源。


  大数据生态系统由多种技术组成，包括名为 HDFS 的分布式存储引擎、用于高效管理机器集群的集群管理系统，以及用于以二进制和列式格式高效存储大量数据的不同文件格式。Spark
  与大数据生态系统集成得非常好。这是 Spark 采用率快速增长的另一原因。


  关于 Spark 的另一件很酷的事情是它是开源的；因此，任何人都可以下载源代码来检查代码，了解某个功能是如何实现的，或扩展其功能。在某些情况下，这可以极大地帮助减少调试问题的时间。


  ## 历史


  Spark 最初是 2009 年 Berkeley AMPLab 的一个研究项目。当时，该项目的研究人员观察到 Hadoop MapReduce 框架在处理交互式和迭代式数据处理用例时的低效性，因此他们通过引入诸如内存计算和高效处理故障恢复等想法，提出了克服这些低效性的方法。一旦这个研究项目被证明是一个优于
  MapReduce 的可行解决方案，它就在 2010 年开源，并于 2013 年成为 Apache 顶级项目。从事该研究项目的一组研究人员共同创立了一家名为 Databricks
  的公司；他们在 2013 年筹集了超过 4300 万美元。Databricks 是 Spark 背后的主要商业管理者。2015 年，IBM 宣布重大投资，建立一个
  Spark 技术中心，通过与开源社区密切合作，将 Spark 构建到其公司分析和商业平台的核心，以推进 Apache Spark。


  关于 Spark 的两篇热门研究论文是《Spark：使用工作集的集群计算》和《弹性分布式数据集：面向内存集群计算的容错抽象》。这些论文在学术会议上广受好评，并为任何想要学习和理解
  Spark 的人提供了良好的基础。你可以分别在 [`http://people.csail.mit.edu/matei/papers/2010/hotcloud_spark.pdf`](http://people.csail.mit.edu/matei/papers/2010/hotcloud_spark.pdf)
  和 [`http://people.csail.mit.edu/matei/papers/2012/nsdi_spark.pdf`](http://people.csail.mit.edu/matei/papers/2012/nsdi_spark.pdf)
  找到它们。


  自成立以来，Spark 开源项目一直是一个活跃的项目，拥有充满活力的社区。贡献者数量在 2016 年增加到超过 1000 人，并且有超过 20 万个 Apache
  Spark 聚会。事实上，Apache Spark 的贡献者数量已经超过了最流行的开源项目之一 Apache Hadoop 的贡献者数量。Spark 现在非常流行，以至于它有自己的峰会，称为
  Spark Summit，每年在北美和欧洲举行。自成立以来，峰会的参会人数每年翻一番。


  Spark 的创建者选择 Scala 编程语言用于他们的项目，是因为 Scala 兼具简洁性和静态类型。现在，Spark 被认为是使用 Scala 编写的最大的应用程序之一，它的流行无疑帮助
  Scala 成为主流编程语言。




