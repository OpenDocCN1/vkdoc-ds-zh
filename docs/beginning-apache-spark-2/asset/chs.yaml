  这些创建 DataFrame 的有趣方式使得学习和使用 DataFrame API 变得容易，而无需从外部文件加载数据。然而，当你开始使用大型数据集进行严肃的数据分析时，了解如何从外部数据源加载数据就变得至关重要，这将在下一部分中介绍。




