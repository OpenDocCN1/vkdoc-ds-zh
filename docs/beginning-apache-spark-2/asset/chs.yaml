  ### `join(otherRDD)`


  进行任何有意义的数据分析通常都涉及连接两个或多个数据集。`join` 转换用于合并两个数据集的信息，以实现丰富的数据分析或提取洞察。例如，如果一个数据集包含交易信息，其中包含会员
  ID 和交易详情，而另一个数据集包含会员信息，那么通过连接这两个数据集，你可以回答诸如：按年龄组划分的交易分布情况如何，以及哪个年龄组的交易数量最多？


  通过连接类型为 `(K,V)` 和 `(K,W)` 的数据集，连接后的数据集结果为 `(K,(V,W))`。连接两个数据集有几种变体，例如左外连接和右外连接。关于这些连接类型行为的更多详细信息，请参考
  [`https://en.wikipedia.org/wiki/Join_(SQL)`](https://en.wikipedia.org/wiki/Join_(SQL))。


  清单 3-58 中的示例有两个已设置为键/值对 RDD 的数据集。第一个包含会员交易信息。第二个包含每个会员 ID 的信息以及每个会员所属的组。


  ```

  val memberTx = sc.parallelize(List((110, 50.35), (127, 305.2), (126, 211.0),

  (105, 6.0),(165, 31.0), (110, 40.11)))

  val memberInfo = sc.parallelize(List((110, "a"), (127, "b"), (126, "b"), (105, "a"),(165,
  "c")))

  val memberTxInfo = memberTx.join(memberInfo)

  memberTxInfo.collect().foreach(println)

  清单 3-58

  会员交易数据集与会员组数据集的连接

  ```


  清单 3-58 中的连接是内连接类型，输出仅包含两个数据集中键匹配的行。输出见清单 3-59。


  ```

  (105,(6.0,a))

  (165,(31.0,c))

  (110,(50.35,a))

  (110,(40.11,a))

  (126,(211.0,b))

  (127,(305.2,b))

  清单 3-59

  连接转换的输出

  ```


  ### 键/值对 RDD 操作


  除了表 3-5 中列出的操作外，对 RDD 还有一小部分操作。本节将提供这些操作的一些详细信息和实际示例。这些操作会将结果带回驱动程序端，因此请注意带回的数据量。


  **表 3-5** 对 RDD 的操作


  | 名称 | 描述 |

  | --- | --- |

  | `countByKey()` | 返回一个映射，其中每个条目包含键和值的计数 |

  | `collectAsMap()` | 行为与 `collect` 操作类似；返回类型是一个映射 |

  | `lookup(key)` | 按键执行查找，并返回所有具有相同指定键的值 |


  以下部分为表 3-5 中列出的每个操作提供了一个示例。


  #### `countByKey()`


  对于给定的对 RDD，此操作会忽略每行的值，仅向驱动程序报告每个键具有相同键的值的数量。示例见清单 3-60，输出见清单 3-61。注意返回的数据是 Scala
  映射数据结构。


