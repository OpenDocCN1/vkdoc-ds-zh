  ,\"value\":583275}|\n|        1|   9359| 583276| {\"timestamp\":\"2018-03-25T09:53:55.282-07:00\"\
  ,\"value\":583276}|\n+--------+-------+------+--------------------------------------------------------+\n\
  ```\n\n**清单 6-26** 来自 Kafka 的数据示例\n\n### 使用 Foreach 数据接收器\n\n与 Structure Streaming\
  \ 提供的其他内置数据接收器相比，Foreach 数据接收器是一个有趣的接收器，因为它在数据写入方式、写入时间以及写入位置方面提供了完全的灵活性。事实上，它被设计成一个可扩展且可插拔的数据接收器。这种灵活性和可扩展性也伴随着责任，因为在使用此数据接收器时，您需要负责写入数据的逻辑。此数据接收器对您施加的约定是\
  \ `ForeachWriter` 抽象类（`https://spark.apache.org/docs/latest/api/scala/index.html#org.apache.spark.sql.ForeachWriter`）。由于此抽象类是用\
  \ Scala 编写的，这意味着目前此数据接收器仅适用于 Scala 和 Java。简而言之，您需要提供 `ForeachWriter` 的实现，它由三个方法组成：`open`、`process`\
  \ 和 `close`。每当触发器生成输出行列表时，就会调用这些方法。使用此数据接收器需要了解 Spark 如何工作的一些内部细节，以及双方之间的交互和各自的责任。\n\
  \n- `ForeachWriter` 抽象类实现的一个实例将在驱动程序端创建，并发送到 Spark 集群中的执行器上执行。这有两个含义。首先，`ForeachWriter`\
  \ 的实现必须是可序列化的；否则，其实例无法通过网络传输到执行器。其次，如果在创建实现期间有任何初始化操作，它们将在驱动程序端发生。因此，如果您想打开数据库连接或套接字连接，这不应在类初始化期间发生，而应在其他地方进行。\n\
  \n- 流式 DataFrame 中的分区数决定了将创建多少个 `ForeachWriter` 实现的实例。这与 `Dataset.foreachPartition`\
  \ 方法的行为类似。\n\n- `ForeachWriter` 抽象类中定义的三个方法将在执行器上被调用。\n\n- 执行初始化（例如打开数据库连接或套接字连接）的最佳位置是在\
  \ `open` 方法中。但是，每次有数据要写入时都会调用 `open` 方法；因此，该逻辑必须智能且高效。\n\n- `open` 方法签名有两个输入参数：分区\
  \ ID 和版本。返回类型是 Boolean。这两个参数的组合唯一地表示一组需要写入的行。版本的值是一个单调递增的 ID，每次触发都会增加。基于分区 ID 和版本参数的值，`open`\
  \ 方法需要决定是否需要写入行序列，并向 Structure Streaming 引擎返回适当的布尔值。\n\n- 如果 `open` 方法返回 `true`，则对于触发器输出的每一行，都会调用\
  \ `process` 方法。\n\n- 每当调用 `open` 方法时，无论其返回值如何，都会调用 `close` 方法。如果在调用 `process` 方法期间发生错误，该错误将被传递到\
  \ `close` 方法中。调用 `close` 方法的目的是让您有机会清理在调用 `open` 或 `process` 方法期间创建的任何必要状态。唯一不调用\
  \ `close` 方法的情况是执行器的 JVM 崩溃或 `open` 方法抛出 `Throwable` 异常。\n\n\n\n简而言之，该数据接收器为您提供了将流式\
  \ DataFrame 数据写出时的终极灵活性。清单 6-27 中的示例代码包含一个 `ForeachWriter` 抽象类的简单实现，该实现通过将 `Rate`\
  \ 数据源的数据写出到控制台来完成。\n\n```\n// 定义 ForeachWriter 抽象类的一个实现\nimport org.apache.spark.sql.{ForeachWriter,Row}\n\
  class ConsoleWriter(private var pId:Long = 0, private var ver:Long = 0) extends\
  \ ForeachWriter[Row] {\ndef open(partitionId: Long, version: Long): Boolean = {\n\
  pId = partitionId\nver = version\nprintln(s\"open => ($partitionId, $version)\"\
  )\ntrue\n}\ndef process(row: Row) = {\nprintln(s\"writing => $row\")\n}\ndef close(errorOrNull:\
  \ Throwable): Unit = {\nprintln(s\"close => ($pId, $ver)\")\n}\n}\n// 设置 Rate 数据源\n\
  val ratesSourceDF = spark.readStream.format(\"rate\")\n.option(\"rowsPerSecond\"\
  ,\"10\")\n.option(\"numPartitions\",\"2\")\n.load()\n// 设置 Foreach 数据接收器\nval rateSQ\
  \ = ratesSourceDF.writeStream.foreach(new ConsoleWriter).start()\n// 控制台输出示例\nopen\
  \ => (1, 1)\nwriting => [2018-03-25 13:03:41.867,5]\nwriting => [2018-03-25 13:03:41.367,0]\n\
  writing => [2018-03-25 13:03:41.967,6]\nwriting => [2018-03-25 13:03:41.467,1]\n\
  writing => [2018-03-25 13:03:42.067,7]\nwriting => [2018-03-25 13:03:41.567,2]\n\
  writing => [2018-03-25 13:03:42.167,8]\nwriting => [2018-03-25 13:03:41.667,3]\n\
  writing => [2018-03-25 13:03:42.267,9]\nclose => (1, 1)\n// 关闭 rateSQ 流式查询\nrateSQ.stop\n\
  清单 6-27\n使用 Foreach 数据接收器的示例代码\n```\n\n### 使用 Console 数据接收器\n\n该数据接收器使用起来非常简单，并且它的功能正如其名。它不是一个容错的数据接收器，设计用于调试目的或学习\
  \ Structured Streaming 时使用。它只有两个选项：要显示的行数，以及如果输出过长是否截断。每个选项都有一个默认值，如表 6-8 所示。该数据接收器的底层实现使用与\
  \ `DataFrame.show` 方法相同的逻辑来显示流式 DataFrame 中的数据。\n\n**表 6-8** Console 数据接收器的选项\n\n\
  | 选项 | 默认值 | 描述 |\n| --- | --- | --- |\n| `numRows` | 20 | 打印到控制台的行数 |\n| `truncate`\
  \ | true | 当每列内容长度超过 20 个字符时是否截断 |\n\n清单 6-28 中的示例展示了 Console 数据接收器的实际使用，并且没有使用前述选项的默认值。\n\
  \n```\n// 设置数据源\nval ratesDF = spark.readStream.format(\"rate\")\n.option(\"rowsPerSecond\"\
  ,\"10\")\n.option(\"numPartitions\",\"2\")\n.load()\nVal ratesSQ = ratesDF.writeStream.outputMode(\"\
  append\")\n.format(\"console\")\n.option(\"truncate\",false)\n.option(\"numRows\"\
  ,50)\n.start()\n清单 6-28\n使用 Console 数据接收器的示例代码\n```\n\n### 使用 Memory 数据接收器\n\n与\
  \ Console 数据接收器类似，该数据接收器易于理解和使用。事实上，它之所以如此简单，是因为它没有任何需要配置的选项。它不是一个容错的数据接收器，设计用于调试目的或学习\
  \ Structured Streaming 时使用。它收集的数据被发送到驱动程序，并作为内存表存储在驱动程序中。换句话说，您可以发送到 Memory 数据接收器的数据量受限于驱动程序\
  \ JVM 的内存量。您可能会想，数据在内存中，如何查询和查看它呢？在设置此数据接收器时，您可以指定一个查询名称作为 `DataStreamWriter.queryName`\
  \ 函数的参数，然后您就可以针对该内存表发出 SQL 查询。与 Console 数据接收器不同，一旦数据被发送到内存表，您就可以使用 Spark SQL 组件中几乎所有可用的功能来进一步分析或处理数据。如果数据量很大且无法放入内存，那么次优选择是使用\
  \ File 数据接收器将数据以 Parquet 格式写出。\n\n清单 6-29 中的示例代码将 Rate 数据源的数据写入一个内存表，然后您对其发出查询。\n\
  \n```\nval ratesDF  = spark.readStream.format(\"rate\")\n.option(\"rowsPerSecond\"\
  ,\"10\")\n.option(\"numPartitions\",\"2\")\n.load()\n// 将数据写出到 Memory 数据接收器，内存表名为\
  \ \"rates\"\nval ratesSQ = ratesDF.writeStream.outputMode(\"append\")\n.format(\"\
  memory\")\n.queryName(\"rates\").start()\n// 我们对 \"rates\" 内存表发出 SQL 查询\nspark.sql(\"\
  select * from rates\").show(10,false)\n+------------------------+------+\n|    \
  \           timestamp| value|\n+------------------------+------+\n| 2018-03-25 14:02:59.461|\
  \     0|\n| 2018-03-25 14:02:59.561|     1|\n| 2018-03-25 14:02:59.661|     2|\n\
  | 2018-03-25 14:02:59.761|     3|\n| 2018-03-25 14:02:59.861|     4|\n| 2018-03-25\
  \ 14:02:59.961|     5|\n| 2018-03-25 14:03:00.061|     6|\n| 2018-03-25 14:03:00.161|\
  \     7|\n| 2018-03-25 14:03:00.261|     8|\n| 2018-03-25 14:03:00.361|     9|\n\
  +------------------------+------+\n// 统计 \"rates\" 内存表中的行数\nspark.sql(\"select count(*)\
  \ from rates\").show\n+---------+\n| count(1)|\n+---------+\n|      100|\n+---------+\n\
  // 停止 ratesSQ 查询流\nratesSQ.stop\n清单 6-29\n使用 Memory 数据接收器的示例代码\n```\n\n需要注意的一点是，即使流式查询\
  \ `ratesSQ` 停止后，内存中的 `rates` 表仍然存在。但是，一旦启动了一个同名的新流式查询，内存中的数据就会被截断。\n\n在离开本节之前，了解每种类型的数据接收器支持哪些输出非常重要。表\
  \ 6-9 提供了一个快速参考汇总表。关于输出模式的详细信息将在下一节中介绍。\n\n**表 6-9** 数据接收器及其支持的输出模式\n\n| 接收器 | 支持的输出模式\
  \ | 备注 |\n| --- | --- | --- |\n| File | Append | 仅支持写出新行，不支持更新 |\n| Kafka | Append,\
  \ Update, Complete |  |\n| Foreach | Append, Update, Complete | 取决于 `ForeachWriter`\
  \ 的实现 |\n| Console | Append, Update, Complete |  |\n| Memory | Append, Complete\
  \ | 不支持原地更新 |\n\n\n\n### 深入探讨输出模式\n\n前面的“输出模式”部分对每种输出模式进行了基本描述。本节将提供更多关于它们的详细信息，以及如何理解哪种输出模式适用于哪种流式查询类型。\n\
  \n广义上讲，有两种类型的流式查询。第一种类型称为*无状态类型*，它仅对传入的流式数据执行基本转换，然后将数据写出到数据接收器。第二种类型称为*有状态类型*，它需要维护一定量的状态，无论这种维护是隐式的还是显式的。有状态类型通常执行某种聚合，或使用诸如\
  \ `mapGroupsWithState` 或 `flatMapGroupsWithState` 之类的结构化流式处理 API 来维护特定用例所需的任意状态，例如，维护用户会话数据。\n\
  \n让我们从简单的无状态流式查询类型开始。这种流式查询的一个典型用例是实时流式 ETL，它持续读取实时流式数据，例如由在线服务持续生成的页面浏览事件，以捕获哪些用户正在查看哪些页面。在这种用例中，它通常执行以下操作：\n\
  \n- 过滤、转换和清理\n    - 真实世界的数据是杂乱且不干净的，其结构可能不太适合重复分析。\n- 转换为更高效的存储格式\n    - 诸如 CSV\
  \ 和 JSON 之类的文本文件格式是人类可读的，但对于重复分析来说效率低下，尤其是在数据量很大（例如数百 TB）的情况下。通常使用更高效的二进制格式，如 ORC、Parquet\
  \ 或 Avro，以减少文件大小并提高分析速度。\n- 按特定列对数据进行分区\n    - 在将数据写出到数据接收器时，可以根据常用列的值对数据进行分区，以加快组织内各个团队的重复分析速度。\n\
  \n如您所见，前面的任务不需要流式查询在将数据写出到数据接收器之前维护任何状态。随着新数据的到来，它会被清理、转换，可能还会重组，并立即写出。因此，这种无状态流式类型唯一适用的输出模式是\
  \ Append。Complete 输出模式不适用，因为这将要求结构化流式处理维护所有先前的数据，这可能过于庞大而无法维护。Update 输出模式不适用，因为只有新数据被写出。然而，当这种输出模式用于无状态流式查询时，结构化流式处理会识别到这一点，并将其视为与\
  \ Append 输出模式相同。很酷的一点是，当为流式查询使用了不合适的输出模式时，结构化流式处理引擎会通知您。清单 6-30 展示了使用不合适的输出模式时会发生什么。\n\
  \n```\nval ratesDF  = spark.readStream.format(\"rate\")\n.option(\"rowsPerSecond\"\
  ,\"10\")\n.option(\"numPartitions\",\"2\")\n.load()\n// 简单转换\nval ratesOddEvenDF\
  \ = ratesDF.withColumn(\"even_odd\", $\"value\" % 2 === 0)\n// 使用 complete 输出模式写出到\
  \ Console 数据接收器\nval ratesSQ = ratesOddEvenDF.writeStream.outputMode(\"complete\"\
  )\n.format(\"console\")\n.option(\"truncate\",false)\n.option(\"numRows\",50)\n\
  .start()\n// 结构化流式处理在分析阶段抛出的异常\norg.apache.spark.sql.AnalysisException: Complete\
  \ output mode not supported when there are no streaming aggregations on streaming\
  \ DataFrames/Datasets;\n清单 6-30\n对无状态流式查询使用 Complete 输出模式\n```\n\n现在让我们继续讨论有状态流式查询类型。当有状态流式查询通过\
  \ `groupBy` 转换执行聚合时，该聚合的状态由结构化流式处理引擎隐式维护。随着更多数据的到来，新数据上的聚合结果会被更新到结果表中。在每个触发点，根据输出模式的不同，要么是更新后的数据，要么是结果表中的所有数据，会被写出到数据接收器。这意味着使用\
  \ Append 输出模式是不合适的，因为这违反了该输出模式的语义，该语义规定只有追加到结果表中的新行才会被发送到指定的输出接收器。换句话说，对于由结构化流式处理引擎隐式维护聚合状态的有状态查询类型，只有\
  \ Complete 和 Update 输出模式是合适的。使用 Complete 输出模式的流式查询的输出总是等于或大于使用 Update 输出模式的同一流式查询的输出。清单\
  \ 6-31 包含说明输出差异的代码。\n\n```\n// import 语句\nimport org.apache.spark.sql.types._\n\
  import org.apache.spark.sql.functions._\nval mobileDataSchema = new StructType().add(\"\
  id\", StringType, false)\n.add(\"action\", StringType, false)\n.add(\"ts\", TimestampType,\
  \ false)\nval mobileDF = spark.readStream.schema(mobileDataSchema)\n.json(\"/chapter6/data/input\"\
  )\nval actionCountDF = mobileDF.groupBy($\"action\").count\nval completeModeSQ =\
  \ actionCountDF.writeStream.format(\"console\")\n.option(\"truncate\", \"false\"\
  )\n.outputMode(\"complete\").start()\nval updateModeSQ = actionCountDF.writeStream.format(\"\
  console\")\n.option(\"truncate\", \"false\")\n.outputMode(\"complete\").start()\n\
  // 此时将 file1.json, file2.json, file3.json 和 newaction.json 从\n// mobile 目录复制到 input\
  \ 目录\n// 使用 complete 模式的流式查询的输出如下\n\nBatch: 3\n\n+-------+------+\n| action| count|\n\
  +-------+------+\n|  close|     3|\n|  swipe|     1|\n|  crash|     1|\n|   open|\
  \     5|\n+-------+------+\n// 使用 update 模式的流式查询的输出如下\n\nBatch: 3\n\n+-------+------+\n\
  | action| count|\n+-------+------+\n|  swipe|     1|\n|  crash|     1|\n+-------+------+\n\
  清单 6-31\nUpdate 和 Complete 模式之间的输出差异\n```\n\n前面使用 Complete 输出模式的流式查询的输出包含了结果表中的所有操作类型。前面使用\
  \ Update 输出模式的流式查询的输出仅包含了结果表之前未见过的 `newaction.json` 文件中的操作。\n\n同样，如果为有状态查询类型使用了不合适的输出模式，结构化流式处理引擎会通知您，如清单\
  \ 6-32 所示。\n\n```\n// 为有状态流式查询使用不合适的输出模式，请参见下面的异常\nval actionCountSQ = actionCountDF.writeStream.format(\"\
  console\").outputMode(\"append\").start()\norg.apache.spark.sql.AnalysisException:\
  \ Append output mode not supported when there are streaming aggregations on streaming\
  \ DataFrames/DataSets without watermark;\n清单 6-32\n对有状态流式查询使用不合适的 Append 输出模式\n\
  ```\n\n前面的逻辑有一个例外。如果为带有聚合的有状态流式查询提供了水印，那么所有输出模式都是适用的。Append 输出的语义不再被违反的原因是，结构化流式处理引擎会丢弃早于指定水印的旧聚合状态数据，这意味着一旦越过水印，新行就可以被添加到结果表中。\n\
  \n\n\n毫无疑问，输出模式是 Structured Streaming 中最难理解的概念之一，因为需要综合考虑多个维度才能确定哪些输出模式适合使用。Structured\
  \ Streaming 编程指南提供了一个兼容性矩阵，可在 [`https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html#output-modes`](https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html#output-modes)\
  \ 找到。\n\n### 深入探讨触发器\n\n触发器设置决定了 Structured Streaming 引擎何时执行流式查询中表达的流式计算逻辑，该逻辑包括所有转换操作以及将数据写入数据接收器。另一种理解方式是，触发器设置控制数据何时写入数据接收器，以及使用哪种处理模式。从\
  \ Spark 2.3 开始，引入了一种名为 Continuous 的新处理模式。\n\n“触发器类型”部分描述了 Structured Streaming 支持的触发器类型。本节将更详细地介绍，并提供指定不同触发器类型的示例代码。\n\
  \n到目前为止，所有流式查询示例都使用了默认触发器类型，因为没有指定触发器类型。这种默认触发器类型选择微批模式作为处理模式，流式查询中的逻辑不是基于时间执行，而是在上一批数据处理完成后立即执行。这意味着数据写入的频率可预测性较低。\n\
  \n如果需要更高的可预测性，则可以指定固定间隔触发器，使流式查询中的逻辑根据用户提供的间隔（例如每 30 秒）在特定时间间隔执行。在处理模式方面，此触发器类型使用微批模式。间隔可以以字符串格式或\
  \ Scala `Duration` 或 Java `TimeUnit` 指定。清单 6-33 包含了使用固定间隔触发器的示例。\n\n```\nimport\
  \ org.apache.spark.sql.streaming.Trigger\n// 设置每秒 3 行\nval ratesDF  = spark.readStream.format(\"\
  rate\")\n.option(\"rowsPerSecond\",\"3\")\n.option(\"numPartitions\",\"2\")\n.load()\n\
  // 每 3 秒触发一次流式查询执行并输出到控制台\nval ratesSQ = ratesDF.writeStream.outputMode(\"append\"\
  )\n.format(\"console\")\n.option(\"numRows\",50)\n.option(\"truncate\",false)\n\
  .trigger(Trigger.ProcessingTime(\"3 seconds\"))\n.start()\n// 我们预计每 3 秒会看到大约 9 行\n\
  +-----------------------+---------+\n|              timestamp|    value|\n+-----------------------+---------+\n\
  |2018-03-26 07:14:11.176|        0|\n|2018-03-26 07:14:11.509|        1|\n|2018-03-26\
  \ 07:14:11.843|        2|\n|2018-03-26 07:14:12.176|        3|\n|2018-03-26 07:14:12.509|\
  \        4|\n|2018-03-26 07:14:12.843|        5|\n|2018-03-26 07:14:13.176|    \
  \    6|\n|2018-03-26 07:14:13.509|        7|\n|2018-03-26 07:14:13.843|        8|\n\
  +-----------------------+---------+\n// 使用 Scala Duration 类型指定间隔\nimport scala.concurrent.duration._\n\
  val ratesSQ = ratesDF.writeStream.outputMode(\"append\")\n.format(\"console\")\n\
  .option(\"numRows\",50)\n.option(\"truncate\",false)\n.trigger(Trigger.ProcessingTime(3.seconds))\n\
  .start()\n清单 6-33\n使用固定间隔触发器类型的示例\n```\n\n固定间隔触发器并不总能保证流式查询的执行恰好发生在每个用户指定的间隔。这有两个原因。第一个原因相当明显：如果没有数据到达进行处理，那么就没有什么可处理的，因此也不会向数据接收器写入任何内容。第二个原因是，当上一批的处理时间超过间隔时，流式查询的下一次执行将在处理完成后立即开始。换句话说，它不会等待下一个间隔边界。\n\
  \n一次性触发器顾名思义。它以微批模式执行流式查询中的逻辑，将数据写入数据接收器一次，然后处理停止。这种触发器类型的存在可能听起来有点傻；然而，它在开发和生成环境中都很有用。在开发阶段，流式计算逻辑通常以迭代方式开发，每次迭代你都希望测试逻辑。这种触发器类型稍微简化了开发-测试迭代。对于生成环境，此触发器类型适用于传入流数据量较低的使用场景，因此每天只需运行数据处理逻辑几次。无需启动\
  \ Spark 集群并让其一直运行，启动 Spark 并执行一次流式处理逻辑的频率基于该特定使用场景所需的处理频率。指定这种一次性触发器类型非常简单，清单 6-34\
  \ 展示了如何操作。\n\n```\nimport org.apache.spark.sql.streaming.Trigger\nval mobileSQ =\
  \  mobileDF.writeStream.outputMode(\"append\")\n.format(\"console\")\n.trigger(Trigger.Once())\n\
  .start()\n清单 6-34\n使用一次性触发器类型的示例\n```\n\n最后一种触发器类型称为连续触发器类型。这种令人兴奋且实验性的新处理模式是在 Spark\
  \ 2.3 中引入的，用于满足需要端到端毫秒级延迟的使用场景。在这种新的处理模式下，Structured Streaming 会启动长时间运行的任务，持续读取、处理数据并将其写入数据接收器。这意味着传入的数据一旦到达数据源就会被处理并写入数据接收器，端到端延迟仅为几毫秒。此外，还引入了一种异步检查点机制，用于记录流式查询的进度，以避免中断长时间运行的任务，从而提供一致的毫秒级延迟。利用这种连续触发器类型的一个很好的使用场景是信用卡欺诈交易检测。在高层面上，Structured\
  \ Streaming 引擎根据触发器类型确定使用哪种处理模式，如图 6-10 所示。\n\n![../images/419951_1_En_6_Chapter/419951_1_En_6_Fig10_HTML.jpg](img/419951_1_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10\n\nStructured Streaming 支持两种不同的处理模式\n\n截至 Spark 2.3，连续处理模式仅允许投影和选择操作，例如\
  \ `select`、`where`、`map`、`flatmap` 和 `filter`。在此处理模式下，除聚合函数外，所有 Spark SQL 函数都受支持。\n\
  \n要为流式查询使用连续处理模式，你只需像清单 6-35 中那样指定一个带有所需检查点间隔的连续触发器。\n\n```\nimport org.apache.spark.sql.streaming.Trigger\n\
  // 设置一个包含两个分区的 Rate 数据源\nval ratesDF  = spark.readStream.format(\"rate\")\n.option(\"\
  numPartitions\",\"2\").load()\n// 将数据输出到控制台，并使用间隔为 2 秒的连续触发器来写入进度\nval rateSQ =\
  \ ratesDF.writeStream.format(\"console\")\n.trigger(Trigger.Continuous(\"2 second\"\
  ))\n.start()\n// 控制台输出示例\n+--------------------+------+\n|           timestamp|\
  \ value|\n+--------------------+------+\n|2018-03-26 21:43:...|     0|\n|2018-03-26\
  \ 21:43:...|     2|\n|2018-03-26 21:43:...|     4|\n|2018-03-26 21:43:...|     6|\n\
  |2018-03-26 21:43:...|     1|\n|2018-03-26 21:43:...|     3|\n|2018-03-26 21:43:...|\
  \     5|\n|2018-03-26 21:43:...|     7|\n+--------------------+------+\n清单 6-35\n\
  指定连续触发器类型的示例\n```\n\n\n\n`ratesDF`流式 DataFrame 被设置为两个分区；因此，Structured Streaming\
  \ 在连续处理模式下启动了两个运行中的任务，这就是输出中所有偶数一起出现、所有奇数一起出现的原因。\n\n## 总结\n\nStructured Streaming\
  \ 是 Apache Spark 的第二代流处理引擎。它提供了一种简单的方法来构建和推理具有容错性和可扩展性的流式应用程序。本章涵盖了大量内容，包括流处理领域的核心概念以及\
  \ Structured Streaming 的核心部分。\n\n- 流处理是一个令人兴奋的领域，可以帮助解决大数据时代许多新的、有趣的用例。\n- 由于无界数据的本质以及数据到达速率和乱序数据的不可预测性，构建生产级流式数据应用程序比构建批处理数据应用程序更具挑战性。\n\
  - 要高效地构建流式数据应用程序，你必须熟练掌握流处理领域的三个核心概念：数据交付语义、时间概念和窗口操作。\n- 流处理引擎在过去几年中取得了巨大且显著的成熟，现在有许多选择。流行的有\
  \ Apache Flink、Apache Samza、Apache Kafka 和 Apache Spark。\n- Spark DStream 是 Apache\
  \ Spark 的第一代流处理引擎，它构建在 RDD 编程模型之上。\n- Structured Streaming 处理引擎旨在让开发者能够构建端到端的流式应用程序，这些应用程序可以使用基于\
  \ Spark SQL 引擎优化且稳固基础构建的简单编程模型，实时响应数据。\n- Structured Streaming 的独特之处在于将流式数据视为一个无界的输入表，当新数据到达时，将其视为一组新行追加到输入表中。\n\
  - 流式查询的核心组件包括数据源、流式操作、输出模式、触发器和数据接收器。\n- Structured Streaming 提供了一组内置的数据源和数据接收器。内置数据源包括\
  \ File、Kafka、Socket 和 Rate。内置数据接收器包括 File、Kafka、Console 和 Memory。\n- 输出模式决定了数据如何输出到数据接收器，有三种选项：Append、Update\
  \ 和 Complete。\n- 触发器是 Structured Streaming 引擎用来决定何时运行流式计算的一种机制。有几种选项可供选择：微批处理、固定间隔微批处理、一次性微批处理和连续处理。最后一种适用于需要毫秒级延迟的用例，在\
  \ Spark 2.3 中仍处于实验状态。\n\n"
- "# 7. Spark Streaming（进阶）\n\n前一章介绍了流处理的核心概念、Spark Structured Streaming 处理引擎提供的功能，以及构建流式应用程序的基本步骤。现实世界中的流式应用程序通常需要从大规模传入的实时数据中提取洞察或模式，并将这些信息馈送到下游应用程序以做出业务决策，或将其保存在某个存储系统中以供进一步分析或可视化。现实世界流式应用程序的另一个方面是，它们需要持续运行以处理实时到达的数据。因此，它们必须能够抵御故障。本章前半部分涵盖了\
  \ Structured Streaming 中的事件时间处理和状态处理功能，以及它们如何帮助从传入的实时数据中提取洞察或模式。本章后半部分解释了 Structured\
  \ Streaming 提供的支持，以帮助流式应用程序实现容错，并监控流式应用程序的状态和进度。\n\n## 事件时间\n\n基于数据创建时间处理传入实时数据的能力，是任何严肃流处理引擎必备的功能。这一点很重要，因为要真正理解并从流式数据中准确提取洞察或模式，你需要能够根据数据或事件发生的时间（而非处理时间）来处理它们。通常，事件时间处理是在某种聚合的上下文中进行的，这包括事件时间以及关于该事件的零个或多个附加信息。\n\
  \n让我们以第 6 章中描述的移动操作事件为例。你可以将聚合应用于时间窗口（可以是固定窗口或滑动窗口类型，如第 6 章所述），而不是仅按操作类型进行聚合。此外，你可以轻松地将操作类型添加到分组键中，以按时间桶和操作类型进一步对移动操作事件进行分组。\n\
  \n以下示例将处理移动数据事件；清单 7-1 显示了其模式。`ts`列表示事件创建的时间，换句话说，即用户打开或关闭应用程序的时间。移动事件数据位于`<path>/chapter6/data/mobile`目录中，该目录包含`file1.json`、`file2.json`、`file3.json`和`newaction.json`。清单\
  \ 7-2 显示了每个文件中的行。\n\n```\nmobileDataDF.printSchema\n|-- action: string (nullable\
  \ = true)\n|-- id: string (nullable = true)\n|-- ts: timestamp (nullable = true)\n\
  Listing 7-1\nMobile Data Event Schema\n```\n\n```\n// file1.json\n{\"id\":\"phone1\"\
  ,\"action\":\"open\",\"ts\":\"2018-03-02T10:02:33\"}\n{\"id\":\"phone2\",\"action\"\
  :\"open\",\"ts\":\"2018-03-02T10:03:35\"}\n{\"id\":\"phone3\",\"action\":\"open\"\
  ,\"ts\":\"2018-03-02T10:03:50\"}\n{\"id\":\"phone1\",\"action\":\"close\",\"ts\"\
  :\"2018-03-02T10:04:35\"}\n// file2.json\n{\"id\":\"phone3\",\"action\":\"close\"\
  ,\"ts\":\"2018-03-02T10:07:35\"}\n{\"id\":\"phone4\",\"action\":\"open\",\"ts\"\
  :\"2018-03-02T10:07:50\"}\n// file3.json\n{\"id\":\"phone2\",\"action\":\"close\"\
  ,\"ts\":\"2018-03-02T10:04:50\"}\n{\"id\":\"phone5\",\"action\":\"open\",\"ts\"\
  :\"2018-03-02T10:10:50\"}\n// newaction.json\n{\"id\":\"phone2\",\"action\":\"crash\"\
  ,\"ts\":\"2018-03-02T11:09:13\"}\n{\"id\":\"phone5\",\"action\":\"swipe\",\"ts\"\
  :\"2018-03-02T11:17:29\"}\nListing 7-2\nMobile Event Data in file1.json, file2.json,\
  \ file3.json, newaction.json\n```\n\n\n\n### 基于事件时间的固定窗口聚合\n\n固定窗口（也称为滚动窗口）操作本质上会根据固定的窗口长度，将传入的数据流离散化为不重叠的桶。每条传入数据都会根据其事件时间被放入其中一个桶中。执行聚合只需遍历每个桶并应用聚合逻辑，无论是进行计数还是求和。图\
  \ 7-1 展示了固定窗口聚合的逻辑。\n\n![../images/419951_1_En_7_Chapter/419951_1_En_7_Fig1_HTML.jpg](img/419951_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1** 固定窗口操作\n\n固定窗口聚合的一个示例是，对每十分钟的固定窗口内的移动事件数量执行计数聚合。窗口长度通常由特定用例的需求以及数据量决定。该聚合的结果能让你从宏观上了解每个窗口内生成的移动事件速率。如果你对全天及每小时的移动使用情况感兴趣，那么\
  \ 60 分钟的窗口长度可能更合适。清单 7-3 包含了执行计数聚合的代码以及聚合结果。正如预期，列出的所有四个文件中总共只有十个移动数据事件，输出中的总计数也与该数字相符。\n\
  \n```\nimport org.apache.spark.sql.types._\nimport org.apache.spark.sql.functions._\n\
  val mobileDataSchema = new StructType() .add(\"id\", StringType, false)\n.add(\"\
  action\", StringType, false)\n.add(\"ts\", TimestampType, false)\nval mobileSSDF\
  \ = spark.readStream.schema(mobileDataSchema)\n.json(\"/chapter6/data/input\")\n\
  val windowCountDF = mobileSSDF.groupBy(window($\"ts\", \"10 minutes\")).count\n\
  val mobileConsoleSQ = windowCountDF.writeStream.format(\"console\")\n.option(\"\
  truncate\", \"false\")\n.outputMode(\"complete\")\n.start()\n// 停止流式查询\nmobileConsoleSQ.stop\n\
  // 输出\n+-------------------------------------------+------+\n|                 \
  \                    window| count|\n+-------------------------------------------+------+\n\
  | [2018-03-02 10:00:00, 2018-03-02 10:10:00]|     7|\n| [2018-03-02 10:10:00, 2018-03-02\
  \ 10:20:00]|     1|\n| [2018-03-02 11:00:00, 2018-03-02 11:10:00]|     1|\n| [2018-03-02\
  \ 11:10:00, 2018-03-02 11:20:00]|     1|\n+-------------------------------------------+------+\n\
  windowCountDF.printSchema\n|-- window: struct (nullable = false)\n|    |-- start:\
  \ timestamp (nullable = true)\n|    |-- end: timestamp (nullable = true)\n|-- count:\
  \ long (nullable = false)\n```\n\n**清单 7-3** 使用十分钟窗口处理移动事件数据\n\n当使用窗口执行聚合时，输出的窗口实际上是一个结构体类型，其中包含开始时间和结束时间。\n\
  \n除了在 `groupBy` 转换中指定窗口外，你还可以指定事件本身的其他列。以下示例将使用窗口和操作类型执行聚合。这能让你更深入地了解每个窗口和操作类型的计数情况。只需对之前的示例稍作修改即可实现。清单\
  \ 7-4 仅包含需要修改的行。\n\n```\nval windowActionCountDF= mobileSSDF.groupBy(window($\"\
  ts\", \"10 minutes\"), $\"action\").count\nval windowActionCountSQ = windowActionCountDF.writeStream.format(\"\
  console\")\n.option(\"truncate\", \"false\")\n.outputMode(\"complete\")\n.start()\n\
  // 结果\n+-------------------------------------------+-------+------+\n|         \
  \                            window| action| count|\n+-------------------------------------------+-------+------+\n\
  | [2018-03-02 10:00:00, 2018-03-02 10:10:00]| close |     3|\n| [2018-03-02 11:00:00,\
  \ 2018-03-02 11:10:00]| crash |     1|\n| [2018-03-02 11:10:00, 2018-03-02 11:20:00]|\
  \ swipe |     1|\n| [2018-03-02 10:00:00, 2018-03-02 10:10:00]| open  |     4|\n\
  | [2018-03-02 10:10:00, 2018-03-02 10:20:00]| open  |     1|\n+-------------------------------------------+-------+------+\n\
  // 停止查询流\nwindowActionCountSQ.stop()\n```\n\n**清单 7-4** 使用十分钟窗口和操作类型处理移动事件数据\n\n\
  上表结果中的每一行都包含了每个十分钟窗口内每种操作类型的计数信息。如果某个窗口附近出现了大量崩溃操作，这一信息有助于判断该时间段内是否发布了新版本。\n\n\n\
  \n### 基于事件时间的滑动窗口聚合\n\n除了固定窗口类型外，还有另一种称为*滑动窗口*的窗口类型。定义滑动窗口需要两个信息：窗口长度和滑动间隔，滑动间隔通常小于窗口长度。由于聚合计算是在传入的数据流上滑动进行的，其结果通常比固定窗口类型的结果更平滑。因此，这种窗口类型常用于计算移动平均值。关于滑动窗口需要注意的一点是，由于窗口重叠，一条数据可能落入多个窗口，如图\
  \ 7-2 所示。\n\n![../images/419951_1_En_7_Chapter/419951_1_En_7_Fig2_HTML.jpg](img/419951_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2 固定窗口操作\n\n为了说明对传入数据的滑动窗口聚合，你将使用一个关于数据中心计算机机架温度的小型合成数据集。假设每个计算机机架按一定间隔发出其温度，你希望生成一份报告，显示所有计算机机架的平均温度以及每个机架在窗口长度为十分钟、滑动间隔为五分钟内的平均温度。该数据集位于\
  \ `<path>/chapter7/data/iot` 目录中，包含 `file1.json` 和 `file2.json`。清单 7-5 展示了温度数据。\n\
  \n```\n// file1.json\n{\"rack\":\"rack1\",\"temperature\":99.5,\"ts\":\"2017-06-02T08:01:01\"\
  }\n{\"rack\":\"rack1\",\"temperature\":100.5,\"ts\":\"2017-06-02T08:06:02\"}\n{\"\
  rack\":\"rack1\",\"temperature\":101.0,\"ts\":\"2017-06-02T08:11:03\"}\n{\"rack\"\
  :\"rack1\",\"temperature\":102.0,\"ts\":\"2017-06-02T08:16:04\"}\n// file2.json\n\
  {\"rack\":\"rack2\",\"temperature\":99.5,\"ts\":\"2017-06-02T08:01:02\"}\n{\"rack\"\
  :\"rack2\",\"temperature\":105.5,\"ts\":\"2017-06-02T08:06:04\"}\n{\"rack\":\"rack2\"\
  ,\"temperature\":104.0,\"ts\":\"2017-06-02T08:11:06\"}\n{\"rack\":\"rack2\",\"temperature\"\
  :108.0,\"ts\":\"2017-06-02T08:16:08\"}\n清单 7-5 两个机架的温度数据\n```\n\n清单 7-6 中的代码首先读取温度数据，然后在\
  \ `ts` 列上对滑动窗口执行 `groupBy` 转换。对于每个滑动窗口，对温度列应用 `avg()` 函数。为了方便检查输出，它将数据写入一个查询名为 `iot`\
  \ 的内存数据接收器。然后你可以针对这个临时表发出 SQL 查询。\n\n```\nimport org.apache.spark.sql.types._\n\
  import org.apache.spark.sql.functions._\n// 定义模式\nval iotDataSchema = new StructType().add(\"\
  rack\", StringType, false)\n.add(\"temperature\", DoubleType, false)\n.add(\"ts\"\
  , TimestampType, false)\nval iotSSDF = spark.readStream.schema(iotDataSchema).json(\"\
  /chapter7/data/iot\")\n// 按滑动窗口分组并对温度列执行平均值计算\nval iotAvgDF = iotSSDF.groupBy(window($\"\
  ts\", \"10 minutes\", \"5 minutes\"))\n.agg(avg(\"temperature\") as \"avg_temp\"\
  )\n// 将数据写入查询名为 iot 的内存接收器\nval iotMemorySQ = iotAvgDF.writeStream.format(\"memory\"\
  )\n.queryName(\"iot\")\n.outputMode(\"complete\")\n.start()\n// 按开始时间顺序显示数据\nspark.sql(\"\
  select * from iot\").orderBy($\"window.start\").show(false)\n// 输出\n+-------------------------------------------+---------+\n\
  |                                     window| avg_temp|\n+-------------------------------------------+---------+\n\
  | [2017-06-02 07:55:00, 2017-06-02 08:05:00]|  99.5   |\n| [2017-06-02 08:00:00,\
  \ 2017-06-02 08:10:00]| 101.25  |\n| [2017-06-02 08:05:00, 2017-06-02 08:15:00]|\
  \ 102.75  |\n| [2017-06-02 08:10:00, 2017-06-02 08:20:00]| 103.75  |\n| [2017-06-02\
  \ 08:15:00, 2017-06-02 08:25:00]| 105.0   |\n+-------------------------------------------+---------+\n\
  // 停止流式查询\niotMemorySQ.stop\n清单 7-6 所有计算机机架在滑动窗口上的平均温度\n```\n\n上述输出显示合成数据集中有五个窗口。注意每个窗口的开始时间相隔五分钟，这是因为之前在\
  \ `groupBy` 转换中指定的滑动间隔长度。温度列显示平均温度在上升，这令人担忧。此时，尚不清楚是所有计算机机架的温度都在上升，还是只有某些机架。为了帮助识别哪些计算机机架，清单\
  \ 7-7 将 `rack` 列添加到 `groupBy` 转换中，并且只显示与清单 7-6 不同的行。\n\n```\n// 按滑动窗口和机架列分组\nval\
  \ iotAvgByRackDF = iotSSDF.groupBy(window($\"ts\", \"10 minutes\", \"5 minutes\"\
  ), $\"rack\")\n.agg(avg(\"temperature\") as \"avg_temp\")\n// 写入查询名为 iot_rack 的内存数据接收器\n\
  val iotByRackConsoleSQ = iotAvgByRackDF.writeStream\n.format(\"memory\")\n.queryName(\"\
  iot_rack\")\n.outputMode(\"complete\")\n.start()\nspark.sql(\"select * from iot_rack\"\
  ).orderBy($\"rack\", $\"window.start\").show(false)\n+-------------------------------------------+------+---------+\n\
  |                                     window| rack | avg_temp|\n+-------------------------------------------+------+---------+\n\
  | [2017-06-02 07:55:00, 2017-06-02 08:05:00]| rack1|  99.5   |\n| [2017-06-02 08:00:00,\
  \ 2017-06-02 08:10:00]| rack1| 100.0   |\n| [2017-06-02 08:05:00, 2017-06-02 08:15:00]|\
  \ rack1| 100.75  |\n| [2017-06-02 08:10:00, 2017-06-02 08:20:00]| rack1| 101.5 \
  \  |\n| [2017-06-02 08:15:00, 2017-06-02 08:25:00]| rack1| 102.0   |\n| [2017-06-02\
  \ 07:55:00, 2017-06-02 08:05:00]| rack2|  99.5   |\n| [2017-06-02 08:00:00, 2017-06-02\
  \ 08:10:00]| rack2| 102.5   |\n| [2017-06-02 08:05:00, 2017-06-02 08:15:00]| rack2|\
  \ 104.75  |\n| [2017-06-02 08:10:00, 2017-06-02 08:20:00]| rack2| 106.0   |\n| [2017-06-02\
  \ 08:15:00, 2017-06-02 08:25:00]| rack2| 108.0   |\n+-------------------------------------------+------+---------+\n\
  // 停止查询流\niotByRackConsoleSQ.stop()\n清单 7-7 每个机架在滑动窗口上的平均温度\n```\n\n输出表清晰地显示机架 1\
  \ 的平均温度低于 103，而你应该关注的是机架 2。\n\n\n\n### 聚合状态\n\n前面关于在固定窗口或滑动窗口上，结合事件时间和附加信息执行聚合操作的示例，展示了在\
  \ Spark Structured Streaming 中执行常用且复杂的流处理操作是多么简单。虽然从外部看起来很简单，但在内部，Structured Streaming\
  \ 引擎和 Spark SQL 引擎协同工作，以容错的方式维护中间聚合结果，同时执行流式聚合。事实上，只要对流式查询执行聚合操作，就必须维护中间聚合状态。该状态以键值对结构维护，类似于哈希映射，其中键是分组名称，值是中间聚合值。在前面的滑动窗口和机架\
  \ ID 聚合示例中，键将是窗口开始时间和结束时间以及机架名称的组合值，而值将是平均温度。\n\n中间状态存储在 Spark 执行器上的内存中、带版本控制的键值“状态存储”中，并写入预写日志，该日志应配置为驻留在\
  \ HDFS 等稳定存储系统中。在每个触发点，状态会在内存状态存储中被读取和更新，然后写入预写日志。在发生故障并且 Spark Structured Streaming\
  \ 应用程序重新启动时，状态会从预写日志中恢复，并从该点继续执行。这种容错状态管理显然会在 Structured Streaming 引擎中产生一些资源和处理开销。开销的大小与需要维护的状态量成正比。因此，将状态量保持在可接受的大小非常重要；换句话说，状态的大小不应无限增长。\n\
  \n鉴于滑动窗口的特性，窗口的数量会无限增长。这意味着执行滑动窗口聚合将需要中间状态无限增长，除非有一种方法可以丢弃不再更新的旧状态。这可以通过一种称为*水印*的技术来实现。\n\
  \n### 水印：限制状态并处理延迟数据\n\n水印是流处理引擎中常用的一种技术，用于处理延迟数据以及限制需要维护的状态量。现实世界中的流式数据通常是无序到达的，并且由于网络拥塞、网络中断或数据生成器（如移动设备）未在线等原因而延迟到达。作为实时流式应用程序的开发人员，了解如何处理晚于特定阈值到达的数据非常重要。换句话说，相对于其他数据，您期望大部分数据到达的可接受时间是多少？很可能，这个问题的答案取决于具体的用例。延迟数据将被丢弃，不会被处理。\n\
  \n从 Structured Streaming 的角度来看，水印是事件时间中的一个移动阈值，它落后于迄今为止看到的最大事件时间。随着具有更新事件时间的新数据到达，最大事件时间会更新，这也会导致水印移动。图\
  \ 7-3 展示了一个示例，其中水印被定义为十分钟。水印线由实线表示，它落后于由虚线表示的最大事件时间线。每个矩形框代表一条数据，其事件时间就在框的下方。事件时间为\
  \ 10:07 的数据到达时间稍晚，大约在 10:12；然而，它仍然落在 10:03 到 10:13 之间的阈值内。因此，它将照常处理。事件时间为 10:15\
  \ 的数据属于同一类别。但是，事件时间为 10:04 的数据到达时间非常晚，大约在 10:22，这落在了水印线以下，因此它将被忽略且不被处理。\n\n![../images/419951_1_En_7_Chapter/419951_1_En_7_Fig3_HTML.jpg](img/419951_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3 使用水印处理延迟数据\n\n指定水印的最大好处之一是使 Structured Streaming 引擎能够安全地移除早于水印的窗口的聚合状态。执行任何类型聚合的生产级流式应用程序都应指定水印，以避免内存不足问题。毫无疑问，水印是处理实时流式数据混乱部分的基本工具。\n\
  \nStructured Streaming 使得将水印指定为流式 DataFrame 的一部分变得简单。您只需向 Watermark API 提供两条信息：事件时间列和阈值（可以是秒、分钟或小时）。为了演示水印的实际应用，您可以处理\
  \ `<path>/chapter7/data/mobile` 目录中的两个 JSON 文件，并指定一个十分钟的水印。清单 7-8 显示了这两个文件中的数据。数据的设置方式是，`file1.json`\
  \ 文件中的每一行都落入其自己的十分钟窗口内。`file2.json` 文件中的第一行落入 10:20:00 到 10:30:00 窗口，尽管它到达较晚，但其时间戳仍在可接受的阈值内，因此它将被处理。`file2.json`\
  \ 的最后一行模拟了延迟数据，其时间戳位于 10:10:00 到 10:20:00 窗口，由于这超出了水印阈值，它将被忽略且不被处理。\n\n```\n// file1.json\n\
  {\"id\":\"phone1\",\"action\":\"open\",\"ts\":\"2018-03-02T10:15:33\"}\n{\"id\"\
  :\"phone2\",\"action\":\"open\",\"ts\":\"2018-03-02T10:22:35\"}\n{\"id\":\"phone3\"\
  ,\"action\":\"open\",\"ts\":\"2018-03-02T10:33:50\"}\n// file2.json\n{\"id\":\"\
  phone4\",\"action\":\"open\",\"ts\":\"2018-03-02T10:29:35\"}\n{\"id\":\"phone5\"\
  ,\"action\":\"open\",\"ts\":\"2018-03-02T10:11:35\"}\n清单 7-8\n两个 JSON 文件中的移动事件数据\n\
  ```\n\n\n\n为了模拟处理过程，首先在目录 `<path>/chapter7/data` 下创建一个名为 `input` 的目录。然后运行代码清单 7-9\
  \ 中的代码。下一步是将 `file1.json` 文件复制到 input 目录并检查输出。最后一步是将 `file2.json` 文件复制到 input 目录并检查输出。\n\
  \n```\nimport org.apache.spark.sql.types._\nimport org.apache.spark.sql.functions._\n\
  val mobileDataSchema = new StructType().add(\"id\", StringType, false)\n.add(\"\
  action\", StringType, false)\n.add(\"ts\", TimestampType, false)\nval mobileSSDF\
  \ = spark.readStream.schema(mobileDataSchema).json(\"/book/chapter7/data/input\"\
  )\n//设置一个带有水印的流式 DataFrame，并按 ts 和 action 列进行分组。\nval windowCountDF = mobileSSDF.withWatermark(\"\
  ts\", \"10 minutes\")\n.groupBy(window($\"ts\", \"10 minutes\"), $\"action\")\n\
  .count\nval mobileMemorySQ = windowCountDF.writeStream\n.format(\"console\")\n.option(\"\
  truncate\", \"false\")\n.outputMode(\"update\")\n.start()\n// 处理 file1.json 后的输出\n\
  // 如预期，每一行都落入其自身的窗口\n+-------------------------------------------+-------+------+\n\
  |                                     window| action| count|\n+-------------------------------------------+-------+------+\n\
  | [2018-03-02 10:20:00, 2018-03-02 10:30:00]| open  |   1  |\n| [2018-03-02 10:30:00,\
  \ 2018-03-02 10:40:00]| open  |   1  |\n| [2018-03-02 10:10:00, 2018-03-02 10:20:00]|\
  \ open  |   1  |\n+-------------------------------------------+-------+------+\n\
  // 处理 file2.json 后的输出\n// 注意，窗口 10:20 到 10:30 的计数现在更新为 2\n// 而窗口 10:10:00 和 10:20:00\
  \ 没有变化\n+-------------------------------------------+-------+------+\n|        \
  \                             window| action| count|\n+-------------------------------------------+-------+------+\n\
  | [2018-03-02 10:20:00, 2018-03-02 10:30:00]| open  |   2  |\n+-------------------------------------------+-------+------+\n\
  代码清单 7-9\n处理包含延迟到达数据的移动数据事件的代码\n```\n\n如前所述，由于 `file2.json` 文件中最后一行的时间戳超出了十分钟的水印阈值，因此它根本没有被处理。如果移除对\
  \ Watermark API 的调用，那么输出将类似于代码清单 7-10。窗口 10:10 到 10:20 的计数更新为 2。\n\n```\n+-------------------------------------------+-------+------+\n\
  |                                     window| action| count|\n+-------------------------------------------+-------+------+\n\
  | [2018-03-02 10:20:00, 2018-03-02 10:30:00]| open  |  2   |\n| [2018-03-02 10:10:00,\
  \ 2018-03-02 10:20:00]| open  |  2   |\n+-------------------------------------------+-------+------+\n\
  代码清单 7-10\n移除对 Watermark API 调用的输出\n```\n\n水印是一个有用的特性，因此理解聚合状态被正确清理的条件非常重要。\n\n\
  * 输出模式不能是 complete 模式，必须是 update 或 append 模式。原因是 complete 模式的语义要求必须维护所有聚合数据，为了不违反这些语义，水印不能丢弃任何中间状态。\n\
  * 通过 `groupBy` 转换进行的聚合必须直接作用于事件时间列，或者作用于事件时间列的窗口。\n* 在 Watermark API 和 `groupBy`\
  \ 转换中指定的事件时间列必须是同一个。\n* 在设置流式 DataFrame 时，必须在调用 `groupBy` 转换之前调用 Watermark API；否则，水印将被忽略。\n\
  \n## 任意状态处理\n\n如前所述，按键或事件窗口进行聚合的中间状态由 Structured Streaming 自动维护。然而，并非所有的事件时间处理都能通过简单地对一个或多个列进行聚合（无论是否使用窗口）来满足。例如，当在\
  \ IoT 温度数据集中连续三次读取到大于 100 度的温度值时，你想要发送警报、电子邮件或寻呼机通知。另一个例子是关于维护用户会话，其中每个会话的长度不是由固定的时间量决定，而是由用户的活动及其缺失来决定。为了解决这两个例子及类似的用例，你需要能够对每组数据应用任意处理逻辑，控制每组数据的窗口长度，并在多个触发点之间维护任意状态。这就是\
  \ Structured Streaming 任意状态处理发挥作用的地方。\n\n\n\n### 使用 Structured Streaming 进行任意有状态处理\n\
  \nStructured Streaming 为流式应用程序提供了一种回调机制，用于执行任意有状态处理，并且它会负责确保中间状态得以维护并以容错方式存储。这种处理方式本质上可以归结为执行以下任务之一，如图\
  \ 7-4 所示：\n\n-   对数据组进行映射，对每组数据应用任意处理，然后每组仅输出一行。\n-   对数据组进行映射，对每组数据应用任意处理，然后每组输出任意数量的行（包括零行）。\n\
  \n对于这些任务中的每一个，Structured Streaming 都提供了一个特定的 API 来处理。对于第一种任务，API 称为 `mapGroupsWithState`；对于第二种任务，API\
  \ 称为 `flatMapGroupsWithState`。这些 API 从 Spark 2.2 开始可用，并且仅适用于 Scala 和 Java。\n\n![../images/419951_1_En_7_Chapter/419951_1_En_7_Fig4_HTML.jpg](img/419951_1_En_7_Fig4_HTML.jpg)\n\
  \n**图 7-4** 两种任意有状态处理任务的直观描述\n\n在使用任何类型的回调机制时，清楚地理解框架与回调函数之间的约定至关重要，包括回调函数被调用的时机和频率，以及输入参数的细节。在这种特定情况下，流程大致如下：\n\
  \n-   要对流式 DataFrame 执行任意有状态处理，必须首先通过调用 `groupByKey` 转换来指定分组，并提供一个用于分组的列；然后它会返回一个\
  \ `KeyValueGroupedDataset` 类的实例。\n-   从 `KeyValueGroupedDataset` 类的实例中，可以调用 `mapGroupsWithState`\
  \ 或 `flatMapGroupsWithState` 函数。这两个 API 各自需要一组不同的输入参数。\n-   调用 `mapGroupsWithState`\
  \ 函数时，需要提供超时类型和一个用户定义的回调函数。超时部分稍后会解释。\n-   调用 `flatMapGroupsWithState` 函数时，需要提供输出模式、超时类型和一个用户定义的回调函数。输出模式和超时部分稍后都会解释。\n\
  \n以下是 Structured Streaming 与前面提到的用户定义回调函数之间的约定：\n\n-   用户定义的回调函数将在每个触发器中为每个组重复调用。每次调用都针对在该触发器中有数据的组。如果某个特定组在触发器中没有任何数据，那么该组将不会被调用。因此，不应假设此函数在每个触发器中都会为每个组调用。\n\
  -   每次调用用户定义的回调函数时，都会传入以下信息：\n    -   组键的值。\n    -   一个组的所有数据。不保证它们有任何特定的顺序。\n \
  \   -   一个组的先前状态，该状态由同一组的上一次调用返回。组状态由一个名为 `GroupState` 的状态持有者类管理。当需要更新组的状态时，必须使用新状态调用此类的\
  \ `update` 函数。每个组的状态信息由用户定义的类定义。调用 `update` 函数时，提供的用户定义状态不能为 null。\n\n正如你在上一章所学到的，每当需要维护中间状态时，只允许某些输出模式。截至\
  \ Spark 2.3，调用 `mapGroupsWithState` API 时仅支持更新输出模式；然而，调用 `flatMapGroupsWithState`\
  \ API 时，追加和更新模式都支持。\n\n### 处理状态超时\n\n在使用水印进行事件时间聚合的情况下，中间状态的超时由 Structured Streaming\
  \ 内部管理，并且无法影响它。另一方面，Structured Streaming 的任意有状态处理提供了控制中间状态超时的灵活性。由于你能够维护任意状态，因此针对这种特定用例控制中间状态超时是合理的。\n\
  \nStructured Streaming 有状态处理提供了三种不同的超时类型。第一种基于处理时间，另一种基于事件时间。超时类型在全局级别配置，这意味着它适用于特定流式\
  \ DataFrame 内的所有组。超时时间量可以为每个单独的组配置，并且可以随意更改。如果中间状态配置了超时，那么在回调函数中处理给定的值列表之前，检查它是否已超时非常重要。在某些用例中，不需要超时，第三种超时类型就是为此场景设计的。超时类型在类\
  \ `GroupStateTimeout` 内部定义，在调用 `mapGroupsWithState` 或 `flatMapGroupsWithState` 函数时指定类型。超时持续时间分别使用\
  \ `GroupState.setTimeoutDuration` 或 `GroupState.setTimeoutTimeStamp` 函数来指定，用于处理超时和事件超时。\n\
  \n敏锐的读者可能想知道，当特定组的中间状态超时时会发生什么。Structured Streaming 针对这种情况提供的约定是，它将使用一个空的值列表调用用户定义的回调函数，并将标志\
  \ `GroupState.hasTimedOut` 设置为 true。\n\n在这三种不同的超时类型中，事件时间超时是最复杂的，将首先介绍。事件时间超时意味着它基于事件中的时间，因此对于此超时类型，需要通过\
  \ `DataFrame.withWatermark` 在流式 DataFrame 中设置水印。要控制每个组的超时，需要在处理特定组期间向 `GroupState.setTimeoutTimestamp`\
  \ 函数提供一个时间戳值。当水印超过提供的时间戳时，组的中间状态就会超时。在用户会话化用例中，当用户与网站交互时，只需根据用户的最新交互时间加上某个阈值来更新超时时间戳，即可延长用户会话。这是为了确保只要用户与网站交互，用户会话就保持活动状态，并且中间数据不会超时。\n\
  \n处理超时类型的工作方式与事件时间超时类型类似；然而，区别在于它基于服务器的系统时钟，该时钟不断向前推进。要控制每个组的超时，需要在处理特定组期间向 `GroupState.setTimeoutDuration`\
  \ 函数提供一个持续时间。持续时间可以是类似 `1 minute`、`1 hour` 或 `2 days` 这样的值。当时钟超过提供的持续时间时，组的中间状态就会超时。由于此超时类型依赖于系统时钟，因此考虑时区变化或时钟偏差的情况非常重要。\n\
  \n这对敏锐的读者来说可能显而易见，但重要的是要认识到，如果流中有一段时间没有数据，就不会有任何触发器，因此用户定义的回调函数将不会被调用。此外，水印不会推进，超时函数调用也不会发生。\n\
  \n至此，你应该对 Structured Streaming 中的任意状态处理如何工作以及涉及哪些 API 有了很好的理解。下一节将通过几个示例来演示如何实现任意状态处理。\n\
  \n\n\n### 实际操作中的任意状态处理\n\n本节将通过两个用例演示结构化流中的任意状态处理。\n\n- 第一个用例是从数据中心机架温度数据中提取模式，并在中间状态中维护每个机架的状态。每当检测到连续三次温度达到或超过\
  \ 100 度时，该机架状态将升级为警告级别。此示例将使用 `mapGroupsWithState` API。\n- 第二个示例是关于用户会话化，它将根据用户与网站的交互来跟踪用户状态。此示例将使用\
  \ `flatMapGroupsWithState` API。\n\n无论使用哪种 API 来为你的用例执行任意状态处理，都需要遵循一组通用步骤，包括以下内容：\n\
  \n- 定义几个类来表示输入数据、中间状态和输出。\n- 定义两个函数。第一个是供结构化流调用的回调函数。第二个函数包含对每个分组数据执行任意状态处理的逻辑，以及维护状态的逻辑。\n\
  - 决定超时类型及其合适的值。\n\n#### 使用 `mapGroupsWithState` 提取模式\n\n此用例的目标是识别数据中心机架温度数据中的特定模式。关注的模式是同一机架连续三次温度读数达到或超过\
  \ 100 度，且两次连续高温读数之间的时间差必须在 60 秒以内。当检测到这种模式时，该特定机架的状态将升级为警告状态。如果下一个传入的温度读数低于 100\
  \ 度阈值，则机架状态将降级为正常。\n\n此示例的数据位于目录 `<path>/chapter7/data/iot_pattern` 中，包含三个文件；其内容如清单\
  \ 7-11 所示。`file1.json` 的内容显示 `rack1` 的温度在略低于和略高于 100 度之间交替变化。文件 `file2.json` 显示\
  \ `rack2` 的温度正在升高。在 `file3.json` 中，`rack3` 的温度也在升高，但温度读数之间的间隔超过了一分钟。\n\n```\n//\
  \ file1.json\n{\"rack\":\"rack1\",\"temperature\":99.5,\"ts\":\"2017-06-02T08:01:01\"\
  }\n{\"rack\":\"rack1\",\"temperature\":100.5,\"ts\":\"2017-06-02T08:02:02\"}\n{\"\
  rack\":\"rack1\",\"temperature\":98.3,\"ts\":\"2017-06-02T08:02:29\"}\n{\"rack\"\
  :\"rack1\",\"temperature\":102.0,\"ts\":\"2017-06-02T08:02:44\"}\n// file2.json\n\
  {\"rack\":\"rack1\",\"temperature\":97.5,\"ts\":\"2017-06-02T08:02:59\"}\n{\"rack\"\
  :\"rack2\",\"temperature\":99.5,\"ts\":\"2017-06-02T08:03:02\"}\n{\"rack\":\"rack2\"\
