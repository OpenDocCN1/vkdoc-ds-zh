  ### `drop(columnName1, columnName2)`


  此转换简单地删除 DataFrame 中指定的列。你可以指定一个或多个要删除的列名，但只有模式中存在的列才会被删除，不存在的列将被静默忽略。你可以使用 `select`
  转换通过仅投影要保留的列来删除列。如果 DataFrame 有 100 列，而你只想删除几列，那么使用此转换比使用 `select` 转换更方便。清单 4-33
  提供了删除列的示例。


  ```

  movies.drop("actor_name", "me").printSchema

  |-- movie_title: string (nullable = true)

  |-- produced_year: long (nullable = true)

