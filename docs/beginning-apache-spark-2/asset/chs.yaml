  ### 通过 JDBC 创建 DataFrame


  `JDBC` 是一种标准的应用程序 API，用于从关系数据库管理系统读取数据以及向其写入数据。Spark 支持 `JDBC` 数据源，这意味着你可以使用 Spark
  从任何现有的 RDBMS（例如 MySQL、PostgreSQL、Oracle、SQLite 等）读取数据以及向其写入数据。使用 `JDBC` 数据源时，你需要提供一些重要的信息：适用于你的
  RDBMS 的 `JDBC` 驱动程序、连接 URL、身份验证信息以及表名。


  为了让 Spark 连接到 RDBMS，它必须在运行时能够访问 `JDBC` 驱动程序的 JAR 文件。因此，你需要将 `JDBC` 驱动程序的位置添加到 Spark
  的类路径中。清单 4-18 展示了如何从 Spark shell 连接到 MySQL。


  ```

  ./bin/spark-shell ../jdbc/mysql-connector-java-5.1.45/mysql-connector-java-5.1.45-bin.jar  --jars
  ../jdbc/mysql-connector-java-5.1.45/mysql-connector-java-5.1.45-bin.jar

  清单 4-18

  启动 Spark Shell 时指定 JDBC 驱动程序

  ```


  一旦 Spark shell 成功启动，你可以使用 `java.sql.DriverManager` 类快速验证 Spark 是否能连接到 RDBMS，如清单
  4-19 所示。此示例尝试测试与 MySQL 的连接。如果你的 RDBMS 不是 MySQL，URL 格式会略有不同，因此请查阅你所使用的 `JDBC` 驱动程序的文档。


  ```

  import java.sql.DriverManager

  val connectionURL = "jdbc:mysql://localhost:3306/?user=&password="

  val connection = DriverManager.getConnection(connectionURL)

  connection.isClosed()

  connection close()

  清单 4-19

  在 Spark Shell 中测试与 MySQL 的连接

  ```


  如果你没有收到任何与连接相关的异常，则说明 Spark shell 已成功连接到你的 RDBMS。


  表 4-6 描述了使用 `JDBC` 数据源时需要指定的主要选项。有关完整的选项列表，请查阅 [`https://spark.apache.org/docs/latest/sql-programming-guide.html#jdbc-to-other-databases`](https://spark.apache.org/docs/latest/sql-programming-guide.html#jdbc-to-other-databases)。


  **表 4-6** JDBC 数据源的主要选项


  | 键 | 描述 |

  | --- | --- |

  | `url` | Spark 要连接的 JDBC URL。至少应包含主机、端口和数据库名称。对于 MySQL，它可能类似于：`jdbc:mysql://localhost:3306/sakila`。
  |

  | `dbtable` | Spark 要读取数据或写入数据的数据库表名。 |

  | `driver` | Spark 将实例化以连接到上述 URL 的 JDBC 驱动程序的类名。请查阅你正在使用的 JDBC 驱动程序文档。对于 MySQL
  Connector/J 驱动程序，类名为 `com.mysql.jdbc.Driver`。 |


