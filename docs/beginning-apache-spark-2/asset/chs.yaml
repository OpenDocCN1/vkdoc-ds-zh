- '# 4. Spark SQL（基础）


  随着 Spark 在每个新版本中不断演进为统一的数据处理引擎，其编程抽象也在不断发展。`RDD` 是 Spark 在 2012 年问世时最初的核心编程抽象。在
  Spark 1.6 中，引入了一种名为结构化 API（Structured APIs）的新编程抽象。对于大多数用例而言，这是执行数据处理的首选方式。结构化 API
  旨在通过易用、直观且富有表现力的 API 来提高开发者的生产力。在这种新的数据处理方式中，数据需要组织成结构化格式，数据计算逻辑也需要遵循特定的结构。有了这两点信息，Spark
  就能执行优化，从而加速数据处理应用程序。


  图 4-1 展示了 Spark SQL 组件是如何构建在可靠且久经考验的 Spark Core 组件之上的。这种分层架构意味着 Spark Core 组件中的任何改进都会自动应用于
  Spark SQL 组件。


  ![../images/419951_1_En_4_Chapter/419951_1_En_4_Fig1_HTML.png](img/419951_1_En_4_Fig1_HTML.png)


  图 4-1 — Spark SQL 组件


  本章将介绍 Spark SQL 模块，它能让您编写更少的代码来完成工作，并在底层智能地执行优化。Spark SQL 模块由两个主要部分组成。第一部分是结构化 API
  的表示形式，称为 DataFrame 和 Dataset，它们定义了用于处理结构化数据的高级 API。DataFrame 的概念灵感来源于 Python 的 pandas
  DataFrame；主要区别在于 Spark 中的 DataFrame 可以处理分布在多台机器上的大量数据。Spark SQL 模块的第二部分是 Catalyst
  优化器，它在幕后完成所有繁重的工作，让您的工作更轻松，并加速您的数据处理逻辑。Spark SQL 模块提供的一个很酷的功能是能够执行 SQL 查询来进行数据处理。凭借这一能力，Spark
  得以吸引一群新的用户，即*业务分析师*，他们熟悉 SQL 语言，因为这是他们日常使用的主要工具之一。


  区分结构化数据与非结构化数据的一个核心概念是*模式（schema）*，它以列名和相关数据类型的形式定义数据的结构。模式概念是 Spark 结构化 API 不可或缺的一部分。


  结构化数据通常以特定格式捕获。有些格式基于文本，有些则基于二进制。文本数据的常见格式有 CSV、XML 和 JSON，二进制数据的常见格式有 Avro、Parquet
  和 ORC。开箱即用，Spark SQL 模块可以轻松地从这些格式中的任何一种读取数据以及将数据写入这些格式。这种多功能性带来的一个意想不到的好处是，Spark
  可以用作数据格式转换工具。


  ## DataFrame 简介


  *DataFrame* 是一个不可变的、分布式的数据集合，它被组织成行，每一行由一组列组成，每个列都有名称和关联的类型。换句话说，这个分布式数据集合具有由模式定义的结构。如果您熟悉关系数据库管理系统（RDBMS）中的表概念，那么您会发现
  DataFrame 本质上与之等价。DataFrame 中的每一行都由一个通用的 `Row` 对象表示。与 RDD API 不同，DataFrame API 提供了一组特定于领域的操作，这些操作是关系型的，并且具有丰富的语义。API
  的细节将在以下章节中介绍。与 RDD API 一样，DataFrame API 分为两类：转换（transformations）和动作（actions）。其求值语义与
  RDD 相同。转换是惰性求值的，而动作是即时求值的。


  可以通过从前面提到的多种结构化数据源读取数据，以及从 Hive 和数据库中的表读取数据来创建 DataFrame。此外，Spark SQL 模块通过提供 RDD
  中数据的模式信息，可以轻松地将 RDD 转换为 DataFrame。DataFrame API 可用于 Scala、Java、Python 和 R。


  ## 创建 DataFrame


  创建 DataFrame 的方法有很多种；它们的共同点是需要隐式或显式地提供模式。


  ### 从 RDD 创建 DataFrame


  让我们从使用 RDD 创建 DataFrame 开始。清单 4-1 首先创建一个包含两列整数类型数据的 RDD，然后调用 `toDF` 隐式函数，使用指定的列名将
  RDD 转换为 DataFrame。列类型是从 RDD 中的数据推断出来的。清单 4-2 展示了 DataFrame 中两个常用的函数：`printSchema`
  和 `show`。`printSchema` 函数将列名及其关联类型打印到控制台。`show` 函数以表格格式打印 DataFrame 中的数据。默认情况下，它显示
  20 行。要更改显示的默认行数，可以向 `show` 函数传递一个数字。有关指定显示行数的示例，请参见清单 4-3。


  ```

  import scala.util.Random

  val rdd = spark.sparkContext.parallelize(1 to 10).map(x => (x, Random.nextInt(100)*
  x))

  val kvDF = rdd.toDF("key","value")

  ```


  清单 4-1 — 从数字 RDD 创建 DataFrame


  ```

  kvDF.printSchema

  |-- key: integer (nullable = false)

  |-- value: integer (nullable = false)

  ```


  清单 4-2 — 打印 DataFrame 的模式并显示数据


  ```

  kvDF.show

  +---+-----+

  |key|value|

  +---+-----+

  |  1|   58|

  |  2|   18|

  |  3|  237|

  |  4|   32|

  |  5|   80|

  |  6|  210|

  |  7|  567|

  |  8|  360|

  |  9|  288|

  | 10|  260|

  +---+-----+

  ```


  ```

  kvDF.show(5)

  +---+-----+

  |key|value|

  +---+-----+

  |  1|   59|

  |  2|   60|

  |  3|   66|

  |  4|  280|

  |  5|   40|

  +---+-----+

  ```


  清单 4-3 — 调用 `show` 函数以表格格式显示五行数据




  ### 注意


  `value`列中的实际数字对你来说可能看起来不同，因为它们是通过调用`Random.nextInt()`函数随机生成的。


  创建 DataFrame 的另一种方法是使用以编程方式创建的 schema 来指定一个 RDD。清单 4-4 首先使用一个`Row`对象数组创建一个 RDD，其中每个`Row`对象包含三列；然后以编程方式创建一个
  schema。最后，它将 RDD 和 schema 提供给`createDataFrame`函数，以转换为 DataFrame。清单 4-5 展示了`peopleDF`
  DataFrame 中的 schema 和数据。


  ```

  import org.apache.spark.sql.Row

  import org.apache.spark.sql.types._

  val peopleRDD = spark.sparkContext.parallelize(Array(Row(1L, "John Doe",  30L),

  Row(2L, "Mary Jane", 25L)))

  val schema = StructType(Array(

  StructField("id", LongType, true),

  StructField("name", StringType, true),

  StructField("age", LongType, true)

  ))

  val peopleDF = spark.createDataFrame(peopleRDD, schema)

  清单 4-4

  从具有以编程方式创建的 Schema 的 RDD 创建 DataFrame

  ```


  ```

  peopleDF.printSchema

  |-- id: long (nullable = true)

  |-- name: string (nullable = true)

  |-- age: long (nullable = true)

  peopleDF.show

  +--+-----------+---+

  |id|       name|age|

  +--+-----------+---+

  | 1|   John Doe| 30|

  | 2|  Mary Jane| 25|

  +--+-----------+---+

  清单 4-5

  显示 peopleDF 的 Schema 及其数据

  ```


  以编程方式创建 schema 的能力使 Spark 应用程序能够灵活地根据某些外部配置调整 schema。


  每个`StructField`对象包含三条信息：名称、类型以及该值是否可为空。


  DataFrame 中每一列的类型都映射到一个内部的 Spark 类型，它可以是简单的标量类型或复杂类型。表 4-1 描述了可用的内部 Spark 数据类型及其关联的
  Scala 类型。


