  ### `sample(fraction)`, `sample(fraction, seed)`, `sample(fraction, seed, withReplacement)`


  此转换从 DataFrame 中返回一组随机选择的行。返回的行数大约等于指定的分数（表示百分比），该值必须在 0 和 1 之间。种子用于初始化随机数生成器，该生成器用于生成要包含在结果中的行号。如果未指定种子，则使用随机生成的值。`withReplacement`
  选项用于确定随机选择的行是否会被放回选择池中。换句话说，当 `withReplacement` 为 true 时，某个特定的被选行有可能被多次选中。那么，什么时候需要使用此转换呢？当原始数据集很大，需要将其缩减到更小的规模以便快速迭代数据分析逻辑时，此转换非常有用。清单
  4-34 提供了使用 `sample` 转换的示例。


