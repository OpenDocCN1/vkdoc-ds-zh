  ### 左半连接


  此连接类型的行为与内连接类似，区别在于连接后的数据集不包含右侧数据集的列。另一种理解此连接类型的方式是，其行为与左反连接相反，连接后的数据集仅包含匹配的行。有关执行左半连接的示例以及连接后数据集的样子，请参见清单
  5-27。


