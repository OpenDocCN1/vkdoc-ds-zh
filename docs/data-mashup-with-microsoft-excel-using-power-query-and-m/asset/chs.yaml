- "# 使用 Power Query 发现数据并将其加载到 Excel 中\n\n如果你正在阅读本书，很可能是因为你需要使用数据。更具体地说，你可能需要踏上一段从数据到洞察的旅程，其中你必须获取大量事实与数字，将其塑造成可理解的信息，并辅以能够传达清晰意义的分析。更进一步说，你希望使用自己熟悉且信赖的电子表格——Microsoft\
  \ Excel——来完成这一切。\n\n本书正是关于这段旅程的。它涵盖了作为 Excel 用户，你可以将外部原始数据转换为信息结构，从而交付高影响力分析的多种方式。这种全新的方法假设你既不依赖中央\
  \ IT 部门帮助你从外部源加载数据，也不需要他们提供常规支持。其核心理念是让用户能够使用世界上最流行的电子表格，在尽可能短的时间内处理工业级数量的源数据。\n\
  \n这个领域中的关键词是：\n\n* **快速**\n* **去中心化**\n* **直观**\n* **交互式**\n* **交付**\n\n使用本书中描述的技术，你可以从众多外部源中发现并加载数据。然后，你可以快速直观地转换和清理这些原始数据，使其结构化和可用。一旦准备就绪，你就可以将其加载到\
  \ Excel 工作表或 Excel 中的 Power Pivot 数据模型中，并开始使用你早已熟悉的工具——Excel——来提供详细的分析。\n\n因此，本书是从用户的角度撰写的。本质上，这一切都关乎*赋能*——让用户基于现有技能，简单高效地定义自身需求并满足自身需要。令人惊叹的是，你完全可以在\
  \ Excel 中完成这一切，无需借助任何其他工具或实用程序。你的数据源可能位于许多地方，并以多种格式存在。尽管如此，你需要访问它们、抽样、选择，并在必要时进行转换或清理，以便交付分析。所有这一切都由\
  \ Power Query 实现。\n\n## Power Query\n\nPower Query 是 Excel 工具集中最新的成员之一。它现已完全集成到\
  \ Excel 中，允许你从各种来源发现、访问和整合信息。一旦你的数据被选定、清理并转换为连贯的表格，你就可以将其放入 Excel 工作表进行详细分析，或直接将其加载到\
  \ Power Pivot（Excel 数据模型）中——当你想要交互式地“切片和切块”数据时，这是一个理想的数据存储库。\n\nPower Query 允许你对源数据执行许多操作，但四个主要步骤可能是：\n\
  \n* 从各种来源*导入*数据。这涵盖企业数据库、文件、社交媒体以及大数据。\n* 将来自多个源的数据*合并*为连贯的结构。\n* 将数据*塑形*为适合你用例的列和记录。\n\
  * *清理*数据，使其可靠且易于使用。\n\n曾几何时，这些流程需要专门的 IT 专家团队。嗯，现在再也不用了。使用 Power Query，你可以自行整合数据，使其符合你的需求，并作为自助式解决方案的一部分随时可用。\n\
  \n这是因为发现、加载、清理、重构和修改源数据正是 Power Query 的设计初衷。它允许你完成以下任务：\n\n* *数据发现*：查找并连接到包含潜在有用数据的无数数据源。这可以来自公共和私有数据源。这是第\
  \ 1 章至第 5 章的主题。\n* *数据加载*：选择你已经检查过的数据，并将子集加载到 Power Query 中进行塑形。\n* *数据修改*：修改已导入的每个数据集的结构。\n\
  * *过滤并清理数据本身*。\n\n尽管我将这三个步骤描述为完全独立且顺序进行，但实际情况是它们常常融合成一个单一流程。事实上，你可能会在许多情况下在数据已经加载到\
  \ Excel *之后*再检查数据——或者在加载*之前*清理数据集。然而，核心目标始终不变：找到一些数据，然后在 Power Query 中对其进行抽样，在此处你可以调整、清理和塑形，然后再将其加载到\
  \ Excel 中。\n\n这个流程可以简单描述为“首先，获取你的数据。”在数据仓库的世界里，专家们称之为 `ETL`，这是 **E**xtract（提取）、**T**ransform（转换）和\
  \ **L**oad（加载）的缩写。尽管这个缩写词带来了令人安心的信心，但这一流程很少是一条通过一系列清晰步骤而进行的平滑、逻辑的推进。实际情况往往要混乱得多。你可能会经常发现自己导入一些数据、清理它、再从另一个源导入更多数据、将第二个数据集与第一个合并、删除一些行和列，然后重复这些操作以及许多其他操作，甚至反复多次。\n\
  \n在本章及接下来的几章中，我将尝试向你展示如何使用 Power Query 使这一流程在实践中运作。我希望这将使构成 `ETL` 流程的各个步骤更加清晰。我只要求你意识到，Power\
  \ Query 包含的各种选项使其成为一个多面且功能极其强大的工具。科学在于知道*哪些*选项可用。艺术在于知道*何时*使用它们。\n\n\n\n## 数据加载过程\n\
  \n首先，快速概述一下你需要做什么才能将数据导入 Excel（假设你已经从 Apress 网站下载了本书附带的示例数据——附录 A 对此进行了说明）。以下步骤解释了如何从你已经非常熟悉的来源——Excel\
  \ 本身——加载数据。是的，我知道你可以在工作簿之间复制和粘贴数据，但那样就偏离了重点，并且会错过 Power Query 所能提供的所有令人难以置信的数据混搭额外功能。在最初的案例中，数据的实际来源无关紧要。它可以来自几十个可用来源中的任何一个。Excel\
  \ 仅仅是潜在数据源的一个示例。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig1_HTML.jpg](img/497001_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n“获取数据”弹出菜单\n\n1.  在 Excel 中打开一个新的空白工作簿。\n2.  单击菜单中的“数据”以切换到“数据”功能区。\n3.\
  \  单击“获取数据”。将出现“获取数据”弹出菜单，如图 1-1 所示。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig2_HTML.jpg](img/497001_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n从 Excel 工作簿加载数据时的“导入数据”对话框\n\n1.  单击“从文件”。\n2.  单击“从工作簿”。将出现“导入数据”对话框。\n\
  3.  单击文件 `C:\\DataMashupWithExcelSamples\\BrilliantBritishCars.xlsx`。“导入数据”对话框将如图\
  \ 1-2 所示。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig3_HTML.jpg](img/497001_1_En_1_Fig3_HTML.jpg)\n\
