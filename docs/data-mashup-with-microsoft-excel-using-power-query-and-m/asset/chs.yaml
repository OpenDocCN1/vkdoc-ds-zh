  \n2. 启动 Excel。\n\n3. 单击 `获取数据` ➤ `来自其他源` ➤ `来自 ODBC`。将出现“来自 ODBC”对话框。\n\n4. 展开可用的\
  \ DSN 列表。“来自 ODBC”对话框将类似于图 5-9 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig10_HTML.jpg](img/497001_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n\nODBC 驱动程序安全对话框\n\n1. 选择您之前创建的 DSN（本例中为 `FilemakerForPowerBI`）。\n\n2.\
  \ 单击 `确定`。将出现凭据对话框。\n\n3. 选择 `Windows 集成安全性`，或单击左侧的 `数据库` 并输入具有使用 ODBC 驱动程序连接权限的用户名。凭据对话框将类似于图\
  \ 5-10 所示。\n\n1. 单击 `连接`。您将在导航器窗口中看到 ODBC 数据源中可用的数据。\n\n2. 选择要加载到 Excel 中的表。如果要同时加载多个表，请务必勾选\
  \ `选择多项` 复选框。\n\n3. 单击 `加载` 以将数据从 ODBC 数据源加载到 Excel 中。\n\n我意识到这个过程起初可能显得有些繁琐。但请记住，您很可能*只*需要设置一次\
  \ ODBC 连接。之后，您就可以随心所欲地使用它来连接源数据了。\n\n\n\n创建好 ODBC DSN 后，你可以在多种场景以及众多不同产品中使用它——这些产品都需要获取你通过\
  \ ODBC 连接的数据源信息。这意味着我在此处创建的 ODBC 数据源可以用于 Excel 中的 Power Query、Power BI，以及其他许多需要访问\
  \ FileMaker Pro 数据的应用程序中。\n\n需要注意的是，每个 ODBC 驱动程序都不尽相同。因此，在第 5 步到第 10 步中，对话框的外观会因你配置的\
  \ ODBC 驱动程序不同而略有差异。尽管如此，其中的关键元素始终是相同的，包括：\n\n*   为 DSN 命名\n*   指定数据所在的主机\n*   定义数据存储库（或数据库）\n\
  *   指定访问数据源所需的任何凭据\n\n关于如何创建和使用 ODBC 连接将数据加载到 Excel（或任何其他目标应用程序）中，还有很多内容可以探讨。然而，如果你需要深入了解这项特定技术，我不得不请你参考丰富的现有资源，无论是印刷版还是在线资源。一个很好的起点是\
  \ **Microsoft 文档**，其中解释了系统 DSN、用户 DSN 和文件 DSN 之间的区别，并描述了你可能需要了解的关键要素。\n\n> **注意**\
  \  \n> 要使 ODBC 连接正常工作，数据源应用程序（本例中为 FileMaker Pro）必须已打开并正在运行。其他 ODBC 数据源可能有其自身的特定问题。\n\
  \n最后，我只能强烈建议你为打算与 Excel 中的 Power Query 配合使用的 ODBC 驱动程序，收集所有相关的文档。实际上，如果你使用的是采用 ODBC\
  \ 驱动程序的企业级数据源，也许有企业内部的资源可以为你提供帮助，甚至帮你直接配置好 ODBC。\n\n## OLE DB 数据源\n\nOLE DB（对象链接与嵌入，数据库的缩写）在技术层面是一种被称为应用程序编程接口（API）的东西。从更通俗的层面讲，它是一种用于以通用方式连接数据库源的技术。\n\
  \n因此，与 ODBC 的方式有些类似，你可以使用 OLE DB 连接到各种数据源（通常是数据库，但也可以是其他数据源）。事实上，即使存在其他连接方法，你可能会发现\
  \ OLE DB 是一种连接到数据库的有效方式。\n\n所以，无论你发现 OLE DB 有何用途，都值得去了解它是如何工作的。在本例中，我将使用 OLE DB\
  \ 连接到 SQL Server 和一个示例数据库。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig11_HTML.jpg](img/497001_1_En_5_Fig11_HTML.jpg)\n\
  \n**图 5-11** `来自 OLE DB` 对话框\n\n1.  打开一个新的 Excel 应用程序。\n2.  在“数据”选项卡中，依次单击 `获取数据`\
  \ ➤ `来自其他源` ➤ `来自 OLE DB`。此时将显示“来自 OLE DB”对话框。\n3.  单击 `连接`。“来自 OLE DB”对话框将出现，外观应如图\
  \ 5-11 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig12_HTML.jpg](img/497001_1_En_5_Fig12_HTML.jpg)\n\
  \n**图 5-12** `OLE DB 数据链接属性` 对话框\n\n1.  如果你有功能完整的连接字符串，请在 `连接字符串` 文本框中输入。\n2.  如果你没有连接字符串，请单击\
  \ `生成` 按钮。将显示“OLE DB 数据链接属性”对话框，如图 5-12 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig13_HTML.jpg](img/497001_1_En_5_Fig13_HTML.jpg)\n\
  \n**图 5-13** `OLE DB 数据链接属性` 对话框的“连接”属性\n\n1.  选择你想要使用的 OLE DB 数据提供程序。在本示例中，将选择\
  \ `Microsoft OLE DB Provider for SQL Server`。当然，你必须为你想要访问的数据源选择已安装的 OLE DB 提供程序。\n\
  2.  单击 `下一步`。将显示“OLE DB 数据链接属性”对话框的“连接”属性窗格。\n3.  从“选择或输入服务器名称”弹出菜单中选择一个可用的 SQL\
  \ Server（或输入其名称）。\n4.  选择安全类型，如果你选择使用特定用户名而不是 Windows NT 集成安全性，则需要输入用户名和密码。\n5.\
  \  从“选择服务器上的数据库”弹出菜单中选择源数据库。此时对话框应类似于图 5-13 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig14_HTML.jpg](img/497001_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14** 测试连接警报\n\n1.  单击 `测试连接` 按钮以确保连接有效。你应该会看到图 5-14 所示的消息。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig15_HTML.jpg](img/497001_1_En_5_Fig15_HTML.jpg)\n\
  \n**图 5-15** 包含有效连接字符串的`来自 OLE DB` 对话框\n\n1.  单击 `确定`。Excel 将生成连接字符串并将其插入到“来自 OLE\
  \ DB”对话框中，如图 5-15 所示。\n2.  单击 `确定`。将出现导航器窗口并显示相应的数据。\n3.  选择你想要加载的表。\n4.  单击 `加载`\
  \ 将数据加载到 Excel 中。\n\n> **注意**  \n> 如果是首次连接 OLE DB 数据源，系统可能会要求你输入用户名和密码，这与本章前面的示例情况类似。\n\
  \n步骤 8 到 10 是 SQL Server OLE DB 驱动程序特有的。对于其他驱动程序，这些步骤可能会有所不同。\n\n你需要了解的是，OLE DB\
  \ 连接要求运行 Excel 的计算机上安装了 OLE DB 驱动程序（或称“提供程序”）。然而，真正有趣的是，OLE DB 连接可以简化为一个简单的连接字符串。因此，如果你需要与其他用户共享此连接，很多情况下你只需将连接字符串通过电子邮件发送给他们即可。然后你的同事就可以简单地将该连接字符串粘贴到\
  \ Excel 的“来自 OLE DB”对话框中。换句话说（以本示例为模板），你只需向同事发送以下文本：\n\n```\nprovider=SQLOLEDB.1;initial\
  \ catalog=CarSalesData;data source=ADAM03\\SQLSERVER2016\n```\n\n他们可以通过将此字符串粘贴到“来自\
  \ OLE DB”对话框中来连接到指定的数据库。同样，你的 IT 部门或许也能为你提供可以直接使用的合适连接字符串。\n\n使用 OLE DB 连接还有其他优势。具体来说，你（或你的\
  \ IT 部门）可以在连接字符串中提供高级配置，以加快或改善对数据的访问。例如，这可以通过指定一个用于报表的镜像服务器来减轻主服务器的压力。在如此层面，技术细节将取决于\
  \ OLE DB 数据源以及所使用的驱动程序，并且其范围非常广泛，超出了本书的讨论范围。\n\n\n\n## OData 源\n\nOData 是开放数据协议（Open\
  \ Data Protocol）的简称。该协议允许 Web 客户端发布和编辑由 URL 标识的资源。通过 OData 连接的数据可以是表格格式，也可以是其他不同的结构。\n\
  \nOData 是一种连接基于 Web 的数据的通用方法。因此，每个 OData 源可能与你之前使用过的其他源有所不同。\n\n有大量的 OData 源可供使用。有些是公共的，有些则只有在你拥有相应权限时才能访问。然而，访问方法通常是大致相同的。下面是一个示例，展示如何连接到\
  \ [Odata.org](http://odata.org) 免费提供的 OData 示例源（至少在本书付印时如此）：\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig16_HTML.jpg](img/497001_1_En_5_Fig16_HTML.jpg)\n\
  \n**图 5-16** OData 源对话框\n\n1. 在 Excel 的“数据”选项卡中，依次单击 **获取数据** → **来自其他源** → **来自\
  \ OData 源**。此时会出现 OData 源对话框。\n2. 输入你用于连接 OData 源的 URL。在此示例中，我将使用一个公共的 OData 源，你可以在\
  \ [`https://services.odata.org/TripPinRESTierService/People`](https://services.odata.org/TripPinRESTierService/People)\
  \ 找到它。对话框应如图 5-16 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig17_HTML.jpg](img/497001_1_En_5_Fig17_HTML.jpg)\n\
  \n**图 5-17** OData 源凭据对话框\n\n3. 单击 **确定**。此时会出现 OData 源凭据对话框。你可以在图 5-17 中看到它。\n\n\
  ![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig18_HTML.jpg](img/497001_1_En_5_Fig18_HTML.jpg)\n\
  \n**图 5-18** 从 Power Query 导航器中的 OData 源返回的数据\n\n4. 从对话框左侧的可用列表中选择凭据类型。在此示例中，接受匿名凭据，因此你无需输入用户名或密码。对于其他服务，你可能需要在左侧选择适当的安全方法，然后输入所需的凭据。\n\
  5. 单击 **连接**。此时会显示导航器对话框，并显示使用指定 URL 可用的数据。你可以在图 5-18 中看到从此示例 URL 返回的数据。\n6. 单击\
  \ **加载**。数据将加载到新的 Excel 工作表和/或数据模型中，具体取决于你选择的加载配置选项。\n\n> **注意** 有趣的是，Dynamics 365\
  \ Online 使用 OData 作为连接方法。\n\n### OData 选项\n\nOData 源对话框（与你在本章前面看到的 **从 Web** 对话框颇为相似）也包含一个\
  \ **高级** 按钮。选择此按钮将展开对话框，允许你向 URL 添加一个或多个 URL 部分。你可以在图 5-19 中看到这一点。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig19_HTML.jpg](img/497001_1_En_5_Fig19_HTML.jpg)\n\
  \n**图 5-19** OData 源对话框的高级选项\n\n> **注意** URL 部分可以在 Power Query 编辑器中参数化。我将在第 11 章中解释参数化。\n\
  \n## 刷新数据\n\n从数据库和数据仓库加载数据仅意味着将源数据的快照复制到 Excel 中。如果源数据被更新、扩展或删除，那么如果你希望分析反映数据的当前状态，你将需要获取最新版本的数据。\n\
  \n基本上，你有两个选项可以做到这一点：\n\n- 刷新你定义的所有数据源中的所有源数据。\n- 单独刷新一个或多个表。\n\n### 刷新 Excel 内存模型中的整个数据\n\
  \n确保所有数据都是最新的只有一种方法。刷新整个数据可能需要更长的时间，但你会确信你的 Excel 文件包含来自你所连接的所有源的最新可用数据。\n\n要执行完全刷新：\n\
  \n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig20_HTML.jpg](img/497001_1_En_5_Fig20_HTML.jpg)\n\
  \n**图 5-20** 刷新对话框\n\n1. 在“开始”选项卡中，单击 **刷新** 按钮。**查询和连接** 窗格将显示所有当前正在刷新的数据源。**查询和连接**\
  \ 窗格将类似于图 5-20 中所示。\n\n任何工作表或 Power Pivot 数据模型中的当前数据都将被更新，以显示源中可用的最新数据。\n\n> **注意**\
  \ 如果源数据量很大或网络连接速度较慢，完全数据刷新可能需要相当长的时间。\n\n### 刷新单个查询\n\n如果你确定只需要刷新 Excel 数据模型中的一个或多个表，那么你可以选择单独刷新这些表。操作步骤如下：\n\
  \n1. 在 **查询和连接** 窗格中，单击要刷新的表的刷新图标。如图 5-20 所示。\n\n该表的现有数据将被最新数据替换。\n\n## 结论\n\n在本章中，你学习了可以使用通用数据访问连接器（ODBC、OLE\
  \ DB 和 OData）来连接那些（尚）没有内置 Power Query 连接器的数据源。你还了解了如何在 Excel 中刷新数据。\n\n本章结束了由五个章节组成的系列，该系列向你介绍了可以与\
  \ Excel 中的 Power Query 一起使用的众多不同数据源中的一部分。在这些篇幅中，你已经了解了如何从一系列可用源中加载数据。好消息是，Excel\
  \ 能够从比我们在这里介绍的更多的源中读取数据。更好的消息是，你可以利用已获得的知识，使用标准化的 Power Query 界面连接到任何其他可用的数据源。\n\
  \n因此，我不会在本书中进一步描述其他数据源了。这是因为，既然你已经了解了构成 Power Query 将数据加载到 Excel 这一极其便捷方法的核心技术，那么你很可能不需要我提供更多信息就能够加载任何可用的连接类型。\n\
  \n既然你现在能够查找、访问和加载所需数据到 Excel 中，是时候进入下一步了。这意味着要清理和重构数据集，使其符合你的分析需求。应对这些挑战将是接下来七章的主题。\n\
  \n\n\n"
- "# 6. 结构化导入的数据\n\n在前五章中，你已经了解了将数据查找并加载（或连接到）到 Excel 工作表或 Excel 数据模型的一些方法。这不可避免地是任何提取、转换和加载数据过程的第一部分。然而，这显然仅仅是一个开始。一旦使用\
  \ Power Query 访问了数据，就需要知道如何以多种方式调整数据以满足你的需求。这是因为并非所有数据都能立即投入使用。通常情况下，你需要在数据上做一些初步工作，使其更易于使用。在\
  \ Power Query 中调整源数据通常被称为*数据转换*，这也是本章以及接下来三章的主题。\n\nPower Query 提供的转换范围广泛且多样。学习应用\
  \ Power Query 提供的技术，使你能够按原样获取数据，对其进行清理，然后将其作为一系列连贯且结构化的数据表推送回 Excel 工作表或 Excel 数据模型。只有到那时，数据才准备好用于创建有说服力的分析。\n\
  \n由于 Power Query 提供的数据转换选项极其广泛，很容易让人不知所措（至少一开始是这样），我将可能的修改分为四类。这些分类是我个人的建议，旨在便于理解：\n\
  \n*   *数据转换*：这包括添加和删除列和行、重命名列以及筛选数据。\n*   *数据修改*：这涉及更改数据集中行和列中的实际数据。\n*   *扩展数据集*：这包括添加更多列（可能将现有列扩展为更多列或行）以及添加计算。\n\
  *   *合并数据集*：这涉及将多个独立的数据集（可能来自不同的数据源）合并为一个数据集。\n\n本章将向你介绍核心技术的数据转换技术，这些技术可用于对已加载的每个独立数据集进行塑形。这些转换包括：\n\
  \n*   重命名、删除和重新排序列\n*   删除行组或行集\n*   数据集去重\n*   对数据进行排序\n*   通过筛选数据排除记录\n*   对记录进行分组\n\
  \n在第 7 章中，你将学习如何清理和修改数据。在第 8 章中，你将了解如何对列进行子集化以提取列中部分可用数据、计算列、合并来自不同查询的数据、添加包含不同类型计算的附加列，并学习数据透视和逆透视。因此，如果你在本章中找不到所需内容，答案很可能在接下来的两章中。\n\
  \n在本章中，我还将使用一组你可以在 Apress 网站上找到的示例文件。如果你已按照附录 A 中的说明操作，那么这些文件位于 `C:\\DataMashupWithExcelSamples`\
  \ 文件夹中。\n\n## 在 Power Query 中扩展查询\n\n在第 1 章中，你了解了如何将外部源数据直接加载到 Excel 中进行报告和分析。显然，这种方法的前提是你所使用的数据结构完美、干净且无错误。当数据来自“企业级”数据源（例如数据仓库，它们存储在关系型、维度型或表格型数据库中）时，源数据几乎总是正确且可直接用于分析。但当你面对多个不同的、未经预先清理和准备的源数据时，情况并非总是如此。日常的现实是，你可能需要清理和转换将在\
  \ Excel 中使用的大部分源数据。\n\n真正的好消息是，过去需要昂贵服务器和企业级软件才能完成的那种数据转换，现在可以免费实现了。是的，Power Query\
  \ 是一个强大的 ETL（**E**xtract，**T**ransform，**L**oad）工具，可以与许多花费数十万美元的应用程序相媲美。\n\nPower\
  \ Query 的数据转换是通过*查询*来执行的。正如你在前几章中所见，你不必修改源数据。如果数据准备就绪，你可以直接加载它。然而，如果需要清理数据，你可以在连接数据与将其加载到\
  \ Excel 数据模型之间添加一个中间步骤。这个中间步骤使用 Power Query 编辑器来调整源数据。\n\n那么如何应用查询来转换数据呢？你有两种选择：\n\
  \n*   先从一个或多个源加载数据，然后再进行转换。\n*   在加载之前，在查询中编辑每个源数据元素。\n\nPower Query 非常宽容。它不会强迫你选择其中一种方法，然后让你受制于决策的后果。你可以先加载数据，然后发现它需要一些调整，切换到查询编辑器进行更改，然后返回基于此数据扩展电子表格。或者，你可以先专注于数据，在开始构建报告之前，尽力使其尽善尽美。选择完全取决于你。\n\
  \n为了说明这一点，让我们来看看这两种工作方式。\n\n注意\n\n我可能有点迂腐和老派，但建议你在创建非常复杂的转换时做好笔记，因为稍后返回解决方案尝试进行调整时，如果没有文档记录可能会非常痛苦。\n\
  \n\n\n### 数据加载后的编辑操作\n\n在第 1 章中，你已经了解了如何将 Excel 工作簿 `CarSales.xlsx` 直接加载到 Excel\
  \ 中，以供后续分析使用。现在，我们假设你想要对已加载数据的数据结构进行一些修改。具体来说，你想要重命名 `CostPrice` 列。你要修改的文件是 `C:\\\
  DataMashupWithExcelSamples` 目录下的 `Chapter06Sample1.xlsx` 文件。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig1_HTML.jpg](img/497001_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 初始数据加载\n\n1.  启动 Excel。\n2.  打开 Excel 文件 `C:\\DataMashupWithExcelSamples\\\
  Chapter06Sample1.xlsx`。你可以看到示例数据已加载到一个工作表中。\n3.  单击 **数据** ➤ **查询和连接**。现在，你可以在图\
  \ 6-1 的 **查询和连接** 窗格中看到执行此加载过程的查询 (`BaseData`)。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig2_HTML.jpg](img/497001_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2. Power Query 编辑器\n\n4.  在右侧的 **查询和连接** 窗格中，双击 `BaseData` 连接。这将连接并打开 Power\
  \ Query。Power Query 窗口看起来将如图 6-2 所示。你可能会看到一个提示对话框，告诉你正在连接到一个未知的外部数据源。在这种情况下，请单击\
  \ **确定**。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig3_HTML.jpg](img/497001_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 查询编辑器中的列上下文菜单\n\n5.  右键单击 `CostPrice` 列的标题（不要单击列右侧的箭头）。该列将被选中。\n6.  从上下文菜单中选择\
  \ **重命名**。你可以在图 6-3 中看到上下文菜单。\n7.  输入 **VehicleCost** 并按 **Enter** 键。列标题将更改为 `VehicleCost`。\n\
  8.  在 Power Query 编辑器的 **开始** 功能区中，单击 **关闭并加载** 按钮。Power Query 编辑器将关闭，并返回 Excel，此时源数据已加载到新的工作表中。\n\
  \n我希望这个简单的例子能让你明白，转换源数据是一个快速且无痛的过程。你应用的技巧——重命名列——只是可用于转换数据的几十种可能技巧中的一种。然而，这里要传达的核心思想并非具体的转换操作。你需要记住的是，支撑你分析的数据始终存在，并且只需点击一下即可访问。任何时候，你都可以“切换”到数据并进行修改，只需在\
  \ **查询和连接** 窗格中双击相关查询即可。你做出的任何更改并确认后，数据在 Excel 中的更新几乎是即时的。\n\n### 加载前的数据转换\n\n在某些情况下，你可能更倾向于在加载数据之前对数据进行处理。这是在第\
  \ 2 章中使用查询编辑器加载数据时所采用方法的一种变体。请执行以下操作，在数据出现在 Excel 窗口*之前*对其进行转换：\n\n1.  打开一个新的 Excel\
  \ 工作簿。\n2.  在 **数据** 功能区中，单击 **获取数据** 按钮上的小三角形。\n3.  选择 **来自文件** ➤ **来自工作簿**，然后单击\
  \ **导入** 选择 Excel 文件 `C:\\DataMashupWithExcelSamples\\CarSales.xlsx`。\n4.  在 **导航器**\
  \ 窗口中，选择 `CarData` 工作表。\n5.  单击 **转换数据** 按钮（*不是* **加载** 按钮）。\n6.  Power Query 编辑器将打开，并将源数据显示为表格。\n\
  7.  执行上一个示例中的步骤 4 到 6，重命名 `CostPrice` 列。\n8.  在 Power Query 编辑器的 **开始** 功能区中，单击\
  \ **关闭并加载** 按钮。Power Query 编辑器将关闭，并返回 Excel 窗口。\n\n这一次，你是在将数据集加载到 Excel *之前* 对其进行了简单的修改。数据修改技巧完全相同。直接加载数据与绕道\
  \ Power Query 之间的唯一区别在于，在 **导航器** 对话框中单击的是 **编辑数据** 而不是 **加载**。这意味着数据只会在你在 Power\
  \ Query 编辑器中完成对源数据的所有修改后才会加载。\n\n## 查询还是加载？\n\nExcel 始终为你提供两种选择：直接加载数据，或者绕道 Power\
  \ Query 进行建设性的预处理。遵循哪条路径完全取决于你自己，也明显取决于每种具体情况。尽管如此，当面对使用不熟悉数据的新挑战时，你可能需要考虑以下基本原则：\n\
  \n-   你是否确信数据已经可以使用？也就是说，数据是否干净且结构良好？如果是这样，你可以尝试将其直接加载到 Excel 中。\n-   你是否面临多个数据源需要合并和塑造成一个连贯的结构？如果是这种情况，那么你确实需要使用\
  \ Power Query 编辑器来转换数据。\n-   数据是否来自企业数据仓库或结构连贯的外部源？这些数据可能存储在关系型数据库、SQL Server Analysis\
  \ Services 多维数据集、内存表格数据仓库或基于云的服务中。由于这些数据源几乎总是数百甚至数千小时工作（用于清理、准备和结构化数据）的成果，因此你可能可以直接将它们加载到数据模型或\
  \ Excel 工作表中。\n-   数据是否需要预先聚合和筛选？考虑使用 **Power Query**。\n-   你是否可能需要更改字段名称以使数据更易于管理？在查询编辑器中更改字段名称可能更简单。\n\
  -   你是否面临大量需要添加到“核心”数据表的查找表？那么 **Power Query** 就是你的朋友。\n-   数据是否包含许多多余或错误的元素？那么将\
  \ **Power Query** 作为第一步来移除这些元素。\n-   数据是否需要经过合理化处理和标准化才能更易于处理？在这种情况下，通往成功的道路是通过\
  \ Power Query 编辑器。\n-   数据源是否巨大？如果是这种情况，你可以先在 Power Query 编辑器中编辑、提取子集和过滤数据来节省时间。这是因为\
  \ Power Query 编辑器只加载数据的*样本*供你进行调整。整个数据集只会在你确认所有修改并关闭查询编辑器时才会被加载。\n\n这类问题只是粗略的指导方针。然而，当你使用\
  \ Power Query 时，它们可以帮助你指明正确的方向。不可避免地，你使用此应用程序的次数越多，就越能培养出帮助你做出正确决策的反射和直觉。但是，请记住，Power\
  \ Query 是用来提供帮助的，即使是直接加载的数据集也是基于查询的。因此，你总是可以先加载数据，然后稍后根据需要决定调整查询结构。或者，在查询窗口中编辑数据是一个绝佳的机会，可以在将数据加载到\
  \ Excel 之前更仔细地查看数据——而这只需多点击几下而已。\n\n所有这些都意味着你可以自由采用自己感到满意的工作方式。Power Query 将轻松且几乎无形地适应你的风格，让你能够在数据和\
  \ Excel 之间无缝切换，这很可能成为你的第二天性。\n\n本章的剩余部分将带你了解一些核心技巧，这些技巧是你清理和塑形数据所必需的。但是，在深入所有细节之前，让我们先快速、高层地了解一下\
  \ Power Query 编辑器及其布局方式。\n\n\n\n## Power Query 编辑器\n\n所有数据转换操作都将在 Power Query 编辑器中进行。它与您熟悉的\
  \ Excel 界面是分开的窗口，布局略有不同。\n\nPower Query 编辑器由六个主要元素组成：\n\n*   四个主要功能区：“主页”、“转换”、“添加列”和“视图”。在执行特定类型的数据转换时，会出现其他功能区。\n\
  *   “查询”列表窗格，其中包含已添加到 Excel 文件中的所有查询。\n*   “数据”窗口，您可以在此处查看所选查询的数据样本。\n*   “查询设置”窗格，其中包含用于转换数据的步骤列表。\n\
  *   数据上方的公式栏，显示执行所选转换步骤的代码（使用第 12 章中将介绍的“M”语言编写）。\n*   状态栏（位于窗口底部），显示有用的信息，例如查询表中的行数和列数，以及数据集下载日期。\n\
  \n这些元素的标注如图 6-4 所示。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig4_HTML.jpg](img/497001_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4. Power Query 编辑器详解\n\n**注意：** 如果您没有看到公式栏，只需在 Power Query 编辑器菜单中单击“视图” ➤\
  \ “公式栏”。\n\n### “应用步骤”列表\n\n数据转换本质上是顺序过程。因此，“查询”窗口会存储您在清理和整理源数据时所做的每次修改。构成数据转换过程的各种元素都列在\
  \ Power Query 编辑器“查询设置”窗格的“应用步骤”列表中。\n\nPower Query 编辑器不会对数据转换过程中的步骤进行编号，但它会记住每一步骤。这些步骤从“应用步骤”列表的顶部开始（几乎总是以“源”步骤开始），并可以扩展到数十个单独的步骤，这些步骤追溯了您的数据在加载到数据模型之前的演变过程。如果您愿意，可以将查询编辑器视为一种“宏录制器”。\n\
  \n此外，当您依次单击“应用步骤”列表中的每一步时，“数据”窗口中的数据会相应变化，以反映每次转换的结果，为您提供一个完整且可见的所有应用于数据集的修改轨迹。\n\
  \n对于您在本章及下一章中涉及的每一个数据修改选项，“应用步骤”列表都会为其步骤指定一个独特的名称。由于准确理解每个函数实际实现的功能可能很重要，我将始终提请您注意\
  \ Power Query 应用的默认名称。\n\n### Power Query 编辑器功能区\n\nPower Query 编辑器使用四个核心功能区。它们对于您在本章中要学习的内容至关重要。它们如下所示：\n\
  \n*   “主页”功能区\n*   “转换”功能区\n*   “添加列”功能区\n*   “视图”功能区\n\n我绝对不是说您需要记住这些功能区中所有按钮的功能。我希望的是，您能够通过以下对查询编辑器功能区按钮的简要描述，了解\
  \ Power Query 在数据转换领域的强大功能。因此，如果您拥有的初始数据集不符合需求，您可以查看 Power Query 提供的资源以及它们如何提供帮助。一旦找到能实现您所需功能的函数，您就可以跳转到相关章节，详细了解如何应用该函数。\n\
  \n#### “主页”功能区\n\n由于我们将大量使用 Power Query 编辑器的“主页”功能区来转换数据，因此了解其功能很重要。我在图 6-5 和表 6-1\
  \ 中解释了各种选项。\n\n表 6-1. 查询编辑器“主页”功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 关闭并加载 | 完成处理步骤；保存并关闭查询\
  \ |\n| 刷新预览 | 刷新预览数据 |\n| 查询管理 | 允许您删除、复制或引用查询 |\n| 管理列 | 允许您从源数据中所有可用的列中选择要保留的列，或删除一个或多个列\
  \ |\n| 减少行 | 保留或删除表格顶部或底部指定数量的行 |\n| 排序 | 使用所选列作为排序关键字对表格进行排序 |\n| 拆分列 | 将列拆分为两个或多个单独的列\
  \ |\n| 分组依据 | 对数据进行分组并进行可能的聚合 |\n| 数据类型 | 设置列的数据类型 |\n| 将第一行用作标题 | 将第一条记录提升为标题定义\
  \ |\n| 替换值 | 将列中的值替换为其他值 |\n| 合并查询 | 连接两个单独查询中的数据 |\n| 追加查询 | 将一个或多个查询中的数据添加到另一个结构相同的查询中\
  \ |\n| 合并文件 | 将给定列中的所有文件合并到单个表中 |\n| 管理参数 | 允许您查看和修改在 Power Query 中为此 ETL 过程定义的任何参数\
  \ |\n| 数据源设置 | 允许您管理和编辑已连接到的数据源的设置 |\n| 新建查询 | 允许您连接到其他外部数据或重用现有连接 |\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig5_HTML.jpg](img/497001_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5. 查询编辑器“主页”功能区\n\n\n\n#### “转换”功能区\n\n顾名思义，“转换”功能区包含了丰富的数据转换功能。其中包含的各种选项在图\
  \ 6-6 和表 6-2 中进行了说明。\n\n**表 6-2.** 查询编辑器“转换”功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n\
  | 分组依据 | 使用指定的列集对表进行分组；为此分组聚合所有数值列 |\n| 将第一行用作标题 | 将第一行用作列标题 |\n| 转置 | 将列转换为行，将行转换为列\
  \ |\n| 反转行 | 按相反顺序显示源数据，将最后几行显示在窗口顶部 |\n| 对行计数 | 对表中的行进行计数，并用行数替换数据 |\n| 数据类型 |\
  \ 将选定的数据类型应用于列 |\n| 检测数据类型 | 检测要应用于多个列的正确数据类型 |\n| 重命名 | 重命名列 |\n| 替换值 | 在列内执行搜索和替换操作，将一个指定值替换为另一个值\
  \ |\n| 填充 | 将上方或下方单元格中的数据复制到列中的空白单元格中 |\n| 透视列 | 使用选定列中的数据作为列标题，创建一组新列 |\n| 逆透视列\
  \ | 取一组列中的值并对数据进行逆透视，使用列标题作为描述性元素创建新列 |\n| 移动 | 移动列 |\n| 转换为列表 | 将列的内容转换为列表。例如，这可用作查询参数\
  \ |\n| 拆分列 | 在指定的分隔符处或在指定数量的字符之后，将一列拆分为一列或多列 |\n| 格式 | 修改列中数据的文本格式（大写、小写、首字母大写）或删除尾随空格\
  \ |\n| 合并列 | 获取多列中的数据并将其放置在一列中，可以添加可选的分隔符 |\n| 提取 | 使用当前数据中定义的子集替换列中的数据。您可以指定要从列的开头或结尾保留的字符数量，设置从指定字符开始的字符范围，甚至可以列出列中的字符数\
  \ |\n| 分析 | 根据列中元素的内容创建 XML 或 JSON 文档 |\n| 统计信息 | 返回列中所有值的总和、平均值、最大值、最小值、中位数、标准偏差、计数或非重复值计数\
  \ |\n| 标准 | 使用您指定的值应用于列中的每个单元格，执行基本的数学计算（加、减、除、乘、整数除法或返回余数） |\n| 科学 | 对列中的每个单元格执行基本的科学计算（平方、立方、n\
  \ 次方、平方根、指数、对数或阶乘） |\n| 三角学 | 使用您指定的值应用于列中的每个单元格，执行基本的三角计算（正弦、余弦、正切、反正弦、反余弦或反正切）\
  \ |\n| 舍入 | 将列中的值舍入到下一个整数（向上或向下）或指定的因子 |\n| 信息 | 用简单信息替换列中的值：是奇数、是偶数或正/负 |\n| 日期\
  \ | 从列中的日期值中分离出元素（日、月、年等） |\n| 时间 | 从列中的日期/时间或时间值中分离出元素（小时、分钟、秒等） |\n| 持续时间 | 根据可以解释为天数、小时数、分钟数等的值计算持续时间\
  \ |\n| 展开 | 将另一个查询中（结构相同的）数据添加到当前查询中 |\n| 聚合 | 计算另一个查询中数值列的总和或乘积，并将结果添加到当前查询中 |\n\
  | 提取值 | 将列的内容值提取为单个文本值 |\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig6_HTML.jpg](img/497001_1_En_6_Fig6_HTML.jpg)\n\
  \n**图 6-6.** 查询编辑器“转换”功能区\n\n#### “添加列”功能区\n\n“添加列”功能区的作用远不止添加列。它还包含将列分解为多列，以及基于现有列添加包含日期和计算结果的列的功能。其中包含的各种选项在图\
  \ 6-7 和表 6-3 中进行了说明。\n\n**表 6-3.** 查询编辑器“添加列”功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n\
  | 从示例中的列 | 允许使用一个或多个列作为示例来创建新列 |\n| 自定义列 | 使用公式创建列的内容来添加新列 |\n| 调用自定义函数 | 将“M”语言函数应用于每一行\
  \ |\n| 条件列 | 添加一个新列，该列根据条件从选定列中添加值 |\n| 索引列 | 在新列中添加一个序列号以唯一标识每一行 |\n| 重复列 | 创建当前列的副本\
  \ |\n| 格式 | 修改新列中数据的文本格式（大写、小写、首字母大写）或删除尾随空格 |\n| 合并列 | 获取多列中的数据并将其放置在一列中，可以添加可选的分隔符\
  \ |\n| 提取 | 使用当前数据中定义的子集创建新列。您可以指定要从列的开头或结尾保留的字符数量，设置从指定字符开始的字符范围，甚至可以列出列中的字符数 |\n\
  | 分析 | 基于列中的 XML 或 JSON 创建新列 |\n| 统计信息 | 创建一个新列，返回列中所有值的总和、平均值、最大值、最小值、中位数、标准偏差、计数或非重复值计数\
  \ |\n| 标准 | 创建一个新列，使用您指定的值应用于列中的每个单元格，返回基本的数学计算结果（加、减、除、乘、整数除法或返回余数） |\n| 科学 | 创建一个新列，为列中的每个单元格返回基本的科学计算结果（平方、立方、n\
  \ 次方、平方根、指数、对数或阶乘） |\n| 三角学 | 创建一个新列，使用您指定的值应用于列中的每个单元格，返回基本的三角计算结果（正弦、余弦、正切、反正弦、反余弦或反正切）\
  \ |\n| 舍入 | 将新列中的值舍入到下一个整数（向上或向下）或指定的因子 |\n| 信息 | 用简单信息替换列中的值：是奇数、是偶数或正/负 |\n| 日期\
  \ | 在新列中，从日期值中分离出元素（日、月、年等） |\n| 时间 | 在新列中，从日期/时间或时间值中分离出元素（小时、分钟、秒等） |\n| 持续时间\
  \ | 在新列中，根据可以解释为天数、小时数、分钟数和秒数的值计算持续时间 |\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig7_HTML.jpg](img/497001_1_En_6_Fig7_HTML.jpg)\n\
  \n**图 6-7.** 查询编辑器“添加列”功能区\n\n#### “视图”功能区\n\n“视图”功能区允许您更改一些查询编辑器设置，并查看底层的数据转换代码。其中包含的各种选项将在下一章中进行说明。\n\
  \n\n\n## 数据集整形\n\n现在，您正看着一个已加载到 Excel 中的数据表。为便于论述，我们假设它是示例数据目录中的 `C:\\DataMashupWithExcelSamples\\\
  Chapter06Sample1.xlsx` 文件，并且您已双击“查询和连接”窗格中的 `BaseData` 查询以显示 Power Query 编辑器。那么，对于当前可见的\
  \ `BaseData` 数据集，您可以做些什么呢？接下来，我们将介绍一些可应用于整形初始数据集的核心技术。这些技术包括：\n\n- 重命名列\n- 对列进行重新排序\n\
  - 删除列\n- 合并列\n- 删除记录\n- 删除重复记录\n- 筛选数据集\n\n我将这些技术归为一组，因为它们会影响数据的初始大小和形状。此外，作为数据建模者，通常不仅最佳实践是，而且对您而言也更容易，即从一开始就排除任何不需要的行和列。我还发现，如果列从开始就逻辑清晰并赋予易于理解的名称，数据集就更容易理解。总而言之，从长远来看，这会使数据处理工作更加轻松。\n\
  \n### 重命名列\n\n尽管我们在本章开头部分已简要了解了重命名列，但让我们更详细地再次审视这项技术。我承认，重命名列实际上并没有修改数据表的形式。然而，在处理数据时，我认为让所有数据都清晰可辨至关重要。这意味着要为每一列赋予有意义的列名。因此，我认为这种修改对于数据的形状至关重要，并且也是导入源数据时必不可少的最佳实践。\n\
  \n重命名列的方法：\n\n1.  单击要重命名的列的内部（或列标题上）。\n2.  单击“转换”以激活“转换”功能区。\n3.  单击“重命名”按钮。列名将被突出显示。\n\
  4.  输入新名称或编辑现有名称。\n5.  按 Enter 键或单击列标题外部。\n\n该列现在将拥有一个新标题。右侧的“应用的步骤”列表现在将包含另一个元素\
  \ `已重命名的列`。此步骤将被突出显示。\n\n**注意**  \n作为使用“转换”功能区的替代方法，您可以右键单击列标题并选择“重命名”。\n\n### 对列进行重新排序\n\
  \nPower Query 会按照数据源中定义的顺序加载数据。因此，列顺序将完全取决于源数据（或者，如果您使用了源数据库（如第 3 章所述），则取决于 SQL\
  \ 查询）。然而，这种列顺序并非一成不变，如果有助于您理解和处理数据，您可以对列进行重新排序。更改列顺序的操作如下：\n\n1.  单击要移动的列的标题。\n\
  2.  将该列向左或向右拖动到新位置。执行此操作时，您会看到列标题横向滑过其他列标题，并且一条较粗的灰色线将指示释放鼠标按钮时列将被放置的位置。`已重新排序的列`\
  \ 将出现在“应用的步骤”列表中。\n\n图 6-8 展示了此操作。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig8_HTML.jpg](img/497001_1_En_6_Fig8_HTML.jpg)\n\
  \n*图 6-8. 对列进行重新排序*\n\n如果查询包含数十甚至数百列，您可能会发现拖动一列可能既缓慢又费力。同样，如果列非常宽，可能难以将列“向左”或“向右”微调。在这些情况下，Power\
  \ Query 可以通过“转换”功能区中的“移动”按钮来帮助您。单击此按钮将显示表 6-4 中概述的菜单选项。\n\n*表 6-4. 移动按钮选项*\n\n|\
  \ 选项 | 描述 |\n| --- | --- |\n| 向左 | 将当前选定的列移动到其左侧紧邻的列左侧 |\n| 向右 | 将当前选定的列移动到其右侧紧邻的列右侧\
  \ |\n| 移至开头 | 将当前选定的列移动到查询中所有列的左侧 |\n| 移至末尾 | 将当前选定的列移动到查询中所有列的右侧 |\n\n“移动”命令也适用于通过\
  \ Ctrl 单击和/或 Shift 单击选择的一组列。实际上，如果需要，您甚至可以移动一组不连续的列。\n\n**注意**  \n您需要先选择一列（或一组列），然后再单击“移动”按钮。如果没有选择，那么第一次使用“移动”时，Power\
  \ Query 会选择列，但不会移动它们。\n\n### 删除列\n\n那么如何删除一列或多列呢？操作如下：\n\n1.  单击要删除的列的内部，或者如果要一次删除多列，请按住\
  \ Ctrl 键单击要删除的列的标题。\n2.  单击“主页”功能区中的“删除列”按钮。这些列将被删除，并且 `已删除列` 将成为“应用的步骤”列表中的最新元素。\n\
  \n**提示**  \n删除选定列的另一种方法是按 Delete 键。这也会在“应用的步骤”列表中添加一个 `已删除列` 步骤。\n\n在处理您无法控制的导入数据集时，您可能会经常发现只需要大型数据表中的几列。如果是这种情况，您很快就会厌倦按住\
  \ Ctrl 键单击众多列来选择要删除的列。Power Query 提供了另一种方法。只需选择要保留的列，然后删除其他列即可。操作如下：\n\n1.  按住 Ctrl\
  \ 键单击要保留的列的标题。\n2.  单击“主页”功能区中“删除列”按钮旁边的小三角形。从菜单中选择 `删除其他列`。所有未选定的列都将被删除，并且 `已删除其他列`\
  \ 将被添加到“应用的步骤”列表中。\n\n在选择要删除或保留的连续列范围时，可以使用标准的 Windows Shift 单击技术，从要选择的列块中的第一列选择到最后一列。\n\
  \n**注意**  \n如果您愿意，这两种删除列的选项也可以通过上下文菜单使用。删除列时，上下文菜单会显示 `删除`（或 `删除列`，如果选择了多列），如果您右键单击列标题，还会显示\
  \ `删除其他列`。\n\n\n\n### 选择列\n\n如果你不喜欢在宽数据集中滚动，但仍需要选择一部分列作为报表的基础，那么还有另一种方法可以定义你要使用的字段集合。你可以像这样选择要保留的列（相应地，也就定义了要排除的列）：\n\
  \n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig9_HTML.jpg](img/497001_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9. “选择列”对话框\n\n1.  打开文件夹 `C:\\DataMashupWithExcelSamples` 中的示例文件 `Chapter06Sample1.xlsx`（如果尚未打开）。\n\
  2.  在右侧的 `查询和连接` 窗格中（可通过“数据”功能区中的 `查询和连接` 选项切换其显示状态），双击连接 `BaseData`。查询编辑器将打开。\n\
  3.  在查询编辑器的“开始”功能区中，单击 `选择列` 按钮。\n4.  单击 `(全选列)` 以取消选择数据集中的所有列。\n5.  选择 `Make`、`Model`、`Color`\
  \ 和 `SalePrice` 这些列。`选择列` 对话框将如图 6-9 所示。\n6.  单击 `确定`。查询编辑器将仅显示你选择的列。\n\n`选择列` 对话框附带一些额外功能，在您选择要使用的列集时可能会很有用：\n\
  \n-   您可以通过单击 `选择列` 对话框右上角的排序图标（小 `A-Z`）并选择所需选项，按字母顺序排序列列表（或恢复为原始顺序）。\n-   只需在对话框顶部的\
  \ `搜索列` 字段中输入几个字符，即可过滤显示的列列表。\n-   `(全选列)` 选项可在全选和取消全选列表中的所有列之间切换。\n\n## 合并列\n\n\
  源数据并不总是完全如您所愿（有时这还是一种轻描淡写的说法）。某些数据源的数据可能分布在许多列中，而这些列完全可以合并到单个列中。因此，发现 Power Query\
  \ 也能执行此类操作可能并不令人意外。操作方法如下：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig10_HTML.jpg](img/497001_1_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10. “合并列”对话框\n\n1.  按住 Ctrl 键并单击要合并的列的标题（本例中为 `BaseData` 数据集中的 `Make` 和 `Model`）。\n\
  2.  在“转换”功能区中，单击 `合并列` 按钮。将显示 `合并列` 对话框。\n3.  从 `分隔符` 弹出菜单中选择一个可用的分隔符元素。在此示例中，我选择了\
  \ `冒号`。\n4.  为由两个原始列创建的新列输入名称（我将其命名为 `MakeAndModel`）。对话框应如图 6-10 所示。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig11_HTML.jpg](img/497001_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11. 合并列的结果\n\n5.  单击 `确定`。您选择的列将被替换为在步骤 1 中所有选定列的数据，如图 6-11 所示。\n6.  重命名生成的列（Power\
  \ Query 将其命名为 `Merged`）。\n\n我需要对此过程做几点说明：\n\n-   合并列时，您可以选择任意数量的列。\n-   如果在 `合并列`\
  \ 对话框中未给结果列命名，它将简单地被命名为 `Merged`。您以后随时可以根据需要重命名它。\n-   选择列的顺序会影响数据合并的方式。因此，始终从选择其数据必须出现在合并列左侧的列开始，然后是其数据应出现在下一位置的列，依此类推。您不必按照列在数据集中最初的顺序来选择它们。\n\
  -   如果您不想使用 Power Query 建议的任何标准分隔符，可以随时自定义。只需在 `合并列` 对话框的弹出菜单中选择 `--自定义--`。对话框中会出现一个新框，您可以在其中输入您选择的分隔符。如果您真的需要，它可以由多个字符组成。\n\
  -   从“转换”功能区合并列会删除所有选定的列，并用单个列替换它们。相同的选项也可从“添加列”功能区获得——只是在这种情况下，此操作会*添加*一个新列，并保留数据集中的原始列。\n\
  \n**注意：** 如果您右键单击列标题，此选项也可从上下文菜单中获得。\n\n可用的合并分隔符在表 6-5 中进行了描述。\n\n**表 6-5.** 合并分隔符\n\
  \n| 选项 | 描述 |\n| --- | --- |\n| `冒号` | 使用冒号 (`:`) 作为分隔符 |\n| `逗号` | 使用逗号 (`,`) 作为分隔符\
  \ |\n| `等号` | 使用等号 (`=`) 作为分隔符 |\n| `分号` | 使用分号 (`;`) 作为分隔符 |\n| `空格` | 使用空格 (`\
  \ `) 作为分隔符 |\n| `制表符` | 使用制表符作为分隔符 |\n| `自定义` | 允许您输入自定义分隔符 |\n\n**提示：** 如果您愿意，可以使用上下文菜单来拆分、删除和复制列。只需记住右键单击列标题以显示正确的上下文菜单。\n\
  \n### 转到特定列\n\nPower Query 可以加载包含数百列的数据集。由于在数十列之间左右滚动可能会让人非常沮丧，因此您可以随时跳转到特定的列。\n\
  \n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig12_HTML.jpg](img/497001_1_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12. “转到列”对话框\n\n1.  在查询编辑器的“开始”功能区中，单击 `选择列` 按钮底部的小三角形。选择 `转到列`。将出现 `转到列`\
  \ 对话框。\n2.  选择您要跳转到的列。对话框将如图 6-12 所示。\n3.  单击 `确定`。Power Query 将选择所选列。\n\n**提示：**\
  \ 如果您愿意，可以在 `转到列` 对话框中双击列名称以跳转到所选列。\n\n## 删除记录\n\n您可能并非始终需要已加载到 Power Query 中的*所有*数据。这可能有几个原因：\n\
  \n-   您正在初步查看数据，只需要一个样本来了解数据的概况。\n-   数据包含您明确不需要且从一开始就能轻松识别的记录。\n-   您正在测试数据清理，并且想要一个更小的数据集来真正加速复杂数据提取和转换过程的开发。\n\
  -   您想要分析一个精简后的数据集以推断出论点，将完整数据集的分析留待以后，或者使用更强大的工具集，例如 SQL Server Integration Services。\n\
  \n为了允许您减小数据集的大小，Power Query 提供了两种基本方法：\n\n-   保留某些行\n-   删除某些行\n\n不可避免的是，您采用哪种技术将取决于具体情况。如果通过包含来指定要采样的行更容易，那么保留某些行的方法是最佳选择。相反，如果您想通过排除来进行，那么删除某些行的技术是最好的。让我们依次看看这些方法。\n\
  \n\n\n\n### 保留行\n\n此方法允许你指定要继续使用的行。其基于以下三个选项之一的应用：\n\n- 保留前 *n* 条记录。\n- 保留后 *n*\
  \ 条记录。\n- 保留指定范围的记录——即，每 *y* 条记录保留 *n* 条。\n\n这些技术大多非常相似，所以我们先设想你希望保留示例文件 `C:\\DataMashupWithExcelSamples\\\
  Chapter06Sample1.xlsx` 中的前 50 条记录。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig13_HTML.jpg](img/497001_1_En_6_Fig13_HTML.jpg)\n\
  \n**图 6-13.** `保留首行` 对话框\n\n1. 打开源文件，然后在“查询和连接”窗格中双击 `BaseData` 查询，打开 `Power Query\
  \ 编辑器`。\n2. 在“查询编辑器”的“主页”功能区中，点击“保留行”按钮。将出现菜单。\n3. 选择“保留首行”。将出现“保留首行”对话框。\n4. 在“行数”框中输入\
  \ `50`，如图 6-13 所示。\n5. 点击“确定”。除前 50 条记录外的所有记录均被删除，并且“已保留首行”被添加到“应用的步骤”列表中。\n\n要保留后\
  \ *n* 行，方法几乎完全相同。按照上一个示例中的步骤操作，但在步骤 2 中选择“保留尾行”。在这种情况下，“应用的步骤”列表会显示“已保留尾行”。\n\n\
  要保留一个范围的记录，你需要指定起始记录以及从该处开始要保留的记录数。例如，假设你想丢掉前 10 条记录，但保留接下来的 25 条。操作步骤如下：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig14_HTML.jpg](img/497001_1_En_6_Fig14_HTML.jpg)\n\
  \n**图 6-14.** `保留行的范围` 对话框\n\n1. 在“主页”功能区中，点击“保留行”按钮。\n2. 选择“保留行的范围”。将出现“保留行的范围”对话框。\n\
  3. 在“首行”框中输入 `11`。\n4. 在“行数”框中输入 `25`，如图 6-14 所示。\n5. 点击“确定”。除了记录 1-10 和从 36 到末尾的记录外，所有记录均被删除，并且“已保留行的范围”被添加到“应用的步骤”列表中。\n\
  \n### 删除行\n\n删除行的过程与你刚刚使用的保留行过程几乎相同。由于删除前 *n* 或后 *n* 行非常相似，我就不详细介绍了。你只需点击“主页”功能区中的“删除行”按钮，然后像保留行一样进行操作即可。在这种情况下，“应用的步骤”列表会显示“已删除首行”或“已删除尾行”，并且记录会被删除，而非保留在数据集中。\n\
  \n删除行的方法确实有一个非常有用的选项，可以用作采样技术。它允许你每隔几条记录就删除一条或多条记录，以生成源数据的子集。为此，你需要执行以下操作：\n\n1.\
  \ 在“查询”窗口的“主页”功能区中，点击“删除行”按钮。将出现菜单。\n2. 选择“删除隔行”。将出现“删除隔行”对话框。\n3. 输入 `10` 作为“要删除的首行”。\n\
  4. 输入 `2` 作为“要删除的行数”。\n5. 输入 `10` 作为“要保留的行数”。\n\n对话框将如图 6-15 所示。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig15_HTML.jpg](img/497001_1_En_6_Fig15_HTML.jpg)\n\
  \n**图 6-15.** `删除隔行` 对话框\n\n6. 点击“确定”。除了与你对话框中输入的模式匹配的记录外，所有记录均被删除。随后，“已删除隔行”被添加到“应用的步骤”列表中。\n\
  \n> **注意：** 如果你确实决心提取一个你认为能代表关键数据的样本，那么你始终可以在子集化数据之前过滤数据以排除任何异常值。本章稍后会解释数据过滤。\n\n\
  ### 删除空行\n\n如果你的源数据包含完全为空的行，你可以按如下方式删除它们：\n\n1. 在“查询”窗口的“主页”功能区中，点击“删除行”按钮。将出现菜单。\n\
  2. 选择“删除空行”。\n\n这将导致空行被删除。随后，“已删除空行”被添加到“应用的步骤”列表中。\n\n### 删除重复记录\n\n外部数据源可能并不像你希望的那么完美。低质量数据最令人困扰的特性之一就是存在重复项。这些重复项具有危害性，因为它们会伪造结果，而且并不总是可见。如果你怀疑数据表包含*严格*重复项（即，两条或更多记录中的*每个*字段都相同），那么你可以像这样删除重复项：\n\
  \n1. 点击表弹出菜单中的“删除重复项”（位于表格网格的左上角）。所有重复记录均被删除，并且“已删除重复项”被添加到“应用的步骤”列表中。\n\n> **注意：**\
  \ 我必须强调，该方法只会移除*完全*相同的记录，即重复行中每一列的每个元素都严格相同。如果两条记录只有一个字符或数字不同，但其他所有内容都相同，那么它们*不会*被\
  \ `Power Query` 视为重复项。或者，如果你想隔离并检查重复记录，你可以通过从表的弹出菜单中选择“保留重复项”，仅显示完全相同的记录。\n\n所以，如果你怀疑或确信正在处理的数据表包含重复项，实际的解决方案是什么？这可能是一个真正的难题，但有一些你可以应用的基本技术：\n\
  \n- 移除所有你确定在后续数据处理过程中不会用到的列。这样，`Power Query` 就只会被要求比较潜在重复记录中的关键数据。\n- 根据核心列对数据进行分组（本章稍后会解释）。\n\
  \n> **注意：** 如你所见，`Power Query` 可以帮助你只需点击几下即可聚焦于数据集中的关键元素。需要注意的是，在从查询中排除数据时，要小心*不要删除*有价值的数据——以免因此导致分析结果出现偏差。\n\
  \n## 数据排序\n\n虽然严格来说这不是一个数据修改步骤，但在某个阶段，你可能希望对导入的表进行排序，哪怕只是为了更清楚地了解你所处理的数据。按以下步骤对数据进行排序：\n\
  \n1. 打开文件夹 `C:\\DataMashupWithExcelSamples` 中的示例文件 `Chapter06Sample1.xlsx`（如果尚未打开）。\n\
  2. 在右侧的“查询和连接”窗格中，双击连接 `BaseData`。将打开“查询编辑器”。\n3. 点击你想排序的列内部。\n4. 在“主页”功能区中点击“升序排序”（`A/Z`\
  \ 图标）或“降序排序”（`Z/A` 图标）。\n\n数据将按字母顺序（从小到大）或反向字母顺序（从大到小）排序。如果你想执行复杂的排序操作（例如，先按某列排序，如果该列在多行中包含相同元素，则再按另一列排序），只需依次对各列进行排序即可。`Power\
  \ Query 编辑器`会在列标题右侧添加一个微小的 `1`、`2`、`3` 等数字来指示排序顺序。你可以在图 6-16 中看到这一点，我*首先*按 `Make`\
  \ 列排序，*最后*按 `Model` 列排序。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig16_HTML.jpg](img/497001_1_En_6_Fig16_HTML.jpg)\n\
  \n**图 6-16.** 对多列进行排序\n\n如果你仔细查看列标题，你会看到指示排序顺序的微小 `1` 和 `2`，以及指示该列按升序排序的箭头。\n\n\
  > **注意：** 另一种数据排序技术是点击列的弹出菜单（列标题右侧的向下三角形），然后从弹出菜单中选择“升序排序”或“降序排序”。\n\n\n\n### 反转行顺序\n\
  \n如果你发现正在查看的数据看起来上下颠倒了（即底部的行出现在顶部，反之亦然），只需单击一下即可反转行顺序（如果你愿意的话）。具体操作如下：\n\n在`转换`功能区中，单击`反转行`按钮。\n\
  \n整个数据集将被反转，底部的行将变为顶部的行。\n\n### 撤销排序操作\n\n如果你之后决定不想保留数据的排序状态，可以随时撤销排序操作，方法如下：\n\n\
  ![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig17_HTML.jpg](img/497001_1_En_6_Fig17_HTML.jpg)\n\
  \n**图 6-17.** 移除排序操作\n\n1. 单击用作排序依据的列名称右侧的排序图标。将出现上下文菜单，如图 6-17 所示。\n1. 单击`清除排序`。\n\
  \n你应用的排序顺序将被移除，数据将恢复为其原始的行顺序。\n\n由于排序数据被视为数据修改过程的一部分，它也会在`已应用步骤`列表中显示为`已排序行`。这意味着你也可以通过删除`已应用步骤`列表中的相关步骤来移除排序操作。\n\
  \n**注**\n\n如果你对数据集中的多个列进行了排序，可以选择通过单击你用来排序数据的*第一个*列来移除所有应用的排序顺序。这将移除你应用于*所有*用来定义排序条件的列的排序顺序。如果你只想撤销用于对记录集进行排序的最后一列的排序，则可以仅清除该列上的排序操作。\n\
  \n## 筛选数据\n\n根据我的经验，限制数据集最常用的方法是在已加载的表格上使用筛选器。现在，我意识到你可能是用了多年 Excel 之后，或者使用了一段时间\
  \ Power Pivot 之后才接触 Power Query，你即将看到的筛选技术可能看起来与你在那两种工具中使用的技术非常相似。然而，由于在加载源数据时包含和排除适当的记录是基础操作，我宁愿详细解释\
  \ Power Query 的筛选器，即使这意味着某些读者会有强烈的既视感。\n\n在 Power Query 中筛选数据有两种基本方法：\n\n* 从所选列的唯一元素列表中选择一个或多个特定值。\n\
  * 定义要包含或排除的数据范围。\n\n第一种方法适用于所有数据类型，无论是文本、数字还是日期/时间。第二种方法则根据用于筛选数据的列的数据类型而有所不同。\n\
  \n### 选择特定文本值\n\n选择数据列中存在的一个或多个值非常简单（假设你仍在处理 Excel 文件 `Chapter06Sample1.xlsx` 并位于`查询编辑器`中）：\n\
  \n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig18_HTML.jpg](img/497001_1_En_6_Fig18_HTML.jpg)\n\
  \n**图 6-18.** 筛选菜单\n\n1. 单击一列的弹出菜单。（我在此处使用了示例数据集 `Chapter06Sample1.xlsx` 中的 `品牌`\
  \ 列。）将出现筛选菜单。\n2. 勾选所有你想保留的元素，并取消勾选所有你想排除的元素。在此示例中，我保留了 `宾利` 和 `劳斯莱斯`，如图 6-18 所示。\n\
  1. 单击`确定`。`已筛选行`被添加到`已应用步骤`列表中。\n\n**注**\n\n你可以通过单击（全选）复选框取消选择所有项；再次选择此复选框可重新选择所有项。因此，如果你只想保留几个元素，先取消选择所有元素，然后只选择你想保留的元素可能会更快。如果你想排除在正在筛选的列中没有值的任何记录，请从筛选菜单中选择`删除空值`。\n\
  \n### 在筛选列表中查找元素\n\n在筛选列表中上下滚动可能会极其繁琐。将列表快速限制为可用元素子集的方法是执行以下操作（假设你仍在处理 Excel 文件\
  \ `C:\\DataMashupWithExcelSamples\\Chapter06Sample1.xlsx` 的`查询编辑器`中）：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig19_HTML.jpg](img/497001_1_En_6_Fig19_HTML.jpg)\n\
  \n**图 6-19.** 搜索筛选菜单\n\n1. 单击一列的弹出菜单。（我在本例的示例数据集中使用了 `型号` 列。）将出现筛选菜单。\n2. 在`搜索`框中输入一个或几个字母。你输入的每个字母或数字都会使列表变短。如果输入\
  \ `ar`，则筛选弹出窗口将如图 6-19 所示。\n1. 选择要筛选的元素，然后单击`确定`。\n\n要移除筛选器，只需单击`搜索`框右侧出现的叉号即可。\n\
  \n### 筛选文本范围\n\n如果列包含文本，则可以使用特定选项来筛选数据。这些选项位于任何基于文本的列的筛选弹出窗口的`文本筛选器`子菜单中。选项见表 6-6。\n\
  \n**表 6-6.** 文本筛选选项\n\n| 筛选选项 | 描述 |\n| --- | --- |\n| 等于 | 设置必须与单元格内容匹配的文本 |\n\
  | 不等于 | 设置必须*不*与单元格内容匹配的文本 |\n| 开头是 | 设置在单元格内容左侧的文本 |\n| 开头不是 | 设置必须*不*出现在单元格内容左侧的文本\
  \ |\n| 结尾是 | 设置在单元格内容右侧的文本 |\n| 结尾不是 | 设置必须*不*出现在单元格内容右侧的文本 |\n| 包含 | 允许输入将作为单元格内容一部分的文本\
  \ |\n| 不包含 | 允许输入将*不*作为单元格内容一部分的文本 |\n\n### 筛选数字范围\n\n如果列包含数字，则还可以使用特定选项来筛选数据。这些选项位于任何基于数字的列的筛选弹出窗口的`数字筛选器`子菜单中。选项见表\
  \ 6-7。\n\n**表 6-7.** 数字筛选选项\n\n| 筛选选项 | 描述 |\n| --- | --- |\n| 等于 | 设置必须与单元格内容匹配的数字\
  \ |\n| 不等于 | 设置不得与单元格内容匹配的数字 |\n| 大于 | 单元格内容必须大于此数字 |\n| 大于或等于 | 单元格内容必须大于或等于此数字\
  \ |\n| 小于 | 单元格内容必须小于此数字 |\n| 小于或等于 | 单元格内容必须小于或等于此数字 |\n| 介于 | 单元格内容必须介于你指定的两个数字之间\
  \ |\n\n\n\n### 筛选日期和时间范围\n\n如果列中包含日期或时间（或两者兼有），则还可以应用特定选项来筛选数据。这些元素位于任何基于文本的列的筛选弹出窗口中的`Date/Time\
  \ Filters`子菜单下。选项如表 6-8 所示。\n\n**表 6-8.** 日期和时间筛选选项\n\n| 筛选元素 | 说明 |\n| --- | ---\
  \ |\n| `Equals` | 筛选数据，仅包含所选日期的记录 |\n| `Before` | 筛选数据，仅包含所选日期之前的记录 |\n| `After`\
  \ | 筛选数据，仅包含所选日期之后的记录 |\n| `Between` | 允许您设置一个上界和下界日期，以排除该范围之外的记录 |\n| `In the Next`\
  \ | 允许您指定未来一定数量的天、周、月、季度或年 |\n| `In the Previous` | 允许您指定截止到当前日期一定数量的天、周、月、季度或年\
  \ |\n| `Is Earliest` | 筛选数据，仅包含最早日期的记录 |\n| `Is Latest` | 筛选数据，仅包含最晚日期的记录 |\n| `Is\
  \ Not Earliest` | 筛选数据，仅包含不包括最早日期的记录 |\n| `Is Not Latest` | 筛选数据，仅包含不包括最晚日期的记录 |\n\
  | `Day ➤ Tomorrow` | 筛选数据，仅包含当前系统日期之后的日期记录 |\n| `Day ➤ Today` | 筛选数据，仅包含当前系统日期的记录\
  \ |\n| `Day ➤ Yesterday` | 筛选数据，仅包含当前系统日期之前的日期记录 |\n| `Week ➤ Next Week` | 筛选数据，仅包含下一个日历周内的记录\
  \ |\n| `Week ➤ This Week` | 筛选数据，仅包含当前日历周内的记录 |\n| `Week ➤ Last Week` | 筛选数据，仅包含上一个日历周内的记录\
  \ |\n| `Month ➤ Next Month` | 筛选数据，仅包含下一个日历月内的记录 |\n| `Month ➤ This Month` | 筛选数据，仅包含当前日历月内的记录\
  \ |\n| `Month ➤ Last Month` | 筛选数据，仅包含上一个日历月内的记录 |\n| `Month ➤ Month Name` | 筛选数据，仅包含指定日历月的记录\
  \ |\n| `Quarter ➤ Next Quarter` | 筛选数据，仅包含下一个季度的记录 |\n| `Quarter ➤ This Quarter`\
  \ | 筛选数据，仅包含当前季度的记录 |\n| `Quarter ➤ Last Quarter` | 筛选数据，仅包含上一个季度的记录 |\n| `Quarter\
  \ ➤ Quarter Name` | 筛选数据，仅包含指定季度的记录 |\n| `Year ➤ Next Year` | 筛选数据，仅包含下一年的记录 |\n\
  | `Year ➤ This Year` | 筛选数据，仅包含当前年份的记录 |\n| `Year ➤ Last Year` | 筛选数据，仅包含上一年份的记录\
  \ |\n| `Year ➤ Year To Date` | 筛选数据，仅包含从当前年初至今的记录 |\n| `Custom Filter` | 允许您为选定的日期范围设置特定筛选器。\
  \ |\n\n### 筛选数值数据\n\n无论被筛选的数据类型是文本、数值、逻辑值还是日期/时间，筛选数据都使用一种全局相似的方法。举一个简单的例子，以下是如何对售价应用数值筛选器，以查找售价低于\
  \ £5,000.00 的车辆（同样是在文件 `Chapter06Sample1.xlsx` 的 `Query Editor` 中）：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig20_HTML.jpg](img/497001_1_En_6_Fig20_HTML.jpg)\n\
  \n**图 6-20.** `Filter Rows` 对话框\n\n1. 单击 `SalePrice` 列的弹出菜单。\n2. 单击 `Number Filters`。子菜单将会出现。\n\
  3. 选择 `Less Than`。`Filter Rows` 对话框将会显示。\n4. 在“小于”框旁边的输入框中输入 `5000`，如图 6-20 所示。\n\
  5. 单击 `OK`。数据集将只显示符合您所定义筛选条件的行。\n\n尽管应用起来极其简单，但筛选器仍需要注意以下几点：\n\n- 在基本筛选器中最多可以组合两个元素。这些元素可以相互包含（`AND`\
  \ 筛选器），也可以互为替代（`OR` 筛选器）。\n- 您可以在高级筛选器中组合多个元素——您将在下一部分中了解这一点。\n- 输入数字时不应应用任何格式。\n\
  - 筛选的任何文本都不区分大小写。\n- 如果您选择了错误类型的筛选器（例如，选择了 `greater than` 而不是 `less than`），您无需取消并重新开始。只需在\
  \ `Filter Rows` 对话框左侧的弹出菜单中选择正确的筛选器类型即可。\n\n**提示**\n\n如果您设置的筛选值排除了表中的所有记录，Power\
  \ Query 将显示一个空表，并显示“此表为空。”字样。您始终可以通过单击 `Applied Steps` 列表中 `Filtered Rows` 左侧的叉号来移除该筛选器。这将删除该步骤并将数据恢复到之前的状态。\n\
  \n### 应用高级筛选器\n\n如果您在筛选数据时需要极其精确，您可以随时使用 Power Query 的高级筛选器。这些筛选器允许您扩展筛选元素，以便将记录包含或排除到非常精细的细节级别。以下是在文件\
  \ `Chapter06Sample1.xlsx` 的 `Query Editor` 中的操作步骤：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig21_HTML.jpg](img/497001_1_En_6_Fig21_HTML.jpg)\n\
  \n**图 6-21.** 高级筛选器\n\n1. 单击 `SalePrice` 列的弹出菜单。\n2. 单击 `Number Filters`。子菜单将会出现。\n\
  3. 选择 `Equals`。`Filter Rows` 对话框将会显示。\n4. 单击 `Advanced`。\n5. 在对话框中为第一个筛选元素输入值 `5000`。\n\
  6. 从弹出菜单中选择 `Or` 作为第二个筛选元素的筛选类型。\n7. 选择 `equals` 作为运算符。\n8. 在对话框中为第二个筛选器输入值 `89000`。\n\
  9. 单击 `Add Clause`。一个新的筛选元素将会添加到现有元素下方的对话框中。\n10. 选择 `Or` 作为筛选类型，选择 `equals` 作为运算符。\n\
  11. 在对话框中为第三个筛选元素输入值 `178500`。此时 `Filter Rows` 对话框将如图 6-21 所示。\n12. 单击 `OK`。Power\
  \ Query 编辑器中只会显示包含您在 `Filter Rows` 对话框中输入数值的记录。\n\n关于筛选器这个话题，我想以几点说明作为结尾：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig22_HTML.jpg](img/497001_1_En_6_Fig22_HTML.jpg)\n\
  \n**图 6-22.** 排序筛选器\n\n- 在 `Advanced filter` 对话框中，您可以通过“混合搭配”列和运算符来达到您想要的筛选结果。\n\
  - 如果需要，您还可以对筛选器序列进行排序。为此，只需单击某个筛选行内部，该行将以灰色背景显示（如图 6-21 中的第三个筛选器）。然后，单击该筛选行右侧的省略号，并从弹出菜单中选择\
  \ `Move Up` 或 `Move Down`。您可以在图 6-22 中看到这一点。\n- 要删除一个筛选器，请单击该筛选行右侧的省略号并选择 `Delete`。\n\
  \n**注意**\n\n当您处理非常大的数据集时，您可能会发现筛选器并不总能显示源数据中的所有可用值。这是因为 `Query Editor` 只加载了数据的示例子集。在这种情况下，您会在筛选弹出菜单中看到一个警告和一个“Load\
  \ more”链接。单击此链接将强制 Power Query 重新加载一个更大的数据样本集。但是，内存限制可能会阻止它加载您需要的所有数据。在这种情况下，您应考虑修改源查询（如果可能的话，例如在连接到数据库时），以便它返回一个能够放入内存的代表性数据集。\n\
  \n\n## 记录分组\n\n有时，你需要以极端方式转换原始数据——即对数据进行分组。这与筛选数据、删除重复项或清理列内容截然不同。当你对数据进行分组时，你正在改变数据集的结构，以便“汇总”记录，具体操作如下：\n\
  \n-   定义属性列，这些列将成为分组数据表中的唯一元素\n-   指定应用于分组表中任何数值列的聚合方式\n\n数据分组通常是一种极具选择性的操作。这是不可避免的，因为你选择分组的属性（即非数值）列越少，分组表中可能包含的记录就越少。然而，这始终取决于你正在处理的特定数据集，而高效地对数据进行分组始终需要技巧、实践，以及良好的、传统的反复试错。\n\
  \n### 简单分组\n\n为了理解分组是如何工作的——以及它如何从根本上改变数据集的结构——让我们看一个简单的行分组实例：\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig23_HTML.jpg](img/497001_1_En_6_Fig23_HTML.jpg)\n\
  \n图 6-23. 简单分组\n\n1.  在 Power Query 中，针对示例文件 `Chapter06Sample1.xlsx`，点击 `Make` 列内部。\n\
  2.  在 `Home` 功能区或 `Transform` 功能区中，点击 `Group By` 按钮。将出现 `Group By` 对话框，如图 6-23 所示。\n\
  3.  点击 `OK`。数据集现在将仅包含车辆品牌列表以及每个品牌的记录数。你可以在图 6-24 中看到结果。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig24_HTML.jpg](img/497001_1_En_6_Fig24_HTML.jpg)\n\
  \n图 6-24. 简单分组输出\n\n当你对数据集应用分组时，Power Query 会向 `Applied Steps` 列表中添加一个名为 `Grouped\
  \ Rows` 的步骤。\n\n> **注意：** 取消分组操作的最佳方法是删除 `Applied Steps` 列表中的 `Grouped Rows` 步骤。\n\
  \n尽管 Power Query 默认计算行数，但在分组数据时，你还可以应用其他几种操作。这些操作在表 6-9 中概述。\n\n**表 6-9.** 分组时的聚合操作\n\
  \n| 聚合操作 | 描述 |\n| --- | --- |\n| `Count Rows` | 计算记录数量 |\n| `Count Distinct Rows`\
  \ | 计算唯一记录数量 |\n| `Sum` | 返回数值列的总和 |\n| `Average` | 返回数值列的平均值 |\n| `Median` | 返回数值列的中位数\
  \ |\n| `Min` | 返回数值列的最小值 |\n| `Max` | 返回数值列的最大值 |\n| `All Rows` | 为每个分组的元素创建一个记录表\
  \ |\n\n### 复杂分组\n\nPower Query 可以通过创建更复杂的数据分组，以更高级的方式帮助你塑造数据集。例如，你可以尝试以下操作，按 `Make`\
  \ 和 `Model` 进行分组，并添加显示总销售额和平均成本的列：\n\n1.  打开示例文件 `C:\\DataMashupWithExcelSamples\\\
  Chapter06Sample1.xlsx`。\n2.  双击 `BaseData` 连接以打开查询编辑器。\n3.  选择以下列（通过 `Ctrl`+点击列标题）：\n\
  \    1.  `Make`\n    2.  `Model`\n4.  在 `Home` 功能区或 `Transform` 功能区中，点击 `Group By`。\n\
  5.  在 `新建列名称` 框中，输入 **TotalSales**。\n6.  选择 `Sum` 作为操作。\n7.  在 `列` 弹出列表中选择 `SalePrice`\
  \ 作为源列。\n8.  点击 `添加聚合` 按钮并重复操作，只是这次使用以下设置：\n    1.  *新建列名称*：**AverageCost**\n  \
  \  2.  *操作*：`Average`\n    3.  *列*：`CostPrice`\n\n`Group By` 对话框应如图 6-25 所示。\n\n\
  ![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig25_HTML.jpg](img/497001_1_En_6_Fig25_HTML.jpg)\n\
  \n图 6-25. `Group By` 对话框\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig26_HTML.jpg](img/497001_1_En_6_Fig26_HTML.jpg)\n\
  \n图 6-26. 对数据集进行分组\n\n9.  点击 `OK`。除了你在 `Group By` 对话框中指定的列之外，所有其他列都将被删除，并且表格将按图\
  \ 6-26 所示进行分组和聚合。`Grouped Rows` 将被添加到 `Applied Steps` 列表中。我同时按 `Make` 和 `Model`\
  \ 列对表格进行了排序，以便更易于理解分组。\n\n如果你创建了一个非常复杂的分组，然后意识到需要更改列的顺序，一切并非不可挽回。你可以通过点击 `Group\
  \ By` 对话框中每个列定义右侧的省略号，并选择 `上移` 或 `下移` 来更改输出中列的顺序。`Group By` 对话框中列的顺序就是结果数据集中列的顺序（从左到右）。\n\
  \n> **注意：** 你不必使用 `Ctrl`+点击来选择分组列。你可以通过点击 `添加聚合` 按钮将它们逐一添加到 `Group By` 对话框中。同样，你可以通过点击列名右侧的省略号并从弹出菜单中选择\
  \ `删除` 来移除分组列（或已添加和聚合的列）。\n\n### 行数计数\n\n在某些情况下，你可能会发现一个简单有用的选项是 `Count rows` （行数计数）功能。顾名思义，此功能显示源数据集中可用的总行数。\n\
  \n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig27_HTML.jpg](img/497001_1_En_6_Fig27_HTML.jpg)\n\
  \n图 6-27. 返回源数据集的行数\n\n1.  在 Power Query 的 `Transform` 菜单中，点击 `Count rows`。记录数将显示在现有数据集的位置，如图\
  \ 6-27 所示。\n\n## 在查询编辑器中保存更改\n\n与你可能预期的相反，你*不能*在使用 Power Query 编辑器时随时保存所做的任何更改。相反，你必须先退出查询编辑器，然后像往常一样保存底层的\
  \ Excel 文件。\n\n## 退出查询编辑器\n\n与上述保存选项类似，你可以选择如何退出查询编辑器并返回到 Excel 中的报表。默认选项（点击 `关闭并加载`\
  \ 按钮时）是应用你对数据所做的所有更改，用新数据更新数据模型（如果已选择此选项），然后返回到 Excel。\n\n但是，你还有另一个可能很有用的选项。它出现在查询编辑器的\
  \ `文件` 菜单中。\n\n![../images/497001_1_En_6_Chapter/497001_1_En_6_Fig28_HTML.jpg](img/497001_1_En_6_Fig28_HTML.jpg)\n\
  \n图 6-28. 放弃 Power Query 中的修改\n\n1.  在查询编辑器中，点击 `文件`。\n2.  选择 `放弃并关闭`。你可以在图 6-28\
  \ 中看到此选项。\n\n如果你选择不应用所做的更改，那么你将返回 Excel 工作簿，并丢失已做的所有修改——*且不会有任何确认提示*。\n\n\n\n##\
  \ 结论\n\n本章带你踏上了使用 Power Query 转换数据集的道路。你了解了如何通过删除行和列来精简数据集。你还学习了如何通过选择交替行组，从数据源中抽取数据子集。\n\
  \n你还看到了如何选择要在 Excel 中使用的列、如何在数据集中移动列，以及如何重命名列，以便在后续作为分析基础使用时，数据易于理解。接着，你了解了如何筛选和排序数据，以及如何删除重复项以确保数据集只包含后续可视化所需的精确行。最后，你学习了如何分组和聚合数据。\n\
  \n尽管如此，必须承认，准备用于分析的原始数据并非总是一帆风顺，可能需要一段时间才能将其处理好。然而，稍加练习，Power Query 就能让这项任务变得非常轻松。所以，既然你已经掌握了基础，是时候继续前进，探索更多数据转换技术了。具体来说，你将看到如何转换并潜在地清理已导入的数据。这正是下一章的主题。\n\
  \n"
- "# 7. 数据转换\n\n数据集经过筛选和塑形（如前一章所述）后，可能仍需要一些修改才能投入使用。本质上，这些修改中的许多都是你为了清理和标准化数据而应用的一系列相当简单但必要的技术。我选择将这些方法归入*数据转换*的标题下。\n\
  \n在最终将源数据加载到数据模型之前，你可能想要做的事情通常涵盖一系列*清理*数据的过程。它们可以包括以下内容：\n\n- 更改列的数据类型——例如，通过告知\
  \ Power Query 该列包含数字\n- 确保第一行用作标题（如果需要的话）\n- 移除列内容的一部分\n- 将单元格中的值替换为其他值\n- 转换列的内容——例如，将文本设为大写，或移除数字的小数部分\n\
  - 向下或向上填充数据以跨越空单元格，确保记录完整\n- 对数字列应用数学、统计（甚至三角）函数\n- 将日期或时间数据转换为日期元素，如天、月、季度、年、小时或分钟\n\
  \n转换数据不仅包括缩减数据。有时你可能需要*扩展*数据以使其可用。这通常意味着向数据表添加更多列。实现此目的的技术包括：\n\n- 复制一列，并可能更改复制列中数据的格式\n\
  - 将列中的部分数据提取到新列中\n- 将一个列中的所有多个数据元素分离，使每个数据元素出现在单独的列中\n- 将多列合并到新列中\n- 添加自定义列，这些列可能包含计算，或将列的部分数据提取到新列中，甚至连接多列\n\
  - 添加“索引”列，对行进行编号以确保唯一性或记住排序顺序\n\n本章将带你了解这些必不可少的数据转换类型。阅读完本章后，你应有信心以粗糙的原始数据源为起点，并将其转换为一个精炼且连贯的数据表，使其成为\
  \ Excel 分析中不可或缺的一部分。不仅如此，你完成这项繁重工作的速度将比使用企业级工具或你已知的大多数 Excel 技术更快、更轻松。\n\n本章练习所需的示例数据位于文件夹\
  \ `C:\\DataMashupWithExcelSamples` 中。\n\n## 查看完整记录\n\n在开始清理数据之前，你可能需要仔细查看数据。虽然 Power\
  \ Query 编辑器非常适合上下滚动列以查看单个字段的数据比较情况，但通常较难察觉单条记录的完整内容。\n\n因此，为了避免在数据行中狂乱地左右滚动，Power\
  \ Query 编辑器提供了另一个极其简单的解决方案。如果您单击某一行（更具体地说，是单击左侧网格中的行号），Power Query 编辑器将在数据集下方的单个窗口中显示整个记录的内容。你可以在图\
  \ 7-1 中看到一个示例。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig1_HTML.jpg](img/497001_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1：查看完整记录\n\n注意  \n您可以通过向上或向下拖动上下窗口之间的灰色分隔线，来调整记录集和数据集窗口的相对高度。\n\n## Power\
  \ Query 编辑器上下文菜单\n\n与 Windows 程序的常规做法一致，Power Query 编辑器充分利用了上下文（或“右键单击”）菜单作为功能区之外的替代方案。在转换数据集时，你可能会发现主要用到以下三个上下文菜单：\n\
  \n- *表菜单*：当您右键单击包含数据的网格的顶角（或单击数据网格左上角的小三角形）时，将显示此菜单。\n- *列菜单*：当您右键单击列标题时，将显示此菜单。\n\
  - *单元格菜单*：当您右键单击数据单元格时，将显示此菜单。\n\n虽然在解释如何转换数据时我已经大量引用了上下文菜单，但现在快速查看一下它们，以便你了解各种选项，可能会更容易理解。图\
  \ 7-2 快速展示了这三个上下文菜单的概览。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig2_HTML.jpg](img/497001_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2：Power Query 编辑器上下文菜单\n\n由于上下文菜单中提供的选项将在本章、前一章以及后续章节中详细解释，因此我在此不逐一说明。\n\n\
  注意  \n单元格上下文菜单中的筛选选项会反映该单元格的数据类型。因此，数值单元格将显示“数字筛选器”选项。\n\n\n\n### 将第一行用作标题\n\nPower\
  \ Query 非常擅长判断是否需要将源数据集的第一条记录用作列标题。这之所以重要，有两个原因：\n\n- 可以避免将列命名为 `Column1`、`Column2`\
  \ 等。如果你这样泛泛地命名，会使用户（甚至包括你自己）不必要地难以理解数据。\n- 可以避免在一个数字列中出现文本元素（本应是列标题），这在后续处理中可能会引发问题。这是因为一个完整的列需要具有统一的数据类型，才能应用另一种数据类型。例如，如果第一行中存在标题文本，则会妨碍为数值和日期/时间数据类型应用正确的类型。这是因为标题是文本，而该列的其余部分包含数字或日期。\n\
  \n然而，偶尔也会出现 Power Query 猜测错误的情况，它会认为数据集中的第一条记录是数据，而实际上它却是标题信息。这样一来，你看到的就不是标题，而是一组通用的列标题，比如\
  \ `Column1`、`Column2` 等。幸运的是，纠正这个问题并将第一行用作标题是一项简单任务：\n\n1. 在 Power Query 窗口的“转换”功能区中，单击“将第一行用作标题”。\n\
  \n几秒钟后，第一条记录消失，列标题变为第一条记录中的内容。右侧的“应用的步骤”列表中现在包含一个“提升的标题”元素，指示刚刚执行的操作。此步骤会被突出显示。\n\
  \n> **注意**  \n> Power Query 通常能够在数据源为数据库时自动应用此步骤。当数据源为文件时，它通常也能正确猜测。然而，它并非总能准确猜测，因此有时你需要手动干预。你可以通过检查\
  \ Power Query 是否向“应用的步骤”列表中添加了“提升的标题”步骤，来判断它是否必须猜测第一行是否包含标题。\n\n在极少数情况下，如果 Power\
  \ Query 操作错误，将并非标题的第一行误认为是列标题，你可以单击“将第一行用作标题”按钮右侧的小三角形，将标题重置回第一行。这会显示一个简短菜单，你可以在其中单击“将标题用作第一行”选项。右侧的“应用的步骤”列表中现在包含一个“降级的标题”元素，列标题变为\
  \ `Column1`、`Column2` 等。随后，你可以根据需要重命名这些列。\n\n### 更改数据类型\n\n数据修改的一个真正基本方面是确保数据类型正确；也就是说，如果你有一列数字需要在某个时候进行计算，那么该列应该是数字列。如果它包含日期，则应将其设置为日期或时间数据类型之一。我意识到这看起来可能很繁琐，甚至多余；但是，*如果你希望确保数据能够在后续流程中被正确地进行切片和切块分析*，那么从一开始就设置正确的数据类型是*至关重要的*。另一个好处是，如果你在加载数据过程的早期就验证数据类型，那么从一开始就能发现数据潜在的问题——例如，无法被识别为日期的日期。这使你能够在处理数据集的工作早期就决定如何处理质量较差或不可靠的数据。\n\
  \n好消息是，对于许多数据源，Power Query 会自动应用适当的数据类型。具体来说，如果你从数据库加载数据，Power Query 将识别每列的源数据类型，并应用合适的\
  \ Power Query 数据类型，因为数据库已提供了必要的信息，使 Power Query 能够应用正确的数据类型。不幸的是，对于文件源，情况可能会更棘手一些，特别是\
  \ CSV、文本、（偶尔）Excel 文件以及某些 XML 文件。对于这些文件类型，Power Query 通常会尝试猜测数据类型，但有时会失败。如果它已经尝试推断数据类型，你会在“应用的步骤”列表中看到“更改的类型”步骤。因此，如果你从这些源获取数据，你很可能会需要手动为许多列应用数据类型。\n\
  \n> **注意**  \n> 在某些情况下，数字并不应被解释为数值数据。例如，法国邮政编码是五位数字，但永远不会进行任何计算。因此，当数值数据类型不合适时，最好通过将数据类型更改为文本来告知\
  \ Power Query。\n\n按照以下步骤更改一列或多列的数据类型：\n\n1. 加载示例文件 `C:\\DataMashupWithExcelSamples\\\
  Chapter07Example1.xlsx`。\n2. 通过单击“数据”功能区中的“查询和连接”来显示“查询和连接”窗格（如果此窗格已可见，则无需操作）。\n\
  3. 双击“查询和连接”窗格中的 `BaseData` 查询，切换到查询编辑器。\n4. 单击要更改数据类型的列内部。如果要修改多列，请按住 `Ctrl` 键并单击相应的列标题。在此示例中，你可以选择\
  \ `CostPrice` 和 `TotalDiscount` 列。\n5. 单击“转换”功能区中的“数据类型”按钮。将出现一个包含可能数据类型的弹出菜单。\n\
  6. 选择适当的数据类型。如果你选择了 `CostPrice` 和 `TotalDiscount` 列，那么“整数”是需要选择的类型。\n\n几秒钟后，数据类型将应用完毕。“更改的类型”将出现在“应用的步骤”列表中。你可以应用的数据类型在表\
  \ [7-1] 中概述。\n\n#### 表 7-1: Power Query 中的数据类型\n\n| 数据类型             | 描述      \
  \                               |\n| ------------------ | ----------------------------------------\
  \ |\n| `十进制数`          | 将数据转换为十进制数                      |\n| `定点十进制数`      | 将数据转换为具有固定小数位数的十进制数\
  \    |\n| `整数`             | 将数据转换为整数                         |\n| `日期/时间`     \
  \   | 转换为日期时间数据类型                   |\n| `日期`             | 转换为日期数据类型          \
  \             |\n| `时间`             | 转换为时间数据类型                       |\n| `持续时间`\
  \         | 将数据设置为持续时间。用于日期和时间计算 |\n| `文本`             | 设置为文本数据类型             \
  \          |\n| `是/否`           | 将数据类型设置为布尔值（`True` 或 `False`）|\n| `二进制`      \
  \     | 将数据定义为二进制，因此不可直接查看     |\n\n> **注意**\n\n\n\n`Data Type`按钮也位于`Home`功能区中。同样，您可以右键单击列标题并选择`Change\
  \ Type`来切换不同的数据类型。\n\n不可避免地，有时您尝试应用的数据类型根本无法用于某列数据。例如，将文本列（如示例数据表中的`Make`列）转换为日期是行不通的。如果这样做，Power\
  \ Query 会将列内容替换为`Error`错误值。这并非最终结果，也毫无危险，您只需按照前一章所述的技术，在`Applied Steps`（应用步骤）列表中删除`Changed\
  \ Type`（已更改的类型）步骤，即可将数据恢复到之前的状态。\n\n有时您可能会在数据类型已经更改后，再次尝试更改它。在这种情况下，您将会看到一个类似于图\
  \ 7-3 所示的提示。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig3_HTML.jpg](img/497001_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3：`Change Column Type`（更改列类型）提示\n\n如果出现这种情况，您可以执行以下两项操作之一：\n\n*   让 Power\
  \ Query 使用您刚刚选择的数据类型来更新现有的转换步骤。\n*   添加一个新的转换步骤。\n\n您的选择将取决于您对底层数据集应用的具体转换类型。\n\n\
  同时为一组您认为需要此操作的列更改数据类型会很有帮助。采用这种方法有几个很好的理由：\n\n*   您可以集中精力设置正确的数据类型，如果工作有条理，就不太可能忘记设置某个数据类型。\n\
  *   为多个列应用数据类型（即使您是通过多次操作，对单列或多列进行设置）也只会在`Applied Steps`列表中添加一个步骤。\n\n注意：不要在 Power\
  \ Query 中寻找任何数据格式选项；它们不存在。这是有意为之，因为此工具旨在结构化、加载和清理数据，但 *不* 用于展示数据。您应在 Excel 中像往常一样进行格式化。\n\
  \n#### 检测数据类型\n\n为几十列应用正确的数据类型可能相当耗时。幸运的是，Power Query 现在包含一个选项，可以为整个表自动应用数据类型。假设您仍在位于`C:\\\
  DataMashupWithExcelSamples\\Chapter07Example1.xlsx`文件的`BaseData`查询中：\n\n1.  在`Transform`（转换）功能区中，点击`Detect\
  \ Data Type`（检测数据类型）按钮。\n2.  `Changed Type`将出现在`Applied Steps`列表中。大多数列将被应用正确的数据类型。\n\
  \n这种技术并不总能产生完美的结果，有时您会希望覆盖 Power Query 已应用的数据类型选择。然而，它仍然是数据准备工具集中一个受欢迎的补充，可以在准备数据集时为您节省大量时间。\n\
  \n#### 数据类型指示器\n\n不得不猜测每一列设置的是哪种数据类型会非常低效。因此，Power Query 通过可视化的方式为您提供帮助，指示每列对应的数据类型。如果您仔细观察每个列标题的左侧，您会看到一个小图标。每个图标都指明了该列的数据类型。每个图标的含义见表\
  \ 7-2。\n\n表 7-2：Power Query 编辑器中的数据类型图标\n\n| 数据类型图标 | 描述 |\n| --- | --- |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figa_HTML.jpg](img/497001_1_En_7_Figa_HTML.jpg)\
