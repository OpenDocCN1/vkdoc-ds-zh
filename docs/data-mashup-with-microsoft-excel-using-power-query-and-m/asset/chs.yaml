  \ | 二进制 |\n\n#### 切换数据类型\n\n另一种快速更改某列数据类型的方法是单击列标题左侧的数据类型图标，然后从右键上下文菜单中选择所需的数据类型，如图\
  \ 7-4 所示。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig4_HTML.jpg](img/497001_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4：数据类型上下文菜单\n\n#### 使用区域设置数据类型\n\n在转换数据类型时，您还可以选择使用当前区域设置来指定日期、时间和数字格式。这意味着在其他国家/地区从\
  \ Excel 打开 Power Query 的用户将看到适应当地格式惯例的日期、时间和数字格式。操作步骤如下：\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig5_HTML.jpg](img/497001_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5：`Change Type with Locale`（使用区域设置更改类型）对话框\n\n1.  打开查询编辑器（从源文件`C:\\DataMashupWithExcelSamples\\\
  Chapter07Example1.pbix`内部）。\n2.  单击列标题左侧的数据类型图标。\n3.  从弹出菜单中选择`Using Locale`（使用区域设置）。将出现`Change\
  \ Type with Locale`对话框。\n4.  从可用数据类型列表中选择要应用的新数据类型。\n5.  从全球区域设置列表中选择所需的区域设置。对话框将如图\
  \ 7-5 所示。\n6.  点击`OK`（确定）。\n\n数据类型将转换为所选的区域设置。`Applied Steps`列表中将会包含一个名为`Changed\
  \ Type with Locale`（已使用区域设置更改类型）的步骤。\n\n\n\n### 替换值\n\n在加载某些数据时，你可能需要进行一种全局查找和替换操作，将特定值替换为其他值——就像在\
  \ Microsoft Word 文档中那样。例如，也许你需要统一拼写，因为某个汽车品牌（以当前示例数据集为例）录入有误。要执行这项特定的数据清理操作（假设你已打开文件\
  \ `Chapter07Sample1.xlsx` 中的查询编辑器），请执行以下步骤：\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig6_HTML.jpg](img/497001_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** “替换值”对话框\n\n1. 单击包含要替换数据的列标题。该列将被选中。在本示例中，我使用了 `Model` 列。\n2. 在“开始”功能区中，单击“`替换值`”按钮。将弹出“替换值”对话框。\n\
  3. 在“`要查找的值`”框中，输入要替换的文本或数字。在本示例中，我输入了 `Ghost`。\n4. 在“`替换为`”框中，输入要替换成的文本或数字。在本示例中，我输入了\
  \ `Fantôme`，如图 7-6 所示。\n5. 单击“`确定`”。数据将在整个列中被替换。`替换的值` 将添加到 `应用的步骤` 列表中。\n\n关于此技术，我只有几点说明：\n\
  \n- `替换值` 过程会搜索所选列的每条记录中所有匹配的文本。它不会搜索单元格的整个内容，除非你通过勾选“高级选项”中的“`匹配整个单元格内容`”复选框来特别指定。\n\
  - 如果在开始此过程之前，单击包含要替换内容的单元格（而不是像我们刚才那样单击列标题），Power Query 会自动将该单元格内容填入“替换值”对话框作为要查找的值。\n\
  - 你只能替换包含文本元素的列中的文本。这不适用于设置为数值或日期数据类型的列。实际上，如果你输入的值与所选列的数据类型不匹配，你会在“替换值”对话框中看到一个黄色警告三角形。\n\
  - 如果你确实必须将日期或数值列中的部分数据替换为其他日期或数字，那么你可以：\n  - 将该列转换为文本数据类型\n  - 执行替换操作\n  - 将该列转换回原始数据类型\n\
  \n“替换值”对话框还有一些你可以应用的高级选项。点击左侧三角形展开“高级选项”项即可看到。这些选项如图 7-7 所示，并在表 7-3 中进行了解释。\n\n\
  **表 7-3** 高级替换选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 匹配整个单元格内容 | 仅当搜索值构成某行列的全部内容时才进行替换\
  \ |\n| 使用特殊字符替换 | 将搜索值替换为一个非打印字符 |\n| 制表符 | 将搜索值替换为一个制表符 |\n| 回车符 | 将搜索值替换为一个回车符\
  \ |\n| 换行符 | 将搜索值替换为一个换行符 |\n| 回车符和换行符 | 将搜索值替换为回车符和换行符 |\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig7_HTML.jpg](img/497001_1_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7** 高级替换选项\n\n> **注意：** 替换那些是其他单词子集的单词是危险的。在替换任何数据时，请确保除了你打算更改的元素外，不要损坏其他元素。\n\
  \n最后，纯粹作为题外话，我必须补充一点，我永远不会建议给劳斯莱斯更名，因为这近乎是汽车行业的亵渎。\n\n## 转换列内容\n\nPower Query 拥有一个强大的自动化数据转换工具箱，允许你通过多种方式标准化列的内容。这些包括：\n\
  \n- 设置文本列的大小写\n- 对数值数据进行四舍五入或应用数学函数\n- 从日期列中提取年份、月份或日期（以及其他）等日期元素\n\nPower Query\
  \ 对于将转换应用于适当类型的数据非常严格。这是因为 *转换完全取决于所选列的数据类型*。这再次证实了应用所需数据类型是应该在任何数据转换过程的早期执行的操作——当然是在\
  \ *转换列内容之前*。请记住，只有当列是数值数据类型时，你才能选择数值转换；只有当列是日期数据类型时，你才能选择日期转换。同样，基于文本的转换只能应用于文本数据类型的列。\n\
  \n### 文本转换\n\n让我们看一个实际的简单转换操作示例。作为示例，我将让 Power Query 将 `Make` 列转换为大写字符。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig8_HTML.jpg](img/497001_1_En_7_Fig8_HTML.jpg)\n\
  \n**图 7-8** “格式”菜单\n\n1. 还是在从文件 `Chapter07Example1.xlsx` 打开的查询编辑器中，单击要转换内容的列（在本示例中为\
  \ `Make` 列）的任意位置。\n2. 在“转换”功能区中，单击“`格式`”按钮。将出现一个弹出菜单。\n3. 选择“`大写`”，如图 7-8 所示。\n\n\
  整个列的内容将转换为大写。`大写的文本` 将添加到 `应用的步骤` 列表中。\n\n从 `格式` 按钮的菜单可以看出，在格式化（或转换）文本时，有七个可能的选项。这些选项在表\
  \ 7-4 中进行了解释。\n\n**表 7-4** 文本转换\n\n| 转换 | 说明 | 应用的步骤定义 |\n| --- | --- | --- |\n\
  | 小写 | 将所有文本转换为小写 | 小写的文本 |\n| 大写 | 将所有文本转换为大写 | 大写的文本 |\n| 将每个单词首字母大写 | 将每个单词的首字母转换为大写\
  \ | 每个单词已首字母大写 |\n| 修整 | 移除文本前后的所有空格 | 已修整的文本 |\n| 清理 | 移除任何非打印字符 | 已清理的文本 |\n|\
  \ 添加前缀 | 在列内容开头添加文本 | 已添加前缀 |\n| 添加后缀 | 在列内容末尾添加文本 | 已添加后缀 |\n\n> **注意：** 我知道 Power\
  \ Query 将文本转换称为格式化。尽管如此，这些选项是整体数据转换选项的一部分。\n\n### 添加前缀或后缀\n\n你还可以为列中的所有数据添加前缀或后缀。操作非常简单，如下所示：\n\
  \n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig9_HTML.jpg](img/497001_1_En_7_Fig9_HTML.jpg)\n\
  \n**图 7-9** 为文本添加前缀\n\n1. 单击要添加前缀的列内部。\n2. 在“转换”功能区中，选择“`格式`”➤“`添加前缀`”。将显示“前缀”对话框，如图\
  \ 7-9 所示。\n3. 在“`值`”字段中输入要添加的前缀。\n4. 单击“`确定`”。\n\n你指定的前缀将放置在该数据集所选字段的每条记录的开头。\n\n\
  > **注意：** 如果你向数值或日期/时间列添加前缀或后缀，则该列的数据类型将自动转换为文本。\n\n\n\n### 删除前导和尾随空格\n\n你不可避免地会遇到这样的场景：继承的数据在数据本身之前、之后或前后都包含额外的空格。这可能具有隐蔽性，因为它会导致：\n\
  \n- 数据重复，因为带有尾随空格的值被视为与没有空格的相同文本*不*相同\n- 排序问题，因为前导空格会使元素出现在排序列表的*顶部*\n- 分组错误，因为带空格的元素与不带空格的元素不属于同一组\n\
  \n幸运的是，`Power Query` 提供了一种彻底高效的解决方案来解决此问题。假设你在 Excel 文件`Chapter07Sample1.xlsx`的查询编辑器中：\n\
  \n1.  单击要转换其内容的列中的任意位置（本例中为`Make`）。\n2.  在`转换`功能区中，单击`格式`按钮。将出现一个弹出菜单。\n3.  从菜单中选择`修整`。\n\
  \n所有多余的前导和尾随空格都将从该列的数据中删除。这有助于在排序、分组和删除重复记录时使用。\n\n### 删除非打印字符\n\n某些源数据可能包含称为非打印字符的隐蔽元素。即使它们对人类来说几乎总是不可见的，也可能在某些情况下导致问题。\n\
  \n如果你怀疑源数据包含非打印字符，可以像这样简单地删除它们：\n\n1.  单击你知道包含（或怀疑包含）非打印字符的列内部（或选择这些列）。\n2.  单击`格式`\
  \ ➤ `清除`。\n\n`Power Query` 会将`已清除文本`添加到`已应用步骤`列表中。\n\n### 数字转换\n\n正如你可以转换基于文本的列的内容一样，你也可以对数值应用转换。例如，假设你想在查询编辑器中将一列中的所有数字向上舍入到最接近的整数。\n\
  \n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig10_HTML.jpg](img/497001_1_En_7_Fig10_HTML.jpg)\n\
  \n**图 7-10** 舍入选项\n\n1.  打开 Excel 文件`Chapter07Sample1.xlsx`的查询编辑器（当然，除非它已经打开）。\n\
  2.  单击要转换其内容的列中的任意位置（本例中为`TotalDiscount`）。\n3.  在`转换`功能区中，单击`舍入`按钮。将出现一个弹出菜单，显示所有可用选项。你可以在图\
  \ 7-10 中看到这一点。\n4.  选择`向上舍入`。\n\n整个列中的值将向上舍入到最接近的整数。`已向上舍入`将被添加到`已应用步骤`列表中。\n\n\
  其他可用的数值转换描述见表 7-5。由于这些数值转换在`转换`功能区中使用多个按钮或菜单选项序列，我已指出使用哪个按钮来获得所需结果。\n\n**表 7-5**\
  \ 数字转换\n\n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | --- |\n| `舍入` ➤ `向上舍入` | 将每个数字舍入到指定的小数位数\
  \ | `已向上舍入` |\n| `舍入` ➤ `向下舍入` | 将每个数字向下舍入 | `已向下舍入` |\n| `舍入...` | 将每个数字舍入到你指定的小数位数。如果指定负数，你将舍入到给定的小数位\
  \ | `已舍入` |\n| `科学` ➤ `绝对值` | 使数字成为绝对值（正数） | `绝对值` |\n| `科学` ➤ `幂` ➤ `平方` | 返回每个单元格中数字的平方\
  \ | `已计算平方` |\n| `科学` ➤ `幂` ➤ `立方` | 返回每个单元格中数字的立方 | `已计算立方值` |\n| `科学` ➤ `幂` ➤\
  \ `幂` | 将每个数字提升到你指定的幂 | `已计算幂` |\n| `科学` ➤ `平方根` | 返回每个单元格中数字的平方根 | `已计算平方根` |\n\
  | `科学` ➤ `指数` | 返回每个单元格中数字的指数 | `已计算指数` |\n| `科学` ➤ `对数` ➤ `以 10 为底` | 返回每个单元格中数字的以\
  \ 10 为底的对数 | `已计算以 10 为底的对数` |\n| `科学` ➤ `对数` ➤ `自然` | 返回每个单元格中数字的自然对数 | `已计算自然对数`\
  \ |\n| `科学` ➤ `阶乘` | 给出列中数字的阶乘 | `已计算阶乘` |\n| `三角函数` ➤ `正弦` | 给出列中数字的正弦值 | `已计算正弦`\
  \ |\n| `三角函数` ➤ `余弦` | 给出列中数字的余弦值 | `已计算余弦` |\n| `三角函数` ➤ `正切` | 给出列中数字的正切值 | `已计算正切`\
  \ |\n| `三角函数` ➤ `反正弦` | 给出列中数字的反正弦值 | `已计算反正弦` |\n| `三角函数` ➤ `反余弦` | 给出列中数字的反余弦值\
  \ | `已计算反余弦` |\n| `三角函数` ➤ `反正切` | 给出列中数字的反正切值 | `已计算反正切` |\n\n**注意**\n\n`Power\
  \ Query` 甚至不允许你尝试对文本或日期应用数值转换。如果你单击字母或日期列内部，相关的按钮将保持灰色。\n\n\n\n#### 计算数值\n\nPower\
  \ Query 也能对列中的数字应用简单算术运算。例如，假设你想将所有的销售价格乘以 110% 作为预测的一部分。以下是在 Excel 文件 `Chapter07Sample1.xlsx`\
  \ 的查询编辑器中实现此操作的方法：\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig11_HTML.jpg](img/497001_1_En_7_Fig11_HTML.jpg)\n\
  \n**图 7-11** – 对列应用计算\n\n1. 单击任意一个数字列内部。在此示例中，我使用了 `SalePrice` 列。\n2. 在 **转换** 功能区中，单击\
  \ **标准** 按钮。菜单将出现，如图 7-11 所示。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig12_HTML.jpg](img/497001_1_En_7_Fig12_HTML.jpg)\n\
  \n**图 7-12** – 对列应用计算\n\n1. 单击 **乘**。将出现 **乘** 对话框。\n2. 在 **值** 框中输入 `**1.1**`。对话框将如图\
  \ 7-12 所示。\n3. 单击 **确定**。\n\n所选列中的所有数字都将乘以 1.1。换句话说，它们现在是原始值的 110%。表 7-6 描述了可以在\
  \ Power Query 中执行的可能数学运算。\n\n**表 7-6** – 应用基本计算\n\n| 转换 | 描述 | 已应用步骤定义 |\n| ---\
  \ | --- | --- |\n| 加 | 向列中的数字添加一个选定值 | 添加到列 |\n| 乘 | 将列中的数字乘以一个选定值 | 已乘列 |\n| 减\
  \ | 从列中的数字中减去一个选定值 | 从列中减去 |\n| 除 | 将列中的数字除以一个选定值 | 已除列 |\n| 整数除 | 将列中的数字除以一个选定值并移除任何余数\
  \ | 整数除列 |\n| 模数 | 将列中的数字除以一个选定值并只保留余数 | 已计算模数 |\n| 百分比 | 将选定的百分比应用于列 | 已计算百分比 |\n\
  | 百分比为 | 将列中的值表示为您输入的值的百分比 | 已计算百分比为 |\n\n**注意：** 你也可以在 Excel 中执行多种类型的计算，避免在查询编辑器中进行计算。实际上，许多\
  \ Excel 纯粹主义者似乎更倾向于任何类似计算的操作都应在电子表格内完成，而不是在查询阶段进行。我会让你自己决定更喜欢哪种方法。\n\n最后，重要的是要记住，当你执行此类操作时，你正在修改数据。在实际工作中，在深度修改数据之前，复制一列可能更安全。这样你可以保留初始数据可用，尽管代价是增加加载时间和最终生成的\
  \ Excel 文件的大小。\n\n#### 日期转换\n\n转换日期遵循与转换文本和数字类似的原理。以下是在 Excel 文件 `Chapter07Sample1.xlsx`\
  \ 的查询编辑器中，如何从日期中提取月份的示例：\n\n1. 单击 `InvoiceDate` 列内部。\n2. 在 **转换** 功能区中，单击 **日期**\
  \ 按钮。菜单将出现。\n3. 单击 **年**。将出现子菜单。\n4. 选择 **年**。日期的年份部分将替换 `InvoiceDate` 列中的所有日期。\n\
  \n其他可能的日期转换见表 7-7。\n\n**表 7-7** – 日期转换\n\n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | ---\
  \ |\n| 年龄 | 计算原始日期与当前本地时间之间的日期和时间差（以天和小时计） | 已计算年龄 |\n| 仅日期 | 将数据转换为不含时间元素的日期 |\
  \ 已计算日期 |\n| 年 ➤ 年 | 从日期中提取年份 | 已计算年 |\n| 年 ➤ 年初 | 返回该日期所在年份的第一天 | 已计算年初 |\n| 年\
  \ ➤ 年末 | 返回该日期所在年份的最后一天 | 已计算年末 |\n| 月 ➤ 月 | 从日期中提取月份数 | 已计算月 |\n| 月 ➤ 月初 | 返回该日期所在月份的第一天\
  \ | 已计算月初 |\n| 月 ➤ 月末 | 返回该日期所在月份的最后一天 | 已计算月末 |\n| 月 ➤ 月天数 | 返回该日期所在月份的天数 | 已计算月天数\
  \ |\n| 月 ➤ 月份名称 | 返回该日期所在月份的名称 | 已计算月份名称 |\n| 日 ➤ 日 | 从日期中提取日 | 已计算日 |\n| 日 ➤ 周几\
  \ | 将星期几返回为数字（星期一为 1，星期二为 2，以此类推） | 已计算周几 |\n| 日 ➤ 年天数 | 计算该日期自年初以来的天数 | 已计算年天数\
  \ |\n| 日 ➤ 日初 | 将值转换为日期和时间的当天开始时刻 | 已计算日初 |\n| 日 ➤ 日末 | 将值转换为日期和时间的当天结束时刻 | 已计算日末\
  \ |\n| 日 ➤ 星期名称 | 将星期几返回为星期名称 | 已计算星期名称 |\n| 季度 ➤ 季度 | 返回该日期所在年份的日历季度 | 已计算季度 |\n\
  | 季度 ➤ 季初 | 返回该日期所在年份日历季度的第一个日期 | 已计算季初 |\n| 季度 ➤ 季末 | 返回该日期所在年份日历季度的最后一个日期 | 已计算季末\
  \ |\n| 周 ➤ 年周数 | 计算该日期自年初以来的周数 | 已计算年周数 |\n| 周 ➤ 月周数 | 计算该日期自月初以来的周数 | 已计算月周数 |\n\
  | 周 ➤ 周初 | 返回该日期所在周的第一天（星期一）的日期 | 已计算周初 |\n| 周 ➤ 周末 | 返回该日期所在周的最后一天（星期日）的日期 | 已计算周末\
  \ |\n\n\n\n### 时间变换\n\n您也可以使用 Power Query 将日期/时间或时间值转换为它们的组成部分。这与您应用日期变换的方式非常相似，但为了完整性，下面说明了在\
  \ Excel 文件 `Chapter07Sample1.xlsx` 的查询编辑器打开后如何执行此操作：\n\n1.  点击 `InvoiceDate` 列内部。\n\
  2.  在“转换”功能区中，点击“时间”按钮。将出现一个菜单。\n3.  点击“小时”。时间的小时部分将替换 `InvoiceDate` 列中的所有值。\n\n\
  > **注意：** 时间变换只能应用于日期/时间或时间数据类型的列。\n\n时间变换的范围如表 7-8 所示。\n\n**表 7-8** 时间变换\n\n| 转换\
  \ | 描述 | 应用的步骤定义 |\n| --- | --- | --- |\n| 仅时间 | 从日期和时间中分离出时间部分 | 提取的时间 |\n| 本地时间\
  \ | 将日期/时间从日期/时间和时区值转换为本地时间 | 提取的本地时间 |\n| 解析 | 从文本中提取日期和/或日期/时间元素 | 已解析的日期时间 |\n\
  | 小时 ➤ 小时 | 从日期/时间或日期值中分离出小时 | 提取的小时 |\n| 小时 ➤ 小时开始 | 从日期/时间或时间值中返回小时的开始时刻 | 计算的开始小时\
  \ |\n| 小时 ➤ 小时结束 | 从日期/时间或时间值中返回小时的结束时刻 | 计算的结束小时 |\n| 分钟 | 从日期/时间或时间值中分离出分钟 | 提取的分钟\
  \ |\n| 秒 | 从日期/时间或时间值中分离出秒 | 提取的秒 |\n| 最早 | 从日期/时间或时间值中返回最早的时间 | 计算的最早 |\n| 最晚 |\
  \ 从日期/时间或时间值中返回最晚的时间 | 计算的最晚 |\n\n> **注意：** 在实际工作中，您可能希望保持源列不变，而对列的副本应用数字或日期变换。要做到这一点，只需应用相同的变换技巧，但使用“添加列”功能区中的按钮，而不是“转换”功能区中的按钮。\n\
  \n#### 持续时间\n\n如果列中的值可以解释为持续时间（以天、小时、分钟和秒为单位），那么 Power Query 可以将持续时间的组成部分提取为数据变换。但是，要使此功能生效，该列*必须*设置为持续时间数据类型。这意味着\
  \ Power Query 必须将列的内容解释为持续时间。与此数据类型不兼容的任何值都将被设置为错误值。\n\n那么，您可能会问，持续时间到底是什么样的？持续时间表示为：\n\
  \n-   天\n-   小时\n-   分钟\n-   秒\n\n更具体地说，持续时间必须表示为 `天.小时:分钟:秒` 的形式。例如，一个持续时间可能是 `11.23:5:45`。这表示\
  \ 11 天、23 小时、5 分钟和 45 秒。\n\n处理持续时间时有几个注意事项：\n\n-   天数后面跟一个句点——其他分隔符是冒号。\n-   持续时间中的小时不能大于\
  \ 23。\n-   持续时间中的分钟或秒不能大于 60。\n\n如果您在 Power Query 的列中有持续时间数据，可以像这样提取其组成部分：\n\n1.\
  \  打开一个新的空白 Excel 文件。\n2.  点击 数据 ➤ 获取数据 ➤ 来自文件 ➤ 来自工作簿，并选择文件 `C:\\DataMashupWithExcelSamples\\\
  Durations.xlsx`。\n3.  点击工作表 `Sheet1`，然后点击“转换数据”打开查询编辑器。您将注意到，Power Query 会自动添加一个步骤，将\
  \ `DurationOnForecourt` 列的数据类型更改为持续时间，因为它能识别该数据格式。\n4.  点击 `DurationOnForecourt`\
  \ 列内部。\n5.  在“转换”功能区中，点击“持续时间”按钮。将出现一个菜单。\n6.  点击“小时”。时间的小时部分将替换 `InvoiceDate` 列中的所有值。\n\
  \n持续时间变换的范围如表 7-9 所示。\n\n**表 7-9** 持续时间变换\n\n| 转换 | 描述 | 应用的步骤定义 |\n| --- | ---\
  \ | --- |\n| 天 | 从持续时间值中分离出天元素 | 提取的天数 |\n| 小时 | 从持续时间值中分离出小时元素 | 提取的小时数 |\n| 分钟\
  \ | 从持续时间值中分离出分钟元素 | 提取的分钟数 |\n| 秒 | 从持续时间值中分离出秒元素 | 提取的秒数 |\n| 总天数 | 将持续时间值显示为天数，以及表示小时、分钟和秒的小数部分\
  \ | 计算的总天数 |\n| 总小时数 | 将持续时间值显示为小时数，以及表示分钟和秒的小数部分 | 计算的总小时数 |\n| 总分钟数 | 将持续时间值显示为分钟数，以及表示秒的小数部分\
  \ | 计算的总分钟数 |\n| 总秒数 | 将持续时间值显示为秒数，以及表示毫秒的小数部分 | 计算的总秒数 |\n| 乘以 | 将持续时间（及其所有组成部分）乘以您输入的值\
  \ | 已乘的列 |\n| 除以 | 将持续时间（及其所有组成部分）除以您输入的值 | 已除的列 |\n| 统计 ➤ 求和 | 返回列中所有持续时间元素的总计\
  \ | 计算的总和 |\n| 统计 ➤ 最小值 | 返回列中所有持续时间元素的最小值 | 计算的最小值 |\n| 统计 ➤ 最大值 | 返回列中所有持续时间元素的最大值\
  \ | 计算的最大值 |\n| 统计 ➤ 中位数 | 返回列中所有持续时间元素的中位数 | 计算的中位数 |\n| 统计 ➤ 平均值 | 返回列中所有持续时间元素的平均值\
  \ | 计算的平均值 |\n\n> **注意：** 如果您对持续时间进行乘法或除法运算，Power Query 会显示一个对话框，以便您输入要对持续时间进行乘法或除法的值。\n\
  \n\n\n### 向下填充空单元格\n\n假设有一个数据源，其中数据以矩阵式结构进入 Power Query。结果就是，某些列中每个元素只有一个示例，其后是一系列空单元格，直到列表中的下一个元素。如果这难以想象，那么请查看图\
  \ 7-13 中所示的示例文件 `CarMakeAndModelMatrix.xlsx`。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig13_HTML.jpg](img/497001_1_En_7_Fig13_HTML.jpg)\n\
  \n*图 7-13* — Excel 中的矩阵数据表\n\n所有这些空白单元格都是问题，因为你需要一个在数据集中没有任何空白单元格的完整数据表，才能在 Excel\
  \ 工作表和数据模型中分析数据。或者更确切地说，如果 Power Query 没有一种非常巧妙的方法来克服这个特定难题，那么空白单元格就会成为一个问题。请执行以下步骤来解决此问题：\n\
  \n1. 打开一个新的 Excel 文件。\n2. 在“数据”功能区中，单击“获取数据 ➤ 来自文件 ➤ 来自工作簿”。\n3. 在“获取数据”对话框中，选择\
  \ `Excel`。然后单击“连接”并导航到 `C:\\DataMashupWithExcelSamples\\CarMakeAndModelMatrix.xlsx`。\n\
  4. 单击“导入”，选择 `Sheet1`，然后单击“转换数据”。这将打开 Power Query 编辑器。\n5. 选择包含空单元格的列。\n6. 在“转换”功能区中，单击“填充”。菜单将出现。\n\
  7. 选择“向下”。空白单元格将被上面第一个非空单元格中的值替换。`Filled Down` 将添加到“已应用步骤”列表中。\n\n现在，表格将如图 7-14\
  \ 所示。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig14_HTML.jpg](img/497001_1_En_7_Fig14_HTML.jpg)\n\
  \n*图 7-14* — 空白单元格已被正确数据替换的数据表\n\n> **注意**：此技术旨在处理一个相当具体的问题，并且仅当导入的数据按包含缺失元素的列进行分组时才真正有效。\n\
  > \n> 尽管不常见，你也可以使用此技术从下方单元格的值填充空单元格。如果需要这样做，只需从“转换”功能区中选择“填充 ➤ 向上”。无论哪种情况，你都需要注意，该技术会应用于整个列。\n\
  \n## 提取列内容的一部分\n\n很多时候，源列的内容可能包含超过实际需要的数据。在这种情况下，Power Query 可以通过仅提取列的一部分来帮助你。此技术的工作原理如下：\n\
  \n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig15_HTML.jpg](img/497001_1_En_7_Fig15_HTML.jpg)\n\
  \n*图 7-15* — “分隔符之前的文本”对话框\n\n1. 加载示例文件 `C:\\DataMashupWithExcelSamples\\Chapter07Example1.xlsx`。\n\
  2. 单击“数据”功能区中的“查询和连接”，以显示“查询和连接”窗格。\n3. 双击 `BaseData` 查询以切换到查询编辑器。\n4. 单击 `InvoiceNumber`\
  \ 列内部。如你所见，发票编号由多个元素组成，每个元素由连字符分隔。\n5. 在“转换”功能区中，单击“提取 ➤ 分隔符之前的文本”。将显示“分隔符之前的文本”对话框。\n\
  6. 在“分隔符”字段中输入连字符（或减号）。对话框将如图 7-15 所示。\n7. 单击“确定”。字段的内容将被替换为连字符之前的字符。一个名为 `Extracted\
  \ Text Before Delimiter` 的步骤将添加到“已应用步骤”列表中。\n\n`Extract` 函数允许你从多种方式中选择一种来从列中提取数据子集。当前可用的选项在表\
  \ 7-10 中进行了解释。\n\n**表 7-10** — 提取转换\n\n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | ---\
  \ |\n| 长度 | 显示字段内容的字符长度 | `Extracted Length` |\n| 首字符 | 显示字段左侧指定数量的字符 | `Extracted\
  \ First Characters` |\n| 尾字符 | 显示字段右侧指定数量的字符 | `Extracted Last Characters` |\n|\
  \ 范围 | 显示指定起始和结束位置之间（从字段左侧算起，以字符为单位）指定数量的字符 | `Extracted Range` |\n| 分隔符之前的文本 |\
  \ 显示指定字符之前的所有文本 | `Extracted Text Before Delimiter` |\n| 分隔符之后的文本 | 显示指定字符之后的所有文本\
  \ | `Extracted Text After Delimiter` |\n| 分隔符之间的文本 | 显示两个指定字符之间的所有文本 | `Extracted\
  \ Text Between Delimiters` |\n\n### 高级提取选项\n\n三个 `Extract` 选项（“分隔符之前的文本”、“分隔符之后的文本”和“分隔符之间的文本”）允许你应用一些高级选项，从而在从列中提取数据时更进一步。这些技术将在以下两节中说明。\n\
  \n#### 分隔符之前和之后的文本\n\n如果你正在从列中间提取数据，并且使用分隔符来隔离要保留的文本，那么你有几个额外的选项可用。\n\n你可以通过单击“高级选项”从你在图\
  \ 7-15 中看到的对话框中访问这些选项。对话框将如图 7-16 所示。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig16_HTML.jpg](img/497001_1_En_7_Fig16_HTML.jpg)\n\
  \n*图 7-16* — “分隔符之前和之后的文本”对话框的“高级选项”\n\n你现在拥有的两个选项是：\n\n- **扫描分隔符**：此选项允许你选择从列内容开头向前搜索，还是从列内容末尾向后搜索，以定位你要查找的分隔符。\n\
  - **要跳过的分隔符数**：在此处你可以指定你所关注的是第 *n* 个分隔符出现的位置。\n\n#### 分隔符之间的文本\n\n“分隔符之间的文本”对话框的“高级选项”基本上允许你应用之前看到的相同选项，只是要针对起始分隔符和结束分隔符。在图\
  \ 7-17 中，你可以在“分隔符之间的文本”对话框中看到这一点。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig17_HTML.jpg](img/497001_1_En_7_Fig17_HTML.jpg)\n\
  \n*图 7-17* — “分隔符之间的文本”对话框的“高级选项”\n\n> **注意**：`Extract` 按钮可以在“转换”和“新列”功能区中找到。如果你从“转换”功能区执行此操作，则现有列的内容将被替换。如果你使用“添加列”功能区中的按钮，则将在任何现有列的右侧添加一个包含提取文本的新列。\n\
  \n\n\n### 复制列\n\n有时，你只是需要简单复制一列，不添加任何内容，也不删除任何内容。这时，`复制列` 按钮就派上用场了。\n\n1.  加载示例文件\
  \ `C:\\DataMashupWithExcelSamples\\Chapter07 Example1.xlsx`。\n2.  切换到“数据”选项卡，点击\
  \ `查询和连接` 以显示 `查询和连接` 窗格（如果它尚未显示）。\n3.  双击 `BaseData` 查询以切换到查询编辑器。\n4.  点击你想要复制的列的内部（或标题）。在本示例中，我将使用\
  \ `Make` 列。\n5.  在 `添加列` 选项卡中，点击 `复制列` 按钮。几秒钟后，该列的一个副本将在现有表格的右侧创建。`复制的列` 将出现在 `应用的步骤`\
  \ 列表中。\n6.  滚动到表格的右侧，重命名现有的列；当前其名称为 `Make-Copy`。\n\n**注意**\n\n复制的列被命名为 `原始列名-Copy`。我发现，在数据混合过程中，尽早重命名列的副本会有所帮助，而不是延迟操作。\n\
  \n## 拆分列\n\n有时，源列包含的数据确实需要拆分成两个或多个更小的数据块。以下是此情况的典型案例：\n\n-   一列包含一个由特定字符（称为*分隔符*）分隔的元素列表。\n\
  -   一列包含一个元素列表，但元素可以在列中的特定位置进行分割。\n-   一列包含需要拆分成其组成元素的拼接文本（例如银行账号或社保号码）。\n\n以下小节将解释如何处理这类情况。\n\
  \n### 按分隔符拆分列\n\n这是你可能偶尔遇到的另一个需求。导入的数据中有一列需要进一步拆分成多列，并且你希望这个过程是自动完成的。想象一个文本文件，其中的列由分号分隔，而这些子列中的每个列又包含一个由逗号分隔的元素列表。一旦你导入了文件，就需要进一步分离这个使用了不同分隔符的列中的内容。\n\
  \n以下是你可以将一个列的数据拆分到多个列的操作方法：\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig18_HTML.jpg](img/497001_1_En_7_Fig18_HTML.jpg)\n\
  \n**图 7-18** 使用分隔符拆分列\n\n1.  打开一个新的 Excel 文件。\n2.  在 `数据` 选项卡中，点击 `获取数据` ➤ `来自文件`\
  \ ➤ `来自工作簿`。\n3.  在查询编辑器中，选择示例文件 `C:\\DataMashupWithExcelSamples\\DataToParse.xlsx`。\n\
  4.  点击 `ClientList` 工作簿。\n5.  点击 `转换数据` 以打开查询编辑器。\n6.  在 `转换` 选项卡中，点击 `将第一行用作标题`。\n\
  7.  点击 `ClientList` 列的内部。你可以看到该列包含多个数据元素，每个元素由分号分隔。\n8.  在 `转换` 选项卡中，点击 `拆分列` ➤\
  \ `按分隔符`。将出现“按分隔符拆分列”对话框。\n9.  在“选择或输入分隔符”弹出窗口中，从可用选项列表中选择 `分号`（尽管查询编辑器可能已经检测到了这一点）。\n\
  10. 点击“每个分隔符实例”作为拆分文本列的位置。对话框的外观应如图 7-18 所示。\n11. 点击 `确定`。`按分隔符拆分列` 将出现在 `应用的步骤`\
  \ 列表中。\n\n初始列被替换，所有新列被命名为 `ClientList.1`、`ClientList.2` 等。创建的新列数量与分隔符数量一致；每个列被命名为`(Column.n)`，并按顺序编号。此操作的结果如图\
  \ 7-19 所示。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig19_HTML.jpg](img/497001_1_En_7_Fig19_HTML.jpg)\n\
  \n**图 7-19** 拆分列的结果\n\n这个特定的过程有几个选项，就数据而言，它们的影响可能相当深远。表 7-11 包含了可用选项的描述。\n\n**表\
  \ 7-11** 分隔符拆分选项\n\n| 选项 | 描述 |\n| --- | --- |\n| 冒号 | 使用冒号 (`:`) 作为分隔符 |\n| 逗号\
  \ | 使用逗号 (`,`) 作为分隔符 |\n| 等号 | 使用等号 (`=`) 作为分隔符 |\n| 分号 | 使用分号 (`;`) 作为分隔符 |\n|\
  \ 空格 | 使用空格 (` `) 作为分隔符 |\n| 制表符 | 使用制表符作为分隔符 |\n| 自定义 | 允许您输入自定义分隔符 |\n| 在最左侧分隔符处\
  \ | 仅在第一次出现分隔符时拆分一次列 |\n| 在最右侧分隔符处 | 仅在最后一次出现分隔符时拆分一次列 |\n| 在每个分隔符实例处 | 将列拆分为与分隔符数量相同的列数\
  \ |\n| 拆分为列 | 保持数据集中的行数不变，并为拆分操作产生的每个新元素创建新列 |\n| 拆分为行 | 为拆分操作产生的每个新元素创建一个新行，并复制现有记录，复制次数与拆分元素的数量相同\
  \ |\n\n### 分隔符拆分的高级选项\n\n按分隔符拆分文本时，有少数几个高级选项可用。当您在“按分隔符拆分列”对话框中点击 `高级选项` 元素时，会显示这些选项，并在表\
  \ 7-12 中进行了解释。\n\n**表 7-12** 分隔符拆分选项\n\n| 高级选项 ➤ 拆分的列数 | 允许您设置将数据拆分为给定字符数块的最大列数。任何多余的列都将放置在最后一列中\
  \ |\n| --- | --- |\n| 高级选项 ➤ 引号字符 | 不将双引号内的文本中的分隔符用于拆分文本为列。将此选项设置为“无”将拆分引号内的元素 |\n\
  | 使用特殊字符拆分 | 启用 `插入特殊字符` 按钮。然后您可以点击此按钮并选择要用于拆分数据的特殊字符。可选选项包括制表符、回车符、换行符、回车符和换行符以及不间断空格\
  \ |\n\n\n\n### 按字符数拆分列\n\n此主题的另一种变体是，当每列中的文本具有固定的字符数，并且需要在特定间隔处将其分解为组成部分时。例如，假设某个字段中每组（特定数量）的字符具有特定含义，而你想将其拆分为多列。或者，假设你想提取最左侧或最右侧的\
  \ *n* 个字符并保留其余部分。银行账号或社会保险号就是这样的例子。此时，按字符数拆分列就能派上用场。由于其原理与我们刚刚看到的流程非常相似，此处不再赘述。你只需在上一个练习的步骤\
  \ 8 中选择“按字符数”菜单选项即可。下表 7-13 列出了此类型操作的选项。\n\n**表 7-13** 按字符数拆分列时的选项\n\n| 选项 | 说明\
  \ |\n| --- | --- |\n| 字符数 | 允许你定义拆分列之前数据的字符数 |\n| 一次，尽可能向左 | 仅在从左侧起指定字符数处拆分列一次（如果行中数据的长度允许）\
  \ |\n| 一次，尽可能向右 | 仅在从右侧起指定字符数处拆分列一次（如果行中数据的长度允许） |\n| 重复 | 根据需要多次拆分列，以按定义的字符数将其分割成若干段\
  \ |\n| 高级选项 ➤ 拆分成列数 | 允许你设置一个最大列数，用于将数据按给定字符数分块拆分。任何多余的列都将放置在最右侧的列中 |\n| 拆分到列 |\
  \ 保持数据集中的行数不变，并为拆分操作产生的每个新元素创建新列 |\n| 拆分到行 | 为拆分操作产生的每个新元素创建新行，并重复现有记录，重复次数与拆分元素的数量相同\
  \ |\n\n拆分列时需要注意以下几点：\n\n-   当按分隔符拆分时，Power Query 会尽力猜测源列必须拆分到的最大列数。如果猜测错误（你可以展开\
  \ `高级选项` 框查看它的估算值），你可以在此处覆盖该数字。\n-   如果选择 `自定义分隔符`，Power Query 会在对话框中显示一个新框，你可以在其中输入特定的分隔符。\n\
  -   并非每条记录都必须具有相同数量的分隔符。如果某行的拆分元素较少，Power Query 只需将最右侧的列留空即可。\n\n**注意：** 只有当列是文本数据时才能拆分。如果你尝试拆分日期或数字列，`拆分列`\
  \ 按钮将保持灰色不可用。但是，你可以在拆分列之前将数据类型从日期、日期时间或数字数据类型转换为文本数据类型。\n\n## 合并列\n\n读到本节标题时，你可能会感到一种似曾相识的错觉。毕竟，我们在前一章中已经看到了如何合并列（即将多列中的数据合并到一个更宽的单一列中），不是吗？\n\
  \n是的，确实如此。然而，这并不是本章中你唯一会看到之前尝试过的内容。这是因为 Power Query 在 `添加列` 功能区中重复了 `转换` 功能区中的几个选项。虽然这些功能的工作原理大致相同，但有一个关键区别。如果你从\
  \ `转换` 功能区选择一个选项，那么你选择的列会被*修改*。如果你从 `添加列` 功能区选择类似的选项，则原始列不会被更改，而是会添加一个*新列*，其中包含数据转换的结果。\n\
  \n合并列就是一个典型的例子。由于我在前一章中已详细介绍了如何执行此类数据转换，因此这里不再重复描述。简而言之，如果你按住 `Ctrl` 键单击两个或多个列的标题，然后在\
  \ `添加列` 功能区中单击 `合并列`，你仍然会看到所选列的数据被连接成一个单独的列。但是，这次原始列*仍然保留*在数据集中。新列被命名为 `Merged`，这与使用\
  \ `转换` 功能区合并列时选择的第一个列的情况完全相同。\n\n以下是可以覆盖现有列中的数据*或*将结果显示为新列的其他功能：\n\n-   *格式*：修剪文本或更改文本的大小写\n\
  -   *提取*：取列的一部分并据此创建另一列\n-   *解析*：添加一个包含源列数据（作为 JSON 或 XML 字符串）的列\n-   *统计*：创建一个新的聚合数值列\n\
  -   *标准*：创建一个新的计算数值列\n-   *科学*：通过对列中的值应用某些数学运算来创建一个新列\n-   *三角*：通过对列中的值应用某些三角运算来创建一个新列\n\
  -   *舍入*：通过对列中的值进行舍入来创建一个新列\n-   *信息*：创建一个新列，指示列中值的算术信息\n-   *日期*：通过从日期列的值中提取日期元素来创建一个新列\n\
  -   *时间*：通过从时间或日期/时间列的值中提取时间元素来创建一个新列\n-   *持续时间*：通过计算两个日期或日期/时间之间的持续时间来创建一个新列。\n\
  \n在转换数据时，技巧在于决定在应用这些功能之一之前你是否想或需要保留原始列。然而，如果后来发现做出了错误的决定，也并非至关重要，因为你随时可以回溯。或者，你也可以始终将插入新列作为一项原则，然后在数据转换过程的后期阶段删除任何你确实不需要的列。\n\
  \n\n\n## 从示例创建列\n\n如果你之前没有太多使用 Excel 或 Power Pivot 公式的经验，自己创建列可能会有些棘手，因此 Power Query\
  \ 开发团队试图通过添加另一种创建自定义列的方式，让你的工作更轻松。你可以利用行中的实际数据来构建新列，而无需通过列名（并处理方括号和其他特殊字符）来引用列。\n\
  \n以下步骤展示了如何操作：\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig20_HTML.jpg](img/497001_1_En_7_Fig20_HTML.jpg)\n\
  \n**图 7-20** – 从示例创建列\n\n1. 加载 `C:\\DataMashupWithExcelSamples\\Chapter07Example1.xlsx`\
  \ 示例文件。\n2. 如有必要，通过单击 `数据` 功能区中的 `查询和连接` 来显示 `查询和连接` 窗格。\n3. 双击 `BaseData` 查询以切换到\
  \ `查询编辑器`。\n4. 在 `添加列` 功能区中，单击 `从示例创建列`。数据上方将出现一种新型公式栏。其外观将如图 7-20 所示。同时，在现有数据的右侧将创建一个新的空白列。\n\
  \n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig21_HTML.jpg](img/497001_1_En_7_Fig21_HTML.jpg)\n\
  \n**图 7-21** – 从示例创建列时显示行数据\n\n5. 双击右侧的新列。将显示每个字段中的数据列表，如图 7-21 所示。\n6. 双击 `Red`\
  \ 以选择 `Color` 列中的数据。\n7. 输入一个空格、一个连字符和一个空格，然后输入 **Camargue**（这是此行模型名称）。\n8. 单击顶部公式栏中的\
  \ `确定`。\n\n`Power Query` 将添加一个新列，其中包含颜色、分隔符以及 `Model`。`已插入的合并列` 将被添加为 `应用的步骤` 列表中的一个新步骤。实际上，`Power\
  \ Query` 所做的是*使用列内容作为列名的代理*。\n\n> **注意**  \n> 在 `从示例创建列` 按钮的弹出菜单中，你可以选择将所有现有列作为示例基础，或者仅选择你之前选定的任何列。\n\
  \n从这个简短的示例可以看出，通过示例创建列允许你使用列中的数据，而不是列名。它还省去了编写代码创建新列（如上一节所述）时需要使用双引号和 & 字符的麻烦。\n\
  \n> **提示**  \n> 如果你选择 `从示例创建列` ➤ `从所选内容`，那么在双击新列以查看数据示例时（如本示例步骤 6 所示），你只会看到所选列中的数据。\n\
  \n## 添加条件列\n\n并非所有额外的列都是简单提取或连接现有数据。有时，你需要应用一些简单的条件来定义新列的内容。这时，Power Query 的 `条件列`\
  \ 功能就派上用场了。\n\n`条件列` 可能通过一个实际示例来理解最佳。那么，假设你想添加一个列，其中包含对 Brilliant British Cars 产品购买者类型的评注。具体操作如下：\n\
  \n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig22_HTML.jpg](img/497001_1_En_7_Fig22_HTML.jpg)\n\
  \n**图 7-22** – `添加条件列` 对话框\n\n1. 加载 `C:\\DataMashupWithExcelSamples\\Chapter07Example1.xlsx`\
  \ 示例文件。\n2. （如有需要）通过单击 `数据` 功能区中的 `查询和连接` 来显示 `查询和连接` 窗格。\n3. 双击 `BaseData` 查询以切换到\
  \ `查询编辑器`。\n4. 在 `添加列` 功能区中，单击 `条件列`。将出现 `添加条件列` 对话框。\n5. 在“新列名”字段中输入 **BuyerType**。\n\
  6. 选择 `Make` 作为列名。\n7. 将运算符保留为 `等于`。\n8. 输入 **Rolls Royce** 作为值。\n9. 输入 **Posh**\
  \ 作为输出。\n10. 单击 `添加子句`。\n11. 选择 `Make` 作为列名，将运算符保留为 `等于`，输入 **Bentley** 作为值，并添加\
  \ **Classy** 作为输出。\n12. 在 `Else` 字段中输入 **Bling**。对话框将如图 7-22 所示。\n13. 单击 `确定`。将添加新列，根据每条记录的品牌，其内容为\
  \ `Posh`、`Classy` 或 `Bling`。`已添加条件列` 将作为新步骤出现在 `应用的步骤` 列表中。\n\n从 `添加条件列` 对话框可以看出，它提供了一系列选项，你可以在定义数据匹配逻辑时进行调整。这些选项在表\
  \ 7-14 中进行了概述。\n\n**表 7-14** – 自定义列运算符\n\n| 运算符 | 描述 |\n| --- | --- |\n| `等于` |\
  \ 设置必须与所选字段内容匹配的文本，以便应用输出 |\n| `不等于` | 设置不得与所选字段内容匹配的文本，以便应用输出 |\n| `开头为` | 设置必须位于所选字段左侧的文本，以便应用输出\
  \ |\n| `非开头为` | 设置不得位于所选字段左侧的文本，以便应用输出 |\n| `结尾为` | 设置必须位于所选字段右侧的文本，以便应用输出 |\n|\
  \ `非结尾为` | 设置不得位于所选字段右侧的文本，以便应用输出 |\n| `包含` | 设置可以出现在所选字段任意位置的文本，以便应用输出 |\n| `不包含`\
  \ | 设置不能出现在所选字段任意位置的文本，以便应用输出 |\n\n同样值得注意的是，比较值、输出和替代输出可以是值（如本例所示）、列或参数（你将在第 9 章中了解）。如果要删除一条规则，只需单击所需规则右侧的省略号，然后选择\
  \ `删除`。\n\n> **提示**  \n> 如果你想更改 `添加条件列` 对话框中规则的顺序，只需单击所选规则右侧的省略号，然后从弹出菜单中选择 `上移`\
  \ 或 `下移`。\n\n\n\n## 索引列\n\n索引列是一个新列，用于按顺序对表中的每条记录进行编号。这种编号方案应用于当前已排序的表，并从零开始。在许多情况下，索引列都很有用。以下是一些示例：\n\
  \n- 重新应用之前的排序顺序。\n- 为每条记录创建唯一引用。\n- 准备一个记录集，以用作 Power Pivot 数据模型中的维度表。在这种情况下，索引列就成为了维度建模者所称的*代理键*。\n\
  \n此列表并非详尽无遗；在使用 Power Query 的过程中，您几乎肯定会发现其他用途。无论需求如何，以下是在 Power Query 中添加索引列的方法：\n\
  \n1.  在 `Add Column` 功能区中，点击 `Index Column`。新的顺序编号列会添加到表格右侧，同时 `Added Index` 会被添加到\
  \ `Applied Steps` 列表中。\n2.  滚动到表格右侧并重命名索引列；它当前的名称为 `Index`。\n\n在决定如何开始为索引列编号时，您有相当大的自由度。选项如下：\n\
  \n- 从 `0` 开始，每行递增 `1`。\n- 从 `1` 开始，每行递增 `1`。\n- 从任意数字开始，并以任意数字递增。\n\n正如您在添加索引列时所看到的，默认情况下\
  \ Power Query 从 `0` 开始对行进行编号。但是，您可以通过单击 `Add Index Column` 按钮右侧的小三角形来选择其他选项。这会显示一个包含上述三个选项的菜单。\n\
  \n选择第三个选项 `Custom`，会显示如图 7-23 所示的对话框。\n\n![../images/497001_1_En_7_Chapter/497001_1_En_7_Fig23_HTML.jpg](img/497001_1_En_7_Fig23_HTML.jpg)\n\
  \n图 7-23 – `Add Index Column` 对话框\n\n此对话框允许您指定数据集中第一行的起始编号，以及每条记录所增加的增量。\n\n## 结论\n\
  \n在本章中，您学习了一些可用于清理和结构化数据集的基本技术。您了解了如何对数字进行向上和向下舍入、如何提供格式统一的文本呈现，以及如何从数据列中删除多余的空格和非打印字符。\n\
  \n您还了解了如何替换列内的值，以及对数字应用数学、统计和三角函数的方法。其他涉及的技术包括从日期/时间和持续时间列中提取日期、时间和持续时间元素。\n\n最后，您学习了一系列基于现有列中的数据添加新列的技术。这些技术涵盖从简单的整列复制或列合并，到提取列数据的一部分，甚至使用简单逻辑推理出要添加到新列中的不同数据。\n\
  \n现在是时候了解如何将此前分离的数据集合并到单个查询中，并解析复杂数据类型以将其添加到数据集中了。您甚至将学习如何在单个查询中追加多个文件，以及如何对数据进行透视和逆透视。所有这些都将是下一章的主题。\n\
  \n"
- "# 8. 重构数据\n\n在前两章中，您了解了如何在 Power Query 中打磨您的数据集，以便只定义您真正需要作为分析基础的数据行和列。然后，您学习了如何清理和补全它们包含的数据。在本章中，您将学习如何在这些基础上进一步构建，以交付准备好塑造成结构化和可用数据模型的数据。\n\
  \n在 Power Query 中，此类数据准备的通用术语是*重构数据*。它包括以下内容：\n\n- *联接查询*：这涉及获取两个查询并将它们链接起来，以便将两个来源的数据显示为单个数据集。您将学习如何用第二个查询中的多个列扩展一个查询，以及如何聚合第二个查询中的数据并将其添加到初始数据集。您还将了解如何在合并查询时创建复杂的联接。\n\
  - *透视和逆透视数据*：如果您需要将行中的数据切换为列来显示（反之亦然），那么可以请 Power Query 编辑器帮助您精确地完成此操作。这意味着您可以保证您使用的所有表中的数据都符合标准化的表格结构，这对于\
  \ Power Query 高效运行至关重要。\n- *转置数据*：可能需要将列切换为行，反之亦然。\n\n这些技术可以——并且很可能——与您之前在第 6 章和第\
  \ 7 章中看到的许多技术一起使用。毕竟，Power Query 的一大优势在于它认识到数据转换是一项复杂的工作，因此不强加任何严格的工作方式。实际上，它允许您自由地尝试多种数据转换选项。所以请记住，在转换源数据时，您有权采取任何您想要的方法。唯一重要的是您使用它来获得您想要的结果。\n\
  \n## Power Query 编辑器视图功能区\n\n到目前为止，我们一直将注意力集中在 Power Query 编辑器的 `Home`、`Transform`\
  \ 和 `Add Column` 功能区上。这是由于一个充分且简单的理由：这些功能区几乎是所有操作发生的地方。然而，还有第四个基本的 Power Query 编辑器功能区——`View`\
  \ 功能区。它所包含的按钮如图 8-1 所示，其选项在表 8-1 中进行了说明。\n\n表 8-1 – Power Query `View` 功能区选项\n\n\
  | 选项 | 说明 |\n| --- | --- |\n| `Query Settings` | 显示或隐藏 Power Query 窗口右侧的 `Query\
  \ Settings` 窗格。其中包括 `Applied Steps` 列表 |\n| `Monospaced` | 使用等宽字体显示预览 |\n| `Show\
  \ whitespace` | 显示空白字符和换行符 |\n| `Go to Column` | 允许您选择特定列 |\n| `Always allow` |\
  \ 允许在数据源和转换对话框中进行参数化。参数化是第 11 章的主题 |\n| `Advanced Editor` | 显示 `Advanced Editor`\
  \ 对话框，其中包含查询步骤的所有代码 |\n| `Query Dependencies` | 显示查询链接和依赖关系的顺序 |\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig1_HTML.jpg](img/497001_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1 – Power Query `View` 功能区\n\n可能唯一不是马上就能自明其义的选项是 `Advanced Editor` 按钮。它将查询中所有转换的代码显示为单个“M”语言脚本块。关于这一点，您将在第\
  \ 12 章中了解更多。\n\n**提示**\n\n就我个人而言，我发现 `Query Settings` 窗格和公式栏在转换数据时对于 Power Query\
  \ 窗口来说太重要了，不能移除。因此，我倾向于让它们保持可见。然而，如果您需要屏幕空间，您随时可以暂时隐藏它们。\n\n\n\n## 合并数据\n\n到目前为止，我们一直将每个单独的查询视为独立存在。但实际上，你经常需要将一个查询的输出与另一个查询的输出结合使用，以不同方式连接来自不同数据源的数据。假设两个查询的结果共享一个（或多个）公共字段，你就可以将多个查询“联接”成一个单一的“扁平化”数据表。Power\
  \ Query 将此称为合并操作，它使你能够（除其他功能外）：\n\n-   在另一个“引用”表中查找数据元素，以添加查找数据。例如，当主表中只有客户参考代码或编号时，你可能希望添加客户名称。\n\
  -   从“明细”表（如发票行）中聚合数据，并将汇总结果包含在粒度更粗的表中，例如发票表。\n\n这个过程同样并不复杂。唯一的根本因素是，你要合并的两个表或查询必须共享一个或多个字段，以便两个表能够连贯地匹配记录。让我们来看几个例子。\n\
  \n### 使用合并数据扩展查询\n\n首先，让我们尝试通过从第二个查询添加链接数据来扩展现有查询：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig2_HTML.jpg](img/497001_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2 合并对话框\n\n1.  在一个新的空白 Excel 文件中，使用 Power Query 连接到 `C:\\DataMashupWithExcelSamples\\\
  SalesData.xlsx` Excel 文件中的两个工作表。这两个工作表分别是 `Sales` 和 `Clients`。\n2.  不要加载数据，而是点击\
  \ **主页** 选项卡中的 **转换数据** 按钮。这将在 Power Query 编辑器中显示两个独立的源数据集。\n3.  在 Power Query 窗口的\
  \ **查询** 窗格中，点击名为 `Sales` 的查询。\n4.  点击 **主页** 选项卡中的 **合并查询** 按钮。将出现 **合并** 对话框。\n\
  5.  在对话框的上半部分——显示当前查询输出的概览——向右滚动并点击 `ClientName` 列标题。此列将被高亮显示。\n6.  在上方表格下方的弹出菜单中，选择\
  \ `Clients` 查询。该查询的输出将出现在对话框的下半部分。\n7.  在下方表格中，选择与你在步骤 5 中选择的列相匹配的列的列标题——即联接列。这也将是\
  \ `ClientName` 列。然后，该列将在下方表格中被选中。\n8.  从 **联接种类** 弹出菜单中选择 `内部（仅匹配的行）`。对话框将如图 8-2\
  \ 所示。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig3_HTML.jpg](img/497001_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3 新的合并列\n\n1.  点击 **确定**。现有数据表的右侧将添加一个新列。该列命名为 `Clients`——代表合并后的表。\n2.  向右滚动到现有数据表的右侧。刚刚从合并步骤创建的新列在每个单元格中都包含单词\
  \ **Table**。此列看起来会有点像图 8-3。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig4_HTML.jpg](img/497001_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4 联接查询中可用的字段\n\n1.  点击添加的列名右侧的 **展开** 图标。将显示此数据表（或者如果你愿意，称为查询）中所有可用字段的弹出列表，如图\
  \ 8-4 所示。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig5_HTML.jpg](img/497001_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5 合并列输出\n\n1.  确保选中 **展开** 单选按钮。\n2.  通过取消选中 **(选择所有列)** 复选框来清除所有列的选择。\n3.\
  \  选择以下列：\n    - `ClientSize`\n    - `ClientSince`\n4.  取消勾选 **使用原始列名作为前缀**。\n5.\
  \  点击 **确定**。合并表中的选定列将添加到主表中，并且与引用表（新列）的链接将被移除。\n6.  如有需要，重命名添加的列。结果应如图 8-5 所示。\n\
  \n你现在拥有一个包含来自两个链接数据源数据的单一数据表。重新处理 `Sales` 查询也会重新处理其依赖的 `Clients` 查询，并导致加载最新版本的数据。\n\
  \n值得注意的是，不必从第二个查询中选择你已经从第一个查询中选择过的任何列，否则你只会返回重复的列。\n\n> **注意：** 你可能注意到 **合并** 对话框指示了两个查询中有多少条匹配记录。这可以是一个有用的提示，表明你已选择了正确的列来联接两个查询。\n\
  \n\n\n### 在合并操作期间聚合数据\n\n如果你不只是查找参考数据，而是需要从另一个表聚合数据，然后将结果添加到当前查询中，那么过程大致类似。然而，第二种方法是为了满足另一种完全不同的需求而设计的。之前，你看到的是当前查询中有许多记录映射到查找表中的*单个*记录的情况。第二种方法适用于当前（或主）查询中有单个记录，而第二个查询中存在*多个*关联记录的情况。因此，你需要聚合第二个表中的数据，以将数据带入第一个表。这里有一个简单的例子，使用了来自\
  \ `C:\\DataMashupWithExcelSamples` 文件夹中的一些示例数据：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig6_HTML.jpg](img/497001_1_En_8_Fig6_HTML.jpg)\n\
  \n**图 8-6** 聚合数据时的“合并”对话框\n\n1.  打开一个新的 Excel 工作表。\n2.  在**数据**菜单中，单击**获取数据** ➤\
  \ **来自文件** ➤ **来自工作簿**。\n3.  在 `C:\\DataMashupWithExcelSamples` 文件夹中找到 `InvoicesAndInvoiceLines.xlsx`\
  \ Excel 源文件。\n4.  勾选**选择多项**复选框。\n5.  在导航器中，选择它包含的两个工作表（`Invoices` 和 `InvoiceLines`）。\n\
  6.  单击**转换数据**。这将创建两个查询，并打开**Power Query 编辑器**。\n7.  在左侧的**查询**窗格中，单击名为 `Invoices`\
  \ 的查询。\n8.  在**开始**功能区中，单击**合并查询**按钮。将打开**合并**对话框。你会在对话框的上半部分看到 `Invoices` 数据集中的一些数据。\n\
  9.  单击 `InvoiceID` 列内的任意位置。此列被选中。\n10. 在弹出的菜单中，选择 `InvoiceLines` 查询。你会在对话框的下半部分看到\
  \ `InvoiceLines` 数据集中的一些数据。\n11. 单击下方表格的 `InvoiceID` 列内的任意位置。此列被选中。\n12. 在**联接种类**弹出菜单中选择**内部（仅限匹配行）**。对话框将如图\
  \ 8-6 所示。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig7_HTML.jpg](img/497001_1_En_8_Fig7_HTML.jpg)\n\
  \n**图 8-7** 合并数据集中的可用字段\n\n1.  单击**确定**。**合并**对话框将关闭，并在 `Invoices` 查询的右侧添加一个名为 `InvoiceLines`\
  \ 的新列。\n2.  滚动到现有数据表的右侧。你会看到新列（名为 `InvoiceLines`），其中每个单元格都包含单词 *Table*。\n3.  单击新列标题右侧的**展开**图标（左右方向的两个箭头）。将显示\
  \ `InvoiceLines` 查询中所有可用字段的弹出列表。\n4.  选择**聚合**单选按钮。\n5.  选择**Sum of SalePrice**\
  \ 字段，并取消选中所有其他字段。\n6.  取消选中 **“使用原始列名作为前缀”** 复选框。对话框将如图 8-7 所示。\n7.  单击**确定**。\n\
  \nPower Query 将累加每张发票的总销售价格，并将其添加为新列。当然，如果求和不是你想要的结果，你可以选择希望应用的聚合类型（在单击**确定**之前）。为此，将光标悬停在要聚合的列上（参见前面练习中的步骤\
  \ 11），然后单击字段名称右侧的弹出菜单。Power Query 将会建议一组选项。可用的聚合选项在表 8-2 中进行了说明。\n\n**表 8-2** 合并聚合选项\n\
  \n| 选项 | 说明 |\n| --- | --- |\n| 求和 | 返回字段的总值 |\n| 平均值 | 返回字段的平均值 |\n| 中位数 | 返回字段的中位数\
  \ |\n| 最小值 | 返回字段的最小值 |\n| 最大值 | 返回字段的最大值 |\n| 计数（全部） | 计算数据集中的所有记录 |\n| 计数（非空）\
  \ | 计算数据集中所有非空的记录 |\n\n**提示**  \n如果你在第 1 步中加载了数据而不是编辑查询，只需单击**开始**功能区中的**转换数据**按钮，即可切换到**查询编辑器**。\n\
  \n你刚刚看到的合并过程，虽然本身并不复杂，但却突然开启了众多新的可能性。这意味着你现在可以创建多个独立的查询，然后一起使用它们来扩展数据，从而能够准备相当复杂的数据集。\n\
  \n关于合并操作，我有几点需要说明：\n\n-   只有先前在 Power Query 窗口中创建好的查询才能用于合并数据集。因此，请记得在尝试进行合并操作之前，连接到所有你需要的数据集。\n\
  -   刷新一个查询会导致合并到该查询中的任何其他查询也随之刷新。这样，你将始终从流程中的所有查询中获得最新的数据。\n\n### 将合并结果作为新查询使用\n\
  \n在前两节中，你通过从另一个查询添加数据来扩展了一个现有查询。关于合并查询这一主题的最后一个变体，是基于合并两个源查询的结果来创建一个全新的查询。这种方法的好处是，它保留了源查询的完整性，以便在其他查询中重复使用，或者在新合并的查询未给出所需结果时更容易恢复到原始状态。\n\
  \n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig8_HTML.jpg](img/497001_1_En_8_Fig8_HTML.jpg)\n\
  \n**图 8-8** 将表合并为新查询\n\n1.  遵循“使用合并数据扩展查询”一节中的第 1 到第 3 步。\n2.  在**开始**功能区中，单击**合并查询**按钮右侧的小三角形。你可以在图\
  \ 8-8 的弹出菜单中看到可用选项。\n3.  选择**将查询合并为新查询**。\n4.  继续执行“使用合并数据扩展查询”一节中的第 5 到第 17 步。\n\
  \n这将创建一个新查询（命名为 `Merge`——但你可以稍后重命名），并且保持初始查询不变。\n\n这种方法可以比简单地扩展现有查询更加灵活和敏捷。你可以放心，如果你刷新数据，新的合并查询也会作为该过程的一部分被刷新。\n\
  \n\n\n### 联接类型\n\n在合并查询（无论是为了联接数据还是聚合值）时，您需要选择如何链接两个查询。联接类型的选择会对结果数据集产生深远影响。因此，了解可用的六种联接类型非常重要。这些类型在表\
  \ 8-3 中进行了描述。\n\n**表 8-3** 联接类型\n\n| 联接类型 | 说明 |\n| --- | --- |\n| 左外部 | 保留 `Merge`（合并）对话框中上方数据集（开始合并操作时处于活动状态的数据集）中的所有记录。保留第二个数据集中所有匹配的行（在联接列中共享共同值的行）。丢弃第二个数据集中的所有其他行\
  \ |\n| 右外部 | 保留 `Merge`（合并）对话框中下方数据集（开始合并操作时未处于活动状态的数据集）中的所有记录。保留上方数据集中所有匹配的行（在联接列中共享共同值的行）。丢弃上方数据集（开始合并操作时处于活动状态的数据集）中的所有其他行\
  \ |\n| 完全外部 | 两个查询中的所有行都保留在结果数据集中。任何在联接字段中不共享共同值的记录，其某些列将包含空白 |\n| 内部 | 仅联接在所选联接列上完全匹配的查询。丢弃任一查询中在联接列上不共享共同值的所有行\
  \ |\n| 左反 | 仅保留上方（第一个）查询中的行 |\n| 右反 | 仅保留下方（第二个）查询中的行 |\n\n> **注意：** 当您使用任何 *外部*\
  \ 联接时，您保留了在第二个查询中没有对应记录的行。因此，结果数据集中某些列将包含空值。\n\n当您展开作为链接到合并数据集的列时，有几种值得了解的有用选项：\n\
  \n- 使用原始列名作为前缀\n- 搜索要展开的列\n\n#### 使用原始列名作为前缀\n\n您可能会发现，来自已联接查询的某些列在两个源数据集中可能具有相同的名称。因此，您需要识别出哪些列来自哪个数据集。如果您保持选中“使用原始列名作为前缀”合并选项（默认选项），则所有合并的列将包含源查询名称，以帮助您更准确地识别数据。\n\
  \n如果您发现这些较长的列名反而碍事，可以取消选中此复选框。这将使来自第二个查询的添加列保留其原始名称。但是，由于 Power Query 无法接受重复的列名，任何新列的名称将添加\
  \ `.1`、`.2` 等后缀。\n\n#### 搜索要展开的列\n\n如果您正在将一个查询与另一个包含大量列的查询合并，那么滚动查找您想要包含的列可能会非常费力。要缩小搜索范围，您可以在\
  \ `Search columns to aggregate`（搜索要聚合的列）框中输入您要查找的列名的几个字符。您输入的字符越多，`Expansion`（展开）弹出对话框中显示的匹配列就越少。\n\
  \n### 基于多列进行联接\n\n到目前为止的示例中，您仅基于单个列联接了查询。如果您处理的是来自结构清晰的源（例如关系数据库）的数据，这可能可行，但当联接来自不同源的查询时，您可能需要扩展该原则。幸运的是，Power\
  \ Query 允许您在需要时基于*多*列联接查询。\n\n以此为例，示例数据中包含一个我准备好的文件，它演示了如何基于多列联接查询。此示例文件包含您在前几章中看到的源数据。但这些数据已被建模为数据仓库星型架构。要完成此模型，您需要将一个名为\
  \ `Geography`（地理信息）的维度联接到一个名为 `Sales`（销售）的事实表，以便将 `GeographySK` 字段添加到事实表中。然而，`Sales`\
  \ 表和 `Geography` 表共享三个字段（`Country`（国家）、`Region`（地区）和 `Town`（城镇）），这些字段必须对应才能将查询联接起来。以下解释了如何使用多个字段执行联接：\n\
  \n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig9_HTML.jpg](img/497001_1_En_8_Fig9_HTML.jpg)\n\
  \n**图 8-9** 使用多列联接查询\n\n1. 在 Excel 文件中，于 `Data`（数据）功能区中，单击 `Get Data`（获取数据） ➤ `From\
  \ File`（来自文件） ➤ `From Workbook`（来自工作簿），然后连接到 Excel 文件 `C:\\DataMashupWithExcelSamples\\\
  StarSchema.xlsx`。\n\n2. 选中 `Select multiple items`（选择多项）复选框。\n\n3. 选择两个工作表（`Geography`\
  \ 和 `Sales`）。\n\n4. 单击 `Transform Data`（转换数据）以打开 `Query Editor`（查询编辑器）。\n\n5. 从\
  \ Power Query 窗口左侧的 `Queries`（查询）窗格的现有查询列表中，选择 `Sales` 查询。\n\n6. 在 `Home`（开始）功能区中，单击\
  \ `Merge Queries`（合并查询）按钮。将出现 `Merge`（合并）对话框。\n\n7. 在查询弹出列表中，选择 `Geography` 作为要联接到第一个（上方）查询的第二个查询。\n\
  \n8. 从 `Join Kind`（联接种类）弹出菜单中选择 `Inner (only matching rows)`（内部（仅匹配行））。\n\n9. 在上方字段列表（来自\
  \ `Sales` 表）中，*按此顺序*按住 Ctrl 键并单击 `CountryName` 和 `Region` 字段。每个列标题的右侧将出现一个小数字，指示您选择列的顺序。\n\
  \n10. 在下方字段列表（来自 `Geography` 表）中，*按此顺序*按住 Ctrl 键并单击 `CountryName` 和 `Region` 字段。每个列标题的右侧将出现一个小数字，指示您选择列的顺序。\n\
  \n11. 在对话框底部的信息消息中，验证匹配行的数量是否合理。对话框将如图 8-9 所示。\n\n12. 单击 `OK`（确定）。\n\n然后您可以继续重组数据。例如，在此示例中，这将涉及将\
  \ `GeographySK` 字段添加到 `Sales` 查询，然后从 `Sales` 查询中移除 `Country`、`Region` 和 `Town` 字段。\n\
  \n联接查询时，可用作联接的列数没有实际限制。这完全取决于源数据的结构。但是，用于定义联接的每个列必须*同时*存在于两个数据集中，并且每一对列的数据类型必须*相同*（或相似）。\n\
  \n### 为联接准备数据集\n\n在联接查询之前，您可能需要对现实世界的数据集进行一些准备工作。更具体地说，您要联接的任何列都必须具有相同的基本数据类型。简而言之，您需要将基于文本的列联接到其他基于文本的列，将数字列联接到数字列，将日期列联接到日期列。如果列的数据类型*不*相同，当您在\
  \ `Merge`（合并）对话框中尝试联接这些列时，您将收到一条警告消息。\n\n因此，在开始合并操作*之前*，检查将用于联接查询的列几乎总是一个好主意。请记住，数据类型不必完全相同，只需相似即可。例如，十进制数类型可以映射到整数。\n\
  \n在尝试合并查询之前，您可能还需要清理用于联接的列中的数据。这可能涉及您在第 7 章中学到的以下技术：\n\n- 删除基于文本的列中的尾随或前导空格\n- 隔离列的一部分（无论是在原始列中还是作为新列）以用于联接\n\
  - 验证联接列中是否使用了适当的数据类型\n\n\n\n### 正确与错误的连接\n\n不幸的是，合并查询是一种在理论上往往比实践中更容易的数据重组操作。如果源查询基于关系型甚至维度型数据库中的表，那么连接它们可能相对容易，因为数据架构师（希望如此）会设计出便于连接的数据库表。但是，如果你要连接两个完全独立的查询，可能会面临几个主要问题：\n\
  \n* 列不匹配。\n* 列匹配，但结果是一个包含重复记录的巨大表格。\n\n我们来看看这些可能的问题。\n\n#### 列不匹配\n\n如果列不匹配（即你已连接数据但未获得任何结果记录），那么你需要仔细检查用于建立连接的那些列中的数据。你需要问以下问题：\n\
  \n* 两个查询中的值是否为相同的数据类型？\n* 这些值真的能匹配，还是根本不同？\n* 你使用的列是否正确？\n* 你是否使用了过多的列，从而指定了并非两个查询中都有的数据？\n\
  \n#### 列匹配，但结果是一个包含重复记录的巨大表格\n\n连接查询依赖于在两个源查询中隔离出*唯一*的数据。有时，单列不足以建立唯一引用，从而无法唯一地标识查询中的某一行。\n\
  \n在这些情况下，你需要使用两个或多个列来连接查询——否则结果中会出现重复的行。因此，你需要再次仔细审视数据，并决定可以用来正确连接查询的最小列数。\n\n>\
  \ **提示**  \n> `Merge`（合并）对话框底部的注释会告诉你两个表之间有多少条记录匹配。这是判断你是否选择了正确的连接列和合适的连接类型的一个有效且有用的指标。\n\
  \n### 检查已连接的数据\n\n连接数据表并不总是容易的。判断合并操作的结果是否能产生你期望的结果同样不易。因此，Power Query 为这类困境提供了一种解决方案。它可以帮助你更清晰地看到连接操作的结果。更具体地说，它可以向你显示第一个查询中每条记录精确地连接了第二个查询中的哪些行。\n\
  \n请按照以下步骤查看实际效果：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig10_HTML.jpg](img/497001_1_En_8_Fig10_HTML.jpg)\n\
  \n**图 8-10** 已连接的数据\n\n1. 执行前面示例（“基于多列连接”一节）中的步骤 1 到 10。\n2. 向右滚动数据表。你将看到名为 `Geography`\
  \ 的新列（如图 8-10 所示）。\n3. 在你想查看已连接数据的行中，点击 `Table` 一词的*右侧*。注意，*不要*点击 `Table` 这个词。主查询数据表下方会出现第二个表，其中包含为此特定行连接的第二个查询的数据。图\
  \ 8-10 展示了这样一个示例。\n\n这项技术既简单又实用。不过，我有几点意见需要说明：\n\n* 你可以通过向上或向下拖动顶部数据表的下边框来调整下方表格的大小（从而显示更多或更少的来自第二个连接表的数据）。\n\
  * 点击 `NewColumn` 列中 `Table` 一词的右侧，将启用 `Transform`（转换）功能区中的 `Expand`（展开）和 `Aggregate`（聚合）按钮。\n\
  * 点击 `NewColumn` 列中的 `Table` 一词，会向查询中添加一个新步骤，该步骤会用链接的数据替换源数据。你也可以通过在 `NewColumn`\
  \ 列内右键单击并选择 `Drill Down`（向下钻取）来执行此操作。\n\n> **注意**  \n> 向下钻取到合并后的表实际上会将查询限制为子表的行。因此，如果你想访问合并表中的所有数据，则必须删除此步骤。\n\
  \n## 追加数据\n\n并非所有源数据都以单个文件或单个数据库表的形式完整提供。你可能会被授予访问两个或多个表或文件的权限，这些表或文件需要加载到 Excel\
  \ 或 Power Pivot 的单个表中。在某些情况下，你可能会发现自己面临数百个文件——都是文本、CSV 或 Excel 格式——并且需要将它们全部加载到一个将用作分析基础的单个表中。好吧，Power\
  \ Query 也能处理这些情况。\n\n### 将一个查询的内容添加到另一个查询\n\n在最简单的情况下，你可能有两个结构完全相同的数据源（即它们具有相同顺序的相同列），你所需要做的就是将一个添加到另一个，从而得到一个输出两个源合并内容的查询。这称为*追加数据*，只要两个数据源具有*完全相同*的结构，这就很简单；这意味着：\n\
  \n* 它们具有相同数量的列。\n* 列的顺序相同。\n* 每列的数据类型相同。\n* 列的名称相同。\n\n只要满足所有这些条件，你就可以将一个查询的输出（Power\
  \ Query 也称之为 `Tables`，包括我在内的许多人称之为数据集）追加到另一个查询中。这些查询的数据不必来自相同的源类型，因此你可以将 CSV 文件的输出追加到来自\
  \ Oracle 数据库的数据，例如。作为示例，我们将采用两个文本文件，并用它们创建一个单一输出：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig11_HTML.jpg](img/497001_1_En_8_Fig11_HTML.jpg)\n\
  \n**图 8-11** 用于追加的源数据\n\n1. 创建查询以将以下每个文本文件加载到 Excel 工作表中。由于这在第 2 章中已有解释，我在此不再重复原理。两个文件均位于\
  \ `C:\\DataMashupWithExcelSamples\\MultipleIdenticalFiles` 文件夹中：\n   1. `Colours_01.txt`\n\
  \   2. `Colours_02.txt`\n2. 将查询命名为 `Colours_01` 和 `Colours_02`。你可以在图 8-11 中看到这两个查询的内容。\n\
  \n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig12_HTML.jpg](img/497001_1_En_8_Fig12_HTML.jpg)\n\
  \n**图 8-12** `Append`（追加）对话框\n\n1. 通过双击 `Queries & Connections`（查询和连接）窗格中的某个查询名称（我使用\
  \ `Colours_01`，但任何一个都可以）打开该查询。这将打开 Power Query 编辑器。\n2. 在 Power Query 编辑器 Home（主页）功能区中，点击\
  \ `Append Queries`（追加查询）按钮右侧的箭头，然后选择 `Append queries as new`（将查询追加为新查询）。将出现 `Append`（追加）对话框。\n\
  3. 确保选中 `Two tables`（两个表）单选按钮。\n4. 从 `Select Table to Append`（选择要追加的表）弹出窗口中，选择查询\
  \ `Colours_02`。该对话框将类似于图 8-12 所示。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig13_HTML.jpg](img/497001_1_En_8_Fig13_HTML.jpg)\n\
  \n**图 8-13** 包含追加数据的新查询\n\n1. 点击 `OK`。两个输出表的数据会追加到一个新查询中。你可以在图 8-13 中看到结果输出的示例。\n\
  \n现在，你可以继续应用所需的任何修改。你会注意到，当表被追加时，列名不会作为数据的一部分重复出现。\n\n这种方法的一个有趣之处在于，你已经在两个源表和新查询之间建立了链接。这意味着，当你刷新源数据时，不仅\
  \ `Colours_01` 和 `Colours_02` 表中的数据会更新，你刚刚创建的“派生”查询也会更新。\n\n\n\n#### 追加多个查询的内容\n\
  \n`查询编辑器`并不限制你一次只能追加两个文件。你可以（如果确实需要）追加数量几乎不限的相同文件。此外，追加 Excel 文件与追加文本或 CSV 文件一样简单——如下例所示：\n\
  \n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig14_HTML.jpg](img/497001_1_En_8_Fig14_HTML.jpg)\n\
  \n*图 8-14: 追加多个查询*\n\n1. 创建查询，加载文件夹 `C:\\DataMashupWithExcelSamples\\MultipleIdenticalExcel`\
  \ 中 Excel 文件 `BrilliantBritishCars1.xlsx` 内名为 `BaseData` 的工作表数据。\n2. 重复步骤 1，加载同一文件夹下文件\
  \ `BrilliantBritishCars2.xlsx` 和 `BrilliantBritishCars3.xlsx` 中包含的数据。\n3. 双击右侧`查询和连接`窗格中名为\
  \ `BaseData` 的查询，以打开`查询编辑器`。\n4. 单击`追加查询`按钮。\n5. 在`追加`对话框中，选中`三个或多个表`单选按钮。\n6. 按住\
  \ Ctrl 键并单击对话框左侧`可用表`列表中的 `BaseData (2)` 和 `BaseData (3)`。\n7. 单击`添加`按钮。此时`追加`对话框的外观如图\
  \ 8-14 所示。\n8. 单击`确定`。来自查询 `BaseData (2)` 和 `BaseData (3)` 的数据将被追加到当前查询 (`BaseData`)\
  \ 中。\n\n通过此技术，你将多个源表“编译”成了一个输出表。值得注意的是，你可以：\n\n-   通过单击查询（或按住 Ctrl 键单击多个查询），然后点击对话框右侧的叉号图标，从右侧要追加的查询列表中移除查询。\n\
  -   通过单击要移动的查询，然后点击对话框右侧的上箭头和下箭头来更改查询的加载顺序。\n\n## 更改数据结构\n\n有时，你的需求会超出我们到目前为止在讨论数据清洗和转换时所介绍的技术范畴。鉴于你获取的数据形状，某些数据结构需要更彻底的改造。我将此类别中的内容列举如下：\n\
  \n-   逆透视数据\n-   透视数据\n-   转置行和列\n\n这些技术中的每一种都是为了满足数据加载中特定但频繁出现的需求而设计的，所有这些内容都将在接下来的几页中描述。\n\
  \n### 逆透视表\n\n有时，你可能需要分析以“透视”或“非规范化”格式提供的数据。这实质上意味着，本应放在单个列中的信息被拆分并放置到了多个列中。图 8-15\
  \ 给出了一个透视数据集的前几行示例，该数据集可以在文件 `C:\\DataMashupWithExcelSamples\\PivotedDataSet.xlsx`\
  \ 中找到。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig15_HTML.jpg](img/497001_1_En_8_Fig15_HTML.jpg)\n\
  \n*图 8-15: 一个透视数据集*\n\n要正确分析此数据，我们需要将汽车品牌从列标题转换为特定列的内容。幸运的是，这并不难：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig16_HTML.jpg](img/497001_1_En_8_Fig16_HTML.jpg)\n\
  \n*图 8-16: 一个逆透视数据集*\n\n1. 在一个新的 Excel 文件中，单击`获取数据 ➤ 来自文件 ➤ 来自 Excel`，以连接来自 `C:\\\
  DataMashupWithExcelSamples\\PivotedDataSet.xlsx` 文件的 `PivotedCosts` 表到 Power Query\
  \ 中。确保不要加载数据，而是从`导航器`中单击`转换数据`。\n2. 确保第一行被设置为表标题。\n3. 在`查询编辑器`中，选择所有你想要逆透视的列。在此示例中，这意味着所有*除了第一列之外*的列（所有汽车品牌）。\n\
  4. 在`转换`功能区，单击`逆透视列`按钮（或右键单击任意选中的列，然后从上下文菜单中选择`逆透视列`）。表格会被重新组织，前几条记录如图 8-16 所示。`逆透视的列`\
  \ 被添加到`应用的步骤`列表中。\n5. 重命名 Power Query 命名为 `属性` 和 `值` 的列。\n\n现在数据以标准的表格形式呈现，因此可用于创建数据模型（或加载到\
  \ Excel 工作表中），作为进一步分析的基础。\n\n> **注意：** 如果你单击`逆透视`按钮右侧的小三角形，会显示另一个菜单选项。这是`逆透视其他列`选项，当运行转换时，它会将*未*选中的所有列的内容切换为行。\n\
  \n#### 逆透视选项\n\n使用`转换`功能区中的`逆透视列`按钮弹出菜单进行逆透视数据时，有几个可用的选项：\n\n-   *逆透视其他列*：这将把所有其他列的内容添加到逆透视输出中。\n\
  -   *仅逆透视选中的列*：这只将所有预先选中的列的内容添加到逆透视输出中。\n\n> **注意：** 与应用`查询编辑器`中的许多技术一样，在执行透视和逆透视操作之前，选择正确的列非常重要。\n\
  \n### 透视表\n\n在某些情况下，你可能需要将数据从列切换到行，以便高效使用。这种操作称为*透视数据*。毫不奇怪，它与你上一节看到的逆透视过程非常相似。由此产生的数据通常称为“交叉表”或“数据透视表”。\n\
  \n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig17_HTML.jpg](img/497001_1_En_8_Fig17_HTML.jpg)\n\
  \n*图 8-17: 透视列对话框*\n\n1. 按照上一节的步骤 1 到 3 进行操作，最终得到如图 8-15 所示的数据表。\n2. 单击 `属性` 列内部。\n\
  3. 在`转换`功能区，单击`透视列`按钮。将出现`透视列`对话框。\n4. 选择 `值`（数据列）作为通过透视转换进行聚合的值列。\n5. 展开`高级选项`，确保选择`求和`作为`聚合值函数`。`透视列`对话框将如图\
  \ 8-17 所示。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig18_HTML.jpg](img/497001_1_En_8_Fig18_HTML.jpg)\n\
  \n*图 8-18: 透视后的数据*\n\n6. 单击`确定`。表格被透视，外观如图 8-18 所示。`透视的列` 被添加到`应用的步骤`列表中。\n\n> **注意：**\
  \ `透视列`对话框中的`高级选项`部分允许你选择应用于透视表中值的聚合操作。\n\n### 转置行和列\n\n有时，你可能会遇到一个源表，其列需要变成行，而行需要变成列。幸运的是，对于\
  \ Power Query 来说，这是一键转换。操作方法如下：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig19_HTML.jpg](img/497001_1_En_8_Fig19_HTML.jpg)\n\
  \n*图 8-19: 一个需要转置的数据集*\n\n1. 在 Power Query 编辑器中连接到 Excel 文件 `C:\\DataMashupWithExcelSamples\\\
  DataToTranspose.xlsx`。你需要选择 `Sheet1`。你将看到一个如图 8-19 所示的数据表。\n2. 在`转换`功能区，单击`转置`按钮。数据被转置并显示为两列，就像你在第\
  \ 2 章中看到的 `CountryList.txt` 文件一样。\n3. 重命名生成的列。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您的注意事项和示例，将提供的英文文本翻译成中文。\n\
  \n\n## 直接从查询编辑器内部加载数据\n\n毫无疑问，有时你会希望扩展现有的数据转换流程，并向已在 Power Query 中创建的任何现有查询添加一个新查询。幸运的是，你可以直接从查询编辑器内部完成此操作，而无需切换回\
  \ Excel。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig20_HTML.jpg](img/497001_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20：用于在 Power Query 编辑器内部直接添加更多查询的弹出菜单\n\n1.  在查询编辑器中，展开左侧的“查询”窗格（如果尚未显示）。\n\
  2.  在“查询”窗格内右击。\n3.  选择 `新建查询 ➤ 文件 ➤ Text/CSV`。你可以在图 8-20 中看到此弹出菜单。\n4.  按照你在第 2\
  \ 章中学到的方法，加载 CSV 文件 `Countries.csv`。\n\n一个新查询将被添加到 Power Query 编辑器的“查询”窗格以及 Excel\
  \ 的“连接和查询”窗格中。\n\n此技术虽然有些隐蔽，但特别有用，因为它可以避免你关闭查询编辑器来创建新查询，然后再返回查询编辑器继续工作。在查询编辑器内部创建新查询时，Excel\
  \ 的 `获取数据` 按钮中提供的所有数据源选项均可用。\n\n**注意：** 由于你已经在查询编辑器内部，因此在连接到新数据源时没有 `转换数据` 按钮。实际上，你已经在转换数据了。\n\
  \n## 错误显示\n\n有时源数据可能明显包含错误。在这种情况下，Power Query 会标记包含明显错误的单元格。它不会擅自修改数据——毕竟，即使数据被标记为包含错误或异常，它可能仍然有用。\n\
  \n但是，它可以帮助你应用一些基本的数据清理。要了解错误的显示方式：\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig21_HTML.jpg](img/497001_1_En_8_Fig21_HTML.jpg)\n\
  \n图 8-21：显示错误\n\n1.  打开一个新的空白 Excel 工作簿。\n2.  单击 `数据 ➤ 获取数据 ➤ 从文件 ➤ 从工作簿`。\n3. \
  \ 选择 Excel 文件 `SampleErrors.xlsx`，然后单击 `导入`。\n4.  选择 `Sheet1`，然后单击 `转换数据` 以在 Power\
  \ Query 编辑器中显示数据。\n5.  单击 `Price` 列内部，然后在“开始”功能区中，将数据类型设置为小数。\n6.  在出现的 `更改列类型`\
  \ 对话框中，单击 `替换当前`。其中两行将显示错误，如图 8-21 所示。\n\n在某些数据集中，被标记为错误的数据可能是你想要更详细检查的数据。关键在于，你可以看到潜在的错误，并决定是将其删除（如下所述），还是返回到源数据并在重新加载数据之前进行更正。\n\
  \n### 删除错误\n\n假设你不需要 Power Query 标记为包含错误的记录，你可以通过一次操作删除所有此类记录：\n\n1.  单击包含错误的列内部；或者，如果你想一次从多个列中删除错误，请按住\
  \ Ctrl 键单击包含错误的列标题。\n2.  单击“开始”功能区中 `删除行` 按钮上的弹出三角形。将显示弹出菜单。\n3.  单击 `删除错误`。任何在选定列中标记有错误的记录都将被删除。`已删除的错误`\
  \ 将被添加到 `应用步骤` 列表中。\n\n在此处你必须非常小心，不要删除有效数据。只有你自己才能判断，一旦你查看了数据，某一列中的错误是否意味着可以安全地丢弃该数据。在所有其他情况下，最好建议你考虑清理数据，或者干脆保留包含错误的记录。潜在错误的范围和多样性就像数据本身一样广泛。\n\
  \n### 查看错误\n\n如果你保存并关闭包含错误的查询，`查询和连接` 窗格将指示每个查询的错误数量——如图 8-22 所示。\n\n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig22_HTML.jpg](img/497001_1_En_8_Fig22_HTML.jpg)\n\
  \n图 8-22：在“查询和连接”窗格中显示包含错误的查询\n\n单击错误链接（在查询中以蓝色显示）将打开查询编辑器并仅显示错误记录。你可以在图 8-23 中看到这一点。\n\
  \n![../images/497001_1_En_8_Chapter/497001_1_En_8_Fig23_HTML.jpg](img/497001_1_En_8_Fig23_HTML.jpg)\n\
  \n图 8-23：仅显示错误记录\n\n## 数据转换方法\n\n我很理解，面对数量繁多的可用转换选项，你可能会感到困惑。因此，此时记住几个关键原则可能会有所帮助：\n\
  \n-   如有疑问，请右键单击要转换的列。上下文菜单中将列出最常用的可用选项。\n-   要更改现有数据，请使用 `转换` 菜单。\n-   要添加新列，请使用\
  \ `添加列` 菜单。\n-   请记住，你可以通过删除数据转换过程中的步骤来“撤销”修改。\n\n## 结论\n\n本章向你展示了如何将源数据从一个或多个可能的源结构化为一个有效的数据表。除此之外，你还了解了如何透视和逆透视数据、如何向上和向下填充数据行，以及如何转置行和列。\n\
  \n你学到的最重要的东西，可能是如何联接各个查询，以便将一个查询中的数据添加到另一个查询中。这可能涉及从单独的查询中查找数据，或者将一个查询的聚合结果带入另一个查询。\n\
  \n最后，你学习了如何识别查询中的错误记录。\n\n现在是时候将你的数据转换技能提升到一个新水平，并学习如何设置复杂的数据摄入和转换例程了。这些是第 9 章的主题。\n\
  \n"
- "# 9. 复杂数据加载\n\n并非所有的数据加载都只是简单地建立连接并对源数据应用转换（幸运的是，这些数据已经以结构清晰的表格形式呈现）。有时，你可能希望在加载数据时“挑战极限”，并准备更复杂的源数据结构，以便在你的\
  \ Excel 分析中使用。我的意思是，源数据最初并非立即可用的表格格式，需要对数据进行一些重组以准备一个干净的数据表以供使用。\n\n为了解决这类挑战，本章将向你解释如何：\n\
  \n-   从源文件夹添加多个相同的文件\n-   从源文件夹中选择要加载的相同源文件\n-   从包含 JSON 数据的源文件加载简单的 JSON 结构\n\
  -   解析源文件中包含 JSON 数据的列\n-   解析源文件中包含 XML 数据的列\n-   加载复杂的 JSON 文件——并选择要使用的元素\n- \
  \  加载复杂的 XML 文件——并选择要使用的元素\n-   将列转换为列表，以便用于复杂的加载例程\n\n最后——纯粹是为了完善 Power Query 编辑器及其功能的整体概述——我将提及如何：\n\
  \n-   重用最近使用的查询\n-   修改最近使用的查询列表\n-   从 Power Query 编辑器导出数据\n\n本章中使用的任何示例文件均可按照附录\
  \ A 中的说明从 Apress 网站下载。\n\n\n\n## 从源文件夹添加多个文件\n\n现在我们来考虑一个有趣的数据导入挑战。你收到了一批文本文件，可能是从\
  \ FTP 站点下载或通过电子邮件接收的，并且将它们全部放入了特定目录。然而，如果有几百个文件，你不想像第 2 章那样逐个加载，然后再将每个文件单独追加到一起，创建最终的复合数据表（就像你在第\
  \ 8 章中看到的那样）。\n\n以下是一种实现此目标的更高效方法。\n\n> **注意**  \n> 只有所有文件**严格相同**时，`Query Editor`\
  \ 才能加载多个文件。这意味着必须确保每个文件中的所有列顺序一致且名称相同。\n\n![图 9-1：文件夹对话框](img/497001_1_En_9_Fig1_HTML.jpg)\n\
  \n1.  新建一个 Excel 文件。\n2.  在“数据”功能区中，依次点击 **获取数据** > **来自文件** > **来自文件夹**。此时将显示“文件夹”对话框。\n\
  3.  单击“浏览”按钮，导航至包含待加载文件的文件夹。在此示例中，文件夹路径为 `C:\\DataMashupWithExcelSamples\\MultipleIdenticalFiles`。如果你愿意，也可以直接粘贴或输入文件夹路径。“文件夹”对话框将如图\
  \ 9-1 所示。\n\n![图 9-2：Power Query 中的文件夹内容](img/497001_1_En_9_Fig2_HTML.jpg)\n\n4.\
  \  点击 **确定**。文件列表窗口随即打开。该文件夹及其所有子文件夹的内容将以表格形式列出，如图 9-2 所示。\n\n![图 9-3：合并文件对话框](img/497001_1_En_9_Fig3_HTML.jpg)\n\
  \n5.  点击 **合并** 按钮右侧的弹出箭头，然后选择 **合并并转换数据**。将出现“合并文件”对话框，如图 9-3 所示。在此处，你可以选择文件夹中的哪个文件作为待导入文件的模板。\n\
  \n![图 9-4：从文件夹加载的数据](img/497001_1_En_9_Fig4_HTML.jpg)\n\n6.  点击 **确定**。`Power Query\
  \ Editor` 将显示导入的数据，如图 9-4 所示。\n7.  点击 **关闭并加载**。所有源文件中的数据都将加载到 Excel 数据模型中。\n\n\
  如你所见，`Power Query` 在输出中添加了一个额外列，其中包含每条源记录所在文件的名称。如果你愿意，可以删除此列。\n\n> **注意**  \n>\
  \ “合并文件”对话框中的其他选项在第 2 章中有详细说明。\n\n### 筛选文件夹中的源文件\n\n有时你可能只想从文件夹中导入文件的*子集*。或许是因为文件不完全相同，或者你根本不需要源目录中的某些可用文件。无论出于何种原因，这里有一种方法可以让\
  \ `Power Query` 完成筛选目录的工作，并且*只*加载符合你指定的文件名或扩展名规范的文件。换句话说，`Query Editor` 允许你在加载实际数据之前筛选源文件集。在此示例中，我将演示如何从同时包含\
  \ Excel 文件和文本文件的目录中加载多个 Excel 文件。\n\n![图 9-5：加载多个文件时显示文件信息](img/497001_1_En_9_Fig5_HTML.jpg)\n\
  \n1.  执行本章前面“从源文件夹添加多个文件”部分的步骤 1 到步骤 5，以显示包含要加载文件的文件夹内容。在此场景中，文件夹路径为 `C:\\DataMashupWithExcelSamples\\\
  MultipleNonIdentical`。\n2.  点击 **转换数据**。`Query Editor` 窗口将打开并显示目录中的文件列表及其许多属性。你可以在图\
  \ 9-5 中看到此示例。\n\n![图 9-6：加载多个相同文件时筛选文件类型](img/497001_1_En_9_Fig6_HTML.jpg)\n\n3.\
  \  由于你只想加载 Excel 文件并避免其他类型的文件，请点击 `Extension` 列标题的筛选弹出菜单，并取消选中除 `.xlsx` 之外的所有元素。此操作如图\
  \ 9-6 所示。\n\n![图 9-7：加载多个 Excel 文件时选择源数据](img/497001_1_En_9_Fig7_HTML.jpg)\n\n4.\
  \  点击 **确定**。现在，你将在 `Query Editor` 中仅看到 Excel 文件。\n5.  单击第一列标题右侧的展开图标（两个向下箭头）；此列名为\
  \ `Content`，该列中的每一行都包含单词 *Binary*。`Power Query` 将显示你之前在图 9-3 中看到的 **合并文件** 对话框。\n\
  6.  从可用文件中选择要用作数据加载示例文件的那个文件。\n7.  选择 `BaseData` 工作表作为加载所用结构。\n8.  勾选 **跳过包含错误的文件**。此时，对话框将如图\
  \ 9-7 所示。\n9.  点击 **确定**。`Power Query Editor` 将加载所有文件并显示结果。\n\n所有源文件的内容现在都已加载到 `Power\
  \ Query Editor` 中，并可以像任何其他数据集一样进行转换和使用。这可能涉及删除多余的标题行（如下一节所述）。更重要的是，如果你向源目录添加更多文件，然后点击“开始”功能区中的\
  \ **刷新**，那么*所有*符合筛选条件的源文件都会被重新加载，包括自初始加载以来添加到指定目录中且符合筛选条件的新文件。\n\n> **注意**  \n>\
  \ 加载多个 Excel 文件时，需要确保数据源（无论是工作表、命名范围还是表）在所有源文件*必须*具有相同的名称，否则数据将无法加载。\n\n### 显示与筛选文件属性\n\
  \n当你在 `Query Editor` 中显示文件夹内容时，你会看到一组可用于筛选数据的文件属性。这些属性涵盖基本元素，例如：\n\n*   文件名\n* \
  \  文件扩展名\n*   文件夹路径\n*   创建日期\n*   上次访问日期\n*   修改日期\n\n但是，还有更多可用于描述文件的属性，你只需在 `Query\
  \ Editor` 中显示它们即可访问。以下是操作方法：\n\n![图 9-8：添加文件属性以进行文件选择](img/497001_1_En_9_Fig8_HTML.jpg)\n\
  \n1.  执行上一节中的步骤 1 和步骤 2。\n2.  点击属性列右侧的展开图标（双向箭头）以显示可用属性。将显示可用属性列表，如图 9-8 所示。\n3.\
  \  从列表中选择要显示的属性，然后点击 **确定**。\n\n每个属性将在 `Query Editor` 中作为新列出现。现在，你可以根据这些列进行筛选，从而基于扩展后的属性列表选择文件。\n\
  \n> **注意**  \n> 你也可以根据目录、日期或显示的任何文件信息进行筛选。只需应用你在第 6 章中学到的筛选技术即可。\n\n\n\n### 加载多个文件后删除标题行\n\
  \n如果源文件中包含每个源文件加载时自带的标题行，这里有一种快速将其从数据中删除的实用方法：\n\n1. 如果（且仅当）每个文件都包含标题行，则在生成的表中向下滚动，直到找到标题元素。在本示例中，它是`ColourID`列中的`ColourID`一词。\n\
  2. 右键单击`ColourID`，然后选择**文本筛选器 ➤ 不等于**。所有包含多余列标题的行都将被删除。\n\n**注意**\n\n如果你的源目录中仅包含要加载的文件，则第\
  \ 2 步并非必要。不过，我总会添加此类步骤，以防后续添加了“错误”类型的文件，导致后续任何处理过程运行失败。同样，你也可以对文件名设置筛选器，以限制加载的文件。\n\
  \n### 合并结构相同的文件\n\nPower Query 还可以通过与前文所学技术略有不同的方式来合并源文件。此技术同样适用于文本、CSV、固定宽度、XML\
  \ 或 JSON 文件。\n\n1. 执行“从源文件夹添加多个文件”部分中的第 1 到第 5 步，以显示包含你要加载的文件的文件夹内容。在此场景中，该文件夹为`C:\\\
  DataMashupWithExcelSamples\\MultipleIdenticalFiles`。\n2. 单击名为`Content`的列。\n3. 在\
  \ Power Query 的**主页**功能区中，单击**合并文件**按钮。将会出现如图 9-7 所示的**合并文件**对话框。\n4. 单击**确定**。\n\
  \nPower Query 将评估源文件的格式，并将所有源文件追加到单个查询中。\n\n**注意**\n\nPower Query 将创建一组辅助查询来执行此操作。如果展开\
  \ Power Query 的**查询**窗格，你将看到它添加的新查询。这些查询也将显示在 Excel 的**查询和连接**窗格中。\n\n## 加载并解析 JSON\
  \ 文件\n\n如今，越来越多的数据以名为 JSON 的格式进行交换。JSON 代表 JavaScript 对象表示法，它被认为是一种高效且轻量级的方式来传输可能大量数据。JSON\
  \ 文件本质上是一种包含按特定方式结构化的数据的文本文件。\n\n虽然 Power Query 可以非常轻松地连接到 JSON 数据文件（毕竟它们只是一种文本文件），但其中包含的数据并非总是立即可理解的。因此，你现在将学习如何加载文件，然后了解如何调整此连接以将其转换为有意义的信息。将源文本转换为可理解的格式通常被称为*解析*数据。\n\
  \n要连接到 JSON 文件并将其包含的数据解析为可用的表：\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig9_HTML.jpg](img/497001_1_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9 初始导入后的 JSON 文件\n\n1. 在**数据**功能区中，单击**获取数据 ➤ 来自文件 ➤ 来自 JSON**。\n2. 选择文件`C:\\\
  DataMashupWithExcelSamples\\Colors.json`，然后单击**导入**。你将看到一个类似图 9-9 所示的记录列表。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig10_HTML.jpg](img/497001_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10 “到表”对话框\n\n3. 你将看到查询编辑器已将**列表工具转换**功能区添加到菜单栏。此功能区将在下一节详细说明。单击此功能区中的**到表**按钮。将会出现如图\
  \ 9-10 所示的**到表**对话框。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig11_HTML.jpg](img/497001_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11 转换为表的 JSON 文件\n\n4. 单击**确定**。数据列表将被转换为表。这意味着它现在会在列标题右侧显示**展开**图标，如图 9-11\
  \ 所示。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig12_HTML.jpg](img/497001_1_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12 转换为数据集的 JSON 文件\n\n5. 单击列标题右侧的**展开**图标，并在弹出的对话框中取消选中“使用原始列名作为前缀”。\n6. 单击**确定**。JSON\
  \ 文件的内容现在显示为标准数据集，如图 9-12 所示。\n\n虽然这个过程并不特别困难，但可能看起来有点反直觉。不过，它确实有效，你可以用它来处理复杂的 JSON\
  \ 文件，以便在 Excel 中使用其中包含的数据。\n\n## “列表工具转换”功能区\n\nPower Query 将某些数据视为列表，而非数据表。它处理列表的方式略有不同，并会显示一个特定的功能区来修改列表数据。**列表工具转换**功能区如图\
  \ 9-13 和表 9-1 所示。\n\n表 9-1 列表工具转换功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 到表 | 将列表转换为表结构\
  \ |\n| 保留项目 | 允许你保留列表顶部或底部的若干项目，或列表中的一个项目范围 |\n| 删除项目 | 允许你删除列表顶部或底部的若干项目，或列表中的一个项目范围\
  \ |\n| 删除重复项 | 从列表中删除任何重复项 |\n| 反转项目 | 反转列表顺序 |\n| 排序 | 按从低到高或从高到低对列表进行排序 |\n| 统计信息\
  \ | 返回关于列表元素的计算统计信息 |\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig13_HTML.jpg](img/497001_1_En_9_Fig13_HTML.jpg)\n\
  \n图 9-13 “列表工具转换”功能区\n\n\n\n## 从列中解析 XML 数据\n\n某些数据源（尤其是数据库数据源）的字段中实际上包含 XML 数据。这里的问题是，当数据加载时，Power\
  \ Query 会将 XML 数据解释为纯文本。如果你查看图 9-14 中高亮显示的 `AvailableColors` 列，就会发现这并没有什么用处，甚至难以理解。\n\
  \n因此，Power Query 再次为这类问题提供了解决方案。为了演示如何将此类文本转换为可用数据，你将找到一个示例 Excel 文件 (`C:\\DataMashupWithExcelSamples\\\
  XMLInColumn.xlsx`)，该文件包含一个包含 XML 数据的列。请按以下步骤操作：\n\n1.  在 **数据** 功能区中，点击 **获取数据**\
  \ > **来自文件** > **从工作簿**。\n2.  选择文件 `XMLInColumn.xlsx` 并点击 **导入**。\n3.  在导航器左侧选择\
  \ **Sales** 表，然后点击 **转换数据** 以切换到查询编辑器。\n4.  向右滚动数据集，并选择最后一列：`AvailableColors`。查询编辑器界面如图\
  \ 9-14 所示。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig14_HTML.jpg](img/497001_1_En_9_Fig14_HTML.jpg)\n\
  \n**图 9-14** 包含 XML 的列\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig15_HTML.jpg](img/497001_1_En_9_Fig15_HTML.jpg)\n\
  \n**图 9-15** 转换为表格列的 XML 列\n\n5.  在 **添加列** 功能区中，点击 **解析** 按钮上的小三角形，然后选择 **XML**。一个新的列将被添加到右侧。它将如图\
  \ 9-15 所示，并带有标题 `XML`。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig16_HTML.jpg](img/497001_1_En_9_Fig16_HTML.jpg)\n\
  \n**图 9-16** XML 数据展开到新列\n\n6.  点击 `XML` 列标题右侧的 **展开** 图标，并在弹出的对话框中取消勾选“使用原始列名作为前缀”。确保选中所有列，然后点击\
  \ **确定**。两个新列（实际上与 XML 数据元素数量相同）将出现在数据集的右侧。查询编辑器将如图 9-16 所示。\n\n7.  选择包含原始 XML 的列，并在上下文菜单中点击\
  \ **删除列**，以移除包含初始 XML 数据的列。\n8.  重命名任何新列，赋予其有意义的标题。\n\n使用此技术，你现在可以提取源数据集中的 XML 数据，并用它来扩展现有原始数据。\n\
  \n### 从列中解析 JSON 数据\n\n有时，你也可能会遇到字段中包含 JSON 的数据。从数据集内的字段中提取此数据并将其转换为列的技术，与你之前在 XML\
  \ 数据部分看到的方法几乎相同。\n\n鉴于该方法非常相似，并且与你之前导入 JSON 文件时看到的相差无几，我将仅提供流程最终结果的截图。在此你将能够看到源\
  \ JSON 以及从 JSON 中提取并添加到数据集的各列数据。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig17_HTML.jpg](img/497001_1_En_9_Fig17_HTML.jpg)\n\
  \n**图 9-17** JSON 数据展开到新列\n\n1.  遵循先前示例的步骤 1 到 4，但使用文件 `C:\\DataMashupWithExcelSamples\\\
  JSONInColumn.xlsx`。选择此文件中的唯一工作表：**Sales**。\n2.  向右滚动数据集，并选择最后一列：`AvailableColors`。\n\
  3.  在 **添加列** 功能区中，点击 **解析** > **JSON**。一个新的列将被添加到右侧，并带有标题 `JSON`。\n4.  点击 `JSON`\
  \ 列标题右侧的 **展开** 图标，并在弹出的对话框中取消勾选“使用原始列名作为前缀”。确保选中所有列，然后点击 **确定**。两个新列（实际上与 JSON\
  \ 数据元素数量相同）将出现在数据集的右侧。查询编辑器将如图 9-17 所示。\n\n5.  删除包含初始 JSON 数据的列。\n6.  如有必要，重命名任何新列。\n\
  \n诚然，本例中 JSON 数据的结构非常简单。现实世界中的 JSON 数据可能要复杂得多。不过，你现在有了一个起点，可以在解析存储在数据集列中的 JSON 数据时，以此为基础进行构建。\n\
  \n\n\n#### 复杂 JSON 文件\n\nJSON 文件的结构并非总像你之前看到的 `Colors.json` 文件那样简单。实际上，JSON 文件可能包含多个层级的数据，这些数据被组织成独立的*节点*。每个节点可能包含多个以逻辑方式组合在一起的数据元素。通常，你可能希望从源文件中选取数据的“子层级”，或者仅选取部分子层级元素，而非全部。\n\
  \n本节将展示如何从复杂的 JSON 结构中选取你感兴趣的数据元素。具体来说，示例源数据文件（`CarSalesJSON_Complex.json`）包含一个“根”层级，该层级显示核心数据，如发票号码、销售日期和销售价格（以及其他元素），以及包含以下信息的三个“子层级”：\n\
  \n-   车辆\n-   财务数据\n-   客户\n\n这里的挑战在于将 `Vehicle` 和 `FinanceData` 节点中的数据“扁平化”为可随后用于分析的标准列。\n\
  \n> **注意**\n> 如果你想了解包含多个嵌套节点的复杂 JSON 文件是什么样的，只需在文本编辑器中打开 `C:\\DataMashupWithExcelSamples\\\
  CarSalesJSON_Complex.json` 文件即可。\n\n在本示例中，你将看到如何从源文件中可用的一个或多个（但并非全部）数据元素中进行选择。\n\
  \n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig18_HTML.jpg](img/497001_1_En_9_Fig18_HTML.jpg)\
  \  \n*图 9-18：打开一个复杂的 JSON 文件*\n\n1.  在 Excel 功能区中，依次点击 `获取数据` ➤ `来自文件` ➤ `来自 JSON`。导航到包含你想要加载的\
  \ JSON 文件的文件夹（本例中为 `C:\\DataMashupWithExcelSamples\\CarSalesJSON_Complex.json`）。\n\
  \n2.  点击 `导入`。将出现查询编辑器窗口，并自动显示 `记录工具转换` 功能区。你可以在图 9-18 中看到此界面。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig19_HTML.jpg](img/497001_1_En_9_Fig19_HTML.jpg)\
  \  \n*图 9-19：一个复杂的 JSON 文件*\n\n3.  从 `记录工具转换` 功能区中点击 `转到表格`。此时查询编辑器将如图 9-19 所示。\n\
  \n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig20_HTML.jpg](img/497001_1_En_9_Fig20_HTML.jpg)\
  \  \n*图 9-20：展开一个 JSON 文件*\n\n4.  点击 `Value` 列右上角的展开图标，然后选择 `扩展到新行`。此时查询编辑器将如图 9-20\
  \ 所示。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig21_HTML.jpg](img/497001_1_En_9_Fig21_HTML.jpg)\
  \  \n*图 9-21：查看 JSON 文件的结构*\n\n5.  点击 `Value` 列右上角的展开图标，并取消选中 `使用原始列名称作为前缀`。\n\n\
  6.  点击 `确定` 以显示所有 JSON 属性。查询编辑器窗口将如图 9-21 所示。每个包含“记录”一词的列实际上都是一个包含更深层数据子层级的 JSON\
  \ 节点。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig22_HTML.jpg](img/497001_1_En_9_Fig22_HTML.jpg)\
  \  \n*图 9-22：JSON 文件中的嵌套元素*\n\n7.  选择 `Vehicle` 列，并点击列标题右侧的展开图标。将显示源 JSON 内部较低层级“嵌套”的可用元素列表。你可以在图\
  \ 9-22 中看到此界面。\n\n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig23_HTML.jpg](img/497001_1_En_9_Fig23_HTML.jpg)\
  \  \n*图 9-23：解析后的 JSON 文件*\n\n8.  点击 `确定`。新的列将被添加到数据表中。\n\n9.  选择 `Finance` 列，并点击列标题右侧的展开图标。将显示该列源\
  \ JSON 内部较低层级“嵌套”的可用元素列表。仅选择 `Cost` 列，然后点击 `确定`。\n\n10. 移除 `Customer` 列，因为在本示例中我们不会使用该列的数据。查询编辑器窗口将如图\
  \ 9-23 所示，现在所有必需的列都显示在数据表中。\n\n11. 点击 `Power Query 主页` 菜单中的 `关闭并加载`，将“扁平化”后的 JSON\
  \ 数据返回到 Excel 工作表中。\n\n> **注意**\n> 在识别 JSON 节点中的嵌套数据时，最好点击展开弹出菜单中的 `加载更多` 链接。这将强制\
  \ Power Query 扫描更多数量的记录，并可能返回更完整的嵌套字段列表。\n\n这种方法让你能够极为精确地选择从 JSON 文件中加载的数据。你可以选择包含源结构中任何层级的任何列。如你所见，你可以极为轻松地选择（或忽略）嵌套数据的整个子层级。\n\
  \n本节只是对解析复杂 JSON 文件的一个简单介绍。由于这种特定的数据结构可能包含多个数据子层级，并且可以在 JSON 文件的每个节点中混合数据和子层级，因此源数据结构可能极其复杂，并且可能包含层层嵌套的节点。幸运的是，你刚刚学到的技术可以扩展以处理任何复杂程度的\
  \ JSON，并帮助你驯服那些最令人生畏的数据结构。\n\n> **注意**\n> “扁平化”源数据非常重要，以便移除所有子层级（或节点，如果愿意这么称呼的话），并将其包含的数据显示为查询中的简单列。否则，这些数据将难以在\
  \ Excel 中使用。\n\n#### 复杂 XML 文件\n\n与 JSON 文件类似，XML 文件也可以包含由多个数据子层级组成的复杂嵌套结构，这些结构被分组到单独的节点中。好消息是，Power\
  \ Query 编辑器以相同的方式处理这两种数据结构。\n\n这两种方法非常相似，因此我不会展示所有截图——它们与上一节中的截图几乎相同。\n\n1.  在 Excel\
  \ 功能区中，依次点击 `获取数据` ➤ `来自文件` ➤ `来自 XML`。导航到包含你想要加载的 XML 文件的文件夹（本例中为 `C:\\DataMashupWithExcelSamples\\\
  ComplexXML.xml`）。\n\n2.  点击 `导入`。将出现导航器对话框。\n\n3.  在左侧选择 `Sales` 作为源数据表。\n\n4. \
  \ 点击 `转换数据`。将出现查询编辑器。\n\n5.  选择 `Vehicle` 列，并点击列标题右侧的展开图标。将显示源 XML 内部较低层级“嵌套”的可用元素列表。\n\
  \n6.  取消选中 `使用原始列名称作为前缀` 复选框。\n\n7.  点击 `确定`。\n\n8.  点击 `Finance` 列右上角的展开图标，并取消选中\
  \ `使用原始列名称作为前缀` 复选框。\n\n9.  点击 `加载更多` 以显示更详尽的数据元素列表。\n\n10. 点击 `确定`。新的列将被添加到数据表中。\n\
  \n11. 选择 `Customer` 列，并点击列标题右侧的展开图标。将显示源 XML 内部较低层级“嵌套”的可用元素列表。仅选择 `CustomerName`\
  \ 列，然后点击 `确定`。\n\n12. 点击 Power Query 窗口顶部的 `关闭并加载`。\n\n与 JSON 文件的情况一样，这种方法让你能够极为精确地选择从\
  \ XML 源文件中加载的数据。你可以选择包含源结构中任何层级的任何列。你可以极为轻松地选择（或忽略）嵌套数据的整个子层级。\n\n\n\n## 将列转换为列表\n\
  \n有时你需要以列表格式使用数据。在第 11 章学习如何参数化查询时，你将看到一个实际示例。幸运的是，Power Query 让你能够轻松地将列转换为列表：\n\
  \n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig24_HTML.jpg](img/497001_1_En_9_Fig24_HTML.jpg)\n\
  \n图 9-24\n转换为列表操作所得到的列表\n\n1.  点击 `获取数据` ➤ `来自文件` ➤ `来自 Excel`，然后选择 Excel 文件 `C:\\\
  DataMashupWithExcelSamples\\BrilliantBritishCars.xlsx`。\n2.  点击 `导入` 以显示 `导航器`。\n\
  3.  选择工作表 `BaseData`，然后点击 `转换数据` 以打开 `查询编辑器`。\n4.  通过点击列标题选择要转换为列表的列。在本示例中，我将使用\
  \ `Make` 列。\n5.  在 `转换` 功能区中，点击 `转换为列表`。`查询编辑器` 将显示生成的列表，如图 9-24 所示。\n\n现在，在某些情况下，执行更高级的数据转换过程时，可以使用此列表。\n\
  \n## 重用数据源\n\n在第 2 章到第 5 章中，你已经了解了如何从各种源访问数据，以在一系列报表中构建一系列查询。实际情况很可能是，你会频繁地想反复指向相同的数据源。为此，Power\
  \ Query 开发团队找到了一种方法，让你的工作更轻松。\n\nExcel 会记住你最近使用的数据源，并允许你在任何报表中快速轻松地重用它们。操作方法如下：\n\
  \n![../images/497001_1_En_9_Chapter/497001_1_En_9_Fig25_HTML.jpg](img/497001_1_En_9_Fig25_HTML.jpg)\n\
  \n图 9-25\n最近使用的源\n\n1.  在 `主页` 功能区中，点击 `最近使用的源` 按钮。将出现一个包含最近使用过的数据源的对话框。你可以在图 9-25\
  \ 中看到此对话框。\n2.  点击你想要重新连接的源，然后点击 `连接` 按钮以继续加载数据或建立连接。\n\n### 固定数据源\n\n如果仔细观察图 9-25，你会发现数据库连接\
  \ `ADAM03:CarSalesData` 被固定在 `最近使用的源` 对话框的顶部，这反映了我最近建立的一个数据库连接。这可以确保你某些数据源始终随手可用，随时准备重用。\n\
  \n请执行以下操作，将最近使用的数据源固定到“最近使用的源”菜单和对话框：\n\n1.  点击 `数据` 功能区中的 `最近使用的源` 按钮。将显示 `最近使用的源`\
  \ 对话框。\n2.  将鼠标悬停在最近使用的数据源上。数据源名称的右侧会出现一个图钉图标。\n3.  点击图钉图标。该数据源将被固定在 `最近使用的源` 菜单和\
  \ `最近使用的源` 对话框的顶部。数据源名称的右侧会保留一个小图钉图标。\n\n注意\n\n要从 `最近使用的源` 菜单和 `最近使用的源` 对话框中取消固定数据源，你只需点击已固定数据源的图钉图标即可。这将取消固定，并使其重新出现在最近使用的数据源列表中。\n\
  \n如果你愿意，还可以在决定要在 `最近使用的源` 列表中显示哪些元素时应用以下选项：\n\n*   从列表中删除\n*   清除列表中未固定的项目\n\n##\
  \ 从 Power Query 编辑器复制数据\n\nPower Query 被设计为数据目的地。它本身没有数据导出功能。不过，你可以手动从 Power Query\
  \ 编辑器复制数据。更准确地说，你可以复制以下任何内容：\n\n*   查询中的数据\n*   数据列\n*   单个单元格\n\n在所有情况下，过程都是相同的：\n\
  \n1.  点击要复制的元素。这可以是：\n    1.  数据网格左上角的方块\n    2.  列标题\n    3.  单个单元格\n2.  右键单击并从上下文菜单中选择\
  \ `复制`。\n\n然后，你可以将剪贴板中的数据粘贴到目标应用程序中。\n\n注意\n\n此过程有些局限，因为你无法选择一定范围的单元格。而且你必须记住，在查询编辑器中看到的只是示例数据。由于你可以简单地将数据从\
  \ Power Query 加载到 Excel 中，所以我只是将其作为一个次要点进行解释，在实践中意义有限。\n\n## 结论\n\n本章通过解释如何处理基于\
  \ Excel 和文本数据的多个文件加载，将你在 Power Query 编辑器中的数据转换知识提升到了一个新水平。然后，你学习了处理来自包含复杂嵌套源结构（特别是\
  \ JSON 和 XML 文件）的源文件的数据的方法。你还了解了如何解析来自其他数据源中包含的列的 JSON 和 XML 元素。\n\n接着，你学习了如何重用数据源和管理常用数据源以节省时间。最后，你学习了如何将数据转换过程中产生的示例数据复制到其他应用程序中。\n\
  \n至此，使用 Power Query 编辑器进行数据加载和转换的基础介绍就结束了。现在是时候转向更高级的技术了，你可以应用这些技术来加速、增强、管理和结构化你的数据转换过程，并添加一定程度的交互性。这些方法将是接下来两章的主题。\n\
  \n"
- '# 10. 组织和管理查询


  生成一个稳健高效的数据查询，不仅仅是找到合适的加载和转换函数并将它们按正确顺序排列，还涉及扩展、维护和更新这个过程。这可能是为了在测试查询时纠正错误，也可能是为了使查询适应新的需求。本章将介绍一些你可以应用的技术，以处理查询生命周期的各个阶段。


  交付具有洞察力的分析可能意味着要从大量、多样的查询中获取数据。这也可能意味着这些查询需要链接在一起，形成一个数据转换的级联，从而为整理自多个来源的、实用且可用的数据模型准备核心元素。因此，你需要知道如何*管理*你创建的查询，以便高效地使用它们，并在实际场景中让你的查询处于可控状态。




  ## 管理转换过程


  到目前为止，我们应用的所有转换步骤几乎都是可以应用于任何数据表的独立元素。然而，即便是在执行简单的数据加载和转换过程时，你也可能需要逐步完成多个转换，以对数据进行塑形、清理和筛选，从而获得所需结果。这正是
  Power Query 方法如此灵活的原因，因为你可以将大多数数据转换步骤应用于几乎任何数据表。其艺术在于将它们按顺序排列，这样每当数据发生变化时，就可以重新处理新的源数据并提供最新的输出结果，从而实现重复使用。


  要理解并管理这一过程，关键在于熟悉**查询设置**窗格中的**已应用步骤**列表。该列表按应用顺序包含了你所应用的每个步骤的详细信息。每个步骤都保留了 Power
  Query 在创建时赋予的名称，并且可以通过以下方式进行修改：


  -   重命名

  -   删除

  -   移动（在某些情况下）


  更棒的是，在很多情况下，步骤是可以修改的。这样，你就不必受最初选择的限制，而是有机会对过程中的单个步骤进行调整和改进。这可以让你避免仅仅为了替换 ETL 过程中的一个元素而重建整个步骤序列。


  为了尝试修改查询的各种方法，你需要一些初始数据。因此，我建议你首先使用以下 Excel 源文件：`C:\DataMashupWithExcelSamples\CarSalesDataForQueries.xlsx`。该源文件包含连接到另一个
  Excel 文件中六个源表的查询，从而模拟了一个真实场景（其中数据源可能来自多个不同的源头，并且具有不同的来源：数据库、文本等）。


  打开此文件后，通过双击**查询和连接**窗口中的任意现有查询，切换到**查询编辑器**窗口。


  ### 修改步骤


  如何修改步骤取决于原始转换的应用方式。经过一点练习，这就会变成一种本能反应，并且始终需要先单击要修改的步骤，然后应用不同的修改。如果你调用功能区选项（例如更改数据类型），则只需直接从功能区应用另一种数据类型即可更改数据类型。如果你使用了显示对话框的选项（例如拆分列等），则可以右键单击**已应用步骤**列表中的该步骤，然后从上下文菜单中选择**编辑设置**。或者，如果你愿意，也可以单击大多数（但不是所有）步骤右侧显示的“齿轮”图标，以显示一个对话框，你可以在其中调整步骤设置。此对话框将显示你最初应用的所有选项和设置；你可以根据需要在此进行任何修改。


  最后一种便于修改过程设置的方法是编辑每次单击某个步骤时在公式栏中显示的公式。然而，这需要理解作为数据转换过程基础的每段代码的所有复杂性。我将在第 12 章中简要介绍代码修改。


  #### 提示


  如果你能强迫自己组织好使用 Power Query 编写的过程，那么稍微的预先思考和规划就能带来巨大的回报。例如，某些任务（例如设置数据类型）可以在一个操作中完成。这意味着你只需在一个地方查找一组相似的数据转换。不仅如此，如果你稍后需要更改某列的数据类型，我建议你在进行任何进一步更改之前单击**已更改的类型**步骤。这样，你就可以扩展原始步骤，而不是创建其他步骤——后者可能会使过程更加混乱且不必要地冗长。


  ### 重命名步骤


  Power Query 使用应用的转换名称来命名步骤。这意味着如果稍后应用了另一个类似的步骤，Power Query 会使用相同的名称并加上数字增量。由于在审查一系列转换步骤时，这并不总是易于理解，因此你可能更愿意为各个步骤指定更用户友好的名称。操作方法如下：


  1.  选择查询（或源表/工作表，如果你愿意）。在此示例中，我将使用**客户**查询。

  2.  右键单击要重命名的步骤，例如**已更改的类型**。

  3.  从上下文菜单中选择**重命名**。

  4.  输入新名称。我将使用 `NewDataTypes`。

  5.  按 Enter 键。


  该步骤即被重命名，新名称将出现在**查询设置**窗格的**已应用步骤**列表中。这样，当你在数天、数周甚至数月后重新查看数据转换过程时，就能更直观地理解你所定义的过程，以及当初为何如此塑造数据。


  #### 注意


  在 Power Query 中命名步骤时，你可以使用大写或小写字符，或者两者混合。你也可以添加空格和特殊字符。


  ### 删除一个步骤或一系列步骤


  删除一个步骤非常容易，但这样做可能会产生严重后果。这是因为 ETL 过程通常是一系列紧密耦合的事件，每个事件都密切依赖于前一个事件。因此，删除一个步骤可能导致所有后续步骤失败。知道哪些事件可以在没有严重后果的情况下删除，取决于你正在开发的过程类型以及你对
  Power Query 的经验。无论如何，如果你需要删除一个步骤，应该这样做：


  ![../images/497001_1_En_10_Chapter/497001_1_En_10_Fig1_HTML.jpg](img/497001_1_En_10_Fig1_HTML.jpg)


  **图 10-1** – 删除步骤对话框


  1.  将指针悬停在要删除的过程步骤上。

  2.  单击出现的交叉 (×) 图标。

  3.  选择**删除**。*可能会*出现**删除步骤**对话框（如果删除此步骤可能会产生意外的负面后果），如图 10-1 所示。

  4.  单击**删除**按钮确认。该步骤即被删除。


  如果——并且这非常可能——删除此步骤导致过程其余部分出现问题，你将看到数据表被一条错误消息替代。此消息的内容将根据 Power Query 遇到的错误类型而有所不同。


  在描述此技术时，我特意提到了你*可能会*看到**删除步骤**对话框。如果你删除的是步骤序列中的最后一个步骤，那么你很可能不会看到它，因为应该不会有任何潜在的可怕后果；最坏的情况是，你需要重新创建该步骤。如果你删除的是过程中间的某个步骤，那么在可能造成大量问题之前，你可能需要认真考虑是否要这样做。因此，在这些情况下，系统会要求你确认删除。


  另一种方法是右键单击要删除的步骤，然后选择**删除**。你可能仍然需要确认删除。


  如果你意识到某个过程步骤中的错误导致你截至过程结束的所有工作都无效，那么与其逐个删除多个元素，不如在前述练习的第 2 步中，从上下文菜单中选择**删除至结尾**。




  ### 放弃更改


  如果在使用 Power Query 工作时，你突然发现自己刚刚毁掉了数小时的工作成果，那么（深吸一口气后）


  ![../images/497001_1_En_10_Chapter/497001_1_En_10_Fig2_HTML.jpg](img/497001_1_En_10_Fig2_HTML.jpg)


  图 10-2 Power Query 中的放弃更改对话框


  1.  点击 Power Query 编辑器窗口右上角的关闭按钮（小叉号）。将会出现如图 10-2 所示的对话框。

  2.  点击 `Discard` 关闭 Power Query，不应用任何更改。


  不要指望像在其他桌面应用程序中那样使用撤销功能。为了降低你的血压，你或许更倾向于在*删除*任何步骤之前，保存一份包含复杂数据转换过程的文件副本。你也可以将整个数据转换过程复制为“M”代码——正如你将在第
  12 章中学到的那样。


  ### 修改现有步骤


  当你创建一系列已应用步骤来生成和转换数据流时，Power Query 并不会试图将你锁定在一个僵化的事件序列中。当你发现需要更改过程中的某个步骤时，这一点就变得尤为明显。


  例如，假设你发现从 Excel 文件中选择初始数据时加载了错误的工作表。你无需重复整个过程，只需将一个工作表名称替换为另一个即可。


  假设你已经打开了 Excel 工作簿 `CarSalesDataForQueries.xlsx` 并切换到了查询编辑器：


  ![../images/497001_1_En_10_Chapter/497001_1_En_10_Fig3_HTML.jpg](img/497001_1_En_10_Fig3_HTML.jpg)


  图 10-3 用于步骤修改的导航对话框


  1.  选择你想要修改的查询（在此示例中为“Clients”）。

  2.  点击要修改的步骤（在此例中，将是 `Navigation`）。

  3.  点击步骤名称右侧的齿轮图标。相应的对话框将会出现。在此例中，将是你在图 10-3 中看到的 `Navigation` 对话框。

  4.  点击你想要用来替换当前数据集的表或工作表（在此示例中为 `Table1`）。

  5.  点击 `OK`。


  查询编辑器会将一个源数据集替换为另一个。它还可能会添加额外的步骤，以确保数据适用于查询。


  正如你在前九章中看到的，Power Query 提供了极其广泛的数据引入和修改可能性。因此，我无法在这里就修改 `已应用步骤` 描述所有可能的选项。不过，其原则很简单：


  - 如果查询编辑器可以修改某个步骤，齿轮图标将显示在该步骤名称的右侧。

  - 点击修改（齿轮）图标将显示用于创建该步骤的对话框（即使该步骤是由 Power Query 自动创建的）——或者显示一个允许你修改该步骤的对话框。


  某些步骤不会显示修改图标。这是因为该步骤无法被修改，只能被移除（至少在使用查询编辑器界面时是如此）。作为示例，请添加以下步骤：


  1.  选择你想要修改的查询（在此示例中为“Clients”）。

  2.  点击最后一个步骤。

  3.  右键点击 `Address2` 列，然后选择 `Remove`。


  在 `已应用步骤` 列表中会出现一个新步骤，名为 `Removed Columns`。此步骤没有修改图标。因此，目前你可以移除它，但*不能*修改它——至少不能通过图形用户界面进行修改。不过，你可以修改步骤的代码，正如你将在第
  12 章中学到的那样。


  **注意**：修改现有步骤并非“万能灵药”。这是因为一系列数据转换可能高度依赖于为特定数据结构开发的定制逻辑。例如，这也就意味着你只能将数据源替换为另一个结构几乎完全相同的源。然而，在许多情况下，修改某个步骤可以避免你重写整个数据流序列。


  ### 添加步骤


  你可以在序列的任何位置添加步骤。你所需要做的就是，在点击与要插入的新步骤相对应的任何功能区图标*之前*，先点击*位于*该新步骤*之前*的步骤。与删除步骤时的情况一样，Power
  Query 会显示一个警告提示，告知你此操作*可能*会从这个新步骤开始，给后续流程带来问题。


  ### 更改流程步骤顺序


  从技术上讲，可以对过程中的步骤重新排序。然而，根据我的经验，这并非总是可行，因为更改过程中步骤的顺序可能像删除步骤一样造成严重破坏。尽管如此，你仍然可以像这样尝试：


  1.  右键点击你想要重新排序的步骤。

  2.  从上下文菜单中选择 `上移` 或 `下移`。


  我仍持悲观态度，认为这不会有多大奇效，但知道有这个功能也不错。


  **提示**：请记住，在调整流程应用顺序之前，点击任何流程步骤都会使 Power Query 窗口中的表格刷新，以显示截至该选定步骤的数据状态。这是理解流程以及
  ETL 过程如何执行的非常清晰的视觉指南。实际上，逐一点击步骤将会“滚动浏览”数据中的变化，并精确演示整个流程是如何构建和工作的。


  ### 排序方法


  考虑到可用的数据转换选项众多，你可能很想知道如何使用 Power Query 来最好地处理新的 ETL 项目。我明白所有项目都各不相同，但作为一个粗略的指南，我建议尝试按如下顺序组织你的项目：


  1.  将样本数据加载到 Power Query 中。

  2.  提升或添加易于理解的列标题。例如，当某个列本可以命名为（比如）`ClientName` 时，你肯定不想在处理过程第 47 步时还要琢磨 `Column29`
  是什么。

  3.  移除任何你不需要的列。数据集越小，处理速度越快。更重要的是，如果你只关注真正需要的信息，你会发现更容易集中精力理解数据。任何被移除的列都可以通过删除或编辑执行移除操作的步骤来恢复到数据集中。

  4.  更改表中每一列的数据类型。正确的数据类型是许多转换步骤的基础，并且对于筛选至关重要，因此最好尽早解决它们。

  5.  筛选掉任何你不需要的记录。再次强调，数据集越小，处理速度越快。这包括去重。

  6.  解析任何复杂的 JSON 或 XML 元素。

  7.  执行任何必要的数据清洗。

  8.  执行任何必要的转换。

  9.  执行任何必要的列拆分或添加自定义列。

  10. 添加任何派生列。

  11. 添加任何计算或数据的逻辑转换。

  12. 处理 ETL 过程中产生的任何错误记录。


  再次强调，我必须申明这并不是一个权威指南。然而，我希望当你使用 Power Query 创建数据加载和转换过程时，它能帮助你“透过树木看到森林”。


  ### 错误记录


  某些数据转换操作会导致错误。在整合源数据时，这有时是不可避免的事实。例如，在一个大型数据集中，可能有几行数据里，某个日期列包含了一些文本或数字的记录。如果你将该列转换为日期数据类型，那么任何无法转换的值都会显示为错误值。




  ## 管理查询


  一旦你使用 Power Query 一段时间，你很可能会沉迷于基于更广泛的数据源创建更多、更深入的分析。这不可避免地意味着要学习如何高效且富有成效地管理那些为数据模型提供数据的数据源。


  幸运的是，Power Query 内置了一整套小巧的查询管理工具来帮助你。这些工具包括：


  - 将查询整理并分组到文件夹中

  - 复制查询

  - 引用查询

  - 记录查询

  - 将列添加为新查询


  让我们逐一来看这些功能。


  > **注意**：查询管理在很大程度上依赖于`查询`窗格。Power Query 默认隐藏此窗格，因此你需要点击数据左侧折叠的`查询`窗格右上角的 V 形图标来显示它。此外，许多查询管理功能也可以直接从
  Excel 内部的`查询和连接`窗格的弹出菜单中使用。


  ### 整理查询


  当你在 Power Query 编辑器中使用的查询数量从几个到几十个时，你可能会希望对它们的组织方式施加一些控制。首先，你可以修改查询在 Power Query
  编辑器窗口左侧`查询`窗格中的显示顺序。这让你可以覆盖默认顺序，即最近添加的数据源会出现在列表底部。


  要更改查询在列表中的位置，请执行以下操作：


  1.  如果`查询`窗格尚未显示，请将其显示出来。

  2.  右键单击要移动的查询。

  3.  从上下文菜单中选择`上移`（或`下移`）。


  你需要多次执行此操作才能将查询向上或向下移动多个位置。因此，另一种方法——在列表中向上或向下拖动查询——可能也值得使用。


  ### 分组查询


  你还可以创建自定义组，以更好地组织在 Excel 文件中使用的查询。这不会对查询的工作方式产生任何影响。分组查询仅仅是一种组织技术，它不会以任何方式改变你在 Excel
  报表模式下看到的数据表。但是，你会在 Excel 的`查询和连接`窗格中看到你创建的组。


  #### 创建新组


  以下是创建新组的方法：


  ![../images/497001_1_En_10_Chapter/497001_1_En_10_Fig4_HTML.jpg](img/497001_1_En_10_Fig4_HTML.jpg)


  **图 10-4** 新建组对话框


  1.  右键单击要添加到新组的查询。我将使用从 Excel 文件 `CarSalesDataForQueries.xlsx` 中打开的查询编辑器中的 `Colors`
  查询。

  2.  从上下文菜单中选择`移动到组` > `新建组`。将出现`新建组`对话框。

  3.  输入组名，并（可选）输入描述。我将组命名为 `ReferenceData`。对话框将类似于图 10-4 所示。

  4.  单击`确定`。


  新组创建完成，所选查询将出现在该组中。`查询`窗格将类似于图 10-5 所示。


  ![../images/497001_1_En_10_Chapter/497001_1_En_10_Fig5_HTML.jpg](img/497001_1_En_10_Fig5_HTML.jpg)


  **图 10-5** 添加了新组的“查询”窗格


  > **注意**：默认情况下，所有其他查询都会添加到名为`其他查询`的组中。


  如果你创建了数十个查询，这项技术确实可以帮助你管理复杂的数据加载过程。正如你所料，你可以通过单击文件夹名称左侧的三角形来展开或折叠一个组。


  #### 重命名组


  你可以重命名任何已添加的组。


  1.  右键单击要重命名的组。

  2.  从上下文菜单中选择`重命名`。

  3.  编辑或替换名称。

  4.  按`回车键`。


  > **注意**：`其他查询`组无法重命名或删除。默认情况下，所有新查询都将添加到此组。你也可以双击该组直接进行重命名。


  #### 向组中添加查询


  要将查询从其当前组移动到另一个组，可以执行以下步骤：


  1.  右键单击要添加到另一个现有组的查询。

  2.  从上下文菜单中选择`移动到组` > *目标组名称*。


  所选查询将被移动到选定的组。该组结构也将在 Excel 的`查询和连接`窗格中可见。


  ### 复制查询


  如果你已经做了大量的数据转换工作，你很可能会希望在进行任何可能有风险的修改之前，保留原始查询的副本。幸运的是，这非常简单。


  1.  右键单击要复制的查询。

  2.  从上下文菜单中选择`复制`。


  查询被复制，副本会出现在与源查询相同的组内的查询列表中。它的名称与原始查询相同，但末尾会附加一个带括号的数字。你可以在`查询设置`窗格、查询编辑器窗口左侧的`查询`窗格或
  Excel 本身的`查询和连接`窗格中随时重命名它。


  > **注意**：如果你愿意，也可以复制并粘贴查询。这种技术的优点在于，你可以在*粘贴*查询副本之前，通过单击所需目标组的文件夹图标，为复制的查询选择目标组。




  #### 引用查询


  如果你正在构建一个复杂的 **ETL**（提取、转换、加载）例程，你可能会考虑将工作分阶段进行，以便更好地管理流程。为了帮助你实现这一点，Power Query
  编辑器允许你将一个查询的输出用作另一个查询的源。这使你能够将流程的不同部分（例如，结构、筛选、然后清洗）分解到单独的查询中，这样你就可以在不同的查询中专注于转换的不同方面。


  要将一个查询的输出用作另一个查询的源数据，你需要*引用*一个查询，操作如下：


  1.  右键单击要用作新查询源数据的查询。

  2.  从上下文菜单中选择 `Reference`。一个新的查询将出现在“查询”窗格的查询列表中。

  3.  右键单击新查询，选择 `Rename`，并为其指定一个有意义的名称。


  除非你重命名该查询，否则新查询将与原始查询同名，并在末尾附加一个带括号的数字。如果单击新查询，你会在被引用的查询中看到与单击源查询中最后一步时完全相同的数据。


  从现在开始，你在被引用（源）查询中所做的任何修改，都会对用作第二个查询源的数据产生影响。换句话说，你已经在数据引入过程中创建了一个查询序列。


  在实践中，我认为你不会希望使用同一个查询的两个副本来创建报表。实际上，如果一个查询被用作“中间”查询，它所包含的数据甚至可能不是完全可用的。因此，你可能希望*阻止中间查询将数据输出到
  Excel*。操作如下：


  1.  在“数据”功能区中，单击 `获取数据` ➤ `来自文件` ➤ `从工作簿`。

  2.  选择文件 `BrilliantBritishCars.xlsx` 并单击 `导入`。

  3.  在“导航器”对话框中，选择源表 `BaseData`。

  4.  单击 `加载` 按钮右侧的弹出菜单，然后选择 `加载到`。将显示“导入数据”对话框。

  5.  单击 `仅创建连接`。

  6.  单击 `确定`。


  源查询将出现在 `查询和连接` 窗格中，但会被标记为 `仅限连接`。


  **提示**


  你无法在 Excel 的 `查询和连接` 窗格中隐藏查询，但你可以将引用查询放在一个自定义组中，以便在视觉上隔离它们。


  你可能想知道为什么要创建“中间”查询。这里有一些想法：


  -   你希望将复杂的数据转换隔离到更易于管理的子集中。例如，你可能想要一个中间查询来转换数据，然后由后续查询来清洗数据。

  -   你可能希望应用一组通用的初始转换，然后将这些转换分别输入到两条独立的数据准备路径中——一条是数据的详细视图，另一条是汇总视图。


  **注意**


  将现有查询转换为仅连接（以备用作引用查询）的方法是，删除包含输出数据的工作表（或 Power Pivot 工作表）。


  #### 记录查询


  在一个复杂的 **ETL** 过程中，很容易混淆或干脆忘记哪个查询做什么。因此，我总是建议通过添加有意义的说明来记录查询。


  ![图 10-6](img/497001_1_En_10_Fig6_HTML.jpg)


  *图 10-6* 为查询添加说明


  1.  右键单击你想要添加注释的查询。

  2.  从上下文菜单中选择 `属性`。将出现“查询属性”对话框。

  3.  添加说明。其结果可能类似于图 10-6 中所示的对话框。

  4.  单击 `确定`。


  如果你将光标悬停在查询编辑器“查询”窗格的查询列表中的查询名称上，你添加的说明现在将作为工具提示显示。如果你将鼠标指针悬停在 Excel 的 `查询和连接` 窗格中的查询上，你还会在此查询的“预览”窗口中看到该说明。


  **注意**


  单击 `快速数据加载` 会尝试更快地加载数据，但在加载数据期间，Power Query 可能会在一段时间内无响应。


  #### 将列添加为新查询


  有时你可能希望提取一列数据并将其用作单独的查询。例如，可能是你需要它包含的数据作为另一个查询的参考数据。以下步骤说明了如何实现这一点：


  ![图 10-7](img/497001_1_En_10_Fig7_HTML.jpg)


  *图 10-7* “到表”对话框


  1.  在左侧的查询列表中，选择包含你想要隔离为新查询的列的查询。

  2.  右键单击包含你要隔离的数据的列标题。

  3.  从上下文菜单中选择 `添加为新查询`。将创建一个新查询。它以原始查询和源列的名称命名。

  4.  在“转换”功能区中，单击 `到表`。将出现“到表”对话框，如图 10-7 所示。

  5.  单击 `确定`。新查询将成为一个数据表，并具有你选择的列的名称。

  6.  如果你认为有必要，请重命名该查询。


  现在，你可以在数据模型中使用此查询，并将其用作一组链接查询流程的一部分。


  **注意**


  以这种方式创建的查询与从中获取数据的源查询是*完全断开的*。换句话说，对源数据的任何刷新对从列创建的新查询都*没有*影响。


  ## 从“查询和连接”窗格管理查询


  你不必切换到查询编辑器来执行本章中介绍的许多查询管理任务。你可以直接从 `查询和连接` 窗格执行多个操作。


  例如：


  ![图 10-8](img/497001_1_En_10_Fig8_HTML.jpg)


  *图 10-8* “查询和连接”窗格弹出菜单


  1.  打开 Excel 文件 `Chapter10Sample.xlsx`，并显示 `查询和连接` 窗格。

  2.  右键单击其中一个查询。将出现弹出菜单，如图 10-8 所示。

  3.  单击你想要的菜单选项。


  如你所见，并非所有查询管理选项都可用。但是，你可以使用此上下文菜单来：


  -   创建、删除和修改查询组或查询

  -   在组之间和组内移动查询

  -   展开和折叠组

  -   更改组属性

  -   复制和粘贴查询和组

  -   复制和引用查询

  -   合并和追加查询

  -   更改查询和组属性

  -   刷新查询

  -   显示查询的预览窗口


  **注意**


  上下文菜单的内容将根据你是右键单击一个组还是一个单独的查询而有所不同。


  ## 结论


  在本章中，你了解了如何管理和扩展可以使用 Power Query 创建的查询的内容。具体来说，你了解了如何修改数据加载和转换过程中的单个步骤。这包括从重命名步骤到更改过程中步骤的顺序，甚至更改步骤实际执行的规范。


  然后你了解了如何管理整个查询。你学习了如何重命名和分组查询，以及如何将查询链接起来，以便一个查询的输出成为另一个查询的数据源。


  最后，你学习了如何引用或链接查询，以隔离数据引入过程的各个部分，或将复杂的过程分解为易于管理的部分。


  现在是时候学习如何使用 Power Query 中的参数为流程添加交互性了。你将在下一章中发现这一点。




