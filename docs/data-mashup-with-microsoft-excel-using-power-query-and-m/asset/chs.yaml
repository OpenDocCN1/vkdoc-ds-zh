  \ ODBC）。如果您看不到该 ODBC 驱动程序，则需要安装或重新安装该驱动程序。请查阅您所使用的 ODBC 驱动程序的文档以获取详细信息。\n\n2. 单击\
  \ `完成`。您所选的特定 ODBC 驱动程序的配置对话框将出现。如果您使用 FileMaker Pro，该对话框将如图 5-3 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig4_HTML.jpg](img/497001_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n为 FileMaker Pro 命名 ODBC 连接\n\n1. 单击 `下一步`，并为该 ODBC 连接输入名称和描述。这看起来可能类似于图\
  \ 5-4 中所示的对话框。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig5_HTML.jpg](img/497001_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n指定 ODBC 数据的主机\n\n1. 单击 `下一步`，如果您在本地计算机上使用 FileMaker 试用版，请输入 `localhost`\
  \ 作为主机名。否则，请输入 FileMaker 服务器的 IP 地址。您应该会看到如图 5-5 所示的对话框。当然，这特定于某一个 ODBC 驱动程序。使用其他驱动程序时，对话框会有所不同。\n\
  \n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig6_HTML.jpg](img/497001_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n指定 ODBC 数据的数据库\n\n1. 单击 `下一步`，然后在 FileMaker Pro 中选择您要连接的数据库。您将看到如图 5-6\
  \ 所示的对话框（如果您*不是*使用 FileMaker Pro – 请记住，这些对话框可能会因具体的 ODBC 驱动程序而异）。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig7_HTML.jpg](img/497001_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\nODBC 连接确认对话框\n\n1. 单击 `下一步`。ODBC 配置对话框将显示连接的摘要信息。这可能类似于图 5-7 中所示。\n\n\
  ![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig8_HTML.jpg](img/497001_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\n已配置 ODBC 驱动程序的“ODBC 数据源管理器”对话框\n\n1. 单击 `完成`。您将返回到“ODBC 数据源管理器”，并且会看到刚刚创建的“系统\
  \ DSN”。“ODBC 数据源管理器”对话框应类似于图 5-8 所示。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig9_HTML.jpg](img/497001_1_En_5_Fig9_HTML.jpg)\n\
