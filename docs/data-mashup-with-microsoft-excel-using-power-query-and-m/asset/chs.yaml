  \ 对话框。\n\n3.  执行任何所需的修改。\n\n4.  单击 `确定`。\n\n如果您愿意，您也可以右键单击 `查询` 窗格中的参数，然后从弹出菜单中选择\
  \ `管理` 以显示 `参数` 对话框。\n\n## 在筛选记录时应用参数\n\n现在您已经了解了如何创建参数，是时候看看它们的实际应用了。作为应用参数的第一个示例，您将了解如何使用参数来筛选查询：\n\
  \n![../images/497001_1_En_11_Chapter/497001_1_En_11_Fig6_HTML.jpg](img/497001_1_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6\n\n为筛选器选择参数\n\n1.  打开文件 `C:\\DataMashupWithExcelSamples\\ParametersExample.xlsx`。此文件包含之前创建的三个参数。\n\
  \n2.  双击 `查询和连接` 窗格中的 `Countries` 查询，打开 Power Query 编辑器并选择 `Countries` 数据集。您可能需要通过单击\
  \ `数据` ➤ `查询和连接` 来显示 `查询和连接` 窗格。\n\n3.  单击字段名称右侧 `CountryName` 列的下拉菜单。\n\n4.  选择\
  \ `文本筛选器` ➤ `等于`。将显示 `筛选行` 对话框。\n\n5.  将第一个选项保留为 `等于`。\n\n6.  单击中间的弹出菜单（位于等于和输入或选择一个值之间），然后从列表中选择\
  \ `参数`。您可以在图 11-6 中看到这一点。\n\n![../images/497001_1_En_11_Chapter/497001_1_En_11_Fig7_HTML.jpg](img/497001_1_En_11_Fig7_HTML.jpg)\n\
  \n图 11-7\n\n为筛选器应用参数\n\n7.  为第三个弹出菜单选择 `CountriesParameter`。对话框将如图 11-7 所示。\n\n\
  8.  单击 `确定`。将应用当前参数值（您选择的国家/地区），并且数据集将使用当前参数值进行筛选。\n\n> **注意**\n>\n> 要从筛选器中移除参数，只需删除\
  \ `应用的步骤` 列表中的相关步骤即可。\n\n\n\n### 修改参数的当前值\n\n如果你觉得仅仅为了筛选数据集而设置一个参数是否值得，这种想法情有可原。然而，当你修改参数的当前值，然后刷新数据以应用新参数时，这种整体方法会变得更有意思。下面是一个示例：\n\
  \n![../images/497001_1_En_11_Chapter/497001_1_En_11_Fig8_HTML.jpg](img/497001_1_En_11_Fig8_HTML.jpg)\n\
  \n**图 11-8** 修改参数的当前值\n\n1.  在`Query Editor Home`功能区中，点击小三角以显示`Manage Parameters`按钮的菜单。\n\
  2.  选择`Edit Parameters`。此时会弹出`Enter Parameters`对话框。\n3.  从`CountriesParameter`的值弹出列表中，选择一个可用的值（而不是之前选中的那个）。对话框应如图\
  \ 11-8 所示。\n4.  点击`OK`。\n5.  在`Query Editor Home`功能区中，点击`Refresh Preview`。数据将被刷新，新的参数值将应用于使用这些参数的筛选器。\n\
  \n当你需要测试多种筛选值组合时，这种方法尤其有用。本质上，你可以使用多个参数对多个列应用一系列筛选（或创建复杂筛选），然后通过`Enter Parameters`对话框测试不同参数组合在数据集上的结果。这种技术避免了手动反复修改多个筛选器。额外的好处是，你可以通过定义可用的参数选项列表，来限制用户（或你自己）只能选择特定的参数选项。当你选择`CountriesParameter`弹出列表或`ModelsParameter`弹出列表时，就能看到这一点。\n\
  \n### 将参数应用于数据源\n\n在某些企业环境中，有许多可用的数据库服务器，甚至可能有更多的数据库。你可能会觉得记住所有这些信息很困难——你使用 Power\
  \ Query 在 Excel 中准备报告的用户可能也有同感。\n\n一种能让企业环境更易于导航的解决方案是准备包含可用服务器和数据库列表的参数。这些参数可以被使用和更新，以指导用户选择\
  \ SQL Server、Oracle 或其他数据库数据源。\n\n要查看实际操作，首先需要准备两个参数：\n\n-   服务器列表\n-   数据库列表\n\n\
  然后，你可以了解如何使用这些参数连接到数据源。当然，你需要将我在步骤 6 中使用的示例服务器和数据库名称替换为你自己环境中的名称。\n\n> **注意**  \n\
  > 只有在`Query Editor View`菜单中勾选了`Always allow`复选框时，才能应用参数。\n\n![../images/497001_1_En_11_Chapter/497001_1_En_11_Fig9_HTML.jpg](img/497001_1_En_11_Fig9_HTML.jpg)\n\
  \n**图 11-9** 使用参数选择服务器和数据库\n\n1.  打开一个新的 Excel 文件。\n2.  点击`Get Data` ➤ `From Database`\
  \ ➤ `From SQL Server Database`。\n3.  输入你的服务器和数据库，并连接到该数据库。\n4.  选择一个或多个数据表。\n5.\
  \  点击`Transform Data`打开`Query Editor`。\n6.  使用以下元素创建一个新参数：\n    -   *Name*：`Servers`\n\
  \    -   *Type*：`Text`\n    -   *Suggested Values*：`List of Values`\n    -   *Values\
  \ in the list*：`ADAM03` 和 `ADAM03\\SQL2017`（或你的数据库服务器）\n    -   *Default Value*：`ADAM03\\\
  SQL2017`（或你的数据库服务器）\n    -   *Current Value*：`ADAM03\\SQL2017`（或你的数据库服务器）\n7.  选择你创建用于连接源数据的查询。\n\
  8.  在`Applied Steps`列表中，点击名为`Source`的第一步右侧的齿轮图标。\n9.  在`Server`行上，点击服务器弹出菜单，选择`Parameter`。然后选择`Server`参数。SQL\
  \ Server 数据库对话框将如图 11-9 所示。\n10. 选择数据连接模式以及你想要设置的任何高级选项。\n11. 点击`OK`。服务器连接过程和对话框将出现，然后你会看到`Navigator`对话框显示当前两个参数中服务器和数据库值的表和视图。\n\
  \n你也可以定义并应用数据库参数。不过，由于方法几乎完全相同，我将让你自行尝试完成。\n\n### 参数的其他用途\n\n这些示例仅涵盖了在 Power Query\
  \ 中可以应用参数的部分情况。事实上，每次产品发布，可以应用参数的情况范围都在增加。因此，请留意所有提供使用参数选项的对话框。\n\n### 在数据源步骤中使用参数\n\
  \n参数的一个能迅速证明其实在节省时间的用法是在查询的`Source`步骤中使用参数。简而言之，你可以使用参数代替固定的元素名称，例如：\n\n-   Excel\
  \ 文件名\n-   文件路径\n-   数据库或数据仓库服务器\n-   数据库\n\n使用参数来定义连接（即服务器和数据库引用）尤其有用，因为这样做：\n\n\
  -   为连接信息提供了一个中央参考点\n-   避免你为来自同一服务器的类似查询反复输入连接详细信息——并将引入拼写错误的风险降至最低\n-   使在开发、测试和生产服务器之间切换更加容易\n\
  \n为了说明这一点，假设你已经按照上一节创建了参数`Servers`，请尝试以下操作：\n\n1.  创建一个到 SQL Server 数据库的连接（如第 3\
  \ 章所述）。\n2.  点击`Home`功能区中的`Transform Data`按钮。\n3.  在`Query Editor`中，选择通过数据库连接创建的查询。\n\
  4.  点击右侧的第一个`Applied Steps`。此步骤应命名为`Source`。\n5.  在公式栏中，将类似于以下的代码：\n\n```\n= Sql.Database(\"\
  ADAM03\\SQL2017\", \"PrestigeCars\")\n```\n\n1.  替换为：\n\n```\n= Sql.Database(Servers,\
  \ \"PrestigeCars\")\n```\n\n通过点击公式栏中的复选框或按`Enter`键确认你的修改。你几乎肯定需要确认你的数据库凭据。\n\n>\
  \ **注意**  \n> 你需要知道，硬编码的服务器和数据库名称必须用双引号括起来，而参数则*绝不能*用引号括起来。还要注意，公式栏中使用的 M 语言是区分大小写的。因此，你需要*完全按照*参数创建时的名称来输入。你将在第\
  \ 12 章中了解更多关于 M 语言的知识。\n\n\n\n### 将参数应用于 SQL 查询\n\n如果你正在使用关系型数据库（例如 Oracle 或 SQL\
  \ Server）作为数据源，并且对源数据库使用的 SQL 方言相当熟悉，那么你可以使用 SQL 查询数据库，然后将 Power Query 参数应用于该源查询。\n\
  \n让我们通过实际操作来了解这一过程：\n\n1.  打开一个新的 Excel 文件，打开查询编辑器，然后创建一个名为 `CountriesParameter`\
  \ 的参数（你已在前面几页中看到过）。\n2.  单击“关闭并加载”以关闭查询编辑器。\n3.  在 Excel 报表界面中，单击“SQL Server 数据库”。\n\
  4.  输入你正在使用的服务器和数据库。（如果你使用的是 Apress 网站上的示例，则应为你的服务器和数据库 `CarSalesData`。）\n5.  单击“高级选项”，然后输入以下\
  \ SQL 语句：\n\n    ```sql\n    SELECT  *\n    FROM    CarSalesData.Data.CarSalesData\n\
  \    WHERE   CountryName = 'Germany'\n    ```\n\n6.  单击“确定”，并确认所有关于数据访问和权限的对话框。\n\
  7.  单击“编辑”以连接到数据并打开查询编辑器。\n8.  数据连接应该只有一个应用步骤。展开编辑栏并调整公式，使其如下所示：\n\n    ```powerquery\n\
  \    = Sql.Database(\"ADAM03\\SQLSERVER2016\", \"CarSalesData\", [Query=\"SELECT\
  \  * FROM CarSalesData.Data.CarSalesData WHERE   CountryName = '\"& CountriesParameter\
  \ &\"'\"])\n    ```\n\n9.  单击编辑栏中的勾选图标以确认你的更改。数据将发生变化，显示法国（当前的参数值）的数据，而非德国（SQL 中的初始值）的数据。\n\
  \n现在你可以更改参数值并刷新数据。这将把当前参数值放入 SQL 的 `WHERE` 子句中，并仅获取该参数对应的数据。\n\n如果这看起来有些简略，让我们看看你在第\
  \ 8 步进行更改*前*，Power Query 所使用的代码。M 语言的代码如下：\n\n```powerquery\n= Sql.Database(\"ADAM03\\\
  SQLSERVER2016\", \"CarSAlesDAta\", [Query=\"SELECT  * FROM    CarSalesData.Data.CarSalesData\
  \ WHERE   CountryName = 'France'\"])\n```\n\n所做的更改，就是将 `France` 替换为了 `\"& CountriesParameter\
  \ &\"`。\n\n你所做的事情，就是用参数引用替换了硬编码的条件 `“France”`。实际上，就像在 Excel 中一样，你在公式中添加了双引号和“与”号（&），以便代码能够包含一个额外的文本元素。\n\
  \n这是一个极其简单的示例，但我希望它能为你打开一扇门，让你能够在数据库连接中对参数进行一些相当高级的应用。\n\n> **注意**：参数更改后更新数据，可能需要接受数据更改和新的权限。\n\
  \n### 查询图标\n\n正如你之前在图 11-9 中所见，有三种查询图标。表 11-1 对它们进行了解释。\n\n**表 11-1** 查询图标\n\n|\
