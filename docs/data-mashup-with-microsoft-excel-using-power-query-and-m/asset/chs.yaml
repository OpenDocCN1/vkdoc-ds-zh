  \ 文件出现在“导航器”对话框的左侧，并且其包含的任何工作表、命名区域或数据表也列在该文件下方。\n3.  单击左侧的 `BaseData` 工作表名称。此工作表的内容将显示在“导航器”对话框右侧的数据窗格中。“导航器”对话框应如图\
  \ 1-3 所示。\n4.  单击“加载”。数据将从外部 Excel 工作簿加载到当前工作簿中的一个新工作表中。\n\n你将看到类似图 1-4 所示的 Excel\
  \ 窗口。外部数据现在是一个 Excel 表格（命名为 `BaseData`，这是源数据表的名称）。你可以看到，与外部工作簿的连接现在出现在新的 `查询和连接`\
  \ 窗格中的 Excel 电子表格数据右侧。稍后，在我解释了 Power Query 为何是应对数据摄取挑战的绝佳解决方案后，我将用几页篇幅来解释这个新元素。\n\
  \n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig4_HTML.jpg](img/497001_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\nExcel 中可用的数据\n\n我想加载这些数据最多只花了几秒钟。然而，你现在在 Excel 中拥有了一套完整的外部数据，可以随时用于分析和报告。不过，我想先暂停一下，解释一下你目前所看到的内容。\n\
  \n## 为什么使用 Power Query？\n\n你刚才所做的是开启 Excel，使其在连接到数十个外部数据源中的信息时，成为首选的分析和 MI/BI（管理信息和商业智能）工具。你刚刚看到的是，Excel\
  \ 现在可以连接到多个数据源，并通过几次点击将它们导入电子表格以进行进一步分析。\n\n然而，至关重要的是要理解，到目前为止，你仅仅触及了 Power Query\
  \ 及其在促进数据摄取方面所能做的一切的皮毛。这是因为查看和加载数据只是开始。此外，你还可以使用它来：\n\n-   从多个不同的数据源导入数据\n-   同时从外部数据源导入多个数据集\n\
  -   连接来自多种不同类型源数据系统的数据集\n-   在加载前过滤数据，以确保只导入你确切需要的数据\n-   清理数据以去除异常或错误\n-   转换源数据使其更易于使用\n\
  \n不仅如此，你还可以随时刷新流程并重新加载源数据，只需点击一下，即可重新导入源数据，并重新应用你准备好的所有数据选择、清理和转换。换句话说，一旦你定义了一个数据摄取过程，就无需再次创建它，只需再次运行它，即可看到最新版本的源数据流入\
  \ Excel 电子表格。当然，你可以随时返回数据加载例程并对其进行调整，无论是纠正错误还是添加新的源或处理步骤。而这一切都可以在你已经熟悉的工具——Excel\
  \ 中完成，因为 Power Query 现在已紧密集成到 Excel 本身的结构中。\n\n## 查询和连接窗格\n\n在 Excel 中使用 Power Query\
  \ 的第一个真正的新方面是 `查询和连接` 窗格。简单来说，此窗口显示了你建立的所有与外部数据源的 Power Query 连接。它是你进入 Power Query\
  \ 数据摄取过程的入口点，并允许你：\n\n-   列出所有活动连接\n-   刷新由 Power Query 连接提供的数据\n-   显示源数据的样本\n\
  -   导航到数据导入的目标工作表\n-   删除连接\n-   修改连接以及数据转换过程的任何方面\n-   管理连接\n\n由于 `查询和连接` 窗格是你通往\
  \ Power Query 世界的大门，因此从一开始就熟悉它的几个关键方面是值得的。随着你阅读本书的深入，你将利用它的更多可能性来解锁 Power Query\
  \ 的巨大能力，所以我目前只会尝试揭开它神秘的面纱——细节将在后面呈现。\n\n### 显示查询和连接窗格\n\n要显示（或隐藏）`查询和连接` 窗格：\n\n\
  1.  单击菜单中的“数据”以切换到“数据”功能区。\n2.  在“数据”功能区中，单击“查询和连接”。将显示（如果已可见则隐藏）`查询和连接` 窗格。\n\n\
  `查询和连接` 窗格的主要元素在图 1-5 中进行了概述。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig5_HTML.jpg](img/497001_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n“查询和连接”窗格\n\n### 预览窗口\n\n`查询和连接` 窗格允许你查看查询返回的数据的预览。当你已向 Excel 文件添加了数十个连接，并且不记得哪个连接返回哪个数据集时，这非常有用。\n\
  \n要显示预览窗口：\n\n1.  将鼠标指针悬停在 `查询和连接` 窗格中你想要查看数据的查询上。如果你已按照本章前面的示例操作，它将是名为 `BaseData`\
  \ 的查询。\n\n预览窗口将出现，显示部分数据以及源数据连接的关键属性。你可以在图 1-6 中看到对预览窗口的说明。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig6_HTML.jpg](img/497001_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n预览窗口\n\n\n\n#### 预览窗口选项\n\n预览窗口提供的关键信息概览见表 1-1。\n\n**表 1-1** 预览窗口\n\n|\
  \ 元素 | 说明 |\n| --- | --- |\n| 查询或连接名称 | 每个查询或数据源连接的名称 |\n| 数据预览 | 数据示例的快速概览 |\n\
  | 列列表 | 查询输出的列 |\n| 刷新日期 | 数据上次刷新的日期 |\n| 在工作表中查看 | 激活包含查询输出数据的工作表（如果数据已以此方式输出）\
  \ |\n| 编辑 | 在 Power Query 中修改查询 |\n| 查询菜单 | 查询修改选项的子集 |\n| 删除 | 从工作簿文件中移除查询 |\n\n\
  #### 在工作表中查看\n\n预览窗口允许您直接跳转到目标工作表中已导入的数据（假设数据未填充到 Power Pivot 数据模型中）。\n\n要“跳转”到包含数据的工作表：\n\
  \n1.  在 `查询和连接` 窗格中，单击包含要查看数据的查询。包含已导入数据的工作表将被激活。  \n    反之，您可以单击包含查询数据输出的工作表内部，此时\
  \ `查询和连接` 窗格中的查询名称会高亮显示。\n\n**注意：** 另一种（但稍复杂些）激活包含从查询加载数据的工作表的方法是将鼠标悬停在 `查询和连接`\
  \ 窗格中的查询上，然后在预览窗口中单击 `在工作表中查看`。\n\n### 删除查询\n\n为了完成对使用 Power Query 进行查询和连接的初步高层面概览，让我们看看如何删除已创建的连接：\n\
  \n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig7_HTML.jpg](img/497001_1_En_1_Fig7_HTML.jpg)\
  \  \n**图 1-7** 预览窗口中的删除确认\n\n1.  将鼠标悬停在 `查询和连接` 窗格中要删除的查询上。预览窗口将出现。\n2.  在预览窗口中，单击\
  \ `删除`。预览窗口的状态栏将显示一条确认消息，如图 1-7 所示。\n3.  单击 `删除`。连接将被删除。\n\n**注意：** 此操作不会删除已导入到工作表中的数据，只会删除与源数据的连接以及您已应用的任何处理步骤。如果要移除数据，只需像平常一样删除工作表即可。然而，删除查询确实会阻止任何未来的数据刷新。\n\
  \n## 了解数据加载\n\n到目前为止，您所看到的是对 Power Query 数据加载场景的极速浏览。实际上，这个过程可能从极其简单（正如您刚刚所见）到更为复杂，例如连接、筛选和修改来自不同源的多个数据集（您将在第\
  \ 6 章至第 12 章中了解）。然而，当您使用 Power Query 将数据加载到 Excel 时，加载数据始终是任何数据分析场景中的第一步。\n\n不过，在这个简短的示例中，您仍然看到了数据加载过程的许多关键要素。这些要素包括：\n\
  \n*   访问 Power Query 可以读取的任何源格式中可用的数据\n*   在将数据加载到 Excel 之前先对其进行初步查看\n\n您在此处未看到的是\
  \ Power Query 如何能向数据加载过程添加中间步骤，并在 Power Query 编辑器中编辑源数据。数据处理的这一方面——数据混搭——将在后续章节中详述。\n\
  \n### 导航器对话框\n\n数据加载过程的一个关键方面是正确使用 `导航器` 对话框。您在图 1-3 中看到了此对话框。`导航器` 窗口在连接到几乎所有数据源时都会出现。它允许您：\n\
  \n*   快速查看源数据中的可用数据表\n*   筛选单个数据源中可用的多个数据元素\n*   查看源应用程序中各个表内保存的数据\n*   选择一个或多个数据表加载到\
  \ Excel\n\n**注意：** Power Query（以及 `导航器`）真正令人印象深刻的一个方面是，在大多数情况下，您无需在 PC 上安装客户端软件即可访问数据。这意味着您可以直接从\
  \ Excel 访问例如 SQL Server 或 Salesforce 中的数据。\n\n根据您连接到的数据源，您可能在 `导航器` 窗口中只看到几个数据表，或者成百上千个。无论如何，您看到的是\
  \ Power Query 能够识别并确信可以导入的结构化数据集。您在 `导航器` 窗口中看到的内容的复杂程度同样取决于数据源。例如，如果您查看的是数据库服务器，那么您可能首先看到一个数据库列表，并且可能需要通过展开数据库来更深入地挖掘数据的树状结构，以列出可用的数据表和视图。如果您连接到一个\
  \ Excel 文件，您可能只看到少数几个数据表。\n\n您使用 Power Query 的次数越多，就会越频繁地使用 `导航器` 对话框。因此，似乎应该在早期阶段就解释一些您可以应用的技巧和技术，以便在处理大量潜在数据源时更轻松。\n\
  \n让我们先仔细看看可用的选项。我将使用您首次在图 1-3 中从 Excel 文件 `BrilliantBritishCars.xlsx` 加载数据时看到的 `导航器`\
  \ 对话框。可用选项在图 1-8 中进行了说明。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig8_HTML.jpg](img/497001_1_En_1_Fig8_HTML.jpg)\
  \  \n**图 1-8** 导航器对话框\n\n`导航器` 对话框主要分为两部分：\n\n*   *左侧*：可用数据源的层次结构。这些可以由单个数据集或多个数据集组成，可能组织在一个或多个文件夹中。\n\
  *   *右侧*：选定元素中数据的预览。\n\n各种 `导航器` 对话框选项将在以下部分中说明。\n\n### 选择多个源表\n\nPower Query 允许您一次选择并加载来自同一连接的多个源数据表。让我们看一个示例。\n\
  \n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig9_HTML.jpg](img/497001_1_En_1_Fig9_HTML.jpg)\
  \  \n**图 1-9** 选择多个源项目\n\n1.  在 `数据` 功能区中，单击 `获取数据` ➤ `来自文件` ➤ `从工作簿`。\n2.  导航到\
  \ Excel 文件 `C:\\DataMashupWithExcelSamples\\CarSales.xlsx` 并单击 `导入`。\n3.  在 `导航器`\
  \ 对话框中，勾选 `选择多项` 复选框。如图 1-9 所示。\n\n这将在每个源数据项（或者如果您愿意，可以说表或数据集）的左侧显示一个复选框。然后，您可以勾选每个要作为此查询一部分加载的源元素对应的复选框。\n\
  \n\n\n### 搜索数据集\n\n你难免会遇到这样的情况：所连接的数据源包含数百个数据集，尤其是在数据库中。幸运的是，`Power Query` 让你可以极其轻松地筛选显示的数据集。\n\
  \n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig10_HTML.jpg](img/497001_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10：在导航器对话框中搜索数据集\n\n1.  在 `导航器` 对话框中，点击 `搜索` 框内部。\n2.  输入你想要隔离的数据集名称的一部分。在此示例中，我输入了“li”。\n\
  3.  可用数据集列表将进行筛选，仅显示包含你所输入文本的数据集。你可以在图 1-10 中看到 Excel 源文件 `CarSalesDataForQueries.xlsx`（也位于目录\
  \ `C:\\DataMashupWithExcelSamples` 中）的这种情况。\n\n要移除筛选，只需点击 `搜索` 框右侧的叉号即可。`导航器` 将清除筛选，并显示数据源中的所有数据集。\n\
  \n**注意：** 你必须在*使用* `导航器搜索` 功能*之前*，展开包含你要筛选数据集的项所在的层级结构。\n\n### 导航器显示选项\n\n点击 `导航器`\
  \ 对话框中的 `显示选项` 将弹出一个包含两个选项的菜单：\n\n-   `仅显示选定项`\n-   `启用数据预览`\n\n你可以在图 1-11 中看到这一点。\n\
  \n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig11_HTML.jpg](img/497001_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11：导航器显示选项\n\n#### 仅显示选定项\n\n选择此选项将阻止任何你未选定的数据集出现在数据源窗格中。\n\n#### 启用数据预览\n\
  \n选择此选项将显示所选数据集中可用数据的一小部分。如果与源数据的连接速度较慢，你可以选择禁用数据预览。\n\n### 刷新\n\n如果需要，你可以刷新以下一项或两项：\n\
  \n-   源数据\n-   数据预览\n\n#### 源数据刷新\n\n点击搜索栏下的预览按钮将刷新源数据窗格中显示的源数据表列表。\n\n#### 数据预览刷新\n\
  \n点击 `导航器` 对话框右上角的预览按钮将刷新右侧可见的选定表的预览数据。\n\n#### 选择相关表\n\n点击 `选择相关表` 按钮仅对数据库源有效，例如\
  \ Microsoft `SQL Server` 或 `Oracle`。如果源数据库设计正确，包含了表之间的联接，那么此选项将自动选中所有与你已选定的表相关联的表。\n\
  \n**注意：** 在数据库源中，某些表可能与其他表相关联，而这些表本身又与其他表相关联。当你点击 `选择相关表` 时，这种连接层级结构并不会被完全发现。换句话说，你可能需要选择多个表并重复点击此按钮，以选中你需要的所有表。\n\
  \n至此，我们对 `导航器` 的快速浏览就结束了。然而，在接下来的四章中，当你学习如何连接到各种数据源时，你将更多地了解 `导航器` 窗口。\n\n### 导航器数据预览\n\
  \n`导航器数据预览` 窗格（右侧），顾名思义，是数据源中数据的预览。它提供：\n\n-   你想要查看的任何数据集中*前几条记录*的简要概览。鉴于你正在预览的数据可能有数百列宽、数百行深，`导航器数据预览`\
  \ 内部可能会出现数据表的滚动条。但请记住，你并非在检查*所有*可用数据，而只是看到*可用记录的一个小样本*。\n-   数据表中可用列的列表。这些列显示在 `导航器数据预览`\
  \ 的底部。\n\n`Power Query` 可以预览和加载来自多个不同数据源的数据。实际上（正如你从 `获取数据` 弹出菜单中的可能数据源列表所看到的），它可以读取大多数常见的企事业数据源以及许多其他数据源。重要的是要理解，`Power\
  \ Query` 为加载数据的艺术和科学提供了一个通用接口，无论数据源是什么。因此，无论你是在检查 `SQL Server` 还是 `Oracle` 数据库、一个\
  \ `XML` 文件或文本文件、一个网页还是大数据源，你都将始终使用标准化的方法来检查和加载数据。这使得 `Power Query` 的数据体验变得无比简单且极其可靠。这意味着你可以减少担心连接到数据源的技术方面问题的时间，从而可以自由地专注于数据本身。\n\
  \n**注意：** `导航器数据预览` 是一个出色的数据发现工具。无需加载任何数据，你就可以快速查看数据源以及其中可能被 `Power Query` 加载的任何数据。然后你可以决定是否值得加载。这样你就不会在可能对你的需求无关紧要的数据加载上浪费时间。\n\
  \n### 修改数据\n\n一旦你在 `Power Query` 中拥有一个或多个可以连接到数据源并将数据带入该环境的查询，你就可以开始考虑下一步——转换数据，使其可供使用。根据你处理的数据源数量以及所需修改的程度，这可能会从简单到复杂。为了使过程有条理，我建议你尝试将任何步骤分解为以下主要线索：\n\
  \n-   *塑造数据集*：这包括筛选记录以减小数据集大小，以及移除任何无关的列。它还可能涉及通过拆分现有列、创建计算列甚至联接查询来添加你创建的列。\n- \
  \  *清理和修改数据*：这也称为*数据转换*（ETL 中的 *T*）。它涵盖了将文本数据转换为大写和小写，以及（例如）删除非打印字符的过程。舍入数字和从日期数据中提取日期部分也是可能的（在众多其他可用的转换中）。\n\
  \n然而，就目前而言，只需理解 `Power Query` 在需要时能够完成所有这些工作就很重要。数据转换将在第 6 章到第 12 章中详细解释。\n\n##\
  \ Power Query 编辑器\n\n在前面的示例中，你直接将数据加载到了 `Excel` 中。在本书的后续内容中，你还将学习如何通过一个额外的步骤来扩展这种方法——因为你也可以选择在将数据添加到数据模型*之前*将其加载到\
  \ `Power Query 编辑器` 中。这个“绕行”是流程的一部分，允许你在数据*被添加*到数据模型*之前*对其进行清理和转换。当然，如果你的数据是完美的，那么你可以直接将其添加到数据模型并开始像之前那样进行分析。然而，如果你的数据需要任何调整，那么\
  \ `Power Query 编辑器` 很可能很快就会成为一个值得信赖的工具。因此，可能值得阅读第 1 章到第 5 章，这些章节描述了如何从各种可能的数据源加载数据，然后阅读第\
  \ 6 章到第 12 章，以塑造、修改和结构化你的数据，使其成为新的有价值的见解的清晰来源。\n\n\n\n## 数据源\n\n现在你已经见识到将数据加载到 Excel\
  \ 中是多么快速便捷，是时候更广泛地了解 Power Query 可以摄取和处理的*数据类型*了。\n\n由于潜在的数据源种类繁多，起初可能会让人感到不知所措，因此\
  \ Power Query 将潜在的数据源归为以下几类：\n\n- **文件**：包括 Excel 文件、CSV（逗号分隔值）文件、文本文件、JSON 文件和\
  \ XML 文件。Power Query 甚至可以加载包含众多文件的整个文件夹。\n- **数据库**：当前工作场所和云中使用的各种关系型数据库的全面集合，包括（但不限于）MS\
  \ Access、SQL Server 和 Oracle。本书付印时可用的完整列表见第 3 章。\n- **Azure**：此选项可让你查看托管在 Microsoft\
  \ 云中的各种数据类型。这涵盖了从 SQL Server 到大数据源的数据格式。你可以在第 4 章中了解其中一些类型如何与 Power Query 配合使用。\n\
  - **在线服务**：这些数据源范围广泛，从 SharePoint 列表到 Salesforce，从 Dynamics 365 到 Facebook——以及许多其他来源。第\
  \ 4 章将探讨其中部分来源。\n- **其他**：范围庞大且不断增长的数据源，从 Hadoop 到 Microsoft Exchange。其中部分内容将在第\
  \ 2 章至第 5 章的章节中提及。\n\n可能的数据源列表一直在变化，你需要知道，如果你想要获得所有可用数据源的详尽列表，必须查看你正在使用的 Excel 的版本。事实上，我预计当你阅读本书时，可能已经增加了更多数据源。\n\
  \n你还可以列出任何可用本地磁盘、网络共享甚至云中文件夹的内容，然后利用此功能一次性导入多个文件。同样地（如果你拥有必要的权限），你可以列出你所连接的数据库服务器上可用的数据库和数据。这样，Power\
  \ Query 不仅可以提供数据，还可以提供*元数据*——即关于数据的数据——这有助于你快速浏览潜在的数据源，并只选择你真正需要的数据。\n\n不幸的是，Power\
  \ Query 能够读取的数据源范围极其广泛，以至于我们无法在短短几章中逐一详细探讨每个数据源的细微之处。因此，我们将在本章及接下来的几章中，快速浏览*一些*最常用的数据源。幸运的是，Power\
  \ Query 能够读取的大多数数据源都以类似的方式使用。这是因为 Power Query 界面出色地完成了将晦涩的连接细节尽量简化的任务。因此，即使你遇到了本书中未描述的数据源，你仍然可以应用各种技术，这些技术几乎适用于\
  \ Power Query 能够连接的任何数据源。\n\n> **注意**  \nPower Query 可访问的数据源列表一直在增长。因此，当你阅读本书时，你很可能会发现比本章及接下来四章所描述的更多的数据源。\n\
  \n## 源数据属性\n\nExcel 允许你调整与 Power Query 连接到外部数据源相关的少量选项。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig12_HTML.jpg](img/497001_1_En_1_Fig12_HTML.jpg)\n\
  \n*图 1-12 — 外部数据属性对话框*\n\n1.  单击包含 Power Query 插入到工作表中的数据的表格内部。\n2.  在“数据”功能区中单击`属性`。将出现“外部数据属性”对话框。你可以在图\
  \ 1-12 中看到它。\n\n表 1-2 对这些选项进行了说明。\n\n**表 1-2 — 外部数据属性选项**\n\n| 元素 | 说明 |\n| ---\
  \ | --- |\n| `查询名称` | 查询或连接的名称 |\n| `包含行号` | 在数据左侧添加自动递增的行号 |\n| `调整列宽` | 调整每列的宽度以完全显示数据\
  \ |\n| `保留列排序/筛选/布局` | 保留源查询中的筛选和排序，而非 Excel 中的输出结果 |\n| `保留单元格格式` | 保留源查询中的格式（如有），而非\
  \ Excel 中的输出结果 |\n\n> **注意**  \n只有在刷新查询时，你才会看到对这些选项所做的任何更改的结果。\n\n## 查询属性\n\nExcel\
  \ 在连接到外部数据源时，一直提供一系列查询选项——即使在使用旧式连接技术时也是如此。幸运的是，这些选项在使用 Power Query 时也同样可用。\n\n\
  ![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig13_HTML.jpg](img/497001_1_En_1_Fig13_HTML.jpg)\n\
  \n*图 1-13 — 刷新弹出菜单*\n\n1.  单击包含 Power Query 插入到工作表中的数据的表格内部。我将使用你之前在本章中使用 `BrilliantBritishCars.xlsx`\
  \ 文件创建的初始查询 `BaseData`。\n2.  单击 `全部刷新` 按钮右下角的小三角形。将出现“刷新”弹出菜单，如图 1-13 所示。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig14_HTML.jpg](img/497001_1_En_1_Fig14_HTML.jpg)\n\
  \n*图 1-14 — 查询属性对话框*\n\n1.  在弹出菜单中单击 `连接属性`。你将看到如图 1-14 所示的“查询属性”对话框。\n\n表 1-3 对这些选项进行了说明。\n\
  \n**表 1-3 — 查询属性选项**\n\n| 元素 | 说明 |\n| --- | --- |\n| `查询名称` | 查询或连接的名称 |\n| `说明`\
  \ | 你希望添加的任何注释 |\n| `启用后台刷新` | 允许在 Excel 中工作的同时进行刷新 |\n| `每 “N” 分钟刷新一次` | 安排自动刷新\
  \ |\n| `打开文件时刷新数据` | 每次打开 Excel 文件时运行查询以刷新数据 |\n| `在全部刷新时刷新此连接` | 允许你将某个查询排除在全局刷新之外\
  \ |\n| `启用快速数据加载` | 尽可能快地加载数据——即使这会导致 Excel 看起来“卡住” |\n\n\n\n## 加载目标\n\n我在本章开头提到，一旦你完成源数据的准备工作，Power\
  \ Query 允许你选择加载目标。默认的加载选项是将输出数据直接放入当前 Excel 文件中的新工作表。然而，该主题下还有几种可用的变体。它们是：\n\n-\
  \   加载到 Excel 命名表（默认）\n-   基于源数据加载到数据透视表\n-   基于源数据加载到数据透视图\n-   仅创建数据连接，但暂不加载\n\
  \n除此之外，你还可以选择是否：\n\n-   在当前工作表中创建数据表、数据透视表或数据透视图。\n-   在新工作表中创建数据表、数据透视表或数据透视图。\n\
  -   可选，将数据添加到 Power Pivot 数据模型。添加到数据模型的查询可以分别联接和扩展，以提供一个完整且强大的分析数据源。\n\n> **注意：**\
  \ 完全可以同时将数据加载到数据模型*和*工作表表格中。\n\n假设您已连接到数据源并可以在导航器中查看所需的源数据（如图 1-3 所示）：\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig15_HTML.jpg](img/497001_1_En_1_Fig15_HTML.jpg)\n\
  \n**图 1-15** 加载选项\n\n1.  单击“主页”菜单中“加载”按钮右侧的小三角形。将出现弹出菜单。您可以在图 1-15 中看到它。\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig16_HTML.jpg](img/497001_1_En_1_Fig16_HTML.jpg)\n\
  \n**图 1-16** 加载目标选项\n\n2.  选择 **加载到…**。将出现“导入数据”对话框，如图 1-16 所示。\n3.  选择 **表** 单选按钮。\n\
  4.  选择 **新工作表** 作为数据目标。\n5.  保持 **将此数据添加到数据模型** 复选框未选中。\n6.  单击 **确定**。\n\n连接——以及数据加载（如果您选择了此结果）——将根据您指定的选项创建。如果您严格按照上述步骤操作，那么您应该会获得一个包含来自数据源的数据的新工作表。\n\
  \n> **注意：** 选择 **仅创建连接** 单选按钮会阻止您选择输出目标。当您想要准备数据加载过程，但可能还不确定如何以及在何处输出最终数据时，这非常有用。\n\
  \n### 重新利用现有连接\n\n在某些情况下，您可能只想建立到源数据的连接，但实际上并不导入数据。正如您在上一节中看到的，在“导入数据”对话框中选择 **仅创建连接**\
  \ 选项即可实现此目的。\n\n选择此解决方案可能有多种原因：\n\n-   您想“暂停”数据转换和加载过程的工作，稍后再回来处理——而不会丢失您已经完成的工作，也不会加载数据（数据可能体积庞大且耗时）。\n\
  -   此查询不会直接用于访问数据，而是用作更复杂过程中的中间步骤。您将在第 9 章中进一步了解此方法。\n-   数据将被加载到 Power Pivot 数据模型中，不直接用于表、Power\
  \ Pivot 表或图表中。\n\n同样，值得了解的是，如果您删除了包含查询数据输出的工作表，那么源查询将仅成为连接，并且不会加载数据，直到您重新定义输出目标。\n\
  \n由此可知，您还需要了解如何获取一个连接并应用数据目标。操作方法如下：\n\n![../images/497001_1_En_1_Chapter/497001_1_En_1_Fig17_HTML.jpg](img/497001_1_En_1_Fig17_HTML.jpg)\n\
  \n**图 1-17** 预览窗口选项\n\n1.  在 **查询和连接** 窗格中，将鼠标悬停在您要重新利用的连接上。将出现预览窗口。\n2.  单击预览窗口底部菜单栏中的省略号。将出现图\
  \ 1-17 所示的菜单。\n3.  选择 **加载到…**，然后从您在图 1-16 中看到的“导入数据”对话框中选择所需的选项。\n\n> **注意：** 您不能简单地重新定义现有数据加载的新目标。您必须首先移除当前的加载目标（例如，通过删除\
  \ Excel 表格或目标工作表，或者从 Power Pivot 数据模型中移除数据表），然后重新应用新目标。\n\n### 加载到 Excel\n\n将数据加载到\
  \ Excel 不仅是默认选项，而且可能是许多用户的首选。选择此数据目标有众多合理的理由：\n\n-   它是最简单的选项。\n-   数据立即可用并可供使用。\n\
  -   您可以直接在 Excel 中应用您惯用的技术和函数来分析数据。\n\n但是，您需要意识到这种方法确实有一些局限性：\n\n-   大数据加载会触及 Excel\
  \ 中的 1,000,000 行限制。\n-   大数据加载可能导致巨大的 Excel 文件体积。\n\n在后一种情况下，将数据加载到 Power Pivot\
  \ 数据模型中可能是更明智的选择，因为数据将被压缩，并且可能包含数百万行数据。\n\n\n\n### 加载到数据模型\n\n由于这是使用 Excel 和 Power\
  \ Query 进行自助式 BI 实践的基础，你确实需要了解什么是数据模型，以及它如何帮助你创建有效的分析。\n\n数据模型是加载到 Power Pivot 中并以连贯方式联接在一起的一个或多个数据表的集合。数据可以来自\
  \ Power Query，从现有的 Excel 表格或工作表中获取，或从各种源中导入。每个 Excel 文件只能有一个数据模型。\n\n诚然，你可以将所有数据放在\
  \ Excel 中的单个\"平面\"表中，并将其作为分析输出的基础。然而，如果你打算使用任何复杂程度的数据集，你很可能希望使用 Power Pivot 来开发数据模型。有时，构建一个良好的数据模型可能需要一段时间才能完善，但有许多充分的理由可以证明花时间使用\
  \ Power Pivot 构建一个连贯的数据模型是值得的。投入时间的原因包括：\n\n-   如果你在 Power Pivot 中使用 Excel 数据模型，则可以远远超出\
  \ Excel 工作表一百万行的限制。事实上，在 Power Pivot 中，数千万行的表格也并非罕见。\n-   连贯的数据模型使理解和可视化数据变得更加容易。\n\
  -   一个精心设计的数据模型意味着，当数据可以从另一个表引用而不是无休止地重复时，单个表中存储的冗余信息会更少。\n-   Power Pivot 可节省磁盘和内存空间，因为它使用高效的*数据压缩算法*来存储数据模型中的数据。这意味着，使用数据集的工作簿所占用的空间远小于将数据存储在\
  \ Excel 工作表中。\n-   由于数据集完全加载到 PC 的内存中，因此计算速度更快。\n-   数据模型可以准备用于数据输出。\n-   数据模型可以包含特定的计算（其中一些可能相当复杂），旨在确保在\
  \ Excel 中对数据进行切片和筛选时返回正确的结果。\n-   数据模型可以包含层次结构和 KPI。\n-   数据模型可用于在 Excel 中创建复杂的数据透视表。\n\
  -   数据模型可以是成熟的 SSAS（SQL Server Analysis Services）表格数据仓库的基础或概念验证。\n-   数据模型可以让你避免在\
  \ Excel 中实现复杂的 `VLOOKUP()` 函数。\n\n由于这不是一本关于 Power Pivot 的书，我不会描述如何创建和使用 Power Pivot\
  \ 数据模型来执行数据分析。我只想指出，你可以指定 Power Pivot 数据模型作为使用 Power Query 导入的数据的目标位置。\n\n有许多关于\
  \ Power Pivot 和 Power Pivot 数据模型的优秀书籍和网络资源，我鼓励你查看这些资源，以获取有关使用这一出色工具的详细说明。如果你想要一个简短的介绍，可以在我的书\
  \ *High Impact Data Visualization with Power View, Power Map, and Power BI*（第 2\
  \ 版，Apress，2016 年）中找到。\n\n## 结论\n\n在本章中，你已经了解了如何使用 Power Query 连接到各种数据源。你已经看到，只要你知道要加载哪种数据类型——并且\
  \ Power Query 有可用的连接器连接到这些数据——你就可以预览数据并将其加载到 Excel 工作表或内置的 Power Pivot 数据模型中。\n\n\
  现在是时候深入探讨一些你可以与 Power Query 一起使用的各种数据源的细节了。下一章将通过介绍许多可以作为数据源使用的基于文件的数据类型来开启你的旅程。\n\
  \n"
- "# 2. 使用 Power Query 发现和加载基于文件的数据\n\n通过网络、互联网或电子邮件发送文件已成为我们大多数人的第二天性。只要你获得的文件符合当前使用的一些广泛认可的标准（你将在稍后了解这些标准），将它们加载到\
  \ Power Query 中就不会有太大困难。\n\n作为数据混搭过程的第一部分，本章将向你展示如何从各种基于文件的源中查找和加载数据。这些数据类型通常是那些你可以位于共享网络驱动器上、从互联网下载、作为电子邮件附件接收或复制到计算机本地驱动器上的文件。本章示例中使用的文件可在\
  \ Apress 网站上找到。如果你已经按照附录 A 中的下载说明进行操作，那么这些文件将位于 `C:\\DataMashupWithExcelSamples`\
  \ 文件夹中。\n\n## 文件源\n\n在本章中，我们将介绍如何从以下源导入基于文件的数据：\n\n-   CSV 文件\n-   文本文件\n-   XML\
  \ 文件\n-   Excel 文件\n-   Access 数据库\n\nPower Query 当前可以读取并从中加载数据的文件源见表 2-1。\n\n**表\
  \ 2-1**: 文件源\n\n| 文件源 | 说明 |\n| --- | --- |\n| Excel | 允许您读取 Microsoft Excel 文件（版本\
  \ 97 至 2019）并加载工作表、命名区域和表格 |\n| CSV | 允许您加载符合 CSV（逗号分隔值）格式的文本文件 |\n| XML | 允许您从\
  \ XML 文件加载数据 |\n| 文本 | 允许您使用各种列分隔符加载文本文件 |\n| 文件夹 | 允许您加载有关文件夹中所有文件的信息 |\n| SharePoint\
  \ 文件夹 | 允许您列出 SharePoint 文件夹中的文件 |\n| Access 数据库 | 允许您连接到网络上的 Microsoft Access 文件并加载查询和表格\
  \ |\n| JSON | 帮助您从 JSON 文件加载数据 |\n\n更高级的技术（例如导入整个文件夹的文本或 Excel 文件的内容，或导入*复杂*的 XML\
  \ 文件和 JSON 文件）将在第 10 章中描述。我更喜欢单独处理这些内容，因为它们需要更高级的数据转换技术知识——而你需要首先学习这些知识。\n\n**注意**：我意识到\
  \ Power Query 将 MS Access 视为数据库，而不是\"文件\"数据类型。虽然我完全同意这种分类，但我还是倾向于将 Access 视为基于文件的数据源，因为所有数据都驻留在单个文件中，该文件可以复制和通过电子邮件发送，而不是位于远程服务器上的数据库中。因此，我们将在本章中介绍\
  \ MS Access，而不是在讨论企业数据源的下一章中介绍。\n\n## 从文件加载数据\n\n是时候开始了解 Power Query 的\"繁重工作\"方面以及如何使用它从各种不同源加载数据了。我将从简单的小坡（或者用我们英国人的说法叫\"\
  初学者\"坡道）开始，以一个从文本文件加载数据的简单示例为例。然后，鉴于可用的数据源种类繁多，并且为了给这个过程提供更清晰的结构，我们将从多个在工作场所中普遍存在的基于文件的数据源中加载数据。这些数据源是你在第\
  \ 6 章到第 12 章中将学习调整和\"混搭\"的数据的基础。\n\n\n\n### CSV 文件\n\n场景如下：你收到了一个包含一些有用信息的 CSV 文件，需要将其加载到\
  \ Excel 中进行进一步分析。现在，你希望使用 Power Query 查看数据，并考虑需要采取哪些操作（如果有的话）来使其可用。这次，你决定先将数据加载到\
  \ Power Query 中，并在对源数据结构进行必要的修改后再将数据加载到 Excel 中。\n\n首先，你需要了解要加载的数据。如果用文本编辑器（例如记事本）打开源文件\
  \ `C:\\DataMashupWithExcelSamples\\Countries.csv`（在 Windows 资源管理器中右键单击该文件，然后选择“打开方式”\
  \ ➤ “记事本”），就可以查看其内容。你可以在图 2-1 中看到这些内容。\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig1_HTML.jpg](img/497001_1_En_2_Fig1_HTML.jpg)\n\
  \n**图 2-1** `Countries.csv` 文件的内容\n\n以下步骤说明了将文件内容加载到 Power Query 中所需执行的操作：\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig2_HTML.jpg](img/497001_1_En_2_Fig2_HTML.jpg)\n\
  \n**图 2-2** Power Query 文件对话框\n\n1. 在 Excel 中，单击 **数据**。\n2. 单击 **获取数据** 按钮。\n3.\
  \ 单击 **来自文本/CSV**。将出现“导入数据”对话框。\n4. 导航到包含要加载的文件的文件夹，然后选择该文件（在本示例中为 `C:\\DataMashupWithExcelSamples\\\
  Countries.csv`）。\n5. 单击 **导入**。将出现一个对话框，显示文件的初始内容，如图 2-2 所示。\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig3_HTML.jpg](img/497001_1_En_2_Fig3_HTML.jpg)\n\
  \n**图 2-3** 加载了 CSV 文件内容的 Power Query 窗口\n\n6. 单击 **转换数据** 按钮。Power Query 窗口出现，其中包含\
  \ CSV 文件内容的样本——如果文件不大，也可能包含整个文件。你可以在图 2-3 中看到这一点。\n7. 单击 Power Query 窗口中的 **关闭并加载**\
  \ 按钮（你可以在图 2-3 的左上角看到它）。Power Query 编辑器将关闭并返回到 Excel。源数据将被加载到新工作表中。\n\n> **提示**\
  \  \n> 在第 7 步中，请确保单击 **关闭并加载** 按钮的上半部分。否则，你将看到一个包含若干选项的弹出菜单。如果看到弹出菜单，只需单击 **关闭并加载**。\n\
  \n到此为止，操作就完成了。你只需点击几次鼠标，就将源文件中的数据加载到了 Excel 中，数据已经准备好进行进一步分析。在后续章节中，你将学习如何对数据进行塑形。不过现在，让我们继续看看其他基于文件的数据源。\n\
  \n> **注意**  \n> 如果第 7 步之后数据没有出现在新工作表中，请重新执行该过程，但这次请单击 **关闭并加载** 按钮上的弹出菜单，然后选择 **加载到**——并在对话框（如图\
  \ 1-16 所示）中选择 **新工作表** 单选按钮。\n\n#### 什么是 CSV 文件？\n\n在我们继续讨论其他文件类型之前，我需要就 CSV 文件做一些说明。关于“真正的”CSV\
  \ 文件，是有技术规范的，但我不会拿这个烦你。更重要的是，许多生成 CSV 文件的程序并不总是严格遵循该定义。关键在于，Power Query 可以处理满足以下条件的文本文件：\n\
  \n- 通常具有 `.csv` 扩展名（默认情况下，它以此应用正确的处理方式）。当然，它也可以接受你指定的任何扩展名。\n- 使用逗号分隔行中的元素。这也是一个默认设置，可以通过从图\
  \ 2-2 所示的对话框中选择分隔符来覆盖。\n- 以换行符、回车符或换行符/回车符结尾。\n- 可以（可选地）包含用于封装字段的双引号。这些双引号将在数据加载过程中被去除。如果存在双引号，它们不必出现在每个字段中，甚至不必出现在每个记录中，字段中偶尔可能出现不一致的双引号。\n\
  - 可以包含“不规则”记录，即那些并非包含标准记录中每个元素的行。但是，第一行（无论是否包含标题）必须涵盖列表中所有剩余记录中的每个元素。简而言之，任何其他记录可以比第一行短，但不能比它长。\n\
  - 不包含数据本身之外的任何内容。如果文件包含不属于数据一部分的标题行或页脚行，那么 Power Query 在没有进一步处理的情况下无法加载数据集。针对这个非常常见的问题，有一些变通方法；第\
  \ 8 章给出了一个方法。\n\n### 文本文件\n\n如果你按照上一节中加载 CSV 文件的过程操作，你会发现加载文本文件几乎完全相同。这并不奇怪。两者都是基于文本的文件，并且都应包含一个单一的数据列表。以下是核心区别：\n\
  \n- 文本文件可以使用逗号*以外*的符号来分隔列表中的元素。你可以在定义加载步骤时指定分隔符。\n- 文本文件的扩展名通常应为 `.txt`（尽管这也可以被覆盖）。\n\
  - 文本文件*必须*格式完美；也就是说，每个记录（行）必须与其他每个记录具有相同数量的元素。\n- 如果你希望首次加载数据毫无问题，那么文本文件也*不能*包含数据集之外的任何内容。\n\
  - 如果文本文件遇到问题，它应将数据作为单个列导入，然后你可以尝试将其拆分为多个列，如第 8 章所述。\n\n那么，以下是将文本文件加载到 Power Query\
  \ 中的方法：\n\n1. 打开一个新的空白 Excel 文件。\n2. 在 **数据** 功能区中，单击 **来自文本/CSV**。将显示“导入”对话框。\n\
  3. 导航到包含该文件的文件夹并选择该文件（在本示例中为 `C:\\DataMashupWithExcelSamples\\CountryList.txt`）。\n\
  4. 单击 **导入**。将出现一个对话框，显示文件的初始内容（此对话框与你在图 2-2 中看到的 CSV 文件的对话框基本相同）。当然，你也可以双击文件名，而无需单击\
  \ **打开**。\n5. 单击 **取消** 按钮（因为快速查看文件内容后，你决定并不真正需要它）。\n\nPower Query 真正聪明的地方在于，它可以对文本文件的结构做出非常准确的推断；也就是说，它几乎总能猜出字段分隔符（将列表中的每个元素与其他元素隔开的字符）。因此，它不仅会将列表分解为列，还会避免导入列分隔符。如果它猜得不正确，也不要灰心。你将学习如何在第\
  \ 8 章中修正这个问题。\n\n查看文件内容然后决定不使用它，是*数据探索*过程的一部分，当你在使用 Power Query 时，会发现自己经常这样做。这个练习的目的是向你展示，快速浏览潜在数据源，然后决定是否将其导入数据模型，是多么容易。此外，直接在\
  \ Power Query 的加载对话框中查看大型文本或 CSV 文件的前几行，可能比在文本编辑器中打开整个文件更容易。\n\n> **提示**  \n> 尽管可能显而易见，但还是要提一下：你可以按\
  \ Enter 键接受对话框中的默认选项，按 Esc 键取消对话框。\n\n\n\n### 文本与 CSV 选项\n\n从图 2-3 可以看出，加载文本或 CSV\
  \ 文件时可供调整的选项并不多。大多数情况下，`Power Query` 会自动为您猜测出正确的设置。不过，偶尔您也需要对这些参数进行微调。您可以修改的潜在选项包括：\n\
  \n- `文件来源`\n- `分隔符`\n- `数据类型检测`\n\n#### 文件来源\n\n此选项定义文件存储时使用的字符编码。不同的字符集可以处理不同范围的字符，例如重音符号和其他变音符号。通常\
  \ `Power Query` 会正确解释此信息，您只需在极少数情况下才需要选择其他字符集（文件来源）。\n\n#### 分隔符\n\n`Power Query`\
  \ 会尝试猜测文本或 CSV 文件中用于分隔数据“列”的特殊字符。如果您希望覆盖所选的分隔符，可以选择以下选项：\n\n- `冒号`\n- `逗号`\n- `等号`\n\
  - `分号`\n- `空格`\n- `制表符`\n\n您还可以决定输入自定义分隔符，例如管道符（`|`），甚至指定每个字段具有固定宽度。选择这两个选项中的任意一个，将显示另一个输入字段，您可以在其中输入所需的分隔符。\n\
  \n#### 数据类型检测\n\n`Power Query` 会对文本或 CSV 文件中的数据编码和数据类型进行合理猜测。默认情况下，为节省时间，它仅读取前 200\
  \ 条记录。但是，您可以从以下三个选项中进行选择：\n\n- 读取前 200 行\n- 读取整个文件\n- 不进行数据类型检测\n\n**注意**：请注意，完整读取一个大型文件可能会耗费相当长的时间。然而，没有准确的数据类型检测，您可能会在输出数据中遇到格式错误的列。\n\
  \n### 固定宽度文本文件\n\n您偶尔可能会遇到的另一种文本文件形式是固定宽度文件。这种源数据确保每列包含完全相同的字符数。图 2-4 展示了其可能的样貌。\n\
  \n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig4_HTML.jpg](img/497001_1_En_2_Fig4_HTML.jpg)\n\
  \n*图 2-4* – 固定宽度文本源数据\n\n要加载此类数据：\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig5_HTML.jpg](img/497001_1_En_2_Fig5_HTML.jpg)\n\
  \n*图 2-5* – Power Query 中的文件数据连接器\n\n1.  在 `数据` 菜单中，依次点击 `获取数据` ➤ `来自文件` ➤ `来自文本/CSV`。您将看到如图\
  \ 2-5 所示界面。\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig6_HTML.jpg](img/497001_1_En_2_Fig6_HTML.jpg)\n\
  \n*图 2-6* – 固定宽度文本文件导入对话框\n\n2.  从文件夹 `C:\\DataMashupWithExcelSamples` 中选择文件 `Countries.prn`。\n\
  3.  点击 `打开`。将出现图 2-6 中显示的对话框。\n4.  点击 `加载`。源数据将被加载到一个新的工作表中。\n\n从图 2-6 可以看出，`Power\
  \ Query` 为您提供了关于固定宽度文件的若干信息。具体来说，它计算了每列的长度，并在分隔符弹出菜单下提供了所需的列长度。您可以更改此设置，但希望您永远不需要这么做。\n\
  \n与文本和 CSV 文件的情况一样，如果您认为有必要，可以通过从 `数据类型检测` 弹出菜单中选择 `基于整个数据集` 来强制 `Power Query` 对整个源文件进行采样。\n\
  \n### 简单的 XML 文件\n\n`XML`，即 `可扩展标记语言`，是 IT 系统之间传输数据的标准方式。因此，您很可能有一天需要加载一个 XML 文件。尽管\
  \ XML 文件只是文本，但它是以一种非常特定的方式格式化的文本，如果您在文本编辑器（如 `记事本`）中打开 XML 文件，就会看到这一点。请按照以下步骤加载\
  \ XML 文件：\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig7_HTML.jpg](img/497001_1_En_2_Fig7_HTML.jpg)\n\
  \n*图 2-7* – 加载 XML 文件前的导航器对话框\n\n1.  在 `数据` 功能区中，点击 `获取数据` 按钮，然后依次点击 `来自文件` 和 `来自\
  \ XML`。将出现 `导入数据` 对话框。\n2.  导航至包含该文件的文件夹，并选择文件（在此示例中为 `C:\\DataMashupWithExcelSamples\\\
  ColoursTable.xml`）。\n3.  点击 `导入`。将打开 `导航器` 对话框。\n4.  在 `导航器` 对话框的左侧窗格中点击 `Colours`\
  \ 数据集。XML 文件该部分的内容将显示在 `导航器` 对话框的右侧，如图 2-7 所示。\n5.  点击 `转换数据` 按钮。`Power Query 数据`\
  \ 窗口将显示 XML 文件的内容。\n6.  点击 `Power Query 数据` 窗口中的 `关闭并加载` 按钮。颜色列表将被加载到一个新的工作表中。\n\
  \nXML 文件的实际内部格式可能极其复杂。有时一个 XML 文件只包含一个数据集；有时则包含多个独立的数据集。在其他情况下，它会包含一个其记录包含嵌套数据层级的数据集，您需要通过展开元素层次结构来处理。在您学习了所需的数据转换技术后，将在第\
  \ 10 章中了解 `导航器` 对话框如何处理 XML 数据的嵌套层次结构。\n\n**注意**：某些类型的数据源允许您同时加载多个数据集。XML 文件（与 CSV\
  \ 和文本文件不同）*可以*包含多个独立的数据集。如果您先在 `导航器` 窗口中选中 `选择多项` 复选框，然后再选中要从 XML 文件加载的每个数据集左侧的复选框，则您可以同时加载多个数据集。\n\
  \n\n\n### Excel 文件\n\n您很可能已经是 Excel 重度用户，拥有大量存满数据的电子表格，希望将这些数据整合起来，用于在 Power Query\
  \ 中进行分析和展示。此外，在上一章中，您已经了解了如何从 Excel 文件中加载单个工作表。那么，这次让我们来看看如何从一个 Excel 文件中同时加载多个工作表。这个练习能让您从头到尾详细了解整个过程。\n\
  \n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig8_HTML.jpg](img/497001_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n从 Excel 工作簿加载数据前的导航器对话框\n\n1. 在 Excel 的“数据”选项卡中，依次点击 `获取数据` ➤ `来自文件` ➤\
  \ `从工作簿`。此时将弹出“导入数据”对话框。\n2. 导航至包含您要查看文件的目录（本例中为 `C:\\DataMashupWithExcelSamples`）。\n\
  3. 选择源文件（本例中为 `InvoicesAndInvoiceLines.xlsx`），然后点击 `导入`。将弹出“导航器”对话框，显示工作簿文件中的工作表、表格和区域。\n\
  4. 点击“导航器”对话框左侧列出的一个数据集。所选电子表格的前几行将显示在对话框右侧，让您查看所选数据集中的数据样貌。\n5. 确保选中 `选择多项` 复选框。\n\
  6. 点击左侧 `Invoices` 和 `InvoiceLines` 数据集左侧的复选框。此时“导航器”对话框将如图 2-8 所示。\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig9_HTML.jpg](img/497001_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n“正在处理查询”对话框\n\n7. 点击 `加载` 按钮右侧的弹出箭头。\n8. 选择 `加载到`。将短暂弹出“正在处理查询”对话框。您可以在图\
  \ 2-9 中看到此对话框。\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig10_HTML.jpg](img/497001_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n“导入数据”对话框\n\n9. 现在将弹出“导入数据”对话框。确保未选中 `将此数据添加到数据模型`，并保持选中 `表` 和 `新工作表`\
  \ 单选按钮。您可以在图 2-10 中看到此设置。\n10. 点击 `确定`。选定的源数据集将被加载到单独的 Excel 工作表中。\n\n**注意**\n\n\
  某些类型的数据源允许您同时加载多组数据。XML 文件（不同于 CSV 和文本文件）可以包含多个独立的数据集。您可以通过选中要从 XML 文件加载的每个数据集左侧的复选框，来同时加载多个数据集。\n\
  \n从这个简单示例可以看出，让 Power Query 读取 Excel 数据其实并不难。您本可以在加载之前在 Power Query 编辑器中编辑这些数据，但由于这些数据看起来简洁可用，我倾向于将其直接加载到\
  \ Excel（或者更准确地说是 Excel/Power Pivot 数据模型）中。此外，您还看到 Power Query 可以从单个数据源同时加载多个数据集。不过，您可能仍对在此过程中看到的一些内容有疑问，因此，这里提供一些预见性的说明：\n\
  \n导航器对话框显示\n\n*   工作表（如图 2-8 中的 `Invoices` 和 `InvoiceLines`）\n*   命名区域\n*   命名表格\n\
  \n上述每个元素在导航器对话框中都由不同的图标表示。有时，这些实际上可能是指向同一数据的重复引用，因此您应尽可能使用最精确的数据源。例如，我建议使用命名表格或区域名称，而不是工作表源，因为后者很容易最终包含“噪声”数据（即来自您所关注的区域之外的行和列的数据），这会使加载过程变得不必要的复杂——甚至导致加载失败。确实，除非工作表以简单表格格式准备好并结构化，从而可以加载到\
  \ Power Query 中，否则您的数据模型中可能会混入多余数据。\n\n然而，真正酷的地方在于，您可以从单个 Excel 工作簿中同时加载任意多个您想要的工作表、表格或区域。您无需逐个加载每个源数据集。\n\
  \n**注意**\n\n*如果*与外部数据源（如 SQL Server、Oracle 或 SQL Server Analysis Services）的数据连接处于活动状态并已将数据返回到工作簿，那么\
  \ Power Query 将列出并使用源 Excel 工作簿中的这些数据连接。一旦与 Power Query 建立了链接，您就可以删除源 Excel 工作簿中的数据表本身——但仍然可以通过源工作簿中的数据连接将数据加载到\
  \ Power Query 中。\n\nPower Query *不会*考虑 Excel 数据表上的任何数据筛选器，而是加载源表中的所有数据。因此，如果您想要对源数据进行子集化，则需要在\
  \ Power Query 中重新应用任何筛选器（您将在第 6 章中了解更多信息）。\n\n此时，您需要了解几个重要事项：\n\n1. 多个工作表、表格或命名区域都可以在单个加载操作中从同一个工作簿（即\
  \ Excel 文件）导入。但是，对于每个单独的 Excel 文件，您需要定义单独的加载操作。\n2. 也可以使用 Power Query 同时加载多个结构相同的\
  \ Excel 文件。这将在第 10 章中进行说明。\n\n### 为何使用 Power Query 连接到 Excel\n\n此时，您可能会想，既然可以从其他\
  \ Excel 工作表中复制粘贴，或者仅仅跨工作簿链接单元格，为何还要使用 Power Query 从 Excel 加载数据呢？\n\n这是一个非常好的问题。不过，即使是加载\
  \ Excel 数据，通过 Power Query “绕道而行”也有几个非常合理的理由：\n\n1. Power Query 中可用的数据清理和修改选项比 Excel\
  \ 中相应的操作要简单得多。\n2. 在 Power Query 中筛选源数据（并且仅加载数据的子集）异常简单。\n3. Power Query 会自动适应源数据记录数量的减少或增加。\n\
  4. 刷新源数据只需一次点击操作。\n5. 对源数据的任何更改都可以仅在您希望刷新数据时才生效。\n\n### 从表/区域\n\n有时，您可能会接手一个已包含所需数据的\
  \ Excel 工作簿（这可能是使用较旧技术创建的外部数据连接的结果）。您可能需要使用 Power Query 修改和清理这些数据——即使源数据与您要放置处理后输出的数据在同一个文件中。这同样是完全可以实现的。\n\
  \n1. 打开 Excel 文件 `Chapter02Sample1.xlsx`。该文件位于文件夹 `C:\\DataMashupWithExcelSamples`\
  \ 中。\n2. 选择您要在 Power Query 中用作修改数据来源的表格内的一个单元格。在此示例中，您需要确保位于 `SourceData` 选项卡中。\n\
  3. 在 Excel 的“数据”选项卡中，点击 `来自表格/区域`。Power Query 编辑器将打开。\n4. 在“查询设置”窗格中点击查询名称，为此数据源输入一个新名称。\n\
  5. 在 Power Query 编辑器中对数据执行任何您需要的修改（您将在第 6 章到第 12 章中学习这些技巧）。\n6. 点击 `关闭并加载`。转换后的数据将被加载到一个具有新名称的新工作表中。\n\
  \n**注意**\n\n如果在点击 `从表/范围` 按钮之前没有点击现有表格内部，您将收到一条提示，要求您选择源数据。\n\n\n\n### Microsoft\
  \ Access 数据库\n\n另一种目前在许多企业中广泛使用的数据存储库是 Microsoft Access。它是一个强大的桌面级关系型数据库，可以包含数百张表，每张表可容纳数百万条记录。因此，我们需要了解如何从这个特定来源加载数据。此外，Power\
  \ Query 在处理 Access 数据时尤为有用，因为它允许你在*无需安装 Access 本身*的情况下查看 Access 数据库的内容。\n\n![../images/497001_1_En_2_Chapter/497001_1_En_2_Fig11_HTML.jpg](img/497001_1_En_2_Fig11_HTML.jpg)\n\
  \n图 2-11：从 Access 数据库加载数据前的导航器对话框\n\n1.  在“数据”功能区中，依次点击`获取数据` ➤ `来自数据库` ➤ `来自 Microsoft\
  \ Access 数据库`。\n\n2.  导航到包含你要加载数据的 MS Access 数据库（本例中为 `C:\\DataMashupWithExcelSamples\\\
  ClientsDatabase.accdb`）。\n\n3.  选择 Access 文件并点击`导入`。此时会弹出“导航器”对话框，其中列出了 Access 数据库中的所有表和查询。\n\
  \n4.  选择 `ClientList` 数据集。这将显示该表的内容，如图 2-11 所示。\n\n5.  点击`加载`。来自 Access 的源数据将被加载到新的工作表中。\n\
  \n**注意：** 如果你希望同时导入多个 Access 表或查询，只需确保勾选了`选择多项`复选框即可。这将使你能够从 Access 数据库中选择多个源数据表或视图。\n\
  \n如果你仔细观察图 2-11 中导航器对话框的左侧，可以发现它为 Access 对象显示了两种不同的图标：\n\n*   Access 数据表的表图标\n*\
  \   代表两个小窗口的 Access 查询图标\n\n这可以帮助你理解在 Access 数据库中查看的数据类型。\n\n**注意：** Power Query\
  \ *无法*查看 Access 中的链接表，只能查看已导入的表或实际存在于 Access 数据库中的表。不过，它可以读取叠加在原生数据、链接数据或导入数据之上的查询。\n\
  \n### JSON 文件\n\nJSON 文件与 XML 类似，是一种允许用户（和计算机）在系统之间发送复杂数据结构的文件格式。通常，JSON 文件需要进行一些调整，才能以\
  \ Power Query 可用的状态加载。因此，我们将在第 9 章中学习如何加载和准备 JSON 文件，届时你将已经掌握了第 6 章至第 8 章中必要的数据转换技术。\n\
  \n## 总结\n\n在本章中，你已经了解了 Excel 的强大扩展——Power Query——如何帮助你从各种基于文件的数据源中查找和加载数据。这些数据源可以是\
  \ Access、Excel、CSV、XML 或文本/CSV 文件。\n\n你已经看到，Power Query 允许你查看其能读取的数据源内容样本，而无需任何其他应用程序。这使其成为窥探数据源并判断文件是否实际包含所需数据的绝佳工具。事实上，Power\
  \ Query 的导航器可以帮助你筛选 Excel 文件、XML 文件或 Access 数据库中的多个数据集，预览每个数据集，并仅选择你想要加载的数据集。当然，如果多个数据集都存储在同一源中，它也可以一次性加载数十个数据集。\n\
  \n本章并非加载基于文件的数据源的完整概述。因此，如果你需要加载复杂的 XML 文件或 JSON 文件，或者需要了解如何加载整个文件夹的内容（例如，或 Excel\
  \ 文件中的所有工作表），那么你可以直接跳到第 9 章来学习这些技术。\n\n然而，基于文件的数据源只是整体图景的一小部分。Power Query 还可以从各种关系型数据库和数据仓库中加载数据。我们将在下一章中探讨其中的一部分。\n\
  \n"
- "# 3. 从数据库和数据仓库加载数据\n\n当今世界上的大部分企业数据都存储在本地或云中的关系型数据库、数据仓库和数据仓库一体机中。Excel（通过 Power\
  \ Query）可以连接到许多世界领先的商业和开源数据库及数据仓库。本章将向你展示如何从这些数据源中的若干个提取数据，以便利用 Power Query 驱动基于\
  \ Excel 的分析。实际上，你将发现，一旦学会了如何连接一两个数据库，由于 Power Query 为数据提取带来了标准化的接口和方法，你也就学会了如何使用几乎所有数据库。\n\
  \n不过，你需要注意，本章中的示例所使用的示例数据*不在* Apress 网站上提供。在本章中，我将让你使用自己的数据，或者使用通常随源数据库一起安装的示例数据。\n\
  \n**注意：** 这可能是显而易见的，但连接到数据库意味着该数据库必须已安装并正常运行，并且你已有权访问它。实际上，你可能还需要在运行 Power Query\
  \ 的 PC 上安装特定的客户端软件。本章将不解释如何安装或使用任何所提及的数据库（或客户端软件）。为此，你需要查阅相关的数据库文档。不仅如此，本章中概述的许多数据源仅在你拥有专业版或企业版\
  \ Excel 订阅时才可用。\n\n\n\n## 关系数据库\n\n能够访问存储在关系数据库中的数据，对于当今大部分商业智能工作来说至关重要。由于企业级关系数据库仍承载着全球大部分数据，你真的需要知道如何挖掘这些数据库中蕴藏的庞大信息宝库。坏消息是，市面上有非常非常多的数据库，每个都有自己的复杂性和特性。好消息是，一旦你学会了从其中*一个*数据库中加载数据，就基本可以期待能够使用*任意*一个数据库。\n\
  \n在现实世界中，连接企业数据可能需要你拥有一个登录名以及通常用于连接的密码（除非数据库能够识别你的 Windows 登录信息，或者已实施单点登录解决方案）。我还假设你需要拥有读取包含数据的表（Table）和视图（View）的权限。因此，本章描述的技术可能只是简单的一环。困难的部分在于说服企业数据的守护者，让他们相信你确实*需要*这些数据，并且应该被允许查看它们。\n\
  \n`Power Query` 当前能够连接、预览并从中加载数据的数据库，如表 3-1 所示。\n\n**表 3-1**\n\n数据库源\n\n| 数据库 |\
  \ 说明 |\n| --- | --- |\n| SQL Server 数据库 | 允许你连接到本地 Microsoft SQL Server 数据库（位于本地、托管环境或云虚拟机中），并从你有权访问的所有数据表（Table）和视图（View）中导入记录\
  \ |\n| Access 数据库 | 允许你连接到网络中的 Microsoft Access 文件，并加载查询和表（Table）（我们在前一章中探讨过） |\n\
  | SQL Server Analysis Services 数据库 | 允许你连接到 SQL Server Analysis Services (SSAS)\
  \ 数据仓库。这可以是一个联机分析处理 (OLAP) 多维数据集，也可以是一个内存中的表格数据仓库 |\n| Oracle 数据库 | 允许你连接到 Oracle\
  \ 数据库，并从你有权访问的所有数据表（Table）和视图（View）中导入记录。这可能需要安装客户端软件 |\n| IBM DB2 数据库 | 允许你连接到\
  \ IBM DB2 数据库，并从你有权访问的所有数据表（Table）和视图（View）中导入记录。这可能需要安装额外的软件 |\n| MySQL 数据库 | 允许你连接到\
  \ MySQL 数据库，并从你有权访问的所有数据表（Table）和视图（View）中导入记录 |\n| PostgreSQL 数据库 | 允许你连接到 PostgreSQL\
  \ 数据库，并从你有权访问的所有数据表（Table）和视图（View）中导入记录。这可能需要安装额外的软件 |\n| Sybase 数据库 | 允许你连接到 Sybase\
  \ 数据库，并从你有权访问的所有数据表（Table）和视图（View）中导入记录 |\n| Teradata 数据库 | 允许你连接到 Teradata 数据库，并从你有权访问的所有数据表（Table）和视图（View）中导入记录。这可能需要安装额外的软件\
  \ |\n| SAP HANA 数据库 | 允许你连接到 SAP HANA 内存数据库，并导入你有权限访问的所有对象中的记录。这可能需要安装额外的软件 |\n\n\
  这些是当前可用于 `Power Query` 连接的数据库连接器。由于可以从 `Power Query` 连接的数据库和数据仓库源列表在持续发展，当你阅读本书时，这个列表很可能已经扩展，包含了新的项目。\n\
  \n**注意**\n\n尽管 `Power Query` 将 Microsoft Access 归类为关系数据库，但我更倾向于将其作为基于文件的源来处理。因此，MS\
  \ Access 数据已在上一章讨论过。\n\n除了针对特定数据库的连接器，`Power Query` 还包含通用连接器，它们可以帮助你从不在可用数据库列表中的数据库读取数据。这些通用连接器在表\
  \ 3-2 中进行了说明。\n\n**表 3-2**\n\n通用数据库访问\n\n| 源 | 说明 |\n| --- | --- |\n| ODBC 数据源 |\
  \ 允许你通过开放式数据库连接 (ODBC) 连接到数据库或数据源 |\n| OLE DB 数据源 | 允许你通过对象链接和嵌入数据库 (OLE DB) 连接到数据库或数据源\
  \ |\n\n需要注意的是，这些通用连接器并非对所有数据库都有效。但是，对于你已经获取、安装并配置了有效 `ODBC` 或 `OLE DB` 驱动程序的数据库，它们应该可以正常工作。这些连接类型将在第\
  \ 5 章中解释。\n\n\n\n## SQL Server\n\n在此，我将以微软企业级关系数据库——SQL Server——为例，演示如何使用 Power\
  \ Query 将数据从数据库加载到 Excel 中。这种设置的第一大优势是，您可能无需安装任何软件就能访问 SQL Server。第二大优势是，相关技术与 Power\
  \ Query 所能连接的 Oracle、DB2 等数据库所使用和应用的方法十分相似。此外，您还可以一次性从数据库加载多个表或视图。要实际操作（在您的 SQL\
  \ Server 数据库上）查看效果，请按以下步骤操作：\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig1_HTML.jpg](img/497001_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\nMicrosoft SQL Server 数据库对话框\n\n1. 打开一个新的 Excel 工作簿。\n2. 在“数据”功能区中，依次点击\
  \ `获取数据 ➤ 来自数据库 ➤ 来自 SQL Server 数据库`。此时将出现 SQL Server 数据库对话框。\n3. 在 `服务器` 文本框中输入服务器名称。这将是您的\
  \ SQL Server 名称，或是您组织使用的某个 SQL Server 资源。甚至可能是您安装在个人电脑上的 SQL Server 本地版本。\n4. 输入数据库名称。对话框将如图\
  \ 3-1 所示（当然，会显示您自己的服务器和数据库名称）。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig2_HTML.jpg](img/497001_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n选择多个项目时的导航器对话框\n\n1. 点击 `确定`。Power Query 将连接到服务器，并显示导航器对话框，其中包含您在所选服务器上有权查看的所有表和视图。\n\
  2. 确保勾选 `选择多项` 复选框。\n3. 勾选您想要加载的表的复选框。最近选中的表的数据会显示在导航器对话框的右侧，如图 3-2 所示，其中选中了 `Stock`\
  \ 表。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig3_HTML.jpg](img/497001_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n显示数据加载进度的“加载”对话框\n\n1. 点击 `加载`。\n2. 数据加载期间，Power Query 会显示 `查询和连接` 窗格，并展示每个选中表的加载进度。您可以在图\
  \ 3-3 中看到此过程。\n3. 加载完成后，`查询和连接` 窗格将显示已加载到数据模型中的每个源表的最终行数。\n\n**提示**\n\n选择多个表或视图时，您只能在导航器对话框中看到单个数据源的内容。但是，只需点击表或视图的名称，即可预览任何选中数据源（甚至任何未选中数据源）的内容。这不会影响您希望使用\
  \ Power Query 加载的选中表和视图的选择。\n\n由于这与上一章从 Access 加载数据的方式非常相似，我猜您现在应该已经掌握了如何使用数据库源。导航器对话框再次提供了一种简单高效的方式来选择要加载到\
  \ Excel 中的数据集。\n\n**注意**\n\n如果您愿意，可以输入服务器 IP 地址代替服务器名称。如果同一台服务器上有多个 SQL Server 实例，您需要添加一个反斜杠和实例名称。此类详细信息可从企业数据库管理员处获取。\n\
  \n### 自动加载相关表\n\n关系数据库几乎总是由许多相互依赖的表组成的复杂结构。实际上，您经常需要加载多个表才能获得所需的所有数据。\n\n知道选择哪些表并不总是容易的。Power\
  \ Query 会尝试通过自动检测源数据库中表之间存在的关联来帮助您；通过这种方式，您可以快速确定设计为协同工作的表集合。\n\n请执行以下操作以查看相关的表组：\n\
  \n1. 按照上一节所述连接到源数据库。\n2. 在导航器对话框中，单击包含您需要数据的表。\n3. 点击 `选择相关表` 按钮。\n\n数据库中与您在导航器对话框中选择的表相关联的任何表都会被选中。当然，您可以取消选择任何不需要的表。更重要的是，您可以点击选中表的名称来查看其内容。\n\
  \n**注意**\n\n有时您需要依次选择多个表并单击 `选择相关表`，以确保 Power Query 会选择支撑您分析所需的所有表。\n\n### 数据库选项\n\
  \n——无论好坏——关系数据库的世界比文件或 MS Access 的世界要稍微复杂一些。因此，关于将数据库用作数据源（特别是如何连接到数据库）有一些需要说明的地方。\n\
  \n首先，我们讨论一下与服务器的初始连接。选项在表 3-3 中进行了解释。\n\n**表 3-3**\n\n数据库连接选项\n\n| 选项 | 说明 |\n|\
  \ --- | --- |\n| `服务器` | 您无法通过浏览找到服务器，因此需要 *输入* 或 *粘贴* 服务器名称。如果服务器有实例名称（稍后我会解释这个概念），您需要同时输入服务器和实例。如果您在办公环境中工作，您的\
  \ IT 部门将能提供此信息 |\n| `数据库` | 如果您知道数据库名称，则可以在此处输入（或粘贴）。这会限制导航器对话框中可用表的数量，并更容易找到正确的表或视图\
  \ |\n| `SQL 语句` | 您可以输入一段有效的 T-SQL 代码片段（或一个存储过程，或一个表值函数），该代码从数据库返回数据 |\n\n这些选项可能需要进一步的解释。因此，让我们逐一探讨它们。\n\
  \n\n#### 服务器连接\n\n关键在于，你需要知道想要连接的数据库的确切连接字符串。这可能是以下形式：\n\n-   数据库服务器名称。\n-   数据库服务器名称、反斜杠和实例名称（如果此物理或虚拟服务器包含多个\
  \ SQL Server 实例）。\n-   数据库服务器 IP 地址。\n-   数据库服务器 IP 地址、反斜杠和实例名称（如果有）。\n-   如果 SQL\
  \ Server 实例使用自定义端口，则必须在服务器名称末尾加上逗号，后跟端口号。这通常是企业级 DBA 负责的问题。\n-   如果你在个人电脑上运行的是单个\
  \ SQL Server 实例，则可以使用名称 `localhost`（或一个句点）来引用本地服务器。\n\n> **注意**  \n> 数据库实例是在同一物理或虚拟服务器上与其他实例并行运行的独立\
  \ SQL Server 服务。要成功连接，你始终需要同时提供服务器名称和此实例名称（如果有）。你也可以根据需要指定超时时间。\n\n大多数 SQL Server\
  \ 实例托管着许多数据库，有时数量可达数百个。有时，你难免会忘记要连接的是哪个数据库。幸运的是，Power Query 导航器允许你在授权的服务器上浏览数据库。为此，请执行以下操作：\n\
  \n![图 3-4 - 选择数据库时的导航器对话框](img/497001_1_En_3_Fig4_HTML.jpg)\n\n**图 3-4** 选择数据库时的导航器对话框\n\
  \n1.  在 Power Query 功能区中，点击**获取数据**按钮底部的小三角形，然后点击 **SQL Server**。此时将出现 SQL Server\
  \ 数据库对话框。\n2.  在**服务器**文本框中输入服务器名称，然后点击**确定**。*不要*输入数据库名称。导航器窗口将打开并显示所有可用的数据库，如图\
  \ 3-4 所示。当然，实际显示的内容取决于你正在连接的服务器。\n\n从图 3-4 中可以看到，如果你点击数据库左侧的小三角形，则能够看到在该数据库中你有权访问的所有表和视图。虽然在寻找所需的表或视图时，这可能意味着选择过多，但这仍然是提醒你所需数据集名称的一种便捷方式。\n\
  \n> **提示**  \n> 你在企业服务器上实际能看到的数据库取决于已授予你的权限。如果你看不到某个数据库，则必须与数据库管理员沟通以解决权限问题。\n\n\
  #### 在导航器中搜索数据库、表和视图\n\n如果导航器对话框左侧面板中显示的表和视图数量过多让你应接不暇，则可以使用导航器内置的搜索功能来帮助缩小潜在数据源的范围。\n\
  \n##### 搜索数据库\n\n要隔离特定的数据库，请执行以下操作：\n\n![图 3-5 - 使用导航器搜索功能查找数据库](img/497001_1_En_3_Fig5_HTML.jpg)\n\
  \n**图 3-5** 使用导航器搜索功能查找数据库\n\n1.  执行前面“SQL Server”部分中的步骤 1 和 2，连接到 SQL Server 实例时*不*指定数据库。\n\
  2.  在导航器对话框的**搜索**框中，输入几个你知道包含在你要查找的表或视图名称中的字符。例如，在我的服务器上输入 `US`，会得到如图 3-5 所示的结果。\n\
  \n##### 搜索表\n\n如果你要搜索表，请执行以下操作：\n\n![图 3-6 - 使用导航器搜索功能查找表](img/497001_1_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6** 使用导航器搜索功能查找表\n\n1.  展开你想要搜索特定表的任何数据库。\n2.  在导航器对话框的**搜索**框中，展开你感兴趣的数据库，然后输入几个你知道包含在你要查找的表或视图名称中的字符。例如，在我的服务器上输入\
  \ `cust`，会得到如图 3-6 所示的结果。\n\n搜索对象时，可以输入大写或小写文本（适用于大多数 SQL Server 安装），并且该文本可以出现在表或视图名称的任何位置，而不仅仅是名称的开头。每输入一个字符，潜在匹配项的列表就会越来越短。一旦找到你要查找的表或视图，只需按照前面所述的方法将数据加载到\
  \ Excel 中，即可使用 Power Query。\n\n如果搜索没有返回你预期的任何视图中的表子集，只需点击**搜索**框右侧的叉号即可。这会取消搜索并显示所有可用的表，同时清空**搜索**框。\n\
  \n如果你不确定是否看到了数据库中所有的表和视图，请点击**搜索**框右下角的小图标（看起来像是一个带有两个绿色循环箭头的小页面）。这是**刷新**按钮，它会刷新与数据库的连接，并显示你有权限查看的所有表和视图。最后，值得注意的是，筛选表的功能也可以应用于\
  \ Excel 表、工作表、命名区域以及 Access 数据库。这是统一的导航器界面如何帮助最小化掌握 Power Query 的学习曲线的另一个例子。\n\n\
  #### 数据库安全性\n\n请记住，数据库的设计是极其安全的。因此，只有在你被授权访问时，才能看到服务器、数据库、表和视图。你可能需要与 IT 部门沟通，以确保你拥有所需的权限；否则，你正在寻找的表可能就在数据库中，但对你来说却是不可见的。\n\
  \n> **提示**  \n> 如果在首次尝试连接到 SQL Server 时遇到连接错误，只需点击**编辑**按钮返回 Microsoft SQL Server\
  \ 数据库对话框并更正任何错误即可。这避免了重新开始整个过程。\n\n\n### 使用 SQL 语句\n\n若说使用 SQL Server 这类关系数据库作为数据源有什么缺点，那便是数据库存储的海量数据——即便只在一个表中——也可能庞大得令人望而生畏。幸运的是，在你加载数据之前，便可利用\
  \ SQL Server 的全部资源来筛选通过 Power Query 访问的数据。这样一来，你就不必在尚未开始分析数据之前，就冒着被信息淹没的风险加载整个数据表。\n\
  \n以下是可用来扩展 SQL Server 与 Power Query 协作关系的 SQL Server 技术：\n\n- `SQL SELECT` 语句\n\
  - 存储过程\n- 表值函数\n\n诚然，这些是相当技术性的解决方案。事实上，如果你不是数据库专家，可能需要 IT 部门的协助才能使用这些选项来访问服务器中的数据。尽管如此，还是值得快速了解这些技术，以备现在或将来派上用场。\n\
  \n以上任一选项均可从 SQL Server 数据库对话框中进行应用。以下是一个使用 `SELECT` 语句从数据库表中筛选数据的示例：\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig7_HTML.jpg](img/497001_1_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7** 使用 SQL 选择数据库数据\n\n1.  在“数据”功能区，单击 **获取数据** ➤ **来自数据库** ➤ **来自 SQL Server\
  \ 数据库**。将显示 SQL Server 数据库对话框。\n2.  输入服务器名称和数据库名称。这必须是您已被授予访问权限的服务器和数据库。\n3.  单击\
  \ **高级选项** 左侧的三角形。这将打开一个可以输入 SQL 命令的框。\n4.  输入您要应用的 SQL 命令。在此示例中（使用我电脑上的服务器和数据库），命令为\
  \ `SELECT CountryName, MakeName, ModelName, Cost FROM Data.AllSales ORDER BY CountryName`。对话框将如图\
  \ 3-7 所示——当然，**SQL 语句** 框中显示的是您输入的 SQL。\n5.  单击 **确定**。相应数据的样本最终会显示在如图 3-8 所示的对话框中。实际返回的数据取决于您所使用的源系统。\n\
  6.  单击 **加载** 或 **转换数据** 以继续数据加载过程。或者，您可以单击 **取消** 并开始不同的数据加载。\n\n> **提示**：在输入自定义\
  \ SQL 时（或使用存储过程时，如下节所述），最好在第 3 步中指定数据库名称。如果不提供数据库名称，则必须在 SQL 查询中使用三部分表示法。也就是说，您必须在查询中使用的*每个*表名的架构和表名之前加上数据库名称和句点。\n\
  \n### SQL Server 中的存储过程\n\n使用函数或存储过程从 SQL Server 返回数据时，其原理相同。您将始终使用 **SQL 语句** 选项输入将返回数据的命令。请记住，要调用\
  \ SQL Server 存储过程或函数，您需要在 Microsoft SQL Server 数据库对话框中输入以下元素：\n\n-   **服务器**：`<您的服务器名称>`\n\
  -   **数据库**：`<数据库名称>`\n-   **SQL 语句**：`EXECUTE`（或 `EXEC`）`<输入架构（如果有，后跟句点）和存储过程名称，后跟任何参数>`\n\
  \n通过这种方式，您或您的 IT 部门可以创建复杂且安全的方法，以便将来自企业数据库的数据从数据库读取到 Power Query 中。\n\n为了实际演示，以下是一个使用\
  \ SQL Server 存储过程仅返回可用数据子集的示例。该存储过程名为 `pr_DisplayUKClientData`，您可按如下方式应用它：\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig9_HTML.jpg](img/497001_1_En_3_Fig9_HTML.jpg)\n\
  \n**图 3-9** 使用 SQL 选择数据库数据\n\n-   在“数据”功能区，单击 **获取数据** ➤ **来自数据库** ➤ **来自 SQL Server\
  \ 数据库**。将显示 SQL Server 数据库对话框。\n-   输入服务器名称和数据库名称。\n-   单击 **高级选项** 左侧的三角形。这将打开一个可以输入\
  \ SQL 命令的框。\n-   输入您要应用的 SQL 命令。在本例中，该命令为 `EXECUTE dbo.pr_DisplayUKClientData`。对话框将如图\
  \ 3-9 所示。\n-   单击 **确定**。相应数据的样本将返回到导航器中。\n-   单击 **加载** 或 **编辑** 以继续数据加载过程。或者，您可以单击\
  \ **取消** 并开始不同的数据加载。\n\n在此示例中返回的数据仅是存储过程所选出的可用数据的一个子集。您需要了解存储过程可以对源数据执行多种任务。这些任务包括选择、排序和清理数据。\n\
  \n存储过程通常需要在存储过程名称后添加*参数*。在 Power Query 中执行存储过程时，这是完全可以接受的。例如：\n\n```\nEXECUTE dbo.pr_DisplayUKClientData\
  \ 2020\n```\n\n在此特定示例中，参数是 `2020`。如果需要输入多个参数，它们必须用逗号分隔。\n\n需要记住并向 IT 部门传达的关键是：Power\
  \ Query 期望的 SQL 是源数据库所使用的 SQL 方言。因此，对于 SQL Server，这意味着要使用 `T-SQL`。事实上，这个 SQL 变成了一个“直通”查询，由底层数据库直接解释。\n\
  \n> **注意**：SQL 语句或存储过程仅会以*单个表*的形式返回数据。诚然，此表可能包含来自源数据库中多个基础表或视图的数据，但筛选源数据将阻止 Power\
  \ Query 将来自多个表的数据作为单独查询加载。因此，您可能需要创建多个查询，而不是单个加载查询，以便从数据源中一组连贯的表中获取数据。\n\n\n\n##\
  \ Oracle 数据库\n\n当今企业市场中活跃着众多数据库供应商，其中最具统治力的当属 Oracle。虽然我已使用 Microsoft 数据源开启探索如何通过\
  \ Power Query 使用数据库的旅程，但我若不解释如何访问其他供应商的数据库，便是有失职守。\n\n现在正是展示 Power Query 真正开放性的时刻。它绝不会将你局限于\
  \ Microsoft 数据源——远非如此。事实上，使用其他供应商的数据库作为分析报告的数据源同样轻而易举。作为示例，让我们一起看看如何通过 Power Query\
  \ 将 Oracle 数据加载到 Excel 中。\n\n安装和配置 Oracle 数据库并非易事。因此，我不会提供 Oracle 示例数据库，而是建议你自行寻找可连接的企业数据库，或者更佳方案是查阅众多优秀资源——这些资源能出色地指导你如何搭建自己的\
  \ Oracle 数据库并安装可用的示例数据。\n\n请注意，连接 Oracle 需要在运行 Power Query 的计算机上安装 Oracle 客户端软件，其配置过程也可能较为复杂。因此，若你计划测试使用\
  \ Oracle 数据与 Power Query 配合，或许需要寻求企业内专业人士或技术达人的帮助。\n\n若你勇于尝试，可通过以下网址查找 Oracle 客户端软件。对于\
  \ 32 位版本的 Power Query，可尝试通过以下链接下载并安装 32 位 Oracle 客户端：\n\n```\nwww.oracle.com/technetwork/topics/dotnet/utilsoft-086879.html\n\
  ```\n\n对于 64 位版本的 Power Query，请使用以下链接下载并安装 64 位 Oracle 客户端：\n\n```\nwww.oracle.com/technetwork/database/windows/downloads/index-090165.html\n\
  ```\n\n本书付印时，以上两个链接均有效。\n\n如需确认当前使用的 Power Query 版本（32 位或 64 位），请依次单击 `File` ➤ `Help`\
  \ ➤ `About`。弹出的对话框会显示当前版本信息。\n\n现在，假设你已拥有可用的 Oracle 数据库（且已知服务器名称或 `SID` 以及有效的用户名和密码），以下步骤将演示如何从该数据源将数据加载到\
  \ Power Query。此示例中我将使用随示例数据库一同安装的标准 Oracle 示例数据。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig10_HTML.jpg](img/497001_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10 Oracle 数据库对话框\n\n1. 打开一个新的 Excel 工作簿。\n2. 在 `Data` 功能区的 `Get Data` 菜单中，依次选择\
  \ `From Database` ➤ `From Oracle Database`。\n3. 在 `Server` 文本框中输入服务器名称。这可以是您的 Oracle\
  \ 服务器名称，或所在机构使用的某个 Oracle 服务器资源名称。\n4. 点击 `Import` 按钮。此时对话框将如图 3-10 所示。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig11_HTML.jpg](img/497001_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11 Oracle 数据库安全对话框\n\n5. 点击 `OK`。此时将出现 Oracle 数据库安全对话框。假设您无权使用 Windows 登录凭据连接数据库，请在对话框左侧点击\
  \ `Database`。\n6. 输入用于登录 Oracle 的用户名和密码。您可在图 3-11 中查看此对话框。\n7. 点击 `Connect`。Power\
  \ Query 将连接至服务器，并显示 `Navigator` 对话框，其中包含您在所选服务器上有权查看的所有表和视图。某些情况下，您可能会看到提示“数据源不支持加密”的对话框。如果您接受非加密连接，请点击该对话框的\
  \ `OK` 按钮。\n8. 展开 `HR` 文件夹。这是 Oracle 的标准示例模式，可能已安装在您的 Oracle 实例中。若未安装，您需要选择其他模式。\n\
  9. 勾选 `Select multiple items` 复选框。\n10. 勾选您感兴趣的表对应的复选框。最近选中的数据会显示在 `Navigator` 对话框右侧，这与\
  \ SQL Server 的操作完全一致。\n11. 点击 `Load`。此时将出现 `Queries & Connections` 窗格，显示每个选中表对应的查询。\n\
  \n如果您已按照本章之前的示例加载过 SQL Server 数据，那么您应该能体会到这两种技术的高度相似性。事实上，使用 Power Query 的一大优势在于：从不同数据源加载数据所遵循的方法大体相同，并共享许多相同的步骤和对话框。在数据库方面尤其如此——无论何种数据库，操作步骤几乎完全一致。\n\
  \n当然，没有两种数据库是完全相同的。因此，您可以连接到 Oracle 实例（或服务器），但无法像在 SQL Server（或 Sybase 等）中那样选择特定数据库。同理，Oracle\
  \ 使用模式来隔离和组织数据表，而 SQL Server 则依赖数据库。尽管如此，Power Query 的导航器始终会将数据组织成层次清晰的文件夹结构，使您能够以清晰、简单且直观的方式查看底层数据结构。\n\
  \n\n\n## 其他关系型数据库\n\n本章开头的表 3-1 列出了本书付印时 Power Query 能够连接的关系型数据库。我想，自本书出版以来，这个列表应该已经有所增加。不过好消息是，要连接任何可用的数据源数据库，你可能并不需要太多额外的信息。简而言之，如果你知道如何连接其中一个，你就能连接其中任何一个。\n\
  \n因此，我不会花大篇幅去重复解释如何从十几个甚至更多的关系型数据库中获取数据，这些解释实际上都大同小异。相反，我建议你直接用本章为 Oracle 和 SQL\
  \ Server 学到的技术尝试连接即可。\n\n但请注意，要连接到关系型数据库，你不可避免地需要知道以下详细信息：\n\n*   服务器名称\n*   数据库名称（可能）\n\
  *   有效的用户名（取决于已实施的安全策略）\n*   你连接所用用户的有效密码（这也取决于已实施的安全策略）\n\n不过，如果你掌握了这些信息，那么任何因素都不应阻碍你使用各种企业数据源作为\
  \ Power Query 分析的基础。当然，你需要拥有访问数据库及其所含数据的所有必要权限。\n\n另外，值得一提的是，连接 DB2、MySQL、PostgreSQL、Sybase、IBM\
  \ Informix、IBM Netezza、SAP HANA 或 Teradata，不仅需要数据库管理员授予你必要权限，还需要在你的电脑上安装了连接软件（即所谓的*驱动程序*或*提供程序*）。考虑到这些要求的“企业”性质，直接与你的\
  \ IT 部门沟通，让他们在企业 IT 环境中为你完成设置，可能会有所帮助。\n\n要查明启用与特定数据库连接所需的软件是否已安装，一种方法是从 `Get Data`\
  \ 对话框的可用列表中选择该数据库。如果驱动程序尚未安装，你会看到一个类似于图 3-12 所示的警告。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig12_HTML.jpg](img/497001_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n缺失驱动程序警报\n\n点击 `了解详情` 链接将会跳转到缺失驱动程序的下载页面。但需要注意的是，在某些情况下，配置数据提供程序可能需要专业知识以及要安装驱动程序的计算机上的本地管理员权限。\n\
  \n## Microsoft SQL Server Analysis Services 数据源\n\nAnalysis Services 数据库是一种数据仓库技术，它可以包含大量为支持决策而优化的数据。*SSAS\
  \ 多维数据集*（这些数据库的另一种叫法）由事实（度量值或数值）和维度（描述性属性）组成。\n\n实际上——请数据仓库纯粹主义者见谅——SSAS 多维数据集本质上就是一个巨大的数据透视表。因此，如果你在\
  \ Excel 中使用过数据透视表，那么你就已经准备好访问 Power Query 中的数据仓库源，并对它们包含的数据进行切片和切块了。\n\n> **注意**\
  \  \n> 在本节中，我将解释如何访问*多维*（基于磁盘的）SSAS 数据仓库。我将在下一节解释*表格* SSAS。\n\n请注意，本书没有提供示例 SSAS\
  \ 数据库。这是因为安装和配置 SSAS 是一项艰巨的任务，需要专业知识。因此，我将留给你自己去获取公司 Analysis Services 数据库的登录详细信息，并使用这些信息进行试验。\n\
  \n如果你的工作环境使用 Analysis Services 数据库，则可以通过执行以下步骤来访问它们：\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig14_HTML.jpg](img/497001_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\n连接到 SSAS（多维）数据库时指定适当的安全性\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig13_HTML.jpg](img/497001_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\n连接到 SSAS（多维）数据库\n\n1.  在“数据”功能区，单击 `获取数据` ➤ `来自数据库` ➤ `来自 Analysis Services\
  \ 数据库 (导入)`。\n2.  单击 `连接`。将出现 `SQL Server Analysis Services 数据库` 对话框。\n3.  输入 Analysis\
  \ Services 服务器名称和数据库（或“多维数据集”）名称。我这里使用的数据库名为 `CarSalesOLAP`；你需要指定你自己的 SSAS 数据库名称。无论如何，你都需要使用自己的\
  \ SSAS 服务器名称。该对话框看起来会有点像图 3-13 所示——只是当然会使用你自己的服务器和数据库名称。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig15_HTML.jpg](img/497001_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\nSQL Server Analysis Services 凭据对话框\n\n1.  单击 `连接`。你可能会短暂看到 `正在连接` 对话框，如图\
  \ 3-15 所示。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig16_HTML.jpg](img/497001_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n从 SSAS 多维数据集选择属性和度量值\n\n1.  将出现 `导航器` 对话框。展开对话框左窗格中的文件夹。这样，你就可以查看数据仓库中包含的所有事实表和维度。\n\
  2.  选择你想要加载的事实表、维度，或者甚至是仅选择维度属性和度量值。在我的笔记本电脑上，该对话框看起来有点像图 3-16。显然，你将看到你所连接的 Analysis\
  \ Services 实例托管的事实表和维度。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig17_HTML.jpg](img/497001_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\nExcel 工作表中 SSAS 多维数据集的输出\n\n1.  单击 `加载`。`查询 & 连接` 窗格将显示一个新查询，你选择的度量值和属性将出现在一个新工作表中。你可以在图\
  \ 3-17 中看到一个示例。\n\n当然，在第 7 步中，你可以单击 `加载` 按钮右侧的弹出三角形，并从你在第 2 章中看到的其他可能的加载选项中进行选择。\n\
  \n> **注意**\n> 如果你在第 3 步中没有输入多维数据集（数据库）名称，那么 `导航器` 对话框将显示 SSAS 服务器上所有可用的多维数据集。从这里，你可以深入到你感兴趣的多维数据集，查询所需的数据。\n\
  \nSSAS 多维数据集可能非常庞大。它们可以包含数十个维度、多个事实表以及成千上万个度量值和属性。理解多维数据集及其工作原理超出了本书的范围。尽管如此，重要的是要理解，对于\
  \ Power Query 而言，多维数据集只是另一个数据源。这意味着你可以极其有选择性地加载多维数据集元素到 Power Query，只加载分析所需的元素。你可以加载整个维度或仅加载几个属性，就像你可以加载整个事实表或仅加载选定的度量值一样。\n\
  \n> **注意**\n> 你可以通过在 `SQL Server Analysis Services 数据库` 对话框中展开 `MDX` 或 `DAX` 查询（可选）项来筛选从\
  \ SSAS 多维数据集加载的数据。然后，你可以在出现的框中输入 MDX 查询，再单击确定。请注意，“经典”（基于磁盘的）SSAS 多维数据集使用以 MDX 编写的查询——这是一种被认为是难以学习的专业语言。好消息是，如果\
  \ Analysis Services 专家已正确设置了多维数据集，你可以在查询编辑器中看到 SSAS 显示文件夹。\n\n\n\n### 来自 Analysis\
  \ Services\n\n在 `获取数据 ➤ 来自数据库` 类别中看到两个都与 `Analysis Services` 相关的选项，可能看起来有些奇怪。这两个选项分别是：\n\
  \n*   `来自 Analysis Services 数据库 (导入)`\n*   `来自 Analysis Services`\n\n第一个选项是你在上一节中看到的，它是一个完全标准的\
  \ `Power Query` 连接过程。第二个选项则出人意料地，与 `Power Query` 毫无关系。实际上，这是一种从 Excel 2007 版本开始就存在的较旧的连接类型，被称为\
  \ `Office 数据连接`。\n\n因此，即使这种连接类型无法在 `Power Query` 的上下文中使用（严格来说，也超出了本书的讨论范围），我还是倾向于对其进行解释——哪怕只是为了消除许多用户在面对这两种不同的访问\
  \ `SSAS` 数据的方法时感到的困惑。\n\n要使用 `Office 数据连接` 连接到 `Analysis Services` 数据库：\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig18_HTML.jpg](img/497001_1_En_3_Fig18_HTML.jpg)\n\
  \n**图 3-18** `连接到数据库服务器` 对话框\n\n1.  在 `数据` 选项卡中，点击 `获取数据 ➤ 来自数据库 ➤ 来自 Analysis Services\
  \ 数据库`。将出现 `连接到数据库服务器` 对话框。\n2.  输入 `Analysis Services` 服务器名称，如图 3-18 所示。当然，您必须使用自己的\
  \ `Analysis Services` 实例名称。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig19_HTML.jpg](img/497001_1_En_3_Fig19_HTML.jpg)\n\
  \n**图 3-19** `选择数据库和表` 对话框\n\n3.  点击 `下一步`。将出现 `选择数据库和表` 对话框，如图 3-19 所示。您可以在此处从\
  \ `Analysis Services` 服务器上任何可用的数据库中进行选择。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig20_HTML.jpg](img/497001_1_En_3_Fig20_HTML.jpg)\n\
  \n**图 3-20** `保存数据连接文件和完成` 对话框\n\n4.  点击 `下一步`。将出现 `保存数据连接文件和完成` 对话框，如图 3-20 所示。您可以在此处添加描述和友好名称，以帮助您或其他用户从可用的连接中识别此连接。\n\
  \n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig21_HTML.jpg](img/497001_1_En_3_Fig21_HTML.jpg)\n\
  \n**图 3-21** `导入数据` 对话框\n\n5.  点击 `完成`。将出现 `导入数据` 对话框，如图 3-21 所示。与之前使用 `Power Query`\
  \ 连接到 `Analysis Services` 时相比，此对话框提供的选项稍有限制。\n6.  点击 `确定`。Excel 将根据 `Analysis Services`\
  \ 数据，在新的或现有的工作表中创建一个数据透视表（如果选择，也可创建数据透视图）。\n\n我必须再次强调，当您使用此连接类型时，源数据 *无法* 在 `Power\
  \ Query` 中进行清理、建模或调整，因此，您不会在 `查询和连接` 窗格中看到任何查询。\n\n### SSAS 表格模型数据仓库\n\n上一节展示了如何连接到“经典”的\
  \ SQL Server Analysis Services 多维数据集。然而，现在有两种类型的 SQL Server Analysis Services 数据仓库：\n\
  \n*   “传统”的多维数据集\n*   “较新”的表格模型数据仓库\n\n随着越来越多的数据仓库（至少是基于微软技术的数据仓库）使用较新的表格模型技术构建，花些时间了解如何使用\
  \ `Power Query` 快速便捷地连接到这些数据源是值得的。事实上，连接到这两种数据仓库源的步骤几乎完全相同。但是，由于 `Power Query` 正迅速成为查询表格模型数据仓库的首选工具，花几分钟学习如何使用它连接到\
  \ `SSAS` 表格模型（通常简称为 SSAS 表格）确实是值得的。\n\n同样，您需要拥有自己的 `SSAS` 表格模型数据库，才能尝试连接到这种类型的 `Analysis\
  \ Services` 数据库。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig22_HTML.jpg](img/497001_1_En_3_Fig22_HTML.jpg)\n\
  \n**图 3-22** 连接到 `SSAS`（多维）数据库\n\n1.  在 `数据` 选项卡中，点击 `获取数据 ➤ 来自数据库 ➤ 来自 Analysis\
  \ Services 数据库 (导入)`。将出现 `SQL Server Analysis Services 数据库` 对话框。\n2.  输入 `Analysis\
  \ Services` 服务器名称和表格模型数据库名称（我们通常不称其为多维数据集）。此处，我电脑上的数据库是 `CarSalesTabular`；您必须指定自己的表格模型数据库名称。无论如何，您都需要使用自己\
  \ `SSAS` 服务器的名称。\n3.  点击 `导入`。\n4.  对话框将如图 3-22 所示。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig23_HTML.jpg](img/497001_1_En_3_Fig23_HTML.jpg)\n\
  \n**图 3-23** 凭据对话框\n\n5.  点击 `确定`。如果这是您第一次连接到该表格模型数据仓库，将出现 `访问 SQL Server Analysis\
  \ Services` 对话框，以便您定义用于连接到 `Analysis Services` 数据库的凭据，您需要在此接受或更改凭据。您可以在图 3-23 中看到此对话框。\n\
  \n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig24_HTML.jpg](img/497001_1_En_3_Fig24_HTML.jpg)\n\
  \n**图 3-24** 从 `SSAS` 表格模型数据源选择属性和度量值\n\n6.  点击 `连接`。将出现 `导航器` 对话框。\n7.  展开对话框左窗格中的文件夹。这样，您就可以看到数据仓库中包含的所有表。这些表的结构可能是事实表和维度表，也可能不是，这与“经典”SSAS\
  \ 数据仓库的情况相同。\n8.  选择要加载的表。对话框将如图 3-24 所示。\n9.  点击 `加载`。数据将被加载（很可能加载到一个新的工作表中，但这取决于您的环境）。\n\
  \n> **提示**\n> 您可以通过展开 `SQL Server Analysis Services 数据库` 对话框中的 `MDX 或 DAX 查询（可选）`\
  \ 项，来过滤从 `SSAS` 表格模型数据库加载的数据。然后，您可以在出现的框中输入 `DAX` 查询，再点击 `确定`。`SSAS` 表格模型数据库使用一种名为\
  \ `DAX` 的特定语言编写的查询。\n\n### 连接时的凭据类型\n\n当连接到几乎任何数据库时——无论是微软数据库（如 SQL Server 或 Analysis\
  \ Services），还是 Excel 中提供了连接器的非微软数据库——您都需要选择如何通过数据库进行身份验证。这涉及到指定您想要传递给要从中提取数据的数据库的凭据类型。\n\
  \n主要有三种连接类型（如图 3-14 所示）：\n\n*   **Windows**：这意味着使用您登录公司网络或本地工作组的 Windows 账户对数据库进行身份验证。这假定您的\
  \ Windows 登录账户已被授予访问数据库及其所包含数据的权限。\n*   **基本**：这意味着输入数据库能够识别的用户名和密码，并且该用户已被授予访问数据库及其所包含数据的权限。显然，您在尝试此类连接之前需要掌握这些信息。\n\
  *   **Microsoft 账户**：这意味着使用您的 Microsoft 账户访问数据库及其包含的数据。同样，此账户必须已被授予访问数据库及其所包含数据的权限。\n\
  \n`Power Query` 会为您使用过的每个数据源连接保存数据源凭据或登录标识。\n\n\n\n### 无法连接\n\n当你在 Excel 的 Power\
  \ Query 中无法连接到外部数据库时，这种情况是不可避免的。当你看到如图 3-25 所示的对话框时，你会很快发现这个问题。\n\n![../images/497001_1_En_3_Chapter/497001_1_En_3_Fig25_HTML.jpg](img/497001_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25\n\n无法连接对话框\n\n解决办法很简单：点击`编辑`按钮，这将重新显示此特定数据源的连接对话框。然后，你输入正确的连接信息——并再次尝试连接。\n\
  \n## 其他数据库连接\n\nPower Query 并不仅限于一组预定义的可用的数据源。只要你的源数据库配备了通用数据提供程序之一——`ODBC` 或 `OLE\
  \ DB`——那么 Power Query 几乎肯定也能访问这些源。你将在第 5 章中了解这些内容。\n\n## 结论\n\n在本章中，你了解了如何将 Power\
  \ Query 连接到当前存在的大量数据库和数据仓库中的一部分。此外，你还了解到 Power Query 开箱即用，预置了与当前企业环境中一些最常用数据库的连接。\n\
  \n"
- "# 4. 从 Web 和云加载数据\n\n在本章中，我们将探讨通过互联网可用、且快速增长的广泛数据源中的一部分，你可以将这些数据源用作 Excel 的分析数据源。虽然你将在后续页面中看到的数据源可能千差万别，但它们都有一个共同点：它们都存储在企业的外部，并可通过互联网连接使用。\n\
  \n详细探讨所有可用的数据源需要一整本书的篇幅，因此我将只演示如何访问当前提供的一些*主流*服务。一旦你学会了如何访问其中几个服务，你应该就能将基本技术扩展到访问\
  \ Power Query 目前可用于将数据导入 Excel 的几乎所有 Web 和云服务。\n\n使用 Power Query 可访问的、不断增长的数据源由多个不同的供应商提供。因此，本章中概述的几乎所有数据连接都需要访问特定的在线源。这些源大多是企业级的——且并非免费。然而，如果你的企业没有订阅这些服务，但你仍希望试用它们，那么不妨看看本章中概述的许多（即便不是全部）服务提供商所提供的免费试用方案。因此，这些数据源中的许多仅可通过\
  \ Excel Pro 或企业版许可证使用。\n\n## Web 和云服务\n\n在深入探讨某些可用的 Web 和云服务的细节之前，让我们先从一个较高的层面来了解这些服务究竟是什么。这些数据源包括（但不限于）：\n\
  \n*   网页\n*   在线服务，例如 Salesforce 或 MS Dynamics 365\n*   Microsoft Azure，包括在 Azure\
  \ Blob 服务中托管文件、在 Azure SQL Database 中存储数据，或在 Azure Synapse Analytics 中存储数据（甚至在 Azure\
  \ HDInsight 中读取大数据）\n\n## 网页\n\n如果你需要收集一些在 Web 浏览器中以表格形式呈现的数据，你可以使用 Power Query\
  \ 连接到相关页面的`URL`，然后从页面上的任意表格中加载所有数据。\n\n### 在线服务\n\n*在线服务*是一个统称，用于描述你可以通过互联网访问的数据。大多数可供\
  \ Power Query 使用的在线服务都是所谓的“平台”。这些（通常是庞大的）软件和数据资源，要么仅能在线访问，要么曾驻留在企业系统中，但现在以服务的形式存在于互联网上。目前有几种可以使用\
  \ Power Query 连接的在线服务，它们列在表 4-1 中。\n\n表 4-1\n\n当前可用的 Power Query 在线服务\n\n| 源 | 说明\
  \ |\n| --- | --- |\n| Salesforce Objects | 允许你访问 Salesforce 中的数据 |\n| Salesforce\
  \ Reports | 允许你访问构成内置 Salesforce 报表基础的数据对象（包括原生和自定义） |\n| Facebook | 访问 Facebook\
  \ 数据 |\n| SharePoint Online | 连接到 Microsoft SharePoint 的云托管版本 |\n| Microsoft Exchange\
  \ Online | 连接到 Microsoft Exchange 的云托管版本 |\n| Dynamics 365 Online | 连接到 Microsoft\
  \ Dynamics 365（MS CRM 和 ERP 解决方案）的云托管版本 |\n\n### Microsoft Azure\n\nAzure 是微软云。Power\
  \ Query 当前可以连接、并从中预览和加载数据的 Azure 数据源列在表 4-2 中。\n\n表 4-2\n\nAzure 源\n\n| 源 | 说明 |\n\
  | --- | --- |\n| Microsoft Azure SQL Database | 允许你连接到基于云的 Microsoft SQL Server\
  \ 数据库，并从你有权访问的所有数据表和视图中导入记录 |\n| Microsoft Azure SQL 数据仓库（现已更名为 Azure Synapse Analytics）\
  \ | 允许你连接到微软基于云的、可弹性伸缩的企业级数据仓库 |\n| Microsoft Azure Blob Storage | 从基于云的非结构化数据存储中读取数据\
  \ |\n| Microsoft Azure Table Storage | 从 Microsoft Azure 表中读取数据 |\n| Microsoft Azure\
  \ Data Lake Storage（Gen1 和 Gen2） | 允许你连接到微软的原始数据云存储 |\n| Microsoft Azure HDInsight\
  \ | 在 Microsoft Azure 环境中读取基于云的 Hadoop 文件 |\n\n显然，随着 Azure 产品的扩展，微软可能会在 Excel 的\
  \ Power Query 中增加更多的 Azure 连接选项。\n\n**注意：** Power Query 也可以访问本地 SharePoint 和 MS\
  \ Exchange 数据。但是，本书将不探讨这些连接。\n\n\n\n## 网页\n\n作为第一个极为简单的示例，让我们从网页中抓取一些数据。Power Query\
  \ 让这一过程变得异常简单，因为它能够读取任何网页中的数据表格。由于我希望专注于方法而非数据本身，我将使用一个与本书其他部分所使用的示例数据无关的网页。这里仅将网页作为使用\
  \ Power Query 从网页加载数据过程的简单介绍。\n\n假设你已经启动了 Excel\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig1_HTML.jpg](img/497001_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1 `从 Web` 对话框\n\n1. 在 `数据` 功能区中，点击 `从 Web`。\n2. 输入以下 URL（这是微软关于 Power Query\
  \ 的帮助页面，其中包含几个数据表格）：`http://office.microsoft.com/en-gb/excel-help/guide-to-the-power-query-ribbon-HA103993930.aspx`。当然，我希望在你阅读本书时它依然能访问。当然，如果你有自己的\
  \ URL 想要尝试，请随意！对话框将类似于图 4-1。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig2_HTML.jpg](img/497001_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2 `导航器` 对话框预览网页上表格的内容\n\n3. 点击 `确定`。`导航器` 对话框将出现。在 Power Query 连接到网页的几秒钟后，网页中可用数据表格的列表将会显示出来。\n\
  4. 点击 `导航器` 对话框左侧的某个表格名称。该表格的内容将显示在 `导航器` 对话框的右侧，展示所选表格中的数据样貌，如图 4-2 所示。\n5. 在 `导航器`\
  \ 对话框中选择复选框（如图 4-2 中表 4 左侧所示）。\n6. 点击窗口底部的 `加载`。数据将被加载到一个新的工作表中。\n\n**提示**  \n另一种访问网页的方式是点击\
  \ `数据` 功能区中 `获取数据` 按钮底部的小三角形，然后从弹出的菜单中选择 `来自其他源 ➤ 从 Web`。\n\n这个简单的示例展示了如何从网页中选择数据表格并将其加载到\
  \ Excel 中。\n\n### 高级 Web 选项\n\n在前一个示例的第 3 步中，你本可以选择 `高级` 按钮。如果你这样做了，`从 Web` 对话框将会展开，允许你通过添加\
  \ URL 部分来构建复杂的 URL。你可以在图 4-3 中看到这样的示例。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig3_HTML.jpg](img/497001_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3 `从 Web` 对话框中的 `高级` 选项\n\n点击 `添加部分` 按钮可以定义多个 URL 部分。\n\n如果需要，你还可以指定提交 URL\
  \ 时将使用的 HTTP 请求头部参数。某些网页可能会要求这些参数。对这些内容的讨论超出了本书的范围。\n\n### 查看源网页\n\n在 `导航器` 中只看到网页中的表格，而看不到网页本身，可能会让人感到有些不适应。毕竟，Web\
  \ 本质上是一种视觉媒体。\n\n因此，Power Query 为 `导航器` 添加了一个仅适用于网页的有用功能。那就是可以在 `导航器` 中查看网页本身——就像它在网页浏览器中显示的那样。要尝试这个功能：\n\
  \n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig4_HTML.jpg](img/497001_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4 在 `从 Web` 对话框中查看源网页\n\n1. 按照之前描述的步骤 1 到 3 操作。\n2. 点击 `导航器` 右侧的 `网页视图`。你应该会看到类似图\
  \ 4-4 所示的页面。\n\n现在你可以向下滚动页面——并通过点击对话框右侧的 `表格视图` 切换回仅查看页面中表格数据的模式。\n\n## Salesforce\n\
  \nSalesforce 是软件即服务（SaaS）领域的先驱之一——如今毫无疑问也是领导者之一。因此，Power Query 允许你连接到 Salesforce\
  \ 并将你有权限使用 Salesforce 账户查看的任何数据加载到 Excel 中，这几乎是必然的。\n\n事实上，Salesforce 是一项如此广泛且完整的服务，以至于你有两种可能的方法来访问你的数据：\n\
  \n- `对象`\n- `报告`\n\n简而言之，Salesforce 对象是底层的数据结构（你可以将其视为各种表），其中包含你想要访问的信息。而 Salesforce\
  \ 报表则是从数据表中整理出来、以更易访问的输出形式呈现的数据。\n\n**提示**  \n如果你没有企业 Salesforce 账户，但仍想了解如何使用 Power\
  \ Query 连接到 Salesforce 数据，你可以随时建立一个免费的 30 天试用账户。其 URL 是 `www.salesforce.com/form/signup/freetrial-sales.jsp`。\n\
  \n\n\n### 从 Salesforce 对象加载数据\n\n假设您拥有一个有效的 Salesforce 帐户，以下是将数据从 Salesforce 对象加载到\
  \ Excel 的方法：\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig5_HTML.jpg](img/497001_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n`Salesforce 对象`对话框\n\n1.  打开一个新的 Excel 应用程序。\n2.  在 Excel 的`数据`功能区中，单击`获取数据`按钮。\n\
  3.  点击`来自在线服务` ➤ `来自 Salesforce 对象`。系统将显示`Salesforce 对象`对话框。它应该看起来像图 4-5 所示。\n\n\
  ![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig6_HTML.jpg](img/497001_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n`访问 Salesforce` 登录对话框\n\n1.  选择`生产`按钮并点击`确定`。系统将显示`访问 Salesforce` 登录对话框。它应该看起来像图\
  \ 4-6 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig7_HTML.jpg](img/497001_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\nSalesforce 登录对话框\n\n1.  除非您已登录，否则请点击`登录`。系统将显示 Salesforce 登录对话框。\n2.  输入您的\
  \ Salesforce 用户名和密码。对话框应类似于图 4-7 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig8_HTML.jpg](img/497001_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n`Salesforce 验证您的身份`对话框\n\n1.  如果这是您第一次从`Power Query`连接到 Salesforce（或者您已要求\
  \ Salesforce 在每次登录时请求确认），系统将要求您验证身份。系统将显示`Salesforce 验证您的身份`对话框，如图 4-8 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig9_HTML.jpg](img/497001_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n`Salesforce 允许访问`对话框\n\n1.  点击`验证`。Salesforce 将向您用于登录 Salesforce 的电子邮件帐户发送一个验证码。\n\
  2.  在`验证码`字段中输入该代码，然后点击`确定`。您将看到`允许访问`对话框，如图 4-9 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig10_HTML.jpg](img/497001_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n在`导航器`中查看的 Salesforce 对象\n\n1.  点击`允许`。您将返回到`访问 Salesforce` 对话框，但此时您已登录。\n\
  2.  点击`连接`。系统将显示`导航器`，其中列出了您有权访问的 Salesforce 对象。您可以在图 4-10 中看到一个示例。\n3.  选择您希望将其数据加载到\
  \ Excel 中的对象，然后点击`加载`。数据将被加载到 Excel 中，以便您根据 Salesforce 数据创建报告。\n\n**提示**\n为避免在每次使用\
  \ Salesforce 数据创建新的 Excel 报告套件时都需要向 Salesforce 确认您的身份，您可以在 Salesforce 登录对话框中勾选“记住我”，并在`Salesforce\
  \ 验证您的身份`对话框中勾选“不再询问”。\n\nSalesforce 对象包含大量数据。然而，从`Power Query`的角度来看，这类似于访问数据库结构。这意味着您必须对底层数据的存储方式有一定的了解。如果您想了解\
  \ Salesforce 数据的结构化方式，我建议您从当前位于 [`https://trailhead.salesforce.com/en/modules/data_modeling/units/objects_intro`](https://trailhead.salesforce.com/en/modules/data_modeling/units/objects_intro)\
  \ 的 Salesforce 文档开始。\n\n### Salesforce 报告\n\n如果您发现 Salesforce 中的数据量让您不知所措，您可以直接访问标准\
  \ Salesforce 报告背后的数据。这将避免您需要了解底层数据结构。缺点是您不易扩展这些数据集。\n\n要访问 Salesforce 报告数据，只需按照上一节中概述的步骤操作即可。但是，在步骤\
  \ 3 中，选择`Salesforce 报告`而不是`Salesforce 对象`。在这种情况下，`导航器`对话框将类似于图 4-11 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig11_HTML.jpg](img/497001_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n显示`Salesforce 报告`数据的`导航器`对话框\n\n在这里，您可以选择并加载来自 Salesforce 的、您希望用于进一步分析的报告数据。\n\
  \n## Microsoft Dynamics 365\n\n另一个包含大量宝贵企业数据的在线服务是 Microsoft Dynamics 365。正如您所料，Excel\
  \ 中的`Power Query`可以轻松连接到 Microsoft 在线源，例如 Dynamics。如果您所在组织使用此特定平台，操作方法如下：\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig12_HTML.jpg](img/497001_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n`Dynamics 365 (在线)`对话框\n\n1.  打开一个新的 Excel 应用程序。\n2.  在 Excel 的`数据`功能区中，单击`获取数据`按钮。\n\
  3.  点击`来自在线服务` ➤ `来自 Dynamics 365 (在线)`。\n4.  点击`连接`。系统将显示`Dynamics 365 (在线)`对话框。\n\
  5.  输入您用于连接 Dynamics 365 的 URL，并添加 `/api/data/v8.1`（至少在本节付印时是如此）。它可能看起来像图 4-12 所示。但请注意，此\
  \ URL 将根据您在世界上的位置而变化。\n6.  点击`确定`。系统将显示`OData 源`对话框。这是因为`Power Query`使用`OData`连接到\
  \ Dynamics 365 Online。\n7.  选择`组织帐户`作为安全访问方法。\n8.  点击`登录`以登录您的 Dynamics 365 帐户，并遵循\
  \ Microsoft 登录流程。\n9.  点击`连接`。系统将显示`导航器`对话框，其中列出了您有权连接的所有 Dynamics 对象。\n\n**注意**\n\
  在步骤 6 中，您看到 MS Dynamics 365 连接实际上是一个`OData`连接。`OData`将在下一章中更详细地解释。\n\nDynamics 365\
  \ 表数量巨大——具体数量将取决于您的组织所订阅的服务。然而，实际上您是在访问一个数据库结构。这意味着您必须对底层数据的存储方式有一定的了解。如果您想了解 Dynamics\
  \ 365 表，我建议您从位于 [`https://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/data-entities/data-entities`](https://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/data-entities/data-entities)\
  \ 的 Microsoft 在线帮助开始。\n\n\n\n## Azure SQL 数据库\n\nSQL Server 不仅仅作为本地数据库存在。它也可以作为“平台即服务”（也称\
  \ PaaS）使用。简而言之，这使您能够将按需付费模式应用于数据库需求，您可以在几分钟内在云中启动一个数据库服务器，然后根据需求进行扩展，而无需购买硬件和软件并对其进行维护。\n\
  \n连接到微软的 PaaS 产品（称为 Azure SQL 数据库）非常简单。如果您有公司 Azure SQL 数据库的详细信息，可以使用它进行连接。如果没有，但仍想尝试将\
  \ Power Query 连接到 Azure SQL 数据库，您可以随时从 Microsoft 申请免费试用账户，并在几分钟内设置一个 Azure SQL 数据库。如果您选择此路径，可以在以下\
  \ URL 找到如何操作（包括加载您稍后将在本节中连接的示例数据）的说明：[`https://docs.microsoft.com/en-gb/azure/sql-database/sql-database-get-started-portal`](https://docs.microsoft.com/en-gb/azure/sql-database/sql-database-get-started-portal)。\n\
  \n**提示**  \n当您创建自己的 Azure SQL 数据库以测试与 Power Query 的连接时，请务必将源定义为 `Sample`。这将确保 MS\
  \ 示例数据加载到您的测试数据库中。\n\n要使用 Power Query 从 Excel 连接到 Azure SQL 数据库：\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig13_HTML.jpg](img/497001_1_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-13** Azure SQL 数据库连接的 SQL Server 数据库对话框\n\n1.  打开一个新的 Excel 应用程序。\n2.  在\
  \ Excel 的“数据”功能区中，单击“获取数据”➤“来自 Azure”➤“来自 Azure SQL 数据库”。将出现 SQL Server 数据库对话框（毕竟，Azure\
  \ SQL 数据库是 SQL Server 数据库，但运行在云中）。\n3.  输入您从 Microsoft Azure 管理门户获得的 Azure SQL 数据库服务器名称（或由公司\
  \ DBA 提供给您的名称）。SQL Server 数据库对话框将如图 4-13 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig14_HTML.jpg](img/497001_1_En_4_Fig14_HTML.jpg)\n\
  \n**图 4-14** Azure SQL 数据库连接的 SQL Server 凭据对话框\n\n1.  单击“确定”。将出现凭据对话框。\n2.  单击左侧的“数据库”，然后输入有效的用户名和密码。凭据对话框将如图\
  \ 4-14 所示。\n3.  单击“连接”。将出现导航器对话框，显示您在 Azure SQL Server 数据库中有权限访问的数据库。\n\n**注意**\
  \  \n如果您正在设置 Azure SQL 数据库，请确保包含防火墙规则，以允许从运行 Excel 的计算机连接到 Azure SQL 数据库。\n\n如果您按照第\
  \ 3 章中的步骤连接到了本地 SQL Server 数据库，那么您可能会觉得此处使用的方法几乎相同。幸运的是，Power Query 开发团队努力使这两个过程尽可能相似。这延伸到：\n\
  \n*   确保数据源设置由 Power Query 存储，并且可以像本地数据库连接一样进行更新。\n\n## Azure SQL 数据仓库 (Azure Synapse\
  \ Analytics)\n\nAzure 有许多可用的数据存储平台。其中特别适合 Power Query 的是 Azure SQL 数据仓库（现在称为 Azure\
  \ Synapse Analytics）。这是一个托管在 Azure 中的 MPP（大规模并行处理）数据仓库。\n\n我再次假设您手头有一个公司 Azure Synapse\
  \ Analytics 实例，并且拥有对 Azure Synapse Analytics 的相关访问权限。此处，您也需要正确设置防火墙规则（尽管如果您之前为例如\
  \ Azure SQL 数据库设置了防火墙规则，这可能不是严格必需的）。我想您可能需要公司 IT 支持的帮助，以确保连接能够成功建立。\n\n假设您可以访问 Azure\
  \ Synapse Analytics 实例：\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig15_HTML.jpg](img/497001_1_En_4_Fig15_HTML.jpg)\n\
  \n**图 4-15** Azure Synapse Analytics 连接的 SQL Server 数据库对话框\n\n1.  打开一个新的 Excel 应用程序。\n\
  2.  在“数据”功能区中，单击“获取数据”➤“来自 Azure”➤“来自 Azure SQL 数据仓库”。\n3.  输入您从 Microsoft Azure\
  \ 管理门户获得的 Azure SQL 数据仓库服务器名称（或由公司 IT 提供给您的名称）。SQL Server 数据库对话框将如图 4-15 所示。这是因为\
  \ Azure Synapse Analytics 本质上是一个 SQL Server 数据库。\n4.  选择“导入”按钮，然后单击“确定”。将出现凭据对话框。\n\
  5.  单击左侧的“数据库”，然后输入有效的用户名和密码。\n6.  单击“连接”。将出现导航器对话框，显示您在 Azure SQL Server 数据库中有权限访问的数据库。\n\
  7.  选择所需的表，然后单击“加载”或“编辑”返回 Excel。如果要同时导入多个表，请记住单击“选择多项”。\n\n**注意**  \n不要因为指定服务器和数据库的对话框标题显示“SQL\
  \ Server 数据库”而感到困惑。这能正确地将您连接到 Azure SQL 数据仓库。\n\n\n\n## 连接 Azure 虚拟机上的 SQL Server\n\
  \n如今，越来越多的数据库由云服务提供商托管在企业环境之外。借助亚马逊（提供 SQL Server 的 RDS 服务）或微软（在 Azure 中提供用于 SQL\
  \ Server 的虚拟机）等提供商，你可以将数据库部署在企业外部，并几乎从世界任何地方访问它们。\n\n因此，为了扩展 Power Query 可用的数据源范围，我们将简要介绍如何连接到\
  \ Azure 虚拟机上的 SQL Server。诚然，连接 Azure 虚拟机上的 SQL Server 与连接企业环境中的 SQL Server 几乎相同——正如你在第\
  \ 3 章中所见。但仍有必要稍作说明，简要介绍如何使用 Power Query 从云端的 SQL Server 实例将数据返回到 Excel。\n\n再次说明，如果你的企业环境中没有托管在\
  \ Azure 虚拟机上的 SQL Server 实例，你始终可以使用 Azure 试用账户来测试此过程。然而，我无法在此解释如何在虚拟机上设置 SQL Server\
  \ 实例，因为这是一个庞大且独立的主题，超出了本书范围。不过，如果你需要，有许多资源可以解释如何执行此操作。\n\n连接到 Azure 中虚拟机上的 SQL Server：\n\
  \n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig16_HTML.jpg](img/497001_1_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16\n\nAzure 虚拟机的 Microsoft SQL Server 数据库对话框\n\n1. 打开一个新的 Excel 应用程序。\n\n\
  2. 在 Excel 功能区中，点击`获取数据`按钮底部的小三角形，然后点击 `SQL Server`。将出现 SQL Server 数据库对话框。\n\n3.\
  \ 在`服务器`文本框中输入描述服务器的完整字符串。该字符串要么由企业的数据库管理员提供，如果你使用自己的 Azure 账户，则可以在 Azure 管理门户中找到它。\n\
  \n4. 输入你有权访问的数据库对应的数据库名称。对话框将如图 4-16 所示。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig17_HTML.jpg](img/497001_1_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17\n\n连接到虚拟机时的 SQL Server 数据库对话框\n\n5. 点击`确定`。将出现`访问 SQL Server 数据库`对话框。选择`数据库`作为安全模式，并输入用户名和密码，如图\
  \ 4-17 所示。如果你使用自己的 Azure 账户，这些可以是你在设置虚拟机时指定的用户名和密码。\n\n6. 如果出现加密支持对话框，点击`确定`。将出现`导航器`对话框，列出你在虚拟机上托管的\
  \ SQL Server 中有权限查看的所有表。\n\n如你所见，该过程与你在第 3 章中连接 SQL Server 时遵循的过程几乎相同。尽管如此，我有几点需要提请你注意：\n\
  \n-   使用 Azure 虚拟机的多部分名称作为服务器名称。\n-   与连接本地 SQL Server 实例时一样，如果需要，你可以选择数据库。\n- \
  \  如果虚拟机指定了公共 IP 地址，你可以使用该 IP 地址作为数据库名称。\n-   安全性是一个庞大而独立的问题。在企业环境中，你*可能*能够使用 Windows\
  \ 安全进行连接。对于测试虚拟机，你几乎肯定必须使用数据库安全。\n-   与 Azure 中的常规情况一样，必须正确设置防火墙。\n\n### Azure Blob\
  \ 存储\n\n本章中我想向你介绍的最后一个 Azure 数据源是 Azure Blob 存储。就 Excel 而言，你基本上可以将其视为云中的文件共享。因此，如果你需要访问存储为文件的数据，可以通过\
  \ Azure Blob 存储连接到这些文件。\n\n同样，你需要企业级 Azure Blob 存储的访问权限或一个 Azure 试用账户。无论哪种情况，你都需要将文件夹\
  \ `C:\\PowerBiDesktopSamples\\MultipleIdenticalFiles` 中的两个示例文件复制到你的 Azure Blob 存储容器中。下载示例文件的说明在附录\
  \ A 中。\n\n一旦源数据在 Azure Blob 存储中可用，你可以执行以下步骤：\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig18_HTML.jpg](img/497001_1_En_4_Fig18_HTML.jpg)\n\
  \n图 4-18\n\n连接到 Azure Blob 存储\n\n1. 打开一个新的 Excel 应用程序。\n\n2. 在“数据”功能区中，点击 `获取数据`\
  \ ➤ `来自 Azure` ➤ `来自 Azure Blob 存储`。\n\n3. 输入你用来连接 Azure Blob 存储的账户名称。Azure Blob\
  \ 存储对话框将如图 4-18 所示。如果你使用的是企业级 Azure Blob 存储账户，系统管理员将提供此名称。在测试场景中，你可以通过打开 Azure 管理门户中的“存储账户”边栏选项卡，复制“Blob\
  \ 服务终结点”来找到它。\n\n![../images/497001_1_En_4_Chapter/497001_1_En_4_Fig19_HTML.jpg](img/497001_1_En_4_Fig19_HTML.jpg)\n\
  \n图 4-19\n\nAzure Blob 存储账户密钥\n\n4. 点击`确定`。将出现`Azure Blob 存储账户密钥`对话框。\n\n5. 在 Azure\
  \ 管理门户中，复制一个账户密钥。可以通过点击“存储账户”边栏选项卡，然后点击`访问密钥`在 Azure 管理门户中找到这些密钥。如果你从系统管理员处收到了账户密钥，则改用该密钥。你可以在此对话框中看到图\
  \ 4-19。\n\n6. 将账户密钥粘贴到`Azure Blob 存储账户密钥`对话框中。\n\n7. 点击`连接`。将出现“导航器”，显示所选容器中的文件列表。\n\
  \n8. 点击`加载`。存储在 Azure 中的文件列表将出现在 Power Query 中。\n\n**注意**\n\n需要特别注意的是，至少目前，从 Azure\
  \ 返回的是一个可用文件列表。第 9 章介绍如何选择并从部分或全部可用文件中将数据加载到 Excel，以便将其用作分析的基础。\n\n### Azure 安全性\n\
  \n所有云服务提供商都极其重视安全性。如本章所述，你总是需要输入某种形式的安全令牌和/或指定有效的用户名和密码才能连接到基于云的数据。\n\n\n\n## 其他源类型\n\
  \n显然，如果不耗费大量篇幅，就不可能解释如何使用所有潜在的数据源。此外，并非每个人都需要访问每一个存储外部数据的地方。事实上，大多数用户通常只需要从两到三个外部数据源获取数据。\n\
  \n这不可避免地意味着，你将在本书中看不到 Excel 的 `Power Query` 中提供的某些数据源。然而，正如我所提到的，`Power Query` 的基本优势之一是，一旦你学会了如何连接到几个数据源，你就差不多学会了如何使用所有数据源。\n\
  \n因此，本书未涵盖部分数据源，包括：\n\n- `Azure Data Lake`\n- `SharePoint`（本地和在线）\n- `Microsoft\
  \ Exchange`（本地和在线）\n- `Microsoft Dynamics` 在线版\n- `Active Directory`\n- `Hadoop`\n\
  - `Azure HDInsight`\n- `Facebook`\n\n连接到 `SharePoint`、`Exchange`、`Microsoft Dynamics`、`Azure\
  \ HDInsight` 或 `Hadoop` 将不可避免地意味着这些系统已在你组织中使用——并且你拥有必要的访问权限。\n\n如果你在 Excel 中使用 `Power\
  \ Query` 连接到 `Azure HDInsight` 或 `Hadoop`，我更愿意添加一句警告。这些是“大数据”源，顾名思义，它们可能包含海量数据。它们所包含的庞大数据量很容易让\
  \ Excel 不堪重负。因此，我建议你在尝试连接到大数据源*之前*，先阅读接下来几章中关于如何在加载数据之前选择和筛选数据的说明。\n\n## 结论\n\n\
  在本章中，你简要了解了如何检索通过互联网访问的数据。其范围可以从网页上的数据表到庞大的 `Azure Synapse Analytics 数据仓库`。你可能甚至需要访问存储在\
  \ `Azure Blob 存储` 或 `Azure Data Lake` 中的数据。或者，你可能需要基于你的 `Salesforce` 或 `MS Dynamics\
  \ 365` 数据创建报告。无论如何，`Power Query` 都可以连接并访问这些服务和存储库中可用的数据。\n\n鉴于在线源的数量众多，本章仅能浅尝辄止地触及这些潜在数据存储库的范围。然而，由于\
  \ `Power Query` 严格标准化了数据访问方式，你应该能够将本章中学到的方法应用于许多其他数据服务，无论是当前还是未来的服务。\n\n"
- "# 通用数据源\n\n如果你仔细查看 `获取数据` 选项，会发现目前有 40 个数据源提供了 Power Query 连接器。然而，面对种类繁多的潜在源数据存储库，即使是这些连接器也显得微不足道。那么，当你面对一个不在当前可用列表中的外部数据源时，该怎么办？\n\
  \n一种解决方案是使用通用数据连接器来访问无法直接访问的数据存储。那么，为了结束我们对一些可用源数据的快速浏览，本章将向你介绍：\n\n- `ODBC` 数据\n\
  - `OLE DB` 数据\n- `OData` 源\n\n使用通用数据连接器的唯一难点在于，它们确实是通用的。这意味着它们采用了一种“最小公分母”的方法。这可能导致：\n\
  \n- 你依赖于外部第三方软件的提供者。\n- 对于非技术用户来说，文档稀少或难以理解。\n- 如果遇到任何技术挑战，你只能靠自己。\n\n尽管存在这些注意事项，主要的通用连接器仍然打开了连接和摄取来自海量潜在外部数据源数据的大门。因此，我总是建议尽可能尝试让这些连接正常工作，因为其结果通常比尝试将源数据导出为文本文件或\
  \ CSV 文件后再加载要简单得多，效果也更好。\n\n如果你想练习本章中描述的 `ODBC` 和 `OLE DB` 连接，你需要能够访问已启用这些连接类型的源数据。换句话说，你需要已经安装并运行了\
  \ `ODBC` 或 `OLE DB` 驱动程序。\n\n\n\n## ODBC 数据源\n\n至此，您已在本书中了解到，Excel 可以连接到多种数据源。然而，总会有些外部应用程序，Excel\
  \ 并未为其内置特定的连接器。\n\n这时，一种名为“开放式数据库连接”（ODBC）的通用解决方案便应运而生。ODBC 是一种连接数据源的标准方式，这些数据源大多为数据库或具有类似数据库的结构。简单来说，如果您要连接的应用程序存在相应的\
  \ ODBC 驱动程序，那么您就可以将数据从该程序加载到 Excel 中。\n\n目前已有数百种 ODBC 驱动程序。有些是免费提供的，有些则需要您购买许可。它们覆盖了从大多数个人电脑上常见的应用到一些利基市场的产品，应用范围十分广泛。某些产品的\
  \ ODBC 驱动会随应用程序本身一同安装；另一些则需要您单独下载 ODBC 驱动。有些 ODBC 驱动是免费分发的，而其他的则需要您购买许可证。\n\n尽管\
  \ ODBC 旨在提供一种访问应用程序数据的标准方式，但每个 ODBC 驱动程序之间都略有不同。因此，您可能需要花点时间熟悉您想要连接的那个应用程序所对应的驱动程序的界面特性。\n\
  \n在本节中，我们将使用 FileMaker Pro 作为数据源。这款产品是一个桌面及服务器数据库系统，已经存在相当长的时间。然而，目前还没有特定的 Power\
  \ Query 连接器适用于它。好消息是，FileMaker Pro *确实* 拥有 ODBC 驱动程序。因此，我们将以 FileMaker Pro 为例，说明如何使用\
  \ ODBC 通过 Power Query 连接到 Excel。\n\n我必须补充说明，我并非期望您为了完成这个练习而去安装一个 FileMaker Pro（即使是试用版）及其配套的\
  \ ODBC 驱动程序。我所要解释的是，当存在可用的 ODBC 驱动程序时，您如何使用 ODBC 连接到数据源。所以，如果您愿意，可以自行下载并安装 FileMaker\
  \ Pro 及其 ODBC 驱动，但具体操作方法请参考 FileMaker Pro 的文档。\n\n假设您有一个符合 ODBC 标准的数据源，并且该数据源有可正常工作的\
  \ ODBC 驱动程序，以下是一个使用 ODBC 和 Power Query 将数据加载到 Excel 的示例：\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig1_HTML.jpg](img/497001_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\nODBC 数据源管理器\n\n1. 运行“ODBC 数据源管理器”应用程序。该程序通常位于文件夹 `C:\\ProgramData\\Microsoft\\\
  Windows\\Start Menu\\Programs\\Administrative Tools` 中。如果使用 64 位 Excel，请务必使用 64\
  \ 位版本；如果使用 32 位 Excel，则使用 32 位版本。\n\n2. 单击 `系统 DSN` 选项卡。您将看到如图 5-1 所示的对话框。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig2_HTML.jpg](img/497001_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n已安装的 ODBC 驱动程序列表\n\n1. 单击 `添加`。您将看到计算机上当前所有已安装的 ODBC 驱动程序列表。这看起来应该类似于图\
  \ 5-2 中所示的对话框。\n\n![../images/497001_1_En_5_Chapter/497001_1_En_5_Fig3_HTML.jpg](img/497001_1_En_5_Fig3_HTML.jpg)\n\
