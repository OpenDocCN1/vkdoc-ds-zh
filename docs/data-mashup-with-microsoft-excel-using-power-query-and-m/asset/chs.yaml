  \ Excel 工作表中。除非您将它们定义为“仅限连接”，否则您需要记住——并警告用户——这些不是“经典”查询。\n\n创建参数后，您可以通过单击 `关闭并加载`\
  \ 按钮退出查询编辑器。现在，您的参数可用于塑造数据流过程。\n\n> **提示**\n>\n> 当您想使用参数时，也可以“即时”创建它们（即，直接从使用参数的对话框内部）。但是，我发现事先准备参数是更好的做法——也更实用。这迫使您思考创建参数的原因以及其潜在的使用范围。它还可以避免您在尝试同时做两件不同的事情时出错。\n\
  \n### 修改参数\n\n幸运的是，参数一旦创建并非一成不变。您可以轻松修改：\n\n-   参数的结构\n-   选定的参数元素（当前值）\n\n####\
  \ 修改参数的结构\n\n如果需要修改参数的构造方式，一种方法是执行以下操作：\n\n1.  在查询编辑器的 `主页` 功能区中，单击 `管理参数`。将显示 `参数`\
  \ 对话框，如前面的章节所示。\n\n2.  在对话框的左窗格中，单击要修改的参数。参数定义将显示在右侧。\n\n3.  执行任何所需的修改。\n\n4.  单击\
