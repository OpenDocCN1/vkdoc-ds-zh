  \ `Time.Second(#time(14, 30, 00))` | 从时间中返回秒           |\n| 从分数获取时间 | `Time.From(0.5)`\
  \               | 从天的小数部分返回时间 |\n\n表 12-4 只是 M 语言中可用时间函数的一个子集。如果你想查看完整列表，可以访问微软网站\
