  \n## M 概念\n\n现在，是时候“拆掉自行车的辅助轮”，学习如何独立骑行（即无辅助编程）了。这意味着，首先要熟悉 M 语言的几个结构概念。\n\n这意味着要从使用“入门级”函数修改数据内容，进阶到创建和修改数据结构本身。M\
  \ 语言主要专注于加载和呈现表格数据结构，因此数据表是一种基本的数据结构。然而，它也可以处理其他数据结构——你在前面的章节中已经有所了解。在本章中，我们将探讨三种核心数据结构。总的来说，它们被归类为*结构化*值——与*原始*值（如文本、数字或日期和时间）相对。其中一些包括：\n\
  \n*   列表\n*   记录\n*   表\n\n然而，在深入探讨这些结构化数据元素之前，你需要了解 M 语言的两个基本方面。它们是：\n\n*   数据类型\n\
  *   M 值（也称为变量或标识符）\n\n那么，事不宜迟，让我们开始你的 M 语言之旅吧。\n\n## M 数据类型\n\n如果你要创建自己的列表、记录和表，那么了解\
  \ M 中数据类型的基础知识将会很有帮助。\n\n开始使用 M 语言时，你需要记住，原始数据值必须始终是以下类型之一：\n\n*   数值\n*   文本\n\
  *   日期\n*   时间\n*   日期时间\n*   日期时区\n*   持续时间\n*   逻辑值（如果你更喜欢，也可以称为布尔值）\n*   二进制\n\
  *   空值\n\n还有其他类型，如 `function`、`any` 或 `anynonnull`，但我们不会在本章中介绍它们。\n\n所有数据类型都期望以特定方式输入。实际上，你必须按照表\
  \ 12-6 中所示的方式输入数据，以避免 M 代码中出现错误。\n\n**表 12-6** 数据类型输入\n\n| 数据类型   | 代码片段       \
  \                                    | 注释                                      \
  \ |\n| :------- | :----------------------------------------------- | :-----------------------------------------\
  \ |\n| 数值       | `100` `0.12345` `2.4125E8`                       | 不要使用千位分隔符或货币符号等格式\
  \                     |\n| 文本       | `\"Calidra Power Query Training\"`       \
  \          | 始终用双引号括起来。要输入实际的引号文本，请使用两个双引号     |\n| 日期       | `#date(2020,12,25)`\
  \                              | 日期必须在 `#date()` 函数中按年、月、日的顺序指定         |\n| 时间\
  \       | `#time(15,55,20)`                                | 时间必须在 `#time()` 函数中按时、分、秒的顺序指定\
  \         |\n| 日期时间   | `#datetime(2020,12,25,15,55,20)`                 | 日期时间必须在\
  \ `#datetime()` 函数中按年、月、日、时、分、秒的顺序指定 |\n| 日期时区   | `#datetimezone(2020,12,25,15,55,20,-5,-30)`\
  \      | 日期时区必须在 `#datetimezone()` 函数中按年、月、日、时、分、秒、天偏移、小时偏移的顺序指定 |\n| 持续时间   | `#duration(0,1,0,0)`\
  \                             | 在 `#duration()` 函数内，以逗号分隔天、小时、分钟和秒       |\n| 逻辑值\
  \     | `true`                                           | 小写的 true 或 false    \
  \                   |\n\n## M 值\n\n在更深入地研究实际编码之前，你确实需要了解关于 M 值的几个基础知识：\n\n*   值是表达式的结果。\n\
  *   值也是变量。\n*   值的名称区分大小写。\n*   如果值名称包含空格或受限制字符，则必须用 `#\"\"`（井号后跟双引号）括起来。\n\n这第四点显然引出了一个问题：“什么是受限制的字符？”简单的答案是——“任何非字母数字的字符”。这样就不用记住一长串符号列表了。\n\
  \n**注意：** Power Query 编辑器界面会尽可能通过添加空格来提高步骤（即表达式返回的值）的可读性。因此，这些值在 M 代码中总是以 `#\"Step\
  \ Name\"` 的形式出现。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您的所有注意事项，将给定的英文文本翻译成高质量的中文。\n\n\n###\
  \ 在 M 中定义你自己的变量\n\n由于任何表达式返回的值也都是变量，因此在 M 中定义你自己的变量变得极其简单。你所要做的就是输入一个变量名（如果包含空格或受限字符，则需要带井号并用引号括起来）、一个等号，以及变量定义。\n\
  \n举一个非常简单的例子，请看图 12-9。这个 M 脚本定义了 `List.Numbers()` 函数所需的三个参数（你将在表 12-7 中看到这个函数），然后在函数内部使用了这些变量。\n\
  \n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig9_HTML.jpg](img/497001_1_En_12_Fig9_HTML.jpg)\n\
  \n图 12-9\n\nM 中的用户变量\n\n在定义自己的变量时，只需记住以下几点：\n\n*   它们遵循与 M 中输出值相同的命名约定。\n*   变量可以在定义它的子表达式以及包含该子表达式的任何表达式中被引用。\n\
  *   变量可以是一个简单的值，也可以是一个返回值的计算。\n\n## 编写 M 查询\n\n在实际编写 M 代码之前，你需要知道如何以及在何处编写代码。假设你需要一个环境来练习本章剩余部分的示例：\n\
  \n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig10_HTML.jpg](img/497001_1_En_12_Fig10_HTML.jpg)\n\
  \n图 12-10\n\n准备用高级编辑器编写 M 代码\n\n1.  打开一个空白的新 Excel 文件。\n2.  在“数据”功能区中，单击“获取数据” ➤\
  \ “来自其他源” ➤ “空白查询”。Power Query 编辑器将打开。\n3.  单击“高级编辑器”。将打开一个“高级编辑器”对话框，其中仅包含一个外部的\
  \ `let` 表达式，如图 12-10 所示。\n\n注意\n\n从技术上讲，M 中并不要求使用 `let` 子句。你可以直接输入一个表达式。但是，我更喜欢“按部就班”地编写\
  \ M ——至少一开始是这样。\n\n### 列表\n\n你在第 11 章中创建用于基于查询的参数的下拉列表时，已经接触过 M 列表（这再次说明了查询编辑器中的所有内容都基于\
  \ M）。列表只不过是一系列的值。\n\n列表在 M 中有特定的用途，可以直接用在数据模型中。但是，它们更常被用作更复杂的数据转换过程中的中间步骤。如果你有编程背景，将列表视为类似于数组的东西可能会有所帮助。\n\
  \n#### 手动创建列表\n\n一个列表只是一组用大括号括起来的、以逗号分隔的值——例如\n\n```\n{1,2,3}\n```\n\n一旦将其集成到 M\
  \ 查询的结构中，它可能看起来像图 12-11 中所示的例子。\n\n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig11_HTML.jpg](img/497001_1_En_12_Fig11_HTML.jpg)\n\
  \n图 12-11\n\n高级编辑器中的列表\n\n一旦创建完成——无论是作为查询的中间步骤还是作为查询的最终输出——该列表就可以被任何需要列表作为输入的东西使用。实际上，如果你单击前面示例中的“完成”按钮，Power\
  \ Query 编辑器将会把这部分 M 代码显示为一个可用的列表——与你第 11 章中创建的列表完全一样。因此，你现在可以快速轻松地为参数（例如）创建自定义列表。\n\
  \n关于列表，你需要了解一些技术信息：\n\n*   列表的大小没有限制。\n*   列表可以包含相同类型的数据（例如，所有元素都是数值、日期或文本），或者也可以是不同类型的数据。\n\
  *   列表可以为空——即由一对空大括号组成。\n*   列表可以水平或垂直输入。也就是说，前面显示的列表也可以像下面这样输入：\n\n```\nSource\
  \ = {\n1,\n2,\n\n}\n```\n\n生成列表非常简单；知道何时使用列表才是难点。\n\n#### 使用列表生成序列\n\n列表在 M 中有很多用途，但有一个领域它们特别出色，那就是生成数字、日期或文本的序列。与其逐一繁琐地解释每种方法，不如在表\
  \ 12-7 中汇集一组用于列表生成的 M 代码片段示例。\n\n表 12-7\n\n列表生成\n\n| 代码片段 | 描述 |\n| --- | --- |\n\
  | `{1..100}` | 从 1 到 100（含）的连续数字序列 |\n| `{1..100, 201..400}` | 从 1 到 100，然后从 201\
  \ 到 400 的连续数字序列 |\n| `List.Numbers(0, 100, 5)` | 从 0 开始，以 5 为增量，直至达到 100 |\n| `{\"\
  A\"..\"Z\"}` | 从 A 到 Z 的大写字母 |\n| `List.Dates(#date(2020, 1, 1), 366, #duration(1,\
  \ 0, 0, 0))` | 2020 年的每一天——从 2020 年 1 月 1 日开始，增加 366 天（以天为持续时间表示） |\n| `List.Times(#time(1,\
  \ 0, 0), 24, #duration(0, 1, 0, 0))` | 从凌晨 1 点开始的一天中的每个小时 |\n\n#### 访问列表中的值\n\n\
  如果你进行更高级的 M 编码，你很可能希望在 M 脚本中引用列表中的值。最简单的方法是使用*位置引用*。下面是一段实现此功能的简短 M 代码：\n\n```\n\
  let\nMyList = {\"George\",\"Bill\",\"George W.\", \"Barack\", \"Donald\"},\nsource\
  \ = MyList{3}\nin\nsource\n```\n\n这段代码片段的输出是列表中的*第四个*元素——这说明了 M 中的列表是*从零开始*的。也就是说，列表中的第一个元素是元素\
  \ 0。\n\n#### 列表函数\n\nM 中有几十个可用的列表函数。数量太多，无法在此一一详述。因此，为了让您了解一些可以操作列表的可能方法，请查看表 12-8。所有这些函数都使用了您之前看到的那个非常简单的列表。\n\
  \n表 12-8\n\n列表函数\n\n| 输出 | 代码片段 | 描述 |\n| --- | --- | --- |\n| 第一个值 | `List.First(MyList)`\
  \ | 返回列表中的第一个元素 |\n| 最后一个值 | `List.Last(MyList)` | 返回列表中的最后一个元素 |\n| 排序列表值 | `List.Sort(MyList)`\
  \ | 对列表中的值进行排序 |\n| 提取范围 | `List.Range(MyList, 4)` | 从列表中提取一个值范围 |\n| 返回值 | `List.Select(MyList\
  \ , each _ =\"Adam\")` | 返回列表中符合条件的所有元素 |\n| 生成列表 | `List.Generate()` | 创建一个连续值的列表\
  \ |\n| 聚合值 | `List.Sum(MyList)` | 对列表中的数值进行聚合 |\n| 替换值 | `List.ReplaceMatchingItems(MyList,\
  \ {\"Joe\", \"Fred\"})` | 替换列表中的一组值 |\n| 转换为列表 | `Table.Column(MyList)` | 将表的一列作为列表返回\
  \ |\n\n表 12-8 只是 M 中可用列表函数的一小部分。如果你想查看所有函数的完整列表，可以在微软网站上找到，网址是 [`https://docs.microsoft.com/en-us/powerquery-m/list-functions`](https://docs.microsoft.com/en-us/powerquery-m/list-functions)。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成地道的中文。\n\n\n### 记录\n\n如果说列表可以被视作\
  \ M 代码中可用的数据列，那么*记录*就是数据行。当您在 M 中创建更复杂的数据转换例程时，您很可能会发现自己需要定义记录。\n\n以下是一个在 M 中创建的示例记录，其形式最为简单：\n\
  \n```\nlet\nSource = [Surname = \"Aspin\", FirstName = \"Adam\"]\nin\nSource\n```\n\
  \n如果您需要访问记录中某个元素的数据，可以将记录变量名称与字段名称一起放在方括号中，如下所示：\n\n```\nlet\nSource = [Surname\
  \ = \"Aspin\", FirstName = \"Adam\"],\nOutput = Source[Surname]\nin\nOutput\n```\n\
  \n有一些记录函数可能对您有用。这些函数在表 12-9 中进行了概述。\n\n**表 12-9** 记录函数\n\n| 输出 | 代码片段 | 描述 |\n|\
  \ --- | --- | --- |\n| 添加字段 | `Record.AddField()` | 向记录添加一个字段 |\n| 移除字段 | `Record.RemoveFields()`\
  \ | 从记录中移除一个字段 |\n| 重命名字段 | `Record.RenameFields()` | 重命名记录中的一个字段 |\n| 输出字段 | `Record.Field()`\
  \ | 返回记录中指定字段的值 |\n| 计数 | `Record.FieldCount()` | 返回记录中的字段数量 |\n\n表 12-9 只是 M 中可用的记录函数的一个子集。如果您想查看完整列表，可以在微软网站上找到：[`https://docs.microsoft.com/en-us/powerquery-m/record-functions`](https://docs.microsoft.com/en-us/powerquery-m/record-functions)。\n\
  \n### 表\n\n您可能在 M 代码中使用的最后一种结构化数据类型是*表*类型。正如您对一种用于加载、清理和塑形表格数据的语言所期望的那样，表数据类型是 M\
  \ 的基础。\n\n如果您决定在 M 中手动创建自己的表，那么您需要至少包含以下结构元素：\n\n*   `#table()` 函数\n*   一组列/字段标题，其中每个字段名称用双引号括起来，字段名称集合用大括号括起来\n\
  *   各个数据行，每行用大括号括起来并以逗号分隔，行的集合也用大括号括起来\n\n一个非常简单的硬编码表示例可能如下所示：\n\n```\n#table(\n\
  {\"Surname\", \"FirstName\"},\n{\n{\"Johnson\",\"Vladimir\"},\n{\"Putin\",\"Emmanuel\"\
  },\n{\"Macron\",\"Angela\"},\n{\"Merkel\",\"Boris\"}\n}\n)\n```\n\n然而，这种方法的一个弱点是字段没有类型定义。因此，一种更健壮的方法是将表扩展成这样：\n\
  \n```\n#table(\ntype table\n[\n#\"Surname\" = text,\n#\"FirstName\" = text\n],\n\
  {\n{\"Johnson\",\"Vladimir\"},\n{\"Putin\",\"Emmanuel\"},\n{\"Macron\",\"Angela\"\
  },\n{\"Merkel\",\"Boris\"}\n}\n)\n```\n\n注意：用于定义所需数据类型的数据类型关键字已在本章前面概述。\n\nM 中有许多可用的表函数。我在表\
  \ 12-10 中概述了一些更有用的函数。\n\n**表 12-10** 表函数\n\n| 输出 | 代码片段 | 描述 |\n| --- | --- | ---\
  \ |\n| 合并表 | `Table.Combine()` | 合并结构相似或不同的表 |\n| 记录数 | `Table.RowCount()` | 返回表中的记录数\
  \ |\n| 第一条记录 | `Table.First()` | 返回表中的第一条记录 |\n| 最后一条记录 | `Table.Last()` | 返回表中的最后一条记录\
  \ |\n| 查找行 | `Table.FindText()` | 返回表中包含所需文本的行 |\n| 插入行 | `Table.InsertRows()` |\
  \ 在表中插入行 |\n| 输出行 | `Table.Range()` | 输出选定的行 |\n| 删除行 | `Table.DeleteRows()` | 删除表中的行\
  \ |\n| 选择列 | `Table.SelectColumns()` | 输出选定的列 |\n\n表 12-10 只是 M 中可用表函数的一个微小子集。如果您想查看完整列表，可以在微软网站上找到：[`https://docs.microsoft.com/en-us/powerquery-m/table-functions`](https://docs.microsoft.com/en-us/powerquery-m/table-functions)。\n\
  \n### 其他函数领域\n\n如前所述，M 是一个庞大的主题，可以写成一本（非常厚的）书。我们已经快速概述了一些核心概念和函数，但如果您想精通 M，还有很多东西需要学习。如果您真的有兴趣了解更多，我建议您搜索\
  \ Microsoft 文档中有关表 12-11 中列出的元素，以进一步加深您的知识。\n\n**表 12-11** 其他函数领域\n\n| 函数领域 | 描述\
  \ |\n| --- | --- |\n| 数据访问函数 | 访问数据并返回表值 |\n| 二进制函数 | 访问二进制数据 |\n| 组合器函数 | 被其他库函数用于合并值以逐行应用逻辑\
  \ |\n| DateTime 函数 | 应用于日期时间数据的函数 |\n| DateTimeZone 函数 | 应用于带有时区信息的日期时间数据的函数 |\n\
  | 表达式函数 | 用于表达式的 M 代码 |\n| 行函数 | 将数据转换为值列表 |\n| 替换器 | 被库中的其他函数用于替换结构中的给定值 |\n| 分割器\
  \ | 将值分割成子元素 |\n| 类型 | 返回 M 类型 |\n| Uri | 处理 URL 和 URI |\n| 值 | 处理 M 值 |\n\n###\
  \ M 中的自定义函数\n\nM 还允许您编写自定义函数，这些函数可以重复执行高度特定的任务。\n\n作为一个非常简单的自定义函数示例，请尝试将以下代码片段添加到新的空白查询中：\n\
  \n```\nlet DiscountAnalysis =\n(Discount as number) =>\nif Discount < 10 then \"\
  Poor\" else \"Excellent\"\nin DiscountAnalysis\n```\n\n当您关闭高级编辑器时，您将看到此查询已被识别为 M\
  \ 函数，并相应地显示在查询列表中。您可以在图 12-12 中看到这一点（我将其重命名为“DiscountAnalysis”）。\n\n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig12_HTML.jpg](img/497001_1_En_12_Fig12_HTML.jpg)\n\
  \n**图 12-12** M 中的用户定义函数\n\n您现在可以通过输入一个值作为折扣并单击“调用”按钮来随时以交互方式调用该函数。您也可以在其他 M 函数内部使用此函数。实际上，这很可能正是您首先创建自定义函数的原因。\n\
  \n如果您想查看更高级的函数，请看以下代码片段，该片段会补齐日期，为日和月添加前导零（如果需要）：\n\n```\nlet\nFormatDate = (InDate\
  \ as date) =>\nlet\nSource = Text.PadStart(Text.From(Date.Month(InDate)),2,\"0\"\
  ) & \"/\" & Text.PadStart(Text.From(Date.Day(InDate)),2,\"0\") & \"/\" &Text.From(Date.Year(InDate))\n\
  in\nSource\nin\nFormatDate\n```\n\n### 向 M 代码添加注释\n\n复杂的 M 代码可能非常密集。因此，当您数周或数月后重新查看时，很可能需要一些方法来记住创建某个流程的原因。\n\
  \n让自己工作更轻松的一个简单方法是向 M 代码中添加注释。您既可以为您自己编写的代码添加注释，也可以为自动生成的查询添加注释。\n\n有两种添加注释的方法。\n\
  \n#### 单行注释\n\n要注释单行（可以在行首或行中间进行），只需添加两个正斜杠——如下所示：\n\n```\n//这是一个注释\n```\n\n从两个斜杠到行尾的所有内容都将被视为注释，不会被\
  \ M 求值。\n\n#### 多行注释\n\n多行注释可以覆盖多行——甚至一行的一部分。它们涵盖所有包含在 `/*` 和 `*/` 之间的文本。\n\n```\n\
  /* 这是一个注释\n跨越多\n行 */\n```\n\n`/*` 和 `*/` 内部的所有内容都将被视为注释，不会被 M 求值。\n\n\n\n## 结语\n\
  \n作为本书的最后一章，本章为如何加载和转换用于 Excel 分析的源数据这一主题画上了句号。在本章中，你学习了 M 语言的基础知识，它是支撑本书此前所有内容的核心。\n\
  \n你首先了解了如何利用 **Power Query 编辑器**界面来辅助编写简短的 M 代码片段。接着，你深入探索了 **M** 语言的基本概念，如表达式、变量和值。最后，你学习了\
  \ **M** 语言中的数据类型，以及列表和表格等支撑复杂数据转换的更复杂的数据类型。这包括学习如何使用**高级编辑器**来编写和调试代码。\n\n在本章及之前的\
  \ 11 章中，你实际上经历了三个阶段：首先，找到数据；然后，将其加载到 **Power Query** 中；最后，对其进行清洗和修改。你可以使用的技术虽简单却功能强大，范围从更改数据类型到合并多个数据表。现在，你的数据已准备就绪，你可以将其添加到\
  \ **Power Pivot** / **Excel** 数据模型或直接添加到 **Excel** 工作表中，并开始使用它来实现真实的业务分析。\n\n希望你喜欢阅读本书，并且它能帮助你掌握使用\
  \ **Power Query** 和 **M** 语言查找、转换外部数据并将其加载到 **Excel** 中的艺术。\n\n\n"
