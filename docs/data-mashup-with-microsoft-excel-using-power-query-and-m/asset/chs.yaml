  \ | 查询 | 标准查询的图标 |\n| ![../images/497001_1_En_11_Chapter/497001_1_En_11_Figb_HTML.jpg](img/497001_1_En_11_Figb_HTML.jpg)\
  \ | 列表 | 列表的图标 |\n| ![../images/497001_1_En_11_Chapter/497001_1_En_11_Figc_HTML.jpg](img/497001_1_En_11_Figc_HTML.jpg)\
  \ | 参数 | 参数的图标 |\n\n## 总结\n\n在本章中，你学习了如何向查询添加参数，以及如何以受控方式与查询进行交互。这使你能够使查询——以及整个\
  \ ETL 过程——更加灵活和交互。\n\n"
- "# 12. M 语言\n\n在 Power Query 中，数据摄取和修改并非仅通过界面驱动。实际上，整个过程都是由一种高度特定的编程语言支撑和驱动的。这种语言被称为“M”，它贯穿于你在过去\
  \ 11 章中所学的一切。\n\n大多数用户——在大多数情况下——很可能根本不需要直接使用 M 语言。这是因为，迄今为止你在本书中学到的 Power Query\
  \ 编辑器界面既全面又极其直观。然而，有时你可能需要：\n\n-   添加一些无法直接通过图形界面访问的额外功能。\n-   添加编程逻辑，例如生成日期或数字序列。\n\
  -   以编程方式创建或操作你自己的列表、记录或表。\n-   创建自己的内置函数，以扩展或增强 M 语言中内置的功能。\n-   使用高级编辑器修改代码。\n\
  -   为你的数据摄取过程添加注释。\n\n在向你介绍这些概念之前，我需要补充几点注意事项：\n\n-   支撑 Power Query 查询的“M”语言并非为胆怯者而设计。这种语言乍看之下可能晦涩难懂。\n\
  -   其文档技术性极强，对于未入门者来说不易理解。\n-   即使对于有经验的程序员来说，学习曲线也可能很陡峭。\n-   “M”语言与许多 Excel 高级用户所熟知的\
  \ VBA 有很大不同。\n-   手动调整某个步骤可能会对精心构建的数据加载和转换过程造成严重破坏。\n\n此外，“M”语言内容非常庞大，足以写成一本完整的书。因此，我特意选择在这里只提供最浅显（希望是有帮助的）的介绍。如需更详细的内容，我建议你查阅微软的官方文档。当前可通过以下网址获取：\n\
  \n-   [`msdn.microsoft.com/en-us/library/mt779182.aspx`](https://msdn.microsoft.com/en-us/library/mt779182.aspx)\n\
  -   [`msdn.microsoft.com/en-us/library/mt807488.aspx`](https://msdn.microsoft.com/en-us/library/mt807488.aspx)\n\
  \n在本章中，我假设读者没有任何深入的编程知识。我会与一些标准编程概念进行对比，以帮助那些有 VBA、C# 或 Java 编程经验的读者。但请放心，本意是为热情的\
  \ Power Query 用户打开新的视野，而不是陷入复杂的技术宇宙。\n\n要最好地理解这一切，可能是基于你现有的知识，并解释你（仅仅通过使用 Power\
  \ Query 图形界面）实际上一直在编写 M 代码。然后，你可以通过学习如何调整现有代码来扩展这些知识，最后你将看到如何独立编写 M 代码。\n\n\n\n\
  ## 什么是 M 语言？\n\n不过，我仍应从几项技术基础入手，解释什么是 Power Query 公式语言（即大家现在所称的 M 语言），以及它能做什么、不能做什么。\n\
  \nM 是一种*函数式*语言。它并非为执行通用编程而设计。实际上，经验丰富的程序员在其他语言中寻找核心的编码结构和技术时，在 M 语言中将一无所获。\n\n冒昧地说，我更喜欢向初学者从以下三个方面将\
  \ M 介绍为一种函数式语言，尽管这可能会冒犯编程纯粹主义者：\n\n-   它存在的目的是执行一个简单的功能：加载和转换数据。\n-   它建立在包含 700\
  \ 多个内置函数的函数库之上，每个函数都旨在执行特定的数据加载和/或转换逻辑。\n-   它表现为一系列函数，每个函数都将一组输入值计算为单个输出值。\n\n\
  为了完成这个简要的介绍，你还需要知道：\n\n-   M 是*区分大小写*的，因此在输入函数关键字和变量名时需要非常小心。\n-   M 是*强类型*的——这意味着你必须尊重所用数据元素的核心类型，并在必要时将它们转换为适当的类型。M\
  \ 不会自动为你完成此操作。\n-   M 建立在一组关键字、运算符和标点符号之上。\n\n我不想在此时过于深入技术细节。尽管如此，我希望这个高级概述能让你为本章后面将要学习的一些方法做好准备。\n\
  \n## M 语言与 Power Query 编辑器\n\n关于 M 语言，好消息是：你已经会写了。我的意思是，你在前 11 章中学习的每个示例都为你编写了一行或多行\
  \ M 代码。实际上，当你使用 Power Query 编辑器时，你生成的每个数据加载和转换步骤都会自动为你创建 M 代码。\n\n这意味着几件（非常积极的）事情：\n\
  \n-   你不必非要从头开始编写 M 代码。通常，你可以使用查询编辑器界面完成大部分工作，然后微调自动生成的代码，添加你需要的最终自定义元素。\n-   你不必学习\
  \ 700 多个函数来交付 M 代码，因为查询编辑器可以为你查找并编写许多合适的指令。\n-   查询编辑器界面与 M 代码的编写方式紧密相连。因此，理解如何使用界面有助于你理解\
  \ M 代码是什么以及它是如何工作的。实际上，许多 Power Query 界面元素与底层的 M 函数之间存在着一一对应的关系。\n\n### 修改步骤的代码\n\
  \n如果你希望深入探究 Power Query 的内部机制，可以通过编辑代码来修改查询中的步骤，这些代码是在每次添加或修改查询步骤时自动创建的。\n\n快速了解可以做什么：\n\
  \n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig1_HTML.jpg](img/497001_1_En_12_Fig1_HTML.jpg)\n\
  \n**图 12-1** 一个已应用步骤的“M”代码\n\n1.  打开一个新的 Excel 文件。\n2.  在“数据”功能区中，选择 获取数据 ➤ 来自文件\
  \ ➤ 来自工作表。\n3.  选择 Excel 文件 `C:\\DataMashupWithExcelSamples\\BrilliantBritishCars.xlsx`。\n\
  4.  选择名为 `BaseData` 的源表。\n5.  点击“转换数据”打开查询编辑器。\n6.  选择 `IsDealer` 列并将其删除。\n7.  点击\
  \ `BaseData` 查询中的“删除列”步骤。你将在公式栏中看到 M 代码。它将类似于图 12-1 所示。\n8.  在公式栏中，编辑 M 代码，将 `IsDealer`\
  \ 替换为 `ReportingYear`。\n9.  按 Enter 键或点击公式栏中的勾选图标（复选标记）以确认你的更改。\n\n该步骤及其后续数据将更新以反映你的更改。\n\
  \n你在步骤 8 中执行的修改实际上意味着你将把 `IsDealer` 列加回来，同时删除 `ReportingYear` 列。你本可以使用界面（通过点击此步骤的“已应用步骤”列表中的齿轮图标）来完成此操作，但关键在于理解这两种方式都是可行的，并且\
  \ Power Query 界面只是在生成和修改 M 代码。因此，如果你愿意，可以直接修改此代码。实际上，直接修改 M 代码通常比执行一系列基于界面的操作更快。\n\
  \n如果你是 Excel 高级用户（许多 Power Query 爱好者都是如此），那么你认为这类似于 Excel 宏开发是可以理解的。确实，在某些方面是类似的：\n\
  \n-   核心代码可以被录制（Excel 的 VBA，Power Query 的 M 语言）。\n-   生成的代码随后可以被修改。\n\n当然，这是一个过于简单的比较。这两种方法可能相似，但这两种语言却大相径庭。然而，如果这能作为一个比喻来鼓励你转向\
  \ M 语言开发，那也未尝不可。\n\n在公式栏中修改查询步骤的 M 代码时，不可避免地会有一系列注意事项。这些包括（但远不止于此）：\n\n-   任何错误不仅会导致该步骤失败，还会导致从当前步骤开始整个数据加载和转换过程失败。\n\
  -   你需要记住 M 是区分大小写的——即使是最细微的大小写错误也可能导致整个流程失败。\n-   必须遵守使用引号定义文字元素（如列名）的规则。\n-  \
  \ M 大量使用圆括号和大括号。需要一些实践和理解底层逻辑，才能完全领会它们在不同上下文中的用法。\n\n幸运的是，如果（或当）错误出现时，M 会提供相当清晰的错误消息。例如，如果你输入了一个错误的字段名，你可能会看到类似于图\
  \ 12-2 所示的消息。\n\n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig2_HTML.jpg](img/497001_1_En_12_Fig2_HTML.jpg)\n\
  \n**图 12-2** 一条“M”错误消息\n\n然而，我不想让你觉得修改 M 代码很困难或很危险。因此，为了扩展前面给出的示例，如果你想扩展代码以删除两列而不仅仅是一列，M\
  \ 代码将如下所示：\n\n```\n= Table.RemoveColumns(#\"Changed Type\",{\"ReportingYear\", \"\
  IsDealer\"})\n```\n\n**注意**：更一般地说，通常最好是查看现有步骤的代码——或者使用示例数据集并行创建“模拟”代码——以了解特定函数的\
  \ M 代码是什么样子的。这将指明如何最好地修改代码。\n\n\n\n#### M 表达式\n\n为了让您更清晰地理解每个 M“步骤”包含什么，图 12-3 展示了一个步骤的核心结构。不过只有\
  \ Power Query 界面才将其称为“步骤”。M 实际上将其称为 _ 表达式 _。因此，从现在开始我将使用这个术语。\n\n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig3_HTML.jpg](img/497001_1_En_12_Fig3_HTML.jpg)\n\
  \n图 12-3：一个 M 表达式\n\n这里有几个基本要点需要您了解：\n\n- 每个 M _ 表达式 _ 由 _ 函数 _ 构成。这些函数可以是任何内置函数（例如此处使用的\
  \ `Table.RemoveColumns`），也可以是你自己定义的函数（本章稍后会解释）。它们也可以是计算或简单的逻辑。\n- 正如您在本书前文所学，数据混合本质上是一系列单独的操作（或者像\
  \ Power Query 界面所称的“步骤”）。这些操作以“链”的形式连接，每个表达式都构建在——并引用——前一个表达式之上。在图 12-3 中，这个特定的表达式引用了位于其之前的\
  \ `#\"Changed Type\"` 表达式的输出。\n- M 表达式可以变得极其复杂，并包含多个函数——颇像复杂的 Excel 公式。由于函数可以嵌套，这可能会导致相当复杂的表达式。\n\
  \n#### 通过添加自定义列编写 M\n\n编写某些类型 M 代码的另一种方法是添加自定义列。尽管在 Power Query 中这些被称为 _ 自定义列 _，但它们的通用叫法还有\
  \ _ 派生列 _ 或 _ 计算列 _。虽然它们可以完成许多工作，但其基本作用是执行以下任意或全部操作（并且此列表远未穷举）：\n\n- 合并（或者如果您喜欢，可称为连接）现有列\n\
  - 向数据表添加计算\n- 提取列的特定部分\n- 根据现有数据向表添加标志\n\n理解这些列的最佳方法可能是观察它们的实际运用。然后，您可以在自己的流程中扩展这些原则。然而，这可以成为学习基本\
  \ M 编码的极佳起点——尽管仅限于 M 中一个狭窄的数据处理领域。\n\n首先，让我们执行列连接，并创建一个名为 `Vehicle` 的列，该列将 `Make`\
  \ 和 `Model` 列连接起来，中间带一个空格。\n\n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig4_HTML.jpg](img/497001_1_En_12_Fig4_HTML.jpg)\n\
  \n图 12-4：“自定义列”对话框\n\n1.  打开一个空白 Excel 文件。\n2.  连接到 `C:\\DataMashupWithExcelSamples\\\
  BrilliantBritishCars.xlsx` 数据源。\n3.  单击 `Transform` 打开 Power Query 编辑器。\n4.  在 `Add\
  \ Column` 功能区中，单击 `Custom Column`。将显示“添加自定义列”对话框。\n5.  单击右侧列列表中的 `Make` 列，然后单击 `Insert`\
  \ 按钮；`=[Make]` 将出现在对话框左侧的“自定义列公式”框中。\n6.  在“自定义列公式”框中 `=[Make]` 之后输入 `& \" \" &`。注意双引号之间的空格。\n\
  7.  单击右侧列列表中的 `Model` 列，然后单击 `Insert` 按钮。\n8.  单击“新列名”框内部，并为此列输入一个名称。我将其命名为 `CarType`。对话框将如图\
  \ 12-4 所示。\n9.  单击 `OK`。新列将添加到数据表的右侧；它包含公式的结果。`Inserted Column` 将出现在“应用的步骤”列表中。公式栏包含以下公式：\n\
  \n```\n= Table.AddColumn(#\"Changed Type\", \"CarType\", each [Make] & \" \" & [Model])\n\
  ```\n\n您始终可以双击某列将其插入到“自定义列公式”框中，如果您更喜欢这样操作的话。要删除某列，只需在“自定义列公式”框中删除列名（包括方括号）即可。\n\
  \n> **提示**  \n> 您必须始终将列名括在方括号中。\n\n您可以看到这行 M 代码遵循了您已经见过的原则。它使用了一个 M 公式（`Table.AddColumn`），该公式引用了前一个表达式（`#\"\
  Changed Type\"`），然后应用了执行表达式要求的代码——在本例中是添加一个包含基本 M 代码的新列。\n\n> **注意**  \n> `each`\
  \ 关键字是 M 的一种约定，表示该列中的每条记录都将应用此公式。\n\n#### 高级编辑器\n\n公式栏仅仅是在 M 中编码的初始步骤。在实践中，您几乎总是会在\
  \ Power Query 高级编辑器中编写 M 代码。这有几个基本原因：\n\n- 高级编辑器会显示组成 M 查询的 _ 所有 _ 表达式。\n- 它使得理解事件（或者如果您喜欢，步骤或表达式）的顺序变得容易得多。\n\
  - 它有一个语法检查器，有助于隔离和识别语法错误。\n\n> **注意**  \n> 遗憾的是，高级编辑器尚不具备内置的 IntelliSense。这意味着您在键入时无法看到\
  \ M 函数弹出提示。\n\n##### 高级编辑器中的表达式\n\n您可以在公式栏中单独看到的 M 表达式并非孤立的。恰恰相反，它们始终是数据加载、清理和转换事件连贯序列的一部分。如果您现在查看之前从\
  \ Excel 文件加载数据表时创建的整个 M 代码块，可能会最好地理解这一点。\n\n要查看 M 代码，您需要打开高级编辑器。\n\n![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig5_HTML.jpg](img/497001_1_En_12_Fig5_HTML.jpg)\n\
  \n图 12-5：高级编辑器中的语法检查\n\n1.  在 `Home` 功能区中，单击 `Advanced Editor` 按钮。高级编辑器窗口将打开，如图\
  \ 12-5 所示。您还可以看到 Power Query 编辑器中的“应用的步骤”列表，以帮助您理解每个步骤实际上就是一个 M 表达式。\n\n此对话框包含您所创建的连接和转换过程的完整结构。它包含以下核心元素：\n\
  \n- 一个表达式序列（即步骤）\n- 一个 `let` 表达式，作为数据转换表达式序列的外部容器\n- 一个 `in` 表达式，返回整个查询的输出\n\n如果您查看图\
  \ 12-5，可以看到关于 `Let…In` 块内部表达式序列的几件重要事情：\n\n- 每个表达式都有名称——您可以在“应用的步骤”列表中看到其名称。\n-\
  \ 每个表达式（第一个除外）都引用另一个表达式（几乎总是前一个表达式）。\n- 除最后一个表达式外，所有表达式都以逗号结束。\n- 一个表达式可以跨越多行代码。除最后一个表达式外，都是在表达式结束时使用最后的逗号。\n\
  - 最后一个表达式成为查询的输出。\n\n尽管这是一个相当简单的 M 查询，但它包含了展示 M 工作原理的所有基本元素。您构建的几乎所有 M 查询都将反映这些核心原则：\n\
  \n- 包含一个 `Let…In` 块\n- 包含一个或多个包含函数的表达式\n\n\n\n#### Let 语句\n\n`let` 语句是 M 语言的核心元素。它的存在允许一组值被逐一求值，每个值都分配给一个变量名。这些变量形成了一个结构化的求值过程序列，随后在`in`语句之后的输出表达式中使用。你可以在很多方面将其视为一个“处理单元”。`let`\
  \ 语句可以嵌套以增加灵活性。\n\n在大多数 `let` 语句中，变量序列会从上到下排序（如图 12-5 和 12-6 所示），其中每个命名的表达式都引用并构建于前一个表达式之上。这是查询编辑器将命名表达式呈现为步骤的方式，通常也是编写易于理解的\
  \ M 脚本最简单的方式。然而，严格来说，并不需要像这样对表达式进行排序，因为表达式的顺序可以是任意的。\n\n#### 在高级编辑器中修改 M\n\n与所有\
  \ Power Query 相关的事物一样，通过一个示例最能理解高级编辑器。你在第 3 章中已经了解了如何创建和修改与数据源的连接。你也可以直接在 M 语言中修改连接。这需要你了解并理解正在使用的数据库。\n\
  \n1.  添加一个连接到 SQL Server 数据库的新查询。我使用的是我电脑上的 SQL 实例和数据库。\n2.  在左侧的查询列表中选择此查询。\n3.\
  \  在“主页”功能区中，单击“高级编辑器”按钮。将出现“高级编辑器”对话框，如图 12-6 所示。\n    \n    `![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig6_HTML.jpg](img/497001_1_En_12_Fig6_HTML.jpg)`\n\
  \    \n    图 12-6\n    用于更改数据库连接的高级编辑器对话框\n    \n4.  更改以下任意元素：\n    - `Source` 行中的服务器名称（当前为\
  \ `\"ADAM03\\SQL2017\"`）。\n    - 第二行中的数据库名称（当前为 `Name=\"PrestigeCars\"`）。\n    -\
  \ 第三行中的架构名称（当前为 `Schema=\"Data\"`）。\n    - 第三行中的表名称（当前为 `Item=\"Sales\"`）。\n5. \
  \ 单击 `Done` 以确认任何更改并关闭高级编辑器。\n\n这种方法确实是在没有安全网的情况下工作，我向你展示这一点更多是为了提高认识，而不是建议你总是以这种方式编写\
  \ M 代码。然而，如果你希望继续深入学习 M 语言，这种方法确实为一些影响深远的可能性打开了大门。\n\n**注：** 当然，你可以单击 `Cancel` 来忽略你在高级编辑器中对\
  \ M 代码所做的任何更改。查询编辑器将要求你确认是否真的要放弃修改。\n\n#### 语法检查\n\n如果你打算编写和修改 M 代码，你很可能会频繁使用高级编辑器。因此，熟悉它能够提供的帮助无疑是值得的。具体来说，它的语法检查功能非常有用，而且是完全自动化的。\n\
  \n假设你（天理不容！）在代码中犯了一个错误。高级编辑器可能看起来像图 12-7 中的那样。\n \n`![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig7_HTML.jpg](img/497001_1_En_12_Fig7_HTML.jpg)`\n\
  \n图 12-7\n高级编辑器中的语法检查\n\n如你所见，在这种情况下，高级编辑器不再在代码下方显示一个复选框以及令人安心的消息“未检测到语法错误”。相反，你会看到一条错误消息。单击\
  \ `Show error` 链接将通过以蓝色背景显示错误来源来突出显示它。\n\n## 基础 M 函数\n\nM 语言非常庞大——庞大到在一章中只能进行粗略的概述。尽管如此，为了给这个概述提供一些结构，了解一些\
  \ M 函数的关键类别是值得的，这些类别在你刚开始使用 M 时可能会发现很有用。\n\n以下列表绝非详尽无遗，但希望可以成为你学习 M 函数之旅的起点。基础类别包括：\n\
  \n- 文本函数\n- 日期函数\n- 时间函数\n- 日期时间函数\n- 逻辑函数\n- 数值函数\n\n我关注这些类别，是因为它们在应用和使用上可能是最容易理解的。在你了解了其中一些函数之后，我们可以继续学习其他可用的函数。\n\
  \n大多数较基础的 M 函数都可以通过可能与它们在 Excel 中对应的函数相似的方式来应用。例如，如果你想扩展用于连接 Make 和 Model 列的公式，以便仅从\
  \ Make 中提取最左边的三个字符，你可以使用如下代码：\n\n```\n= Table.AddColumn(#\"Changed Type\", \"CarType\"\
  , each Text.Start([Make], 3) & \" \" & [Model])\n```\n\n结果如图 12-8 所示。\n\n`![../images/497001_1_En_12_Chapter/497001_1_En_12_Fig8_HTML.jpg](img/497001_1_En_12_Fig8_HTML.jpg)`\n\
  \n图 12-8\n应用第一个文本函数\n\n如你所见，将 `Make` 列包裹在此特定文本函数内，为表达式增加了一层额外的数据转换。\n\n\n\n### 文本函数\n\
  \n与其逐一讲解所有可能的文本函数示例，我更倾向于向你展示一些更有用的文本函数（至少根据我的经验）。这些代码片段列于表 12-1 中，你无疑会从中认出许多迄今为止通过\
  \ Power Query 用户界面访问过的函数。事实上，你可能在电子表格中编写公式时使用过等效的 Excel 函数。\n\n**表 12-1** 文本函数示例\n\
  \n| 输出 | 代码片段 | 说明 |\n| --- | --- | --- |\n| 左侧字符 | `Text.Start([Make],3)` | 返回\
  \ `Make` 列的前三个字符 |\n| 右侧字符 | `Text.End([Make],3)` | 返回 `Make` 列的最后三个字符 |\n| 直到特定字符\
  \ | `Text.Start([Make],Text.PositionOf([Make],\" \"))` | 返回从最左侧到第一个空格之间的字符 |\n|\
  \ 直到分隔符 | `Text.BeforeDelimiter([InvoiceNumber], \"-\" ,\"2\")` | 返回第三个连字符之前的文本\
  \ |\n| 文本长度 | `Text.Length([Make])` | 查找文本的长度 |\n| 提取子字符串 | `Text.Range([Make],\
  \ 2, 3)` | 从文本的指定起始位置提取特定数量的字符 |\n| 删除子文本 | `Text.RemoveRange([Make], 2, 3)` | 从文本的指定起始位置删除特定数量的字符\
  \ |\n| 替换文本 | `Text.Replace([Make], \"o\", \"a\")` | 将文本或列中的所有 `o` 字符替换为 `a` |\n\
  | 修剪空格 | `Text.Trim([Make])` | 移除文本或列中的前导和尾随空格 |\n| 转换为大写 | `Text.Upper([Make])`\
  \ | 将文本或列转换为大写 |\n| 转换为小写 | `Text.Lower([Make])` | 将文本或列转换为小写 |\n| 首字母大写 | `Text.Proper([Make])`\
  \ | 为文本或列中的每个单词添加首字母大写 |\n\n> **注意**\n> 如果你仔细看过这些函数，可能会注意到任何数字参数都是从零开始的。因此，要在拆分某列的文本时定义第三个连字符，你应该使用\
  \ `2` 而不是 `3`。\n\n正如你所料，`M` 中还有更多可用的文本函数。然而，目的并非让读者淹没在技术细节中，而是让你了解 `M` 的工作方式以及其所能实现的功能。\n\
  \n你可能会好奇，既然在 Excel 公式中几乎可以做同样的事情，为什么还要在 Power Query 中执行此类操作。确实，两者存在一些重叠；因此你可以选择使用哪一种。但请记住，在\
  \ `M` 中无需将公式向下复制填充到整列，因为该公式默认会应用于整个列。\n\n总的来说，你可以在数据准备和分析过程的多个阶段执行特定操作。这完全取决于你如何使用数据以及使用什么工具进行分析。\n\
  \n表 12-1 仅是 `M` 中可用文本函数的一个子集。如果你想查看完整列表，请访问微软网站 [`https://docs.microsoft.com/en-us/powerquery-m/text-functions`](https://docs.microsoft.com/en-us/powerquery-m/text-functions)。\n\
