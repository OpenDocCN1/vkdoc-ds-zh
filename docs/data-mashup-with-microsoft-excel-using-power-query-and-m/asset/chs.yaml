  \ Power Query 编辑器的“查询”窗格中，默认值显示在查询名称后的括号中。\n\n### 创建一组参数值\n\n虽然单个参数通常很有用，但实际上您可能需要潜在参数的列表。这将允许您或其他用户在某些情况下从预定义列表中选择一个参数值。以下是一个创建参数的示例，该参数包含示例数据中可用国家名称的一个子集：\n\
