  \ | 整数 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figc_HTML.jpg](img/497001_1_En_7_Figc_HTML.jpg)\
  \ | 小数 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figd_HTML.jpg](img/497001_1_En_7_Figd_HTML.jpg)\
  \ | 固定小数位数 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Fige_HTML.jpg](img/497001_1_En_7_Fige_HTML.jpg)\
  \ | 百分比 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figf_HTML.jpg](img/497001_1_En_7_Figf_HTML.jpg)\
  \ | 文本 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figg_HTML.jpg](img/497001_1_En_7_Figg_HTML.jpg)\
