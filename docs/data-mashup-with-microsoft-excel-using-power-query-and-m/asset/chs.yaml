  \n图 11-3 – 用于一组选项的参数对话框\n\n1.  使用您在上一节中创建的 Excel 文件（基于 Excel 文件 `C:\\DataMashupWithExcelSamples\\\
  CarSalesOverview.xlsx` 的那个），打开查询编辑器——除非它已经打开。\n2.  在查询编辑器的“主页”功能区中，单击“管理参数”按钮底部的小三角形，然后从可用菜单选项中选择“新建参数”。将显示“参数”对话框。\n\
  3.  输入 `CountriesParameter` 作为参数名称。\n4.  确保选中“必填”复选框。\n5.  从类型弹出列表中选择 `Text`。\n\
  6.  在“建议的值”弹出列表中，选择“值列表”。\n7.  在出现的网格中输入以下三个值：\n   1. France\n   2. Spain\n   3.\
  \ Germany\n8.  从默认值弹出列表中选择 `France`。\n9.  从当前值弹出列表中选择 `Spain`。对话框将如图 11-3 所示。\n\
  10. 单击“确定”。新参数将出现在左侧的“查询”列表中。\n\n同样，您所做的只是创建了该参数。您将在几页后看到如何应用它。\n\n> **注意**\n>\n\
  > 如您所见，您选择的任何当前值都会以括号形式显示在“查询”窗格中参数名称的右侧。这有助于您记住当前是哪个值——以及它可能正被用于塑造数据流过程。\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您给出的注意事项和示例格式，将以下英文文本翻译成中文。\n\
  \n\n## 创建基于查询的参数\n\n手动输入用于选择参数的值列表不仅费力，而且容易出错。因此，您可以使用现有查询中的数据来创建参数中可用的元素系列，而不是手动输入值列表。此外，您手动输入的任何列表都是完全静态的。因此，如果用户需求发生变化，您必须记得更新它们。相比之下，参数列表是动态的。也就是说，如果源数据发生变化，它们会自动更新。\n\
  \n以此为例，假设您想要一个包含公司销售的所有可用汽车品牌的参数：\n\n![../images/497001_1_En_11_Chapter/497001_1_En_11_Fig4_HTML.jpg](img/497001_1_En_11_Fig4_HTML.jpg)\n\
  \n图 11-4\n\n选项列表的`参数`对话框\n\n1.  使用 Excel 文件 `C:\\DataMashupWithExcelSamples\\CarSalesDataForQueries.xlsx`，双击\
  \ `查询和连接` 窗格中的任意查询以打开查询编辑器。\n\n2.  在 `查询` 列表中选择 `Stock` 查询。\n\n3.  右键单击名为 `Model`\
  \ 的列标题，然后选择 `添加为新查询`。一个名为 `Model` 的新查询将出现在 `查询` 列表中。此查询包含您所选列的内容。\n\n4.  在新创建的查询中，单击\
  \ `转换` 功能区中的 `删除重复项`。`List` 列将仅显示唯一值。\n\n5.  将新创建的查询重命名为 `ModelList`。\n\n6.  在查询编辑器的\
  \ `主页` 功能区中，单击 `管理参数` 按钮底部的小三角形，然后从可用菜单选项中选择 `新建参数`。将显示 `参数` 对话框。\n\n7.  输入 `ModelsParameter`\
  \ 作为参数名称。\n\n8.  确保选中 `必需` 复选框。\n\n9.  从类型弹出列表中选择 `文本`。\n\n10. 在 `建议的值` 弹出列表中，选择\
  \ `查询`。\n\n11. 从可用列表的弹出列表中选择 `ModelList` 作为包含要使用的值列表的查询。\n\n12. 输入 `DB7` 作为 `当前值`。`参数`\
  \ 对话框应类似于图 11-4 所示。\n\n13. 单击 `确定`。新的参数将出现在左侧的 `查询` 列表中。\n\n现在，您应该能够在 `查询` 窗格中看到您创建的所有三个参数，如图\
