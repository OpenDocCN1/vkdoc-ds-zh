  \ | 日期 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figj_HTML.jpg](img/497001_1_En_7_Figj_HTML.jpg)\
  \ | 时间 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figk_HTML.jpg](img/497001_1_En_7_Figk_HTML.jpg)\
  \ | 日期/时间/时区 |\n| ![../images/497001_1_En_7_Chapter/497001_1_En_7_Figl_HTML.jpg](img/497001_1_En_7_Figl_HTML.jpg)\
