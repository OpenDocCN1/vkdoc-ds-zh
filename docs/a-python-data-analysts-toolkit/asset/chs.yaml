  \n**图 8-7** PM₂.₅ – 每年每月超标天数\n\n### 第四步：基于分析和可视化得出结论\n\n从上图可以看出，大多数严重污染天数集中在一月、十一月和十二月。因此，根据过去四年记录的\
  \ PM₂.₅日均浓度，可能会在一月、十一月和十二月对交通流量、建筑施工活动、柴油泵组的使用、从邻邦进入德里的交通分流以及其他类似活动实施限制。要为整个德里做出此类决策，还需要分析其他监测站的数据。上述数据和分析的传播将有助于人们提前为限制措施做好准备，并理解这些措施背后的理由。\n\
  \n上述方法利用数据分析作为辅助空气质量管理的工具，使用了位于德里内塔吉·苏巴斯理工学院（NSIT）的一个监测站记录的数据。该方法可按照以下思路进一步推进。\n\
  \n1. 对 NO₂重复上述步骤，以显示导致大部分 NO₂记录值超过 24 小时标准天数的关键月份。进行此项练习将再次有助于识别 PM₂.₅和 NO₂这两个参数均面临严重污染水平的月份，并制定相应计划。\n\
  \n2. 使用来自 NSIT 空气质量监测站的数据进行的分析，可重复应用于其他站点的类似数据，以便能够为整个德里规划干预措施。\n\n\n\n## 案例研究 8-3：全球\
  \ COVID-19 病例分析\n\n本数据集包含截至 2020 年 6 月 29 日 COVID-19 病例的地理分布数据（来源：欧洲疾病预防控制中心，来源网址：[`https://www.ecdc.europa.eu/en/publications-data/download-todays-data-geographic-distribution-covid-19-cases-worldwide`](https://www.ecdc.europa.eu/en/publications-data/download-todays-data-geographic-distribution-covid-19-cases-worldwide)）。请注意，此链接包含最新数据，但我们使用的是截至\
  \ 6 月 29 日的数据（数据集链接见本章开头的“技术要求”部分）。\n\n我们希望通过分析回答的问题包括：\n\n1.  哪些国家的死亡率最高、病例数最多、死亡人数最多？\n\
  2.  自疫情开始以来，病例数和死亡人数的月度趋势如何？\n3.  一些国家实施了封锁措施以帮助拉平曲线。这一措施是否有助于减少病例数？\n\n### 步骤 1：导入数据并检查数据集特征\n\
