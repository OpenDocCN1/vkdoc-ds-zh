  ```\n\n### 第 3 步：可视化\n\n为了可视化我们的数据，首先我们创建另一个 DataFrame（`df1`），它包含原始 DataFrame（`df`）中列的子集。这个\
  \ DataFrame `df1` 只包含两列——`Film`（电影名称）和 `Gross`（总收入）。然后，我们按收入降序对值进行排序。如下所示。\n\n```\n\
