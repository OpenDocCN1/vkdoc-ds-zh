  ### 热力图


  热力图是相关矩阵的图形化表示，展示了数据集中不同变量之间的相关性，如图 7-9 所示。颜色强度代表相关性的强弱，数值代表相关程度（数值越接近 1，表示两个变量相关性越强）。注意对角线上的数值均为
  1，因为它们表示变量与自身的相关性。Seaborn 中的 `heatmap` 函数用于创建热力图。参数 `annot`（值为 `True`）用于显示代表相关程度的数值，`cmap`
  参数可用于更改默认调色板。`corr` 方法会创建一个包含各变量对之间相关程度的 DataFrame。热力图的标签来自相关 DataFrame（本例中为 `titanic.corr`）的索引和列值。


  代码：


  ![../images/498042_1_En_7_Chapter/498042_1_En_7_Fig9_HTML.jpg](img/498042_1_En_7_Fig9_HTML.jpg)


  图 7-9：Seaborn 中热力图示例


  ```

  sns.heatmap(titanic.corr(),annot=True,cmap=''YlGnBu'')

  ```


