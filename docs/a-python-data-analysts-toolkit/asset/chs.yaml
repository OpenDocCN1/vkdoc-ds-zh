  \ 11 个月创建一个新的 DataFrame（`df1`）。\n\n代码：\n\n*   使用 `isna` 或 `isnull` 方法检查是否存在空值，如果存在，则应用适当的方法处理它们：\n\
  \n```python\ndf1=df[df.month!=12]\n```\n\n计算空值的百分比：\n\n代码：\n\n```python\ndf1.isna().sum().sum()/len(df1)\n\
