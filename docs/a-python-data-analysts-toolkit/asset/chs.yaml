  5.  以上都不是\n\n**问题 2**  \n解释正则表达式的一些用例。\n\n**问题 3**  \n转义元字符的目的是什么，使用哪个字符进行转义？\n\n\
  **问题 4**\n\n以下语句的输出是什么？\n\n```\nre.findall('bond\\d{1,3}','bond07 bond007 Bond 07')\n\
  ```\n\n**问题 5**\n\n将以下元字符与其功能匹配：\n\n1. `+` | a. 匹配零个或一个字符\n2. `*` | b. 匹配一个或多个字符\n\
  3. `?` | c. 匹配字符集\n4. `[ ]` | d. 匹配搜索字符串末尾的字符\n5. `$` | e. 匹配零个或多个字符\n6. `{ }` |\
  \ f. 指定一个区间\n\n**问题 6**\n\n将以下元字符（用于字符类）与其功能匹配：\n\n1. `\\d` | a. 匹配单词的开头或结尾\n2.\
  \ `\\D` | b. 匹配除空白字符之外的任何字符\n3. `\\S` | c. 匹配非数字\n4. `\\w` | d. 匹配数字\n5. `\\b` |\
  \ e. 匹配字母数字字符\n\n**问题 7**\n\n编写一个程序，要求用户输入密码并进行验证。密码应满足以下要求：\n\n*   长度至少为六个字符\n\
  *   至少包含一个大写字母、一个小写字母、一个特殊字符和一个数字\n\n**问题 8**  \n考虑两个表达式 `y=x**2-9` 和 `y=3*x-11`。使用\
  \ SymPy 函数解决以下问题：\n\n*   分解表达式 `x**2-9`，并列出其因子\n*   求解这两个方程\n*   绘制这两个方程并图形化显示解\n\
  *   对表达式 `x**2-9` 在 `x=1` 处求导\n*   求表达式 `3*x-11` 在点 `x=0` 和 `x=1` 之间的定积分\n\n**答案**\n\
  \n**问题 1**  \n不正确的选项是选项 1 和 3。  \n选项 1 不正确，因为当元字符在集合中使用时，它不被视为元字符，而是采用其字面含义。  \n\
  选项 3 不正确，因为正则表达式区分大小写（“hat” 与 “HAT” 不同）。  \n其他选项是正确的。\n\n**问题 2**\n\n正则表达式的一些用例包括\n\
  \n\n\n## 正则表达式应用\n\n1.  用户输入验证（HTML 表单）。正则表达式可用于检查用户输入，确保输入符合表单中各字段的要求。\n\n2.  网络爬虫与网页抓取：正则表达式常用于从网站搜索通用信息（爬取），以及从网站提取特定类型的文本或数据（抓取），例如电话号码和电子邮件地址。\n\
  \n3.  在操作系统中定位文件：使用正则表达式，你可以搜索系统中具有相同扩展名或遵循其他模式的文件名的文件。\n\n### 问题 3\n\n我们通过转义元字符来使用其字面含义。反斜杠字符（`\\\
  `）位于要转义的元字符之前。例如，符号`*`在正则表达式中具有特殊含义。如果你想使用此字符而不带特殊含义，则需要使用`\\*`。\n\n### 问题 4\n\n\
  输出\n\n```\n['bond07', 'bond007']\n```\n\n#### 问题 5\n\n```\n1-b; 2-e; 3-a; 4-d; 5-c;\
  \ 6-f\n```\n\n#### 问题 6\n\n```\n1-d; 2-c; 3-b; 4-e; 5-a\n```\n\n#### 问题 7\n\n代码：\n\
  \n```\nimport re\nspecial_characters=['$','#','@','&','^','*']\nwhile True:\ns=input(\"\
