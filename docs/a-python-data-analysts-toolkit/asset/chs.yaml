  \ 选项下载笔记本，然后通过电子邮件发送或分享您的笔记本，如图 1-7 所示。\n\n\n\n### Jupyter 中的快捷键与其他功能\n\n让我们来看看\
  \ Jupyter notebook 的一些关键功能，包括快捷键、Tab 补全和魔法命令。\n\n表 1-1 列出了 Jupyter notebook 中一些常见的图标、对应的菜单功能以及键盘快捷键。\n\
  \n**表 1-1** Jupyter Notebook 工具栏功能\n\n| 工具栏图标 | 功能 | 键盘快捷键 | 菜单功能 |\n| --- | ---\
