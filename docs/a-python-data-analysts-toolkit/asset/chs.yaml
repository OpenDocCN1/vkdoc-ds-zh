  `figure`对象，作为其他对象的容器。<br>- `axes`对象，是实际的绘图区域，包含 x 轴、y 轴、点、线、图例和标签。请注意，此处的 axes 并非指
  x 轴和 y 轴，而是指整个子图。 |

