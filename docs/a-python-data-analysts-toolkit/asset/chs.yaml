  图 7-10 分面网格示例


  #### Regplot

  此图使用线性回归模型在两个连续变量的数据点之间绘制回归线，如图 7-11 所示。Seaborn 函数 `regplot` 用于创建此图。


  代码：


  ```python

  sns.regplot(x=''Age'',y=''Fare'',data=titanic)

