  因此，我们可以使用布尔选择或 `drop` 方法从 DataFrame 中删除行。由于 `drop` 方法同时适用于删除行和列，因此可以统一使用。请记住向 `drop`
  方法添加所需的参数。对于删除列，需要添加 `axis`（=1）参数。要使更改反映在原始 DataFrame 中，需要包含 `inplace`（=True）参数。


