  \n图 1-6\n\n更改文件名\n\n1. **重命名笔记本**\n\n   点击笔记本的默认名称并输入新名称，如图 1-6 所示。\n\n   您也可以通过选择\
  \ `File ➤ Rename` 来重命名笔记本。\n\n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig7_HTML.jpg](img/498042_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n下载 Jupyter notebook\n\n1. **保存笔记本**\n\n   按 `Ctrl+S` 或选择 `File ➤ Save\
