  \ usage`: 2.0+ KB\n\n如我们所见，各列的数据类型并非我们所需的格式。`Gross` 列代表总收入，本应是数值列。然而，由于该列包含数值和非数值数据（如\
  \ `,`、`$` 符号以及字母 `U` 和 `S` 等字符），它被分配了 object 数据类型。在下一步中，我们将处理此类问题。\n\n### 第 2 步：数据整理\n\
  \n在这一步中，我们将：\n\n1.  移除不必要的字符\n2.  更改数据类型\n3.  移除不需要的列\n4.  从现有列创建新列\n\n让我们从 `Gross`\
  \ 列中移除不需要的字符串，仅保留数值：\n\n```\n# 从 Gross 列中移除不必要的字符\ndf['Gross']=df['Gross'].str.replace(r\"\
  US\\$\",\"\").str.replace(r\",\",\"\")\n```\n\n在上述语句中，我们使用了一系列链式替换方法和正则表达式原理来替换非数字字符。第一个替换方法移除\
  \ `US$`，第二个替换方法移除逗号。将字符替换为空字符串（`\"\"`）等同于移除该字符。\n\n现在，让我们使用 `astype` 方法进行类型转换，将该列的数据类型更改为\
  \ `int64`，以便该列可用于计算和可视化：\n\n```\n# 更改 Gross 列的数据类型，使其成为数值列\ndf['Gross']=df['Gross'].astype('int64')\n\
  ```\n\n为了检查这些更改是否已生效，我们查看该列的前几条记录并验证数据类型：\n\n```\ndf['Gross'].head(5)\n```\n\n输出：\n\
  \n```\n0     6557062\n1     2127871\n2     2006033\n3     2771269\n4    16604101\n\
  Name: Gross, dtype: int64\n```\n\n从输出中可以看出，该列的数据类型已更改，并且值不再包含字符串。\n\n我们还需要提取日期的月份部分，我们将首先更改\
