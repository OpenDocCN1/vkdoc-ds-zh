  2` `combined_ages=pd.DataFrame([student_ages,teacher_ages]) #DataFrame` `combined_ages.columns=[''class
  1'',''class 2'',''class 3'']#命名列` `combined_ages` 输出：![../images/498042_1_En_6_Chapter/498042_1_En_6_Figa_HTML.jpg](img/498042_1_En_6_Figa_HTML.jpg)
  这里，我们定义了两个 `Series`，然后使用 `pd.DataFrame` 函数创建一个名为“combined_ages”的新 `DataFrame`。我们在单独的步骤中为列命名。
  |

  | 通过字典 | 代码：`combined_ages=pd.DataFrame({''class 1'':[22,40],''class 2'':[24,50],''class
  3'':[20,45]})` `combined_ages` 输出：![../images/498042_1_En_6_Chapter/498042_1_En_6_Figb_HTML.jpg](img/498042_1_En_6_Figb_HTML.jpg)
  将一个字典作为参数传递给 `pd.DataFrame` 函数（列名作为键，每列的值包含在一个列表中）。 |

  | 通过 NumPy 数组 | 代码：`numerical_df=pd.DataFrame(np.arange(1,9).reshape(2,4))` `numerical_df`
  输出：![../images/498042_1_En_6_Chapter/498042_1_En_6_Figc_HTML.jpg](img/498042_1_En_6_Figc_HTML.jpg)
  这里，我们首先使用 `np.arange` 函数创建一个 NumPy 数组。然后将该数组重塑为一个包含两行四列的 `DataFrame`。 |

  | 使用一组元组 | 代码：`combined_ages=pd.DataFrame([(22,24,20),(40,50,45)],columns=[''class
  1'',''class 2'',''class 3''])` `combined_ages` 输出：![../images/498042_1_En_6_Chapter/498042_1_En_6_Figd_HTML.jpg](img/498042_1_En_6_Figd_HTML.jpg)
  我们使用一组元组重新创建了“combined_ages” `DataFrame`。每个元组相当于 `DataFrame` 中的一行。 |


  总而言之，我们可以使用字典、一组元组以及通过组合 `Series` 对象来创建 `DataFrame`。这些方法都使用了 `pd.DataFrame` 函数。请注意，此方法中的字符“D”和“F”是大写的；`pd.dataframe`
  不起作用。


  ### 通过从其他格式导入数据创建 DataFrame


  Pandas 可以使用其读取函数从多种格式读取数据（在此处查看支持的格式完整列表：[`https://pandas.pydata.org/pandas-docs/stable/user_guide/io.html`](https://pandas.pydata.org/pandas-docs/stable/user_guide/io.html)）。以下是一些常用的格式。


  #### 从 CSV 文件


  `read_csv` 函数可用于将 CSV 文件中的数据读取到 `DataFrame` 中，如下所示。


  代码：


  ```

  titanic=pd.read_csv(''titanic.csv'')

  ```


  从 CSV 文件读取数据是创建 `DataFrame` 最常见的方法之一。CSV 文件是用于存储和检索值的逗号分隔文件，其中每一行相当于一条记录。在调用 `read_csv`
  函数之前，请记得使用 Jupyter 主页上的上传按钮将 CSV 文件上传到 Jupyter 中（图 6-1）。


  ![../images/498042_1_En_6_Chapter/498042_1_En_6_Fig1_HTML.jpg](img/498042_1_En_6_Fig1_HTML.jpg)


  **图 6-1** Jupyter 文件上传


  #### 从 Excel 文件


  Pandas 支持使用 `pd.read_excel` 函数从 xls 和 xlsx 文件格式导入数据，如下所示。


  代码：


  ```

  titanic_excel=pd.read_excel(''titanic.xls'')

  ```




  #### 从 JSON 文件读取


  JSON 是 JavaScript 对象表示法的缩写，是一种跨平台文件格式，用于在客户端和服务器之间传输和交换数据。Pandas 提供了 `read_json`
  函数来从 JSON 文件读取数据，如下所示。


  ```

  titanic=pd.read_json(''titanic-json.json'')

  ```


  #### 从 HTML 文件读取


  我们也可以使用 `pd.read_html` 函数从网页导入数据。在下面的示例中，该函数将网页上的表格解析为 `DataFrame` 对象。此函数返回一个 `DataFrame`
  对象列表，这些对象对应于网页上的表格。在下面的示例中，`table[0]` 对应于所提及 URL 上的第一个表格。


  ```

  url="https://www.w3schools.com/sql/sql_create_table.asp"

  table=pd.read_html(url)

  table[0]

  ```


  输出：

  ![../images/498042_1_En_6_Chapter/498042_1_En_6_Fige_HTML.jpg](img/498042_1_En_6_Fige_HTML.jpg)


  延伸阅读：查看 Pandas 支持的完整格式列表以及从这些格式读取数据的函数：[`https://pandas.pydata.org/pandas-docs/stable/reference/io.html`](https://pandas.pydata.org/pandas-docs/stable/reference/io.html)


  ### 访问 DataFrame 中的属性


  在本节中，我们将学习如何访问 `DataFrame` 对象中的属性。我们使用以下 `DataFrame`：


  ```

  combined_ages=pd.DataFrame({''class 1'':[22,40],''class 2'':[24,50],''class 3'':[20,45]})

  ```


  #### 属性


  当 `index` 属性与 `DataFrame` 对象一起使用时，它会给出索引对象的类型及其值。


  ```

  combined_ages.index

  ```


  输出：


  ```

  RangeIndex(start=0, stop=2, step=1)

  ```


  `columns` 属性提供有关列的信息（它们的名称和数据类型）。


  ```

  combined_ages.columns

  ```


  输出：


  ```

  Index([''class 1'', ''class 2'', ''class 3''], dtype="object")

  ```


  索引对象和列对象都是索引对象的类型。索引对象的类型是 `RangeIndex`，而列对象的类型是 `Index`。索引对象的值充当行标签，而列对象的值充当列标签。


  #### 访问 DataFrame 中的值


  使用 `values` 属性，您可以获取存储在 `DataFrame` 中的数据。如您所见，输出是一个包含这些值的数组。


  ```

  combined_ages.values

  ```


  输出：


  ```

  array([[22, 24, 20],

  [40, 50, 45]], dtype=int64)

  ```


  ### 修改 DataFrame 对象


  在本节中，我们将学习如何更改列的名称以及如何添加和删除列与行。


  #### 重命名列


  可以使用 `rename` 方法更改列的名称。一个字典作为参数传递给此方法。该字典的键是旧的列名，值是新的列名。


  ```

  combined_ages.rename(columns={''class 1'':''batch 1'',''class 2'':''batch 2'',''class
  3'':''batch 3''},inplace=True)

  combined_ages

  ```


  输出：


  ![../images/498042_1_En_6_Chapter/498042_1_En_6_Figf_HTML.jpg](img/498042_1_En_6_Figf_HTML.jpg)


  我们使用 `inplace` 参数的原因是为了让更改应用于实际的 `DataFrame` 对象。重命名也可以通过直接访问 `columns` 属性并在数组中指定新的列名来完成，如下例所示。


  ```

  combined_ages.columns=[''batch 1'',''batch 2'',''batch 3'']

  ```


  使用字典格式进行重命名是一种更直接的重命名列的方法，并且更改会应用于原始的 `DataFrame` 对象。这种方法的缺点是需要记住 `DataFrame` 中列的顺序。当我们使用
  `rename` 方法时，我们使用了一个字典，我们知道正在更改哪些列名。


  #### 替换 DataFrame 中的值或观测值


  `replace` 方法可用于替换 `DataFrame` 中的值。我们同样可以使用字典格式，其中键/值对代表旧值和新值。这里，我们将值 22 替换为值 33。


  ```

  combined_ages.replace({22:33})

  ```


  输出：


  ![../images/498042_1_En_6_Chapter/498042_1_En_6_Figg_HTML.jpg](img/498042_1_En_6_Figg_HTML.jpg)


  #### 向 DataFrame 添加新列


  有四种方法可以在 `DataFrame` 中插入新列，如表 6-3 所示。


  **表 6-3** 向 DataFrame 添加新列


  | 列插入方法 | 语法 |

  | --- | --- |

