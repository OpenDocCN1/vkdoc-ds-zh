  \n**图 8-3** 2018 年（法国）月均票房收入\n\n### 第 4 步：基于分析和可视化得出结论\n\n1.  月均收入波动较大，可能取决于电影的上映月份，这可能需要跨年份进行进一步分析。\n\
  2.  2018 年法国收入最高的三部电影是*《复仇者联盟》*、*《La Ch’tite Famille》*和*《Les Tuche 3》*。\n\n## 案例研究\
  \ 8-2：数据分析在空气质量管理的应用\n\n为了监测环境空气质量状况，印度中央污染控制委员会（CPCB）运营着一个遍布全国的大型监测站网络。定期监测的参数包括二氧化硫（SO[2]）、以二氧化氮（NO[2]）计的氮氧化物、臭氧和细颗粒物（PM[2.5]）。根据多年趋势，国家首都德里的空气质量已成为公众关注的问题。以下是对每日空气质量数据的分步分析，以展示数据分析如何协助规划作为空气质量管理一部分的干预措施。\n\
  \n注意：本案例研究使用的数据集名称为：`NSIT Dwarka.csv`。有关如何导入此数据集的详细信息，请参阅技术说明部分。\n\n### 我们希望通过分析回答的问题：\n\
  \n1.  年度平均值：在 SO[2]、NO[2]、臭氧和 PM[2.5] 这四种污染物中，哪些污染物的年平均水平经常超过规定的年度标准？\n2.  每日标准：对于关注的污染物，每年有多少天超过了每日标准？\n\
  3.  时间变化：哪些月份中，大多数日期的污染水平超过了临界水平？\n\n### 第 1 步：导入数据并检查数据集特征\n\n```\nimport pandas\
  \ as pd\nimport numpy as np\nimport seaborn as sns\nimport matplotlib.pyplot as\
  \ plt\n# aqdata 是 DataFrame 的名称，是 Air Quality Data 的缩写。\naqdata=pd.read_csv('NSIT\
  \ Dwarka.csv')\naqdata.head()\n```\n\n输出：\n\n![../images/498042_1_En_8_Chapter/498042_1_En_8_Figb_HTML.jpg](img/498042_1_En_8_Figb_HTML.jpg)\n\
  \n### 检查各列的数据类型：\n\n```\naqdata.info()\n```\n\n输出：\n\n```\nRangeIndex: 2192 entries,\
  \ 0 to 2191\nData columns (total 6 columns):\nFrom Date    2191 non-null object\n\
  To Date      2191 non-null object\nPM2.5        2191 non-null object\nSO2      \
  \    2187 non-null object\nOzone        2187 non-null object\nNO2          2190\
  \ non-null object\ndtypes: object(6)\nmemory usage: 102.8+ KB\n```\n\n\n\n观察：尽管\
  \ `SO[2]`、`NO[2]`、臭氧和 `PM[2.5]` 的数值是数字类型，但 Pandas 将这些列的数据类型读取为 `\"*object\"`。为了处理这些列（例如绘制图表、观察趋势、计算聚合值），我们需要更改这些列的数据类型。此外，数据中似乎还存在一些缺失条目。\n\
  \n### 第 2 步：数据整理\n\n基于上一步的观察结果，在本步骤中，我们将：\n\n1.  处理缺失值：我们可以选择删除空值或替换空值。\n2.  更改各列的数据类型。\n\
  \n#### 检查数据集中的缺失值：\n\n代码：\n\n```\naqdata.isna().sum()\n```\n\n输出：\n\n```\nFrom Date\
  \    1\nTo Date      1\nPM2.5        1\nSO2          5\nOzone        5\nNO2    \
  \      2\ndtype: int64\n```\n\n看起来缺失值并不多，但问题就在这里。当我们使用 `head` 语句检查前几行时，发现原始数据集中有些缺失值表示为\
  \ `None`。然而，Pandas 并未将这些值识别为空值。让我们将值 `None` 替换为 `np.nan`，以便 Pandas 将这些值识别为空值：\n\n\
  代码：\n\n```\naqdata=aqdata.replace({'None':np.nan})\n```\n\n现在，如果我们计算空值的数量，会看到一个截然不同的情况，表明数据集中存在更多的缺失值。\n\
  \n代码：\n\n```\naqdata.isna().sum()\n```\n\n输出：\n\n```\nFrom Date      1\nTo Date\
  \        1\nPM2.5        562\nSO2           84\nOzone        106\nNO2          105\n\
  dtype: int64\n```\n\n让我们检查一下各列当前的数据类型：\n\n代码：\n\n```\naqdata.info()\n```\n\n输出：\n\
  \n```\nRangeIndex: 2192 entries, 0 to 2191\nData columns (total 6 columns):\nFrom\
  \ Date    2191 non-null object\nTo Date      2191 non-null object\nPM2.5       \
  \ 1630 non-null object\nSO2          2108 non-null object\nOzone        2086 non-null\
  \ object\nNO2          2087 non-null object\ndtypes: object(6)\nmemory usage: 102.8+\
  \ KB\n```\n\n我们看到，包含数值的列未被识别为数值列，包含日期的列也未正确识别。列的数据类型不正确会阻碍下一步的分析趋势和绘制图表的工作；这一步要求列的数据类型采用适合\
  \ Pandas 读取的格式。在下面的代码中，我们使用 `pd.to_datetime` 方法将 `\"From Date\"` 和 `\"To Date\"\
  ` 列的数据类型转换为 `datetime` 类型，这样可以更轻松地分析日期的各个组成部分，例如月份和年份。\n\n代码：\n\n```\naqdata['From\
  \ Date']=pd.to_datetime(aqdata['From Date'], format='%d-%m-%Y %H:%M')\naqdata['To\
  \ Date']=pd.to_datetime(aqdata['To Date'], format='%d-%m-%Y %H:%M')\naqdata['SO2']=pd.to_numeric(aqdata['SO2'],errors='coerce')\n\
  aqdata['NO2']=pd.to_numeric(aqdata['NO2'],errors='coerce')\naqdata['Ozone']=pd.to_numeric(aqdata['Ozone'],errors='coerce')\n\
  aqdata['PM2.5']=pd.to_numeric(aqdata['PM2.5'],errors='coerce')\n```\n\n使用 `info`\
  \ 方法检查数据类型是否已更改。\n\n代码：\n\n```\naqdata.info()\n```\n\n输出：\n\n```\nRangeIndex: 2192\
  \ entries, 0 to 2191\nData columns (total 6 columns):\nFrom Date    2191 non-null\
  \ datetime64[ns]\nTo Date      2191 non-null datetime64[ns]\nPM2.5        1630 non-null\
  \ float64\nSO2          2108 non-null float64\nOzone        2086 non-null float64\n\
  NO2          2087 non-null float64\ndtypes: datetime64ns, float64(4)\nmemory usage:\
  \ 102.8 KB\n```\n\n由于我们的大部分分析都基于年度数据，因此我们使用 `pd.DatetimeIndex` 函数创建一个新列来提取年份。\n\n\
  代码：\n\n```\naqdata['Year'] = pd.DatetimeIndex(aqdata['From Date']).year\n```\n\n\
  现在，我们为每年创建单独的 DataFrame 对象，以便按年分析数据。\n\n代码：\n\n```\n#提取每年的数据\naq2014=aqdata[aqdata['Year']==2014]\n\
  aq2015=aqdata[aqdata['Year']==2015]\naq2016=aqdata[aqdata['Year']==2016]\naq2017=aqdata[aqdata['Year']==2017]\n\
  aq2018=aqdata[aqdata['Year']==2018]\naq2019=aqdata[aqdata['Year']==2019]\n```\n\n\
  现在，让我们查看每年数据中的空值数量：\n\n代码：\n\n```\n#检查 2014 年的缺失值\naq2014.isna().sum()\n```\n\n\
  输出：\n\n```\nFrom Date      0\nTo Date        0\nPM2.5        365\nSO2          \
  \  8\nOzone          8\nNO2            8\nYear           0\ndtype: int64\n#检查 2015\
  \ 年的缺失值\naq2015.isna().sum()\n```\n\n输出：\n\n```\nFrom Date      0\nTo Date     \
  \   0\nPM2.5        117\nSO2           12\nOzone         29\nNO2           37\n\
  Year           0\ndtype: int64\n```\n\n代码：\n\n```\n#检查 2016 年的缺失值\naq2016.isna().sum()\n\
  ```\n\n输出：\n\n```\nFrom Date     0\nTo Date       0\nPM2.5        43\nSO2      \
  \    43\nOzone        47\nNO2          42\nYear          0\ndtype: int64\n#检查 2017\
  \ 年的缺失值\naq2017.isna().sum()\n```\n\n输出：\n\n```\nFrom Date     0\nTo Date      \
  \ 0\nPM2.5        34\nSO2          17\nOzone        17\nNO2          12\nYear  \
  \        0\ndtype: int64\n```\n\n代码：\n\n```\n#检查 2018 年的缺失值\naq2018.isna().sum()\n\
  ```\n\n输出：\n\n```\nFrom Date    0\nTo Date      0\nPM2.5        2\nSO2         \
  \ 2\nOzone        2\nNO2          2\nYear         0\ndtype: int64\n```\n\n代码：\n\n\
  ```\n#检查 2019 年的缺失值\naq2019.isna().sum()\n```\n\n输出：\n\n```\nFrom Date    0\nTo\
  \ Date      0\nPM2.5        0\nSO2          1\nOzone        2\nNO2          3\n\
  Year         0\ndtype: int64\n```\n\n从每年空值的分析中，我们看到 2014 年和 2015 年的数据包含大部分缺失值。因此，我们选择忽略\
  \ 2014 年和 2015 年的数据，并分析 2016 年至 2019 年这 4 年的数据。根据印度中央污染控制委员会制定的规范，我们需要至少 104 个每日监测值才能得出年度平均值。2016、2017、2018\
  \ 和 2019 年将是分析空气质量数据的四个年份。在进入下一步之前，我们删除 2016 年至 2019 年每年数据中的缺失值，而不是替换它们，因为如下所示，这四年中每年都有足够的数据（超过\
  \ 104 个读数）来计算年度平均值。\n\n代码：\n\n```\n#删除选定的四年分析数据中的空值\naq2016.dropna(inplace=True)\
  \ # inplace=True 表示对原始数据框进行修改\naq2017.dropna(inplace=True)\naq2018.dropna(inplace=True)\n\
  aq2019.dropna(inplace=True)\n```\n\n### 第 3 步：数据可视化\n\n#### 分析第一部分：绘制污染物的年度平均值\n\
  \n基于监测到的 `PM[2.5]`、`SO[2]`、`NO[2]` 和臭氧 (`O[3]`) 的 24 小时平均环境空气浓度，绘制年度平均值，以识别哪些参数超过了国家规定的年度平均环境空气质量标准。\n\
  \n首先，我们计算每种污染物（`PM[2.5]`、`SO[2]`、`NO[2]` 和臭氧）的年度平均值，如下所示：\n\n代码：\n\n```\n#每年 SO2\
  \ 的年度平均值\ns16avg=round(aq2016['SO2'].mean(),2)\ns17avg=round(aq2017['SO2'].mean(),2)\n\
  s18avg=round(aq2018['SO2'].mean(),2)\ns19avg=round(aq2019['SO2'].mean(),2)\n#每年\
  \ PM2.5 的年度平均值\np16avg=round(aq2016['PM2.5'].mean(),2)\np17avg=round(aq2017['PM2.5'].mean(),2)\n\
  p18avg=round(aq2018['PM2.5'].mean(),2)\np19avg=round(aq2019['PM2.5'].mean(),2)\n\
  #每年 NO2 的年度平均值\nn16avg=round(aq2016['NO2'].mean(),2)\nn17avg=round(aq2017['NO2'].mean(),2)\n\
  n18avg=round(aq2018['NO2'].mean(),2)\nn19avg=round(aq2019['NO2'].mean(),2)\n```\n\
  \n\n\n说明：表示污染物平均值变量的命名规则如下：污染物首字母、年份以及表示平均值的缩写`avg`。例如，`s15avg`表示 2015 年 SO[2]的平均水平。我们使用`mean`方法计算平均值，并用`round`函数将平均值四舍五入到两位小数。由于臭氧不适用年度标准，因此我们不考虑臭氧。\n\
  \n接下来，我们为每种污染物创建一个包含两列的`DataFrame`。其中一列代表年份，另一列显示该年份的年平均浓度。\n\n代码：\n\n```python\n\
  #Creating data frames with yearly averages for each pollutant\ndfs=pd.DataFrame({'Yearly\
  \ average':[s16avg,s17avg,s18avg,s19avg]},index=['2016','2017','2018','2019']) #dfs\
  \ is for SO2\ndfp=pd.DataFrame({'Yearly average':[p16avg,p17avg,p18avg,p19avg]},index=['2016','2017','2018','2019'])\
  \ #dfp is for PM2.5\ndfn=pd.DataFrame({'Yearly average':[n16avg,n17avg,n18avg,n19avg]},index=['2016','2017','2018','2019'])\
  \ #dfn is for NO2\n```\n\n现在，我们准备绘制每种污染物年平均浓度的图表（图 8-4）。\n\n代码：\n\n```python\n#Creating\
  \ a figure with 3 subplots - 1 for each pollutant\nfig,(ax1,ax2,ax3)=plt.subplots(1,3)\n\
  #Creating a DataFrame the yearly averages for NO2\ndfn.plot(kind='bar',figsize=(20,5),ax=ax1)\n\
  #Setting the title for the first axes object\nax1.set_title(\"NO2\", fontsize=18)\n\
  #Setting the X-axis label for the NO2 graph\nax1.set_xlabel(\"Years\", fontsize=18)\n\
  ax1.legend().set_visible(False)\n#Setting the Y-axis label\nax1.set_ylabel(\"Yearly\
  \ average\", fontsize=18)\n#Creating a dashed line to indicate the annual standard\n\
  ax1.hlines(40, -.9,15, linestyles=\"dashed\")\n#Labelling this dashed line\nax1.annotate('Annual\
  \ avg. standard for NO2',(-0.5,38))\n#labelling the bars\nfor p in ax1.patches:\n\
  ax1.annotate(p.get_height(),(p.get_x()+p.get_width()/2,p.get_height()), color=\"\
  black\", ha=\"left\", va ='bottom',fontsize=12)\n#Plotting the yearly averages similarly\
  \ for PM2.5\ndfp.plot(kind='bar',figsize=(20,5),ax=ax2)\nax2.set_title(\"PM2.5\"\
  , fontsize=18)\nax2.hlines(40, -.9,15, linestyles=\"dashed\")\nax2.annotate('Annual\
  \ avg. standard for PM2.5',(-0.5,48))\nax2.legend().set_visible(False)\nfor p in\
  \ ax2.patches:\nax2.annotate(p.get_height(),(p.get_x()+p.get_width()/2,p.get_height()),\
  \ color=\"black\", ha=\"center\", va ='bottom',fontsize=12)\n#Plotting the yearly\
  \ averages similarly for SO2\ndfs.plot(kind='bar',figsize=(20,5),ax=ax3)\nax3.hlines(50,\
  \ -.9,15, linestyles=\"dashed\")\nax3.annotate('Annual avg. standard for SO2',(-0.5,48))\n\
  ax3.set_title(\"SO2\", fontsize=18)\nax3.legend().set_visible(False)\nfor p in ax3.patches:\n\
  ax3.annotate(p.get_height(),(p.get_x()+p.get_width()/2,p.get_height()), color=\"\
  black\", ha=\"center\", va ='bottom',fontsize=12)\n```\n\n输出：\n\n![../images/498042_1_En_8_Chapter/498042_1_En_8_Fig4_HTML.jpg](img/498042_1_En_8_Fig4_HTML.jpg)\n\
