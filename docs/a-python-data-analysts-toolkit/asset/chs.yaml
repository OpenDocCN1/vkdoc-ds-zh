  \n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig8_HTML.jpg](img/498042_1_En_1_Fig8_HTML.jpg)\n\
  \n**图 1-8** Jupyter 中的帮助菜单\n\n常用的键盘快捷键包括：\n\n*   `Shift+Enter` 运行当前单元格中的代码并移动到下一个单元格。\n\
  *   `Esc` 离开一个单元格。\n*   `Esc+M` 将单元格模式更改为“Markdown”模式。\n*   `Esc+Y` 将单元格模式更改为“代码”。\n\
  \n### Tab 补全\n\n这是 Jupyter notebook 中的一个功能，可以帮助你完成正在编写的代码。使用 Tab 补全可以加快工作流程、减少错误，并快速补全函数名，从而减少拼写错误，让你无需记住所有模块和函数的名称。\n\
  \n例如，如果你想导入 Matplotlib 库但记不住拼写，可以输入前三个字母 `mat`，然后按 `Tab` 键。你会看到一个下拉列表，如图 1-9 所示。该库的正确名称是下拉列表中的第二个名称。\n\
  \n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig9_HTML.jpg](img/498042_1_En_1_Fig9_HTML.jpg)\n\
  \n**图 1-9** Jupyter 中的 Tab 补全\n\n### Jupyter 中使用的魔法命令\n\n魔法命令是以一个或多个 `%` 符号开头，后跟命令的特殊命令。以一个\
  \ `%` 符号开头的命令适用于单行代码，而以两个 `%%` 符号开头的命令适用于整个单元格（单元格内的所有代码行）。\n\n下面展示了一个常用的魔法命令，用于在\
  \ notebook 内部显示 Matplotlib 图形。添加此魔法命令可以避免单独调用 `plt.show` 函数来显示图形（Matplotlib 库将在第\
  \ 7 章详细讨论）。\n\n```\n%matplotlib inline\n```\n\n像 `timeit` 这样的魔法命令也可以用来计时脚本的执行时间，如下所示。\n\
  \n```\n%%timeit\nfor i in range(100000):\n    i*i\n```\n\n输出：\n\n```\n16.1 ms ±\
  \ 283 μs per loop (mean ± std. dev. of 7 runs, 100 loops each)\n```\n\n现在你已经了解了使用\
  \ Jupyter notebook 的基础知识，让我们开始学习 Python，并理解这门语言的核心方面。\n\n## Python 基础\n\n在本节中，我们将熟悉\
  \ Python 的语法、注释、条件语句、循环和函数。\n\n### 注释、打印和输入\n\n在本节中，我们将介绍一些基础知识，例如打印、获取用户输入以及添加注释以帮助他人理解你的代码。\n\
  \n#### 注释\n\n注释用于解释一行代码的作用，程序员用它来帮助他人理解他们所编写的代码。在 Python 中，注释以 `#` 符号开头。\n\n在 Python\
  \ 中，正确的空格和缩进至关重要。虽然 Java 和 C++ 等其他语言使用花括号来包含代码块，但 Python 使用四个空格的缩进来指定代码块。需要注意缩进以避免错误。像\
  \ Jupyter 这样的应用程序通常会处理缩进，并自动在代码块的开头添加四个空格。\n\n\n\n#### 打印\n\n`print`函数将内容输出到屏幕或任何其他输出设备。\n\
  \n通常，我们将字符串和变量的组合作为参数传递给`print`函数。参数是包含在函数括号内的值，函数使用这些值来产生结果。在下面的语句中，`\"Hello!\"\
  `是`print`函数的参数。\n\n```\nprint(\"Hello!\")\n```\n\n要打印多行代码，我们在字符串的开头和结尾使用三引号，例如：\n\
  \n```\nprint('''Today is a lovely day.\nIt will be warm and sunny.\nIt is ideal\
  \ for hiking.''')\n```\n\n输出：\n\n```\nToday is a lovely day.\nIt will be warm and\
  \ sunny.\nIt is ideal for hiking.\n```\n\n请注意，与某些其他语言不同，在 Python 中我们不需要使用分号来结束语句。\n\
  \n`format`方法可以与`print`方法结合使用，用于在字符串中嵌入变量。它使用花括号作为变量的占位符，这些变量作为参数传递给该方法。\n\n让我们看一个使用`format`方法打印变量的简单示例。\n\
  \n```\nweight=4.5\nname=\"Simi\"\nprint(\"The weight of {} is {}\".format(name,weight))\n\
  ```\n\n输出：\n\n```\nThe weight of Simi is 4.5\n```\n\n上述语句也可以不使用`format`方法重写如下：\n\
  \n```\nprint(\"The weight of\",name,\"is\",\"weight\")\n```\n\n请注意，只有`print`参数的字符串部分被引号括起来。变量名不在引号内。同样，如果`print`参数中有任何常量，它们也不在引号内。在以下示例中，布尔常量（`True`）、整数常量（`1`）和字符串被组合在一个`print`语句中。\n\
  \n```\nprint(\"The integer equivalent of\",True,\"is\",1)\n```\n\n输出：\n\n```\nThe\
  \ integer equivalent of True is 1\n```\n\n格式字段可以指定浮点数的精度。浮点数是指带有小数点的数字，小数点后的位数可以使用格式字段指定，如下所示。\n\
  \n```\nx=91.234566\nprint(\"The value of x upto 3 decimal points is {:.3f}\".format(x))\n\
  ```\n\n输出：\n\n```\nThe value of x upto 3 decimal points is 91.235\n```\n\n我们可以指定传递给方法的变量的位置。在此示例中，我们使用位置`1`来引用参数列表中的第二个对象，使用位置`0`来指定参数列表中的第一个对象。\n\
  \n```\ny='Jack'\nx='Jill'\nprint(\"{1} and {0} went up the hill to fetch a pail\
  \ of water\".format(x,y))\n```\n\n输出：\n\n```\nJack and Jill went up the hill to\
  \ fetch a pail of water\n```\n\n#### 输入\n\n`input`函数接受来自用户的输入。用户提供的输入被存储为`String`类型的变量。如果你想对任何数字输入进行数学计算，你需要将输入的数据类型更改为`int`或`float`，如下所示。\n\
  \n```\nage=input(\"Enter your age:\")\nprint(\"In 2010, you were\",int(age)-10,\"\
  years old\")\n```\n\n输出：\n\n```\nEnter your age:76\nIn 2010, you were 66 years old\n\
  ```\n\n关于 Python 输入/输出的进一步阅读：[`https://docs.python.org/3/tutorial/inputoutput.html`](https://docs.python.org/3/tutorial/inputoutput.html)\n\
  \n### 变量和常量\n\n常量或字面量是一个不会改变的值，而变量包含的值可以改变。在 Python 中，我们不需要声明变量，即指定其数据类型，这与 Java\
  \ 和 C/C++等其他语言不同。我们通过给变量命名并为其赋值来定义它。根据值，会自动为其分配一个数据类型。值通过赋值运算符（`=`）存储在变量中。Python\
  \ 中变量命名的规则如下：\n\n*   变量名不能包含空格\n*   变量不能以数字开头\n*   变量名只能包含字母、数字和下划线（`_`）\n*   变量不能使用保留关键字作为名称（例如，像`class`、`continue`、`break`、`print`等词，它们是\
  \ Python 语言中预定义的术语，具有特殊含义，不能作为变量名）\n\n### 运算符\n\n以下是 Python 中一些常用的运算符。\n\n**算术运算符**：接受两个整数或浮点数值，执行运算，并返回一个值。\n\
  \nPython 支持以下算术运算符：\n\n*   `**`（指数）\n*   `%`（取模或余数）\n*   `//`（取整商）\n*   `*`（乘法）\n\
  *   `-`（减法）\n*   `+`（加法）\n\n运算顺序至关重要。括号优先于指数，指数优先于除法和乘法，除法和乘法优先于加法和减法。有一个缩写——P.E.D.M.A.S.（Please\
  \ Excuse My Dear Aunt Sally）——可以用来记住这些运算的顺序，以理解在算术表达式中应首先应用哪个运算符。示例如下：\n\n```\n\
  (1+9)/2-3\n```\n\n输出：\n\n```\n2.0\n```\n\n在上述表达式中，首先执行括号内的运算，得到`10`，然后是除法，得到`5`，最后是减法，最终输出为`2`。\n\
  \n**比较运算符**：这些运算符比较两个值，并得出`true`或`false`值。Python 支持以下比较运算符：\n\n*   `>`：大于\n*   `<`：小于\n\
  *   `<=`：小于或等于\n*   `>=`：大于或等于\n*   `==`：等于。请注意，这与赋值运算符（`=`）不同\n*   `!=`（不等于）\n\n\
  **逻辑（或布尔）运算符**：与比较运算符类似，它们也得出`true`或`false`值。这些运算符作用于布尔变量或表达式。Python 支持以下逻辑运算符：\n\
  \n*   `and`运算符：使用此运算符的表达式，仅当其所有子表达式都为`True`时才计算为`True`。否则，如果其中任何一个为`False`，则表达式计算为`False`。\n\
  \n    `and`运算符的使用示例如下所示。\n\n    ```\n    (2>1) and (1>3)\n    ```\n\n    输出：\n\n\
  \    ```\n    False\n    ```\n\n*   `or`运算符：使用`or`运算符的表达式，如果表达式中的任何一个子表达式为`True`，则计算为`True`。如果所有子表达式都计算为`False`，则表达式计算为`False`。\n\
  \n    `or`运算符的使用示例如下所示。\n\n    ```\n    (2>1) or (1>3)\n    ```\n\n    输出：\n\n \
  \   ```\n    True\n    ```\n\n*   `not`运算符：使用`not`运算符的表达式，如果表达式为`False`，则计算为`True`，反之亦然。\n\
  \n    `not`运算符的使用示例如下所示。\n\n    ```\n    not(1>2)\n    ```\n\n    输出：\n\n    ```\n\
  \    True\n    ```\n\n\n\n### 赋值运算符\n\n这些运算符用于为变量或操作数赋值。以下是 Python 中使用的赋值运算符列表：\n\
  \n- `=`（将值赋给变量）\n- `+=`（将右侧的值加到左侧的操作数上）\n- `-=`（从左侧的操作数中减去右侧的值）\n- `*=`（将左侧的操作数乘以右侧的值）\n\
  - `%=`（返回左侧操作数除以右侧值后的余数）\n- `/=`（返回左侧操作数除以右侧值后的商）\n- `//=`（返回左侧操作数除以右侧值后商的整数部分）\n\
  \n下面给出了一些使用这些赋值运算符的示例。\n\n```\nx=5 #将值 5 赋给变量 x\nx+=1 #该语句将 x 加 1（等价于 x=x+1）\nx-=1\
  \ #该语句将 x 减 1（等价于 x=x-1）\nx*=2 #将 x 乘以 2（等价于 x=x*2）\nx%=3 #等价于 x=x%3，返回余数\nx/=3\
  \ #等价于 x=x/3，返回商的整数和小数部分\nx//=3 #等价于 x=x//3，返回 x 除以 3 后商的整数部分\n```\n\n### 身份运算符（`is`\
  \ 和 `not is`）\n\n这些运算符用于检查两个对象是否相等，即两个对象是否指向相同的值，并根据它们是否相等返回一个布尔值（`True`/`False`）。在下面的示例中，三个变量\
  \ `x`、`y` 和 `z` 包含相同的值，因此，当比较 `x` 和 `z` 时，身份运算符（`is`）返回 `True`。\n\n示例：\n\n```\n\
  x=3\ny=x\nz=y\nx is z\n```\n\n输出：\n\n```\nTrue\n```\n\n### 成员运算符（`in` 和 `not in`）\n\
  \n这些运算符用于检查特定值是否存在于字符串或容器（如列表和元组，将在下一章讨论）中。如果值存在，`in` 运算符返回 `True`；如果值不存在于字符串或容器中，`not\
  \ in` 运算符返回 `True`。\n\n```\n'a' in 'and'\n```\n\n输出：\n\n```\nTrue\n```\n\n## 数据类型\n\
  \n数据类型是变量的类别或类型，基于其存储的值。\n\n可以使用 `type` 函数获取变量或常量的数据类型。\n\n```\ntype(45.33)\n```\n\
  \n输出：\n\n```\nfloat\n```\n\n一些常用的数据类型见表 1-2。\n\n**表 1-2** Python 中的常见数据类型\n\n| 数据类型\
  \ | 数据类型名称 | 示例 |\n| --- | --- | --- |\n| 数值数据 | `int`：用于不带小数点的数字<br>`float`：用于带小数点的数字\
  \ | `#int`<br>`a=1`<br>`#float`<br>`b=2.4` |\n| 序列 | 序列存储多个值。Python 中的一些序列包括：<br>`list`<br>`range`<br>`tuple`\
  \ | `#tuple`<br>`a=(1,2,3)`<br>`#list`<br>`b=[1,2,3]`<br>`#range`<br>`c=range(5)`\
  \ |\n| 字符或文本 | `str` 是用于在引号内存储单个字符或字符序列的数据类型 | `#单个字符`<br>`X='a'`<br>`#多个字符`<br>`x='hello\
  \ world'`<br>`#多行`<br>`x='''hello world`<br>`good morning'''` |\n| 布尔数据 | `bool`\
  \ 是用于存储 `True` 或 `False` 值的数据类型 | `X=True`<br>`Y=False` |\n| 映射对象 | `dict` 是字典（将键映射到值的对象）的数据类型\
  \ | `x={'Apple':'fruit','Carrot':'vegetable'}` |\n\n### 表示日期和时间\n\nPython 有一个名为\
  \ `datetime` 的模块，它允许我们定义日期、时间或持续时间。\n\n我们首先需要导入此模块，以便使用该模块中可用的函数来定义日期或时间对象，使用以下语句。\n\
  \n```\nimport datetime\n```\n\n让我们使用该模块中的方法来定义各种日期/时间对象。\n\n#### 日期对象\n\n可以使用 `date`\
  \ 方法定义包含日、月、年的日期，如下所示。\n\n```\ndate=datetime.date(year=1995,month=1,day=1)\nprint(date)\n\
  ```\n\n输出：\n\n```\n1995-01-01\n```\n\n请注意，`date` 方法的三个参数——日、月和年——都是必需的。如果在定义 `date`\
  \ 对象时省略了其中任何一个参数，就会发生错误，如下所示。\n\n```\ndate=datetime.date(month=1,day=1)\nprint(date)\n\
  ```\n\n输出：\n\n```\nTypeError                         Traceback (most recent call\
  \ last)\n in \n----> 1 date=datetime.date(month=1,day=1)\n2 print(date)\nTypeError:\
  \ function missing required argument 'year' (pos 1)\n```\n\n#### 时间对象\n\n要在 Python\
  \ 中定义存储时间的对象，我们使用 `time` 方法。\n\n可以传递给此方法的参数包括小时、分钟、秒或微秒。请注意，与 `date` 方法不同，`time`\
  \ 方法的参数不是必需的（可以省略）。\n\n```\ntime=datetime.time(hour=12,minute=0,second=0,microsecond=0)\n\
  print(\"midnight:\",time)\n```\n\n输出：\n\n```\nmidnight: 00:00:00\n```\n\n#### Datetime\
  \ 对象\n\n我们还可以使用 `datetime` 方法定义一个同时包含日期和时间的 datetime 对象，如下所示。对于此方法，日期参数——日、月和年——是必需的，但时间参数（如小时、分钟等）可以省略。\n\
  \n```\ndatetime1=datetime.datetime(year=1995,month=1,day=1,hour=12,minute=0,second=0,microsecond=0)\n\
  print(\"1st January 1995 midnight:\", datetime1)\n```\n\n输出：\n\n```\n1st January\
  \ 1995 midnight: 1995-01-01 12:00:00\n```\n\n#### Timedelta 对象\n\n`timedelta` 对象表示特定的时间段，并使用\
  \ `timedelta` 方法创建。\n\n让我们创建一个存储 17 天时长的 `timedelta` 对象。\n\n```\ntimedelta1=datetime.timedelta(weeks=2,days=3)\n\
  timedelta1\n```\n\n输出：\n\n```\ndatetime.timedelta(days=17)\n```\n\n在创建 `timedelta`\
  \ 对象时，您还可以添加其他参数，如秒、分钟和小时。\n\n`timedelta` 对象可以添加到现有的日期或 datetime 对象中，但不能添加到时间对象中。\n\
  \n将持续时间（`timedelta` 对象）添加到 `date` 对象：\n\n```\n#支持将持续时间添加到日期对象\ndate1=datetime.date(year=1995,month=1,day=1)\n\
  timedelta1=datetime.timedelta(weeks=2,days=3)\ndate1+timedelta1\n```\n\n输出：\n\n\
  ```\ndatetime.date(1995, 1, 18)\n```\n\n将持续时间（`timedelta` 对象）添加到 `datetime` 对象：\n\
  \n```\n#支持将持续时间添加到 datetime 对象\ndatetime1=datetime.datetime(year=1995,month=2,day=3)\n\
  timedelta1=datetime.timedelta(weeks=2,days=3)\ndatetime1+timedelta1\n```\n\n输出：\n\
  \n```\ndatetime.datetime(1995, 2, 20, 0, 0)\n```\n\n将持续时间添加到 `time` 对象会导致错误：\n\n\
  ```\n#不支持将持续时间添加到时间对象\ntime1=datetime.time(hour=12,minute=0,second=0,microsecond=0)\n\
  timedelta1=datetime.timedelta(weeks=2,days=3)\ntime1+timedelta1\n```\n\n输出：\n\n\
  ```\nTypeError                             Traceback (most recent call last)\n in\
  \ \n2 time1=datetime.time(hour=12,minute=0,second=0,microsecond=0)\n3 timedelta1=datetime.timedelta(weeks=2,days=3)\n\
  ----> 4 time1+timedelta1\nTypeError: unsupported operand type(s) for +: 'datetime.time'\
  \ and 'datetime.timedelta'\n```\n\n## 延伸阅读\n\n了解更多关于 Python datetime 模块的信息：  \n\
  [`https://docs.python.org/3/library/datetime.html`](https://docs.python.org/3/library/datetime.html)\n\
  \n\n\n#### 字符串操作\n\n字符串是由一个或多个字符组成的序列，用引号括起来（单引号和双引号均可）。字符串的数据类型是 `str`。与 Java 和\
  \ C 等较老的语言不同，Python 不支持字符数据类型。即使是单个字符，如 `'a'`、`'b'`，也作为字符串存储。字符串在内部以数组形式存储，并且是不可变的（无法修改）。让我们看看如何定义字符串。\n\
  \n#### 定义字符串\n\n单行字符串可以使用单引号或双引号定义。\n\n```\nx='All that glitters is not gold'\n\
  #或者\nx=\"All that glitters is not gold\"\n```\n\n对于多行字符串，请使用三引号：\n\n```\nx='''Today\
  \ is Tuesday.\nTomorrow is Wednesday'''\n```\n\n#### 字符串操作\n\n可以对字符串使用各种函数，下面将解释其中一些。\n\
  \n1.  查找字符串长度：可以使用 `len` 函数计算字符串的长度，如下所示。\n\n    ```\n    len('Hello')\n    ```\n\
  \n    输出：\n\n    ```\n    5\n    ```\n\n2.  访问字符串中的单个元素：\n\n    可以使用索引运算符 `[]` 提取字符串中的单个字符。\n\
  \n    ```\n    x='Python'\n    x[3]\n    ```\n\n    输出：\n\n    ```\n    'h'\n  \
  \  ```\n\n3.  字符串切片：切片是指提取对象（此处为字符串）的一部分或子集。切片也可以用于其他可迭代对象，如列表和元组，我们将在下一章讨论。冒号运算符用于切片，带有可选的起始、结束和步进索引。下面提供了一些切片示例。\n\
  \n    ```\n    x='Python'\n    x[1:] #从第二个字符到末尾\n    ```\n\n    输出：\n\n    ```\n\
  \    'ython'\n    ```\n\n    更多切片示例：\n\n    ```\n    x[:2] #前两个字符。起始索引假定为 0\n  \
  \  ```\n\n    输出：\n\n    ```\n    'Py'\n    ```\n\n    ```\n    x[::-1]#反转字符串，最后一个字符的索引为\
  \ -1\n    ```\n\n    输出：\n\n    ```\n    'nohtyP'\n    ```\n\n4.  对齐：\n\n    要在右侧或左侧添加空格，或使字符串居中，可使用\
  \ `rjust`、`ljust` 或 `center` 方法。传递给此类方法的第一个参数是新字符串的长度，可选的第二个参数是用于填充的字符。默认情况下，使用空格进行填充。\n\
  \n    ```\n    '123'.rjust(5,\"*\")\n    ```\n\n    输出：\n\n    ```\n    '**123'\n\
  \    ```\n\n5.  更改大小写：要更改字符串的大小写，可使用 `upper` 或 `lower` 方法，如下所示。\n\n    ```\n   \
  \ 'COLOR'.lower()\n    ```\n\n    输出：\n\n    ```\n    'color'\n    ```\n\n6.  检查字符串内容：\n\
  \n    要检查字符串是否以给定字符开头或结尾，可使用 `startswith` 或 `endswith` 方法。\n\n    ```\n    'weather'.startswith('w')\n\
  \    ```\n\n    输出：\n\n    ```\n    True\n    ```\n\n7.  移除字符串中的空白：\n\n    要移除字符串中的空格，可使用\
  \ `strip` 方法（移除两端的空格）、`rstrip`（移除右端的空格）或 `lstrip` 方法（移除左端的空格）。示例如下。\n\n    ```\n\
  \    '  Hello'.lstrip()\n    ```\n\n    输出：\n\n    ```\n    'Hello'\n    ```\n\n\
  8.  检查字符串内容：\n\n    有几种方法可以检查字符串包含的内容，例如 `isalpha`、`isupper`、`isdigit`、`isalnum`\
  \ 等。只有当字符串中的所有字符都满足给定条件时，所有这些方法才返回 `True`。\n\n    ```\n    '981'.isdigit()#检查是否为数字\n\
  \    ```\n\n    输出：\n\n    ```\n    True\n    ```\n\n    ```\n    'Abc'.isupper()\n\
  \    #检查所有字符是否为大写。由于并非所有字母都是大写，因此条件不满足\n    ```\n\n    输出：\n\n    ```\n    False\n\
  \    ```\n\n9.  连接字符串列表：\n\n    `join` 方法将字符串列表合并为一个字符串。在 `join` 方法的左侧，我们在引号中指定用于连接字符串的分隔符。在右侧，我们传递各个字符串的列表。\n\
  \n    ```\n    ' '.join(['Python','is','easy','to','learn'])\n    ```\n\n    输出：\n\
  \n    ```\n    'Python is easy to learn'\n    ```\n\n10. 拆分字符串：\n\n    `split` 方法的作用与\
  \ `join` 方法相反。它将一个字符串分解为单个单词的列表并返回该列表。如果我们只向此方法传递一个单词，它将返回一个仅包含该单词的列表，并且不会进一步拆分字符串。\n\
  \n    ```\n    'Python is easy to learn'.split()\n    ```\n\n    输出：\n\n    ```\n\
  \    ['Python', 'is', 'easy', 'to', 'learn']\n    ```\n\n### 条件语句\n\n顾名思义，条件语句用于评估一个条件或一组条件。在\
  \ Python 中，使用 `if-elif-else` 结构来实现此目的。Python 没有某些其他语言中用于条件执行的 `switch-case` 结构。\n\
  \n条件语句以 `if` 关键字以及要评估的表达式或条件开头。后面跟着一个代码块，该代码块仅在条件评估为 `True` 时执行；否则将跳过。\n\n`else`\
  \ 语句（不包含任何条件）用于在 `if` 语句中提到的条件不满足时执行一个代码块。`elif` 语句用于评估特定条件。`elif` 语句的顺序很重要。如果其中一个\
  \ `elif` 语句评估为 `True`，则其后的 `elif` 语句将根本不会执行。`if` 语句也可以单独存在，无需提及 `else` 或 `elif`\
  \ 语句。\n\n以下示例演示了 `if-elif-else` 结构。\n\n```\n#if-elif-else\ncolor=input('请输入以下颜色之一\
  \ - red, orange 或 blue:')\nif color=='red':\n    print('你最喜欢的颜色是红色')\nelif color=='orange':\n\
  \    print('你最喜欢的颜色是橙色')\nelif color=='blue':\n    print('你最喜欢的颜色是蓝色')\nelse:\n\
  \    print(\"你输入了错误的颜色\")\n```\n\n输出：\n\n```\n请输入以下颜色之一 - red, orange 或 blue:pink\n\
  你输入了错误的颜色\n```\n\n条件语句可以嵌套，这意味着我们可以在一个条件语句（外层）中包含另一个条件语句（内层）。在使用嵌套语句时，需要特别注意缩进。下面是一个嵌套\
  \ `if` 语句的示例。\n\n```\n#嵌套条件语句\nx=20\nif x<10:\n    if x<5:\n        print(\"数字小于\
  \ 5\")\n    else:\n        print(\"数字大于 5\")\nelse:\n    print(\"数字大于 10\")\n```\n\
  \n输出：\n\n```\n数字大于 10\n```\n\n延伸阅读：查看更多关于 `if` 语句的内容：[`docs.python.org/3/tutorial/controlflow.html#if-statements`](https://docs.python.org/3/tutorial/controlflow.html%2523if-statements)\n\
  \n### 循环\n\n循环用于重复执行部分代码。代码块的单次执行称为一次迭代，循环通常会经历多轮迭代。Python 中使用两种类型的循环——`for` 循环和\
  \ `while` 循环。\n\n\n\n### While 循环\n\n当我们需要在某个条件为 `True` 时重复执行特定指令，就会使用 `while` 循环。代码块执行完毕后，执行流程会回到代码块的开头。下面是一个示例。\n\
  \n代码：\n\n```\n#while loop with continue statement\nwhile True:\nx=input('Enter the\
  \ correct color:')\nif(x!='red'):\nprint(\"Color needs to be entered as red\")\n\
  continue\nelse:\nbreak\n```\n\n输出：\n\n```\nEnter the correct color:blue\nColor needs\
  \ to be entered as red\nEnter the correct color:yellow\nColor needs to be entered\
  \ as red\nEnter the correct color:red\n```\n\n在上面的示例中，第一条语句（`while True`）用于执行一个无限循环。一旦用户输入了正确长度的用户名，`break`\
  \ 语句就会将执行流程带出循环；否则，会向用户显示一条消息，要求输入正确长度的用户名。请注意，在代码块的最后一条语句执行完毕后，执行流程会自动回到循环的开头。\n\
  \n`break` 语句用于将控制权带出循环。当我们有一个想要跳出的无限循环时，它非常有用。\n\n`continue` 语句则相反——它将控制权带回循环的开头。关键字\
  \ `break` 和 `continue` 都可以与循环和条件语句（如 `if/else`）一起使用。\n\n延伸阅读：\n\n了解更多关于以下内容：\n\n\
  - `break` 和 `continue` 语句：[`https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements-and-else-clauses-on-loops`](https://docs.python.org/3/tutorial/controlflow.html%2523break-and-continue-statements-and-else-clauses-on-loops)\n\
  - `while` 语句：[`https://docs.python.org/3/reference/compound_stmts.html#while`](https://docs.python.org/3/reference/compound_stmts.html%2523while)\n\
  \n### For 循环\n\n`for` 循环用于执行一个预定次数的代码块。`for` 循环可以与任何类型的可迭代对象一起使用，即可供循环重复运行实例或迭代的值序列。这些可迭代对象包括列表、元组、字典和字符串。\n\
  \n`for` 循环也常与 `range` 函数一起使用。`range` 函数会创建一个 `range` 对象，这是另一种可迭代对象，它是一个间隔均匀的整数序列。考虑以下示例，我们使用\
  \ `for` 循环计算前五个奇数的和。\n\n代码：\n\n```\n#for loop\nsum=0\nfor i in range(1,10,2):\n\
  sum=sum+i\nprint(sum)\n```\n\n输出：\n\n```\n25\n```\n\n`range` 函数有三个参数：起始参数、停止参数和步长参数。这三个参数都不是必须的。从\
  \ 0 到 9（包括 0 和 9）的数字可以通过 `range(10)`、`range(0,10)` 或 `range(0,10,1)` 生成。默认的起始参数是\
  \ 0，默认的步长参数是 1。\n\n`for` 循环也可以嵌套（包含一个外层循环和任意数量的内层循环），如下所示。\n\n代码：\n\n```\n#nested\
  \ for loop\nfor i in 'abcd':\nfor j in range(4):\nprint(i,end=\" \")\nprint(\"\\\
  n\")\n```\n\n输出：\n\n```\na a a a\nb b b b\nc c c c\nd d d d\n```\n\n延伸阅读：了解更多关于\
  \ `for` 语句：[`https://docs.python.org/3/tutorial/controlflow.html#for-statements`](https://docs.python.org/3/tutorial/controlflow.html%2523for-statements)\n\
  \n## 函数\n\n函数可以被看作一个“黑箱”（用户无需关心函数的内部工作原理），它接收输入，进行处理，并产生输出。函数本质上是一组执行特定任务的语句块。\n\
  \n在 Python 中，使用 `def` 关键字定义函数。其后跟函数名和一个或多个可选参数。参数是仅存在于函数内部的变量。在函数内部定义的变量具有局部作用域，这意味着它们不能在函数外部被访问。它们也被称为局部变量。外部代码或函数不能操作在函数内部定义的变量。\n\
  \n函数可以有一个可选的返回值。返回值是函数产生的输出，并被返回给主程序。调用函数意味着向函数提供输入（参数）以执行其任务并产生输出。\n\n函数的实用性在于其可重用性。它们还有助于避免代码冗余，并将代码组织成逻辑块。我们只需提供它运行指令所需的一组输入即可。可以重复调用一个函数，而无需手动输入相同的代码行。\n\
  \n例如，假设你想找出给定数字列表中的质数。一旦你编写了一个用于检查整数是否为质数的函数，你就可以简单地将列表中的每个数字作为参数传递给该函数并调用它，而无需为你想要测试的每个整数编写相同的代码行。\n\
  \n代码：\n\n```\ndef checkPrime(i):\n#Assume the number is prime initially\nisPrime=True\n\
  for j in range(2,i):\n# checking if the number is divisible by any number between\
  \ 2 and i\nif i%j==0:\n#If it is divisible by any number in the j range, it is not\
  \ prime\nisPrime=False\n# This is the same as writing if isPrime==True\nif isPrime:\n\
  print(i ,\"is prime\")\nelse:\nprint(i, \"is not prime\")\nfor i in range(10,20):\n\
  checkPrime(i)\n```\n\n输出：\n\n```\n10 is not prime\n11 is prime\n12 is not prime\n\
  13 is prime\n14 is not prime\n15 is not prime\n16 is not prime\n17 is prime\n18\
  \ is not prime\n19 is prime\n```\n\n延伸阅读：了解更多关于定义函数：[`https://docs.python.org/3/tutorial/controlflow.html#defining-functions`](https://docs.python.org/3/tutorial/controlflow.html%2523defining-functions)\n\
  \n### 匿名函数或 Lambda 函数\n\n匿名函数或 lambda 函数使用 `lambda` 关键字定义。它们是单表达式函数，提供了一种紧凑的定义函数的方式，而无需将函数对象绑定到名称上。这些函数被称为“匿名”的原因在于它们不需要名称。考虑以下示例，我们使用\
  \ lambda 函数计算两个数的和。\n\n代码：\n\n```\n(lambda x,y:(x+y))(5,4)\n```\n\n输出：\n\n```\n\
  9\n```\n\n请注意匿名函数的语法。它以 `lambda` 关键字开头，后跟参数（本例中为 `x` 和 `y`）。然后是冒号，冒号之后是一个会被计算并返回的表达式。无需提及\
  \ return 语句，因为此类函数中存在隐式返回。注意，该函数也没有名称。\n\n\n\n## 语法错误与异常\n\n语法错误是用户在编写代码时可能无意中犯下的错误，例如拼写错误的关键字、未缩进代码等。而异常则是在程序执行过程中发生的错误。用户在运行程序时可能输入了不正确的数据。如果你想用一个数（比如\
  \ `a`）除以另一个数（比如 `b`），但给分母（`b`）赋值为 0，就会产生异常。这些由 Python 自动生成并显示给用户的异常，可能无法清晰地传达问题所在。通过使用\
  \ `try-except` 结构进行异常处理，我们可以构建用户友好的消息，帮助用户更好地纠正错误。\n\n异常处理包含两个部分。首先，我们将可能导致错误的代码放在\
  \ `try` 子句下。然后，在 `except` 子句中，我们尝试处理 `try` 块中导致错误的原因。我们在 `except` 子句中提及异常类的名称，后跟一个代码块，在其中处理错误。处理错误的一种直接方法是打印一条消息，向用户提供更多关于需要纠正什么的信息。\n\
  \n请注意，所有异常都是派生自 `BaseException` 类的对象，并遵循一个层次结构。\n\n延伸阅读：Python 中异常的类层次结构可在此处找到：[`https://docs.python.org/3/library/exceptions.html#exception-hierarchy`](https://docs.python.org/3/library/exceptions.html%2523exception-hierarchy)\n\
  \n下面是一个简单程序的示例，分别展示了有无异常处理的情况。\n\n```\nwhile True:\ntry:\nn=int(input('请输入你的分数：'))\n\
  print('你获得了 ',n,' 分')\nbreak\nexcept ValueError:\nprint('请输入一个整数值')\n```\n\n输出：\n\
  \n```\n请输入你的分数（不含小数点）：abc\n请输入一个整数值\n请输入你的分数（不含小数点）：45.5\n请输入一个整数值\n请输入你的分数（不含小数点）：90\n\
  你获得了  90 分\n```\n\n相同程序（无异常处理）：\n\n代码：\n\n```\nn=int(input('请输入你的分数：'))\nprint('你获得了\
  \ ',n,' 分')\n```\n\n输出：\n\n```\n请输入你的分数：ninety three\n\nValueError             \
  \            Traceback (most recent call last)\n in \n----> 1 n=int(input('请输入你的分数：'))\n\
  2 print('你获得了 ',n,' 分')\nValueError: invalid literal for int() with base 10: 'ninety\
  \ three'\n```\n\n上述代码中可能导致错误的语句是：`int(input('请输入你的分数：'))`。`int` 函数需要一个整数作为参数。如果用户输入浮点数或字符串值，就会产生\
  \ `ValueError` 异常。当我们使用 `try-except` 结构时，`except` 子句会打印一条消息，要求用户更正输入，这使得提示信息更加明确。\n\
  \n## 处理文件\n\n我们可以使用 Python 中的方法或函数来读取或写入文件。换句话说，我们可以创建文件、向其中添加内容或文本，并使用 Python 提供的方法读取其内容。\n\
  \n这里，我们讨论如何读取和写入逗号分隔值（CSV）文件。CSV 文件或逗号分隔文件是 Excel 电子表格的文本版本。\n\n所有这些操作的函数都在 CSV\
  \ 模块中定义。要使用其各种方法，必须首先使用 `import csv` 语句导入此模块。\n\n### 从文件读取\n\n从 Python 读取文件涉及以下步骤：\n\
  \n1.  使用 `with open` 语句，我们可以打开一个现有的 CSV 文件，并将生成的文件对象分配给一个变量或文件句柄（在以下示例中命名为 `f`）。请注意，我们需要使用绝对路径或相对路径指定文件的路径。之后，我们需要指定打开文件的模式。对于读取，模式是\
  \ `r`。如果我们不指定模式，文件默认以读取模式打开。\n\n2.  接下来，有一个代码块，首先使用 `csv.reader` 函数将文件内容存储在一个读取对象中，其中我们将文件句柄\
  \ `f` 作为参数传递。\n\n3.  然而，此文件的内容不能直接通过此读取对象访问。我们创建一个空列表（在以下示例中命名为 `contents`），然后使用\
  \ `for` 循环逐行遍历我们在步骤 2 中创建的读取对象，并将其追加到此列表中。然后可以打印此列表以查看我们创建的 CSV 文件的行。\n\n代码：\n\n\
  ```\n#从文件读取\nimport csv\nwith open('animals.csv') as f:\ncontents=csv.reader(f)\n\
  lines_of_file=[]\nfor line in contents:\nlines_of_file+=line\nlines_of_file\n```\n\
  \n### 写入文件\n\n写入文件涉及以下步骤。\n\n1.  使用 `open` 函数，打开一个现有的 CSV 文件，或者如果文件不存在，`open` 函数会创建一个新文件。如果你想覆盖内容或写入新文件，请将文件名（带绝对路径）放在引号中传递，并将模式指定为\
  \ `w`。如果你只想向现有文件追加一些行，请使用 `a` 或 `append` 模式。由于我们在此情况下不想覆盖，我们使用追加（`a`）模式打开文件。将其存储在一个变量或文件句柄中，并给它一个名称，比如\
  \ `f`。\n\n2.  使用 `csv.writer()` 函数，创建一个写入器对象来添加内容，因为我们无法直接写入 CSV 文件。将变量（文件句柄）`f`\
  \ 作为参数传递给此函数。\n\n3.  对上一步创建的写入器对象调用 `writerow` 方法。要传递给此方法的参数是要添加的新行（作为列表）。\n\n4.\
  \  在你的系统上打开 CSV 文件，查看更改是否已生效。\n\n代码：\n\n```\n#写入文件\nwith open(r'animals.csv',\"\
  w\") as f:\nwriter_object=csv.writer(f,delimiter=\",\")\nwriter_object.writerow(['sheep','lamb'])\n\
  ```\n\n可用于 `open` 函数打开文件的模式有：\n\n*   `r`：仅以读取模式打开文件。\n*   `w`：仅以写入模式打开文件。如果文件已存在，则会覆盖它。\n\
  *   `a`：以在文件末尾写入的模式打开文件。它会保留原始文件内容。\n*   `w+`：以读取和写入模式打开文件。\n\n延伸阅读：查看更多关于在 Python\
  \ 中读写文件的内容：[`https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files`](https://docs.python.org/3/tutorial/inputoutput.html%2523reading-and-writing-files)\n\
  \n\n\n## Python 中的模块\n\n模块是一个扩展名为 `.py` 的 Python 文件。可以将其想象成实体图书馆的一个分区。正如图书馆的每个分区（例如，小说、体育、健身）都包含性质相似的书籍一样，模块包含彼此相关的函数。例如，`matplotlib`\
  \ 模块包含所有与绘制图表相关的函数。一个模块也可以包含另一个模块。例如，`matplotlib` 模块就包含一个名为 `pyplot` 的子模块。Python\
  \ 中有许多内置函数，它们是标准库的一部分，使用它们无需导入任何模块。\n\n可以使用 `import` 关键字后跟模块名称来导入模块：\n\n```\nimport\
  \ matplotlib\n```\n\n你也可以使用 `from` 关键字导入模块的一部分（子模块或函数）。这里，我们从 `math` 模块中导入 `cosine`\
  \ 函数：\n\n```\nfrom math import cos\n```\n\n在 Python 中创建和导入自定义模块需要以下步骤：\n\n1.  在开始菜单旁边的搜索栏中输入“idle”。Python\
  \ shell 打开后，通过选择 *File ➤ New File* 创建一个新文件。\n\n2.  创建一些功能相似的函数。作为示例，这里我们创建一个简单的模块，其中包含两个函数——`sin_angle`\
  \ 和 `cos_angle`。这些函数计算角度（以度为单位）的正弦和余弦。\n\n    ```\n    import math\n    def sin_angle(x):\n\
  \        y = math.radians(x)\n        return math.sin(y)\n    def cos_angle(x):\n\
  \        y = math.radians(x)\n        return math.cos(y)\n    ```\n\n3.  保存文件。文件应保存的目录与\
  \ Python 运行的目录相同。你可以使用以下代码获取当前工作目录：\n\n    ```\n    import os\n    os.getcwd()\n\
  \    ```\n\n4.  使用 `import` 语句，导入并使用你刚刚创建的模块。\n\n## Python 增强提案 (PEP) 8 – 代码编写标准\n\
  \nPython 增强提案 (PEP) 是一份技术文档，为 Python 语言中引入的新特性提供文档说明。PEP 文档有多种类型，其中最重要的是 PEP 8。PEP\
  \ 8 文档为用 Python 编写代码提供了风格指南。PEP 8 的主要重点是提供一套一致的规则，以提高代码的可读性——任何阅读你代码的人都应该能够理解你在做什么。你可以在此处找到完整的\
  \ PEP8 文档：[`https://www.python.org/dev/peps/pep-0008/`](https://www.python.org/dev/peps/pep-0008/)\n\
  \nPEP8 针对代码的不同方面提供了若干指南，其中一些总结如下。\n\n*   **缩进**：缩进用于指示代码块的开始。在 Python 中，使用四个空格进行缩进。应避免使用制表符进行缩进。\n\
  \n*   **行长度**：一行代码的最大字符长度为 79 个字符。对于注释，限制为 72 个字符。\n\n*   **命名约定**：PEP 8 也规定了 Python\
  \ 中不同类型对象的命名约定。应使用短名称，并可使用下划线来提高可读性。对于函数、方法、变量、模块和包的命名，请使用小写（全小写字母）表示法。对于常量，使用大写（全大写字母）表示法；对于类，使用\
  \ CapWords（两个单词，每个单词以大写字母开头，单词间无空格）表示法进行命名。\n\n*   **注释**：推荐使用以 `#` 开头并描述整个代码块的块注释。应避免使用内联注释，即与代码行位于同一行的注释，如下所示。如果确实要使用，则应与代码之间用两个空格隔开。\n\
  \n    ```\n    sum += 1  # 将 sum 增加 1\n    ```\n\n*   **导入**：在导入模块以在代码中使用时，应避免通配符导入（使用\
  \ `*` 表示法），如下所示。\n\n    ```\n    from module import *\n    ```\n\n    不应在同一行导入多个包或类。\n\
  \n    ```\n    import a, b\n    ```\n\n    它们应分别在不同的行导入，如下所示。\n\n    ```\n    import\
  \ a\n    import b\n    ```\n\n    应尽可能使用绝对导入，例如：\n\n    ```\n    import x.y\n  \
  \  ```\n\n    或者，我们可以使用这种表示法来导入模块：\n\n    ```\n    from x import y\n    ```\n\n\
  *   **编码**：在 Python 3 中编写代码应使用的编码格式是 UTF-8。\n\n## 总结\n\n*   Python 的语法与 Java 和 C\
  \ 等其他语言不同，Python 中的语句不以分号结尾，并且使用空格（四个空格）进行缩进，而不是花括号。\n\n*   Python 具有基本数据类型，如 `int`、`float`、`str`\
  \ 和 `bool` 等，以及根据变量的数据类型对其进行操作的运算符（算术、布尔、赋值和比较）。\n\n*   Python 使用 `if-elif-else`\
  \ 关键字来实现语句的条件执行。它还使用 `for` 循环和 `while` 循环来重复程序的特定部分。\n\n*   函数有助于重用部分代码并避免冗余。每个函数应只执行一个任务。Python\
  \ 中的函数使用 `def` 关键字定义。匿名函数或 `lambda` 函数提供了一种快捷方式，可以在不将函数绑定到名称的情况下，在一行内编写函数。\n\n*\
  \   模块是相似函数的集合，是一个简单的 Python 文件。除了属于标准库的函数外，任何属于外部模块的函数都需要使用 `import` 关键字导入该模块。\n\
  \n*   Python 具有用于创建、读取和写入文本及 CSV 文件的函数。文件可以以多种模式打开，具体取决于你是要读取、写入还是追加数据。\n\n*   异常处理可用于处理程序执行期间发生的异常。使用\
  \ `try` 和 `except` 关键字，我们可以处理程序中可能引发异常的部分。\n\n*   PEP 8 为 Python 中一系列与编码相关的方面设定了标准，包括空格、制表符和空行的使用，以及命名和编写注释的约定。\n\
  \n下一章将深入探讨容器等主题，例如列表、元组、字典和集合。我们还将讨论一种称为面向对象编程的编程范式，以及如何使用类和对象来实现它。\n\n\n\n## 复习题\n\
  \n**问题 1**\n\n使用嵌套循环计算从 1 到 5 的阶乘。\n\n**问题 2**\n\n函数是使用以下哪个关键字定义的？\n\n1. `def` 关键字\n\
  2. `function` 关键字\n3. `void` 关键字\n4. 不需要关键字\n\n**问题 3**\n\n以下代码的输出是什么？\n\n```\n\
  x=True\ny=False\nz=True\nx+y+z\n```\n\n**问题 4**\n\n编写一个 Python 程序来打印以下序列：\n\n![../images/498042_1_En_1_Chapter/498042_1_En_1_Figi_HTML.jpg](img/498042_1_En_1_Figi_HTML.jpg)\n\
  \n**问题 5**\n\n以下哪个变量使用了正确的语法进行定义？\n\n1. `1x=3`\n2. `x 3=5`\n3. `x`\n4. `x_3=5`\n\
  5. `x$4=5`\n\n**问题 6**\n\n以下代码的输出是什么？（提示：`id` 函数返回对象的内存地址。）\n\n```\nstr1=\"Hello\"\
  \nstr2=str1\nid(str1)==id(str2)\n```\n\n**问题 7**\n\n将字符串 `\"123-456-7890\"` 转换为\
  \ `\"1234567890\"` 格式。请使用 `join` 和 `split` 字符串函数。\n\n**问题 8**\n\n编写一个执行以下任务的函数（文件名作为参数传递）：\n\
  \n- 创建一个以传递给函数的参数为名称的新文本文件\n- 向文件中添加一行文本（`\"Hello World\"`）\n- 读取文件内容\n- 再次打开文件，在第一行下方添加另一行（`\"\
  This is the next line\"`）\n- 重新读取文件并在屏幕上打印内容\n\n**答案**\n\n**问题 1**\n\n解决方案：\n\n\
  ```\n#问题 1\nfor i in range(1,6):\nfact=1\nfor j in range(1,i+1):\nfact=fact*j\n\
  print(\"数字 \",i,\" 的阶乘是:\",fact)\n```\n\n**问题 2**\n\n选项 1：Python 中的函数需要 `def` 关键字。\n\
  \n**问题 3**\n\n输出：2\n\n解释：布尔值 `True` 被视为值 1，`False` 被视为值 0。对布尔变量应用加法运算符是有效的。\n\n\
  **问题 4**\n\n解决方案\n\n```\n#问题 4\nl=range(6)\nfor i in l[::-1]:\nprint(\"*\"*i)\n\
  print(\"\\n\")\n```\n\n**问题 5**\n\n选项 4 是正确的。\n\n让我们逐一检查各个选项：\n\n1. `1x=3`：不正确，因为变量不能以数字开头\n\
  2. `x 3=5`：不正确，因为变量名不能包含空格\n3. `x`：不正确，因为变量需要一个初始值\n4. `x_3=5`：正确；下划线是定义变量时可接受的字符\n\
  5. `x$4=5`：不正确；不允许使用像 `$` 这样的特殊字符\n\n**问题 6**\n\n两个字符串具有相同的值和内存地址。\n\n输出：\n\n```\n\
  True\n```\n\n**问题 7**\n\n这个问题可以用一行代码解决——只需分割字符串，将其转换为列表，然后再将其连接回字符串。\n\n代码：\n\n\
  ```\n\"\".join(list(\"123-456-7890\".split(\"-\")))\n```\n\n**问题 8**\n\n解决方案：\n\n\
  ```\n#问题 8\ndef filefunction(name):\n#以写入模式打开文件\nwith open(name+\".txt\",\"w\")\
  \ as f:\nf.write(\"Hello World\")\n#读取并打印文件内容\nwith open(name+\".txt\",\"r\") as\
  \ f:\nprint(f.read())\n#再次以追加模式打开文件\nwith open(name+\".txt\",\"a\") as f:\nf.write(\"\
  \\nThis is the next line\")\n#重新读取并打印文件中的行\nwith open(name+\".txt\",\"r\") as f:\n\
  print(f.read())\nfilename=input(\"请输入文件名 \")\nfilefunction(filename)\n```\n\n"
- "# 2. 探索容器、类与对象\n\n在本章中，我们将深入学习 Python 中其他一些基本概念——各种类型的容器、可用于每种容器的方法、面向对象编程、类以及对象。\n\
  \n## 容器\n\n在上一章中，我们看到变量可以具有像 `int`、`float`、`str` 等数据类型，但只能保存单个值。容器是可以包含多个值的对象。这些值可以具有相同的数据类型或不同的数据类型。Python\
  \ 中四种内置的容器是：\n\n- 列表\n- 元组\n- 字典\n- 集合\n\n容器也被称为可迭代对象；也就是说，你可以访问或遍历给定容器对象中的每一个值。\n\
  \n在接下来的章节中，我们将更详细地讨论每种容器及其方法。\n\n\n\n### 列表\n\n列表是按顺序存储的一组值。列表是可变的，也就是说，可以修改、添加或删除列表中的值，因此它是一种灵活的容器。\n\
  \n可以通过索引访问单个列表项，索引是方括号内的整数，表示该项的位置。列表的索引从 0 开始。\n\n现在让我们看看如何定义和操作列表。\n\n#### 定义列表\n\
  \n可以通过为列表指定名称和一组用方括号括起来的值来定义列表。\n\n```python\ncolors=['violet','indigo','red','blue','green','yellow']\n\
  ```\n\n#### 向列表添加元素\n\n可以使用不同的方法向列表添加值，如表 2-1 所述。下表中的示例使用了前面代码中创建的 `colors` 列表。\n\
  \n**表 2-1** 向列表添加元素\n\n| 方法 | 描述 | 示例 |\n| --- | --- | --- |\n| `Append` | 在列表末尾添加一个元素。该方法只接受单个值作为参数。\
  \ | `colors.append('white')` `#将值'white'添加到'colors'列表的最后一个元素之后` |\n| `Insert` |\
  \ 在指定位置或索引处添加一个元素。该方法接受两个参数——索引和要添加的值。 | `colors.insert(3,'pink')` `#将值'pink'添加到'colors'列表的第四个位置`\
  \ |\n| `Extend` | 在给定列表末尾添加多个元素（作为一个列表）。该方法接受另一个列表作为参数。 | `colors.extend(['purple','magenta'])`\
  \ `#将值'purple'和'magenta'添加到'colors'列表的末尾` |\n\n#### 从列表中删除元素\n\n就像有多种方法可以向列表添加元素一样，也有多种方法可以从列表中删除值，如表\
  \ 2-2 所述。请注意，这些方法每次只能删除一个元素。\n\n**表 2-2** 从列表中删除元素\n\n| 方法 | 描述 | 示例 |\n| --- |\
  \ --- | --- |\n| `Del` | `del` 关键字删除指定位置的元素。 | `del colors[1]` `#删除'colors'列表的第二个元素`\
  \ |\n| `Remove` | 当知道要删除的元素名称但不知道其位置时使用此方法。 | `colors.remove('white')` `#从'colors'列表中删除元素'white'`\
  \ |\n| `Pop` | 此方法删除并返回列表中的最后一个元素。 | `colors.pop()` `#删除最后一个元素并显示被删除的元素` |\n\n####\
  \ 查找列表中对象的索引（位置）\n\n`index` 方法用于查找列表中特定元素或值的位置（或索引），如下所示。\n\n```python\ncolors.index('violet')\n\
  ```\n\n输出：\n\n```\n\n```\n\n#### 计算列表的长度\n\n`len` 函数返回列表中元素的数量，如下所示。列表的名称作为参数传递给此函数。请注意，`len`\
  \ 是一个函数，而不是方法。方法只能与对象一起使用。\n\n```python\nlen(colors)\n```\n\n输出：\n\n```\n\n```\n\
  \n#### 对列表进行排序\n\n`sort` 方法按升序或降序对列表中的值进行排序。默认情况下，此方法按升序对元素进行排序。如果列表包含字符串，则按字母顺序排序（使用每个字符串的第一个字母），如下所示。\n\
  \n```python\ncolors.sort()\ncolors\n```\n\n输出：\n\n```\n['blue', 'green', 'purple',\
  \ 'red', 'violet', 'white', 'yellow']\n```\n\n请注意，要使 `sort` 方法正常工作，列表必须是同质的（列表中的所有值应为相同的数据类型）。如果列表包含不同数据类型的元素，应用\
  \ `sort` 方法会导致错误。\n\n如果希望按字母降序对元素进行排序，则需要添加 `reverse` 参数并将其设置为 `True`，如下所示。\n\n\
  ```python\ncolors.sort(reverse=True)\ncolors\n```\n\n输出：\n\n```\n['yellow', 'white',\
  \ 'violet', 'red', 'purple', 'green', 'blue']\n```\n\n请注意，如果只想反转列表中元素的顺序而不进行排序，可以使用\
  \ `reverse` 方法，如下所示。\n\n```python\ncolors=['violet','indigo','red','blue','green','yellow']\n\
  colors.reverse()\ncolors\n```\n\n输出：\n\n```\n['yellow', 'green', 'blue', 'red',\
  \ 'indigo', 'violet']\n```\n\n延伸阅读：\n\n查看更多可用于列表的方法：\n\n[`https://docs.python.org/3/tutorial/datastructures.html#more-on-lists`](https://docs.python.org/3/tutorial/datastructures.html%2523more-on-lists)\n\
  \n#### 列表切片\n\n当我们从列表中创建切片时，我们通过根据元素的位置或使用条件选择列表中的特定值，来创建原始列表的子集。列表切片的工作方式与我们在前一章学习的字符串切片类似。\n\
  \n要使用索引创建切片，我们使用冒号运算符（`:`）并指定需要选择的索引的起始值和结束值。\n\n如果在冒号前后没有提供起始值或结束值，则假定起始值是第一个元素的索引（0），结束值是最后一个元素的索引，如下所示。\n\
  \n```python\ncolors[:]\n```\n\n输出：\n\n```\n['Violet', 'Indigo', 'Blue', 'Green',\
  \ 'Yellow', 'Orange', 'Red']\n```\n\n如果使用步长索引，我们也可以使用两次冒号运算符。在下面的语句中，通过指定步长索引为 2，提取了列表中的间隔元素。\n\
  \n```python\ncolors[::2]\n```\n\n输出：\n\n```\n['Violet', 'Blue', 'Yellow', 'Red']\n\
  ```\n\n与字符串一样，列表同时支持正索引和负索引。负索引（从 –1 开始，即列表中最后一个元素的索引）从右向左工作，而正索引（从 0 开始，即列表中第一个元素的索引）从左向右工作。\n\
  \n下面是一个使用负索引进行切片的示例，我们从列表中的最后一个值开始提取间隔元素。\n\n```python\ncolors[-1:-8:-2]\n```\n\n\
  输出：\n\n```\n['Red', 'Yellow', 'Blue', 'Violet']\n```\n\n\n\n#### 从现有列表创建新列表\n\n\
  从现有列表创建新列表有三种方法：列表推导式、`map()` 函数和 `filter()` 函数，下面将逐一介绍。\n\n1. **列表推导式**\n\n列表推导式提供了一种简洁直观的方式，可以从现有列表创建新列表。\n\
  \n我们通过一个示例来理解：从之前创建的列表（`colors`）中创建一个新列表（`colors1`）。这个新列表只包含原列表中包含字母 `'e'` 的元素。\n\
  \n代码：\n\n```python\ncolors1=[color for color in colors if 'e' in color]\ncolors1\n\
  ```\n\n输出：\n\n```\n['violet', 'red', 'blue', 'green', 'yellow']\n```\n\n列表推导式的结构如图\
  \ 2-1 所示。首先是新列表中元素的输出表达式（`color`）。接下来是一个 `for` 循环，用于遍历原列表（注意，列表推导式中不会使用 `while`\
  \ 循环等其他循环方式）。最后，你可以使用 `if/else` 结构添加一个可选条件。\n\n![../images/498042_1_En_2_Chapter/498042_1_En_2_Fig1_HTML.png](img/498042_1_En_2_Fig1_HTML.png)\n\
  \n图 2-1\n\n列表推导式\n\n如果我们不使用列表推导式，而是用循环和条件来创建相同的列表，代码会冗长得多，如下所示。\n\n代码：\n\n```python\n\
  colors1=[]\nfor color in colors:\nif 'e' in color:\ncolors1.append(color)\n```\n\
  \n使用列表推导式时，需要牢记的关键点是：不应牺牲代码的可读性。如果创建新列表涉及过多的条件表达式和循环，最好避免使用列表推导式。\n\n延伸阅读：了解更多关于列表推导式的内容：[`https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions`](https://docs.python.org/3/tutorial/datastructures.html%2523list-comprehensions)\n\
  \n2. **Map 函数**\n\n`map()` 函数用于通过对现有列表应用用户自定义函数或内置函数来创建新列表。`map()` 函数返回一个 map 对象，我们需要使用\
  \ `list()` 函数将其转换为列表。\n\n`map()` 函数接受两个参数：\n- 要应用的函数\n- 要应用该函数的列表\n\n在下面的示例中，我们从\
  \ `colors` 列表创建了一个新列表（`colors1`），并将其元素转换为大写。这里使用了一个匿名（lambda）函数，其后跟着原列表的名称。\n\n\
  代码：\n\n```python\ncolors=['violet','indigo','red','blue','green','yellow']\ncolors1=map(lambda\
  \ x:x.upper(),colors)\ncolors1\n```\n\n输出：\n\n```\n该函数返回一个 map 对象，\n需要使用 `list()`\
  \ 函数将其转换为列表。\n```\n\n代码：\n\n```python\nlist(colors1)\n```\n\n输出：\n\n```\n['VIOLET',\
  \ 'INDIGO', 'RED', 'BLUE', 'GREEN', 'YELLOW']\n```\n\n3. **Filter 函数**\n\n`filter()`\
  \ 函数的语法与 `map()` 函数类似。`map()` 函数在应用函数后会返回原列表中的所有对象，而 `filter()` 函数只返回满足调用 filter\
  \ 函数时指定条件的那些元素。与 `map()` 函数类似，我们传递两个参数（一个 lambda 函数或用户自定义函数，后跟列表名称）。\n\n在下面的示例中，我们从原列表创建了一个新列表，只保留字符数少于五个的元素。\n\
  \n代码：\n\n```python\ncolors2=filter(lambda x:len(x)<5,colors)\nlist(colors2)\n```\n\
  \n输出：\n\n```\n['red', 'blue']\n```\n\n现在我们来讨论如何同时遍历两个或多个列表。\n\n**使用 `zip()` 函数遍历多个列表**\n\
  \n`zip()` 函数提供了一种组合列表并对这些列表联合执行操作的方法，如下所示。需要组合的列表作为参数传递给 `list()` 函数。\n\n代码：\n\n\
  \n\n### `zip` 函数与列表\n\n```python\ncolors=['Violet','Indigo','Blue','Green','Yellow','Orange','Red']\n\
  color_ids=[1,2,3,4,5,6,7]\nfor i,j in zip(colors, color_ids):\n    print(i,\"has\
  \ a serial number\",j)\n```\n\n输出：\n\n```\nViolet has a serial number 1\nIndigo\
  \ has a serial number 2\nBlue has a serial number 3\nGreen has a serial number 4\n\
  Yellow has a serial number 5\nOrange has a serial number 6\nRed has a serial number\
  \ 7\n```\n\n`zip` 函数返回一个元组列表，这些元组存储在一个类型为 `zip` 的对象中。需要将该对象的类型转换为 `list` 类型才能查看这些元组。\n\
  \n代码：\n\n```python\nlist(zip(colors,color_ids))\n```\n\n输出：\n\n```\n[('Violet',\
  \ 1),\n('Indigo', 2),\n('Blue', 3),\n('Green', 4),\n('Yellow', 5),\n('Orange', 6),\n\
  ('Red', 7)]\n```\n\n下一个函数 `enumerate` 帮助我们访问列表中元素的索引。\n\n### 访问列表中元素的索引\n\n当你想要同时访问给定列表中的对象及其索引时，`enumerate`\
  \ 函数非常有用。该函数返回一系列元组，每个元组包含元素及其索引。下面展示了该函数的使用示例。\n\n代码：\n\n```python\ncolors=['Violet','Indigo','Blue','Green','Yellow','Orange','Red']\n\
  for index,item in enumerate(colors):\n    print(item,\"occurs at index\",index)\n\
  ```\n\n输出：\n\n```\nViolet occurs at index 0\nIndigo occurs at index 1\nBlue occurs\
  \ at index 2\nGreen occurs at index 3\nYellow occurs at index 4\nOrange occurs at\
  \ index 5\nRed occurs at index 6\n```\n\n### 拼接列表\n\n列表的拼接，即合并两个或多个列表，可以使用 `+` 运算符完成。\n\
  \n代码：\n\n```python\nx=[1,2,3]\ny=[3,4,5]\nx+y\n```\n\n输出：\n\n```\n[1, 2, 3, 3, 4,\
  \ 5]\n```\n\n我们可以拼接任意数量的列表。请注意，拼接操作不会修改任何被合并的列表。拼接操作的结果存储在一个新对象中。`extend` 方法也可用于列表的拼接。与\
  \ `+` 运算符不同，`extend` 方法会改变原始列表。\n\n代码：\n\n```python\nx.extend(y)\nx\n```\n\n输出：\n\
  \n```\n[1, 2, 3, 3, 4, 5]\n```\n\n其他算术运算符，如 `-`、`*` 或 `/`，不能用于合并列表。要找出包含数字的两个列表中元素的差值，我们使用列表推导式和\
  \ `zip` 函数，如下所示。\n\n代码：\n\n```python\nx=[1,2,3]\ny=[3,4,5]\nd=[i-j for i,j in zip(x,y)]\n\
  d\n```\n\n输出：\n\n```\n[-2, -2, -2]\n```\n\n### 元组\n\n元组是 Python 中的另一种容器，与列表类似，它按顺序存储元素。与列表中的元素一样，元组中的值可以通过其索引进行访问。然而，元组有一些属性使其与列表区分开来，如下所述。\n\
  \n1. **不可变性**：元组是不可变的，这意味着你不能在元组中添加、删除或更改元素。而列表则允许所有这些操作。\n2. **语法**：定义元组的语法使用圆括号（或小括号）来括起各个值（而列表则使用方括号）。\n\
  3. **速度**：在访问和检索单个元素的速度方面，元组的性能优于列表。\n\n现在让我们学习如何定义元组以及可以与元组一起使用的各种方法。\n\n#### 定义元组\n\
  \n元组可以带括号或不带括号定义，如下面的代码所示。\n\n代码：\n\n```python\na=(1,2,3)\n# 也可以不带括号定义\nb=1,2,3\n\
  # 元组可以只包含一个元素\nc=1,\n# 注意，即使后面没有元素，我们也需要添加逗号，因为这是在告诉解释器这是一个元组。\n```\n\n与列表一样，元组可以包含任何内置数据类型的对象，例如浮点数、字符串、布尔值等。\n\
  \n#### 与元组一起使用的方法\n\n虽然元组不能被更改，但仍有一些操作可以在元组上执行。这些操作如下所述。\n\n##### 元组中对象的频率\n\n`count`\
  \ 方法用于统计给定值在元组中出现的次数：\n\n代码：\n\n\n\n```python\nx=(True,False,True,False,True)\n\
  x.count(True)\n```\n\n输出：\n\n```\n3\n```\n\n#### 元组项的位置/索引\n`index` 方法可用于查找元组中某项的位置。使用上一条语句创建的元组，我们来查找值\
  \ `\"False\"` 出现的位置。\n\n代码：\n\n```python\nx.index(False)\n```\n\n输出：\n\n```\n1\n\
  ```\n\n`index` 方法仅返回该项首次出现的位置。\n\n#### 元组解包\n元组解包是指提取元组中的各个值，并将每个值分别存储到不同变量中的过程。\n\
  \n代码：\n\n```python\na,b,c,d,e=x\n```\n\n如果我们不知道元组中项的数量，可以使用 `*_` 符号将第一个元素之后出现的元素解包到一个列表中，如下所示。\n\
  \n代码：\n\n```python\na,*_=x\nprint(a,_)\n```\n\n输出：\n\n```\nTrue [False, True, False,\
  \ True]\n```\n\n#### 元组的长度\n可以使用 `len` 函数计算元组的长度：\n\n代码：\n\n```python\nlen(x)\n\
  ```\n\n输出：\n\n```\n5\n```\n\n#### 元组的切片\n可以对元组执行切片操作，即创建更小的值子集（在这方面与列表和字符串类似）。示例如下。\n\
  \n代码：\n\n```python\nx[::-1]\n```\n\n输出：\n\n```\n(True, False, True, False, True)\n\
  ```\n\n### 元组的应用\n以下是元组的一些使用场景。\n\n1.  **使用元组创建字典**  \n    字典（我们将在下一节详细讨论）是一种包含一组项的容器（其中键映射到值）。在创建字典时，可以使用元组来定义项。字典项是一个元组，可以使用\
  \ `dict` 方法将字典定义为一个元组列表，如下所示。\n\n    代码：\n\n    ```python\n    x=dict([('color','pink'),('flower','rose')])\n\
  \    x\n    ```\n\n    输出：\n\n    ```\n    {'color': 'pink', 'flower': 'rose'}\n\
  \    ```\n\n2.  **多重赋值**  \n    如前所述，元组解包是将元组拆分为其组成部分的过程。这一原理可用于在一行中初始化多个变量，如下所示。\n\
  \n    代码：\n\n    ```python\n    #元组解包\n    (a,b,c,d)=range(4)\n    print(a,b,c,d)\n\
  \    ```\n\n    输出：\n\n    ```\n    0 1 2 3\n    ```\n\n延伸阅读：在此处查看更多关于元组的内容：[`https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences`](https://docs.python.org/3/tutorial/datastructures.html%2523tuples-and-sequences)\n\
  \n### 字典\n字典是一种包含一组项的容器，每个项将“键”映射到“值”。每个单独的项也称为键/值对。关于字典，还需要注意以下几点：\n\n*   与列表和元组中的值不同，字典中的项不是按顺序存储的。\n\
  *   字典是可变的，与列表类似（即可以对字典对象进行修改）。\n*   字典中的项用花括号括起来。\n\n让我们了解如何定义字典以及可用于字典对象的不同方法。\n\
  \n#### 定义字典\n字典定义为一组用逗号分隔的键/值对，并用一对花括号括起来，如下代码所示。\n\n代码：\n\n```python\nnumbers={'English':'One','Spanish':'Uno','German':'Ein'}\n\
  numbers\n```\n\n输出：\n\n```\n{'English': 'One', 'Spanish': 'Uno', 'German': 'Ein'}\n\
  ```\n\n`\"English\"`、`\"Spanish\"` 和 `\"German\"` 构成键，而 `\"One\"`、`\"Uno\"` 和 `\"\
  Ein\"` 是字典中的值。\n\n也可以使用 `dict` 函数定义字典，正如我们在讨论元组时前面所解释的那样。该函数的参数是一个元组列表，每个元组代表一个键/值对，如下所示。\n\
  \n```python\nnumbers=dict([('English','One'),('Spanish','Uno'),('German','Ein')])\n\
  ```\n\n#### 向字典添加项（键/值对）\n使用键作为索引，可以向字典添加新项，如下所示。\n\n代码：\n\n```python\nnumbers['French']='un'\n\
  numbers\n#已添加一个新的键/值对，键为'French'，值为'un'。\n```\n\n输出：\n\n```\n{'English': 'One',\
  \ 'Spanish': 'Uno', 'German': 'Ein', 'French': 'un'}\n```\n\n\n\n"
