  #### 带状图

  带状图类似于散点图。区别在于带状图中使用的变量类型。散点图的两个变量都是连续的，而带状图将一个分类变量与一个连续变量进行绘制，如图 7-13 所示。Seaborn
  函数 `stripplot` 生成带状图。考虑以下示例，其中 `Age` 变量是连续的，而 `Survived` 变量是分类的。


