- "# 1. 熟悉 Python\n\nPython 是一种开源编程语言，由荷兰程序员吉多·范罗苏姆创建。以英国喜剧团体 Monty Python 命名，Python\
  \ 是一种高级、解释型、开源语言，是当今世界上最受欢迎且增长最快的编程语言之一。它也是数据科学和机器学习的首选语言。\n\n在本章中，我们首先介绍 Jupyter\
  \ notebook——一个用于运行 Python 代码的 Web 应用程序。然后，我们介绍 Python 中的基本概念，包括数据类型、运算符、容器、函数、类、文件处理和异常处理，以及编写代码和模块的标准。\n\
  \n本书的代码示例使用 Python 3.7.3 版本和 Anaconda 4.7.10 版本编写。\n\n\n\n## 技术要求\n\n`Anaconda`\
  \ 是一个被 Python 程序员和数据科学家广泛使用的开源平台。安装该平台会同时安装 Python、Jupyter notebook 应用程序以及数百个库。以下是安装\
  \ Anaconda 发行版所需遵循的步骤。\n\n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig1_HTML.jpg](img/498042_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n安装 Anaconda\n\n1. 打开以下网址：[`https://www.anaconda.com/products/individual`](https://www.anaconda.com/products/individual)\n\
  \n2. 点击适用于您操作系统的安装程序，如图 1-1 所示。安装程序将下载到您的系统。\n\n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig2_HTML.jpg](img/498042_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n启动 Jupyter\n\n1. 打开安装程序（上一步下载的文件）并运行它。\n\n2. 安装完成后，通过在开始菜单旁边的资源管理器（搜索栏）中输入\
  \ `jupyter notebook` 或 `jupyter` 来打开 Jupyter 应用程序，如图 1-2 所示（以 Windows 操作系统为例）。\n\
  \n请按照以下步骤下载本书使用的所有数据文件：\n\n* 点击以下链接：[`https://github.com/DataRepo2019/Data-files`](https://github.com/DataRepo2019/Data-files)\n\
  \n* 选择绿色的 `Code` 菜单，然后从该菜单的下拉列表中点击 `Download ZIP`\n\n* 从下载的 zip 文件夹中解压文件，并将这些文件导入到您的\
  \ Jupyter 应用程序中\n\n现在我们已经安装并启动了 Jupyter，接下来让我们在下一节中了解如何使用这个应用程序。\n\n## Jupyter notebook\
  \ 入门\n\n在讨论 Jupyter notebook 的基本要素之前，我们先讨论一下什么是集成开发环境（或 IDE）。IDE 将编程中涉及的各种活动整合在一起，例如编写和编辑代码、调试以及创建可执行文件。它还包括自动补全（补全用户想要输入的内容，从而使用户能够专注于逻辑和问题解决）和语法高亮（高亮显示语言的各种元素和关键字）等功能。除了\
  \ Jupyter 之外，Python 还有许多 IDE，包括 Enthought Canopy、Spyder、PyCharm 和 Rodeo。Jupyter\
  \ 之所以成为数据科学领域无处不在、事实上的标准，有几个原因。这些原因包括易于使用和定制、支持多种编程语言、平台独立性、便于访问远程数据，以及将输出、代码和多媒体整合于一体的优势。\n\
  \n`JupyterLab` 是 Jupyter notebook 的 IDE。Jupyter notebook 是在用户机器上本地运行的 Web 应用程序。它们可用于加载、清理、分析和建模数据。您可以在\
  \ Jupyter notebook 中添加代码、公式、图像和 Markdown 文本。Jupyter notebook 兼具运行代码以及作为向他人展示和分享工作的平台的双重目的。让我们来看看这个应用程序的各种功能。\n\
  \n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig4_HTML.jpg](img/498042_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\nJupyter 单元格中的简单代码语句\n\n1. **输入和执行代码**\n\n   点击笔记本中的第一个单元格内部，输入一行简单的代码，如图\
  \ 1-4 所示。通过从 `Cell` 菜单中选择 `Run Cells` 来执行代码，或使用快捷键 `Ctrl+Enter`。\n\n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig3_HTML.jpg](img/498042_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n创建新的 Jupyter notebook\n\n1. **打开仪表板**\n\n   在开始菜单旁边的搜索栏中输入 `jupyter notebook`。这将打开\
  \ Jupyter 仪表板。仪表板可用于创建新的笔记本或打开现有的笔记本。\n\n2. **创建新笔记本**\n\n   通过从 Jupyter 仪表板右上角选择\
  \ `New`，然后从出现的下拉列表中选择 `Python 3` 来创建新的 Jupyter notebook，如图 1-3 所示。\n\n![../images/498042_1_En_1_Chapter/498042_1_En_1_Fig5_HTML.jpg](img/498042_1_En_1_Fig5_HTML.jpg)\n\
