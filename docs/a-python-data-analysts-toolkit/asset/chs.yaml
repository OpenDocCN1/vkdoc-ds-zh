  `1`，因为新数据是沿着列轴添加的。 |


  总之，我们可以使用索引运算符、`loc` 索引器、`insert` 方法或 `concat` 函数向 `DataFrame` 添加列。最直接且常用的添加列的方法是使用索引运算符
  `[]`。


