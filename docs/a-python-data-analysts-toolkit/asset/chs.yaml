  \n### 步骤 2：数据整理\n\n在此步骤中，我们将：\n\n*   检查列的数据类型是否被准确识别。如果没有，则更改数据类型：从 `info` 方法的输出中，我们看到所有列的数据类型都已正确识别。\n\
