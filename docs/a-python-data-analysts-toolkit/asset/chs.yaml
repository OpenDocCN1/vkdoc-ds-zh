  通过在索引运算符内将列名作为字符串提及并为其赋值，我们可以添加一列。 |

  | 使用 `insert` 方法 | `combined_ages.insert(2,''class 0'',[18,35])` `combined_ages`
  输出：![../images/498042_1_En_6_Chapter/498042_1_En_6_Figi_HTML.jpg](img/498042_1_En_6_Figi_HTML.jpg)
  `insert` 方法可用于添加列。需要向此方法传递三个参数，如下所述。第一个参数是您要插入新列的索引（在本例中索引为 2，这意味着新列将作为我们 `DataFrame`
  的第三列添加）。第二个参数是您要插入的新列的名称（本例中为 `class 0`）。第三个参数是包含新列值的列表（本例中为 18 和 35）。这三个参数对于 `insert`
  方法成功添加列都是必需的。 |

  | 使用 `loc` 索引器 | `combined_ages.loc[:,''class 4'']=[20,40]` `combined_ages` 输出：![../images/498042_1_En_6_Chapter/498042_1_En_6_Figj_HTML.jpg](img/498042_1_En_6_Figj_HTML.jpg)
  `loc` 索引器通常用于从 Series 和 DataFrame 中检索值，但它也可用于插入列。在前面的语句中，使用 `:` 运算符选择了所有行。该运算符后面跟着要插入的列的名称。该列的值包含在一个列表中。
