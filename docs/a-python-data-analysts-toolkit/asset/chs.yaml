  #### lmplot

  此图是 `regplot` 和分面网格的组合，如图 7-12 所示。使用 `lmplot` 函数，我们可以观察两个连续变量在不同参数值下的关系。在以下示例中，我们绘制了两个数值变量（`Age`
  和 `Fare`）在不同行和列变量构成的网格中的分布。


  代码：


  ```python

  sns.lmplot(x=''Age'',y=''Fare'',row=''Survived'',data=titanic,col=''Sex'')

