  以下总结了 `regplot` 和 `lmplot` 之间的区别：


  *   `regplot` 函数仅接受两个变量作为参数，而 `lmplot` 函数接受多个参数。

  *   `lmplot` 函数在图形对象级别工作，而 `regplot` 函数在坐标轴对象级别工作。


