- '# 第一部分：自设败局


  托马斯·爱迪生在谈及“客户陷阱”时可能说过这样一句话：“人生中许多失败，是因为人们在放弃时没有意识到自己离成功有多近。”


  对于那些最初倾尽所有打造卓越产品、服务和品牌的公司而言，没有什么比眼睁睁看着它们在关键下一步中失败更令人沮丧的了。然而，与“超级客户”陷入失调关系并非偶然发生，而是一种刻意的策略。


  ---


  ### 第 1 章：最大的商业错误


  *当你发现自己站在多数派一边时，请停下来反思。*

  ——马克·吐温


  许多领导公司的人——从大型跨国企业到全新初创公司——都认为，只要能让自己的产品或服务落入“超级客户”手中，所有问题就会奇迹般消失。


  他们的逻辑是这样的：“如果我们能实现足够的销量，利润就会上升，业务就会增长，我们将取得难以想象的辉煌成功。诀窍在于找到越来越大的客户，让他们能购买我们生产的越来越多产品。”


  自世纪之交以来，最具影响力的发展之一便是商业领域大规模客户的崛起。我们称之为*超级客户*。寻找超级客户的诱惑几乎难以抗拒。毕竟，它们存在于经济的每一个领域。


  在消费零售领域，是那些大型卖场：沃尔玛、家得宝等等。在线则是亚马逊。AutoNation 和 Penske Corporation 主导着美国汽车行业的大部分业务。波音和空客统治着航空业，正如
  AT&T 和威瑞森在电信领域一般。鲜花行业则有 FTD 公司、Teleflora 和 1-800-Flowers.com。当然，居于顶端的还有美国联邦政府，它每年在私营部门支出近
  1 万亿美元。山姆大叔是最大的单一买家，从回形针到药品、卡车、手机、机票、法律服务、能源、酒店客房、医疗保健以及信息技术，无所不包。


  诚然，向超级客户销售产品所带来的预期益处极具吸引力。人们认为，更广泛的市场曝光会带来销售额的大幅增长。同时，这也提供了简化客户管理的机会：只需面对少数几个客户，而非成百上千个。这两项优势都颇具诱惑力，尤其是在竞争激烈、颠覆不断的时代。谁不想拉拢几个超级客户呢？




  #### 大客户陷阱


  然而，这种想法既浅薄又危险。创意以及我们围绕其做出的决策都会带来后果。风险在于，一旦决定与大客户合作，就再无回头路，因为超出生产型企业控制的力量会迅速且无情地接管一切。


  这让我们想起以前的一个学生，萨姆。他一看就是那种在商界会有出色成就的年轻人。他总能提出关键问题，并不断探索最优的工作方法。他对细节的关注令人惊叹。大学期间，萨姆经营着一家相当成功的园林绿化/除雪公司。他有两辆卡车、八名员工，以及大约
  200 个住宅和商业客户。业务稳步且可持续地增长。毕业后，萨姆每年都在增加团队和客户。他熬过了经济大萧条，甚至接手了一些无法存活的竞争对手的客户。他被当地媒体誉为新兴商业领袖。最终，萨姆的公司成为该地区增长最快的园林绿化公司之一。他的发展之路一片光明。


  有一天，萨姆打电话给本书作者之一安德鲁，说他面临一个艰难的决定。该地区最大的一家银行发出招标，为其近 100 家分行和办公室提供割草、种植、景观维护和除雪服务。这是一份为期
  18 个月的合同。萨姆说，拿下这份合同可能会使他的整体业务翻倍，他想知道是否应该投标。安德鲁提醒他要谨慎，不要被这个银行吞噬了他已经成功的事业。令人沮丧的是，萨姆真正想要的其实是认可。他早已下定决心要追捕这条大鱼。


  不出所料，凭借他在市场上的声誉，萨姆中标了。这家银行瞬间占了他总收入的 50%，这意味着他必须立即租用更多设备和卡车，还要雇佣更多人。资金流入，资金流出。不可避免的是，内部资源——最重要的是萨姆闻名于世的细节关注力——被从他原有的客户群转向了新的大客户。对"老客户"的服务质量下降了，许多人离开了。尽管如此，总的来说，这仍然是一笔划算的买卖。在接下来的一年半里，萨姆正朝着成为一位非常年轻的百万富翁稳步前进。他买了一栋高档社区的新房子、一辆新的保时捷卡宴，还有一艘新船。


  然而，18 个月后，银行做了它一直在做的事：发布了新的招标。萨姆以为自己为他们服务得很好，合同会自动续签。然而，当他得知新的投标报价要求比他 18 个月前谈定的价格低
  20%时，他震惊了。那 20%正是他的利润啊！


  萨姆虽然沮丧，但还是"重新精打细算"提交了新的报价，他知道必须大幅削减成本才能保持优势。他再次赢得了合同，但他不得不降低员工的薪资。许多最优秀的人离开，去了他的竞争对手那里。服务质量进一步下降。更多的老客户流失了。2011
  年，油价飙升，进一步打击了萨姆的业务。


  到第二个 18 个月合同结束时，萨姆已经难以支付员工工资和设备租赁费（他也不声不响地卖掉了新房、保时捷和游艇）。不用说，当银行再次宣布寻找新供应商时，萨姆没有提交第三次报价。


  甩掉大客户这个沉重包袱后，萨姆相信自己可以凭借广泛的住宅和商业客户群重新开始。问题在于，过去三年里他的品牌形象已经受损。关于萨姆公司服务差的传言不胫而走。他大部分老客户都已流失：无论是雨雪天，还是……




