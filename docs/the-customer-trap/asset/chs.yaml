  头部由大客户组成，即那些在成熟市场已占据显著市场份额的大型分销商和零售商。他们销量巨大，并向供应商规定商业条款。这些通常是利润不高的渠道，但产品公司越来越难以避免与头部打交道，无论这有多么痛苦。躯干代表了成熟市场中的后起之秀以及新兴市场中一些较大的老牌参与者。尾部通常代表了快速增长的小型市场中的大部分中间商。


  图 8-1 展示了一家销售额为 6 亿美元的公司可能呈现的分布情况。


  `Sankaran` 表示，`CDM` 和更好数据的威力在于，它首次照亮了销售和分销渠道中的躯干和尾部，从而使制造商能够拥有一个真正替代头部（大客户）的选择。躯干和尾部的参与者更拼、更渴望与你合作，如果组织得当，他们可以成为比头部更具竞争力的真正优势和更高盈利能力的来源。这些参与者更难找到并以任何规模进行协调，但凭借更好的数据和透明度，竞争环境正变得更加公平。


  #### 12 个步骤


  为了实施数据驱动的营销策略，阿克伦大学泰勒直复营销研究所开发了 12 个步骤。8 为什么不是 11 步或 10 步？这 12 个步骤对于成功的数据驱动营销计划至关重要，缺一不可。


  在制定直复营销策略时跳过或绕过某些步骤，其结果就像先穿鞋再穿袜子。每一步都提供了细化和指导策略的信息，从而使优秀的直复营销能够产生更多成果、减少浪费。对公司、其产品和服务以及竞争对手的洞察是关键的知识要素。




