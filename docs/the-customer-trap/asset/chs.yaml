  \ 21 页。\n\n## 第二章 | 客户陷阱与品牌毁灭\n\n到 2001 年，固特异已陷入亏损，并在过去 14 年的大部分时间里持续处于亏损状态。在此期间，它一直是标准普尔\
  \ 500 指数中表现最差的股票之一。尽管导致公司崩溃的因素很多，但放弃忠诚的分销网络无疑起到了重大作用。固特异失去了对销售和分销的控制权，并且很可能永远无法恢复.37\n\
  \n李维斯和固特异的故事揭示了公司在将产品分销控制权交给外部力量时所面临的危险。公司往往不愿沾染销售和分销这些琐碎的尘务，认为可以通过创新走向成功，而将产品推向市场的粗鄙细节留给他人去做。在下一章中，我们将探讨这种方法的局限性。\n\
  \n37 固特异轮胎橡胶公司财务报告，[`moneycentral.msn.com/investor`](http://moneycentral.msn.com/investor)，2015\
  \ 年 3 月 4 日；安与伊丽莎白·哈洛，“十年表现最差者：固特异轮胎橡胶公司滑出赛道”，[`moneycentral.msn.com/investor/invsub/results/staemnt.aspx?Symbol=gt&1stStatement=10YearSummary&stmtView`](http://moneycentral.msn.com/investor/invsub/results/staemnt.aspx?Symbol=gt&1stStatement=10YearSummary&stmtView)，2008\
  \ 年 7 月 26 日；[www.bloggingstocks.com](http://www.bloggingstocks.com/)，详见 [www.bloggingstocks.com/2008/07/26/worst-10year-performers-the-goodyear-tie-and-rubber-company-ski](http://www.bloggingstocks.com/2008/07/26/worst-10year-performers-the-goodyear-tie-and-rubber-company-ski)。\n\
  \n#### 将你的创新变成商品\n\n*掌控自己的命运，否则别人会替你掌控。*\n——匿名\n\n管理大师、顾问、商业媒体、政客、教育家以及众多其他人士，都一心想让尽可能多的人相信创新就是*答案*。在某种程度上，这种热情很有道理。资本主义要想繁荣，就需要增长。增长由新流程、新产品和新服务推动，它们挑战着现状。理论上讲，这完全正确：经济扩张，创新型公司蓬勃发展。竞争迫使落后者迎头赶上，否则就会被淘汰出局。然后循环再次开始。\n\
  \n然而，在现实中，当超过 75%的新想法和发明无法在市场上获得吸引力时，必定有什么地方出了问题。似乎由于过多的关注都集中在创造本身，创新公式中的一个关键部分被遗忘了。那就是：这项创新是为谁而设？\n\
  \n根据我们的经验，公司常常想当然地认为，他们惊人的新发明会像神助一样最终落到正确的客户手中——这些客户会像公司一样欣赏和重视这项创新。但如果那些客户根本不关心\n\
  \n\n\n该产品对市场的独特贡献值得关注，但客户是否只对通过压低价格来获取市场份额感兴趣？换句话说，当面对那些只想将创新成果转化为可随意获取、掌控、最终弃之不顾的商品时，企业该如何向现有客户推销自己的创新？\n\
  \n### 第三章 | 将创新变为商品\n\n长期以来，创新一直是大众和学术界的主要趋势。近年来，教育工作者们开发并实施了强调科学和数学的课程，以保持美国在创新领域的领先地位。在大学里，专注于将创新融入企业文化的全新工商管理硕士（MBA）项目和高级管理培训课程异常火爆。各种规模的公司都设立了创新部门或分支。首席创新官（CIO）这一职位也变得越来越时髦。最近在\
  \ Monster 网站上的一次搜索显示，有 19,000 个管理职位在其头衔中包含了“创新”一词。技术转让被推崇为连接学术界与私营部门的桥梁。管理大师们的畅销书一致认为，创新是大多数寻求避免商品化、保持竞争优势的公司的希望所在。\n\
  \n传统观点认为，创新对于许多寻求可持续竞争优势的公司来说是必不可少的。其理由是，全球化、同质化市场、超级竞争和低成本会迅速将许多创新产品和服务变成商品，使公司无法收回将创新推向市场的成本。作为回应，创新被各方推崇为公司保持竞争优势、为客户提供高价值的最佳途径。然而，创新的实践往往不尽如人意。\n\
  \n问题不在于缺乏创新想法（2013 年美国共授予了 277,835 项发明专利），也不在于研发投入。2008 年经济衰退后，研发投入仅用几年时间就得以反弹，其增长速度在\
  \ 2011 年和 2012 年超过了国内生产总值，这与经济衰退前的八年情况一致。¹ 对于许多商业领袖来说，一旦市场状况开始好转，创新被视为确保增长的最佳途径。在经济动荡时期创造伟大创新的公司例子包括：杜邦公司发明了防碎塑料并创造了尼龙，以及卡夫食品推出了通心粉奶酪晚餐并配制了奇迹蛋黄酱。这些产品都是在经济大萧条时期开发的。在\
  \ 2001 年经济衰退期间，苹果公司推出了 iPod。²\n\n为什么会有如此多的创新失败？尽管存在多种可能性，但一种解释是，开发创新仅仅是两步走过程中的第一步，如果错过了第二步，那么最初投入到产品中的所有心血、汗水、泪水和金钱都可能付诸东流。令人沮丧的是，许多公司似乎对获取其创新的真正价值并不太感兴趣，尤其是在进入第二步——产品的销售和分销——时。公司非但没有因自己的努力而获得回报，反而让“大客户”接管了第二步，从而加速了商品化的进程。\n\
  \n¹ Mark Boroush, “美国研发投入在 2011 年和 2012 年恢复增长，速度超过国内生产总值,” *国家科学与工程统计中心*, 2013.\
  \ [`www.nsf.gov/statistics/infbrief/nsf14307/nsf14307.pdf`](http://www.nsf.gov/statistics/infbrief/nsf14307/nsf14307.pdf)\n\
  \nV. Kasturi Rangan, *转型你的市场进入策略* (波士顿, 马萨诸塞州: 哈佛商学院出版社, 2006).\n\n\n\n怀揣着巨额销售与更广阔市场的梦想，创新型企业在其创新成果离开实验室或工厂、步入市场时，便逐渐失去了控制。忽视销售与分销环节的失误，加速了创新成果商品化的进程。许多曾一度打造出能卖出高价的创新产品、并以此战略为傲的公司，如今已放弃了这一策略，转而采取“不惜一切代价追求销量”的做法。这一转变是通过一个系统性的过程实现的：在这个过程中，大型企业利用其超乎寻常的规模和购买力，削弱了与其有业务往来的创新型公司的战略主动权。\n\
  \n如前所述，当前格局的起源可追溯到几十年前。当时，企业主和管理者不再热衷于管理销售与分销，转而青睐一种强调核心竞争力（创新、技术、运营效率以及外包）的新管理范式。企业认为，通过识别并开发自身的内部能力，它们就能更有效地专注于为新兴市场创造更好的创新成果——从而为客户带来显著利益。人们相信，追求这一战略的公司最终将能以更低的成本产出新的创新成果。然而，通过迎合大众市场，创新型企业却让“巨型客户”攫取了其产品与服务的价值，即便这些巨型客户在施加成本的同时，还带来了战略方向与运营控制权的转移。生产商的创新成果常常从他们自己的所有权和控制之下，转变为一种实际上由巨型企业掌握产权的形式。\n\
  \n¹Justin Scheck and Paul Glader, “大公司加大研发投入以在经济复苏中抢占销售先机”，《华尔街日报》，2009 年 4 月 6\
  \ 日，第 A.1 页。\n\n***第三章 | 将你的创新转化为商品***\n\n由巨型企业销售的创新成果可以带来大量的品牌曝光、涌入的众多客户以及巨额的收入。当产品获得成功，并且为了满足需求而建立新的设施（并背上债务）时，巨型客户就会坚持要求更大的降价幅度。最终，公司只能像牛马一样拼命工作，以跟上其“合作伙伴”的指令——而自始至终，它们只能眼睁睁看着自己的创新成果越来越像普通商品一样被对待。\n\
  \n#### 底特律的例子\n\n几十年来，底特律三大汽车巨头主宰着数百家规模较小且地理位置分散的汽车经销商。经销商在限定区域内运营，且不得销售竞争品牌的汽车。从\
  \ 20 世纪 70 年代末开始，为了提振萎靡的销量，三大巨头增加了经销商数量，并允许现有经销商销售其他品牌的汽车，前提是这些品牌不与福特汽车公司、通用汽车公司或克莱斯勒集团有限责任公司构成直接竞争。例如，福特经销商可以销售\
  \ GMC 卡车，克莱斯勒经销商可以销售庞蒂亚克。随着时间的推移，制造商对其如今拥有多品牌的经销商的控制能力开始削弱，因为大家都在卖所有东西。那些曾以每一款新车型的推出都代表着全新设计而自豪的制造商，没有进行干预，因为他们害怕失去短期销售额，并疏远长期客户。权力从制造商/创新者向经销商的转移由此开始。不可避免的结果是，经销商不再是与某一品牌绑定的独家、专营的销售商，而是能够演变为销售多种品牌的超级卖场。如今全美最大的汽车经销商是\
  \ AutoNation，它几乎销售美国市场上所有可买到的品牌。\n\n当底特律打开多品牌经销这个潘多拉魔盒时，它只剩下两个可能的选项来重新掌控分销渠道。其一，它可以抛弃不守规矩的经销商，并建立一个全新的……\n\
  \n\n\n销售与分销网络。从商业角度来看，这很直接，但“三巨头”无法做到这一点，因为州法律和法规旨在维护制造商与经销商之间的协议。哈佛商学院教授 V. Kasturi\
  \ Rangan 这样总结道：\n\n到 1980 年代末，经销商已从美国制造商手中获得了极大的独立性。经销商可以增加进口汽车品牌，这些品牌在某些情况下比相应的美国品牌更强大，并且经销商在制定州法律以保护自己免受包括终止经销商在内的高压特许经营行为方面取得了进展。汽车制造商在联邦层面拥有显著影响力，但在州层面，经销商掌握着相当大的权力。汽车经销商只占所有零售店的\
  \ 1%到 2%，但平均而言，它们贡献了各州零售收入的 20%，进而贡献了所有州税收收入的 3%。3\n\n在美国的小城镇，汽车经销店通常是所在立法选区最大的企业。州代表们无意让底特律拆除这些当地的就业和税收来源。\n\
  \n第二个选择是开设更多经销店，通常靠近现有经销商的区域。这最终导致经销商的盈利能力下降，因为它们为了争夺相同的市场份额而相互竞争，同时，由于需要供应和支持业绩不佳的门店，也增加了底特律的成本。随着多品牌经销商的激增，“三巨头”认为，解决其分销问题的办法可能是电子商务作为一种可行渠道的出现。然而，经销商的政治影响力不容小觑。到\
  \ 2000 年 5 月，已有 33 个州立法禁止或限制制造商在线销售汽车。4\n\n制造商的第三个选择是学会适应新的权力结构，并眼睁睁看着自己的创新产品年复一年地被商品化。底特律必须保留其现有的经销商网络，而且，合乎逻辑的是，多品牌经销商的演变仍在继续，因为像`AutoNation`这样的公司能够销售来自不同制造商的多种车型。对于`AutoNation`这个在多个州代表多家制造商的超级分销商而言，唯一重要的品牌就是那个在特定时刻为其目的服务的品牌。由于像`AutoNation`这样的经销商管理着品牌组合，它们能够快速适应并应对市场变化。如果福特的新款车型不受公众欢迎，或者福特的创新很好但不如其竞争对手，`AutoNation`可以无缝地转向销售更受欢迎的雪佛兰、道奇、现代或起亚汽车。它们的客户仍会购买，收入仍会流入超级分销商的口袋，经销店也会持续增长。\n\
  \n`Ganley Auto Group`是俄亥俄州最大的汽车经销商，也是全美排名前十的经销商之一。该公司销售的品牌包括宝马、本田、现代、五十铃、梅赛德斯-奔驰、日产、斯巴鲁、Scion、铃木、丰田、大众、雪佛兰、克莱斯勒、道奇、福特、吉普、林肯和水星。5`Ganley`会与任何一个品牌捆绑吗？绝不会。对`Ganley`而言，唯一重要的品牌就是在任何特定时刻满足其需求的品牌。`Ganley`可以在任何时候无缝地转向销售“更好”的品牌和车型。\n\
  \n3 Andrea Orr, “Levi Must Work Out of Tight Fit: Wal-Mart Deal May End Slide in\
  \ Revenues,” *Houston Chronicle*, September 18, 2003, p. 4.\n\n4 Paul A. Greenberg,\
  \ “Cars Online: Miles to Go Before They Sell,” *E-Commerce Times*, [www.ecommercetimes.com/story/7119.html](http://www.ecommercetimes.com/story/7119.html),\
  \ January 31, 2001.\n\n5 Ganley Auto Stores, [www.ganleyautogroup.com](http://www.ganleyautogroup.com),\
  \ accessed September 24, 2014.\n\n\n\n### 第三章 | 将创新转化为商品\n\n福特已花费数十亿美元追赶丰田和日产的技术领先地位。但当大众消费者对福特产品提不起兴致时，它该怎么办？它又能做什么？福特只生产和销售福特品牌的汽车和卡车。这家公司承担了绝大部分（若非全部）风险——它需要应对律师和政府安全检查员，花费数千万美元进行市场调研，从供应商那里采购新零件，并改造其制造流程——只为将创新产品推向市场。这一切都是以创新的名义进行的，但由于福特几乎无法以任何有意义的方式影响其最大的客户（如全美汽车租赁公司），它始终面临着削减成本、向供应商施压，并在必要时将工作岗位转移到海外的压力。美国汽车制造商的平均销售净利润率为\
  \ 5%，盈利能力在-2.5%到 10%之间。6\n\n例如，在 2014 年第三季度，克莱斯勒报告净利润为 6.11 亿美元，销售额为 207 亿美元，调整后的营业利润为\
  \ 9.46 亿美元，占销售额的 8.7%。7\n\n只有在获得政府救助并经历破产程序之后，汽车制造商才得以对其产品的销售获得一定的控制权。2009 年春季，在破产法院和政府机构的保证下，每家公司从其销售网络中削减了近\
  \ 1000 家经销商。\n\n#### 乐柏美丧失控制权\n\n另一个陷入“顾客陷阱”的企业例子是乐柏美。多年来，这家公司因其生产一系列高品质的储物及相关产品而备受赞誉。像其他少数消费品公司一样，这家公司直接对接客户需求。来自俄亥俄州坎顿市的家庭主妇艾伦·斯蓬说：“我记得乐柏美打电话来，请求在我家待一段时间。两名研究人员花了整个下午的时间观察孩子们的卧室，查看衣橱里物品的摆放方式，并就如何解决所有儿童物品的存放问题提出了疑问。”8\
  \ 这种深入了解人们如何使用其产品的关注，打造了一个在全美备受尊敬和钦佩的品牌。然而，到了 2008 年，这家十年前被纽威公司收购的企业，已牢固地陷入了大宗商品业务之中。\n\
  \n6 兰根，同前引书 *。*\n\n7 马克·克洛西尔，“克莱斯勒净利润因吉普和皮卡销量增长 32%”，彭博新闻，2014 年 11 月 5 日。[`www.bloomberg.com/news/articles/2014-11-05/chrysler-s-net-income-rises-32-on-jeep-and-pickup-sales`](http://www.bloomberg.com/news/articles/2014-11-05/chrysler-s-net-income-rises-32-on-jeep-and-pickup-sales)\n\
  \n8 作者访谈，2014 年 9 月。\n\n### **顾客陷阱** 33\n\n乐柏美始于 1933 年，当时詹姆斯·R·考德威尔和妻子基于自家厨房中发现的不足，发明了\
  \ 29 种产品。考德威尔“敲了十家门，卖出了九个簸箕”。受此成功的鼓舞，他很快开始利用百货商店，在新英格兰地区推销肥皂碟、水槽塞子和滴水板垫。这家新公司与伍斯特橡胶公司合并，后者是一家成立于\
  \ 1920 年、举步维艰的俄亥俄州企业。伍斯特橡胶公司 1935 年的销售额仅为 8 万美元，通过合并获得了新生。到了 1941 年，新成立的乐柏美销售额达到\
  \ 45 万美元。到这时，考德威尔已成功将他和妻子设想的 29 种产品中的 27 种推向市场。9\n\n与二战期间的许多企业一样，乐柏美从生产消费品转向为战争所需贡献力量。战后，该公司推出了橡胶脚垫和杯架等汽车配件，以及其之前的产品线。但并非……\n\
  \n\n  \n直到 1955 年，该公司才开始用塑料制造产品，并于 1956 年推出了一款塑料洗碗盆。很快，`Rubbermaid`向餐厅、酒店及其他企业销售工业和商业用品。\n\
  \n`Caldwell`于 20 世纪 50 年代末退休。`Rubbermaid`的下一任主要领导者是`Donald E. Noble`，他是一位具有非凡远见和管理能力的人。`Noble`安排公司股票在纽约证券交易所上市，推动了一个在六年基础上实现利润翻倍的目标（他成功实现了），并将公司的未来建立在创新能力之上。产品开发是这一新努力的关键。到\
  \ 1968 年，目标是让年销售额的 30%来自过去五年内推出的产品。\n\n与 20 世纪 70 年代的许多公司一样，`Rubbermaid`开始涉足不相关的业务。它曾尝试销售雪橇和摩托艇等娱乐用品，但未成功。“我们搞砸了，”当时的营销副总裁对《华尔街日报》记者说。随后出现了其他问题，包括\
  \ 20 世纪 70 年代与联邦贸易委员会的纠纷。\n\n`Donald Noble`于 1980 年退休。接替他的人正是`Stan Gault`，他后来在 20\
  \ 世纪 90 年代带领`Goodyear`陷入了“客户陷阱”。`Gault`在`通用电气`（GE）积累了经验，曾负责家电部门。他是伍斯特本地人，通过在`Rubbermaid`的暑期工作读完了大学。`Gault`设定了到\
  \ 1990 年将销售额翻两番的目标，并迅速采取行动。运营流程得以简化。荷兰的工厂被关闭，派对计划业务（类似于`特百惠`）被放弃，汽车部门也被出售。11%的管理层被解雇，公司一半的中层管理职位被裁撤。`Gault`从`GE`引进人员填补公司高层职位。[⁹]\n\
  \n[⁹]: Funding Universe，“Little Tikes 公司历史”，[www.fundinguniverse.com/company-histories/Little-Tikes-Company-Company-History.html](http://www.fundinguniverse.com/company-histories/Little-Tikes-Company-Company-History.html)，2014\
  \ 年 9 月 24 日访问。\n\n## 第 3 章 | 将你的创新转化为商品\n\n随后进入了一段激进的收购时期，包括收购了一家电脑配件公司`MicroComputer\
  \ Accessories`，以及一家生产保温箱和饮料架的公司`Gott Corporation`。`Rubbermaid`还与户外家具生产商`Allibert`以及荷兰化工制造商`DSM\
  \ N.V.`成立了合资企业。1989 年，销售额达到 14.5 亿美元，是 1981 年（3.5 亿美元）的四倍。[¹⁰]\n\n[¹⁰]: 同上。\n\n\
  `Gault`超出了最初将销售额翻两番的目标。他是如何做到的？两大因素促成了`Rubbermaid`惊人的增长——收购与创新。其中最引人注目的是收购了`Little\
  \ Tikes Company`。\n\n#### Little Tikes\n\n`Little Tikes`是一家卓越的创新公司。1970 年，`Thomas\
  \ G. Murdough`对当时充斥市场的廉价劣质玩具感到不满。为此，他创立了`Little Tikes Company`，其基础是一种名为旋转模塑的技术，该技术原本用于生产大型农业和化工容器。`Murdough`发现，用这种方法制造的模塑塑料玩具比当时市场上的产品更耐用。\n\
  \n该公司利用其技术，通过多种多样的造型，发明了各种款式的户外游乐设备。旋转模塑工艺有助于制造面积大、耐用且零件相对较少的产品。尽管`Murdough`的产品和工艺创新令人印象深刻，但他对销售和分销的理解更为出色。\n\
  \n`Murdough`认为，他可以避免深度折扣和低价产品\n\n\n\n通过严格控制分销渠道，其他玩具制造商的品质无法与之相比。\n\n20 世纪 60 年代，诸如`Kmart`这样的大型零售商的策略是，将最受欢迎的玩具作为引流商品进行营销，以此吸引家长进店。结果，较小的商店被迫降低自身价格，利润空间微薄。这些小商店随后向批发商施压，批发商又迫使制造商降低价格。制造商通过牺牲品质来达成这一目标。年轻的婴儿潮一代可以证明，20\
  \ 世纪 60 年代末至 70 年代，玩具品质出现了持续下滑。不妨将这一代人对玩具的评价，与 20 世纪 50 年代上小学的那些人的评价作一番比较。\n\n10C.\
  \ E. 赫尔法特，《动态能力：理解组织中的战略变革》（纽约：威利父子出版公司，2007 年），第 49 页。\n\n***《顾客陷阱》*** 35\n\n默多并未陷入这种品质下滑的恶性循环，因为他坚决不与大型折扣零售商打交道。相反，他专注于制造创新产品，在家长中营造口口相传的“热评”，并建立了一个高效的独立分销商网络。创新策略与对销售和分销渠道的控制相结合，取得了巨大的成功。\n\
  \n1984 年，默多以 5000 万美元的价格将公司卖给了乐柏美，并留任总裁五年，之后因失望而辞职。他辞职的原因是，乐柏美的高管不断施压，要求他通过`Kmart`和`Ames`分销\
  \ Little Tikes 的产品。默多表示反对，认为在大众市场进行大量促销会导致产品生命周期过短。“你让市场饱和了……这是玩具行业深陷困境的很大一部分原因。”11\n\
  \n默多想“消除过度的分销”。一本关于 Little Tikes 的史书记载了后来发生的事：“高尔特先生表示反对，默多先生说，部分原因是这些大众零售商为乐柏美的庞大日用产品系列提供了大量货架空间。‘乐柏美想把产品分销到每一个角落，’他（默多）说。十年后，默多告诉《福布斯》杂志，‘事实证明，我们根本不需要乐柏美的钱……我所有的精力都花在摆脱他们（乐柏美高管）的干扰上了。’”12\n\
  \n默多离开后，高尔特预测 Little Tikes 将迎来“有史以来最好的一年。”13 Little Tikes 开始为大众市场进行创新。公司开设了五家新制造工厂，建造了一个新的\
  \ 6000 平方英尺的客户服务中心，并与包括`Kmart`、`Toys “R” Us`和`Walmart`在内的客户达成了新的分销协议。\n\n#### 商品化的加速\n\
  \n乐柏美享有盛誉。14 年来，它一直被《财富》杂志评为行业组第一名，该杂志还在 1993 年将乐柏美评为美国最受赞赏的公司。斯坦·高尔特于 1991 年退休，两年后沃尔夫冈·施密特接管了公司。如果说自\
  \ 1966 年就效力于公司的施密特对乐柏美感到自豪，那实在是过于轻描淡写了。在一本 20 世纪 90 年代流行的商业书籍中，施密特撰写的一篇文章充满了对公司发展道路的自恃、傲慢和自信。以下是这位前首席执行官的一些原话：\n\
  \n• “我们的品牌之所以持续胜出，是因为我们坚持不懈地\n\n\n```markdown\n- “帐篷，始终如一的产品创新。”14\n- “我们的每一款产品都凝聚了数代创新的结晶，而创新正是乐柏美从众多竞争对手中脱颖而出的关键。”15\n\
  - “无论我们的下一个突破是什么，我都能保证它将反映不断变化的趋势，为消费者提供一对一的解决方案。”16\n\n在鼎盛时期，乐柏美拥有 5,000 种不同的产品，每年推出近\
  \ 400 款新品。1994 年《财富》杂志上一篇吹捧的文章将该公司的创造力归功于施密特非凡的能力——他“一直在思考，思考”17——以及由来自市场、财务、制造、研发和销售部门的\
  \ 21 个开发团队。这些努力的结果是创造了一些真正令人印象深刻的产品，从耐热锅铲（施密特的创意之一）到 Hip-Hugger 洗衣篮。\n\n**大势已定**\n\
  \n除了施密特对创新的热情，该公司同样致力于延续高尔特通过大型零售商的销售战略。在解释大型折扣零售商对乐柏美未来的作用时，施密特说：“通常是较大的供应商才能形成大型零售商日益要求的紧密合作关系。目标是通过削减库存、缩短交货周期和消除错误来提高双方的销售额并降低成本：我们与沃尔玛这样的公司之间存在着健康的相互依赖关系。我们需要他们，他们也需要我们。”18\n\
  \n新的十年对乐柏美来说是一场灾难。随着它对大众市场的投入增加，大客户对更低价格的要求也随之提高。起初，乐柏美对大卖场的压力嗤之以鼻。多年来，它一直能够轻易地将价格上涨转嫁给经销商，而经销商则简单地向客户收取更高的费用。然而，市场预期正在迅速改变。\n\
  \n沃尔玛、家得宝、劳氏及其他潜在的大客户无处不在，加之该十年大部分时间通胀率维持在 2%至 3%左右，这使得人们预期价格即使上涨，也只会缓慢上升。1994 年，当灾难降临时，沃尔玛的业务约占乐柏美总业务的\
  \ 14%。\n\n乐柏美产品的关键成分是聚合物基树脂，其成本约占任何特定产品总成本的三分之一。多年来树脂价格一直稳定，但在 1994 年春季，由于全球新需求的出现以及关键炼油厂问题导致的供应短缺，成本急剧上升。在\
  \ 18 个月内，树脂价格几乎翻了一番，给乐柏美增加了 2 亿美元的成本。19 始终专注于盈利增长的该公司，据施密特称，其价格上涨幅度最高平均为\n```\n\n\
  \n乐柏美（Rubbermaid）的涨价行为遭到了零售巨头的嘲笑。大型零售商反对其每月涨价，并抱怨乐柏美对市场现实反应迟钝。市场上已有竞争对手的产品。总部位于马萨诸塞州的私营企业\
  \ Sterilite，以及美孚石油旗下的 Tucker Housewares，都准备以更低廉的价格填补沃尔玛的货架空间。这些零售巨头已准备抛弃乐柏美。这一问题被称为\"\
  溢价差距\"。\n\n\"我们在 90 年代初让溢价差距变得太大了，\"施密特在接受《财富》杂志采访时表示。21 该文章这样解释这一困境：\n\n一位有经验的家庭主妇明白，一个可靠的\
  \ 32 加仑垃圾桶，她不应该支付超过 10 美元。当她看到乐柏美售价 8.99 美元的垃圾桶旁边，竞争对手的同类产品只卖 5 美元时，乐柏美并不担心。\"那可能又薄又易碎，顾客心里清楚，\"\
  施密特说。真正让乐柏美担忧的是竞争对手售价 7.99 美元的垃圾桶，因为那个产品可能相当不错。然而，这个价格足够低，以至于低于 10%的溢价差距。这样一来，乐柏美不仅失去了一笔生意，还可能让顾客认为自己被多收了钱。22\n\
  \n19 克劳迪娅·H·多伊奇，《巨人苏醒，却遭冷遇》，《纽约时报》，1996 年 12 月 22 日 [`www.nytimes.com/1996/12/22/business/a-giant-awakens-to-yawns.html`](http://www.nytimes.com/1996/12/22/business/a-giant-awakens-to-yawns.html)\n\
  \n20 蒂姆·卡维尔和乔·麦高恩，《乐柏美轰然倒地》，《财富》，[`archive.fortune.com/magazines/fortune/fortune_archive/1995/10/02/206543/index.htm`](http://archive.fortune.com/magazines/fortune/fortune_archive/1995/10/02/206543/index.htm)，1995\
  \ 年 10 月 2 日。\n\n21 同上。\n\n22 同上。\n\n## 第 3 章 | 将你的创新变为普通商品\n\n起初，施密特认为乐柏美能比其竞争对手更好地应对树脂涨价带来的影响。然而，Tucker\
  \ 通过采用基于再生塑料的产品设计，以及为储物箱和垃圾桶配备雪松木内衬，成功规避了树脂问题。Sterilite 是一家私营企业，既没有乐柏美那样激进的利润目标，也不受华尔街施加的那种利润压力。23\n\
  \n随着公司的创新日益商品化，施密特试图通过降低成本和提高销售额来弥补价值损失。但为时已晚。创造创新产品的压力往往导致肤浅的、表面化的改变，这些改变\"增加了制造复杂性并让零售商感到困惑\"\
  ，最终并未带来销售额的增长。24\n\n大型客户对乐柏美只有轻蔑，当这家昔日的明星公司开始走下坡路时，他们幸灾乐祸。一位凯马特（Kmart）的高管表示：\"零售商曾警告乐柏美，'如果你们不在价格上采取行动，就会毁掉自己的生意。'\"\
  \ 25 另一位则说：\"他们的货运服务糟透了。不仅不准时，订单满足率低得可怕，而且产品价格还贵。他们给你看一条新产品线，然后告诉你只能发运你想要数量的三分之一。\"\
  \ 26 沃尔玛对涨价感到不满，清空了货架上的乐柏美 Little Tikes 产品，并将空间让给了费雪（Fisher Price）。27\n\n由于没有其他真正可行的选择，乐柏美感觉不得不改变策略。1994\
  \ 年，它开始基于价格进行激烈竞争，向大型客户提供大幅折扣。其利润率迅速被侵蚀，随后实施了削减成本的措施，包括裁减 1170 个工作岗位和关闭 9 家工厂。该公司淘汰了\
  \ 6000 种颜色和尺寸的规格，并削减了\n\n\n\n`总产品数量减少了 45%。` 28 这些努力只带来了暂时的缓解。1998 年，Newell 公司以\
  \ 60 亿美元的股票收购了 Rubbermaid。\n\n那么 Little Tikes 公司呢？1990 年代困扰 Rubbermaid 的问题——需求放缓和原材料成本高企——同样也挑战着\
  \ Little Tikes。该公司的应对措施包括增加研发投入、推出新产品展示以及发布更多新品。当 Newell 收购 Rubbermaid 后，Little\
  \ Tikes 开始大力投资于消费者研究，从而设计出了旨在激发儿童想象力的原创产品。该公司还利用创新的耐候技术，生产可以留在户外使用的电子玩具。\n\n23 同上。\n\
  \n24Deutsch，同上引。\n\n25 同上。\n\n26Geoffrey Colvin，“Rubbermaid 如何从最受尊敬沦落到被收购，” *财富*，\
  \ [`archive.fortune.com/magazines/fortune/fortune_archive/1998/11/23/251411/index.htm`](http://archive.fortune.com/magazines/fortune/fortune_archive/1998/11/23/251411/index.htm)，1998\
  \ 年 11 月 23 日。\n\n27Constance E. Helfat 等人， *理解组织中的战略变革* (Malden, MA: Blackwell\
  \ Publishing, 2007)。\n\n28Deutsch，同上引。\n\n***顾客陷阱*** 39\n\nLittle Tikes 在尝试通过创新来应对竞争对手、经销商和新东家带来的挑战方面表现得十分顽强。\n\
  \n尽管做出了这些努力，销售额仍在持续下滑。2001 年，其最大的经销商玩具反斗城开始减少 Little Tikes 的库存，以提高每平方英尺的销售额。2005\
  \ 年，Little Tikes 的销售额为 2.5 亿美元——比 1989 年少了 2000 万美元。最终，Little Tikes 这个品牌与在大众市场销售的大幅折扣玩具联系在了一起。2006\
  \ 年，Newell Rubbermaid 将 Little Tikes 出售给了 MGA Entertainment。\n\n创新或许是必要的，但这显然还不够。这一点在亚马逊公司的案例中表现得淋漓尽致，它在许多方面都将顾客陷阱发挥到了极致。\n\
  \n#### 完善顾客陷阱\n\n对于我们这些局外人来说，亚马逊一直是个谜，直到布拉德·斯通的著作 *万物商店* 拉开帷幕，让观察者得以看到其创始人杰夫·贝佐斯如何组织货架和处理商品。贝佐斯是一位拥有非凡远见、干劲和雄心的人，或许是一位真正的商业天才。有一件事是确定的：他对顾客陷阱有着深刻的直觉理解。贝佐斯是全球首屈一指的、懂得如何让顾客陷阱运作的专家。\n\
  \n从亚马逊成立之初，贝佐斯就深知规模的力量。1996 年，在一次偶尔漫步西雅图市中心时，贝佐斯向他的同事谢尔·卡普汉解释了为何他决心迅速扩张亚马逊。“当你规模很小时，总会有更大的对手出现并夺走你所拥有的一切。我们必须在购买力上与那些老牌书商平起平坐。”\
  \ 29\n\n这种直觉在 1998 年成为了政策。在致股东的第一封信中，贝佐斯解释说，亚马逊衡量成功的标准不是盈利能力，而是市场领导地位，即市场份额的增长。这封信后来成为公司内部的“圣经”，并每年随年报重新发布，至今仍塑造着公司的战略：\n\
  \n> 我们认为，衡量我们成功的基本标准将是我们长期为股东创造的价值。这种价值将直接来源于我们扩大和巩固当前市场领导地位的能力。我们的市场领导地位越强，我们的经济模式就越强大。市场领导地位可以直接转化为更高的收入、更高的盈利能力、更大的资本周转速度，以及相应更高的投资资本回报率。\n\
  \n29 布拉德·斯通， *万物商店：杰夫·贝佐斯与亚马逊时代* (纽约州纽约市：利特尔布朗公司，2013 年)，第 52 页。\n\n***第 3 章 | 将你的创新变成商品***\n\
  \n\n\n### 客户陷阱\n\n我们的决策始终聚焦于这一重点。我们首先以最能体现市场领导地位的指标来衡量自身：客户与收入增长、客户持续从我们这里重复购买的程度，以及我们品牌的实力。我们已投入并将继续大力投资，以扩大和利用我们的客户群、品牌和基础设施，从而建立持久的企业特许经营权.30。\n\
  \n就在亚马逊拥抱市场领导地位的同时，其供应商开始重新考虑是否要将所有产品都放入亚马逊的购物车中。华尔街分析师拉维·苏里亚在 2000 年撰写了一系列广受阅读的报告，预测该公司即将面临灾难。这些报告恰逢“.com\
  \ 泡沫”危机的高峰期，加之负面新闻报道鼓吹电子商务仅为一时风尚，导致大批投资者抛售亚马逊股票。供应商们惊慌失措。英格拉姆公司总裁约翰·英格拉姆对亚马逊高管表示：“但如果你们倒下，我们也会倒下。如果我们看错了你们，那就不是‘哎呀，算了’那么简单。我们对亚马逊的应收账款高度集中，我们也会陷入困境。”31\
  \ 结果证明，问题并非亚马逊即将倒下，而是英格拉姆和众多亚马逊供应商一开始就将太多业务交到了亚马逊手中。\n\n世纪之交，“客户陷阱”只是亚马逊战略武库中的一件武器。该公司的弹药库中包含众多利器，包括大量收购、物流专业知识和尖端技术。很快，亚马逊便开始尝试对“客户陷阱”进行不同力度的校准。亚马逊在\
  \ 2002 年与联合包裹服务公司的一场争端中找到了恰到好处的设置。当时，这家全球最大的物流公司拒绝了亚马逊关于降低包裹运送价格的请求。作为回应，亚马逊花了六个月时间将其系统与联邦快递整合，增加了出货量，并更频繁地使用美国邮政服务。当联合包裹在九月份的谈判中认为亚马逊只是在虚张声势时，这家零售巨头真的停止了与其的合作。七十二小时后，联合包裹屈服了，同意给亚马逊提供运费折扣.32。此后多年，亚马逊有效地让联合包裹和联邦快递相互竞争，以获得更优惠的价格。它激进地使用“客户陷阱”，在每一个取件点、交叉路口和纱门处，都将这个陷阱放在这两家公司面前。\n\
  \n2014 年冬天，亚马逊将其通过联邦快递运送的包裹量按年率减少了 5000 万至 6000 万件，导致联邦快递的总运量下降了 8%。与此同时，联合包裹的卡车中有多达三分之一的货物是亚马逊“Prime”会员的两日达包裹。联邦快递的一位前高级高管表示：“如果他们能从亚马逊\
  \ Prime 的运输业务中赚到 5%的利润，那我会感到惊讶。”33\n\n对联合包裹而言，结果是净利润飙升而利润率平平。数字说明了问题。亚马逊的销售额增长了四倍，从\
  \ 2008 年的 191.7 亿美元增至 2013 年的 744.5 亿美元。同期，联合包裹的收入仅增长了 9%，达到 340.7 亿美元。然而，联合包裹 2013\
  \ 年 43.7 亿美元的净利润，使亚马逊可怜的 2.74 亿美元净利润相形见绌。但值得注意的是，“不盈利”的亚马逊显然处于主导地位。尽管处于亏损状态，该公司仍继续主导着市场动态。\n\
  \n**参考文献**\n\n- 30 1997 年致股东信。重印于 2013 年致股东信。亚马逊公司年度报告。[`phx.corporate-ir.net/phoenix.zhtml?c=97664&p=irol-reportsannual`](http://phx.corporate-ir.net/phoenix.zhtml?c=97664&p=irol-reportsannual)，访问于\
  \ 2015 年 3 月 6 日。\n- 31 斯通，前引书，第 105 页。\n- 32 同上，第 181 页。\n\n\n\n\n这种商业模式使得亚马逊能够对\
  \ UPS 和 FedEx 发号施令。UPS 的“战略”回应——这是陷入**顾客陷阱**的企业典型反应——是提高效率。首席执行官大卫·阿布尼认为，电子商务“挑战了我们一些传统的经营方式”，迫使公司从系统中削减成本，以改善自身处境。2014\
  \ 年第二季度，UPS 的平均配送成本同比下降了 1.7%，但收入却下降了 2%。其结果是，对 UPS 而言，这个**顾客陷阱**就像那些棕色大卡车一样，在街区里一遍又一遍地绕圈，寻找地址。讽刺的是，山姆大叔（美国政府）最近也开始体验**顾客陷阱**。受成为亚马逊“免费”配送服务推动者之一的前景诱惑，美国邮政服务（US\
  \ Postal Service）开始大幅降价，以分得一杯羹。34\n\n然而，亚马逊运用**顾客陷阱**最明显的领域是图书品类。在早期，它和其他书商一样，从相同的经销商处采购图书。2004\
  \ 年，亚马逊开始向大型出版商发起攻势，要求在大批量采购上获得大幅折扣、利用其“重振旗鼓”的与 UPS 的关系来安排运输条款，以及延长付款周期。\n\n对于那些不配合的出版商，亚马逊采取强硬手段，威胁要降低其图书在其网站上的曝光度。尝到这一策略的甜头后，贝佐斯发起了“瞪羚计划”，其理念是亚马逊应该“像猎豹追逐病弱的瞪羚一样”对待小型出版商。35\
  \ 该策略包括根据出版商对亚马逊的依赖程度对其进行分类，然后向那些最脆弱的公司施压。这种无情的做法令出版商们胆寒。一位图书经销商将其描述为“就像与《教父》共进晚餐”。36\n\
  \n33 Laura Stevens, “At UPS, E-Commerce Boom Proves a Heavy Lift,” *The Wall Street\
  \ Journal*, September 12, 2014, p. A1.  \n34 *Ibid*.  \n35 Stone, op. cit., p. 242.\
  \  \n36 George Packer. “Cheap Words: Amazon is Good for Customers. But is it Good\
  \ for Books?” *The New Yorker*, February 17, 2014.\n\n## 第三章 | 将你的创新转化为商品\n\n2005\
  \ 年，曾参与创立亚马逊珠宝业务的兰迪·米勒接手了出版商关系工作。据作家布拉德·斯通描述，“米勒在向图书出版商施压、要求其给予亚马逊更优厚的财务条款时，几乎有一种病态的乐趣。”他的做法是根据销售额和利润率对出版商进行排名，然后威胁要减少对那些不接受新条款的落后出版商的推广力度。谈到兰登书屋、阿歇特出版公司和布卢姆斯伯里出版社时，米勒表示：“我竭尽所能地破坏他们的业绩，”包括将图书从亚马逊的推荐列表中移除，并推广竞争对手的图书。这促使那些在亚马逊“作者中心”网站上不由自主地追踪销售数据的作者，向他们的出版商施压。据米勒说：“我们会经常与作者会面，所以知道谁会关注他们的排名。我知道这些人一看到自己的销量数字下降，就会立刻拿起电话。”37\n\
  \nKindle 问世后，亚马逊与出版商的关系变得更加残酷，因为这家巨头将书价压得很低，威胁到了售价 26 美元的精装书——这些书是巴诺书店和博德斯书店的命脉。文学经纪人安德鲁·威利表示：“贝佐斯想要的是尽可能地把零售价拉低——1.99\
  \ 美元，甚至 99 美分。这是苹果公司的策略——‘我们要的是通过我们的设备获取流量，为此我们可以不惜一切代价。’”38\n\n贝佐斯已经下定决心，每本书都必须能够通过数字方式提供。\n\
  \n定价为`$9.99`，亚马逊会对那些未能快速数字化其目录的出版商采取强硬态度。这一价格背后并无商业模式支撑，仅仅是亚马逊坚信这是正确的定价。明知出版商们会反对，该公司仍将计划保密，直至\
  \ 2007 年第一代 Kindle 发布。尽管亚马逊的好斗令出版商痛苦不堪，但这为亚马逊带来了巨大成功，使其彻底击败了巴诺书店（Barnes & Noble）和现已倒闭的鲍德斯集团（Borders\
  \ Group）等竞争对手。39\n\n对“合作伙伴”表现“友善”根本不是亚马逊的商业基因。相反，其双螺旋结构似乎由敌意核心与一种友善的三级结构组成，后者将公司诱入“客户陷阱”。2004\
  \ 年，玩具反斗城（Toys \"R\" Us）在联邦法院起诉亚马逊，指控其违反了一项协议——该协议规定玩具反斗城是亚马逊平台上最畅销玩具的独家销售商。在判决玩具反斗城胜诉时，法官玛格丽特·玛丽·麦克维（Margaret\
  \ Mary McVeigh）明确表示，她对贝佐斯及其他作证的亚马逊员工的 credibility（可信度）不以为然。她在判决书中写道：“亚马逊的行为与协议（两公司之间的协议）起草者的意图不符……无论是出于有意还是措辞不当，协议中的语言赋予了亚马逊按其自身方式行事的空间。”玩具反斗城赢得了这场官司。40\n\
  \n玩具反斗城有资源将亚马逊告上法庭。但那些沦为亚马逊精心设计的“客户陷阱”受害者的中小型玩家呢？科技使个体创意艺术家能够自行制作图书项目并直接向公众销售。对于这些人来说，亚马逊的策略可能是毁灭性的。一位国际知名摄影师向我们讲述了他的经历：\n\
  \n> 我出版的书并非小项目。这是一本摄影集，拍摄历时六个月。我驱车超过两万英里前往各个地点。摄影书印刷成本高昂，而且很重。这件事规模很大，耗时又耗钱。我利用在线资源，尽可能深入地研究了亚马逊。他们的指南令人困惑且常常自相矛盾，但我自认为对他们的流程已有相当了解。\n\
  >\n> 第一个警告信号是我的书抵达亚马逊仓库时出现的。我遵守了他们的规则。每个托盘和箱子都单独贴有标签，但书到货后，他们坚持每本书也必须贴标（除了条形码之外）。\n\
  >\n> 我耐心地向那位并不太帮忙的亚马逊联络人解释，根据他们自己的网站，这并非要求。她回复说，我可以授权他们贴标（需付费），或者我可以告诉她我希望把书寄到哪里（同样需付费）。\n\
  >\n> 几个月后，另一只靴子落地了。亚马逊每年向我收取的仓储费——这是在他们已经收取的月度仓储费之外的——被上调了。原本不到`$100`的名义费用，现在变成了超过`$2,000`。我不确定他们如何对同一时间占据的同一空间收取两次费用，但这大概是个最好用量子物理学来解释的问题。我不敢想象普通的黑心房东得知此事后会怎么做。\n\
  \n突然间，我的书利润大减。一位新的、同样不太帮忙的亚马逊联络人似乎很高兴地通知我，我可以支付这笔费用，或者告诉他我想把书寄到哪里。这项政策未经我同意就更改，并使我最初达成的协议失效，这令人相当沮丧。\n\
  \n\n作为亚马逊合作伙伴，我必须绑定一张信用卡，这意味着他们可以随意随时向我收取任何费用，这着实令人恼火。\n\n第一年，我支付了月费以及每年 2000 美元的仓储费。我还有什么选择呢？我必须卖掉这些东西，而亚马逊是我分销模式中不可或缺的一环。第二年，面对超过\
  \ 1200 美元的新账单，我做出了一个难以想象的决定。我被迫将大约 600 本书打成纸浆。没错，这也要收费。\n\n像写这条留言的独立创意工作者这样的个体，可能是亚马逊“消费者陷阱”最大的受害者，但最终，几乎所有与亚马逊“合作”的人都或多或少会遭受损失。可悲的是，亚马逊创造的“价值”甚至没有被亚马逊自己抓住。2002\
  \ 年 1 月，亚马逊公布了 500 万美元的净利润，这是其历史上首个盈利的季度.41。2013 年，该公司全年亏损 4100 万美元。令人震惊的是，在 2014\
  \ 年第三季度，该公司亏损了 4.37 亿美元，而同期销售额却增长了 20%，达到 205.8 亿美元。相比之下，埃克森美孚在两周半内赚取的利润就超过了亚马逊自成立以来的全部利润.42。然而，由狂热且笃信不疑的投资者推高的高股价，为许多人创造了大量财富——这一切都是以该公司所销售商品和服务的生产者为代价的。\n\
  \n在当今商业世界中，创新的商品化加速发生，这如此频繁，以至于似乎无人察觉。然而，这种情况发生后留下的损害却显而易见。尽管如此，似乎没有任何实质性的改变。正如我们接下来将看到的，这种僵化在很大程度上与谁掌握着信息有关。\n\
  \n41 同上，第 134 页。\n\n42 Greg McFarland，“亚马逊从未盈利，但没人在乎”，*Investopedia*，2014 年 9 月\
  \ 2 日。[`www.investopedia.com/stock-analysis/031414/amazon-never-makes-money-no-one-cares-amzn-aapl-wag-azo.aspx`](http://www.investopedia.com/stock-analysis/031414/amazon-never-makes-money-no-one-cares-amzn-aapl-wag-azo.aspx)\n\
  \n## 第四章\n\n#### 当销售渠道被劫持\n\n*除了我自己的困惑，我拿不出任何东西给别人。*\n\n——杰克·凯鲁亚克\n\n直到亚马逊的杰夫·贝佐斯遇到了“消费者陷阱”的“尤达大师”，他才学会了如何残酷地对待供应商。2001\
  \ 年初，贝佐斯凭直觉认为，商业成功的关键在于获得对供应商的杠杆效应，这一想法成为了亚马逊*根本性的*商业战略。通过与好市多批发公司创始人吉姆·西尼格尔的一次喝咖啡交谈，这个原本只是直觉的想法转化为了一种运营模式。\n\
  \n好市多的模式建立在通过以最低价格提供有限选择的商品来赢得客户忠诚度的基础上。好市多批量采购，并采用 14%的标准加价。其大部分利润来自年度会员费。它有能力通过低价创造巨大的销售额，从而向供应商要求低价。\n\
  \n正如西尼格尔对贝佐斯所述，有时供应商会抵制好市多的经营方式。“你可以用那些不想卖东西给我们的人把塞菲科球场填满。但过了一段时间，我们创造了足够的业务，证明了我们是一个好客户，我们会付清账单，信守承诺。”\n\
  \n“然后他们（供应商）说，‘我他妈的为什么不跟这些家伙做生意？我一定是傻了。他们是一种极好的分销形式。’”\n\n**第四章 | 当销售渠道被劫持**\n\n\
  贝佐斯“汲取了 2001 年那次咖啡交谈中学到的经验，并将其残酷地应用起来”。接下来的那个周一，他告诉他的高管团队，亚马逊从此以后将像沃尔玛和好市多一样实行“天天低价”。公司将以其价格对标大型零售商，并且每次都要与他们的最低价格持平。同年\
  \ 7 月，亚马逊降低了其商品价格。\n\n\n\n### 客户陷阱\n\n关于图书、视频和音乐的利润率从 20%到 30%不等\\¹\n\n像 Costco\
  \ 和 Amazon 这样的潜在超级客户希望支配供应商的欲望，在电视上被公之于众时就变得更加明显。每隔几个月，商业新闻频道 CNBC 就会深入报道某一家公司。2012\
  \ 年，新闻团队探究了 Costco，像大多数这类时长 1 小时的纪录片一样，大部分时间都花在了与 CEO 的访谈上。毫不奇怪，这部纪录片看起来更像是一则商业广告。它给了\
  \ Jim Sinegal 一个大舞台来宣扬 Costco 所有令人赞叹的优点。在节目进行到大约 16 分钟时，Sinegal 对着镜头所说的内容，几乎和他 2001\
  \ 年与 Jeff Bezos 喝咖啡时所说的话如出一辙。\n\nCNBC 主持人 Carl Quintanilla 问 Sinegal：“有没有一些公司的品牌不愿意卖给你们？”\n\
  \nSinegal 立刻回答：“当然有。你可以用那些在某个时间点不想卖给我们产品的公司，把洋基体育场挤满……如果一个供应商拒绝卖给我们，他们拒绝的原因只有一个。那就是因为我们把商品带到市场上的价格。”\n\
  \n然后 Sinegal 平淡地断言：“最终我们总能拿到他们的产品并销售出去。”\n\nCostco 是如何能够“最终拿到他们的产品并销售出去”的，这几乎到了有失体面的地步。在\
  \ CNBC 的采访中，Sinegal 欣然承认，Costco 经常在“灰色市场”采购。在这种有争议的做法中，零售商绕开制造商，通过第三方分销商购买产品。\n\n\
  灰色市场主要有两种类型。第一种是寻找那些在特定国家通常无法获得或价格更高的进口制成品。这种情况通常是在制造商的默许下发生的，被视为一种更有效地管理库存和全球分销的方式。\n\
  \n第二种类型，也是 Costco 和其他公司频繁使用的，是有效惩罚那些拒绝通过超级客户销售的公司，因为它们拒绝踏入“客户陷阱”。为了控制这些“异类”，超级客户会通过制造商传统的销售和分销渠道，以全额零售价大量购买产品。然后，超级客户将这些制造商的产品以远低于其他任何地方的价格摆上货架。当然，超级客户会因此在销售中亏损。但利润并非超级客户的目标。相反，这是向任何顽固的制造商发出的警告：“按照我们的条件与我们合作。如果你不合作，我们就会通过迫使你的分销商降价来匹配我们的价格，从而搞乱你的渠道。当然，如果他们这样做，他们将无法赚钱，并会停止购买你的产品……”\n\
  \n当 CNBC 的 Quintanilla 问 Sinegal，对于通过灰色市场买卖产品是否感到良心不安时，Sinegal 直言不讳。“这有什么不对的地方在于，当人们试图操纵市场以便控制价格并人为地维持高价时。那是错的。”²\\\
  ²\n\n那么，我们来分析一下：这里有一个美国最大零售商之一的 CEO 明确表示，当制造商试图维护其价格的完整性并避免“客户陷阱”时，那是“错的”。从 Sinegal\
  \ 的角度来看，*他*有责任保护广大消费者，免受那些投资于创造和开发新产品的公司的操纵行为之害——即使这意味着 Costco 必须从事操纵和可疑的行为！\n\n\
  在许多超级客户的心目中，分销商才是资本主义中最重要的角色。创新者、创造者和建设者实际上不过是*他们*自己所创造的商业体系中的棋子。\n\n\n\n"
- "# 排版后的文本\n\n尽管巨头企业既没有发明任何东西，也没有承担将新产品推向市场的巨大风险，但正是其庞大的规模赋予了它们无可置疑的道德权威。它们最清楚什么对我们其他人最有利。\n\
  \n这种傲慢简直令人难以置信。\n\n#### 进步前先退一步\n\n正如我们先前所述，客户陷阱的根本现实是大客户对创新者业务的全面接管。一旦 10%法则被打破，控制权就会被夺走，权力会不可逆转地流向经销商和分销商。对单一客户的日益依赖，极大地削弱了创新企业对其产品在价值链中走向的影响力。\n\
  \n然而——这一点至关重要——经销商、中间商和分销商本质上**并非**充满敌意，也并非要不惜一切代价避免合作。如果管理得当，经销商、中间商和分销商在帮助建立供应商品牌方面发挥着关键作用。如果某个客户（即使它是大型连锁零售巨头，或是经济另一领域的主导者）持续只占公司总收入的\
  \ 10%或更少，那么权力平衡仍然倾向于创新者一方，这才是资本主义应有的运作方式。最大的收益应归于承担最大风险的人。其他合作伙伴如果创造了价值，也应从中受益。尽管如此，利润的最大份额应归于投入最多、风险最高的一方。当这一原则被违反，那些投入甚少者却攫取了最大份额时，客户陷阱就出现了。²\n\
  \n> ² 您可以观看 CNBC 的纪录片《好市多热潮》，并在[www.cnbc.com/id/46603589#.](http://www.cnbc.com/id/46603589%23)\
  \ 收听西尼格尔的评论。该片最初于 2012 年 4 月 9 日播出。\n\n***第 4 章 | 当销售渠道被劫持***\n\n#### 挟持数据以要挟\n\n\
  客户陷阱也可以在数据共享和信息透明度的领域观察到。在过去的四分之一个世纪里，商业中最重要的特征之一涉及信息的获取和控制。“如果你无法衡量它，就无法管理它”这句格言比以往任何时候都更加真实。自信息时代来临以来，企业领导者们一直试图获取关于其业务各个方面的更多、更优质的信息，以便进行更有效的管理。\n\
  \n如今，任何有真才实学的人都不会质疑组织并理解数据的重要性。世界各地的商学院都在竞相推出新的商业分析方向的 MBA 项目和课程。咨询公司正在吹捧“大数据”是知识经济进步的下一个阶段。商业媒体每天都会刊登强调利用信息好处的文章。\n\
  \n当然，要做到这一点，信息需要在上游和下游之间，以及公司内部和外部之间流动。信息流动的频率以及信息的透明度，共同决定了用于决策的数据质量。\n\n其基本假设是，这些信息，再加上数据收集软件的不断改进、更好的分析工具以及看似无处不在的“云”，将开启一个新时代，在这个时代，信息将以前所未有的方式赋予领导者力量。然而，像大多数假设一样，它只有在起作用时才起作用。\n\
  \n用一个恰当的说法来形容，这真是一个悖论：尽管当今商业中数据广泛可用，但大客户的存在却阻碍了许多创新公司获取其迫切所需信息的能力。数据确实存在，但许多大客户就是不向供应商提供这些数据。\n\
  \n许多公司对其创新产品进入销售和分销渠道后发生的事情，几乎是盲目飞行。获取关于创新产品进展信息的能力受到了阻挠。\n\n\n\n#### 顾客陷阱 49\n\n\
  由大型客户引发。例如，在消费品零售领域，实体大型零售商——沃尔玛、塔吉特、家得宝等——会挟持其供应商的产品数据。只有在便利大型零售商自身时，它才会向供应商释放部分信息。而这仅当符合大型零售商利益时才会发生。\n\
  \n更令人沮丧的是，该经济领域的许多供应商已经放弃从大型客户处获取有关创新的数据。他们默认无法获取数据是正常的，仅仅是“一贯如此的做法”。顾客永远是对的，不是吗？如果大型客户不愿主动分享关于我们产品的信息，那我们又有什么资格去问呢？结果，美国企业在管理自身时往往如同在黑暗中射击。表\
  \ 4-1 展示了与各业务职能部门相关的渠道数据所面临的主要挑战。\n\n**表 4-1.** 主要业务职能与挑战 3\n\n| **职能领域** | **缺乏渠道数据透明度的主要挑战**\
  \ |\n| --- | --- |\n| 市场营销 | 更难识别市场进入壁垒与新的市场机遇 |\n| 销售与分销 | 预测客户需求及提供有效渠道激励的难度增大\
  \ |\n| 供应链 | 管理产品流动的复杂性增加 |\n| 信息技术 | 缺乏可供分析的可执行情报 |\n| 人力资源 | 在预测需要新员工和/或现有员工再培训的变化方面存在弱点\
  \ |\n| 财务 | 不愿寻求新的融资选择 |\n| 风险管理 | 无法识别企业面临的所有风险 |\n| 创新 | 对浪费研发资源的过度恐惧 |\n| 战略\
  \ | 决策主要依赖猜测驱动 |\n\n例如，在市场营销领域，有人会想，一家公司连最终用户和终端客户是谁都可能不知道，又如何能确定市场对其品牌和产品的看法？这种认知的缺乏加大了识别产品进入市场障碍的难度，也遮蔽了从中介另一端可能发现机遇的视野。\n\
  \n3 此表由 Zyme Solutions 与作者共同开发。\n\n## 第 4 章 | 当销售渠道被劫持\n\n这种信息透明度缺失的一个例证出现在销售与分销领域。作为前分销商和制造商，我们自己听到“渠道激励”这个词就会感到脊背发凉。为了在拥堵或混乱的渠道中提升产品可见度并推动销售，许多制造商试图增加提供给下游的激励。传统上，人们认为通过有形的财务奖励来吸引渠道合作伙伴，会使这些合作伙伴的注意力重新聚焦于特定产品或产品线。虽然提供诱因的想法植根于关于人类行为的理性理论，但现实情况要复杂得多。这让我们想起约吉·贝拉的名言：“理论上，实践和理论之间没有区别。而在实践中，区别*是*存在的。”\n\
  \n例如，当我们深入探究渠道激励的有效性时，我们发现，在那些根本无法核销的数十亿美元资金面前，存在着一个巨大的黑洞。效率低下，似乎成了操作术语。我们估计，高科技行业约\
  \ 1 万亿美元的销售额（大约 20%）通过业绩激励返还给了渠道合作伙伴。这包括向经销商、转售商、分销商及其他合作伙伴提供的返点、折扣、即时奖励等。总计接近 2000\
  \ 亿美元。我们发现，其中约 10%要么是超额申报，要么是支付给了错误的实体。这大约有 200 亿美元！\n\n此外，任何时候还有另外 2000 亿美元的现有库存被积压着。\n\
  \n\n在高科技分销渠道中，预计有 30%到 40%的库存面临被注销、打折或被视为过时的风险；而其中，由于渠道效率低下，有 10%到 20%的库存根本无法获取。这意味着又有\
  \ 60 亿到 160 亿美元被错误配置。\n\n信不信由你，在这个价值 2.5 万亿美元的工业领域，几乎没有任何关于此问题的研究正在进行。如果我们暂时假设高科技领域的数据在一定程度上适用于工业领域，那么我们在渠道激励的错误配置和库存价值损失方面，保守估计会达到约\
  \ 500 亿美元。\n\n即使在信息透明的情况下，管理供应链也足够具有挑战性。追踪物品的当前位置及去向，需要持续获取高质量数据的流动。一旦失去这种数据流动，一切都会变得像爱丽丝梦游仙境一样，上下颠倒，左右不分。\n\
  \n只要输入的数据具有高质量和可靠性，信息技术就可以成为公司的宝贵资产。然而，一旦数据流被切断，即使是最优秀的分析团队，也只能在黑暗中摸索，对于外界真实发生的情况一无所知。\n\
  \n企业的人员管理方面也是如此。能够在竞争对手之前识别出需要额外员工的市场变化，是招聘顶尖人才的经过验证的方法。当然，如果在招聘方面能保持领先一步，那么能够预判市场需求的变化就会容易得多。留住顶尖人才也是如此。让优秀员工了解新兴的最佳实践是维持和建立忠诚度的一种方式。所有这些都需要对真实发生的情况有清晰的认识。如果一个特大客户劫持了公司产品和服务的关键数据，那么企业几乎不可能成为许多顶尖人才所期望的那种积极主动的雇主。\n\
  \n当今公司可用的各种融资工具确实令人印象深刻。尽管最近的金融创新招致了许多负面评价——其中很多是罪有应得——但商业融资选项在数量、质量和可用性方面都出现了指数级增长。要评估其中任何一种的价值，公司在介入之前必须掌握关于自身的必要信息。如果特大客户不提供所需数据，这种评估如何进行？风险管理也面临同样的制约。借用美国前国防部长唐纳德·拉姆斯菲尔德的话来说，未知的未知是无法评估的，因为我们根本不知道它们的存在。\n\
  \n大量新产品的失败都根源于此。创新者进入市场时，等于被绑住了一只手。他们根本不掌握在日益复杂的世界中进行管理所需的信息。如果通过艰苦卓绝的努力，他们做对了所有事情，并将真正有价值的东西引入市场，但由于缺乏来自销售和分销渠道的数据，创新者只能寄希望于更美好的明天。他们只能凭直觉行事，并像个在圣诞节期待礼物的孩子一样，希望下一个草率的决定能带来奇迹。\n\
  \n当然，拥有所有可用数据并不能保证成功。即使我们能够了解正在发生的事情，商业本身也足够艰难。但缺乏数据而运营则是灾难的根源。这是对稀缺的研发资源、激励措施和人类创造力的可悲浪费！事情本不必如此。然而，这却常常发生。\n\
  \n归根结底，信息透明度的缺失使得那些渴望权力的实体，甚至可能是邪恶的个人或团体，能够劫持众多公司来之不易的创新成果。向一个特大客户让渡过多控制权，只会带来无穷的下行风险。如果你觉得情况不能再糟了，那就请继续往下看。\n\
  \n**第 章**\n\n活出\n\n外包\n\n的冲动\n\n\n\n> *我付高薪并非因为我钱多；我钱多是因为我付高薪。*\n> \n> ——罗伯特·博世\n\
  \n政府、商学院以及多数行业中的传统观点认为，企业选择关闭成本高昂的本国业务，转向其他国家寻求更优前景和更高利润。在美国，生产一件产品的成本比在本土低 30%到\
  \ 50%，这被广泛认为是近年来美国公司纷纷涌向海外的原因。迄今为止，关于外包（更准确地说是“离岸外包”）的讨论，一边是交易成本降低、效率提升和利润丰厚，另一边则是失业、社会动荡以及因行业为适应数字化全球时代新现实而重组所引发的经济焦虑。1\n\
  \n> 1 本章部分内容基于安德鲁·R·托马斯和蒂莫西·J·威尔金森的《外包的冲动》，*MIT 斯隆管理评论*，2006 年秋季刊，第 10-14 页，经出版商许可使用。版权归麻省理工学院所有。保留所有权利。\n\
  \n### 第 5 章 | 深陷外包的冲动\n\n在外包与离岸外包的讨论中，战略维度常常被忽视。事实上，对海外外包的冲动性拥抱——尤其是先是涌向印度、然后是墨西哥、接着是中国，现在又转向孟加拉国和越南等成本更低地区的这股外包热潮——与其说与国际商业相关，不如说与产品在美国本土市场上的买卖方式有关。离岸外包现象本质上是大客户作为一种商业策略，有意识地削弱美国工业结构的行为。美国生产商向海外转移，与其说是为了寻求新市场和新机遇，不如说是对大客户们在本土运用的权力策略所做出的防御性反应。\n\
  \n根本现实在于，并非企业的贪婪驱使着美国制造业的大规模外流。迫使成千上万家企业关闭美国业务并裁员的，是前几章所述销售与分销模式中的失衡。美国公司对离岸外包的冲动式接受，并非源于内部生成的目标，而是企业为了生存的纯粹需求所驱动。\n\
  \n#### 全球化：多半是必要的恶\n\n与世界其他地区不同，对大多数美国公司而言，全球化往往是一个事后的附带考虑。美国本土市场之外确实存在着增长机会，约 70%的*所有*商业活动都在此进行。当然，近年来新兴市场的崛起为接触新的中产阶级消费者提供了机遇。美国公司早已深知，美国品牌的力量在全世界引起共鸣。苹果、可口可乐公司、卡特彼勒和谷歌等品牌，在阿斯塔纳或亚松森与在阿克伦一样家喻户晓。\n\
  \n尽管如此，绝大多数美国公司仍将重点放在服务庞大的内部消费市场上——仅消费品一项就约达 4190 亿美元.2。例如，尽管中国拥有世界最多的人口（约 14 亿），但如今过着西方中产阶级生活方式的中国人大约只有\
  \ 7000 万——仅比阿根廷和秘鲁人口总和略多。最终，包括外包和离岸外包活动在内，大部分美国业务仍坚定地聚焦于国内发生的一切。\n\n> 2SelectUSA，“美国的消费品行业”，[`selectusa.commerce.gov/industry-snapshots/consumer-goods-industry-united-states`](http://selectusa.commerce.gov/industry-snapshots/consumer-goods-industry-united-states)，访问日期：2015\
  \ 年 2 月 13 日。\n\n***顾客陷阱*** 55\n\n\n\n自内战结束以来，美国市场一直是各类企业遥遥领先的最大单一目标。一个安全的洲际岛屿、几乎无限的自然资源、与其规模相比规模较小且不显眼的政府、一套充满活力的资本创造与分配体系，以及创业文化——这些因素的独特融合使得美国在人类历史上独树一帜。这些力量交织在一起，仿佛冥冥中自有天意。过去\
  \ *15 个十年* 中的每一个十年，尽管经历了衰退、萧条、崩盘和泡沫，美国经济在十年结束时的财富都比开始时更加丰厚。3 事实上，美国崛起为全球主导经济力量，本身就是过去\
  \ 150 年来的 *核心* 商业故事。正如约翰·斯蒂尔·戈登所言，一个多世纪前美国就已形成并至今仍是——\"财富帝国\"。\n\n到第二次世界大战结束时，美国已不仅仅是一个经济超级大国。美国海军在海上称霸，拥有有史以来最庞大的舰队。美国的飞机在天空中巡逻，毫无阻碍，且已两次展示了其制造和部署原子弹的能力与意愿。好莱坞娱乐着全世界。地球上超过一半的资本掌握在美国手中。历史上从未有哪个国家如此强大。也许上帝真的\"\
  恩泽降临于你\"。\n\n然而，手握如此庞大权力的美国，在人类历史进程中做了一件独特的事。美国人没有沿用古代那套让新近脆弱的民族遭受报复性惩罚的老剧本，而是真正震惊了世界。从\
  \ 1944 年 7 月的布雷顿森林会议开始，美国向其弱化的盟国和被征服的敌国伸出手，提出了一个令人难以置信的提议：我们将提供你们重建国家所需的资本，并承担保护你们免受威胁者侵略的重担。作为交换，美国要求这些国家支持在世界范围内推广美式资本主义。此外，为了使这笔交易更具吸引力——尽管它已经足够诱人——美国人宣布，在自由贸易的旗帜下，外国产品和公司将几乎可以无限制地进入庞大的美国市场。\n\
  \n当美国人提出这个方案时，没有人敢相信自己的耳朵。这个历史上最具主导地位的国家竟然表示，其未来的战略愿景是一个建立在消费者和生产者基础上的世界。而且，令人难以置信的是，确保这一愿景所需付出的几乎所有代价和负担，将不由战败国承担；相反，战争的胜利者将在未来数年内承担起重任。这一切似乎好得令人难以置信。然而，这一切\
  \ *确实* 是真的。\n\n3 美国国家经济研究局，《美国商业周期》表格，[www.nber.org/data/abc/](http://www.nber.org/data/abc/)，访问于\
  \ 2014 年 12 月 26 日。\n\n## 第五章 | 深陷外包的必然\n\n无需应对苏联的敌意，也无需担忧与邻国长达数百年的宿怨，像英国、法国、德国、日本、台湾和韩国这样的国家和地区可以全神贯注于重建自身经济。美国提供的安全保障，确保了商业活动可以在不受其他试图干扰其发展者的干涉下顺利进行。美国通过马歇尔计划等项目提供的资本刺激，极大地推动了西欧和东亚的发展。后来，其繁荣的很大一部分来自于向美国的出口。最终，由尼克松总统于\
  \ 1972 年开启的中国融入全球经济进程，以及 1990 年苏联的解体，在可预见的未来确保了主导全球的意识形态将是美国所实践的那种资本主义。\n\n要理解这种美式资本主义在美国如何演变，\n\
  \n\n#### 各州形势，尤其是与销售和分销相关的部分，需要回溯至 19 世纪及 20 世纪初。\n\n#### 销售与分销：历史回顾\n\n在 19 世纪中叶，销售与分销还是一个随机无序的命题。随着美国向西扩张，定居者们依靠流动小贩提供服务，这些小贩的货物要么来自东部城市，要么来自偏远的西部前哨。偏远地区的店主则通过每年两次前往大城市采购来补充库存。铁路和电报的发展——这两项创新让今天的互联网相形见绌——彻底改变了商业运作方式。\n\
  \n新技术的最初受益者是批发商，也被称为\"中间商\"。这些人通过庞大的采购网络直接从生产者手中获取货物所有权，再通过（在当时看来）大规模的营销组织，向边疆地区的杂货店销售。铁路的速度和可预测性，加之通过电报订货的能力，扩大了中间商的分销能力，从而降低了单位成本，进而带来了更高的利润。正如新体系的便利让店主能够专注于本地业务一样，制造商也因能立即收到货款而非等待货物售出而受益。\n\
  \n内战结束后，中西部地区的乡村商店遍布整个南方，由提供全方位服务的批发公司供货，这些公司在 19 世纪下半叶主导了分销领域。批发商依靠一大批乘火车和马车出差的销售员，帮助店主升级运营、改进会计实务并提升商品陈列水平。此外，他们还发展了复杂的采购业务。这些采购员的活动差异很大，因为每条产品线都需要特定的专业知识和针对市场的专门方法。\n\
  \n***顾客陷阱*** 57\n\n在某些情况下，货物直接来自海外制造商。有时，情况要求为批发商开发自有品牌。另一些时候，批发商会成为某个制造商产品的独家经销商。虽然偶尔会出现向后整合进入制造业的情况，但大多数批发商专注于买卖而非生产。\n\
  \n批发商在本质上是一个经济活动的组织者。其职能领域通常包括\"运输\"部门，负责安排从制造商到仓库、再到零售商的发货调度。随着这一体系的发展，一项至今仍在使用绩效衡量指标逐渐形成。`库存周转率`被定义为\"\
  在特定时间段内（通常为一年），库存商品被售出并补充的次数\"。4`库存周转率`衡量的是分销的速度。高库存周转率意味着产品在仓库货架上停留的时间更短，这表示更低的单位成本和更高的单位工人产出。正是电报和铁路的发展，使得高库存周转率成为可实现的目标，并创造了大规模营销的可能性。\n\
  \n#### 大规模零售业的兴起\n\n到 1880 年，批发商开始被两种力量超越：一种是直接从生产商采购并通过自有店铺销售的大规模零售商，另一种是建立自有批发业务的制造商。在这两种情况下，此前占据主导地位的批发商的业务被接管，从而创造了更高的运营效率。零售商之所以胜出，是因为他们能够比批发商实现更大规模的规模经济（与产品数量相关的较低成本）和范围经济（与营销不同类型产品相关的较低成本）。\n\
  \n新兴的大规模零售商有四种形式：百货商场、邮购公司、零售连锁店和垂直整合企业。\n\n##### 百货商场\n\n\n"
- '# 百货公司与邮购商行


  百货公司是城市发展的产物。原本销售服装或布匹的零售店，在增添家具、玻璃器皿、珠宝及其他新产品线后，便演变为百货公司。梅西百货和布鲁明戴尔百货遵循了这一发展路径，尼曼-马库斯和马歇尔·菲尔德也不例外。百货公司兴起的背后推动力，是美国内战后数十年间城市人口的急剧增长。随着城市人口膨胀，为满足新兴城市消费者阶层的需求，地毯、软垫家具、皮草、男女服饰、帽子、鞋履、玩具等新商品线纷纷加入。这些百货公司的经营策略相当一致：


  > 它们旨在通过低价低利销售来维持高销量、高周转的业务流。利润来自销量而非加价……最重要的是，这些大众零售商专注于保持高水平的库存周转率。它们通过降价处理滞销商品、大举投放本地广告以及建立清晰的管理架构来实现这一目标.5


  百货公司以分权式控股公司的模式进行管理，部门负责人拥有极大自主权，几乎可全权决定商品买卖的所有事宜，只需向中央组织汇报其财务业绩。例如，鞋类部门负责人将全权决定从何处采购鞋履、如何定价，甚至店铺鞋类广告文案的措辞。


  有时，百货公司会向上游整合，自行生产少量商品，如服装或软垫家具。然而，这种情况相当罕见，管理层通常避免控制或管理供应商的活动。相反，如前文所述，早期百货公司的策略基于库存周转率（流速）。例如，在
  20 世纪的大部分时间里，马歇尔·菲尔德的库存周转率为 5，而梅西百货在 1887 年的库存周转率达到了 12。高库存周转率使得企业能够通过低价销售、以更低的利润率赚取更多利润。小零售商们对这种新的不公平竞争怨声载道，纷纷要求州立法保护自己免受百货公司低价的冲击。


  ##### 邮购商行


  电报和铁路也为第一批直复营销商铺平了道路。虽然在内战前就已存在有限的形式，但邮购商行在随后的岁月里蓬勃发展。第一家完全通过目录销售品类繁多的商品的机构是蒙哥马利·沃德公司，其商品目录超过
  500 页，列出约 24,000 种商品。西尔斯罗巴克公司紧随其后，到 1895 年，它通过一份 532 页的商品目录，几乎销售当时所有可用的消费品。商品包括鞋履、四轮马车、渔具、炉灶、瓷器、马鞍、枪支、轻便马车、玻璃器皿和乐器。1893
  年销售额为 40 万美元，两年后几乎翻了一番。6 与当时的百货公司一样，每个商品部门完全自主运营；采购员全权控制销量、目录定价以及支付给供应商的价格。邮购商行销售额的几何级增长促使它们向上游整合进入制造业。到
  1906 年，西尔斯运营着 16 家制造厂，为其众多产品线维持稳定的商品供应。其精密的物流体系使其零售额超越了百货公司。


  西尔斯和蒙哥马利·沃德通过基于流速（高库存周转率）和低利润率降低价格来增加利润的能力，创造




  ##### 政治风波与零售业演变


  20 世纪头十年爆发了一场政治风波。小型零售商和批发商谴责他们所认为的不公平竞争，就像前几十年他们曾针对百货公司那样。尽管抗议声不断，一项将乡村地区包裹邮递服务范围扩大的法案还是在
  1912 年获得通过。大规模零售业并未被根深蒂固的地方利益所阻碍。事实上，政府行动反而促进了其发展。


  ##### 连锁商店


  在新世纪之初，连锁商店在美国零售业中崭露头角。到了 20 世纪 20 年代，它们遭遇了与多年前百货公司和邮购公司相同的政治攻击。连锁商店与百货公司有两个不同之处：第一，它们由分布在一定地理区域内、销售类似商品的多家店铺组成。第二，与百货公司和邮购公司不同，它们实行集中管理。在其他形式的零售企业中，采购员像经营独立王国一样运营各个部门，而连锁商店的经理则听从总部的指令。


  谈及连锁商店，一位 20 世纪 20 年代的作家写道：“有些是集中所有但独立经营。有些是集中控制和运营——这是普遍且最成功的类型。\⁷”采购员由连锁店总部的专家组成。人事部门掌管招聘和解雇事宜。店铺经理被比作操作机车的工程师。关键在于标准化：


  > 标准化流程几乎延伸到连锁活动的每一个阶段；店铺外观统一；内部设备相同；一家店铺货架上的存货种类和摆放位置与连锁店中任何其他店铺一致；运营店铺的指令也完全相同。每位经理都必须每日填写相同的表格，执行相同的现金管理流程、夜间锁门流程以及所有店铺管理的详细琐事。\⁸


  F.W. Woolworth 在 19 世纪 80 年代初期在宾夕法尼亚州经营着七家店铺。到世纪之交，其销售额已达 500 万美元，到 1909 年，它在美国各地经营者
  318 家店铺。与其他零售商类似，其成功基于存货周转率。在 20 世纪 20 年代中期，Sears 和 Montgomery Ward 开始开设自己的连锁商店；大型百货公司在
  20 世纪 30 年代也采取了类似的做法。


  在此期间，生产商与零售商之间的关系承受着压力，这主要是由于制造商所行使的权力，以及生产与分销活动之间缺乏相互依存性。在 20 世纪的大部分时间里，沟通是通过邮件或昂贵的“长途”电话进行的。计算机直到
  20 世纪 60 年代才实现商用，它们价格昂贵、难以使用，且无法相互“交谈”。行业领导者 Walmart 直到 1987 年才开始使用信息技术来协调其供应商，而电子邮件直到
  20 世纪 90 年代中期才被广泛使用。我们今天认为理所当然的沟通能力，在过去是一项更为复杂的事务。


  ##### 垂直一体化企业


  在 20 世纪的大部分时间里，中介情境的例外情况存在于垂直一体化企业中，这种企业将制造业与销售和分销职能结合在一起。通过在内部协调业务活动，而不是通过外部市场进行协调，生产……




  企业可以掌控分销的方方面面，避免与中间商打交道，并消除与销售实体进行谈判的必要性。制造商自行发展分销能力，包括销售、服务、融资、安装及其他适当的辅助活动。


