  ## 第 8 章 | 获取数据并做好市场营销


  `Sankaran` 阐述了创新者如何逐渐认识到数据对其业务至关重要，而通过渠道获取数据尤为关键。此外，这种好处并非单向的。数据共享对制造商和中间商都有利。


  对制造商和品牌所有者而言，渠道可见性是一个相对较新的现象。过去，分销商经常以各种借口拒绝向供应商提供销售信息和可见性。


  如今，客户在要求这种透明度方面展现出更大的决心。他们更有可能对不愿共享数据的分销商说：“你知道吗，没关系。下个季度将是你作为我们该市场合作伙伴的最后一个季度，因为信息透明度是我们管理渠道的核心。”7
  于是，他们的分销商会迅速服从。


  #### 头部、躯干和尾部


  `Sankaran` 和 `Zyme` 信奉他们所谓的“分销渠道的头部、躯干和尾部”这一概念，并认为这是 `CDM` 的核心概念。这是一个从最大到最小的合作伙伴的`帕累托`分布，如图
