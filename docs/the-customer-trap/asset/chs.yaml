  \ 日，第 A6 版。\n30 达娜·米尔班克，《固特异独立经销商反叛：通过西尔斯销售的决定不得人心》，《华尔街日报》，1992 年 7 月 8 日，第 B2\
  \ 版。\n\n## 第二章 | 顾客陷阱与品牌毁灭\n\n经销商们不仅要应对新竞争对手，大型零售商的快节奏、低价策略还迫使他们也降低价格，导致所有人的利润率都变低了。经销商们并没有坐以待毙，任由脚下的地毯被抽走。正如固特异前经销商、辛辛那提全美轮胎服务公司老板曼尼·德拉卡基斯所说：“当别人扇了你几次耳光后，你总会说受够了。”\n\
  \n随着固特异与其经销商网络之间微妙的关系被破坏，经销商们很快找到了其他合作对象。他们不再独家销售固特异轮胎，而是开始经营多个品牌。佛罗里达州一家大型经销商副总裁帕姆·菲茨杰拉德在接受《华尔街日报》采访时说：“我们会出售我们认为能给顾客带来最大价值的产品，而这已经不再一定是固特异了。”这家经销商采用新品牌，导致固特异轮胎销量下降了\
  \ 20%。\n\n至于西尔斯，它利用固特异轮胎作为吸引顾客的诱饵，但随后却推销自己的商店品牌 RoadHandler 以及其他自有品牌。\n\n2000 年，总部位于纳什维尔的普利司通美洲轮胎业务部门召回了数百万条被美国国家运输安全委员会认定为存在潜在安全隐患的原装及替换轮胎。当时，这家公司的生存似乎岌岌可危。然而，两年后，普利司通...\n\
  \n\n得益于`Bridgestone/Firestone`轮胎销量的增长，该公司报告了 1.35 亿美元的营业利润。同期，`Goodyear`在北美市场的销量下滑了\
  \ 12%，营业利润也急剧下降，从 8000 万美元跌至仅 1000 万美元。根据行业期刊《*Tire Business*》的一篇评论，这两家公司命运的分化可归因于它们管理经销商网络方式的差异。`Bridgestone`及其前身`Firestone`努力打造忠诚的经销商网络，因此当市场不景气时，经销商仍会与公司共进退。相比之下，`Goodyear`的经销商感觉被制造商欺骗了，因此对其毫无忠诚度可言。\n\
  \n该评论接着写道：\n\n> 许多`Goodyear`经销商对公司感到愤怒，不再像以前那样对这个轮胎制造商抱有忠诚。但这家曾拥有无与伦比的经销商追随者的公司，完全有理由重新赢回这份忠诚。它必须再次将独立经销商作为其首要任务。自这家总部位于`Akron`的轮胎制造商多年前开始在其自有门店和独立经销商之外扩大销售和分销渠道以来，它一直在失去动力。`Goodyear`的独立轮胎经销商是这家轮胎公司最宝贵的资产之一。他们站在销售第一线，往往决定着零售轮胎客户最终购买什么。他们可以帮助公司重振旗鼓。`Goodyear`越早认识到这一点越好。\n\
  \n尽管行业观察家提出了建议，`Goodyear`仍继续向其“大客户”推销产品。到 2003 年，它已失去对销售和分销渠道的控制，并向大众市场提供普遍被视为大众品类的产品。接替`Gault`的新任\
  \ CEO 承诺与经销商和解，但这一承诺至今尚未兑现。\n\n其他轮胎制造商呢？它们是否也落入了“客户陷阱”？`Bridgestone`仍拥有忠诚的经销商网络。`Michelin`与经销商密切合作，同时也面向大众市场销售，但由于其轮胎在市场上定位为高端产品，“大客户”在利润率上更难压榨他们。`Michelin`进行的研究表明，购买`Michelin`或`BFGoodrich`品牌的客户在购买轮胎时平均花费\
  \ 388 美元，比其他品牌平均花费高出 30%。\n\n至于轮胎经销商呢？自`Goodyear`抛弃其经销商网络以来的这些年里，轮胎零售业务经历了大规模行业整合，排名前\
  \ 100 的轮胎经销商平均经营着 58 家门店，同时代理超过 10 个品牌。由于`Goodyear`切断了制造商与忠诚经销商之间的联系，许多独立经销商在这种新格局下获得了巨大收益。\n\
