  \ 决心掌控其产品的命运，其高管不必面对这种“好消息/坏消息”的窘境。\n\n虽然 STIHL 是避免“客户陷阱”的最佳范例之一，但其他公司也成功避免了这一错误。接下来，让我们看看其中一些公司如何保持对其创新的控制。\n\
  \n## 创新：第二步\n\n*事物并不总是表面看起来那样；第一印象会欺骗许多人；只有少数人的智慧能洞察到被精心隐藏的东西。*\n——菲德鲁斯，罗马诗人\n\n\
  根据教科书，销售和分销应从客户需求的角度来对待。个人或公司只是希望产品在特定时间和地点、以正确的数量和合适的价格供应。虽然从客户的角度来看这无可非议，但这种观点忽视了创新公司的利益，这些利益往往与客户的利益相冲突，尤其是在创新者经历脆弱的规模化过程，且“客户”占总收入的比例超过\
  \ 10%时。\n\n问题在于，较小的创新型企业特别容易受到大型巨头客户单向权力的影响。许多小企业的快速增长往往是在他们与大规模客户达成交易“做大”时发生的。小公司通常资源有限。因此，完成巨额订单的压力很快就会变得难以管理，因为巨头客户要求产品必须完全按照规格并且**准时**交付。\n\
  \n---\n\n1. 本章基于 Timothy J. Wilkinson 和 Andrew R. Thomas 所著《创新的第二步》，《雷鸟国际评论》，第 56\
  \ 卷（3 期），2014 年 5 月/6 月。\n2. Nigel Piercy，《市场导向的战略变革》第 4 版（伦敦：Elsevier Butterworth-Heinemann，2008\
  \ 年）。\n\n*第 7 章 | 创新的第二步*\n\n谈到公司运营，前 *Office Depot* 副总裁斯科特·科尔纳表示：“我们拥有一台机器，每个环节都必须像钟表一样精确运转，我们才能高效运作。我见过很多小公司……”\n\
  \n\n\n那些无法应对这一挑战的企业会迅速衰败。”3\n\n对于许多供应商而言，本就用于新产品开发和现有客户持续服务的时间，被无休止的文书工作和谈判所挤占，而这一切正是管理大客户的核心内容。我们的学生萨姆和他的园林绿化公司就遭遇了这种情况。他过于专注于满足大客户的需求，以至于再也没有时间顾及自己的其他客户。\n\
  \n通常，规模扩张的过程更多地取决于当下的紧迫性，而非战略性的决策。因此，销售和分销渠道往往会以临时的方式发展。当一个大客户接受了一款创新产品，产品便会“一飞冲天”，而生产商则被迫手忙脚乱地应对新的需求，以及满足这些需求所带来的日常管理挑战。这种紧迫性使得生产商很容易受到其“合作伙伴”长期战略的影响——这些合作伙伴拥有经验、知识和战略眼光，足以支配那些热情高涨但资源有限的创新者。\n\
  \n互联网的出现进一步增强了大型客户的力量。沟通、信息收集和完成交易不再需要高昂的成本。大型客户可以要求其供应商在运营上保持透明，因为技术已经让透明变得既容易又相对廉价。正如迈克尔·波特所言：“互联网技术让买家更容易获取关于产品和供应商的信息，从而增强了买家的议价能力。”4\n\
  \n最终，创新企业可能会面临这样一个问题：大型客户能够攫取创新产品的大部分价值，同时迫使创新者改变其运营模式、价值链和产品。与此同时，创新企业还面临着疏远其传统分销商、门店或其他渠道成员的风险。此外，为了降低成本以满足零售合作伙伴的价格点，创新企业往往不得不将生产外包至海外。\n\
