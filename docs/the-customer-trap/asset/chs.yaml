  \ 卷，第 5 期（2004 年），第 58 页。\n\n***第二章 | 顾客陷阱与品牌毁灭***\n\n\n\n#### 丹宁生产线——Capital E\
  \ 品牌——直至 2006 年，远在奢侈品潮流初次兴起之后\n\n2011 年上任的首席执行官奇普·伯格对李维斯公司的困境发表过这样的看法：\n\n> 我们正努力让李维斯公司重现辉煌。我们的愿景是成为并被视为全球最优秀的服装企业，以及所有行业中表现最佳的公司之一。这是一个雄心勃勃的目标，但不久之前这家公司还占据着这一地位，我相信我们能够重新夺回它。¹²\n\
  \n大型客户往往展现出主宰企业并重塑整个行业的惊人能力。不幸的是，这种主宰与重塑已让众多美国生产商处于从属地位，与规模庞大的大型客户相比显得弱势。如同李维斯的故事一样，固特异的事例也揭示了昔日主导品牌光环日渐褪色，在众多经济领域中被大型客户投下的阴影所吞没。\n\
  \n#### 固特异：橡胶业折戟停车场\n\n或许没有哪家企业能像固特异轮胎橡胶公司那样，更能象征美国工业的强大。凭借遍布各地的经销商、醒目的飞艇以及广受尊重的产品和品牌，固特异在\
  \ 20 世纪大部分时间里主导着轮胎市场。很难想象，这家美国制造业的标志性企业近年来竟因对大型客户的忽视而陷入困境——这种忽视包括放弃了花费数十年精心培育、维护和扩展的、美国商业史上最成功的经销商网络之一。\n\
  \n固特异轮胎橡胶公司，这家*美国轮胎行业的先驱*和近 100 年的行业领导者，在 20 世纪 90 年代中期主动投入了大型客户的怀抱。多年来，该公司谨慎地管理着一个庞大而高效的销售网络，由超过\
  \ 5000 家授权经销商组成。随后，在 20 世纪 90 年代中期，作为重组努力的一部分，公司抛弃了经销商，开始通过西尔斯、沃尔玛和蒙哥马利沃德进行销售。\n\
  \n可以预见的是，经销商们并未坐以待毙，而是将自己的命运与其他品牌（如米其林和倍耐力）联系在一起。结果，固特异开始失去一个遍布全球、忠诚专一的经销商网络，最终销售的产品被消费者视为不过是折扣店中再普通不过的轮胎。\n\
  \n新罕布什尔州前固特异经销商鲍勃·戴维斯表示：“你上个月从它们那儿买一条轮胎；下个月价格就可能便宜或贵上 20%……跟固特异做生意实在太难了。”²²\n\n\
  固特异轮胎橡胶公司成立于 1898 年，当时弗兰克·A·塞柏林借了 3500 美元收购了俄亥俄州阿克伦市一家前草纸板厂。公司以橡胶硫化工艺发明者查尔斯·固特异的名字命名，发展至拥有\
  \ 3 万名员工，在 1920 年 4 月大萧条前产量达到 83.7 万条轮胎的高峰。到 1930 年，尽管面临大萧条时期的挑战，公司销售额仍达 2.5 亿美元，业务遍及\
  \ 145 个国家。²³ 固特异后来使用大众分销商的做法，早在早年与西尔斯·罗巴克公司达成分销协议时就已显现端倪。协议很简单：固特异向西尔斯收取轮胎生产成本加上\
  \ 6%的利润率。\n\n在一场后来著名的反垄断诉讼中，这家轮胎制造商于 1936 年被指控违反了《克莱顿法案》——一部 1914 年颁布的反垄断法。与关注试图垄断商业行为的《谢尔曼反垄断法》不同，《克莱顿法案》侧重于那些被认为干扰公平竞争的做法。该法案第\
  \ 2 条指出：“任何从事州际商业活动的人，在不同购买者之间实行价格歧视……若此种歧视的效果可能……”\n\n---\n\n¹ 李维斯公司，“2013 年年度报告：开拓进步之路”，第\
  \ 3 页。\n\n²² ***《客户陷阱》*** 第 21 页\n\n²³ *同上*\n\n\n\n“实质上削弱竞争或在州际商业的某一领域形成垄断。”24\n\
  \n22 Kevin Kelleher, “给经销商一个糟糕的交易,” `CNNMoney.com`, 2004 年 12 月 1 日。\n\n23 固特异,\
  \ “按年份划分的公司历史,” [www.goodyear.com/corporate/history/](http://www.goodyear.com/corporate/history/history_byyear.html)\
  \ [history_byyear.html,](http://www.goodyear.com/corporate/history/history_byyear.html)\
  \ 2015 年 3 月 4 日。\n\n24 Breck P. McAllister, “《克莱顿法案》下的销售政策与价格歧视。” *《耶鲁法律期刊》* 第\
  \ 41 卷, 第 4 期, 1932 年, 第 519 页。\n\n## 第 2 章 | 客户陷阱与品牌毁灭\n\n1936 年，联邦贸易委员会发布命令，强制这家轮胎公司终止与西尔斯的合作。尽管固特异提起了上诉，但仍决定终止与该零售商的关系。当时通过这些法律法规，反映了政府试图通过国家主义政策来应对大萧条带来的破坏，但充其量只带来了模棱两可的经济后果。25\
  \ 然而，政府的干预对固特异确实产生了一个明确的结果：该公司对大众市场分销商的使用直到 20 世纪 80 年代才得以恢复，那时它才再次开始通过西尔斯销售其轮胎。具有讽刺意味的是，这家轮胎公司提起的上诉在\
  \ 1939 年获得了有利的判决。\n\n与西尔斯交易的失败意味着固特异必须发展自己的营销渠道。结果，这家轮胎制造商在数十年间一直掌控着自身的销售和分销。在 20\
  \ 世纪 80 年代的鼎盛时期，该公司运营着超过 1000 家直营店，贡献了 27%的销售额；600 家特许经销商，创造了 23%的销售额；以及 4400 家独立经销商，贡献了\
  \ 50%的销售额。特许经销商只不过是新的固特异经销商，在完成公司为期三年的商业、财务和运营培训后，便可晋升为独立经销商。\n\n固特异通过建立美国最高效的经销商网络，打造了其价值数百万美元的企业。在其历史上的大部分时间里，经销商只销售固特异轮胎。协议大致是这样的：“你只销售固特异轮胎，我们会关照你。只要你的业绩令人满意，我们就会为你提供专属销售区域。如果你是内布拉斯加州北普拉特的固特异经销商，我们就只通过你销售轮胎。如果你的业绩不佳，我们在开设公司直营店或另一家经销商之前，会先与你商讨如何改进。”1989\
  \ 年，70%的经销商只销售固特异轮胎。\n\n然而，到 1991 年，这一比例已降至 50%。经销商销售的其他品牌通常是价格较低的替代品。尽管如此，固特异轮胎网络对公司的忠诚度极高，以至于当英国金融家詹姆斯·戈德史密斯在\
  \ 1986 年试图恶意收购时，经销商们是他最强烈的反对者。由于经销商和固特异总部所在地阿克伦市民的共同努力，该公司成功击退了这次收购企图。几艘固特异飞艇像搜寻入侵者的轰炸机一样，轰鸣着飞过该市上空。与戈德史密斯博弈后产生的巨额债务，被用作固特异在\
  \ 1992 年决定重新开始向西尔斯销售轮胎的理由。随后，该公司又与沃尔玛和山姆会员商店达成了协议。26\n\n1991 年 6 月，曾任乐柏美首席执行官、同时也是固特异董事会成员的斯坦·高尔特接管了这家受创的轮胎巨头。高尔特经历了辉煌的职业生涯。被誉为华尔街奇迹人物的他，因其职业生涯在投资界广受欢迎。在乐柏美任职的\
  \ 11 年间，该公司的规模和利润都翻了两番。\n\n25 Jonathan J. Bean, *《超越经纪人国家：联邦对小企业的政策，1936-1961》*,\
  \ (教堂山，北卡罗来纳州：北卡罗来纳大学出版社, 1996 年)。\n\n***客户陷阱*** 23\n\n\n\n销售额增长了六倍。“在成本控制方面，他可是个非常难缠的角色，”一位前同事回忆道。\n\
  \n西尔斯自 1989 年以来一直试图让固特异为其供应轮胎。出于对经销商网络的顾虑，这一行动一直被搁置，直到高尔特上台。凭借其营销背景以及此前向大型客户销售的经验，高尔特几乎在一夜之间让固特异为西尔斯提供了约\
  \ 20%的轮胎库存。为了强调这种新采取的大众市场策略，他在飞往芝加哥与西尔斯高管共同出席宣布该协议的新闻发布会的途中，亲自向一位飞行员推销了一套轮胎。接下来的交易是与沃尔玛达成的，沃尔玛从\
  \ 1994 年开始销售名为 Viva 的轮胎系列。折扣零售商蒙哥马利沃德紧随其后，销售两个专属轮胎系列。高尔特当时表示，与蒙哥马利沃德的合作是为了将分销渠道拓展到新客户群体。\n\
  \n公司实施了一系列成本削减措施和战略举措，但决定在大众市场上开始销售轮胎是影响最为深远的。放弃经销商并非分析、高管讨论或董事会辩论的结果。相反，这个决定只是在决定向西尔斯供货之后立即做出的。固特异的市场份额增长到了\
  \ 16%，这反映了西尔斯库存的增加。起初，经销商对固特异拥抱大众市场的做法感到绝望。一位经销商说：“我们与他们同甘共苦，现在他们却要淹死我们。”\n\n---\n\
  \n26 凯莱赫，《亏待经销商》。\n27 扎卡里·席勒，《固特异的奇迹先生？》，《商业周刊》，1991 年 6 月 17 日，[www.bloomberg.com/bw/stories/1991-06-16/goodyears-miracle-man](http://www.bloomberg.com/bw/stories/1991-06-16/goodyears-miracle-man)。访问日期：2015\
