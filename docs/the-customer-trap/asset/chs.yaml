  良好的谈判地位。对于生产颠覆性创新以外的公司而言，采取细致入微的渠道进入策略是明智之举。


  正如大卫·布莱斯和杰弗里·戴尔在《哈佛商业评论》中所言：


  > 聪明的后来者拒绝在在位者的规则和地盘上挑战他们。他们不会复制现有的商业模式；不会争夺拥挤的分销渠道；也不会一开始就瞄准主流客户。38


  渠道不仅不能过于拥挤，所选的分销商也不应有机会主义或胁迫行为的历史。那些因错误构思渠道配置方式，或因分销商行为而导致采用错误分销模式的公司，应逐步调整其渠道体系，以取得更可接受的结果。39


