  ***顾客陷阱*** 63


  重大变革发生在 1987 年，其标志是宝洁公司与沃尔玛之间基于新关系的合作模式。一位前沃尔玛高管解释了当时的情况：


  > 我们双方都认为，供应商与零售商之间的整个关系存在问题。双方都关注最终用户——顾客——但彼此独立行事。没有信息共享，没有共同规划，也没有系统协调。我们不过是两个各行其是的庞大实体，完全无视过时体系所滋生的额外成本。实际上，我们之间的沟通就像从门缝里塞纸条……。


  继宝洁/沃尔玛合作之后，许多其他公司也开始将供应商视为重要的合作伙伴.12


  制造流程和技术的改进，使得面向这些新兴巨型企业的供应商能够根据最终用户的要求定制产品。随着“营销理念”的普及，以及生产商通过准时制制造和其他方法具备了小批量定制产品的能力，对大量库存的需求随之减少。


  #### 当前美国体系


  在过去的时代，国际商业的面貌与今天大不相同。绝大多数美国企业专注于通过本地生产、销售和分销来满足不断扩张的国内市场的需求与期望。从国外采购原材料始终是一个选项，也是美国公司在合理情况下会采取的做法。尽管如此，美国公司的大部分产品仍售予美国人，几乎所有服务都源自美国。


