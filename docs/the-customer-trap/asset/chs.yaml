  \ Daily*, December 9, 2003, p. 17.\n\n10 同上。\n\n## 第 2 章 | 客户陷阱与品牌毁灭\n\n李维斯公司彻底重组了其供应链，以满足沃尔玛的需求。该公司被迫采用了先进的预测和产品追踪技术。通过放置在管理人员办公桌上的“仪表盘”，经理可以追踪特定产品从工厂到配送中心，再到具体门店的全过程。一位李维斯的高管表示：“我刚到这里时，什么也看不到……现在，我可以一直深入到产品层面。”\
  \ 11 李维斯还扩大了分销范围，增设了三个“集散点”，以方便产品配送到沃尔玛的配送中心和超级中心。此外，公司还部署了便于进行电子数据交换的技术以及其他协作沟通软件。公司还组建了一个跨职能团队，以确保这些物流工作顺利进行。\n\
  \n李维斯入驻沃尔玛，极大地推动了这家零售巨头引进知名品牌的努力。“他们确实喜欢这个名字，”咨询师`Walter Loeb`说，“他们喜欢宣称自己销售李维斯品牌，因为这能为其业务增添可信度。”\
  \ 13 尽管如此，李维斯的`Signature`品牌起步依然缓慢。沃尔玛抱怨其库存周转比预期要慢。三个月后，这家不满的零售巨头将男式牛仔裤的价格从`23 美元`下调至`19\
  \ 美元`。 14\n\n2003 年，`Signature`占李维斯美国销售额的 8%，全球销售额的 6%。2004 年，这一比例分别跃升至 14.5%和 9.7%。沃尔玛管理层对结果感到满意。此时，定位于大众市场高端品牌的李维斯，代表了沃尔玛牛仔布产品线的高端。沃尔玛还销售`Wrangler`（牧马人）牛仔裤，价格在`15`–`18\
  \ 美元`之间，以及自有品牌牛仔裤，售价为`9.99 美元`。李维斯的品牌声望有助于吸引顾客关注这三家不同公司生产的堆积如山的牛仔布产品。 15 到 2006\
  \ 年，李维斯公司的亮点变成了`Dockers`，而非`Signature`。考虑到此前该公司曾试图放弃`Dockers`这条产品线，这颇具讽刺意味。 16\n\
