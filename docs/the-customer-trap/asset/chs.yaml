  广泛的品牌认知度和深入的市场渗透。这是因为大规模分销的规模使得生产商能够将自己的创新引入消费者的意识中。制造商随后可能引导消费者走向企业首选的销售渠道。同时，生产商可以管理其大众市场产品，从而保持控制权。


  在美国，或许没有哪家公司比苹果更能代表创新。这家公司堪称基于核心能力进行创新的典范。它曾被视作一家电脑企业，但苹果利用自身能力，通过一系列令人惊叹的产品，开创了此前无法想象的市场。即便如此，该公司也曾多年在
  IBM 和微软的阴影下苦苦挣扎。尽管苹果作为细分市场的参与者取得了成功，但它一直无法在大众市场上充分发挥自己的创新能力。


  该公司首款真正在大众市场获得成功的产品是 2001 年推出的 iPod。这款产品彻底革新了音乐产业，曾在塔吉特、[Amazon.com](http://amazon.com/)、百思买以及众多其他零售店销售。一项研究估计，第五代
  iPod 299 美元的零售价中，零售利润总计为 75 美元，仅比苹果约 80 美元的预估毛利润少 5 美元。当然，苹果还在其在线商店和直营苹果零售店中赚取了零售/分销商差价。iPod
  无处不在，它在 2007 年贡献了公司 35%的收入，但到 2012 年仅占 5%。这主要归功于大众市场营销的努力，使其得以摆上大型零售商的货架。iPod 的巨大成功重振了苹果品牌，并为下一步——iPhone——奠定了基础。


  与 iPod 不同，iPhone 的分销受到严格控制。在 2007 年 1 月与 Cingular Wireless 签订独家服务与分销协议时，苹果坚持对定价和分销决策的控制权。这与其允许
  iPod 分销的方式大相径庭。此外，当该产品于 2007 年 6 月出货时，它仅通过苹果官网、公司自有零售店以及 Cingular 的 2100 家品牌店和官网独家销售。通过控制
  iPhone 的分销，苹果得以获取此前与大众市场零售商共享的利润。然而，这是在通过大型分销商销售 iPod 以打造“i”品牌之后才实现的。32 直到 2008
  年 12 月，也就是 iPhone 推出近两年后，苹果才开始通过沃尔玛销售 iPhone。苹果能够在不同渠道之间灵活转换，从而通过其创新产品实现价值最大化。


  G. Linden, K.L. Kraemer, 与 J. Dedrick，“谁在全球创新体系中获取价值？以苹果 iPod 为例”，个人计算产业中心，加州大学欧文分校保罗·梅拉吉商学院，2007
  年。


  #### 消费者陷阱


  此外，截至 2015 年，该公司在全球经营着约 437 家自有零售店。根据摩根士丹利的一项研究，这些店铺是该公司增长的主要动力之一。33 这赋予了苹果直接接触消费者的能力，当主要外部渠道（例如百思买、AT&T
  和威瑞森）试图控制客户关系时，这种能力可作为制衡的筹码。34


  许多其他大型公司也开设了自己的店铺，以此作为获取更大控制权的手段，特别是在推出新产品时，或者作为重新定位其产品或推广新信息的途径。乐高 18 家“概念店”内摆满了
  240 个乐高储物箱，为顾客提供了充足的空间与产品互动。同样，博士公司也利用其




  拥有家庭影院演示室的零售店，用于展示其音频组件。耐克利用其门店推动大众市场鞋类和服装的销售，而服装制造商彪马和乐卡克已在全美战略要地开设了大量门店。


