  \ Religion` 等品牌以高达李维斯牛仔裤六倍的价格销售其产品，并通过奢侈品精品店和百货公司分销。李维·斯特劳斯未能跟上潮流，对消费者品味的变化反应迟钝，因而遭受了损失。尽管丹宁布业务已开始在奢侈端和折扣端两极分化，但它仍固守其中档制造商的地位。事实上，李维斯直到很晚才推出自己的高端产品\n\
