  ### 第 7 章 | 创新的第二步


  当大型分销商和客户能够轻易用其他公司的产品替代供应商的产品时，他们就占据了主导地位。那些被视为同质化商品的产品很可能被当作商品对待。当“供应商可以被轻易替换时，中间商就不太可能主动与他们建立牢固的关系。”35
  在这种情况下，生产企业将陷入几乎完全依赖价格竞争的困境。


  对于正在扩大规模的企业来说，挑战在于既要维持对销售和分销的控制，又不能放弃那些可能带来长期卓越盈利能力的扩张机会。战略性创新必然要求企业有能力牺牲销量、市场份额和短期利润，以保持对创新产品的控制。虽然这并不一定意味着




  公司是否应通过自有零售店销售其创新成果，并不意味着企业必须决心在规模化进程的每个阶段都掌控分销渠道。


  企业在规模化过程中控制销售与分销，并非在所有情况下都遵循一成不变的僵化流程。没有任何公式可以规定公司何时从某个阶段进入下一个阶段、何时准备好调整渠道配置。渠道管理由管理者根据实际情况和经验做出的商业决策组成。


  此外，成功的企业会在自身价值观、使命和文化的背景下进行战略运营。一家公司可能强烈倾向于通过大众市场零售进行分销（例如戴森），而另一家公司则可能利用其在大众市场的规模与存在感，积极实施直接营销或/及开设自有门店（例如乐高）。其他公司则可能完全回避大众市场零售，更倾向于在没有任何中间商介入的情况下与客户打交道。


  例如，Oreck 公司的创始人戴维·奥瑞克就强烈抵制通过大型分销商销售其产品的理念。从一开始，他的目标就是制造以高价出售的高质量产品。多年来，他始终坚持，如果
  Oreck 公司通过大众市场销售其 `XL 吸尘器`，这款产品将会与外观类似的机器一同摆放在长长的货架上。当消费者将 `XL` 与价格更低的竞品功能进行比较时，他们对
  `XL` 的“顶部填充”设计、耐用轮子、轻量以及“微扫”功能的理解将受到损害。相反，该产品通过在线渠道和全美 300 多家 `Oreck` 门店进行营销。据奥瑞克所言：“任何不掌控分销的制造商，最终都会被分销渠道所掌控。”\[³⁶]


  \[³⁵]: `K. Kim` 与 `G. Grazier`，“分销渠道系统类型学：一种情境方法”，*国际营销评论* 第 3 卷，第 1 期，1996 年，第
  19–32 页。

  \[³⁶]: 引自作者对戴维·奥瑞克的采访，2005 年 6 月 17 日。


  ***顾客陷阱*** 115


  通过避开大型分销商，戴维·奥瑞克实现了业务的规模化，并选择*不*通过大众市场进行分销。因此，他保护了自己的创新，为自己和员工保留了利润空间。奥瑞克通过直销方式——最初面向酒店，随后面向公众——将一项创新引入成熟市场。这样一来，公司得以避免将其产品定位为行业主流产品的直接竞争对手。这一切都源于公司创始人的理念和远见。令人沮丧的是，正如你在第
  1 章中所了解到的，在奥瑞克出售公司并由私募股权技术官僚接管后，其销售和分销方式发生了根本性改变。剩下的便是一段惨痛的历史。


  表 7-1 总结了管理者在企业从小规模发展到大规模时应考虑的关键因素。建议小公司警惕过早涉足大众市场，同时建议中型和大型公司谨慎对待大型零售商。虽然我们认为此处提出的阶段方法可用于指导公司成长过程中的分销策略，但我们承认，这些连续阶段可能会出现偏差。例如，可以想象，一家拥有突破性创新的公司可能会让自己依赖于大众市场战略。诸如
  `iPod` 或 `Dyson 吸尘器`等颠覆性创新，使生产商能够与大型分销商平起平坐，因为这些产品具有高度差异化，并且由于专利保护、学习曲线效应和专有技术而难以模仿。\[³⁷]
