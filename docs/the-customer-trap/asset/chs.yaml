  \n李维斯（Levi Strauss）希望这款简化版的产品，加上没有`Red Tab`（红标），能充分将`Signature`与李维斯的核心产品区分开来。李维斯总裁兼首席执行官`Phil\
  \ Marineau`承认公司传统零售客户的担忧，他表示，这些客户“担心李维斯核心产品会被蚕食，尤其来自`Signature`系列”，因此，公司“非常保守地管理着李维斯和`Dockers`的订单与库存”。\
