  38 大卫·J·布莱斯和杰弗里·H·戴尔，“攻破防守严密市场的策略”，[`hbr.org/2007/05/strategies-to-crack-well-guarded-markets`](https://hbr.org/2007/05/strategies-to-crack-well-guarded-markets)，2007
  年 5 月。


  39 肯尼思·H·瓦特内和简·B·海德，“企业间关系中的机会主义：形式、结果与解决方案”，《营销杂志》，2000 年 10 月，第 36–51 页。


  大众市场分销体系创造了大型零售商轻易主宰小型创新公司的条件。但容易做到并不意味着就应该去做。许多有前景的新产品现在几乎被大众营销商随意识别和控制。我们建议，如果企业能将其流程和产品创新与服务于生产商利益的销售和分销战略相结合，就可以避免与分销商产生负面结果。为创新而创新对增进公司利益作用甚微。管理者常常假定自己的公司会自动从技术或创意突破中受益。然而，企业为谁创新往往比创新本身更重要。如果创新的价值被他人攫取，那么新产品或新流程就代表了徒劳的努力。最终，一项创新对生产者的价值，很大程度上取决于该产品如何被销售和分销。40


  为了从创新中获利，公司必须控制分销渠道。渠道管理不应成为创新公司的事后考量。随着公司规模扩大，管理者应重新评估其销售和分销策略，以瞄准利润最大化的渠道，同时不损害公司的创新成果。


  40 安德鲁·R·托马斯和蒂莫西·J·威尔金森，“外包的强迫性：分销商对制造业的殖民化如何将美国公司推向海外”，《麻省理工学院斯隆管理评论》，2006 年，第
  10–14 页。


