- '# 排版后的文本


  在哥斯达黎加的案例中，最佳选择显然是农产品分销商。该分销商销售的产品强化了摩托车作为工人和农民基本交通工具的形象，并可能开辟一个全新的市场。


  在特立尼达和多巴哥，户外烧烤是一种生活方式。由于每年约有 25 个全国性假期，且普通工人享有数周假期，居民们充分利用充裕的闲暇时间举办大型聚会，户外烧烤是这些聚会的核心。一家美国创新型燃气和丙烷烤架生产商嗅到了商机，决定开拓特立尼达和多巴哥市场。


  表面上看，最佳潜在分销商似乎是`Choice Mart`，这家总部位于圣地亚哥的大型零售商在中美洲和加勒比地区与沃尔玛竞争。`Choice Mart`是特立尼达和多巴哥最大的烤架进口商和分销商，同时也是其他七个烤架品牌的独家分销商。这家美国公司决定，不希望自己的创新产品被扔到直接竞争对手旁边的货架上。相反，它在市场中寻找互补者。在特立尼达和多巴哥，大多数天然气和丙烷在加油站销售。三家公司控制了服务中心市场，这家美国公司认定这些互补者将是理想的分销商。仅过了短短几个月，这家美国公司的创新产品就在市场中排名第二。


  `Loctite`是一家总部位于康涅狄格州的胶粘剂专业公司。起初，它与熟悉当地市场的分销商合作，因为这些分销商销售竞争对手的产品。在经历了市场被分销商控制的负面后果后，`Loctite`开始寻找互补者——他们称之为“公司契合”而非“市场契合”的公司。据一位高管称：“市场契合的紧密性既可能是资产也可能是负债，因为分销商代表了市场的现状，而我们销售的是替代技术，正试图改变市场。6
  相比之下，公司契合的合作伙伴虽然无法产生快速的短期销售，但他们是那些在关系上投入时间并愿意接受产品培训的分销商。”


  6 David Arnold, “Seven Rules of International Distribution,” *Harvard Business Review*,
