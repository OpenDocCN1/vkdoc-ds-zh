  *信息技术最大的好处是它能赋予人们做想做的事的能力。它让人们富有创造力。它让人们富有生产力。它让人们学到以前认为自己无法学到的东西，因此在某种意义上，它关乎潜能。*


  ——史蒂夫·鲍尔默


  莎拉·卡尔霍恩，红蚂蚁工装裤公司的三十多岁创始人，曾是“户外拓展”教练和荒野爱好者。她对市场上那些不合身、并未考虑女性体型的工装裤感到非常沮丧，因此创办了自己的公司。该公司现在销售
  70 个尺码的双膝、双裆工装裤，采用前腰低、后腰高的设计。通过从印度进口 12 盎司棉帆布，并由西雅图的一家工厂进行裁剪和缝纫，卡尔霍恩得以自由销售定价为 129
  美元的平价工装裤。




  对她的目标市场——从事农业、建筑行业或其他户外工作的女性。


  一辆装饰着红蚂蚁的 1964 年款 Airstream 拖车曾是该公司最初的营销工具，不过现在大部分销售都在线上完成。通过诸如“加州女性建筑大会”和“国际树木学会”等展会及会议积累的人脉，进一步拓展了她的直销模式。公司位于蒙大拿州的一个牧场小镇白硫磺泉镇，其大型推广活动是一年一度的音乐节，人们在那里的奶牛牧场边听莱尔·洛维特、梅尔·哈格德和埃米卢·哈里斯等顶尖艺人的表演，边“跳掉裤子”。有一次音乐会结束后，县治安官给莎拉发短信祝贺道：“干得好，莎拉。我永远不会因为任何事逮捕你。”让红蚂蚁裤子公司成为一个成功的企业并非易事，但显然其中充满了乐趣。“在小地方做成大事，这感觉真棒，”她说。


  哦，对了，该公司还会使用 Facebook、Twitter，并在 YouTube 上投放自制的广告。莎拉对通过大型零售商销售毫无兴趣，并且已经拒绝了多个让她品牌走向“全国”的提议。“我们有很多人专程前来只为买裤子，”她说，并补充道，“对我来说，真正了不起的是，这些裤子对我们的顾客意义重大。”¹
  为什么莎拉能如此坚定地避免与大型零售商合作？她的回答体现了蒙大拿州自给自足、睦邻友好的道德观：“保持独立并维护人际关系，是我们公司价值观的重中之重。”²


  另一家避开了客户陷阱的企业是 Alside，它是铝制壁板行业的先驱。当你想象铝制壁板这类产品时，你可能会认为它是一种购买决策完全基于价格的商品。但当你倾听唐纳德·考夫曼讲述他成功担任首席执行官长达四分之一世纪的公司时，你能清晰地看到陷入客户陷阱的领导者与有意避开这一陷阱的领导者之间的区别。


  唐纳德的哥哥杰罗姆·考夫曼于 1947 年创立了 Alside，其基础是他同年发明的烤瓷铝制壁板——这堪称一项真正的创新。1960 年，公司上市，并于次年登陆纽约证券交易所。从一开始，这家创新型的制造商就努力控制其产品的销售和分销。其业务基石是公司与客户之间建立的紧密关系。三十年来，Alside
  建立并维护了一个遍布全国的独家经销商网络，这些经销商直接与当地承包商合作，为全美数百万家庭安装铝制壁板。


  当唐纳德于 1974 年接手掌管时，整合浪潮开始涌入铝制壁板行业，威胁到前三十年发展起来的独立经销商网络。商品化竞争已然开始。考夫曼面临着蚕食 Alside 分销网络的巨大诱惑。


