  \ 7-1.** 权力结构\n\n#### 规模\n\n权力结构中最明显、或许也是最决定性的变量，是生产商与经销商的相对规模。历史上，大公司（除了少数显著例外）一直能够向零售商发号施令。随着巨头们的崛起，很少有生产商能与之平起平坐。正如已经指出的，大型零售商不仅能够通过系统性地、强制性地重新谈判定价来削减生产公司的利润空间，还能将传统零售活动的成本转嫁给制造商。\n\
  \n管理供应商最有效的方法之一是通过所谓的“品类领航员”。大型零售商已经认识到，他们可以通过选择一家主要供应商来管理某一类别的产品——包括其竞争对手的产品——从而使该类别为巨头带来最大化的利润。品类领航员通常负责管理商店中某个走道或区域的商品陈列，并向零售商提供品类销售和趋势信息、规划与陈列建议，以及货架空间分配建议。领航员的意见仅仅是建议，但那些不可能具备与品类领航员同等专业水平的零售商会认真对待这些建议。由于品类领航员除了管理自己生产的产品外，还要管理其他产品，他们必须与竞争对手密切合作。正如巴里·C·林恩在《哈珀斯》杂志的一篇文章中所说：\n\
  \n> 一个明显的后果是，像高露洁-棕榄这样的生产商会最终与它以前竞争的公司（如佳洁士的制造商宝洁）紧密合作，以寻找能够使沃尔玛从其货架空间中获得最大收益的产品组合。如果沃尔玛发现某个供应商为了自身产品利益而损害沃尔玛的收入，这家零售商可能会换一名新的领航员取而代之。10\n\
