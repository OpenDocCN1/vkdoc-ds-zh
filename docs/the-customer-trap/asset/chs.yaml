  \n## 第 9 章 | 走向全球并坚守信念\n\n负责这家美国公司销售和分销的美国人能够在哥斯达黎加找到两个可能的分销商。由于在其它市场早先的成功，他充满自豪，相信自己对于识别哥斯达黎加最佳分销商的能力无懈可击。\n\
  \n第一个候选人是一位年轻的企业家，其主要业务在农业领域——特别是进口农具和肥料。他在哥斯达黎加建立了一个销售代理网络。他认为，为农民设计并经常被农民使用的中国摩托车将能补充现有的产品线。\n\
  \n然而，第二个候选人在表面上似乎是更明智的选择。另一家公司由哥斯达黎加最富有的人之一所有，并且是本田汽车、斯堪尼亚卡车和小松重型设备的独家代理商。这个家族企业中的父亲曾代理过本田摩托车，而儿子再次对低成本摩托车产生了兴趣。对于这位美国人来说，这个选择似乎是代销其公司产品的最佳选择。\n\
  \n市场研究向这家美国公司揭示，前三年的年销量预计为 250 辆摩托车是一个合理的预期。这一估算基于哥斯达黎加全国每年的摩托车进口量约为 2,700 辆，并预计每年增长\
