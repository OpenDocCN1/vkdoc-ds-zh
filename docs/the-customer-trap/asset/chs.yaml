  \ 的员工包括两位创始人、两名全职员工和少数兼职人员。根本没有足够的人手来应对涌入的所有业务。\n\n2009 年，`PenAgain` 的国际权益和专利被 `Propel-r\
  \ Innovations` 收购。公司创始人兼董事 `Aryeh Elbaz` 对大型零售商的市场力量有如下看法：\n\n> 我认为一些创业者看待大型卖场，就像演员看待好莱坞大制片厂一样……是他们艺术的最大舞台，也是通往“成功”的门票。这些大型卖场拥有如此巨大的影响力，以至于创业者围绕它们的要求而非最终用户来构建自己的商业模式。这是一种危险的游戏，它会迅速升级，并在任何人意识到之前就越过无法回头的临界点。这只是我的个人看法。12\n\
  \n> 12 与公司发言人 `Aryeh Elbaz` 的采访和通信，2015 年 2 月 24 日。\n\n***客户陷阱*** 97\n\n但不仅小创新者被大型卖场的市场覆盖所吸引；大公司也被大型零售商展现的市场力量所吸引。`Levi\
  \ Strauss & Co.`、`Goodyear`、`Proctor & Gamble` 以及本书中讨论的其他公司，都为了能够通过大众折扣店销售而改变了各自价值链的主要组成部分。大规模分销商的覆盖范围是惊人的，它们利用这种覆盖范围获利的能力也令人叹为观止。\n\
  \n#### 法律背景\n\n法律和监管环境限制了生产者与大型卖场之间建立的关系。权力多年来一直集中在生产者手中，但法律环境最终发生了转变，如今有利于分销商。直到最近，才出现了向制造商的小幅回归。\n\
  \n汽车行业是监管权力最明显（也是最具破坏性）的体现之一。1956 年的《汽车经销商法庭日法案》及随后的特许经营法使得汽车制造商几乎无法管理自己汽车的销售方式。该法案内容如下：\n\
  \n> 汽车经销商可以对任何从事商业活动的汽车制造商提起诉讼，在制造商所在地、被发现地或设有代理人的美国任何地区法院提起诉讼，无需考虑争议金额，并可追偿因该汽车制造商自\
  \ 1956 年 8 月 8 日以后未能善意履行或遵守特许经营条款、或终止、取消或不续签与该经销商的特许经营权而给他造成的损失及诉讼费用。前提是，在此类诉讼中，制造商不得被禁止以经销商未能善意行事为由进行抗辩。13\n\
  \n2006 年《纽约客》的一篇文章描述了该法案的影响：\n\n> 汽车经销商，凭借其低制作成本的电视广告和握手战术，似乎是典型的小商人，很难相信他们能够影响像通用汽车和福特这样的全球公司的决策。但集体来看，他们拥有巨大的影响力。经销商并非汽车公司的员工——他们\n\
  \n> 13 美国律师协会，《特许经营与经销商终止手册》，(2004 年)，第 275 页。\n\n> ***第 7 章 | 创新的第二步***\n\n> 拥有当地的经销权，这些经销权在每个州都受到所谓的“特许经营法”的保护。这些法律限制了通用汽车在距离旧经销店几英里外开设新凯迪拉克经销店的自由。更重要的是，它们使得汽车制造商几乎不可能简单地关闭一家经销店。如果通用汽车决定放弃庞蒂克和别克，它不能直接去找那些经销商说，\n\
  \n```\n\n\n“和你做生意真愉快。”这句话要想让经销商们同意关门歇业，实际上就意味着要出钱把他们买断。几年前，当通用汽车真的砍掉旗下的奥兹莫比尔品牌时，它不得不拿出大约十亿美元来买断经销商——最终仍不得不在法庭上为其面临的无数诉讼辩护。结果，砍掉一个品牌可能得不偿失，因为这笔预期节省下来的钱，大头最终落到了经销商口袋里。14\n\
  \n美国汽车制造商两端受压：一端是由工会推动的、难以为继的高额人力开支加上庞大的遗留成本；另一端则是经销商对汽车分销渠道的扼制。经销商的辩护者们认为，经销商泛滥与通用汽车无关，因为他们都是独立经营，自己买车并承担运营费用。《华尔街日报》刊登的一封信中写道：“就算一家经销商一年只卖\
  \ 100 辆车，那又怎样？每一次销售，制造商都能获得金钱回报。”15\n\n2009 年 6 月 2 日，在通用汽车申请破产的第二天，《丹佛邮报》发表了一篇文章，解释了经销商是如何拖垮这家公司的：\n\
  \n多年来，批评这家公司的人一直呼吁砍掉奥兹莫比尔部门和 GMC 卡车部门——后者销售的是雪佛兰卡车的克隆版。但通用汽车发现自己被一群吵闹的经销商束缚了手脚，而这些经销商受到州特许经营法的保护。到了\
  \ 2004 年该部门最终关闭时，通用汽车花了超过 10 亿美元才买断奥兹莫比尔的经销商。16\n\n即便在通用汽车陷入破产并宣布关闭数百家经销商时，国家和州的政客们仍在高呼不公，要求政府介入拯救这些经销商。即使鹅已经死了，政客们还要求它继续下金蛋。如今，当特斯拉汽车试图通过公司自营门店销售时，同样的吵闹声在各州立法机构中清晰可闻。特斯拉的传播事务副总裁里卡多·雷耶斯对此评价道：\n\
  \n令我感到奇怪的是，在这个州，消费者唯一不能直接购买的东西就是酒和汽车。想象一下，如果女童子军卖饼干必须通过分销商网络，想象一下如果苹果公司卖产品也必须通过分销商网络。17\n\
  \n人们常常抱怨，美国司法部不像对待微软这样的制造商或谷歌这样的服务公司那样，追究大型零售商的垄断行为。然而，反垄断法旨在防止企业以垄断方式行事，其最终目的是防止价格飙升。大型零售商凭借其低成本战略和压低价格的偏好，并没有违反反垄断法。它们专注于低价格的商业模式，并不违背消费者的最佳利益。尽管在奥巴马政府执政初期，联邦贸易委员会曾对此表现出一定兴趣，但要求拆分垄断零售商的呼声基本上被忽略了。18\n\
  \n自有品牌产品一直是大型零售商的一大福音。在一个又一个品类中，大零售商将仿制品牌或山寨产品的生产外包出去，然后将它们摆放在货架上，紧邻着\n\n\n  \n\
  **品牌产品。** 自有品牌产品最引人注目的例子是沃尔玛抢走了原属于宝洁公司的`White Cloud`卫生纸产品线。这家消费品制造商决定专注于`Charmin`品牌后，于\
  \ 1994 年放弃了`White Cloud`的商标权。沃尔玛在发现宝洁的疏忽后，从接手该商标的公司手中获得了品牌授权。其他产品收购虽然不那么显眼，但同样成功，并且得到了法院的保护。\n\
  \n另一个问题是*商业外观*，这是指包装或产品中非功能性的特征，包括设计元素。苹果产品的外盒、`Wonder Bread`的包装、或麦当劳的`Happy Meal`餐盒都属于商业外观的实例。美国最高法院裁定，商业外观不一定受美国商标法保护。\n\
  \n17 鲍比·布兰查德，《特斯拉汽车与汽车经销商就特许经营法产生冲突》，`www.texastribune.org/2015/01/28/tesla-motors-automobile-dealers-debate-franchise-l/`，2015\
  \ 年 1 月 28 日。\n\n18 托马斯·弗兰克，《自由市场杀死了资本主义：安·兰德、罗纳德·里根、沃尔玛、亚马逊以及 1%的精英对我们的病态胜利》，`www.salon.com/2014/06/29/free_markets_killed_capitalism_ayn_rand_ronald_reagan_wal_mart_amazon_and_the_1_percents_sick_triumph_over_us_all`，2014\
  \ 年 6 月 29 日。\n\n### 第七章 | 创新的第二步\n\n在沃尔玛胜诉一家起诉其商标侵权的服装公司的裁决中，解释了促成法院判决的背景：\n\n\
  > 原告沃尔玛百货公司是美国最知名的零售商之一，销售包括童装在内的多种商品。1995 年，沃尔玛与其供应商 Judy-Philippine 公司签订合同，制造一系列童装用于\
  \ 1996 年春夏季销售。沃尔玛向 Judy-Philippine 提供了 Samara 产品线中多款服装的照片，Judy-Philippine 据此生产服装；Judy-Philippine\
  \ 几乎原样复制了 Samara 的 16 款服装，仅做了微小改动，其中许多含有受版权保护的要素。1996 年，沃尔玛迅速销售了这些所谓的仿制品，获得了超过 115\
  \ 万美元的总利润。[¹⁹]\n\n沃尔玛的胜诉意味着，生产商现在必须能够证明，买家认为商业外观是其品牌产品的标志。如果一家公司未能记录*商业外观*与其品牌之间的关联，那么该公司视为品牌的许多内容都可能被其零售合作伙伴合法复制并销售。\n\
  \n**生产商的力量**\n\n图 7-1 还展示了生产商在与分销商打交道时所拥有的力量。尽管制造商的力量来源与巨型客户类似，但生产商能够施展与巨型客户相当的反制力量的情况正变得越来越少见。\n\
  \n**产品**\n\n公司在与巨型客户打交道时最大的力量来源是其产品。销售真正差异化创新产品的公司，可以在产品生命周期早期通过利用大众市场分销商成功分销。真正的创新需要市场份额，在这个市场中几乎没有真正的竞争对手，并且需要通过专利、品牌力量、市场覆盖或其他限制因素创造足够的领先时间。\
  \  \n\n\n\n```markdown\n这使其能够将竞争对手拒之门外。一旦技术、法律或运营上的弱点削弱了某项创新的市场地位，曾经备受推崇的沃尔玛诉萨马拉兄弟案（99-150）529\
  \ U.S. 205 (2000) 165 F.3d 120，美国最高法院\n\n***《顾客陷阱》*** 101 号产品很容易沦为货架上的普通品牌，旁边就摆着售价仅为一半的自有品牌产品。事实上，通过大型零售商的营销几乎注定会削弱产品在市场上的影响力。\n\
  \n大众市场分销必然会在制造商与顾客之间造成隔阂。虽然对于已经商品化的产品而言这无关紧要，但对创新产品来说却影响巨大。对许多公司而言，通过大型零售商销售会使其失去有效提供服务和维修的能力。有缺陷的产品被售出，然后被退回大型零售商，制造商却没有任何机会与顾客互动。需要维护的产品能否得到妥善保养的可能性也大大降低。这给生产商而非分销商带来了负面评价。此外，许多通过大型零售商销售的产品需要购买者自行组装，这常常让顾客感到沮丧，进一步疏远了他们与制造商的关系。\n\
  \n通过大型零售商分销也剥夺了制造商销售合适辅助产品的机会。“附加销售”被留给了可能不了解生产商提供的配套产品的销售人员。例如，一台约翰迪尔坐骑式割草机可以配备五种不同的“货架安装架”（例如电动撒播机、摆动风扇）、八种类型的袋子以及四种扫雪机。即便所有这些选择都可供购买，家得宝或劳氏公司的销售人员也不太可能具备引导顾客挑选这些选项的知识。\n\
  \n虽然大型零售商负责货架分配和所售商品组合，但生产商则掌控着已创造的创新。创新产品从定义上就在市场中创造了潜在空间。它优于或不同于替代品。也许该产品拥有其他地方不具备的功能，或者嵌入了极高品质使其极具吸引力。创新的五个方面影响着生产商相对于大型分销商的实力：\n\
  \n- 创新深度\n- 差异化\n- 替代品的可获得性\n- 流程创新\n- 品牌知名度\n\n***第 7 章 | 创新的第二步***\n\n#### 创新深度\n\
  \n普拉哈拉德与哈默尔在其经典文章《公司的核心竞争力》中，将企业比作一棵大树：\n\n> 树干和主要枝干是核心产品，较小的树枝是业务单元，树叶、花朵和果实是最终产品。提供营养、维持和稳定性的根系则是核心竞争力。如果你只盯着竞争对手的最终产品，就可能忽视其力量，就像只看树叶而忽略树木的力量一样。20\n\
  \n虽然作者谈论的是企业的核心竞争力，但我们认为他们的观点同样适用于创新。那些在根源层面创造、发明了具有多种应用的核心技术的公司，拥有我们所说的“深层创新”。例如，浮岛国际公司（FII）是一家位于蒙大拿州的公司，它创造了一种名为\
  \ BioHaven 的产品。这种浮岛模仿了沼泽地的生态功能，可用于环境净化、水体修复以及改善野生动物栖息地。该公司已为其核心技术确定了超过 25 种应用。21\
  \ 当生产商拥有深层创新时，他们便拥有更大的议价能力，因为作为当地唯一的供应商，他们能够\n```\n\n\n#### 森林之兆：规避“巨型”产品替代战略\n\n\
  当然，这需要假定创新者了解他们所处的市场，但情况并非总是如此（参见本章前文关于 PenAgain 的故事）。\n\n#### 差异化\n\n迈克尔·波特指出：“当一个企业提供了对买家有价值、且不仅仅是低价的独特东西时，它就与竞争对手区别开来。22”根据波特的观点，这种差异化可以发生在价值链的任何环节。对于一个成功实现规模化量产并保持对其产品控制权的生产者而言，产品差异化是最低门槛。\n\
  \n20 C.K. 普拉哈拉德和加里·哈默尔，《公司的核心竞争力》，《哈佛商业评论》第 68 卷，第 3 期，1990 年 10 月。\n\n21 玛丽·麦克纳利和蒂莫西·J·威尔金森，《浮岛国际》，《国际案例研究学院期刊》第\
  \ 17 卷，第 8 期，2011 年，第 57–61 页。\n\n22 迈克尔·波特，《竞争优势》（纽约：自由出版社，1985 年），第 120 页。\n\n\
  ***《客户陷阱》*** 103\n\n#### 替代品的可获得性\n\n创新是难以被轻易复制的差异化产品，无论是由于专利和商标保护，还是因为它们体现了领先技术。\n\
  \n#### 流程创新\n\n创新流程包括创造产品的制造方法。虽然通过流程创新可以实现更高的效率，但这些创新的经济价值可能被生产公司捕获，也可能无法被捕获。\n\
  \n#### 品牌知名度\n\n随着大众零售环境演变为涉及自有品牌产品和商店品牌的基于价格的竞争，品牌的重要性有所减弱。与此同时，如果一项创新要由创新公司“拥有”而非由其竞争对手“拥有”，那么将该创新与消费者心目中的某个品牌联系起来至关重要。因此，对营销、专利和商标的投资至关重要。\n\
  \n再次回想一下 PenAgain 在与“巨型”零售商合作后的遭遇。2008 年的金融危机迫使其所有者重新思考分销策略。到 2009 年，他们基本上退出了大型连锁超市，并与总部位于亚特兰大的\
  \ Baumgartens 公司签订了分销协议，由后者负责该产品的全球分销。通过将这款笔重新定位为关节炎患者以及书写时感到疼痛的人士的书写辅助工具，该公司培养了一个极其忠诚的客户群。现在，该产品通过独立零售商和专卖店以\
  \ 4.99 美元的价格销售。PenAgain 之所以能逃出“客户陷阱”，是因为它是一种“粘性”创新，它的存在是市场所需，“终端用户需要它，而非仅仅觉得它很酷。”23\n\
  \n#### 规模\n\n拥有知名、受欢迎产品的大型制造商，最有潜力与“巨型”零售商正面抗衡。一个哈佛商学院的案例描述了宝洁公司员工汤姆·穆乔如何搬到本顿维尔，以管理该公司与沃尔玛的关系。多年来，双方能够共同努力，克服各种挑战和纠纷。例如，宝洁公司以\
  \ 0.90 美元的成本向沃尔玛出售一单位帮宝适产品，售价为 1.00 美元，而沃尔玛希望以 0.83 美元的价格出售——每单位亏损 17 美分。这一冲突通过向零售商提供第二个更大尺寸、定价更优惠的商品单位，以及其他旨在增加销售额的联合举措得以解决。这些努力使得库存周转率从每年\
  \ 20 次提高到 75 次。\n\n从这个案例中可以清楚地看到，宝洁公司得益于其与沃尔玛的关系。到目前为止，即使该公司大约 15%的销售额来自沃尔玛，宝洁公司也显得规模太大而不易被摆布。宝洁\n\
  \n\n\n声称沃尔玛是其唯一销量占比超过 10%的零售商。显然，双方在合作关系中都易受各种突发状况的影响；然而，沃尔玛并不介意对宝洁施压，这从其近期将德国洗衣皂\
  \ Persil 与 Tide 并排摆放即可见一斑.24。\n\n哈佛商学院的一份案例揭示，与零售巨头合作的关键在于理解其文化，并能以沃尔玛采购员能理解的方式沟通疑虑。该案例末尾的一项重要谈判原则，基本概括了小型企业在与沃尔玛“谈判”时的立场：“不要浪费时间抱怨。相反，要成为问题的解决者。接近沃尔玛时要说：‘让我们携手合作，降低成本，以更低的价格生产，让你无需替换我，因为与我合作，我能做得更好。’”这听起来是不是很棒？25\n\
  \n#### 法律背景\n\n众多为生产者提供的法律保护，可以帮助制造商抵御零售巨头的侵蚀。2006 年美国最高法院的一项裁决重新解释了《谢尔曼反垄断法》，允许供应商禁止零售商以低于制造商授权价格进行广告宣传。这项“最低广告价格”政策（简称\
  \ MAP），旨在保护品牌形象免受折扣行为的损害。通常，MAP 计划与生产商的广告政策挂钩，以便零售商若以低于授权的价格做广告，将失去来自供应商的广告费用报销。\n\
  \n24 James Sebenius 与 Ellen Knebel，“Tom Muccio: Negotiating the P&G Relationship\
  \ with Wal-Mart (A)”，《哈佛商学院出版社》，2008 年 1 月 11 日。  \nMorgan Housel，“5 Things I Learned\
  \ From Reading Procter & Gamble’s Annual Report”，[www.fool.com/investing/general/2013/05/06/5-things-i-learned-from-](http://www.fool.com/investing/general/2013/05/06/5-things-i-learned-from-reading-procter-gambles-an.aspx)\
  \ [reading-procter-gambles-an.aspx](http://www.fool.com/investing/general/2013/05/06/5-things-i-learned-from-reading-procter-gambles-an.aspx)。\
  \  \n25 James Sebenius 与 Ellen Knebel，“Sarah Talley and Frey Farms Produce: Negotiating\
  \ with Wal-Mart (B)”，2006 年 11 月 8 日。\n\n***顾客陷阱*** 105\n\n`MAP`对生产商有两个方面的帮助。首先，它有助于保护小型商店免受零售巨头基于价格的广告攻势。为了绕过大型折扣商，通过独立经销商和专卖店销售，小型商店必须能够生存。`MAP`通过使比价购物更加困难，有助于创造公平的竞争环境。其次，尽管制造商无法合法控制零售商的售价，但禁止低价广告宣传降低了品牌在大型商店折扣攻势下贬值的风险。然而，由于之前讨论的其他原因（例如将优质产品与廉价仿冒品并排陈列），以及消费者逐渐了解`MAP`并相应调整购物行为，品牌商品化仍有可能发生。此外，零售巨头向客户提供未公开折扣的能力依然不受阻碍。这意味着通过零售巨头销售产品的公司，可能会损害其他无法提供折扣的销售渠道.26。\n\
  \n最后，并非所有制造商都接受`MAP`的概念。第七大床上用品生产商 Comfort Solutions 的总裁 Dave Roberts 表示：“制造商不应决定价值并控制价格。制造商就该做制造商的事，零售商就该做零售商的事。”\
  \ Comfort Solutions 认为，零售商比制造商更有能力判断产品的价值。该公司于 2013 年放弃了`MAP`。“我们凭什么理由存在？”罗伯茨问道，“我们提供的是强有\n\
  \n\n\n市场现有产品的替代方案。”27 罗伯茨是否正确，时间会给出答案。根据我们观察其他公司的经验，在应对大型零售商时采取单方面解除武装的策略，并非明智的商业之举。\n\
  \n个人生产者享有的最重要的法律保护或许就是专利保护。然而，如前所述，专利的作用终究有限。虽然大型零售商在“合作”生产低端产品时，制造商面临的法律风险会增加，但规避专利设计是常规做法，且反垄断法鼓励这种促进创新的行为。有时，大型零售商努力产出的成果尚不足以在法庭上站住脚；而另一些时候，他们又做得恰到好处。\n\
  \n制造商已在广泛情境中成功运用了制度性权力。例如，20 世纪 80 年代汽车制造商游说美国政府限制日本进口、20 世纪 90 年代的“香蕉战争”，以及乔治·W·布什总统第一任期内针对外国钢铁的贸易保护主义措施，都体现了行业推动华盛顿帮助美国商业利益的能力。相比之下，制造商尚未将大型零售商视为对整个行业的威胁。由于大型零售商仅被视为美国经济供应链中的另一个环节，制造商并未利用其行业协会或外部政治平台来改变管理其与大众市场折扣店关系的规则。\n\
  \n26 昆汀·“蒂姆”·约翰逊，“最低广告价格计划”，[www.frelaw.com/articles/marketing/mark-0401-qtj.html](http://www.frelaw.com/articles/marketing/mark-0401-qtj.html)，2004\
  \ 年。\n\n27 大卫·佩里，“舒适解决方案放弃最低广告定价”，[www.furnituretoday.com/article/427474-comfort-solutions-drops-minimum-advertised-pricing](http://www.furnituretoday.com/article/427474-comfort-solutions-drops-minimum-advertised-pricing)，2013\
  \ 年 1 月 7 日。\n\n## 第七章 | 创新的第二步\n\n……都体现了行业推动华盛顿帮助美国商业利益的能力。相比之下，制造商尚未将大型零售商视为对整个行业的威胁。由于大型零售商仅被视为美国经济供应链中的另一个环节，制造商并未利用其行业协会或外部政治平台来改变管理其与大众市场折扣店关系的规则。\n\
  \n### 第二步\n\n尽管大规模分销商和中间商带来了挑战，但生产者*确实*有可能在从中小规模运营向大规模运营转型的同时，保持对其销售和分销的控制权。创新产品的价值*可以*与渠道成员分享，并且——这是关键所在——这种分享应基于生产企业的战略设计，而非仅仅取决于大型客户的偏好。那些成功实现业务规模化的公司，都深刻认识到在整个销售和分销链中控制其创新产品命运的关键重要性。尽管面临大型分销商的挑战，但*确实*有可能确保企业保护其置于产品和流程中的创造价值。\n\
  \n创新者面临的风险在于，企业可能一心只想将产品推入市场，并期望其独特的价值主张能够弥补所用任何分销渠道中可能存在的风险。在这种情况下，创新产生的收入可能会被那些掌控产品分销环境的大型客户不成比例地攫取。\n\
  \n创新的第一步是创造一种新型且差异化的产品或服务。如果仅止于此，那么创新就迈错了步子，这项充满希望和前景的创造可能永远无法面世，或无法充分发挥其潜力。支配创新第二步的原则是：*创新者必须控制其产品的销售和分销*。虽然创新的创造价值可以与分销伙伴分享，但关于产品如何到达客户手中的决策控制权，必须……\n\
  \n\n由公司保留。基于控制权这一首要原则，我们提出四种分销路径，供企业在扩大规模的同时保留对销售和分销（及其创新价值）的控制权。我们将此称为创新进程中的“第二步”。\n\
  \n***客户陷阱*** 107\n\n### 第一阶段：低规模\n\n处于第一阶段的公司规模太小，无法在不失去产品控制权的情况下应对大众市场。在此阶段成功通过大客户销售和分销其创新的公司，很可能会丧失开发和掌控自身产品的机会。在第一阶段，企业充分利用创新的最佳方式可能是直接向客户销售，或使用独立分销商。\n\
  \n##### 采用直效营销\n\n随着客户关系管理（`CRM`）软件、数据库管理程序以及基于网络的客户服务辅助工具对各类规模的企业来说变得愈发实惠，直接瞄准公司细分市场的可能性已近在咫尺。客户亲密感、忠诚度以及口碑传播，都是通过有效的直效营销可获得的益处。\n\
  \n许多小公司仅通过直效营销就成功销售了产品。专注于冷知识的杂志 `Mental_floss` 充分利用其网站销售书籍、服装以及其他围绕揭示稀奇古怪信息（例如，西奥多·罗斯福白宫里的柔道馆，或者你在\
  \ 2020 年将驾驶的汽车）的产品。通过创建一个吸引数千人每日访问的精彩网站，该公司能够直接向客户销售其产品。从商业讽刺网站 [Despair.com](http://despair.com/)\
  \ 到复古服装专家 American Vintage Classics，许多其他公司都已围绕网络建立了整个业务。我们将在第 8 章更详细地讨论如何成功实施直效营销策略。\n\
  \n##### 使用独立分销商\n\n于 1947 年发明铝壁板的 `Alside` 公司，最终成为美国最大的乙烯基建筑墙面和专业窗制造商之一。据公司联合创始人唐纳德·考夫曼称，保持对分销的控制权是公司战略的核心重点。考夫曼表示：“如果我们在某个本地市场有好的分销商，我们就不会内部自行分销产品。”相反，公司会将分销商的目标与自身目标对齐，然后管理由此产生的相互依赖关系。\n\
  \n> 28 摘自 2008 年 7 月 25 日对 Alside 公司前 CEO 唐纳德·考夫曼的访谈。\n\n***第七章 | 创新的第二步***\n\n\
  这种协同关系保持得很简单。`Alside` 追求市场份额，而其分销商则希望通过销售由前沿材料和设计制成的壁板来盈利。这是一个经典的共同利益情景，因为 `Alside`\
  \ 和本地分销商都认为这种结构既服务于短期目标，也服务于长期目标。目标是管理经销商，使他们将自己视为合作伙伴，而不仅仅是客户。`Alside` 得以避免在特定市场建立自己分销中心的高昂进入成本，所需的设施和基础设施由本地合作伙伴提供。本地分销商则可以接触到\
  \ `Alside` 广泛的创新产品系列、商业培训以及库存管理控制系统。\n\n#### 第二阶段：低到中等规模\n\n处于第二阶段的公司规模已足够大，可以谨慎地接近大众市场。但这种方式应是间接的和/或有限度的。在此阶段，创新公司的大部分特征处于最佳状态。其创新根基深厚，产品高度差异化，且替代品威胁较低。在此阶段，流程创新和品牌知名度可能较高，也可能不高。\n\
  \n除了通过直接销售和独立分销商服务市场外，我们建议公司可以通过\n\n\n\n#### 许可安排\n\n许可可以帮助创新者制定行业标准、提升声誉并创造学习机会。此外，通过将特定产品或产品线的生产许可给另一家制造商，创新者可以免去产品交付责任，从而在其他市场开拓产品应用。29\n\
  \n前文提到的`FII`与`Savio Engineering`签订了许可协议，后者通过其子公司`Freedom Ponds`制造和分销较小的`BioHavens`。在南太平洋和新西兰也设有类似安排。这些公司为景观安装和小型池塘市场制造和分销`BioHavens`，从而使`FII`能够腾出手来开发其产品的其他应用。通过将其面向消费者的`BioHavens`生产许可给其他公司，`FII`得以进入公司更感兴趣的其他市场。\n\
  \n另一个例子是中国南方小型发动机制造商`Timpko`，该公司已将其产品许可给撒哈拉以南非洲地区的多家运输相关产品分销商。每个分销商对摩托车的最终版本都有特定且往往不同的需求。\n\
  \n29 Ulrich Lichtenthaler，“技术许可的驱动因素：行业比较”，*《加州管理评论》*第 49 卷第 4 期，2007 年夏季，第 67–89\
  \ 页。\n\n***《顾客陷阱》*** 109\n\n在肯尼亚，摩托车的主要用途是当地快递公司的配送。在`Timpko`的工厂，肯尼亚车型配备了一个固定在摩托车后部的安全货运单元。对于产品主要由农村农民使用的埃塞俄比亚，则采用一套特殊的轮胎和改进的变速箱来应对地形的困难。`Timpko`的所有车型都是根据当地分销商的规格开发的，并且`Timpko`的工程师经常前往非洲查看是否需要做出任何调整.30\n\
  \n#### 阶段三：中到大规模\n\n在第三阶段，创新公司最终拥有足够规模，能够与大型分销商有效合作。尽管产品相关特性已处于最优，创新者仍需谨慎进入大众市场。除了第二阶段讨论的许可安排，我们建议生产商向大型分销商提供有限数量的产品或专门为大众市场设计的商品。企业可以通过允许大型零售商仅销售精简、简化的产品型号或企业产品线中的有限选择来加强对分销的控制。通过这种方式，企业根据分销渠道对市场进行了细分。\n\
  \n要使按分销渠道进行市场细分有效，最终客户必须感知到通过不同渠道销售的产品之间存在有意义的差异。例如，户外游乐设备制造商`The Step2 Company`仅通过其网站销售新创新产品，而在大众市场上仅推广标准化产品。这种做法之所以有效，是因为客户愿意为公司直销的产品支付更高的价格，认为这些产品确实优于大众市场产品。经验表明，如果一家公司简单地采用多渠道方式销售无差异化的产品，随着消费者意识到同一商品通过大型分销商的售价更低，该公司将被迫在所有渠道降低价格。31\n\
  \n#### 阶段四：大到超大规模\n\n对于在市场中正确定位的规模化创新者，可以利用大型零售商来获得品牌知名度并触达尚未开发的客户。大众市场具有快速创造\n\n\
  30 Andrew R. Thomas, Todd A. Finkle, and Timothy J. Wilkinson, “Timpko Export Management\
  \ Company,” *Journal of the International Academy for Case Studies* 16, no. 2,\n\
  \n\n\n"
