  \ 年 7 月。\n\n#### 消费者陷阱\n\n95\n\n显然，体量和规模有其特权，对经销商而言尤其如此。\n\n#### 市场\n\n顾名思义，巨头们能够接触到大量消费者，并且随着\n\
  \n\n\n他们控制着市场的准入。一系列发表在《华尔街日报》上的文章讲述了`PenAgain`公司创始人`Colin Roche`令人印象深刻的创新故事，他在加州帕洛阿尔托读高中时就构思出了一款奇特的叉骨形笔的设计。¹¹\
  \ 2001 年，他和朋友`Bobby Ronsee`各出资 5000 美元成立了`Pacific Writing Instruments`公司，申请了专利，建立了生产线，并搭建了一个网站。两位合伙人想在大众市场上销售他们的笔，但他们了解到，要想打入大型连锁商店，他们首先需要在小零售商中证明自己产品的价值。\n\
  \n早期的经销商之一是`Edwards Luggage`的老板`Fred Ebert`，他很喜欢这款笔，并开始以每支 12.95 美元的价格销售。很快，更大的客户也加入了进来，包括`Fred\
  \ Myer`和`Hobby Lobby`，以及加拿大的 200 家`Staples`门店和 5000 家独立办公用品商店。到 2005 年 9 月，`PenAgain`在欧洲已售出\
  \ 120 万支笔，并且每月约有 5000 美元的网站销售额。\n\n`Roche`和`Ronsee`并不满足于公司戏剧性的发展。他们致力于让`PenAgain`成为大众市场的流行现象。这意味着他们需要降低成本并创造规模经济，以便能够为他们计划争取的大型分销商提供低价。在外部投资者的资金支持下，`Roche`和`Ronsee`与中国制造商签订了合同。这使他们能够将一款型号的零售价降至\
  \ 3.99 美元。\n\n最终，`PenAgain`的创始人在本顿维尔的一个小会议室里，坐在一位沃尔玛采购员面前。十个月后，他们收到通知，供应商协议正式获批。沃尔玛将在\
  \ 500 家门店销售这款笔，为期六周。`PenAgain`需要售出至少 85%的产品，才能获得永久货架位。与沃尔玛的试销期被认为是成功的，他们随即收到了追加订单。\n\
