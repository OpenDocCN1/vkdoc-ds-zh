  \ Stihl 家族在服务经销商中的良好声誉。 5\n```\n\n\n\nSTIHL 的经销商们对这家公司几乎一致好评。比灵斯五金店位于蒙大拿州比灵斯大道的尽头。走进前门，立即向左转，你会看到一大片\
  \ STIHL 产品的陈列。丹·托马斯，一位说话温和、表达清晰、看上去 50 多岁的男士，负责店内的服务工作。“我从 1979 年起就开始从事户外动力设备行业，自己拥有过两家经销店。我几乎在每一个层面都工作过——包括制造商代表、维修技师、销售和管理。这个行业里能做的事情我都做过。”在接听电话的间隙，托马斯解释说，自\
  \ 20 世纪 80 年代他与父亲一起经商以来，这个行业已经发生了翻天覆地的变化。“许多制造商为了提升销量数字，受到了大型连锁店和大卖场的诱惑。这改变了这个行业——可能永远改变了。许多制造商都没能生存下来。””6\n\
  \n制造商向大卖场靠拢的后果之一，是它们失去了与独立经销商的关系。经销商无法与大型连锁超市提供的价格点竞争，于是他们停售了那些在大卖场中推出的产品线，转而寻求高端制造商。没有了独立经销商，就没人来维修或保养已售出的设备。托马斯指出也有例外。在比灵斯，在劳氏销售的胡斯华纳设备，可以在一些\
  \ Big R 商店进行维修。但如果你购买的是 Homelite 或 Poulan 牌链锯，“那你就只能靠自己了。”对于购买者来说，产品的可靠性就像是一场碰运气的赌博。托马斯这样描述质量问题：\n\
  \n> 大型连锁店销售的户外动力设备，通常不如独立经销商销售的产品那么好或品质那么高。这纯粹是因为大众商家希望以更低的价格销售产品。在大众商家在动力设备领域占据主导地位之前，大多数制造商都有一些不错的产品。一旦制造商开始追求巨大的销量，它们的质量就会因为两个原因而下降。第一，他们必须以更快的速度生产更多的产品。第二，零售渠道要求价格低得多的产品，所以他们降低质量标准，在生产中偷工减料。至少就链锯而言，[列举了三个品牌]在这个行业发生巨大变化之前，都曾是相当不错的制造商。而现在，这个市场上的所有这些产品都已经质量下降，只能靠价格来销售。\n\
  \n托马斯对 STIHL 的评价很高。他表示，该公司拥有非常良好的品牌形象和高质量产品，是“目前市场上质量最好的机器”。胡斯华纳和 ECHO 是另外两个全国知名品牌，托马斯认为它们是“次优的机器”。然而，当顾客在大型超市购买这些产品时，最终到手的商品是否适合特定的工作，却未可知。托马斯解释了他的做法：\n\
  \n> 我想做的第一件事就是询问顾客，他要用这个设备做什么，以及打算怎么用它。最糟糕的事情莫过于卖给某人不适合做某项工作的、不够耐用的设备。他根本不会对那台机器感到满意。这对于所有销售的产品线都一样。你必须让顾客购买他想要在特定用途下使用的设备。\n\
  \n托马斯拥有 STIHL 提供的最高级别的技术培训证书，这是他在该公司位于弗吉尼亚州的制造工厂获得的。他评论道：“大卖场通常没有合格的销售人员在场帮助顾客。那些地方确实有个别具备一些知识的人，但并不多。”\n\
  \n\n\n### 斯蒂尔的故事\n\nArboristsite.com 上的一篇文章代表了众多经销商的观点：\n\n> 我的分销商是北卡罗来纳州希尔斯伯勒的中大西洋斯蒂尔公司。我从未与比这更优秀的组织打过交道——他们的客户服务堪称一流，备件供应率更是出色。斯蒂尔会给出建议零售价，让经销商能获得一定利润——但经销商可以自行决定以更高或更低的价格出售。我始终以零售价销售零配件和整机（大宗客户有例外）。经销商的利润至关重要——否则就不会有经销商存在。斯蒂尔也没有最低订货政策。他们提供一些激励措施，比如达到最低订货规模（以前是\
  \ 2500 美元，现在可能更高）就能享受免费运输。很多时候，客户需要某个零件……斯蒂尔当天就会发货，我卖出零件并承担运费。客户和经销商都满意。7\n\n这段感言体现了斯蒂尔对其服务经销商的尊重。从根本上说，公司明白其业务不仅仅是制造世界上最好的户外动力设备。它深知，遍布全球的小企业主和个体技师才是其成功的关键。\n\
  \n#### 避开客户陷阱\n\n斯蒂尔前营销与销售副总裁彼得·伯顿说：“品类杀手很诱人。当他们找上门时，很容易被那种兴奋感冲昏头脑。他们声称能带来的销量，是巨大的。”\n\
  \n斯蒂尔对自身市场定位的洞察，以及对大企业合作后果的清醒认识，抑制了这种大众折扣商的诱惑。斯蒂尔非常清楚“客户陷阱”导致的恶性循环。总裁怀特将其讲述为一个寓言：\n\
  \n> 大型连锁卖场的人说：“安德鲁，你是我们最重要的供应商；你是个了不起的人，我们爱死你了，你一直给我们提供 fantastic 的產品。”那么安德鲁会怎么做？他回到家，和妻子坐下来，说：“亲爱的，我拿下了一个大客户；我们现在日子好过了。我们要买那条新船，我们还能买更大的房子，我们还要买奔驰。”然后安德鲁雇佣了\
  \ 20 个人，盖了一栋新楼。第二年，安德鲁回来和客户坐下，同样的场景又重复了：“安德鲁，你是我们最杰出的供应商之一，但今年你必须将供货量翻倍，因为你的产品太成功了。”安德鲁回到家，和妻子坐下来。他买了更大的船，买了更大的房子，雇佣了更多人，添置了更多机器，买了更大的厂房。第三年，安德鲁和他的大客户坐下来，对方说：“安德鲁，我们一直合作愉快，我们爱死你了，但是这位代表中国公司的特里·凯利，能以一半的价格卖给我们同样的产品。”现在，安德鲁要怎么办？安德鲁没有回家告诉妻子他要卖船、裁员。不，他看着自己的链锯，说，嗯，你知道，我们不必给链条镀铬，不必在引擎里装滚珠轴承，我们可以改用轴套。我们不需要齿轮驱动的自动油泵，我们可以装一个需要手动从曲轴箱减压的油泵。还有那些减震支架，嗯，我们也可以在里面塞个轴套。随着时间的推移，产品质量为了迎合价格而被侵蚀；然后，你知道会怎样。\n\
