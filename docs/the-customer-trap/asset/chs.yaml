- '# sunshine 的困境


  阳光并没有等着山姆去解决问题。车道需要清理，草坪需要修剪，总会有别人去做这些事。山姆现在在当地一家汽车经销店卖车。


  #### 这是一个常见的故事


  在你认为这仅仅是一个不懂世故的年轻人的故事之前，我们想提醒你：在过去的几十年里，类似的案例已经在规模比山姆的公司大得多的企业内部上演了成千上万次。更糟糕的是，这些公司拥有本该更有见识的、经验丰富的领导者。


  我们再来看另一个故事，这次是一家陷入“客户陷阱”的全国知名公司。你可能记得大卫·奥瑞克（`David Oreck`），这位以他名字命名的吸尘器公司的创始人。电视广告中，奥瑞克先生头顶保龄球、仅靠一台吸尘器将其固定的画面，成为了
  cult 经典。


  ### 第一章 | 最大的商业错误


  40 年来，他的公司一直是商学院学生和新兴企业家学习的典范：一家创新的国内制造商，采用直销策略，牢牢掌控着自己的产品和品牌。


  我们甚至曾在大学里听过奥瑞克先生的演讲。他对自己毕生建立的事业感到理所当然的自豪。勤劳的美国工人在路易斯安那州和田纳西州生产他的产品，并获得了不错的日薪。他坚决抵制大型卖场——甚至称沃尔玛为“中国超市”。


  独家特许经营权和公司自有门店保持了高品牌资产。他们只销售奥瑞克的产品。这些门店，连同公司的网站和呼叫中心，是人们能买到奥瑞克产品的唯一渠道。许多型号售价超过 1000
  美元，并附带 25 年保修期——这在家庭用品行业是闻所未闻的。业务增长了，品牌也更强大了。特许经营商和消费者都是忠实的信徒，产品几乎达到了神秘的地位。


  然后，奥瑞克先生决定出售公司。他在 2003 年将其卖给了美国证券资本合伙人（`American Securities Capital Partners`），这家私募股权公司随后榨干了企业的生命，留给其他人“一个巨大、陈旧、且装满债务的烂摊子”¹。这些私募股权天才们几乎在一夜之间就通过决定在塔吉特（`Target`）销售产品而摧毁了公司。那些独家特许经营商——其中许多忠诚了
  30 多年——被新的大体量“超级客户”挤到了一边。奥瑞克先生几十年来建立的稳固客户关系立刻被蚕食。再也没有人会花 1000 美元购买一台现在像砖块或其他任何商品一样在大型零售商处销售的吸尘器了。品牌被毁了。奥瑞克的狂热粉丝们被抛弃，成为了大销量的牺牲品。


  引人注目的是，当公司果然陷入破产时，公司的新领导们居然有脸将公司的失败归咎于没有足够快速地出卖给大卖场。他们说，销售和分销吸尘器方式的转变——通过大型零售商而非直接面向客户销售——耗时超出了预期²。因此，按照这里的逻辑，公司被毁是因为他们没能足够快地摧毁它。这种剧情真是编都编不出来。


  ¹ 阿尔·刘易斯（`Al Lewis`），《榨干企业》，《华尔街日报》，2013 年 5 月 18 日，第 2 页。

  ² 凯蒂·斯特克（`Katy Stech`），《被遗忘的奥瑞克家族》，《华尔街日报》，2013 年 7 月 9 日，第 B.4 页。


  #### 那么，到底什么是超级客户？


  简单来说，一个**超级客户**是指占总销售额超过 10% 的客户。为什么是 10%？这是某个武断的数字吗？它从何而来？


  部分解释是直观的。只要你把很多鸡蛋放在一个或几个篮子里，只要这些大客户保持盈利和忠诚，这可能非常棒。然而，商业如同生活，变化是不可避免的。




  '
- '# 当大客户突然变卦、离开或以此要挟，除非


  做出巨大让步，否则灾难性局面就可能出现。我们大多数人都会记得，如果有一个大客户宣布要将业务转移到别处，除非获得大幅降价。这样的时刻可能会造成严重损害，甚至威胁到公司的整个未来。


  一个更实质性的、关于为何不应超过 10%的原因，源于管理会计实践。1974 年，财务会计准则委员会（FASB）为非政府组织的财务报告制定了财务会计准则。这些准则被美国注册会计师协会和证券交易委员会（SEC）认定为权威准则。[³]


  FASB 在其《财务会计准则公告》（SFAS）中对会计语言进行了编纂。这些正式文件详细阐述了选定会计政策的标准和指导。FASB 发布这些标准，期望所有在美国证券交易所上市的公司都能遵守。制定这些标准是为了确保公司具有更高水平的透明度。换句话说，这一切都是为了便于外部人士更好地了解一家上市公司内部正在发生的事情。


  就我们的目的而言，我们关注的是 SFAS 131：


  > 企业应披露其依赖主要客户的程度。如果与单个外部客户的交易收入占企业收入的*10%或以上*，该企业应披露该事实、来自此类每个客户的收入总额，以及报告该收入的部门或各个部门的身份。[⁴]


  用通俗的话说，这意味着根据美国公认的财务会计准则，一家上市公司必须披露某个客户是否占其总销售额的 10%以上。为什么？因为根据公认准则，一个占总销售额 10%以上的客户对公司而言是一个潜在风险，外部人士应意识到这一点。


  [³]: 财务会计准则委员会，“关于 FASB 的事实”，[www.fasb.org/jsp/FASB/Page/LandingPage&cid=1175805317407](http://www.fasb.org/jsp/FASB/Page/LandingPage&cid=1175805317407)，访问日期：2014
  年 7 月 22 日。


  [⁴]: 财务会计准则委员会，“财务会计准则公告第 131 号”，[www.fasb.org/resources/ccurl/699/632/fas131.pdf](http://www.fasb.org/resources/ccurl/699/632/fas131.pdf)，访问日期：2014
  年 10 月 10 日。


  ## 第一章 | 最大的商业错误


  ### 10%法则


  那么，为什么会计师们会将 10%定为披露的基准呢？我们认为，这是因为 10%法则确实言之有理。


  正如希腊哲学家赫拉克利特恰如其分地指出：“唯有变化永恒。”客户来了，也会走。例如，如果一家公司有十个客户，每个客户约占总销售额的 10%，其中一两个客户流失了，这家公司很可能还能存活下来。也许会经历一段艰难时期。尽管如此，要取代这两个流失的客户及其
  20%的收入也绝非不可能。


  但是，如果一家公司有十个客户，其中九个客户占业务的 60%，另外还有一个超级大客户，负责其所有收入的 40%，情况又会如何呢？当这个超级大客户提出不合理要求、被收购、倒闭或其他情况发生时，这家公司会怎样？要取代
  40%的销售额是一项艰巨的任务，即便是在市场景气的时候也是如此。那么，如果一个客户占业务的 40%以上呢？


  如果一家公司很大一部分收入与某个行业相关联，同样的情况也可能发生。例如，有多少公司曾几乎被彻底摧毁……




  当他们在旅游和旅游业领域的客户在 9·11 袭击后陷入瘫痪时，情况是否也是如此？简而言之，过度依赖某一巨型客户或某一行业，可能会带来毁灭性的后果。


  当一家公司违反"10%法则"时，另一件常见的事情就会发生：巨型客户开始干涉供应商的运营，最终迫使供应商接受并执行原本不会考虑的事情。当然，这些活动都是为了增加巨型客户的盈利能力，而往往以牺牲供应商的利益为代价。以下是一些常见的例子：


  - 更改付款条款。（"既然我们对你这么重要，我们就要延长付款时间。"）

  - 要求供应商购买、学习并使用全新的信息技术系统。（"你们的系统还行，但为了和我们做生意，你们需要投资一套新系统，通过我们自己的供应商购买。"）

  - 对每一件小事收费。（"你们的卡车迟到了 10 分钟，我们将收取 X 费用。我们订购的库存没有全部售出，所以我们要收 Y 费用，让你们把货搬出我们的仓库。"）

  - 提供创新者的配方和商业机密。这通常以"质量保证"为幌子进行。当然，这些信息一旦泄露，就覆水难收了。

  - 扣押关于产品或服务如何进入市场的关键信息。（"既然我们是客户，我们有权不与你分享关于你产品的信息。"）


  客户陷阱的核心是难以想象的财富承诺。每个向所在行业的主导者成功销售产品或服务的供应商都会发财，对吗？事实远非如此。当《财富》世界 500 强公司——或者夫妻店——有意识地决定寻求与巨型客户建立关系时，陷阱就已经设下了。


  等到供应商意识到新的现实正在主导一切时，它已经陷入了客户陷阱。结果是可预见的且令人心碎。产品生命周期急剧缩短，让来之不易的创新沦为日用品。长期存在的品牌和整个行业被摧毁，只剩下一具空壳。国内业务因追求外包和离岸的低成本优势而关闭。尽管不断努力降低成本，利润却依然难觅。


  #### 但这并非巨型客户的错！


  在我们继续之前，如果你以为这又是一本指责全球大型零售商给当地社区带来祸害的书，请让我们明确一点：我们并不将客户陷阱及其后果归咎于巨型客户。我们认为，一家公司的产品或服务的真正责任在于该公司本身。无论是
  FTD、沃尔玛、亚马逊、联邦政府，还是任何其他潜在的巨型客户，都没有强迫供应商主动找上门。


  无论是出于天真、傲慢还是贪婪，期望巨型客户善待自己——并尊重其品牌、产品和服务——的公司，都是可悲地误入歧途。企业领导者不知道、忘记或忽视的是，基于追逐巨型客户的战略本身就存在根本性缺陷。


  然而，这恰恰是过去几十年中反复发生的事情。这种转变发生在市场营销开始采纳供应链管理的目标之时，而供应链管理的核心在于规模和效率。当生产商专注于完善自身内部能力时，巨型客户——在大多数商学院教授、管理顾问和商业媒体的雷达之外运作——逐渐主导了经济的各个领域。给生产商的信息很明确："你的任务是要''精益''和''高效''，同时持续向市场交付''客户价值''。"




  在生产和运营方面，六西格玛及其他行业认证无疑是效率的关键组成部分，需要融入企业的基因。但企业客户方面的情况如何呢？这正是错觉产生的地方。例如，有多少公司认为，以效率和降低成本为名，将客户呼叫中心外包到印度是个好主意？我们已经知道答案。


  让我们以沃尔玛为例。它拥有约 12.5 万家供应商。由于其规模庞大，该零售商是绝大多数供应商的最大客户。从效率的角度来看，与沃尔玛这样单一的客户打交道是合理的。尽管如此，如果你问这些供应商中的大多数，他们年复一年的利润与沃尔玛相比如何，你听到的很可能不会是什么好话。


  沃尔玛不可避免的降价迫使制造商降低成本，这可能意味着将生产转移到中国、在设计中去掉产品品质、限制研发，以及外包服务和维修。其结果是对消费者价值的侵蚀，因为大客户迫使生产商采取的成本削减措施，恰恰削弱了最初吸引购买者的产品特质。在效率和价值之间很难达成持久的妥协，因为追求更高效率的力量要强大得多，并且通过不断的妥协持续侵蚀客户价值。


  举个例子：`Jones Soda`曾经是一家时尚的小众生产商，其最初的销售和分销策略是建立在通过独特的合作伙伴进行销售的基础上的，这些合作伙伴包括纹身店和滑雪用品店。该公司拥有一支小型销售团队，试图通过其独特的分销渠道来发展品牌。这是一个坚实的模式：一个创新的制造商通过忠诚的分销商进行销售，并最终扩展到`Panera
  Bread`和`Barnes & Noble`。


  随后，当时的首席执行官想到了一个绝妙的主意：通过向`Target`及其他大客户进行销售，进一步扩大销售和分销范围。可以说，这是一个引爆点。销售额激增，但利润却蒸发了。公司出现巨额亏损，并且自那以后再也没有真正盈利过。快进到今天：股价徘徊在每股
  35 美分左右.5。另一位首席执行官被请来。新策略是什么？在 3600 家沃尔玛门店销售，以增加销售量。哇。


  5 2014 年 12 月 27 日，公司股价为 0.34 美元。它在 2008 年 4 月达到峰值，约为每股 28.22 美元，就在与`Target`达成交易之前。


  ***客户陷阱*** 11


  谁该负责？


  平心而论，那些饮下大客户迷魂汤的商业领袖，只是一场始于 20 世纪 80 年代美国并随后蔓延全球的戏剧中的演员。创新公司及其领导者当时正回应管理理论家的言论。这些商业大师谈论的是组织转型——强调核心能力、资源、能力、创新、技术和运营效率。诸如全面质量管理、精益生产和六西格玛等方法，仅仅是商业精英向各种规模公司宣讲的部分解决方案。


  大客户既是这场已席卷美国商界并正被输出到世界其他地区的传染病的副产品，也是其原因。从 20 世纪 80 年代初开始，美国制造商和服务提供商激进地摆脱垂直整合，并开始将许多业务活动外包。作为管理教育支柱的*核心能力*概念，被作为放弃销售和分销的主要理由。


  这个想法是，组织领导者应该识别出他们擅长的领域——也就是他们为市场带来真正价值的地方——然后放弃其他一切。为什么要管理大量的小客户、经销商呢？



  或特许经营商，当你的核心竞争力——你的差异化基础——在于研发、创新或制造时？遵循这一建议，公司剥离了那些不被视为增值的活动，并将销售和分销推到一边。数千家之前掌控着其创新发展所有方面的企业，开始对销售和分销失去兴趣，反而更希望由专家接管这一“业务职能”。具有讽刺意味的是，这创造了一个市场真空，而巨头们迅速填补了这一真空。很快，那些接管了这些非核心业务活动的公司开始施加核心层面的控制，劫持了最初赋予它们生命的制造公司的战略方向。这一点，再加上
  21 世纪初一系列国际并购、收购和整合，推动了各行业大规模分销商的演变，它们成为了美国和全球创新产品与服务销售及分销背后的驱动力。


  如今，大多数产品和服务由创造这些产品和服务的实体以外的实体控制。我们发现，绝大多数情况下，公司将其创新产品交到消费者手中的能力，都受到大客户的阻碍、阻挠和控制。制造商甚至无法控制自己可以收取的价格。这一点从大客户的指令中可见一斑，他们年复一年地强制要求降价，同时坚持要求供应商维持高质量标准。这就是“客户陷阱”在起作用。


  ***第一章 | 最大的商业错误***


  然而，最终，对于大客户崛起所应承担的责任和最终问责， squarely 落在那些最初决定将销售和分销外包给巨头的高管肩上。这是他们的决定和抉择。关键是要理解，当我们谈论责任和问责时，必须向个人追究责任，而不是像公司这样的无形实体。


  对于每一项重要职责，例如制定销售和分销策略，都伴随着问责制。这是每个人为自己影响他人的职责履行情况作出交代的义务。问责制包括对意图和结果负责。每当有人承担重要义务时，他们必须向利益相关者交代自己的决定。


  我们经常发现的情况是，那些一度被与大客户做生意的诱惑所吸引，而现在意识到自己陷入客户陷阱的高管们，会玩起推卸责任的游戏。他们会说这样的话：“好吧，我们不知道这会发生在我们身上。”或者，“我们没想到这会是最终结果。”


  但是，正如你父母常说的，你与谁为伍，就定义了你。例如，如果你决定前往本顿维尔，坐在沃尔玛采购人员的对面，然后允许沃尔玛或任何其他大客户进入你的公司，你就必须完全接受这一行为的后果。大客户无处不在。他们不会对自己的身份撒谎。与普遍看法相反——正如我们在本书中明确指出的——他们并非唯一的选择。而且他们绝对不是最好的选择。与大客户做生意既非不可避免，也非既成事实。只有当公司决定寻找并与大客户做生意时，客户陷阱才会成为现实。为了让你更清楚地理解这个过于常见的商业错误，我们将在接下来的四章中详细阐述。警告：这并非适合胆小者。


  **C H A P T E R**


  客户陷阱与品牌毁灭


  *从来没有人能够，将来也不会有人能够，逃脱自己选择的后果。*

  ——阿尔弗雷德·A·蒙塔佩特




  ### 客户陷阱


  客户陷阱可能摧毁企业众多关键环节。当超级客户能运用其力量时，供应商的战略工具箱会瞬间被碾压。随着超级客户占据主导地位，生产企业将失去对自身命运的控制，很快沦为满足殖民者需求的附属品。一旦陷入这种境地，几乎不可能重新夺回控制权。


  这种现象在品牌领域表现得最为明显。与超级客户达成交易的规模和范围会迅速侵蚀单个产品及服务的品牌资产，最终彻底摧毁企业的整体品牌形象。


  无论你的公司是小制造商、本地零售商还是《财富》500 强企业，品牌的质量与影响力都至关重要。什么是`品牌`？它是代表企业本质及其产品服务的一组无形认知，由这些产品服务所承载的理性、功能性与情感属性支撑。正如常言道："认知即现实。"


  ## 第二章 | 客户陷阱与品牌毁灭


  以 Oreck 为例，当其产品与廉价中国制造吸尘器一同堆放在 Target 百货单调的货架上时，消费者对该品牌的认知已发生不可逆转的改变。人们开始以全新视角审视这个品牌：其高端光环已然褪色，Oreck
  成了受损商品。


  同理，当餐厅、水疗中心、舞蹈工作室、皮肤科诊所、汽车维修店等商家通过 Groupon、LivingSocial、Amazon Local 及类似网站提供优惠时，这些中介平台会迅速成为供应商的超级客户。企业很容易被说服：降价造成的损失会因销量增长而超额弥补。与其耗时费力地维护客户关系并面向多样化客群营销，不如让超级客户代劳。


  这种逻辑大致如此："通过 Groupon 特惠，我们或许以七折价格提供水疗服务，但想想能卖出多少份服务！而且不必操心广告营销，因为 Groupon 全包了！"


  这种粗略估算的商业策略远不止危险那么简单，它完全忽略了通过超级客户打折带来的隐性成本。品牌价值受损虽非本意，却是真实存在的后果。一旦消费者看到品牌与这类促销活动挂钩，就会等待下一轮优惠才考虑购买。这使服务提供商陷入恶性循环：为了与同样通过超级客户销售的竞争对手抗衡，不得不持续推出更优折扣。


  这类网站从不提供独家合作，反而让生产商直接相互厮杀。更糟糕的是，消费者不会对服务提供商产生忠诚度，而是忠于中介平台。客户黏性建立"每日特惠"之上，而非产品或服务的实际价值。


  本章我们将深入剖析两个因"客户陷阱"而毁于一旦的百年品牌。利维斯·斯特劳斯公司和固特异轮胎在超级客户手中遭受的损害，为那些不惜一切代价追求销量的企业提供了惨痛教训。


  #### 利维斯放弃阵地


  若论最具标志性的美国品牌，利维斯·斯特劳斯公司当之无愧。其牛仔裤风靡一个多世纪，堪称美国文化的核心。怀俄明乡间的牛仔与向往牛仔生活的人们将 oversized
  皮带扣系在利维斯牛仔裤上；嬉皮士及其文化传承者...




  #### 李维·斯特劳斯与牛仔裤的故事


  人们穿着褪色版的牛仔裤；几乎所有介于两者之间的人都以某种方式穿着牛仔裤。Levi’s 是传奇之物。詹姆斯·迪恩（James Dean）在《无因的反叛》中穿着它们。它们甚至在冷战中扮演了角色。《时代》杂志在
  1962 年报道称，前苏联的官僚们反对其腐败影响。“甚至存在一股蓝色牛仔裤的时尚热潮，这激怒了激进的党内忠实分子，他们尖刻地指出，蓝色牛仔布一定是走私入境的，因为它甚至在苏联都不生产。”¹在共产主义黑暗时期，将牛仔裤走私到俄罗斯资助了许多年轻美国人的欧洲冒险之旅。


  李维·斯特劳斯（Levi Strauss）以其创始人命名，他为 19 世纪 50 年代加州淘金热中的矿工创造了这种结实的牛仔裤。斯特劳斯雇佣了一名裁缝，用他横跨全国带到旧金山的棕色帆布制作裤子。材料用完后，他从法国尼姆镇找到了新的供应。这种材料在当地被称为“serge
  de Nimes”，英文简化为更简单的单词“denim”。斯特劳斯将布料染成蓝色，然后他和他的继任者们在一个世纪里拼命追赶销售。公司在 1880 年的收入为 240
  万美元。诸如用铆钉固定接缝和用数字（第一种是现在著名的 501）进行品牌烙印（涉及热铁的那种）等创新随之而来。


  在 20 世纪上半叶，该公司既面临不利的经济条件，又缺乏有远见的领导力。尽管如此，环境帮助公司突破了其区域市场。20 世纪 30 年代，东部人前往西部度假牧场的旅行，以及蓝色牛仔裤在数百部好莱坞西部片中的出现，为这种独特产品创造了一种神秘感。


  二战期间，美国政府宣布 Levi’s 对战争至关重要，并专门提供给国防工人。战后被压抑的消费需求造成了持续的产品短缺。由于只有五家工厂，李维·斯特劳斯被迫实施了一项分销计划，优先考虑在过去几十年中合作过的中间商和零售商。1948
  年，公司销售了 400 万条牛仔裤，利润超过 100 万美元。


  20 世纪 50 年代，注意到美国正处于婴儿潮时期，公司将注意力转向青年市场，强调其裤子不仅用于工作，也用于娱乐。公司的销售队伍扩展到全国范围，更关注城市商店而非农村商店。新的创新随之而来，包括拉链而非五钮门襟、预缩牛仔布、弹力牛仔布、灯芯绒和免烫处理。公司以惊人的速度增长。从
  1963 年到 1966 年，销售额翻了一番，达到 1.52 亿美元。1968 年，李维·斯特劳斯的销售额达到 2 亿美元。它已成为美国第六大服装生产商。然而，它仍然无法满足需求。


  尽管在 20 世纪 70 年代面临国内和国际挑战，销售额在 1974 年突破了 10 亿美元，并在四年后翻了一番。


  20 世纪 80 年代初，对牛仔布牛仔裤的需求放缓，促使李维·斯特劳斯首次进军大众市场。与大型客户 J.C. Penney 和 Sears 达成了交易。然而，利润下降了
  25%，1982 年公司关闭了九家工厂并裁掉了 2000 个工作岗位。尽管加强了与高端时装市场的广告联盟，并在 1984 年与奥运会合作，但到 80 年代中期，利润下降了
  50%。


  尽管如此，通过引入新产品，李维·斯特劳斯还是能够摆脱困境。


