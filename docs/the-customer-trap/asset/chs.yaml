  \ 年 3 月，第 63–78 页。\n\n***客户陷阱*** 93\n\n#### 创新者/分销商关系模型\n\n实证研究表明，从渠道成员的角度来看，其目标是建立能够最大化合作与客户满意度，同时最小化冲突的渠道。通过消除销售和分销中的低效环节，并专注于客户，可以实现通向市场的最优路径。然而，在现实中，渠道成员存在于权力关系之中。\n\
  \n`权力`被定义为一个渠道参与者改变另一个渠道成员行为的能力。权力可以是正面的，例如当一家公司拥有合法（法律）权利来指示另一家公司做什么时；也可以是负面的，例如当一家公司利用自身优势胁迫或操纵另一家公司时。后者的例子包括大客户因产品标签错误和发货失误而征收的“罚款”，或要求提供免费样品。5\n\
  \n正如本书第一部分所述，普遍的共识和实证证据表明，在过去几十年中，议价权已从供应商转向买家。这种情况发生在生产商放弃垂直整合，转而专注于自身核心能力的过程中。6\n\
