- '# 第二部分：规避陷阱


  单纯为了批评而批评，仅限于极少数人的领域。例如，评论书籍、电影、戏剧和餐厅的人，深知自己的批评仅代表个人品味。在商业领域，这种批评方式是大忌。如果有人想贬低某种商业实践，就必须提出可行的替代方案。若做不到，最好靠边站。


  如果说“客户陷阱”教会了我们什么，那就是围绕销售和分销的许多思维都存在严重缺陷。本书第一部分是我们的批判。在第二部分，我们将展示企业如何从一开始就避免落入客户陷阱。


  ## 第六章：斯蒂尔的故事


  *没有什么比一个好榜样更令人恼火的了。* ——马克·吐温


  美国斯蒂尔公司总裁弗雷德·怀特在谈论公司生产的户外动力设备时，带着一种如同用公司传奇链锯砍树般的谨慎与深思。他已在这家公司任职 42 年——过去 25 年担任美国业务总裁。在此之前，他曾担任斯蒂尔加拿大公司总裁
  10 年。怀特仍是加拿大公民，这一事实被他的中西部口音所掩盖，连偶尔的“嗯”都没有。我们与他见面时，首先提出了这个问题：“您是否曾有过通过大型连锁卖场销售的念头？”他停顿片刻，随后斩钉截铁地说：“绝无可能。”接着他表示：“你无法满足所有人的需求。你必须清楚自己是谁，以及你长大后会成为什么。”[¹]


  在美国，斯蒂尔通过 12 家区域分销商和 8500 家服务经销商销售产品，其中超过 50%的经销商仅销售斯蒂尔品牌的手持产品。你无法在劳氏、家得宝或沃尔玛买到斯蒂尔的链锯、吹风机、修剪机或割灌机。这并非因为没有人费尽周折想让斯蒂尔产品进入大型零售卖场。他们做过销售演示，保证过性能标准，并预测了巨额利润。然而，试图达成交易的努力来自大型零售商，而非斯蒂尔。弗雷德·怀特表示：“在相当长一段时间里，劳氏和家得宝的代表乘坐私人飞机飞来这里，与我们坐下来，播放他们的
  PPT。”


  斯蒂尔的故事，是一个集发明、创意与品质，以及服务、忠诚与远见于一体的故事。正是最后一点——卓越清晰的远见——使公司免于陷入客户陷阱。这家公司从未对大众市场折扣零售商给予过哪怕一丝一毫的认真考虑。这种贯穿公司的远见与智慧，正是


  [¹]: 所有斯蒂尔总裁弗雷德·怀特的引述均源自 2009 年 2 月 10 日首次进行的访谈。此后，我们与怀特先生及其高级管理团队进行了多次讨论。任何事实信息均于
  2014 年进行了最新更新。




  受公司创始人从一开始就灌输的理念影响。


  #### 起源


  安德烈亚斯·斯蒂尔（Andreas Stihl）喜欢钻研问题，了解事物的运作原理。他于 1896 年出生在苏黎世，由德国的亲戚抚养长大，后被派往第一次世界大战的前线，在那里受了重伤，于
  1917 年因医疗原因退役。退役后，他在艾森纳赫的技术学院学习机械工程，并在大型公司工作了三年，其中一家公司为锯木厂制造蒸汽机。正是在此期间，他发现了一个问题，并开始构思一个解决方案，该方案后来彻底改变了世界范围内的林产品行业。


  他发现的问题是：树木必须通过固定式锯或斧头砍倒，然后整棵运输到锯木厂，之后再切割成易于处理的尺寸。这需要将沉重的木材运送到数英里之外。斯蒂尔在一个小作坊里工作，于
  1926 年设计并制造了世界上第一台电链锯——一款重达 140 磅、需要两人操作的“横切链锯”。1929 年，他推出了公司第一款汽油动力链锯。尽管该锯仍需要两人操作，但其便携性彻底改变了木材产品行业。


  正是在这一时期，斯蒂尔个性中的某个特定方面确保了公司战后数十年的成功，并最终保护公司免受大众市场零售商的冲击：斯蒂尔真正信奉服务客户。公司培训员工指导购买者如何使用和维护从公司购买的产品。此外，公司坚持认为，任何销售斯蒂尔产品的人都必须具备维修和保养这些产品的能力。一位早期员工曾表示：“不经过教学、帮助，并在日后为用户提供良好服务，就把锯子卖给他们是不行的。”


  与任何创新一样，链锯也有不少批评者。伐木工人担心新技术会让他们失业，因此强烈反对这项新技术，甚至攻击斯蒂尔的销售人员。斯蒂尔通过教育和培训来应对这种反对。1937
  年，他在德国各地的伐木营地引入了链锯培训课程，并在 1939 年访问美国期间，举办了动力锯技术研讨会。这些努力被用来克服阻力，并向潜在客户介绍他的革命性新产品。


  ***《客户陷阱》*** 77


  链锯培训是一项旷日持久的事务，今天我们很难想象。公司编写的一份历史资料提供了 1939 年的如下记述：


  > 位于黑森林地区巴特利本采尔附近健康疗养地朗根布兰德的居民们感到非常惊讶，当时大约有十台链锯在奥克森酒店的院子里噼啪作响地启动。对于教练员来说，看到地区林务官们带着他们的首席伐木工和森林工人练习启动链锯，有时甚至把油门开得过大，这真是一场视觉盛宴。在第一次练习（即启动和横切）中，发生了一两件非常有趣的插曲，这表明这些男人其实童心未泯。

  >

  > 从课程第二天起，参与者们一路唱着歌走进森林，在那里他们可以想练习多久就练习多久。在这个过程中，有些人如此投入，以至于忘记了他们的同事也想尝试一下机器并学点东西。

  >

  > 负责的首席林务官每天骑着马高昂着头来到森林，将这些课程参与者置于他的羽翼之下并照顾他们。课程继续以讲座、讲解和实践工作进行，直到周五晚上在节日般的氛围中庆祝其圆满结束。国家首席林务官埃弗斯先生和斯蒂尔先生以及公司的几位先生加入了他们，在谈论工作、讲笑话和喝啤酒的过程中，为更多链锯培训课程奠定了基础。值得一提的是，还宰杀了两头猪。



