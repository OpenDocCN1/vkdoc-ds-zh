- "# 第 X 章\n\n## 保持本地化与独立性\n\n*跳出大框架思考。* ——「独立我们挺」组织\n\n遵循「10%法则」并避开顾客陷阱，需要高度的自律和觉察力。当主流观念似乎不可逆转地倾向于规模化与效率时，坚守自己的立场就变得更加困难。每个在\
  \ 1970 年代（或更早）成长起来的人，都记得人们曾如何吹嘘自己为某样东西花了多少钱。为一件产品支付更多费用，意味着购买到了更高品质的商品。这是一种人们会炫耀的身份象征。现在不同了。多年来，吹嘘的资本已经转向了那些买到好价格、获得惊人折扣、做成划算交易的人。\n\
  \n这种文化转变部分是由成本压缩型「大客户」的崛起所驱动的。显然，寻找大客户的诱惑几乎是不可抗拒的。毕竟，大客户存在于经济的各个领域。它们为购买其产品和服务的企业带来了大量订单的希望。\n\
  \n近年来，美国许多花店都经历了一场风暴。包括 `FTD`、`1-800-Flowers.com` 和 `Teleflora` 在内的电商分销商的兴起，重塑了行业格局。这些服务越来越成为越来越多本地花店的大客户。花店老板最初将这些新的销售渠道视为接触那些原本不会知道他们的顾客的机会。\n\
  \n### 第十章 | 保持本地化与独立性\n\n这似乎是快速增加营业额的绝佳方式。当然，正如我们所见，一切皆有代价。\n\n花店需要为每笔订单支付大约 25%的佣金和营销费用给其中一家在线大客户，外加每月约\
  \ 200 美元的会员费。店主可以拒绝订单或要求更高的价格。然而，拒绝订单会带来另一项隐性成本，通常在 10 到 100 美元之间。\n\n加利福尼亚州大教堂城的花店老板大卫·罗尔（David\
  \ Rohr）从一开始就知道与大客户打交道的成本太高了。他在 2002 年情人节后退出了 Teleflora，因为那天由于业务成本和网络费用超过了他的配送订单收入，他损失了超过\
  \ 2000 美元。\n\n「我能获得新客户，但你赚不到钱。他们（大客户）赚走了所有的钱。」罗尔说。1\n\n据亚特兰大郊外的花店老板贝琪·霍尔（Betsy Hall）说，更糟糕的是那些通过大客户订购鲜花的人的遭遇。霍尔表示，主要电商网站上的照片具有误导性，并指出花束看起来比实际更饱满。她还说，使用电商网站的顾客花费更多，得到的却更少，而如果他们直接联系想要配送鲜花所在城市的本地花店，情况会好得多。2\n\
  \n#### 战斗已然打响\n\n面对大客户在各个行业的冲击，过去十年间涌现出一个伟大的商业故事：对加剧顾客陷阱形成的行业整合的反抗日益高涨。「本地购买」及其他独立运动获得了力量和动力——为创新者提供了可行且盈利的渠道，用以控制其产品的销售与分销。\n\
  \n美国历史最悠久的倡导「本地化是未来方向」这一原则的组织之一是地方自力更生研究所（ILSR）。ILSR 认为，全球化本身并不具有进步性或必然性。\n\n\n\n\
  #### 顾客陷阱 151\n\n以人性化规模机构为表现形式的地方主义和区域主义，能够促进社区发展并提升生活质量。\n\n`ILSR` 反对“规模越大越好，将生产者与消费者、银行家与储户及贷款人、工人与所有者分离，是现代经济发展不可避免的结果”这一普遍观点。3\
  \ 令人惊讶的是，几乎没有什么证据支持这种传统观念。相反，地方经济有潜力变得高效且充满活力。\n\n1997 年，大卫·博尔杜克和杰夫·米尔钦决定挑战“巨头企业及其伴随的功能失调是现代生活中不可避免的常态”这一普遍看法。他们与其他企业主及关心此事的市民合作，制定了一项策略，旨在帮助社区保护本地企业并促进创业精神。如今，美国独立商业联盟（`AMIBA`）协助社区组织支持本地商业的活动，例如“支持独立商家，购买本地产品”活动、支持本地商业的公共政策倡议以及其他帮助本地企业的工作。4\n\
  \n“我们独立”（`IWS`）是另一个致力于强化本地企业的组织。认识到许多人更倾向于购买本地生产的产品，`IWS` 帮助消费者与本地商品和服务的来源建立联系。通过这种方式，`IWS`\
  \ 促进了地方经济发展，并让公司利润首先在产生收入的城镇中发挥作用。5 这些组织——以及许多其他组织——正站在挑战现状的最前线。它们还以清晰、明确的洞察力证明，当前美国的商业模式不仅功能失调，而且不可持续。\n\
  \n#### 一个正在消亡的理念\n\n尽管在当前体系中巨头企业看似势不可挡地崛起，但裂痕已经开始显现。试想，当公民开始要求更好的生活条件时，低工资地区的成本正在上升。\n\
  \n中国已不再是许多人曾经认为的制造业万能药。尽管中国经济增长放缓，但自 2005 年以来，劳动力成本几乎翻了一番。此外，环境的持续恶化对于任何到访该国的人来说都显而易见。大多数城市的空气污染严重到无法呼吸，许多地方的水也致命到无法饮用。\n\
  \n## 第 10 章 | 保持本地化与独立性\n\n位于中国南方的福恩纺织厂（Faun Textile mill）占全球供应量的 6%，是世界上最大的针织棉生产商。该厂坐落在一个占地\
  \ 230 英亩的园区内，过去 25 年来一直生产用于廉价牛仔裤、运动鞋和 T 恤的面料，供应给包括沃尔玛、塔吉特、埃迪·鲍尔、耐克和兰兹恩德在内的数十家美国零售商。拥有该厂的是香港公司福源集团控股有限公司（Fountain\
  \ Set Holdings），该公司主要致力于生产用于 T 恤和运动衫的柔软弹性棉。\n\n\n\n#### 工厂的故事\n\n通常，Megas 与 Fountain\
  \ Set 合作确定颜色和季节性面料款式，尽管他们通常通过第三方购买该公司的产品，第三方将材料加工成服装。\n\n2006 年夏天，在 Faun Textile\
  \ 工厂所在的城市东莞，人们注意到流经城市的 Mao Zhou 河变成了血红色。当地官员的调查发现，工厂地板下埋藏的一根管道每天向河中倾倒约 22,000 吨污水。虽然这在东莞引起了关注，但在下游地区却少有人关心，在那里，来自数百家制造工厂的径流形成了一条又厚又油的污泥河，河面上覆盖着塑料袋、电线、鞋子和其他物品。在\
  \ Faun Textile 工厂下游工作的小商人 Li Changlin 说：“我们过去常从这条河里捞鱼和龙虾……我们在里面游泳。河岸上长满了绿色植物，水很清澈。1989\
  \ 年之后，工厂来了，水变黑了。”6 不幸的是，Faun Textile 工厂事件和受污染的 Mao Zhou 河在中国并非孤立事件。相反，这个世界上最大的国家也是污染最严重的国家之一。\n\
  \n多年来，中国公民抗议环境破坏。就在最近，共产党开始倾听。2013 年，中国环境保护部发起了一场全国性的清理运动，以解决该国糟糕的空气质量问题。到 2015\
  \ 年，空气质量略有改善，在包括二氧化硫水平在内的一系列污染标准中，74 个大城市中只有 8 个达到了国家标准。7 然而，尽管进展缓慢，但很难想象中国会倒退到由无节制的工业扩张驱动的肆意破坏状态。\n\
  \n随着离岸外包的经济优势逐渐减弱，制造业将不可避免地回归美国，而且必须回归。一位前纽柯公司（Nucor）CEO 在他的书《美国制造：为什么制造产品将让我们重归伟大》（*American\
  \ Made: Why Making Things Will Return Us to Greatness*）中写道，到 2025 年，我们需要创造 3000\
  \ 万个就业岗位才能扭转当前的失业状况。他说，如果“数百万大学毕业生在卖快餐或卖中国制造的网球鞋”，或者为华尔街“恶意交易室资本主义”做贡献，这种情况就不会发生。8\n\
  \n#### 回顾历史\n\n跨行业部门的 Megas 崛起与美国商业历史的绝大部分并不吻合。美国一直是小企业主的堡垒。即使今天 Megas 暂时占据主导地位，统计数据也证明了这一点：\n\
  \n*   从 1997 年到 2014 年，小企业占经济中所有净新增就业岗位的 65%。\n*   如今，小企业雇用了近 8000 万美国人——超过该国总人口的四分之一！\n\
  *   拥有成功独立商业区的住宅社区，其房屋价值平均比 Megas 主导的市场高出 50%。\n*   独立零售商每美元销售额的回报率是连锁竞争对手的三倍多。\n\
  *   独立餐厅的回报率是连锁餐厅的两倍多。\n\n\n\n#### 每美元销售额对当地经济的贡献高于全国连锁餐厅。\n\n- 本地企业每占用一平方英尺空间，当地经济可获得\
  \ `$179` 收益，而连锁店仅为 `$105`。9\n\n像新奥尔良地区第三代零售商迈克·马西这样的人，经营着特色户外用品连锁店，他们正加入日益壮大的小企业主反击浪潮。对大型企业的掠夺本质及其压榨供应商的“赫赫有名”的能力深感失望后，马西与朋友们决定为制造商开辟另一条接触终端用户的途径。这个平台名为\
  \ [Locally.com](http://locally.com/)。\n\n8 丹·迪米科，《我们建造了它》，《华尔街日报》，(2015 年 3 月 4\
  \ 日)，A11 版。\n\n9 资料来源：小企业管理局；Intuit 小企业创新研究；美国运通 OPEN 独立零售指数；市政经济学/美国书商协会，美国劳工部。\n\
  \n## 第 10 章 | 保持本地化与独立\n\n马西说他们意识到：“实体店缺乏线上存在感，购物者无法通过联网设备探索本地商店，制造商也希望其产品系列能由专业人士提供服务。”10\n\
  \n[Locally.com](http://locally.com/) 不直接销售产品。它通过向零售商和供应商收取小额月费，促进制造商、买家与本地店铺之间的关系。该平台利用正在申请专利的技术，直接聚合最优品牌的商品目录及本地商家的库存信息，将强大的网络工具与本地专业知识和基础设施相结合，为购物者提供线上线下所有可能的购买选择。用户进入网站时，[Locally.com](http://locally.com/)\
  \ 会自动定位其地理位置，并据此构建包含本地及附近产品、以及可从在线合作伙伴处购买的额外产品的市场。他们的信条是：“我们不销售产品；我们促进发现。”随着越来越多零售商和供应商每月加入，寻求聚焦核心客户并掌控业务，这一理念似乎正获得广泛认可。\n\
  \n#### 小即是美\n\n陷入“客户陷阱”的一个重要原因在于效率方法的误用。错误的观念认为规模经济最终能弥补客户服务方面的任何缺陷或失误：规模确实重要——而且越大越好。但正如我们所看到的，事实并非如此。\n\
  \n2008 年，乔什·内布莱特大学毕业后不久，创立了在线零售网站 `GreenCupboards`（现名为 `etailz`）。11 这一业务源于他在大学课程中，在导师、连续创业者汤姆·辛普森的指导下制定的商业计划。创业头六个月，这家小型初创企业销售额为\
  \ `$5,000`；销量最高的产品是马桶清洁剂。到 2013 年，`etailz` 的销售额达到 `$2400` 万美元，成为美国增长最快的私营企业之一。\n\
  \n10 作者采访，2014 年 10 月 25 日。\n\n11 关于 etailz 的资料基于 2014 年 11 月 21 日对乔什·内布莱特的采访，以及\
  \ 2015 年 1 月 6 日对汤姆·辛普森的采访。\n\n#### 客户陷阱 第 155 页\n\n这家总部位于斯波坎的初创公司成功与 [Amazon.com](http://amazon.com/)\
  \ 合作，利用大型企业的营销和物流渠道拓展品牌。我们认为乔什（大家都叫他乔什）已精通此道，但他也是第一个指出此策略需不断演变的人。起初，`etailz` 自营仓库并自行完成订单。然而，乔什很快意识到自己对仓储和包装并无兴趣。\n\
  \n\n\n以及库存配送。再加上他坚信亚马逊是全球最优秀的物流和履约运营企业，这让他轻松做出了外包给该公司的决定。\n\n“亚马逊与其他所有电商公司最大的区别，”他说道，“在于他们提供的两天免费配送服务精准无误。”他指出，亚马逊很少出现“货物没送到”这类失误，这确实让它脱颖而出。\n\
  \n当被问及`etailz`如何与亚马逊网站对接时，乔什表示，人们常常在亚马逊上购物时，并未意识到自己真正的卖家是谁。顾客看到那个小小的“加入购物车”按钮（即“购买框”），就以为商品来自亚马逊。乔什解释道：\n\
  \n> 很多时候，同一个商品列表里可能有上百个卖家在销售同一件商品。很多时候，你其实是从不同的商家那里购买。我们的定位是去寻找并挖掘那些有趣、酷炫、独特的商品，然后切入其中。我们对我们称之为“归零竞赛”的模式并不感兴趣。那是指一百家公司卖同一件商品，你们会陷入归零竞赛。谁赚得最少，谁就赢。这不是我们真正想参与的游戏。相反，我们依靠的是效率。我们的增长是由技术驱动的；我们非常痴迷于开发自有软件，并痴迷于如何把事情做得更好、更快、更高效。我们识别机会、建立合作关系、订货、补货的整个流程——所有这些环节，作为一个完整的、精简的流程——是帮助我们脱颖而出的关键因素之一。我们非常高效。\n\
  \n乔什指出，有传闻说，有朝一日通过亚马逊销售的商家将变得极度高效，以至于这家电商巨头可能彻底退出直接零售业务。他表示：“我相信情况有可能朝这个方向发展，因为每次我们卖出东西，亚马逊需要做多少工作？基本上什么也不用做。”`etailz`利用了亚马逊庞大客户群所引发的关键规模效应。每次促成一笔`etailz`的交易，这家电商巨头只承担极其有限的边际成本。例如，假设亚马逊收取\
  \ 10%的佣金，那么`etailz`完成一笔`$100`的销售，亚马逊几乎无需费力就能赚到`$10`。乔什说：“我们可以说，这种模式比亚马逊自己的零售模式利润更高。我认为他们正在评估哪种商业模式对他们更有利。”\n\
  \n乔什·内布利特并不担心“顾客陷阱”。当被问及亚马逊是否会挤压`etailz`时，他毫不犹豫地回答：“他们当然能！”然后解释道：\n\n> 他们有能力这样做，但会失去大量信任。回顾历史上的企业，比如\
  \ IBM、微软等，它们都会经历一个阶段，觉得自己是世界的王者、不可动摇、不会犯错，但后来总有人会进来抢占它们的市场份额。我认为目前还没有谁能接近亚马逊，但终有一天会出现，可能是\
  \ eBay、阿里巴巴，或者其他公司。无论是谁，我们都已做好充分准备，不断调整并评估所有现存的机遇。我的意思是，如果亚马逊真那么做，我们会另寻出路。而且，我们已经发展到足够规模，拥有了灵活性和议价能力，而早期我们并没有这种筹码。\n\
  \n`etailz`的战略聚焦于其供应商。该公司一直在寻找具有市场潜力的优质产品。汤姆·辛普森解释道：“我们非常擅长的一件事就是‘首发市场’策略。我们寻找那些可能在《今日美国》上有过报道，或者上过《创智赢家》节目的产品。我们寻找的是人们为之喝彩的新想法或新产品。”\n\
  \n\n\n有些产品虽然听起来很酷，但其制造商根本没有建立起有效的分销渠道。我们会联系这些公司，告诉他们如何优化网络销售。\n\n在招募到拥有独特且有趣产品的供应商后，etailz\
  \ 会专注于为他们创造价值。乔什表示：“我们的看法是，将传统零售意义上对客户的执着，同样应用到供应商身上。”他指出，像亚马逊、Zappos 和 eBay 这样的企业总是谈论他们对客户的执着。etailz\
  \ 同样关注消费者，但也执着于供应商，以及如何为他们增值。他问道：“你能做些什么来帮助扩大供应商的‘蛋糕’？”接着自问自答：“这并不总是关于卖出更多产品。”汤姆补充道：“当他们只与我们进行线上合作时，我们可以优化他们的销售。如果你有独特的产品，并且只与我们合作，你的产品就会以统一的声音呈现。没有不一致、价格变动或服务差异。关键在于，我们会确保你的品牌通过我们得到提升，而不是通过\
  \ 15、20 或 100 个像我们这样的其他商家。”\n\n这种需要供应商高度信任的合作模式，是在 etailz 与供应商共同优化产品在亚马逊上的展示时建立起来的，包括图片、描述、关键词、视频以及其他有助于供应商线上销售产品的营销努力。“这是我们为他们提供的增值服务之一，”辛普森说。此外，etailz\
  \ 尊重供应商的定价。他补充道：“如果他们规定售价不能低于 14.99 美元，我们就不会以更低的价格出售。许多其他公司可能不尊重供应商的定价，但我们做到了。而且，如果你有任何疑问、问题或麻烦，可以给我们打电话，接电话的是真人，而不是一封电子邮件。”\n\
  \n乔什指出，线上巨头们关注的是客户和客户的重要性，而 etailz 则在巨头和客户之间拥有非常高效的履约解决方案。结果是每个人都在互相帮助以实现最终目标。他将整个过程视为一种合作事业。对\
  \ etailz 而言，将供应商视作客户是一种自然的演变。在听到供应商抱怨他们与分销商打交道时遇到的问题——比如未按时收到付款、客服体验差——之后，公司开始通过将供应商当作客户来对待，以解决他们所谓的“痛点”。乔什说：“我不确定我们的‘顿悟时刻’是什么时候。我想说，这种认识和重视大概是近两年的事。自从我们这么做以来，它帮助我们实现了指数级增长。”etailz\
  \ 从大到小各个方面都践行着这种“供应商即客户”的策略。例如，当公司代表与供应商共进晚餐时，他们会主动买单，就像对待客户一样。乔什说这是一个小举动，但却传达出公司对供应商的宽厚态度。其结果是更好的绩效表现：\n\
  \n> 我们获得了改善的关系；得到了他们团队更好的支持。在如何帮助他们品牌成长方面有了更好的合作。如果制造商和零售商之间有良好的协作，你们就能创造出一些特别的东西。我认为这是最大的重点，沟通变得更加开放和透明。总的来说，它创造了一种历史上在零售-制造商关系中不存在的、更双赢的动态局面。\n\
  \n前程似锦，前所未有\n\n在撰写本书的过程中，我们与乔什·内布利特及其合伙人汤姆·辛普森这样的人相处了很长时间。他们对未来的热情具有感染力。他们认为世界充满了机遇，而机遇是由激进的技术变革所驱动。旧规则已不再适用于他们。然而，他们是理性的乐观主义者。数据的获取正在以前所未有的方式赋能创业者和创新者，这种程度甚至在十年前我们都无法想象。\n\
  \n\n\n#### 钱德兰·桑卡兰论商业民主化\n\nZyme Solutions 的钱德兰·桑卡兰经常谈到商业的“民主化”。在这种环境中，信息透明度占据主导地位，将想法转化为可行企业比以往任何时候都更加容易。产品和服务进入市场的途径比我们所见过的任何时期都更加开放和清晰。如今，创业被广泛视为一种明智的人生选择，而不仅仅是一种爱好。在这个新世界中取得成功所需的许多条件，在于我们改变与最佳客户和供应商打交道的方式。那些傲慢自大、主导着较小风险承担者创新的大型巨头客户时代，正在走向终结。\n\
  \n#### 最后的思考\n\n2008 年，“西部服饰教父”杰克·韦尔去世。韦尔先生是牛仔衬衫的发明者。正是他将那些按扣装在了西部服装上，确保牛仔们不会被仙人掌、山艾树或公牛的角钩住。他还添加了其他装饰，包括锯齿状的口袋盖、突出宽肩的修身剪裁，以及展现牛仔肌肉线条的紧致接缝。\n\
  \n韦尔先生通过其位于丹佛的 Rockmount Ranch Wear 公司制造并销售他的衬衫。这些衬衫在美国本土生产。对他来说，将生产外包给中国或其他低成本市场的想法是不可思议的。他在《经济学人》上的讣告写道：\n\
  \n> 在漫长的一生中，韦尔先生积累了大量的朴素商业智慧。他认识 J.C. Penney，并认为他很精明。李维·斯特劳斯是个好人，但变得过于自大；沃尔玛创始人山姆·沃尔顿是个“乡下杂种……”\n\
  >\n> 沃尔顿不断纠缠他，希望他为沃尔玛供应衬衫，但韦尔先生从不希望任何客户占据其业务份额的 5%以上。他觉得那样会失去控制权，并且他总体上认为折扣零售商是低级之辈。对他来说，重要的是两件事：品质和了解客户。12\n\
  \n看来韦尔先生凭直觉理解了“客户陷阱”的危险。我们只能希望其他创新者和企业家能同样分享他的见解，认识到控制销售和分销是实现长期盈利和成功的基础。\n\n##\
