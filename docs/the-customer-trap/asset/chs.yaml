  \n成功打入大众市场给合伙人带来了几个新的挑战。首先，他们传统的“命脉零售账户”的管理者们得知给予大客户优惠定价后感到沮丧，因为他们此前一直以超过 7 美元的高价销售这款笔。其次，沃尔玛的铺货引发了其他大众零售商的进货需求。例如，七月中旬，美国药店连锁`Walgreens`来电要求提供\
