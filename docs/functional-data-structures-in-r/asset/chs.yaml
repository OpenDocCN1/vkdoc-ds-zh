  \ R 编程语言中，数据是不可变的。你无法更改现有数据。那些用于修改数据结构、为算法编程提供高效构建模块的技术无法使用。\n\n对此有一些变通方法。R 并非纯函数式语言，我们可以通过修改环境来改变变量-值的绑定。我们可以利用这一点来模拟指针，并以此实现传统数据结构；或者，我们可以放弃纯\
  \ R 编程，用 `C`/`C++` 实现数据结构，并编写一些包装代码，以便在 R 程序中使用它们。这两种解决方案都允许我们使用传统数据结构，但前者会生成非常非传统的\
  \ R 代码，而后者对于不熟悉 R 以外语言的人来说则毫无用处。\n\n不过，好消息是，如果我们愿意放弃传统数据结构，就不必在实现数据结构时摒弃 R。存在一些数据结构，我们可以通过构建其新版本而非修改它们来进行操作。这些数据结构，即所谓的*函数式数据结构*，与你可能了解的传统数据结构有所不同，但如果你计划在诸如\
  \ R 这样的函数式语言中进行严肃的算法编程，它们值得了解。\n\n并非所有你习惯的数据结构都有现成的替代品，至少在操作运行时性能上未必相同，但你常用的抽象数据结构很可能都有相应的实现。然而，在某些情况下，使用函数式数据结构取代传统数据结构可能会牺牲一点效率，这时你需要考虑：为了获得额外的速度，是否值得花费更多时间去用冷僻的\
  \ R 方法或完全不同的语言来实现数据结构。\n\n速度问题始终存在一个权衡。提速究竟值得投入多少编程时间？如果你使用 R 进行编程，那么很可能你更看重程序员的时间而非计算机的时间。R\
  \ 是一种高级语言，与大多数其他语言相比相对较慢。提供更高表达力需要付出代价。当你选择使用 R 时，你就接受了这一点。在选择函数式数据结构而非传统数据结构时，你可能也需要做出同样的选择；或者你可能会得出结论，确实需要额外的速度，因此选择花费更多时间编程，以便在分析时节省时间。只有你才能根据自己的情况做出正确选择。你需要了解所有可行的选择，以便在无法修改数据时能够处理数据结构。\n\
