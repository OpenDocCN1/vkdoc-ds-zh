  np.random.seed(0)

  X, y = datasets.make_moons(200, noise=0.20)

  ```


  你可以绘制数据图来查看生成的内容。


  ```

  plt.scatter(X[:,0], X[:,1], s=40, c=y, cmap=plt.cm.Spectral)

  ```


  我建议我们训练一个逻辑回归分类器来输入特征。


