  ## 数据仓库工具


  数据仓库是一种高度专业化的数据存储技术，由丹·林斯泰特设计。数据仓库是一组面向细节、追踪历史且唯一关联的规范化表，支持一个或多个业务功能领域。它是一种混合方法，结合了第三范式（3NF）和星型模式的最佳实践。我将在第
  9 章中详细讨论此配置的使用。图 5-2 展示了一个基本示例。


  ![A435693_1_En_5_Fig2_HTML.jpg](img/A435693_1_En_5_Fig2_HTML.jpg)


