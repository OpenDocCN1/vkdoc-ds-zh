  \ `Assess-DAG-Schedule.gml` 的图形数据文件。\n\n> **提示**\n> \n> 您可以使用文本编辑器查看 GML 格式。我经常用它来查找图的错误。\n\
  \n如果您用文本编辑器打开该文件，可以看到它生成的格式。这种格式简单但有效。\n\n这是一个邮政编码节点：\n\n```\nnode [\nid 327\nlabel\
  \ \"Munich-80331-DE\"\nroutertype \"PostCode\"\ngroup0 \"DE\"\ngroup1 \"Munich\"\
  \ngroup2 \"80331\"\n]\n```\n\n这是一个 GPS 节点：\n\n```\nnode [\nid 328\nlabel \"48.1345\
  \ N-11.571 E\"\nroutertype \"GPS\"\ngroup0 \"DE\"\ngroup1 \"Munich\"\ngroup2 \"\
  80331\"\nsLatitude \"48.1345 N\"\nsLongitude \"11.571 E\"\nnLatitude 48.134500000000003\n\
  nLongitude 11.571\n]\n```\n\n这是一条连接两个节点的边：\n\n```\nedge [\nsource 327\ntarget 328\n\
  ]\n```\n\n此转换到图形数据结构现在已经验证了全面的 IP 结构，方法是消除由不同规则或基础数据中的任何重复条目创建的任何重复节点或边。当有多个系统向同一系统加载请求时，这种自然的去重功能非常有用。\n\
  \n例如：两个运输代理可以请求一辆卡车将两个不同的箱子从地点 A 运送到地点 B。在卡车离开之前，物流程序将创建一个运输图，然后发送一辆卡车运送这两个箱子。\n\
  \n我已经证明了这在较小的 IP 核心数据上是可行的。现在，我们可以将其应用于更大的 IP 数据集 `Retrieve_IP_DATA.csv`。\n\n考虑到更大数据集的范围，我建议我们通过更改输入和导出源设计来包含\
  \ SQLite 数据库，以协助解决数据处理问题，从而处理这些数据。作为一名数据科学家，您应该不断探索可用的工具，以提高解决方案的有效性和效率。我将引导您完成以下处理模式，使您能够理解我如何利用数据库引擎的优势来解决更大数据集完成某些关系所需的复杂性。我们将把图数据结构的处理能力与\
  \ SQLite 数据库的处理能力结合起来。\n\n> **警告**\n> \n> 如果您的系统上尚未使用 SQLite，则必须安装它。请参阅 [`www.sqlite.org`](http://www.sqlite.org)\
  \ 了解如何实现此安装的详细信息。您可以通过使用 sqlite3 版本来检查安装。如果得到 `3.20.x` 的结果，您就可以继续了。确保您也安装了 python\
  \ SQLite 库。在您的 IPython 控制台中执行 `import SQLite`。如果这不起作用，请执行库安装。\n\n打开您的 Python 编辑器，并在目录\
  \ `C:\\VKHCG\\01-Vermeulen\\02-Assess` 中创建一个名为 `Retrieve-IP_2_SQLite_2_DAG.py` 的文件。现在将以下代码复制到该文件中：\n\
  \n```\n################################################################\n# -*- coding:\
  \ utf-8 -*-\n################################################################\n\
  import networkx as nx\nimport sys\nimport os\nimport sqlite3 as sq\nimport pandas\
  \ as pd\n################################################################\nif sys.platform\
  \ == 'linux':\nBase=os.path.expanduser('~') + 'VKHCG'\nelse:\nBase='C:/VKHCG'\n\
