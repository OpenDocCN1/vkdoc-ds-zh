  ### TensorFlow


  `TensorFlow` 是一个利用数据流图进行数值计算的开源软件库。图中的节点代表数学运算，而图的边则代表节点间传递的多维数据数组（张量）。其灵活的架构允许你将计算部署到一个或多个
  CPU 或 GPU 上。


  `TensorFlow` 最初由谷歌机器智能研究组织内 Google Brain 团队的研究人员和工程师开发，旨在进行机器学习和深度神经网络研究，但该系统通用性足够强，也适用于其他众多领域。


  我将通过几个示例来向你展示其能力。我有几个使用了该生态系统的安装实例，它在数据科学社区中日益流行。


  要使用它，你需要一个名为 `tensorflow` 的库。你可以通过 `conda install -c conda-forge tensorflow` 来安装它。关于该库的详细信息，请访问
  [`www.tensorflow.org`](http://www.tensorflow.org)。


  下一个巨大优势是云张量处理单元（`TPU`，[`https://cloud.google.com/tpu/`](https://cloud.google.com/tpu/)）硬件产品，它是专门设计的，能以比标准
  CPU 或 GPU 硬件更优的性能水平来计算张量处理。`TPU` 凭借极其高效的硬件生态系统来支持 `TensorFlow` 流程。`TensorFlow Research
  Cloud` 为用户提供了访问这些第二代云 `TPU` 的权限，每个 `TPU` 可提供 180 teraflops 的机器学习加速能力。


  **注**：我使用 [`www.tensorflow.org/tfrc/`](http://www.tensorflow.org/tfrc/) 上的开放研究平台来测试我拥有的任何新模型，它提供了一个出色的研发生态系统。我建议你为自己的生态研究一下这个平台。


