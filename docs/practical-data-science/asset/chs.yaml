  这些工具重新组织数据库表和视图中的索引。当您的数据湖以海量且高速的方式增长时，这是一个重要的运维流程。数据类型的多样性也增加了将索引应用于复杂数据结构的难度。我将在第
  6 至 11 章中讨论具体的重建工具。


