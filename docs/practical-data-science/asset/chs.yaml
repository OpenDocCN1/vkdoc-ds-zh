  ### 有序逻辑回归


  有序逻辑回归是二项逻辑回归的一种类型。有序回归用于预测具有有序多类别和自变量的因变量。换句话说，它用于促进因变量（具有多个有序级别）与一个或多个自变量之间的交互作用。


  这种数据类型是极好的待处理数据集，因为你已经知道数据条目之间存在关联关系。部署转换步骤的算法将让你深入了解这种关联关系对数据发现过程的支持强度是强还是弱。




