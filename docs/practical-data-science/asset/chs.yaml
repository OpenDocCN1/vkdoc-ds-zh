  \ 11 章。\n\n# 11. 组织与报告超级步骤\n\n本章首先介绍**组织**超级步骤，然后进入**报告**超级步骤。这两部分将帮助你（作为数据科学家）首先从你准备好的数据仓库中收集相关信息，以满足特定客户决策者群体的需求。例如，你将使用同一个数据仓库向首席财务官\
  \ (CFO) 和苏格兰威克镇的会计师报告，但 CFO 将收到一个包含所有地区详细视图的概览，而威克镇的会计师则只会看到与威克相关的详细信息。这被称为将数据组织成一个更小的数据结构，称为`数据集市`。\n\
  \n本章的第二部分将介绍各种报告技术，你可以使用这些技术为不同的客户可视化数据。我将讨论每种技术的用途，并提供各个报告技术的示例。\n\n那么，让我们开始将数据仓库中的数据组织成数据集市。\n\
  \n## 组织超级步骤\n\n**组织**超级步骤将你在 **Transform** 超级步骤结束时构建的完整数据仓库进行细分，形成面向特定业务的数据集市。数据集市是数据仓库环境的访问层，旨在向用户公开数据。数据集市是数据仓库的一个子集，通常面向特定的业务部门。\n\
  \n我在本书中引用的任何源代码或其他补充材料，读者都可以通过本书的产品页面（位于 [`www.apress.com/9781484230534`](http://www.apress.com/9781484230534)）在\
  \ GitHub 上获取。请注意，此源代码假定你已经完成了第 2 章中概述的源代码设置。\n\n\n\n### 水平样式\n\n对数据仓库进行水平样式切片或子集化，是通过应用一种过滤技术实现的，该技术强制数据仓库仅显示针对数据总体的、预先选定的一组过滤结果的数据。水平样式切片从总体中选择行的子集，同时保留各列。也就是说，数据科学工具可以查看到子集记录中每条记录的完整信息。\n\
