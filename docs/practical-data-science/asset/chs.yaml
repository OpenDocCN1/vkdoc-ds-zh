  print('################################')\n################################################################\n\
  sDatabaseName=Base + '/01-Vermeulen/00-RawData/SQLite/vermeulen.db'\nconn = sq.connect(sDatabaseName)\n\
  ################################################################\nsFileName=Base\
  \ + '/01-Vermeulen/01-Retrieve/01-EDS/02-Python/Retrieve_IP_DATA.csv'\nsOutputFileName='Assess-DAG-Schedule-All.csv'\n\
  Company='01-Vermeulen'\n```\n\n现在，我们将基础数据作为 `pandas` 数据结构加载到内存中，然后使用 `df.tosql()`\
  \ 命令将其存储到 SQLite 数据库中。\n\n```\n################################################################\n\
  print('Loading :',sFileName)\nIP_DATA_ALL=pd.read_csv(sFileName,header=0,low_memory=False,\
  \ encoding=\"latin-1\")\nIP_DATA_ALL.index.names = ['RowIDCSV']\nIP_DATA_ALL.rename(columns={'Place.Name':\
  \ 'PlaceName'}, inplace=True)\nIP_DATA_ALL.rename(columns={'Post.Code': 'PostCode'},\
  \ inplace=True)\n#print(IP_DATA_ALL)\nprint('################')\nsTable='Assess_IP_DATA'\n\
  print('Storing:',sDatabaseName,'Table:',sTable)\nIP_DATA_ALL.to_sql(sTable, conn,\
  \ if_exists=\"replace\")\nprint('################')\n```\n\n我们使用 `G=nx.Graph()`\
  \ 创建一个无向图。\n\n```\n################################################################\n\
  G=nx.Graph()\n################################################################\n\
  ```\n\n现在，我们从 SQLite 创建已加载数据的一个子集，以匹配您所需的格式。\n\n> **提示**\n> \n> 这种将处理任务卸载到第三方处理引擎的方式，使您能够连接到核心资源（例如数据库），然后执行复杂的连接和更繁重的处理。我通常也会通过\
  \ DSE Graph 以相同的方式卸载我的图处理，以增强更复杂的图。\n> \n> 能够成功卸载复杂的数据处理是数据科学家应该具备的一项好技能。\n\n> **注意**\n\
  > \n> 我可以使用像树莓派 3 这样的小型计算机来驱动我的集群，轻松执行大规模处理任务。\n\n那么，让我们重新开始我们的例子。您必须从一个包含重复数据的数据集返回不重复的国家列表。我建议您使用\
  \ `SQL DISTINCT` 命令，通过 SQLite 数据引擎来执行此任务。\n\n```\nprint('################')\nsTable\
  \ = 'Assess_IP_DATA'\nprint('Loading:',sDatabaseName,'Table:',sTable)\nsSQL=\"select\
  \ distinct\"\nsSQL=sSQL+ \"A.Country,\"\nsSQL=sSQL+ \"A.Country AS NodeName,\"\n\
  sSQL=sSQL+ \"A.Country AS GroupName0,\"\nsSQL=sSQL+ \"'Country-Router' AS RouterType\"\
  \nsSQL=sSQL+ \"from\"\nsSQL=sSQL+ \"Assess_IP_DATA as A\"\nsSQL=sSQL+ \"ORDER BY\
  \ A.Country;\"\nCompanyData=pd.read_sql_query(sSQL, conn)\nprint('################')\n\
  ```\n\n您现在在 `CompanyData` 中有了不重复的国家列表。干得好。\n\n您现在需要将这些节点添加到您之前创建的图中。您之前已经完成过这个任务，所以只需遵循以下代码：\n\
  \n```\nfor i in range(CompanyData.shape[0]):\nsNode=str(CompanyData['NodeName'][i])\n\
  sRouterType=str(CompanyData['RouterType'][i])\nsGroupName0=str(CompanyData['GroupName0'][i])\n\
  G.add_node(sNode,\nroutertype=sRouterType,\ngroup0=sGroupName0)\nprint('################################')\n\
