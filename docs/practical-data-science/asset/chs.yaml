  \n## 报告超级步骤\n\n`报告`超级步骤是生态系统中的一个环节，它通过**讲故事**和**数据可视化**的艺术来提升数据科学成果的价值。你可以进行最优秀的数据科学分析，但如果你无法通过执行一个可靠且值得信赖的`报告`步骤，将数据科学转化为可操作的商业洞察，那么你就没有为你的业务带来任何优势。让我通过一个例子来指导你，展示你到目前为止从本书中学到的内容。\n\
  \n### 结果摘要\n\n任何分析中最重要的步骤就是结果摘要。你的数据科学技术和算法可以产生最严谨、最先进的数学或最具体的统计结果来满足需求，但如果你不能将这些结果总结成一个好的故事，你就没有达到你的要求。\n\
  \n#### 理解背景\n\n区分优秀数据科学家与顶尖数据科学家的，不是算法或数据工程，而是数据科学家将其发现应用于客户背景的能力。\n\n**示例：**\n\n\
  酒吧在 23:45 提供了最后一轮酒水，还剩一位客人。到 23:50 时，这位饮酒者杯中剩下的啤酒不到 5%。\n\n从饮酒者的背景来看，如果他必须赶午夜巴士，他要么喝得更慢以撑到午夜，要么立刻喝完剩下的酒。从酒吧员工的背景来看，他们想在\
  \ 23:45 关门，并且必须让这最后一位顾客离开才能锁门，因为他们也想赶午夜巴士。\n\n显然，如果你能确定双方是否都想赶午夜巴士，你就能理解饮酒者杯中啤酒量的背景。单纯的数据科学指标——杯中还剩\
  \ 5%——是毫无价值的。\n\n我曾有一位初级数据科学家试图利用啤酒厂闭路电视系统进行图像处理，来判断人们杯中啤酒的液位，以便让他的数据科学系统在夜间通知酒吧员工顾客的饮酒速度。其目的是在晚班时段多赚取\
  \ 3%的利润。\n\n但问题更为复杂，因为每晚都有几位当地的常客会在午夜后留下来，去赶对面公交枢纽在 12:30 之后新推出的有补贴的“安全驾驶”夜班车回家，这样他们就不用支付常规的公交车费。所以，他们喝酒的花费比回家的车费还少，而且还能免费乘车，前提是他们身上有酒味。\n\
  \n结果，啤酒厂不得不为三家酒吧的六名员工支付午夜后的双倍加班费，原因在于午夜过后，出于安全考虑，员工不能单独与顾客待在酒吧里。\n\n员工们总是很晚才回家，因为他们不符合慈善夜班车的资格，只能打车回家。直到啤酒厂向数据科学家提供了外部闭路电视录像，我们才发现了真正的问题所在。解决方案是：如果顾客在\
  \ 23:30 之前乘坐常规公交车，并在啤酒厂购买了啤酒，就为他们提供一张常规公交车票的优惠券。晚班总利润因此增加了 7.3%。不需要复杂的数据科学，只需要一些背景理解。\n\
  \n我见过太多数据科学家花费大量时间，用最复杂的算法得出优秀的结果，却无法以业务能理解的方式向业务方阐述他们的发现。甚至更糟的是，他们的结果无法投入生产，因为在更大规模上，这些结果根本不像数据科学家设计的那样有效——这使得整个工作从一开始就毫无意义。\n\
  \n**警告**\n\n经验告诉我，这是数据科学家成败的关键领域。始终要确定你结果的完整背景环境。理解结果背后的故事。\n\n#### 恰当的可视化\n\n一图胜千言，这句话没错。但在数据科学中，你只希望你的可视化传达一个故事：即你准备的数据科学发现。确保你的受众能清晰无误地接收到你最重要的信息，这一点至关重要。\n\
