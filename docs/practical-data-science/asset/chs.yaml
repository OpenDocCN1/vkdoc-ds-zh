  仅需这一条命令，我们便能应用文森特公式，并确保结果能以英里为单位进行支持。


  ```python

  BillboardVistorsData[''Distance'']=BillboardVistorsData.apply(lambda row:

  round(

  vincenty((row[''BillboardLatitude''],row[''BillboardLongitude'']),

