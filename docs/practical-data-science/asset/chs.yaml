  \ IP Number': 'First_IP_Number'}, inplace=True)\nIP_DATA_ALL.rename(columns={'Last\
  \ IP Number': 'Last_IP_Number'}, inplace=True)\nIP_DATA_ALL.rename(columns={'Post\
  \ Code': 'Post_Code'}, inplace=True)\n################################################################\n\
  sFileDir = Base + '/' + CompanyOut + '/01-Retrieve/01-EDS/02-Python'\nif not os.path.exists(sFileDir):\n\
  \    os.makedirs(sFileDir)\nvisitordata = IP_DATA_ALL.head(10000)\nprint('原始子数据框')\n\
  print('行数 :', visitordata.shape[0])\nprint('列数 :', visitordata.shape[1])\nprint(visitordata)\n\
  print('导出 XML')\nsXML = df2xml(visitordata)\nsFileName = sFileDir + '/' + OutputFileName\n\
  file_out = open(sFileName, 'wb')\nfile_out.write(sXML)\nfile_out.close()\nprint('存储\
  \ XML:', sFileName)\nxml_data = open(sFileName).read()\nunxmlrawdata = xml2df(xml_data)\n\
  print('原始 XML 数据框')\nprint('行数 :', unxmlrawdata.shape[0])\nprint('列数 :', unxmlrawdata.shape[1])\n\
  print(unxmlrawdata)\nunxmldata = unxmlrawdata.drop_duplicates(subset=None, keep=\"\
  first\", inplace=False)\nprint('去重后的 XML 数据框')\nprint('行数 :', unxmldata.shape[0])\n\
  print('列数 :', unxmldata.shape[1])\nprint(unxmldata)\n################################################################\n\
  # print('### 完成!! ############################################')\n################################################################\n\
