  \n你可以创建并加载 JSON 文件。这是你在与数据湖交互时会发现有用的另一项技能。\n\n\n\n#### 加载 GB_Postcode_Shops\n\n\
  以下数据集包含了所有商店的位置信息。首先，将 `GB_Postcodes_Shops.csv` 加载到 `Retrieve_GB_Postcodes_Shops.csv`\
  \ 中。\n\n我还将引导你创建并以 XML 格式读取五个商店的数据。我还将向你展示如何使用 `library(XML)` 生成文件 `Retrieve_GB_Postcodes_Shops.xml`。\n\
  \n**警告**\n\n我假设你了解 XML 数据格式。如果你不熟悉，请阅读下一段。\n\nXML 代表可扩展标记语言（EXtensible Markup Language）。XML\
  \ 是一种与 HTML 类似的标记语言，但 XML 用于在互联网上传输数据。它是一种使用标准 HTTP 技术传输数据的协议。\n\n**提示**\n\n生成 XML\
  \ 文件非常耗时，并且必须在数据湖生态系统中尽量少用。应尽快将其转换为更简洁、更不冗长的格式。\n\n创建一个新的 R 脚本文件，并将其保存为 `../VKHCG/03-Hillman/01-Retrieve/01-EDS/01-R`\
  \ 目录下的 `Retrieve-GB_Postcode_Shops.r`。\n\n```\n###########################################\n\
  rm(list=ls()) #will remove ALL objects\n###########################################\n\
  library(readr)\nlibrary(data.table)\n###########################################\n\
  if (Sys.info()['sysname'] == \"Windows\")\n{\nBaseSet = \"C:/VKHCG\"\nsetwd(BaseSet)\n\
  } else {\nBaseSet = paste0(\"/home/\",  Sys.info()['user'],  \"/VKHCG\")\nsetwd(BaseSet)\n\
  }\n###########################################\nBase=getwd()\nFileDir= paste0(Base,'/03-Hillman/01-Retrieve/01-EDS/01-R')\n\
  FileName=paste0(Base,'/03-Hillman/00-RawData/GB_Postcodes_Shops.csv')\nGB_Postcodes_Shops\
  \ <- read_csv(FileName,\ncol_types = cols(\nid = col_integer(),\nlatitude = col_double(),\n\
  longitude = col_double(),\npostcode = col_character()\n),\nna = \"empty\")\n###########################################\n\
  FileNameOut=paste0(FileDir,'/Retrieve_GB_Postcodes_Shops.csv')\nfwrite(GB_Postcodes_Shops,\
  \ FileNameOut)\n###########################################\nView(GB_Postcodes_Shops)\n\
  ###########################################\nGB_Five_Shops=GB_Postcodes_Shops[1:5,]\n\
  ###########################################\nlibrary(XML)\n###########################################\n\
  xml <- xmlTree()\nxml$addTag(\"document\", close=FALSE)\nfor (i in 1:nrow(GB_Five_Shops))\
  \ {\nxml$addTag(\"row\", close=FALSE)\nfor (j in 1:length(names(GB_Five_Shops)))\
  \ {\nxml$addTag(names(GB_Five_Shops)[j], GB_Five_Shops[i, j])\n}\nxml$closeTag()\n\
  }\nxml$closeTag()\nGB_Postcodes_Shops_XML=saveXML(xml)\n###########################################\n\
  FileNameXML=paste0(FileDir,'/Retrieve_GB_Postcodes_Shops.xml')\nwrite(GB_Postcodes_Shops_XML,\
  \ FileNameXML)\n###########################################\nxmlFile<-xmlTreeParse(FileNameXML)\n\
  class(xmlFile)\nxmlTop = xmlRoot(xmlFile)\nxmlText<- xmlSApply(xmlTop, function(x)\
  \ xmlSApply(x, xmlValue))\nGB_Postcodes_Shops_XML_A <- data.frame(t(xmlText),row.names=NULL)\n\
  ###########################################\nView(GB_Postcodes_Shops_XML_A)\n```\n\
