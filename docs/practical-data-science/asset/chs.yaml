  ### 多项逻辑回归


  多项逻辑回归是一种线性回归分析形式，当因变量为名义变量且具有两个以上类别时使用。它用于描述数据，并解释一个名义因变量与一个或多个连续型（区间或比率尺度）自变量之间的关系。你可以将名义变量视为没有内在排序的变量。


  这类数据在商业世界中最为常见，因为它通常涵盖数据源中的大多数数据条目，并直接表明你在普通数据湖中可能期望的结果。这些数据没有内在的顺序或关联关系。


