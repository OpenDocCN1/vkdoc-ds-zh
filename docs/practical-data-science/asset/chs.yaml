  \n提示\n\n你可以从周围世界中提取各种对象，然后开始分析它们如何改变数据科学的艺术。\n\n对象数据结构将随着客户数据因业务不同而变化。我建议你尽早开始分析项目中任何非人员实体的分类。与客户的领域专家交谈，获取他们的分类模型，并\
  \ 100%理解它们。\n\n同时，也要纳入对象描述的所有角度。一家零售店可能销售食盐，但制造商生产的是氯化钠。通过在数据仓库中连接这些信息，你的算法将理解这些关系。诸如深度学习、逻辑回归和随机森林（我将在第\
  \ 10 章中介绍）等算法，如果你已经通过连接不同洞见领域创建了基本关系，它们将会以改进的净结果运行。\n\n提示\n\n在确定业务需求时，应首先从对象类型（Object\
  \ Type）和对象组（Object Group）开始。如果你已经理清了这两个字段，那么你已经完成了对象结构 80%以上的工作。\n\n这只是数据科学中对象处理的基本起点。在流程（Process）超步骤中，数据仓库的这一部分始终是数据科学工作中最大的一部分。\n\
  \n我还通过请外部专家对某些客户从未识别出共同特征的对象进行分类，来丰富我客户的数据。\n\n警告\n\n加载大量重叠的细节，总比加载不充分和不完整的细节要好。不要过度概括你的对象类型和对象组分组。\n\
  \n为了实践示例的目的，我将介绍一些算法和技术，这些将帮助你执行数据源中对象的分类。\n\n\n\n### 位置\n\n该结构记录了数据源中数据实体之间发生交互的任何位置。数据操作的位置对任何企业而言都是极具价值的数据，它能提供完整数据集的地理空间洞察。地理空间是指对地表上已定义结构所处位置进行分类的信息。\n\
  \n我们来探讨一些关于位置的基础知识。\n\n#### 纬度、经度和海拔\n\n纬度、经度和海拔是描述地球位置最古老的一些官方方法，由希腊天文学家喜帕恰斯（公元前\
  \ 190–120 年）详细阐述。经线垂直于赤道，纬线平行于赤道。经度值范围介于 `-°` 到 `180°` 之间，格林威治本初子午线设为 `0°`。纬度值范围介于\
  \ `-90°` 到 `90°` 之间，赤道设为 `0°`。海拔是指在任意给定纬度和经度处高于海平面的距离。其范围从 `-11,033 米`（马里亚纳海沟）到\
  \ `+8,850 米`（尼泊尔的珠穆朗玛峰）。三个最深的海沟分别是：马里亚纳海沟（`11,033 米`）、汤加海沟（`10,882 米`）和千岛-堪察加海沟（`10,500\
  \ 米`）。三座最高的山峰分别是：珠穆朗玛峰（`+8,850 米`）、乔戈里峰/K2（`+8,611 米`）和干城章嘉峰（`+8,586 米`）。地球上的位置可能位于\
  \ `510.1 万亿平方米` 的网格中的任何一点。\n\n> **提示**\n> \n> 我总是将所有位置简化为纬度、经度和海拔，并附带简短的位置描述。\n\n\
  在分配设备位置时，我会使用纬度、经度和海拔，外加机柜和机架位置。如果我在雷神数据中心有服务器，我会记录它们的位置为 `纬度=64.0496287` 和 `经度=-21.9958472`，描述字段为“雷神数据中心”，外加机柜号和机架号。\n\
  \n#### 全球定位系统（GPS）与全球导航卫星系统（GLONASS）\n\n全球定位系统和全球导航卫星系统是基于空间的无线电导航系统，它们向任何 GPS/GLONASS\
  \ 接收器提供数据，使接收器能够计算自身在地球表面的位置。该系统仍然使用纬度、经度和海拔，但采用了一项先进技术，利用至少四颗卫星的一系列重叠远程映射来确定接收器的位置。因此，该系统精度极高。\n\
  \n#### 位置特征\n\n任何位置都具有不止一种地理特征。我将讨论一些更常用的位置分类和数据条目。\n\n### 绝对位置\n\n绝对位置为定位特定地点提供了明确的参照。在我处理的数据中，绝对的参照纬度、经度和海拔是我记录的核心数据。始终建议使用\
  \ GPS 数据源。\n\n示例：英国伦敦威斯敏斯特大本钟，邮编 SW1A 0AA，位于 `纬度: 51.510357` 和 `经度: -0.116773`。伦敦的伦敦眼位于\
  \ `纬度: 51.503399` 和 `经度: -0.119519`。美国纽约自由女神像国家纪念碑，邮编 NY 10004，位于 `纬度: 40.689247`\
  \ 和 `经度: -74.044502`。\n\n### 相对位置\n\n相对位置根据一个地点相对于其环境以及与其他地点的联系来描述该地点。此数据依赖于其他数据的正确性。我见过一些相对位置的数据源。\n\
  \n我将使用位于 `纬度: 51.510357`、`经度: -0.116773` 的英国伦敦威斯敏斯特大本钟，和位于 `纬度: 40.689247`、`经度:\
  \ -74.044502` 的美国纽约自由女神像国家纪念碑，来展示您可以预期的处理流程。\n\n###### 描述性路线\n\n这些数据源有助于获取绝对位置之间近似的相对位置。\n\
  \n示例：从大本钟到伦敦眼步行需九分钟（`0.5 英里`），途经 A302 路和女王步道；或骑自行车六分钟途经 A302 路；或乘出租车五分钟。从大本钟到自由女神像国家纪念碑乘飞机需\
  \ `7.5 小时`。\n\n###### 经纬度点之间的方位角与距离\n\n经纬度点之间的方位角与距离是在评估步骤中结合物流计算使用的一种计算方式。它为您提供绝对位置之间更精确的相对关系。\n\
  \n大本钟到伦敦眼的计算结果：\n\n- 距离：`0.7737 km`\n- 起始方位角：`179° 45′ 55″`\n- 终止方位角：`179° 45′ 56″`\n\
  - 中点：`北纬 51° 30′ 25″`，`东经 000° 00′ 07″`\n\n大本钟到自由女神像的计算结果：\n\n- 距离：`5583 km`\n-\
  \ 起始方位角：`071° 35′ 41″`\n- 终止方位角：`128° 50′ 54″`\n- 中点：`北纬 52° 23′ 15″`，`东经 041° 16′ 05″`\n\
  \n此方法为数据科学家提供了两个绝对位置之间更精确的信息。\n\n> **警告**\n> \n> 只有当绝对位置 100%正确时，此方法才有效！\n\n######\
  \ 文森特直接方位角与距离公式\n\n如果您从大本钟出发，使用 WGS84 椭球体，以方位角 `289` 行进 `5583 公里` 的距离，您将到达\n\n-\
  \ 纬度：`北纬 41°06′19″  41.10539784`\n- 经度：`西经 74°22′37″  -74.37694307`\n- 终止方位角：`231°23′36″\
  \  231.39333234`\n- 后方位角：`51°23′36″  51.39333234`\n\n我们位于纽约，但不在自由女神像处。\n\n> **提示**\n\
  > \n> 通过更精确的方位角和距离值，有可能到达自由女神像。\n\n当您想寻找最近的商店或计算地点之间的最佳交通方式时，地点的相对位置非常有用。\n\n#####\
  \ 自然特征\n\n[地形图](https://www.thoughtco.com/topographic-maps-overview-1435657)是展示地点物理特征的良好格式。我建议您收集特定地点的数据，以丰富您客户的数据。我还建议您查看特定地点的天气测量数据、温度、土地类型、土壤类型、地下矿产、水位、植物和动物生命等数据源。\n\
  \n> **注意**\n> \n> 任何能够增强位置数据的自然信息都值得收集。\n\n> **提示**\n> \n> 持续一段时间收集信息。这样，您就能获得时间序列数据，可用于检查地点自然特征的变化。\n\
  \n这些自然特征是测试商业行为与自然位置之间相关性的良好数据来源。例如，森林、沙漠或湖泊区域等自然特征可以向连锁店等企业表明，何时会畅销或滞销摩托艇或登山靴等商品。一年中\
  \ `90%` 的时间被红泥覆盖的地区可能不会销售白色裤子。某地区风能的匮乏或过剩可能决定节能解决方案（如风力发电）的成功与否。或者，天坑会增加房主保险的成本。\n\
  \n##### 人文特征\n\n我建议您收集关于某个地点任何人为设计或文化特征的数据。这些特征包括：政府类型、土地利用、建筑风格、生计形式、宗教习俗、政治制度、常见食物、当地民间传说、交通方式、所用语言、货币可用性以及通信方式。\n\
  \n这些自然特征是测试商业行为与自然位置之间相关性的良好数据来源。人文特征也有助于对地点进行分类。\n\n\n\n##### 人类与环境互动\n\n人类与环境的互动是指导人类行为及场所特征的主要关系。采矿、工业、道路建设以及景观美化等活动，不仅对环境产生积极和消极影响，同样也作用于人类自身。被规划为绿化带以协助减少碳足迹的区域，或新建的州际公路，都会改变其当前及未来的特征。场所是数据科学的主要数据源，通常我们能从中发现未知或意料之外的数据洞察。\n\
