  在进入示例之前，我先简单介绍一下图论。图用于表示现实世界中实体之间的关系。基本构建块是两个不同的图组件，如下所示。\n\n##### 节点（Node）\n\n\
  节点是任意特定的单个实体。例如，在“Andre 吻 Zhaan”中，有两个节点：Andre 和 Zhaan。\n\n![A435693_1_En_8_Fig1_HTML.jpg](img/A435693_1_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** 节点 Andre 和 Zhaan\n\n##### 边（Edge）\n\n边是任意两个节点之间的特定关系。例如，在“Andre 吻 Zhaan”中，有两个节点，即\
  \ Andre 和 Zhaan。边是“吻”。边可以记录为无向的。这将把“吻”记录为“互相亲吻”。\n\n![A435693_1_En_8_Fig2_HTML.jpg](img/A435693_1_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** 节点 Andre 和 Zhaan 互相亲吻\n\n边可以记录为有向的。这将把“吻”记录为“吻向”。\n\n![A435693_1_En_8_Fig3_HTML.jpg](img/A435693_1_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3** 节点 Andre 吻向 Zhaan\n\n这强制规定了边的方向。当处理必须按特定顺序发生的动作，或者需要遵循特定路径时，方向的概念非常有用。下图展示了一个示例。\n\
  \n![A435693_1_En_8_Fig4_HTML.jpg](img/A435693_1_En_8_Fig4_HTML.jpg)\n\n**图 8-4**\
  \ 边的方向\n\n你只能从 A 经过 B 到达 C，从 A 经过 B 到达 D，从 A 到 B，从 B 到 C，以及从 B 到 D。你不能从 C 到 B，从\
  \ D 到 B，从 B 到 A，从 C 到 A，以及从 D 到 A。有向边阻止了这些动作。\n\n##### 有向无环图（DAG）\n\n有向无环图是一种特殊图，图中只有一条路径。下图显示了一个属于\
  \ DAG 的图，而另一个则不属于 DAG。\n\n![A435693_1_En_8_Fig6_HTML.jpg](img/A435693_1_En_8_Fig6_HTML.jpg)\n\
  \n**图 8-6** 此图不是 DAG\n\n![A435693_1_En_8_Fig5_HTML.jpg](img/A435693_1_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5** 此图是 DAG\n\n图 8-6 不是 DAG 的原因是在 A 和 C 之间有两条路径：A 到 C，以及 A 经过 B 到 C。现在你已经了解了基础知识，接下来让我展示如何在数据科学中使用它。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n"
- "# 为作业调度构建 DAG\n\n以下示例说明了如何安排网络设备维护作业，以便在一个月内执行所需的维修。为了创建 DAG，我首先要定义它是什么：DAG 是一种数据结构，它使您能够在只能按特定顺序执行的数据条目之间生成关系。DAG\
  \ 是核心数据科学环境中的重要结构，因为它是使 Hadoop 中的 Spark、Pig 和 Tez 等工具能够工作的基本结构。它也用于记录任务调度和处理数据时的流程相互依赖关系。\n\
  \n我将介绍一个名为 `networkx` 的新 Python 库。\n\n打开您的 Python 编辑器，并在目录 `..\\VKHCG\\01-Vermeulen\\\
  02-Assess` 中创建一个名为 `Assess-DAG-Location.py` 的文件。现在将以下代码复制到该文件中：\n\n```\n################################################################\n\
  import networkx as nx\nimport matplotlib.pyplot as plt\nimport sys\nimport os\n\
  import pandas as pd\n################################################################\n\
  if sys.platform == 'linux':\nBase=os.path.expanduser('~') + 'VKHCG'\nelse:\nBase='C:/VKHCG'\n\
  print('################################')\nprint('Working Base:',Base,'using',sys.platform)\n\
  print('################################')\n################################################################\n\
  sInputFileName='01-Retrieve/01-EDS/02-Python/Retrieve_Router_Location.csv'\nsOutputFileName1='Assess-DAG-Company-Country.png'\n\
  sOutputFileName2='Assess-DAG-Company-Country-Place.png'\nCompany='01-Vermeulen'\n\
  ################################################################\n### Import Company\
  \ Data\n################################################################\nsFileName=Base\
  \ + '/' + Company + '/' + sInputFileName\nprint('################################')\n\
  print('Loading:',sFileName)\nprint('################################')\nCompanyData=pd.read_csv(sFileName,header=0,low_memory=False,\
  \ encoding=\"latin-1\")\nprint('Loaded Company:',CompanyData.columns.values)\nprint('################################')\n\
  ################################################################\nprint(CompanyData)\n\
  print('################################')\nprint('Rows:',CompanyData.shape[0])\n\
  print('################################')\n```\n\n我们现在将创建两个有向图：G1 和 G2。这需要使用 `G=DiGraph()`，如果只想要一个图，则使用\
  \ `G=Graph()`。\n\n```\n################################################################\n\
  G1=nx.DiGraph()\nG2=nx.DiGraph()\n################################################################\n\
  ```\n\n我们现在将为数据中的每个地点创建一个节点。为此，请使用 `G.add_node()` 函数。\n\n> **注意**\n> \n> 如果你执行 `G.add_node(\"\
  A\")`，然后再执行 `G.add_node(\"A\")`，你只会得到一个节点：`\"A\"`。该图会自动解析任何重复的节点请求。\n\n我们现在将遍历所有国家和地点-名称-国家的记录。\n\
  \n```\nfor i in range(CompanyData.shape[0]):\nG1.add_node(CompanyData['Country'][i])\n\
  sPlaceName= CompanyData['Place_Name'][i] + '-' + CompanyData['Country'][i]\nG2.add_node(sPlaceName)\n\
  ```\n\n我们现在将通过成对循环所有节点（`G.nodes()`）来互连所有节点。\n\n```\nprint('################################')\n\
  for n1 in G1.nodes():\nfor n2 in G1.nodes():\nif n1 != n2:\nprint('Link:',n1,' to\
  \ ', n2)\nG1.add_edge(n1,n2)\nprint('################################')\n```\n\n\
  现在，我们可以看到您创建的节点和边了。\n\n```\nprint('################################')\nprint(\"\
  Nodes of graph:\")\nprint(G1.nodes())\nprint(\"Edges of graph:\")\nprint(G1.edges())\n\
  print('################################')\n```\n\n我们现在可以保存我们的图，如下所示：\n\n```\n################################################################\n\
  sFileDir=Base + '/' + Company + '/02-Assess/01-EDS/02-Python'\nif not os.path.exists(sFileDir):\n\
  os.makedirs(sFileDir)\n################################################################\n\
  sFileName=sFileDir + '/' + sOutputFileName1\nprint('################################')\n\
  print('Storing:', sFileName)\nprint('################################')\n```\n\n\
  现在，您可以将图形显示为图片。\n\n```\nnx.draw(G1,pos=nx.spectral_layout(G1),\nnodecolor='r',edge_color='b',\n\
  with_labels=True,node_size=8000,\nfont_size=12)\nplt.savefig(sFileName) # save as\
  \ png\nplt.show() # display\n################################################################\n\
  ```\n\n现在，您可以完成第二个图了。\n\n```\nprint('################################')\nfor n1\
  \ in G2.nodes():\nfor n2 in G2.nodes():\nif n1 != n2:\nprint('Link:',n1,'to',n2)\n\
  G2.add_edge(n1,n2)\nprint('################################')\nprint('################################')\n\
  print(\"Nodes of graph:\")\nprint(G2.nodes())\nprint(\"Edges of graph:\")\nprint(G2.edges())\n\
  print('################################')\n################################################################\n\
  sFileDir=Base + '/' + Company + '/02-Assess/01-EDS/02-Python'\nif not os.path.exists(sFileDir):\n\
  os.makedirs(sFileDir)\n################################################################\n\
  sFileName=sFileDir + '/' + sOutputFileName2\nprint('################################')\n\
  print('Storing:', sFileName)\nprint('################################')\nnx.draw(G2,pos=nx.spectral_layout(G2),\n\
  nodecolor='r',edge_color='b',\nwith_labels=True,node_size=8000,\nfont_size=12)\n\
  plt.savefig(sFileName) # save as png\nplt.show() # display\n################################################################\n\
  ```\n\n保存 `Assess-DAG-Location.py` 文件，然后用你的 Python 编译器编译并执行。这将在屏幕上生成一组演示值，以及两个图形文件，分别名为\
