  | 0% | -176.50000 |\n| 25% | -80.20185 |\n| 50% | 1.81810 |\n| 75% | 12.69480 |\n\
  | 100% | 179.21670 |\n\n### 标准差\n\n在 R 中，对纬度列使用以下命令：\n\n```R\nsapply(hist_latitude_with_id[,'Latitude'],\
  \ sd, na.rm=TRUE)\n```\n\n结果是`19.86071`。\n\n在 R 中，对经度列使用以下命令：\n\n```R\nsapply(hist_longitude_with_id[,'Longitude'],\
  \ sd, na.rm=TRUE)\n```\n\n结果是`68.981`。\n\n\n\n### 偏度\n\n`Skewness`（偏度）描述了列中数据分布的形态或轮廓。\n\
  \n**请记住：** 这是一种为你进行并行处理提供轮廓的特征。\n\n在 R 中，对纬度列使用以下命令：\n\n**警告：** 你现在将安装一个新的包：`install.packges('e1071')`。这是一组名为\
  \ E1071 的有用函数，由维也纳科技大学统计系概率论研究小组编写。全世界有数千个 R 研究小组，在数据处理方面取得了极其有用的进展。我通过添加他们已有的、经过验证的处理能力，来丰富我们自己的处理能力。\n\
  \n```\nlibrary(e1071)\nskewness(hist_latitude_with_id$Latitude, na.rm = FALSE, type\
  \ = 2)\n```\n\n结果是 `-2.504929`。\n\n**负偏度：** 分布的质量集中在右侧，这种分布被称为左偏。该结果只是数据如何偏斜的一个指标。通过将其与直方图结合，你可以深入了解数据的分布情况。\n\
  \n**示例：** 如果你正在查看按升序（从右到左）排列的纬度分布，并发现偏度为负，那么你很可能会在左侧找到较少的位点，而更可能在右侧找到更多的位点。这只是一个快速的估计。尺寸直方图将为你提供每个尺寸的精确计数。\n\
  \n**知识点检查：** 经度也是如此吗？使用 `View(hist_longitude_with_id)`，你能预测会发现什么吗？你能自己猜测或计算偏度吗？\n\
  \n在 R 中，对经度列使用以下命令：\n\n```\nskewness(hist_longitude_with_id$Longitude,na.rm = FALSE,\
  \ type = 2)\n```\n\n结果是 `0.4852374`。\n\n**正偏度：** 分布的质量集中在左侧，这种分布被称为右偏。\n\n**警告：**\
  \ 数据缺失或未知值是数据科学中常见但不可避免的事实。\n\n**示例：** 如果你只拥有美国和德国客户的数据，这是否意味着你在英国没有客户？如果你的数据谱系推断你拥有数据，但在数据湖中只是没有\
  \ 100% 填满呢？你会如何处理？\n\n### 缺失或未知值\n\n识别数据集中是否存在缺失或未知值。\n\n在 R 中，对国家列使用以下命令：\n\n```\n\
  missing_country=data.table(Country=unique(IP_DATA_ALL_with_ID[is.na(IP_DATA_ALL_with_ID\
  \ ['Country']) == 1, ]))\nView(missing_country)\n```\n\n### 数据模式\n\n多年来，我一直使用以下流程来确定数据值本身的模式。这是我的标准版本：\n\
  \n将所有字母值替换为大写字母 A，所有数字替换为大写字母 N，并将所有空格替换为小写字母 b，将所有其他未知字符替换为小写字母 u。因此，“Good Book\
  \ 101” 变成 “AAAAbAAAAbNNNu”。\n\n这种模式创建有助于在第 10 章 中设计任何特定的评估规则，因为可以通过处理特定不需要的模式来删除或修复无效模式。这种数据的模式视图是一种快速识别常见模式或确定标准布局的方法。\n\
  \n**示例 1：** 如果对于一个日期列，你有两种模式——`NNNNuNNuNN` 和 `uuNNuNNuNN`，就很容易看出 `uuNNuNNuNN` 模式存在问题。在正则表达式中创建一个质量匹配网格也很容易：`regexpr()`。\n\
  \n参见 [`https://cran.r-project.org/web/packages/stringr/vignettes/regular-expressions.html`](https://cran.r-project.org/web/packages/stringr/vignettes/regular-expressions.html)。\n\
  \n**示例 2：** 它还有助于确定如何以并行方式加载数据，因为每种模式都可以在独立的检索过程中加载。如果发现相同的两种模式 `NNNNuNNuNN` 和 `uuNNuNNuNN`，你可以直接将\
  \ `NNNNuNNuNN` 发送去转换为日期，而 `uuNNuNNuNN` 则经过一个质量改进过程，然后在其符合要求后重新路由回与 `NNNNuNNuNN`\
  \ 相同的队列。这是使用模式来分离通用标准和结构的常见做法。\n\n那么，让我们看看如何实现这一点。让我们为第一列创建模式。我建议从国家列开始。\n\n在 R\
  \ 中，使用以下命令：\n\n```\nlibrary(readr)\nlibrary(data.table)\nBase=getwd()\nFileName=paste0(Base,'/01-Vermeulen/00-RawData/IP_DATA_ALL.csv')\n\
  IP_DATA_ALL <- read_csv(FileName)\nhist_country=data.table(Country=unique(IP_DATA_ALL$Country))\n\
  pattern_country=data.table(Country=hist_country$Country, PatternCountry=hist_country$Country)\n\
  oldchar=c(letters,LETTERS)\nnewchar=replicate(length(oldchar),\"A\")\nfor (r in\
  \ seq(nrow(pattern_country))){\ns=pattern_country[r,]$PatternCountry;\nfor (c in\
  \ seq(length(oldchar))){\ns=chartr(oldchar[c],newchar[c],s)\n};\nfor (n in seq(0,9,1)){\n\
  s=chartr(as.character(n),\"N\",s)\n};\ns=chartr(\" \",\"b\",s)\ns=chartr(\".\",\"\
  u\",s)\npattern_country[r,]$PatternCountry=s;\n};\nView(pattern_country)\n```\n\n\
  **注意：** 生成这些模式的过程可以转移到自定义函数甚至包中。如果你对这个过程感兴趣，关于函数，请参见 [`www.r-bloggers.com/how-to-write-and-debug-an-r-function/`](http://www.r-bloggers.com/how-to-write-and-debug-an-r-function/)。关于包，请参见\
  \ [`https://cran.r-project.org/doc/manuals/R-exts.html`](https://cran.r-project.org/doc/manuals/R-exts.html)。\n\
  \n那么，我们来保存一下进度。\n\n```\nBase=getwd()\nFileName=paste0(FileDir,'/pattern_country.csv')\n\
  pattern_country.to_csv(FileName)\n```\n\n你现在应该有一个名为 `pattern_country.csv` 的文件。\n\
  \n让我们为另一列创建模式。我建议从纬度列开始。\n\n在 R 中，使用以下命令：\n\n```\nlibrary(readr)\nlibrary(data.table)\n\
  Base=getwd()\nFileName=paste0(Base,'/01-Vermeulen/00-RawData/IP_DATA_ALL.csv')\n\
