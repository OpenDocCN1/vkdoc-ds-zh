  \ u,v: haversine(u,v))))\nprint(distance_matrix)\n```\n\n然后，应用聚类算法。\n\n```python\n\
  db = DBSCAN(eps=0.2, min_samples=2, metric=\"precomputed\", algorithm=\"auto\")\n\
  y_db = db.fit_predict(distance_matrix)\nX['cluster'] = y_db\nC = X.cluster.unique()\n\
  ```\n\n我们来可视化数据。\n\n```python\nfig=plt.figure(1, figsize=(20, 20))\nplt.title('Estimated\
