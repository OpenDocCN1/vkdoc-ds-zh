  print('################################')\n```\n\n干得好，您在这里取得了进展。您拥有了所有的国家节点。\n\n\
  我建议我们将国家列表存储为表 `Assess_IP_Country` 以备后用。\n\n```\nprint('################')\nsTable='Assess_IP_Country'\n\
  print('Storing:',sDatabaseName,'Table:',sTable)\nCompanyData.to_sql(sTable, conn,\
