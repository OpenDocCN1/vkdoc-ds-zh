- "# 引言\n\n如今人们每天都在谈论数据湖。我定期为各类组织提供咨询，帮助他们制定数据湖和数据科学战略，以服务于他们不断演变且持续变化的业务战略。这种对敏捷且经济高效的信息管理的需求，是全球高级管理者优先事项清单上的重中之重。\n\
  \n事实上，许多未知的洞见都被捕捉并存储在企业海量的未处理数据池中。这些数据湖对商业世界的未来具有重大影响。据预测，到 2020 年，全球数据科学家共同需要处理\
  \ 40 泽字节的数据，这比 2005 年增加了 300 倍。\n\n还有大量数据源仍需转化为可操作的商业知识。实现这一目标将能够保障那些能够做到的企业未来的安全。\n\
  \n全球的数据生产者每天产生 2.5×10¹⁸ 字节的新数据。物联网的加入将使这一数量大幅增加。数据科学家和工程师们正肩负着巨大的责任，显得有些力不从心。\n\n\
  通过阅读这篇引言，你已然是一个富有创新精神的人，想要理解这种人人都渴望驯服的先进数据结构。\n\n要驯服你的数据湖，你需要实用的数据科学。\n\n我提议教你如何驯服这头野兽。我熟悉实现这一目标所需的技能。我将以让你在掌握本书实用指南的过程中学习和成长、拓展能力为唯一目的，为你提供指导。\n\
  \n我将全程陪伴你，从数据湖一直到最终的视觉呈现与故事讲述。\n\n你将理解你的企业数据湖中有什么，以及如何在其上应用数据科学。\n\n将这个过程想象成一个天然的湖泊。至关重要的是，要针对这个湖泊建立一系列娴熟的技术，以便在你的杯中获得纯净的水。\n\
  \n不必紧张，因为到本书结束时，你将分享我超过 37 年与数据打交道和提取可操作商业知识的工作经验。我将与你分享我在国际范围内处理数据所获得的经验。\n\n我将会为你提供一个我经常使用的处理框架，用于驯服数据湖以及生活在该湖及其周边区域的各种“怪物”。\n\
  \n我在每章末尾都提供了示例以及代码，随着你阅读本书的深入，更严谨的数据科学家可以使用这些示例。但请注意，为了理解每章的概念，你并不需要完成这些示例。\n\n\
  那么，欢迎你通过使用实用的数据科学技术和洞见，来领略一个典型数据湖项目的实践过程。\n\n本引言其余部分的目标是解释数据科学的基础知识。\n\n### 数据科学\n\
  \n1960 年，彼得·诺尔开始使用“数据科学”一词作为计算机科学的替代术语。他指出，处理数据不仅仅需要计算机科学。我同意他的观点。\n\n数据科学是一门跨学科科学，它结合了各种实践和方法，从异构模式（结构化、半结构化或非结构化）的数据中获取可操作的商业知识和洞见。它将数据探索的科学领域与发人深省的研究领域（如数据工程、信息科学、计算机科学、统计学、人工智能、机器学习、数据挖掘和预测分析）融为一体。\n\
  \n就我而言，在我热切研究数据科学的未来应用，通过转化多个数据湖的过程中，我获得了若干宝贵的洞见。我将通过端到端的示例来解释这些洞见，并分享我对数据湖的见解。本书解释了这些科学中的关键要素，你将利用它们将你的数据湖处理成可操作的商业知识。我将引导你完成一系列公认的数据湖科学流程。当你开始涉足数据科学领域时，这些核心技能是你需要掌握的一套关键资产。\n\
  \n### 数据分析\n\n数据分析是对原始数据进行事实调查分析的科学，其目标是从数据湖中得出结论。数据分析由经过认证的算法驱动，以统计方式定义数据之间的关联，从而产生洞见。\n\
  \n当你想要让其他商业人士相信你所挖掘出的数据洞见的重要性时，“经过认证的算法”这一概念显得尤为重要。\n\n**注意**\n\n如果你经常被问到以下问题，请不要感到惊讶：请证实它！你怎么知道它是正确的？\n\
  \n最好的回答是，指出你使用过的、经过认证且公认的算法。将该算法与你的业务术语关联起来，以便成功推进你的项目。\n\n\n### 机器学习\n\n商业世界正充斥着关于机器学习及其在众多商业环境中应用的活动与构想。机器学习是指系统无需显式软件开发即可学习的能力。它源于模式识别与计算学习理论的研究。\n\
  \n其影响在于，借助恰当的处理与技能，你能增强自身的数据处理能力。训练能使处理环境在喝杯咖啡的时间内完成多个数量级的发现。\n\n> **注意**  \n> 更聪明地工作，而非更辛苦！将数据科学工作交给机器。它们在处理数据湖时更快、更稳定。\n\
  \n这项技能是缩短数据到知识周期、实现重大收益的关键部分。本书后续章节将涵盖重要的实用基础规则。\n\n### 数据挖掘\n\n数据挖掘是指处理数据以在数据湖中分离模式并建立数据实体间的关系。要使数据挖掘成功，你必须了解少量关于数据模式的关键数据挖掘理论。\n\
  \n在后续章节中，我将详细阐述如何挖掘数据以获取洞见。这将帮助你发现新的可执行知识。\n\n## 统计学\n\n统计学是研究数据的收集、分析、解释、呈现与组织的学科。统计学涉及数据的所有方面，包括以调查和实验设计的形式规划数据收集。\n\
  \n数据科学与统计学紧密相关。我将向你展示如何运行一系列涵盖数据收集、总体与样本的统计模型，以提升你的数据科学交付成果。\n\n本书后续章节将专门讲述如何将这些整合成一个高效且有效的流程。\n\
  \n## 算法\n\n算法是一套自包含的、按步骤执行的过程，用于达成特定结果。算法执行计算、数据处理或自动化推理任务，并能产生可重复的结果。\n\n算法是数据科学流程的支柱。你应整合一系列方法和程序，以简化特定数据湖的复杂性与处理过程。\n\
  \n我将在全书中讨论众多算法及开展实用数据科学的最佳实践。\n\n## 数据可视化\n\n数据可视化是你与业务沟通的关键渠道。它包括对业务洞见的视觉呈现进行创建与研究。数据科学的主要交付物就是可视化。你必须将高度技术性的结果转化为可向非专业人士展示的格式。\n\
  \n将数据结果成功转化为可执行知识是一项技能组合，我将在后续章节中详细阐述。如果你掌握了可视化技能，在数据科学领域将最为成功。\n\n## 数据故事\n\n数据故事是将数据分析转化为外行术语的过程，以影响业务决策或行动。你可能拥有最优秀的数据科学，但若缺乏将发现转化为业务相关行动的商业故事，你将无法成功。\n\
  \n我将提供详细的实用洞见，说明应检查哪些内容，以确保你拥有恰当的故事与行动。\n\n## 下一步做什么？\n\n我将利用基础科学的核心知识，向你展示如何有条理地开始处理将数据湖转化为可执行知识的流程。唯一的要求是理解你自己数据湖的数据科学。请迅速开始，探索数据科学能揭示关于你业务的哪些信息。你就是自己数据湖的主人。\n\
  \n你必须熟悉数据湖及流入其结构的内容。我的建议是，将数据科学应用于小规模活动，以从数据湖中获取洞见。\n\n> **注意**  \n> 勇于尝试——突破你洞察的边界。\n\
  \n"
