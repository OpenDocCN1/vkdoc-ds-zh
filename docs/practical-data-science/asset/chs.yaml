  \n### 数据科学的根源\n\n数据科学的核心在于好奇心和探索精神。这个核心植根于“5 个为什么”方法。“5 个为什么”是数据科学分析阶段使用的一种技术。\n\
  \n#### “5 个为什么”的好处\n\n“5 个为什么”有助于数据科学家识别问题的根本原因，并确定同一问题不同根本原因之间的关系。它是最简单的调查工具之一——无需进行复杂的统计分析即可轻松完成。\n\
