- "# 递归统一模式的同构本体论\n\n递归统一模式的同构本体论（HORUS）作为一种内部数据格式结构，用于减少框架所需的转换排列组合。采用 HORUS 方法论会形成一种轴辐式数据转换方法。外部数据格式先转换为\
  \ HORUS 格式，随后 HORUS 格式可再转换为任何其他外部格式。\n\n其基本概念是获取原生原始数据，然后先将其转换为单一格式。这意味着文本文件只有一种格式，JSON\
  \ 或 XML 只有一种格式，图像和视频也只有一种格式。因此，为了实现任意格式之间的转换覆盖，框架只需要两种转换器：数据格式到 HORUS 的转换器，以及 HORUS\
  \ 到数据格式的转换器。\n\n表 3-1 展示了如何通过对文本文件采用轴辐式方法来减少实现有效数据科学解决方案所需的转换脚本数量。可以看出，仅处理 100 个文本数据集时，与非轴辐式框架相比就能节省\
  \ 98%的脚本。我建议您投入时间让轴辐式框架在您的环境中运行起来，因为您每一次的投入都会因节省而得到回报。通过精简其他数据类型也能实现类似的推断。\n\n**表\
  \ 3-1** 采用轴辐式数据转换的优势\n\n| 数据格式数 | 所需常规转换器数 | 所需 HORUS 转换器数（轴辐式） | 节省百分比 |\n| ---\
  \ | --- | --- | --- |\n| 2 | 4 | 4 | 0.00% |\n| 3 | 9 | 6 | 33.33% |\n| 4 | 16 |\
  \ 8 | 50.00% |\n| 5 | 25 | 10 | 60.00% |\n| 6 | 36 | 12 | 66.67% |\n| 7 | 49 | 14\
  \ | 71.43% |\n| 8 | 64 | 16 | 75.00% |\n| 9 | 81 | 18 | 77.78% |\n| 10 | 100 | 20\
  \ | 80.00% |\n| 25 | 625 | 50 | 92.00% |\n| 50 | 2500 | 100 | 96.00% |\n| 100 |\
  \ 10000 | 200 | 98.00% |\n\n关于 HORUS 需求的详细内容将在后续章节中介绍。此时此刻，只需注意，您需要在数据科学流程内部拥有某种通用数据格式，以便将数据从一种格式传递到另一种格式。我主要将\
  \ HORUS 用于数据处理，并且多年来取得了成功。\n\n## 分层框架的顶层\n\n顶层旨在支持创建数据科学卓越中心的长期战略。图 3-1 所示的各层使您能够跟踪所完成的所有处理过程和发现。\n\
  \n如果您在团队环境中工作，则必须使用卓越中心框架。使用该框架将使您做好准备，在多个数据科学家共同处理同一生态系统的环境中工作。\n\n如果您只是对少数几个数据文件进行数据整理，并且您的数据科学技能需要快速产出洞见，我建议您从整个框架中挑选出您需要的内容。请记住：所有大型系统在某个时刻都曾是一个小试点。该框架将使您能够将小项目转变为大成功，而无需在通往生产环境的道路上进行重大重构。\n\
  \n让我们来讨论这个框架（图 3-2）。\n\n![A435693_1_En_3_Fig2_HTML.jpg](img/A435693_1_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2** 数据科学框架的顶层\n\n现在您已经看到了它们，让我们更详细地了解这些层。\n\n### 业务层基础\n\n图 3-2 中所示的业务层是数据科学家和工程师进行数据处理所需的需求和业务信息的主要来源。\n\
  \n> **提示** 关于您业务详细特征和需求的信息，再详细也不为过。\n\n数据科学已经成熟。过去提供快速、不成熟的分析，然后匆忙进行下一个分析的时代在很大程度上已经结束了。现在，您需要确保分析具有与处理任何其他业务方面相同的高质量和一致性。\n\
  \n> **谨记** 您受雇于业务部门。照顾好它，它也会照顾好您。\n\n业务层中应包含的材料包括：\n\n* 最新的组织结构图\n* 您正在调查的业务流程的业务描述\n\
  * 您的主题专家列表\n* 项目计划\n* 预算\n* 功能需求\n* 非功能需求\n* 数据项标准\n\n> **谨记** 数据科学应遵循与软件工程和统计数据研究相同的规则集。我将在第\
  \ 4 章详细讨论业务层并分享我的经验。\n\n### 实用程序层基础\n\n我将实用程序定义为一个被许多数据科学项目用来实现通用处理方法的过程。如图 3-2\
  \ 所示，实用程序层是一个公共区域，您可以在其中存储所有实用程序。您经常会遇到即时需求，要求您修复数据中的某些问题或运行您的“神奇”算法。您可能花了好几个小时为此做准备，却发现自己找不到那个出色的实用程序，或者您拥有的某个版本无法确保它能正常工作。我曾经也遇到过这种情况——并且留下了证明这一点的伤痕。\n\
  \n> **提示** 将您的实用程序（包括源代码）收集在一个中心位置。详细记录每个版本。\n\n如果您有经常使用的数据算法，我强烈建议您保存任何能够证明该过程是高质量且业界公认算法的证据和凭证。痛苦的经历向我证明，您将会受到考验，而百分之百地支持您的数据科学是至关重要的。由此创造的额外价值是能够让多个团队并行开展项目，并且知道每位数据科学家或工程师都在按照明确的标准工作。\n\
  \n在第 5 章中，我将讨论我认为每位数据科学家都有责任了解的一些有趣且有用的实用程序。\n\n### 运营管理层基础\n\n如图 3-2 所示，运营管理是生态系统中涉及设计和控制生产环境流程链以及重新设计业务流程的一个领域。该层存储了您打算处理的内容。正是在这里，您规划数据科学处理流水线。\n\
  \n运营管理层用于记录：\n\n* 处理流的定义和管理\n* 参数\n* 调度\n* 监控\n* 通信\n* 警报\n\n运营管理层是您存储为数据科学创建的任何处理链的公共位置。\n\
  \n> **注意** 运营管理是您将数据科学实验转化为长期业务收益的方式。\n\n我将在第 6 章中讨论关于运营管理的许多子组件的细节。\n\n### 审计、平衡与控制层基础\n\
  \n审计、平衡与控制层，如图 3-2 所示，是您能够观察数据科学环境中当前运行内容的区域。它记录：\n\n* 流程执行统计信息\n* 平衡与控制\n* 拒绝与错误处理\n\
  * 代码管理\n\n这三个子区域的使用方式如下。\n\n\n\n### 审计\n\n如图 3-2 所示的审计子层，用于记录环境中运行的任何进程。数据科学家和工程师会利用这些信息来理解并规划对处理流程的改进。\n\
  \n> **提示**  \n> 请确保你的算法和处理流程能够生成良好且完整的审计追踪。\n\n我的经验告诉我，良好的审计追踪至关重要。利用数据科学技术栈的原生审计能力，将为你的审计工作提供一个快速有效的基础。我在第\
  \ 6 章中详细讨论了那些我认为至关重要且实用的审计信息。以下是对该主题内容的简要介绍。\n\n### 平衡\n\n图 3-2 中的平衡子层确保生态系统在可用处理能力之间保持平衡，或者在处理高峰期具备补充处理能力的能力。为此，云生态系统的按需处理能力非常理想。\n\
  \n> **提示**  \n> 将你的能力规划为常驻处理与补充处理的组合。这样，你就能从处理周期中获得最大生产力。\n\n利用审计追踪，可以适应不断变化的需求，并预测完成你提交给生态系统的工作计划所需的条件。\n\
  \n在你能够构建的常驻与补充生态系统中，你可以通过在处理管道中动态地移除或添加资源来平衡处理需求。我建议你尽可能频繁地让你的代码平衡其生态系统。例如，在月末处理期间，你可以将处理容量增加到六十个节点，以应对月末运行的额外需求。当月的其余时间，你可以在营业时间内以二十个节点运行。在周末和其他非高峰时段，你只需用五个节点运行。通过这种方式可以节省大量成本。\n\
  \n### 控制\n\n如图 3-2 所示的控制子层，负责在生产生态系统中控制当前活跃数据科学流程的执行。控制元素是数据科学技术栈中各个工具的控制元素与用于控制主工作流的自定义界面的结合。控制还确保当处理过程遇到错误时，可以根据你的需求尝试恢复，或者调度清理工具来撤销错误。第\
  \ 6 章将更详细地讨论你需要特定接口和工具的原因、内容及方式。\n\n我的大多数大客户都建立了独立的探索环境，你可以在其中运行作业，而无需受任何限制性控制机制的约束。这使得数据科学家能够专注于模型和处理，而不必遵从更严格的生产要求。\n\
  \n## 功能层基础\n\n图 3-2 所示的数据科学生态系统功能层是所需编程的主要层次。功能层是执行全面数据科学的生态系统部分。它由几个结构组成。\n\n-\
  \   数据模型\n-   处理算法\n-   基础设施的配置\n\n我的处理算法分布在以下六个处理超级步骤中：\n\n1.  **检索**：此超级步骤包含通过更结构化的格式从原始数据湖检索数据的所有处理链。\n\
  2.  **评估**：此超级步骤包含用于质量保证和额外数据增强的所有处理链。\n3.  **处理**：此超级步骤包含用于构建数据仓库的所有处理链。\n4.  **转换**：此超级步骤包含用于构建数据仓库的所有处理链。\n\
  5.  **组织**：此超级步骤包含用于构建数据集市的所有处理链。\n6.  **报告**：此超级步骤包含用于构建虚拟化和报告可操作知识的所有处理链。\n\n\
  这些超级步骤将在专门章节（第 6 章至第 11 章）中详细讨论，使您能够掌握各个超级步骤以及数据科学技术栈中相关的工具。\n\n## 高级数据科学与工程的分层框架\n\
  \n我在本书中引用的任何源代码或其他补充材料，读者均可通过本书的产品页面在 GitHub 上获取，地址为 [`www.apress.com/9781484230534`](http://www.apress.com/9781484230534)。\n\
  \n分层框架由以下结构构建而成。以下脚本将为你创建一个完整的框架，如果你使用的是 Windows 系统，该框架位于 `C:\\VKHCG\\05-DS\\00-Framework`\
  \ 目录下；如果你使用的是 Linux 环境，则位于 `./VKHCG/05-DS/00-Framework` 目录下。\n\n### Windows\n\n\
  如果你偏好 Windows 和 Python，在第 2 章的源代码中，你会找到相关的 Python 脚本，标识为 `Build_Win_Framework.py`。\n\
  \n如果你偏好 Windows 和 R，在第 2 章的源代码中，你会找到相关的 R 脚本，标识为 `Build_Win_Framework.r`。\n\n###\
  \ Linux\n\n如果你偏好 Linux 和 Python，在第 2 章的源代码中，你会找到相关的 Python 脚本，标识为 `Build_Linux_Framework.py`。\n\
  \n如果你偏好 Linux 和 R，在第 2 章的源代码中，你会找到相关的 R 脚本，标识为 `Build_Linux_Framework.r`。\n\n##\
  \ 总结\n\n我已经解释了数据科学解决方案所需的基本分层框架。对于如何整合你的解决方案以在你的数据科学项目中取得成功，你应该有了一个总体的高层理解。\n\n\
  在接下来的章节中，我将通过实际案例，提供各个组件的详细信息。\n\n"
- "# 4. 业务层\n\n在本章中，我将详细定义业务层，阐明数据科学解决方案中存在的功能性及非功能性需求的原因、位置和内容。通过示例，我将帮助你构建一个实用的业务层，并在详细解释该层以及讨论帮助你执行良好数据科学的方法时，为你提供建议。\n\
  \n业务层是非技术性业务需求与愿望同实际数据科学之间的过渡点。我猜想，本书大多数读者可能倾向于将职业生涯投入到他们眼中更有趣的数据科学工作中。业务层并非完全属于数据科学家，通常，它的成功是业务领域专家、业务分析师、硬件架构师和数据科学家等专业人士共同努力的结果。\n\
  \n### 业务层\n\n业务层是我们记录与业务交互的地方。在这里，我们将业务需求转化为数据科学需求。\n\n如果你想利用令人印象深刻的数据科学技能来处理数据和进行数据整理，那么本章可能不是你期望中一本关于实用数据科学书籍的开端。然而，我建议你阅读本章，如果你想在一个成功的数据科学团队中工作。作为数据科学家，你无法控制业务的方方面面，但有责任确保识别出真正的需求。\n\
  \n> **警告**  \n> 我见过太多数据科学家因为需求收集不善而导致的糟糕科学成果而受到指责。\n\n\n\n### 功能需求\n\n功能需求记录了在与数据科学生态系统交互时，为实现业务在真实环境中的愿景所必须遵守的详细标准。这些需求是业务对系统的看法，也可称为“业务意志”。\n\
  \n**提示**  \n记录所有业务的愿景，让每个人都提供其输入。你不想遗漏任何内容，因为后续的补充对于所有参与者来说既昂贵又痛苦。\n\n我使用莫斯科（MoSCoW）方法（表\
  \ 4-1）作为优先排序技术，以表明每个需求对业务的重要性。在每个开发周期之前，我都会重新审视所有未完成的需求，以确保专注于当前对业务影响最大的需求。因为业务在发展，你必须了解其真实需求。\n\
  \n**表 4-1**  \nMoSCoW 选项\n\n| 必须做 | 优先级为“必须做”的需求对当前交付周期至关重要。 |\n| --- | --- |\n\
  | 应该做 | 优先级为“应该做”的需求很重要，但对当前交付周期并非必需。 |\n| 可以做 | 优先级为“可以做”的需求是可取但非必要的，即对当前交付周期来说，这些需求能够改善用户体验。\
  \ |\n| 不做 | 优先级为“不做”的需求是利益相关者认为最不重要、回报最低，或在当前交付周期中不合适的请求。 |\n\n#### 通用功能需求\n\n作为一名\
  \ `[用户角色]`，我希望实现 `[目标]`，以便达成 `[业务价值]`。\n\n#### 具体功能需求\n\n以下针对数据科学环境的具体需求将帮助你创建需求，从而能够将业务愿景转化为技术描述性需求。我发现这些技术在使需求与业务客户保持一致方面非常高效，同时我可以轻松地将它们转换或扩展为高度技术性的开发需求。\n\
  \n### 数据映射矩阵\n\n数据映射矩阵是数据科学中使用的核心功能需求记录技术之一。它追踪数据源中可用的每一个数据项。我建议在处理各层数据时，保持这份实用的矩阵持续更新。\n\
  \n### 太阳模型\n\n基础太阳模型流程由马克·怀特霍恩教授（`www.penguinsoft.co.uk/mark.html`）开发，我在硕士课程中学习了这一方法。（谢谢，马克。）\n\
  \n我对其进行了修改，并在自己的咨询实践中融合了拉尔夫·金博尔博士的智慧、比尔·因蒙的指导，以及我在职业生涯中遇到的几位杰出人士的深刻见解，从而演变出新的流程。\n\
  \n这些技术将随着数据科学的波动而持续演变，我们必须去适应。因此，这里介绍的是 2.0 版的太阳模型。\n\n**提示**  \n学会不断进化方能生存！\n\n\
  太阳模型是一种需求映射技术，它能帮助你在一个非技术用户也能理解分析意图的层面上记录需求，同时让你能够轻松过渡到数据科学家和数据工程师所需的详细技术建模。\n\n\
  **注意**  \n在接下来的几页中，我将介绍几个新概念。请继续阅读，因为这一部分将有助于解释完整的流程。\n\n我将以一个示例草拟一套太阳模型，并解释它如何指导你的开发和知识洞察。首先，我必须引导你掌握以下基础知识，以确保你具备阅读后续章节所需的背景知识。\n\
  \n这个太阳模型用于事实`居住地点`，并支持三个维度：人员、地点和日期。图 4-1 展示了一个典型的太阳模型。\n\n![A435693_1_En_4_Fig1_HTML.jpg](img/A435693_1_En_4_Fig1_HTML.jpg)\n\
  \n**图 4-1**  \n典型的太阳模型\n\n该模型可用于存储这样一个事实：某个特定人员从某个特定日期起居住在某个特定地点。因此，如果你想记录雅各布·罗格文博士自\
  \ 1722 年 4 月 5 日起居住在复活节岛拉帕努伊岛，你的数据将符合这个太阳模型，如图 4-2 所示。\n\n![A435693_1_En_4_Fig2_HTML.jpg](img/A435693_1_En_4_Fig2_HTML.jpg)\n\
  \n**图 4-2**  \n太阳模型中的雅各布·罗格文博士记录\n\n看看你是否能将自己的信息记录到同一个太阳模型中。接下来，我将讨论太阳模型的组成部分。\n\
  \n\n\n### 维度\n\n维度是一种对事实和度量进行分类的结构，帮助您解答业务问题。缓慢变化维度是一种数据结构，它会在数据湖的整个生命周期内，完整存储维度结构中每次数据加载的历史记录。数据仓库设计工具包中包含了多种类型的缓慢变化维度（`SCD`），它们可以实现不同的维度历史记录规则。\n\
  \n#### SCD 类型 1——仅更新\n\n此维度仅包含特定业务信息的最新值。\n\n**示例**：雅各布·罗格文博士曾居住在复活节岛的拉帕努伊，但现在住在荷兰的米德尔堡。\n\
  \n| 加载 | 名字 | 姓氏 | 地址 |\n| --- | --- | --- | --- |\n| 1 | 雅各布 | 罗格文 | 复活节岛，拉帕努伊\
  \ |\n| 2 | 雅各布 | 罗格文 | 荷兰，米德尔堡 |\n\n`SCD 类型 1` 仅记录雅各布·罗格文博士最初居住的地方，并忽略第二次加载的变化。\n\
  \n| 人员 |   | 地点 |\n| --- | --- | --- |\n| 名字 | 姓氏 | 地址 |\n| 雅各布 | 罗格文 | 复活节岛，拉帕努伊\
  \ |\n\n我发现这对于存储用户首次注册的地址，或他/她购买的第一个产品非常有用。\n\n#### SCD 类型 2——保持完整历史\n\n此维度包含特定业务信息的完整历史。构建`SCD\
  \ 类型 2`有三种方式。\n\n1. **版本化**：`SCD`会记录版本号的日志，允许您按变更发生的顺序回读数据。\n2. **标记**：`SCD`将业务数据行的最新版本标记为`1`，其余标记为`0`。这样，您可以随时获取最新的行。\n\
  3. **生效日期**：`SCD`会记录特定值对业务数据行有效的时段。\n\n**提示**：对数据科学来说，最佳的`SCD`是带有生效日期的`SCD 类型 2`。\n\
  \n**示例**：雅各布·罗格文博士曾住在荷兰的米德尔堡，然后住在复活节岛的拉帕努伊，但现在又住在荷兰的米德尔堡。\n\n| 加载 | 名字 | 姓氏 | 地址\
  \ |\n| --- | --- | --- | --- |\n| 1 | 雅各布 | 罗格文 | 荷兰，米德尔堡 |\n| 2 | 雅各布 | 罗格文 | 复活节岛，拉帕努伊\
  \ |\n| 3 | 雅各布 | 罗格文 | 荷兰，米德尔堡 |\n\n`SCD 类型 2` 在加载三次数据时，仅记录雅各布·罗格文博士居住地点的变化，并使用版本化。\n\
  \n| 人员 |   |   | 地点 |   |\n| --- | --- | --- | --- | --- |\n| 名字 | 姓氏 | 版本 | 地址\
  \ | 版本 |\n| 雅各布 | 罗格文 | 1 | 荷兰，米德尔堡 | 1 |\n|   |   |   | 复活节岛，拉帕努伊 | 2 |\n|   |\
  \   |   | 荷兰，米德尔堡 | 3 |\n\n我发现这对于存储客户曾居住过的所有地址非常有用，即使不知道他/她在每个地址的具体起止日期。\n\n`SCD\
  \ 类型 2` 在每次加载三次数据时，仅记录雅各布·罗格文博士居住地点的变化，并使用标记。\n\n| 人员 |   |   | 地点 |   |\n| ---\
  \ | --- | --- | --- | --- |\n| 名字 | 姓氏 | 标记 | 地址 | 标记 |\n| 雅各布 | 罗格文 | 1 | 荷兰，米德尔堡\
  \ | 0 |\n|   |   |   | 复活节岛，拉帕努伊 | 0 |\n|   |   |   | 荷兰，米德尔堡 | 1 |\n\n当我想存储客户曾居住过的所有地址，但不知道他/她在每个地址的具体起止日期或居住顺序时，我发现这很有用。标记仅指示最新的地址是什么。\n\
  \n`SCD 类型 2` 在加载三次数据时，仅记录雅各布·罗格文博士居住地点的变化，并使用生效日期。\n\n| 人员 |   |   | 地点 |   |\n\
  | --- | --- | --- | --- | --- |\n| 名字 | 姓氏 | 生效日期 | 地址 | 生效日期 |\n| 雅各布 | 罗格文 | 1722\
  \ 年 4 月 5 日 | 荷兰，米德尔堡 | 1659 年 2 月 1 日 |\n|   |   |   | 复活节岛，拉帕努伊 | 1722 年 4 月 5\
  \ 日 |\n|   |   |   | 荷兰，米德尔堡 | 1729 年 1 月 31 日 |\n\n当我想按客户居住的顺序存储其所有地址，以及他们搬到该地址的时间时，我发现这很有用。\n\
  \n#### SCD 类型 3——过渡维度\n\n此维度仅记录特定业务信息的过渡变化。\n\n**示例**：雅各布·罗格文博士曾住在荷兰的米德尔堡，然后住在复活节岛的拉帕努伊，但现在又住在荷兰的米德尔堡。\n\
  \n| 加载 | 名字 | 姓氏 | 地址 |\n| --- | --- | --- | --- |\n| 1 | 雅各布 | 罗格文 | 荷兰，米德尔堡 |\n\
  | 2 | 雅各布 | 罗格文 | 复活节岛，拉帕努伊 |\n| 3 | 雅各布 | 罗格文 | 荷兰，米德尔堡 |\n\n过渡维度通过保存一条记录，其中包含上次变化的值和当前值，从而仅记录最后一次地址变更。三个加载步骤如下：\n\
  \n**步骤 1**：居住在荷兰的米德尔堡\n\n| 地点 |   |\n| --- | --- |\n| 先前地址 | 地址 |\n|   | 荷兰，米德尔堡\
  \ |\n\n**步骤 2**：从荷兰的米德尔堡搬到复活节岛的拉帕努伊\n\n| 地点 |   |\n| --- | --- |\n| 先前地址 | 地址 |\n\
  | 荷兰，米德尔堡 | 复活节岛，拉帕努伊 |\n\n**步骤 3**：从复活节岛的拉帕努伊搬到荷兰的米德尔堡\n\n| 地点 |   |\n| --- | ---\
  \ |\n| 先前地址 | 地址 |\n| 复活节岛，拉帕努伊 | 荷兰，米德尔堡 |\n\n我使用`SCD 类型 3`来记录客户当前值的过渡变化。\n\n####\
  \ SCD 类型 4——快速增长维度\n\n此维度用于处理变化率高的特定业务信息。这使得数据能够跟踪快速变化，而不会使存储需求不堪重负。\n\n在第 9 章中，我将向您展示如何为您的数据科学设计和部署这些维度。\n\
  \n### 事实\n\n事实是一种度量，象征着现实世界中受管理实体的某个事实。在第 9 章中，我将向您展示如何为数据科学生态系统设计并部署事实。\n\n###\
  \ 太阳模型内整合矩阵\n\n太阳模型内整合矩阵是一种工具，可帮助您识别不同太阳模型之间的通用维度。假设我们完整的太阳模型集只包含三个模型。\n\n**提示**：在起草太阳模型时，宁可多起草也不要少起草。用它们来详细记录您的需求。\n\
  \n#### 太阳模型一\n\n第一个太阳模型（图 4-3）记录了“出生”关系，它直接依赖于选择器“事件”、“日期”和“时间”。\n\n![A435693_1_En_4_Fig3_HTML.jpg](img/A435693_1_En_4_Fig3_HTML.jpg)\n\
  \n**图 4-3** 太阳模型一\n\n#### 太阳模型二\n\n第二个太阳模型（图 4-4）记录了“居住于”关系，它直接依赖于选择器“人员”、“日期”、“时间”和“地点”。\n\
  \n![A435693_1_En_4_Fig4_HTML.jpg](img/A435693_1_En_4_Fig4_HTML.jpg)\n\n**图 4-4**\
  \ 太阳模型二\n\n#### 太阳模型三\n\n第三个太阳模型（图 4-5）记录了“拥有”关系，它直接依赖于选择器“对象”、“人员”、“日期”和“时间”。\n\
  \n![A435693_1_En_4_Fig5_HTML.jpg](img/A435693_1_En_4_Fig5_HTML.jpg)\n\n**图 4-5**\
  \ 太阳模型三\n\n然后，我将不同的维度和事实整合到一个矩阵中（图 4-6）。\n\n![A435693_1_En_4_Fig6_HTML.jpg](img/A435693_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-6** 太阳模型内链接矩阵\n\n该矩阵将在第 10 章中使用，用于设计和实现数据科学的转换过程。\n\n因此，既然您已经知道如何使用太阳模型来捕获功能性需求，那么理解如何实现对非功能性需求的收集也同样重要。\n\
  \n### 非功能性需求\n\n非功能性需求记录了用于评估数据科学生态系统运行的精确标准。\n\n\n\n#### 无障碍需求\n\n无障碍可被理解为“能够访问”并受益于某个系统或实体的能力。该概念的核心在于让残障人士、有特殊需求的人士能够访问，或通过辅助技术实现访问。\n\
  \n辅助技术涵盖以下方面：\n\n*   视力障碍支持等级：必须能够增加字体大小或类型，以帮助受影响人群阅读\n*   色盲支持等级：必须能够更改配色方案以匹配个人需求\n\
  *   使用语音激活命令协助残障人士：必须能够为无法正常输入命令或使用鼠标的人提供语音命令\n\n#### 审计与管控需求\n\n审计是指能够调查系统的使用情况，并报告任何违反系统数据处理规则的行为。管控则是确保系统按照预先批准的方式和授权用户来使用。\n\
  \n一种称为基于角色的访问控制（RBAC）的方法，是限制系统访问权限、仅允许授权用户访问的最常用方法。RBAC 是一种围绕角色和权限制定的访问控制机制。其组成部分包括角色权限、用户角色以及角色之间的关系，这些共同描述了系统的访问策略。\n\
  \n根据隐私和数据处理的相关法规，这些审计与管控要求也是强制性的。请咨询当地的信息官，以确认具体适用哪些规则。我将在第 6 章中详细讨论过去几年中我见过的一些法律法规。\n\
  \n#### 可用性需求\n\n可用性是指系统预期正常运行时间与总停机时间的比率。例如，如果你的营业时间是上午 9:00 至下午 5:00，并且在此期间停机时间不得超过\
  \ 1 小时，那么你需要 87.5% 的可用性。\n\n请注意，你需要精确指定在哪个节点衡量可用性。如果你在数据湖的边缘进行测量，很可能轻松实现 99.99999%\
  \ 的可用性。数据湖技术的分布式和容错特性将确保其高可用性。但如果你在业务关键节点进行测量，你会发现这些关键业务点的可用性要求更为具体。\n\n请按以下格式记录你的需求：\n\
  \n`组件 C 在连续测量周期 D 天内，将有 P% 的时间完全可用。`\n\n与之前一些客户使用的笼统的“24/7”或“营业时间”术语相比，你的客户将更容易理解这种表述。没有系统能够满足那些笼统的需求陈述。\n\
  \n业务在一天、一周、一个月或一年中的特定时段也会有高可用性需求。例如，每周一早上，周例会所需的数据科学结果必须可用。这可以记录为：\n\n`每周报告必须在每周一每个办公室的\
  \ 06:00 至 10:00 之间，100% 的时间完全可用。`\n\n> **注**  \n> 请思考这对跨越多个时区、拥有全球办公室的客户意味着什么。务必全面理解每一项需求！\n\
  \n正确的需求是：\n\n*   伦敦的每周报告必须在每周一的 06:00 至 10:00（格林威治标准时间或英国夏令时）之间，100% 的时间完全可用。\n\
  *   纽约的每周报告必须在每周一的 06:00 至 10:00（东部标准时间或东部夏令时）之间，100% 的时间完全可用。\n\n> **注**  \n> 你可以清楚地看到，这些需求现在比简单的笼统需求更加精确。\n\
  \n识别数据科学解决方案中的单点故障（SPOF）。务必清晰记录这一点，因为 SPOF 会间接影响许多可用性需求。\n\n强调必须记录并明确指定那些可能无法同时使用的组件之间的依赖关系，以充分反映该可用性需求。\n\
  \n> **注**  \n> 请注意，同一解决方案中不同组件的不同可用性需求，是最佳的需求记录选项。\n\n#### 备份需求\n\n备份，或备份过程，指的是对数据湖以及所有数据科学编程代码、编程库、算法和数据模型进行归档，其唯一目的是在数据丢失或损坏事件发生后，将这些内容恢复到系统已知的良好状态。\n\
  \n请记住：即使数据湖拥有最佳的分布式和自我修复能力，你也必须确保拥有定期且合适的备份来恢复。记住，只有能够成功恢复的备份才是有价值的。\n\n任何系统的价值都在于其恢复到良好状态的能力。这是一个关键需求。例如，假设你的数据科学家用新算法修改了系统，该算法错误地更新了数据湖中未知数量的数据。哦，是的，在业务所有警报爆发前那段寂静的时刻！你需要能够随时通过备份恢复到已知的良好状态。\n\
  \n> **警告**  \n> 请确保你能以有效且高效的方式恢复备份。这个过程是“备份与恢复”。仅仅生成备份并不能确保生存。请理解如果系统回退两小时，或在你恢复期间发生什么，会对业务产生什么影响。\n\
  \n#### 容量、当前与预测\n\n容量是指数据科学处理解决方案加载、处理和存储特定数据量的能力。你必须跟踪当前容量并预测未来需求，因为作为一名数据科学家，你将设计和部署许多复杂模型，这些模型需要额外的容量来完成你在处理周期中创建的处理流程。\n\
  \n> **警告**  \n> 我曾无意中创建了需要数 TB 工作空间的模型，仅仅是因为将参数设置得比最佳值略微深入了一点。突然间，我的模型以惊人的速度消耗磁盘空间！\n\
  \n### 容量\n\n容量是根据组件在解决方案中数据负载需求变化时，能否持续维持特定性能水平来衡量的。正确记录需求的方法是：\n\n`组件 C 将在 T 秒的时间范围内，为\
  \ U 个用户提供 P% 的容量，每个用户的数据量为 M MB。`\n\n示例：\n\n`数据硬盘将在 10 分钟的时间范围内，为 1000 个用户提供 95%\
  \ 的容量，每个用户的数据量为 10 MB。`\n\n> **警告**  \n> 调查在一次进程中执行完全重建所需的容量。我建议研究新的云端按需容量，用于灾难恢复或容量补充。我曾因缺乏合理的容量补充计划，在导致公司瘫痪数周的重大事故后提供过咨询。\n\
  \n\n\n#### 并发\n\n`并发`是指组件在同时承受多个负载的情况下，维持特定性能水平的能力。\n\n记录需求的正确方式是：\n\n`组件 C 将同时支持\
  \ U 个用户并发运行预定义的验收脚本 S。`\n\n示例：\n\n`内存将同时支持 100 个用户并发运行对 1000 条记录进行排序的算法。`\n\n**注意**\n\
  \n`并发`是指有效处理总用户群中一个子集的能力。我发现许多解决方案能够处理大量用户，但其中并发运行的用户可能低至总用户数的 10%。\n\n`并发`是一个重要的需求，有助于在项目初期确保解决方案的有效性。容量可以通过增加额外的处理资源来提升，而并发通常需要完全替换组件。\n\
  \n**设计提示**\n\n如果平均而言，你的数据科学算法运行时间很短，那么你可以支持较高的并发度与最大容量之比。但如果平均运行时间较长，那么你的并发度也必须相应提高。这样，你才能维持有效的吞吐性能。\n\
  \n#### 吞吐容量\n\n这指的是系统需要在高峰时段、特定条件下处理的事务数量。\n\n#### 存储（内存）\n\n这是指系统在运行时为了维持有效的处理方案，将在内存中持久化存储的数据量。\n\
  \n**提示**\n\n请记住：内存永远不嫌多，也永远不会太慢。\n\n#### 存储（磁盘）\n\n这是指系统为维持有效的处理方案，在磁盘上存储的数据量。\n\
  \n**提示**\n\n请确保你有合理的磁盘组合，以保证解决方案的有效性。\n\n你将需要快速的固态硬盘作为短期存储，以处理运行过程中的容量需求。\n\n**警告**\n\
  \n有些数据科学算法在处理数据时，会产生比输入或输出数据量更大的数据。\n\n下一个需求是你的长期存储。基本原则是规划更大但更慢的存储。研究使用集群存储，即两个或更多存储服务器协同工作，以提高性能、容量和可靠性。`集群`将工作负载分配给每台服务器，并管理服务器之间的工作负载转移，同时确保可用性。\n\
  \n从长远来看，使用集群存储将使你受益，在高需求时期，你可以通过添加额外设备进行垂直扩展。\n\n**提示**\n\n确保服务器网络完全有能力处理任何数据科学负载。请记住：典型的数据科学算法需要海量数据集才能有效工作。\n\
  \n大数据的发展正将海量数据带入处理生态系统。因此，请确保你有足够的空间来存储你需要的任何数据。\n\n**警告**\n\n如果可以选择，请不要与事务型系统共享磁盘存储或网络。数据科学会消耗共享资源上的所有空闲容量。拥有性能较低的专用资源集，也比共享一个不稳定的进程要好。\n\
  \n#### 存储（GPU）\n\n这是指系统在运行时，为了利用解决方案的图形处理能力维持有效的并行处理方案，将在 GPU 内存中持久化存储的数据量。CPU 由数量有限的、针对顺序串行处理进行了优化的内核组成，而\
  \ GPU 则具有大规模并行架构，包含数千个更小、更高效的内核，旨在同时处理海量的多任务。\n\n巨大的优势在于，将有效数量的超高速内存尽可能紧密地连接到这数千个处理单元上，以利用这种增强的容量。我目前正在部署像\
  \ `Kinetic DB` 和 `MapD` 这样的系统，它们是基于 GPU 的数据库引擎。这使我的解决方案的处理速度提升了数百倍。我预计在未来几年内，我们将看到这些系统在容量方面的关键性改进。\n\
  \n**提示**\n\n研究一下用于高性能处理的 GPU 处理网格。这是利用最新技术的有效解决方案。\n\n#### 年同比增长需求\n\n容量增长最大的方面将是长期存储。这些需求被指定为在一段时间内容量增加了多少。\n\
  \n记录需求的正确方式是：\n\n`组件 C 将负责必要的增长容量，以在 T 时间段内处理额外的 M MB 数据。`\n\n## 配置管理\n\n`配置管理 (CM)`\
  \ 是一个系统工程过程，用于在产品整个生命周期内，根据需求、设计和运营信息，建立并保持产品性能、功能和物理属性的一致性。\n\n## 部署\n\n需要一种有条理的程序，将数据科学引入组织的各个领域。研究如何实现数据科学模型的实用的持续部署。这些技能需求量很大，因为随着企业采用新的处理技术，流程模型的变化越来越频繁。\n\
  \n### 文档\n\n数据科学需要一套文档来支撑算法背后的故事。在我引导你阅读第 5 章到第 11 章时，我会解释处理流程每个阶段所需的文档。\n\n## 灾难恢复\n\
  \n`灾难恢复 (DR)` 涉及一组策略和程序，用于在自然或人为灾难后恢复或维持关键技术基础设施和系统的运行。\n\n## 效率（给定负载下的资源消耗）\n\n\
  `效率` 是指以最少的精力和时间完成工作的能力。作为一名数据科学家，你需要了解每种建模技术和算法的效率曲线。正如我之前建议的，你必须在不同规模下练习使用你的工具。\n\
  \n**提示**\n\n如果它在 10 万个数据点的样本上有效，那就试试 20 万个数据点或 50 万个数据点。确保你了解工具的扩展动态。\n\n## 有效性（相对于投入的产出性能）\n\
  \n`有效性` 是达成目标的能力；从生态系统中产生精确预期或期望的结果。作为一名数据科学家，你需要了解每种建模技术和算法的有效性曲线。你必须确保该过程只执行所需的处理，并且没有副作用。\n\
  \n## 可扩展性\n\n在数据科学生态系统内，增加额外功能并在下一版本升级时保留定制化的能力。数据科学必须始终能够扩展以支持新的需求。\n\n### 故障管理\n\
  \n`故障管理` 是识别故障根本原因，然后成功记录所有相关细节供未来分析和报告的能力。我发现，我将在生态系统中包含的大多数工具，其原生内部处理中已经内置了足够的故障管理和报告能力。\n\
  \n**提示**\n\n我发现，只需一套简单但结构良好的数据科学流程，就可以将单个故障日志整合到一个适当的故障管理系统中。对它应用常规的数据科学方法，就像处理另一个数据源一样。\n\
  \n在数据科学处理过程中，生态系统中的任何组件发生故障时，我总是会规定精确预期的处理步骤。验收脚本 `S` 完成并报告它生成的每个 `X` 故障。作为一名数据科学家，你需要记录系统的任何故障，以确保不会产生可能对客户造成不利影响的意外副作用。\n\
  \n\n\n## 容错\n\n容错是数据科学生态系统处理系统故障的能力。简单来说，任何单一事件都不能导致生态系统停止数据科学处理流程。\n\n在这里，我通常会明确规定在记录故障时，生态系统内部的精确操作监控、测量和管理需求。验收脚本\
  \ `S` 能够承受其产生的 `X` 个故障。作为数据科学家，你需要确保你的数据科学算法能够处理故障，并有条不紊地从故障中恢复。\n\n### 延迟\n\n延迟是指数据从系统的一部分传输到另一部分所需的时间。这在数据科学生态系统的分布式环境中高度相关。验收脚本\
  \ `S` 在空载系统上需在 `T` 秒内完成，在满负荷运行的系统上需在 `T2` 秒内完成，具体由并发需求定义。\n\n> **提示**\n>\n> 请记住：构成生态系统的组件之间也存在内部延迟，用户无法直接访问。请确保在你的需求中也注明这些延迟。\n\
  \n### 互操作性\n\n在本节中，请坚持要求在不同计算机系统之间共享数据的精确能力。详细说明哪个系统必须与哪些其他系统进行交互。我通常会调研通信协议、服务器位置、不同子组件的操作系统以及如今至关重要的最终用户互联网接入标准等领域。\n\
  \n> **警告**\n>\n> 需求必须精确，因为开放的互操作性可能会在开发周期后期导致意想不到的复杂情况。\n\n## 可维护性\n\n规定一个特定组件保持指定状态的精确时间段。详细描述如何在保持生态系统处于已知良好状态的同时，应用功能变更、修复和增强。\n\
  \n## 可修改性\n\n明确规定生态系统的每一层必须支持的变更量。\n\n> **提示**\n>\n> 说明解决方案特定层的限制是什么。如果数据库只能支持为一张表增加\
  \ 2024 个字段，请分享该信息！\n\n### 网络拓扑\n\n规定并描述生态系统内用于处理流程的详细网络通信需求。同时，说明预期的与外部世界的通信，以推动数据科学取得成功。\n\
  \n> **注意**\n>\n> 由于多个分布式数据科学算法处理过程会对网络流量产生重大影响，你需要了解并记录生态系统在可接受水平下运行所必需的网络环境。\n\n\
  ### 隐私\n\n我建议列出适用于此生态系统的确切隐私法律法规。确保记录下适用的具体法律法规。如果不确定，请寻求法律建议。\n\n这是一个全球性的热点话题，因为你将处理并存储他人的数据，并针对这些数据执行算法。作为一名数据科学家，你要对自己的行为负责。\n\
  \n> **警告**\n>\n> 请记住：侵犯隐私将导致罚款！\n\n> **提示**\n>\n> 我为所处理数据的法律责任索赔购买了责任保险。\n\n## 质量\n\
  \n明确规定在生态系统各个层面发现的严重缺陷、交付的缺陷以及缺陷移除效率。请记住：数据质量是一个功能性需求。这是一个非功能性需求，它描述的是生态系统的质量，而不是流经它的数据的质量。\n\
  \n## 恢复/可恢复性\n\n生态系统必须有一个明确的平均恢复时间（MTTR）指标。生态系统中特定层和组件的 MTTR 必须分别指定。\n\n我通常以小时为单位进行测量，但对于其他特别复杂的系统，我会以分钟甚至秒为单位进行测量。\n\
  \n## 可靠性\n\n生态系统必须有一个精确的平均故障间隔时间（MTBF）。这种可用性度量以预先约定的时间单位来指定。我通常以小时为单位进行测量，但也有一些非常敏感的系统最好以年为单位进行测量。\n\
  \n## 弹性\n\n弹性是指当故障和正常操作中的问题给处理流程带来复杂性时，能够提供并维持可接受服务水平的能力。生态系统必须具有明确定义的能力，无论其在处理过程中需要应对什么问题，都能及时恢复到原始形式和状态。\n\
  \n### 资源约束\n\n资源约束是生态系统所有组件的物理需求。关注的领域包括处理器速度、内存、磁盘空间和网络带宽，此外通常还包括你部署到生态系统中的工具所指定的其他几个因素。\n\
  \n> **提示**\n>\n> 与你的系统工程师讨论这些需求。这通常不是数据科学家工作的领域。\n\n## 可复用性\n\n可复用性是指在数据科学生态系统开发过程中使用预构建的处理解决方案。强烈建议数据科学家在常规数据处理中重用经过预先批准的处理模块和算法。这里的要求是，你应使用经批准且公认的标准来验证自己的结果。\n\
  \n> **警告**\n>\n> 我总是建议你使用有可靠来源的方法论和算法。经过批准的算法将保证业务方的认可。不要使用未经证实的想法！\n\n### 可伸缩性\n\
  \n可伸缩性是指你如何让数据科学生态系统适应你的需求。我在我的生态系统中使用三种可伸缩性模型：水平伸缩、垂直伸缩和动态（按需）伸缩。\n\n水平伸缩通过增加更多独立资源来提升数据科学生态系统的容量，以提高性能并提供高可用性（HA）。生态系统通过向外扩展来实现增长，即向数据科学资源集群中添加更多服务器。\n\
  \n> **提示**\n>\n> 水平伸缩是处理大规模数据科学生态系统的可靠方法。\n\n> **警告**\n>\n> 并非所有模型和算法都能进行水平伸缩。请先进行测试。我建议不要做出假设。\n\
  \n垂直伸缩通过向单个机器添加更多资源（更多内存或额外的 CPU）来提升容量。\n\n> **警告**\n>\n> 请确保在开始时正确确定数据科学构建模块的规模，因为集群的垂直扩展后期可能会变得昂贵且难以更换。\n\
  \n动态（按需）伸缩通过利用公共或私有云能力来增加资源以提升容量，这些资源可以按需付费模式进行增减。这是一种混合模型，使用一组核心资源（系统的最小占用空间），并辅以额外的突发协议，以覆盖系统所需的任何计划内甚至计划外的额外容量扩展。\n\
  \n我想为你系统中的高级用户讨论一下可伸缩性。传统上，我可能会建议使用高规格的工作站，但我发现，通过为他们提供访问灵活的按需水平伸缩环境的权限，可以更好地服务他们。这样，他们可以在处理高峰期间使用所需的资源，而在不需要额外处理能力时与他人共享容量。\n\
  \n### 安全性\n\n安全性是最重要的非功能性需求之一。我在三个层面规定安全需求。\n\n### 隐私\n\n我会特别注明保护生态系统内敏感信息的需求。需要注明的隐私需求类型包括数据库表的数据加密以及向第三方传输数据的策略。\n\
  \n> **提示**\n>\n> 隐私需求的来源是立法或公司规定。请咨询你的法律专家。\n\n\n\n#### 物理环境\n\n我将特别指出系统物理防护方面的需求。包括电力、高架地板、额外的服务器冷却、防火系统以及机柜锁等物理要求。\n\
  \n> **警告**  \n> 处理数据科学所需的部分高性能工作站对电力有严格要求，因此请确保您的数据科学家处于经预批准的环境中，以避免电网过载。\n\n####\
  \ 访问控制\n\n我特意规定了详细的访问需求，包括明确的账户类型/组及其精确的访问权限。\n\n> **提示**  \n> 我使用基于角色的访问控制（RBAC）来规范对数据科学资源的访问，依据是生态系统中单个用户的角色，而非其个人姓名。这样，我只需将角色转移给新人员，而无需对安全配置文件做任何更改。\n\
  \n### 可测试性\n\n国际标准 IEEE 1233-1998 指出，可测试性是“需求被表述为能够建立测试标准并执行测试以确定这些标准是否被满足的程度”。简而言之，如果你的需求不可测试，就不要接受它们。\n\
  \n> **切记**  \n> 可测试性越低，测试工作量就越大。我曾为那些表述不清的需求，耗费了无数个夜晚来编写测试。\n\n以下是一系列基于我经验的建议。\n\
  \n#### 可控性\n\n确切知道我可以按测试要求控制被测代码状态的程度至关重要。数据科学使用的算法并非总是可控的，因为它们会包含随机起点以加速过程。运行分布式算法不易处理，因为工作负载的分配不受你控制。\n\
  \n#### 可隔离性\n\n我能够隔离被测代码的具体程度将决定大部分可能的测试方式。诸如深度学习这类过程包含非隔离特性，因此不要接受那些因无法隔离而无法测试的需求。\n\
  \n#### 可理解性\n\n我发现大多数算法都有未记录的“额外功能”，或者简单来说，就是“陷阱”状态。被测算法的文档化程度直接影响需求的可测试性。\n\n####\
  \ 可自动化性\n\n我发现，我能够自动化测试代码的程度，直接影响到生态系统中算法测试的有效性和效率。我是已知结果内联测试的狂热爱好者。我会在算法中添加代码来测试特定的子环节，以确保新代码没有改变之前已验证过的代码。\n\
  \n## 需求的常见陷阱\n\n我只想列举在为我的客户群执行数据科学工作时注意到的常见陷阱样本。如果你已经意识到这些陷阱，那很好！\n\n许多陷阱看似显而易见；然而，在我被聘用之前，这些陷阱常常导致我的客户损失数百万美元的项目，我仍经常参与其中。那么，让我们来看看我经常遇到的一些更常见的陷阱吧。\n\
  \n### 模糊词汇\n\n模糊词汇是主观的，或者缺乏通用或精确的定义。以下是包含并识别出模糊词汇的示例：\n\n*   用户必须能够轻松访问系统。什么是“轻松”？\n\
  *   使用可靠的技术。什么是“可靠”？\n*   最先进的设备。什么是“最先进”？\n*   报告必须频繁运行。什么是“频繁”？\n*   用户友好的报告布局。什么是“用户友好”？\n\
  *   系统的安全访问。什么是“安全”？\n*   所有数据必须立即报告。什么是“所有”？什么是“立即”？\n\n我还可以添加更多示例。但你已经明白了这个共同主题。确保你的需求措辞精确而具体。可悲的是，我逐渐认识到，由于使用了模糊词汇，各种项目最终以失败告终。\n\
  \n### 未穷举列表\n\n未穷举列表是指不完整的项目列表。示例如下：\n\n*   至少可以从伦敦和纽约访问。我只连接伦敦和纽约吗？其他 20 个分支机构怎么办？\n\
  *   包括但不限于伦敦和纽约的办公室必须拥有访问权限。那么，新德里办事处是否不在解决方案范围内？\n\n确保你的列表是完整且精确的。这可以防止后续因需求被误解而产生的问题。\n\
  \n### 隐含集合\n\n当需求中的对象集合未被明确定义时，你或你的团队会假定一个错误含义。请看以下示例：\n\n**示例：** 解决方案必须支持 TCP/IP\
  \ 以及现有 Linux 用户所支持的其他网络协议。\n\n*   “现有用户”是什么意思？\n*   “其他网络协议”这个集合包含哪些内容？\n*   包含\
  \ TCP/IP 的哪些具体协议？\n*   “Linux”是来自多家供应商的一系列操作系统，拥有许多版本甚至修订版。你支持所有不同的版本，还是只支持其中一个？\n\
  \n确保你的集合是明确且精确的。这可以防止后续因需求被误解而产生的问题。\n\n### 歧义\n\n当需求中的词语有多重含义时，就会产生歧义。示例如下。\n\n\
  ### 模糊性\n\n该系统必须在使用当前数据科学标准的测试用例中通过 96%~100%。\n\n什么是“当前标准”？这是一个需求不清晰的例子！\n\n####\
  \ 主观性\n\n报告必须轻松无缝地与网站集成。\n\n就测试而言，“轻松”和“无缝”是高度主观的术语。\n\n#### 可选性\n\n该解决方案应尽可能在多种硬件条件下进行测试。\n\
  \n“尽可能”使这个需求变成了可选项。如果它在每种硬件设置上的测试都失败了怎么办？你的客户能接受吗？\n\n#### 规定不足\n\n该解决方案必须支持 Hive\
  \ 2.1 和其他数据库版本。\n\n“其他数据库版本”是仅包括其他 Hive 数据库，还是也包括诸如 HBase 1.0 和 Oracle 10i 等其他数据库？\n\
  \n#### 引用不明\n\n用户必须在一天中 90%的时间内，在三分钟内完成所有先前定义的报告。\n\n这些“先前定义的”报告是什么？这是一个需求不清晰的例子。\n\
  \n## 工程化实用的业务层\n\n我在本书中引用的任何源代码或其他补充材料，读者均可通过本书的产品页面在 GitHub 上获取，网址为 [`www.apress.com/9781484230534`](http://www.apress.com/9781484230534)。业务层遵循通用的业务分析和项目管理原则。我建议一个实用的业务层至少包含三个主要结构。\n\
  \n> **注意**  \n> 请参阅第 2 章的以下源代码：`./VKHCG/05-DS/5000-BL/`。\n\n对于业务层，我建议使用如下目录结构：`./VKHCG/05-DS/5000-BL`。这使你能保持解决方案的整洁有序，以便与标准版本控制系统成功交互。\n\
  \n### 需求\n\n> **注意**  \n> 请参阅第 2 章的以下源代码：`./VKHCG/05-DS/5000-BL/0300-Requirements`。\n\
  \n每个需求必须以完整版本控制的方式记录，采用“一个需求一个文件”的模式。我建议使用 `000000-00` 的编号方案，该方案支持多达一百万个需求，每个需求最多可有一百个版本。\n\
  \n\n\n### 需求登记表\n\n**注意：**  \n请参阅第 2 章中的以下源代码：`./VKHCG/05-DS/5000-BL/0100-Requirements-Registry`。\n\
  \n将所有需求汇总在一个文件中，保存一份摘要登记表，以便于查找特定需求。建议你设置如下几列：需求编号、MoSCoW 优先级、简要描述、创建日期、最后版本日期和状态。我通常使用以下状态值：\n\
  \n- `In-Development`\n- `In-Production`\n- `Retired`\n\n该登记表作为数据科学环境需求的控制机制。图 4-7\
  \ 显示了一个模板示例。\n\n![A435693_1_En_4_Fig7_HTML.jpg](img/A435693_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-7** – 需求登记表模板\n\n### 可追溯性矩阵\n\n**注意：**  \n请参阅第 2 章中的以下源代码：`./VKHCG/05-DS/5000-BL/0200-Traceability-Matrix`。\n\
  \n针对每个需求和你所开发的数据科学流程，创建一份可追溯性矩阵，以确保你清楚哪个数据科学流程支持哪个需求。这能确保你对环境拥有完全的控制权。如果你了解所有内容如何相互关联，那么进行变更就会很容易。图\
