- "# 2. Vermeulen-Krennwallner-Hillman-Clark\n\n让我们从构建一个客户开始。我虚构了一家公司，您将在学习本书的过程中为其执行实际的数据科学任务。您可以在\
  \ Windows 或 Linux 环境中运行您的示例。您只需下载所需的示例集即可。\n\n本书中引用的任何源代码或其他补充材料均可在 GitHub 上通过本书的产品页面获取，网址为\
  \ [`www.apress.com/9781484230534`](http://www.apress.com/9781484230534)。\n\n###\
  \ Windows\n\n我建议您创建一个名为 `c:\\VKHCG` 的目录来处理本书中的所有示例。然后，从 GitHub 下载 `DS_VKHCG_Windows.zip`\
  \ 文件并将其解压到此目录中。\n\n### Linux\n\n我也建议您创建一个名为 `./VKHCG` 的目录来处理本书中的所有示例。然后，从 GitHub\
  \ 下载 `DS_VKHCG_Linux.tar.gz` 文件并将其解压到此目录中。\n\n**警告：** 如果您将此目录更改为新位置，则需要将示例脚本中的所有内容都更改为指向这个新位置，才能从示例中获得最大收益。\n\
  \n这些文件用于创建示例公司的脚本和数据目录，我将使用它来指导您完成本书其余部分的流程和示例。\n\n## 现在是时候见见您的客户了\n\nVermeulen-Krennwallner-Hillman-Clark\
  \ 集团（VKHCG）是一家虚构的中型国际公司。它由四家子公司组成：Vermeulen PLC、Krennwallner AG、Hillman Ltd 和 Clark\
  \ Ltd。\n\n### Vermeulen PLC\n\nVermeulen PLC 是一家数据处理公司，负责处理集团内所有公司的数据，这是其对集团职责的一部分。该公司负责业务的所有信息技术方面。\n\
  \n这就是您刚刚被聘为数据科学家的公司。祝您未来一切顺利。\n\n该公司提供的服务包括：\n\n- 数据科学\n- 网络、服务器和通信系统\n- 内部和外部网站\n\
  - 数据分析业务活动\n- 决策科学\n- 流程自动化\n- 管理报告\n\n就本书而言，我将解释在框架的每个部分您需要研究哪些其他技术，但示例将仅集中于讨论中的特定概念，因为整个数据科学领域比所选的一些示例更为全面。\n\
  \n通过示例，我将帮助您构建一个基础的数据科学技术栈，然后通过额外的讨论为您提供建议，说明如何使该技术栈能够大规模运行。\n\n这些示例将向您展示如何处理以下业务数据：\n\
  \n- 客户\n- 产品\n- 地点\n- 业务流程\n- 一些有用的数据科学算法\n\n我将解释如何：\n\n- 使用地理空间分析创建网络路由图\n- 使用图论为作业调度构建有向无环图（DAG）\n\
  \n如果您想更详细地了解公司的数据，可以浏览公司示例目录中的这些数据集（`./VKHCG/01-Vermeulen/00-RawData`）。\n\n在本章后面，我将更详细地引导您了解每个数据集。\n\
  \n### Krennwallner AG\n\nKrennwallner AG 是一家广告和媒体公司，为集团的客户准备广告和媒体内容。\n\n它提供的服务包括：\n\
  \n- 广告牌广告\n- 在线投放的广告和内容管理\n- 关键客户的活动管理\n\n通过多种技术，它记录谁观看了哪些媒体流。我们将详细阐述的具体需求是如何识别需要观看特定媒体内容的客户群体。我将解释如何：\n\
  \n- 为特定的广告牌挑选内容\n- 了解每个国家在线网站访问者的数据\n- 为新天鹅堡的前十大客户策划活动\n\n如果您想更深入地了解公司的数据，请浏览公司示例目录中的示例数据集（`./VKHCG/02-Krennwallner/00-RawData`）。\n\
  \n### Hillman Ltd\n\nHillman 公司是一家供应链和物流公司。它为业务提供全球供应链解决方案，包括：\n\n- 第三方仓储\n- 国际运输\n\
  - 门到门物流\n\n我将通过示例展开讨论的主要需求是如何设计客户在线购买产品的配送。\n\n通过示例，我将追踪产品从工厂到仓库，以及从仓库到客户家门的整个过程。\n\
  \n我将解释如何：\n\n- 规划英国境内仓库的位置\n- 规划最佳匹配国际物流的运输规则\n- 为给定的一组产品选择最佳的集装箱打包方案\n- 为苏格兰的一组客户创建最优配送路线\n\
  \n如果您想更详细地了解公司的数据，可以浏览公司示例目录中的数据集（`./VKHCG/03-Hillman/00-RawData`）。\n\n### Clark\
  \ Ltd\n\nClark 公司是一家风险投资和会计公司，负责处理集团的以下财务职责：\n\n- 财务洞察\n- 风险资本管理\n- 投资规划\n- 外汇交易\n\
  \n我将利用集团公司的财务方面来解释如何将实用的数据科学和数据工程应用于虚构财务数据的常见问题。\n\n我将向您解释如何准备：\n\n- 一个简单的外汇交易规划器\n\
  - 会计比率：\n  - 盈利能力\n  - 销售毛利润\n  - 税后销售毛利润\n  - 已动用资本回报率（ROCE）\n  - 资产周转率\n  - 存货周转率\n\
  \  - 应收账款周转天数\n  - 应付账款周转天数\n\n\n\n### 处理生态系统\n\n五年前，VKHCG 将其集中处理需求转移至 Vermeulen\
  \ PLC，作为集团服务执行数据科学，从而整合了其处理能力。这导致其他集团公司承担了集团 20%的业务活动；然而，合并后集团业务活动中 90%的数据处理工作被重新分配给了核心团队。自那时起，Vermeulen\
  \ 已将 `Spark`、`Python`、`Mesos`、`Akka`、`Cassandra`、`Kafka`、`elastic search` 和 `MQTT`（MQ\
  \ 遥测传输）处理整合为一个集团服务提供商和处理实体。\n\n在示例中，我将使用 `R` 或 `Python` 进行数据处理。我还将讨论互补技术，并就您在自己的环境中应考虑和请求的内容提供建议。\n\
  \n**注意：** 互补技术在数据科学环境中经常使用。尽管我简要介绍了它们，但这并不意味着它们不重要。\n\nVKHCG 在 80%的公司业务活动中使用 `R`\
  \ 处理引擎进行数据处理，其余 20%由 `Python` 完成。因此，我们将准备一个 `R` 和一个 `Python` 环境来执行示例。如果您因为特定的业务需求需要这些额外的环境，我将快速告知您如何获取它们。\n\
  \n我将简要介绍示例中未使用但已知有益的技术。\n\n### Scala\n\n`Scala` 在数据科学界很受欢迎，因为它支持大规模并行处理。您可以从以下核心网站安装该语言：[`www.scala-lang.org/download/`](http://www.scala-lang.org/download/)。提供了速查表和参考资料，可引导您找到帮助掌握此编程语言的资源。\n\
  \n**注意：** 我的许多大客户正在使用 `Scala` 作为他们的战略性开发语言。\n\n### Apache Spark\n\n`Apache Spark`\
  \ 是一个用于大规模数据处理的快速通用引擎，目前是大型数据科学项目中增长最快的处理引擎。您可以从以下核心网站安装该引擎：[`http://spark.apache.org/`](http://spark.apache.org/)。对于大型项目，我在\
  \ `DataStax Enterprise` ([`www.datastax.com`](http://www.datastax.com))、`Hortonworks`\
  \ ([`https://hortonworks.com/`](https://hortonworks.com/))、`Cloudera` ([`www.cloudera.com/`](http://www.cloudera.com/))\
  \ 和 `MapR` ([`https://mapr.com/`](https://mapr.com/)) 中使用 `Spark` 环境。\n\n**注意：**\
  \ `Spark` 现在是规模化数据处理中最受欢迎且最抢手的通用处理引擎，其支持与日俱增。如果您希望在规模化数据科学领域发展职业生涯，我建议您掌握此引擎。\n\n\
  ### Apache Mesos\n\n`Apache Mesos` 从机器（物理或虚拟）中抽象出 CPU、内存、存储和其他计算资源，使容错且弹性的分布式系统能够轻松地构建并有效运行处理解决方案。它在业界已被证明可扩展到数万个节点。这使数据科学家能够以高效的方式运行大规模并行分析和处理。处理环境可从以下核心网站获取：[`http://mesos.apache.org/`](http://mesos.apache.org/)。我想特别提一下\
  \ `Mesosphere Enterprise DC/OS`，因为我在许多项目中都使用它。详情请参阅 [`https://mesosphere.com`](https://mesosphere.com)。\n\
  \n**注意：** `Mesos` 是一种经济高效的处理方法，支持规模化处理环境中不断增长的动态处理需求。\n\n### Akka\n\n`Akka` 支持构建强大的并发和分布式应用程序，以执行大规模并行处理，同时共享公共的规模化处理平台。您可以从以下核心网站安装该引擎：[`http://akka.io/`](http://akka.io/)。我在\
  \ `Mesosphere Enterprise DC/OS` 环境中使用 `Akka` 处理。\n\n### Apache Cassandra\n\n`Apache\
  \ Cassandra` 数据库在不牺牲性能的前提下提供可扩展性和高可用性支持。它具有线性可扩展性和良好的容错性，被众多大型公司广泛使用。您可以从以下核心网站安装该引擎：[`http://cassandra.apache.org/`](http://cassandra.apache.org/)。\n\
  \n我在 `Mesosphere Enterprise DC/OS` 环境中使用 `Cassandra` 处理，并使用 `DataStax Enterprise`\
  \ 进行我的 `Cassandra` 安装。\n\n**注意：** 我建议您将 `Cassandra` 视为一种规模化数据库，因为它以稳定的数据处理能力支持数据科学环境。\n\
  \n### Kafka\n\n`Kafka` 用于构建实时数据管道和流式应用。它具有水平可扩展性、容错性且速度惊人。您可以从以下核心网站安装该引擎：[`http://kafka.apache.org/`](http://kafka.apache.org/)。我在\
  \ `Mesosphere Enterprise DC/OS` 环境中使用 `Kafka` 处理来处理进入我数据科学环境的数据。\n\n**注意：** 我建议您将\
  \ `Kafka` 视为一种数据传输工具，因为它以强大的数据收集设施支持数据科学环境。\n\n### 消息队列遥测传输\n\n消息队列遥测传输（MQTT）是一种机器对机器（M2M）和物联网连接协议。它是一种特别轻量级的发布/订阅消息传输协议。它能够连接到代码占用空间小且网络带宽不足是通信障碍的位置。详情请参阅\
  \ [`http://mqtt.org/`](http://mqtt.org/)。\n\n**注意：** 此协议在传感器环境中很常见，因为它提供了传感器所需的小代码占用空间和较低带宽。\n\
  \n现在我已经介绍了您应该了解但不会在示例中使用的项目，让我们来看看您将实际用到的东西。\n\n## 示例生态系统\n\n示例需要以下环境。VKHCG 环境中需要的两种设置是\
  \ `Python` 和 `R`。\n\n### Python\n\n`Python` 是由 Guido van Rossum 创建并于 1991 年首次发布的高级编程语言。如今，它的声誉日益增长，因为各种培训机构都将该语言作为其数据科学课程的一部分。\n\
  \n我建议您安装 `Anaconda`，以增强您的 `Python` 开发。它是 `Python` 的一个开源发行版，简化了功能包的管理和部署（请参阅 [`www.continuum.io/downloads`](http://www.continuum.io/downloads)）。\n\
  \n### Ubuntu\n\n我使用 `Ubuntu` 桌面和服务器安装来执行数据科学（请参阅 [`www.ubuntu.com/`](http://www.ubuntu.com/)），如下所示：\n\
  \n```\nsudo apt-get install python3 python3-pip python3-setuptools\n```\n\n### CentOS/RHEL\n\
  \n如果您想使用 `CentOS/RHEL`，我建议您采用以下安装过程：\n\n```\nsudo yum install python3 python3-pip\
  \ python3-setuptools\n```\n\n### Windows\n\n如果您想使用 `Windows`，我建议您采用以下安装过程：\n\n从\
  \ [`www.python.org/downloads/windows/`](http://www.python.org/downloads/windows/)\
  \ 下载软件。\n\n### Python3 就绪了吗？\n\n安装完成后，您必须按如下方式测试您的环境：\n\n```\npython3 --version\n\
  ```\n\n成功后，您应该会看到类似这样的响应：\n\n```\nPython 3.4.3+\n```\n\n恭喜，`Python` 现在已准备就绪。\n\n\
  \n\n#### [P](https://www.python.org/)ython 库\n\nPython 最显著的特性之一是其丰富的库，这些库广泛可用，让你能够轻松将经过验证的数据科学流程集成到自己的环境中。\n\
