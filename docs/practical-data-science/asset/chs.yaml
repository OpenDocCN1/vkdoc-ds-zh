  就本章而言，我将在此时将数据仓库介绍为一种数据结构，它采用结构化设计来存储具有完整历史记录的数据。数据仓库的基本要素是枢纽、卫星和链接。关于结构以及如何构建数据仓库的完整细节将在第
  9 章（涵盖流程超步骤）中解释。


