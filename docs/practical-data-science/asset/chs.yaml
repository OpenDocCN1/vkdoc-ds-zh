  这些工具会移除与维护计划和数据库备份文件相关的工件。我将在第 6 章中详细讨论这些工具。


  ### 通知操作员工具


  向运维团队发送系统状态通知消息的工具对于任何数据科学工厂都至关重要。这些工具将在第 6 章中详细讨论。


