- '# R 与 Spark 的融合


  我想讨论另一个包，因为我认为掌握它是你处理当前及未来数据科学工作所需的一项重要技能。这个包将 R 环境与分布式 Spark 环境相连接，并为 Spark 内置的机器学习算法提供了一个接口。我的许多客户都在使用
  Spark 作为其数据环境的标准接口。


  理解这种协作能使你支持大规模环境的处理，而无需对 R 处理代码进行重大修改。文档地址位于 [`https://cran.r-project.org/web/packages/sparklyr/sparklyr.pdf`](https://cran.r-project.org/web/packages/sparklyr/sparklyr.pdf)。关于该包的最新信息，请参阅
  [`https://CRAN.R-project.org/package=sparklyr`](https://cran.r-project.org/package=sparklyr)。


  要安装该包，建议你打开 RStudio IDE 并使用以下命令：


  ```

  install.packages("sparklyr")

  ```


  `sparklyr` 是 Apache Spark 的一个直接 R 接口，旨在提供一个完整的 `dplyr` 后端。一旦 Spark 数据集的过滤和聚合操作在下游的大规模环境中完成，该包就会将数据导入
  R 环境进行分析和可视化。


