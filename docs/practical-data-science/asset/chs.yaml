  \n## 评估步骤\n\n数据质量指的是一组定性或定量变量的状况。数据质量是衡量特定数据集可接受性的一个多维指标。在商业中，衡量数据质量是为了确定数据是否可以作为可靠情报提取的基础，以支持组织决策。\n\
