  #### 车辆


  国际车辆分类是一个复杂的过程。虽然有标准，但这些标准并未在全球范围内统一应用，不同群体或国家之间也存在差异。例如，我的凯迪拉克凯雷德 ESV 四驱白金版按市场细分（美式英语）属于：


  *   “全尺寸 SUV 皮卡”

  *   “大型 4×4”（英式英语）

  *   “超大型 SUV”（澳式英语）

  *   “标准运动型多用途车”（美国环保署尺寸等级）

  *   “越野车”（欧洲 NCAP 结构类别）

  *   “大型越野 4×4”（1997–2009 年欧洲 NCAP 等级）

  *   “J 级运动型多用途轿车”（欧洲市场细分）

  *   “豪华旅行车”（美国公路安全保险协会分类）


  要精确分类我的车辆，我需要车辆识别码（VIN）。一个唯一的 VIN 能为数据科学家提供大量的分类细节。车辆有两个标准：ISO 3779:2009（道路车辆—VIN—内容与结构）和
  ISO 3780:2009（道路车辆—世界制造商识别码[WMI]代码）。我发现两者结合可以很好地分类车辆，也就是说，我可以解码 VIN。


  VIN: 1HGBH41JXMN109186


  *   型号：Prelude

  *   类型：乘用车

  *   品牌：本田

  *   车型年份：1991 年

  *   制造商：本田美国制造有限公司

  *   制造地：美国（北美）

  *   序列号：109186

  *   车身类型：双门轿跑车

  *   车辆类型：乘用车


  **警告**


  车辆的车牌或标签并非该车辆的唯一标识。存在属于个人而非车辆的车牌号。这会导致不同车辆在不同时期使用相同车牌号的情况。当车辆转售时，新车主也可能获得新的车牌号。因此，**不要**使用车牌号作为唯一键。


  作为一名数据科学家，你必须理解可以从被记录对象的简单代码和分类中推断出的数据。


