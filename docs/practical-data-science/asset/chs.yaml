  \ 15 万美元，那么他就是富人；否则就是穷人。这种“富”或“穷”的二元分类是行不通的，因为一个收入约为 14.5 万美元的人难道就是穷人吗？\n\n欠拟合则是指数据科学家将结果转化为数据洞察时过于笼统，导致预测模型在一定程度上应用不当，或其洞察力值得怀疑。例如，你的性别分类器判断一个人性别的成功率为\
  \ 48%。这永远行不通，因为对于二元猜测问题，仅凭随机猜测就能达到 50%的准确率。\n\n你的数据科学工作必须提供显著的洞察力水平，才能赢得客户的信任，从而使他们能够基于你提供的洞察，自信地做出商业决策。\n\
