  \n\n\n### 假设检验\n\n假设检验并非严格意义上的算法，但它是每位数据科学家必须掌握的知识。若未透彻理解此技术，便无法取得进展。\n\n假设检验是利用数据，通过统计检验来验证假设是否成立的过程。基于假设检验的结果，数据科学家选择接受或拒绝该假设。当某个事件发生时，它可能是一种趋势，也可能是偶然发生的。为了判断该事件是重要现象还是纯属偶然，就必须进行假设检验。\n\
  \n假设检验有多种方法，但以下两种最为常用。\n\n### T 检验\n\nT 检验是一种常用的统计检验，用于对单一均值或两个均值/方差进行推断，以检验两组均值是否存在统计上的显著差异。其适用条件为样本量`n\
  \ < 30`且标准差未知。如需更多关于 T 检验的信息，请参阅`https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.t.html#scipy.stats.t`和`https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ttest_ind.html`。\n\
  \n示例：\n\n首先，设置运行环境，如下所示：\n\n```python\nimport numpy as np\nfrom scipy.stats import\
  \ ttest_ind, ttest_ind_from_stats\nfrom scipy.special import stdtr\n```\n\n创建一组“未知”数据。（这可以是你想分析的数据集。）以下示例包含五个随机数据集。你可以通过设置`nSet`等于\
  \ 1、2、3、4 或 5 来选择它们。\n\n```python\nnSet=1\nif nSet==1:\n    a = np.random.randn(40)\n\
  \    b = 4*np.random.randn(50)\nif nSet==2:\n    a=np.array([27.1,22.0,20.8,23.4,23.4,23.5,25.8,22.0,24.8,20.2,21.9,22.1,22.9,20.5,24.4])\n\
  \    b=np.array([27.1,22.0,20.8,23.4,23.4,23.5,25.8,22.0,24.8,20.2,21.9,22.1,22.9,20.5,24.41])\n\
  if nSet==3:\n    a=np.array([17.2,20.9,22.6,18.1,21.7,21.4,23.5,24.2,14.7,21.8])\n\
