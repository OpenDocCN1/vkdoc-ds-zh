  LatitudeBinMeans = [LatitudeData[LatitudeDigitized == i].mean() for i in range(1,\
  \ len(LatitudeBins))]\nLongitudeBinMeans = [LongitudeData[LongitudeDigitized ==\
  \ i].mean() for i in range(1, len(LongitudeBins))]\n```\n\n做得好。你现在有了三个纬度箱和四个经度箱。\n\
  \n```\nprint(LatitudeBinMeans)\nprint(LongitudeBinMeans)\n```\n\n你也可以使用 `histogram`\
