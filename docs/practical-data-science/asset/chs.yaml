  | Country_from | Place_Name_from | Latitude_from | Longitude_from | Country_to |
  Place_Name_to | Latitude_to | Longitude_to | DistanceBetweenKilometers | DistanceBetweenMiles
  |

  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

  | US | New York | 40.7528 | -73.9725 | US | New York | 40.7528 | -73.9725 | 0 |
  0 |

  | US | New York | 40.7528 | -73.9725 | US | New York | 40.7214 | -74.0052 | 4.448
  | 2.762 |


  所以，纽约（40.7528, -73.9725）到纽约（40.7214, -74.0052）之间的距离是 4.45 公里，即 2.77 英里。


