  clf.fit(X1)

  Z1 = clf.decision_function(np.c_[xx1.ravel(), yy1.ravel()])

  Z1 = Z1.reshape(xx1.shape)

  legend1[clf_name] = plt.contour(

  xx1, yy1, Z1, levels=[0], linewidths=2, colors=colors[i])

