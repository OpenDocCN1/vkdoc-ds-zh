  ```\n\n一个真实的例子是拉夫拉斯伯爵夫人阿达，她出生时的名字是奥古斯塔·阿达·金-诺尔。她是一位英国数学家和作家，主要因在查尔斯·巴贝奇提出的机械通用计算机——分析机上的工作而闻名。她出生于\
  \ 1815 年 12 月 10 日。\n\n- 名 = 奥古斯塔\n- 中间名 = 阿达·金-诺尔\n- 姓 = 拉夫拉斯\n- 出生日期 = 1815-10-10\
  \ 00:00:00\n\n你应使用她出生证明上的官方姓名，而非她的通用名。你可以添加一个名为`CommonKnownAs`的附属表，并将`阿达·拉夫拉斯`放入该表中。\n\
  \n注意：下一节将介绍我在世界各地工作时发现的一些有趣概念。它将让你深入了解数据科学家在执行工作时可能遇到的多样性需求。\n\n#### 人名的含义\n\n我们都有名字，而我们的名字为数据科学家提供了更大的分组，甚至隐藏的含义。如果人们共享相同的姓氏，那么他们之间存在亲缘关系的概率就很大。我稍后会再次讨论这一点。在世界各地，还有许多与人们的名字相关的其他关系。让我们看看我在多年处理数据过程中接触到的一些例子。\n\
  \n\n\n# 个人名字的构成与文化差异\n\n## [给定名、母名和父名](https://www.w3.org/International/questions/qa-personal-names%23patronymic)\
  \ 的含义\n\n人们的名字中可能蕴含着特定的关系或含义。冰岛名字`Björk Guðmundsdóttir`就表达了个体与其家庭成员之间复杂的关系。\n\n\
  `Björk`是此人的名字。`Guðmundsdóttir`表示一种关系：`Guðmundur`的女儿（`-dóttir`）。这表明此人是女性。\n\n`Björk`的父亲是`Guðmundur\
  \ Gunnarsson`。这是最常见的命名方式。\n\n`Björk`也可能拥有以下母名：`Hildardottir`，甚至同时拥有母名和父名：`Hildar-\
  \ og Guðmundsdóttir`，因为`Björk`的母亲是`Hildur R’una Hauksdottir`。\n\n`Gunnarsson`表示“`Gunnar`之子”的关系。因此，`Ólafur\
  \ Guðmundsson`是`Björk`的兄弟。`Ólafur`的儿子是`Jón Ólafurson`。\n\n我刚刚推翻了自己先前的假设。不同的姓氏同样可以表示同一家族的成员！\n\
  \n> **注意**\n>\n> 不要认为在你所在国家行之有效的算法和假设，在所有其他国家也能同样成功。\n\n马来名字`Isa bin Osman`也暗示了一种隐藏的关系。`Isa`是给定名。`bin\
  \ Osman`表示“`Osman`之子”。`Isa`的姐妹会是`Mira binti Osman`，因为`binti`意为“之女”。\n\n`Encik Isa`意为“`Isa\
  \ bin Osman`先生”，但写这个名字的人与`Isa`本人相熟。因此，如果你与`Isa`不熟，就不要称呼他为`Encik Isa`。\n\n以下是一些需要注意的其他命名惯例。\n\
  \n| 语言 | “之子”后缀 | “之女”后缀 |\n| --- | --- | --- |\n| 古诺尔斯语 | `-son` | `-dóttir` |\n\
  | 丹麦语 | `-sen` | `-datter` |\n| 法罗语 | `-son` | `-dóttir` |\n| 芬兰语 | `-poika` | `-tytär`\
  \ |\n| 冰岛语 | `-son -sson` | `-dóttir` |\n| 挪威语 | `-sen/-son/-søn` | `-datter/-dotter`\
  \ |\n| 瑞典语 | `-son` | `-dotter` |\n\n## [名字各部分的不同顺序](https://www.w3.org/International/questions/qa-personal-names%23partorder)\n\
  \n全名并不总是按名字、中间名和姓氏的顺序排列。例如，在中国名字`毛泽东`（`Mao Zedong`）中，姓氏（家族名）是`毛`（`Mao`）。中间的字`泽`（`Ze`）是辈分字，同一家族的所有兄弟姐妹都共享此字。根据规范中文音译为英文的拼音系统，中文名字的后两个字或元素通常合并为一个词，例如`Zedong`，而不是`Ze\
  \ Dong`。毛泽东的兄弟姐妹是`毛泽民`（`Mao Zemin`）、`毛泽覃`（`Mao Zetan`）和`毛泽紅`（`Mao Zehong`）。\n\n\
  > **注意**\n>\n> 在音译中，“`Ze Dong`”这种写法很少（如果有的话）被使用。\n\n对于那些与他关系不熟的人，毛泽东可能被称为`毛泽东先生`（`Mao\
  \ Zedong xiānshēng`）或`毛先生`（`Mao xiānshēng`）（`xiānshēng`相当于“先生”）。如果你与一位叫`毛泽东`的人关系熟络，你通常会称他为`泽东`（`Zedong`），而不仅仅是`东`（`Dong`）。\n\
  \n在日本、韩国和匈牙利，名字的顺序是姓氏在前，跟随后面的给定名。\n\n> **注意**\n>\n> 与西方人打交道的中国人通常会另外取一个西方人更容易使用的名字。`姚明`（姓氏`姚`，名字`明`）也为西方人将自己的名字呈现为`Fred\
  \ Yao Ming`或`Fred Ming Yao`。\n\n对于讲西班牙语的人来说，拥有两个姓氏是很常见的。例如，`María-Jose Carreño Quiñones`指的是`Antonio\
  \ Carreño Rodríguez`和`María Quiñones Marqués`的女儿。你应该称呼她为`Señorita Carreño`，而不是`Señorita\
  \ Quiñones`。\n\n巴西人有类似的习俗，他们可能会有三到四个姓氏，将祖先的名字串联起来，例如`José Eduardo Santos Tavares\
  \ Melo Silva`。通常，两个西班牙语姓氏的顺序是父姓+母姓，而在巴西，葡萄牙语名字的顺序是母姓+父姓。然而，这个顺序可能会改变，这常常让数据科学家感到困惑。\n\
  \n> **注意**\n>\n> 有些名字在姓氏之间包含小品词，如`de`或`e`，例如`Carreño de Quiñones`或`Tavares e Silva`。\n\
  \n俄罗斯人使用父名作为他们的中间名，但也使用姓氏，顺序为给定名+父名+姓氏。父名和姓氏的词尾表明了此人是男性还是女性。例如，`Бopиc Hикoлaeвич\
  \ Eльцин`（`Boris Nikolayevich Yeltsin`）的妻子是`Haинa Иocифoвнa Eльцинa`（`Naina Iosifovna\
  \ Yeltsina`）。\n\n> **注意**\n>\n> 根据俄罗斯命名惯例，男性的名字以辅音结尾，而女性的名字（甚至父名）以`a`结尾。这一俄罗斯命名惯例适用于所有男性和女性，而不仅仅是已婚者。\n\
  \n## [名字的继承](https://www.w3.org/International/questions/qa-personal-names%23inheritance)\n\
  \n认为同一核心家庭成员共享相同姓氏是错误的。在西方，已婚女性婚后保留自己娘家姓的趋势日益增长。然而，在另一些文化中，例如中国文化，这本身就是标准做法。在一些国家，已婚女性可能会或可能不会随夫姓。例如，如果之前提到的马来女孩`Zaiton`嫁给了`Isa`，她可能仍然是`Zaiton`女士，或者她可能会选择成为`Zaiton\
  \ Isa`，在这种情况下，你可以称呼她为`Isa`女士。\n\n对于数据科学家来说，这些数据特征可能使得数据分组变得复杂。\n\n\n\n#### 其他亲属关系\n\
  \n荷兰文化有其自身的命名惯例。其遵循的规则如下：\n\n-   长子以祖父的名字命名。\n-   长女以祖母的名字命名。\n-   次子以外祖父的名字命名。\n\
  -   次女以外祖母的名字命名。\n-   后续出生的孩子常以叔伯或姑姨的名字命名。\n\n然而，如果某个儿子在其弟弟出生前已去世，弟弟通常会沿用已故兄长的名字。女儿的情况也是如此。如果父亲在儿子出生前去世，儿子会随父亲的名字命名。如果母亲在生下女儿时去世，女儿会随母亲的名字命名。\n\
  \n我曾通过一个数据集艰难地发现，荷兰人的名字存在这种结构——当时我们在找到一份死亡证明后，标记了一个人已故。在非荷兰裔家庭中，不常见在同辈人中重复使用已故者的名字，我们的数据科学程序总是将其标记为错误。因此，当我们将系统从美国迁移到欧洲时，不得不移除这个错误规则，以解决这种文化上的不一致。\n\
  \n荷兰人的名字还与出生地或家族职业有历史和文化上的关联。\n\n例如，`Vermeulen` 是荷兰姓氏 `ver Meulen` 的一种比利时变体，它表示我的家族“来自遥远的磨坊”，或者从事“流动磨坊主”这一职业。因此，我的家族纹章上绘有风车。\n\
  \n按照荷兰传统，过去结婚时，女性需要将丈夫的姓氏放在自己的[娘家姓](https://en.wikipedia.org/wiki/Maiden_name%23Maiden%20name)之前，并用连字符连接。例如，一位\
  \ `Anna Pietersen` 嫁给 `Jan Jansen` 后会变成 `Anna Jansen-Pietersen`。荷兰现行的法律给予了人们更多自由。在荷兰境内结婚时，双方默认保留自己的姓氏，但双方都可以选择合法地使用对方的姓氏，或者将两者结合。简单来说，`Anna\
  \ Pietersen`、`Jan Pietersen`、`Anna Jansen`、`Jan Jansen`、`Anna Jansen-Pietersen`\
  \ 和 `Jan Jansen-Pietersen` 都可能是同一对夫妻在不同时期使用的名字。\n\n这些姓氏的变体及其附加含义，能够使数据科学家仅仅通过使用人们姓名，就能训练他们的算法来发现人与人之间的关系。我已经和您分享了一些我在多个国家工作多年期间的有趣发现。为了本书的目的，我会保持人物名字的简洁，并遵循西方名字（名+姓）的惯例。\n\
