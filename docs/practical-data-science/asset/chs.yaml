  让我们为你的强盗构建一个模型。这里有四个独臂强盗，当前，强盗 4 被设置为最常提供正向奖励。


  ```

  bandits = [0.2,0.0,-0.2,-2.0]

  num_bandits = len(bandits)

  ```


  你必须通过创建一个拉杆行动来建模强盗。


  ```

  def pullBandit(bandit):

  '
- '# 获取一个随机数。

  result = np.random.randn(1)

  if result > bandit:

  '
- '# 返回一个正向奖励。

  return 1

  else:

  '
- '# 返回一个负向奖励。

  return -1

  ```


  现在，重置生态系统。


  ```

  tf.reset_default_graph()

  ```


  你需要以下两行来建立网络的前馈部分。你使用此公式执行实际的选择。


  ```

  weights = tf.Variable(tf.ones([num_bandits]))

  chosen_action = tf.argmax(weights,0)

  ```


  接下来的六行建立了训练流程。你将奖励和所选行动输入网络，通过计算损失并使用它来更新网络。


  ```

  reward_holder = tf.placeholder(shape=[1],dtype=tf.float32)

  action_holder = tf.placeholder(shape=[1],dtype=tf.int32)

  responsible_weight = tf.slice(weights,action_holder,[1])

  loss = -(tf.log(responsible_weight)*reward_holder)

  optimizer = tf.train.GradientDescentOptimizer(learning_rate=0.001)

  update = optimizer.minimize(loss)

  ```


  现在，你必须训练系统使其表现得像一个独臂强盗。


  ```

  total_episodes = 1000 # 设置训练强盗的总轮数。

  total_reward = np.zeros(num_bandits) # 将强盗的得分板设置为 0。

  e = 0.1 # 设置采取随机行动的概率。

  ```


  立即初始化生态系统。


  ```

  init = tf.initialize_all_variables()

  ```


  启动 `TensorFlow` 图处理。


  ```

  with tf.Session() as sess:

  sess.run(init)

  i = 0

  while i < total_episodes:

  '
- "# 选择随机行动或来自网络的行动。\nif np.random.rand(1) < e:\naction = np.random.randint(num_bandits)\n\
  else:\naction = sess.run(chosen_action)\nreward = pullBandit(bandits[action])\n\
  ```\n\n从选择一个强盗处收集你的奖励并更新网络。\n\n```\n_,resp,ww = sess.run([update,responsible_weight,weights],\
  \ feed_dict={reward_holder:[reward],action_holder:[action]})\n```\n\n更新你的运行得分。\n\
  \n```\ntotal_reward[action] += reward\nif i % 50 == 0:\nprint (f\"目前 {num_bandits}\
  \ 个强盗的运行奖励: {total_reward}\")\ni+=1\nprint (f\"代理人认为强盗 {np.argmax(ww)+1} 最有潜力....\"\
  )\nif np.argmax(ww) == np.argmax(-np.array(bandits)):\nprint (\"...而且它是对的！\")\n\
  else:\nprint (\"...而且它错了！\")\n```\n\n恭喜！你拥有了一个功能完备的 `TensorFlow` 解决方案。你能想到三个可以使用此生态系统建模的现实生活例子吗？\n\
  \n### TensorFlow 的现实世界用途\n\n在过去的 12 个月里，我已将 `TensorFlow` 流程用于以下三个模型：\n\n-   购物篮分析：人们买什么？他们一起买什么？\n\
  -   外汇交易：根据公司需求提供何时购买外汇的建议。\n-   大宗商品交易：买卖期货。\n\n\n\n#### 单臂老虎机（情境版本）\n\n想尝试更复杂的老虎机吗？我准备了下述示例，一起来玩一玩吧。\n\
  \n打开你的 Python 编辑器，创建以下生态系统：\n\n```python\nimport tensorflow as tf\nimport tensorflow.contrib.slim\
  \ as slim\nimport numpy as np\n```\n\n创建情境老虎机。\n\n```python\nclass contextual_bandit():\n\
  \    def __init__(self):\n        self.state = 0\n        #列出我们的老虎机。\n        self.bandits\
  \ = np.array([\\\n            [0.4,0,-0.0,-8],\\\n            [0.9,-55,1,0.75],\\\
  \n            [-15,5,9,5],\\\n            [-5,1,9,55],\\\n            [15,51,9,5],\\\
  \n            [-15,51,9,55],\\\n            [-5,51,99,55],\\\n            [-65,51,9,55],\\\
  \n            [0.9,-55,1,0.75]\\\n        ])\n        self.num_bandits = self.bandits.shape[0]\n\
  \        self.num_actions = self.bandits.shape[1]\n```\n\n创建老虎机。\n\n```python\n\
  \    def getBandit(self):\n        self.state = np.random.randint(0,len(self.bandits))\
  \ #为每一轮返回一个随机状态。\n        return self.state\n```\n\n创建拉臂动作。\n\n```python\n    def\
  \ pullArm(self,action):\n        #获取一个随机数。\n        bandit = self.bandits[self.state,action]\n\
  \        result = np.random.randn(1)\n        if result > bandit:\n            #返回正向奖励。\n\
  \            return 1\n        else:\n            #返回负向奖励。\n            return -1\n\
  ```\n\n配置老虎机的规则。\n\n```python\nclass agent():\n    def __init__(self, lr, s_size,a_size):\n\
  \        #这几行建立了网络的前馈部分。智能体接收一个状态并产生一个动作。\n        self.state_in= tf.placeholder(shape=[1],dtype=tf.int32)\n\
  \        state_in_OH = slim.one_hot_encoding(self.state_in,s_size)\n        output\
  \ = slim.fully_connected(state_in_OH,a_size,\\\n            biases_initializer=None,activation_fn=tf.nn.sigmoid,weights_initializer=tf.ones_initializer())\n\
  \        self.output = tf.reshape(output,[-1])\n        self.chosen_action = tf.argmax(self.output,0)\n\
  ```\n\n接下来的六行建立了训练流程。再次将奖励和所选动作输入网络。\n\n```python\n        #用于计算损失，并以此更新网络。\n  \
  \      self.reward_holder = tf.placeholder(shape=[1],dtype=tf.float32)\n       \
  \ self.action_holder = tf.placeholder(shape=[1],dtype=tf.int32)\n        self.responsible_weight\
  \ = tf.slice(self.output,self.action_holder,[1])\n        self.loss = -(tf.log(self.responsible_weight)*self.reward_holder)\n\
  \        optimizer = tf.train.GradientDescentOptimizer(learning_rate=lr)\n     \
  \   self.update = optimizer.minimize(self.loss)\n```\n\n现在训练你的智能体。\n\n```python\n\
  tf.reset_default_graph() #清空 Tensorflow 图。\ncBandit = contextual_bandit() #加载老虎机。\n\
  myAgent = agent(lr=0.001,s_size=cBandit.num_bandits,a_size=cBandit.num_actions)\
  \ #加载智能体。\nweights = tf.trainable_variables()[0] #我们将评估的权重，用于观察网络内部。\ntotal_episodes\
  \ = 10000 #设置训练智能体的总轮数。\ntotal_reward = np.zeros([cBandit.num_bandits,cBandit.num_actions])\
  \ #将老虎机的计分板归零。\ne = 0.1 #设置采取随机动作的概率。\ninit = tf.initialize_all_variables()\n```\n\
  \n启动 TensorFlow 图。\n\n```python\nwith tf.Session() as sess:\n    sess.run(init)\n\
  \    i = 0\n    while i < total_episodes:\n        s = cBandit.getBandit() #从环境中获取一个状态。\n\
  \        #选择随机动作或来自网络的动作。\n        if np.random.rand(1) < e:\n            action\
  \ = np.random.randint(cBandit.num_actions)\n        else:\n            action =\
  \ sess.run(myAgent.chosen_action,feed_dict={myAgent.state_in:[s]})\n        reward\
  \ = cBandit.pullArm(action) #根据老虎机采取动作后获得奖励。\n        #更新网络。\n        feed_dict={myAgent.reward_holder:[reward],myAgent.action_holder:[action],myAgent.state_in:[s]}\n\
  \        _,ww = sess.run([myAgent.update,weights], feed_dict=feed_dict)\n      \
  \  #更新我们的实时得分记录。\n        total_reward[s,action] += reward\n        if i % 500 ==\
  \ 0:\n            print (\"Mean reward for each of the \" + str(cBandit.num_bandits)\
  \ + \" bandits: \" + str(np.mean(total_reward,axis=1)))\n        i+=1\n    for a\
  \ in range(cBandit.num_bandits):\n        print (\"The agent thinks action \" +\
  \ str(np.argmax(ww[a])+1) + \" for bandit \" + str(a+1) + \" is the most promising....\"\
  )\n        if np.argmax(ww[a]) == np.argmin(cBandit.bandits[a]):\n            print\
  \ (\"...and it was right!\")\n        else:\n            print (\"...and it was\
  \ wrong!\")\n```\n\n你能理解该过程如何帮助你模拟现实活动吗？\n\n#### 处理容器上的数字\n\n这是一个更实际的应用程序。你需要识别希尔曼有限公司爱丁堡仓库的货运场中移动的容器侧面的数字。由于大多数时间都在下雨，当容器经过摄像头记录数字时，扫描设备无法产生最佳图像。你能解决识别数字的问题吗？\n\
  \n打开你的 Python 编辑器，创建以下生态系统：\n\n```python\nimport tensorflow as tf\nfrom tensorflow.examples.tutorials.mnist\
  \ import input_data\nmnist = input_data.read_data_sets(\"MNIST_data/\", one_hot=True)\n\
  ```\n\n你必须设置这些优化变量。之后你可以尝试不同的数值，以了解它们对结果的影响。\n\n```python\nlearning_rate = 0.5\n\
  epochs = 10\nbatch_size = 100\n```\n\n你必须声明训练数据格式。设置输入 `x`——对于 28 `×` 28 像素 = 784。\n\
  \n```python\nx = tf.placeholder(tf.float32, [None, 784])\n```\n\n现在声明输出数据占位符——十个数字\n\
  \n```python\ny = tf.placeholder(tf.float32, [None, 10])\n```\n\n声明连接输入层到隐藏层的权重。是的，你猜对了；这是一个神经网络。\n\
  \n```python\nW1 = tf.Variable(tf.random_normal([784, 300], stddev=0.03), name=\"\
  W1\")\nb1 = tf.Variable(tf.random_normal([300]), name=\"b1\")\n```\n\n现在添加连接隐藏层到输出层的权重。\n\
  \n```python\nW2 = tf.Variable(tf.random_normal([300, 10], stddev=0.03), name=\"\
  W2\")\nb2 = tf.Variable(tf.random_normal([10]), name=\"b2\")\n```\n\n计算隐藏层的输出。\n\
  \n```python\nhidden_out = tf.add(tf.matmul(x, W1), b1)\nhidden_out = tf.nn.relu(hidden_out)\n\
  ```\n\n使用 Softmax 回归激活的输出层。\n\n```python\ny_ = tf.nn.softmax(tf.add(tf.matmul(hidden_out,\
  \ W2), b2))\ny_clipped = tf.clip_by_value(y_, 1e-10, 0.9999999)\ncross_entropy =\
  \ -tf.reduce_mean(tf.reduce_sum(y * tf.log(y_clipped)\n    + (1 - y) * tf.log(1\
  \ - y_clipped), axis=1))\n```\n\n你需要添加一个优化器。\n\n```python\noptimizer = tf.train.GradientDescentOptimizer(learning_rate=learning_rate).minimize(cross_entropy)\n\
  ```\n\n接下来，设置初始化操作符。\n\n```python\ninit_op = tf.global_variables_initializer()\n\
  ```\n\n设置准确率评估操作。\n\n```python\ncorrect_prediction = tf.equal(tf.argmax(y, 1), tf.argmax(y_,\
  \ 1))\naccuracy = tf.reduce_mean(tf.cast(correct_prediction, tf.float32))\n```\n\
  \n现在你只需要启动会话即可。\n\n```python\nwith tf.Session() as sess:\n    # 初始化变量\n    sess.run(init_op)\n\
  \    total_batch = int(len(mnist.train.labels) / batch_size)\n    for epoch in range(epochs):\n\
  \        avg_cost = 0\n        for i in range(total_batch):\n            batch_x,\
  \ batch_y = mnist.train.next_batch(batch_size=batch_size)\n            _, c = sess.run([optimiser,\
  \ cross_entropy],\n                feed_dict={x: batch_x, y: batch_y})\n       \
  \     avg_cost += c / total_batch\n        print(\"Epoch:\", (epoch + 1), \"cost\
  \ =\", \"{:.3f}\".format(avg_cost))\n    print(sess.run(accuracy, feed_dict={x:\
  \ mnist.test.images, y: mnist.test.labels}))\n```\n\n你能看出 TensorFlow 如何帮助你轻松构建复杂操作吗？\n\
  \n\n\n#### 使用 TensorFlow 进行线性回归\n\n你是否觉得用 TensorFlow 执行线性回归已经得心应手了？打开你的 Python 编辑器，并创建以下环境：\n\
  \n```python\nimport tensorflow as tf\nimport numpy\nimport matplotlib.pyplot as\
  \ plt\nrng = numpy.random\n```\n\n设置参数。\n\n```\nlearning_rate = 0.01\ntraining_epochs\
  \ = 10000\ndisplay_step = 50\n```\n\n获取训练数据。\n\n```\ntrain_X = numpy.asarray([3.3,4.4,5.5,6.71,6.93,4.168,9.779,6.182,7.59,2.167,\n\
  7.042,10.791,5.313,7.997,5.654,9.27,3.1])\ntrain_Y = numpy.asarray([1.7,2.76,2.09,3.19,1.694,1.573,3.366,2.596,2.53,1.221,\n\
  2.827,3.465,1.65,2.904,2.42,2.94,1.3])\nn_samples = train_X.shape[0]\n```\n\n设置\
  \ TensorFlow 的计算图输入。\n\n```\nX = tf.placeholder(\"float\")\nY = tf.placeholder(\"\
  float\")\n```\n\n设置模型权重。\n\n```\nW = tf.Variable(rng.randn(), name=\"weight\")\n\
  b = tf.Variable(rng.randn(), name=\"bias\")\n```\n\n现在，构建一个线性模型。\n\n```\npred =\
  \ tf.add(tf.multiply(X, W), b)\n```\n\n计算均方误差。\n\n```\ncost = tf.reduce_sum(tf.pow(pred-Y,\
  \ 2))/(2*n_samples)\n```\n\n计算梯度下降。\n\n```\noptimizer = tf.train.GradientDescentOptimizer(learning_rate).minimize(cost)\n\
  ```\n\n初始化变量。\n\n```\ninit = tf.global_variables_initializer()\n```\n\n启动计算图。\n\n\
  ```python\nwith tf.Session() as sess:\n    sess.run(init)\n    # 拟合所有训练数据\n    for\
  \ epoch in range(training_epochs):\n        for (x, y) in zip(train_X, train_Y):\n\
  \            sess.run(optimizer, feed_dict={X: x, Y: y})\n        # 每个 epoch 步骤显示日志\n\
  \        if (epoch+1) % display_step == 0:\n            c = sess.run(cost, feed_dict={X:\
  \ train_X, Y:train_Y})\n            print(\"Epoch:\", '%04d' % (epoch+1), \"cost=\"\
  , \"{:.9f}\".format(c), \\\n                  \"W=\", sess.run(W), \"b=\", sess.run(b))\n\
  \    print(\"优化完成！\")\n    training_cost = sess.run(cost, feed_dict={X: train_X,\
  \ Y: train_Y})\n    print(\"训练成本=\", training_cost, \"W=\", sess.run(W), \"b=\"\
  , sess.run(b), '\\n')\n    # 图形显示\n    plt.plot(train_X, train_Y, 'ro', label='原始数据')\n\
  \    plt.plot(train_X, sess.run(W) * train_X + sess.run(b), label='拟合线')\n    plt.legend()\n\
  \    plt.show()\n    # 测试示例，按要求（问题 #2）\n    test_X = numpy.asarray([6.83, 4.668,\
  \ 8.9, 7.91, 5.7, 8.7, 3.1, 2.1])\n    test_Y = numpy.asarray([1.84, 2.273, 3.2,\
  \ 2.831, 2.92, 3.24, 1.35, 1.03])\n    print(\"测试中...（均方损失对比）\")\n    testing_cost\
  \ = sess.run(\n        tf.reduce_sum(tf.pow(pred - Y, 2)) / (2 * test_X.shape[0]),\n\
  \        feed_dict={X: test_X, Y: test_Y})  # 与上述成本函数相同\n    print(\"测试成本=\", testing_cost)\n\
  \    print(\"绝对均方损失差异:\", abs(\n        training_cost - testing_cost))\n    plt.plot(test_X,\
  \ test_Y, 'bo', label='测试数据')\n    plt.plot(train_X, sess.run(W) * train_X + sess.run(b),\
  \ label='拟合线')\n    plt.legend()\n    plt.show()\n```\n\n恭喜！你已成功使用 **Transform**\
  \ 步骤在 TensorFlow 中完成了线性模型。TensorFlow 的使用极大地增强了你的能力。TensorFlow 生态系统为在云端处理庞大且复杂的数据集开辟了许多新机遇，并能将结果返回给客户的设备。\n\
