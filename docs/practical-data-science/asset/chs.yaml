  \n\n\n# 读取容器\n\n我将协助你通过一个快速实验来证明你能够完成所需任务。打开你的 Python 编辑器并搭建如下环境：\n\n```\nfrom time\
  \ import time\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom matplotlib\
  \ import offsetbox\nfrom sklearn import (manifold, datasets, decomposition, ensemble,\n\
  discriminant_analysis, random_projection)\ndigits = datasets.load_digits(n_class=6)\n\
  X = digits.data\ny = digits.target\nn_samples, n_features = X.shape\nn_neighbors\
  \ = 30\n```\n\n创建一个用于缩放和可视化嵌入向量的函数。\n\n```\ndef plot_embedding(X, title=None):\n\
  \    x_min, x_max = np.min(X, 0), np.max(X, 0)\n    X = (X - x_min) / (x_max - x_min)\n\
  \    plt.figure(figsize=(10, 10))\n    ax = plt.subplot(111)\n    for i in range(X.shape[0]):\n\
  \        plt.text(X[i, 0], X[i, 1], str(digits.target[i]),\n                 color=plt.cm.Set1(y[i]\
  \ / 10.),\n                 fontdict={'weight': 'bold', 'size': 9})\n    if hasattr(offsetbox,\
  \ 'AnnotationBbox'):\n        # only print thumbnails with matplotlib > 1.0\n  \
  \      shown_images = np.array([[1., 1.]])  # just something big\n        for i\
  \ in range(digits.data.shape[0]):\n            dist = np.sum((X[i] - shown_images)\
  \ ** 2, 1)\n            if np.min(dist) < 4e-3:\n                # don't show points\
  \ that are too close\n                continue\n            shown_images = np.r_[shown_images,\
  \ [X[i]]]\n            imagebox = offsetbox.AnnotationBbox(\n                offsetbox.OffsetImage(digits.images[i],\
  \ cmap=plt.cm.gray_r),\n                X[i])\n            ax.add_artist(imagebox)\n\
  \    plt.xticks([]), plt.yticks([])\n    if title is not None:\n        plt.title(title)\n\
  ```\n\n现在你可以绘制已识别数字的图像。\n\n```\nn_img_per_row = 20\nimg = np.zeros((10 * n_img_per_row,\
  \ 10 * n_img_per_row))\nfor i in range(n_img_per_row):\n    ix = 10 * i + 1\n  \
  \  for j in range(n_img_per_row):\n        iy = 10 * j + 1\n        img[ix:ix +\
  \ 8, iy:iy + 8] = X[i * n_img_per_row + j].reshape((8, 8))\nplt.figure(figsize=(10,\
  \ 10))\nplt.imshow(img, cmap=plt.cm.binary)\nplt.xticks([])\nplt.yticks([])\nplt.title('从\
  \ 64 维数字数据集中选取的样本')\n```\n\n你可以使用随机酉矩阵进行随机二维投影处理。\n\n```\nprint(\"Computing random\
  \ projection\")\nrp = random_projection.SparseRandomProjection(n_components=2, random_state=42)\n\
  X_projected = rp.fit_transform(X)\nplot_embedding(X_projected, \"数字的随机投影\")\n```\n\
  \n现在添加一个在前两个主成分上的投影。\n\n```\nprint(\"Computing PCA projection\")\nt0 = time()\n\
  X_pca = decomposition.TruncatedSVD(n_components=2).fit_transform(X)\nplot_embedding(X_pca,\n\
  \              \"数字的主成分投影 (用时 %.2fs)\" %\n              (time() - t0))\n```\n\n\
  添加一个在前两个线性判别成分上的投影。\n\n```\nprint(\"Computing Linear Discriminant Analysis projection\"\
  )\nX2 = X.copy()\nX2.flat[::X.shape[1] + 1] += 0.01  # 使 X 可逆\nt0 = time()\nX_lda\
  \ = discriminant_analysis.LinearDiscriminantAnalysis(n_components=2).fit_transform(X2,\
  \ y)\nplot_embedding(X_lda,\n              \"数字的线性判别投影 (用时 %.2fs)\" %\n        \
  \      (time() - t0))\n```\n\n添加数字数据集的 Isomap 投影。\n\n```\nprint(\"Computing Isomap\
  \ embedding\")\nt0 = time()\nX_iso = manifold.Isomap(n_neighbors, n_components=2).fit_transform(X)\n\
  print(\"Done.\")\nplot_embedding(X_iso,\n              \"数字的 Isomap 投影 (用时 %.2fs)\"\
  \ %\n              (time() - t0))\n```\n\n添加数字数据集的局部线性嵌入。\n\n```\nprint(\"Computing\
  \ LLE embedding\")\nclf = manifold.LocallyLinearEmbedding(n_neighbors, n_components=2,\n\
  \                                      method='standard')\nt0 = time()\nX_lle =\
  \ clf.fit_transform(X)\nprint(\"Done. Reconstruction error: %g\" % clf.reconstruction_error_)\n\
  plot_embedding(X_lle,\n              \"数字的局部线性嵌入 (用时 %.2fs)\" %\n              (time()\
  \ - t0))\n```\n\n添加数字数据集的修正局部线性嵌入。\n\n```\nprint(\"Computing modified LLE embedding\"\
  )\nclf = manifold.LocallyLinearEmbedding(n_neighbors, n_components=2,\n        \
