  \ 18:15:43 (CEST) (+0200)\nHQ USA: 2017-10-03 12:15:43 (EDT) (-0400)\n```\n\n这展示了数据科学家如何研究我们的日期和时间。作为人类，几千年来我们一直将日期和时间的概念分开。日期是通过星辰计算的。时间曾由沙漏确定。后来，日期出现在日历上，而时间则体现在怀表上。但在现代国际社会中，还有另一种日期时间数据项。对我来说，它就是一部智能手机——句号！\n\
  \n## 组合日期与时间\n\n当日期和时间在同一个字段中使用时，ISO 支持本地时间的格式 `YYYY-MM-DDThh:mm:ss.sss` 和协调世界时的格式\
  \ `YYYY-MM-DDThh:mm:ss.sssZ`。\n\n这些日期和时间的组合通常出现在跨国公司的财务报表、物流运输信息以及我的智能手机上。\n\n##\
  \ 时区\n\n时区使得现实世界能够创建一套人们可用来安排生活的日期和小时日历。例如，日期和时间通常表示为 2017 年 10 月 20 日 9:00。但在数据科学家的世界里，这个信息是不充分的。数据科学家需要日期、时间和时区。`YYYY-MM-DDThh:mm:ss.sssZ`\
  \ 是满足数据科学家数据处理需求的特殊时区格式。\n\n**注意**\n\n本章前面已经讨论过这种格式，作为 UTC 的替代方案。\n\n在国际数据中，我还见过以其他格式设置的时区，必须与大家讨论如何以实际的方式处理这些格式。\n\
  \n打开你的 IPython 编辑器，研究以下日期格式：\n\n```python\nfrom pytz import all_timezones\nfor zone\
  \ in all_timezones:\n    print(zone)\n```\n\n共有 593 个时区。是的，你没有看错！问题在于，由于缺乏理解，公司甚至不遵循这些标准时区。例如，我的一个客户使用\
  \ `YYYY-DDThh:mm:ss.sssY` 来表示 UTC-12:00，即 Yankee 时区。\n\n**警告**\n\n这些时区不是 ISO 的有效格式！但它们被世界各地的源系统普遍使用。\n\
  \n如果你需要转换回 UTC 格式或本地时间，我将提供我曾经见过的时区列表。\n\n**提示**\n\n我通常会在所有数据科学工作中添加一个 UTC 时区（格式为\
  \ `YYYY-DDThh:mm:ss.sssZ`），因为它能确保在处理来自多个时区的数据时，你始终有一个通用的日期和时间处理变量。\n\n数据源记录的时点通常就是你使用的时区。\n\
  \n**警告**\n\n时区取决于你源系统的经纬度或硬件的时钟设置。以下数据是概括性的。我建议你在选择正确的时区之前，先调查一下数据的来源。\n\n一旦找到正确的原始时区，我建议你执行以下操作：\n\
  \n```python\nnow_date_local = datetime.now()\nnow_date = now_date_local.replace(tzinfo=timezone('Europe/London'))\n\
  print('Local Date Time:', str(now_date_local.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\"\
  )))\nprint('Local Date Time:', str(now_date.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\"\
  )))\n```\n\n结果是\n\n```\nLocal Date Time: 2017-10-01 12:54:03 () ()\nLocal Date Time:\
  \ 2017-10-01 12:54:03 (LMT) (-0001)\n```\n\n`'Europe/London'` 从 593 个时区的列表中应用了正确的时区。现在转换为\
  \ UTC。\n\n```python\nnow_utc = now_date.astimezone(timezone('UTC'))\nprint('UTC\
  \ Date Time:', str(now_utc.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\")))\n```\n\n\
  结果是\n\n```\nUTC Date Time: 2017-10-01 12:55:03 (UTC) (+0000)\n```\n\n我建议你谨慎使用这种方式作为首选的转换方法。你会注意到\
  \ `YYYY-DDDThh:mmM` 这种格式的含义或多或少不太准确，它可以转换为 UTC+12:00、UTC+12:45、UTC+13:00 和 UTC+14:00。\n\
  \nUTC+14:00 是 UTC+14，向东延伸至 180° 经线以东 30°，在国际日期变更线上形成了一个大拐弯，并为数据科学家带来了有趣的数据问题。\n\n\
  \n### 有趣的事实\n\n基里巴斯共和国于 1995 年 1 月 1 日对其东部一半的地区实行了日期和时间的变更，从时区-11 和-10 调整为+13 和+14。在此之前，`UTC+13`和`UTC+14`这两个时区并不存在。其原因是，基里蒂马蒂岛比地球上任何其他国家都更早进入\
  \ 2000 年，基里巴斯政府将此特点视为潜在的旅游资产。这一举措是成功的，但也给前来体验的游客的信用卡交易带来了重大问题。菲尼克斯群岛和莱恩群岛政府办公室的当地时间位于国际日期变更线的两侧，它们在一周中只有四天（双方同时在工作日）才能通过无线电或电话进行通信。这些变更带来的问题总是出现在数据系统中。加密引擎上的`GPS`和时区有效性检查不支持这种非标准的变更。\n\
  \n汤加从 1999 年到 2002 年、以及从 2016 年至今，使用`UTC+14`作为夏令时，目的是为了与基里巴斯的莱恩群岛同时庆祝 2000 年新年，并于\
  \ 2016 年恢复使用变更后的时区，以重新吸引新年旅游业务。该时区于 2017 年 11 月 5 日启用，并于 2018 年 1 月 21 日停用。\n\n\
  2011 年 12 月 29 日（`UTC-10`），萨摩亚将其标准时间从`UTC-11`变更为`UTC+13`，并将其夏令时从`UTC-10`变更为`UTC+14`，从而将国际日期变更线移到了该国的另一侧。想知道为什么吗？为了新年旅游业务。\n\
  \n阿拉斯加（原俄属美洲）在 1867 年之前一直使用从`GMT+11:30`到`GMT+15:10`的当地时间（`UTC`于 1960 年引入）。\n\n墨西哥的金塔纳罗奥州于\
  \ 2015 年 2 月 1 日永久改为`UTC-5`，旨在通过创造更长、更明亮的夜晚来促进旅游业。\n\n纳米比亚于 2017 年 9 月 3 日从`UTC+1`（夏令时为`UTC+2`）永久改为`UTC+2`。\n\
  \n在 1982 年之前，`UTC+14`曾被用作俄罗斯东部部分地区（楚科奇自治区）的夏令时。\n\n`UTC-12:00`是最后一个开始新一天的当地时间区。\n\
  \n180 度经线被指定为国际日期变更线，因为它大致穿过人口稀少的太平洋中部地区，并于 1884 年获得批准。现在，许多研究探测船、游轮和飞机定期穿越这条线，并通过源系统记录数据。\n\
  \n在处理来自不同时区的数据时，数据科学家必须注意这些例外情况，因为数据从一年到下一年的微小偏移可能隐藏着季节性趋势。我曾受墨西哥金塔纳罗奥州坎昆的一家酒店集团委托，调查时区变更是否带来了其收入的增长，以及如果他们积极推广酒店酒吧延长开放时间，可能会产生多少潜在额外收入。\n\
  \n### 由开始和结束日期及时间标识的时间段\n\n在一个字段中支持日期和时间间隔有一种标准格式：`YYYYMMDDThhmmss/YYYYMMDDThhmmss`\
  \ 或 `YYYY-MM-DDThh:mm:ss/YYYY-MM-DDThh:mm:ss`。因此，2017 年 10 月 20 日可以记录为`2017-10-20T000000/2017-10-20T235959`，而\
  \ 2017 年 12 月的假期可以记录为`2017-12-22T120001/2017-12-27T085959`，都放在同一个数据表中。\n\n**注意**：前面的示例来源于我的一个源系统。复杂的数据问题在数据科学中很常见。要快速发现它们，并快速处理它们！\n\
  \n作为一般性提醒，我建议，当你发现这些复杂结构时，尽快将它们转换为更简单的结构。我建议你添加一个评估步骤，将它们拆分为四个字段：`开始日期时间`、`结束日期时间`、`原始日期时间`和`业务术语`。\n\
  \n使用前面提到的格式，2017 年 10 月 20 日记录为`2017-10-20T000000/2017-10-20T235959`，变为以下内容：\n\n\
  | 开始日期时间 | 结束日期时间 | 原始日期时间 | 业务术语 |\n| --- | --- | --- | --- |\n| `2017-10-20T000000`\
  \ | `2017-10-20T235959` | `2017-10-20T000000/2017-10-20T235959` | 2017 年 10 月 20\
  \ 日 |\n\n2017 年 12 月的假期可以在同一个数据表中记录为`2017-12-22T120001/2017-12-27T085959`，如下所示：\n\
  \n| 开始日期时间 | 结束日期时间 | 原始日期时间 | 业务术语 |\n| --- | --- | --- | --- |\n| `2017-12-22T120001`\
  \ | `2017-12-22T235959` | `2017-12-22T120001/2017-12-27T085959` | 2017 年 12 月假期\
  \ |\n| `2017-12-23T000000` | `2017-12-23T235959` | `2017-12-22T120001/2017-12-27T085959`\
  \ | 2017 年 12 月假期 |\n| `2017-12-24T000000` | `2017-12-24T235959` | `2017-12-22T120001/2017-12-27T085959`\
  \ | 2017 年 12 月假期 |\n| `2017-12-25T000000` | `2017-12-25T235959` | `2017-12-22T120001/2017-12-27T085959`\
  \ | 2017 年 12 月假期 |\n| `2017-12-26T000000` | `2017-12-26T235959` | `2017-12-22T120001/2017-12-27T085959`\
  \ | 2017 年 12 月假期 |\n| `2017-12-27T000000` | `2017-12-27T085959` | `2017-12-22T120001/2017-12-27T085959`\
  \ | 2017 年 12 月假期 |\n\n现在你有了相同日期的时段，这些时段更容易转换为日期时间格式。\n\n### 特殊日期格式\n\n以下是特殊日期格式。\n\
  \n#### 星期几\n\nISO 8601-2004 规定了以下标准：\n\n| 数字 | 名称 |\n| --- | --- |\n| 1 | 星期一 |\n\
  | 2 | 星期二 |\n| 3 | 星期三 |\n| 4 | 星期四 |\n| 5 | 星期五 |\n| 6 | 星期六 |\n| 7 | 星期日 |\n\n\
  打开你的 `IPython` 编辑器，研究以下日期格式：\n\n```\nnow_date_local=datetime.now()\nnow_date=now_date_local.replace(tzinfo=timezone('Europe/London'))\n\
  print('Weekday:',str(now_date.strftime(\"%w\")))\n```\n\n结果是：\n\n```\n(It is Sunday)\n\
  Weekday: 0\n```\n\n**注意**：我见过不同的变体！星期日=0，星期日=1，还有星期一=0。在合并数据之前，确保你使用了正确的格式。\n\n\
  ### 周日期\n\n在许多源系统中使用周日期会在处理日期时带来一些复杂性。周日期通过格式中使用大写字母 `W` 以及 `W` 和 `D` 来标识。\n\n以下都是有效格式：`YYYY-Www`\
  \ 或 `YYYYWww` 或 `YYYY-Www-D` 或 `YYYYWwwD`。例如，2017 年 10 月 22 日，如果使用 ISO 8601（欧洲标准），则为\
  \ `2017-W42`；但如果使用 ISO 8601（美国标准），则为 `2017-W43`。\n\n**警告**：ISO 8601（欧洲标准）是官方格式。标准规定，一年的第一周是包含该年第一个星期四或包含\
  \ 1 月 4 日的那个星期。按照这种方法，1 月 1 日、2 日和 3 日可能被包含在前一年的最后一周，而 12 月 29 日、30 日和 31 日可能被包含在次年的第一周。\n\
  \nISO 8601（美国标准）被广泛使用。根据该标准，第一周从 1 月 1 日开始，下一周从下一个星期日开始。\n\n其他选项包括：一年的第一周从 1 月 1\
  \ 日开始，下一周从接下来的星期一开始；或者一年的第一周从 1 月 1 日开始，下一周从 1 月 8 日开始。\n\n```\nnow_date_local=datetime.now()\n\
  now_date=now_date_local.replace(tzinfo=timezone('Europe/London'))\nprint('Week of\
  \ Year:',str(now_date.strftime(\"%YW%WD%w\")))\n```\n\n结果是：\n\n```\nWeek of Year:\
  \ 2017W39D0\n```\n\n\n\n#### 一年中的第几天\n\n一年中的第几天是通过计算从当年 1 月 1 日起的天数来简单得出的。例如：2017\
  \ 年 10 月 20 日对应的是 `2017/293`。\n\n**注意**\n\n请尽快将其改为 ISO 标准！\n\n我曾在一个生日字段中发现该格式存储为\
  \ `2017293`。原因是用来隐藏某位员工的年龄。这成功破坏了养老金计算器的预测，因为计算器将该值解读为美国格式的 2017 年 3 月 29 日，即 `2017/29/3`。这位员工在\
  \ 2017 年可能会收到管理层送来的两张生日贺卡和蛋糕。我在 2017 年 9 月修复了这个问题。\n\n现在，让我们按照该格式原本的用途来审视一年中的第几天。当比较不同年份的数据时，一年中的第几天有助于判断数据中的季节性规律。检查每年同一天是否会发生相同的事。虽然并非那么简单，但大致如此！\n\
  \n以下是一年中第几天的格式：\n\n```\nnow_date_local=datetime.now()\nnow_date=now_date_local.replace(tzinfo=timezone('Europe/London'))\n\
  print('Day of year:',str(now_date.strftime(\"%Y/%j\")))\n```\n\n结果如下：\n\n```\nDay\
  \ of year: 2017/274\n```\n\n干得漂亮。你现在已经完成了\"流程\"步骤中关于日期和时间的基础介绍。在本章的实践部分，我将展示 `YYYY-MM-DDThh:mm:ss.sssZ`\
  \ 格式的数值对于数据科学中的日期和时间处理有多么重要。\n\n至此，关于日期和时间的初步介绍就结束了。接下来，你将开始构建时间中心枢纽、各个链接以及卫星表。\n\
