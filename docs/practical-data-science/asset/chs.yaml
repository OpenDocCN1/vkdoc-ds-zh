  Base,sDatabaseName = prepecosystem()\nfor t in range(1,10):\nsFile='{num:06d}'.format(num=t)\n\
  print('Spawn:',sFile)\np = Process(target=makemasterfile, args=(sFile,Base,sDatabaseName))\n\
  p.start()\np.join()\n################################################################\n\
  print('### Done!! ############################################')\n################################################################\n\
