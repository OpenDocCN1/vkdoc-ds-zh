  \n## 利用数据科学进行转换\n\n现在你已经具备了从数据湖到数据保险库，以及从数据保险库到数据仓库进行数据探索和准备的良好基础。接下来，我将向你介绍基础的数据科学，以便将你的数据转化为洞见。你必须掌握一组精选的基础调研实践方法，才能从数据中获取洞见。\n\
  \n### 数据探索与准备的步骤\n\n你必须详细记录你为准备数据所采用的技术。确保在每个数据工程步骤完成后，及时更新你的数据可追溯性矩阵。同时更新你的数据谱系与数据血统，以确保你掌握了整个流程的技术和业务细节。现在，我将带你了解少量的标准转换检查点，以确保你的数据科学工作完整无误。\n\
  \n### 缺失值处理\n\n你必须详细描述数据湖转换过程中缺失值的处理方法。确保你的业务团队全程参与其中。在流程结束时，他们必须信任你的技术和结果。如果他们信任这个流程，他们就会采纳你作为数据科学家所期望实现的业务决策。\n\
  \n#### 为什么需要处理缺失值\n\n在数据可追溯性矩阵上附注说明，解释数据湖中为何会存在缺失数据。请记住：数据湖中的每一个不一致之处，都可能是你的客户希望从你这位数据科学家那里获得的缺失洞见。因此，找出它们并加以解释。你的客户将利用这些洞见来创造商业价值。\n\
  \n\n\n#### 数据为何会出现缺失值\n\n“五个为什么”是一种帮助你深入分析根本原因的技巧。使用因果鱼骨图将有助于你解答这些问题。\n\n我总结了以下几个数据缺失的常见原因：\n\
  \n*   升级过程中数据字段被重命名\n*   从旧系统迁移到新系统时，映射关系不完整\n*   领域专家提供的加载规范中使用了错误的表格\n*   数据未记录，因为当时无法获取\n\
  *   因数据保护法规（例如《通用数据保护条例》GDPR）的法定原因，导致数据条目被标记为“不可处理”\n*   他人“不良”的数据科学实践。人和项目都会犯错，你不得不在自己的数据科学工作中修正这些错误。\n\
  \n> **警告**  \n> 请确保你的数据处理流程本身不是导致数据缺失的原因。这是最快失去客户信任的方式。\n\n#### 有哪些方法可以处理缺失值？\n\n\
  在你执行超级步骤的过程中，你已经使用了多种技巧来解决缺失数据的问题。请将这些技巧记录在你的数据谱系中，但也要确保精确地收集每种技巧如何应用于处理流程。\n\n\
  #### 异常值检测与处理方法\n\n在处理过程中，你会检测到一些不符合预期范围的异常值，例如，你期望得到“是”或“否”，但发现了一些“不适用”（N/A），或者你期望数字范围在\
  \ 1 到 10 之间，但出现了 11、12 和 13。这些越界的数据项就是异常值。\n\n我建议你像处理缺失数据一样处理它们。务必确保你的客户同意这个处理流程，因为它会影响你将得出的洞察以及他们的决策。\n\
  \n##### 椭圆包络\n\n我将介绍一个名为 `EllipticEnvelope` 的函数。其基本思想是假设数据集来自一个已知分布，然后评估那些不符合该假设的任何条目。拟合椭圆包络是在高斯分布数据集中检测异常值的常用技术之一。\n\
  \n`scikit-learn` 包提供了一个对象 `covariance.EllipticEnvelope`，它可以为数据拟合出稳健的协方差估计，从而为中心数据点拟合出一个椭圆，忽略中心模式之外的点。例如，如果正常数据服从高斯分布，它将以稳健的方式（即不受异常值影响）估计正常数据的位置和协方差。基于此估计得出的马氏距离被用来衡量数据的异常程度。如果你想了解该函数更深入的细节，请访问\
  \ [`http://scikit-learn.org/stable/modules/generated/sklearn.covariance.EllipticEnvelope.html`](http://scikit-learn.org/stable/modules/generated/sklearn.covariance.EllipticEnvelope.html)。\n\
  \n示例：\n\n```python\n"
- '# -*- coding: utf-8 -*-

  import numpy as np

  from sklearn.covariance import EllipticEnvelope

  from sklearn.svm import OneClassSVM

  import matplotlib.pyplot as plt

  import matplotlib.font_manager

  from sklearn.datasets import load_boston

  '
- '# 获取数据

  X1 = load_boston()[''data''][:, [8, 10]]  # 两个簇

  X2 = load_boston()[''data''][:, [5, 12]]  # "香蕉"形状

  '
- '# 定义要使用的"分类器"

  classifiers = {

  "经验协方差": EllipticEnvelope(support_fraction=1.,

  contamination=0.261),

  "稳健协方差（最小协方差行列式）":

  EllipticEnvelope(contamination=0.261),

  "OCSVM": OneClassSVM(nu=0.261, gamma=0.05)}

  ```


  这些分类器都假设你在测试正常数据条目。我们来看一下 `EllipticEnvelope(support_fraction=1., contamination=0.261)`。其中的
  `support_fraction` 是你希望用来确定正常值与异常值边界的数据占总体的比例。在这个例子中，我们用了 1，也就是 100%。`contamination`
  则指示了数据集中可能存在的异常值比例，即数据集的污染程度，也就是异常值在数据集中的占比。在这里，它被设置为 0.261（最大可能为 0.5），通常可以描述为 26.1%
  的污染度。


  而 `EllipticEnvelope(contamination=0.261)` 仅仅是改变了包含的数据集比例，它使用了所有设置的默认值，唯一例外是将污染度（contamination）设置为
  26.1%。


  第三种是另一种类型的检测方法，称为 `sklearn.svm.OneClassSVM`，本章稍后会进行讨论。


  ```python

