  \n# 设计实用的过程超步骤\n\n接下来，我将开始一系列信息性和实践性的章节，最终目标是让您使用前面讨论过的 T-P-O-L-E 设计模型，通过“过程”步骤生成一个数据仓库。\n\
  \n**注意**\n\n我使用 T-P-O-L-E 模型，但“纯粹的”数据仓库可以使用各种其他中心、链接或卫星。该模型是一个简化模型，使我能够复用多年来在数据科学工作中开发的众多实用工具和流程。\n\
  \n#### 时间\n\n时间是数据的一个特征，与时间记录直接相关。ISO 8601-2004 描述了数据元素和日期时间交换格式的国际标准。以下是处理数据交换的一组基本规则。\n\
  \n日历基于公历。以下数据实体（年、月、日、时、分、秒以及秒的小数部分）正式成为 ISO 8601-2004 标准的一部分。数据按从大到小的顺序记录。值必须有预先商定的固定位数，不足时用前导零补齐。现在，我将向您介绍这些不同的数据实体。\n\
  \n### 年\n\n标准年份必须使用 0000 到 9999 范围内的四位数。双方可选约定，任何用公元前/公元后表示的日期需要转换，其中公元 1 年 = 年份\
  \ 1，公元前 1 年 = 年份 0，公元前 2 年 = 年份 -1。这意味着公元 2017 年变为 +2017，但公元前 2017 年则变为 -2016。\n\
  \n有效格式为：`YYYY` 和 `+/-YYYY`。一个有效年份的规则是：2017 年 10 月 20 日变为 `2017-10-20` 或 `+2017-10-20`\
  \ 或基本格式 `20171020`。年份数据缺失的规则是：10 月 20 日变为 `--10-20` 或 `--1020`。\n\n`YYYYMMDD` 格式在源系统中很常见。我建议您在“评估”步骤中将其转换为\
  \ `YYYY-MM-DD` 格式，以便在后续处理阶段实现日期格式的一致性。\n\n**警告**\n\n与您的客户讨论 1582 年 10 月（公历正式起始日期）之前的日期。儒略历自公元前\
  \ 45 年 1 月 1 日起使用。如果更早的日期对客户的数据处理至关重要，我建议您深入研究这些日期之间其他更复杂的差异。在处理较旧文档的文本挖掘时，这一点非常重要。\n\
  \n打开您的 IPython 编辑器并研究以下日期格式：\n\n```\nfrom datetime import datetime\nfrom pytz import\
  \ timezone, all_timezones\nnow_date = datetime(2001,2,3,4,5,6,7)\nnow_utc=now_date.replace(tzinfo=timezone('UTC'))\n\
  print('Date:',str(now_utc.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\")))\nprint('Year:',str(now_utc.strftime(\"\
  %Y\")))\n```\n\n您应该看到\n\n```\nDate: 2001-02-03 04:05:06 (UTC) (+0000)\nYear: 2001\n\
  ```\n\n这使您能够轻松地从给定日期中提取年份值。\n\n\n\n### 月份\n\n标准月份必须使用介于 01 到 12 之间的两位数值。有效月份的规则是，2017\
  \ 年 10 月 20 日应表示为 `2017-10-20` 或 `+2017-10-20`。不带日期的有效月份规则是，2017 年 10 月应表示为 `2017-10`\
  \ 或 `+2017-10`。\n\n**警告：** 你不能使用 `YYYYMM` 格式，因此 `201710` 无效。本标准是为了避免与源系统中仍然常用的简化格式\
  \ `YYMMDD` 产生混淆。`201011` 可能被理解为 `2010-11` 或 `1920-10-11`。\n\n打开你的 IPython 编辑器，研究以下日期格式：\n\
  \n```\nprint('Date:',str(now_utc.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\")))\nprint('Month:',str(now_utc.strftime(\"\
  %m\")))\n```\n\n你应该得到以下输出：\n\n```\nDate: 2001-02-03 04:05:06 (UTC) (+0000)\nMonth:\
  \ 02\n```\n\n现在你可以获取月份了。\n\n这遵循了标准的英文月份名称。\n\n| 数字 | 月份 |\n| --- | --- |\n| 1 |\
  \ January |\n| 2 | February |\n| 3 | March |\n| 4 | April |\n| 5 | May |\n| 6 |\
  \ June |\n| 7 | July |\n| 8 | August |\n| 9 | September |\n| 10 | October |\n| 11\
  \ | November |\n| 12 | December |\n\n打开你的 IPython 编辑器，研究以下日期格式：\n\n```\nprint('Date:',str(now_utc.strftime(\"\
  %Y-%m-%d %H:%M:%S (%Z) (%z)\")))\nprint('MonthName:', str(now_utc.strftime(\"%B\"\
  )))\n```\n\n这将返回月份的单词形式。\n\n```\nDate: 2001-02-03 04:05:06 (UTC) (+0000)\nMonthName:\
  \ February\n```\n\n### 日\n\n标准日期中的日必须使用两位数值，可能取值在 01 到 31 之间，具体取决于特定月份和年份的约定格式。有效月份的规则是，2017\
  \ 年 10 月 20 日应表示为 `2017-10-20` 或 `+2017-10-20`。\n\n打开你的 IPython 编辑器，研究以下日期格式：\n\n\
  ```\nprint('Date:',str(now_utc.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\")))\nprint('Day:',str(now_utc.strftime(\"\
  %d\")))\n```\n\n这将返回该日期的日。\n\n```\nDate: 2001-02-03 04:05:06 (UTC) (+0000)\nDay:\
  \ 03\n```\n\n验证日期适用两种标准：非闰年和闰年。由于太阳年长度略短于 365¼ 天——大约少 11 分钟——每 4 年，日历会显示一个闰年，除非该年份能被\
  \ 400 整除。这修正了 400 年间积累的 11 分钟差值。\n\n打开你的 IPython 编辑器，研究以下日期格式。我将向你展示查找闰年的方法。\n\n\
  ```\nimport datetime\nfor year in range(1960,2025):\nmonth=2\nday=29\nhour=0\ncorrectDate\
  \ = None\ntry:\nnewDate = datetime.datetime(year=year,month=month,day=day,hour=hour)\n\
  correctDate = True\nexcept ValueError:\ncorrectDate = False\nif correctDate == True:\n\
  if year%400 == 0:\nprint(year, 'Leap Year (400)')\nelse:\nprint(year, 'Leap Year')\n\
  else:\nprint(year,'Non Leap Year')\n```\n\n结果显示闰年如下：\n\n```\n1960,1964,1968,1972,1976,1980,1984,1988,1992,1996,2000(This\
  \ was a 400)\n2004,2008,2012,2016,2020,2024.\n```\n\n现在，我们可以查看日期时间中的时间部分。\n\n###\
  \ 小时\n\n标准小时必须使用介于 00 到 24 之间的两位数值。有效格式为 `hhmmss` 或 `hh:mm:ss`。缩写格式 `hhmm` 或 `hh:mm`\
  \ 可接受，但不建议使用。不支持 `hh` 格式。`00:00:00` 表示日历日的开始。`24:00:00` 仅用于表示日历日的结束。\n\n打开你的 IPython\
  \ 编辑器，研究以下日期格式：\n\n```\nprint('Date:',str(now_utc.strftime(\"%Y-%m-%d %H:%M:%S (%Z)\
  \ (%z)\")))\nprint('Hour:',str(now_utc.strftime(\"%H\")))\n```\n\n结果是：\n\n```\n\
  Date: 2001-02-03 04:05:06 (UTC) (+0000)\nHour: 04\n```\n\n### 分钟\n\n标准分钟必须使用介于 00\
  \ 到 59 之间的两位数值。有效格式为 `hhmmss` 或 `hh:mm:ss`。缩写格式 `hhmm` 或 `hh:mm` 可接受，但不建议使用。\n\n\
  打开你的 IPython 编辑器，研究以下日期格式：\n\n```\nprint('Date:',str(now_utc.strftime(\"%Y-%m-%d\
  \ %H:%M:%S (%Z) (%z)\")))\nprint('Minute:',str(now_utc.strftime(\"%M\")))\n```\n\
  \n结果是：\n\n```\nDate: 2001-02-03 04:05:06 (UTC) (+0000)\nMinute: 05\n```\n\n### 秒\n\
  \n标准秒必须使用介于 00 到 59 之间的两位数值。有效格式为 `hhmmss` 或 `hh:mm:ss`。\n\n打开你的 IPython 编辑器，研究以下日期格式：\n\
  \n```\nprint('Date:',str(now_utc.strftime(\"%Y-%m-%d %H:%M:%S (%Z) (%z)\")))\nprint('Second:',str(now_utc.strftime(\"\
  %S\")))\n```\n\n这将返回日期时间的秒数。\n\n```\nDate: 2001-02-03 04:05:06 (UTC) (+0000)\nSecond:\
  \ 06\n```\n\n**注意：** 这通常是大多数系统停止记录时间的地方，但我有一些客户需要更精确的时间记录级别。\n\n### 秒的小数部分\n\n秒的小数部分仅定义为以下格式：`hhmmss,sss`\
  \ 或 `hh:mm:ss,sss` 或 `hhmmss.sss` 或 `hh:mm:ss.sss`。我更喜欢 `hh:mm:ss.sss` 格式，因为使用逗号在导出到数据科学生态系统中常见的\
  \ CSV 文件格式时会引起问题。\n\n当前常用的格式如下：\n\n- `hh:mm:ss.s`：十分之一秒\n- `hh:mm:ss.ss`：百分之一秒\n\
  - `hh:mm:ss.sss`：千分之一秒\n\n如果你能以尽可能低的级别记录数据，数据科学的效果最好。我建议你将时间记录在 `hh:mm:ss.sss` 级别。\n\
  \n打开你的 IPython 编辑器，研究以下日期格式：\n\n```\nprint('Date:',str(now_utc.strftime(\"%Y-%m-%d\
  \ %H:%M:%S (%Z) (%z)\")))\nprint('Millionth of Second:',str(now_utc.strftime(\"\
  %f\")))\n```\n\n这将返回百万分之一秒（即微秒）的秒小数部分，如下所示：\n\n- Date: `2001-02-03 04:05:06 (UTC)\
  \ (+0000)`\n- Millionth of Second: `000007`\n\n还有一些更小的单位，例如：\n\n- **纳秒：** 十亿分之一秒\n\
  \  - 尺度对比：1 纳秒相对于 1 秒，相当于 1 秒相对于 31.71 年。\n- **皮秒：** 一万亿分之一秒，或百万分之一百万分之一秒\n  - 尺度对比：1\
  \ 皮秒相对于 1 秒，相当于 1 秒相对于 31,710 年。\n\n我有一个客户，他拥有一台名为条纹管或增强型 CCD (ICCD) 相机的科学设备。这些设备能够拍摄光的运动图像，其中\
  \ +/-3.3 皮秒是光传播 1 毫米所需的时间。\n\n**注意：** 2011 年，麻省理工学院的研究人员宣布他们拥有了一台每秒万亿帧的视频相机。这款相机的能力非常出色，因为电影的标准是每秒\
  \ 24 帧 (fps)，视频是每秒 30 帧，还有一些 48 fps 的型号。\n\n在高性能计算的测量中，一台常见的 3.0 GHz 计算机 CPU 将两个整数相加需要\
  \ +/-330 皮秒。数据科学家的世界是一个极端测量的世界。\n\n还记得你在第 5 章之前做的电影与帧的示例吗？这台相机在 1 秒内产生的帧数足以制作 1,056,269,593.8\
  \ 年的视频（以 30 fps 播放）。\n\n### 本地时间与协调世界时 (UTC)\n\n我们使用的日期和时间与地球上的特定地点以及日历年的特定时间绑定。约定的本地时间由特定国家批准。\n\
  \n我讨论时区是因为，作为一名数据科学家，你将不得不合并来自全球多个数据源的数据。问题在于时区的影响以及客户对规则的不一致应用。\n\n\n\n### 当地时间\n\
  \n经批准的当地时间由特定国家通过批准使用该国的特定时区来确定。夏令时也可被采用，如果该国使用夏令时，则会使其当地时间在一年中的特定时段发生偏移。当地时间的通用格式为\
  \ `hh:mm:ss`。\n\n打开你的 IPython 编辑器并研究以下日期格式：\n\n```\nfrom datetime import datetime\n\
  now_date = datetime.now()\nprint('Date:',str(now_date.strftime(\"%Y-%m-%d %H:%M:%S\
  \ (%Z) (%z)\")))\n```\n\n结果如下：\n\n```\n2017-10-01 10:45:58 () ()\n```\n\n出现两个空括号的原因是此时日期时间处于当地时间设置中。\n\
  \n**警告**  \n大多数数据系统会在特定服务器、个人电脑或平板电脑的当地时间设置中记录当地时间。作为数据科学家，你需要理解生态系统中的并非所有系统都能以可靠的方式记录时间。\n\
  \n**提示**  \n有一个简单网络时间协议（SNTP），你可以自动使用它来将系统时间与远程服务器的时间同步。SNTP 可用于通过远程服务器更新机器上的时钟。通过与已知时间准确的服务器同步，这能保持机器时间的准确性。我通常会将自己记录客户数据的计算机与客户使用的同一台\
  \ NTP 服务器同步，以确保按照他们的系统获得正确的日期和时间。\n\n现在你可以开始研究国际日期和时间设置的世界了。\n\n### 协调世界时（UTC）\n\
  \n协调世界时是一种时间计量方式，与 0° 经度处的平太阳时误差在约 1 秒以内。有效格式为 `hh:mm:ss±hh:mm` 或 `hh:mm:ss±hh`。\n\
  \n例如，2017 年 9 月 11 日，英国伦敦上午九点，当地时间为 `09:00:00`，UTC 时间为 `10:00:00+01:00`。在美国纽约，当地时间为\
  \ `06:00:00`，UTC 时间为 `10:00:00-04:00`。在印度新德里，当地时间为 `15:30:00`，UTC 时间为 `10:00:00+05:30`。\n\
  \n更精确的记录方式应为 `2017-09-11T10:00:00Z`。在接下来的章节中，我将解释为什么作为数据科学家在处理多个时区时，日期如此重要。\n\n\
