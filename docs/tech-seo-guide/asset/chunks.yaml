  trans: "\n# 7\n\n## 那么，究竟什么是分页？\n\n分页是指将网站内容划分到多个页面的做法。你在新闻网站、博客、论坛以及电商领域的几乎任何地方都见过它。\n\
    \n![图片](img/image-PLLT4UBU.png)\n\n分页就像是网站内容分发的基础，但并非总是完美无缺。正确实施分页对搜索引擎优化（SEO）至关重要。\n\
    \n关键在于：分页设置的质量决定了搜索引擎如何索引你的页面及其包含的内容——链接、文章、产品等等。\n\n我们来看一个分页示例。在这个例子中：该系列标题为“精彩食谱系列”，并关联了\
    \ URL 和图片。它包含“第 1 页”和“第 2 页”两个页面，每个页面都有自己的 URL 和名称。你可以通过复制结构并递增元标签中的`position`和`content`属性来添加更多页面。分页元数据指定共有\
    \ 10 页，从第 1 页开始，到第 10 页结束，并且当前页面是第 1 页。\n\n```\n<div itemscope itemtype=\"http://schema.org/Series\"\
    >\n  <span itemprop=\"name\">精彩食谱系列</span>\n  <link itemprop=\"url\" href=\"https://example.com/awesome-recipes\"\
    >\n  <link itemprop=\"image\" href=\"https://example.com/awesome-recipes-thumbnail.jpg\"\
    >\n\n  <!-- 第 1 页 -->\n  <div itemprop=\"hasPart\" itemscope itemtype=\"http://schema.org/WebPage\"\
    >\n    <a itemprop=\"url\" href=\"https://example.com/awesome-recipes/page/1\"\
    >\n      <span itemprop=\"name\">精彩食谱 - 第 1 页</span>\n    </a>\n    <meta itemprop=\"\
    position\" content=\"1\">\n  </div>\n\n  <!-- 第 2 页 -->\n  <div itemprop=\"hasPart\"\
    \ itemscope itemtype=\"http://schema.org/WebPage\">\n    <a itemprop=\"url\" href=\"\
    https://example.com/awesome-recipes/page/2\">\n      <span itemprop=\"name\">精彩食谱\
    \ - 第 2 页</span>\n    </a>\n    <meta itemprop=\"position\" content=\"2\">\n \
    \ </div>\n\n  <!-- 在此处添加更多页面 -->\n\n  <!-- 分页元数据 -->\n  <meta itemprop=\"numberOfPages\"\
    \ content=\"10\">\n  <meta itemprop=\"pageStart\" content=\"1\">\n  <meta itemprop=\"\
    pageEnd\" content=\"10\">\n  <meta itemprop=\"currentPage\" content=\"1\">\n</div>\n\
    ```\n\n# 8\n\n## 无限滚动是怎么回事？\n\n它恰恰与分页相反。无限滚动不是将内容切分成单独的页面，而是将所有内容塞进一个页面，让用户可以无限滚动下去。\n\
    \n![图片](img/image-14WEIAUL.png)\n\n有时，你会看到一个“加载更多”按钮来显示下一批内容，但从技术上讲，它仍然是一个页面。搜索引擎会将分页和无限滚动都视为单个页面。\n\
    \n无限滚动有其优势，比如外观流畅且对移动端友好，但从搜索引擎优化的角度来看，它并非万能灵药。问题在于：谷歌爬虫无法模仿滚动行为，更不能点击“加载更多”。因此，搜索引擎难以有效评估和索引无限滚动页面上的所有内容。分页则没有这些问题，因为爬虫会将每个页面视为一个独立的实体。\n\
    \n# 9\n\n## 开发者分页最佳实践指南\n\n现在，我们来谈谈谷歌手册中提到的分页最佳实践：\n\n1.  **页面链接序列** – 始终在每个页面上使用`<a\
    \ href>`标签包含指向下一页的链接。同时，确保每个页面的分页中都包含指向第一页的链接，以便搜索引擎在搜索结果页面（SERP）中优先展示你的目标结果。\n\
    \n2.  **创建正确的 URL** – 使用带有`?page=n`参数的唯一 URL 来在地址栏中显示当前页码。避免将第一页作为权威页面（canonical）；为每个页面使用带有独立链接的规范标签。\n\
    \n3.  **数据结构** – 使用微标记向搜索引擎表明你的网站使用了分页。Schema.org 在这里是你的好帮手。\n\n4.  **避免重复文本**\
    \ – 如果你在分页过程中为分类添加了介绍性文字，请将其放在第一页上。\n\n5.  **对 URL 片段标识符说不** – 谷歌会忽略 URL 中的片段标识符（`#`）。确保你的链接是可爬取的。\n\
    \n6.  **`rel=”next”`和`rel=”prev”`标签** – 早在 2011 年引入的这些标签，谷歌已不再要求使用。微标记就足够了。\n\n\
    ### 额外提示\n\n想要给你的分页功能加速吗？考虑这些额外配置：\n\n-   使用`preload`、`reconnect`或`prefetch`标签来加快用户的页面切换速度。\n\
    -   有两种视觉分页类型：“上一页/下一页”和“页码编号”。选择最适合你内容量的那一种。\n\n# 10\n"
- fmt: "### A Developer’s Guide to Handling Infinite Scroll\n\nIf you’re leaning towards\
    \ infinite scroll, remember it’s often powered by AJAX technology.\n\nSearch engines\
    \ may miss some content since it’s hidden until users scroll or click to load\
    \ more.\n\nHere’s a JavaScript snippet to give you an idea:\n\n```\nwindow.onscroll\
    \ = function() {\n  // Check if the user has scrolled to the bottom of the page\n\
    \  if (window.innerHeight + window.scrollY >= document.body.offsetHeight) {\n\
    \    // You're at the bottom of the page, load more content here.\n    // This\
    \ is where you would make an AJAX request to fetch additional content.\n    //\
    \ Once the new content is loaded, you can append it to the existing content on\
    \ the page.\n    // Don't forget to implement error handling and loading indicators\
    \ if needed.\n  }\n};\n```\n\nIn this code:\n\n- `window.onscroll` is an event\
    \ listener that triggers the function when the user scrolls.\n- `window.innerHeight`\
    \ represents the height of the browser’s viewport.\n- `window.scrollY` indicates\
    \ how much the page has been scrolled vertically.\n- `document.body.offsetHeight`\
    \ gives you the total height of the document.\n\nWhen the sum of `window.innerHeight`\
    \ and `window.scrollY` equals or exceeds `document.body.offsetHeight`, it means\
    \ the user has scrolled to the bottom of the page, and you can trigger the loading\
    \ of additional content.\n\nRemember to replace the comment “// Load more content\
    \ here” with the actual code to load and append new content to your webpage.\n\
    \nAdditionally, consider adding debounce or throttle mechanisms to avoid excessive\
    \ calls to the scroll event and improve performance.\n\nIn addition, we need to\
    \ talk about breaking the content into manageable sections. This ensures accessibility\
    \ even when JavaScript is disabled and maintains the URL integrity.\n\nHere’s\
    \ a breakdown:\n\n#### 1. Divide Content for Accessibility\n\nWhen implementing\
    \ infinite scroll, it’s crucial to divide your content into smaller, accessible\
    \ sections. This ensures that users with JavaScript disabled can still access\
    \ and navigate your content seamlessly. Avoid duplicating these sections. Consider\
    \ these examples:\n\n- Example 1: `site.com/stickers&page=1`\n\nThis URL structure\
    \ indicates the first content page within the “stickers” category.\n\n- Example\
    \ 2: `site.com/stickers?lastid=123`\n\nUsing a unique identifier like `lastid`\
    \ helps maintain URL uniqueness, allowing users to access specific sections directly.\n\
    \n- Example: `site.com/stickers#1`\n\nWhile using a URL fragment identifier (`#`)\
    \ isn’t ideal for SEO, it still provides some accessibility. However, using query\
    \ parameters or clean URLs whenever possible is better.\n\n#### 2. Ensure URL\
    \ Uniqueness and Functionality\n\nYour URLs should be both unique and functional.\
    \ They should work independently of user cookies or browsing history. This guarantees\
    \ a smooth user experience and proper indexing by search engines.\n\nExamples\
    \ are crucial here:\n\n- Unique and Functional URL: `site.com/stickers&page=2`\n\
    \nThis URL references the second page of content in the “stickers” category, and\
    \ it’s both unique and functional.\n\n- Avoid URL Fragment Identifiers:\n\nDon’t\
    \ rely solely on fragment identifiers like `site.com/stickers#1`, as they may\
    \ not be as reliable for functionality and indexing.\n\n#### 3. Enhance User Experience\
    \ with `replaceState` and `pushState`\n\nConsider using `replaceState` and `pushState`\
    \ to further improve the user experience, depending on user behaviour on your\
    \ website:\n\n- `replaceState`: Use this method when user actions, like clicking\
    \ or scrolling, are similar to mouse clicks. It replaces the current URL in the\
    \ browser’s history without creating a new entry.\n- `pushState`: Employ this\
    \ method when you want users to be able to return to previously scrolled content\
    \ easily. It adds a new entry to the browser’s history.\n\nHere’s a quick example:\n\
    \n```\n// Using pushState\nhistory.pushState({ page: 'scroll' }, 'Scrolled Content',\
    \ '/teams/giraffes?page=2');\n\n// Using replaceState\nhistory.replaceState({\
    \ page: 'scroll' }, 'Scrolled Content', 'teams/giraffes?page=3');\n```\n\nBy utilizing\
    \ these methods strategically, you can provide a more seamless and user-friendly\
    \ experience when implementing infinite scroll.\n\nIn summary, when optimizing\
    \ infinite scroll, consider accessibility, URL structure, and user experience\
    \ enhancements through state manipulation.\n\nThis approach ensures all users,\
    \ including those with JavaScript disabled, can navigate your content effectively\
    \ while improving SEO and user engagement.\n\n### Common Pagination Mistakes to\
    \ Avoid\n\nLastly, steer clear of these common pagination pitfalls:\n\n- Using\
    \ the `noindex` tag instead of canonical tags can prevent search engines from\
    \ indexing your pages correctly.\n- Static URLs for pagination are a no-go. Dynamic\
    \ parameters in URLs are the way to go.\n- Ensure that pages not in the current\
    \ category return a 404 error.\n\n### In a Nutshell\n\nThe key issue with improper\
    \ pagination is restricted access to your content. To dodge this pitfall, remember\
    \ these golden rules:\n\n- Use user-friendly `href` links for pagination that\
    \ crawlers can access.\n- Ensure only the first page in the sequence is optimized\
    \ and remove any SEO-specific content from pagination URLs.\n- Remember that Googlebots\
    \ can’t scroll or click, so ensure all your content is accessible even without\
    \ JavaScript.\n- Double-check the accessibility of your page URLs in Google Search\
    \ Console.\n\nGo forth and paginate wisely. Your website’s SEO will thank you!\n\
    \n![photo of the author](Images/image-CY5D9XQU.jpg)\n\n### About the Author\n\n\
    Andrea M. Fuller is a seasoned Digital Marketing and SEO expert with over 20 years\
    \ of experience in multiple industries that have ranged from start-ups to global\
    \ PR firms.\n\nAndrea’s deep knowledge of technical platforms and passion for\
    \ strategy allows her to create and execute unique and effective strategies for\
    \ clients. As a fourth generation entrepreneur, she is passionate about helping\
    \ businesses succeed by utilizing the online space to create genuine engagement\
    \ between corporations/organizations and their clients/constituents.\n\nShe owns\
    \ Fuller Digital Strategy, LLC - a full service Digital Marketing agency and SEO\
    \ Handy Woman - a online academy teaching DIY website owners how to execute top-line\
    \ SEO strategies themselves.\n\n- You can connect with me on:\n  - https://fullerdigitalstrategy.com\n\
    \  - https://www.seohandywoman.com\n- Subscribe to my newsletter:\n  - https://fuller-digital-strategy-llc.ck.page/3b2de93afd\n\
    \n### Also by Andrea M. Fuller\n\n![The NO B.S. Guide to Shopify SEO](Images/image-I717MFRG.png)\n\
    \n#### The NO B.S. Guide to Shopify SEO\n\nA must-read for any Shopify entrepreneur\
    \ who wants to take their online store to the next level.\n\nWritten by renowned\
    \ SEO expert and entrepreneur Andrea Fuller and sold in more than 5 countries,\
    \ this guide distills the secrets of SEO that actually drive sales.\n\nYou’ll\
    \ learn insider tactics and techniques that will help you optimize your store\
    \ for search engines and boost your rankings, bringing in more traffic and sales."
