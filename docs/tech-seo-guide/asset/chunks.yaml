    [Also by Andrea M. Fuller](#chapter0016.html)


    I


    Part One


    ## 1


    ### Intro


    We know that as a developer, you’re a master of crafting digital wonders, but
    have you ever wondered how to make sure your creations get noticed by search engines
    and the right audience? That’s where this friendly SEO checklist comes to the
    rescue!


    Think of this checklist as your trusty sidekick, your SEO compass in the labyrinth
    of algorithms and keywords. It’s here to break down the complex world of SEO into
    bite-sized, developer-centric chunks.


    Whether you’re a seasoned developer or just getting started, this checklist is
    designed to be your go-to resource.


    ## 2


    ### Getting Started


    Set up **Google Search Console** (`GSC`) and **Bing Webmaster Tools**: Get these
    tools up and running to monitor your site’s health and performance in search engines.


    Set up **Google Analytics** (`GA`): Understand your site’s traffic and user behavior
    by setting up Google Analytics.


    Install and Configure SEO Plugin (for WordPress): If you’re using WordPress, choose
    and set up an SEO plugin to optimize your site’s SEO easily. (Yoast Pro is the
    best because it allows you to add `301` redirects in it, have full control of
    archive pages and configure basic schema code.)


    Generate and Submit Sitemap: Submit the sitemap to `GSC` and Bing to help search
    engines navigate your site effectively once the site has been pushed live. Yoast
    Pro will generate the sitemap for you and continue to automatically update it.


    Create `robots.txt`: Craft a `robots.txt` file to guide search engine bots on
    which parts of your site to crawl and which to avoid.


    Check for Manual Actions: Regularly review Webmaster Tools for any manual actions
    that might affect your site’s search presence.


    Ensure Site Indexing: Confirm that search engines are indexing your site’s pages
    properly. Check Day 2 post-launch and weekly after that for 3 months. After that
    review monthly with metrics report and `404` check, etc.


    ## 3


    ### Technical SEO


    Ensure **HTTPS** Usage: Secure your site by using HTTPS protocol.


    Check for Duplicate Versions: Avoid duplicate content issues by ensuring only
    one version of your site is accessible. These can occur with Archive pages, tags
    (which you should never use), and collections pages or product pages on ecommerce
    sites. Also, some CMSs automatically create them because the canonical is not
    automatically set for product pages.


    Fix Crawl Errors: Identify and resolve any issues that might hinder search engine
    crawling.


    Speed Up Your Site: Improve your site’s loading speed for better user experience
    and search rankings. Use Google’s free Page Speed Insights checker. Make sure
    to use a `CDN` to cache the site to help.


    Link Checkup: Regularly scan for broken internal and external links.


    **HTTP** Links on **HTTPS** Pages: Update any HTTP links found on your HTTPS pages.


    SEO-Friendly URLs: Craft URLs that are easily understandable by both users and
    search engines. Make sure to set the permalinks to include the page hierarchy
    within the URL and the blog name/category/post-title in the blog URLs.


    Add Schema Markup: Enhance your site’s visibility in search results with schema
    markup. Can be done through Yoast for basic schema, if your site is ecommerce
    or needs more than the basics then create, test and deploy.


    Assess Page Depth: Keep an eye on how many clicks it takes to reach different
    pages on your site.


    Redirect Check: Ensure your redirects (`301`s) are set up correctly. Do NOT use
    `302`s and make sure to add `410`s to any URLs you fully delete. `301`s are just
    a “change of address form” not to be used for deleted content.


    Add a Security Plugin: Activate a great security plugin or app (depending upon
    the `CMS`) to help with brute force attacks, scrapping, etc.


    ## 4


    ### Onsite + Content SEO


    **H1** Tag Cleanup: Avoid multiple `H1` tags on a single page to maintain a clear
    hierarchy. Only the page title should have a `H1` tag.


    **H2** Tag Set-up: Make sure that all paragraph headers are set to `H2` and properly
    styled in the `CSS`. Search engines need to see `H2` tags to gain context and
    want to see the keyword present in them.


    Image Size and File Name: Compress and size properly all images before uploading.
    Ensure the file name includes the company/organization’s name and a generic description
    of what it is (adding the keyword for that page is a bonus). Ex: `companyx_aboutus_ceo_janedoe.jpeg`


    Image Alt Tags: Add descriptive `alt` tags to images for accessibility and SEO
    benefits (adding the keyword the page is optimized for is a bonus).


    Internal Linking: Strategically link between your site’s pages to improve navigation
    and SEO.


    Pagination & Canonical Tags: Ensure these are properly set and applied across
    the site. Each `CMS` is slightly different so, check to see they are there and
    working as they should (Ex: Shopify automatically adds the canonical tag, but
    doesn’t add the right URL, so you need to update the rule in the Liquid file.)


    ## 5


    ### Conclusion


    And there you have it my developer friends! You’ve just powered through our SEO
    checklist like a coding maestro. Congrats!


    If you ever find yourself lost in the SEO maze or need a friendly nudge in the
    right direction, remember that this checklist is here to guide you.


    Keep coding, keep optimizing, and keep being the awesome developer you are. Cheers
    to your website’s success and all the great things yet to come!


    II


    Part Two


    ## 6


    Bonus: Developer’s Guide to SEO-Friendly Pagination: Tips, Tricks, and Traps


    Hey there, my trusty developer friends! In this bonus section we’re diving into
    the intriguing world of pagination.


    You might wonder why this topic is crucial for us in the development realm, so
    let’s break it down and talk about:


    - What pagination is,

    - Its impact on SEO, and

    - Why it’s vital to get it right'
