- 'no': 2
  overturn_probability: 0.1
  alternative: 这本书的书名/封面标题，属于前置内容（Front Matter）的一部分
  counter_evidence:
  - 根据规则“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”，第2行是书名，第16行是目录，它们共同构成了前置内容。
  - 第2行本身是Markdown的一级标题，但其下方紧接着是作者信息、版权声明、版本号等，这些内容在逻辑上是一个整体的“版权页/扉页”区块。
  - 虽然将其作为该区块的起始点（即前置章节的开头）进行分章在工程实现上（如提取章节文本）通常是合理的（因为需要一个新的章节ID来容纳这些非正文内容），但从严格的“章节标题”定义来看，它不是一个统领后续正文内容的章节标题，而是一个文档元数据块。
  - 如果后续没有明确的后置章节划分需求，或者为了简化结构，可以将前置所有非正文内容（书名到目录结束）合并为一个单独的“前言/版权”章节，此时第2行作为该章节的起始标记是符合逻辑的。
  keep_split: true
