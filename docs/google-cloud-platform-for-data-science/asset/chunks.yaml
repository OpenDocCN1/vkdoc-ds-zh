    of using Vertex AI, such as effectively managing and scaling machine learning
    workflows.


    Additionally, we explored Google Cloud Dataproc, a managed Spark and Hadoop service
    designed for big data processing. We learned about its use cases and how it simplifies
    the deployment and management of big data processing clusters.


    Finally, we delved into TensorFlow, a popular open source machine learning framework.
    We gained an understanding of its basics and its capabilities for building and
    training machine learning models.


    Throughout the chapter, we learned about the different tools and services available
    on Google Cloud for working with big data and machine learning. This knowledge
    equips us with the necessary skills to effectively leverage these tools in our
    big data and machine learning projects.'
  trans: '

    # TensorFlow


    `TensorFlow` 是一个流行的开源软件库，用于构建和训练机器学习模型。它起源于 2015 年的谷歌大脑团队，现已发展成为全球应用最广泛的机器学习库之一（Ahmed,
    2023）。


    该库提供了多种工具和功能，用于构建和训练多种类型的机器学习模型，包括神经网络、决策树和线性回归模型。此外，它还包含大量预构建的模型架构和训练算法，简化了开发者构建和训练机器学习模型的过程。


    `TensorFlow` 的一个显著特性是其高效处理大型数据集的能力，以及支持跨多个设备或集群进行分布式训练。这使得开发者能够构建和训练更复杂的模型，以处理更大量的数据并产生更精确的结果。


    `TensorFlow` 的多功能性及其与多种平台和编程语言（如 `Python`、`C++` 和 `Java`）的兼容性，为其赢得了显著声誉。这使得将 `TensorFlow`
    模型集成到各种应用和工作流程中变得非常容易。


    总之，`TensorFlow` 是构建和训练机器学习模型的强大工具，它拥有广泛的特性和功能，这使其成为开发者和数据科学家的首选。


    以下是一个简单的 `TensorFlow` 教程，你可以在 `Colab` 上运行。


    在本教程中，我们将构建一个简单的 `TensorFlow` 模型来对 `MNIST` 数据集中的图像进行分类。


    **步骤 1：设置环境。**


    第一步是在 `Colab` 上设置环境。我们将安装 `TensorFlow 2.0` 并导入必要的库：


    ```

    !pip install tensorflow==2.0.0-alpha0

    import tensorflow as tf

    from tensorflow import keras

    ```


    **步骤 2：加载和预处理数据。**


    接下来，我们将加载并预处理数据。我们将使用 `MNIST` 数据集，该数据集包含 60,000 张训练图像和 10,000 张手写数字测试图像（Reis,
    2016）。以下代码加载 `MNIST` 数据集，并通过将像素值缩放到 0 到 1 之间以及将标签转换为独热编码来对其进行预处理：


    ```

    (x_train, y_train), (x_test, y_test) = keras.datasets.mnist.load_data()

    x_train = x_train.astype(''float32'') / 255.0

    x_test = x_test.astype(''float32'') / 255.0

    y_train = keras.utils.to_categorical(y_train)

    y_test = keras.utils.to_categorical(y_test)

    ```


    **步骤 3：构建模型。**


    现在，我们将使用 `TensorFlow` 的 `Keras` API 构建模型。我们将使用一个具有两个隐藏层的简单神经网络。以下代码使用 `Keras`
    API 定义了一个具有两个隐藏层的简单神经网络。该模型由一个将输入图像展平为向量的 `Flatten` 层、两个具有 `ReLU` 激活函数的全连接层，以及一个具有
    `softmax` 激活函数并产生输出概率的最终全连接层组成：


    ```

    model = keras.Sequential([

    keras.layers.Flatten(input_shape=(28, 28)),

    keras.layers.Dense(128, activation=''relu''),

    keras.layers.Dense(10, activation=''softmax'')

    ])

    ```


    **步骤 4：训练模型。**


    接下来，我们将使用 `compile` 和 `fit` 方法在训练数据上训练模型。以下代码使用 `Adam` 优化器和分类交叉熵损失函数编译模型，并在训练数据上以
    32 的批量大小训练五个周期：


    ```

    model.compile(optimizer=''adam'',

    loss=''categorical_crossentropy'',

    metrics=[''accuracy''])

    model.fit(x_train, y_train, epochs=5, batch_size=32)

    ```


    **步骤 5：评估模型。**


    最后，我们将在测试数据上评估模型并打印准确率：


    ```

    test_loss, test_acc = model.evaluate(x_test, y_test)

    print(''Test accuracy:'', test_acc)

    ```


    就是这样！你已经成功在 `Colab` 上构建并训练了一个 `TensorFlow` 模型。


    要在 `Colab` 上运行本教程，只需创建一个新的笔记本并将代码复制粘贴进去。确保选择 GPU 运行时以加快训练速度。


    # 总结


    在本章中，我们深入探讨了大数据和机器学习的世界，探索了几项谷歌云服务和工具。


    我们从介绍 `BigQuery` 开始，这是一个完全托管的数据仓库解决方案，能够存储和查询海量数据集。我们讨论了它的用例以及它如何促进大规模数据分析。我们使用免费的
    `Sandbox` 实现了它。


    接下来，我们探索了 `BigQuery ML`，这是 `BigQuery` 的一项功能，允许我们直接在 `BigQuery` 环境中构建机器学习模型。我们学习了如何使用
    `SQL` 查询创建和部署模型，从而简化了机器学习过程。


    接着，我们介绍了谷歌云 AI 平台，这是一个提供一系列机器学习工具和服务的综合性平台。我们发现了它在训练和部署机器学习模型方面的能力，为我们提供了可扩展且灵活的基础设施。


    然后，我们重点介绍了 `Vertex AI`，这是一个强大的机器学习平台，为训练和部署模型提供了统一的界面。我们讨论了使用 `Vertex AI` 的好处，例如有效管理和扩展机器学习工作流程。


    此外，我们还探索了谷歌云 `Dataproc`，这是一个专为大数据处理设计的托管 `Spark` 和 `Hadoop` 服务。我们了解了它的用例以及它如何简化大数据处理集群的部署和管理。


    最后，我们深入研究了 `TensorFlow`，这是一个流行的开源机器学习框架。我们了解了它的基础知识以及它在构建和训练机器学习模型方面的能力。


    在本章中，我们了解了谷歌云上可用于处理大数据和机器学习的不同工具和服务。这些知识使我们具备了必要的技能，能够在我们的大数据和机器学习项目中有效利用这些工具。

    '
- fmt: '# 4. Data Visualization and Business Intelligence


    Within this chapter, our focus will be directed toward the realm of data visualization
    and its intersection with business intelligence. Our attention will be particularly
    drawn to `Looker Studio` and `Colab` as potent instruments for crafting engaging
    visualizations and comprehensive reports.


    Embarking on our journey, we shall commence with an exploration of the capabilities
    of `Looker Studio`, a robust tool for both data investigation and visualization.
    Through this, we will unravel its array of features that empower us to convert
    raw data into meaningful insights.


    Subsequently, we will plunge into the intricacies of producing and disseminating
    data visualizations and reports via `Looker Studio`. This educational segment
    will provide insights into establishing connections with diverse data sources,
    architecting visualizations, and fabricating interactive reports, easily shared
    with concerned parties.


    Our exploration will then shift to the fusion of `BigQuery` and `Looker`, illuminating
    how these two tools harmoniously collaborate to dissect and visualize extensive
    datasets. A comprehension of the synergy between `BigQuery`''s potent querying
    prowess and `Looker`''s user-friendly interface will be cultivated.


    Advancing, we will home in on the art of constructing dashboards using `Looker
    Studio`. This phase will reveal the techniques behind crafting tailored dashboards
    that coalesce numerous visualizations, offering a panoramic snapshot of vital
    metrics and performance indicators.


    Concluding our expedition, we will delve into data visualization through `Colab`,
    a collaborative notebook milieu. Through this segment, we will assimilate the
    adept utilization of Python libraries such as `pygwalker`, `panda` and `numpy`
    to yield visually captivating charts and graphs within the `Colab` framework.


    Throughout this chapter''s progression, the importance of data visualization will
    be illuminated, particularly its pivotal role in steering business intelligence.
    We will adeptly harness `Looker Studio` and allied tools to transmute intricate
    data into actionable insights, effectively communicating them to stakeholders
    in a captivating and comprehensible manner.


    ## Looker Studio and Its Features


    Google `Looker Studio` is a data analytics and business intelligence platform
    that is integrated with Google Cloud. It provides a unified interface for exploring,
    visualizing, and sharing data insights with others.


    Key features of `Looker Studio` are as follows:


    1. **Data modeling**: `Looker Studio` allows you to build a data model by defining
    the relationships between your data tables and creating custom calculations.


    2. **Interactive data visualizations**: The platform provides a wide range of
    interactive data visualizations, including bar charts, line graphs, pie charts,
    and heat maps.


    3. **Dashboards and reports**: `Looker Studio` allows you to create interactive
    dashboards and reports to share data insights with stakeholders.


    4. **SQL editor**: The `SQL` editor provides a user-friendly interface for writing
    and executing `SQL` queries, making it easier to extract data from databases and
    manipulate it.


    5. **Collaboration and sharing**: `Looker Studio` has robust collaboration and
    sharing features, allowing you to share dashboards and reports with others and
    make real-time changes.


    6. **Integrations**: `Looker Studio` integrates with various data sources, including
    Google `BigQuery`, Amazon `Redshift`, Snowflake, and more.


    7. **Customizable LookML**: `Looker Studio` defines data models using `LookML`,
    a proprietary modeling language. `LookML` is highly customizable, allowing you
    to create custom calculations and build your data models.


    8. **Advanced security**: To safeguard your data, `Looker Studio` offers a suite
    of advanced security features, including data encryption, access control, and
    user management. These measures work in unison to ensure the protection and integrity
    of your valuable data.


    These are some of the key features of Google `Looker Studio`. With its powerful
    data modeling, interactive data visualizations, and collaboration features, `Looker
    Studio` makes exploring, understanding, and sharing data insights with others
    easier.'
