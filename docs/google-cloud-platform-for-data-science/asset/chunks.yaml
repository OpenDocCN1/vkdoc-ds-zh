- fmt: "# Creating and Running Jupyter Notebooks on Colaboratory\n\nTo begin your\
    \ journey with Colab, follow these steps to access the platform:\n\n![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig1_HTML.jpg)\n\
    \nA screenshot of the sign-in page for Google contains boxes to be filled with\
    \ email or phone followed by a link for forgotten email. Two buttons at the bottom\
    \ are to create an account and next.\n\n**Figure 2-1** Sign up for a Google account\n\
    \n1. **Open a web browser**: Launch your preferred web browser on your computer\
    \ or mobile device.\n2. **Sign up for a Google account**: Before using Colaboratory,\
    \ you must have a Google account. If you don’t have one, sign up for a free Google\
    \ account (Figure [2-1](#606032_1_En_2_Chapter.xhtml#Fig1)).\n\n![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig2_HTML.jpg)\n\
    \nA screenshot exhibits a table with 5 columns for example, recent, Google Drive,\
    \ GitHub, and upload. The recent is selected that exhibits a list of titles and\
    \ their details for last opened and first opened. At the bottom right there are\
    \ 2 buttons for new notebook and cancel.\n\n**Figure 2-2** Colaboratory after\
    \ login\n\n3. **Navigate to Colaboratory**: Visit the Google Colaboratory website\
    \ ([`https://colab.research.google.com/`](https://colab.research.google.com/))\
    \ and log in with your Google account. Upon logging in, you should see a dialog\
    \ like the one shown in Figure [2-2](#606032_1_En_2_Chapter.xhtml#Fig2).\n\n![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig3_HTML.jpg)\n\
    \nA screenshot of a new notebook with the name untitled 1 dot I p y n b.\n\n**Figure\
    \ 2-3** New notebook\n\n4. **Colab interface overview**:\n   - **Menu bar**: The\
    \ top section of the Colab interface houses the menu bar. It contains various\
    \ options for file operations, runtime configuration, and more. Take a moment\
    \ to explore the available menu options.\n   - **Toolbar**: The toolbar is located\
    \ directly below the menu bar. It provides quick access to common actions such\
    \ as running, inserting new cells, and changing cell types.\n   - **Code cells**:\
    \ The main area of the Colab interface is composed of code cells. These cells\
    \ allow you to write and execute Python code. By default, a new notebook starts\
    \ with a single code cell. You can add additional cells as needed.\n   - **Text\
    \ cells (Markdown cells)**: Besides code cells, Colab supports text cells, also\
    \ known as Markdown cells. Text cells allow you to add explanatory text, headings,\
    \ bullet points, and other formatted content to your notebook. They help provide\
    \ documentation, explanations, and context to your code.\n\n5. **Create a new\
    \ notebook**: To create a new Colaboratory notebook, click the **New notebook**\
    \ button in the top-right or bottom-right corner as shown in Figure [2-2](#606032_1_En_2_Chapter.xhtml#Fig2).\n\
    \n6. **Select the runtime type**: When creating a new notebook, you’ll need to\
    \ specify the runtime type. Select **Python 3** to work with Python in Colaboratory.\n\
    \n7. **Start coding**: You’re now ready to start coding in Python. You can change\
    \ the notebook’s name by clicking the top-left corner where “Untitled1.ipynb”\
    \ is written (Figure [2-3](#606032_1_En_2_Chapter.xhtml#Fig3)). Click the first\
    \ code cell in your notebook to select it. Type a simple Python statement, such\
    \ as `print(\"Hello, Colab!\")`, into the code cell. Press `Shift+Enter` to execute\
    \ the code. The output of the code will appear below the cell.\n\n## Hands-On\
    \ Example\n\nInsert text in the notebook to describe the code by clicking the\
    \ **+ Text** button.\n\n![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig4_HTML.jpg)\n\
    \nA screenshot of a browser window. The title of the page is Practicle underscore\
    \ lab underscore 1 dot I p y n b. The browser window is divided into two parts,\
    \ a left-hand sidebar and a main area.\n\n**Figure 2-4** Insert text in the notebook\n\
    \nPerform a sum of two numbers.\n\n![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig5_HTML.jpg)\n\
    \nA screenshot of a notebook named practicle lab 1 dot i p y n b exhibits 5 line\
    \ text for the test arithmatic operation.\n\n**Figure 2-5** Arithmetic example\n\
    \nAs can be seen from the preceding image, `a = 2`, `b = 3`, and `sum = a + b`,\
    \ giving an output of `5`.\n\nHere is an example in Python to generate random\
    \ numbers using the `random` library and visualize the data using Matplotlib.\n\
    \n![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig6_HTML.jpg)\n\nA screenshot\
    \ of a notebook named practicle lab 1 dot i p y n b exhibits a snippet of codes\
    \ for the data science example to create data by generating random numbers and\
    \ visualizing data.\n\n**Figure 2-6** Data science example\n\nThe following code\
    \ demonstrates how to generate random numbers, create a histogram, and visualize\
    \ the data using the Python libraries `random` and `matplotlib.pyplot`:\n\n```\n\
    import random\nimport matplotlib.pyplot as plt\n# Generate 100 random numbers\
    \ between 0 and 100\nrandom_numbers = [random.randint(0,100) for i in range(100)]\n\
    # Plot the data as a histogram\nplt.hist(random_numbers, bins=10)\nplt.xlabel('Number')\n\
    plt.ylabel('Frequency')\nplt.title('Random Number Distribution')\nplt.show()\n\
    ```\n\nHere’s a breakdown of the code:\n\n- **`import random` and `import matplotlib.pyplot\
    \ as plt`**: These lines import the necessary libraries for generating random\
    \ numbers and creating visualizations using Matplotlib.\n- **`random_numbers =\
    \ [random.randint(0,100) for i in range(100)]`**: This line generates a list called\
    \ `random_numbers` containing 100 random integers between 0 and 100. The `random.randint()`\
    \ function from the `random` library is used within a list comprehension to generate\
    \ these random numbers.\n- **`plt.hist(random_numbers, bins=10)`**: This line\
    \ creates a histogram using the `hist()` function from `matplotlib.pyplot`. It\
    \ takes the `random_numbers` list as input and specifies the number of bins (10)\
    \ for the histogram. The `hist()` function calculates the frequency of values\
    \ within each bin and plots the histogram.\n- **`plt.xlabel('Number')`, `plt.ylabel('Frequency')`,\
    \ `plt.title('Random Number Distribution')`**: These lines set the labels for\
    \ the x-axis and y-axis and the title of the plot, respectively.\n- **`plt.show()`**:\
