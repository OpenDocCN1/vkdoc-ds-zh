- fmt: '# BigQuery ML


    `BigQuery ML` is a feature in Google Cloud’s `BigQuery` that allows you to build
    machine learning models directly within `BigQuery`, without the need to move data
    out of `BigQuery`. This means you can use `BigQuery ML` to train machine learning
    models on large datasets that you have stored in `BigQuery`.


    `BigQuery ML` supports several types of machine learning models, including linear
    regression, logistic regression, k-means clustering, and matrix factorization.
    You can use the SQL syntax in `BigQuery` to create and evaluate your machine learning
    models, making it easy for data analysts and developers already familiar with
    SQL.


    The benefits of using `BigQuery ML` include faster training times, lower costs,
    and improved accuracy compared with traditional machine learning approaches that
    require you to move data out of `BigQuery`. In addition, because `BigQuery ML`
    runs on Google’s infrastructure, it can handle very large datasets, making it
    a good choice for organizations with a lot of data.


    Overall, `BigQuery ML` provides a fast and cost-effective way to build and deploy
    machine learning models in a fully managed environment.


    In the following, you will find a comprehensive tutorial that guides you through
    each step of utilizing `BigQuery ML` to generate a classification model using
    the `Pandas DataFrame` previously created in Colab. To regenerate the dataset,
    execute the provided code on Colab:


    ```

    import pandas as pd

    import numpy as np

    # Generate random features

    np.random.seed(0)

    n_samples = 1000

    n_features = 5

    X = np.random.randn(n_samples, n_features)

    # Generate random target

    np.random.seed(1)

    y = np.random.randint(0, 2, n_samples)

    # Combine the features and target into a data frame

    df = pd.DataFrame(np.hstack((X, y[:, np.newaxis])), columns=["feature_1", "feature_2",
    "feature_3", "feature_4", "feature_5", "target"])

    # Save the data to a CSV file

    df.to_csv("data.csv", index=False)

    ```


    You can find the `data.csv` in the Colab files. Download the file and save it
    on your computer.


    **Create a BigQuery dataset:** Go to the Google Cloud Console, select `BigQuery`,
    and create a new `BigQuery` dataset.


    **Upload the data to BigQuery:** Go to the `BigQuery Editor` and create a new
    table. Then, upload the data to this table by clicking Create Table and selecting
    Upload. Choose the file containing the data and select the appropriate options
    for the columns.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig8_HTML.png)


    A screenshot displays the options under the create table. It lists the fields
    under the source and destination with the create table button.


    Figure 3-8


    Create Table on BigQuery


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig9_HTML.png)


    A screenshot displays the options under the create dataset. It lists the fields
    under project I D, location type, and default table expiry with the create dataset
    button.


    Figure 3-9


    Create Table on BigQuery—setting various options


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig10_HTML.jpg)


    A screenshot displays the uploaded data on the table under the preview tab.


    Figure 3-10


    After the table upload, preview the table


    **Create a BigQuery ML model**: In the `BigQuery Editor`, create a new SQL query.
    Use the `CREATE MODEL` statement to create a `BigQuery ML` model. Here’s an example:


    ```

    CREATE MODEL your_model_name

    OPTIONS (model_type=''logistic_reg'', input_label_cols=[''target'']) AS

    SELECT *

    FROM your_dataset_name.your_table_name

    ```


    In the preceding syntax, enter `your_model_name` and `your_dataset_name.your_table_name`
    in ( ``). See the following code for the uploaded dataset:


    ```

    CREATE MODEL `example_data.data_set_class_rand_model`

    OPTIONS (model_type=''logistic_reg'', input_label_cols=[''target'']) AS

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ```


    Here, the model name is `example_data.data_set_class_rand_model` and the table
    name is `practice-project-1-377008.example_data.data_set_class_rand`. For finding
    the table name, click the table and go to the DETAILS option. The following screen
    will appear. Find Table ID and copy it and paste it into the placeholder `your_dataset_name.your_table_name`.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig11_HTML.png)


    A screenshot of the sandbox page displays the table information under the details
    tab of the created table.


    Figure 3-11


    Find the table name


    Now, your editor should look like this. If everything is fine, you will be able
    to find a green tick in the right corner like the following. Go ahead and run
    the query.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig12_HTML.jpg)


    A screenshot displays the workspace that runs the query to create a model. It
    lists the query results with the details under the job information.


    Figure 3-12


    BigQuery ML


    Go to Results and click Go to model. For model evaluation, the following results
    can be seen.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig13_HTML.jpg)


    A screenshot displays the aggregated metrics created along with the score threshold
    under the evaluation tab.


    Figure 3-13


    Model evaluation after training


    **Evaluate the model**: In the `BigQuery Editor`, create a new SQL query. Use
    the `ML.EVALUATE` function to evaluate the model. Here’s an example of how to
    do this:


    ```

    SELECT *

    FROM ML.EVALUATE(MODEL your_model_name, (

    SELECT *

    FROM your_dataset_name.your_table_name

    ))

    ```


    In the preceding syntax, put all the details as before, and your query should
    look like the following:


    ```

    SELECT *

    FROM ML.EVALUATE(MODEL `example_data.data_set_class_rand_model`, (

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ))

    ```


    Run the query and you can find the following results.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig14_HTML.jpg)


    A screenshot of a page displays the workspace that runs the query to evaluate
    the model and lists the query results with the personal and project histories.


    Figure 3-14


    Model evaluation


    **Make predictions**: In the `BigQuery Editor`, create a new SQL query. Use the
    `ML.PREDICT` function to make predictions. Here’s an example of how to do this:


    ```

    SELECT *

    FROM ML.PREDICT(MODEL your_model_name, (

    SELECT *

    FROM your_dataset_name.your_table_name

    ))

    ```


    Again insert all the information as before, and your query should look like the
    following:


    ```

    SELECT *

    FROM ML.PREDICT(MODEL `example_data.data_set_class_rand_model`, (

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ))

    ```


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig15_HTML.jpg)


    A screenshot of a page displays the workspace that runs the query to predict the
    model and lists the query results with personal and project histories.


    Figure 3-15


    Prediction


    This is a high-level overview of using `BigQuery ML` to create a classification
    model using the `BigQuery Editor`. For a more detailed explanation of the different
    functions and options, please refer to the `BigQuery ML` documentation.'
