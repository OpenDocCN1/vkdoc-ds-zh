  trans: "\n### 使用资源管理器 API 授予和移除 IAM 角色\n\n1.  为确保您拥有必要的权限，请创建一个新项目，或选择一个您已拥有这些权限的现有项目。\n\
    2.  启用 API：\n    - Identity and Access Management (IAM) API\n    - Cloud Resource\
    \ Manager API\n3.  为项目中的一位主账号授予 `Logs Viewer` 角色。\n\n![](img/606032_1_En_7_Fig1_HTML.jpg)\n\
    \n截图显示了 Google Cloud 网站页面的一个片段，左侧面板选中了“IAM 与管理”选项卡，该选项卡下显示了一个子菜单，其中“IAM”选项卡被高亮。\n\
    \n**图 7-1** IAM 与管理\n\n1.  点击 `GRANT ACCESS`。\n\n![](img/606032_1_En_7_Fig2_HTML.jpg)\n\
    \n截图显示了 Google Cloud 网站页面的一个部分，左侧面板选中了“IAM”选项卡，右侧显示 IAM 页面，顶部的 `GRANT ACCESS`\
    \ 选项卡被高亮。\n\n**图 7-2** `GRANT ACCESS`\n\n1.  输入主账号的电子邮件地址。\n\n![](img/606032_1_En_7_Fig3_HTML.jpg)\n\
    \n截图显示了“授予对实践项目 1 的访问权限”页面，其中包含“资源”、“添加主账号”和“分配角色”等标题，以及相应的输入字段和“IAM 条件”。页面底部的“保存”按钮被选中。\n\
    \n**图 7-3** `GRANT ACCESS` — 信息\n\n1.  从 `Select a role` 菜单中，选择您要授予访问权限的产品或服务。\n\
    2.  如果您想撤销访问权限，可以按照以下步骤操作：\n\n**确定要撤销其角色的成员和角色**：在撤销 IAM 角色之前，您需要知道哪个成员被分配了该角色，以及您要撤销哪个角色。\n\
    \n**导航到 IAM 页面**：点击左侧导航菜单中的 `IAM` 选项卡，打开 Google Cloud 控制台中的 IAM 页面。\n\n**查找成员**：使用页面顶部的搜索栏查找被分配了您要撤销的角色的成员。点击该成员的姓名以查看其被分配的角色。\n\
    \n**移除角色**：找到您要撤销的角色，点击 `X` 图标以从该成员处移除该角色。将出现一个确认对话框。点击 `Remove` 以确认您要撤销该角色。\n\
    \n**验证角色已被撤销**：撤销角色后，您应验证该成员不再拥有与该角色关联的资源的访问权限。您可以使用 Google Cloud 控制台或 Cloud Identity\
    \ and Access Management API 来检查该成员的角色和权限。\n\n需要注意的是，撤销 IAM 角色并不会从您的项目或组织中移除该成员。该成员可能仍被分配有其他角色，并且可能仍能访问某些资源。要完全从您的项目或组织中移除一个成员，您需要移除其所有被分配的角色和权限。\n\
    \n## 使用 Google Cloud Source Repositories 进行版本控制\n\nGoogle Cloud Source Repositories\
    \ 是 Google Cloud Platform (GCP) 提供的一项源代码管理服务。它允许您以安全且可扩展的方式存储和管理源代码，并提供高级功能，例如代码搜索、代码审查以及持续集成和持续部署\
    \ (CI/CD)。\n\n以下是 Google Cloud Source Repositories 的一些关键特性：\n\n- **可扩展性**：Google\
    \ Cloud Source Repositories 可以处理任意大小的仓库，并能扩展以满足大型企业的需求。\n- **代码搜索**：Google Cloud\
    \ Source Repositories 提供高级代码搜索功能，允许您跨所有仓库搜索特定的代码片段、文件甚至函数。\n- **代码审查**：Google\
    \ Cloud Source Repositories 使审查代码更改和与其他开发者协作变得容易。您可以创建拉取请求、分配审查者并实时跟踪更改。\n- **集成的\
    \ CI/CD**：Google Cloud Source Repositories 与 `Cloud Build` 和 `Cloud Functions`\
    \ 等其他 GCP 服务集成，允许您自动构建和部署代码。\n- **安全性**：Google Cloud Source Repositories 提供多层安全保护来保护您的代码，包括静态和传输中加密、基于\
    \ IAM 角色的访问控制以及审计日志。\n- **灵活性**：Google Cloud Source Repositories 支持广泛的源代码管理工具和协议，包括\
    \ `Git`、`Mercurial` 和 `Subversion`。\n\nGoogle Cloud Source Repositories 与其他 GCP\
    \ 服务完全集成，允许您将其与其他 GCP 工具和服务无缝结合使用。它是管理源代码、与其他开发者协作以及自动化软件开发工作流的强大解决方案。\n"
- fmt: '# Dataplex


    `Dataplex` is a new data platform launched by Google Cloud in 2021. It is designed
    to simplify the complexities of modern data management by providing a unified,
    serverless, and intelligent data platform. `Dataplex` allows users to manage their
    data across multiple clouds and on-premises data stores through a single interface.


    The platform offers many key features that make it a valuable tool for data management:


    1. **Unified data fabric**: `Dataplex` provides a unified data fabric that enables
    users to manage their data across multiple data stores, including `Google Cloud
    Storage`, `BigQuery`, `Cloud Spanner`, and `Cloud SQL`. This allows users to store
    and manage their data in the most appropriate data store for their use case while
    maintaining a consistent view of their data.


    2. **Serverless architecture**: `Dataplex` is built on a serverless architecture,
    which means that users don’t have to worry about managing infrastructure. This
    makes setting up and scaling data management systems easy while reducing costs
    and increasing agility.


    3. **Intelligent data management**: By employing machine learning algorithms,
    `Dataplex` automates various data management tasks including data classification,
    data lineage, and data discovery. This automation enhances the effective governance
    and management of data, mitigating the chances of errors and improving overall
    efficiency.


    4. **Open platform**: `Dataplex` is an open platform that allows users to use
    their preferred tools and technologies. This makes it easy to integrate with existing
    systems and workflows and to extend the platform with custom applications and
    services.


    `Dataplex` is a powerful data management platform that simplifies the complexities
    of modern data management. With its diverse range of features, `Dataplex` proves
    to be an invaluable tool for data scientists, data engineers, and other professionals
    dealing with extensive and intricate datasets.


    This tutorial will guide you through the fundamental steps of configuring `Dataplex`
    within the `Google Cloud Console`.


    ## Step 1: Create a Google Cloud project


    1. First, you must create a new project in the `Google Cloud Console`. However,
    if you already have a project, please proceed to the next step.


    2. Go to the [Google Cloud Console](https://console.cloud.google.com/).


    3. Click the project drop-down at the top of the page and select `NEW PROJECT`.


    4. Enter a name for your project and click `CREATE`.


    ## Step 2: Enable the Dataplex API


    Next, we need to enable the `Dataplex API` for our project.


    1. In the `Google Cloud Console`, navigate to `APIs and services`.


    2. Click the `+ Enabled APIs and services` button.


    ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig4_HTML.jpg)


    A screenshot of the Google Cloud website page with the `A P Is and Services` tab
    selected from the left side panel, which presents a submenu listing different
    options.


    Figure 7-4


    `+ Enabled APIs and services`


    1. Search for `Dataplex` in the search bar and select `Dataplex API` from the
    results.


    ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig5_HTML.jpg)


    A screenshot depicts a portion of the web page with the search bar filled in with
    the word `dataplex` and the results shown below.


    Figure 7-5


    Select the `Dataplex API`


    1. Click the `ENABLE` button to enable the API.


    ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig6_HTML.jpg)


    A screenshot depicts an extract of the Google Cloud web page, which presents `Cloud
    Dataplex A P I` under the head product details. The enable button below is clicked.


    Figure 7-6


    Enable `Dataplex`


    ## Step 3: Create a lake


    1. Go to `Dataplex` in the cloud console and click `Explore`.


    ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig7_HTML.png)


    A screenshot of the `Dataplex A P I` page with the `create lake` button selected
    from the Google Cloud website.


    Figure 7-7


    `Dataplex`—create a lake


    1. After clicking `CREATE LAKE`, you can see the following image. Fill in the
    required details. Click `CREATE`.


    ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig8_HTML.jpg)'
