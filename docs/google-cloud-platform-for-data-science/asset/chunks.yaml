    \ Looker Studio 页面的局部内容。其中包含一个选项列表，并选中了“数据源”选项。\n\n**图 4-8**\n\n数据源选项卡\n\n1. \
    \ 滚动到 `File Upload` 并点击它。\n\n![](img/606032_1_En_4_Fig9_HTML.jpg)\n\n未命名的数据源页面截图，显示了多个模板，其中“文件上传”选项被选中。\n\
    \n**图 4-9**\n\n选择文件上传\n\n1.  上传文件。\n\n![](img/606032_1_En_4_Fig10_HTML.jpg)\n\n\
    截图展示了一个网页的局部内容，其中显示了一个对话框，提示“将文件拖到此处以创建新数据集”。“点击上传文件”按钮被高亮显示。\n\n**图 4-10**\n\n\
    上传数据\n\n1.  重命名当前标题为 `Data Source` 的文件。\n\n![](img/606032_1_En_4_Fig11_HTML.jpg)\n\
    \n截图展示了一个标题为“Sale Superstore Report”的网页局部内容。页面中有一个用于重命名的输入字段，由一个向右箭头指示。\n\n**图\
    \ 4-11**\n\n重命名数据源标题\n\n1.  文件应显示 ![](img/606032_1_En_4_Figa_HTML.gif) 一个带阴影的圆圈。表示已上传。\n\
    \n![](img/606032_1_En_4_Fig12_HTML.jpg)\n\n超级商店销售报告页面的截图，列出了文件名、上传日期和时间、大小以及状态等详细信息。数据状态显示为“已上传”。\n\
    \n**图 4-12**\n\n数据上传状态\n\n1.  使用位于右上角的 `CONNECT` 按钮连接文件。\n\n![](img/606032_1_En_4_Fig13_HTML.jpg)\n\
    \n超级商店销售报告页面的截图，列出了文件名、上传日期和时间、大小以及状态等详细信息。页面右上角的“连接”按钮已被选中。\n\n**图 4-13**\n\n\
    连接数据\n\n1.  文件连接成功后，您将看到如下截图所示的视图。然后检查维度的确切格式。例如，`Customer Name` 是 `Text` 类型，`Order\
    \ Date` 是 `Date` 类型，`Order Quantity` 是 `Number` 类型，等等。\n\n![](img/606032_1_En_4_Fig14_HTML.jpg)\n\
    \n编辑连接页面的截图，列出了字段、类型、详细聚合和描述等信息。字段及其类型（如客户名称、订单日期和订单数量）被框选出来。页面右上角的“创建报告”和“探索”按钮已被选中。\n\
    \n**图 4-14**\n\n数据视图\n\n1.  然后点击 `CREATE REPORT`。它将带您进入一个新视图。您将看到以下屏幕。\n\n![](img/606032_1_En_4_Fig15_HTML.jpg)\n\
    \n未命名报告页面的截图，右侧窗格显示了图表和数据面板，其中“订单日期”和“订单优先级”选项被选中。左侧窗格以表格形式列出了订单优先级和记录计数。页面右上角的“查看”按钮已被选中。\n\
    \n**图 4-15**\n\n创建报告后的首次显示\n\n1.  为未命名的报告文件命名。\n\n![](img/606032_1_En_4_Fig16_HTML.jpg)\n\
    \n截图展示了超级商店销售报告页面的局部内容，其中有一个表格列出了订单优先级和记录计数数据，并且整个表格被选中。\n\n**图 4-16**\n\n为报告命名\n\
    \n这就是创建报告并可视化数据的方法。\n\n1.  您可以在查看模式下看到表格。\n\n![](img/606032_1_En_4_Fig17_HTML.jpg)\n\
    \n截图展示了网页的局部内容，其中包含图表和数据面板。图表下方的“设置”选项卡被选中。页面顶部的“查看”按钮已被点击。\n\n**图 4-17**\n\n\
    查看模式\n\n它看起来像这样。\n\n![](img/606032_1_En_4_Fig18_HTML.jpg)\n\n超级商店销售报告 1 页面的截图，有一个表格列出了订单优先级和记录计数数据。页面右上角的“编辑”按钮已被选中。\n\
    \n**图 4-18**\n\n查看数据\n\n1.  点击右上角的 `Share` 按钮，与团队成员共享报告。将弹出一个共享窗口。在 `Add people\
    \ and groups` 中，添加人员或群组的电子邮件 ID/名称并保存。点击 `Done`。\n    *   您可以通过点击右上角的 `Edit` 按钮来编辑文件。它将再次返回到查看模式之前的原始形式。\n\
    \n这就是使用 Looker Studio 文件上传连接器创建报告、可视化数据并共享报告的方法。\n\n## BigQuery 和 Looker\n\n由于我们已经学习了\
    \ BigQuery 并创建了一些表，我们可以在 Looker 中使用这些表进行可视化。\n\n1.  前往 Looker 中的 `Report` 并点击\
    \ `Add data`。\n2.  前往 `Connect to data` 并选择 `BigQuery`，然后授权。\n\n![](img/606032_1_En_4_Fig19_HTML.png)\n\
    \n未命名报告页面的截图，在“向报告添加数据”标题下显示了 BigQuery。下方选中了“近期项目”选项卡，其中列出了项目。页面右上角的“查看”按钮已被选中。\n\
    \n**图 4-19**\n\nBigQuery 和 Looker\n\n1.  选择上一屏幕中显示的项目 `Practice Project 1`。\n\
    2.  您将看到与您的项目关联的数据集列表。如果您使用的是免费提供的 Looker 以及 BigQuery Sandbox 中的数据集，则不会计入计费（请查看最新的\
    \ Google 指南以了解定价）。\n3.  点击一个数据集并选择一个表。您将能够在报告中看到您的数据。\n    *   您应该能够看到此处描绘的屏幕。由于我们已经在之前的章节中创建了项目，我们可以使用同一个项目，或者如果您还没有创建，请遵循最后几章的说明。\n"
- fmt: '### Building a Dashboard


    This section will guide you through developing a custom dashboard using Looker
    Studio. To begin, sign into Looker Studio with your Gmail account. As mentioned
    in the previous section, you have already uploaded an Excel sheet and connected
    it to Looker Studio. Let’s get started with that report.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig20_HTML.jpg)


    A screenshot presents an extract of the Looker Studio welcome page with the recent
    tab from the left panel selected and the displayed page on the right. On the right,
    the reports tab is selected, which has templates labeled blank report and tutorial
    report. The superstore sale report 1 file is selected.


    Figure 4-20


    Select a report


    Return to your previous report and click the `Page` option in the header. From
    there, select `New page` to create a blank report for you to work with.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig21_HTML.jpg)


    A screenshot presents an extract of the superstore sale report 1 page, from which
    the page tab is selected, which lists a drop-down menu. The new page option from
    the drop-down menu is selected.


    Figure 4-21


    Insert a new page


    Change the theme and layout as per your choice.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig22_HTML.jpg)


    A screenshot presents an extract of the superstore sale report 1 page, which includes
    the theme and layout panel on the right of the page from which the theme tab is
    selected. The view button on the top right corner of the page is selected.


    Figure 4-22


    Select Theme and Layout


    Now, we can start adding different charts to build the dashboard:


    1.  **Scorecard**: Go to the `Add a chart` button and click the scorecard `Total`.
    Create multiple scorecards by adding more scorecards or by copying and pasting
    the given scorecard. Change the metric of each scorecard as shown in the `Setup`
    section on the right-hand side of the page.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig23_HTML.jpg)


    A screenshot presents an extract of the superstore sale report 1 page, which has
    the chart panel on the right pane from which the setup tab is selected. Under
    the setup tab, the sales option is boxed, and the value is displayed on the left
    pane. The view button on the top right is selected.


    Figure 4-23


    Create scoreboards


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig24_HTML.jpg)


    A screenshot presents an extract of the superstore sale report 1 page, which provides
    the values of sales, profit, order quantity, and shipping cost.


    Figure 4-24


    Scoreboards for building a dashboard


    1.  **Time series chart**: Click the `Add a chart` button and select `Time series`
    from the options. Drag the chart to appear below the Sales scorecard. Customize
    the chart to display the sales trend during a specific period. To do this, go
    to the `Setup` option, select `Default date range`, and choose the `Custom` option.
    Then, select the start and end dates for the sales trend. See the following example.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig25_HTML.jpg)


    A screenshot has an extract of the web page, which presents the chart panel on
    the right of the page, from which the setup tab is selected. Under the setup tab,
    the sales option is selected, which presents a line chart for sales in a fluctuating
    trend on the left pane.


    Figure 4-25


    Line chart


    1.  **Bar chart**: Click the `Add a chart` button and choose `Bar` from the options.
    Drag the chart onto the page concerning the previous time series chart. Add another
    metric, such as the profit, to the chart. See the following example.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig26_HTML.jpg)


    A screenshot of an extract of the web page presents the chart panel on the right,
    from which the setup tab is selected. Under the setup tab, the sales and profit
    options are selected. It presents a line chart and a horizontal double-bar graph
    for sales and profit on the left side of the page.


    Figure 4-26


    Bar chart


    1.  **Pie chart**: Click the `Add a chart` button and choose `Donut` from the
    pie chart options. In the `Setup` section, change the dimension to display product
    categories. See the following example.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig27_HTML.jpg)


    A screenshot of an extract of the web page presents the chart panel on the right
    side of the page. The profit option is selected from the chart panel, which presents
    a horizontal double-bar graph and a donut chart for profit on the left side of
    the page.


    Figure 4-27


    Donut chart


    1.  **Table**: Choose the `Table` option from the `Add a chart` button. Create
    a table that displays the sales and profit of each product category.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig28_HTML.jpg)


    A screenshot of an extract of the web page presents the chart panel on the right
    pane. The sales and profit options are selected from the chart panel. It has a
    horizontal double-bar graph, a donut chart, and a table that provides the details
    of product category, sales, and profit on the left pane.


    Figure 4-28


    Table


    1.  **Bubble map**: Click the `Add a chart` button and choose `Bubble Map` from
    the Google Maps options. Position the map with the line chart on the page by dragging
    it. Adjust the setup settings by selecting `Location` and choosing `Region`, setting
    `Tooltip` to display `Province`, selecting `Region` as `Color dimension`, and
    using `Sales` or `Profit` for `Size`.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig29_HTML.jpg)


    A screenshot of an extract of the web page presents the fields panel on the right
    pane. The fields panel presents details such as location, tooltip, color dimension,
    and size. On the left is a bubble map of the North American region, which presents
    the sales in different states.


    Figure 4-29


    Bubble map


    1.  **Date range**: Click the `Add a control` option and select `Date range control`.
    Drag the control to the top-right corner of the page. Select the start and end
    dates for the range, which will adjust all the chart values on the dashboard accordingly.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig30_HTML.jpg)


    A screenshot of an extract of the web page presents the date range control properties
    panel on the right side of the page with the setup tab selected. On the left side
    of the page, a box provides the details as follows, January 1, 2009 to May 31,
    2009, which is highlighted.


    Figure 4-30


    Date range control


    The completed dashboard is presented in the following.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig31_HTML.jpg)


    A screenshot of a dashboard provides the values for sales, profit, order quantity,
    and shipping cost. Below is a line chart, a horizontal double-bar graph, a bubble
    map, a donut chart, and a table.


    Figure 4-31


    Dashboard'
