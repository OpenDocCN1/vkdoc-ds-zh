    \ 表下载为 Pandas DataFrame。\n4. 之后，它使用 `download_table` 函数下载三个独立的数据集 `df_train`、`df_validation`\
    \ 和 `df_test`。\n5. 随后，定义了一个名为 `convert_dataframe_to_dataset` 的函数，该函数接受两个 DataFrame\
    \ 作为参数。第一个 DataFrame 对应训练数据，第二个 DataFrame 代表验证数据。\n6. 在函数内部，第一步是分离输入数据和标签数据。这是通过使用\
    \ `.pop` 方法完成的。\n7. 然后将输入数据转换为 Numpy 数组，并使用 `tf.keras.utils.to_categorical` 将标签数据转换为独热表示。\n\
    8. 最后，使用 `tf.data.Dataset.from_tensor_slices` 将训练数据和验证数据都转换为 TensorFlow 数据集。\n\
    9. 最终，该函数返回训练数据和验证数据的 TensorFlow 数据集。\n10. 代码随后调用 `convert_dataframe_to_dataset`\
    \ 函数，并将 `df_train` 和 `df_validation` 作为参数，以创建 `dataset_train` 和 `dataset_validation`\
    \ 数据集。\n\n```python\n# 下载一个表\ndef download_table(bq_table_uri: str):\n    # 如果存在，移除\
    \ bq:// 前缀\n    prefix = \"bq://\"\n    if bq_table_uri.startswith(prefix):\n\
    \        bq_table_uri = bq_table_uri[len(prefix) :]\n\n    # 将 BigQuery 表下载为 dataframe\n\
    \    # 这需要在自定义训练服务账号上拥有 \"BigQuery Read Session User\" 角色。\n    table = bq_client.get_table(bq_table_uri)\n\
    \    return bq_client.list_rows(table).to_dataframe()\n\n# 下载数据集拆分\ndf_train =\
    \ download_table(training_data_uri)\ndf_validation = download_table(validation_data_uri)\n\
    df_test = download_table(test_data_uri)\n\ndef convert_dataframe_to_dataset(\n\
    \    df_train: pd.DataFrame,\n    df_validation: pd.DataFrame,\n):\n    df_train_x,\
    \ df_train_y = df_train, df_train.pop(LABEL_COLUMN)\n    df_validation_x, df_validation_y\
    \ = df_validation, df_validation.pop(LABEL_COLUMN)\n\n    y_train = np.asarray(df_train_y).astype(\"\
    float32\")\n    y_validation = np.asarray(df_validation_y).astype(\"float32\"\
    )\n\n    # 转换为 numpy 表示\n    x_train = np.asarray(df_train_x)\n    x_test = np.asarray(df_validation_x)\n\
    \n    # 转换为独热表示\n    num_species = len(df_train_y.unique())\n    y_train = tf.keras.utils.to_categorical(y_train,\
    \ num_classes=num_species)\n    y_validation = tf.keras.utils.to_categorical(y_validation,\
    \ num_classes=num_species)\n\n    dataset_train = tf.data.Dataset.from_tensor_slices((x_train,\
    \ y_train))\n    dataset_validation = tf.data.Dataset.from_tensor_slices((x_test,\
    \ y_validation))\n\n    return (dataset_train, dataset_validation)\n\n# 创建数据集\n\
    dataset_train, dataset_validation = convert_dataframe_to_dataset(df_train, df_validation)\n\
    ```\n\n接下来，以下代码是一个用于训练机器学习模型的脚本。它包含以下步骤：\n\n1. **打乱训练集**：使用 `tf.data.Dataset`\
    \ 类的 `shuffle` 函数对 `dataset_train` 进行打乱。`shuffle` 的参数是 `df_train` 数据框中的元素数量。\n\
    2. **创建模型**：`create_model` 函数使用 TensorFlow 的 `Sequential` 类创建模型架构。该架构包含五个使用 ReLU\
    \ 激活函数的全连接层和一个 softmax 输出层。第一层有 100 个神经元，第二层有 75 个神经元，第三层有 50 个神经元，第四层有 25 个神经元，输出层有三个神经元，代表类别数量。模型使用\
    \ `Sequential` 类的 `compile` 函数进行编译，使用分类交叉熵损失、准确率指标和 RMSprop 优化器。\n3. **批量处理数据集**：使用\
    \ `tf.data.Dataset` 类的 `batch` 函数，以指定的批次大小对 `dataset_train` 和 `dataset_validation`\
    \ 数据集进行分批处理。批次大小通过 `args.batch_size` 参数指定。\n4. **训练模型**：使用 `Sequential` 类的 `fit`\
    \ 函数在 `dataset_train` 数据上训练模型，使用指定的训练轮数 `args.epochs`，并将 `dataset_validation`\
    \ 作为验证数据。\n"
- fmt: "5. **Save the model**: The trained model is saved to disk using TensorFlow’s\
    \ `tf.saved_model.save` function, with the path to the saved model specified by\
    \ the `os.getenv(\"AIP_MODEL_DIR\")` environment variable.\n\n```\n# Shuffle train\
    \ set\ndataset_train = dataset_train.shuffle(len(df_train))\ndef create_model(num_features):\n\
    # Create model\nDense = tf.keras.layers.Dense\nmodel = tf.keras.Sequential(\n\
    [\nDense(\n100,\nactivation=tf.nn.relu,\nkernel_initializer=\"uniform\",\ninput_dim=num_features,\n\
    ),\nDense(75, activation=tf.nn.relu),\nDense(50, activation=tf.nn.relu),\nDense(25,\
    \ activation=tf.nn.relu),\nDense(3, activation=tf.nn.softmax),\n]\n)\n# Compile\
    \ Keras model\noptimizer = tf.keras.optimizers.RMSprop(lr=0.001)\nmodel.compile(\n\
    loss=\"categorical_crossentropy\", metrics=[\"accuracy\"], optimizer=optimizer\n\
    )\nreturn model\n# Create the model\nmodel = create_model(num_features=dataset_train._flat_shapes[0].dims[0].value)\n\
    # Set up datasets\ndataset_train = dataset_train.batch(args.batch_size)\ndataset_validation\
    \ = dataset_validation.batch(args.batch_size)\n# Train the model\nmodel.fit(dataset_train,\
    \ epochs=args.epochs, validation_data=dataset_validation)\ntf.saved_model.save(model,\
    \ os.getenv(\"AIP_MODEL_DIR\"))\n```\n\nThe output will be `Writing task.py`.\n\
    \n**Define arguments for your training script.**\n\nThe following code sets up\
    \ the configuration for a machine learning training job:\n\n- The first line,\
    \ `JOB_NAME`, sets the name of the training job to `\"custom_job_unique\"`.\n\
    - The next two lines, `EPOCHS` and `BATCH_SIZE`, specify the number of epochs\
    \ and the batch size to be used in the training process.\n- The `CMDARGS` variable\
    \ is a list that holds the command-line arguments that will be passed to the training\
    \ script. In this case, there are three command-line arguments being passed:\n\
    \  1. `\"--label_column=\" + LABEL_COLUMN`: Specifies the name of the column that\
    \ holds the label data. The value for this argument is taken from the `LABEL_COLUMN`\
    \ variable.\n  2. `\"--epochs=\" + str(EPOCHS)`: Sets the number of epochs to\
    \ be used in the training process. The value is taken from the `EPOCHS` variable.\n\
    \  3. `\"--batch_size=\" + str(BATCH_SIZE)`: Sets the batch size to be used in\
    \ the training process. The value is taken from the `BATCH_SIZE` variable.\n\n\
    ```\nJOB_NAME = \"custom_job_unique\"\nEPOCHS = 20\nBATCH_SIZE = 10\nCMDARGS =\
    \ [\n\"--label_column=\" + LABEL_COLUMN,\n\"--epochs=\" + str(EPOCHS),\n\"--batch_size=\"\
    \ + str(BATCH_SIZE),\n]\n```\n\n**Train and deploy your model.**\n\nThe following\
    \ code creates a custom training job on Google Cloud AI Platform—the `aiplatform.CustomTrainingJob`\
    \ class is used to specify the details of the training job.\n\nThe training job\
    \ has the following parameters:\n\n- `display_name`: A string that specifies the\
    \ name of the training job. In this case, the value is `\"custom_job_unique\"\
    `.\n- `script_path`: A string that specifies the path of the script that contains\
    \ the training code. In this case, the value is `\"task.py\"`.\n- `container_uri`:\
    \ A string that specifies the Docker container image to use for the training.\
    \ In this case, the value is `\"us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-8:latest\"\
    `, which is a TensorFlow CPU image with version 2.8.\n- `requirements`: A list\
    \ of strings that specify the Python packages required for the training. In this\
    \ case, the list contains two packages: `\"google-cloud-bigquery>=2.20.0\"` and\
    \ `\"db-dtypes\"`.\n- `model_serving_container_image_uri`: A string that specifies\
    \ the Docker container image to use for serving the model after training. In this\
    \ case, the value is `\"us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest\"\
    `, which is a TensorFlow CPU image with version 2.8 for serving.\n\nThe `job`\
    \ variable will contain the instance of `CustomTrainingJob` after the code is\
    \ executed:\n\n```\njob = aiplatform.CustomTrainingJob(\ndisplay_name=JOB_NAME,\n\
    script_path=\"task.py\",\ncontainer_uri=\"us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-8:latest\"\
    ,\nrequirements=[\"google-cloud-bigquery>=2.20.0\", \"db-dtypes\"],\nmodel_serving_container_image_uri=\"\
    us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest\",\n)\n```\n\nIn the\
    \ following code snippet, the `MODEL_DISPLAY_NAME` variable is defined as `\"\
    penguins_model_unique\"`. This string is used as the display name for the AI Platform\
    \ model that will be created during the training process.\n\nThe code then calls\
    \ the `run` method on the `job` object, which represents a custom training job\
    \ in AI Platform. The `run` method is used to start the training process.\n\n\
    The following parameters are passed to the `run` method:\n\n- `dataset`: A BigQuery\
    \ dataset object representing the data to be used for training.\n- `model_display_name`:\
    \ A string representing the display name for the AI Platform model that will be\
    \ created during training. This string is assigned the value of the `MODEL_DISPLAY_NAME`\
    \ variable.\n- `bigquery_destination`: A string representing the destination to\
    \ store the AI Platform model in BigQuery. The destination is specified as a BigQuery\
    \ URI, and the `project_id` variable is used to construct the URI.\n- `args`:\
    \ A list of strings representing command-line arguments to be passed to the custom\
    \ training script. The value of this parameter is assigned the value of the `CMDARGS`\
    \ variable, which is a list of strings defining the label column to use, the number\
    \ of epochs to train for, and the batch size.\n\n```\nMODEL_DISPLAY_NAME = \"\
    penguins_model_unique\"\n# Start the training and create your model\nmodel = job.run(\n\
    dataset=dataset,\nmodel_display_name=MODEL_DISPLAY_NAME,\nbigquery_destination=f\"\
    bq://{project_id}\",\nargs=CMDARGS,\n)\n```\n\nWait till you get the output `CustomTrainingJob\
    \ run completed`.\n\nThe following code defines a variable `DEPLOYED_NAME`, which\
    \ is assigned the string value `\"penguins_deployed_unique\"`. This is the display\
    \ name of the deployed model.\n\nThe code then calls the `deploy` method on the\
    \ `model` object, passing in the display name of the deployed model as an argument.\
    \ The `deploy` method creates an endpoint to serve predictions based on the trained\
    \ model. The endpoint is saved with the display name `DEPLOYED_NAME` and is returned\
    \ as the `endpoint` variable:\n\n```\nDEPLOYED_NAME = \"penguins_deployed_unique\"\
    \nendpoint = model.deploy(deployed_model_display_name=DEPLOYED_NAME)\n```\n\n\
    **Make a prediction.**\n\n**Prepare prediction test data**: The following code\
    \ removes the `\"species\"` column from the data frame `df_for_prediction`. This\
    \ is likely because the species column is the label or target column that the\
    \ model was trained to predict. The species column is not needed for making predictions\
    \ with the trained model.\n\nNext, the code converts the data frame `df_for_prediction`\
    \ to a Python list `test_data_list`. This is likely to prepare the data for making\
    \ predictions with the deployed model. The `values` attribute of the data frame\
    \ is used to convert the data frame to a Numpy array, and then the `tolist()`\
    \ method is used to convert the Numpy array to a list:\n\n```\n# Remove the species\
    \ column\ndf_for_prediction.pop(LABEL_COLUMN)\n# Convert data to a Python list\n\
    test_data_list = df_for_prediction.values.tolist()\n```\n\n**Send the prediction\
    \ request:** Finally, the code makes predictions by calling the `predict()` method\
    \ on the `endpoint` and passing the `test_data_list` as the argument for `instances`.\
    \ The predictions are stored in the `predictions` variable and can be accessed\
    \ by calling `predictions.predictions`:\n\n```\n# Get your predictions.\npredictions\
    \ = endpoint.predict(instances=test_data_list)\n# View the predictions\npredictions.predictions\n\
    ```\n\nOutput should look like the following:\n\n```\n[[0.323929906, 0.0947248116,\
    \ 0.58134526],\n[0.300531268, 0.0670630634, 0.632405639],\n[0.349939913, 0.146268025,\
    \ 0.503792107],\n```"
