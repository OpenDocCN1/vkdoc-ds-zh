    **探索可用数据集：** BigQuery 沙盒提供了对多个公共数据集的访问权限，您可以使用这些数据集来练习运行查询。要查看可用数据集列表，请点击屏幕左侧导航菜单中的
    `Datasets` 选项卡。


    从上述界面中，您可以看到可以尝试 Google Trends 演示查询。点击 `OPEN THIS QUERY` 按钮后，您将看到以下结果。


    ![](img/606032_1_En_3_Fig4_HTML.png)


    沙盒页面的截图。它显示了点击 `open this query` 按钮后的 Google Trends 演示查询。


    **图 3-4** Google Trends 演示查询


    **选择数据集：** 点击数据集的名称以选择它，并查看其架构和表。在此示例中，使用了 `bigquery-public-data.google_trends.top_terms`
    表。


    **编写查询：** 要编写查询，请点击导航菜单中的 `Query Editor` 选项卡。在查询编辑器中，使用 BigQuery 的类 SQL 语法编写查询，然后点击
    `Run Query` 按钮来执行它。以下查询使用 `bigquery-public-data.google_trends.top_terms` 表中的数据，检索每日热门
    Google 搜索词列表：


    ```

    -- 此查询显示每日热门 Google 搜索词列表。

    SELECT

    refresh_date AS Day,

    term AS Top_Term,

    -- 这些搜索词每天在美国排名前 25。

    rank,

    FROM `bigquery-public-data.google_trends.top_terms`

    WHERE

    rank = 1

    -- 仅选择每天排名第一的搜索词。

    AND refresh_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 2 WEEK)

    -- 筛选最近两周的数据。

    GROUP BY Day, Top_Term, rank

    ORDER BY Day DESC

    -- 按日期倒序显示。

    ```


    以下是该查询的分解说明：


    `SELECT` 语句指定了结果集中要包含的列。它选择了 `refresh_date` 列并将其别名为“Day”，`term` 列别名为“Top_Term”，以及
    `rank` 列。


    `FROM` 子句指定了要从中检索数据的表 `bigquery-public-data.google_trends.top_terms`。


    `WHERE` 子句根据特定条件过滤数据。在此例中，它仅包含 `rank` 列等于 1 的行，表示每天的排名第一的搜索词。它还通过将 `refresh_date`
    列与 `DATE_SUB(CURRENT_DATE(), INTERVAL 2 WEEK)` 的结果进行比较，来过滤数据以仅包含过去两周的记录，该函数从当前日期减去两周。


    `GROUP BY` 子句按“Day”、“Top_Term”和 `rank` 列对结果集进行分组。这确保了这些列的每个组合在结果集中只出现一次。


    `ORDER BY` 子句根据“Day”列按降序对结果集进行排序。这意味着最近的日期将首先显示。


    简而言之，该查询检索了过去两周内每天的排名第一的 Google 搜索词，并按时间倒序呈现，首先显示最近的日期。


    **查看查询结果：** 查询执行后，您将在 `Results` 选项卡中看到结果。您也可以通过点击 `Save` 按钮来保存查询。


    **重复此过程：** 您可以多次重复此过程，尝试不同的数据集并编写多样化的查询，以深入探索 BigQuery 提供的强大功能。


    **探索数据：** 在查询结果中，有保存结果和探索数据的选项。


    ![](img/606032_1_En_3_Fig5_HTML.png)


    沙盒页面的截图。它显示了点击 `open this query` 按钮后的 Google Trends 演示查询，并显示了带有保存和探索数据选项的查询结果。


    **图 3-5** 使用 BigQuery 探索数据


    **使用 Colab 探索数据：** 点击 `Explore with Colab Notebook` 按钮后，您将看到以下界面。


    ![](img/606032_1_En_3_Fig6_HTML.png)


    页面的截图，显示了点击 `Explore with Colab Notebook` 按钮后的设置界面，并显示了一组程序代码作为 Colab 工作表，其中包含参考的
    SQL 语法。


    **图 3-6** Colab 工作表


    按照第 2 章中使用 Colab 的相同流程，开始探索数据。


    **使用 Looker Studio 探索数据：** 点击 `Explore with Looker Studio` 后，可以看到以下界面。


    ![](img/606032_1_En_3_Fig7_HTML.png)


    截图显示了点击 `Explore with Looker Studio` 按钮后的 Looker Studio 报告页面，并在热门搜索词下方显示了一个带有相应数据的条形图。


    **图 3-7** 使用 Looker Studio 进行数据探索


    BigQuery 沙盒是一个简单直观的工具，为开始使用 BigQuery 并熟悉其功能提供了绝佳途径。基于 Web 的界面和公共数据集使得开始运行查询和学习该工具变得非常容易。

