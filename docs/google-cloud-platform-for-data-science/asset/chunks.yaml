  trans: "\n# Google Cloud Dataprep 简介及其在数据准备中的应用场景\n\nGoogle Cloud Dataprep 是一项由\
    \ Google 管理的全方位数据准备服务。它使用户能够以可视化方式探索、清理和准备数据，以便用于分析或机器学习。凭借其直观的界面，用户无需编写代码即可交互式地深入研究和修改数据，从而简化了数据准备流程。\n\
    \n以下是 Google Cloud Dataprep 在数据准备方面的一些应用场景：\n\n- **数据清洗**：Cloud Dataprep 提供了一套全面的工具来清理和标准化数据，确保数据的一致性、准确性和完整性。它提供了去重、文本解析、正则表达式、数据格式化和规范化等功能。这些功能使您能够有效地处理和增强数据，从而提高分析的可靠性和质量。\n\
    - **数据转换**：Cloud Dataprep 允许您将数据转换为下游分析或机器学习所需的格式。它包括数据透视、聚合和数据集合并等功能。\n- **数据丰富**：您可以使用\
    \ Cloud Dataprep 通过将数据与外部数据源（如数据库或 API）连接来丰富数据。这有助于您更深入地了解数据，并进行更全面的分析。\n- **数据探索**：Cloud\
    \ Dataprep 允许您使用其可视化界面快速探索数据。您可以使用数据剖析功能来了解数据的分布情况，并识别异常值、离群点或缺失值。\n- **协作**：Cloud\
    \ Dataprep 为团队提供了一个协作环境，以便共同处理数据准备项目。它允许多个用户同时处理同一个项目，从而更轻松地分享想法、数据和见解。\n\n总之，Google\
    \ Cloud Dataprep 是一个强大的数据准备工具，可以帮助您简化数据准备工作流程，减少准备数据所需的时间和精力，并提高分析的准确性和质量。\n\n\
    1.  在 Google Cloud 项目中启用 Dataflow 和所需的 API：\n    - `Dataflow API`\n    - `Compute\
    \ Engine API`\n    - `Cloud Logging API`\n    - `Cloud Storage`\n    - `Google\
    \ Cloud Storage JSON API`\n    - `BigQuery API`\n    - `Cloud Pub/Sub API`\n \
    \   - `Cloud Resource Manager API`\n\n2.  创建一个 Cloud Storage 存储桶：\n    - 登录 Google\
    \ Cloud 控制台，网址为 [`https://console.cloud.google.com/`](https://console.cloud.google.com/)。\n\
    \    - 选择您的项目，如果尚未创建，请创建一个新项目。\n    - 从主菜单中打开 Cloud Storage 页面。\n    - 点击 `Create\
    \ bucket` 按钮。\n    - 在 `Create a bucket` 对话框中，为您的存储桶输入一个唯一的名称。\n    - 选择您希望存储数据的区域。\n\
    \    - 为您的存储桶选择默认存储类别。您也可以根据需求选择不同的存储类别。\n    - 选择存储桶的访问控制设置。您可以选择将存储桶设为私有或公开访问。\n\
    \    - 点击 `Create` 以创建您的新存储桶。\n\n3.  创建一个 BigQuery 数据集。\n\n4.  创建一个 BigQuery 表：\n\
    \    - 在导航窗格中，展开您的项目，然后选择要创建新表的数据集。\n    - 点击 `Create table` 按钮。\n    - 在 `Create\
    \ table` 对话框中，为您的新表输入一个名称。\n    - 选择您的数据来源。您可以从头开始创建新表，或使用现有表作为模板。\n    - 在 `Schema`\
    \ 部分，通过指定每个字段的名称、数据类型和模式来定义表的列。\n    - 如果您的数据源是 CSV 或 JSON 文件，请指定文件格式和文件位置。\n\
    \    - 配置表的高级选项，例如分区和聚簇。\n    - 点击 `Create table` 以创建您的新 BigQuery 表。\n\n5.  运行管道。\n\
    \n![](img/606032_1_En_5_Fig1_HTML.jpg)\n\n一张 Google Cloud 窗口的截图，用于实践项目 1。左侧窗格中选中了\
    \ `dataflow` 选项卡，下拉菜单列出了 6 个选项，包括 `overview`、`jobs`、`pipelines`、`workbench`、`snapshots`\
    \ 和 `SQL workspace`。\n\n**图 5-1** Dataflow\n\n1.  点击 `CREATE JOB FROM TEMPLATE`。\n\
    \n![](img/606032_1_En_5_Fig2_HTML.jpg)\n\n一张 Google Cloud 窗口的截图，用于实践项目 1。中央的横幅显示“Star\
    \ the Apache Beam GitHub repository”，并带有一个 `Open repository` 按钮。横幅下方的 `jobs` 部分有一个包含\
    \ 10 列的空表和一个 `Create job from template` 按钮。\n\n**图 5-2** 为 Apache Beam GitHub\
    \ 仓库加星标\n\n1.  运行管道。\n\n![](img/606032_1_En_5_Fig3_HTML.jpg)\n\n一张 Google Cloud\
    \ 中 `Create job from template` 页面的截图。输入的作业名称为 `taxi data`，区域端点为 `us-central1 (Iowa)`，`Dataflow\
    \ template` 为 `Pub/Sub Topic to BigQuery`。底部有一个 `Tutorial` 按钮。右侧是管道的示意图。\n\n**图\
    \ 5-3** 从模板创建作业\n\n1.  运行管道后，您将看到以下界面。\n\n![](img/606032_1_En_5_Fig4_HTML.jpg)\n\
    \n一张 Google Cloud 中 `taxi data` 作业页面的截图。选项卡包括 `Job graph`、`Execution details`、`Job\
    \ metrics`、`Recommendations` 和 `Auto-scaling`。`Job graph` 有一个 `Job steps view`\
    \ 的下拉选项，其中选中了 `Graph view`。管道图中 `Read PubSub Topic` 步骤正在运行。\n\n**图 5-4** 管道执行后\n\
    \n1.  查看您的结果。\n\n![](img/606032_1_En_5_Fig5_HTML.png)\n\n一张 `Explorer` 窗口的截图。左侧窗格中选中了\
    \ `practice-project-1`。查询屏幕上有一个来自 `taxi-rides` 的 `SELECT` 查询。查询结果部分列出了表中的数据，列包括\
    \ `ride_id`、`point_index`、`latitude`、`longitude`、`timestamp` 和 `meter_reading`。\n\
    \n**图 5-5** 查看写入实时表的数据\n\n您已成功设置了一个流式处理流程，该流程从 `Pub/Sub` 主题检索 JSON 格式的消息，并将其传输到\
    \ `BigQuery` 表中。\n\n**清理工作：**\n\n1.  打开 Google Cloud 控制台，导航至 `Dataflow Jobs` 页面。\n\
    2.  从作业列表中找到您的流式作业并选中它。\n3.  点击导航栏中的 `Stop` 以停止作业。\n4.  在出现的 `Stop job` 对话框中，选择取消或排空您的管道，然后选择\
    \ `Stop job`。\n5.  转到 Google Cloud 控制台中的 `BigQuery` 页面。\n6.  在 `Explorer` 面板中，展开您的项目以查看关联的数据集。\n\
    7.  在要删除的数据集旁边，点击三个垂直点（更多视图操作），然后选择 `Open`。\n8.  在 `Details` 面板中，点击 `Delete dataset`\
    \ 并按照说明确认删除。\n9.  接下来，转到 Google Cloud 控制台中的 `Cloud Storage` 浏览器页面。\n10. 选中要删除的存储桶旁边的复选框。要删除存储桶，请点击\
    \ `Delete` 并按照说明完成删除过程。\n"
- fmt: '## Summary


    In this chapter, we delved into the realm of data processing and transformation,
    focusing on Google Cloud Dataflow and Google Cloud Dataprep.


    We began with an introduction to Google Cloud Dataflow, a powerful service for
    batch and stream data processing. We explored the various use cases where Dataflow
    shines, such as real-time analytics, ETL (Extract, Transform, Load) pipelines,
    and event-driven processing. We gained an understanding of how Dataflow enables
    scalable and efficient data processing.


    Next, we dived into running data processing pipelines on Cloud Dataflow. We learned
    about the concept of pipelines, which allows us to define the series of steps
    needed to process and transform our data. We explored how Dataflow supported batch
    and stream processing and discovered its integration with other Google Cloud services,
    such as BigQuery and Cloud Pub/Sub.


    Moving on, we explored Google Cloud Dataprep, a data preparation and transformation
    service. We learned about the various use cases where Dataprep can be applied,
    such as data cleansing, normalization, and data wrangling. We discovered the intuitive
    visual interface of Dataprep, which allows users to easily explore and transform
    their data without writing complex code.


    Throughout the chapter, we gained insights into the importance of data processing
    and transformation in the data lifecycle. We learned how Google Cloud Dataflow
    and Google Cloud Dataprep provide powerful tools to process and prepare data at
    scale, enabling us to extract valuable insights and drive informed decision-making.


    By harnessing the potential of Dataflow and Dataprep, we gain the expertise and
    proficiency to design and execute efficient data processing pipelines. We can
    seamlessly convert raw data into a usable format, guaranteeing data quality and
    consistency. This enables us to unleash the complete potential of our data and
    extract valuable insights that propel business growth and achievement.


    # 6. Data Analytics and Storage


    This chapter delves into data analytics and storage, spotlighting Google Cloud
    Storage, Google Cloud SQL, and Google Cloud Pub/Sub. We commence with Google Cloud
    Storage, a scalable object storage solution. It finds utility in data archiving,
    hosting websites, and backups. We explore its features and compatibility with
    other Google services.


    Google Cloud SQL follows a managed relational database service. It excels in storing
    relational data with automatic backups, scalability, and compatibility with engines
    like MySQL and PostgreSQL. Its use spans web apps, content management, and analytics.


    Moving on, Google Cloud Pub/Sub enables real-time data streaming. We learn its
    core concepts and applications in event-driven systems, real-time analytics, and
    IoT. Integration with Cloud Functions and Dataflow is also examined.


    We conclude by mastering data streams with Cloud Pub/Sub. We grasp topics, message
    publication, and subscriber setup. The focus on scalability and reliability empowers
    robust data streaming pipelines.


    This chapter underscores the data’s significance and the tools provided by Google
    Cloud Storage, Cloud SQL, and Cloud Pub/Sub to derive insights and make informed
    decisions. This knowledge equips us to design storage solutions, manage databases,
    and utilize real-time data effectively.


    ## Introduction to Google Cloud Storage and Its Use Cases for Data Storage


    Google Cloud Storage is a highly scalable and reliable object storage service
    offered by Google Cloud Platform (GCP). It provides durable and highly available
    storage for unstructured data that can be accessed from anywhere in the world
    via the Internet. Here are some common use cases for Google Cloud Storage:


    1. **Data backup and disaster recovery**: Google Cloud Storage can be used to
    store backups of critical data and provide disaster recovery solutions for organizations.

    2. **Data archiving**: Google Cloud Storage provides a cost-effective solution
    for archiving large amounts of infrequently accessed data for long-term retention.

    3. **Serving static content for websites and mobile applications**: Google Cloud
    Storage can serve static content like images, videos, and audio files for websites
    and mobile applications.

    4. **Content distribution and media streaming**: Google Cloud Storage can be used
    to distribute and stream media files, enabling faster downloads and a better user
    experience.

    5. **Data analytics and machine learning**: Google Cloud Storage can be integrated
    with other GCP services like BigQuery and TensorFlow to store, process, and analyze
    large volumes of data.

    6. **Collaborative workflows**: Google Cloud Storage can be used for shared access
    to files, enabling teams to work together on projects and store and share data
    across different devices and locations.


    Google Cloud Storage provides a highly scalable and reliable solution for storing
    and accessing unstructured data, making it a suitable choice for a wide range
    of use cases.


    ### Key Features


    Google Cloud Storage is a highly scalable, durable, and secure object storage
    service that provides a range of features to help users store, manage, and access
    their data. Here are some of the key features of Google Cloud Storage:


    **Scalability**: Google Cloud Storage provides virtually unlimited storage capacity,
    allowing users to store and manage petabytes of data.


    **Durability**: Google Cloud Storage provides high durability by automatically
    replicating data across multiple geographic locations, ensuring data is protected
    against hardware failures and other types of disasters.


    **Security**: Google Cloud Storage provides multiple layers of security, including
    encryption at rest and in transit, fine-grained access controls, and identity
    and access management (IAM).


    **Performance**: Google Cloud Storage provides high-performance data access, enabling
    fast upload and download speeds for objects of any size.


    **Integration with other Google Cloud Platform services**: Google Cloud Storage
    integrates seamlessly with other GCP services, such as Compute Engine, App Engine,
    and BigQuery, to support a wide range of use cases.


    **Multi-Regional and Regional storage options**: Google Cloud Storage offers Multi-Regional
    and Regional storage options to cater to different data storage and access needs.


    **Object Lifecycle Management**: Google Cloud Storage supports Object Lifecycle
    Management, allowing users to define rules to automate data retention, deletion,
    or archival policies.


    **Cost-effectiveness**: Google Cloud Storage offers a flexible pricing model that
    allows users to pay only for what they use, making it a cost-effective option
    for storing and accessing data.


    Google Cloud Storage offers a wide range of features that make it a highly scalable,
    durable, and secure object storage service suitable for a variety of use cases.


    ### Storage Options


    Google Cloud Storage provides multiple storage options that cater to different
    data storage and access needs. Here are some of the storage classes offered by
    Google Cloud Storage:


    1. **Standard**: This storage class is suitable for frequently accessed data,
    such as active application data and user data, with low latency and high durability.

    2. **Nearline**: This storage class is ideal for data accessed less frequently
    but that must be available within seconds, such as monthly financial reports or
    large media files.

    3. **Coldline**: This storage class is designed for rarely accessed data but that
    needs to be available within minutes, such as disaster recovery data or long-term
    archives.

    4. **Archive**: This storage class is intended for rarely accessed data and has
    a long retention period, such as regulatory archives or compliance records.'
