- fmt: "# Introduction to Google Cloud Dataprep and Its Use Cases for Data Preparation\n\
    \nGoogle Cloud Dataprep is an all-inclusive data preparation service managed by\
    \ Google. It empowers users to visually explore, cleanse, and prepare their data\
    \ for analysis or machine learning purposes. With its intuitive interface, users\
    \ can interactively delve into and modify their data without the need for coding,\
    \ simplifying the data preparation process.\n\nHere are some of the use cases\
    \ of Google Cloud Dataprep for data preparation:\n\n- **Data cleansing**: Cloud\
    \ Dataprep provides a comprehensive set of tools to clean and standardize your\
    \ data, ensuring consistency, accuracy, and completeness. It offers features like\
    \ deduplication, text parsing, regular expressions, data formatting, and normalization.\
    \ These capabilities enable you to effectively process and enhance your data for\
    \ improved analysis and reliability.\n- **Data transformation**: Cloud Dataprep\
    \ lets you transform your data into the desired format for downstream analysis\
    \ or machine learning. It includes features such as pivoting, aggregating, and\
    \ merging datasets.\n- **Data enrichment**: You can use Cloud Dataprep to enrich\
    \ your data by joining it with external data sources such as databases or APIs.\
    \ This can help you gain deeper insights into your data and create more comprehensive\
    \ analyses.\n- **Data exploration**: Cloud Dataprep lets you quickly explore your\
    \ data using its visual interface. You can use the data profiling feature to understand\
    \ the distribution of your data and identify outliers, anomalies, or missing values.\n\
    - **Collaboration**: Cloud Dataprep provides a collaborative environment for teams\
    \ to work on data preparation projects. It enables multiple users to simultaneously\
    \ work on the same project, making sharing ideas, data, and insights easier.\n\
    \nIn summary, Google Cloud Dataprep is a powerful tool for data preparation that\
    \ can help you streamline your data preparation workflows, reduce the time and\
    \ effort required to prepare your data, and improve the accuracy and quality of\
    \ your analyses.\n\n1.  Enable Dataflow and required APIs in a Google Cloud project:\n\
    \    - `Dataflow API`\n    - `Compute Engine API`\n    - `Cloud Logging API`\n\
    \    - `Cloud Storage`\n    - `Google Cloud Storage JSON API`\n    - `BigQuery\
    \ API`\n    - `Cloud Pub/Sub API`\n    - `Cloud Resource Manager API`\n\n2.  Create\
    \ a Cloud Storage bucket:\n    - Log into the Google Cloud Console at [`https://console.cloud.google.com/`](https://console.cloud.google.com/).\n\
    \    - Select your project, or create a new one if you haven’t already.\n    -\
    \ Open the Cloud Storage page from the main menu.\n    - Click the `Create bucket`\
    \ button.\n    - In the `Create a bucket` dialog box, enter a unique name for\
    \ your bucket.\n    - Select the region where you want your data to be stored.\n\
    \    - Choose the default storage class for your bucket. You can also choose a\
    \ different storage class based on your needs.\n    - Choose your bucket’s access\
    \ control settings. You can choose to keep your bucket private or make it publicly\
    \ accessible.\n    - Click `Create` to create your new bucket.\n\n3.  Create a\
    \ BigQuery dataset.\n\n4.  Create a BigQuery table:\n    - In the navigation pane,\
    \ expand your project and select the dataset where you want to create the new\
    \ table.\n    - Click the `Create table` button.\n    - In the `Create table`\
    \ dialog box, enter a name for your new table.\n    - Choose the source of your\
    \ data. You can create a new table from scratch or use an existing one as a template.\n\
    \    - In the `Schema` section, define the columns for your table by specifying\
    \ the name, data type, and mode for each field.\n    - If your data source is\
    \ a CSV or JSON file, specify the file format and the location of the file.\n\
    \    - Configure the advanced options for your table, such as partitioning and\
    \ clustering.\n    - Click `Create table` to create your new BigQuery table.\n\
    \n5.  Run the pipeline.\n\n![](images/606032_1_En_5_Chapter/606032_1_En_5_Fig1_HTML.jpg)\n\
    \nA screenshot of a Google Cloud window for practice project 1. The `dataflow`\
    \ tab is selected in the left pane, and the dropdown menu lists 6 options that\
    \ include `overview`, `jobs`, `pipelines`, `workbench`, `snapshots`, and `SQL\
    \ workspace`.\n\n**Figure 5-1** Dataflow\n\n1.  Click `CREATE JOB FROM TEMPLATE`.\n\
    \n![](images/606032_1_En_5_Chapter/606032_1_En_5_Fig2_HTML.jpg)\n\nA screenshot\
    \ of a Google Cloud window for practice project 1. The banner at the center reads,\
    \ \"Star the Apache Beam GitHub repository\", with a button for `Open repository`.\
    \ The `jobs` section below the banner has an empty table with 10 columns and a\
    \ button for `Create job from template`.\n\n**Figure 5-2** Star the Apache Beam\
    \ GitHub repository\n\n1.  Run the pipeline.\n\n![](images/606032_1_En_5_Chapter/606032_1_En_5_Fig3_HTML.jpg)\n\
    \nA screenshot of the `Create job from template` page in Google Cloud. The entered\
    \ job name is `taxi data`, the region endpoint is `us-central1 (Iowa)`, and `Dataflow\
    \ template` is `Pub/Sub Topic to BigQuery`. A `Tutorial` button is at the bottom.\
    \ A diagram of the pipeline is on the right.\n\n**Figure 5-3** Create a job from\
    \ a template\n\n1.  After running the pipeline, you can see the following screen.\n\
    \n![](images/606032_1_En_5_Chapter/606032_1_En_5_Fig4_HTML.jpg)\n\nA screenshot\
    \ of the `taxi data` job page in Google Cloud. The tabs include `Job graph`, `Execution\
    \ details`, `Job metrics`, `Recommendations`, and `Auto-scaling`. The `Job graph`\
    \ has a dropdown option for `Job steps view`, with `Graph view` selected. The\
    \ step for `Read PubSub Topic` in the pipeline graph is running.\n\n**Figure 5-4**\
    \ After pipeline execution\n\n1.  View your results.\n\n![](images/606032_1_En_5_Chapter/606032_1_En_5_Fig5_HTML.png)\n\
    \nA screenshot of the `Explorer` window. The pane on the left has `practice-project-1`\
    \ selected. The query screen has a `SELECT` query from `taxi-rides`. The query\
    \ results section lists data from the table with columns that include `ride_id`,\
    \ `point_index`, `latitude`, `longitude`, `timestamp`, and `meter_reading`.\n\n\
    **Figure 5-5** View the data written to the real-time table\n\nYou have effectively\
    \ set up a streaming process that retrieves JSON-formatted messages from a `Pub/Sub`\
    \ topic and transfers them to a `BigQuery` table.\n\n**Clean up:**\n\n1.  Open\
    \ the Google Cloud Console and navigate to the `Dataflow Jobs` page.\n2.  Locate\
    \ your streaming job from the job list and select it.\n3.  Click `Stop` in the\
    \ navigation to stop the job.\n4.  In the resulting `Stop job` dialog, choose\
    \ to either cancel or drain your pipeline and then select `Stop job`.\n5.  Move\
    \ to the `BigQuery` page within the Google Cloud Console.\n6.  In the `Explorer`\
    \ panel, expand your project to view the associated datasets.\n7.  Next to the\
    \ dataset you want to delete, click the three vertical dots (more view actions)\
    \ and select `Open`.\n8.  In the `Details` panel, click `Delete dataset` and follow\
    \ the instructions to confirm the deletion.\n9.  Next, go to the `Cloud Storage`\
    \ browser page within the Google Cloud Console.\n10.  Click the checkbox next\
    \ to the bucket that you want to delete. To delete the bucket, click `Delete`\
    \ and follow the instructions to complete the deletion process."
