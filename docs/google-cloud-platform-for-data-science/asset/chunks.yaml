    # Google Cloud Pub/Sub 简介及其在实时数据流中的应用场景


    Google Cloud Pub/Sub 是 Google Cloud Platform 提供的一项消息传递服务，可实现应用程序之间的异步通信。它允许开发者构建高度可扩展且可靠的消息传递系统，以解耦且容错的方式在应用程序的不同组件之间交换消息。


    Pub/Sub 的基本理念是：发布者（publishers）将消息发送到主题（topics），而订阅者（subscribers）则从这些主题接收消息。主题是消息可以发送到的虚拟通道，订阅者可以关联一个或多个主题以从中接收消息。消息可以采用任何格式，包括
    JSON、XML 或二进制数据，最大可达 10 MB。


    Google Cloud Pub/Sub 提供了一系列功能，简化了开发者对消息传递系统的使用和扩展。例如，它提供了 REST API 以及多种编程语言的客户端库，包括
    Java、Python 和 Go。它还提供了持久化的消息存储，允许消息被存储并在订阅者离线或不可用时也能投递给他们。


    Pub/Sub 还与其他 Google Cloud 服务集成，例如 Google Cloud Functions、Google Cloud Dataflow
    和 Google Cloud Storage，为构建云原生应用的开发者提供了无缝体验。此外，Pub/Sub 具有高度可扩展性，每秒可处理数百万条消息，使其成为高吞吐量消息传递场景的理想选择。


    Google Cloud Pub/Sub 广泛应用于实时数据流场景，例如：


    1.  **物联网数据采集**：Pub/Sub 可用于采集和处理物联网设备产生的大量实时数据。设备可以将数据发布到主题，订阅者可以消费这些数据以执行实时分析或根据数据触发操作。

    2.  **点击流处理**：Pub/Sub 可用于实时处理网站或移动应用产生的点击流数据。数据可以流式传输到 Pub/Sub 主题，订阅者可以消费这些数据来分析用户行为并做出实时决策。

    3.  **金融交易**：Pub/Sub 可用于将实时股票报价、财经新闻和其他市场数据流式传输给订阅者，使他们能够快速响应市场变化并实时执行交易。

    4.  **游戏**：Pub/Sub 可用于流式传输实时游戏事件，例如玩家移动、游戏状态变化和游戏内购买。这使得开发者能够构建实时多人在线游戏，并为用户提供个性化的游戏体验。

    5.  **实时分析**：Pub/Sub 可用于将实时数据流式传输到 Google Cloud Dataflow 或 Apache Beam 等分析平台，从而实现实时分析和决策。


    总之，Google Cloud Pub/Sub 提供了一种可靠且可扩展的消息传递服务，可用于物联网、金融、游戏和分析等多个行业的实时数据流场景。


    ## 使用 Cloud Pub/Sub 设置和消费数据流


    动手实践 Pub/Sub 的逐步指南：


    1.  **项目设置**：为确保您拥有必要的权限，请创建一个新项目，或选择一个您已拥有权限的现有项目。

    2.  **创建主题**：前往 Pub/Sub 浏览器创建一个主题。


    ![](img/606032_1_En_6_Fig15_HTML.jpg)


    一张 Google Cloud 界面的截图，突出显示了 Pub 或 Sub 菜单。


    图 6-15 Pub/Sub


    ![](img/606032_1_En_6_Fig16_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了 Pub 或 Sub 菜单。它列出了要在列表和指标下创建的文件。


    图 6-16 Pub/Sub——创建主题


    点击 `CREATE TOPIC`。填写必要信息，然后点击 `CREATE TOPIC`。


    ![](img/606032_1_En_6_Fig17_HTML.jpg)


    一张标题为“创建主题”的对话框截图。它包含主题 ID 字段以及添加默认订阅和加密的选项。


    图 6-17 Pub/Sub——主题信息


    3.  **添加订阅**：您必须创建订阅才能接收消息。一个主题必须与一个订阅匹配。当您在上一步创建主题时，Pub/Sub 会自动创建一个同名的订阅。按照页面上的步骤创建另一个订阅。


    ![](img/606032_1_En_6_Fig18_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了 Pub 或 Sub 菜单。选择了“主题”选项，并且将要添加该主题的订阅。


    图 6-18 创建订阅


    向下滚动页面，填写必要信息后点击 `Create`。


    4.  返回主题页面并点击该主题。向下滚动，您应该能够看到已创建的订阅。


    ![](img/606032_1_En_6_Fig19_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了 Pub 或 Sub 菜单。它列出了已创建的订阅及其详细信息、快照、指标和消息。


    图 6-19 Pub/Sub——创建订阅


    5.  在该主题上发布两条消息。


    点击 `MESSAGES` 标签页，您可以找到 `PUBLISH MESSAGE` 标签页。点击它。


    ![](img/606032_1_En_6_Fig20_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了 Pub 或 Sub 菜单。选择了“消息”标签页，其中显示了“发布消息”按钮。


    图 6-20 发布消息


    ![](img/606032_1_En_6_Fig21_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了发布消息页面。它列出了主题名称、发布计数、消息数量和消息正文。


    图 6-21 发布一条消息


    在消息正文中输入一条消息。


    6.  前往订阅页面并点击该订阅。转到 `MESSAGES`。如果您没有找到任何消息，请点击 `PULL` 直到您获取到消息。您应该能够在消息正文中看到该消息。


    ![](img/606032_1_En_6_Fig22_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了订阅菜单。它列出了已创建的订阅及其名称、状态和主题名称。


    图 6-22 拉取消息


    Pub/Sub 不保证消息的时间顺序。您可能只注意到了一条消息。如果是这样，请继续点击 `PULL`，直到另一条通知出现。


    7.  **清理**：如果您想清理在本教程中创建的 Pub/Sub 资源，可以删除您创建的主题。再次访问“主题”标签页。选中主题旁边的框，然后点击 `DELETE`。


    ![](img/606032_1_En_6_Fig23_HTML.jpg)


    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了主题菜单。它列出了已创建的主题，可以通过选择特定主题并点击删除按钮来删除。


    图 6-23 删除主题


    同样地，您也可以清理您的订阅。

    '
- fmt: '# Summary


    This chapter explored the world of data analytics and storage, focusing on Google
    Cloud Storage, Google Cloud SQL, and Google Cloud Pub/Sub.


    We began by introducing Google Cloud Storage, a highly scalable and durable object
    storage service. We discussed the various use cases where Cloud Storage is beneficial,
    such as storing and archiving data, hosting static websites, and serving as a
    backup and recovery solution. We explored the key features of Cloud Storage, including
    its storage classes, access controls, and integration with other Google Cloud
    services.


    Next, we delved into Google Cloud SQL, a fully managed relational database service.
    We discussed the advantages of using Cloud SQL for storing and managing relational
    data, including its automatic backups, scalability, and compatibility with popular
    database engines such as MySQL and PostgreSQL. We explored the use cases where
    Cloud SQL is suitable, such as web applications, content management systems, and
    data analytics.


    Moving on, we turned our attention to Google Cloud Pub/Sub, a messaging service
    for real-time data streaming. We learned about the core concepts of Pub/Sub, including
    topics, publishers, and subscribers. We discovered the use cases where Pub/Sub
    excels, such as event-driven architectures, real-time analytics, and IoT data
    processing. We also explored the integration of Pub/Sub with other Google Cloud
    services, such as Cloud Functions and Dataflow.


    Finally, we learned how to set up and consume data streams with Cloud Pub/Sub.
    We explored the steps involved in creating topics, publishing messages, and creating
    subscribers to receive and process the streamed data. We gained insights into
    the scalability and reliability of Pub/Sub, making it an ideal choice for building
    robust and scalable data streaming pipelines.


    Throughout the chapter, we gained a deeper understanding of the importance of
    data storage and analytics in the modern data landscape. We learned how Google
    Cloud Storage, Cloud SQL, and Cloud Pub/Sub provide powerful tools and services
    to store, manage, and analyze data at scale. By leveraging these services, organizations
    can unlock the value of their data, derive meaningful insights, and make data-driven
    decisions.


    With the knowledge and skills acquired from this chapter, we are equipped to design
    and implement robust data storage solutions, leverage relational databases for
    efficient data management, and harness the power of real-time data streaming for
    real-time analytics and event-driven architectures.


    # 7. Advanced Topics


    This chapter delves into advanced aspects of securing and managing Google Cloud
    Platform (GCP) resources, version control using Google Cloud Source Repositories,
    and powerful data integration tools: Dataplex and Cloud Data Fusion.


    We start by emphasizing secure resource management with Identity and Access Management
    (IAM), covering roles, permissions, and best practices for strong access controls.


    Google Cloud Source Repositories is explored as a managed version control system
    for scalable code management and collaboration. Dataplex is introduced as a data
    fabric platform, aiding data discovery, lineage, and governance, while Cloud Data
    Fusion simplifies data pipeline creation and management.


    Throughout, we’ll gain insights to enhance GCP security, streamline code collaboration,
    and optimize data integration for various processing needs.


    ## Securing and Managing GCP Resources with IAM


    IAM (Identity and Access Management) is a service offered by Google Cloud Platform
    (GCP) that facilitates the administration of access to your GCP resources. IAM
    empowers you to regulate resource accessibility and define the actions that individuals
    can execute on those resources. It provides a centralized place to manage access
    control, making enforcing security policies easier and reducing the risk of unauthorized
    access.


    Here are some key concepts related to IAM:


    1. **Resource**: A GCP entity such as a project, bucket, or instance that IAM
    policies can be applied.


    2. **Role**: Roles are a collection of permissions that specify the actions permitted
    on a particular resource. These roles can be assigned to users, groups, or service
    accounts, determining the scope of their operations.


    3. **Member**: An identity that can be assigned a role. Members can be users,
    groups, or service accounts.


    4. **Policy**: A set of role bindings that define who has what permissions on
    a resource.


    Here are some key features of IAM:


    1. **Role-Based Access Control (RBAC)**: IAM uses RBAC to control access to resources.
    RBAC allows you to define roles and assign them to users, groups, or service accounts.


    2. **Custom roles**: IAM provides predefined roles with predefined permissions,
    but you can create custom roles that fit your specific needs. This allows you
    to grant more granular permissions to users or services.


    3. **Service accounts**: Service accounts are a particular type of account that
    can be used by applications or services to authenticate with GCP APIs. They can
    be given permissions just like human users but are not tied to a specific person.


    4. **Audit logging**: IAM provides audit logging that allows you to track who
    has access to your resources and their actions.


    5. **Fine-grained access control**: IAM provides fine-grained access control over
    resources. You can control access to specific resources within a project and even
    within a particular folder or organization.


    6. **Conditional access**: IAM provides conditional access, allowing you to set
    conditions for users or services accessing your resources. For example, you can
    set conditions based on the IP address or device.


    In summary, IAM is a powerful service that allows you to manage access to your
    GCP resources. Using IAM, you can enforce security policies, reduce the risk of
    unauthorized access, and ensure your resources are well-managed.'
