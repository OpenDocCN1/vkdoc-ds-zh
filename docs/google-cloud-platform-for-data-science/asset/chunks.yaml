    1. **计算**：此类别包括用于运行虚拟机（VM）和容器的服务，例如 `Compute Engine`、`Kubernetes Engine` 和 `App
    Engine`。


    2. **存储**：此类别包括用于存储和管理不同类型数据的服务，例如 `Cloud Storage`、`Cloud SQL` 和 `Cloud Datastore`。


    3. **网络**：此类别包括用于管理网络资源的服务，例如 `Virtual Private Cloud (VPC)`、`Cloud Load Balancing`
    和 `Cloud DNS`。


    4. **大数据**：此类别包括用于处理和分析大型数据集的服务，例如 `BigQuery`、`Cloud Dataflow` 和 `Cloud Dataproc`。


    5. **机器学习**：此类别包括用于构建和部署机器学习模型的服务，例如 `Cloud AI Platform`、`AutoML` 和 `AI Building
    Blocks`。


    6. **安全**：此类别包括用于管理和保护 GCP 资源的服务，例如 `Identity and Access Management (IAM)`、`Cloud
    Key Management Service (KMS)` 和 `Cloud Security Command Center`。


    7. **管理工具**：此类别包括用于管理和监控 GCP 资源的服务，例如 `Stackdriver`、`Cloud Logging` 和 `Cloud Monitoring`。


    8. **开发者工具**：此类别包括用于在 GCP 上构建和部署应用程序的服务，例如 `Cloud Build`、`Cloud Source Repositories`
    和 `Firebase`。


    9. **物联网 (IoT)**：此类别包括用于管理和分析物联网数据的服务，例如 `Cloud IoT Core` 和 `Cloud Pub/Sub`。


    ### 设置 GCP 账号和项目


    以下是设置 Google Cloud Platform (GCP) 账号和项目的步骤：


    -   访问 GCP 网站：[`https://cloud.google.com/`](https://cloud.google.com/)。

    -   点击**免费试用**按钮。

    -   使用您现有的 Google 账号登录，如果没有账号，请创建一个新账号。

    -   填写 GCP 账号所需的信息。

    -   账号设置完成后，点击**控制台**按钮以访问 GCP 控制台。

    -   在 GCP 控制台中，点击顶部导航栏中的**项目**下拉菜单。

    -   点击**新建项目**按钮。

    -   为您的项目输入名称和 ID，如果您有多个结算账号，请选择一个结算账号。

    -   点击**创建**按钮。


    您的项目现已设置完成，可以开始使用 GCP 服务。


    **注意**：如果您使用的是免费套餐，请务必监控您的使用情况以避免产生费用，因为某些服务存在限制。此外，您可能需要为项目启用特定服务才能使用它们。


    ## 总结


    Google Cloud Platform (GCP) 提供了一套全面的云计算服务，这些服务利用了与 Google 产品相同的基础设施。本章介绍了 GCP，重点介绍了其基本服务及其与数据科学的相关性。


    我们探讨了数据科学中几个重要的 GCP 服务，包括 `BigQuery`、`Cloud AI Platform`、`Cloud Dataflow`、`Cloud
    DataLab`、`Cloud Dataproc`、`Cloud Storage` 和 `Cloud Vision API`。这些服务中的每一个在数据科学工作流程中都扮演着特定的角色，涵盖从数据存储和处理到机器学习模型开发和部署的各个环节。


    此外，我们还讨论了各种 GCP 数据科学服务提供的免费套餐，使用户能够免费开始使用并探索这些功能。通过参考 GCP 定价页面，及时了解免费套餐和定价的最新信息非常重要。


    按照概述的步骤，用户可以设置自己的 GCP 账号并创建项目，从而为其数据科学项目访问一个强大的云计算平台。


    GCP 强大的基础设施、广泛的服务范围以及与流行数据科学工具的集成，使其成为希望利用云技术进行数据驱动项目的组织和个人极具吸引力的选择。借助 GCP，用户可以充分利用
    Google 基础设施的可扩展性、可靠性和性能，来应对复杂的数据挑战并解锁有价值的见解。


    随着本指南的深入，我们将更详细地探讨特定的 GCP 服务，并研究如何将它们有效地用于各种数据科学任务。


    # 2. Google Colaboratory


    Google Colaboratory 是 Google 提供的一个免费的、基于云的 Jupyter Notebook 环境。它允许个人使用 Python
    和其他编程语言编写和运行代码，并执行数据分析、数据可视化和机器学习任务。该平台设计为易于访问、使用简单且便于协作，使其成为数据科学家、软件工程师和学生中流行的工具。


    本章将指导您完成开始使用 Colab 的过程，从访问平台到了解其功能并有效利用其能力。我们将介绍如何创建和运行 Jupyter notebook、运行机器学习模型，以及从
    Colab 访问 GCP 服务和数据。


    ## Colab 的功能


    **基于云的环境**：Colaboratory 在 Google 的服务器上运行，无需用户在设备上安装软件。


    **易于使用**：Colaboratory 提供了一个用户友好的界面来处理 Jupyter notebook，使编程经验有限的个人也能轻松上手。


    **访问 GCP 服务**：Colaboratory 与 Google Cloud Platform (GCP) 服务集成，允许用户从 notebook 环境中访问和使用
    GCP 资源，例如 `BigQuery` 和 `Cloud Storage`。


    **共享与协作**：Colaboratory 允许用户共享 notebook 并与他人协作完成项目，使其成为团队工作的绝佳工具。


    **GPU 和 TPU 支持**：Colaboratory 提供对 GPU 和 TPU 的访问，用于运行计算密集型任务，例如深度学习和高性能计算。


    Google Colaboratory 为数据科学、机器学习和其他技术任务提供了一个强大而灵活的平台，使其成为希望使用基于云的工具的个人和团队的热门选择。

