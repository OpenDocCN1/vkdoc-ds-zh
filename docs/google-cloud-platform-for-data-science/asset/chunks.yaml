    ### 如何使用 Google Cloud 控制台创建和更新 Dataproc 集群


    使用 Google Cloud 控制台创建和更新 Dataproc 集群是一个直接的过程。以下是创建和更新 Dataproc 集群的步骤。


    #### 创建 Dataproc 集群


    1.  前往 Google Cloud 控制台 (`console.cloud.google.com`)，并导航至 Dataproc 部分。

    2.  启用 Dataproc API。

    3.  点击 `CREATE CLUSTER` 开始集群创建过程。


    ![](img/606032_1_En_3_Fig48_HTML.jpg)


    Google Cloud 窗口的截图突出显示了 Dataproc 下拉菜单下的集群。


    图 3-48


    创建 Dataproc 集群 1


    ![](img/606032_1_En_3_Fig49_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了集群选项。它显示了 Cloud Dataproc 工作区，并突出显示了创建集群按钮。


    图 3-49


    创建 Dataproc 集群 2


    ![](img/606032_1_En_3_Fig50_HTML.jpg)


    Google Cloud 窗口的截图被创建 Dataproc 集群的弹出消息覆盖，该消息包含在计算引擎上创建集群和在 GKE 上创建集群的按钮。


    图 3-50


    创建 Dataproc 集群 3


    点击 `Cluster on Compute Engine`。


    1.  为你的集群选择一个名称，选择你希望集群所在的区域和可用区，并选择你想要使用的 Hadoop 或 Spark 版本。


    ![](img/606032_1_En_3_Fig51_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了集群选项。它显示了在计算引擎上创建 Dataproc 时的设置。已选择设置集群选项。


    图 3-51


    创建 Dataproc 集群 4


    出于概念验证的目的，你可以选择 `Single Node (1 master, 0 workers)` 集群类型。


    1.  选择你想要用于集群的节点数量和类型。你可以自定义节点的 CPU、RAM 和磁盘大小。

    2.  配置你希望为集群设置的任何其他选项，例如初始化脚本或自定义元数据。

    3.  点击 `Create` 开始创建过程。


    ![](img/606032_1_En_3_Fig52_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了集群选项。它显示了已创建的集群，包括名称、状态、区域、可用区和总工作节点数。


    图 3-52


    Dataproc 集群创建状态


    #### 更新 Dataproc 集群


    1.  前往 Google Cloud 控制台，并导航至 Dataproc 部分。

    2.  从集群列表中选择你想要更新的集群。

    3.  点击 `EDIT` 按钮开始更新过程。


    ![](img/606032_1_En_3_Fig53_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了集群选项。它显示了一个新创建集群的配置设置。


    图 3-53


    更新 Dataproc 集群


    1.  修改你想要更改的设置，例如节点数量、节点类型或初始化操作。

    2.  点击 `Save` 以应用你的更改。


    #### 提交 Spark 作业


    ![](img/606032_1_En_3_Fig54_HTML.jpg)


    Google Cloud 窗口的截图突出显示了 Dataproc 下拉菜单下的作业选项。


    图 3-54


    前往作业


    ![](img/606032_1_En_3_Fig55_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了作业选项。它显示了 Cloud Dataproc，并突出显示了提交作业按钮。


    图 3-55


    点击 `SUBMIT JOB`


    ![](img/606032_1_En_3_Fig56_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了作业选项。它显示了提交作业下的设置，包括作业 ID、区域、集群和作业类型。


    图 3-56


    输入作业详情


    -   **主类**：`org.apache.spark.examples.SparkPi`

    -   **Jar 文件**：`file:///usr/lib/spark/examples/jars/spark-examples.jar`

    -   **参数**：`10`


    点击 `Submit`。


    ![](img/606032_1_En_3_Fig57_HTML.jpg)


    Google Cloud 窗口的截图显示了 Dataproc 下的一个下拉菜单，其中选择了作业选项。它显示了已创建的作业，包括作业 ID、作业 UUID、类型和状态，并在监控选项卡下显示了输出。


    图 3-57


    作业详情


    在此示例中，Spark 作业使用蒙特卡洛方法来估算 Pi 的值。在此处查看详细信息：[`https://cloud.google.com/architecture/monte-carlo-methods-with-hadoop-spark`](https://cloud.google.com/architecture/monte-carlo-methods-with-hadoop-spark)。


    请注意，更新集群可能会导致一些停机或数据丢失，具体取决于你所做的更新类型。请仔细审查更改并相应地进行规划，以尽量减少对数据处理工作流的影响。


    #### 清理


    1.  在你创建的集群的集群详情页面上，点击 `Delete` 以删除该集群。

    2.  要确认删除集群，请点击 `Delete`。

