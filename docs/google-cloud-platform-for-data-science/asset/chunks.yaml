    ![](img/606032_1_En_4_Fig26_HTML.jpg)


    截图展示了网页的部分内容，右侧有图表面板，其中选中了“设置”选项卡。在“设置”选项卡下，选中了“销售额”和“利润”选项。页面左侧呈现了销售额和利润的折线图及水平双柱图。


    图 4-26


    条形图


    1.  **饼图**：点击 `Add a chart` 按钮，然后从饼图选项中选择 `Donut`。在 `Setup` 部分，更改维度以显示产品类别。请参见以下示例。


    ![](img/606032_1_En_4_Fig27_HTML.jpg)


    截图展示了网页的部分内容，页面右侧有图表面板。从图表面板中选中了“利润”选项，页面左侧呈现了利润的水平双柱图和环形图。


    图 4-27


    环形图


    1.  **表格**：从 `Add a chart` 按钮中选择 `Table` 选项。创建一个显示每个产品类别销售额和利润的表格。


    ![](img/606032_1_En_4_Fig28_HTML.jpg)


    截图展示了网页的部分内容，右侧窗格中有图表面板。从图表面板中选中了“销售额”和“利润”选项。左侧窗格中有一个水平双柱图、一个环形图和一个提供产品类别、销售额和利润详细信息的表格。


    图 4-28


    表格


    1.  **气泡图**：点击 `Add a chart` 按钮，然后从 Google 地图选项中选择 `Bubble Map`。通过拖拽将地图与折线图一起放置在页面上。调整设置：选择
    `Location` 并选择 `Region`，设置 `Tooltip` 显示 `Province`，选择 `Region` 作为 `Color dimension`，并使用
    `Sales` 或 `Profit` 作为 `Size`。


    ![](img/606032_1_En_4_Fig29_HTML.jpg)


    截图展示了网页的部分内容，右侧窗格中有字段面板。字段面板显示了位置、工具提示、颜色维度和大小等详细信息。左侧是北美地区的气泡图，显示了不同州的销售额。


    图 4-29


    气泡图


    1.  **日期范围**：点击 `Add a control` 选项，然后选择 `Date range control`。将控件拖到页面右上角。选择日期范围的开始和结束日期，这将相应地调整仪表板上所有图表的值。


    ![](img/606032_1_En_4_Fig30_HTML.jpg)


