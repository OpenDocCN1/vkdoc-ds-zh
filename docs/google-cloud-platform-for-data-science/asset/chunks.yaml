    2.  **Create the model**: The **create_model** function creates the model architecture
    using TensorFlow’s **Sequential** class. The architecture comprises five dense
    layers with ReLU activation and a softmax output layer. The first layer has 100
    neurons, the second layer has 75 neurons, the third layer has 50 neurons, the
    fourth layer has 25 neurons, and the output layer has three neurons, representing
    the number of classes. The model is compiled using the **compile** function of
    the **Sequential** class, with categorical cross-entropy loss, accuracy metric,
    and RMSprop optimizer.


    3.  **Batch the datasets**: The **dataset_train** and **dataset_validation** datasets
    are batched with a specified batch size using the **batch** function of the **tf.data.Dataset**
    class. The batch size is specified through the **args.batch_size** argument.


    4.  **Train the model**: The **fit** function of the **Sequential** class is used
    to train the model on the **dataset_train** data, using the specified number of
    epochs **args.epochs** and using **dataset_validation** as the validation data.'
