  trans: "\n### 在生产环境中部署模型\n\n如果你想部署一个 `scikit-learn` 模型，可以使用 `joblib` 库来保存模型，然后通过\
    \ REST API 来提供模型服务。以下代码安装了 `joblib` 和 `Flask` 库，使用 `joblib` 将训练好的模型保存到文件，并设置了一个\
    \ `Flask` 应用来提供模型预测服务。代码定义了 `/predict` 端点，当向该端点发送请求时，模型会被加载，进行预测，并将结果以 JSON 响应形式返回。\n\
    \n你可以使用诸如 Google Cloud Platform 或 Amazon Web Services 之类的云服务来托管 REST API，并使你的应用程序能够获取预测结果。以下是具体操作示例：\n\
    \n1.  **安装 joblib 库：**\n\n```\n!pip install joblib\n```\n\n2.  **保存模型：**\n\n```\n\
    import joblib\nmodel = clf # 你训练好的模型\n# 保存模型\njoblib.dump(model, '/content/drive/My\
    \ Drive/Colab Notebooks/model.joblib')\n```\n\n3.  **使用 Flask 提供模型服务：**\n\n```\n\
    !pip install flask\nfrom flask import Flask, request\nimport joblib\napp = Flask(__name__)\n\
    @app.route(\"/predict\", methods=[\"POST\"])\ndef predict():\n    data = request.json[X_test]\n\
    \    model = joblib.load('/content/drive/My Drive/Colab Notebooks/model.joblib')\n\
    \    predictions = model.predict(data)\n    print(predictions)\n    return {'predictions':\
    \ predictions.tolist()}\nif __name__ == \"__main__\":\n    app.run()\n```\n\n\
    此示例使用 `Flask` 库将模型作为 REST API 提供服务。你可以通过向 `/predict` 端点发送一个包含输入数据的 POST 请求来测试该\
    \ API。\n\n现在，我们逐行分析代码：\n\n1.  **`!pip install joblib`**：此行使用 `pip` 包管理器安装 `joblib`\
    \ 库。`joblib` 是一个 Python 库，用于 Python 对象（包括模型）的序列化和反序列化。\n\n2.  **`import joblib`**：此行导入\
    \ `joblib` 模块，该模块提供了保存和加载模型的函数。\n\n3.  **`model = clf`**：此行将训练好的模型 (`clf`) 赋值给\
    \ `model` 变量。它假设 `clf` 是训练好的模型对象。\n\n4.  **`joblib.dump(model, '/content/drive/My\
    \ Drive/Colab Notebooks/model.joblib')`**：此行使用 `joblib.dump()` 函数将模型保存到名为 `model.joblib`\
    \ 的文件中。该文件将保存在指定的目录路径 `/content/drive/My Drive/Colab Notebooks/` 下。\n\n5.  **`!pip\
    \ install flask`**：此行使用 `pip` 包管理器安装 `Flask` Web 框架。`Flask` 是一个流行的用于构建 Web 应用的\
    \ Python 框架。\n\n6.  **`from flask import Flask, request`**：此行从 `flask` 模块导入 `Flask`\
    \ 类。同时导入了 `request` 对象，它允许访问传入 HTTP 请求中的数据。\n\n7.  **`app = Flask(__name__)`**：此行创建了一个名为\
    \ `app` 的 `Flask` 应用实例。\n\n8.  **`@app.route(\"/predict\", methods=[\"POST\"])`**：此行装饰了接下来的函数，使其能够处理对\
    \ `/predict` 端点发起的 HTTP POST 方法请求。\n\n9.  **`def predict():`**：此行定义了一个名为 `predict`\
    \ 的函数，当向 `/predict` 端点发起请求时，该函数将被执行。\n\n10.  **`data = request.json[X_test]`**：此行从发送到\
    \ `/predict` 端点的请求中检索 JSON 数据。它假设 JSON 数据包含 `X_test` 键。\n\n11.  **`model = joblib.load('/content/drive/My\
    \ Drive/Colab Notebooks/model.joblib')`**：此行使用 `joblib.load()` 函数从文件 `model.joblib`\
    \ 中加载模型。\n\n12.  **`predictions = model.predict(data)`**：此行使用加载的模型对从请求中获取的数据进行预测。\n\
    \n13.  **`print(predictions)`**：此行将预测结果打印到控制台。\n\n14.  **`return {'predictions':\
    \ predictions.tolist()}`**：此行返回一个包含预测结果列表的 JSON 响应。\n\n15.  **`if __name__ ==\
    \ \"__main__\":`**：此行检查脚本是否作为主模块直接运行。\n\n16.  **`app.run()`**：此行启动 `Flask` 开发服务器来运行应用程序。\n\
    \n### 从 Colaboratory 访问 GCP 服务和数据\n\n**连接到 GCP**：Colaboratory 是 Google Cloud Platform\
    \ (GCP) 的一部分，因此你可以轻松地从 Colaboratory 访问其他 GCP 服务和数据。要连接到 GCP，你需要设置一个 Google Cloud\
    \ 项目，并授予 Colaboratory 访问你 Google Cloud 资源的权限。\n\n**使用 Google Cloud 进行身份验证：** 要使用\
    \ Google Cloud 进行身份验证，你需要在 Colaboratory 单元格中运行以下命令：\n\n```\n!gcloud auth login\n\
    ```\n\n执行此命令后，将启动一个 Web 浏览器窗口，使你能够登录到你的 Google 帐户并授权 Colaboratory 访问你的 Google\
    \ Cloud 资源。\n\n**访问 GCP 服务：** 你可以使用 Colaboratory 访问和使用其他 GCP 服务，例如 Google Cloud\
    \ Storage、Google BigQuery 和 Google Cloud AI Platform。\n\n**访问 GCP 数据：** 你还可以使用\
    \ Colaboratory 访问和处理存储在 GCP 中的数据，例如存储在 Google Cloud Storage 或 Google BigQuery\
    \ 中的数据。你需要使用诸如 `Pandas` 和 Google Cloud API 之类的 Python 库来访问这些数据。\n\n**从 GCP 导入数据：**\
    \ 你可以使用 Colaboratory 从其他 GCP 服务导入数据，并将其存储在 `Pandas` DataFrame 中。例如，你可以选择从 Google\
    \ BigQuery 导入数据，并利用 BigQuery API 的功能将其存储在 DataFrame 中。\n\n**将数据导出到 GCP：** 你还可以使用\
    \ Colaboratory 将数据导出到其他 GCP 服务。例如，你可以将 `Pandas` DataFrame 导出到 Google Cloud Storage\
    \ 或 Google BigQuery。\n\nColab 与其他 Google Cloud 服务的集成将在后续章节中详细讨论。\n\n### 总结\n\n\
    在本章中，我们了解了 Google Colaboratory，这是 Google 提供的一个免费的基于云的 Jupyter Notebook 环境。我们发现了它的主要特性，包括其基于云的特性、用户友好的界面、与\
    \ Google Cloud Platform (GCP) 服务的集成、共享和协作能力，以及对 GPU 和 TPU 计算的支持。这些特性使 Colaboratory\
    \ 成为数据科学家、软件工程师和学生都能使用的强大工具。\n\n我们探讨了在 Google Colaboratory 上创建和运行 Jupyter notebook\
    \ 的过程。我们学习了如何访问该平台、注册 Google 帐户以及浏览 Colab 界面。我们还学习了如何创建新的 Colaboratory notebook、选择运行时类型以及开始使用\
    \ Python 编写代码。通过动手实践示例，我们练习了插入文本、执行算术运算、生成随机数以及使用 `Matplotlib` 和 `Seaborn` 等库进行数据可视化。\n\
    \n此外，我们深入研究了如何将库导入 Colab notebook，以及如何使用 `google.colab` 库处理存储在 Google Drive 中的数据。我们学习了如何从\
    \ Google Drive 导入数据以及将数据写入 Google Drive，以及如何通过 Colaboratory 访问 Google Drive 中的数据。此外，我们还简要介绍了在\
    \ Google Colaboratory 上运行机器学习模型，并提到了强大的机器学习工具和库（如 `TensorFlow` 和 `Keras`）的可用性。我们甚至探索了一个使用\
    \ `scikit-learn` 库构建机器学习模型的示例。\n\n总而言之，本章概述了 Google Colaboratory 及其特性，指导我们完成了访问和使用\
    \ Colab 的过程，并教我们在 Colaboratory 环境中进行各种编码、数据处理和可视化技术。\n"
- fmt: '# 3. Big Data and Machine Learning


    Google Cloud Platform offers multiple services for the management of big data
    and the execution of Extract, Transform, Load (ETL) operations. Additionally,
    it provides tools for the training and deployment of machine learning models.
    Within this chapter, we will delve into `BigQuery` and its query execution. Moreover,
    we will gain insights into employing `BigQuery ML` for the development of machine
    learning models. The exploration extends to Google Cloud AI Platform, where we
    will gain practical experience with `Vertex AI` for training and deploying machine
    learning models.


    As we progress, an introduction to `Dataproc` and its applications in data processing
    awaits us. The chapter culminates with an introduction to `TensorFlow`.


    ## BigQuery


    `BigQuery` is a serverless, highly scalable, cost-effective cloud data warehouse
    provided by Google Cloud Platform (GCP). It allows you to store and analyze large
    amounts of structured and semi-structured data using SQL-like queries. With `BigQuery`,
    you can run ad hoc queries on terabytes of data in seconds without the need for
    any setup or maintenance.


    `BigQuery` is suitable for various use cases, including:


    * **Data warehousing:** `BigQuery` is often used as a data warehouse for storing
    and analyzing large amounts of data. To create a complete data analysis pipeline,
    you can integrate `BigQuery` with other GCP tools, such as `Google Cloud Storage`
    and `Google Looker Studio`.


    * **Analytics:** `BigQuery` is suitable for running large-scale analytics projects,
    such as business intelligence, predictive modeling, and data mining.


    * **Machine learning:** `BigQuery` offers the capability to train machine learning
    models and perform scalable predictions. It provides comprehensive support for
    `TensorFlow` and other popular machine learning frameworks.


    * **Streaming data:** `BigQuery` supports real-time data streaming, allowing you
    to process and analyze data in near real time.


    * **Geospatial data analysis:** `BigQuery` supports geospatial data analysis,
    allowing you to perform complex geographic calculations and visualization.


    `BigQuery`’s serverless architecture, scalability, and cost-effectiveness make
    it an attractive solution for organizations of all sizes, from small startups
    to large enterprises.


    ## Running SQL Queries on BigQuery Data


    Starting with `BigQuery` is straightforward and involves the following steps:


    **Set up a Google Cloud account:** To use `BigQuery`, you must sign up for a Google
    Cloud account. You can start with a free trial and then choose a paid plan that
    meets your needs.


    **Create a project:** Once you have a Google Cloud account, create a new project
    in the Google Cloud Console. This will be the home for your `BigQuery` data.


    **Load your data:** You can load your data into `BigQuery` in several ways, including
    uploading CSV or JSON files, using a cloud-based data source such as `Google Cloud
    Storage`, or streaming data in real time.


    **Run a query:** Once your data is loaded, you can start querying it using `BigQuery`’s
    web UI or the command-line interface. `BigQuery` uses a SQL-like syntax, so if
    you’re familiar with SQL, you’ll find it easy to use.


    **Analyze your results:** After running a query, you can view the results in the
    web UI or export them to a file for further analysis.


    **Visualize your data:** You can also use tools like `Google Looker Studio` to
    create visualizations and reports based on your `BigQuery` data.


    `BigQuery` provides detailed documentation and tutorials to help you get started.
    Additionally, GCP provides a free community support forum, and if you have a paid
    plan, you can also access technical support.


    Before jumping to the production environment and using a credit card, you can
    try `BigQuery Sandbox`.


    **BigQuery Sandbox** is a free, interactive learning environment provided by Google
    Cloud Platform (GCP) to help users explore and learn about `BigQuery`. With `BigQuery
    Sandbox`, you can run queries on public datasets and test out the functionality
    of `BigQuery` without incurring any charges.


    `BigQuery Sandbox` presents a user-friendly, web-based interface that facilitates
    SQL-like queries on `BigQuery` data. It offers a hassle-free experience, eliminating
    the need for any setup or installation. This makes it an invaluable resource for
    individuals such as data analysts, data scientists, and developers who are new
    to `BigQuery` and seek a hands-on learning experience with the tool while exploring
    its capabilities.


    `BigQuery Sandbox` is not meant for production use and has limitations, such as
    a smaller data size limit and slower performance than a fully configured `BigQuery`
    instance. However, it’s a great way to get started with `BigQuery` and gain familiarity
    with its functionality before using it in a production environment.


    Here’s a step-by-step tutorial for using `BigQuery Sandbox`:


    **Open the BigQuery Sandbox website:** Go to the `BigQuery Sandbox` website at
    `https://console.cloud.google.com/bigquery`.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig1_HTML.jpg)


    A screenshot of the Big Query Sandbox window displays a dropdown under analysis
    where the S Q L workspace menu is selected. It displays the S Q L workspace.


    Figure 3-1


    The console of Google Cloud for BigQuery


    **Log into your Google account:** If you do not currently possess a Google account,
    it will be necessary to create one. Subsequently, you can log into your account
    in order to gain access to the `BigQuery Sandbox` environment. Follow the prompts
    to create a Google Cloud project. To use `BigQuery Sandbox`, you must create a
    Google Cloud project. It can be seen in the following image.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig2_HTML.jpg)


    A screenshot of the new project page. It displays the fields for the project name
    and location with a create button.


    Figure 3-2


    Create a new project


    After creating the project, you can find the following screen.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig3_HTML.png)


    A screenshot of the sandbox interface. It displays the created project under the
    S Q L workspace.


    Figure 3-3


    Screen after creating a new project'
