  trans: '

    # Colab 上的数据可视化


    `PyGWalker` 是一个 Python 库，它简化了 Jupyter Notebook 中的数据分析与数据可视化工作流程。它提供了一个类似 Tableau
    的用户界面，用于对 Pandas 数据框进行可视化探索。借助 `PyGWalker`，数据科学家可以通过简单的拖放操作，快速轻松地分析数据并可视化数据模式。


    `PyGWalker` 构建于开源软件 Graphic Walker 之上，后者是 Tableau 的一个替代方案。Graphic Walker 提供了一个可视化界面，允许用户探索实时数据。它还支持多种图表类型和数据操作功能。


    要开始使用 `PyGWalker`，你需要使用 `pip` 进行安装。打开一个 Jupyter Notebook，并按如下方式安装该库：


    ```

    !pip install pygwalker

    ```


    接下来，我们可以导入 `PyGWalker` 以及其他所需的库：


    ```

    import pandas as pd

    import numpy as np

    import pygwalker as pyg

    ```


    在本教程中，我们将创建一个包含一些随机数据的示例数据集：


    ```

    data = {

    ''age'': np.random.randint(18, 65, 100),

    ''gender'': np.random.choice([''Male'', ''Female''], 100),

    ''income'': np.random.normal(50000, 10000, 100),

    ''state'': np.random.choice([''CA'', ''NY'', ''TX''], 100)

    }

    df = pd.DataFrame(data)

    ```


    现在，让我们使用 `PyGWalker` 来可视化这个数据集：


    ```

    pyg.walk(df)

    ```


    你将看到以下输出。


    ![](img/606032_1_En_4_Fig32_HTML.png)


    PyGWalker 页面截图，选中了数据选项卡。数据页面列出了索引、年龄、性别、收入、州和行数等详细信息。


    **图 4-32** PyGWalker 数据选项卡


    `PyGWalker` 会自动检测数据类型并创建一个类似 Tableau 的界面。


    ![](img/606032_1_En_4_Fig33_HTML.png)


    PyGWalker 页面截图，选中了可视化选项卡。可视化选项卡展示了字段列表、索引、年龄、性别、收入、州、行数、筛选器、颜色、不透明度、大小和形状等详细信息。


    **图 4-33** PyGWalker 可视化选项卡


    我们可以使用拖放操作来探索和可视化数据。例如，我们可以将 `age` 列拖到 x 轴，将 `income` 列拖到 y 轴来创建一个散点图。在此之前，首先点击
    `age`，会出现分箱建议，点击它。对 `income` 也执行相同操作。现在将 `bin(age)` 和 `bin(income)` 分别拖放到 x 轴和
    y 轴上。你将看到以下输出。


    ![](img/606032_1_En_4_Fig34_HTML.jpg)


    可视化页面截图，展示了字段列表、索引、年龄、性别、收入、州、行数、筛选器、颜色、不透明度、大小和形状等详细信息。在页面右侧，一个散点图展示了收入与年龄之间的关系。


    **图 4-34** 散点图


    我们还可以通过将其他列拖到颜色或大小区域来为可视化添加更多维度。例如，我们可以将 `gender` 列拖到颜色区域，创建一个按性别显示不同颜色的散点图。


    ![](img/606032_1_En_4_Fig35_HTML.jpg)


    可视化页面局部截图，展示了字段列表、筛选器、颜色、不透明度、大小和形状等详细信息。在页面右侧，一个散点图展示了收入与年龄之间的关系，其中包含男性和女性的数据点。


    **图 4-35** 为散点图添加另一个维度


    你也可以点击 `聚合` 将其关闭，从而创建无需分箱的图表，如下所示。


    ![](img/606032_1_En_4_Fig36_HTML.png)


    可视化页面局部截图，展示了字段列表、索引、年龄、性别、收入、州、行数、筛选器、颜色、不透明度、大小和形状等详细信息。在页面右侧，一个散点图展示了收入与年龄之间的关系。


    **图 4-36** 无聚合


    你也可以像下面这样更改图表类型。


    ![](img/606032_1_En_4_Fig37_HTML.png)


    可视化页面局部截图，展示了一个下拉菜单，其中选中了箱形图选项。在页面右侧，一个箱形图展示了收入与年龄的关系。趋势呈现波动模式。


    **图 4-37** 更改图表类型


    ## 总结


    在本章中，我们探索了数据可视化和商业智能的世界，重点介绍了如何使用 Looker Studio 和 Colab 创建引人注目的可视化效果和报告。


    我们首先介绍了 Looker Studio，这是一个强大的数据探索和可视化工具。我们了解了它用于将原始数据转化为有意义见解的特性和能力。


    接着，我们深入探讨了使用 Looker Studio 创建和共享数据可视化及报告的过程。我们学习了如何连接到各种数据源、设计可视化效果以及生成可轻松与利益相关者共享的交互式报告。


    然后，我们探索了 BigQuery 与 Looker 之间的集成，理解了如何将这两个工具结合使用来分析和可视化大型数据集。我们了解了利用 BigQuery
    强大的查询能力和 Looker 直观的界面进行数据探索的好处。


    接下来，我们重点介绍了使用 Looker Studio 构建仪表板。我们学习了如何创建自定义仪表板，以整合多个可视化效果，并提供关键指标和绩效指标的全面视图。


    最后，我们探索了使用 Colab（一个协作式笔记本环境）进行数据可视化。我们学习了如何利用像 `pygwalker`、`pandas` 和 `numpy`
    这样的 Python 库，在 Colab 笔记本中创建视觉上吸引人的图表和图形。


    在本章中，我们深入了解了数据可视化的重要性及其在推动商业智能中的作用。我们学习了如何有效地使用 Looker Studio 和其他工具，将复杂数据转化为可操作的见解，并以引人注目且易于理解的方式传达给利益相关者。这些知识使我们掌握了通过数据可视化和商业智能做出明智决策并推动业务成功的技能。

    '
- fmt: '# 5. Data Processing and Transformation


    In this chapter, we will explore the domain of data manipulation and alteration,
    centering our attention on Google Cloud Dataflow and Google Cloud Dataprep.


    Our journey begins with an initiation into Google Cloud Dataflow, an influential
    service dedicated to both batch and stream data handling. We will delve into the
    diverse scenarios where Dataflow stands out, encompassing real-time analytics,
    ETL (Extract, Transform, Load) pipelines, and event-triggered processing. This
    will foster an understanding of Dataflow’s role in facilitating scalable and efficient
    data manipulation.


    Progressing onward, we will immerse ourselves in the execution of data manipulation
    pipelines within Cloud Dataflow. This phase involves comprehending the concept
    of pipelines, a framework that enables the definition of a sequence of steps required
    to process and reshape data. We will investigate how Dataflow proficiently accommodates
    batch and stream data manipulation and delve into its seamless integration with
    other Google Cloud services, notably BigQuery and Cloud Pub/Sub.


    Steering ahead, our exploration takes us to Google Cloud Dataprep, a service tailored
    for data refinement and metamorphosis. We will explore a spectrum of contexts
    where Dataprep proves its utility, including data scrubbing, normalization, and
    data refinement. The user-friendly visual interface of Dataprep will be unveiled,
    showcasing its ability to facilitate effortless data exploration and manipulation,
    bypassing the need for intricate coding.


    The entirety of this chapter will grant us insights into the pivotal role that
    data manipulation and alteration assume in the data lifecycle. Through the lens
    of Google Cloud Dataflow and Google Cloud Dataprep, we will grasp the potent tools
    at our disposal for processing and refining data on a substantial scale. This
    proficiency will enable us to unearth valuable insights and steer well-informed
    decision-making.


    By harnessing the capabilities of Dataflow and Dataprep, we will cultivate expertise
    and adeptness in devising and executing streamlined data manipulation pipelines.
    This adeptness ensures the conversion of raw data into a usable format, ensuring
    the integrity and uniformity of data. This empowerment enables the full exploration
    of our data’s potential, extracting invaluable insights that catalyze business
    expansion and triumph.


    ## Introduction to Google Cloud Dataflow and Its Use Cases for Batch and Stream
    Data Processing


    Google Cloud Dataflow is a comprehensive managed cloud service that facilitates
    the development and execution of diverse data processing patterns, encompassing
    both batch and stream processing. It streamlines the process by offering a unified
    programming model, enabling users to concentrate on crafting business logic rather
    than dealing with the intricacies of infrastructure management.


    Some common use cases for batch processing with Google Cloud Dataflow include
    data warehousing, ETL (Extract, Transform, Load) processing, and analytics. For
    example, you can use Dataflow to extract data from multiple sources, clean and
    transform the data, and load it into a data warehousing solution like BigQuery
    for analysis.


    For stream processing, Dataflow is used for real-time analytics, fraud detection,
    IoT data processing, and clickstream analysis. For example, you can use Dataflow
    to process real-time data from IoT devices and analyze the data to gain insights
    and make decisions in real time.


    Overall, Google Cloud Dataflow is a highly scalable and flexible data processing
    solution that can handle both batch and stream processing workloads, making it
    a valuable tool for data engineers and data scientists.


    ### Running Data Processing Pipelines on Cloud Dataflow


    There are several ways to utilize Dataflow for your data processing needs. You
    can create Dataflow jobs using either the cloud console UI, the `gcloud` CLI,
    or the API, all of which offer various options for job creation. Additionally,
    Dataflow templates provide a selection of pre-built templates for easy use, and
    you can also create custom templates and share them with colleagues.


    With Dataflow SQL, you can leverage your SQL skills to develop streaming pipelines
    directly from the BigQuery web UI, enabling you to join data from various sources,
    write results into BigQuery, and visualize them in real-time dashboards. Moreover,
    the Dataflow interface provides access to Vertex AI Notebooks, which allow you
    to build and deploy data pipelines using the latest data science and machine learning
    frameworks (Vergadia, 2021). Finally, Dataflow inline monitoring allows you to
    access job metrics directly, providing helpful insights for troubleshooting pipelines
    at both the step and worker levels.'
