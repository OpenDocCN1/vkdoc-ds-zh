    ### 构建仪表板


    本节将指导您使用 Looker Studio 开发一个自定义仪表板。首先，使用您的 Gmail 账户登录 Looker Studio。如前一节所述，您已经上传了一个
    Excel 表格并将其连接到 Looker Studio。现在，我们就从这个报告开始。


    ![](img/606032_1_En_4_Fig20_HTML.jpg)


    截图展示了 Looker Studio 欢迎页面的部分内容，左侧面板选中了“最近”选项卡，右侧显示了相应页面。右侧选中了“报告”选项卡，其中包含标记为“空白报告”和“教程报告”的模板。已选中“超级商店销售报告
    1”文件。


    图 4-20


    选择报告


    返回您之前的报告，点击标题中的 `Page` 选项。然后，选择 `New page` 来创建一个供您操作的空白报告。


    ![](img/606032_1_En_4_Fig21_HTML.jpg)


    截图展示了“超级商店销售报告 1”页面的部分内容，其中选中了“页面”选项卡，该选项卡列出了下拉菜单。下拉菜单中选中了“新建页面”选项。


    图 4-21


    插入新页面


    根据您的喜好更改主题和布局。


    ![](img/606032_1_En_4_Fig22_HTML.jpg)


    截图展示了“超级商店销售报告 1”页面的部分内容，页面右侧包含主题和布局面板，其中选中了“主题”选项卡。页面右上角的“查看”按钮已被选中。


    图 4-22


    选择主题和布局


    现在，我们可以开始添加不同的图表来构建仪表板：


    1.  **评分卡**：点击 `Add a chart` 按钮，然后点击评分卡 `Total`。通过添加更多评分卡或复制粘贴现有评分卡来创建多个评分卡。按照页面右侧的
    `Setup` 部分所示，更改每个评分卡的指标。


    ![](img/606032_1_En_4_Fig23_HTML.jpg)


    截图展示了“超级商店销售报告 1”页面的部分内容，右侧窗格中有图表面板，其中选中了“设置”选项卡。在“设置”选项卡下，“销售额”选项被框选，其值显示在左侧窗格中。右上角的“查看”按钮已被选中。


    图 4-23


    创建评分卡


    ![](img/606032_1_En_4_Fig24_HTML.jpg)


    截图展示了“超级商店销售报告 1”页面的部分内容，提供了销售额、利润、订单数量和运费的值。


    图 4-24


    用于构建仪表板的评分卡


