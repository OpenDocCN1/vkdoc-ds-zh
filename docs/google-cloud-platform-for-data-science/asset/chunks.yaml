  trans: "\n# 使用 Vertex AI 训练和部署机器学习模型\n\n`Vertex AI` 由 OpenAI 开发，是一个用于构建和启动机器学习模型的综合性平台。它通过抽象底层技术的复杂性，为数据科学家、工程师和开发者简化了流程。`Vertex\
    \ AI` 提供了一个用户友好的界面，简化了机器学习模型的使用，并集成了预构建模型和工具，用于数据准备、模型选择、训练和部署等关键任务。利用 `PyTorch`\
    \ 和 `TensorFlow` 等流行的机器学习框架，`Vertex AI` 促进了跨多种应用的模型开发，包括图像分类、自然语言处理和推荐系统。\n\n\
    它取代了多项旧版服务，包括：\n\n- **Cloud AutoML**：如前所述，`Cloud AutoML` 正被 `Vertex AutoML` 取代。`Vertex\
    \ AutoML` 为构建和部署机器学习模型提供了更精简、更集成的体验。\n- **Cloud ML Engine**：`Vertex AI` 平台正在取代\
    \ `Cloud ML Engine`。`Vertex AI` 平台提供与 `Cloud ML Engine` 类似的功能，但拥有更友好的用户界面和高级特性。\n\
    - **Cloud AI Platform Notebooks**：`Cloud AI Platform Notebooks` 正被 `Vertex AI\
    \ Notebooks` 取代。`Vertex AI Notebooks` 提供与 `Cloud AI Platform Notebooks` 相同的功能，但拥有更强大的硬件选项以及与其它\
    \ `Vertex AI` 服务的改进集成。\n\nGoogle Cloud 此前提供了 `AutoML Tables`，这是一项机器学习服务，使用户无需丰富的编程或数据科学专业知识即可生成自定义模型。然而，旧版\
    \ `AutoML Tables` 已被淘汰，自 2024 年 1 月 23 日起将无法在 Google Cloud 上访问。\n\n好消息是，旧版 `AutoML\
    \ Tables` 中所有可用的特性和功能，以及新增内容，现在都可以在 `Vertex AI` 平台上访问。\n\n`Vertex AI` 平台通过以下几种关键方式与机器学习工作流集成：\n\
    \n- **数据准备**：`Vertex AI` 提供了准备和清理数据以用于机器学习模型的工具。这包括数据加载、拆分和预处理。\n  - 利用 `Vertex\
    \ AI Workbench` 笔记本的功能，有效地探索和可视化数据。`Vertex AI Workbench` 与 `Cloud Storage` 和 `BigQuery`\
    \ 无缝集成，提供对数据的快速访问和处理。\n- 对于大型数据集，从 `Vertex AI Workbench` 笔记本中使用 `Dataproc Serverless\
    \ Spark` 来运行 Spark 工作负载，而无需管理您的 `Dataproc` 集群（Google Cloud，2023）。\n- **模型选择**：在\
    \ `Vertex AI` 中，您会找到一系列预构建模型，用于处理常见的机器学习任务，如图像分类、自然语言处理和推荐系统。此外，还可以使用 `AutoML`\
    \ 来训练模型，而无需手动编写代码（Blog, Neos Vietnam, n.d.）。这些模型可以直接使用，也可以根据需要进行定制。此外，`Vertex\
    \ AI` 还提供了从头开始创建自定义模型的能力。\n- **训练**：`Vertex AI` 提供了在您的数据上训练机器学习模型的工具。训练过程在平台内进行管理，并且\
    \ `Vertex AI` 提供了监控和早停功能，以确保模型高效且有效地进行训练。\n- **模型评估**：`Vertex AI` 提供了评估已训练模型性能的工具。这包括性能指标，如准确率、精确率和召回率，以及可视化工具，帮助您了解模型的运行情况。\n\
    - **部署**：`Vertex AI` 提供了将训练好的模型部署到生产环境的工具，使您能够使用模型对新数据进行预测。`Vertex AI` 提供了多种部署选项，包括将模型作为\
    \ REST API 提供服务、将其作为函数部署在云平台上，或将其集成到现有应用程序中。\n\n通过以这些关键方式与机器学习工作流集成，`Vertex AI`\
    \ 使数据科学家、工程师和开发者能够更轻松、更高效地构建、训练和部署机器学习模型。\n\n## MLOps，即机器学习运维\n\n`MLOps`，即机器学习运维，指的是在生产环境中管理和扩展机器学习模型的过程。`Vertex\
    \ AI` 通过提供多种工具和功能来帮助管理机器学习模型的部署和操作，从而为 `MLOps` 提供支持。`Vertex AI` 上用于 `MLOps` 的一些关键功能包括：\n\
    \n1. **部署**：`Vertex AI` 提供了将机器学习模型部署到生产环境的工具，使您能够使用模型对新数据进行预测。`Vertex AI` 提供了多种部署选项，包括将模型作为\
    \ REST API 提供服务、将其作为函数部署在云平台上，或将其集成到现有应用程序中。\n2. **监控**：`Vertex AI` 提供了监控已部署模型性能的工具。这包括性能指标，如准确率、精确率和召回率，以及可视化工具，帮助您了解模型在实际使用中的表现。\n\
    3. **版本控制**：`Vertex AI` 提供了版本控制功能，允许您管理模型的多个版本并随时间跟踪更改。这使得在需要时可以回滚到以前的版本，并有助于确保您在模型演变过程中保持对其的控制。\n\
    4. **扩展**：`Vertex AI` 提供了扩展机器学习模型的工具，使其能够处理不断增加的数据量和流量。这包括跨多个 GPU 或云实例部署模型，以及根据需要调整分配给模型的资源的能力。\n\
    \n通过提供这些以及其它用于 `MLOps` 的功能，`Vertex AI` 有助于简化在生产环境中部署和管理机器学习模型的过程。这使得数据科学家、工程师和开发者能够更轻松地专注于开发和改进模型的重要工作，同时仍能保持对模型在实际使用中的控制和可见性。\n\
    \n要使用 `Vertex AI`，您必须选择免费套餐或全服务账户。完成后，您可以点击链接 `https://console.cloud.google.com/`\
    \ 访问控制台。\n\n![Google Cloud 页面截图，显示 Cloud Overview 下的下拉菜单。其中列出了仪表板、活动和推荐。](img/606032_1_En_3_Fig16_HTML.png)\n\
    \n**图 3-16** 控制台\n\n现在您可以访问 Google Cloud 服务了。转到搜索框并输入 `Vertex AI`，您将看到以下屏幕。\n\n\
    ![页面截图，显示 Vertex AI 下的下拉菜单，其中选择了仪表板。它显示了 Vertex AI 的欢迎页面。](img/606032_1_En_3_Fig17_HTML.png)\n\
    \n**图 3-17** Vertex AI 仪表板\n\n## Vertex AI 中的用户管理型笔记本实例\n\n`Vertex AI` 中的用户管理型笔记本实例提供了一个专用且可定制的环境，用于运行数据科学和机器学习任务。此类实例的主要用途是为数据科学家和机器学习工程师提供一个独立且可扩展的环境，用于开发和试验他们的模型。\n\
    \n在 `Vertex AI` 中使用用户管理型笔记本实例的一些好处包括：\n\n1. **可定制性**：用户对实例拥有完全控制权，可以安装和配置其工作所需的工具和软件包。\n"
