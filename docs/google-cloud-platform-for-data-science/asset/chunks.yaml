    \ 7-16** Asset status\n\n1. For not getting any cost, if you don’t need the resources\
    \ created, they should be deleted. First, delete the assets. Then you can delete\
    \ the zones and then the lake.\n\n## Cloud Data Fusion\n\nCloud Data Fusion is\
    \ a fully managed data integration service that allows users to efficiently build\
    \ and manage ETL/ELT (Extract, Transform, Load/Extract, Load, Transform) pipelines\
    \ on Google Cloud Platform. The service is designed to make it easy for data analysts\
    \ and data engineers to create, deploy, and manage data pipelines at scale without\
    \ requiring deep technical expertise.\n\nCloud Data Fusion comes with a web-based\
    \ UI that provides a graphical interface for building and managing data pipelines.\
    \ The UI includes a drag-and-drop interface for connecting sources and destinations\
    \ and a large library of pre-built connectors to common data sources and sinks.\
    \ Cloud Data Fusion also supports complex data transformations, such as join,\
    \ merge, and filter operations.\n\nUnder the hood, Cloud Data Fusion uses Apache\
    \ Spark and Apache Beam, two open source data processing frameworks, to execute\
    \ data transformations and move data between systems. This allows Cloud Data Fusion\
    \ to support a wide range of data sources, including relational databases, NoSQL\
    \ databases, and file systems, and to scale to handle large data volumes.\n\n\
    With Cloud Data Fusion, users can easily create data pipelines to move data between\
    \ various systems, such as from on-premises data centers to Google Cloud or between\
    \ different services on Google Cloud. Cloud Data Fusion integrates with other\
    \ Google Cloud services such as BigQuery, Cloud Storage, and Cloud Pub/Sub, making\
    \ moving data between these services easy.\n\nOverall, Cloud Data Fusion can simplify\
    \ the process of building and managing data pipelines, allowing users to focus\
    \ on extracting value from their data instead of managing the underlying infrastructure.\n\
    \n### Enable or Disable Cloud Data Fusion\n\nCloud Data Fusion can be used with\
    \ an existing project, or a new one can be created. In the case of an existing\
    \ project, the Cloud Data Fusion API needs to be enabled.\n\nTo enable the Cloud\
    \ Data Fusion API and create a new project, follow these steps:\n\n1. Select or\
    \ create a project in the Google Cloud Console.\n\n2. Ensure that billing is enabled\
    \ for your project.\n\n3. Navigate to the API Overview page for Cloud Data Fusion.\n\
    \n   ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig17_HTML.jpg)\n\n   A screenshot\
    \ displays an extract of the Google Cloud website page, which presents Cloud Data\
    \ Fusion API under the head product details. The enable button below is selected.\n\
    \n**Figure 7-17** Cloud Data Fusion\n\n1. Click the `ENABLE` button to activate\
    \ the Cloud Data Fusion API.\n\n   ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig18_HTML.jpg)\n\
    \n   A screenshot depicts an extract of the APIs and services page with the enabled\
    \ APIs and services tab selected from the left side panel, which presents the\
    \ cloud data fusion API on the right side of the page. Below, details such as\
    \ the service name, type, and status are displayed.\n\n**Figure 7-18** API enabled\n\
    \nYou can start using Cloud Data Fusion with your project by completing the following\
    \ steps."
