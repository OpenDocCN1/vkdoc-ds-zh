    \n   *A screenshot of the cloud storage interface displays the selection of the\
    \ buckets option. It lists the bucket details with objects, configurations, permission,\
    \ protection, and lifecycle.*\n\n   **Figure 6-4** Bucket details\n\n   After\
    \ the successful creation of the bucket, you can commence the process of uploading\
    \ and accessing data within it.\n\n2. **Choose a storage class**: Choose the storage\
    \ class that best fits your data lake needs. For example, you may want to use\
    \ the Standard storage class for frequently accessed data or Nearline and Coldline\
    \ storage classes for infrequently accessed data.\n3. **Configure access control**:\
    \ Use IAM (Identity and Access Management) to set access control policies and\
    \ manage permissions for your data lake.\n4. **Ingest data into the data lake**:\
    \ You can upload data to your bucket using the GCP Console, the `gsutil` command-line\
    \ tool, or other supported data ingestion tools.\n5. **Organize data in the data\
    \ lake**: Use a directory structure or object naming conventions to organize data\
    \ within your bucket. This will make it easier to search and access data when\
    \ performing analytics.\n6. **Use GCP analytics and AI tools**: Use GCP’s suite\
    \ of analytics and AI tools, such as `BigQuery`, `Cloud Dataflow`, and `AI Platform`,\
    \ to ingest and process data from your data lake. These tools can help you analyze\
    \ and gain insights from large volumes of data stored in your data lake.\n7. **Ensure\
    \ security and compliance**: Use GCP’s security and compliance tools, such as\
    \ `Cloud Audit Logs` and `Security Command Center`, to ensure that your data lake\
    \ is secure and compliant with industry regulations.\n\nCreating a data lake for\
    \ analytics with Google Cloud Storage involves setting up a bucket, configuring\
    \ access control, ingesting and organizing data, and using GCP’s analytics and\
    \ AI tools to gain insights from the data. By adhering to these instructions,\
    \ you can establish a robust data lake that empowers you to make informed decisions\
    \ based on data and gain a competitive edge within your industry.\n\n## Introduction\
    \ to Google Cloud SQL and Its Use Cases for Relational Databases\n\nGoogle Cloud\
    \ SQL is a fully managed relational database service provided by Google Cloud\
    \ Platform (GCP) that enables users to create, configure, and use databases in\
    \ the cloud. With Google Cloud SQL, users can leverage the power and flexibility\
    \ of popular relational database management systems, such as MySQL, PostgreSQL,\
    \ and SQL Server, without the need to manage the underlying infrastructure, patching,\
    \ or backups.\n\nGoogle Cloud SQL provides several features that make it a powerful\
    \ and flexible database solution, including the following:\n\n**Automatic backups\
    \ and point-in-time recovery**: Google Cloud SQL automatically backs up databases\
    \ and enables point-in-time recovery, allowing users to easily restore databases\
    \ to a specific point in time.\n\n**High availability and durability**: Google\
    \ Cloud SQL provides a highly available and durable database solution with automated\
    \ failover and built-in replication across multiple zones and regions.\n\n**Scalability**:\
    \ Google Cloud SQL allows users to scale their database resources up or down as\
    \ needed, providing flexibility and cost-effectiveness.\n\n**Compatibility**:\
    \ Google Cloud SQL is compatible with popular open source and commercial relational\
    \ database management systems, making migrating existing databases to the cloud\
    \ easy.\n\n**Security**: Google Cloud SQL provides multiple layers of security,\
    \ including encryption at rest and in transit, IAM-based access control, and network\
    \ security (Secureicon, 2022).\n\n**Integration with other GCP services**: Google\
    \ Cloud SQL integrates seamlessly with other GCP services, such as `Compute Engine`,\
    \ `App Engine`, and `Kubernetes Engine`, enabling users to build and deploy powerful\
    \ applications in the cloud.\n\nOverall, Google Cloud SQL provides a fully managed,\
    \ highly available, and scalable database solution that enables users to easily\
    \ deploy, manage, and use popular relational database management systems in the\
    \ cloud."
  raw: '### Storage Locations


    In addition to the preceding storage classes, Google Cloud Storage also provides
    two types of storage locations:


    1.  **Regional storage**: This option stores data in a specific region, allowing
    for lower-latency access to data within the region. Regional storage is recommended
    for applications with high-performance requirements.


    2.  **Multi-Regional storage**: This option stores data in multiple geographic
    locations, providing high availability and global access to data. Multi-Regional
    storage is recommended for applications that require global access to data.


    The multiple storage options provided by Google Cloud Storage allow users to choose
    the right storage class and location that meet their data storage and access needs
    and optimize their storage costs.


    ### Creating a Data Lake for Analytics with Google Cloud Storage


    It is a straightforward process that involves the following steps:


    1.  **Create a Google Cloud Storage bucket**: A bucket is a container for storing
    objects, such as files or data. You can create a bucket in the GCP Console or
    use the gsutil command-line tool. Open the Cloud Console navigation menu and then
    select Cloud Storage.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig1_HTML.jpg)


    A screenshot of an interface highlights the cloud storage option on the left panel.


    Figure 6-1


    Cloud Storage


    You will be able to see the following screen.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig2_HTML.jpg)


    A screenshot of an interface displays the selection of the buckets option under
    the cloud storage. It lists the cloud storage preview and security recommendations
    under the buckets.


    Figure 6-2


    Bucket


    Next, click CREATE.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig3_HTML.jpg)


    A screenshot of the cloud storage interface displays 3 options. It lists the menus
    for creating a bucket. It reads the name, storage location, and storage class.


    Figure 6-3


    New bucket creation


    Provide a distinct name for the bucket, select the preferred region, and opt for
    the desired storage class, such as standard or infrequent access. Adjust any additional
    configurations, such as versioning and lifecycle rules. Finally, initiate the
    creation of the bucket by clicking the Create button.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig4_HTML.jpg)


    A screenshot of the cloud storage interface displays the selection of the buckets
    option. It lists the bucket details with objects, configurations, permission,
    protection, and lifecycle.


    Figure 6-4


    Bucket details


    After the successful creation of the bucket, you can commence the process of uploading
    and accessing data within it.


    1.  **Choose a storage class**: Choose the storage class that best fits your data
    lake needs. For example, you may want to use the Standard storage class for frequently
    accessed data or Nearline and Coldline storage classes for infrequently accessed
    data.


    2.  **Configure access control**: Use IAM (Identity and Access Management) to
    set access control policies and manage permissions for your data lake.


    3.  **Ingest data into the data lake**: You can upload data to your bucket using
    the GCP Console, the gsutil command-line tool, or other supported data ingestion
    tools.


    4.  **Organize data in the data lake**: Use a directory structure or object naming
    conventions to organize data within your bucket. This will make it easier to search
    and access data when performing analytics.


    5.  **Use GCP analytics and AI tools**: Use GCP’s suite of analytics and AI tools,
    such as BigQuery, Cloud Dataflow, and AI Platform, to ingest and process data
    from your data lake. These tools can help you analyze and gain insights from large
    volumes of data stored in your data lake.


    6.  **Ensure security and compliance**: Use GCP’s security and compliance tools,
    such as Cloud Audit Logs and Security Command Center, to ensure that your data
    lake is secure and compliant with industry regulations.


    Creating a data lake for analytics with Google Cloud Storage involves setting
    up a bucket, configuring access control, ingesting and organizing data, and using
    GCP’s analytics and AI tools to gain insights from the data. By adhering to these
    instructions, you can establish a robust data lake that empowers you to make informed
    decisions based on data and gain a competitive edge within your industry.


    ## Introduction to Google Cloud SQL and Its Use Cases for Relational Databases


    Google Cloud SQL is a fully managed relational database service provided by Google
    Cloud Platform (GCP) that enables users to create, configure, and use databases
    in the cloud. With Google Cloud SQL, users can leverage the power and flexibility
    of popular relational database management systems, such as MySQL, PostgreSQL,
    and SQL Server, without the need to manage the underlying infrastructure, patching,
    or backups.


    Google Cloud SQL provides several features that make it a powerful and flexible
    database solution, including the following:


    **Automatic backups and point-in-time recovery**: Google Cloud SQL automatically
    backs up databases and enables point-in-time recovery, allowing users to easily
    restore databases to a specific point in time.


    **High availability and durability**: Google Cloud SQL provides a highly available
    and durable database solution with automated failover and built-in replication
    across multiple zones and regions.


    **Scalability**: Google Cloud SQL allows users to scale their database resources
    up or down as needed, providing flexibility and cost-effectiveness.


    **Compatibility**: Google Cloud SQL is compatible with popular open source and
    commercial relational database management systems, making migrating existing databases
    to the cloud easy.


    **Security**: Google Cloud SQL provides multiple layers of security, including
    encryption at rest and in transit, IAM-based access control, and network security
    (Secureicon, 2022).


    **Integration with other GCP services**: Google Cloud SQL integrates seamlessly
    with other GCP services, such as Compute Engine, App Engine, and Kubernetes Engine,
    enabling users to build and deploy powerful applications in the cloud.


    Overall, Google Cloud SQL provides a fully managed, highly available, and scalable
    database solution that enables users to easily deploy, manage, and use popular
    relational database management systems in the cloud.'
  trans: "\n### 存储位置\n\n除了上述存储类别，Google Cloud Storage 还提供两种存储位置：\n\n1. **区域存储**：此选项将数据存储在特定区域，可实现该区域内数据的低延迟访问。建议对性能要求较高的应用使用区域存储。\n\
    2. **多区域存储**：此选项将数据存储在多个地理位置，提供高可用性和全球数据访问。建议需要全球数据访问的应用使用多区域存储。\n\nGoogle Cloud\
    \ Storage 提供的多种存储选项，使用户能够选择满足其数据存储和访问需求的合适存储类别和位置，并优化其存储成本。\n\n### 使用 Google Cloud\
    \ Storage 创建分析用数据湖\n\n这是一个直接的过程，包含以下步骤：\n\n1. **创建 Google Cloud Storage 存储桶**：存储桶是用于存储对象（如文件或数据）的容器。您可以在\
    \ GCP 控制台中或使用 `gsutil` 命令行工具创建存储桶。打开 Cloud Console 导航菜单，然后选择 Cloud Storage。\n\n\
    \   ![](img/606032_1_En_6_Fig1_HTML.jpg)\n\n   *一个界面截图，突出显示了左侧面板上的云存储选项。*\n\n\
    \   **图 6-1** Cloud Storage\n\n   您将看到以下屏幕。\n\n   ![](img/606032_1_En_6_Fig2_HTML.jpg)\n\
    \n   *一个界面截图，显示了在云存储下选择存储桶选项。它列出了存储桶下的云存储预览和安全建议。*\n\n   **图 6-2** 存储桶\n\n   接下来，点击“创建”。\n\
    \n   ![](img/606032_1_En_6_Fig3_HTML.jpg)\n\n   *一个云存储界面的截图，显示了 3 个选项。它列出了用于创建存储桶的菜单。内容包含名称、存储位置和存储类别。*\n\
    \n   **图 6-3** 新建存储桶\n\n   为存储桶提供一个唯一的名称，选择首选区域，并选择所需的存储类别，例如标准存储或低频访问存储。调整任何其他配置，例如版本控制和生命周期规则。最后，点击“创建”按钮开始创建存储桶。\n\
    \n   ![](img/606032_1_En_6_Fig4_HTML.jpg)\n\n   *一个云存储界面的截图，显示了存储桶选项的选择。它列出了包含对象、配置、权限、保护和生命周期的存储桶详细信息。*\n\
    \n   **图 6-4** 存储桶详细信息\n\n   成功创建存储桶后，您就可以开始在其中上传和访问数据。\n\n2. **选择存储类别**：选择最适合您数据湖需求的存储类别。例如，对于频繁访问的数据，您可能希望使用标准存储类别；对于不频繁访问的数据，则使用近线和冷线存储类别。\n\
    3. **配置访问控制**：使用 IAM（身份与访问管理）为您的数据湖设置访问控制策略并管理权限。\n4. **将数据摄取到数据湖**：您可以使用 GCP\
    \ 控制台、`gsutil` 命令行工具或其他支持的数据摄取工具将数据上传到您的存储桶。\n5. **在数据湖中组织数据**：使用目录结构或对象命名约定来组织存储桶内的数据。这将使执行分析时更容易搜索和访问数据。\n\
    6. **使用 GCP 分析和 AI 工具**：使用 GCP 的分析和 AI 工具套件，例如 `BigQuery`、`Cloud Dataflow` 和 `AI\
    \ Platform`，来摄取和处理来自数据湖的数据。这些工具可以帮助您分析存储在数据湖中的大量数据并获得洞察。\n7. **确保安全性和合规性**：使用\
    \ GCP 的安全性和合规性工具，例如 `Cloud Audit Logs` 和 `Security Command Center`，确保您的数据湖安全且符合行业法规。\n\
    \n使用 Google Cloud Storage 创建分析用数据湖涉及设置存储桶、配置访问控制、摄取和组织数据，以及使用 GCP 的分析和 AI 工具从数据中获取洞察。通过遵循这些说明，您可以建立一个强大的数据湖，使您能够基于数据做出明智的决策，并在您的行业中获得竞争优势。\n\
    \n## Google Cloud SQL 简介及其在关系数据库中的用例\n\nGoogle Cloud SQL 是 Google Cloud Platform\
    \ (GCP) 提供的一种完全托管的关系数据库服务，使用户能够在云中创建、配置和使用数据库。借助 Google Cloud SQL，用户可以充分利用流行的关系数据库管理系统（如\
    \ MySQL、PostgreSQL 和 SQL Server）的强大功能和灵活性，而无需管理底层基础设施、补丁或备份。\n\nGoogle Cloud SQL\
    \ 提供了多项功能，使其成为一个强大且灵活的数据库解决方案，包括以下内容：\n\n**自动备份和时间点恢复**：Google Cloud SQL 自动备份数据库并支持时间点恢复，使用户能够轻松地将数据库恢复到特定时间点。\n\
    \n**高可用性和持久性**：Google Cloud SQL 提供高可用性和持久性的数据库解决方案，具有自动故障转移和跨多个区域和区域的內建复制功能。\n\
    \n**可扩展性**：Google Cloud SQL 允许用户根据需要向上或向下扩展其数据库资源，提供灵活性和成本效益。\n\n**兼容性**：Google\
    \ Cloud SQL 与流行的开源和商业关系数据库管理系统兼容，使现有数据库迁移到云端变得容易。\n\n**安全性**：Google Cloud SQL\
    \ 提供多层安全性，包括静态和传输中加密、基于 IAM 的访问控制以及网络安全（Secureicon，2022）。\n\n**与其他 GCP 服务的集成**：Google\
    \ Cloud SQL 与其他 GCP 服务（如 `Compute Engine`、`App Engine` 和 `Kubernetes Engine`）无缝集成，使用户能够在云中构建和部署强大的应用程序。\n\
    \n总体而言，Google Cloud SQL 提供了一个完全托管、高可用且可扩展的数据库解决方案，使用户能够轻松地在云中部署、管理和使用流行的关系数据库管理系统。\n"
- fmt: "### Create a MySQL Instance by Using Cloud SQL\n\n1.  To initiate the process,\
    \ access the Google Cloud Console at [`https://console.cloud.google.com/`](https://console.cloud.google.com/)\
    \ and log in. Then, choose the desired project in which you intend to create the\
    \ MySQL instance.\n\n2.  Enable APIs:\n    - `Compute Engine API`\n    - `sqladmin\
    \ API (prod)`\n\n3.  Once you’re in the project, click the navigation menu in\
    \ the top-left corner and select `SQL`.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig5_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface highlights the `SQL` option.\n\
    \    **Figure 6-5** SQL menu item\n\n4.  Click the `CREATE INSTANCE` button on\
    \ the Cloud SQL page.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig6_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays the pile of instances\
    \ under the create instance workspace.\n    **Figure 6-6** CREATE INSTANCE\n\n\
    5.  On the Create an instance page, select the MySQL version you want to use.\n\
    \n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig7_HTML.jpg)\n    A screenshot\
    \ of the Google Cloud interface displays the options under Create an instance.\
    \ It lists the database engines as `MySQL`, `PostgreSQL`, and `SQL server`.\n\
    \    **Figure 6-7** Create an instance page\n\n6.  Choose the instance type and\
    \ configure the instance settings as per your requirements. You can set the instance\
    \ ID, region, and zone where you want to create the instance.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig8_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays the options under the\
    \ create MySQL instance. It lists the instance info with the instance ID and password.\
    \ A summary is on the right panel.\n    **Figure 6-8** Configure the instance\
    \ settings\n\n7.  Next, configure the machine type and storage type for the instance.\
    \ You can also set the storage capacity.\n\n8.  Under the Connectivity section,\
    \ you can choose how to connect to your instance. You can choose a public or private\
    \ IP address and configure authorized networks for access.\n\n9.  Under the Additional\
    \ Configuration section, you can configure advanced options such as database flags,\
    \ backup settings, and maintenance settings.\n\n10. Once you’ve configured all\
    \ the settings, click the `CREATE INSTANCE` button at the bottom of the page to\
    \ create the MySQL instance.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig9_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays the options under the\
    \ create MySQL instance. It lists the flags, query insights, and labels with the\
    \ properties on the right.\n    **Figure 6-9** Create a MySQL instance\n\n11.\
    \ The instance creation process may take a few minutes, depending on the configuration\
    \ and resources allocated. Once the instance is created, connect to it using any\
    \ MySQL client and start using it.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig10_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays a dropdown where the\
    \ overview is selected. It lists the MySQL instance overview with the CPU utilization\
    \ chart.\n    **Figure 6-10** Overview of the MySQL instance\n\nThat’s it! You\
    \ have now successfully created a MySQL instance using Cloud SQL.\n\n### Connect\
    \ to Your MySQL Instance\n\n1.  Click Activate Cloud Shell.\n\n2.  Connect to\
    \ your MySQL instance by using the following command:\n\n    ```\n    gcloud sql\
    \ connect mysql-instance --user=root\n    ```\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig11_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays the SQL options. It lists\
    \ the overview with a workspace with a code that displays the welcome message\
    \ connecting to the MySQL instance.\n    **Figure 6-11** Connect to the MySQL\
    \ instance\n\n3.  Authorize.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig12_HTML.jpg)\n\
    \    A screenshot of the pop-up box that displays the authorize cloud shell message\
    \ with the reject and authorize buttons.\n    **Figure 6-12** Authorize Cloud\
    \ Shell\n\n4.  Enter the password created while creating the SQL instance, and\
    \ you will get a MySQL prompt (`mysql>`).\n\n### Create a Database and Upload\
    \ Data in SQL\n\n1.  This code will create a new database named `college`. You\
    \ can replace `college` with the name you want to give to your database:\n\n \
    \   ```\n    CREATE DATABASE college;\n    ```\n\n    Remember to use appropriate\
    \ naming conventions for your database to make it easily identifiable and to avoid\
    \ naming conflicts with other databases.\n\n2.  The following code will first\
    \ select the `college` database using the `USE` statement and then create a new\
    \ table named `students` with three columns: `id`, `name`, and `age`. The `id`\
    \ column is an auto-incrementing integer that serves as the primary key for the\
    \ table:\n\n    ```\n    USE college;\n    CREATE TABLE students (\n    id INT\
    \ NOT NULL AUTO_INCREMENT,\n    name VARCHAR(50) NOT NULL,\n    age INT NOT NULL,\n\
    \    PRIMARY KEY (id)\n    );\n    ```\n\n    You can modify the column names,\
    \ data types, and constraints to fit your specific needs. The `CREATE TABLE` statement\
    \ provides a lot of flexibility in defining the structure of your database tables.\n\
    \n3.  The following code will insert five rows of data into the `students` table\
    \ with values for the `name` and `age` columns. The `id` column is not specified,\
    \ since it is an auto-incrementing primary key that will be generated automatically\
    \ by MySQL:\n\n    ```\n    INSERT INTO students (name, age) VALUES\n    ('John\
    \ Smith', 20),\n    ('Jane Doe', 21),\n    ('Bob Johnson', 19),\n    ('Samantha\
    \ Lee', 22),\n    ('Chris Brown', 18);\n    ```\n\n    You can modify the sample\
    \ data to fit your specific needs and insert as many rows as you need. Remember\
    \ to provide values for all the columns that are not defined as `AUTO_INCREMENT`\
    \ or `DEFAULT NULL`, or you will get an error.\n\n    Note that the `INSERT INTO`\
    \ statement can also be used to insert data into multiple tables at once or to\
    \ insert data from another table using a subquery.\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig13_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays the workspace and uploads\
    \ the student's data into the database.\n    **Figure 6-13** INSERT INTO\n\n4.\
    \  View the data from the table:\n\n    ```\n    select * from students;\n   \
    \ ```\n\n    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig14_HTML.jpg)\n\
    \    A screenshot of the Google Cloud interface displays the workspace with the\
    \ uploaded data as ID, name, and age into the database.\n    **Figure 6-14** select\n\
    \n5.  Clean up.\n\n    Use the following code to delete the database:\n\n    ```\n\
    \    DROP DATABASE college;\n    ```\n\n6.  Disconnect from your MySQL instance\
    \ using the `exit` command and close the shell.\n\n7.  Delete the instance. If\
    \ the delete option is not enabled, go to the Data Protection section and disable\
    \ deletion protection."
