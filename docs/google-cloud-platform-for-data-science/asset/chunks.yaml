- fmt: "# Using Vertex AI for Training and Deploying Machine Learning Models\n\n`Vertex\
    \ AI`, developed by OpenAI, is an inclusive platform to construct and launch machine\
    \ learning models. It streamlines the process for data scientists, engineers,\
    \ and developers by abstracting away the complexities of underlying technologies.\
    \ `Vertex AI` offers a user-friendly interface that simplifies working with machine\
    \ learning models and incorporates pre-built models and tools for essential tasks\
    \ like data preparation, model selection, training, and deployment. Leveraging\
    \ popular machine learning frameworks like `PyTorch` and `TensorFlow`, `Vertex\
    \ AI` facilitates model development across diverse applications, including image\
    \ classification, natural language processing, and recommendation systems.\n\n\
    It replaces several legacy services, including:\n\n- **Cloud AutoML**: As mentioned\
    \ earlier, `Cloud AutoML` is being replaced by `Vertex AutoML`. `Vertex AutoML`\
    \ provides a more streamlined and integrated experience for building and deploying\
    \ machine learning models.\n- **Cloud ML Engine**: The `Vertex AI` platform is\
    \ replacing `Cloud ML Engine`. The `Vertex AI` platform offers functionality similar\
    \ to `Cloud ML Engine` but with a more user-friendly interface and advanced features.\n\
    - **Cloud AI Platform Notebooks**: `Cloud AI Platform Notebooks` is being replaced\
    \ by `Vertex AI Notebooks`. `Vertex AI Notebooks` provides the same functionality\
    \ as `Cloud AI Platform Notebooks` but with more powerful hardware options and\
    \ improved integration with other `Vertex AI` services.\n\nGoogle Cloud previously\
    \ provided `AutoML Tables`, a machine learning service enabling users to generate\
    \ custom models without extensive programming or data science expertise. However,\
    \ the legacy edition of `AutoML Tables` has been phased out and will no longer\
    \ be accessible on Google Cloud starting from January 23, 2024.\n\nThe good news\
    \ is that all the features and functionalities previously available in the legacy\
    \ `AutoML Tables`, along with new additions, can now be accessed on the `Vertex\
    \ AI` platform.\n\nThe `Vertex AI` platform integrates with the machine learning\
    \ (ML) workflow in several key ways:\n\n- **Data preparation**: `Vertex AI` provides\
    \ tools for preparing and cleaning your data for use in a machine learning model.\
    \ This includes data loading, splitting, and preprocessing.\n  - Leverage the\
    \ capabilities of `Vertex AI Workbench` notebooks to explore and visualize data\
    \ effectively. `Vertex AI Workbench` seamlessly integrates with `Cloud Storage`\
    \ and `BigQuery`, providing expedited access and processing of your data.\n- For\
    \ large datasets, use `Dataproc Serverless Spark` from a `Vertex AI Workbench`\
    \ notebook to run Spark workloads without having to manage your `Dataproc` clusters\
    \ (Google Cloud, 2023).\n- **Model selection**: Within `Vertex AI`, you will find\
    \ a collection of pre-built models catering to common machine learning tasks like\
    \ image classification, natural language processing, and recommendation systems.\
    \ Additionally, `AutoML` can be employed to train models without the need for\
    \ manual code writing (Blog, Neos Vietnam, n.d.). These models can be used as\
    \ is or customized as needed. Additionally, `Vertex AI` provides the ability to\
    \ create custom models from scratch.\n- **Training**: `Vertex AI` provides tools\
    \ for training machine learning models on your data. The training process is managed\
    \ within the platform, and `Vertex AI` provides monitoring and early-stopping\
    \ capabilities to ensure that models are trained efficiently and effectively.\n\
    - **Model evaluation**: `Vertex AI` provides tools for evaluating the performance\
    \ of trained models. This includes performance metrics, such as accuracy, precision,\
    \ and recall, as well as visualization tools to help you understand how your model\
    \ is performing.\n- **Deployment**: `Vertex AI` provides tools for deploying trained\
    \ models into production, making it possible to use your models to make predictions\
    \ on new data. `Vertex AI` provides a number of deployment options, including\
    \ serving the model as a REST API, deploying it as a function on a cloud platform,\
    \ or integrating it into an existing application.\n\nBy integrating with the machine\
    \ learning workflow in these key ways, `Vertex AI` makes it possible for data\
    \ scientists, engineers, and developers to build, train, and deploy machine learning\
    \ models more easily and efficiently.\n\n## MLOps, or Machine Learning Operations\n\
    \n`MLOps`, or Machine Learning Operations, refers to the process of managing and\
    \ scaling machine learning models in a production environment. `Vertex AI` provides\
    \ support for `MLOps` by offering several tools and features to help manage the\
    \ deployment and operation of machine learning models. Some of the key features\
    \ for `MLOps` on `Vertex AI` include:\n\n1. **Deployment**: `Vertex AI` provides\
    \ tools for deploying machine learning models into production, making it possible\
    \ to use your models to make predictions on new data. `Vertex AI` provides several\
    \ deployment options, including serving the model as a REST API, deploying it\
    \ as a function on a cloud platform, or integrating it into an existing application.\n\
    2. **Monitoring**: `Vertex AI` provides tools for monitoring the performance of\
    \ deployed models. This includes performance metrics, such as accuracy, precision,\
    \ and recall, as well as visualization tools to help you understand how your model\
    \ is performing in real-world use.\n3. **Version control**: `Vertex AI` provides\
    \ version control capabilities, allowing you to manage multiple versions of a\
    \ model and track changes over time. This makes it possible to roll back to previous\
    \ versions if needed and helps ensure that you can maintain control over your\
    \ models as they evolve.\n4. **Scale**: `Vertex AI` provides tools for scaling\
    \ machine learning models, making it possible to handle increasing amounts of\
    \ data and traffic. This includes the ability to deploy models across multiple\
    \ GPUs or cloud instances and to adjust the resources allocated to a model as\
    \ needed.\n\nBy offering these and other features for `MLOps`, `Vertex AI` helps\
    \ simplify the process of deploying and managing machine learning models in a\
    \ production environment. This makes it easier for data scientists, engineers,\
    \ and developers to focus on the important work of developing and refining their\
    \ models while still maintaining control and visibility over the models as they\
    \ are used in the real world.\n\nTo use `Vertex AI`, you must opt for either a\
    \ free tier or a full-service account. Once done, you can click the link `https://console.cloud.google.com/`\
    \ and access the console.\n\n![A screenshot of the Google Cloud page displays\
    \ the dropdown under the Cloud Overview. It lists the dashboard, activity, and\
    \ recommendations.](images/606032_1_En_3_Chapter/606032_1_En_3_Fig16_HTML.png)\n\
    \n**Figure 3-16** Console\n\nNow you are ready to access Google Cloud services.\
    \ Go to the search box and type `Vertex AI`, and you will be able to see the following\
    \ screen.\n\n![A screenshot of a page displays the dropdown under Vertex A I,\
    \ where the dashboard is selected. It displays the welcome page of Vertex A I.](images/606032_1_En_3_Chapter/606032_1_En_3_Fig17_HTML.png)\n\
    \n**Figure 3-17** Vertex AI Dashboard\n\n## User-Managed Notebook Instance in\
    \ Vertex AI\n\nA user-managed notebook instance in `Vertex AI` provides a dedicated\
    \ and customizable environment for running data science and machine learning tasks.\
    \ The main use of this type of instance is to provide data scientists and machine\
    \ learning engineers with a self-contained and scalable environment to develop\
    \ and experiment with their models.\n\nSome of the benefits of using a user-managed\
    \ notebook instance in `Vertex AI` include:\n\n1. **Customizability**: Users have\
    \ full control over the instance and can install and configure the tools and packages\
    \ they need for their work."
