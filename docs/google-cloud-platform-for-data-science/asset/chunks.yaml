    ## Cloud Data Fusion


    Cloud Data Fusion is a fully managed data integration service that allows users
    to efficiently build and manage ETL/ELT (Extract, Transform, Load/Extract, Load,
    Transform) pipelines on Google Cloud Platform. The service is designed to make
    it easy for data analysts and data engineers to create, deploy, and manage data
    pipelines at scale without requiring deep technical expertise.


    Cloud Data Fusion comes with a web-based UI that provides a graphical interface
    for building and managing data pipelines. The UI includes a drag-and-drop interface
    for connecting sources and destinations and a large library of pre-built connectors
    to common data sources and sinks. Cloud Data Fusion also supports complex data
    transformations, such as join, merge, and filter operations.


    Under the hood, Cloud Data Fusion uses Apache Spark and Apache Beam, two open
    source data processing frameworks, to execute data transformations and move data
    between systems. This allows Cloud Data Fusion to support a wide range of data
    sources, including relational databases, NoSQL databases, and file systems, and
    to scale to handle large data volumes.


    With Cloud Data Fusion, users can easily create data pipelines to move data between
    various systems, such as from on-premises data centers to Google Cloud or between
    different services on Google Cloud. Cloud Data Fusion integrates with other Google
    Cloud services such as BigQuery, Cloud Storage, and Cloud Pub/Sub, making moving
    data between these services easy.


    Overall, Cloud Data Fusion can simplify the process of building and managing data
    pipelines, allowing users to focus on extracting value from their data instead
    of managing the underlying infrastructure.


    ### Enable or Disable Cloud Data Fusion


    Cloud Data Fusion can be used with an existing project, or a new one can be created.
    In the case of an existing project, the Cloud Data Fusion API needs to be enabled.


    To enable the Cloud Data Fusion API and create a new project, follow these steps:


    1.  Select or create a project in the Google Cloud Console.


    2.  Ensure that billing is enabled for your project.


    3.  Navigate to the API Overview page for Cloud Data Fusion.


    ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig17_HTML.jpg)


    A screenshot displays an extract of the Google Cloud website page, which presents
    Cloud Data Fusion A P I under the head product details. The enable button below
    is selected.


    Figure 7-17


    Cloud Data Fusion


