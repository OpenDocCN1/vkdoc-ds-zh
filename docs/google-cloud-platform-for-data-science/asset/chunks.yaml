  trans: "\n### 4. **创建存储桶**：随后，代码会为 Vertex AI 平台创建一个新的 Google Cloud Storage 存储桶，用于存储其数据。代码提供了一个默认名称，但会使用时间戳来确保名称的唯一性，以防默认名称已被占用。创建存储桶的代码如下：\n\
    \n```\nbucket_name = \"bucket-name-placeholder\"  # @param {type:\"string\"}\n\
    bucket_uri = f\"gs://{bucket_name}\"\nfrom datetime import datetime\ntimestamp\
    \ = datetime.now().strftime(\"%Y%m%d%H%M%S\")\nif bucket_name == \"\" or bucket_name\
    \ is None or bucket_name == \"bucket-name-placeholder\":\n    bucket_name = project_id\
    \ + \"aip-\" + timestamp\n    bucket_uri = \"gs://\" + bucket_name\nfrom google.cloud\
    \ import storage\nclient = storage.Client(project=project_id)\n# Create a bucket\n\
    bucket = client.create_bucket(bucket_name, location=region)\nprint(\"Bucket {}\
    \ created.\".format(bucket.name))\n```\n\n此处定义了 `bucket_name` 和 `bucket_uri`，并使用时间戳为存储桶创建唯一名称。然后，使用项目\
    \ ID 创建一个 Google Cloud Storage 客户端，并通过该客户端以及指定的名称和区域创建新的存储桶。\n\n### 初始化 Vertex\
    \ AI SDK for Python。\n\n以下代码初始化了 Vertex AI SDK，该 SDK 提供了对 Vertex AI 平台及其功能的访问：\n\
    \n```\nfrom google.cloud import aiplatform\n# Initialize the Vertex AI SDK\naiplatform.init(project=project_id,\
    \ location=region, staging_bucket=bucket_uri)\n```\n\n第一行从 `google.cloud` 库中导入了\
    \ `aiplatform` 模块，该模块提供了对 Vertex AI API 的访问。\n\n随后，使用三个参数调用了 `aiplatform.init`\
    \ 方法：`project`、`location` 和 `staging_bucket`。`project` 参数是用于访问 Vertex AI 平台的 Google\
    \ Cloud 项目 ID。`location` 参数是创建 Vertex AI 平台资源的地理位置。`staging_bucket` 参数是 Google\
    \ Cloud Storage 存储桶的 URI，用于在模型训练和部署期间存储中间数据。\n\n此代码建立了与 Vertex AI 平台的连接，并为其在您的应用程序中使用做好了准备。\n\
    \n### 初始化 BigQuery。\n\n以下代码设置了一个 BigQuery 客户端，用于访问指定项目中的 BigQuery 数据存储和分析服务：\n\
    \n```\nfrom google.cloud import bigquery\n# Set up BigQuery client\nbq_client\
    \ = bigquery.Client(project=project_id)\n```\n\n第一行从 `google.cloud` 库中导入了 `bigquery`\
    \ 模块，该模块提供了对 BigQuery API 的访问。\n\n然后，使用 `project_id` 变量作为参数，将 `bq_client` 变量定义为\
    \ `bigquery.Client` 类的一个实例。这将创建一个客户端对象，用于与指定项目的 BigQuery API 进行交互。\n\n提供的代码建立了\
    \ BigQuery 客户端，从而能够访问和操作存储在 BigQuery 中的数据。它赋予了执行查询、执行数据分析操作以及在 BigQuery 环境中执行与数据管理相关的各种任务的能力。\n\
    \n### 创建 Vertex AI 表格数据集。\n\n以下代码正在对来自 BigQuery 的数据集进行预处理。它首先从 BigQuery 源数据集（`BQ_SOURCE`，即\
    \ `\"bigquery-public-data.ml_datasets.penguins\"`）中检索一个表。然后，将数据加载到一个 Pandas DataFrame（`df`）中。\n\
    \n接下来，代码将数据集中与 `NA_VALUES` 列表（`\"NA\"`、`\".\"`）中定义的值匹配的任何值替换为 `NaN`，并删除所有包含 `NaN`\
    \ 值的行。此步骤用于清理数据并移除不可用的行。\n\n下一步涉及将分类列转换为数值。对于三个分类列（`island`、`species` 和 `sex`），代码使用\
    \ Pandas 的 `factorize` 方法将这些列中的字符串转换为整数。`factorize` 方法为每一列返回一个新的序列和一个唯一值数组。\n\n\
    然后，数据被分成两个独立的数据帧：`df_train` 和 `df_for_prediction`。`df_train` 包含 80% 的数据，用于训练目的；而\
    \ `df_for_prediction` 包含剩余的 20% 数据，用于预测。\n\n最后，代码为这三个列分别创建了一个字典，将数值映射回其字符串表示形式。这些字典分别是\
    \ `index_to_island`、`index_to_species` 和 `index_to_sex`。然后打印这些字典以验证其值：\n\n```\n\
    import numpy as np\nimport pandas as pd\nLABEL_COLUMN = \"species\"\n# Define\
    \ the BigQuery source dataset\nBQ_SOURCE = \"bigquery-public-data.ml_datasets.penguins\"\
    \n# Define NA values\nNA_VALUES = [\"NA\", \".\"]\n# Download a table\ntable =\
    \ bq_client.get_table(BQ_SOURCE)\ndf = bq_client.list_rows(table).to_dataframe()\n\
    # Drop unusable rows\ndf = df.replace(to_replace=NA_VALUES, value=np.NaN).dropna()\n\
    # Convert categorical columns to numeric\ndf[\"island\"], island_values = pd.factorize(df[\"\
