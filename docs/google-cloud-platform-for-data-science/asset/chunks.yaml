- fmt: '# Creating and Sharing Data Visualizations and Reports with Looker Studio


    Here’s a step-by-step tutorial for using Looker Studio.


    Sign up for a Looker account: if you don’t already have a Looker account, sign
    up for one on the Looker website.


    1. **Log into Looker**: Once you have an account, log into your Looker account
    using the link [`https://lookerstudio.google.com/navigation/reporting`](https://lookerstudio.google.com/navigation/reporting).
    You can see the following screen.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig1_HTML.png)


    A screenshot of the Looker Studio welcome page with the recent tab from the left
    panel selected and the page displayed on the right. In which the reports tab is
    selected, which presents templates labeled blank report, tutorial report, and
    acme marketing.


    Figure 4-1


    Welcome screen of Looker Studio


    Click `Create` and select `Report`.


    1. **Connect to your data**: Looker Studio needs access to your data to build
    reports and visualizations. Connect your data sources to Looker by going to the
    `Data` tab and clicking `Connections`. Follow the instructions to add your data
    sources.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig2_HTML.png)


    A screenshot of the untitled report page with the connect to data tag selected,
    which provides templates such as Looker, Google Analytics, and Google Ads. The
    view button on the top right corner of the page is selected.


    Figure 4-2


    New report


    For this example, we can go to `My data sources` and select `[Sample] World Population
    Data 2005 - 2014`, which is freely available. Click `Add to report`. The following
    screen will appear.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig3_HTML.png)


    A screenshot of the untitled report page has the chart and data panels on the
    right from where files are selected. The report in table format lists countries
    and populations on the left pane. The view button on the top right corner of the
    page is selected.


    Figure 4-3


    Data imported to the report


    1. **Explore your data**: Once you have connected your data sources, you can explore
    yours. Click `Chart`, and you will find many chart-type options. Select the bar
    chart and see the following graph.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig4_HTML.png)


    A screenshot of the untitled report page has the chart and data panels on the
    right pane, from where the chart option is selected. A horizontal bar chart presents
    the population data on the left pane. The view button on the top right corner
    of the page is selected.


    Figure 4-4


    Visualization from data


    1. **Create a Look**: You can see the final output by clicking the `View` button
    at the top right of the preceding screen.


    2. **Save and share your work**: Once you have built your visualizations, you
    can save and share your work. Go to the `Share` tab and select how you want to
    share your work. Sharing your data visualization or report becomes effortless
    through various means, including sharing a link, embedding it on a website, or
    exporting it to a different format. These options provide flexibility in disseminating
    your work to others.


    3. **Collaborate with others**: Looker Studio incorporates collaborative functionalities
    that enable seamless teamwork on reports and visualizations. You can share your
    work with others, granting them permission to either edit or view your content,
    fostering effective collaboration among team members.


    **Here’s how to add data from Excel and explore:**


    1. **Prepare your file:** The Excel file should be in a proper format. See the
    following example. The heading should start with the first-row first column, with
    no vacant space above it.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig5_HTML.jpg)


    A screenshot of a sample Excel sheet. Here, the heading starts from the first-row
    first column without any vacant space above it, which is indicated by a rightward
    arrow.


    Figure 4-5


    Sample Excel file


    1. Select the entire header row and save it as a CSV file.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig6_HTML.jpg)'
