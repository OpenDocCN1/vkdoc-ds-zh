    ## 使用 Vertex AI 和 Python SDK 训练模型


    在这里，我们将使用 Vertex AI SDK for Python 创建一个自定义训练的机器学习模型。本节适用于喜欢使用笔记本、Python 和机器学习工作流的数据科学家。要使用
    Vertex AI 和 Python SDK 训练机器学习模型，您需要满足以下先决条件：


    1.  **Google Cloud 账户**：要继续，必须拥有一个 Google Cloud 账户。如果您没有，可以通过访问以下链接创建账户或登录：[`https://console.cloud.google.com/`](https://console.cloud.google.com/)。如果您需要有关如何创建
    Google Cloud 账户的指导，请参考本材料的早期章节。


    2.  **Google Cloud 项目**：如果您没有项目，请使用链接 [`https://console.cloud.google.com/cloud-resource-manager`](https://console.cloud.google.com/cloud-resource-manager)
    创建一个。按照前面章节的讨论填写详细信息。如果您已经创建了项目，请转到控制台欢迎屏幕并找到项目 ID，以便稍后在此实验中使用。


    3.  **Vertex AI JupyterLab 笔记本**：按照前面提供的步骤创建用户管理的笔记本实例。


    4.  **打开您的笔记本**：如果您在 Google Cloud 控制台中，请在搜索框中搜索 `Vertex AI`。


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig44_HTML.jpg)


    Google Cloud 窗口的截图显示了 `Vertex AI` 的搜索结果。


    **图 3-44** 搜索 `Vertex AI`


    单击 `Vertex AI`。进入 `Vertex AI` 后，转到 **Workbench**。


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig45_HTML.jpg)


    Google Cloud 窗口的截图列出了 `Vertex AI` 下的下拉菜单，其中选择了 `Workbench` 选项。它在“用户管理的笔记本”选项卡下显示了创建的实例。


    **图 3-45** 打开“用户管理的笔记本”


    单击 **OPEN JUPYTERLAB**，您将看到以下屏幕。


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig46_HTML.png)


    Sandbox 窗口的截图被启动器窗口覆盖，该窗口显示了笔记本、控制台和其他应用程序。


    **图 3-46** JupyterLab


    现在，在笔记本下，单击 `Python 3`。您可以根据自己的喜好重命名笔记本。


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig47_HTML.jpg)


    Sandbox 窗口的截图显示了创建的笔记本，可以通过单击 `Python 3` 选项来重命名。


    **图 3-47** Python 笔记本


    要使用 Vertex AI 和 Python SDK 训练机器学习模型，您需要执行以下步骤：


    1.  **安装 Vertex AI Python 包**：在笔记本中使用以下代码：


    ```python

    # 安装 Vertex AI SDK

    ! pip3 install --upgrade --quiet google-cloud-aiplatform

    ```


    执行上述代码后，Vertex AI Python SDK 及其所有依赖项也会被安装。其中两个依赖项是 Cloud Storage 和 BigQuery。`--quiet`
    标志用于抑制输出，以便仅在有错误时显示错误。感叹号（`!`）是 shell 命令的指示符。


    您可以通过使用“运行所选单元格并前进”或使用键盘快捷键 `Shift+Enter` 来运行代码。


    2.  **设置项目 ID**：第一行代码为 Vertex AI 平台设置项目 ID。项目 ID 是 Google Cloud 控制台中项目的唯一标识符。项目
    ID 使用以下代码设置：


    ```python

    import os

    project_id = " MY_PROJECT_ID "

    os.environ["GOOGLE_CLOUD_PROJECT"] = project_id

    ```


    在这里，项目 ID 存储在 `project_id` 变量中，并设置为 `gcloud` 环境中的活动项目。


    3.  **设置区域**：下一行代码为 Vertex AI 平台设置区域。这是 Vertex AI 资源将被创建和存储的位置。区域使用以下代码设置：


    ```python

    region = "us-central1"

    ```'
