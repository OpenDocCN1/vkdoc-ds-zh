- fmt: '### How to Create and Update a Dataproc Cluster by Using the Google Cloud
    Console


    Creating and updating a Dataproc cluster using the Google Cloud Console is a straightforward
    process. Here are the steps to create and update a Dataproc cluster.


    #### Creating a Dataproc Cluster


    1. Go to the Google Cloud Console (`console.cloud.google.com`) and navigate to
    the Dataproc section.

    2. Enable the Dataproc API.

    3. Click `CREATE CLUSTER` to start the cluster creation process.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig48_HTML.jpg)


    A screenshot of the Google Cloud window highlights the clusters under the Dataproc
    dropdown.


    Figure 3-48


    Creating a Dataproc cluster 1


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig49_HTML.jpg)


    A screenshot of the Google Cloud window displays a dropdown under Dataproc, where
    the clusters option is selected. It displays the Cloud Dataproc workspace with
    the create cluster button highlighted.


    Figure 3-49


