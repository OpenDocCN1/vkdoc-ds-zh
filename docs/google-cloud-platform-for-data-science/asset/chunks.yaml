  trans: "\n# 排版后的内容\n\n截图展示了一个窗口的局部内容，其中包含文件名和保存类型的输入字段。保存类型显示为“CSV（逗号分隔）”。页面底部的“保存”按钮已被选中。\n\
    \n**图 4-6**\n\n以 CSV 格式保存文件\n\n1.  前往 `Looker`。\n2.  点击 `Create` 创建新报告。\n\n![](img/606032_1_En_4_Fig7_HTML.jpg)\n\
    \n截图展示了 Looker Studio 页面的局部内容。其中包含一个选项列表，并选中了“创建”按钮。\n\n**图 4-7**\n\n创建新的 Looker\
