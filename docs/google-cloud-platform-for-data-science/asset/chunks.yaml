    Figure 4-4


    Visualization from data


    1.  **Create a Look**: You can see the final output by clicking the View button
    at the top right of the preceding screen.


    2.  **Save and share your work**: Once you have built your visualizations, you
    can save and share your work. Go to the Share tab and select how you want to share
    your work. Sharing your data visualization or report becomes effortless through
    various means, including sharing a link, embedding it on a website, or exporting
    it to a different format. These options provide flexibility in disseminating your
    work to others.


    3.  **Collaborate with others**: Looker Studio incorporates collaborative functionalities
    that enable seamless teamwork on reports and visualizations. You can share your
    work with others, granting them permission to either edit or view your content,
    fostering effective collaboration among team members.


    **Here’s how to add data** **from Excel and explore:**


    1.  **Prepare your file:** The Excel file should be in a proper format. See the
    following example. The heading should start with the first-row first column, with
    no vacant space above it.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig5_HTML.jpg)


    A screenshot of a sample Excel sheet. Here, the heading starts from the first-row
    first column without any vacant space above it, which is indicated by a rightward
    arrow.


    Figure 4-5


    Sample Excel file


    1.  Select the entire header row and save it as a CSV file.


    ![](images/606032_1_En_4_Chapter/606032_1_En_4_Fig6_HTML.jpg)'
  trans: '

    # 使用 Looker Studio 创建和共享数据可视化与报告


    以下是使用 Looker Studio 的分步教程。


    注册 Looker 账户：如果你还没有 Looker 账户，请在 Looker 网站上注册一个。


    1. **登录 Looker**：拥有账户后，使用链接 [`https://lookerstudio.google.com/navigation/reporting`](https://lookerstudio.google.com/navigation/reporting)
    登录你的 Looker 账户。你将看到以下界面。


    ![](img/606032_1_En_4_Fig1_HTML.png)


    Looker Studio 欢迎页面截图，左侧面板选中了“最近”选项卡，右侧显示了页面内容。其中“报告”选项卡被选中，展示了标记为“空白报告”、“教程报告”和“acme
    marketing”的模板。


    图 4-1


    Looker Studio 欢迎界面


    点击 `Create` 并选择 `Report`。


    1. **连接数据源**：Looker Studio 需要访问你的数据才能构建报告和可视化。前往 `Data` 选项卡并点击 `Connections`，将数据源连接到
    Looker。按照说明添加你的数据源。


    ![](img/606032_1_En_4_Fig2_HTML.png)


    未命名报告页面截图，选中了“连接到数据”标签，提供了诸如 Looker、Google Analytics 和 Google Ads 等模板。页面右上角的“查看”按钮已被选中。


    图 4-2


    新建报告


    在本示例中，我们可以前往 `My data sources` 并选择 `[Sample] World Population Data 2005 - 2014`，该数据可免费使用。点击
    `Add to report`。将出现以下界面。


    ![](img/606032_1_En_4_Fig3_HTML.png)


    未命名报告页面截图，右侧面板显示了图表和数据面板，文件已从中选定。左侧窗格中的报告以表格格式列出了国家与人口。页面右上角的“查看”按钮已被选中。


    图 4-3


    数据已导入报告


    1. **探索数据**：连接数据源后，你可以探索数据。点击 `Chart`，你将看到许多图表类型选项。选择条形图，并查看下图。


    ![](img/606032_1_En_4_Fig4_HTML.png)


    未命名报告页面截图，右侧面板显示了图表和数据面板，其中图表选项已被选中。左侧窗格中，一个水平条形图展示了人口数据。页面右上角的“查看”按钮已被选中。


    图 4-4


    数据可视化


    1. **创建外观**：点击上述界面右上角的 `View` 按钮，即可查看最终输出。


    2. **保存并共享工作**：构建好可视化后，你可以保存并共享工作。前往 `Share` 选项卡，选择共享方式。通过多种方式（包括共享链接、嵌入网站或导出为不同格式）共享数据可视化或报告变得轻而易举。这些选项为向他人传播你的工作提供了灵活性。


    3. **与他人协作**：Looker Studio 集成了协作功能，可实现团队在报告和可视化上的无缝协作。你可以与他人共享工作，授予他们编辑或查看内容的权限，从而促进团队成员之间的有效协作。


    **以下是如何从 Excel 添加数据并进行探索：**


    1. **准备文件：** Excel 文件应采用适当格式。请参见以下示例。标题应从第一行第一列开始，其上方不得有空行。


    ![](img/606032_1_En_4_Fig5_HTML.jpg)


    示例 Excel 工作表截图。此处，标题从第一行第一列开始，其上方没有任何空行，这一点由向右的箭头指示。


    图 4-5


    示例 Excel 文件


    1. 选中整个标题行，并将其保存为 CSV 文件。


    ![](img/606032_1_En_4_Fig6_HTML.jpg)

