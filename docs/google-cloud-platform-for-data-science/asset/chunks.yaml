    要使用 Vertex AI 和 Python SDK 训练机器学习模型，您需要执行以下步骤：


    1.  **安装 Vertex AI Python 包**：在笔记本中使用以下代码：


    ```python

    # 安装 Vertex AI SDK

    ! pip3 install --upgrade --quiet google-cloud-aiplatform

    ```


    执行上述代码后，Vertex AI Python SDK 及其所有依赖项也会被安装。其中两个依赖项是 Cloud Storage 和 BigQuery。`--quiet`
    标志用于抑制输出，以便仅在有错误时显示错误。感叹号（`!`）是 shell 命令的指示符。


    您可以通过使用“运行所选单元格并前进”或使用键盘快捷键 `Shift+Enter` 来运行代码。


    2.  **设置项目 ID**：第一行代码为 Vertex AI 平台设置项目 ID。项目 ID 是 Google Cloud 控制台中项目的唯一标识符。项目
    ID 使用以下代码设置：


    ```python

    import os

    project_id = " MY_PROJECT_ID "

    os.environ["GOOGLE_CLOUD_PROJECT"] = project_id

    ```


    在这里，项目 ID 存储在 `project_id` 变量中，并设置为 `gcloud` 环境中的活动项目。


    3.  **设置区域**：下一行代码为 Vertex AI 平台设置区域。这是 Vertex AI 资源将被创建和存储的位置。区域使用以下代码设置：


    ```python

    region = "us-central1"

    ```

