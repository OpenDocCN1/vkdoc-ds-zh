    A P Is and services tab selected from the left side panel, which presents the
    cloud data fusion A P I on the right side of the page. Below, details such as
    the service name, type, and status are displayed.


    Figure 7-18


    API enabled


    You can start using Cloud Data Fusion with your project by completing the following
    steps.'
  trans: "\n# Dataplex API 页面的截图，在“创建新湖”选项卡下显示了显示名称、ID 和区域等输入字段。\n\n**图 7-8** 创建数据湖\n\
    \n1. 创建数据湖后，您将看到以下屏幕。\n\n   ![](img/606032_1_En_7_Fig9_HTML.png)\n\n   Dataplex\
    \ 网页的截图，显示了显示名称、资产、状态、需要操作的资源、区域、上次修改时间和标签等详细信息。屏幕顶部的“创建”按钮被高亮显示。\n\n**图 7-9**\
    \ 数据湖已创建\n\n1. 创建数据湖后，您可以添加区域。这些区域用于对非结构化和结构化数据进行逻辑分类。点击数据湖的名称，您将看到以下屏幕。\n\n \
    \  ![](img/606032_1_En_7_Fig10_HTML.png)\n\n   Dataplex 网页的截图，显示了需要操作的区域、需要操作的资产、湖\
    \ ID、显示名称和状态等详细信息。下方选中了“区域”选项卡，其中显示了显示名称、类型、状态、需要操作的资产、资产、数据位置、上次修改时间和标签等详细信息。\n\
    \n**图 7-10** 管理数据湖\n\n1. 点击 `+添加区域`，您将看到以下屏幕。\n\n   ![](img/606032_1_En_7_Fig11_HTML.jpg)\n\
    \n   Dataplex 网页的截图，在“创建新区域”选项卡下显示了显示名称、区域 ID、类型和描述等输入字段。\n\n**图 7-11** 创建区域\n\
    \n1. 添加区域后，我们可以通过点击该区域向数据湖添加资产。\n\n   ![](img/606032_1_En_7_Fig12_HTML.jpg)\n\n\
    \   Dataplex 网页的截图，在标题“示例”下显示了各种详细信息，其中状态通过复选标记指示为“湖已激活”。下方选中了“区域”选项卡，其中显示了不同的详细信息，状态通过复选标记指示为“已激活”。\n\
    \n**图 7-12** 数据湖区域已创建\n\n1. 您将看到以下屏幕。点击 `+添加资产`。\n\n   ![](img/606032_1_En_7_Fig13_HTML.png)\n\
    \n   Dataplex 网页的截图，在标题“湖区域 1”下显示了各种详细信息，其中状态通过复选标记指示为“已激活”。下方选中了“资产”选项卡，其中显示了显示名称、资产类型、状态、发现状态、安全状态、资源状态、上次修改时间和标签等详细信息。\n\
    \n**图 7-13** 添加资产——屏幕 1\n\n1. 从下图，您可以点击 `添加一项资产`。\n\n   ![](img/606032_1_En_7_Fig14_HTML.png)\n\
    \n   Dataplex 网页的截图，在标题“向湖区域 1 添加资产”下列出了三个用于添加资产的选项，选中后会在页面右侧显示“添加一项资产”功能，该功能被高亮显示。\n\
    \n**图 7-14** 添加资产——屏幕 2\n\n1. 在以下表单中填写信息。\n\n   ![](img/606032_1_En_7_Fig15_HTML.jpg)\n\
    \n   Dataplex 网页的截图，在标题“向湖区域 1 添加资产”下列出了三个用于添加资产的选项，选中后显示了类型、显示名称、ID 和描述等输入字段。\n\
    \n**图 7-15** 添加资产信息\n\n1. 这里我们正在添加一个 BigQuery 数据集。提供一个显示名称，该名称将自动与 ID 保持一致。向下滚动并浏览数据集。将显示一个数据集列表。选择该数据集。点击“完成”，然后点击“继续”。\n\
    \n2. 将出现发现设置。点击“继续”。\n\n3. 检查您的资产，然后点击“提交”。\n\n4. 如果一切顺利，您将看到下图。\n\n   ![](img/606032_1_En_7_Fig16_HTML.jpg)\n\
    \n   Dataplex 网页的截图，在标题“湖区域 1”下显示了各种详细信息，其中状态通过复选标记指示为“已激活”。下方选中了“资产”选项卡，其中显示了不同的详细信息，状态和安全状态均通过复选标记指示为“已激活”。\n\
    \n**图 7-16** 资产状态\n\n1. 为了避免产生任何费用，如果您不需要已创建的资源，则应将其删除。首先，删除资产。然后，您可以删除区域，最后删除数据湖。\n\
    \n## Cloud Data Fusion\n\nCloud Data Fusion 是一项完全托管的数据集成服务，允许用户在 Google Cloud\
    \ Platform 上高效地构建和管理 ETL/ELT（提取、转换、加载/提取、加载、转换）管道。该服务旨在让数据分析师和数据工程师无需深厚的技术专业知识即可轻松创建、部署和管理大规模数据管道。\n\
    \nCloud Data Fusion 附带一个基于 Web 的 UI，为构建和管理数据管道提供了图形界面。该 UI 包含一个用于连接源和目标的拖放界面，以及一个包含大量预构建连接器（用于常见数据源和数据接收器）的库。Cloud\
    \ Data Fusion 还支持复杂的数据转换，例如连接、合并和过滤操作。\n\n在底层，Cloud Data Fusion 使用 Apache Spark\
    \ 和 Apache Beam 这两个开源数据处理框架来执行数据转换并在系统之间移动数据。这使得 Cloud Data Fusion 能够支持广泛的数据源，包括关系数据库、NoSQL\
    \ 数据库和文件系统，并且能够扩展以处理大量数据。\n\n借助 Cloud Data Fusion，用户可以轻松创建数据管道，在各种系统之间移动数据，例如从本地数据中心到\
    \ Google Cloud，或者在 Google Cloud 上的不同服务之间移动数据。Cloud Data Fusion 与 BigQuery、Cloud\
    \ Storage 和 Cloud Pub/Sub 等其他 Google Cloud 服务集成，使得在这些服务之间移动数据变得容易。\n\n总的来说，Cloud\
    \ Data Fusion 可以简化构建和管理数据管道的过程，使用户能够专注于从数据中提取价值，而不是管理底层基础设施。\n\n### 启用或禁用 Cloud\
    \ Data Fusion\n\nCloud Data Fusion 可以与现有项目一起使用，也可以创建一个新项目。对于现有项目，需要启用 Cloud Data\
    \ Fusion API。\n\n要启用 Cloud Data Fusion API 并创建新项目，请按照以下步骤操作：\n\n1. 在 Google Cloud\
    \ Console 中选择或创建一个项目。\n\n2. 确保已为您的项目启用结算功能。\n\n3. 导航到 Cloud Data Fusion 的 API\
    \ 概览页面。\n\n   ![](img/606032_1_En_7_Fig17_HTML.jpg)\n\n   截图显示了 Google Cloud 网站页面的一个片段，在标题“产品详情”下显示了\
    \ Cloud Data Fusion API。下方的“启用”按钮被选中。\n\n**图 7-17** Cloud Data Fusion\n\n1. 点击\
    \ `启用` 按钮以激活 Cloud Data Fusion API。\n\n   ![](img/606032_1_En_7_Fig18_HTML.jpg)\n\
    \n   截图描绘了“API 和服务”页面的一个片段，左侧面板选中了“已启用的 API 和服务”选项卡，页面右侧显示了 Cloud Data Fusion\
    \ API。下方显示了服务名称、类型和状态等详细信息。\n\n**图 7-18** API 已启用\n\n您可以通过完成以下步骤，开始在您的项目中使用 Cloud\
    \ Data Fusion。\n"
- fmt: "### Create a Data Pipeline\n\n1.  Go to Create `Data Fusion` instance.\n2.\
    \  Enter an instance name.\n3.  If you are using `Cloud Data Fusion` version 6.2.3\
    \ or later, select a `Dataproc` service account to use for running your pipeline\
    \ in `Dataproc` from the `Authorization` field. The default option is the `Compute\
    \ Engine` account.\n\nOnce you have provided all the required details, simply\
    \ click the `Create` button. Please keep in mind that the instance creation process\
    \ may take up to 30 minutes to finish. While `Cloud Data Fusion` is creating your\
    \ instance, you will see a progress wheel next to the instance name on the `Instances`\
    \ page. Once the process is complete, the wheel will transform into a green check\
    \ mark, indicating that the instance is ready for use.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig19_HTML.png)\n\
    \nA screenshot depicts an extract of the `Google Cloud` website page with the\
    \ instances tab selected from the left side panel, which presents details such\
    \ as instance name, action, edition, region, zone, version, and encryption. The\
    \ create instance and refresh buttons at the top of the page are highlighted.\n\
    \n**Figure 7-19** Data Fusion instance\n\n1.  Click `View Instance`.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig20_HTML.jpg)\n\
    \nA screenshot of the cloud data fusion page, which displays the templates such\
    \ as wrangle, integrate, discover and govern, monitor, and manage.\n\n**Figure\
    \ 7-20** Cloud Data Fusion UI\n\n1.  Through the `Cloud Data Fusion Hub`, you\
    \ can access sample pipelines, plugins, and solutions that are reusable and shareable\
    \ among users of `Cloud Data Fusion`. Click `Hub`.\n2.  Click `Pipelines` in the\
    \ bottom left.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig21_HTML.png)\n\
    \nA screenshot of the cloud data fusion web page with the general tab under the\
    \ hub page selected. The hub explorer displays the templates, such as `Amazon\
    \ Kinesis Sink Plugin`, `Amazon Kinesis streaming source`, `Amazon S 3 client`,\
    \ `Anaplan plugins`, `Argument Setter action plugin`, and `Cassandra source and\
    \ sink`.\n\n**Figure 7-21** Hub Explorer\n\n1.  Click the `Cloud Data Fusion Quickstart`\
    \ pipeline. Then click `Finish and customize`.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig22_HTML.png)\n\
    \nA screenshot of the cloud data fusion page presents the `Data Fusion Quickstart`\
    \ flow diagram as follows. `N Y T best sellers`, which leads to `parsing and trans`,\
    \ which leads to `top-rated items`.\n\n**Figure 7-22** Data Fusion Quickstart\
    \ pipeline\n\n1.  Click `Deploy`.\n\nOnce the pipeline has been deployed, you\
    \ can access its details view, where you can perform the following actions:\n\
    *   View the pipeline’s structure and configuration.\n*   Run the pipeline manually\
    \ or configure a schedule or trigger for automated runs.\n*   View a summary of\
    \ the pipeline’s past executions, including execution times, logs, and metrics.\n\
    \n1.  Click `Run` to execute your pipeline.\n2.  Upon completion of a few minutes,\
    \ the pipeline concludes and transitions its status to “Succeeded.” Additionally,\
    \ the number of records processed by each node is shown.\n3.  To view a sample\
    \ of the results, follow these steps:\n    *   Navigate to the `BigQuery` UI.\n\
    \    *   Open the `DataFusionQuickstart` dataset within your project.\n    * \
    \  Click the `top_rated_inexpensive` table.\n    *   Run a basic query, such as\
    \ `SELECT * FROM <var>PROJECT_ID<var>.GCPQuickStart.top_rated_inexpensive LIMIT\
    \ 10` to view a sample of the data.\n    *   Make sure to replace `PROJECT_ID`\
    \ with your project’s unique identifier.\n4.  To prevent your `Google Cloud` account\
    \ from incurring charges related to the resources used on this page, please take\
    \ the following actions:\n    *   Remove the `BigQuery` dataset that your pipeline\
    \ wrote to during this quickstart.\n    *   Delete the `Cloud Data Fusion` instance.\n\
    \    *   Please note that deleting your instance does not remove any data associated\
    \ with your project.\n    *   (Optional) If desired, you may also delete the entire\
    \ project.\n\n## Summary\n\nThis chapter explored advanced topics related to securing\
    \ and managing `Google Cloud Platform` (`GCP`) resources, version control with\
    \ `Google Cloud Source Repositories`, and two powerful data integration and management\
    \ tools: `Dataplex` and `Cloud Data Fusion`.\n\nWe began by discussing the importance\
    \ of securing and managing `GCP` resources with `Identity and Access Management`\
    \ (`IAM`). We learned about `IAM` roles, permissions, and policies and how they\
    \ allow administrators to control access to `GCP` resources. By implementing strong\
    \ `IAM` practices, organizations can ensure the security and integrity of their\
    \ `GCP` resources.\n\nNext, we delved into `Google Cloud Source Repositories`,\
    \ a version control system that provides a scalable and fully managed repository\
    \ for storing and managing source code.\n\nMoving on, we explored `Dataplex`,\
    \ a data fabric platform that enables organizations to discover, understand, and\
    \ manage their data assets at scale. We discussed the key features of `Dataplex`,\
    \ including data discovery, data lineage, and data governance. We learned how\
    \ `Dataplex` integrates with other `Google Cloud` services, such as `BigQuery`\
    \ and `Cloud Storage`, to provide a unified and efficient data management solution.\n\
    \nFinally, we learned about `Cloud Data Fusion`, a fully managed data integration\
    \ service that simplifies the process of building and managing data pipelines.\
    \ We discussed the capabilities of `Cloud Data Fusion`, including its visual interface\
    \ for designing pipelines, support for a wide range of data sources and sinks,\
    \ and built-in data transformation and cleansing capabilities. We also explored\
    \ the integration of `Cloud Data Fusion` with other `Google Cloud` services, such\
    \ as `BigQuery` and `Dataproc`, to create end-to-end data processing workflows.\n\
    \nThroughout the chapter, we gained insights into advanced topics that enhance\
    \ our ability to secure and manage `GCP` resources effectively, collaborate on\
    \ code development using version control systems, and leverage powerful data integration\
    \ and management tools. By understanding and utilizing `IAM`, `Cloud Source Repositories`,\
    \ `Dataplex`, and `Cloud Data Fusion`, we are equipped to tackle complex challenges\
    \ related to resource management, version control, and data integration in the\
    \ `Google Cloud` environment.\n\nWith the knowledge and skills acquired from this\
    \ chapter, we can confidently navigate the advanced aspects of `Google Cloud Platform`,\
    \ implement robust security measures, streamline code collaboration, and efficiently\
    \ manage and integrate data for various data processing and analytics requirements."
