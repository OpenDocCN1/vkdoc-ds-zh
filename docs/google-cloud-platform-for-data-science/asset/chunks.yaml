  trans: "\n# 在 Colaboratory 上创建并运行 Jupyter Notebook\n\n要开始你的 Colab 之旅，请按照以下步骤访问该平台：\n\
    \n![](img/606032_1_En_2_Fig1_HTML.jpg)\n\n一张谷歌登录页面的截图，包含用于填写电子邮件或手机号码的输入框，以及一个用于找回遗忘邮箱的链接。底部有两个按钮，分别是“创建账户”和“下一步”。\n\
    \n**图 2-1** 注册谷歌账户\n\n1. **打开网页浏览器**：在你的电脑或移动设备上启动你常用的网页浏览器。\n2. **注册谷歌账户**：在使用\
    \ Colaboratory 之前，你必须拥有一个谷歌账户。如果你还没有，请注册一个免费的谷歌账户（图 2-1）。\n\n![](img/606032_1_En_2_Fig2_HTML.jpg)\n\
    \n一张截图展示了一个包含 5 列的表格，例如“最近使用”、“Google 云端硬盘”、“GitHub”和“上传”。其中“最近使用”被选中，显示了一个标题列表及其详细信息，包括“上次打开”和“首次打开”。右下角有\
    \ 2 个按钮，分别是“新建笔记本”和“取消”。\n\n**图 2-2** 登录后的 Colaboratory\n\n3. **导航到 Colaboratory**：访问\
    \ Google Colaboratory 网站（[`https://colab.research.google.com/`](https://colab.research.google.com/)）并使用你的谷歌账户登录。登录后，你应该会看到一个类似图\
    \ 2-2 所示的对话框。\n\n![](img/606032_1_En_2_Fig3_HTML.jpg)\n\n一张名为“Untitled1.ipynb”的新笔记本截图。\n\
    \n**图 2-3** 新笔记本\n\n4. **Colab 界面概览**：\n   - **菜单栏**：Colab 界面的顶部是菜单栏。它包含用于文件操作、运行时配置等的各种选项。花点时间探索一下可用的菜单选项。\n\
    \   - **工具栏**：工具栏位于菜单栏正下方。它提供了常用操作的快速访问，例如运行、插入新单元格和更改单元格类型。\n   - **代码单元格**：Colab\
    \ 界面的主要区域由代码单元格组成。这些单元格允许你编写和执行 Python 代码。默认情况下，新笔记本从一个代码单元格开始。你可以根据需要添加更多单元格。\n\
    \   - **文本单元格（Markdown 单元格）**：除了代码单元格，Colab 还支持文本单元格，也称为 Markdown 单元格。文本单元格允许你向笔记本中添加解释性文本、标题、项目符号和其他格式化内容。它们有助于为你的代码提供文档、解释和上下文。\n\
    \n5. **创建新笔记本**：要创建一个新的 Colaboratory 笔记本，请点击右上角或右下角的 **新建笔记本** 按钮，如图 2-2 所示。\n\
    \n6. **选择运行时类型**：创建新笔记本时，你需要指定运行时类型。选择 **Python 3** 以便在 Colaboratory 中使用 Python。\n\
    \n7. **开始编码**：现在你已经准备好开始用 Python 编码了。你可以通过点击左上角写着“Untitled1.ipynb”的位置来更改笔记本的名称（图\
    \ 2-3）。点击笔记本中的第一个代码单元格以选中它。在代码单元格中输入一个简单的 Python 语句，例如 `print(\"Hello, Colab!\"\
    )`。按 `Shift+Enter` 执行代码。代码的输出将出现在单元格下方。\n\n## 动手实践示例\n\n通过点击 **+ 文本** 按钮，在笔记本中插入文本来描述代码。\n\
    \n![](img/606032_1_En_2_Fig4_HTML.jpg)\n\n一张浏览器窗口的截图。页面标题是“Practical_lab_1.ipynb”。浏览器窗口分为两部分：左侧边栏和主区域。\n\
    \n**图 2-4** 在笔记本中插入文本\n\n执行两个数的求和。\n\n![](img/606032_1_En_2_Fig5_HTML.jpg)\n\n\
    一张名为“practical_lab_1.ipynb”的笔记本截图，显示了用于测试算术运算的 5 行文本。\n\n**图 2-5** 算术示例\n\n从上图可以看出，`a\
    \ = 2`，`b = 3`，并且 `sum = a + b`，输出结果为 `5`。\n\n以下是一个 Python 示例，演示如何使用 `random`\
    \ 库生成随机数，并使用 Matplotlib 可视化数据。\n\n![](img/606032_1_En_2_Fig6_HTML.jpg)\n\n一张名为“practical_lab_1.ipynb”的笔记本截图，展示了一段用于数据科学示例的代码片段，该示例通过生成随机数来创建数据并可视化数据。\n\
    \n**图 2-6** 数据科学示例\n\n以下代码演示了如何使用 Python 库 `random` 和 `matplotlib.pyplot` 生成随机数、创建直方图并可视化数据：\n\
    \n```\nimport random\nimport matplotlib.pyplot as plt\n# 生成 100 个介于 0 和 100 之间的随机数\n\
    random_numbers = [random.randint(0,100) for i in range(100)]\n# 将数据绘制为直方图\nplt.hist(random_numbers,\
    \ bins=10)\nplt.xlabel('数值')\nplt.ylabel('频率')\nplt.title('随机数分布')\nplt.show()\n\
    ```\n\n以下是代码的详细说明：\n\n- **`import random` 和 `import matplotlib.pyplot as plt`**：这两行导入了生成随机数和使用\
    \ Matplotlib 创建可视化所需的库。\n- **`random_numbers = [random.randint(0,100) for i in\
    \ range(100)]`**：这行代码生成一个名为 `random_numbers` 的列表，其中包含 100 个介于 0 和 100 之间的随机整数。`random`\
    \ 库中的 `random.randint()` 函数在列表推导式中用于生成这些随机数。\n- **`plt.hist(random_numbers, bins=10)`**：这行代码使用\
    \ `matplotlib.pyplot` 中的 `hist()` 函数创建一个直方图。它以 `random_numbers` 列表作为输入，并指定直方图的组数（10\
    \ 组）。`hist()` 函数计算每个组内值的频率并绘制直方图。\n- **`plt.xlabel('数值')`、`plt.ylabel('频率')`、`plt.title('随机数分布')`**：这些行分别设置\
    \ x 轴和 y 轴的标签以及图的标题。\n- **`plt.show()`**：这行代码在屏幕上显示图形。调用 `matplotlib.pyplot` 中的\
    \ `show()` 函数来渲染直方图。\n\n通过在 Colaboratory 笔记本或 Python 环境中执行此代码，你将看到一个类似图 2-7 的直方图可视化，它展示了随机生成数的分布。x\
    \ 轴表示数值范围（0–100），y 轴表示数据集中每个数值的频率。\n\n![](img/606032_1_En_2_Fig7_HTML.jpg)\n\n\
    一张随机数分布图，包含一个频率从 0 到 12 的垂直轴，以及一个数值从 0 到 100 的水平轴。图形呈现出波动趋势。\n\n**图 2-7** 输出随机数分布\n\
    \n此示例展示了 Python 以及 `random` 和 Matplotlib 等库生成和可视化数据的能力，提供了关于如何使用随机数和直方图的基本理解。\n\
    \n## 导入库\n\n以下是将库导入笔记本的示例代码。如果库尚未安装，请使用 `!pip install` 命令后跟库名进行安装：\n\n```\n# 导入\
    \ Pandas 库\nimport pandas as pd\n# 导入 Numpy 库\nimport numpy as np\n# 导入 Matplotlib\
    \ 库\nimport matplotlib.pyplot as plt\n# 导入 Seaborn 库\nimport seaborn as sns\n\
    ```\n\n此示例中导入了 Pandas、Numpy、Matplotlib 和 Seaborn 库。`import` 语句用于导入库，`as` 关键字用于为库指定别名以便于访问。例如，Pandas\
    \ 被赋予别名 `pd`，Numpy 被赋予别名 `np`。这允许你使用更短、更易输入的别名来访问库的函数和方法。你可以在 Colaboratory 笔记本中运行此代码，并在代码中使用导入的库。\n"
- fmt: '# Working with Data


    Colaboratory integrates with Google Drive and Google Cloud Storage, allowing you
    to easily import and work with data from those services.


    You can store or access data stored in Google Drive from Colaboratory by using
    the `google.colab` library. For example, to mount your Google Drive to Colaboratory,
    you can run the following code:


    ```

    from google.colab import drive

    drive.mount(''/content/drive'')

    ```


    Once you execute the code, a prompt will appear, asking you to sign into your
    Google account and grant Colaboratory the necessary permissions to access your
    Google Drive.


    Once you’ve authorized Colaboratory, you can access your Google Drive data by
    navigating to `/content/drive` in the Colaboratory file explorer.


    To write data to Google Drive, you can use Python’s built-in `open` function.
    For example, to write a Pandas DataFrame to a CSV file in Google Drive, you can
    use the following code:


    ```

    import pandas as pd

    df = pd.DataFrame({''A'': [1, 2, 3], ''B'': [4, 5, 6]})

    df.to_csv(''/content/drive/My Drive/Colab Notebooks/data.csv'', index=False)

    ```


    This code creates a new CSV file in the `My Drive/Colab Notebooks/` folder in
    Google Drive with the data from the Pandas DataFrame.


    Note that you can also use other libraries, such as `gspread` to write data to
    Google Sheets or `google.cloud` to write data to other GCP services. The approach
    you select will vary based on the desired data format and destination for writing.


    You can use the data in your Google Drive just as you would any other data in
    Colaboratory. For example, you can read a CSV file stored in Google Drive and
    load it into a Pandas DataFrame using the following code:


    ```

    import pandas as pd

    df = pd.read_csv(''/content/drive/My Drive/Colab Notebooks/data.csv'')

    ```


    ![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig8_HTML.jpg)


    A screenshot of a notebook named `practicle lab 1.ipynb` exhibits snippets of
    codes for writing data on the drive and reading data from the drive.


    **Figure 2-8** Screenshot of Python on Colab


    # Visualize Data


    To visualize data in Colaboratory, you can use libraries such as Matplotlib or
    Seaborn to create plots and charts.


    Create a data frame in Python using the Pandas library with the following code:


    ```

    import pandas as pd

    import numpy as np

    df = pd.DataFrame({''age'': np.random.randint(20, 80, 100),

    ''weight'': np.random.randint(50, 100, 100)})

    ```


    This will create a data frame with 100 rows and 2 columns named “age” and “weight”,
    populated with random integer values between 20 and 80 for age and 50 and 100
    for weight.


    Visualize the data in the Pandas data frame using the Matplotlib library in Python.
    Here’s an example to plot a scatter plot of the age and weight columns:


    ```

    import matplotlib.pyplot as plt

    plt.scatter(df[''age''], df[''weight''])

    plt.xlabel(''Age'')

    plt.ylabel(''Weight'')

    plt.show()

    ```


    The provided code is using the Matplotlib library in Python to create a scatter
    plot. Let’s go through the code line by line:


    *   `import matplotlib.pyplot as plt`: This line imports the Matplotlib library,
    specifically the `pyplot` module. The `plt` is an alias or shorthand that allows
    us to refer to the module when calling its functions.


    *   `plt.scatter(df[''age''], df[''weight''])`: This line creates a scatter plot
    using the `scatter()` function from Matplotlib. It takes two arguments: `df[''age'']`
    and `df[''weight'']`. Assuming that `df` is a Pandas DataFrame, this code is plotting
    the values from the “age” column on the x-axis and the values from the “weight”
    column on the y-axis.


    *   `plt.xlabel(''Age'')`: This line sets the label for the x-axis of the scatter
    plot. In this case, the label is set to “Age.”


    *   `plt.ylabel(''Weight'')`: This line sets the label for the y-axis of the scatter
    plot. Here, the label is set to “Weight.”


    *   `plt.show()`: This line displays the scatter plot on the screen. It is necessary
    to include this line in order to see the plot rendered in a separate window or
    within the Jupyter notebook.


    This will create a scatter plot with the age values on the x-axis and weight values
    on the y-axis. You can also use other types of plots, like histograms, line plots,
    bar plots, etc., to visualize the data in a Pandas data frame.


    ![](images/606032_1_En_2_Chapter/606032_1_En_2_Fig9_HTML.jpg)


    A scatterplot for weight versus age plots several scattered dots.


    **Figure 2-9** Resultant graph age-weight distribution'
