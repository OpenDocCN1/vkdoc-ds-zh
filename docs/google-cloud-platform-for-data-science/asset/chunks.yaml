- fmt: '# TensorFlow


    `TensorFlow` is a popular open source software library used for building and training
    machine learning models. Originating from the Google Brain team in 2015, it has
    evolved into one of the most extensively employed machine learning libraries globally
    (Ahmed, 2023).


    The library provides various tools and functionality for building and training
    multiple types of machine learning models, including neural networks, decision
    trees, and linear regression models. Furthermore, it encompasses an extensive
    array of pre-built model architectures and training algorithms, simplifying the
    process for developers to construct and train their machine learning models.


    A prominent attribute of `TensorFlow` is its capability to efficiently handle
    extensive datasets and facilitate distributed training across numerous devices
    or clusters. This allows developers to build and train more complex models that
    can handle larger amounts of data and produce more accurate results.


    `TensorFlow`’s versatility and compatibility with various platforms and programming
    languages, such as `Python`, `C++`, and `Java`, contribute to its noteworthy reputation.
    This makes it easy to integrate `TensorFlow` models into a variety of applications
    and workflows.


    In summary, `TensorFlow` stands as a robust tool for constructing and training
    machine learning models, encompassing a broad spectrum of features and functionalities
    that have solidified its status as a favored choice among developers and data
    scientists.


    Here is a simple `TensorFlow` tutorial that you can run on `Colab`.


    In this tutorial, we will build a simple `TensorFlow` model to classify images
    from the `MNIST` dataset.


    **Step 1: Set up the environment.**


    The first step is to set up the environment on `Colab`. We will install `TensorFlow
    2.0` and import the necessary libraries:


    ```

    !pip install tensorflow==2.0.0-alpha0

    import tensorflow as tf

    from tensorflow import keras

    ```


    **Step 2: Load and preprocess data.**


    Next, we will load and preprocess the data. We will use the `MNIST` dataset, which
    contains 60,000 training images and 10,000 test images of handwritten digits (Reis,
    2016). The following code loads the `MNIST` dataset and preprocesses it by scaling
    the pixel values between 0 and 1 and converting the labels to one-hot encoding:


    ```

    (x_train, y_train), (x_test, y_test) = keras.datasets.mnist.load_data()

    x_train = x_train.astype(''float32'') / 255.0

    x_test = x_test.astype(''float32'') / 255.0

    y_train = keras.utils.to_categorical(y_train)

    y_test = keras.utils.to_categorical(y_test)

    ```


    **Step 3: Build the model.**


    Now, we will build our model using `TensorFlow`’s `Keras` API. We will use a simple
    neural network with two hidden layers. The following code defines a simple neural
    network with two hidden layers using the `Keras` API. The model consists of a
    `Flatten` layer that flattens the input image into a vector, followed by two dense
    layers with `ReLU` activation, and a final dense layer with `softmax` activation
    that produces the output probabilities:


    ```

    model = keras.Sequential([

    keras.layers.Flatten(input_shape=(28, 28)),

    keras.layers.Dense(128, activation=''relu''),

    keras.layers.Dense(10, activation=''softmax'')

    ])

    ```


    **Step 4: Train the model.**


    Next, we will train the model on the training data using the `compile` and `fit`
    methods. The following code compiles the model with the `Adam` optimizer and categorical
    cross-entropy loss function and trains it on the training data for five epochs
    with a batch size of 32:


    ```

    model.compile(optimizer=''adam'',

    loss=''categorical_crossentropy'',

    metrics=[''accuracy''])

    model.fit(x_train, y_train, epochs=5, batch_size=32)

    ```


    **Step 5: Evaluate the model.**


    Finally, we will evaluate the model on the test data and print the accuracy:


    ```

    test_loss, test_acc = model.evaluate(x_test, y_test)

    print(''Test accuracy:'', test_acc)

    ```


    That’s it! You have successfully built and trained a `TensorFlow` model on `Colab`.


    To run this tutorial on `Colab`, simply create a new notebook and copy-paste the
    code into it. Make sure to select a GPU runtime for faster training.


    # Summary


    In this chapter, we delved into the world of big data and machine learning, exploring
    several Google Cloud services and tools.


    We started with an introduction to `BigQuery`, a fully managed data warehouse
    solution that enables storing and querying massive datasets. We discussed its
    use cases and how it facilitates large-scale data analytics. We have implemented
    it using `Sandbox`, which is free to use.


    Next, we explored `BigQuery ML`, a feature of `BigQuery` that allows us to build
    machine learning models directly within the `BigQuery` environment. We learned
    how to create and deploy models using `SQL` queries, simplifying the machine learning
    process.


    Moving on, we were introduced to Google Cloud AI Platform, a comprehensive platform
    offering a range of machine learning tools and services. We discovered its capabilities
    for training and deploying machine learning models, providing us with a scalable
    and flexible infrastructure.


    We then focused on `Vertex AI`, a powerful machine learning platform that offers
    a unified interface for training and deploying models. We discussed the benefits
    of using `Vertex AI`, such as effectively managing and scaling machine learning
    workflows.


    Additionally, we explored Google Cloud `Dataproc`, a managed `Spark` and `Hadoop`
    service designed for big data processing. We learned about its use cases and how
    it simplifies the deployment and management of big data processing clusters.


    Finally, we delved into `TensorFlow`, a popular open source machine learning framework.
    We gained an understanding of its basics and its capabilities for building and
    training machine learning models.


    Throughout the chapter, we learned about the different tools and services available
    on Google Cloud for working with big data and machine learning. This knowledge
    equips us with the necessary skills to effectively leverage these tools in our
    big data and machine learning projects.'
