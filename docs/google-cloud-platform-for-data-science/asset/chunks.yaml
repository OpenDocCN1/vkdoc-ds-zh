- fmt: "### 4. **Create the bucket**: The code then creates a new Google Cloud Storage\
    \ bucket for the Vertex AI platform to store its data. A default name is provided,\
    \ but the timestamp is used to make the name unique, in case the default name\
    \ has already been taken. The code to create the bucket is as follows:\n\n```\n\
    bucket_name = \"bucket-name-placeholder\"  # @param {type:\"string\"}\nbucket_uri\
    \ = f\"gs://{bucket_name}\"\nfrom datetime import datetime\ntimestamp = datetime.now().strftime(\"\
    %Y%m%d%H%M%S\")\nif bucket_name == \"\" or bucket_name is None or bucket_name\
    \ == \"bucket-name-placeholder\":\n    bucket_name = project_id + \"aip-\" + timestamp\n\
    \    bucket_uri = \"gs://\" + bucket_name\nfrom google.cloud import storage\n\
    client = storage.Client(project=project_id)\n# Create a bucket\nbucket = client.create_bucket(bucket_name,\
    \ location=region)\nprint(\"Bucket {} created.\".format(bucket.name))\n```\n\n\
    Here, the `bucket_name` and `bucket_uri` are defined, and the timestamp is used\
    \ to create a unique name for the bucket. Then, a Google Cloud Storage client\
    \ is created using the project ID, and the new bucket is created using the client\
    \ and the specified name and region.\n\n### Initialize the Vertex AI SDK for Python.\n\
    \nThe following code initializes the Vertex AI SDK, which provides access to the\
    \ Vertex AI platform and its capabilities:\n\n```\nfrom google.cloud import aiplatform\n\
    # Initialize the Vertex AI SDK\naiplatform.init(project=project_id, location=region,\
    \ staging_bucket=bucket_uri)\n```\n\nThe first line imports the `aiplatform` module\
    \ from the `google.cloud` library, which provides access to the Vertex AI API.\n\
    \nThe `aiplatform.init` method is then called with three arguments: `project`,\
    \ `location`, and `staging_bucket`. The `project` argument is the ID of the Google\
    \ Cloud project from which the Vertex AI platform will be accessed. The `location`\
    \ argument is the geographic location where the Vertex AI platform resources will\
    \ be created. The `staging_bucket` argument is the URI of the Google Cloud Storage\
    \ bucket that will be used to store intermediate data during model training and\
    \ deployment.\n\nThis code sets up the connection to the Vertex AI platform and\
    \ prepares it for use in your application.\n\n### Initialize BigQuery.\n\nThe\
    \ following code sets up a BigQuery client to access the BigQuery data storage\
    \ and analysis service in the specified project:\n\n```\nfrom google.cloud import\
    \ bigquery\n# Set up BigQuery client\nbq_client = bigquery.Client(project=project_id)\n\
    ```\n\nThe first line imports the `bigquery` module from the `google.cloud` library,\
    \ which provides access to the BigQuery API.\n\nThe `bq_client` variable is then\
    \ defined as an instance of the `bigquery.Client` class, using the `project_id`\
    \ variable as an argument. This creates a client object that is used to interact\
    \ with the BigQuery API for the specified project.\n\nThe provided code establishes\
    \ the BigQuery client, enabling access and manipulation of data stored in BigQuery.\
    \ It grants the ability to execute queries, perform data analysis operations,\
    \ and undertake various tasks associated with data management within the BigQuery\
    \ environment.\n\n### Create a Vertex AI tabular dataset.\n\nThe following code\
    \ is pre-processing a dataset from BigQuery. It starts by retrieving a table from\
    \ the BigQuery source dataset (`BQ_SOURCE`), which is `\"bigquery-public-data.ml_datasets.penguins\"\
    `. The data is then loaded into a Pandas DataFrame (`df`).\n\nNext, the code replaces\
    \ any values in the dataset that match the values defined in the `NA_VALUES` list\
    \ (`\"NA\"`, `\".\"`) with `NaN` and drops any rows with `NaN` values. This step\
    \ is done to clean the data and remove unusable rows.\n\nThe next step involves\
    \ converting categorical columns to numeric values. For each of the three categorical\
    \ columns (`island`, `species`, and `sex`), the code uses the Pandas method `factorize`\
    \ to convert the strings in these columns to integers. The `factorize` method\
    \ returns a new series and an array of unique values for each column.\n\nThe data\
    \ is then split into two separate data frames: `df_train` and `df_for_prediction`.\
    \ `df_train` contains 80% of the data and is used for training purposes, while\
    \ `df_for_prediction` contains the remaining 20% of the data and is used for predictions.\n\
    \nFinally, the code creates a dictionary for each of the three columns that maps\
    \ the numeric values back to their string representations. These dictionaries\
    \ are `index_to_island`, `index_to_species`, and `index_to_sex`. The dictionaries\
    \ are then printed to verify their values:\n\n```\nimport numpy as np\nimport\
    \ pandas as pd\nLABEL_COLUMN = \"species\"\n# Define the BigQuery source dataset\n\
    BQ_SOURCE = \"bigquery-public-data.ml_datasets.penguins\"\n# Define NA values\n\
    NA_VALUES = [\"NA\", \".\"]\n# Download a table\ntable = bq_client.get_table(BQ_SOURCE)\n\
    df = bq_client.list_rows(table).to_dataframe()\n# Drop unusable rows\ndf = df.replace(to_replace=NA_VALUES,\
    \ value=np.NaN).dropna()\n# Convert categorical columns to numeric\ndf[\"island\"\
    ], island_values = pd.factorize(df[\"island\"])\ndf[\"species\"], species_values\
    \ = pd.factorize(df[\"species\"])\ndf[\"sex\"], sex_values = pd.factorize(df[\"\
    sex\"])\n# Split into a training and holdout dataset\ndf_train = df.sample(frac=0.8,\
    \ random_state=100)\ndf_for_prediction = df[~df.index.isin(df_train.index)]\n\
    # Map numeric values to string values\nindex_to_island = dict(enumerate(island_values))\n\
    index_to_species = dict(enumerate(species_values))\nindex_to_sex = dict(enumerate(sex_values))\n\
    # View the mapped island, species, and sex data\nprint(index_to_island)\nprint(index_to_species)\n\
    print(index_to_sex)\n```\n\n### Create a BigQuery dataset.\n\nIn the following\
    \ code snippet:\n\n1.  The line `bq_dataset_id = f\"{project_id}.dataset_id_unique\"\
    ` creates a string representing the BigQuery dataset ID by concatenating the `project_id`\
    \ variable and a string `\".dataset_id_unique\"`.\n2.  The line `bq_dataset =\
    \ bigquery.Dataset(bq_dataset_id)` creates a BigQuery dataset object using the\
    \ dataset ID string.\n3.  The line `bq_client.create_dataset(bq_dataset, exists_ok=True)`\
    \ creates the dataset on BigQuery using the BigQuery client `bq_client`. The `exists_ok`\
    \ argument is set to `True`, which means that if a dataset with the same ID already\
    \ exists, the method will not raise an error; instead, it will continue executing\
    \ the code:\n\n```\n# Create a BigQuery dataset\nbq_dataset_id = f\"{project_id}.dataset_id_unique\"\
    \nbq_dataset = bigquery.Dataset(bq_dataset_id)\nbq_client.create_dataset(bq_dataset,\
    \ exists_ok=True)\n```\n\n### Create a Vertex AI tabular dataset\n\nThe following\
    \ code creates a Vertex AI tabular dataset using the `df_train` Pandas DataFrame.\
    \ The data in the `df_train` DataFrame will be used to create the tabular dataset.\
    \ The dataset will be stored in a BigQuery table with the identifier `\"bq://{bq_dataset_id}.table-unique\"\
    `, and its display name will be `\"sample-penguins\"`.\n\nThe `aiplatform.TabularDataset.create_from_dataframe`\
    \ method is used to create the tabular dataset from the `df_train` DataFrame.\
    \ The method takes in three arguments:\n\n- `df_source`: The Pandas DataFrame\
    \ contains the data to be used to create the tabular dataset.\n- `staging_path`:\
    \ The path to the BigQuery table where the data will be stored.\n- `display_name`:\
    \ The display name for the tabular dataset.\n\nThe `bq_dataset_id` variable is\
    \ used to create the identifier for the BigQuery dataset. The identifier is a\
    \ string in the format `\"{project_id}.dataset_id_unique\"`. The `bigquery.Dataset`\
    \ class is used to create a BigQuery dataset object, and the `bq_client.create_dataset`\
    \ method is used to create the dataset in BigQuery with the `bq_dataset` object.\
    \ The `exists_ok=True` argument is passed to the `bq_client.create_dataset` method\
    \ to indicate that if the dataset already exists, it should not raise an error,\
    \ but instead just return the existing dataset."
