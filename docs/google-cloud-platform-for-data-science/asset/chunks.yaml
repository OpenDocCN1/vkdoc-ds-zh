    - 接下来的两行 `EPOCHS` 和 `BATCH_SIZE` 指定了训练过程中要使用的轮数和批次大小。\n- `CMDARGS` 变量是一个列表，包含将传递给训练脚本的命令行参数。本例中传递了三个命令行参数：\n\
    \  1. `\"--label_column=\" + LABEL_COLUMN`：指定包含标签数据的列名。该参数的值取自 `LABEL_COLUMN`\
    \ 变量。\n  2. `\"--epochs=\" + str(EPOCHS)`：设置训练过程中要使用的轮数。该值取自 `EPOCHS` 变量。\n  3.\
    \ `\"--batch_size=\" + str(BATCH_SIZE)`：设置训练过程中要使用的批次大小。该值取自 `BATCH_SIZE` 变量。\n\
    \n```\nJOB_NAME = \"custom_job_unique\"\nEPOCHS = 20\nBATCH_SIZE = 10\nCMDARGS\
    \ = [\n\"--label_column=\" + LABEL_COLUMN,\n\"--epochs=\" + str(EPOCHS),\n\"--batch_size=\"\
    \ + str(BATCH_SIZE),\n]\n```\n\n**训练并部署模型。**\n\n以下代码在 Google Cloud AI Platform\
    \ 上创建了一个自定义训练任务——使用 `aiplatform.CustomTrainingJob` 类来指定训练任务的详细信息。\n\n该训练任务包含以下参数：\n\
    \n- `display_name`：一个字符串，指定训练任务的名称。本例中，值为 `\"custom_job_unique\"`。\n- `script_path`：一个字符串，指定包含训练代码的脚本路径。本例中，值为\
    \ `\"task.py\"`。\n- `container_uri`：一个字符串，指定用于训练的 Docker 容器镜像。本例中，值为 `\"us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-8:latest\"\
    `，这是一个版本为 2.8 的 TensorFlow CPU 镜像。\n- `requirements`：一个字符串列表，指定训练所需的 Python 包。本例中，列表包含两个包：`\"\
    google-cloud-bigquery>=2.20.0\"` 和 `\"db-dtypes\"`。\n- `model_serving_container_image_uri`：一个字符串，指定训练后用于提供模型服务的\
    \ Docker 容器镜像。本例中，值为 `\"us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest\"\
    `，这是一个用于服务的版本为 2.8 的 TensorFlow CPU 镜像。\n\n代码执行后，`job` 变量将包含 `CustomTrainingJob`\
    \ 的实例：\n\n```\njob = aiplatform.CustomTrainingJob(\ndisplay_name=JOB_NAME,\nscript_path=\"\
    task.py\",\ncontainer_uri=\"us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-8:latest\"\
    ,\nrequirements=[\"google-cloud-bigquery>=2.20.0\", \"db-dtypes\"],\nmodel_serving_container_image_uri=\"\
    us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest\",\n)\n```\n\n在以下代码片段中，`MODEL_DISPLAY_NAME`\
    \ 变量被定义为 `\"penguins_model_unique\"`。此字符串用作训练过程中将创建的 AI Platform 模型的显示名称。\n\n\
    然后，代码调用了 `job` 对象上的 `run` 方法，该对象代表 AI Platform 中的一个自定义训练任务。`run` 方法用于启动训练过程。\n\
    \n传递给 `run` 方法的参数如下：\n\n- `dataset`：一个 BigQuery 数据集对象，代表用于训练的数据。\n- `model_display_name`：一个字符串，代表训练期间将创建的\
    \ AI Platform 模型的显示名称。此字符串被赋值为 `MODEL_DISPLAY_NAME` 变量的值。\n- `bigquery_destination`：一个字符串，代表在\
    \ BigQuery 中存储 AI Platform 模型的目标位置。目标位置指定为 BigQuery URI，并使用 `project_id` 变量来构建该\
    \ URI。\n- `args`：一个字符串列表，代表要传递给自定义训练脚本的命令行参数。此参数的值被赋值为 `CMDARGS` 变量的值，该变量是一个字符串列表，定义了要使用的标签列、训练轮数和批次大小。\n\
    \n```\nMODEL_DISPLAY_NAME = \"penguins_model_unique\"\n# 启动训练并创建模型\nmodel = job.run(\n\
    dataset=dataset,\nmodel_display_name=MODEL_DISPLAY_NAME,\nbigquery_destination=f\"\
    bq://{project_id}\",\nargs=CMDARGS,\n)\n```\n\n等待直到你看到输出 `CustomTrainingJob run\
    \ completed`。\n\n以下代码定义了一个变量 `DEPLOYED_NAME`，它被赋值为字符串 `\"penguins_deployed_unique\"\
    `。这是已部署模型的显示名称。\n\n然后，代码调用了 `model` 对象上的 `deploy` 方法，并将已部署模型的显示名称作为参数传递。`deploy`\
    \ 方法创建一个端点，用于基于训练好的模型提供预测。该端点以显示名称 `DEPLOYED_NAME` 保存，并作为 `endpoint` 变量返回：\n\n\
    ```\nDEPLOYED_NAME = \"penguins_deployed_unique\"\nendpoint = model.deploy(deployed_model_display_name=DEPLOYED_NAME)\n\
    ```\n\n**进行预测。**\n\n**准备预测测试数据**：以下代码从数据框 `df_for_prediction` 中移除了 `\"species\"\
    ` 列。这可能是因为物种列是模型训练要预测的标签或目标列。使用训练好的模型进行预测时不需要物种列。\n\n接下来，代码将数据框 `df_for_prediction`\
    \ 转换为 Python 列表 `test_data_list`。这可能是为了准备数据以使用部署的模型进行预测。使用数据框的 `values` 属性将数据框转换为\
    \ Numpy 数组，然后使用 `tolist()` 方法将 Numpy 数组转换为列表：\n\n```\n# 移除物种列\ndf_for_prediction.pop(LABEL_COLUMN)\n\
    # 将数据转换为 Python 列表\ntest_data_list = df_for_prediction.values.tolist()\n```\n\n\
    **发送预测请求：** 最后，代码通过调用 `endpoint` 上的 `predict()` 方法并将 `test_data_list` 作为 `instances`\
    \ 的参数传递来进行预测。预测结果存储在 `predictions` 变量中，可以通过调用 `predictions.predictions` 来访问：\n\
    \n```\n# 获取预测结果。\npredictions = endpoint.predict(instances=test_data_list)\n#\
    \ 查看预测结果\npredictions.predictions\n```\n\n输出应如下所示：\n\n```\n[[0.323929906, 0.0947248116,\
    \ 0.58134526],\n[0.300531268, 0.0670630634, 0.632405639],\n[0.349939913, 0.146268025,\
    \ 0.503792107],\n```\n"
- fmt: '以下代码使用`Numpy`的`argmax`方法为每组输入数据找到最佳预测。`predictions.predictions`是一个`Numpy`数组，包含每个实例（即每一行）输入数据的预测类别概率。`np.argmax(predictions.predictions,
    axis=1)`返回沿指定轴（此处`axis=1`表示沿每一行）最高值的索引，从而有效地为每个实例提供预测类别。结果数组`species_predictions`表示基于输入数据的企鹅物种最佳预测：


    ```

    # Get the prediction for each set of input data.

    species_predictions = np.argmax(predictions.predictions, axis=1)

    # View the best prediction for the penguin characteristics in each row.

    species_predictions

    ```


    输出应如下所示：


    ```

    array([2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,

    2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,

    2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,

    2])

    ```


    **清理资源。**


    您可以删除项目，这将释放与其关联的所有资源（您可以使用`Google Cloud Console`关闭项目），或者您可以在保留项目的同时使用以下步骤：


    1.  转到`Google Cloud Console`。

    2.  单击您用于创建资源的项目。

    3.  单击导航菜单并转到`AI Platform`。

    4.  在`AI Platform`下，选择`Custom Training Jobs`。

    5.  单击您创建并想要删除的自定义训练作业的名称。

    6.  在作业详情页面上，单击`Delete`按钮。在提示时确认删除。

    7.  转到导航菜单中的`AI Platform`并选择`Models`。

    8.  选择您要移除的模型名称，并单击它。

    9.  在模型详情页面上，单击`Delete`按钮。在提示时确认删除。

    10. 转到导航菜单中的`BigQuery`。

    11. 单击您为此项目创建并想要删除的数据集名称。

    12. 单击右上角的三个点并选择`Delete Dataset`。在提示时确认删除。


    对于本教程，您还可以使用以下代码删除资源：


    ```

    Import os

    # Delete the training job

    job.delete()

    # Delete the endpoint and undeploy the model from it

    endpoint.delete(force=True)

    # Delete the model

    model.delete()

    # Delete the storage bucket and its contents

    Bucket.delete(force=True)

    ```


    注意


    请确保删除与项目关联的所有资源，因为`Google Cloud`会对其资源的使用收费。


    ## Google Cloud Dataproc 及其在大数据处理中的用例简介


    `Google Cloud Dataproc`是一项托管云服务，允许您轻松创建和管理`Hadoop`和`Spark`集群。使用`Dataproc`，您可以快速启动预装了`Hadoop`、`Spark`和其他大数据框架的虚拟机集群。这种能力使得能够以可扩展的方式高效且经济地处理大量数据。


    `Dataproc`与其他`Google Cloud Platform`服务（如`Cloud Storage`、`BigQuery`和`Cloud Pub/Sub`）集成，使得可以轻松地将数据导入和导出到您的集群。它还包括用于监控和管理集群的工具，例如`Stackdriver`日志记录和监控以及`Cloud
    Dataproc Workflow Templates`。


    `Dataproc`的关键优势之一是其灵活性。您可以灵活地自定义集群的大小和配置，以符合您的特定工作负载要求。付费结构基于资源使用情况，确保您只需为实际使用的资源付费。


    `Dataproc`还支持自定义镜像，允许您将自己的软件和配置带到集群中。


    以下是`Google Cloud Dataproc`的一些用例：


    1.  **ETL处理**：`Dataproc`可用于从各种来源（包括日志文件、社交媒体和物联网设备）提取、转换和加载（ETL）数据。

    2.  **机器学习**：`Dataproc`可用于使用`TensorFlow`、`PyTorch`和`scikit-learn`等流行工具在大型数据集上训练机器学习模型。

    3.  **数据仓库**：`Dataproc`可用于在`Google Cloud Storage`或其他云存储服务之上构建数据仓库，允许您存储、分析和查询大量数据。

    4.  **实时数据处理**：`Dataproc`可用于使用`Apache Kafka`、`Apache Flink`和`Apache Beam`等工具实时处理流数据。

    5.  **商业智能**：`Dataproc`能够构建商业智能仪表板和生成报告，使您能够从数据中提取有价值的见解并做出明智的决策。


    总体而言，`Google Cloud Dataproc`是一种用于在云中处理大数据的多功能且可扩展的工具，可用于广泛的行业和应用，包括金融、零售、医疗保健等。'
