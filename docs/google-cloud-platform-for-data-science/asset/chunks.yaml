    SELECT *

    FROM ML.PREDICT(MODEL `example_data.data_set_class_rand_model`, (

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ))

    ```


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig15_HTML.jpg)


    A screenshot of a page displays the workspace that runs the query to predict the
    model and lists the query results with personal and project histories.


    Figure 3-15


    Prediction


    This is a high-level overview of using BigQuery ML to create a classification
    model using the BigQuery Editor. For a more detailed explanation of the different
    functions and options, please refer to the BigQuery ML documentation.'
  trans: '

    # BigQuery ML


    `BigQuery ML` 是 Google Cloud 的 `BigQuery` 中的一项功能，它允许您直接在 `BigQuery` 内构建机器学习模型，而无需将数据移出
    `BigQuery`。这意味着您可以使用 `BigQuery ML` 对存储在 `BigQuery` 中的大型数据集进行机器学习模型训练。


    `BigQuery ML` 支持多种类型的机器学习模型，包括线性回归、逻辑回归、K-Means 聚类和矩阵分解。您可以使用 `BigQuery` 中的 SQL
    语法来创建和评估您的机器学习模型，这使得已经熟悉 SQL 的数据分析师和开发人员能够轻松上手。


    与需要将数据移出 `BigQuery` 的传统机器学习方法相比，使用 `BigQuery ML` 的好处包括更快的训练时间、更低的成本以及更高的准确性。此外，由于
    `BigQuery ML` 运行在 Google 的基础设施上，它可以处理非常大的数据集，因此对于拥有大量数据的组织来说是一个不错的选择。


    总的来说，`BigQuery ML` 提供了一种快速且经济高效的方式，在完全托管的环境中构建和部署机器学习模型。


    接下来，您将找到一个全面的教程，该教程将引导您完成使用 `BigQuery ML` 的每一步，以利用之前在 Colab 中创建的 `Pandas DataFrame`
    生成一个分类模型。要重新生成数据集，请在 Colab 上执行提供的代码：


    ```

    import pandas as pd

    import numpy as np

    # Generate random features

    np.random.seed(0)

    n_samples = 1000

    n_features = 5

    X = np.random.randn(n_samples, n_features)

    # Generate random target

    np.random.seed(1)

    y = np.random.randint(0, 2, n_samples)

    # Combine the features and target into a data frame

    df = pd.DataFrame(np.hstack((X, y[:, np.newaxis])), columns=["feature_1", "feature_2",
    "feature_3", "feature_4", "feature_5", "target"])

    # Save the data to a CSV file

    df.to_csv("data.csv", index=False)

    ```


    您可以在 Colab 文件中找到 `data.csv`。下载该文件并将其保存到您的计算机上。


    **创建 BigQuery 数据集：** 转到 Google Cloud 控制台，选择 `BigQuery`，然后创建一个新的 `BigQuery` 数据集。


    **将数据上传到 BigQuery：** 转到 `BigQuery 编辑器` 并创建一个新表。然后，通过点击“创建表”并选择“上传”来将数据上传到此表。选择包含数据的文件，并为列选择适当的选项。


    ![](img/606032_1_En_3_Fig8_HTML.png)


    一张截图显示了“创建表”下的选项。它列出了“来源”和“目标”下的字段，并带有“创建表”按钮。


    图 3-8


    在 BigQuery 上创建表


    ![](img/606032_1_En_3_Fig9_HTML.png)


    一张截图显示了“创建数据集”下的选项。它列出了“项目 ID”、“位置类型”和“默认表过期时间”下的字段，并带有“创建数据集”按钮。


    图 3-9


    在 BigQuery 上创建表——设置各种选项


    ![](img/606032_1_En_3_Fig10_HTML.jpg)


    一张截图显示了“预览”选项卡下表中已上传的数据。


    图 3-10


    表上传后，预览该表


    **创建 BigQuery ML 模型：** 在 `BigQuery 编辑器` 中，创建一个新的 SQL 查询。使用 `CREATE MODEL` 语句来创建一个
    `BigQuery ML` 模型。示例如下：


    ```

    CREATE MODEL your_model_name

    OPTIONS (model_type=''logistic_reg'', input_label_cols=[''target'']) AS

    SELECT *

    FROM your_dataset_name.your_table_name

    ```


    在上述语法中，将 `your_model_name` 和 `your_dataset_name.your_table_name` 填入（``）。对于已上传的数据集，请参考以下代码：


    ```

    CREATE MODEL `example_data.data_set_class_rand_model`

    OPTIONS (model_type=''logistic_reg'', input_label_cols=[''target'']) AS

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ```


    这里，模型名称是 `example_data.data_set_class_rand_model`，表名称是 `practice-project-1-377008.example_data.data_set_class_rand`。要查找表名称，请点击该表并转到“详细信息”选项。将出现以下屏幕。找到“表
    ID”并复制它，然后将其粘贴到占位符 `your_dataset_name.your_table_name` 中。


    ![](img/606032_1_En_3_Fig11_HTML.png)


    一张沙盒页面的截图显示了已创建表的“详细信息”选项卡下的表信息。


    图 3-11


    查找表名称


    现在，您的编辑器应该看起来像这样。如果一切正常，您将能够在右上角找到一个绿色的勾号，如下所示。继续运行查询。


    ![](img/606032_1_En_3_Fig12_HTML.jpg)


    一张截图显示了运行查询以创建模型的工作区。它列出了查询结果以及“作业信息”下的详细信息。


    图 3-12


    BigQuery ML


    转到“结果”并点击“转到模型”。对于模型评估，可以看到以下结果。


    ![](img/606032_1_En_3_Fig13_HTML.jpg)


    一张截图显示了在“评估”选项卡下创建的聚合指标以及分数阈值。


    图 3-13


    训练后的模型评估


    **评估模型：** 在 `BigQuery 编辑器` 中，创建一个新的 SQL 查询。使用 `ML.EVALUATE` 函数来评估模型。以下是操作方法示例：


    ```

    SELECT *

    FROM ML.EVALUATE(MODEL your_model_name, (

    SELECT *

    FROM your_dataset_name.your_table_name

    ))

    ```


    在上述语法中，像之前一样填入所有详细信息，您的查询应该如下所示：


    ```

    SELECT *

    FROM ML.EVALUATE(MODEL `example_data.data_set_class_rand_model`, (

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ))

    ```


    运行查询，您将找到以下结果。


    ![](img/606032_1_En_3_Fig14_HTML.jpg)


    一张页面截图显示了运行查询以评估模型的工作区，并列出了查询结果以及个人和项目历史记录。


    图 3-14


    模型评估


    **进行预测：** 在 `BigQuery 编辑器` 中，创建一个新的 SQL 查询。使用 `ML.PREDICT` 函数进行预测。以下是操作方法示例：


    ```

    SELECT *

    FROM ML.PREDICT(MODEL your_model_name, (

    SELECT *

    FROM your_dataset_name.your_table_name

    ))

    ```


    再次像之前一样插入所有信息，您的查询应该如下所示：


    ```

    SELECT *

    FROM ML.PREDICT(MODEL `example_data.data_set_class_rand_model`, (

    SELECT *

    FROM `practice-project-1-377008.example_data.data_set_class_rand`

    ))

    ```


    ![](img/606032_1_En_3_Fig15_HTML.jpg)


    一张页面截图显示了运行查询以预测模型的工作区，并列出了查询结果以及个人和项目历史记录。


    图 3-15


    预测


    这是使用 `BigQuery ML` 通过 `BigQuery 编辑器` 创建分类模型的高级概述。有关不同功能和选项的更详细说明，请参阅 `BigQuery
    ML` 文档。

