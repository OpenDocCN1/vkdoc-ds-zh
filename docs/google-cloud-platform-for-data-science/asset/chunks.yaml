  trans: '

    # 1. GCP 简介


    在过去的几年里，数据科学的格局在组织管理数据的方式上经历了显著的变革。大数据和机器学习的兴起，使得企业需要存储、处理和分析海量数据。因此，对像 Google
    Cloud Platform (GCP) 这样的基于云的数据科学平台的需求激增。


    根据 IDC 的一份报告，全球公有云服务市场在 2021 年预计增长 18.3%，达到 3049 亿美元。GCP 在该市场中获得了显著的发展势头，成为第三大云服务提供商，市场份额为
    9.5%（IDC，2021）。这一增长可归因于 GCP 提供强大基础设施、数据分析和机器学习服务的能力。


    GCP 提供各种数据科学服务，包括数据存储、处理、分析和机器学习。它还提供用于构建和部署应用程序、管理数据库以及保护资源的工具。


    让我们看几个迁移到 GCP 并取得显著成果的商业案例：


    1.  **家得宝**：家得宝是一家领先的家居装修零售商，希望改善客户的在线搜索体验。他们将搜索引擎迁移到 GCP，搜索结果速度提升了 50%。这带来了客户满意度
    10% 的提升和在线销售额 20% 的增长（Google Cloud，*家得宝*，无日期）。


    2.  **Spotify**：流行的音乐流媒体服务 Spotify 将其数据基础设施迁移到 GCP，以应对不断增长的用户群。通过此举，Spotify 的基础设施成本降低了
    75%，并且每秒处理的用户请求更多（Google Cloud，*Spotify*，无日期）。


    3.  **尼尔森**：领先的市场研究公司尼尔森希望提高其数据处理速度和准确性。他们将数据处理迁移到 GCP，处理时间减少了 60%，从而能够更快地获得洞察并做出更好的决策（Google
    Workspace，无日期）。


    除了上述例子，其他组织也从 GCP 的数据科学服务中受益，包括可口可乐、PayPal、汇丰银行和威瑞森。


    借助 GCP，数据科学家可以专注于解决复杂的业务问题，而无需担心管理基础设施。例如，考虑一家希望分析客户行为以改进营销策略的零售公司。该公司拥有数百万客户，并从社交媒体、在线购买和调查等各种来源收集海量数据。为了分析这些数据，公司需要一个强大的、基于云的平台来高效地存储和处理数据。GCP
    可以通过提供可扩展的数据存储（`Google Cloud Storage`）、数据处理（`Google Cloud Dataflow`）和数据分析（`Google
    BigQuery`）来帮助公司实现这一目标。该公司还可以利用机器学习（`Google Cloud AI Platform`）构建能够预测客户行为的模型，并使用
    `Google Cloud AutoML` 来自动化机器学习过程。


    GCP 的数据科学服务为从事数据科学领域的个人提供了宝贵的支持。随着对数据科学家需求的持续增长，掌握像 GCP 这样的云平台的专业知识变得至关重要。根据 Glassdoor
    的数据，美国数据科学家的平均年薪为 113,309 美元。此外，Burning Glass Technologies 最近的一份报告指出，在过去一年中，明确要求具备
    GCP 技能的职位发布数量显著增加了 67%。因此，获取 GCP 知识可以为那些寻求数据科学领域就业机会的人提供显著优势。


    本章将介绍 GCP 及其数据科学产品，并引导您完成创建 GCP 账户和项目的过程。


    ## GCP 及其数据科学服务概览


    Google Cloud Platform (GCP) 的架构旨在为用户提供一个高可用、可扩展且可靠的云计算环境。它基于一个跨越多个地理区域和可用区的分布式基础设施，从而在系统故障或灾难发生时提供冗余和故障转移能力（Sukhdeve，2020）。


    在高层面上，GCP 的架构包含以下几个层次：


    1.  **基础设施层**：该层包括构成 GCP 数据中心的物理硬件和网络基础设施。它包含运行和管理云服务所需的服务器、存储设备、网络设备和其他组件。


    2.  **计算层**：该层包括运行用户应用程序和服务的虚拟机 (VM) 和容器实例。它包含诸如 `Compute Engine`、`Kubernetes
    Engine` 和 `App Engine` 等服务。


    3.  **存储层**：该层包括 GCP 提供的各种存储服务，例如 `Cloud Storage`、`Cloud SQL` 和 `Cloud Bigtable`。它为多种类型的数据提供可扩展且持久的存储选项。


    4.  **网络层**：该层包括 GCP 提供的各种网络服务，例如 `Virtual Private Cloud (VPC)`、`负载均衡` 和 `Cloud
    CDN`。它为用户的应用程序和服务提供安全可靠的网络选项。


    5.  **管理与安全层**：该层包括 GCP 提供的各种管理和安全服务，例如 `Identity and Access Management (IAM)`、`安全指挥中心`
    和 `Stackdriver`。它提供了用于管理和保护在 GCP 上运行的应用程序和服务的工具。


    通过这种方式，GCP 的架构旨在提供一个灵活且可定制的云计算环境，以满足从初创公司到大型企业的广泛用户需求。


    GCP 是一套云计算服务，运行在与 Google 为其终端用户产品（如 Google 搜索和 YouTube）相同的基础设施上（Google Cloud，2023）。


    对于数据科学，它提供了多项服务，包括：


    *   `BigQuery`：一个完全托管、无服务器的数据仓库解决方案

    *   `Cloud AI Platform`：一套机器学习工具，包括 `TensorFlow`、`scikit-learn` 和 `XGBoost`

    *   `Cloud Dataflow`：一个用于转换和分析数据的完全托管服务

    *   `Cloud DataLab`：一个用于机器学习和数据科学的交互式开发环境

    *   `Cloud Dataproc`：一个托管的 `Apache Hadoop` 和 `Apache Spark` 服务

    *   `Cloud Storage`：一个可扩展、完全托管的对象存储服务

    *   `Cloud Vision API`：一个预训练的图像分析 API


    这些服务可以组合使用，以构建完整的数据科学解决方案，从数据摄取到模型训练再到部署。教学大纲中提到的许多 GCP 数据科学服务都提供免费套餐，可以免费有限度地使用这些服务。以下是这些服务及其各自免费套餐产品的列表：


    *   `Google Colaboratory`：完全免费。

    *   `BigQuery`：每月免费处理 1 TB 数据。

    *   `Cloud AI Platform`：免费访问 `AI Platform Notebooks`，其中包括 `Colaboratory`。

    *   `Looker Studio`：完全免费。

    *   `Cloud Dataflow`：每天免费两个作业小时。

    *   `Cloud Dataprep`：每月免费试用 200 万条记录。

    *   `Cloud Storage`：每月免费 5 GB 标准存储。

    *   `Cloud SQL`：免费试用第二代实例，最高 125 MB 存储。

    *   `Cloud Pub/Sub`：免费套餐包括每月 100 万次操作。


    **注意**


    免费套餐产品可能会发生变化，超出免费套餐的使用量将产生费用。建议查看 GCP 定价页面以获取有关免费套餐产品的最新信息。


    GCP 的各种服务可以分类如下：

    '
- fmt: '1. **Compute**: This category includes services for running virtual machines
    (VMs) and containers, such as `Compute Engine`, `Kubernetes Engine`, and `App
    Engine`.


    2. **Storage**: This category includes services for storing and managing different
    types of data, such as `Cloud Storage`, `Cloud SQL`, and `Cloud Datastore`.


    3. **Networking**: This category includes services for managing networking resources,
    such as `Virtual Private Cloud (VPC)`, `Cloud Load Balancing`, and `Cloud DNS`.


    4. **Big data**: This category includes services for processing and analyzing
    large datasets, such as `BigQuery`, `Cloud Dataflow`, and `Cloud Dataproc`.


    5. **Machine learning**: This category includes services for building and deploying
    machine learning models, such as `Cloud AI Platform`, `AutoML`, and `AI Building
    Blocks`.


    6. **Security**: This category includes services for managing and securing GCP
    resources, such as `Identity and Access Management (IAM)`, `Cloud Key Management
    Service (KMS)`, and `Cloud Security Command Center`.


    7. **Management tools**: This category includes services for managing and monitoring
    GCP resources, such as `Stackdriver`, `Cloud Logging`, and `Cloud Monitoring`.


    8. **Developer tools**: This category includes services for building and deploying
    applications on GCP, such as `Cloud Build`, `Cloud Source Repositories`, and `Firebase`.


    9. **Internet of Things (IoT)**: This category includes services for managing
    and analyzing IoT data, such as `Cloud IoT Core` and `Cloud Pub/Sub`.


    ### Setting Up a GCP Account and Project


    Here are the steps to set up a Google Cloud Platform (GCP) account and project:


    - Go to the GCP website: [`https://cloud.google.com/`](https://cloud.google.com/).

    - Click the **Try it free** button.

    - Log in using your existing Google account, or create a new account if you do
    not have one.

    - Fill out the required information for your GCP account.

    - Once your account is set up, click the **Console** button to access the GCP
    Console.

    - In the GCP Console, click the **Projects** drop-down menu in the top navigation
    bar.

    - Click the **New Project** button.

    - Enter a name and ID for your project, and select a billing account if you have
    multiple accounts.

    - Click the **Create** button.


    Your project is now set up, and you can start using GCP services.


    **Note**: If you are using the free tier, make sure to monitor your usage to avoid
    charges, as some services have limitations. Also, you may need to enable specific
    services for your project to use them.


    ## Summary


    Google Cloud Platform (GCP) offers a comprehensive suite of cloud computing services
    that leverage the same robust infrastructure used by Google’s products. This chapter
    introduced GCP, highlighting its essential services and their relevance to data
    science.


    We explored several essential GCP services for data science, including `BigQuery`,
    `Cloud AI Platform`, `Cloud Dataflow`, `Cloud DataLab`, `Cloud Dataproc`, `Cloud
    Storage`, and `Cloud Vision API`. Each of these services serves a specific purpose
    in the data science workflow, ranging from data storage and processing to machine
    learning model development and deployment.


    Furthermore, we discussed the availability of free-tier offerings for various
    GCP data science services, allowing users to get started and explore these capabilities
    at no cost. Staying updated with the latest information on free-tier offerings
    and pricing is important by referring to the GCP pricing page.


    Following the outlined steps, users can set up their GCP account and create projects,
    providing access to a powerful cloud computing platform for their data science
    initiatives.


    GCP’s robust infrastructure, extensive range of services, and integration with
    popular data science tools make it a compelling choice for organizations and individuals
    looking to leverage the cloud for their data-driven projects. With GCP, users
    can harness Google’s infrastructure’s scalability, reliability, and performance
    to tackle complex data challenges and unlock valuable insights.


    As we progress through this guide, we will delve deeper into specific GCP services
    and explore how they can be effectively utilized for various data science tasks.


    # 2. Google Colaboratory


    Google Colaboratory is a free, cloud-based Jupyter Notebook environment provided
    by Google. It allows individuals to write and run code in Python and other programming
    languages and perform data analysis, data visualization, and machine learning
    tasks. The platform is designed to be accessible, easy to use, and collaboration-friendly,
    making it a popular tool for data scientists, software engineers, and students.


    This chapter will guide you through the process of getting started with Colab,
    from accessing the platform to understanding its features and leveraging its capabilities
    effectively. We will cover how to create and run Jupyter notebooks, run machine
    learning models, and access GCP services and data from Colab.


    ## Features of Colab


    **Cloud-based environment**: Colaboratory runs on Google’s servers, eliminating
    users needing to install software on their devices.


    **Easy to use**: Colaboratory provides a user-friendly interface for working with
    Jupyter notebooks, making it accessible for individuals with limited programming
    experience.


    **Access to GCP services**: Colaboratory integrates with Google Cloud Platform
    (GCP) services, allowing users to access and use GCP resources, such as `BigQuery`
    and `Cloud Storage`, from within the notebook environment.


    **Sharing and collaboration**: Colaboratory allows users to share notebooks and
    collaborate on projects with others, making it an excellent tool for team-based
    work.


    **GPU and TPU support**: Colaboratory provides access to GPUs and TPUs for running
    computationally intensive tasks, such as deep learning and high-performance computing.


    Google Colaboratory provides a powerful and flexible platform for data science,
    machine learning, and other technical tasks, making it a popular choice for individuals
    and teams looking to work with cloud-based tools.'
