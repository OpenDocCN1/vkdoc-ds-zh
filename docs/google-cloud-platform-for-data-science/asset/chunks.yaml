    `Setup` 选项，选择 `Default date range`，然后选择 `Custom` 选项。接着，选择销售趋势的开始和结束日期。请参见以下示例。


    ![](img/606032_1_En_4_Fig25_HTML.jpg)


    截图展示了网页的部分内容，页面右侧有图表面板，其中选中了“设置”选项卡。在“设置”选项卡下，选中了“销售额”选项，左侧窗格中呈现了销售额的折线图，显示波动趋势。


