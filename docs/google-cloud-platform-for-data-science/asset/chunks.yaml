    \ S Q L server.\n\nFigure 6-7\n\nCreate an instance page\n\n1.  Choose the instance\
    \ type and configure the instance settings as per your requirements. You can set\
    \ the instance ID, region, and zone where you want to create the instance.\n\n\
    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig8_HTML.jpg)\n\nA screenshot\
    \ of the Google Cloud interface displays the options under the create My S Q L\
    \ instance. It lists the instance info with the instance I D and password. A summary\
    \ is on the right panel.\n\nFigure 6-8\n\nConfigure the instance settings\n\n\
    1.  Next, configure the machine type and storage type for the instance. You can\
    \ also set the storage capacity.\n\n2.  Under the Connectivity section, you can\
    \ choose how to connect to your instance. You can choose a public or private IP\
    \ address and configure authorized networks for access.\n\n3.  Under the Additional\
    \ Configuration section, you can configure advanced options such as database flags,\
    \ backup settings, and maintenance settings.\n\n4.  Once you’ve configured all\
    \ the settings, click the CREATE INSTANCE button at the bottom of the page to\
    \ create the MySQL instance.\n\n![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig9_HTML.jpg)\n\
    \nA screenshot of the Google Cloud interface displays the options under the create\
    \ My S Q L instance. It lists the flags, query insights, and labels with the properties\
    \ on the right.\n\nFigure 6-9\n\nCreate a MySQL instance\n\n1.  The instance creation\
    \ process may take a few minutes, depending on the configuration and resources\
    \ allocated. Once the instance is created, connect to it using any MySQL client\
    \ and start using it.\n\n![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig10_HTML.jpg)\n\
    \nA screenshot of the Google Cloud interface displays a dropdown where the overview\
    \ is selected. It lists the my s q l instance overview with the C P U utilization\
    \ chart.\n\nFigure 6-10\n\nOverview of the MySQL instance\n\nThat’s it! You have\
    \ now successfully created a MySQL instance using Cloud SQL.\n\n### Connect to\
    \ Your MySQL Instance\n\n1.  Click Activate Cloud Shell.\n\n2.  Connect to your\
    \ MySQL instance by using the following command:\n\n    ```\n    gcloud sql connect\
    \ mysql-instance --user=root\n    ```\n\n![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig11_HTML.jpg)\n\
    \nA screenshot of the Google Cloud interface displays the S Q L options. It lists\
    \ the overview with a workspace with a code that displays the welcome message\
    \ connecting to the MY S Q L instance.\n\nFigure 6-11\n\nConnect to the MySQL\
    \ instance\n\n1.  Authorize.\n\n![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig12_HTML.jpg)\n\
    \nA screenshot of the pop-up box that displays the authorize cloud shell message\
    \ with the reject and authorize buttons.\n\nFigure 6-12\n\nAuthorize Cloud Shell\n\
    \n1.  Enter the password created while creating the SQL instance, and you will\
    \ get a MySQL prompt (mysql>).\n\n### Create a Database and Upload Data in SQL\n\
    \n1.  This code will create a new database named “college.” You can replace “college”\
    \ with the name you want to give to your database:\n\n    ```\n    CREATE DATABASE\
    \ college;\n    ```\n\n    Remember to use appropriate naming conventions for\
    \ your database to make it easily identifiable and to avoid naming conflicts with\
    \ other databases.\n\n2.  The following code will first select the “college” database\
    \ using the USE statement and then create a new table named “students” with three\
    \ columns: “id”, “name”, and “age”. The “id” column is an auto-incrementing integer\
    \ that serves as the primary key for the table:\n\n    ```\n    USE college;\n\
    \    CREATE TABLE students (\n    id INT NOT NULL AUTO_INCREMENT,\n    name VARCHAR(50)\
    \ NOT NULL,\n    age INT NOT NULL,\n    PRIMARY KEY (id)\n    );\n    ```\n\n\
    \    You can modify the column names, data types, and constraints to fit your\
    \ specific needs. The CREATE TABLE statement provides a lot of flexibility in\
    \ defining the structure of your database tables.\n\n3.  The following code will\
    \ insert five rows of data into the “students” table with values for the “name”\
    \ and “age” columns. The “id” column is not specified, since it is an auto-incrementing\
    \ primary key that will be generated automatically by MySQL:\n\n    ```\n    INSERT\
    \ INTO students (name, age) VALUES\n    ('John Smith', 20),\n    ('Jane Doe',\
    \ 21),\n    ('Bob Johnson', 19),\n    ('Samantha Lee', 22),\n    ('Chris Brown',\
    \ 18);\n    ```\n\n    You can modify the sample data to fit your specific needs\
    \ and insert as many rows as you need. Remember to provide values for all the\
    \ columns that are not defined as AUTO_INCREMENT or DEFAULT NULL, or you will\
    \ get an error.\n\n    Note that the INSERT INTO statement can also be used to\
    \ insert data into multiple tables at once or to insert data from another table\
    \ using a subquery.\n\n![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig13_HTML.jpg)\n\
    \nA screenshot of the Google Cloud interface displays the workspace and uploads\
    \ the student's data into the database.\n\nFigure 6-13\n\nINSERT INTO\n\n1.  View\
    \ the data from the table:\n\n    ```\n    select * from students;\n    ```\n\n\
    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig14_HTML.jpg)\n\nA screenshot\
    \ of the Google Cloud interface displays the workspace with the uploaded data\
    \ as I D, name, and age into the database.\n\nFigure 6-14\n\nselect\n\n1.  Clean\
    \ up.\n\n    Use the following code to delete the database:\n\n    ```\n    DROP\
    \ DATABASE college;\n    ```\n\n2.  Disconnect from your MySQL instance using\
    \ the exit command and close the shell.\n\n3.  Delete the instance. If the delete\
    \ option is not enabled, go to the Data Protection section and disable deletion\
    \ protection."
  trans: "\n### 使用 Cloud SQL 创建 MySQL 实例\n\n1.  要开始操作，请访问 Google Cloud 控制台 [`https://console.cloud.google.com/`](https://console.cloud.google.com/)\
    \ 并登录。然后，选择您打算在其中创建 MySQL 实例的所需项目。\n\n2.  启用 API：\n    - `Compute Engine API`\n\
    \    - `sqladmin API (prod)`\n\n3.  进入项目后，点击左上角的导航菜单，然后选择 `SQL`。\n\n    ![](img/606032_1_En_6_Fig5_HTML.jpg)\n\
    \    一张 Google Cloud 界面的截图，突出显示了 `SQL` 选项。\n    **图 6-5** SQL 菜单项\n\n4.  在 Cloud\
    \ SQL 页面上，点击 `CREATE INSTANCE` 按钮。\n\n    ![](img/606032_1_En_6_Fig6_HTML.jpg)\n\
    \    一张 Google Cloud 界面的截图，显示了创建实例工作区下的实例列表。\n    **图 6-6** 创建实例\n\n5.  在“创建实例”页面上，选择您要使用的\
    \ MySQL 版本。\n\n    ![](img/606032_1_En_6_Fig7_HTML.jpg)\n    一张 Google Cloud 界面的截图，显示了“创建实例”下的选项。它列出了数据库引擎：`MySQL`、`PostgreSQL`\
    \ 和 `SQL server`。\n    **图 6-7** 创建实例页面\n\n6.  选择实例类型并根据您的要求配置实例设置。您可以设置实例 ID、区域以及您希望创建实例的可用区。\n\
    \n    ![](img/606032_1_En_6_Fig8_HTML.jpg)\n    一张 Google Cloud 界面的截图，显示了创建 MySQL\
    \ 实例下的选项。它列出了包含实例 ID 和密码的实例信息。右侧面板显示摘要。\n    **图 6-8** 配置实例设置\n\n7.  接下来，配置实例的机器类型和存储类型。您还可以设置存储容量。\n\
    \n8.  在“连接”部分下，您可以选择如何连接到您的实例。您可以选择公共或私有 IP 地址，并配置用于访问的授权网络。\n\n9.  在“附加配置”部分下，您可以配置高级选项，例如数据库标志、备份设置和维护设置。\n\
    \n10. 配置完所有设置后，点击页面底部的 `CREATE INSTANCE` 按钮来创建 MySQL 实例。\n\n    ![](img/606032_1_En_6_Fig9_HTML.jpg)\n\
    \    一张 Google Cloud 界面的截图，显示了创建 MySQL 实例下的选项。它列出了标志、查询洞察和标签，右侧显示属性。\n    **图\
    \ 6-9** 创建 MySQL 实例\n\n11. 实例创建过程可能需要几分钟，具体取决于配置和分配的资源。实例创建完成后，使用任何 MySQL 客户端连接到它并开始使用。\n\
    \n    ![](img/606032_1_En_6_Fig10_HTML.jpg)\n    一张 Google Cloud 界面的截图，显示了一个下拉菜单，其中选择了“概览”。它列出了\
    \ MySQL 实例概览以及 CPU 利用率图表。\n    **图 6-10** MySQL 实例概览\n\n就是这样！您现在已经成功使用 Cloud SQL\
    \ 创建了一个 MySQL 实例。\n\n### 连接到您的 MySQL 实例\n\n1.  点击“激活 Cloud Shell”。\n\n2.  使用以下命令连接到您的\
    \ MySQL 实例：\n\n    ```\n    gcloud sql connect mysql-instance --user=root\n  \
    \  ```\n\n    ![](img/606032_1_En_6_Fig11_HTML.jpg)\n    一张 Google Cloud 界面的截图，显示了\
    \ SQL 选项。它列出了概览，并带有一个包含代码的工作区，该代码显示了连接到 MySQL 实例的欢迎消息。\n    **图 6-11** 连接到 MySQL\
    \ 实例\n\n3.  授权。\n\n    ![](img/606032_1_En_6_Fig12_HTML.jpg)\n    一张弹出框的截图，显示了授权\
    \ Cloud Shell 消息，并带有“拒绝”和“授权”按钮。\n    **图 6-12** 授权 Cloud Shell\n\n4.  输入创建 SQL\
    \ 实例时设置的密码，您将看到 MySQL 提示符 (`mysql>`)。\n\n### 在 SQL 中创建数据库并上传数据\n\n1.  此代码将创建一个名为\
    \ `college` 的新数据库。您可以将 `college` 替换为您想要给数据库起的名称：\n\n    ```\n    CREATE DATABASE\
    \ college;\n    ```\n\n    请记住为您的数据库使用适当的命名约定，以便于识别并避免与其他数据库发生命名冲突。\n\n2.  以下代码将首先使用\
    \ `USE` 语句选择 `college` 数据库，然后创建一个名为 `students` 的新表，该表包含三列：`id`、`name` 和 `age`。`id`\
    \ 列是一个自增整数，用作该表的主键：\n\n    ```\n    USE college;\n    CREATE TABLE students (\n\
    \    id INT NOT NULL AUTO_INCREMENT,\n    name VARCHAR(50) NOT NULL,\n    age\
    \ INT NOT NULL,\n    PRIMARY KEY (id)\n    );\n    ```\n\n    您可以修改列名、数据类型和约束以满足您的特定需求。`CREATE\
    \ TABLE` 语句在定义数据库表结构方面提供了很大的灵活性。\n\n3.  以下代码将向 `students` 表中插入五行数据，并为 `name` 和\
    \ `age` 列提供值。未指定 `id` 列，因为它是一个自增主键，将由 MySQL 自动生成：\n\n    ```\n    INSERT INTO\
    \ students (name, age) VALUES\n    ('John Smith', 20),\n    ('Jane Doe', 21),\n\
    \    ('Bob Johnson', 19),\n    ('Samantha Lee', 22),\n    ('Chris Brown', 18);\n\
    \    ```\n\n    您可以修改示例数据以满足您的特定需求，并根据需要插入任意多行。请记住为所有未定义为 `AUTO_INCREMENT` 或 `DEFAULT\
    \ NULL` 的列提供值，否则您将收到错误。\n\n    请注意，`INSERT INTO` 语句也可用于一次向多个表插入数据，或使用子查询从另一个表插入数据。\n\
    \n    ![](img/606032_1_En_6_Fig13_HTML.jpg)\n    一张 Google Cloud 界面的截图，显示了工作区并将学生数据上传到数据库中。\n\
    \    **图 6-13** 插入数据\n\n4.  查看表中的数据：\n\n    ```\n    select * from students;\n\
    \    ```\n\n    ![](img/606032_1_En_6_Fig14_HTML.jpg)\n    一张 Google Cloud 界面的截图，显示了工作区以及已上传到数据库中的数据（ID、姓名和年龄）。\n\
    \    **图 6-14** 查询\n\n5.  清理。\n\n    使用以下代码删除数据库：\n\n    ```\n    DROP DATABASE\
    \ college;\n    ```\n\n6.  使用 `exit` 命令断开与 MySQL 实例的连接，并关闭 Shell。\n\n7.  删除实例。如果删除选项未启用，请转到“数据保护”部分并禁用删除保护。\n"
- fmt: '# Introduction to Google Cloud Pub/Sub and Its Use Cases for Real-Time Data
    Streaming


    Google Cloud Pub/Sub is a messaging service provided by Google Cloud Platform
    that enables asynchronous communication between applications. It allows developers
    to build highly scalable and reliable messaging systems to exchange messages between
    different components of their applications in a decoupled and fault-tolerant manner.


    The basic idea behind Pub/Sub is that publishers send messages to topics and subscribers
    receive messages from these topics. Topics are virtual channels to which messages
    can be sent, and subscribers can be attached to one or more topics to receive
    messages from them. Messages can be in any format, including JSON, XML, or binary
    data, and can be up to 10 MB in size.


    Google Cloud Pub/Sub provides a range of functionalities that simplify the utilization
    and scalability of messaging systems for developers. For example, it provides
    a REST API and client libraries in several programming languages, including Java,
    Python, and Go. It also provides durable message storage, allowing messages to
    be stored and delivered to subscribers even if they are offline or unavailable.


    Pub/Sub also integrates with other Google Cloud services, such as Google Cloud
    Functions, Google Cloud Dataflow, and Google Cloud Storage, to provide a seamless
    experience for developers building cloud-native applications. Additionally, Pub/Sub
    is highly scalable and can handle millions of messages per second, making it an
    ideal choice for high-throughput messaging scenarios.


    Google Cloud Pub/Sub is widely used for real-time data streaming use cases, such
    as:


    1. **IoT data ingestion**: Pub/Sub can be used to ingest and process large volumes
    of real-time data generated by IoT devices. Devices can publish data to topics,
    and subscribers can consume the data to perform real-time analysis or trigger
    actions based on the data.

    2. **Clickstream processing**: Pub/Sub can be used to process clickstream data
    generated by websites or mobile apps in real time. The data can be streamed to
    Pub/Sub topics, and subscribers can consume the data to analyze user behavior
    and make real-time decisions.

    3. **Financial trading**: Pub/Sub can be used to stream real-time stock quotes,
    financial news, and other market data to subscribers, allowing them to react quickly
    to market changes and execute trades in real time.

    4. **Gaming**: Pub/Sub can be used to stream real-time gaming events, such as
    player movements, game state changes, and in-game purchases. This allows developers
    to build real-time multiplayer games and deliver personalized gaming experiences
    to users.

    5. **Real-time analytics**: Pub/Sub can be used to stream real-time data to analytics
    platforms such as Google Cloud Dataflow or Apache Beam, allowing real-time analysis
    and decision-making.


    In summary, Google Cloud Pub/Sub provides a reliable and scalable messaging service
    that can be used for real-time data streaming use cases in various industries,
    such as IoT, finance, gaming, and analytics.


    ## Setting Up and Consuming Data Streams with Cloud Pub/Sub


    Hands-on Pub/Sub step-by-step:


    1. **The project setup**: To make sure you have the necessary rights, either create
    a new project or choose an existing project in which you already have them.

    2. **Create a topic**: Go to the Pub/Sub browser to create a topic.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig15_HTML.jpg)


    A screenshot of the Google Cloud interface highlights the Pub or Sub menu.


    Figure 6-15 Pub/Sub


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig16_HTML.jpg)


    A screenshot of the Google Cloud interface displays a dropdown where the Pub or
    Sub menu is selected. It lists the files to be created under the list and metrics.


    Figure 6-16 Pub/Sub—CREATE TOPIC


    Click `CREATE TOPIC`. Fill in the required information and click `CREATE TOPIC`.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig17_HTML.jpg)


    A screenshot of the dialog box titled Create a topic. It has fields for topic
    ID and options for adding default subscriptions and encryption.


    Figure 6-17 Pub/Sub—topic info


    3. **Add a subscription**: You must make subscriptions to receive messages. A
    topic must match a subscription. The subscription with the same name was automatically
    formed by Pub/Sub when you created the topic in the previous step. Follow the
    steps on the page to create another subscription.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig18_HTML.jpg)


    A screenshot of the Google Cloud interface displays a dropdown where the Pub or
    Sub menu is selected. The option topics is selected, and the subscription to the
    topic is to be added.


    Figure 6-18 Subscription creation


    Scroll down the page and click `Create` after filling in the necessary information.


    4. Return to the topic page and click the topic. Scrolling down, you should be
    able to see the subscription created.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig19_HTML.jpg)


    A screenshot of the Google Cloud interface displays a dropdown where the Pub or
    Sub menu is selected. It lists the created subscription with details, snapshots,
    metrics, and messages.


    Figure 6-19 Pub/Sub—subscription creation


    5. Publish two messages on the topic.


    Click the `MESSAGES` tab, and you can find the `PUBLISH MESSAGE` tab. Click it.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig20_HTML.jpg)


    A screenshot of the Google Cloud interface displays a dropdown where the Pub or
    Sub menu is selected. The messages tab is selected, which displays the publish
    message button.


    Figure 6-20 Publish messages


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig21_HTML.jpg)


    A screenshot of the Google Cloud interface displays the publish message page.
    It lists the topic name, publish count, number of messages, and message body.


    Figure 6-21 Publish a message


    Enter a message in the message body.


    6. Go to the subscription page and click the subscription. Go to `MESSAGES`. If
    you don’t find any message, click `PULL` till you get the message. You should
    be able to see the message in the message body.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig22_HTML.jpg)


    A screenshot of the Google Cloud interface displays a dropdown where the subscription
    menu is selected. It lists the created subscription with name, state, and topic
    name.


    Figure 6-22 Message pull


    Pub/Sub does not guarantee the messages’ chronological sequence. You might have
    only noticed one statement. If so, keep clicking `PULL` until the other notification
    appears.


    7. **Clean up**: The topic you created can be deleted if you want to tidy up the
    Pub/Sub resources you made in this tutorial. Visit the Topics tab once more. Click
    `DELETE` after selecting the box next to the topic.


    ![](images/606032_1_En_6_Chapter/606032_1_En_6_Fig23_HTML.jpg)


    A screenshot of the Google Cloud interface displays a dropdown where the topic
    menu is selected. It lists the created topics that can be deleted by selecting
    the particular topic and clicking the delete button.


    Figure 6-23 Delete the topic


    In the same way, you can clean up your subscription as well.'
