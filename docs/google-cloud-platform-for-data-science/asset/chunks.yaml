    # 总结


    本章探讨了数据分析和存储的世界，重点介绍了 Google Cloud Storage、Google Cloud SQL 和 Google Cloud Pub/Sub。


    我们首先介绍了 Google Cloud Storage，这是一种高度可扩展且持久的对象存储服务。我们讨论了 Cloud Storage 适用的各种用例，例如存储和归档数据、托管静态网站以及作为备份和恢复解决方案。我们探讨了
    Cloud Storage 的主要特性，包括其存储类别、访问控制以及与其他 Google Cloud 服务的集成。


    接下来，我们深入研究了 Google Cloud SQL，这是一种全托管的关系型数据库服务。我们讨论了使用 Cloud SQL 存储和管理关系数据的优势，包括其自动备份、可扩展性以及与
    MySQL 和 PostgreSQL 等流行数据库引擎的兼容性。我们探讨了 Cloud SQL 适用的用例，例如 Web 应用程序、内容管理系统和数据分析。


    随后，我们将注意力转向 Google Cloud Pub/Sub，这是一种用于实时数据流传输的消息传递服务。我们学习了 Pub/Sub 的核心概念，包括主题、发布者和订阅者。我们发现了
    Pub/Sub 表现出色的用例，例如事件驱动架构、实时分析和物联网数据处理。我们还探讨了 Pub/Sub 与其他 Google Cloud 服务（如 Cloud
    Functions 和 Dataflow）的集成。


    最后，我们学习了如何使用 Cloud Pub/Sub 设置和消费数据流。我们探讨了创建主题、发布消息以及创建订阅者以接收和处理流式数据所涉及的步骤。我们深入了解了
    Pub/Sub 的可扩展性和可靠性，使其成为构建健壮且可扩展的数据流管道的理想选择。


    通过本章的学习，我们更深入地理解了数据存储和分析在现代数据领域中的重要性。我们了解到 Google Cloud Storage、Cloud SQL 和 Cloud
    Pub/Sub 如何提供强大的工具和服务来大规模地存储、管理和分析数据。通过利用这些服务，组织可以释放其数据的价值，获得有意义的见解，并做出数据驱动的决策。


    凭借本章获得的知识和技能，我们能够设计和实现健壮的数据存储解决方案，利用关系型数据库进行高效的数据管理，并利用实时数据流传输的强大功能进行实时分析和事件驱动架构。


    # 7. 高级主题


    本章深入探讨了保护和管理 Google Cloud Platform (GCP) 资源的高级方面、使用 Google Cloud Source Repositories
    进行版本控制，以及强大的数据集成工具：Dataplex 和 Cloud Data Fusion。


    我们首先强调使用身份与访问管理 (IAM) 进行安全的资源管理，涵盖角色、权限以及实现强访问控制的最佳实践。


    我们将 Google Cloud Source Repositories 作为一个托管版本控制系统进行探讨，用于可扩展的代码管理和协作。Dataplex 被介绍为一个数据编织平台，有助于数据发现、谱系和治理，而
    Cloud Data Fusion 则简化了数据管道的创建和管理。


    在整个过程中，我们将获得增强 GCP 安全性、简化代码协作以及优化数据集成以满足各种处理需求的见解。


    ## 使用 IAM 保护和管理 GCP 资源


    IAM（身份与访问管理）是 Google Cloud Platform (GCP) 提供的一项服务，用于简化对 GCP 资源的访问管理。IAM 使您能够控制资源的可访问性，并定义个人可以对这些资源执行的操作。它提供了一个集中管理访问控制的地方，从而更容易实施安全策略并降低未经授权访问的风险。


    以下是 IAM 相关的一些关键概念：


    1.  **资源**：可以应用 IAM 策略的 GCP 实体，例如项目、存储桶或实例。


    2.  **角色**：角色是权限的集合，指定了对特定资源允许执行的操作。这些角色可以分配给用户、组或服务账号，从而确定其操作范围。


    3.  **成员**：可以被分配角色的身份。成员可以是用户、组或服务账号。


    4.  **策略**：一组角色绑定，定义了谁对资源拥有什么权限。


    以下是 IAM 的一些主要特性：


    1.  **基于角色的访问控制 (RBAC)**：IAM 使用 RBAC 来控制对资源的访问。RBAC 允许您定义角色并将其分配给用户、组或服务账号。


    2.  **自定义角色**：IAM 提供了具有预定义权限的预定义角色，但您可以创建适合您特定需求的自定义角色。这允许您向用户或服务授予更细粒度的权限。


    3.  **服务账号**：服务账号是一种特殊类型的账号，可供应用程序或服务用于向 GCP API 进行身份验证。它们可以像人类用户一样被授予权限，但不与特定个人绑定。


    4.  **审计日志**：IAM 提供审计日志，允许您跟踪谁有权访问您的资源以及他们执行的操作。


    5.  **细粒度访问控制**：IAM 提供对资源的细粒度访问控制。您可以控制对项目内特定资源的访问，甚至可以控制对特定文件夹或组织内资源的访问。


    6.  **条件访问**：IAM 提供条件访问，允许您为访问资源的用户或服务设置条件。例如，您可以根据 IP 地址或设备设置条件。


    总之，IAM 是一项强大的服务，允许您管理对 GCP 资源的访问。使用 IAM，您可以实施安全策略，降低未经授权访问的风险，并确保您的资源得到良好管理。

    '
- fmt: "### Using the Resource Manager API, Grant and Remove IAM Roles\n\n1.  To make\
    \ sure you have the necessary permissions, either create a new project or choose\
    \ a current project in which you already have them.\n2.  Enable APIs:\n    - Identity\
    \ and Access Management (IAM) API\n    - Cloud Resource Manager API\n3.  Grant\
    \ a principal the `Logs Viewer` role on the project.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig1_HTML.jpg)\n\
    \nA screenshot depicts an extract of the Google Cloud website page with the IAM\
    \ and admin tab selected from the left side panel, which presents a submenu in\
    \ which the IAM tab is highlighted.\n\n**Figure 7-1** IAM and admin\n\n1.  Click\
    \ `GRANT ACCESS`.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig2_HTML.jpg)\n\
    \nA screenshot depicts a portion of the Google Cloud website page with the IAM\
    \ tab selected from the left side panel, which displays the IAM page on the right\
    \ side with the `GRANT ACCESS` tab at the top, which is highlighted.\n\n**Figure\
    \ 7-2** `GRANT ACCESS`\n\n1.  Enter the email address of a principal.\n\n![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig3_HTML.jpg)\n\
    \nA screenshot of the grant access to practice project 1 page, which presents\
    \ the headings such as resource, add principals, and assign roles with entry fields,\
    \ IAM condition. The save button at the bottom of the page is selected.\n\n**Figure\
    \ 7-3** `GRANT ACCESS`—info\n\n1.  From the `Select a role` menu, select the product\
    \ or service you want to give access to.\n2.  If you want to revoke access, you\
    \ can do this by following the following steps:\n\n**Identify the member and the\
    \ role to be revoked**: Before you can revoke an IAM role, you need to know which\
    \ member has been assigned the role and which role you want to revoke.\n\n**Navigate\
    \ to the IAM page**: Open the IAM page in the Google Cloud Console by clicking\
    \ the `IAM` tab in the left navigation menu.\n\n**Find the member**: Use the search\
    \ bar at the top of the page to find the member who has been assigned the role\
    \ you want to revoke. Click the member’s name to view their assigned roles.\n\n\
    **Remove the role**: Locate the role you want to revoke and click the `X` icon\
    \ to remove the role from the member. A confirmation dialog box will appear. Click\
    \ `Remove` to confirm that you want to revoke the role.\n\n**Verify the role has\
    \ been revoked**: After you revoke the role, you should verify that the member\
    \ no longer has access to the resources associated with that role. You can use\
    \ the Google Cloud Console or the Cloud Identity and Access Management API to\
    \ check the member’s roles and permissions.\n\nIt’s important to note that revoking\
    \ an IAM role does not remove the member from your project or organization. The\
    \ members may still have other roles assigned to them, and they may still be able\
    \ to access some resources. To completely remove a member from your project or\
    \ organization, you need to remove all their assigned roles and permissions.\n\
    \n## Using Google Cloud Source Repositories for Version Control\n\nGoogle Cloud\
    \ Source Repositories is a source code management service provided by Google Cloud\
    \ Platform (GCP). It allows you to store and manage your source code in a secure\
    \ and scalable way and provides advanced features such as code search, code reviews,\
    \ and continuous integration and deployment (CI/CD).\n\nHere are some key features\
    \ of Google Cloud Source Repositories:\n\n- **Scalability**: Google Cloud Source\
    \ Repositories can handle repositories of any size and can scale to meet the needs\
    \ of large enterprises.\n- **Code search**: Google Cloud Source Repositories provides\
    \ advanced code search capabilities that allow you to search across all your repositories\
    \ for specific code snippets, files, or even functions.\n- **Code reviews**: Google\
    \ Cloud Source Repositories makes it easy to review code changes and collaborate\
    \ with other developers. You can create pull requests, assign reviewers, and track\
    \ changes in real time.\n- **Integrated CI/CD**: Google Cloud Source Repositories\
    \ integrates with other GCP services, such as `Cloud Build` and `Cloud Functions`,\
    \ allowing you to build and deploy your code automatically.\n- **Secure**: Google\
    \ Cloud Source Repositories provides multiple layers of security to protect your\
    \ code, including encryption at rest and in transit, access controls based on\
    \ IAM roles, and audit logs.\n- **Flexible**: Google Cloud Source Repositories\
    \ supports a wide range of source code management tools and protocols, including\
    \ `Git`, `Mercurial`, and `Subversion`.\n\nGoogle Cloud Source Repositories is\
    \ fully integrated with other GCP services, allowing you to use it seamlessly\
    \ with other GCP tools and services. It’s a powerful solution for managing source\
    \ code, collaborating with other developers, and automating software development\
    \ workflows."
