  trans: "\n### 创建数据管道\n\n1.  前往创建 `Data Fusion` 实例。\n2.  输入一个实例名称。\n3.  如果您使用的是 `Cloud\
    \ Data Fusion` 6.2.3 或更高版本，请从`授权`字段中选择一个 `Dataproc` 服务账号，用于在 `Dataproc` 中运行您的管道。默认选项是\
    \ `Compute Engine` 账号。\n\n提供所有必要详细信息后，只需点击`创建`按钮。请注意，实例创建过程可能需要最多 30 分钟才能完成。当\
    \ `Cloud Data Fusion` 正在创建您的实例时，您会在`实例`页面上实例名称旁边看到一个进度轮。一旦过程完成，该进度轮将变成一个绿色的勾选标记，表示实例已准备就绪。\n\
    \n![](img/606032_1_En_7_Fig19_HTML.png)\n\n一张截图展示了 `Google Cloud` 网站页面的一个片段，其中从左侧面板选中了“实例”选项卡，该页面显示了实例名称、操作、版本、区域、可用区、版本和加密等详细信息。页面顶部的“创建实例”和“刷新”按钮被高亮显示。\n\
    \n**图 7-19** Data Fusion 实例\n\n1.  点击`查看实例`。\n\n![](img/606032_1_En_7_Fig20_HTML.jpg)\n\
    \n一张 Cloud Data Fusion 页面的截图，显示了诸如 wrangle、integrate、discover and govern、monitor\
    \ 和 manage 等模板。\n\n**图 7-20** Cloud Data Fusion 用户界面\n\n1.  通过 `Cloud Data Fusion\
    \ Hub`，您可以访问可在 `Cloud Data Fusion` 用户之间重用和共享的示例管道、插件和解决方案。点击`Hub`。\n2.  点击左下角的`管道`。\n\
    \n![](img/606032_1_En_7_Fig21_HTML.png)\n\n一张 Cloud Data Fusion 网页的截图，其中在 Hub\
    \ 页面下选中了“常规”选项卡。Hub 资源管理器显示了诸如 `Amazon Kinesis Sink Plugin`、`Amazon Kinesis streaming\
    \ source`、`Amazon S 3 client`、`Anaplan plugins`、`Argument Setter action plugin`\
    \ 和 `Cassandra source and sink` 等模板。\n\n**图 7-21** Hub 资源管理器\n\n1.  点击 `Cloud\
    \ Data Fusion Quickstart` 管道。然后点击`完成并自定义`。\n\n![](img/606032_1_En_7_Fig22_HTML.png)\n\
    \n一张 Cloud Data Fusion 页面的截图展示了 `Data Fusion Quickstart` 流程图，如下所示：`N Y T best\
    \ sellers` 指向 `parsing and trans`，再指向 `top-rated items`。\n\n**图 7-22** Data Fusion\
    \ Quickstart 管道\n\n1.  点击`部署`。\n\n管道部署完成后，您可以访问其详细信息视图，在此视图中您可以执行以下操作：\n*   查看管道的结构和配置。\n\
    *   手动运行管道，或配置计划或触发器以实现自动运行。\n*   查看管道过去执行的摘要，包括执行时间、日志和指标。\n\n1.  点击`运行`以执行您的管道。\n\
    2.  几分钟后，管道完成并将其状态转换为“成功”。此外，还会显示每个节点处理的记录数。\n3.  要查看结果样本，请执行以下步骤：\n    *   导航到\
    \ `BigQuery` 用户界面。\n    *   打开您项目中的 `DataFusionQuickstart` 数据集。\n    *   点击 `top_rated_inexpensive`\
    \ 表。\n    *   运行一个基本查询，例如 `SELECT * FROM <var>PROJECT_ID<var>.GCPQuickStart.top_rated_inexpensive\
    \ LIMIT 10`，以查看数据样本。\n    *   确保将 `PROJECT_ID` 替换为您项目的唯一标识符。\n4.  为防止您的 `Google\
    \ Cloud` 账户因本页面使用的资源而产生费用，请执行以下操作：\n    *   删除您的管道在此快速入门期间写入的 `BigQuery` 数据集。\n\
    \    *   删除 `Cloud Data Fusion` 实例。\n    *   请注意，删除您的实例不会移除与您的项目关联的任何数据。\n   \
    \ *   （可选）如果需要，您也可以删除整个项目。\n\n## 总结\n\n本章探讨了与保护和管理 `Google Cloud Platform` (`GCP`)\
    \ 资源、使用 `Google Cloud Source Repositories` 进行版本控制，以及两个强大的数据集成和管理工具：`Dataplex`\
    \ 和 `Cloud Data Fusion` 相关的高级主题。\n\n我们首先讨论了使用 `Identity and Access Management`\
    \ (`IAM`) 保护和管理 `GCP` 资源的重要性。我们了解了 `IAM` 角色、权限和策略，以及它们如何允许管理员控制对 `GCP` 资源的访问。通过实施强大的\
    \ `IAM` 实践，组织可以确保其 `GCP` 资源的安全性和完整性。\n\n接下来，我们深入探讨了 `Google Cloud Source Repositories`，这是一个版本控制系统，提供了一个可扩展且完全托管的仓库，用于存储和管理源代码。\n\
    \n接着，我们探索了 `Dataplex`，这是一个数据编织平台，使组织能够大规模地发现、理解和管理其数据资产。我们讨论了 `Dataplex` 的关键特性，包括数据发现、数据沿袭和数据治理。我们了解了\
    \ `Dataplex` 如何与其他 `Google Cloud` 服务（如 `BigQuery` 和 `Cloud Storage`）集成，以提供统一且高效的数据管理解决方案。\n\
    \n最后，我们学习了 `Cloud Data Fusion`，这是一个完全托管的数据集成服务，简化了构建和管理数据管道的过程。我们讨论了 `Cloud Data\
    \ Fusion` 的功能，包括其用于设计管道的可视化界面、对广泛数据源和数据接收器的支持，以及内置的数据转换和清洗功能。我们还探索了 `Cloud Data\
    \ Fusion` 与其他 `Google Cloud` 服务（如 `BigQuery` 和 `Dataproc`）的集成，以创建端到端的数据处理工作流。\n\
    \n在本章中，我们深入了解了高级主题，这些主题增强了我们有效保护和管理 `GCP` 资源、使用版本控制系统协作进行代码开发以及利用强大的数据集成和管理工具的能力。通过理解并运用\
    \ `IAM`、`Cloud Source Repositories`、`Dataplex` 和 `Cloud Data Fusion`，我们能够应对 `Google\
    \ Cloud` 环境中与资源管理、版本控制和数据集成相关的复杂挑战。\n\n凭借本章获得的知识和技能，我们可以自信地驾驭 `Google Cloud Platform`\
    \ 的高级方面，实施稳健的安全措施，简化代码协作，并高效地管理和集成数据，以满足各种数据处理和分析需求。\n"
