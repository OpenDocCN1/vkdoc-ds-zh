- fmt: '# 1. Introduction to GCP


    Over the past few years, the landscape of data science has undergone a remarkable
    transformation in how data is managed by organizations. The rise of big data and
    machine learning has necessitated the storage, processing, and analysis of vast
    quantities of data for businesses. As a result, there has been a surge in the
    demand for cloud-based data science platforms like Google Cloud Platform (GCP).


    According to a report by IDC, the worldwide public cloud services market was expected
    to grow by 18.3% in 2021, reaching $304.9 billion. GCP has gained significant
    traction in this market, becoming the third-largest cloud service provider with
    a market share of 9.5% (IDC, 2021). This growth can be attributed to GCP’s ability
    to provide robust infrastructure, data analytics, and machine learning services.


    GCP offers various data science services, including data storage, processing,
    analytics, and machine learning. It also provides tools for building and deploying
    applications, managing databases, and securing resources.


    Let’s look at a few business cases that shifted to GCP and achieved remarkable
    results:


    1. **The Home Depot**: The Home Depot, a leading home improvement retailer, wanted
    to improve their online search experience for customers. They shifted their search
    engine to GCP and saw a 50% improvement in the speed of their search results.
    This led to a 10% increase in customer satisfaction and a 20% increase in online
    sales (Google Cloud, *The Home Depot*, n.d.).


    2. **Spotify**: Spotify, a popular music streaming service, migrated its data
    infrastructure to GCP to handle its growing user base. By doing so, Spotify reduced
    its infrastructure costs by 75% and handled more user requests per second (Google
    Cloud, *Spotify*, n.d.).


    3. **Nielsen**: Nielsen, a leading market research firm, wanted to improve their
    data processing speed and accuracy. They shifted their data processing to GCP
    and achieved a 60% reduction in processing time, resulting in faster insights
    and better decision-making (Google Workspace, n.d.).


    Apart from the preceding examples, other organizations have benefited from GCP’s
    data science services, including Coca-Cola, PayPal, HSBC, and Verizon.


    With GCP, data scientists can focus on solving complex business problems instead
    of worrying about managing infrastructure. For instance, let’s consider the example
    of a retail company that wants to analyze customer behavior to improve its marketing
    strategy. The company has millions of customers and collects vast data from various
    sources such as social media, online purchases, and surveys. To analyze this data,
    the company needs a powerful cloud-based platform that can store and process the
    data efficiently. GCP can help the company achieve this by providing scalable
    data storage with `Google Cloud Storage`, data processing with `Google Cloud Dataflow`,
    and data analytics with `Google BigQuery`. The company can also leverage machine
    learning with `Google Cloud AI Platform` to build models that can predict customer
    behavior and `Google Cloud AutoML` to automate the machine learning process.


    GCP’s data science services offer valuable support to individuals pursuing careers
    in the field of data science. As the demand for data scientists continues to increase,
    possessing expertise in cloud-based platforms like GCP has become crucial. According
    to Glassdoor, data scientists in the United States earn an average salary of $113,309
    per year. Additionally, a recent report by Burning Glass Technologies highlights
    a notable 67% increase in job postings that specifically require GCP skills within
    the past year. Consequently, acquiring knowledge in GCP can provide significant
    advantages for those seeking employment opportunities in the data science field.


    This chapter provides an introduction to GCP along with its data science offerings,
    and it will walk you through the process of creating your GCP account and project.


    ## Overview of GCP and Its Data Science Services


    The architecture of Google Cloud Platform (GCP) is designed to provide users with
    a highly available, scalable, and reliable cloud computing environment. It is
    based on a distributed infrastructure that spans multiple geographic regions and
    zones, allowing for redundancy and failover in case of system failures or disasters
    (Sukhdeve, 2020).


    At a high level, the architecture of GCP consists of the following layers:


    1. **Infrastructure layer**: This layer includes the physical hardware and network
    infrastructure comprising the GCP data centers. It has servers, storage devices,
    networking equipment, and other components required to run and manage the cloud
    services.


    2. **Compute layer**: This layer includes the virtual machines (VMs) and container
    instances that run user applications and services. It has services like `Compute
    Engine`, `Kubernetes Engine`, and `App Engine`.


    3. **Storage layer**: This includes the various storage services GCP provides,
    such as `Cloud Storage`, `Cloud SQL`, and `Cloud Bigtable`. It offers scalable
    and durable storage options for multiple types of data.


    4. **Networking layer**: This layer includes the various networking services provided
    by GCP, such as `Virtual Private Cloud (VPC)`, `Load Balancing`, and `Cloud CDN`.
    It offers secure and reliable networking options for user applications and services.


    5. **Management and security layer**: This includes the various management and
    security services GCP provides, such as `Identity and Access Management (IAM)`,
    `Security Command Center`, and `Stackdriver`. It provides tools for managing and
    securing user applications and services running on GCP.


    In this way, the architecture of GCP is designed to provide a flexible and customizable
    cloud computing environment that can meet the needs of a wide range of users,
    from small startups to large enterprises.


    GCP is a suite of cloud computing services that runs on the same infrastructure
    that Google uses for its end user products, such as Google Search and YouTube
    (Google Cloud, 2023).


    For data science, it offers several services, including:


    * `BigQuery`: A fully managed, serverless data warehousing solution

    * `Cloud AI Platform`: A suite of machine learning tools, including `TensorFlow`,
    `scikit-learn`, and `XGBoost`

    * `Cloud Dataflow`: A fully managed service for transforming and analyzing data

    * `Cloud DataLab`: An interactive development environment for machine learning
    and data science

    * `Cloud Dataproc`: A managed `Apache Hadoop` and `Apache Spark` service

    * `Cloud Storage`: A scalable, fully managed object storage service

    * `Cloud Vision API`: A pre-trained image analysis API


    These services can be used together to build complete data science solutions,
    from data ingestion to model training to deployment. Many of the GCP data science
    services mentioned in the syllabus have a free tier, which provides limited access
    to the services for free. The following is a list of the services and their respective
    free-tier offerings:


    * `Google Colaboratory`: Completely free.

    * `BigQuery`: 1 TB of data processed per month for free.

    * `Cloud AI Platform`: Free access to `AI Platform Notebooks`, which includes
    `Colaboratory`.

    * `Looker Studio`: Completely free.

    * `Cloud Dataflow`: Two free job hours per day.

    * `Cloud Dataprep`: Free trial of two million records per month.

    * `Cloud Storage`: 5 GB of standard storage per month for free.

    * `Cloud SQL`: Free trial of second-generation instances, up to 125 MB of storage.

    * `Cloud Pub/Sub`: The free tier includes one million operations per month.


    **Note**


    The free-tier offerings may be subject to change, and usage beyond the free tier
    will incur charges. It is recommended to check the GCP pricing page for the latest
    information on the free-tier offerings.


    The various services of GCP can be categorized as follows:'
