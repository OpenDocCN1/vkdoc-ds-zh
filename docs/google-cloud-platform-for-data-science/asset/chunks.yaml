- fmt: '# Data Visualization on Colab


    `PyGWalker` is a Python library that simplifies the data analysis and data visualization
    workflow in Jupyter Notebook. It provides a Tableau-style user interface for the
    visual exploration of data frames in Pandas. With `PyGWalker`, data scientists
    can quickly and easily analyze data and visualize patterns with simple drag-and-drop
    operations.


    `PyGWalker` is built on top of the open source software Graphic Walker, which
    is an alternative to Tableau. Graphic Walker provides a visual interface that
    allows users to explore real-time data. It also supports various chart types and
    data manipulation functions.


    To get started with `PyGWalker`, you need to install it using `pip`. Open a Jupyter
    Notebook and install the library as follows:


    ```

