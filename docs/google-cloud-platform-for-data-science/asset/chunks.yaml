    \ Click Done and then Continue.\n\n2. Discovery settings will appear. Click Continue.\n\
    \n3. Review your asset and click Submit.\n\n4. You can see the following image\
    \ if everything is successful.\n\n   ![](images/606032_1_En_7_Chapter/606032_1_En_7_Fig16_HTML.jpg)\n\
    \n   A screenshot of the Dataplex web page, which displays various details under\
    \ the heading lake zone 1, in which the status is indicated as active by a check\
    \ mark. Below, the assets tab is selected, which presents different details with\
