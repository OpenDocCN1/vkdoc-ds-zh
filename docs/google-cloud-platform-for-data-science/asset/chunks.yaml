- fmt: '**Explore the available datasets:** BigQuery Sandbox provides access to several
    public datasets that you can use to practice running queries. To see a list of
    available datasets, click the `Datasets` tab in the navigation menu on the left-hand
    side of the screen.


    From the preceding screen, you can see that you can try the Google Trends demo
    query. After clicking the `OPEN THIS QUERY` button, you can see the following
    results.


    ![](images/606032_1_En_3_Chapter/606032_1_En_3_Fig4_HTML.png)


    A screenshot of the sandbox page. It displays the Google Trends demo query after
    clicking the `open this query` button.


    **Figure 3-4** Google Trend demo query


    **Select a dataset:** Click the name of a dataset to select it and see its schema
    and tables. In this example, the `bigquery-public-data.google_trends.top_terms`
    table is used.


    **Write a query:** To write a query, click the `Query Editor` tab in the navigation
    menu. Write your query using BigQuery’s SQL-like syntax in the query editor and
    click the `Run Query` button to execute it. The following query retrieves a list
    of the daily top Google Search terms using data from the `bigquery-public-data.google_trends.top_terms`
    table:


    ```

    -- This query shows a list of the daily top Google Search terms.

    SELECT

    refresh_date AS Day,

    term AS Top_Term,

    -- These search terms are in the top 25 in the US each day.

    rank,

    FROM `bigquery-public-data.google_trends.top_terms`

    WHERE

    rank = 1

    -- Choose only the top term each day.

    AND refresh_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 2 WEEK)

    -- Filter to the last 2 weeks.

    GROUP BY Day, Top_Term, rank

    ORDER BY Day DESC

    -- Show the days in reverse chronological order.

    ```


    Here’s a breakdown of the query:


    The `SELECT` statement specifies the columns to be included in the result set.
    It selects the `refresh_date` column and aliases it as “Day,” the `term` column
    as “Top_Term,” and the `rank` column.


    The `FROM` clause specifies the table `bigquery-public-data.google_trends.top_terms`
    from which the data will be retrieved.


    The `WHERE` clause filters the data based on specific conditions. In this case,
    it includes only the rows where the `rank` column is equal to 1, indicating the
    top term for each day. It also filters the data to include only the records from
    the past two weeks by comparing the `refresh_date` column with the result of `DATE_SUB(CURRENT_DATE(),
    INTERVAL 2 WEEK)`, which subtracts two weeks from the current date.


    The `GROUP BY` clause groups the result set by the “Day,” “Top_Term,” and `rank`
    columns. This ensures that each combination of these columns appears only once
    in the result set.


    The `ORDER BY` clause orders the result set in descending order based on the “Day”
    column. This means that the most recent days will appear first in the result.


    Concisely, the query retrieves the top Google Search term for each day over the
    past two weeks and presents them in reverse chronological order, first showing
    the most recent days.


    **View the query results:** You’ll see the results in the `Results` tab once your
    query has been executed. You can also save your query by clicking the `Save` button.


    **Repeat the process:** Feel free to iterate through this process multiple times,
