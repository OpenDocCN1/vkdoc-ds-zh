    Next, the following code does the following steps:


    1.  It defines a function download_table, which takes a BigQuery table URI as
    an argument.


    2.  Within the function, the first step is to remove the “bq://” prefix if present
    in the bq_table_uri.


    3.  Then, it downloads the BigQuery table as a Pandas DataFrame.


    4.  After that, it uses the download_table function to download three separate
    datasets df_train, df_validation, and df_test.


    5.  Subsequently, a function named “convert_dataframe_to_dataset” is defined,
    which accepts two DataFrames as parameters. The initial DataFrame corresponds
    to the training data, while the subsequent DataFrame represents the validation
    data.


    6.  Within the function, the first step is to separate the input data and label
    data. This is done using the. pop method.


    7.  The input data is then converted to Numpy arrays, and the label data is converted
    to a one-hot representation using tf.keras.utils.to_categorical.


    8.  Finally, the data is converted to TensorFlow datasets using tf.data.Dataset.from_tensor_slices
    for both the training data and validation data.


    9.  In the end, the function returns the TensorFlow datasets for both the training
    and validation data.


    10.  The code then calls the convert_dataframe_to_dataset function with df_train
    and df_validation as arguments to create the dataset_train and dataset_validation
    datasets.


    ```

    # Download a table

    def download_table(bq_table_uri: str):

    # Remove bq:// prefix if present

    prefix = "bq://"

    if bq_table_uri.startswith(prefix):

    bq_table_uri = bq_table_uri[len(prefix) :]

    # Download the BigQuery table as a dataframe

    # This requires the "BigQuery Read Session User" role on the custom training service
    account.

    table = bq_client.get_table(bq_table_uri)

    return bq_client.list_rows(table).to_dataframe()

    # Download dataset splits

    df_train = download_table(training_data_uri)

    df_validation = download_table(validation_data_uri)

    df_test = download_table(test_data_uri)

    def convert_dataframe_to_dataset(

    df_train: pd.DataFrame,

    df_validation: pd.DataFrame,

    ):

    df_train_x, df_train_y = df_train, df_train.pop(LABEL_COLUMN)

    df_validation_x, df_validation_y = df_validation, df_validation.pop(LABEL_COLUMN)

    y_train = np.asarray(df_train_y).astype("float32")

    y_validation = np.asarray(df_validation_y).astype("float32")

    # Convert to numpy representation

    x_train = np.asarray(df_train_x)

    x_test = np.asarray(df_validation_x)

    # Convert to one-hot representation

    num_species = len(df_train_y.unique())

    y_train = tf.keras.utils.to_categorical(y_train, num_classes=num_species)

    y_validation = tf.keras.utils.to_categorical(y_validation, num_classes=num_species)

    dataset_train = tf.data.Dataset.from_tensor_slices((x_train, y_train))

    dataset_validation = tf.data.Dataset.from_tensor_slices((x_test, y_validation))

    return (dataset_train, dataset_validation)

    # Create datasets

    dataset_train, dataset_validation = convert_dataframe_to_dataset(df_train, df_validation)

    ```


