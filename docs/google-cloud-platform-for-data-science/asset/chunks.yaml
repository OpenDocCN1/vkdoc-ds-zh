  trans: '

    # 3. 大数据与机器学习


    Google Cloud Platform 提供了多种服务，用于管理大数据以及执行提取、转换、加载（ETL）操作。此外，它还提供了用于训练和部署机器学习模型的工具。在本章中，我们将深入探讨
    `BigQuery` 及其查询执行。此外，我们还将了解如何使用 `BigQuery ML` 来开发机器学习模型。探索还将延伸到 Google Cloud AI
    Platform，我们将通过 `Vertex AI` 获得训练和部署机器学习模型的实践经验。


    随着学习的深入，我们将介绍 `Dataproc` 及其在数据处理中的应用。本章最后将介绍 `TensorFlow`。


    ## BigQuery


    `BigQuery` 是 Google Cloud Platform (GCP) 提供的一种无服务器、高度可扩展且经济高效的云数据仓库。它允许您使用类似 SQL
    的查询来存储和分析大量结构化和半结构化数据。使用 `BigQuery`，您可以在几秒钟内对数 TB 的数据运行临时查询，而无需任何设置或维护。


    `BigQuery` 适用于多种用例，包括：


    *   **数据仓库：** `BigQuery` 通常用作存储和分析大量数据的数据仓库。要创建完整的数据分析管道，您可以将 `BigQuery` 与其他 GCP
    工具（例如 `Google Cloud Storage` 和 `Google Looker Studio`）集成。


    *   **分析：** `BigQuery` 适用于运行大规模分析项目，例如商业智能、预测建模和数据挖掘。


    *   **机器学习：** `BigQuery` 提供了训练机器学习模型和执行可扩展预测的能力。它为 `TensorFlow` 和其他流行的机器学习框架提供了全面支持。


    *   **流式数据：** `BigQuery` 支持实时数据流，允许您近乎实时地处理和分析数据。


    *   **地理空间数据分析：** `BigQuery` 支持地理空间数据分析，允许您执行复杂的地理计算和可视化。


    `BigQuery` 的无服务器架构、可扩展性和成本效益使其成为从初创公司到大型企业等各种规模组织的理想解决方案。


    ## 在 BigQuery 数据上运行 SQL 查询


    开始使用 `BigQuery` 非常简单，包括以下步骤：


    **设置 Google Cloud 账户：** 要使用 `BigQuery`，您必须注册一个 Google Cloud 账户。您可以从免费试用开始，然后选择满足您需求的付费计划。


    **创建项目：** 拥有 Google Cloud 账户后，在 Google Cloud Console 中创建一个新项目。这将是您 `BigQuery`
    数据的存放位置。


    **加载数据：** 您可以通过多种方式将数据加载到 `BigQuery` 中，包括上传 CSV 或 JSON 文件、使用基于云的数据源（例如 `Google
    Cloud Storage`）或实时流式传输数据。


    **运行查询：** 数据加载完成后，您可以使用 `BigQuery` 的 Web UI 或命令行界面开始查询数据。`BigQuery` 使用类似 SQL 的语法，因此如果您熟悉
    SQL，会发现它很容易使用。


    **分析结果：** 运行查询后，您可以在 Web UI 中查看结果，或将其导出到文件以进行进一步分析。


    **可视化数据：** 您还可以使用 `Google Looker Studio` 等工具，基于 `BigQuery` 数据创建可视化和报告。


    `BigQuery` 提供了详细的文档和教程来帮助您入门。此外，GCP 还提供了一个免费的社区支持论坛，如果您有付费计划，还可以获得技术支持。


    在跳转到生产环境并使用信用卡之前，您可以尝试 `BigQuery Sandbox`。


    **BigQuery Sandbox** 是 Google Cloud Platform (GCP) 提供的一个免费的交互式学习环境，旨在帮助用户探索和学习
    `BigQuery`。使用 `BigQuery Sandbox`，您可以在公共数据集上运行查询并测试 `BigQuery` 的功能，而无需支付任何费用。


    `BigQuery Sandbox` 提供了一个用户友好的、基于 Web 的界面，便于对 `BigQuery` 数据执行类似 SQL 的查询。它提供了无忧的体验，无需任何设置或安装。这使其成为数据分析师、数据科学家和开发人员等刚接触
    `BigQuery` 并希望获得该工具的动手学习经验，同时探索其功能的人员的宝贵资源。


    `BigQuery Sandbox` 不适用于生产环境，并且存在一些限制，例如数据大小限制较小，性能低于完全配置的 `BigQuery` 实例。但是，这是在将
    `BigQuery` 用于生产环境之前，开始使用并熟悉其功能的好方法。


    以下是使用 `BigQuery Sandbox` 的分步教程：


    **打开 BigQuery Sandbox 网站：** 访问 `BigQuery Sandbox` 网站：`https://console.cloud.google.com/bigquery`。


    ![](img/606032_1_En_3_Fig1_HTML.jpg)


    Big Query Sandbox 窗口的屏幕截图显示分析下的一个下拉菜单，其中选择了 S Q L 工作区菜单。它显示了 S Q L 工作区。


    图 3-1


    Google Cloud 的 BigQuery 控制台


    **登录您的 Google 账户：** 如果您目前没有 Google 账户，则需要创建一个。然后，您可以登录您的账户以访问 `BigQuery Sandbox`
    环境。按照提示创建一个 Google Cloud 项目。要使用 `BigQuery Sandbox`，您必须创建一个 Google Cloud 项目。如下图所示。


    ![](img/606032_1_En_3_Fig2_HTML.jpg)


    新项目页面的屏幕截图。它显示了项目名称和位置的字段，并带有一个创建按钮。


    图 3-2


    创建新项目


    创建项目后，您将看到以下屏幕。


    ![](img/606032_1_En_3_Fig3_HTML.png)


    沙盒界面的屏幕截图。它显示了在 S Q L 工作区下创建的项目。


    图 3-3


    创建新项目后的屏幕

