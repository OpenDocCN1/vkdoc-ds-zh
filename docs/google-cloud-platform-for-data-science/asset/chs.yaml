  表上传后，预览该表\n\n**创建 BigQuery ML 模型：** 在 `BigQuery 编辑器` 中，创建一个新的 SQL 查询。使用 `CREATE\
  \ MODEL` 语句来创建一个 `BigQuery ML` 模型。示例如下：\n\n```\nCREATE MODEL your_model_name\nOPTIONS\
  \ (model_type='logistic_reg', input_label_cols=['target']) AS\nSELECT *\nFROM your_dataset_name.your_table_name\n\
  ```\n\n在上述语法中，将 `your_model_name` 和 `your_dataset_name.your_table_name` 填入（``）。对于已上传的数据集，请参考以下代码：\n\
  \n```\nCREATE MODEL `example_data.data_set_class_rand_model`\nOPTIONS (model_type='logistic_reg',\
  \ input_label_cols=['target']) AS\nSELECT *\nFROM `practice-project-1-377008.example_data.data_set_class_rand`\n\
  ```\n\n这里，模型名称是 `example_data.data_set_class_rand_model`，表名称是 `practice-project-1-377008.example_data.data_set_class_rand`。要查找表名称，请点击该表并转到“详细信息”选项。将出现以下屏幕。找到“表\
