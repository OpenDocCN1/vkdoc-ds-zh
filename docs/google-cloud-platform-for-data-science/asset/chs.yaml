  ```\n\n执行上述代码后，Vertex AI Python SDK 及其所有依赖项也会被安装。其中两个依赖项是 Cloud Storage 和 BigQuery。`--quiet`\
  \ 标志用于抑制输出，以便仅在有错误时显示错误。感叹号（`!`）是 shell 命令的指示符。\n\n您可以通过使用“运行所选单元格并前进”或使用键盘快捷键 `Shift+Enter`\
  \ 来运行代码。\n\n2.  **设置项目 ID**：第一行代码为 Vertex AI 平台设置项目 ID。项目 ID 是 Google Cloud 控制台中项目的唯一标识符。项目\
  \ ID 使用以下代码设置：\n\n```python\nimport os\nproject_id = \" MY_PROJECT_ID \"\nos.environ[\"\
  GOOGLE_CLOUD_PROJECT\"] = project_id\n```\n\n在这里，项目 ID 存储在 `project_id` 变量中，并设置为\
  \ `gcloud` 环境中的活动项目。\n\n3.  **设置区域**：下一行代码为 Vertex AI 平台设置区域。这是 Vertex AI 资源将被创建和存储的位置。区域使用以下代码设置：\n\
  \n```python\nregion = \"us-central1\"\n```\n\n\n\n### 4. **创建存储桶**：随后，代码会为 Vertex\
  \ AI 平台创建一个新的 Google Cloud Storage 存储桶，用于存储其数据。代码提供了一个默认名称，但会使用时间戳来确保名称的唯一性，以防默认名称已被占用。创建存储桶的代码如下：\n\
  \n```\nbucket_name = \"bucket-name-placeholder\"  # @param {type:\"string\"}\nbucket_uri\
  \ = f\"gs://{bucket_name}\"\nfrom datetime import datetime\ntimestamp = datetime.now().strftime(\"\
  %Y%m%d%H%M%S\")\nif bucket_name == \"\" or bucket_name is None or bucket_name ==\
  \ \"bucket-name-placeholder\":\n    bucket_name = project_id + \"aip-\" + timestamp\n\
  \    bucket_uri = \"gs://\" + bucket_name\nfrom google.cloud import storage\nclient\
  \ = storage.Client(project=project_id)\n# Create a bucket\nbucket = client.create_bucket(bucket_name,\
  \ location=region)\nprint(\"Bucket {} created.\".format(bucket.name))\n```\n\n此处定义了\
  \ `bucket_name` 和 `bucket_uri`，并使用时间戳为存储桶创建唯一名称。然后，使用项目 ID 创建一个 Google Cloud Storage\
  \ 客户端，并通过该客户端以及指定的名称和区域创建新的存储桶。\n\n### 初始化 Vertex AI SDK for Python。\n\n以下代码初始化了\
  \ Vertex AI SDK，该 SDK 提供了对 Vertex AI 平台及其功能的访问：\n\n```\nfrom google.cloud import\
  \ aiplatform\n# Initialize the Vertex AI SDK\naiplatform.init(project=project_id,\
  \ location=region, staging_bucket=bucket_uri)\n```\n\n第一行从 `google.cloud` 库中导入了\
  \ `aiplatform` 模块，该模块提供了对 Vertex AI API 的访问。\n\n随后，使用三个参数调用了 `aiplatform.init` 方法：`project`、`location`\
  \ 和 `staging_bucket`。`project` 参数是用于访问 Vertex AI 平台的 Google Cloud 项目 ID。`location`\
  \ 参数是创建 Vertex AI 平台资源的地理位置。`staging_bucket` 参数是 Google Cloud Storage 存储桶的 URI，用于在模型训练和部署期间存储中间数据。\n\
  \n此代码建立了与 Vertex AI 平台的连接，并为其在您的应用程序中使用做好了准备。\n\n### 初始化 BigQuery。\n\n以下代码设置了一个\
  \ BigQuery 客户端，用于访问指定项目中的 BigQuery 数据存储和分析服务：\n\n```\nfrom google.cloud import bigquery\n\
  # Set up BigQuery client\nbq_client = bigquery.Client(project=project_id)\n```\n\
  \n第一行从 `google.cloud` 库中导入了 `bigquery` 模块，该模块提供了对 BigQuery API 的访问。\n\n然后，使用 `project_id`\
  \ 变量作为参数，将 `bq_client` 变量定义为 `bigquery.Client` 类的一个实例。这将创建一个客户端对象，用于与指定项目的 BigQuery\
  \ API 进行交互。\n\n提供的代码建立了 BigQuery 客户端，从而能够访问和操作存储在 BigQuery 中的数据。它赋予了执行查询、执行数据分析操作以及在\
  \ BigQuery 环境中执行与数据管理相关的各种任务的能力。\n\n### 创建 Vertex AI 表格数据集。\n\n以下代码正在对来自 BigQuery\
  \ 的数据集进行预处理。它首先从 BigQuery 源数据集（`BQ_SOURCE`，即 `\"bigquery-public-data.ml_datasets.penguins\"\
  `）中检索一个表。然后，将数据加载到一个 Pandas DataFrame（`df`）中。\n\n接下来，代码将数据集中与 `NA_VALUES` 列表（`\"\
  NA\"`、`\".\"`）中定义的值匹配的任何值替换为 `NaN`，并删除所有包含 `NaN` 值的行。此步骤用于清理数据并移除不可用的行。\n\n下一步涉及将分类列转换为数值。对于三个分类列（`island`、`species`\
  \ 和 `sex`），代码使用 Pandas 的 `factorize` 方法将这些列中的字符串转换为整数。`factorize` 方法为每一列返回一个新的序列和一个唯一值数组。\n\
  \n然后，数据被分成两个独立的数据帧：`df_train` 和 `df_for_prediction`。`df_train` 包含 80% 的数据，用于训练目的；而\
  \ `df_for_prediction` 包含剩余的 20% 数据，用于预测。\n\n最后，代码为这三个列分别创建了一个字典，将数值映射回其字符串表示形式。这些字典分别是\
  \ `index_to_island`、`index_to_species` 和 `index_to_sex`。然后打印这些字典以验证其值：\n\n```\n\
  import numpy as np\nimport pandas as pd\nLABEL_COLUMN = \"species\"\n# Define the\
  \ BigQuery source dataset\nBQ_SOURCE = \"bigquery-public-data.ml_datasets.penguins\"\
  \n# Define NA values\nNA_VALUES = [\"NA\", \".\"]\n# Download a table\ntable = bq_client.get_table(BQ_SOURCE)\n\
  df = bq_client.list_rows(table).to_dataframe()\n# Drop unusable rows\ndf = df.replace(to_replace=NA_VALUES,\
  \ value=np.NaN).dropna()\n# Convert categorical columns to numeric\ndf[\"island\"\
  ], island_values = pd.factorize(df[\"island\"])\ndf[\"species\"], species_values\
  \ = pd.factorize(df[\"species\"])\ndf[\"sex\"], sex_values = pd.factorize(df[\"\
  sex\"])\n# Split into a training and holdout dataset\ndf_train = df.sample(frac=0.8,\
  \ random_state=100)\ndf_for_prediction = df[~df.index.isin(df_train.index)]\n# Map\
  \ numeric values to string values\nindex_to_island = dict(enumerate(island_values))\n\
  index_to_species = dict(enumerate(species_values))\nindex_to_sex = dict(enumerate(sex_values))\n\
  # View the mapped island, species, and sex data\nprint(index_to_island)\nprint(index_to_species)\n\
  print(index_to_sex)\n```\n\n### 创建 BigQuery 数据集。\n\n在以下代码片段中：\n\n1.  代码行 `bq_dataset_id\
  \ = f\"{project_id}.dataset_id_unique\"` 通过连接 `project_id` 变量和字符串 `\".dataset_id_unique\"\
  ` 创建了一个表示 BigQuery 数据集 ID 的字符串。\n2.  代码行 `bq_dataset = bigquery.Dataset(bq_dataset_id)`\
  \ 使用数据集 ID 字符串创建了一个 BigQuery 数据集对象。\n3.  代码行 `bq_client.create_dataset(bq_dataset,\
  \ exists_ok=True)` 使用 BigQuery 客户端 `bq_client` 在 BigQuery 上创建数据集。`exists_ok` 参数设置为\
  \ `True`，这意味着如果具有相同 ID 的数据集已存在，该方法不会引发错误；相反，它会继续执行代码：\n\n```\n# Create a BigQuery\
  \ dataset\nbq_dataset_id = f\"{project_id}.dataset_id_unique\"\nbq_dataset = bigquery.Dataset(bq_dataset_id)\n\
  bq_client.create_dataset(bq_dataset, exists_ok=True)\n```\n\n#### 创建 Vertex AI 表格数据集\n\
  \n以下代码使用 `df_train` Pandas DataFrame 创建了一个 Vertex AI 表格数据集。`df_train` DataFrame\
  \ 中的数据将用于创建该表格数据集。该数据集将存储在一个标识符为 `\"bq://{bq_dataset_id}.table-unique\"` 的 BigQuery\
  \ 表中，其显示名称为 `\"sample-penguins\"`。\n\n使用 `aiplatform.TabularDataset.create_from_dataframe`\
  \ 方法从 `df_train` DataFrame 创建表格数据集。该方法接受三个参数：\n\n- `df_source`：包含用于创建表格数据集的数据的 Pandas\
  \ DataFrame。\n- `staging_path`：数据将存储到的 BigQuery 表的路径。\n- `display_name`：表格数据集的显示名称。\n\
  \n`bq_dataset_id` 变量用于创建 BigQuery 数据集的标识符。该标识符是一个格式为 `\"{project_id}.dataset_id_unique\"\
  ` 的字符串。使用 `bigquery.Dataset` 类创建一个 BigQuery 数据集对象，并使用 `bq_client.create_dataset`\
  \ 方法通过 `bq_dataset` 对象在 BigQuery 中创建数据集。向 `bq_client.create_dataset` 方法传递了 `exists_ok=True`\
  \ 参数，以指示如果数据集已存在，则不应引发错误，而应直接返回现有数据集。\n\n\n\n#### 创建 Vertex AI 表格数据集\n```python\n\
  dataset = aiplatform.TabularDataset.create_from_dataframe(\n    df_source=df_train,\n\
  \    staging_path=f\"bq://{bq_dataset_id}.table-unique\",\n    display_name=\"sample-penguins\"\
  ,\n)\n```\n\n### 创建训练脚本\n\n1. `import argparse` 导入 `argparse` 模块，用于解析传递给脚本的命令行参数。\n\
  2. `import numpy as np` 导入 `numpy` 模块，并为了方便将其重命名为 `np`。\n3. `import os` 导入 `os`\
  \ 模块，该模块提供了与底层操作系统交互的方法。\n4. `import pandas as pd` 导入 `pandas` 模块，并为了方便将其重命名为 `pd`。\n\
  5. `import tensorflow as tf` 导入 `tensorflow` 模块，并为了方便将其重命名为 `tf`。\n6. `from google.cloud\
  \ import bigquery` 从 `google.cloud` 包中导入 `bigquery` 模块。\n7. `from google.cloud import\
  \ storage` 从 `google.cloud` 包中导入 `storage` 模块。\n8. `training_data_uri = os.getenv(\"\
  AIP_TRAINING_DATA_URI\")` 获取 `AIP_TRAINING_DATA_URI` 环境变量的值，并将其赋值给 `training_data_uri`\
  \ 变量。\n9. `validation_data_uri = os.getenv(\"AIP_VALIDATION_DATA_URI\")` 获取 `AIP_VALIDATION_DATA_URI`\
  \ 环境变量的值，并将其赋值给 `validation_data_uri` 变量。\n10. `test_data_uri = os.getenv(\"AIP_TEST_DATA_URI\"\
  )` 获取 `AIP_TEST_DATA_URI` 环境变量的值，并将其赋值给 `test_data_uri` 变量。\n11. `parser = argparse.ArgumentParser()`\
  \ 创建一个 `argparse.ArgumentParser` 类的实例。\n12. `parser.add_argument('--label_column',\
  \ required=True, type=str)` 添加一个必需的命令行参数 `--label_column`，其类型为 `str`。\n13. `parser.add_argument('--epochs',\
  \ default=10, type=int)` 添加一个命令行参数 `--epochs`，默认值为 10，类型为 `int`。\n14. `parser.add_argument('--batch_size',\
  \ default=10, type=int)` 添加一个命令行参数 `--batch_size`，默认值为 10，类型为 `int`。\n15. `args\
  \ = parser.parse_args()` 解析命令行参数，并将它们存储在 `args` 变量中。\n16. `LABEL_COLUMN = args.label_column`\
  \ 将 `LABEL_COLUMN` 变量设置为 `--label_column` 参数的值。\n17. `PROJECT_NUMBER = os.environ[\"\
  CLOUD_ML_PROJECT_ID\"]` 获取 `CLOUD_ML_PROJECT_ID` 环境变量的值，并将其赋值给 `PROJECT_NUMBER`\
  \ 变量。\n18. `bq_client = bigquery.Client(project=PROJECT_NUMBER)` 创建一个 `bigquery.Client`\
  \ 类的实例，并将 `PROJECT_NUMBER` 作为项目参数。\n\n```python\n%%writefile task.py\nimport argparse\n\
  import numpy as np\nimport os\nimport pandas as pd\nimport tensorflow as tf\nfrom\
  \ google.cloud import bigquery\nfrom google.cloud import storage\n\n#### 读取环境变量\n\
  training_data_uri = os.getenv(\"AIP_TRAINING_DATA_URI\")\nvalidation_data_uri =\
  \ os.getenv(\"AIP_VALIDATION_DATA_URI\")\ntest_data_uri = os.getenv(\"AIP_TEST_DATA_URI\"\
  )\n\n#### 读取参数\nparser = argparse.ArgumentParser()\nparser.add_argument('--label_column',\
  \ required=True, type=str)\nparser.add_argument('--epochs', default=10, type=int)\n\
  parser.add_argument('--batch_size', default=10, type=int)\nargs = parser.parse_args()\n\
  \n#### 设置训练变量\nLABEL_COLUMN = args.label_column\n\n# 关于权限问题，请参阅 https://cloud.google.com/vertex-ai/docs/workbench/managed/executor#explicit-project-selection\n\
  PROJECT_NUMBER = os.environ[\"CLOUD_ML_PROJECT_ID\"]\nbq_client = bigquery.Client(project=PROJECT_NUMBER)\n\
  ```\n\n接下来，以下代码执行以下步骤：\n\n1. 它定义了一个函数 `download_table`，该函数接受一个 BigQuery 表 URI 作为参数。\n\
  2. 在函数内部，第一步是移除 `bq_table_uri` 中可能存在的 `\"bq://\"` 前缀。\n3. 然后，它将 BigQuery 表下载为 Pandas\
  \ DataFrame。\n4. 之后，它使用 `download_table` 函数下载三个独立的数据集 `df_train`、`df_validation`\
  \ 和 `df_test`。\n5. 随后，定义了一个名为 `convert_dataframe_to_dataset` 的函数，该函数接受两个 DataFrame\
  \ 作为参数。第一个 DataFrame 对应训练数据，第二个 DataFrame 代表验证数据。\n6. 在函数内部，第一步是分离输入数据和标签数据。这是通过使用\
  \ `.pop` 方法完成的。\n7. 然后将输入数据转换为 Numpy 数组，并使用 `tf.keras.utils.to_categorical` 将标签数据转换为独热表示。\n\
  8. 最后，使用 `tf.data.Dataset.from_tensor_slices` 将训练数据和验证数据都转换为 TensorFlow 数据集。\n9.\
  \ 最终，该函数返回训练数据和验证数据的 TensorFlow 数据集。\n10. 代码随后调用 `convert_dataframe_to_dataset`\
  \ 函数，并将 `df_train` 和 `df_validation` 作为参数，以创建 `dataset_train` 和 `dataset_validation`\
  \ 数据集。\n\n```python\n#### 下载一个表\ndef download_table(bq_table_uri: str):\n    # 如果存在，移除\
  \ bq:// 前缀\n    prefix = \"bq://\"\n    if bq_table_uri.startswith(prefix):\n  \
  \      bq_table_uri = bq_table_uri[len(prefix) :]\n\n    # 将 BigQuery 表下载为 dataframe\n\
  \    # 这需要在自定义训练服务账号上拥有 \"BigQuery Read Session User\" 角色。\n    table = bq_client.get_table(bq_table_uri)\n\
  \    return bq_client.list_rows(table).to_dataframe()\n\n#### 下载数据集拆分\ndf_train\
  \ = download_table(training_data_uri)\ndf_validation = download_table(validation_data_uri)\n\
  df_test = download_table(test_data_uri)\n\ndef convert_dataframe_to_dataset(\n \
  \   df_train: pd.DataFrame,\n    df_validation: pd.DataFrame,\n):\n    df_train_x,\
  \ df_train_y = df_train, df_train.pop(LABEL_COLUMN)\n    df_validation_x, df_validation_y\
  \ = df_validation, df_validation.pop(LABEL_COLUMN)\n\n    y_train = np.asarray(df_train_y).astype(\"\
  float32\")\n    y_validation = np.asarray(df_validation_y).astype(\"float32\")\n\
  \n    # 转换为 numpy 表示\n    x_train = np.asarray(df_train_x)\n    x_test = np.asarray(df_validation_x)\n\
  \n    # 转换为独热表示\n    num_species = len(df_train_y.unique())\n    y_train = tf.keras.utils.to_categorical(y_train,\
  \ num_classes=num_species)\n    y_validation = tf.keras.utils.to_categorical(y_validation,\
  \ num_classes=num_species)\n\n    dataset_train = tf.data.Dataset.from_tensor_slices((x_train,\
  \ y_train))\n    dataset_validation = tf.data.Dataset.from_tensor_slices((x_test,\
  \ y_validation))\n\n    return (dataset_train, dataset_validation)\n\n#### 创建数据集\n\
  dataset_train, dataset_validation = convert_dataframe_to_dataset(df_train, df_validation)\n\
  ```\n\n接下来，以下代码是一个用于训练机器学习模型的脚本。它包含以下步骤：\n\n1. **打乱训练集**：使用 `tf.data.Dataset` 类的\
  \ `shuffle` 函数对 `dataset_train` 进行打乱。`shuffle` 的参数是 `df_train` 数据框中的元素数量。\n2. **创建模型**：`create_model`\
  \ 函数使用 TensorFlow 的 `Sequential` 类创建模型架构。该架构包含五个使用 ReLU 激活函数的全连接层和一个 softmax 输出层。第一层有\
  \ 100 个神经元，第二层有 75 个神经元，第三层有 50 个神经元，第四层有 25 个神经元，输出层有三个神经元，代表类别数量。模型使用 `Sequential`\
  \ 类的 `compile` 函数进行编译，使用分类交叉熵损失、准确率指标和 RMSprop 优化器。\n3. **批量处理数据集**：使用 `tf.data.Dataset`\
  \ 类的 `batch` 函数，以指定的批次大小对 `dataset_train` 和 `dataset_validation` 数据集进行分批处理。批次大小通过\
  \ `args.batch_size` 参数指定。\n4. **训练模型**：使用 `Sequential` 类的 `fit` 函数在 `dataset_train`\
  \ 数据上训练模型，使用指定的训练轮数 `args.epochs`，并将 `dataset_validation` 作为验证数据。\n\n\n\n5. **保存模型**：使用\
  \ TensorFlow 的 `tf.saved_model.save` 函数将训练好的模型保存到磁盘，保存路径由 `os.getenv(\"AIP_MODEL_DIR\"\
  )` 环境变量指定。\n\n```\n#### 打乱训练集\ndataset_train = dataset_train.shuffle(len(df_train))\n\
  def create_model(num_features):\n#### 创建模型\nDense = tf.keras.layers.Dense\nmodel\
  \ = tf.keras.Sequential(\n[\nDense(\n100,\nactivation=tf.nn.relu,\nkernel_initializer=\"\
  uniform\",\ninput_dim=num_features,\n),\nDense(75, activation=tf.nn.relu),\nDense(50,\
  \ activation=tf.nn.relu),\nDense(25, activation=tf.nn.relu),\nDense(3, activation=tf.nn.softmax),\n\
  ]\n)\n#### 编译 Keras 模型\noptimizer = tf.keras.optimizers.RMSprop(lr=0.001)\nmodel.compile(\n\
  loss=\"categorical_crossentropy\", metrics=[\"accuracy\"], optimizer=optimizer\n\
  )\nreturn model\n#### 创建模型\nmodel = create_model(num_features=dataset_train._flat_shapes[0].dims[0].value)\n\
  #### 设置数据集\ndataset_train = dataset_train.batch(args.batch_size)\ndataset_validation\
  \ = dataset_validation.batch(args.batch_size)\n#### 训练模型\nmodel.fit(dataset_train,\
  \ epochs=args.epochs, validation_data=dataset_validation)\ntf.saved_model.save(model,\
  \ os.getenv(\"AIP_MODEL_DIR\"))\n```\n\n输出将是 `Writing task.py`。\n\n**为训练脚本定义参数。**\n\
  \n以下代码设置了机器学习训练任务的配置：\n\n- 第一行 `JOB_NAME` 将训练任务的名称设置为 `\"custom_job_unique\"`。\n\
  - 接下来的两行 `EPOCHS` 和 `BATCH_SIZE` 指定了训练过程中要使用的轮数和批次大小。\n- `CMDARGS` 变量是一个列表，包含将传递给训练脚本的命令行参数。本例中传递了三个命令行参数：\n\
  \  1. `\"--label_column=\" + LABEL_COLUMN`：指定包含标签数据的列名。该参数的值取自 `LABEL_COLUMN` 变量。\n\
  \  2. `\"--epochs=\" + str(EPOCHS)`：设置训练过程中要使用的轮数。该值取自 `EPOCHS` 变量。\n  3. `\"--batch_size=\"\
  \ + str(BATCH_SIZE)`：设置训练过程中要使用的批次大小。该值取自 `BATCH_SIZE` 变量。\n\n```\nJOB_NAME = \"\
  custom_job_unique\"\nEPOCHS = 20\nBATCH_SIZE = 10\nCMDARGS = [\n\"--label_column=\"\
  \ + LABEL_COLUMN,\n\"--epochs=\" + str(EPOCHS),\n\"--batch_size=\" + str(BATCH_SIZE),\n\
  ]\n```\n\n**训练并部署模型。**\n\n以下代码在 Google Cloud AI Platform 上创建了一个自定义训练任务——使用 `aiplatform.CustomTrainingJob`\
  \ 类来指定训练任务的详细信息。\n\n该训练任务包含以下参数：\n\n- `display_name`：一个字符串，指定训练任务的名称。本例中，值为 `\"\
  custom_job_unique\"`。\n- `script_path`：一个字符串，指定包含训练代码的脚本路径。本例中，值为 `\"task.py\"`。\n\
  - `container_uri`：一个字符串，指定用于训练的 Docker 容器镜像。本例中，值为 `\"us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-8:latest\"\
  `，这是一个版本为 2.8 的 TensorFlow CPU 镜像。\n- `requirements`：一个字符串列表，指定训练所需的 Python 包。本例中，列表包含两个包：`\"\
  google-cloud-bigquery>=2.20.0\"` 和 `\"db-dtypes\"`。\n- `model_serving_container_image_uri`：一个字符串，指定训练后用于提供模型服务的\
  \ Docker 容器镜像。本例中，值为 `\"us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest\"\
  `，这是一个用于服务的版本为 2.8 的 TensorFlow CPU 镜像。\n\n代码执行后，`job` 变量将包含 `CustomTrainingJob`\
  \ 的实例：\n\n```\njob = aiplatform.CustomTrainingJob(\ndisplay_name=JOB_NAME,\nscript_path=\"\
  task.py\",\ncontainer_uri=\"us-docker.pkg.dev/vertex-ai/training/tf-cpu.2-8:latest\"\
  ,\nrequirements=[\"google-cloud-bigquery>=2.20.0\", \"db-dtypes\"],\nmodel_serving_container_image_uri=\"\
  us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-8:latest\",\n)\n```\n\n在以下代码片段中，`MODEL_DISPLAY_NAME`\
  \ 变量被定义为 `\"penguins_model_unique\"`。此字符串用作训练过程中将创建的 AI Platform 模型的显示名称。\n\n然后，代码调用了\
  \ `job` 对象上的 `run` 方法，该对象代表 AI Platform 中的一个自定义训练任务。`run` 方法用于启动训练过程。\n\n传递给 `run`\
  \ 方法的参数如下：\n\n- `dataset`：一个 BigQuery 数据集对象，代表用于训练的数据。\n- `model_display_name`：一个字符串，代表训练期间将创建的\
  \ AI Platform 模型的显示名称。此字符串被赋值为 `MODEL_DISPLAY_NAME` 变量的值。\n- `bigquery_destination`：一个字符串，代表在\
  \ BigQuery 中存储 AI Platform 模型的目标位置。目标位置指定为 BigQuery URI，并使用 `project_id` 变量来构建该\
  \ URI。\n- `args`：一个字符串列表，代表要传递给自定义训练脚本的命令行参数。此参数的值被赋值为 `CMDARGS` 变量的值，该变量是一个字符串列表，定义了要使用的标签列、训练轮数和批次大小。\n\
  \n```\nMODEL_DISPLAY_NAME = \"penguins_model_unique\"\n#### 启动训练并创建模型\nmodel = job.run(\n\
  dataset=dataset,\nmodel_display_name=MODEL_DISPLAY_NAME,\nbigquery_destination=f\"\
  bq://{project_id}\",\nargs=CMDARGS,\n)\n```\n\n等待直到你看到输出 `CustomTrainingJob run\
  \ completed`。\n\n以下代码定义了一个变量 `DEPLOYED_NAME`，它被赋值为字符串 `\"penguins_deployed_unique\"\
  `。这是已部署模型的显示名称。\n\n然后，代码调用了 `model` 对象上的 `deploy` 方法，并将已部署模型的显示名称作为参数传递。`deploy`\
  \ 方法创建一个端点，用于基于训练好的模型提供预测。该端点以显示名称 `DEPLOYED_NAME` 保存，并作为 `endpoint` 变量返回：\n\n```\n\
  DEPLOYED_NAME = \"penguins_deployed_unique\"\nendpoint = model.deploy(deployed_model_display_name=DEPLOYED_NAME)\n\
  ```\n\n**进行预测。**\n\n**准备预测测试数据**：以下代码从数据框 `df_for_prediction` 中移除了 `\"species\"\
  ` 列。这可能是因为物种列是模型训练要预测的标签或目标列。使用训练好的模型进行预测时不需要物种列。\n\n接下来，代码将数据框 `df_for_prediction`\
  \ 转换为 Python 列表 `test_data_list`。这可能是为了准备数据以使用部署的模型进行预测。使用数据框的 `values` 属性将数据框转换为\
  \ Numpy 数组，然后使用 `tolist()` 方法将 Numpy 数组转换为列表：\n\n```\n#### 移除物种列\ndf_for_prediction.pop(LABEL_COLUMN)\n\
  #### 将数据转换为 Python 列表\ntest_data_list = df_for_prediction.values.tolist()\n```\n\
  \n**发送预测请求：** 最后，代码通过调用 `endpoint` 上的 `predict()` 方法并将 `test_data_list` 作为 `instances`\
  \ 的参数传递来进行预测。预测结果存储在 `predictions` 变量中，可以通过调用 `predictions.predictions` 来访问：\n\n\
  ```\n# 获取预测结果。\npredictions = endpoint.predict(instances=test_data_list)\n#### 查看预测结果\n\
  predictions.predictions\n```\n\n输出应如下所示：\n\n```\n[[0.323929906, 0.0947248116, 0.58134526],\n\
  [0.300531268, 0.0670630634, 0.632405639],\n[0.349939913, 0.146268025, 0.503792107],\n\
  ```\n\n\n\n以下代码使用`Numpy`的`argmax`方法为每组输入数据找到最佳预测。`predictions.predictions`是一个`Numpy`数组，包含每个实例（即每一行）输入数据的预测类别概率。`np.argmax(predictions.predictions,\
  \ axis=1)`返回沿指定轴（此处`axis=1`表示沿每一行）最高值的索引，从而有效地为每个实例提供预测类别。结果数组`species_predictions`表示基于输入数据的企鹅物种最佳预测：\n\
  \n```\n# Get the prediction for each set of input data.\nspecies_predictions = np.argmax(predictions.predictions,\
  \ axis=1)\n# View the best prediction for the penguin characteristics in each row.\n\
  species_predictions\n```\n\n输出应如下所示：\n\n```\narray([2, 2, 2, 2, 2, 2, 2, 2, 2, 2,\
  \ 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,\n2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,\
  \ 2, 2, 2, 2, 2, 2, 2, 2,\n2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,\
  \ 2, 2, 2, 2,\n2])\n```\n\n**清理资源。**\n\n您可以删除项目，这将释放与其关联的所有资源（您可以使用`Google Cloud\
