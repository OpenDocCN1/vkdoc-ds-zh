  \n**图 3-7** 使用 Looker Studio 进行数据探索\n\nBigQuery 沙盒是一个简单直观的工具，为开始使用 BigQuery 并熟悉其功能提供了绝佳途径。基于\
  \ Web 的界面和公共数据集使得开始运行查询和学习该工具变得非常容易。\n\n\n\n### BigQuery ML\n\n`BigQuery ML` 是 Google\
  \ Cloud 的 `BigQuery` 中的一项功能，它允许您直接在 `BigQuery` 内构建机器学习模型，而无需将数据移出 `BigQuery`。这意味着您可以使用\
  \ `BigQuery ML` 对存储在 `BigQuery` 中的大型数据集进行机器学习模型训练。\n\n`BigQuery ML` 支持多种类型的机器学习模型，包括线性回归、逻辑回归、K-Means\
  \ 聚类和矩阵分解。您可以使用 `BigQuery` 中的 SQL 语法来创建和评估您的机器学习模型，这使得已经熟悉 SQL 的数据分析师和开发人员能够轻松上手。\n\
  \n与需要将数据移出 `BigQuery` 的传统机器学习方法相比，使用 `BigQuery ML` 的好处包括更快的训练时间、更低的成本以及更高的准确性。此外，由于\
  \ `BigQuery ML` 运行在 Google 的基础设施上，它可以处理非常大的数据集，因此对于拥有大量数据的组织来说是一个不错的选择。\n\n总的来说，`BigQuery\
  \ ML` 提供了一种快速且经济高效的方式，在完全托管的环境中构建和部署机器学习模型。\n\n接下来，您将找到一个全面的教程，该教程将引导您完成使用 `BigQuery\
  \ ML` 的每一步，以利用之前在 Colab 中创建的 `Pandas DataFrame` 生成一个分类模型。要重新生成数据集，请在 Colab 上执行提供的代码：\n\
  \n```\nimport pandas as pd\nimport numpy as np\n#### Generate random features\n\
  np.random.seed(0)\nn_samples = 1000\nn_features = 5\nX = np.random.randn(n_samples,\
  \ n_features)\n#### Generate random target\nnp.random.seed(1)\ny = np.random.randint(0,\
  \ 2, n_samples)\n#### Combine the features and target into a data frame\ndf = pd.DataFrame(np.hstack((X,\
  \ y[:, np.newaxis])), columns=[\"feature_1\", \"feature_2\", \"feature_3\", \"feature_4\"\
  , \"feature_5\", \"target\"])\n#### Save the data to a CSV file\ndf.to_csv(\"data.csv\"\
  , index=False)\n```\n\n您可以在 Colab 文件中找到 `data.csv`。下载该文件并将其保存到您的计算机上。\n\n**创建 BigQuery\
  \ 数据集：** 转到 Google Cloud 控制台，选择 `BigQuery`，然后创建一个新的 `BigQuery` 数据集。\n\n**将数据上传到\
  \ BigQuery：** 转到 `BigQuery 编辑器` 并创建一个新表。然后，通过点击“创建表”并选择“上传”来将数据上传到此表。选择包含数据的文件，并为列选择适当的选项。\n\
