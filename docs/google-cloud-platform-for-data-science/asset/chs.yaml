  3.  单击导航菜单并转到`AI Platform`。\n4.  在`AI Platform`下，选择`Custom Training Jobs`。\n5. \
  \ 单击您创建并想要删除的自定义训练作业的名称。\n6.  在作业详情页面上，单击`Delete`按钮。在提示时确认删除。\n7.  转到导航菜单中的`AI Platform`并选择`Models`。\n\
  8.  选择您要移除的模型名称，并单击它。\n9.  在模型详情页面上，单击`Delete`按钮。在提示时确认删除。\n10. 转到导航菜单中的`BigQuery`。\n\
