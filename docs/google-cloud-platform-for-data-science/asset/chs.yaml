  \n一张体重与年龄的散点图，显示了几个散落的点。\n\n**图 2-9** 生成的年龄-体重分布图\n\n\n\n### 在 Colaboratory 上运行机器学习模型\n\
  \n以下是一个使用 Python 和 `scikit-learn` 库构建机器学习模型的示例。首先，如果你没有数据，可以使用以下代码生成数据。该代码会生成随机特征和随机目标数组，然后将它们合并成一个\
  \ Pandas DataFrame，以便进行进一步的分析或建模：\n\n```\nimport pandas as pd\nimport numpy as np\n\
  #### 生成随机特征\nnp.random.seed(0)\nn_samples = 1000\nn_features = 5\nX = np.random.randn(n_samples,\
  \ n_features)\n#### 生成随机目标\nnp.random.seed(1)\ny = np.random.randint(0, 2, n_samples)\n\
  #### 将特征和目标合并成一个数据框\ndf = pd.DataFrame(np.hstack((X, y[:, np.newaxis])), columns=[\"\
  feature_1\", \"feature_2\", \"feature_3\", \"feature_4\", \"feature_5\", \"target\"\
  ])\n```\n\n现在，我们将逐行分析这段代码：\n\n1. `import pandas as pd` 和 `import numpy as np`：这两行导入了\
  \ Pandas 和 Numpy 库，它们常用于 Python 中的数据操作和分析。\n\n2. `np.random.seed(0)`：这行代码为 Numpy\
  \ 设置了随机种子，以确保生成的随机数具有可重复性。通过设置特定的种子值（此处为 0），每次运行代码时都会生成相同的随机数集合。\n\n3. `n_samples\
  \ = 1000`：这行代码将生成的样本数量设置为 1000。\n\n4. `n_features = 5`：这行代码将生成的特征数量设置为 5。\n\n5.\
  \ `X = np.random.randn(n_samples, n_features)`：这行代码使用 Numpy 的 `np.random.randn()`\
  \ 函数生成一个形状为 (`n_samples`, `n_features`) 的随机数组。数组中的每个元素都来自标准正态分布（均值为 0，标准差为 1）。\n\
  \n6. `np.random.seed(1)`：这行代码为生成随机目标值设置了一个不同的随机种子值（1）。这确保了目标值与之前生成的特征值不同。\n\n7.\
  \ `y = np.random.randint(0, 2, n_samples)`：这行代码使用 `np.random.randint()` 函数生成了一个长度为\
  \ `n_samples` 的随机整数数组，整数范围在 0 到 1 之间（不含 2）。这代表了分类任务的目标值，每个目标值要么是 0，要么是 1。\n\n8.\
  \ `df = pd.DataFrame(np.hstack((X, y[:, np.newaxis])), columns=[\"feature_1\", \"\
  feature_2\", \"feature_3\", \"feature_4\", \"feature_5\", \"target\"])`：这行代码将特征数组\
  \ (`X`) 和目标数组 (`y`) 合并成一个 Pandas DataFrame。`np.hstack()` 函数将 `X` 和 `y` 数组水平堆叠，然后将合并后的数组传递给\
  \ `pd.DataFrame()` 函数以创建一个 DataFrame。`columns` 参数用于为 DataFrame 指定列名，即特征和目标变量的名称。\n\
  \n现在，我们可以使用以下代码生成一个机器学习模型。该代码从 CSV 文件加载数据集，将其拆分为训练集和测试集，训练一个随机森林分类器，对测试集进行预测，并通过计算准确率来评估模型的性能：\n\
  \n```\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.ensemble\
  \ import RandomForestClassifier\nfrom sklearn.metrics import accuracy_score\n####\
  \ 加载数据集\ndf = pd.read_csv(\"data.csv\")\n#### 将数据拆分为特征 (X) 和目标 (y)\nX = df.drop(\"\
  target \", axis=1)\ny = df[\"target \"]\n#### 将数据拆分为训练集和测试集\nX_train, X_test, y_train,\
  \ y_test = train_test_split(X, y, test_size=0.2)\n#### 训练一个随机森林分类器\nclf = RandomForestClassifier(n_estimators=100)\n\
  clf.fit(X_train, y_train)\n#### 对测试集进行预测\ny_pred = clf.predict(X_test)\n#### 评估模型性能\n\
  accuracy = accuracy_score(y_test, y_pred)\nprint(\"Accuracy:\", accuracy)\n```\n\
  \n让我们逐行分析这段代码：\n\n1. `from sklearn.model_selection import train_test_split`：这行代码从\
  \ `scikit-learn` 库的 `model_selection` 模块中导入了 `train_test_split` 函数。该函数用于将数据集拆分为训练子集和测试子集。\n\
  \n2. `from sklearn.ensemble import RandomForestClassifier`：这行代码从 `scikit-learn`\
  \ 的 `ensemble` 模块中导入了 `RandomForestClassifier` 类。该类代表一个随机森林分类器，这是一种基于决策树的集成模型。\n\
  \n3. `from sklearn.metrics import accuracy_score`：这行代码从 `scikit-learn` 的 `metrics`\
  \ 模块中导入了 `accuracy_score` 函数。该函数用于计算分类模型的准确率。\n\n4. `df = pd.read_csv(\"data.csv\"\
  )`：这行代码使用 Pandas 库的 `read_csv` 函数读取名为 `\"data.csv\"` 的 CSV 文件。CSV 文件的内容被加载到一个名为\
  \ `df` 的 Pandas DataFrame 中。\n\n5. `X = df.drop(\"target\", axis=1)`：这行代码通过从原始 DataFrame\
  \ `df` 中删除 `\"target\"` 列，创建了一个新的 DataFrame `X`。这个 DataFrame 包含了用于训练模型的特征。\n\n6.\
  \ `y = df[\"target\"]`：这行代码通过从原始 DataFrame `df` 中选择 `\"target\"` 列，创建了一个 Series\
  \ `y`。这个 Series 代表了目标变量或与特征对应的标签。\n\n7. `X_train, X_test, y_train, y_test = train_test_split(X,\
  \ y, test_size=0.2)`：这行代码使用 `train_test_split` 函数将数据拆分为训练集和测试集。特征 `X` 和目标 `y` 作为参数传入，同时还有\
  \ `test_size` 参数，该参数指定了用于测试的数据比例（此处为 20%）。\n\n8. `clf = RandomForestClassifier(n_estimators=100)`：这行代码创建了一个包含\
  \ 100 棵决策树的 `RandomForestClassifier` 类的实例。`n_estimators` 参数决定了随机森林中树的数量。\n\n9. `clf.fit(X_train,\
  \ y_train)`：这行代码在训练数据（`X_train` 和 `y_train`）上训练随机森林分类器（`clf`）。分类器学习数据中的模式和关系，以便进行预测。\n\
  \n10. `y_pred = clf.predict(X_test)`：这行代码使用训练好的分类器（`clf`）对测试数据（`X_test`）进行预测。预测的标签存储在\
  \ `y_pred` 变量中。\n\n11. `accuracy = accuracy_score(y_test, y_pred)`：这行代码通过比较预测标签（`y_pred`）与测试集的真实标签（`y_test`）来计算模型的准确率。准确率得分存储在\
  \ `accuracy` 变量中。\n\n12. `print(\"Accuracy:\", accuracy)`：这行代码在控制台打印准确率得分，表明模型在测试数据上的表现如何。\n\
  \n\n\n### 在生产环境中部署模型\n\n如果你想部署一个 `scikit-learn` 模型，可以使用 `joblib` 库来保存模型，然后通过 REST\
  \ API 来提供模型服务。以下代码安装了 `joblib` 和 `Flask` 库，使用 `joblib` 将训练好的模型保存到文件，并设置了一个 `Flask`\
  \ 应用来提供模型预测服务。代码定义了 `/predict` 端点，当向该端点发送请求时，模型会被加载，进行预测，并将结果以 JSON 响应形式返回。\n\n\
  你可以使用诸如 Google Cloud Platform 或 Amazon Web Services 之类的云服务来托管 REST API，并使你的应用程序能够获取预测结果。以下是具体操作示例：\n\
  \n1.  **安装 joblib 库：**\n\n```\n!pip install joblib\n```\n\n2.  **保存模型：**\n\n```\n\
  import joblib\nmodel = clf # 你训练好的模型\n#### 保存模型\njoblib.dump(model, '/content/drive/My\
  \ Drive/Colab Notebooks/model.joblib')\n```\n\n3.  **使用 Flask 提供模型服务：**\n\n```\n\
  !pip install flask\nfrom flask import Flask, request\nimport joblib\napp = Flask(__name__)\n\
  @app.route(\"/predict\", methods=[\"POST\"])\ndef predict():\n    data = request.json[X_test]\n\
  \    model = joblib.load('/content/drive/My Drive/Colab Notebooks/model.joblib')\n\
  \    predictions = model.predict(data)\n    print(predictions)\n    return {'predictions':\
  \ predictions.tolist()}\nif __name__ == \"__main__\":\n    app.run()\n```\n\n此示例使用\
  \ `Flask` 库将模型作为 REST API 提供服务。你可以通过向 `/predict` 端点发送一个包含输入数据的 POST 请求来测试该 API。\n\
  \n现在，我们逐行分析代码：\n\n1.  **`!pip install joblib`**：此行使用 `pip` 包管理器安装 `joblib` 库。`joblib`\
  \ 是一个 Python 库，用于 Python 对象（包括模型）的序列化和反序列化。\n\n2.  **`import joblib`**：此行导入 `joblib`\
  \ 模块，该模块提供了保存和加载模型的函数。\n\n3.  **`model = clf`**：此行将训练好的模型 (`clf`) 赋值给 `model` 变量。它假设\
  \ `clf` 是训练好的模型对象。\n\n4.  **`joblib.dump(model, '/content/drive/My Drive/Colab Notebooks/model.joblib')`**：此行使用\
  \ `joblib.dump()` 函数将模型保存到名为 `model.joblib` 的文件中。该文件将保存在指定的目录路径 `/content/drive/My\
  \ Drive/Colab Notebooks/` 下。\n\n5.  **`!pip install flask`**：此行使用 `pip` 包管理器安装 `Flask`\
  \ Web 框架。`Flask` 是一个流行的用于构建 Web 应用的 Python 框架。\n\n6.  **`from flask import Flask,\
  \ request`**：此行从 `flask` 模块导入 `Flask` 类。同时导入了 `request` 对象，它允许访问传入 HTTP 请求中的数据。\n\
  \n7.  **`app = Flask(__name__)`**：此行创建了一个名为 `app` 的 `Flask` 应用实例。\n\n8.  **`@app.route(\"\
  /predict\", methods=[\"POST\"])`**：此行装饰了接下来的函数，使其能够处理对 `/predict` 端点发起的 HTTP POST\
  \ 方法请求。\n\n9.  **`def predict():`**：此行定义了一个名为 `predict` 的函数，当向 `/predict` 端点发起请求时，该函数将被执行。\n\
  \n10.  **`data = request.json[X_test]`**：此行从发送到 `/predict` 端点的请求中检索 JSON 数据。它假设\
  \ JSON 数据包含 `X_test` 键。\n\n11.  **`model = joblib.load('/content/drive/My Drive/Colab\
  \ Notebooks/model.joblib')`**：此行使用 `joblib.load()` 函数从文件 `model.joblib` 中加载模型。\n\
  \n12.  **`predictions = model.predict(data)`**：此行使用加载的模型对从请求中获取的数据进行预测。\n\n13. \
  \ **`print(predictions)`**：此行将预测结果打印到控制台。\n\n14.  **`return {'predictions': predictions.tolist()}`**：此行返回一个包含预测结果列表的\
  \ JSON 响应。\n\n15.  **`if __name__ == \"__main__\":`**：此行检查脚本是否作为主模块直接运行。\n\n16.\
  \  **`app.run()`**：此行启动 `Flask` 开发服务器来运行应用程序。\n\n### 从 Colaboratory 访问 GCP 服务和数据\n\
