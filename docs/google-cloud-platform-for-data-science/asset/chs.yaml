- '# 前言


  商业格局正通过整合数据科学和机器学习而发生转变，云计算平台已成为处理和分析海量数据集不可或缺的工具。谷歌云平台（GCP）作为顶级的云计算平台脱颖而出，为数据科学和机器学习提供了广泛的服务。


  本书是一本全面的指南，旨在教你仅使用 GCP 平台提供的免费层级服务来学习数据科学。无论你的职业背景是数据分析师、数据科学家、软件工程师还是学生，本书都提供了一种全面且循序渐进的方法来掌握
  GCP 的数据科学服务。它提供了一份逐步指南，涵盖了从基础概念到高级主题的所有内容，使你能够掌握利用 GCP 进行数据科学的专业知识。


  本书首先介绍了 GCP 及其数据科学服务，包括`BigQuery`、`Cloud AI Platform`、`Cloud Dataflow`、`Cloud Storage`等。你将学习如何设置
  GCP 账户和项目，以及如何使用 Google Colaboratory 创建和运行 Jupyter 笔记本，包括机器学习模型。


  接着，本书涵盖了大数据和机器学习，包括`BigQuery ML`、Google Cloud AI Platform 和`TensorFlow`。在此学习过程中，你将掌握利用`Vertex
  AI`训练和部署机器学习模型的技能，并利用 Google Cloud Dataproc 高效处理大规模数据集的能力。


  然后，本书深入探讨了数据可视化和商业智能，涵盖了 Looker Studio 和 Google Colaboratory。你将熟练使用 Looker Studio
  生成和分发数据可视化图表及报告，并学习构建交互式仪表板的知识。


  本书随后介绍了数据处理和转换，包括 Google Cloud Dataflow 和 Google Cloud Dataprep。你将学习如何在 Cloud Dataflow
  上运行数据处理管道，以及如何使用 Cloud Dataprep 进行数据准备。


  本书还涵盖了数据分析和存储，包括 Google Cloud Storage、Google Cloud SQL 和 Google Cloud Pub/Sub。你将学习如何使用
  Cloud Pub/Sub 进行实时数据流处理，以及如何设置和消费数据流。


  最后，本书涵盖了高级主题，包括使用身份与访问管理（IAM）保护和管理 GCP 资源、使用 Google Cloud Source Repositories 进行版本控制、Dataplex
  和 Cloud Data Fusion。


  总的来说，本书提供了一份全面的指南，教你仅使用 GCP 平台提供的免费层级服务来学习数据科学。它涵盖了平台的基础知识以及适合希望将技能提升到更高水平的个人的高级主题。


  '
- "# 引言\n\n欢迎阅读《谷歌云平台数据科学：大数据、机器学习与数据分析服务速成课程》。在本书中，我们将踏上一段激动人心的旅程，探索用于数据科学的谷歌云平台（GCP）世界。GCP\
  \ 是一个尖端的云计算平台，它彻底改变了我们处理和分析数据的方式，使其成为企业在现代数字格局中解锁宝贵见解和推动创新不可或缺的工具。\n\n作为公认的云计算领导者，GCP\
  \ 提供了一套专门为数据科学和机器学习任务量身定制的全面服务。本书提供了一种渐进且全面的方法，仅利用平台提供的免费层级服务来掌握 GCP 的数据科学服务。无论你是经验丰富的数据分析师、初露头角的数据科学家、软件工程师还是学生，本书都将为你提供利用\
  \ GCP 进行数据科学所需的技能和知识。\n\n## 第 1 章：“GCP 简介”\n\n本章探讨了数据科学和机器学习给商业格局带来的变革性转变。我们强调了云计算平台在处理和分析海量数据集方面的关键作用。然后，我们介绍了\
  \ GCP 作为一个领先的云计算平台，以其专门为数据科学和机器学习任务设计的全面服务套件而闻名。\n\n## 第 2 章：“Google Colaboratory”\n\
  \nGoogle Colaboratory（简称 Colab）是一个用于数据科学的强大云平台。在本章中，我们将深入探讨 Colab 的特性和功能。你将学习如何创建和运行\
  \ Jupyter 笔记本，包括机器学习模型，并利用 Colab 与 GCP 服务的无缝集成。我们还将讨论使用 Colab 进行协作数据分析和实验的好处。\n\n\
  ## 第 3 章：“大数据与机器学习”\n\n本章探讨了 GCP 上的大数据和机器学习世界。我们深入研究了可扩展的数据仓库`BigQuery`及其实际用例。接下来，我们重点介绍`BigQuery\
  \ ML`，它使你能够直接在`BigQuery`中构建机器学习模型。然后，我们聚焦于 Google Cloud AI Platform，你将学习如何训练和部署机器学习模型。此外，我们还介绍了`TensorFlow`，这是一个在\
  \ GCP 上进行深度学习的流行框架。最后，我们探讨了 Google Cloud Dataproc，它有助于高效处理大规模数据集。\n\n## 第 4 章：“数据可视化与商业智能”\n\
  \n有效的数据可视化和商业智能对于传达见解和推动明智决策至关重要。在本章中，我们将深入探讨 Looker Studio，这是一个用于创建和共享数据可视化图表及报告的强大工具。你将学习如何构建能够吸引受众并促进数据驱动决策的交互式仪表板。我们还将探索\
  \ Colab 中的数据可视化，使你能够创建引人注目的数据视觉呈现。\n\n## 第 5 章：“数据处理与转换”\n\n\n\n本章强调了数据处理与转换在数据科学工作流中的重要性。我们将介绍\
  \ Google Cloud Dataflow，这是一项批处理和流数据处理服务。你将学习如何使用 Cloud Dataflow 设计和执行数据处理管道。此外，我们还会介绍\
  \ Google Cloud Dataprep，这是一个用于数据准备和清洗的工具，能够确保数据的质量和完整性。\n\n## 第 6 章：“数据分析与存储”\n\n\
  数据分析与存储在数据科学中扮演着关键角色。本章将深入探讨 Google Cloud Storage 及其在存储和管理数据方面的应用场景。接下来，我们将探索 Google\
  \ Cloud SQL，这是一种关系型数据库服务，能够实现对结构化数据的高效查询和分析。最后，我们将介绍 Google Cloud Pub/Sub，一项实时数据流服务，并指导你如何设置和消费数据流。\n\
  \n## 第 7 章：“高级主题”\n\n在最后一章中，我们将探讨高级主题，以提升你在 GCP 上开展数据科学的专业能力。我们将学习如何使用身份与访问管理（IAM）来保护和管理\
  \ GCP 资源，确保数据的机密性和完整性。我们还会介绍 Google Cloud Source Repositories，这是一个用于代码的版本控制系统。最后，我们将涉及\
  \ Dataplex 和 Cloud Data Fusion 等创新技术，拓展你的数据科学视野。\n\n通过阅读本书，你将全面掌握利用 GCP 进行数据科学的知识和实践技能。你将学会使用各种工具和技术，从海量数据集中提取有价值的见解，训练和部署机器学习模型，并创建富有影响力的数据可视化和报告。\n\
  \n此外，你在 GCP 数据科学领域获得的新专业知识将为你带来众多职业发展机会。无论你是数据分析师、数据科学家、软件工程师还是学生，通过本书获得的技能都将使你成为当今数据驱动世界中的宝贵人才。你可以利用\
  \ GCP 强大的服务来开发端到端的数据解决方案，并将其无缝集成到任何组织的技术生态系统中。\n\n那么，请准备好踏上这段变革之旅，释放 Google Cloud\
  \ Platform 在数据科学领域的全部潜力吧。让我们一起深入探索，共同塑造数据驱动创新的未来！\n\n## 致谢\n\n我们衷心感谢所有在本书写作过程中给予我们支持的人。你们的鼓励、指导以及对我们能力的坚定信念，共同促成了这个项目的完成。\n\
  \n首先，我们要向父母表达最深切的感激之情。是你们无条件的爱、坚定的支持和牺牲，让我们得以追求自己的热爱。你们对我们的坚定信念，一直是我们前进的动力。\n\n\
  我们感谢家人在我们无数个小时的研究、写作和编辑本书期间所给予的理解和耐心。你们的爱与鼓励是我们源源不断的灵感来源。\n\n特别感谢我们的朋友们，感谢你们在这一旅程中给予的鼓励、激励和持续支持。你们对我们的信任，以及在迷茫时刻愿意倾听，都是无比宝贵的财富。\n\
  \n我们还要向导师和同事们表达谢意，他们慷慨地分享了自己的知识和专长，提供了宝贵的见解和反馈，极大地丰富了本书的内容。\n\n最后，我们要向本书的读者致以最深切的感谢。你们对这个主题的兴趣和参与，让我们的所有努力都变得有价值。我们真诚地希望本书能成为你理解和利用技术力量之旅中的宝贵资源。\n\
  \n再次感谢你们坚定不移的支持、爱与鼓励。没有你们每一个人，这本书就不可能问世。\n\n此致，\n\nShitalkumar 和 Sandika\n\n## 关于作者\
  \ 关于技术审校者\n\n\n\n## 1. GCP 简介\n\n在过去的几年里，数据科学的格局在组织管理数据的方式上经历了显著的变革。大数据和机器学习的兴起，使得企业需要存储、处理和分析海量数据。因此，对像\
  \ Google Cloud Platform (GCP) 这样的基于云的数据科学平台的需求激增。\n\n根据 IDC 的一份报告，全球公有云服务市场在 2021\
  \ 年预计增长 18.3%，达到 3049 亿美元。GCP 在该市场中获得了显著的发展势头，成为第三大云服务提供商，市场份额为 9.5%（IDC，2021）。这一增长可归因于\
  \ GCP 提供强大基础设施、数据分析和机器学习服务的能力。\n\nGCP 提供各种数据科学服务，包括数据存储、处理、分析和机器学习。它还提供用于构建和部署应用程序、管理数据库以及保护资源的工具。\n\
  \n让我们看几个迁移到 GCP 并取得显著成果的商业案例：\n\n1.  **家得宝**：家得宝是一家领先的家居装修零售商，希望改善客户的在线搜索体验。他们将搜索引擎迁移到\
  \ GCP，搜索结果速度提升了 50%。这带来了客户满意度 10% 的提升和在线销售额 20% 的增长（Google Cloud，*家得宝*，无日期）。\n\n\
  2.  **Spotify**：流行的音乐流媒体服务 Spotify 将其数据基础设施迁移到 GCP，以应对不断增长的用户群。通过此举，Spotify 的基础设施成本降低了\
  \ 75%，并且每秒处理的用户请求更多（Google Cloud，*Spotify*，无日期）。\n\n3.  **尼尔森**：领先的市场研究公司尼尔森希望提高其数据处理速度和准确性。他们将数据处理迁移到\
  \ GCP，处理时间减少了 60%，从而能够更快地获得洞察并做出更好的决策（Google Workspace，无日期）。\n\n除了上述例子，其他组织也从 GCP\
  \ 的数据科学服务中受益，包括可口可乐、PayPal、汇丰银行和威瑞森。\n\n借助 GCP，数据科学家可以专注于解决复杂的业务问题，而无需担心管理基础设施。例如，考虑一家希望分析客户行为以改进营销策略的零售公司。该公司拥有数百万客户，并从社交媒体、在线购买和调查等各种来源收集海量数据。为了分析这些数据，公司需要一个强大的、基于云的平台来高效地存储和处理数据。GCP\
  \ 可以通过提供可扩展的数据存储（`Google Cloud Storage`）、数据处理（`Google Cloud Dataflow`）和数据分析（`Google\
  \ BigQuery`）来帮助公司实现这一目标。该公司还可以利用机器学习（`Google Cloud AI Platform`）构建能够预测客户行为的模型，并使用\
  \ `Google Cloud AutoML` 来自动化机器学习过程。\n\nGCP 的数据科学服务为从事数据科学领域的个人提供了宝贵的支持。随着对数据科学家需求的持续增长，掌握像\
  \ GCP 这样的云平台的专业知识变得至关重要。根据 Glassdoor 的数据，美国数据科学家的平均年薪为 113,309 美元。此外，Burning Glass\
  \ Technologies 最近的一份报告指出，在过去一年中，明确要求具备 GCP 技能的职位发布数量显著增加了 67%。因此，获取 GCP 知识可以为那些寻求数据科学领域就业机会的人提供显著优势。\n\
  \n本章将介绍 GCP 及其数据科学产品，并引导您完成创建 GCP 账户和项目的过程。\n\n### GCP 及其数据科学服务概览\n\nGoogle Cloud\
  \ Platform (GCP) 的架构旨在为用户提供一个高可用、可扩展且可靠的云计算环境。它基于一个跨越多个地理区域和可用区的分布式基础设施，从而在系统故障或灾难发生时提供冗余和故障转移能力（Sukhdeve，2020）。\n\
  \n在高层面上，GCP 的架构包含以下几个层次：\n\n1.  **基础设施层**：该层包括构成 GCP 数据中心的物理硬件和网络基础设施。它包含运行和管理云服务所需的服务器、存储设备、网络设备和其他组件。\n\
  \n2.  **计算层**：该层包括运行用户应用程序和服务的虚拟机 (VM) 和容器实例。它包含诸如 `Compute Engine`、`Kubernetes\
  \ Engine` 和 `App Engine` 等服务。\n\n3.  **存储层**：该层包括 GCP 提供的各种存储服务，例如 `Cloud Storage`、`Cloud\
  \ SQL` 和 `Cloud Bigtable`。它为多种类型的数据提供可扩展且持久的存储选项。\n\n4.  **网络层**：该层包括 GCP 提供的各种网络服务，例如\
  \ `Virtual Private Cloud (VPC)`、`负载均衡` 和 `Cloud CDN`。它为用户的应用程序和服务提供安全可靠的网络选项。\n\n\
  5.  **管理与安全层**：该层包括 GCP 提供的各种管理和安全服务，例如 `Identity and Access Management (IAM)`、`安全指挥中心`\
  \ 和 `Stackdriver`。它提供了用于管理和保护在 GCP 上运行的应用程序和服务的工具。\n\n通过这种方式，GCP 的架构旨在提供一个灵活且可定制的云计算环境，以满足从初创公司到大型企业的广泛用户需求。\n\
  \nGCP 是一套云计算服务，运行在与 Google 为其终端用户产品（如 Google 搜索和 YouTube）相同的基础设施上（Google Cloud，2023）。\n\
  \n对于数据科学，它提供了多项服务，包括：\n\n*   `BigQuery`：一个完全托管、无服务器的数据仓库解决方案\n*   `Cloud AI Platform`：一套机器学习工具，包括\
  \ `TensorFlow`、`scikit-learn` 和 `XGBoost`\n*   `Cloud Dataflow`：一个用于转换和分析数据的完全托管服务\n\
  *   `Cloud DataLab`：一个用于机器学习和数据科学的交互式开发环境\n*   `Cloud Dataproc`：一个托管的 `Apache Hadoop`\
  \ 和 `Apache Spark` 服务\n*   `Cloud Storage`：一个可扩展、完全托管的对象存储服务\n*   `Cloud Vision\
  \ API`：一个预训练的图像分析 API\n\n这些服务可以组合使用，以构建完整的数据科学解决方案，从数据摄取到模型训练再到部署。教学大纲中提到的许多 GCP\
  \ 数据科学服务都提供免费套餐，可以免费有限度地使用这些服务。以下是这些服务及其各自免费套餐产品的列表：\n\n*   `Google Colaboratory`：完全免费。\n\
  *   `BigQuery`：每月免费处理 1 TB 数据。\n*   `Cloud AI Platform`：免费访问 `AI Platform Notebooks`，其中包括\
  \ `Colaboratory`。\n*   `Looker Studio`：完全免费。\n*   `Cloud Dataflow`：每天免费两个作业小时。\n\
  *   `Cloud Dataprep`：每月免费试用 200 万条记录。\n*   `Cloud Storage`：每月免费 5 GB 标准存储。\n*  \
  \ `Cloud SQL`：免费试用第二代实例，最高 125 MB 存储。\n*   `Cloud Pub/Sub`：免费套餐包括每月 100 万次操作。\n\n\
  **注意**\n\n免费套餐产品可能会发生变化，超出免费套餐的使用量将产生费用。建议查看 GCP 定价页面以获取有关免费套餐产品的最新信息。\n\nGCP 的各种服务可以分类如下：\n\
  \n\n\n1. **计算**：此类别包括用于运行虚拟机（VM）和容器的服务，例如 `Compute Engine`、`Kubernetes Engine` 和\
  \ `App Engine`。\n\n2. **存储**：此类别包括用于存储和管理不同类型数据的服务，例如 `Cloud Storage`、`Cloud SQL`\
  \ 和 `Cloud Datastore`。\n\n3. **网络**：此类别包括用于管理网络资源的服务，例如 `Virtual Private Cloud (VPC)`、`Cloud\
  \ Load Balancing` 和 `Cloud DNS`。\n\n4. **大数据**：此类别包括用于处理和分析大型数据集的服务，例如 `BigQuery`、`Cloud\
  \ Dataflow` 和 `Cloud Dataproc`。\n\n5. **机器学习**：此类别包括用于构建和部署机器学习模型的服务，例如 `Cloud AI\
  \ Platform`、`AutoML` 和 `AI Building Blocks`。\n\n6. **安全**：此类别包括用于管理和保护 GCP 资源的服务，例如\
  \ `Identity and Access Management (IAM)`、`Cloud Key Management Service (KMS)` 和\
  \ `Cloud Security Command Center`。\n\n7. **管理工具**：此类别包括用于管理和监控 GCP 资源的服务，例如 `Stackdriver`、`Cloud\
  \ Logging` 和 `Cloud Monitoring`。\n\n8. **开发者工具**：此类别包括用于在 GCP 上构建和部署应用程序的服务，例如 `Cloud\
