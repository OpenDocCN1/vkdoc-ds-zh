  \n![](img/606032_1_En_3_Fig4_HTML.png)\n\n沙盒页面的截图。它显示了点击 `open this query` 按钮后的\
  \ Google Trends 演示查询。\n\n**图 3-4** Google Trends 演示查询\n\n**选择数据集：** 点击数据集的名称以选择它，并查看其架构和表。在此示例中，使用了\
  \ `bigquery-public-data.google_trends.top_terms` 表。\n\n**编写查询：** 要编写查询，请点击导航菜单中的\
  \ `Query Editor` 选项卡。在查询编辑器中，使用 BigQuery 的类 SQL 语法编写查询，然后点击 `Run Query` 按钮来执行它。以下查询使用\
  \ `bigquery-public-data.google_trends.top_terms` 表中的数据，检索每日热门 Google 搜索词列表：\n\n\
  ```\n-- 此查询显示每日热门 Google 搜索词列表。\nSELECT\nrefresh_date AS Day,\nterm AS Top_Term,\n\
  -- 这些搜索词每天在美国排名前 25。\nrank,\nFROM `bigquery-public-data.google_trends.top_terms`\n\
  WHERE\nrank = 1\n-- 仅选择每天排名第一的搜索词。\nAND refresh_date >= DATE_SUB(CURRENT_DATE(),\
  \ INTERVAL 2 WEEK)\n-- 筛选最近两周的数据。\nGROUP BY Day, Top_Term, rank\nORDER BY Day DESC\n\
  -- 按日期倒序显示。\n```\n\n以下是该查询的分解说明：\n\n`SELECT` 语句指定了结果集中要包含的列。它选择了 `refresh_date`\
  \ 列并将其别名为“Day”，`term` 列别名为“Top_Term”，以及 `rank` 列。\n\n`FROM` 子句指定了要从中检索数据的表 `bigquery-public-data.google_trends.top_terms`。\n\
  \n`WHERE` 子句根据特定条件过滤数据。在此例中，它仅包含 `rank` 列等于 1 的行，表示每天的排名第一的搜索词。它还通过将 `refresh_date`\
  \ 列与 `DATE_SUB(CURRENT_DATE(), INTERVAL 2 WEEK)` 的结果进行比较，来过滤数据以仅包含过去两周的记录，该函数从当前日期减去两周。\n\
  \n`GROUP BY` 子句按“Day”、“Top_Term”和 `rank` 列对结果集进行分组。这确保了这些列的每个组合在结果集中只出现一次。\n\n`ORDER\
  \ BY` 子句根据“Day”列按降序对结果集进行排序。这意味着最近的日期将首先显示。\n\n简而言之，该查询检索了过去两周内每天的排名第一的 Google 搜索词，并按时间倒序呈现，首先显示最近的日期。\n\
  \n**查看查询结果：** 查询执行后，您将在 `Results` 选项卡中看到结果。您也可以通过点击 `Save` 按钮来保存查询。\n\n**重复此过程：**\
