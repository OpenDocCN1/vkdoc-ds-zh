  \ `BigQuery ML` 文档。\n\n\n\n### Google Cloud AI 平台及其功能\n\nGoogle Cloud AI 平台是一个先进的云原生平台，专为机器学习模型的开发、部署和管理而设计。它提供了一系列全面的工具和服务，用于促进机器学习模型的训练和部署，同时还具备监控和优化模型性能的功能。其显著能力包括：\n\
  \n-   **模型训练：** Google Cloud AI 平台提供了多种用于训练机器学习模型的工具，例如 `TensorFlow`、`PyTorch` 和\
  \ `scikit-learn`。\n-   **模型部署：** 模型训练完成后，可以将其部署到平台上以提供预测服务。它支持部署到多种环境，包括 Google\
  \ Cloud、本地服务器和边缘设备。\n-   **机器学习工作流：** Google Cloud AI 平台提供了多种用于自动化机器学习工作流的工具，例如构建、训练和部署模型。\n\
  -   **监控与管理：** Google Cloud AI 平台提供了用于监控已部署模型性能以及管理模型所用资源的工具。\n-   **协作与共享：** 该平台提供了用于共享和协作处理机器学习模型的功能，包括版本控制、团队管理和访问控制。\n\
  \n总而言之，Google Cloud AI 平台为大规模构建、部署和管理机器学习模型提供了一套全面的解决方案。\n\n以下是关于如何使用 Google Cloud\
  \ AI 平台的分步教程：\n\n-   **设置 Google Cloud 账户：** 如果您还没有 Google Cloud 账户，请创建一个。这将使您能够访问\
  \ Google Cloud AI 平台及其所有其他服务。\n-   **创建项目：** 在 Google Cloud 控制台中，为您的机器学习模型创建一个新项目。这里将是您存储模型及其所有相关资源的地方。\n\
  -   **上传数据：** 将您的数据上传到 Google Cloud Storage。您的机器学习模型将在此处存储和访问数据。\n-   **创建训练作业：**\
  \ 转到 Google Cloud 控制台的 AI Platform 部分，创建一个新的训练作业。选择您要训练的模型类型，并配置训练参数，例如迭代次数和批次大小。\n\
  -   **启动训练作业：** 点击“训练”按钮启动训练作业。训练作业将在云端运行，并使用您的数据来训练机器学习模型。\n-   **监控训练作业：** 您可以从\
  \ Google Cloud 控制台的 AI Platform 部分监控训练作业的进度。这将向您展示模型的准确率如何随时间提升。\n-   **评估模型：**\
  \ 训练作业完成后，可以通过评估各种指标（包括准确率、精确率和召回率）来评估其性能。这有助于全面了解模型的表现。\n-   **部署模型：** 一旦您对模型的性能感到满意，就可以将其部署到\
  \ Google Cloud AI 平台。这将允许您向用户提供来自该模型的预测服务。\n-   **监控已部署的模型：** Google Cloud AI 平台提供了用于监控已部署模型性能的工具。可以利用这些工具来验证模型性能是否符合预期，并据此进行必要的修改。\n\
  -   **维护模型：** 随着时间的推移，随着新数据的出现，您的模型可能需要重新训练或更新。Google Cloud AI 平台提供了用于更新和维护模型的工具，以确保其持续良好运行。\n\
  \n以上信息提供了关于 Google Cloud AI 平台使用的广泛概述。但请注意，具体步骤和过程的细节可能会因所构建的模型类型以及所使用的数据而异。\n\n\
  Google Cloud AI 平台提供了多种用于与其服务交互的工具：\n\n-   **Google Cloud 控制台：** 该控制台是一个基于 Web 的图形用户界面，用于有效管理您的\
  \ Google Cloud 资源，包括 AI Platform。它使您能够轻松创建、管理和监控各种 AI Platform 服务和资源，例如 AI 模型和数据集。\n\
  -   **Google Cloud SDK：** 一个用于管理 Google Cloud 资源（包括 AI Platform）的命令行界面。您可以使用 SDK\
  \ 来自动化常见任务，例如部署 AI 模型和管理资源。\n-   **REST API：** 一个使用 HTTP 请求与 AI Platform 进行交互的编程接口。REST\
  \ API 允许您以编程方式访问 AI Platform 服务和资源，从而轻松地将 AI Platform 集成到您现有的工作流中。\n-   **Google\
  \ Cloud 客户端库：** 用于以流行编程语言（如 Python 和 Java）访问 AI Platform 服务的预编写代码库。客户端库简化了与 AI Platform\
  \ 集成的过程，并使构建使用 AI Platform 服务的应用程序更加容易。\n-   **Jupyter Notebook：** 一个用于编写和运行代码的基于\
  \ Web 的交互式环境。您可以使用 Jupyter Notebook 来探索和分析数据、构建和测试 AI 模型，以及执行其他数据科学任务。Jupyter Notebook\
  \ 与 AI Platform 集成，使得使用 AI Platform 服务和资源变得容易。\n-   **Google Cloud AI Platform Notebooks：**\
  \ 一个在 Google Cloud 上运行的托管式 Jupyter Notebook 环境。借助 AI Platform Notebooks，您可以轻松访问和运行\
  \ AI Platform 服务和资源，而无需设置自己的 Jupyter Notebook 环境。\n-   **Vertex AI Workbench：**\
  \ 一个基于 Web 的集成开发环境 (IDE)，用于在 Google Cloud 上构建和部署机器学习模型。Vertex AI Workbench 为构建和训练模型提供了用户友好的界面，并支持流行的机器学习框架，如\
  \ `TensorFlow` 和 `PyTorch`。\n-   **Deep Learning VM：** 一个预配置的虚拟机镜像，为开发和部署深度学习模型提供了完整的环境。Deep\
  \ Learning VM 包含流行的深度学习框架，如 `TensorFlow` 和 `PyTorch`，以及一系列用于数据处理和分析的工具。\n\n借助您可用的多样化工具集，您可以根据个人和团队的需求，以适合自己的方式与\
  \ AI Platform 进行交互。这些工具提供了多种选择，使您能够根据具体需求和个人偏好选择最合适的工具。\n\n\n\n### 使用 Vertex AI\
  \ 训练和部署机器学习模型\n\n`Vertex AI` 由 OpenAI 开发，是一个用于构建和启动机器学习模型的综合性平台。它通过抽象底层技术的复杂性，为数据科学家、工程师和开发者简化了流程。`Vertex\
  \ AI` 提供了一个用户友好的界面，简化了机器学习模型的使用，并集成了预构建模型和工具，用于数据准备、模型选择、训练和部署等关键任务。利用 `PyTorch`\
  \ 和 `TensorFlow` 等流行的机器学习框架，`Vertex AI` 促进了跨多种应用的模型开发，包括图像分类、自然语言处理和推荐系统。\n\n它取代了多项旧版服务，包括：\n\
  \n- **Cloud AutoML**：如前所述，`Cloud AutoML` 正被 `Vertex AutoML` 取代。`Vertex AutoML` 为构建和部署机器学习模型提供了更精简、更集成的体验。\n\
  - **Cloud ML Engine**：`Vertex AI` 平台正在取代 `Cloud ML Engine`。`Vertex AI` 平台提供与 `Cloud\
  \ ML Engine` 类似的功能，但拥有更友好的用户界面和高级特性。\n- **Cloud AI Platform Notebooks**：`Cloud AI\
  \ Platform Notebooks` 正被 `Vertex AI Notebooks` 取代。`Vertex AI Notebooks` 提供与 `Cloud\
  \ AI Platform Notebooks` 相同的功能，但拥有更强大的硬件选项以及与其它 `Vertex AI` 服务的改进集成。\n\nGoogle Cloud\
  \ 此前提供了 `AutoML Tables`，这是一项机器学习服务，使用户无需丰富的编程或数据科学专业知识即可生成自定义模型。然而，旧版 `AutoML Tables`\
  \ 已被淘汰，自 2024 年 1 月 23 日起将无法在 Google Cloud 上访问。\n\n好消息是，旧版 `AutoML Tables` 中所有可用的特性和功能，以及新增内容，现在都可以在\
  \ `Vertex AI` 平台上访问。\n\n`Vertex AI` 平台通过以下几种关键方式与机器学习工作流集成：\n\n- **数据准备**：`Vertex\
  \ AI` 提供了准备和清理数据以用于机器学习模型的工具。这包括数据加载、拆分和预处理。\n  - 利用 `Vertex AI Workbench` 笔记本的功能，有效地探索和可视化数据。`Vertex\
  \ AI Workbench` 与 `Cloud Storage` 和 `BigQuery` 无缝集成，提供对数据的快速访问和处理。\n- 对于大型数据集，从\
  \ `Vertex AI Workbench` 笔记本中使用 `Dataproc Serverless Spark` 来运行 Spark 工作负载，而无需管理您的\
  \ `Dataproc` 集群（Google Cloud，2023）。\n- **模型选择**：在 `Vertex AI` 中，您会找到一系列预构建模型，用于处理常见的机器学习任务，如图像分类、自然语言处理和推荐系统。此外，还可以使用\
  \ `AutoML` 来训练模型，而无需手动编写代码（Blog, Neos Vietnam, n.d.）。这些模型可以直接使用，也可以根据需要进行定制。此外，`Vertex\
  \ AI` 还提供了从头开始创建自定义模型的能力。\n- **训练**：`Vertex AI` 提供了在您的数据上训练机器学习模型的工具。训练过程在平台内进行管理，并且\
  \ `Vertex AI` 提供了监控和早停功能，以确保模型高效且有效地进行训练。\n- **模型评估**：`Vertex AI` 提供了评估已训练模型性能的工具。这包括性能指标，如准确率、精确率和召回率，以及可视化工具，帮助您了解模型的运行情况。\n\
  - **部署**：`Vertex AI` 提供了将训练好的模型部署到生产环境的工具，使您能够使用模型对新数据进行预测。`Vertex AI` 提供了多种部署选项，包括将模型作为\
  \ REST API 提供服务、将其作为函数部署在云平台上，或将其集成到现有应用程序中。\n\n通过以这些关键方式与机器学习工作流集成，`Vertex AI`\
  \ 使数据科学家、工程师和开发者能够更轻松、更高效地构建、训练和部署机器学习模型。\n\n### MLOps，即机器学习运维\n\n`MLOps`，即机器学习运维，指的是在生产环境中管理和扩展机器学习模型的过程。`Vertex\
  \ AI` 通过提供多种工具和功能来帮助管理机器学习模型的部署和操作，从而为 `MLOps` 提供支持。`Vertex AI` 上用于 `MLOps` 的一些关键功能包括：\n\
  \n1. **部署**：`Vertex AI` 提供了将机器学习模型部署到生产环境的工具，使您能够使用模型对新数据进行预测。`Vertex AI` 提供了多种部署选项，包括将模型作为\
  \ REST API 提供服务、将其作为函数部署在云平台上，或将其集成到现有应用程序中。\n2. **监控**：`Vertex AI` 提供了监控已部署模型性能的工具。这包括性能指标，如准确率、精确率和召回率，以及可视化工具，帮助您了解模型在实际使用中的表现。\n\
  3. **版本控制**：`Vertex AI` 提供了版本控制功能，允许您管理模型的多个版本并随时间跟踪更改。这使得在需要时可以回滚到以前的版本，并有助于确保您在模型演变过程中保持对其的控制。\n\
  4. **扩展**：`Vertex AI` 提供了扩展机器学习模型的工具，使其能够处理不断增加的数据量和流量。这包括跨多个 GPU 或云实例部署模型，以及根据需要调整分配给模型的资源的能力。\n\
  \n通过提供这些以及其它用于 `MLOps` 的功能，`Vertex AI` 有助于简化在生产环境中部署和管理机器学习模型的过程。这使得数据科学家、工程师和开发者能够更轻松地专注于开发和改进模型的重要工作，同时仍能保持对模型在实际使用中的控制和可见性。\n\
