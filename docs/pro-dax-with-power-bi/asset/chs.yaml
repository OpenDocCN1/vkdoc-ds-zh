- "# DAX：初识\n\n本书将使用 Git 上提供的\"Wide World Importers\"（WWI）数据模型来演示 DAX 语句，该模型并非过于简单。本章所使用的数据集则更为简单。我认为这对于更好地理解实际发生的情况是必要的。\n\
  \n## 隐式筛选器\n\n在创建第一个 DAX 语句之前，有必要先查看本章所用简单数据模型的基础数据。图 1-3 显示了\"`simple table values`\"\
  表的内容。\n\n![../images/471413_1_En_1_Chapter/471413_1_En_1_Fig3_HTML.jpg](img/471413_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n表 – simple table values\n\n如果将此表用于具有以下设置的矩阵视觉对象：\n\n* `Brand` 列作为行\n\
  * `Color` 列作为列\n* `Amount` 列作为值\n\n你将得到图 1-4 所示的结果（圆形标记除外）。\n\n![../images/471413_1_En_1_Chapter/471413_1_En_1_Fig4_HTML.jpg](img/471413_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\n`simple table values` 矩阵\n\n在 Phil 的著作《*Beginning DAX with Power BI*》中，他解释了\
  \ Power BI 会将行标题`Brand`和列标题`Color`中的值添加到矩阵视觉对象值字段中所用度量的计算上下文中。\n\n#### 注意\n\n源自列标题、行标题或切片器选择的筛选器被称为**隐式筛选器**。这同样适用于簇状柱形图\
  \ x 轴上使用的值（此逻辑可推广到所有其他视觉对象）。\n\n我猜你对`B3`/`red`交叉点显示的值并不感到惊讶，即使我们尚未定义任何度量。只需在数据视图中筛选该表即可轻松验证结果，见图\
  \ 1-5。\n\n![../images/471413_1_En_1_Chapter/471413_1_En_1_Fig5_HTML.jpg](img/471413_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\n`simple table values` – 筛选后的`B3`/`red`\n\n很容易验证`Amount`列中值的总和等于 26。我们可以推断出以下几点：\n\
  \n* 视觉对象会对包含用作值的列（此处为`Amount`列）的表进行筛选。\n* 在应用筛选器后，会使用聚合函数从剩余的两行中计算出值 26。\n\n很明显，聚合函数是`SUM`。`SUM`是数值列用作值时的默认聚合函数。默认函数可以针对每列进行更改，并且至少应进行检查。如有必要，可以在\"\
  建模\"菜单的\"属性\"功能区中更改`默认汇总方式`的值。可以从\"报表\"或\"数据\"视图中访问该函数；必须选中已检查的列。\n\n图 1-6 展示了如何更改所选字段`Amount`的默认汇总方式。\n\
  \n![../images/471413_1_En_1_Chapter/471413_1_En_1_Fig6_HTML.jpg](img/471413_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n列默认聚合函数\n\n\n\n### 说明\n\n如果更改了列的默认汇总方式，则必须先从视觉对象中移除该列，然后再重新添加。\n\n我不得不承认，在很长一段时间里，我一直认为矩阵视觉对象中的每个单元格（包括行和列上的总计值）都会创建一个单独的\
  \ DAX 查询，因为每个单元格的筛选上下文都会发生变化。幸运的是，情况并非如此。其幕后真正发生的事情可以通过 `DAX Studio` 来控制，这是一个主要由\
  \ `sqlbi.com` 和 `Darren Gosbell` 的成员开发的开源工具。`DAX Studio` 是创建 DAX 语句（其格式化功能更智能）以及在你对\
  \ DAX 语句的性能不满意时必不可少的工具。因此，第 12 章“DAX Studio”中描述了 `DAX Studio` 的一些功能——至少是优化性能低下的\
  \ DAX 语句所必需的功能。\n\n为了发现幕后发生了什么，`DAX Studio` 能够捕获由 Power BI Desktop 创建的 DAX 查询，以检索数据来填充视觉对象。\n\
  \n当包含简单矩阵的报表页被激活时，会生成以下 DAX 代码（见清单 1-1）。\n\n```\nDEFINE\nVAR __DS0Core =\nSUMMARIZECOLUMNS(\n\
  ROLLUPADDISSUBTOTAL('simple table values'[Brand], \"IsGrandTotalRowTotal\"),\nROLLUPADDISSUBTOTAL('simple\
  \ table values'[Color], \"IsGrandTotalColumnTotal\"),\n\"SumAmount\", CALCULATE(SUM('simple\
  \ table values'[Amount]))\n)\nVAR __DS0Primary =\nTOPN(\n102,\nSUMMARIZE(__DS0Core,\
  \ 'simple table values'[Brand], [IsGrandTotalRowTotal]),\n[IsGrandTotalRowTotal],\n\
  0,\n'simple table values'[Brand],\n\n)\nVAR __DS0Secondary =\nTOPN(\n102,\nSUMMARIZE(__DS0Core,\
  \ 'simple table values'[Color], [IsGrandTotalColumnTotal]),\n[IsGrandTotalColumnTotal],\n\
  1,\n'simple table values'[Color],\n\n)\nEVALUATE\n__DS0Secondary\nORDER BY\n[IsGrandTotalColumnTotal],\
  \ 'simple table values'[Color]\nEVALUATE\nNATURALLEFTOUTERJOIN(\n__DS0Primary,\n\
  SUBSTITUTEWITHINDEX(\n__DS0Core,\n\"ColumnIndex\",\n__DS0Secondary,\n[IsGrandTotalColumnTotal],\n\
  ASC,\n'simple table values'[Color],\nASC\n)\n)\nORDER BY\n[IsGrandTotalRowTotal]\
  \ DESC, 'simple table values'[Brand], [ColumnIndex]\n清单 1-1\n简单矩阵\n```\n\n我们将在第\
  \ 12 章“DAX Studio”中更详细地探讨这类 DAX 查询。但现在，我只想让你关注 DAX 查询的第一部分。在这里你会看到以下代码片段，它是 DAX\
  \ 函数 `SUMMARIZECOLUMNS` 的一部分。\n\n```\n\"SumAmount\", CALCULATE(SUM('simple table\
  \ values'[Amount]))\n清单 1-2\n隐式度量定义\n```\n\n如果我们自己编写度量，它看起来几乎一样。因此，我们在 *simple table\
  \ values* 表中使用如下 DAX 语句创建一个度量，但没有使用 `CALCULATE` 函数（见清单 1-3）。\n\n```\nSimple SUM\
  \ Amount =\nSUM('simple table values'[Amount])\n清单 1-3\n度量 – Simple SUM Amount\n\
  ```\n\n如果你想要检查结果，你会发现我们检索到了与第一个查询相同的值，但这正是我们所期望的。\n\n但我们真正关心的是第一个度量出现在 Power BI\
  \ 创建的查询中。下面的清单显示了该查询的第一部分。我们可以看到，“自然”列被当作显式定义的度量来处理：\n\n```\nVAR __DS0Core =\nSUMMARIZECOLUMNS(\n\
  ROLLUPADDISSUBTOTAL('simple table values'[Brand], \"IsGrandTotalRowTotal\"),\nROLLUPADDISSUBTOTAL('simple\
  \ table values'[Color], \"IsGrandTotalColumnTotal\"),\n\"SumAmount\", CALCULATE(SUM('simple\
  \ table values'[Amount])),\n\"Simple_SUM_Amount\", 'simple table values'[Simple\
  \ SUM Amount]\n)\n```\n\n到目前为止，你需要相信我，这两种定义是相同的，即使看起来缺少了包裹我们度量的 `CALCULATE` 函数，除非你已经读过\
  \ Phil 的书或其他一些现有的优秀 DAX 书籍。但我们也可以通过移除 `CALCULATE` 并在 `DAX Studio` 中执行查询来证明这两个度量产生完全相同的结果。\n\
  \n在解释什么是显式筛选器之前，我只想稍微修改一下矩阵视觉对象。你可以在报表页“第 1 章 – 隐式筛选器 – b”中找到这个矩阵。除了将应用于查询执行的隐式筛选器之外，我还添加了列\
  \ *Brand* 作为页面级筛选器（只是为了避免与其他报表页产生不必要的干扰）。筛选器设置请见图 1-7。\n\n![../images/471413_1_En_1_Chapter/471413_1_En_1_Fig7_HTML.jpg](img/471413_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n页面级筛选器 Brand 不等于 B4\n\n这是一项重要任务，因为对于报表级筛选器、页面级筛选器以及视觉对象级筛选器的行为存在一些误解。配置如下：移除列\
  \ *Brand* 的值等于 *B4* 的行。清单 1-4 显示了 Power BI Desktop 创建的查询（至少是重要部分）。\n\n```\nVAR __DS0FilterTable\
  \ =\nFILTER(\nKEEPFILTERS(VALUES('simple table values'[Brand])),\n'simple table\
  \ values'[Brand]  \"B4\"\n)\nVAR __DS0Core =\nSUMMARIZECOLUMNS(\nROLLUPADDISSUBTOTAL('simple\
  \ table values'[Brand], \"IsGrandTotalRowTotal\"),\nROLLUPADDISSUBTOTAL('simple\
  \ table values'[Color], \"IsGrandTotalColumnTotal\"),\n__DS0FilterTable,\n\"SumAmount\"\
  , CALCULATE(SUM('simple table values'[Amount]))\n)\n清单 1-4\nFilterTable\n```\n\n\
  这里需要注意的重要一点是创建了一个名为 `__DS0FilterTable` 的变量，该变量将在查询的所有后续部分中使用。\n\n为了更有趣，我将使用第三个报表页“第\
  \ 1 章 – 隐式筛选器 – c”。这个报表页也有相同的页面级筛选器，但此外还有一个同样使用列 `Brand` 的切片器。在这里，我将选择品牌 `B1` 和\
  \ `B2`。图 1-8 显示了报表的外观。\n\n![../images/471413_1_En_1_Chapter/471413_1_En_1_Fig8_HTML.jpg](img/471413_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8\n\n页面级筛选器和切片器\n\n清单 1-5 显示了查询的重要部分。\n\n```\nVAR __DS0FilterTable =\nFILTER(\n\
  KEEPFILTERS(VALUES('simple table values'[Brand])),\nAND(\n'simple table values'[Brand]\
  \ IN {\"B2\",\n\"B1\"},\n'simple table values'[Brand]  \"B4\"\n)\n)\nVAR __DS0Core\
  \ =\nSUMMARIZECOLUMNS(\nROLLUPADDISSUBTOTAL('simple table values'[Brand], \"IsGrandTotalRowTotal\"\
  ),\nROLLUPADDISSUBTOTAL('simple table values'[Color], \"IsGrandTotalColumnTotal\"\
  ),\n__DS0FilterTable,\n\"SumAmount\", CALCULATE(SUM('simple table values'[Amount]))\n\
  )\n清单 1-5\nFilterTable 页面级筛选器和切片器\n```\n\n你可能想知道为什么这让我如此兴奋，或者为什么我觉得变量 `__DS0FilterTable`\
  \ 这么有趣。但答案其实很简单。\n\n不可能创建一个能够显示这三个品牌 Amount 之和的度量。必要的是移除切片器隐式添加的筛选器，但保留来自页面级筛选器的筛选器。要创建这样的度量，就需要在数据模型中预先采取一些预防措施。\n\
  \n### 规则\n\n无法移除来自切片器的筛选器，同时保留来自报表级筛选器或页面级筛选器的筛选器。\n\n\n\n### 显式筛选器\n\n每当我们需要编写度量值时，都必须应对计算上下文的挑战。计算上下文描述了度量值（以及计算列）被计算时所处的上下文。\n\
  \n决定此上下文有两个组成部分：\n\n*   筛选上下文\n*   行上下文\n\n筛选上下文可以非常直观地展现；只需创建一个矩阵视觉对象，你就能欣赏到筛选上下文的全部魅力。行标题和列标题会被添加到\
  \ `FilterTable` 中，代表该单元格上下文中 DAX 公式计算时的筛选上下文。而行上下文有时则不那么明显。即使是创建一个简单的计算列，也可能变得很棘手。每当\
  \ `CALCULATE` 使用多个参数时，我们都需要通过提供显式筛选器来改变筛选上下文。\n\n这一点非常重要，因此我们专门用两个章节来讨论它：第 4 章“这个奇怪的上下文”和第\
  \ 5 章“DAX 中的筛选”。\n\n## 数据建模\n\n## 引言\n\n尽管 Power BI 已经存在相当长一段时间，但数据建模似乎经常被忽视，这意味着很多报表只是基于单个表来施展其魔力。有时，人们会付出巨大的努力从各种来源收集数据以创建一个单表，然后用这个单表来创建吸引人的可视化效果。\n\
  \n但随后，突然间，创建一个度量值似乎变得异常复杂，更糟糕的是，组合而成的度量值却返回了意想不到的结果。\n\n为了充分利用 DAX 的分析潜力，有必要在一定程度上理解表格数据模型的某些方面。本章的主要目标是介绍重要的数据建模方面。\n\
  \n通常，一个 Power BI 项目需要为以下任务提供解决方案：\n\n*   计算年初至今。\n*   计算过去六个月的平均销售额，以便与本月进行比较。\n\
  \n随着时间的推移，这导致了互联网上以及书籍中积累了大量可用的模式。但有时，这些模式无法应用于特定问题，因为需要考虑到一些特殊变化。计算一个名为“过去六个月的平均销售额”的度量值可能具有挑战性，因为可能没有足够的数据点可用，也就是说，对于早期数据点，不存在“过去\
  \ 6 个月”。仅使用可用数据来计算平均值是不够的，因为它无法反映我们的业务场景“6 个月的平均值”，或者不符合我们的业务模型。突然间，计算面临了额外的复杂性。这不仅是要找到计算所需的过去六个月，还涉及到如何在数据不足时避免计算。\n\
  \n如果到目前为止，您仅在单个表上使用 DAX 进行计算，那么本书希望能为您提供一些新思路，并说明为什么开发由多个表组成的数据集几乎是强制性的。\n\n###\
  \ 什么是数据模型？\n\n关于“以数据模型思考”包含三个方面，因此在详细解释这些方面之前，有必要简要说明什么是数据模型，尤其是在 Power BI 中创建数据模型意味着什么。\n\
  \n*   业务流程\n*   逻辑数据模型\n*   技术实现\n\n已经有许多关于数据建模的书籍，它们侧重于不同的主题或专注于特定领域。一些书籍侧重于高层数据建模，即提供概念以在业务人员和\
  \ IT 人员之间建立共同理解。一些书籍侧重于与某个数据库相关的特定方面。还有一些书籍提供了如何将面向业务的数据模型转换为从技术角度适合特定数据库的物理数据模型的技术。\n\
  \n数据模型是对一个或多个业务流程的表示，其目标是描述如何捕获和存储数据，以便能够反映业务流程并回答特定问题。\n\n在分析领域，主要有两种不同的数据模型创建方法：一种称为“雪花模式”，另一种称为“星型模式”。本书并非要争论孰优孰劣，也不是要支持或反对哪一种。商业智能世界中许多贴近业务用户的产品似乎都倾向于使用星型模式建模的数据。Power\
  \ BI、Power Pivot 以及 SQL Server Analysis Services（多维模式和表格模式）对此并无区别。因此，本书重点介绍遵循“星型模式”方法的数据建模。\n\
  \n无论您偏好哪种方法或哪种概念，所有概念至少都有一个共同点：\n\n*   ***一个数据模型由多个表组成。***\n\n强调这个简单的陈述可能看起来很奇怪，因为这似乎是一个普遍真理，但围绕着这个主题——如何以及为什么必须（甚至可以称为强制要求）创建一个数据模型——仍然存在许多问题。\n\
  \n### 星型模式\n\n深入探究分析解决方案的数据建模，迟早会发现星型模式的概念以及维度建模的底层技术。维度建模是一种由 Ralph Kimball 及其\
  \ Kimball 小组的同事（[`www.kimballgroup.com`](http://www.kimballgroup.com)）推广的技术。即使 Kimball\
  \ 小组已不再活跃，其网站内容仍提供着宝贵信息。\n\n这类数据模型的名称来源于组成模型的表可以排列成的形状，如图 2-1 所示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig1_HTML.jpg](img/471413_1_En_2_Fig1_HTML.jpg)\n\
  \n**图 2-1** 星型模式的可视化\n\n图 2-1 展示了来自 pbix 文件“CH 2 – relationships – Star Schema.pbix”的数据模型。使用维度建模技术的数据模型包含两种类型的表：\n\
  \n*   维度表\n*   事实表\n\n维度表表示某个特定的概念或业务对象，例如客户或产品，而事实表则包含在业务对象上下文中的业务流程度量值。这使得可以通过使用维度表进行筛选、切片和切块来分析度量值。在分析数据模型中，常见的维度表包括客户表和产品表。当然，这取决于业务流程的性质。\n\
  \n除了上述业务对象，还有一个基本概念，即时间概念。这个概念，或者更简单地称为日历表，允许将度量值置于时间上下文中，例如：\n\n*   比较现在和过去\n*\
  \   将现在和过去投射到未来\n\n由于时间概念是数据分析的核心，因此在第 9 章“时间智能”中会详细讨论。\n\n### 为什么数据建模很重要\n\n如果前一章所述的所有内容还不足以令人信服，那么现在是时候深入探讨\
  \ Power BI 数据模型的某些方面了。有必要记住，这些细节同样适用于存储数据和评估 DAX 语句的数据库的所有不同版本。我们将使用简单的示例来演示数据模型如何影响查询结果（即符合我们预期的结果）、简化性以及性能。\n\
  \n#### 正确的结果：来自单表的合并筛选器\n\n\n\n#### 注意\n\n本节使用 pbix 文件 `\"CH 2 – Auto-Exists.pbix\"\
  `。\n\nSQL Server Analysis Services 多维（SSAS MD）的重要概念或特性之一便是 **Auto-Exist（自动存在）**，但其中一些细节可能已变得有些模糊。因此，这里做一个回顾。\n\
  \nAuto-Exist 能够防止 SSAS 多维数据在同一个查询中使用同一维度的一个或多个属性时，返回不存在的属性组合。将其对应到 SSAS 表格模型或 Power\
  \ BI 数据模型，可以这样理解：查询不会返回表中（维度）不存在的列（属性）组合。由于 Power BI 数据模型仅包含表，因此将关系一端（关于关系，本章后面会更详细讨论）的表视为按关系多端进行筛选的表，是一种合理的思路。\n\
  \n这里的关键点是，这个概念在 Power BI 中同样存在，当然在 Power Pivot 和 SSAS 表格模型中也是如此。即使目前尚不明显，始终考虑这一事实依然很重要。\n\
  \n以下 SQL 语句（参见列表 2-1）用于从 Wide World Importers DW 数据库的三个代表表中创建一个视图。\n\n```sql\nCREATE\
  \ VIEW\n[Fact].[v_sales_singletable]\nAS\nSELECT\ndimDate.[Calendar Year]\n,   \
  \   i.Size\n,      COUNT(f.[Sale Key]) AS NoOfSales\nFROM [Fact].[Sale] AS f\nINNER\
  \ JOIN Dimension.Date AS dimDate ON\nf.[Invoice Date Key] = dimDate.Date\nINNER\
  \ JOIN Dimension.[Stock Item] AS i ON\nf.[Stock Item Key] = i.[Stock Item Key]\n\
  GROUP BY\ndimDate.[Calendar Year]\n,      i.size\n```\n\n*列表 2-1* Auto-Exist – SingleTable\n\
  \n数据已导入到 Power BI 文件 `\"CH 2 – Auto-Exists.pbix\"`。图 2-2 展示了该表的列。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig2_HTML.jpg](img/471413_1_En_2_Fig2_HTML.jpg)\n\
  \n*图 2-2* 单表\n\n该表展示了不同日历年（Calendar Year）下各种产品尺寸（Size）的销售订单数量（NoOfSales）。此表仅用于证明一个观点：在某些情况下，DAX\
  \ 语句可能不会返回预期结果。即使该表只是反映了来自不同业务对象（产品和时间）的两个列的随机组合，但在实际应用中，这种情况迟早都可能发生。不幸的是，这个隐藏问题不会立即显现，但一旦需要在更大的数据集上回答更复杂的问题，意外结果或错误结果就可能导致错误决策。\n\
  \n下一张截图显示了报告页面“Ch 02 – Auto Exist and a Single Table”的一小部分。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig3_HTML.jpg](img/471413_1_En_2_Fig3_HTML.jpg)\n\
  \n*图 2-3* 单表基础报告\n\n假设需要定义以下度量值来回答一些业务问题：\n\n-   一个度量值，用于计算当前选择中的尺寸数量\n-   一个度量值，用于计算不依赖于年份选择的尺寸数量\n\
  \n这些度量值的示例可视化效果见图 2-4。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig4_HTML.jpg](img/471413_1_En_2_Fig4_HTML.jpg)\n\
  \n*图 2-4* 单表基础报告 – 度量值\n\n列表 2-2 和 2-3 展示了用于定义度量值的 DAX 语句。\n\n```\ndistinct # of\
  \ sizes = \nDISTINCTCOUNT('Fact v_sales_singletable'[Size])\n```\n\n*列表 2-2* Auto-Exist\
  \ – SingleTable, 不同的尺寸数量\n\n```\ndistinct # of sizes all time = \nCALCULATE(\n[distinct\
  \ # of sizes]\n,ALL('Fact v_sales_singletable'[Calendar Year])\n)\n```\n\n*列表 2-3*\
  \ Auto-Exist – SingleTable, 度量值 2, 所有时间的不同尺寸数量\n\n从列表 2-3 可以看出，在 `CALCULATE(...)`\
  \ 内部，使用了 `ALL(...)` 函数来移除 `Calendar Year` 列上的任何现有筛选器。第 5 章“DAX 中的筛选”将详细解释所有筛选的复杂性。因此，这里仅作如下说明：DAX\
  \ 函数 `CALCULATE(...)` 允许修改现有的筛选上下文。这意味着 `CALCULATE` 函数的第一个参数（表达式）将在应用所有其他参数以更改现有筛选上下文之后进行计算。用于修改现有筛选上下文的\
  \ DAX 函数之一是 `ALL`。`ALL` 可以移除整个表或单个列上的现有筛选上下文。\n\n在图 2-4 中，两个度量值都返回值 `3`。即使我们选择 `Calendar\
  \ Year : 2016`，这一点也成立，只是矩阵视觉对象的内容会根据当前选择进行调整。但是，如果我们从切片器中选择 `Calendar Year : 2015`，度量值\
  \ `\"distinct # of sizes all time\"` 的值也会发生变化（见图 2-5）。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig5_HTML.jpg](img/471413_1_En_2_Fig5_HTML.jpg)\n\
  \n*图 2-5* 单表基础报告 – 错误预期\n\n从预期角度来看，并根据对度量值 `distinct # of sizes all time` 工作方式的解释，预期结果应为\
  \ `3`，因为无论从切片器中选择哪一年，该度量值都应返回尺寸数量。\n\n要理解发生了什么，有必要捕获 Power BI 生成并发送到数据模型以填充每个视觉对象的\
  \ DAX 查询。为此，需要用到 DAX Studio。DAX Studio 不仅对于优化 DAX 语句至关重要，而且对于理解内部机制以及真正领会相似 DAX\
  \ 函数之间的细微差别也必不可少。因此，第 12 章“DAX Studio”将讨论如何使用 DAX Studio 来更好地理解 DAX 并优化 DAX 语句。\n\
  \n\n\n#### 注意\n\n务必牢记，每个视觉对象都由其自身的 DAX 查询生成。单个报表页面上使用的视觉对象越多，生成的 DAX 查询也越多。\n\n\
  话虽如此，让我们直接深入探究从切片器中选择`日历年份：2015`时传递的 DAX 语句。\n\n```\nDEFINE\nVAR __DS0FilterTable\
  \ =\nTREATAS({2015}, 'Fact v_sales_singletable'[Calendar Year])\nVAR __DS0FilterTable2\
  \ =\nTREATAS({\"100L\",\n\"10m\",\n\"250g\"}, 'Fact v_sales_singletable'[Size])\n\
  EVALUATE\nSUMMARIZECOLUMNS(\n__DS0FilterTable,\n__DS0FilterTable2,\n\"distinct___of_sizes_all_time\"\
  , IGNORE('Fact v_sales_singletable'[distinct # of sizes all time])\n)\n代码清单 2-4\n\
  自动存在 – 单表，发送的 DAX 查询\n```\n\n如果在 DAX Studio 中执行此 DAX 语句，查询将返回 2。\n\n这是为什么？\n\n答案并不简单，但这是由于函数\
  \ `SUMMARIZECOLUMNS(...)` 所考虑的自动存在概念。如果使用来自同一张表的两个列，则只会返回表中已有的值组合。由于表中不存在 `[日历年份]\
  \ = 2015` 和 `[类别] = 250 克` 的组合，因此计算不重复类别数量的度量只会考虑值 `100 升` 和 `10 米`，正因如此，查询返回了 2。\n\
  \n为了在应用度量之前检查行，有必要重写代码清单 2-4 中的 DAX 查询。该查询将如代码清单 2-5 所示。\n\n```\nEVALUATE\nCALCULATETABLE(\n\
  SUMMARIZE('Fact v_sales_singletable','Fact v_sales_singletable'[Calendar Year],'Fact\
  \ v_sales_singletable'[Size])\n,TREATAS({2015}, 'Fact v_sales_singletable'[Calendar\
  \ Year])\n,TREATAS({\"100L\",\"10m\",\"250g\"}, 'Fact v_sales_singletable'[Size])\n\
  )\n代码清单 2-5\n自动存在 – 单表，重写的 DAX\n```\n\n代码清单 2-5 中的查询返回一个只有两行的表，即使预期结果可能不同，即三行，这取决于度量内部使用的\
  \ `ALL(...)` 函数（见图 2-6）。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig6_HTML.jpg](img/471413_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n单表基础报表 – 考虑的行\n\n#### 注意\n\n如果列来自同一张表，`SUMMARIZE` 和 `SUMMARIZECOLUMNS`\
  \ 将仅返回已有的组合。\n\n我们可能会认为 `ALL(...)` 应该移除切片器选择所应用的筛选器，但我们必须考虑到该表本来就不包含`日历年份 2016`\
  \ 和类别 `250 克`。这是因为不存在的组合已被 `SUMMARIZECOLUMNS` 移除。`ALL` 会移除列 `日历年份` 的现有筛选器，但它不会恢复第三个类别\
  \ `250 克`，因为该类别在 2015 年不存在。\n\n这种行为绝非缺陷，而是其设计如此，并且在几乎所有情况下，这正是我们想要的行为。这种实现是为了优化性能。只有由单表组成的数据模型才可能遇到此问题。\n\
  \n如果我们从一开始就尝试创建合适的星型架构，则可以避免此问题。为此，pbix 文件还包含一个简单的星型架构（见图 2-7）。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig7_HTML.jpg](img/471413_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\n简单的星型架构\n\n为了正确使用此星型架构，我们可以创建一个如代码清单 2-6 所示的度量。\n\n```\n星型架构 所有时间的不同大小数量\
  \ =\nCALCULATE(\n[不同大小的数量]\n,ALL('日历年份'[日历年份])\n)\n代码清单 2-6\n自动存在 – 星型架构，重写的度量\n\
  ```\n\n现在，此度量不是使用来自表 `Fact v_sales_singletable` 的列 `日历年份`，而是将 `ALL(...)` 与来自*维度*表\
  \ `日历年份` 的列结合使用。\n\n如果仔细查看，报表页“CH 02 – 星型架构”正在使用来自两个*维度*表 `日历年份` 和 `类别` 的列。\n\n\
  使用维度建模技术构建的数据模型因此会带来另一个巨大优势，那就是简单性。\n\n### 简单性：关于关系和筛选器传播\n\n#### 注意\n\n本节使用的 pbix\
  \ 文件为“CH 2 – 关系 – 单表.pbix”。\n\n如前所述，分析数据模型中回答不断重复出现的问题的最重要概念之一，就是随时间变化的度量分析。Power\
  \ BI 报表“CH 2 – 关系 – 单表.pbix”中包含的数据模型有一个度量 `年初至今数量 时间智能`，它被分配给表“Fact Sale”。此度量计算给定年份截至某时间段结束时度量\
  \ `数量` 的总和。此度量的 DAX 语句如代码清单 2-7 所示。\n\n```\n年初至今数量 时间智能 =\nCALCULATE(\nSUM('Fact\
  \ Sale'[Quantity])\n,DATESYTD('维度日期'[Date])\n)\n代码清单 2-7\n星型架构 – 年初至今 时间智能\n```\n\
  \n此度量使用了时间智能函数 `DATESYTD`。\n\n度量 `年初至今数量` 计算相同的结果，但未使用时间智能函数。此度量的 DAX 如代码清单 2-8\
  \ 所示。\n\n```\n年初至今数量 =\nCALCULATE(\nSUM('Fact Sale'[Quantity])\n,FILTER(\nALL('维度日期'[Date])\n\
  ,'维度日期'[Date] <= MAX('维度日期'[Date])\n&& YEAR('维度日期'[Date]) = YEAR(MAX('维度日期'[Date]))\n\
  )\n)\n代码清单 2-8\n星型架构 – 年初至今 基础函数\n```\n\n即使这些 DAX 语句并未揭示任何新内容，但仍然值得一提的是，此度量可以在不同情况下使用，并且无需调整\
  \ DAX 语句。\n\n图 2-8 使这一点更加清晰。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig8_HTML.jpg](img/471413_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\n星型架构 – 时间智能工作（报表页：月份）\n\n\n\n### 说明\n\n以下内容引用了 Power BI 文件 `“CH 2 – relationships\
  \ – One table.pbix”`。\n\n尝试将类似的逻辑（应用时间智能来回答问题）应用于数据模型时，我们会发现无法使用任何时间智能函数。清单 2-9\
  \ 展示了“单表解决方案”调整后的 DAX 语句。\n\n```\nquantity ytd time intelligence =\nCALCULATE(\n\
  SUM('Fact v_starschema_asonetable'[Quantity])\n,DATESYTD('Fact v_starschema_asonetable'[Date])\n\
  )\nListing 2-9\nOne table – ytd time intelligence\n```\n\n图 2-9 表明这行不通。第二个月的累计值与第二个月的非累计值相等。\n\
  \n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig9_HTML.jpg](img/471413_1_En_2_Fig9_HTML.jpg)\n\
  \n**图 2-9**  \n单表 – 时间智能无效\n\n这是由于 `Date` 列未在行上使用（关于筛选实际工作原理的更多细节将在第 5 章“DAX 中的筛选”中揭示）。返回月份编号累计值的\
  \ DAX 语句如清单 2-10 所示。\n\n```\nquantity ytd =\nCALCULATE(\nSUM('Fact v_starschema_asonetable'[Quantity])\n\
  ,FILTER(\nALL(\n'Fact v_starschema_asonetable'[Calendar Month Number]\n,'\n)\n,'Fact\
  \ v_starschema_asonetable'[Calendar Month Number] <= MAX('Fact v_starschema_asonetable'[Calendar\
  \ Month Number])\n)\n)\nListing 2-10\nOne table – ytd base functions month number\n\
  ```\n\n此度量值创建了预期值，如图 2-10 所示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig10_HTML.jpg](img/471413_1_En_2_Fig10_HTML.jpg)\n\
  \n**图 2-10**  \n单表 – 累计月份编号\n\n即使度量值 `“quantity ytd”` 返回了正确且预期的结果，该度量值在许多方面仍不如星型模式的度量值。一旦需要使用\
  \ `Calendar Month Label` 列而不是 `Calendar Month Number` 列作为行标题，当前的度量值就会失效。如图 2-11\
  \ 所示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig11_HTML.jpg](img/471413_1_En_2_Fig11_HTML.jpg)\n\
  \n**图 2-11**  \n单表 – 累计月份标签\n\n如果改用 `Date` 列，也会出现这种情况。基本上，无论使用哪个与日期相关的列，都会发生这种情况。创建一个在单表解决方案中行之有效的\
  \ DAX 语句，无论我们在矩阵视觉对象中使用哪个列作为行标题，或多或少都是简单的。这可以通过在 DAX 语句中考虑每个列来实现。如清单 2-11 所示。\n\n\
  ```\nquantity ytd a little more final =\nCALCULATE(\nSUM('Fact v_starschema_asonetable'[Quantity])\n\
  ,FILTER(\nALL(\n'Fact v_starschema_asonetable'[Calendar Month Number]\n,'Fact v_starschema_asonetable'[Calendar\
  \ Month Label]\n,'Fact v_starschema_asonetable'[Date]\n)\n,'Fact v_starschema_asonetable'[Calendar\
  \ Month Number] <= MAX('Fact v_starschema_asonetable'[Calendar Month Number])\n\
  && 'Fact v_starschema_asonetable'[Date] <= MAX('Fact v_starschema_asonetable'[Date])\n\
  )\n)\nListing 2-11\nOne table – ytd base functions a little more final\n```\n\n\
  为了克服缺少一个专用日历表的限制，可以将所有列放入 `ALL` 函数中。`ALL` 函数内引用的所有列也都用于 `FILTER`（`<filter>`）函数中，至少是其中两列。\n\
  \n不需要在筛选部分也考虑 `Calendar Month Label` 列，因为 `Calendar Month Label` 列和 `Calendar Month\
  \ Number` 列之间存在隐式的一对一关系。\n\n与遵循星型模式方法的数据模型解决方案相比，单表解决方案中度量值复杂性不断增加的原因在于，后者能够利用关系概念和筛选传播。这两个概念将在下一节中详细解释。\n\
  \n#### 关系\n\n### 说明\n\n本节使用 pbix 文件 `“CH 2 – relationships – missing relationships.pbix”`。\n\
  \n一旦我们的数据基于多个表，我们就必须考虑如何关联这些表。数据模型中表之间的关系可以在 Power BI Desktop 的“关系”视图中定义。\n\n在 Power\
  \ BI 文件 `“CH 2 – Star Schema – import from SQL – missing relationships.pbix”` 中，缺少两个关系：\n\
  \n* 维度 库存项目 ➔ 事实 销售\n* 维度 日期 ➔ 事实 销售\n\n在两个表之间定义关系的最简单方法是将一个表中的一列拖拽到另一个表中的相应列。可以通过将\
  \ `Stock Item Key` 列从一个表拖到另一个表的相应列来建立 `Fact Sale` 表和 `Dimension Stock Item` 表之间缺失的关系。选择哪个表作为起点并不重要。\n\
  \n创建关系的另一种方法是使用“管理关系”对话框。可以从“开始”菜单中，使用“关系”功能区的 `Manage Relationships` 命令调出此对话框，如图\
  \ 2-12 所示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig12_HTML.jpg](img/471413_1_En_2_Fig12_HTML.jpg)\n\
  \n**图 2-12**  \n关系 – 管理关系对话框\n\n使用此对话框，可以选择需要创建关系的两个表。图 2-13 演示了如何使用“新建”按钮创建 `Fact\
  \ Sale` 表和 `Dimension Date` 表之间的关系。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig13_HTML.jpg](img/471413_1_En_2_Fig13_HTML.jpg)\n\
  \n**图 2-13**  \n关系 – 使用对话框\n\n图 2-13 中的绿色和紫色圆圈标记了这两个表。蓝色圆圈标记了用于创建两个表之间关系的列。\n\n\
  ### 说明\n\n每个表只能使用一列来建立关系。\n\n`基数`字段中的“多对一 (∗:1)”选择是自动进行的。\n\n#### 筛选传播\n\n\n\n####\
  \ 注意\n\n本节使用的 pbix 文件为 `“CH 2 – relationships – Star Schema.pbix”`。\n\n筛选传播是分析型数据模型中的一个核心概念，不仅适用于\
  \ Power BI 所使用的数据模型，也适用于 Power Pivot、SQL Server Analysis Services 表格模型以及 Azure Analysis\
  \ Services 中的数据模型。因此，必须理解字段 `“Cardinality”`（基数）的可能取值与属性 `“Cross filter direction”`（交叉筛选方向）的取值之间的组合关系，以及这些值如何影响通用可用性，并如何影响度量值的结果。\n\
  \n筛选传播的概念非常简单。如果对一个表进行筛选，例如通过选择一个切片器，筛选后的值将通过关系传播到相关表中。从 `Dimension Calendar`（维度日历）表的\
  \ `Calendar Year Label`（日历年份标签）列中选择值 `CY2014`，会将表筛选（缩减）为所有与该选定值相等的行。\n\n默认情况下，这种传播沿着关系路径，从关系的一端（一）传播到多端（多）。图\
  \ 2-14 将有助于更清楚地说明这一点。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig14_HTML.jpg](img/471413_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14\n\n关系 – 一对多\n\n由于两个表之间的关系是通过列 `‘Dimension Date’[Date]` 和 `‘Fact Sale’[Invoice\
  \ Date Key]` 建立的，因此任何基于 `Dimension Date` 表的切片器筛选出的 `[Date]` 列的值，都会自动传播到多端的表，在本例中即事实表。\n\
  \n这是允许对存储在 Power BI 数据模型（当然也包括所有其他数据模型）中的大量数据进行高效切片和切块操作的关键因素之一。\n\nPower BI 文件\
  \ `“CH 2 – relationships – Star Schema.pbix”` 包含一个名为 `“Filter propagation”`（筛选传播）的报告页面。创建此报告页的目的并非为了使其外观精美，而是为了可视化筛选传播。图\
  \ 2-15 显示了在从切片器中选择了一些值之后的报告页面。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig15_HTML.jpg](img/471413_1_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15\n\n关系 – 筛选传播\n\n报告页面的左侧部分显示了切片器的选择如何与表 `Dimension Date` 交互，而右侧部分则显示了筛选后的表如何与表\
  \ `“Fact Sale”` 交互。这种交互基于筛选传播的概念。\n\n基于关系的筛选传播也可以通过使用 DAX Studio 进行观察。代码清单 2-12\
  \ 显示了一个 DAX 查询，该查询检索了卡片视觉对象的数值，该视觉对象显示了来自事实表 `“Fact Sale”` 的行数。\n\n```\nDEFINE\n\
  VAR __DS0FilterTable =\nTREATAS({\"CY2014\"}, 'Dimension Date'[Calendar Year Label])\n\
  VAR __DS0FilterTable2 =\nTREATAS({\"CY2014-Jul\"}, 'Dimension Date'[Calendar Month\
  \ Label])\nEVALUATE\nSUMMARIZECOLUMNS(\n__DS0FilterTable,\n__DS0FilterTable2,\n\"\
  v_no_of_rows_filtered_in_fact_table\", IGNORE('Fact Sale'[_no of rows filtered in\
  \ fact table])\n)\n代码清单 2-12\n关系 – DAX 与 xmSQL，DAX\n```\n\n尽管之前没有提及，并且将在第 12 章“DAX\
  \ Studio”中更详细地介绍，但现在有必要提及驱动列式内存数据库的两个引擎。它们是存储引擎和公式引擎。请不要被“存储引擎”这个术语所迷惑。这个存储引擎（SE）从\
  \ RAM 而非磁盘中检索数据。可能存在某些情况，与存储引擎相关的任务会触发其他任务，然后这些任务可能会从较慢的硬盘或更快的固态硬盘读取数据，但如果我们使用的是存储在\
  \ Power BI 文件中的数据，则不会出现这种情况。\n\n公式引擎检测需要哪些数据来回答问题，即提供可视化数据和计算复杂表达式所需的结果。存储引擎检索数据，并在需要时将数据传回给公式引擎进行进一步计算。\n\
  \n可以将存储引擎视为“肌肉”，将公式引擎视为“大脑”。这意味着存储引擎能够以极快的速度解决其任务，而公式引擎则能够解决复杂的计算。因此，只要可能，充分利用存储引擎的能力总是一个好主意。DAX\
  \ 优化基本上就是将任务从公式引擎转移到存储引擎。\n\n说到这里，我们将其视为一个简短的介绍。现在回到前面的 DAX 查询。DAX Studio 还提供了一个捕获存储引擎活动的功能。此活动以某种称为\
  \ xmSQL 的 SQL 方言表示。代码清单 2-13 显示了这个查询。\n\n```\nSET DC_KIND=\"AUTO\";\nSELECT\nCOUNT\
  \ (  )\nFROM 'Fact Sale'\nLEFT OUTER JOIN 'Dimension Date' ON 'Fact Sale'[Invoice\
  \ Date Key]='Dimension Date'[Date]\nWHERE\n'Dimension Date'[Calendar Month Label]\
  \ = 'CY2014-Jul' VAND\n'Dimension Date'[Calendar Year Label] = 'CY2014';\n代码清单 2-13\n\
  关系 – DAX 与 xmSQL，xmSQL\n\n```\n\n从代码清单 2-13 所示的 xmSQL 查询中，关键要点是用以定义关系的列之间的 `LEFT\
  \ OUTER JOIN`。\n\n将筛选传播的概念“可视化”为将关联的一端使用的列的值传递到关联的多端列中的过程，会有所帮助。这种值的传递最终会得到一个筛选后的表。在这些“剩余”行上，应用计算行数的度量值。\n\
  \n### 关系基数\n\n关系的基数对于用户体验以及 DAX 函数如何发挥其魔力并利用关系的基数起着重要作用。这将在接下来的章节中进行解释和演示。\n\n\n\
  \n###### 多对一 (∗:1) / 一对多 (1:∗)\n\n具有多方和一方关系的表之间的关系是 Power BI 及相关数据模型中最重要的关系类型。这种关系类型也被称为“强关系”。如果你好奇是否存在弱关系，请继续阅读。\n\
  \n这种关系类型对执行 DAX 查询和评估 DAX 表达式的数据模型的可用性和性能起着重要作用。因此，有必要尽可能多地使用这种关系。\n\n关系（以及由此带来的数据模型性能）可以在我们的\
  \ DAX 语句中加以利用。以下列表展示了一些如何在 DAX 中使用表之间关系的示例。\n\n```\nEVALUATE\nSUMMARIZECOLUMNS(\n\
  'Dimension City'[Sales Territory]\n,'Dimension Stock Item'[Color]\n,\"No of rows\"\
  \n,COUNTROWS('Fact Sale')\n)\n代码清单 2-14\n关系 – DAX, SUMMARIZECOLUMNS\n```\n\n图 2-16\
  \ 显示了在 SQL Server Management Studio (SSMS) 中执行代码清单 2-14 中的 DAX 语句时返回表的一部分。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig16_HTML.jpg](img/471413_1_En_2_Fig16_HTML.jpg)\n\
  \n**图 2-16** – 关系 – DAX, SUMMARIZECOLUMNS\n\n代码清单 2-15 展示了相同的查询，但这次使用了较旧的函数 `SUMMARIZE`。\n\
  \n```\nEVALUATE\nADDCOLUMNS(\nSUMMARIZE(\n'Fact Sale'\n,'Dimension Customer'[Category]\n\
  ,'Dimension Stock Item'[Color]\n)\n,\"No of rows\"\n,COUNTROWS('Fact Sale')\n)\n\
  代码清单 2-15\n关系 – DAX, SUMMARIZE\n```\n\n`SUMMARIZECOLUMNS` 可以被视为 `SUMMARIZE` 的优化版本，速度更快，并且克服了较旧\
  \ `SUMMARIZE` 的一些局限性。然而，在撰写本文时，`SUMMARIZECOLUMNS` 不能在度量值内部使用。因此，你会发现许多度量值仍然在使用 `SUMMARIZE`。\n\
  \n无论使用 DAX Studio 还是 SQL Server Management Studio 执行这两个查询，它们都不会返回相同的结果。这是因为函数 `ADDCOLUMNS(...)`\
  \ 不会隐式创建一个在评估表达式 `COUNTROWS(...)` 时使用的筛选上下文。这可以通过在 `COUNTROWS(...)` 外层包裹 `CALCULATE(...)`\
  \ 来解决。\n\n进一步探究会发现，即使不使用 `ADDCOLUMNS(...)`，而是在 `SUMMARIZE(...)` 内部创建列，`SUMMARIZE`\
  \ 也能返回预期结果。但是必须意识到，在某些情况下这可能会产生意外结果。按预期使用 `SUMMARIZE` 本身就有其难点。这些难点在来自 `sqlbi.com`\
  \ 的杰出人士 Alberto Ferrari 和 Marco Russo 的一篇博文中有所描述：[`www.sqlbi.com/articles/best-practices-using-summarize-and-addcolumns/`](http://www.sqlbi.com/articles/best-practices-using-summarize-and-addcolumns/)。\n\
  \n因此，`SUMMARIZE` 应仅用于对列进行分组。\n\n代码清单 2-16 和 2-17 展示了如何使用 DAX 函数 `RELATED` 和 `RELATEDTABLE`\
  \ 将值从一方“拉取”到多方，或从多方“拉取”到一方。\n\n代码清单 2-16 展示了如何在“Fact Sale”表内部的“计算列”定义中使用 `RELATED(...)`\
  \ 函数。该 DAX 语句将 `Unit Price` 列的值从 `Dimension Stock Item` 表拉取到 `Fact Sale` 表中。语法相当简单，因为会利用现有的关系。\n\
  \n需要记住的是，`RELATED` 需要一个明确的行上下文。因此，它既可以在用于创建计算列的 DAX 语句中使用，也可以在像 `SUMX(...)` 这样的迭代函数内部使用。\n\
  \n```\nSales for 250g items =\nSUMX(\nFILTER(\n'Fact Sale'\n,RELATED('Dimension\
  \ Stock Item'[Size]) = \"250g\"\n)\n,'Fact Sale'[Quantity] * RELATED('Dimension\
  \ Stock Item'[Unit Price])\n)\n代码清单 2-17\n关系 – DAX, RELATEDSUMX\n```\n\n```\nUnit\
  \ Price 2 =\nRELATED('Dimension Stock Item'[Unit Price])\n代码清单 2-16\n关系 – DAX, RELATED\n\
  ```\n\n`...X` 类函数，如 `SUMX(...)` 或 `MINX(...)`，是表迭代函数。这些函数用于遍历表的所有行。代码清单 2-17 展示了如何将\
  \ `RELATED(...)` 与函数 `FILTER(...)` 和 `SUMX(...)` 结合使用。该 DAX 语句计算表“`Fact Sale`”中的\
  \ `[Quantity]` 与 `Dimension Stock Item` 表中的 `[Unit Price]` 的乘积，但仅限于尺寸为 250 克的商品。\n\
  \n`RELATEDTABLE(...)` 的工作方式与 `RELATED` 类似，但也有其自身的特点。`RELATEDTABLE(...)` 返回一个表，该表将现有的行上下文转换为用于评估函数的筛选上下文。\n\
  \n```\nNo of sales =\nCOUNTROWS(\nRELATEDTABLE('Fact Sale')\n)\n代码清单 2-18\n关系 –\
  \ DAX, RELATEDTABLE\n```\n\n代码清单 2-18 中计算列的结果如图 2-17 所示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig17_HTML.jpg](img/471413_1_En_2_Fig17_HTML.jpg)\n\
  \n**图 2-17** – 关系 – DAX, RELATEDTABLE 结果\n\n`RELATEDTABLE` 的工作原理可以通过将代码清单 2-18 中的\
  \ DAX 语句与相应的 SQL 语句进行比较来最好地解释。该语句如代码清单 2-19 所示。\n\n```\nSELECT\nc.[Customer Key]\n\
  ,      c.Customer\n,      COUNT(factsale.[sale key]) AS 'No of Sales'\nFROM\ndimension.customer\
  \ AS c\nLEFT OUTER JOIN fact.Sale AS factsale ON\nfactsale.[Customer Key] = c.[Customer\
  \ Key]\nGROUP BY\nc.[Customer Key]\n,      c.Customer\n代码清单 2-19\n重现 RELATEDTABLE\
  \ 的 SQL 语句\n```\n\n`RELATEDTABLE` 利用了 Dimension Customer 表与 Fact Sale 表之间存在的现有关系。在\
  \ SQL 语句中，对应的部分是 `LEFT OUTER JOIN`。由于 `RELATEDTABLE` 返回一个表，因此当使用 `RELATEDTABLE`\
  \ 创建计算列时，需要创建一个标量值。为此，`RELATEDTABLE` 被包裹在 `COUNTROWS` 内部。\n\n基数为“一对多”或“多对一”的关系是最强大和最重要的关系类型。\n\
  \n### 规则\n\n始终使用 1:∗（一对多）关系。如果你认为不可能，请再想想。如果仍然不可能，则使用不同的基数。\n\n###### 一对一 (1:1)\n\
  \n### 说明\n\n本节使用 `pbix` 文件“CH 2 – relationships – one to one.pbix”。\n\n一对一关系相当不常见，不应使用，因为这些关系不提供任何分析功能。\n\
  \n如果表是从关系数据源导入的，则分析对象的某些上下文可能会被建模到不同的表中。例如，职业和地址可以在两个不同的表中建模。使用一对一关系会妨碍使用强大的一对多关系。强烈建议将两个表合并为一个表。\n\
  \n图 2-18 展示了此类关系的示例。请注意这只是一个示例。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig18_HTML.jpg](img/471413_1_En_2_Fig18_HTML.jpg)\n\
  \n**图 2-18** – 关系 – 一对一 EmployeeFirstName 详细信息\n\n###### 多对多 (∗:∗)\n\n这种关系类型允许关联表，即使用于创建关系的列没有唯一值。\n\
  \n\n\n### 说明\n\n本节使用的 pbix 文件为 `“CH 2 – relationships – many to many.pbix”`。\n\n\
  图 2-19 展示了一个简单的示例，该示例使用了一个仅包含三列和一个 `Customer Hobby (m2m)` 表的简单事实表。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig19_HTML.jpg](img/471413_1_En_2_Fig19_HTML.jpg)\n\
  \n**图 2-19**  \n关系 – 多对多\n\n这些表使我们能够从客户与其爱好的关系以及相应的事实中提取见解。\n\n图 2-20 显示了使用 `Customer`\
  \ 列创建关系时的关系对话框。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig20_HTML.jpg](img/471413_1_En_2_Fig20_HTML.jpg)\n\
  \n**图 2-20**  \n关系 – 多对多，基数\n\n正如警告消息所述，有必要了解一些显著不同的行为，即：\n\n- `RELATED` 不再可用\n\
  - `ALL` 不再移除筛选上下文\n\n除了行为不同外，还需要更改交叉筛选方向的值。这在图 2-21 中展示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig21_HTML.jpg](img/471413_1_En_2_Fig21_HTML.jpg)\n\
  \n**图 2-21**  \n关系 – 多对多，筛选方向\n\n图 2-22 展示了多对多关系的结果。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig22_HTML.jpg](img/471413_1_En_2_Fig22_HTML.jpg)\n\
  \n**图 2-22**  \n关系 – 多对多，多对多结果\n\n为了避免不同的行为，可以创建一个仅使用一对多关系的模型。该模型如图 2-23 所示。\n\n\
  ![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig23_HTML.jpg](img/471413_1_En_2_Fig23_HTML.jpg)\n\
  \n**图 2-23**  \n关系 – 多对多，使用一对多\n\n该模型的结果如图 2-24 所示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig24_HTML.jpg](img/471413_1_En_2_Fig24_HTML.jpg)\n\
  \n**图 2-24**  \n关系 – 多对多，使用一对多后的结果\n\n两个表都为每个客户显示了相同的结果，但两个表之间也存在一个主要区别。使用一对多关系的表显示了爱好\
  \ III 和 IV，即使没有客户在事实表中拥有对应的行。这完全是因为`Hobby`表与事实表没有直接关联。\n\n这个“问题”可以通过将`Hobby`和`Customer`表之间关系的交叉筛选方向从“单向”改为“双向”来解决。这在图\
  \ 2-25 中展示。\n\n![../images/471413_1_En_2_Chapter/471413_1_En_2_Fig25_HTML.jpg](img/471413_1_En_2_Fig25_HTML.jpg)\n\
  \n**图 2-25**  \n关系 – 多对多，使用一对多，双向\n\n使用值为“双向”的关系可能会变得危险，因为如果数据模型变得更大且包含大量表，它们可能成为循环依赖的一部分。\n\
  \n因此，更好的办法是使用一些 DAX。这允许仅使用一对多关系，同时仍能避免 NULL 值。这可以通过使用 DAX 函数 `CROSSFILTER` 来实现。清单\
  \ 2-20 可用于创建此度量值。\n\n```\nAmount (leveraging cross filter direction both) =\nCALCULATE(\n\
  SUM('Fact'[Amount])\n, CROSSFILTER('Hobby'[Customer], 'Customer'[Customer], Both)\n\
  )\n```\n\n**清单 2-20**  \n关系 – 使用 `CROSSFILTER`\n\n只要有可能，建议使用 DAX 而不是将交叉筛选方向值更改为“双向”。\n\
  \n---\n\n"
- "# 3. DAX 沿袭\n\n## 引言\n\n在使用 DAX 计算时，一个需要学习的便捷概念是沿袭（lineage）概念。DAX 沿袭指的是追踪表表达式中的数据来源，回溯到原始物理表的能力。当通过各种\
  \ DAX 函数构建新的表表达式时，新表中的列*可能*包含对最初派生它的原始物理表的引用。\n\nDAX 查询引擎也可以利用沿袭信息，帮助决定在某些情况下生成输出的最优方法是什么。\n\
  \n可以编写包含多代语句的 DAX 计算，这些语句通过一系列步骤处理、聚合和筛选来自物理表的数据。这些语句生成用于构建其他表表达式或用于筛选或与其他物理表合并的表表达式。\n\
  \n当 DAX 引擎需要处理一个计算时，后台会执行许多智能操作，而了解列的沿袭使 DAX 查询引擎能够采用有用的捷径来提高性能，同时又不影响结果的准确性。\n\n\
  ### 说明\n\nDAX 引擎出于语义原因，而不仅仅是为了性能优化，来跟踪列沿袭。性能优化器跟踪与列沿袭相关的其他信息，但不是同一回事。\n\n不思考沿袭也可能编写出复杂的\
  \ DAX 并成功运行，但稍微了解沿袭是什么以及它如何工作，至少可以解释为什么 IntelliSense 有时会在你输入时建议列，而有时却不能。这通常是因为 IntelliSense\
  \ 能够检测到当前代码位置的沿袭状态。\n\n将沿袭视为模型中每个列的族谱是一种理解方式。在任何时候，表表达式中的一列都知道自己是皇族后裔还是美洲原住民酋长的后裔。大多数情况下并没有那么令人兴奋，该列通常是一些不起眼的源系统数据的产物。☺\n\
  \n### 定义\n\n在深入探讨沿袭之前，需要明确两个基本定义，即物理表和表表达式。\n\n#### 物理表\n\n物理表是数据库中任何可以直接使用 `EVALUATE`\
  \ 语句查询的表：\n\n```\nEVALUATE 'Dates'\n```\n\n这些表在 Power BI Desktop 的“报表”、“数据”和“模型”视图中可见。或者，这些表可以像\
  \ DAX 自动生成的日期表一样被隐藏。\n\n物理表存在于内存中，被视为数据模型整体占用空间的一部分。\n\n物理表可以是导入模型的数据，也可以使用 Power\
  \ BI Desktop 功能区上的“新建表”按钮创建。\n\n物理表中的列由 DAX 引擎分配唯一的列标识符，并且与任何其他列都没有沿袭关系。\n\nDAX\
  \ 存储引擎是负责从物理表中检索数据的过程。\n\n\n\n#### 表表达式\n\n表表达式（也称为虚拟表）是临时创建的实体，仅在计算的短暂生命周期中存在。表表达式是任何返回表作为输出的\
  \ DAX 函数的结果。这些表不会影响数据模型（静态时）的整体内存占用，但在计算处理过程中需要它们时，会消耗内存。\n\n当表表达式通过 DAX 函数从物理表创建时，新表中的列通常携带一个引用，指向其派生来源的物理列的唯一列\
  \ ID。此引用在内部存储，并非轻易可见。这些数据可能通过使用 DMV 查询数据模型来查看。通常，这些信息对性能优化没有帮助。\n\n逻辑或物理查询计划可能会在其看似晦涩的输出中提供关于列引用的线索，但同样，这在优化计算时也不太可能有帮助。\n\
  \n## 示例 1\n\n让我们从一个简单的 DAX 函数示例开始，该函数生成一个表表达式，然后逐步分析其组成部分。\n\n考虑清单 3-1 中的以下计算度量，它返回单个值，该值表示由\
  \ `SUMMARIZECOLUMNS` 函数生成的表表达式中的总行数。\n\n```\n我的计算度量 =\nVAR 我的表表达式 1 =\nSUMMARIZECOLUMNS(\n\
  '维度 日期'[日历月标签],\n'维度 日期'[日历年标签],\n\"数量总和\",\nSUM('事实 销售'[数量])\n)\nRETURN\nMAXX(我的表表达式\
  \ 1, [数量总和])\n清单 3-1\n一个表表达式的简单示例\n```\n\n#### 注意\n\n通常，你不应在度量定义中使用 `SUMMARIZECOLUMNS`。清单\
  \ 3-1 中的示例用于演示表表达式。\n\n在此示例中，`SUMMARIZECOLUMNS` 函数返回一个三列的表，该表被分配给 `我的表表达式 1` 变量。由\
  \ `SUMMARIZECOLUMNS` 函数生成的表不是物理表，仅存在于该计算度量的作用域内。一旦计算度量产生其最终输出，存储在 `我的表表达式 1` 变量中的表便会随时间消逝……如同雨中的眼泪。\n\
  \n这个分配给 `我的表表达式 1` 变量的临时表就是一个表表达式。该表有三个可见列，可能还有一个隐藏列用于跟踪每行的标识符。在这三个可见列中，第一列是对 `'维度\
  \ 日期'[日历月标签]` 列的聚合分组。清单 3-1 中使用的语法意味着新列使用与聚合来源列相同的名称创建。重要的是，新列还存储了一个指向其来源原始物理列的引用。在这个例子中，新列与原始列仅相隔一步。\n\
  \n在表表达式中重命名列，不会破坏指向原始列的沿袭引用。存储在表内部的这个元数据引用，正是沿袭的关键。\n\n表表达式中名为 `[日历年标签]` 的第二列，其行为与第一列大致相同。指向\
  \ `'维度 日期'` 表中原始列内部 ID 的引用，会作为元数据存储在表表达式中。\n\n表表达式中最后一个可见列名为 `\"数量总和\"`，它不存储对 `'事实\
  \ 销售'[数量]` 列的内部引用。在沿袭方面，该列被视为原始列，并且不再与 `'事实 销售'[数量]` 列有任何直接关系。\n\n最后，清单 3-1 中的计算度量将存储在\
  \ `我的表表达式 1` 变量中的表表达式传递给 `MAXX` 函数，该函数遍历行数以确定一个单一值，该值代表月份/年份分组中的最大值。使用 Wide World\
  \ Importers 数据集的结果是 270,036。\n\n这个结果意味着数据集中存在 `[日历月标签]` 和 `[日历年标签]` 的 41 种不同组合。此计算度量对\
  \ `[数量]` 列的总计聚合未进行任何操作。\n\n当 `COUNTROWS` 函数将表表达式中的行数减少到单行时，它为计算引入了第二层聚合。查看此计算的探查器跟踪事件时，它只产生一次存储引擎\
  \ (SE) 扫描。图 3-1 显示了 DAX Studio 中此计算的服务器计时。该图确认仅对底层数据库进行了一次 SE 调用。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig1_HTML.jpg](img/471413_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n显示清单 3-1 中查询的服务器计时\n\n尽管 DAX 逻辑暗示逻辑上应执行两次基于表的操作，但仅需一次扫描即可检索数据以满足计算的输出。在这种情况下，当\
  \ DAX 引擎制定满足查询的计划时，考虑的因素之一是查询中使用的每个列之间的基于沿袭的关系，并且在可能的情况下，引擎会生成一个高效的计划，以充分利用单次存储引擎调用。\n\
  \n\n\n### 示例 2\n\n理解 DAX 沿袭工作原理的另一种方法是，将一个表表达式作为另一个表的筛选器。\n\n考虑清单 3-2 中的计算。该计算旨在从\
  \ `'Dimension Date'` 表中生成一份列表，列出属于按月度销量排名前五的月份中的所有日期。第一步是识别数据中排名前五的月份，然后返回数据库，检索属于这五个月份中任意一个月份的所有日期数据。\n\
  \n```\nEVALUATE\nVAR MyTableExpression1 =\nSUMMARIZECOLUMNS(\n'Dimension Date'[Calendar\
  \ Month Label],\n\"Sum of Quantity\",\nSUM('Fact Sale'[Quantity])\n)\nVAR myTableExpression2\
  \ =\nTOPN(\n5,\nMyTableExpression1,\n[Sum of Quantity]\n)\nRETURN\nCALCULATETABLE(\n\
  'Dimension Date',\nmyTableExpression2\n)\n清单 3-2\n使用表表达式作为筛选器以突出沿袭的计算\n```\n\n清单\
  \ 3-2 中的计算是一个多步骤过程，首先创建一个表表达式，将 `'Dimension Date'` 表汇总到日历月份级别。`SUMMARIZECOLUMNS`\
  \ 函数返回一个包含 41 行和 2 列的表表达式，Wide World Importers 数据集中的每个日历月份均在表达式中得到体现。`SUMMARIZECOLUMNS`\
  \ 函数的输出存储在 `MyTableExpression1` 变量中，此时尚未进行筛选以识别前五个月份。\n\n`MyTableExpression2` 变量存储了\
  \ `TOPN` 函数的输出，在此情况下，该函数使用了其第一个参数之前的语句创建的表表达式。后续参数指示 `TOPN` 函数，当按 `[Sum of Quantity]`\
  \ 列排序时，从该表表达式中找出前五行。\n\n这个新的表表达式现在只有五行，但保留了相同的两列。重要的是，新表表达式中的 `[Calendar Month Label]`\
  \ 列包含一个指向 `'Dimension Date'` 表中原始 `[Calendar Month Label]` 列的沿袭引用。这个引用在下一步骤中变得有用，因为它提供了筛选效果。\n\
  \n查询的最后一步是显示 `'Dimension Date'` 表中属于前五个月份中任意一个月份的所有行。`CALCULATETABLE` 函数接受表表达式作为筛选器，在此情况下，`CALCULATETABLE`\
  \ 函数的第一个参数指明，我们应该从完整的 `'Dimension Date'` 表开始，该表包含所有列和全部 1461 行。\n\n第二个参数正是沿袭魔法发生的地方。`MyTableExpression2`\
  \ 变量包含一个具有两列的表表达式。`CALCULATETABLE` 函数识别出，作为筛选器传递的表有一个列与作为第一个参数传递的表共用一个沿袭。一旦识别出公共列，引擎就会为每个公共列（可能不止一个）构建一个值列表，然后这些值被用作基表上的筛选器。\n\
  \n#### 注意\n\nDAX 引擎跟踪列沿袭的主要原因是使用表表达式构建筛选器。\n\n在清单 3-2 所示的示例中，存储引擎对数据库进行了两次调用。\n\n\
  存储引擎的第一次调用对应 `SUMMARIZECOLUMNS` 函数，该函数将输出存储在 `MyTableExpression1` 变量中，在分析器跟踪中捕获的伪\
  \ T-SQL 代码如清单 3-3 所示。该查询没有 `WHERE` 子句，抓取了所有数据。语句没有指定 `GROUP BY` 子句，但 `SELECT` 语句中存在\
  \ `SUM` 函数意味着结果集将按 `[Calendar Month Label]` 列进行分组。请注意，清单 3-3 中的伪 T-SQL 文本还包括表名和列名中的引用编号。\n\
  \n```\nSELECT\n[Dimension Date (12)].[Calendar Month Label (130)]\nAS [Dimension\
  \ Date (12)$Calendar Month Label (130)],\nSUM([Fact Sale (1113)].[Quantity (1150)])\
  \ AS [$Measure0]\nFROM [Fact Sale (1113)]\nLEFT OUTER JOIN [Dimension Date (12)]\n\
  ON [Fact Sale (1113)].[Invoice Date Key (1130)]\n=[Dimension Date (12)].[Date (117)];\n\
  清单 3-3\n清单 3-2 中查询第一部分的 VertiPaq 扫描详情\n```\n\n存储引擎对数据库的第二次调用如清单 3-4 所示。在这个类似伪 T-SQL\
  \ 的示例中，为了将文本适配到单页，已移除了 14 个单独的列名。重要的方面在于：查询有一个 `WHERE` 子句，其中包含一个由五个值组成的列表，这些值被用作\
  \ `'Dimension Date'` 表中 `[Calendar Month Label]` 列的筛选器。这些值是动态创建的，以反映上一步识别出的前五个月份。\n\
  \n清单 3-2 中的原始 DAX 代码从未指定应应用哪些列筛选器。这种筛选是由 DAX 引擎完成的，它识别出在 `CALCULATETABLE` 的筛选器参数中使用的筛选器表里的某一列包含一个沿袭引用列，该列与第一个参数中的一列相匹配。然后，DAX\
  \ 引擎推导出这些列之间的共享值，进而构建一个 `IN` 语句，供存储引擎在第二次调用数据库时使用。\n\n```\nSELECT\n\nFROM [Dimension\
  \ Date (12)]\nWHERE\n[Dimension Date (12)].[Calendar Month Label (130)] IN\n(\n\
  'CY2016-Apr',\n'CY2016-Mar',\n'CY2015-Apr',\n'CY2016-May',\n'CY2015-Jul'\n);\n清单\
  \ 3-4\n清单 3-2 中查询第二部分的 VertiPaq 扫描详情\n```\n\n结果是一个包含 153 行的表，其中包括来自 `'Dimension\
  \ Date'` 的所有 14 列。这 153 行代表基于销量排名前五的月份中的每一天。它们并非数据表中任意位置的 153 行最佳数据。\n\n#### 重命名列\n\
  \n清单 3-2 中 `CALCULATETABLE` 的筛选之所以有效，是因为表表达式中存储了沿袭引用。即使列名被更改，也会产生相同的行为。清单 3-5 中的示例演示了，尽管中间更改了列名，沿袭筛选仍然有效。\n\
  \n```\nEVALUATE\nVAR MyTableExpression1 =\nSUMMARIZECOLUMNS(\n'Dimension Date'[Calendar\
  \ Month Label],\n\"Sum of Quantity\",\nSUM('Fact Sale'[Quantity])\n)\nVAR myTableExpression2\
  \ =\nSELECTCOLUMNS(\nTOPN(\n5,\nMyTableExpression1,\n[Sum of Quantity]\n),\n\"My\
  \ New Columnname\",\n[Calendar Month Label]\n)\nRETURN\nCALCULATETABLE(\n'Dimension\
  \ Date',\nmyTableExpression2\n)\n清单 3-5\n清单 3-2 中查询的修改版本，用于演示 DAX 沿袭中的列重命名\n```\n\
  \n现在，`TOPN` 函数外面包裹了一个 `SELECTCOLUMNS` 函数，该函数用于将 `[Calendar Month Label]` 列有效地重命名为\
  \ `[My New Columnname]`。由 `SELECTCOLUMNS` 函数生成的表表达式中的重命名列，仍然包含对 `'Dimension Date'`\
  \ 中原始列的引用。清单 3-5 中更新的计算与清单 3-2 中的计算结果相同。更改 `[Calendar Month Label]` 列的名称不会破坏 `CALCULATETABLE`\
  \ 函数中的筛选效果。\n\n图 3-2 展示了在计算过程中产生的多代表表达式，其中的箭头显示了表表达式中的列与原始物理表中的列之间的链接。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig2_HTML.jpg](img/471413_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n三个表表达式，其中包含指向其原始列的沿袭箭头\n\n\n\n## 沿袭与行上下文\n\n如之前的示例所示，沿袭最终决定了筛选的工作方式。若沿袭被确认，则筛选生效。若沿袭无法追溯，则该列将不会用于筛选，也不会被筛选。\n\
  \nDAX 沿袭在上下文转换中也扮演着关键角色。\n\n考虑清单 3-6 中的计算，它为 `[Calendar Year]` 列中的每个唯一值返回一行。清单 3-6\
  \ 中的示例恰好有四行。然后在另一列中，为每一年计算一个值，该值表示来自 `'Fact Sale'` 表的 `[Quantity]` 列的总和。\n\n```\
  \ \nEVALUATE\nADDCOLUMNS(\nVALUES('Dimension Date'[Calendar Year]),\n\"Sum of Quantity\"\
  ,\nCALCULATE(\nSUM('Fact Sale'[Quantity])\n)\n)\n清单 3-6\n一个简单的上下文转换示例，用以展示沿袭的作用\n\
  ```\n\n清单 3-6 中查询的结果如图 3-3 所示。每一年在 `[Sum of Quantity]` 列中都有一个不同的值。\n\n在清单 3-6 的计算中，`VALUES`\
  \ 函数输出一个单列表表达式，其沿袭追溯到 `'Dimension Date'[Calendar Year]` 列。`CALCULATE` 函数克隆当前的筛选上下文，并引入所有生效的行筛选。\n\
  \n在 `ADDCOLUMNS` 表所用的基表中，表表达式的第一行有一个筛选器，要求 `[Calendar Year]` 为 2013。此筛选列的沿袭详细信息被传递到由\
  \ `CALCULATE` 语句创建的筛选上下文中，并应用于所有找到的具有相同沿袭的*任何*列。\n\n碰巧的是，扩展后的 `'Fact Sale'` 表已经包含了来自\
  \ `'Dimension Date'` 表的所有列（参见第 5 章“DAX 中的筛选”），并且由于找到了具有共同沿袭的列，因此会在该列上放置一个筛选器，仅考虑值等于\
  \ 2013 的行。\n\n如果用于 `ADDCOLUMNS` 第一个参数的基表包含其他列，这些列的沿袭详细信息也会传递给 `CALCULATE` 函数。任何基于扩展\
  \ `'Fact Sale'` 表中的沿袭信息找到的共同列都会被相应地筛选。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig3_HTML.jpg](img/471413_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n清单 3-6 中查询的结果\n\n### 中断沿袭\n\n通过一系列表表达式维护沿袭可能很方便，但有时你需要中断沿袭。可以使用 `SELECTCOLUMNS`\
  \ 等函数，并借助一个不会改变值但足够复杂、能使函数决定不为原始列添加沿袭引用的 `<expression>` 来实现中断沿袭。\n\n考虑清单 3-7 中的计算，它扩展了清单\
  \ 3-6 中的计算。在此示例中，`VALUES` 函数被包含在 `SELECTCOLUMNS` 函数内部。`SELECTCOLUMNS` 函数从 `VALUES`\
  \ 函数接收一个包含四行、单列的表表达式。\n\n此时，此表表达式中的列包含一个指向 `'Dimension Date'` 中原始列的沿袭引用。\n\n然而，`SELECTCOLUMNS`\
  \ 函数创建了一个新的表表达式，同样只有一列，但用于生成每行值的 DAX 表达式中包含了一个 `+ 0` 语句。这个表达式足以让 `SELECTCOLUMNS`\
  \ 函数仍生成一个包含四行、单列的表表达式，但现在决定不包含对原始物理列的引用。因此，沿袭现在被中断了。\n\n``` \nEVALUATE\nADDCOLUMNS(\n\
  SELECTCOLUMNS(\nVALUES('Dimension Date'[Calendar Year]),\n\"Calendar Year\",\n[Calendar\
  \ Year] + 0\n),\n\"Sum of Quanity\",\nCALCULATE(\nSUM('Fact Sale'[Quantity])\n)\n\
  )\n清单 3-7\n一个修改后的语句，演示了如何在需要时中断沿袭\n```\n\n`CALCULATE` 语句仍然克隆现有的筛选上下文，并从 `ADDCOLUMNS`\
  \ 函数的基表传递行级筛选信息，但由于在 `ADDCOLUMNS` 的基表与扩展 `'Fact Sale'` 表中的任何列之间没有找到共同列，结果如图 3-4\
  \ 所示。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig4_HTML.jpg](img/471413_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n清单 3-7 中查询的结果\n\n尽管在 `SELECTCOLUMNS` 函数中仍然将列命名为“Calendar Year”，但这没有任何效果。由于对扩展后的\
  \ `'Fact Sale'` 表缺少有效的筛选器，意味着第二列中的每一行都反复产生相同的值，该值恰好是整个列的总计。\n\n在此示例中，沿袭之所以被中断，是因为对其加了一个零。要使沿袭包含在输出中，语法需要遵循\
  \ `T[C]` 表示法（即 `'表名'[列名]`），且不做任何修改。在此示例中，使用了零，因为 `[Calendar Year]` 列是数值类型，这足以中断沿袭——但不会改变值。如果核心列使用文本数据类型，则附加一个空字符串具有相同的效果。\n\
  \n### 伪造沿袭\n\n2018 年添加到 DAX 语言中的一个绝佳函数是 `TREATAS` 函数。除其他功能外，此函数专门用于覆盖表表达式中的沿袭详细信息。这种沿袭覆盖功能有点像我有能力让你相信我的曾祖父是英国国王亨利八世。当然，他不是，但如果你是一个下游的\
  \ DAX 函数，我就可以使用 `TREATAS` 函数来愚弄你，让你以为我真的源自这位著名的国王。\n\n#### 语法：\n\n`TREATAS ( <table>\
  \ , <column> [,<column>]… )`\n\n\n\n#### 输出：\n\n`<table expression>`\n\n`TREATAS`\
  \ 的语法要求将表作为第一个参数。该表可以是物理表或表表达式。然后，需要提供的 `<column>` 参数的数量必须与作为第一个参数传递的表中的列数相同。\n\n\
  如果传递给 `TREATAS` 第一个参数的表有四列，则除了表参数之外，还需要传递四个参数。参数的顺序与传递的 `<table>` 中列的顺序匹配，并且它们必须具有相同的数据类型。\n\
  \n参考清单 3-8 中的计算，该计算输出一个旨在按年度汇总 `[Quantity]` 列的表。该计算的 `DEFINE` 部分将一个表表达式存储在一个变量中，该变量旨在用作\
  \ `CALCULATETABLE` 函数的筛选器。`DATATABLE` 函数允许您使用硬编码值创建表表达式。在本例中，存储在 `MyYearFilter`\
  \ 变量中的表表达式只有一列和两行，如图 3-5 所示。\n\n重要的是，此表表达式没有将其链接回数据模型中任何物理表的沿袭信息。通常，表表达式中缺乏任何有用的沿袭会使其作为筛选表毫无用处。\n\
  \n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig5_HTML.jpg](img/471413_1_En_3_Fig5_HTML.jpg)\n\
  \n**图 3-5**\n\n显示清单 3-8 中 `MyYearFilter` 变量的内容\n\n```\nDEFINE\nVAR MyYearFilter\
  \ =\nDATATABLE(\n\"Year\" , INTEGER ,\n{\n{2015},\n{2016}\n}\n)\nMEASURE 'Fact Sale'[Sum\
  \ of Quantity] =\nSUM('Fact Sale'[Quantity])\nEVALUATE\nCALCULATETABLE(\nSUMMARIZECOLUMNS(\n\
  'Dimension Date'[Calendar Year],\n\"Sum of Quantity\",\n[Sum of Quantity]\n),\n\
  MyYearFilter\n)\n清单 3-8\n一个修改后的语句，演示了如何在需要时中断沿袭\n```\n\n在此示例中，`MyYearFilter` 表表达式作为筛选器参数传递给\
  \ `CALCULATETABLE`。然后，将表表达式中每一列的沿袭详细信息与 `'Dimension Date'` 扩展版本中的每一列进行比较。按照现有的代码，没有找到公共列，因此\
  \ `MyYearFilter` 表表达式对 `SUMMARIZECOLUMNS` 列没有筛选效果。清单 3-8 中此代码的输出如图 3-6 所示。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig6_HTML.jpg](img/471413_1_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6**\n\n清单 3-8 中查询的结果\n\n图 3-6 中的结果显示，即使将 `MyYearFilter` 变量传递给 `CALCULATE`\
  \ 函数，它也没有筛选效果，结果集仍然为 `[Calendar Year]` 2013 和 2014 生成了值。最终表没有被筛选为仅包含两年，因为筛选表表达式与正在被筛选的表没有共享沿袭。\n\
  \n要使分配给 `MyYearFilter` 变量的表表达式能够用作筛选器，需要进行的修改是让 `CALCULATETABLE` 函数相信 `MyYearFilter`\
  \ 表表达式中的列确实源自 `'Dimension Date'` 表。实现此目的的一种方法是使用 DAX 在 `MyYearFilter` 中存储一个表表达式，该表达式使用\
  \ `'Dimension Date'` 物理表，从而传递沿袭引用。清单 3-9 展示了此方法的一个版本。\n\n```\nVAR MyYearFilter =\n\
  FILTER(\nVALUES('Dimension Date'[Calendar Year]) ,\n[Calendar Year] IN {2015,2016}\n\
  )\n清单 3-9\n一个修改后的表表达式，使用不间断的沿袭来有效筛选 'Dimension Date' 表\n```\n\n这也可以使用清单 3-10 中所示的\
  \ `TREATAS` 函数来实现。\n\n```\nEVALUATE\nCALCULATETABLE(\nSUMMARIZECOLUMNS(\n'Dimension\
  \ Date'[Calendar Year],\n\"Sum of Quantity\",\n[Sum of Quantity]\n),\nTREATAS(\n\
  MyYearFilter ,\n'Dimension Date'[Calendar Year]\n)\n)\n清单 3-10\n清单 3-8 中修改后的 EVALUATE\
  \ 语句，它使用 TREATAS 更新 MyYearFilter 表表达式的沿袭详细信息\n```\n\n在清单 3-10 的示例中，`TREATAS` 函数被传递给一个\
  \ `MyYearFilter` 变量，该变量包含一个只有两行的单列表表达式。因为这个表表达式只有一列，所以只需要向 `TREATAS` 函数传递一个额外的参数。在此示例中，指定了\
  \ `'Dimension Date'[Calendar Year]` 列。\n\n`TREATAS` 函数输出一个单列表表达式，该表达式现在包含对 `'Dimension\
  \ Date'[Calendar Year]` 表的沿袭引用，即使该表表达式并非由 `'Dimension Date'` 生成。\n\n`CALCULATETABLE`\
  \ 现在使用来自表筛选器参数中列的沿袭来筛选 `SUMMARIZECOLUMNS`。现在找到了匹配项，因此第一个参数中的 DAX 表达式使用 `MyYearFilter`\
  \ 表表达式中的列的值，对 `SUMMARIZECOLUMNS` 函数中的 `'Dimension Date'[Calendar Year]` 列应用筛选器。\n\
  \n新结果如图 3-7 所示。对于清单 3-9 和清单 3-10 中展示的 `FILTER` 和 `TREATAS` 方法，此结果都相同。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig7_HTML.jpg](img/471413_1_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7**\n\n来自清单 3-9 或清单 3-10 的更新查询结果\n\n这种创建包含硬编码值的小型表表达式并使用 `TREATAS` 函数分配沿袭详细信息的技术，是\
  \ Power BI Desktop 在画布上为视觉对象创建 DAX 时使用的方法。\n\n清单 3-8 中显示的示例使用 `DATATABLE` 函数生成新的表表达式。该表也可以使用清单\
  \ 3-11 中所示的更简洁语法来生成。\n\n```\nTREATAS(\n{2015,2016},\n'Dimension Date'[Calendar Year]\n\
  )\n清单 3-11\n展示了一种创建硬编码表表达式的简写方法\n```\n\n在清单 3-11 中，`TREATAS` 函数的第一个参数使用一系列花括号和值来生成一个表。外层的\
  \ `{}` 括号定义了整个表。此方法仅支持具有默认列名 `\"Value\"` 的单列，不能用于生成多列表。\n\n\n\n#### 修复损坏的沿袭\n\n\
  回顾清单 3-7 中的示例，该代码旨在突出显示如何可能破坏沿袭。在这个例子中，一个零被添加到一个整数列中，因此 DAX 函数将输出一个表表达式，且该表达式不包含对其源列的沿袭引用。\n\
  \n清单 3-12 中的示例取自清单 3-7 的代码，并展示了如何使用`TREATAS`函数修复损坏的沿袭。\n\n```\nEVALUATE\nADDCOLUMNS(\n\
  TREATAS(\nSELECTCOLUMNS(\nVALUES('Dimension Date'[Calendar Year]) ,\n\"Calendar\
  \ Year\" ,\n[Calendar Year] + 0\n),\n'Dimension Date'[Calendar Year]\n)      ,\n\
  \"Sum of Quantity\" ,\nCALCULATE(\nSUM('Fact Sale'[Quantity])\n)\n)\n清单 3-12\n基于清单\
  \ 3-7 的代码展示了使用 TREATAS 函数恢复沿袭\n```\n\n在此示例中，`VALUES`函数输出一个单列表表达式。此表表达式中的单个列具有指向源列的沿袭引用。\n\
  \n下一步，`SELECTCOLUMNS`函数获取从`VALUES`函数返回的表表达式，并通过向该列添加零来有效地破坏沿袭。\n\n最后，`TREATAS`函数接收`SELECTCOLUMNS`返回的单列表表达式，并将该列重新分配为指向其源列的引用。\n\
  \n`CALCULATE`函数在为`SUM`函数构建筛选上下文时使用修复后的沿袭。清单 3-12 中查询的结果如图 3-8 所示。\n\n![../images/471413_1_En_3_Chapter/471413_1_En_3_Fig8_HTML.jpg](img/471413_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\n清单 3-12 中查询的结果\n\n通常情况下，你不会编写一个查询刻意破坏沿袭，然后再将其恢复到之前的状态。这个“左右抹蜡”的示例旨在效仿宫城先生的教导，演示列沿袭如何被破坏以及重新分配的概念。掌握沿袭，你就能更接近写出\
  \ DAX 领域的“鹤踢”。\n\n## 总结\n\n理解沿袭及其与筛选的结合方式，可以极大地帮助你解决使用 DAX 时遇到的棘手挑战。了解物理表与表表达式之间的区别有助于解释\
  \ DAX 中各种函数为何会有不同的行为。本章不仅展示了沿袭的工作原理，还展示了如何根据需要有意破坏或重新分配列沿袭。\n\n"
