  \ 这个值考虑了 RLS，并受到在`'Dimension City'`和`'Dimension Date'`表上定义的规则的筛选。报表中没有其他筛选器直接应用于`'Fact\
  \ Sale'`表。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig9_HTML.jpg](img/471413_1_En_11_Fig9_HTML.jpg)\n\
  \n图 11-9\n\n使用 RLS 时`[Sum of Quantity]`计算度量值的未筛选结果\n\n\n\nPower BI Desktop 的“报表”和“数据”视图现在会在功能区下方显示一个黄色条带，其中包含一条消息，提示您“现在以以下角色查看报表：Test\
  \ Role 1”。此警告消息如图 11-10 所示。单击此警告消息上的按钮可移除 RLS 筛选。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig10_HTML.jpg](img/471413_1_En_11_Fig10_HTML.jpg)\n\
  \n**图 11-10**\n\n[Sum of Quantity] 计算度量值的未筛选结果\n\n另一种查看测试的方法是通过 Power BI Desktop\
  \ 的“数据”视图窗口。“数据”视图仅显示满足活动角色 RLS 筛选要求的行。当没有测试任何角色时，“数据”视图会显示每个表中的所有行。当测试某个 RLS 角色时，行数会更新以反映\
  \ RLS 筛选。表 11-1 显示了“Test Role 1”对“数据”视图中可见数据的影响。由于此特定测试未对 `Dimension Employee` 表应用任何筛选，因此该表没有变化。\n\
  \n**表 11-1**\n\nRLS 角色对数据模型中表行数的影响\n\n| 表名 | 无 RLS 时的行数 | 使用 RLS 测试时的行数 |\n| ---\
