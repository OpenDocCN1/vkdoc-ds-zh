- "# 5. 在 DAX 中进行筛选\n\n## 引言\n\nPower BI 在允许报表作者创建一系列视觉对象方面做得非常出色，这些视觉对象为最终用户提供了一种拖放式探索数据模型的方式。但迟早会遇到需要报表作者为\
  \ DAX 计算添加某种形式筛选的需求。\n\n本章将探讨并尝试解释这些概念，并希望在此过程中澄清基于计算的 DAX 筛选这一神秘世界中的一些细微差别。\n\n\
  乍一看，筛选规则似乎很简单。使用的逻辑和代码是一系列解析为布尔值 TRUE 或 FALSE 的表达式，以确定某行是否被认为与给定计算相关。\n\n当你需要考虑筛选器应用的顺序时，乐趣就开始了。筛选规则是分层应用的，并且可能会以某种方式覆盖甚至相互矛盾，在处理高级计算时会很快变得令人困惑。\n\
  \n当所有层被解析后，被认为通过了所有筛选逻辑的行将被核心计算用来产生结果。\n\n## 基础知识\n\n为 DAX 计算添加筛选条件可以采取两种形式。第一种形式使用基于列的规则，例如`[State\
  \ Province] = 'Texas'`或`[Calendar Year] = 2014`。这种方法指定一个值与列中的值进行比较。当使用此类语句时，它们会被评估为布尔值\
  \ True 或 False，以决定某行应该保留还是丢弃。布尔值 True 表示保留该行，而布尔值 False 表示该行应被忽略且不予考虑。\n\n这些类型的语句可以与其他布尔测试结合，并在使用\
  \ AND（`&&`）和 OR（`||`）等运算符时遵循标准的布尔逻辑。\n\n第二种筛选形式使用 DAX 表作为接受表作为筛选参数的函数中的筛选参数。将表作为筛选参数传递的效果是跨多个列应用筛选，每个列包含多个值，以确定从表中哪些行被考虑。\n\
  \n### 布尔筛选\n\n`FILTER`、`CALCULATE`和`CALCULATETABLE`函数都接受`[Column] = <some value>`格式的筛选指令。清单\
  \ 5-1 和 5-2 展示了布尔筛选的基本示例。`CALCULATE`和`CALCULATETABLE`函数将看似布尔语句的表达式转换为返回表表达式的格式，以用作筛选器。\n\
  \n```\nCALCULATE(\nCOUNTROWS('Fact Sale'),\n'Fact Sale'[Quantity] = 3\n)\nListing\
  \ 5-2\nA basic example of Boolean filter expression in a CALCULATE function\n```\n\
  \n```\nCOUNTROWS(\nFILTER(\n'Fact Sale',\n'Fact Sale'[Quantity] = 3\n)\n)\nListing\
  \ 5-1\nA basic example of Boolean filter expression in a FILTER function\n```\n\n\
  清单 5-1 和 5-2 中的布尔条件应用于`[Quantity]`列的不同值，以确定该行是否被计入最终总数。如果没有应用其他筛选器，它们返回相同的值 12,572，而`'Fact\
  \ Sale'`表的总行数为 228,265。\n\n只要 DAX 表达式可以被评估为单一的 TRUE 或 FALSE 值，就可以向逻辑中添加更多条件。可以使用括号对布尔逻辑门进行分组，以便在更复杂的场景中提供更多可能性。\n\
  \n使用括号和布尔运算符的效果与其他语言一致，如果你使用过 T-SQL 风格的谓词，应该会感到熟悉。\n\n#### 注意\n\n虽然清单 5-1 和 5-2\
  \ 中的计算看起来相同，但当与切片器选择和视觉对象中的轴值等外部筛选器一起使用时，它们会产生不同的结果。\n\n使用`FILTER`函数时，第一个参数需要是对要筛选的表的引用。该参数可以是物理表或表表达式。第二个参数中的布尔表达式可以使用第一个参数指定表中的任何列。还可以借助`RELATED`和`RELATEDTABLE`函数使用相关表中的列，如清单\
  \ 5-3 所示。\n\n```\nCOUNTROWS(\nFILTER(\n'Fact Sale',\nRELATED('Dimension City'[State\
  \ Province]) = \"Texas\"\n)\n)\nListing 5-3\nA FILTER function using the RELATED\
  \ function to apply filter across a relationship\n```\n\n在清单 5-3 中，`FILTER`函数使用`RELATED`函数对相关父表中的列进行筛选。如果没有应用其他外部筛选器，结果为\
  \ 15,800，表示`'Fact Sale'`表中在 `\"Texas\"` 的`[State Province]`中销售的记录数。\n\n`CALCULATE`函数以不同的方式应用布尔筛选器，本章稍后将详细解释，这种方式不需要使用`RELATED`和`RELATEDTABLE`函数来引用相关表中的列。\n\
  \n### 表作为筛选器\n\n在 DAX 中提供筛选条件的第二种方式是使用表的形式。这种方法可以在`CALCULATE`和`CALCULATETABLE`函数的`<filter>`参数中使用，不仅提供了按值列表进行筛选的机会，还可以在单个步骤中影响多个列。\n\
  \n#### 注意\n\n在底层，`CALCULATE`唯一支持的筛选器是基于表表达式的。布尔语法会在内部使用`FILTER`函数转换为表表达式。\n\n如果你熟悉\
  \ T-SQL 等语言中基于集合的编程概念，可以将其视为一种基于集合的筛选。许多筛选指令可以在单个步骤中应用。表筛选功能非常强大，在学习这门技术时需要一定的思维训练。\n\
  \n\n\n### 单列表格筛选器\n\n考虑以下清单 5-4 中的示例，该示例使用单列表格表达式来筛选计算。用作表格筛选器的单列表格包含名称以字母 N 开头的所有\
  \ `[State Province]`。\n\n```\nTest Measure =\nVAR MyFilterTable =\nFILTER(\nVALUES('Dimension\
  \ City'[State Province]),\nLEFT('Dimension City'[State Province],1) = \"N\"\n)\n\
  RETURN\nCALCULATE(\nSUM('Fact Sale'[Quantity]),\nMyFilterTable\n)\n清单 5-4\n一个使用包含多行的单列表格作为筛选器的\
  \ CALCULATE 函数\n```\n\n名为 `MyFilterTable` 的变量被赋值为一个包含九行数据的单列表格表达式，完整的数据集如图 5-1 所示。\n\
  \n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig1_HTML.jpg](img/471413_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n展示了清单 5-4 中 `MyFilterTable` 变量的内容\n\n当一个表格被传递给 `CALCULATE`（或 `CALCULATETABLE`）函数时，其效果是筛选掉那些不出现在此列表匹配列中的值。\n\
  \n清单 5-4 的计算中有以下几点值得注意。\n\n### 扩展虚拟列\n\n清单 5-4 中的核心计算使用了针对 `'Fact Sale'` 表中某列的 `SUM`\
  \ 函数。在此计算中，表格筛选器中的列与 `'Fact Sale'` 表中的任何原生列都没有直接匹配。应用的筛选器代表相关表中的一列，但并未使用 `RELATED`\
  \ 函数。\n\n此处筛选能够生效，是因为 `'Fact Sale'` 表和 `'Dimension City'` 表之间存在基于两者 `[City Key]`\
  \ 列的关系。\n\n当在模型中定义了标准的一对多关系时，位于多端的表在理论上会被扩展，以包含所有位于一端的上游表，作为用于计算和筛选的虚拟列。在这种情况下，应用于\
  \ `'Dimension City'[State Province]` 的筛选器表现得就像数据模型被扁平化，并且 `'Fact Sale'` 表在物理上包含了这一列。\n\
  \n### 沿袭\n\n那么，`CALCULATE` 函数是如何知道表格表达式中哪一列应该是筛选对象的呢？答案并非通过匹配用作筛选器的表和被筛选表的列名。\n\n\
  > **注意**：表格表达式中的列仅筛选具有共同沿袭的物理列——第 3 章“DAX 沿袭”中有关于沿袭的更多详细信息。\n\n在清单 5-4 的示例中，`MyFilterTable`\
  \ 变量使用 `FILTER` 函数将 `[State Province]` 值的数量缩减为仅以字母 “N” 开头的那些。`VALUES` 函数创建了 `'Dimension\
  \ City'[State Province]` 列中每个值的非重复列表。\n\n`'Dimension City'[State Province]` 列的内部列\
  \ ID 引用被存储在赋给 `MyFilteredTable` 变量的表格表达式中。然后，当该表格变量作为筛选器应用于 `CALCULATE` 函数时，表格表达式中的内部列\
  \ ID 引用被用于识别 `'Fact Sale'` 表扩展版本中的列，该扩展版本包含了来自 `'Dimension City'` 表的所有列。\n\n内部列\
  \ ID 引用是数据库特有的，即使列名被诸如 `SELECTCOLUMNS` 之类的函数更改，或通过诸如 `SUMMARIZE` 之类的函数进行聚合，只要该引用\
  \ ID 在表格表达式被 `CALCULATE` 函数应用时仍然存在，筛选器就会按预期工作。\n\n以下清单 5-5 中的计算扩展了清单 5-4 中的代码，并突出了沿袭对筛选的影响。\n\
  \n```\nTest Measure 2 =\nVAR MyFilterTable =\nSELECTCOLUMNS(\nFILTER(\nVALUES('Dimension\
  \ City'[State Province]),\nLEFT('Dimension City'[State Province],1) = \"N\"\n),\n\
  \"Something else\",[State Province],\n\"State Province\",\"dummy value\"\n)\nRETURN\n\
  CALCULATE(\nSUM('Fact Sale'[Quantity]),\nMyFilterTable\n)\n清单 5-5\n一个使用包含多行的单列表格作为筛选器的\
  \ CALCULATE 函数\n```\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig2_HTML.jpg](img/471413_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n展示了清单 5-5 中 `MyFilterTable` 变量的内容\n\n请注意，图 5-2 中显示的原始 `[State Province]`\
  \ 列被重命名，并添加了一个新的虚拟列，其中包含在数据库中不存在的无意义硬编码值。当此表格表达式由 `CALCULATE` 函数作为筛选器应用于 `'Fact\
  \ Sale'` 表时，其结果与清单 5-4 中的计算相同。\n\n内部列 ID 引用用于匹配作为筛选器应用于 `CALCULATE` 表 `<表达式>` 中表的值的列表。\n\
  \n因此，即使该列现在被命名为 “Something else”，此列中的值仍然用于筛选物理表。\n\n\n\n### 多列表格筛选器\n\n用作筛选器的表格表达式不一定要只包含单列。在\
  \ 清单 5-5 所示的示例中，使用了多列表格作为筛选器参数。当 `CALCULATE` 函数处理筛选表时，它会检查筛选表中的每个内部列 ID，并寻找被筛选表中是否有匹配项。所有匹配的列都会被筛选，而两个表中不匹配的列则会被忽略。\n\
  \n在 清单 5-6 中，一个包含两列的表格表达式被分配给了 `MyFilterTable` 变量。筛选器应用于这些列，因此它仅显示那些位于以字母 N 开头的州中，且城市名也以字母\
  \ N 开头的城市。此筛选条件仅用于演示目的，不太可能成为现实世界中的示例。存储在 `MyFilterTable` 变量中的表格表达式有 234 行，其数据样本如图\
  \ 5-3 所示。\n\n在此示例中，使用了 `ALL` 函数而不是 `VALUES` 函数。`ALL` 函数会从整个表中返回一个去重的值列表，并忽略可能存在的任何外部筛选。\n\
  \n```\n度量值 5-6 =\nVAR MyFilterTable =\nFILTER(\nALL(\n'维度城市'[州/省],\n'维度城市'[城市]\n\
  ),\nLEFT('维度城市'[州/省],1) = \"N\" &&\nLEFT('维度城市'[城市],1) = \"N\"\n)\nRETURN\nCALCULATE(\n\
  SUM('事实销售'[数量]),\nMyFilterTable\n)\n清单 5-6\n一个使用包含多行的多列表格作为筛选器的 CALCULATE 函数\n```\n\
  \n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig3_HTML.jpg](img/471413_1_En_5_Fig3_HTML.jpg)\n\
  \n**图 5-3**  \n展示了来自 清单 5-6 的 `MyFilterTable` 变量内容的一个样本\n\n清单 5-6 中的 `CALCULATE`\
  \ 函数与 清单 5-5 中的示例相同。无需向函数告知筛选应应用于哪些列。筛选是基于内部列 ID 来应用的。\n\n结果是，`CALCULATE` 函数现在使用来自扩展后的\
  \ `'事实销售'` 表中的两列来应用筛选逻辑。作为表格筛选器传递的表格表达式中的两列，在扩展后的 `'事实销售'` 表中找到了匹配的列。`SUM` 函数返回的值为\
  \ 85,999，但这意味着什么呢？\n\n考虑一下图 5-4 所示的示例。步骤 1 中左侧的表格是一个将要被步骤 2 中的多列表格筛选的表格。假设每个表格中两列的沿袭是匹配的。\n\
  \n筛选完成后的结果显示在步骤 3 的数据集中。图 5-4 中的示例表明，筛选不是累积性的（布尔 AND 运算）；相反，它基于 OR 谓词。筛选所涉及的两列会彼此独立地进行测试，其结果反映了以下逻辑：\n\
  \n-   `Column1 IN (\"A\", \"B\")` 或 `Column2 IN (1, 4)`\n\n如果你对步骤 3 中第三行的出现感到惊讶，那你可能原本期望该测试是基于\
  \ AND 运算的。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig4_HTML.jpg](img/471413_1_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4**  \n展示了当左侧表格 (1) 被中间表格 (2) 筛选后的结果。结果是右侧的表格 (3)\n\n### 多重筛选器\n\n可以使用相同的技术提供多个表格。`CALCULATE`\
  \ 和 `CALCULATETABLE` 函数可以接受多个筛选参数，这意味着可以使用其他表格表达式来扩展筛选逻辑，以包含来自其他表的列。清单 5-7 展示了 `CALCULATE`\
  \ 函数的语法定义。\n\n```\nCALCULATE(<表达式>[, <筛选器 1> [, <筛选器 2> [, …]]])\n清单 5-7\nCALCULATE\
  \ 函数的语法签名\n```\n\n清单 5-8 中的计算度量值类似于 清单 5-6 中的计算度量值；不过，这里添加了一个新的表格表达式，并将其赋值给 `MyFilterTableYear`\
  \ 变量。新的表格变量作为第三个参数，被添加到 `RETURN` 语句中的 `CALCULATE` 函数里。这个额外的筛选器的作用是将 `'事实销售'` 表的数据过滤到与\
  \ 2014 日历年度相关的活动。\n\n```\n度量值 5-8 =\nVAR MyFilterTable =\nFILTER(\nALL(\n'维度城市'[州/省],\n\
  '维度城市'[城市]\n),\nLEFT('维度城市'[州/省],1) = \"N\" &&\nLEFT('维度城市'[城市],1) = \"N\"\n)\n\
  VAR MyFilterTableYear =\nFILTER (\n'维度日期',\n'维度日期'[日历年度] = 2014\n)\nRETURN\nCALCULATE(\n\
  SUM('事实销售'[数量]),\nMyFilterTable,\nMyFilterTableYear\n)\n清单 5-8\n一个使用多个表格表达式作为筛选器的\
  \ CALCULATE 函数\n```\n\n在此示例中需要考虑的一个潜在性能问题是，`MyFilterTableYear` 变量存储了来自 `'维度日期'`\
  \ 表的所有列，而不仅仅是 `[日历年度]` 列。`'维度日期'` 表中有 14 列，因此当该表格表达式在 `CALCULATE` 函数中应用时，所有 14 列的筛选都会被处理，这可能会导致大量不必要的处理开销。\n\
  \n更好的做法是，在表格表达式中仅存储用于筛选所需的最少列数。用于 `MyFilterTable` 变量的 DAX 模式是一个更高效的示例，因为它只包含筛选所需的列。\n\
  \n\n\n"
- "# 扩展表（虚拟列）\n\n要理解筛选上下文和计算上下文，关键在于掌握扩展虚拟列的概念。每当数据模型中定义了一对多关系时，位于多端的表在逻辑上会被扩展，以包含来自一端表的所有列，用于筛选和计算。扩展后的表会基于多对一的方向，包含来自任何上游表的所有列，并且可以跨越多个层级。\n\
  \n参见图 5-5 中所示的表集合。共有四个表：\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig5_HTML.jpg](img/471413_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\nWWI 数据集在关系视图中的四个表\n\n1.  `Fact Sale` – 21 列\n2.  `Dimension Date` – 14\
  \ 列\n3.  `Dimension Stock Item` – 20 列\n4.  `Dimension City` – 14 列\n\n任何基于 `Fact\
  \ Sale` 表的计算，所处理的都不仅仅是一个只有 21 行的表；相反，该表会被扩展，以同样包含来自相关父表的所有列。如果数据模型仅包含图 5-5 所示的四个表，那么扩展后的\
  \ `Fact Sale` 表将有 69 列：21 个原生列和 48 个扩展列。\n\n`Fact Sale` 表与扩展表之间的连接被视为一个 `LEFT OUTER\
  \ JOIN`，这意味着返回的是 `Fact Sale` 表中的所有行，以及扩展表中在用于定义关系的列上具有匹配值的行。\n\n图 5-6 展示了一个被“加宽”的\
  \ `Fact Sale` 表，其中包含了来自扩展表的额外列。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig6_HTML.jpg](img/471413_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n展示了包含扩展列的 `Fact Sale` 表\n\n图 5-5 所示的示例模型只有四个表，且关系仅跨越单个层级。如果三个父 `Dimension`\
  \ 表中的任何一个也位于一对多关系的多端，那么其父表的所有列也会被包含到 `Fact Sale` 的虚拟扩展表中。正是通过这种扩展表，应用于多层关系顶部的筛选器才能影响那些与筛选表没有直接关联的表中的行。\n\
  \n由于三个 `Dimension` 表都没有父表，因此它们没有任何虚拟扩展列。\n\n## 为什么这很重要？\n\n在构建带筛选条件的计算时，在脑海中将计算所涉及的表形象化会很有帮助，这包括来自相关表的所有扩展列以及基表的原生列。\n\
  \n在任何计算开始时，扩展表都被视为未应用任何筛选器，表中的每一行都可能被聚合函数（如 `SUM`、`COUNT`、`MIN` 等）所使用。\n\n筛选器会分层应用，最终确定一组行，这些行对计算中使用的聚合函数可见。筛选器通常是累加的，但并非总是如此，并且现有列上的筛选器可以被特殊的\
  \ DAX 函数覆盖。\n\n筛选解除在 DAX 筛选中扮演着至关重要的角色，它使得诸如期间比较和父/子比率等计算成为可能。如果筛选器只能累加而无法被解除，那么这类计算将很难实现。\n\
  \n筛选解除指的是这样一种概念：先前在较早层应用于特定列的筛选器被移除，并且不再对该列产生任何影响。\n\n## 筛选的层级\n\n筛选器会在一系列层级中应用。为了演示这一点，请考虑列表\
  \ 5-9 中的计算度量值。这个简单的计算度量值返回 `Fact Sale` 表中的行计数，该表恰好包含 228,265 行。如果未应用任何筛选器，`Fact\
  \ Sale` 表中的每一行都对 `COUNTROWS` 聚合函数可见，并且该度量值每次都返回 228,265。实际情况是，每次使用此度量值为报表画布上的视觉对象生成值时，略微不同的筛选规则都会影响每个实例。\n\
  \n列表 5-9 中的计算度量值被添加到矩阵视觉对象中，如图 5-7 所示。矩阵视觉对象展示了此计算度量值的 20 个独立实例。有五行与日历年份相关，其中包括一个总计行。有四列与购买组相关，其中也包含一个总计列。\n\
  \n矩阵中显示的值没有一个等于 228,265（`Fact Sale` 表中的行计数），因此每个实例都受到了某种形式的筛选的影响。此计算度量值的 DAX 中没有特定的筛选指令，并且尽管每个单元格使用相同的\
  \ DAX 代码，但矩阵中显示的值也不尽相同。\n\n每个单元格显示不同值的原因是，`[度量值 5-9]` 计算度量值的所有 20 次逻辑执行都在与其他单元格隔离的筛选上下文中运行。每个上下文开始时都没有筛选器，但随后筛选器会被应用到扩展后的\
  \ `Fact Sale` 表的列上。\n\n```\n度量值 5-9 = COUNTROWS('Fact Sale')\n```\n\n列表 5-9\n\n\
  一个使用 `COUNTROWS` 函数的简单计算度量值\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig7_HTML.jpg](img/471413_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\n展示了列表 5-9 中的度量值在矩阵视觉对象中，旁边是与 `Dimension City` 的 `[销售区域]` 列相关联的切片器\n\n\
  让我们通过分析第二个列第二行中的值 3,272 来剖析筛选过程。\n\n计算从一份未筛选的、扩展后的 `Fact Sale` 表副本开始，最终为矩阵中这个单元格得出值\
  \ 3,272。这个扩展表包含了 `Fact Sale` 中的所有 228,265 行以及 60 个列（21 个原生列 + 39 个相关列）。\n\n此示例中的第一个筛选层级来自矩阵视觉对象旁边的切片器。切片器作用于\
  \ `Dimension City[销售区域]` 列，并且选中了单个值“Mideast”。切片器使用的列也存在于扩展后的 `Fact Sale` 表中；因此，一个在此例中只有单行单列的表被添加到该计算的筛选上下文中。如果切片器恰好还勾选了其他框，那么筛选表将包含更多行。\n\
  \n此示例中第一个外部筛选层级如图 5-8 中的步骤 1 所示。\n\n捕获并研究 Power BI 为矩阵视觉对象生成的完整查询的 DAX 查询计划，有助于解释外部筛选器和内部筛选器的不同含义。\n\
  \n第二个和第三个筛选层级来自矩阵视觉对象。行标题使用 `Dimension Date[日历年份]` 列中的值，该列存在于 `Fact Sale` 的扩展副本中。\n\
  \n矩阵视觉对象的第二行包含单个值 2014，因此一个单列单行的表被添加到该计算的筛选上下文中，并在图 5-8 的步骤 2 中表示出来。\n\n\n\nMatrix\
  \ 视觉对象的第二列使用了 `Dimension City[Buying Group]` 列，该列也存在于扩展后的 `Fact Sale` 表中。该列只有一个值“Tailspin\
  \ Toys”，因此一个单列、单行的表被添加到该计算实例的筛选上下文中，并在图 5-8 的步骤 3 中展示。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig8_HTML.jpg](img/471413_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8：展示了扩展后的 `Fact Sale` 表，其中三列被数据表筛选。\n\n添加到筛选上下文中的三层筛选均位于 DAX 计算代码外部，因此是累积的。此示例的\
  \ DAX 代码中不包含特定筛选指令，因此 `COUNTROWS` 函数仅受这三层筛选影响。\n\n扩展后的 `Fact Sale` 表首先通过 `Sales\
  \ Territory` 列的筛选表从 228,265 行缩减至 33,763 行。然后，该扩展表通过 `Calendar Year` 和 `Buying Group`\
  \ 列的筛选表进一步缩减至 3,272 行。此时，`COUNTROWS` 聚合函数可以开始使用该扩展表进行计算。完成后，该单元格返回值 3,272。\n\n对于使用此计算度量值的矩阵视觉对象中的其他\
  \ 19 个单元格，逻辑上会重复相同的步骤。每个计算之间的区别在于添加到筛选上下文中的筛选表内容。这些筛选表包含基于相应列或行标题值的行；对于总计来说，添加到筛选上下文中的筛选表会更少。\n\
  \n### 解除筛选表阻塞\n\nPower BI 报表中的一个常见需求是创建需要访问之前被坐标轴值筛选掉的行中数据的计算。\n\n考虑一个期间比较度量值，它将给定期间内的特定值与来自不同期间的值进行比较。图\
  \ 5-7 显示了一个矩阵值，它使用了列表 5-9 中的简单计算。矩阵的第二列第二行的值为 3,272，这表示在对三列应用筛选表后（如图 5-7 所示），`Fact\
  \ Sale` 表中的行数。\n\n需要一种方法来移除阻止查看与 2013 日历年份相关的行的筛选，以帮助计算 2014 日历年份的值 3,271 与 2013\
  \ 日历年份的值 3,075 之间的百分比变化。\n\n`DAX` 提供了一组特定的筛选函数，可以撤销在同一查询中较早应用于列的筛选。这些解除筛选阻塞的函数是：\n\
  \n- `ALL`\n- `ALLEXCEPT`\n- `ALLSELECTED`\n\n当这些函数中的任何一个在 DAX 计算中使用时，它们会覆盖表表达式中包含的任何列的先前筛选。\n\
  \n要查看解除阻塞函数的实际应用，列表 5-9 中的 DAX 计算度量值在列表 5-10 中被修改，现在包含一个 `ALL` 函数。`MyFilterTable`\
  \ 变量被分配了一个使用 `ALL` 函数构建的表表达式。`ALL` 函数本可以直接用作 `CALCULATE` 函数的第二个参数而无需使用变量，但我喜欢这种模式，因为它强调了\
  \ `ALL` 函数是一个由行和列组成的表。在此示例中，分配给 `MyFilterTable` 变量的表表达式包含一列和四行。\n\n> **注意：** 直接在\
  \ `CALCULATE` 中使用 `ALL` 与通过变量间接使用 `ALL` 是不同的。\n\n```\nMeasure 5-10 =\nVAR MyFilterTable\
  \ = ALL('Dimension Date'[Calendar Year])\nRETURN\nCALCULATE(\nCOUNTROWS('Fact Sale'),\n\
  MyFilterTable\n)\n```\n列表 5-10：一个使用 `COUNTROWS` 函数的简单计算度量值。\n\n图 5-9 展示了扩展后的 `Fact\
  \ Sale` 表，在步骤 1、2 和 3 中对 DAX 计算外部应用了三层筛选。该图还显示了一个位于较早筛选器之上的新第四块。步骤 4 处的块表示存储在 `MyFilterTable`\
  \ 变量中的表表达式，其效果是覆盖较早查询中应用于 `Dimension Date[Calendar Year]` 列的、来自矩阵视觉对象行标题的表筛选。此解除阻塞仅影响此计算度量值实例的作用域。\n\
  \n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig9_HTML.jpg](img/471413_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9：展示了扩展后的 `Fact Sale` 表，其中三列被数据表筛选。\n\n图 5-10 显示的矩阵视觉对象展示了更新后的计算对值的影响。对 `Sales\
  \ Territory` 和 `Buying Group` 列的筛选表不受影响。但是，每个列现在都重复相同的数字。更新后的结果反映了 `Calendar Year`\
  \ 列现在 100% 未被筛选。每个单元格中显示的数字现在不受 `Calendar Year` 列的影响。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig10_HTML.jpg](img/471413_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10：展示了扩展后的 `Fact Sale` 表，其中三列被数据表筛选。\n\n在此示例中，`ALL` 函数针对单个列。`ALL` 函数也可以应用于整个表。\n\
  \n```\nMeasure 5-11 =\nVAR MyFilterTable = ALL('Dimension Date')\nRETURN\nCALCULATE(\n\
  COUNTROWS('Fact Sale'),\nMyFilterTable\n)\n```\n列表 5-11：展示了来自列表 5-10 的度量值，但 `ALL`\
  \ 函数应用于整个表，而不是特定列。\n\n图 5-11 显示解除阻塞表现在是一个包含 14 列的 1,461 行表。之前这是一个包含单列的四行表。结果不会更改图\
  \ 5-10 中显示的任何值，因为来自扩展 `Fact Sale` 表中的 `Dimension Date` 表的其余 13 列没有要解除阻塞的现有筛选。\n\n\
  列表 5-11 中的示例演示了一种效率较低的方法来解除筛选上下文中列的阻塞。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig11_HTML.jpg](img/471413_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11：展示了 `ALL` 函数解除 `Dimension Date` 表中所有列的阻塞。\n\n回到最初的需求：让一个度量值显示当前年份和上一年份之间的百分比差异。`ALL`\
  \ 函数在列表 5-11 的计算度量值中被部分用于实现此需求。为了完全实现它，需要在*解除阻塞后*对 `Calendar Year` 列应用一个额外的筛选，将行匹配到上一年份。\n\
  \n此额外筛选被添加到列表 5-12 中更新的计算度量值中。\n\n```\nMeasure 5-12 =\nVAR MyPreviousYear =\nSELECTEDVALUE('Dimension\
  \ Date'[Calendar Year]) - 1\nVAR MyFilterTable =\nFILTER(\nALL('Dimension Date'[Calendar\
  \ Year]),\n[Calendar Year]=MyPreviousYear\n)\nRETURN\nCALCULATE(\nCOUNTROWS('Fact\
  \ Sale'),\nMyFilterTable\n)\n```\n列表 5-12：展示了列表 5-11 中的代码，并按 `Calendar Year` 进行了筛选。\n\
  \n\n\n在计算度量值中（见清单 5-12），变量`MyPreviousYear`被赋值为一个整数值，该值将行标题中的日历年份减去 1。变量`MyPreviousYear`用作`FILTER`函数中的谓词，该函数输出一个表表达式，并赋值给变量`MyFilterTable`。\n\
  \n然后，`CALCULATE`函数将存储在`MyFilterTable`变量中的单列、单行表表达式添加到其筛选上下文中，该筛选上下文重新对日历年份列引入筛选，但这次筛选表中的行具有不同的值。\n\
  \n图 5-12 显示了更新后的筛选上下文，其中新表位于步骤 5。前三个筛选表均来自计算度量值外部。步骤 4 的筛选表是解除阻塞的筛选表，它覆盖了步骤 2 的筛选表。步骤\
  \ 5 的新筛选表对日历年份列重新引入了一些筛选，但使用了与该列在步骤 2 的原始筛选不同的条件。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig12_HTML.jpg](img/471413_1_En_5_Fig12_HTML.jpg)\n\
  \n**图 5-12**  \n在`'Dimension Date'`表中，步骤 5 处针对日历年份列更新了筛选上下文，并添加了一个新的表筛选器。\n\n更新后的结果显示在图\
  \ 5-13 中，每个单元格现在显示上一年的行数。\n\n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig13_HTML.jpg](img/471413_1_En_5_Fig13_HTML.jpg)\n\
  \n**图 5-13**  \n更新后的矩阵视觉对象，显示来自清单 5-12 的计算度量值。\n\n为满足显示度量值与上一年相比变化百分比值的原始需求，最后一步是在同一个计算中捕获当前值和上一年值，并将差值除以首选值。\n\
  \n更新后的度量值见清单 5-13。\n\n```\nMeasure 5-13 =\nVAR MyPreviousYear =\nSELECTEDVALUE('Dimension\
  \ Date'[Calendar Year]) - 1\nVAR MyFilterTable =\nFILTER(\nALL('Dimension Date'[Calendar\
  \ Year]),\n[Calendar Year]=MyPreviousYear\n)\nVAR MyPreviousValue =\nCALCULATE(\n\
  COUNTROWS('Fact Sale'),\nMyFilterTable\n)\nVAR MyCurrentValue = COUNTROWS('Fact\
  \ Sale')\nRETURN\nDIVIDE(\nMyCurrentValue - MyPreviousValue,\nMyCurrentValue\n)\n\
  Listing 5-13\nA calculated measure is returning percentage difference\n```\n\n对最终计算度量值所做的增强是，将原本位于`RETURN`语句中的内容赋给一个名为`MyPreviousValue`的变量。一个名为`MyCurrentValue`的新变量存储行数，其使用的筛选上下文包含三个外部驱动的筛选表，分别作用于`Calendar\
  \ Year`、`Sales Territory`和`Buying Group`。赋值给`MyCurrentValue`变量的`COUNTROWS`函数的筛选上下文，与`CALCULATE`语句（该语句将表表达式赋值给`MyPreviousValue`变量）所使用的筛选上下文是分开的。\n\
  \n`RETURN`语句会得出一个差值，该差值除以前面的某个数值，从而生成一个值，当将其格式化为百分比时，可以显示如何操纵 DAX 筛选器以实现结果。\n\n\
  #### 注意事项\n\n清单 5-13 中的计算度量值并非生成期间比较度量值的最佳实践推荐。有很多更好的替代方案，例如使用时间智能函数，如`PREVIOUSYEAR`函数。像`PREVIOUSYEAR`和`PARALLELPERIOD`这样的函数会在内部处理筛选上下文的工作，从而生成更简洁的代码。清单\
  \ 5-14 展示了一种使用其中一个时间智能函数的替代方法。\n\n```\nMeasure 5-14 =\nVAR MyPreviousValue =\nCALCULATE(\n\
  COUNTROWS('Fact Sale'),\nPREVIOUSYEAR('Dimension Date'[Date])\n)\nVAR myCurrentValue\
  \ =\nCOUNTROWS('Fact Sale')\nRETURN\nDIVIDE(\nmyCurrentValue - myPreviousValue,\n\
  myCurrentValue\n)\nListing 5-14\nAn alternative calculated measure that uses the\
  \ PREVIOUSYEAR Time Intelligence function\n```\n\n在清单 5-14 中，`PREVIOUSYEAR`函数返回一个包含\
  \ 365 行（闰年为 366 行）的单列表表达式，其中包含了与`ALL`函数相同的解除阻塞信号，并覆盖筛选上下文中来自 DAX 计算度量值外部的任何筛选表。\n\
  \n#### ALLEXCEPT\n\n`ALL`函数的配套函数是`ALLEXCEPT`。当添加到筛选上下文中时，此函数的行为与`ALL`函数类似。`ALLEXCEPT`函数会覆盖（解除阻塞）任何可能已有需要移除的筛选器的列。\n\
  \n`ALL`和`ALLEXCEPT`函数之间的区别在于语法以及如何指定需要覆盖筛选器的列。\n\n考虑一个名为`Table1`的表，它有五列，分别称为 A、B、C、D\
  \ 和 E。表 5-1 展示了使用这两个函数的各种语法选项的效果和表表达式。\n\n**表 5-1**  \n`ALL`和`ALLEXCEPT`函数不同用法的效果\n\
  \n| 语法 | 效果 | 表表达式 |\n| --- | --- | --- |\n| `ALL('Table1')` | 覆盖列 A、B、C、D、E 上的筛选器\
  \ | 返回包含列 A、B、C、D、E 所有不同组合的表表达式 |\n| `ALL('Table1', 'Table1'[B], 'Table1'[D])` |\
  \ 覆盖列 B 和 D 上的筛选器 | 返回包含列 B 和 D 所有不同组合的表表达式 |\n| `ALLEXCEPT ('Table1', 'Table1'[B],\
  \ 'Table1'[D])` | 覆盖列 A、C、E 上的筛选器 | 返回包含列 A、C、E 所有不同组合的表表达式 |\n\n使用`ALLEXCEPT`代替`ALL`的一个原因可能是，当表包含大量列，且需要清除大部分列（但非全部列）的筛选器时。在这种情况下，`ALL`函数也可以工作，但需要将每一列作为需要解除筛选阻塞的参数传递。\n\
  \n如果一个表有 100 列，并且你需要清除其中 98 列的筛选器，那么`ALLEXCEPT`函数只需要`<table>`参数以及那两个不需要解除阻塞的列。所有其他\
  \ 98 列的筛选器都会被解除阻塞。如果使用`ALL`函数，则需要将基础表以及所有 98 列作为参数添加到函数中。在这种情况下，`ALLEXCEPT`的可读性比使用`ALL`函数要好得多。\n\
  \n在底层，`ALL`和`ALLEXCEPT`函数做的是同一件事。唯一的区别在于如何选择要清除先前筛选器的列。在同一个筛选上下文中同时使用这两个函数是没有意义的。\n\
  \n#### ALLSELECTED\n\n`ALL`和`ALLEXCEPT`函数会覆盖（解除阻塞）先前添加到筛选上下文中的表筛选器，无论这些筛选器是如何添加到上下文中的。表筛选器可以是由视觉对象（当前查询）直接添加到筛选上下文中，也可以是以筛选器（slicer）选择的形式间接添加到查询外部的筛选上下文中。\n\
  \n`ALLSELECTED`函数提供了灵活性，可以移除由行或列标题中的列，或由视觉对象的轴添加的筛选器，但保留由诸如切片器、报表外部项设置的筛选器。\n\n\
  与`ALL`函数一样，其语法允许您指定整个表或表上的特定列，以覆盖其筛选上下文。`ALLSELECTED`函数也提供了相应的功能。\n\n\n\n### Note\n\
  \n当使用`ALL`、`ALLEXCEPT`或`ALLSELECTED`覆盖列筛选器时，如果目标列恰好按另一列排序，还需要包含“Sort by Column”（排序依据列）。\n\
  \n`ALLSELECTED`函数的一个很好的使用场景是，在视觉对象中需要获取父项总计的任何度量值。例如，像 Listing 5-15 中所示的比率型计算度量值，需要清除某些筛选器以确定年份的总体总计。\n\
  \n```\nMeasure 5-15 ALLSELECTED=\nVAR myYearTotal =\nCALCULATE(\n    COUNTROWS('Fact\
  \ Sale'),\n    ALLSELECTED('Dimension Customer'[Buying Group])\n)\nVAR myMonthTotal\
  \ = COUNTROWS('Fact Sale')\nRETURN\n    DIVIDE(\n        myMonthTotal,\n       \
  \ myYearTotal\n    )\nListing 5-15\nAn example of a parent/child ratio calculation\n\
  ```\n\n在 Listing 5-15 的示例中，变量`myYearTotal`被赋予了使用`ALLSELECTED`函数的`CALCULATE`的输出。该语句仅解除`ALLSELECTED`函数参数中传入的列，这些筛选器来自视觉对象内部（例如行或列）。`ALLSELECTED`函数不会解除来自使用该度量值的视觉对象外部的视觉对象或切片器的筛选。\n\
  \n赋值给`myMonthTotal`的值保留所有筛选，并在`RETURN`语句中用于提供一个比率。此度量值的理想格式化方式是百分比。\n\n图 5-14 展示了来自\
  \ Listing 5-15 的百分比变化计算，以及一个几乎相同的、使用`ALL`函数替代`ALLSELECTED`的计算副本。\n\n在图 5-14 左上角的步骤\
  \ 1 中，一个切片器在`[Buying Group]`列上选择了三个项中的两个。相同的列在步骤 2 的视觉对象的列字段中使用。\n\n步骤 3 显示的值，代表了\
  \ Listing 5-15 中的计算度量值添加到矩阵后的结果。顶部行（33.63%， 34.78%， 总计 68.41%）中的值使用了`ALL`函数的计算版本。此版本解除了步骤\
  \ 1 中由切片器驱动的筛选，这些数字代表了整个`[Buying Group]`的细分。\n\n步骤 3 第二行（49.16%， 50.84%， 100.00%）中的值使用了\
  \ Listing 5-15 中所示的`ALLSELECTED`函数的版本。此版本仅解除了步骤 2 中来自列标题`[Buying Group]`的筛选。步骤 1\
  \ 中切片器应用于`[Buying Group]`列的筛选不会被清除，因此这些值代表的是总计的百分比，但仅针对筛选器选中的项。\n\n根据您的需求，解决方案可能会使用`ALL`或`ALLSELECTED`。此示例旨在演示这两个函数之间的区别。\n\
  \n![../images/471413_1_En_5_Chapter/471413_1_En_5_Fig14_HTML.jpg](img/471413_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14** 展示了使用两个相似的计算度量值来突出显示`ALL`和`ALLSELECTED`函数之间差异的矩阵。\n\n## Summary\n\n\
  在本章中，我们更详细地探讨了筛选。我们涵盖了简单的基于布尔值的筛选，并展示了表如何作为筛选器使用。基于表的筛选器提供了基于集合的筛选，这种方法简单、强大且有效。\n\
  \n我们已经了解了扩展列和沿袭（Lineage）及其在整体筛选逻辑中的作用。理解沿袭在基于表的筛选中扮演的角色，以定义哪些列被筛选、哪些不被筛选，对第 3 章“DAX\
  \ Lineage”中的更多细节很有帮助。\n\n基于表的筛选器可以同时将筛选器应用于多个列，但在以此方式应用筛选器时，需注意理解其“或（OR）/与（AND）”特性。\n\
  \n最后，我们介绍了用于清理/解除之前为计算而筛选的列的函数，以及如何使用这些函数来提供灵活性，以解决更复杂的场景。\n\n如需进一步阅读，我推荐 Jeffrey\
  \ Wang（DAX 之父）的任何作品，他的`pbidax`或`mdxdax`博客网站上有更多信息。\n\n"
- '# 6. 迭代器


  ## 引言


  DAX 语言中的一组核心函数是迭代器函数。这些函数有时被称为 X 函数，因为大多数此类函数名称的最后一个字符是`X`。这些函数之所以被称为迭代器，是因为它们的基本目的是在一系列循环中执行
  DAX 表达式。迭代器函数遍历一个表，在每一行停止以处理一次 DAX 计算，因此得名迭代器。


  ### Note


  迭代器提供了类似于其他语言中`FOREACH`或`FOR IN`类型函数的功能，因为它们在一系列循环中执行代码。


  所有迭代器函数共享相同的初始参数签名，第一个参数始终需要是一个表，而第二个参数始终是一个表达式。第三个及后续参数因函数而异。


  ```

  FUNCTION ( <table>, <expression> )

  ```


  第一个参数`<table>`可以是一个物理表，也可以是一个表表达式，该表达式来自嵌套函数的返回值或之前在此计算中赋给变量的值。


  第二个参数`<expression>`告诉迭代器函数在每次迭代期间要处理什么计算。`<expression>`可以像硬编码值一样简单，或者更常见的是，一个使用数据模型数据的
  DAX 计算。


  大多数迭代器函数只接受这前两个参数，因此它们的行为具有高度一致性。然而，`RANKX`和`CONCATENATEX`允许传递额外的可选参数，以提供关于这些函数应如何运行的更具体细节。


  以下是 DAX 中部分迭代器函数的列表：


  - `CONCATENATEX`

  - `AVERAGEX`

  - `COUNTAX`

  - `COUNTX`

  - `GEOMEANX`

  - `MAXX`

  - `MEDIANX`

  - `MINX`

  - `PRODUCTX`

  - `RANKX`

  - `SUMX`

  - `PercentileX.Exc`

  - `FILTER`

  - `GENERATE`

  - `GENERATEALL`


  ### Note


  `FILTER`函数是一个迭代器；尽管函数名末尾没有`X`，但它的行为与其他迭代器相同。




  '
- '# 循环流控制


  当在 DAX 计算中使用迭代函数时，它会在内部执行一系列循环。`<table>` 参数中的行数决定了循环的次数。如果一个`<table>`恰好有七行，那么迭代函数就会精确地迭代七次。


  一旦迭代次数确定且循环开始，迭代函数会在每次迭代时评估第二个参数指定的`<expression>`。该表达式会产生一个适用于当前循环的单一值，同时会考虑所有相关的筛选上下文。`<expression>`
  可以简单到只是一个列名，但只要它能为循环输出一个单一值，它也可以是一个涉及多行 DAX 代码的复杂计算。迭代函数会跟踪每次迭代生成的每个值。


  在迭代过程中，迭代函数会跟踪每次循环生成的输出值。如果使用了`SUMX`迭代函数，那么每次循环生成的值会被累加起来得到总和。如果使用了`AVERAGEX`迭代函数，那么迭代函数会计算每次循环生成值的平均值。


  能够对数据执行两次遍历，是诸如`AVERAGE`和`AVERAGEX`这类不同函数之间的关键区别，并且也常常是你选择使用迭代函数而非其非迭代版本的原因。使用迭代版本，你可以在执行最终的平均值计算之前，先将数据处理成正确的格式。


  务必记住，迭代函数执行的循环次数等于用作第一个参数的`<table>`中的行数。迭代次数可能意味着`<expression>`在更多行上执行计算。不要混淆`<expression>`所考虑的行数与`<table>`中的行数。


  ## 基本形式


  迭代函数最基本的形式如列表 6-1 所示。这个*计算度量值*示例使用了`SUMX`迭代器来精确执行六次循环。循环次数由用作第一个参数的表表达式中的行数决定。


  一个名为`MyForEach`的变量被赋值为一个包含恰好六行的表表达式，这是`GENERATESERIES`函数的输出。在此示例中，`GENERATESERIES`函数输出一个单列六行的表。然后，`MyForEach`变量在`RETURN`语句中被用作`SUMX`迭代函数的第一个参数。


  ```

  SUMX 示例 =

  VAR

  MyForEach = GENERATESERIES(1,6)

  RETURN

  SUMX( MyForEach, 2 )

  列表 6-1

  一个在计算度量值中使用迭代函数的基础示例

  ```


  列表 6-1 中的`SUMX`函数的每次迭代都会评估一个`<expression>`，在此例中该表达式被硬编码为整数值`2`。在这个示例中，计算度量值的输出始终是`12`。`SUMX`函数对每次迭代的输出执行`SUM`求和：


  - `2 + 2 + 2 + 2 + 2 + 2 = 12`


  对列表 6-1 中的计算稍作修改，是调整`<expression>`，使其使用模型中的数据而非硬编码值。在列表 6-2 中，`<expression>`被扩展为使用存储在`MyForEach`变量中的表表达式的值。


  #### 注意


  `<expression>`参数中使用的数据不必来自或与用作第一个参数的`<table>`存在关系。


  ```

  SUMX 示例 =

  VAR

  MyForEach = GENERATESERIES(1,6)

  RETURN

  SUMX( MyForEach , [Value] ∗ 2 )

  列表 6-2

  计算度量值中的 SUMX 迭代函数

  ```


  列表 6-2 中更新后的计算仍然精确执行六次迭代；然而，在这种情况下，每次循环的`<expression>`每次都会返回不同的输出。`<expression>`中的`[Value]`引用是一个介于`1`和`6`之间的数字，具体取决于迭代次数，然后该值会被乘以`2`。


  这里使用的变量名`MyForEach`是为了强调示例的意图，并非迭代逻辑的一部分。


  第一次迭代计算的`<expression>`生成的值是`2`，第二次迭代生成的值是`4`，依此类推。`SUMX`函数最终返回的值是`42`。


  - `2 + 4 + 6 + 8 + 10 + 12 = 42`


  这个结果恰好也是关于生命、宇宙以及一切终极问题的答案。所以，至少你现在知道了，这个著名的问题可以用 DAX 中的迭代函数来解决。☺


  列表 6-2 中的示例也展示了传递给迭代函数的`<expression>`可以比在单列上进行操作更复杂。




  ## 常见用例


  迭代器函数的一个常见用例是，在需要逐步执行计算的数据上提供精确的总计。列表 6-3 展示了一个计算，其中迭代器的输出是 `[Quantity]` 列与 `[Price]`
  列相乘的结果。


  考虑表 6-1 中以下包含六行数据的集，以及一个要求：显示每年的行总计金额以及精确的整体总值。表 6-1 中的数据将被列表 6-3 中的计算度量值使用。


  **表 6-1** 用于演示 `SUM` 与 `SUMX` 的简单数据集


  | 年份 | 数量 | 价格 |

  | --- | --- | --- |

  | 2014 | 2 | $1.50 |

  | 2014 | 4 | $1.60 |

  | 2015 | 6 | $1.70 |

  | 2015 | 8 | $1.80 |

  | 2016 | 10 | $2.10 |

  | 2016 | 12 | $2.20 |


  满足该要求的计算度量值使用了迭代器，并展示在列表 6-3 中。


  ```

  Total using SUMX =

  SUMX(

  ''Table 6-1'',

  ''Table 6-1''[Price] ∗ ''Table 6-1''[Quantity]

  )

  列表 6-3

  使用 SUMX 迭代器函数和表 6-1 数据的计算度量值

  ```


  另一个名为 `[Total using SUM]` 的计算度量值被添加到数据模型中，并展示在列表 6-4 中。这个计算度量值有助于展示迭代器函数与非迭代器函数之间的差异，特别是在
  Power BI 中两者同时用于同一个表或矩阵视觉对象时。


  ```

  Total using SUM =

  SUM(''Table 6-1''[Price]) ∗ SUM(''Table 6-1''[Quantity])

  列表 6-4

  使用 SUM 函数和表 6-1 数据的计算度量值

  ```


  当两个计算度量值都被添加到表格视觉对象时，结果如图 6-1 所示。


  ![../images/471413_1_En_6_Chapter/471413_1_En_6_Fig1_HTML.jpg](img/471413_1_En_6_Fig1_HTML.jpg)


  **图 6-1** 展示了使用列表 6-3 和列表 6-4 中计算的视觉对象


  以表格视觉对象的第一行为例。第四列中的 $18.60 使用了列表 6-4 中的 `[Total using SUM]` 计算度量值，该度量值*不*进行迭代。它对
  Price 的 `SUM` 执行单次计算，然后将结果与 Quantity 的 `SUM` 相乘。


  `SUM` 函数将 2014 年 `[Quantity]` 列中的两个值相加得到 6，然后将两个 `[Price]` 值（$1.50 和 $1.60）相加，最后将这两个结果相乘，得到总计
  $18.60。


  - 6 x $3.10 = $18.60


  这个 $18.60 的值就是 `[Total using SUM]` 列第一行显示的结果。虽然 $3.10 乘以 6 确实等于 $18.60，但这并不是我们想要的结果。


  右侧的 `[Total using SUMX]` 列是一个计算度量值，它使用迭代器函数在价格和数量之间执行相同的乘法，但区别在于乘法是在每一行上分别进行的。


  底层数据集中 2014 年有两行数据，因此为了得到 2014 年的 $9.40，迭代器首先计算 2 x $1.50，得到两次迭代中第一次迭代的结果 $3.00。


  ### 说明


  `SUM` 在底层实现上与 `SUMX` 是相同的。`SUM` 是处理单列情况下的*语法糖*，其灵活性不如 `SUMX`。


  第二次迭代计算 4 x $1.60，得到 $6.40。当所有迭代完成后，每个表达式的输出结果被确定，迭代器函数会对每次迭代产生的值进行最终计算。在本例中，迭代器函数是
  `SUMX`，因此这些值被相加得出总计 $9.40。


  - (2 x $1.50) + (4 x $1.60) = $9.40


  在本例中，使用迭代器函数和非迭代器函数的区别通常在与总计相关的值中更为明显。图 6-1 中的总计行在 `[Total using SUM]` 列显示值为 $457.80，这是对
  `[Price]` 的总计与 `[Quantity]` 列所有值的总计进行单次乘法计算的结果，得出的值为 $457.80。


  - 42 x $10.90 = $457.80


  虽然这个计算运行很快，但它并不是我们想要的结果。


  ### 说明


  在本例中，Price 列的总计行中可以看到 $10.90 这个值。我们有意未隐藏 $10.90，以帮助演示两个度量值之间的差异。通常，这个值应该被隐藏，以防止混淆。


  ## 平均值的平均值


  另一个利用迭代器的典型场景是需要对某个平均值再进行平均。暂且不讨论此类需求的统计意义，考虑一下如何利用表 6-1 中的同一数据集来找出年平均价格。


  处理这一数据的一个特殊挑战是确定任意一年的平均价格；计算需要考虑每个价格点售出的数量。对于 2014 年，以 $1.60 价格售出的商品数量多于 $1.50 的价格。2014
  年的平均价格不应仅仅是两个价格值的中点；它应反映基于 Quantity 列中数值的权重。


  根据表 6-2 中*展开的*值，2014 年销售的平均价格为 $1.5667。


  **表 6-2** 表 6-1 中 2014 年的值，并展开行以显示权重


  | 年份 | 数量 | 价格 |

  | --- | --- | --- |

  | 2014 | 1 | $1.50 |

  | 2014 | 1 | $1.50 |

  | 2014 | 1 | $1.60 |

  | 2014 | 1 | $1.60 |

  | 2014 | 1 | $1.60 |

  | 2014 | 1 | $1.60 |

  | 总计 | 6 | $9.40 |


  - $9.40/6 = $1.5667


  使用相同的逻辑，2015 年的平均价格为 $1.7571，2016 年的平均价格为 $2.1545。


  目标是创建一个计算度量值，将其添加到 Power BI 报告的表格视觉对象中，以生成与表 6-3 中所示相同的值。


  **表 6-3** 表 6-1 中每年的平均值，包括三年内的平均值


  | 年份 | 平均价格 |

  | --- | --- |

  | 2014 | $1.5667 |

  | 2015 | $1.7571 |

  | 2016 | $2.1545 |

  | 平均值 | $1.8261 |


  如果不使用迭代器函数，很难得到正确的结果。像列表 6-4 中那样，简单地对 Price 列进行 `SUM` 再与 Quantity 列的 `SUM` 结合计算，无法提供满足此要求所需的足够细粒度的数据访问。


  为了使最终计算更易于阅读，并强制转换行上下文，以下两个计算度量值（如列表 6-5 和 6-6 所示）被添加到数据模型中。


  ```

  Sum of Quantity = SUM(''Table 6-1''[Quantity])

  列表 6-6

  一个计算度量值，用于生成 Quantity 列中数值的和

  ```


  ```

  Sum of Price = SUM(''Table 6-1''[Price])

  列表 6-5

  一个计算度量值，用于生成 Price 列中数值的和

  ```




  ### 嵌套迭代器


  迭代器的一个便捷特性是能够进行嵌套，这意味着外层迭代函数可以放心地调用内层迭代器。针对本练习提出的解决方案使用了嵌套迭代器，以协助完成必要的处理来达到预期结果。清单
  6-7 以此方式使用了两个迭代器，将其作为计算的一部分。


  外层 `AVERAGEX` 迭代器执行了三次迭代，因为 `VALUES` 函数返回的表表达式正好有三行。`VALUES` 函数返回一个单列表格，其中每一行对应于表
  6-1 中 `Year` 列的不同值。


  这里需要注意的重要一点是，`AVERAGEX` 函数执行了三个循环，而不是根据表 6-1 的行数执行六个循环。`VALUES` 函数将六行原始数据聚合为三行。


  内层 `SUMX` 迭代函数在外层 `AVERAGEX` 函数每次迭代时都会执行，其自身的迭代次数与作为第一个参数的表中的行数相同。对于这个数据集，`SUMX`
  函数针对上下文中的每一年恰好执行两次迭代。


  ```

  Total using AVERAGEX =

  AVERAGEX(

  VALUES(''Table 6-1''[Year]),

  DIVIDE(

  SUMX(

  FILTER(

  ''Table 6-1'',

  ''Table 6-1''[Year] =

  EARLIEST(''Table 6-1''[Year])

  ),

  [Sum of Price] ∗ [Sum of Quantity]

  ),

  [Sum of Quantity]

  )

  )

  清单 6-7

  一个显示每年平均价格的计算度量值

  ```


  ![../images/471413_1_En_6_Chapter/471413_1_En_6_Fig2_HTML.jpg](img/471413_1_En_6_Fig2_HTML.jpg)


  图 6-2 显示清单 6-7 中计算的结果


  清单 6-7 中所示代码的伪逻辑（结果如图 6-2 所示）可以转换为以下逐步逻辑：


  1.  针对表 6-1 中的每个不同年份运行一个外层循环 (`AVERAGEX`)。外层循环总共进行三次迭代，每年一次（2014 年、2015 年和 2016
  年）。

  2.  针对步骤 1 中的三个外层循环中的每一个，使用 `SUMX` 对表 6-1 的原始数据运行一个内层循环。每个内层循环都会被过滤到当前外层循环的年份。此过滤导致
  `SUMX` 函数的每个内层循环执行两次迭代。

  3.  `SUMX` 的每次迭代计算 `Price x Quantity`，以确定当前正在迭代的行的总金额，该行数据来自内层 `SUMX` 函数的第一个参数所指定的表。

  4.  一旦内层 `SUMX` 完成迭代，每个结果会相加，以确定内层循环的总值。

  5.  内层 `SUMX` 的结果除以当前外层循环的 `Quantity` 总和，以确定该特定年份的平均销售数量。此除法作为外层 `AVERAGEX` 循环的
  `<expression>` 的一部分执行。

  6.  针对内层函数每次迭代的输出值（即步骤 5 的输出）计算一个平均值。该平均值需要考虑三个结果。


  ```

  {

  2014 :

  {

  { 2 x $1.50 = $3.00 }

  +

  { 4 x $1.60 = $6.40 }

  } / 6 = $1.5667

  +

  2015 :

  {

  { 6 x $1.70 = $10.20}

  +

  { 8 x $1.80 = $14.40 }

  } / 14 = $1.7571

  +

  2016 :

  {

  { 10 x $2.10 = $21.00 }

  +

  { 12 x $2.20 = $26.40 }

  } / 22 = $2.1545

  } / 3 = $1.8261

  清单 6-8

  伪代码显示了清单 6-7 中 DAX 函数的循环和值

  ```


  为了得出 $1.8261 的结果，清单 6-8 总共执行了六次迭代。有三个外层循环，每个外层循环运行两个内层循环。这些内层/外层循环演示了迭代器函数如何提供对数据的细粒度访问，从而允许在聚合发生*之前*执行计算。这个示例并不意味着你应该一直用
  `SUMX` 替代 `SUM`，或用 `AVERAGEX` 替代 `AVERAGE`。此示例旨在展示不同的 DAX 函数如何适用于不同的需求，以及迭代器函数可以如何使*一些*复杂场景更容易解决。


  ### EARLIER 和 EARLIEST


  当像清单 6-7 中的示例那样嵌套迭代器时，内层迭代有时需要访问其迭代逻辑外部的值。两个用于满足此类需求的 DAX 函数是 `EARLIER` 和 `EARLIEST`。这些函数允许计算访问调用栈中层级更高的当前值。尽管这些函数名称听起来如此，但它们并非专门设计用于解决基于日期或时间的难题，也不能让你直接访问同一表中其他行的数据——例如同一表中上一行或下一行的值。


  没有对应的 `LATER` 或 `LATEST` 函数。




  ### EARLIER


  为了演示使用嵌套迭代器的这些函数，请考虑清单 6-9 中计算所得的度量值。其意图是使用数字和字母构建一个基于文本的字符串，以帮助突出嵌套迭代器的流程控制。


  此计算中使用了两个迭代器：一个遍历数字 1 到 4 的外部迭代器，以及一个遍历字母 A、B 和 C 的内部迭代器。结果是一个文本项，清晰地展示了内外循环的操作顺序。


  清单 6-9 中的计算还包含一些以双斜杠（`//`）开头的注释行。


  ```

  Loop Measure =

  VAR outerLoop = GENERATESERIES(1,4)

  VAR innerLoop = DATATABLE("Value",STRING,{{"A"},{"B"},{"C"}})

  RETURN

  CONCATENATEX(

  // foreach row in the outerLoop table

  outerLoop ,

  CONCATENATEX(

  //foreach row in the innerLoop table

  innerLoop ,

  EARLIER([Value]) & "-" & [Value] ,

  //inner loop delimiter

  ", "

  ),

  //outerLoop Delimiter

  " / "

  )

  清单 6-9

  展示在嵌套迭代器中使用 EARLIER 的计算度量值

  ```


  ![../images/471413_1_En_6_Chapter/471413_1_En_6_Fig3_HTML.jpg](img/471413_1_En_6_Fig3_HTML.jpg)


  图 6-3

  展示使用清单 6-9 中计算度量值输出的可视化效果。


  在清单 6-9 所示的计算中，有两个`CONCATENATEX`函数。紧跟在`RETURN`语句之后的第一个`CONCATENATEX`函数是外部循环。其第一个参数是存储在`outerLoop`变量中的表表达式。该表表达式是一个包含四行的单列表。该表中的值是数字
  1 到 4。


  另一个`CONCATENATEX`函数嵌套在第一个`CONCATENATEX`的第二个参数中，并使用存储在`innerLoop`变量中的表表达式来确定该迭代器的循环次数。


  外部`CONCATENATEX`函数从存储在`outerLoop`变量中的表表达式的第一行开始，其值为 1。然后内部`CONCATENATEX`函数启动，并遍历用于驱动内部迭代器的表中的三行。


  用于构建每段文本的`<expression>`是以下代码行（第 11 行）：


  ```

  EARLIER([Value]) & "-" & [Value],

  ```


  在这段代码中，对`[Value]`列的引用出现了两次。用于内部和外部迭代器的表都是单列表，列名均为`[Value]`。`EARLIER`函数帮助计算区分正确的列引用。


  在此例中，`EARLIER`函数内部的`[Value]`列引用指向外部循环中的表表达式，因此它会从`outerLoop`表函数的当前行返回一个值。代码中的第二个`[Value]`未使用`EARLIER`函数，它指的是属于内部`CONCATENATEX`函数当前迭代的`innerLoop`表的`[Value]`列。


  用于表示`innerLoop`表一次迭代的分隔符是逗号，而用于表示`outerLoop`表一次迭代的分隔符是斜杠。这些分隔符可以在图 6-3 的结果中看到，逗号代表内部循环的进展，斜杠表示外部循环已迭代一次。


  ### EARLIEST


  清单 6-9 中的示例使用了两个嵌套的迭代器函数。这并不妨碍你在一个语句中嵌套三个或更多迭代器。在这种情况下，某些内部迭代器可能需要访问某个外部迭代器（不一定是紧邻的外部迭代器或最外层迭代器）的当前值。


  `EARLIER`函数可选的第二个参数`<number>`允许你指定在调用栈中要引用的外部循环。如果使用值 1，则引用紧邻当前迭代器外部的循环，因此这与留空此参数没有区别。


  #### 注意


  `EARLIER( <table> , 1 )` 等同于使用 `EARLIER (<table> )`。


  这个可选参数允许迭代器的`<expression>`通过指定一个大于 1 的值，来访问任何外部循环中使用的表的当前行上下文。


  图 6-4 中显示的示例有四层嵌套迭代器。最内层迭代器中的`EARLIER`函数为第二个参数指定了值 2。此值意味着`EARLIER`函数的`<column>`参数是对嵌套循环序列中向上*两层*的迭代器当前行上下文的引用。值
  3 将引用迭代器 1 的当前行上下文，其效果与指定`EARLIEST( <column> )`相同。


  ![../images/471413_1_En_6_Chapter/471413_1_En_6_Fig4_HTML.jpg](img/471413_1_En_6_Fig4_HTML.jpg)


  图 6-4

  展示了第四层的`EARLIER`函数引用第二层的列。


  如果可选第二个参数中指定的数字大于嵌套迭代器的数量，则会生成错误。


  `EARLIEST`函数提供了引用最外层迭代器的快捷语法，从而无需计算出用作`EARLIER`函数参数的正确数字。


  使用清单 6-9 中的代码，下面清单 6-10 中显示的三种变体会产生相同的结果。但是，如果存在三层或更多层的嵌套迭代器，使用`EARLIEST`函数的变体可能会产生不同的结果。


  ```

  EARLIER([Value]) & "-" & [Value],

  EARLIER([Value],1) & "-" & [Value],

  EARLIEST([Value]) & "-" & [Value],

  清单 6-10

  在此情况下返回相同结果的 EARLIER 和 EARLIEST 的三种变体

