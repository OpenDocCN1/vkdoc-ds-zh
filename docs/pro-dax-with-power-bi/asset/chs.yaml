- '# 查询计划


  How can you determine if a function is an iterator? Can you tell by looking at the
  query plan? Chapter 13, "Query Plans," will provide a detailed introduction to query
  plans, what they mean, and how to interpret them. In short, reading the query plan
  alone does not always make it clear whether a function is an iterator.


  The `DAX` engine is smart enough to design efficient plans that avoid iteration,
  even if you correctly use functions known to be iterators (such as `SUMX`). Three
  different queries might result in the same physical plan, differing only slightly
  in the logical plan. If the underlying engine operates in an iterative (row-by-row)
  fashion, the logical plan may offer some clues.


  ## 总结


  This chapter provided a detailed introduction to iterator functions. Examples were
  used to demonstrate how iterator functions operate and how they differ from their
  non-iterator counterparts, especially in terms of calculation processing order.


  Iterator functions can be nested to create multiple layers of loops, while functions
  like `EARLIER` and `EARLIEST` can be used to help inner loops reference the current
  value from a higher level in the call stack.


  The `CONCATENATEX` function is useful for debugging calculations that use other
  iterator functions.


  All in all, when used appropriately, they are a highly practical set of functions,
  and...


  ...if you don''t use them, you''re just being "dense." Ha!


  '
- "# 7. 使用度量值进行筛选\n\n## 引言\n\nThis chapter will use a variety of techniques to showcase\
  \ the possibilities of measures: measures are not only used for calculating numerical\
  \ values but can also be extended to mark items that meet certain conditions, or\
  \ worse, mark items that violate specific rules (i.e., rule breakers). These techniques\
  \ range from simple filtering to more complex dynamic binning concepts. A use case\
  \ for the latter is creating a visual (more precisely, a `ribbon chart`) to count\
  \ the number of customers whose activity falls into specific bins.\n\n#### 注意\n\n\
  This section will use the Power BI file \"`CH7 – Filtering using measures.pbix`\"\
  . Please note that this file applies a page-level filter to prevent displaying `Customer\
  \ Key 0`, as this key represents unknown customers.\n\nAt first glance, dedicating\
  \ an entire chapter to the seemingly simple topic of \"filtering with measures\"\
  \ might seem like a waste of valuable space; however, it turns out that things are\
  \ often not as simple as they seem.\n\nThe theme of this chapter is filtering. Row\
  \ filtering is a crucial component of creating measures. Creating a measure always\
  \ comes with two subtleties:\n\n*   **Algorithm**: The complexity of the algorithm\
  \ applied to the filtered rows. Sometimes, the underlying math is far more complex\
  \ than simply multiplying two numbers.\n*   **Row Filtering**: Sometimes, determining\
  \ a specific set of rows is more complex than the algorithm that needs to be applied.\n\
  \nThis chapter focuses on the latter: filtering values and/or rows, particularly\
  \ using measures that require evaluation to determine whether a specific value/row\
  \ should be included or excluded.\n\n## Why Special Attention is Needed\n\nIn addition\
  \ to Chapter 5, \"Filtering in DAX,\" this chapter also covers some additional subtleties.\
  \ These details must be kept in mind whenever a measure is used inside `CALCULATE`\
  \ – not as the first argument (the numeric expression), but as the Boolean expression\
  \ used to ultimately create a filter table.\n\n\n\n#### 注意\n\n本节内容引用了报表页面“意外结果”。\n\
  \n为了凸显这些微妙之处，我们假设定义了一个非常基础的度量值，用于计算平均数量。该度量值如代码清单 7-1 所示。\n\n```\nAverage Quantity\
  \ =\nAVERAGE('Fact Sale'[Quantity])\n代码清单 7-1\n平均数量\n```\n\n上述度量值并无特别之处，只是一个起点。为此，我们需要让情况稍微复杂一些。因此，我们创建了度量值\
  \ `Total Quantity` `above average`。该度量值如代码清单 7-2 所示。\n\n```\nTotal Quantity above\
  \ average =\nCALCULATE(\n[Total quantity]\n, 'Fact Sale'[Quantity] > [Average Quantity]\n\
  )\n代码清单 7-2\n高于平均值的总数量\n```\n\n不幸的是，此度量值无法创建，因为会触发图 7-1 所示的错误。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig1_HTML.jpg](img/471413_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\n`CALCULATE` 无法在 TRUE/FALSE 表达式中使用\n\n这是由于在筛选表达式内部引用度量值时必须考虑的一些限制。这些限制在\
  \ `CALCULATE` 函数的官方文档中已列出。该文档可在此处查阅：[`docs.microsoft.com/en-us/dax/calculate-function-dax`](https://docs.microsoft.com/en-us/dax/calculate-function-dax)\n\
  \n> 以下限制适用于用作参数的*布尔表达式*：\n\n- 表达式不能引用度量值。\n- 表达式不能使用嵌套的 `CALCULATE` 函数。\n- 表达式不能使用任何扫描表或返回表的函数，包括聚合函数。\n\
  \n考虑到这些限制，我们可能会想到一种重写度量值的方案，如代码清单 7-3 所示。\n\n```\nTotal Quantity above average v2\
  \ =\nCALCULATE(\n[Total quantity]\n,FILTER(\n'Fact Sale'\n, 'Fact Sale'[Quantity]\
  \ > [Average Quantity]\n)\n)\n代码清单 7-3\n高于平均值的总数量 v2\n```\n\n但即使该度量值不会报错，其运行结果也并非预期。这个度量值不返回任何值，如图\
  \ 7-2 所示。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig2_HTML.jpg](img/471413_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\n度量值 `Total Quantity above average v2` —— 无返回值\n\n尽管原因不明显，但解释很简单。`FILTER`\
  \ 是一个表迭代函数，它为表中的每一行创建一个行上下文。由于度量值会隐式执行上下文转换，即将当前行上下文转换为筛选上下文，因此这个新的筛选上下文会被用来评估 `FILTER`\
  \ 的条件。这直接意味着 `AVERAGE` 是针对每一行单独计算的；因此，条件永远不可能为 TRUE。表迭代器的每一行都会被忽略，导致列空白。如果将度量值 `Total\
