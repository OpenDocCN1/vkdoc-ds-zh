  \ | 365 |\n| Dimension Employee | 213 | 213 |\n| Fact Sale | 228,265 | 6,378 |\n\
  \n快速检查 `Fact Sale` 表的方法是排序 `Invoice Date Key` 列，并检查顶部和底部的边界值是否仍符合 2015 年这一筛选要求，即属于\
  \ 2015 日历年的数据。\n\nRLS 筛选不仅适用于计算度量值或可视化对象；筛选发生在数据模型的更高级别，因此即使在“数据”视图中可见的数据也会受到限制。\n\
  \n### 测试多个角色\n\n当您的数据模型中使用了动态 RLS 并且您有多个角色时，已发布数据集的用户可能存在于多个角色中。为了在 Power BI Desktop\
  \ 中对此进行测试，请在“以角色身份查看”对话框中启用多个复选框，如图 11-11 所示。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig11_HTML.jpg](img/471413_1_En_11_Fig11_HTML.jpg)\n\
  \n**图 11-11**\n\n“以角色身份查看”对话框显示选中了多个角色\n\n请注意，Power BI Desktop 将不同角色之间的规则视为 OR（或）关系，而非\
  \ AND（与）关系。\n\n请考虑以下场景。\n\n“Test Role 1”角色定义了以下 RLS 筛选规则：\n\n*   `Dimension City`[State\
  \ Province] = “Texas”\n\n“Test Role 2”角色定义了以下 RLS 筛选规则：\n\n*   `Dimension Date`[Calendar\
  \ Year] = 2015\n\n当仅选择“Test Role 1”时，`Fact Sale` 表中的数据会被筛选为仅显示属于“Texas”的行。\n\n当仅选择“Test\
  \ Role 2”时，`Fact Sale` 表中的数据会被筛选为仅显示属于 2015 年的行。\n\n然而，当同时选中“Test Role 1”和“Test\
  \ Role 2”时，`Fact Sale` 表中的行可以属于“Texas”或者 2015 年。属于其他`State Province`的行也会出现，但仅限于\
  \ 2015 年的数据。\n\n此效果可以在图 11-12 中看到，该图使用了一个矩阵可视化对象，其列是`Calendar Year`，行是`State Province`。此视图是在使用“以角色身份查看”对话框同时选中“Test\
  \ Role 1”和“Test Role 2”时捕获的。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig12_HTML.jpg](img/471413_1_En_11_Fig12_HTML.jpg)\n\
  \n**图 11-12**\n\n一个矩阵可视化对象，展示了多个角色如何被视为 OR 关系而非 AND 关系\n\n图 11-12 显示的结果也会在 Power\
  \ BI Web 服务中体现，并且在设计具有多个 RLS 角色的数据模型时，理解这一点至关重要。请记住，在 Power BI Web 服务中，一个用户帐户可以被分配给多个角色。\n\
  \n## 活动关系与 RLS\n\n使用前面的示例，让我们看看当更改`Dimension Date`和`Fact Sale`表之间活动关系所涉及的列时会发生什么。当前关系将`Fact\
  \ Sale`表中的`Invoice Date Key`列与`Dimension Date`表中的`Date`列链接起来。\n\n让我们更新关系，改为使用`Fact\
  \ Sale`表中的`Delivery Date Key`列，并查看“报表”和“数据”视图会发生什么变化。为“Test Role 1”角色定义的 RLS 筛选规则保持不变。\n\
  \n报表视图中的可视化对象现在显示了一个与之前看到的不同的值。图 11-13 中显示的新值是 243,923，而之前是 244,520。这反映了 RLS 筛选现在应用于`Dimension\
  \ Date`表，并向下传播到`Fact Sale`表中不同的行集。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig13_HTML.jpg](img/471413_1_En_11_Fig13_HTML.jpg)\n\
  \n**图 11-13**\n\n关系更改后计算度量值的更新值\n\n## DAX 查询计划\n\n让我们使用第 13 章“查询计划”中推荐的跟踪事件，查看上述示例的一些\
  \ DAX 分析器事件。\n\n推荐的跟踪事件是：\n\n*   查询事件\n    *   Query End\n\n*   查询处理\n    *   DAX\
  \ Query Plan\n    *   VertiPaq SE Query Cache Match\n    *   VertiPaq SE Query End\n\
  \n在 SSMS 分析器中启用这些事件并使用空缓存时，刷新图 11-9 中所示的可视化对象时会捕获以下事件。\n\n### 逻辑计划\n\n逻辑计划的简化版本如代码清单\
  \ 11-2 所示，其中没有任何关于 RLS 应用的任何筛选规则的线索或引用。逻辑计划建议对`Fact Sale`[Quantity] 列执行 `Sum_VertiPaq`\
  \ 操作。\n\n```\nAddColumns:\nSum_Vertipaq:\nScan_Vertipaq: Fact Sale'[Quantity]\n\
  'Fact Sale'[Quantity]:\n```\n**代码清单 11-2**\n\n使用 RLS 角色测试计算度量值时捕获的逻辑计划简化版本\n\n###\
  \ 物理计划\n\n代码清单 11-3 中显示的物理计划不包含任何根据该角色的 RLS 筛选规则进行筛选的操作符或指令。与代码清单 11-2 中的逻辑计划一样，无论是否应用\
  \ RLS 筛选，物理计划都是您所期望看到的。\n\n```\nAddColumns:\nSingletonTable:\nSpoolLookup: LogOp=Sum_Vertipaq\n\
  ProjectionSpool>:\nCache: IterPhyOp\n```\n**代码清单 11-3**\n\n使用 RLS 角色测试计算度量值时捕获的物理计划简化版本\n\
  \n### DAX Query End\n\nQuery End 事件携带了 Power BI Desktop 为获取可视化对象所需结果而向数据模型中的数据库发出的实际\
  \ DAX 查询。该 DAX 如代码清单 11-4 所示，与逻辑计划和物理计划一样，它没有引用根据正在测试的活动 RLS 角色进行的筛选。即使关闭 RLS 测试，也会产生完全相同的\
  \ DAX Query End 事件。\n\n```\nEVALUATE\nROW(\n\"Sum_of_Quantity\", 'Fact Sale'[Sum\
  \ of Quantity]\n)\n```\n**代码清单 11-4**\n\n计算度量值的 DAX Query End 文本\n\n\n\n### VertiPaq\
  \ 扫描\n\n最后需要检查的事件是与查询存储引擎（SE）相关的事件。行级安全（RLS）过滤规则会在这里的 SE 事件中出现。图 11-14 展示了一个 `WHERE`\
  \ 子句被添加到了由 SE 事件生成的伪 T-SQL 查询中。  \n当关闭 RLS 角色测试时，`WHERE` 子句会从该事件中消失。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig14_HTML.jpg](img/471413_1_En_11_Fig14_HTML.jpg)\
  \  \n图 11-14 – 正在测试的计算度量值的存储引擎查询\n\n如图 11-14 所示，存在一个 `WHERE` 子句，它包含两行。`WHERE` 子句中的第一行与\
  \ 'Dimension City' 表上的筛选器有关。这一行 `WHERE` 子句中的文本使用了 `IN` 谓词，并且非常长。滚动到该文本的最右侧，可以看到“[总计\
  \ 1818 个单位，未全部显示]”。DAX 查询引擎会将应用于 [State Province] 的 RLS 筛选规则转换为特定值，用于筛选 'Dimension\
  \ City' 表中的内部 rowid 列。  \n`WHERE` 子句中的第二行与 'Dimension Date' 表有关，并且再次在谓词中使用 `IN`\
  \ 运算符来指定对 2015 年内在字典值的筛选。\n\n捕获到的 VertiPaq SE 事件还显示了当多个 RLS 角色同时生效时的扫描行为。伪 T-SQL\
  \ 揭示了一个 `WHERE` 子句，它使用 `OR` 运算符（而不是 `AND` 运算符）连接一系列规则。`VertiPaq SE Query End` 是一个有用的跟踪事件，用于精确了解\
  \ DAX 查询引擎正在从底层数据库中请求哪些数据。\n\n### 查询计划总结\n\n总而言之，RLS 应用于存储层，而不是通过对 Power BI Desktop（或\
  \ Web 服务）生成的 DAX 查询进行修改，也不是通过对在“数据”视图中生成数据的查询进行修改。\n\n## 动态行级安全\n\n本章前面的示例都对列筛选使用了硬编码值。迟早，你会遇到需要动态应用\
  \ RLS 规则的需求。一个典型的例子是考虑查看报表的用户的用户名。\n\nWide World Importers 数据集有一个 'Dimension Employee'\
  \ 表，其中包含 20 个不同的 [Employee ID] 值。假设你有一个锁定报表的需求，使其只显示属于已登录用户的数据。解决此问题的一种方法是创建 20\
  \ 个 RLS 角色，每个角色都有一个硬编码规则，例如 `[WWI Employee ID] = 1`，然后在数据集发布到 Power BI Web 服务后，将相应的个人分配到该角色。\n\
  \n这种方法很耗时，并且在配置 Web 服务时存在出错的风险，并且意味着当员工入职和离职时需要管理角色。\n\n幸运的是，有更好的方法可以通过实现动态 RLS\
  \ 来解决。有几个有用的 DAX 函数可以帮助检测当前用户，从而实现动态 RLS。这些函数是：\n\n- `USERNAME`\n- `USERPRINCIPALNAME`\n\
  \n这些函数返回的文本包含当前查看报表的用户的登录详细信息。在 RLS 筛选器中使用的 DAX 表达式可以使用这些函数，与预填充的已知 UserName（或 UserPrincipalName）值表中的列进行比较。如果测试找到匹配项，则该表以及任何下游相关表都会被筛选，以仅显示该用户名对应的行。\n\
  \n一种方法是预填充一个全新的表，或者向现有表中添加一列，其值可能匹配这些函数的输出。因此，你首先需要查看每个函数生成的输出。测试此输出的最简单方法是将清单 11-5\
  \ 中的计算度量值添加到数据模型中，然后放在显示文本的报表视觉对象中。\n\n```\n动态 RLS 测试 =\n组合值(\n\", \" ,\n\"USERNAME()\
  \ = \" & USERNAME() ,\n\"USERPRINCIPALNAME() = \" & USERPRINCIPALNAME()\n)\n```\n\
  清单 11-5 – 用于显示 `USERNAME` 和 `USERPRINCIPALNAME` 函数输出的计算度量值\n\n当 `[Dynamic RLS test]`\
  \ 计算度量值被添加到 Power BI Desktop 的报表画布时，你可能会看到每个函数都输出一个使用 *domain\\username* 模式的值。\n\
  \n将同一个报表发布到 Web 服务并在登录 Web 服务后检查显示的值非常重要。此时该值应该不同，并且更可能是一种类似于 *username@yourcompanydomain.com*\
  \ 的模式。这个示例是在数据模型中预填充表以使用 RLS 筛选器进行筛选时需要使用的模式，而不是 *domain\\username* 模式。\n\n下一步是将这些用户名添加到你的数据模型中。为了使用\
  \ Wide World Importers 数据集满足此要求，请将清单 11-6 中的计算列添加到 'Dimension Employee' 表中。\n\n\
  ```\n用户主体名称 =\n替换('Dimension Employee'[Employee],\" \",\".\") &\n\"@wideworldimporters.com\"\
  \n```\n清单 11-6 – 添加一个值以用作动态 RLS 筛选器的计算列\n\n清单 11-6 中的代码生成一个新列，该列创建一个旨在匹配 `USERPRINCIPALNAME()`\
  \ 函数在 Power BI Web 服务中的输出。此计算列中显示的模式并非适用于每个组织，因此需要根据实际情况进行调整。图 11-15 显示了一个使用清单 11-6\
  \ 代码的示例表。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig15_HTML.jpg](img/471413_1_En_11_Fig15_HTML.jpg)\
  \  \n图 11-15 – 'Dimension Employee' 表，包含清单 11-6 中的计算列\n\n\n\n接下来，需要在数据模型中创建一个新的\
  \ RLS 角色，该角色对 `‘Dimension Employee’` 表应用筛选器。在图 11-16 中，添加了一个名为 `“Dynamic RLS Role”`\
  \ 的新角色和一个简单的 DAX 表达式。\n\n带方括号的 `[UserPrincipalName]` 文本引用了高亮显示的 `‘Dimension Employee’`\
  \ 表中的一列，而文本右侧带圆括号的 `UserPrincipalName()` 则引用了 DAX 函数。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig16_HTML.jpg](img/471413_1_En_11_Fig16_HTML.jpg)\n\
  \n图 11-16\n\n一个基本的 RLS 角色，旨在通过 `USERPRINCIPALNAME` 函数筛选 `‘Dimension Employee’` 表\n\
  \n可使用 `View as Roles` 功能测试新角色，并且可以使用此功能模拟任何用户。图 11-17 显示了为测试而配置的 `View as Roles`\
  \ 对话框。在此对话框中，同时选中了 `“Other user”` 和 `“Dynamic RLS role”`。\n\n当选中 `“Other user”`\
  \ 旁边的复选框时，会出现一个文本框，允许您输入一些文本。您在此处输入的文本将同时在 Power BI Desktop 中的 `USERNAME` 和 `USERPRINCIPALNAME`\
  \ 函数中生效。\n\n能够在 `“Other user”` 旁边输入任意文本，使您可以在 Power BI Desktop 模式下模拟任何用户。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig17_HTML.jpg](img/471413_1_En_11_Fig17_HTML.jpg)\n\
  \n图 11-17\n\n为测试动态 RLS 而配置的 `View as Roles` 对话框\n\n在图 11-17 中，`“Other user”` 设置为\
  \ `Lily.code@wideworldimporters.com`，并且 `“Other user”` 和 `“Dynamic RLS role”` 选项都被勾选，这意味着它们在\
  \ Power BI Desktop 中都变为活动状态。\n\n两个角色都激活的效果可以在报表和数据视图中看到。在数据视图中，`‘Dimension Employee’`\
  \ 表现在只显示 18 行，这 18 行中新的 `[UserPrincipalName]` 列与在 `View as Roles` 对话框中输入的值相匹配。\n\
  \n`‘Fact Sale’` 表现在只显示 22,642 行，而不是应用 RLS 之前的 228,265 行。`‘Fact Sale’` 中可见的行被限制为仅属于员工\
  \ Lily Code 的行。\n\n任何报表页上的所有视觉对象现在都会自动筛选为仅显示这些行。不会对任何计算的度量值或列进行修改。\n\n这种方法的好处是，当有新用户添加到\
  \ `‘Dimension Employee’` 表时，除了将他们添加到相应的应用工作区之外，无需对 Power BI 报表进行任何操作，新用户就能使用筛选功能访问该报表。\n\
  \n### 在 Power BI Web 服务中进行测试\n\n现在，该报表已准备好发布到 Power BI Web 服务。理想情况下，您可以将报表发布到应用工作区。一旦报表存在于应用工作区中，您可以导航到该应用工作区的“数据集”区域，并点击单击省略号后出现的上下文菜单中的“安全性”选项，如图\
  \ 11-18 所示。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig18_HTML.jpg](img/471413_1_En_11_Fig18_HTML.jpg)\n\
  \n图 11-18\n\nPower BI Web 服务中应用工作区的“数据集”屏幕\n\n“安全性”选项会加载所选数据集的行级安全性屏幕，如图 11-19 所示。此屏幕允许您在\
  \ Web 服务中为数据集配置 RLS。点击角色名称旁边的省略号，您可以测试该报表。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig19_HTML.jpg](img/471413_1_En_11_Fig19_HTML.jpg)\n\
  \n图 11-19\n\n如何在 Power BI Web 服务中调用 `Test as role` 功能\n\n一旦您在 Web 服务中调用 `Test as\
  \ role` 功能，报表便会显示出来，此时 RLS 处于激活状态，并且已设置为根据您的凭据进行筛选。此功能如图 11-20 所示。报表顶部会出现一个蓝色栏，允许您通过点击\
  \ `“Back to Row-Level Security”` 箭头来关闭测试。\n\n点击 `“Now viewing as: ”` 文本可以打开一个对话框，允许您输入另一个用户进行测试。当您在文本框中输入时，租户中有效的用户会出现，让您可以选择合适的用户。此功能在检查每个用户看到的内容时非常有用，尤其是当跨多个角色的筛选规则开始变得复杂时。\n\
  \n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig20_HTML.jpg](img/471413_1_En_11_Fig20_HTML.jpg)\n\
  \n图 11-20\n\n使用不同用户进行测试\n\n测试完成后，您可以点击蓝色栏中的 `“Back to Row-Level Security”` 文本，导航回数据集的行级安全性配置窗口。\n\
  \n### 使用子查询的动态 RLS\n\n`USERPRINCIPALNAME` 函数非常适合将数据筛选到特定用户。有时，在其他场景下，可以使用动态 RLS\
  \ 角色来最小化所需角色的总数。\n\n子查询可以在 RLS 筛选器中替代硬编码值。\n\n只要 RLS 筛选表达式能解析为布尔值 true 或 false，就可以包含大多数\
  \ DAX 表达式。图 11-21 的筛选器面板中显示的示例展示了一个使用 `MAXX` 函数的筛选器。\n\n`IN` 运算符可以与任何返回单列表的 DAX\
  \ 函数（如 `SELECTCOLUMNS`、`TOPN` 或 `VALUES`）结合使用。`VALUES` 函数可以包裹一个筛选器以提供额外的灵活性。\n\n\
  `TOPN` 不会计算相关表中的值，因此，尝试根据相关 `‘Fact Sale’` 表中的列，将 `‘Dimension City’` 表限制为仅显示前十个 `[State\
  \ Province]` 值的查询无法生效。\n\n这个限制很可能是因为 RLS 筛选在存储引擎级别的实现方式，它无法使用不同的表进行筛选。这些场景可以通过在数据建模中，在\
  \ `‘Dimension City’` 表中预先计算一个列来解决，该列将 `[Is Top 10 State Province By Quantity]` 显示为\
  \ 1 或 0。一旦添加了此类列，就可以在 RLS 筛选器中快速有效地使用它。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig21_HTML.jpg](img/471413_1_En_11_Fig21_HTML.jpg)\n\
  \n图 11-21\n\n作为 RLS 筛选器一部分使用的子查询\n\n添加到包含图 11-21 中所建议筛选器的任何角色的用户，其数据都会被限制为仅包含最近一年，除非他们也被包含在其他角色中，在这种情况下，他们还可以看到其他角色所允许的数据。\n\
  \n如果向 `‘Dimension Date’` 表中添加了代表更新的 `[Calendar Year]` 数据，RLS 会将新的筛选状态动态应用于分配给该角色的所有用户，而无需任何直接的配置更改。\n\
  \n\n\n## 将用户分配到角色\n\n一旦在数据模型中定义了至少一个角色，并且将报表发布到 Web 服务后，就可以将用户或组分配到角色，从而使他们在查看报表时受到行级安全性（RLS）筛选的影响。\n\
  \n要将用户或组分配到某个角色，请在应用工作区中找到数据集，单击省略号，然后选择`安全`选项，如图 11-22 所示。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig22_HTML.jpg](img/471413_1_En_11_Fig22_HTML.jpg)\n\
  \n图 11-22：在应用工作区中访问数据集的`安全`选项\n\n单击`安全`选项会加载行级安全配置屏幕，其中显示模型中定义的所有角色列表。在此视图中无法修改每个角色的筛选规则，只能在\
  \ Power BI Desktop 中进行更改。\n\n图 11-23 显示的是行级安全屏幕，您可以在其中为每个角色添加/删除用户或组。完成更改后，单击保存按钮以提交更新。\n\
  \n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig23_HTML.jpg](img/471413_1_En_11_Fig23_HTML.jpg)\n\
  \n图 11-23：用于 RLS 的添加/删除用户或组屏幕\n\n开始在文本框中输入时，系统会显示属于该租户的有效用户列表，方便您选择正确的用户（或组）。Azure\
  \ Active Directory 组也可以分配到角色，如果您的 Power BI 租户连接到了一个维护良好的 Azure Active Directory，这将大大减少管理工作。\n\
  \n#### 注意\n\n如果用户是应用工作区的管理员，则 RLS 筛选会被忽略。RLS 仅适用于只读成员。\n\n## RLS 总结\n\n行级安全是企业数据建模中一个常用且往往至关重要的功能。它足够灵活，能够满足许多场景的需求。RLS\
  \ 可能会加快报表速度，但同样地，复杂的筛选规则也可能导致性能下降。RLS 可以应用于现有报表，并且不需要更新实际的计算过程即可生效。\n\n本章向您展示了 RLS\
  \ 是基于角色的，其筛选规则是使用 Power BI Desktop 定义和管理的。一旦 `pbix` 文件发布到 Web 服务，就需要一个单独的过程来将用户（或组）分配到角色。\n\
  \n角色的筛选规则可能会变得复杂，因此本章还展示了如何在 Power BI Desktop 和 Web 服务中测试 RLS。\n\n角色可以是动态的，这有助于减少每当用户开始或更改内部角色时自动更新\
  \ `pbix` 文件的需求。可以使用查询来满足复杂的需求。\n\n用户可以同时存在于多个角色中，在这种情况下，用户会看到其有资格查看的每个角色的所有有效数据。\n\
  \n"
- '# 第四部分：调试与优化


  '
- "# 12. DAX Studio\n\n## 简介\n\n首先，DAX Studio 是 **那个** 工具，也许是为数不多能帮助优化度量值性能的工具，它甚至有助于提升整个报表或特定报表页面的整体性能。\n\
  \n虽然它至关重要，但我们不能忘记 DAX Studio 是完全免费的。DAX Studio 背后的团队为其投入了巨大的精力。因此，如果在性能优化过程中某件事导致您需要重启\
  \ DAX Studio，甚至不止一次，请保持冷静，并记住如果没有 DAX Studio，您可能根本无从开始优化过程。同样重要的是，DAX Studio 绝非一个充满缺陷的工具，但它也只是由凡人编写的软件，这意味着偶尔可能发生一些小状况。\n\
  \nDAX Studio 可从此处下载：\n\n[`www.sqlbi.com/tools/dax-studio/`](http://www.sqlbi.com/tools/dax-studio/)\n\
  \n源代码可在此处获取：\n\n[`https://github.com/DaxStudio/DaxStudio`](https://github.com/DaxStudio/DaxStudio)\n\
  \n完整文档在此处：\n\n[`https://daxstudio.org/`](https://daxstudio.org/)\n\n无论何时您遇到 Darren\
  \ Gosbell 或来自 `sqlbi.com` 的各位（Marco Russo 和 Alberto Ferrari），请去告诉他们，DAX Studio 在您理解和掌握\
  \ DAX 的道路上一直是一个多么优秀的伙伴。即使 DAX 的内部运作机制看起来复杂或神秘，也请毫不犹豫地创建一个仅包含一个视觉对象的报表页面来探究其原理；也许某天您会发现视觉对象使用的某个\
  \ `DAX` 函数当前并未在文档中说明。\n\n## 预期效果\n\n您可能看过很多视频，人们使用 DAX Studio 来解决报表和 `DAX` 语句的性能问题。请注意，并不是\
  \ DAX Studio 独自解决了所有这些性能问题，而是用户解决了问题。DAX Studio 会提供巨大的帮助，因为它有助于发现问题的本质并找出性能瓶颈。\n\
  \n## 空白报表页\n\n使用 DAX Studio 的原因有很多：\n\n*   优化报表页面的整体性能\n*   优化特定度量值的性能\n*   探寻幕后发生的情况\n\
  \n但无论具体原因是什么，一切始于一个空白报表页。这样做是因为报表页面上每个可见的视觉对象都会创建自己的 `DAX` 查询。因此，有必要从一个空白报表页开始处理\
  \ `pbix` 文件，因为这样不会创建任何查询。将 DAX Studio 连接到打开的 Power BI 文件，启用`所有查询`跟踪标志，然后，如果 DAX\
  \ Studio 已设置好，切换到该报表页面。\n\n## 连接到 Power BI Desktop 文件\n\n由于 Power BI Desktop 发展迅速，DAX\
  \ Studio 的开发也同样迅速。因此，您可能会发现截图存在细微差异，但由于这不是官方文档，我们已尽量使用最新版本进行截图。\n\n尽管如此，要连接到一个 `pbix`\
  \ 文件，该文件必须处于打开状态。在连接到 `pbix` 文件之前，该文件必须已打开。请确保文件是从一个空白报表页开始的。如果报表并非始于空白页，请切换到一个空白页，或创建一个。保存文件，关闭\
  \ Power BI Desktop，然后再次打开该文件。\n\n\n\n#### 注意\n\n使用的 Power BI 文件是 `CH12 – a simple\
  \ report – large.pbix`。\n\n请确保报表以 `空白页` 报表页面处于活动状态启动。\n\n如果 `DAX Studio` 要求建立连接，它可以连接到各种类型的表格数据模型，但由于此处涉及的是\
  \ Power BI Desktop，请选择文件 `CH12 – a simple report – large.pbix`，如图 12-1 所示。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig1_HTML.jpg](img/471413_1_En_12_Fig1_HTML.jpg)\n\
  \n图 12-1 连接到 `pbix`\n\n图 12-2 将简要说明成功连接后你会看到的内容。\n\n| 我在这里 | 简要说明 |\n| --- | ---\
  \ |\n| ![../images/471413_1_En_12_Chapter/471413_1_En_12_Figa_HTML.jpg](img/471413_1_En_12_Figa_HTML.jpg)\
  \ | 数据模型。 |\n| ![../images/471413_1_En_12_Chapter/471413_1_En_12_Figb_HTML.jpg](img/471413_1_En_12_Figb_HTML.jpg)\
  \ | 可用视图：`Metadata` – 提供数据模型的洞察。 `Functions` – 可用的 DAX 函数列表。 `DMV` – 动态管理视图列表。请注意，并非所有\
  \ DMV 都能与 Power BI Desktop 文件内的数据模型结合使用。 |\n| ![../images/471413_1_En_12_Chapter/471413_1_En_12_Figc_HTML.jpg](img/471413_1_En_12_Figc_HTML.jpg)\
  \ | 选项卡：此表格将提供 DAX 查询的不同视角。 |\n| ![../images/471413_1_En_12_Chapter/471413_1_En_12_Figd_HTML.jpg](img/471413_1_En_12_Figd_HTML.jpg)\
  \ | 在 Power BI Desktop 内部运行的 Analysis Services 引擎实例的服务器名称。此服务器名称也可用于连接 SQL Server\
  \ Management Studio 到这个数据库。使用 SQL Server Profiler，它还可以用来追踪 Power BI 报表内部发生的情况。 |\n\
  | ![../images/471413_1_En_12_Chapter/471413_1_En_12_Fige_HTML.jpg](img/471413_1_En_12_Fige_HTML.jpg)\
  \ | 当前为空的部分，允许编写/修改 DAX 语句。这是编辑器窗口。 |\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig2_HTML.jpg](img/471413_1_En_12_Fig2_HTML.jpg)\n\
  \n图 12-2 首次接触\n\n## 探究我的报表内部发生了什么\n\n在 `DAX Studio` 连接到 Power BI 报表（更准确地说，连接到 Analysis\
  \ Services 引擎）后，就可以开始探究报表内部发生了什么。为此，需要激活 `所有查询` 追踪。点击菜单栏中的 `所有查询` 图标即可激活此追踪。\n\n\
  ![../images/471413_1_En_12_Chapter/471413_1_En_12_Figf_HTML.jpg](img/471413_1_En_12_Figf_HTML.jpg)\n\
  \n追踪的激活状态可视化地展示出来，因为图标现在已高亮显示。此追踪类型的激活状态也会显示在 `输出` 选项卡中（图 12-3）。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig3_HTML.jpg](img/471413_1_En_12_Fig3_HTML.jpg)\n\
  \n图 12-3 `所有查询` 追踪已激活\n\n### 简单视觉对象\n\n为了捕获报表页面激活时执行的查询，请激活 `简单视觉对象` 报表页面。\n\n激活报表页面后，DAX\
  \ 查询将出现在 `DAX Studio` 中（图 12-4）。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig4_HTML.jpg](img/471413_1_En_12_Fig4_HTML.jpg)\n\
  \n图 12-4 每个视觉对象都有自己的查询\n\n使用 `全部复制` 图标可以将所有追踪结果复制到编辑器窗口中（图 12-5）。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig5_HTML.jpg](img/471413_1_En_12_Fig5_HTML.jpg)\n\
  \n图 12-5 追踪结果 - 简单视觉对象\n\n目前，关键要点如下：\n\n- 每个视觉对象都由其查询填充数据。\n- 每个查询都返回一个表格，即使是被用来填充卡片视觉对象的查询也是如此。\n\
  \n### Power BI 报表页面和筛选器窗格\n\n在 2018 年 11 月，产品团队为 Power BI Desktop 引入了新的筛选器体验。除了通过放置切片器来重新获得宝贵的屏幕空间之外，筛选器窗格的另一个基本功能几乎悄无声息地随之而来。如前所述，每个可见的视觉对象都会生成自己的\
  \ DAX 查询。添加到新筛选器窗格中的列在报表启动时不会被计算。\n\n清单 12-1 显示了当激活 `简单视觉对象 – 切片器` 报表页面时生成的 DAX\
  \ 查询。\n\n```\n// DAX query against Database: CH12 - a simple report\nEVALUATE\n\
  ROW(\n\"SumProfit\", CALCULATE(SUM('Fact Sale'[Profit])),\n\"SumQuantity\", CALCULATE(SUM('Fact\
  \ Sale'[Quantity])),\n\"SumTax_Amount\", CALCULATE(SUM('Fact Sale'[Tax Amount])),\n\
  \"SumTax_Rate\", CALCULATE(SUM('Fact Sale'[Tax Rate]))\n)\n// DAX query against\
  \ Database: CH12 - a simple report\nEVALUATE\nTOPN(\n101,\nVALUES('Dimension Customer'[Customer\
  \ Key]),\n'Dimension Customer'[Customer Key],\n\n)\nORDER BY\n'Dimension Customer'[Customer\
  \ Key]\n// DAX query against Database: CH12 - a simple report\nEVALUATE\nROW(\n\"\
  SumQuantity\", CALCULATE(SUM('Fact Sale'[Quantity]))\n)\n// DAX query against Database:\
  \ CH12 - a simple report\nEVALUATE\nROW(\n\"SumTax_Rate\", CALCULATE(SUM('Fact Sale'[Tax\
  \ Rate]))\n)\n// DAX query against Database: CH12 - a simple report\nEVALUATE\n\
  ROW(\n\"SumTax_Amount\", CALCULATE(SUM('Fact Sale'[Tax Amount]))\n)\n// DAX query\
  \ against Database: CH12 - a simple report\nEVALUATE\nROW(\n\"SumProfit\", CALCULATE(SUM('Fact\
  \ Sale'[Profit]))\n)\n// DAX query against Database: CH12 - a simple report\nEVALUATE\n\
  ROW(\n\"SumQuantity\", CALCULATE(SUM('Fact Sale'[Quantity])),\n\"SumProfit\", CALCULATE(SUM('Fact\
  \ Sale'[Profit])),\n\"SumTax_Amount\", CALCULATE(SUM('Fact Sale'[Tax Amount])),\n\
  \"SumTax_Rate\", CALCULATE(SUM('Fact Sale'[Tax Rate]))\n)\nListing 12-1\nDAX queries\
  \ – report page “Simple Visuals – slicer.dax”\n```\n\n清单 12-1 包含一个用于填充报表页面上切片器的\
  \ DAX 查询。该 DAX 查询在此清单中已高亮显示。\n\n如果从 `简单视觉对象 – 筛选器窗格` 报表页面捕获 DAX 查询，需要注意的是，不会执行任何\
  \ DAX 语句来填充切片器，或者更准确地说，填充添加到筛选器窗格页面级部分的筛选器。\n\n图 12-6 显示已从筛选器中选中了一个值。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig6_HTML.jpg](img/471413_1_En_12_Fig6_HTML.jpg)\n\
  \n图 12-6 选中了值的筛选器窗格\n\n如果从报表页面捕获查询，并且选中的值是 `Customer Key is 100`，那么需要注意的是，只会创建/执行六个查询。清单\
  \ 12-2 仅显示了这六个查询中的一个。\n\n```\nDEFINE VAR __DS0FilterTable =\nTREATAS({\"100\"},\
  \ 'Dimension Customer'[Customer Key])\nEVALUATE\nSUMMARIZECOLUMNS(\n__DS0FilterTable,\n\
  \"SumTax_Amount\", IGNORE(CALCULATE(SUM('Fact Sale'[Tax Amount])))\n)\nListing 12-2\n\
  DAX queries – report page “Simple Visuals – filter pane selected value.dax”\n```\n\
  \n需要注意到的重要事项是：它并没有执行查询来填充切片器，而是仅给每个查询添加了一个很小的字符串，该字符串定义了一个筛选器表，并在查询中用于检索视觉对象的数据。定义筛选器表的行已被高亮显示（粗体）。\n\
  \n### 提示\n\n将切片器移到筛选器窗格！你实际使用它的频率可能远低于你的想象。这可以极大地提高报表/报表页面的整体性能。\n\n\n\n### 报表级与页面级筛选器：提示与警告\n\
  \n通常情况下，数据模型会包含一些不应在报表页面或整个报表中使用的数据。因此，可以通过定义**页面级筛选器**或**报表级筛选器**来排除列中的特定值。图 12-7\
  \ 展示了两个被排除的销售区域；该图引用的是名为“报表与页面级筛选器”的报表页面。\n\n#### 注意事项\n\n此前的所有截图和列表均未考虑报表级筛选器；因此，若要跟随本节内容进行学习，必须添加该筛选器。\n\
  \n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig7_HTML.jpg](img/471413_1_En_12_Fig7_HTML.jpg)\n\
  \n**图 12-7** – 报表级与页面级筛选器\n\n列表 12-3 展示了通过启用“报表与页面级筛选器”报表页面所创建的所有查询。该列表包含为填充报表页面上的视觉对象而执行的全部四个查询。\n\
  \n```\n// DAX query against Database: CH12 - a simple report\nDEFINE VAR __DS0FilterTable\
  \ =\nFILTER(\n    KEEPFILTERS(VALUES('Dimension City'[Sales Territory])),\n    AND(\n\
  \        'Dimension City'[Sales Territory] <> \"Southeast\",\n        'Dimension\
  \ City'[Sales Territory] <> \"Southwest\"\n    )\n)\nEVALUATE\nSUMMARIZECOLUMNS(\n\
  \    __DS0FilterTable,\n    \"Quantity___All_Sales_Territories\", IGNORE('Fact Sale'[Quantity\
  \ - All Sales Territories])\n)\n// DAX query against Database: CH12 - a simple report\n\
  DEFINE VAR __DS0FilterTable =\nFILTER(\n    KEEPFILTERS(VALUES('Dimension City'[Sales\
  \ Territory])),\n    AND(\n        'Dimension City'[Sales Territory] <> \"Southeast\"\
  ,\n        'Dimension City'[Sales Territory] <> \"Southwest\"\n    )\n)\nEVALUATE\n\
  SUMMARIZECOLUMNS(\n    __DS0FilterTable,\n    \"Quantity___Values_Sales_Territories_\"\
  , IGNORE('Fact Sale'[Quantity - Values(Sales Territories)])\n)\n// DAX query against\
  \ Database: CH12 - a simple report\nDEFINE VAR __DS0FilterTable =\nFILTER(\n   \
  \ KEEPFILTERS(VALUES('Dimension City'[Sales Territory])),\n    AND(\n        'Dimension\
  \ City'[Sales Territory] <> \"Southeast\",\n        'Dimension City'[Sales Territory]\
  \ <> \"Southwest\"\n    )\n)\nEVALUATE\nTOPN(\n    502,\n    SUMMARIZECOLUMNS(\n\
  \        ROLLUPADDISSUBTOTAL('Dimension City'[Sales Territory], \"IsGrandTotalRowTotal\"\
  ),\n        __DS0FilterTable,\n        \"Total_Quantity\", 'Fact Sale'[Total Quantity],\n\
  \        \"quantity_divided_by_all\", 'Fact Sale'[quantity divided by all],\n  \
  \      \"quantity_divided_by_allselected\", 'Fact Sale'[quantity divided by allselected],\n\
  \        \"quantity_divided_by_values\", 'Fact Sale'[quantity divided by values]\n\
  \    ),\n    [IsGrandTotalRowTotal],\n    0,\n    'Dimension City'[Sales Territory],\n\
  )\nORDER BY\n    [IsGrandTotalRowTotal] DESC, 'Dimension City'[Sales Territory]\n\
  // DAX query against Database: CH12 - a simple report\nDEFINE VAR __DS0FilterTable\
  \ =\nFILTER(\n    KEEPFILTERS(VALUES('Dimension City'[Sales Territory])),\n    AND(\n\
  \        'Dimension City'[Sales Territory] <> \"Southeast\",\n        'Dimension\
  \ City'[Sales Territory] <> \"Southwest\"\n    )\n)\nEVALUATE\nSUMMARIZECOLUMNS(\n\
  \    __DS0FilterTable,\n    \"Quantity___ALLSELECTED_Sales_Territory_\", IGNORE('Fact\
  \ Sale'[Quantity - ALLSELECTED(Sales Territory)])\n)\n```\n\n**列表 12-3** – `DAX\
  \ queries – \"report and page level filter.dax\"`\n\n页面级筛选器（`销售区域不是 Southeast`）和报表级筛选器（`销售区域不是\
  \ Southwest`）被合并到同一个筛选表 `__DS0FilterTable` 中。这一合并操作通过以下代码行实现：\n\n```\nDEFINE VAR\
  \ __DS0FilterTable =\nFILTER(\n    KEEPFILTERS(VALUES('Dimension City'[Sales Territory])),\n\
  \    AND(\n        'Dimension City'[Sales Territory] <> \"Southeast\",\n       \
  \ 'Dimension City'[Sales Territory] <> \"Southwest\"\n    )\n)\n```\n\n这里需要注意：在定义变量之前必须使用\
  \ `DEFINE` 关键字；定义部分以下一个 `EVALUATE` 语句结束。该筛选表包含当前筛选上下文中 `'Dimension City'[Sales Territory]`\
  \ 列的所有值，但排除了由页面级和报表级筛选器排除的值。这个筛选表会被用于每个查询中。\n\n### 警告\n\n每当使用 `ALL` 函数时，被页面级或报表级筛选器排除的值将被重新包含进来。因此，当使用报表级筛选器排除或指定一个或多个值时，请花点时间考虑在数据加载期间将这些元素从数据集中移除。在报表级和页面级筛选器与\
  \ `ALL` 函数结合使用时，容易出错。换句话说，`ALL` 函数不会考虑报表级或页面级筛选器。\n\n### 时间智能：自动日期/时间\n\n每当 DAX\
  \ Studio 连接到 `pbix` 文件时，它不仅会显示显而易见的表，还会显示一些系统表。这些系统表在图 12-8 中已高亮显示。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig8_HTML.jpg](img/471413_1_En_12_Fig8_HTML.jpg)\n\
  \n**图 12-8** – 日期列与日期表\n\n目前，Power BI 会为每个数据类型为 `date` 或 `datetime` 的列自动创建专用的日期表。如果一张表中有两个日期列，则会创建两个表。如果在另一张表中还有另外两个此类数据类型的列，则又会创建两个日期表。这种功能通常被认为是一种不良“习惯”，原因如下：\n\
  \n- 内存消耗\n- 数据模型的加载时间\n\n内存消耗可以忽略不计，因为 Power BI Desktop 内部的数据模型仅占用大约 834 MB 的 RAM。\n\
  \n模型的加载和刷新时间则更为重要，尤其是当数据模型中包含大量日期或日期时间列时。尽管这些系统生成的表不会造成任何损害，但众所周知的最佳实践是不要依赖这些系统日期表。\n\
  \n与专用的日历表相比，这些表似乎有一个优势：每当在视觉对象上使用日期列时，它们允许使用日期层级结构。该层级结构是在 `DateTableTemplate` 中定义的，但也可以在专用的日历表中定义层级结构。\n\
  \n要禁用这些系统日期表的创建，需要禁用“自动日期/时间”设置，如图 12-9 所示。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig9_HTML.jpg](img/471413_1_En_12_Fig9_HTML.jpg)\n\
  \n**图 12-9** – 时间智能 – 自动日期/时间\n\n### DAX Studio 中的 DAX 查询编辑器\n\n\n\n#### 注意\n\n\
  从现在开始，将使用\"CH12 – a simple report.pbix\"。\n\n在开始优化 DAX 语句之前，有必要先熟悉编辑器。因此，请打开\"CH12\
  \ – a simple report.pbix\"文件，并确保它以\"Blank page\"报表页启动；如果不是这样，请选择此页面，保存文件，然后重新打开。\n\
  \n当文件以\"Blank page\"页面激活状态打开后，启动`DAX Studio`，连接到 Power BI Desktop 文件，并激活`All Queries`跟踪。\n\
  \n在左侧的`Metadata`选项卡中，标记度量值`Quantity – All Sales Territories`并打开其上下文菜单。如图 12-10 所示。\n\
  \n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig10_HTML.jpg](img/471413_1_En_12_Fig10_HTML.jpg)\n\
  \n图 12-10\n\n`DAX Studio`编辑器 – 度量值上下文菜单\n\n这三个命令的工作原理如下：\n\n| 命令 | 动作 |\n| --- |\
  \ --- |\n| `Define Measure` | 将度量值的定义复制到编辑器中 – 结果：`DEFINE` `MEASURE 'Fact Sale'[Quantity\
  \ - All Sales Territories] = CALCULATE(` `[Total Quantity]` `,ALL('Dimension City'[Sales\
  \ Territory])` `)` |\n| `Define Dependent Measures` | 将度量值的定义复制到编辑器中 – 结果：`DEFINE`\
  \ `---- MODEL MEASURES BEGIN ----` `MEASURE 'Fact Sale'[Total Quantity] = CALCULATE(SUM('Fact\
  \ Sale'[Quantity]) )` `---- MODEL MEASURES END ----` `MEASURE 'Fact Sale'[Quantity\
  \ - All Sales Territories] = CALCULATE(` `[Total Quantity]` `,ALL('Dimension City'[Sales\
  \ Territory])` `)` |\n| `Define and Expand Measure` | 创建一个单独度量值，其中所有依赖的度量值都被展开 –\
  \ 结果：`DEFINE` `MEASURE 'Fact Sale'[Quantity - All Sales Territories] = CALCULATE(`\
  \ `CALCULATE ( CALCULATE(SUM('Fact Sale'[Quantity]) ) )` `,ALL('Dimension City'[Sales\
  \ Territory])` `)` |\n\n#### 使用度量值定义\n\n从`Metadata`选项卡中，为`Fact Sale`表中的度量值`quantity\
  \ divide by all`选择上下文菜单中的\"Define Dependent Measures\"。如图 12-11 所示。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig11_HTML.jpg](img/471413_1_En_12_Fig11_HTML.jpg)\n\
  \n图 12-11\n\n`DAX Studio`编辑器 – 定义依赖度量值\n\n图 12-12 显示了此操作在查询编辑器中的结果。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig12_HTML.jpg](img/471413_1_En_12_Fig12_HTML.jpg)\n\
  \n图 12-12\n\n`DAX Studio`编辑器 – 依赖度量值\n\n这一点至关重要：\n\n#### 注意\n\n`DEFINE` 引入度量值的定义阶段。关键字\
  \ `MEASURE` 开始度量值定义。\n\n如果你想知道为什么使用表名作为前缀，这对应于度量值分配到的表。在 Power BI 中引用度量值时，不要使用表名。这会混淆\
  \ DAX 语句的读者。\n\n## 查询性能\n\n查询性能优化通常旨在减少计算度量值所需的时间。创建能返回预期正确结果的 DAX 语句需要时间，而创建能以极速返回正确结果的\
  \ DAX 语句则需要更多时间。这不能仅仅通过阅读一本书来实现。当然，这可能会有所帮助，但没有实践和更多的实践，更不用说实践的重要性，是不可能掌握 DAX 的。\n\
  \n为了更好地理解发生了什么，有必要了解如何使用`DAX Studio`跟踪性能；有必要捕获一个查询。因此，请打开 pbix 文件\"CH12 – a simple\
  \ report.pbix\"，并确保文件以\"Blank page\"报表页打开。将`DAX Studio`连接到该文件并启用`All Queries`跟踪。\n\
  \n然后激活报表页\"open events – unrelated\"。我们感兴趣的是清单 12-4 中所示的 DAX 语句。\n\n```\nEVALUATE\n\
  TOPN(\n502,\nSUMMARIZECOLUMNS(\nROLLUPADDISSUBTOTAL('Dimension Date unrelates'[Calendar\
  \ Month Label], \"IsGrandTotalRowTotal\"),\n\"events_in_progress___not_so_fast\"\
  , 'Fact Sale'[events in progress - not so fast]\n),\n[IsGrandTotalRowTotal],\n0,\n\
  'Dimension Date unrelates'[Calendar Month Label],\n\n)\nORDER BY\n[IsGrandTotalRowTotal]\
  \ DESC, 'Dimension Date unrelates'[Calendar Month Label]\n清单 12-4\nDAX 查询 – \"event\
  \ not so fast.dax\"\n```\n\n目前，完全理解正在发生的事情并不那么重要。但是，通过双击查询选择\"large\"查询（持续时间），`DAX\
  \ Studio`将如图 12-13 所示。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig13_HTML.jpg](img/471413_1_En_12_Fig13_HTML.jpg)\n\
  \n图 12-13\n\n事件 – 准备服务器计时\n\n将感兴趣的查询捕获到查询编辑器后，可以切换跟踪。第一个跟踪将是`Server Timings`（参见图\
  \ 12-14）。要激活此跟踪，需要先停用\"All Queries\"跟踪。\n\n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig14_HTML.jpg](img/471413_1_En_12_Fig14_HTML.jpg)\n\
  \n图 12-14\n\n事件 – 服务器计时\n\n激活`Server Timings`跟踪后，`Server Timings`输出窗口将变为可用（图 12-15）。\n\
  \n![../images/471413_1_En_12_Chapter/471413_1_En_12_Fig15_HTML.jpg](img/471413_1_En_12_Fig15_HTML.jpg)\n\
  \n图 12-15\n\n事件 – 服务器计时输出\n\n有必要理解每次运行所测量的性能计数器。这些是常用的性能计数器：\n\n*   `Total` – 总查询持续时间（毫秒）\n\
  *   `FE`（公式引擎） – 使用公式引擎所花费的时间\n*   `SE`（存储引擎） – 使用存储引擎所花费的时间\n\n必须记住，存储引擎是快速引擎。这意味着在公式引擎中花费的时间越多，查询优化（即\
  \ DAX 优化）就变得越重要。\n\n更详细的描述可以在这里找到：`https://daxstudio.org/documentation/features/server-timings-trace/`。\n\
  \n"
- "# 13. 查询计划\n\n\n\n## 查询计划简介\n\n`DAX` 引擎的一项便捷功能是能够访问名为“查询计划”的有用信息。查询计划可以深入了解 `DAX`\
  \ 引擎如何执行其任务，以交付任何给定 `DAX` 查询所请求的结果。\n\n一个现实中的类比可能是提供完成某个特定项目所需任务的分解。如果项目是建造一个鸟屋，可以在开始前生成一个项目计划，并在执行特定测试后随时更新。\n\
  \n一个用于建造鸟屋的伪查询计划可能如下所示：\n\n```\n用设计工具组装零件。\n寻找理想鸟屋的蓝图。\n在互联网上搜索想法。\n获取所需的零件。\n开车去五金店采购材料。\n\
  支付材料费用。\n从工坊取回所需工具。\n拿锤子。\n拿锯子。\n拿钉子。\n拿卷尺。\n```\n\n在这个示例中，计划中的每一行都代表整个项目的一个子任务。项目的最终步骤列在最顶行，缩进程度最小。任务的顺序不一定是自上而下的。有三个同级节点专门对应寻找蓝图、获取零件和工具的任务。这三个同级节点都有一系列子任务，这些子任务与紧接其下的具体步骤相关，缩进有助于突出显示每个子任务在节点内的顺序和关系。\n\
  \n查询计划在尝试调试或优化性能缓慢的查询时尤其有用。如果你用过 `T-SQL`，可能对这个概念并不陌生，因为使用 `SQL Server` 数据库引擎时也能获得类似的查询计划。当你执行\
  \ `T-SQL` 查询时，可以选择将查询计划与查询结果一起返回。可以在 `SSMS` 工具中将 `T-SQL` 查询计划视为返回结果所采用方法的图形化描述。\n\
  \n`T-SQL` 版本的查询计划提供了每个子步骤的分解，并包含有用的信息，例如每个步骤所花费的时间、是否使用了索引、每个子步骤输入或输出的行数等。\n\n`DAX`\
  \ 版本的查询计划是基于文本的，并使用多行和缩进进行格式化，以提供基本的树形结构。计划中的每一行都代表整个查询中的一个操作。任何能够针对 `Analysis Services`\
  \ 数据模型启动并运行跟踪的客户端工具都可以使用查询计划。缩进和等效的制表符间距用于突出显示同级节点与子任务。\n\n### 有关查询计划的更多信息\n\n在\
  \ `DAX` 中，每个查询会生成三个计划。但只有两个计划作为跟踪事件公开。这三个计划是：\n\n- 查询表达式树\n- 逻辑计划\n- 物理计划\n\n查询表达式树是\
  \ `DAX` 表达式的直接树形映射，不会作为探查器事件出现在数据库跟踪中。查询表达式树会被转换并简化为逻辑计划树。`DAX` 引擎可能会在构建物理计划树之前部分执行逻辑树。物理计划被执行，以从数据库返回最终数据集。\n\
  \n在针对数据库运行跟踪时，“查询计划”事件始终返回两个查询计划。一个是逻辑计划，另一个是物理计划。逻辑计划可以帮助你了解高级函数使用的原始操作。可以使用逻辑计划识别函数是其他操作的语法糖快捷键的场景。\n\
  \n物理计划有助于突出显示查询中公式引擎导致性能问题的区域。\n\n### 如何查找\n\n可用于访问查询计划的两个免费工具是 `DAX Studio` 和 `SQL\
  \ Server Management Studio (SSMS)`。这两个工具都可以针对 `SQL Server Analysis Services (SSAS)`\
  \ 数据库的实例运行探查器跟踪。`Power BI Desktop` 是一个 `SSAS` 数据库实例。\n\n探查器跟踪可捕获数据库引擎内发生的事件。事件形式多样，且并非总是与用户生成的查询相关。在针对数据模型启动跟踪时，只需选择特定感兴趣的事件；否则，跟踪会产生大量信息，难以聚焦到有用的细节上。\n\
  \n一旦跟踪启动，可以暂停或停止它。捕获的事件可以保存为 `TRC` 文件，以供后续查看。\n\n使用 `SSMS` 运行跟踪的第一步是连接到目标数据模型。如图\
  \ 13-1 所示，连接时需要提供数据模型的端口号。有几种方法可以确定 `Power BI Desktop` 实例的本地端口号。查找端口号最简单的方法之一是使用\
  \ `DAX Studio` 连接到你想要运行跟踪的数据模型。图 13-1 中显示的端口号是 `localhost:50086`，在为跟踪连接到数据模型时，需要完整添加此信息。\n\
  \n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig1_HTML.jpg](img/471413_1_En_13_Fig1_HTML.jpg)\n\
  \n*图 13-1* – 显示 `Power BI Desktop` 实例的端口号\n\n可以从 `SSMS` 的“工具”菜单中启动探查器工具，方法是点击“`SQL\
  \ Server Profiler`”选项。也可以从操作系统菜单中直接启动该工具，只需在搜索区域中搜索“`SQL Server Profiler`”即可。探查器工具启动后，会出现一个类似图\
  \ 13-2 的对话框，要求提供如何连接到数据模型的信息。\n\n对于本地机器上的 `Power BI Desktop`，“服务器类型”下拉框应始终设置为“`Analysis\
  \ Services`”。“服务器名称”文本框中需要包含文本 `localhost:` 以及你要连接的实例的当前端口号。每次重新启动 `Power BI Desktop`\
  \ 时，此端口号都会发生变化。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig2_HTML.jpg](img/471413_1_En_13_Fig2_HTML.jpg)\n\
  \n*图 13-2* – 显示探查器工具的连接对话框\n\n\n\n### 说明\n\n在 Power BI Web 服务中开启 XMLA 端点后，你可以将 Profiler\
  \ 工具直接连接到云中已发布的数据模型。\n\n一旦 Profiler 工具成功连接到一个数据模型，就可以通过**文件**菜单中的*新建跟踪*选项启动新跟踪。点击*新建跟踪*会打开一个跟踪属性窗口。该窗口中的**事件选择**选项卡会列出跟踪运行期间报告的事件。建议选择以下事件进行基本跟踪：\n\
  \n- **查询事件**\n    - `Query End`\n- **查询处理**\n    - `DAX Query Plan`\n    - `VertiPaq\
  \ SE Query Cache Match`\n    - `VertiPaq SE Query End`\n\nAlberto Ferrari 在 2012\
  \ 年撰写的一篇题为“理解 DAX 查询计划”的白皮书中指出，这些事件是捕获 Analysis Services 数据库跟踪时的理想事件。我同意这些事件是极好的起点，只有在更高级的场景下才应添加其他事件类型。这两个查询事件仅适用于导入的表。DirectQuery\
  \ 表则有不同的事件。\n\n图 13-3 展示了按推荐事件配置后的跟踪属性窗口。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig3_HTML.jpg](img/471413_1_En_13_Fig3_HTML.jpg)\n\
  \n**图 13-3** – SSMS Profiler 推荐的跟踪属性事件\n\n事件定义完成后，点击跟踪属性窗口中的**运行**按钮即可启动跟踪。此后，任何针对数据模型的查询都会向显示跟踪活动的窗口添加多个跟踪事件。跟踪窗口包含\
  \ Power BI Desktop 报表画布区域中的用户活动，以及使用 SSMS 或 DAX Studio 直接针对数据模型发出的 DAX 查询。\n\n可以重新排列跟踪窗口中的列，以便将有用的列分组到窗口的左侧。以下是一些方便移动到列顺序左侧的列：\n\
  \n- `EventClass`\n- `EventSubclass`\n- `Duration`\n- `CPUTime`\n\n### 说明\n\n跟踪事件可以保存为跟踪模板，以便在将来调试时快速检索事件集。\n\
  \n## 基本计划（我的第一个计划）\n\n使用一个简单的 DAX 查询来介绍 DAX 查询计划的结构和基本布局，以帮助将计划提供的信息量保持在最低限度。清单\
  \ 13-1 中显示的查询非常简单，旨在清晰明了，而非反映更真实的场景。\n\n```\nEVALUATE\nROW(\n\"My Column Name\"\
  ,\n1 + 1\n)\n```\n\n**清单 13-1** – 用于生成简单查询计划的基本 DAX 查询\n\n图 13-4 显示了 SSMS 中的查询以及使用清单\
  \ 13-1 中的查询预期的结果“2”。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig4_HTML.jpg](img/471413_1_En_13_Fig4_HTML.jpg)\n\
  \n**图 13-4** – 使用 SSMS 的基本 DAX 查询及结果\n\n当清单 13-1 中的查询在启用了跟踪的数据模型上运行时，会报告以下三个事件。其中两个事件是\
  \ `DAX Query Plan`，第三个是 `Query End` 事件。`EventSubClass` 列中的详细信息显示了两个 `DAX Query Plan`\
  \ 事件中哪个是逻辑计划，哪个是物理计划。\n\n当选中单个 `DAX Query Plan` 行时，跟踪窗口的底部会显示每个查询计划的完整详细信息。相同的信息也会显示在\
  \ `TextData` 列中。\n\n### 逻辑计划（我的第一个计划）\n\n逻辑计划中每一行的结构都遵循相同的模式。第一个冒号之前的第一个文本项是运算符名称。第一个冒号之后的所有文本代表运算符属性，其中运算符属性的第一项显示运算符类型。\n\
  \n如表 13-1 所示，逻辑计划运算符类型只有两种。`ScaLogOp` 类型始终返回单个值。`RelLogOp` 类型通常处理涉及多列且这些列不总是在同一张表上的操作。`RelLogOp`\
  \ 运算符类型通常可以有使用 `ScaLogOp` 运算符类型的子步骤。`ScaLogOp` 运算符类型也可以将 `RelLogOp` 作为子步骤。\n\n**表\
  \ 13-1** – 逻辑计划的运算符类型\n\n| 运算符类型 | 描述 |\n| --- | --- |\n| `ScaLogOp` | 标量逻辑运算符 –\
  \ 返回单个值（文本、数字、布尔值等） |\n| `RelLogOp` | 关系逻辑运算符 – 返回值表 |\n\n**表 13-2** – 物理计划的运算符类型\n\
  \n| 运算符类型 | 描述 |\n| --- | --- |\n| `LookupPhyOp` | 查找物理运算符 – 以当前行为输入，返回单个标量值 |\n\
  | `IterPhyOp` | 迭代器物理运算符 – 返回一行序列 – 可选的以当前行作为输入 |\n\n### 说明\n\n最常用的 `RelLogOp` 之一来自\
  \ `Values('Table'[Column])`，这是一个单列。`ScaLogOp` 和 `RelLogOp` 之间的区别在于前者返回值，后者返回表，无论涉及的列数和物理表数量如何。\n\
  \n清单 13-1 中的查询生成的逻辑计划如清单 13-2 所示。\n\n```\nAddColumns: RelLogOp DependOnCols()()\
  \ 0-0 RequiredCols(0)(\"[My Column Name])\nConstant: ScaLogOp DependOnCols()() Integer\
  \ DominantValue=2\n```\n\n**清单 13-2** – 为清单 13-1 中的查询返回的逻辑计划\n\n在清单 13-2 所示的示例中，逻辑计划由两行组成。每行中的第一个文本项是运算符名称。第一行中，运算符名称是\
  \ `AddColumns`，第二行中，运算符名称是 `Constant`。这些代表了 DAX 为满足查询的每个方面而使用的基础原始函数。\n\n第一行的运算符类型是\
  \ `RelLogOp`。该运算符类型与 `AddColumns` 的运算符名称相结合，表明它们属于清单 13-1 查询中的 `ROW()` 函数，并且与返回最终表的工作相关。\n\
  \n第二行的运算符类型 `ScaLogOp`，与 `Constant` 的运算符名称相结合，表明这一行与简单的数学运算相关。\n\n该查询没有引用数据模型中的任何表或列，因此跟踪中不会报告与存储引擎相关的事件。\n\
  \n运算符属性中的其他文本提供了与每个运算符相关的额外详细信息。\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\
  \n\n### 物理计划（我的第一个计划）\n\n物理计划的结构与逻辑计划相同。每行中的第一个文本代表运算符名称。物理计划中有许多运算符，它们提供了线索，表明使用了哪个内部\
  \ DAX 函数来满足查询的每个方面。表 13-2 显示了物理计划的主要运算符类型。\n\n第一个分号后的文本与该行的运算符属性有关，分号后的第一项声明了该运算符的运算符类型。物理计划只能有两种类型的运算符。\n\
  \n清单 13-1 中的查询生成的物理计划如清单 13-3 所示。\n\n```\nAddColumns: IterPhyOp LogOp=AddColumns\
  \ IterCols(0)(\"[My Column Name])\nSingletonTable: IterPhyOp LogOp=AddColumns\n\
  Constant: LookupPhyOp LogOp=Constant Integer 2\nListing 13-3\nThe Physical Plan\
  \ returned for the query in Listing 13-1\n```\n\n此物理计划有三行。顶行代表查询的最终输出。查询有两个处于同一级别的子节点。`SingletonTable`\
  \ 运算符的类型为 `IterPhyOp`，这意味着它可能返回一系列行。计划的第三行，即底行，告诉我们该运算符是 `Constant`，类型为 `LookupPhyOp`，这意味着它返回单个值。该行的附加属性指定该值为\
  \ 2（1+1 的结果），并且 `Constant` 的数据类型为 Integer。\n\n### 查询时间\n\n#### 注意\n\nDAX 查询计划事件类型不会报告事件探查器跟踪中的持续时间值。\n\
  \n逻辑计划和物理计划事件都不会报告持续时间，这意味着仅凭这些事件并不总能用于调试长时间运行的查询。通常，将 DAX 查询计划*与*其他事件相结合有助于隔离和识别性能不佳的查询背后的原因。\n\
  \n## 清除缓存\n\n调试 DAX 查询性能时，一个关键提示是需要在查询之间清除 DAX 引擎缓存，以便进行公平的比较。在不清除缓存的情况下连续运行相同的查询，可能会因后续执行利用了缓存结果而导致持续时间值出现偏差。\n\
  \nxVelocity 引擎保存了一个小型缓存，可以通过在事件探查器跟踪中包含 *VertiPaq SE Query Cache Match* 事件来观察。理想情况下，在进行性能测试时，您不应看到此事件发生。此事件表明查询利用了先前同一查询的执行结果。\n\
  \n清除缓存需要向数据模型传递一个 XMLA 查询。可以在 SSMS 或 DAX Studio 中执行该 XMLA 查询。\n\n### 使用 SSMS\n\n\
  要使用 SSMS 清除数据模型缓存，请启动一个新的 XMLA 查询类型，并连接到相关的数据模型。通过单击“新建查询”菜单项中的 XMLA 按钮（如图 13-5\
  \ 所示）来启动一个新的 XMLA 查询类型会话。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig5_HTML.jpg](img/471413_1_En_13_Fig5_HTML.jpg)\n\
  \n图 13-5\n\n使用 SSMS 菜单启动到数据模型的 XMLA 连接\n\nXMLA 命令可以从任何查询类型（MDX、DMX、XMLA 和 DAX）中应用；但是，在\
  \ DAX 或 MDX 连接窗口中使用时，可以在 `ClearCache` 块和 DAX `EVALUATE` 语句之间插入 `GO` 语句，以同时批处理并运行多个\
  \ DAX 语句。图 13-8 显示了一个在 SSMS 中使用 `GO` 语句的代码示例。\n\n使用 `GO` 和 `ClearCache` 语句分隔多个 DAX\
  \ 查询是在同一批次中执行相似查询以进行调试和诊断的绝佳方法。此技术还有助于防止意外忘记清除缓存，并避免因错误的性能结果而分心。图 13-8 显示了一个与 DAX\
  \ 查询结合使用的 `ClearCache` 命令示例。请确保在批处理中的每个 DAX 语句之前添加一个 XMLA `ClearCache` 语句。\n\n一旦成功建立\
  \ XMLA 连接，就可以发出图 13-6 中的 `ClearCache` 查询。请注意，`DatabaseID` 元素内的值需要更新以反映每个数据模型。不要使用图\
  \ 13-6 中显示的 `DatabaseID`。如果数据模型是 Power BI Desktop 文件，则该值可能是一个由字母、数字和连字符组成的 GUID\
  \ 样式的字符串，每次关闭并重新打开 pbix 文件时该字符串都会发生变化。\n\nSSMS 对象资源管理器在对象层次结构树中显示数据库的名称。在 SSMS 中按\
  \ F8 键可显示对象资源管理器窗口。\n\n用于 `DatabaseID` 的值需要精确匹配，如果从 SSMS 对象资源管理器中拖拽该值，则可能需要移除开头/结尾的一些方括号。\n\
  \n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig6_HTML.jpg](img/471413_1_En_13_Fig6_HTML.jpg)\n\
  \n图 13-6\n\n用于清除数据模型缓存的 XMLA 查询\n\n一旦清除缓存查询运行成功，您应该会看到类似于图 13-7 的结果。如果清除缓存查询失败，请仔细阅读错误消息，但很可能是由不正确的\
  \ `DatabaseID` 引起的。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig8_HTML.jpg](img/471413_1_En_13_Fig8_HTML.jpg)\n\
  \n图 13-8\n\n在 SSMS DAX 查询窗口中使用 `GO` 关键字批处理多条语句\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig7_HTML.jpg](img/471413_1_En_13_Fig7_HTML.jpg)\n\
  \n图 13-7\n\n成功清除缓存的 XMLA 查询结果\n\n## 我的下一个查询\n\n下一个查询扩展了前面的示例，但将硬编码的常量替换为使用存储引擎的一些\
  \ DAX。更新后的查询是对 `Quantity` 列的简单 `SUM`，如清单 13-4 所示。此未筛选的代码生成一个值为 8,950,628 的单个值。\n\
  \n```\nEVALUATE\nROW (\n\"Sum of Quantity\",\nSUM('Fact Sale'[Quantity])\n)\nListing\
  \ 13-4\nA Simple DAX query showing the SUM over the entire Quantity column\n```\n\
  \n### 逻辑计划\n\n清单 13-4 中查询的四行逻辑计划如图 13-9 所示。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig9_HTML.jpg](img/471413_1_En_13_Fig9_HTML.jpg)\n\
  \n图 13-9\n\n清单 13-4 中查询的逻辑计划\n\n逻辑计划的顶行与清单 13-2 中的示例相比没有变化。此顶行与最终输出相关，并表示查询中使用的\
  \ `ROW` 函数。\n\n计划中的其余行与查询中使用的 `SUM` 函数相关。第二行运算符名称为 `Sum_VertiPaq`，类型为 `ScaLogOp`。所有逻辑\
  \ `ScaLogOp` 类型都共有的运算符属性包括 `DependsOnCol`、`DataType` 和 `DominantValue` 属性。\n\n\n\
  \n#### `DependsOnCols`\n\n`DependsOnCols` 属性显示两对括号，且对于 `ScaLogOp` 和 `RelLogOp` 来说格式相同。这些括号有时可能为空，如当前逻辑计划中的第\
  \ 2 行所示。当这些括号被填充数值时，第一对括号显示一个逗号分隔的数字列表，这些数字与数据模型中的内部列 ID 相关。此编号与模型中的列 ID 无关，它仅是在当前查询中唯一标识某个列实例的数字。第二对括号显示相同列的完全限定文本版本。\n\
  \n列数字有助于识别查询中同一列的多个引用。例如，在累计总计计算中，内部循环和外部循环对同一列进行不同追踪时，就会出现这种情况。\n\n括号并不总是被填充，有时会显示为\
  \ `()()`，表示不依赖任何列。\n\n#### 列范围（仅适用于 `RelLogOp`）\n\n仅针对 `RelLogOp` 操作，在 `DependsOnCol`\
  \ 属性之后可能会显示一个额外的数字范围。该数字指代一个列范围，这些列确定了查询下一部分所需的最小列集合。如果查询不涉及关系，则计划中可能不会出现此范围。\n\n\
  列范围的格式为 `*<起始列 ID> - <结束列 ID>*`。在图 13-9 所示的示例中，为 `RegLogOp` 指定的列范围是相当宽的 `0–102`。在\
  \ `RequiredCols` 运算符属性中，该列范围被缩小到特定列。`RequiredCols` 运算符可能来自 `DependsOnCols` 或列范围。\n\
  \n#### `RequiredCols`（仅适用于 `RegLogOp`）\n\n`RequiredCols` 运算符属性指定了满足操作所需的实际列。其模式与\
  \ `DependsOnCols` 运算符属性类似，也包含两对括号。第一对括号包含一个逗号分隔的数字列表，表示内部列标识符；第二对括号显示列的完全限定名称，包括表名和列名。\n\
  \n#### `DataType`（仅适用于 `ScaLogOp`）\n\n在 `DependsOnCols` 属性之后，会列出六种数据类型之一，以显示返回值的类型。该值也可以为空。当前示例中的两个\
  \ `ScaLogOp` 操作都使用了整数数据类型。\n\n#### `DominantValue`（仅适用于 `ScaLogOp`）\n\n标量逻辑运算符的最后一个属性是\
  \ `DominantValue` 属性，它表示计划可以将列识别或过滤为特定值或少量值。此属性可设置为 `NONE`，否则可能显示特定值。当属性设置为特定值时，DAX\
  \ 引擎可能会选择一个比设置为 `NONE` 时快得多的计划。在分析逻辑计划时，此属性值是一个有用的参考指标。\n\n### 物理计划\n\n清单 13-4 中的查询生成一个五行物理计划，如图\
  \ 13-10 所示。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig10_HTML.jpg](img/471413_1_En_13_Fig10_HTML.jpg)\n\
  \n图 13-10\n\n清单 13-4 中查询的物理计划\n\n第一行是最外层操作，使用 `AddColumns` 运算符输出最终结果。第二行引用的操作使用了\
  \ `IterPhyOp` 类型，即使此查询只返回单行数据。如果查询设计为返回更多行，`AddColumns` 运算符也不会改变。\n\n第三行表示对存储引擎的调用，对于此计划，它解释了引擎如何满足执行求和的要求。此运算符的\
  \ `LogOp` 属性指定了使用 `Sum_VertiPaq` 运算符。`Sum_VertiPaq` 运算符类型对性能而言是个好消息，意味着在存储引擎读取数据的同时，即可完成生成所需值的工作。公式引擎无需额外工作即可产生正确结果。\n\
  \n最后两个运算符提供了与 `SpoolLookup` 运算符相关的子节点的一些细节。\n\n物理计划中一个重要的运算符属性是 `#Records` 运算符属性。该属性提供了关于操作处理的假脱机中行数的信息。有时该值可能远高于预期，这表明有机会在查询中重新组织筛选，以帮助减少冗余和不必要的工作量。\n\
  \n## VertiPaq 运算符\n\n在使用 DAX 查询计划来帮助提升性能时，逻辑计划和物理计划中需要关注的关键运算符是 VertiPaq 运算符。\n\n\
  VertiPaq 运算符与 VertiPaq 引擎协同工作以检索数据，某些操作可以在从数据库检索数据的*过程中*进行，从而显著提升查询的整体性能。VertiPaq\
  \ 操作还可以在多线程环境中并行运行，从而带来潜在的性能提升。\n\n任何无法由 VertiPaq 运算符完成的工作都会传递给单线程的公式引擎来处理。在从数据库检索数据的同时，能够处理的数据越多，性能结果就越好。\n\
  \n```\nScan_Vertipaq\nGroupBy_Vertipaq\nFilter_Vertipaq\nSum_Vertipaq\nMin_Vertipaq\n\
  Max_Vertipaq\nCount_Vertipaq\nDistinctCount_Vertipaq\nAverage_Vertipaq\nStdev.S_Vertipaq\n\
  Stdev.P_Vertipaq\nVar.S_Vertipaq\nVar.P_Vertipaq\n清单 13-5\nVertiPaq 逻辑运算符的部分列表\n\
  ```\n\n图 13-9 中的查询计划在第 2 行显示使用了 `Sum_VertiPaq` 运算符。该运算符表示，当从 VertiPaq 引擎检索数据时，`[Quantity]`\
  \ 列中的值可以相加，这意味着读取操作完成后数值即可用。公式引擎无需执行额外的处理来满足此查询。\n\n`Sum_VertiPaq` 操作属性也出现在图 13-10\
  \ 第 3 行的物理计划中，其键值对为 `LogOp = Sum_VertiPaq`。\n\n\n\n### VertiPaq 查询事件\n\n建议添加到 Profiler\
  \ 跟踪中的两个事件是 `VertiPaq SE Query Cache Match` 和 `VertiPaq SE Query End` 事件。查看这些事件时，它们会显示类似\
  \ T-SQL 的伪查询，并为调试提供有用的反馈。这些事件还会在 Profiler 跟踪输出中报告每个存储引擎查询的持续时间值。该持续时间值表示每次存储引擎扫描所花费的时间（以毫秒为单位）。这些事件专门报告与查询\
  \ VertiPaq 存储引擎相关的任何活动。\n\n每个存储引擎查询会捕获两个 Profiler 事件。两者的文本相似，但 `EventSubClass` 略有不同。\n\
  \n图 13-11 显示了已添加这两个事件的“跟踪属性”窗口。这两个事件位于“查询处理”部分。\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig11_HTML.jpg](img/471413_1_En_13_Fig11_HTML.jpg)\n\
  \n**图 13-11** – 用于跟踪 VertiPaq 存储引擎查询的 Profiler 事件\n\n考虑以下清单 13-6 中的 DAX 查询，该查询使用\
  \ `'Dimension Date'` 表构建一个唯一日期列表，然后使用 `ADDCOLUMNS` 函数为每个日期附加一个 SUM 值。\n\n```\nEVALUATE\n\
  ADDCOLUMNS(\nVALUES('Dimension Date'[Date]) ,\n\"Quantity Per Day\",\nSUM('Fact\
  \ Sale'[Quantity])\n)\n```\n\n**清单 13-6** – 用于演示 DAX Profiler 事件的查询\n\n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig12_HTML.jpg](img/471413_1_En_13_Fig12_HTML.jpg)\n\
  \n**图 13-12** – 清单 13-6 中查询的 Profiler 跟踪\n\n图 13-12 中的 Profiler 跟踪总共显示了七行。最上面一行的\
  \ `EventClass` 为 `DAX Query Plan`，与逻辑计划相关。清单 13-7 中显示了该逻辑计划的简化版本。\n\n逻辑计划表明查询期间发生了两次\
  \ VertiPaq 扫描。这些扫描在逻辑计划的第 2 行和第 4 行中被引用，每行都以文本 `Scan_VertiPaq` 开头。需要两个 VertiPaq\
  \ 操作，首先是从 `'Dimension Date'` 表生成一个唯一日期值列表，第二次扫描处理来自 `'Fact Sale'` 表的 Quantity 列，属于\
  \ `Sum_VertiPaq` 操作。\n\n第三行的运算符名称是 `Sum_VertiPaq`，这意味着在从底层模型中检索数据的同时，可以执行值的相加过程。\n\
  \n```\nAddColumns: RelLogOp ([Date], [Quantity Per Day])\nScan_Vertipaq: RelLogOp\
  \ ('Dimension Date'[Date])\nSum_Vertipaq: ScaLogOp\nScan_Vertipaq: RelLogOp ('Fact\
  \ Sale'[Quantity])\n'Fact Sale'[Quantity]: ScaLogOp ([Quantity])\n```\n\n**清单 13-7**\
  \ – 清单 13-6 中查询的简化逻辑计划\n\n图 13-11 中的 Profiler 跟踪在 `VertiPaq SE Query End` EventClass\
  \ 中显示了四个事件。这些事件代表两次 VertiPaq 扫描，因为一次扫描将生成两个事件。\n\n图 13-11 中 Profiler 跟踪的第六行显示了第二个\
  \ `DAX Query Plan` 事件。此事件的 `EventSubClass` 为 `2 – DAX VertiPaq Physical Plan`，代表查询的物理计划。清单\
  \ 13-8 显示了物理计划的简化版本，省略了一些文本，但仍保留了意图。\n\n```\nAddColumns: IterPhyOp (0,1)([Date],[Quantity\
  \ Per Day])\nSpool_Iterator: IterPhyOp LogOp=Scan_Vertipaq [Date]\nProjectionSpool:\
  \ SpoolPhyOp #Records=1461\nCache: IterPhyOp\nSpoolLookup: LookupPhyOp LogOp=Sum_Vertipaq\n\
  ProjectionSpool: SpoolPhyOp #Records=1\nCache: IterPhyOp\n```\n\n**清单 13-8** – 清单\
  \ 13-6 中查询的简化物理计划\n\n物理计划中最外层的操作是第一行，与 DAX 查询中的 `ADDCOLUMNS` 函数相关。此操作的物理运算符类型为 `IterPhyOp`，它启动一个对\
  \ `[Date]` 列的迭代器。`#Records=1461` 运算符属性指定了要迭代的项数为 1,461 个，并使用 `Scan_VertiPaq` 的逻辑操作。\n\
  \n第五行表示一个 `SpoolLookup` 操作。此情况下的物理操作类型是 `LookupPhyOp`，它返回单个标量值，并使用 `Sum_VertiPaq`\
  \ 的逻辑操作。这一行是负责累加 `'Fact Sale'[Quantity]` 列中所有值的操作。\n\n对物理计划的粗略解释是：对 `'Dimension\
  \ Date'` 表中找到的每个唯一日期值执行一个循环，然后对于找到的每个日期，找到单个值，该值是 `'Fact Sale'` 表中 `[Quantity]`\
  \ 列的总和。日期处理的顺序并不重要。没有一个日期的输出依赖于另一个日期。该任务可以分解为多个并行的流，结果仍然相同。\n\nProfiler 跟踪中的最后一行是\
  \ `Query End` EventClass，它提供了有用的持续时间（以毫秒为单位）数据。\n\n清单 13-6 中查询的结果如图 13-13 所示。您可能会注意到\
  \ `[Quantity Per Day]` 列中的值没有变化；相反，它对于每一行都反复反映 `'Fact Sale'` 表中 Quantity 列的总体总和。这种省略是故意的，本章后面的“上下文转换”部分将展示如何使用查询计划来识别和修复此问题。\n\
  \n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig13_HTML.jpg](img/471413_1_En_13_Fig13_HTML.jpg)\n\
  \n**图 13-13** – 显示清单 13-6 中查询的结果\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，完成以下英文文本的翻译工作。\n\
  \n\n## 计划优化\n\n如本章前文所述，当查询运行时，会发生几件事情，包括生成逻辑计划和物理计划，以帮助确定产生所需结果的最佳方法。\n\n`DAX 查询优化器`会生成一个逻辑计划，并尝试找到它认为最高效的方法来完成任务。这种优化意味着，以多种方式编写的查询最终可能会产生相同的计划，因此也具有相同的性能特征。\n\
  \n请考虑清单 13-9 中以下三个 *不同的* 查询，它们都产生相同的结果。所有三个 `DAX` 查询前面都有一个 `ClearCache` 块，为简洁起见，本例中将其缩写。\n\
  \n```\nGO\nEVALUATE\nROW(\n\"Basic SUM\",\nSUM('Fact Sale'[Quantity])\n)\nGO\n\n\
  GO\nEVALUATE\nROW(\n\"Calculate SUM\",\nCALCULATE(SUM('Fact Sale'[Quantity]))\n\
  )\nGO\n\nGO\nEVALUATE\nROW(\n\"SumX SUM\",\nSUMX('Fact Sale','Fact Sale'[Quantity])\n\
  )\n清单 13-9\n三个具有相同逻辑计划和物理计划的不同 DAX 查询\n```\n\n简化的逻辑计划（三个查询相同）显示在清单 13-10 中，并突出显示查询使用了\
  \ `Sum_VertiPaq` 运算符，从而获得了最佳性能。三个查询的逻辑计划相同这一事实也突显了，在简单情况下，`SUMX` 函数与 `SUM` 函数没有区别，或者说\
  \ `SUM` 函数等同于 `SUMX` 函数。\n\n对于使用 `CALCULATE` 函数的中间查询，`DAX 查询优化器`也没有使用 `Calculate`\
  \ 逻辑运算符。优化器已确定，由于没有提供筛选器，因此可以构建一个更简单、更快速的计划。如果将筛选器参数传递给 `CALCULATE` 函数，则会生成不同的逻辑计划和物理计划。\n\
  \n```\nAddColumns: RelLogOp\nSum_Vertipaq: ScaLogOp\nScan_Vertipaq: RelLogOp 'Fact\
  \ Sale'[Quantity]\n'Fact Sale'[Quantity]: ScaLogOp\n清单 13-10\n清单 13-9 中所有三个 DAX\
  \ 查询的简化逻辑计划\n```\n\n如果代码的某些部分是冗余的，`DAX 查询优化器`会从逻辑计划（以及物理计划）中消除这些逻辑分支。这种情况可能发生在 `IF`\
  \ 函数只有一种输出（`THEN`/`ELSE`）时。冗余操作会从计划中被删除。\n\n如果检测到冗余代码，`DAX 查询优化器`会从逻辑计划（以及物理计划）中消除这些逻辑分支。当条件语句（如\
  \ `IF`/`ELSE`）仅可能有一种输出时，就可能出现这种情况。冗余操作会从计划中被删除。\n\n## 流程控制\n\n### 简单的 IF 语句\n\n\
  查询优化器会创建一个只包含被认为完成查询所必需的代码路径的逻辑计划。如果 `DAX` 查询包含一个具有两种可能结果的 `IF` 函数，优化器会在最终确定逻辑计划之前检查这两个路径是否都会被用到。\n\
  \n考虑清单 13-11 中的以下查询，它包含一个带有无法到达代码的 `IF` 函数。无法到达的代码是 `IF` 语句的 `ELSE` 部分，其中包含一个使用\
  \ `'Fact Sale'[Profit]` 列的 `SUM` 函数。\n\n```\nvarTest: Constant: ScaLogOp VarName=varTest\n\
  AddColumns: RelLogOp\nScan_Vertipaq: RelLogOp [Calendar Year]\nInteger->Double:\
  \ ScaLogOp DependOnCols [Calendar Year]\nSum_Vertipaq: ScaLogOp MeasureRef=[Sum\
  \ Quantity]\nScan_Vertipaq: RelLogOp\n'Fact Sale'[Quantity]: ScaLogOp [Quantity]\n\
  清单 13-12\n清单 13-11 中 DAX 查询的简化逻辑计划\n```\n\n```\nDEFINE\nVAR varTest = \"Quantity\"\
  \nEVALUATE\nADDCOLUMNS(\nVALUES('Dimension Date'[Calendar Year]) ,\n\"IF Test\"\
  \ ,\nIF (\nvarTest = \"Quantity\" ,\nSUM('Fact Sale'[Quantity]) ,\nSUM('Fact Sale'[Profit]))\
  \     --<= 冗余\n)\n清单 13-11\n一个 ELSE 分支永远无法到达的 IF 语句\n```\n\n清单 13-12 中清晰的逻辑计划显示了两次\
  \ VertiPaq 扫描。第一次 VertiPaq 扫描与 `VALUES` 函数相关，用于获取 `[Calendar Year]` 列中的唯一值列表。只返回了四个值。\n\
  \n然后，对于这些值中的每一个，使用 `Sum_VertiPaq` 运算符进行第二次 VertiPaq 扫描，查询 `[Quantity]` 列。逻辑计划中没有引用\
  \ `'Fact Sale'[Profit]` 列，尽管该列在 `DAX` 查询中被直接引用。该列之所以从逻辑计划中缺失，是因为查询优化器已确定 `IF` 语句的\
  \ `ELSE` 路径永远无法到达。\n\n如果修改清单 13-11 中的 `DAX` 查询，使得分配给 `varTest` 变量的值不是 `'Quantity'`，`DAX\
  \ 查询优化器`将生成相同的计划，只是将 `[Quantity]` 列替换为 `[Profit]` 列。\n\n逻辑计划中一个有趣之处是沿途从 `Integer`\
  \ 到 `Double` 的转换。此转换明确与设置为 `Integer` 数据类型的 `'Fact Sale'[Quantity]` 列有关，逻辑计划确定需要执行一个操作，将其转换为小数（`Double`）作为查询的一部分。\n\
  \n### 复杂的 IF 语句\n\n如果 `IF` 函数的两个代码路径在 `DAX` 查询中都有效，则优化器会将额外的操作包含到逻辑计划中以覆盖这两个路径。清单\
  \ 13-13 显示了一个略微修改的查询，该查询旨在当年份等于 2015 年时返回与其它年份不同的度量值。此查询的目的是展示当 `IF` 函数的 `THEN`\
  \ 和 `ELSE` 路径都有效时，查询优化器如何构建逻辑计划。\n\n```\nAddColumns: RelLogOp\nScan_Vertipaq: RelLogOp\
  \ [Calendar Year])\nIf: ScaLogOp 'Dimension Date'[Calendar Year]\n'Dimension Date'[Calendar\
  \ Year] = 2015: ScaLogOp\nPredicateCheck: RelLogOp\nScalarVarProxy: ScaLogOp\nPredicateCheck:\
  \ RelLogOp\nScalarVarProxy: ScaLogOp\nSum_Vertipaq: ScaLogOp MeasureRef=[Sum Quantity]\n\
  Scan_Vertipaq: RelLogOp\n'Fact Sale'[Quantity]: ScaLogOp\nSum_Vertipaq: ScaLogOp\
  \ MeasureRef=[Sum Profit]\nScan_Vertipaq: RelLogOp\n'Fact Sale'[Profit]: ScaLogOp\n\
  清单 13-14\n清单 13-13 中 DAX 查询的简化逻辑计划\n```\n\n```\nDEFINE\nMEASURE 'Fact Sale'[Sum\
  \ Quantity]\n= SUM('Fact Sale'[Quantity])\nMEASURE 'Fact Sale'[Sum Profit]\n= SUM('Fact\
  \ Sale'[Profit])\nEVALUATE\nADDCOLUMNS(\nVALUES('Dimension Date'[Calendar Year])\
  \ ,\n\"IF Test\" ,\nIF (\n[Calendar Year] = 2015 ,\n[Sum Quantity]  ,    --<= Then\n\
  [Sum Profit]    --<= Else\n)\n)\n清单 13-13\n具有两个有效代码路径的复杂 IF 函数\n```\n\n清单 13-14\
  \ 中显示的逻辑计划与清单 13-12 中显示的逻辑计划之间的区别在于，前者包含了一个 `IF` 运算符，该运算符包含多个子节点以覆盖不同的代码分支。该逻辑计划还表明，执行了三次存储引擎扫描，一次扫描专注于检索\
  \ `[Calendar Year]` 列中的值列表，而另外两次则根据 `IF` 语句的条件分支，使用 `Sum_VertiPaq` 操作类型来高速处理数字。\n\
  \n\n\n#### SWITCH 语句\n\n如果清单 13-13 中的 DAX 查询被修改为使用 `SWITCH` 函数替代 `IF` 函数，查询优化器将生成相同的计划。\n\
  \n然而，在使用 `SWITCH` 函数时需要警惕一点：在某些情况下，即使看似只有一个分支是可能的，代码路径的所有分支仍然会被计算。当报表使用度量值表为用户提供动态体验（允许他们从切片器中选择指标）时，可能会发生这种不期望的情况。考虑清单\
  \ 13-15 中 DAX 计算度量值的示例，该度量值将 `UserSelection` 变量赋值为在名为 `'Measure Table'` 的表中的某一列切片器上所做的选择。\n\
  \n这里的期望是，当用户进行单一选择时，`SWITCH` 语句仅调用特定度量值，并且在计算过程中三个度量值中只有一个需要被计算。\n\n```\nSWITCH\
  \ Measure =\nVAR UserSelection = SELECTEDVALUE('Measure Table'[Column1])\nRETURN\n\
  SWITCH(\nTRUE() ,\nUserSelection = \"Measure 1\" , [Test Measure 1],\nUserSelection\
  \ = \"Measure 2\" , [Test Measure 2],\n[Test Measure 3]\n)\n清单 13-15\n动态度量值中 SWITCH\
  \ 语句的示例\n```\n\n### CALCULATE 语句\n\n下一部分聚焦于查询计划中与 `CALCULATE` 函数使用相关的有趣方面。第一部分重点介绍如何在查询计划中发现上下文转换，第二部分则提供一个有趣的示例，展示如何通过重写一个性能较差的查询以使用\
  \ `CALCULATE` 函数来获得显著的性能提升。\n\n#### 上下文转换\n\n考虑清单 13-16 中的查询，它返回一个结果，其中每个 `[Calendar\
  \ Year]` 对应一行，并有一个额外的列显示 `'Fact Sale'[Quantity]` 列的总和。在此示例中，`[Quantity Per Year]`\
  \ 列中的值是重复的相同值，并未考虑第一列同一行中显示的日历年份。清单 13-16 中代码的完整结果如图 13-14 所示。\n\n```\nEVALUATE\n\
  ADDCOLUMNS(\nVALUES('Dimension Date'[Calendar Year]) ,\n\"Quantity Per year\",\n\
  SUMX('Fact Sale','Fact Sale'[Quantity])\n)\n清单 13-16\n无上下文转换的简单 SUMX 计算\n```\n\n\
  ![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig14_HTML.jpg](img/471413_1_En_13_Fig14_HTML.jpg)\n\
  \n*图 13-14 – 显示清单 13-16 中查询的结果集*\n\n现在考虑对清单 13-16 中同一个查询进行略微修改后的版本。新查询在清单 13-17\
  \ 中，唯一的区别是在 `SUMX` 函数外层添加了一个 `CALCULATE` 函数。查询未做其他修改，也未向 `CALCULATE` 函数添加任何筛选参数。\n\
  \n此修改使得上下文转换得以发生，这意味着当前行的行级筛选器将转换到由 `CALCULATE` 语句创建的新上下文中。\n\n```\nEVALUATE\nADDCOLUMNS(\n\
  VALUES('Dimension Date'[Calendar Year]) ,\n\"Quantity Per year\" ,\nCALCULATE(\n\
  SUMX('Fact Sale','Fact Sale'[Quantity])\n)\n)\n清单 13-17\n发生上下文转换的简单 SUMX 计算\n```\n\
  \n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig15_HTML.jpg](img/471413_1_En_13_Fig15_HTML.jpg)\n\
  \n*图 13-15 – 显示清单 13-17 中查询的结果集*\n\n清单 13-18 展示了清单 13-16 中未使用 `CALCULATE` 函数的查询的简化逻辑计划。为便于直接比较，清单\
  \ 13-19 展示了清单 13-17 中使用了 `CALCULATE` 函数的修改后查询的简化逻辑计划。图 13-15 显示了清单 13-17 中代码的完整结果。\n\
  \n```\nAddColumns: RelLogOp\nScan_Vertipaq: RelLogOp\nSum_Vertipaq: ScaLogOp\n↳\
  \ DependOnCols(0)([Calendar Year])\nScan_Vertipaq: RelLogOp\n↳ DependOnCols(0)([Calendar\
  \ Year])\n↳ 1-110\n↳ RequiredCols(0, 13)\n↳([Calendar Year], [Quantity])\n'Fact\
  \ Sale'[Quantity]: ScaLogOp\n清单 13-19\n清单 13-17 中查询的简化逻辑计划（带 CALCULATE）\n```\n\n\
  ```\nAddColumns: RelLogOp\nScan_Vertipaq: RelLogOp\nSum_Vertipaq: ScaLogOp\n↳ DependOnCols()()\n\
  Scan_Vertipaq: RelLogOp\n↳ DependOnCols()()\n↳ 1-110\n↳ RequiredCols(13)('Fact Sale'[Quantity])\n\
  'Fact Sale'[Quantity]: ScaLogOp\n清单 13-18\n清单 13-16 中查询的简化逻辑计划（无 CALCULATE）\n```\n\
  \n对于清单 13-16（无 `CALCULATE`）和清单 13-17（有 `CALCULATE`）中展示的两个简化计划，为了简洁起见，移除了非必要且相同的运算符属性。\n\
  \n两个计划都有五个操作，因此有五行。`↳` 字符用于标识为了可读性而引入的换行。\n\n这两个计划之间的关键区别在于，未使用 `CALCULATE` 函数的查询中，名为\
  \ `DependsOnCols` 的运算符属性未填充列值。\n\n然而，在使用 `CALCULATE` 的版本中，`DependsOnCols` 运算符属性提供了两次扫描之间的链接。在两个查询中，都执行了两次\
  \ VertiPaq 扫描；但是，`Sum_VertiPaq` 操作考虑了相关的 `[Calendar Year]`。\n\n两个查询的物理计划非常相似，除了计划中与\
  \ `Sum_VertiPaq` 逻辑操作相关的一行，该行包含一个 `LookupCols` 属性，该属性在两次扫描之间建立了链接。\n\n在性能方面，这两个查询在拥有\
  \ 228,265 行的 `'Fact Sale'` 表上表现出相似的性能特征，但在数据集大得多的情况下可能会有所不同。\n\n\n\n#### 运行总计\n\n\
  继续以 `CALCULATE` 函数为例，另一个有趣且能突出查询计划用途的例子是累计总计计算。清单 13-20 展示了两个以不同方式编写但产生相同结果的 DAX\
  \ 查询。\n\n```\nGO\nEVALUATE\nADDCOLUMNS(\nVALUES('Dimension Date'[Date]),\n\"Running\
  \ total of Quantity\" ,\nCALCULATE(\nSUMX(\n'Fact Sale',\n'Fact Sale'[Quantity]\n\
  ),\n'Dimension Date'[Date]\n)\nGO\nEVALUATE\nADDCOLUMNS(\nVALUES('Dimension Date'[Date]),\n\
  \"Running total of Quantity\" ,\nSUMX(\nFILTER(\n'Fact Sale',\n'Fact Sale'[Invoice\
  \ Date Key]<=\n↳ EARLIER('Dimension Date'[Date])\n),\n'Fact Sale'[Quantity]\n)\n\
  )\n```\n\n该批次中的两个查询都使用了 `SUMX` 函数结合 `ADDCOLUMNS` 函数，来添加一列显示由 `VALUES` 函数返回的每一天的累计总计。\n\
  \n两个查询都返回相同的 1,461 行结果集。它们使用的筛选条件也相同；然而，筛选条件的位置和方法对每种方法的性能特征产生了巨大影响。\n\n清单 13-20\
  \ 示例中的第一个查询使用 `CALCULATE` 函数来执行核心的 `SUMX` 函数，并将筛选逻辑分离到 `CALCULATE` 函数的筛选参数中，而第二个查询则在\
  \ `SUMX` 表达式内部使用了 `FILTER` 函数。\n\n两个查询都执行了两次 VertiPaq 存储引擎扫描。第一次 VertiPaq 扫描与 `VALUES`\
  \ 函数相关，用于确定结果集中唯一日期的数量，另一次 VertiPaq 扫描则使用了 `[Quantity]` 列。\n\n第一个查询使用了 `CALCULATE`\
  \ 函数，其完成时间可靠地低于 1 秒。第二个查询将筛选逻辑嵌入到 `SUMX` 表达式内部，其完成时间在 20 到 30 秒之间。对于两个看起来非常相似的查询而言，这种性能差异是巨大的。\n\
  \n这两个查询的查询计划揭示了两者差异的线索，其简化版本的两个逻辑计划分别展示在清单 13-21 和清单 13-22 中。\n\n```\nAddColumns:\
  \ RelLogOp\nScan_Vertipaq: RelLogOp\nSumX: ScaLogOp DependOnCols(0)\nFilter: RelLogOp\
  \ DependOnCols(0)\nScan_Vertipaq: RelLogOp\nLessThanOrEqualTo: ScaLogOp\n'Fact Sale'[Invoice\
  \ Date Key]: ScaLogOp\n'Dimension Date'[Date]: ScaLogOp\n'Fact Sale'[Quantity]:\
  \ ScaLogOp\n```\n\n```\nAddColumns: RelLogOp\nScan_Vertipaq: RelLogOp\nCalculate:\
  \ ScaLogOp\nSum_Vertipaq: ScaLogOp\nScan_Vertipaq: RelLogOp\n'Fact Sale'[Quantity]:\
  \ ScaLogOp\nFilter: RelLogOp DependOnCols(0)\nScan_Vertipaq: RelLogOp\nLessThanOrEqualTo:\
  \ ScaLogOp\n'Dimension Date'[Date]: ScaLogOp\n'Dimension Date'[Date]: ScaLogOp\n\
  ```\n\n重申一次，为了提高可读性，我们已经移除了逻辑计划中的干扰和重复内容，对其进行了简化。两个计划之间的巨大差异在于，清单 13-21 中的第一个计划（即速度更快的查询）使用了\
  \ `Sum_VertiPaq` 运算符，这意味着 `SUMX` 函数可以在读取数据时在存储引擎中执行其工作。该操作可能通过多线程并行发生。在此处使用 `Sum_VertiPaq`\
  \ 也解释了为什么总体查询时间比 VertiPaq SE 扫描事件报告的时间要稍长一些。\n\n清单 13-22 中的第二个逻辑计划使用了 `SumX` 运算符（第\
  \ 3 行），而不是 `Sum_VertiPaq` 运算符。`SumX` 运算符不作为存储引擎执行工作的一部分，它必须等待所有数据被检索完之后，才能使用单线程方法继续执行以满足需求。\n\
  \n图 13-16 中的“Duration”列显示了每个查询的持续时间概况。请注意，第二个查询中的其中一个 VertiPaq SE 查询持续时间较长，为 58\
  \ 毫秒。持续时间较长是因为该扫描注入了一个额外的行标识符列，公式引擎中的 `SumX` 操作需要此列来完成工作。\n\n如果从查询结束事件相关的持续时间中减去\
  \ VertiPaq SE 查询事件的持续时间，你会得到一个近似值，该值表示为了满足查询而在公式引擎中花费的时间。\n\n图 13-16 展示了清单 13-20\
  \ 中两个查询的分析器跟踪详细信息。标记为 1 的顶部七个行块与使用 `CALCULATE` 函数的较快查询有关。此查询所花费的总时间显示在查询结束事件的“Duration”列中，为\
  \ 580 毫秒。\n\n标记为 2 的底部七个行块与不使用 `CALCULATE` 函数的较慢查询有关。此查询耗时 23 秒（23,251 毫秒）完成，并且其大部分工作在公式引擎中执行。\n\
  \n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig16_HTML.jpg](img/471413_1_En_13_Fig16_HTML.jpg)\n\
  \n### DAX Studio\n\n美观（且免费）的 DAX Studio 是编写 DAX 查询时的绝佳伴侣，它包含的众多出色功能（如图 13-17 所示）包括：\n\
  \n![../images/471413_1_En_13_Chapter/471413_1_En_13_Fig17_HTML.jpg](img/471413_1_En_13_Fig17_HTML.jpg)\n\
  \n1.  在每次运行前自动执行 `ClearCache` 的能力\n2.  开关查询计划和服务器计时（包括扫描和缓存计时）\n3.  任何存储引擎工作的持续时间和\
  \ CPU 计时（每扫描一行）\n4.  SE 活动的总计，可用于推导公式引擎时间\n5.  用于显示查询结果、逻辑和物理计划以及计时详细信息的选项卡\n\n\
  在图 13-17 中标记为 5 的“查询计划”选项卡，当功能区中的“查询计划”选项（标记为 2 处）被启用时，提供对逻辑和物理查询计划的访问。此屏幕显示从查询窗口执行的特定查询的详细信息。如果在运行中启用了“清除缓存”选项，这些详细信息包括物理计划顶部的额外行。\n\
  \n## 总结\n\n本章向你介绍了 DAX 查询计划，以及如何利用它来帮助理解特定查询运行缓慢的原因。\n\n查询计划与存储引擎分析器事件相结合，可以为各种\
  \ DAX 查询的性能特征提供有用的见解。\n\n在研究计划时，请查找各种 VertiPaq 运算符（例如 `Sum_VertiPaq`）的存在。当 DAX 引擎在纯\
  \ VertiPaq 模式下运行时，其运行速度最快。\n\n在查看物理计划时，请查看筛选器和节点的顺序和位置，并尝试以不同的方式重写查询以比较计划。在针对性能优化查询时，`#Records`\
  \ 运算符属性也是一个非常有用的指标。\n\n在为性能进行调试时，始终要清除缓存！\n\n仅提供的持续时间数字是针对 DAX 查询结束事件和 VertiPaq\
  \ SE 事件的。\n\n如需进一步阅读，我推荐 Alberto Ferrari 在 2013 年撰写的一篇优秀白皮书，名为《理解 DAX 查询计划》，以及 Jeffrey\
  \ Wang（DAX 之父）在其网站 mdxdax.blogspot.com 上撰写的任何相关主题的文章。\n\n"
- "# 14. 扩展模型规模\n\n\n\n## 引言\n\n编写 DAX 语句有两种应用场景。第一种是针对特定数据集回答具体问题。第二种是为通用性问题寻找答案，这类解决方案将使我们未来能更快地解答类似问题。\n\
  \n因此，后一种解决方案也被称为模式。乍看之下，不使用现有模式或不开发新模式似乎很愚蠢。但当然，有时事情没那么简单，因为可能没有时间开发模式，甚至没有时间快速上网搜索现有模式并直接将其适配到特定问题。这听起来很奇怪，但开发模式只有在充分了解系统细节（至少部分细节）时才有可能，特别是不同情况会如何影响系统中所有组件的复杂运作。培养这些技能代价高昂（从时间角度来看）。诚然，立即找到问题答案的体验也很棒；有时必须即刻找到解决方案，因为今天下午演示中最重要视觉元素所展示的图表并未显示正确（或至少是预期的）数值。这种\"\
  救火式\"的 DAX 开发在情感和智力层面都可能带来乐趣和回报。但正如所有真正的消防员所知，这其中存在风险。幸运的是，\"救火式\" DAX 开发的风险仅此而已：无法在规定时间内找到解决方案。当消防员进入未知建筑时，必须寻找一些类似的类比。为此，让我们把未知建筑想象成\
  \ Power BI 数据模型。消防员不知道不同的房间（表）是如何通过门（关系）连接的，也不清楚这些门是单向的还是可以双向使用（交叉筛选方向等于一对多或双向）。\n\
  \n本章将介绍如何通过提供将小数据模型扩展为大数据模型的技术，来帮助您成为更出色的\"消防员\"。数据模型的扩展将在 DAX 中完成；这意味着准备可扩展的数据模型也能训练对\
  \ DAX 的整体理解，当然还包括 DAX 与数据模型之间的交互。\n\n从小数据模型入手，可以轻松审视结果并使用心算验证 DAX 语句。对较小数据集进行扩展，可以检验\
  \ DAX 语句的适用性。DAX 语句的适用性可与消防员的身心素质相类比。正如本书中多次提到的，存储引擎是 VertiPaq 引擎中能够极快执行 DAX 语句特定部分的组件，而公式引擎则可以计算复杂语句。两个组件的协同利用对度量值的成功至关重要，特别是当度量值要应用于大数据模型时。\n\
  \n#### 注意\n\n小数据模型的扩展并不意味着创建跨越数 PB 的大数据数据集。扩展是指将数据模型从数十或数百行扩展到数千或数百万行。\n\n## 有偏差的数据\n\
  \n如今，使用有偏差的数据集并不可取，至少当数据集源于草率的实验时不应如此。为了更好地理解有偏差数据，想象一下：为了预测一款即将上市的新产品能否成功而进行了一项调查。如果这款产品是专为老年人设计某些额外功能的智能手机，你必须确保调查对象不只是附近高中的孩子，因为这些孩子并非目标群体，他们对功能的评价会有偏差。\n\
  \n然而，创建一个完全由随机算法生成的数据集也不是好主意。这是因为数据会因以下原因产生\"偏差\"：\n\n*   某些产品更受客户青睐，因此它们在销售数据集中出现得更频繁。\n\
  *   由于法律限制，某些产品无法销往某些市场；因此，如果数据集上进行地理空间相关分析，这些产品将不会出现在数据集中。\n*   某些产品不会贯穿整个时间段出现，因为它们在后续时间点才发布，或者因其产品生命周期结束而消失。\n\
  \n用于开发度量值的数据集产生偏差的原因有很多。主要原因很简单：由算法创建的有偏差数据集比完全随机化的数据集更接近真实世界的数据集。\n\n## 维度表和事实表\n\
  \n维度表和事实表是数据模型的核心；如果这些表不包含相关数据，任何 DAX 语句都无法计算出哪怕最简单的度量值。设计一个包含示例数据的可扩展数据模型是一项艰巨的任务。因此，必须记住模型必须简单，简单到可以进行心算，但又足够复杂，以便在不同情况下验证度量值的结果，即在不同视觉对象中使用度量值，这些视觉对象中的隐式筛选器会影响聚合的行数。假设一个度量值在任意时间点计算总数量，而不考虑任何其他维度（除了日历维度），那么有必要测试该度量值在使用不同表中的列（例如客户表中的列）筛选事实表时是否返回相同的值。\n\
  \n关于不同类型维度表和事实表的优秀参考书是克里斯托弗·亚当森的《星型模式：完全参考手册》。这本书可用于创建代表各种业务流程的多种数据模型。\n\n本章的重点不是为特定业务流程创建完整的数据模型。这里仅涉及创建一些可用于测试度量值正确性以及度量值在更大数据集上性能的表。\n\
  \n示例数据模型由一个配置表创建，而该配置表本身当然是使用 DAX 语句定义的。清单 14-1 显示了定义此配置表的 DAX 语句。\n\n```\nSample\
  \ Data Configuration =\nUNION(\nROW(\"Parameter Name\" , \"No Of Products to use\"\
  , \"Parameter Value\" , 1000)\n, ROW(\"Parameter Name\" , \"No Of Events\", \"Parameter\
  \ Value\" , 10)\n, ROW(\"Parameter Name\" , \"No of Products per events (max)\"\
  \ , \"Paramter Value\" , 5)\n, ROW(\"Parameter Name\" , \"No of days ahead\" , \"\
  Paramter Value\" , 10)\n)\n```\n\n**清单 14-1** 配置表\n\n不同的参数存储在一个表中，可根据需要扩展该表。\n\n\
  ### 维度表\n\n忽略任何与业务相关的内容，维度表可简化为以下要素：\n\n*   单行唯一标识一个业务对象，例如，一个产品。\n*   属性用于描述该业务对象，例如，产品颜色。\n\
  \n#### 注意\n\n本章使用 Power BI 文件 \"CH14 – the sample model.pbix\"。此 `pbix` 文件使用 Excel\
  \ 文件 \"Dimension Template.xlsx\" 作为数据源。请注意，此文件中的数据（甚至包含在数据模型中的部分）不会在最终数据模型中使用，即与此模型没有建立关系。\n\
  \n由于此 `pbix` 文件使用 Excel 文件作为数据源，因此该 Excel 文件的路径被配置为一个参数，可以非常快速地更改以适配您的文件位置。查询参数是一个旧功能（如果对于一个像\
  \ Power BI 这样年轻的产品来说这能称之为旧功能的话）。以下是查询参数公告的链接：[`https://powerbi.microsoft.com/en-us/blog/deep-dive-into-query-parameters-and-power-bi-templates/`](https://powerbi.microsoft.com/en-us/blog/deep-dive-into-query-parameters-and-power-bi-templates/)。\n\
  \n\n\n#### Excel 源文件 “Dimension Template.xlsx”\n\n如果你好奇为什么使用 Excel 源文件仅仅是为了存储一些信息，而为什么不直接用\
  \ DAX 来存储像产品颜色这样简单的内容，答案很直接：与调整 DAX 代码来存储诸如颜色名称等海量文字信息相比，将 Excel 文件适配到某些特定需求要方便得多。\n\
  \n#### 维度基表\n\n在创建示例数据模型时，必须确保维度表不包含任何重复的标识符。代码清单 14-2 展示了创建并填充 `Dimension Product\
  \ – base table`（维度产品 - 基表）的 DAX 语句；该代码清单仅创建了一个包含 ID 列和名称列的基表。需要留意的是，所创建的维度不一定是产品维度。类似的\
  \ DAX 代码也可用于创建客户维度。\n\n```\nDimension Product - base table =\nvar NoOfProductsToUse\
  \ = [_No of Products To Use] --由于使用了 DISTINCT，重复行会被剔除，因此你可能得不到确切的数字\nvar NoOfProductsAvailable\
  \ = COUNTROWS('Dimension Template')\nvar ZeroPadding = CEILING(LOG10(NoOfProductsAvailable),1)\n\
  var p0_productbasetable = DISTINCT(\nSELECTCOLUMNS(\nADDCOLUMNS(\nGENERATESERIES(1\
  \ , NoOfProductsToUse , 1)\n, \"Product ID\" , RANDBETWEEN(1 , NoOfProductsAvailable)\n\
  )\n, \"Product ID\" , [Product ID]\n, \"Product Name\" , \"P \" & RIGHT(REPT(\"\
  0\" , ZeroPadding) &  [Product ID], LEN(NoOfProductsAvailable))\n)\n)\nreturn\n\
  p0_productbasetable\n代码清单 14-2\n产品维度 – 基表\n```\n\n该 DAX 语句创建了一个表，表中创建的行数取决于度量值 `NoOfProductsToUse`（要使用的产品数量）。此度量值通过使用\
  \ DAX 函数 `GENERATESERIES`（生成序列）来控制将创建多少行，即多少个产品。\n\n在此阶段，维度表仅包含两列：\n\n- `Product\
  \ ID`（产品 ID）\n- `Product Name`（产品名称）\n\n`Product ID` 是一个整数值。`Product ID` 通过使用 DAX\
  \ 函数 `RANDBETWEEN`（随机介于）创建。`RANDBETWEEN` 从给定的整数范围（可重复）中执行随机抽取。由 `RANDBETWEEN(1 ,\
  \ NoOfProductsAvailable)` 定义的范围内每个值被抽中的概率相同。不幸的是，这也意味着第二次抽取可能再次选中对应的整数值。由于需要创建一个代表\
  \ `Product ID` 的唯一整数值列表，因此还需要使用 `DISTINCT`（去重）作为创建基表的最外层函数。DAX 函数 `SELECTCOLUMNS`（选择列）用于选择\
  \ `Product ID` 列（一个随机整数值），同时也创建 `Product Name`（一个简单的文本拼接，主要用于创建一个字符串值）。`SELECTCOLUMNS`\
  \ 的另一个用途是省略由 `GENERATESERIES` 自动创建的列值。当你开始使用并更改可用参数时，你将会遇到参数 `No Of Products to\
  \ use`（要使用的产品数量）与实际创建的产品行数不匹配的情况，如图 14-1 所示。\n\n![../images/471413_1_En_14_Chapter/471413_1_En_14_Fig1_HTML.jpg](img/471413_1_En_14_Fig1_HTML.jpg)\n\
  \n*图 14-1 – 意外情况*\n\n#### 注意\n\n在本章中，将使用 ID，因为如果在可视化对象上使用，数字数据类型会自动使用 `SUM` 聚合。为此，请确保将聚合调整为“不汇总”。\n\
  \n预期结果是：通过使用代码清单 14-3 中的度量值，`Dimension Product – base table` 表中使用的产品数量将等于 30。\n\n\
  ```\nNo of products - base table =\nCOUNTROWS('Dimension Product - base table')\n\
  代码清单 14-3\n产品数量 – 基表\n```\n\n有时度量值并不会返回已配置的结果。\n\n必须始终牢记，所使用的产品是随机选择的。因此，如前所述，可能会出现一个\
  \ `Product ID` 被“抽取”多次的情况。使用函数 `DISTINCT` 将纠正这个“错误”。正因如此，两个度量值可能会显示不同的结果。\n\n####\
  \ 通过分箱和分组创建层次结构\n\n除了创建示例数据之外，还需要创建层次结构。这仅仅是因为层次结构将维度的唯一值分组为若干区块。产品将被分组为产品子类别，而产品子类别将被分组为产品类别。\n\
  \n创建层次结构可能是一件繁琐的工作。为了省去这种繁琐且易出错的工作，这里使用一种算法来创建层次结构。通过算法对 ID 进行分组可以分解为两个部分：\n\n-\
  \ 确定组（分箱）的数量。\n- 将 ID 分配给某个组。\n\n由于业务对象通常被分组成多个层次结构，因此使用了两种不同的算法。有关所用算法的更多信息，可在此处找到：[`https://en.wikipedia.org/wiki/Histogram`](https://en.wikipedia.org/wiki/Histogram)。\n\
  \n由于使用何种算法并不那么重要，这里使用了较为简单的算法：\n\n- 斯特奇斯公式\n- 赖斯法则\n\n代码清单 14-4 显示了创建 `Product Dimension\
  \ – hierarchy`（产品维度 - 层次结构）表的完整 DAX 语句。该表包含两个层次结构：\n\n- `Product ID` ➤ SG1 …（子组\
  \ 1） ➤ G1 …（组 1）\n- `Product ID` ➤ SG2 …（子组 2） ➤ G2 …（组 2）\n\n关键部分已突出显示，并在代码清单之后进行更详细的解释。\n\
  \n\n\n```dax\nDimension Product - hierarchy =\nvar NoOfProductsToUse = [_No of Products\
  \ To Use] -- 由于使用了 DISTINCT，重复行会被消除，因此你可能不会得到精确的数字\nvar NoOfProductsAvailable =\
  \ COUNTROWS('Dimension Template')\nvar ZeroPadding = CEILING(LOG10(NoOfProductsAvailable),1)\n\
  var p0_productbasetable = DISTINCT(\nSELECTCOLUMNS(\nADDCOLUMNS(\nGENERATESERIES(1\
  \ , NoOfProductsToUse , 1)\n, \"Product ID\" , RANDBETWEEN(1 , NoOfProductsAvailable)\n\
  )\n, \"Product ID\" , [Product ID]\n, \"Product Name\" , \"P \" & RIGHT(REPT(\"\
  0\" , ZeroPadding) &  [Product ID], LEN(NoOfProductsAvailable))\n)\n)\n/* *****************************************************************\
  \ */\n/* 用于创建层级结构的通用信息 */\nvar NoOfRowsBaseTable = COUNTROWS(p0_productbasetable)\n\
  var MaxMinRange = MAXX(p0_productbasetable,[Product ID]) - MINX(p0_productbasetable,[Product\
  \ ID])\n/* ***************************************************************** */\n\
  /* 使用 Sturges 公式确定分组宽度 */\nvar noOfGroupsSturges = ROUND(LOG(NoOfRowsBaseTable,2),0)+1\n\
  var subgroupWidthSturges = CEILING((MaxMinRange/noOfGroupsSturges),1)\nvar groupWidthSturges\
  \ = subgroupWidthSturges * 2\n/* *****************************************************************\
  \ */\n/* 使用 Rice 规则确定分组宽度 */\nvar noOfGroupsRice = ROUND(2 * POWER(COUNTROWS(p0_productbasetable),1/3),0)\n\
  var subgroupWidthRice = CEILING((MaxMinRange/noOfGroupsRice),1)\nvar groupWidthRice\
  \ = subgroupWidthRice * 2\nvar p1_productsWithHiearchy =\nADDCOLUMNS(\np0_productbasetable\n\
  ,\n/* 用于创建组数的公式取自：https://en.wikipedia.org/wiki/Histogram */\n/* *************************************************************\
  \ */\n/* 使用 Sturges 公式确定分组宽度 */\n\"SG1 range\"\n,\nvar groupNumber = CEILING([Product\
  \ ID] / subgroupWidthSturges,1)\nreturn\n\"SG1 range \" & 1+(groupNumber-1) * subgroupWidthSturges\
  \ & \" to \"  & FLOOR(groupNumber * subgroupWidthSturges,1)\n, \"SG1 number\"\n\
  ,\n\"SG1 number\" & RIGHT(REPT(\"0\", 3) & CEILING([Product ID] / subgroupWidthSturges,1),3)\n\
  ,\"G1 range\"\n,\nvar groupNumber = CEILING([Product ID] / groupWidthSturges,1)\n\
  return\n\"G1 range \" & 1+(groupNumber-1) * groupWidthSturges & \" to \"  & FLOOR(groupNumber\
  \ * groupWidthSturges,1)\n, \"G1 number\"\n,\n\"G1 number \" & RIGHT(REPT(\"0\"\
  , 3) & CEILING([Product ID] / groupWidthSturges,1),3)\n/* *********************************************************\
  \ */\n/* 使用 Rice 公式确定分组宽度 */\n,\"SG2 range\"\n,\nvar groupNumber = CEILING([Product\
  \ ID] / subgroupWidthRice,1)\nreturn\n\"SG2 range \" & 1+(groupNumber-1) * subgroupWidthRice\
  \ & \" to \"  & FLOOR(groupNumber * subgroupWidthRice,1)\n, \"SG2 number\"\n,\n\"\
  SG2 number\" & RIGHT(REPT(\"0\", 3) & CEILING([Product ID] / subgroupWidthRice,1),3)\n\
  ,\"G2 range\"\n,\nvar groupNumber = CEILING([Product ID] / groupWidthRice,1)\nreturn\n\
  \"G2 range \" & 1+(groupNumber-1) * groupWidthRice & \" to \"  & FLOOR(groupNumber\
  \ * groupWidthRice,1)\n, \"G2 number\"\n,\n\"G2 number \" & RIGHT(REPT(\"0\", 3)\
  \ & CEILING([Product ID] / groupWidthRice,1),3)\n)\nreturn\np1_productsWithHiearchy\n\
  ```\n**清单 14-4** 产品维度 – 层级结构\n\n清单 14-4 中的代码行可归结为三个部分。这些部分用于存储将在表迭代函数 `ADDCOLUMNS`\
  \ 内使用的值，该函数用于向产品维度基表添加列。第一部分存储了关于基表的通用信息。两种算法都使用相同的这些信息。\n\n```dax\n*****************************************************************\
  \ */\n/* 用于创建层级结构分箱的通用信息 */\nvar NoOfRowsBaseTable = COUNTROWS(p0_productbasetable)\n\
  var MaxMinRange = MAXX(p0_productbasetable,[Product ID]) - MINX(p0_productbasetable,[Product\
  \ ID])\n```\n\n存储的值是：\n\n*   基表中的行数。\n*   产品 ID 的范围。该范围可以通过公式 `MAX(list) – MIN(list)`\
  \ 计算得出。\n\n由于这个列表（即 `Product ID` 列）包含在一个“虚拟”表中，因此必须使用表迭代函数 `MAXX` 和 `MINX`。\n\n\
  这两种算法都使用上述两个值来确定箱数和每个箱的宽度。下一部分仅描述基于 Sturges 公式的计算：\n\n```dax\n/* 使用 Sturges 公式确定分组宽度\
  \ */\nvar noOfGroupsSturges = ROUND(LOG(NoOfRowsBaseTable,2),0)+1\nvar subgroupWidthSturges\
  \ = CEILING((MaxMinRange/noOfGroupsSturges),1)\nvar groupWidthSturges = subgroupWidthSturges\
  \ * 2\n```\n\n上述几行代码使用 Sturges 公式计算箱数。该值存储到变量 `noOfGroupsSturges` 中。每个分组的宽度被计算出来并存储到变量\
  \ `subgroupWidthSturges` 中。即使每个分组的宽度相同，这也不意味着宽度的计算没有考虑 ID 的分布情况。\n\n在上述部分之后，还有一个小任务：需要使用已定义的变量来创建代表层级结构的附加列。接下来的几行展示了这些变量如何被用于将要创建的八列中的仅两列，因为这些行会通过使用不同的变量进行微小更改后，在其他所有列上重复：\n\
  \n```dax\n\"SG1 range\"\n,\nvar groupNumber = CEILING([Product ID] / subgroupWidthSturges,1)\n\
  return\n\"SG1 range \" & 1+(groupNumber-1) * subgroupWidthSturges & \" to \"  &\
  \ FLOOR(groupNumber * subgroupWidthSturges,1)\n, \"SG1 number\"\n,\n\"SG1 number\"\
  \ & RIGHT(REPT(\"0\", 3) & CEILING([Product ID] / subgroupWidthSturges,1),3)\n```\n\
  \n列 `SG1 range` 包含基于 Sturges 公式的子分组层级结构；通过添加该特定范围内 ID 的下限和上限，使用文本连接来提供关于产品 ID 的附加信息。其过程如下：\n\
  \n*   使用 `CEILING` 将基表中当前行的 `Product ID` 的分组编号存储到变量 `groupNumber` 中。\n*   将下限与上限以及前缀和单词“to”连接起来，以提高可读性。\n\
  \n图 14-2 展示了使用参数 `No Of Products to use` = 30 创建的产品维度 – 层级结构表的若干列。\n\n![../images/471413_1_En_14_Chapter/471413_1_En_14_Fig2_HTML.jpg](img/471413_1_En_14_Fig2_HTML.jpg)\n\
  \n**图 14-2** 小型产品维度 – 层级结构\n\n> **注意：** 由于创建此表内容时使用了随机值，该图可能与您看到的结果不符。\n\n如果您仔细观察，会意识到\
  \ `SG1/G1` 和 `SG2/G2` 这两个层级结构是相同的。这是因为在处理较小数据量时，这两种算法具有相似性，如上例所示。\n\n图 14-3 显示的是同一个表，但这次是使用参数\
  \ `No Of Products to use` = 100 创建的。\n\n![../images/471413_1_En_14_Chapter/471413_1_En_14_Fig3_HTML.jpg](img/471413_1_En_14_Fig3_HTML.jpg)\n\
  \n**图 14-3** 较大型产品维度 – 层级结构\n\n如果使用更多的产品来创建一个大型维度表（请注意，在此示例中，“大型”并不意味着数百万行），两种算法的差异将变得更加明显。图\
  \ 14-4 展示了使用参数 `No Of Products to use` = 1000 时的产品 ID 分配情况。\n\n![../images/471413_1_En_14_Chapter/471413_1_En_14_Fig4_HTML.jpg](img/471413_1_En_14_Fig4_HTML.jpg)\n\
  \n**图 14-4** 大型产品维度 – 层级结构分布\n\n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n#### 其他维度属性\n\n创建层次结构对于全面测试度量值至关重要。然而，构成层次结构的属性并非唯一会被使用的属性。例如，像产品颜色这样简单的东西也是一个非常重要的属性。当然，也可以将任何其他属性作为产品表中的附加列来使用。未用于形成层次结构的属性（列）是判断度量值是否返回正确值的得力助手，因为从这类属性中选择一个值会过滤掉产品数量。这对于任何试图提取见解，且层次结构在其中扮演重要角色的计算都可能产生巨大影响。虽然听起来很简单，但有时在测试度量值时，这些简单的事情反而会被忽略。\n\
  \n因此，本章将介绍如何添加一个像颜色这样的简单属性到表 `Product Dimension – color`。该表基于 `Product Dimension\
  \ – base table` 表创建。这仅仅是为了简便。在本章的末尾，会提供一个最终列表的参考，它结合了所有不同的方面，形成一个单一的 DAX 语句，以创建最终的维度表。\n\
  \n列表 14-5 展示了如何将颜色属性添加到维度表。同样，重要的部分会突出显示，并在列表之后进行更详细的解释。\n\n```\nDimension Product\
  \ - color =\nvar NoOfProductsToUse = [_No of Products To Use] --由于使用了 DISTINCT，重复行将被消除，因此你可能不会得到完全相同的数字\n\
  var NoOfProductsAvailable = COUNTROWS('Dimension Template')\nvar ZeroPadding = CEILING(LOG10(NoOfProductsAvailable),1)\n\
  /* ***************************************************************** */\n/* 非层次结构属性\
  \ */\nvar NoOfroductColors = COUNTROWS('Product_Color')\nvar path_Colors = CONCATENATEX(TOPN(NoOfroductColors,'Product_Color',[Attribute1_ID]),[Attribute1_Name],\"\
  |\")\nvar p0_productbasetable = DISTINCT(\nSELECTCOLUMNS(\nADDCOLUMNS(\nGENERATESERIES(1\
  \ , NoOfProductsToUse , 1)\n, \"Product ID\" , RANDBETWEEN(1 , NoOfProductsAvailable)\n\
  )\n, \"Product ID\" , [Product ID]\n, \"Product Name\" , \"P \" & RIGHT(REPT(\"\
  0\" , ZeroPadding) &  [Product ID], LEN(NoOfProductsAvailable))\n)\n)\nvar p2_productcolor\
  \ =\nADDCOLUMNS(\np0_productbasetable\n,/* 这是产品颜色 */\n\"Color\"\n,\nvar randomvalue\
  \ = RANDBETWEEN(1,NoOfroductColors)\nreturn\nPATHITEM(path_Colors ,randomvalue,\
  \ TEXT)\n)\nreturn\np2_productcolor\n列表 14-5\n产品维度 - 颜色\n```\n\n这几行代码\n\n```\n/*\
  \ 非层次结构属性 */\nvar NoOfroductColors = COUNTROWS('Product_Color')\nvar path_Colors\
  \ = CONCATENATEX(TOPN(NoOfroductColors,'Product_Color',[Attribute1_ID]),[Attribute1_Name],\"\
  |\")\n```\n\n的工作方式如下：\n\n*   颜色数量被存储到变量 `NoOfProductColors` 中。\n*   `TOPN` 返回一个按\
  \ `Attribute1_ID` 列排序的表。然后使用该表，通过 `Attribute1_Name` 列创建所有颜色名称的字符串。使用分隔符 `\"|\"`\
  \ 可以调用所有 `PATH` 函数，如 `PATHITEM`。\n\n这几行代码\n\n```\nvar randomvalue = RANDBETWEEN(1,NoOfroductColors)\n\
  return\nPATHITEM(path_Colors ,randomvalue, TEXT)\n```\n\n创建了：\n\n*   一个使用 `RANDBETWEEN`\
  \ 生成的随机整数。该整数被存储到变量 `randomvalue` 中。\n*   `PATHITEM` 函数允许从一个由 `\"|\"` 分隔项目的字符串中检索项目（即颜色）。\n\
  \n如前所述，列表 14-6 将创建完整的维度表 `Product Dimension – final`。\n\n```\nDimension Product\
  \ - final =\nvar NoOfProductsToUse = [_No of Products To Use] --由于使用了 DISTINCT，重复行将被消除，因此你可能不会得到完全相同的数字\n\
  var NoOfProductsAvailable = COUNTROWS('Dimension Template')\nvar ZeroPadding = CEILING(LOG10(NoOfProductsAvailable),1)\n\
  var p0_productbasetable = DISTINCT(\nSELECTCOLUMNS(\nADDCOLUMNS(\nGENERATESERIES(1\
  \ , NoOfProductsToUse , 1)\n, \"Product ID\" , RANDBETWEEN(1 , NoOfProductsAvailable)\n\
  )\n, \"Product ID\" , [Product ID]\n, \"Product Name\" , \"P \" & RIGHT(REPT(\"\
  0\" , ZeroPadding) &  [Product ID], LEN(NoOfProductsAvailable))\n)\n)\n/* *****************************************************************\
  \ */\n/* 用于创建层次结构的分箱通用信息 */\nvar NoOfRowsBaseTable = COUNTROWS(p0_productbasetable)\n\
  var MaxMinRange = MAXX(p0_productbasetable,[Product ID]) - MINX(p0_productbasetable,[Product\
  \ ID])\n/* ***************************************************************** */\n\
  /* 使用斯特吉斯公式确定分箱宽度 */\nvar noOfGroupsSturges = ROUND(LOG(NoOfRowsBaseTable,2),0)+1\n\
  var subgroupWidthSturges = CEILING((MaxMinRange/noOfGroupsSturges),1)\nvar groupWidthSturges\
  \ = subgroupWidthSturges * 2\n/* *****************************************************************\
  \ */\n/* 使用斯特吉斯公式确定分箱宽度 */\nvar noOfGroupsRice = ROUND(2 * POWER(COUNTROWS(p0_productbasetable),1/3),0)\n\
  var subgroupWidthRice = CEILING((MaxMinRange/noOfGroupsRice),1)\nvar groupWidthRice\
  \ = subgroupWidthRice * 2\n/* *****************************************************************\
  \ */\n/* 非层次结构属性 */\nvar NoOfroductColors = COUNTROWS('Product_Color')\nvar path_Colors\
  \ = CONCATENATEX(TOPN(NoOfroductColors,'Product_Color',[Attribute1_ID]),[Attribute1_Name],\"\
  |\")\nvar p1_productsWithHiearchy =\nADDCOLUMNS(\np0_productbasetable\n,\n/* 创建组数的公式来自：\
  \ https://en.wikipedia.org/wiki/Histogram */\n/* *************************************************************\
  \ */\n/* 使用斯特吉斯公式确定分箱宽度 */\n\"SG1 range\"\n,\nvar groupNumber = CEILING([Product\
  \ ID] / subgroupWidthSturges,1)\nreturn\n\"SG1 range \" & 1+(groupNumber-1) * subgroupWidthSturges\
  \ & \" to \"  & FLOOR(groupNumber * subgroupWidthSturges,1)\n, \"SG1 number\"\n\
  ,\n\"SG1 number\" & RIGHT(REPT(\"0\", 3) & CEILING([Product ID] / subgroupWidthSturges,1),3)\n\
  ,\"G1 range\"\n,\nvar groupNumber = CEILING([Product ID] / groupWidthSturges,1)\n\
  return\n\"G1 range \" & 1+(groupNumber-1) * groupWidthSturges & \" to \"  & FLOOR(groupNumber\
  \ * groupWidthSturges,1)\n, \"G1 number\"\n,\n\"G1 number \" & RIGHT(REPT(\"0\"\
  , 3) & CEILING([Product ID] / groupWidthSturges,1),3)\n/* *********************************************************\
  \ */\n/* 使用赖斯公式确定分箱宽度 */\n,\"SG2 range\"\n,\nvar groupNumber = CEILING([Product\
  \ ID] / subgroupWidthRice,1)\nreturn\n\"SG2 range \" & 1+(groupNumber-1) * subgroupWidthRice\
  \ & \" to \"  & FLOOR(groupNumber * subgroupWidthRice,1)\n, \"SG2 number\"\n,\n\"\
  SG2 number\" & RIGHT(REPT(\"0\", 3) & CEILING([Product ID] / subgroupWidthRice,1),3)\n\
  ,\"G2 range\"\n,\nvar groupNumber = CEILING([Product ID] / groupWidthRice,1)\nreturn\n\
  \"G2 range \" & 1+(groupNumber-1) * groupWidthRice & \" to \"  & FLOOR(groupNumber\
  \ * groupWidthRice,1)\n, \"G2 number\"\n,\n\"G2 number \" & RIGHT(REPT(\"0\", 3)\
  \ & CEILING([Product ID] / groupWidthRice,1),3)\n)\nvar p2_final =\nADDCOLUMNS(\n\
  p1_productsWithHiearchy\n,/* 这是产品颜色 */\n\"Color\"\n,\nvar randomvalue = RANDBETWEEN(1,NoOfroductColors)\n\
  return\nPATHITEM(path_Colors ,randomvalue, TEXT)\n)\nreturn\np2_final\n列表 14-6\n\
  产品维度 - 最终版\n```\n\n### 事实表\n\n事实表核心上是存储事件度量值的。在创建可扩展数据模型时，这个简单的事实本身就存在其难度。因此，本章将创建两个典型的事实表。\n\
  \n\n\n#### 订单与订单行\n\n假设一个事件是一次销售，即某人（客户）正在购买某物（产品）。这个简单的假设引出了许多我们必须回答的问题。其中一些问题如下：\n\
  \n- 在一个事件中，一个产品可以被销售多次吗？\n  - 简单的答案是“可以”。度量会记录产品和数量，但在某些情况下，一个事件会多次记录同一个产品，例如在超市购买商品。根据零售商的不同，所有产品会被分别扫描，但有时收银员只扫描一次产品，如果购买多个相同产品，则手动输入数量。当然，世事难料，同一个产品可能会从其他产品下面冒出来，然后被再次扫描。\n\
  \n我们必须决定哪些情况是可能的。由于我们是从可用产品列表中随机抽取，我们决定单个事件只记录一次产品，但很明显，产品有可能被购买多次。\n\n清单 14-7 展示了一个符合上述定义的非常简单的事实表。\n\
  \n```\nFact - simple =\nvar ProductsPath = CONCATENATEX(TOPN([_No of Products per\
  \ transaction (max)], 'Dimension Product - hierarchy','Dimension Product - hierarchy'[Product\
  \ ID],ASC),[Product ID],\"|\")\nreturn\nADDCOLUMNS(\nGENERATE(\nSELECTCOLUMNS(\n\
  GENERATESERIES(1 , [_No of Events] , 1 )\n, \"Order ID\" , [Value]\n)\n,var noofproductspertransaction\
  \ = RANDBETWEEN(1 , [_No of Products per transaction (max)])\nreturn\nDISTINCT(\n\
  SELECTCOLUMNS(\nADDCOLUMNS(\nGENERATESERIES(1 ,  noofproductspertransaction)\n,\
  \ \"Product ID\" , PATHITEM(ProductsPath , RANDBETWEEN(1 , PATHLENGTH(ProductsPath))\
  \ , INTEGER)\n)\n, \"Orderline ID\" , [Value]\n, \"Product ID\" , [Product ID]\n\
  )\n)\n)\n,\"Quantity\" , RANDBETWEEN(1 , 10)\n)\n清单 14-7\n事实表 – 简单版\n```\n\n清单 14-7\
  \ 中的操作如下：\n\n- 一个有序的产品列表被存储在变量 `ProductsPath` 中。这个列表再次通过使用带有特殊分隔符“|”的函数 `CONCATENATEX`\
  \ 创建。\n- 函数 `GENERATE` 组合了由 `GENERATESERIES` 创建的两个嵌套表，其中外部的 `GENERATESERIES` 代表事件（订单），内部的代表订单行。\n\
  - `DISTINCT` 用于避免同一个产品在单个订单中出现多次。\n- 从给定的产品列表中，选择一个随机数字，其中产品的最大数量受限于度量值 `[_No of\
  \ Products per transaction (max)]`。\n\n图 14-5 展示了表 `Fact – simple` 以及数据模型的配置。\n\n\
  ![../images/471413_1_En_14_Chapter/471413_1_En_14_Fig5_HTML.jpg](img/471413_1_En_14_Fig5_HTML.jpg)\n\
  \n图 14-5\n\n事实表 – 简单版\n\n清单 14-8 展示了用于配置示例数据模型以生成上图的语句。\n\n```\nSample Data Configuration\
  \ =\nUNION(\nROW(\"Parameter Name\" , \"No Of Products to use\", \"Parameter Value\"\
  \ , 1000)\n, ROW(\"Parameter Name\" , \"No Of Events\", \"Parameter Value\" , 10)\n\
  , ROW(\"Parameter Name\" , \"No of Products per event (max)\" , \"Paramter Value\"\
  \ , 5)\n)\n清单 14-8\n示例数据配置 – 事实表简单版\n```\n\n数据模型配置为使用所有可用产品（1000 个），但每个事件最多只包含 5\
  \ 个产品。仔细观察可以发现，每个事件都是从同一个产品池中抽取。这并非预期效果（至少在本例中不是）。这个效果是因为 `ProductsPath` 是在 `GENERATE`\
  \ 外部定义的，并且紧挨着它创建了一个始终包含 `TOPN` 个产品 ID 的列表。清单 14-9 使用了已知组件的不同组合。重要的部分已高亮显示，并在清单下方进行更详细的解释。\n\
  \n```\nFact - not that simple =\nvar noOfAvailableProducts = COUNTROWS('Dimension\
  \ Product - final')\nvar ListOfAvaliableProducts = CONCATENATEX(VALUES('Dimension\
  \ Product - final'[Product ID]),[Product ID],\"|\")\nreturn\nADDCOLUMNS(\nGENERATE(\n\
  SELECTCOLUMNS(\nGENERATESERIES(1 , [_No of Events] , 1 )\n, \"Order ID\" , [Value]\n\
  )\n,var noofproductspertransaction = RANDBETWEEN(1 , [_No of Products per event\
  \ (max)])\nreturn\nDISTINCT(\nSELECTCOLUMNS(\nADDCOLUMNS(\nGENERATESERIES(1 ,  noofproductspertransaction)\n\
  , \"Product ID\" , PATHITEM(ListOfAvaliableProducts , RANDBETWEEN(1 , PATHLENGTH(ListOfAvaliableProducts))\
  \ , INTEGER)\n)\n, \"Orderline ID\" , [Value]\n, \"Product ID\" , [Product ID]\n\
  )\n)\n)\n,\"Quantity\" , RANDBETWEEN(1 , 10)\n)\n清单 14-9\n事实表 – 没那么简单版\n```\n\n\
  代码行\n\n```\nvar ListOfAvaliableProducts = CONCATENATEX(VALUES('Dimension Product\
  \ - final'[Product ID]),[Product ID],\"|\")\n```\n\n只是创建了一个字符串，该字符串可以再次被 `PATH`\
  \ 函数使用。\n\n代码行\n\n```\nPATHITEM(ListOfAvaliableProducts , RANDBETWEEN(1 , PATHLENGTH(ListOfAvaliableProducts))\
  \ , INTEGER)\n```\n\n从存储在变量 `ListOfAvaliableProducts` 中的字符串里随机抽取一个项目，但由于使用了特定的分隔符，它可以通过\
  \ `PATHITEM` 函数进行搜索。\n\n图 14-6 展示了使用表 `Fact – not that simple` 生成的报表。\n\n![../images/471413_1_En_14_Chapter/471413_1_En_14_Fig6_HTML.jpg](img/471413_1_En_14_Fig6_HTML.jpg)\n\
  \n图 14-6\n\n事实表 – 没那么简单版\n\n#### 不同日期\n\n日期对于几乎所有的分析都至关重要。因此，我们将为这个模型添加一个非常简单的日历表。\n\
  \n清单 14-10 展示了如何使用 DAX 创建这个日历表。\n\n```\nCalendar table =\nADDCOLUMNS(\nCALENDAR(\n\
  DATE(2018 , 1 , 1)\n, DATE(2019 , 12 , 31)\n)\n, \"Year-Month\" , FORMAT([Date]\
  \ , \"YYYYMM\")\n, \"Year\", FORMAT([Date] , \"YYYY\")\n)\n清单 14-10\n基础日历表\n```\n\
  \n\n\n#### 注意事项\n\n日历表被标记为日期表，且已禁用`自动日期/时间`选项（`选项和设置` ➤ `选项` ➤ `当前文件` ➤ `数据加载`）。\n\
  \n此处将重点为每个事件创建不同的日期。这些日期将是：\n\n- **订单日期** – 从日历表中随机选取的日期。\n- **交货日期** – 该日期将在订单日期之后随机增加天数，最大天数将通过`示例数据配置`表进行配置。\n\
  \n创建交货日期时须考虑日历表的结束日期。\n\n清单 14-11 展示了如何创建一个与日期相关的表，并将其集成到清单 14-9 的语句中。\n\n```\n\
  Fact - with Dates =\nvar noOfAvailableProducts = COUNTROWS('Dimension Product -\
  \ final')\nvar ListOfAvaliableProducts = CONCATENATEX(VALUES('Dimension Product\
  \ - final'[Product ID]),[Product ID],\"|\")\nvar maxDate = MAX('Calendar table'[Date])\n\
  var maxDaysAhead = [_No of days ahead]\nvar maxDateRandom = maxdate - [_No of days\
  \ ahead]\nvar c0_base = FILTER(ALL('Calendar table'[Date]) , [Date] <= maxDateRandom)\n\
  var NoOfAvailableDays = COUNTROWS(c0_base)\nvar c0_base_path = CONCATENATEX(TOPN(NoOfAvailableDays\
  \ , c0_base, [Date] , ASC) , [Date], \"|\")\nvar t_OrderID =\nSELECTCOLUMNS(\nADDCOLUMNS(\n\
  GENERATESERIES(1 , [_No of Events] , 1 )\n, \"Order date\" , DATEVALUE(PATHITEM(c0_base_path\
  \ , RANDBETWEEN(1 , NoOfAvailableDays), TEXT))\n)\n, \"Order ID\" , [Value]\n, \"\
  Order date\" , [Order date]\n, \"Delivery date\" , [Order date] + RANDBETWEEN(1\
  \ , maxDaysAhead)\n)\nreturn\nADDCOLUMNS(\nGENERATE(\nt_OrderID\n,var noofproductspertransaction\
  \ = RANDBETWEEN(1 , [_No of Products per events (max)])\nreturn\nDISTINCT(\nSELECTCOLUMNS(\n\
  ADDCOLUMNS(\nGENERATESERIES(1 ,  noofproductspertransaction)\n, \"Product ID\" ,\
  \ PATHITEM(ListOfAvaliableProducts , RANDBETWEEN(1 , PATHLENGTH(ListOfAvaliableProducts))\
  \ , INTEGER)\n)\n, \"Orderline ID\" , [Value]\n, \"Product ID\" , [Product ID]\n\
  )\n)\n)\n,\"Quantity\" , RANDBETWEEN(1 , 10)\n)\n清单 14-11\n事实表 – 包含日期\n```\n\n该语句将用于抽取随机日期。每个事件都会生成一个订单日期和一个交货日期。交货日期取决于参数`maxDaysAhead`，当然也取决于所有可用日期。可用最晚日期的计算方式如下：\n\
  \n```\nvar maxDateRandom = maxdate - [_No of days ahead]\n```\n\n此计算确保交货日期不会超出日历表的最大日期。\n\
  \n可用日期将存储到表变量`c0_base`中。这些可用日期将被转换为一个有序列表。该列表存储在变量`c0_base_path`中。\n\n## 结语\n\n\
