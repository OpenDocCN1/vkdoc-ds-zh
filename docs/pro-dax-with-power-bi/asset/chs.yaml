  return\nCALCULATE(\n[Total quantity]\n,FILTER(\n'Fact Sale'\n, 'Fact Sale'[Quantity]\
  \ > theAverage\n)\n)\n代码清单 7-4\n高于平均值的总数量 v4\n\n```\n\n上述代码清单显示，度量值 `Average Quantity`\
  \ 的评估甚至在 `CALCULATE` 外部进行；平均值被存储在变量 `theAverage` 中。在数据模型内部，还定义了另一个度量值 `Total Quantity\
  \ above average v5`。该度量值将平均度量值的评估过程移近表迭代器，但仍在其外部进行评估。乍一看，在 `CALCULATE` 外部声明变量似乎很方便，但最佳实践是尽可能在使用变量的地方附近声明。当度量值开始变得复杂时，这一点尤其重要。\n\
  \n尽管如此，还应考虑尽可能保持筛选表较小，因为这样可以加快度量值的评估速度，即在度量值评估期间需要处理的数据更少。\n\n为此，我们定义了最终的度量值 `Total\
  \ Quantity above average final`。请参阅代码清单 7-5。\n\n```\nTotal Quantity above average\
  \ final =\nCALCULATE(\n[Total quantity]\n,\nvar theAverage = [Average Quantity]\n\
  return\nFILTER(\nALL('Fact Sale'[Quantity])\n, 'Fact Sale'[Quantity] > theAverage\n\
  )\n)\n代码清单 7-5\n高于平均值的总数量（最终版）\n\n```\n\n该度量值使用了 DAX 函数 `ALL`，它是可用于解除列上现有筛选器的 DAX\
  \ 函数之一。\n\n所有度量值及其结果如图 7-3 所示。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig3_HTML.jpg](img/471413_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n\n所有平均值度量值\n\n### 提示\n\n尽可能将变量放置在靠近其使用位置的地方，并保持筛选表尽可能小。\n\n## 简单筛选\n\n\
  本章将从一个非常基础的用例开始：筛选（即查找）活动次数超过某个阈值的客户。\n\n\n\n#### 注意\n\n本部分参考了报告页面“简单筛选”和“简单筛选 –\
  \ 更复杂的情况”。\n\n代码清单 7-6 展示了使用 DAX 函数 `DISTINCTCOUNT` 进行的度量计算。\n\n```\n活动数量 =\nvar\
  \ 活动数量 = DISTINCTCOUNT('销售事实'[销售键])\nreturn\nIF(ISBLANK(活动数量),0,活动数量)\n代码清单 7-6\n\
  活动数量\n```\n\n将度量计算和条件检查拆分为两个度量是一种良好的实践。\n\n代码清单 7-7 展示了执行条件检查的度量，即判断某个值是否满足给定条件。\n\
  \n```\n满足活动阈值 =\nIF([活动数量] > 20 , 1 , 0)\n代码清单 7-7\n满足活动阈值\n```\n\n如果活动数量大于 20，度量\
  \ `满足活动阈值` 返回 1；否则返回 0。\n\n图 7-4 展示了如何使用这两个度量来识别某个月内所有不满足阈值度量的客户。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig4_HTML.jpg](img/471413_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4  \n不满足阈值的客户\n\n上述筛选被认为是简单的。为了增加一点复杂性，我们对条件进行了修改。现在活动阈值定义如下：\n\n如果以下条件**不**成立，则标记该客户：\n\
  \n- 如果 `[总数量]` 小于 1500，则 `[活动数量]` 必须小于 10。\n\n为此，定义了第二个度量；参见代码清单 7-8。\n\n```\n满足活动阈值\
  \ v2 =\nvar 活动数量 = [活动数量]\nvar 总数量 = [总数量]\nreturn\nIF(\nAND(\n总数量 < 1500\n, 活动数量\
  \ < 10\n)\n, 0 , 1 )\n代码清单 7-8\n满足活动阈值 v2\n```\n\n假设需要创建一个异常报告，重点分析不满足给定规则的客户，那么返回\
  \ 1 会很有帮助，因为这些值将被汇总，从而返回违反规则的客户数量。这可以通过将度量嵌入到表迭代器函数 `SUMX` 中轻松实现，如代码清单 7-9 所示。\n\
  \n```\n违反规则 - 客户计数 =\nSUMX(\nVALUES('维度客户'[客户键])\n, IF([满足活动阈值 v2] = 0 , 1 , BLANK())\n\
  )\n代码清单 7-9\n违反规则 - 客户计数\n```\n\n图 7-5 展示了上述度量的应用。该截图取自报告页面“简单筛选”。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig5_HTML.jpg](img/471413_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5  \n全年规则违反情况\n\n需要注意的是，可以用以下模式来使用度量进行筛选（见图 7-6）。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig6_HTML.jpg](img/471413_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6  \n基本模式\n\n上述模式看似简单，但如果遵循这些步骤，有助于避免混淆。\n\n### 警告\n\n以上述方式重用度量可能会导致意外结果，因为度量会自动执行上下文转换，即将现有的行上下文转换为筛选上下文。\n\
  \n"
- "# 汇总表与度量\n\n这一部分涉及在汇总表内部的使用，以及如何使用度量对这些表进行筛选。为此，需要先进行一些介绍。这个介绍基于一个假设：本节创建的所有汇总表稍后都将在度量内部使用。这意味着\
  \ PBIX 文件中使用的所有表仅用于演示目的。\n\n在创建更复杂的 DAX 度量时，有许多理由表明创建汇总表变得很重要。以下是两个原因：\n\n-   通过使迭代器尽可能紧凑（列和行尽可能少），加速表迭代器函数的执行。\n\
  -   创建与报表无关的表，用作计算的输入。\n\n用于创建汇总表最熟悉的 DAX 函数是 `SUMMARIZE`；这很可能是因为它的可用性久。为此，我们将用一小节专门介绍\
  \ `SUMMARIZE`。\n\n## 使用 SUMMARIZE\n\n到目前为止，关于筛选上下文已经讲了很多。特别是，关于表迭代器函数是否执行上下文转换的讨论一直在进行。而且，关于\
  \ `SUMMARIZE` 的一般用法也讲了很多，但说实话，`SUMMARIZE` 仍然有其价值。这主要是因为出现了像 `GROUPBY` 或 `SUMMARIZECOLUMNS`\
  \ 这样较新的函数。如果需要计算度量，`SUMMARIZECOLUMNS` 并不可用，即使这是一本关于 DAX 的书，我们假设大多数读者并不涉及查询编写。\n\n\
  #### 注意\n\n本部分参考了报告页面“汇总表与度量”。\n\n有一些理由说明应该只使用 `SUMMARIZE` 来汇总数据以创建汇总表。至于添加计算列，强烈建议使用以下模式来添加这些列：\n\
  \n```\nADDCOLUMMNS(\nSUMMARIZECOLUMNS(\n‘’\n, \n, \n)\n, \"\" , \n, “\" , \n)\n\
  ```\n\nsqlbi.com 的优秀团队已经非常详细地描述了这个模式（文章链接：[`www.sqlbi.com/articles/best-practices-using-summarize-and-addcolumns/`](http://www.sqlbi.com/articles/best-practices-using-summarize-and-addcolumns/)）。\n\
  \n下面提及了一些不应被遗忘的值得注意的独特性。代码清单 7-10 展示了创建该表的 DAX 语句。\n\n```\n包含 Summarize 的表 =\nADDCOLUMNS(\n\
  SUMMARIZE(\n'销售事实'\n, '维度城市'[销售区域]\n, \"内部求和\" , SUM('销售事实'[数量])\n)\n, \"外部求和\"\
  \ , SUM('销售事实'[数量])\n, \"使用度量\" , [总数量]\n)\n代码清单 7-10\n包含 Summarize 的表\n```\n\n\
  图 7-7 显示了上述 DAX 语句创建的表。\n\n![../images/471413_1_En_7_Chapter/471413_1_En_7_Fig7_HTML.jpg](img/471413_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7  \n使用 SUMMARIZE 的表\n\n要准确理解发生了什么，有必要记住 `SUMMARIZE` 和 `ADDCOLUMNS` 这两个函数都被视为所谓的表迭代器函数。但与\
  \ `SUMMARIZE` 相反，`ADDCOLUMNS` 不执行上下文转换，并且不会从迭代的当前行创建筛选上下文。这就解释了为什么 `外部求和` 列中的所有行值都与“总计”行值匹配。由于没有筛选上下文，表迭代器中的所有行都被使用了。\n\
  \n当然，如果使用度量来计算`使用度量`列的列值，则不会出现这种效果。度量总是会执行上下文转换——将行上下文转换为筛选上下文。\n\n\n\n### SUMMARIZE\
  \ 与 GROUPBY 的对比\n\n`GROUPBY` 是后期才被引入 DAX 的函数，因此使用频率并不高，至少在社区（即[`community.powerbi.com`](http://community.powerbi.com)）中并不常见。但这种忽视并不合理，原因如下：\n\
  \n- **性能** – 在某些场景下，`GROUPBY` 的执行速度比 `SUMMARIZE` 更快。当分组行数较少时尤其如此（当然，数据量大小的判定取决于诸多因素）。\n\
  - **高级分组** – `GROUPBY` 支持对“计算列”进行分组。这在复杂度量值中变得非常重要。\n\n> **注意：** 本节内容涉及报表页面“嵌套排名”、“SUMMARIZE\
  \ 组内排名”和“GROUPBY 组内排名”。\n\n为了比较这两个函数的性能，我们定义了三个度量值。基础度量值 `_r` 如代码清单 7-11 所示。\n\n\
  ```\n_r =\nRANKX(\n    CALCULATETABLE(\n        SUMMARIZE(\n            'Fact Sale'\n\
  \            , 'Dimension City'[Sales Territory]\n            , 'Dimension City'[State\
  \ Province]\n        )\n        , ALL('Dimension City'[State Province])\n    )\n\
  \    , [Total quantity]\n    ,\n    , DESC\n)\n```\n\n*代码清单 7-11 `_r`*\n\n由于 `RANKX`\
  \ 本身并非最简单的函数，也不是最快的表迭代函数，此处用它来对底层数据模型施加一些压力。该度量值的作用是：在每个 `Sales Territory` 内，根据度量值\
  \ `Total Quantity` 对列 `State Province` 的相关值进行排名。图 7-8 展示了这一度量值。\n\n![图 7-8 嵌套排名](img/471413_1_En_7_Fig8_HTML.jpg)\n\
  \n由于本章主要讨论如何使用度量值对结果进行筛选，因此额外定义了两个度量值：\n\n- `SUMX GroupBy Filtered`\n- `SUMX Summarize\
  \ Filtered`\n\n两个度量值几乎完全相同，此处仅展示第一个的代码清单。见代码清单 7-12。\n\n```\nSUMX GroupBy Filtered\
  \ =\nSUMX(\n    FILTER(\n        ADDCOLUMNS(\n            GROUPBY(\n           \
  \     'Fact Sale'\n                , 'Dimension City'[Sales Territory]\n       \
  \         , 'Dimension City'[State Province]\n            )\n            , \"q\"\
  \ , [Total quantity]\n            , \"r\" , [_r]\n        )\n        , [r] <= 2\n\
  \    )\n    , [q]\n)\n```\n\n*代码清单 7-12 `SUMX GroupBy Filtered`*\n\n该度量值的工作原理很直接。首先使用\
  \ `GROUPBY` 构建一个汇总表，并通过排名度量值 `_r` 为表添加计算列。最后，为每个销售区域仅保留排名前两位的州。\n\n与度量值 `SUMX GroupBy\
  \ Filtered` 略有不同，第二个度量值 `SUMX Summarize Filtered` 使用 `SUMMARIZE` 函数来创建汇总表。\n\n图\
  \ 7-9 和 7-10 展示了性能测试的第五次迭代。每次迭代包含以下步骤：\n\n- 打开已激活“空白页”报表页面的 pbix 文件。\n- 启动 DAX Studio，连接到\
  \ pbix 文件，并激活“全部查询跟踪”。\n- 切换到感兴趣的 Power BI 报表页面，即“SUMMARIZE 组内排名”或“GROUPBY 组内排名”。\n\
  - 依次选择可用的切片器值。\n- 对另一个报表页面重复上述步骤。\n\n![图 7-9 SUMMARIZE – 筛选后的嵌套排名](img/471413_1_En_7_Fig9_HTML.jpg)\n\
  \n![图 7-10 GROUPBY – 筛选后的嵌套排名](img/471413_1_En_7_Fig10_HTML.jpg)\n\n两张图均显示，基于 `GROUPBY`\
  \ 的筛选略占优势，但务必针对具体数据集测试 `SUMMARIZE` 和 `GROUPBY` 这两个函数。\n\n### 数据分箱与 GROUPBY 的强大功能\n\
  \n关于动态分箱的论述已有很多，讨论也层出不穷，未来还会有更多。这意味着这不会是关于动态分箱的最后一篇文章。但由于使用了 `GROUPBY`，至少带来了一些新意。\n\
  \n分箱是指将数据归类到预定义的桶中。通常这些桶有下限和上限，本例也不例外。如果桶的大小选择得当，统计桶内的数据量能揭示深刻的洞察。请注意，本例中桶的大小选择并不明智。同样重要的是，聚合函数并不限于\
  \ `COUNT`。\n\n> **注意：** 本节内容涉及报表页面“分箱”。\n\n图 7-11 展示了根据 `Fact Sale` 表中列 `Sale Key`\
  \ 的值分布创建的 `bins` 表内容。\n\n![图 7-11 分箱](img/471413_1_En_7_Fig11_HTML.jpg)\n\n图 7-12\
  \ 展示了 `bins` 表、度量值和带状图（Ribbon Chart）的组合。\n\n![图 7-12 分箱可视化](img/471413_1_En_7_Fig12_HTML.jpg)\n\
  \n代码清单 7-13 展示了度量值 `binning using group by`。\n\n```\nbinning using group by =\n\
  var abt =\nGROUPBY(\n    ADDCOLUMNS(\n        VALUES('Fact Sale'[Customer Key])\n\
  \        ,\"NoOfActivities\",[No Of Activities]\n    )\n    ,[NoOfActivities]\n\
  \    ,\"SumOf\",SUMX(CURRENTGROUP(),[NoOfActivities])\n)\nreturn\nSUMX(\n    VALUES('bins')\n\
  \    ,\n    var binMin = 'bins'[min]\n    var binMax =\n        IF(\n          \
  \  NOT(ISBLANK('bins'[max]))\n            ,'bins'[max]\n            ,MAXX(abt,[NoOfActivities])\n\
  \        )\n    return\n    SUMX(\n        FILTER(\n            abt\n          \
  \  ,[NoOfActivities] >= binMin && [NoOfActivities] <= binMax\n        )\n      \
  \  ,[SumOf]\n    )\n)\n```\n\n*代码清单 7-13 `binning using GROUPBY`*\n\n上述度量值分为两部分：第一部分创建分组，并将分组结果存入表变量\
  \ `abt`。第二部分将表映射到 `bins` 表。由于 `bins` 表与数据模型无关，这种映射必须动态完成。\n\n第一部分 `GROUPBY` 同样使用了度量值\
  \ `No Of Activities`。为了更好地理解其运作原理，下面用一个简单的图表来解释第一部分复杂的内部机制。\n\n图 7-13 展示了使用 `CURRENTGROUP`\
  \ 的 `GROUPBY` 概念。\n\n![图 7-13 GROUPBY 概念可视化](img/471413_1_En_7_Fig13_HTML.jpg)\n\
  \n“内部表”仅由两列组成，一列是 `Customer Key`（请注意，该列来自表 `Fact Sale` 而非表 `Dimension Customer`）。通过\
  \ `ADDCOLUMNS` 添加度量值 `No Of Activities`。该度量值仅用于统计活动数量。这个表由大家熟悉的函数 `VALUES` 和 `ADDCOLUMNS`\
  \ 创建。\n\n当读者意识到 `GROUPBY` 部分实际上是对一个计算列进行汇总时，可能会感到一丝神奇。结合 `CURRENTGROUP` 函数（该函数可类比于\
  \ T-SQL 中 `OVER` 语句的 `PARTITION BY` 子句），几乎可以创建出一个包含多列的新表。遗憾的是，如果不采取进一步的措施，这个表目前无法直接用于可视化对象，因此需要将其映射到代表桶的无关表。\n\
  \n在第二部分中，`abt` 表被映射到 `bins` 表。这是通过嵌套表迭代实现的。第一层迭代遍历所有桶，第二层迭代根据桶的上限和下限，将已分组的 `abt`\
  \ 表中的所有行映射到对应的桶中。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\
  译文如下：\n\n\n"
- '# 摘要


  使用度量值来筛选数据集，以及操作 `CALCULATE` 的筛选表达式并非易事，尤其是在目前还没有一种简洁的写法能完全发挥 DAX 函数作用的情况下。本书也不例外。DAX
  仍在不断发展变化中，但使用度量值进行筛选是值得的，这一点毋庸置疑。


  '
- '# 第三部分 – 使用 DAX 解决高级日常问题


  '
- "# 8. 使用 DAX 解决高级报表需求\n\n## 引言\n\n到目前为止，DAX 一直被用于计算度量值或计算列，旨在从数据模型中创建和提取见解。尽管这是使用\
  \ DAX 最显而易见的方面，但这并不是 DAX 唯一能发挥作用的地方。Power BI 是一个数据驱动的报表工具，使用户能够探索大量数据；Power BI 也是一个允许共享报表并与同事协作的工具。这就使得创建易于使用者操作的报表和仪表板变得很有必要。几乎可以强制要求，由其他用户构建的报表使用者或报表消费者，在访问报表时能够尽可能轻松快捷。这里的“访问”并非从技术角度而言，而是从可用性的角度出发。一旦业务分析师要分享其发现，他就必须确保报表的接收者能够完全专注于其主要任务——从底层数据中提取见解。除了创建度量值和计算列之外，DAX\
  \ 还可以用于创建更具动态性的报表。\n\n## 一些简单但不失强大的 DAX\n\n#### 注意\n\n在本节中，将使用 Power BI 文件“CH08\
  \ – unrelated tables.pbix”。\n\n随着 Power BI Desktop 2019 年 4 月版本的发布，“可视化标题的条件格式”功能被引入。乍一看，这个功能似乎微不足道，但它极大地提升了报表的可读性，并有助于传达见解。\n\
  \n对于那些仅用于更改某些视觉对象格式属性的度量值来说，将它们与常规度量值分开是一个好主意。这种分离可以通过创建一个专用的度量值表来实现。由于从技术角度看，度量值独立于任何表，因此将“格式设置”度量值分配到一个专用表中似乎是一个明智的选择。\n\
  \n### 创建度量值表\n\n可以通过从“开始”菜单中使用 `输入数据` 手动添加一个表来创建度量值表（见图 8-1）。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig1_HTML.jpg](img/471413_1_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** – 创建度量值表 – 输入数据\n\n由于在分配第一个度量值后，其内容将被删除，因此内容并不重要，如下一个屏幕截图所示（见图 8-2）。表的名称应谨慎选择，因为它将提供有关内容的信息。\n\
  \n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig2_HTML.jpg](img/471413_1_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** – 创建度量值表 – 内容\n\n为了完成度量值表的创建，我们使用清单 8-1 中的 DAX 语句创建一个非常简单的度量值。\n\n```\n\
  vizAid chart title = \"This is the title of a chart\"\n```\n\n**清单 8-1** – 一个非常简单的度量值\n\
  \n图 8-3 显示了新创建的表 `vizAids` 的内容。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig3_HTML.jpg](img/471413_1_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3** – 创建度量值表 – 表的内容\n\n创建度量值 `vizAid Report title` 后，可以从表中删除列 `Column1`。删除\
  \ `Column1` 后，需要保存、关闭并重新打开 Power BI 文件。\n\n重新打开 `pbix` 文件后，字段列表看起来会有所不同（见图 8-4）。\n\
  \n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig4_HTML.jpg](img/471413_1_En_8_Fig4_HTML.jpg)\n\
  \n**图 8-4** – 创建度量值表 – 度量值表\n\n需要注意，现在该表是字段列表中的第一个表，并且其图标也变成了度量值的图标。\n\n#### 注意\n\
  \n不要将所有度量值都分配给一个专用的度量值表。问答功能依赖于度量值的表分配，因为这有助于简化与其他表之间关系的发现。将度量值分配到专用度量值表可能会影响问答体验。\n\
  \n### 使用度量值创建动态可视化标题\n\n本章将解释如何将度量值用作报表页面“动态轴内容”上图表标题。\n\n启用图表的标题（见图 8-5）。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig5_HTML.jpg](img/471413_1_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5** – 使用格式设置度量值 – 标题\n\n在“标题文本”属性旁边，当鼠标靠近时会出现一个省略号按钮。点击省略号按钮可以进入条件格式对话框（见图\
  \ 8-6）。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig6_HTML.jpg](img/471413_1_En_8_Fig6_HTML.jpg)\n\
  \n**图 8-6** – 使用格式设置度量值 – 条件格式\n\n需要注意以下事实：基本上，视觉对象的所有属性都可以使用 DAX 进行更改。由于这里只是动态更改标题，因此只能选择一个选项。稍后我们会看到，根据要格式化的对象，可以使用更多选项。目前，只能使用度量值更改标题的文本。在后续阶段，很可能也可以使用\
  \ DAX 语句更改文本的其他属性。图 8-7 展示了如何通过选择“按字段值设置格式”选项来分配度量值。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig7_HTML.jpg](img/471413_1_En_8_Fig7_HTML.jpg)\n\
  \n**图 8-7** – 使用格式设置度量值 – 标题文本\n\n选择该度量值后，将为图表创建标题（见图 8-8）。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig8_HTML.jpg](img/471413_1_En_8_Fig8_HTML.jpg)\n\
  \n**图 8-8** – 使用格式设置度量值 – 基于度量值的标题\n\n由于当前标题不是动态的，我们将使用另一个度量值，即 `vizAid Chart title\
  \ dynamic`。该度量值如清单 8-2 所示。\n\n```\nvizAid Chart title dynamic =\nvar NoOfTopNSalesTeritory\
  \ = [No of Sales Territories Value]\nreturn\nIF(NoOfTopNSalesTeritory = 1\n,\"Just\
  \ the Top One Sales Territory is chosen\"\n,\"The Top \" & NoOfTopNSalesTeritory\
  \ & \" are chosen\"\n)\n```\n\n**清单 8-2** – 动态切片器标题\n\n度量值 `vizAid Chart title dynamic`\
  \ 创建了一个依赖于切片器选择参数值的度量值。这意味着可以组合一个动态标题，将其他度量值集成到标题文本中。\n\n\n\n### 使用度量值更改填充颜色\n\n\
  图 8-8 所示的柱状图使用了调色板中的默认颜色。可以通过使用度量值来更改此颜色，这意味着可以用度量值来控制每一根柱子的颜色。代码清单 8-3 展示了用于控制填充颜色的度量值，以强调代表\
  \ x 轴上“其他”元素的柱子。\n\n```\nvizAid fill color =\nIF(HASONEVALUE('Sales Territory and\
  \ other'[Sales Territory])\n,var theCurrentAxisValue = VALUES('Sales Territory and\
  \ other'[Sales Territory])\nreturn\nIF(theCurrentAxisValue  \"other\", \"darkgrey\"\
  , \"darkred\")\n,\"darkgrey\"\n)\n代码清单 8-3\n填充颜色\n```\n\n该度量值的工作原理如下：\n\n*   使用\
  \ DAX 函数 `HASONEVALUE`，检查列 `'Sales Territory and other'[Sales Territory]` 中是否仅选中了一个值。\n\
  *   如果 `HASONEVALUE` 返回 `FALSE`，表示当前筛选上下文中不存在该列的单个值。此时返回字符串 `\"darkgrey\"`。\n* \
  \  如果 `HASONEVALUE` 返回 `TRUE`，表示当前筛选上下文中存在单个值。第二个 `IF` 函数会检查该单个值是否等于字符串 `other`。如果值等于\
  \ `other`，则返回字符串 `\"darkred\"`；否则，返回字符串 `\"darkgrey\"`。\n\n图 8-9 展示了将度量值 `vizAid\
  \ fill color` 应用于确定填充颜色后的图表。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig9_HTML.jpg](img/471413_1_En_8_Fig9_HTML.jpg)\n\
  \n*图 8-9 使用格式化度量值 – 填充颜色*\n\n## 非相关表\n\n到目前为止，本书的每一章都探讨了使用 DAX 的某个特定方面——表迭代器、筛选等。但现在需要解决一个更复杂的任务。\n\
  \n#### 任务\n\n将前 N 个销售区域（按数量计）以柱状图形式显示，此外，所有剩余的区域（不包含在前 N 个中的）需要合并归为“其他”。\n\n要解决此任务，必须始终牢记以下基本原则。\n\
  \n### 规则\n\n无法在图表轴上、或者行或列标题中可视化数据模型中不存在或已被筛选掉的值。\n\n#### 注意\n\n除非另有说明，本节内容均参考 Power\
  \ BI 文件“CH08 – unrelated tables.pbix”中的“Using SUMX”报表页。\n\n因此，我们必须分解上述任务并回答两个基本问题：\n\
  \n*   我们能否可视化想要可视化的内容？\n*   我们能否创建一个有助于可视化所需内容的计算列？\n\n这两个问题的答案都是简单的“不能”。\n\n因此，需要跳出固有思维模式，“非相关表”的概念可能看起来很晦涩，尤其是回想起第\
  \ 2 章“数据建模”的内容。但是，一旦这个概念变得自然，非相关表就能为更多的任务提供无数的解决方案。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig10_HTML.jpg](img/471413_1_En_8_Fig10_HTML.jpg)\n\
  \n*图 8-10 非相关表*\n\n图 8-10 展示了非相关表 `Sales Territory and other – unrelated`。在图表轴上或作为行或列标题使用此表，可以可视化数据模型中不存在或通过选择筛选器内的值而被筛选掉的元素。\n\
  \n代码清单 8-4 展示了如何使用 DAX 创建该表。\n\n```\nSales Territory and other - unrelated =\nUNION(\n\
  DISTINCT('Dimension City'[Sales Territory])\n,ROW(\"Sales Territory\",\"Other\"\
  )\n)\n代码清单 8-4\n非相关表\n```\n\n现在可以使用此表来可视化一个名为 `Other` 的成员。不幸的是，解决第一个问题“我们能否可视化想要可视化的内容？”是有代价的。由于此表与数据模型中的任何其他表都没有关联，因此需要映射匹配的值。这种匹配必须完成将\
  \ `Dimension City` 表中 `Sales Territory` 列的值映射到非相关表中相应成员的任务。使用 `Fact Sale` 表中的 `Quantity`\
  \ 列无法产生我们想要的结果。图 8-11 展示了非相关表与 `Quantity` 列结合使用时会出现的状况。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig11_HTML.jpg](img/471413_1_En_8_Fig11_HTML.jpg)\n\
  \n*图 8-11 非相关表 – 非预期结果*\n\n由于 x 轴上使用的列来自非相关表，所有值都相同。\n\n为了克服这个问题，可以使用像 `SUMX` 这样的迭代器函数。第\
  \ 6 章“迭代器”已经解释并演示了迭代器函数的工作原理——创建一个度量值，该度量值遍历包含非相关表的 `Sales Territory` 列值的表。代码清单\
  \ 8-5 定义了将 `Quantity` 值映射到非相关表中相应 `Sales Territory` 的度量值。\n\n```\n_simple mapping\
  \ to the unrelated table =\nSUMX(\nVALUES('Sales Territory and other - unrelated'[Sales\
  \ Territory])\n,\nvar SalesTerritoryFromUnrelated = 'Sales Territory and other -\
  \ unrelated'[Sales Territory]\nreturn\nCALCULATE(SUM('Fact Sale'[Quantity]), 'Dimension\
  \ City'[Sales Territory] = SalesTerritoryFromUnrelated)\n)\n代码清单 8-5\n简单映射到非相关表\n\
  ```\n\n图 8-12 显示了上文提到的图表，但此时也使用了代码清单 8-6 中的度量值。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig12_HTML.jpg](img/471413_1_En_8_Fig12_HTML.jpg)\n\
  \n*图 8-12 非相关表 – 简单映射*\n\n图 8-12 显示相应的值已被映射。映射的工作原理如下：\n\n*   遍历表参数中的每一行。为此，需要使用\
  \ `VALUES` 函数，因为它返回当前筛选上下文中被引用列的一个表。由于轴值本身创建了一个筛选上下文，因此该表仅包含一行。\n*   通过使用非相关的销售区域值作为\
  \ `Dimension City` 表的筛选器来计算 `Quantity` 值。\n\n\n#### 注意\n\n务必注意，由于 `SUMX` 与 `VALUES`\
  \ 配合使用，计算得出的 `Quantity` 仅是映射结果，并未对多个销售区域进行本质上的求和。这是因为每个 `VALUES` 返回的表仅包含单行数据。\n\n\
  图 8-12 不幸地揭示了最终解决方案必须考虑的三个额外方面：\n\n*   即使事实表中不存在值，坐标轴值依然会显示为“无”。\n*   坐标轴值“其他”将会消失，因为该值在“城市维度”表中找不到对应的值。\n\
  *   由于迭代遍及不相关表的所有列值，最终解决方案必须考虑到并非所有销售区域都存在于当前筛选上下文中。\n\n因此，在度量值 `_dynamic content\
  \ SUMX` 中定义的最终解决方案是一个更复杂的 DAX 度量值。图 8-13 展示了包含预期结果的柱形图。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig13_HTML.jpg](img/471413_1_En_8_Fig13_HTML.jpg)\n\
  \n**图 8-13**  \n预期结果\n\n该度量值的定义如代码清单 8-7 所示。本章的其余部分将更详细地解释各个部分。\n\n由于该度量值依赖于一个使用了迭代函数\
  \ `RANX` 的度量值，因此该度量值将在代码清单 8-6 中展示。\n\n```\n_dynamic content SUMX =\nvar NoOfParameter\
  \ = [No of Sales Territories Value]\nvar SelectedSalesTerritories = VALUES('Dimension\
  \ City'[Sales Territory])\nvar tableWithRank =\nFILTER(\nADDCOLUMNS(\nSelectedSalesTerritories\n\
  ,\"rank\",[_Rank]\n)\n,[rank]  \"Other\"\n, CALCULATE([Total Quantity], 'Dimension\
  \ City'[Sales Territory] = thisCategory)\n, measureValueOther\n)\n)\nreturn\nSUMX(\n\
  FILTER(\ntableToIterate\n,'Sales Territory and other - unrelated'[Sales Territory]\
  \ in VALUES('Sales Territory and other - unrelated'[Sales Territory])\n)\n,[theValue]\n\
  )\n```\n\n**代码清单 8-7**  \n最终解决方案 – 使用 `SUMX`\n\n```\n_Rank =\nRANKX(\nALLSELECTED('Dimension\
  \ City'[Sales Territory])\n, CALCULATE([Total Quantity])\n,\n, DESC\n)\n```\n\n\
  **代码清单 8-6**  \n最终解决方案 – 排名\n\n### 变量定义\n\n```\nvar NoOfParameter = [No of Sales\
  \ Territories Value]\n```\n\n这行代码非常简单。它将度量值 `[No of Sales Territories Value]` 的值存储起来。该值代表参数切片器的值，用于筛选一个表，使其仅包含与报表页用户选择的“前\
  \ N 项”相对应的销售区域。\n\n### 变量定义\n\n```\nvar SelectedSalesTerritories = VALUES('Dimension\
  \ City'[Sales Territory])\n```\n\n这行代码也非常简单，但却极其重要。这行代码考虑了已经筛选过的销售区域。将 `VALUES`\
  \ 与来自事实表相关表的 `Sales Territory` 列引用一起使用，可以确保只考虑当前筛选上下文内的销售区域。如果你从可用的切片器“州省”或“销售区域”中进行不同选择，这一点就显而易见。这两个切片器都使用了相关表中的列。图\
  \ 8-14 展示了在当前筛选上下文中，筛选后的销售区域是如何被考虑的。\n\n#### 注意\n\n你必须意识到，“州省”切片器仅用于“减少”可用的销售区域。其值的影响未被考虑。\n\
  \n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig14_HTML.jpg](img/471413_1_En_8_Fig14_HTML.jpg)\n\
  \n**图 8-14**  \n不相关表 – 筛选后的销售区域\n\n### 变量定义\n\n```\nvar tableWithRank =\nFILTER(\n\
  ADDCOLUMNS(\nSelectedSalesTerritories\n,\"rank\",[_Rank]\n)\n,[rank] <= NoOfParameter\n\
  )\n```\n\n将需要被视为“前 N 项”的销售区域存储到一个专用表变量中，其排名小于或等于所选参数值。由于 `ADDCOLUMNS` 是表迭代函数之一，它可以用于通过度量值\
  \ `_Rank` 为销售区域分配排名。生成的表根据参数值进行筛选。此时，存储到变量 `tableWithRank` 中的表包含两列：\n\n*   `Sales\
  \ Territory` – 到原始表 `Dimension City` 的数据沿袭仍然存在。\n*   `rank` – 基于度量值 `[_rank]` 的列，允许按参数值进行筛选。\n\
  \n### 变量定义\n\n```\nvar topNTable =\nSELECTCOLUMNS(tableWithRank,\"axisvalue\",[Sales\
  \ Territory])\n```\n\n将需要被考虑的销售区域存储到一个单独的表中。此表现在只包含一列，但到原始列的数据沿袭并未中断。\n\n### 变量定义\n\
  \n```\nvar tableOther = EXCEPT(DISTINCT(SelectedSalesTerritories), topNTable)\n\
  ```\n\n提取出已被选中但不满足“前 N 项”阈值的销售区域，并将它们存储到一个专用变量中。\n\n### 变量定义\n\n```\nvar measureValueOther\
  \ = CALCULATE([Total Quantity],tableOther)\n```\n\n存储“其他”销售区域的值。在计算 `Quantity` 之前，使用表变量\
  \ `tableOther` 应用筛选条件。\n\n### 变量定义\n\n```\nvar tableToIterate =\nADDCOLUMNS(\nUNION(\n\
  INTERSECT(DISTINCT('Sales Territory and other - unrelated'),topNTable)\n,ROW(\"\
  axisvalue\",\"Other\")\n)\n,\"theValue\"\n,var thisCategory = [Sales Territory]\n\
  return\nIF(thisCategory  \"Other\"\n,CALCULATE([Total Quantity], 'Dimension City'[Sales\
  \ Territory] = thisCategory)\n,measureValueOther\n)\n)\n```\n\n存储将要在 `SUMX` 函数中使用的表。使用\
  \ `INTERSECT` 创建一个仅包含存在于表变量 `topNTable` 中的销售区域的表。该表与使用 DAX 函数 `ROW` 创建的单行表合并。两个表\
  \ `topNTable` 和这个单行表通过 `UNION` 函数合并。此表现在引用了不相关表。\n\n`Quantity` 将通过使用当前行值（`Sales\
  \ Territory` 列）作为对相关 `Dimension City` 表的筛选条件来计算并存储在 `theValue` 列中，但这次该表仅包含与原始筛选上下文中可用的销售区域相对应的销售区域。仅当销售区域的值不等于\
  \ `Other` 时才会进行此计算。如果值等于 `Other`，则使用之前存储的值（变量 `measureValueOther`）。\n\n最后，以下几行代码：\n\
  \n```\nSUMX(\nFILTER(tableToIterate\n,'Sales Territory and other - unrelated'[Sales\
  \ Territory] in VALUES('Sales Territory and other - unrelated'[Sales Territory]))\n\
  ,[theValue]\n)\n```\n\n遍历由 `FILTER` 语句返回的表。基本上，`SUMX` 被用来遍历一个表以映射一个值。这类似于代码清单 8-5\
  \ 中演示的映射。为了避免最终表中存在的所有行对柱形图坐标轴上使用的所有值进行求和，使用了 `FILTER` 函数，而来自视觉对象的筛选条件（隐式筛选条件）通过使用\
  \ `VALUES` 函数被“注入”到公式中。`FILTER` 函数确保被遍历的表仅包含单行数据。\n\n\n\n### 使用工具提示对“其他”成员进行排序\n\
  \n根据作为 Top N 条件提供的数值，代表剩余销售区域的动态计算值“其他”成员会出现在顶部、中间或底部。这完全取决于参数值所选定的销售区域数量。这种行为可能正是报表用户所期望的。但也可能存在一种情况，即代表“其他”的坐标轴值必须始终出现在条形图的底部。\n\
  \n这可以通过定义一个简单的度量值来实现（与上一个相比更为简单）。度量值 `vizAid sort rank` 用于确保坐标轴值“其他”始终出现在图表底部。清单\
  \ 8-8 展示了该度量值的 DAX 语句。\n\n```\nvizAid sort rank =\nvar NoOfParameter = [No of Sales\
  \ Territories Value]\nvar tableSelectedSalesTerritories = VALUES('Dimension City'[Sales\
  \ Territory])\nvar tableWithRanks =\nFILTER(\nADDCOLUMNS(\ntableSelectedSalesTerritories\n\
  ,\"rank\",[_Rank]\n)\n,[rank]  NoOfParameter, NoOfParameter + 1, BLANK()))\n)\n\
  return\nsumx(\nFILTER(\nTableToSort\n,[axis] in VALUES('Sales Territory and other\
  \ - unrelated'[Sales Territory])\n)\n,[rank]\n)\n清单 8-8\n最终解决方案 – 排序\n```\n\n清单\
  \ 8-8 中的大部分 DAX 代码已经解释过。因此，这里仅提供一个简短的总结：\n\n-   将 Top N 参数值存储到一个变量中。\n-   存储当前筛选上下文中存在的已选销售区域。\n\
  -   将 Top N 销售区域存储到一个表中。\n-   通过使用 `UNION(…, ROW(…))` 创建一个包含“其他”坐标轴行的表。为确保坐标轴值“其他”始终显示在底部，将变量\
  \ `NoOfParameter` 的值加一。\n-   将筛选后的表映射到对应的坐标轴值。\n\n基本上，定义度量值本身并不困难，困难的是应用该度量值以实现对条形图的正确排序。因此，我们必须知道，坐标轴值的排序也可以由用作工具提示的度量值来控制。图\
  \ 8-15 展示了如何配置排序。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig15_HTML.jpg](img/471413_1_En_8_Fig15_HTML.jpg)\n\
  \n**图 8-15** – 非相关表 – 通过工具提示排序\n\n该度量值必须分配给条形图的工具提示。然后，需要相应地配置视觉对象的排序选项。\n\n###\
  \ 使用切片器进行动态度量值选择\n\n除了将剩余列值动态分组到名为“其他”的坐标轴值之外，另一个非常常见的需求是使用切片器选择来应用度量值。\n\n####\
  \ 任务\n\n创建一个报表页面，该页面提供一个下拉菜单，用于选择度量值，该度量值将应用于报表页面上的所有视觉对象。\n\n上述任务的实现将在报表页面“USING\
  \ SUMX – final”中进行演示。\n\n### 说明\n\n本节内容参考了 Power BI 文件“CH08 – unrelated tables.pbix”中的报表页面“Using\
  \ SUMX – final”。\n\n与上一章中使用的包含销售区域的非相关表类似，此解决方案从创建一个非相关表开始。这次，该表仅包含用户可选择的度量值（参见清单\
  \ 8-9）。\n\n```\nMeasure Table =\nUNION(\nROW(\"Slicer\" , \"Profit\")\n, ROW(\"\
  Slicer\" , \"Quantity\")\n)\n清单 8-9\n非相关度量值表\n```\n\n除了非相关表，还需要创建一个度量值。该度量值的定义如清单\
  \ 8-10 所示。\n\n```\nMeasure Table SelectedValue =\nvar theSelectedMeasure = SELECTEDVALUE('Measure\
  \ Table'[Slicer], \"Default\")\nreturn\nSWITCH(theSelectedMeasure\n, \"Profit\"\
  \ , [Total Profit]\n, \"Quantity\" , [Total Quantity]\n, [Total Quantity]\n)\n清单\
  \ 8-10\n选中的度量值\n```\n\n根据从切片器中选择的值，度量值将相应地计算。如果从切片器中未选择任何值或选择了多个值，则计算默认使用度量值 `Total\
  \ Quantity`。\n\n由于度量值 `_dynamic content SUMX` 使用排名度量值 `_Rank` 来相应地选择销售区域，因此也有必要调整现有的度量值。为了进行比较，定义了第二个排名度量值。清单\
  \ 8-11 展示了该度量值的定义。\n\n```\n_Rank final =\nRANKX(\nALLSELECTED('Dimension City'[Sales\
  \ Territory])\n, CALCULATE([Measure Table SelectedValue])\n,\n, DESC\n)\n清单 8-11\n\
  最终解决方案 – Rank final\n```\n\n度量值 `_Rank final` 引用了度量值 `Measure Table Selected Value`。此引用确保从切片器选择的度量值将在当前筛选上下文中进行计算。\n\
  \n### 说明\n\n实际上，切片器选择并非真正“选择”了一个度量值；而是度量值“响应”了切片器的选择。\n\n上述度量值（清单 8-10 和 8-11）被用于清单\
  \ 8-12 所示的度量值 `_dynamic content SUMX final` 中。由于该度量值基本上是前面已详细解释过的度量值的副本，因此此处仅突出显示使用上述度量值的行。\n\
  \n```\n_dynamic content SUMX final =\nvar NoOfParameter = [No of Sales Territories\
  \ Value]\nvar SelectedSalesTerritories = VALUES('Dimension City'[Sales Territory])\n\
  var tableWithRank =\nFILTER(\nADDCOLUMNS(\nSelectedSalesTerritories\n, \"rank\"\
  ,[_Rank final]\n)\n, [rank]  \"Other\"\n, CALCULATE([Measure Table SelectedValue]\
  \ , 'Dimension City'[Sales Territory] = thisCategory)\n, measureValueOther\n)\n\
  )\nreturn\nSUMX(\nFILTER(\ntableToIterate\n, 'Sales Territory and other - unrelated'[Sales\
  \ Territory] in VALUES('Sales Territory and other - unrelated'[Sales Territory])\n\
  )\n, [theValue]\n)\n清单 8-12\n最终解决方案 – 最终度量值\n```\n\n### 警告\n\n我们必须始终牢记，每个有助于使报表更易于用户使用的功能都是有代价的，那就是**性能**！因此，我们必须谨慎地实现这些功能。\n\
  \n## 颜色：使用颜色强调数据的含义\n\n微软已宣布 DAX 可用于操作视觉对象的每个属性。通过使用 DAX 更改视觉对象属性的能力，将为报表设计增添巨大威力。这很简单，因为视觉属性有助于强调报表的内容。由于该功能的实现将跨越几个\
  \ Power BI Desktop 版本，因此这里无法涵盖所有可能性。部分视觉属性已在之前的章节中使用过。因此，本章仅专注于实现一个热力图，该热力图允许为特定产品使用自定义颜色。相关公告可在此处找到：[`https://docs.microsoft.com/en-us/business-applications-release-notes/April19/business-intelligence/power-bi-desktop/expression-based-formatting`](https://docs.microsoft.com/en-us/business-applications-release-notes/April19/business-intelligence/power-bi-desktop/expression-based-formatting).\n\
  \n### 说明\n\n在本节中，将使用 Power BI 文件“CH08 – color gradients.pbix”。\n\n#### 任务\n\n创建一个表格热力图，为每个产品使用配置的颜色；如果未配置颜色，则使用默认颜色。颜色必须在渐变刻度上可视化，其中较高的百分比值将导致较深的颜色，意味着值\
  \ 100% 将显示配置的产品颜色。\n\n\n\n### 成果：DIY 热力图（更复杂的热力图）\n\n本章将介绍一些关于色彩理论、将十六进制值转换为 RGB\
  \ 值（以及反向转换）的内容，同时也会涉及一些 DAX。本章会从成果入手，揭示结合使用 Power BI 和 DAX 能实现什么。图 8-15 将展示热力图的第一印象。\n\
  \n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig16_HTML.jpg](img/471413_1_En_8_Fig16_HTML.jpg)\n\
  \n**图 8-16** 颜色渐变——第一印象\n\n很可能（非常非常有可能）图 8-16 展示的只是一个带有不同灰度阴影的图表。只需打开 pbix 文件 `CH08\
  \ – color gradient.pbix`，选择报表页 `Matrix visual`，然后从切片器中选择一个产品即可。\n\n#### 注意\n所用数据模型可能不符合您对数据模型的期望。请将此\
  \ pbix 文件视为开发热力图的一个草图本。在后续章节中，将详细解释每个表。\n\n注意：后续所有章节都将使用 `factored color background`\
  \ 度量中的代码行。\n\n### 色彩理论简介\n\n由于本书是关于 DAX 的，而非色彩理论，因此仅用到了最少量的必要信息。\n\n#### 十六进制颜色与\
  \ RGB\n\n通常，颜色信息使用十六进制值编码，例如，十六进制代码 `#b34529` 编码了一种红褐色等。要开始使用颜色，有许多在线资源可用，例如 [`www.w3schools.com/colors/colors_picker.asp`](http://www.w3schools.com/colors/colors_picker.asp)。\n\
  \n请注意，如果缺乏信息设计经验，上述网站并不能帮助你创建出色的报表。不过，了解前述十六进制代码中每两个字符代表 RGB 色轮中的一种颜色，这一点很有用：\n\n\
  - `B3` ➔ R(红) ➔ R: 179\n- `45` ➔ G(绿) ➔ G: 69\n- `29` ➔ B(蓝) ➔ B: 49\n\n以下 DAX 语句行展示了如何将给定的十六进制代码转换为\
  \ RGB 分量：\n\n```\nvar startcolor = --\"#f45f42\"\nIF(HASONEVALUE('Dimension Product'[Dim\
  \ Product])\n,FIRSTNONBLANK('Dimension Product'[Report Color],0)\n,\"#808080\"\n\
  )\nvar thepercentagevalue = CALCULATE([simple measure])\nvar startR = mid(startcolor,\
  \ 2,2)\nvar startG = mid(startcolor, 4,2)\nvar startB = mid(startcolor, 6,2)\nvar\
  \ resultR =\nvar poweroneStartR = LOOKUPVALUE('hex2dec'[dec],hex2dec[hex],left(startR,1))\n\
  var powerzeroStartR = LOOKUPVALUE('hex2dec'[dec],hex2dec[hex],right(startR,1))\n\
  var intStartR = poweroneStartR * POWER(16,1) + powerzeroStartR * power(16, 0)\n\
  return intStartR\n```\n\n上述代码行执行的操作如下：\n\n1. 获取为给定产品配置的颜色。如果未配置颜色或未筛选产品，则使用默认颜色\
  \ `#808080`。\n2. R(红)部分被存储到变量 `startR` 中……\n3. 计算整数值并存储到变量 `resultR` 中。为了计算整数值，使用\
  \ `hex2dec` 表来查找由十六进制值 0-9 和 A-F 解码出的整数值。\n\n步骤 2 对 G 和 B 部分重复执行。\n步骤 3 对 G 和 B\
  \ 部分重复执行，即使在前面的 DAX 代码行中只显示了 R(红)部分也是如此。\n\n图 8-17 展示了 `Dimension Product` 表的内容。\n\
  \n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig17_HTML.jpg](img/471413_1_En_8_Fig17_HTML.jpg)\n\
  \n**图 8-17** 颜色渐变—— `Dimension Product` 表\n\n`Dimension Product` 表的内容是通过使用 `输入数据`\
  \ 功能创建的。这使得你可以使用企业标识中的默认颜色轻松测试热力图。只需打开 Power Query，选择 `Dimension Product` 表，点击齿轮图标，然后更改颜色即可。请使用\
  \ `#` 作为第一个字符，并确保输入的是有效颜色（`#zzzzzzz` 不是有效颜色）。图 8-18 展示了如何调整已配置的产品颜色。\n\n![../images/471413_1_En_8_Chapter/471413_1_En_8_Fig18_HTML.jpg](img/471413_1_En_8_Fig18_HTML.jpg)\n\
  \n**图 8-18** 颜色渐变——更改产品颜色\n\n#### 颜色分解\n\n颜色分解对于创建基色（即从 `Dimension Product` 表中获取的颜色）的渐变色是必要的。以下代码行展示了\
  \ R(红)部分的实现过程：\n\n```\nvar factoredColorR =\nvar factorizedR = ROUND((resultR -\
  \ 255) * thepercentagevalue + 255,0)\nvar intR = factorizedR\nvar divR = intR/16\n\
  var hexPowerR1 = LOOKUPVALUE('hex2dec'[hex],hex2dec[dec],TRUNC(divR))\nvar hexPowerR0\
  \ = LOOKUPVALUE('hex2dec'[hex],hex2dec[dec],round((divR-TRUNC(divR)),0))\nreturn\
  \ CONCATENATE(hexPowerR1,hexPowerR0)\n```\n\n上述算法源自维基百科文章 [`www.rapidtables.com/convert/color/rgb-to-hsl.html`](http://www.rapidtables.com/convert/color/rgb-to-hsl.html)（提供理论基础）和文章\
  \ [`www.rapidtables.com/convert/color/rgb-to-hsl.html`](http://www.rapidtables.com/convert/color/rgb-to-hsl.html)（更侧重于实践）。\n\
  \n最后，使用下面这行简单的代码将三个变量拼接在一起：\n\n```\n\"#\" & factoredColorR & factoredColorG & factoredColorB\n\
  ```\n\n度量 `thepercentagevalue` 被传递给此度量，并根据 `thepercentagevalue` 的值来“分解”基色。\n\n##\
  \ 结语\n\n本章要展示的是：DAX 可以用来开发甚至很复杂的算法。与 `Quantity * Price` 的计算相比，颜色分解是一个复杂得多的算法。\n\n\
  此外，表、列和行在复杂算法的开发以及 DAX 语句的扩展/测试中，将发挥更重要的作用。关于这些表的更详细用法，请参见第 14 章“扩展您的模型”。\n\n"
- '# 9. 时间智能




  ## 引言


  早在 1582 年，教皇格里高利十三世引入格里高利历法以更新之前使用的儒略历时，他心中可并没有考虑商业智能报告。这套古怪的历法仍然包含：


  - 天数不等的月份——28、29、30 和 31 天

  - 与历法年份或月份不对齐的 7 天星期模式

  - 闰年


  新历法的主要目的是阻止复活节每年偏离春分时间，而非通过将日期对齐成易于比较的区块，来提供一种简洁统一的归类方法。


  新系统改变了闰年的计算方式。从每四年在二月增加一天，变为仅当年份能被四整除时才增加额外一天，除非该年份也能被 100 整除——但如果该年份还能被 400 整除，则无论前条规则如何，仍然增加一天。这听起来合理且容易记住吗？我敢肯定，这套系统是由某个拥有*项目经理*头衔的人设计的。


  这套历法并未受到普遍欢迎。1752 年在英国，街头挤满了抗议新历法的暴乱者。一些历史学家认为，暴乱者是清教徒，他们将这套历法视为天主教的阴谋，但我怀疑这更多是因为他们预见到，这套历法将对后代的数据建模者造成怎样的混乱。


  当然，一个更为合理的解决方案是引入一套基于 10 天一周的十进制系统，一年定为 100 天（或 10 周）。预期寿命将在一夜之间增长三倍以上，这是任何医学突破（如疫苗的发现或卫生条件的改善）在漫长历史中都难以企及的高度。


  此外，一旦人类停止纷争，集中精力掌握真正的太空旅行和探索，*Seamark 历法*（十进制）的出现就不可避免了。像月份和季度这样令人困惑的结构，在这套大幅改进的历法中将没有立足之地。


  在那之前，我们只能凑合着使用充满古怪之处的格里高利历法。为了让数据建模和使用`DAX`的工作更轻松，该语言提供了一系列函数，帮助以某种合理组织现代历法的方式，对天数进行组织、分类和分组。


  关于`DAX`中的日期，一个有用的小知识是：它们在`DAX`引擎内部是以整数形式存储的。为了说明这一点，请考虑清单 9-1 中的以下计算表，其结果显示在图 9-1
  中。


  清单 9-1 中的计算生成一个介于负五和正五之间的数字列表，步长为 1。这一系列数字从第一列克隆到第二列，然后经过格式化以日期格式显示。


  ```

  日期表 =

  ADDCOLUMNS(

  GENERATESERIES(-5,5),

  "我的日期格式",FORMAT([值],"长日期")

  )

  清单 9-1

  计算表展示了以整数和日期格式显示的相同数字

  ```


  ![../images/471413_1_En_9_Chapter/471413_1_En_9_Fig1_HTML.jpg](img/471413_1_En_9_Fig1_HTML.jpg)


  图 9-1 显示了清单 9-1 中代码的输出结果


  请注意，第六行中的零值被分配为 1899 年 12 月 30 日星期六，而该日期前后的日历天数仅仅是相对于这个基准日期的正负差值。


  底层的数值-693,593 代表公元 1 年 1 月 1 日。根据`DAX`对格里高利历法的解释，这一天是星期一，这为支持星期一而非星期日应被视为日历周真正起始的观点提供了论据。☺


  ### 注释


  1899 年 12 月 30 日之前的日期（负序列号）并非官方支持，因为某些`DAX`日期/时间函数/操作在这些较早日期上不起作用。


  如果你尝试将`DateTime`值操作到公元 1 年 1 月 1 日之前，`DAX`中的计算会抛出错误，但它允许你在基准日期上增加近 300 万天，从而到达 9999
  年 12 月 31 日。9999 年 12 月 31 日恰好是星期五，这对一场可能非常盛大的派对来说是个理想的日子。不过，请记住，在此日期之前，基于十进制系统的
  Seamark 历法很可能早已开始使用。


  介于-657,435 和 2,958,465 之间的每个日期都被分配了有用的属性，例如年份、月份、星期名称等，这些属性为基于时间的报告提供了多种对天数进行分组的方式。


