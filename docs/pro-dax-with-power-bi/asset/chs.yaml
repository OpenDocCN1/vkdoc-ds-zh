- "# 10. 寻找缺失的数据\n\n## 引言\n\nDAX 最明显的应用领域之一是计算基于现有数据的度量值，例如，计算返回随时间累积值的度量值。一个可能在使用\
  \ DAX 时不会首先想到的领域是发现缺失的数据。“缺失的数据”——诚然——听起来有些模糊；因此，需要更详细地解释。这些缺失的数据之一，例如，是停止购买的客户。\n\
  \n本章将介绍如何找到这些缺失的数据，首先从识别停止购买的客户的简单介绍开始。然后介绍如何识别事件之间的间隔、计算间隔数量以及确定每个间隔的长度。\n\n最后，区分了计算前一个值（这里基本上没有缺失，因此是容易的部分）和查找最后一行，此时突然出现了缺失的索引。\n\
  \n## 月亏与月盈\n\n这背后的问题是：“哪些客户在上一个期间购买了商品，但在当前期间没有再次购买？”如果将其可视化，这就会变得清晰得多。为此，图 10-1\
  \ 显示了基础情形，后续图表展示了如何回答这个问题。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig1_HTML.png](img/471413_1_En_10_Fig1_HTML.png)\n\
  \n**图 10-1** 非回头客户基础情形\n\n图 10-1 中的左侧圆圈表示过去曾购买过的客户。右侧圆圈则表示在当前期间有购买的客户。对于“哪些客户在当前期间没有购买，但在过去期间有购买？”这一问题的概念性答案，如图\
  \ 10-2 所示。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig2_HTML.png](img/471413_1_En_10_Fig2_HTML.png)\n\
  \n**图 10-2** 非回头客户（月亏）\n\n为简化表述，我们将代表在当前期间未购买的客户的圆圈形状称为*月亏*。这意味着过去有比今天更多的客户（项目）。相反的问题“哪些客户刚刚在当前期间购买了商品，但在上一期间没有？”也可以用同样的方式可视化。图\
  \ 10-3 展示了*月盈*，或者更简单地说，*新客户*，即那些在当前期间有购买但在上一期间没有购买的客户。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig3_HTML.png](img/471413_1_En_10_Fig3_HTML.png)\n\
  \n**图 10-3** 新客户（月盈）\n\n要回答上述两个问题，需要识别两组客户：\n\n- 上一个期间的客户\n- 当前期间的客户\n\n根据两组客户的组合方式，可以识别出非回头客户，也可以识别出新客户。下一节将展示如何回答这两个问题。\n\
  \n#### 注意\n\n本节引用的 pbix 文件为`CH 10 Waning and Waxing moon`。\n\n### 新客户：月盈\n\n本章展示如何计算与上个月相比在当前月份中没有购买过的客户数量。\n\
  \n为确定在过去期间未购买的客户数量，使用了以下度量值（参见列表 10-1）。\n\n```dax\nNo of New Customer =\nvar theseCustomers\
  \ = VALUES('Fact Sale'[Customer Key])\nvar theMonthBefore = SELECTEDVALUE('Dimension\
  \ Date'[RunningMonthIndex]) - 1\nvar theseCustomerBeforeCurrentMonth =\nCALCULATETABLE(VALUES('Fact\
  \ Sale'[Customer Key]),FILTER(ALL('Dimension Date'[RunningMonthIndex]),'Dimension\
  \ Date'[RunningMonthIndex] = theMonthBefore ),ALL('Dimension Date'))\nreturn\nCOUNTROWS(EXCEPT(theseCustomers,theseCustomerBeforeCurrentMonth))\n\
  ```\n\n**列表 10-1** `No of New Customer`\n\n这个度量值背后的思路相当简单：只需找出所有在当前期间之前的各个期间有购买的客户。这些客户存储在表变量`theseCustomerBeforeCurrentMonth`中。所有在当前期间有购买的客户存储在变量`theseCustomers`中。使用`EXCEPT`，可以很容易地找出所有在之前所有期间都没有购买的客户。\n\
  \n### 缺失的客户：月亏\n\n要找出在当前期间未购买的客户数量，可以使用与计算新客户数量相同的度量值。只是有一个小变动：传递给`EXCEPT`函数的表的顺序被颠倒了。\n\
  \n\n\n## 至少一次，或者每次：一致性衡量指标\n\n通常，随着时间的推移保持一致性被视为一件好事，尤其是当积极体验能与这段时间相关联时。检测一致性的缺失，或者更妙的是，在一致性开始消失时就察觉它，有助于避免产生负面体验。\n\
  \n为简化起见，一致性定义如下：在过去的 6 个月中，客户必须至少购买过四次商品。如果客户在过去两个月内没有任何购买行为，一致性就面临风险。图 10-4 展示了一致性各种状态示意图。\n\
  \n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig4_HTML.jpg](img/471413_1_En_10_Fig4_HTML.jpg)\n\
  \n**图 10-4** 一致性状态\n\n清单 10-2 展示了度量值 `State of consistency`。\n\n```\nState of Consistency\
  \ =\nvar DateMax = MAX('Dimension Date'[Date])\n// 上个月末\nvar DateEndOfPrevMonth\
  \ =\nEOMONTH(\nDATE(YEAR(DateMax) , MONTH(DateMax) - 1, 1) ,0)\n// 过去 6 个月\nvar\
  \ DateStartOfRange =\nDATE(YEAR(DateMax) , MONTH(DateMax) - 6, 1)\nvar filtertableconsistencyrange\
  \ =\nDATESBETWEEN(\n'Dimension Date'[Date]\n, DateStartOfRange\n, DateEndOfPrevMonth\n\
  )\nvar consistencymayfade =\nIF(\nCOUNTROWS(\nCALCULATETABLE(\nSUMMARIZE(\n'Fact\
  \ Sale'\n, 'Dimension Date'[Calendar Month Number]\n)\n, filtertableconsistencyrange\n\
  )\n)\n< 4 , 1 , BLANK()\n)\n// 过去 2 个月\nvar DateStartOfRangeEndangerd =\nDATE(YEAR(DateMax)\
  \ , MONTH(DateMax) - 2, 1)\nvar filtertableconsistencyendangered =\nDATESBETWEEN(\n\
  'Dimension Date'[Date]\n, DateStartOfRangeEndangerd\n, DateEndOfPrevMonth\n)\nvar\
  \ consistencyendangerd =\nIF(\nCOUNTROWS(\nCALCULATETABLE(\nSUMMARIZE(\n'Fact Sale'\n\
  , 'Dimension Date'[Calendar Month Number]\n)\n, filtertableconsistencyendangered\n\
  )\n)\n< 2 , 1 , BLANK()\n)\nreturn\nIF(consistencyendangerd = 1 , 3 , IF(consistencymayfade\
  \ = 2 , 2 , 1))\n```\n\n**清单 10-2** 一致性状态\n\n其工作原理如下：\n\n-   确定一个筛选表 `filtertableconsistencyrange`，它包含过去\
  \ 6 个月的所有日期。\n-   如果被该筛选表筛选后的 `Fact Sale` 表中可用的月份数少于 4，则返回值 1，并存储在变量 `consistencymayfade`\
  \ 中。\n-   确定一个筛选表 `consistencyendangerd`，它包含过去 2 个月的所有日期。\n-   如果被该筛选表筛选后的 `Fact\
  \ Sale` 表中可用的月份数少于 2，则返回值 1，并存储在变量 `consistencyendangerd` 中。\n-   最后，返回一个数值：3 表示“一致性面临风险”状态，2\
  \ 表示“可能消失”状态，1 表示“一致”状态。\n\n度量值 `State of consistency` 被用在清单 10-3 所示的度量值 `State\
  \ of consistency – Customer` 中。\n\n```\nState of Consistency - Customer =\nMAXX(\n\
  VALUES('Dimension Customer'[Customer Key])\n, [State of Consistency]\n)\n```\n\n\
  **清单 10-3** 客户一致性状态\n\n度量值 `State of Consistency` 遍历每个客户，并返回度量值 `State of Consistency`\
  \ 的最大值。这使得当在像矩阵可视化（如图 10-5 所示）这样的层次结构视图中使用该度量值时，能够将状态“向上冒泡”。图 10-5 中展示的矩阵可视化可在“在过去每个月份均未购买”报表页上找到。\n\
  \n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig5_HTML.jpg](img/471413_1_En_10_Fig5_HTML.jpg)\n\
  \n**图 10-5** 一致性状态 – 向上冒泡\n\n仅仅进行简单计数的度量值，如果以一种更具创意的方式使用，例如，基于计数的行来推导状态，也能提供巨大的洞察。\n\
  \n### 事件序列或事件缺失\n\n在某些情况下，了解缺失的事件被视为有价值的信息。有时，这些信息比测量到的信息（即有数据可查的信息）更有价值。例如，缺失的事件可以看作缺失的订单。因此，不仅要分析可用的信息，还要分析那些未发生的事件。了解客户不活跃的持续时间，可以引发防止客户流失的行动。\n\
  \n这里只考虑与日期相关的序列，由于如果这些序列用整数值而不是日期或日期时间数据类型来表示，序列的计算通常会简单得多，因此我们将这些整数值添加到日历表中。由于日历表从\
  \ 2013 年 1 月 1 日开始，到 2016 年 12 月 31 日结束，针对前面的文本，一个例子就是为月份创建一个整数。这意味着 2013 年 1 月的所有日期都将被索引为数字\
  \ 1，2014 年 1 月的所有日期被索引为数字 13，最后，2016 年 12 月的所有日期被索引为值 48。\n\n清单 10-4 显示了在 `Dimension\
  \ Date` 表中创建计算列的 DAX 语句。\n\n```\nRunningMonthIndex =\nvar minYear = YEAR(MIN('Dimension\
  \ Date'[Date]))\nvar thisYear = YEAR('Dimension Date'[Date])\nreturn\n(thisYear\
  \ - minYear) * 12 + MONTH('Dimension Date'[Date])\n```\n\n**清单 10-4** `RunningMonthIndex`\n\
  \n该 DAX 语句内部的基本逻辑是：\n\n-   使用 `YEAR(MIN(...))` 确定日历表中的起始日期，提取起始年份，并将该值存储在变量 `minYear`\
  \ 中。\n-   从当前行的日期列中提取年份，并将该值存储在变量 `thisYear` 中。\n-   使用简单的数学计算得出表示月份的整数索引。\n\n使用月份只是为了简化。根据业务类型、销售的产品或许多其他原因，考虑最合适的时间范围可能是一项非常复杂的任务，但也可能更具启发性。当不能预期每个客户或每个产品都以相同的频率销售时，这些考量是必要的。\n\
  \n\n\n### 说明\n\n本部分参考的是 pbix 文件 `“CH 10 Waning and Waxing moon.”`\n\n清单 `10-5` 展示了度量值\
  \ `SEQ – length of gap`。\n\n```\nSEQ - length of gap =\nvar maxRunningMonthIndex\
  \ =\nCALCULATE(\nMAX('Dimension Date'[RunningMonthIndex])\n, ALL('Dimension Date')\n\
  )\nvar abt =\nADDCOLUMNS(\nADDCOLUMNS(\nSUMMARIZE(\n'Fact Sale'\n,'Dimension Customer'[Customer\
  \ Key]\n,'Dimension Date'[RunningMonthIndex]\n)\n, \"nxtMonth\" ,\nvar thisRunningMonth\
  \ = 'Dimension Date'[RunningMonthIndex]\nvar nxtRunningMonthFromFact =\nCALCULATE(\n\
  FIRSTNONBLANK('Dimension Date'[RunningMonthIndex],[Total quantity])\n, ALL('Dimension\
  \ Date')\n, 'Dimension Date'[RunningMonthIndex] > thisRunningMonth\n)\nreturn\n\
  IF(NOT(ISBLANK(nxtRunningMonthFromFact)) , nxtRunningMonthFromFact , maxRunningMonthIndex)\n\
  )\n,\"length of gap\",\nvar l = [nxtMonth]-[RunningMonthIndex] - 1\nreturn\nIF(l\
  \ = 0 , BLANK() , l)\n)\nreturn\nSUMX(\nabt\n, [length of gap]\n)\n清单 10-5\n序列 –\
  \ 间隔长度\n```\n\n具体逻辑如下：首先创建一个汇总表，其中包含 `Customer Key` 和 `RunningMonthIndex` 列的所有有效组合（即存在于\
  \ `Fact Sale` 表中的组合）。\n\n这是通过以下 DAX 实现的：\n\n```\nSUMMARIZE(\n'Fact Sale'\n, 'Dimension\
  \ Customer'[Customer Key]\n, 'Dimension Date'[RunningMonthIndex]\n)\n```\n\n使用 `ADDCOLUMNS`\
  \ 为表添加 `nxtMonth` 列。该列通过 `FIRSTNONBLANK` 查找下一个月份索引。必须使用 `CALCULATE` 将 `ADDCOLUMNS`\
  \ 引入的现有行上下文转换到新的筛选上下文中，并将 ` Customer Key` 列的值添加到新的筛选上下文。这是通过以下 DAX 完成的：\n\n```\n\
  CALCULATE(\nFIRSTNONBLANK(\n'Dimension Date'[RunningMonthIndex]\n, [Total quantity]\n\
  )\n, ALL('Dimension Date')\n, 'Dimension Date'[RunningMonthIndex] > thisRunningMonth\n\
  )\n```\n\n结果存储在变量 `nxtRunningMonthFromFact` 中。此步骤是为了避免出现负值。如果不存在下一个值，则在本例中，将使用最新的索引。\n\
  \n然后，通过简单的数学计算，得出下一个月与当前月之间的差值；这将返回以月为单位的间隔长度。\n\n最后，结合迭代器函数 `SUMX` 使用该表，该函数将计算所有间隔的总和。\n\
  \n第二个度量值 `SEQ – no of gaps` 的基本逻辑相同，唯一区别在于它统计的是间隔数量。\n\n图 `10-6` 显示了一个简单表格。\n\n\
  ![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig6_HTML.jpg](img/471413_1_En_10_Fig6_HTML.jpg)\n\
  \n图 10-6  \nSEQ 表\n\n这两个度量值都可以看作是分析缺失事件的开端。\n\n## 缺失的索引\n\n寻找前一行的任务与上述类似但又有所不同。需要解决的问题是找到前一行。即使这听起来与寻找前一个值相似，但实际并非如此。在大型数据集中找到前一行并非易事。为此，有必要先解释一下两者的区别。\n\
  \nDAX 经常与其他查询语言（如 SQL 或 MDX）进行比较。在有些比较中，DAX 性能更优，而在另一些比较中则不然。DAX 不提供与 T-SQL 窗口函数（如\
  \ `ROW_NUMBER`、`LAG` 或 `LEAD`）类似的功能。这些函数功能强大，可以对一组行进行编号（这与提供排名不同）。`LAG` 和 `LEAD`\
  \ 允许在行之间进行导航，例如，查找前一行或后一行。\n\n有时，需要在更复杂的度量值中计算前一个值，例如，计算同比 (YoY) 比较。\n\n有时，需要找到前一行，例如，为了确定逐行的变化。\n\
  \n尽管这两个任务看起来相似，但它们并不相同。必须能够区分这两个任务。因此，接下来的两节将更详细地解释这些任务。\n\n### 前一个值\n\n如果能够从给定的上下文中确定前一个值，那么这就属于前一个值问题。\n\
  \n图 `10-7` 将展示其含义。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig7_HTML.jpg](img/471413_1_En_10_Fig7_HTML.jpg)\n\
  \n图 10-7  \n前一个值\n\n清单 `10-6` 展示了如何从给定的筛选上下文中推导出筛选前一个日期范围所需的日期范围。\n\n```\nPrevious\
  \ Date Range Total Quantity =\nvar DateRangeStart = [DateStart]\nvar DateRangeLength\
  \ = DATEDIFF([DateStart] , [DateEnd] , DAY)\nvar PrevDateRangeEnd = DateRangeStart\
  \ - 1\nvar PrevDateRangeStart = PrevDateRangeEnd - DateRangeLength\nvar PrevDateRange\
  \ = DATESBETWEEN('Dimension Date'[Date] ,  PrevDateRangeStart , PrevDateRangeEnd)\n\
  return\nCALCULATE(\n[Total Quantity]\n, PrevDateRange\n)\n清单 10-6\n前一个日期范围的总数量\n\
  ```\n\n筛选表 `PreDateRange` 的内容无需任何额外的表扫描即可确定，只需“调整”给定的筛选上下文即可。\n\n### 前一行\n\n确定前一行的问题将通过表格\
  \ `Fact Sale`（参见图 `10-8`）中的 `Sale Key` 列进行演示。\n\n### 警告\n如果你使用的是附带的 pbix 文件 `“CH\
  \ 10 – Finding whats not there.pbix”`，请确保已选择 `Customer Key`。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig8_HTML.jpg](img/471413_1_En_10_Fig8_HTML.jpg)\n\
  \n图 10-8  \n前一行\n\n一种简单的方法是直接通过当前 `Sale Key` 减 1 来确定前一行：\n\n`PreviousRow(SaleKey:\
  \ 9334) = 9334 – 1 = 9333`\n\n其复杂性在图 `10-9` 中表现得更加明显。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig9_HTML.jpg](img/471413_1_En_10_Fig9_HTML.jpg)\n\
  \n图 10-9  \n前一行 – 更复杂的情况\n\n图 `10-9` 显示，除了 `Customer Key` 列的值之外，还必须考虑 `Stock Item\
  \ Key` 列的值才能确定前一行。\n\n#### 查找前一行：使用 DAX\n\n要使用 DAX 查找前一行，有必要理解完成该任务需要执行哪些步骤。\n\n\
  在这个例子中，使用表 `Fact Sale` 中的 `Sale Key` 列，因为这些值可用于标识每一行。\n\n由于这不是一个简单的方法，所使用的解决方案还考虑了\
  \ `Customer Key`。图 `10-10` 显示了一个概念性的小表格，以帮助理解这些步骤。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig10_HTML.jpg](img/471413_1_En_10_Fig10_HTML.jpg)\n\
  \n图 10-10  \n前一行 – 概念\n\n*   创建一个用于迭代的表。\n    在当前的筛选上下文中，`Customer Key` 和 `Sale\
  \ Key` 的可用的组合。\n*   确定前一个 `Sale Key`。\n    前一个 `Sale Key` 是当前 `Sale Key` 之前的最接近的\
  \ `Sale Key`。\n    将使用当前迭代中的当前 `Sale Key` 来查找所有小于当前 `Sale Key` 的 Sale Key。当前 `Sale\
  \ Key` 之前最接近的 `Sale Key` 是所有小于当前 `Sale Key` 的 `Sale Key` 中的 `MAX(‘…’[Sale Key])`。\n\
  *   检索前一个值。\n    使用前一个 `Sale Key` 来筛选 `Fact Sale` 表，从而检索前一个值。\n\n\n\n#### 注意\n\n\
  在将 10-7 清单中的度量值“上一笔销售价值”添加到 Power BI 文件“CH 10 查找不存在的项.pbix”的报告页“上一行”的表中之前，请确保`客户密钥`切片器仅选择了单个`客户密钥`。\n\
  \n下一个清单，即 10-7，展示了一个用于查找上一行的“仅限 DAX”解决方案。其强制性要求是存在一个唯一标识符，以便能够找到上一行。\n\n```\nprevious\
  \ sale value =\nvar t =\nADDCOLUMNS(\nFILTER(\nSUMMARIZE(\n'Fact Sale'\n, 'Dimension\
  \ Customer'[Customer Key]\n, 'Fact Sale'[Sale Key]\n)\n, [Customer Key]  0 // 客户密钥\
  \ 0（未知）不予考虑\n)\n, \"thePrevQuantity\" ,\nvar currentSaleKey = [Sale Key]\nvar prevsalekey\
  \ =\nMAXX(\nFILTER(\nCALCULATETABLE(\nVALUES('Fact Sale'[Sale Key])\n, ALL('Fact\
  \ Sale'[Sale Key])\n)\n, 'Fact Sale'[Sale Key] < currentSaleKey\n)\n, 'Fact Sale'[Sale\
  \ Key]\n)\nvar prevQuantity =\nCALCULATE(\n[Total Quantity]\n, 'Fact Sale'[Sale\
  \ Key] =  prevsalekey\n)\nreturn prevQuantity\n)\nreturn\nSUMX(\nt\n, [thePrevQuantity]\n\
  )\n清单 10-7\n上一笔销售价值\n```\n\n以上清单将在下面进行更详细的解释。\n\n首先，所有可用的（在当前筛选上下文中的）`客户密钥`和`销售密钥`组合将通过以下\
  \ DAX 进行汇总：\n\n```\nSUMMARIZE(\n'Fact Sale'\n, 'Dimension Customer'[Customer Key]\n\
  , 'Fact Sale'[Sale Key]\n)\n```\n\n除此之外，还使用`FILTER`来排除`客户密钥`为 0 的情况，因为此密钥代表“未知”客户。\n\
  \n`ADDCOLUMNS`向表中添加了`thePrevQuantity`列。需要注意的是，`ADDCOLUMNS`是表迭代器函数之一。这意味着用于计算`thePrevQuantity`的表达式是在行上下文中求值的，该行上下文由`客户密钥`和`销售密钥`列决定。\n\
  \n此 DAX\n\n```\nCALCULATETABLE(\nVALUES('Fact Sale'[Sale Key])\n, ALL('Fact Sale'[Sale\
  \ Key])\n)\n```\n\n将当前`客户密钥`和`销售密钥`的组合，扩展为当前筛选上下文中当前`客户密钥`的所有销售密钥。这是因为`CALCULATETABLE`执行了以下操作：\n\
  \n-   将现有的筛选上下文克隆到一个新的筛选上下文中。\n-   将当前行上下文添加到新的筛选上下文中（针对每次迭代），同时阻止现有筛选（已存在于克隆的筛选上下文中）；可以这样理解：`客户密钥`和`销售密钥`列上的现有筛选被行上下文的列所替代。\n\
  -   在旧的筛选上下文中评估筛选表达式`ALL(...)`，并“替换”新筛选上下文中`销售密钥`列上已存在的筛选。\n-   在新上下文中评估第一个参数`VALUES('Fact\
  \ Sale'[Sale Key])`。\n\n此步骤的结果如图 10-11 所示。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig11_HTML.jpg](img/471413_1_En_10_Fig11_HTML.jpg)\n\
  \n图 10-11\n\n上一行 – 概念 – 展开\n\n然后，对上一步得到的结果表进行筛选，只保留销售密钥小于当前销售密钥（存储在变量`currentSaleKey`中）的所有行。结果如图\
  \ 10-12 所示。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig12_HTML.jpg](img/471413_1_En_10_Fig12_HTML.jpg)\n\
  \n图 10-12\n\n上一行 – 概念 – 筛选\n\n`MAXX`用于在由`FILTER(...)`返回的筛选表对象中查找最大值。这将返回上一个`销售密钥`。`MAXX`返回的标量值存储在变量`prevsalekey`中。最后，使用此变量检索上一个销售密钥的数量。\n\
  \n### 查找上一行：使用建模方法\n\n解决上一行问题的另一种方法是基于建模的方法，即使用一个已包含上一行值的附加表。此表必须在数据模型外部创建，例如，使用\
  \ Power Query 或——甚至更好——在源系统内部创建。这种方法有助于解决大数据集的性能问题。创建此表可能具有挑战性，但有助于克服大数据集的性能问题。该\
  \ pbix 文件包含表“`Fact Sale – Previous Value`”，该表已在 SQL Server 内部使用 10-8 清单中的 SQL 语句创建。强烈建议将此附加表对数据模型的最终用户“隐藏”，以避免混淆。\n\
  \n```\nselect\nf.[Customer Key]\n, f.[Sale Key]\n, f.[quantity]\n, LAG(f.[Sale Key]\
  \ , 1) over(partition by f.[Customer Key] order by f.[Sale Key] asc) as prevsaleeky\n\
  , LAG(f.[Quantity] , 1) over(partition by f.[Customer Key] order by f.[Sale Key]\
  \ asc) as prevquantity\nfrom\nFact.Sale as f\n清单 10-8\n使用 LAG 查找上一值的 T-SQL.sql\n\
  ```\n\n然后，通过使用`销售密钥`列在表`Fact Sale`和`Fact Sale – Previous Sale`之间建立关系，将此附加表集成到数据模型中。由于这些列在任一表中都是唯一的，Power\
  \ BI 会创建一个基数为“一对一 (1:1)”的关系。有必要将基数更改为“一对多 (1:*)”，并将表`Fact Sale`放在“一”侧，以充分利用筛选传播的速度。此关系如图\
  \ 10-13 所示。\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig13_HTML.jpg](img/471413_1_En_10_Fig13_HTML.jpg)\n\
  \n图 10-13\n\n上一行，基于事实表 – 关系\n\n可以使用如 10-9 清单所示那样简单的度量值来计算上一行的值。\n\n```\n上一笔销售价值\
  \ - 基于事实表 =\nSUM('Fact Sale - Previous Value'[prevquantity])\n清单 10-9\n上一笔销售价值 –\
  \ 基于事实表\n```\n\n使用建模方法具有巨大的性能优势。接下来的两个图表展示了这种性能优势。图 10-14 显示了使用仅限 DAX 的方法计算`客户密钥`\
  \ 2 及`客户密钥` 2–200 的上一行值的查询持续时间。图 10-15 显示了相同的情况，但使用了附加事实表`Fact Sale – Previous Value`。\n\
  \n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig15_HTML.jpg](img/471413_1_En_10_Fig15_HTML.jpg)\n\
  \n图 10-15\n\n上一行值，基于事实表\n\n![../images/471413_1_En_10_Chapter/471413_1_En_10_Fig14_HTML.jpg](img/471413_1_En_10_Fig14_HTML.jpg)\n\
  \n图 10-14\n\n上一行值，仅限 DAX\n\n在两个图表中，最底部的查询用于填充`客户密钥`切片器；1 毫秒的微小差异可以忽略不计。\n\n中间的那条线显示了`客户密钥`\
  \ 2 的上一行值的计算，即使这种差异看起来不大，因为两个查询都不到一秒就返回了答案。\n\n但最顶部查询之间的差异是巨大的。使用“仅限 DAX”的方法计算`客户密钥`\
  \ 2–200 的上一行值需要**近 8 秒钟**。\n\n而利用附加事实表的简单度量值在**不到 80 毫秒**内就返回了结果。这是一个巨大的性能提升。\n\n\
  \n\n#### 注意\n\n使用额外的事实表也有其缺点。由于该附加表与事实表具有相同的粒度，它自然会消耗额外的内存。创建额外的事实表也可能需要比前文中的 SQL\
  \ 语句复杂得多的语句，因为确定先前的 `Sale Key` 可能涉及比本例中使用的简单方法多得多的逻辑。\n\n对于如何处理前一行问题，并没有明确的答案，但希望这能证明，一个复杂且缓慢的\
  \ DAX 语句（或许）可以通过利用数据库引擎的所有底层能力（数据建模和 DAX）来简化。\n\n"
- "# 11. 行级安全性\n\n## 简介\n\n在某些时候，您可能会遇到这样的需求：创建一个报告，该报告需要根据查看报告的当前登录用户，提供特定的结果。一种场景是，不同的团队成员需要一个报告，该报告显示他们各自负责的项目的低层级细节，但阻止他们看到同一团队中其他成员的相同细节层。另一种场景可能是向组织外部的多个群体提供报告，确保访问报告的人只能看到他们应该看到的信息。\n\
  \n一种解决方案是创建数据模型的主副本，并根据需要制作尽可能多的克隆来满足所需的信息孤岛数量。每个克隆可以填充特定于某个用户或组织的数据，然后，每个报告仅提供给应该有权访问的用户。这种方法降低了数据泄露的风险。\n\
  \n然而，一旦数据孤岛数量超过少数几个，这种方法就会变得复杂且难以管理。当需要对模型中已有的计算进行修改或添加新的计算时，每个数据模型都需要被修改、测试、上传等等。使用这种方法需要注意的其他问题包括：数据刷新调度、模型大小，以及管理每个数据模型中控制仅导入适当数据的唯一代码。\n\
  \n幸运的是，还有一种替代方案：行级安全性 (RLS)。RLS 允许您将所有相关数据纳入一个数据模型中，并提供一个安全且健壮的过滤层来管理谁能看到什么。行级安全性的概念并不新鲜。SQL\
  \ Server Analysis Services 数据库长期以来一直提供行级安全性的概念，其多维和表格版本都提供了此类功能。\n\nPower BI Desktop\
  \ 和 Power BI Web 服务使用 SSAS 数据库的表格版本，微软理解并重视此功能对于组织管理其数据的关键性。\n\n在单个数据模型上配置 RLS 后，不同的用户可以访问同一个模型，但可以安全地防止他们看到不应该看到的数据。使用\
  \ RLS 的一些优势在于，当添加新的计算或更新现有计算时，只需在一个地方进行更改。管理单个模型在数据刷新、网关和大小调整等方面会变得容易得多。\n\n通过 RLS，可以定义规则，以多种不同的方式过滤数据。可以授予供应商访问数据模型的权限，以查看其产品的库存和销售数据，但不能查看同一模型中其他供应商或整个表（例如员工或财务数据）的数据。在多门店环境中，特定门店内的个人可以使用带有\
  \ RLS 的数据模型访问报告，并下钻到非常低级别的细节，以查看其门店的业绩，同时也可以看到其他门店的汇总信息，这些信息提供了有用的比较基准。其他门店的个人可以同时访问具有相同约束的同一数据模型。\n\
  \n组织内的员工可能需要访问模型中的特定数据，但不能访问敏感数据（财务、薪资）。其他人可能需要访问高级别的汇总数据，但被阻止下钻到可能暴露他们无需访问的敏感或个人身份信息的层级。而使用同一模型的其他人员则需要酌情全面访问细节。\n\
  \nRLS 非常灵活，足以满足您可能遇到的任何需求。RLS 规则的局限性未必是技术性的，更多的是在涉及大量复杂规则时的可管理性和可维护性——尤其是在规则冲突或重叠的情况下。\n\
  \n好消息是，用于配置 RLS 的规则都基于 DAX。RLS 规则被定义为 DAX 筛选表达式，可以像 `[Country] = \"USA\"` 一样简单，也可以像一个复杂、多层的语句系列，最终解析为布尔值\
  \ `true` 或 `false`，以决定应过滤掉或保留哪些行。\n\n将 RLS 筛选表达式视为一个 T-SQL `WHERE` 子句，该子句被添加到报告中的每个查询和每个视觉对象中。另一种思考\
  \ RLS 的方式是将其视为一个多过程过程。如果定义了 RLS，第一遍是将 RLS 规则应用于表，只有通过第一遍 RLS 的行才对来自报告的查询可见。\n\n\
  ### 角色\n\nPower BI 中的 RLS 是基于角色的。如果您想使用 RLS，则必须在模型中至少定义一个角色。您可以根据需要创建任意数量的角色。角色可以量身定制，以适应单个用户、组或其他非特定用户的实体。角色可以是部门性的、区域性的，甚至基于时间的。\n\
  \nPower BI Desktop 允许您创建角色，但不管理谁被分配到哪个角色。将用户分配到角色的工作是在 Power BI Web 服务中完成的。分配用户到角色的活动可以由与为每个角色配置规则的人完全不同的人执行和管理。\n\
  \n在 Power BI Desktop 中，要添加或编辑角色，请单击功能区“建模”选项卡“安全”部分中的“管理角色”按钮。图 11-1 显示了功能区中的“管理角色”按钮。\n\
  \n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig1_HTML.jpg](img/471413_1_En_11_Fig1_HTML.jpg)\n\
  \n**图 11-1** 显示用于访问 RLS 角色的“管理角色”按钮\n\n单击“管理角色”按钮会弹出一个对话框窗口，其中列出了数据模型中当前定义的每个角色。图\
  \ 11-2 中显示的“管理角色”对话框的三个元素是：角色、表和筛选器。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig2_HTML.jpg](img/471413_1_En_11_Fig2_HTML.jpg)\n\
  \n**图 11-2** Power BI Desktop 中的“管理角色”对话框窗口\n\n1.  角色\n2.  表\n3.  筛选器\n\n### 角色\n\
  \n第 1 步中的“角色”部分显示了当前定义的角色列表。此部分提供了创建新角色或删除现有角色的按钮。单击角色列表中的角色名称会更新“表”和“筛选器”部分中的信息，以显示特定于该高亮角色的详细信息。一次只能高亮一个角色。\n\
  \n角色名称右侧的省略号提供了重命名或克隆现有角色的功能。\n\n\n\n### 表\n\n在“角色”部分旁边是一个列表，显示了数据模型中的每个表。“表”面板如图\
  \ 11-2 的步骤 2 所示。点击右侧的省略号，表名会打开一个上下文菜单，初始提供“添加筛选器”或“清除表筛选器”选项。展开“添加筛选器”选项会列出表中的每个列，点击任一列会在“筛选器”部分创建或扩展\
  \ DAX 筛选表达式。\n\n一旦某个表至少定义了一个筛选器，该表省略号旁边就会出现一个筛选器图标，表示现在已存在筛选器。点击表名会更新“筛选器”部分中的文本，以显示该表当前的\
  \ DAX 筛选表达式。如果在上下文菜单中点击了列名，该列名会出现在“筛选器”窗口中，并附带示例运算符和值，以帮助指导正确的语法。\n\n点击`'Dimension\
  \ Date'`表中的`[Date]`列，会在“筛选器”部分填充一条建议的 DAX 筛选表达式。该建议会考虑所选待筛选列的列数据类型，并为数值列和文本列提供不同的建议。图\
  \ 11-3 中展示了一个示例。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig3_HTML.jpg](img/471413_1_En_11_Fig3_HTML.jpg)\n\
  \n图 11-3\n\n`'Dimension Date'`表上的 RLS DAX 筛选表达式示例\n\n### 筛选器\n\n“管理角色”对话框的最后一部分是“筛选器”部分，如图\
  \ 11-2 的步骤 3 所示。“筛选器”部分提供了一个面板，显示用于对所选表/角色筛选行的当前 DAX 表达式。窗口中的文本可以直接编辑，并且作为一个完整的表达式，它必须计算为布尔值\
  \ true 或 false。\n\n子查询可以在 RLS 筛选语句中使用，本章稍后的“使用子查询的动态 RLS”一节中提供了一些示例。\n\n对于一个给定的角色，可以在多个表上定义筛选器，这意味着单个角色可以拥有类似以下的筛选器定义：\n\
  \n*   `Geography[Country] IN {\"USA\",\"Canada\"}`\n*   `Date[Calendar Year] >=\
  \ 2020`\n*   `Employee[Department] = \"Sales\"`\n\n在上述角色的筛选器定义中，三个表都应用了筛选器。Geography\
  \ 表中的每一行都会根据一条规则进行评估，该规则规定`'Geography'`表中`[Country]`列的值必须匹配“USA”或“Canada”。注意使用了\
  \ DAX `IN`函数来允许多选。\n\nDate 表也有一条规则，用于筛选掉 2020 年之前的年份。最后，Employee 表会被筛选，以便仅返回`[Department]`列中值为“Sales”的行。\n\
  \n假设该示例中的每个表都是星型模式中的一个维度表，位于与某些事实表的一对多关系的一端。这些规则会自动沿着一对多关系向下传播，并应用于下游表。规则不必定义在定义关系的列上。\n\
  \n“筛选器”部分的右上角还提供了两个按钮，如图 11-4 所示。勾选按钮会验证编辑器窗口中的 DAX，以确保其返回布尔值，并检查可能在 RLS 筛选语句中无效的代码。\n\
  \n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig4_HTML.jpg](img/471413_1_En_11_Fig4_HTML.jpg)\n\
  \n图 11-4\n\n用于检查或清除 RLS 筛选规则的按钮\n\n带有叉号的按钮会清除当前所选表所在窗口中的所有测试。\n\n## 测试角色\n\n与任何开发形式一样，测试你的更改以确保它们按预期运行至关重要。Power\
  \ BI Desktop 提供了一种有用的方法来测试 RLS 角色，从而尽早发现问题。如果模型中的数据是敏感的，且某些人员绝不应看到，那么 RLS 尤为重要。\n\
  \n功能区中“管理角色”按钮旁边是“以角色身份查看”按钮。点击它会打开一个对话框，让你选择已使用“管理角色”屏幕定义的任何角色的名称。该按钮如图 11-5 所示。\n\
  \n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig5_HTML.jpg](img/471413_1_En_11_Fig5_HTML.jpg)\n\
  \n图 11-5\n\n建模选项卡中“安全性”部分的“以角色身份查看”按钮\n\n假设一个名为“测试角色 1”的单独角色是在数据模型中使用 Wide World\
  \ Importers 数据集中的`'Dimension City'`、`'Dimension Date'`和`'Fact Sale'`表定义的。`'Dimension\
  \ City'`和`'Fact Sale'`之间使用`[City Key]`列存在标准的一对多关系，而`'Dimension Date'`表使用`[Invoice\
  \ Date Key]`列连接到`'Fact Sale'`表。图 11-6 显示了当前示例的关系视图。\n\n![../images/471413_1_En_11_Chapter/471413_1_En_11_Fig6_HTML.jpg](img/471413_1_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6\n\n测试示例的关系视图\n\n“测试角色 1”角色应用了以下 RLS 筛选规则：\n\n*   `'Dimension City'[State\
  \ Province] IN {\"Texas\",\"Washington\"}`\n*   `'Dimension Date'[Calendar Year]\
  \ = 2015`\n\n`'Dimension Date'`和`'Fact Sale'`表之间的关系使用`[Invoice Date Key]`列。在此示例中，这两个表之间只有一个关系，并且该关系被配置为活动关系。RLS\
  \ 筛选规则仅通过活动关系向下传播，因此额外的*非活动*关系对于 RLS 来说毫无意义。\n\n为了建立测试的基准线，使用清单 11-1 中的代码创建的`[Sum\
  \ of Quantity]`计算度量值被添加到一个空白的报表页面上，且没有其他筛选器。结果值 8，950，628 在图 11-7 的可视化对象中显示。\n\n\
