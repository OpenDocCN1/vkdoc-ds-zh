  raw: '## Hyperparameter Tuning and Cross-Validation


    In the following example, we will take the random forest model that we just built
    and try to find the best combination of its hyperparameters, to improve performance.
    We can use `ParamgridBuilder` and `CrossValidator` for hyperparameter tuning.
    We will pass different values in the parameter grid for three hyperparameters
    (`maxDepth`, `maxBins`, and `numTrees`). It might take a few minutes to complete,
    as it builds random forest models for all of these combinations before returning
    the best possible combination for this train dataset.


    ```

    [In]: from pyspark.ml.tuning import ParamGridBuilder, CrossValidator

    [In]: rf = RandomForestClassifier()

    [In]: paramGrid = (ParamGridBuilder()

    .addGrid(rf.maxDepth, [5,10,20,25,30])

    .addGrid(rf.maxBins, [20, 60])

    .addGrid(rf.numTrees, [5, 20,50,100])

    .build())

    [In]: cv = CrossValidator(estimator=rf, estimatorParamMaps=paramGrid, evaluator=rf_evaluator,
    numFolds=5)

    [In]: cv_model = cv.fit(train)

    [In]: best_rf_model = cv_model.bestModel

    best_rf_model contains the best hyper-parameters to be used for training the model
    on this dataset.

    [In]: model_predictions = best_rf_model.transform(test)

    [In]: rf_evaluator = BinaryClassificationEvaluator(metricName=''areaUnderROC'')

    [In]: rf_auroc = rf_evaluator.evaluate(model_predictions)

    [In]: print(rf_auroc)

    [Out]:  0.7425990374615659

    ```


    As you can see, by using the best hyperparameters for our random forest model,
    the AUC score has increased.


    ## Conclusion


    This chapter covered in detail the different types of supervised learning and
    ways to solve binary classification with multiple machine learning algorithms.
