    ## Structured Streaming 的替代方案


    自 2016 年 Spark Structured Streaming 问世以来，它迅速获得了开发者社区的关注。然而，话虽如此，Spark 的 Structured
    Streaming 还有其他几个强大的替代方案。其中之一是 Flink，它在流式数据处理方面提供了类似的能力，并且具有出色的延迟率。另一个替代方案是 Google
    的 Beam，它适用于有限的情况。


    Spark 的 Structured Streaming 相对于替代方案的核心优势在于 Spark 作为一个整体提供的完整框架，包括批处理（批处理或流式处理的代码没有重大差异）和机器学习库。Structured
    Streaming 的另一个巨大优势是其 Spark SQL API，这对许多用户来说非常舒适。希望新版本的 Spark 能为 Structured Streaming
    包含更多功能，例如流式连接。选择取决于应用程序的具体需求，并找到最佳的可能替代方案，使其具有可扩展性、容错性和健壮性。


    ## 结论


    本章明确了批处理和流式数据之间的基本区别。然后讨论了 Spark 的流式 API 在过去几年中如何演变为构建流式数据应用程序的默认框架。最后提供了如何使用
    Spark 的 Structured Streaming API 读取流式数据（本地文件夹）以及如何保存聚合结果的示例。


    # 4. Airflow


    本章重点介绍 Airflow 以及如何使用它来处理复杂的数据工作流。Airflow 由 Airbnb 工程师内部开发，旨在高效管理内部工作流。Airflow
    后来于 2016 年成为 Apache 的一部分，并以开源形式提供给用户。基本上，Airflow 是一个用于执行、调度、分发和监控各种作业的框架，这些作业中可以包含多个相互依赖或独立的任务。每个使用
    Airflow 运行的作业都必须通过一个有向无环图（DAG）定义文件来定义，该文件包含您想要运行的集合，并按关系和依赖关系进行分组。


    本章主要关注三个主题。我将首先探讨工作流，然后介绍 Airflow 的基本构建块：DAG。接着，您将了解 Airflow 的用户界面方面。在最后一节中，我将介绍为作业定义
    DAG 的代码，以及如何使用 Airflow 来执行和监控它。


    ## 工作流


    我们周围看到的大多数事物都遵循一个流程。火车按设定的时间间隔运行，飞机按固定时间飞行，道路上的信号灯按固定周期变化。如果需要一致性，流程至关重要，尤其是在不同任务之间存在依赖关系时。在软件或技术领域，在构建或执行项目时也遵循一套流程。如果我们深入几个层次，我们可以将这些流程称为工作流。为了达到期望的结果，必须设计和执行适当的工作流。很少有开发人员或工程师在构建解决方案或应用程序时不遵循标准流程。例如，在数据处理工作流的典型场景中，开发人员会在执行任务之前定义步骤，如图
    4-1 所示。这些步骤通常被称为管道，由必须完成的系列任务组成。


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig1_HTML.jpg](img/478390_1_En_4_Fig1_HTML.jpg)


    图 4-1


    示例工作流


    第一个任务是从源文件读取数据，然后将其复制到您的平台或所需位置。数据可用后，您将其摄取，并通过多个步骤进行清洗和转换。然后执行分析并计算结果。最后，将输出保存到所需位置。传统上，这些步骤的执行方式是借助
    cron 作业（由 cron 守护进程按计划时间间隔运行的命令）。因此，所有任务都是作为 cron 作业运行的脚本的一部分。尽管它满足了按特定顺序执行事物的目的，但仍然面临许多实际挑战。最常见的是脚本执行中断。没有明确的方法来重新尝试运行脚本。另一个挑战是监控正在运行的作业的状态。在执行过程中，很难确定每个阶段及其耗时。还有其他挑战，例如通过集中式调度器运行多个
    cron 作业，以处理更大、更复杂的管道，并适应工作流中的持续变化。由于上述所有困难，Airflow 应运而生，成为一个用于调度和监控此类作业、平稳运行管道以获得一致输出的框架。要真正理解
    Airflow 和 DAG 如何运作，您首先需要理解图的一般概念。

