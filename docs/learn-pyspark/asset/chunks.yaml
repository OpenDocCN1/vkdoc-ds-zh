  trans: "\n# 构建多层感知机模型\n\n在 Spark 中使用深度学习有多种选择。根据具体需求和可用基础设施，可以采用相应的方法。从宏观层面来看，有近\
    \ 4 个重要的深度学习库可以与 Spark 配合使用。\n\n1.  Spark 的 MLlib\n2.  TensorflowOnSpark\n3. \
    \ Deep Learning Pipelines\n4.  DeepLearning4J\n\n为简单起见，我们将使用 Spark 构建一个多层感知机。本练习使用的数据集包含近\
    \ 7.5 万条记录，其中包含某个零售网站上的一些客户旅程样本数据。有 16 个输入特征用于预测访问者是否可能转化。该数据集中的目标类别是平衡的。我们将使用\
    \ Spark 机器学习库中的 `MultilayerPerceptronClassifier`。首先，我们导入一些重要的依赖项。\n\n```\n[In]:\
    \ from pyspark.sql import SparkSession\n[In]: spark = SparkSession.builder.appName('deep_learning').getOrCreate()\n\
    [In]: import os\n[In]: import numpy as np\n[In]: import pandas as pd\n[In]: from\
    \ pyspark.sql.types import *\n```\n\n现在，我们将数据集加载到 Spark 中，用于特征工程和模型训练。如前所述，有 16\
    \ 个输入特征和 1 个输出列（`'Orders_Normalized'`）。\n\n```\n[In]: data = spark.read.csv('dl_data.csv',\
    \ header=True, inferSchema=True)\n[In]: data.printSchema()\n[Out]:\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Figa_HTML.jpg](img/478390_1_En_8_Figa_HTML.jpg)\n\
    \n我们将标签列的名称从 `'Orders_Normalized'` 更改为 `'label'`，以便能够训练模型。\n\n```\n[In]: data\
    \ = data.withColumnRenamed('Orders_Normalized', 'label')\n[In]: data.printSchema()\n\
    [Out]:\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Figb_HTML.jpg](img/478390_1_En_8_Figb_HTML.jpg)\n\
    \n由于我们同时处理数值列和类别列，因此必须编写一个管道来创建结合两者的特征，用于模型训练。因此，我们导入 `Pipeline`、`VectorAssembler`\
    \ 和 `OneHotEncoder` 来创建特征向量。我们还将导入 `MultiClassificationEvaluator` 和 `MultilayerPerceptron`\
    \ 来检查模型的性能。\n\n```\n[In]: from pyspark.ml.feature import OneHotEncoder, VectorAssembler,\
    \ StringIndexer\n[In]: from pyspark.ml import Pipeline\n[In]: from pyspark.sql.functions\
    \ import udf, StringType\n[In]: from pyspark.ml.evaluation import MulticlassClassificationEvaluator\n\
    [In]: from pyspark.ml.classification import MultilayerPerceptronClassifier\n```\n\
    \n现在，我们将数据拆分为训练集、测试集和验证集，用于模型训练。\n\n```\n[In]: train, validation, test  = data.randomSplit([0.7,\
    \ 0.2, 0.1], 1234)\n```\n\n我们根据数据类型创建类别列和数值列的单独列表。\n\n```\n[In]: categorical_columns\
    \ = [item[0] for item in data.dtypes if item[1].startswith('string')]\n[In]: numeric_columns\
    \ = [item[0] for item in data.dtypes if item[1].startswith('double')]\n[In]: indexers\
    \ = [StringIndexer(inputCol=column, outputCol='{0}_index'.format(column)) for\
    \ column in categorical_columns]\n```\n\n现在，我们使用 `VectorAssembler` 创建合并后的特征向量。\n\
    \n```\n[In]: featuresCreator = VectorAssembler(inputCols=[indexer.getOutputCol()\
    \ for indexer in indexers] + numeric_columns, outputCol=\"features\")\n[In]: layers\
    \ = [len(featuresCreator.getInputCols()), 4, 2, 2]\n```\n\n下一步是构建 `MultilayerPerceptron`\
    \ 模型。可以调整不同的超参数，例如层数和最大迭代次数，以提高模型性能。\n\n```\n[In]: classifier = MultilayerPerceptronClassifier(labelCol='label',\
    \ featuresCol=\"features\", maxIter=100, layers=layers, blockSize=128, seed=1234)\n\
    ```\n\n现在我们已经定义了每个阶段，我们将所有这些步骤添加到管道中，并在训练数据上运行它。\n\n```\n[In]: pipeline = Pipeline(stages=indexers\
    \ + [featuresCreator, classifier])\n[In]: model = pipeline.fit(train)\n```\n\n\
    我们现在计算模型在训练集、测试集和验证集上的预测结果。\n\n```\n[In]: train_output_df = model.transform(train)\n\
    [In]: validation_output_df = model.transform(validation)\n[In]: test_output_df\
    \ = model.transform(test)\n[In]: train_predictionAndLabels = train_output_df.select(\"\
    prediction\", \"label\")\n[In]: validation_predictionAndLabels = validation_output_df.select(\"\
    prediction\", \"label\")\n[In]: test_predictionAndLabels = test_output_df.select(\"\
    prediction\", \"label\")\n```\n\n我们定义三个不同的指标来评估模型的性能。\n\n```\nmetrics = ['weightedPrecision',\
    \ 'weightedRecall', 'accuracy']\n[In]: for metric in metrics:\nevaluator = MulticlassClassificationEvaluator(metricName=metric)\n\
    print('Train ' + metric + ' = ' + str(evaluator.evaluate(train_predictionAndLabels)))\n\
    print('Validation ' + metric + ' = ' + str(evaluator.evaluate(validation_predictionAndLabels)))\n\
    print('Test ' + metric + ' = ' + str(evaluator.evaluate(test_predictionAndLabels)))\n\
    ```\n\n如您所见，基于输入信号，深度学习模型在测试数据上表现相当不错。\n\n```\n[Out]:\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Figc_HTML.jpg](img/478390_1_En_8_Figc_HTML.jpg)\n\
