- fmt: '### Step 6: Hyperparameter Tuning


    So, using a baseline model, we are getting almost 89% accuracy on the test data,
    and a recall rate of 0.86. Now that we have built the baseline model, we can build
    a more sophisticated model, such as a random forest model, which is an ensemble
    method that can improve the accuracy of predictions. You will see how we can tune
    this model, to find the best possible hyper-parameters.


    ```

    [In]: from pyspark.ml.classification import RandomForestClassifier

    ```


    First, we build a random forest model with default hyper-parameters, then train
    it on the training data, so that predictions can be made on the test data.


    ```

    [In]: rf = RandomForestClassifier()

    [In]: rf_model = rf.fit(training_df)

    [In]: model_predictions = rf_model.transform(test_df)

    ```


    Using cross-validation techniques, we now try to come up with the best hyperparameters
    for this model.


    ```

    [In]: from pyspark.ml.tuning import ParamGridBuilder, CrossValidator

    [In]: from pyspark.ml.evaluation import BinaryClassificationEvaluator

    [In]: evaluator = BinaryClassificationEvaluator()

    [In]: rf = RandomForestClassifier()

    [In]: paramGrid = (ParamGridBuilder()

    .addGrid(rf.maxDepth, [5,10,20,25,30])

    .addGrid(rf.maxBins, [20,30,40 ])

    .addGrid(rf.numTrees, [5, 20,50])

    .build())

    ```


    We define the parameter grid with all the possible values for different hyperparameters
    (`maxDepth`, `maxBins`, `numTrees`) and apply cross-validation, to determine the
    best model. We use five-fold cross-validation in this case (four parts for training,
    and one for testing).


    ```

    [In]: cv = CrossValidator(estimator=rf, estimatorParamMaps=paramGrid, evaluator=evaluator,
    numFolds=5)

    [In]: cv_model = cv.fit(training_df)

    ```


    We then access the best model parameters and use them on the test dataset, to
    make predictions.


    ### Step 7: Best Model


    ```

    [In]: best_rf_model = cv_model.bestModel

    [In]: model_predictions = best_rf_model.transform(test_df)

    [In]: true_pos=model_predictions.filter(model_predictions[''label'']==1).filter(model_predictions[''prediction'']==1).count()

    [In]: actual_pos=model_predictions.filter(model_predictions[''label'']==1).count()

    [In]: pred_pos=model_predictions.filter(model_predictions[''prediction'']==1).count()

    [In]: recall_rate=float(true_pos)/(actual_pos)

    [In]: print(recall_rate)

    [Out]: 0.912426614481409

    ```


    As you can see from the preceding, with the random forest model with best hyperparameters,
    the recall rate has improved, compared to the baseline method (logistic regression).


    ## Conclusion


    In this chapter, some transformation techniques using PySpark and ways to compute
    summary statistics were reviewed. You saw how to build a machine learning model
    from scratch and how to tune hyperparameters, to choose the best parameters for
    a model.


    # 6. Supervised Machine Learning


    Machine learning can be broadly divided into four categories: supervised machine
    learning and unsupervised machine learning and, to a lesser extent, semi-supervised
    machine learning and reinforcement machine learning. Because supervised machine
    learning drives a lot of business applications and significantly affects our day-to-day
    lives, it is considered one of the most important categories.


    This chapter reviews supervised machine learning, using multiple algorithms. In
    Chapter [7](#478390_1_En_7_Chapter.xhtml), we’ll look at unsupervised machine
    learning. I’ll begin by providing an overview of the different categories of supervised
    machine learning. In the second section, I will cover various regression methods,
    and we will build machine learning models, using PySpark’s MLlib library. The
    third and final section of this chapter focuses on classification, using multiple
    machine learning algorithms.


    ## Supervised Machine Learning Primer


    In supervised machine learning, as the name suggests, the learning process is
    supervised, as the machine learning algorithm being used corrects its predictions,
    based on the actual output. In supervised machine learning, the correct labels
    or output is already known during the model training phase, and, hence, the error
    can be reduced accordingly. In short, we try to map the relationship between the
    input data and output label in such a way as to pick up the signals from the training
    data and generalize about the unseen data as well. The training of the model consists
    of comparing the actual output with the predicted output and then making the changes
    in predictions, to reduce the total error between what is actual and what is predicted.
    The supervised machine learning process followed is as shown in Figure [6-1](#478390_1_En_6_Chapter.xhtml#Fig1).


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Fig1_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Fig1_HTML.jpg)


    Figure 6-1 Supervised learning approach


    The data used for training the model is preprocessed, and features are created
    accordingly. Once the machine learning model is trained, it can be used to make
    predictions on the unseen data. So, in the preceding figure, we can see how the
    model is trained, using input data and how now, the trained model is used to predict
    whether the new transaction is genuine. This type of learning is predominantly
    used in cases in which historical data is available and predictions must be made
    on future data. The further categorization of supervised learning is based on
    types of output or target variables being used for prediction:


    - Regression

    - Classification


    Regression is used when the target value that is being predicted is continuous
    or numerical in nature. For example, predicting salary based on a given number
    of years of experience or education falls under the category of regression.


    ### Note


    Although there are multiple types of regression, in this chapter, I’ll focus on
    linear regression and some of its associated algorithms, as you’ll see shortly.


    Classification is used if the target variable is a discrete value or categorical
    in nature. For example, predicting whether a customer will churn out is a type
    of classification problem, as shown in Figure [6-2](#478390_1_En_6_Chapter.xhtml#Fig2).


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Fig2_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Fig2_HTML.jpg)


    Figure 6-2 Types of supervised tasks


    Classification tasks can further be broken down into two categories: binary class
    and multi-class, as shown in Figure [6-3](#478390_1_En_6_Chapter.xhtml#Fig3).


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Fig3_HTML.png](images/478390_1_En_6_Chapter/478390_1_En_6_Fig3_HTML.png)


    Figure 6-3 Types of classes


    ### Binary Classification


    When the target or output variable contains only up to two categories, it is referred
    to as binary classification. So, every record in the data can only fall under
    one of the two groups. For example:


    - Yes or no

    - Group A or group B

    - Sell or not sell

    - Positive or negative

    - Accepted or rejected


    ### Multi-class Classification


    When the target or output variable contains more than two categories, it is referred
    to as multi-class classification. So, there can be multiple groups within the
    data, and every record can belong to any of the groups. For example:


    - Yes or no or maybe

    - Group A or group B or group C

    - Category 1 or category 2 or category 3 or others

    - Rank 1 or rank 2 or rank 3 or rank 4 or rank 5


    Another useful property of supervised learning is that the model’s performance
    can be evaluated on training and test data. Based on the type of model (classification
    or regression), the evaluation metric can be applied, and performance results
    can be measured. In this chapter, I will cover how to build machine learning models
    to execute regression and binary classification.'
