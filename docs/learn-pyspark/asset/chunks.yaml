- fmt: "### Neuron Computation\n\nNow that we have a basic understanding of different\
    \ activation functions, let’s consider an example, to understand how the actual\
    \ output is calculated inside a neuron. Let’s say we have two inputs, `X1` and\
    \ `X2`, with values of `0.2` and `0.7`, respectively, and the weights are `0.05`\
    \ and `0.03`. The summation function calculates the total sum of incoming input\
    \ signals, as shown in Figures [8-8](#478390_1_En_8_Chapter.xhtml#Fig8) and [8-9](#478390_1_En_8_Chapter.xhtml#Fig9).\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig8_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8\n\nNeuron computation\n\nThe summation is as follows:\n\n```\nsum\
    \ = X1 * W1 + X2 * W2\n```\n\n```\nsum = 0.2 * 0.05 + 0.7 * 0.03\n```\n\n```\n\
    sum = 0.01 + 0.021\n```\n\n```\nsum = 0.031\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig9_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig9_HTML.jpg)\n\
    \nFigure 8-9\n\nSummation\n\nThe next step is to pass this sum through an activation\
    \ function. Let’s consider using a sigmoid function, which returns values between\
    \ 0 and 1, irrespective of the input. The sigmoid function will calculate the\
    \ value, as follows:\n\n```\nf(x) = 1 / (1 + e^(-x))\n```\n\n```\nf(sum) = 1 /\
    \ (1 + e^(-sum))\n```\n\n```\nf(0.031) = 1 / (1 + e^(-0.031))\n```\n\n```\nf(0.031)\
    \ = 0.5077\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig10_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig10_HTML.jpg)\n\
    \nFigure 8-10\n\nNeuron Activation\n\nSo, the output of this single neuron is\
    \ equal to `0.5077`. Now that we know how a single neuron operates, let’s quickly\
    \ go over how multiple connected neurons work together to calculate the output.\n\
    \n## Training Process: Neural Network\n\nWhen we combine multiple neurons, we\
    \ end up with a neural network. Most simple and basic neural networks can be built\
    \ using just input and output neurons, as shown in Figure [8-11](#478390_1_En_8_Chapter.xhtml#Fig11).\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig11_HTML.png](images/478390_1_En_8_Chapter/478390_1_En_8_Fig11_HTML.png)\n\
    \nFigure 8-11\n\nBasic neural network\n\nThe challenge with using a neural network\
    \ such as this is that it can only learn linear relationships and cannot perform\
    \ well in cases in which the relationship between input and output is nonlinear.\
    \ As we have seen, in real-world scenarios, the relationship is hardly simple\
    \ and linear. Therefore, we must introduce an additional layer of neurons between\
    \ the input and output layer, in order to increase the network’s capacity to learn\
    \ different kinds of nonlinear relationships. This additional layer of neurons\
    \ is known as a hidden layer, as shown in Figure [8-12](#478390_1_En_8_Chapter.xhtml#Fig12).\
    \ It is responsible for introducing nonlinearities into the learning process of\
    \ the network. Neural networks are also known as universal approximators, because\
    \ they have the ability to approximate any relationship between input and output\
    \ variables, no matter how complex and nonlinear in nature. A lot depends on the\
    \ number of hidden layers in the networks and the total number of neurons in each\
    \ hidden layer. Given sufficient numbers of hidden layers, a network can perform\
    \ brilliantly at mapping this relationship.\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig12_HTML.png](images/478390_1_En_8_Chapter/478390_1_En_8_Fig12_HTML.png)\n\
    \nFigure 8-12\n\nMultiple layer neural network\n\nA neural network is all about\
    \ various connections (red lines) and different weights associated with these\
    \ connections. The training of neural networks primarily includes adjusting these\
    \ weights in such a way that the model can make predictions with a higher degree\
    \ of accuracy. To understand how neural networks are trained, let’s break down\
    \ the steps of network training.\n\n> Step 1. Take the input values and calculate\
    \ the output values that are passed to hidden neurons, as shown in Figure [8-13](#478390_1_En_8_Chapter.xhtml#Fig13).\
    \ The weights used for the first iteration of sum calculation are generated randomly.\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig13_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig13_HTML.jpg)\n\
    \nFigure 8-13\n\nNeural network training process\n\n> An additional component\
    \ that is passed is the bias neuron input, as shown in Figure [8-14](#478390_1_En_8_Chapter.xhtml#Fig14).\
    \ This is mainly used when you want to have some non-zero output for even the\
    \ zero input values.\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig14_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig14_HTML.jpg)\n\
    \nFigure 8-14\n\nBias component\n\n> Step 2. The hidden layer neurons now go through\
    \ the same process to calculate the output, using the inputs from the previous\
    \ layer (input layer). This hidden layer output acts as an input for the final\
    \ output neuron (red) calculation, as shown in Figure [8-15](#478390_1_En_8_Chapter.xhtml#Fig15).\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig15_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig15_HTML.jpg)\n\
    \nFigure 8-15\n\nOutput calculation\n\n> Step 3. Once we have the final output,\
    \ it is compared with the actual output, and the error is backpropagated to the\
    \ network, to adjust the weights of the connections so as to reduce the overall\
    \ error on the training data, as shown in Figure [8-16](#478390_1_En_8_Chapter.xhtml#Fig16).\
    \ This process is known as backpropagation.\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig16_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig16_HTML.jpg)\n\
    \nFigure 8-16\n\nBackpropagation\n\n> Step 4. Weights of the connections are readjusted\
    \ according to the output, to minimize the overall errors made by the network,\
    \ to the point that there is no further reduction of error on the training data.\n\
    > \n> Step 5. Now that we have the final version of the weights, a new output\
    \ value is calculated, based on updated weights, by the network, as shown in Figure\
    \ [8-17](#478390_1_En_8_Chapter.xhtml#Fig17).\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig17_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig17_HTML.jpg)\n\
    \nFigure 8-17\n\nFinal output"
