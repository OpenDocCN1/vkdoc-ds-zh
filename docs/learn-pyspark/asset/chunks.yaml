  trans: '

    # 聚合操作


    任何类型的聚合都可以简单地分解为以下三个步骤，按顺序执行：


    - 拆分

    - 应用

    - 合并


    第一步是根据某一列或一组列来拆分数据，然后对这些小的独立分组执行操作（如`count`、`max`、`avg`等）。一旦每个分组集合的结果都计算完毕，最后一步就是将所有结果合并起来。


    在下面的示例中，我们根据`''Customer subtype''`对数据进行聚合，并简单地统计每个类别中的记录数量。我们使用了 PySpark 中的 `groupBy`
    函数。由于没有对结果应用任何排序，因此输出没有特定的顺序。因此，我们还将了解如何对最终结果应用任意类型的排序。由于数据框中有七列——除了 `Avg_Salary`
    之外，其他都是分类列——我们可以遍历每一列并应用聚合，如下例所示：


    ```

    [In]: df.groupBy(''Customer_subtype'').count().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figq_HTML.jpg](img/478390_1_En_2_Figq_HTML.jpg)


    ```

    [In]:

    for col in df.columns:

    if col !=''Avg_Salary'':

    print(f" Aggregation for  {col}")

    df.groupBy(col).count().orderBy(''count'',ascending=False).show(truncate=False)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figr_HTML.jpg](img/478390_1_En_2_Figr_HTML.jpg)


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figs_HTML.jpg](img/478390_1_En_2_Figs_HTML.jpg)


    如前所述，我们可以对记录分组执行不同类型的操作，例如：


    - 平均值

    - 最大值

    - 最小值

    - 求和


    以下示例基于不同的分组涵盖了其中一些操作。这里的 `F` 指的是 Spark 的 `sql` 函数。


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.mean(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figt_HTML.jpg](img/478390_1_En_2_Figt_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.max(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figu_HTML.jpg](img/478390_1_En_2_Figu_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.min(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figv_HTML.jpg](img/478390_1_En_2_Figv_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.sum(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figw_HTML.jpg](img/478390_1_En_2_Figw_HTML.jpg)


    有时，我们只需要对数据进行排序，无论是否带有聚合操作。这时，我们可以利用 PySpark 的 `sort` 和 `orderBy` 功能，将数据按特定顺序重新排列，如下例所示：


    ```

    [In]: df.sort("Avg_Salary", ascending=False).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figx_HTML.jpg](img/478390_1_En_2_Figx_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_subtype'').agg(F.avg(''Avg_Salary'').alias(''mean_salary'')).orderBy(''mean_salary'',ascending=False).show(50,False)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figy_HTML.jpg](img/478390_1_En_2_Figy_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_subtype'').agg(F.max(''Avg_Salary'').alias(''max_salary'')).orderBy(''max_salary'',ascending=False).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figz_HTML.jpg](img/478390_1_En_2_Figz_HTML.jpg)


    在某些情况下，我们还必须收集特定分组或单个类别的值列表。例如，假设一个客户访问在线商店，并浏览了商店网站上的不同页面。如果我们需要将客户的所有活动收集到一个列表中，可以使用
    PySpark 中的 `collect` 功能。我们可以通过两种不同的方式收集值：


    - 收集列表

    - 收集集合


    ### 收集


    `Collect list` 提供按原始出现顺序排列的所有值（也可以反转顺序），而 `collect set` 仅提供唯一值，如下例所示。我们考虑按 `Customer
    subtype` 分组，并分别使用 `list` 和 `set` 将 `Numberof houses` 的值收集到一个新列中。


    ```

    [In]: df.groupby("Customer_subtype").agg(F.collect_set("Number_of_houses")).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figaa_HTML.jpg](img/478390_1_En_2_Figaa_HTML.jpg)


    ```

    [In]:

    df.groupby("Customer_subtype").agg(F.collect_list("Number_of_houses")).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figab_HTML.jpg](img/478390_1_En_2_Figab_HTML.jpg)


    创建一个包含常量值的新列的需求非常普遍。因此，我们可以在 PySpark 中使用 `lit` 函数来实现。在下面的示例中，我们创建了一个包含常量值的新列：


    ```

    [In]: df=df.withColumn(''constant'',F.lit(''finance''))

    [In]: df.select(''Customer_subtype'',''constant'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figac_HTML.jpg](img/478390_1_En_2_Figac_HTML.jpg)


    由于我们处理的是数据框，因此对特定列应用某些自定义函数并获取输出是一个常见需求。因此，我们利用 UDF（用户自定义函数）来对一列或多列应用 Python 函数。


    ## 用户自定义函数 (UDFs)


    在这个示例中，我们尝试对年龄类别进行命名，并为此创建一个标准的 Python 函数 (`age_category`)。为了将其应用于 Spark 数据框，我们使用这个
    Python 函数创建一个 UDF 对象。唯一的要求是指定函数的返回类型。在这个例子中，它只是一个字符串值。


    ```

    [In]: from pyspark.sql.functions import udf

    [In]: df.groupby("Avg_age").count().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figad_HTML.jpg](img/478390_1_En_2_Figad_HTML.jpg)


    ```

    [In]: def age_category(age):

    if age  == "20-30 years":

    return "Young"

    elif age== "30-40 years":

    return "Mid Aged"

    elif ((age== "40-50 years") or (age== "50-60 years")) :

    return "Old"

    else:

    return "Very Old"

    [In]: age_udf=udf(age_category,StringType())

    [In]: df=df.withColumn(''age_category'',age_udf(df[''Avg_age'']))

    [In]: df.select(''Avg_age'',''age_category'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figae_HTML.jpg](img/478390_1_En_2_Figae_HTML.jpg)


    ```

    [In]: df.groupby("age_category").count().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figaf_HTML.jpg](img/478390_1_En_2_Figaf_HTML.jpg)


    Pandas UDF 是另一项近期进展，现在让我们来了解一下它们。

    '
- fmt: '### Pandas UDF


    Pandas UDFs are much faster and efficient, in terms of processing and execution
    time, compared to standard Python UDFs. The main difference between a normal Python
    UDF and a Pandas UDF is that a Python UDF is executed row by row and, therefore,
    really doesn’t offer the advantage of a distributed framework. It can take longer,
    compared to a Pandas UDF, which executes block by block and gives faster results.
    There are three different types of Pandas UDFs: scalar, grouped map, and grouped
    agg. The only difference in using a Pandas UDF compared to a traditional UDF lies
    in the declaration. In the following example, we try to scale the `Avg_Salary`
    values by applying scaling. We first take the `min` and `max` values of `Avg_Salary`,
    subtract from each value the minimum salary from each value, and then divide by
    the difference between `max` and `min`.


    ![$$ \frac{X-{X}_{\mathrm{min}}}{X_{max}-{X}_{min}} $$](images/478390_1_En_2_Chapter/478390_1_En_2_Chapter_TeX_Equa.png)


    ```

    [In]: df.select(''Avg_Salary'').summary().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figag_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figag_HTML.jpg)


    ```

    [In]: min_sal=1361

    [In]: max_sal=48919896

    [In]: from pyspark.sql.functions import pandas_udf, PandasUDFType

    [In]: def scaled_salary(salary):

    scaled_sal=(salary-min_sal)/(max_sal-min_sal)

    return scaled_sal

    [In]: scaling_udf = pandas_udf(scaled_salary, DoubleType())

    [In]:df.withColumn("scaled_salary",scaling_udf(df[''Avg_Salary''])).show(10,False)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figah_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figah_HTML.jpg)


    This is how we can use both conventional and Pandas UDFs to apply different conditions
    on the dataframe, as required.


    ### Joins


    Merging different datasets is a very generic requirement present in most of data-processing
    pipelines in the big data world. PySpark offers a very convenient way to merge
    and pivot your dataframe values, as required. In the following example, we create
    a fabricated dataframe with some dummy `Region Code` values for all `Customer`
    types. The idea is to combine this dataframe with the original dataframe, so as
    to have these region codes as part of the original dataframe, as a column.


    ```

    [In]: region_data = spark.createDataFrame([(''Family with grown ups'',''PN''),

    (''Driven Growers'',''GJ''),

    (''Conservative families'',''DD''),

    (''Cruising Seniors'',''DL''),

    (''Average Family '',''MN''),

    (''Living well'',''KA''),

    (''Successful hedonists'',''JH''),

    (''Retired and Religious'',''AX''),

    (''Career Loners'',''HY''),(''Farmers'',''JH'')],schema=StructType().add("Customer_main_type","string").add("Region
    Code","string"))

    [In]: region_data.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figai_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figai_HTML.jpg)


    ```

    [In]: new_df=df.join(region_data,on=''Customer_main_type'')

    [In]: new_df.groupby("Region Code").count().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figaj_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figaj_HTML.jpg)


    We took the regional count after joining the original dataframe (`df`) with the
    newly created `region_data` dataframe on the `Customer_main_type` column.


    ### Pivoting


    We can use the `pivot` function in PySpark to simply create a pivot view of the
    dataframe for specific columns, as shown in the following example. Here, we are
    grouping data, based on customer type. Columns represent different age groups.
    The values inside the pivot table are the sum of the `Avg Salary` of each of these
    customer type categories for a particular age group. We also ensure that there
    are no nulls or empty values, by filling all nulls with 0. In the subsequent example,
    we create one more pivot table, using the `label` column and take the sum of `Avg
    Salary` as the values inside it.


    ```

    [In]:df.groupBy(''Customer_main_type'').pivot(''Avg_age'').sum(''Avg_Salary'').fillna(0).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figak_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figak_HTML.jpg)


    ```

    [In]:df.groupBy(''Customer_main_type'').pivot(''label'').sum(''Avg_Salary'').fillna(0).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figal_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figal_HTML.jpg)


    We split the data, based on the `Customer_main_type` column, and took the cumulative
    sum of the `Avg_Salary` of each of the `label` values (`0,1`), using the `pivot`
    function.


    ### Window Functions or Windowed Aggregates


    This functionality in PySpark allows you to perform certain operations on groups
    of records known as “within the window.” It calculates the results for each row
    within the window. A classic example of using `window` is the various aggregations
    for a user during different sessions. A visitor might have multiple sessions on
    a particular web site and, hence `window` can be used to count the total activities
    of the user during each session. PySpark supports three types of `window` functions:


    *   Aggregations

    *   Ranking

    *   Analytics


    In the following example, we import the `window` function, in addition to others,
    such as `row_number`. The next step is to define the window. Sometimes it can
    be simply an ordered column, or sometimes it can be based on particular categories
    within a column. We will see examples of each of these. In the first example,
    we define the window, which is just based on the sorted `Avg Salary` column, and
    we rank these salaries. We create a new column `''rank''` and assign ranks to
    each of the `Avg Salary` values.


    ```

    [In]: from pyspark.sql.window import Window

    [In]: from pyspark.sql.functions import col,row_number

    [In]: win = Window.orderBy(df[''Avg_Salary''].desc())

    [In]: df=df.withColumn(''rank'', row_number().over(win).alias(''rank''))

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figam_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figam_HTML.jpg)


    One common requirement is to find the top-three values from a category. In this
    case, `window` can be used to get the results. In the following example, we define
    the window and partition by the `Customer subtype` column. Basically, what it
    does is sort the `Avg Salary` for each of the `Customer subtype` category, so
    now we can use `filter` to fetch the top-three salary values for each group.


    ```

    [In]:win_1=Window.partitionBy("Customer_subtype").orderBy(df[''Avg_Salary''].desc())

    [In]: df=df.withColumn(''rank'', row_number().over(win_1).alias(''rank''))

    ```


    Now that we have a new column rank that consists of the rank or each category
    of `Customer_subtype`, we can filter the top-three ranks for each category easily.


    ```

    [In]:

    df.groupBy(''rank'').count().orderBy(''rank'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figan_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figan_HTML.jpg)


    ```

    [In]: df.filter(col(''rank'') < 4).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figao_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figao_HTML.jpg)


    ### Conclusion


    In this chapter, I discussed different techniques to read, clean, and preprocess
    data in PySpark. You saw the methods to join a dataframe and create a pivot table
    from it. The final sections of the chapter covered UDFs and window-based operations
    in PySpark. The upcoming chapters will focus on handling streaming data in PySpark
    and machine learning using MLlib.'
  raw: '### Pandas UDF


    Pandas UDFs are much faster and efficient, in terms of processing and execution
    time, compared to standard Python UDFs. The main difference between a normal Python
    UDF and a Pandas UDF is that a Python UDF is executed row by row and, therefore,
    really doesn’t offer the advantage of a distributed framework. It can take longer,
    compared to a Pandas UDF, which executes block by block and gives faster results.
    There are three different types of Pandas UDFs: scalar, grouped map, and grouped
    agg. The only difference in using a Pandas UDF compared to a traditional UDF lies
    in the declaration. In the following example, we try to scale the `Avg_Salary`
    values by applying scaling. We first take the `min` and `max` values of `Avg_Salary`,
    subtract from each value the minimum salary from each value, and then divide by
    the difference between `max` and `min`.


    ![$$ \frac{X-{X}_{\mathrm{min}}}{X_{max}-{X}_{min}} $$](images/478390_1_En_2_Chapter/478390_1_En_2_Chapter_TeX_Equa.png)


    ```

    [In]: df.select(''Avg_Salary'').summary().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figag_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figag_HTML.jpg)


    ```

    [In]: min_sal=1361

    [In]: max_sal=48919896

    [In]: from pyspark.sql.functions import pandas_udf, PandasUDFType

    [In]: def scaled_salary(salary):

    scaled_sal=(salary-min_sal)/(max_sal-min_sal)

    return scaled_sal

    [In]: scaling_udf = pandas_udf(scaled_salary, DoubleType())

    [In]:df.withColumn("scaled_salary",scaling_udf(df[''Avg_Salary''])).show(10,False)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figah_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figah_HTML.jpg)


    This is how we can use both conventional and Pandas UDFs to apply different conditions
    on the dataframe, as required.


    ## Joins


    Merging different datasets is a very generic requirement present in most of data-processing
    pipelines in the big data world. PySpark offers a very convenient way to merge
    and pivot your dataframe values, as required. In the following example, we create
    a fabricated dataframe with some dummy `Region Code` values for all `Customer`
    types. The idea is to combine this dataframe with the original dataframe, so as
    to have these region codes as part of the original dataframe, as a column.


    ```

    [In]: region_data = spark.createDataFrame([(''Family with grown ups'',''PN''),

    (''Driven Growers'',''GJ''),

    (''Conservative families'',''DD''),

    (''Cruising Seniors'',''DL''),

    (''Average Family '',''MN''),

    (''Living well'',''KA''),

    (''Successful hedonists'',''JH''),

    (''Retired and Religious'',''AX''),

    (''Career Loners'',''HY''),(''Farmers'',''JH'')],schema=StructType().add("Customer_main_type","string").add("Region
    Code","string"))

    [In]: region_data.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figai_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figai_HTML.jpg)


    ```

    [In]: new_df=df.join(region_data,on=''Customer_main_type'')

    [In]: new_df.groupby("Region Code").count().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figaj_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figaj_HTML.jpg)


    We took the regional count after joining the original dataframe (`df`) with the
    newly created `region_data` dataframe on the `Customer_main_type` column.


    ## Pivoting


    We can use the `pivot` function in PySpark to simply create a pivot view of the
    dataframe for specific columns, as shown in the following example. Here, we are
    grouping data, based on customer type. Columns represent different age groups.
    The values inside the pivot table are the sum of the `Avg Salary` of each of these
    customer type categories for a particular age group. We also ensure that there
    are no nulls or empty values, by filling all nulls with 0\. In the subsequent
    example, we create one more pivot table, using the `label` column and take the
    sum of `Avg Salary` as the values inside it.


    ```

    [In]:df.groupBy(''Customer_main_type'').pivot(''Avg_age'').sum(''Avg_Salary'').fillna(0).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figak_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figak_HTML.jpg)


    ```

    [In]:df.groupBy(''Customer_main_type'').pivot(''label'').sum(''Avg_Salary'').fillna(0).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figal_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figal_HTML.jpg)


    We split the data, based on the `Customer_main_type` column, and took the cumulative
    sum of the `Avg_Salary` of each of the `label` values (`0,1`), using the `pivot`
    function.


    ## Window Functions or Windowed Aggregates


    This functionality in PySpark allows you to perform certain operations on groups
    of records known as “within the window.” It calculates the results for each row
    within the window. A classic example of using `window` is the various aggregations
    for a user during different sessions. A visitor might have multiple sessions on
    a particular web site and, hence `window` can be used to count the total activities
    of the user during each session. PySpark supports three types of `window` functions:


    *   Aggregations


    *   Ranking


    *   Analytics


    In the following example, we import the `window` function, in addition to others,
    such as `row_number`. The next step is to define the window. Sometimes it can
    be simply an ordered column, or sometimes it can be based on particular categories
    within a column. We will see examples of each of these. In the first example,
    we define the window, which is just based on the sorted `Avg Salary` column ,
    and we rank these salaries. We create a new column `''rank''` and assign ranks
    to each of the `Avg Salary` values.


    ```

    [In]: from pyspark.sql.window import Window

    [In]: from pyspark.sql.functions import col,row_number

    [In]: win = Window.orderBy(df[''Avg_Salary''].desc())

    [In]: df=df.withColumn(''rank'', row_number().over(win).alias(''rank''))

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figam_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figam_HTML.jpg)


    One common requirement is to find the top-three values from a category. In this
    case, `window` can be used to get the results. In the following example, we define
    the window and partition by the `Customer subtype` column . Basically, what it
    does is sort the `Avg Salary` for each of the `Customer subtype` category, so
    now we can use `filter` to fetch the top-three salary values for each group.


    ```

    [In]:win_1=Window.partitionBy("Customer_subtype").orderBy(df[''Avg_Salary''].desc())

    [In]: df=df.withColumn(''rank'', row_number().over(win_1).alias(''rank''))

    ```


    Now that we have a new column rank that consists of the rank or each category
    of `Customer`_`subtype`, we can filter the top-three ranks for each category easily.


    ```

    [In]:

    df.groupBy(''rank'').count().orderBy(''rank'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figan_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figan_HTML.jpg)


    ```

    [In]: df.filter(col(''rank'') < 4).show()

    [Out]:

