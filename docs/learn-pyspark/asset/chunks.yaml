- fmt: '# Gradient-Boosted Tree Regressor


    A gradient-boosted tree (GBT) regressor is also an ensembling technique, which
    uses boosting under the hood. Boosting refers to making use of individual weak
    learners in order to boost the performance of the overall model. One major difference
    between bagging and boosting is that in bagging, the individual models that are
    built are parallel in nature, meaning they can be built independent of each other,
    but in boosting, the individual models are built in a sequential manner. In a
    gradient boosting approach, the second model focuses on the errors made by the
    first model and tries to reduce overall errors for those data points. Similarly,
    the next model tries to reduce the errors made by the previous model. In this
    way, the overall error of prediction is reduced. In the following example, we
    will build a GBT regressor with default parameters.


    ## Step 1: Build and Train a GBT Regressor Model


    ```

    [In]: from pyspark.ml.regression import GBTRegressor

    [In]: gbt = GBTRegressor()

    [In]: gbt_model=gbt.fit(train)

    [In]: gbt_model.featureImportances

    [Out]: SparseVector(5, {0: 0.2325, 1: 0.2011, 2: 0.1645, 3: 0.2268, 4: 0.1751})

    [In]: model_predictions = gbt_model.transform(test)

    [In]: model_predictions.show()

    [Out]:

    ```


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Figh_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Figh_HTML.jpg)


    ## Step 2: Evaluate the Model Performance on Test Data


    ```

    [In]: gbt_evaluator = RegressionEvaluator(metricName=''r2'')

    [In]: gbt_r2 = gbt_evaluator.evaluate(model_predictions)

    [In]: print(f''The r-square value of GradientBoostedRegressor is {gbt_r2}'')

    [Out]: The r-square value of GradientBoostedRegressor is 0.8477273892307596

    [In]: gbt_evaluator = RegressionEvaluator(metricName=''rmse'')

    [In]: gbt_rmse = gbt_evaluator.evaluate(model_predictions)

    [In]: print(f''The rmse value of GradientBoostedRegressor is {gbt_rmse}'')

    [Out]: The rmse value of GradientBoostedRegressor is 0.013305445803592103

    ```


    As you can see, the GBT regressor outperforms the random forest model. With r²
    being close to 0.85, it can be considered the final model, after proper tuning.


    # Building Multiple Models for Binary Classification Tasks


    In this third and final section of the chapter, you will see how to build multiple
    machine learning models for binary classification tasks. The data that we are
    going to use for this is a subset of an open source Bank Marketing Data Set from
    the UCI ML repository, available at `https://archive.ics.uci.edu/ml/datasets/Bank+Marketing`.


    There are two reasons for selecting only a subset of this data. The first is to
    maintain the class balance for the classification task, so as not to make it an
    anomalous detection category task. Another reason for selecting only a subset
    of the features is to limit the amount of signals in the data, as some of the
    features in the dataset strongly affect the output and, therefore, are ignored
    in this exercise.


    The dataset contains 9,500 rows and 8 columns. The idea is to predict if the user
    will subscribe to another product or service (term deposit), based on the other
    attributes, such as age, job, loan, etc. This is a typical requirement in which
    machine learning is leveraged to find the top users who can be targeted by the
    business for cross-selling or upselling.


    I’ll begin with the logistic regression model.


    ## Logistic Regression


    Logistic regression is considered to be one of baseline models, owing to its simplicity
    and interpretability. Under the hood, it is quite similar to linear regression.
    It also assumes that output is a linear combination of the dependent variables,
    but to keep the output between 0 and 1, as it returns the probability as output,
    it makes use of a nonlinear function (`sigmoid`), which produces an S curve instead
    of a straight line (linear regression).


    We’ll start by building the baseline in Steps 1–3 and then complete the logistic
    regression model with default hyperparameters, in Steps 4–6.


    ### Step 1: Read the Dataset


    ```

    [In]: df=spark.read.csv(''bank_data.csv'',inferSchema=True,header=True)

    [In]: df.count()

    [Out]: 9501

    [In]: df.columns

    [Out]: [''age'', ''job'', ''marital'', ''education'', ''default'', ''housing'',''loan'',
    ''target_class'']

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Figi_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Figi_HTML.jpg)


    As you can see, the input columns are all the columns, except for the target class
    column. The target class is also well-balanced, in terms of the count of yes and
