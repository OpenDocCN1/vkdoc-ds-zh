- fmt: '# Graph Overview


    A typical graph data structure consists of two entities, shown in Figure [4-2](#478390_1_En_4_Chapter.xhtml#Fig2).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig2_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Structure of a graph


    1. Edges

    2. Nodes/vertices


    The edges are essentially the connections between the nodes/vertices, and nodes
    are where actual data resides. We can place graph-based networks into two main
    categories:


    1. Undirected graphs

    2. Directed graphs


    ## Undirected Graphs


    In this kind of graph structure, the edges or connections don’t have any direction,
    as in Figure [4-2](#478390_1_En_4_Chapter.xhtml#Fig2). The relationship will exist
    at both ends. For example, if person 1 in node 1 is a friend of person 2 in node
    2, then person 2 would also be a friend of person 1.


    ## Directed Graphs


    A directed graph is either cyclic or acyclic. The direction of the edge plays
    an important role, as all the edges in a graph go only one way, as in Figure [4-3](#478390_1_En_4_Chapter.xhtml#Fig3).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig3_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Directed graph


    Cyclic graphs have one or more cycles. A cycle is a path that begins and ends
    at the same node, as shown in Figure [4-4](#478390_1_En_4_Chapter.xhtml#Fig4).
    The information flows from node 1 to node 2, but there is another way back from
    node 2 to node 1. This is known as a cycle, or loop, graph.


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig4_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Cyclic graph


    There are no cycles in DAGs, so their benefits include the following:


    * A dynamic framework (configuration as code)

    * Extensibility—They support different types of task execution.

    * Scalability—They can perform an infinite number of tasks (worker nodes).


    Let’s now turn our attention to DAGs.


    # DAG Overview


    Because a DAG is a directed graph, information can flow in only one direction,
    and that’s forward, as illustrated in Figure [4-5](#478390_1_En_4_Chapter.xhtml#Fig5).
    So, if node 4 must be reached, the path is 1 ➤ 2 ➤ 4. In DAGs, there is no reverse
    path back to the starting node.


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig5_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Flow of information in a DAG


    All the tasks of jobs in Airflow must be defined in a DAG. So, the order of execution
    is defined in DAG form. For example, if task 8 has to be executed, task 1 and
    task 3 must be finished first, whereas for task 7 to be completed, there doesn’t
    have to be any dependence on other tasks, apart from task 3. Therefore, some of
    the independent tasks (2, 3) can take place irrespective of each other’s state
    as shown in Figure [4-5](#478390_1_En_4_Chapter.xhtml#Fig5). The order of execution
    of the tasks and interdependencies can be defined well before executing them with
    Airflow.


    All the configurations related to DAG are defined in a DAG definition file, which
    is a Python extension. It contains all the dependencies and configuration parameters,
    such as e-mail to be sent in case of failures, start time, end time, and number
    of retries. We also have to define all the tasks that are part of the DAG, in
    addition to the dependencies or sequence of the tasks.


    ## Operators


    As discussed previously, a DAG can contain multiple tasks. These tasks can be
    totally different from one another. One of the tasks can be a simple Python script;
    another can be a shell script or SQL query; and another can be a cloud-based Spark
    job. These tasks are defined inside of DAG definition file, using operators. Airflow
    provides a range of operators for different types of tasks. The most common ones
    are the following:


    1. Python operator (Python script)

    2. Bash operator (Shell script)

    3. SQL operator

    4. Docker operator

    5. Cloud operator (S3, Azure, Google)


    This flexibility of Airflow to run any type of task makes it very powerful, compared
    to other schedulers.


    A DAG file is simply a Python script that contains all the required configuration
    parameters to run the DAG. There are a few standard steps that must be taken,
    in order to create a DAG, as shown following:


    1. Importing required modules

    2. Declaring default arguments

    3. Instantiating the DAG object

    4. Defining all the tasks

    5. Declaring the order of execution/task dependencies


    In some areas, Airflow stands out, compared to alternatives, in terms of handling
    upstream and downstream dependencies more intelligently and in its ability to
    run historical loads. It also handles failures and blockers with complete transparency.


    # Installing Airflow


    There are multiple ways in which Airflow can be used, as it is designed to easily
    integrate with different environments. If we want to use Airflow locally, we can
    install and configure the Airflow environment locally. The other option is to
    make use of Docker, to containerize the Airflow application and run it on any
    platform, irrespective of the environment. The core benefit of using Docker is
    that it takes on itself the additional burden of managing dependencies and deployment.


    ## Airflow Using Docker


    One way to run Airflow is to create your own Docker image, with all the dependencies
    and components, but an Airflow Docker image that makes it very easy to run is
    already available from the Docker Hub. The steps to run Airflow are as follows:


    ```

    [In]: docker pull puckel/docker-airflow

    [In]:docker run -d -p 8080:8080 puckel/docker-airflow webserver

    ```


    Once you run the preceding command in a terminal, you can access port 8080, by
    going to `http://127.0.0.1:8080`, as shown in Figure [4-6](#478390_1_En_4_Chapter.xhtml#Fig6).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig6_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig6_HTML.png)


    Figure 4-6


    Airflow UI


    This is how the Airflow UI looks. It currently holds no DAGs and is a vanilla
    version. If you want to see the sample DAGs that come in Airflow by default, you
    simply have to add one extra argument while running Docker. To see which containers
    are running, we can use the following code:


    ```

    [In]: docker ps

    ```


    Once all the containers are listed, you can stop/kill the earlier container running
    Airflow, by using


    ```

    [In]: docker kill

    ```


    Now we run the following command with `LOAD_EX=y` as an additional parameter,
    as follows:


    ```

    [In]: docker run -d -p 8080:8080 -e LOAD_EX=y puckel/docker-airflow

    ```


    If we access the Airflow UI now, we get a list of all default DAGs, as shown in
    Figure [4-7](#478390_1_En_4_Chapter.xhtml#Fig7).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig7_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig7_HTML.png)


    Figure 4-7


    Airflow DAGs


    ### Airflow Setup (Mac)


    The first step is to ensure that Python is installed on the machine, and we can
    use the `brew install` command to install `python3`. Once Python is installed,
    we can install Airflow. It requires a home directory. `~/airflow` is the default,
    but a different location can also be chosen, based on preference.


    ```

    [In]:  brew install python python3

    [In]: pip install airflow

    [In]: mkdir ~/airflow

    [In]: export AIRFLOW_HOME=~/airflow

    [In]: cd ~/airflow

    [In]: airflow initdb

    [In]: airflow webserver -p 8080

    ```


    The final two steps are to initialize Airflow, using `initdb`, and accessing the
    UI on the preferred port.'
  raw: "## Graph Overview\n\nA typical graph data structure consists of two entities,\
    \ shown in Figure [4-2](#478390_1_En_4_Chapter.xhtml#Fig2).\n\n![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig2_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2\n\nStructure of a graph\n\n1.  Edges\n\n2.  Nodes/vertices\n\nThe\
    \ edges are essentially the connections between the nodes/vertices, and nodes\
    \ are where actual data resides. We can place graph-based networks into two main\
    \ categories:\n\n1.  Undirected graphs\n\n2.  Directed graphs\n\n### Undirected\
    \ Graphs\n\nIn this kind of graph structure, the edges or connections don’t have\
    \ any direction, as in Figure [4-2](#478390_1_En_4_Chapter.xhtml#Fig2). The relationship\
    \ will exist at both ends. For example, if person 1 in node 1 is a friend of person\
    \ 2 in node 2, then person 2 would also be a friend of person 1.\n\n### Directed\
    \ Graphs\n\nA directed graph is either cyclic or acyclic. The direction of the\
    \ edge plays an important role, as all the edges in a graph go only one way, as\
    \ in Figure [4-3](#478390_1_En_4_Chapter.xhtml#Fig3).\n\n![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig3_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig3_HTML.jpg)\n\
    \nFigure 4-3\n\nDirected graph\n\nCyclic graphs have one or more cycles. A cycle\
    \ is a path that begins and ends at the same node, as shown in Figure [4-4](#478390_1_En_4_Chapter.xhtml#Fig4).\
    \ The information flows from node 1 to node 2, but there is another way back from\
    \ node 2 to node 1\\. This is known as a cycle, or loop, graph.\n\n![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig4_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4\n\nCyclic graph\n\nThere are no cycles in DAGs, so their benefits\
    \ include the following:\n\n*   A dynamic framework (configuration as code)\n\n\
    *   Extensibility—They support different types of task execution.\n\n*   Scalability—They\
    \ can perform an infinite number of tasks (worker nodes).\n\nLet’s now turn our\
    \ attention to DAGs.\n\n## DAG Overview\n\nBecause a DAG is a directed graph,\
    \ information can flow in only one direction, and that’s forward, as illustrated\
    \ in Figure [4-5](#478390_1_En_4_Chapter.xhtml#Fig5). So, if node 4 must be reached,\
    \ the path is 1 ➤ 2 ➤ 4\\. In DAGs, there is no reverse path back to the starting\
    \ node.\n\n![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig5_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5\n\nFlow of information in a DAG\n\nAll the tasks of jobs in Airflow\
    \ must be defined in a DAG. So, the order of execution is defined in DAG form.\
    \ For example, if task 8 has to be executed, task 1 and task 3 must be finished\
    \ first, whereas for task 7 to be completed, there doesn’t have to be any dependence\
    \ on other tasks, apart from task 3\\. Therefore, some of the independent tasks\
    \ (2, 3) can take place irrespective of each other’s state as shown in Figure\
    \ [4-5](#478390_1_En_4_Chapter.xhtml#Fig5). The order of execution of the tasks\
    \ and interdependencies can be defined well before executing them with Airflow.\n\
    \nAll the configurations related to DAG are defined in a DAG definition file,\
    \ which is a Python extension. It contains all the dependencies and configuration\
    \ parameters, such as e-mail to be sent in case of failures, start time, end time,\
    \ and number of retries. We also have to define all the tasks that are part of\
    \ the DAG, in addition to the dependencies or sequence of the tasks.\n\n### Operators\n\
    \nAs discussed previously, a DAG can contain multiple tasks. These tasks can be\
    \ totally different from one another. One of the tasks can be a simple Python\
    \ script; another can be a shell script or SQL query; and another can be a cloud-based\
    \ Spark job. These tasks are defined inside of DAG definition file, using operators.\
    \ Airflow provides a range of operators for different types of tasks. The most\
    \ common ones are the following:\n\n1.  Python operator (Python script)\n\n2.\
    \  Bash operator (Shell script)\n\n3.  SQL operator\n\n4.  Docker operator\n\n\
    5.  Cloud operator (S3, Azure, Google)\n\nThis flexibility of Airflow to run any\
    \ type of task makes it very powerful, compared to other schedulers.\n\nA DAG\
    \ file is simply a Python script that contains all the required configuration\
    \ parameters to run the DAG. There are a few standard steps that must be taken,\
    \ in order to create a DAG, as shown following:\n\n1.  Importing required modules\n\
    \n2.  Declaring default arguments\n\n3.  Instantiating the DAG object\n\n4.  Defining\
    \ all the tasks\n\n5.  Declaring the order of execution/task dependencies\n\n\
    In some areas, Airflow stands out, compared to alternatives, in terms of handling\
    \ upstream and downstream dependencies more intelligently and in its ability to\
    \ run historical loads. It also handles failures and blockers with complete transparency.\n\
    \n## Installing Airflow\n\nThere are multiple ways in which Airflow can be used,\
    \ as it is designed to easily integrate with different environments. If we want\
    \ to use Airflow locally, we can install and configure the Airflow environment\
    \ locally. The other option is to make use of Docker, to containerize the Airflow\
    \ application and run it on any platform, irrespective of the environment. The\
    \ core benefit of using Docker is that it takes on itself the additional burden\
    \ of managing dependencies and deployment.\n\n### Airflow Using Docker\n\nOne\
    \ way to run Airflow is to create your own Docker image, with all the dependencies\
    \ and components, but an Airflow Docker image that makes it very easy to run is\
    \ already available from the Docker Hub. The steps to run Airflow are as follows:\n\
    \n```\n[In]: docker pull puckel/docker-airflow\n[In]:docker run -d -p 8080:8080\
    \ puckel/docker-airflow webserver\n```\n\nOnce you run the preceding command in\
    \ a terminal, you can access port 8080, by going to `http://127.0.0.1:8080`, as\
    \ shown in Figure [4-6](#478390_1_En_4_Chapter.xhtml#Fig6).\n\n![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig6_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig6_HTML.png)\n\
    \nFigure 4-6\n\nAirflow UI\n\nThis is how the Airflow UI looks. It currently holds\
    \ no DAGs and is a vanilla version. If you want to see the sample DAGs that come\
    \ in Airflow by default, you simply have to add one extra argument while running\
    \ Docker. To see which containers are running, we can use the following code:\n\
    \n```\n[In]: docker ps\n```\n\nOnce all the containers are listed, you can stop/kill\
    \ the earlier container running Airflow, by using\n\n```\n[In]: docker kill \n\
    ```\n\nNow we run the following command with `LOAD_EX=y` as an additional parameter,\
    \ as follows:\n\n```\n[In]: docker run -d -p 8080:8080 -e LOAD_EX=y puckel/docker-airflow\n\
    ```\n\nIf we access the Airflow UI now, we get a list of all default DAGs, as\
    \ shown in Figure [4-7](#478390_1_En_4_Chapter.xhtml#Fig7).\n\n![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig7_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig7_HTML.png)\n\
    \nFigure 4-7\n\nAirflow DAGs\n\n#### Airflow Setup (Mac)\n\nThe first step is\
    \ to ensure that Python is installed on the machine, and we can use the `brew\
    \ install` command to install `python3`. Once Python is installed, we can install\
    \ Airflow. It requires a home directory. `~/airflow` is the default, but a different\
    \ location can also be chosen, based on preference.\n\n```\n[In]:  brew install\
    \ python python3\n[In]: pip install airflow\n[In]: mkdir ~/airflow\n[In]: export\
    \ AIRFLOW_HOME=~/airflow\n[In]: cd ~/airflow\n[In]: airflow initdb\n[In]: airflow\
    \ webserver -p 8080\n```\n\nThe final two steps are to initialize Airflow, using\
    \ `initdb`, and accessing the UI on the preferred port."
