    ### Joins


    Sometimes we have to merge incoming data with batch data, to make it more comprehensive.
    In the following example, we will see how we can merge incoming data (stream dataframe)
    with a static dataframe that contains the full name of the apps. Let’s create
    a new static dataframe with two columns (`app` and `full_name`).


    ```python

