  raw: '### Data Input


    Any streaming application requires data, to be able to ingest and process data
    continuously. Therefore, there are multiple ways to provide data as input to the
    Structured Streaming platform.


    *   *Messaging systems*: Apache Kafka, Flume, and Logstash can be used to ingest
    real-time data and, hence, can easily become part of building streaming pipelines.
    The idea of using these tools is to capture all the data points as data is generated
    at the source application (web app, mobile app, IoT device) and pass it along
    to the Structured Streaming platform for further processing and analysis in a
    fault-tolerant and scalable manner.


    *   *File folders/directory*: Files are read continuously from the directory as
    a stream of data. A scheduler can be used to put the new files into the directory.
    The files can be in text, Parquet, or JSON format. The only condition is to have
    all the files available in the same format.


    ### Data Processing


    This is at the core of using streaming data for creating business value, as it
    can be applied to certain operations on the incoming data to get results. Such
    operations as aggregations, filtering, joins, sorting, etc., can be applied.


    ### Final Output


    Structured Streaming provides multiple options for users to save their output
    results, as required, and it can either be in *Append* or *Complete* mode. Append
    mode refers to adding only new results to the final output table, whereas Complete
    mode updates the entire results table at the final output location.


    1.  File directory sink


    2.  Console


    3.  Memory sink


    ## Building a Structured App


    In this final section of the chapter, we now build a Structured Streaming app
    that can read files from the local system folder as new files are added to the
    folder as stream data and apply all the operations on the new data and, finally,
    write the results in an output directory. The first step is to create the `SparkSession`
    object, in order to use Spark.


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark=SparkSession.builder.appName(''structured_streaming'').getOrCreate()

    [In]: import pyspark.sql.functions as F

    [In]: from pyspark.sql.types import *

    ```


    Then, we create some self-generated data that can be pushed into a respective
    local directory (`"csv folder"`), to be read by the Structured Streaming. The
    data that we will generate contains four columns and is in CSV format. We can
    also generate a Parquet format, if required.


    1.  User ID


    2.  App


    3.  Time spent (secs)


    4.  Age


    ```

    [In]:df_1=spark.createDataFrame([("XN203",''FB'',300,30),("XN201",''Twitter'',10,19),("XN202",''Insta'',500,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    ```


    Once we have created these dataframes, we can define the schema of these files,
    in order to read them using stream processing.


    ```

    [In]:schema=StructType().add("user_id","string").add("app","string").add("time_in_secs",
    "integer").add("age", "integer")

    ```


    Now that we have one file available in the local folder (`"csv folder"`), we can
    go ahead and read it as a stream dataframe. The API to read a static dataframe
    is similar to that for reading a streaming dataframe, the only difference being
    that we use `readStream`.


    ```

    [In]: data=spark.readStream.option("sep", ",").schema(schema).csv("csv_folder")

    ```


    To validate the schema of the dataframe, we can use the `printSchema` command.


    ```

    [In]: data.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figa_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figa_HTML.jpg)


    ### Operations


    Once we have the streaming dataframe available, we can apply multiple transformations,
    in order to get different results, based on specific requirements. In this example,
    we are going to see aggregations, sorting, filters, etc. First, is simply to count
    the records of each app in the dataframe. We can write the command as if we are
    applying the transformations on the static dataframe.


    ```

    [In]: app_count=data.groupBy(''app'').count()

    ```


    In order to view the results, we must mention the output mode, in addition to
    the desired location. In this example, we write the results in memory, but it
    can be written to console, specific cloud storage, or any other location. We also
    give the output mode as complete, in order to write results on the entire dataframe
    every time. Finally, we use a simple Spark SQL command to view the output from
    the query we executed on the streaming dataframe, by converting to a Pandas dataframe.


    ```

    [In]:query=(app_count.writeStream.queryName(''count_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from count_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figb_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figb_HTML.jpg)


    In this example, a query is being written to filter only the records of the Facebook
    (FB) app. The average time spent by each user on the FB app is then calculated.


    ```

    [In]: fb_data=data.filter(data[''app'']==''FB'')

    [In]: fb_avg_time=fb_data.groupBy(''user_id'').agg(F.avg("time_in_secs"))

    [In]:fb_query=(fb_avg_time.writeStream.queryName(''fb_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figc_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figc_HTML.jpg)


    Because there is only one dataframe currently in the local folder, we get the
    output of one user accessing FB and the time spent. In order to view more relative
    results, let’s push more self-generated data to the folder.


    ```

    [In]:df_2=spark.createDataFrame([("XN203",''FB'',100,30),("XN201",''FB'',10,19),("XN202",''FB'',2000,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    ```


    We can now safely assume that Spark Structured Streaming has read the new records
    and appended them into the streaming dataframe and, therefore, the new results
    for the same query will differ from the last one.


    ```

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figd_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figd_HTML.jpg)


    Now, we have the average time spent across all users using the FB app. Let’s add
    few more records to the folder.


    ```

    [In]:df_3=spark.createDataFrame([("XN203",''FB'',500,30),("XN201",''Insta'',30,19),("XN202",''Twitter'',100,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fige_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fige_HTML.jpg)


    In this example, we see aggregation and sorting of the query on the existing dataframe
    in the local folder. We group all the records by app and calculate the total time
    spent on each app, in decreasing order.


    ```

    [In]:app_df=data.groupBy(''app'').agg(F.sum(''time_in_secs'').alias(''total_time'')).orderBy(''total_time'',ascending=False)

    [In]:app_query=(app_df.writeStream.queryName(''app_wise_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from app_wise_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figf_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figf_HTML.jpg)


    We now have the results for each app and the total time spent by all users on
    the respective app, using a stream dataframe. Let’s add new records one more time
    and see the revised results for the same query.'
  trans: '

    ### 数据输入


    任何流式应用程序都需要数据，以便能够持续地摄取和处理数据。因此，有多种方式可以为 Structured Streaming 平台提供数据输入。


    - **消息系统**：`Apache Kafka`、`Flume` 和 `Logstash` 可用于摄取实时数据，因此可以轻松成为构建流式管道的一部分。使用这些工具的思路是，在源应用程序（Web
    应用、移动应用、物联网设备）生成数据时捕获所有数据点，并将其传递给 Structured Streaming 平台，以便以容错和可扩展的方式进行进一步处理和分析。


    - **文件文件夹/目录**：文件作为数据流从目录中持续读取。可以使用调度程序将新文件放入该目录。文件可以是文本、`Parquet` 或 `JSON` 格式。唯一的条件是所有文件必须采用相同的格式。


    ### 数据处理


    这是利用流式数据创造商业价值的核心，因为它可以对传入的数据应用某些操作来获得结果。可以应用诸如聚合、过滤、连接、排序等操作。


    ### 最终输出


    Structured Streaming 为用户提供了多种选项，以便根据需要保存输出结果，结果可以是 `Append` 或 `Complete` 模式。`Append`
    模式指仅将新结果添加到最终输出表中，而 `Complete` 模式则在最终输出位置更新整个结果表。


    1.  文件目录接收器

    2.  控制台

    3.  内存接收器


    ## 构建一个结构化应用程序


    在本章的最后一节中，我们将构建一个 Structured Streaming 应用程序，该应用程序可以从本地系统文件夹读取文件（当新文件作为流数据添加到文件夹时），对新数据应用所有操作，最后将结果写入输出目录。第一步是创建
    `SparkSession` 对象，以便使用 Spark。


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark=SparkSession.builder.appName(''structured_streaming'').getOrCreate()

    [In]: import pyspark.sql.functions as F

    [In]: from pyspark.sql.types import *

    ```


    然后，我们创建一些自生成数据，这些数据可以被推送到相应的本地目录（`"csv folder"`），以供 Structured Streaming 读取。我们将生成的数据包含四列，格式为
    CSV。如果需要，我们也可以生成 Parquet 格式。


    1.  用户 ID

    2.  应用程序

    3.  花费时间（秒）

    4.  年龄


    ```

    [In]:df_1=spark.createDataFrame([("XN203",''FB'',300,30),("XN201",''Twitter'',10,19),("XN202",''Insta'',500,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    ```


    创建这些数据框后，我们可以定义这些文件的模式，以便使用流处理读取它们。


    ```

    [In]:schema=StructType().add("user_id","string").add("app","string").add("time_in_secs",
    "integer").add("age", "integer")

    ```


    现在，本地文件夹（`"csv folder"`）中已有一个文件，我们可以继续将其作为流数据框读取。读取静态数据框的 API 与读取流数据框的 API 类似，唯一的区别是我们使用
    `readStream`。


    ```

    [In]: data=spark.readStream.option("sep", ",").schema(schema).csv("csv_folder")

    ```


    为了验证数据框的模式，我们可以使用 `printSchema` 命令。


    ```

    [In]: data.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figa_HTML.jpg](img/478390_1_En_3_Figa_HTML.jpg)


    ### 操作


    一旦我们有了流数据框，就可以应用多种转换，以便根据特定需求获得不同的结果。在本例中，我们将看到聚合、排序、过滤等操作。首先，简单地统计数据框中每个应用程序的记录数。我们可以像在静态数据框上应用转换一样编写命令。


    ```

    [In]: app_count=data.groupBy(''app'').count()

    ```


    为了查看结果，除了指定目标位置外，我们还必须指定输出模式。在本例中，我们将结果写入内存，但也可以写入控制台、特定云存储或任何其他位置。我们还指定输出模式为
    `complete`，以便每次都将结果写入整个数据框。最后，我们使用一个简单的 Spark SQL 命令，通过将流数据框上的查询结果转换为 Pandas 数据框来查看输出。


    ```

    [In]:query=(app_count.writeStream.queryName(''count_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from count_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figb_HTML.jpg](img/478390_1_En_3_Figb_HTML.jpg)


    在本例中，编写了一个查询来仅过滤 Facebook（FB）应用程序的记录。然后计算每个用户在 FB 应用程序上花费的平均时间。


    ```

    [In]: fb_data=data.filter(data[''app'']==''FB'')

    [In]: fb_avg_time=fb_data.groupBy(''user_id'').agg(F.avg("time_in_secs"))

    [In]:fb_query=(fb_avg_time.writeStream.queryName(''fb_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figc_HTML.jpg](img/478390_1_En_3_Figc_HTML.jpg)


    由于本地文件夹中当前只有一个数据框，我们得到了一个用户访问 FB 以及花费时间的输出。为了查看更多相关结果，让我们向文件夹中推送更多自生成数据。


    ```

    [In]:df_2=spark.createDataFrame([("XN203",''FB'',100,30),("XN201",''FB'',10,19),("XN202",''FB'',2000,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    ```


    现在我们可以有把握地假设，Spark Structured Streaming 已经读取了新记录并将其追加到流数据框中，因此，相同查询的新结果将与上次不同。


    ```

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figd_HTML.jpg](img/478390_1_En_3_Figd_HTML.jpg)


    现在，我们得到了所有用户使用 FB 应用程序的平均时间。让我们再向文件夹中添加一些记录。


    ```

    [In]:df_3=spark.createDataFrame([("XN203",''FB'',500,30),("XN201",''Insta'',30,19),("XN202",''Twitter'',100,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fige_HTML.jpg](img/478390_1_En_3_Fige_HTML.jpg)


    在本例中，我们看到了对本地文件夹中现有数据框的查询进行聚合和排序。我们按应用程序对所有记录进行分组，并计算每个应用程序的总花费时间，按降序排列。


    ```

    [In]:app_df=data.groupBy(''app'').agg(F.sum(''time_in_secs'').alias(''total_time'')).orderBy(''total_time'',ascending=False)

    [In]:app_query=(app_df.writeStream.queryName(''app_wise_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from app_wise_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figf_HTML.jpg](img/478390_1_En_3_Figf_HTML.jpg)


    现在，我们使用流数据框得到了每个应用程序以及所有用户在该应用程序上花费的总时间的结果。让我们再添加一次新记录，并查看相同查询的修订结果。

