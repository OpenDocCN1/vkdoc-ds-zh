    ## Reshaping a Dataframe for Clustering


    We pivot the data on user ID and music category and fill the values with the total
    count of songs the user has listened to. We use the `crosstab` function to pivot
    the data.


    ```

    [In]: feature_df=df.stat.crosstab("user_id", "music category")

