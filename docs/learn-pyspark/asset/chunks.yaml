  trans: "\n### 神经元计算\n\n现在我们已经对不同激活函数有了基本了解，让我们通过一个例子来理解神经元内部实际输出的计算过程。假设我们有两个输入，`X1`\
    \ 和 `X2`，其值分别为 `0.2` 和 `0.7`，权重分别为 `0.05` 和 `0.03`。求和函数计算输入信号的总和，如图 8-8 和 8-9\
    \ 所示。\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig8_HTML.jpg](img/478390_1_En_8_Fig8_HTML.jpg)\n\
    \n图 8-8\n\n神经元计算\n\n求和过程如下：\n\n```\nsum = X1 * W1 + X2 * W2\n```\n\n```\nsum =\
    \ 0.2 * 0.05 + 0.7 * 0.03\n```\n\n```\nsum = 0.01 + 0.021\n```\n\n```\nsum = 0.031\n\
    ```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig9_HTML.jpg](img/478390_1_En_8_Fig9_HTML.jpg)\n\
    \n图 8-9\n\n求和\n\n下一步是将这个总和传递给激活函数。我们考虑使用 sigmoid 函数，无论输入如何，它都会返回 0 到 1 之间的值。sigmoid\
    \ 函数将按如下方式计算该值：\n\n```\nf(x) = 1 / (1 + e^(-x))\n```\n\n```\nf(sum) = 1 / (1 +\
    \ e^(-sum))\n```\n\n```\nf(0.031) = 1 / (1 + e^(-0.031))\n```\n\n```\nf(0.031)\
    \ = 0.5077\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig10_HTML.jpg](img/478390_1_En_8_Fig10_HTML.jpg)\n\
    \n图 8-10\n\n神经元激活\n\n因此，这个单个神经元的输出等于 `0.5077`。现在我们已经了解了单个神经元如何运作，接下来快速了解一下多个连接的神经元如何协同工作来计算输出。\n\
    \n## 训练过程：神经网络\n\n当我们组合多个神经元时，就构成了一个神经网络。大多数简单基础的神经网络可以仅使用输入和输出神经元构建，如图 8-11 所示。\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig11_HTML.png](img/478390_1_En_8_Fig11_HTML.png)\n\
    \n图 8-11\n\n基础神经网络\n\n使用此类神经网络的挑战在于，它只能学习线性关系，在输入与输出关系为非线性的情况下表现不佳。正如我们所知，在现实场景中，关系很少是简单线性的。因此，我们必须在输入层和输出层之间引入额外的神经元层，以增强网络学习不同类型非线性关系的能力。这个额外的神经元层被称为隐藏层，如图\
    \ 8-12 所示。它负责将非线性引入网络的学习过程。神经网络也被称为通用逼近器，因为它们能够逼近输入和输出变量之间的任何关系，无论其本质多么复杂和非线性。这在很大程度上取决于网络中隐藏层的数量以及每个隐藏层中的神经元总数。只要有足够数量的隐藏层，网络就能在映射这种关系方面表现出色。\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig12_HTML.png](img/478390_1_En_8_Fig12_HTML.png)\n\
    \n图 8-12\n\n多层神经网络\n\n神经网络的核心在于各种连接（红线）以及与这些连接相关的不同权重。神经网络的训练主要包括调整这些权重，使模型能够以更高的准确度进行预测。为了理解神经网络是如何训练的，让我们分解一下网络训练的步骤。\n\
    \n> 步骤 1. 获取输入值，并计算传递给隐藏神经元的输出值，如图 8-13 所示。用于第一次求和迭代的权重是随机生成的。\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig13_HTML.jpg](img/478390_1_En_8_Fig13_HTML.jpg)\n\
    \n图 8-13\n\n神经网络训练过程\n\n> 另一个传递的额外组件是偏置神经元输入，如图 8-14 所示。这主要用于当您希望即使输入值为零也能获得非零输出的情况。\n\
    \n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig14_HTML.jpg](img/478390_1_En_8_Fig14_HTML.jpg)\n\
    \n图 8-14\n\n偏置组件\n\n> 步骤 2. 隐藏层神经元现在使用来自上一层（输入层）的输入，经历相同的过程来计算输出。这个隐藏层输出作为最终输出神经元（红色）计算的输入，如图\
    \ 8-15 所示。\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig15_HTML.jpg](img/478390_1_En_8_Fig15_HTML.jpg)\n\
    \n图 8-15\n\n输出计算\n\n> 步骤 3. 一旦我们得到最终输出，就将其与实际输出进行比较，并将误差反向传播到网络中，以调整连接的权重，从而减少训练数据上的整体误差，如图\
    \ 8-16 所示。这个过程被称为反向传播。\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig16_HTML.jpg](img/478390_1_En_8_Fig16_HTML.jpg)\n\
    \n图 8-16\n\n反向传播\n\n> 步骤 4. 根据输出重新调整连接的权重，以最小化网络产生的整体误差，直到训练数据上的误差不再减少为止。\n> \n\
    > 步骤 5. 现在我们有了权重的最终版本，网络根据更新后的权重计算新的输出值，如图 8-17 所示。\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig17_HTML.jpg](img/478390_1_En_8_Fig17_HTML.jpg)\n\
    \n图 8-17\n\n最终输出\n"
- fmt: "# Building a Multilayer Perceptron Model\n\nWhen it comes to using Deep Learning\
    \ in Spark, there are multiple options. Depending on the exact requirement and\
    \ available infrastructure, the relevant approach can be used. On a high level,\
    \ there are close to 4 important deep learning libraries which can be used with\
    \ Spark.\n\n1. Spark’s MLlib\n2. TensorflowOnSpark\n3. Deep Learning Pipelines\n\
    4. DeepLearning4J\n\nFor simplicity, we will build a multilayer perceptron, using\
    \ Spark. The dataset that we are going to use for this exercise contains close\
    \ to 75k records, with some sample customer journey data on a retail web site.\
    \ There are 16 input features to predict whether the visitor is likely to convert.\
    \ We have a balanced target class in this dataset. We will use `MultilayerPerceptronClassifier`\
    \ from Spark’s Machine Learning library. We start by importing a few important\
    \ dependencies.\n\n```\n[In]: from pyspark.sql import SparkSession\n[In]: spark\
    \ = SparkSession.builder.appName('deep_learning').getOrCreate()\n[In]: import\
    \ os\n[In]: import numpy as np\n[In]: import pandas as pd\n[In]: from pyspark.sql.types\
    \ import *\n```\n\nNow we load the dataset into Spark, for feature engineering\
    \ and model training. As mentioned, there are 16 input features and 1 output column\
    \ (`'Orders_Normalized'`).\n\n```\n[In]: data = spark.read.csv('dl_data.csv',\
    \ header=True, inferSchema=True)\n[In]: data.printSchema()\n[Out]:\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Figa_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Figa_HTML.jpg)\n\
    \nWe change the name of the label column from `'Orders_Normalized'` to `'label'`,\
    \ to be able to train the model.\n\n```\n[In]: data = data.withColumnRenamed('Orders_Normalized',\
    \ 'label')\n[In]: data.printSchema()\n[Out]:\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Figb_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Figb_HTML.jpg)\n\
    \nBecause we are dealing with both numerical and categorical columns, we must\
    \ write a pipeline to create features combining both for model training. Therefore,\
    \ we import `Pipeline`, `VectorAssembler`, and `OneHotEncoder`, to create feature\
    \ vectors. We will also import `MultiClassificationEvaluator` and `MultilayerPerceptron`,\
    \ to check the performance of the model.\n\n```\n[In]: from pyspark.ml.feature\
    \ import OneHotEncoder, VectorAssembler, StringIndexer\n[In]: from pyspark.ml\
    \ import Pipeline\n[In]: from pyspark.sql.functions import udf, StringType\n[In]:\
    \ from pyspark.ml.evaluation import MulticlassClassificationEvaluator\n[In]: from\
    \ pyspark.ml.classification import MultilayerPerceptronClassifier\n```\n\nWe now\
    \ split the data into train, test, and validation sets, for training of the model.\n\
    \n```\n[In]: train, validation, test  = data.randomSplit([0.7, 0.2, 0.1], 1234)\n\
    ```\n\nWe create separate lists of categorical columns and numeric columns, based\
    \ on datatypes.\n\n```\n[In]: categorical_columns = [item[0] for item in data.dtypes\
    \ if item[1].startswith('string')]\n[In]: numeric_columns = [item[0] for item\
    \ in data.dtypes if item[1].startswith('double')]\n[In]: indexers = [StringIndexer(inputCol=column,\
    \ outputCol='{0}_index'.format(column)) for column in categorical_columns]\n```\n\
    \nWe now create consolidated feature vectors, using `VectorAssembler`.\n\n```\n\
    [In]: featuresCreator = VectorAssembler(inputCols=[indexer.getOutputCol() for\
    \ indexer in indexers] + numeric_columns, outputCol=\"features\")\n[In]: layers\
    \ = [len(featuresCreator.getInputCols()), 4, 2, 2]\n```\n\nThe next step is to\
    \ build the `MultilayerPerceptron` model. One can play around with different hyperparameters,\
    \ such as number of layers and maxiters, to improve the performance of the model.\n\
    \n```\n[In]: classifier = MultilayerPerceptronClassifier(labelCol='label', featuresCol=\"\
    features\", maxIter=100, layers=layers, blockSize=128, seed=1234)\n```\n\nNow\
    \ that we have defined every stage, we add all these steps to the pipeline and\
    \ run it on the training data.\n\n```\n[In]: pipeline = Pipeline(stages=indexers\
    \ + [featuresCreator, classifier])\n[In]: model = pipeline.fit(train)\n```\n\n\
    We now calculate the predictions of the model on train, test, and validation datasets.\n\
    \n```\n[In]: train_output_df = model.transform(train)\n[In]: validation_output_df\
    \ = model.transform(validation)\n[In]: test_output_df = model.transform(test)\n\
    [In]: train_predictionAndLabels = train_output_df.select(\"prediction\", \"label\"\
    )\n[In]: validation_predictionAndLabels = validation_output_df.select(\"prediction\"\
    , \"label\")\n[In]: test_predictionAndLabels = test_output_df.select(\"prediction\"\
    , \"label\")\n```\n\nWe define three different metrics, to evaluate the performance\
    \ of the model.\n\n```\nmetrics = ['weightedPrecision', 'weightedRecall', 'accuracy']\n\
    [In]: for metric in metrics:\nevaluator = MulticlassClassificationEvaluator(metricName=metric)\n\
    print('Train ' + metric + ' = ' + str(evaluator.evaluate(train_predictionAndLabels)))\n\
    print('Validation ' + metric + ' = ' + str(evaluator.evaluate(validation_predictionAndLabels)))\n\
    print('Test ' + metric + ' = ' + str(evaluator.evaluate(test_predictionAndLabels)))\n\
    ```\n\nAs you can see, the deep learning model is doing reasonably well on the\
    \ test data, based on the input signal.\n\n```\n[Out]:\n```\n\n![../images/478390_1_En_8_Chapter/478390_1_En_8_Figc_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Figc_HTML.jpg)\n\
    \n## Conclusion\n\nThis chapter covered the internals of the basic building blocks\
    \ of neural networks—artificial neurons—and the entire training process of a neural\
    \ network. Different ways in which deep learning models can be constructed were\
    \ mentioned, and, using Spark, a multilayer perceptron model was built.\n\n##\
    \ Index\n\n### A\n\nActivation function  \nAggregation  \n`collect` functionality\
    \  \n`groupBy` function  \noperations  \n`orderBy` functionality  \nPySpark  \n\
    `sort` functionality  \n`sql` function  \nstages  \nAirflow framework  \ngraphs\
    \  \ndirected  \nundirected  \ninstallation  \nsetup (Mac)  \nusing Docker  \n\
    workflows  \nAkaike information criterion (AIC)\n\n### B\n\nBaseline method  \n\
    Bash operator  \nBatch data  \nBatch *vs.* stream  \nbatch data  \nspark streaming\
    \  \nstream processing  \nBig data processing  \nBinarizer  \nBinaryClassEvaluator\
    \  \nBinning/bucketing\n\n### C\n\nChi-square test  \nClassification model  \n\
    build  \ndataframe, explore  \ndata transformation  \nhyperparameter tuning  \n\
    load dataset  \nMLlib  \nmodel training  \ntraining and test sets  \nCloud-based\
    \ environments  \nCloud operator  \nCollect list  \nCommand-line interface (CLI)\
    \  \nContingency table  \nCore architecture, Spark  \ncomponents  \ngraph X  \n\
    MLlib  \nprogramming language APIs  \nresource management  \ncluster mangers \
    \ \ntask  \nworker  \nSQL  \nstorage  \nstructured streaming  \nCorrelations \
    \ \nCyclic graph\n\n### D, E\n\nDAG (See Directed acyclic graph)  \nDatabricks\
    \  \ncluster creation  \nlist  \nlogin  \nnotebook creation  \nspark adoption\
    \ survey  \nweb page  \nDataframe  \nclustering  \n`crosstab` function  \n`StandardScaler`\
    \  \n`VectorAssembler`  \nDataframe, subset  \n`filter`  \n`select`  \nData processing\
    \  \naggregations  \ndataframe, subset  \njoins  \npivoting  \n`sparkSession`\
    \ object  \nUDFs  \nwindow functions  \nDecision tree classifier  \nbuild and\
    \ train  \ntest data, evaluation  \nDecision tree regression  \nbuild and train\
    \  \nmodel performance, evaluate  \noverfitting  \nDeep learning  \nactivation\
    \ function  \nhyperbolic tangent  \nReLUs  \nsigmoid  \nmultilayer perception\
    \ model  \nneural network *vs.* artificial networks  \nbackpropagation  \nbias\
    \ component  \nchallenge  \nmultiple layer  \noutput  \ntraining process  \nneuron\
    \  \ncomputation time line  \nDirected acyclic graph (DAG)  \ncreation  \ndefault\
    \ arguments  \ndependencies, mentioning  \nairflow code details tab  \ngraph view\
    \  \ninitialization  \ntree view  \ntrigger UI  \nimport libraries  \ninformation\
    \ flow  \noperators  \npython extension  \ntasks  \ndeclaring  \nDockers\n\n###\
    \ F\n\nFile folders/directory  \n`fillna` function"
  raw: '## Building a Multilayer Perceptron Model


    When it comes to using Deep Learning in Spark, there are multiple options.Depending
    on the exact requirement and available infrastructure, the relevant approach can
    be used. On a high level,there are close to 4 important deep learning libraries
    which can be used with Spark.


    1.  Spark’s MLlib


    2.  TensorflowOnSpark


    3.  Deep Learning Pipelines


    4.  DeepLearning4J


    For simplicity, we will build a multilayer perceptron, using Spark. The dataset
    that we are going to use for this exercise contains close to 75k records, with
    some sample customer journey data on a retail web site. There are 16 input features
    to predict whether the visitor is likely to convert. We have a balanced target
    class in this dataset. We will use `MultilayerPerceptronClassifier` from Spark’s
    Machine Learning library. We start by importing a few important dependencies.


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark = SparkSession.builder.appName(''deep_learning'').getOrCreate()

    [In]: import os

    [In]: import numpy as np

    [In]: import pandas as pd

    [In]: from pyspark.sql.types import *

    ```


    Now we load the dataset into Spark, for feature engineering and model training.
    As mentioned, there are 16 input features and 1 output column (`''Orders_Normalized''`).


    ```

    [In]: data = spark.read.csv(''dl_data.csv'', header=True, inferSchema=True)

    [In]: data.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Figa_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Figa_HTML.jpg)


    We change the name of the label column from `''Orders_Normalized''` to `''label''`,
    to be able to train the model.


    ```

    [In]: data = data.withColumnRenamed(''Orders_Normalized'', ''label'')

    [In]: data.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Figb_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Figb_HTML.jpg)


    Because we are dealing with both numerical and categorical columns, we must write
    a pipeline to create features combining both for model training. Therefore, we
    import `Pipeline`, `VectorAssembler`, and `OneHotEncoder`, to create feature vectors.
    We will also import `MultiClassificationEvaluator` and `MultilayerPerceptron`,
    to check the performance of the model.


    ```

    [In]: from pyspark.ml.feature import OneHotEncoder, VectorAssembler, StringIndexer

    [In]: from pyspark.ml import Pipeline

    [In]: from pyspark.sql.functions import udf, StringType

    [In]: from pyspark.ml.evaluation import MulticlassClassificationEvaluator

    [In]: from pyspark.ml.classification import MultilayerPerceptronClassifier

    ```


    We now split the data into train, test, and validation sets, for training of the
    model.


    ```

    [In]: train, validation, test  = data.randomSplit([0.7, 0.2, 0.1], 1234)

    ```


    We create separate lists of categorical columns and numeric columns, based on
    datatypes.


    ```

    [In]: categorical_columns = [item[0] for item in data.dtypes if item[1].startswith(''string'')]

    [In]: numeric_columns = [item[0] for item in data.dtypes if item[1].startswith(''double'')]

    [In]: indexers = [StringIndexer(inputCol=column, outputCol=''{0}_index''.format(column))
    for column in categorical_columns]

    ```


    We now create consolidated feature vectors, using `VectorAssembler`.


    ```

    [In]: featuresCreator = VectorAssembler(inputCols=[indexer.getOutputCol() for
    indexer in indexers] + numeric_columns, outputCol="features")

    [In]: layers = [len(featuresCreator.getInputCols()), 4, 2, 2]

    ```


    The next step is to build the `MultilayerPerceptron` model . One can play around
    with different hyperparameters, such as number of layers and maxiters, to improve
    the performance of the model.


    ```

    [In]: classifier = MultilayerPerceptronClassifier(labelCol=''label'', featuresCol="features",
    maxIter=100, layers=layers, blockSize=128, seed=1234)

    ```


    Now that we have defined every stage, we add all these steps to the pipeline and
    run it on the training data.


    ```

    [In]: pipeline = Pipeline(stages=indexers + [featuresCreator, classifier])

    [In]: model = pipeline.fit(train)

    ```


    We now calculate the predictions of the model on train, test, and validation datasets.


    ```

    [In]: train_output_df = model.transform(train)

    [In]: validation_output_df = model.transform(validation)

    [In]: test_output_df = model.transform(test)

    [In]: train_predictionAndLabels = train_output_df.select("prediction", "label")

    [In]: validation_predictionAndLabels = validation_output_df.select("prediction",
    "label")

    [In]: test_predictionAndLabels = test_output_df.select("prediction", "label")

    ```


    We define three different metrics, to evaluate the performance of the model.


    ```

    metrics = [''weightedPrecision'', ''weightedRecall'', ''accuracy'']

    [In]: for metric in metrics:

    evaluator = MulticlassClassificationEvaluator(metricName=metric)

    print(''Train '' + metric + '' = '' + str(evaluator.evaluate(train_predictionAndLabels)))

    print(''Validation '' + metric + '' = '' + str(evaluator.evaluate(validation_predictionAndLabels)))

    print(''Test '' + metric + '' = '' + str(evaluator.evaluate(test_predictionAndLabels)))

    ```


    As you can see, the deep learning model is doing reasonably well on the test data,
    based on the input signal.


    ```

    [Out]:

    ```


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Figc_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Figc_HTML.jpg)


    ## Conclusion


    This chapter covered the internals of the basic building blocks of neural networks—artificial
    neurons—and the entire training process of a neural network. Different ways in
    which deep learning models can be constructed were mentioned, and, using Spark,
    a multilayer perceptron model was built.


    ### Index


    ### A


    Activation function Aggregation collect functionality groupBy function operations
    orderBy functionality PySpark sort functionality sql function stages Airflow framework
    graphs directed undirected installation setup (Mac) using Docker workflows Akaike
    information criterion (AIC)


    ### B


    Baseline method Bash operator Batch data Batch *vs.* stream batch data spark streaming
    stream processing Big data processing Binarizer BinaryClassEvaluator Binning/bucketing


    ### C


    Chi-square test Classification model, build dataframe, explore data transformation
    hyperparameter tuning load dataset MLlib model training training and test sets
    Cloud-based environments Cloud operator Collect list Command-line interface (CLI)
    Contingency table Core architecture, Spark components graph X MLlib programming
    language APIs resource management cluster mangers task worker SQL storage structured
    streaming Correlations Cyclic graph


    ### D, E


    DAG SeeDirected acyclic graph (DAG Databricks cluster creation list login notebook
    creation spark adoption survey web page Dataframe clustering crosstab function
    StandardScaler VectorAssembler Dataframe, subset filter select Data processing
    aggregations dataframe, subset joins pivoting sparkSession object UDFs window
    functions Decision tree classifier build and train test data, evaluation Decision
    tree regression build and train model performance, evaluate overfitting Deep learning
    activation function hyperbolic tangent ReLUs sigmoid multilayer perception model
    neural network *vs.* artificial networks backpropagation bias component challenge
    multiple layer output training process neuron computation time line Directed acyclic
