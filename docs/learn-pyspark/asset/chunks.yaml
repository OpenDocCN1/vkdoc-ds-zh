  raw: '## Building a Linear Regression Model


    Linear regression refers to modeling the relationship between a set of independent
    variables and the output or dependent (numerical) variables. If the input variables
    include more than one variable, this is known as multivariable linear regression.
    In short, it is assumed that the dependent variable is a linear combination of
    other independent variables.


    ![$$ \overline{y}={B}_0+{B}_1\ast {X}_1+{B}_2\ast {X}_{2+\dots } $$](images/478390_1_En_6_Chapter/478390_1_En_6_Chapter_TeX_Equa.png)


    Here *X*[1], *X*[2], … are the independent variables that are used to predict
    the output variable. The output of the linear regression is a straight line, which
    minimizes the actual vs. predicted values. A linear regression model cannot handle
    nonlinear data, as it’s only possible to model linearly separable data, therefore
    polynomial regression is used for nonlinear data, and the output is generally
    a curve, instead of a straight line, as shown in Figure [6-4](#478390_1_En_6_Chapter.xhtml#Fig4).


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Fig4_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Types of regression


    Linear regression also assumes that data is normally distributed, in order to
    improve prediction. Linear regression is one of the ways to predict continuous
    values, and you will see now how we can use other alternatives, to predict numerical
    output.


    The following sections focus on solving regression tasks, using multiple machine
    learning algorithms. I will begin with data ingestion and exploratory data analysis
    and then build models. The steps 1 to 4 will be the same for all the regression
    models.


    ### Note


    Complete datasets, along with the relevant code, are available for reference from
    the GitHub repository for this book and execute best on Spark 2.3 and higher versions.


