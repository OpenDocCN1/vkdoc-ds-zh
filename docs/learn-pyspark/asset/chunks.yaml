- fmt: '### Building Clusters with K-Means


    One of the key questions to ask before a clustering exercise is: “How many clusters
    should be formed from the data?” One way to approach this issue is with the Elbow
    method, by which we try to plot the total sum of squared errors within a cluster
    against the number of clusters. This gives us a sense of what’s a good number
    of groups that can be formed from the given data. Basically, we apply k-means
    for a set consisting of a pre-decided number of clusters (2–10) and visualize
    the errors against it. Wherever there is an elbow kind of shape forming on the
    chart, that is a good number to pick for `k`.


    ```

    [In]: errors=[]

    for k in range(2,10):

    kmeans = KMeans(featuresCol=''scaledFeatures'',k=k)

    model = kmeans.fit(cluster_final_data)

    wssse = model.computeCost(cluster_final_data)

    errors.append(wssse)

    print("With K={}".format(k))

    print("Within Set Sum of Squared Errors = " + str(wssse))

    print(''--''*30)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figk_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Figk_HTML.jpg)


    ```

    [In]: cluster_number = range(2,10)

    [In]: plt.scatter(cluster_number,errors)

    [In]: plt.xlabel(''clusters'')

    [In]: plt.ylabel(''WSSE'')

    [In]: plt.show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig4_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fig4_HTML.jpg)


    **Figure 7-4** Elbow chart


    In our case, there are multiple elbows being formed in the chart. Therefore, we
    can choose either `4`, `6`, or `8` as the value of `k`. One thing to remember
    is that there is no correct answer in clustering. You can have different clusters
    from the same data, based on techniques being used, as the initiation points differ
    for every technique. Let’s go ahead and chose the value of `k` as `6`.


    ```

    [In]: kmeans6 = KMeans(featuresCol=''scaledFeatures'',k=6)

    [In]: model_k6 = kmeans6.fit(cluster_final_data)

    [In]: model_k6.transform(cluster_final_data).groupBy(''prediction'').count().show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figl_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Figl_HTML.jpg)


    From our data, we see that there is one cluster in which the majority of users
    belong. Apart from that, there are five more clusters with lesser values. Now,
    we add this prediction to the existing dataframe, to be able to visualize the
    clusters.


    ```

    [In]: model_k6.transform(cluster_final_data).show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figm_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Figm_HTML.jpg)


    ```

    [In]: cluser_prediction=model_k6.transform(cluster_final_data)

    [In]: cluser_prediction.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fign_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fign_HTML.jpg)


    Because we’re dealing with multiple dimensions, it will become difficult to visualize
    the data with cluster numbers. Therefore, we reduce the total number of dimensions,
    using the PCA (principal component analysis) technique. In previous chapters,
    you have already seen how to use PCA. We now reduce the original number of features
    from 21 to just 3, using PCA, as shown following.


    ```

    [In]: from pyspark.ml.feature import PCA

    [In]: from pyspark.ml.linalg import Vectors

    [In]: pca = PCA(k=3, inputCol="scaledFeatures", outputCol="pca_features")

    [In]: pca_model = pca.fit(cluser_prediction)

    [In]: result = pca_model.transform(cluser_prediction).select(''user_id_music category'',"pca_features",''prediction'')

    [In]: result.show(truncate=False)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figo_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Figo_HTML.jpg)


    Finally, we convert the PCA dataframe to a Pandas dataframe, in addition to creating
    separate columns (`x`, `y`, `z`) from the PCA feature column, by making individual
    columns from the list.


    ```

    [In]: clusters = result.toPandas().set_index(''user_id_music category'')

    [In]: clusters.head(10)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figp_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Figp_HTML.jpg)


    ```

    [In]: clusters[[''x'',''y'',''z'']]=pd.DataFrame(clusters.pca_features.values.tolist(),
    index= clusters.index)

    [In]: del clusters[''pca_features'']

    [In]: clusters.head(10)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figq_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Figq_HTML.jpg)


    Now that we have three-dimensional (3D) data representing the original features,
    and the cluster prediction by k-means, we can use 3D plotting techniques, to visualize
    these clusters on a 3D plot.


    ```

    [In]: from mpl_toolkits.mplot3d import Axes3D

    [In]: cluster_vis= plt.figure(figsize=(10,10)).gca(projection=''3d'')

    [In]: cluster_vis.scatter(clusters.x, clusters.y, clusters.z, c=clusters.prediction)

    [In]: cluster_vis.set_xlabel(''x'')

    [In]: cluster_vis.set_ylabel(''y'')

    [In]: cluster_vis.set_zlabel(''z'')

    [In]: plt.show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig5_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fig5_HTML.jpg)


    **Figure 7-5** Clusters Visualization


    One of the follow-up activities after this clustering exercise can be to assign
    different personas to the groups, based on the attribute values. This can be a
    manual activity and can take some time to come up with meaningful personas. Once
    created, businesses can use these in numerous ways to market and target specific
    users.


    ## Conclusion


    In this chapter, you learned the difference between supervised and unsupervised
    machine learning techniques. You also saw how to build clusters from raw data,
    using k-means clustering. The method to find the optimal value of `k` and how
    to visualize the final clusters formed by the k-means algorithm were then explained.


