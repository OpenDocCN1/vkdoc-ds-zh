    ## Building a Classification Model


    In this section, you will see how we can use Spark’s Machine Learning library
    (MLlib) to build classification models. Because there are dedicated chapters for
    supervised and unsupervised ML models later in the book, in this section, I will
    not go too deep into the details but focus instead on the overall process of building
    a model with the MLlib. For our example, we will use the data inspired by the
    dataset provided by Giulio Palombo in his book *A Collection of Data Science Take-Home
    Challenges*. The dataset contains information pertaining to a few customers who
    have applied for new bank loans and whether they will default. We will build a
    binary classification model to predict whether a particular customer should be
    granted a loan, based on the knowledge gleaned from the model. The following core
    steps are used to build a classification model:


    1.  Load the dataset.


    2.  Perform exploratory data analysis.


    3.  Perform required data transformations.


    4.  Split data into train and test subsets.


    5.  Train and evaluate the baseline model on train data.


    6.  Perform hyperparameter tuning.


    7.  Build a final model with the best parameters.


