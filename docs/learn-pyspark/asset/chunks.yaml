    # 7. Unsupervised Machine Learning


    As the name suggests, unsupervised machine learning does not include finding relationships
    between input and output. To be honest, there is no output that we try to predict
    in unsupervised learning. It is mainly used to group together the features that
    seem to be similar to one another in some sense. These can be the distance between
    those features or some sort of similarity metric. In this chapter, I will touch
    on some unsupervised machine learning techniques and build one of the machine
    learning models, using PySpark to categorize users into groups and, later, to
    visualize those groups as well.


    ## Unsupervised Machine Learning Primer


    As suggested, unsupervised learning does not aim to map the relationship between
    input and output; rather, it tries to group values that are similar to one another.
    There is no training that takes place on the input data. Rather, it does this
    by finding the underlying signals and patterns in the data, to form groups within.
    Unsupervised learning can be categorized further into two separate categories:


    1.  Clustering


    2.  Association rules


    Clustering refers to finding underlying groups of data points, based on the attributes
    present in the data, as shown in Figure [7-1](#478390_1_En_7_Chapter.xhtml#Fig1).


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig1_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Unsupervised machine learning


    Association signifies the probability of co-occurrence. For example, if someone
    bought item X, what’s the probability that he or she might also buy item Y with
    it. In this chapter, I will focus only on clustering techniques. We can easily
    make use of clustering to understand the different groups in the data. For example,
    if we have some data about soccer players, we can easily predict who plays what
    position on the field—either they are forward players or defenders. Table [7-1](#478390_1_En_7_Chapter.xhtml#Tab1)
    shows some sample data for players in a soccer tournament. The two values captured
    are


