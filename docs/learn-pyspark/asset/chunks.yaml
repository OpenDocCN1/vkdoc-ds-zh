    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig1_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Sample workflow


    The first task is to read the data from the source file and then copy it to your
    platform or desired location. Once data is made available, you ingest it and pass
    it through multiple steps to clean and transform it. You then perform the analysis
    and calculate the results. Finally, you save the output to the required location.
    Traditionally, the way these steps are executed is with the help of cron jobs
    (commands run by the cron daemon at scheduled intervals). So, all the tasks are
    part of the scripts which are run as cron jobs. Although, it serves the purpose
    of executing things in a particular order, it still faces many practical challenges.
    Most common is the breakdown of the script execution. There is no clear methodology
    to re-attempt the script run. Another challenge is monitoring the status of the
    running job. It is very difficult to determine the stage and the time duration
    each stage takes while executing. There are other challenges as well, such as
    running multiple cron jobs through a centralized scheduler, for bigger and complex
    pipelines and to accommodate continuous changes in the workflow. Owing to all
    of the difficulties mentioned, Airflow was born as a framework with which to schedule
    and monitor such kinds of jobs and run the pipelines smoothly, for consistent
    output. To truly understand how Airflow and DAGs operate, you first must understand
    graphs in general.'
