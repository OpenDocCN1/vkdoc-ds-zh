- fmt: '# Creating Your First DAG


    As discussed in the earlier part of the chapter, a DAG consists of multiple tasks
    arranged in a particular order, as shown in Figure [4-8](#478390_1_En_4_Chapter.xhtml#Fig8).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig8_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig8_HTML.jpg)


    Figure 4-8 Tasks


    In order to create a DAG, you must define a DAG file that contains all the details
    pertaining to DAG tasks, and dependencies must be defined in a file (Python script).
    This is a configuration file specifying the DAG’s structure as code. The five
    steps that must to be taken to run a DAG are shown in Figure [4-9](#478390_1_En_4_Chapter.xhtml#Fig9).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig9_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig9_HTML.png)


    Figure 4-9 Airflow steps


    Let’s go into detail about each of these steps, to understand the internals better.


    ### Step 1: Importing the Required Libraries


    The first step is to import all the required libraries for running Airflow. Some
    common ones include `datetime`, different operators (`Bash`/`Python`), and Airflow
    itself.


    ```

    [In]: from datetime import timedelta

    [In]: import airflow

    [In]: from airflow import DAG

    [In]: from airflow.operators.bash_operator import BashOperator

    ```


    ### Step 2: Defining the Default Arguments


    The next step is to define some important parameters, to ensure that Airflow executes
    the DAGs at designated time intervals and an appropriate number of times.


    ```

    [In]: args = {

    ''owner'': ''Pramod'',

    ''start_date'': airflow.utils.dates.days_ago(3),

    # ''end_date'': datetime(2018, 12, 30),

    ''depends_on_past'': False,

    ''email'': [''airflow@example.com''],

    ''email_on_failure'': False,

    ''email_on_retry'': False,

    ''retries'': 1,

    ''retry_delay'': timedelta(minutes=5),

    }

    ```


    ### Step 3: Creating a DAG


    The third step is to create the DAG itself, which consists of the DAG’s name and
    schedule interval, as shown following. You can decide when to run the jobs, depending
    on your requirements.


    ```

    [In]: dag = DAG(

    ''pramod_airflow_dag'',

    default_args=args,

    description=''A simple DAG'',

    # Continue to run DAG once per day

    schedule_interval=timedelta(days=1)

    ```


    ### Step 4: Declaring Tasks


    The next step is to declare the tasks (actual jobs) to be executed. All the tasks
    can be declared and made part of the same DAG created in the preceding step.


    ```

    [In]: t1 = BashOperator(

    task_id=''print_date'',

    bash_command=''date'',

    dag=dag,

    )

    t2 = BashOperator(

    task_id=''sleep'',

    depends_on_past=False,

    bash_command=''sleep 5'',

    dag=dag,

    )

    ```


    ### Step 5: Mentioning Dependencies


    The final step is to set the order of task execution. They can be either parallel
    or sequential tasks. There are multiple ways in which the tasks can be defined.


    ```

    [In]: t1 >> t2

    ```


    Once all the preceding steps have been completed, we can start Airflow and access
    the web UI. The screen shown in Figure [4-10](#478390_1_En_4_Chapter.xhtml#Fig10)
    is available with the DAG file just created.


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig10_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig10_HTML.png)


    Figure 4-10 Airflow DAG


    Currently, it’s in OFF stage, and we can either trigger it manually or through
    a command-line interface (CLI). If we click the DAG itself, it takes us to the
    default tree view of the DAG, which lists all the tasks within the DAG, as shown
    in Figure [4-11](#478390_1_En_4_Chapter.xhtml#Fig11).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig11_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig11_HTML.png)


    Figure 4-11 Tree view


    Now switch on the DAG, in order to initiate the tasks, as shown in Figure [4-12](#478390_1_En_4_Chapter.xhtml#Fig12).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig12_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig12_HTML.jpg)


    Figure 4-12 DAG initialization


    Then click the Trigger Dag icon and start the execution, as shown in Figure [4-13](#478390_1_En_4_Chapter.xhtml#Fig13).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig13_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig13_HTML.jpg)


    Figure 4-13 DAG trigger


    The moment DAG is triggered, we can see the change under the Recent Tasks tab,
    and DAG runs, as shown in Figure [4-14](#478390_1_En_4_Chapter.xhtml#Fig14).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig14_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig14_HTML.png)


    Figure 4-14 Running the DAG


    Once the DAG starts to run we can view it in different ways, the first form is
    the Tree View as shown in Figure [4-15](#478390_1_En_4_Chapter.xhtml#Fig15).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig15_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig15_HTML.png)


    Figure 4-15 Airflow UI


    Another view is the Graph View that shows the order of task execution in a slightly
    different manner, and the color of the task indicates its progress (success/running/failed,
    etc.), as shown in Figure [4-16](#478390_1_En_4_Chapter.xhtml#Fig16).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig16_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig16_HTML.png)


    Figure 4-16 Graph view


    We can also drill deeper into other details of the DAG, by going to the DAG details
    tab, shown in Figure [4-17](#478390_1_En_4_Chapter.xhtml#Fig17).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig17_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig17_HTML.png)


    Figure 4-17 DAG details tab


    Finally, under the Code tab, we can review the DAG Python script that was originally
    created before running the DAG, as shown in Figure [4-18](#478390_1_En_4_Chapter.xhtml#Fig18).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig18_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig18_HTML.png)


    Figure 4-18 DAG code


    If we wait a while and recheck Graph View, we will observe that both tasks have
    been completed successfully, as illustrated in Figure [4-19](#478390_1_En_4_Chapter.xhtml#Fig19).
    From the Tree View tab, we can see that tasks have been completed for all three
    days (the last two and today’s), as shown in Figure [4-20](#478390_1_En_4_Chapter.xhtml#Fig20).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig20_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig20_HTML.png)


    Figure 4-20 Tree view


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig19_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig19_HTML.png)


    Figure 4-19 Graph view


    ## Conclusion


    In this chapter, you learned how to define a DAG and run different jobs using
    Airflow. The steps to implement Airflow and monitor the status of different tasks
    were also covered. You were also introduced to the web UI for Airflow, in addition
    to different components within the interface.


    # MLlib: Machine Learning Library


    Depending on your requirements, there are multiple ways in which you can build
    machine learning models, using preexisting libraries, such as Python’s `scikit-learn`,
    `R`, and `TensorFlow`. However, what makes Spark’s Machine Learning library (`MLlib`)
    really useful is its ability to train models on scale and provide distributed
    training. This allows users to quickly build models on a huge dataset, in addition
    to preprocessing and preparing workflows with the Spark framework itself.


    This chapter focuses on how to leverage `MLlib` for building and applying various
    machine learning models. The first part focuses on basic statistics, using `MLlib`,
    followed by building pipelines to create features and other transformations. The
    last part of the chapter discusses using `MLlib` for building machine learning
    classification models.


    Let’s begin by reviewing how we can use Spark’s `MLlib` for calculating some of
    the basic statistical measures for data analysis. You will see how to calculate
    correlations between two numerical variables and how to use a chi-square test
    to determine if there is a significant relationship between two categorical variables.'
  raw: '## Creating Your First DAG


    As discussed in the earlier part of the chapter, a DAG consists of multiple tasks
    arranged in a particular order, as shown in Figure [4-8](#478390_1_En_4_Chapter.xhtml#Fig8).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig8_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Tasks


    In order to create a DAG, you must define a DAG file that contains all the details
    pertaining to DAG tasks, and dependencies must be defined in a file (Python script).
    This is a configuration file specifying the DAG’s structure as code. The five
    steps that must to be taken to run a DAG are shown in Figure [4-9](#478390_1_En_4_Chapter.xhtml#Fig9).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig9_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig9_HTML.png)


    Figure 4-9


    Airflow steps


    Let’s go into detail about each of these steps, to understand the internals better.


    ### Step 1: Importing the Required Libraries


    The first step is to import all the required libraries for running Airflow. Some
    common ones include datetime, different operators (Bash/Python), and Airflow itself.


    ```

    [In]: from datetime import timedelta

    [In]: import airflow

    [In]: from airflow import DAG

    [In]: from airflow.operators.bash_operator import BashOperator

    ```


    ### Step 2: Defining the Default Arguments


    The next step is to define some important parameters, to ensure that Airflow executes
    the DAGs at designated time intervals and an appropriate number of times.


    ```

    [In]: args = {

    ''owner'': ''Pramod'',

    ''start_date'': airflow.utils.dates.days_ago(3),

    # ''end_date'': datetime(2018, 12, 30),

    ''depends_on_past'': False,

    ''email'': [''airflow@example.com''],

    ''email_on_failure'': False,

    ''email_on_retry'': False,

    ''retries'': 1,

    ''retry_delay'': timedelta(minutes=5),

    }

    ```


    ### Step 3: Creating a DAG


    The third step is to create the DAG itself, which consists of the DAG’s name and
    schedule interval, as shown following. You can decide when to run the jobs, depending
    on your requirements.


    ```

    [In]: dag = DAG(

    ''pramod_airflow_dag'',

    default_args=args,

    description=''A simple DAG'',

    # Continue to run DAG once per day

    schedule_interval=timedelta(days=1)

    ```


    ### Step 4: Declaring Tasks


    The next step is to declare the tasks (actual jobs) to be executed. All the tasks
    can be declared and made part of the same DAG created in the preceding step.


    ```

    [In]: t1 = BashOperator(

    task_id=''print_date'',

    bash_command=''date'',

    dag=dag,

    )

    t2 = BashOperator(

    task_id=''sleep'',

    depends_on_past=False,

    bash_command=''sleep 5'',

    dag=dag,

    )

    ```


    ### Step 5: Mentioning Dependencies


    The final step is to set the order of task execution. They can be either parallel
    or sequential tasks. There are multiple ways in which the tasks can be defined.


    ```

    [In]: t1 >> t2

    ```


    Once all the preceding steps have been completed, we can start Airflow and access
    the web UI. The screen shown in Figure [4-10](#478390_1_En_4_Chapter.xhtml#Fig10)
    is available with the DAG file just created.


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig10_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig10_HTML.png)


    Figure 4-10


    Airflow DAG


    Currently, it’s in OFF stage, and we can either trigger it manually or through
    a command-line interface (CLI). If we click the DAG itself, it takes us to the
    default tree view of the DAG, which lists all the tasks within the DAG, as shown
    in Figure [4-11](#478390_1_En_4_Chapter.xhtml#Fig11).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig11_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig11_HTML.png)


    Figure 4-11


    Tree view


    Now switch on the DAG, in order to initiate the tasks, as shown in Figure [4-12](#478390_1_En_4_Chapter.xhtml#Fig12).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig12_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    DAG initialization


    Then click the Trigger Dag icon and start the execution, as shown in Figure [4-13](#478390_1_En_4_Chapter.xhtml#Fig13).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig13_HTML.jpg](images/478390_1_En_4_Chapter/478390_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    DAG trigger


    The moment DAG is triggered, we can see the change under the Recent Tasks tab,
    and DAG runs, as shown in Figure [4-14](#478390_1_En_4_Chapter.xhtml#Fig14).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig14_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig14_HTML.png)


    Figure 4-14


    Running the DAG


    Once the DAG starts to run we can view it in different ways , the first form is
    the Tree View as shown in Figure [4-15](#478390_1_En_4_Chapter.xhtml#Fig15).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig15_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig15_HTML.png)


    Figure 4-15


    Airflow UI


    Another view is the Graph View that shows the order of task execution in a slightly
    different manner, and the color of the task indicates its progress (success/running/failed,
    etc.), as shown in Figure [4-16](#478390_1_En_4_Chapter.xhtml#Fig16).


    ![../images/478390_1_En_4_Chapter/478390_1_En_4_Fig16_HTML.png](images/478390_1_En_4_Chapter/478390_1_En_4_Fig16_HTML.png)


    Figure 4-16


    Graph view


    We can also drill deeper into other details of the DAG, by going to the DAG details
