    ## Building Multiple Models for Binary Classification Tasks


    In this third and final section of the chapter, you will see how to build multiple
    machine learning models for binary classification tasks. The data that we are
    going to use for this is a subset of an open source Bank Marketing Data Set from
    the UCI ML repository, available at `https://archive.ics.uci.edu/ml/datasets/Bank+Marketing`.


    There are two reasons for selecting only a subset of this data. The first is to
    maintain the class balance for the classification task, so as not to make it an
    anomalous detection category task. Another reason for selecting only a subset
    of the features is to limit the amount of signals in the data, as some of the
    features in the dataset strongly affect the output and, therefore, are ignored
    in this exercise.


    The dataset contains 9,500 rows and 8 columns. The idea is to predict if the user
    will subscribe to another product or service (term deposit), based on the other
    attributes, such as age, job, loan, etc. This is a typical requirement in which
    machine learning is leveraged to find the top users who can be targeted by the
    business for cross-selling or upselling.


    I’ll begin with the logistic regression model.


