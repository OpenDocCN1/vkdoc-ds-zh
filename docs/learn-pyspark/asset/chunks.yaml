    ## 引言


    在我撰写第一本书时，写作本书的想法就已埋下种子，这背后有充分的理由。前一本书更侧重于使用大数据进行机器学习，本质上并未深入探讨辅助性方面，而本书则更深入地探讨了
    Spark 机器学习库的内部机制，以及对流式数据的分析。对于希望进一步了解如何自动化不同工作流并构建管道以处理实时数据的读者来说，本书是一个很好的参考点。


    本书分为三个主要部分。第一部分介绍 Spark 和大数据分析；中间部分讨论如何使用 Airflow 执行不同的作业，以及利用 Spark 的结构化流功能对流式数据进行分析。最后一部分涵盖如何将业务问题转化为机器学习问题并使用
    Spark 的机器学习库进行求解，同时深入探讨了深度学习。


    本书对数据分析师和数据工程师也可能很有用，因为它涵盖了使用 PySpark 进行大数据处理的步骤。希望向数据科学和机器学习领域转型的读者也会发现本书是一个很好的起点，并可以逐步攻克更复杂的领域。书中提供的案例研究和示例使相关基本概念易于理解和掌握。此外，市面上关于
    PySpark 的书籍很少，本书无疑能丰富读者的知识。本书的优势在于其简洁性以及将机器学习应用于有意义的数据集。


    我尽最大努力将我的所有经验和知识融入本书，我认为它尤其契合企业解决实际挑战的需求。希望它能为您提供一些有用的收获。


    ## 致谢


    这是我的第二本关于 Spark 的书，在此过程中，我逐渐意识到自己对处理大数据和执行机器学习的热爱。展望未来，我打算撰写更多书籍，但首先，我要感谢在这段旅程中帮助过我的几个人。首先，我必须感谢我生命中最重要的人，我亲爱的妻子
    Neha，她无私地支持我，并牺牲了那么多来确保我完成这本书。


    我必须感谢 Celestin Suresh John，他信任我并给予我撰写本书的机会。Aditee Mirashi 是印度最优秀的编辑之一。这是我和她合作的第二本书，这次与她合作更加令人兴奋。和往常一样，她给予了极大的支持，并总是满足我的要求。我特别要感谢
    Jim Markham，他投入时间阅读了每一个章节，并提出了许多宝贵的建议。谢谢 Jim，我真的很感激你的意见。我还要感谢 Manoj Patil，他耐心地审阅了每一行代码并检查了每个示例的恰当性。感谢你的反馈和鼓励。这对我本人和这本书都产生了重要影响。


    我还要感谢许多不断鞭策我追求梦想的导师。感谢 Sebastian Keupers、Vijay Agneeswaran 博士、Sreenivas Venkatraman、Shoaib
    Ahmed 和 Abhishek Kumar 付出的时间。最后，我无限感激我的儿子 Ziaan 和我的父母，无论情况如何，他们都给予我无尽的爱与支持。你们让我的世界变得美好。


    ### 关于作者与技术审稿人


    ### 关于作者


    ### 关于技术审稿人


    # 1. Spark 简介


    由于本书是关于 Spark 的，因此第一章从探讨 Spark 的一些历史及其不同组件开始是合情合理的。本章引言部分分为三个部分。在第一部分中，我将回顾数据的演变过程以及它在规模上如何发展到今天的地步。我将触及数据的三个关键方面。在第二部分中，我将深入探讨
    Spark 的内部机制，并详细介绍其不同组件，包括其架构和运作方式。本章的第三部分也是最后一部分，重点介绍如何在云环境中使用 Spark。


    ## 历史


    Spark 项目诞生于加州大学伯克利分校的算法、机器与人类 (AMP) 实验室。该项目的启动是为了解决 Hadoop MapReduce 框架中潜在的问题。尽管
    Hadoop MapReduce 是处理大数据处理的突破性框架，但实际上它在速度方面仍存在许多限制。Spark 是全新的，能够进行内存计算，这使其比任何其他大数据处理框架快近
    100 倍。自那时起，全球范围内将 Spark 用于大数据应用的情况持续增加。但在深入探讨 Spark 的具体细节之前，让我们先考虑一下数据本身的几个方面。


    数据可以从三个不同的角度来审视：其收集、存储和处理的方式，如图 1-1 所示。


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig1_HTML.png](img/478390_1_En_1_Fig1_HTML.png)


    图 1-1


    数据的三个方面


    ### 数据收集


    在过去的几年里，数据收集的方式发生了巨大的转变。从在杂货店买一个苹果到在手机上删除一个应用程序，每一个数据点现在都被捕获在后端，并通过各种内置应用程序进行收集。不同的物联网
    (IoT) 设备每毫秒都会捕获大量的视觉和感官信号。对于企业来说，从各种来源收集这些数据并在以后用于改进决策，已经变得相对方便。'
- fmt: '### Data Storage


    In previous years, no one ever imagined that data would reside at some remote
    location, or that the cost to store data would be as cheap as it is. Businesses
    have embraced cloud storage and started to see its benefits over on-premise approaches.
    However, some businesses still opt for on-premise storage, for various reasons.
    It’s known that data storage began by making use of magnetic tapes. Then the breakthrough
    introduction of floppy discs made it possible to move data from one place to another.
    However, the size of the data was still a huge limitation. Flash drives and hard
    discs made it even easier to store and transfer large amounts of data at a reduced
    cost. (See Figure [1-2](#478390_1_En_1_Chapter.xhtml#Fig2).) The latest trend
    in the advancement of storage devices has resulted in flash drives capable of
    storing data up to 2TBs, at a throwaway price.


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig2_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig2_HTML.png)


    Figure 1-2


    Evolution of data storage


    This trend clearly indicates that the cost to store data has been reduced significantly
    over the years and continues to decline. As a result, businesses don’t shy away
    from storing huge amounts of data, irrespective of its kind. From logs to financial
    and operational transactions to simple employee feedback, everything gets stored.


    ### Data Processing


    The final aspect of data is using stored data and processing it for some analysis
    or to run an application. We have witnessed how efficient computers have become
    in the last 20 years. What used to take five minutes to execute probably takes
    less than a second using today’s machines with advanced processing units. Hence,
    it goes without saying that machines can process data much faster and easier.
    Nonetheless, there is still a limit to the amount of data a single machine can
    process, regardless of its processing power. So, the underlying idea behind Spark
    is to use a collection (cluster) of machines and a unified processing engine (Spark)
    to process and handle huge amounts of data, without compromising on speed and
    security. This was the ultimate goal that resulted in the birth of Spark.


    ## Spark Architecture


    There are five core components that make Spark so powerful and easy to use. The
    core architecture of Spark consists of the following layers, as shown in Figure
    [1-3](#478390_1_En_1_Chapter.xhtml#Fig3):


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig3_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig3_HTML.png)


    Figure 1-3


    Core components of Spark


    - Storage

    - Resource management

    - Engine

    - Ecosystem

    - APIs


    ### Storage


    Before using Spark, data must be made available in order to process it. This data
    can reside in any kind of database. Spark offers multiple options to use different
    categories of data sources, to be able to process it on a large scale. Spark allows
    you to use traditional relational databases as well as NoSQL, such as Cassandra
    and MongoDB.


    ### Resource Management


    The next layer consists of a resource manager. As Spark works on a set of machines
    (it also can work on a single machine with multiple cores), it is known as a Spark
    *cluster*. Typically, there is a resource manager in any cluster that efficiently
    handles the workload between these resources. The two most widely used resource
    managers are YARN and Mesos. The resource manager has two main components internally:


    1. *Cluster manager*

    2. *Worker*


    It’s kind of like master-slave architecture, in which the cluster manager acts
    as a master node, and the worker acts as a slave node in the cluster. The cluster
    manager keeps track of all information pertaining to the worker nodes and their
    current status. Cluster managers always maintain the following information:


    - Status of worker node (busy/available)

    - Location of worker node

    - Memory of worker node

    - Total CPU cores of worker node


    The main role of the cluster manager is to manage the worker nodes and assign
    them tasks, based on the availability and capacity of the worker node. On the
    other hand, a worker node is only responsible for executing the task it’s given
    by the cluster manager, as shown in Figure [1-4](#478390_1_En_1_Chapter.xhtml#Fig4).


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig4_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig4_HTML.png)


    Figure 1-4


    Resource management


    The tasks that are given to the worker nodes are generally the individual pieces
    of the overall Spark application. The Spark application contains two parts:


    1. Task

    2. Spark driver


    The task is the data processing logic that has been written in either PySpark
    or Spark R code. It can be as simple as taking a total frequency count of words
    to a very complex set of instructions on an unstructured dataset. The second component
    is Spark driver, the main controller of a Spark application, which consistently
    interacts with a cluster manager to find out which worker nodes can be used to
    execute the request. The role of the Spark driver is to request the cluster manager
    to initiate the Spark executor for every worker node.


    ### Engine and Ecosystem


    The base of the Spark architecture is its core, which is built on top of RDDs
    (Resilient Distributed Datasets) and offers multiple APIs for building other libraries
    and ecosystems by Spark contributors. It contains two parts: the distributed computing
    infrastructure and the RDD programming abstraction. The default libraries in the
    Spark toolkit come as four different offerings.


    #### Spark SQL


    SQL being used by most of the ETL operators across the globe makes it a logical
    choice to be part of Spark offerings. It allows Spark users to perform structured
    data processing by running SQL queries. In actuality, Spark SQL leverages the
    catalyst optimizer to perform the optimizations during the execution of SQL queries.


    Another advantage of using Spark SQL is that it can easily deal with multiple
    database files and storage systems such as SQL, NoSQL, Parquet, etc.


    #### MLlib


    Training machine learning models on big datasets was starting to become a huge
    challenge, until Spark’s MLlib (Machine Learning library) came into existence.
    MLlib gives you the ability to train machine learning models on huge datasets,
    using Spark clusters. It allows you to build in supervised, unsupervised, and
    recommender systems; NLP-based models; and deep learning, as well as within the
    Spark ML library.


    #### Structured Streaming


    The Spark Streaming library provides the functionality to read and process real-time
    streaming data. The incoming data can be batch data or near real-time data from
    different sources. Structured Streaming is capable of ingesting real-time data
    from such sources as Flume, Kafka, Twitter, etc. There is a dedicated chapter
    on this component later in this book (see Chapter [3](#478390_1_En_3_Chapter.xhtml)).


    #### Graph X


    This is a library that sits on top of the Spark core and allows users to process
    specific types of data (graph dataframes), which consists of nodes and edges.
    A typical graph is used to model the relationship between the different objects
    involved. The nodes represent the object, and the edge between the nodes represents
    the relationship between them. Graph dataframes are mainly used in network analysis,
    and Graph X makes it possible to have distributed processing of such graph dataframes.


    ### Programming Language APIs


    Spark is available in four languages. Because Spark is built using Scala, that
    becomes the native language. Apart from Scala, we can also use Python, Java, and
    R, as shown in Figure [1-5](#478390_1_En_1_Chapter.xhtml#Fig5).


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig5_HTML.jpg](images/478390_1_En_1_Chapter/478390_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Language APIs'
  raw: '### Data Storage


    In previous years, no one ever imagined that data would reside at some remote
    location, or that the cost to store data would be as cheap as it is. Businesses
    have embraced cloud storage and started to see its benefits over on-premise approaches.
    However, some businesses still opt for on-premise storage, for various reasons.
    It’s known that data storage began by making use of magnetic tapes. Then the breakthrough
    introduction of floppy discs made it possible to move data from one place to another.
    However, the size of the data was still a huge limitation. Flash drives and hard
    discs made it even easier to store and transfer large amounts of data at a reduced
    cost. (See Figure [1-2](#478390_1_En_1_Chapter.xhtml#Fig2).) The latest trend
    in the advancement of storage devices has resulted in flash drives capable of
    storing data up to 2TBs, at a throwaway price.


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig2_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig2_HTML.png)


    Figure 1-2


    Evolution of data storage


    This trend clearly indicates that the cost to store data has been reduced significantly
    over the years and continues to decline. As a result, businesses don’t shy away
    from storing huge amounts of data, irrespective of its kind. From logs to financial
    and operational transactions to simple employee feedback, everything gets stored.


    ### Data Processing


    The final aspect of data is using stored data and processing it for some analysis
    or to run an application. We have witnessed how efficient computers have become
    in the last 20 years. What used to take five minutes to execute probably takes
    less than a second using today’s machines with advanced processing units. Hence,
    it goes without saying that machines can process data much faster and easier.
    Nonetheless, there is still a limit to the amount of data a single machine can
    process, regardless of its processing power. So, the underlying idea behind Spark
    is to use a collection (cluster) of machines and a unified processing engine (Spark)
    to process and handle huge amounts of data, without compromising on speed and
    security. This was the ultimate goal that resulted in the birth of Spark.


    ## Spark Architecture


    There are five core components that make Spark so powerful and easy to use. The
    core architecture of Spark consists of the following layers, as shown in Figure
    [1-3](#478390_1_En_1_Chapter.xhtml#Fig3):


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig3_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig3_HTML.png)


    Figure 1-3


    Core components of Spark


    *   Storage


    *   Resource management


    *   Engine


    *   Ecosystem


    *   APIs


    ### Storage


    Before using Spark, data must be made available in order to process it. This data
    can reside in any kind of database. Spark offers multiple options to use different
    categories of data sources, to be able to process it on a large scale. Spark allows
    you to use traditional relational databases as well as NoSQL, such as Cassandra
    and MongoDB.


    ### Resource Management


    The next layer consists of a resource manager. As Spark works on a set of machines
    (it also can work on a single machine with multiple cores), it is known as a Spark
    *cluster* . Typically, there is a resource manager in any cluster that efficiently
    handles the workload between these resources. The two most widely used resource
    managers are YARN and Mesos. The resource manager has two main components internally:


    1.  *Cluster manager*


    2.  *Worker*


    It’s kind of like master-slave architecture, in which the cluster manager acts
    as a master node, and the worker acts as a slave node in the cluster. The cluster
    manager keeps track of all information pertaining to the worker nodes and their
    current status. Cluster managers always maintain the following information:


    *   Status of worker node (busy/available)


    *   Location of worker node


    *   Memory of worker node


    *   Total CPU cores of worker node


    The main role of the cluster manager is to manage the worker nodes and assign
    them tasks, based on the availability and capacity of the worker node. On the
    other hand, a worker node is only responsible for executing the task it’s given
    by the cluster manager, as shown in Figure [1-4](#478390_1_En_1_Chapter.xhtml#Fig4).


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig4_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig4_HTML.png)


    Figure 1-4


    Resource management


    The tasks that are given to the worker nodes are generally the individual pieces
    of the overall Spark application. The Spark application contains two parts:


    1.  Task


    2.  Spark driver


    The task is the data processing logic that has been written in either PySpark
    or Spark R code. It can be as simple as taking a total frequency count of words
    to a very complex set of instructions on an unstructured dataset. The second component
    is Spark driver, the main controller of a Spark application, which consistently
    interacts with a cluster manager to find out which worker nodes can be used to
    execute the request. The role of the Spark driver is to request the cluster manager
    to initiate the Spark executor for every worker node.


    ### Engine and Ecosystem


    The base of the Spark architecture is its core, which is built on top of RDDs
    (Resilient Distributed Datasets) and offers multiple APIs for building other libraries
    and ecosystems by Spark contributors. It contains two parts: the distributed computing
    infrastructure and the RDD programming abstraction. The default libraries in the
    Spark toolkit come as four different offerings.


    #### Spark SQL


    SQL being used by most of the ETL operators across the globe makes it a logical
    choice to be part of Spark offerings. It allows Spark users to perform structured
    data processing by running SQL queries. In actuality, Spark SQL leverages the
    catalyst optimizer to perform the optimizations during the execution of SQL queries.


    Another advantage of using Spark SQL is that it can easily deal with multiple
    database files and storage systems such as SQL, NoSQL, Parquet, etc.


    #### MLlib


    Training machine learning models on big datasets was starting to become a huge
    challenge, until Spark’s MLlib (Machine Learning library) came into existence.
    MLlib gives you the ability to train machine learning models on huge datasets,
    using Spark clusters. It allows you to build in supervised, unsupervised, and
    recommender systems; NLP-based models; and deep learning, as well as within the
    Spark ML library.


    #### Structured Streaming


    The Spark Streaming library provides the functionality to read and process real-time
    streaming data. The incoming data can be batch data or near real-time data from
    different sources. Structured Streaming is capable of ingesting real-time data
    from such sources as Flume, Kafka, Twitter, etc. There is a dedicated chapter
    on this component later in this book (see Chapter [3](#478390_1_En_3_Chapter.xhtml)).


    #### Graph X


    This is a library that sits on top of the Spark core and allows users to process
    specific types of data (graph dataframes), which consists of nodes and edges.
    A typical graph is used to model the relationship between the different objects
    involved. The nodes represent the object, and the edge between the nodes represents
    the relationship between them. Graph dataframes are mainly used in network analysis,
    and Graph X makes it possible to have distributed processing of such graph dataframes.


    ### Programming Language APIs


    Spark is available in four languages. Because Spark is built using Scala, that
    becomes the native language. Apart from Scala, we can also use Python, Java, and
    R, as shown in Figure [1-5](#478390_1_En_1_Chapter.xhtml#Fig5).


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig5_HTML.jpg](images/478390_1_En_1_Chapter/478390_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Language APIs'
  trans: '

    ### 数据存储


    在早些年，没人能想象数据会存放在某个远程位置，或者存储数据的成本会变得如此低廉。企业已经接受了云存储，并开始看到它相较于本地部署方法的优势。然而，出于各种原因，一些企业仍然选择本地存储。众所周知，数据存储最初是利用磁带进行的。随后，软盘的突破性引入使得数据可以从一个地方转移到另一个地方。然而，数据的大小仍然是一个巨大的限制。闪存盘和硬盘使得以更低的成本存储和传输大量数据变得更加容易。（见图
    1-2。）存储设备发展的最新趋势已经产生了能够存储高达 2TB 数据的闪存盘，且价格低廉。


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig2_HTML.png](img/478390_1_En_1_Fig2_HTML.png)


    图 1-2


    数据存储的演变


    这一趋势清楚地表明，多年来数据存储成本已显著降低，并且还在继续下降。因此，企业不再回避存储海量数据，无论其类型如何。从日志到财务和运营交易，再到简单的员工反馈，一切都被存储起来。


    ### 数据处理


    数据的最后一个方面是使用存储的数据并进行处理，以便进行分析或运行应用程序。我们见证了在过去 20 年里计算机变得多么高效。过去需要五分钟才能执行的任务，使用当今配备先进处理单元的机器可能不到一秒钟就能完成。因此，不言而喻，机器可以更快、更容易地处理数据。尽管如此，无论单台机器的处理能力有多强，它能处理的数据量仍然存在限制。因此，Spark
    背后的基本思想是使用一组（集群）机器和一个统一的处理引擎（Spark）来处理和应对海量数据，同时不影响速度和安全性。这正是促成 Spark 诞生的最终目标。


    ## Spark 架构


    有五个核心组件使 Spark 如此强大且易于使用。Spark 的核心架构包含以下层次，如图 1-3 所示：


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig3_HTML.png](img/478390_1_En_1_Fig3_HTML.png)


    图 1-3


    Spark 的核心组件


    - 存储

    - 资源管理

    - 引擎

    - 生态系统

    - API


    ### 存储


    在使用 Spark 之前，必须准备好数据才能进行处理。这些数据可以驻留在任何类型的数据库中。Spark 提供了多种选项来使用不同类别的数据源，以便能够大规模地处理数据。Spark
    允许你使用传统的关系型数据库以及 NoSQL 数据库，例如 Cassandra 和 MongoDB。


    ### 资源管理


    下一层由资源管理器组成。由于 Spark 在一组机器上工作（它也可以在具有多个核心的单台机器上工作），因此它被称为 Spark *集群*。通常，任何集群中都有一个资源管理器，用于高效地处理这些资源之间的工作负载。两种最广泛使用的资源管理器是
    YARN 和 Mesos。资源管理器内部有两个主要组件：


    1. *集群管理器*

    2. *工作节点*


    这有点像主从架构，其中集群管理器充当主节点，而工作节点在集群中充当从节点。集群管理器跟踪与工作节点及其当前状态相关的所有信息。集群管理器始终维护以下信息：


    - 工作节点状态（忙碌/可用）

    - 工作节点位置

    - 工作节点内存

    - 工作节点总 CPU 核心数


    集群管理器的主要作用是根据工作节点的可用性和容量来管理工作节点并为其分配任务。另一方面，工作节点仅负责执行集群管理器分配给它的任务，如图 1-4 所示。


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig4_HTML.png](img/478390_1_En_1_Fig4_HTML.png)


    图 1-4


    资源管理


    分配给工作节点的任务通常是整个 Spark 应用程序的各个部分。Spark 应用程序包含两部分：


    1. 任务

    2. Spark 驱动器


    任务是使用 PySpark 或 Spark R 代码编写的数据处理逻辑。它可以简单到计算单词的总频率，也可以复杂到对非结构化数据集执行一系列非常复杂的指令。第二个组件是
    Spark 驱动器，它是 Spark 应用程序的主要控制器，持续与集群管理器交互，以找出哪些工作节点可用于执行请求。Spark 驱动器的作用是请求集群管理器为每个工作节点启动
    Spark 执行器。


    ### 引擎与生态系统


    Spark 架构的基础是其核心，它构建在 RDD（弹性分布式数据集）之上，并为 Spark 贡献者提供了多个 API 来构建其他库和生态系统。它包含两部分：分布式计算基础设施和
    RDD 编程抽象。Spark 工具包中的默认库以四种不同的形式提供。


    #### Spark SQL


    SQL 被全球大多数 ETL 操作员使用，这使其成为 Spark 产品中合乎逻辑的选择。它允许 Spark 用户通过运行 SQL 查询来执行结构化数据处理。实际上，Spark
    SQL 利用催化剂优化器在执行 SQL 查询期间进行优化。


    使用 Spark SQL 的另一个优点是它可以轻松处理多个数据库文件和存储系统，例如 SQL、NoSQL、Parquet 等。


    #### MLlib


    在大型数据集上训练机器学习模型开始成为一个巨大的挑战，直到 Spark 的 MLlib（机器学习库）出现。MLlib 使您能够使用 Spark 集群在大型数据集上训练机器学习模型。它允许您在
    Spark ML 库中构建监督学习、无监督学习、推荐系统、基于 NLP 的模型以及深度学习。


    #### Structured Streaming


    Spark Streaming 库提供了读取和处理实时流数据的功能。传入的数据可以是批处理数据，也可以是来自不同源的近实时数据。Structured Streaming
    能够从诸如 Flume、Kafka、Twitter 等源摄取实时数据。本书后面有一章专门介绍这个组件（见第 3 章）。


    #### Graph X


    这是一个位于 Spark 核心之上的库，允许用户处理特定类型的数据（图数据帧），这些数据由节点和边组成。典型的图用于建模所涉及的不同对象之间的关系。节点代表对象，节点之间的边代表它们之间的关系。图数据帧主要用于网络分析，而
    Graph X 使得对此类图数据帧进行分布式处理成为可能。


    ### 编程语言 API


    Spark 支持四种语言。由于 Spark 是使用 Scala 构建的，因此 Scala 是其原生语言。除了 Scala，我们还可以使用 Python、Java
    和 R，如图 1-5 所示。


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig5_HTML.jpg](img/478390_1_En_1_Fig5_HTML.jpg)


    图 1-5


    语言 API

