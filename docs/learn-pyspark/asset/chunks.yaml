- fmt: '### Generalized Linear Model Regression


    The generalized linear model (GLM) is an advanced version of linear regression
    that considers the target variable to have an error distribution other than a
    preferred normal distribution. The GLM generalizes linear regression, using a
    link function, so that variance is a function of the predicted value itself. Let’s
    try to build the GLM on the same dataset and see if it performs better than a
    simple linear regression model. First, we must import the GLM from MLlib.


    ```

    [In]: from pyspark.ml.regression import GeneralizedLinearRegression

    ```


    #### Step 1: Build and Train Generalized Linear Regression Model


    ```

    [In]: glr = GeneralizedLinearRegression()

    [In]: glr_model = glr.fit(train)

    [In]: glr_model.coefficients

    [Out]: DenseVector([0.0003, 0.0001, 0.0001, -0.6374, 0.4822])

    ```


    We can get the coefficient values, using coefficient functions of that model.
    Here we can see that one of the features has a negative coefficient value. We
    can get more information about the GLM model, by using the `summary` function.
    It returns all the details, such as coefficient value, std error, AIC (Akaike
    information criterion) value, and p value.


    ```

    [In]: glr_model.summary

    [Out]:

    ```


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Figd_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Figd_HTML.jpg)


    #### Step 2: Evaluate the Model Performance on Test Data


    ```

    [In]: model_predictions=glr_model.evaluate(test)

    [In]: model_predictions.predictions.show()

    [Out]:

    ```


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Fige_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Fige_HTML.jpg)


    The Akaike information criterion (AIC) is an evaluation parameter of relative
    performance of quality of models for the same set dataset. AIC is mainly used
    to select among multiple models for a given dataset. A lesser value of AIC indicates
    that the model is of good quality. AIC tries to strike a balance between the variance
    and bias of the model. Therefore, it deals with the chances both of overfitting
    and underfitting. The model with the lowest AIC score is preferred over other
    models.


    ```

    [In]: model_predictions.aic

    [Out]: -1939.88

    ```


    We can run the GLM for multiple distributions, such as


    1.  Binomial

    2.  Poisson

    3.  Gamma

    4.  Tweedie


    ```

    [In]: glr = GeneralizedLinearRegression(family=''Binomial'')

    [In]: glr_model = glr.fit(train)

    [In]: model_predictions=glr_model.evaluate(test)

    [In]: model_predictions.aic

    [Out]: 336.991

    [In]: glr = GeneralizedLinearRegression(family=''Poisson'')

    [In]: glr_model = glr.fit(train)

    [In]: predictions=glr_model.evaluate(test)

    [In]: predictions.aic

    [Out]: 266.53

    [In]: glr = GeneralizedLinearRegression(family=''Gamma'')

    [In]: glr_model = glr.fit(train)

    [In]:model_predictions=glr_model.evaluate(test)

    [In]: model_predictions.aic

    [Out]: -1903.81

    ```


    Here we can see that our default GLM model with Gaussian distribution has the
    lowest AIC value, compared to others.


    ### Decision Tree Regression


    The decision tree regression algorithm can be used for both regression and classification.
    It is quite powerful in terms of fitting the data well but comes with the high
    risk of sometimes overfitting the data. Decision trees contain multiple splits
    based on entropy or Gini indexes. The deeper the tree, the higher the chance of
    overfitting the data. In our example, we will build a decision tree for predicting
    the target value, with the default value of parameters (`maxdepth = 5`).


    #### Step 1: Build and Train Decision Tree Regressor Model


    ```

    [In]: from pyspark.ml.regression import DecisionTreeRegressor

    [In]: dec_tree = DecisionTreeRegressor()

    [In]: dec_tree_model = dec_tree.fit(train)

    [In]: dec_tree_model.featureImportances

    [Out]: SparseVector(5, {0: 0.9641, 1: 0.0193, 2: 0.0029, 3: 0.0053, 4: 0.0084})

    ```


    #### Step 2: Evaluate the Model Performance on Test Data


    ```

    [In]: model_predictions = dec_tree_model.transform(test)

    [In]: model_predictions.show()

    [Out]:

    ```


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Figf_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Figf_HTML.jpg)


    We import `RegressionEvaluation` from MLlib, to evaluate the performance of the
    decision tree on test data. As of now, there are two metrics available for evaluation:
    `r2` and RMSE (root mean squared error). `r2` mainly suggests how much of the
    variation in the dataset can be attributed to regression. Therefore, the higher
    the `r2`, the better the performance of the model. On the other hand, RMSE suggests
    the total errors the model is making, in terms of the difference between actual
    and predicted values.


    ```

    [In]: from pyspark.ml.evaluation import RegressionEvaluator

    [In]: dt_evaluator = RegressionEvaluator(metricName=''r2'')

    [In]: dt_r2 = dt_evaluator.evaluate(model_predictions)

    [In]: print(f''The r-square value of DecisionTreeRegressor is {dt_r2}'')

    [Out]: The r-square value of DecisionTreeRegressor is 0.8093834699203476

    [In]: dt_evaluator = RegressionEvaluator(metricName=''rmse'')

    [In]: dt_rmse = dt_evaluator.evaluate(model_predictions)

    [In]: print(f''The rmse value of DecisionTreeRegressor is {dt_rmse}'')

    [Out]: The rmse value of DecisionTreeRegressor is 0.014111932287681688

    ```


    The `r2` value of this particular model is close to 0.81, which is a little lower
    than that of a simple linear regression model.


    ### Random Forest Regressors


    Random forest regressors are a collection of multiple individual decision trees
    built using different samples of data. The whole idea of combining these individual
    trees is to take majority voting or averages (in case of regression) to generalize
    effectively. A random forest is, therefore, an ensembling technique that takes
    a bagging approach. It can be used for regression as well as for classification
    tasks. Because decision trees tend to overfit the data, random forests remove
    the element of high variance, by taking the means of the predicted values from
    individual trees. In our example, we will build a random forest model for regression,
    using default parameters (`numTrees = 20`)


    #### Step 1: Build and Train Random Forest Regressor Model


    ```

    [In]: from pyspark.ml.regression import RandomForestRegressor

    [In]: rf = RandomForestRegressor()

    [In]: rf_model = rf.fit(train)

    [In]:  rf_model.featureImportances

    [Out]: SparseVector(5, {0: 0.4395, 1: 0.045, 2: 0.0243, 3: 0.2725, 4: 0.2188})

    ```


    As you can see, the number of trees in the random forest is equal to 20. This
    number can be increased.


    ```

    [In]: rf_model.getNumTrees

    [Out]: 20

    [In]: model_predictions = rf_model.transform(test)

    [In]: model_predictions.show()

    [Out]:

    ```


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Figg_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Figg_HTML.jpg)


    #### Step 2: Evaluate the Model Performance on Test Data


    We can again use `r2` and RMSE as the evaluation parameter of the random forest
    model.


    ```

    [In]:rf_evaluator = RegressionEvaluator(metricName=''r2'')

    [In]: rf_r2 = rf_evaluator.evaluate(model_predictions)

    [In]: print(f''The r-square value of RandomForestRegressor is {rf_r2}'')

    [Out]: The r-square value of RandomForestRegressor is 0.8215863293044671

    [In]: rf_evaluator = RegressionEvaluator(metricName=''rmse'')

    [In]: rf_rmse = rf_evaluator.evaluate(model_predictions)

    [In]: print(f''The rmse value of RandomForestRegressor is {rf_rmse}'')

    [Out]: The rmse value of RandomForestRegressor is 0.01365275410722947

    ```


    As you can see, it clearly outperforms the decision tree regressor and has a higher
    `r2`. The performance of this model can further be enhanced with hyperparameter
    tuning.'
