- fmt: "# Setting Up Your Environment\n\nIn this final section of this chapter, I\
    \ will go over how to set up the Spark environment in the cloud. There are multiple\
    \ ways in which we can use Spark:\n\n- Local setup\n- Dockers\n- Cloud environment\
    \ (GCP, AWS, Azure)\n- Databricks\n\n## Local Setup\n\nIt is relatively easy to\
    \ install and use Spark on a local system, but it fails the core purpose of Spark\
    \ itself, if it’s not used on a cluster. Spark’s core offering is distributed\
    \ data processing, which will always be limited to a local system’s capacity,\
    \ in the case that it’s run on a local system, whereas one can benefit more by\
    \ using Spark on a group of machines instead. However, it is always good practice\
    \ to have Spark locally, as well as to test code on sample data. So, follow these\
    \ steps to do so:\n\n1. Ensure that Java is installed; otherwise install Java.\n\
    2. Download the latest version of Apache Spark from [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html).\n\
    3. Extract the files from the zipped folder.\n4. Copy all the Spark-related files\
    \ to their respective directory.\n5. Configure the environment variables to be\
    \ able to run Spark.\n6. Verify the installation and run Spark.\n\n## Dockers\n\
    \nAnother way of using Spark locally is through the containerization technique\
    \ of dockers. This allows users to wrap all the dependencies and Spark files into\
    \ a single image, which can be run on any system. We can kill the container after\
    \ the task is finished and rerun it, if required. To use dockers for running Spark,\
    \ we must install Docker on the system first and then simply run the following\
    \ command: `docker run -it -p 8888:8888 jupyter/pyspark-notebook`.\n\n## Cloud\
    \ Environments\n\nAs discussed earlier in this chapter, for various reasons, local\
    \ sets are not of much help when it comes to big data, and that’s where cloud-based\
    \ environments make it possible to ingest and process huge datasets in a short\
    \ period. The real power of Spark can be seen easily while dealing with large\
    \ datasets (in excess of 100TB). Most of the cloud-based infra-providers allow\
    \ you to install Spark, which sometimes comes preconfigured as well. One can easily\
    \ spin up the clusters with required specifications, according to need. One of\
    \ the cloud-based environments is Databricks.\n\n### Databricks\n\nDatabricks\
    \ is a company founded by the creators of Spark, in order to provide the enterprise\
    \ version of Spark to businesses, in addition to full-fledged support. To increase\
    \ Spark’s adoption among the community and other users, Databricks also provides\
    \ a free community edition of Spark, with a 6GB cluster (single node). You can\
    \ increase the size of the cluster by signing up for an enterprise account with\
    \ Databricks, using the following steps:\n\n1. Search for the Databricks web site\
    \ and select Databricks Community Edition, as shown in Figure [1-6](#478390_1_En_1_Chapter.xhtml#Fig6).\n\
    \n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig6_HTML.jpg](images/478390_1_En_1_Chapter/478390_1_En_1_Fig6_HTML.jpg)\n\
    \n   Figure 1-6 Databricks web page\n\n2. If you have a user account with Databricks,\
    \ you can simply log in. If you don’t have an account, you must create one, in\
    \ order to use Databricks, as shown in Figure [1-7](#478390_1_En_1_Chapter.xhtml#Fig7).\n\
    \n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig7_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig7_HTML.png)\n\
    \n   Figure 1-7 Databricks login\n\n3. Once you are on the home page, you can\
    \ choose to either load a new data source or create a notebook from scratch, as\
    \ shown in Figure [1-8](#478390_1_En_1_Chapter.xhtml#Fig8). In the latter case,\
    \ you must have the cluster up and running, to be able to use the notebook. Therefore,\
    \ you must click New Cluster, to spin up the cluster. (Databricks provides a 6GB\
    \ AWS EMR cluster.)\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig8_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig8_HTML.png)\n\
    \n   Figure 1-8 Creating a Databricks notebook\n\n4. To set up the cluster, you\
    \ must give a name to the cluster and select the version of Spark that must configure\
    \ with the Python version, as shown in Figure [1-9](#478390_1_En_1_Chapter.xhtml#Fig9).\
    \ Once all the details are filled in, you must click Create Cluster and wait a\
    \ couple of minutes, until it spins up.\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig9_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig9_HTML.png)\n\
    \n   Figure 1-9 Creating a Databricks cluster\n\n5. You can also view the status\
    \ of the cluster by going into the Clusters option on the left side widget, as\
    \ shown in Figure [1-10](#478390_1_En_1_Chapter.xhtml#Fig10). It gives all the\
    \ information associated with the particular cluster and its current status.\n\
    \n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig10_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig10_HTML.png)\n\
    \n   Figure 1-10 Databricks cluster list\n\n6. The final step is to open a notebook\
    \ and attach it to the cluster you just created (Figure [1-11](#478390_1_En_1_Chapter.xhtml#Fig11)).\
    \ Once attached, you can start the PySpark code.\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig11_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig11_HTML.png)\n\
    \n   Figure 1-11 Databricks notebook\n\nOverall, since 2010, when Spark became\
    \ an open source platform, its users have risen in number consistently, and the\
    \ community continues to grow every day. It’s no surprise that the number of contributors\
    \ to Spark has outpaced that of Hadoop. Some of the reasons for Spark’s popularity\
    \ were noted in a survey, the results of which are shown in Figure [1-12](#478390_1_En_1_Chapter.xhtml#Fig12).\n\
    \n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig12_HTML.jpg](images/478390_1_En_1_Chapter/478390_1_En_1_Fig12_HTML.jpg)\n\
    \nFigure 1-12 Results of Spark adoption survey\n\n## Conclusion\n\nThis chapter\
    \ provided a brief history of Spark, its core components, and the process of accessing\
    \ it in a cloud environment. In upcoming chapters, I will delve deeper into the\
    \ various aspects of Spark and how to build different applications with it.\n\n\
    # 2. Data Processing\n\nThis chapter covers different steps to preprocess and\
    \ handle data in PySpark. Preprocessing techniques can certainly vary from case\
    \ to case, and many different methods can be used to massage the data into desired\
    \ form. The idea of this chapter is to expose some of the common techniques for\
    \ dealing with big data in Spark. In this chapter, we are going to go over different\
    \ steps involved in preprocessing data, such as handling missing values, merging\
    \ datasets, applying functions, aggregations, and sorting. One major part of data\
    \ preprocessing is the transformation of numerical columns into categorical ones\
    \ and vice versa, which we are going to look at over the next few chapters and\
    \ are based on machine learning. The dataset that we are going to make use of\
    \ in this chapter is inspired by a primary research dataset and contains a few\
    \ attributes from the original dataset, with additional columns containing fabricated\
    \ data points.\n\n### Note\n\nAll the following steps are written in Jupyter Notebook,\
    \ running Spark on a Docker image (mentioned in Chapter [1](#478390_1_En_1_Chapter.xhtml)).\
    \ All the subsequent code can also be run in Databricks.\n\n## Creating a SparkSession\
    \ Object\n\nThe first step is to create a `SparkSession` object, in order to use\
    \ Spark. We also import all the required functions and datatypes from `spark.sql`:\n\
    \n```\n[In]: from pyspark.sql import SparkSession\n[In]: spark=SparkSession.builder.appName('data_processing').getOrCreate()\n\
    [In]: import pyspark.sql.functions as F\n[In]: from pyspark.sql.types import *\n\
    ```\n\nNow, instead of directly reading a file to create a dataframe, we go over\
    \ the process of creating a dataframe, by passing key values. The way we create\
    \ a dataframe in Spark is by declaring its schema and pass the columns values."
  raw: "## Setting Up Your Environment\n\nIn this final section of this chapter, I\
    \ will go over how to set up the Spark environment in the cloud. There are multiple\
    \ ways in which we can use Spark:\n\n*   Local setup\n\n*   Dockers\n\n*   Cloud\
    \ environment (GCP, AWS, Azure)\n\n*   Databricks\n\n### Local Setup\n\nIt is\
    \ relatively easy to install and use Spark on a local system, but it fails the\
    \ core purpose of Spark itself, if it’s not used on a cluster. Spark’s core offering\
    \ is distributed data processing, which will always be limited to a local system’s\
    \ capacity, in the case that it’s run on a local system, whereas one can benefit\
    \ more by using Spark on a group of machines instead. However, it is always good\
    \ practice to have Spark locally, as well as to test code on sample data. So,\
    \ follow these steps to do so:\n\n1.  Ensure that Java is installed; otherwise\
    \ install Java.\n\n2.  Download the latest version of Apache Spark from [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html)\
    \ .\n\n3.  Extract the files from the zipped folder.\n\n4.  Copy all the Spark-related\
    \ files to their respective directory.\n\n5.  Configure the environment variables\
    \ to be able to run Spark.\n\n6.  Verify the installation and run Spark.\n\n###\
    \ Dockers\n\nAnother way of using Spark locally is through the containerization\
    \ technique of dockers . This allows users to wrap all the dependencies and Spark\
    \ files into a single image, which can be run on any system. We can kill the container\
    \ after the task is finished and rerun it, if required. To use dockers for running\
    \ Spark, we must install Docker on the system first and then simply run the following\
    \ command: `[In]: docker run -it -p 8888:8888 jupyter/pyspark-notebook\"`.\n\n\
    ### Cloud Environments\n\nAs discussed earlier in this chapter, for various reasons,\
    \ local sets are not of much help when it comes to big data, and that’s where\
    \ cloud-based environments make it possible to ingest and process huge datasets\
    \ in a short period. The real power of Spark can be seen easily while dealing\
    \ with large datasets (in excess of 100TB). Most of the cloud-based infra-providers\
    \ allow you to install Spark, which sometimes comes preconfigured as well. One\
    \ can easily spin up the clusters with required specifications, according to need.\
    \ One of the cloud-based environments is Databricks.\n\n#### Databricks\n\nDatabricks\
    \ is a company founded by the creators of Spark, in order to provide the enterprise\
    \ version of Spark to businesses, in addition to full-fledged support. To increase\
    \ Spark’s adoption among the community and other users, Databricks also provides\
    \ a free community edition of Spark, with a 6GB cluster (single node). You can\
    \ increase the size of the cluster by signing up for an enterprise account with\
    \ Databricks, using the following steps:\n\n1.  Search for the Databricks web\
    \ site and select Databricks Community Edition, as shown in Figure [1-6](#478390_1_En_1_Chapter.xhtml#Fig6).\n\
    \n    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig6_HTML.jpg](images/478390_1_En_1_Chapter/478390_1_En_1_Fig6_HTML.jpg)\n\
    \n    Figure 1-6\n\n    Databricks web page\n\n2.  If you have a user account\
    \ with Databricks, you can simply log in. If you don’t have an account, you must\
    \ create one, in order to use Databricks, as shown in Figure [1-7](#478390_1_En_1_Chapter.xhtml#Fig7).\n\
    \n    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig7_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig7_HTML.png)\n\
    \n    Figure 1-7\n\n    Databricks login\n\n3.  Once you are on the home page,\
    \ you can choose to either load a new data source or create a notebook from scratch,\
    \ as shown in Figure [1-8](#478390_1_En_1_Chapter.xhtml#Fig8). In the latter case,\
    \ you must have the cluster up and running, to be able to use the notebook. Therefore,\
    \ you must click New Cluster, to spin up the cluster. (Databricks provides a 6GB\
    \ AWS EMR cluster.)\n\n    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig8_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig8_HTML.png)\n\
    \n    Figure 1-8\n\n    Creating a Databricks notebook\n\n4.  To set up the cluster,\
    \ you must give a name to the cluster and select the version of Spark that must\
    \ configure with the Python version, as shown in Figure [1-9](#478390_1_En_1_Chapter.xhtml#Fig9).\
    \ Once all the details are filled in, you must click Create Cluster and wait a\
    \ couple of minutes, until it spins up.\n\n    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig9_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig9_HTML.png)\n\
    \n    Figure 1-9\n\n    Creating a Databricks cluster\n\n5.  You can also view\
    \ the status of the cluster by going into the Clusters option on the left side\
    \ widget, as shown in Figure [1-10](#478390_1_En_1_Chapter.xhtml#Fig10). It gives\
    \ all the information associated with the particular cluster and its current status.\n\
    \n    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig10_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig10_HTML.png)\n\
    \n    Figure 1-10\n\n    Databricks cluster list\n\n6.  The final step is to open\
    \ a notebook and attach it to the cluster you just created (Figure [1-11](#478390_1_En_1_Chapter.xhtml#Fig11)).\
    \ Once attached, you can start the PySpark code.\n\n    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig11_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig11_HTML.png)\n\
    \n    Figure 1-11\n\n    Databricks notebook\n\nOverall, since 2010, when Spark\
    \ became an open source platform, its users have risen in number consistently,\
    \ and the community continues to grow every day. It’s no surprise that the number\
    \ of contributors to Spark has outpaced that of Hadoop. Some of the reasons for\
    \ Spark’s popularity were noted in a survey, the results of which are shown in\
    \ Figure [1-12](#478390_1_En_1_Chapter.xhtml#Fig12).\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig12_HTML.jpg](images/478390_1_En_1_Chapter/478390_1_En_1_Fig12_HTML.jpg)\n\
    \nFigure 1-12\n\nResults of Spark adoption survey\n\n## Conclusion\n\nThis chapter\
    \ provided a brief history of Spark, its core components, and the process of accessing\
    \ it in a cloud environment. In upcoming chapters, I will delve deeper into the\
    \ various aspects of Spark and how to build different applications with it.\n\n\
    # 2. Data Processing\n\nThis chapter covers different steps to preprocess and\
    \ handle data in PySpark. Preprocessing techniques can certainly vary from case\
    \ to case, and many different methods can be used to massage the data into desired\
    \ form. The idea of this chapter is to expose some of the common techniques for\
    \ dealing with big data in Spark. In this chapter, we are going to go over different\
    \ steps involved in preprocessing data, such as handling missing values, merging\
    \ datasets, applying functions, aggregations, and sorting. One major part of data\
    \ preprocessing is the transformation of numerical columns into categorical ones\
    \ and vice versa, which we are going to look at over the next few chapters and\
    \ are based on machine learning. The dataset that we are going to make use of\
    \ in this chapter is inspired by a primary research dataset and contains a few\
    \ attributes from the original dataset, with additional columns containing fabricated\
    \ data points.\n\n### Note\n\nAll the following steps are written in Jupyter Notebook,\
    \ running Spark on a Docker image (mentioned in Chapter [1](#478390_1_En_1_Chapter.xhtml)).\
    \ All the subsequent code can also be run in Databricks.\n\n## Creating a SparkSession\
    \ Object\n\nThe first step is to create a `SparkSession` object , in order to\
    \ use Spark. We also import all the required functions and datatypes from `spark.sql`:\n\
    \n```\n[In]: from pyspark.sql import SparkSession\n[In]: spark=SparkSession.builder.appName('data_processing').getOrCreate()\n\
    [In]: import pyspark.sql.functions as F\n[In]: from pyspark.sql.types import *\n\
    ```\n\nNow, instead of directly reading a file to create a dataframe, we go over\
    \ the process of creating a dataframe, by passing key values. The way we create\
    \ a dataframe in Spark is by declaring its schema and pass the columns values."
  trans: "\n# 搭建开发环境\n\n在本章的最后部分，我将介绍如何在云端搭建 Spark 环境。使用 Spark 有多种方式：\n\n- 本地搭建\n\
    - Docker 容器\n- 云环境（GCP、AWS、Azure）\n- Databricks\n\n## 本地搭建\n\n在本地系统上安装和使用 Spark\
    \ 相对容易，但如果不部署在集群上，就违背了 Spark 本身的核心用途。Spark 的核心价值在于分布式数据处理，若仅在本地系统运行，其能力将始终受限于单机性能；而将\
    \ Spark 部署在多台机器上才能发挥更大优势。不过，在本地保留 Spark 环境，并用样本数据测试代码仍是不错的做法。请按以下步骤操作：\n\n1. 确保已安装\
    \ Java，否则请安装 Java。\n2. 从 [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html)\
    \ 下载最新版 Apache Spark。\n3. 解压压缩包中的文件。\n4. 将所有 Spark 相关文件复制到对应目录。\n5. 配置环境变量以运行\
    \ Spark。\n6. 验证安装并运行 Spark。\n\n## Docker 容器\n\n另一种本地使用 Spark 的方式是通过 Docker 容器化技术。这允许用户将所有依赖和\
    \ Spark 文件打包成一个镜像，可在任何系统上运行。任务完成后可终止容器，需要时再重新运行。要使用 Docker 运行 Spark，需先在系统上安装 Docker，然后执行以下命令：`docker\
    \ run -it -p 8888:8888 jupyter/pyspark-notebook`。\n\n## 云环境\n\n如本章前文所述，由于多种原因，本地环境在处理大数据时作用有限，而基于云的环境则能在短时间内完成海量数据的摄取和处理。在处理超过\
    \ 100TB 的大数据集时，Spark 的真正威力才能充分展现。大多数云基础设施提供商都允许安装 Spark，有时甚至预配置了 Spark。用户可根据需求轻松启动符合规格的集群。Databricks\
    \ 就是其中一种云环境。\n\n### Databricks\n\nDatabricks 由 Spark 的创始团队创立，旨在为企业提供 Spark 企业版及全面支持。为提升\
    \ Spark 在社区和用户中的普及度，Databricks 还提供了免费的社区版 Spark，配备 6GB 集群（单节点）。如需扩大集群规模，可注册 Databricks\
    \ 企业版账户，步骤如下：\n\n1. 搜索 Databricks 网站，选择 Databricks 社区版，如图 1-6 所示。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig6_HTML.jpg](img/478390_1_En_1_Fig6_HTML.jpg)\n\
    \n   图 1-6 Databricks 网页\n\n2. 若已有 Databricks 账户，可直接登录。若无账户，需先创建账户才能使用 Databricks，如图\
    \ 1-7 所示。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig7_HTML.png](img/478390_1_En_1_Fig7_HTML.png)\n\
    \n   图 1-7 Databricks 登录页面\n\n3. 进入主页后，可选择加载新数据源或从头创建笔记本，如图 1-8 所示。若选择创建笔记本，需确保集群已启动运行。因此需点击\"\
    新建集群\"来启动集群（Databricks 提供 6GB 的 AWS EMR 集群）。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig8_HTML.png](img/478390_1_En_1_Fig8_HTML.png)\n\
    \n   图 1-8 创建 Databricks 笔记本\n\n4. 配置集群时，需为集群命名，并选择与 Python 版本匹配的 Spark 版本，如图\
    \ 1-9 所示。填写完所有信息后，点击\"创建集群\"，等待数分钟直至集群启动。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig9_HTML.png](img/478390_1_En_1_Fig9_HTML.png)\n\
    \n   图 1-9 创建 Databricks 集群\n\n5. 可通过左侧面板的\"集群\"选项查看集群状态，如图 1-10 所示。该页面显示特定集群的所有相关信息及其当前状态。\n\
    \n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig10_HTML.png](img/478390_1_En_1_Fig10_HTML.png)\n\
    \n   图 1-10 Databricks 集群列表\n\n6. 最后一步是打开笔记本并将其连接到刚创建的集群（图 1-11）。连接成功后即可开始编写 PySpark\
    \ 代码。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig11_HTML.png](img/478390_1_En_1_Fig11_HTML.png)\n\
    \n   图 1-11 Databricks 笔记本\n\n总体而言，自 2010 年 Spark 成为开源平台以来，其用户数量持续增长，社区规模与日俱增。Spark\
    \ 的贡献者数量已超过 Hadoop，这并不令人意外。一项调查揭示了 Spark 受欢迎的部分原因，结果如图 1-12 所示。\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig12_HTML.jpg](img/478390_1_En_1_Fig12_HTML.jpg)\n\
    \n图 1-12 Spark 采用情况调查结果\n\n## 本章小结\n\n本章简要介绍了 Spark 的发展历史、核心组件以及在云环境中访问 Spark\
    \ 的方法。在后续章节中，我将深入探讨 Spark 的各个方面，以及如何用它构建不同的应用程序。\n\n# 2. 数据处理\n\n本章涵盖在 PySpark\
    \ 中预处理和处理数据的不同步骤。预处理技术因场景而异，有多种方法可将数据塑造成所需形式。本章旨在介绍 Spark 中处理大数据的一些常用技术。我们将学习数据预处理涉及的不同步骤，包括处理缺失值、合并数据集、应用函数、聚合和排序。数据预处理的一个重要部分是将数值列转换为分类列（反之亦然），这将在后续几章中结合机器学习进行讲解。本章使用的数据集基于一项原始研究数据集，包含原始数据集中的部分属性，并添加了包含虚构数据点的额外列。\n\
    \n### 注意\n\n以下所有步骤均在 Jupyter Notebook 中编写，Spark 运行在 Docker 镜像上（详见第 1 章）。后续所有代码也可在\
    \ Databricks 中运行。\n\n## 创建 SparkSession 对象\n\n第一步是创建 `SparkSession` 对象以使用 Spark。同时从\
    \ `spark.sql` 导入所有必要的函数和数据类型：\n\n```\n[In]: from pyspark.sql import SparkSession\n\
    [In]: spark=SparkSession.builder.appName('data_processing').getOrCreate()\n[In]:\
    \ import pyspark.sql.functions as F\n[In]: from pyspark.sql.types import *\n```\n\
    \n现在，我们不直接读取文件创建数据框，而是通过传递键值来演示创建数据框的过程。在 Spark 中创建数据框的方式是声明其模式并传递列值。\n"
- fmt: '### Creating Dataframes


    In the following example, we are creating a new dataframe with five columns of
    certain datatypes (`string` and `integer`). As you can see, when we call `show`
    on the new dataframe, it is created with three rows and five columns containing
    the values passed by us.


    ```

    [In]: schema=StructType().add("user_id","string").add("country","string").add("browser",
    "string").add("OS",''string'').add("age", "integer")

    [In]: df=spark.createDataFrame([("A203",''India'',"Chrome","WIN",33),("A201",''China'',"Safari","MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figa_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figa_HTML.jpg)


    ```

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figb_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figb_HTML.jpg)


    ### Null Values


    It is very common to have null values as part of the overall data. Therefore,
    it becomes critical to add a step to the data processing pipeline, to handle the
    null values. In Spark, we can deal with null values by either replacing them with
    some specific value or dropping the rows/columns containing null values.


    First, we create a new dataframe (`df_na`) that contains null values in two of
    its columns (the schema is the same as in the earlier dataframe). By the first
    approach to deal with null values, we fill all null values in the present dataframe
    with a value of `0`, which offers a quick fix. We use the `fillna` function to
    replace all the null values in the dataframe with `0`. By the second approach,
    we replace the null values in specific columns (`country`, `browser`) with `''USA''`
    and `''Safari''`, respectively.


    ```

    [In]: df_na=spark.createDataFrame([("A203",None,"Chrome","WIN",33),("A201",''China'',None,"MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

    [In]: df_na.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figc_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figc_HTML.jpg)


    ```

    [In]: df_na.fillna(''0'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figd_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figd_HTML.jpg)


    ```

    [In]: df_na.fillna( { ''country'':''USA'', ''browser'':''Safari'' } ).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fige_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Fige_HTML.jpg)


    In order to drop the rows with any null values, we can simply use the `na.drop`
    functionality in PySpark. Whereas if this needs to be done for specific columns,
    we can pass the set of column names as well, as shown in the following example:


    ```

    [In]: df_na.na.drop().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figf_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figf_HTML.jpg)


    ```

    [In]: df_na.na.drop(subset=''country'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figg_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figg_HTML.jpg)


    Another very common step in data processing is to replace some data points with
    particular values. We can use the `replace` function for this, as shown in the
    following example. To drop the column of a dataframe, we can use the `drop` functionality
    of PySpark.


    ```

    [In]: df_na.replace("Chrome","Google Chrome").show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figh_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figh_HTML.jpg)


    ```

    [In]: df_na.drop(''user_id'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figi_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figi_HTML.jpg)


    Now that we have seen how to create a dataframe by passing a value and how to
    treat missing values, we can create a Spark dataframe, by reading a file (`.csv`,
    `parquet`, etc.). The dataset contains a total of seven columns and 2,000 rows.
    The summary function allows us to see the statistical measures of the dataset,
    such as the min, max, and mean of the numerical data present in the dataframe.


    ```

    [In]: df=spark.read.csv("customer_data.csv",header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 2000

    [In]: len(df.columns)

    [Out]: 7

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figj_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figj_HTML.jpg)


    ```

    [In]: df.show(3)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figk_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figk_HTML.jpg)


    ```

    [In]: df.summary().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figl_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figl_HTML.jpg)


    Most of the time, we won’t use all the columns present in the dataframe, as some
    might be redundant and carry very little value in terms of providing useful information.
    Therefore, subsetting the dataframe becomes critical for having proper data in
    place for analysis. I’ll cover this in the next section.


    ## Subset of a Dataframe


    A subset of a dataframe can be created, based on multiple conditions in which
    we either select a few rows, columns, or data with certain filters in place. In
    the following examples, you will see how we can create a subset of the original
    dataframe, based on certain conditions, to demonstrate the process of filtering
    records.


    *   Select

    *   Filter

    *   Where


    ### Select


    In this example, we take one of the dataframe columns, `''Avg_Salary''`, and create
    a subset of the original dataframe, using `select`. We can pass any number of
    columns that must be present in the subset. We then apply a filter on the dataframe,
    to extract the records, based on a certain threshold (`Avg_Salary > 1000000`).
    Once filtered, we can either take the total count of records present in the subset
    or take it for further processing.


    ```

    [In]: df.select([''Customer_subtype'',''Avg_Salary'']).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figm_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figm_HTML.jpg)


    ```

    [In]: df.filter(df[''Avg_Salary''] > 1000000).count()

    [In]: 128

    [In]: df.filter(df[''Avg_Salary''] > 1000000).show()

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fign_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Fign_HTML.jpg)


    ### Filter


    We can also apply more than one filter on the dataframe, by including more conditions,
    as shown following. This can be done in two ways: first, by applying consecutive
    filters, then by using (`&`, `or`) operands with a `where` statement.


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figo_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figo_HTML.jpg)


    ```

    [In]: df.filter(df[''Avg_Salary''] > 500000).filter(df[''Number_of_houses''] >
    2).show()

    [Out]:

    ```


    ### Where


    ```

    [In]: df.where((df[''Avg_Salary''] > 500000) & (df[''Number_of_houses''] > 2)).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figp_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figp_HTML.jpg)


    Now that we have seen how to create a subset from a dataframe, we can move on
    to aggregations in PySpark.'
  raw: '### Creating Dataframes


    In the following example, we are creating a new dataframe with five columns of
    certain datatypes (string and integer). As you can see, when we call show on the
    new dataframe, it is created with three rows and five columns containing the values
    passed by us.


    ```

    [In]:schema=StructType().add("user_id","string").add("country","string").add("browser",
    "string").add("OS",''string'').add("age", "integer")

    [In]: df=spark.createDataFrame([("A203",''India'',"Chrome","WIN",33),("A201",''China'',"Safari","MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figa_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figa_HTML.jpg)


    ```

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figb_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figb_HTML.jpg)


    ### Null Values


    It is very common to have null values as part of the overall data. Therefore,
    it becomes critical to add a step to the data processing pipeline, to handle the
    null values. In Spark, we can deal with null values by either replacing them with
    some specific value or dropping the rows/columns containing null values.


    First, we create a new dataframe (`df_na`) that contains null values in two of
    its columns (the schema is the same as in the earlier dataframe). By the first
    approach to deal with null values, we fill all null values in the present dataframe
    with a value of 0, which offers a quick fix. We use the `fillna` function to replace
    all the null values in the dataframe with 0\. By the second approach, we replace
    the null values in specific columns (country, browser) with `''USA''` and `''Safari''`,
    respectively.


    ```

    [In]: df_na=spark.createDataFrame([("A203",None,"Chrome","WIN",33),("A201",''China'',None,"MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

    [In]: df_na.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figc_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figc_HTML.jpg)


    ```

    [In]: df_na.fillna(''0'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figd_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figd_HTML.jpg)


    ```

    [In]: df_na.fillna( { ''country'':''USA'', ''browser'':''Safari'' } ).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fige_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Fige_HTML.jpg)


    In order to drop the rows with any null values, we can simply use the `na.drop`
    functionality in PySpark. Whereas if this needs to be done for specific columns,
    we can pass the set of column names as well, as shown in the following example:


    ```

    [In]: df_na.na.drop().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figf_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figf_HTML.jpg)


    ```

    [In]: df_na.na.drop(subset=''country'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figg_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figg_HTML.jpg)


    Another very common step in data processing is to replace some data points with
    particular values. We can use the `replace` function for this, as shown in the
    following example. To drop the column of a dataframe, we can use the `drop` functionality
    of PySpark.


    ```

    [In]: df_na.replace("Chrome","Google Chrome").show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figh_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figh_HTML.jpg)


    ```

    [In]: df_na.drop(''user_id'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figi_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figi_HTML.jpg)


    Now that we have seen how to create a dataframe by passing a value and how to
    treat missing values, we can create a Spark dataframe, by reading a file (`.csv`,
    `parquet`, etc.). The dataset contains a total of seven columns and 2,000 rows.
    The summary function allows us to see the statistical measures of the dataset,
    such as the min, max, and mean of the numerical data present in the dataframe.


    ```

    [In]: df=spark.read.csv("customer_data.csv",header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 2000

    [In]: len(df.columns)

    [Out]: 7

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figj_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figj_HTML.jpg)


    ```

    [In]: df.show(3)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figk_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figk_HTML.jpg)


    ```

    [In]: df.summary().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figl_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figl_HTML.jpg)


    Most of the time, we won’t use all the columns present in the dataframe, as some
    might be redundant and carry very little value in terms of providing useful information.
    Therefore, subsetting the dataframe becomes critical for having proper data in
    place for analysis. I’ll cover this in the next section.


    ## Subset of a Dataframe


    A subset of a dataframe can be created, based on multiple conditions in which
    we either select a few rows, columns, or data with certain filters in place. In
    the following examples, you will see how we can create a subset of the original
    dataframe, based on certain conditions, to demonstrate the process of filtering
    records.


    *   Select


    *   Filter


    *   Where


    ### Select


    In this example, we take one of the dataframe columns, `''Avg_Salary''`, and create
    a subset of the original dataframe, using `select`. We can pass any number of
    columns that must be present in the subset. We then apply a filter on the dataframe,
    to extract the records, based on a certain threshold (`Avg_Salary > 1000000`).
    Once filtered, we can either take the total count of records present in the subset
    or take it for further processing.


    ```

    [In]: df.select([''Customer_subtype'',''Avg_Salary'']).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figm_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figm_HTML.jpg)


    ```

    [In]: df.filter(df[''Avg_Salary''] > 1000000).count()

    [In]: 128

    [In]: df.filter(df[''Avg_Salary''] > 1000000).show()

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fign_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Fign_HTML.jpg)


    ### Filter


    We can also apply more than one filter on the dataframe, by including more conditions,
    as shown following. This can be done in two ways: first, by applying consecutive
    filters, then by using `(&`, `or)` operands with a `where` statement.


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figo_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figo_HTML.jpg)


    ```

    [In]: df.filter(df[''Avg_Salary''] > 500000).filter(df[''Number_of_houses''] >
    2).show()

    [Out]:

    ```


    ### Where


    ```

    [In]: df.where((df[''Avg_Salary''] > 500000) & (df[''Number_of_houses''] > 2)).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figp_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figp_HTML.jpg)


    Now that we have seen how to create a subset from a dataframe, we can move on
    to aggregations in PySpark.'
  trans: '

    ### 创建数据框


    在以下示例中，我们创建了一个新的数据框，其中包含五种特定数据类型（`string` 和 `integer`）的列。如您所见，当我们在新数据框上调用 `show`
    时，它会创建三行五列，包含我们传入的值。


    ```

    [In]: schema=StructType().add("user_id","string").add("country","string").add("browser",
    "string").add("OS",''string'').add("age", "integer")

    [In]: df=spark.createDataFrame([("A203",''India'',"Chrome","WIN",33),("A201",''China'',"Safari","MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figa_HTML.jpg](img/478390_1_En_2_Figa_HTML.jpg)


    ```

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figb_HTML.jpg](img/478390_1_En_2_Figb_HTML.jpg)


    ### 空值


    空值是整体数据中非常常见的组成部分。因此，在数据处理流程中添加一个步骤来处理空值变得至关重要。在 Spark 中，我们可以通过将空值替换为特定值，或者删除包含空值的行/列来处理空值。


    首先，我们创建一个新的数据框（`df_na`），其中两列包含空值（其模式与之前的数据框相同）。处理空值的第一种方法是，将当前数据框中的所有空值填充为 `0`，这提供了一种快速修复方案。我们使用
    `fillna` 函数将数据框中的所有空值替换为 `0`。第二种方法是，将特定列（`country`、`browser`）中的空值分别替换为 `''USA''`
    和 `''Safari''`。


    ```

    [In]: df_na=spark.createDataFrame([("A203",None,"Chrome","WIN",33),("A201",''China'',None,"MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

    [In]: df_na.show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figc_HTML.jpg](img/478390_1_En_2_Figc_HTML.jpg)


    ```

    [In]: df_na.fillna(''0'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figd_HTML.jpg](img/478390_1_En_2_Figd_HTML.jpg)


    ```

    [In]: df_na.fillna( { ''country'':''USA'', ''browser'':''Safari'' } ).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fige_HTML.jpg](img/478390_1_En_2_Fige_HTML.jpg)


    为了删除包含任何空值的行，我们可以简单地使用 PySpark 中的 `na.drop` 功能。而如果需要针对特定列执行此操作，我们也可以传入列名集合，如下例所示：


    ```

    [In]: df_na.na.drop().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figf_HTML.jpg](img/478390_1_En_2_Figf_HTML.jpg)


    ```

    [In]: df_na.na.drop(subset=''country'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figg_HTML.jpg](img/478390_1_En_2_Figg_HTML.jpg)


    数据处理中另一个非常常见的步骤是将某些数据点替换为特定值。我们可以使用 `replace` 函数来实现，如下例所示。要删除数据框的某一列，我们可以使用 PySpark
    的 `drop` 功能。


    ```

    [In]: df_na.replace("Chrome","Google Chrome").show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figh_HTML.jpg](img/478390_1_En_2_Figh_HTML.jpg)


    ```

    [In]: df_na.drop(''user_id'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figi_HTML.jpg](img/478390_1_En_2_Figi_HTML.jpg)


    现在我们已经了解了如何通过传入值创建数据框以及如何处理缺失值，我们可以通过读取文件（`.csv`、`parquet` 等）来创建一个 Spark 数据框。该数据集总共包含七列和
    2000 行。`summary` 函数允许我们查看数据集的统计度量，例如数据框中数值数据的最小值、最大值和平均值。


    ```

    [In]: df=spark.read.csv("customer_data.csv",header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 2000

    [In]: len(df.columns)

    [Out]: 7

    [In]: df.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figj_HTML.jpg](img/478390_1_En_2_Figj_HTML.jpg)


    ```

    [In]: df.show(3)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figk_HTML.jpg](img/478390_1_En_2_Figk_HTML.jpg)


    ```

    [In]: df.summary().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figl_HTML.jpg](img/478390_1_En_2_Figl_HTML.jpg)


    大多数情况下，我们不会使用数据框中存在的所有列，因为有些列可能是冗余的，并且在提供有用信息方面价值很小。因此，对数据框进行子集划分对于获得适合分析的正确数据变得至关重要。我将在下一节中介绍这一点。


    ## 数据框的子集


    可以根据多个条件创建数据框的子集，在这些条件中，我们选择几行、几列或应用了某些过滤器的数据。在以下示例中，您将看到如何根据特定条件创建原始数据框的子集，以演示过滤记录的过程。


    *   Select

    *   Filter

    *   Where


    ### Select


    在此示例中，我们选取数据框的一列 `''Avg_Salary''`，并使用 `select` 创建原始数据框的一个子集。我们可以传入子集中必须存在的任意数量的列。然后，我们对数据框应用过滤器，根据某个阈值（`Avg_Salary
    > 1000000`）提取记录。过滤后，我们可以获取子集中存在的记录总数，或者将其用于进一步处理。


    ```

    [In]: df.select([''Customer_subtype'',''Avg_Salary'']).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figm_HTML.jpg](img/478390_1_En_2_Figm_HTML.jpg)


    ```

    [In]: df.filter(df[''Avg_Salary''] > 1000000).count()

    [In]: 128

    [In]: df.filter(df[''Avg_Salary''] > 1000000).show()

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fign_HTML.jpg](img/478390_1_En_2_Fign_HTML.jpg)


    ### Filter


    我们还可以通过包含更多条件，对数据框应用多个过滤器，如下所示。这可以通过两种方式完成：首先，应用连续的过滤器；然后，在 `where` 语句中使用（`&`、`or`）操作符。


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figo_HTML.jpg](img/478390_1_En_2_Figo_HTML.jpg)


    ```

    [In]: df.filter(df[''Avg_Salary''] > 500000).filter(df[''Number_of_houses''] >
    2).show()

    [Out]:

    ```


    ### Where


    ```

    [In]: df.where((df[''Avg_Salary''] > 500000) & (df[''Number_of_houses''] > 2)).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figp_HTML.jpg](img/478390_1_En_2_Figp_HTML.jpg)


    现在我们已经了解了如何从数据框创建子集，接下来可以继续学习 PySpark 中的聚合操作。

    '
- fmt: '# Aggregations


    Any kind of aggregation can be broken simply into three stages, in the following
    order:


    - Split

    - Apply

    - Combine


    The first step is to split the data, based on a column or group of columns, followed
    by performing the operation on those small individual groups (`count`, `max`,
    `avg`, etc.). Once the results are in for each set of groups, the last step is
    to combine all these results.


    In the following example, we aggregate the data, based on `''Customer subtype''`,
    and simply count the number of records in each category. We use the `groupBy`
    function in PySpark. The output of this is not in any particular order, as we
    have not applied any sorting to the results. Therefore, we will also see how we
    can apply any type of sorting to the final results. Because we have seven columns
    in the dataframe—all are categorical columns except for one (`Avg_Salary`), we
    can iterate over each column and apply aggregation as in the following example:


    ```

    [In]: df.groupBy(''Customer_subtype'').count().show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figq_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figq_HTML.jpg)


    ```

    [In]:

    for col in df.columns:

    if col !=''Avg_Salary'':

    print(f" Aggregation for  {col}")

    df.groupBy(col).count().orderBy(''count'',ascending=False).show(truncate=False)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figr_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figr_HTML.jpg)


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figs_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figs_HTML.jpg)


    As mentioned, we can have different kinds of operations on groups of records,
    such as:


    - Mean

    - Max

    - Min

    - Sum


    The following examples cover some of these, based on different groupings. `F`
    refers to the Spark `sql` function here.


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.mean(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figt_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figt_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.max(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figu_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figu_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.min(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figv_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figv_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_main_type'').agg(F.sum(''Avg_Salary'')).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figw_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figw_HTML.jpg)


    Sometimes, there is simply a need to sort the data with aggregation or without
    any sort of aggregation. That’s where we can make use of the `sort` and `orderBy`
    functionality of PySpark, to rearrange data in a particular order, as shown in
    the following examples:


    ```

    [In]: df.sort("Avg_Salary", ascending=False).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figx_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figx_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_subtype'').agg(F.avg(''Avg_Salary'').alias(''mean_salary'')).orderBy(''mean_salary'',ascending=False).show(50,False)

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figy_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figy_HTML.jpg)


    ```

    [In]: df.groupBy(''Customer_subtype'').agg(F.max(''Avg_Salary'').alias(''max_salary'')).orderBy(''max_salary'',ascending=False).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figz_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figz_HTML.jpg)


    In some cases, we must also collect the list of values for particular groups or
    for individual categories. For example, let’s say a customer goes to an online
    store and accesses different pages on the store’s web site. If we have to collect
    all the customer’s activities in a list, we can use the `collect` functionality
    in PySpark. We can collect values in two different ways:


    - Collect List

    - Collect Set


    ### Collect


    `Collect list` provides all the values in the original order of occurrence (they
    can be reversed as well), and `collect set` provides only the unique values, as
    shown in the following example. We consider grouping on `Customer subtype` and
    collecting the `Numberof houses` values in a new column, using `list` and `set`
    separately.


    ```

    [In]: df.groupby("Customer_subtype").agg(F.collect_set("Number_of_houses")).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figaa_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figaa_HTML.jpg)


    ```

    [In]:

    df.groupby("Customer_subtype").agg(F.collect_list("Number_of_houses")).show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figab_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figab_HTML.jpg)


    The need to create a new column with a constant value can be very common. Therefore,
    we can do that in PySpark, using the `lit` function. In the following example,
    we create a new column with a constant value:


    ```

    [In]: df=df.withColumn(''constant'',F.lit(''finance''))

    [In]: df.select(''Customer_subtype'',''constant'').show()

    [Out]:

    ```


    ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figac_HTML.jpg](images/478390_1_En_2_Chapter/478390_1_En_2_Figac_HTML.jpg)


    Because we are dealing with dataframes, it is a common requirement to apply certain
    custom functions on specific columns and get the output. Hence, we make use of
    UDFs, in order to apply Python functions on one or more columns.


    ## User-Defined Functions (UDFs)


    In this example, we are trying to name the age categories and create a standard
    Python function (`age_category`) for the same. In order to apply this on the Spark
    dataframe, we create a UDF object, using this Python function. The only requirement
    is to mention the return type of the function. In this case, it is simply a string
    value.


    ```

    [In]: from pyspark.sql.functions import udf

    [In]: df.groupby("Avg_age").count().show()

    [Out]:

