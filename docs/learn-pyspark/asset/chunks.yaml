    *I dedicate this book to my wife, Neha, my son, Ziaan, and my parents. Without
    you, this book wouldn’t have been possible. You complete my world and are the
    source of my strength.*


    ## Introduction


    The idea of writing this book had already been seeded while I was working on my
    first book, and there was a strong reason for that. The earlier book was more
    focused on machine learning using big data and essentially did not deep-dive sufficiently
    into supporting aspects, but this book goes a little deeper into the internals
    of Spark’s machine learning library, as well as analyzing of streaming data. It
    is a good reference point for someone who wants to learn more about how to automate
    different workflows and build pipelines to handle real-time data.


    This book is divided into three main sections. The first provides an introduction
    to Spark and data analysis on big data; the middle section discusses using Airflow
    for executing different jobs, in addition to data analysis on streaming data,
    using the structured streaming features of Spark. The final section covers translation
    of a business problem into machine learning and solving it, using Spark’s machine
    learning library, with a deep dive into deep learning as well.


    This book might also be useful to data analysts and data engineers, as it covers
    the steps of big data processing using PySpark. Readers who want to make a transition
    to the data science and machine learning fields will also find this book a good
    starting point and can gradually tackle more complicated areas later. The case
    studies and examples given in the book make it really easy to follow and understand
    the related fundamental concepts. Moreover, there are very few books available
    on PySpark, and this book certainly adds value to readers’ knowledge. The strength
    of this book lies in its simplicity and on its application of machine learning
    to meaningful datasets.


    I have tried my best to put all my experience and knowledge into this book, and
    I feel it is particularly relevant to what businesses are seeking in order to
    solve real challenges. I hope that it will provide you with some useful takeaways.


    ## Acknowledgments


    This is my second book on Spark, and along the way, I have come to realize my
    love for handling big data and performing machine learning as well. Going forward,
    I intend to write many more books, but first, let me thank a few people who have
    helped me along this journey. First, I must thank the most important person in
    my life, my beloved wife, Neha, who selflessly supported me throughout and sacrificed
    so much to ensure that I completed this book.


    I must thank Celestin Suresh John, who believed in me and extended the opportunity
    to write this book. Aditee Mirashi is one of the best editors in India. This is
    my second book with her, and it was even more exciting to work with her this time.
    As usual, she was extremely supportive and always there to accommodate my requests.
    I especially would like to thank Jim Markham, who dedicated his time to reading
    every single chapter and offered so many useful suggestions. Thanks, Jim, I really
    appreciate your input. I also want to thank Manoj Patil, who had the patience
    to review every line of code and check the appropriateness of each example. Thank
    you for your feedback and encouragement. It really made a difference to me and
    the book.


    I also want to thank the many mentors who have constantly forced me to pursue
    my dreams. Thank you Sebastian Keupers, Dr. Vijay Agneeswaran, Sreenivas Venkatraman,
    Shoaib Ahmed, and Abhishek Kumar, for your time. Finally, I am infinitely grateful
    to my son, Ziaan, and my parents, for their endless love and support, irrespective
    of circumstances. You all make my world beautiful.


    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Introduction to Spark


    As this book is about Spark, it makes perfect sense to start the first chapter
    by looking into some of Spark’s history and its different components. This introductory
    chapter is divided into three sections. In the first, I go over the evolution
    of data and how it got as far as it has, in terms of size. I’ll touch on three
    key aspects of data. In the second section, I delve into the internals of Spark
    and go over the details of its different components, including its architecture
    and modus operandi. The third and final section of this chapter focuses on how
    to use Spark in a cloud environment.


    ## History


    The birth of the Spark project occurred at the Algorithms, Machine, and People
    (AMP) Lab at the University of California, Berkeley. The project was initiated
    to address the potential issues in the Hadoop MapReduce framework. Although Hadoop
    MapReduce was a groundbreaking framework to handle big data processing, in reality,
    it still had a lot of limitations in terms of speed. Spark was new and capable
    of doing in-memory computations, which made it almost 100 times faster than any
    other big data processing framework. Since then, there has been a continuous increase
    in adoption of Spark across the globe for big data applications. But before jumping
    into the specifics of Spark, let’s consider a few aspects of data itself.


    Data can be viewed from three different angles: the way it is collected, stored,
    and processed, as shown in Figure [1-1](#478390_1_En_1_Chapter.xhtml#Fig1).


    ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig1_HTML.png](images/478390_1_En_1_Chapter/478390_1_En_1_Fig1_HTML.png)


    Figure 1-1


    Three aspects of data


    ### Data Collection


    A huge shift in the manner in which data is collected has occurred over the last
    few years. From buying an apple at a grocery store to deleting an app on your
    mobile phone, every data point is now captured in the back end and collected through
    various built-in applications. Different Internet of things (IoT) devices capture
    a wide range of visual and sensory signals every millisecond. It has become relatively
    convenient for businesses to collect that data from various sources and use it
    later for improved decision making.'
