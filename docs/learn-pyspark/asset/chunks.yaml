    ## 结论


    本章详细介绍了不同类型的监督学习，以及使用多种机器学习算法解决二分类问题的方法。此外，还解释了如何为模型选择最佳超参数，以及如何利用交叉验证技术在给定数据集上构建尽可能最优的模型。


    # 7. 无监督机器学习


    顾名思义，无监督机器学习并不涉及寻找输入与输出之间的关系。坦白说，在无监督学习中，我们并没有需要预测的输出。它主要用于将那些在某种意义下彼此相似的特征归组在一起。这些相似性可以是特征之间的距离，也可以是某种相似性度量。在本章中，我将介绍一些无监督机器学习技术，并使用
    PySpark 构建一个机器学习模型，将用户划分为不同的群体，随后还将对这些群体进行可视化。


    ## 无监督机器学习入门


    如前所述，无监督学习的目标并非映射输入与输出之间的关系，而是尝试将彼此相似的值归组。它并不对输入数据进行训练，而是通过寻找数据中的潜在信号和模式来形成内部的分组。无监督学习可以进一步分为两个不同的类别：


    1. 聚类

    2. 关联规则


    聚类是指根据数据中存在的属性，寻找数据点的潜在分组，如图 7-1 所示。


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig1_HTML.jpg](img/478390_1_En_7_Fig1_HTML.jpg)


    *图 7-1 无监督机器学习*


    关联则指代共现的概率。例如，如果有人购买了商品 X，那么他/她同时购买商品 Y 的概率是多少？在本章中，我将只关注聚类技术。我们可以轻松地利用聚类来理解数据中的不同群体。例如，如果我们有一些关于足球运动员的数据，我们可以轻松预测他们在场上的位置——他们是前锋还是后卫。表
    7-1 展示了一场足球锦标赛中部分球员的样本数据。捕获的两个值是：


    1. 总射门次数

    2. 总抢断次数


    *表 7-1 射门次数 vs. 进球数*


    | 序号 | 射门次数 | 抢断次数 |

    | --- | --- | --- |

    | 1 | 8 | 2 |

    | 2 | 2 | 10 |

    | 3 | 9 | 1 |

    | 4 | 15 | 1 |

    | 5 | 2 | 17 |

    | 6 | 4 | 6 |

    | 7 | 8 | 2 |

    | 8 | 0 | 25 |

    | 9 | 1 | 17 |

    | 10 | 0 | 15 |


    如果我们尝试将上述数值绘制在散点图上，会得到类似于图 7-2 所示的结果。x 轴表示球员的抢断次数，y 轴表示射门次数。


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig2_HTML.jpg](img/478390_1_En_7_Fig2_HTML.jpg)


    *图 7-2 射门次数 vs. 进球数的散点图*


    到目前为止，我们并不知道哪些球员是前锋、中场或后卫，但如果我们在这些数据上使用某种聚类技术，就会得到如图 7-3 所示的分组。该图清晰地显示这些数据中存在三个分组。图表的左上角聚集了所有前锋，而右下角的聚类则代表了抢断次数最多、射门次数最少的后卫。在这两组之间还有一名球员，他可能属于中场类别，拥有合理的抢断次数和射门次数。


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig3_HTML.jpg](img/478390_1_En_7_Fig3_HTML.jpg)


    *图 7-3 数据中的分组*


    在这个例子中，我们看到了如何在不进行任何监督训练的情况下，仍然能够预测数据中存在的分组。


    聚类有多种应用，包括以下几种：


    1. 异常检测

    2. 预测性维护

    3. 客户细分


    根据可用的数据和特定需求，可以使用多种聚类算法。在本章中，我将重点介绍 k-means 算法，用于为在线收听不同音乐流派的用户群体创建聚类。K-means
    是进行这种分组练习的最强大算法之一。*K* 代表需要从数据中形成的聚类或组的数量。K-means 的工作原理是计算每个数据点与其他数据点的距离，并尝试将最近的点归组，直到达到所需的
    K 值数量。我们将尝试使用 k-means 算法将用户划分为有意义的群体，以便能够根据他们对特定音乐流派的品味进行推荐。


    ## 查看数据集


    我们将用于此示例的数据集是一个采样数据集，仅包含两列：用户 ID 和音乐类别。该数据集中有近五十万条记录。

