    ### 使用 K-Means 构建聚类


    在执行聚类分析之前，需要提出的一个关键问题是：“数据应该形成多少个聚类？”解决这个问题的一种方法是使用肘部法则，通过绘制聚类内总平方误差与聚类数量的关系图。这能让我们了解从给定数据中可以形成多少个合适的组。基本上，我们对一组预先确定数量的聚类（2-10）应用
    k-means 算法，并可视化其对应的误差。图表中形成肘部形状的位置，就是选择 `k` 值的最佳数量。


    ```

    [In]: errors=[]

    for k in range(2,10):

    kmeans = KMeans(featuresCol=''scaledFeatures'',k=k)

    model = kmeans.fit(cluster_final_data)

    wssse = model.computeCost(cluster_final_data)

    errors.append(wssse)

    print("With K={}".format(k))

    print("Within Set Sum of Squared Errors = " + str(wssse))

    print(''--''*30)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figk_HTML.jpg](img/478390_1_En_7_Figk_HTML.jpg)


    ```

    [In]: cluster_number = range(2,10)

    [In]: plt.scatter(cluster_number,errors)

    [In]: plt.xlabel(''clusters'')

    [In]: plt.ylabel(''WSSE'')

    [In]: plt.show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig4_HTML.jpg](img/478390_1_En_7_Fig4_HTML.jpg)


    **图 7-4** 肘部图


    在我们的案例中，图表中形成了多个肘部。因此，我们可以选择 `4`、`6` 或 `8` 作为 `k` 的值。需要记住的一点是，聚类没有唯一正确的答案。基于所使用的技术，同一数据可以产生不同的聚类，因为每种技术的初始化点都不同。我们继续选择
    `k` 的值为 `6`。


    ```

    [In]: kmeans6 = KMeans(featuresCol=''scaledFeatures'',k=6)

    [In]: model_k6 = kmeans6.fit(cluster_final_data)

    [In]: model_k6.transform(cluster_final_data).groupBy(''prediction'').count().show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figl_HTML.jpg](img/478390_1_En_7_Figl_HTML.jpg)


    从我们的数据中，我们看到有一个聚类包含了大多数用户。除此之外，还有五个数值较小的聚类。现在，我们将这个预测结果添加到现有的数据框中，以便能够可视化这些聚类。


    ```

    [In]: model_k6.transform(cluster_final_data).show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figm_HTML.jpg](img/478390_1_En_7_Figm_HTML.jpg)


    ```

    [In]: cluser_prediction=model_k6.transform(cluster_final_data)

    [In]: cluser_prediction.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fign_HTML.jpg](img/478390_1_En_7_Fign_HTML.jpg)


    由于我们处理的是多维数据，用聚类编号来可视化数据会变得困难。因此，我们使用 PCA（主成分分析）技术来减少总维度数。在前面的章节中，你已经了解了如何使用 PCA。现在，我们使用
    PCA 将原始特征的数量从 21 个减少到仅 3 个，如下所示。


    ```

    [In]: from pyspark.ml.feature import PCA

    [In]: from pyspark.ml.linalg import Vectors

    [In]: pca = PCA(k=3, inputCol="scaledFeatures", outputCol="pca_features")

    [In]: pca_model = pca.fit(cluser_prediction)

    [In]: result = pca_model.transform(cluser_prediction).select(''user_id_music category'',"pca_features",''prediction'')

    [In]: result.show(truncate=False)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figo_HTML.jpg](img/478390_1_En_7_Figo_HTML.jpg)


    最后，我们将 PCA 数据框转换为 Pandas 数据框，并通过从列表中创建单独的列，从 PCA 特征列中分离出独立的列（`x`、`y`、`z`）。


    ```

    [In]: clusters = result.toPandas().set_index(''user_id_music category'')

    [In]: clusters.head(10)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figp_HTML.jpg](img/478390_1_En_7_Figp_HTML.jpg)


    ```

    [In]: clusters[[''x'',''y'',''z'']]=pd.DataFrame(clusters.pca_features.values.tolist(),
    index= clusters.index)

    [In]: del clusters[''pca_features'']

    [In]: clusters.head(10)

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figq_HTML.jpg](img/478390_1_En_7_Figq_HTML.jpg)


    现在我们有了代表原始特征的三维（3D）数据，以及 k-means 的聚类预测结果，我们可以使用 3D 绘图技术，在三维图上可视化这些聚类。


    ```

    [In]: from mpl_toolkits.mplot3d import Axes3D

    [In]: cluster_vis= plt.figure(figsize=(10,10)).gca(projection=''3d'')

    [In]: cluster_vis.scatter(clusters.x, clusters.y, clusters.z, c=clusters.prediction)

    [In]: cluster_vis.set_xlabel(''x'')

    [In]: cluster_vis.set_ylabel(''y'')

    [In]: cluster_vis.set_zlabel(''z'')

    [In]: plt.show()

    [Out]:

    ```


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig5_HTML.jpg](img/478390_1_En_7_Fig5_HTML.jpg)


    **图 7-5** 聚类可视化


    完成此次聚类分析后的后续工作之一，可以是根据属性值为不同的组分配不同的用户画像。这可能是一项手动工作，并且需要一些时间来构思有意义的用户画像。一旦创建完成，企业可以通过多种方式利用这些画像来营销和定位特定用户。


    ## 结论


    在本章中，你学习了监督式和无监督式机器学习技术之间的区别。你还了解了如何使用 k-means 聚类从原始数据构建聚类。随后，我们解释了寻找 `k` 最优值的方法，以及如何可视化由
    k-means 算法形成的最终聚类。


    # 8. 使用 PySpark 进行深度学习


    深度学习近年来一直备受瞩目，并在解决各种业务挑战方面取得了长足进步。从图像语言翻译到自动驾驶汽车，深度学习已成为更大格局中的重要组成部分。不可否认，如今许多公司都在深度学习上大力投入，因为它们的大部分应用程序都在后台使用深度学习运行。例如，谷歌的
    Gmail、YouTube、搜索、地图和助手都在以某种形式使用深度学习。原因在于，与其他一些机器学习算法相比，深度学习具有提供更出色结果的惊人能力。


    本章分为三个部分。第一部分侧重于理解深度学习的基础知识和底层运行原理。第二部分涵盖深度学习模型的训练过程。最后，在第三部分也是最后一部分中，你将看到如何使用
    Spark 构建多层感知器。

    '
- fmt: '# Deep Learning Fundamentals


    Before even getting into deep learning, we must understand what neural networks
    are, as deep learning is a sort of extension of neural networks. Neural networks
    are not new; in fact, they go way back to the 1950s, when researchers began working
    on them. Unfortunately, they hit a major roadblock, owing to limited computation
    capabilities at the time. In the recent past, neural networks have gained in popularity,
    due to major advancements in processing power and access to big data. The availability
    of super-powerful processing devices, such as GPUs and TPUs, has made it possible
    to run huge neural networks with better performance. From the data aspect, the
    availability of labeled data over the last few years has also helped immensely.
    More than any of the preceding reasons, it’s the unique ability of deep learning
    models to offer significant performance over other machine learning algorithms
    that has made deep learning the preferred, mainstream approach. Figure [8-1](#478390_1_En_8_Chapter.xhtml#Fig1)
    shows the evolutionary time line of artificial intelligence, machine learning,
    and deep learning.


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig1_HTML.png](images/478390_1_En_8_Chapter/478390_1_En_8_Fig1_HTML.png)


    Figure 8-1


    Deep learning time line


    In supervised learning settings, there is specific input and corresponding output.
    The objective of machine learning algorithms is to use this data and approximate
    the relationship between input and output variables. In some cases, this relationship
    can be quite evident and easy to capture, but in realistic scenarios, the relationship
    between input and output variables is very complex and nonlinear in nature. To
    give an example, a self-driving car, the input variables can be as follows:


    - Terrain

    - Distance from nearest object

    - Traffic lights

    - Signboards


    The output must be either turn or drive fast or slowly or apply brakes, etc. As
    you might imagine, the relationship between input variables and output variables
    is fairly complex in nature. Therefore, the traditional machine learning algorithm
    finds it hard to map this kind of relationship. However, deep learning outperforms
    other machine learning algorithms in such situations, as it is able to learn nonlinear
    features as well.


    ## Human Brain Neuron vs. Artificial Neuron


    As mentioned, deep learning is an extension of neural networks only and is also
    known as deep neural networks. Neural networks are a little different than other
    machine learning algorithms. Neural networks are loosely inspired by neurons in
    the human brain. Neural networks are made up of artificial neurons. Although I
    don’t claim to be an expert on neuroscience or functioning of the brain, let me
    try to give you a high-level overview of how the human brain functions. You might
    already be aware of the fact that the human brain is made up of billions of neurons,
    with an incredible number of connections between them. Each neuron is connected
    by multiple other neurons in some way and repeatedly exchanges information (signals).
    Each activity that we undertake physically or mentally fires up a certain set
    of neurons in our brain. Every neuron is made up of three basic components:


    - Dendrites

    - Cell Body

    - Terminals


    As you can see in Figure [8-2](#478390_1_En_8_Chapter.xhtml#Fig2), in a human
    brain neuron, the dendrites are responsible for receiving signals from other neurons.
    They act as receivers of the particular neuron and pass information to a cell
    body, where the specific information is processed. Now, based on the level of
    information, it either activates (fires up) or doesn’t trigger. This activity
    depends on a particular threshold value of the neuron. If the incoming signal
    value is below that threshold, it will not fire; otherwise, it activates. Finally,
    the third component is terminals, which are connected to the dendrites of other
    neurons. Terminals are responsible for passing on the output of a particular neuron
    to other relevant connectors.


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig2_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Neuron of the human brain


    Artificial neurons, on the other hand, consist mainly of two parts: one is summation,
    and the other is activation, as shown in Figure [8-3](#478390_1_En_8_Chapter.xhtml#Fig3).
    This is also known as a perceptron. Summation refers to adding all the input signals,
    and activation refers to whether the neuron will trigger, based on the threshold
    value.


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig3_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Parts of an artificial neuron


    Let’s say we have two binary inputs (`X1`, `X2`) and weights of their respective
    connections (`W1`, `W2`), as shown in Figure [8-4](#478390_1_En_8_Chapter.xhtml#Fig4).
    The weights can be considered similar to coefficients of input variables in traditional
    machine learning. These weights indicate how important the particular input feature
    in the model is. The summation function calculates the total sum of the input.


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig4_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Inputs and weights in an artificial neuron


    The activation function then uses this total summated value and gives a certain
    output. Activation is sort of a decision-making function. Based on the type of
    activation function used, it gives an output accordingly. There are different
    types of activation functions that can be used in a neural network layer.


    ## Activation Functions


    Activation functions play a critical role in neural networks, as the output varies,
    based on the type of activation function used. There are typically three main
    activation functions that are widely used: sigmoid, hyperbolic tangent, and rectified
    linear unit.


    ### Sigmoid


    This activation function ensures that the output is always between 0 and 1, irrespective
    of the input, as shown in Figure [8-5](#478390_1_En_8_Chapter.xhtml#Fig5). That’s
    why it is also used in logistic regression, to predict the probability of an event.


    ```

    f(x) = 1 / (1 + e^(-x))

    ```


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig5_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Sigmoid activation function


    ### Hyperbolic Tangent


    Hyperbolic tangent activation (`tanh`) ensures that the output value remains between
    -1 to 1, regardless of the input, as shown in Figure [8-6](#478390_1_En_8_Chapter.xhtml#Fig6).
    Following is the `tanh` formula:


    ```

    f(x) = (e^(2x) - 1) / (e^(2x) + 1)

    ```


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig6_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Tanh activation function


    ### Rectified Linear Unit


    Rectified linear units (ReLUs) have been increasingly popular over the last few
    years and have become the default activation function. A ReLU is very powerful,
    as it produces values between 0 and ∞. If the input is 0 or less than 0, the output
    is always going to be 0, but for anything more than 0, the output is similar to
    the input, as shown in Figure [8-7](#478390_1_En_8_Chapter.xhtml#Fig7). The formula
    for a ReLU is


    ```

    f(x) = max(0, x)

    ```


    ![../images/478390_1_En_8_Chapter/478390_1_En_8_Fig7_HTML.jpg](images/478390_1_En_8_Chapter/478390_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Rectified linear unit'
