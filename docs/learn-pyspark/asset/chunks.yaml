    In this example, we try to find the average age of users for every app in our
    data. We simply group the data by app, take the average age of all the users,
    and sort the results in decreasing order.


    ```

    [In]:age_df=data.groupBy(''app'').agg(F.avg(''age'').alias(''mean_age'')).orderBy(''mean_age'',ascending=False)

