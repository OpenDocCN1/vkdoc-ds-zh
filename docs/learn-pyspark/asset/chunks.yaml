    ### Random Forest Classifier


    Once again, a random forest classifier is a collection of multiple decision tree
    classifiers. It works on the voting mechanism and predicts the output class that
    received the maximum votes from all individual decision trees. Let’s build a random
    forest classifier with the same data.


    #### Step 1: Build and Train the Random Forest Model


    ```

    [In]: from pyspark.ml.classification import RandomForestClassifier

    [In]: rf = RandomForestClassifier(numTrees=50, maxDepth=30)

    [In]: rf_model = rf.fit(train)

