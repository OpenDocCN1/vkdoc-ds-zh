    techniques to build the best possible model on the given dataset were also explained.


    # 7. Unsupervised Machine Learning


    As the name suggests, unsupervised machine learning does not include finding relationships
    between input and output. To be honest, there is no output that we try to predict
    in unsupervised learning. It is mainly used to group together the features that
    seem to be similar to one another in some sense. These can be the distance between
    those features or some sort of similarity metric. In this chapter, I will touch
    on some unsupervised machine learning techniques and build one of the machine
    learning models, using PySpark to categorize users into groups and, later, to
    visualize those groups as well.


    ## Unsupervised Machine Learning Primer


    As suggested, unsupervised learning does not aim to map the relationship between
    input and output; rather, it tries to group values that are similar to one another.
    There is no training that takes place on the input data. Rather, it does this
    by finding the underlying signals and patterns in the data, to form groups within.
    Unsupervised learning can be categorized further into two separate categories:


    1. Clustering

    2. Association rules


    Clustering refers to finding underlying groups of data points, based on the attributes
    present in the data, as shown in Figure 7-1.


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig1_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fig1_HTML.jpg)


    *Figure 7-1 Unsupervised machine learning*


    Association signifies the probability of co-occurrence. For example, if someone
    bought item X, what’s the probability that he or she might also buy item Y with
    it. In this chapter, I will focus only on clustering techniques. We can easily
    make use of clustering to understand the different groups in the data. For example,
    if we have some data about soccer players, we can easily predict who plays what
    position on the field—either they are forward players or defenders. Table 7-1
    shows some sample data for players in a soccer tournament. The two values captured
    are:


    1. Total number of goal attempts

    2. Total number of tackles made


    *Table 7-1 Attempts vs. Goals*


    | Sr. No | No. of Goal Attempts | No. of Tackles |

    | --- | --- | --- |

    | 1 | 8 | 2 |

    | 2 | 2 | 10 |

    | 3 | 9 | 1 |

    | 4 | 15 | 1 |

    | 5 | 2 | 17 |

    | 6 | 4 | 6 |

    | 7 | 8 | 2 |

    | 8 | 0 | 25 |

    | 9 | 1 | 17 |

    | 10 | 0 | 15 |


    If we try to visualize the preceding values on a scatter plot, we get something
    similar to what is shown in Figure 7-2. The x axis indicates the number of tackles
    made by the players, and the y axis shows the number of attempts to score a goal.


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig2_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fig2_HTML.jpg)


    *Figure 7-2 Scatter plot of attempts vs. goals scored*


    Up to this point, we don’t know which players are strikers, midfielders, or defenders,
    but if we use some sort of clustering technique on this data, we get the groups,
    as shown in Figure 7-3. The figure clearly shows that there are three groups in
    this data. The top-left corner of the chart groups all the strikers, and the bottom-right
    cluster represents the defenders with the highest number of tackles and fewest
    attempts to score. There is also a player between these two groups who probably
    belongs to the midfield category, having a reasonable number of tackles and attempts
    to score a goal.


    ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig3_HTML.jpg](images/478390_1_En_7_Chapter/478390_1_En_7_Fig3_HTML.jpg)


    *Figure 7-3 Groups within the data*


    In this example, we see how we can still predict the groups present in the data
    without any supervised training at all.


    Clustering can have multiple applications, including the following:


    1. Anomaly detection

    2. Predictive maintenance

    3. Customer segmentation


    There are a number of clustering algorithms that can be used, depending on the
    available data and specific requirement. In this chapter, I am going to focus
    on k-means algorithms, to create clusters for sets of users who listen to different
    genres of music online. K-means is one of the strongest algorithms for this grouping
    exercise. *K* stands for the number of clusters or groups that must be formed
    from the data. K-means works by calculating the distance of each data point from
