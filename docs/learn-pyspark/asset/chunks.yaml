    ## 结论


    在本章中，你学习了如何定义 DAG 并使用 Airflow 运行不同的作业。还涵盖了实施 Airflow 和监控不同任务状态的步骤。除了界面中的不同组件外，你还了解了
    Airflow 的 Web UI。


    # MLlib：机器学习库


    根据你的需求，有多种方法可以使用预先存在的库（例如 Python 的 `scikit-learn`、`R` 和 `TensorFlow`）来构建机器学习模型。然而，Spark
    的机器学习库（`MLlib`）真正有用的地方在于它能够大规模训练模型并提供分布式训练。这使得用户能够在庞大的数据集上快速构建模型，此外还能使用 Spark
    框架本身进行预处理和准备工作流。


    本章重点介绍如何利用 `MLlib` 来构建和应用各种机器学习模型。第一部分重点介绍使用 `MLlib` 进行基本统计，接着是构建管道以创建特征和其他转换。本章的最后部分讨论使用
    `MLlib` 构建机器学习分类模型。


    让我们首先回顾如何使用 Spark 的 `MLlib` 来计算一些用于数据分析的基本统计度量。你将看到如何计算两个数值变量之间的相关性，以及如何使用卡方检验来确定两个分类变量之间是否存在显著关系。

