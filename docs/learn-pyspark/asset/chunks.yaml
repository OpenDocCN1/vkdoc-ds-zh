- fmt: '### Support Vector Machines Classifiers


    Support vector machines (SVMs) are used for classification tasks, as they find
    the hyperplane that maximizes the margin (perpendicular distance) between two
    classes. All the instances and target classes are represented as vectors in high-dimensional
    space, and the SVM finds the closest two points from the two classes that support
    the best separating line or hyperplane, as shown in Figure [6-5](#478390_1_En_6_Chapter.xhtml#Fig5).


    ![../images/478390_1_En_6_Chapter/478390_1_En_6_Fig5_HTML.jpg](images/478390_1_En_6_Chapter/478390_1_En_6_Fig5_HTML.jpg)


