- fmt: '# Calculating Correlations


    Correlation is an important metric with which to determine if there is any relationship
    between two continuous variables. Correlation can either be positive or negative,
    as shown in Figure [5-1](#478390_1_En_5_Chapter.xhtml#Fig1). It is also possible
    for there to be no correlation between two variables.


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fig1_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Types of correlations


    Correlation is very easy to calculate using Spark MLlib. It provides the options
    to calculate two types of coefficients of correlations:


    1. Pearson

    2. Spearman


    Using Spark, let’s take a sample dataframe, to calculate the coefficient of correlation.
    This dataset contains just two numerical columns (`Years Experience` and `Salary`).
    The first step is to create the Spark context, in order to use Spark.


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark=SparkSession.builder.appName(''basic_stats'').getOrCreate()

    [In]: df=spark.read.csv(''corr_data.csv'',header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 30

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figa_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figa_HTML.jpg)


    As you can see, there are just 30 records in this dataframe. Next, we combine
    the two columns into a single dense vector representation, in order to calculate
    the correlation coefficient, using `VectorAssembler`. We name the new dense vector
    `"features"`.


    ```

    [In]: from pyspark.ml.feature import VectorAssembler

    [In]: assembler = VectorAssembler(inputCols=df.columns, outputCol="features")

    [In]: df_new=assembler.transform(df)

    [In]: df_new.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figb_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figb_HTML.jpg)


    ```

    Pearson Coefficient of Correlation

    [In]: from pyspark.ml.stat import Correlation

    [In]: pearson_corr = Correlation.corr(df_new,''features'')

    [in]: pearson_corr.show(2,False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figc_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figc_HTML.jpg)


    ```

    Spearman Coefficient of Correlation

    [In]: spearman_corr=Correlation.corr(df_new,''features'',"spearman")

    [In]: spearman_corr.show(2,False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figd_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figd_HTML.jpg)


    ## Chi-Square Test


    Correlation is all about the relationship between numerical features, whereas
    other types of variables can be categorical as well. One of the ways to validate
    the relationship between two categorical variables is through a chi-square test.
    Let’s consider an example, to understand how it works. Some made up data is summarized
    in Table [5-1](#478390_1_En_5_Chapter.xhtml#Tab1).


    Table 5-1


    Sample Data


    | | Smoker | Nonsmoker |

    | --- | --- | --- |

    | Teen | 32 | 12 |

    | Young | 14 | 22 |

    | Old | 6 | 9 |


    It contains three categories of people (`Teen`, `Young`, and `Old`) and is divided
    into two buckets (`Smoker` and `Nonsmoker`). In the next step, we calculate the
    total number of people in each category and bucket, as shown in Table [5-2](#478390_1_En_5_Chapter.xhtml#Tab2).
    This is also known as a contingency table.


    Table 5-2


    Contingency Table


    | | Smoker | Nonsmoker | Total |

    | --- | --- | --- | --- |

    | Teen | 32 | 12 | 44 |

    | Young | 14 | 22 | 36 |

    | Old | 6 | 9 | 15 |

    | | 52 | 43 | 95 |


    The next step is to calculate the expected values, based on the actual values
    in the table. The expected values are calculated with the following formula:


    ![$$ xpected\ {Value}_{Teen- Smoker}=\left({Total}_{Teen}\ast \kern0.5em {Total}_{Smoker}\right)/
    Total $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equa.png)


    ![$$ Expected\ {Value}_{Teen- Smoker}=\left(44\ast \kern0.5em 52\right)/95 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equb.png)


    ![$$ Expected\ {Value}_{Teen- Smoker}=24 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equc.png)


    ![$$ {x}^2 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equd.png)


    Similarly, we calculate all the expected values for each category against both
    buckets, as shown in Table [5-3](#478390_1_En_5_Chapter.xhtml#Tab3).


    Table 5-3


    Expected Values


    | | Smoker | Nonsmoker |

    | --- | --- | --- |

    | Teen | 24 | 20 |

    | Young | 20 | 16 |

    | Old | 8 | 7 |


    The next step is to arrive at a chi-square table, by comparing the actual values
    against expected values. The chi-square table values are calculated with the following
    formula:


    ![$$ Chi\ Square\ Table\ {Value}_{Teen- Smoker}={\left({Actual}_{Teen- Smoker}-\kern0.5em
    {Expected}_{Teen- Smoker}\right)}^2/{Expected}_{Teen- Smoker} $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Eque.png)


    ![$$ Chi\ Square\ Table\ {Value}_{Teen- Smoker}=\frac{{\left(32-24\right)}^2}{24}
    $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equf.png)


    ![$$ Chi\ Square\ Table\ {Value}_{Teen- Smoker}=2.602 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equg.png)


    Now that we have the chi-square values, we take the total for each bucket (`Smoker`
    and `Nonsmoker`), as shown in Table [5-4](#478390_1_En_5_Chapter.xhtml#Tab4).


    Table 5-4


    Chi-Square Totals


    | | Smoker | Nonsmoker |

    | --- | --- | --- |

    | Teen | 2.602 | 3.146 |

    | Young | 1.652 | 1.998 |

    | Old | 0.595 | 0.720 |

    | Chi-square value | 4.849 | 5.864 |


    The overall chi-square value comes to 10.7 (4.84 + 5.86). We then look up for
    the value of 10.7 in the chi-square table for the degree of freedom (3-1)∗(2-1)
    = 2 and find the corresponding p value. If the p value is less than 0.05, this
    indicates a statistically significant relationship between the two variables.
    Let’s try to run a chi-square test using Spark. Here we have a sample dataset
    that has three columns, but we will try to determine if there is any relationship
    between the `marital` and `housing` columns (both are categorical in nature).


    ```

    [In]: df=spark.read.csv(''chi_sq.csv'',inferSchema=True,header=True)

    [In]: df.count()

    [Out]: 9501

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fige_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Fige_HTML.jpg)


    ```

    [In]: from pyspark.ml.feature import StringIndexer

    [In]: marital_indexer = StringIndexer(inputCol="marital", outputCol="marital_num").fit(df)

    [In]: df = marital_indexer.transform(df)

    [In]: from pyspark.ml.feature import OneHotEncoder

    [In]: marital_encoder = OneHotEncoder(inputCol="marital_num", outputCol="marital_vector")

    [In]: df = marital_encoder.transform(df)

    [In]: housing_indexer = StringIndexer(inputCol="housing", outputCol="housing_num").fit(df)

    [In]: df = housing_indexer.transform(df)

    [In]: housing_encoder = OneHotEncoder(inputCol="housing_num", outputCol="housing_vector")

    [In]: df = housing_encoder.transform(df)

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figf_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figf_HTML.jpg)


    ```

    [In]: df_assembler = VectorAssembler(inputCols=[''marital_vector'',''housing_vector''],
    outputCol="features")

    [In]: df = df_assembler.transform(df)

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figg_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figg_HTML.jpg)


    ```

    [In]: chi_sq = ChiSquareTest.test(df, "features", "label").head()

    [In]: print("pValues: " + str(chi_sq.pValues))

    [Out]:

    pValues: [0.0,0.0,0.06036632491,0.0,3.56381590905e-14]

    ```


    ## Transformations


    In this section, I will go over some of the common transformations required for
    data preprocessing and feature engineering. These help in preparing data the right
    way for applying machine learning.'
  raw: '## Calculating Correlations


    Correlation is an important metric with which to determine if there is any relationship
    between two continuous variables. Correlation can either be positive or negative,
    as shown in Figure [5-1](#478390_1_En_5_Chapter.xhtml#Fig1). It is also possible
    for there to be no correlation between two variables.


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fig1_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Types of correlations


    Correlation is very easy to calculate using Spark MLlib. It provides the options
    to calculate two types of coefficients of correlations:


    1.  Pearson


    2.  Spearman


    Using Spark, let’s take a sample dataframe, to calculate the coefficient of correlation.
    This dataset contains just two numerical columns (Years Experience and Salary).
    The first step is to create the Spark context, in order to use Spark.


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark=SparkSession.builder.appName(''basic_stats'').getOrCreate()

    [In]: df=spark.read.csv(''corr_data.csv'',header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 30

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figa_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figa_HTML.jpg)


    As you can see, there are just 30 records in this dataframe. Next, we combine
    the two columns into a single dense vector representation, in order to calculate
    the correlation coefficient, using VectorAssembler. We name the new dense vector
    “features.”


    ```

    [In]: from pyspark.ml.feature import VectorAssembler

    [In]: assembler = VectorAssembler(inputCols=df.columns, outputCol="features")

    [In]: df_new=assembler.transform(df)

    [In]: df_new.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figb_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figb_HTML.jpg)


    ```

    Pearson Coefficient of Correlation

    [In]: from pyspark.ml.stat import Correlation

    [In]: pearson_corr = Correlation.corr(df_new,''features'')

    [in]: pearson_corr.show(2,False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figc_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figc_HTML.jpg)


    ```

    Spearman Coefficient of Correlation

    [In]: spearman_corr=Correlation.corr(df_new,''features'',"spearman")

    [In]: spearman_corr.show(2,False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figd_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figd_HTML.jpg)


    ### Chi-Square Test


    Correlation is all about the relationship between numerical features, whereas
    other types of variables can be categorical as well. One of the ways to validate
    the relationship between two categorical variables is through a chi-square test.
    Let’s consider an example, to understand how it works. Some made up data is summarized
    in Table [5-1](#478390_1_En_5_Chapter.xhtml#Tab1).


    Table 5-1


    Sample Data


    |   | Smoker | Nonsmoker |

    | --- | --- | --- |

    | Teen | 32 | 12 |

    | Young | 14 | 22 |

    | Old | 6 | 9 |


    It contains three categories of people (Teen, Young, and Old) and is divided into
    two buckets (Smoker and Nonsmoker). In the next step, we calculate the total number
    of people in each category and bucket, as shown in Table [5-2](#478390_1_En_5_Chapter.xhtml#Tab2).
    This is also known as a contingency table.


    Table 5-2


    Contingency Table


    |   | Smoker | Nonsmoker | Total |

    | --- | --- | --- | --- |

    | Teen | 32 | 12 | 44 |

    | Young | 14 | 22 | 36 |

    | Old | 6 | 9 | 15 |

    |   | 52 | 43 | 95 |


    The next step is to calculate the expected values, based on the actual values
    in the table. The expected values are calculated with the following formula:


    ![$$ xpected\ {Value}_{Teen- Smoker}=\left({Total}_{Teen}\ast \kern0.5em {Total}_{Smoker}\right)/
    Total $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equa.png)


    ![$$ Expected\ {Value}_{Teen- Smoker}=\left(44\ast \kern0.5em 52\right)/95 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equb.png)


    ![$$ Expected\ {Value}_{Teen- Smoker}=24 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equc.png)


    ![$$ {x}^2 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equd.png)


    Similarly, we calculate all the expected values for each category against both
    buckets, as shown in Table [5-3](#478390_1_En_5_Chapter.xhtml#Tab3).


    Table 5-3


    Expected Values


    |   | Smoker | Nonsmoker |

    | --- | --- | --- |

    | Teen | 24 | 20 |

    | Young | 20 | 16 |

    | Old | 8 | 7 |


    The next step is to arrive at a chi-square table, by comparing the actual values
    against expected values. The chi-square table values are calculated with the following
    formula:


    ![$$ Chi\ Square\ Table\ {Value}_{Teen- Smoker}={\left({Actual}_{Teen- Smoker}-\kern0.5em
    {Expected}_{Teen- Smoker}\right)}^2/{Expected}_{Teen- Smoker} $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Eque.png)


    ![$$ Chi\ Square\ Table\ {Value}_{Teen- Smoker}=\frac{{\left(32-24\right)}^2}{24}
    $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equf.png)


    ![$$ Chi\ Square\ Table\ {Value}_{Teen- Smoker}=2.602 $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equg.png)


    Now that we have the chi-square values, we take the total for each bucket (Smoker
    and Nonsmoker), as shown in Table [5-4](#478390_1_En_5_Chapter.xhtml#Tab4).


    Table 5-4


    Chi-Square Totals


    |   | Smoker | Nonsmoker |

    | --- | --- | --- |

    | Teen | 2.602 | 3.146 |

    | Young | 1.652 | 1.998 |

    | Old | 0.595 | 0.720 |

    | Chi-square value | 4.849 | 5.864 |


    The overall chi-square value comes to 10.7 (4.84 + 5.86). We then look up for
    the value of 10.7 in the chi-square table for the degree of freedom (3-1)∗(2-1)
    = 2 and find the corresponding p value. If the p value is less than 0.05, this
    indicates a statistically significant relationship between the two variables.
    Let’s try to run a chi-square test using Spark. Here we have a sample dataset
    that has three columns, but we will try to determine if there is any relationship
    between the marital and housing columns (both are categorical in nature).


    ```

    [In]: df=spark.read.csv(''chi_sq.csv'',inferSchema=True,header=True)

    [In]: df.count()

    [Out]: 9501

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fige_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Fige_HTML.jpg)


    ```

    [In]: from pyspark.ml.feature import StringIndexer

    [In]: marital_indexer = StringIndexer(inputCol="marital", outputCol="marital_num").fit(df)

    [In]: df = marital_indexer.transform(df)

    [In]: from pyspark.ml.feature import OneHotEncoder

    [In]: marital_encoder = OneHotEncoder(inputCol="marital_num", outputCol="marital_vector")

    [In]: df = marital_encoder.transform(df)

    [In]: housing_indexer = StringIndexer(inputCol="housing", outputCol="housing_num").fit(df)

    [In]: df = housing_indexer.transform(df)

    [In]: housing_encoder = OneHotEncoder(inputCol="housing_num", outputCol="housing_vector")

    [In]: df = housing_encoder.transform(df)

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figf_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figf_HTML.jpg)


    ```

    [In]: df_assembler = VectorAssembler(inputCols=[''marital_vector'',''housing_vector''],
    outputCol="features")

    [In]: df = df_assembler.transform(df)

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figg_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figg_HTML.jpg)


    ```

    [In]: chi_sq = ChiSquareTest.test(df, "features", "label").head()

    [In]: print("pValues: " + str(chi_sq.pValues))

    [Out]:

    pValues: [0.0,0.0,0.06036632491,0.0,3.56381590905e-14]

    ```


    ## Transformations


    In this section, I will go over some of the common transformations required for
    data preprocessing and feature engineering. These help in preparing data the right
    way for applying machine learning.'
  trans: '

    # 计算相关性


    相关性是一个重要指标，用于判断两个连续变量之间是否存在某种关系。相关性可以是正相关或负相关，如图 5-1 所示。两个变量之间也可能不存在相关性。


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fig1_HTML.jpg](img/478390_1_En_5_Fig1_HTML.jpg)


    图 5-1


    相关类型


    使用 Spark MLlib 计算相关性非常简单。它提供了计算两种相关系数的选项：


    1. 皮尔逊相关系数

    2. 斯皮尔曼相关系数


    让我们使用 Spark 创建一个示例数据框来计算相关系数。该数据集仅包含两个数值列（`Years Experience` 和 `Salary`）。第一步是创建
    Spark 上下文，以便使用 Spark。


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark=SparkSession.builder.appName(''basic_stats'').getOrCreate()

    [In]: df=spark.read.csv(''corr_data.csv'',header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 30

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figa_HTML.jpg](img/478390_1_En_5_Figa_HTML.jpg)


    如您所见，该数据框中只有 30 条记录。接下来，我们使用 `VectorAssembler` 将这两列合并成一个密集向量表示，以便计算相关系数。我们将这个新的密集向量命名为
    `"features"`。


    ```

    [In]: from pyspark.ml.feature import VectorAssembler

    [In]: assembler = VectorAssembler(inputCols=df.columns, outputCol="features")

    [In]: df_new=assembler.transform(df)

    [In]: df_new.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figb_HTML.jpg](img/478390_1_En_5_Figb_HTML.jpg)


    ```

    皮尔逊相关系数

    [In]: from pyspark.ml.stat import Correlation

    [In]: pearson_corr = Correlation.corr(df_new,''features'')

    [in]: pearson_corr.show(2,False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figc_HTML.jpg](img/478390_1_En_5_Figc_HTML.jpg)


    ```

    斯皮尔曼相关系数

    [In]: spearman_corr=Correlation.corr(df_new,''features'',"spearman")

    [In]: spearman_corr.show(2,False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figd_HTML.jpg](img/478390_1_En_5_Figd_HTML.jpg)


    ## 卡方检验


    相关性关注的是数值特征之间的关系，而其他类型的变量也可能是分类变量。验证两个分类变量之间关系的方法之一是卡方检验。让我们通过一个例子来理解它的工作原理。表
    5-1 总结了一些虚构数据。


    表 5-1


    样本数据


    | | 吸烟者 | 非吸烟者 |

    | --- | --- | --- |

    | 青少年 | 32 | 12 |

    | 青年 | 14 | 22 |

    | 老年 | 6 | 9 |


    它包含三类人群（`青少年`、`青年` 和 `老年`），并分为两个组别（`吸烟者` 和 `非吸烟者`）。下一步，我们计算每个类别和组别的总人数，如表 5-2
    所示。这也被称为列联表。


    表 5-2


    列联表


    | | 吸烟者 | 非吸烟者 | 总计 |

    | --- | --- | --- | --- |

    | 青少年 | 32 | 12 | 44 |

    | 青年 | 14 | 22 | 36 |

    | 老年 | 6 | 9 | 15 |

    | | 52 | 43 | 95 |


    下一步是根据表中的实际值计算期望值。期望值通过以下公式计算：


    ![$$ 期望值 _{青少年-吸烟者}=（总计 _{青少年} \ast 总计 _{吸烟者}）/ 总计 $$](img/478390_1_En_5_Chapter_TeX_Equa.png)


    ![$$ 期望值 _{青少年-吸烟者}=（44 \ast 52）/ 95 $$](img/478390_1_En_5_Chapter_TeX_Equb.png)


    ![$$ 期望值 _{青少年-吸烟者}=24 $$](img/478390_1_En_5_Chapter_TeX_Equc.png)


    ![$$ {x}² $$](img/478390_1_En_5_Chapter_TeX_Equd.png)


    类似地，我们针对两个组别计算每个类别的所有期望值，如表 5-3 所示。


    表 5-3


    期望值


    | | 吸烟者 | 非吸烟者 |

    | --- | --- | --- |

    | 青少年 | 24 | 20 |

    | 青年 | 20 | 16 |

    | 老年 | 8 | 7 |


    下一步是通过比较实际值与期望值得出卡方表。卡方表的值通过以下公式计算：


    ![$$ 卡方表值 _{青少年-吸烟者}=（实际值 _{青少年-吸烟者} - 期望值 _{青少年-吸烟者}）² / 期望值 _{青少年-吸烟者} $$](img/478390_1_En_5_Chapter_TeX_Eque.png)


    ![$$ 卡方表值 _{青少年-吸烟者}= \frac{（32-24）²}{24} $$](img/478390_1_En_5_Chapter_TeX_Equf.png)


    ![$$ 卡方表值 _{青少年-吸烟者}=2.602 $$](img/478390_1_En_5_Chapter_TeX_Equg.png)


    现在我们有了卡方值，我们计算每个组别（`吸烟者` 和 `非吸烟者`）的总和，如表 5-4 所示。


    表 5-4


    卡方总计


    | | 吸烟者 | 非吸烟者 |

    | --- | --- | --- |

    | 青少年 | 2.602 | 3.146 |

    | 青年 | 1.652 | 1.998 |

    | 老年 | 0.595 | 0.720 |

    | 卡方值 | 4.849 | 5.864 |


    总的卡方值为 10.7（4.84 + 5.86）。然后我们在自由度为 (3-1)∗(2-1) = 2 的卡方分布表中查找 10.7 对应的 p 值。如果 p
    值小于 0.05，则表明这两个变量之间存在统计上显著的关系。让我们尝试使用 Spark 运行卡方检验。这里我们有一个包含三列的样本数据集，但我们将尝试判断
    `marital` 和 `housing` 列之间是否存在任何关系（两者本质上都是分类变量）。


    ```

    [In]: df=spark.read.csv(''chi_sq.csv'',inferSchema=True,header=True)

    [In]: df.count()

    [Out]: 9501

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fige_HTML.jpg](img/478390_1_En_5_Fige_HTML.jpg)


    ```

    [In]: from pyspark.ml.feature import StringIndexer

    [In]: marital_indexer = StringIndexer(inputCol="marital", outputCol="marital_num").fit(df)

    [In]: df = marital_indexer.transform(df)

    [In]: from pyspark.ml.feature import OneHotEncoder

    [In]: marital_encoder = OneHotEncoder(inputCol="marital_num", outputCol="marital_vector")

    [In]: df = marital_encoder.transform(df)

    [In]: housing_indexer = StringIndexer(inputCol="housing", outputCol="housing_num").fit(df)

    [In]: df = housing_indexer.transform(df)

    [In]: housing_encoder = OneHotEncoder(inputCol="housing_num", outputCol="housing_vector")

    [In]: df = housing_encoder.transform(df)

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figf_HTML.jpg](img/478390_1_En_5_Figf_HTML.jpg)


    ```

    [In]: df_assembler = VectorAssembler(inputCols=[''marital_vector'',''housing_vector''],
    outputCol="features")

    [In]: df = df_assembler.transform(df)

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figg_HTML.jpg](img/478390_1_En_5_Figg_HTML.jpg)


    ```

    [In]: chi_sq = ChiSquareTest.test(df, "features", "label").head()

    [In]: print("pValues: " + str(chi_sq.pValues))

    [Out]:

    pValues: [0.0,0.0,0.06036632491,0.0,3.56381590905e-14]

    ```


    ## 数据变换


    在本节中，我将介绍数据预处理和特征工程中一些常见的变换。这些变换有助于以正确的方式准备数据，以便应用机器学习。

    '
- fmt: '### Binarizer


    We can convert the numerical/continuous variable into categorical features (0/1)
    by using `Binarizer` in MLlib. We must declare the threshold value, in order to
    convert the numerical feature into a binary feature. Any value above the threshold
    will be converted into 1, and values below or equal to the threshold will become
    0. Let’s apply `Binarizer` on the label column of the transformation sample dataset.


    ```

    [In]: df=spark.read.csv(''transformations.csv'',header=True,inferSchema=True)

    [In]: df.count()

    [Out]: 6366

    [In]: df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figh_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figh_HTML.jpg)


    Now we import the `Binarizer` function from the Spark library.


    ```

    [In]: from pyspark.ml.feature import Binarizer

    [In]: binarizer = Binarizer(threshold=0.99, inputCol="label", outputCol="binarized_label")

    [In]: new_df=binarizer.transform(df)

    [In]: new_df.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figi_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figi_HTML.jpg)


    ### Principal Component Analysis


    Most of the time, we deal with multidimensional data, and it sometimes becomes
    difficult to understand the underlying pattern without visualizing that data.
    Principal component analysis (PCA) is one of the transformation techniques that
    allows you to reduce the dimensions of the data while keeping intact the variation
    of the data as much as possible. Let’s go over the steps to apply PCA, on the
    same data used previously.


    ```

    [In]: from pyspark.ml.feature import PCA

    [In]: assembler = VectorAssembler(inputCols=[col for col in df.columns if col
    !=''label''], outputCol="features")

    [In]: df_new=assembler.transform(df)

    [In]: df_new.show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figj_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figj_HTML.jpg)


    `k` represents the number of reduced dimensions of the data after PCA.


    ```

    [In]: pca = PCA(k=2, inputCol="features", outputCol="pca_features")

    [In]: pca_model=pca.fit(df_new)

    [In]: pca_comp = pca_model.transform(df_new).select("pca_features")

    [In]: pca_comp.show(truncate=False)

    [out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figk_HTML.png](images/478390_1_En_5_Chapter/478390_1_En_5_Figk_HTML.png)


    As you can see, we have applied PCA to the data (except for the “label” column)
    and reduced the number of dimensions to just two.


    ### Normalizer


    Normalization refers to transformation of data in such a way that the new normalized
    data has a mean of 0 and a standard deviation of 1. The normalization is done
    using the following formula:


    ![$$ \frac{\Big(\left(x- mean(x)\right)}{standard\ dev\ (x)} $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equh.png)


    To make use of `Normalizer` in Spark, we simply have to apply it on the required
    column. Here, we apply it to the “features” column.


    ```

    [In]: from pyspark.ml.feature import Normalizer

    [In]: normalizer = Normalizer(inputCol="features", outputCol="norm_features",
    p=1.0)

    [In]: normalised_l1_data = normalizer.transform(df_new)

    [In]: normalised_l1_data.select(''norm_features'').show(truncate=False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figl_HTML.png](images/478390_1_En_5_Chapter/478390_1_En_5_Figl_HTML.png)


    The normalization helps standardize the input data and sometimes improve the performance
    of the machine learning models.


    ### Standard Scaling


    Scaling is another technique to normalize data, such that the values are within
    a specific range, e.g., [0, 1]. Many machine learning algorithms are sensitive
    to the scale of the input data, and, hence, it becomes critical to apply scaling.
    Scaling can be applied in different ways, but the most fundamental approach is
    to use the following formula:


    ![$$ \frac{x-\mathit{\min}(x)}{\mathit{\max}\ (x)-\min (x)} $$](images/478390_1_En_5_Chapter/478390_1_En_5_Chapter_TeX_Equi.png)


    ```

    [In]: from pyspark.ml.feature import StandardScaler

    [In]: scaler = StandardScaler(inputCol="features", outputCol="scaled_features",

    withStd=False, withMean=True)

    [In]: scaler_model = scaler.fit(df_new)

    [In]: scaled_data = scaler_model.transform(df_new)

    [In]: scaled_data.select(''scaled_features'').show(truncate=False)

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figm_HTML.gif](images/478390_1_En_5_Chapter/478390_1_En_5_Figm_HTML.gif)


    ### Min-Max Scaling


    Min-max scaling is another version of standard scaling, as it allows you to rescale
    the feature values between specific limits (mostly, between 0 and 1). You can
    also rescale the values between 0 and 1, using min-max scaling.


    ```

    [In]: from pyspark.ml.feature import MinMaxScaler

    [In]: mm_scaler = MinMaxScaler(inputCol="features", outputCol="mm_scaled_features")

    [In]: mm_scaler_model = mm_scaler.fit(df_new)

    [In]: rescaled_df = mm_scaler_model.transform(df_new)

    [In]: rescaled_df.select("features", "mm_scaled_features").show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Fign_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Fign_HTML.jpg)


    To access the min and max values, we can use the `getMin` and `getMax` functions.
    In order to change the range, we can define the new min and max values by creating
    a scaler object. Here we rescale the values between -1 and 1.


    ```

    [In]: mm_scaler.getMin()

    [Out]: 0.0

    [In]: mm_scaler.getMax()

    [Out]: 1.0

    Alter the min max values

    [In]: mm_scaler = MinMaxScaler(inputCol="features", outputCol="mm_scaled_features”,
    min=-1,max=1)

    [In]: mm_scaler_model = mm_scaler.fit(df_new)

    [In]: rescaled_df = mm_scaler_model.transform(df_new)

    [In]: rescaled_df.select("features", "mm_scaled_features").show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figo_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figo_HTML.jpg)


    ### MaxAbsScaler


    `MaxAbsScaler` is a little different from standard scaling tools, as it rescales
    each feature value between -1 and 1. However, it does not shift the center of
    the data and, hence, does not impact any sparsity.


    ```

    [In]: from pyspark.ml.feature import MaxAbsScaler

    [In]: mxabs_scaler = MaxAbsScaler(inputCol="features", outputCol="mxabs_features")

    [In]: mxabs_scaler_model = mxabs_scaler.fit(df_new)

    [In]: rescaled_df = mxabs_scaler_model.transform(df_new)

    [In]: rescaled_df.select("features", "mxabs_features").show()

    [Out]:

    ```


    ![../images/478390_1_En_5_Chapter/478390_1_En_5_Figp_HTML.jpg](images/478390_1_En_5_Chapter/478390_1_En_5_Figp_HTML.jpg)'
