- fmt: '# 3. Spark Structured Streaming


    This chapter discusses how to use Spark’s streaming API to process real-time data.
    The first part focuses on the main difference between streaming and batch data,
    in addition to their specific applications. The second section provides details
    on the Structured Streaming API and its various improvements over previous RDD-based
    Spark streaming APIs. The final section includes the code to use for Structured
    Streaming on incoming data and discusses how to save the output results in memory.
    We’ll also look at an alternative to Structured Streaming.


    ## Batch vs. Stream


    Perhaps most readers of this book are already familiar with the key distinction
    between batch vs. stream data processing. Nonetheless, we can start on this note,
    as it emphasizes the importance of stream processing today. If we think of data
    as a huge ocean, then batch data can be referred to as a bucket of water, and
    we can have multiple buckets of different sizes, whereas stream data can be considered
    to be a water pipe that is continuously pumping water from the ocean.


    ### Batch Data


    As the name suggests, *batch* refers to a group of records put together over a
    period of time and later used for processing and analysis. Because these records
    are collected over a period of time, size-wise, batch data is generally bigger
    than streaming data (in some cases, however, stream data can be bigger than batch
    data) and is often used to conduct postmortems for various analysis purposes.
    The legacy systems, SQL databases, and mainframes all fall under the category
    of batch data. The key difference compared to streaming data is that batch data
    is not processed as soon as it becomes part of an earlier batch dataset.


    ### Stream Processing


    Stream processing refers to the processing of records in real time or near real
    time. One doesn’t wait for the day to end to then process or analyze the data.
    Rather, records of the dataset are processed one by one as soon as they become
    available or based on a window period, as shown in Figure [3-1](#478390_1_En_3_Chapter.xhtml#Fig1).
    As a result, this creates a sort of infinite table, with records continuously
    being added as data flows from the stream.


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig1_HTML.png](images/478390_1_En_3_Chapter/478390_1_En_3_Fig1_HTML.png)


    Figure 3-1


    Streaming data


    Today, businesses are very aggressive about using real-time data from various
    sources, such as platforms, devices, applications, and system logs, in order to
    keep their competitive edge. Therefore, stream processing has become a critical
    part of that overall process. Businesses want to use the latest or freshest data,
    to generate useful insights that can help in decision making. Batch processing
    cannot offer analytics on the fly, as it doesn’t work on a real-time basis, whereas
    stream data processing can help more effectively in such cases as fraud detection.


    ### Spark Streaming


    In the previous chapter, you have seen the core architecture of Spark. One of
    the components of the Spark framework is Spark Streaming (Structured Streaming),
    shown in Figure [3-2](#478390_1_En_3_Chapter.xhtml#Fig2).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig2_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Spark Streaming


    The earlier version of Spark offered a streaming API that was known as Spark Streaming
    (Dstream). Spark Streaming was based on RDDs (an earlier Spark abstraction before
    DataFrame/datasets) and had few limitations. As shown in Figure [3-3](#478390_1_En_3_Chapter.xhtml#Fig3),
    it was able to receive input data from various sources, such as Kafka, Flume,
    etc., and convert the incoming data into micro-batches and process them using
    Spark Engine.


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig3_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Spark Streaming data flow


    The results of each batch would be generated as stream-only and would be saved
    to the output location. Each micro-batch was an RDD, based on certain time intervals,
    as shown in Figure [3-4](#478390_1_En_3_Chapter.xhtml#Fig4).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig4_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Spark Streaming batch processing


    Although the earlier Spark streaming component was quite powerful in terms of
    handling the streaming data processing, it was lacking in certain aspects.


    1. One core drawback was that there were different APIs for batch and stream data
    processing jobs. Lots of changes (translations) had to be made to convert a batch
    job into a Dstream job.


    2. It was unable to handle batch data processing based on event time, only on
    batch time. It was difficult to manage late arriving data for processing.


    3. It had limited fault tolerance capability, without any end-to-end guarantee
    of consistent data processing.


    ## Structured Streaming


    The latest version of the streaming component in Spark is known as Structured
    Streaming, which is a huge improvement over the last RDD-based Spark streaming
    API. The first significant change from the previous version is that Structured
    Streaming offers the same API for batch as well as stream data processing jobs.
    Therefore, it works in a similar way for static and bounded batch data as for
    streaming and unbounded data, as shown in Figure [3-5](#478390_1_En_3_Chapter.xhtml#Fig5).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig5_HTML.png](images/478390_1_En_3_Chapter/478390_1_En_3_Fig5_HTML.png)


    Figure 3-5


    Static vs. Streaming DataFrame


    Another major shift from earlier versions is that Spark Structured Streaming is
    now built on top of the Spark SQL engine and uses DataFrame for multiple operations,
    such as aggregation, filters, etc. It also provides the end-to-end guarantee of
    data consistency, while writing the results in an output location. In order to
    understand how Structured Streaming works, let’s go through how data flows through
    its programming model, as shown in Figure [3-6](#478390_1_En_3_Chapter.xhtml#Fig6).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig6_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Structured Streaming process


    As the data arrives at time interval 1 (based on the window period selected),
    the input DataFrame consists of all the records up to that time interval (t=1).
    The next step is query execution (processing, transformation, join, aggregation)
    on that particular DataFrame (t=1). Once the query is completed, the results are
    made available, to be saved in the relevant output (console, memory, location).
    Now, new data arrives at time interval 2 and is added to the earlier DataFrame
    (t=1), resulting in a larger DataFrame (t=2). The query is again executed, but
    this time on a new DataFrame (t=2), and the results are saved in the selected
    output mode. This process continues for incoming streams of records, and each
    record is appended to the input DataFrame for data processing.


    Now that we understand the basic process of data processing with Structured Streaming,
    we can consider the core pieces of a streaming-based application. There are three
    main areas into which we can divide this streaming framework:


    1. Data input


    2. Data processing (real time or near real time)


    3. Final output'
  raw: '# 3. Spark Structured Streaming


    This chapter discusses how to use Spark’s streaming API to process real-time data.
    The first part focuses on the main difference between streaming and batch data,
    in addition to their specific applications. The second section provides details
    on the Structured Streaming API and its various improvements over previous RDD-based
    Spark streaming APIs. The final section includes the code to use for Structured
    Streaming on incoming data and discusses how to save the output results in memory.
    We’ll also look at an alternative to Structured Streaming.


    ## Batch vs. Stream


    Perhaps most readers of this book are already familiar with the key distinction
    between batch vs. stream data processing. Nonetheless, we can start on this note,
    as it emphasizes the importance of stream processing today. If we think of data
    as a huge ocean, then batch data can be referred to as a bucket of water, and
    we can have multiple buckets of different sizes, whereas stream data can be considered
    to be a water pipe that is continuously pumping water from the ocean.


    ### Batch Data


    As the name suggests, *batch* refers to a group of records put together over a
    period of time and later used for processing and analysis. Because these records
    are collected over a period of time, size-wise, batch data is generally bigger
    than streaming data (in some cases, however, stream data can be bigger than batch
    data) and is often used to conduct postmortems for various analysis purposes.
    The legacy systems, SQL databases, and mainframes all fall under the category
    of batch data. The key difference compared to streaming data is that batch data
    is not processed as soon as it becomes part of an earlier batch dataset.


    ### Stream Processing


    Stream processing refers to the processing of records in real time or near real
    time. One doesn’t wait for the day to end to then process or analyze the data.
    Rather, records of the dataset are processed one by one as soon as they become
    available or based on a window period, as shown in Figure [3-1](#478390_1_En_3_Chapter.xhtml#Fig1).
    As a result, this creates a sort of infinite table, with records continuously
    being added as data flows from the stream.


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig1_HTML.png](images/478390_1_En_3_Chapter/478390_1_En_3_Fig1_HTML.png)


    Figure 3-1


    Streaming data


    Today, businesses are very aggressive about using real-time data from various
    sources, such as platforms, devices, applications, and system logs, in order to
    keep their competitive edge. Therefore, stream processing has become a critical
    part of that overall process . Businesses want to use the latest or freshest data,
    to generate useful insights that can help in decision making. Batch processing
    cannot offer analytics on the fly, as it doesn’t work on a real-time basis, whereas
    stream data processing can help more effectively in such cases as fraud detection.


    ### Spark Streaming


    In the previous chapter, you have seen the core architecture of Spark. One of
    the components of the Spark framework is Spark Streaming (Structured Streaming),
    shown in Figure [3-2](#478390_1_En_3_Chapter.xhtml#Fig2).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig2_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Spark Streaming


    The earlier version of Spark offered a streaming API that was known as Spark Streaming
    (Dstream). Spark Streaming was based on RDDs (an earlier Spark abstraction before
    DataFrame/datasets) and had few limitations. As shown in Figure [3-3](#478390_1_En_3_Chapter.xhtml#Fig3),
    it was able to receive input data from various sources, such as Kafka, Flume,
    etc., and convert the incoming data into micro-batches and process them using
    Spark Engine.


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig3_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Spark Streaming data flow


    The results of each batch would be generated as stream-only and would be saved
    to the output location. Each micro-batch was an RDD, based on certain time intervals,
    as shown in Figure [3-4](#478390_1_En_3_Chapter.xhtml#Fig4).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig4_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Spark Streaming batch processing


    Although the earlier Spark streaming component was quite powerful in terms of
    handling the streaming data processing, it was lacking in certain aspects.


    1.  One core drawback was that there were different APIs for batch and stream
    data processing jobs. Lots of changes (translations) had to be made to convert
    a batch job into a Dstream job.


    2.  It was unable to handle batch data processing based on event time, only on
    batch time. It was difficult to manage late arriving data for processing.


    3.  It had limited fault tolerance capability , without any end-to-end guarantee
    of consistent data processing.


    ## Structured Streaming


    The latest version of the streaming component in Spark is known as Structured
    Streaming, which is a huge improvement over the last RDD-based Spark streaming
    API. The first significant change from the previous version is that Structured
    Streaming offers the same API for batch as well as stream data processing jobs.
    Therefore, it works in a similar way for static and bounded batch data as for
    streaming and unbounded data, as shown in Figure [3-5](#478390_1_En_3_Chapter.xhtml#Fig5).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig5_HTML.png](images/478390_1_En_3_Chapter/478390_1_En_3_Fig5_HTML.png)


    Figure 3-5


    Static vs. Streaming DataFrame


    Another major shift from earlier versions is that Spark Structured Streaming is
    now built on top of the Spark SQL engine and uses DataFrame for multiple operations,
    such as aggregation, filters, etc. It also provides the end-to-end guarantee of
    data consistency, while writing the results in an output location. In order to
    understand how Structured Streaming works, let’s go through how data flows through
    its programming model, as shown in Figure [3-6](#478390_1_En_3_Chapter.xhtml#Fig6).


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig6_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Structured Streaming process


    As the data arrives at time interval 1 (based on the window period selected),
    the input DataFrame consists of all the records up to that time interval (t=1).
    The next step is query execution (processing, transformation, join, aggregation)
    on that particular DataFrame (t=1). Once the query is completed, the results are
    made available, to be saved in the relevant output (console, memory, location).
    Now, new data arrives at time interval 2 and is added to the earlier DataFrame
    (t=1), resulting in a larger DataFrame (t=2). The query is again executed, but
    this time on a new DataFrame (t=2), and the results are saved in the selected
    output mode. This process continues for incoming streams of records, and each
    record is appended to the input DataFrame for data processing.


    Now that we understand the basic process of data processing with Structured Streaming,
    we can consider the core pieces of a streaming-based application. There are three
    main areas into which we can divide this streaming framework:


    1.  Data input


    2.  Data processing (real time or near real time)


    3.  Final output'
  trans: '

    # 3. Spark Structured Streaming


    本章讨论如何使用 Spark 的流式 API 处理实时数据。第一部分重点介绍流式数据与批处理数据的主要区别及其具体应用。第二部分详细阐述 Structured
    Streaming API 及其相较于之前基于 RDD 的 Spark 流式 API 的多项改进。最后一部分包含对传入数据使用 Structured Streaming
    的代码，并讨论如何将输出结果保存在内存中。我们还将探讨 Structured Streaming 的替代方案。


    ## 批处理 vs. 流处理


    或许本书的大多数读者已经熟悉批处理与流式数据处理之间的关键区别。尽管如此，我们仍可以从这一点入手，因为它强调了当今流处理的重要性。如果我们将数据视为浩瀚的海洋，那么批处理数据可以比作一桶水，我们可以拥有多个不同大小的桶；而流式数据则可以视为一根从海洋中持续抽水的水管。


    ### 批处理数据


    顾名思义，*批处理*指的是在一段时间内收集的一组记录，随后用于处理和分析。由于这些记录是在一段时间内收集的，从规模上看，批处理数据通常比流式数据更大（但在某些情况下，流式数据也可能大于批处理数据），并且常用于进行事后分析，以满足各种分析目的。传统系统、SQL
    数据库和大型机都属于批处理数据的范畴。与流式数据的关键区别在于，批处理数据不会在成为早期批处理数据集的一部分后立即被处理。


    ### 流处理


    流处理指的是实时或近实时地处理记录。人们无需等到一天结束才去处理或分析数据。相反，数据集中的记录一旦可用，就会逐个进行处理，或者基于一个窗口期进行处理，如图
    3-1 所示。因此，这创建了一种无限表，随着数据从流中流入，记录被持续添加。


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig1_HTML.png](img/478390_1_En_3_Fig1_HTML.png)


    图 3-1


    流式数据


    如今，企业为了保持竞争优势，非常积极地使用来自各种来源（如平台、设备、应用程序和系统日志）的实时数据。因此，流处理已成为整个流程中的关键部分。企业希望利用最新或最新的数据来生成有助于决策的有用见解。批处理无法提供即时分析，因为它不基于实时工作，而流式数据处理在欺诈检测等情况下可以更有效地提供帮助。


    ### Spark Streaming


    在上一章中，你已经了解了 Spark 的核心架构。Spark 框架的组件之一是 Spark Streaming（Structured Streaming），如图
    3-2 所示。


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig2_HTML.jpg](img/478390_1_En_3_Fig2_HTML.jpg)


    图 3-2


    Spark Streaming


    早期版本的 Spark 提供了一个称为 Spark Streaming (Dstream) 的流式 API。Spark Streaming 基于 RDD（DataFrame/数据集之前的早期
    Spark 抽象）构建，并且有一些局限性。如图 3-3 所示，它能够从各种来源（如 Kafka、Flume 等）接收输入数据，将传入的数据转换为微批次，并使用
    Spark 引擎进行处理。


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig3_HTML.jpg](img/478390_1_En_3_Fig3_HTML.jpg)


    图 3-3


    Spark Streaming 数据流


    每个批次的结果将作为仅流式数据生成，并保存到输出位置。每个微批次都是一个 RDD，基于特定的时间间隔，如图 3-4 所示。


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig4_HTML.jpg](img/478390_1_En_3_Fig4_HTML.jpg)


    图 3-4


    Spark Streaming 批处理


    尽管早期的 Spark 流式组件在处理流式数据方面相当强大，但在某些方面仍存在不足。


    1. 一个核心缺点是批处理和流式数据处理作业使用了不同的 API。将批处理作业转换为 Dstream 作业需要进行大量更改（转换）。


    2. 它无法基于事件时间处理批处理数据，只能基于批处理时间。处理延迟到达的数据很困难。


    3. 其容错能力有限，无法提供端到端的一致数据处理保证。


    ## Structured Streaming


    Spark 中流式组件的最新版本称为 Structured Streaming，它是对之前基于 RDD 的 Spark 流式 API 的巨大改进。与之前版本相比，第一个重大变化是
    Structured Streaming 为批处理和流式数据处理作业提供了相同的 API。因此，它处理静态、有界的批处理数据的方式与处理流式、无界数据的方式类似，如图
    3-5 所示。


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig5_HTML.png](img/478390_1_En_3_Fig5_HTML.png)


    图 3-5


    静态 DataFrame 与流式 DataFrame


    与早期版本相比的另一个重大转变是，Spark Structured Streaming 现在构建在 Spark SQL 引擎之上，并使用 DataFrame
    进行多种操作，例如聚合、过滤等。它还在将结果写入输出位置时提供端到端的数据一致性保证。为了理解 Structured Streaming 的工作原理，让我们了解一下数据如何流经其编程模型，如图
    3-6 所示。


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Fig6_HTML.jpg](img/478390_1_En_3_Fig6_HTML.jpg)


    图 3-6


    Structured Streaming 处理流程


    当数据在时间间隔 1（基于所选的窗口期）到达时，输入 DataFrame 包含截至该时间间隔 (t=1) 的所有记录。下一步是对该特定 DataFrame
    (t=1) 执行查询（处理、转换、连接、聚合）。查询完成后，结果可用，并保存到相关的输出（控制台、内存、位置）。现在，新数据在时间间隔 2 到达，并被添加到之前的
    DataFrame (t=1) 中，从而形成一个更大的 DataFrame (t=2)。再次执行查询，但这次是在新的 DataFrame (t=2) 上，并将结果保存到选定的输出模式。此过程对传入的记录流持续进行，每条记录都被追加到输入
    DataFrame 中以供数据处理。


    既然我们了解了使用 Structured Streaming 进行数据处理的基本过程，我们可以考虑基于流式处理的应用的核心组成部分。我们可以将这个流式框架分为三个主要领域：


    1. 数据输入


    2. 数据处理（实时或近实时）


    3. 最终输出

    '
- fmt: '### Data Input


    任何流式应用程序都需要数据，以便能够持续地摄取和处理数据。因此，有多种方式可以为 Structured Streaming 平台提供数据输入。


    - **消息系统**：`Apache Kafka`、`Flume` 和 `Logstash` 可用于摄取实时数据，因此可以轻松成为构建流式管道的一部分。使用这些工具的思路是，在源应用程序（Web
    应用、移动应用、物联网设备）生成数据时捕获所有数据点，并将其传递给 Structured Streaming 平台，以便以容错和可扩展的方式进行进一步处理和分析。


    - **文件文件夹/目录**：文件作为数据流从目录中持续读取。可以使用调度程序将新文件放入该目录。文件可以是文本、`Parquet` 或 `JSON` 格式。唯一的条件是所有文件必须采用相同的格式。


    ### Data Processing


    这是利用流式数据创造商业价值的核心，因为它可以对传入的数据应用某些操作来获得结果。可以应用诸如聚合、过滤、连接、排序等操作。


    ### Final Output


    Structured Streaming 为用户提供了多种选项，以便根据需要保存输出结果，结果可以是 `Append` 或 `Complete` 模式。`Append`
    模式指仅将新结果添加到最终输出表中，而 `Complete` 模式则在最终输出位置更新整个结果表。


    1.  文件目录接收器

    2.  控制台

    3.  内存接收器


    ## Building a Structured App


    在本章的最后一节中，我们将构建一个 Structured Streaming 应用程序，该应用程序可以从本地系统文件夹读取文件（当新文件作为流数据添加到文件夹时），对新数据应用所有操作，最后将结果写入输出目录。第一步是创建
    `SparkSession` 对象，以便使用 Spark。


    ```

    [In]: from pyspark.sql import SparkSession

    [In]: spark=SparkSession.builder.appName(''structured_streaming'').getOrCreate()

    [In]: import pyspark.sql.functions as F

    [In]: from pyspark.sql.types import *

    ```


    然后，我们创建一些自生成数据，这些数据可以被推送到相应的本地目录（`"csv folder"`），以供 Structured Streaming 读取。我们将生成的数据包含四列，格式为
    CSV。如果需要，我们也可以生成 Parquet 格式。


    1.  用户 ID

    2.  应用程序

    3.  花费时间（秒）

    4.  年龄


    ```

    [In]:df_1=spark.createDataFrame([("XN203",''FB'',300,30),("XN201",''Twitter'',10,19),("XN202",''Insta'',500,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    ```


    创建这些数据框后，我们可以定义这些文件的模式，以便使用流处理读取它们。


    ```

    [In]:schema=StructType().add("user_id","string").add("app","string").add("time_in_secs",
    "integer").add("age", "integer")

    ```


    现在，本地文件夹（`"csv folder"`）中已有一个文件，我们可以继续将其作为流数据框读取。读取静态数据框的 API 与读取流数据框的 API 类似，唯一的区别是我们使用
    `readStream`。


    ```

    [In]: data=spark.readStream.option("sep", ",").schema(schema).csv("csv_folder")

    ```


    为了验证数据框的模式，我们可以使用 `printSchema` 命令。


    ```

    [In]: data.printSchema()

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figa_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figa_HTML.jpg)


    ### Operations


    一旦我们有了流数据框，就可以应用多种转换，以便根据特定需求获得不同的结果。在本例中，我们将看到聚合、排序、过滤等操作。首先，简单地统计数据框中每个应用程序的记录数。我们可以像在静态数据框上应用转换一样编写命令。


    ```

    [In]: app_count=data.groupBy(''app'').count()

    ```


    为了查看结果，除了指定目标位置外，我们还必须指定输出模式。在本例中，我们将结果写入内存，但也可以写入控制台、特定云存储或任何其他位置。我们还指定输出模式为
    `complete`，以便每次都将结果写入整个数据框。最后，我们使用一个简单的 Spark SQL 命令，通过将流数据框上的查询结果转换为 Pandas 数据框来查看输出。


    ```

    [In]:query=(app_count.writeStream.queryName(''count_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from count_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figb_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figb_HTML.jpg)


    在本例中，编写了一个查询来仅过滤 Facebook（FB）应用程序的记录。然后计算每个用户在 FB 应用程序上花费的平均时间。


    ```

    [In]: fb_data=data.filter(data[''app'']==''FB'')

    [In]: fb_avg_time=fb_data.groupBy(''user_id'').agg(F.avg("time_in_secs"))

    [In]:fb_query=(fb_avg_time.writeStream.queryName(''fb_query'').outputMode(''complete'').format(''memory'').start())

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figc_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figc_HTML.jpg)


    由于本地文件夹中当前只有一个数据框，我们得到了一个用户访问 FB 以及花费时间的输出。为了查看更多相关结果，让我们向文件夹中推送更多自生成数据。


    ```

    [In]:df_2=spark.createDataFrame([("XN203",''FB'',100,30),("XN201",''FB'',10,19),("XN202",''FB'',2000,45)],["user_id","app","time_in_secs","age"]).write.csv("csv_folder",mode=''append'')

    ```


    现在我们可以有把握地假设，Spark Structured Streaming 已经读取了新记录并将其追加到流数据框中，因此，相同查询的新结果将与上次不同。


    ```

    [In]: spark.sql("select * from fb_query ").toPandas().head(5)

    [Out]:

    ```


    ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figd_HTML.jpg](images/478390_1_En_3_Chapter/478390_1_En_3_Figd_HTML.jpg)


