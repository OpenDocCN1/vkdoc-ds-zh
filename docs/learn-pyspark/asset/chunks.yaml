    ## Structured Streaming Alternatives


    Since Spark Structured Streaming was made available in 2016, it has been rapidly
    gaining attention from the developers community. Having said that, however, there
    are a couple of other powerful alternatives to Spark’s Structured Streaming. One
    of them is Flink, which offers similar capability, in terms of streaming data
    processing with excellent latency rate. Another alternative is Google’s Beam,
    which is suitable in limited cases.


    The core advantage of Spark’s Structured Streaming over the alternatives is the
    full-fledged framework provided by Spark as a whole, including batch processing
    (no major difference in code for batch or stream) and the machine learning library.
    Another great attribute of Structured Streaming is its Spark SQL API, which is
    extremely comfortable to many users. It is hoped that new versions of Spark will
    include more features for Structured Streaming, such as stream joins. Selection
    depends on the specific requirements of the application and finding the best possible
    alternative to make it scalable, fault-tolerant, and robust.


    ## Conclusion


    In this chapter, the basic difference between batch and streaming data was identified.
    How Spark’s streaming API has evolved over the last few years to become the default
    framework for building streaming data applications was then discussed. Examples
    of how Spark’s Structured Streaming API is used to read streaming data (local
    folders), and how to save the aggregated results, were then provided.


    # 4. Airflow


    This chapter focuses on introducing Airflow and how it can be used to handle complex
    data workflows. Airflow was developed in-house by Airbnb engineers, to manage
    internal workflows in an efficient manner. Airflow later went on to become part
    of Apache in 2016 and was made available to users as an open source. Basically,
    Airflow is a framework for executing, scheduling, distributing, and monitoring
    various jobs in which there can be multiple tasks that are either interdependent
    or independent of one another. Every job that is run using Airflow must be defined
    via a directed acyclic graph (DAG) definition file, which contains a collection
    you want to run, grouped by relationships and dependencies.


    This chapter concentrates on three main topics. I’ll start by examining workflow
    and then cover the basic building block of Airflow: DAG. You will then learn about
    the user interface aspect of Airflow. In the final section, I will go over the
    code to define DAG for a job and how to use Airflow to execute and monitor it.


    ## Workflows


    Most of the things that we see around us follow a process. Trains run at set intervals,
    planes fly on fixed times, and signals on roads change at regular periods. Process
    is critical if consistency is required, especially when there are dependencies
    among different tasks. In the world of software or technology, a set process is
    also followed, in building or executing projects. If we go down a few levels,
    we can call these processes workflows. A proper workflow must be designed and
    executed, in order to achieve the desired results. It is rare to witness developers
    or engineers who don’t follow a standard procedure, to build a solution or application.
    For example, in a typical scenario for data processing workflow, developers will
    define the steps before executing the tasks, as shown in Figure [4-1](#478390_1_En_4_Chapter.xhtml#Fig1).
    These steps are often referred to as pipelines, which consist of sequences of
