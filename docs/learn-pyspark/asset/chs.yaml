  ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figh_HTML.jpg](img/478390_1_En_3_Figh_HTML.jpg)


  因此，在前面的示例中，我们了解了如何使用 Spark Structured Streaming 读取传入数据并创建流式数据帧，以应用各种转换并将结果写入特定位置。流式数据的另一个常见需求是连接。


  ### 连接


  有时，我们需要将传入数据与批处理数据合并，以使其更全面。在下面的示例中，我们将了解如何将传入数据（流数据帧）与包含应用程序全名的静态数据帧合并。让我们创建一个包含两列（`app`
  和 `full_name`）的新静态数据帧。


  ```python

  [In]: app_df = spark.createDataFrame([(''FB'',''FACEBOOK''),(''Insta'',''INSTAGRAM''),(''Twitter'',''TWITTER'')],
  ["app", "full_name"])

  [In]: app_df.show()

  [Out]:

  ```


  ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figi_HTML.jpg](img/478390_1_En_3_Figi_HTML.jpg)


  现在我们有了一个可用的静态数据帧，我们可以简单地编写一个新查询，将我们一直在处理的流式数据帧（`data`）与它进行连接，并将两者在 `app` 列上合并。


  ```python

  [In]: app_stream_df = data.join(app_df, ''app'')

  [In]: join_query = (app_stream_df.writeStream.queryName(''join_query'').outputMode(''append'').format(''memory'').start())

  [In]: spark.sql("select * from join_query ").toPandas().head(50)

  [Out]:

  ```


  ![../images/478390_1_En_3_Chapter/478390_1_En_3_Figj_HTML.jpg](img/478390_1_En_3_Figj_HTML.jpg)


  如您所见，现在流式数据帧中也多了额外的列（`full_name`）。


  ## Structured Streaming 的替代方案


  自 2016 年 Spark Structured Streaming 问世以来，它迅速获得了开发者社区的关注。然而，话虽如此，Spark 的 Structured
  Streaming 还有其他几个强大的替代方案。其中之一是 Flink，它在流式数据处理方面提供了类似的能力，并且具有出色的延迟率。另一个替代方案是 Google
  的 Beam，它适用于有限的情况。


  Spark 的 Structured Streaming 相对于替代方案的核心优势在于 Spark 作为一个整体提供的完整框架，包括批处理（批处理或流式处理的代码没有重大差异）和机器学习库。Structured
  Streaming 的另一个巨大优势是其 Spark SQL API，这对许多用户来说非常舒适。希望新版本的 Spark 能为 Structured Streaming
  包含更多功能，例如流式连接。选择取决于应用程序的具体需求，并找到最佳的可能替代方案，使其具有可扩展性、容错性和健壮性。


  ## 结论


  本章明确了批处理和流式数据之间的基本区别。然后讨论了 Spark 的流式 API 在过去几年中如何演变为构建流式数据应用程序的默认框架。最后提供了如何使用 Spark
  的 Structured Streaming API 读取流式数据（本地文件夹）以及如何保存聚合结果的示例。


