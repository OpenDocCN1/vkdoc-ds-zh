  ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figy_HTML.jpg](img/478390_1_En_2_Figy_HTML.jpg)


  ```

  [In]: df.groupBy(''Customer_subtype'').agg(F.max(''Avg_Salary'').alias(''max_salary'')).orderBy(''max_salary'',ascending=False).show()

