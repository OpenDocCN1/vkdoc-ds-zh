- "# 1. Spark 简介\n\n由于本书是关于 Spark 的，因此第一章从探讨 Spark 的一些历史及其不同组件开始是合情合理的。本章引言部分分为三个部分。在第一部分中，我将回顾数据的演变过程以及它在规模上如何发展到今天的地步。我将触及数据的三个关键方面。在第二部分中，我将深入探讨\
  \ Spark 的内部机制，并详细介绍其不同组件，包括其架构和运作方式。本章的第三部分也是最后一部分，重点介绍如何在云环境中使用 Spark。\n\n## 历史\n\
  \nSpark 项目诞生于加州大学伯克利分校的算法、机器与人类 (AMP) 实验室。该项目的启动是为了解决 Hadoop MapReduce 框架中潜在的问题。尽管\
  \ Hadoop MapReduce 是处理大数据处理的突破性框架，但实际上它在速度方面仍存在许多限制。Spark 是全新的，能够进行内存计算，这使其比任何其他大数据处理框架快近\
  \ 100 倍。自那时起，全球范围内将 Spark 用于大数据应用的情况持续增加。但在深入探讨 Spark 的具体细节之前，让我们先考虑一下数据本身的几个方面。\n\
  \n数据可以从三个不同的角度来审视：其收集、存储和处理的方式，如图 1-1 所示。\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig1_HTML.png](img/478390_1_En_1_Fig1_HTML.png)\n\
  \n图 1-1\n\n数据的三个方面\n\n### 数据收集\n\n在过去的几年里，数据收集的方式发生了巨大的转变。从在杂货店买一个苹果到在手机上删除一个应用程序，每一个数据点现在都被捕获在后端，并通过各种内置应用程序进行收集。不同的物联网\
  \ (IoT) 设备每毫秒都会捕获大量的视觉和感官信号。对于企业来说，从各种来源收集这些数据并在以后用于改进决策，已经变得相对方便。\n\n\n### 数据存储\n\
  \n在早些年，没人能想象数据会存放在某个远程位置，或者存储数据的成本会变得如此低廉。企业已经接受了云存储，并开始看到它相较于本地部署方法的优势。然而，出于各种原因，一些企业仍然选择本地存储。众所周知，数据存储最初是利用磁带进行的。随后，软盘的突破性引入使得数据可以从一个地方转移到另一个地方。然而，数据的大小仍然是一个巨大的限制。闪存盘和硬盘使得以更低的成本存储和传输大量数据变得更加容易。（见图\
  \ 1-2。）存储设备发展的最新趋势已经产生了能够存储高达 2TB 数据的闪存盘，且价格低廉。\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig2_HTML.png](img/478390_1_En_1_Fig2_HTML.png)\n\
  \n图 1-2\n\n数据存储的演变\n\n这一趋势清楚地表明，多年来数据存储成本已显著降低，并且还在继续下降。因此，企业不再回避存储海量数据，无论其类型如何。从日志到财务和运营交易，再到简单的员工反馈，一切都被存储起来。\n\
  \n### 数据处理\n\n数据的最后一个方面是使用存储的数据并进行处理，以便进行分析或运行应用程序。我们见证了在过去 20 年里计算机变得多么高效。过去需要五分钟才能执行的任务，使用当今配备先进处理单元的机器可能不到一秒钟就能完成。因此，不言而喻，机器可以更快、更容易地处理数据。尽管如此，无论单台机器的处理能力有多强，它能处理的数据量仍然存在限制。因此，Spark\
  \ 背后的基本思想是使用一组（集群）机器和一个统一的处理引擎（Spark）来处理和应对海量数据，同时不影响速度和安全性。这正是促成 Spark 诞生的最终目标。\n\
  \n## Spark 架构\n\n有五个核心组件使 Spark 如此强大且易于使用。Spark 的核心架构包含以下层次，如图 1-3 所示：\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig3_HTML.png](img/478390_1_En_1_Fig3_HTML.png)\n\
  \n图 1-3\n\nSpark 的核心组件\n\n- 存储\n- 资源管理\n- 引擎\n- 生态系统\n- API\n\n### 存储\n\n在使用 Spark\
  \ 之前，必须准备好数据才能进行处理。这些数据可以驻留在任何类型的数据库中。Spark 提供了多种选项来使用不同类别的数据源，以便能够大规模地处理数据。Spark\
  \ 允许你使用传统的关系型数据库以及 NoSQL 数据库，例如 Cassandra 和 MongoDB。\n\n### 资源管理\n\n下一层由资源管理器组成。由于\
  \ Spark 在一组机器上工作（它也可以在具有多个核心的单台机器上工作），因此它被称为 Spark *集群*。通常，任何集群中都有一个资源管理器，用于高效地处理这些资源之间的工作负载。两种最广泛使用的资源管理器是\
  \ YARN 和 Mesos。资源管理器内部有两个主要组件：\n\n1. *集群管理器*\n2. *工作节点*\n\n这有点像主从架构，其中集群管理器充当主节点，而工作节点在集群中充当从节点。集群管理器跟踪与工作节点及其当前状态相关的所有信息。集群管理器始终维护以下信息：\n\
  \n- 工作节点状态（忙碌/可用）\n- 工作节点位置\n- 工作节点内存\n- 工作节点总 CPU 核心数\n\n集群管理器的主要作用是根据工作节点的可用性和容量来管理工作节点并为其分配任务。另一方面，工作节点仅负责执行集群管理器分配给它的任务，如图\
  \ 1-4 所示。\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig4_HTML.png](img/478390_1_En_1_Fig4_HTML.png)\n\
  \n图 1-4\n\n资源管理\n\n分配给工作节点的任务通常是整个 Spark 应用程序的各个部分。Spark 应用程序包含两部分：\n\n1. 任务\n2.\
  \ Spark 驱动器\n\n任务是使用 PySpark 或 Spark R 代码编写的数据处理逻辑。它可以简单到计算单词的总频率，也可以复杂到对非结构化数据集执行一系列非常复杂的指令。第二个组件是\
  \ Spark 驱动器，它是 Spark 应用程序的主要控制器，持续与集群管理器交互，以找出哪些工作节点可用于执行请求。Spark 驱动器的作用是请求集群管理器为每个工作节点启动\
  \ Spark 执行器。\n\n### 引擎与生态系统\n\nSpark 架构的基础是其核心，它构建在 RDD（弹性分布式数据集）之上，并为 Spark 贡献者提供了多个\
  \ API 来构建其他库和生态系统。它包含两部分：分布式计算基础设施和 RDD 编程抽象。Spark 工具包中的默认库以四种不同的形式提供。\n\n#### Spark\
  \ SQL\n\nSQL 被全球大多数 ETL 操作员使用，这使其成为 Spark 产品中合乎逻辑的选择。它允许 Spark 用户通过运行 SQL 查询来执行结构化数据处理。实际上，Spark\
  \ SQL 利用催化剂优化器在执行 SQL 查询期间进行优化。\n\n使用 Spark SQL 的另一个优点是它可以轻松处理多个数据库文件和存储系统，例如 SQL、NoSQL、Parquet\
  \ 等。\n\n#### MLlib\n\n在大型数据集上训练机器学习模型开始成为一个巨大的挑战，直到 Spark 的 MLlib（机器学习库）出现。MLlib\
  \ 使您能够使用 Spark 集群在大型数据集上训练机器学习模型。它允许您在 Spark ML 库中构建监督学习、无监督学习、推荐系统、基于 NLP 的模型以及深度学习。\n\
  \n## Structured Streaming\n\nSpark Streaming 库提供了读取和处理实时流数据的功能。传入的数据可以是批处理数据，也可以是来自不同源的近实时数据。Structured\
  \ Streaming 能够从诸如 Flume、Kafka、Twitter 等源摄取实时数据。本书后面有一章专门介绍这个组件（见第 3 章）。\n\n####\
  \ Graph X\n\n这是一个位于 Spark 核心之上的库，允许用户处理特定类型的数据（图数据帧），这些数据由节点和边组成。典型的图用于建模所涉及的不同对象之间的关系。节点代表对象，节点之间的边代表它们之间的关系。图数据帧主要用于网络分析，而\
  \ Graph X 使得对此类图数据帧进行分布式处理成为可能。\n\n### 编程语言 API\n\nSpark 支持四种语言。由于 Spark 是使用 Scala\
  \ 构建的，因此 Scala 是其原生语言。除了 Scala，我们还可以使用 Python、Java 和 R，如图 1-5 所示。\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig5_HTML.jpg](img/478390_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\n语言 API\n\n\n\n## 搭建开发环境\n\n在本章的最后部分，我将介绍如何在云端搭建 Spark 环境。使用 Spark 有多种方式：\n\
  \n- 本地搭建\n- Docker 容器\n- 云环境（GCP、AWS、Azure）\n- Databricks\n\n### 本地搭建\n\n在本地系统上安装和使用\
  \ Spark 相对容易，但如果不部署在集群上，就违背了 Spark 本身的核心用途。Spark 的核心价值在于分布式数据处理，若仅在本地系统运行，其能力将始终受限于单机性能；而将\
  \ Spark 部署在多台机器上才能发挥更大优势。不过，在本地保留 Spark 环境，并用样本数据测试代码仍是不错的做法。请按以下步骤操作：\n\n1. 确保已安装\
  \ Java，否则请安装 Java。\n2. 从 [`https://spark.apache.org/downloads.html`](https://spark.apache.org/downloads.html)\
  \ 下载最新版 Apache Spark。\n3. 解压压缩包中的文件。\n4. 将所有 Spark 相关文件复制到对应目录。\n5. 配置环境变量以运行 Spark。\n\
  6. 验证安装并运行 Spark。\n\n### Docker 容器\n\n另一种本地使用 Spark 的方式是通过 Docker 容器化技术。这允许用户将所有依赖和\
  \ Spark 文件打包成一个镜像，可在任何系统上运行。任务完成后可终止容器，需要时再重新运行。要使用 Docker 运行 Spark，需先在系统上安装 Docker，然后执行以下命令：`docker\
  \ run -it -p 8888:8888 jupyter/pyspark-notebook`。\n\n### 云环境\n\n如本章前文所述，由于多种原因，本地环境在处理大数据时作用有限，而基于云的环境则能在短时间内完成海量数据的摄取和处理。在处理超过\
  \ 100TB 的大数据集时，Spark 的真正威力才能充分展现。大多数云基础设施提供商都允许安装 Spark，有时甚至预配置了 Spark。用户可根据需求轻松启动符合规格的集群。Databricks\
  \ 就是其中一种云环境。\n\n#### Databricks\n\nDatabricks 由 Spark 的创始团队创立，旨在为企业提供 Spark 企业版及全面支持。为提升\
  \ Spark 在社区和用户中的普及度，Databricks 还提供了免费的社区版 Spark，配备 6GB 集群（单节点）。如需扩大集群规模，可注册 Databricks\
  \ 企业版账户，步骤如下：\n\n1. 搜索 Databricks 网站，选择 Databricks 社区版，如图 1-6 所示。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig6_HTML.jpg](img/478390_1_En_1_Fig6_HTML.jpg)\n\
  \n   图 1-6 Databricks 网页\n\n2. 若已有 Databricks 账户，可直接登录。若无账户，需先创建账户才能使用 Databricks，如图\
  \ 1-7 所示。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig7_HTML.png](img/478390_1_En_1_Fig7_HTML.png)\n\
  \n   图 1-7 Databricks 登录页面\n\n3. 进入主页后，可选择加载新数据源或从头创建笔记本，如图 1-8 所示。若选择创建笔记本，需确保集群已启动运行。因此需点击\"\
  新建集群\"来启动集群（Databricks 提供 6GB 的 AWS EMR 集群）。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig8_HTML.png](img/478390_1_En_1_Fig8_HTML.png)\n\
  \n   图 1-8 创建 Databricks 笔记本\n\n4. 配置集群时，需为集群命名，并选择与 Python 版本匹配的 Spark 版本，如图 1-9\
  \ 所示。填写完所有信息后，点击\"创建集群\"，等待数分钟直至集群启动。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig9_HTML.png](img/478390_1_En_1_Fig9_HTML.png)\n\
  \n   图 1-9 创建 Databricks 集群\n\n5. 可通过左侧面板的\"集群\"选项查看集群状态，如图 1-10 所示。该页面显示特定集群的所有相关信息及其当前状态。\n\
  \n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig10_HTML.png](img/478390_1_En_1_Fig10_HTML.png)\n\
  \n   图 1-10 Databricks 集群列表\n\n6. 最后一步是打开笔记本并将其连接到刚创建的集群（图 1-11）。连接成功后即可开始编写 PySpark\
  \ 代码。\n\n   ![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig11_HTML.png](img/478390_1_En_1_Fig11_HTML.png)\n\
  \n   图 1-11 Databricks 笔记本\n\n总体而言，自 2010 年 Spark 成为开源平台以来，其用户数量持续增长，社区规模与日俱增。Spark\
  \ 的贡献者数量已超过 Hadoop，这并不令人意外。一项调查揭示了 Spark 受欢迎的部分原因，结果如图 1-12 所示。\n\n![../images/478390_1_En_1_Chapter/478390_1_En_1_Fig12_HTML.jpg](img/478390_1_En_1_Fig12_HTML.jpg)\n\
  \n图 1-12 Spark 采用情况调查结果\n\n## 本章小结\n\n本章简要介绍了 Spark 的发展历史、核心组件以及在云环境中访问 Spark 的方法。在后续章节中，我将深入探讨\
  \ Spark 的各个方面，以及如何用它构建不同的应用程序。\n\n"
- '# 2. 数据处理


  本章涵盖在 PySpark 中预处理和处理数据的不同步骤。预处理技术因场景而异，有多种方法可将数据塑造成所需形式。本章旨在介绍 Spark 中处理大数据的一些常用技术。我们将学习数据预处理涉及的不同步骤，包括处理缺失值、合并数据集、应用函数、聚合和排序。数据预处理的一个重要部分是将数值列转换为分类列（反之亦然），这将在后续几章中结合机器学习进行讲解。本章使用的数据集基于一项原始研究数据集，包含原始数据集中的部分属性，并添加了包含虚构数据点的额外列。


  ### 注意


  以下所有步骤均在 Jupyter Notebook 中编写，Spark 运行在 Docker 镜像上（详见第 1 章）。后续所有代码也可在 Databricks
  中运行。


  ## 创建 SparkSession 对象


  第一步是创建 `SparkSession` 对象以使用 Spark。同时从 `spark.sql` 导入所有必要的函数和数据类型：


  ```

  [In]: from pyspark.sql import SparkSession

  [In]: spark=SparkSession.builder.appName(''data_processing'').getOrCreate()

  [In]: import pyspark.sql.functions as F

  [In]: from pyspark.sql.types import *

  ```


  现在，我们不直接读取文件创建数据框，而是通过传递键值来演示创建数据框的过程。在 Spark 中创建数据框的方式是声明其模式并传递列值。




  ### 创建数据框


  在以下示例中，我们创建了一个新的数据框，其中包含五种特定数据类型（`string` 和 `integer`）的列。如您所见，当我们在新数据框上调用 `show`
  时，它会创建三行五列，包含我们传入的值。


  ```

  [In]: schema=StructType().add("user_id","string").add("country","string").add("browser",
  "string").add("OS",''string'').add("age", "integer")

  [In]: df=spark.createDataFrame([("A203",''India'',"Chrome","WIN",33),("A201",''China'',"Safari","MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

  [In]: df.printSchema()

  [Out]:

  ```


  ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figa_HTML.jpg](img/478390_1_En_2_Figa_HTML.jpg)


  ```

  [In]: df.show()

  [Out]:

  ```


  ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figb_HTML.jpg](img/478390_1_En_2_Figb_HTML.jpg)


  ### 空值


  空值是整体数据中非常常见的组成部分。因此，在数据处理流程中添加一个步骤来处理空值变得至关重要。在 Spark 中，我们可以通过将空值替换为特定值，或者删除包含空值的行/列来处理空值。


  首先，我们创建一个新的数据框（`df_na`），其中两列包含空值（其模式与之前的数据框相同）。处理空值的第一种方法是，将当前数据框中的所有空值填充为 `0`，这提供了一种快速修复方案。我们使用
  `fillna` 函数将数据框中的所有空值替换为 `0`。第二种方法是，将特定列（`country`、`browser`）中的空值分别替换为 `''USA''`
  和 `''Safari''`。


  ```

  [In]: df_na=spark.createDataFrame([("A203",None,"Chrome","WIN",33),("A201",''China'',None,"MacOS",35),("A205",''UK'',"Mozilla","Linux",25)],schema=schema)

  [In]: df_na.show()

  [Out]:

  ```


  ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figc_HTML.jpg](img/478390_1_En_2_Figc_HTML.jpg)


  ```

  [In]: df_na.fillna(''0'').show()

  [Out]:

  ```


  ![../images/478390_1_En_2_Chapter/478390_1_En_2_Figd_HTML.jpg](img/478390_1_En_2_Figd_HTML.jpg)


  ```

  [In]: df_na.fillna( { ''country'':''USA'', ''browser'':''Safari'' } ).show()

  [Out]:

  ```


  ![../images/478390_1_En_2_Chapter/478390_1_En_2_Fige_HTML.jpg](img/478390_1_En_2_Fige_HTML.jpg)


  为了删除包含任何空值的行，我们可以简单地使用 PySpark 中的 `na.drop` 功能。而如果需要针对特定列执行此操作，我们也可以传入列名集合，如下例所示：


  ```

  [In]: df_na.na.drop().show()

