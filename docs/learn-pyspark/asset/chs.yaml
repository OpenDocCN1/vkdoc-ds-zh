  ### 广义线性模型回归


  广义线性模型（GLM）是线性回归的进阶版本，它允许目标变量的误差分布不局限于正态分布。GLM 通过使用链接函数对线性回归进行泛化，使得方差成为预测值本身的函数。让我们尝试在相同数据集上构建
  GLM，看看它是否比简单线性回归模型表现更好。首先，我们需要从 MLlib 中导入 GLM。


