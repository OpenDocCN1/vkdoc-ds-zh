  ### 使用 K-Means 构建聚类


  在执行聚类分析之前，需要提出的一个关键问题是：“数据应该形成多少个聚类？”解决这个问题的一种方法是使用肘部法则，通过绘制聚类内总平方误差与聚类数量的关系图。这能让我们了解从给定数据中可以形成多少个合适的组。基本上，我们对一组预先确定数量的聚类（2-10）应用
  k-means 算法，并可视化其对应的误差。图表中形成肘部形状的位置，就是选择 `k` 值的最佳数量。


  ```

  [In]: errors=[]

  for k in range(2,10):

  kmeans = KMeans(featuresCol=''scaledFeatures'',k=k)

  model = kmeans.fit(cluster_final_data)

  wssse = model.computeCost(cluster_final_data)

  errors.append(wssse)

  print("With K={}".format(k))

  print("Within Set Sum of Squared Errors = " + str(wssse))

  print(''--''*30)

  [Out]:

  ```


  ![../images/478390_1_En_7_Chapter/478390_1_En_7_Figk_HTML.jpg](img/478390_1_En_7_Figk_HTML.jpg)


  ```

  [In]: cluster_number = range(2,10)

  [In]: plt.scatter(cluster_number,errors)

  [In]: plt.xlabel(''clusters'')

  [In]: plt.ylabel(''WSSE'')

  [In]: plt.show()

  [Out]:

  ```


  ![../images/478390_1_En_7_Chapter/478390_1_En_7_Fig4_HTML.jpg](img/478390_1_En_7_Fig4_HTML.jpg)


  **图 7-4** 肘部图


  在我们的案例中，图表中形成了多个肘部。因此，我们可以选择 `4`、`6` 或 `8` 作为 `k` 的值。需要记住的一点是，聚类没有唯一正确的答案。基于所使用的技术，同一数据可以产生不同的聚类，因为每种技术的初始化点都不同。我们继续选择
  `k` 的值为 `6`。


