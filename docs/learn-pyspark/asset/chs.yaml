  赤池信息准则（AIC）是一个评估参数，用于比较同一数据集上多个模型的相对性能质量。AIC 主要用于在给定数据集上从多个模型中进行选择。AIC 值越小，表明模型质量越好。AIC
  试图在模型的方差和偏差之间取得平衡。因此，它同时处理了过拟合和欠拟合的可能性。AIC 分数最低的模型优于其他模型。


