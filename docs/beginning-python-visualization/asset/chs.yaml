  \ `ImageFont.truetype(fontname, size)` 可能在一个系统上有效，而在另一个系统上无效。为了解决这个问题，我使用了 `findfont()`\
  \ 函数，它是 *matplotlib.font_manager* 模块的一部分。`findfont()` 函数返回一个字符串，其中包含与请求字体最匹配的字体位置。\n\
  \n以下脚本使用 `findfont()` 函数以 Vera 字体注释文本：\n\n```\n>>> from matplotlib import font_manager\n\
  >>> from PIL import Image, ImageDraw, ImageFont\n>>> img = Image.new('L', (250,\
  \ 100), 255)\n>>> draw = ImageDraw.Draw(img)\n>>> font_str = font_manager.findfont('Vera')\n\
  >>> font_str\n```\n\n```\n'C:\\\\Python33\\\\lib\\\\site-packages\\\\matplotlib\\\
  \\mpl-data\\\\fonts\\\\ttf\\\\Vera.ttf'\n```\n\n```\n>>> ttf = ImageFont.truetype(font_str,\
  \ 54)\n>>> s = 'ABCabc'\n>>> (w, h) = draw.textsize(s, font=ttf)\n>>> draw.text(((250-w)/2,\
  \ (100-h)/2), s, font=ttf)\n>>> img.show()\n```\n\n前两条语句从 *Pillow* 以及 *matplotlib*\
  \ 的字体管理器中导入相应的对象。然后我创建了一个大小为 `(250, 100)` 的单波段图像，接着实例化一个附加到该图像上的 `ImageDraw` 对象。\n\
  \n接下来，我使用 *matplotlib* 的 `findfont()` 函数来查找最接近名为 Vera 的字体。字体的路径存储在字符串 `font_str`\
  \ 中。之后，我创建了一个名为 `ttf` 的 `ImageFont` 对象，并使用该字体对象来渲染文本。然后我计算文本的大小，并将其渲染在白色背景的中央，如\
  \ 图 9-3 所示。\n\n![9781484200537_Fig09-03.jpg](img/9781484200537_Fig09-03.jpg)\n\n\
  图 9-3. 字体渲染\n\n![Image](img/sq.jpg) **注意** 要使用字体，你必须在调用 `text()` 和 `textsize()`\
  \ 这两个函数时提供 `font` 参数。\n\n### 示例：缩略图索引图像\n\n在之前的示例（清单 9-2）中，我们创建了一个图像目录。虽然该目录非常有用，但它没有显示这些图像的内容。也许一个更有用的目录是一个由图像拼贴而成的图集，并附有显示每个图像文件名的文本注释（参见\
  \ 清单 9-7）。\n\n***清单 9-7***. 一个缩略图索引图像\n\n```\n#### thumbnail index\nimport os\n\
  from PIL import Image, ImageDraw\n\ndef thumbnail_index(dirpath):\n    \"\"\"从 dirpath\
  \ 中的图像创建缩略图索引。\"\"\"\n\n    num_images = 5\n    thumb_size = (128, 96)\n    cat_size\
  \ = (num_images*thumb_size[0], num_images*thumb_size[1])\n\n    fn_index = 0   \
  \         # 文件名索引\n    img_index = 0           # 图像索引\n\n    # 遍历目录中的所有图片\n    for\
  \ file in os.listdir(dirpath):\n        # 获取文件的路径名\n        pathname = os.path.join(dirpath,\
  \ file)\n\n        try:    # 这是一个图像文件吗？\n\n            # 打开图像文件\n            img\
  \ = Image.open(pathname)\n\n        except IOError:\n            print(file, \"\
  不是一个图像文件\")\n            continue\n\n        # 创建缩略图\n        img.thumbnail((thumb_size),\
  \ Image.ANTIALIAS)\n        draw = ImageDraw.Draw(img)\n        draw.text((2, 2),\
  \ file)\n\n        # 是否需要创建新的目录图像？\n        if img_index == 0:\n            thumbs_img\
  \ = Image.new('RGB', cat_size)\n\n        # 计算此图像的位置\n        x = img_index % num_images\n\
  \        y = img_index // num_images\n\n        # 粘贴缩略图\n        thumbs_img.paste(img,\
  \ (x*thumb_size[0], y*thumb_size[1]))\n\n        # 递增图像索引\n        img_index +=\
  \ 1\n\n        # 是否已达到目录图像的末尾？\n        if img_index==num_images**2:\n         \
  \   img_index = 0\n            thumbs_img.save('%s-%03d.cat.jpg' % (dirpath, fn_index))\n\
  \            fn_index += 1\n\n    # 保存最后一个目录文件\n    if img_index:\n        thumbs_img.save('%s-%03d.cat.jpg'\
  \ % (dirpath, fn_index))\n```\n\n函数 `thumbnail_index()` 接受一个目录并生成一个缩略图索引图像。图 9-4\
  \ 展示了在我女儿特别喜欢的一组图像上运行该函数的结果。\n\n![9781484200537_Fig09-04.jpg](img/9781484200537_Fig09-04.jpg)\n\
  \n图 9-4. 一个缩略图索引图像\n\n出于本示例的目的，我决定不使用 `os.walk()` 来遍历目录列表。相反，我使用了 `os.listdir()`。我定义了两个参数：`num_images`，它保存\
  \ x 轴或 y 轴上的图像数量；以及 `thumb_size`，它保存缩略图的宽度和高度。接下来，我组成了请求目录中所有文件的列表。对于每个文件，脚本尝试将其作为图像文件打开。如果文件确实是图像文件，则创建该图像的缩略图并将其粘贴到索引图像上。此外，缩略图会在左上角用文件名进行注释。使用了一些索引来确定图像在缩略图索引图像中的确切位置，以及在当前索引图像填满后创建新的缩略图索引图像。\n\
