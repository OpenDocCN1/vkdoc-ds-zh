  \n## 数学游戏\n\n## 可视化前的数据预处理\n\n数学是数据可视化的基本工具。Python 提供了出色的数学支持，使其成为在可视化之前执行分析的理想开发环境。Python\
  \ 的交互性使得操作数据和观察中间结果变得容易。Python 还使得修改结果并快速绘图变得简单。我喜欢使用 Python 进行数据可视化的另一个原因是：有大量流行、免费、成熟的数值包可用。最后，Python\
  \ 结构清晰，允许开发生产级代码来生成高质量报告。\n\n在本章中，我们将探索 Python 的数学能力，包括其内置模块`math`、`cmath`、`random`、`decimal`和`fractions`。我们还将介绍`NumPy`，这是一个我们将在后续章节中广泛使用的优秀包（我们在前面的章节中也使用过）。`NumPy`提供了强大的\
  \ n 维数组、向量和矩阵运算、线性代数以及更多功能。\n\n## 模块`math`和`cmath`\n\nPython 提供了两种数学模块：`math`和`cmath`。`math`模块包含大多数编程语言通用的函数，本质上使用了\
  \ C 语言的数学函数调用。`math`模块中的函数返回浮点数。如果参数不合适，将引发错误：\n\n```\n>>> import math\n>>> math.sqrt(-1)\n\
  ```\n\n```\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
  ValueError: math domain error\n```\n\n模块`cmath`返回复数结果：\n\n```\n>>> import cmath\n\
  >>> cmath.sqrt(-1)\n```\n\n```\n1j\n```\n\nPython 通过内置的`complex`数据类型原生支持复数。这可能是\
  \ Python 作为数值计算平台受欢迎的一个促成因素。\n\n\n\n复数虚部的表示有一个尾随的“j”，如前面的示例所示。大多数算术运算和函数调用都可以对复数执行。如果你不需要复数支持，建议使用`math`而不是`cmath`。首先，如果函数的参数超出定义域，它会提供有价值的异常信息，如前所示。其次，`cmath`总是返回复数结果，即使结果可以表示为非复数，在这种情况下虚部值为零。最后，有些函数仅在`math`模块中可用，如表\
  \ 7-1 所列。\n\n表 7-1. 仅在`math`模块中可用的函数\n\n| 函数 | 描述 | 示例 |\n| --- | --- | --- |\n\
  | `atan2(y, x)` | 返回`y/x`的反正切，考虑符号和除以零的情况。 | `atan2(2, 0)`返回 1.5707963267948966\
  \ (π/2)。`atan2(-1, -1)`返回−2.356194490192345 (−3π/4)。 |\n| `ceil(x)` | 返回大于或等于`x`的最小整数。\
