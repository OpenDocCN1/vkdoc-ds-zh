  \ Python 语言的人可能会选择这里介绍的最后一种方法；它更清晰、更优雅。\n\n### 集合\n\n我们目前要介绍的最后一个数据结构是*集合*。集合是***唯一***项的序列。要创建集合，请使用\
  \ `set()` 函数：\n\n```python\n>>> set(['split', 'second'])\n```\n\n```python\n{'split',\
