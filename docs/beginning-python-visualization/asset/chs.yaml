  \ |\n\n表 7-1 中列出的一些函数在 Python 3.x 和 Python 2.x 中的行为不同。在 Python 2.x 中，返回类型通常是`float`（即使实际值是整数，也表示为浮点数）。在\
  \ Python 3.x 中，如果可能返回整数，则返回值为`int`类型。\n\n例如，在 Python 2.7.6 中，`ceil()`的返回类型是`float`：\n\
  \n```\n>>> from math import ceil\n>>> ceil(2.5)\n```\n```\n3.0\n```\n```\n>>> type(ceil(2.5))\n\
  ```\n```\n<type 'float'>\n```\n\n而在 Python 3.3.5 中，`ceil()`的返回值是`int`：\n\n```\n\
  >>> from math import ceil\n>>> ceil(2.5)\n```\n```\n3\n```\n```\n>>> type(ceil(2.5))\n\
