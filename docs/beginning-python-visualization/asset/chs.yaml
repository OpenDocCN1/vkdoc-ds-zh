  \n## 收集数据\n\n\n\n### 我们花费大量时间记录和分析数据。数据的存储格式取决于采集工具、数据性质（例如图片与采样模拟数据）、后续处理数据的应用程序以及个人偏好。数据文件大小不一：有些文件非常大，另一些则较小但数量众多。数据组织方式又增加了一层复杂性。文件可以按日期存储在目录中、集中存放在一个大目录或数据库中，或采用完全不同的方案。通常，数据文件的数量或每个文件的数据量过大，无法通过编辑器或查看器快速浏览。我们需要借助方法和工具来查找数据并进行分析，从而得出有意义的结果。您很快就会发现，Python\
  \ 提供了完成这一任务所需的所有工具。\n\n## 案例研究：GPS 数据\n\n您刚收到一个 USB GPS 接收器作为生日礼物！您想分析 GPS 数据，了解自己超速的频率以及在交通拥堵中花费的时间。您希望追踪一年甚至更长时间的数据。于是您决定用\
  \ Python 记录、分析和可视化 GPS 数据。\n\n一些硬件背景知识：大多数 USB GPS 接收器表现为串口（蓝牙 GPS 设备也是如此）。这意味着一旦连接\
  \ GPS（假设安装正确），读取 GPS 数据就像打开与 GPS 关联的 COM 端口并读取数值一样简单。GPS 值通常是纯文本值：数字和文本。当然，如果您计划从汽车上记录\
  \ GPS 数据，将其连接到笔记本电脑而非台式机会更合理。\n\n![图片](img/sq.jpg) **注意** 如果您希望亲自输入命令并查看结果，以跟随本章剩余内容，建议先参考第\
  \ 2 章在系统上安装 Python。不过，这不是必须的，您也可以先通读本章以了解本书及其目的。事实上，我鼓励您在积累更多 Python 经验后，再回到本章重新阅读。\n\
  \n为了能够从 Python 访问串口，我们将使用 `pySerial` 模块。顾名思义，`pySerial` 允许无缝访问串口（`pySerial` 模块需要下载并安装；详见第\
  \ 2 章）。要使用 `pySerial`，我们必须先将模块读入内存，即使用 `import` 命令导入它。如果一切顺利，我们将再次看到 Python 提示符。\n\
  \n```\n>>> import serial\n```\n\n### 扫描串口\n\n接下来，我们需要找到串口参数：波特率和端口号。波特率是 GPS 的参数，因此最好查阅\
  \ GPS 手册（如果找不到此信息，请别担心，我稍后会讨论如何“猜测”它）。端口号由您的操作系统决定。如果您不确定如何查找端口号，或者插拔 GPS 时端口号不断变化，可以使用以下代码来识别活动的串口（参见清单\
  \ 1-1a）。\n\n***清单 1-1a***。扫描串口（Linux）\n\n```\n>>> from serial.tools.list_ports import\
  \ comports\n>>> comports()\n```\n\n```\n[('/dev/ttyS3', 'ttyS3', 'n/a'), ('/dev/ttyS2',\
  \ 'ttyS2', 'n/a'), ('/dev/ttyS1',\n'ttyS1', 'n/a'), ('/dev/ttyS0', 'ttyS0', 'n/a'),\
  \ ('/dev/ttyUSB0',\n'公司名称和设备信息应在此处', 'USB VID:PID=xxxx:yyyy')]\n```\n\n清单 1-1a 告诉我们有四个名为\
  \ `/dev/ttySn` 的串口，其中 `n` 是小于或等于 3 的整数。还有一个名为 `/dev/ttyUSB0` 的端口，这正是我要找的端口。\n\n\
  在 Windows 中，代码略有不同。原因在于：`comport()` 函数返回的是一个*生成器表达式*，而不是可用端口的列表（您将在第 3 章中了解更多关于生成器表达式的知识）。清单\
