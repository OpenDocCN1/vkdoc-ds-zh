  \ 8 的列表作为参数传递。\n\n从某种意义上说，你已经接触过集合了：字典中的键构成一个集合，因为它们是唯一的项。\n\n集合操作与你之前看到的序列略有不同。它们源自数学运算，包括交集、并集和差集等：\n\
  \n```python\n>>> S1 = set(['split', 'second'])\n>>> S2 = set(['split', 8])\n>>>\
  \ S1 | S2\n```\n\n```python\n{8, 'split', 'second'}\n```\n\n```python\n>>> s1.union(S2)\n\
  ```\n\n```python\n{8, 'split', 'second'}\n```\n\n```python\n>>> S1 & S2\n```\n\n\
  ```python\n{'split'}\n```\n\n```python\n>>> S1 - S2\n```\n\n```python\n{'second'}\n\
