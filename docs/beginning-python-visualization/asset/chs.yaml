  \ | Windows | 具备本章前面描述的所有功能及更多功能。缺点：仅适用于 Windows。Linux 用户抱歉了。 |\n| SciTE, Scintilla\
  \ Text Editor `http://www.scintilla.org/SciTE.html` | Windows, X | 一款非常优秀的文本编辑器，尤其适合同时在\
  \ Windows 和 X 环境下开发：一个编辑器可用于两个平台。它在允许打开的文件数量和宏录制功能方面有所欠缺。 |\n| GNU Emacs `http://www.gnu.org/software/emacs/`\
  \ | Windows, Linux, X, Cygwin | 功能非常丰富的编辑器。可在大多数平台上运行，包括基于文本的 CLI（Linux）、X、Windows\
  \ 以及 Cygwin。如果你是 Emacs 新手，需要一定的学习曲线。 |\n| Vim `http://www.vim.org` | Windows, Linux,\
  \ X, Mac OS | 功能非常丰富的编辑器，可在大多数平台上运行；具备前面描述的大部分功能及更多功能（例如，十六进制编辑器）。 |\n| GNU Nano\
  \ `http://www.nano-editor.org/` | Linux, Cygwin, Windows | 基于文本（非图形化）的轻量级编辑器。缺少某些功能，但在体积和性能方面有所弥补。是通过\
  \ telnet 或 SSH 连接编写代码时的好选择。 |\n\n### 二进制编辑器\n\n有时，编辑二进制文件也很有用（关于二进制文件的讨论，请参见第 10\
  \ 章）。二进制文件通常无法使用常规编辑器查看或编辑（Vim 可能是个例外）。`Hexedit` (`http://rigaux.org/hexedit.html`)\
  \ 是一个允许编辑二进制文件的有用工具。它显示十六进制值及其 ASCII 表示（如果可用），并允许编辑十六进制和 ASCII 值。我不建议使用 `hexedit`\
  \ 编写二进制文件，而是用它来调整或修改二进制文件。`Hexedit` 在大多数 Linux 发行版以及 Cygwin 中均可使用。要调用 `hexedit`，请执行以下命令：\n\
  \n```\n$ hexedit filename\n```\n\n在 `hexedit` 中，按 `F1` 键将调出帮助屏幕。要退出 `hexedit` 而不保存，请按\
  \ `Ctrl+C`。\n\n### 电子表格\n\n电子表格是数据处理和可视化的绝佳工具。用户能够轻松地从各种文件格式导入数据、整理数据并生成图表，这一点非常出色。\n\
  \n逗号分隔值（CSV，有时也称为字符分隔值）是一种极其有用的文件格式，几乎所有电子表格应用程序都支持它。CSV 文件广泛用于数据分析和可视化，能够轻松编辑它们是电子表格的一大优势。\n\
  \n大多数电子表格都配备了额外的工具，如线性回归、统计计算、财务函数等。更有经验的用户可能能够使用宏来自动化任务或在输入新数据时更新结果。由于这些特性，电子表格无疑会补充你的开发环境。\n\
  \n然而，电子表格并非数据处理的最佳选择。它们是为交互式点击（GUI）用户设计的，这使得它们在脚本自动化方面不太自然。它们能处理的数据量也有限——通常你必须在电子表格中打开整个文件，这对于大文件来说可能是个问题。最后，它们缺乏内在的文档记录——很难捕捉和记录你为得到结果所采取的步骤。\n\
  \n因此，本书不会使用电子表格；但是，在适当的时候我会提及它们的用法。例如，了解如何向电子表格导出数据和从电子表格导入数据是很有价值的。\n\n可以考虑的两款开源电子表格应用程序是：\n\
  \n*   Gnumeric (`http://www.gnumeric.org/`)，一款免费的电子表格软件。\n*   Calc (`https://www.libreoffice.org/`)\
  \ 是 LibreOffice 项目的一部分，可在大多数平台上使用。\n\n### 文字处理器\n\n最后，编写报告或演示文稿来展示你的工作成果可能很有价值。你可能还想以\
  \ HTML 或 PDF 格式发布结果。同样，有几款开源应用程序可用，最值得注意的是：\n\n*   AbiWord (`http://www.abisource.com/`)\
  \ 是一款文字处理应用程序，适用于 Windows、GNU/Linux 和 Mac OS。\n*   Writer (`https://www.libreoffice.org/`)\
  \ 是 LibreOffice 项目的一部分，可在大多数平台上使用。\n\n### 图像查看器\n\n如果你计划执行图像处理任务，则需要一个图像查看工具。即使你并非真正执行图像处理任务——例如，你只是以\
  \ PNG 和 JPG 等已知文件格式生成图表——图像查看工具仍然是必需的。\n\nWindows 内置了对大多数流行图像格式的支持。\n\n\n\n在 Linux\
  \ 上，GNOME 和 KDE 桌面环境都自带内置图像查看器。此外，在 Windows 和 Linux 上都可以使用网页浏览器打开图像，因为浏览器也支持大多数图像格式。换句话说，你不需要安装任何东西。使用你的操作系统自带的图像查看器或网页浏览器即可。\n\
  \n### 版本控制系统\n\n版本控制系统（VCS，也称为软件配置管理 SCM）能够管理一个或多个文档的多个修订版本，并具备完整的历史记录、标记和日期功能。大多数软件包还支持多个开发者同时处理同一个文件。VCS\
  \ 使你能够回退到之前可用的版本，检查当前版本与旧版本之间的差异，甚至可以根据日期查看文档的某个版本。它可能保存诸如谁编辑了文件或分配给文档以标记其状态的标签等信息。\n\
  \nVCS 越来越被认为是开发团队必备的工具。但即使是单个开发者也能从使用 VCS 中受益。这些管理系统越来越受欢迎，原因很充分：它们节省时间并有助于管理软件项目。因此，它们是增强开发环境的好软件。使用\
  \ VCS 的缺点在于它并非易于掌握，或许应该等到你对编程环境感到得心应手之后再考虑。为了帮助抵消 VCS 带来的复杂性，一些系统也提供了图形用户界面前端。\n\
  \n#### 使用版本控制系统\n\n简而言之，当你使用版本控制系统时，遵循四个基本步骤：\n\n1.  检出项目：创建文档最新版本的本地副本。\n2.  更新本地副本：编辑源代码、修复错误、添加功能。\n\
  3.  审查更改：确保修改了正确的文件。\n4.  提交更改：将你所做的更改保存到版本控制仓库中。\n\n当你从 VCS 仓库中检出文档时，系统会确保你拥有最新的版本以供使用。这通常只做一次；之后，你更新本地副本。然后修改文档，一旦对结果满意，就审查更改。可以通过对你拥有的文件与仓库中的副本执行`diff`来审查更改。然后提交你的更改（也称为检入），并可能添加更改的描述。后续的修改遵循步骤\
  \ 2 到 4。\n\n版本控制系统会在发生冲突时通知你。例如，假设你检出了文档的版本 1，但当你想要提交更改时，另一个开发者已经检入了他的文档版本：系统会提醒你可能存在冲突，因为你试图更新一个现在是版本\
  \ 2 的文档，而你之前处理的是版本 1。\n\n系统还会维护项目的完整历史记录。因此，即使你是项目中唯一的工作人员，回退到项目先前版本的能力就像检出旧版本一样简单。大多数系统允许你根据日期、修订版本甚至是你之前提供的标签来检出文档。由于系统维护了如此完整的历史记录，大多数开发者认为你应该尽可能频繁地提交更改——你不会对“好的”发布版本产生负面影响。\n\
  \n最后一点：如果可以，选择使用文本文件而不是二进制文件。大多数 VCS 系统支持对文本文件执行`diff`，这是一个非常有价值的工具。对于文件的二进制版本（例如，可执行文件），`diff`除了说明当前版本与仓库中的版本不同之外，几乎提供不了什么信息。\n\
  \n以下是我经常使用的一组命令，用于处理我正在持续编辑的本地副本，一旦我完成对本地副本的编辑。\n\n使用 Mercurial，我执行以下命令：\n\n```\n\
  $ hg status\n$ hg commit filename\n$ hg push\n$ hg update\n```\n\n第一个命令检查项目的状态：哪些文件被修改了。第二个和第三个命令检入本地副本并更新仓库（Mercurial\
  \ 存储文件的地方）。最后一个命令确保我的本地目录中有项目的最新版本。\n\n在 CVS 中，我遵循一组类似的命令：\n\n```\n$ cvs diff\n\
  $ cvs commit\n$ cvs update\n```\n\n以下是一些开源 VCS 软件应用程序的链接：\n\n*   CVS（`http://www.nongnu.org/cvs/`）是一个广泛流行的系统，拥有包括基于\
  \ Web 的在内的多个图形用户界面。\n*   Subversion（`http://subversion.tigris.org/`）是另一个在大多数平台上广泛流行的系统。\n\
  *   Mercurial（`http://mercurial.selenic.com/`）是一个为分布式项目设计的轻量级 VCS 包。\n*   Git（`http://git-scm.com/`）。\n\
  \n#### 示例：本书的目录结构\n\n版本控制系统理论上听起来不错，但在实践中如何运作呢？以本书为例：在写作时，我使用一个 VCS 系统来控制每一章的文档、图像、源代码和数据。我组织了目录结构，使得每一章都有一个名为`ChXX`的目录，其中\
  \ X 是章节编号。在每个章节对应的目录中，我添加了四个额外的目录，分别命名为`doc`、`data`、`images`和`src`。我将写作内容放在`doc`目录中，数据文件放在`data`目录中，图像（例如嵌入在文档中的那些）放在`images`目录中，源代码放在`src`目录中。\n\
  \n```\nBook\n    Ch1\n        data\n        images\n        src\n        doc\n \
  \   Ch2\n        data\n        images\n        src\n        doc\n    ...\n```\n\n\
  这种目录结构的一个附带好处是，它可以帮助你设想项目的外观。如果你在第一段代码（在我的例子中是第一章）中意识到某些重要内容，但它实际上不属于那里，那么只需将这些想法和代码转储到相关目录中，以备将来处理。\n\
  \n![Image](img/sq.jpg) **提示** 这种目录结构在源代码清单中也很明显。由于源代码位于`ChXX/src`目录中，数据文件位于`ChXX/data`目录中，因此到`data`目录的相对路径是`../data`。类似地，到`images`目录的相对路径是`../images`。\n\
  \n我决定为本书使用 VCS 系统的原因很简单。因为有多位编辑在审阅每个文档，这种情况非常类似于一个文档有多个开发者。在项目的任何阶段，我都会将不同修订版本的某些文档交给编辑，重新审阅其他文档，并将另一个版本发送给审阅者。有些编辑会回复我已经更新过的修订版本，因此我必须知道他们编辑的是哪个文档。使用版本控制系统来管理文档的所有修订版本要容易得多。我可以立即查看每个文件的状态；如果需要，我可以恢复到旧版本，并且我立即知道本地目录中当前拥有的是哪个版本。\n\
  \n## 许可协议\n\n本章描述的大多数软件都是开源且免费的（Windows 和其他商业软件包，如 MATLAB 和 VMware，显然是例外）。也就是说，对于开源软件的使用存在一些限制，特别是如果你打算分发你的应用程序。存在多种软件许可协议，我敦促你仔细阅读每一条。这同样适用于商业软件：确保你阅读了许可协议。\n\
  \n以下是本章描述的一些软件的许可协议列表。\n\n\n\n#### 排版后的内容\n\n这份内容既不完整也不全面，且许可证可能随时间变化，因此请务必查阅最新的许可证文档：\n\
  \n- GNU 许可证，包括 GPL 和 LGPL：这些许可证涵盖了本章描述的大量软件包：`http://www.gnu.org/licenses/licenses.html`。\n\
  - Linux 发行版许可证：请参考您所选发行版的相应网页。\n- Cygwin：请参考 Cygwin 中安装的许可证文档，通常位于 `c:\\cygwin\\\
  usr\\share\\doc\\common-licenses` 或 `c:\\cygwin64\\usr\\share\\doc\\common-licenses`，以及\
  \ `http://cygwin.com/licensing.html`。\n- VMware：`http://www.vmware.com/`。\n- Python：`https://docs.python.org/2/license.html`。\n\
  - Enthought (EPD)：`https://www.enthought.com/`。\n- IPython：`http://ipython.scipy.org/`。\n\
  - Matplotlib：`http://matplotlib.org/users/license.html`。\n- SciPy：`http://www.scipy.org/scipylib/license.html`。\n\
  - NumPy：`http://docs.scipy.org/doc/numpy/license.html`。\n- Pillow (Python Imaging\
  \ Library)：`http://pillow.readthedocs.org/en/latest/about.html`。\n- PySerial：`http://pyserial.sourceforge.net/appendix.html`。\n\
  - Scintilla 和 SciTE：`http://scintilla.sourceforge.net/License.txt`。\n- Mercurial：`http://mercurial.selenic.com/wiki/License`。\n\
  - Subversion：`http://subversion.tigris.org/license-1.html`。\n\n## 最终说明与参考资料\n\n\
  至此，您应该拥有一个完整的开发环境，它提供了该领域所需的所有工具。请尝试使用您的环境并熟悉它；在接下来的章节中，您将频繁使用它。\n\n有大量可用的 Python\
  \ 软件包，并且每天都有新的软件包被编写出来。关于 Python 软件包的两个良好信息来源是：\n\n- PyPI，Python 包索引，`https://pypi.python.org/pypi`。这是一个庞大的\
  \ Python 软件包仓库。\n- 由 Christoph Gohlke 维护的非官方 Windows Python 扩展包二进制文件，`http://www.lfd.uci.edu/~gohlke/pythonlibs/`。该网站提供了许多以二进制安装文件形式讨论的软件包。\n\
  \n"
