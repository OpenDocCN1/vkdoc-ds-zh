  \ 和 `textsize()` 进行文本注释\n\n### 字体\n\n也可以将其他字体与 `text()` 函数一起使用。为此，首先需要创建一个 `ImageFont`\
  \ 对象。`ImageFont` 对象是 *Pillow* 的一部分；要导入它，请执行 `from PIL import ImageFont`。导入 `ImageFont`\
  \ 后，可以通过调用 `ImageFont.truetype(fontname, size)` 来使用字体。返回的 `ImageFont` 对象可以通过 `font`\
