  ## 关于作者


  ![9781484200537_unFM-01.jpg](img/9781484200537_unFM-01.jpg)


  **沙伊·瓦因加斯特**自 1993 年起担任工程师、工程经理及工程总监。他曾在国防工业和医疗器械行业工作，深度参与数据处理与可视化工作。他拥有多项专利。


  ## 关于技术审校者


  ![9781484200537_unFM-02.jpg](img/9781484200537_unFM-02.jpg)


  莉·申尼曼是密歇根州立大学 BEACON 进化研究中心的研究生助理。她多年来一直帮助非营利组织开发注重效率的交互式应用程序。申尼曼拥有德克萨斯农工大学和德克萨斯大学泰勒分校的学位。她在
