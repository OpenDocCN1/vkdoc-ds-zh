  \ 返回 `'file.ext'`。 |\n| `os.path.dirname(s)` | 返回路径的目录名。 | `os.path.dirname('/home/user/file.ext')`\
  \ 返回 `'/home/user'`。 |\n| `os.path.exists(s)` | 如果 `s` 指定的路径或文件存在，则返回 `True`。 |\
  \ `os.path.exists('/home/user')` 返回 `True`。 |\n| `os.path.getatime(s)` | 返回文件的最后访问时间。\
  \ | `time.ctime(os.path.getatime('/home/user/file.ext'))` 打印访问时间（`ctime()` 是 `time`\
