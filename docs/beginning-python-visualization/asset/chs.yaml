  \ 收集 GPS 数据，在可视化之前分析数据，并绘制结果。\n\n然而，在开始之前，你应该了解一些关于 Python 的基础知识。Python 是一种*解释型*编程语言。这意味着每条命令都是先读取再执行。这与编译型编程语言形成对比，后者会先评估（编译）整个程序，然后再执行。解释型编程语言的一个重要特性是易于交互式运行。也就是说，你可以执行一条命令，检查结果，再执行更多命令，检查更多结果，以此类推。交互式运行\
  \ Python 的能力非常有用，它让你可以在学习过程中随时检查相关主题。\n\n也可以以非交互方式在 Python 中运行程序，这些程序被称为*脚本*，有几种方法可以实现。你可以通过在交互式\
  \ Python 提示符下发出命令`exec(open('scriptname.py').read())`来运行脚本。或者，你可以在操作系统的命令行界面中输入`python\
