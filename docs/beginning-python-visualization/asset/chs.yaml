  \  for re in range(res):\n            z = 0\n            # 缩放以显示曼德勃罗分形的“有趣”部分\n\
  \            c = (re*2/res-1.5)+1j*(im*2/res-1)\n            for k in range(iters):\n\
  \                z = z**2+c\n                if abs(z)>2:\n                    img.putpixel((re,\
  \ im), 255-k*255/iters)\n                    break\n\n    # 创建均匀分布的灰度级\n    img\
  \ = ImageOps.equalize(img)\n\n    # 保存到文件\n    img.save('../images/mandelbrot_%04d.png'\
  \ % iters, dpi=(150,150))\n\nlast_path = os.getcwd()\n\n#### 正确处理 Linux/Mac 和 Windows\n\
