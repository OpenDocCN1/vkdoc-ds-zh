  \ |\n| `os.path.getmtime(s)` | 返回文件的最后修改时间。 | 类似于 `os.path.getatime()` 的示例。 |\n\
  | `os.path.getsize(s)` | 返回文件大小（以字节为单位）。 | `os.path.getsize('file.ext')` 返回文件 `file.txt`\
  \ 的大小（以字节为单位）。 |\n| `os.path.isabs(s)` | 如果 `s` 指定的路径是绝对路径，则返回 `True`。 | `os.path.isabs('file.ext')`\
  \ 返回 `False`。`os.path.isabs('/home/user/file.ext')` 返回 `True`。 |\n| `os.path.isdir(s)`\
  \ | 如果 `s` 是一个目录，则返回 `True`。 | `os.path.isdir('/home')` 返回 `True`。 |\n| `os.path.isfile(s)`\
  \ | 如果 `s` 是一个文件，则返回 `True`。 | `os.path.isfile('file.ext')` 返回 `True`。 |\n| `os.path.join(base,\
  \ seq)` | 连接两个或多个路径，根据需要添加斜杠。 | `os.path.join('/home/user', 'file.ext')` 返回 `'/home/user/file.ext'`。`os.path.join('/home',\
  \ 'user', 'file.ext')` 返回 `'/home/user/file.ext'`。 |\n| `os.path.split(s)` | 分割路径名，返回路径和文件名。\
  \ | `os.path.split('/home/user/file.ext')` 返回 `('/home/user', 'file.ext')`。 |\n\
  | `os.path.splitext(s)` | 分割路径名，返回扩展名（包括点号）。 | `os.path.splitext('/home/user/file.ext')`\
  \ 返回 `('/home/user/file', '.ext')`。 |\n\n### `shutil` 模块\n\n`shutil` 模块提供了用于复制、移动和重命名文件的高级函数。其中，我们将探讨以下函数：`copy(src,\
  \ dest)`、`copytree(src, dest)`、`rmtree(path)` 和 `move(src, dst)`。有关该模块的完整说明，请参阅\
  \ `https://docs.python.org/3.3/library/shutil.html`。\n\n我假设当前目录中存在一个名为 `file1.txt`\
  \ 的文件。如果你的目录中没有这个文件，如果你想跟着操作，可以创建一个。\n\n首先，让我们创建一个包含子目录的目录，并将 `file1.txt` 复制到新创建的目录中：\n\
  \n```\n>>> import shutil\n>>> from os import makedirs\n>>> from glob import glob\n\
  >>> makedirs('dir1/dir2/dir3/dir4')\n>>> shutil.copy('file1.txt', 'dir1/dir2/dir3/dir4')\n\
  ```\n\n```\n'dir1/dir2/dir3/dir4/file1.txt'\n```\n\n```\n>>> shutil.copy('file1.txt',\
  \ 'dir1/dir2/dir3/dir4/file2.txt')\n```\n\n```\n'dir1/dir2/dir3/dir4/file2.txt'\n\
  ```\n\n```\n>>> glob('dir1/dir2/dir3/dir4/*')\n```\n\n```\n['dir1/dir2/dir3/dir4/file2.txt',\
  \ 'dir1/dir2/dir3/dir4/file1.txt']\n```\n\n首先，我导入了一些模块和函数：`shutil`、`os` 和 `glob`。然后我创建了一个目录（及其父目录）：`dir1/dir2/dir3/dir4`。我以两种方式使用了\
  \ `copy()` 函数：首先，将文件 `file1.txt` 复制到新创建的目录；其次，将文件 `file1.txt` 以不同的名称 `file2.txt`\
  \ 复制到同一个目录：\n\n```\n>>> shutil.move('dir1/dir2/dir3/dir4/file2.txt', 'dir1/dir2')\n\
  ```\n\n```\n'dir1/dir2/file2.txt'\n```\n\n```\n>>> glob('dir1/dir2/*')\n```\n\n\
  ```\n['dir1/dir2/dir3', 'dir1/dir2/file2.txt']\n```\n\n```\n>>> glob('dir1/dir2/dir3/dir4/*')\n\
  ```\n\n```\n['dir1/dir2/dir3/dir4/file1.txt']\n```\n\n我已将文件 `file2.txt` 移动到目录 `dir1/dir2`。`glob()`\
  \ 的结果确认了这次移动。\n\n接下来，我将 `dir1` 下的整个目录分支复制到一个名为 `Dir_1` 的新目录中：\n\n```\n>>> shutil.copytree('dir1',\
  \ 'Dir_1')\n```\n\n```\n'Dir_1'\n```\n\n```\n>>> glob('Dir_1/dir2/dir3/dir4/*')\n\
  ```\n\n```\n['Dir_1/dir2/dir3/dir4/file1.txt']\n```\n\n最后，是时候进行清理了——我删除了这两个目录及其子目录：\n\
  \n```\n>>> shutil.rmtree('dir1')\n>>> shutil.rmtree('Dir_1')\n>>> glob('dir1')\n\
  ```\n\n```\n[]\n```\n\n### 文件压缩\n\n文件压缩是用更少的字节来表示文件的过程。压缩通常分为两类：有损压缩和无损压缩。在有损压缩中，压缩后的数据与原始数据不完全相同；在减小文件大小的过程中会丢失数据（希望丢失的是不重要的信息）。无损压缩使用巧妙的方案以更高效的方式表示数据。例如，与其将一百个相同的值写入文件，无损压缩方案可能是写入值\
  \ 100（表示计数），然后写入重复的值。\n\nPython 为我们提供了几个压缩和归档模块（参见表 10-5）。我们使用归档模块来创建压缩文件，但使用压缩模块来处理压缩本身。我们可以对文件以及字符串进行压缩。归档和压缩之间的区别有些模糊，因为某些模块同时执行压缩和归档。包的名称也是导入名称；因此，要使用\
  \ `gzip`，请执行 `import gzip`。\n\n表 10-5. Python 标准库压缩和归档模块\n\n| 模块名称 | 功能 | 文档链接 |\n\
  | --- | --- | --- |\n| `bz2` | 无损压缩 | `https://docs.python.org/3.3/library/bz2.html`\
  \ |\n| `gzip` | 无损压缩 | `https://docs.python.org/3.3/library/gzip.html` |\n| `zlib`\
  \ | 无损压缩 | `https://docs.python.org/3.3/library/zlib.html` `http://www.zlib.net/`\
  \ |\n| `tarfile` | 归档 | `https://docs.python.org/3.3/library/tarfile.html` |\n|\
  \ `zipfile` | 归档和压缩 | `https://docs.python.org/3.3/library/zipfile.html` |\n\n不同模块在压缩率、性能和流行度方面存在一些差异。但是，它们都易于使用并能提供出色的结果。在本节中，我们将探讨\
  \ `tarfile` 模块。\n\n### 示例：一个压缩的 tar 文件\n\n在开源社区中，经常可以看到以 `.tar.gz` 或 `.tar.bz2`\
  \ 扩展名分发的文件。这些是压缩的 `tar` 文件；tar 代表磁带归档（tape archive），但实际上并不需要磁带。清单 10-12 中的示例创建了几个文件，将它们归档，然后从归档中检索它们。\n\
  \n***清单 10-12***.\n\n\n\n#### 创建归档文件\n\n```python\nimport tarfile, glob, os.path\n\
  \n#### 创建一些文件\nfor i in range(5):\n    f = open('../data/file%d.txt' % i, 'w')\n\
  \    # 写入一些数据\n    for j in range(100):\n        f.write('Some data: %d\\n' % j)\n\
  \    f.close()\n\n#### 使用 bz2 压缩方式归档文件\ntf = tarfile.open('../data/files.tar.bz2',\
  \ 'w:bz2')\nfor filename in glob.glob('../data/file*'):\n    tf.add(filename, os.path.basename(filename))\n\
  tf.close()\n```\n\n脚本的第一部分生成了五个包含模拟数据的文件。文件创建完成后，我创建了一个用于归档的 tar 文件。文件模式指定为 `'w:bz2'`，表示写入（创建）一个使用\
  \ bz2 压缩算法压缩的 tar 文件。其他模式包括用于 gzip 压缩的 `'w:gz'` 和用于无压缩的 `'w'`。类似地，打开归档文件可以通过指定 `'r'`、`'r:gz'`\
  \ 或 `'r:bz2'` 来完成。\n\n一旦创建了 `tarfile` 对象，我们就可以使用 `add(path, arcname)` 方法将文件添加到归档中。如果你向\
  \ `add()` 提供一个目录，则整个目录都会被添加到归档中。\n\n我决定逐个添加文件，以防目录中存在其他我不想包含的文件。我还通过调用 `os.path.basename()`\
  \ 函数将文件名从相对路径中分离出来，从而设置了归档名称；这样，将来调用 `extract()` 时，会在当前工作目录中创建文件，而不是在相对路径 `../data`\
  \ 中。最后，我关闭了 tar 文件，从而实际创建了 `files.tar.bz2` 文件。\n\n从归档中检索文件也同样简单，如清单 10-13 所示。`extractall()`\
  \ 方法从归档中提取所有文件。`extract(member, path)` 方法将归档中的某个成员文件提取到 `path` 指定的位置。`getmembers()`\
  \ 方法列出归档中的成员（文件）。\n\n***清单 10-13***. 从归档中提取所有文件\n\n```python\nimport tarfile, os\n\
  \ntf = tarfile.open('../data/files.tar.bz2', 'r:bz2')\ntf.extractall('../data/new/')\n\
  tf.close()\n```\n\n清单 10-14 展示了如何仅提取归档中的前三个文件。\n\n***清单 10-14***. 从归档中提取前三个文件\n\n\
  ```python\nimport tarfile, os\n\nif not os.path.exists('../data/new'):\n    os.mkdir('../data/new')\n\
  \ntf = tarfile.open('../data/files.tar.bz2', 'r:bz2')\nfor member in tf.getmembers()[:3]:\n\
  \    tf.extract(member, '../data/new')\ntf.close()\n```\n\n我使用了 `getmembers()` 方法来获取归档中的文件列表，然后仅索引了前三个文件。\n\
  \n#### 比较文件\n\n确保两个文件完全相同是一项常见任务。对于输入数据文件而言，这意味着我们可以删除副本，这样脚本运行速度会更快，并且能提供更好的统计数据，因为数据不会被重复使用。如第\
  \ 4 章所述，产生重复文件的原因可能有很多。\n\n一种简单的文件比较机制是打开两个文件，将整个文件读入内存，然后比较其值：\n\n```python\n>>>\
  \ data1 = open('../data/file1.txt', 'rb').read()\n>>> data2 = open('../data/file2.txt',\
  \ 'rb').read()\n>>> data1 == data2\n```\n\n```\nTrue\n```\n\n这种方法的主要优点是简单。然而，它也存在几个缺点：\n\
  \n*   *效率低下*：假设一个文件大小为 10GB，而另一个文件只有 1 字节长。通过查看文件大小，就可以判断出这两个文件不相同。另一方面，将 10GB 的文件读入内存可能会导致系统运行缓慢。\n\
  *   *信息不足*：如果两个文件不相同，它们之间的具体差异是什么？\n\nPython 标准库中的 `filecmp` 和 `difflib` 模块为我们提供了比较文件并找出差异的功能。\n\
  \n## `filecmp` 模块\n\n`filecmp` 模块提供了用于文件和目录比较的函数。`cmp(file1, file2[, shallow])`\
  \ 方法用于比较 `file1` 和 `file2`。如果未提供 `shallow` 参数（或其为 `True`），则具有相同 *stat* 签名的文件被视为相等。换句话说，具有相同系统信息（如大小、创建日期等，有关\
  \ stat 的说明请参见 `https://docs.python.org/3.3/library/os.html`）的文件被视为相等。如果 `shallow`\
  \ 为 `False`，则还会比较文件的内容：\n\n```python\n>>> filenames = ['../data/file1.bin', '../data/file2.bin']\n\
  >>> for fn in filenames:\n...     f = open(fn, 'w')\n...     f.write('some data')\n\
  ...     f.close()\n...\n```\n\n```\n9\n9\n```\n\n```python\n>>> import filecmp\n\
  >>> filecmp.cmp(filenames[0], filenames[1])\n```\n\n```\nTrue\n```\n\n`dircmp(dir1,\
  \ dir2)` 类用于比较目录 `dir1` 和 `dir2`。该比较也包括所有子目录。`report()` 方法将打印比较两个目录的结果。\n\n对于以下示例，假设您已经在之前的压缩示例中创建了文件\
  \ `files.tar.bz2`。这里，我们创建两个目录：`new1` 和 `new2`。目录 `new1` 包含从归档中提取的文件；目录 `new2` 包含从归档中提取的文件，以及另一个子目录\
  \ `new3`，该子目录也包含归档的内容。让我们比较一下目录内容（参见清单 10-15）。\n\n***清单 10-15***. 比较目录\n\n```python\n\
  import tarfile, os, filecmp\n\nif not os.path.exists('new1'):\n    os.mkdir('new1')\n\
  \nif not os.path.exists('new2/new3'):\n    os.makedirs('new2/new3')\n\ntf = tarfile.open('files.tar.bz2',\
  \ 'r:bz2')\ntf.extractall('new1')\ntf.extractall('new2')\ntf.extractall('new2/new3')\n\
  tf.close()\n\ncmp = filecmp.dircmp('new1', 'new2')\ncmp.report()\n```\n\n结果如下：\n\
  \n```\ndiff new1 new2\nOnly in new2 : ['new3']\nIdentical files : ['file0.txt',\
  \ 'file1.txt', 'file2.txt', 'file3.txt', 'file4.txt']\n```\n\n如您所见，使用 `filecmp`\
  \ 模块比较目录内容既简单又方便。\n\n## `difflib` 模块\n\n`difflib` 模块提供了多个对象和函数，用于帮助比较字符串列表（例如文本文件）。有几个函数可以以不同格式提供\
  \ `diff` 结果。这些函数包括 `context_diff()`、`ndiff()` 和 `unified_diff()`。在本节中，我们将研究 `context_diff(f1,\
  \ f2[, fromfile][, tofile])`；其他函数具有类似的行为。\n\n首先，我们创建两个文件：`../data/file1.txt` 和 `../data/file2.txt`。这些文件的内容相似但不完全相同，如清单\
  \ 10-16 所示。\n\n***清单 10-16***. 创建用于比较的文件\n\n```python\nimport difflib\n\ncontent\
  \ = \"\"\"A string\n123, 456\n789\nsome text\\n\"\"\"\nfname1 = '../data/file1.txt'\n\
  fname2 = '../data/file2.txt'\n\nf1 = open(fname1, 'w')\nf1.write('before\\n')\n\
  f1.write(content)\nf1.close()\n\nf2 = open(fname2, 'w')\nf2.write(content)\nf2.write('after\\\
  n')\nf2.close()\n```\n\n这两个文件的不同之处在于：第一个文件在开头多了一行，而第二个文件在结尾多了一行。我们调用 `context_diff()`\
  \ 来显示这些差异（参见清单 10-17）。\n\n***清单 10-17***. 比较文件内容\n\n```python\nimport difflib\n\n\
  fname1 = '../data/file1.txt'\nfname2 = '../data/file2.txt'\n\nlines1 = open(fname1).readlines()\n\
  lines2 = open(fname2).readlines()\nfor line in difflib.context_diff(lines1, lines2,\
  \ fname1, fname2):\n    print(line, end='')\n```\n\n我将文件名作为参数传递给了 `context_diff()`；这将生成一个报告，在头部信息中显示文件名。结果如下：\n\
  \n```\n*** ../data/file1.txt\n--- ../data/file2.txt\n```\n\n\n\n一个以`***`开头的部分表示报告涉及文件`../data/file1.txt`；以`---`开头的部分表示报告涉及文件`../data/file2.txt`。以`-`符号开头的行表示该行在当前文件中缺失；以`+`符号开头的行表示该行包含在此文件中，但不在另一个文件中。输出类似于\
  \ UNIX `diff`命令行工具生成的输出。\n\n额外的`difflib`功能可以在`https://docs.python.org/3.3/library/difflib.html`在线找到。\n\
