  \n### 运行脚本\n\n交互式环境只能帮你到这里。最终，你将需要编写程序（脚本），并以非交互方式或从 Python 解释器内部运行它们。\n\n编写脚本最常见的原因是你需要多次执行某项任务。假设你公司的会计使用非线性折旧方程，他们请你（他们最喜欢的程序员）帮个私人忙，于是你决定编写一个基于网页的折旧计算器。或者，你所在医疗器械公司的临床人员经常需要访问大型且需要处理的日志文件，因此他们请你为每位患者编写一份基于这些日志文件的每日事件总结报告，或者……嗯，你懂的。\n\
  \n通常，我会在编写脚本的同时并行使用交互式环境。也就是说，我以交互方式运行 Python，执行几条语句，赋值一些变量，并绘制一些图表；如果一切顺利，我会将执行过的命令复制到我存放脚本的编辑器中。\n\
  \n![Image](img/sq.jpg) **提示** 在 IPython 中，你可以发出命令 `history` 来查看最近输入的命令列表。\n\n交互式编码的好处在于，你无需额外的调试工具就能检查代码中的变量和数据结构。如果脚本引发异常，你可以立即访问所有变量和数据结构：你可以重现错误并可能修复\
  \ bug。\n\n一旦你的脚本准备就绪（好吧，它从来都不是真正*就绪*的，我们姑且认为它已准备好进行测试驱动），你有以下几种运行方式：\n\n*   从 GUI\
  \ 环境运行脚本：运行 IDLE（Python GUI），选择 File ![image](img/arrow.jpg) Open 并选择要运行的脚本。这将在\
  \ IDLE 编辑器中打开 Python 脚本（如果它已打开，则无需重新打开）。要运行脚本，请按 **F5** 或从 Run 菜单中选择 Run Module。输出应显示在\
  \ Python GUI shell 中。\n*   从 Python 的 CLI 运行脚本。这可以通过发出命令 `exec(open('scriptname.py').read())`\
  \ 来实现；这是我在开发时最喜欢的选项。在 Python 2.x 版本中，另一种方法是使用 `execfile('scriptname.py')`。我更喜欢这种方法而非\
  \ GUI 环境的原因是，我喜欢在非 IDE 的编辑器中编辑代码。\n\n![Image](img/sq.jpg) **提示** 如果你使用 IPython，可以发出命令\
  \ `run path/filename.py`；好处是你可以使用字符补全来选择文件名，并且可以向脚本提供命令行参数：`run path/filename.py\
  \ param1 param2`。\n\n*   从 shell 或命令窗口调用脚本（非交互模式）。\n*   即使你可能在交互式 Python 中开发了脚本，最好也在\
  \ shell 中测试一下，特别是当你分发代码供他人使用时：他们可能不想以交互方式运行代码。要从 Linux shell 或 Cygwin 运行脚本，请使用以下命令：\n\
  \    ```\n    $ python path/filename.py\n    ```\n    在 Windows 中，请使用以下命令：\n   \
  \ ```\n    c:\\python33\\python.exe path\\filename.py\n    ```\n    在 Windows 中，你还可以设置\
  \ `PATH` 变量以包含 Python 目录路径 `c:\\python33`（假设你使用的是 Python 3.3），这样调用脚本时就不需要 Python\
  \ 可执行文件的完整路径：\n    ```\n    path=%path%;c:\\python33\n    python path\\filename.py\n\
  \    ```\n    在较新版本的 Python 中，可以在安装过程中通过选择 *Add python.exe to Path* 选项（默认未启用）来设置\
  \ `PATH` 变量，如图 3-1 所示。\n\n![9781484200537_Fig03-01.jpg](img/9781484200537_Fig03-01.jpg)\n\
  \n图 3-1. 将 python.exe 添加到 Path\n\n*   最后，还可以同时享受交互模式和非交互模式！这可以通过使用 `-i` 开关运行脚本来实现，该开关会在脚本运行*后*打开一个\
  \ Python shell，让你以交互方式检查变量：\n    ```\n    $ python –i somescript.py\n    ```\n\n\
  ![Image](img/sq.jpg) **提示** 由于反斜杠字符（`\\`）在字符串中具有特殊含义（我们稍后会讲到），并且也用作 Windows 中的路径分隔符，因此在处理文件名和文件路径时最好使用斜杠（`/`）字符。如果可能，请使用相对路径（例如\
  \ `../data` 而不是 `c:\\data`）；你的代码将跨操作系统可移植，并且更易于阅读。\n\n就是这样。我认为我们现在可以开始学习语言本身了。\n\
  \n## 数据类型\n\nPython 的数据类型与其他编程语言中的数据类型类似；你会看到字符串和数字，就像在 Basic 中一样。但即使在这些基本数据类型中，也有一些你应该了解的细节；例如，`int`\
  \ 数据类型支持无限整数精度。\n\n### 数字\n\n我们从数字开始。Python 原生支持 `int`、`float` 和 `complex`。\n\n\
  #### 整数\n\n`int` 数据类型提供无限整数精度，因此你可以使用的整数值没有限制：\n\n```\n>>> 2**70\n```\n```\n1180591620717411303424\n\
  ```\n```\n>>> 2**700\n```\n```\n52601359015483735072409898828801286655503398028231738594982809030687321\n\
  54297080822113666536277588451226982968856178217713019432250183803863127\n814770651880849955223671128444598191663757884322717271293251735781376\n\
  ```\n\n我引入了幂运算符，用 `**` 表示，因此 `2**70` 是 2⁷⁰。\n\n#### 其他有用的进制\n\n2 的幂进制是计算系统固有的。一个字节是\
  \ 2⁸，而不是十进制系统的幂。因此，能够将 2 的幂进制（如十六进制或八进制）的值与十进制系统相互转换非常重要。\n\n![Image](img/sq.jpg)\
  \ **注意** 八进制如今不太流行了。然而，一些八进制表示法仍然活跃，包括 Linux 系统中的文件权限。\n\n十六进制值以 `0x` 开头。因此，`0x20`\
  \ 是 32（十进制）。你可以对数字 A–F 使用大写或小写字母：\n\n```\n>>> 0xaB\n```\n```\n171\n```\n```\n>>>\
  \ 0xff\n```\n```\n255\n```\n\n八进制值以零和字符 O 开头（即 `0o` 或 `0O`）。因此 `0o20` 是 16（十进制）：\n\
  \n```\n>>> 0o20\n```\n```\n16\n```\n\n请注意，在 Python 2.x 中，八进制值仅以零开头，不带字符 O。\n\n类似地，二进制值以零和字符\
  \ B 开头（即 `0b` 或 `0B`）。因此，`0b111` 是 7（十进制）：\n\n```\n>>> 0b111\n```\n```\n7\n```\n\
  \n无论你如何输入数字；也就是说，无论你使用什么进制，它们在 Python 中仍然作为数字保留。如果你想查看不同的进制表示，请使用 `bin()`、`oct()`\
  \ 和 `hex()` 函数调用。这些函数返回一个字符串：\n\n```\n>>> hex(100)\n```\n```\n'0x64'\n```\n```\n\
  >>> oct(100)\n```\n```\n'0o144'\n```\n```\n>>> bin(100)\n```\n```\n'0b1100100'\n\
  ```\n\n你还可以使用函数 `int(str, radix=10)` 执行任何其他进制转换，该函数返回一个数字，而不是字符串。如果未指定 `radix`，则假定为\
  \ 10：\n\n```\n>>> int('100')\n```\n```\n100\n```\n```\n>>> int('100', 3)\n```\n\
  ```\n9\n```\n\n如果你想将 100 从三进制转换为十进制值，请编写 `int('100', 3)` 或 `int(str(100), 3)`。如果你希望使用变量，后者更有用；即\
  \ `int(str(variable), base)`。\n\n\n\n如果你将一个浮点数值传递给`int()`函数，结果会是一个截断后的整数值：\n\n```\n\
  >>> int(2.2)\n2\n```\n\n可以使用比十六进制（基数为 16）更高的进制，通过使用字母表中越来越多的字母作为新数字来表示基数。在基数为 17\
  \ 时，添加字符`g`；在基数为 18 时，使用字符`h`，依此类推。因此，基数为 17 的数字`'ggg'`应为 17³–1：\n\n```\n>>> int('ggg',\
  \ 17)\n4912\n>>> 17**3-1\n4912\n```\n\n这种进制支持最高到 36，对应字符`z`。\n\n### 比较\n\n你可以使用常规运算符比较值：`>`和`<`分别表示大于和小于。相等性检查使用双等号（`==`）进行，以区别于由单等号（`=`）表示的赋值符号。不等号为`!=`，你还可以使用`>=`和`<=`进行大于或等于以及小于或等于的比较。\n\
  \n```\n>>> 2*3 > 5\nTrue\n>>> 2*3 != 5\nTrue\n```\n\n某些比较是不允许的；例如，你不能将复数（在下一节中描述）与整数值进行比较：\n\
  \n```\n>>> 1+1j > 2\nTraceback (most recent call last):\n  File \"<stdin>\", line\
  \ 1, in <module>\nTypeError: unorderable types: complex() > int()\n```\n\n### 位运算\n\
  \n位运算符类似于 C 语言的位运算符，如表 3-1 所示。\n\n**表 3-1.** 位运算\n\n| 运算符 | 描述 | 示例 |\n| --- | ---\
  \ | --- |\n| `~` | 按位取反 | `~0x0ff+0x100`返回`0`。 |\n| `<<` | 左移 | `1<<8`返回`256`。 |\n\
  | `>>` | 右移 | `256>>2`返回`64`。 |\n| `^` | 按位异或（XOR） | `0xff ^ 0xf0`返回`15`（`0x0f`）。\
  \ |\n| `&` | 按位与（AND） | `0xff & 0x0f`返回`15`（`0x0f`）。 |\n| `&#124;` | 按位或（OR） | `0x0f\
  \ &#124; 0xf0`返回`255`（`0xff`）。 |\n\n### 增强赋值\n\n增强赋值引入了运算符`+=`、`-=`、`*=`、`/=`、`//=`、`%=`、`**=`、`<<=`、`>>=`、`&=`、`^=`和`|=`。这种表示法类似于\
  \ C/C++语法。也就是说，你可以写`a += 1`来代替`a = a+1`。类似地，你可以写`a >>= 1`来代替`a = a >> 1`。请注意，Python\
  \ 不支持自增运算符`++`。\n\n### 浮点数和复数\n\n浮点数值已经存在了相当长的时间，并且无法避免。Python 的`float`数据类型等同于 C\
  \ 语言的`double`，因此它实际上比 C 语言的`float`更精确（C 语言的`float`字节数少于 C 语言的`double`）。\n\n浮点数值用点号或表示指数记数法的字符`e`或`E`表示。如果你想确保你的值是`float`类型，可以添加尾随点号（或点零，或`e`/`E`），或者显式使用`float()`函数。`float()`函数也用于将值转换为`float`类型。只要转换可行，它既适用于字符串也适用于数字。使用返回变量、函数类型的`type()`函数，你总能确认一个变量是整数、浮点数值还是其他类型：\n\
  \n```\n>>> type(2)\n<class 'int'>\n>>> type(2.2)\n<class 'float'>\n>>> float(2)\n\
  2.0\n>>> 1e3\n1000.0\n>>> float('2.5')\n2.5\n```\n\n`complex`数据类型表示复数，由两个浮点数值组成，一个表示实部，一个表示虚部。虚部以尾随字母`j`（或`J`）表示。可以使用`imag`和`real`属性访问实部和虚部，如下所示：\n\
  \n```\n>>> a = 1+2j\n>>> a.real\n1.0\n>>> a.imag\n2.0\n```\n\n你可以像对浮点数一样，对复数使用大多数运算符。\n\
  \n一旦计算中涉及复数，剩余的计算将保持为`complex`类型，即整数和浮点数值会被提升为复数值。你可以使用`complex(real[, imag])`函数将数字转换为复数。如果提供了`imag`，它保存复数的虚部值：\n\
  \n```\n>>> complex(10)\n(10+0j)\n>>> complex(10, 2)\n(10+2j)\n```\n\n第 7 章将进一步讨论`complex`数据类型，并在一些示例中使用它。\n\
  \n### 字符串\n\n根据经典的 Python 定义，字符串是不可变的字符序列。这意味着字符串是一个你不能更改的字符序列。我知道这起初可能看起来很奇怪：你可能会想，“如果我不能修改字符串的字符，我该如何处理字符串？”答案是，你可以基于当前字符串创建新字符串。\n\
  \n#### 表示字符串\n\n有几种表示字符串的方法：单引号`'string'`、双引号`\"string\"`和三双引号`\"\"\"string\"\"\"\
  `（呼），仅举几例。还有更多：最值得注意的是由字母`r`表示的原始字符串，例如`r\"string\"`。\n\n要表示一个基本字符串，请按如下方式使用单引号：\n\
  \n```\n>>> 'split'\n'split'\n```\n\n如果你的字符串中包含引号，你必须用反斜杠（`\\`）对其进行转义：\n\n```\n>>>\
  \ 'it\\'s a split'\n\"it's a split\"\n```\n\n我们对单词`it's`中的引号进行转义的原因，是为了让字母`s`前的引号不会终止字符串。\n\
  \n单引号和双引号是可互换的。因此，我们可以通过将包围的引号（开头和结尾的引号）替换为双引号，在不转义单词`it's`中的引号的情况下达到相同的结果：\n\n\
  ```\n>>> \"it's a split\"\n\"it's a split\"\n```\n\n但是，如果我们想要一个字符串，它实际上也包含引号前的反斜杠——一个看起来完全像`it\\\
  's a split`的字符串呢？好吧，一种选择是同时转义反斜杠和引号：\n\n```\n>>> 'it\\'\\\\s a split second'\n\"\
  it'\\\\s a split second\"\n>>> print('it\\'\\\\s a split second')\nit'\\s a split\
  \ second\n```\n\n注意解释器表示该字符串的方式与打印它的方式不同。\n\n这种模式可能会持续下去，使事情更难理解。相反，我们可以使用原始字符串：\n\
  \n```\n>>> r\"it\\'s a split second\"\n\"it\\\\'s a split second\"\n>>> print(r\"\
  it\\'s a split second\")\nit\\'s a split second\n```\n\n原始字符串意味着跟在字符`r`和起始引号之后、结束引号之前的所有内容都应被按字面意义处理。使用原始字符串时，你基本上是在说“让\
  \ Python 转义需要转义的内容，并返回一个合适的字符串给我！”\n\n![Image](img/sq.jpg) **注意** 原始字符串在正则表达式中很常见，以避免在多个层面上转义特殊含义的字符。详见第\
  \ 5 章。\n\n你可以使用反斜杠跨多行输入字符串：\n\n```\n>>> \"it's a \\\n... split second\"\n\"it's\
  \ a split second\"\n```\n\n这显然可能带来更多麻烦——如果你*真的*希望反斜杠和换行符都出现呢？别担心，是时候使用三双引号（或三单引号，它们可互换）了：\n\
  \n```\n>>> \"\"\"it's a split\n... second\"\"\"\n\"it's a split\\nsecond\"\n>>>\
  \ print(_)\nit's a split\nsecond\n```\n\n如果所有这些听起来太令人困惑，那你并不孤单。要熟悉这些注意事项，请以交互方式启动\
  \ Python 并进行实验！有关字符串的更多信息，请参阅在线 Python 文档，网址为`https://docs.python.org/3.3/library/stdtypes.html#text-sequence-type-str`。\n\
  \n\n\nPython 也支持 Unicode 字符串；我将在第 5 章中简要介绍。\n\n### 字符串操作\n\n那么，你能对字符串做些什么呢？表 3-2\
  \ 列出了一些可对字符串执行的操作及示例。在示例中，我选择了无需转义的字符串，以便于理解；不过，同样的操作也适用于之前描述的任何字符串表达式。\n\n表 3-2.\
  \ 字符串操作\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| **加法与乘法** |  |  |\n| `str1+str2`\
  \ | 拼接字符串 `str1` 和 `str2`。 | `'split '+'second'` 返回 `'split second'`。 |\n| `str*n`\
  \ | 将字符串 `str` 重复拼接 `n` 次。 | `'second '*3` 返回 `'second second second '`。 |\n| **索引与切片**\
  \ |  |  |\n| `n` 和 `m` 是小于字符串 `str` 长度的正整数。负值从字符串末尾开始计数。 |  |  |\n| `s[n]` | 获取\
  \ `s` 的第 `n` 个字符。 | `'split'[3]` 返回 `'i'`。 |\n| `s[n:m]` | 获取从第 `n` 个字符到第 `m` 个字符（不含第\
  \ `m` 个字符）的字符串切片。如果 `n` 或 `m` 为负，则从字符串末尾开始计数。 | `'split second'[6:12]` 返回 `'second'`。`'split\
  \ second'[-6:-2]` 返回 `'seco'`。 |\n| `s[:m]` | 等同于 `n=0` 时的 `s[n:m]`。 | `'split second'[:3]`\
  \ 返回 `'spl'`。 |\n| `s[n:]` | 获取从第 `n` 个字符到末尾的字符串切片。 | `'split second'[6:]` 返回 `'second'`。\
  \ |\n\n你可以使用 `in` 运算符检查某个字符是否在字符串中：\n\n```\n>>> 'd' in 'abcde'\n```\n\n```\nTrue\n\
  ```\n\n你可以使用 `len()` 函数计算字符串中的字符数：\n\n```\n>>> len('abcde')\n```\n\n```\n5\n```\n\
  \n`in` 和 `len()` 都适用于其他序列，你很快就会看到。\n\n第 5 章将更详细地讨论字符串（包括 Unicode 字符串和原始字符串）。\n\n\
  ### 布尔值\n\n我直到现在才讨论布尔值，是因为布尔值在其他数据类型的上下文中才能大放异彩。布尔值可以取两个值：`True`（`1`）或 `False`（`0`）。\n\
  \n```\n>>> a = True\n>>> a > 1\n```\n\n```\nFalse\n```\n\n```\n>>> a == 1\n```\n\
  \n```\nTrue\n```\n\n```\n>>> type(a)\n```\n\n```\n<class 'bool'>\n```\n\n你可以使用 `bool()`\
  \ 函数将值转换为布尔值。空字符串、其他空序列以及任何形式的零值都被视为 `False`：\n\n```\n>>> bool(0)\n```\n\n```\n\
  False\n```\n\n```\n>>> bool(5)\n```\n\n```\nTrue\n```\n\n```\n>>> bool(\"\")\n```\n\
  \n```\nFalse\n```\n\n```\n>>> bool(\"s\")\n```\n\n```\nTrue\n```\n\n### 逻辑运算\n\n\
  逻辑运算 `and`、`or` 和 `not` 作用于布尔值。我假设你知道如何使用它们。让我们看看你是否知道以下问题的答案：\n\n```\n>>> 5 > 1\
  \ and ((4<3) or 2+4 < 5 and not 6 < 2)\n```\n\n（如果你不确定，只需在 Python 中输入它并观察结果。）\n\n\
  ## 数据结构\n\n作为一种高级编程语言，Python 还提供了额外的、更复杂的数据类型，我称之为*数据结构*。这些包括列表、元组、字典和集合等。数据结构使编程体验更加愉快。Python\
  \ 文档不一定像我这样区分数据类型和数据结构。我这样区分的目的在于将讨论分为两类：你可能会在流行编程语言（如 C）中遇到的简单*数据类型*；以及你可能会在更高级的编程语言（如\
  \ Python 和 Perl）中看到的更复杂的数据类型，即*数据结构*。无论本章如何分类，就 Python 而言，两者都是内置数据类型。\n\n从某种意义上说，你已经接触过数据结构：字符串和复数。字符串是一个不可变的序列，很难说是一种“简单”的数据类型。\n\
  \n相比之下，C 编程语言不支持原生的字符串数据类型，而是支持字符数组，这表明字符串并非真的那么基础。但字符串仍然有限——它是一个字符序列。那么其他对象的序列呢？还有可变（可更改）的序列呢？\n\
  \n别担心，Python 也提供了这些。Python 中的*列表*是任意数据类型的可变序列。*元组*与列表非常相似，只是它是不可变的。我们还将讨论一些更复杂的数据结构，它们能让编程更加有趣。你已经在第\
  \ 1 章中见过*字典*对象，我们将探讨该数据结构以及*集合*对象。Python 也是一种面向对象的编程语言；因此，在讨论*函数*之后，我们将介绍*类*对象。\n\
  \n![Image](img/sq.jpg) **注意** Python 提供了额外的原生数据类型和结构，但其中大部分超出了本书的范围；它们对于数据分析和可视化并非必需（*文件*数据类型可能是个例外，将在第\
  \ 5 章中讨论）。更多信息，请参阅 Python 标准库 – 内置类型，`https://docs.python.org/3.3/library/stdtypes.html`。\n\
  \n### 列表\n\n`list` 是对象的可变序列。列表用方括号表示：\n\n```\n>>> [1, 'hey', 1+2j]\n```\n\n```\n\
  [1, 'hey', (1+2j)]\n```\n\n你也可以使用 `list()` 函数创建列表。这在将不同序列（例如，从字符串）转换为列表时很有用：\n\n\
  ```\n>>> list('some text')\n```\n\n```\n['s', 'o', 'm', 'e', ' ', 't', 'e', 'x',\
  \ 't']\n```\n\n列表可以被修改。你可以使用 `+` 运算符向列表添加另一个元素。`+` 运算符拼接列表，因此你必须提供另一个列表：\n\n```\n\
  >>> [1, 'hey', 1+2j] + ['hey', 'hey']\n```\n\n```\n[1, 'hey', (1+2j), 'hey', 'hey']\n\
  ```\n\n然而，以下操作会失败，因为你不能将整数添加到列表中：\n\n```\n>>> [1,2,3] + 2\n```\n\n```\nTraceback\
  \ (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nTypeError:\
  \ can only concatenate list (not \"int\") to list\n```\n\n正确的方法是形成另一个仅由值 `2` 组成的列表：\n\
  \n```\n>>> [1,2,3] + [2]\n```\n\n```\n[1, 2, 3, 2]\n```\n\n如果你希望将值 `2` 添加到列表 `[1,\
  \ 2, 3]` 的每个元素中，即将列表修改为 `[3, 4, 5]`，你将在本章后面的“for 语句”和“列表推导式”部分了解具体方法。\n\n列表本身也是一个对象，因此你可以在列表中嵌套列表：\n\
  \n```\n>>> [[1, 2], [3, 4]]\n```\n\n```\n[[1, 2], [3, 4]]\n```\n\n现在事情变得复杂了，无论是在描述对象还是实际执行操作方面。假设你想将另一个列表\
  \ `[5, 6]` 添加到前面的示例中。你希望如何添加？更新后的列表应该是 `[[1, 2], [3, 4], [5, 6]]`、`[[1, 2], [3,\
  \ 4], 5, 6]` 还是 `[[[1, 2], [3, 4]], [5, 6]]`（这确实有点故意刁难）？\n\n我喜欢将数据结构 `[[1, 2], [3,\
  \ 4]]` 描述为一个行列表。第一行是 `[1, 2]`，第二行是 `[3, 4]`。\n\n以下是一些拼接列表的方法：\n\n```\n>>> [[1, 2],\
  \ [3, 4]] + [5, 6]\n```\n\n```\n[[1, 2], [3, 4], 5, 6]\n```\n\n```\n>>> [[1, 2],\
  \ [3, 4]] + [[5, 6]]\n```\n\n```\n[[1, 2], [3, 4], [5, 6]]\n```\n\n第一行添加了元素 `5`\
  \ 和 `6`。第二行添加了行 `[5, 6]`。\n\n另一种选择是使用变量 `L` 来保存列表，并使用 `append()` 和 `extend()` 方法：\n\
  \n```\n>>> L = [[1, 2], [3, 4]]\n>>> L.append([5, 6])\n>>> L\n```\n\n```\n[[1, 2],\
  \ [3, 4], [5, 6]]\n```\n\n```\n>>> L.extend([7, 8])\n>>> L\n```\n\n```\n[[1, 2],\
  \ [3, 4], [5, 6], 7, 8]\n```\n\n方法 `append()` 向列表添加一个项目——在本例中，是列表 `[5, 6]`。\n\n\n\
  \n方法`extend()`将序列中的元素逐个添加到列表末尾——在此例中，添加的元素是`7`和`8`。一开始可能有点难理解，但请交互式地操作列表，以掌握如何正确使用它们。列表与字符串类似，也可以进行索引：\n\
  \n```\n>>> L = [['hey', '1'], [2, 3, 4], '']\n>>> L[0]\n```\n```\n['hey', '1']\n\
  ```\n```\n>>> L[1]\n```\n```\n[2, 3, 4]\n```\n```\n>>> L[1][1]\n```\n```\n3\n```\n\
  \n最后一条语句`L[1][1]`需要一些解释。语句`L[1]`返回列表中的第二个元素（索引从 0 开始，因此索引 1 是第二个元素）。为了便于理解，我们可以在心里将`L[1]`赋值给变量`M`。然而，变量`M`本身也是一个列表：`[2,\
  \ 3, 4]`。因此我们显然也可以对`M`进行索引：`M[1]`的值是`3`。与其分两步完成，我们可以更简洁地写成`L[1][1]`。\n\n列表与字符串非常相似，也可以进行切片：\n\
  \n```\n>>> L = [['hey', '1'], [2, 3, 4], '']\n>>> L[0:-1]\n```\n```\n[['hey', '1'],\
  \ [2, 3, 4]]\n```\n```\n>>> L[:-1]\n```\n```\n[['hey', '1'], [2, 3, 4]]\n```\n```\n\
  >>> L[1:]\n```\n```\n[[2, 3, 4], '']\n```\n\n切片中的负索引表示从列表末尾向前计数。因此，索引`-1`表示最后一个元素。另外，请注意，切片时如果省略某个索引，则默认值为\
  \ 0 或列表末尾，具体取决于省略的是哪个索引。\n\n你可以使用`in`运算符检查某个元素是否在列表中：\n\n```\n>>> 'hey' in ['hey',\
  \ 'hey', 'split', 'second']\n```\n```\nTrue\n```\n\n你可以使用`len()`语句统计列表中的元素个数：\n\n\
  ```\n>>> len([['hey', '1'], [2, 3, 4], ''])\n```\n```\n3\n```\n\n由于列表是可变的，因此可以重新赋值：\n\
  \n```\n>>> L = [['hey', '1'], [2, 3, 4], '']\n>>> L[1] = [4, 5, 6]\n>>> L\n```\n\
  ```\n[['hey', '1'], [4, 5, 6], '']\n```\n\n列表还可以使用`del`语句删除元素：\n\n```\n>>> L = [['hey',\
  \ '1'], [2, 3, 4], '']\n>>> del L[0]\n>>> L\n```\n```\n[[2, 3, 4], '']\n```\n\n\
  列表还有方法，即仅对列表对象进行操作的函数（例如前面展示的`append()`和`extend()`）。要使用某个方法，请在列表对象后加一个点，然后跟上函数名，并在括号内传入参数（如果没有参数，则使用空括号）：\n\
  \n```\n>>> L = ['hey', 'hey', 'split', 'second']\n>>> L.count('hey')\n```\n```\n\
  2\n```\n```\n>>> L.sort()\n>>> L\n```\n```\n['hey', 'hey', 'second', 'split']\n\
  ```\n\n我使用了`count()`方法（用于统计列表中某个元素出现的次数）和`sort()`方法（用于对列表进行排序）。表 3-3 描述了一些列表方法及其示例。在示例中，假设`L`为`['second',\
  \ 'second', 8]`。\n\n表 3-3. 列表方法\n\n| 方法 | 描述 | 示例 |\n| --- | --- | --- |\n| `append(obj)`\
  \ | 向列表末尾添加一个元素。 | `L.append('hey')`将`L`改为`['second', 'second', 8, 'hey']`。 |\n\
  | `count(val)` | 返回`val`在列表中出现的次数。 | `L.count('second')`返回`2`。 |\n| `extend(iterable)`\
  \ | 从`iterable`（关于迭代器和可迭代对象的更多内容，请参见本章后续部分）中添加元素到列表。 | `L.extend(range(2))`将`L`改为`['second',\
  \ 'second', 8, 0, 1]`。 |\n| `index(val, [start, [stop]])` | 返回`val`在列表中的第一个索引。如果提供了`start`，则此方法返回第一个大于`start`的索引；如果提供了`stop`，则索引还必须小于`stop`。\
  \ | `L.index('second')`返回`0`。`L.index('second', 1)`返回`1`。`L.index('second', 2, 3)`抛出异常`x\
  \ not in list`。 |\n| `insert(n, obj)` | 在索引`n`处插入一个对象。 | `L.insert(2, 'me')`将`L`改为`['second',\
  \ 'second', 'me', 8]`。 |\n| `pop([n])` | 返回列表中第`n`个元素并将其移除。如果未提供`n`，则此方法返回最后一个元素。\
  \ | `L.pop()`返回`8`，修改后的列表为`['second', 'second']`。`L.pop(-3)`返回`'second'`，修改后的列表为`['second',\
  \ 8]`。 |\n| `remove(val)` | 移除`x`中第一次出现的`val`。 | `L.remove('second')`将`L`改为`['second',\
  \ 8]`。 |\n| `reverse()` | 反转列表。 | `L.reverse()`将`L`修改为`[8, 'second', 'second']`。\
  \ |\n| `sort()` | 对列表进行排序。你可以向列表提供一个排序函数；参见`help(list.sort)`。 | `L.sort()`会引发异常，因为数字和字符串之间的排序未定义。对于`L\
  \ = ['zoo', 'a']`，`L.sort()`将`L`改为`['a', 'zoo']`。 |\n\n### 元组\n\n*元组*是一个不可变的（不可更改的）对象序列。元组用圆括号表示，并可以使用`tuple()`函数创建：\n\
  \n```\n>>> (1, 2, 3)\n```\n```\n(1, 2, 3)\n```\n```\n>>> tuple('hey')\n```\n```\n\
  ('h', 'e', 'y')\n```\n\n元组不一定需要圆括号；仅仅添加一个逗号就表明该表达式是一个元组：\n\n```\n>>> 1, 2\n```\n\
  ```\n(1, 2)\n```\n```\n>>> 1,\n```\n```\n(1,)\n```\n```\n>>> (1)\n```\n```\n1\n\
  ```\n\n表达式`(1)`不是一个元组：它是括号内的值`1`，仅被视为数字 1。\n\n元组的行为与列表非常相似，但有一个例外：你不能修改元组。但是，你可以基于现有元组创建一个新的元组：\n\
  \n```\n>>> tuple([1, 2, 3])\n```\n```\n(1, 2, 3)\n```\n```\n>>> _ * 2\n```\n```\n\
  (1, 2, 3, 1, 2, 3)\n```\n\n在第一条语句中，我基于一个列表创建了一个元组。请注意，`tuple(1, 2, 3)`会引发异常，因为函数`tuple()`期望一个参数，而不是三个。在前面的代码中，我传递了一个列表作为参数：`[1,\
  \ 2, 3]`。我也可以写成`tuple((1, 2, 3))`，效果相同：表达式中的第一组外层圆括号是函数括号；内层的是元组括号。在列出的第二条语句中，我通过将结果变量相乘，基于第一个元组创建了第二个元组。\n\
  \n元组可以包含不同的数据类型和数据结构：\n\n```\n>>> ([1, 2], (3, 4))\n```\n```\n([1, 2], (3, 4))\n\
  ```\n\n上面是一个包含一个列表和一个元组的元组。\n\n元组也可以像列表和字符串一样进行索引。请记住，索引需要使用方括号，而不是圆括号：\n\n```\n\
  >>> ([1, 2], (3, 4))[0]\n```\n```\n[1, 2]\n```\n```\n>>> ([1, 2], (3, 4))[1]\n```\n\
  ```\n(3, 4)\n```\n```\n>>> ([1, 2], (3, 4))[1][0]\n```\n```\n3\n```\n\n元组也可以进行切片，从而生成一个新的元组：\n\
  \n```\n>>> ([1, 2], (3, 4))[1:]\n```\n```\n((3, 4),)\n```\n\n然而，元组不能被重新赋值：\n\n```\n\
  >>> a = (['hey', '1'], '')\n>>> a[0] = 0\n```\n```\nTraceback (most recent call\
  \ last):\n  File \"<stdin>\", line 1, in <module>\nTypeError: 'tuple' object does\
  \ not support item assignment\n```\n\n但是，元组内的列表*可以*被更改，因为列表是可变的：\n\n```\n>>> a =\
  \ (['hey', '1'], '')\n>>> a[0][0] = 'wow'\n>>> a\n```\n```\n(['wow', '1'], '')\n\
  ```\n\n可以使用`in`运算符检查某个元素是否在元组中：\n\n```\n>>> 1 in (2, 3)\n```\n```\nFalse\n```\n\n\
  最后，通常使用元组来执行多重赋值，这也称为解包：\n\n```\n>>> a, b = 1, 2\n>>> a + b\n```\n```\n3\n```\n\n\
  ### 字典\n\n*字典*是可变序列，它将一个*键*与一个*值*关联起来。键必须是唯一的，而值则不必。在思考字典时，我喜欢使用电话簿的比喻。每个电话号码（键）都对应一个条目（值），通常是一个人；然而，一个人（值）可以拥有多部电话（键）。键和值对象可以是大多数数据类型，但也有例外（例如，另一个字典）。\n\
  \n创建字典的方法有多种。\n\n\n\n例如，你可以使用 `dict()` 函数配合 `(key, value)` 元组序列，或者使用花括号（`{}`）并用冒号分隔键和值：\n\
  \n```\n>>> dict((('split', 8), ('second', 1)))\n{'second': 1, 'split': 8}\n>>> {'split':8,\
  \ 'second':1}\n{'second': 1, 'split': 8}\n>>> type(_)\n<class 'dict'>\n```\n\n第一个表达式中有很多括号：最外层是函数\
  \ `dict()` 的括号，最内层是具体的元组对，中间层则表示一个元组的元组，因为 `dict()` 只能接受一个参数。一种更易读的方式是向 `dict()`\
  \ 传递一个元组列表，而不是元组的元组：\n\n```\n>>> dict([('split', 8), ('second', 1)])\n{'second':\
  \ 1, 'split': 8}\n```\n\n你可以使用方括号从字典中检索值：\n\n```\n>>> d = dict([('split', 8), ('second',\
  \ 1)])\n>>> d['split']\n8\n```\n\n检查字典中的成员关系使用 `in` 运算符，它默认检查字典的键，而不是值。如果你想检查值，请使用\
  \ `values()` 方法：\n\n```\n>>> D = dict([('split', 8), ('second', 1)])\n>>> 'split'\
  \ in D\nTrue\n>>> 8 in D\nFalse\n>>> 8 in D.values()\nTrue\n```\n\n你也可以使用方括号来更改和赋值新值：\n\
  \n```\n>>> D = dict([('split', 8), ('second', 1)])\n>>> D['python'] = 'snake'\n\
  >>> D\n{'split': 8, 'second': 1, 'python': 'snake'}\n>>> D['python'] = 'programming\
  \ language'\n>>> D\n{'split': 8, 'second': 1, 'python': 'programming language'}\n\
  ```\n\n在上面的例子中，对键 `'python'` 的第二次赋值会用值 `'programming language'` 覆盖之前的值 `'snake'`。\n\
  \n仔细想想，现实世界中的字典可能为一个键提供多个条目：单词“python”既可以指一种无毒、绞杀性的蛇，也可以指一种开源编程语言。这种行为也可以在 Python\
  \ 字典中模拟；只需让值包含一个列表即可：\n\n```\n>>> D = dict()\n>>> D['python'] = ['snake', 'programming\
  \ language']\n>>> D\n{'python': ['snake', 'programming language']}\n```\n\n字典是使用哈希算法实现的。这意味着从键中检索值非常高效。互联网上有大量关于哈希算法和哈希函数的信息，如果你有兴趣了解它们的工作原理，可以查阅相关资料（一个好的起点是\
  \ `https://en.wikipedia.org/wiki/Hash_function`）。如果使用得当，字典可以简化你的代码并使其效率更高。在第 4 章中，我将展示一个使用字典在硬盘上定位重复文件的示例。\n\
  \n表 3-4 列出了字典的成员函数。在表中的示例中，假设 `D` 是 `{'second': 1, 'split': 8}`。\n\n表 3-4. 字典方法\n\
  \n| 方法 | 描述 | 示例 |\n| --- | --- | --- |\n| **函数** |  |  |\n| `clear()` | 移除字典中的所有项。\
  \ | `D.clear()` 将 `D` 变为 `{}`。 |\n| `copy()` | 返回 `D` 的浅拷贝（参见本章后面的“变量”部分）。 | `D2\
  \ = D.copy()`。 |\n| `fromkeys(K[, v])` | 根据键 `K` 创建一个字典。如果提供了 `v`，则所有值都设置为 `v`。\
  \ | `{}.fromkeys(['split', 'second'], 8)` 返回 `{'second': 8, 'split': 8}`。 |\n| `get(k[,\
  \ def])` | 返回与键 `k` 关联的值。如果 `k` 不在字典中，则此方法返回提供的 `def`（如果提供了的话）。 | `D.get('first',\
  \ 1)` 返回 `1`。 |\n| `items()` | 返回键值对元组。 | `D.items()` 返回 `dict_items([('split',\
  \ 8), ('second', 1)])`。 |\n| `keys()` | 返回键的列表。 | `D.keys()` 返回 `dict_keys(['second',\
  \ 'split'])`。 |\n| `pop(k[, def])` | 返回与键 `k` 关联的值并将其从字典中移除。如果 `k` 不在字典中，则此方法返回提供的\
  \ `def`（如果提供了的话）；否则，会引发异常。 | `D.pop('split')` 返回 `8` 并将 `D` 变为 `{'second': 1}`。\
  \ |\n| `popitem()` | 返回一个任意的键值对元组，并将该对从字典中移除。 | `D.popitem()` 返回 `('second', 1)`\
  \ 并将 `D` 变为 `{'split': 8}`。 |\n| `setdefault(k[,def])` | 返回与键 `k` 关联的值。如果 `k` 不在字典中，则此方法返回提供的\
  \ `def`（如果提供了的话）并将 `D[k]` 设置为 `def`。 | `D.setdefault('hey', 6)` 返回 `6` 并将 `D` 变为\
  \ `{'second': 1, 'hey': 6, 'split': 8}`。 |\n| `update(e)` | 使用字典 `e` 中的数据更新字典。 |\
  \ 请参见本节后面的示例。 |\n| `values()` | 返回值的列表。 | `D.values()` 返回 `dict_values([1, 8])`。\
  \ |\n\n虽然这些成员函数大多易于理解，但有两个需要更多解释：`update()` 和 `get()`。\n\n方法 `update()` 使用另一个字典中的键值对来更新字典。为便于讨论，我将引用函数调用\
  \ `D1.update(D2)`。如果一个键同时存在于字典 `D1` 和 `D2` 中，则 `D1` 中与该键关联的值会被更新为字典 `D2` 中的值。如果\
  \ `D2` 中的某个键在 `D1` 中不存在，则它及其值会被添加到 `D1` 中。以下示例说明了这种行为：\n\n```\n>>> d1 = {'second':\
  \ 1, 'split': 8}\n>>> d2 = {'second': 3, 'hey': 7}\n>>> d1.update(D2)\n>>> d1\n\
  {'second': 3, 'split': 8, 'hey': 7}\n```\n\n与键 `'second'` 关联的值被更新了，并且键值对 `'hey':\
  \ 7` 被添加了进来。\n\n我想讨论的下一个成员函数是 `get()`。起初，这看起来有点奇怪；`get()` 与直接使用方括号访问键有何不同？区别在于，如果你使用方括号且键不在字典中，则会引发\
  \ `KeyError` 异常。函数 `get()` 允许你检查一个键是否在字典中；此外，如果键不在字典中，该函数还会返回一个默认值。用一个例子来说明它的用处可能是个好方法。\n\
  \n考虑第 1 章中介绍的 `list_gps_commands()` 函数（我已移除文档字符串），如下面的代码清单 3-1 所示。\n\n***代码清单 3-1***.\
  \ 函数 `list_gps_commands()`\n\n```\ndef list_gps_commands(data):\n    gps_cmds =\
