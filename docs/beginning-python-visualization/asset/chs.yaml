- "# 高级文件处理\n\n## 更多关于文件的内容\n\n程序员的一项常见任务是处理文件。程序员不仅要读写文件，还要组织文件、移动文件、删除文件、压缩文件、归档文件等等。为了完成这些任务，我经常发现自己会从之前的项目中借用代码，特别是那些处理读取和解析文件的代码，通常是通过复制粘贴的方式。但这似乎是一种浪费——为什么不创建一个函数库来满足这些常见需求呢？\n\
  \n其他程序员肯定也有同感，因此他们开始编写模块，即执行这些任务的函数库。其中许多库现在已包含在 Python 标准库中；并且定期会添加更多库。\n\n本章将探讨与文件相关的主题。在第\
  \ 4 章和第 5 章讨论的思想基础上，本章还将基于之前的一些示例创建更可重用的代码。示例包括直接读写 `NumPy` 数组到文件、读写 MATLAB 文件、从多个文件读取数据、读取命令行参数、操作目录、比较文件等。\n\
  \n## 二进制文件和随机访问\n\n术语*二进制文件*描述的是非文本文件，无论是可执行文件、图像文件还是简单的数据文件。在本节中，我将向您展示一些处理二进制数据文件的方法，包括随机二进制文件访问、使用\
  \ `struct` 模块读写二进制文件中的数值数据，以及读写 MATLAB 二进制文件。\n\n之前在处理文本文件时，我们使用 `readline()` 或\
  \ `read(n)` 从文件中读取数据块。从某种意义上说，函数 `readline()` 将文件分割成更小的数据块（即文本行）。\n\n对于二进制文件，更常见的是随机访问；也就是说，从文件中的任意位置随机读取数据块。对于文本文件，这有点困难，因为您无法预先知道一行中有多少个字符和单词，因此随机选择第\
  \ n 行并非易事。对于由固定长度记录组成的二进制文件，随机访问允许您访问任意字段。\n\n方法 `seek(offset[, whence])` 和 `tell()`\
  \ 是随机访问文件函数。为了更好地理解这些函数的作用，您需要理解文件指针的概念。*文件指针*指向文件中的一个位置：后续的读取或写入操作将在该特定位置发生（假设文件是以允许随机访问读取和/或写入的模式打开的）。每当我们从文件中读取或写入数据时，文件指针都会相应地递增。\n\
  \n![Image](img/sq.jpg) **注意** 与之前的章节一样，我假设您正在目录 `Ch10/src` 中运行交互式 Python 会话，并且目录\
  \ `Ch10/data` 存在。\n\n函数 `seek()` 将文件指针设置为我们选择的值；后续对 `read()` 的调用将从新“定位”的位置开始读取。函数\
  \ `tell()` 以字节为单位返回当前文件指针的值。以下是一个简短的交互式 Python 会话，描述了 `seek()` 和 `tell()` 的工作原理：\n\
  \n```\n>>> f = open('../data/example.bin', 'wb')\n>>> f.tell()\n```\n\n```\n0\n\
  ```\n\n```\n>>> f.write(b'0123456789')\n```\n\n```\n10\n```\n\n```\n>>> f.tell()\n\
  ```\n\n```\n10\n```\n\n通过上述代码，我创建了一个二进制文件。\n```\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n当你第一次这样做时，与文件关联的文件指针被设置为`0`，正如`f.tell()`的结果所示。写入十个值后，文件指针位于`10`。注意字符串前面的前导`b`字符，`b'0123456789'`；这是为了将字符串编码为字节（即每个字符被编码为其\
  \ ASCII 值）：\n\n```\n>>> f.seek(5)\n>>> f.write(b'0123456789')\n```\n\n```\n10\n\
  ```\n\n```\n>>> f.tell()\n```\n\n```\n15\n```\n\n```\n>>> f.close()\n```\n\n我已将文件指针更改为指向位置\
  \ 5，然后重新写入相同的十个值。结果，文件指针已变为 15。让我们打印文件的内容：\n\n```\n>>> open('../data/example.bin',\
  \ 'rb').read()\n```\n\n```\nb'012340123456789'\n```\n\n正如预期，结果是字符串`b'0123456789'`，在位置\
  \ 5 处被同一字符串的另一个副本重叠，从而得到字符串`b'012340123456789'`。\n\n函数`seek(offset[, whence])`中的参数`whence`指示应如何计算偏移量。如果`whence`是`0`（默认值），`seek()`将相对于文件开头移动`offset`字节。如果`whence`是`2`，`seek()`将相对于文件末尾移动文件指针`offset`字节。请注意，为了将文件指针更改为文件末尾之前的\
  \ n 个字节，必须传递一个负值作为偏移量。在许多系统上，可以寻址到文件末尾之后（这是一个特性，而不是错误，您很快就会看到）。如果`whence`等于`1`，`seek()`将相对于当前位置移动。同样，允许使用负值和正值。如果`whence`是`0`，则不允许`seek()`使用负值。让我们继续之前的示例：\n\
  \n```\n>>> f = open('../data/example.bin', 'rb')\n>>> f.seek(-2, 2)\n```\n\n```\n\
  13\n```\n\n```\n>>> print(f.read())\n```\n\n```\nb'89'\n```\n\n```\n>>> f.close()\n\
  ```\n\n我已将文件指针设置为文件末尾之前的 2 个字节（负 2），并从该点向前打印文件的内容。正如预期，结果是两个字节长，对应于`b'89'`。\n\n\
  **示例：读取第 N 个字段**\n\n函数`seek()`和`tell()`对于访问包含固定长度记录的大型二进制文件特别有用。与文本文件不同，对于固定长度记录的二进制文件，您可以预先计算文件中字段的位置。结合`seek()`，可以读取单个字段。这在大型文件中尤其重要，因为读取整个文件，甚至一次读取一个值（而不直接寻址到所需字段）可能会花费大量时间。\n\
  \n在清单 10-1 所示的示例中，我们将`seek()`和`tell()`与`struct`模块（参见第 4 章）结合使用。\n\n***清单 10-1***.\
  \ 读取第 N 个字段\n\n```\nimport struct\nfrom math import sqrt\nfrom random import randrange\n\
  \n### binary filename\nbin_fn = '../data/large_file.bin'\n\nNfields = 1000     \
  \ # number of fields\nN = 766             # field to retrieve\nfmt = 'cdL'     \
  \    # format: byte, float, 4-bytes\n\nfmt_size = struct.calcsize(fmt)\n\n### create\
  \ a random binary file\nfout = open(bin_fn, 'wb')\nfor i in range(Nfields):\n  \
  \  data = struct.pack(fmt, bytes([randrange(32, 128)]), sqrt(float(i)), i)\n   \
  \ fout.write(data)\nfout.close()\n\n### read the nth value\nfin = open(bin_fn, 'rb')\n\
  fin.seek((N-1)*fmt_size)\ndata = fin.read(fmt_size)\n(c, d, l) = struct.unpack(fmt,\
  \ data)\nprint(\"At location %d, I read:\" % (fin.tell()/fmt_size), (c, d, l))\n\
  ```\n\n脚本的第一部分创建一个包含一些虚构数据的二进制文件。注意这一行：`data = struct.pack(fmt, bytes([randrange(32,\
  \ 128)]), sqrt(float(i)), i)`，因为它需要一些解释。函数`struct.pack()`接受一个格式说明符，在我们的例子中是`'cdL'`，它代表一个单字节整数、一个双精度浮点值和一个\
  \ 4 字节整数，然后是实际值：一个字节、一个双精度浮点数和一个 4 字节整数。虽然在 Python 中生成双精度浮点数和 4 字节整数很简单（浮点值的默认大小和整数的默认大小），但生成单字节整数稍微复杂一些。为了生成单字节值，我使用了函数`bytes()`。函数`bytes()`返回一个不可变的字节序列，并有多种形式。我选择使用的那种接受一个可迭代对象，并从该可迭代对象生成一个字节数组。在这种情况下，可迭代对象只是一个包含一个值的列表，该值由函数`randrange()`生成。因此，语句`bytes([randrange(32,\
  \ 128)])`将一个 4 字节整数转换为一个 1 字节整数。\n\n代码的下一部分读取位置 766 处的单个字段，而无需读取整个文件。这是通过将文件指针更改为指向位置`(N-1)*fmt_size`并仅读取一个字段来完成的。\n\
  \n以下是运行脚本的结果：\n\n```\nAt location 766, I read: (b'', 27.65863337187866, 765)\n```\n\
  \n**示例：高效的 tail 实现**\n\n在[第 5 章中，您看到了 head 和 tail 功能的一种可能实现。对于非常大的文件，tail 功能更难实现。要实现\
  \ tail 功能，您必须预先知道文件中的行数。这迫使您要么读取整个文件，执行两次遍历，或者保留最后几行的缓冲区（更多细节，请参见第 5 章，“示例：head\
  \ 和 tail”）。在本示例中，我们转而使用`seek()`和`tell()`为大型文件实现 tail 功能，如清单 10-2 所示。\n\n***清单 10-2***.\
  \ 一个用于大型文件的`tail()`函数\n\n```\nfrom os.path import getsize\n\ndef tail_large(filename,\
  \ n=10):\n    \"\"\"Returns the last n lines of a very large file.\"\"\"\n\n   \
  \ N, data = 1024, b''\n\n    # open the file and retrieve its size\n    f = open(filename,\
  \ 'rb')\n    fsize = getsize(filename)\n\n    # seek to the end of file\n    f.seek(0,\
  \ 2)\n\n    for i in range(fsize-N, -N, -N):\n        # read the next chunk of data\n\
  \        f.seek(max(i, 0))\n\n        # store read data, reversed order\n      \
  \  data = f.read(N)+data\n\n        # do we have enough lines?\n        if data.count(b'\\\
  n') > n:\n            break\n\n    # print the last n lines\n    lines = data.splitlines()\n\
  \    for line in lines[-n:]:\n        print(line)\n```\n\n思路是这样的：从末尾读取`N`个字节，并将结果存储在`data`中。参数`N`是一个任意数字，描述一次读取的字节数。我将其设置为`1024`。如果`data`包含超过`n`行（只需计算遇到`'\\\
  n'`的次数），则跳出`for`循环并打印最后`n`行数据。如果`data`不包含`n`行，则读取下一个`N`字节块（即向后），并将读取的字节添加到`data`中。从某种意义上说，我们从文件末尾向后移动，读取大小为`N=1024`字节的块，然后计算是否遇到了足够的换行符。如果遇到了，我们就打印这些行；如果没有，我们继续读取更多数据，直到读取了所需数量的行或到达文件开头。\n\
  \n这个实现不如第 5 章中介绍的那样直接。然而，对于大型文件，它具有显著的性能提升。原因在于您不需要读取整个文件，这对于大型文件来说可能非常耗时；相反，代码从文件末尾开始，向后移动，只读取请求的行。\n\
  \n\n\n#### 示例：创建固定大小的文件\n\n在处理二进制文件时，有时需要创建一个大型文件（包含未初始化的值），例如为将来要写入的数据预留存储空间。我创建文件时使用的一个技巧是，将文件指针寻址到超出文件末尾、相当于所需长度减一的位置，然后写入`0`并关闭文件。这会在许多系统中创建一个所需大小的文件。\n\
  \n以下创建一个大小为 1GB（2³⁰ 字节）的未初始化文件：\n\n```\n>>> f = open('../data/1gb_file.bin', 'wb')\n\
  >>> f.seek(2**30-1)\n```\n\n```\n1073741823\n```\n\n```\n>>> f.write(bytes([0]))\n\
  ```\n\n```\n1\n```\n\n```\n>>> f.close()\n```\n\n现在你需要确保文件确实已创建：\n\n```\n>>> from\
  \ os.path import getsize\n>>> getsize('../data/1gb_file.bin')\n```\n\n```\n1073741824\n\
  ```\n\n![Image](img/sq.jpg) **注意** 将文件指针寻址到文件末尾之外的能力依赖于系统，并非所有系统都支持。\n\n#### 示例：记录基于时间的二进制数据\n\
  \n在记录基于时间的二进制数据时，我特别喜欢使用纪元时间表示法（参见第 5 章）。在本例中，我将使用`time`模块和 Python 的`array`模块中的函数（不要与*NumPy*的数组对象混淆）。\n\
  \n如果你只是将变量作为时间的函数进行记录，那么将记录变量设为浮点表示法会更简单，因为这样时间和值都使用相同的数据类型。这使得`array`模块的使用变得简单，如代码清单\
  \ 10-3 所示。\n\n***代码清单 10-3***。以二进制形式写入基于纪元时间的数据\n\n```\nimport random, time, array\n\
  \nN = 10\nfname = '../data/binary_data.f64'\ndata = array.array('d')\n\n##### 创建数据\n\
  for value in range(N):\n    time.sleep(random.random())\n    data.append(time.time())\n\
  \    data.append(value)\n\n##### 将数据存储到文件\nf = open(fname, 'wb')\ndata.tofile(f)\n\
  f.close()\n```\n\n该脚本平均运行五秒钟，生成时间戳和值。我使用了`array`的`tofile()`方法将二进制值存储到文件中。\n\n从二进制文件中检索数据也很简单，如代码清单\
  \ 10-4 所示。\n\n***代码清单 10-4***。读取以纪元时间表示法存储的二进制数据\n\n```\nimport random, time, array\n\
  \nN = 10\nfname = '../data/binary_data.f64'\ndata = array.array('d')\n\n##### 读取数据\n\
  f = open(fname, 'rb')\ndata.fromfile(f, N*2)\nf.close()\n\n##### 显示数据\nL = data.tolist()\n\
  for t, val in zip(L[::2], L[1::2]):\n    print(time.ctime(t), val)\n```\n\n大部分工作由`data.fromfile(f,\
  \ N*2)`这一行完成，它读取值并将其存储到 Python 数组中。然后我重新排列数据并显示结果：\n\n```\nSun Jun 22 23:25:58 2014\
  \ 0.0\nSun Jun 22 23:25:59 2014 1.0\nSun Jun 22 23:25:59 2014 2.0\nSun Jun 22 23:26:00\
  \ 2014 3.0\nSun Jun 22 23:26:00 2014 4.0\nSun Jun 22 23:26:01 2014 5.0\nSun Jun\
  \ 22 23:26:02 2014 6.0\nSun Jun 22 23:26:02 2014 7.0\nSun Jun 22 23:26:02 2014 8.0\n\
  Sun Jun 22 23:26:03 2014 9.0\n```\n\n我使用了一个技巧来重新排列数据。当将数据从数组转换为列表`L`时，值是交错排列的：时间、值、时间、值，依此类推。要打印这些值，我可以遍历`L`，将每个奇数索引的值转换为时间格式。这里我选择对偶数和奇数索引的切片进行\
  \ zip 操作。以下代码说明了这一点：\n\n```\n>>> L = [1, 'Value', 2, 'Another value', 3, 'Last value']\n\
  >>> L[::2]    # 这些是奇数索引的值\n```\n\n```\n[1, 2, 3]\n```\n\n```\n>>> L[1::2]   # 这些是偶数索引的值\n\
  ```\n\n```\n['Value', 'Another value', 'Last value']\n```\n\n```\n>>> list(zip(L[::2],\
  \ L[1::2]))\n```\n\n```\n[(1, 'Value'), (2, 'Another value'), (3, 'Last value')]\n\
  ```\n\n```\n>>> for i, s in zip(L[::2], L[1::2]):\n...     print(i, s)\n...\n```\n\
  \n```\n1 Value\n2 Another value\n3 Last value\n```\n\n#### 将 MATLAB 文件读取为 *NumPy*\
  \ 数组\n\n许多*PyLab*用户会发现读写 MATLAB 风格的`.mat`文件是一项重要功能。这可以方便地在 MATLAB 和 Python 之间传输数据。MATLAB\
  \ 是一种流行的数学编程语言和环境；更多信息请参见`http://www.mathworks.com`。如果你不使用 MATLAB 文件，可以跳过本节。\n\n\
  MATLAB 风格的`.mat`文件是具有特定二进制格式的二进制文件。要读写 mat 文件，我们使用`scipy.io`模块。要读取文件，我们使用`savemat(filename,\
  \ dict)`；要写入文件，我们使用`loadmat(filename)`，如下所示：\n\n```\n>>> from pylab import *\n>>>\
