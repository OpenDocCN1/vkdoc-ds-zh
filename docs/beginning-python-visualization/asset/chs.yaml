  \ 的双斜杠注释 `//`。从该符号开始到行尾的所有内容都被视为注释。如果 `#` 号位于行首，则整行都是注释，通常用于描述下一行或代码块。`#` 号表示注释的例外情况是当它被引号括在字符串中时，例如：`\"\
  #\"`。\n\n\n\n别忘了修改变量 `port` 的值，使其指向清单 1-1 中端口扫描代码返回的串口位置。你还应该设置合适的波特率。确定波特率并不复杂，但最好查阅一下手册。我的波特率是\
  \ 4800；如果你不确定自己的波特率，可以调整这个参数。脚本 `record_gps.py` 会将 GPS 的输出打印到屏幕上，这样你就可以更改波特率值（尝试\
  \ 1200、2400、4800 和 9600 这几个值），直到看到有意义的结果（即文本和数字）。\n\n运行 `record_gps.py`（我稍后会介绍其工作原理）会输出\
  \ GPS 数据：\n\n```\n>>> exec(open('record_gps.py').read())\n$GPRMC,140053.00,A,4454.1740,N,09325.0143,W,000.0,128.7,300508,001.1,E,A*2E\n\
  $GPGGA,140053.00,4454.1740,N,09325.0143,W,1,09,01.1,00289.8,M,-030.7,M,,*5E\n$GPGSA,A,3,21,15,18,24,26,29,06,22,,03,,,02.0,01.1,01.7*04\n\
  $GPGSV,3,1,12,21,75,306,40,15,59,075,46,18,57,269,49,24,56,115,46*79\n$GPGSV,3,2,12,26,48,059,43,29,27,188,48,06,25,308,41,22,18,257,33*7D\n\
  $GPGSV,3,3,12,08,14,060,,03,11,320,32,09,06,144,,16,04,311,*7C\n$GPRMC,140054.00,A,4454.1740,N,09325.0143,W,000.0,128.7,300508,001.1,E,A*29\n\
  $GPGGA,140054.00,4454.1740,N,09325.0143,W,1,09,01.1,00289.8,M,-030.7,M,,*59\n$GPGSA,A,3,21,15,18,24,26,29,06,22,,03,,,02.0,01.1,01.7*04\n\
  ```\n\n数据在显示的同时会被记录到文件中。当你想停止查看和记录 GPS 数据时，请按下 `Ctrl+C`。如果你在交互式 Python 环境中运行，一旦按下\
  \ `Ctrl+C`，请务必关闭串口，否则你将无法重新运行脚本 `record_gps.py`。要关闭端口，请执行以下命令：\n\n```\n>>> ser.close()\n\
  ```\n\n关闭文件也是一个好习惯：\n\n```\n>>> f.close()\n```\n\n让我们仔细看看 `record_gps.py`，以深入了解其工作原理。该脚本的核心在于以下几行代码：\n\
  \n```\nwhile True:\n    line = ser.readline()\n    f.write(line)\n    print(line)\n\
  ```\n\n这是一个直接的实现。第一行 `while True:` 指示接下来的代码块应无限期运行；也就是说，处于一个无限循环中。这就是为什么你需要按下 `Ctrl+C`\
  \ 来停止记录。接下来的三行会连续执行。它们从串口读取一行文本，将其存储到文件中，并打印到屏幕上。读取 GPS 数据由命令 `line = ser.readline()`\
  \ 执行。将数据写入文件以供后续处理由 `f.write(line)` 完成。将数据打印到屏幕以便用户获得视觉反馈则由 `print(line)` 实现。\n\n\
  ![Image](img/sq.jpg) **注意** Python 中的缩进（空格数量）很重要，因为它将命令组合在一起。在交互模式下使用 Python 时也是如此。所有具有相同缩进的行被视为一个代码块。Python\
  \ 的缩进相当于 C/C++ 中的花括号——`{}`。\n\n## 数据组织\n\n接下来，我们来选择文件格式、文件命名约定和数据存储位置。没有一个适用于所有情况的单一完美解决方案，但方法和思路很简单。我在这里使用的方法基于文件名。我将向你展示如何以一种便于后续自动处理的方式来命名数据文件。\n\
  \n## 文件格式\n\n文件格式是一组描述文件内容的规则。对于 GPS 问题，我们将选择逗号分隔值（CSV）文件格式。CSV 文件是值由逗号分隔的文本文件，如下例所示：\n\
  \n```\n$GPGSV,3,2,12,06,43,096,37,07,41,291,38,16,39,052,32,27,34,291,34*76\n$GPGSV,3,3,12,19,26,152,35,08,06,280,,10,00,337,,00,00,000,*74\n\
  $GPRMC,233547.32,A,4455.6446,N,09329.3400,W,030.1,272.5,040608,001.1,E,A*2E\n$GPGGA,233547.32,4455.6446,N,09329.3400,W,1,06,02.8,00299.0,M,-030.7,M,,*5A\n\
  ```\n\nCSV 是一种流行的格式，大多数电子表格软件、数据库应用程序以及文本编辑器（因为它们实际上就是文本文件）都能识别。事实证明，大多数 USB-GPS\
  \ 接收器的数据已经是逗号分隔的，因此只需将这些信息原样保存到文件中即可。\n\n### 文件命名约定\n\n现在，让我们看看如何为我们的数据文件选择合适的文件名。文件名应该是唯一的，这样文件就不会被意外覆盖。文件名也应该是描述性的；也就是说，它们应该告诉我们一些关于内容的信息。最后，我们希望文件扩展名能告诉我们如何查看该文件。后者通常通过选择合适的扩展名来实现——在我们的例子中是\
  \ `.csv`。以下是我为此示例选择的命名约定：\n\n*   包含 GPS 数据的文件名将以文本 “GPS-” 开头。\n*   接下来是 ISO 格式的日期和时间，省略分隔冒号，并在日期和时间之间加一个连字符：`YYYY-mm-dd-HH-MM-SS`，其中\
  \ `YYYY` 代表年，`mm` 代表月，`dd` 代表日，`HH` 代表小时，`MM` 代表分钟，`SS` 代表秒。如果某个值是一位数而需要两位数，则该值前面会补零。例如，五月将表示为\
  \ `05`，而不是 `5`。有关 ISO 格式的更多信息，请参考 ISO 8601，“数据元素和交换格式——信息交换——日期和时间的表示”（`http://www.iso.org`）。\n\
  *   所有文件都将具有 `.csv` 扩展名。\n\n遵循这些约定，文件名可能如下所示：\n\n```\nGPS-2008-05-30-09-10-52.csv\n\
  ```\n\n### 数据存储位置\n\n这是我们存储数据文件的地方：\n\n*   所有数据文件都存储在目录 `data` 中。所有脚本都存储在目录 `src`\
  \ 中。这两个目录都在同一个父目录 `Ch1` 下。因此，从 `src` 到 `data` 的相对路径是 `../data`。我们将在本书中遵循此约定。\n*\
  \   添加一个 `Readme.txt` 文件也是一个好主意。自述文件是纯文本文件，以合理的详细程度描述目录的内容。此类文件通常描述数据源、数据采集系统、负责数据收集的人员、收集数据的原因等。以下是一个示例：\n\
  \n```\nData recorded from a USB GPS receiver, connected to a Lenovo laptop T60.\n\
  Data was gathered via the serial port stored to clear text files (CSV).\nMeasurements\
  \ were taken to estimate speed and time spent in traffic.\nGathered by Shai Vaingast.\n\
  Date: throughout 2008, see file timestamps.\n```\n\n## 数据分析\n\n一旦数据组织好并可以从文件中访问，下一步就是提取信息。信息可以是与当前问题相关的值、图表或报告。\n\
  \n其理念是利用 Python 的脚本能力和广泛可用的现成包，编写一个完全自动化的应用程序来处理、分析和可视化数据。脚本是用高级编程语言相对快速地编写的小段代码。这里的关键词是生产力，即快速更改和测试算法并提取结果的能力。脚本在处理速度方面可能效率不高，但如果编写得当，它们不应减慢运行时间。例如，脚本可以生成图表，或搜索硬盘驱动器上的数据文件，分析日志文件，并提取最高和最低温度。在我们的案例中，当然，我们将使用它们来分析\
  \ GPS 数据。\n\n在我们的 GPS 案例研究中，我们将使用以下算法：\n\n1.  编译所有数据文件的列表。\n2.  对于每个文件：\n    1.\
  \  读取数据。\n    2.  处理数据。\n    3.  绘制数据图表。\n\n### 遍历目录\n\n为了编译包含 GPS 数据的所有文件的列表，我们使用模块\
  \ `os` 提供的函数 `os.walk()`，该模块是 Python 标准库的一部分。要使用 `os`，我们执行 `import os`：\n\n```\n\
  >>> import os\n>>> for root, dirs, files in os.walk('../data'):\n...    print(root,\
  \ dirs, files)\n...\n```\n\n\n\n```\n../data [] ['GPS-2008-05-30-09-00-50.csv',\
  \ 'GPS-2008-05-30-09-10-52.csv',\n'Readme.txt']\n```\n\n![Image](img/sq.jpg) **注意**\
  \  要在 Python 解释器中切换目录，首先需要执行 `import os`。然后，要切换到一个目录，请执行 `os.chdir(directory_path)`。要列出目录内容，可以使用\
  \ `os.listdir(directory_path)`。一些解释器（如 IPython）除了其他增强功能外，还允许你使用类似 shell 的命令，例如 `cd`\
  \ 和 `ls`，这大大提高了可用性。\n\n函数 `os.walk()` 会递归遍历 `data` 目录及其子目录，查找文件和文件夹，然后将结果存储在变量 `root`、`dirs`\
  \ 和 `files` 中。第二行打印出搜索的根目录。在我们的例子中，这意味着 `../data`（注意相对路径），然后是子目录，最后是文件本身，以列表形式呈现。到目前为止，我只记录了两个数据文件；但随着时间的推移，更多数据会被添加到这个文件夹中，文件数量可能会大幅增加。由于\
  \ `data` 文件夹中没有子目录，因此 `dirs` 对应的输出应该是一个空列表，用 `[]` 表示。\n\n在这里使用 `os.walk()` 函数有点大材小用。在我们的例子中，`data`\
  \ 目录没有任何子目录，我们完全可以像下面这样，使用 `os.listdir()` 函数调用来列出目录内容：\n\n```\n>>> os.listdir('../data')\n\
  ```\n\n```\n['GPS-2008-30-05-09-00-50.csv', 'GPS-2008-30-05-09-10-52.csv', 'Readme.txt']\n\
  ```\n\n然而，`os.walk()` 非常有用。将文件分组存放在目录中是很常见的。在这些目录中，你可能还会有子目录，存放更多的文件。例如，你可能希望根据记录数据的\
  \ GPS 来对文件进行分组。或者，如果另一个驾驶员正在记录 GPS 数据，你可能希望将这些数据放在 `data` 目录下的一个单独子目录中。在这些情况下，`os.walk()`\
  \ 正是你所需要的。\n\n现在我们已经有了 `data` 目录中所有文件的列表，我们可以只处理那些扩展名为 `.csv` 的文件。我们可以使用 `endswith()`\
  \ 函数来实现这一点，该函数检查字符串是否以 \"csv\" 结尾。不以 \"csv\" 结尾的文件会使用 `continue` 命令跳过：`continue`\
  \ 指示 `for` 循环跳过当前执行并继续处理下一个元素。以 \"csv\" 结尾的文件则会被读取和处理。为了从目录和文件名创建完整的文件路径，我们使用 `os.path.join()`\
  \ 函数，如代码清单 1-3 所示。\n\n***代码清单 1-3***. 仅处理 CSV 文件\n\n```\nfor root, dirs, files in\
  \ os.walk('data'):\n    for filename in files:\n        # 创建包含路径的完整文件名\n       \
  \ cur_file = os.path.join(root, filename)\n        if filename.endswith('csv'):\n\
  \            y = read_csv_file(cur_file)\n        else:\n            continue\n\n\
  #### 从这里开始，只处理扩展名为 .csv 的文件\n```\n\n## 读取 CSV 文件\n\n我们的下一步是读取文件。我们再次求助于 Python 的内置模块，这次是\
  \ `csv` 模块。尽管 CSV 文件格式非常流行，但没有明确的定义，每个电子表格和数据库都使用自己的“方言”。我们将处理的文件遵循最基本的 CSV 文件方言，因此我们将使用\
  \ Python 的 `csv` 模块的默认行为。由于我们将读取多个 CSV 文件，因此定义一个函数来执行此任务是合理的。代码清单 1-4 展示了这个函数。\n\
  \n***代码清单 1-4***. 一个用于读取 CSV 文件的函数\n\n```\ndef read_csv_file(filename):\n    \"\"\
  \"读取一个 CSV 文件并将其作为行列表返回。\"\"\"\n\ndata = []\n    for row in csv.reader(open(filename)):\n\
  \        data.append(row)\n    return data\n```\n\n第一行定义了一个名为 `read_csv_file()`\
  \ 的函数。CSV 文件支持是通过 `csv` 模块引入的，因此我们在调用该函数之前必须执行 `import csv`。该函数接受一个变量 `filename`，并返回一个包含文件中数据的行数组。换句话说，读取的每一行都会被处理并成为一个列表，其中每个逗号分隔的值都是该列表中的一个元素。该函数返回一个由这些列表组成的数组，如下例所示：\n\
  \n```\n>>> import csv\n>>> x = read_csv_file('../data/GPS-2008-06-04-09-03-45.csv')\n\
  >>> len(x)\n```\n\n```\n\n```\n\n```\n>>> x[10]\n```\n\n```\n['$GPGSV', '3', '3',\
  \ '12', '29', '10', '040', '', '16', '01', '302', '', '26', '01',\n'037', '', '00',\
  \ '00', '000', '*72']\n```\n\n```\n>>> x[1676]\n```\n\n```\n['$GPGSV', '3', '1',\
  \ '12', '21', '86', '258', '43', '18', '66', '286', '20', '15', '50',\n'059', '45',\
  \ '24', '44', '126', '43*72']\n```\n\n`len(x)` 告诉我们这个列表数组的大小。这也是我们确保数据确实被读入数组的一种粗略方法。\n\
  \n函数中的第二行被称为 *文档字符串*，其特点是用三个引号（`\"\"\"`）以如下方式包围文本：`\"\"\"文档字符串\"\"\"`。在这种情况下，文档字符串用于记录函数；也就是说，它使我们能够解释函数的功能。执行命令\
  \ `help(funcname)` 会显示其文档字符串：\n\n```\n>>> help(read_csv_file)\n```\n\n```\nHelp\
  \ on function read_csv_file in module __main__:\n\nread_csv_file(filename)\n   \
  \ Reads a CSV file and return it as a list of rows.\n```\n\n当你需要提醒自己某个函数的功能时，应该使用\
  \ `help()`。`help()` 可以用于函数以及模块。例如，以下是对 `csv` 模块调用 help：\n\n```\n>>> help(csv)\n\
  ```\n\n```\nHelp on module csv:\n\nNAME\n    csv - CSV parsing and writing.\n\n\
  DESCRIPTION\n    This module provides classes that assist in the reading and writing\n\
  \    of Comma Separated Value (CSV) files, and implements the interface\n    described\
  \ by PEP 305.  Although many CSV files are simple to parse,\n    the format is not\
  \ formally defined by a stable specification and\n    is subtle enough that parsing\
  \ lines of a CSV file with something\n    like line.split(\",\") is bound to fail.\
  \  The module supports three\n    basic APIs: reading, writing, and registration\
  \ of dialects.\n```\n\n`data = []` 这一行声明了一个名为 `data` 的变量，并将其初始化为一个空列表。我们将使用 `data`\
  \ 来存储来自 CSV 文件的值。\n\n`csv` 模块通过自动化许多与读取 CSV 文件相关的任务来帮助我们读取它们。我将在第 4 章和第 5 章中更详细地讨论\
  \ CSV 文件和 `csv` 模块；本章仅提供一个概述。\n\n以下是使用 `csv` 模块读取 CSV 文件的步骤：\n\n1.  打开文件以供读取。\n\
  2.  创建一个 `csv.reader` 对象。`csv.reader` 对象具有帮助我们读取 CSV 文件的函数。\n    1.  使用 `csv.reader`\
  \ 对象，从文件中逐行读取数据。\n    2.  将每一行追加到变量 `data` 中。\n3.  关闭文件。\n\n让我们逐步尝试一下：\n\n```\n\
  >>> import csv\n>>> f = open('../data/GPS-2008-06-04-09-03-45.csv')\n>>> cr = csv.reader(f)\n\
  >>> for row in cr:\n...     print(row)\n```\n\n\n\n```\n['$GPGSA', 'A', '3', '21',\
  \ '18', '15', '24', '', '22', '', '', '', '', '', '',\n'03.5', '02.2', '02.7*09']\n\
  ['$GPGSV', '3', '1', '12', '21', '86', '267', '39', '18', '66', '286', '44',\n'15',\
  \ '51', '060', '43', '24', '45', '125', '30*7A']\n['$GPGSV', '3', '2', '12', '06',\
  \ '28', '300', '33', '22', '27', '265', '31',\n'03', '18', '312', '27', '29', '15',\
  \ '185', '31*7C']\n['$GPGSV', '3', '3', '12', '09', '15', '138', '31', '16', '00',\
  \ '301', '',\n'19', '00', '332', '', '00', '00', '000', '*70']\n['$GPRMC', '140706.24',\
  \ 'A', '4455.6241', 'N', '09328.0519', 'W', '011.4',\n'152.7', '040608', '001.2',\
  \ 'E', 'A*25']\n['$GPGGA', '140706.24', '4455.6241', 'N', '09328.0519', 'W', '1',\
  \ '04', '03.0',\n'00295.1', 'M', '-030.7', 'M', '', '*51']\n['$GPGSA', 'A', '3',\
  \ '21', '18', '15', '24', '', '', '', '', '', '', '', '',\n'08.9', '03.0', '08.4*04']\n\
  ```\n\n```\n>>> f.close()\n```\n\n首先，我们打开数据文件并将其赋值给变量 `f`。现在可以通过变量 `f` 来引用已打开的文件。接下来，我们创建一个\
  \ `csv.reader` 对象 `cr`。我们将 `csv.reader` 对象 `cr` 与文件 `f` 关联起来。然后，我们遍历 `csv.reader`\
  \ 对象的每一行并打印该行。最后，我们通过调用 `f.close()` 来关闭文件。在完成文件操作后关闭文件是一种良好的实践；但如果你忘记这样做，一旦变量 `f`\
  \ 不再使用，Python 会自动关闭该文件。\n\n![Image](img/sq.jpg) **注意**  在执行命令后，你可能会收到类似这样的错误：`UnicodeEncodeError:\
  \ 'charmap' codec can't encode character '\\uABCD'`。如果发生这种情况，请在文本编辑器中打开 GPS 文件，确保文件包含正确的字母数字字符。请务必删除包含非字母数字字符的行。\n\
  \nPython 还允许你实现*级联函数*，即你可以根据其他函数的结果调用新函数。这个过程可以重复多次。级联（通常）能增加清晰度并生成更优雅的脚本。在我们的例子中，变量\
  \ `f` 对我们来说并不重要，因此我们在将其附加到 `csv.reader` 对象后便丢弃了它。我们可以通过级联函数，将前面的代码改写为如下形式：\n\n```\n\
  >>> cr = csv.reader(open('../data/GPS-2008-06-04-09-03-45.csv')):\n>>> for row in\
  \ cr:\n...     print(row)\n```\n\n变量 `cr` 也是如此，我们可以级联多个函数，生成更紧凑的代码行：\n\n```\n>>>\
  \ for row in csv.reader(open('../data/GPS-2008-06-04-09-03-45.csv')):\n...     print(row)\n\
  ```\n\n虽然脚本可能更短，但性能并没有提升。因此，建议仅在能增加清晰度时才使用级联函数；你很可能以后会编辑这段代码，能够理解代码的意图非常重要。事实上，有时不级联函数可能更有用，因为你可能需要访问中间变量（例如本例中的\
  \ `f` 和 `cr`）。\n\n`csv.reader` 对象将我们读取的每一行转换为一个字段行，形式为列表。然后，该行被追加到一个行列表中，并存储在变量\
  \ `data` 中。\n\n![Image](img/sq.jpg) **注意**  到目前为止，你已经多次看到点符号（`.`）。它的用法可能有点令人困惑，因此有必要解释一下。点符号用于访问模块的函数成员，以及对象（类）的函数成员。你已经在模块的成员函数（如\
  \ `csv.reader()`）中见过它，也在对象（如 `f.read()`）中见过它。在后一种情况中，它意味着文件对象有一个成员函数 `read()`，并且调用该函数来操作变量\
  \ `f`。要访问这些函数，我们使用点运算符。我们将在第 3 章中再次提及这一点。最后，我们使用省略号符号（`...`）来表示在 Python 中交互式输入命令时的行延续。\n\
  \n## 分析 GPS 数据\n\nGPS 格式（也称为 NMEA 0183）包含许多头部标记，其中一些包含对我们任务有用的信息。让我们仔细看看 GPS 数据：\n\
  \n*   每一行似乎都以一个文本头部标记开头，以字符 `$GP` 开始。\n*   有几种头部标记（例如，`$GPGSA` 和 `$GPRMC`）。\n* \
  \  头部之后是其他值，其中大部分是数字。\n\n![Image](img/sq.jpg) **注意**  NMEA 代表美国国家海洋电子协会（National\
  \ Marine Electronics Association）；更多信息请参见 `http://www.nmea.org`。NMEA 0183 数据格式的描述见\
  \ `http://www.gpsinformation.org/dale/nmea.htm`。\n\n如前所述，我们的数据文件中出现了几个 `$GP` 头部标记，但我们需要确定哪些标记与我们相关。首先，了解一下我们的数据文件中究竟存在哪些\
  \ NMEA 标准的头部标记会很有帮助。一种方法是打开文件，查找头部，并在看到每个新头部时将其记下。当然，另一种方法是使用 Python 为我们完成这项工作。\n\
  \nPython 是一种非常高级的编程语言。因此，它内置了对*字典*（在 Perl 中也称为关联数组）的支持，字典是一种键和值之间具有一对一关系的数据结构，非常类似于真实的字典。然而，传统的字典通常一个键对应多个值；也就是说，一个词（键）有多个解释（值）。你可以使用字典对象\
  \ `dict` 轻松地在 Python 中实现这一点，方法是将一个列表值赋给一个键。这样，每个键可以有多个条目，因为该键关联到一个可以容纳多个值的列表。实际上，这仍然是一对一的关系，但暂时先说到这里。我将在后续章节中更详细地介绍字典。我们在这里要做的是使用字典对象来记录每个头部被遇到的次数。我们的键将是\
  \ GPS 头部标记，我们的值将是一个表示出现次数的数字。每当遇到一个键时，我们就递增该值，如清单 1-5 所示。\n\n***清单 1-5***. 函数 `list_gps_commands()`\n\
  \n```\ndef list_gps_commands(data):\n    \"\"\"统计观察到的 GPS 命令的出现次数。\n\n返回一个字典对象。\"\
  \"\"\n\ngps_cmds = dict()\n    for row in data:\n        try:\n            gps_cmds[row[0]]\
  \ += 1\n        except KeyError:\n            gps_cmds[row[0]] = 1\n\nreturn gps_cmds\n\
  ```\n\n关于这个函数，有几点需要注意。首先，文档字符串跨越多行，这是文档字符串的主要优点之一。文档字符串将显示函数中所示的所有空格和换行符。其次，我们初始化一个变量\
  \ `gps_cmds` 作为我们的字典。然后，我们处理 GPS 数据中的每个列表：我们只关心每一行的第一个元素，因为那是保存 GPS 头部标记的值。然后，我们递增与键关联的值：`gps_cmds[row[0]]\
  \ += 1`。我们使用 `+=` 操作将值递增 1，类似于 C 语言中的做法（然而，Python 不使用 `++` 运算符）。如果键不存在（这会在我们遇到新的头部标记时发生），则会引发异常。我们通过\
  \ `except KeyError` 语句捕获该异常。在异常情况下，我们将与该键关联的字典值设置为 `1`。\n\n我们可以使用字典方法 `get()` 更紧凑地编写函数\
  \ `list_gps_commands()`；详情请参见第 3 章。\n\n让我们分析一些 GPS 数据：\n\n```\n>>> x = read_csv_file('../data/GPS-2008-05-30-09-00-50.csv')\n\
  >>> list_gps_commands(x)\n```\n\n```\n{'$GPGSA': 282, '$GPGSV': 846, '$GPGGA': 282,\
  \ '$GPRMC': 283}\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n我的 GPS 生成了四种不同的 GPS 头部信息。其中，只有两种是我们感兴趣的：`$GPGSV`（包含可见卫星数量，这非常重要！）和 `$GPRMC`（包含位置和速度信息）。\n\
  \n我们需要编写一个函数来处理 GPS 数据。每当头部字段是 `$GPGSV` 或 `$GPRMC` 时，该函数提取相关信息并将其存储在数值数组中，以便后续处理。数值数组由\
  \ *NumPy* 模块引入，因此我们需要 `import numpy`。由于我们将大量使用 *NumPy*、*SciPy* 和 *matplotlib* 的功能，更简单的方法是\
  \ `import pylab`，它会导入所有这些模块，如下所示：\n\n```\n>>> from pylab import *\n```\n\n![Image](img/sq.jpg)\
  \ **注意** *PyLab* 这个名称来源于 Python 和 MATLAB。*PyLab* 模块在 Python 中提供了类似 MATLAB 的功能。\n\
  \n## 提取 GPS 数据\n\n对于 `$GPGSV` 头部，卫星数量是第四个字段。对于 `$GPRMC` 头部，我们有更多有趣的信息。第二个字段是时间戳，第四个字段是纬度，第六个字段是经度，第八个字段是速度。更多细节请参考\
  \ NMEA 0183 格式。表 1-1 总结了 `$GPRMC` 行中的字段及其值。\n\n表 1-1. `$GPRMC` 信息（摘录）\n\n| 字段名 |\
  \ 索引 | 格式 |\n| --- | --- | --- |\n| 头部 | 0 | `$GPRMC`（固定） |\n| 时间戳 | 1 | *hhmmss.ss*\
  \ |\n| 纬度 | 3 | *DDMM.MMM* |\n| 经度 | 5 | *DDDMM.MMM* |\n| 速度 | 7 | *VVV.V* |\n\n\
  关于 `$GPRMC` 中的信息，我们需要记住一些注意事项。例如，让我们看一个任意行的时间戳：\n\n```\n>>> x[12]\n```\n\n```\n\
  ['$GPRMC', '140055.00', 'A', '4454.1740', 'N', '09325.0143', 'W', '000.0',\n'128.7',\
  \ '300508', '001.1', 'E', 'A*28']\n```\n\n在这个输出中，时间戳显示为 `'140055.00'`。它遵循格式 *hhmmss.ss*，其中\
  \ *hh* 是表示小时的两位数字（始终为两位数字——如果小时是一位数，比如早上 7 点，则会在前面加 0），*mm* 是表示分钟的两位数字（同样始终为两位数字），*ss.ss*\
  \ 是表示秒和秒的小数部分的五个字符（四位数字加小数点）。还有北/南字段以及东/西字段。这里，为简单起见，我们假设为北半球，但您可以通过读取整个 `$GPRMC`\
  \ 结构轻松更改这些值。\n\n![Image](img/sq.jpg) **注意** 在 ISO 时间格式中，我们使用 *HHMMSS* 表示小时、分钟和秒。在这种情况下，我们遵循\
  \ NMEA 的约定，使用 *hhmmss.ss* 表示小时、分钟和秒，然后使用 *DD* 和 *MM* 表示角度度数和分钟。\n\n时间戳字符串处理起来有点麻烦，尤其是在绘制数据时。第一个原因是它是一个字符串，而不是数字。但即使将其转换为数字，该系统也不利于绘图，因为一分钟有\
  \ 60 秒，而不是 100 秒。因此，我们要做的是“线性化”时间戳。为此，我们将时间戳转换为自午夜以来经过的秒数，如下所示：*T = hh * 3600 +\
  \ mm * 60 + ss.ss*。\n\n我们遇到的第二个问题是 *hh*、*mm* 和 *ss.ss* 是字符串，而不是数字。在 Python 中，将字符串相乘会得到完全不同的结果。在这种情况下，我们必须先将字符串转换为数值。具体来说，我们希望使用浮点数（即\
  \ `float`），因为表示秒的字符串中包含小数点。所有这些都可以很好地整合如下：\n\n```\n>>> row = x[18]\n>>> row\n```\n\
  \n```\n['$GPRMC', '140056.00', 'A', '4454.1740', 'N', '09325.0143', 'W', '000.0',\n\
  '128.7', '300508', '001.1', 'E', 'A*2B']\n```\n\n```\n>>> float(row[1][0:2])*3600+float(row[1][2:4])*60+float(row[1][4:6])\n\
  ```\n\n```\n50456.0\n```\n\n运算符 `[]` 表示索引，因此 `row[0]` 是头部，`row[1]` 是 `row` 的第二个字段（计数从零开始），它是一个字符串。字符串的前两个字符用\
  \ `[0:2]` 表示；从字符串中截取字符称为 ***字符串切片***。因此，要访问第一个字段的前两个字符，我们写为 `row[1][0:2]`。后续章节将详细介绍字符串及其切片方法。\n\
  \n接下来，我们处理纬度和经度。我们面临与时间戳相同的问题，只是这里处理的是度数。纬度遵循格式 *DDMM.MMM*，其中 *DD* 表示度数，*MM.MMM*\
  \ 表示分钟。这次，我们将使用度数；将分钟转换为度数可以使后续计算更简单。要将纬度转换为十进制度数，我们需要将分钟除以 60：\n\n```\n>>> row\
  \ = x[18]\n>>> row\n```\n\n```\n['$GPRMC', '140056.00', 'A', '4454.1740', 'N', '09325.0143',\
  \ 'W', '000.0',\n'128.7', '300508', '001.1', 'E', 'A*2B']\n```\n\n```\n>>> float(row[3][0:2])+float(row[3][2:])/60.0\n\
  ```\n\n```\n44.9029\n```\n\n对于纬度信息，我们需要第四个字段，因此使用 `row[3]`。这个例子还引入了另一种表示法 `[2:]`，它指的是从第三个字符到字符串末尾的切片。\n\
  \n需要注意的是，自 Python 3.x 起，除法的默认行为发生了变化。在 Python 2.x 中，默认除法是整数除法。在 Python 3.x 中，默认除法是浮点数除法。执行表达式\
  \ `100/60` 在 Python 2.x 和 Python 3.x 中返回的结果不同，如下所示：\n\n在 Python 2.x 中，将 100 除以 60\
  \ 返回以下结果：\n\n```\n>>> 100/60\n```\n\n```\n1\n```\n\n在 Python 3.x 中，它返回以下结果：\n\n\
  ```\n>>> 100/60\n```\n\n```\n1.6666666666666667\n```\n\n为了确保在 Python 2.x 中进行浮点数除法，通常的做法是添加一个小数点，即\
  \ `100/60.0`（注意点零）。在 Python 3.x 中添加小数点也可以（尽管不是必需的，因为浮点数除法是默认行为）。但是，如果您想在 Python\
  \ 3.x 中执行整数除法呢？答案很简单：使用整数除法运算符 `//`：\n\n```\n>>> 100//60\n```\n\n```\n1\n```\n\n\
  在本书中，我们将使用 Python 3.x 的默认浮点数除法。\n\n也可以使用 `int()` 函数将值转换为整数值，如下所示：\n\n```\n>>> int(100/60)\n\
  ```\n\n```\n1\n```\n\n经度信息与纬度类似，但有一个细微差别：经度度数是三个字符而不是两个（最多 180 度，而不仅仅是 90 度），因此字符串的索引不同。\n\
  \n清单 1-6 展示了处理 GPS 数据的完整函数。\n\n***清单 1-6***. 函数 `process_gps_data()`\n\n```\nNMI\
  \ = 1852.0\ndef process_gps_data(data):\n    \"\"\"Processes GPS data, NMEA 0183\
  \ format.\n\n    Returns a tuple of arrays: latitude, longitude, velocity [km/h],\n\
  \    time [sec] and number of satellites.\n    See also: http://www.gpsinformation.org/dale/nmea.htm.\n\
  \    \"\"\"\n\n    latitude    = []\n    longitude   = []\n    velocity    = []\n\
  \    t_seconds   = []\n    num_sats    = []\n\n    for row in data:\n        if\
  \ row[0] == '$GPGSV':\n            num_sats.append(float(row[3]))\n        elif\
  \ row[0] == '$GPRMC':\n            t_seconds.append(float(row[1][0:2])*3600 + \\\
  \n                float(row[1][2:4])*60+float(row[1][4:6]))\n            latitude.append(float(row[3][0:2])\
  \ + \\\n                float(row[3][2:])/60.0)\n            longitude.append((float(row[5][0:3])\
  \ + \\\n                float(row[5][3:])/60.0))\n            velocity.append(float(row[7])*NMI/1000.0)\n\
  \n    return (array(latitude), array(longitude), \\\n            array(velocity),\
  \ array(t_seconds), array(num_sats))\n```\n\n以下是关于 `process_gps_data()` 函数的一些说明：\n\
  \n\n\n*   `NMI`被定义为`1852.0`，即一海里对应的米数，也等于赤道上的一分。常量`NMI`未在函数内部定义的原因是，我们也希望在函数外部使用它。\n\
  *   我们通过将返回值`latitude`、`longitude`、`velocity`、`t_seconds`和`num_sats`设置为空列表`[]`来初始化它们。初始化列表会创建它们，并允许我们使用`append()`方法向列表中添加值。\n\
  *   `if`和`elif`语句不言自明：`if`是条件子句，`elif`相当于“否则，如果”。也就是说，如果第一个条件不成立，但下一个条件成立，则执行后续代码块。\n\
  *   出现在多个计算和`return`行中的符号`\\`表示操作在下一行继续。\n*   最后，返回值是一个数组元组。*元组*是一个不可变的序列，意味着你不能更改它。因此，元组表示一个不可变的项目序列（与列表相对，列表是可变的序列）。我们返回元组（而不是二维数组）的原因是，我们可能返回不同长度的列表：卫星数量列表的长度可能与经度列表的长度不同，因为它们来自不同的头部标记。\n\
  \n以下是调用`process_gps_data()`的方法：\n\n```\n>>> y = read_csv_file('../data/GPS-2008-05-30-09-00-50.csv')\n\
  >>> (lat, long, v, t, sats) = process_gps_data(y)\n```\n\n第二行引入了序列解包，它允许进行多重赋值。有了这些函数，我们就可以绘制数据了！\n\
  \n## 数据可视化\n\n下一步是可视化数据。我们将大量依赖`matplotlib`包。我们已经通过命令`from pylab import *`导入了`matplotlib`，因此目前无需额外导入。是时候读取数据并绘制轨迹了。\n\
  \n我们的第一个问题是信息以纬度和经度给出。纬度和经度是球面坐标，即球体（地球）上的点。但我们想要一个类似地图的图，它使用笛卡尔坐标，即`x`和`y`。因此，我们首先必须将球面坐标转换为笛卡尔坐标。我们将使用清单\
  \ 1-7 中所示的快速但粗略的方法来做到这一点；只要行进距离相对于地球半径较小，这种方法实际上相当准确。\n\n**清单 1-7.** “快速但粗略的”球面到笛卡尔坐标转换\n\
  \n```\nx = longitude*NMI*60.0*cos(latitude)\ny = latitude*NMI*60.0\n```\n\n为了证明这一点，请考虑以下推理：当你向北极移动时，你所在位置的周长变得越来越小，直到北极点处为零。因此，在纬度\
  \ 0°（赤道）处，每度（经度）意味着比在纬度 45° 处行进更远的距离。这就是为什么`x`不仅取决于经度值本身，还取决于纬度：纬度越高，经度变化在距离上的影响越小。另一方面，`y`（南北方向）不依赖于经度。\n\
  \n接下来要理解的是，地球是一个球体；每当我们绘制 x-y 地图时，我们实际上只是绘制该球体在我们选择的平面上的投影。因此，我们将其表示为`(px, py)`，其中`p`代表“投影”。我们将最东南的点作为\
  \ GPS 数据投影的起点：`(px, py) = (0, 0)`。这转化为清单 1-8 中所示的代码。\n\n**清单 1-8.** 将行进轨迹投影到笛卡尔坐标\n\
  \n```\npy = (lat-min(latitude))*NMI*60.0\npx = (long-min(longitude))*NMI*60.0*cos(D2R*latitude)\n\
  ```\n\n需要注意的几点包括：\n\n*   变量`py`和`px`是浮点值数组。使用*NumPy*，我们可以无缝地对整个数组进行操作。\n*   `D2R`是一个等于π/180\
  \ 的常量，用于将度转换为弧度。\n*   为了将 y 轴设置在最小纬度处，将 x 轴设置在最小经度处，我们从纬度和经度值中分别减去最小纬度和最小经度值。\n\n\
  ## GPS 位置图\n\n现在，期待已久的时刻到了：绘制 GPS 数据。为了能够跟随并绘制数据，请确保按照前面的详细说明定义函数`read_csv_file()`和`process_gps_data()`，并将文件名变量设置为指向你的\
  \ GPS 数据文件。我已抑制了`matplotlib`的响应，以便代码更易于理解：\n\n```\n>>> filename = 'GPS-2008-05-30-09-00-50.csv'\n\
  >>> y = read_csv_file('../data/'+filename)\n>>> (lat, long, v, t, sats) = process_gps_data(y)\n\
  >>> px = (long-min(long))*NMI*60.0*cos(D2R*lat)\n>>> py = (lat-min(lat))*NMI*60.0\n\
  >>> figure()\n>>> gca().axes.invert_xaxis()\n>>> plot(px, py, 'b', label='Cruising',\
  \ linewidth=3)\n>>> title(filename[:-4])\n>>> legend(loc='upper left')\n>>> xlabel('east-west\
  \ (meters)')\n>>> ylabel('south-north (meters)')\n>>> grid()\n>>> axis('equal')\n\
  >>> show()\n```\n\n图 1-1 显示了结果，相当令人满意。\n\n![9781484200537_Fig01-01.jpg](img/9781484200537_Fig01-01.jpg)\n\
  \n**图 1-1.** GPS 数据\n\n我们使用了大量新函数，它们都是`matplotlib`包的一部分：`plot()`、`grid()`、`xlabel()`、`legend()`等。其中大部分不言自明：\n\
  \n*   `xlabel(string_value)`和`ylabel(string_value)`分别在 x 轴和 y 轴上打印标签。我们使用`title(string_value)`在图形上方打印标题。标题中的字符串值是文件名直到末尾，减去四个字符（以便不显示“.csv”）。我们通过使用负值的字符串切片来实现这一点，这表示“从末尾开始”。\n\
  *   `legend()`在图例框中打印与图形关联的标签。`legend()`高度可配置（详情请参见`help(legend)`）。该示例将图例绘制在左上角。\n\
  *   `grid()`绘制网格线。你可以相当广泛地控制网格的行为。\n*   `plot()`需要额外解释，因为它是最通用的。命令`plot(px, py,\
  \ 'b', label='Cruising', linewidth=3)`使用字符`'b'`指定的蓝色绘制`px`和`py`。该图被标记为“Cruising”；因此，稍后当我们调用`legend()`函数时，正确的文本将与数据关联。最后，我们将线宽设置为\
  \ 3。\n*   函数`axis()`控制图形轴的行为。通常，我不会调用`axis()`函数，因为`plot()`在选择正确的值方面做得很好。然而，在这种情况下，正确可视化数据很重要。这意味着我们需要\
  \ x 轴和 y 轴具有相等的增量，以便图形真实反映所描绘的路径。这通过调用`axis('equal')`实现。还有其他值可以控制轴的行为，如`help(axis)`所述。\n\
  *   最后，`gca().axes.invert_xaxis()`是一个相当特殊的补充。它源于我们喜欢查看地图和方向的方式。在经度上，递增的值从右到左显示。然而，在数学图形中，递增的值通常从左到右显示。此函数调用指示\
  \ x 轴从右到左递增，就像地图一样。\n*   当我们完成图形准备后，调用`show()`函数显示输出。\n\n包含前述函数的`Matplotlib`是一个全面的绘图包，将在第\
  \ 6 章中更详细地探讨。\n\n## 注释图形\n\n\n\n我们希望在 GPS 图中添加更多信息。例如，我们想知道在哪里停车以及在哪里超速。为此，我们使用`find()`函数，它是`PyLab`包的一部分。`find()`函数返回满足条件的索引数组。在我们的例子中，我们想知道以下内容：\n\
  \n```\n>>> STANDING_KMH = 10.0\n>>> SPEEDING_KMH = 50.0\n>>> Istand = find(v < STANDING_KMH)\n\
  >>> Ispeed = find(v > SPEEDING_KMH)\n>>> Icruise = find((v >= STANDING_KMH) & (v\
  \ <= SPEEDING_KMH))\n```\n\n我们还计算了巡航（即既不超速也不停车）的时间，以便后续处理。\n\n为了在图上标注这些点，我们在当前图的基础上再添加一个绘图。不过，这次我们改变了绘图的颜色，并使用符号而不是实心蓝线。组合`'sg'`表示绿色方块符号（`g`代表绿色，`s`代表方块）；组合`'or'`表示红色圆圈（`r`代表红色，`o`代表圆圈）。我建议你为停车和超速使用不同的符号，而不仅仅是颜色，因为图形可能会在单色打印机上打印。`plot()`函数支持多种符号和颜色；详情请查阅交互式帮助。我们绘制的值仅是由`find()`函数返回的那些值：\n\
  \n```\n>>> plot(px[Istand], py[Istand], 'sg', label='Standing')\n>>> plot(px[Ispeed],\
  \ py[Ispeed], 'or', label='Speeding!')\n>>> legend(loc='upper left')\n```\n\n图 1-2\
  \ 显示了结果。\n\n![9781484200537_Fig01-02.jpg](img/9781484200537_Fig01-02.jpg)\n\n图 1-2.\
  \ 带有额外速度信息的 GPS 数据\n\n我们还想知道汽车行驶的方向。为了实现这一点，我们将使用`text()`函数，它允许我们将字符串写入图中的任意位置。因此，要在位置(10,10)添加文本“Hi”，我们执行命令`text(10,\
  \ 10, 'Hi')`。`text()`函数的一个优点是我们可以以任意角度旋转文本。要在位置(10,10)以 45 度角绘制“Hi”，我们执行`text(10,10,\
  \ 'Hi', rotation=45)`。我们实现方向信息的方法是以汽车行驶的角度旋转文本“>>>”。我们只执行十次，以免“>”符号使图形过于杂乱。计算汽车在给定点`i`的行驶方向如清单\
  \ 1-9 所示。\n\n***清单 1-9***. 计算行驶方向\n\n```\ndx = px[i+1]-px[i]\ndy = py[i+1]-py[i]\n\
  heading = arctan2(dy, dx)\n```\n\n虽然我们可以使用`arctan(dy/dx)`来计算方向，但我选择使用`arctan2(dy,dx)`函数。使用`arctan2()`而非`arctan()`的好处有两点：1)\
  \ 没有除法，因此不会在`dx`为零时导致除零异常；2) `arctan2()`保留从-180 度到 180 度的角度，而`arctan()`仅产生 0 度到\
  \ 180 度之间的值。以下代码添加了方向符号：\n\n```\n>>> for i in range(0, len(v), len(v)//10-1):\n\
  ...     text(px[i], py[i], \">>>\", \\\n...         rotation = arctan2(py[i+1]-py[i],\
  \ -(px[i+1]-px[i]))/D2R, \\\n...         ha='center')\n```\n\n请注意，我使用了整数除法来计算十个索引，如下所示：`len(v)//10-1`。原因：数组的索引必须是整数，不能是浮点数（数组中不存在第\
  \ 1.37 个元素）。\n\n图 1-3 显示了生成的图形。\n\n![9781484200537_Fig01-03.jpg](img/9781484200537_Fig01-03.jpg)\n\
  \n图 1-3. 带有行驶方向的 GPS 图\n\n## 速度图\n\n我们现在来绘制速度图。这要简单得多：\n\n```\n>>> figure()\n>>>\
  \ t = (t-t[0])/60.0\n>>> plot(t, v, 'k')\n>>> plot([t[0], t[-1]], [STANDING_KMH,\
  \ STANDING_KMH], '-g')\n>>> text(t[0], STANDING_KMH, \\\n...      \" Standing threshold:\
  \ \"+str(STANDING_KMH))\n>>> plot([t[0], t[-1]], [SPEEDING_KMH, SPEEDING_KMH], '-r')\n\
  >>> text(t[0], SPEEDING_KMH, \\\n...      \" Speeding threshold: \"+str(SPEEDING_KMH))\n\
  >>> grid()\n>>> title('Velocity')\n>>> xlabel('Time from start of file (minutes)')\n\
  >>> ylabel('Speed (Km/H)')\n>>> show()\n```\n\n我们首先使用`figure()`命令打开一个不同的图形。接着，我们将时间刻度单位转换为分钟，这个值对大多数人来说比秒更容易理解。选择合适的测量单位很重要。大多数人会觉得“我开了\
  \ 30 分钟”比“我开了 1800 秒”更容易理解。我们还将时间轴设置为从`t[0]`开始。接下来，我们用黑色绘制速度随时间变化的函数。好的图形需要标注，因此我们选择添加两条线来描述停车和超速的阈值，以及描述这些阈值的文本。为了生成文本，我们将文本“Standing\
  \ threshold”与阈值（使用`str()`将其转换为字符串后）结合起来，并使用`+`运算符连接字符串。最后，当然是标题、*x*和*y*轴标签以及网格。图\
  \ 1-4 显示了最终结果。\n\n![9781484200537_Fig01-04.jpg](img/9781484200537_Fig01-04.jpg)\n\
  \n图 1-4. 速度随时间变化图\n\n### 子图\n\n我们还希望显示一些统计数据。但在那之前，最好将所有图形（GPS 图、速度图和统计图）合并到一个图中。为此，我们使用`subplot()`函数。`subplot()`是一个`matplotlib`函数，它将绘图区域划分为几个称为子图的较小部分，并选择要处理的子图。例如，`subplot(1,\
  \ 2, 1)`通知后续的绘图命令，要处理的区域是 1 行 2 列的子图，并且当前选中的子图是 1；换句话说，它是绘图区域左侧的一半。`subplot(2, 2,\
  \ 2)`将选择右上角的子图；`subplot(2, 2, 4)`将选择右下角的子图。在这种场景下，我发现最易读的选择是让 GPS 数据占据绘图区域的一半，速度图占据四分之一，统计图占据另外四分之一。每次`subplot()`调用应在调用绘图命令（例如`plot()`）之前进行。\n\
  \n## 文本\n\n有时，传达信息的最佳方式是使用文本，而不是图形。在本节中，我们将工作范围限制在统计图所在的四分之一区域。我们的第一个任务是去掉绘图框架以及*x*和*y*刻度。我们只需要一个空白画布来显示文本。我们可以通过执行以下命令来实现：\n\
  \n```\n>>> subplot(2, 2, 4)\n>>> axis('off')\n```\n\n第一次调用`subplot()`将我们的工作区域选择为右下角的四分之一区域。第二行代码移除坐标轴并隐藏框架框。\n\
  \n是时候计算一些统计数据了。GPS 数据似乎以固定的时间间隔（通常为一秒）发送。因此，要计算停车时间（以秒为单位），我们计算向量`Istand`的长度。同样，要计算超速时间，我们可以计算`Ispeed`的长度。为了估算这些值所占的百分比，我们将`Istand`和`Ispeed`向量的长度除以速度向量的长度，再乘以\
  \ 100。要计算平均速度，我们使用`mean()`函数，它是`PyLab`的一部分。\n\n我们还希望计算总行驶距离。距离可以计算为每两个连续数据点之间距离的总和。`diff()`函数返回输入向量的差分向量：\n\
  \n```\n>>> diff([1, 4, 0, 2])\n```\n\n```\narray([ 3, -4,  2])\n```\n\n这非常有用，因为我们现在可以计算距离：\n\
  \n```\n>>> sum(sqrt(diff(px)**2+diff(py)**2))\n```\n\n```\n1652.1444099624528\n\
  ```\n\n\n\n这样，我们就能得到总行驶距离。\n\n为了自动化打印统计信息的整个过程，我们将要打印的文本存储在变量 `stats` 中，它是一个字符串列表。我们还使用了一种类似于\
  \ C 语言 `printf()` 函数的字符串格式化方法，尽管语法略有不同。`%s` 表示字符串，而 `%f` 表示浮点数。在我们的例子中，`%.1f` 表示小数点后保留一位的浮点数，`%d`\
  \ 表示整数。以下代码生成了统计文本：\n\n```\n>>> Total_distance  = float(sum(sqrt(diff(px)**2+diff(py)**2))/1000.0)\n\
  >>> Stand_time  = len(Istand)/60.0\n>>> Cruise_time = len(Icruise)/60.0\n>>> Speed_time\
  \  = len(Ispeed)/60.0\n>>> Stand_per   = 100*len(Istand)/len(v)\n>>> Cruise_per\
  \  = 100*len(Icruise)/len(v)\n>>> Speed_per   = 100*len(Ispeed)/len(v)\n>>> Stats=['Statistics',\
  \ \\\n...    '%s' % filename, \\\n...    'Number of data points: %d' % len(y), \\\
  \n...    'Average number of satellites: %d' % mean(sats), \\\n...    'Total driving\
  \ time: %.1f minutes:' % (len(v)/60.0), \\\n...    '    Standing: %.1f minutes (%d%%)'\
  \ % \\\n...    (Stand_time, Stand_per), \\\n...    '    Cruising: %.1f minutes (%d%%)'\
  \ % \\\n...    (Cruise_time, Cruise_per), \\\n...    '    Speeding: %.1f minutes\
  \ (%d%%)' % \\\n...    (Speed_time, Speed_per), \\\n...    'Average speed: %d km/h'\
  \ % mean(v), \\\n...    'Total distance travelled: %.1f Km' % Total_distance ]\n\
  ```\n\n为了在画布上打印文本，我们再次使用了 `text()` 函数。这次，我们使用了一个 `for` 循环，遍历 `stats` 列表中的每一个字符串：\n\
  \n```\n>>> for index, stat_line in enumerate(reversed(stats)):\n...    text(0, index,\
  \ stat_line, va='bottom')\n...\n>>> plot([index-.2, index-.2])\n>>> axis([0, 1,\
  \ -1, len(stats)])\n```\n\n我们引入了两个新函数。一个是 `reversed()`，它按逆序返回 `stats` 中的元素。第二个是\
  \ `enumerate()`，它不仅返回 `stats` 数组中的每一行，还返回每一行的索引。因此，当变量 `stat_line` 被赋值为 `'Average\
  \ speed...'` 时，变量 `index` 被赋值为 `8`，这表示 `stats` 中的第九行。我们想知道索引的原因是将其用作 y 轴上的位置。最后，文本的垂直对齐方式选择为\
  \ `bottom`，如参数 `va='bottom'` 所示（`va` 是 vertical alignment 的缩写）。\n\n## 整合所有代码\n\n\
  最后，清单 1-10 展示了用于分析和绘制 `data` 目录下所有 GPS 文件的完整代码。\n\n***清单 1-10***. 脚本 gps.py\n\n\
  ```\nfrom pylab import *\nimport csv, os\n\n### constant definitions\nSTANDING_KMH\
  \ = 10.0\nSPEEDING_KMH = 50.0\nNMI = 1852.0\nD2R = pi/180.0\n\ndef read_csv_file(filename):\n\
  \    \"\"\"Reads a CSV file and return it as a list of rows.\"\"\"\n\ndata = []\n\
  \    for row in csv.reader(open(filename)):\n        data.append(row)\n    return\
  \ data\n\ndef process_gps_data(data):\n    \"\"\"Processes GPS data, NMEA 0183 format.\n\
  \nReturns a tuple of arrays: latitude, longitude, velocity [km/h],\ntime [sec] and\
  \ number of satellites.\nSee also: http://www.gpsinformation.org/dale/nmea.htm.\n\
  \    \"\"\"\n\nlatitude    = []\n    longitude   = []\n    velocity    = []\n  \
  \  t_seconds   = []\n    num_sats    = []\n\nfor row in data:\n        if row[0]\
  \ == '$GPGSV':\n            num_sats.append(float(row[3]))\n        elif row[0]\
  \ == '$GPRMC':\n            t_seconds.append(float(row[1][0:2])*3600 + \\\n    \
  \            float(row[1][2:4])*60+float(row[1][4:6]))\n            latitude.append(float(row[3][0:2])\
  \ + \\\n                float(row[3][2:])/60.0)\n            longitude.append((float(row[5][0:3])\
  \ + \\\n                float(row[5][3:])/60.0))\n            velocity.append(float(row[7])*NMI/1000.0)\n\
  \nreturn (array(latitude), array(longitude), \\\n        array(velocity), array(t_seconds),\
  \ array(num_sats))\n\n### read every data file, filter and plot the data\nfor root,\
  \ dirs, files in os.walk('../data'):\n    for filename in files:\n        # create\
  \ full filename including path\n        cur_file = os.path.join(root, filename)\n\
  \        if filename.endswith('csv'):\n            y = read_csv_file(cur_file)\n\
  \        else:\n            continue\n\n### only files with the .csv extension from\
  \ here on\n\n### process GPS data\n        (lat, long, v, t, sats) = process_gps_data(y)\n\
  \n### translate spherical coordinates to Cartesian\n        py = (lat-min(lat))*NMI*60.0\n\
  \        px = (long-min(long))*NMI*60.0*cos(D2R*lat)\n\n### find out when standing,\
  \ speeding or cruising\n        Istand = find(v < STANDING_KMH)\n        Ispeed\
  \ = find(v > SPEEDING_KMH)\n        Icruise = find((v >=STANDING_KMH) & (v <= SPEEDING_KMH))\n\
  \n### left side, GPS location graph\n        figure()\n        subplot(1, 2, 1)\n\
  \n### longitude values go from right to left,\n        # we want increasing values\
  \ from left to right\n        gca().axes.invert_xaxis()\n\nplot(px, py, 'b', label='\
  \ Cruising', linewidth=3)\n        plot(px[Istand], py[Istand], 'sg', label=' Standing')\n\
  \        plot(px[Ispeed], py[Ispeed], 'or', label=' Speeding!')\n\n### add direction\
  \ of travel\n        for i in range(0, len(v), len(v)//10-1):\n            text(px[i],\
  \ py[i], \">>>\", \\\n                rotation=arctan2(py[i+1]-py[i], -(px[i+1]-px[i]))/D2R,\
  \ \\\n                ha='center')\n\n### legends and labels\n        title(filename[:-4])\n\
  \        legend(loc='upper left')\n        xlabel('east-west (meters)')\n      \
  \  ylabel('south-north (meters)')\n        grid()\n        axis('equal')\n\n# top\
  \ right corner,  speed graph\n        subplot(2, 2, 2)\n\n### set the start time\
  \ as t[0]; convert to minutes\n        t = (t-t[0])/60.0\n        plot(t, v, 'k')\n\
  \n### plot the standing and speeding threshold lines\n        plot([t[0], t[-1]],\
  \ [STANDING_KMH, STANDING_KMH], '-g')\n        text(t[0], STANDING_KMH, \\\n   \
  \         \" Standing threshold: \"+str(STANDING_KMH))\n        plot([t[0], t[-1]],\
  \ [SPEEDING_KMH, SPEEDING_KMH], '-r')\n        text(t[0], SPEEDING_KMH, \\\n   \
  \         \" Speeding threshold: \"+str(SPEEDING_KMH))\n        grid()\n\n### legend\
  \ and labels\n        title('Velocity')\n        xlabel('Time from start of file\
  \ (minutes)')\n        ylabel('Speed (Km/H)')\n\n### right side corner, statistics\
  \ data\n        subplot(2, 2, 4)\n\n### remove the frame and x/y axes. we want a\
  \ clean slate\n        axis('off')\n\n### generate an array of strings to be printed\n\
  \        Total_distance  = sum(sqrt(diff(px)**2+diff(py)**2)/1000.0)\n        Stand_time\
  \  = len(Istand)/60.0\n        Cruise_time = len(Icruise)/60.0\n        Speed_time\
  \  = len(Ispeed)/60.0\n        Stand_per   = 100*len(Istand)/len(v)\n        Cruise_per\
  \  = 100*len(Icruise)/len(v)\n        Speed_per   = 100*len(Ispeed)/len(v)\n   \
  \     stats = ['Statistics', \\\n        '%s' % filename, \\\n        'Number of\
  \ data points: %d' % len(y), \\\n        'Average number of satellites: %d' % mean(sats),\
  \ \\\n        'Total driving time: %.1f minutes:' % (len(v)/60.0), \\\n        '\
  \    Standing: %.1f minutes (%d%%)' % \\\n        (Stand_time, Stand_per), \\\n\
  \        '    Cruising: %.1f minutes (%d%%)' % \\\n        (Cruise_time, Cruise_per),\
  \ \\\n        '    Speeding: %.1f minutes (%d%%)' % \\\n        (Speed_time, Speed_per),\
  \ \\\n        'Average speed: %d km/h' % mean(v), \\\n        'Total distance traveled:\
  \ %.1f Km' % Total_distance ]\n\n### display statistics information\n        for\
  \ index, stat_line in enumerate(reversed(stats)):\n            text(0, index, stat_line,\
  \ va='bottom')\n\n### draw a line below the \"Statistics\" text\n        plot([index-.2,\
  \ index-.2])\n\n### set axis properly so all the text is displayed\n        axis([0,\
  \ 1, -1, len(stats)])\nshow()\n```\n\n图 1-5 展示了最终结果。\n\n![9781484200537_Fig01-05.jpg](img/9781484200537_Fig01-05.jpg)\n\
  \n图 1-5. 对某些 GPS 数据运行 gps.py 的输出结果\n\n## 最后说明与参考资料\n\n\n\n### GPS 问题与开发环境\n\n此处描述的\
  \ GPS 问题本质上是研发性质的工作：它涉及计算与中间结果，而非最终产品。研究或研发工作，尤其是可行性研究，需要快速响应。这意味着要尽可能使用现成的工具，并将它们组合起来完成任务。如果这些工具价格低廉，甚至是免费的，那更是使用它们的理由。\n\
  \n在本书中，我们将探讨不同的软件包和模块，并展示如何利用它们进行数据分析和可视化。我们将遵循开源软件这一主题，包括根据 GNU 通用公共许可证 (GPL) 和\
  \ Python 软件基金会 (PSF) 许可证发布的软件。这些工具的例子包括 GNU/Linux，当然还有 Python。\n\n使用 Python 开发数据分析和可视化脚本有几个好处：\n\
  \n*   代码开发和编写速度快，这对研究工作很有吸引力。\n*   现成的软件包进一步提高了生产力，并确保了结果的准确性。\n*   脚本引入了自动化。修改算法很容易实现。\n\
  \n本书将详细介绍大量脚本，我旨在涵盖你在实际工作中可能遇到的大部分问题。从简单的一行命令到更复杂的脚本，示例包括用 Python 编写的处理二进制文件、合并来自不同来源的数据、执行文本解析、使用高级数值算法等等的脚本。我们将特别关注数据可视化以及如何在\
  \ Python 中获得令人满意的结果。不过，首先，你必须搭建并运行 Python 环境，这将在下一章中介绍。\n\n如果你想更全面地了解 Python（不一定是针对数据分析和可视化），Python\
  \ 官方网站是一个极好的资源：\n\n*   Python 编程语言——官方网站，`http://www.python.org`\n\n本章中使用的其他参考资料包括：\n\
  \n*   `pySerial`，`http://pyserial.sourceforge.net/`\n*   “数据元素和交换格式——信息交换——日期和时间的表示”，`http://www.iso.org`\n\
  *   NMEA 0183，`http://www.nmea.org` 和 `http://www.gpsinformation.org/dale/nmea.htm`\n\
  \n"
- "# 第 2 章：环境\n\n![image](img/frontdot.jpg)\n\n## 行业工具\n\n第 1 章 通过一个涉及 GPS 数据收集、分析和可视化的案例研究，展示了\
  \ Python 的实际应用。要自己使用 Python，你首先需要构建自己的开发环境。本章将引导你了解所需的各种软件组件，并帮助你权衡安装选项。除非你已经熟悉\
  \ Python 并且安装了我们在第 1 章中使用的软件包，否则请继续阅读。\n\n建立一个用于分析和可视化数据的可靠环境，需要通用软件组件，以及 Python\
  \ 和一些用于数据分析和可视化的额外 Python 包。对于通用软件，你需要：\n\n*   一个操作系统 (OS)\n*   一个用于编写代码的文本编辑器\n\
  *   一个图像查看器\n*   用于展示和查看结果的工具\n*   一个版本控制系统\n\n在接下来的章节中，我们将更详细地审视这些组件的选项，并推荐一些可以提高生产力的组件。如果你已经对某个通用软件组件感到满意，请务必使用它，而不是这里推荐的。另一方面，所讨论的特定于\
  \ Python 的组件是运行本书示例所需的工具。当一个组件是必需组件时，我会明确说明。本章以线性方式介绍各种软件组件，从基础开始逐步构建——首先是操作系统，然后是\
  \ Python 和 Python 包，最后是支持性软件组件。\n\n![Image](img/sq.jpg) **注意** 尽管本章以线性方式组织，但如果你已经知道将要使用哪些应用程序，可以随意跳过通用软件组件部分。但是，你应该确保正确安装了特定于\
  \ Python 的组件；本书中提供的代码均基于此假设。\n\n## 操作系统\n\n开发环境建立在操作系统之上。作为基础，你的选择可以是基于 UNIX 的操作系统（例如\
  \ GNU/Linux 和 Mac OS X）或 Windows。我们将重点介绍 Linux 和 Windows，但由于 Mac OS 是基于 UNIX 的操作系统，因此关于\
  \ Linux 的大部分讨论也适用于它。有关支持的操作系统的完整列表，请参阅 Python 网站 (`https://www.python.org`)，该网站是所有\
  \ Python 相关内容的极好资源。\n\n### GNU/Linux\n\nLinux 是一个通用术语，用于描述基于 Linux 内核的类 UNIX 操作系统。Linux\
  \ 发行版是一个集合，包含 Linux 内核以及提供完整操作系统的附加软件包。大多数发行版提供的功能不仅仅是基本的操作系统功能；它们还提供额外的软件包，例如多媒体应用程序、游戏、办公生产力套件等等。大多数\
  \ Linux 发行版中的相当一部分软件包都基于 GNU 项目 (`http://www.gnu.org`)——因此得名 GNU/Linux。\n\n目前有大量的\
  \ Linux 发行版 (distros) 可用，包括（但不限于）以下：\n\n*   Fedora 项目：`https://www.fedoraproject.org`\n\
  *   Debian：`https://www.debian.org`\n*   Ubuntu：`http://www.ubuntu.com`\n*   Gentoo：`http://www.gentoo.org`\n\
  \n这些大多是优秀的发行版。如果你打算走 Linux 路线，花些时间熟悉这些发行版，以便决定最适合你需求（或者也许更贴切地说，最适合你个性）的发行版。有关各种\
  \ Linux 发行版的并排比较，请参考 `http://en.wikipedia.org/wiki/Comparison_of_Linux_distributions`。\n\
  \n了解如何在所选 Linux 发行版中安装应用程序尤其重要。大多数发行版都带有包管理工具（例如，Fedora 上的 `rpm`/`PackageKit`/`Yum`，Debian/Ubuntu\
  \ 上的 `apt-get`/`APT`，以及 Gentoo 上的 `emerge`/`Portage`），这些工具可以下载应用程序并将其安装到你的 Linux\
  \ 操作系统上。通常，包管理工具会与在线仓库同步，并支持下载和升级软件。它们还会处理任何版本冲突，并执行实际的安装任务，例如复制文件和更新系统信息。\n\n作为一般规则，你应该选择使用\
  \ Linux 发行版内置的包管理工具来安装本章讨论的软件组件，包括 Python 及其包，而不是手动安装；这将确保 Linux 系统的稳定性。如果所需的软件应用程序无法通过\
  \ Linux 发行版的包管理工具获得，你可以手动安装该应用程序。这不是一项简单的任务，需要一些 Linux 专业知识。（另一方面，手动安装 Python 包则很简单，你将在后面的“手动安装\
  \ Python 包”部分中了解到。）\n\n### Windows\n\n在当今可用的 Windows 版本中，选择微软当前支持的版本。与 Linux 不同，在选择\
  \ Windows 作为操作系统后，你仍然需要选择运行 Python 的确切环境。三个主要选项是：\n\n*   独立（原生）\n*   Cygwin\n* \
  \  虚拟机 (VM)\n\n#### 独立（原生）\n\n\n\n除非你有强烈的理由反对，否则在 Windows 上，这应该是你的首选：直接安装原生 Python，无需额外环境。这种方式安装更省事，代码运行速度更快，并且可以轻松地将\
  \ Python 内容直接复制粘贴到文档中。Python 以一个带有安装程序的可执行文件形式提供。下载后，双击该可执行文件并安装 Python（稍后会详细介绍\
  \ Python 的安装）。我们接下来要处理的大多数其他包也以这种方式捆绑，因此安装它们也应该很简单。\n\n如果你想要安装一个没有附带安装程序的包，则必须查阅该包的文档。顺便说一句，无论你选择独立安装方式还是接下来建议的其他方法（或\
  \ Linux），总会有一些包需要手动安装，因此了解如何进行手动包安装是很有价值的。\n\n#### Cygwin\n\nCygwin（`http://www.cygwin.com`）环境运行在\
  \ Windows 上，并提供类 UNIX 功能。即使你是忠实的 Windows 用户，它也是一个优秀的软件产品。\n\nCygwin 附带一个在 Windows\
  \ 上运行的 GUI 安装程序。Cygwin Net Release Setup Program 允许你选择并安装软件包。请注意，Cygwin 有两个版本：64\
  \ 位版本和 32 位版本；请确保你安装了与操作系统匹配的正确版本。Cygwin 安装程序实际上是一个包管理工具，就像大多数 Linux 发行版中的任何其他包管理工具一样。当你浏览包列表时，你会发现有大量的选择；但这不应让你望而却步。安装默认选项即可，因为你知道随时可以返回并添加或删除应用程序；只需重新运行\
  \ Cygwin 安装程序即可。安装 Cygwin 后，通过“开始 ![image](img/arrow.jpg) 所有程序 ![image](img/arrow.jpg)\
  \ Cygwin ![image](img/arrow.jpg) Cygwin Terminal”来运行它。\n\nCygwin 提供了大量额外的开源软件包，包括\
  \ Python。如果你想要额外的功能——如 `bash` shell、SSH、编辑器、查看器、版本控制系统、X 功能等——那么 Cygwin 是一个绝佳的选择。缺点是对于经验不足的用户来说，它比独立安装方式稍微复杂一些。与原生安装相比，使用\
  \ Cygwin 也会有一点性能损失。例如，在我的电脑上，一个简单的 `for` 循环求和值在 Cygwin 的 Python 中比原生 Python 安装慢了\
  \ 20%。\n\n![Image](img/sq.jpg) **注意** Cygwin 处理驱动器的方式与 Windows 不同，因为它遵循 UNIX 目录结构。如果你将\
  \ Cygwin 安装在 `c:\\cygwin` 下，则该目录通常被表示为最顶层目录：`/`。要访问 `c:\\cygwin` 之外的目录，请使用以下表示法：`/cygdrive/disk`\
  \ 或 `disk:/`。例如，如果一个文件位于 `c:\\data`，则在 Cygwin 中可以通过 `/cygdrive/c/data` 或 `c:/data`\
  \ 访问它。\n\n#### 虚拟机\n\n第三种选择，稍微特殊一些，是运行虚拟机（VM）。虚拟机允许你在主机操作系统（此处为 Windows 或 Mac OS）中运行\
  \ Linux 操作系统（或其他操作系统）。此选项适合更有经验的用户：安装和配置 VM 并非易事。\n\n每当我需要进行交叉开发——即开发一个需要在 Windows\
  \ 和 Linux 上都能运行的应用程序时——我会在 Windows 中进行开发，并在 Windows 中运行一个 Linux VM。这样，我可以轻松地在两个操作系统中检查代码，而无需切换电脑。VM\
  \ 的另一个优点是熟悉 Windows 和 Linux 的应用程序：VM 允许你在同一台电脑上使用这两个系统的应用程序。\n\n在 Windows 上，目前有几种可用的\
  \ VM：\n\n*   Oracle VM VirtualBox（`https://www.virtualbox.org/`）。VirtualBox 供个人免费使用；详情请参阅\
  \ Oracle 的许可常见问题解答（`https://www.virtualbox.org/wiki/Licensing_FAQ`）。\n*   VMware（`http://www.vmware.com`）。此\
  \ VM 也有一个免费版本，名为 VMware Player。\n*   适用于 MacOS 的 Parallels（`http://www.parallels.com`）。Parallels\
  \ 是商业软件。\n\n![Image](img/sq.jpg) **提示** 如果你只是想尝试一下 Linux，但不想走完整安装操作系统的流程，那么运行虚拟机可能是一个不错的选择。如果是这种情况，还可以选择运行\
  \ Live CD，这基本上意味着从 CD-ROM 启动一个功能完整的 Linux 操作系统。目前有相当多的 Live CD 可用；一个知名的选择是 Knoppix（`http://knoppix.net/`）。\n\
  \n使用 VM 的缺点之一是性能会有所损失。话虽如此，VM 的实现和计算能力的不断增强使得这种代价相对较小。\n\n## 选择操作系统\n\n哪个操作系统是 Python\
  \ 最坚实的基础？从数据分析和可视化的角度来看，Linux 是完美的匹配。主要原因是 Linux 拥有强大的命令行界面（CLI），而 Windows 则严重依赖图形用户界面（GUI）。\n\
  \n当你处理大量文件时，CLI 比 GUI 更具优势。考虑重命名大量文件，例如，你上次度假时拍摄的照片。大多数相机生成的文件遵循顺序命名方案：`DSB00001.jpg`、`DSB00002.jpg`\
  \ 等等，这相当晦涩。另一方面，你可能希望将这些文件重命名为更具信息性的名称，例如 `Vacation2014-03-20-NNNNN.jpg`，其中 `NNNNN`\
  \ 是运行索引。因此，名为 `DSB00002.jpg` 的文件现在将被命名为 `Vacation2014-03-20-00002.jpg`。你可以使用 GUI\
  \ 和 CLI 来执行此任务：\n\n*   使用 GUI 方法，你必须为每个文件指向、单击并键入新名称。对于少量图片来说，这可能是完全合理的；但随着数量的增加，这项任务变得繁琐且耗时。\n\
  *   CLI 方法是编写一条命令来一次性重命名所有文件。如果你熟悉 Bash，你可能会发出以下命令：\n\n```\n$ for fn in DSB*.jpg;\
  \ do mv $fn ${fn/DSC/Vacation2014-03-20-}; done\n```\n\n（有很多方法可以用 CLI 做到这一点，这只是我喜欢的一种。我不会在本书中讨论\
  \ Bash。）对于少量图片来说，这似乎有些大材小用；然而，一旦文件数量增加，CLI 方法就能显著节省时间。\n\n当然，重命名文件是一项简单的任务，Windows\
  \ 也通过其命令提示符（Windows 版本的 CLI）支持该任务。然而，即使是这样简单的任务，在 Windows 中也不简单，除非你安装额外的软件或编写一些代码来执行该任务（尽管最新版本的\
  \ Windows 也引入了支持 GUI 和 CLI 界面的 shell 功能）。对于更复杂的数据管理任务，以 CLI 为中心的方法比 GUI 好得多。一个围绕\
  \ CLI 构建的操作系统通常是管理数据文件的更好选择。\n\n![Image](img/sq.jpg) **注意** 无论你选择哪种操作系统，都没有对错之分——本书中介绍的概念（和代码）都能正常工作。\n\
  \n在选择操作系统时，需要考虑以下几点：\n\n\n\n*   Linux 是一个稳定且功能强大的操作系统。使用 Linux 的好处包括低成本（通常免费）、强大的\
  \ CLI 以及活跃且支持度高的社区。Linux 的主要缺点是，如果你不熟悉该操作系统，会有一个学习曲线——尽管在当今的发行版中，这个曲线已经显著平缓。此外，对硬件的支持不如\
  \ Windows 那样全面。如果你的工作涉及使用 Linux 不支持的现有硬件来生成数据，这可能是一个严重的缺点。\n*   Windows 是一个广泛流行的操作系统。大多数用户都在某种程度上使用过\
  \ Windows，因此学习曲线非常平缓（如果有的话）。对硬件的支持非常好；大多数硬件供应商将 Windows 作为其主要操作系统。Windows 的缺点包括缺乏强大的\
  \ CLI，以及操作系统和额外软件应用程序的成本。\n*   Mac OS 相当流行，这是有原因的：它结合了 GUI 体验和 UNIX 的强大功能。尽管它在数据分析和可视化领域相对较新，但由于这两个特性，我预感你会看到越来越多的\
  \ Mac OS 被使用。Mac OS 的缺点是成本及其对旧硬件的支持。\n\n表 2-1 总结了每种操作系统选择的优缺点。\n\n表 2-1. Linux、Windows\
  \ 和 Mac OS 作为数据处理和可视化开发环境的对比\n\n![Table2-1.jpg](img/Table2-1.jpg)\n\n### 那么，为什么要选择？使用多个操作系统\n\
  \nPython 的好处在于它将操作系统从问题中消除了。Python 是一个完整的环境，采用“内置电池”的方法：安装 Python 后，你应该基本上可以开箱即用；标准库提供了完整的功能。这意味着，突然间，Windows\
  \ 也拥有了一个强大的 CLI：Python 解释器。考虑到这一点，操作系统的选择更多地变成了个人偏好。例如，我同时使用 Linux 和 Windows 进行数据分析和可视化：我的\
  \ Linux 机器是一台固定的家庭服务器，所以我不能在开车时用它来记录 GPS 数据；我的笔记本电脑运行 Windows，为我完成这项工作。\n\n如果你需要比\
  \ Python 提供的更多类似 UNIX 的功能，但仍想使用 Windows，你可以选择 Cygwin，它提供了许多移植到 Windows 的 GNU 工具。事实上，如果我需要一些\
  \ GUI 交互工作（Linux 机器藏在桌子下面，没有显示器），我会使用 Cygwin 的 X 服务器并连接到我的 Linux 机器。\n\n如果你计划在同一台计算机上同时安装\
  \ Windows 和 Linux 来分析数据（这被称为双启动），请考虑如何在 Linux 和 Windows 分区之间传输数据。有几种方法：拥有一个 Linux\
  \ 和 Windows 都能处理的共享分区（某些情况下为 FAT32、NTFS），通过 USB 设备传输文件，甚至通过网络连接到另一台机器。每种方法都有其优点，但请记住，你可能要处理大量文件，因此最好能访问共享资源上的数据。\n\
  \n![Image](img/sq.jpg) **警告** 安装操作系统是一项耗时的任务，如果你打算双启动，所需时间会加倍。你应该查阅你的 Linux 发行版的文档，了解如何最好地实现双启动；在决定先安装哪个操作系统（Linux\
  \ 或 Windows）时尤其如此。双启动是一个高级主题，不建议初学者尝试。\n\n使用双启动系统有时会很烦人，特别是因为你需要重启才能切换操作系统。此外，安装过程有点风险。例如，在重新分区硬盘时，你可能会丢失数据（尽管如果你知道自己在做什么，这种情况是可以避免的）。为了最大程度地减少烦恼和风险，虚拟机是一个很好的替代方案：数据不受重新分区的影响，并且不需要实际重启。我的电脑足够强大，可以在\
  \ Windows 中以出色的性能将 Linux 作为虚拟机运行。如果你想使用这种设置，再次考虑如何在主机操作系统和目标操作系统之间共享数据。一种常见（且良好）的方法是使用虚拟网络接口传输文件。另一种选择是使用共享文件夹，例如\
  \ Oracle 的 VirtualBox 增强功能提供的共享文件夹。\n\n在 Mac OS 上，这些解决方案在某种程度上不那么必要；Mac OS 本身就是一个类似\
  \ UNIX 的操作系统。\n\n## Python 环境\n\n到现在为止，你应该已经选择并安装了你喜欢的操作系统。你也应该熟悉下载和安装软件包。现在是安装\
  \ Python 的时候了。本节讨论如何安装 Python 和 Python 包，以便编写数据分析和可视化脚本。第 3 章 更详细地讨论了如何在交互式 shell\
  \ 中使用 Python 以及运行独立应用程序。在这里，我将重点介绍 Python 发行版、Python IDE 和 Python 包。\n\n![Image](img/sq.jpg)\
  \ **注意** 模块是 Python 文件。包是驻留在目录中的模块集合（包中的模块还共享一个额外的 `__init__.py` 文件）。在本书中，每当我提到包或模块时，我会使用斜体。包的示例有\
  \ *SciPy* 和 *NumPy*。模块的示例有 *time* 和 *random*。有关导入模块和包的信息，请参见第 3 章，“`import` 语句”。\n\
  \n### 版本\n\n我在本书中主要介绍的 Python 版本是 Python 3.3。作为一般规则，你应该选择最新的 Python 版本。不幸的是，这并不总是可能的：\n\
  \n*   在撰写本文时，Python 3.4 已经发布。然而，本书中使用的所有包尚未完全跟上，因此我不得不坚持使用 Python 3.3。\n*   某些操作系统，例如\
  \ Gentoo Linux 发行版，严重依赖 Python 进行系统管理，升级需要大量测试以确保系统稳定。因此，即使有新的 Python 版本可用，你可能还无法使用它。有一些变通方法，例如在一台机器上安装多个\
  \ Python 版本；同样，请参考你的 Linux 发行版以获取更多信息，因为此主题超出了本章的范围。\n\n在升级到更新的 Python 版本之前，请确保你将使用的所有包都支持新版本。写下你将使用的所有包及其版本号。另外，请务必特别注意以下几点：\n\
  \n*   你正在使用的操作系统，无论是 Windows、Linux 还是 MacOS。\n*   你的操作系统是 64 位还是 32 位？通常，64 位包版本的下载文件名中包含文本\
  \ `amd64` 或 `x86-64`；32 位版本的下载文件名中包含文本 `win32`（Windows）或 `x86`（Linux）。\n*   确切的\
  \ Python 版本。例如，如果你要下载 *NumPy* 1.8 版本，请确保下载为 Python 3.3 编译的 *NumPy* 版本。\n\n寻找最新 Python\
  \ 包的一个好的起点是 PyPI——Python 包索引，`https://pypi.python.org/pypi`。表 2-2 总结了本书中使用的 Python\
  \ 及其包的版本。\n\n表 2-2. 本书中使用的 Python 和 Python 包的版本\n\n![Table2-2.jpg](img/Table2-2.jpg)\n\
  \n\n\n#### 本书中的代码\n\n本书中展示的代码在大多数 3.x 版本上无需或仅需极少量修改即可运行。至于 2.x 版本，则需进行小幅调整；最值得注意的是，你需要将除法运算符（`/`）替换为整数除法运算符（`//`）（反之亦然），因为数字除法的默认行为有所不同（更多信息请参阅第\
  \ 1 章中的“提取 GPS 数据”一节）。或者，你也可以添加一行代码 `from __future__ import print_function, division`，以便在\
  \ Python 2.x 版本中使用本书中的脚本。\n\n如果表 2-2 的列表让你望而生畏，不妨选择安装一个包含所有这些包的 Python 发行版；有关建议，请参阅本章后面的“包含科学计算包的\
  \ Python 发行版”一节。\n\n![Image](img/sq.jpg) **注意** 请务必确保你下载和安装的包版本与你使用的 Python 版本兼容。某些包会保留旧版本，以备你需要兼容性支持。\n\
  \n## Python\n\n你可以从 `https://www.python.org/downloads/` 为你的特定操作系统下载 Python 实现。请仔细阅读并选择适合你操作系统的下载版本。再次强调，如果你运行的是\
  \ Linux 操作系统，建议使用该系统的包管理工具，而不是从 Python 网站下载并安装。同样适用于 Cygwin：尽可能使用 Cygwin 安装程序。在\
  \ Windows 上，通常的做法是使用上述网址中附带安装程序的 Python 二进制文件。虽然你也可以从源代码安装 Python——即下载源代码并在你的操作系统上编译——但我除了出于好奇想验证代码确实能正确编译之外，还没找到这样做的理由。\n\
  \n如果你想知道 Jython（一种纯 Java 编写的 Python 实现，请参见 `http://www.jython.org`）或 IronPython（一种基于微软\
  \ .NET 平台的 Python 实现，请参见 `http://ironpython.net/`）是否可行，恐怕它们并不适合本书。本书中的大量代码和示例严重依赖于那些无法在\
  \ Jython 或 IronPython 上运行的包。其他 Python 替代实现可以在 Python 网站 `https://www.python.org/download/alternatives/`\
  \ 上找到；同样，这些替代方案不在本书的讨论范围之内。\n\n## 包含科学计算包的 Python 发行版\n\n另一种选择是使用一个已经捆绑了大量我们将要用到的\
  \ Python 包的 Python 发行版。如果你不想费心逐个安装包，或者迫不及待地想跳过安装阶段直接运行代码，那么这些发行版是不错的选择。以下是一些可选方案：\n\
  \n*   Enthought Canopy：`https://www.enthought.com/products/canopy/`\n*   Python(x,y)：`https://code.google.com/p/pythonxy/`\n\
  *   WinPython：`http://winpython.sourceforge.net/`\n*   Anaconda：`https://store.continuum.io/cshop/anaconda/`\n\
  \n如果你选择了包含科学计算包的 Python 发行版，则可以跳过本章后面与 Python 集成开发环境、*SciPy*、*NumPy*、*matplotlib*\
  \ 和 IPython 相关的章节。包含科学计算包的 Python 发行版会直接内置这些包。\n\n## Python 集成开发环境\n\n集成开发环境（IDE）简单来说，就是帮助程序员编写代码的应用程序。通常，IDE\
  \ 由语言引擎（Python）、编辑器、调试器、文档以及可能的其他生产力工具组成。虽然完全可以在没有 IDE 的情况下使用 Python，但使用 IDE 将大大提高你的生产力，并让你更快地学习。\n\
  \n有几种可用的 Python IDE；我们将探讨 IDLE、IPython（我个人最喜欢的）、IPython Notebook 和 Spyder。\n\n###\
  \ IDLE\n\nIDLE（`https://docs.python.org/3.3/library/idle.html`）是一个跨平台的 Python GUI\
  \ IDE。如果你是从 Windows 二进制文件安装的，IDLE 会自动安装；通过“开始”![image](img/arrow.jpg) “所有程序”![image](img/arrow.jpg)\
  \ “Python 3.3”![image](img/arrow.jpg) “IDLE (Python GUI)” 即可访问。IDLE 是一个功能强大的 IDE，具有以下特性：与\
  \ Python 解释器无缝集成、编辑器、调试器和帮助系统。它是一个让你快速上手并运行起来的绝佳环境，尤其是当你编程新手时。\n\n使用 IDLE 的好处之一是，你可以在一个专为\
  \ Python 设计的编辑器中编写代码（文件 ![image](img/arrow.jpg) 新建文件 或 **CTRL-N**），然后通过按 **F5**\
  \ 键轻松地在 IDLE 中执行它。如果使用命令行界面（CLI）方法，你需要调用 Python 并指定要执行的文件（更多内容请参阅第 3 章）。\n\n###\
  \ IPython\n\n当你开始使用 CLI 时，你会意识到有些功能你确实希望得到增强。IPython（`http://ipython.org/`）提供了一个增强的交互式\
  \ Python shell。我强烈推荐它，主要是因为数据分析和可视化本质上是交互式的。IPython 支持大多数平台。以下是 IPython 附带的一些新增功能：\n\
  \n*   制表符补全，涉及变量、函数、方法、属性和文件名的补全。制表符补全是通过 GNU Readline 库（`http://cnswww.cns.cwru.edu/php/chet/readline/rltop.html`）实现的，并且非常容易让人上瘾。一旦你体验过\
  \ GNU Readline，就很难再回到普通的 CLI。\n*   命令历史功能：输入命令 `history` 可以查看你最近输入的所有命令。你可以将这些命令复制粘贴到\
  \ Python 脚本中，从而节省时间和精力。\n*   与系统 shell 无缝集成：例如，你可以使用 `ls –l` 或 `cd /home/user`。\n\
  *   彩色输出。\n\nIPython 并非必需，但*强烈推荐*。它是我个人最喜欢的用于编写 Python 代码的增强应用程序。\n\nIPython 附带\
  \ Windows 安装程序，并且可在大多数包管理工具以及 Cygwin 上使用。根据你的操作系统，你可能需要安装 GNU Readline；在 Windows\
  \ 上，你还需要安装 PyReadline（`http://ipython.org/pyreadline.html`）。请查阅 IPython 的安装文档。\n\
  \n![Image](img/sq.jpg) **注意** IPython 应在 Python、GNU Readline 和 PyReadline 安装之后再进行安装。\n\
  \n### 使用 IPython 和 GNU Readline 进行字符补全\n\n使用 GNU Readline 进行字符补全是交互式 CLI 的一个受欢迎的功能。使用\
  \ IPython，字符补全可用于补全以下内容：\n\n*   变量名\n*   方法和属性名\n*   文件名\n\n要调用字符补全，首先输入你想要写的单词的前几个字符，然后按\
  \ **Tab** 键，让 GNU Readline 尝试为你补全该单词。以下来自 IPython：\n\n```\nIn [1]: s = \"A string\"\
  \n\nIn [2]: s.is\ns.isalnum      s.isdigit      s.isnumeric    s.istitle\ns.isalpha\
  \      s.isidentifier s.isprintable  s.isupper\ns.isdecimal    s.islower      s.isspace\n\
  In [2]: s.is\n```\n\n在输入 `s.is` 之后，我按下了 **Tab** 键，然后看到了一系列选项。如果我输入了 `s.isdi` 并按下\
  \ **Tab**，那么整个 `s.isdigit` 就会自动出现在提示符下。\n\nGNU Readline 的工作方式是，它通过搜索与键入字符匹配的变量、函数、方法、属性或文件名来尝试补全单词。如果只有一个匹配选项，该单词会自动显示在提示符下。如果有多个选项，则会显示所有选项。要选择你希望补全的选项，请提供下一个字符，然后再次按\
  \ **Tab** 键。如果没有与键入单词匹配的内容，则不会发生任何操作。\n\n\n\n你还可以使用自动补全功能来探索某个类的方法和属性，或者任何其他命名空间。在下面的代码清单中，我在输入\
  \ `a.`（注意那个点）后按下了 **Tab** 键：\n\n```\nIn [1]: a = dict()\nIn [2]: a.\na.clear   \
  \ a.fromkeys    a.items    a.pop        a.setdefault     a.values\na.copy     a.get\
  \         a.keys     a.popitem    a.update\n```\n\n### IPython Notebook\n\nIPython\
  \ 一个令人兴奋且相对较新的功能是 IPython Notebook（参见 `http://ipython.org/notebook.html`）。IPython\
  \ Notebook 提供了一个基于 Web 的交互式 Python 脚本环境，既能执行代码，也能嵌入图形。此外，它还允许你通过 IPython Notebook\
  \ 查看器（参见 `http://nbviewer.ipython.org/`）与读者共享笔记本，或者将笔记本导出为 PDF 或 HTML 等其他格式。图 2-1\
  \ 展示了一个示例。\n\n当你安装 IPython 时，IPython Notebook 会自动安装。但是，为了让 IPython Notebook 正常工作，还必须安装以下软件包（它们提供了基于\
  \ Web 的功能以及 HTML 模板）：\n\n![9781484200537_Fig02-01.jpg](img/9781484200537_Fig02-01.jpg)\n\
  \n图 2-1. IPython Notebook\n\n*   软件包 *pyzmq*，参见 `https://github.com/zeromq/pyzmq`\n\
  *   软件包 *jinja2*，参见 `http://jinja.pocoo.org/`\n*   软件包 *markupsafe*，参见 `https://github.com/mitsuhiko/markupsafe`\n\
  *   软件包 *tornado*，参见 `http://www.tornadoweb.org/`\n\n一旦你启动 IPython Notebook，你看到的第一个屏幕将类似于图\
  \ 2-2 所示。\n\n![9781484200537_Fig02-02.jpg](img/9781484200537_Fig02-02.jpg)\n\n图\
  \ 2-2. IPython 仪表盘\n\n你可以通过点击“新建笔记本”按钮来创建一个新笔记本，或者点击一个已有的活动笔记本。在上面的示例中，活动笔记本的标题是\
  \ *Spiral* 和 *Untitled0*。你可以通过点击“关闭”按钮来关闭笔记本。重命名笔记本通常是在笔记本页面本身通过点击笔记本名称来完成的。\n\n\
  创建笔记本后，你就可以开始输入命令和语句了。这些命令和语句不会立即被求值（即执行），直到你通过上方的播放按钮运行该单元格或按下 **Shift-Enter**\
  \ 键。有关 IPython 和 IPython Notebook 中可用命令的快速参考表，请参见 `http://damontallen.github.io/IPython-quick-ref-sheets/`。\n\
  \n默认行为是，每当你创建一个图形时，会弹出一个包含该图形的窗口。要让图形嵌入在网页中，如图 2-1 所示，你可以执行以下操作之一：在笔记本中将命令 `%pylab\
  \ inline` 作为第一条命令发出，或者将参数 `--pylab=inline` 传递给 IPython。在 Windows 中，看起来像这样（在一行内）：\n\
  \n```\nC:\\Python33\\python.exe \"C:\\Python33\\scripts\\ipython3-script.py\" notebook\
  \ --pylab inline\n```\n\n在 Linux 中，看起来像这样：\n\n```\n$ ipython notebook --pylab inline\n\
  ```\n\n### Spyder\n\nSpyder（`http://code.google.com/p/spyderlib/`）是一个专为 Python 设计的开源集成开发环境（IDE）。它功能丰富，可在大多数操作系统上运行。Spyder\
  \ 内置了带有语法着色、代码补全、调试器支持等功能的编辑器。它是一个非常优秀的 IDE。\n\n安装 Spyder 有几种方法（参见图 2-3）：使用包含科学计算包的\
  \ Python 发行版，如 Python(x,y)、WinPython 或 Anaconda（参见本章前面部分）；使用二进制安装程序；或者从源代码手动安装。如果你在\
  \ Windows 中手动安装，还需要软件包 *PySide*（`http://qt-project.org/wiki/PySide`）、*pyzmq*（`https://github.com/zeromq/pyzmq`）和\
  \ *pygments*（`http://pygments.org/`）。同样，如果你使用包含科学计算包的 Python 发行版，则不需要任何额外的软件包。\n\
  \n![9781484200537_Fig02-03.jpg](img/9781484200537_Fig02-03.jpg)\n\n图 2-3. Spyder\
  \ IDE\n\n## 科学计算\n\n本书的很大一部分内容致力于在可视化之前处理数据。有两个软件包帮助我们实现这一目标：*NumPy* 和 *SciPy*。*NumPy*\
  \ 将在第 7 章中讨论，*SciPy* 将在第 8 章中介绍。这两个软件包与 *matplotlib* 结合使用时，其行为类似于大多数高端数学软件包，例如开源的\
  \ GNU Octave（`http://www.octave.org`）和商业化的 MATLAB（`http://www.mathworks.com`）。事实上，这三个软件包协同工作甚至有一个专门的名称：*PyLab*，它是\
  \ Python 和 MATLAB 的结合。*SciPy*、*NumPy* 和 *matplotlib* 都是开源软件包，是运行本书中代码所必需的。\n\n###\
  \ NumPy\n\n*NumPy* 提供了一个强大的 N 维数组，这是我们将要执行的大部分数据处理的基础。你在第 1 章的 GPS 示例中已经见识过它的作用。*NumPy*\
  \ 还提供了额外的数值计算能力：线性代数、傅里叶变换等。\n\n*NumPy* 是一个成熟稳定的软件包，可以从 `http://www.numpy.org/`\
  \ 下载并安装。*NumPy* 将在第 7 章和第 8 章中讨论。\n\n### SciPy\n\n*SciPy* 构建在 *NumPy* 之上，并增加了额外的科学计算工具。这些工具包括数值积分、微分方程、插值、信号处理、优化、线性代数等。\n\
  \n即使你对科学计算不感兴趣，我也鼓励你尝试一下 *SciPy*——它为 *NumPy* 提供了非常有用的附加实用函数，并且在本书中被广泛使用。\n\n*SciPy*\
  \ 可以从 `http://www.scipy.org/` 下载并安装，并将在第 8 章中介绍。\n\n![Image](img/sq.jpg) **注意**\
  \ *SciPy* 依赖于 *NumPy*，应在安装 *NumPy* 之后安装。\n\n### Matplotlib\n\n可视化是最后一步，它以图形方式向观众展示数据，传达思想，并高效优雅地捕获信息。本书中的绘图将严重依赖于\
  \ *matplotlib* 软件包，其维护地址为 `http://matplotlib.org/`。\n\n\n\n`Matplotlib` 是一个与 `NumPy`\
  \ 和 `SciPy` 配合良好的绘图包。该包是跨平台的，可在 Linux、Windows 和 Mac OS 上运行。`Matplotlib` 可以使用多种引擎生成交互式和基于文件的图表。因此，你可以将其用于交互式工作，这在算法设计的早期阶段非常有用。你也可以在自动模式下使用它，例如批处理，将结果绘制到共享目录或\
  \ Web 服务器上。`Matplotlib` 既简单易用又高度可定制，是一个非常适合我们需求的优秀包。它支持多种图表类型，并具有出色的图形注释功能。\n\n\
  ![Image](img/sq.jpg) **提示** `Matplotlib` 提供了一些额外的工具包。结合第 1 章来看，一个特别有趣的工具包是 `basemap`\
  \ 工具包，它允许你处理地图投影。`basemap` 工具包不随 `matplotlib` 一起分发；更多详情请参考 `matplotlib` 的网站。关于其他\
  \ `matplotlib` 工具包的讨论，请参考第 6 章。\n\n## 图像处理\n\n图像处理提供了拼图的最后一块。它是数据可视化的重要组成部分，将在第\
  \ 9 章中详细讨论。我们将使用 Python 图像库（PIL）的一个分支，名为 `Pillow`，来提供图像处理支持。\n\n`Pillow` 为 Python\
  \ 增强了出色的图像处理能力。它支持大多数流行的图像文件格式，并提供了丰富的函数来操作图像数据。`Pillow` 与 `NumPy` 结合，为 Python 提供了一个功能非常强大的图像处理环境。\n\
  \n## PySerial\n\n在第 1 章中，我们使用 `pySerial` 通过串口捕获 GPS 数据。`PySerial` 可在 `http://pyserial.sourceforge.net/`\
  \ 获取。每当需要访问串口时，`PySerial` 都是一个极好的选择。\n\n## 手动安装 Python 包\n\n如前所述，某些 Python 包没有独立的安装程序。在这种情况下，你必须执行手动安装。别担心，这比听起来要简单。\n\
  \n一般来说，最好阅读文档并按照说明操作。也就是说，大多数 Python 包的安装步骤都类似：\n\n1.  下载包。\n2.  将包解压到一个临时目录。大多数包以压缩文件形式分发，扩展名为\
  \ `.tar.gz` 或 `.zip`，甚至是自解压的 `.exe` 文件。你需要将包解压到一个临时目录。有时，扩展名为 `.tar.gz` 的文件会以 `.tar.tar`\
  \ 的形式下载。如果是这种情况，请将文件重命名为扩展名为 `.tar.gz` 的文件，然后像往常一样继续解压。\n3.  在临时目录中运行 `python setup.py\
  \ install`。当然，这必须在 Python 已安装并在你的系统上正常工作之后进行。\n\n例如，我在 Cygwin 上安装 `pySerial` 的步骤如下：\n\
  \n```\n$ tar -zxvf pyserial-2.7.tar.gz\n$ cd pyserial-2.7\n$ python setup.py install\n\
  ```\n\n第一个命令将下载的文件解压到一个新创建的名为 `pyserial-2.7` 的目录中；新目录的创建由应用程序 `tar` 自动完成，并会报告给用户。如果你运行的是\
  \ Windows（而不是 Cygwin），你可以使用本机 Windows 工具（如 7-Zip (`http://www.7-zip.org/`)）来解压文件；`tar`\
  \ 应用程序在 Linux 中可用，并且通常随操作系统预装。第二个命令将目录更改为临时目录。第三个命令执行安装并确保包已正确安装。\n\n你也可以使用 `setuptools`\
  \ 包（其中包含 `easy_setup` 工具），可从 `https://pypi.python.org/pypi/setuptools` 获取。这个包让你能更好地控制安装和维护包，尤其是那些依赖于其他包的包。该包的另一个好处是，你还可以在没有\
  \ root（超级用户）权限的机器上安装 Python 包。\n\n## 安装总结\n\n表 2-3 总结了前面讨论的 Python 包，并指出了运行本书示例所需的软件。\n\
  \n表 2-3. 包安装总结\n\n| 软件/包 | 功能 | 是否必需？ |\n| --- | --- | --- |\n| Python | Python\
  \ 编程语言 | 是 |\n| IDLE | Python IDE | 否 |\n| IPython, Readline | Python CLI 增强 | 否\
  \ |\n| IPython notebook | 基于 Web 的 Python 环境 | 否 |\n| Spyder | Python IDE | 否 |\n\
  | `NumPy` | N 维数组和数学包 | 是 |\n| `SciPy` | 科学工具 | 是 |\n| `Matplotlib` | 绘图和图表包 | 是\
  \ |\n| `Pillow` | Python 图像库 | 部分（第 7 章和第 9 章） |\n| `PySerial` | 串行接口 | 部分（第 1 章）\
  \ |\n\n## 其他应用程序\n\n到目前为止，你应该已经拥有一个可用的开发环境，其中包括你选择的操作系统、Python 和 Python 包。我们现在转向其他软件应用程序，以完善一个用于在\
  \ Python 中开发和运行数据分析和可视化脚本的环境。本节建议从开源软件世界中选取一些工具来增强开发环境。虽然也有优秀的商业应用程序，但我不会涉及这些。建议的应用程序对我来说非常好用，但你可能有自己的偏好，甚至是这里没有提到的应用程序。请务必使用你最喜欢的工具；本节主要面向那些需要一些起点的人。\n\
  \n### 编辑器\n\n开发者工具包中最重要的工具是文本编辑器。把它想象成你的瑞士军刀：它可以用来阅读、编写或修改脚本；查看数据文件；作为想法的草稿本；以及作为中间复制粘贴的剪贴板等。基本的文本编辑器很快就会让你感到沮丧，因为有些编辑器在可编辑的文件大小上有限制，有些不允许同时打开多个文件，还有一些缺少语法高亮或书签功能。\n\
  \n### 为你选择合适的编辑器\n\n编辑器在你的开发环境中扮演着重要角色。学习使用新编辑器需要一些时间，因此在选择文本编辑器或从当前编辑器切换时，请考虑以下几点：\n\
  \n*   易用性：这一点显而易见。编辑器是否易于使用且直观？是否有学习曲线；如果有，需要多长时间才能掌握？\n*   多文件编辑：你可能需要处理大量的脚本文件，甚至是在编辑器中检查数据文件。用一个应用程序处理所有这些文件可以消除桌面上的杂乱，通常也更容易处理。\n\
  *   最大文件大小：你可以在编辑器中打开的最大文件是多少？同样，当你想查看大型数据文件时，了解这一点很有用。\n*   语法高亮：此功能以不同的颜色或字体显示编程语言的保留或特定语法，使代码更易于查看。大多数支持语法高亮的编辑器都内置了对多种编程语言的支持，包括\
  \ Python。此功能很方便，因为它会高亮显示可能的语法错误，并使代码更具可读性。\n*   行号：错误和警告通常会返回它们发生的行信息。因此，能够知道是哪一行导致了错误而无需逐行计数非常重要。一些编辑器还支持跳转到指定行的命令，如果你的代码很长，这会很有用。最后，行号在与他人沟通时也很有帮助。\n\
  \n\n#### 最近使用的文件列表\n\n这是一个实用的功能，让你无需指定完整路径，就能轻松访问最近查看或编辑过的文件。\n\n#### 书签\n\n书签功能便于导航，在处理大型文件时尤其有用。\n\
  \n#### 宏支持与宏录制\n\n宏以及录制和回放宏的能力可以提升工作效率（参见侧边栏“录制宏”）。\n\n#### 自动补全\n\n此功能类似于之前侧边栏“Readline\
  \ 中的字符补全”中描述的字符补全（但通常使用不同的按键组合，例如 `Ctrl+Space`）。它可以提高工作效率，但需要一些时间来适应。\n\n#### 其他功能\n\
  \n以上是我认为重要的功能列表。你可能有不同的需求和标准，因此请记下它们，并以此为依据选择适合你的编辑器。\n\n### 录制宏\n\n宏录制器是一种无需实际编写代码即可快速有效地实现自动化的方法。假设你想将文件中的每两行连续的行合并为一行，并在中间加上\
  \ `&&` 符号。这通过搜索和替换并不容易实现（除非你的搜索和替换也支持换行符）。当然，你可以编写一个 Python 脚本来完成，但假设在这种特定情况下，因为只操作一次，所以自动化没有意义。这正是使用宏录制器的场景。步骤如下：\n\
  \n1. 将光标移动到文件开头（或在某些编辑器中按 `Ctrl+Home` 到达那里）。\n2. 启动宏录制器并执行以下操作：按 `End` 键到达行尾，按 `Del`\
  \ 键删除行分隔符并将两行合并为一行，输入 `&&`，按 `向下箭头` 键向下移动一行，然后按 `Home` 键到达下一行的开头。\n3. 停止宏录制器以完成宏的录制。这个序列将两行合并为一行，并在中间添加\
  \ `&&`。请注意，我使用的是键盘而非鼠标；这一点很重要，因为大多数编辑器中的宏录制器不支持鼠标录制。\n4. 接下来，运行宏 N 次，其中 N 是文件行数除以\
  \ 2（记住，每个宏合并两行）。或者，你可以为每一对要合并的行运行该宏。\n\n某些编辑器提供了将宏运行到文件末尾的选项。下图显示了 Notepad++ 中的宏录制器。\n\
  \n![9781484200537_unFig02-01.jpg](img/9781484200537_unFig02-01.jpg)\n\n宏高度依赖于光标的位置。如果你将光标移动到文件末尾再运行宏，可能会得到一些意想不到的结果。\n\
  \n### 文本编辑器简表\n\n表 2-4 列出了一些流行的文本编辑器。将此表作为选择编辑器的起点。这绝不是一份详尽的可用编辑器列表，因此请多方比较并利用互联网查找更多信息。\n\
