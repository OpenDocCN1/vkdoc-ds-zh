  \ `comports()` 函数返回。在 Windows 版本中，使用了一种更复杂的机制，称为生成器表达式。这是一个相当高级的话题，将在第 3 章中讨论，因此我们暂时跳过。在两个版本中，列表都由成对的值组成。第一个值是串口的位置，第二个是描述信息。记下串口位置，下一节会用到。\n\
  \n### 记录 GPS 数据\n\n让我们开始收集数据。输入清单 1-2 中的代码，并将其保存到文件 `record_gps.py` 中。\n\n***清单\
  \ 1-2***。`record_gps.py`\n\n```\nimport time, serial\n\n#### 将这些参数改为您的 GPS 参数\n\
  port = '/dev/ttyUSB0'  # 在 Windows 中，将其设置为 'COMx'\nser = serial.Serial(port)\n\n\
  ser.baudrate = 4800\nfmt = \"../data/GPS-%4d-%02d-%02d-%02d-%02d-%02d.csv\"\n\n\
  filename = fmt % time.localtime()[0:6]\nf = open(filename, 'wb')\nwhile True:\n\
      line = ser.readline()\n    f.write(line)\n    print(line)\n```\n\n![图片](img/sq.jpg)\
