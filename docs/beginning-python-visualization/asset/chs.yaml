  \ (#字符数, #单词数, #行数) 的元组。\"\"\"  \n    num_chars, num_words, num_lines = 0, 0, 0\
  \  \n    for line in open(filename, encoding='latin-1'):  \n        num_chars +=\
  \ len(line)  \n        num_words += len(line.  \n```\n\n\n\n```python\nsplit())\n\
  \        num_lines += 1\n    return (num_chars, num_words, num_lines)\n```\n\n请注意，我打开文件时使用了参数\
  \ `encoding='latin-1'`；这种编码方式将字节值映射到前 256 个 Unicode 码点。本章后面你将学到更多关于 Unicode 的知识。\n\
  \n以下是运行两个函数的结果：\n\n```\n>>> wc('../data/45506-8.txt')\n```\n```\n(210960, 35100,\
  \ 3776)\n```\n```\n>>> wc_large('../data/45506-8.txt')\n```\n```\n(210960, 35100,\
  \ 3776)\n```\n\n### 示例：head 和 tail\n\n大多数 Linux 系统管理员都熟悉并喜爱 `head` 和 `tail` 这两个命令行工具。它们能快速检查安装进度，非常适合探查消息日志，也能用于查看启动时是否发生错误。\n\
  \n`head` 和 `tail` 命令行工具的工作原理分别是打印文件开头或末尾的 n 行。你通常会使用这些命令来查看日志文件，因为大多数日志文件都是纯文本文件，数据按顺序写入：最近的事件记录在文件末尾。\n\
  \n以下命令将打印 `dmesg` 日志文件（一个常见的 Linux 日志文件）的最后 20 行：\n\n```\n$ tail -20 /var/log/dmesg\n\
  ```\n\n使用 `readlines()` 方法，可以轻松地在 Python 中实现 `head()` 和 `tail()` 函数，如清单 5-6 所示。\n\
  \n***清单 5-6***. `head()` 和 `tail()` 函数\n\n```python\ndef head(filename, n=10):\n\
  \    \"\"\"打印文件的前 n 行。\"\"\"\n    for line in open(filename, encoding='latin-1').readlines()[:n]:\n\
  \        print(line.rstrip())\n\ndef tail(filename, n=10):\n    \"\"\"返回文件的最后 n\
  \ 行。\"\"\"\n    for line in open(filename, encoding='latin-1').readlines()[-n:]:\n\
  \        print(line.rstrip())\n```\n\n如果你的文件太大，无法完全读入内存，情况就会变得棘手。通过迭代文件对象可以实现 `head()`\
  \ 函数，如清单 5-7 所示。\n\n***清单 5-7***. 针对超大文件的 `head()` 函数\n\n```python\ndef head_large(filename,\
  \ n=10):\n    \"\"\"返回超大文件的前 n 行。\"\"\"\n    for i, line in enumerate(open(filename,\
  \ encoding='latin-1')):\n        print(line.rstrip())\n        if i == n-1: break\n\
  ```\n\n你可以通过修改代码使其返回列表，然后比较两个函数的返回值，来验证这两个函数都能返回正确结果。\n\n遗憾的是，以类似方式（迭代文件对象）实现 `tail()`\
  \ 函数要复杂得多。首先，你必须遍历整个文件，读取每一行。请记住，这是一个大文件；因此，这样做会耗费大量时间。即使如此，你遇到的第二个问题是，你无法预先知道哪一行是最后一行。你可能会想到几种方法。第一种，你可以对文件执行两次遍历。第一次遍历，统计行数；第二次遍历，打印最后\
  \ `n` 行。第二种，你可以持续存储读取到的最后 `n` 行。这两种方法都很麻烦。第三种方法是使用随机访问函数，从文件末尾开始读取并反向处理。这需要使用 `seek()`\
  \ 函数，该函数将在第 10 章中介绍。\n\n### 示例：拆分与合并文件\n\n在过去，计算机用户曾用 360K 软盘传输文件。由于这相当痛苦，他们选择使用既能拆分又能压缩的文件压缩工具。可惜的是，其中一张软盘似乎总是放错地方，导致数据完全无用。虽然软盘早已消失，但将大文件拆分成更小、更易于管理的文件的需求仍然是一项常见任务。\n\
  \n每个数据块不一定包含可读信息，但它们能适配有大小限制的传输介质（如电子邮件、U 盘）。接收端随后需要从拆分后的文件重建原始文件。\n\n`splitfile()`\
  \ 函数将一个文件拆分成 `n` 个较小的文件，每个文件都带有修改后的文件名，由原始文件名加上拆分文件索引组成（例如 `45506-8.txt.1`）。`combinefiles()`\
  \ 函数将多个符合上述模式的文件合并为一个，如清单 5-8 所示。\n\n***清单 5-8***. 拆分与合并文件\n\n```python\ndef splitfile(filename,\
  \ size=1024**2):\n    \"\"\"将一个文件拆分成 n 个较小的文件。文件以递增索引创建。\"\"\"\n\n    fin, index\
  \ = open(filename, 'rb'), 0\n    data = fin.read(size)\n    while data:\n      \
  \  index += 1\n        outfilename = filename+'.'+str(index)\n        fout = open(outfilename,\
  \ 'wb')\n        fout.write(data)\n        fout.close()\n        print(\"已创建文件 %s，大小\
  \ %d\" % (outfilename, len(data)))\n        data = fin.read(size)\n    return\n\n\
  def combinefiles(filename):\n    \"\"\"合并之前拆分的文件。假定文件扩展名是递增索引。重要提示：如果名为 filename\
  \ 的文件已存在，它将被覆盖。\"\"\"\n\n    fout, index = open(filename, 'wb'), 0\n    while True:\n\
  \        index += 1\n        try:\n            data = open(filename+'.'+str(index),\
  \ 'rb').read()\n            fout.write(data)\n        except IOError:\n        \
  \    break\n    fout.close()\n    print(\"已从 %d 个文件创建文件 %s\" % (index-1, filename))\n\
  ```\n\n这些函数本身不言自明，应该很容易理解。以下是使用 `splitfile()` 的方法：\n\n```\n>>> splitfile('../data/45506-8.txt',\
  \ 100000)\n```\n```\n已创建文件 ../data/45506-8.txt.1，大小 100000\n已创建文件 ../data/45506-8.txt.2，大小\
  \ 100000\n已创建文件 ../data/45506-8.txt.3，大小 10960\n```\n\n现在，将位于 `../data` 目录中的文件 `45506-8.txt.*`\
  \ 复制到一个临时目录 `../data/tmp`。这样做是为了在合并文件时，原始文件不会被覆盖。你可以手动操作，也可以运行以下代码：\n\n```\n>>>\
  \ import os\n>>> src = '../data/45506-8.txt.%d'\n>>> dest = '../data/tmp/45506-8.txt.%d'\n\
  >>> for i in range(1, 4):\n...    os.renames(src % i, dest % i)\n>>> os.listdir('../data/tmp')\n\
  ```\n```\n['45506-8.txt.1', '45506-8.txt.2', '45506-8.txt.3']\n```\n\n我将在第 10 章中详细介绍前面脚本中使用的\
  \ `os` 模块。\n\n要合并文件，请执行以下操作：\n\n```\n>>> combinefiles('../data/tmp/45506-8.txt')\n\
  ```\n```\n已从 3 个文件创建文件 ../data/tmp/45506-8.txt\n```\n\n要验证文件是否完全相同，请执行以下操作：\n\n\
  ```\n>>> data1 = open('../data/45506-8.txt', 'rb').read()\n>>> data2 = open('../data/tmp/45506-8.txt',\
  \ 'rb').read()\n>>> data1 == data2\n```\n```\nTrue\n```\n\n虽然本节的主题是文本文件，但 `splitfile()`\
  \ 和 `combinefiles()` 函数同样适用于二进制文件，因为我们是以二进制模式打开文件的。\n\n![Image](img/sq.jpg) **注意**\
  \ 如果文件已存在，`combinefiles()` 函数会将其覆盖。\n\n如果你希望 `combinefiles()` 在文件已存在时不覆盖它，可以使用 `os.path`\
  \ 模块中的 `os.path.exists()` 函数来检查文件是否存在并做出相应处理（询问用户偏好或直接返回而不覆盖文件）。\n\n### 示例：在文本文件中搜索\n\
  \n到目前为止的示例都只涉及文件本身，并未真正处理它们包含的信息。接下来的示例将同时关注文件内容；也就是说，它们会读取文件并处理文本。\n\n一个常见的编程任务是在文件中搜索字符串。\n\
  \n\n\n#### 搜索文本文件\n\n更常见的任务是在多个文件中搜索字符串；不过，我们将留待后续讨论（参见第 10 章）。在 Linux 中，有一个便捷工具可以实现此功能：`grep`。该工具还支持更复杂的搜索，例如包含正则表达式的搜索。但在此示例中，我们仅讨论简单的字符串搜索。\n\
  \n如代码清单 5-9 所示，在 Python 中实现文本文件搜索非常容易。\n\n***代码清单 5-9***. 搜索文本文件\n\n```\ndef srchfile(filename,\
  \ substr):\n    \"\"\"在文件中搜索子字符串。\"\"\"\n    for index, line in enumerate(open(filename,\
  \ encoding='latin-1')):\n        if line.find(substr) != -1:\n            try:\n\
  \                print(\"%4d:%s\" % (index, line.rstrip()))\n            except\
  \ UnicodeEncodeError:\n                print(\"%4d: ---编码错误---\" % index)\n```\n\
  \n我使用了迭代器 `enumerate()` 来同时获取行内容和行号，因为后续 `print()` 函数调用会显示行号。我还使用了 `rstrip()` 方法来移除多余的换行符。以下是运行命令\
  \ `srchfile('../data/45506-8.txt', 'Guide')` 的输出：\n\n```\n2612:Prostrating myself\
  \ mentally before my Guide, I cried, \"How is it, O\n2654:your Wife,\" said my Guide;\
  \ \"she will not be long left in anxiety;\n2699:\"Here we descend,\" said my Guide.\
  \ It was now morning, the first hour of\n2727:to descend at this moment and enlighten\
  \ them.\" \"Not yet,\" said my Guide,\n2769:absolutely depended on the volition\
  \ of my Guide, who said in gloomy\n3038:\"Look yonder,\" said my Guide, \"in Flatland\
  \ thou hast lived; of Lineland\n```\n\n函数 `srchfile()` 仍有改进空间。首先，该函数区分大小写。为了实现不区分大小写的搜索，我建议为函数添加一个参数，用于控制搜索是否区分大小写。在进行不区分大小写的搜索时，`srchfile()`\
  \ 应使用 `upper()`（或 `lower()`）函数，在调用 `find()` 之前将待搜索的行和搜索字符串都进行转换。\n\n另一个改进是修复行号的缩进问题。目前，行号采用右对齐，占四个空格。如果行数达到\
  \ 10,000 行或更多，这会导致缩进问题。通过一次性读取整个文件，我们可以获得总行数，从而利用 `math` 模块中的 `log10()` 函数（参见第 7\
  \ 章）计算最大位数：\n\n```\n>>> numlines = 1234\n>>> from math import log10\n>>> maxdigits\
  \ = int(log10(numlines))+1\n>>> maxdigits\n```\n\n```\n4\n```\n\n这仅在预先知道行号时有效；因此，需要修改函数以一次性读取整个文件。代码清单\
  \ 5-10 展示了修复缩进问题的一种可能实现。\n\n***代码清单 5-10***. 搜索文本文件（正确缩进）\n\n```\ndef srchfile_ex(filename,\
  \ substr):\n    \"\"\"在文件中搜索子字符串。\"\"\"\n    lines = open(filename, encoding='latin-1').readlines()\n\
  \    fmt = r'%' + str(int(log10(len(lines)))+1) + r'd:%s'\n    for index, line in\
  \ enumerate(lines):\n        if line.find(substr) != -1:\n            try:\n   \
  \             print(fmt % (index, line.rstrip()))\n            except UnicodeEncodeError:\n\
  \                print(\"%d: --- 编码错误 ---\" % index)\n```\n\n请注意，我首先使用原始字符串创建了格式说明符\
  \ `fmt`，然后使用它来打印行号和字符串。\n\n### 示例：处理注释\n\n我发现我经常需要回顾之前编写的代码。而记忆最深刻的往往是注释。一种有趣的查看注释的方式是将注释符号（`#`）视为分隔符。\n\
  \n基于此思路，你可以实现一些有趣的搜索，如代码清单 5-11 所示。例如，你可以仅在注释内搜索，或者执行该搜索的补集（即，从搜索中*排除*注释）。\n\n***代码清单\
  \ 5-11***. 处理注释\n\n```\ndef srchcomments(filename, substr):\n    \"\"\"在 Python\
  \ 源代码注释中搜索。\"\"\"\n    for index, line in enumerate(open(filename, 'rt')):\n   \
  \     L = line.split('#')\n        if len(L) == 2:\n            if L[1].find(substr)\
  \ != -1:\n                print(\"%5d: %s\" % (index, line.rstrip()))\n```\n\n这段代码并非万无一失。它假设\
  \ `#` 符号只出现一次，`#` 之前的文本始终是代码，而 `#` 之后的文本是注释。这并不总是成立；例如，在前述代码的第四行 `L = line.split('#')`\
  \ 中，`#` 并非注释分隔符。尽管如此，该函数在多数情况下仍能正常工作。\n\n以代码清单 5-11 中的函数为起点，你可以编写一个函数，将不在单独行上的注释转换为单行注释。例如，某行最初可能如下所示：\n\
  \n```\nport = '/dev/ttyUSB0'  # in Windows, set this to 'COMx'\n```\n\n而你的函数会将其转换为类似这样的形式：\n\
  \n```\n#### in Windows, set this to 'COMx'\nport = '/dev/ttyUSB0'\n```\n\n#### C++\
  \ 风格注释\n\n我最初是在 C/C++中遇到这个问题的。我用来编写代码的编译器接受 C++风格的注释，其行为与 Python 的注释类似（只是符号为 `//`\
  \ 而非 `#`）。然而，另一个使用的旧编译器不接受 C++风格的注释，因此我必须将所有形如 `// comment` 的单行注释转换为 C 风格的注释，形如\
  \ `/* comment */`。我使用了类似上述的脚本来完成此操作。幸运的是，符号 `//` 在代码中除了作为注释的一部分外，并未出现在其他地方。\n\n\
  ### 示例：从文本文件中提取数字\n\n有时，能够仅提取文本文件中的数字非常有用。例如，你可能希望基于现有文件创建文件用于测试。另一种场景是，你有一个系统在文本文件中维护用户数量，并且希望编写一个脚本来递增该数字。\n\
  \n代码清单 5-12 中的函数读取一个文本文件，并创建一个所有数字都递增后的修改版本。在此示例中，数字由空白字符分隔。\n\n***代码清单 5-12***.\
  \ 递增文件内容\n\n```\ndef increment_contents(filename):\n    \"\"\"递增文件中的数值，并创建新文件。\"\
  \"\"\n    data = open(filename).readlines()\n    for i, line in enumerate(data):\n\
  \        for word in line.split():\n            try:\n                data[i] =\
  \ line.replace(word, str(int(word)+1))\n            except ValueError:\n       \
  \         # 如需反馈，请取消以下注释\n                # print(word, \" 不是数字\")\n           \
  \     pass\n    open(filename+'.inc', 'wt').writelines(data)\n```\n\n上述函数将整个文件读入内存，然后逐行处理数据（也可以通过迭代文件对象实现相同功能）。每一行被拆分为单词。代码随后尝试将每个单词转换为数字，并在成功时用递增后的值替换该数字。我使用了\
  \ `replace()` 方法函数来实现这一点，这就是为什么在递增后你会看到另一个 `str()` 函数调用：`replace()` 方法需要字符串，而非数字。\n\
  \n在实现该函数时，我尝试将遇到的每个单词转换为 `int`，然后递增它。成功时，数据被修改。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n如果 `ValueError` 发生，因为转换未成功，这意味着该字符串无法转换为 `int`，在这种情况下，我已忽略该单词。为了测试该函数，我再次求助于购物清单。假设文件\
  \ `../data/grocery_list.txt` 的内容如下：\n\n```\nMilk 12\nEggs 12.0\nOlives 1e2\nVoodo\
  \ dolls 1+1j\n```\n\n执行 `increment_contents('../data/grocery_list.txt')` 后，会创建一个新文件\
  \ `../data/grocery_list.txt.inc`，其内容如下：\n\n```\nMilk 13\nEggs 12.0\nOlives 1e2\n\
  Voodoo dolls 1+1j\n```\n\n该函数仅递增了值 `12`，因为我使用了 `int()` 函数。如果我使用了 `float()` 函数，前三个值都会被正确递增。然而，第一个数字会被转换为\
  \ `float` 值，而我希望将其保留为 `int`。\n\n通过嵌套异常处理，可以同时处理 `float` 和 `int` 值。首先，函数尝试使用 `int()`；如果\
  \ `int()` 失败，则尝试使用 `float()`（参见 Listing 5-13）。\n\n***Listing 5-13***. 使用 `float()`\
  \ 和 `int()` 递增文件内容\n\n```\ndef increment_contents_both(filename):\n    \"\"\"Increments\
  \ values in a file, creating a new file.  Works with both ints and floats.\"\"\"\
  \n    data = open(filename, 'rt').readlines()\n    for i, line in enumerate(data):\n\
  \        for word in line.split():\n            try:\n                data[i] =\
  \ line.replace(word, str(int(word)+1))\n            except ValueError:\n       \
  \         try:\n                    data[i] = line.replace(word, str(float(word)+1))\n\
  \                except ValueError:\n                    # uncomment the following\
  \ if you'd like feedback\n                    # print(word, \"is not a number\"\
  )\n                    pass\n    open(filename+'.inc', 'wt').writelines(data)\n\
  ```\n\n运行 `increment_contents_both()` 函数的结果如下：\n\n```\nMilk 13\nEggs 13.0\nOlives\
  \ 101.0\nVoodoo dolls 1+1j\n```\n\n如您所见，值 `1e2` 和 `12.0` 现在都被递增了。\n\n最后，这些函数假设数字总是由空格分隔，但这可能并不总是正确的。另一种方法是基于标点符号以及空格进行分割（有关基于标点符号分割的更多信息，请参见本章后面的“示例：仅使用一次的单词”部分）。\n\
  \n## CSV 文件\n\n到目前为止，我们一直在处理纯文本文件。纯文本文件通常不遵循任何格式，除了其内容是文本形式这一事实。但在现实中，当处理数据文件时，它们比纯文本文件更具结构性。正如之前在\
  \ 第 4 章 中讨论的，CSV 文件格式是结构化、基于文本的数据文件的一种良好格式。本节的目的在于为下一节将要介绍的高级日志文件处理提供工具。\n\n###\
  \ `csv` 模块\n\n`csv` 模块是 Python 标准库的一部分，它提供了读取和写入 CSV 文件的简单方法。要使用 `csv` 模块，请执行 `import\
  \ csv`；后续讨论假设您已正确导入 `csv` 模块。\n\n您将使用两个基本对象：`csv.reader` 和 `csv.writer`。顾名思义，一个用于读取，另一个用于写入。\n\
  \n`csv.reader` 对象将一行文本分割成一个单词列表（也称为字段）。虽然您可能认为使用 `split()` 字符串方法分割文本行更简单，但一些注意事项使得这比表面看起来要复杂得多。\n\
  \n考虑一个包含以下内容的 CSV 文件（假设它存储在文件 `../data/sometext.csv` 中）：\n\n```\n1/1/2000,\"Some\
  \ text, and a comma\"\n1/1/2000, \"Some text, and a comma\"\n```\n\n如果我使用 `split()`\
  \ 函数，我会得到：\n\n```\n>>> L = open('../data/sometext.csv').read().split(',')\n>>> from\
  \ pprint import pprint\n>>> pprint(L)\n```\n\n```\n['1/1/2000',\n '\"Some text',\n\
  \ ' and a comma\"\\n1/1/2000',\n ' \"Some text',\n ' and a comma\"\\n']\n```\n\n\
  这并非我真正想要的，字段和行也没有正确分隔。这是因为 `split()` 不尊重字符串引号；也就是说，即使逗号被包含在字符串中，它也会在逗号处进行分割。\n\n\
  使用 `csv.reader` 对象，我得到了更好的结果：\n\n```\n>>> f = open('../data/sometext.csv')\n>>>\
  \ for line in csv.reader(f, skipinitialspace=True):\n...    print(line)\n...\n```\n\
  \n```\n['1/1/2000', 'Some text, and a comma']\n['1/1/2000', 'Some text, and a comma']\n\
  ```\n\n```\n>>> f.close()\n```\n\n### `csv.reader` 对象\n\n要创建 `csv.reader` 对象，请使用以下语法：`csv.reader(f[,\
  \ dialect='excel'][, params])`。第一个参数 `f` 是 CSV 文件，但它也可以是任何可迭代对象。第二个参数是 `dialect`。由于对于\
  \ CSV 文件的构成没有明确定义（并且存在相当多的细微差别），您可以指定一个 `dialect`，它是一组规则，用于指示 `csv.reader` 解析器如何处理这些差异。此外，您可以使用现有的\
  \ `dialect`，并通过 `params` 字段覆盖其行为的某些参数。\n\n在前面的示例中，我没有指定 `dialect`，它默认使用 `'excel'`\
  \ 方言。我确实提供了一个格式参数，指示 `csv.reader` 忽略字段开头的空格（在我的输入文件的第二行文本中，逗号后面有一个额外的空格）。您可以通过执行\
  \ `csv.getdialects()` 查看系统中的方言列表。\n\n一旦您有了 `csv.reader` 对象，就可以遍历该对象并检索字段列表。\n\n\
  ### `csv.writer` 对象\n\n`csv.writer` 对象通过允许写入 CSV 文件来补充 `csv.reader`。创建 `csv.writer`\
  \ 对象类似于创建 `csv.reader` 对象：`csv.writer(f[, dialect='excel'][, params])`。区别（除了写入与读取操作之外）在于\
  \ `csv.writer` 对象严格要求一个文件，而不是任何可迭代对象。一旦您有了 `csv.writer` 对象，就可以使用 `writerow()` 或\
  \ `writerows()` 方法：\n\n```\n>>> lines = [[\"1/1/2000\", \"Some text, and a comma\"\
  ]]\n>>> csv.writer(open('../data/outtext.csv', 'w')).writerows(lines)\n```\n\n![Image](img/sq.jpg)\
  \ **注意** 我创建了一个行列表（注意双括号），尽管只有一行。这是为了匹配 `csv.writer` 对象期望的输入。如果您向 `csv.writer` 对象传递一个列表，而不是一个行列表，结果可能不符合您的预期。\n\
  \n### 更多 CSV 功能\n\n`csv` 模块允许进行大量自定义，包括使用和创建用户定义的方言。我不会涵盖这个主题；但是，我将介绍一些参数及其含义。\n\
  \n`delimiter` 指定字段分隔符。换句话说，行会在出现 `delimiter` 的地方被分割，前提是它没有被转义或引用。要更改字段分隔符，请将 `delimiter=char`\
  \ 作为参数添加到 `csv.reader` 对象；`char` 必须是一个字符：\n\n```\n>>> for line in csv.reader(open('../data/sometext.csv'),\
  \ delimiter='/'):\n...    print(line)\n...\n```\n\n```\n['1', '1', '2000, \"Some\
  \ text, and a comma\"']\n['1', '1', '2000, \"Some text, and a comma\"']\n```\n\n\
  （在此示例中，我选择以斜杠进行分割是为了教学目的；当然，更好的分割方式是以逗号分割，因为这样可以将日期与条目分开。）\n\n参数 `quotechar` 指定用于表示\
  \ CSV 文件中字符串的引用字符：\n\n```\n>>> lines = [[\"1/1/2000\", \"Some text, and a comma\"\
  ]]\n>>> f = open('../data/outtext.csv', 'w')\n>>> csv.writer(f, quotechar='|').writerows(lines)\n\
  >>> f.close()\n```\n\n\n\n`close()`\n\n```\n上述示例的结果如下：\n1/1/2000,|Some text, and\
  \ a comma|\n```\n\n在此示例中，日期未被引号包裹，而文本被包裹——原因是文本中包含分隔符。若要覆盖引号行为，可将 `quoting` 的值改为\
  \ `csv.QUOTE_MINIMAL`、`csv.QUOTE_ALL`、`csv.QUOTE_NONNUMERIC` 或 `csv.QUOTE_NONE`。这些名称已明确指示其功能。若选择\
  \ `csv.QUOTE_NONE` 且某个字段包含分隔符，则必须同时提供 `escapechar`：\n\n```\n>>> lines = [[\"1/1/2000\"\
  , \"Some text, and a comma\"]]\n>>> f = open('../data/outtext.csv', 'w')\n>>> cw\
  \ = csv.writer(f, quoting=csv.QUOTE_NONE, escapechar='~')\n>>> cw.writerows(lines)\n\
  >>> f.close()\n```\n\n上述示例的结果如下：\n\n```\n1/1/2000,Some text~, and a comma\n```\n\
  \n### `DictReader` 和 `DictWriter` 对象\n\n`csv` 模块还为我们提供了其他有用的对象：`DictReader` 和 `DictWriter`\
  \ 对象，它们与 `csv.reader` 和 `csv.writer` 对象类似。这些对象特别适用于写入和读取字典对象，而字典对象是 Python 中处理逗号分隔值（CSV）的理想数据结构。\n\
  \n如果你遵循在 CSV 文件开头放置表头的惯例——即 CSV 文件中的每一列都以字段名开头（参见第 4 章的讨论）——那么可以通过将字段名作为键来访问字典中的值。\n\
  \n让我们看一个示例。请先创建包含以下内容的文件 `../data/tobuy.csv`：\n\n```\nItem,Count\nMilk,2\nEggs,12\n\
  Tomatoes,5\n```\n\n现在创建一个 `DictReader` 对象：\n\n```\n>>> import csv\n>>> fcsv = open('../data/tobuy.csv')\n\
  >>> for row in csv.DictReader(fcsv):\n...     print(\"Please buy\", row['Count'],\
  \ row['Item'])\n...\n```\n\n```\nPlease buy 2 Milk\nPlease buy 12 Eggs\nPlease buy\
  \ 5 Tomatoes\n```\n\n我使用 `'Count'` 和 `'Item'` 作为字典对象 `row` 的键来访问 CSV 文件中的值：`row['Count']`\
  \ 和 `row['Item']`。即使列的顺序调换，代码仍能按预期工作。\n\n类似地，你可以按如下方式创建 `DictWriter` 对象：\n\n```\n\
  >>> header = ['Item', 'Count']\n>>> rows = [['Organic Eggs', 5], ['Cucumbers', 12\
  \ ]]\n>>> fcsv = open('../data/tobuy_more.csv', 'w', newline='')\n>>> dict_wr =\
  \ csv.DictWriter(fcsv, header)\n>>> dict_wr.writeheader()\n>>> for row in rows:\n\
  ...     dict_wr.writerow(dict(zip(header, row)))\n...\n>>> fcsv.close()\n```\n\n\
  我首先创建了 `header`（一个字符串列表）和 `data`（一个行列表）。然后打开一个名为 `fcsv` 的文件用于写入，并将其关联到一个名为 `dict_wr`\
  \ 的 `csv.DictWriter` 对象。如你所见，`csv.DictWriter` 也需要表头信息。由于我希望表头作为第一行出现在文件中，因此调用了成员函数\
  \ `writeheader()`，它会向文件写入一行表头。\n\n现在到了稍微复杂的地方。我希望将每一行与表头关联起来，这样在调用 `writerow()`\
  \ 成员函数时，字段能够正确关联。这可以通过将每一行与表头进行 zip 操作来实现，如下所示：\n\n```\n>>> header = ['Item', 'Count']\n\
  >>> rows = [['Organic Eggs', 5], ['Cucumbers', 12]]\n>>> for row in rows:\n... \
  \    print(list(zip(header, row)))\n...\n```\n\n```\n[('Item', 'Organic Eggs'),\
  \ ('Count', 5)]\n[('Item', 'Cucumbers'), ('Count', 12)]\n```\n\n现在，只需在 `DictWriter`\
  \ 对象中执行此操作：\n\n```\n>>> for row in rows:\n...    dict_wr.writerow(dict(zip(header,\
  \ row)))\n```\n\n以下是文件 `../data/tobuy_more.csv` 的内容：\n\n```\nItem,Count\nOrganic\
  \ Eggs,5\nCucumbers,12\n```\n\n如你所见，`DictWriter` 对象使用起来并不简单。这就是我很少使用它的原因，尽管我经常使用\
  \ `DictReader`。关于 `DictReader` 和 `DictWriter` 的完整说明，请参考 Python 库参考手册。\n\n## 日期和时间\n\
  \n文本文件很重要，但文本并非本书的重点，本书更侧重于数字。在处理数据文件时，最常见的数据形式是日期和时间。基于日期和时间记录信息（尤其是记录已发生事件）的文本文件，通常被称为*日志文件*。\n\
  \n我最近在 `C:\\Windows` 目录中搜索了文件名包含“log”的文件，找到了几十个确实是日志文件的文件。我用最喜欢的编辑器打开了其中一些；在那些确实记录了日期和时间的文件中，日期和时间信息的格式各不相同。\n\
  \n一个文件的时间戳看起来像这样：\n\n```\n06/21/2008 21:57:20: Some text\n06/21/2008 21:57:25: Some\
  \ text\n```\n\n不幸的是，并非每一行都以时间戳开头。另一个文件看起来像这样：\n\n```\n2008-10-21    20:37:26 Some\
  \ text\n2008-10-21    20:37:26 Some text\n```\n\n还有一个文件看起来像这样：\n\n```\n=== Logging\
  \ stopped: 6/26/2008  15:53:09 ===\nSome text\n[15:53:09:109]: Some text\nSome text\n\
  [15:53:09:109]: Some text\n=== Verbose logging stopped: 6/26/2008  15:53:09 ===\n\
  ```\n\n另一个文件看起来像这样：\n\n```\n[Thu Aug 12 22:36:49 2004] Some text\n[Sat Aug 14 12:54:01\
  \ 2004] Some text\n[Sat Aug 14 13:25:21 2004] Some text\n[Sat Aug 14 14:41:48 2004]\
  \ Some text\n```\n\n在这些日志文件中，我特别喜欢那些不节省硬盘空间、每条记录都始终包含时间戳的文件。原因在于，后续解析数据时无需使用状态机，从而大大简化了代码（关于状态机的讨论，请参考\
  \ David Mertz 所著的《Python 文本处理》，Addison-Wesley，2003 年，也可在线查阅 `http://gnosis.cx/TPiP`）。那些偶尔才写入日期和时间信息的日志文件更难处理。显然，编写这些文件的人没有考虑到解析应用程序——他是否认为阅读这些文件的是人而不是计算机？\n\
  \n![Image](img/sq.jpg) **提示** 编写日志文件时，请以完整的日期和时间信息作为每行文本的开头。这将使日志文件的处理更加容易。\n\n\
  作为 Python 标准库一部分的 `time` 模块，可以轻松处理日期和时间信息。\n\n### `time` 模块\n\n`time` 模块提供了一组辅助函数和结构，能够以简单的方式处理日期和时间。模块中的某个时间点（即日期和时间）可以通过以下两种方式之一表示：\n\
  \n- **九元素元组**：该元组包含年、月、日、时、分、秒、星期、儒略日和夏令时（DST）。其中，星期和儒略日是冗余的：你可以根据其他值（年、月、日）计算出这些值。我们将此元组称为\
  \ `struct_time` 元组。\n- **自纪元以来的秒数**：纪元是一个固定的时间参考点，取决于系统。在我的系统上，纪元是 Thu Jan 01 00:00:00\
  \ 1970。有时人们用“epoch”一词来表示自纪元以来经过的秒数，而不是固定的时间参考点；这通常根据上下文可以轻松区分。\n\n一些 `time` 模块函数接受\
  \ `struct_time` 元组，而另一些则接受纪元值。在两种表示法之间切换并不复杂。了解了这两种表示法后，让我们来探索 `time` 模块。但首先，要使用该模块，请确保执行\
  \ `import time`。\n\n### `struct_time` 元组\n\n可以通过索引访问 `struct_time` 元组的特定元素；例如，如果\
  \ `t` 是一个 `struct_time` 元组，那么 `t[0]` 就是年份值。然而，使用索引很难理解，你需要不断查阅文档才能确定哪个索引对应你正在查找的特定值。\n\
  \n\n\n相反，你可以使用成员变量 `tm_year`、`tm_month`、`tm_day`、`tm_hour`、`tm_min`、`tm_sec`、`tm_wday`、`tm_yday`\
  \ 和 `tm_isdst` 来获取这些值：\n\n```\n>>> from time import localtime\n>>> localtime()\n\
  time.struct_time(tm_year=2014, tm_mon=5, tm_mday=24, tm_hour=17, tm_min=54, tm_sec=41,\
  \ tm_wday=5, tm_yday=144, tm_isdst=1)\n>>> localtime().tm_year\n2014\n>>> localtime().tm_yday\n\
  144\n```\n\n在这个示例中，我介绍了函数 `localtime()`，它返回当前时间，结果是一个 `struct_time` 元组。\n\n### 解析和格式化日期与时间\n\
  \n函数 `strftime()` 和 `strptime()` 是处理日志文件时最常用的两个函数。函数 `strptime()`（已在第 4 章中介绍）接受一个模板解析字符串和待解析的字符串，并返回时间的\
  \ `struct_time` 表示。函数 `strftime()` 则执行相反操作：根据提供的模式将元组转换为字符串。这两个函数使用类似的符号来表示 `struct_time`\
  \ 元组中的值，如表 5-2 所示。\n\n表 5-2。`strftime()` 和 `strptime()` 的选定标识符\n\n| 标识符 | 描述 | 取值范围\
  \ |\n| --- | --- | --- |\n| `%Y` | 带世纪的年份，以十进制数表示 |  |\n| `%m` | 月份，以十进制数表示 | 1–12\
  \ |\n| `%d` | 月份中的日期，以十进制数表示 | 1–31 |\n| `%H` | 小时，以十进制数表示 | 0–23 |\n| `%M` | 分钟，以十进制数表示\
  \ | 0-59 |\n| `%S` | 秒，以十进制数表示 | 00-61（61 表示闰秒） |\n| `%w` | 星期几，以十进制数表示 | 0–6（其中\
  \ 0 表示星期日） |\n| `%j` | 年份中的天数，以十进制数表示 | 001-366（366 表示闰年） |\n| `%z` | 时区字段。夏令时没有自己的标识符，属于此字段的一部分。\
  \ |  |\n| `%a`, `%A` | 区域设置的星期几名称，缩写和全称 |  |\n| `%b`, `%B` | 区域设置的月份名称，缩写和全称 | \
  \ |\n\n完整表格包含更多标识符，可在线查阅：`https://docs.python.org/3.3/library/time.html`。\n\n那么，让我们尝试从本节开头提供的一些示例中提取日期信息。\n\
  \n### 示例：使用日期和时间戳记录日志信息\n\n本示例的目的是根据“日期和时间”部分之前给出的提示以及 ISO 时间格式建议（参见第 4 章）创建一个日志文件。\n\
  \n我们将使用函数 `localtime()`，它返回一个包含当前时间的 `struct_time` 元组。然后，我们使用 `strftime()` 函数格式化当前时间：\n\
  \n```\n>>> from time import localtime, strftime\n>>> strftime(\"%Y-%m-%dT%H-%M-%S\"\
  , localtime())\n'2014-05-24T17-57-37'\n```\n\n虽然这种表示法对文件名很方便，但在日志文件中，你可能希望使用更具自解释性的内容。在这种情况下，你可以使用\
  \ `asctime()` 函数：\n\n```\n>>> from time import asctime\n>>> asctime(localtime())\n\
  'Sat May 24 17:58:45 2014'\n```\n\n不过，我将使用以下格式：\n\n```\n>>> from time import strftime,\
  \ gmtime\n>>> strftime('%d-%b-%Y %H:%M:%S', gmtime())\n'24-May-2014 15:00:02'\n\
  ```\n\n我这样做是为了展示 ISO 格式以外的其他格式，并且因为这种格式几乎不会产生误解。不过，我建议尽可能遵循 ISO 时间格式。\n\n![Image](img/sq.jpg)\
  \ **提示** 在我看来，ISO 日期和时间格式是编写日期和时间信息的首选方法。一开始它可能有点晦涩，需要一些时间来适应，但它非常一致且易于使用。例如，要对\
  \ ISO 时间格式的日期进行排序，你可以直接对字符串进行排序，而无需将其转换为数值。\n\n我认为 `asctime()` 的输出增加了一个不必要的值——如果你愿意，可以说是冗余信息：星期几。我选择的格式在不同区域设置下也可能存在问题（请参阅本章后面的“区域设置”部分），但很难出错。它可能也是所展示格式中最具自解释性的，但这更多是个人品味问题。\n\
  \n现在我们已经将日期和时间作为字符串获取，接下来将其写入日志文件。清单 5-14 展示了一个你可以运行的示例脚本。该脚本生成一个符合本章及前几章给出的指导原则的日志文件。\n\
  \n***清单 5-14***。创建日志文件\n\n```\nfrom time import strftime, gmtime, sleep\ntime_str\
  \ = strftime(\"%Y-%m-%dT%H-%M-%S\", gmtime())\nflog = open(\"../data/LogExample%s.txt\"\
  \ % time_str, 'wt')\nfor i in range(5):\n    sleep(1.7)\n    logline = \"%s | Some\
  \ data %d\\n\" % \\\n        (strftime('%d-%b-%Y %H:%M:%S', gmtime()), i)\n    flog.write(logline)\n\
  flog.close()\n```\n\n我引入了 *time* 模块中的另一个函数：`sleep()`。`sleep()` 函数接受一个参数，即需要休眠的秒数，并在该时间段过后返回。我选择使用一个小数值，这样日志文件看起来更“真实”；也就是说，时间增量不是固定的：\n\
  \n```\n24-May-2014 15:02:26 | Some data 0\n24-May-2014 15:02:28 | Some data 1\n\
  24-May-2014 15:02:30 | Some data 2\n24-May-2014 15:02:31 | Some data 3\n24-May-2014\
  \ 15:02:33 | Some data 4\n```\n\n`strftime()` 函数的另一个好处是，对于不需要完整字段长度的值，它会添加前导零。因此，凌晨\
  \ 1 点将在小时字段中显示为 `01`。这在解析时非常有用，因为时间格式具有固定长度，可以进行字符串切片。\n\n日志记录的一个问题是，如果程序崩溃，你可能会丢失重要信息。为了解决这个问题，你可以在记录数据时定期（甚至每次）打开和关闭日志文件。这样，即使程序崩溃，你的文件仍然会更新。另一种替代方案是使用\
  \ Python 标准库中的 *logging* 模块，这里我不再赘述。有关 *logging* 模块的信息，请参阅 `https://docs.python.org/3.3/library/logging.html`。\n\
  \n### 示例：从文件内容中提取日期和时间信息\n\n我们已经在第 4 章中看到了使用 `strptime()` 的示例。这里我们将更详细地介绍它。这次，我们希望解析“日期和时间”部分开头展示的一些日期和时间格式。\n\
  \n为了本示例的目的，我将为每种不同的时间格式分配一个字符串，并解析每个字符串。现在，你应该能够编写包装函数，使用常规文件操作或 *csv* 模块来实现文件的读写。为了证明格式被正确读取，我将打印时间的\
  \ `asctime()` 版本：\n\n```\n>>> from time import strptime\n>>> log1 = '06/21/2008\
  \ 21:57:20: Some text'\n>>> time1 = strptime(log1[:19], '%m/%d/%Y %H:%M:%S')\n>>>\
  \ asctime(time1)\n'Sat Jun 21 21:57:20 2008'\n```\n\n如果你查看字符串 `log1` 中的时间信息，它似乎遵循固定长度。这一点尤其明显，因为月份字段有前导零（`06`）。因此，为了仅提取信息，我在开头对字符串进行了切片。然后，我使用\
  \ `strptime()` 函数完成其余工作。如果日期值小于或等于 12，我无法预先知道该字段是 `%m/%d` 还是 `%d/%m`。此外，如果时间戳不是固定大小的字符串，我将需要采用其他方法，例如拆分字符串并处理各个字段。\n\
  \n\n\n#### 排版后的内容\n\n现在让我们看看下一个字符串：\n\n```\n>>> from time import asctime, strptime\n\
  >>> log2 = '2008-10-21\\t20:37:26 Some text'\n>>> print(log2)\n```\n\n```\n2008-10-21\
  \      20:37:26 Some text\n```\n\n```\n>>> time2 = strptime(log2[:19], '%Y-%m-%d\\\
  t%H:%M:%S')\n>>> asctime(time2)\n```\n\n```\n'Tue Oct 21 20:37:26 2008'\n```\n\n\
  这个示例包含一个字符串，其中日期和时间由制表符分隔，格式略有不同。但同样，这对`strptime()`来说几乎不成问题。\n\n解析剩余字符串的日期和时间信息应该不会太复杂。\n\
  \n### 纪元：将时间基准“线性化”\n\n到目前为止，我们只使用了`struct_time`元组。现在是时候讨论纪元表示法了。正如我所提到的，自纪元以来的秒数是`time`模块支持的另一种时间表示形式。有时，使用纪元表示法比使用`struct_time`表示法更有利。\n\
  \n首先想到的原因是可视化。如果你想根据时间绘制数据，而你的时间基准是`struct_time`形式，那么这很难做到。你必须想办法“线性化”时间基准，这样时间基准就不会出现偏差。\n\
  \n你已经看到了两个线性化时间序列数据的例子。第一个在第 1 章中，我通过将小时值乘以 3600，加上分钟值乘以 60，再加上秒数，手动线性化了时间序列数据。第二个例子在第\
  \ 4 章中，我使用`mktime()`和`gmtime()`计算一年中的第几天作为线性时间基准。\n\n虽然这些都是不错的选择，但还有一种更标准化的方法，那就是使用纪元表示法。正如我之前提到的，纪元是系统相关的，它作为一个时间参考点，通过经过的总秒数（也允许分数值）来衡量时间。\n\
  \n以下是如何在你的系统中找出纪元：\n\n```\n>>> from time import asctime, gmtime\n>>> asctime(gmtime(0))\n\
  ```\n\n```\n'Thu Jan  1 00:00:00 1970'\n```\n\n从现在开始，你已经有了一个线性时间基准：纪元表示法。\n\n让我们修改第\
  \ 1 章中的 GPS 示例。你可能还记得，时间信息如下：`hhmmss.ss`，其中小数点后的第二组`ss`值表示秒的小数部分。让我们考虑值`'140055.00'`和`'140156.00'`，它们相差一分钟零一秒。原始计算使用了乘法和加法：\n\
  \n```\n>>> vals = ['140055.00', '140156.00']\n>>> [float(x[:2])*3600+float(x[2:4])*60+float(x[4:6])\
  \ for x in vals]\n```\n\n```\n[50455.0, 50516.0]\n```\n\n```\n>>> _[1]-_[0]\n```\n\
  \n```\n61.0\n```\n\n这两个值之间的差（我们真正关心的是，记得我们将时间基准的起点设为零）是 61 秒——完全符合预期。我们也可以使用`time`模块中的`mktime()`函数计算纪元表示法，然后用它来计算时间差：\n\
  \n```\n>>> from time import mktime\n>>> [mktime((2000, 0, 0, int(x[:2]), int(x[2:4]),\
  \ int(x[4:6]), \\\n... 0, 0, 0)) for x in vals]\n```\n\n```\n[943963255.0, 943963316.0]\n\
  ```\n\n```\n>>> _[1]-_[0]\n```\n\n```\n61.0\n```\n\n请注意，我使用了填充值来表示其他未知字段，例如年、日和月。\n\
  \n![Image](img/sq.jpg) **提示** Python 标准库中的`datetime`模块也提供了处理时间差的功能。更多信息请参见：`https://docs.python.org/3.3/library/datetime.html`。\n\
  \n我们得到了相同的结果，那么使用`time`模块中基于纪元的函数有什么好处呢？有几点：\n\n*   前面的例子非常简单，不包含日期信息。假设你的数据记录器也记录了日期。午夜会发生什么？如果你不考虑日期，你会遇到回绕问题，这会使事情变得相当复杂。当然，你可以将日期加入计算，但当月份变化时会发生什么？这会更复杂：每个月的天数不同，所以你需要一个查找表。那闰年呢？你看，事情变得复杂了。相反，使用`mktime()`，它会考虑所有这些因素。\n\
  *   使用纪元可以在文件之间共享时间基准。这意味着你可以从各种数据源提取信息，并将它们视为一个整体。\n*   如果你处理的是带时间戳的二进制数据文件，写入时间基准可能具有挑战性。与其为时间基准设计复杂的表示法，不如使用纪元表示法（关于二进制文件的一般讨论以及基于时间的二进制文件示例，请参见第\
  \ 10 章）。\n\n### 示例：日终报告\n\n日终报告是日志文件的摘要报告，在一天结束时呈现数据。以下是此报告有用的两个场景：\n\n*   **股票的收盘价**：假设你有一个日志文件，记录了股票在很长一段时间（例如一个月）内的价格。日终报告打印交易日结束时的股票价格。\n\
  *   **患者出院**：患者正在医院接受治疗，治疗期间所有信息都被记录下来。你想了解患者的出院状态；也就是说，你想收到一份包含患者状态的日终报告。\n\n为了说明问题，我们将创建一个日志文件`../data/SystemALogs.txt`，其中包含时间戳和日志消息：\n\
  \n```\nSat Oct 25 08:15:01 2008, Message 1\nSat Oct 25 09:30:31 2008, Message 2\n\
  Sun Oct 26 09:19:32 2008, Message 3\nMon Oct 27 08:05:31 2008, Message 4\nWed Oct\
  \ 29 07:17:40 2008, Message 5\nWed Oct 29 08:44:04 2008, Message 6\nWed Oct 29 09:44:05\
  \ 2008, Message 7\nWed Oct 29 12:30:50 2008, Message 8\nThu Oct 30 11:22:03 2008,\
  \ Message 9\n```\n\n在这种情况下，日志文件是排序的，这是意料之中的。但即使不是这样，我们采用的算法也应该能正常工作。\n\n为了打印日终报告，我将使用以下算法。一个字典对象存储每天的报告。字典的键应唯一标识一天。我选择使用元组`(year,\
  \ day of the year)`来实现此目的。对于字典的值，我将使用一个包含纪元值和消息的元组。我使用纪元有两个原因。首先，我可以使用`mktime()`轻松计算它。其次，它是一个易于检查的简单值。纪元值越大，表示事件越新。\n\
  \n我们逐行处理文件，提取信息以创建键和值来访问字典。如果键已存在于字典中，我们检查当前行的信息是否来自更晚的时间；如果是，则相应地更新值。如果键不存在于字典中，我们将计算出的键值对添加到字典中。处理完文件后，我们打印字典对象。如你所见，该算法不依赖日志文件排序来产生正确结果。\n\
  \n我选择使用`csv`模块来展示该模块在完整脚本中的用法（参见清单 5-15）。在这个特定案例中，简单的分割或字符串切片也同样有效。\n\n***清单 5-15***。日终报告实现\n\
  \n```\n#### end-of-day report\nfrom time import mktime, strptime, ctime\nimport\
  \ csv\n\nd = {}\n\nfor row in csv.reader(open('../data/SystemALogs.txt')):\n   \
  \ # t is a struct_time tuple\n    t = strptime(row[0], '%a %b %d %H:%M:%S %Y')\n\
  \n    # calculate seconds since the epoch\n    t_epoch = mktime(t)\n\n    # construct\
  \ a key and value\n    key = (t.tm_year, t.\n```\n\n\n\n`tm_yday` `val = (t_epoch,\
  \ row[1])`  \n`try:`  \n    `# 是否有更新的条目？`  \n    `if d[key][0] < t_epoch:`  \n \
  \       `d[key] = val`  \n`except KeyError:`  \n    `# 当前日期不在字典中`  \n    `d[key]\
  \ = val`  \n\n`for epoch, line in d.values():`  \n    `print(ctime(epoch), line)`\
  \  \n\n我还在清单 5-15 中引入了*time*模块的一个新函数 `ctime()`。函数 `ctime()` 接受自纪元以来的秒数，并输出一个日期字符串表示形式。\n\
  \n以下是在前述日志文件上运行脚本的结果：\n\n```\nSat Oct 25 09:30:31 2008  Message 2\nThu Oct 30 11:22:03\
  \ 2008  Message 9\nMon Oct 27 08:05:31 2008  Message 4\nWed Oct 29 12:30:50 2008\
  \  Message 8\nSun Oct 26 09:19:32 2008  Message 3\n```\n\n结果正确，但并未按日期排序。如果我们将它们存储到列表中，然后调用函数\
  \ `sort()` 对列表进行排序，而不是直接打印文件，这个问题很容易解决。\n\n### 示例：基于纪元合并多个来源的数据\n\n使用纪元的好处之一是它是一个标准的时间基准。本示例的目的是合并来自多个来源（本例中是两个日志文件）的数据，并生成一份连贯的报告。为了本示例的需要，我们将把上一个示例中的文件\
  \ `SystemALogs.txt` 拆分为两个文件：`SystemBLogs.txt` 和 `SystemsCLogs.txt`。我们的脚本应将它们合并回一个排序后的日志文件。\n\
  \n以下是 `SystemBLogs.txt` 的内容：\n\n```\nSun Oct 26 09:19:32 2008, Message 3\nWed Oct\
  \ 29 07:17:40 2008, Message 5\nThu Oct 30 11:22:03 2008, Message 9\n```\n\n以下是 `SystemCLogs.txt`\
  \ 的内容：\n\n```\nSat Oct 25 08:15:01 2008, Message 1\nSat Oct 25 09:30:31 2008, Message\
  \ 2\nMon Oct 27 08:05:31 2008, Message 4\nWed Oct 29 08:44:04 2008, Message 6\n\
  Wed Oct 29 09:44:05 2008, Message 7\nWed Oct 29 12:30:50 2008, Message 8\n```\n\n\
  尝试基于文本对这些列表进行排序会产生错误的结果。因此，思路是将每个时间戳字符串转换为纪元表示形式，并基于该值进行排序。为此，我们将创建一个行列表。每一行由 `[t_epoch,\
  \ line]` 组成，其中 `t_epoch` 是转换后的时间表示形式，`line` 是整行文本。然后我们使用 `sorted()` 函数对列表进行排序，并将数据转储回文件，同时移除纪元信息（参见清单\
  \ 5-16）。\n\n***清单 5-16***. 合并两个基于时间的日志文件的脚本\n\n```\nfrom time import mktime, strptime\n\
  data = []\ndata1 = open('../data/SystemBLogs.txt').readlines()\ndata2 = open('../data/SystemCLogs.txt').readlines()\n\
  fmt = '%b %d %H:%M:%S %Y'\nfor line in data1+data2:\n    # t 是一个 struct_time 元组\n\
  \    t = strptime(line[4:24], fmt)\n    # 计算自纪元以来的秒数\n    t_epoch = mktime(t)\n\
  \    # 追加数据\n    data.append([t_epoch, line])\n\ndata = [line[1] for line in sorted(data)]\n\
  open('../data/SystemsBCLogs.txt', 'wt').writelines(data)\n```\n\n此脚本假设您正在合并两个文件。通常情况下，如果您需要合并日志文件，您可能需要合并两个以上的文件。请参考第\
  \ 10 章了解如何处理多个输入文件。\n\n### 其他时间和日期函数\n\n我们已经介绍了*time*模块中大部分可用的功能。对于大多数日志文件处理需求和其他基于时间的处理需求，该模块是全面且完整的。Python\
  \ 中还有其他与时间和日期相关的模块。*datetime*模块（`https://docs.python.org/3.3/library/datetime.html`）提供了包括使用更面向对象的方法对日期进行操作的功能。*calendar*模块（`https://docs.python.org/3.3/library/calendar.html`）提供了通用的日历相关操作。\n\
  \n更多信息请参考 Python 标准库。\n\n## 正则表达式\n\n正则表达式是用于搜索和替换文本的模式匹配表达式。有时，它们比前面介绍的字符串操作更灵活。要使用正则表达式，您必须导入正则表达式模块（名为*re*），它是标准库的一部分。*re*模块类似于\
  \ Perl 对正则表达式的内置支持。\n\n您的下一步是设计一个要匹配的模式，并决定对该模式使用哪个函数。最常用的函数有：`findall(pat, str)`，用于查找字符串\
  \ `str` 中所有匹配正则表达式模式 `pat` 的子串；`split(pat, str)`，用于在遇到正则表达式模式 `pat` 时分割字符串 `str`；以及\
  \ `sub(pat, repl, str)`，用于将字符串 `str` 中匹配模式 `pat` 的部分替换为提供的替换字符串 `repl`。\n\n该模块中还有其他函数，包括\
  \ `match()`、`search()` 和 `compile()` 等，但这里我不再赘述。前面提到的三个函数应该能够满足我们大部分的数据处理需求。\n\n\
  ### 正则表达式模式\n\n正则表达式模式本质上是一个字符串。该模式可以包含普通字符和特殊字符。普通字符匹配自身。因此，模式 `'a'` 匹配遇到的字符 `'a'`，模式\
  \ `'txt'` 匹配遇到的字符串 `'txt'`：\n\n```\n>>> import re\n>>> re.split(r'a', 'Flatland')\n\
  ```\n\n```\n['Fl', 'tl', 'nd']\n```\n\n```\n>>> re.split(r'txt', '45506-8.txt')\n\
  ```\n\n```\n['45506-8.', '']\n```\n\n到目前为止，`re.split()` 与本章前面介绍的 `split()` 函数类似。然而，正则表达式的强大之处在于特殊字符。这些字符为模式本身提供了额外的功能。让我们来看一些例子。第一个是点字符（`'.'`）。点字符匹配除换行符之外的任何单个字符：\n\
  \n```\n>>> re.findall(r'a.', 'Flatland')\n```\n\n```\n['at', 'an']\n```\n\n字符 `'+'`\
  \ 表示模式出现一次或多次，字符 `'?'` 表示模式出现零次或一次，字符 `'*'` 表示模式重复零次或多次。请注意，这些是模式的修饰符；也就是说，它们改变了模式的行为。相比之下，点符号不是模式的修饰符，而是模式的一部分。以下是一些示例：\n\
  \n```\n>>> re.findall(r'.?a', 'Flatland')\n```\n\n```\n['la', 'la']\n```\n\n```\n\
  >>> re.findall(r'a.*', 'Flatland')\n```\n\n```\n['atland']\n```\n\n第一个示例查找由零个或一个字符后跟字符\
  \ `'a'` 组成的模式。第二个示例匹配字符 `'a'`，并且其后可以跟任意数量的字符。\n\n有人可能会问，为什么第一个模式匹配了字符 `'a'` 之前的一个字符，而显然零个字符也能匹配？同样，为什么第二个模式匹配了字符串\
  \ `'atland'`，而仅匹配 `'a'` 也同样有效？答案是正则表达式默认是贪婪的；也就是说，它们会尝试匹配尽可能多的字符。您可以通过在之前介绍的修饰符后面添加一个\
  \ `'?'` 字符来关闭贪婪行为。例如，您可以使用 `'??'`、`'+?'` 和 `'*?'`。\n\n接下来的特殊字符是 `'^'` 和 `'$'`，它们分别匹配字符串的开头和结尾。以下是一些演示如何使用这些特殊字符的示例：\n\
  \n```\n>>> re.findall(r'^.*a', 'Flatland')\n```\n\n```\n['Flatla']\n```\n\n```\n\
  >>> re.findall(r'^.*?a', 'Flatland')\n```\n\n```\n['Fla']\n```\n\n```\n>>> re.findall(r'a.*$',\
  \ 'Flatland')\n```\n\n```\n['atland']\n```\n\n这些搜索可以用英文表述如下。\n\n\n\n第一行匹配从字符串开头到字符`'a'`之间尽可能多的字符。第二行匹配从字符串开头到字符`'a'`之间尽可能少的字符（注意非贪婪修饰符`'*?'`）。第三行匹配字符`'a'`以及直到行尾的剩余字符。\n\
  \n**示例：使用正则表达式去除多余空格**\n\n在本章前面部分，我解释了如何去除字符串中的多余空格。我们使用`split()`按空格分割单词，然后使用`strip()`去除多余空格，最后使用`join()`将列表重新组合成字符串。\n\
  \n使用正则表达式可以更轻松地实现相同的结果：\n\n```\n>>> grocery_list = \"Milk   2\\nEggs  12\"\n>>>\
  \ re.sub(r' +', ' ', grocery_list)\n```\n\n```\n'Milk 2\\nEggs 12'\n```\n\n我使用了函数`sub()`，其模式为`'\
  \ +'`（一个空格后跟加号），将一个或多个空格替换为一个空格。\n\n**特殊序列**\n\n特殊序列用于匹配一些有趣的组合。以下是一个简短列表：`'\\d'`匹配十进制数字，`'\\\
  s'`匹配空白字符，`'\\w'`匹配字母数字字符。如果使用大写字母，则实现相反的效果；即`'\\D'`匹配任何非十进制数字的字符，`'\\S'`匹配任何非空白字符，`'\\\
  W'`匹配任何非字母数字字符。由于`'\\'`字符是一个修饰符，最好使用原始字符串格式`r'string'`，以避免在多个层级（即字符串层级和正则表达式层级）上转义字符：\n\
  \n```\n>>> grocery_list = \"Milk   2\\nEggs  12\"\n>>> re.findall(r'\\d+', grocery_list)\n\
  ```\n\n```\n['2', '12']\n```\n\n**备选**\n\n特殊字符`'|'`用于在正则表达式`r'pat1|pat2'`中匹配`pat1`或`pat2`：\n\
  \n```\n>>> grocery_list = \"Milk   2\\nEggs  12\"\n>>> re.sub(r'Milk|Eggs', 'Chocolate',\
  \ grocery_list)\n```\n\n```\n'Chocolate   2\\nChocolate  12'\n```\n\n**范围**\n\n\
  您还可以使用方括号匹配一个值范围。模式`'[12]'`将同时匹配字符`'1'`和字符`'2'`：\n\n```\n>>> grocery_list = \"Milk\
  \   2\\nEggs  12\"\n>>> re.sub('[12]', '0', grocery_list)\n```\n\n```\n'Milk   0\\\
  nEggs  00'\n```\n\n您还可以使用`'-'`字符表示一个字符范围。模式`'[1-5]'`匹配从 1 到 5（含）的任何字符。\n\n最后，在左方括号后使用`'^'`来否定该范围：\n\
  \n```\n>>> grocery_list = \"Milk   2\\nEggs  12\"\n>>> re.sub('[⁰-5]', '*', grocery_list)\n\
  ```\n\n```\n'*******2*******12'\n```\n\n**何时使用正则表达式**\n\n很难决定是使用正则表达式还是仅使用普通字符串操作。正则表达式很难掌握，但熟能生巧。尝试使用字符串函数和正则表达式解决同一个问题，以感受哪种方法更好。\n\
  \n如果使用字符串操作使事情变得更复杂，那就使用正则表达式。有时，一个简单的正则表达式能使代码更易读、更优雅。前面展示的去除多余空格的例子就是这种情况。其他时候，情况则相反。尽可能选择代码的简洁性和清晰性。\n\
  \n话虽如此，有一个特殊情况我发现使用正则表达式远优于使用字符串方法，那就是当我想根据多个选项分割或替换字符串时。主要原因是字符串方法`split()`需要一个分隔符，并且它不接受多个选项。使用正则表达式，您可以提供一系列分隔符。\n\
  \n**示例：仅使用一次的单词**\n\n我们用一个结合字典和文本的例子来结束本次关于正则表达式的讨论。其思想是找出文件中仅使用一次的单词。\n\n这个例子背后的动机是，仅使用一次的单词可能是源代码中的拼写错误。\n\
  \n为了实现解决方案，我们将使用一个字典来统计文件中每个单词出现的次数（参见清单 5-17）。\n\n***清单 5-17***. 查找仅使用一次的单词\n\n\
  ```\nfrom string import punctuation, whitespace\nimport re\n\ndef nonce(filename):\n\
  \    \"\"\"返回文件中仅使用一次的单词。\"\"\"\n\n    data = open(filename, 'rt').read()\n    d,\
  \ result = dict(), []\n    for word in re.split('['+punctuation+whitespace+']',\
  \ data):\n        d[word.lower()] = d.get(word.lower(), 0)+1\n    for word, occur\
  \ in d.iteritems():\n        if occur == 1:\n            result.append(word)\n \
  \   return result\n```\n\n函数`nonce()`应该相当易读。脚本的核心在于`for`循环，它使用正则表达式分割文本。这是一个正则表达式优于字符串方法`split()`的典型例子：通过正则表达式范围说明符`'[]'`，分割发生在标点字符或空白字符上。\n\
  \n请记住，此脚本主要适用于源代码，而不适用于纯文本英语。原因在于它没有考虑复数形式（例如，“girls”和“girl”被视为两个不同的单词）以及其他口语特征。\n\
  \n**国际化和本地化**\n\n有时您需要处理来自不同区域设置的数据文件。这可能会带来一些问题：日期和时间表示法可能与您的代码期望的不同，或者文本字符可能是另一种语言。\n\
  \n本节旨在介绍国际化（i18n）和本地化（l10n）的主题。我将涉及两个主题：区域设置及其对日期表示法的影响；以及 Unicode，这是一种支持不同语言的便捷方法，至少在文本文件方面是如此。\n\
  \n![Image](img/sq.jpg) **注意** 缩写 i18n 来源于字符串“internationalization”中“i”和“n”之间的字符数，并由单词的首字母和尾字母包围。类似地，缩写\
  \ l10n 指的是“localization”。\n\n**区域设置**\n\n在软件上下文中，*区域设置*是一组规则，用于控制某些与国家或语言相关的函数的行为。从数据分析的角度来看，如果使用包含日期和时间时间戳的日志文件，并且区域设置与当前使用的区域设置不一致，则函数`strptime()`可能会失败。例如，一些国家使用日/月/年表示法，而另一些国家使用月/日/年表示法。\n\
  \n为了适应不同的区域设置，Python 通过*locale*模块提供支持，该模块是 Python 标准库的一部分。要使用它，请执行命令`import locale`。要设置区域设置，请执行命令`locale.setlocale(category,\
  \ locale)`。您可以使用类别`locale.LC_ALL`启用整套规则，也可以设置特定的规则。在我们的例子中，我们将使用`LC_ALL`，它也会控制函数`strftime()`和`strptime()`的行为。\n\
  \n![Image](img/sq.jpg) **注意** *locale*模块依赖于操作系统的区域设置支持。不同的操作系统可能有不同的区域设置缩写。例如，要在\
  \ Linux 上运行以下脚本，我必须使用区域设置`'fr_FR.ISO-8859-1'`；在 Windows 上，我使用了`'fr'`。在某些 Linux 发行版上，区域设置别名列表可以在文件`/usr/share/locale/locale.alias`中找到。不幸的是，我无法在\
  \ Cygwin 上正确运行*locale*模块；一些研究表明，Cygwin 目前不支持除基本区域设置（名为`C`，意指 C 语言实现）之外的区域设置。\n\n\
  一般来说，您应该在程序入口处设置区域设置：\n\n```\n>>> import locale\n>>> locale.\n```\n\n\n\n#### 设置区域（Locale）\n\
  \n`setlocale(locale.LC_ALL, 'french')`\n\n```\n'French_France.1252'\n```\n\n如果上述方法无效，尝试将`'french'`替换为`'fr_FR.ISO-8859-1'`、`'fr_FR'`（Mac\
  \ OS）或`'fr'`：\n\n```\n>>> from time import gmtime, strftime, strptime\n>>> fmt =\
  \ '%d-%B-%Y'\n>>> strftime(fmt, localtime())\n```\n\n```\n'24-mai-2014'\n```\n\n\
  ```\n>>> strptime(_, fmt)\n```\n\n```\ntime.struct_time(tm_year=2014, tm_mon=5,\
  \ tm_mday=24, tm_hour=0, tm_min=0, tm_sec=0, tm_wday=5, tm_yday=144, tm_isdst=-1)\n\
  ```\n\n第一行导入了`locale`模块。然后我将区域设置为`'French_France.1252'`，这基本上意味着语言为法语，国家为法国。语言和国家可以混合使用；例如，你可以传递字符串`'French_Canada'`将语言设置为法语但国家设置为加拿大。在\
  \ Windows 中，我发现`'Language_Country'`这种表示法效果很好，而缩写形式（例如`'fr_CA'`）则遇到了一些问题。在 Linux\
  \ 中，我发现`'en_US.ISO-8859-1'`这种形式的表示法效果很好；因此对于加拿大法语，在 Linux 上我将区域设置为`'fr_CA.ISO-8859-1'`。\n\
  \n有关`locale`模块的更多信息，请参考 Python 标准库：\n\n```\nhttps://docs.python.org/3.3/library/locale.html.\n\
  ```\n\n关于区域设置的讨论尚未结束；在深入探讨 Unicode 之后，我将再举一个例子。\n\n#### Unicode 字符串\n\n原始的 ASCII\
  \ 表基于英语，并未涵盖许多其他语言和符号。为了解决这个问题，人们引入了多种设计方案，而最近 Unicode（`http://www.unicode.org`）似乎已成为行业标准。\n\
  \nUnicode 标准涉及*字符编码*、*字符属性*、*视觉表示*等主题。从非常简化的角度来看，Unicode 试图通过为每个字符（有成千上万个，甚至更多）分配一个唯一的整数来支持其他语言的字符和符号，同时保持与\
  \ ASCII 表的兼容性。这意味着某些 Unicode 字符由 4 个字节表示，而不是 1 个字节。\n\n当你想要将 Unicode 字符串写入文件时，问题就出现了。每次都写入\
  \ 4 个字节而不是 1 个字节会占用空间。如果你使用的字符是简单的英文字符，它们都在 ASCII 表范围内，因此包含少于 8 位。要写入它们，你不需要 4 个字节——1\
  \ 个字节就足够了。在这种情况下，你可以选择将 Unicode 字符串*编码*为 8 位值，即 UTF-8。UTF 代表 Unicode 转换格式（Unicode\
  \ Transformation Format）。\n\n如果你使用的字符并非全部来自英文字母表，则可能需要更多字节来表示 Unicode 字符串。在大多数情况下，2\
  \ 个字节就足够了，这意味着你可以使用 UTF-16 编码来编码 Unicode 字符串。然而，你也可能使用英文字母表（或其他 ASCII 符号）中的字符，在这种情况下，某些字符可能用\
  \ 8 位编码。因此，一些编码也支持这些可变长度方案。\n\n例如，让我们使用两种编码（UTF-8 和 UTF-16）来编码字符`\"X\"`：\n\n```\n\
  >>> \"X\".encode('utf-8')\n```\n\n```\nb'X'\n```\n\n```\n>>> \"X\".encode('utf-16')\n\
  ```\n\n```\nb'\\xff\\xfeX\\x00'\n```\n\n如你所见，字符“X”在 UTF-8 和 UTF-16 中的编码方式不同。下一节将更全面地解释\
  \ Python 中的 Unicode。\n\n从我们的角度来看，知道 Python 字符串是 Unicode 字符串就足够了。此外，我们可以使用多种编码方案（包括\
  \ UTF-8 和 UTF-16）对 Unicode 字符串进行编码和解码。\n\n#### 使用 Unicode\n\n当你处理非 ASCII 字符（即序数值高于\
  \ 128 的字符）时，Unicode 字符串就派上用场了。\n\n值`0xa9`对应`©`，在大多数键盘上很难输入。因此，我使用了它在 Unicode 中的序数值。\n\
  \nPython 将该值保留为序数值，并不打印与之关联的符号。如果我们将 Unicode 字符串转储到文件，大多数编辑器或 Web 浏览器将能够查看这些特殊字符。在这种情况下，生成的文件是`../data/special.txt`：\n\
  \n```\n>>> u = 'a string\\xa9'\n>>> u\n```\n\n```\n'a string\\xa9'\n```\n\n在 Mac\
  \ 或支持显示 Unicode 字符的 Python 环境（如 IDLE，参见第 2 章）中，之前的结果会显示`©`的正确符号：\n\n```\n'a string©'\n\
  ```\n\n```\n>>> open('../data/special1.txt', 'wb').write(u.encode('utf-8'))\n```\n\
  \n```\n10\n```\n\n`write()`方法只接受字符串，不接受 Unicode 字符串。因此，为了能够使用`write()`函数并将 Unicode\
  \ 字符串写入文件，我们必须使用`encode()`方法，该方法接受要使用的编码。在这种情况下，我选择了广泛流行的 UTF-8 编码。\n\n或者，你可以通过在创建文件时传递`encoding`参数来创建一个具有特定编码的文件。上面一行可以写成如下形式：\n\
  \n```\n>>> open('../data/special2.txt', 'w', encoding='utf-8').write(u)\n```\n\n\
  `decode()`函数与`encode()`互补，并返回解码后的 Unicode 字符串：\n\n```\n>>> u.encode('utf-8')\n```\n\
  \n```\nb'a string\\xc2\\xa9'\n```\n\n```\n>>> u.encode('utf-16')\n```\n\n```\nb'\\\
  xff\\xfea\\x00 \\x00s\\x00t\\x00r\\x00i\\x00n\\x00g\\x00\\xa9\\x00'\n```\n\n```\n\
  >>> u.encode('utf-16').decode('utf-16')\n```\n\n```\n'a string\\xa9'\n```\n\n（在正确显示\
  \ Unicode 字符的环境中，`'\\0xa9'`将被替换为`©`。）\n\n注意字符串如何变成字节（开头的`b`）。这是因为，一旦你对字符串进行编码，你会得到一个字节序列，而不是一个字符串。\n\
  \n##### 示例：希伯来字母表\n\n本示例的目的是生成一个包含希伯来字母表的文件。如果你的系统没有安装希伯来语（我猜大多数人都是这种情况），你可以尝试其他更常见的字符，我稍后会展示。\n\
  \n![Image](img/sq.jpg) **注意**：字母表（Alphabet）是一个希伯来语单词。它由希伯来语的前两个字母组成：Aleph 和 Bet。\n\
  \n希伯来字母表，如图 5-1 所示，从映射到 Unicode 值`0x5D0`的字母 Aleph 开始，到映射到值`0x5EA`的字母 Tav 结束。除非你的系统安装了希伯来语键盘，否则手动输入希伯来字母并非易事。因此，你必须使用\
  \ Unicode 字符串来构建字母表。由于我们不想（或不能）手动输入这些值，我们将构建一个 Unicode 字母列表，然后从该列表生成一个字符串。函数`chr()`将用于根据其序数值构建字符：\n\
  \n```\n>>> letters = [chr(letter) for letter in range(0x5d0, 0x5eb)]\n>>> alephbet\
  \ = ''.join(letters)\n>>> open('../data/alephbet.txt', 'w', encoding='utf-8').write(alephbet)\n\
  ```\n\n```\n27\n```\n\n![9781484200537_Fig05-01.jpg](img/9781484200537_Fig05-01.jpg)\n\
  \n图 5-1. 希伯来字母表\n\n结果是 27，这对应于字母表中的字母数量（22 个字母加上 5 个用于词尾的变体）。一旦我们有了 Unicode 字符串，只需将其写入文件即可。在这种情况下，我选择了使用\
  \ UTF-8 编码。\n\n拉丁字母表有特殊字符，如图 5-2 所示：带重音符号的字母，从值`0xC0`开始，到`0x0FF`结束。因此，你可以修改前面的脚本来生成拉丁特殊字符，如下所示：\n\
  \n```\n>>> letters = [chr(letter) for letter in range(0xc0, 0x100)]\n>>> latin =\
  \ ''.join(letters)\n>>> open('../data/latin.txt', 'w', encoding='utf-8').write(latin)\n\
  ```\n\n```\n64\n```\n\n![9781484200537_Fig05-02.jpg](img/9781484200537_Fig05-02.jpg)\n\
  \n图 5-2.\n\n\n\n##### 一些有趣的拉丁字符\n\n结果是写入的字符数，即 64。\n\n##### 示例：以当前区域设置写入今天的日期\n\n\
  此示例的目的是将特定区域设置下的当前日期和时间打印到文件中。如果你使用的是 `English_United States` 区域设置，这将相当乏味。因此，我决定再次使用希伯来语区域设置，因为我们现在对它已经很熟悉了（参见代码清单\
  \ 5-18）。由于 Python 并不总是在解释器中打印其他字符集，因此最好将结果写入文件，并在文本查看器、编辑器或 Web 浏览器中查看。\n\n***代码清单\
  \ 5-18***。当前区域设置下的今天日期\n\n```\nimport locale\nfrom time import strftime, strptime,\
  \ localtime\nfrom sys import platform\n\nif platform == 'linux' or platform == 'darwin':\n\
  \    locale.setlocale(locale.LC_ALL, 'he_IL')\nelif platform == 'win32':\n    locale.setlocale(locale.LC_ALL,\
  \ 'Hebrew_Israel')\nelif platform == 'cygwin':\n    raise Exception('Cygwin not\
  \ supported')\nelse:\n    print(\"Untested platform: \", platform)\n\ntoday = strftime('%B\
  \ %d, %Y', localtime())\nopen('../data/today.txt', 'w', encoding='utf-8').write(today)\n\
  ```\n\n首先，我尝试使用 `sys.platform` 值根据当前平台猜测希伯来语的编码。正如我之前提到的，Linux、Windows 和 Cygwin\
  \ 都有不同的区域设置缩写。\n\n设置区域设置后，我可以使用函数 `locale.getpreferredencoding()` 查询首选区域设置编码，这在确定如何编码\
  \ Unicode 字符串时非常有用。不幸的是，我发现希伯来语的首选编码应该是 `cp1255`，而不是 `getpreferredencoding()` 函数返回的编码。最后，我对字符串进行编码，并使用\
  \ UTF-8 将其写入文件。\n\n图 5-3 显示了结果。\n\n![9781484200537_Fig05-03.jpg](img/9781484200537_Fig05-03.jpg)\n\
  \n图 5-3。希伯来语的日期\n\n#### 更多关于 Unicode 的内容\n\nUnicode 的主题非常广泛，有许多书籍对此进行了讨论。至于在线信息，我发现\
  \ Python 库参考是一个宝贵的资源。如果你正在寻找关于 i18n 和 l10n 的一般信息，包括代码页和区域设置信息，以下内容可能会有所帮助：\n\n*\
  \   *Unicode 联盟*：`http://www.unicode.org`\n*   *维基百科*：`http://en.wikipedia.org/wiki/Locale`。请务必点击链接查看字符编码和\
  \ Unicode 等相关主题。\n*   Unicode 国际化组件：`http://www.icu-project.org/`\n\n## 最后说明与参考\n\
  \n字符串和文本处理是一个非常广阔的领域，尤其是在互联网和搜索引擎普及的今天；在线提供的大部分数据都是某种形式的文本。本章涵盖了在数据分析背景下与文本处理相关的相当多的主题。\n\
  \n然而，还有很多东西需要学习。这里简要讨论了两个主题：正则表达式以及 i18n 和 l10n。互联网上有大量关于这两个主题的文档，因此请务必参考在线资源。至此，你应该已经掌握了足够的基础知识，可以毫无困难地深入研究这个主题。\n\
  \n对于本章讨论的主题，以下书籍非常有价值：\n\n*   *Python 文本处理*，作者 David Mertz (Addison-Wesley, 2003)\n\
  \n"
