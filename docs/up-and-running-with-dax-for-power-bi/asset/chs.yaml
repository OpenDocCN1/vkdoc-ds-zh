- '# 在第 7 章中，我们探讨了用于生成内存中虚拟表的表表达式概念。随着你进入 DAX 更高级的领域，你会开始意识到大多数 DAX 表达式都涉及生成这些虚拟表。这些虚拟表通常是真实表的子集，用于通过编程方式筛选数据，为通过
  DAX 度量值进行聚合做准备。此时，你可能会觉得 DAX 确实变得更具挑战性。这是因为你看不到虚拟表，只能想象它们的存在，而表达式内部的工作机制对我们来说大多是隐藏的。


  一旦你完成了第 8 章中我们对`ALL`函数的详细学习（该函数与`CALCULATE`一起构成了大多数 DAX 表达式），你就准备好使用 DAX 来解决各种数据分析场景了。例如，在第
  9 章中，你将学习如何跨时间段比较数据；在第 12 章中，你将学习如何使用参数表创建用户驱动的计算。在第 14 章中，你将发现如何跨数据类别进行动态比较，例如找出购买了产品“X”的客户是否也购买了产品“Y”。


  第 15 章将带你进入所有 DAX 概念中最具挑战性的一个——上下文转换。你将学习如何在更高的粒度级别上执行聚合。一旦掌握了这个概念的用法，你能发现的数据洞察列表将大大增加。你将能够按销售额对客户或产品进行排名，将合计值分入数值范围，动态查找按价值计算的前后百分比，并计算多年、多季度和多月的平均总销售额。事实上，你编写的大多数
  DAX 计算都会以某种方式用到上下文转换。


  这看起来可能有点奇怪，直到你即将完成 DAX 的学习之旅时，我们才最终告诉你 DAX 真正的工作原理以及所有部分是如何组合在一起的。原因在于，只有当你读到第 18
  章时，你才具备了理解最后一个 DAX 概念——表扩展——所需的技能。尽管这个概念在很大程度上是理论性的，但一旦你了解了当表达式被评估时数据模型在幕后如何运作，你在本书中积累的知识就会豁然开朗。最终，在第
  18 章中，DAX 拼图的所有碎片都拼合在了一起，此时你已成为一名成熟的 DAX 专家。


  最后，就我个人而言，我写了这本我希望在我最初学习 DAX 时就能读到的书，那还是在 Power Pivot 刚推出的年代。当时能帮助我的资料非常少，我从未忘记自己花费无数个小时来解读
  DAX 代码，最终达到“是的，我能行！”的境界。我希望，在这本书的帮助下，你的学习之路能更轻松一些，并且随着 DAX 像 Excel 公式一样成为主流，这本书能成为一个有用的资源。


  我们也不要忘记学习 DAX 的目标，它本身并非终点。学习 DAX 不是为了通过炫耀编写大量 DAX 代码的技能来给你的同事留下深刻印象。不，学习 DAX 的目标是作为一种达到目的的手段。它让你能够以那些直到现在还让你苦苦寻找洞察的方式来分析你的数据。


  > *“目标是将数据转化为信息，再将信息转化为洞察。”*^(²)


  如果你想跟随我们在书中使用的示例进行操作，以下是所需的文件：


  - 第 1 章至第 9 章 - `1 DAX Sample Data.pbix`

  - 第 10 章 - `2 DAX Blanks & Zeros.pbix`

  - 第 11 章至第 13 章 - `1 DAX Sample Data.pbix`

  - 第 14 章 - `3 DAX USERELATIONSHIP.pbix`

  - 第 15 章和第 16 章 - `1 DAX Sample Data.pbix`

  - 第 17 章 - `4 DAX LOOKUPVALUE.pbix`

  - `5 DAX TREATAS.pbix`

  - 第 18 章和第 19 章 - `6 Expanded Tables.pbix`


