- '# 5. 迭代器


  DAX 中有一组函数被称为*迭代器*，从名称可以推断，这些函数会在 DAX 表达式的求值过程中遍历表。任何以“X”结尾的 DAX 函数都是迭代器，例如“X”聚合函数：`SUMX`、`AVERAGEX`、`MAXX`、`MINX`、`COUNTAX`。还有一些非聚合的“X”迭代函数，如
  `CONCATENATEX` 和 `RANKX`。更让人困惑的是，有些迭代函数并不以“X”结尾，例如 `FILTER` 和 `ADDCOLUMNS`。


  我们将在后文探讨 `FILTER`、`CONCATENATEX` 和 `RANKX` 函数。`ADDCOLUMNS` 函数超出了本书的讨论范围，但希望随着你对
  DAX 知识的增长，能够自行探索。本章的重点将是聚合迭代器：`SUMX`、`AVERAGEX`、`MAXX`、`MINX` 和 `COUNTAX`。


  聚合迭代器有两个参数：要迭代的表，以及针对表的每一行进行求值的表达式，求值结果将被聚合。这些函数通过迭代函数引用的表，在度量值内部创建一个行上下文，度量值会在内存中“访问”表中的每一行。请记住，度量值会先生成一个筛选上下文，因此被迭代的表可能带有筛选或交叉筛选。


  图 5-1


  `SUMX` 函数遍历经过交叉筛选的事实表，执行行级计算，然后由度量值对结果求和


  例如，考虑在图 5-1 中正在求值的度量值“10% 增长总额”。这里，我们在度量值中使用了聚合迭代器 `SUMX`，在内存中将事实表中每一行的 `CASES SOLD`
  值乘以 1.1。然后，这些行级计算的结果被聚合，返回一个由度量值计算出的标量值，例如“波尔多”葡萄酒的结果为 **59,477.00**。类似地，我们也可以使用
  `AVERAGEX`、`MAXX` 或任何其他聚合迭代器。


  包含迭代函数的度量值在迭代过程中使用行上下文，然后使用筛选上下文生成标量值。


  现在让我们继续深入探索这些聚合迭代器，首先从 `SUMX` 开始。


  ## `SUMX` 函数（以及其他“X”函数）


  既然你已经了解了 DAX 聚合迭代器的用途，接下来让我们认识一个 DAX 中的主要迭代函数——`SUMX` 函数。然后我们再探讨其他“X”聚合函数。


  `SUMX` 返回针对表中每一行求值的表达式之和，其语法如下：


  `= SUMX ( table, expression )`


  其中：


  `table` 是你要执行计算的表。


  `expression` 是你要针对表中每一行执行的计算。


  以下是 `SUMX` 语法的一个示例：


  `= SUMX ( Winesales, Winesales[CASES SOLD] * 0.1 )`


  为了演示 `SUMX` 的用法，我们先从一个不太现实但易于理解的场景开始。我们被要求找出所有大于 100 的 `CASES SOLD` 值，并将其增加 20%；否则，只增加
  10%。这或许是预测明年销售箱数的一种奇特方法，因此我们将此计算命名为“明年箱数”。然后，我们想查看每种葡萄酒对应的“明年箱数”值。


  如果我们不知道如何使用 `SUMX`，可能会以一种笨拙的方式完成这个计算，即同时使用计算列和隐式度量值。我们可以像下面这样使用 `IF` 函数创建计算列，然后通过将该计算列拖拽到表格视觉对象的“值”字段中来使用隐式度量值；见图
  5-2。


  图 5-2


  创建计算列并用作隐式度量值效率不高


  但让我们仔细想想。我们不需要先创建一个计算列来查看每一行的增加值，然后再在*另一步*中使用隐式度量值对每种葡萄酒的这个值求和。我们可以使用 `SUMX` 一步到位。如果这样做，则计算列就多余了；我们只需使用度量值即可。这才是真正的好处，因为度量值总是比计算列更高效。


  以下是使用 `SUMX` 的显式度量值，我们可以用它来代替“计算列 + 隐式度量值”的组合：


  ```

  明年箱数 度量值 =

  SUMX (

  Winesales,

  IF ( Winesales[CASES SOLD] > 100,

  Winesales[CASES SOLD] * 1.2,

  Winesales[CASES SOLD] * 1.1

  )

  )

  ```


  这个 `SUMX` 度量值是如何工作的？


  我们知道 `SUMX` 会对针对*表中每一行*求值的表达式进行求和。`SUMX` 的第一个参数引用了执行计算的表，在我们的例子中是 `Winesales`。第二个参数是你希望在内存中对表中*每一行*执行的计算。这是我们使用
  `IF` 编写的表达式，`SUMX` 通过遍历每一行在内存中计算该表达式。然后，它将此计算的结果求和，在本例中是对每种葡萄酒求和（因为这是度量值求值时的当前筛选上下文）。


  既然我们已经了解了 `SUMX` 函数，就可以重新审视一下在第 3 章中学过的一个计算，即当前位于*计算列*中的“销售额”计算；见图 3-6。你还记得我们使用
  `RELATED` 函数创建了这个*列*吗？


  ```

  销售额 =

  Winesales[CASES SOLD] * RELATED ( Wines[PRICE PER CASE] )

  ```


  然后我们在隐式度量值中使用了这个列来计算总销售额，但这并不是完成此任务最高效的方法。现在，我们可以使用 `SUMX` 编写一个*度量值*，将其作为我们最终的“总销售额”计算，如下所示：


  ```

  总销售额 =

  SUMX (

  Winesales,

  Winesales[CASES SOLD] * RELATED ( Wines[PRICE PER CASE] )

  )

  ```




  这是一个更简洁的`Total Sales`计算方法。`SUMX`函数会遍历`Winesales`表，对于当前筛选上下文中的每一行，它会将`CASES SOLD`列中的值与`Wines`表中的`PRICE
  PER CASE`列的值相乘（使用`RELATED`找到当前行上下文中葡萄酒的价格）。然后，它会将这些逐行计算的结果求和。


  **提示**


  选中一个度量值，然后使用“度量工具”选项卡和“格式”组，将度量值格式化为所需的货币格式。


  类似地，如果您想找到最大销售额或平均销售额，DAX 度量值将分别如下所示：


  ```

  Max Sales =

  MAXX (

  Winesales,

  Winesales[CASES SOLD] * RELATED ( Wines[PRICE PER CASE] )

  )

  Avg Sales =

  AVERAGEX (

  Winesales,

  Winesales[CASES SOLD] * RELATED ( Wines[PRICE PER CASE] )

  )

  ```


  您可以在图 5-3 中看到这些度量值的结果。


  ![图 5-3](img/523050_1_En_5_Fig3_HTML.jpg)


  **图 5-3** 使用`SUMX`、`AVERAGEX`和`MAXX`的度量值


  让我们通过计算客户为葡萄酒支付的平均价格来探索另一个使用`AVERAGEX`的示例。首先需要找到`Winesales`表中每笔交易的价格（在当前筛选上下文中），然后计算这些价格的平均值，因此度量值如下所示：


  ```

  Average Price =

  AVERAGEX (

  Winesales,

  RELATED ( Wines[PRICE PER CASE] )

  )

  ```


  “Average Price”度量值使用`RELATED`函数在内存中计算每笔交易的价格，然后`AVERAGEX`对这些价格取平均值。您可以在图 5-4 中看到此度量值的结果。


  ![图 5-4](img/523050_1_En_5_Fig4_HTML.jpg)


  **图 5-4** 计算客户为葡萄酒支付的平均价格


  这看起来是一个简单的度量值，但即使是一些有经验的 DAX 用户也难以正确掌握，因此我们来解释一下它的计算过程。在图 5-4 中，我们可以看到筛选上下文位于`Customers`维度的`CUSTOMER
  NAME`列上，“Black River & Co”是第一个实例。`Winesales`事实表进行交叉筛选，只包含该客户的销售记录。嵌套在`AVERAGEX`中的`RELATED`函数在内存中计算“Black
  River & Co”的`Winesales`表中每一行对应的`Wines`维度的`PRICE PER CASE`值。然后，`AVERAGEX`函数计算这些价格的平均值（它将价格求和并除以该客户的`Winesales`表中的行数）。


  ## 合计行的困扰


  这引出了 DAX 新手常遇到的另一个问题：理解表或矩阵视觉对象中“合计”行的计算。人们经常抱怨计算结果不正确。这很可能是因为他们在应该使用`SUMX`时却使用了`SUM`。


  比较图 5-5 中的度量值，其中“Total Sales”度量值与“Total Sales Wrong”度量值进行对比。您可以看到，对于每种葡萄酒，“Total
  Sales”和“Total Sales Wrong”度量值都返回了正确的结果。但是，当度量值计算总计行时，“Total Sales Wrong”度量值显示了错误的结果。


  ![图 5-5](img/523050_1_En_5_Fig5_HTML.jpg)


  **图 5-5** “Total Sales Wrong”度量值的“合计”行计算不正确


  那么，当“Total Sales Wrong”计算总计行时，问题出在哪里呢？正如通常情况一样，问题在于筛选上下文。回想一下我们之前学过的知识：总计行的计算*不是*您在图中所见各个值的总和。在总计行中，度量值是在一个不同的筛选上下文中计算的，该上下文移除了对`WINE`列的筛选。那么，让我们看看事情是如何轻易出错的。以下是“Total
  Sales Wrong”度量值：


  ```

  Total Sales Wrong =

  SUM ( Winesales[CASES SOLD] ) * SUM ( Wines[PRICE PER CASE] )

  ```


  我们再将这两个组成表达式提取出来，分别作为单独的度量值：


  ```

  Total Cases =

  SUM ( Winesales[CASES SOLD] )

  Sum Price =

  SUM ( Wines[PRICE PER CASE] )

  ```


  我们的“Total Sales Wrong”度量值是将这两个表达式的结果相乘；请参考图 5-5。


  您可以看到，问题在于使用了`SUM`，特别是试图对`PRICE PER CASE`值求和。这些值的总和是多少？它是在当前筛选上下文中的价格总和。因此，对于每种葡萄酒的计算，它只是该葡萄酒的价格，例如，波尔多的价格为`$75`；参见图
  5-6。


  ![图 5-6](img/523050_1_En_5_Fig6_HTML.jpg)


  **图 5-6** 计算每种葡萄酒时的价格总和就是该葡萄酒的价格


  将此值乘以每种葡萄酒已售出的箱数总和，能在计算每种葡萄酒时给出正确的总销售额。但是，对于总计行的计算，筛选器已从`WINE`列释放，因此`SUM ( Wines[PRICE
  PER CASE] )`表达式对所有葡萄酒的价格求和并返回`$917`，请参见图 5-7。正是这个值与已售出箱数的总和相乘。


  ![图 5-7](img/523050_1_En_5_Fig7_HTML.jpg)


  **图 5-7** 计算每个合计行时的价格总和


  因此，在“Total Sales Wrong”度量值中，总计行的计算是所有葡萄酒的价格总和乘以所有葡萄酒的箱数总和：`917` x `423,224` = `388,096,408`。


  使用`SUM`的错误表达式是*先求和再相乘*。而使用`SUMX`的正确表达式是*先相乘再求和*。


  `SUM`函数只应在最简单的度量值中使用，用于对单个列的值求和，并且绝不应在需要对乘法或其他计算的结果求和时使用。实际上，即使在 DAX 表达式中使用`SUM`函数，DAX
  引擎内部也会将其转换为`SUMX`。


  例如，此表达式


  ```

  =SUM ( Winesales[CASES SOLD] )

  ```


  在内部会被转换为：


  ```

  =SUMX ( Winesales, Winesales[CASES SOLD] )

  ```


  通过学习迭代器以及如何使用`SUMX`和其他“X”迭代函数，我们在 DAX 的更困难领域取得了良好的进展。我们也阐明了 DAX 中其他具有挑战性的领域，例如筛选上下文和度量值的本质。您还学到了一些其他重要的概念，理解了数据模型中事实表和维度表的作用，但这仅仅是个开始。


  DAX 的真正威力还在等待我们去发现，那就是名为`CALCULATE`的函数。


  '
- "# 6. `CALCULATE` 函数\n\n`CALCULATE`是 DAX 中最重要的函数。您可能会认为这是一个相当绝对的论断，但只要您掌握了`CALCULATE`，就会很快意识到，您编写的绝大多数\
  \ DAX 表达式都离不开这个函数，尽管您可能认为到目前为止我们已经做得相当不错了。在本章中，您将学习如何使用`CALCULATE`构建表达式，您会发现这相对简单。更具挑战性的是理解何时以及为何必须使用`CALCULATE`，以及它在度量值中的作用，这将是本章真正的重点。\n\
  \n\n\n## 为何你需要 `CALCULATE`\n\n我们来看一个场景，它将解释 `CALCULATE` 如何帮助我们。在我们的数据模型中，`DateTable`\
  \ 维度通过 `DateTable[DATEKEY]` 列与 `Winesales` 事实表的 `Winesales[SALE DATE]` 列相关联，如图 6-1\
  \ 所示。\n\n![](img/523050_1_En_6_Fig1_HTML.jpg)\n\n**图 6-1** `DateTable` 维度与事实表相关联\n\
  \n如果我们筛选 `DateTable` 中的 `YEAR` 列，该筛选器将传播到 `Winesales` 表，以筛选该年度的销售数据。我们需要对数据进行一项特定的分析：对于每一种葡萄酒，我们要计算\
  \ 2021 年销售的总箱数占所有年份总销售箱数的百分比，如图 6-2 所示。\n\n![](img/523050_1_En_6_Fig2_HTML.jpg)\n\
  \n**图 6-2** 一个表格视觉对象，展示了 2021 年销售箱数占所有年份总箱数的百分比\n\n换句话说，*在同一个视觉对象中*，我们需要同时拥有所有年份的“总箱数”度量值和仅筛选了\
  \ 2021 年的“总箱数”度量值。然后，我们可以将 2021 年箱数除以所有年份的总箱数，并以百分比形式表示。\n\n如果你查看图 6-3 中的示例，你会看到我们复制并粘贴了“总箱数”度量值，并将其命名为“2021\
  \ 年箱数”。\n\n![](img/523050_1_En_6_Fig3_HTML.jpg)\n\n**图 6-3** 我们可以复制一个度量值，并尝试对复制的度量值应用筛选器\n\
  \n我们希望看看能否筛选“2021 年箱数”度量值，使其仅显示 2021 年的数值，*同时*让“总箱数”度量值显示所有年份的数值。然而，我们遇到了一个问题。如果我们使用切片器来筛选\
  \ `DateTable` 中的 `YEAR` 列，它会筛选*两个*度量值；见图 6-4。\n\n![](img/523050_1_En_6_Fig4_HTML.jpg)\n\
  \n**图 6-4** 筛选器应用于视觉对象中的所有度量值\n\n看来，我们必须找到一种方法，*在同一个视觉对象中*为不同的度量值应用不同的筛选上下文。然而，到目前为止，视觉对象使用的任何筛选器（无论是来自视觉对象本身、切片器还是筛选器窗格）都会将*相同的*筛选器应用于视觉对象中的所有度量值。我们还无法选择哪些筛选器影响哪些度量值。目前，要么全部应用，要么全不应用。这正是\
  \ `CALCULATE` 函数可以帮助我们的地方。\n\n**注意：** 此时，可以删除画布上筛选 `YEAR` 列的切片器，因为它无法按要求影响数据，现已多余。\n\
  \n`CALCULATE` 在*修改后的*筛选上下文中计算一个表达式，语法如下：\n\n`= CALCULATE ( expression , filter1\
  \ , filter2 …… )`\n\n其中：\n\n- **expression** 是你要计算的内容。可以是一个 DAX **表达式**，也可以是一个定义了表达式的**度量值**。\n\
  - **filter1, filter2, ……** 是你希望如何筛选**表达式**或**度量值**。你可以使用多个筛选器，它们通过“AND”逻辑语句组合。\n\
  \n以下是两个 `CALCULATE` 语法的示例：\n\n`= CALCULATE ( SUM ( Winesales[CASES SOLD] ), Wines[WINE]\
  \ = \"Bordeaux\" )`\n\n`= CALCULATE ( [Total Cases], Wines[WINE] = \"Bordeaux\"\
  \ )`\n\n第一个示例在表达式参数中使用了***表达式***，第二个示例在表达式参数中使用了***度量值***（以灰色高亮显示）。\n\n这是我们第一次将度量值嵌套在“父”度量值中。请注意，当你在\
  \ DAX 编辑器中输入表达式时，如果你输入方括号 ``，IntelliSense 将仅列出度量值；见图 [6-5。\n\n![](img/523050_1_En_6_Fig5_HTML.jpg)\n\
  \n**图 6-5** 在 DAX 编辑器中输入方括号 ``，会列出所有度量值\n\n`CALCULATE` 接收一个***表达式***或***度量值***，并在与来自视觉对象、切片器或筛选器窗格的活动筛选器不同的筛选上下文中计算它。`CALCULATE`\
  \ 生成的新筛选上下文的最终结果取决于活动筛选器的当前状态。这就是 `CALCULATE` 描述中“修改”筛选上下文的意思。然而，与其尝试解释 `CALCULATE`\
  \ 的作用，不如通过一些示例来理解更容易。\n\n## 使用单个筛选器\n\n回到我们的场景。在图 [6-4 的表格视觉对象中，我们如何生成一个度量值来计算 2021\
  \ 年的总箱数，同时保留计算所有年份总箱数的度量值？以下就是使用 `CALCULATE` 实现此目的的度量值：\n\n```\n2021 年箱数 =\nCALCULATE\
  \ ( [总箱数], DateTable[Year] = 2021 )\n```\n\n现在，我们可以创建最终度量值，计算每种葡萄酒 2021 年总箱数占所有年份总箱数的百分比，并将其格式设置为百分比：\n\
  \n```\n2021 年百分比 =\n[2021 年箱数] / [总箱数]\n```\n\n或者更好：\n\n```\n2021 年百分比 =\nDIVIDE\
  \ ( [2021 年箱数], [总箱数] )\n```\n\n**注意：** 默认情况下，如果出现除以零错误，`DIVIDE` 函数将返回空值，因此使用 `DIVIDE`\
  \ 是执行除法运算的首选方法。\n\n当我们将这些度量值中的任意一个放入表格视觉对象时，我们可以看到“Bordeaux”葡萄酒在 2021 年的总箱数占其所有年份（2017\
  \ 年至 2021 年）总箱数的 **27.63%**。\n\n让我们更仔细地看一下图 6-2 中“2021 年箱数”度量值的计算过程。我们可以看到，来自表格视觉对象，我们对\
  \ `Wines` 维度中的 `WINE` 列有一个筛选器。然而，使用“2021 年箱数”度量值时，`CALCULATE` 在内存中*还*会筛选 `DateTable`\
  \ 维度，使得 `YEAR` 等于 2021。然后，此筛选器会与来自 `Wines` 维度的筛选器一起应用于 `Winesales` 事实表；见图 6-6。\n\
  \n![](img/523050_1_En_6_Fig6_HTML.jpg)\n\n**图 6-6** “2021 年箱数”度量值的筛选器传播方式：\n\n1.\
  \ 当前筛选上下文筛选 `Wines` 维度中的每个 `WINE`。此筛选器传播到 `Winesales` 表，并对每种葡萄酒进行交叉筛选。\n2. 由 `CALCULATE`\
  \ 以编程方式提供的筛选器将 `DateTable` 筛选为年份“2021”。此筛选器也传播到 `Winesales` 表，从而对 `Winesales` 应用第二个交叉筛选。\n\
  \n这里需要注意的是，对 `DateTable` 维度的 2021 年筛选器只影响*此*度量值的计算，而不会影响视觉对象中的其他度量值。你可以将 `CALCULATE`\
  \ 视为一种以*编程方式*在内存中生成筛选上下文的方法，该筛选上下文与来自视觉对象、切片器和筛选器窗格的活动筛选器进行交互。\n\n现在，让我们探索更多使用 `CALCULATE`\
  \ 的示例。例如，计算 `CASES SOLD` 值大于 350 的总销售额。\n\n```\n销售箱数大于 350 的总销售额 =\nCALCULATE (\n\
  [总销售额],\nWinesales[CASES SOLD]  > 350\n)\n```\n\n## 使用多个筛选器\n\n`CALCULATE` 接受多个筛选器参数，这些参数通过\
  \ AND 逻辑语句组合。如果你需要 OR 语句，可以在 `CALCULATE` 内部的单个筛选器参数中使用 `OR` 运算符或 `OR` 函数，我们将在后续探索这两种情况。你也可以在\
  \ `CALCULATE` 的筛选器参数中使用需要聚合表达式的更复杂的筛选器，我们也将逐步理解这些表达式。\n\n\n\n### AND 与 OR 筛选器\n\n\
  以下三个度量值示例使用了 `CALCULATE` 来修改筛选上下文。请注意，`CALCULATE` 的所有筛选参数都是通过“AND”逻辑组合的。\n\n```\n\
  2021 年 5 月总病例数 =\nCALCULATE (\n[总病例数],\nDateTable[年份] = 2021,\nDateTable[月份] = \"\
  五月\"\n)\n阿根廷地区阿贝尔的总病例数 =\nCALCULATE (\n[总病例数],\nSalesPeople[销售人员] = \"abel\",\n\
  Regions[地区] = \"argentina\"\n)\n2021 年 Black Ltd 的平均病例数 =\nCALCULATE (\nAVERAGE\
  \ ( Winesales[已售病例数] ),\nDateTable[年份] = 2021,\nCustomers[客户名称] = \"black ltd\"\n\
  )\n```\n\n你可以通过图 6-7 中 `Wines` 维度的 `WINE` 列查看这些表达式的结果。\n\n![](img/523050_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7\n\n使用 `CALCULATE` 生成多重筛选器的度量值\n\n在前面的示例中，`CALCULATE` 中的筛选参数通过“AND”语句组合，例如，2021\
  \ 年 **且** 5 月的已售病例数。但是，如果你需要一个使用“OR”逻辑的筛选器，例如，2021 年 **或** 2020 年，又该如何处理呢？使用 `CALCULATE`\
  \ 对同一列进行“OR”筛选是直接的。而在*不同*列上使用“OR”筛选则更具挑战性，这也是我们计算会变得稍显棘手的地方。我们先来看较为简单的计算。\n\n要对同一列使用“OR”逻辑，你可以在同一个筛选参数中使用双竖线（`||`）运算符，如下例所示：\n\
  \n```\n2020 或 2021 年总病例数 =\nCALCULATE ( [总病例数],\nDateTable[年份] = 2021\n|| DateTable[年份]\
  \ = 2020\n)\n阿根廷或澳大利亚平均病例数 =\nCALCULATE (\nAVERAGE ( Winesales[已售病例数] ),\nRegions[地区]\
  \ = \"argentina\"\n|| Regions[地区] = \"australia\"\n)\n```\n\n你也可以使用 `OR` 函数，但与 Excel\
  \ 不同，在 DAX 的 `OR` 函数中你只能放入两个参数，如下例所示：\n\n```\n阿根廷或澳大利亚平均病例数 =\nCALCULATE (\nAVERAGE\
  \ ( Winesales[已售病例数] ),\nOR ( Regions[地区] = \"argentina\",\nRegions[地区] = \"australia\"\
  )\n)\n```\n\n### 复杂筛选器\n\n我们再来看一个“OR”筛选器的例子。例如，我们可能希望分别使用 `Wines` 表中的 `TYPE` 和 `WINECOUNTRY`\
  \ 列，查找红葡萄酒 **或** 法国葡萄酒的总销售额，并据此分析我们销售人员在这些葡萄酒上的业绩。表达式如下：\n\n```\n红葡萄酒或法国葡萄酒销售额 #1\
  \ =\nCALCULATE (\n[总销售额],\nWines[类型] = \"红葡萄酒\"\n|| Wines[葡萄酒产地] = \"法国\"\n)\n```\n\
  \n这个度量值看起来运行良好，如图 6-8 所示。\n\n![](img/523050_1_En_6_Fig8_HTML.jpg)\n\n图 6-8\n\n针对每位销售人员计算的“红葡萄酒或法国葡萄酒销售额\
  \ #1”度量值\n\n然而，经验丰富的 DAX 用户会对这个表达式有效感到惊讶，并预期会看到一个如图 6-9 所示的错误消息，内容为：\n\n> “表达式包含多个列，但用作表筛选表达式的\
  \ True/False 表达式中只能使用单个列。”\n\n![](img/523050_1_En_6_Fig9_HTML.jpg)\n\n图 6-9\n\n\
  此错误消息已在 Power BI 2021 年 3 月更新中被移除\n\n这条消息告诉我们，不允许在单个筛选器中引用同一张表中的两个列。事实上，在不同列上使用“OR”的表达式，只是在\
  \ Power BI 2021 年 3 月更新之后才变得合法。\n\n然而，尽管它现在看似有效，但仍存在一个固有问题。这个表达式无法正确响应特定的筛选器选择。为了说明这一点，我们编写了另一个度量值“红葡萄酒或法国葡萄酒销售额\
  \ #2”，现在我们可以通过一个表格视觉对象来比较这两个版本的表达式，在该视觉对象中，我们通过切片器筛选了“红”葡萄酒；见图 6-10。\n\n![](img/523050_1_En_6_Fig10_HTML.jpg)\n\
  \n图 6-10\n\n对来自同一表的不同列使用“OR”无法正确响应特定筛选器\n\n你会发现度量值“红葡萄酒或法国葡萄酒销售额 #1”无法响应来自使用 `Wines`\
  \ 维度中 `TYPE` 列的切片器的筛选。它继续计算红葡萄酒或法国葡萄酒的总销售额，而忽略了切片器。然而，第二个度量值“红葡萄酒或法国葡萄酒销售额 #2”确实只显示了红葡萄酒的销售额。我们将在讨论\
  \ `FILTER` 函数的章节中详细探讨这个度量值，但眼下，我们必须提出这个问题：为什么一个筛选来自同一表两个不同列的表达式直到最近才有效，而现在即便允许这样做，为什么它在\
  \ `TYPE` 列上应用筛选器时却无法正确计算呢？\n\n让我们更深入地审视这个问题。当只在一个列上有筛选器时，表的内存中行会被筛选，只保留该列筛选条件为真的行。但是，当你在*多个*列上应用筛选器时，你只能进一步减少行数。例如，一旦你筛选出了红葡萄酒，你只能进一步筛选出这些红葡萄酒中哪些是法国产的。\n\
  \n我们该如何解决这个难题？一种方法是确保 `Wines[类型]` 列和 `Wines[葡萄酒产地]` 列上都没有筛选器，这样在每次计算中，*两个*列的值都会被考虑。这正是\
  \ DAX 在表达式“红葡萄酒或法国葡萄酒销售额 #1”中所采取的路径。\n\n注意\n\n详细阐述“红葡萄酒或法国葡萄酒销售额 #1”表达式的细节，或解释为何它在某些筛选器存在时会返回错误，超出了本章的范围。不过，我们会在第\
  \ 18 章揭示这个问题。在这个阶段，我们只需要注意该表达式并不总是返回正确的结果。\n\n是否有其他方法？也许我们可以尝试这样做：不直接将筛选器应用于列，而是*筛选出*我们想要计算的那些行。例如，我们可以遍历\
  \ `Wines` 维度中的行，如果找到红葡萄酒，就筛选出该行，如果找到法国葡萄酒，也筛选出该行。然后，我们可以在内存中构建一个新的*虚拟表*，其中只包含红葡萄酒或法国葡萄酒的行。这个经过筛选、只包含我们所需行的内存中虚拟\
  \ `Wines` 表，随后可以将该筛选器传播到 `Winesales` 事实表，就像“真实的” `Wines` 维度筛选 `Winesales` 表一样。这样可行吗？\n\
  \n嗯，是的，它会有效，因为在 DAX 中有一类被称为“表”函数的函数，它们可以生成*内存中的虚拟*表，当在 `CALCULATE` 内部使用时，它们会像“真实”表一样传播筛选器。既然我们知道了这一点，剩下的就是去发现那个能够生成仅包含红葡萄酒或法国葡萄酒行的虚拟表的表函数名称。\n\
  \n然而，在我们找到这个函数之前，还需要学习更多内容。我们需要更仔细地了解 DAX 函数的*不同类型*，特别是理解我们所说的“表函数”的含义。然后，我们就能解决“红葡萄酒或法国葡萄酒”这个难题了。\n\
  \n\n好的，作为高级文档工程师，我将根据您提供的注意事项和格式要求，对给定的文本进行翻译和排版。\n\n---\n\n\n在处理 DAX 时，一项对你大有裨益的技能就是拥有丰富的想象力。你已经学会了在脑海中构建当前筛选条件在数据模型中传播的画面。迭代器对表的扫描只能通过设想来完成，而设计正确的\
  \ `CALCULATE` 表达式则需要推断哪些筛选条件必须更改。DAX 还有另一个隐藏的方面，因此也必须靠想象。那就是虚拟表的生成。你的很多 DAX 代码将涉及构建用于度量值计算的内存表。在本章中，我们将探讨这一概念，即我们如何通过使用表函数来创建表表达式，以及它们在操作数据模型中的目的。在这个过程中，我们将专注于最普遍存在的表函数，即\
  \ `FILTER` 函数。\n\n## DAX 函数类型\n\n在 DAX 中，我们可以根据函数返回值的类型将函数分为三类；参见表 7-1。\n\n**表 7-1**\
  \ DAX 函数类型\n\n| 函数类型 | 示例 | 描述 |\n| --- | --- | --- |\n| **标量函数** | 返回标量值。例如：`SUM`、`COUNTROWS`、`SUMX`、`CALCULATE`\
  \ | 这些函数返回一个标量或单个值，用于所有度量值中。 |\n| **表函数** | 返回虚拟表。例如：`FILTER`、`VALUES`、`PREVIOUSMONTH`、`ALL`\
  \ | 表函数用于生成“虚拟”表，这些表与“真实”表一样，通过数据模型传播筛选条件。虚拟表通常是原始表的行子集或列子集，但在使用 `ALL` 函数时，它们可以扩展行数。由于度量值必须始终返回标量值而非表，因此表函数总是嵌套在标量函数内部。\
  \ |\n| **CALCULATE 修饰符** | 修改 `CALCULATE` 的筛选参数。例如：`CROSSFILTER`、`USERELATIONSHIP`、`KEEPFILTERS`、`ALL`\
  \ | 我们将在后面介绍这类函数。这些函数会改变由 `CALCULATE` 生成的任何筛选条件的行为，因此它们总是嵌套在 `CALCULATE` 内部。这些函数不返回任何值。\
  \ |\n\n**注意**\n\n`ALL` 函数既是一个表函数，也是一个 `CALCULATE` 修饰符。我们稍后会详细研究这一点。\n\n你怎么知道自己在使用哪种类型的函数呢？最好的方法是查阅此处的\
  \ DAX 函数库：[`https://docs.microsoft.com/en-us/dax/dax-function-reference`](https://docs.microsoft.com/en-us/dax/dax-function-reference)，它会告诉你一个\
  \ DAX 函数返回什么；例如，`FILTER` 函数返回“*一个只包含已筛选行的表*”，参见图 7-1。\n\n![](img/523050_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1** 使用 DAX 函数库检查函数类型\n\n我们已经探讨过一些标量函数，并且在后续章节中还会遇到更多，例如 `SELECTEDVALUE`\
  \ 函数。稍后我们也将深入探讨像 `CROSSFILTER`、`USERELATIONSHIP` 和 `ALL` 这样的 `CALCULATE` 修饰符。在本章中，我们将只关注表函数。\n\
  \n## 表函数\n\n表函数可以创建*表表达式*，并用于两个目的：\n\n1.  使用**新建表**按钮在数据模型中生成额外的表。这些表被称为*计算表*。如果这是你的需求，建议使用\
  \ Power Query 而不是 DAX 来生成新表。\n2.  作为度量值计算的一部分，生成内存中的虚拟表。\n\n在本章中，我们将只考虑后者，即在 DAX\
  \ 度量值内部使用表表达式生成虚拟表。\n\n在度量值中，只要函数接受“表”作为其参数之一，或者作为 `CALCULATE` 内部的筛选参数，就可以使用表表达式。到目前为止，我们总是在像\
  \ `COUNTROWS` 或 `SUMX` 这样的函数中引用一个实际的表，但现在我们可以使用表表达式来代替。在 `CALCULATE` 内部，我们创建了布尔表达式作为列筛选器，但我们也可以使用表表达式。在创建度量值时，表表达式*总是*嵌套在返回标量值的函数内部，从不单独使用。\n\
  \n### 表表达式示例\n\n请考虑图 7-2 中的表达式，这里我们使用表表达式来代替对表的引用。\n\n![](img/523050_1_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2** 表表达式示例\n\n这些示例使用了一个名为 `VALUES` 的表函数。在此阶段，你不需要了解 `VALUES` 函数在做什么（我们将在后面的章节中介绍\
  \ `VALUES`）。你只需要理解它是一个用作“表”参数或 `CALCULATE` 内部“筛选”参数的*表表达式*。\n\n### 为什么我们需要表表达式？\n\
  \n我们在 DAX 度量值内部使用表表达式，有两个截然不同的原因。\n\n当嵌套在除 `CALCULATE` 之外的任何其他函数内部时，表表达式提供“表”参数，并且通常会创建原始表的子集，可以是行的子集，也可以是列的子集。例如，嵌套在\
  \ `SUMX` 内部的 `FILTER` 通常会生成一个行数更少的表供 `SUMX` 进行迭代。正如我们将在后续章节中发现的，一些表函数也被用于生成包含来自不同表的列组合的“混合”表。\n\
  \n另一方面，作为 `CALCULATE` 内部的筛选参数，表表达式生成的虚拟表被用作*筛选条件*。理解在 `CALCULATE` 内部作为筛选参数使用表表达式，对于\
  \ DAX 初学者来说是一个具有挑战性的概念，我们将在本章的学习过程中详细探讨这一概念。\n\n然而，我们将从理解 DAX 中最常见的表函数开始我们对表函数的探索，那就是\
  \ `FILTER`。\n\n## FILTER 函数\n\n`FILTER` 函数返回一个*表*，该表是另一个表的子集，其语法如下：\n\n```\n= FILTER\
  \ ( table , filter )\n```\n\n其中：\n\n**table** 是你要筛选的表。该表也可以由另一个表函数提供。\n\n**filter**\
  \ 是你要应用于 **table** 的筛选条件，作为一个布尔表达式，例如：`Wines[TYPE]= \"red\"`。\n\n以下是 `FILTER` 函数语法的一个示例：\n\
  \n```\n= COUNTROWS ( FILTER ( Wines, Wines[TYPE]= \"red\" ) )\n```\n\n作为表函数的 `FILTER`\
  \ 可用于生成表表达式，如“为什么我们需要表表达式？”一节所述。我们了解到，这些函数根据其用途（是用于改变数据的形状，例如减少表达式所考虑的行数，还是用于 `CALCULATE`\
  \ 内部）而具有不同的行为。`FILTER` 函数也不例外，因此让我们现在来考虑这两种行为。\n\n\n\n### FILTER 用于减少行数\n\n例如，我们可以计算高销量交易的数量，其中高销量指的是\
  \ `CASES SOLD` 值大于 300 的任何交易。为此，我们可以在 `COUNTROWS` 中嵌套使用 `FILTER` 来对筛选后的 `Winesales`\
  \ 表进行行计数，如以下表达式所示：\n\n```\nNo. of High Volume Sales =\nCOUNTROWS ( FILTER ( Winesales,\
  \ Winesales[CASES SOLD] > 300 ) )\n```\n\n你可以在图 7-3 中看到该度量的结果。`FILTER` 也可以嵌套在 `SUMX`\
  \ 中使用，这样 `SUMX` 迭代的表中的行数将通过 `FILTER` 而减少。例如，我们在第 5 章编写的“总销售额”度量可以扩展为筛选箱数大于 300 的销售额（如图\
  \ 7-4 所示）：\n\n![](img/523050_1_En_7_Fig4_HTML.jpg)\n\n图 7-4：在 `SUMX` 中嵌套使用 `FILTER`\
  \ 来计算箱数大于 300 的销售额\n\n![](img/523050_1_En_7_Fig3_HTML.jpg)\n\n图 7-3：在 `COUNTROWS`\
  \ 中嵌套使用 `FILTER` 来计算高销量的数量\n\n```\nCases GT 300 =\nSUMX (\n    FILTER ( Winesales,\
  \ Winesales[CASES SOLD] > 300 ),\n    Winesales[CASES SOLD] * RELATED ( Wines[PRICE\
  \ PER CASE] )\n)\n```\n\n然而，如果你打算使用这个计算，这并不是完成该任务的最佳表达式。我们将会发现 `FILTER` 是一个迭代器，因此它会扫描可能包含数百万行数据的\
  \ `Winesales` 事实表。本章后面我们将探讨执行此任务的更高效方法。\n\n### FILTER 作为 CALCULATE 的筛选参数\n\n如果 `FILTER`\
  \ 用于 `CALCULATE` 的筛选参数中，`FILTER` 会生成一个内存表，用于筛选数据模型，就像维度筛选数据模型一样。\n\n在 2021 年 3 月之前，在以下两种情况下，必须在\
  \ `CALCULATE` 内部使用 `FILTER` 函数：\n\n1.  当筛选条件包含同一张表的*多个列*时\n2.  当筛选条件包含*一个表达式*时\n\
  \n然而，现在在筛选同一张表中的两个或多个列时，可以省略 `FILTER` 函数，但这取决于切片器的选择，度量仍可能失败。如果表达式是使用聚合函数（例如 `AVERAGE`\
  \ 的简单布尔测试，现在也可以省略 `FILTER`，但在筛选参数中使用任何其他表达式仍然需要使用 `FILTER`。\n\n对于刚接触 `DAX` 的人来说，理解在之前概述的情况下不再需要\
  \ `FILTER` 的新语法是一个近期的发展（`DAX` 最初于 2009 年引入），这一点非常重要。你浏览的任何 `DAX` 资料或复制粘贴的任何代码，很可能使用的是包含\
  \ `FILTER` 的旧语法。\n\n考虑到这一点，让我们回到上一章探索 `CALCULATE` 函数时编写的“红色或法国葡萄酒销售额 #1”度量。该度量如下：\n\
  \n```\nSales for Red or French #1 =\nCALCULATE (\n    [Total Sales],\n    Wines[TYPE]\
  \ = \"red\"\n    || Wines[WINE COUNTRY] = \"France\"\n)\n```\n\n如果 `TYPE` 列或 `WINE\
  \ COUNTRY` 列存在筛选器，该表达式将返回错误结果，因为假设你在切片，你现在只想计算红酒和法国酒的销售额，而不是红色*或*法国酒的销售额（这是当前的计算结果）。如果是这样，正确的值显示在图\
  \ 7-5 左侧的“总销售额”度量中，因为该度量是对切片器中的筛选器做出响应。\n\n![](img/523050_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5：省略 `FILTER` 可能返回错误结果\n\n> **注意：** 你将在本书后面学习关于当 `TYPE` 或 `WINE COUNTRY` 存在筛选器时，“#1”度量返回错误结果的确切细节。\n\
  \n我们确定问题的根源在于我们在筛选条件中使用了两个*不同的*列，实际上在早期，我们被禁止编写此类代码。要解决这个问题，我们需要在 `CALCULATE` 内部使用表函数\
  \ `FILTER`。那么，现在让我们来掌握如何在这种情况下使用 `FILTER`，并用它来编写度量的正确版本：“红色或法国葡萄酒销售额 #2”：\n\n```\n\
  Sales for Red or French #2 =\nCALCULATE (\n    [Total Sales],\n    FILTER ( Wines,\
  \ Wines[TYPE] = \"red\"\n        || Wines[WINE COUNTRY] = \"France\" )\n)\n```\n\
  \n在图 7-6 中，你可以看到该度量在放入表格视觉对象后的评估结果。我们还包含了“总销售额”度量，以便为评估提供上下文和清晰度。\n\n![](img/523050_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6：“红色或法国葡萄酒销售额 #2”度量的计算\n\n请参见图 7-7 了解该度量评估的分步指南。在“红色或法国葡萄酒销售额 #2”度量中，`FILTER`\
  \ 嵌套在 `CALCULATE` 内部以提供筛选参数。`FILTER` 函数是一个*迭代器*。我们在第 5 章研究 `SUMX` 函数时遇到过迭代器。这些函数会逐行扫描表，并在\
  \ `FILTER` 的情况下对每一行执行测试。如果 `FILTER` 应用的测试对于某行为真，则该行会被提取到其自身的虚拟表中。这个用作 `CALCULATE`\
  \ 筛选参数的虚拟表，随后会像“真实”表一样通过模型传播筛选器。\n\n![](img/523050_1_En_7_Fig7_HTML.jpg)\n\n图 7-7：逐步解读“红色或法国葡萄酒销售额\
  \ #2”度量\n\n\n\n1.  `FILTER` 函数遍历内存中的“Wines”表，并筛选出“TYPE” = “red”或“WINECOUNTRY” =\
  \ “France”的任何行。\n\n2.  `FILTER` 会生成一个仅包含测试结果为真的行的内存虚拟表。\n\n3.  由 `FILTER` 生成的虚拟表被用作\
  \ `CALCULATE` 的筛选参数，以筛选“Winesales”表。\n\n我们一直在研究如何使用 `FILTER` 函数对同一张表的两个不同列执行“OR”测试。让我们看另一个具有相同问题的例子。\n\
  \n假设您想要查找高利润葡萄酒的销售数量（即“Winesales”表中的行数）。高利润葡萄酒指的是价格是成本价三倍的葡萄酒。此测试涉及“Wines”维度中的两列：`PRICE\
  \ PER CASE` 和 `COST PRICE`，因此，建议您使用 `FILTER`。以下是您可以使用的度量值：\n\n```\nNo. of Sales\
  \ =\nCOUNTROWS ( Winesales )\nNo. of Sales of High profit Wines =\nCALCULATE (\n\
  [No. of Sales],\nFILTER ( Wines, Wines[PRICE PER CASE] >= Wines[COST PRICE] * 3\
  \ )\n)\n```\n\n我们包含了“No. of Sales”的表达式，该表达式将被嵌套在“No. of Sales of High profit Wines”度量值中。您可以在图\
  \ 7-8 中看到此度量值的计算。\n\n![Figure 7-8](img/523050_1_En_7_Fig8_HTML.jpg)\n\n**图 7-8**\
  \ 查找高利润葡萄酒\n\n您会再次注意到，这里可以省略 `FILTER`，因为使用同一表中不同列的表达式现在是有效的。但是，请注意，如果您对 `PRICE PER\
  \ CASE` 列或 `COST PRICE` 列设置了筛选器，您将无法看到返回正确的值。因此，每当引用多个列时，建议您在 `CALCULATE` 内嵌套使用\
  \ `FILTER`。\n\n然而，当我们需要在 `CALCULATE` 的筛选参数中使用*表达式*时，我们也需要 `FILTER`。我们在此需求下举了两个例子，我们要计算以下内容：\n\
  \n1.  总销售额大于 20,000 的销售数量。我们在筛选器测试中使用了“Total Sales”度量值。\n2.  大于平均销售额的销售数量。为了计算平均销售额，我们使用了您在第\
  \ 5 章中学到的 `AVERAGEX` 表达式。\n\n首先，我们编写了省略 `FILTER` 函数的度量值的“错误”版本。这些表达式将返回错误消息。然后，我们使用\
  \ `FILTER` 编写了正确的表达式。因此，理解这一点很重要：当您在 `CALCULATE` 的筛选器测试中使用任何*表达式*时，都需要使用 `FILTER`。我们已将\
  \ `FILTER` 表达式用灰色高亮显示，以帮助澄清所使用的代码：\n\n```\nSales Greater than 20K Wrong =\nCALCULATE\
  \ ( [No. of Sales], [Total Sales] > 20000 )\nSales Greater than 20K =\nCALCULATE\
  \ ( [No. of Sales],\nFILTER ( Winesales, [Total Sales] > 20000 ) )\nSales Greater\
  \ than Avg Wrong =\nCALCULATE (\n[No. of Sales],\n[Total Sales]\n> AVERAGEX (\n\
  Winesales,\nWinesales[CASES SOLD] *\nRELATED ( Wines[PRICE PER CASE] )\n)\n)\nSales\
  \ Greater than Avg =\nCALCULATE (\n[No. of Sales],\nFILTER (\nWinesales,\n[Total\
  \ Sales]\n> AVERAGEX (\nWinesales,\nWinesales[CASES SOLD] *\nRELATED ( Wines[PRICE\
  \ PER CASE] )\n)\n)\n)\n```\n\n但是，如果需求是计算大于平均销售箱数的销售数量，则此表达式不需要 `FILTER`，因为它使用了简单的聚合函数\
  \ `AVERAGE`。自 2021 年 9 月起，我们现在可以编写使用简单聚合函数（例如在谓词中使用 `AVERAGE` 或 `MAX`）的代码，如下所示：\n\
  \n```\nCases GT Avg =\nCALCULATE (\n[No. of Sales],\nWinesales[CASES SOLD] > AVERAGE\
  \ ( Winesales[CASES SOLD] )\n)\n```\n\n然而，经验丰富的 DAX 用户可能更倾向于看到使用 `FILTER` 表示的此度量值：\n\
  \n```\nCases GT Avg =\nCALCULATE (\n[No. of Sales],\nFILTER ( Winesales, Winesales[CASES\
  \ SOLD]\n> AVERAGE ( Winesales[CASES SOLD] ) )\n)\n```\n\n在本节关于 `FILTER` 函数的内容中，您已经了解到\
  \ `FILTER` 会生成一个虚拟表，该表可用作 `CALCULATE` 的筛选参数。此虚拟表用于筛选数据模型，就像“真实”表一样。\n\n这引出了 `FILTER`\
  \ 函数（实际上通常也是表函数）的另一个方面，我们需要更详细地探讨，即：在 `CALCULATE` 中使用*表表达式*作为筛选器与使用简单的*列*筛选器之间的区别。\n\
  \n## 列筛选器与表筛选器\n\n您已经了解到，在 `CALCULATE` 的“筛选”参数中，可以提供两种类型的筛选器：使用*列*的筛选器和/或使用*表*的筛选器。简而言之，在\
  \ `CALCULATE` 内部，有两种方法可以修改筛选上下文：使用列或使用表。您现在需要理解的是，根据您选择的筛选器类型，度量值的评估结果将存在显著差异。\n\
  \n在本书中，到目前为止，我们遇到的唯一表函数是 `FILTER` 函数，因此我们将使用 `FILTER` 来说明列筛选器和表筛选器之间的区别，但要认识到，这对于用作\
  \ `CALCULATE` 内筛选器的所有表表达式都是相关的。\n\n**注意**\n\n我们将在本书后续部分探索许多其他表函数，例如 `ALL`、`VALUES`\
  \ 以及称为“时间智能”的函数。\n\n为什么我们需要区分表筛选器和列筛选器？这种区别之所以重要，主要有两个原因：\n\n1.  因为 DAX 引擎必须生成虚拟表，表筛选器需要更长的处理时间。\n\
  2.  根据筛选器类型，您的度量值可能会返回不同的结果。\n\n我们现在将探讨这两种情况。在第一个例子中，我们研究表筛选器如何增加度量值的处理负担。在第二个例子中，我们将看到表筛选器可能会产生与列筛选器不同的结果。\n\
  \n\n\n### 表格筛选器效率较低\n\n在此示例中，我们取两个使用 `CALCULATE` 的相似表达式。第一个使用列筛选器，第二个使用表表达式作为筛选器参数。在两个表达式中，我们都在筛选\
  \ `Winesales` 事实表中包含销量大于 300 的行。\n\n```\nCases GT 300 #1 =\nCALCULATE ([Total Sales],\
  \ Winesales[CASES SOLD] > 300 )\nCases GT 300 #2 =\nCALCULATE (\n[Total Sales],\n\
  FILTER ( Winesales, Winesales[CASES SOLD] > 300 )\n)\n```\n\n你可以在图 7-9 中看到，这两个度量值返回相同的结果，那么表格筛选器与列筛选器有何不同？要回答这个问题，我们必须更仔细地考察每个度量值的计算过程，并以“歌海娜”葡萄酒的计算结果\
  \ **$310,530** 为例。\n\n![](img/523050_1_En_7_Fig9_HTML.jpg)\n\n**图 7-9** 两个度量值返回相同结果\n\
  \n在计算度量值 `Cases GT 300 #1` 时，会对 `CASES SOLD` *列* 应用筛选器，以筛选出大于 300 的值。然后为 `Winesales`\
  \ 表中筛选后的行计算“总销售额”值；见图 7-10。\n\n![](img/523050_1_En_7_Fig10_HTML.jpg)\n\n**图 7-10**\
  \ 逐步计算 `Cases GT 300 #1` 度量值\n\n1. 在 `Wines` 表的 `WINE` 列中筛选出葡萄酒“歌海娜”，并通过交叉筛选关联到\
  \ `Winesales` 表，此时该表仅包含“歌海娜”的行。\n2. 在内存中进一步筛选 `Winesales` 表中的 `CASES SOLD` 列，使其只包含该葡萄酒中大于\
  \ 300 的行。然后仅针对这些行计算 `Total Sales` 度量值。\n3. 注意 `CASES SOLD` 列上的筛选器。\n\n在计算度量值 `Cases\
  \ GT 300 #2` 时，`FILTER` 函数会遍历 `Winesales` 表，将 `CASES SOLD` 大于 300 的行提取到一个虚拟表中（记住，`Winesales`\
  \ 表已被筛选为仅包含“歌海娜”葡萄酒）。然后计算由 `FILTER` 生成的虚拟表的总销售额；见图 7-11。\n\n![](img/523050_1_En_7_Fig11_HTML.jpg)\n\
  \n**图 7-11** 逐步计算 `Cases GT 300 #2` 度量值\n\n1. 在 `Wines` 表的 `WINE` 列中筛选出葡萄酒“歌海娜”，并通过交叉筛选关联到\
  \ `Winesales` 表，此时该表仅包含“歌海娜”的行。\n2. `FILTER` 函数遍历 `Winesales` 表以筛选 `CASES SOLD`\
  \ 大于 300 的行，并生成一个虚拟表。\n3. 针对内存中虚拟 `Winesales` 表中的行计算 `Total Sales` 度量值。\n4. 注意 `CASES\
  \ SOLD` 列上没有筛选器，因为筛选后的行是由虚拟表生成的。\n\n**问题：** 你认为这两种计算方式哪个效率更高？\n\n如果你的事实表包含数百万行数据，`FILTER`\
  \ 函数必须遍历这些行来构建虚拟表。我们相信你能理解，使用表格筛选器而非列筛选器会付出高昂的处理代价。Marco Russo 和 Alberto Ferrari\
  \ 用更技术性的语言对此进行了解释：\n\n> *“表格筛选器的一个副作用是，它需要向存储引擎进行大量实体化操作，以使公式引擎能够计算结果。”*^(⁸)\n\n\
  这就是为什么使用表函数 `FILTER` 来筛选销量并非良好实践，因为你应该使用列筛选器。\n\n为了进一步说明这一点，在以下视频中，Marco Russo 将带你了解为什么没必要地使用\
  \ `FILTER` 函数并非好主意：\n\n[我的 Power BI 报表很慢：该怎么办？by Marco Russo](https://www.youtube.com/watch?v=B-h3Pohtn1Y)\n\
  \n在结束有关有问题的表格筛选器这个话题之前，还有一个 `Cases GT 300` 度量值的第三个版本，新手可能会考虑编写它。表达式 `Cases GT 300\
  \ #3` 使用了 `SUMX`，并返回与之前讨论的两个版本相同的结果：\n\n```\nCases GT 300 #3 =\nSUMX ( FILTER (\
  \ Winesales, Winesales[CASES SOLD] > 300 ),\n[Total Sales] )\n```\n\n这个表达式有什么问题？你现在当然已经知道了。答案是它效率低下。首先，`FILTER`\
  \ 遍历事实表以生成包含待考虑行的表。然后，`SUMX` 遍历 `FILTER` 生成的表。这涉及大量迭代！\n\n推荐的表达式始终是在 `CALCULATE`\
  \ 的筛选器参数中对 `CASES SOLD` 列使用简单的筛选器。\n\n\n\n### 表筛选器返回不同结果\n\n为了理解表筛选器的这方面特性，我们来看这两个度量值，第一个使用列筛选器，第二个使用表筛选器：\n\
  \n```\n波尔多葡萄酒 #1 =\nCALCULATE (\nSUM ( Winesales[销售箱数] ),\nWines[葡萄酒] = \"波尔多\"\
  \ )\n波尔多葡萄酒 #2 =\nCALCULATE (\nSUM ( Winesales[销售箱数] ),\nFILTER ( Wines, Wines[葡萄酒]\
  \ = \"波尔多\" )\n)\n```\n\n你可能会认为这两个度量值应该返回相同的结果。然而，如果我们将这些度量值放入一个包含 `Wines` 维度中 `葡萄酒`\
  \ 列的表格视觉对象中（图 7-12），我们会得到不同的结果。度量值 `#1` 为每种葡萄酒都给出了“波尔多”的值，但在 `#2` 中，对于任何非波尔多葡萄酒，我们得到的是空白。\n\
  \n![](img/523050_1_En_7_Fig12_HTML.jpg)\n\n图 7-12\n\n包含 `Wines` 维度中 `葡萄酒` 列的表格视觉对象中的“波尔多葡萄酒\
  \ #1”和“波尔多葡萄酒 #2”\n\n那么为什么会有差异呢？让我们更仔细地看看“波尔多葡萄酒 #1”度量值。在第一次评估该度量值时，活动筛选上下文位于 `Wines`\
  \ 维度的 `葡萄酒` 列上，并且在第一个实例中筛选“波尔多”。此筛选器现在交叉筛选到 `Winesales` 表，以对“波尔多”的 `销售箱数` 求和。在下次评估时，“香槟”位于筛选上下文中。但\
  \ `CALCULATE` 修改了筛选上下文，并将 `葡萄酒` 列上的筛选器从“香槟”*替换*为“波尔多”。正是这个筛选器现在被交叉筛选到 `Winesales`\
  \ 表，以对“波尔多”的 `销售箱数` 求和。对于每种葡萄酒的每次评估以及总计行评估，情况都是如此；参见图 7-13。\n\n![](img/523050_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13\n\n`CALCULATE` 替换 `葡萄酒` 列上的筛选器，因此它始终筛选“波尔多”\n\n**注意**\n\n如前所述，在您目前对 DAX\
  \ 的了解阶段，关于筛选器如何工作的这个解释尚不完整，但暂时足以让您很好地理解。我们将在稍后的第 18 章中给出更准确的解释。\n\n这就是为什么始终返回“波尔多”的销售箱数总计，因为对于每种葡萄酒的评估，`CALCULATE`\
  \ 都会将 `葡萄酒` 列上的筛选器*替换*为“波尔多”。\n\n现在让我们来看第二个使用 `FILTER` 的度量值，我们得到的是“波尔多”的值，但其他葡萄酒则没有返回值。这个度量值使用表筛选器：\n\
  \n```\n波尔多葡萄酒 #2 =\nCALCULATE (\nSUM ( Winesales[销售箱数] ),\nFILTER ( Wines, Wines[葡萄酒]\
  \ = \"波尔多\" )\n)\n```\n\n当前筛选上下文位于 `Wines` 维度的 `葡萄酒` 列上，在第一个实例中在内存中筛选“波尔多”。`CALCULATE`\
  \ 内部的 `FILTER` 函数扫描此表，查找值“波尔多”，并生成一个仅包含“波尔多”行的虚拟表。正是这个表筛选器现在被交叉筛选到 `Winesales` 表，以对“波尔多”的\
  \ `销售箱数` 求和。在对“香槟”进行评估时，`Wines` 维度中的 `葡萄酒` 列会相应地被筛选。但是，`FILTER` 函数不会修改筛选上下文，因此 `CALCULATE`\
  \ 内部的 `FILTER` 函数扫描这个包含“香槟”的单行表，查找值“波尔多”。它找不到，因此没有内容可筛选。现在 `FILTER` 生成了一个空筛选器，而空筛选器不返回任何值；参见图\
  \ 7-14。这就是为什么除了“波尔多”之外，该度量值没有返回任何其他值。\n\n![](img/523050_1_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14\n\n`FILTER` 无法将 `葡萄酒` 列上的筛选器替换为等于“波尔多”，因此除了“波尔多”之外，没有其他行被筛选\n\n关于 `FILTER`\
  \ 函数需要记住的重要一点是，它是一个弱函数。除非您使用我们将在下一章探讨的 `ALL` 函数，否则 `FILTER` 只会筛选*当前筛选上下文中的*行，因此通常会返回原始筛选器的*子集*。另一方面，在\
  \ `CALCULATE` 内部使用列筛选器，则会在需要时替换筛选器。\n\n### 使用 KEEPFILTERS 函数\n\n`CALCULATE` 的这种行为，即列筛选器总是被*替换*，无论从哪方面看，都相当奇怪且不直观，导致每次评估都给出相同的值。而由\
  \ `FILTER` 生成的筛选器，即使它是个表筛选器，看起来反而更“正常”。正如我们正在学习的，如果可能，最好总是使用列筛选器，因此为了使列表达式行为更直观，我们可以使用一个名为\
  \ `KEEPFILTERS` 的函数，如下例所示：\n\n```\n波尔多葡萄酒 #1 =\nCALCULATE (\nSUM ( Winesales[销售箱数]\
  \ ),\nKEEPFILTERS ( Wines[葡萄酒] = \"波尔多\" )\n)\n```\n\n这个函数修改了 `CALCULATE` 的行为，并阻止它替换筛选器。在图\
  \ 7-15 中，您可以看到，对于“波尔多葡萄酒 #1”度量值，我们现在只得到“波尔多”的返回值，而其他葡萄酒没有返回值。\n\n![](img/523050_1_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15\n\n`KEEPFILTERS` 函数阻止 `CALCULATE` 替换筛选器\n\n在本章中，您学习了在 DAX 表达式中生成虚拟表。这些表被度量值用于操作数据模型，既可以返回“真实”表的子集，也可以充当通过数据模型传播筛选器的内存维度。您还了解到了表筛选器和列筛选器不同行为的警告，特别是关于使用\
  \ `FILTER` 函数的情况。随着我们继续前进并处理更具挑战性的计算，这种差异将变得更加重要。然而，就目前而言，让我们只记住这一点：\n\n*尽可能始终使用列筛选器。仅在必要时才使用表筛选器。*\n\
  \n脚注 1\n\n\n\n"
- '# 8. ALL 函数及其所有变体


  在前面的章节中，我们探讨了筛选上下文，以及视觉对象、切片器和筛选器如何共同作用，在度量值评估时对数据模型进行筛选。你已经了解到，使用 `CALCULATE` 函数可以以编程方式修改这些筛选器。但你尚不了解的是如何*移除*筛选器，以便计算你自己的总计和小计。更棒的是，了解如何移除筛选器意味着你可以以编程方式重新应用与当前定义筛选上下文完全不同的筛选器。下面，我来介绍
  `ALL` 函数，它让你能够掌控度量值评估的这一方面。


  从表面上看，`ALL` 函数似乎是一个易于理解的函数。`ALL` 函数返回一个表的所有行，或一列中的所有非重复值，忽略任何可能已应用的筛选器。然而，你将在本章中发现，`ALL`
  函数的简单性掩盖了它是最难掌握的 DAX 函数之一的事实。在本章中，我们将深入探讨这个“披着羊皮的狼”函数；目标是教你 `ALL` 函数的方方面面及其所有变体。这将使你能够继续前进并编写更复杂的度量值。


  理解 `ALL` 函数之所以具有挑战性，至少有两个原因。首先，`ALL` 函数有多种变体：


  - `ALLSELECTED`

  - `ALLEXCEPT`

  - `ALLCROSSFILTERED`

  - `ALLNOBLANKROW`


  你需要知道在何时使用哪一个。


  > **注意：** `ALLCROSSFILTERED` 和 `ALLNOBLANKROW` 函数不在本书的讨论范围内。


  其次，`ALL`（及其变体）具有双重面孔；它既可以用作表函数，也可以用作 `CALCULATE` 的修饰符，如下所述：


  - **作为表函数的 ALL** – 当用作表函数时，`ALL` 的行为如前所述；即，它返回一个表的所有行或一列或多列中的所有非重复值。

  - **作为修饰符的 ALL** – 当 `ALL` 在 `CALCULATE` 中用作顶级筛选器参数时，它充当 `CALCULATE` 的修饰符，并从表或列中*移除*筛选器。换句话说，它不会生成虚拟表。


  事实上，`ALL` 是两个完全不同的函数。这是许多不熟悉 DAX 的用户没有意识到的一点。这主要是因为，无论你是将 `ALL` 函数用作 `CALCULATE`
  中的顶级筛选器参数，还是嵌套在 `FILTER` 或 `COUNTROWS` 等其他函数内部，`ALL` 函数的行为通常都符合你的预期。无论是通过生成包含所有行的虚拟表，还是通过从表和列中移除筛选器，它都会移除筛选器。然而，我们稍后将探讨理解这种差异对于理解
  `ALL` 函数为何至关重要。


  虽然我在这里只提到了 `ALL` 函数，但我们还将探讨 `ALLSELECTED` 和 `ALLEXCEPT` 函数。


  ## ALL 函数


  `ALL` 函数具有以下语法：


  = `ALL ( table )`


  其中：


  `table` 是你要从中清除筛选器的表。


  以下是一个引用表的 `ALL` 函数语法示例：


  = `ALL ( Winesales )`


  与其他将表作为参数的函数不同，你不能在 `ALL` 函数内部嵌套另一个表函数；你只能使用基础表。


  或者，你也可以引用列。


  = `ALL (column 1, column 2, etc.)`


  其中：


  `column(s)` 是你要从中清除筛选器的一个或多个列。


  以下是一个引用列的 `ALL` 函数语法示例：


  = `ALL ( Wines[TYPE] )`


  根据你使用的语法不同（无论是从表中移除筛选器还是从列中移除筛选器），`ALL` 函数对数据模型筛选的影响也会不同。如果你使用 `ALL` 从事实表或维度中移除筛选器，其影响又会有所不同。因此，为了更容易理解
  `ALL` 的行为，我们将 `ALL` 可以移除筛选器的这三个不同对象分别进行探讨，如下所示：


  1.  事实表

  2.  维度

  3.  一个或多个列


  ### 应用于事实表


  让我们再次考虑一个场景。在图 8-1 的可视化对象中，我们使用以下度量值来计算销售数量：


  **图 8-1** – 使用 ALL 计算占总计百分比


  ```

  销售数量 =

  COUNTROWS ( Winesales )

  ```


  然后，我们计算了“销售总计数量”作为分母，以计算“销售数量占总计百分比”中显示的百分比；见图 8-1。


  为了得到这些计算结果，首先，我们需要编写一个忽略来自 Wines 维度筛选器的度量值，以便我们能计算出*所有葡萄酒*的销售数量，即 **2,207**。为此，我们可以使用
  `ALL` 作为表函数，生成一个包含 `Winesales` 事实表所有行的虚拟表，然后使用 `COUNTROWS` 计算该表中的行数。表达式如下：


  ```

  销售总计数量 =

  COUNTROWS ( ALL ( Winesales ) )

  ```


  最后，我们可以将总计除以每种葡萄酒的总数来得到百分比，如以下度量值所示：


  ```

  销售数量占总计百分比 =

  DIVIDE ( [销售数量] , [销售总计数量] )

  ```


  让我们探讨一下向报表添加更多筛选器的影响。在图 8-2 中，我们使用切片器对 SalesPeople 维度应用了筛选器，但你可以看到，无论筛选器如何，使用 `ALL`
  函数的度量值始终返回总计。


  **图 8-2** – ALL 函数忽略来自维度的筛选器


  要理解此示例中 `ALL` 的行为，我们必须再次考虑筛选上下文。在评估“Bordeaux”葡萄酒时，有两个活动筛选器：一个在 Wines 维度上筛选“Bordeaux”，另一个在
  SalesPeople 维度上筛选“Abel”。然而，`ALL` 函数始终对包含 `Winesales` 事实表*所有行*的虚拟表进行计数，忽略从维度传播而来的任何筛选器；见图
  8-3。


  **图 8-3** – 传递给事实表的 ALL 函数会生成一个虚拟事实表，用于所有评估，并且会忽略来自维度的任何筛选器


  让我们看另一个在事实表上使用 `ALL` 函数的示例，但这次是将 `ALL` 嵌套在 `CALCULATE` 内部。例如，你可能想要查找已售箱数的总计，以便将此值用作分母来计算百分比；见图
  8-4。这将是度量值：


  **图 8-4** – 将 ALL 函数嵌套在 CALCULATE 内部以查找已售箱数总计


  ```

  所有葡萄酒销售总箱数 =

  CALCULATE ( [总箱数], ALL( Winesales ) )

  ```


  你可以看到，此度量值同样忽略了数据模型上的任何筛选器。


  然而，现在让我们关注一个你可能需要的表达式，它计算*所有葡萄酒*的平均已售箱数，以便你可以将此平均值与*每种*葡萄酒的平均已售箱数进行比较。这将是找出此平均值的度量值：


  ```

  所有葡萄酒销售平均箱数 =

  CALCULATE( AVERAGE ( Winesales[已售箱数] ), ALL ( Winesales ) )

  ```


  然后，你可以使用 `FILTER` 编写以下度量值，来计算已售箱数值大于所有葡萄酒平均值的销售数量：


  ```

  已售箱数大于所有葡萄酒平均箱数的销售数量 =

  CALCULATE (

  [销售数量],

  FILTER ( Winesales, Winesales[已售箱数]

  >= [所有葡萄酒销售平均箱数] )

  )

  ```




  在“No. of Sales Where Cases is GT Avg All Wines”的代码中，`FILTER`函数会迭代`Winesales`表，筛选出`CASES
  SOLD`列中值大于“Avg Cases All Winesales”计算所得值的所有行。然而，要完全理解此表达式的细节，你需要理解上下文转换的概念，我们将在后续章节中探讨。


  你可以在图 8-5 中看到这些表达式的结果。


  ![Figure 8-5](img/523050_1_En_8_Fig5_HTML.jpg)


  **图 8-5** 计算售出总箱数和所有葡萄酒的平均箱数


  这里需要理解的是，当`ALL`嵌套在`CALCULATE`内部时，它的行为并不像一个表函数。相反，`ALL`会移除事实表上的所有交叉筛选器，因此会对事实表的所有行进行计算。我们将在本章后续内容中详细探讨这种行为。


  以这种方式使用`ALL`，我们能够计算出占总计的百分比。然而，你可能会有不同的需求，那就是计算*筛选后*项目的百分比。这引出了我们可以使用`ALL`的第二个场景，即将其应用于维度。


  ### 在维度表上使用 ALL


  例如，在图 8-2 中，我们在切片器中筛选了销售人员“Abel”，可以看到 Abel 在*所有葡萄酒*上的总销售数量为**376**。我们想知道“Abel”的每种葡萄酒销售额占*此数值*的百分比。换句话说，我们需要移除`Wines`维度上的筛选器，同时保留`SalesPeople`维度中正在筛选“Abel”的`SALESPERSON`列上的筛选器。


  如果我们移除一个特定维度上的筛选器，从其他维度传播到事实表的筛选器将不受影响。因此，如果我们移除`Wines`维度上的筛选器，`SalesPeople`维度上的筛选器将被保留，从而计算出针对已筛选销售人员的*所有葡萄酒*的销售数量。


  然而，下面这个在`Wines`维度上使用`ALL`的度量是不正确的：


  ```

  No. of Sales All Wines Wrong =

  COUNTROWS ( ALL ( Wines ) )

  ```


  该度量将生成一个包含*`Wines`维度中所有行*的表，然后计算此表中的行数，返回**14**，因为`Wines`维度中有 14 行。请记住，我们想要统计行数的表是`Winesales`事实表，该表被筛选为显示切片器中所选销售人员销售的所有葡萄酒。因此，我们需要计算`Winesales`表中的销售数量，这个操作我们已经做过多次：


  ```

  No. of Sales = COUNTROWS ( Winesales)

  ```


  因为我们要修改筛选上下文以移除`Wines`维度上的筛选器，所以我们可以在`CALCULATE`内部使用“No. of Sales”度量，然后将`ALL`函数作为`CALCULATE`的筛选器参数，按如下方式修改筛选上下文：


  ```

  No. of Sales All Wines =

  CALCULATE ( [No. of Sales], ALL ( Wines ) )

  ```


  最后，我们可以相除得到百分比：


  ```

  No. of Sales as Percent of Filtered Value =

  DIVIDE ( [No. of Sales] , [No. of Sales All Wines] )

  ```


  让我们关注图 8-6 中所示的“No. of Sales All Wines”度量。我们可以看到，它计算出的值与“No. of Sales”度量在总计行中的数值相同，即**376**。


  ![Figure 8-6](img/523050_1_En_8_Fig6_HTML.jpg)


  **图 8-6** 使用 ALL 从维度移除筛选器


  在这个表视觉对象中，初始状态下，`Wines`维度和`SalesPeople`维度上都有筛选器。但是，当对每种葡萄酒评估“No. of Sales All Wines”度量时，所有筛选器都会从`Wines`维度上*移除*（因为我们使用了`CALCULATE`），因此总是返回*所有葡萄酒*的值。来自其他维度（例如`SalesPeople`维度）的筛选器则会被保留；见图
  8-7。


  ![Figure 8-7](img/523050_1_En_8_Fig7_HTML.jpg)


  **图 8-7** `ALL`函数移除了`Wines`维度上的筛选器，但其他筛选器得以保留


  或许我们开始意识到，理解`ALL`函数需要掌握很多内容！我们正在接近目标，但尚未完全掌握。例如，考虑我们刚刚使用的度量：


  ```

  No. of Sales All Wines =

  CALCULATE ( [No. of Sales], ALL ( Wines ) )

  ```


  它可能不是你想要的运算。问题在于它移除了`Wines`维度中的*所有*筛选器。将来我们会遇到需要更精确地指定需要移除维度中哪些列的筛选器的情况。




  ### 在列上使用 `ALL`


  请考虑图 8-8 中的示例。来自 `SalesPeople` 维度的 `SALESPERSON` 列*以及*来自 `Wines` 维度的 `SUPPLIER`
  列都正在被切片器筛选。我们正在筛选销售人员“Abel”和供应商“Alliance”。请记住，来自 `Wines` 维度的 `WINE` 列上也有一个筛选器，用于筛选每种葡萄酒。然而，“No.
  of Sales All Wines” 显示的是 Abel 针对*所有*供应商的总和，即 **376**，这是因为该度量值移除了来自 `Wines` 表（包括
  `SUPPLIER` 列）的*所有筛选器*。


  ![](img/523050_1_En_8_Fig8_HTML.jpg)


  **图 8-8**


  引用一个表的 `ALL` 会移除此表中所有列上的筛选器，这可能是不正确的。


  因此，如果你想要显示“Abel”销售“Alliance”的数量占“Abel”对所有供应商的总销售额 (**376**) 的百分比，那么“No. of Sales
  as Percent of Filtered Value”中的百分比将是正确的。但是，如果你想要显示“Abel”的销售额仅占“Alliance” (**99**)
  总销售额的百分比，那么这将是不正确的。如果目标是后者，我们必须计算“Abel”对由“Alliance”（或任何被筛选的供应商）供应的所有葡萄酒的总销售额，即 **99**。


  让我们更仔细地审视这个问题。当前的筛选上下文对 `Wines` 维度中的*两个*列使用了筛选器：`WINE` 和 `SUPPLIER`。如果我们能看到用于评估“Chardonnay”的内存中
  `Wines` 表，它可能看起来像图 8-9 所示。


  ![](img/523050_1_En_8_Fig9_HTML.jpg)


  **图 8-9**


  筛选器同时位于 `WINE` 列和 `SUPPLIER` 列上。


  度量值“No. of Sales All Wines”移除了这两个筛选器，因此计算了 Abel 针对*所有*葡萄酒和*所有*供应商的销售数量。使用以表名作为参数的
  `ALL` 函数，无论是事实表还是维度表，都将移除该表中的*所有*筛选器。但是，我们可以使用 `ALL` 仅移除*特定列*上的筛选器。


  要解决图 8-8 中的问题，我们需要移除 `WINE` 列上的筛选器，但保留 `SUPPLIER` 列上的筛选器。我们可以创建以下度量值来实现这一点：


  ```

  No. of Sales All Wines #2 =

  CALCULATE ( [No. of Sales] , ALL ( Wines[WINE] ) )

  ```


  你可以看到，在这个度量值中，我们在 `ALL` 内部引用了 `WINE` 列，因此 `ALL` 仅移除了这一列上的筛选器。图 8-10 展示了内存中发生的情况，你可以看到
  `SUPPLIER` 列上的筛选器被保留了下来。


  ![](img/523050_1_En_8_Fig10_HTML.jpg)


  **图 8-10**


  在列上使用 `ALL` 仅会移除该列上的筛选器。


  我们现在可以计算正确的百分比，并在图 8-11 中看到评估结果：


  ![](img/523050_1_En_8_Fig11_HTML.jpg)


  **图 8-11**


  “Abel”针对“Alliance”供应商的正确销售百分比。


  ```

  No. of Sales as Percent of Filtered Value #2 =

  DIVIDE ( [No. of Sales] , [No. of Sales All Wines #2] )

  ```


  让我们考虑另一个必须使用 `ALL` 函数来移除特定列上筛选器的示例。这个场景需要我们计算分组项之间的百分比。例如，在图 8-12 的矩阵可视化中，矩阵的行区域中有来自
  `Wines` 维度的两列：`WINE COUNTRY` 和 `TYPE`。我们已经计算了每个 `TYPE` 的“Total Cases”值占每个 `WINE
  COUNTRY` 的“Total Cases”值的百分比，可以看到“White”葡萄酒占“French”葡萄酒的 **47.02%**。^(⁹)


  ![](img/523050_1_En_8_Fig12_HTML.jpg)


  **图 8-12**


  跨分组数据计算百分比。


  那么，创建一个堆积柱形图来显示每个 `WINE COUNTRY` 和 `TYPE` 的总箱数将会很有见地。然后我们可以使用填充了百分比度量值的工具提示来显示跨
  `TYPE` 的百分比细分，如图 8-13 所示。


  ![](img/523050_1_En_8_Fig13_HTML.jpg)


  **图 8-13**


  堆积柱形图，在工具提示中显示了跨 `WINE COUNTRY` 的百分比细分。


  这些是在图 8-12 中计算的度量值。


  ```

  All Wines Type =

  CALCULATE ( [Total Cases], ALL ( Wines[TYPE] ) )

  ```


  ```

  Percentage of Wine Country =

  DIVIDE ( [Total Cases] , [All Wines Type] )

  ```


  让我们更仔细地看看“All Wines Type”度量值在矩阵可视化中是如何被评估的。第一次评估开始时，`WINE COUNTRY` 上有一个“France”的筛选器，`TYPE`
  上有一个“Red”的筛选器，并且这些筛选器被传递到事实表。然而，为了计算“France”的总箱数，必须移除 `TYPE` 上的筛选器，以便该度量值计算“France”的*两种*类型（“Red”和“White”）的总箱数。如果使用
  `ALL` 移除了 `TYPE` 列上的筛选器，则只有“France”这个筛选器被传递到事实表；参见图 8-14。


  ![](img/523050_1_En_8_Fig14_HTML.jpg)


  **图 8-14**


  在 `TYPE` 列上使用 `ALL` 仅会移除该列上的筛选器。


  能够识别你想要移除筛选器的表和/或列是成功使用 `ALL` 的关键。然而，考虑图 8-15 中的示例，其中行区域有*四*列。要计算每个 `WINE COUNTRY`
  的百分比，我们需要移除 `Wines` 维度中*三*列上的筛选器，即 `TYPE`、`SUPPLIER` 和 `WINE`。


  ![](img/523050_1_En_8_Fig15_HTML.jpg)


  **图 8-15**


  从多个列中移除筛选器。


  在 `ALL` 函数内部，你可以引用多个列名，因此可以编写如下度量值：


  ```

  All Wines Type, Supplier & Wine =

  CALCULATE ( [Total Cases],

  ALL ( Wines[TYPE], Wines[SUPPLIER], Wines[WINE] )

  )

  ```


  **注意：** 因为我们移除了 `WINE` 列上的筛选器，所以没有数据的“Lambrusco”葡萄酒将出现在可视化对象中。要解决此问题，请使用可视化级别筛选器来筛选出非空项。


  但是，如果有很多列都需要移除筛选器，你可以想象这会有多繁琐。这种情况下，你可以使用 `ALLEXCEPT` 函数来代替 `ALL`。




  ## `ALLEXCEPT` 函数


  `ALLEXCEPT` 会移除表中的所有筛选器，但保留应用于指定列的筛选器。当你希望移除表中许多列（而非全部列）的筛选器时，可以使用此函数。


  `ALLEXCEPT` 函数的语法如下：


  `= ALLEXCEPT ( table, column1, colum2, etc. )`


  其中：


  - **`table`**：代表要清除筛选器的表，但*除*了后续参数中指定列上的筛选器。

  - **`column1`、`column2`**：代表希望保留筛选器的列。


  以下是 `ALLEXCEPT` 语法的一个示例：


  `= ALLEXCEPT ( Wines, Wines[WINE COUNTRY] )`


  请注意，与 `ALL` 不同，在 `ALLEXCEPT` 中，你需要先提供表名。


  因此，在图 8-15 的矩阵视觉对象中，你可以编写“所有葡萄酒类型、供应商和葡萄酒”度量的替代版本，如下所示：


  ```

  All Except Wine Country =

  CALCULATE ( [Total Cases],

  ALLEXCEPT ( Wines, Wines[WINE COUNTRY] )

  )

  ```


  现在我们可以计算百分比：


  ```

  Percentage of Wine Country #2=

  DIVIDE ( [Total Cases] , [All Except Wine Country] )

  ```


  你可能会觉得我们已经穷尽了所有可能的“ALL”变体！我们探讨了从整个表（无论是事实表还是维度表）中移除筛选器。我们还了解了如何从特定列移除筛选器，以及如何移除多个列的筛选器，同时保留其他列的筛选器。然而，我们还需要探讨另一种情况。请考虑图
  8-16。


  ![](img/523050_1_En_8_Fig16_HTML.jpg)


  图 8-16


  “销售总计”度量并非切片器中所选葡萄酒的总计


  这里有一个表格视觉对象，其中放置了 `Wines` 维度中的 `WINE` 列。你可以看到，使用切片器筛选出了四种葡萄酒。“销售数量”度量计算所选葡萄酒的销售数量。“销售总计”度量也已包含在内，其表达式如下：


  ```

  Grand Total No. of Sales =

  COUNTROWS ( ALL ( Winesales ) )

  ```


  此度量返回所有葡萄酒的销售总数，与切片器选择无关。如果葡萄酒筛选器来自“筛选器”窗格中设置的筛选器，情况也是如此。如果我们只想计算所选葡萄酒的总数百分比（本例中为
  **699**），那么此“销售总计”度量将无法奏效。


  问题在于，切片器中选定的值来自放入表格视觉对象的同一列，即 `WINE` 列。我们使用切片器来*减少*视觉对象中显示的葡萄酒。因此，我们需要找到一个能专门计算*视觉对象中已筛选项目*总计的函数。这个函数就是
  `ALLSELECTED`。


  ## `ALLSELECTED` 函数


  `ALLSELECTED` 函数的语法与 `ALL` 函数相同：


  `= ALLSELECTED ( table )`


  或


  `= ALLSELECTED ( Column 1, Column 2, etc.)`


  然而，如果你查看 DAX 函数库中的函数描述，可能会感到有些困惑：


  > *“`ALLSELECTED` 会移除当前查询中列和行的上下文筛选器，同时保留所有其他上下文筛选器或显式筛选器。`ALLSELECTED` 函数获取表示查询中所有行和列的上下文，同时保留显式筛选器以及除行和列筛选器之外的上下文。此函数可用于在查询中获取视觉对象总计。”*


  公平地说，解释此函数的功能非常困难。通过查看使用示例来理解会容易得多。因此，让我们回到计算切片器中所选葡萄酒总计的问题上。这是我们需要使用的 DAX 表达式：


  ```

  Grand Total No. of Sales for Selected Wines =

  CALCULATE ( [No. of Sales], ALLSELECTED ( Wines[WINE] ) )

  ```


  你可以在图 8-17 中看到此度量及其计算出的百分比。


  ![](img/523050_1_En_8_Fig17_HTML.jpg)


  图 8-17


  `ALLSELECTED` 函数计算出正确的总计


  这个表达式是如何工作的呢？同样，让我们考虑此度量首次计算时的当前筛选上下文，即 `Wines` 维度中 `WINE` 列的“Bordeaux”。然而，`ALLSELECTED`
  会用切片器中的筛选器替换 `WINES` 列上的筛选器。因此，`Wines` 维度会被筛选，以反映切片器的选择；见图 8-18。


  ![](img/523050_1_En_8_Fig18_HTML.jpg)


  图 8-18


  `ALLSELECTED` 函数替换筛选器以反映切片器的选择


  大多数情况下，你可以用 `ALLSELECTED` 代替 `ALL`，因为你经常使用切片器或“筛选器”窗格来减少视觉对象中显示的项目。如果切片器或“筛选器”窗格没有进行任何选择，`ALLSELECTED`
  将移除所有筛选器，就像 `ALL` 一样。


  到目前为止，我们一直在使用 `ALL` 函数（及其变体），而没有考虑它是作为*表函数*使用，还是作为 `CALCULATE` 的*修改器*使用。这些“ALL”函数似乎都各司其职，我们对此心存感激。我们知道，`ALL`
  可以通过从表和列中移除筛选器，或生成包含所有行的虚拟表来移除筛选器。然而，现在我们将重点关注 `ALL` 作为表函数与 `ALL` 作为 `CALCULATE`
  修改器之间的区别。还记得我们在第 1 章中说过，使用 DAX 时，细节决定成败吗？理解 `ALL` 这两种行为之间的差异，正是关注细节的一个绝佳例子。




  ## ALL 作为`CALCULATE`的修饰符


  要理解`ALL`的这一方面，让我们考虑之前见过的一个场景：在保留`SUPPLIER`列筛选条件的同时，移除 Wines 维度中`WINE`列的筛选条件（见图 8-11）。这是为了计算所选供应商的*销售数量*。


  然而，这次我们将通过使用切片器对`Wines`表中相应筛选后的行进行计数，来计算"Alliance"供应的*葡萄酒种类数量*。为此，我们创建了两个相似的度量值，它们都对
  Wines 维度中的`WINE`列使用了`ALL`函数：


  ```

  No. of Wines #1 =

  COUNTROWS ( ALL ( Wines[WINE] ) )

  ```


  ```

  No. of Wines #2 =

  CALCULATE ( COUNTROWS ( Wines ), ALL ( Wines[WINE] ) )

  ```


  然而，只有一个度量值返回了正确的结果；见图 8-19。


  ![](img/523050_1_En_8_Fig19_HTML.jpg)


  **图 8-19** 在列上使用`ALL`可能返回不同的结果


  "No. of Wines #1"度量值将`ALL`作为*表函数*使用，生成了一个包含`WINE`列中*所有*不重复值的一列表格。然后该度量值计算这个虚拟表中的行数，返回
  14 行，如图 8-20 所示。


  ![](img/523050_1_En_8_Fig20_HTML.jpg)


  **图 8-20** `ALL`作为表函数生成一个包含不重复值的虚拟表


  "No. of Wines #2"度量值在`CALCULATE`内部将`ALL`作为*修饰符*使用，因此*移除了*`WINES`列的筛选条件，但保留了`SUPPLIER`列的筛选条件。然后该度量值计算`Wines`维度中的行数，返回
  4 行；见图 8-21。


  ![](img/523050_1_En_8_Fig21_HTML.jpg)


  **图 8-21** 作为`CALCULATE`修饰符的`ALL`函数移除了`WINE`列上的筛选条件


  这个例子解释起来很简单。然而，`ALL`函数作为`CALCULATE`的修饰符可能更难理解，我们接下来要探讨的下一个例子正是如此。


  我们构建了三个度量值，用于计算销售箱数大于 300 的销售数量。它们都使用了表达式 *`ALL ( Winesales )`*（灰色高亮部分），并且这些表达式看起来非常相似。因此你可能期望它们返回相同的结果：


  ```

  No. of Sales Where Cases GT 300 #1 =

  CALCULATE ( [No. of Sales],

  ALL ( Winesales ),

  Winesales[CASES SOLD] > 300

  )

  ```


  ```

  No. of Sales Where Cases GT 300 #2 =

  CALCULATE (

  [No. of Sales],

  FILTER (

  ALL ( Winesales ), Winesales[CASES SOLD] > 300 )

  )

  ```


  ```

  No. of Sales Where Cases GT 300 #3 =

  CALCULATE (

  [No. of Sales],

  ALL ( Winesales ),

  FILTER ( Winesales, Winesales[CASES SOLD] >300 )

  )

  ```


  然而，正如你在图 8-22 中所见，度量值#1 和#2 返回了相同的值，而度量值#3 却返回了一个不同的值。


  ![](img/523050_1_En_8_Fig22_HTML.jpg)


  **图 8-22** 相似的表达式可能返回不同的结果


  这三个度量值都在`Winesales`表上使用了`ALL`，因此它们应该忽略`Winesales`表上的任何筛选条件。这对于度量值#1 和#2 是成立的（在`Winesales`表中，`CASES
  SOLD`大于 300 的**有 286**行），但度量值#3 呢？在这个度量值中，`ALL`函数似乎被忽略了，而从 Wines 维度传播过来的交叉筛选得以保留。因此，这个度量值返回了*每个葡萄酒*中`CASES
  SOLD`大于 300 的销售数量。


  **问题：** 这些度量值中哪一个与众不同？


  你可能认为是度量值#3，因为它返回了不同的值。然而，你也可以认为度量值#2 与众不同，因为它是唯一一个将`ALL`用作*表函数*的度量值。在其他两个度量值中，`ALL`是作为`CALCULATE`的*修饰符*发挥作用的。


  为了理解这一点，让我们更详细地看看每个度量值的计算过程。


  在这个度量值中


  ```

  No. of Sales Where Cases GT 300 #1 =

  CALCULATE ( [No. of Sales],

  ALL ( Winesales ), Winesales[CASES SOLD] > 350

  )

  ```


  `CALCULATE`中有两个筛选参数。第一个使用了`ALL`，它*修改*筛选条件以移除`Winesales`表上的筛选。这个首先被计算，产生一个空的筛选条件。第二个是对`CASES
  SOLD`列的*列筛选*，筛选出销售箱数大于 300 的行；见图 8-23。


  ![](img/523050_1_En_8_Fig23_HTML.jpg)


  **图 8-23** "No. of Sales Where Cases GT 300 #1"的计算过程


  1.  `ALL`作为`CALCULATE`的修饰符发挥作用，移除`Winesales`表上的任何筛选或交叉筛选，包括从`Wines`维度传来的筛选。这产生了一个空的筛选条件，因此，`Winesales`表现在没有任何筛选条件。


  2.  然后在`Winesales`表的`CASES SOLD`列上放置一个新的筛选条件，以筛选出任何销售箱数大于 300 的销售记录。这是计算"No. of
  Sales"度量值的新筛选环境，并在此环境下对`Winesales`表的行进行计数。


  在这个度量值中


  ```

  No. of Sales Where Cases GT 300 #2 =

  CALCULATE (

  [No. of Sales],

  FILTER (

  ALL ( Winesales ), Winesales[CASES SOLD] >350 )

  )

  ```


  `CALCULATE`中只有一个由`FILTER`函数提供的筛选参数（灰色高亮部分）。在`FILTER`函数内部，`ALL`函数生成了一个包含`Winesales`表中所有行的虚拟表，因此移除了来自`Wines`维度的交叉筛选。`FILTER`函数遍历这个*虚拟表*，返回`CASES
  SOLD`大于 300 的行；见图 8-24。


  ![](img/523050_1_En_8_Fig24_HTML.jpg)


  **图 8-24** "No. of Sales Where Cases GT 300 #2"的计算过程


  1.  当前的筛选上下文筛选`Wines`维度中的每个`WINE`，并且这被交叉筛选到`Winesales`表。


  2.  `FILTER`内部的`ALL`函数生成一个包含`Winesales`所有行的虚拟表，忽略了葡萄酒筛选条件。


  3.  `FILTER`函数遍历虚拟的`Winesales`表，以筛选出`CASES SOLD`大于 300 的行。这是计算"No. of Sales"度量值的新筛选环境，并在此环境下对虚拟`Winesales`表的行进行计数。


  这个度量值的结果与之前的#1 相同。然而，你可以理解，生成一个虚拟表比简单地在列上放置筛选条件效率更低。这里再次举例说明了在`CALCULATE`内部使用表筛选时需要付出高昂的处理代价（之前在学习`FILTER`函数时我们已经看过这一点）。


  在这个度量值中


  ```

  No. of Sales Where Cases GT 300 #3 =

  CALCULATE (

  [No. of Sales],

  ALL ( Winesales ),

  FILTER ( Winesales, Winesales[CASES SOLD] >300 )

  )

  ```


  `CALCULATE`内部有两个筛选参数。第一个，*`ALL ( Winesales )`*，是一个`CALCULATE`修饰符。第二个，*`FILTER (
  Winesales, Winesales[CASES SOLD] > 300 )`*，是一个表筛选。我们需要理解，`CALCULATE`修饰符在任何其他筛选参数之前被计算。让我们来看第一个参数，它*修改*筛选上下文以移除`Winesales`表上的筛选。这个首先被计算，并创建一个空的筛选条件，因为`Winesales`表上的所有筛选都已被移除。




  第二个筛选器使用`FILTER`函数创建一个虚拟的`Winesales`表。但`FILTER`生成的虚拟`Winesales`表中哪些行被过滤了？我们要求`FILTER`筛选出`CASES
  SOLD`大于 300 的行。然而，请记住我们对`FILTER`函数的了解。此函数仅筛选*当前筛选上下文*中的行。因此，`FILTER`生成的表仍然包含*每种酒*的行（例如，第一次评估中仅包含“Bordeaux”的行），然后这些行被进一步筛选，仅保留`CASES
  SOLD`大于 350 的行；参见图 8-25。


  ![图 8-25](img/523050_1_En_8_Fig25_HTML.jpg)


  **图 8-25** “箱数大于 300 的销售数量 #3”的评估过程


  1. 第一个参数使用`ALL`作为修饰符，移除`Winesales`表上的筛选器。此步骤首先被评估，现在`Winesales`表上有一个空的筛选器。

  2. 使用`FILTER`的筛选参数现在被单独评估。`Wines`维度与`Winesales`事实表进行交叉筛选，从而筛选每种酒。

  3. `FILTER`函数遍历当前筛选上下文中的`Winesales`表，并生成一个包含例如“Bordeaux”酒行的虚拟表。

  4. 然后，它进一步筛选这些行，仅保留该酒中`CASES SOLD`大于 300 的行。由于使用`ALL`的第一个参数已生成空筛选器，这就是评估“销售数量”度量的新筛选上下文，并且虚拟`Winesales`表中的行将被计数。


  现在让我们总结一下对`ALL`的了解。`ALL`函数作为*表*函数，会生成一个包含表的所有行或列（或列组）的所有非重复行的虚拟表。这个包含所有行的虚拟表可以被`FILTER`*重新筛选*，然后这将像之前的度量#2
  一样，通过模型传播筛选器。


  `ALL`函数作为`CALCULATE`的修饰符，在`CALCULATE`内部的任何筛选参数之前被评估。`ALL`作为修饰符会*移除*表或列上的任何筛选器，并生成一个空的筛选器。然后，`CALCULATE`的其他筛选参数被评估，并像之前的度量#1
  和#3 一样生成新的筛选上下文。


  由于`ALL`作为`CALCULATE`的顶级参数时行为不同，用户认为在这种情况下它应该有一个不同的名称。因此，在 2019 年，DAX 函数库中引入了新函数`REMOVEFILTERS`。此函数与`ALL`同义，但它只能用作`CALCULATE`的修饰符，而不能像`ALL`那样用作表表达式。


  本章我们探讨了`ALL`、`ALLEXCEPT`和`ALLSELECTED`函数，这些函数难以掌握。无论你使用 DAX 有多久，此处描述的示例始终难以理解，但只有通过仔细思考这些度量的评估过程，密切关注细节，我们才能真正理解
  DAX 的工作原理。


  在介绍了`ALL`及其变体后，我们现在可以继续研究一组称为时间智能函数的函数，有趣的是，在这些函数中，`ALL`函数基本上已经变得多余。


  脚注 1


  '
- "# 9. 日期计算：使用 DAX 时间智能\n\n你是否曾想将本月的销售额与上个月的销售额进行比较？或者更复杂一些，例如累计总和，甚至滚动月平均值？如果答案是肯定的（而且你很可能需要），那么像这样使用日期数据的计算需要使用一组称为“时间智能”函数的\
  \ DAX 函数。本章的重点是探索这些函数，你将学习如何设计表达式，以便评估不同时间粒度（如财年、季度、月份，甚至日粒度）的数据。通过这样做，你将能够比较和对比这些时间段内的计算，从而深入理解对你至关重要的数据，例如随时间变化的趋势和模式。\n\
  \n> **注意**：术语“时间智能”有点误导性。这些不是*时间*智能函数，而是*日期*智能函数，因此这些函数不会帮助你进行关于小时、分钟或秒的计算，尽管我们可以借助时间维度来进行这些计算。\n\
  \n使用时间智能函数的起点是创建日期维度。这是因为大多数时间智能函数设计为与日期表一起工作，并将其作为数据模型的组成部分。你可能觉得你的数据模型不需要日期维度，但那样你将很难创建所需的基于日期的计算，并且肯定无法享受到时间智能度量的好处。\n\
  \n然而，DAX 新手通常没有意识到日期计算的这一方面，因此他们的模型中就没有日期维度。如果是这种情况，Power BI 将通过生成内置的日期层次结构来帮助你进行日期分析，我们将首先探讨这一点。\n\
  \n## Power BI 日期层次结构\n\n如果模型中缺少日期维度，但任何表中存在日期数据类型的列，那么对于这些列中的每一列，Power BI 都会为你生成一个内存中的日期表，该表还包含一个日期层次结构。我们从数据模型中移除了`DateTable`维度，因此`SALE\
  \ DATE`列现在以日期层次结构的形式表示，如图 9-1 所示。\n\n![图 9-1](img/523050_1_En_9_Fig1_HTML.jpg)\n\
  \n**图 9-1** 带有 Power BI 生成的日期层次结构的日期类型列\n\n此功能称为“自动日期/时间”，但你可以在**选项**窗格（如图 9-2 所示）中全局或仅为当前文件关闭此行为。\n\
  \n![图 9-2](img/523050_1_En_9_Fig2_HTML.jpg)\n\n**图 9-2** 你可以使用选项窗格关闭日期层次结构的生成\n\n\
  如果开启了“自动日期/时间”功能且模型中缺少日期维度，任何日期数据类型的字段都将被组织到层次结构中。这些内置的日期层次结构在放入 Power BI 视觉对象时，有助于深入挖掘不同的日期粒度，并且还可以按年、季度、月和天进行切片。例如，在图\
  \ 9-3 中，我们在 Power BI 折线图中使用`SALE DATE`层次结构深入查看月份粒度，并按年份进行切片。\n\n![图 9-3](img/523050_1_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3** 使用内置日期层次结构可视化日期数据\n\n然而，使用这些层次结构存在许多缺点：\n\n*   如果你的会计年度不是从一月开始怎么办？\n\
  *   如果你想按周粒度分析销售额怎么办？如何添加周数？\n*   如果你想在簇状柱形图中比较 2020 年和 2021 年的销售额怎么办？\n\n所有上述问题对于使用内置日期层次结构来说都是真正的挑战，但如果你在模型中有一个日期表维度，那么就日期计算而言，生活将变得轻松得多。因此，第一步是生成你的日期维度表并将其集成到你的数据模型中。\n\
  \n\n\n## 创建日期表\n\n要生成日期表，你可以使用 DAX 或 Power Query，详情请参考以下两个链接：\n\n[`www.sqlbi.com/articles/creating-a-simple-date-table-in-dax/`](http://www.sqlbi.com/articles/creating-a-simple-date-table-in-dax/)\n\
  [`https://exceleratorbi.com.au/build-reusable-calendar-table-power-query/`](https://exceleratorbi.com.au/build-reusable-calendar-table-power-query/)\n\
  \n如果上述两种方法都不适用，你也可以使用 Excel 来创建日期表。\n\n日期表中唯一必需的列，是包含一系列连续日期的列，该序列必须涵盖数据时间范围内的*所有日期*。例如，我们的葡萄酒销售数据从\
  \ 2017 年 1 月开始，到 2021 年 12 月结束；因此，我们的日期表包含一个 `DATEKEY` 列，其值从 2017 年 1 月 1 日开始，到\
  \ 2021 年 12 月 31 日（我们财年的结束日期）结束。即使某些特定日期没有数据，也必须包含这些年份的所有日期。日期表中的其他列用于对这些日期进行分组和分类，这些列完全是可选的。然而，通常的做法是设置财年和季度的列，以及包含月份名称和月份编号的月份列。你也可以加入不同的财年和周数。若要按月份进行分析，则需要同时包含月份名称*和*月份编号。这样做可以正确地对月份名称进行排序，并且某些度量值会需要同时引用月份名称和编号。\n\
  \n现在，我们已经将 `DateTable` 重新放回数据模型中。可以看到，`DateTable` 通过 `SALE DATE` 和 `DATEKEY` 列与事实表相关联，如图\
  \ 9-4 所示。\n\n![](img/523050_1_En_9_Fig4_HTML.jpg)\n\n图 9-4\n\n`DateTable` 通过 `DATEKEY`\
  \ 列与 `Winesales` 事实表相关联\n\n注意\n\n通常，我们会使用日期表中包含唯一日期列表的列作为链接字段或主键，但如果需要，也可以使用日期表中的其他唯一字段作为链接字段。但是，无论是否使用该字段链接事实表，日期表中都必须包含一个包含连续日期列表的列。\n\
  \n关于日期表的下一个要求是确保模型“知道”这是你的日期维度。如果你没有使用包含唯一日期列表的字段作为日期表的主键，这一点尤其重要。通过从**表工具**选项卡中选择**标记为日期表**选项，将日期维度标记为日期表即可实现此目的。然后，在“日期列”下拉列表中，选择日期表中包含唯一日期列表的列，如图\
  \ 9-5 所示。\n\n![](img/523050_1_En_9_Fig5_HTML.jpg)\n\n图 9-5\n\n使用**标记为日期表**选项来确保日期维度的完整性\n\
