  \n理解度量值的另一种方式是，它们是报表级别的计算，而你在计算列中创建的是行级别的计算。\n\n#### 度量值返回标量值\n\n所有 Power BI 视觉对象都是对数据进行分组和聚合的报表工具，就像\
  \ Excel 数据透视表或数据透视图一样。因此，为了理解度量值的这一方面，让我们戴上 Excel 的帽子，提醒自己：在 Power BI 中，`表` 和 `矩阵`\
  \ 视觉对象等同于 Excel 数据透视表。例如，考虑图 3-15 中 `表` 视觉对象中的值。\n\n![](img/523050_1_En_3_Fig15_HTML.jpg)\n\
