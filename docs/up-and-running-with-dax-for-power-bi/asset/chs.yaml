  \n数据维度设置的最后一步是正确地对月份名称进行排序。在图 9-6 中，我们使用了**列工具**选项卡中的**按列排序**按钮，按“月份编号”对“月份”进行排序。\n\
  \n![](img/523050_1_En_9_Fig6_HTML.jpg)\n\n图 9-6\n\n使用**按列排序**选项对月份名称进行排序\n\n现在，我们已经生成了日期维度，就可以利用\
  \ DAX 中的时间智能函数，以多种富有洞察力的方式跨年、季度、月和日分析数据，从而受益。\n\n## 使用时间智能函数\n\n时间智能函数使用一个*基准日期*来执行所需的计算。这个基准日期由当前的筛选上下文提供。例如，“上个月”和“去年同期”是相对术语，即相对于当前筛选上下文中的日期而言。因此，在使用大多数这类函数时，必须通过切片器、筛选器窗格或在视觉对象中包含日期来筛选出一个特定日期（某年、某季度、某月或某天）。例如，如果你想查找上个月的销售额，则必须在视觉对象或切片器中筛选出当前月份；参见图\
  \ 9-7。\n\n![](img/523050_1_En_9_Fig7_HTML.jpg)\n\n图 9-7\n\n“基准日期”由筛选上下文提供，该上下文可以通过视觉对象中的列或年份和月份切片器来实现\n\
  \n所有时间智能函数（`LASTNONBLANK` 和 `LASTNONBLANKVALUE` 除外）都有一个参数，要求指定用于计算的日期列。大多数情况下，在此参数中，你需要提供日期表中包含唯一日期列表的列的名称，例如我们数据中的\
  \ `DATEKEY` 列；参见图 9-8。\n\n![](img/523050_1_En_9_Fig8_HTML.jpg)\n\n图 9-8\n\n“Dates”参数通常需要引用包含唯一日期列表的列\n\
  \n注意\n\n这里有一个例外。在 `LASTDATE` 和 `FIRSTDATE` 函数中，你可能需要引用事实表中的日期列。\n\n对于你使用时间智能函数构建的每个\
  \ DAX 表达式，都可以使用 `CALCULATE`、`FILTER`、`MAX` 和 `MIN` 等标准 DAX 函数编写等效的表达式。但是，如果是这种情况，你还需要一个函数，那就是\
  \ `ALL` 函数。例如，在当前筛选上下文筛选的是六月的日期时，要查找五月的日期，你必须使用 `ALL` 函数移除日期表中当前对六月的筛选，以便可以重新筛选出五月的日期。通过使用时间智能函数并引用日期表的“Dates”列，`ALL`\
  \ 函数的功能就被隐式地包含了。这就是为什么在使用时间智能函数时，不需要先使用 `ALL` 移除筛选，然后再重新应用特定筛选的原因。\n\n我们将在本章中探讨的时间智能函数列于表\
  \ 9-1 中。返回值通常是一个包含单列日期的虚拟表。返回到此列中的日期也显示在表 9-1 中。\n\n表 9-1\n\n时间智能函数及其返回值\n\n| 函数\
  \ | 返回的日期 |\n| --- | --- |\n| `PREVIOUSMONTH` | 当前筛选上下文中的月份的上一个月份。 |\n| `SAMEPERIODLASTYEAR`\
  \ | 当前筛选上下文中的月份的去年同期。 |\n| `DATEADD` | 当前筛选上下文之前（或之后）的年份、季度、月份或天数。 |\n| `DATESYTD`\
  \ | 从年初到当前筛选上下文中的日期。 |\n| `DATESBETWEEN` | 两个日期之间的日期。 |\n| `DATESINPERIOD` | 从某个日期开始，基于当前筛选上下文向前（或向后）推移任意数量的年份、季度、月份或天数。\
  \ |\n| `LASTDATE` | 当前筛选上下文中的最后一个日期。 |\n| `LASTNONBLANK` | 在当前筛选上下文中，表达式非空时列中的最后一个日期。\
  \ |\n| `LASTNONBLANKVALUE` | 在当前筛选上下文中，表达式非空时列中的最后一个值。 |\n\n通常，时间智能函数会生成一个虚拟的单列表，其中包含来自日期维度中\
  \ `DATEKEY` 列（或你为该列命名的任何名称）的筛选后的日期。此虚拟表作为 `CALCULATE` 函数内的表筛选器使用，用于筛选事实表中的日期。\n\n\
  \n\nDAX 时间智能函数要么是作为 `CALCULATE` 内部筛选参数嵌套的*表*函数，要么返回*标量*值。原因在于，如果表函数返回一个单列单行的表，DAX\
  \ 引擎会将其转换为标量值；参见表 9-2。\n\n**表 9-2**  \n显示“表”或“标量”函数，或两者兼具\n\n| 表 | 表或标量 | 标量 |\n\
  | --- | --- | --- |\n| `DATEADD`<br>`DATESBETWEEN`<br>`DATESINPERIOD`<br>`DATESYTD`<br>`PREVIOUSMONTH`<br>`SAMEPERIODLASTYEAR`\
  \ | `LASTDATE`<br>`LASTNONBLANK` | `LASTNONBLANKVALUE` |\n\n例如，可以按如下方式使用`LASTDATE`：\n\
  \n**用作标量**\n\n```\nLastDate Example #1 =\nLASTDATE(Winesales[SALE DATE])\n```\n\n\
  **用作`CALCULATE`内部的表筛选器**\n\n```\nLastDate Example #2 =\nCALCULATE([Total Sales],LASTDATE(Winesales[SALE\
  \ DATE]))\n```\n\n**用于在`CALCULATE`内部返回标量**\n\n```\nLastDate Example #3 =\nCALCULATE(LASTDATE(Winesales[SALE\
  \ DATE]),DateTable[YEAR]=2020)\n```\n\n现在让我们分析不同时间范围内的总病例数。您可以在图 9-9 中看到以下表达式的结果。请注意使用切片器来筛选计算表达式所依据的基准日期为\
  \ **2021 年 12 月**。\n\n### 上个月/去年 – `PREVIOUSMONTH`/`PREVIOUSYEAR`\n\n以下是分别计算上个月或去年值的\
  \ DAX 表达式：\n\n```\nPrevious Month Total Cases =\nCALCULATE ( [Total Cases],\nPREVIOUSMONTH\
  \ ( DateTable[DATEKEY] )\n)\n```\n\n```\nPrevious Year Total Cases =\nCALCULATE\
  \ ( [Total Cases],\nPREVIOUSYEAR ( DateTable[DATEKEY] )\n)\n```\n\n`PREVIOUSYEAR`函数假定您的财务年度结束于\
  \ 12 月 31 日。如果您使用不同的财务年度，您可以使用该函数的第二个参数来定义您的年末日期。为避免任何日期区域设置问题，请使用日期格式“YYYY-MM-DD”（该函数忽略年份，因此使用任何年份值）；例如，如果您的年末日期是\
  \ 3 月 31 日，则度量值如下：\n\n```\nYear To Date Cases =\nCALCULATE ( [Total Cases] ,\nPREVIOUSYEAR\
  \ ( DateTable[DATEKEY], \"2021-03-31\"\n)\n)\n```\n\n### 去年同期 – `SAMEPERIODLASTYEAR`\n\
  \n这是计算去年同一时期值的 DAX 表达式：\n\n```\nSame Period Last Year Cases =\nCALCULATE ( [Total\
  \ Cases],\nSAMEPERIODLASTYEAR ( DateTable[DATEKEY] )\n)\n```\n\n### 任意时间之前的值 – `DATEADD`\n\
  \n以下分别是计算 6 个月前和 30 天前值的 DAX 表达式：\n\n```\n6 Months Ago Cases =\nCALCULATE ( [Total\
  \ Cases],\nDATEADD ( DateTable[DATEKEY], -6, MONTH )\n)\n```\n\n```\n30 Days Ago\
  \ Cases =\nCALCULATE ( [Total Cases] ,\nDATEADD ( DateTable[DATEKEY], -30, DAY )\n\
  )\n```\n\n### 年初至今 – `DATESYTD`\n\n此表达式将计算当前筛选上下文中年份的年初至今值：\n\n```\nYear To Date\
  \ Cases =\nCALCULATE ( [Total Cases] ,\nDATESYTD ( DateTable[DATEKEY] )\n)\n```\n\
  \n`DATESYTD`函数与`PREVIOUSYEAR`类似，假定您的财务年度结束于 12 月，并且与`PREVIOUSYEAR`一样，您可以使用该函数的第二个参数来定义您的年末日期，使用格式“YYYY-MM-DD”以避免日期区域设置问题，如下所示：\n\
  \n图 9-9  \n时间智能计算\n\n```\nYear To Date Cases =\nCALCULATE ( [Total Cases] ,\nDATESYTD\
  \ ( DateTable[DATEKEY], \"2021-03-31\")\n)\n```\n\n借助时间智能函数，这些表达式的编写都变得直接了当。现在让我们继续探索一些更复杂的计算。\n\
  \n### 至今累计或累积总计\n\n计算“Total Sales”度量的至今累计或累积总计的 DAX 度量值如下（参见图 9-10）：\n\n图 9-10 \
  \ \n累积销售总额\n\n```\nCumulative Total =\nCALCULATE ( [Total Sales] ,\nDATESBETWEEN\
  \ ( DateTable[DATEKEY], 0 ,\nLASTDATE ( DateTable[DATEKEY] )\n)\n)\n```\n\n此表达式使用`DATESBETWEEN`函数，该函数返回介于开始日期和结束日期之间的日期表。\n\
  \n请注意，`DATESBETWEEN`函数的开始日期为零，这意味着开始日期将是日期列中的最早值，或者您可以使用`BLANK()`函数（我们将在下一章中了解此函数）。结束日期由`LASTDATE`函数找到，该函数在当前筛选上下文中查找最后一个日期。这将是表格可视化中任何行的月份的最后一天，或切片器或筛选器窗格中筛选的月份的最后一天。\n\
  \n### 滚动年度总计和平均值\n\n要计算滚动年度总计和平均值，您必须使用两个函数：`DATESINPERIOD`和`LASTDATE`。我们先计算滚动年度总计：\n\
  \n```\nRolling Annual Total Sales =\nCALCULATE ( [Total Sales],\nDATESINPERIOD (\
  \ DateTable[DATEKEY],\nLASTDATE ( DateTable[DATEKEY] ) , -1 , YEAR ) )\n```\n\n\
  此度量值中的`LASTDATE`函数在当前筛选上下文中查找最后一个日期（即表格可视化中任何行、切片器或筛选器窗格中的月份的最后一天）。`DATESINPERIOD`函数从该最后日期开始，往回推一年，计算总销售额。\n\
  \n现在计算滚动年度平均值：\n\n```\nRolling Annual Average Total Sales =\nCALCULATE (\n[Total\
  \ Sales] / COUNTROWS ( VALUES ( DateTable[MONTH] ) ),\nDATESINPERIOD (\nDateTable[DATEKEY],\n\
  LASTDATE ( DateTable[DATEKEY] ),  -1,  YEAR\n)\n)\n```\n\n滚动年度平均值的表达式与滚动年度总计的表达式大致相同。但是，我们需要找出每个滚动年度的月平均总计。如果我们将“Total\
  \ Sales”度量值除以 12，这在*第一年*中是不正确的，因为在 1 月，只有一个月在滚动；在 2 月，只有两个月在滚动；在 3 月，只有三个月；等等。这就是为什么我们需要使用`COUNTROWS`和`VALUES`函数来计算分母中正确的滚动月数，而不是简单地除以\
  \ 12。这些度量值的结果如图 9-11 所示。\n\n图 9-11  \n滚动年度及平均销售额\n\n我们将在本书后面介绍`VALUES`函数，因此在此阶段，只需说明该函数会生成一个虚拟表，该表仅包含日期维度中\
  \ `MONTH` 列中在`DATESINPERIOD`表达式生成的筛选上下文中可见的值。`COUNTROWS`函数计算该虚拟表中的行数，从而在我们的数据第一年中给出正确的累计月数。\n\
  \n\n\n### 计算最后交易日期与最后交易值\n\n如果你想要查找有数据的第一个或最后一个日期，例如“总销售额”度量值有值的最后日期，你可以使用 `FIRSTNONBLANK`\
  \ 和 `LASTNONBLANK` 函数，如下所示：\n\n```\nDate of Last Transaction =\nLASTNONBLANK ( DateTable[DATEKEY],\
  \ [Total Sales] )\n```\n\n```\nDate of First Transaction =\nFIRSTNONBLANK ( DateTable[DATEKEY],\
  \ [Total Sales] )\n```\n\n然后，你可以通过 `LASTNONBLANKVALUE` 和 `FIRSTNONBLANKVALUE` 函数查找这些日期的总销售额值；请参见图\
  \ 9-12。\n\n![](img/523050_1_En_9_Fig12_HTML.jpg)\n\n**图 9-12** - 计算首次和末次交易日期及数值\n\
  \n```\nValue of First Transaction =\nFIRSTNONBLANKVALUE ( DateTable[DATEKEY], [Total\
  \ Sales] )\n```\n\n```\nValue of Last Transaction =\nLASTNONBLANKVALUE ( DateTable[DATEKEY],\
  \ [Total Sales] )\n```\n\n`LASTNONBLANK` 和 `LASTNONBLANKVALUE` 函数可以有更具创造性的用法。也许你需要计算上一笔交易的日期，或者希望找到连续销售之间的差额，如图\
  \ 9-13 所示。\n\n![](img/523050_1_En_9_Fig13_HTML.jpg)\n\n**图 9-13** - 计算连续交易之间的值差异\n\
  \n以下是用于完成这些任务的表达式：\n\n```\nPrevious Sales Date =\nCALCULATE (\nLASTNONBLANK ( DateTable[DATEKEY],[Total\
  \ Sales] ),\nDateTable[DATEKEY] < MAX (DateTable[DATEKEY] )\n)\n```\n\n```\nPrevious\
  \ Sales Value =\nCALCULATE (\nLASTNONBLANKVALUE ( DateTable[DATEKEY], [Total Sales]\
  \ ),\nDateTable[DATEKEY] < MAX ( DateTable[DATEKEY] )\n)\n```\n\n```\nSales Difference\
  \ =\n[Total Sales] - [Previous Sales Value]\n```\n\n由于我们在图 9-13 的表格视觉对象中使用了日期维度中的\
  \ `DATEKEY` 列，因此使用 `LASTNONBLANK` 和 `LASTNONBLANKVALUE` 的表达式将针对该列中的*每个*日期进行计算，无论该日期在\
  \ `Winesales` 表中是否有交易。然后，当你在表格视觉对象中填充“总销售额”度量值时，对于没有交易的日期，你将看到空白值。要解决此问题，请使用视觉级过滤器，并过滤“总销售额”度量值以排除空白值。\n\
  \n计算这些表达式的重要因素是使用 `CALCULATE` 来修改评估 `LASTNONBLANK` 和 `LASTNONBLANKVALUE` 的筛选上下文。表达式\
  \ `MAX (DateTable[DATEKEY])` 返回当前筛选上下文中的日期值，例如 **2017 年 1 月 7 日**；请参见图 9-14。`MAX`\
  \ 函数用于返回一个标量值。由于当前筛选上下文中只有一个日期，我们同样可以使用 `MIN` 或 `SUM`。因此，`CALCULATE` 的筛选参数的含义是“查找\
  \ `DateTable` 表的 `DATEKEY` 列中，早于 `MAX (DateTable[DATEKEY])` 返回的日期，但前提是该日期有销售值且不为空。”`LASTNONBLANK`\
  \ 函数返回此日期，即 **2017 年 1 月 3 日**。`LASTNONBLANKVALUE` 函数返回与此日期关联的销售值，**$10,560**。\n\
  \n![](img/523050_1_En_9_Fig14_HTML.jpg)\n\n**图 9-14** - 聚焦于 `LASTNONBLANK` 和 `LASTNONBLANKVALUE`\
  \ 表达式的计算\n\n然后，我们可以简单地从“总销售额”度量值中减去“上一笔销售值”度量值。\n\n### 查找两个日期之间的差异\n\n在 DAX 中查找两个日期之间的天数差异，其方式与\
  \ Excel 类似；只需将一个日期减去另一个日期。但是，在 DAX 中，你必须将日期嵌套在 `INT` 函数中，才能返回天数值，而不是返回一个日期：\n\n\
  ```\nDays Difference =\nINT ( [Date of Last Transaction] ) - INT ( [Date of First\
  \ Transaction] )\n```\n\nDAX 还具有与 Excel 中相同的 `DATEDIFF` 函数，用于查找周、月、年等之间的差异（请参见图\
  \ 9-15）。\n\n![](img/523050_1_En_9_Fig15_HTML.jpg)\n\n**图 9-15** - 计算两个日期之间的天数和月数\n\
  \n```\nMonths Difference =\nDATEDIFF ( [Date of First Transaction], [Date of Last\
  \ Transaction], MONTH )\n```\n\n希望我们对一些更常用的 DAX 时间智能函数的初步探索，能激发你对日期计算的兴趣。当然，还有许多其他时间智能函数我们在这里没有探讨，但你可能在数据分析中发现它们很有用，那么何不自己多探索一些这些有价值的\
  \ DAX 函数呢。你可以在此处找到所有函数：\n\n[`https://docs.microsoft.com/en-us/dax/time-intelligence-functions-dax`](https://docs.microsoft.com/en-us/dax/time-intelligence-functions-dax)\n\
  \n"
- '# 10. 空值与零


  在本章中，我们将探讨一个非常具体的 DAX 行为，即 DAX 如何处理空值、缺失值和 null 值。^( 10  )


  **注意**


  我们将在*计算列*的上下文中研究此行为，并且主要创建仅在此上下文中有效的表达式。但是，你必须理解，空值、缺失值和 null 值在 DAX *度量值*上下文中的行为完全相同，本章末尾的示例将对此进行说明。


  ## `BLANK()` 函数


  在 DAX 中，有一种特殊的方法来标识 null 或空值，那就是使用一个称为“blank”的值。要返回空白值，我们可以使用 `BLANK()` 函数，如下所示，该函数在
  `Winesales` 表中创建的一个计算列中使用（图 10-1）：


  ![](img/523050_1_En_10_Fig1_HTML.jpg)


  **图 10-1** - 使用 `BLANK()` 函数返回空白值


  ```

  10 Percent =

  IF ( Winesales[CASES SOLD] > 100,

  Winesales[CASES SOLD] * 0.1, BLANK () )

  ```


  当使用 `IF` 构造 DAX 表达式时，如果你想要在“值为假”参数时返回 `BLANK()`，你可以直接闭合括号，因为如果参数中未提供任何值，`BLANK()`
  是默认值。所以我们可以将前面的表达式重写为：


  ```

  10 Percent =

  IF ( Winesales[CASES SOLD] > 100,

  Winesales[CASES SOLD] * 0.1 )

  ```


  我们可以像下面的计算列中那样测试 null 或空白值：


  **注意**


  在示例 `.pbix` 文件中，按 `SALE DATE` 升序对 `Winesales` 表进行排序，以查看 `CASES SOLD` 列中的空白和零值。


  ```

  Blank? =

  IF ( Winesales[CASES SOLD] = BLANK(), "空白", "其他")

  ```


  请注意，对 `BLANK()` 的测试包括 **0**（零），所以我们永远不会对零得到“其他”（图 10-2）。


  ![](img/523050_1_En_10_Fig2_HTML.jpg)


  **图 10-2** - 测试空白包括零值


  然而，令人惊讶的是，反过来也是如此，因此在下面的计算列中，对 **0** 的测试包括空白值，所以我们再次不会对空白值得到“其他”（参见图 10-3）：


  ![](img/523050_1_En_10_Fig3_HTML.jpg)


  **图 10-3** - 测试零值包括空白


  ```

  Zero? =

  IF ( Winesales[CASES SOLD] = 0, "零", "其他")

  ```


  因此，我们可以看到，当在 `IF` 函数的谓词中使用时，DAX 将 `BLANK()` 和 **0**（零）视为相同的值，如前两个示例所示。




  ## ISBLANK 函数


  如果你想区分 `0` 和空值，应该怎么做？你可以使用一个 DAX 函数，它会“剔除”空值，将其与 `0` 区分开来。这个函数就是 `ISBLANK`，它在以下计算列中使用（如图
  10-4 所示）：


  ![](img/523050_1_En_10_Fig4_HTML.jpg)


  图 10-4：使用 ISBLANK 函数检测空值，而非零值


  ```

  是空值还是零？ =

  IF (

  ISBLANK ( Winesales[CASES SOLD] ),

  "空值",

  IF ( Winesales[CASES SOLD] = 0, "零", "其他" )

  )

  ```


  使用 `ISBLANK` 后，对于零值，我们现在会返回 `"零"`；对于空值，返回 `"空值"`；其他任何值则返回 `"其他"`。


  ## 检测零值


  如果你只想找出 `0`，可以使用这个计算列（如图 10-5 所示）：


  ![](img/523050_1_En_10_Fig5_HTML.jpg)


  图 10-5：检测零值


  ```

  是零吗？ =

  IF (

  NOT ( ISBLANK ( Winesales[CASES SOLD] ) )

  && Winesales[CASES SOLD] = 0,

  "零",

  "其他"

  )

  ```


  现在，我们仅在适当的条件下看到 `"零"`。


  ## 使用度量值查找空值和零值


  你也可以在 `ISBLANK` 内部使用度量值。例如，要找出有多少客户*没有*销售额，而不是 `0`（零）销售额，可以使用以下 DAX 表达式：


  ```

  无销售额的客户数 =

  COUNTROWS ( FILTER ( Customers, ISBLANK ( [总销售额] ) ) )

  ```


  而以下表达式会找出销售额为零*或*无销售额的客户数量：


  ```

  销售额为零或无销售额的客户数 =

  COUNTROWS ( FILTER ( Customers, [总销售额] = 0 ) )

  ```


  以下表达式会找出销售额为零的客户数量：


  ```

  销售额为零的客户数 =

  COUNTROWS (

  FILTER ( Customers, NOT ( ISBLANK ( [总销售额] ) )

  && [总销售额] = 0 )

  )

  ```


  你可以在图 10-6 的卡片视觉对象中看到这些度量值的应用。要在表格视觉对象中查看无销售额的客户，请使用 `"显示没有数据的项目"` 选项。


  ![](img/523050_1_En_10_Fig6_HTML.jpg)


  图 10-6：无销售额和销售额为零的客户


  因此，我们可以得出结论，使用以下表达式时必须谨慎：


  `"= IF ( [表达式] = 0 )"`


  因为它会将空值和零值都包含在内。


  ## 使用 COALESCE 函数


  通常需要将空值替换为另一个值，例如零。以下表达式可以实现此结果：


  ```

  若为空返回零 =

  If ( ISBLANK ( [总销售额] ), 0, [总销售额] )

  ```


  然而，在 2020 年 3 月，DAX 库中引入了一个新函数，那就是 `COALESCE` 函数，它为我们提供了更简洁的表达式，如下面两个例子所示：


  ```

  若为空返回零 =

  COALESCE([总销售额],0)

  ```


  ```

  若为空返回无销售额 =

  COALESCE([总销售额],"无销售额")

  ```


  该函数的第一个参数是你要查找空值的表达式，例如 `"总销售额"` 度量值。第二个参数是当表达式为空时，你希望返回的值，例如 `0` 或 `"无销售额"`，请参见图
  10-7。


  ![](img/523050_1_En_10_Fig7_HTML.jpg)


  图 10-7：使用 COALESCE 函数将空值替换为指定值


  在本章中，你已经了解到，除非你在表达式中特别使用 `ISBLANK` 函数来区分这两者，否则 DAX 将空值和零值视为相同。本章也是你在使用 DAX 中一些较难的部分（如使用
  `ALL` 计算百分比和使用时间智能计算滚动平均值）学习数据分析的艰辛过程中的一次有益的“休整”。


  在下一章中，我们将为接下来更复杂的表达式做好准备。你现在必须学习如何在代码中使用 DAX 变量，以便编写需要更高级 DAX 知识的度量值。


  脚注 1


  '
- "# 11. 使用变量：让我们的代码更具可读性\n\n到目前为止，我们在 DAX 代码中不使用变量也做得很好。实际上，变量在 DAX 语言中并非一直存在。它们是在\
  \ 2015 年引入的，也就是 DAX 首次开发五年之后。在本章中，我们将详细阐述为什么在编写 DAX 表达式时变量如此有用，一旦你学会了如何使用它们，我们将在后续的表达式中（在适用的情况下）包含它们。^(¹¹)\n\
  \n在你的 DAX 表达式中使用变量，可以帮助你编写更复杂的计算，随着本书的深入，我们将开始着手处理这些计算。使用变量有三个主要优点：\n\n1.  提高性能\n\
  2.  提高可读性\n3.  降低复杂度\n\n在本章中，我们将探讨在生成 DAX 代码时包含变量的这三个好处。我们还将研究变量的不可变性和常量的特性，以及它们何时可能是一种阻碍而非帮助。\n\
  \n要在代码中包含变量，请使用关键字 `VAR`，后跟变量名称，然后是变量的定义。然后在代码末尾使用关键字 `RETURN` 来返回要计算的表达式。例如：\n\n\
  ```\n示例度量值 =\nVAR 我的变量 = SUM (Winesales[CASES SOLD])\nRETURN\n我的变量 * 1.1\n```\n\n\
  变量声明通常在表达式的开头进行，其值在整个计算过程中保持不变。但是，你可以在表达式内部声明变量以限制其作用域。\n\n变量既可以在度量值中使用，也可以在计算列中使用，以获取由以下各项生成的值：\n\
  \n-   表达式，例如 `SUM ( Winesales[CASES SOLD] )`\n-   度量值，例如 `[总箱数]`\n-   表，例如 `FILTER\
  \ ( Winesales, Winesales[CASES SOLD] > 300 )`\n-   值，例如 `0.1`、`10`、`20`\n\n当变量在计算列中使用时，它们也可以获取列中生成的值。\n\
  \n变量名称不能包含空格，也不能使用保留字，例如 `\"date\"` 或 `\"min\"`。此外，合理的做法是变量名称不要与现有的表名或列名相同。有些人喜欢用下划线作为变量名的开头。\n\
  \n\n\n## 性能提升\n\n为了说明变量如何提升性能，我们来看一个度量值，该度量值根据 `CASES SOLD` 的值是否大于 20000 或 15000，分别计算其\
  \ 10% 或 5% 的数值。你可能编写的表达式如下：\n\n```\n10 PC or 5 PC =\nIF (\nSUM ( Winesales[CASES\
  \ SOLD] ) > 20000,\nSUM ( Winesales[CASES SOLD] ) * 0.1,\nIF (\nSUM ( Winesales[CASES\
  \ SOLD] ) > 15000,\nSUM ( Winesales[CASES SOLD] ) * 0.5,\nSUM ( Winesales[CASES\
  \ SOLD] )\n)\n)\n```\n\n这个表达式的问题在于，`SUM` 函数重复了五次，导致这些表达式被强制计算了五次。此外，使用嵌套的 `IF` 也相当笨拙。使用\
  \ `SWITCH` 函数替代嵌套的 `IF` 是一种小的改进：\n\n```\n10 PC or 5 PC #2 =\nSWITCH (\nTRUE (),\n\
  SUM ( Winesales[CASES SOLD] ) > 20000,\nSUM ( Winesales[CASES SOLD] ) * 0.1,\nSUM\
  \ ( Winesales[CASES SOLD] ) > 15000,\nSUM ( Winesales[CASES SOLD] ) * 0.5,\nSUM\
  \ ( Winesales[CASES SOLD] )\n)\n```\n\n这是我们第一次遇到 `SWITCH`，它的结构如下：\n\n`=SWITCH (\
  \ expression, value1, result1, value2, result2 etc…else )`\n\n注意，在 `SWITCH` 内部，`TRUE()`\
  \ 函数被用作待计算的表达式，然后列出布尔语句，后面跟着如果语句为真时要返回的值。最后一个参数是“否则”表达式。\n\n然而，尽管使用 `SWITCH` 的度量值写起来更简洁，但它并未在性能上带来显著提升，因为\
  \ `SUM` 函数仍然被多次求值。\n\n因此，现在我们通过使用关键字 `VAR` 来定义变量，并使用关键字 `RETURN` 来返回待计算的表达式，从而引入变量的使用，示例如下：\n\
  \n```\n10 PC or 5 PC #3 =\nVAR TotalCasesValue =\nSUM ( Winesales[CASES SOLD] )\n\
  RETURN\nSWITCH (\nTRUE (),\nTotalCasesValue > 20000, TotalCasesValue * 0.1,\nTotalCasesValue\
  \ > 15000, TotalCasesValue * 0.5,\nTotalCasesValue\n)\n```\n\n在这个表达式中，我们不仅避免了重复的\
  \ `SUM` 函数，而且总箱数的计算只会在变量声明时执行*一次*，而不会在每次测试中都重新计算。\n\n## 可读性提升\n\n变量也有助于澄清那些使用了嵌套度量值或嵌套表达式的公式，这些公式的可读性往往因嵌套而变得复杂。例如，考虑以下计算增长百分比的表达式。注意，第一个变量定义了一个*度量值*，第二个变量定义了一个*表达式*。变量和\
  \ `RETURN` 语句的使用使得表达式更容易理解：\n\n```\nGrowth % =\nVAR CurrentCases = [Total Cases]\n\
  VAR LastYrCases =\nCALCULATE ( [Total Cases], PREVIOUSYEAR (\nDateTable[DateKey]\
  \ ) )\nRETURN\nDIVIDE ( CurrentCases - LastYrCases, LastYrCases )\n```\n\n**注意**\n\
  \n由于该度量值使用了 `PREVIOUSYEAR` 函数，在使用该度量值的视觉对象中，必须已筛选出年份（例如，通过使用切片器）。\n\n变量不仅可以定义度量值和表达式，还可以定义表。在第\
  \ 7 章中，我们计算了高利润葡萄酒的数量，如下所示：\n\n```\nHigh-profit Wines =\nCALCULATE ( [No Of Sales],\n\
  FILTER ( Wines, Wines[PRICE PER CASE] >=\nWines[COST PRICE] * 3 ))\n```\n\n然而，我们可以使用一个变量来保存\
  \ `FILTER` 函数定义的表表达式，并将其用作 `CALCULATE` 内部的筛选参数。同样，使用 `RETURN` 语句极大地简化了表达式：\n\n```\n\
  High-profit Wines #1 =\nVAR TableOfWines =\nFILTER ( Wines, Wines[PRICE PER CASE]\
  \ >=\nWines[COST PRICE] * 3 )\nRETURN\nCALCULATE ( [No Of Sales], TableOfWines )\n\
  ```\n\n我们也可以在计算列中使用变量，例如，在 `IF` 的参数内部：\n\n```\nCases Sold Increase =\nVAR CasesSold\
  \ = Winesales[CASES SOLD]\nVAR MyValue1 = 1.1\nVAR MyValue2 = 1.2\nRETURN\nIF(CasesSold\
  \ > 100, CasesSold * MyValue1, CasesSold * MyValue2)\n```\n\n在后续章节中，当我们深入探讨更复杂的\
  \ DAX 表达式时，我们将看到更多关于变量如何在计算列上下文中发挥作用的例子。\n\n## 降低复杂度\n\n关于使用变量好处的下一个例子，是重温我们在第 7\
  \ 章探索 `FILTER` 函数时构建的一个计算。我们计算了 `CASES SOLD` 列中的值高于所有葡萄酒平均箱数的销售笔数。度量值如下：\n\n```\n\
  No. of Sales Where Cases is GT Avg All Wines =\nCALCULATE([No. of Sales],\nFILTER\
  \ (Winesales,\nWinesales[CASES SOLD] >= [Avg Cases All Winesales] ) )\n```\n\n这段代码的问题在于，它将\
  \ `Avg Cases All Winesales` 度量值嵌套在表达式中，因此该度量值必须已经存在于我们的模型中，我们在此上下文中使用的任何度量值也必须如此。我们可能需要不断在字段列表中定位这些度量值以编辑或调试它们，这会令人沮丧和烦恼。\n\
  \n更好的表达式应该使用两个变量，如下所示：\n\n```\nNo. of Sales Where Cases is GT Avg All Wines #2 =\n\
  VAR AvgAllWines =\nCALCULATE( AVERAGE ( Winesales[CASES SOLD] ) ,ALL ( Winesales\
  \ ) )\nVAR FilterAvgAll =\nFILTER ( Winesales, Winesales[CASES SOLD] >= AvgAllWines\
  \ )\nRETURN\nCALCULATE ( [No. of Sales], FilterAvgAll )\n```\n\n\n\n## 变量即常量\n\n\
  关于变量，还有最后一点非常重要：“变量”这个术语可能会产生误导。或许，如果把 DAX 变量称为“常量”，表述会更加准确，因为它们实际上就是常量。请看下面的表达式：\n\
  \n```\nSales for Abel =\nVAR MyAmount = [Total Sales]\nRETURN\nCALCULATE ( MyAmount,\
  \ SalesPeople[SALESPERSON] = \"abel\" )\n```\n\n从图 11-1 中我们可以看出，这个表达式返回的并非销售人员“Abel”的销售额，而仅仅是总销售额。\n\
  \n![](img/523050_1_En_11_Fig1_HTML.jpg)\n\n图 11-1\n\n变量的行为类似于常量，无法通过 `CALCULATE`\
  \ 修改\n\n原因在于，变量 `MyAmount` 在其声明的位置就被计算了，在本例中就是在其他任何代码之前。它随后*不会*也*不能*通过使用 `CALCULATE`\
  \ 修改筛选器来改变。这正是我们必须转而使用诸如 `CALCULATE` 内部的 `Total Sales` 这类度量值的原因。\n\n然而，变量的不可变性也是其优点。例如，设想这样一个场景：你希望找出销售额异常高的月份。你已经将异常高销售额定义为那些销售额大于当月总销售额\
  \ 5% 的交易。\n\n你可能会编写如下代码：\n\n```\nNo of Sales GT 5% Wrong =\nCALCULATE (\n[No of\
  \ Sales],\nFILTER (\nWinesales,\n[Total Sales] >  [Total Sales] * 0.05\n)\n)\n```\n\
  \n然而，这个度量值并未返回正确的结果。当在诸如 `FILTER` 函数这样的迭代器中使用时，`Total Sales` 度量值的值会计算 `Winesales`\
  \ 表中*每一行*的总销售额，而不是每个月的总销售额。因此，度量值 `No of Sales GT 5% Wrong` 计算的是销售额大于每一行（即每笔交易）销售额\
  \ 5% 的销售数量，从而返回了销售笔数；详见图 11-2。\n\n![](img/523050_1_En_11_Fig2_HTML.jpg)\n\n图 11-2\n\
  \n`No of Sales GT 5% Wrong` 度量值返回了销售笔数\n\n这个表达式使用了我们将在后面章节中遇到的上下文转换概念，但即便如此，直观理解上，如果\
  \ `FILTER` 在迭代 `Winesales` 表，它必然是一行一行地扫描该表。\n\n正确的表达式必须计算当前筛选上下文中的总销售额，即每个月的总销售额，这个上下文已经被\
  \ `FILTER` 的迭代所丢失。为了重新应用这个筛选器，`CALCULATE` 可以使用放置在 `Winesales` 表上的筛选器，即使对有经验的 DAX\
  \ 用户来说，编写这段代码也是一个挑战：\n\n```\nNo of Sales GT 5% Difficult =\nCALCULATE (\n[No of\
  \ Sales],\nFILTER (\nWinesales,\n[Total Sales] > CALCULATE ( [Total Sales], Winesales\
  \ ) * 0.05\n)\n)\n```\n\n这个度量值被称为“困难”表达式，因为它使用了我们尚未遇到的两个具有挑战性的 DAX 概念：上下文转换和表扩展。然而，得知你并不需要这些高级知识就能得出正确的计算结果，或许会让你松一口气。你可以转而使用变量，这会使表达式变得非常简单：\n\
  \n```\nNo of Sales GT 5% Easy =\nVAR PerCentToFind = [Total Sales] * 0.05\nRETURN\n\
  CALCULATE ( [No of Sales],\nFILTER ( Winesales, [Total Sales] > PerCentToFind )\
  \ )\n```\n\n这个“简单”表达式使用一个变量来计算 `Total Sales` 度量值的 5%，这个计算会首先执行并保持恒定。然后，该变量被用来计算每个月总销售额大于该变量存储值的销售笔数。\n\
  \n这个故事的寓意是什么？让我们对变量心存感激吧！\n\n## 返回当前筛选中的值\n\n在设计报表时，经常需要显示在切片器或“筛选器”窗格中选择的值。这可能是为了使用条件格式在视觉对象的标题中显示这些值，或者像图\
  \ 12-1 所示，在卡片视觉对象中显示它们。\n\n![](img/523050_1_En_12_Fig1_HTML.jpg)\n\n图 12-1\n\n显示当前筛选上下文中的值\n\
  \n如果你有此目标，我们有三个 DAX 函数可以胜任：`SELECTEDVALUE`、`CONCATENATEX` 和 `VALUES`。在本章中，我们将探讨如何使用这些函数来返回筛选选择。你将学习如何为视觉对象生成动态标题，以标示其中筛选出的数据。然而，本章还将介绍*参数表*的概念，这是一种与模型中其他表无关联的表，用于捕获用户选择的值。然后，这些值可以在你的计算中被动态使用。\n\
  \n`SELECTEDVALUE` 和 `CONCATENATEX` 函数属于返回标量值的函数类别，它们可以返回数值或文本值。因此，说度量值只返回标量值并不准确，因为那会暗示它们只能返回数值。使用这两个函数中的任何一个的度量值通常会返回一个文本值。`VALUES`\
  \ 函数比较特殊，因为它既可以返回标量值，也可以返回表，因此，我们将推迟到本章末尾再讨论这个函数。\n\n你已经知道，度量值必须返回一个*单一*值，无论是数值还是文本，`SELECTEDVALUE`\
  \ 和 `CONCATENATEX` 也不例外。`SELECTEDVALUE` 函数会返回当前筛选上下文中的值，但前提是只有一个值需要返回。然而，有时筛选上下文包含多个值，例如当我们在切片器中进行了多项选择时，那么在这种情况下，我们如何返回这些值呢？\n\
  \n如果需要返回筛选上下文中的多个值，我们必须使用另一个函数：`CONCATENATEX`。这个函数属于你在第 5 章中学过的“X”组迭代函数。为了返回单一值，使用\
  \ `CONCATENATEX` 的度量值会将当前筛选上下文中的多个值连接起来，从而返回一个单一的文本字符串。\n\n因此，我们有两个函数 `SELECTEDVALUE`\
  \ 和 `CONCATENATEX`，其中一个是迭代器，它们彼此间差异很大。然而，它们用于相同的目的，即标记已被切片器或筛选器选择过滤掉的项目。现在，让我们先看看第一个函数：`SELECTEDVALUE`。\n\
  \n\n\n## SELECTEDVALUE 函数\n\n`SELECTEDVALUE` 函数在指定列中仅有一个值时返回筛选上下文中的值，否则返回替代结果。其语法如下：\n\
  \n`= SELECTEDVALUE(列名, 替代结果)`\n\n其中：\n\n- `列名` 是你要从中查找值的列。\n- `替代结果`（可选）是当列被筛选为多个非重复值或没有值时返回的值。未提供时，默认值为\
  \ `BLANK()`。\n\n以下是 `SELECTEDVALUE` 语法的示例：\n\n`= SELECTEDVALUE(Wines[TYPE], \"多种\"\
  )`\n\n在深入探讨该函数之前，我们需要先回顾一下“当前筛选上下文”的含义。请考虑以下度量值：\n\n```\nTotal Cases =\nSUM ( Winesales[CASES\
  \ SOLD] )\n```\n\n![](img/523050_1_En_12_Fig2_HTML.jpg)\n\n图 12-2 – 用于计算“Total Cases”度量值的筛选条件同时作用于\
  \ `SALESPERSON` 和 `WINE` 列\n\n图 12-2 中的视觉对象包含按 `SALESPERSON` 和 `WINE` 列筛选的“Total\
  \ Cases”度量值。在首次计算 **8,531** 箱时，存在对销售员“Abel”和葡萄酒“Bordeaux”的筛选。然而，我们将重点关注来自切片器的 `WINE`\
  \ 列上的筛选。如果我们能看到 `Wines` 维度上的筛选，它看起来会像图 12-3 那样，即表已被筛选为仅剩一行。\n\n![](img/523050_1_En_12_Fig3_HTML.jpg)\n\
  \n图 12-3 – 切片器将 `Wines` 维度筛选为仅剩一行\n\n我们知道，该筛选与 `SalesPeople` 维度上的筛选一起传播到事实表，这两个筛选共同构成了当前筛选上下文。\n\
  \n通常，报告画布上会有许多切片器，而报告用户并不总能清楚自己点击了哪些切片器。如果我们能像图 12-4 那样向用户提供这些信息，将会很有帮助。\n\n![](img/523050_1_En_12_Fig4_HTML.jpg)\n\
  \n图 12-4 – 告知用户切片器选择情况\n\n这正是 `SELECTEDVALUE` 函数能够发挥作用的地方。你可以在图 12-4 中看到，切片器中选择的葡萄酒同时显示在表格视觉对象的标题（通过条件格式）和卡片视觉对象中。这是我们在这些示例中使用的度量值：\n\
  \n```\nWine Selected =\n\"You have selected \" & SELECTEDVALUE ( Wines[WINE] )\n\
  ```\n\n此示例使用 `SELECTEDVALUE` 函数返回当前筛选上下文中 `WINE` 列的值。这也是我们首次在 DAX 表达式中使用与号（`&`）。如同\
  \ Excel，与号是 DAX 的串联运算符，用于将 DAX 表达式的各部分连接成字符串。\n\n> **注意**：如果你需要有关在视觉对象标题中使用条件格式的帮助，请点击此链接：[`docs.microsoft.com/en-us/power-bi/create-reports/desktop-conditional-format-visual-titles`](https://docs.microsoft.com/en-us/power-bi/create-reports/desktop-conditional-format-visual-titles)\n\
  \n但如果切片器中选择了多个值，该怎么办？如下所示，一种方法是使用 `CONCATENATEX`，但还有另一种更简单的解决方案，因为 `SELECTEDVALUE`\
  \ 函数允许你在选择了多个项目时提供替代结果，如下所示：\n\n```\nWine Selected #2 =\n\"You have selected \"\
  \ &\nSELECTEDVALUE ( Wines[WINE],\"多种葡萄酒\" )\n```\n\n然而，由于 `SELECTEDVALUE` 的“替代结果”参数会在有*多个*选择或*没有*选择时都生效，因此我们会遇到一个问题。你会注意到，如果切片器中未选择任何内容，表格视觉对象的标题和卡片视觉对象仍会提示你选择了多种葡萄酒（图\
  \ 12-5）！\n\n![](img/523050_1_En_12_Fig5_HTML.jpg)\n\n图 12-5 – “替代结果”在无选择和多选时都会显示\n\
  \n避免此问题的一种方法是，在切片器设置的格式卡片中启用“单选”，从而确保用户无法进行多选或留空。另一种方法是使用 `CONCATENATEX`，我们将在本章后面介绍。\n\
  \n`SELECTEDVALUE` 函数还允许你测试当前筛选中的特定值。在图 12-6 中，如果切片器中选择的葡萄酒的 `PRICE PER CASE` 值大于\
  \ 75 美元，卡片视觉对象将显示“昂贵葡萄酒”；否则显示“便宜葡萄酒”。\n\n![](img/523050_1_En_12_Fig6_HTML.jpg)\n\
  \n图 12-6 – 使用 `SELECTEDVALUE` 测试当前筛选中的值\n\n这是图 12-6 中使用的表达式：\n\n```\nHigh Price\
  \ =\nIF (\nSELECTEDVALUE ( Wines[PRICE PER CASE] ) > 75,\n\"Expensive Wine\",\n\"\
  Cheap Wine\"\n)\n```\n\n这里需要注意的是，使用 `SELECTEDVALUE` 时，你可以选择被筛选行中*任意*列的值，而不仅限于用作切片器的列。\n\
  \n然而，当用户在切片器中选择多个值时，我们仍然会面临问题。你可能不希望使用切片器中的“单选”，而是希望能够选择多个项目并将这些项目列在表格或卡片视觉对象中。我们还看到，当没有选择时，`SELECTEDVALUE`\
  \ 的“替代结果”也会显示，与多选时一样。现在，让我们看看如何通过使用 `CONCATENATEX` 函数来解决这个问题。\n\n\n\n## CONCATENATEX\
  \ 函数\n\n我们知道，任何以“X”结尾的函数都是迭代函数，`CONCATENATEX` 也不例外。它会迭代第一个参数中引用的表，然后连接第二个参数中引用的列的值。具体来说，`CONCATENATEX`\
  \ 函数具有以下参数：\n\n`= CONCATENATEX( table, expression, delimiter, order by, order )`\n\
  \n其中：\n\n- **table** 是要迭代的表。\n- **expression** 是您要为**table**中的每一行连接其值的列（或表达式）。\n\
  - **delimiter** 是用于分隔值的字符，例如逗号或与符号（&）。\n- **order by**（可选）通常是您想要对值进行排序的列。\n- **order**（可选）是\
  \ `ASC` 或 `DESC`。\n\n现在让我们看一个使用 `CONCATENATEX` 的表达式示例：\n\n```\nTypes of Wine =\n\
  CONCATENATEX ( Wines, Wines[WINE] , \", \" , Wines[WINE ID], ASC )\n```\n\n在此度量值中，`CONCATENATEX`\
  \ 迭代 `Wines` 表，并针对表中的每一行，返回 `WINE` 列中的值连接而成的列表，这些值以逗号分隔，并按 `WINE ID` 升序排序。在图 12-7\
  \ 中，您可以看到当 `Wines` 表的 `TYPE` 列被放置在表视觉对象中时，此表达式返回的值。“Types of Wine”度量值显示其类型（即 Red\
  \ 或 White）旁边的所有葡萄酒，用逗号分隔，并按 `WINE ID` 列升序排序。\n\n![](img/523050_1_En_12_Fig7_HTML.jpg)\n\
  \n**图 12-7** “Types of Wine”度量值返回的值\n\n我们可以仅使用前三个参数，并将此度量值放置在卡片视觉对象中，使用切片器按 `WINE`\
  \ 列进行筛选：\n\n```\nTypes of Wine #1 =\nCONCATENATEX (\nWines, Wines[WINE] ,\n\", \"\
  \ )\n```\n\n在这里，`CONCATENATEX` 将简单地返回当前筛选器中的所有葡萄酒名称；参见图 12-8。至此，我们终于解决了在选择了多个项目时显示切片器选择的问题。\n\
  \n![](img/523050_1_En_12_Fig8_HTML.jpg)\n\n**图 12-8** 卡片视觉对象中按 WINE 切片后的“Types of\
  \ Wine #1”度量值\n\n然而，我们还没有完全达到目标。如果切片器中没有选择，卡片视觉对象将返回所有葡萄酒名称，这很可能不是您想要的。要解决这个问题，我们需要进一步优化我们的“Types\
  \ of Wine #1”表达式。\n\n在图 12-9 中，我们使用条件格式在表视觉对象的标题中使用了两个相似的度量值：“Types of Wine #2”和“Types\
  \ of Wine #3”。这两个度量值都返回短语“Sales by Wine, filtered by”，并且葡萄酒列表会随着选择的增加而增加。为了避免视觉对象中充斥着大量葡萄酒名称，当选中超过三种葡萄酒时，“Types\
  \ of Wine #3”会显示“and More”。当切片器*没有*选择时，视觉对象的标题会显示“Sales by Wine”，而不是像使用 `SELECTEDVALUE`\
  \ 的度量值那样显示“you have selected multiple wines”。\n\n![](img/523050_1_En_12_Fig9_HTML.jpg)\n\
  \n**图 12-9** 使用 CONCATENATEX 解决多选和未选择的问题\n\n因此，使用 `CONCATENATEX`，我们为所有四种问题场景提供了解决方案：\n\
  \n1. 切片器中无选择\n2. 切片器中有选择\n3. 选择了三种或更少葡萄酒\n4. 选择了超过三种葡萄酒\n\n解决场景 #1 和 #2 所需的度量值相对简单。但是，我们需要扩展此表达式以适应场景\
  \ #3 和 #4，而这也正是表达式变得稍显复杂的地方。因此，让我们先处理用户在选择切片器中做出选择或没有任何选择的情况。\n\n要解决此场景，我们构建的度量值必须返回以下两者之一：\n\
  \n1.  如果切片器中没有选择，则返回“Sales of Wines”\n2.  返回“Sales of Wines filtered by”，后跟切片器中选择的葡萄酒列表\n\
  \n因此，我们需要一种方法来确定对 `WINES` 列的筛选器是否减少了 `Wines` 维度表中的行数。如果是，则切片器中必须存在选择。如果不是，则切片器中必定没有选择。我们可以在这里使用名为\
  \ `VALUES` 的函数，它会生成一个虚拟的单列表，列出当前筛选上下文中的 `WINE` 列的值。然后，我们可以使用 `ALL` 函数返回另一个包含所有葡萄酒名称的虚拟单列表。如果这两个表的行数相同，那么切片器中必定没有选择。\n\
  \n> **注意：** 我们将在本章后面深入探讨 `VALUES` 函数。\n\n以下是我们构建的表达式。注意使用变量来捕获 `COUNTROWS` 返回的值：\n\
  \n```\nTypes of Wine #2 =\nVAR NoFilteredWines =\nCOUNTROWS (  VALUES ( Wines[WINE]\
  \ ) )\nVAR  NoAllWines=\nCOUNTROWS ( ALL( Wines[WINE] ))\nRETURN\nIF ( NoFilteredWines\
  \ = NoAllWines ,\n\"Sales by Wine\",\n\"Sales by Wine, filtered by \"\n&\nCONCATENATEX\
  \ (\nWines, Wines[WINE] ,\n\", \" ) )\n```\n\n现在让我们将注意力转向解决用户在切片器中选择超过三种葡萄酒的场景。如果用户选择三种或更少的葡萄酒，或者没有选择葡萄酒，则该度量值的返回值与“Types\
  \ of Wine #2”相同。但是，如果用户选择了四种或更多种葡萄酒，我们希望度量值返回所选前三种葡萄酒的列表，后跟“and more…”。因此，我们需要生成一个列表，其中仅包含切片器中选择的前三种葡萄酒名称。我们可以使用名为\
  \ `TOPN` 的表函数来完成此任务。顾名思义，`TOPN` 将构建一个虚拟表，其中仅包含前 N 个（例如，3 个）值，如以下表达式所示：\n\n`TOPN\
  \ ( 3, VALUES ( Wines[WINE] ))`\n\n再次注意 `VALUES` 函数是如何用于生成一个单列表，列出当前筛选上下文中的葡萄酒名称的。`TOPN`\
  \ 函数将提取这些葡萄酒名称中的前三个，放入其自身的表中，然后由 `CONCATENATEX` 连接这些值。然后，我们可以使用与符号（&）连接“and more…”。\n\
  \n您可以看到以下表达式将解决我们的最终场景。我们需要做的就是添加 `IF` 函数来执行 `TOPN` 表达式，然后将 `TOPN` 表达式本身添加到代码的底部（以灰色高亮显示）：\n\
  \n```\nTypes of Wine #3 =\nVAR NoFilteredWines =\nCOUNTROWS (  VALUES ( Wines[WINE]\
  \ ) )\nVAR  NoAllWines=\nCOUNTROWS (ALL ( Wines[WINE]))\nRETURN\nIF ( NoFilteredWines\
  \ = NoAllWines ,\n\"Sales by Wine\",\n\"Sales by Wine, filtered by \"\n&\nIF ( NoFilteredWines\
  \ <=3,\nCONCATENATEX (\nWines ,\nWines[WINE] ,\n\", \") ,\nCONCATENATEX (\nTOPN\
  \ ( 3, VALUES ( Wines[WINE] )),\nWines[WINE] ,\n\", \")\n& \" and more...\"\n))\n\
  ```\n\n在构建这些度量值的过程中，您学习了如何使用 `CONCATENATEX` 将切片器选择串连起来。同时，这也是一个关于使用表函数和表表达式来生成虚拟内存中表的宝贵练习，这些表随后在表达式中被使用。这个概念是\
  \ DAX 的核心，即构建包含标量函数所用值的临时表。在此也值得指出，度量值“Types of Wine #3”在复杂程度上比您迄今为止在本书中遇到的所有内容都要高出一个数量级，但您现在已具备编写此类复杂代码的技能。\n\
  \n我们还介绍了 `SELECTEDVALUE` 函数的细节，现在我们将重新聚焦于它。这是因为我们可以更好地利用它，而不仅仅是提醒用户在切片器中选择了什么。我们知道\
  \ `SELECTEDVALUE` 会返回单个值，通过这种方式，我们可以使用此函数来获取*无关表*中列的特殊值。这些无关表有一个名字，叫做*参数表*，我们现在就来探讨其用法。\n\
  \n\n\n## 使用参数表\n\n你可以使用 `SELECTEDVALUE` 返回用户选择的参数。这个选定的参数随后可在度量值中作为数值使用。\n\n请查看图\
  \ 12-10 中的表格可视化对象。此处我们有一个切片器，允许我们为“总销售额”度量值选择一个销售预测方案，具体如下：\n\n- “最佳情况”（增长 20%）\n\
  - “可能情况”（增长 10%）\n- “最差情况”（下降 10%）\n\n“假设情景”度量值随后会根据所选方案相应计算总销售额。\n\n![图 12-10](img/523050_1_En_12_Fig10_HTML.jpg)\n\
  \n*图 12-10 – 使用参数表分析销售预测方案*\n\n要创建这些方案，我们使用了“开始”选项卡上的“**输入数据**”按钮，并创建了名为“假设”的表格，如图\
  \ 12-11 所示。\n\n![图 12-11](img/523050_1_En_12_Fig11_HTML.jpg)\n\n*图 12-11 – “假设”参数表*\n\
  \n请注意，在图 12-11 中，该表与数据模型中的任何其他表都没有关系。我们现在需要在画布上放置一个切片器，其数据源为“假设”表中的 `Scenario` 列，然后我们就可以创建如下度量值：\n\
  \n```\n假设情景 =\n[总销售额] * SELECTEDVALUE ( '假设'[Value] )\n```\n\n当我们从“情景”切片器中选择一个值，例如“可能情况”时，该值会在“假设”表中被筛选出来。“假设”表中只有一行数据，`Value`\
  \ 列中的值便用于乘以“总销售额”度量值。\n\n你已经学会了如何构建参数表，并通过使用 `SELECTEDVALUE` 来构建表达式，以测试从参数表中选定的特定值。一旦掌握这一方法，你就可以利用所选的值来驱动特定的计算。让我们看一个例子。你可能已经发现，在\
  \ Power BI 中操作的一个不便之处是，你只能将列值填充到切片器中。然而，经常出现这样的问题：我能否将度量值放入切片器？答案是：当然可以！请查看图 12-12。\n\
  \n![图 12-12](img/523050_1_En_12_Fig12_HTML.jpg)\n\n*图 12-12 – 为度量值创建切片器*\n\n此处，我们有一个列出了三个度量值的切片器。当在切片器中选择一个度量值时，表格可视化对象中的“要显示的度量值”会计算出所选度量值。\n\
  \n要构建这个示例，我们同样首先创建参数表，并将其命名为“选择度量值”。该表包含两列。名为 `Measure` 的列列出了度量值，但请注意这些名称是任意的；你不必使用确切的度量值名称。第二列名为\
  \ `Value`，它为 `Measure` 名称分配了一个值。与所有参数表一样，此表与模型中的任何其他表都没有关系；请参见图 12-13。\n\n![图 12-13](img/523050_1_En_12_Fig13_HTML.jpg)\n\
  \n*图 12-13 – “选择度量值”参数表*\n\n然后在画布上放置了一个切片器，其数据源为“选择度量值”表中的 `Measure` 列。\n\n以下是“要显示的度量值”的表达式：\n\
  \n```\n要显示的度量值 =\nSWITCH (\nSELECTEDVALUE ( '选择度量值'[Value] ),\n1, [总销售额],\n2, [总箱数],\n\
  3, [销售数量]\n)\n```\n\n请注意这里使用了 `SWITCH` 函数来代替 `IF`，但两者都可以完成任务。随后，该度量值与葡萄酒表中的 `WINE`\
  \ 列一同被放入表格可视化对象中。\n\n## VALUES 函数\n\n我一度犹豫是否要将 `VALUES` 函数收录到本书中，因为近年来，它的需求在很大程度上已被\
  \ `SELECTEDVALUE` 函数所取代。然而，我改变主意的原因是，如果你是一名 DAX 用户，即使很少用到它，也应该了解并理解 `VALUES` 函数。\n\
  \n在 2017 年 `SELECTEDVALUE` 函数出现之前，`VALUES` 是主要的 DAX 函数之一。正因如此，你在浏览他人编写的代码时会遇到 `VALUES`\
  \ 函数，因此，了解该函数在表达式中的用途不失为一个好主意。此外，这两个函数——`SELECTEDVALUE` 和 `VALUES`——并不能互换；有时只能使用\
  \ `VALUES`。事实上，我们在探索 `CONCATENATEX` 时就已经使用过 `VALUES` 函数。\n\n`VALUES` 在你想将*列*引用转换为*表*引用，或者想重新应用“丢失”的筛选器时尤其有用。\n\
  \n该函数的语法非常简单。在函数内部，你可以引用一个表或一个列：\n\n```\n= VALUES ( 表名 或 列名 )\n```\n\n以下是 `VALUES`\
  \ 语法的两个示例；第一个引用表，第二个引用列：\n\n```\n= VALUES ( 葡萄酒 )\n```\n\n```\n= VALUES ( 葡萄酒[WINE]\
  \ )\n```\n\n该函数是一个*表函数*，并返回一个虚拟表，具体情况如下：\n\n- 当输入参数为列名时，它返回一个单列表，该表包含指定列中*在当前筛选上下文中*的非重复值。重复值会被移除，仅返回唯一值。\n\
  - 当输入参数为表名时，它返回一个表，该表包含指定表中*在当前筛选上下文中*的行，并且重复行会被保留。\n\n尽管 `SELECTEDVALUE` 在很大程度上取代了\
  \ `VALUES`，但它们是两个完全不同的函数。`SELECTEDVALUE` 是一个标量函数，会返回单个值。因此，在 `SELECTEDVALUE` 内部，你只能引用所需标量值所在的列名。而\
  \ `VALUES` 函数被描述为一个表函数，在 `VALUES` 内部，你可以引用列名或表名。如果在 `VALUES` 中引用列名，该列会被转换为一个表，从而允许你将列用作表表达式。由于这是使用该函数的好处之一，`VALUES`\
  \ 更常用于列引用，并且这也是本节将重点介绍的 `VALUES` 的行为。\n\n\n\n### 表函数还是标量函数？\n\n然而，如果 `SELECTEDVALUE`\
  \ 返回的是标量值，而 `VALUES` 返回的是表，那么 `VALUES` 如何能被 `SELECTEDVALUE` 替代呢？这正是 `VALUES` 函数的有趣之处，因为尽管它被描述为一个表函数，但\
  \ `VALUES` 既可以返回一个表，*也可以返回一个标量值*。\n\n原因在于，当 DAX 表表达式返回一个*单列单行表*时，DAX 引擎会将其从表转换为标量值（回想一下，`LASTNONBLANK`\
  \ 函数也表现出这种行为；请参见第 9 章）。此时 `VALUES` 就改变了其性质，从返回表切换到返回标量值。\n\n现在我们可以探讨一个展示此行为的示例。\n\
  \n**注意**\n\n以下使用 `VALUES` 和 `SELECTEDVALUE` 函数的 DAX 度量示例仅用于解释说明。我们编写的度量会返回已经放入视觉对象的葡萄酒名称，显然，这些计算没有任何实际目的。我们使用这些特定表达式的原因，是为了更直观地解释\
  \ `VALUES` 函数的工作原理。后续我们会将 `VALUES` 函数应用于更实际、更有益的场景。\n\n考虑以下表达式，它将返回一个单列表，其中包含当前筛选上下文中的葡萄酒名称。\n\
  \n```\nValues Wine = VALUES ( Wines[Wine] )\n```\n\n在将此度量放入表视觉对象之前，我们必须先关闭视觉对象的“总计”行（原因我们稍后会解释）^(¹³)。当该度量被放入视觉对象时，它会返回当前筛选器中\
  \ `WINE` 列的值；见图 12-14。\n\n![](img/523050_1_En_12_Fig14_HTML.jpg)\n\n**图 12-14**\
  \ `VALUES` 函数返回当前筛选上下文中的值\n\n对“Values Wine”度量的求值没有产生错误，因此 `VALUES` 表现得就像一个标量函数（请记住，所有度量都必须返回标量）。我们可以看看这是如何实现的。在第一次对“Bordeaux”葡萄酒求值时，`VALUES`\
  \ 表达式创建了一个虚拟表，其中包含当前筛选中 `WINE` 列的唯一值列表。因此，它生成了一个*包含值“Bordeaux”的单列单行表*。如果能直观地看到这个表，它很可能就像图\
  \ 12-15 中所示的包含单个值的表。\n\n![](img/523050_1_En_12_Fig15_HTML.jpg)\n\n**图 12-15** `VALUES`\
  \ 生成的单列单行表\n\n此表包含一个可以转换为标量的单一值，这就是它能成功用于“Values Wine”度量的原因。\n\n然而，现在让我们恢复表视觉对象中的“总计”行。当我们这样做时，该度量将返回一个错误，如图\
  \ 12-16 所示。\n\n![](img/523050_1_En_12_Fig16_HTML.jpg)\n\n**图 12-16** 当 `VALUES`\
  \ 函数对“总计”行求值时返回错误\n\n错误消息显示：\n\n> *“提供了一个多值表，但期望的是单个值。”*\n\n为什么在显示“总计”行时会出现此错误，而不显示时却没有？当对“总计”行求值\
  \ DAX 表达式时，`VALUES` 返回的不再是单个值，而是*所有*葡萄酒名称都处于筛选上下文中。因此，`VALUES` 函数将返回一个包含 `WINE`\
  \ 列所有值的虚拟表。这就是错误消息所指的“多值表”（图 12-17）。\n\n![](img/523050_1_En_12_Fig17_HTML.jpg)\n\
  \n**图 12-17** `VALUES` 在对“总计”行求值时返回“多值表”\n\n因此，我们可以推断出问题出在对“总计”行的求值上，因为你无法将多个值放入“总计”行的“单元格”中。这就是为什么在图\
  \ 12-14 的表视觉对象中，我们必须移除“总计”行才能让表达式正常工作。但是，你可能会觉得这有点变通，或许希望在某个时候能显示度量的“总计”行值。\n\n\
  为了解决这个问题，与其从视觉对象中移除“总计”行，不如让 DAX 区分对每个葡萄酒的求值和对“总计”行的求值。为此，我们必须使用一个 DAX 函数，该函数在当前筛选上下文中只有一个值时返回\
  \ `TRUE`。它的名字毫不意外是 `HASONEVALUE`。以下是所需的表达式：\n\n```\nValues Wine =\nIF ( HASONEVALUE\
  \ ( Wines[WINE] ),\nVALUES ( Wines[WINE] ),\n\"All Wines\" )\n```\n\n但是，前面的表达式难道不是和下面这个返回相同的值吗？\n\
  \n![](img/523050_1_En_12_Fig18_HTML.jpg)\n\n**图 12-18** `VALUES` 函数返回与 `SELECTEDVALUE`\
  \ 函数相同的值\n\n```\nSelected Value Wine =\nSELECTEDVALUE ( Wines[WINE], \"All Wines\"\
  \ )\n```\n\n嗯，是的，确实如此（图 12-18），并且由于 `VALUES` 表达式更复杂，你可能会更倾向于使用 `SELECTEDVALUE`。每当你使用\
  \ `VALUES` 来返回标量值时，都可以改用 `SELECTEDVALUE`。更重要的是，使用 `SELECTEDVALUE` 时，你无需考虑筛选上下文中是否只有一个值，因为这一点已隐含在“备用结果”参数中了。\n\
  \n你可能会想，既然葡萄酒名称已经作为视觉对象的第一列存在了，为什么还要用 `SELECTEDVALUE` 或 `VALUES` 来返回它们呢？\n\n\n\n\
  ### 替换“丢失的筛选器”\n\n你可能会觉得这些示例虽然解释了 `VALUES` 的工作原理，但并非“实际”计算。不过，你现在已经了解了 `VALUES`\
  \ 函数的作用，即它可以返回一个表或一个标量值。我们需要找到 `VALUES` 的更好用途，以及一个无法用 `SELECTEDVALUE` 替代的场景。`VALUES`\
  \ 函数的一个更好示例是将其用作表函数，而不是返回标量值。我们来看看下一个场景。\n\n使用切片器进行筛选的一个问题是，你会丢失原始的未筛选值。克服此问题的一种方法是使用两个视觉对象，然后使用“编辑交互”，使一个切片器仅筛选其中一个视觉对象，而另一个不受影响（图\
  \ 12-19）。\n\n![图 12-19](img/523050_1_En_12_Fig19_HTML.jpg)\n\n**图 12-19** 使用“编辑交互”可以防止切片器筛选某个视觉对象\n\
  \n然而，我们希望有一个视觉对象能同时保留未筛选的值和筛选后的值，如图 12-20 所示。以下是“总销售额（未筛选）”度量的 DAX 表达式：\n\n![图 12-20](img/523050_1_En_12_Fig20_HTML.jpg)\n\
  \n**图 12-20** 一个表视觉对象，其中“总销售额（未筛选）”度量忽略了切片器筛选器\n\n```\n总销售额（未筛选） =\nCALCULATE (\
  \ [总销售额],\nALL ( Winesales ),\nVALUES ( Wines[WINE] )\n)\n```\n\n现在，让我们更详细地分析“总销售额（未筛选）”度量。`CALCULATE`\
  \ 的第一个筛选参数是 `ALL` 函数，它作为一个修饰符，移除来自 `WINE` 列和 `SALESPERSON` 列的对 `Winesales` 事实表的任何交叉筛选。在第二个筛选参数中，`VALUES`\
  \ 用于构建一个虚拟的单列单行表，该表包含当前筛选上下文中的葡萄酒名称，例如，第一次评估时为“Bordeaux”。这相当于 `Wines[WINE] = \"\
  Bordeaux\"`。然后，`CALCULATE` 将此新筛选器应用于 `Winesales` 表，该表会据此重新筛选。最终结果是，`WINE` 列上有一个筛选器，但\
  \ `SALESPERSON` 列上不再有筛选器，因此，我们会看到每种葡萄酒对应所有销售人员的销售额。当度量计算总计行时，它会构建一个包含所有葡萄酒名称的虚拟单列表，用作筛选器。\n\
  \n然而，以下表达式是达到相同结果的另一种方式：\n\n```\n总销售额（未筛选）#2 =\nCALCULATE ( [总销售额], ALL ( Winesales\
  \ ), Wines )\n```\n\n在此度量中，我们引用了整个 `Wines` 表作为筛选器，而不是使用 `VALUES` 来生成虚拟的单列表。我们可以这样做，因为\
  \ `Wines` 表已被筛选为单行（或者在评估总计行时为所有行），并且整个表可以用作表表达式。\n\n这是我们第一次在 `CALCULATE` 的筛选参数中引用一个表，而不是一个表*表达式*，稍后我们还会再次这样做。请记住，`Wines`\
  \ 表将包含当前筛选上下文中的葡萄酒所在单行，或者在评估总计行时包含 `Wines` 表的所有行。这个表达式可能更好，因为我们不需要再嵌套另一个函数。\n\n\
  ### 将列转换为表\n\n我们已经确定 `VALUES` 函数是一个值得加入 DAX“工具箱”的有用函数，尽管你通常可以使用 `SELECTEDVALUE`\
  \ 代替。在处理 DAX 时，你会发现 `VALUES` 更常用于列引用，因为它的主要用途之一是将列转换为表。例如，这个表达式：\n\n`= Wines[WINE]`\
  \ 是一个*列*，\n\n而这个表达式：\n\n`= VALUES ( Wines[WINE] )` 是一个*表*。\n\n我们稍后会在本书中介绍 `TREATAS`\
  \ 函数时，探讨以这种方式使用 `VALUES`。\n\n凭借其既可返回表又可返回标量值的双重特性，特别是在将列转换为表方面的能力，`VALUES` 是一个非常值得了解的函数。\n\
  \n在本章中，我们探讨了三个函数：`SELECTEDVALUE`、`CONCATENATEX` 和 `VALUES`，它们允许你使用当前筛选器中的值或多个值。你了解到，通过创建参数表，你可以获取这些值并在\
  \ DAX 表达式中使用。但不仅如此，在使用 `CONCATENATEX` 时，你明白了如何通过使用变量来保存这些函数返回的值，以便稍后在表达式中引用它们。你还成功生成了多个临时内存表，以控制应用于数据模型的筛选器。所有这些技术在编写\
  \ DAX 表达式时非常普遍，将为你后续编写更复杂的代码奠定坚实的基础。\n\n### 控制筛选器传播的方向\n\n到目前为止，你已经了解到筛选器*仅*从关系的一端流向多端，即从维度表流向事实表，正如模型视图中连线上的箭头所示；参见图\
  \ 13-1。\n\n![图 13-1](img/523050_1_En_13_Fig1_HTML.jpg)\n\n**图 13-1** 筛选器仅从维度表流向事实表\n\
  \n然而，在某些情况下，你可能需要编写要求筛选器向相反方向传播的度量。在本章中，我们将探讨这些情况，并学习如何使用两种方法来逆转筛选器的方向：\n\n1.  使用\
  \ `CROSSFILTER` 函数以编程方式逆转筛选器\n2.  编辑数据模型使筛选器传播既流向事实表，也来自事实表\n\n不过，关于方法 #2，我们将会提醒你更改数据模型结构可能带来的负面影响。事实上，理解这一点很重要：如果你希望筛选器向相反方向流动，无论你选择哪种方式，这始终会是个问题。\n\
  \n\n\n### 编程实现双向筛选器\n\n例如，让我们看一个你在第四章学习筛选上下文时探讨过的问题，当时你无法解决它。在 `Customers` 维度中，有一个\
  \ `NO. OF STORES` 列，见图 13-2。\n\n![](img/523050_1_En_13_Fig2_HTML.jpg)\n\n图 13-2\
  \ — `Customers` 表和 `NO. OF STORES` 列\n\n我们想要计算每种葡萄酒的销售门店数量。我们可以创建这样一个度量值：\n\n```\n\
  Total Stores =\nSUM ( Customers[ NO. OF STORES] )\n```\n\n然而，如图 13-3 所示，这个度量值并不奏效。\n\
  \n![](img/523050_1_En_13_Fig3_HTML.jpg)\n\n图 13-3 — “Total Stores” 度量值未返回正确结果\n\n\
  在第四章中，我们找到了数值错误的原因。作用于 `Wines` 维度的筛选器只会传播到事实表，而*不会*继续传播到 `Customers` 维度，见图 13-4。\n\
  \n![](img/523050_1_En_13_Fig4_HTML.jpg)\n\n图 13-4 — 筛选器不会从 `Winesales` 传播到 `Customers`\n\
  \n那么，我们如何找到已售出葡萄酒的门店数量呢？答案在于使用名为 `CROSSFILTER` 的函数。\n\n`CROSSFILTER` 函数本身不返回值，而是作为\
  \ `CALCULATE` 函数的修饰符使用。它*以编程方式*设置筛选器在其所在度量值执行过程中的传播方向。其语法如下：\n\n```\n= CROSSFILTER\
  \ ( column1, column2, direction )\n```\n\n其中：\n\n- `column1` 是表示关系中多端的列名。\n- `column2`\
  \ 是表示关系中一端的列名。\n- `direction` 是度量值中使用的交叉筛选方向，可设置为 `\"both\"` 以生成双向筛选器。\n\n以下是 `CROSSFILTER`\
  \ 语法的一个示例：\n\n```\n= CROSSFILTER ( Winesales[CUSTOMERID], Customers[CUSTOMERID],\
  \ both )\n```\n\n`CROSSFILTER` 函数指定了度量值要使用的交叉筛选方向，因此我们现在可以*在内存中*改变筛选器的传播方向。\n\n\
  我们可以像这样重写原来的 `Total Stores` 度量值：\n\n```\nTotal Stores =\nCALCULATE (\n    SUM (\
  \ Customers[NO. OF STORES] ),\n    CROSSFILTER ( Winesales[CUSTOMER ID], Customers[CUSTOMER\
  \ ID], BOTH )\n)\n```\n\n此度量值使用 `CROSSFILTER` 来改变 `Customers` 和 `Winesales` 之间的关系方向。当评估此度量值时，`Winesales`\
  \ 表会被 `Wines` 维度交叉筛选，并且该筛选器会*继续*传播到 `Customers` 维度，见图 13-5。\n\n![](img/523050_1_En_13_Fig5_HTML.jpg)\n\
  \n图 13-5 — `CROSSFILTER` 函数能以编程方式改变筛选器的方向\n\n因此，以“Bordeaux”葡萄酒为例，`Customers` 表会被交叉筛选，仅包含购买了此葡萄酒的客户，我们可以看到售出“Bordeaux”的门店有\
  \ **728** 家，见图 13-6。\n\n![](img/523050_1_En_13_Fig6_HTML.jpg)\n\n图 13-6 — “Total\
  \ Stores” 度量值现在已正确计算\n\n然而，请注意总计行的数值 **1,181**。它并不是表格视觉对象中所有葡萄酒数值的总和。将筛选传播改为双向会产生一个副作用。许多相同的客户购买了多种葡萄酒，因此他们的门店数量被多次计入。而总计行则对所有客户在所有葡萄酒上的门店数量进行了加总。\n\
  \n### 为什么你不应使用双向关系\n\n`CROSSFILTER` 函数允许你在特定度量值的执行过程中*以编程方式*改变筛选传播的方向。但是，你可能知道还有一种更简单的方法来改变筛选方向，那就是改变数据模型的结构。为此，你可以在模型视图中双击两个表之间的连接线来编辑关系，将“交叉筛选方向”设置为“两者”，见图\
  \ 13-7。\n\n![](img/523050_1_En_13_Fig7_HTML.jpg)\n\n图 13-7 — 你可以编辑关系并将交叉筛选设置为双向\n\
  \n然而，尽管这是一种快速修复方法，但我们绝不建议你这样做，原因有二。首先，双向关系的效率低得多，可能会阻碍数据模型的性能；但更重要的是，它们会在数据模型中引入*歧义*。详细阐述歧义概念超出了本书的范围，但有关这些问题的更多信息，请查看此链接：\n\
  \n[`www.sqlbi.com/articles/bidirectional-relationships-and-ambiguity-in-dax/`](http://www.sqlbi.com/articles/bidirectional-relationships-and-ambiguity-in-dax/)\n\
  \n然而，即使在更基本的层面上，你也会发现，在模型中创建许多双向关系会导致筛选器传播时数据模型不可预测，你将开始失去对哪个筛选器影响什么的控制。如果你的模型遵循单向关系的规则，并且在必须改变筛选方向时使用\
  \ `CROSSFILTER`，你会发现操作起来容易得多。\n\n人们通常因为三个原因将关系编辑为双向筛选，而所有这些原因都是不成立的：\n\n1.  缺乏对\
  \ Power BI 数据模型和筛选器传播微妙之处的理解。\n2.  人们对 DAX 了解不够，无法使用 `CROSSFILTER` 以编程方式改变筛选方向。\n\
  3.  当切片器使用来自不同维度的列时，人们希望实现交叉筛选切片器。\n\n让我们来看最后一个原因：当使用来自不同维度的列时，希望实现交叉筛选切片器。如果这是你的目标，你无需使用双向筛选。你可以通过在想要交叉筛选的切片器上使用视觉级筛选器中的*度量值*来实现这一点。\n\
  \n例如，在图 13-8 中，你可以看到我们有两个切片器：一个使用 `Customers` 维度中的 `CUSTOMER NAME` 列，另一个使用 `Wines`\
  \ 维度中的 `WINE` 列。如果我们在 `CUSTOMER NAME` 切片器中选择，例如“Ballard & Sons”，`WINE` 切片器不会随之改变以反映“Ballard\
  \ & Sons”购买过的葡萄酒。无论我们在 `CUSTOMER NAME` 切片器中做出何种选择，我们始终会看到所有葡萄酒。\n\n![](img/523050_1_En_13_Fig8_HTML.jpg)\n\
  \n图 13-8 — 切片器不会从一个维度交叉筛选到另一个维度\n\n你已经知道原因了。如果 `Customers` 表被筛选，该筛选器会传播到 `Winesales`\
  \ 表，但不会继续传播到 `Wines` 表，因为筛选器不会从关系中的多端流向一端。然而，我们可以强制 `Wines` 表相应地交叉筛选。我们可以在 `WINE`\
  \ 切片器上使用一个*度量值*（例如 `Total Sales`）放置一个视觉筛选器，并仅筛选具有 `Total Sales` 值的 `Wines`。实际上，我们可以使用任何对\
  \ `Winesales` 表进行计算得到的度量值，然后像图 13-9 中的视觉筛选器所示，将此筛选器设置为“当值不为空时显示项目”。\n\n![](img/523050_1_En_13_Fig9_HTML.jpg)\n\
  \n图 13-9 — 使用填充了度量值并设置为“非空白”的视觉筛选器来交叉筛选切片器\n\n\n\n所以，真的没有理由不将关系编辑为双向！请始终使用 `CROSSFILTER`\
  \ 函数来设计方案。然而，正如我们所看到的，使用双向筛选的度量值（无论是通过 `CROSSFILTER` 还是编辑关系）都存在一个问题，即“总计”行会显示一个具有误导性的值。这个问题没有真正的解决方案；总计是正确的，但可能不是你想要显示的总计。当然，你总是可以在“表”或“矩阵”视觉对象中关闭总计行的显示。\n\
  \n"
- "# 14. 处理表之间的多重关系\n\n在我们的数据模型中，所有表与其他表之间都存在着*单一*关系。实际上，任何两个表之间只能有一个*活动*关系，但你可以拥有任意多个*非活动*关系。在本章中，你将学习如何使用表之间的多重关系并激活非活动关系。这可能是由于你需要从维度表到事实表建立多个链接。然而，在本章中我们还将发现非活动关系的另一个不那么明显的用途，那就是使用比较维度表。在这里，我们可以使用度量值强制通过比较维度表传播筛选，从而能够将默认维度中的列与其在比较维度中的对应列进行比较。\n\
  \n如果你尝试在任意两个表之间建立第二个或后续关系，除了第一个关系之外，所有关系都将处于非活动状态，并用虚线关系线表示。考虑图 14-1 中的表。现在，我们的\
  \ `Winesales` 表中有两个日期列：`SALE DATE` 和 `ORDER DATE`。^(¹⁵) 第一个关系是在 `DateTable` 表中的\
  \ `DATEKEY` 列与 `Winesales` 表中的 `SALE DATE` 列之间建立的。当我们尝试使用 `ORDER DATE` 在 `DateTable`\
  \ 和 `Winesales` 表之间创建第二个关系时，我们会得到一条虚线，表示该关系是非活动的。\n\n![](img/523050_1_En_14_Fig1_HTML.jpg)\n\
  \n图 14-1\n\n活动关系与非活动关系\n\n默认情况下，所有度量值都将使用活动关系，那么如何使用非活动关系呢？例如，如果我们构建一个包含 `DateTable`\
  \ 表中 `YEAR` 和 `MONTH` 列的表视觉对象（图 14-2），我们可以使用以下度量值来查找每个月的销售数量：\n\n![](img/523050_1_En_14_Fig2_HTML.jpg)\n\
  \n图 14-2\n\n使用 `DateTable` 表中的 `YEAR` 和 `MONTH` 列筛选 `Winesales` 表中的 `SALE DATE`\
  \ 列\n\n```\nNo. of Sales =\nCOUNTROWS ( Winesales )\n```\n\n在此视觉对象中，`No. of Sales`\
  \ 度量值筛选 `DateTable` 表中的 `YEAR` 和 `MONTH` 列，该筛选通过*活动*关系传播到 `Winesales` 表，从而筛选该年月的\
  \ `SALE DATE` 列。但是，要计算订单数量，我们需要使用*非活动*关系，以便改为筛选该年月的 `ORDER DATE` 列。为此，我们可以使用 `USERELATIONSHIP`\
  \ 函数。\n\n## 激活非活动关系\n\n`USERELATIONSHIP` 函数与 `CROSSFILTER` 函数一样，不返回任何值，而是用作 `CALCULATE`\
  \ 函数的修饰符。它通过编程方式使用非活动关系，在其所使用的度量值执行过程中传播筛选。其语法如下：\n\n`= USERELATIONSHIP ( column1,\
  \ column2 )`\n\n其中：\n\n**`column1`** 是代表要使用的关系中多方的列名。\n\n**`column2`** 是代表要使用的关系中一方的列名。\n\
  \n以下是 `USERELATIONSHIP` 语法的一个示例：\n\n`= USERELATIONSHIP (Winesales[SALE DATE], DateTable[ORDER\
  \ DATE] )`\n\n你必须有一个*非活动*关系才能使用 `USERELATIONSHIP` 函数。\n\n以下是用于计算图 14-3 中每个月订单数量的度量值：\n\
  \n![](img/523050_1_En_14_Fig3_HTML.jpg)\n\n图 14-3\n\n计算销售数量和订单数量\n\n```\nNo. of\
  \ Orders =\nCALCULATE (\nCOUNTROWS ( Winesales ),\nUSERELATIONSHIP ( Winesales[ORDER\
  \ DATE], DateTable[DATEKEY] ))\n```\n\n当此度量值被计算时，在 `DateTable` 中筛选的年份和月份会传播到 `Winesales`\
  \ 表，以交叉筛选 `ORDER DATE` 列，从而找到该月的订单。\n\n\n\n`## 比较同一列中的值`\n\n`USERELATIONSHIP` 函数还可用于另一种目的：对维度中同一列的值进行动态比较。换句话说，能够将默认维度中的列与其在比较维度中的对应列进行比较。\n\
  \n思考一下图 14-4 中展示的示例。在此，我们比较 2020 年的销售额（`Total Sales` 度量值）与 2021 年的销售额（`Compare Year`\
  \ 度量值），但这样做的好处是，我们是在*同一个表格视觉对象*中进行比较，而不是为每一年分别使用单独的视觉对象。\n\n![图 14-4](img/523050_1_En_14_Fig4_HTML.jpg)\n\
  \n**图 14-4** 比较在切片器中选择的两个不同年份的销售额\n\n`Compare Year` 度量值的起点是通过复制原始 `DateTable` 在数据模型中创建一个比较用的\
  \ `DateTable`。我们将复制的 `DateTable` 命名为 `DateTable Compare`。然后，使用 `DateTable Compare`\
  \ 表中的 `DATEKEY` 列和 `Winesales` 表中的 `SALE DATE` 列，将该表与 `Winesales` 表建立关联；见图 14-5。\n\
  \n![图 14-5](img/523050_1_En_14_Fig5_HTML.jpg)\n\n**图 14-5** 将比较表与事实表关联，但将关系设置为非活动状态\n\
  \n然后，您必须编辑此关系，通过在**编辑关系**对话框中取消勾选“使此关系生效”，确保将其标记为*非活动*；见图 14-6。\n\n![图 14-6](img/523050_1_En_14_Fig6_HTML.jpg)\n\
  \n**图 14-6** 将关系设置为非活动状态\n\n下一步是创建如图 14-4 所示的两个切片器。左侧的切片器名为 `YEAR`，是使用 `DateTable`\
  \ 中的 `YEAR` 列创建的。从此切片器中选择年份会筛选 `Total Sales` 度量值。右侧的切片器名为 `COMPARE YEAR`，是使用 `DateTable\
  \ Compare` 表中的 `YEAR` 列创建的。从此切片器中选择年份会按如下方式筛选 `Compare Year` 度量值：\n\n```\nCompare\
  \ Year =\nCALCULATE (\n    [Total Sales],\n    ALL ( DateTable ),\n    USERELATIONSHIP\
  \ ( Winesales[SALE DATE], 'DateTable Compare'[DATEKEY] )\n)\n```\n\n注意使用了 `ALL`\
  \ 函数来移除从 `YEAR` 切片器传入的、由活动关系使用的 `DateTable` 表中 `YEAR` 列上的筛选器。\n\n使用 `USERELATIONSHIP`\
  \ 进行数据比较是一种简单的策略，并且不需要复杂的 DAX，因此让我们将这个想法更进一步。让我们看看能否回答这个问题：在购买葡萄酒 X 的客户中，谁还购买了葡萄酒\
  \ Y？例如，在购买“香槟”的客户中，谁还购买了“灰皮诺”？\n\n我们在图 14-7 中阐述了解决这个问题的方案。`No. of Sales` 度量值正被左侧的\
  \ `WINE` 切片器筛选，并显示每个客户购买“香槟”的销售数量。`Compare Wine` 度量值正被右侧的 `COMPARE WINE` 切片器筛选，并显示每个客户购买“灰皮诺”的销售数量。最后，我们创建了一个\
  \ `Both Wines` 度量值，用于显示同时购买这两种葡萄酒的客户，并显示这两种葡萄酒的总销售数量。\n\n![图 14-7](img/523050_1_En_14_Fig7_HTML.jpg)\n\
  \n**图 14-7** 购买任一葡萄酒或两种葡萄酒的客户\n\n您可以在图 14-7 中看到：\n\n- “Charleston Ltd”同时购买了“香槟”和“灰皮诺”。\n\
  - “Charlottesville & Co”购买了“香槟”，但未购买“灰皮诺”。\n- “Chatou & Co”购买了“灰皮诺”，但未购买“香槟”。\n\n\
  如果我们将 `Both Wines` 度量值单独放入一个表格视觉对象中，我们将只看到同时购买了两种葡萄酒的客户（图 14-8）。\n\n![图 14-8](img/523050_1_En_14_Fig8_HTML.jpg)\n\
  \n**图 14-8** 同时购买两种葡萄酒的客户\n\n图 14-7 中度量值的表达式与我们之前在图 14-4 中比较年份时使用的表达式几乎相同。首先，您需要复制\
  \ `Wines` 维度。我们将这个复制的表称为 `Wines Compare`，然后将此复制表与事实表关联，并记住将关系设置为“非活动”。\n\n这些是我们在图\
  \ 14-7 中使用的三个度量值：\n\n```\nNo. of Sales =\nCOUNTROWS ( Winesales )\n```\n\n```\n\
  Compare Wine =\nCALCULATE (\n    [No. of Sales],\n    ALL ( Wines ),\n    USERELATIONSHIP\
  \ ( Winesales[WINE ID], 'Wines Compare'[WINE ID] )\n)\n```\n\n```\nBoth Wines =\n\
  IF (\n    SELECTEDVALUE ( Wines[WINE] ) = SELECTEDVALUE ( 'Wines Compare'[WINE]\
  \ ),\n    [No. of Sales],\n    --如果两个切片器中选择了相同的葡萄酒，则不将销售数量相加\n    IF (\n       \
  \ [No. of Sales] && [Compare Wine],\n        [No. of Sales] + [Compare Wine]\n \
  \   )\n    --如果客户对两种葡萄酒都有销售记录，则将销售数量相加\n)\n```\n\n然而，细心的您可能会注意到，图 14-8 中 `Both Wines`\
  \ 度量值的“总计”行中的值 (**298**) 是不正确的。它对所选葡萄酒的*所有行*进行汇总，而不仅仅是针对同时购买了两种葡萄酒的客户的那些行。为了在选中“香槟”和“灰皮诺”时计算出正确的总计值\
  \ (**258**)，您可以使用 `SUMX`（迭代 `Customers` 表）并按如下方式编辑 `Both Wines` 度量值：\n\n```\nBoth\
  \ Wines =\nSUMX (\n    Customers,\n    IF (\n        SELECTEDVALUE ( Wines[WINE]\
  \ ) = SELECTEDVALUE ( 'Wines Compare'[WINE] ),\n        [No. of Sales],\n      \
  \  IF ( [No. of Sales] && [Compare Wine], [No. of Sales] + [Compare Wine] )\n  \
  \  )\n)\n```\n\n我们希望这些示例能激发您在自己的数据中使用 `USERELATIONSHIP` 函数进行比较。当然，您现在也知道如何激活非活动关系了。\n\
  \n"
- "# 15. 理解上下文转换\n\n> *生命中任何有价值的事情都不容易。*\n> `——`巴拉克·奥巴马\n\n您也可以说，DAX 中任何有价值的事情都不容易。当然，上下文转换的概念是\
  \ DAX 中较难掌握的理论之一。它不能用短短几段话解释清楚，因此，我们将用整章来详细讲解什么是上下文转换以及如何在 DAX 表达式中使用它。只有这样，您才能进入下一章，探索这个概念的一些实际应用。一旦您理解了代码中上下文转换的目的，一系列具有挑战性的计算都将变成可能。事实上，您遇到的大多数\
  \ DAX 表达式可能都在使用上下文转换，而且，终有一天您编写的大多数 DAX 表达式也都会用到它。\n\n用最简单的话来说，上下文转换允许您以编程方式在维度或组粒度级别执行聚合，而不是在行粒度级别。例如，表达式\
  \ `AVERAGE ( Winesales[CASES SOLD] )` 计算的是跨事务销售的平均箱数。使用上下文转换的表达式 `AVERAGEX ( Wines,\
  \ [Total Cases] )` 将计算*聚合值*的平均值，在本例中，即为 `Total Cases` 度量值返回的值的平均值。大多数情况下，上下文转换发生在表达式求值过程中的内存里，因此我们无法看到它的发生。\n\
  \n## DAX 求值上下文概述\n\n要理解上下文转换，您必须扎实掌握 DAX 表达式是如何求值的。您必须清楚地区分筛选上下文和行上下文之间的区别，并能够在您的代码中正确使用这些概念。因此，我们本章的起点将是提醒自己这两种表达式求值条件之间的区别。\n\
  \n\n\n### 行上下文再探讨\n\n使用行上下文时，DAX 表达式会遍历表中的每一行。表达式中使用的值是*当前行中的值*，这些值可能因行而异。例如，`Winesales`\
  \ 表中每行的 `CASES SOLD` 值大多不同，因此这个计算列：\n\n```\n10 Percent of Cases Sold =  \nWinesales[CASES\
  \ SOLD] * 0.1  \n```\n\n会遍历 `Winesales` 表中的所有行，在每一行找到 `CASES SOLD` 的不同值，并将其乘以 `0.1`。\n\
  \n因此，我们可以明确地说，所有计算列都是在行上下文中进行计算的。但如果度量值*遍历了一个表*，它们也会使用行上下文。例如，这个度量值（我们在第 5 章学习 `SUMX`\
  \ 函数时见过）：\n\n```\nTotal Sales =  \nSUMX ( Winesales,  \nWinesales[CASES SOLD] *\
  \ RELATED ( Wines[PRICE PER CASE] )  \n)\n```\n\n首先在筛选上下文中进行计算，例如，筛选出“Bordeaux”葡萄酒，但随后\
  \ `SUMX` 函数遍历 `Winesales` 表，并使用行上下文将每一行中的 `CASES SOLD` 值与 `Wines` 表中的 `PRICE PER\
  \ CASE` 值相乘。这个价格对应的是 `Winesales` 表当前行的葡萄酒价格。然后，`SUMX` 函数对所有行级计算的结果求和，例如，针对“Bordeaux”葡萄酒。\n\
  \n因此，我们还可以说，任何*遍历表*的 DAX 表达式，无论是在计算列中还是在度量值内部，都会使用行上下文。\n\n### 筛选上下文再探讨\n\n所有 DAX\
  \ 度量值都是在筛选上下文中进行计算的。这个规则没有例外。我们知道，筛选上下文通常是在度量值计算时，根据 Power BI 报表的当前状态（无论是可视对象的结构、影响可视对象的切片器，还是“筛选器”窗格中的任何筛选器）生成的。但还有一种生成筛选上下文的方式，这正是我们接下来要探讨的。\n\
  \n## 行上下文如何变成筛选上下文\n\n在 DAX 表达式进行计算时，有一种特定情况会将行上下文转换为筛选上下文。这就是我们所知的*上下文转换*。为了理解这种特定情况，让我们考虑以下五个\
  \ DAX 表达式：两个计算列和三个度量值（现阶段你无需知道这些表达式在计算什么）：\n\n1.  **Column 1 =**  \n    `CALCULATE\
  \ ( SUM ( Winesales[CASES SOLD] ) )`\n\n2.  **Column 2 =**  \n    `[Total Cases]`\n\
  \n3.  **Measure 1 =**  \n    `AVERAGEX ( Wines, [Total Cases] )`\n\n4.  **Measure\
  \ 2 =**  \n    `AVERAGEX ( Wines, CALCULATE ( SUM ( Winesales[CASES SOLD] ) ) )`\n\
  \n5.  **Measure 3 =**  \n    `CALCULATE ( [No. of Sales], FILTER ( Winesales, [Total\
  \ Cases] > 350 ) )`\n\n**问题：** 所有这些表达式有什么共同点？\n\n答案是，所有五个表达式都共享以下三个属性：\n\n1.  它们都使用了\
  \ `CALCULATE` 函数。\n\n但 **Column 2** 和 **Measure 1** 显然没有用到？在这一点上，我们需要进一步教你关于度量值的知识。*所有度量值都会隐式调用\
  \ `CALCULATE`*，即使它们没有显式地调用该函数。因此，引用了度量值“Total Cases”的 **Column 2** 和 **Measure 1**，两者都在隐式调用\
  \ `CALCULATE`。其他表达式则显式调用了 `CALCULATE`。\n\n2.  它们都*遍历表*，创建行上下文。\n\n**Column 1** 和\
  \ **Column 2** 是计算列，所有计算列都会遍历表。我们知道函数 `AVERAGEX` 和 `FILTER` 也是迭代器，因此 **Measure 1**、**Measure\
  \ 2** 和 **Measure 3** 都会遍历表，创建行上下文。**Measure 1** 和 **Measure 2** 遍历 `Wines` 表，**Measure\
  \ 3** 遍历 `Winesales` 表。\n\n3.  它们都触发了*上下文转换*。\n\n这就是由计算列或度量值内部的迭代生成的行上下文被转换为筛选上下文的过程。\n\
  \n因此，我们提到的特定情况如下：每当出现以下情况时，就会发生上下文转换：\n\n-   表达式显式或隐式地使用了 `CALCULATE`（因为你正在使用度量值）\n\
  \n并且\n\n-   表达式（无论是在列中还是在度量值中）使用行上下文遍历了一个表\n\n你现在明白了上下文转换*何时*发生，但“上下文转换”*到底是什么*？为了回答这个问题，我们先采用以下表达式，并将其用于计算列中：\n\
  \n```\nTotal Cases Column =  \nSUM ( Winesales[CASES SOLD] )\n```\n\n![图 15-1](img/523050_1_En_15_Fig1_HTML.jpg)\n\
  \n**图 15-1** – 该计算列在每一行都返回总计值\n\n在图 15-1 中可以看到，在每一行中，该表达式都返回相同的值，即 `CASES SOLD`\
  \ 的合计值。作为一个计算列，该表达式使用行上下文遍历了表，因此没有筛选条件存在。根据定义，聚合函数（如 `SUM`）要求先对要聚合的行进行筛选。由于表上没有筛选条件，该表达式只能使用整个表的值，因此对所有\
  \ `CASES SOLD` 的值进行了求和。\n\n我们刚刚了解到，当存在迭代，*并且*我们使用了 `CALCULATE` 时，就会发生上下文转换。因此，我们现在可以首次观察上下文转换在计算列中的实际作用：通过编辑我们的表达式，并使用\
  \ `CALCULATE` 将其包裹起来：\n\n```\nTotal Cases Column =  \nCALCULATE (  \nSUM ( Winesales[CASES\
  \ SOLD] )  \n)\n```\n\n![图 15-2](img/523050_1_En_15_Fig2_HTML.jpg)\n\n**图 15-2**\
  \ – 使用 `CALCULATE` 会在计算列中触发上下文转换\n\n\n\n图 15-2 显示该表达式的结果返回每一行的 `CASES SOLD` 值。这里发生的情况是，该表达式像所有计算列一样，通过迭代表生成行上下文。但我们在迭代中还使用了\
  \ `CALCULATE`，通过这样做，表达式忽略了行上下文，并用筛选上下文取代了它。请注意，尽管表达式使用了 `CALCULATE`，但 `CALCULATE`\
  \ 内部并没有筛选参数。那么，`CALCULATE` 使用的是哪个筛选器呢？答案相当奇特（至少对于 DAX 新手来说是这样）。一个筛选器会被放置于当前行中每一列的每个值上。例如，表中计算返回\
  \ **213** 的第一行，其筛选器是这样的：\n\n```\nSALE DATE = 01/01/2017\nWINESALES NO = 2\nSALESPERSON\
  \ ID = 6\nCUSTOMER ID = 16\nWINE ID = 10\nCASES SOLD  = 213\n```\n\n计算列“Total Cases\
  \ Column”迭代了 `Winesales` 表，并且由于存在 `CALCULATE`，上下文转换发生了。共享相同筛选集（如前所述）的所有行会被分组，并在各自组内被筛选。求和的\
  \ `CASES SOLD` 值是每个组内的已售箱数值。由于我们的行是唯一的，每个分组仅包含一行，因此表达式返回的结果与 `CASES SOLD` 相同。这就是为什么，如果在示例中第一行有重复，你会在“Total\
  \ Cases Column”中看到 **426**（213 x 2），因为重复行会在 `CASES SOLD` 求和之前被分组。^(¹⁷) 然而，我们的每一行都是唯一的，因此上下文转换生成的每个筛选只返回一行，即当前行。这是在计算列中使用\
  \ `CALCULATE` 的一个示例，其中存在迭代（因此有行上下文），所以 `CALCULATE` 会触发上下文转换。\n\n但是，当你使用存在行上下文的*度量值*时，也会发生上下文转换，例如，如果你将度量值放入计算列中。\n\
  \n> **注意**  \n> 建议在数据视图中按以下说明创建计算列。\n\n这是因为所有度量值都会隐式调用 `CALCULATE`，因此上下文转换也会发生。例如，我们来看这个度量值：\n\
  \n```\nTotal Cases =\nSUM ( Winesales[CASES SOLD] )\n```\n\n现在让我们编辑计算列“Total Cases\
  \ Column”，以执行相同的计算（即对 `CASES SOLD` 列求和），但这次用“Total Cases”度量值来表示：\n\n```\nTotal Cases\
  \ Column =\n[Total Cases]\n```\n\n![图 15-3](img/523050_1_En_15_Fig3_HTML.jpg)\n\n\
  在计算列中使用度量值会触发上下文转换\n\n你会在图 15-3 中注意到，该表达式的结果与我们显式使用 `CALCULATE` 时相同。因此，这两个表达式\n\n\
  ```\nTotal Cases Column =\nCALCULATE (\nSUM ( Winesales[CASES SOLD] ) )\n```\n\n\
  和\n\n```\nTotal Cases Column =\n[Total Cases]\n```\n\n是*相同*的表达式。\n\n在理解上下文转换的这一阶段，我理解你可能会想：我为什么要创建一个返回与当前行值相同结果的计算列呢？再者，我们的\
  \ `Winesales` 表作为事实表，可能包含数百万行，因此计算列中的任何上下文转换都会非常慢。简而言之，上下文转换的目的是什么？\n\n为了回答这个问题，让我们看看上下文转换在维度表中被调用时，与在事实表中相比性能如何。现在，我们重复使用前面用过的相同表达式，但这次不把它们放在事实表中，而是放入\
  \ `Wines` 维度中。\n\n以下是我们可以在 `Wines` 维度中创建的计算列：\n\n```\nWine Total Cases 1=\nSUM (\
  \ Winesales[CASES SOLD] )\nWine Total Cases 2 =\nCALCULATE (\nSUM ( Winesales[CASES\
  \ SOLD] ) )\nWine Total Cases 3 =\n[Total Cases]\n```\n\n通过观察图 15-4 中这些计算列的行为，让我们更仔细地审视每个表达式的求值过程。\n\
  \n![图 15-4](img/523050_1_En_15_Fig4_HTML.jpg)\n\n`Wines` 维度中的三个计算列\n\n![图 15-5](img/523050_1_En_15_Fig5_HTML.jpg)\n\
  \n`Wines` 维度被上下文转换筛选\n\n这些计算列中的第一个，“Wine Total Cases 1”，使用了 *“SUM ( Winesales[CASES\
  \ SOLD] )”* 表达式。该表达式中没有度量值，也未隐式或显式地使用 `CALCULATE`。该表达式使用了需要筛选上下文的 `SUM` 函数。在没有任何筛选的情况下，它会对\
  \ `Winesales` 表中所有行的 `CASES SOLD` 值求和，得出 `CASES SOLD` 的总计。\n\n第二个计算列，“Wine Total\
  \ Cases 2”，使用了 `CALCULATE`，它将计算列迭代所触发的行上下文转换为筛选上下文。此时，我们需要提醒自己，筛选上下文始终会传播到整个数据模型。由上下文转换产生的筛选器，与来自报表画布上的视觉对象或切片器的筛选器行为无异。当计算列“Wine\
  \ Total Cases 2”中的表达式对 `Wines` 维度的第一行进行求值时，它会将整行转化为筛选器，并筛选出“Bordeaux”葡萄酒。我们可以想象，在求值第一行时的内存中，我们的\
  \ `Wines` 维度看起来就像图 15-5 中的表格。\n\n图 15-5 看起来眼熟吗？对 `Wines` 维度中“Bordeaux”的筛选，与我们使用切片器或任何其他方式在报表中筛选“Bordeaux”时应用的筛选是相同的。我们知道，因为\
  \ `Wines` 维度与 `Winesales` 事实表存在多对一关系，所以这个*由上下文转换生成的*筛选器会继续传播到 `Winesales` 表。因此，我们的\
  \ `Winesales` 表现在被交叉筛选为仅包含“Bordeaux”葡萄酒，并据此对 `CASES SOLD` 值进行求和。\n\n因此，我们可以得出结论，使用\
  \ `CALCULATE` 并在其中发生上下文转换的计算列，其行为类似于报表画布上视觉对象中的度量值，它会先筛选再进行聚合。\n\n再看第三个计算列，“Wine\
  \ Total Cases 3”，这里我们使用了“Total Cases”度量值，该度量值定义了与“Wine Total Cases 2”相同的表达式。因为所有度量值都会隐式调用\
  \ `CALCULATE`，所以“Wine Total Cases 2”和“Wine Total Cases 3”是相同的表达式。每当你看到一个度量值，即使它没有显式使用\
  \ `CALCULATE`，你也应始终想象它被包裹在 `CALCULATE` 内部。\n\n总结这三个计算列的输出结果，“Wine Total Cases 2”和“Wine\
  \ Total Cases 3”在求值过程中都使用了上下文转换，但“Wine Total Cases 1”没有。\n\n\n\n## 上下文转换如何返回“令人意外的结果”\n\
  \n在研究上下文转换时，我们一直使用计算列来观察其实际运作。然而，我们并不需要亲眼目睹上下文转换的发生才能理解它，而且实际上，你在实际工作中可能也不会创建这类计算列。\n\
  \n大多数情况下，上下文转换在你构建*引用另一个度量值*的迭代度量值时（因为所有度量值都会隐式调用 `CALCULATE`），会在内存中幕后进行。\n\n现在，让我们回顾一下上下文转换发生的特定情况：\n\
  \n-   当表达式通过度量值显式或隐式使用 `CALCULATE`  \n    并且  \n-   当表达式使用行上下文迭代表时\n\n通常，这发生在我们将度量值嵌套在迭代型的“X”聚合函数（如\
  \ `AVERAGEX` 或 `MAXX`）中，或者在 `FILTER` 函数中使用度量值时。由于我们看不见上下文转换的发生，对其存在浑然不知意味着我们会难以理解\
  \ `DAX` 的运行机制。Marco Russo 和 Alberto Ferrari 在他们的《DAX 权威指南》中这样解释理解上下文转换：\n\n*“对某些行为无知可能会导致意外的结果。然而，一旦你掌握了该行为，你就能按需利用它。在\
  \ `DAX` 中，奇怪行为与有用特性之间的唯一区别——至少在这里——就是你的知识水平。”*^(¹⁸)\n\nMarco 和 Alberto 谈到了“奇怪行为”和“意外结果”。这些行为之所以让你觉得奇怪或意外，唯一原因就是你不理解上下文转换的行为，不明白在度量值评估过程中，迭代*调用\
  \ `CALCULATE` 的度量值*与迭代*不调用 `CALCULATE` 的表达式*之间存在着天壤之别。为了说明这一点，我们将研究一些表达式编写案例，在这些案例中，关键在于正确选择，即嵌套度量值还是嵌套表达式。通过这些例子，我们将看到\
  \ `DAX` 表达式如何返回“令人意外的结果”——当然，除非你理解了上下文转换的行为。\n\n### 使用 AVERAGE 进行筛选\n\n在第一个例子中，我们必须在度量值中引用一个*表达式*才能获得正确的计算结果；嵌套定义相同表达式的度量值则行不通。\n\
  \n考虑这样一个计算：找出每种酒销量箱数大于该酒平均销量箱数的销售记录数。例如，“波尔多”的平均销量箱数是 **300**，我们想计算“波尔多”有多少笔销售的箱数大于这个值（这纯粹是智力练习，并非特别实用的计算）。\n\
  \n我们已经创建了这两个度量值：\n\n```\nAvg Cases =\nAVERAGE ( Winesales[CASES SOLD] )\nNo. of\
  \ Sales =\nCOUNTROWS ( Winesales )\n```\n\n现在，要计算 `CASES SOLD` 值大于平均箱数的销售数量，我们可以编写这个度量值：\n\
  \n```\nNo. Of Sales GT Avg #1=\nVAR AvgCasesTable =\nFILTER ( Winesales, Winesales[CASES\
  \ SOLD] > [Avg Cases] )\nRETURN\nCALCULATE ( [No. Of Sales], AvgCasesTable )\n```\n\
  \n注意在迭代 `Winesales` 表的 `FILTER` 表达式中嵌套使用了 `[Avg Cases]` *度量值*（已高亮显示）。我们知道，在迭代过程中嵌套度量值会触发上下文转换。\n\
  \n不幸的是，`No. Of Sales GT Avg #1` 度量值并未返回正确结果；它返回了空白。我想你会同意，这是一个令人意外的结果；见图 15-6。\n\
  \n图 15-6  \n`No. Of Sales GT Avg #1` 未返回值\n\n显然，我们必须更仔细地研究这里发生了什么。这个度量值 `No. Of\
  \ Sales GT Avg #1` 使用了 `FILTER` 函数，该函数迭代 `Winesales` 表，筛选出 `CASES SOLD` 值大于 `[Avg\
  \ Cases]` 度量值计算出的值的行。但 `[Avg Cases]` 计算的值是多少？如果我们将 `[Avg Cases]` 这个度量值作为计算列放入 `Winesales`\
  \ 表，就能看到 `FILTER` 函数是在将 `CASES SOLD` 值与什么进行比较；见图 15-7。\n\n图 15-7  \n在计算列中评估的 `[Avg\
  \ Cases]` 度量值将 `Winesales` 表筛选为当前正在评估的单行\n\n> 注意：请记住，在图 15-6 的表格可视化中第一次评估时，`Winesales`\
  \ 表会在内存中被交叉筛选为“波尔多”葡萄酒，即 `WINE ID 1`。\n\n我们发现 `[Avg Cases]` 返回的值与 `CASES SOLD` 值相同。这是因为\
  \ `[Avg Cases]` 是一个度量值，因此当 `FILTER` 迭代 `Winesales` 表时，它会触发上下文转换。这会在内存中正在评估的 `Winesales`\
  \ 表的每一行上创建一个筛选器。由于每一行都是唯一的，它只计算当前行的 `CASES SOLD` 平均值，结果与 `CASES SOLD` 值相同。因此，`[Avg\
  \ Cases]` 的值永远不会大于 `CASES SOLD` 值。你可以通过将 `>` 改为 `>=` 来测试，此时返回的将不会是空白，而是与 `No. of\
  \ Sales` 相同的值。\n\n现在，让我们将 `FILTER` 函数中的度量值替换为一个计算平均值的*表达式*（已高亮显示）：\n\n```\nNo. Of\
  \ Sales GT Avg #2 =\nVAR AvgCasesTable =\nFILTER ( Winesales, Winesales[CASES SOLD]\
  \ >\nAVERAGE ( Winesales[CASES SOLD] ) )\nRETURN\nCALCULATE ( [No. Of Sales], AvgCasesTable\
  \ )\n```\n\n这次我们得到了正确的结果；见图 15-8。\n\n图 15-8  \n在 `FILTER` 中使用嵌套表达式而非嵌套度量值返回了正确结果\n\
  \n要理解为什么使用表达式的第二个版本的度量值能够生效，我们可以再次将表达式 `AVERAGE ( Winesales[CASES SOLD] )` 放入 `Winesales`\
  \ 表的一个计算列中，并筛选为“波尔多”葡萄酒（因为在第一次评估时，这是对 `Winesales` 表的内存交叉筛选）。\n\n我们在图 15-9 中可以看到，该表达式返回了当前筛选上下文中该酒的平均销量箱数。\n\
  \n> 注意：在图 15-9 中，我们模拟了在当前筛选上下文*内存*中 `Winesales` 表中可见的行，你在数据视图中无法看到这些行。因此，当你将 `AVERAGE\
  \ ( Winesales[CASES SOLD] )` 放入计算列时，你会看到所有交易的平均值 (**192**)，而不仅仅是“波尔多”酒的平均值 (**300**)。\n\
  \n图 15-9  \n在计算列中评估的 `AVERAGE ( Winesales[CASES SOLD] )` 表达式返回了每种酒的平均箱数\n\n我们知道“波尔多”的平均销量箱数是\
  \ **300**。因此，在第一次对“波尔多”的评估中，有 **89** 笔交易的销量箱数大于 **300**。\n\n因此我们可以理解，尽管表达式和度量值计算的是相同的平均值，但我们必须在被评估的度量值内部嵌套平均值的*表达式*，而不是嵌套计算该平均值的*度量值*。\n\
  \n\n\n### 使用 `MAX` 的筛选器\n\n在我们关于 DAX 可能返回“出人意料结果”的第二个示例中，我们将计算累计总计，如图 15-10 所示。\n\
  \n![图 15-10](img/523050_1_En_15_Fig10_HTML.jpg)\n\n**图 15-10** – 在“累计总计”度量值中计算累计总计\n\
  \n要生成“累计总计”度量值，我们必须在父度量值中再次使用嵌套表达式，而不是嵌套度量值，这一次我们将使用聚合函数 `MAX`。\n\n> **注意**  \n\
  > 我们之前已经使用时间智能函数 `DATESBETWEEN` 计算过累计总计。但是，在本节中，我们将探讨实现相同结果的另一种方法。\n\n为了在图 15-10\
  \ 的表格视觉对象中计算累计总计，对于当前筛选上下文中的任何给定日期，我们必须对值（在我们的示例中为总销售额）求和，一直累计到当前筛选上下文中的最新日期。例如，如果当前筛选条件是“2017\
  \ 年 5 月”，我们必须对截至 **2017 年 5 月 31 日**（含该日）的值进行求和。因此，我们可能会认为，首先需要构建一个度量值，使用 `MAX`\
  \ 函数查找当前筛选上下文中的最新日期，如下所示：\n\n```\nMax Date =\nMAX ( DateTable[DATEKEY] )\n```\n\n\
  然后，我们可以在以下表达式中使用这个“Max Date”度量值（高亮显示）（注意，这里使用了 `ALL` 来移除当前按月份进行筛选的 `DateTable` 上的筛选器）：\n\
  \n```\nCumulative Total Wrong =\nVAR FilteredDatesTable =\nFILTER (\nALL ( DateTable\
  \ ),\nDateTable[DATEKEY] <= [Max Date]\n)\nRETURN\nCALCULATE ( [Total Sales], FilteredDatesTable\
  \ )\n```\n\n从图 15-11 的视觉对象中查看此表达式的结果，显然，这并没有起作用。\n\n![图 15-11](img/523050_1_En_15_Fig11_HTML.jpg)\n\
  \n**图 15-11** – “Cumulative Total Wrong”度量值返回了错误的结果\n\n让我们看看“Cumulative Total Wrong”哪里出了问题。这里，我们使用了定义最大日期的度量值“Max\
  \ Date”。`FILTER` 函数与 `ALL` 结合使用，生成了一个包含 `DateTable` 中所有行的虚拟 `DateTable`。然后，它遍历这个虚拟表，将\
  \ `DATEKEY` 列中的每个日期与“Max Date”计算出的日期进行比较。“Max Date”的值是多少呢？“Max Date”度量值会触发上下文转换，因此会将每一行筛选为单一行。所以，在遍历\
  \ `DateTable` 时，它总是返回当前位于 `DateTable` 当前行中的那个相同日期。为了理解这一点，我们可以将“Max Date”度量值放入 `DateTable`\
  \ 的一个计算列中，如图 15-12 所示。\n\n![图 15-12](img/523050_1_En_15_Fig12_HTML.jpg)\n\n**图 15-12**\
  \ – 在计算列中求值的“Max Date”度量值将 `DateTable` 筛选为仅包含正在被求值的单一行\n\n由于 `DATEKEY` 总是 *等于* “Max\
  \ Date”，所有日期都被 `FILTER` 函数筛选掉了，因此 `CALCULATE` 计算的是所有日期的总案例数（换一种方式看这个问题，可以尝试将 `<=`\
  \ 替换为 `<`，此时将返回空白）。\n\n因此，要解决此问题，我们必须使用一个表达式（高亮显示）来计算当前筛选上下文中的最新日期，这才是正确的度量值：\n\n\
  ```\nCumulative Total =\nVAR FilteredDatesTable =\nFILTER (\nALL ( DateTable ),\n\
  DateTable[DATEKEY] <= MAX ( DateTable[DATEKEY] )\n)\nRETURN\nCALCULATE ( [Total\
  \ Sales], FilteredDatesTable )\n```\n\n在这个度量值中，`FILTER` 函数与 `ALL` 结合使用，遍历虚拟的 `DateTable`\
  \ 表，将 `DATEKEY` 列中的每个日期与表达式 *“`MAX ( DateTable[DATEKEY] )`”* 计算出的日期进行比较。这个表达式会找到当前筛选上下文中的最新日期；例如，在求值“2017\
  \ 年 5 月”时，它将返回 **2017 年 5 月 31 日**；参见图 15-13。\n\n![图 15-13](img/523050_1_En_15_Fig13_HTML.jpg)\n\
  \n**图 15-13** – 在计算列中求值的 `MAX` 表达式返回当前筛选上下文中该月份的最大日期\n\n> **注意**  \n> 在图 15-13 中，我们再次模拟了在当前筛选上下文中，`DateTable`\
  \ 中哪些行将在内存中可见。您在“数据”视图中看不到内存中的筛选器。因此，如果将 *“`MAX ( DateTable[DATEKEY] )`”* 表达式放入\
  \ `DateTable` 的一个计算列中，您将看到 *所有日期* 的最后一天，即 **2021 年 12 月 31 日**。\n\n`FILTER` 函数会将虚拟\
  \ `DateTable` 中 `DATEKEY` 列的每一个日期与 *“`MAX ( DateTable[DATEKEY] )`”* 计算出的日期进行比较，因此它会筛选出所有早于或等于该日期的行。\n\
  \n\n\n### 使用度量值进行筛选\n\n在我们最后一个“令人惊讶的结果”示例中，必须使用度量值而非表达式。例如，你可能希望计算每笔交易的“总销售额”大于\
  \ 10,000 美元的交易数量。提醒一下，这是“总销售额”度量值中使用的表达式：\n\n```\nTotal Sales =\nSUMX ( Winesales,\
  \ Winesales[CASES SOLD] *\nRELATED ( Wines[PRICE PER CASE] ) )\n```\n\n你可能会尝试使用此表达式（高亮部分）来计算销售额大于\
  \ 10,000 美元的交易数量：\n\n```\nNo. Of Sales GT 10,000 #1=\nVAR MySales =\nSUMX ( Winesales,\
  \ Winesales[CASES SOLD] *\nRELATED ( Wines[PRICE PER CASE] ) )\nVAR SalesTable =\n\
  FILTER ( Winesales, MySales > 10000 )\nRETURN\nCALCULATE ( [No. Of Sales], SalesTable\
  \ )\n```\n\n然而，如图 15-14 所示，此度量值返回的是交易总数，而非大于 10,000 美元的交易数量。\n\n![](img/523050_1_En_15_Fig14_HTML.jpg)\n\
  \n**图 15-14** – “No. Of Sales GT 10,000” 度量值并未返回正确结果\n\n在“No. Of Sales GT $10,000\
  \ #1”度量值中，我们使用 `SUMX` 计算总销售额。然而，`SUMX` 表达式会对当前筛选上下文中 `Winesales` 表内每款葡萄酒的所有交易进行总销售额求和，从而得出每款葡萄酒的“总销售额”总计。在图\
  \ 15-15 中，`SUMX` 表达式已被放入 `Winesales` 表中的计算列，以了解其在内存中的返回值（仅显示“Bordeaux”的总销售额），即该款葡萄酒的总销售额，而非每笔交易的总销售额。当\
  \ `FILTER` 迭代 `Winesales` 表时，该值将始终大于 10,000 美元。\n\n![](img/523050_1_En_15_Fig15_HTML.jpg)\n\
  \n**图 15-15** – 在计算列中求值的 `SUMX` 表达式返回了当前筛选上下文中该款葡萄酒的总销售额\n\n因此，在编写查找销售额大于 10,000\
  \ 美元的交易数量的表达式时，必须在 `FILTER` 内部使用“总销售额”*度量值*（高亮部分），如下所示：\n\n```\nNo. Of Sales GT\
  \ 10,000 #2 =\nVAR MyTable =\nFILTER ( Winesales, [Total Sales] > 10000 )\nRETURN\n\
  CALCULATE ( [No. Of Sales], MyTable )\n```\n\n如图 15-16 所示，使用嵌套度量值“Total Sales”的“No.\
  \ Of Sales GT 10,000 #2”度量值返回了正确值。\n\n![](img/523050_1_En_15_Fig16_HTML.jpg)\n\n\
  **图 15-16** – 在 `FILTER` 内使用嵌套度量值而非表达式，为销售额大于 10,000 美元的交易数量返回了正确结果\n\n我们再次探究一下第二次尝试中使用嵌套度量值能奏效的原因。如果将“Total\
  \ Sales”度量值放入计算列，就能揭示 `FILTER` 在内存中迭代 `Winesales` 表时会返回什么。我们可以看到，这是每笔交易的总销售额，因为它利用上下文转换对内存中的每一行进行了筛选；见图\
  \ 15-17。\n\n![](img/523050_1_En_15_Fig17_HTML.jpg)\n\n**图 15-17** – 在计算列中求值的“Total\
  \ Cases”度量值将 `Winesales` 表筛选为正在求值的单一行\n\n当 `FILTER` 迭代 `Winesales` 表时，它可以利用此值来查找大于\
  \ 10,000 美元的值。\n\n我想我们已经充分阐明了 Marco Russo 和 Alberto Ferrari 所指的“令人惊讶的结果”，在此过程中，你现在应该理解了上下文转换的概念。即由于在迭代中存在\
  \ `CALCULATE`，行上下文被转换为筛选上下文，这些筛选器会像所有筛选器一样，在数据模型中传播。无论你使用 `DAX` 多久，这些计算都是令人费解的。在接下来的章节中，我们将探讨为何接受挑战、理解上下文转换带来的奇怪行为和令人惊讶的结果如此重要，因为只有这样，你才能真正开始体验到使用\
  \ `DAX` 的益处。\n\n## 利用上下文转换汇总总计\n\n上下文转换的强大之处在于，当用它来计算平均值、最大值和最小值等总计值（而非行级别值）时便会显现。在本节中，我们将探究为何这是高级计算中必须掌握的知识。这也是为何清晰定义维度表尤为重要，因为为了实现这类计算，我们将在真实和虚拟的维度表之间传递上下文转换。你将在下一节中发现，上下文转换既可以同样地传递给由表表达式生成的虚拟表，也可以传递给数据模型中的实际维度。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循注意事项和示例格式，为您翻译以下内容。\n\n\n### 维度中的聚合\n\n我们将首先探讨在引用维度表的表达式中使用上下文转换时的工作原理。例如，以下这个简单的度量值：\n\
  \n```\nMax Cases =\nMAX ( Winesales[CASES SOLD] )\n```\n\n`Max Cases` 度量值可以告诉我们，在`Winesales`表中，每种葡萄酒的每笔交易中，最大箱数是多少。例如，对于“波尔多”，单笔交易中卖出的最大箱数是`500`箱。这是一个行级别的计算，但这并不是我们想要的。\n\
  \n我们知道，以下这个度量值将对`Winesales`表中的箱数销售值进行求和：\n\n```\nTotal Cases =\nSUM ( Winesales[CASES\
  \ SOLD] )\n```\n\n我们此处的目标是计算这个`Total Cases`度量值的最大值，而不是单个交易的最大值，如图 15-18 所示。\n\n\
  ![Figure 15-18](img/523050_1_En_15_Fig18_HTML.jpg)\n\n**图 15-18** `Max Cases` 度量值是一个行级别计算，但我们想要计算的是跨总计值的最大值\n\
  \n为此，我们需要使用上下文转换。我们知道，当一个度量值在一个表上被迭代时，就会发生上下文转换。我们之前研究了在`Wines`维度中创建一个计算列（“Wine\
  \ Total Cases 3”），该列使用`Total Cases`度量值来触发上下文转换，从而为`Wines`维度中的每种葡萄酒找到售出的总箱数；参见图 15-19。\n\
  \n![Figure 15-19](img/523050_1_En_15_Fig19_HTML.jpg)\n\n**Figure 15-19** 在`Wines`维度中使用`Total\
  \ Cases`度量值创建计算列会触发上下文转换\n\n与其将这个度量值放入计算列中来观察上下文转换，我们不如使用`MAXX`将该度量值*嵌套在另一个度量值中*，这将迭代`Wines`维度，就像计算列所做的那样。如果我们这样做，上下文转换将在内存中发生，我们就可以找到在计算列中看到的值的最大值。现在，让我们来编写这个度量值：\n\
  \n```\nMax of Totals =\nMAXX ( Wines, [Total Cases] )\n```\n\n`MAXX`函数在内存中迭代`Wines`维度，为维度中的每一行计算`Total\
  \ Cases`*度量值*，就像图 15-19 中的计算列一样。然后，它找出这些值中的最大值。\n\n**注意**：我们在这里使用`MAXX`函数，是因为更容易理解其计算过程——你可以轻松看出哪个值最大。然而，`AVERAGEX`函数可能更适用，因为你可能需要计算总计的平均值才能知道那个值是什么。\n\
  \n但是，当这个度量值被放入图 15-20 的表格可视化对象中时，为什么除了“总计”行（该行的值是正确的）之外，在所有其他行中都返回了与`Total Cases`度量值相同的结果？\n\
  \n![Figure 15-20](img/523050_1_En_15_Fig20_HTML.jpg)\n\n**图 15-20** `Max of Totals`\
  \ 度量值在“总计”行中是正确的，值为 `54,070`，即“波尔多”的售出箱数\n\n现在让我们来回答这个问题。在这个表格可视化对象中，首先计算的是“波尔多”葡萄酒，因此在当前筛选器中，只有一个`Total\
  \ Cases`的值，那就是“波尔多”的总箱数。单个值的最大值就是该值本身，这就是为什么我们看到`Total Cases`和`Max of Totals`的值相同。只有当度量值计算到“总计”行时（此时没有对`Wines`维度进行筛选），它才能找到所有葡萄酒中的最大值，即“波尔多”的`54,070`。\n\
  \n这里需要强调的一点是，上下文转换总是在应用于数据模型的筛选器内工作。例如，如果我们在画布上添加一个“销售人员”切片器并筛选“Abel”，我们现在可以看到“Abel”的最大箱数（`10,993`）。因为`Winesales`事实表现在被筛选为“Abel”的销售数据，所以上下文转换现在会在新的筛选上下文中计算这些值；参见图\
  \ 15-21。\n\n![Figure 15-21](img/523050_1_En_15_Fig21_HTML.jpg)\n\n**图 15-21** 在不同筛选上下文中计算的\
  \ `Max of Totals` 度量值\n\n然而，由于`Max of Totals`度量值为每种葡萄酒都返回与`Total Cases`相同的值，因此该度量值在筛选葡萄酒名称的可视化对象中实际上并不起作用。这个度量值更适用于被放置在筛选其他维度的可视化对象中。在图\
  \ 15-22 中，我们在一个矩阵和一个表格可视化对象中使用了`Max of Totals`度量值，这些对象显示了每个销售人员的最大箱数。我们重点关注了“Abel”的最大箱数值，即“香槟”的`10,993`。我们还将此度量值放在一个卡片可视化对象中，以显示所有葡萄酒的最大箱数。\n\
  \n![Figure 15-22](img/523050_1_En_15_Fig22_HTML.jpg)\n\n**图 15-22** 如果放置在筛选除`Wines`维度之外的其他维度的可视化对象中，`Max\
  \ of Totals` 度量值效果更好\n\n现在让我们考虑另一种场景。也许你想要通过编程方式识别哪种葡萄酒的总箱数最大（在本例中是“波尔多”），而不是计算总箱数的最大值。\n\
  \n在这种情况下，对于每种葡萄酒的评估，我们必须计算所有葡萄酒总箱数的最大值。然后，我们可以将此最大值与每种葡萄酒的总箱数进行比较。因此，我们必须使用`ALL`或`ALLSELECTED`来移除对`Wines`维度的筛选，如下例所示：\n\
  \n```\nMax of Totals #2 =\nMAXX (\nALL ( Wines ) , [Total Cases] )\n```\n\n在此度量值中，我们使用`ALL`生成一个包含`Wines`维度中所有行的虚拟表，因此，`MAXX`将迭代此临时表中的所有行。上下文转换为每一行计算总箱数，而`MAXX`则找到这些值中的最大值。如果你有一个筛选葡萄酒的切片器，你必须使用`ALLSELECTED`，它将输出一个包含切片器中筛选出的葡萄酒的虚拟表。\n\
  \n现在，我们可以编写一个度量值，使用`Max of Totals #2`度量值中的表达式作为变量，专门返回具有最大售出箱数的葡萄酒名称：\n\n```\nWine\
  \ with Max =\nVAR MyMax =\nMAXX ( ALL ( Wines ), [Total Cases] )\nRETURN\nCALCULATE\
  \ ( VALUES (Wines[WINE] ),\nFILTER ( Wines, [Total Cases] = MyMax ) )\n```\n\n注意，这里使用了`VALUES`函数来返回将根据筛选表达式进行筛选的葡萄酒名称。\n\
  \n![Figure 15-23](img/523050_1_En_15_Fig23_HTML.jpg)\n\n**图 15-23** `Max of Totals\
  \ #2` 返回所有葡萄酒的最大值。然后我们可以使用此表达式来查找具有最大值的葡萄酒\n\n你可以在图 15-23 中看到这些度量值的结果。请注意，我们如何在卡片可视化对象中使用`Wine\
  \ with Max`度量值，以显示由`VALUES`返回的标量值。\n\n在前面的示例中，我们使用`ALL`生成一个包含`Wines`维度中所有行和所有列的虚拟表。在下一节中，我们将看到我们同样可以使用`ALL`生成一个仅包含`WINE`列的虚拟表。\n\
  \n### 在虚拟表中聚合\n\n到目前为止，我们探讨了使用维度表通过上下文转换查找总计值的最大值。然后，我们使用`ALL`生成一个虚拟的`Wines`维度来查找所有葡萄酒总计值的最大值。因此，我们知道上下文转换也可以在虚拟表中生成。现在，我们准备探讨如何使用`ALL`构建仅包含表达式所需的列（而不是表中的所有列）的虚拟表的示例。因为`ALL`将返回一个包含一列或多列非重复值的表，所以我们实际上是在使用`ALL`来对数据进行分组，以便上下文转换能够计算这些临时分组的总计值。\n\
  \n\n\n### 使用 `ALL` 在同一张表中对列进行分组\n\n例如，我们需要计算每种葡萄酒的总销售额与这些总额平均值之间的差异。考虑以下度量值，它使用上下文转换来计算各葡萄酒“总销售额”的平均值。不过，这次我们在`WINE`列上使用`ALL`函数，而不是在葡萄酒表上使用`ALL`：\n\
  \n```\nAverage of Totals =\nAVERAGEX ( ALL ( Wines[WINE] ), [Total Sales] )\n```\n\
  \n如前所述，根据报表中的筛选器，你可能需要用`ALLSELECTED`来代替`ALL`。\n\n我们来看一下该度量值求值过程中的三个步骤：\n\n1. `ALL`函数创建一个虚拟表，其中包含单个列，该列保存`WINE`列中唯一值的列表。\n\
  2. `AVERAGEX`随后迭代该虚拟表，并使用上下文转换计算由`ALL`生成的虚拟表中每种葡萄酒的“总销售额”度量值。\n3. `AVERAGEX`计算这些值的平均值。\n\
  \n在图 15-24 中，你可以看到由`ALL`生成的虚拟表，以及如何计算总值的平均值。\n\n![](img/523050_1_En_15_Fig24_HTML.jpg)\n\
  \n**图 15-24** – `ALL`函数创建了一张只包含`WINE`列的虚拟单列表。`AVERAGEX`迭代该表，上下文转换计算每一行的“总销售额”。`AVERAGEX`求取这些值的平均值。\n\
  \n现在我们可以修改这个度量值，计算每种葡萄酒的总销售额与平均值的差异，并将数据可视化；参见图 15-25。\n\n```\nVariance from Average\
  \ of Totals =\nVAR AvgOfTotals =\nAVERAGEX ( ALL ( Wines[WINE] ), [Total Sales]\
  \ )\nRETURN\n[Total Sales] -  AvgOfTotals\n```\n\n![](img/523050_1_En_15_Fig25_HTML.jpg)\n\
  \n**图 15-25** – 使用上下文转换计算总值的平均值，然后我们可以找到方差。\n\n这里，我们一直使用`ALL`按`WINE`列中的值进行分组。实际上，我们也可以使用`ALL`按销售人员、客户或地区进行分组，方法是通过生成只包含这些维度中相应实体名称列表的表。\n\
  \n然而，如果我们想将上下文转换传递到`DateTable`，问题就会变得稍微复杂一些。例如，表达式\n\n```\nAverage Daily Sales For\
  \ Dates =\nAVERAGEX (DateTable, [Total Sales])\n```\n\n会将上下文转换传递到`DateTable`中的每一行，从而聚合每天的销售总额。因此，该度量值会计算日均销售额。但是，这可能并不是你感兴趣的日期粒度。也许你想计算每年平均季度销售额，如图\
  \ 15-26 所示。这里，我们编写了度量值“Average Quarterly for Each Year”（每年平均季度销售额），并将其放入矩阵视觉对象中。请注意，如果视觉对象只显示`DateTable`中的`YEAR`列，该度量值效果最佳。\n\
  \n![](img/523050_1_En_15_Fig26_HTML.jpg)\n\n**图 15-26** – “Average Quarterly for\
  \ Each Year”度量值在仅显示年份的矩阵视觉对象中效果最佳。\n\n在图 15-26 的矩阵视觉对象中，在评估“2017”年的销售额时，`DateTable`的`YEAR`列上有一个筛选器。现在，我们必须生成一个虚拟单列表，该表保留`YEAR`列的筛选器，但列出该年份的所有四个季度，我们可以使用`ALL`函数引用`QTR`列来实现这一点。然后`AVERAGEX`可以迭代这个表，并使用上下文转换计算“2017”年每个季度的总销售额，并求出这些值的平均值。这是我们在度量值中使用的代码：\n\
  \n```\nAverage Quarterly for Each Year =\nAVERAGEX ( ALL ( DateTable[QTR] ), [Total\
  \ Sales] )\n```\n\n在评估“2017”年平均值时，由`ALL`生成的虚拟表将如图 15-27 所示。\n\n![](img/523050_1_En_15_Fig27_HTML.jpg)\n\
  \n**图 15-27** – `ALL`函数构建了一个包含筛选年份中所有季度的表。\n\n`ALL`函数还可以生成包含来自同一表的多列的唯一*组合*的虚拟表，使你能够按这些组合进行分组。例如，你可以使用以下表表达式，用`ALL`生成一个包含来自`DateTable`的年份和季度唯一列表的虚拟表：\n\
  \n```\nALL ( DateTable[YEAR], DateTable[QTR] )\n```\n\n由`ALL`生成的这样的虚拟表如图 15-28 所示。\n\
  \n![](img/523050_1_En_15_Fig28_HTML.jpg)\n\n**图 15-28** – 使用`ALL`引用同一表中的多个列会生成一个包含这些值唯一组合的表。\n\
  \n使用上下文转换和生成图 15-28 中表的`ALL`表达式，你可以像以下度量值一样找出所有年份的平均季度总销售额：\n\n```\nAverage Quarterly\
  \ for All Years =\nAVERAGEX (\nALL ( DateTable[YEAR], DateTable[QTR] ),\n[Total\
  \ Sales] )\n```\n\n这里，`ALL`函数创建了一个内存表，该表生成一个结合了`YEAR`列和`QTR`列的唯一列表，然后`AVERAGEX`使用上下文转换求出“总销售额”值的平均值；参见图\
  \ 15-29。\n\n![](img/523050_1_En_15_Fig29_HTML.jpg)\n\n**图 15-29** – `ALL`函数生成一个虚拟表，其中包含来自同一表多个列的值唯一组合。上下文转换可以被传递到此表以计算平均值。\n\
  \n我们可以理解，在一个包含`YEAR`和`QTR`列的矩阵中查看该度量值，其中返回的值是重复的，这并不会给查看报表的人带来多大帮助。就像之前的“Max of\
  \ Totals”度量值一样，当你在`DateTable`上没有筛选器时（如图 15-30 所示），“Average Quarterly for All Years”度量值的效果最佳。\n\
  \n![](img/523050_1_En_15_Fig30_HTML.jpg)\n\n**图 15-30** – 在分析除`DateTable`之外的实体时，“Average\
  \ Quarterly for All Years”度量值效果很好。\n\n这里，我们正在通过比较销售人员的平均季度总销售额值来分析他们的销售业绩。\n\n\n\
  \n#### 使用 `SUMMARIZE` 对相关表中的列进行分组\n\n通常我们可以使用 `ALL` 或 `ALLSELECTED` 将列分组到虚拟表中，以便利用上下文转换对临时分组执行计算。只有在极少数情况下，你才需要使用另一个名为\
  \ `SUMMARIZE` 的函数来完成此任务，即当你需要从*不同*表中对列进行分组时。\n\n`SUMMARIZE` 函数允许你从同一表或*一个或多个相关表*中检索列的组合。正如我们之前所见，我们通常可以使用\
  \ `ALL` 对同一表中的列进行分组，因此 `SUMMARIZE` 通常仅在需要对来自不同相关表的列进行分组时使用。\n\n`SUMMARIZE` 函数的语法如下：\n\
  \n`= SUMMARIZE ( table, group by column1, group by column2 etc., name, expression\
  \ )`\n\n其中：\n\n- `table` 是包含你要分组的列的表或表表达式。\n- `group by columns` 是你希望据此对数据进行分组的列。这些列可以来自同一表，也可以来自相关表。\n\
  - `name`（可选）是你稍后在表达式参数中希望生成的表达式的名称。这是一个非必需参数。\n- `expression`（可选）是一个将对虚拟表中每一行计算的表达式。这是一个非必需参数。\n\
  \n大多数情况下，你只会在 `SUMMARIZE` 中使用前两个参数，即指定一个表和分组列，如下所示：\n\n`=SUMMARIZE ( Winesales,\
  \ Wines[WINE], DateTable[YEAR] )`\n\n此表表达式构建了一个虚拟表，首先按 `WINE` 列分组，然后按 `YEAR` 列分组。之所以能做到这一点，是因为\
  \ `Wines` 表和 `DateTable` 都与 `Winesales` 表相关。\n\n然而，使用 `ALL` 生成临时的列分组与使用 `SUMMARIZE`\
  \ 之间有一个很大的区别，那就是 `SUMMARIZE` 构建的虚拟表仅包含当前筛选上下文中的值。因此，通常需要将 `ALL` 函数嵌套在 `SUMMARIZE`\
  \ 内部，以移除这些筛选器。\n\n借助 `SUMMARIZE` 内部的另外两个参数（即“name”和“expression”），你可以选择性地在虚拟表中创建计算，我们将在下一章看一个这样的示例。但是，通常为了利用上下文转换对这些分组创建计算，你可以将\
  \ `SUMMARIZE` 生成的表嵌套在 `MAXX` 和 `AVERAGEX` 等函数内部，然后由这些函数执行计算。\n\n使用 `SUMMARIZE`，你可以对来自相关表的列进行分组。例如，如果你在\
  \ `SUMMARIZE` 内部引用的表是一个事实表，那么你可以按与该事实表相关的维度中的任何列进行分组。\n\n如果你使用 Power BI 建模选项卡上的**新建表**按钮，你可以使用表函数创建*计算表*。这是一种查看表表达式（例如涉及\
  \ `SUMMARIZE` 的表达式）输出的便捷方法。你可以在数据视图中查看计算表，就像查看数据模型中的任何表一样。但是，当 `SUMMARIZE` 表达式嵌套在度量值内部时，其输出将根据筛选上下文在内存中被筛选，这是你在数据视图的计算表中无法看到的。\n\
  \n我们可以使用 `SUMMARIZE` 通过以下表表达式对来自 `Wines` 维度的 `WINE` 列和来自 `DateTable` 的 `YEAR` 列进行分组：\n\
  \n```\nWine and Year Table =\nSUMMARIZE ( Winesales,\nWines[WINE], DateTable[YEAR]\
  \ )\n```\n\n在图 15-31 中，你可以看到此表表达式在通过**新建表**按钮创建的计算表中使用时的结果。\n\n![](img/523050_1_En_15_Fig31_HTML.jpg)\n\
  图 15-31\n\n使用 `SUMMARIZE` 生成包含 `WINE` 和 `YEAR` 列的表\n\n让我们看一个可能需要使用 `SUMMARIZE` 生成此虚拟表的场景，请记住，此类表将在当前筛选上下文中构建。我们想要计算所有葡萄酒的年度销售总额平均值，并将其显示在卡片视觉对象中。这是我们将使用\
  \ `SUMMARIZE` 按 `WINE` 和 `YEAR` 进行分组来编写的度量值（注意使用变量来存储虚拟表）。\n\n```\nYearly Average\
  \ =\nVAR SummaryTable = SUMMARIZE ( ALL ( Winesales ), Wines[WINE], DateTable[YEAR]\
  \ )\nRETURN\nAVERAGEX ( SummaryTable, [Total Sales] )\n```\n\n你可以在图 15-32 中看到，我们的葡萄酒年度销售额平均值为\
  \ **$457,423**。为了理解这个平均值，你可以创建一个簇状柱形图视觉对象，绘制每年葡萄酒的销售额。如果随后显示一条平均分析线，该线将显示与你在此度量值中计算的值相同的值。\n\
  \n![](img/523050_1_En_15_Fig32_HTML.jpg)\n图 15-32\n\n使用 `SUMMARIZE` 和上下文转换计算所有葡萄酒的年度平均值。这将是“分析”平均线所计算的平均值。\n\
  \n在“Yearly Average”度量值中，嵌套的“Total Sales”度量值使用上下文转换来计算由 `SUMMARIZE` 生成的虚拟表中每个 `WINE`\
  \ 和 `YEAR` 组合的销售额。`AVERAGEX` 函数将计算由上下文转换返回的值的平均值。请注意在 `Winesales` 表上使用了 `ALL` 函数，以移除矩阵视觉对象中来自\
  \ `WINE` 列和 `YEAR` 列的筛选器。请记住，除非你使用 `ALL`，否则 `SUMMARIZE` 函数创建的汇总表仅包含*当前筛选上下文内*的值。\n\
  \n或者，如果我们将此度量值放入不使用 `WINE` 或 `YEAR` 列的表中，则不需要使用 `ALL` 函数，如图 15-33 所示，其中我们使用了 `REGION`\
  \ 列。在这里，我们正在分析每个地区葡萄酒年度销售总额的平均值。\n\n```\nYearly Average =\nVAR SummaryTable = SUMMARIZE\
  \ (  Winesales , Wines[WINE], DateTable[YEAR] )\nRETURN\nAVERAGEX ( SummaryTable,\
  \ [Total Sales] )\n```\n\n![](img/523050_1_En_15_Fig33_HTML.jpg)\n图 15-33\n\n针对各地区计算得到的“Yearly\
  \ Average”度量值\n\n计算完所有年份所有葡萄酒的平均年度销售额后，你可能想要计算每种葡萄酒的平均年度销售额。或许再次提到，这是为了计算与平均值的偏差。如果是这种情况，这是你需要的代码：\n\
  \n```\nYearly Average Each Wine =\nVAR Summarytable =\nSUMMARIZE ( ALLEXCEPT ( Winesales,\
  \ Wines[WINE] ), DateTable[YEAR] )\nRETURN\nAVERAGEX ( Summarytable, [Total Sales]\
  \ )\n```\n\n我们在此上下文中能够使用 `ALLEXCEPT` 函数的原因将在第 18 章探讨表扩展概念时进行解释。我们在这里只需注意，通过使用 `ALLEXCEPT`，筛选器已从\
  \ `YEAR` 列中移除，而保留了 `WINE` 列上的筛选器。因此，这使我们能够传递每种葡萄酒在每一年份的销售平均值。然后，此度量值将计算偏差，但仅按 `YEAR`\
  \ 粒度计算：\n\n```\nVariance from Average Each Yr =\nIF (\nHASONEVALUE ( DateTable[YEAR]\
  \ ),\n[Total Sales] - [Yearly Average Each Wine] )\n```\n\n你可以在图 15-34 中看到“Yearly\
  \ Average Each Wine”和“Variance from Average Each Yr”度量值的结果。\n\n![](img/523050_1_En_15_Fig34_HTML.jpg)\n\
  图 15-34\n\n“Yearly Average Each Wine”和“Variance from Average Each Yr”度量值\n\n\n\n"
- "# 16. 善用上下文转换\n\n在上一章中，您学习了如何利用上下文转换将数据以编程方式聚合到维度和虚拟表中。然后，您可以编写表达式，以更高的粒度对数据进行分组和聚合。一旦您掌握了以这种方式使用\
  \ DAX 的技能，DAX 的世界将为您打开一扇广阔的大门。您现在将能够编写更复杂的计算，从而获得更深入的数据洞察。在本章中，您将运用所学的上下文转换知识来解决以下数据分析问题：\n\
  \n我该如何\n\n-   对实体进行排名？\n-   将度量值划分到数字范围区间？\n-   使用动态参数计算前 N% 或后 N%？\n-   在客户群中寻找同比可比销售额？\n\
  -   使用计算列计算表中的累计总和？\n-   计算计算列中前一行数值的差值？\n\n在生成这些洞察的过程中，您将学到可迁移的技能和技巧，您可以吸收这些知识，扩展思路，并将其应用于自己的数据。\n\
  \n## 数据排名：认识 `RANKX`\n\n您已经了解到，通过将迭代函数与度量值（隐式调用 `CALCULATE`）结合使用，可以享受到上下文转换带来的好处。让我们借此机会了解一下另一个迭代函数\
  \ `RANKX`。\n\n`RANKX` 函数的语法如下：\n\n```\n= RANKX ( table, expression, value, order,\
  \ ties )\n```\n\n其中：\n\n-   **table** 是您要迭代以对项目进行排名的表。此表通常由 `ALL` 函数生成，因此排名是在表的所有行上执行的，而不仅仅是在当前筛选器中的行上。\n\
  -   **expression** 是用于对项目进行排名的度量值或表达式。\n-   **value** 是可选参数，用于比较要排名的项目（很少使用）。\n\
  -   **order** 是可选参数 – `ASC`（1 为最低排名）或 `DESC`（1 为最高排名）。默认值为 `DESC`。\n-   **ties**\
  \ 是可选参数，可以是 `Skip` 或 `Dense`，具体如下：\n    -   **Skip** 表示并列项之后的下一个排名值是该并列项的排名值加上并列值的数量。例如，如果有\
  \ 5 个值并列排名第 11，则下一个值将获得排名 16 (11 + 5)。当省略 `ties` 参数时，此为默认值。\n    -   **Dense** 表示并列项之后的下一个排名值是下一个排名值。例如，如果有\
  \ 5 个值并列排名第 11，则下一个值将获得排名 12。\n\n以下是 `RANKX` 语法的一个示例：\n\n```\n= RANKX ( ALL (Wines),\
  \ [Total Sales], ASC)\n```\n\n顾名思义，我们可以使用此函数按特定度量值对实体进行排名，例如，按“总销售额”度量值对我们的葡萄酒进行排名；参见图\
  \ 16-1。\n\n**图 16-1** 按“总销售额”对葡萄酒进行排名\n\n这是“葡萄酒排名”度量值的 DAX 代码：\n\n```\nRank Wine\
  \ =\nIF ( [Total Sales],\nRANKX ( ALL ( Wines ), [Total Sales] ) )\n```\n\n该度量值首先检查是否存在“总销售额”值；否则，评估时将考虑值为空的项目，例如没有销售额的“兰布鲁斯科”葡萄酒。如果存在销售额值，该度量值会使用\
  \ `ALL` 构建一个包含表中所有行的虚拟葡萄酒表。然后，它利用上下文转换计算“总销售额”值，遍历每一行。最后，它将当前筛选器中的销售额值与 `ALL` 返回的表中的所有值进行比较排名，并返回其排名值。\n\
  \n让我们来看另一个使用 `RANKX` 的示例。例如，您可能希望按每年的销售额对财务季度进行排名，如图 16-2 所示。\n\n**图 16-2** 使用 `RANKX`\
  \ 对财务季度进行排名\n\n在图 16-2 的矩阵视觉对象中，第一个排名评估是针对“2017”年的“Qtr 1”，相应的筛选器会应用于 DateTable。在这里，您必须使用\
  \ `ALL` 函数生成一个虚拟表，该表包含 DateTable 的 `QTR` 列中所有四个值（即“Qtr 1”、“Qtr 2”、“Qtr 3”、“Qtr 4”）的列，且仅针对“2017”年。这样，就可以利用上下文转换对该年度所有四个季度的销售额值进行排名。这是您可以在此处创建的度量值：\n\
  \n```\nRank by Qtr =\nRANKX ( ALL ( DateTable[QTR] ), [Total Sales] )\n```\n\n但是，如果您将此度量值放入矩阵视觉对象中，您会注意到\
  \ YEAR 列的排名为“1”，因为只有一个小计值需要排名。为避免此无关值，您可以使用 `HASONEVALUE` 函数仅返回 `QTR` 列的一个值：\n\n\
  ```\nRank by Qtr #2 =\nIF ( HASONEVALUE(DateTable[QTR] ),\nRANKX ( ALL ( DateTable[QTR]\
  \ ), [Total Cases] ))\n```\n\n注意\n\n在前面的示例中，我们在 `RANKX` 内部使用了 `ALL` 函数，但请记住，如果画布上有切片器，您可能需要改用\
  \ `ALLSELECTED` 函数。\n\n在本章稍后部分，当我们使用 `RANKX` 对客户进行排名时，我们将再次遇到它。不过，本节最重要的收获是理解 `RANKX`\
  \ 如何作为一个迭代函数与度量值一起使用，从而触发上下文转换。\n\n\n\n## 将度量值分箱到数值范围中\n\n在 Power BI 中分析数据时，一个常见的需求是将度量值的结果分箱到数值范围中。参考图\
  \ 16-3 左侧的视觉对象。它显示我们有九位客户的“总销售额”值大于 800,000。在右侧的表格视觉对象中，我们可以看到这些客户是谁。\n\n![](img/523050_1_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3 – 将“总销售额”分箱到数值范围\n\n此分析的起点是生成一个定义所需范围的参数表。你在第 12 章中探索 `SELECTEDVALUE` 函数时，已经学习了如何创建参数表。要生成参数表，请使用\
  \ **主页** 选项卡上的 **输入数据** 按钮。我们将此表命名为“销售分箱”，你可以在图 16-4 中看到它。与所有参数表一样，它与数据模型中的任何其他表都没有关联。\n\
  \n![](img/523050_1_En_16_Fig4_HTML.jpg)\n\n图 16-4 – “销售分箱”参数表\n\n接下来，作为数据视图中的 *计算列*，在“销售分箱”表中，我们可以编写以下表达式，用于统计销售额落在范围值之间的客户数量：\n\
  \n```\n客户数量列 =\nCOUNTROWS (\n    FILTER (\n        客户表,\n        [总销售额] >= '销售分箱'[最小值]\n\
  \            && [总销售额] <= '销售分箱'[最大值] ) )\n```\n\n你可以在图 16-5 中看到此表达式的结果。\n\n![](img/523050_1_En_16_Fig5_HTML.jpg)\n\
  \n图 16-5 – 首先将客户分箱到计算列中\n\n让我们仔细看看“客户数量列”的计算过程。因为我们使用的是计算列，所以会迭代“销售分箱”表，当前行中的 `最小值`\
  \ 和 `最大值` 将用于计算。`FILTER` 函数使用的 `[总销售额]` 度量值会在 `客户表` 中触发上下文转换，从而在内存中返回每位客户的总销售额值，正是这个值被用于与“销售分箱”表当前行中的范围值进行比较。然后，`COUNTROWS`\
  \ 函数对 `FILTER` 生成的虚拟 `客户表` 中的行数进行计数。在图 16-6 中，我们逐步演示了此表达式的计算过程。\n\n![](img/523050_1_En_16_Fig6_HTML.jpg)\n\
  \n图 16-6 – 对“客户数量列”计算列的计算过程\n\n1. 表达式迭代“销售分箱”表。`FILTER` 生成一个虚拟的 `客户表`，该表使用“销售分箱”表当前行中的范围值进行筛选。\n\
  \n2. `COUNTROWS` 对虚拟 `客户表` 中的行数进行计数。\n\n3. `COUNTROWS` 返回的值在“销售分箱”表的当前行中进行计算。\n\n\
  然而，我们不希望这些值存在于计算列中；我们希望它们存在于度量值中，这样我们就能将其放入表格视觉对象中，从而对数据进行切片和切块。我们在第 5 章中学到，通常可以将计算列中计算的表达式转换为作为度量值计算的表达式。在那里，我们采用了表达式\
  \ `Winesales[CASESSOLD] * RELATED ( Wines[PRICEPERCASE] )`，并将其封装在 `SUMX` 内部。我们可以对计算列进行同样的操作，请记住必须由\
  \ `SUMX` 迭代的是“销售分箱”表：\n\n```\n具有这些总销售额的客户数量 =\nSUMX (\n    '销售分箱',\n    COUNTROWS\
  \ (\n        FILTER (\n            客户表,\n            [总销售额] >= '销售分箱'[最小值]\n   \
  \             && [总销售额] <= '销售分箱'[最大值] ) ) )\n```\n\n然后，你可以在画布上放置一个表格视觉对象，并用“销售分箱”表中的\
  \ `范围` 列填充它。接着，将“具有这些总销售额的客户数量”度量值放入这个表格中，如图 16-3 所示。\n\n### 计算前 N%的客户\n\n在此示例中，你将把迄今为止学到的所有\
  \ DAX 知识付诸实践，编写一个复杂的度量值。\n\n挑战在于找到一种方法，以动态方式浏览表现最佳和表现最差的客户。要求通过按销售额找出前 N%和后 N%的客户来实现，其中“前”和“后”以及“N”可以通过切片器动态选择。你还希望按维度表中的任何实体（例如按销售人员或按区域）浏览客户的销售额。\n\
  \n你可以在图 16-7 中看到我们已经解决了这个场景。在表格视觉对象中，你可以看到我们正在查看销售人员“Abel”的销售额处于后 10%的客户。\n\n![](img/523050_1_En_16_Fig7_HTML.jpg)\n\
  \n图 16-7 – 按销售额排名的前或后百分比客户\n\n度量值“前/后百分比客户”是一个引人注目的例子，展示了在 DAX 表达式中使用上下文转换来获取数据洞察。现在你可以学习如何自己重现这个示例。\n\
  \n设置此分析有两个步骤：\n\n1. 创建切片器，用于选择百分比以及选择前或后。\n\n2. 创建度量值，用于找出切片器中选择的前或后百分比，该度量值还会响应销售人员切片器。\n\
  \n#### 创建切片器\n\n“前或后”和“百分比”切片器使用参数表。我们将这些表命名为“选择百分比”和“选择前或后”，两个表都只包含单个列，即 `前或后`\
  \ 和 `百分比`，如图 16-8 所示。\n\n![](img/523050_1_En_16_Fig8_HTML.jpg)\n\n图 16-8 – 用于前/后和百分比的参数表\n\
  \n使用这两个表中的列来填充两个切片器。\n\n\n\n#### 创建度量值以查找切片器中选择的前后百分比\n\n在“前/后 PC 客户”度量值中使用了本书迄今为止所学的许多技巧。让我们思考一下，为了得出此度量值的正确\
  \ DAX 代码，你需要做些什么。\n\n- 你将在整个表达式中使用变量来分离评估的每个部分。\n- 你将使用 `SELECTEDVALUE` 函数来获取切片器中选择的值，即“前（Top）”或“后（Bottom）”，以及要计算的百分比。\n\
  - 选定的百分比用于查找基础排名。例如，如果切片器中选择 10%，并且有 84 个有销售额的客户，则必须查找排名小于 8.4 的客户。对于排名靠前的客户（前 =\
  \ 1），你将按降序对客户进行排名；对于排名靠后的客户（后 = 1），则按升序排名。因此，在这两种情况下，你都要查找排名小于 8.4 的客户。\n- 使用上下文转换和\
  \ `RANKX` 函数，你将根据客户的“总销售额”值，对客户进行前或后的排名。\n- 由于在查找后百分比时，默认情况下会对没有销售额的客户进行排名，因此必须筛选客户表，以便仅对有销售额的客户进行排名。\n\
  - 使用 `FILTER` 函数，你将筛选出排名（例如）小于 8.4（如果查找 10%）的前或后客户。\n- 由于度量值必须返回一个标量值，现在必须为筛选后的客户计算“总销售额”度量值。\n\
  - 最后，你必须编写一个计算，根据切片器的选择，返回排名靠前的客户或排名靠后的客户的“总销售额”。\n\n这是你现在可以编写的度量值（我们在表达式的每个部分下添加了注释以解释代码的目的）：\n\
  \n```\nTop/Bottom PC Customers =\nVAR PercentToFind =\n    COUNTROWS ( ALL ( Customers\
  \ ) ) * SELECTEDVALUE ( 'Select Percent'[Percent] )\n    -- 使用切片器选择获取百分比\nVAR TopOrBottom\
  \ =\n    SELECTEDVALUE ( 'Select Top or Bottom'[Top or Bottom] )\n    -- 使用切片器选择获取是“前”还是“后”\n\
  VAR RankCustsTop =\n    RANKX ( ALL ( Customers ), [Total Sales] )\n    -- 按总销售额值降序排列客户（前\
  \ = 1）\nVAR RankCustsBottom =\n    RANKX (FILTER( ALL ( Customers ),NOT(ISBLANK([Total\
  \ Sales]))), [Total Sales], ASC )\n    -- 按总销售额值升序排列客户（后 = 1），但仅限于有销售额的客户\nVAR FindCustsTop\
  \ =\n    FILTER ( Customers, RankCustsTop <= PercentToFind )\n    -- 筛选排名小于或等于 PercentToFind\
  \ 的靠前客户\nVAR FindCustsBottom =\n    FILTER ( Customers, RankCustsBottom <= PercentToFind\
  \ )\n    -- 筛选排名小于或等于 PercentToFind 的靠后客户\nVAR CalcSalesTop =\n    CALCULATE ( [Total\
  \ Sales], FindCustsTop )\n    -- 计算排名靠前客户的“总销售额”\nVAR CalcSalesBottom =\n    CALCULATE\
  \ ( [Total Sales], FindCustsBottom )\n    -- 计算排名靠后客户的“总销售额”\nRETURN\n    IF ( HASONEVALUE\
  \ ( Customers[CUSTOMER NAME] ),\n        -- 测试当前评估是否不是针对“总计”行。\n        IF ( TopOrBottom\
  \ = \"top\",  CalcSalesTop, CalcSalesBottom  ),\n        -- 非“总计”行的计算\n        CALCULATE\
  \ ( [Total Sales],\n            ALLSELECTED (Customers[CUSTOMER NAME] ) ) )\n  \
  \      --“总计”行的计算\n```\n\n请注意 `RETURN` 表达式，如果计算是针对“总计”行的，它将执行不同的代码。这是为了解决用户选择“后”百分比且在“总计”行中未显示值的问题。这是因为“总计”行的评估方式与对每个客户的评估方式相同。因此，总是大于各个销售值的“总计”行值，在向后排名中会被赋予\
  \ 85（如果有 84 个有销售额的客户），因为向后排名是升序的（较大的值获得较大的排名数字）。因此，“总计”行未能通过 `FILTER` 执行的向后排名测试，所以“总计”行中没有数据可显示。\n\
  \n因此，你必须为“总计”行编写一个不同的表达式，以确保“总计”行对可视化对象中显示的客户的销售总额进行求和。要测试评估是否*不是*针对“总计”行，可以使用 `HASONEVALUE`\
  \ 函数。然后，你可以使用 `ALLSELECTED` 函数，仅计算可视化对象中所显示客户的“总销售额”值。\n\n然而，我们尚未解决这个问题，因为你会注意到，在此阶段，“总计”行显示的是“Abel”*所有*客户的总销售额；参见图\
  \ 16-9。\n\n![](img/523050_1_En_16_Fig9_HTML.jpg)\n\n图 16-9\n\n“总计”行不正确\n\n这是因为 `ALLSELECTED`\
  \ 表达式独立于排名计算来计算“总销售额”度量值，因此客户表上没有可供 `ALLSELECTED` 移除的筛选器。因此，要在客户表上放置一个筛选器，你可以使用视觉级筛选器，用“总销售额”度量值填充它，并将筛选器设置为“当值不为空时显示项目”；参见图\
  \ 16-10。\n\n![](img/523050_1_En_16_Fig10_HTML.jpg)\n\n图 16-10\n\n如果你为 `ALLSELECTED`\
  \ 提供了一个视觉级筛选器以移除，则“总计”行是正确的\n\n最后，你可以更改切片器的选择，度量值会相应重新计算，利用我们出色的 DAX 工具——上下文转换，找到你最好和最差的客户。\n\
  \n你可能会觉得我们在这里实现的动态客户排名是一次相当令人生畏的经历。似乎一旦你“破解”了客户排名的明显计算，就会出现意想不到的问题，例如如何评估“总计”行。我现在要告诉你，这很正常。这就是\
  \ DAX 实际应用中的真实情况，你开始意识到，你首先必须做的是*彻底思考*。为什么我的表达式大部分时间能返回正确结果，但有时却只返回奇怪的结果？始终要彻底思考你的度量值是如何被评估的，特别是它被放置的评估上下文。\n\
  \n\n\n## 使用 `SUMMARIZE` 计算“同比”年度销售额\n\n在本书中，我们一直以多种方式分析客户销售额。然而，我们尚未探讨的一个更具洞察力的指标是计算同比销售额，以便在客户之间进行更准确的比较。\n\
  \n让我们先设置场景。我们想要分析客户在 2019、2020 和 2021 年对“基安蒂”葡萄酒的销售额。在切片器中多选年份的问题在于，我们的“总销售额”度量值会筛选出在*任意*选定年份有“基安蒂”销售额的客户，而不是在*所有*选定年份都有销售额的客户；见图\
  \ 16-11。\n\n![](img/523050_1_En_16_Fig11_HTML.jpg)\n\n**图 16-11** 多选年份会返回在任意选定年份有销售额的客户，而非在所有选定年份都有销售额的客户\n\
  \n然而，我们希望在一个切片器中选择一个年份范围，并找出在*所有*选定年份都购买了“基安蒂”的客户，以便我们能够在总量上进行同比比较。例如，在图 16-11 中，我们可以看到在\
  \ 2019、2020 和 2021 年，“Burningsuit Ltd”在这三年中都有“基安蒂”的销售额，但“Ballard & Sons”仅在 2020\
  \ 年有销售额，“Barstow Ltd”仅在 2021 年有销售额。因此，在考虑这三个客户对“基安蒂”的销售额时，这三年的总销售额并非同比数据。\n\n提供我们所需分析的视觉对象如图\
  \ 16-12 所示。在这里，我们在切片器中选择了“基安蒂”葡萄酒以及 2019、2020 和 2021 年，表格视觉对象仅显示在所有这些年都有“基安蒂”销售额的客户数据。\n\
  \n![](img/523050_1_En_16_Fig12_HTML.jpg)\n\n**图 16-12** 计算 2019 年至 2021 年“基安蒂”葡萄酒的同比销售额\n\
  \n为了理解我们必须编写的用于计算此类销售额的代码，我们将把计算分解为几个步骤：\n\n1.  识别在选定年份中有所选葡萄酒销售额的客户。\n2.  计算客户在切片器选定的那些年份中有销售额的年份数量。\n\
  3.  筛选出拥有与切片器选定的年份数相同销售额年份的客户。\n\n让我们看看第 1 步，探讨如何识别那些在选定年份有销售额的客户。为此，我们必须稍微深入一下，重新审视\
  \ `SUMMARIZE` 函数，以了解更多信息。在上一章中，您学习了如何使用 `SUMMARIZE` 生成一个虚拟表，对不同表中的列进行分组。然而，作为 `SUMMARIZE`\
  \ 内部的参数之一，您可以选择包含一个表达式，用于对虚拟表中返回的行进行计算。因此，为了识别我们的客户在哪些选定年份有销售额，我们可以编写以下度量值，其中高亮显示了用于计算每个客户每年总销售额的两个参数：\n\
  \n```\nNo. of Years that Customers have Sales =\nCOUNTROWS (\nSUMMARIZE (\nWinesales,\n\
  Customers[CUSTOMER NAME],\nDateTable[Year],\n\"Sales\", [Total Sales]\n)\n)\n```\n\
  \n我们现在将详细讲解“No. of Years that Customers have Sales”度量值的细节。我们使用 `SUMMARIZE` 来创建图\
  \ 16-13 中所示的虚拟表。我们看不到每个客户的所有年份，因为该表是在其所在矩阵视觉对象的当前筛选上下文中计算的；例如，“Ballard & Sons”仅在\
  \ 2020 年有销售额；见图 16-14。\n\n![](img/523050_1_En_16_Fig13_HTML.jpg)\n\n**图 16-13**\
  \ 在“No. of Years that Customers have Sales”度量值中由 `SUMMARIZE` 生成的虚拟表\n\n您可以看到 `SUMMARIZE`\
  \ 函数包含一个名为“Sales”的表达式，它将返回“Total Sales”度量值。您在 `SUMMARIZE` 内部给这个列起的名称（例如“Sales”）完全是任意的。\n\
  \n我们现在可以将此度量值放入一个矩阵视觉对象中，其中行是 `CUSTOMER NAME`，列是 `YEAR`（图 16-14）。我们还按“基安蒂”葡萄酒以及\
  \ 2019、2020 和 2021 年进行切片。您可以看到，对于每个在选定年份有“基安蒂”销售额的客户，它返回“1”。\n\n![](img/523050_1_En_16_Fig14_HTML.jpg)\n\
  \n**图 16-14** 矩阵视觉对象中的“No. of Years that Customers have Sales”度量值\n\n现在进行第 2 步，我们必须计算客户在切片器选定的那些年份中有销售额的年份数量。请记住，列\
  \ `WINE`、`CUSTOMER` 和 `YEAR` 提供了筛选上下文，我们必须移除来自 `YEAR` 的筛选，以便能够查看我们的客户在切片器中选定的所有年份中对“基安蒂”的销售额。我们可以使用\
  \ `CALCULATE` 配合 `DateTable` 上的 `ALLSELECTED` 来完成此任务，并简单地将我们的 `SUMMARIZE` 表达式嵌套在\
  \ `CALCULATE` 内部：\n\n```\nNo. of Years that Customers have Sales #2=\nCALCULATE\
  \ (\nCOUNTROWS (\nSUMMARIZE (\nWinesales,\nCustomers[CUSTOMER NAME],\nDateTable[Year],\n\
  \"Sales\", [Total Sales]\n)\n),\nALLSELECTED ( DateTable[Year] )\n)\n```\n\n我们可以看到此度量值在图\
  \ 16-15 中返回的值。\n\n![](img/523050_1_En_16_Fig15_HTML.jpg)\n\n**图 16-15** 在矩阵视觉对象中计算的“No.\
  \ of Years that Customers have Sales #2”度量值\n\n我们已经从图 16-13 中知道，“Ballard & Sons”仅在\
  \ 2020 年购买过“基安蒂”，因此他们只在切片器选定的年份中的一年有销售额。\n\n为了完成第 3 步的计算，我们可以筛选 `Customers` 表，使其仅包含那些在“No.\
  \ of Years that Customers have Sales #2”度量值中返回的年份数等于切片器中筛选的年份数的客户，并返回这些客户的“Total\
  \ Sales”值。这就是我们在图 16-14 的视觉对象中使用的“Like for Like Sales”度量值，它返回了我们所需的结果：\n\n```\n\
  Like for Like Sales =\nCALCULATE (\n[Total Sales],\nFILTER (\nCustomers,\n[No. of\
  \ Years that Customers have Sales #2] =\nCOUNTROWS ( ALLSELECTED ( DateTable[Year]\
  \ ) )\n)\n)\n```\n\n图 16-16 展示了此度量值在矩阵视觉对象中的计算情况。\n\n![](img/523050_1_En_16_Fig16_HTML.jpg)\n\
  \n**图 16-16** 针对“基安蒂”葡萄酒计算的“Like for Like Sales”度量值\n\n在上述我们计算同比销售额的场景中，您可能已经注意到，在逐步讲解我们使用\
  \ `SUMMARIZE` 构建的度量值的求值过程时，没有提到任何关于上下文转换的引用。实际上，这些度量值并未使用上下文转换。`SUMMARIZE` 不是一个迭代函数，在没有迭代的情况下，上下文转换不会发生。`SUMMARIZE`\
  \ 计算其“expression”参数的方法很复杂，其解释超出了本书的范围。然而，对于大多数 DAX 用户来说，在使用 `SUMMARIZE` 的表达式中的“Total\
  \ Sales”度量值的行为与上下文转换难以区分。也就是说，我们生成了一个汇总表，并且“Total Sales”度量值是在该粒度级别上计算的。这就是我为什么在本书中收录这个示例的原因。\n\
  \n## 在计算列中使用上下文转换\n\n理解上下文转换也允许您编写更具挑战性的计算列。您将在本节中学到的是，通过在计算列中使用 `CALCULATE`，您可以从只能计算当前行值的行上下文的限制中解放出来。我们现在可以利用上下文转换的强大功能*以编程方式在表上创建筛选器*，从而在计算列中跨这些筛选后的行传递计算值。\n\
  \n\n\n### 计算运行总计\n\n你已在第 9 章（见图 9-10）和第 15 章（见图 15-10）中学习了如何使用度量值计算累计总计。不过，我们现在要计算另一种累计总计，即对\
  \ `CASES SOLD` 列中的数量进行运行总计计算，如图 16-17 所示。使用变量和上下文转换可以使此计算变得直接明了。以下是你可以创建的 DAX 计算列：\n\
  \n![图 16-17](img/523050_1_En_16_Fig17_HTML.jpg)\n\n图 16-17 — 计算列中的“`CUMULATIVE TOTAL`”\n\
  \n```\nCUMULATIVE TOTAL =\nVAR MyDate = Winesales[SALE DATE]\nVAR MyFilter =\nFILTER\
  \ ( Winesales, Winesales[SALE DATE] <= MyDate )\nRETURN\nCALCULATE ( SUM ( Winesales[CASES\
  \ SOLD] ), MyFilter )\n```\n\n变量 `MyDate` 获取当前行中 `SALE DATE` 列的值。变量 `MyFilter` 使用\
  \ `FILTER` 函数创建一个虚拟表，筛选出 `SALE DATE` 小于或等于此日期的行。通过上下文转换，`CALCULATE` 可以使用这个由虚拟表生成的新筛选器来对这些被筛选行的\
  \ `CASES SOLD` 进行求和。\n\n请注意，我们使用了变量 `MyDate` 来获取当前行的日期。在 2015 年 DAX 引入变量之前，我们不得不使用名为\
  \ `EARLIER` 的函数来完成这项工作，如下所示：\n\n```\nCUMULATIVE TOTAL =\nCALCULATE (\nSUM ( Winesales[CASES\
  \ SOLD] ),\nFILTER ( Winesales, Winesales[SALE DATE] <=\nEARLIER ( Winesales[SALE\
  \ DATE] ) )\n)\n```\n\n我想你会同意，使用变量的计算列在创建和理解上都容易得多。\n\n### 计算与上一行值的差异\n\n你已经了解到，计算列在其求值过程中使用行上下文，表达式使用的值是当前行的值。然而，一个常见的问题是如何查找其他行中的值。例如，你可能需要计算销售交易之间的天数差，如图\
  \ 16-18 中的“`DAYS DIFFERENCE`”计算列所示。\n\n![图 16-18](img/523050_1_En_16_Fig18_HTML.jpg)\n\
  \n图 16-18 — “`DAYS DIFFERENCE`”计算列\n\n要进行此计算，我们需要找到上一行中的 `SALE DATE`。\n\n以下是该计算列的表达式：\n\
  \n```\nDAYS DIFFERENCE =\nVAR MyDate = Winesales[SALE DATE]\nVAR PreviousDate =\n\
  CALCULATE (\nMAX ( Winesales[SALE DATE] ),\nFILTER ( WineSales, Winesales[SALE DATE]\
  \ < MyDate ) )\nRETURN\nIF ( PreviousDate, MyDate - PreviousDate )\n```\n\n变量 `MyDate`\
  \ 获取当前行中 `SALE DATE` 的值，例如，**2017 年 1 月 7 日**。变量 `PreviousDate` 使用 `CALCULATE`，从而调用上下文转换，将对行应用筛选器。使用\
  \ `FILTER` 函数，创建一个虚拟表，筛选出 `SALE DATE` 早于 `MyDate` 的行（即所有日期截止到并包括 **2017 年 1 月 6\
  \ 日** 的行）。然后，`CALCULATE` 计算该虚拟表中最晚的日期（使用 `MAX` 函数），即 **2017 年 1 月 6 日**。因此，这个日期就是当前行日期之前紧邻的日期。`RETURN`\
  \ 语句检查是否存在前一个日期，如果存在，则用 `PreviousDate` 生成的日期减去当前行的日期。返回的值是一个日期，所以最后一步是将其数据类型更改为整数。\n\
  \n通过研究本章和上一章中的示例，你已学会如何使用上下文转换来编写更复杂、更具挑战性的表达式。然而，你目前所掌握的只是利用上下文转换所能实现计算的冰山一角。你会找到自己的理由来受益于\
  \ DAX 的这一方面，并且你不再会觉得上下文转换的行为有任何“奇怪”或“令人惊讶”之处，这是因为你现在已经理解它了。\n\n"
- "# 虚拟关系：`LOOKUPVALUE` 和 `TREATAS` 函数\n\n我们的数据模型包含表之间定义良好的物理关系，形成了星型架构。然而，还有另一种我们可以创建的关系类型，那就是“虚拟”关系。虚拟关系是一种模拟数据模型中定义的物理关系行为的\
  \ DAX 表达式。在本章中，你将学习创建能够解决数据模型异常所产生问题的虚拟关系。此类异常可能由以下原因引起：\n\n- 当关系不存在时，例如，当使用查找表时。\n\
  - 表之间的关系不属于星型架构或雪花型架构。\n- 当因为要关联的两个列中都存在重复值而无法创建关系时。\n\n具体来说，我们将深入探讨使用两个创建虚拟关系的函数所带来的结果：`LOOKUPVALUE`\
  \ 和 `TREATAS`。实际上，这两个函数非常不同。`LOOKUPVALUE` 根据函数提供的搜索条件，从（通常是）另一个表中查找并返回一个值。而 `TREATAS`\
  \ 则是一个表函数，它返回一个可用于筛选其他表的虚拟表。然而，它们都用于无法使用物理关系的情况，这就是为什么我们将它们整合到本章中。\n\n\n\n## LOOKUPVALUE\
  \ 函数\n\n我们已经了解，可以使用 `RELATED` 函数从关系的一端将值拉取到多端，这与 Excel 中 `VLOOKUP` 函数的工作方式完全相同。然而，`RELATED`\
  \ 仅在存在多对一关系时才能使用。接下来，让我们看一个无法使用 `RELATED` 的情况。\n\n情况是这样的：目前，我们的葡萄酒每箱只有一个单价，但我们希望根据不同价格区间设定不同的葡萄酒价格。因此，我们在模型中添加了一个名为\
  \ \"Prices\" 的表，用于记录葡萄酒的价格区间，如图 17-1 所示。\n\n![图 17-1](img/523050_1_En_17_Fig1_HTML.jpg)\n\
  \n**图 17-1** — Prices 表记录了每款葡萄酒的价格区间和每箱价格\n\n现在，当我们销售任意一款葡萄酒时，该交易也会在 `Winesales`\
  \ 事实表中记录其价格区间；请参见图 17-2。\n\n![图 17-2](img/523050_1_En_17_Fig2_HTML.jpg)\n\n**图 17-2**\
  \ — 每笔交易都记录了价格区间\n\n在图 17-3 中，您可以看到使用 `WINE ID` 列将葡萄酒与其价格建立多对一关系是非常直接的。\n\n![图 17-3](img/523050_1_En_17_Fig3_HTML.jpg)\n\
  \n**图 17-3** — Prices 表可以通过多对一关系与 Wines 表相关联\n\n然而，您如何找到 `Winesales` 表中每笔交易的价格呢？您不能使用\
  \ `RELATED`，因为该函数只能将值从关系的“一端”填充到“多端”，而 `Prices` 表位于“多端”。更重要的是，价格取决于*两个*条件：葡萄酒及其价格区间。在这种情况下，表之间的关系无法帮助您。实际上，您完全不需要\
  \ `Wines` 和 `Prices` 之间的关系。这里您可以通过在计算列中使用 `LOOKUPVALUE` 来创建一个“虚拟”关系。\n\n`LOOKUPVALUE`\
  \ 函数的语法如下：\n\n**`= LOOKUPVALUE( 结果列名, 搜索列名 1, 搜索值 1, 搜索列名 2, 搜索值 2, ... )`**\n\n\
  - **`结果列名`** 是您希望返回其值的列。\n- **`搜索列名`** 是您想要匹配第一个“搜索值”的列。通常，这是来自不同表的列，但也可以在同一张表中。\n\
  - **`搜索值`** 是需要在“搜索列名”中搜索的值。它可以是列中的值，也可以是任意单个值。\n\n您可以根据需要重复“搜索列名”和“搜索值”对，从而实现多对匹配值的查找。\n\
  \n这是我们需要创建的计算列，您可以在图 17-4 中看到结果：\n\n```sql\nWINE PRICE =\nLOOKUPVALUE (\n    Prices[PRICE\
  \ PER CASE],\n    Prices[WINE ID], Winesales[WINE ID],\n    Prices[PRICE BAND],\
  \ Winesales[PRICE BAND]\n)\n```\n\n这是添加了注释的同一计算列：\n\n```sql\nWINE PRICE =\nLOOKUPVALUE\
  \ (\n    Prices[PRICE PER CASE],\n    --从 Prices 表返回至 Winesales 表的单价\n    Prices[WINE\
  \ ID], Winesales[WINE ID],\n    --在 Prices 表的 WINE ID 列中查找与 Winesales 表当前行 WINE\
  \ ID 匹配的值\n    Prices[PRICE BAND], Winesales[PRICE BAND]\n    -- 并且在 Prices 表的 PRICE\
  \ BAND 列中查找与 Winesales 表当前行 PRICE BAND 匹配的值\n)\n```\n\n![图 17-4](img/523050_1_En_17_Fig4_HTML.jpg)\n\
  \n**图 17-4** — 使用 `LOOKUPVALUE` 的 WINE PRICE 计算列\n\n请注意，在计算列中，我们需要同时匹配 `WINE ID`\
  \ 和 `PRICE BAND`，这正是 `LOOKUPVALUE` 发挥作用的地方。`LOOKUPVALUE` 函数允许您通过匹配任意数量的列，在无关联的表中查找值。\n\
  \n在此，我们必须提醒您，刚才使用 `LOOKUPVALUE` 函数编写的代码现在已略显陈旧。在引入变量之前，它是实现此目标的最简单方式。然而，以下使用变量和\
  \ `CALCULATE` 的代码是另一种替代方法：\n\n```sql\nWINE PRICE #2 =\nVAR currentwine = Winesales[WINE\
  \ ID]\nVAR priceband = Winesales[PRICE BAND]\nRETURN\nCALCULATE ( VALUES ( Prices[PRICE\
  \ PER CASE] ),\n    Prices[PRICE BAND] = priceband,\n    Prices[WINE ID] = currentwine\
  \ )\n```\n\n`WINE PRICE #2` 的性能没有明显差异，因此选择使用哪种表达式是个人偏好。\n\n最后，让我们引用 Alberto Ferrari\
  \ 在其博客中关于 `LOOKUPVALUE` 函数的总结，链接如下：[`www.sqlbi.com/articles/introducing-lookupvalue/`](http://www.sqlbi.com/articles/introducing-lookupvalue/)\n\
  \n> *“如果你的搜索列表仅由单列组成，那么 `LOOKUPVALUE` 几乎从来都不是最佳选择。实际上，当搜索单列时，建立关系总是更好：它速度更快，并且为模型提供了更清晰的结构。另一方面，当你需要搜索多列时，`LOOKUPVALUE`\
  \ 就派上用场了。*\n>\n> *`LOOKUPVALUE` 比模型中的关系更优的另一种场景是，当你设置的条件不是一个单列，而是一个基于多列的更复杂条件时。在这种情况下，`LOOKUPVALUE`\
  \ 提供了比关系更大的灵活性。”*\n\n\n\n## `TREATAS` 函数\n\n要理解 `TREATAS` 函数的需求，我们必须考虑数据模型中现在出现的一个问题。我们在模型中添加了一个“目标”表，用于记录每位销售人员的年度目标；请参见图\
  \ 17-5。\n\n![图 17-5 目标表](img/523050_1_En_17_Fig5_HTML.jpg)\n\n我们希望将销售人员的年销售额与其目标进行比较，如图\
  \ 17-6 所示，该图展示了 2021 年的销售情况。\n\n![图 17-6 销售人员年度目标报表](img/523050_1_En_17_Fig6_HTML.jpg)\n\
  \n“目标”表与“销售人员”表（使用两个表中的 `SALESPERSON ID` 列）之间存在多对一的关系，如图 17-7 所示。由于我们将使用“葡萄酒销售”表和“日期表”，因此图中也展示了这些表在模型中的关联方式。\n\
  \n![图 17-7 “目标”表与“销售人员”表相关联](img/523050_1_En_17_Fig7_HTML.jpg)\n\n我们可以创建一个度量值来计算目标值：\n\
  \n```\n目标 =\nSUM ( 目标[TARGET] )\n```\n\n然后在包含“销售人员”表中 `SALESPERSON` 列和 `YEAR` 列的视觉对象中显示“目标”和“总销售额”度量值。然而，我们应该从哪个表中获取\
  \ `YEAR` 列呢？是从“日期表”还是从“目标”表？这里我们遇到了一个问题：如何在同一视觉对象中，针对每一年同时获取“目标”值和“总销售额”值。根据 `YEAR`\
  \ 来自哪个表，我们会得到不同的计算结果，如图 17-8 所示。\n\n![图 17-8 从“日期表”或“目标”表中获取 YEAR 列都无法得到正确结果](img/523050_1_En_17_Fig8_HTML.jpg)\n\
  \n如果 `YEAR` 列来自“日期表”，则“总销售额”度量值是正确的，但“目标”度量值不正确。如果 `YEAR` 列来自“目标”表，则目标是正确的，但总销售额不正确。现在，如果我们考虑图\
  \ 17-9 中的数据模型，就可以找出问题所在。\n\n![图 17-9 在“日期表”中筛选 YEAR 会筛选事实表，但在“目标”表中筛选 YEAR 不会筛选任何其他表](img/523050_1_En_17_Fig9_HTML.jpg)\n\
  \n如果我们从“日期表”中获取 `YEAR`，则 `YEAR` 筛选器会传播到“葡萄酒销售”事实表，以筛选每年的“总销售额”（由对勾表示），但此筛选器不会通过“销售人员”表进一步传播到“目标”表（由叉号表示），从而无法筛选每年的目标。如果我们从“目标”表中获取\
  \ `YEAR`，这会筛选“目标”表中的 `YEAR`，但不会传播到“葡萄酒销售”表以筛选销售额（由叉号表示）。\n\n一种解决方案是在“目标”表中的 `YEAR`\
  \ 字段与“日期表”中的 `YEAR` 字段之间创建关系。如果这样做，在“目标”表中筛选 `YEAR` 将筛选“日期表”中的 `YEAR`，然后这会传播到事实表。\n\
  \n然而，问题在于在“日期表”和“目标”表中，`YEAR` 列的值都是重复的，因此如果我们尝试建立这种关系，就会生成多对多关系，从而触发此警告消息，如图 17-10\
  \ 所示。\n\n![图 17-10 如果尝试创建多对多关系，将会收到一条警告](img/523050_1_En_17_Fig10_HTML.jpg)\n\n\
  我们被告知，这种关系将产生“显著不同的行为”，除非你了解所采取措施的后果，否则不应使用。尽管如此，这确实可以解决问题，因为它会设置双向筛选器。然而，现在正是我们考虑第\
  \ 13 章中关于双向筛选的结论的时候。任何导致数据模型进一步偏离星型模式结构的更改都不应被推荐。此外，还有另一种更简单的方法，那就是使用 DAX 和 `TREATAS`\
  \ 函数来解决问题。该函数会接收一个表表达式的结果，并用它来筛选无关表中的一个（或多个）列，并且此筛选器表达式可用作 `CALCULATE` 的筛选器参数。\n\
  \n`TREATAS` 的语法如下：\n\n```\n= TREATAS ( 表表达式, 列 1, 列 2 等。 )\n```\n\n- **表表达式** 是任何返回表的表达式。\n\
  - **列 1, 列 2 等。** 是一个或多个现有列，这些列必须与将接收来自表表达式筛选器的表表达式中的列相匹配。\n\n现在我们可以创建这个度量值：\n\n\
  ```\n目标 #2 =\nCALCULATE (\n    SUM ( 目标[TARGET] ),\n    TREATAS ( VALUES ( 日期表[YEAR]\
  \ ), 目标[YEAR] )\n)\n```\n\n请注意，`VALUES` 函数被用作表表达式，用于创建一个单列表（通常只有一行），该表包含当前筛选上下文（在第一次评估中为“2017”）中来自“日期表”的\
  \ `YEAR` 值。这个单行、单列的表用于筛选“目标”表中的 `YEAR` 列，使其等于“2017”，这就是 `CALCULATE` 使用的筛选器。在图 17-11\
  \ 中，你可以看到这在内存中是如何运作的。包含当前筛选上下文中来自“日期表”的 `YEAR` 的虚拟单列、单行表（或在评估总计行时的多行表）被用来筛选“目标”表中的\
  \ `YEAR` 列。因此，在视觉对象中使用来自“日期表”的 `YEAR` 列非常重要。\n\n![图 17-11 TREATAS 函数的评估过程](img/523050_1_En_17_Fig11_HTML.jpg)\n\
  \n1. `TREATAS` 的第一个参数使用 `VALUES` 函数创建一个虚拟表，其中包含当前筛选上下文中来自“日期表”的 `YEAR` 列，例如“2017”。\n\
  2. `TREATAS` 的第二个参数将“目标”表中的 `YEAR` 列定义为接收来自 `VALUES` 生成的虚拟表筛选器的列。\n\n当将“目标 #2”度量值放入表视觉对象中，并配合来自“日期表”的\
  \ `YEAR` 列时，我们得到了期待已久的结果；请参见图 17-12。\n\n![图 17-12 使用 TREATAS 函数可返回正确的目标值结果](img/523050_1_En_17_Fig12_HTML.jpg)\n\
  \n在本章中，你学习了如何使用 DAX 实现虚拟关系来管理数据模型中的异常情况。这始终是优于使用双向筛选和多对多关系的策略。因此，你无需再因无法在模型中创建推荐的多对一关系而气馁。然而，请注意，使用\
  \ DAX 的虚拟关系绝不会优于“真正的”多对一关系，并且只应在没有其他选择的情况下使用。\n\n\n\n"
- '# 18. 表扩展


  在本章中，你将学习如何在 DAX 代码中引用扩展后的表，并探索这一知识如何帮助你处理星型模型中表的结构所施加的限制。表扩展的概念是理解 DAX 工作原理拼图中的最后一块。^(
  ²² ) 这意味着 DAX 概念在重要性上存在某种优先级。然而，就像拼图一样，只有当所有碎片都拼合到位，你才能看到完整的画面，我们终于可以向你揭示 DAX 工作的真相，你目前持有的任何误解现在都可以被消除。


  理解表扩展的起点是提醒你 DAX 的真理：筛选器仅从关系的一端传播到多端，除非你使用 `CROSSFILTER` 函数以编程方式更改筛选方向。在这个真理范围内，你可能也默认认为（尽管从未明确说明）表之间的关系使用“主键”和“外键”从维度表到事实表执行“查找”以实现筛选。例如，对
  Wines 维度的筛选将使用 Wines 表中的 `WINE ID` 列，在 Winesales 表的 `WINE ID` 列中“查找”相同的值。这大概是你认为筛选传播的工作方式。并不是说这个理论是错误的；只是它不完整，而正是这种误解，我们将在本章中加以澄清。


  然而，在继续之前，我们必须仔细查看本章配套文件“6 DAX Expanded Tables.pbix”中的数据模型。你会注意到有一个与 Regions 表相关的额外表，名为
  Region Group，该表将在后续章节中变得重要；见图 18-1。


  ![](img/523050_1_En_18_Fig1_HTML.jpg)


  图 18-1


  请注意，数据模型中有一个额外的表 Region Group，它与 Regions 表相关联


  理解表扩展的重要性在于，我们终于可以向你解释数据模型中的筛选器*真正*是如何工作的，而不是近似如何工作。掌握了这一知识，你将学会如何利用表扩展来解决数据模型中的固有问题：如何“触及”维度表和雪花表以在更大的粒度上执行聚合。我们还将解释为什么使用诸如
  `RELATED` 和 `CROSSFILTER` 之类的函数（它们也能完成类似的工作）并不总是适用的。


  然而，在应对表扩展背后的挑战性概念之前，我们必须先回顾一下关于筛选器评估上下文方面已有的知识。如果这样做，你会发现筛选器传播背后有一些细节可能目前仍被你忽略。


  ## 重新审视筛选器


  尽管本书中进行了严谨的解释，但 DAX 生成的筛选器在某些方面仍然令人费解。思考以下两个问题：


  1.  如何可能使用事实表中不存在的维度值来筛选事实表？

  2.  当 `CALCULATE` 内部的 `ALL` 函数应用于事实表时，它如何移除那些并未放置在事实表上的筛选器？


  让我们从第一个矛盾开始考虑；我们在事实表中不存在的维度列上放置筛选器。为此，我们需要重新审视我们已知的关于列筛选器的知识。


  ### 重新审视列筛选器


  在本书中，你使用类似以下的 `CALCULATE` 编写度量值：


  ```

  Abel''s Cases =

  CALCULATE ( [Total Cases],  Salespeople[SALESPERSON] = "abel"

  )

  ```


  你是否曾停下来问过：这个度量值如何能够使用 SalesPeople 维度中的 `SALESPERSON` 列来交叉筛选 Winesales 表，而 Winesales
  只包含 `SALESPERSON ID`？要回答这个问题，我们必须更深入地探究列筛选器的本质。


  在第 7 章中，你学习了列筛选器比表筛选器更高效，并且在可能的情况下应优先使用。然而，在当时你对 DAX 的理解阶段，我们无法告诉你列筛选器的完整故事，因此只给了你一个关于列筛选器如何工作的近似描述。


  现在，在本章中，我们对你毫无保留，并陈述这样一个事实：在 DAX 中，*所有筛选器都是表筛选器*。考虑到我们在前一章如此费力地区分列筛选器和表筛选器，这个说法可能会让你感到惊讶。现在我们却说列筛选器也是表筛选器！


  关于为什么列筛选器比表筛选器更高效的完整解释，并不是因为你直接将筛选器放在列上，而是因为列筛选器生成的虚拟表比显式筛选表达式生成的虚拟表更高效。这是一个相当具有挑战性的概念，因此我们必须再次深入挖掘。


  让我们从考虑这个度量值开始，它会在 `SalesPeople` 表的 `SALESPERSON` 列上生成一个筛选器：


  ```

  Abel''s Cases =

  CALCULATE ( [Total Cases], SalesPeople[SALESPERSON] = "abel" )

  ```


  在评估这个度量值时，DAX 引擎会在内存中将此列筛选器转换为以下表达式：


  ```

  Abel''s Cases Real =

  CALCULATE (

  [Total Cases],

  FILTER ( ALL ( SalesPeople[SALESPERSON] ),                             SalesPeople[SALESPERSON]
  = "abel" )

  )

  ```


  如果我们查看这段代码，可以看到 DAX 使用 `ALL` 函数生成了一个单列表，其中包含销售员姓名的唯一列表。然后 `FILTER` 迭代此表以查找等于“Abel”的值，然后使用此筛选后的表相应地筛选
  Winesales 表；见图 18-2。


  ![](img/523050_1_En_18_Fig2_HTML.jpg)


  图 18-2


  “Abel''s Cases Real”度量值的“真实”评估


  1.  DAX 引擎使用 `FILTER` 生成一个单列表，包含 `SALESPERSON` 列中的唯一值。`FILTER` 迭代此表以筛选出“Abel”。

  2.  `FILTER` 生成的筛选后的虚拟表用于筛选 Winesales 表。


  让我们通过探究以下度量值的评估，来看另一个列筛选器的例子：


  ```

  Cases GT 350 =

  CALCULATE ( [Total Cases],  Winesales[CASES SOLD] > 350 )

  ```


  DAX 将此筛选器转换为以下内容：


  ```

  Cases GT 350 Real =

  CALCULATE (

  [Total Cases],

  FILTER ( ALL ( Winesales[CASES SOLD] ),

  Winesales[CASES SOLD] > 350 )

  )

  ```


  这段代码生成一个虚拟表，包含 Winesales 表中已售箱数的唯一值列表。在我们的数据中，此表因此将包含 **409** 行供 `FILTER` 迭代。我们可以看到，与使用表筛选器相比，此表达式总是会产生更高效的评估，例如以下度量值：


  ```

  Cases GT 350  =

  CALCULATE (

  [Total Cases],

  FILTER ( Winesales, Winesales[CASES SOLD] > 350 )

  )

  ```


  在这里，`FILTER` 必须迭代事实表中的所有行，这将是对我们的 Winesales 事实表进行 **2,207** 次迭代（事实表通常包含数百万行）。


  此时，我们还可以重新审视我们在第 6 章和第 7 章中编写的“Sales for Red or French #1”度量值：


  ```

  Sales for Red or French #1=

  CALCULATE (

  [Total Sales],

  Wines[TYPE] = "red"

  || Wines[WINE COUNTRY] = "France"

  )

  ```



  我们注意到，这个度量的一个问题是，如果 `TYPE` 或 `WINECOUNTRY` 列上存在筛选器，则筛选器不起作用（请参阅图 6-10）。我们终于可以解释原因了。这是因为
  DAX 在内部将度量转换为以下代码：


  ```

  红色或法国销量 #1 =

  CALCULATE (

  [总销售额],

  ALL ( Wines[TYPE], Wines[WINE COUNTRY]),

  FILTER( Wines,

  Wines[TYPE] = "红色"

  || Wines[WINE COUNTRY] = "法国"

  )

  )

  ```


  因此，由于 `ALL` 的存在，筛选器总是会从 `TYPE` 或 `WINECOUNTRY` 列中被移除。


  现在你理解了列筛选器会被转换为表筛选器，并且所有筛选器都是表筛选器，但我们之前的提问似乎并没有得到解答。在“阿贝尔的真实案例”度量中，我们筛选了 `SalesPeople`
  表中的 `SALESPERSON` 列，但 `Winesales` 表只包含 `SALESPERSON ID` 列，那么筛选器是如何从 `SalesPeople`
  表传播到 `Winesales` 表的呢？我们暂时留下这个悬念，先探讨第二个关于无效筛选器的例子。应用于事实表的 `ALL` 函数，如何能够移除那些并非放置在事实表上的筛选器？


  ## 深入探讨 ALL 函数


  在图 18-3 中，关于“总箱数”度量的计算，我们知道筛选器已经应用到了 `WINE` 和 `SALESPERSON` 列上，这些筛选器分别从 `Wines`
  维度和 `SalesPeople` 维度传播到 `Winesales` 事实表。然后，我们使用“所有 Winesales”度量来移除这些筛选器：


  ![](img/523050_1_En_18_Fig3_HTML.jpg)


  图 18-3


  筛选器被放置在 `WINE` 和 `SALESPERSON` 列上，而不是事实表上。`ALL` 函数移除了事实表上的筛选器


  ```

  所有 Winesales =

  CALCULATE ( [总箱数], ALL ( Winesales ) )

  ```


  我们在第 8 章中学到，当 `ALL` 函数嵌套在 `CALCULATE` 内部时，会*移除*筛选器。但是 `Winesales` 事实表上并没有筛选器需要移除，只有交叉筛选器。筛选器是放置在维度表中的列上的，那么当
  `Winesales` 表上没有任何筛选器需要移除时，`ALL` 是如何将其移除的呢？


  ## 扩展表详解


  为了回答这些深究性的问题并真正掌握 DAX 筛选器的行为，你必须理解表扩展。当度量被评估时，多对一关系允许进行表扩展。表扩展会导致 DAX 引擎创建虚拟表，这些虚拟表包含基表的列，然后扩展到关系位于一方的所有相关表中的所有列。然后，DAX
  引擎将使用扩展表按扩展表列中的值进行分组，并据此应用筛选器。因此，每个表都有一个与其匹配的、在内存中生成的扩展版本，该版本包含其*自身的所有列以及与其相关（直接或间接位于关系的一侧）的表中的所有列*。关系存在的唯一目的就是为了生成扩展表。


  因此，现在我们可以讨论数据模型中的*基*表和*扩展*表。基表就是我们的普通表。扩展表是我们的基表，它还包含了所有相关表中的列。例如，在我们的模型中，有三个表会发生扩展：`Winesales`、`Customers`
  和 `Regions`。`Winesales` 的扩展表将包含模型中所有表的所有列。`Customers` 的扩展表将包含 `Regions` 维度和 `Region
  Groups` 维度的所有列。`Regions` 的扩展表将包含 `Region Groups` 维度的所有列。在图 18-4 中，我们重新设计了数据模型，以展示其在度量评估时在内存中可能的样子。注意表之间没有关系，因为关系存在的唯一目的就是为了生成扩展表。


  ![](img/523050_1_En_18_Fig4_HTML.jpg)


  图 18-4


  `Winesales`、`Customers` 和 `Regions` 表在度量评估时都会进行扩展


  一旦筛选器应用于某一列，所有包含该列的扩展表也会被筛选。考虑图 18-5，该图显示了模型视图中的虚拟扩展表和基表。我们正在观察当我们筛选来自 `SalesPeople`
  基表的 `SALESPERSON` 列或来自 `Region Groups` 基表的 `REGION GROUP` 列时会发生什么。


  ![](img/523050_1_En_18_Fig5_HTML.jpg)


  图 18-5


  数据模型中表是如何扩展的


  1.  筛选来自 `SalesPeople` 基表的 `SALESPERSON` 会筛选 `Winesales` 扩展表。


  2.  筛选来自 `Region Groups` 基表的 `REGION GROUP` 会筛选 `Regions` 扩展表、`Customers` 扩展表以及
  `Winesales` 扩展表。


  所以现在我们能够回答之前提出的第一个问题。当 `Winesales` 表中不存在 `SalesPeople` 维度中 `SALESPERSON` 列的某个值时，该值是如何筛选
  `Winesales` 事实表的呢？现在你明白了，这个值确实存在于 `Winesales` 表中。它存在于 `Winesales` 的*扩展*表中。当我们在 `SALESPERSON`
  列上放置筛选器时，`SalesPeople` 基表和 `Winesales` 扩展表都会相应地受到筛选。另一个例子是对 `Region Groups` 基表中的
  `REGION GROUP` 列进行筛选。请注意，这会筛选 `Regions`、`Customers` 和 `Winesales` 扩展表中的 `REGION
  GROUP` 列。


  关系存在的唯一目的是为了扩展表；它们不被用于筛选表。在 DAX 表达式中对表的任何引用，在适用情况下，始终是对扩展表的引用。


  现在让我们回答第二个问题。当 `Winesales` 表上没有直接筛选器时，筛选器是如何被移除的？当我们使用 `CALCULATE` 内部的 `ALL` 来移除表上的筛选器时，如果适用，它会移除*扩展表*上的筛选器。这包括来自与扩展表相关的维度表中的所有列，因此也包括最初产生筛选器的那些列。所以，表达式
  `ALL ( Winesales )` 将移除来自与 `Winesales` 相关的任何基表上的筛选器，这涵盖了整个数据模型。


  理解表扩展意味着我们现在可以阐明 DAX 中某些我们探讨过但当时无法完全解释的行为。例如，我们现在可以真正描述 `RELATED` 函数是如何工作的。


  `RELATED` 并不会在相关表中“查找”值，而是允许你查找已存在于扩展表中的列。例如，当你在事实表上使用 `RELATED` 时，你会在智能感知列表中看到扩展事实表的所有列；参见图
  18-6。


  ![](img/523050_1_En_18_Fig6_HTML.jpg)


  图 18-6


  `RELATED` 函数允许你引用扩展表中的列


  与 `RELATED` 类似，`ALLEXCEPT` 和 `SUMMARIZE` 函数也允许你使用扩展表中的列。当使用这些函数构建表达式时，如果你引用了事实表或雪花维度，你同样会在智能感知列表中看到扩展表的所有列；参见图
  18-7。


  ![](img/523050_1_En_18_Fig7_HTML.jpg)


  图 18-7


  `SUMMARIZE` 也会引用扩展表


  你可能会认为关于表扩展的知识纯粹是理论性的。它解释了关于筛选器传播的某些行为，但并不能引导你构建更复杂的 DAX 表达式。现在是时候改变对表扩展的这种看法，并学习如何将你对扩展表的知识付诸实践了。



  ### 利用扩展表


  在表达式中使用表扩展的主要原因是为了“触及”维度，以便对其中的列执行聚合。你可能认为我们在讨论 `CROSSFILTER` 函数（该函数使您能够逆转筛选传播的方向）时已经涵盖了这种情况。`RELATED`
  函数也允许您从维度和雪花表中提取值到事实表，以实现此类聚合。然而，这两种方法都不是最佳实践，原因我们将在您阅读下文时阐明。


  ## “触及”维度


  接下来，让我们了解表扩展如何帮助您摆脱星型模式和雪花模式带来的限制。为此，我们将像之前经常做的那样，通过一个场景来展开。


  您被要求计算每种葡萄酒在多少个不同的区域销售过。`Regions` 表是一个雪花维度。它与 `Customers` 表相关，而 `Customers` 表又与
  `Winesales` 表相关。目前，您能推断出一笔交易发生在哪个地区的唯一途径是 `Customers` 表；见图 18-8。


  ![](img/523050_1_En_18_Fig8_HTML.jpg)


  图 18-8


  只能通过 `Customers` 表找出交易发生的区域


  然而，您现在知道，`Regions` 表中的所有列都存在于扩展后的 `Winesales` 表中。因此，一种方法是在 `Winesales` 基表中创建一个计算列，使用
  `RELATED` 从扩展后的 `Winesales` 表中找出 `REGION` 列，如图 18-9 所示。


  ![](img/523050_1_En_18_Fig9_HTML.jpg)


  图 18-9


  您可以在事实表中使用 `RELATED` 来显示区域名称


  然后，您可以在这个计算列上使用 `DISTINCTCOUNT` 来编写度量值“Distinct Regions”，如下所示：


  ```

  Distinct Regions =

  DISTINCTCOUNT ( Winesales[REGION] )

  ```


  然而，这里所做的一切仅仅是访问扩展后 `Winesales` 表中的 `REGION` 列。您也知道，应尽量避免使用计算列。有一种更好的方法来计算不重复区域的数量，那就是使用带有表筛选器的
  `CALCULATE`，该筛选器将筛选 `Regions` 表。为此，我们首先需要回顾一下如何构建 `CALCULATE` 函数中的筛选参数。


  您已经了解到，`CALCULATE` 内部的筛选参数可以包含一个表表达式。但筛选参数不一定非得是表表达式；它也可以只是一个对表的引用。如果您在 `CALCULATE`
  的筛选参数中引用一个表，在适用的情况下，这总是 *扩展后的表*。


  回到计算销售葡萄酒的不同区域数量这个问题上，您可以使用包含 `REGION` 列的扩展后 `Winesales` 表作为 `CALCULATE` 的筛选条件。如果这样做，您就可以使用一个度量值来统计通过扩展后
  `Winesales` 表筛选过的 `Regions` 表中的行数。该度量值如下：


  ```

  Distinct Regions =

  CALCULATE ( COUNTROWS ( Regions ), Winesales )

  ```


  您必须注意这个表达式的简洁性，以及其背后概念的复杂性，同时也请记住我们之前提到过的一点；对于 `DAX` 而言，细节是魔鬼。


  我们可以在图 18-10 中看到此度量值的计算过程。


  ![](img/523050_1_En_18_Fig10_HTML.jpg)


  图 18-10


  使用扩展后 `Winesales` 表计算“Distinct Regions”的过程


  “Distinct Regions”度量值使用 `CALCULATE` 筛选参数中的扩展后 `Winesales` 表来筛选 `Regions` 基表。在此度量值的计算过程中，我们知道对
  `Wines` 表中 `WINE` 列的筛选会作用于扩展后 `Winesales` 表中的 `WINE` 列。我们还知道，扩展后的 `Winesales` 表包含了
  `Regions` 表中的所有列。因此，在当前筛选上下文中，每种葡萄酒销售的区域也会被筛选。在当前筛选上下文中针对每种葡萄酒筛选过的扩展后 `Winesales`
  表，会被用来相应地筛选 `Regions` 表。此时 `Regions` 表仅包含在当前筛选上下文中销售了该葡萄酒的区域，然后对筛选后的 `Regions` 维度中的行进行计数；请参见图
  18-11。


  ![](img/523050_1_En_18_Fig11_HTML.jpg)


  图 18-11


  筛选传播中使用的基表和扩展表



  ```markdown

  1.  `Wines`表中的`WINE`列过滤了经过扩展的`Winesales`表中的`WINE`列。


  2.  经过扩展的`Winesales`表包含`Regions`表中的所有列。这个过滤条件作用于经过扩展的`Winesales`事实表，用于过滤`Regions`表，然后对`Regions`表中的行进行计数。


  从这个度量值中我们可以得出的结论是，使用`CALCULATE`时，你可以利用经过扩展的表来过滤基础表。


  让我们再看一个在代码中使用经过扩展的表的例子，但这次我们要编写一个更具挑战性的计算。我们将重复之前的场景：你需要找出销售过葡萄酒的不同地区的数量，但这次，你只考虑高销量地区。你已确定，高销量地区是指`CASES
  SOLD`（销售箱数）大于 325 的任何地区。为了进行此计算，与其像“Distinct Regions”表达式那样使用整个经过扩展的`Winesales`表，不如使用`FILTER`来过滤经过扩展的`Winesales`表（高亮部分）：


  ```

  Distinct High Volume Regions=

  CALCULATE (

  COUNTROWS ( Regions ),

  FILTER ( Winesales, Winesales[CASES SOLD] >325 )

  )

  ```


  当你将此度量值放入表视觉对象中时，你会发现，对于“Bordeaux”，有**18**个地区的`CASES SOLD`交易量大于 325，而在销售“Grenache”时，只有**7**个地区；参见图
  18-12。


  ![](img/523050_1_En_18_Fig12_HTML.jpg)


  **图 18-12** 在表视觉对象中计算的“Distinct High Volume Regions”度量值


  如果我们检查“Distinct High Volume Regions”度量值的计算过程，如图 18-13 所示，你会发现它与“Distinct Regions”度量值的不同之处仅在于多了一个过滤`Winesales`基础表的步骤。该度量值过滤了`Wines`维度中的`WINE`列，同时也过滤了经过扩展的`Winesales`表。`FILTER`函数进一步将`Winesales`基础表过滤为`CASES
  SOLD`大于 325 的行。`Regions`表中的列包含在经过扩展的`Winesales`表中，因此也受到了过滤。对`Regions`表中的行进行计数，只会反映出那些在经过扩展的`Winesales`表中被过滤后的地区。


  ![](img/523050_1_En_18_Fig13_HTML.jpg)


  **图 18-13** 用于过滤器传播的基础表和经过扩展的表


  1.  `WINE`列过滤了经过扩展的`Winesales`表中的`WINE`列。

  2.  `Winesales`基础表中的`CASES SOLD`列被过滤为大于 325。

  3.  经过扩展的`Winesales`表包含`Regions`表中的所有列。经过扩展的`Winesales`事实表中的过滤器用于过滤`Regions`表。


  对表扩展的了解也有助于澄清我们本书中多次探讨过的一个前提，即表过滤器和列过滤器之间的区别。既然我们知道表过滤器通常会涉及经过扩展的表，那么让我们将刚刚编写的度量值与另一个看起来几乎相同的度量值进行比较。然而，一个使用了表过滤器（利用经过扩展的表），另一个则使用了列过滤器，如下所示：


  ```

  Distinct High Volume Regions Table Filter =

  CALCULATE (

  COUNTROWS ( Regions ),

  FILTER ( Winesales, Winesales[CASES SOLD] > 325 )

  )

  ```


  ```

  Distinct High Volume Regions Column Filter =

  CALCULATE (

  COUNTROWS ( Regions ), Winesales[CASES SOLD] > 325 )

  ```


  你可以在图 18-14 中看到，相似的度量值返回了不同的数值。原因在于，第一个度量值过滤了经过扩展的`Winesales`表，而第二个度量值仅过滤了`Winesales`*基础*表中的`CASES
  SOLD`列。


  ![](img/523050_1_En_18_Fig14_HTML.jpg)


  **图 18-14** 相似的度量值可能返回不同的结果


  正确的计算“Distinct High Volume Regions Table Filter”使用了由`FILTER`函数生成的表过滤器，该过滤器先过滤经过扩展的`Winesales`表，进而过滤`CASES
  SOLD`列。这也会过滤经过扩展的表中的地区，并用于过滤`Regions`维度。然后，该度量值对经过`Winesales`扩展表过滤后的`Regions`基础表中的行进行计数；参见图
  18-13。


  度量值“Distinct High Volume Regions Column Filter”仅在`Winesales`*基础*表中的`CASES SOLD`列上生成一个过滤器，并且模型中不会有任何过滤器传播。因此，无论`Winesales`表中存在任何过滤器，它都会计算`Regions`表中的*所有*行；参见图
  18-15。


  ![](img/523050_1_En_18_Fig15_HTML.jpg)


  **图 18-15** 用于过滤器传播的基础表和经过扩展的表


  1.  `WINE`列在经过扩展的表和基础`Wines`表中均被过滤。

  2.  过滤`Winesales`基础表中的一列并不会将过滤器传播到维度表。


  从这些例子中得出的关键结论是，在`CALCULATE`的过滤器参数中使用经过扩展的表，能够让你将过滤器传递到维度和雪花表中，实际上相当于逆转了过滤器传播的方向。这是因为经过扩展的表包含了这些维度的列，这些列可以被分组和过滤。然而，现在必须回答一个问题是：使用经过扩展的表和使用`CROSSFILTER`有什么区别？使用这些不同方法的最终结果不是一样的吗？例如，我们可以使用经过扩展的表编写以下表达式：


  ```

  Distinct Regions #1 =

  CALCULATE ( COUNTROWS ( Regions ), Winesales )

  ```


  或者，我们可以使用`CROSSFILTER`编写这个我们认为会返回相同结果的度量值：


  ```

  Distinct Regions #2 =

  CALCULATE(COUNTROWS(Regions),

  CROSSFILTER(Winesales[CUSTOMER ID],

  Customers[CUSTOMER ID],both),

  CROSSFILTER(Customers[REGION ID],

  Regions[REGION ID],both))

  ```


  这两个度量值都会“触及”`Regions`表。显然，第二个度量值比第一个笨拙得多，但在计算评估上是否存在差异？答案是肯定的，有差异，我们现在就来解释原因。

  ```



  ### 表扩展 vs. CROSSFILTER


  在第[13]章(#523050_1_En_13_Chapter.xhtml)中，当我们探究`CROSSFILTER`函数时，编写了一个度量值，用于对 Customers
  表中的`NO. OF STORES`列求和，以计算我们销售葡萄酒的店铺数量。提醒一下，当时的问题是筛选器无法从 Wines 维度传递到 Customers 维度，因此我们使用`CROSSFILTER`函数以编程方式将筛选传播方向更改为双向筛选：


  ```

  Total Stores =

  CALCULATE (

  SUM ( Customers[NO. OF STORES] ),

  CROSSFILTER ( Winesales[CUSTOMER ID],

  Customers[CUSTOMER ID], BOTH )

  )

  ```


  然而，我们当时没有告诉你，你也不会注意到，但该度量值在“合计”行返回了一个错误的值；参见图 18-16。


  ![](img/523050_1_En_18_Fig16_HTML.jpg)


  图 18-16


  “Total Stores”度量值在“合计”行中不正确


  许多相同的客户可能购买了各种葡萄酒，因此我们知道，**1,181** 的总和不会是每种葡萄酒各自总值的简单相加。不过，你或许会认为这个值看起来差不多，从而相信它。但“合计”行中的值应该是我们销售所有葡萄酒的店铺总数量。这个值不正确，因为在
  Customers 表中，有五个客户我们从未向其销售过葡萄酒。如果我们在计算“Total Sales”度量值的表格视觉对象中“显示无数据的项目”，就能看到他们是谁；参见图
  18-17。


  ![](img/523050_1_En_18_Fig17_HTML.jpg)


  图 18-17


  有五个客户没有销售记录


  “合计”行中显示的 **1,181** 包含了这些客户的店铺。我们可以在 Customers 表的`NO. OF STORES`列中看到这些值；参见图 18-18。


  ![](img/523050_1_En_18_Fig18_HTML.jpg)


  图 18-18


  没有销售记录的客户在`NO. OF STORES`列中仍有值


  我们未向这些客户销售任何葡萄酒，因此他们的店铺显然不应计入我们销售葡萄酒的店铺总数。我们的总和多出了 **69**。


  这里发生的情况是，“Total Stores”度量值使用了双向筛选器。当它到达“合计”行的评估时，Wines 维度的`WINE`列上的筛选器被移除，因此没有筛选器可以传播到
  Customers 维度。由于没有传播筛选器，它会对`NO. OF STORES`列中的所有值求和。换句话说，双向筛选器仅在存在活跃筛选器时才生效。


  那么，如何在“合计”行中计算出正确的值 **1,112** 呢？


  这里必须做的是，使用扩展后的 Winesales 事实表作为 Customers 表的筛选器。这是因为，与双向筛选不同，来自扩展表的筛选器始终处于活跃状态。当评估“合计”行时，扩展后的
  Winesales 事实表仅包含那些购买过葡萄酒的客户，因此这将相应地筛选 Customers 维度。


  以下是能给出正确总数的度量值：


  ```

  Total Stores #2 =

  CALCULATE (

  SUM ( Customers[NO. OF STORES] ),

  Winesales

  )

  ```


  你现在可以在图 18-19 中看到，“合计”行现在显示的是 **1,112**。


  ![](img/523050_1_En_18_Fig19_HTML.jpg)


  图 18-19


  使用表扩展可在“合计”行中返回正确的值


  在使用 DAX 时，你不仅需要关注细节并保持怀疑精神，还必须理解表扩展。


  ### 使用雪花架构


  理解表扩展也解释了我们在处理“雪花”型架构时可能遇到的问题。即可能存在一系列表格，通过一对多关系链连接到事实表。在我们的数据模型中，我们扩展了 Regions
  雪花架构，添加了另一个表 Region Groups，该表通过`REGION GROUP ID`与 Regions 表相关联。从图 18-20 中可以看到，Region
  Groups 表通过`REGION GROUP ID`关联到 Regions 表，Regions 表通过`REGION ID`关联到 Customers 表，Customers
  表又通过`CUSTOMER ID`关联到 Winesales。


  ![](img/523050_1_En_18_Fig20_HTML.jpg)


  图 18-20


  一个由 Region Groups、Regions 和 Customers 组成的雪花架构


  在图 18-21 中，我们在切片器中筛选了“South West”地区组，并在表格视觉对象中显示了该地区组下的客户。我们尝试计算这些客户的总销售额 (**3,512,539**)，以便将这个值用作分母，来计算每个客户销售额占“South
  West”地区组总额的百分比。这是我们使用`ALL`函数在 Customers 表上编写的度量值：


  ![](img/523050_1_En_18_Fig21_HTML.jpg)


  图 18-21


  计算地区组中所有客户总销售额的结果不正确


  ```

  Total Sales for All Customers in Region Group wrong =

  CALCULATE ( [Total Sales], ALL ( Customers ) )

  ```


  如图 18-21 所示，它没有返回正确的结果，正确结果应为 **$3,512,539**。你还会注意到，因为我们从 Customers 表中移除了所有筛选器，表格视觉对象现在显示了所有客户，而不仅仅是“South
  West”地区组中的客户。


  现在让我们解释一下为什么计算错误。当我们在`CALCULATE`内部使用`ALL`从表中移除筛选器时，它也会（如果适用）从扩展表中移除筛选器。因此，该度量值会从扩展后的
  Customers 表中移除筛选器，从而同时移除 Regions 表和 Region Groups 表的筛选器。因此，它计算的是*所有*地区组的总和。Region
  Groups 表位于雪花链的末端，所以这与总销售额的合计值相同。


  图 18-22 显示了从扩展后的 Customers 表中移除筛选器是如何同时移除 Regions 和 Region Groups 的筛选器的。


  ![](img/523050_1_En_18_Fig22_HTML.jpg)


  图 18-22


  从扩展后的 Customers 表中移除筛选器会同时移除 Regions 和 Region Groups 的筛选器


  要计算正确的分母，有几种方法可以修改原始度量值，以重新应用在 Customers 表上“丢失”的筛选器。例如，我们可以使用`ALLEXCEPT`来移除扩展后的
  Customers 表上的筛选器，但保留对`REGION GROUP`列的筛选（因为`REGION GROUP`包含在扩展后的 Customers 表中）：


  ```

  Total Sales for All Customers in Region Group #1=

  CALCULATE (

  [Total Sales],

  ALLEXCEPT ( Customers, ''Region Groups''[REGION GROUP]))

  ```


  另一种方法是使用当前由切片器在 Region Groups 表上生成的筛选器，即“South West”。该度量值也能给出我们所需的分母：


  ```

  Total Sales for All Customers in Region Group #2 =

  CALCULATE (

  [Total Sales],

  ALL ( Customers ),

  ''Region Groups'')

  ```


  在“Total Sales for All Customers in Region Group #2”度量值中，`ALL`函数移除了扩展后的 Customers
  表上的所有筛选器，但通过在`CALCULATE`的第二个筛选参数中使用`Region Groups`作为表筛选器，这会在扩展后的 Customers 表上重新应用“South
  West”筛选器，因此也会筛选 Regions 表和 Region Groups 表。




