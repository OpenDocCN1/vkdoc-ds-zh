  *   更容易进行抽象思考，避免被束缚在框框里。告诉别人要“跳出框框思考”并不总是让他们做到这一点的有效方法。\n*   我们避免了对于收集、分析和报告必要信息的能力所产生的恐惧、不确定或怀疑。这些对度量指标的常见情绪会限制你创造性且透彻地进行思考的能力。它们往往会让你“满足”于不够理想的答案。\n\
  *   我们拥有一个非威胁性的工具来捕捉需求。没有名字，没有数据或度量。没有会让客户担忧的信息。完全没有数据。只是一幅图。当然，当你最终确定度量指标时，这幅图可能会发生巨大变化。这本质上是一个工具，让你可以不受对度量指标（或某个特定答案）应有模式的先入之见所限制，进行创造性思考。\n\
  \n一条关键建议是不要孤立地设计你的度量指标。即使你是你自己的度量指标客户，也要让其他人参与进来。我不是提倡使用顾问。我提倡的是使用其他人——任何人。你需要有人帮你产生想法，并向他们抛砖引玉。你需要有人帮你问“为什么”。你需要有人与你讨论你的画（或许还能一起画）。这是一个充满创造力和探究精神的过程——对我们大多数人来说，与其他人一起做这件事会容易得多。随意使用你整个团队的力量。但不要独自完成。\n\
  \n一个好的根本问题会使画图更容易。\n\n画出一幅完整的图（我不是指毕加索那种），不仅使识别信息、度量和数据变得容易，而且能确保你很有机会获得正确的组成部分。\n\
  \n这幅图必须是“完整的”。当我纸上有了一些东西（即使是火柴人）之后，我会问客户：“还缺什么？”“这完全回答了你的问题吗？”很可能，答案是否定的。当我举办那场研讨会时，团队成员有杯子——但它们的尺寸都一样，并且没有那条“填充至此处”的线。经过一些讨论和提问，小组修改了图画，以展示完整的图景。\n\
  \n实际上，不断修改这幅图、摆弄它直到你觉得它完整为止，这个过程是很有趣的。参与其中的人开始思考他们想要什么和需要什么，而不是他们认为可能达成什么。这就是画图式度量指标的真正力量所在。\n\
  \n\n\n### 确定所需的信息、度量指标与数据\n\n只有当你掌握了全局图景后，才能着手处理各个组成部分。这个图景是对我们核心问题答案的抽象表示，就像艺术家为设计一座大教堂而绘制的效果图——那种用于向金主推销创意的图。当你向潜在捐赠者展示这个想法时，你不需要提供施工蓝图，你只需要推销这个概念。\n\
  \n接下来是确保建筑可行的具体设计元素。作为建筑师，你可以提供艺术构想，同时凭借经验判断这个构想是否合理。下一步是确定具体设计要包含什么——结构类型、布线、管道和承重墙。然后你必须确定实现它所需的材料——我们需要什么来填充这个度量指标？\n\
  \n让我们看看工作量这个例子。我们如何分配团队的工作量才能实现最高效率？记住，这里的图景是饮料杯——从 20 盎司、32 盎司到超大杯的 44 盎司，各种尺寸的杯子。每个杯子上都有一个标记指明“填充”线——如果我们填充超过这条线，泡沫就会溢出杯子。利用这个图景，我们需要确定以下内容：\n\
  \n*   我们如何衡量团队的生产力水平？\n*   我们目前如何分配（划分）工作？\n*   还有哪些其他分配工作的方式？\n\n在上述三条信息中，似乎只有第一条需要度量指标。另外两条属于流程定义。由于我们的问题是由一个目标（提升团队生产力）驱动的，那么设计度量指标的过程将会产生其他有助于实现该目标的元素。\n\
  \n信息可以由其他信息、度量指标和数据组成。不必详细区分每个组成部分——重要的是从复杂到简单、不急于求成地推进。不要直接跳到数据上去！\n\n以下是一个示例，展示如何从问题过渡到度量指标，再到数据。\n\
  \n*   我们如何衡量团队的生产力水平？\n    *   每个员工能完成多少工作量？\n        *   员工 A？\n        *   员工\
  \ B？\n        *   员工 C？\n    *   每个员工实际完成了多少工作量？\n        *   按员工划分（与上一个度量指标的细分方式相同）\n\
  \    *   每个员工的“杯子”里装了多少？\n        *   按员工划分\n    *   完成一项任务需要多长时间？\n        *  \
  \ 按员工划分\n        *   按任务类型划分\n        *   按具体任务划分\n\n我为每个员工记录了一个子项，是为了强调一个对许多人来说似乎反直觉的事情——大多数时候并不存在适用于所有人的“标准”。在制定度量指标时，我发现有多少客户想要设定一个他们认为对所有人都适用的数字，这很有趣。\n\
  \n即便是按照极其精确的标准制造出来的机器，运行方式也不可能完全相同。为什么我们会认为人类——这个已知最复杂的、充满多样性的生命有机体——会符合标准化的行为模式呢？\n\
  \n当然，如果我们有一个标准会更简单——比如一个程序员能完成的工作量，以及每个程序员实际完成了多少工作量。但这几乎是不可能的。\n\n你可能也会好奇，为什么我们要设定第一和第二个度量指标——员工能完成多少工作量，以及他实际完成了多少。但由于目标是提升团队的生产力，答案可能不在于重新分配负荷——而在于找到让人们发挥潜力的方法。一个更简单的原因是，我们不知道每个员工是否被分配了其能力范围内的工作量——或者是否分配了过多的工作量。\n\
  \n回顾图 2-1，我们可能需要判断饮料的口味是否重要。我们是否需要知道每个员工必须完成的工作类型？工作的复杂性是否重要？客户是否重要？工作的目的是否重要？工作的质量是否重要？我们是否只应该围绕经理分配的工作进行度量？如果我们排除了其他工作，我们是否冒着以牺牲其他领域为代价来提高某一领域生产力的风险？\n\
  \n这些问题在最合适的时机被提出来——相比如果我们从数据入手的话。如果我们从一个模糊的想法（而非核心问题）开始，然后直接跳到数据——我们会在收集了大量数据、或许还进行了分析并创建了图表之后，才问出这些问题。只有当我们把劳动成果展示给客户时，我们才会发现自己是否走在正确的轨道上。\n\
  \n我想帮助你避免浪费时间和资源。我想说服你，从掌握知识的角度出发去构建度量指标。\n\n\n\n### 收集度量指标与数据\n\n既然我们已经确定了所需的信息（以及构成这些信息的度量指标），接下来就需要收集数据。有了预先设计好的问题、度量画像（答案）和信息，这一过程会轻松许多。关键在于不要遗漏细节。\n\
  \n人们很容易跳过或遗漏某些部分，因为我们想当然地认为这些内容显而易见。以工作量示例为基础，我们来审视一下需要识别的部分数据。\n\n首先，我们需要任务分解，这样才能了解“工作”的具体内容。任务由哪些部分构成——这样我们才能衡量每个工人“能够”完成哪些任务。有了这种分解，我们还需要对任务/工作的类型进行分类。在解释概念时，我发现使用具体示例很有帮助。概念越抽象，示例就应该越具体。\n\
  \n- **任务 1**：提供二级支持  \n  - **任务 1a**：分析问题原因  \n  - **任务 1b**：确定解决方案集  \n  - **任务\
  \ 1c**：选择最佳解决方案  \n\n这个示例可归类为“支持”。任务的其他类别可能包括创新、流程改进、项目开发或维护。\n\n我们还需要衡量每个工人执行每项任务所需的时间，如表\
  \ 2-1 所示。\n\n如果我们有了工作组成部分的度量指标，就应该能够将这些数据“向上”汇总，以确定完成更大工作单元所需的时间。\n\n![images](img/t0201.jpg)\n\
  \n接下来，我们需要衡量当前分配给每个工人的任务。\n\n*工人 A 正在做支持工作，而工人 B 和 C 正在做维护工作。*\n\n由于我们需要知道每个工人能做什么（“能够做”），我们还需要了解每个工人的技能组合，并具体识别他们“不能做”什么。很多时候我们发现，`X`\
  \ 的度量值可以部分（或完全）由其倒数 `¹/x` 的度量值来确定。\n\n*工人 A 没有能力做维护工作。这就是为什么他没有被分配维护任务，而是做支持层面的工作。*\n\
  \n再次强调，一旦我们采用自上而下的方式，事情就会简单得多。根据得到的答案，我们会进行调查，以确保我们的假设是正确的。然后，我们可以根据这些结果进行更改（改进）。\n\
  \n*工人 A 想要做更多维护类任务，但她对自己的能力缺乏信心。经理决定为工人 A 制定一个全面的培训计划。*\n\n*工人 B 和 C 表明他们具备提供支持所需的技能，并且愿意这样做。经理将支持工作更均匀地分配给了团队。*\n\
  \n根据从指标中得出的答案，这类调整（以及新的解决方案）可以在整个过程中进行。\n\n无需在识别所有度量指标和数据时做到“完美”。如果遗漏了某些东西，在尝试构建信息并最终构建指标时，这一点应该会变得显而易见。如果你缺少了什么，它会凸显出来。如果你拥有不需要的数据或度量指标，当你在汇总指标时，这一点也会很快显现出来。\n\
  \n你不需要一开始就做到完美，但肯定要尽可能高效。你希望积极主动，并依据一个强有力的计划开展工作。当你以根本问题和指标作为起点时，这一切就会发生。\n\n令人惊叹的是，一幅图像——不是图表或图形，而是一幅描绘答案的创造性图画——能起到多大的作用。它有助于集中你的精力，并防止你盲目追逐数据。\n\
  \n指标的“画像”提供了焦点和方向，并帮助我们避免盲目追逐数据。\n\n### 如何收集数据\n\n一旦我们设计好指标的外观，并对其所需的信息、度量指标和数据有了大致概念，我们就需要讨论如何收集所需的各个部分。我不会给出具体的步骤，而是提供一些收集数据的指导方针。这些“经验法则”将帮助你以尽可能准确的方式收集数据。\n\
  \n稍后，我们将详细阐述一些使数据准确性变得不确定的因素。这与其说是所用机制造成的结果，不如说是数据提供者对你和管理层的信任程度带来的后果。\n\n#### 尽可能使用自动化数据\n\
  \n当我看到“禁止入内，禁止擅入”的牌子时，我会想到度量指标。禁止擅入的标志旨在将人们挡在不属于他们的地方。很多时候这与安全有关。在收集数据的情况下，你希望将人挡在外面。\n\
  \n为什么？人与数据的交互越少越好。交互越少，数据就越准确，每个人对其准确性的信心就越高。只要有可能通过自动化方式收集数据，我就会这样做。例如，回到第 1 章中的例子，与其让人去数滑雪机或台阶机的使用者数量，我更倾向于使用某种自动化方式收集这些数据。如果每个用户都必须在使用编程功能时输入机器上的信息（体重、年龄等），那么机器本身可能就能够提供用户数据。\n\
  \n使用自动化数据的最大风险可能是数据的丰富性和多样性。如果你发现这些运动器械能够提供你所需的数据（因为你从问题出发，到指标，再到信息，最后到度量指标和数据，这一过程非常顺畅），那太好了！但通常情况下，你也会发现大量与指标无关的其他数据。任何为你提供数据的自动化系统都不可避免地会同时提供大量你不需要的数据。\n\
  \n例如，你会得到我已经列出的用户人口统计数据（年龄和体重）。你还会得到用户使用器械的时间长度、选择的锻炼项目、用户的平均速度以及锻炼所覆盖的“总距离”等数据。器械可能还会给出平均心率信息。但是，如果这些数据中没有一个是为了回答你的根本问题而服务的，那么它们就都没有用。\n\
  \n在我们的工作量示例中，如果没有人工交互，收集工作相关的数据将会很困难。大多数工作记账系统都严重依赖于工人按照任务和工作类别来记录他们的工作量。\n\n#####\
  \ 注意！\n\n那么，当你的客户发现所有这些尚未开发的数据时，会发生什么呢？\n\n他会想找到它们的用途！想要物有所值是人的天性。既然你已经在提供指标，客户可能也希望你在正在构建的指标中为这些“有趣”的数据找到一席之地。这个风险是可控的，并且可能值得换取高度准确数据带来的好处。\n\
  \n使用自动化数据的风险在于，管理层可能会想要使用与你的根本问题无关的数据，仅仅因为这些额外的数据是可用的。\n\n你还应该小心不要过度信任自动化数据。有时数据看似没有人干预。如果客户想要使用滑雪机收集的体重和年龄数据呢？好吧，体重可能是由机器测量的，没有人干预（除了人站在机器上），但年龄是人工提供的数据，因为器械的用户必须输入这些数据。\n\
  \n#### 使用软件和硬件\n\n使用软件或硬件收集数据是最常见的自动化数据收集形式。我指的不一定是为了收集数据而开发的软件或硬件（比如车辆流量计数器）。我指的是更像滑雪机这类设备，它们旨在提供服务，同时还能提供系统数据作为附加好处。自动收集的数据提供更高水平的准确性，但存在数据过多导致难以选择的风险。我日常使用的大部分数据都来自软件和硬件——包括关于使用情况和速度的数据。\n\
  \n\n\n#### 开展问卷调查\n\n问卷调查可能是最常用的数据收集工具。它们被用于研究（盖洛普民意测验）、预测分析（选举期间的出口民调）、反馈收集（客户满意度调查）、市场分析（比如在购物中心里拦住你，占用几分钟时间的调查员）以及人口统计数据收集（美国人口普查）。只要你需要从大量人群中收集大量数据——人群是关键要素，就会用到问卷调查。问卷调查本质上就涉及人。\n\
  \n当你寻求受访者的意见时，是使用问卷调查的最佳时机。任何通过“询问”他人来收集数据的方式，其答案都会缺乏客观性。与使用自动化工具收集数据（高度/完全客观）相反，问卷调查本质上具有高度/完全主观性。因此，当你刻意想要获取主观意见时，问卷调查是最佳选择。\n\
  \n客户满意度调查就是一个很好的例子。市场分析也是如此。如果你想了解某人是否更喜欢某种饮品，一个很好的方法就是去询问。问卷调查会以某种方式收集你的意见。我将所有此类数据收集都归入问卷调查的范畴——即使你并没有使用“调查工具”来收集。所以，焦点小组（Focus\
  \ groups）和访谈也属于问卷调查。我们稍后会介绍各类问卷调查及调查方法背后的理论。\n\n#### 利用人\n\n到目前为止，我建议在需要高精度数据时避免由人来提供数据。我也提到过，当你需要意见时，你希望（也必须）借助人类。但是，当你决定使用人来收集意见之外的数据时，情况又如何呢？当你因为负担不起自动化解决方案，或是不存在这样的解决方案而不得不使用人时，会发生什么？\n\
  \n我努力保持健康，并定期去健身房。我注意到，一名健身房工作人员经常拿着一个带剪贴板的记录表在场所里走动。他会目测数一下篮球场上的人数。然后统计使用有氧运动器械的人数。接下来是自由重量区、力量器械区，最后是高层跑道。他还会检查更衣室，而一名女同事则会检查女更衣室。\n\
  \n在这个过程中，会引入多少人为误差呢？除了简单的数错之外，很容易想象计数者可能会漏数或重复计算人数。在工作人员于不同房间、区域和楼层之间转换时，他很可能会漏掉顾客，和/或重复计算同一个人（例如，用户\
  \ A 在篮球场上被计数了一次，等到工作人员到达更衣室时，用户 A 也在更衣室，于是又被计数了一次）。然而，使用自动化设备按区域统计设施使用情况，在经济上并不可行。\n\
  \n我们很容易接受人为收集数据这种形式所固有的不准确性。因此，我们必须提出以下问题：\n\n*   我们的数据需要高度精确有多重要？\n*   高精度是否值得付出高成本？\n\
  *   拥有这些数据本身有多重要？如果只是需要大致了解各区域的使用情况，那么粗略的估算可能就绰绰有余了。\n\n很多时候，我们使用人来收集数据，是因为我们需要人与人之间的互动来处理产生数据的情况。IT\
  \ 服务台就是一个很好的例子。因为选择由人工接听故障报修电话（而不是用自动化系统），所以收集到的大部分数据（以及之后用于分析趋势和预测问题区域的数据）都是由接电话的人完成的。即使是“自动化”的调查工具（生成并发送给来电者的电子邮件），也依赖于技术人员正确记录每位来电者的信息。\n\
  \n### 另一个示例\n\n我想再给你举一个关于如何制定指标的例子。这个例子来自我的工作经历。\n\n我曾与一位网络和电话会议技术员共事。他的老板想知道以下问题的答案：“这项服务是否值得继续维持？”该技术员提供的服务，其成本相当于一名全职员工的工资，外加昂贵的设备、一间专用会议室以及月费。老板想知道成本是否物有所值。\n\
  \n现在你可能已经要求我定义“服务”、“值得”和“维持”。你应该这么做！服务可能包括所有形式的会议，*或者*仅指需要技术员时间和产生经常性费用的网络会议。如果电话会议方式是沉没成本且不需要技术员干预，那这可能就不是一个考虑因素。\n\
  \n当我们问某事是否“值得”时——到底是什么意思？仅仅是金钱上的投资回报率问题吗？商誉是否算数？员工的生产力、效率和效果重要吗？最后，我们所说的“维持”是什么意思？是指保有这项服务？支付技术员的工资？拥有自己的设施，还是使用签约或托管的解决方案？“维持”是否包括硬件维护？是否包括软件升级？维修和更换又该如何？\n\
  \n一旦我们明确定义了构成根本问题的各个术语，我们就会对情况有更清晰得多的把握！记住共同语言的重要性。每个人都完全理解用于构建根本问题的语言，这一点同样重要。\n\
  \n图 2-2 展示了我与那位技术员为他的服务指标绘制的图片。\n\n![images](img/0202.jpg)\n\n**图 2-2.** 网络/电话会议价值\n\
  \n我们绘制的这张图描绘了使用网络会议系统所获得的价值（避免的成本）。我们预计展示的信息包括：节省的资金（差旅费和酒店费）、节省的时间（旅途时间）、环境效益（燃料消耗和二氧化碳[2]排放）以及能够更容易与其他人进行“面对面”交流的客户的满意度。这些因素将与实际发生的成本进行比较。\n\
  \n这不是一个完美的指标。依我的经验，根本不存在完美指标。你无法证明如果没有这个系统，这些成本就一定会发生。这就像假设如果没有电话，我们会更频繁地写信或探望家人一样。虽然我们不能绝对地说这种情况一定会发生，但出于确定已避免成本或服务价值的目的，我们不得不做出这些假设。\n\
  \n#### 信息\n\n我们提出了许多澄清性问题——寻求对根本问题所有组成部分的定义。这些定义引导我们得出以下信息决策（我们只想回答根本问题的一个方面）：我们节省了多少？通过维持会议中心，我们可能节省多少钱、航空燃料、二氧化碳[2]排放量以及时间？这种明确性使得下一阶段的工作更有针对性。我们不必追逐各种数据，而可以将精力只集中在我们所需的度量指标和数据上。\n\
  \n#### 度量指标\n\n我们设计了能够揭示以下信息的度量指标：\n\n*   每次会议节省的时间\n*   每次会议节省的金额\n    *   节省的差旅费（飞机票和出租车费）\n\
  \    *   酒店费用（当距离较远需要过夜时）\n*   每次会议减少的二氧化碳[2]排放量\n\n\n\n#### 数据\n\n要构建这些衡量指标，我们需要如下所示的数据：\n\
  \n- 参与网络/电话会议的各个地点\n- 每个地点的参会人数\n- 每个地点到“主办”地点的距离。为了计算该指标，我们必须确定一个参与者将要前往的“主办”地点。如果我们所在的地点作为主办方，我们就无法节省开支——但我们的同事则可以申领这部分节省的费用。\n\
  \    - 如果会议在 X 地点举行（例如，出于礼仪原因），则需获取每个参与出发地到该地点的距离。\n    - 如果礼仪未指定具体的会议地点——那么则选择参会人数最多的地点作为主办地点。\n\
  - 往返主办地点的机票费用\n- 这些航班的飞机 CO[2]排放量\n- 如果该地点不在机场附近：\n    - 从该地点到机场/从机场到该地点的距离\n  \
  \  - 往返机场的地面交通费用\n- 主办地点酒店房间的平均每晚价格\n    - 国际地点\n    - 国内地点\n- 网络/电话会议的成本\n    -\
  \ 按周期收费的系统\n    - 按年收费的系统\n    - 技术人员的薪资\n    - 技术人员每次会议所花费的时间\n- 网络/电话会议的总次数\n\n\
  这个指标是一个很好的范例，展示了如何从一个根本问题出发，构建出一个抽象蓝图，并最终落实到讲述故事所需的数据、衡量指标和信息。然而，这个例子最精彩的部分在于，它的创建是为了满足服务提供者的需求。我们的网络会议技术人员请求创建该指标，以回答他老板一直追问他的问题。我提醒过他，如果得出的答案是“不，取消这项服务”，我不会隐瞒这个结果。他表示同意。部分原因是他是位忠诚的员工——如果数据准确显示该服务不值得投入成本，他会第一个主张取消这项服务。另一个原因是他“深知”这项服务*是*有价值的。由于他每天都在使用这项服务，他深知其价值所在。\n\
  \n服务提供者通常已经知道你要构建指标来验证的答案。\n\n该指标每季度发布一次，用以展示网络/电话会议对组织带来的益处。\n\n### 回顾\n\n在本章中，我们涵盖了以下内容：\n\
  \n- *探究根本问题：* 至关重要的是，在你甚至开始“考虑”数据之前，必须先探究根本问题。根本问题能帮你避免做无用功。为了找到真正的根源，我讨论了使用“五问法”、引导团队干预、以及愿意接受答案可能不包含指标的情况。确保你明确了问题的每一个方面，以便完全清楚自己想要什么。\n\
  - *检验根本问题：* 我提供了一些建议，教你如何检验你确定的问题是否是一个真正的根本问题。即使通过了检验，重要的是要认识到，在你绘制蓝图时，可能还未完全触及根本。你可能需要做些返工。\n\
  - *制定衡量指标：* 这更多关乎不应该做什么，而不是应该做什么。你不应该考虑数据。你不应该设计图表和图形。你不应该立即跳到你想要什么衡量标准。保持抽象。\n\
  - *做一名艺术家：* 我发现保持抽象的最佳方式是发挥创造力。发挥创造力的最佳方式是避开细节，专注于全局。两者相辅相成。画一幅图——不一定非得是艺术品。\n-\
  \ *识别所需的信息、衡量指标和数据：* 一旦你有了清晰的蓝图（字面和象征意义上），就该考虑信息、衡量指标和数据了。可以把它想象成“按数字涂色”的画。需要哪些信息来填充这幅画？你需要哪些颜色的颜料？确保你没有遗漏任何基本组成部分。\n\
  - *收集衡量指标和数据：* 既然知道了需要什么，那么如何收集它们呢？\n- *如何收集数据：* 我介绍了四种主要的收集数据方法：利用*自动化来源*、使用*软件和硬件*、开展*调查*以及使用*人力*。\n\
  \n## 结论\n\n本章涵盖了如何创建一个根本问题，并在此基础上设计一个衡量指标。我还介绍了如何识别和收集所需的信息、衡量指标和数据，以便将指标蓝图转变为可用的衡量指标。\n\
  \n\n\n### 附赠材料\n\n一种思考指标的独特方式。一种处理指标的独特方法。这些都是我想要与你们分享的部分内容。\n\n我六岁孩子就读的学校通过募捐活动来补充经费。最近，学校正在以五美元的低价出售当地快餐店的优惠券册。这桩买卖不错——我只用了一张优惠券就轻松赚回了本钱。\n\
  \n我喜欢这个募捐活动。在我看来，它物超所值，同时学校也能从中获得可观的资金分成。校长也很喜欢，但他想确认这个活动效果如何——表面上是想决定是继续举办这个募捐活动，还是另寻替代方案。\n\
  \n*一天，我把女儿送到教室后，校长向我走来。“马蒂，我们收集了一些数据……”他知道我是指标专家。他已经在“收集数据”，并且一开口就提到这个，这让我心生疑虑。*\n\
  \n*“是吗？”我尽量不置可否。我喜欢谈论指标，和大多数人一样，我也喜欢谈论自己的专业。但是，我记忆中没有人对我给出的答案感到满意过。大多数人没有根本性的问题。大多数人不想发挥创造力。大多数人只是想要数据来证明自己是对的，而这“比可能的要简单”。*\n\
  \n*“是的。我们收集了今年优惠券册活动成功程度的数据。”*\n\n*“嗯哼。”我欲言又止。*\n\n*“我想知道它是否成功，所以我们统计了卖出了多少册。”*\n\
  \n*他没有定义“成功”，也没有探寻根本问题，就做了几件本可避免的事。好消息是，我知道收集这些数据并不费力——他只需对比年底还剩多少册以及学校最初购买了多少册即可。*\n\
  \n*他甚至制作了一张漂亮的图表，显示了每周及总体的销售百分比。*\n\n*“不错的图表。”我说。*\n\n*“正如你所见，我们在计划截止日期前一周就卖光了所有优惠券册。所以，明年我要把订购量翻倍。”*\n\
  \n*“是吗？”*\n\n*“当然，这是个巨大的成功！”*\n\n*“好吧……”我忍不住微微皱了下眉。*\n\n*在随后的短暂停顿中，我其实幻想过自己能就此脱身，不再继续谈论下去。*\n\
  \n*“我太了解你了，我知道你认为我哪里做错了。说吧，告诉我。”*\n\n如果这是一场研讨会而非一本书，此刻我会给你们做个测试。我会问你们：“校长忽略了什么？他应该怎么做？他的结论可能在哪些方面错了？这些错误又会如何造成问题？”\n\
  \n如果这是一场研讨会，我会给你们五分钟时间写下答案。既然这是一本书，如果你们想自己思考，现在就合上书，自己试试看。\n\n*我花时间尽可能友善地解释了他错在哪里。*\n\
  \n*“约翰，不是说你做错了什么，而是你可能遗漏了一些东西。我至少会建议你在进一步调查之前不要做决定。在继续深入之前，我要做的第一件事就是定义你所说的‘成功’是什么意思。仅仅是卖了很多优惠券册吗？”*\n\
  \n*“当然。难道不是吗？”*\n\n*“我真的不知道。你卖这些书的目的是什么？你的目标是什么？”他差点翻白眼。他觉得我在让他说些显而易见的事情。*\n\n*“为了筹集资金。”*\n\
  \n*“好的。那这点你做到了，对吧？”*\n\n*“是的。”*\n\n*“那这就是你想知道的所有事情吗？”*\n\n*“当然。”*\n\n*“真的吗？那你为什么决定明年把订购量翻倍呢？看起来你实际上是想知道明年应该订购多少册……”*\n\
  \n*“嗯，是的。如果成功了，我想我们就应该增加订购量。”*\n\n*“那如果没有卖完呢？如果你只卖掉了订购量的一半呢？”*\n\n*“我不知道。可能明年只订购四分之三，然后更努力去卖。或者换个别的募捐活动？”*\n\
  \n*“约翰，我鼓励客户做的一件事是，在收集任何数据之前，先确定他们将如何使用这些问题的答案。所以，我应该先问你——如果答案是‘非常成功’，你会怎么做？”*\n\
  \n*“巨大的成功！”他笑着说。*\n\n*“巨大的成功。关键是，如果你告诉我你会把订购量翻倍，我会帮你找到你的真正问题——听起来像是‘我明年应该买多少本优惠券册’，而可能的答案范围很广，从零本（取消这个活动）到订购量翻倍都有可能。”*\n\
  \n*“有什么区别呢？”*\n\n*“嗯，如果我们带着这个新问题，你会以不同的方式看待你的数据，并且你还会收集一些其他数据，比如：*\n\n*   *谁卖出了这些书？*\n\
  *   *谁买了这些优惠券？*\n*   *为什么我们会售罄？*\n*   *有多少你无法满足的请求？*\n*   *你们是如何推广这个活动的？*\n\n*“我明白你的意思，但我不认为这些会有什么不同。”*\n\
  \n*“我给你举个简单的例子。如果我告诉你，你们在一天之内卖出了一半的优惠券呢？在截止日期前一周，你们在一天之内卖光了所有剩余的书。”*\n\n*他停下来思考了一会儿。*\n\
  \n*“一半？”*\n\n*“是的。”*\n\n*“嗯。我可能得知道为什么我们在这么短的时间内卖出了这么多。”*\n\n*“很好。如果我告诉你，这些全是由一个人卖出的呢？”*\n\
  \n*“哇！那我得给这个人寄一张大大的感谢卡。也许我们可以给他颁个奖？”*\n\n*我用只有家长或校长才能懂的眼神看着他。*\n\n*“我又在仓促下结论了？”他试探着问道。*\n\
  \n*我点了点头。*\n\n*“我想我会想知道这是怎么发生的。”*\n\n*“很好。假设你发现，有位匿名捐赠者知道你们的募捐活动进行了两个半月后，只达到了目标的一半。假设这位捐赠者决定帮你们一把，买下了你们所有剩余的优惠券册。”*\n\
  \n*“他们要这么多书干什么用？那可是好多本书！等等，我该关心这个，对吧？我的意思是，这很重要，不是吗？”*\n\n*“实际上，我很高兴你想知道。这意味着你没有在仓促下结论，并且开始正确地思考这些衡量标准。它们应该是你用来帮助思考的工具。做得好。”*\n\
  \n*他笑了。*\n\n*“捐赠者像秘密圣诞老人一样，把它们送给了别人。他像发糖果一样把它们分发出去了。现在，更重要的是——如果你明年把订购量翻倍会怎样？”*\n\
  \n*“嗯……我猜如果捐赠者决定不帮我们脱困，尤其是考虑到届时我们在活动的同一时间点可能会有三倍的优惠券册剩余……哦。那可能会是一场灾难。”*\n\n*现在我笑了。“那么，让我们谈谈你真正需要的信息，你真正想了解的东西，如果需要的话，我们可以构建一个指标。”*\n\
  \n设计指标，就像几乎所有组织发展活动一样，涉及的内容远不止实际操作本身。你从设计指标的努力中所获得的，远不止是指标本身。有时，你最终得到的甚至根本不是预期的结果（一个指标），但你总能得到一些有用的东西。\n\
  \n## 规划一个好的指标\n\n### 从何入手\n\n在《为什么组织如此努力却改进甚微》一书中，我和合著者们谈到了在记录指标工作时需要结构和严谨性。与任何其他组织发展工作相比，指标需要更加细致的关注。需要出色的细节关注——不仅是在指标中使用的信息上（记住人为参与的风险），还包括所涉及的流程上。\n\
  \n在本章中，我们将介绍如何识别指标开发计划中的众多可能组成部分，并记录该计划，使其不仅成为创建指标的工具，也成为有效使用指标的工具。\n\n\n\n### 度量开发计划\n\
  \n我们已经讨论过构成度量的基本要素。如果把度量比作一所房子，那么根问题就可以逻辑上视为整栋建筑的地基。没有坚实的地基，房子可能无法持久（问问三只小猪就知道了）。当然，如果这栋建筑本就不是为了长期居住，那么地基的重要性就会大打折扣。我们还讨论了承重墙（`metric`\
  \ 度量）、木龙骨（`information` 信息）、石膏板（`measures` 测量指标）以及钉子（`data` 数据）。但我们尚未讨论建造一栋房子所需的其他各种物品，以及将一栋建筑变成一个家所需的各种组成部分。\n\
  \n虽然度量旨在回答一个根问题，并利用信息、测量指标和数据来赋予其实质内容，但度量还需要其他组件才能成为有用的工具。这些组件都包含在度量开发计划中。\n\n###\
  \ 度量开发计划的组成部分\n\n度量开发计划捕捉了度量的所有组件——数据、测量指标、信息、图表，当然，还有根问题。该计划还记录了这些组件是如何被收集、分析和报告的。开发计划包括时间表、数据所有权归属的信息，以及信息将如何存储和共享。与大多数计划一样，它从头（设计和创建度量）到尾（报告和使用度量）提供指导。计划还可能包含度量何时将不再必要的内容。\n\
  \n度量开发计划为定义清晰、有用且易于管理的度量提供了一份行动方案。至少，它应包含以下内容：\n\n- 目的陈述\n- 关于度量将如何使用的说明\n- 关于度量将不会被如何使用的说明\n\
  - 度量的客户（利益相关者）列表\n- 时间安排\n- 分析\n- 可视化内容或“给我们这些普通人看的图”\n- 叙述性说明\n\n该计划不仅有助于度量的创建，还为其维护和最终处置提供了指导。\n\
  \n如果一件事值得做，那就值得计划好如何把它做对。\n\n### 目的陈述\n\n目的陈述与你的根问题相同吗？答案是：“也许吧”。当你确定根问题时，就像图 3-1\
  \ 所示那样，你将在开发计划中记录目的陈述。\n\n![images](img/0301.jpg)\n\n**图 3-1.** 目的陈述\n\n如果你有一个结构良好的根问题，并且已经尽可能深入地挖掘了，那么你的根问题很可能本身就包含了目的陈述。考虑以下示例：\n\
  \n> *根问题：“我们通过在线聊天提供客户支持的效果如何？”*\n>\n> *目的陈述：“确保我们通过在线聊天提供世界一流的客户支持。”*\n\n两者之间区别不大。但它确实提供了一个更清晰的要求。它给出了这个问题以及相应度量背后的根本原因。度量的目的通常不仅仅是提供洞察或回答你的根问题。所提出的问题通常有一个核心目的。这个目的允许你将多个度量整合到一个总体要求之下。\n\
  \n以我那个通过聊天提供客户支持的例子来说。如果我们不断追问“为什么”，我们可能会发现，其背后存在一个提升整体客户服务/支持水平的需求，以使客户支持团队成为整个组织成功的关键组成部分。这个要求是让客户支持成为对客户的一个卖点。它应该成为客户成为该组织忠诚、重复宣传者的原因之一。\n\
  \n这个根本目的将为我们提供更清晰的度量指南。如果你准备好了，它还能让我们识别出其他所需的度量。你可能不得不暂时满足于使用现有问题，并在未来去处理更全局性的需求。但始终拥有全局观总是最好的——它让你在着手处理局部时，能时刻牢记最终目标。\n\
  \n近来，我与许多客户在组织发展的另一个领域——愿景设定——展开了合作，这个领域让我觉得非常有价值。与我们为识别根问题所做的工作非常相似，愿景设定也需要挖掘其根本的需求或渴望。在愿景设定中，我*不*提倡使用冗长的陈述。当我们撰写陈述时，往往倾向于使用华丽、多音节的词语来描述本应极其简单的事物。你的目的陈述不应该是为了追求美感而精心雕琢的——你又不是要把它裱起来。它应该为了清晰而进行编辑。记住要定义陈述中的每一个词语和从句。\n\
  \n你的根问题是度量*和*目的陈述的基础。如果你已经确定了一个好的根问题，那么问题和你的目的可能是一回事。\n\n在记录度量开发计划时，我会特别强调要同时捕捉根问题和目的。如果两者是同义的，那也无妨。如果并非同义，那么我就能对度量的真正内涵获得更深入的洞察。\n\
  \n请允许我举一个实际的例子。一个女性中心的执行主任和我正在研究一个可能的度量，我们的对话如下：\n\n\n\n> *“我想知道每天有多少女性走进那扇门，”她说。这似乎是个合理的问题，但并非经过充分审视的问题。*\n\
  > \n> *“为什么？你要用这个数字做什么？”*\n> \n> *“我需要向董事会展示我们的价值。”*\n> \n> *我问道：“他们会根据走进你们大门的人数来判断你的价值吗？”*\n\
  > \n> *她想了想，明白了我的意思。“不会。我们的价值取决于我们帮助了多少女性。”*\n> \n> *我说：“衡量价值或许还有其他方式，所以在讨论具体衡量方法之前，我们先深入探讨一下你的问题。你为什么想向董事会证明你的价值？”*\n\
  > \n> *“他们认为我工作做得不好。”*\n> \n> *“你怎么知道他们这么想？”我问。“他们亲口告诉你的吗？”*\n> \n> *“不，当然没有。但他们一直在要求我提供衡量业绩的方法。”*\n\
  > \n> *“评估你的业绩是他们职责的一部分吗？”*\n> \n> *她说：“嗯，是的。我想是的。”*\n> \n> *“那好。我们假设他们只是想从你这里获取信息，以便履行他们的职责。或许一个好的开场问题是：‘执行主任履行职责的情况如何？’”*\n\
  > \n> *“嗯，听起来不错。”*\n> \n> *“那么，你的具体工作职责是什么？”*\n\n从这个起点出发，我得以确定执行主任这个职位的含义。我们本可以将其概括为一个漂亮的宗旨声明，比如“确保护理中心的日常运营得到及时、高效、有效的执行”。这或许值得刻成牌匾，但对于定义衡量主任履职情况的指标而言，并无用处。不，我需要分解构成执行主任职位的各项任务和职责。\n\
  \n通过“你的工作职责是什么？”这样直接的问题，你可以确定适当的衡量标准，从而给出有意义的答案。与任何需求收集工作一样，你必须找到真正的需求，即根本需求。\n\n\
  在我与需要回答上级（指其组织指挥链中的上级，而非天堂）问题的客户合作时，很多时候我们并未触及一个“好的”根本问题——我们往往因为时间限制或数据产出方式的要求而无此奢侈待遇。即便如此，我仍要强调尝试的重要性，无论怎么强调都不为过。在您感到舒适的范围内尽可能挑战现状。询问“为什么”。如果您理解了“为什么”，您在设计指标、收集和分析数据时会做得更好。\n\
  \n图 3-2 展示了在收集数据、度量指标和信息过程中需要捕获的三个关键要素。\n\n![images](img/0302.jpg)\n\n**图 3-2.**\
  \ “如何”与“谁”\n\n##### 信息将如何被使用\n\n除了根本问题和目的，您还应该清晰地阐明*指标将如何被使用*。指标开发计划的这一部分提供了关键工具，有助于克服人们对提供数据的恐惧。它还将有助于消除人们对数据使用方式的恐惧、不确定性和疑虑。同样地，如果您拥有一个结构良好、清晰且基础扎实的根本问题和目的陈述，这部分工作应该很容易。虽然定义指标将如何使用可能很容易，但这并不意味着定义是显而易见的。您需要直接提出问题：“您将如何使用这个指标？”您的目标是尽可能获得最直接的回答。问题越直接，您越有可能得到直接的回答。\n\
  \n*   *模糊的回答：“为了改进我们的流程。”*\n*   *直接的回答：“为了衡量我们实施的变更对流程的影响。”*\n*   *更具体的回答：“为了衡量我们实施的变更对流程的影响，并允许进行纠正调整。”*\n\
  \n如果说公开演讲是最大的恐惧之一，那么个人数据的使用可能紧随其后，位居第二。不仅仅是*任何*数字和数值——而是那些可以用来伤害个人或为我们的组织制造负面公众认知的数据。我们会设想最坏的情况，这是我们的天性。因此，当被要求提供数据，尤其是我们认为在任何方面反映了我们自身或部门的数据时，就会产生巨大的恐惧。\n\
  \n当我们不知道原因时，我们会设想最糟糕的情景。这是我们的天性。\n\n恐惧的最大根源在于，人们认为数据是针对个人层面的。这就是为什么我建议从有效性层面开始制定衡量指标计划。\n\
  \n当您收集（以及后续分析和报告）的数据可能成为关于个人的指标时，恐惧因素会呈指数级增长。即使您计划只使用汇总层面的数据，从不查看个人数据，这也无关紧要。如果数据*可能*被用于个人层面，那么这种恐惧就是合理的。\n\
  \n`解决时间`可以是一个很好的有效性衡量指标，用于改善整体客户服务。其目的可能仅仅是实现更好的客户服务，从而提高满意度。但是，如果您未能传达这个目的、根本问题以及将如何使用这些答案——那么提供数据的个人将会设想最坏的情况。\n\
  \n请预先警告。即使您拥有自动化系统来收集数据（例如，工单开启和关闭的日期和时间），在该系统中开启和关闭工单的人员仍是在提供数据。\n\n如果员工得知您在收集关于解决速度的数据，他们就会“听到”您在收集他们个人解决工单需要多长时间的数据。不是团队或组织解决大多数工单需要多长时间，而是他们每个人完成工作分别需要多长时间。而且，如果您正在收集关于个人绩效的数据，那么被涉及的个人会设想出所有最糟糕的情况，推测您将如何使用这些数据。\n\
  \n因此，您那无辜且恰当的 `解决时间` 衡量指标，如果不加以解释，可能会因恐惧、不确定性和疑虑而引发士气问题。\n\n如果恐惧源于无知，那么在请求数据时不分享目的，您就相当于那个接生婆。\n\
  \n> *老板说：“我只是想要数据，以便了解情况。”*\n> \n> *员工听到：“我想要数据，以便看看你们在哪里搞砸了。”*\n> \n> *老板说：“我需要数据，以便做出更好的决策。”*\n\
  > \n> *员工听到：“我需要数据，以便决定解雇谁、削减谁的工作时间，或者惩罚谁。”*\n> \n> *老板问：“汇报你的业绩有什么问题？我难道不应该了解情况吗？”*\n\
  > \n> *员工心想：“是啊，那你为什么不知道呢？为什么要向我要数据？为什么不直接问我？为什么不花点时间和我在一起呢？”*\n\n\n\n如果你曾在任何拥有多层管理架构的组织中待过较长时间，那么上述对话可能会让你觉得极为熟悉。不幸的是，这种对话并非个例。我相信它（或类似的情形）每天都在每个工作场所上演。\n\
  \n我们需要应对这个普遍的问题。要创建有用的度量指标，你必须在收集数据之前，就预先知道结果（答案）将被如何使用。这对于正确设计度量指标、识别正确的信息、测量方法和数据至关重要。同时，如果涉及任何人为提供数据的环节，这也对于获取准确数据必不可少。\n\
  \n有一个足够简单的测试可以让你尝试。问你的朋友、亲戚、同事或老板一个简单的、私人的问题。更好的做法是，问你的伴侣一个简单问题，比如“你多重？”先别急着问——在阅读预期结果之后（以免你受伤）再行动。\n\
  \n当你问某人一个私人问题，却没有给出任何理由时，很可能会出现以下五种反应之一：\n\n1.  你会被当面质问。至少我问我妻子同样问题时，就是这种结果。\n2.\
  \  你会得到准确反映数据提供者*认为*你想听的数据。\n3.  你会得到准确反映数据提供者*想要*你听到的数据。\n4.  你会获得准确的数据。\n5.  你会收到一个反问：“你为什么想知道？”\n\
  \n大多数人很可能反过来问你：“你为什么想知道？”这是一种自然反应。除了预期的回应，你或许还会注意到受访者变得有戒心。观察他们的肢体语言。他们可能根本不会回答你，就算回答了，也多半不是心甘情愿的。\n\
  \n这个实验的第二步是，你为自己的问题提供一个看似正当的理由，而不是说“哦，我只是好奇”或“我只是想了解一下你的体重”。尽管很多时候，当我们问管理层为什么需要某些数据时，我们得到的回答同样模棱两可：“哦，我只是想了解情况”或“我只是想了解*我们*做得怎么样。”\
  \ 目标不明确会导致数据不准确。在软件编程中，我们有个术语叫 GIGO——垃圾进，垃圾出。处理与他人带有情绪色彩的讨论时也是如此。别被误导了。索要数据会造成情绪紧张。如果你为提问提供了垃圾理由，你就会得到垃圾答案。\n\
  \n仅仅向你采访的人保证每个人都收到了同样的问题，这无济于事。但是，举个例子，如果你先告诉他们你在为学校做一项研究，需要收集十个随机个体的体重，他们可能会回答你的问题。\n\
  \n你可能不会立刻得到答案，而是会得到以下一个或多个回应：\n\n*   “你会使用我的名字吗？”\n*   “谁会看到它？”\n*   “你打算用它做什么？”\n\
  \n所有这些问题的核心都是同一个：你打算如何使用我给你的答案？在你能让受访者满意地回答这个问题之前，你得到的任何答案都高度可疑。\n\n即使你充分解释了你将如何使用这些信息，根据受访者个人对该信息的感受，其准确性仍然可疑。这对你来说可能合情合理。我以前也听过这样的争论。你可能会争辩说，你并不是在打探员工的个人信息，你只是在围绕人员配置制定度量指标，以便为增设一个职位提供理由！\n\
  \n回到我们的实验。问某人：“你多重？”\n\n如果你碰巧得到了一个答案，请把它记下来。同时记下你对这个答案准确性的信心程度。你有 90%的把握它是准确的吗？\n\
  \n如果你一开始没得到答案，那就解释你提问的目的（例如，你正在为课堂项目收集数据）。如果你得到了答案，把它记下来。现在你对它的准确性有多少信心？\n\n作为第三次尝试，分享你打算如何使用这个答案。实际上你说什么都行。你可以说：“我会汇总数据，然后展示我问的十个人的平均体重。接着我们会讨论这个体重是否是一个健康的标准。”\
  \ 看看你是否能得到答案。\n\n别忘了全程观察肢体语言。观察受访者是否在你提供更多信息时减少了戒心。检查你对答案的信心程度。\n\n关于度量指标及其组成部分将如何使用的说明，应记录在度量指标开发计划中。不要纠结于是否需要记录所有内容或让它看起来很漂亮。开发计划的价值在于其目的的清晰性。当然，计划也提供了一致性、长期的指导，以及为可能使用它的其他人指明方向。通过制定开发计划，你将彻底思考清楚这个度量指标，并且能够向任何询问者传达其价值。\n\
  \n我们已经看到，除非我们明确说明收集信息的目的，否则我们所提的问题可能导致没有答案或得到不准确的答案。另一个获得更好答案（或当受访者仍然犹豫时，至少得到一个答案）的关键是，说明这些结果将*不*会被如何使用。\n\
  \n### 说明信息将*不*会被如何使用\n\n当你询问一个人的体重时，告诉他你将*不*会如何使用这些信息。真诚地向他保证，无论怎样，你都不会以他觉得冒犯的方式使用他的信息。这可能包括在已发表的研究中使用，或作为课堂案例研究。你可能不知道他具体担忧什么。通过解释你将不会如何使用这些信息，你为他提供了一个机会，让他分享什么是他觉得不合适的（有威胁性或令人恐惧的）。如果你想获得准确的数据，你就必须能够向数据提供者保证你将如何使用，以及不会如何使用这些数据。而对你而言，对于数据提供者来说，“将*不*会如何使用”可能比“将如何使用”更重要。\n\
  \n这个承诺需要你自己尽职尽责。你必须记住你的承诺——当你收到一个看似天真的信息请求时，这可能会很棘手。你必须确保它在你与数据提供者达成的协议范围之内。\n\n\
  我做出的最常见、最简单的协议是，未经数据源许可，不向他人提供数据。如果你提供了数据，那就是你的数据。应该由你决定谁能看到它。\n\n这应该被记录在开发计划的“将不会如何使用”部分。将计划书面化的主要原因可能是，书面协议能让你更轻松地信守诺言。\n\
  \n定义度量指标将不会被如何使用，有助于防止恐惧、不确定性和疑虑。\n\n\n\n### 确定谁将使用这些度量指标\n\n虽然你可能认为自己是想查看或使用该指标的唯一个人，但实际上，你的指标很可能有很多使用者。一个简单的检验方法是列出所有你计划与之分享信息的人。这份名单很可能包括你的上司、你的同事，以及那些使用你服务的人。\n\
  \n任何会使用你的指标的人都是它的使用者。你应该只向使用者展示这些指标。\n\n你计划与之分享指标的所有人都将成为该指标的使用者。如果他们不是使用者，那就没有理由与他们分享信息。你可能提倡公开透明，想把指标发布在公开网站上，但这些信息并不属于你。它们是数据提供者的财产。这不是公开信息；它旨在帮助组织回答一个根本性问题。为何要与全世界分享？而且今天我们都知道，一旦公开分享，它就会永远留存在公共领域。\n\
  \n数据提供者应该是首要的指标使用者。\n\n可能的指标使用者包括以下这些：\n\n-   为创建指标提供数据的人。\n-   你选择与之分享指标的人。\n-\
  \   向你索要指标，*并且*能够清楚说明他们将如何使用该指标的人。\n\n明确识别你的指标使用者至关重要，因为他们将在指标如何呈现、其有效性以及如何使用方面拥有发言权。如果你想信守关于该指标将如何被使用以及不会被如何使用的承诺，你就必须知道谁会使用它、谁不会。\n\
  \n这些使用者应记录在你的开发计划中，并注明他们属于哪类使用者。他们是数据提供者吗？是一线主管吗？是高层管理人员吗？使用者类型将有助于界定他们接收何种级别的信息，以及围绕指标使用所需的沟通方式。\n\
  \n谁会使用和谁不会使用该指标，与它将如何被使用以及不会被如何使用，同样重要。\n\n在进入下一个部分之前，我们先来做一个现实检验。我很清楚，有时候你无法对上司说“不”。我知道你的上司可能会要求你提供数据、衡量标准或信息，并且可能不会体谅你需要确保他不会滥用或误用你所提供的信息。如果我相信众多作者、同事和朋友的说法——坏经理的数量远远超过好经理。\n\
  \n我并非主张你要为了一项无关紧要的信息请求而“壮烈牺牲”。我是倡导，根据你在组织中的职位，如果你不幸被夹在“坏”经理和员工之间——那么请尽你所能，*竭尽全力*确保你提供的信息不被滥用。\n\
  \n### 报告、分析和收集的时间表\n\n收集用于构建指标所需的数据、衡量标准及信息需要一个计划。图 3-3 展示了制定计划中这部分内容的时间安排。\n\n\
  ![images](img/0303.jpg)\n\n**图 3-3.** 时间表\n\n大多数指标都是基于时间的。你将看到大多数指标的年度、月度或周度报告。有些指标是事件驱动的，需要你定期报告。作为指标开发计划的一部分，你需要为指标的以下至少三个方面制定时间表：\n\
  \n-   *报告时间表*。从最终结果向前倒推来查看时间表。从你的需求出发。考虑你已经识别的使用者，以帮助确定何时需要这些指标。根据指标将如何被使用，也将决定你何时需要进行报告。\n\
  -   *分析时间表*。基于需求，你可以倒推来确定何时需要分析信息以最终确定指标。这是“三合一”时间表中最简单的部分，因为它纯粹取决于完成工作所需的时间。当然，另一个变量是数据量以及分析的复杂性。但最终，你需要将分析时间安排得足够提前，以便完成分析并复核结果。我强烈建议你至少让另外一个人来检查你的分析。根据数据的复杂程度，你可能还需要对分析中使用的原始数据进行质量检查。\n\
  -   *收集时间表*。你何时收集数据？根据你必须报告数据的时间，确定你何时需要进行分析。然后，基于此，确定你需要何时收集数据。通常，数据收集的时间表取决于你如何收集数据。如果是自动化收集，你或许可以随时获取。如果依赖于人工输入，你可能需要等待定期更新。如果你的数据是基于调查的，那么你必须等到你开展调查，并且留出额外时间让人们完成调查。\n\
  \n既然你从最终结果开始构思，你就知道何时需要数据，并能倒推出必须掌握数据的具体日期。根据你选择的收集方法，你可以计划好何时启动收集流程，并据此制定时间表。\n\
  \n这里没有什么新东西——如果你想获得成功，就必须计划如何成功。不要只想着“等有空的时候”再做。要计划它。安排它。如果一件事值得去做，就值得好好规划去做。\n\n\
  而且，如果一件事值得做对，就值得确保你能不止一次地把它做对。但请记住，开发计划不仅仅关乎可重复性，更在于通过强迫自己把事情从头到尾想透彻，从而第一次就把事情做对。\n\
  \n\n\n## 分析\n\n当你认为分析阶段来临时，就该记录分析过程了……没错，就是在分析阶段。\n\n![images](img/0304.jpg)\n\n\
  **图 3-4.** 分析\n\n这可能是到目前为止指标开发计划中最显而易见的部分。在数据收集之后，当我提到指标时，大多数人想到的下一步便是分析。我上过的所有统计课程都指向同一个终点：如何分析你精心收集的数据。计划中的这份分析文档必须包含所有指标数据规则、编辑方法、公式和算法；每一项都应清楚阐明，以便将来参考。\n\
  \n可能会引起争议的是分析工具的绝对正确性。有些人认为，只要拥有准确的数据（甚至少数人连数据是否准确都不在乎），就能通过统计分析来预测、解释或改进任何事物。我可不属于这个阵营。\n\
  \n我非常尊重分析带来的益处，当然，我也依赖它来确定指标所提供的答案。对我来说，指标的设计——从根本问题到抽象图景，再到完整的故事——比数据分析更为重要。这看起来可能有些奇怪。如果我们未能正确分析，很可能得出错误的结论，进而得到错误的答案。但是，如果我们一开始就没有正确设计指标，那么无论分析质量如何，我们都绝无可能得到正确答案。\n\
  \n而如果我们有了良好的基础（正确的组成部分），最终就应该得到一个有用的指标。如果分析有所偏差，我们在指标的汇报和审查过程中很可能就会察觉到这一点。\n\n没有坚实的基础，分析的质量就无从谈起。\n\
  \n虽然分析次于基础，但记录你的分析过程仍然很重要。分析技术（公式和流程）是指标中第二容易变动的部分（最容易变动的是图形化呈现）。当指标被汇报和使用时，我预期它会发生变化。如果我已经通过设计打下了坚实的基础，最终产品仍然需要进行微调。\n\
  \n把这视为与管理层协商的一部分。如果你已经与领导层合作确定了根本问题——并且设法没有惹人厌烦——那么当你交付指标时，你就是在履行你的那部分约定。你将给予领导者她想要的东西——有助于她决策的有用答案。虽然问题是她提出的，但她可能需要对答案进行调整。管理者很少会全盘接受一个指标而不做任何修改。他们几乎总是觉得有必要修改最终的图表。这是因为他们拥有更宏观的组织视野，还是仅仅出于需要感受自己有所贡献，我不确定，但这并不重要。你应该对更改图形化呈现的建议持开放态度。\n\
  \n如果图形化呈现发生了变化，你很可能也需要调整支撑该指标的分析。如果领导者想看到的是满意客户的百分比，而不是平均客户满意度评分，你就必须改变你的分析方法。\n\
  \n原始数据（受访者人数、每个人的评分、回复日期以及每个评分的含义）仍然有效，但你呈现分析的方式以及分析本身需要改变。\n\n将分析记录在开发计划中会很有帮助——这不仅能帮助你理清思路，也有助于复现。在计划的所有部分中，这个组成部分最需要被记录以保证可重复性。你必须确保每次都以相同的方式分析数据，并且任何变更都被记录下来，因为这直接影响到最终展示的指标。\n\
  \n"
- '# 为他人描绘的图景


  你为自己的指标画了一幅画。这幅画是对根本问题答案的抽象表现。一个深思熟虑的指标的另一个主要组成部分是另一幅画——一幅你的客户能够轻松解读的画。这幅画通常是一个图表、图形或表格。计划在你的指标开发计划中包含它。


  ![images](img/0305.jpg)


  **图 3-5.** 可视化呈现


  它完全可以不止一幅画。如果你需要一个由十二个图表、图形和表格组成的仪表板——那就用吧。如果你在根本问题和指标的抽象版本上做好了功课，那么确定如何用图形表示指标应该是一个简单的步骤。真正的好消息是，这部分你不太可能出错。如果你选择了堆叠条形图，后来又意识到应该用趋势线——你可以更改它。没有任何坏处。


  如果你发现不同的结构能更好地讲述你的故事，你不仅可以改变表示指标的方式，而且你可能本来就需要多种表示方式。这取决于客户是谁，每个客户将如何使用该指标，以及你将如何分享它。对于每个群体，你呈现指标的方式可能会有所不同。


  这个部分应该充满乐趣。让你的创造力闪耀出来。想方设法用视觉来解释，这样你就不需要那么多文字了。一张图确实能讲述千言万语。无论图有多好，你仍然需要添加文字来确保观看者理解正确，但我们希望这些文字尽可能简短。我们想要图片清晰地讲述故事。不要把图片搞得太复杂。


  事实上，你拥有的数据可能比讲述故事所需的还要多。你可能会发现自己不愿意舍弃某些信息，但有时少即是多。尤其是当额外信息可能混淆观众时。并不因为你收集了数据，就必须将其放入指标中。


  另外，尝试用不同的方式来描绘指标。你甚至可以在指标客户那里测试视觉呈现的想法。


  '
- '# 叙述性描述


  当有人问：“需要我给你明明白白讲清楚吗？”我很喜欢听到这句话。我的回答通常是：“谢谢！那太好了。”


  为什么不呢？无论你的图形化呈现有多好，你都承担不起误解的风险。你已经挖掘出了问题，并设计了指标，以便能为正确的问题提供正确的答案。你不能让指标的观看者误解你费尽心力讲述的故事。


  叙述是你确保证观看者能以你的视角、像你一样看到所看到的东西的机会。他们希望能听到你试图传达的信息。计划的任何部分都可以定期更新，但叙述需要频繁记录。由于叙述解释了指标在告诉观看者什么，所以解释必须随着故事的变化而改变。伴随图片出现并记录指标含义的叙述，对于指标将如何被使用至关重要。


  图 3-6 显示了叙述被记录的时间点。


  ![images](img/0306.jpg)


  **图 3-6.** 叙述




  ### 文档：让指标开发计划不止于计划


  最终，指标开发计划应记录以下内容：原因（目的陈述）、内容（指标）、时间（时间表）、人员（客户）以及方式（分析、如何以及如何不加以使用）。


  请尽可能详尽地记录——将所有细节汇总在一处。这将通过以下三种方式为你提供帮助：


  *   帮助你全面地思考该指标。

  *   在你需要改进流程时提供帮助。

  *   在你需要复制这些步骤时提供帮助。


  图 3-7 展示了所有这些要素与指标开发流程的协调运作。


  ![images](img/0307.jpg)


  **图 3-7.** 开发计划


  我不想规定具体的篇幅或格式，而是想强调最终计划的可读性。你会需要它作为参考，有时也需要它作为已达成协议的凭证。我发现，当指标报告频率较低时，该计划极其有用。指标报告越不频繁，我就越有可能忘记自己遵循的步骤。数据收集可能非常复杂，数据清洗可能很繁琐，而分析可能还需要更详细的步骤。流程越复杂、执行频率越低，我就越需要记录在案的计划。


  当然，即使我每周都执行该流程，负责任的做法也是将计划记录下来，以便他人能在我不在场时继续执行。


  该计划在指标的整个生命周期中都有用。它首先帮助我充分构思指标的设计与创建。然后，它有助于记录围绕指标使用和时间表达成的协议。它有助于为行动辩护（成为指标分析师、数据提供者与最终客户之间的契约），并满足各方期望。最后，它对长期成功也至关重要。它既提供了历史视角，也提供了一份“操作方法”指南。没有可重复性，就无法改进。


  没有可重复性，就无法改进。


  开发计划的各个组成部分需要以一种能够轻松、准确查阅的方式进行记录。确保准确性比确保易于查阅更困难。我们讨论了不同的数据收集方法以及提高准确性的途径。真正的好消息是，很多时候，我们用来提高准确性的方法也使其更易于查阅。减少人工干预能让我们对数据准确性更有信心，而自动化则使数据收集更简单。


  在记录各个组成部分时，不要害怕写得详细。此刻不是追求简洁的时候。我们需要建立对指标及其组成部分的信心。我们需要尽可能多地记录每个组成部分的相关信息，以便在以下方面建立信任：


  *   *原始数据的准确性*。你将会在这方面受到质疑，而且这合情合理。人们对你的根本问题应该得出什么答案有自己的预期。他们对数据针对该问题应该说明什么也有自己的预期。无论答案如何，*总会有人*认为你搞错了并去核查你的数据。因此，你在分享数据时必须准确无误。这就要求你对数据进行质量检查。无论错误是由你的数据来源、公式还是软件故障造成的，都无关紧要。如果你的数据被证明是错误的，你的指标就不会被信任或使用。


  大多数原始数据不准确的例子都可以归因于人为错误，但即使是自动化工具也容易出错，尤其是在数据解释方面。错误可能出现在任何地方，从错误地记录数据、计算错误，到将信息归入错误的类别。如果你的类别定义不当，自动化系统可能会正确地报告数据，但它报告的可能是错误的数据。如果你在跟踪解决故障单的时间，这个时间是指开始和结束日期之间的时间吗？还是指从接到呼叫到最终解决（可能远在故障单关闭的日期/时间之前就已发生）的时间？你是用日历天数还是工作日来跟踪时间？如果你在报告可用性，什么才算是中断？你如何确定中断发生了、何时发生以及持续了多久？简单的经验法则是反复检查你的数据。我发现检查数据的最佳方法是让别人也看一看。我距离工作太近，无法看到他人一眼就能发现的错误。


  在起步阶段，没有什么比你原始数据的准确性更重要了。


  *   *你分析的准确性*。我们稍后会讨论分析方法，但眼下，记录下来你分析数据所采用的流程和步骤至关重要。这将使你能够重复该流程——这是保持一致性的必要条件。一个简单的例子是电子表格程序中的公式使用。我很多指标工作都在电子表格程序中完成，因为它们简单、用户友好且功能强大。我使用公式来计算从经过的天数到随时间变化的百分比等一切内容。无论你使用何种方法，都必须记录下来。任何审阅你工作的人都应该能够通过手工（使用笔、纸和计算器）重现你的工作。这种记录工作虽然繁琐，但必不可少。你的流程必须是可重复的。你的流程*必须*在数据、分析和结果中实现零缺陷。


  你的流程及其产生的信息必须毫无差错。


  *   *你流程的可重复性*。是的，我已在分析准确性部分提及此点。但值得再次强调和澄清的是，可重复性不仅对分析至关重要，而且贯穿于设计指标的整个流程。数据的收集必须是可重复的——在严格意义上。数据的分析必须是可重复的。数据的图形化呈现也必须是流程中可重复的步骤。每次，你都应以相同的方式收集、分析和报告数据。如果你不记录流程并确保其可重复性，你将失去受众至关重要的信任。这种可重复性在整个流程中都不可或缺。这正是我们制定时间表的原因。我们希望以相同的方式、在相同的时间间隔内、使用相同的工具来完成工作。一致性至关重要。


  没有可重复性，你就谈不上拥有一个流程。


  为了遵循良好文档管理的原则，你需要使用一种方法来控制你的数据、分析和报告的版本。你需要对存储的信息进行备份。所有列出的文档都必须加以保护，防止丢失或篡改。你必须确保各组成部分的准确性，而如果你不控制对信息的访问权限，就无法做到这一点。


  首先，你必须确保你的数据来源正在产生准确的信息。当你检查了数据质量并对准确性有了很高的信心后，你必须重复你用于收集这些信息的流程。一旦你获得了准确的数据，你就必须确保它始终保持准确。


  人员是准确数据面临的最大风险。




  '
- "# 排版后的内容\n\n你需要一个安全可靠的位置来存储数据、分析结果和报告。你需要保护它们，防止他人无意中篡改。同时，也要防止自己犯错。你上一次在过了正常就寝时间还继续工作是何时？上一次输入数据出错是何时？上一次因忘记定期保存而损失超过一小时的工作成果是何时？\n\
  \n你难免会犯错——这是不可避免的。关键在于尽可能地减轻这种现实影响。\n\n那么，如何减轻这些无疑会犯的不可避免的错误呢？尽早保存、频繁保存，并将工作成果保存在多个位置。手头保留一份纸质版工作成果作为最终保障也无妨。除了备份数据，记录下流程也同样重要。\n\
  \n另一个减少错误的工具是在所有公式中使用变量。如果你使用软件执行方程计算，避免在公式中出现原始数据。将所有会重复使用的值放在一个单独的位置（工作表、表格或文件）。这不仅有助于避免错误，还能让修改公式变得更简单。\n\
  \n引用所有数值，并将原始数据排除在等式之外。\n\n以下是一些其他提示，有助于你记录计划：\n\n-   **疲劳时不要工作。** 说真的。你应该足够了解自己，知道自己何时疲劳。放下工作，休息好后再回来。有些事可以在疲劳时做——但度量指标不在此列。\n\
  -   **坚持你的流程。** 不要让紧迫的截止日期迫使你偏离流程。你可能会为了快速更新指标以满足意外截止日期而想走捷径。抵制这种想法。抵制那些在约定时间之前就要求数据的人。每当你偏离流程，就增加了犯错的风险。\n\
  \n从说“不”开始。拒绝仓促行事。\n\n-   **使用版本控制。** 不需要非常复杂——只要有效即可。只要能够追踪已完成的工作以及做出的任何更改，就需要能够“撤销”已做的更改，并回退到你信任的早期版本。\n\
  -   **尽可能创建并使用模板。** 模板能让你的流程更具可重复性，并确保你以相同的方式收集相同的数据。我在调查、访谈和问卷中都会使用模板。在分析以及创建图表时也会用到它们。需要注意的是——请仔细核对模板的准确性。\n\
  \n重复使用很棒！何必重新发明轮子？只需仔细检查这个轮子没有损坏的辐条即可。\n\n## 关于流程副产品的说明\n\n在处理根本问题时，你可能识别出一些副产品，如目标、目的、任务和成功衡量标准，这些对于指标设计并非必需。在构思指标的抽象图景时，其他想法也会浮现。当你捕捉到可能需要的衡量标准以完善图景时，你会发现所需之外的内容。你将这些多余的项目暂存或保存到待办事项列表中。所有这些副产品都有可能帮助你改进组织，并且可能非常有价值。它们应该被记录和分享。不要浪费它们。\n\
  \n不要浪费任何东西！你的知识产权很有价值——请尊重它。\n\n## 内容回顾\n\n我介绍了一个分类法，以便我们能够围绕指标这一主题进行清晰的沟通。在第二章，我涵盖了设计指标的理论和概念，以及收集、分析和报告构成该指标的数据、衡量标准和信息的高级流程。在本章中，我介绍了如何开始以及从何处开始的基础知识。我有意将信息保持在较高层次，以便在我开始深入细节之前，你能对这个概念感到适应。本章涵盖了：\n\
  \n-   指标开发计划不是奢侈品，而是必需品。\n-   该计划不仅有助于创建指标，还为指标的维护和最终处置提供了指导。\n-   指标开发计划由以下部分组成：\n\
  \    -   目的陈述\n    -   如何使用它的说明\n    -   不会如何使用它的说明\n    -   指标客户名单\n    -   时间表\n\
  \    -   分析\n    -   可视化或“为我们其他人准备的图像”\n    -   叙述性说明\n-   准确性至关重要。我强调了数据（依赖于来源）、数据收集（依赖于流程）和分析（依赖于流程和工具）中准确性的重要性。我还提出了使流程可重复的好处。\n\
  \n## 结语\n\n我们已经为负责任地设计和使用指标奠定了一些基础。我们提供了一些实际实施指标计划的工具。接下来的三章将涵盖指标计划中固有的危险，我将提供警告、缓解措施和威胁，以帮助你避免许多人陷入的困境。我相信这是一个合乎逻辑的递进——因为在你使用一个强大且因此存在潜在危险的工具之前，重要的是你要理解它是什么、应该如何正确使用，以及如何避免受伤。\n\
  \n几乎在每一项严肃的工作中，你都会被告知要记录你的工作。从软件工程到撰写资助申请，这一点都倍受强调。问题在于，这很繁琐。我不知道有谁对记录工作充满热情。如果你未能记录其他所有内容，我可以原谅你——只要你还记录下你的指标。\n\
  \n![images](img/ch04.jpg)\n\n## 将指标用作指示器\n\n为简单起见，到目前为止，我只关注以下基本概念：\n\n-   指标由基本组件构成：数据、衡量标准、信息和其他指标。\n\
  -   指标应基于一个根本问题来构建。\n-   分享你不会如何使用一个指标，比分享你将如何使用它更重要。\n\n本章介绍关于创建和使用指标的另一个基本概念——指标无非就是指示器。这听起来像是在说它们并不强大，但我们知道事实并非如此。指标可以极为强大。相反，将指标视为指示器这一概念提醒我们，不要将指标提升到真理的地位。\n\
  \n指标的巨大威力通过其可能造成的巨大破坏得以证明。指标的价值根植于其激发对话的内在能力。指标应能引出客户与服务提供者之间、管理层与员工之间的讨论。围绕改进机会和数据中的异常情况，应能开出讨论之花。这些讨论的基础应是对指标所提供的指示器进行调查、分析和解读。\n\
  \n指标应是调查、讨论的催化剂，然后才是行动。对指标唯一正确的回应就是去调查。不是第 15 章研究方法中讨论的那种一般性调查，而是针对指示器背后真相的、有方向的、重点突出的调查。\n\
  \n\n\n### 事实未必为真\n\n如果你在网上搜索我们认为是正确的事物（当然，要有数据支持），最终你会发现不止一个网站提供“推翻”古往今来各种迷思的“证据”。曾被当作事实的东西，后来被证明是理论的错误运用或数据的误读。\n\
  \n我们之前举的健康信息例子就是一个成熟的领域，充满了人们曾经确信为真、如今却相信相反观点的事情。想想那些十年前被认为有益健康，如今却被认为不健康的食物。或者那些曾经被认为不健康，现在却被视为健康食品的东西。鸡蛋到底对身体好不好？答案不仅取决于你问的是谁，还取决于你问的是什么时候。\n\
  \n- 美国政府的“食物金字塔”定期变化。\n- 谁不记得《洛奇》生吞鸡蛋的场景？\n- 似乎每年我们都会得到一个新的“饮食法”要遵循——高蛋白、高胆固醇、低脂肪、不吃红肉、或者吃鱼……说法时常在变。\n\
  \n关于旧事实与新知不一致的话题，有一个很好的论点：事实本身并未改变，改变的是我们对它们的解读。\n\n让我们快速看一个也许不是真理的事实。\n\n这与亚马逊的图书销售排名有关。迈克尔·兰索恩，我以前的合著者之一，喜欢在亚马逊网站上观看我们这本书的销售排名。他对数据非常有信心，他的兴奋程度会随着数字的高低而起伏。问题在于，这些排名是每日更新的，不仅取决于我们这本书的销量，还取决于网站上所有其他书籍的销量。而且，这些销量只计入个人购买者。如果你一次性购买一千本我们的书，亚马逊只会将其计为\
  \ *一* 笔销售并计入排名。但如果你分成一千个独立订单下单，它就会被算作一千笔销售，从而提升排名。另一个问题是，亚马逊不在乎是谁购买了这本书。如果是我买了这些书，它也会提升我们的排名，尽管这没有什么偏向性，因为我是作者之一。\n\
  \n要点很简单。虽然数据是“准确的”（或者至少你可以高度相信它们是准确的），但对这些数据的解读可能存在问题。迈克是否应该因为这本书越来越受欢迎而预期销量上升，从而买台新电视？还是应该因为排名骤降、销量不佳而沮丧？\n\
  \n很明显，这两个问题的答案都是“不”。\n\n这种把指标错当成事实的情况，也体现在只向观察者传递部分指标的场景中。\n\n一个商业上的例子是我一个朋友喜欢讲的关于服务台分析师的故事。根据所有记录，这位分析师处理完一个案件所花的时间是其他分析师的三到五倍。“事实”很清楚——他效率更低。他处理的案件数量还不到同事们的一半，而且处理每个案件所花的时间要长得多。他的“数字”非常糟糕。\n\
  \n服务台的经理根据这个“事实”做出了一个决定。而且，这个“慢”员工同时也是年纪最大、在服务台工作时间最长的分析师，这一情况可能也没能让经理的思考过程更周全。当时的经理犯了一个错误，他相信自己看到的数据是“事实”，而不是一个指标。他没有去调查此事，而是立即采取了行动。\n\
  \n> *他把这位表现不佳的员工叫进办公室，开始痛骂他一顿。当他终于结束批评时，他给了这位员工一个说话的机会，但也只是为了回答这个问题（一种隐晦的威胁）：“那么，你打算怎么做？你打算如何缩短解决案件的时间？我希望看到你关闭更多案件，而且更快。”*\n\
  >\n> *这位员工表现出比当时内心感受更多的耐心，回答说：“我的第一个问题是，我的工作质量怎么样？”*\n>\n> *“差劲！我刚告诉你了。你是部门里最慢的分析师！”*\n\
  >\n> *“那只是我工作的速度，不是质量的好坏。你收到过投诉吗？”*\n>\n> *“嗯，没有。”*\n>\n> *“有客户投诉吗？”*\n>\n> *“没有。”*\n\
  >\n> *“那我的同事呢？他们有人投诉吗？”*\n>\n> *“没有，”经理说，“但数据不会说谎。”*\n>\n> *“你说得对，数据不会说谎。它只是没有说出全部情况，因此它不是真相。”*\n\
  >\n> *“什么？你是想告诉我你不是最慢的吗？你就是那个关闭案件的人。难道是你能力不行吗？”经理暗示他在工作完成后并没有关闭案件。*\n>\n> *“不，我是最慢的，”这位员工承认道。“而且，我不是能力不行，恰恰相反。你有没有问过部门里的其他人，为什么我很慢？”*\n\
  >\n> *“没有——我正在问你。”*\n>\n> *“实际上，你从来没有问我原因。你一开始就给我看数据，显示我‘慢、效率低’，现在又说‘能力不行’。”*\n\
  >\n> *经理对事情发展到这一步感到不快。员工继续说道：“你有没有检查过我关闭的案件类型？实际上我比大多数同事都快。如果你看看我关闭简单案件的速度，你会发现我是最快的之一。”*\n\
  >\n> *“数据没有那样细分，”经理说。“我怎么能知道你们每个人关闭的是什么类型的案件？”*\n>\n> *员工回答说：“问啊？”他沉默了一会儿。“如果你问过我或部门里的其他人，为什么我关闭案件需要更长时间，为什么我关闭的案件更少，你会发现一些事情。我关闭的案件更少，是因为我关闭案件的时间更长。其他分析师把他们解决不了的案件都交给我。我处理最难办的案件，因为我经验最丰富。我不慢，不效率低，也不是能力不行。恰恰相反。我是你部门里最好的分析师。”*\n\
  >\n> *经理看起来很不自在。*\n>\n> *员工接着说：“所以，告诉我，你想让我改变什么？如果你愿意，我就不再从其他分析师那里接案子了，让客户最棘手的问题得不到解决。你来决定。你是老板。”*\n\
  \n不用说（但说了很有趣）的是，老板后来再也没有因为他的处理时间问题而找过他麻烦。而且对所有人来说幸运的是，老板在那个位置上也没待多久了。\n\n面对指标，唯一恰当的初步反应是进行调查。\n\
  \n之前，我提出过指标不是事实的观点。如果你决定把指标当成事实，你就可能赋予它们过高的价值。当领导层决定用指标来“驱动”决策时，这是很危险的。这给了指标超出其应得的权力。当我们把指标提升到真理的高度时，我们就不再深入探究了。我们还可能基于某些可能并非百分之百准确的信息做出决策并采取行动。\n\
  \n指标不是事实。它们是指示器。\n\n当我们赋予指标一些名不副实的崇高地位（当作真理而非指示器）时，我们就是在鼓励我们的组织去“追逐数据”，而不是去解决这些指标旨在回答的根本问题。我们向员工传递了一个完全明确但同样错误的信息：指标才是最重要的。我们最终会试图用数字、百分比、图表和曲线图来影响行为。\n\
  \n\n\n"
- "# 指标只是指标\n\n最简单的例子可能来自客户满意度调查。即使在焦点小组访谈中获得的直接反馈，也需谨慎对待。当我们审视真正客观的数据时，总有被误解的余地。客观的测量工具可能存在缺陷，并产生错误数据。\n\
  \n大多数时候，优秀的管理者（以及优秀的员工和优秀的客户）无需数据就能了解真相。当你看到与直觉不符的数据时，请进行调查。当数据过于轻易地符合你的预感时，也请进行调查。\n\
  \n按照我建议的方式构建指标的主要好处之一是，它能完整地讲述一个故事，回答一个根本问题。如果你构建得当，它很可能是准确和全面的。这是你最接近真相的东西。但根据经验，我知道无论我多么努力，总会有出错和曲解的空间。为调查原因稍作停顿不会有坏处——而且可能大有裨益。\n\
  \n## 指标可能是错误的\n\n由于任何收集方法中都可能存在变数和错误，因此任何衡量标准的完全有效性总是有存疑的余地。如果你对信息所表达的内容没有健康的怀疑态度，你往往会误入歧途。假设你汽车的发动机检查灯亮了。再假设这辆车是新车。即使我们知道这个灯是故障指示灯，我们也应避免妄下结论。我最喜欢去修车店的经历是，他们对我发动机检查灯进行诊断，并确定唯一的问题*在于*发动机检查灯本身。\n\
  \n也许你在想，燃油油位指示器会是一个更好的例子。如果燃油表显示接近空油，特别是在警告灯亮起的情况下，你可以高度确信需要加油了。但燃油表仍然只是一个指示器。也许它比发动机检查灯更可靠，但它仍然只是一个指示器。除了涉及的变异性（我注意到，在斜坡上时，指针会从接近空油跳变到接近八分之一箱油！），仍然存在油表卡住或损坏的可能性。\n\
  \n我理解如果你选择相信燃油表、温度计或数字时钟——这些是单一度量。但是，当你审视由多个数据、度量和信息组成的指标时，我希望你在解读指标含义时，保持适度的谦逊。\n\
  \n这种健康的谦逊能防止我们仅凭指标就匆忙得出结论或做出决定。\n\n指标是工具，是指示器——它们不是答案，并且可能有多种解读。\n\n我经常听到（频率之高让我反感）指标应该“驱动”决策。我更喜欢的态度和信念是，指标应该“为决策提供信息”。\n\
  \n## 准确的指标仍然只是指示器\n\n撇开出现错误数据的可能性不谈，还有一些重要的理由让我们不要过分信任指标。\n\n让我们来看一个美国职业棒球大联盟的例子。我喜欢用棒球举例，因为在所有主要运动中，棒球无疑是最注重统计的。球迷、记者、解说员和球员都用统计数据来讨论这项美国国球。可以说，统计数据是比赛固有的一个组成部分。\n\
  \n入选国家棒球名人堂，在很大程度上是球员职业生涯的巅峰。让我们来看一位最伟大球员的数据。2011 年，我亲眼目睹了德里克·基特（Derek Jeter）的第\
  \ 3000 支安打（一支本垒打），这是球员几乎可以确保进入名人堂的成就之一（基特是有史以来第 28 位达成此成就的球员）。问题立刻被提出——基特能否成为历史安打王？当时的历史安打王有\
  \ 4256 支安打！就我个人而言，我认为基特做不到。\n\n这位历史安打王在 23 年的职业生涯中，曾 17 次入选全明星赛——而且是以前所未有的五个不同位置入选。他赢得了三次世界大赛冠军、两次金手套奖、一次国家联盟最有价值球员（MVP）奖，以及一次世界大赛\
  \ MVP 奖。他还赢得了年度最佳新秀奖、卢·格里克纪念奖，并入选了美国职业棒球大联盟世纪之队。根据一个在线来源，他在美职联的纪录如下：\n\n*   最多安打\n\
  *   最多出局数\n*   最多参赛场次\n*   最多打席数\n*   最多一垒安打\n*   作为左右开弓打者的最多得分\n*   作为左右开弓打者的最多二垒安打\n\
  *   作为左右开弓打者的最多保送\n*   作为左右开弓打者的最多垒打数\n*   单季 200 支以上安打的最多赛季数\n*   单季 100 支以上安打的最多连续赛季数\n\
  *   单季 600 个打席的最多连续赛季数\n*   唯一在五个不同位置都打了超过 500 场比赛的球员\n\n这位棒球运动员还保持着其他一些世界纪录，以及许多国联纪录，包括最多得分和最多二垒安打。\n\
  \n在我能找到的所有榜单中，他都位列历史棒球运动员的前 50 名。1998 年，*体育新闻*将他排在第 25 位，而美国棒球研究协会将他排在第 48 位。\n\n\
  所以，基于所有这些客观、经过严格核查的数据，应该很容易理解为什么这位职业棒球运动员在他有资格参选的第一轮投票中就全票入选了国家棒球名人堂。\n\n但他并没有入选。\n\
  \n他的名字是皮特·罗斯。他不在棒球名人堂中，而且可能永远进不去。如果你看在名人堂投票者们使用的所有统计数据，他的入选是显而易见的。但这些统计数据在讲述一个完整故事的同时，缺少了被考虑进去的输入信息——具体来说，他违反了棒球界一条不可逾越的规则：他在职业棒球比赛中合法和非法的赌博行为。\n\
  \n面对“皮特·罗斯应该入选棒球名人堂”这一压倒性的“事实”，真相与数据截然相反。\n\n即使我们看到定义明确、讲述完整故事的指标，它们在最真实的意义上也只是指示器。如果你完全且清晰地解释你调查的结果，你就能通过解释指示器的含义来完善指标。你解释这些指标指示了什么，以便做出更好的决策、发现改进机会或确定进展。你提供了一种解读——希望这种解读有你调查结果的支撑。\n\
  \n无论你如何装饰，指标都只是指示器，因而只应引发一个初始反应：进行调查。\n\n当然，有些指标足够简单，你无需太多调查就会接受它们所讲述的故事（比如你车上的燃油表），但即使在这些情况下，你也应保持警惕，以防它们开始向你显示你认为具有误导性或错误的数据。\n\
  \n归根结底，即使你对数据的准确性有十足的信心（例如，职业体育统计数据），你也必须将它们全部视为指示器。数据无法预测未来。如果它能，那么就没必要进行比赛了！\n\
  \n关键在于，指标不应被视为事实，而应被视为当前和过去状况的指示器。如果运用得当，指标应引导我们的对话，帮助我们集中注意力，并将我们的注意力引向正确的方向。指标并不提供答案；它们帮助我们提出正确的问题并采取正确的行动。\n\
  \n## 指示器：定性数据与定量数据\n\n定性数据和定量数据的简单区别在于，定性数据由意见构成，而定量数据由客观数字构成。定性数据更容易被接受为一种指示器，而定量数据则更可能被错误地视为无需进一步调查的事实。让我们来看看这两大类指示器。\n\
  \n\n\n### 定性数据\n\n客户满意度评级是一种观点——衡量客户满意程度的定性指标。大多数定性数据收集工具包括调查问卷和访谈。它们可以采用开放式问题、选择题或评级的形式。即使是观察结果，如果不涉及捕捉“数字”——比如统计棒球中的击球次数，或关于特定产品线的提问数量——也可以是定性的。当观察结果捕捉的是观察者的观点时，我们得到的仍然是定性数据。\n\
  \n很多时候，我们需要用定性数据来回答我们的根本问题。除了询问客户满意程度之外，其他例子还包括：\n\n- 你的员工满意程度如何？\n- 你的客户更喜欢普通产品还是低糖产品？\n\
  - 他们希望多快能拿到产品？\n- 你的客户愿意为你的产品或服务支付多少钱？\n- 你的客户希望在什么时间或时段获得你的产品或服务？\n- 你的员工是否感受到被重视？\n\
  \n无论你如何收集这些数据，它们都是观点。它们不是客观数据。在很大程度上，它们甚至不是数字。你可以获取定性数据，并尝试将其转换为更具定量的形式——例如，将观点转化为李克特量表上的分值。但归根结底，它们仍然是观点。它们看起来像定量数据，但实际并非如此。\n\
  \n一些分析师，尤其是那些坚信“客户永远是对的”的分析师，认为定性数据是最好的数据。这些分析师相信，通过开放式问题，你可以获得关于你的流程、产品和服务的宝贵反馈。既然客户是上帝，还有什么分析工具能比捕捉客户对你产品和服务的看法更好呢？\n\
  \n这些分析师很喜欢焦点小组和访谈。调查问卷在紧急情况下也凑合能用，但缺乏让分析师观察非语言信息及其他线索的能力，而这些线索有助于他们判断“我们的客户有多满意？”这个问题的答案。\n\
  \n近年来最受欢迎的组织发展书籍之一是马库斯·白金汉和柯特·科夫曼合著的《首先，打破一切常规》（Simon & Schuster, 1999 年）。这本书建立在对定性数据的分析之上。其书评向潜在读者承诺，能帮助他们“洞察”成功公司中成功管理者与领导者的内心，以此吸引读者。这本书的巨大成功，仅仅是定性分析力量在现代的一个实例。\n\
  \n### 定量数据\n\n定量数据通常指数字——不带情感的客观度量。这包括你汽车上的所有仪表。它们也包含来自自动化系统（如自动呼叫工具）的信息，这些信息告诉你接听了多少电话、接听耗时多久以及通话时长。\n\
  \n过去曾有一场争论，认为一种数据形式优于另一种。有人认为定量数据更好，因为它避免了基于情感观点的数据中天然存在的不一致性。定量阵营随后辩称，某人可能因多种与产品质量无关的原因，而在满意度量表上对你的产品给出高分或低分。评估服务质量或产品时，一些可能影响定性评估的因素包括：\n\
  \n- 提问的时间点\n- 受访者在你提问前的心情\n- 受访者过往使用类似产品或服务的经历\n- 房间的温度\n- 照明条件\n- 提问者的外貌吸引力\n-\
  \ 访问者是否有外国口音\n\n这个列表可以无限列举下去。另一方面，定量数据则避免了这些变数，直接关注那些可以被计数的事物。在同类场景下的一些例子包括：\n\n\
  - 购买你产品的客户数量\n- 客户购买该产品的次数\n- 客户为你的产品支付的金额\n- 客户还购买了哪些其他产品\n- 产品退货的数量\n\n定量信息的支持者会认为，这种数据更可靠，因此也更有意义。\n\
  \n我相信你已经猜到，这两种观点都不完全正确。我建议混合使用两种类型的数据。\n\n### 定量与定性数据\n\n在很大程度上，定性和定量数据各自的缺陷，最好通过引入对方数据来弥补。孤立地看待定性数据很难令人信服，因为影响所收集信息的因素太多。如果客户说他们喜欢你的产品或服务，但从不购买，那么当公司倒闭时，你从积极反馈中获得的温暖感将毫无帮助。关于销售数量和回头客数量的定量数据，则有助于为定性反馈提供信心。\n\
  \n如果我们只看定量数据，我们就有做出不明智决策的风险。如果我们测试产品的全部库存一天内售罄，我们可能会认为这是个热门产品，并预期能卖出更多。如果没有定性数据支持这一假设，我们可能会进行大规模生产并投入巨资。定性问题本可以告诉我们产品为何如此畅销。我们或许会了解到，这种即时成功的原因不太可能重现，因此在全力推进之前，我们需要进行更多的研发。也许产品售罄是因为一个糊涂的客户被派去购买大量\
  \ X 产品，却错误地买了很多你的产品。也许它卖得快是因为它是一个外观新颖的新产品，但当被问及时，客户向你保证不会再买——他们并不喜欢它。\n\n你不仅应该使用两种类型的数据（以及相应的数据收集方法），还应该争取收集多种数据。当然，一旦你收集了数据，就必须研究其结果。\n\
  \n你可能认为定性指标是更明显的指示器。然而，即使我们问一位客户是否对产品满意，她斩钉截铁地回答“是”，她的回应也并不意味着她真的满意。我们唯一知道的“事实”是，受访者说她满意。\n\
  \n即使在自动呼叫软件的情况下，结果也只是指标。\n\n定量数据虽然客观，但仍然只是指标。如果你不知道数字为何如此，你最终只能猜测数字背后的原因。如果你猜测原因，你就是在猜测答案。\n\
  \n指标（指示器）需要经过解读才能被恰当使用。\n\n我主张采用三角互证法（参见第七章），以便更全面地理解任何根本问题的完整答案。这要求我们不应单独依赖定性或定量数据。关于哪种更好的大辩论是不必要的。你应该在你的方案中综合使用这两者。\n\
  \n\n\n### 回顾\n\n以下是需要记住的原则：\n\n- `指标仅仅是指示器。`\n- 指标并非事实。即使你对它们的准确性有很高的信心，也不要将其提升到真理的地位。\n\
  - 对指标的唯一正确回应是进行调查。\n- 当你通过添加叙述来讲述故事时，你是在解释指标所表明的内容，以便做出更好的决策、发现改进机会或确定进展情况。\n- 指标主要有两类：定性指标和定量指标。定性指标本质上具有主观性，通常是意见的表达。定量指标本质上具有客观性，通过自动化、公正的工具进行汇编。\n\
  - 指标本身并不能提供答案；它们帮助我们提出正确的问题并采取正确的行动。\n- `指标需要解释才能发挥作用。`\n- `即使是解释本身也可以被解读——指标的目的不是提供真理，而是提供洞见。`\n\
  \n## 结论\n\n指标仅仅是指示器。这并不意味着它们无效或不准确。即使是最客观、最准确、最有效的指标，也只能被当作指示器对待。在空军服役期间，我学到了“感知即现实”。这一点同样适用于指标。我坚持要求你在图表旁边附上解释的主要原因之一，就是为了限制对指标感知的差异性。对指标的解释不应留给观看者。你应该尽职尽责地进行调查，探究指标在告诉你什么。你应该根据调查结果，基于数据形成深思熟虑的结论。这些内容应在指标的解释中提供。\n\
  \n然后，你要尽最大努力向你的受众“推销”你对指标的解释。即便如此，你也必须接受，你的解释对于那些查看指标的人来说，仍然是可以被解读的。你还必须接受，你精心定义且完整讲述的故事，归根结底也只是一个指示器。它应该是一个解释充分的指示器，并且你的诊断正确地解读了它；但它终究只是一个指示器。这需要你保持健康的谦逊态度。\n\
  \n请记住，指标只是一种工具。它们不应被赋予更多含义。\n\n## 使用答案密钥\n\n### 一个捷径\n\n本章标志着本书实践部分的开始。我们在第一部分涵盖了大量理论和概念，这些内容应为实际工作奠定基础。\n\
  \n`答案密钥` 是一个工具，旨在帮助你确保找到根问题的正确答案。它适用于大多数组织改进方面的问题。它还能为你提供关于你可能希望衡量的其他领域的想法。当你使用`答案密钥`来推进组织改进工作时，你将获得最大收益。\n\
  \n### 什么是答案密钥？\n\n`答案密钥`的起点是任何指标的定义点：对信息的需求，即根问题。`答案密钥`并非适用于所有根问题，仅适用于涉及组织健康的问题。组织健康涵盖了通常我们为其制定指标的广泛问题和需求。大多数根问题，尤其是在商业环境中，都围绕着组织运行状况如何展开。大多数平衡计分卡（见下文框）和关于客户满意度的问题都属于这一范畴。\n\
  \n`答案密钥`是你将遇到的许多指标的捷径。它包含了我建议组织在首次尝试实施指标体系时应首先采用的指标。\n\n**平衡计分卡与仪表盘**\n\n平衡计分卡由半导体公司\
  \ Analog Devices 的经理阿特·施奈德曼于 1987 年引入。其最著名的倡导者是哈佛商学院的教授罗伯特·S·卡普兰和 Palladium 集团的创始人兼董事大卫·P·诺顿博士。其基本概念包含四个视角：财务、客户、内部业务流程、学习与成长。通过关注这些关键领域，管理层可以利用衡量指标和目标来把握组织的脉搏。\n\
  \n虽然我不赞同“目标”这一概念，并且对整个平衡计分卡有所保留，但它具有我必须尊重的优势。平衡计分卡已被许多组织成功使用，并且至今仍然流行。\n\n“仪表盘”则是后来以更平衡的方式推广指标的一种形式。它秉承其名称的精神而创建，是一种动态的指标工具。与平衡计分卡类似，仪表盘也采用多项衡量指标，但包含了一个围绕关键绩效指标构建的、更具实时性的组件。可供选择的指标流程和工具层出不穷。好消息是，我所提供的内容可以应用于这些流行方法中的任何一种，或者你也可以开始一段个人旅程，从零开始构建你自己的指标。\n\
  \n`答案密钥`可以帮助你确定指标的发展方向。它还能识别出与你起始问题相关的其他问题。它还可以帮助你避免误入歧途，或避免精力过于分散、缺乏重点。\n\n`答案密钥`由从左向右分支的层级组成。每个层级都比前一个层级包含更多的衡量指标和数据。以下各节将更详细地描述这些层级。\n\
  \n#### 答案密钥：第一层级\n\n第一层级与其说是一个层级，不如说是一个起点。你的根问题是否是一个组织信息需求？你的根问题是否涉及关于组织的信息，特别是关于组织健康的信息？如果是，你的问题很可能属于以下两类关注点之一：\n\
  \n- 你向客户提供服务和产品的效果如何\n- 你组织的未来前景如何\n\n#### 答案密钥：第二层级\n\n如果你的根问题符合`答案密钥`前两个层级之一，那么这个工具将帮助你集中精力并找到可行的衡量指标，而无需花费过多时间寻找它们。但是，如果你的问题不符合`答案密钥`，请不要为了使用这个捷径而改变你的问题。\n\
  \n同时，也不要忽略首先提出根问题的必要性。换句话说，不要从密钥开始。如果你这样做了，最终将阻碍你开发有用指标的努力，更重要的是，阻碍你回答问题的努力。\n\n\
  第二层级为战略层面的根问题提供了一个框架。如果你的根问题处于愿景层面，那么第二层级可能代表实际的指标。当你发现你的根问题基于改进组织时，该问题通常源于理解“组织现在在哪里”以及“它将去向何方”的需求。`答案密钥`表明，这种信息需求流入两个渠道：一个用于展示回报（我们得到了什么）与我们的投入（我们投入了什么）的关系，另一个用于协助管理资源。我将这两条分支称为“回报与投入”和“组织现状”。图\
  \ 5-1 展示了这种分支结构。\n\n**图 5-1.** 答案密钥，第一层级和第二层级\n\n\n\n### 回报 vs. 投资\n\n“回报 vs. 投资”是组织指标两大主要分支中的第一个。它代表了回答以下问题所需的信息：组织的运作状况如何？管理得好不好？我们是否在做正确的事？我们是否以正确的方式做正确的事？这些都是关乎改进乃至生存的关键关注领域。如果你没有在做“正确”的事，很可能很快就会倒闭，或者至少会失业。\n\
  \n如果你没有以正确的方式做事，你可能会发现组织仍能继续运转，业务也能勉强维持，但任何有意义的改进都极不可能发生。你最多能期望的是生存，而非繁荣。\n\n围绕*回报*的根本问题可能包括：\n\
  \n- 我们在提供关键服务方面做得如何？\n- 我们可以通过哪些方式来改进关键服务？\n\n围绕*投资*的问题可能包括：\n\n- 提供关键服务需要我们付出多少成本？\n\
  - 我们在管理资源方面做得如何？\n\n当我们深入探究答案钥匙时，更具体的问题会逐渐显现。但请记住，根本问题的广度将决定你需要向左走多远。在答案钥匙上越靠左，问题就越宏观或越具有战略性。\n\
  \n### 组织状况\n\n一旦你高效且有效地运营业务，就可以将注意力转向如何管理资源。你所拥有的最宝贵资产应该用爱心来维护。是的，我说的是你的员工队伍。我遇到过的每位老板都宣扬过同样的口号：“我们最宝贵的资产是员工。”然而，令我惊讶的是，我们对这些公认的无价资产的照料是如此糟糕。\n\
  \n我观察到有些管理者会将他们的宝马车送到经销商处进行定期保养，只使用优质汽油（无论油价如何），并且绝不停靠在其他车辆附近——但却对维护员工队伍完全不作为。没有培训计划，没有员工满意度调查，甚至连一个建议计划都没有。他们很少听取员工的意见，并且通过从不征求员工的观点来贬低他们。如果员工真的是我们最宝贵的资产，那么我们就应该如此对待他们。\n\
  \n这种对组织的看法就是我们的“组织状况”报告。它告诉我们的组织内部健康程度。虽然“回报 vs. 投资”告诉我们从客户和业务角度看的组织健康程度，但“组织状况”告诉我们的则是文化层面的健康程度。\n\
  \n除了员工队伍，我们还需要关注未来的潜力。我们可以通过审视我们如何管理走向成熟的成长过程来确定这一点。我们是否有良好的未来战略规划？我们是否在朝着目标努力？\n\
  \n你在这个领域可能遇到的根本问题包括以下内容：\n\n- 我们组织内部对认可的文化有多强？\n- 我们员工队伍的忠诚度有多高？\n- 我们的专业发展工作成效如何？\n\
  - 我们组织的预期未来是什么？\n- 与竞争对手相比，我们表现如何？\n- 我们在实现战略目标方面做得如何？\n\n你在答案钥匙上越往右走，根本问题就会变得越具体、越具战术性。\n\
  \n### 答案钥匙：第三层级\n\n图 5-2 展示了答案钥匙的下一层级，我们将分支扩展为包括：产品/服务健康度（有效性）、流程健康度（效率）、组织健康度（员工维护）和未来健康度（项目与战略规划）。\n\
  \n![示意图](img/0502.jpg)\n\n**图 5-2.** 答案钥匙，第一、第二和第三层级\n\n大多数根本问题最终都归结为想要基于第三层级所代表的组织某一视角来获取答案。这些标题——产品/服务健康度、流程健康度、组织健康度和未来健康度——有助于我们理解每个分支与其他分支的关系。它们也有助于我们理解自己的指标适合放在哪里。与这些标题一起，我们还发现了附带的视角，以进一步辅助解读答案钥匙。这些视角表明，每个标题都可以从客户、业务、员工以及最终的管理层等角度来审视。\n\
  \n让我们来确定你的根本问题最适合放在哪里。\n\n你的根本问题是关于你提供某项服务或产品的水平吗？它是否询问你是否在做正确的事？它是否询问你所做的事情是否满足了客户的需求或期望？你的根本问题会是客户会问的问题吗？如果你的问题符合上述任意一点，它就属于产品/服务健康度类别。\n\
  \n你的根本问题是否触及你执行交付服务或产品所需流程的好坏？你有多高效？执行流程中的任务需要多长时间或多少成本？你的问题是否是一线管理者会问的问题？如果你的问题可以在上述任何一点中找到，那么你很可能关注的是一个流程健康度的根本问题。\n\
  \n如果你的根本问题涉及人力资源、员工，或者是一位有同情心的领导者会问的问题，那么你的问题可能属于组织健康度分支。这里的根本问题会询问员工队伍的士气、忠诚度、员工留任率等。你对待员工有多好？你的组织是否位居行业最佳工作场所前\
  \ 100 名？\n\n第三层级的最后一个部分代表关注组织未来健康度的根本问题。组织是否患有组织不成熟症？战略规划、使命宣言和组织愿景有多大用处？研发进展如何？这一视角主要来自高层领导——如果你的领导层和组织已准备好展望未来。\n\
  \n你将如何使用答案钥匙来制定你的指标？\n\n定义“回报 vs. 投资”所需的信息由“有效性”和“效率”这两条被广泛应用的道路组成。有效性是从客户角度看的组织健康度。组织在履行承诺方面做得如何？组织是否在做正确的事？这不仅对于制定可行的指标很重要，对于理解和培育组织文化也至关重要。有些组织甚至可能不知道自己的客户是谁。而且即使客户群已被明确定义，收集客户对有效性各个组成部分的看法也并未被视为重要。\n\
  \n有时，组织被迫询问客户对公司有效性的看法。于是，调查被构建，焦点小组被组建，问题被提出。\n\n- 您使用我们的产品或服务吗？\n- 您对我们产品或服务的交付满意吗？\n\
  - 您对我们的组织有多满意？\n\n这些问题不仅有助于定义可行的衡量标准，也为您自身的成长提供了焦点。组织是否拥有明确定义并记录在案的客户清单？组织是否知道自己的产品和服务是什么？组织是否致力于让客户满意？组织如何“服务”客户？这些不仅仅是收集数据点的指南。答案钥匙帮助寻求实现持续改进的组织勾勒出一幅图景。\n\
  \n虽然这四部分可以描述指标本身（如果你有一个更高级别的根本问题），但很可能你的根本问题处于这个层级，而你的指标要到第四层级才会开始出现。\n\n\n\n####\
  \ 答案层级：第四层\n\n现在我们来看大多数组织开始并止步的层级。当你的根问题起始于此，你面对的是战术性的、低层次的问题。这在组织刚开始使用指标时属于正常现象。你遇到的根问题会非常具体，可能只涉及很小的领域。例如，你可能会有一个关于交付的根问题：“我们对客户更新请求的响应表现如何？”\n\
  \n你可能会遇到关于具体流程健康度的根问题，比如生产一个组件所需的时间、产出质量，或特定服务的成本。你的根问题落在答案层级中的哪个位置，决定了每个层级的特征。图\
  \ 5-3 介绍了第四层。\n\n![images](img/0503.jpg)\n\n**图 5-3.** 答案层级，第一至第四层\n\n如果你的根问题出自第四层，那么左侧的所有内容都是该问题的背景信息。随着组织逐渐成熟，你应该将问题向左移动，从更具战略性的角度提问。如果你的根问题在第二层，那么第三层代表你可以使用的指标，第四层则代表信息。每个信息集都会定义相应的度量和数据——如果有必要，甚至可以扩展到第五层和第六层。\n\
  \n答案层级不仅能让你保持专注，帮你确定感兴趣的领域；它还能根据你的根问题位置，提供一些标准化的指标、信息和度量方式。\n\n##### 产品/服务健康度（有效性）\n\
  \n![images](img/0504.jpg)\n\n**图 5-4.** 答案层级，象限 1，产品/服务健康度\n\n以下是产品/服务健康度（图 5-4）的主要组成部分：\n\
  \n*   *交付*：你在产品/服务交付方面表现如何？\n*   *使用情况*：你的产品/服务是否被使用？\n*   *客户满意度*：客户对你的产品/服务有何看法？\n\
  \n每个组成部分都可以进一步拆解为更小的单元——使其更易于理解。交付就是一个很好的例子，因为它是一个更高层级的概念。我倾向于将交付分解为以下部分：\n\n* \
  \  *可用性*：当客户需要时，服务/产品是否可用？\n*   *速度*：交付服务/产品需要多长时间？\n*   *准确性*：我们是否按承诺交付，还是存在错误？\n\
  \n产品/服务健康度的驱动力是客户。我们不关心谁对问题“负责”。我们不关心你对情况或条件是否有任何控制权。我们只是想了解客户如何看待我们的产品和服务。这种审视组织的简单方式很有价值，因为它能让你轻松专注于最重要的事情。\n\
  \n##### 流程健康度（效率）\n\n![images](img/0505.jpg)\n\n**图 5-5.** 答案层级，象限 2，流程健康度\n\n回报与投资的另一个组成部分是效率，或者说组织是否在以“正确的方式”做事？此部分（图\
  \ 5-5）体现了所有利益相关者都应认同的业务视角。以下经实践检验的效率组成部分仍然具有相关性：\n\n*   *成本*：我们执行流程的方式是否具有成本效益？\n\
  *   *时间*：时间类似于客户视角中的速度。很多时候，相同的数据和来源可以重复用于此度量。执行一项任务或流程需要多少时间？\n*   *资源分配*：我们分配工作的效率如何？我们是否按类型和数量分配工作？\n\
  *   *质量*：质量是业务视角中的准确性。即使我们有冗余系统提供 100% 的正常运行时间，我们也需要追踪（每个系统的）可靠性，以便进行最佳维护。\n\n许多组织过于关注成本，却忘了他们的首要关切应该是组织是否在做正确的事（有效性），其次才是是否以正确的方式做事（效率）。相反，许多组织一发现成本方面的任何感知缺陷，便不假思索、不加批判地做出反应。由于缺乏服务和产品成本的相关信息，这一错误被进一步放大。这在软性行业中尤为明显。制造业通常能很好地掌握成本数据，但信息技术、软件开发或教育等软性行业却发现很难为其产品和服务定价。这合乎逻辑，因为这些组织通常很难定义他们生产的产品和服务是什么。试着问问某所大学的院长，该组织提供哪些产品和服务。然后再进一步看看这些产品的成本是否有记录可查。\n\
  \n时间，尤其是当它与成本（人/小时）挂钩作为限制因素时，是最容易被滥用的信息之一。当管理者开始相信他们可以要求获取数据，从而（在不进行辅导或领导的情况下）管理员工，而无需实际与他们交谈或了解他们时，他们就会盲目跟风指标。考勤表、时间-动作研究以及时间分配表开始流行起来。在一个精心构建的指标体系中，如果你不是从至关重要的根问题及其所有列出的组成部分出发，你根本不会到达这个层级，这应该能防止人们滥用数据。时间不应被用来“控制”你的员工。它应该用于以下目的：\n\
  \n*   提高组织估算交付时间表的能力\n*   协助改进流程和程序\n*   完善其他数据，例如成本和质量\n\n如果“质量”是基于缺陷的客观度量，那么每千个实例中多少个缺陷才算是“高质量的”？高质量是目标吗？质量是“是或否”的决策吗？质量最好通过缺陷和返工来描述，并且和“时间”一样，它也可能被滥用。它并非管理者用来决定谁该加薪或处理其他人事问题的简单方法。如果你滥用指标，*质量就可能从工具变成武器*。\n\
  \n请确保你的指标被用作改进的工具，而不是武器。\n\n质量、时间、资源分配和成本都是流程健康度的组成部分，并定义了组织流程和程序所代表的投资业务视角。因此，这些视角只应用于改善业务——而非针对个人。产品/服务健康度完全从客户视角出发。流程健康度也同样专注于其自身焦点——它代表了业务视角。客户很可能永远看不到（也不需要有理由看到）这些指标。这些是“内部”指标，第四层接下来的两个领域也是如此。\n\
  \n指标应用于改善整体业务，而非个人。\n\n\n\n#### 组织健康度\n\n![images](img/0506.jpg)\n\n**图 5-6.** 答案指南，第三象限，组织健康度\n\
  \n在审视组织健康度（图 5-6）时，我们从员工的角度来观察组织。它考量以下方面：\n\n- 员工满意度\n- 职业发展\n- 工作环境\n- 奖励与认可\n\n\
  当我们确保最有价值的资产得到相应对待时，就会发现组织在进步。我通常建议组织自上而下地解决答案指南中的各个领域，将组织健康度的衡量措施放在第三或第四位。这在一定程度上是出于政治因素的考虑。在你证明使用指标的合理性时，如果首先从客户的角度来应对组织健康问题，会更容易获得支持。没有客户，就没有可以改善的业务。一旦解决了客户视角的问题，就需要确保有能力留住员工。\n\
  \n但在理想情况下，比如你自己就是 CEO，我可以很直接地主张，改善工作的第一步应该从你最大的资产开始，然后再轮到客户。听起来像是谬论？如果你拥有一支健康的员工队伍，就能与他们一起更好地定义你的商业模式、未来以及希望在哪些方面进行改进。\n\
  \n员工满意度相当直白。员工对他们的处境、组织和环境越满意，工作就会越努力，忠诚度也会越高。你的组织就会因此变得更强大。\n\n除了满意度，你还必须关注员工技能和知识库的培养。职业发展衡量指标能告诉你在这方面做得如何。你为每位员工制定了培训计划吗？每位员工的技能发展水平如何？员工队伍越强大，你能做成的事就越多。每当资金削减时首先砍掉培训，应该被视为一种不负责任的行为。以更少资源做更多事的唯一方法，就是提升员工队伍实现更多产出和更优产出的能力。提高生产力的最佳途径是提升员工的技能组合。\n\
  \n工作环境衡量指标通常通过主观工具（如调查问卷）来采集。但也存在大量客观衡量指标。例如工作空间面积、空气质量、照明、人体工程学等。有很多方法可以衡量物理工作环境的质量。此外还有文化工作环境。组织是一个愉快的工作场所吗？它是一个高压环境吗（如果是，是否有必要）？同样，你可以找到主观（询问员工）和客观的衡量指标。员工是否请了大量的假期和病假？人员流动率高吗？\n\
  \n组织健康度的最后一个组成部分是奖励与认可。一些简单的问题可能不需要数据收集。你有正式的奖励或认可计划吗？它有效吗？它是否达到了你的预期效果？你是如何奖励员工的？你如何认可他们的成就？你只认可他们与工作相关的成就吗？更微妙的一点是，你是否无意中将认可与奖励混为一谈，以至于只有在涉及奖励时才给予认可？\n\
  \n组织健康度的底线非常简单——你是否像对待最有价值的资产那样对待你最有价值的资产？\n\n### 未来健康度\n\n![images](img/0507.jpg)\n\
  \n**图 5-7.** 答案指南，第四象限，未来健康度\n\n答案指南的最后一个领域是未来健康度（图 5-7）。它涵盖以下方面：\n\n- 项目/计划状态\n\
  - 战略规划：组织执行战略规划的情况如何\n- 目标达成：组织实现目标的情况如何\n- 优先级设定：如何设定优先级，以及优先级是否得到满足\n\n这个领域假定你正在为组织进行持续改进。未来健康度没有被列在最后，是因为它不如其他领域重要。它排在最后，是因为大多数组织尚未准备好尝试在这个领域使用指标。大多数组织在开始着手大规模的改进努力之前，需要先将第四层的前三个领域控制好。\n\
  \n许多组织绕过了这个指导，直接跳到那些旨在展示他们改进流程工作做得如何的衡量指标上。他们跳上了持续流程改进的“列车”。我对这种行为不太有信心，因为一旦资金紧张，这些组织就会放弃同样的努力。\n\
  \n你开展改进努力的原因，比你是否成功更为重要。真正成功的唯一方法，就是出于正确的理由做正确的事情。\n\n围绕组织未来健康度的衡量指标大多是预测性的，这使得它们对领导层很有吸引力。但比预测未来更重要的是鼓励和奖励真正的流程改进。\n\
  \n项目与计划状态衡量指标为领导层提供了洞察，了解这些努力如何帮助改进组织。你应该预期到，流程改进的进展正在或将要在其他三个领域所捕获的指标中反映出来。如果你在持续流程改进方面做得好，客户视角应该会得到改善。业务视角也应该看到收益，员工队伍也应受益。如果你的努力未能改善这三个领域，那么你就没有在改进组织。\n\
  \n战略规划、目标达成和优先级设定都是需要关注的重要事项——但就其本身而言，它们是毫无意义的。如果这些不是改进组织的更大努力的一部分，你只是在原地打转。这些努力之所以艰难，是因为它们需要真正的（有时甚至是孤注一掷的）成功承诺。你必须想要改变。许多组织在这个领域只是口头承诺，并未真正将努力贯彻到底——而当我们谈论“持续”流程改进时——实际上是没有终点的。\n\
  \n## 答案指南：第五层及更高层级\n\n第五层将为所呈现的每个视角中的每条“信息”引入具体的衡量指标。虽然你的根本问题理论上可能存在于这一层，但可能性不大。如果你发现你的问题始于这一层，那么你可能不需要一个度量指标，而仅仅需要一个测量值。\n\
  \n你在这里最可能找到的是测量值。例如，从第四层“使用情况”的顶层分支延伸出以下内容到第五层：\n\n- 按月度、按类型的独立客户数\n- 按类型的购买次数\n\
  - 重复客户数量\n\n没有必要列出第四层每个元素可能的测量值。尝试列出第六层或第七层（更低层级的测量值或数据）中的每一项也没有意义。在“使用情况”的例子中，我们可能会看到如下数据点：\n\
  \n- 客户数量\n- 每位客户的姓名\n- 按类型列出的产品\n- 每次购买的日期和时间\n\n\n\n### 如何使用答案密钥：识别度量类型\n\n答案密钥可用于识别可以用来回答根本问题的度量。如果你已经完成了准备工作，明确了根本问题并制定了抽象设计，那么现在就可以进入下一步——识别可能的度量来填充指标。\n\
  \n答案密钥能帮助你完成这一阶段。以你的根本问题和指标设计为基础，确定你在答案密钥中所处的位置。如果你的问题涉及组织的价值，那么你处于顶层，即 `Return\
  \ vs. Investment`（回报 vs. 投资）。如果你的问题属于管理组织资源的范畴，那么你处于底层，即 `State of the Union`（组织状况）。\n\
  \n我们之前举过一些根本问题的例子。其中一个例子基于工作分配。这属于第四层，即 `Process Health–Resource Allocation`（流程健康——资源分配）。使用这个工具，我们不仅能识别所需的度量类型，还能理解问题关注的领域。从\
  \ `Resource Allocation`（资源分配）向左移动，我们可以看到问题涉及的是业务视图（投资）。如果我们的问题是根本问题，我们可以使用 `Five\
  \ Whys`（五个为什么）。现在，我们还可以问自己，我们的关注点是否超出了 `Resource Allocation`（以度量为中心）？我们的关注点实际上是否在于\
  \ `Process Health`（流程健康）？我们是否遗漏了关于成本、时间和质量的度量？\n\n如果你的根本问题仅由第四层中的某一个度量就能回答，那么你很可能还没有找到真正的根本问题。你肯定还没有形成一个指标。\n\
  \n我们使用的另一个例子是：“我们的网络/电话会议服务的价值是什么？”这也属于 `Return vs. Investment`（回报 vs. 投资），可能符合（客户视图）`Product/Service\
  \ Health–Usage`（产品/服务健康——使用情况）或 `–Customer Satisfaction`（客户满意度）。但它也可能符合（业务视图）`Process\
  \ Health`（流程健康），尤其是因为它包含了大量成本效益度量。通常，你的指标可能需要来自多个类别的度量。逻辑上，它们通常来自同一个更大的区域——`Return\
  \ vs. Investment`（回报 vs. 投资）或 `State of the Union`（组织状况）。因此，很多时候，如果你有一个衡量有效性的指标，你可能也会同时衡量对效率有用的东西。我发现这一点在时间度量上尤其如此。考虑一下解决问题的时间与完成任务的时间。如果任务本身就是解决问题，那么这两种度量是相同的。\n\
  \n使用答案密钥可以让我们快速简便地对已识别的度量进行质量检查。例如，如果指标是员工视图（基于根本问题），而你发现你识别出的某些度量来自客户视图（如交付度量），那么要么这些度量对于该指标是错误的，要么你的指标可能不适合回答这个问题。一般规律是，我发现通常是度量放置不当，而非指标有误。\n\
  \n再举一个例子。我们还讨论过：“帮助台的响应速度如何？”这可能是效率类别中的时间（响应时间），也可以通过有效性度量来表示——特别是交付。当我们查看交付类别下的速度和可用性（另一个度量是准确性）时，我们可以看到这两种度量如何共同讲述帮助台对客户需求的响应情况。使用\
  \ `Time to Respond/Time to Resolve`（响应时间/解决时间）会用到一些相同的数据点，尽管数据的这种“视图”对于回答我们的特定问题可能没有用处。\n\
  \n### 补充材料\n\n由于本章介绍了本书的实践部分，让我们来做一项实际练习。接下来是一系列基于伯纳德·马尔关于绩效度量的优秀著作《智能公司》（Wiley,\
  \ 2010）的可能根本问题列表。马尔提出根本问题有两种类型：`Key Performance Questions`（关键绩效问题，KPQ）和 `Key Analytic\
  \ Questions`（关键分析问题，KAQ）。他用这种区分来区别做“正确的事”（KAQ）和以“正确的方式”做事（KPQ）。\n\n正如你所读到的，我将它们分别翻译为“有效性”和“效率”。虽然马尔为每种类型都列出了一些问题，但他没有解释划分的依据，而且这些问题与我提出的分类并不吻合。实际上，马尔的例子涵盖了我答案密钥中提出的所有四种视图，而不仅仅是客户和业务视图。有趣的是，在他的书中，他的多个问题同时出现在这两个类别中。\n\
  \n我希望以他的问题为基础，不仅能让你练习根据答案密钥对它们进行分类，还能让你看到，你不必完全相信任何作者（包括我本人）提出的观点——你应该自己尝试和验证。\n\
  \n请审阅 `Table 5-1` 中的每个问题，并使用视图，通过在相应列中放置一个 X 来确定问题在答案密钥上的位置。\n\n![images](img/t0501.jpg)\n\
  \n![images](img/t0501a.jpg)\n\n希望你发现每个类别中都有适合的例子。你也可能发现你对一个问题标记了多列（是的，这是允许的）。如果我们记得这取决于观点，这就很容易理解了。\n\
  \n一个可能适合多个类别的问题是最后一个：“我们在建立新能力方面做得如何？”如果我们想知道培训项目运行得如何，这可能是业务视图。如果我们从员工的角度来看——关注我们员工的培训——这可以是一个\
  \ `Organizational Health`（组织健康）问题。如果我们从领导层的角度来看，想知道我们是否准备好应对未来需求，它可以归入 `Future Health`（未来健康）。当你处理自己的问题时，你会知道（或询问）问题所依据的是谁的观点。\n\
  \n那么，现在，如果你和我一样，你可能在寻找上述练习的“标准”答案。在 `Table 5-2` 中，我给出了我的答案——但有一个前提：没有所谓的“正确”答案。\n\
  \n其理念是使用答案密钥来确定你的度量是否在发挥其应有的作用——即它们是否对齐且全面。记住，对齐意味着它们有助于回答根本问题（如果你发现你使用的度量在答案密钥上不对齐，那么它们就不能回答同一个根本问题）；全面意味着综合来看，你有信心它们能够回答这个问题（没有缺失的数据点）。\n\
  \n![images](img/t0502.jpg)\n\n\n\n### 回顾\n\n“答案关键”能帮助你检验工作质量，确保你走在正确的方向上。当你遇到难题、不知该往哪个方向前进时，它也能帮你重回正轨。\n\
  \n大多数你设计的指标，如果落在“答案关键”上，很可能从第三层级开始，并属于以下四个视角之一：\n*   客户视角（有效性）\n*   业务视角（效率）\n*\
  \   员工视角\n*   领导视角\n\n当你沿着“答案关键”从左向右移动时，就是从战略层转向战术层。另一种理解方式是，你正从根本问题转向数据。\n\n无论你的指标（或根本问题）落在哪个位置，你都需要向右移动，才能找到回答该问题所需的度量项和数据。在第四层级，我们发现了以下内容：\n\
  *   回报 vs. 投入\n    *   产品/服务健康度——客户视角\n    *   流程健康度——业务视角\n*   总体状况\n    *   组织健康度——员工视角\n\
  \    *   未来健康度——领导视角\n\n第四层级是我的客户最常使用的层级。它位置足够靠左，使得从该处出发的根本问题值得用指标来回答；同时它又足够靠右，使得大多数组织易于理解这些指标在改进组织方面的用途。\n\
  \n在第五层级（及其后的任何层级）中，我们主要发现的是信息和度量项。如果我们的根本问题落在此处，那么该问题可能非常战术化，或许不需要一个完整的指标来回答。请记住指标开发计划，你不仅应该通过识别信息和度量项来充实指标，还应该记录所需的个别数据点。\n\
  \n## 结论\n\n“答案关键”之所以成为本书实践部分的开篇，是因为它是一个实现指标的绝佳捷径工具。它能帮助你将根本问题置于组织健康度的背景中。如果你不得不在没有根本问题的情况下工作，它可以用来确保你不会试图混合不协调的度量项，并帮助你朝着一个迫切的需求努力。\n\
  \n从左侧开始向右移动，你从高层级走向战术层。它会帮助你识别可能用于回答根本问题的信息和度量项。\n\n从右向左移动，你可以从具体的度量项（甚至数据）回溯到某个迫切的需求。朝这个方向工作也有助于你确保你的指标在逻辑上分组和整理得当。通常情况下，你不希望将来自不同领域（产品/服务、流程、组织或未来健康度）的信息混合到一个指标中，因为除非是在“答案关键”的最高层级或最左侧层级，否则它们几乎无法回答任何问题。\n\
  \n请记住，“答案关键”虽然是一个有用的捷径，但它仍然只是帮助你开发指标的工具。它不是完整的答案，也不能免除你遵循指标开发模型的责任。\n\n## 从有效性开始\n\
  \n我合作过的第一位首席信息官常说：“做正确的事。”除了这一指示在哲学和宗教层面的解读外，这还体现了领导者对其团队日常行为的简单期望。有效性指标能让你判断自己是否在“做正确的事”。\n\
  \n我不仅是建议你*从*有效性开始。在`第 5 章`中，我介绍了“答案关键”。我讨论了有效性指标的组成部分，即第三层级的第一个象限：产品与服务健康度。我建议你不仅从此处开始，而且应停留在“答案关键”的这个区域，直到你的组织成熟到能够应对其他象限为止。\n\
  \n正如我在第一本关于克服组织不成熟度的书中所描述的，一个组织可能根本无法应对一个完整的指标项目。使用指标是一种高级行为。\n\n让我们来看看为什么我建议你在可预见的未来从有效性象限开始（并停留在此）。可以从第四象限“未来健康度”开始，逐个象限地讨论原因。\n\
  \n让我们再次看看`图 6-1`中的“答案关键”。\n\n![images](img/0601.jpg)\n\n**图 6-1.** 答案关键\n\n### 未来健康度\n\
  \n第三层级的第四象限（`图 6-2`）涵盖了未来健康度，即从领导视角看的组织健康度。在开始制定涵盖未来健康度领域的指标项目之前，最好确保你的组织已经为此做好了准备。\n\
  \n![images](img/0602.jpg)\n\n**图 6-2.** 答案关键，第四象限\n\n以下是一些你可以自问或询问他人，以判断组织是否为此领域指标做好准备的问题：\n\
  *   你们有使命宣言吗？如今大多数组织都有。\n*   如果你问五位员工组织的使命是什么，你会得到同样正确的答案吗？\n*   你们有鲜活的战略规划吗？如果有，最远的目标是多长时间？大多数流程改进专家会告诉你，战略目标至少应为三到五年。最长可延伸至十年。\n\
  *   你们的组织是否将大部分目标文档化？\n*   如果有长期目标，它们是否在被积极执行？（我不会问你是否清楚它们的进展如何，因为那需要度量项，进而引向指标。）\n\
  *   组织的问题是否已按优先级排序？如果是，这些优先级是否得到遵守，还是经常被忽略？\n*   你们的目标是否包括随着时间的推移改进流程？\n*   你们是否有完善的项目管理流程？\n\
  *   该流程是否被组织自愿遵循？\n\n如果你不能对这些问题的回答给出肯定的答案，你可能还未准备好。通常情况下，组织在此区域存在内部冲突。领导层——指标的主要驱动者——希望同时从所有方面改进组织。这促使组织制定战略规划。似乎每位高层领导都必须有一份包含使命宣言和目标的战略规划。\n\
  \n我不会带你详述这会给一个无法进行全组织变革的组织带来所有问题。相反，我提出这些问题是为了帮助你判断是否准备好了。当然，你可以衡量这个领域，并确定你们的成果物（战略规划、目标、优先级清单）并未如预期发挥作用。这本身可能是有用的信息，但正如我非常喜欢说的那样，大多数时候你不需要指标来告诉你已知之事。\n\
  \n大多数时候，你不需要一个指标来告诉你已知之事。\n\n我相信大多数组织都会制定战略规划和优先级清单。大多数组织甚至为其较大规模的工作制定了流程。这主要是因为它们是“该做的正确之事”。但不幸的是，这些组织中的大多数实际上并未为这些工作做好准备，因此他们认真的尝试收效甚微甚至毫无收益；在此之上创建指标来叠加这种投资损失将是浪费。\n\
  \n未来健康度指标需要一种大多数组织所缺乏的成熟度。\n\n\n\n### 组织健康\n\n组织健康象限（图 6-3）是从员工视角出发的。\n\n![images](img/0603.jpg)\n\
  \n**图 6-3.** 答案矩阵，象限 3\n\n同样，我们可以提出一些基本问题来感受这项工作的准备情况。\n\n-   你是否有奖励和认可计划？\n-  \
  \ 你是否有员工建议计划以收集意见？\n-   你会将自己的企业文化描述为一种相互信任的文化吗？\n-   你的每位员工是否都有职业发展计划？\n\n与未来健康象限不同，组织健康通常不是领导层早期关注的领域。在许多尚不成熟的组织中，领导者害怕基于这一领域的度量指标。领导层应该清楚员工是否得到了良好对待并感到被重视。他们不“需要”度量指标来告知这一点。当“答案”未知时，就会产生怀疑，而这种怀疑理所当然地让领导层感到担忧。除非组织内部存在信任，否则这个领域对领导层来说可能会很棘手。\n\
  \n在大多数情况下，*领导层*并未准备好接受组织健康度量指标。\n\n组织健康与未来健康这两个象限都直接反映了组织的“现状”。在这两种情况下，度量指标应等到组织能够持续做正确的事并让客户满意后再进行。如果组织处于动荡或尚不成熟的状态，度量计划不仅无法解决问题，反而可能让情况变得更糟。从这两个象限中的任何一个开始，都无异于去测量纸飞机的平均空速、高度和升力系数。在开始测量纸飞机的性能之前，获得更好的交通工具要重要得多。\n\
  \n### 回报 vs. 投资\n\n![images](img/0604.jpg)\n\n**图 6-4.** 答案矩阵，象限 1 和 2\n\n上面两个象限（图\
  \ 6-4）是大多数组织在着手进行度量工作时自然倾向于关注的区域。大多数领导者首先希望看到客户满意度调查的结果。这是最容易开始的度量方式。毫无例外，每当我提出要了解客户对服务或产品的感受时，第一个想法总是“调查”。我并非认为这是负面的——事实上，当这种情况发生时我反而很高兴，因为这是一个非常安全且合乎逻辑的起点。\n\
  \n平衡计分卡也有四个象限：客户、财务、员工和流程——大多数领导者会直接跳到财务象限。在答案矩阵中，最接近的对应区域是流程健康（或效率）象限。\n\n虽然“现状”中的右侧两个象限要求组织做好充分准备，但通常组织并未准备就绪，而回报\
  \ vs. 投资象限可以在组织成熟之前就着手处理。当然，组织越成熟越好——尤其是在制定度量计划时。\n\n## 流程健康\n\n流程健康（效率）度量（图 6-5）可能会引发许多问题，尤其是在一个尚不成熟的组织中。如果你与员工关系不佳，或者员工之间缺乏信任，那么试图针对这个象限进行度量工作可能会是致命的。\n\
  \n![images](img/0605.jpg)\n\n**图 6-5.** 答案矩阵，象限 2\n\n我会请你提出以下问题来判断开展效率度量的准备情况：\n\
  \n-   你的员工信任管理层吗？\n-   你的基层主管信任中高层管理者吗？\n-   管理层信任员工吗？\n\n要安全地使用效率度量指标，需要信任。在缺乏信任的文化中，不可能获得诚实准确的数据。大多数专家认为，信任文化取决于组织高层领导者言行一致的程度。员工是否相信高层领导者能履行承诺？做到他们说过要做的事？遵守他们的协议和承诺？\n\
  \n我发现信任问题的答案其实更直接、更简单。员工是否相信他们的直接主管真心为他们着想？他们对于高层领导者真实性的关注程度远低于此。他们最在乎的是他们的直接经理。距离直接经理越远，所需的信任程度就越低。\n\
  \n因此，与其对公司 CEO 说教，要求她必须赢得员工的信任，不如从最基层开始，确保从下到上建立一种信任文化。\n\n当你决定衡量组织的效率时，你的员工会清楚地听到你想要衡量*他们*的效率。他们不会“听到”你想要改进流程和程序。至少，除非他们信任你，否则他们听不到。而这里的“你”，我指的是他们的老板。\n\
  \n我的 CIO 通常在告诫要“做正确的事”之后，还会补充一条同样重要的指令：以“正确的方式”做正确的事。如果管理层足够强大，它应该致力于改进做事的方法——而不是去改进那些做事的人。如果你急于采用效率度量指标，你不仅可能因不信任而收集到不准确的数据，更糟的是，你还有可能播下更多不信任的种子。\n\
  \n流程健康度量指标需要一种在大多数组织中罕见的相互信任水平。\n\n请记住，组织健康度量指标关乎员工的处境，而大多数领导者并未准备好倾听这些。即使领导层相信自己能够听取反馈，但如果缺乏信任，大多数员工也不准备分享。\n\
  \n同样的缺乏信任也使得收集关于业务运行状况（流程健康）的准确数据变得困难重重。\n\n\n\n#### 产品或服务健康度\n\n那么，这就引出了`产品或服务健康度`这一象限（图\
  \ 6-6）。这不仅是最安全的起点，也是最合乎逻辑的起点。\n\n![images](img/0606.jpg)\n\n**图 6-6.** 答案指南，象限 1\n\
  \n让我们看看下面这些问题，你需要通过它们来判断自己是否已准备好进行效能度量：\n\n-   你是否清楚你的客户是谁？（这看似不言而喻，但其实值得一问。我很少对未知之事感到惊讶。）\n\
  -   你是否了解客户认为什么最重要？\n-   你是否知道客户的期望？\n\n这听起来是不是比其他四个象限容易得多？事实确实如此。在层级的上半部分，你需要的成熟度更低，而且`产品或服务健康度`涉及的风险也小于效率度量。至少，你应该知道你的客户是谁，并且能够确定他们的愿望、期望和需求。\n\
  \n你可能会问，怎么会有人*不*知道自己的客户是谁呢？\n\n我承认，起初我也觉得这难以理解。但这确实会发生。一位同事喜欢讲述一个关于大学招生办职员的故事。这位职员接待新生已经至少干了好多年，多到让她不胜其烦。\n\
  \n有一次，一名新生又对她老调重弹，称自己是她的客户，理应得到比现在更好的待遇。他大声抱怨，说自己就是学校存在的理由，她应该竭尽全力满足他的需求。\n\n> *“你的客户服务呢？”他最后一次喊道，享受着其他学生投来的目光。*\n\
  >\n> *她平静地等着他停下来。她想确保他能清楚地听到她的话。*\n>\n> *“亲爱的，你搞错了。你不是客户，你是产品。”*\n\n你可能会想，“反驳得好”或者“回击得妙”。但糟糕的是，我的那位同事是名教师。更糟的是，听到这番话的学生觉得极其好笑。当然，我不能怪他们——这句话确实有趣。但，这有多真实呢？\n\
  \n我们有时是否会混淆谁才是我们的客户？另一个广为人知的笑话是，一位杂货店店员争辩说：“要是我们不用应付客户，能完成更多工作。”\n\n如果客户是谁以及他们想要什么都那么显而易见，就不会有那么多客户服务课程和研讨会了。这可能是最基本的公理之一：真相并不总是显而易见的。\n\
  \n真相并不总是显而易见的。\n\n你可能会认为情况恰恰相反。谎言和假话应该很难发现。真相不应该难以找到。真相不应该被无关的数据所隐藏或掩盖。真相*应该*是显而易见的。\n\
  \n那些本应显而易见的事情——比如真相，或你的客户是谁——却并不总是显而易见。\n\n那么，如何确定你的客户是谁呢？由于这是制定效能度量的先决条件，我认为有必要介绍一个简单的流程来确定你的客户。\n\
  \n一个简单的观点是，你的客户就是给你发薪水的人。这让你可以在个人层面（以及组织层面）确定你的客户。让我们从显而易见的事情开始（但不一定是“真相”）。你的薪水由你的组织支付。但这笔资金从何而来？如果你是一家盈利性组织，资金很可能来自产品或服务的销售。该服务或产品的购买者很可能是一个供应商或分销商。那么下一个合乎逻辑的问题是，谁在向你的产品或服务的接收者付款？你应该沿着这个逻辑一直追查，直到确定最终用户或购买者。\n\
  \n让我们以汽车的安全气囊为例。负责质检的工人认为他的客户是与他们部门有合同的汽车制造商。这没错，但这不是真相。买车的人既不是汽车制造商，也不是经销商。当我们把目光投向租车公司这样的买家时，这一点就更清楚了。然后租车公司将车辆出租给最终的终端用户（客户）。这是真正的客户吗？是的，但还有另一位客户。坐在“副驾驶”座位上、真正受益于那个特定安全气囊的乘客，才是对该客户更真实的体现。当然，这还可以进一步延伸，包括那些关爱这位乘客的人：乘客的孩子、父母和配偶。\n\
  \n如果质检安全气囊的工人看到了其工作真正客户的深层真相，这将如何改变该工人的行为模式？又将如何改变该工人的自尊心？\n\n在非营利组织中，这个过程同样适用。以`仁人家园`为例。当你在`仁人家园`做志愿者时，现场监督员是客户吗？还是`仁人家园`组织本身？或者是最终将拥有这所房子的人？或者是那些生平第一次拥有一个“真正”的家可以居住的孩子们？你甚至可以更进一步，问真正的客户是不是社会。在不变得过于哲学化的前提下，我建议我们追踪到直接的终端用户。在这个案例中，就是最终住进房子的那户人家。\n\
  \n当我们足够深入地探究这个现实时，我们会承认，我们的客户远不止是我们产品或服务的第一个购买者。当我们如此深入地探寻时，我们就能找到客户是谁的真相。\n\n当然，当我们在审视交付、使用和客户满意度等效能度量时，通常确定直接客户就足够了。你需要知道他们是谁，这样你才能弄清客户认为什么是重要的。你还需要确定他们的期望是什么，以及如何满足这些要求。\n\
  \n\n\n### 客户视角\n\n从客户视角出发是完全合理的。它是开始收集、分析和报告数据、度量指标及信息的正确起点。让我给你讲一个关于汤姆经营的餐厅的故事。他是一个勤劳的人，热爱美食。\n\
  \n汤姆的餐厅经营得还不错，但他希望能做得更好。他想让自己的餐厅成为镇上的最佳餐厅，甚至可能成为连锁餐厅的样板。他的菜单由家族秘方组成——家常菜，老少皆宜。他认为，一家更好的餐厅能为他的家庭带来美好的未来。\n\
  \n他想知道业务的真实运营状况，以及如何改进。他决定收集度量指标；不仅是为了评估自己的表现，也是为了更好地预测他的愿景是否有实现的机会。\n\n汤姆对组织发展或流程改进知之甚少。他对度量指标更是一无所知。他是一位出色的管理者/老板，对业务、产品和客户服务的热情让他浑然天成。他对员工的关怀源于他过去从事底层工作、省吃俭用，然后拿出毕生积蓄投入自己的餐厅——这是他一生中最大的冒险。他知道薪水微薄不被重视是什么滋味。但他不知道的是，如何将自己的梦想提升到新的高度。\n\
  \n当他考虑收集餐厅相关信息时，他立刻想到了客户满意度调查。他制作了意见卡，让每位服务员在给顾客菜单时一起递上。他希望给顾客一个机会，从头到尾评价他们的用餐体验。\n\
  \n汤姆知道这种调查有利有弊。好处是能从他最重要的批评者——客户那里获得快速反馈。这些反馈能帮助员工，并提醒他们始终将客户的满意度放在首位。\n\n另一方面，他明白客户不一定总能提供有助于他改进所需的信息，因为许多人除非非常不满，否则不喜欢抱怨。\n\
  \n除了调查提供的定性信息，汤姆还需要关于其服务和产品质量的客观输入。这些信息是现成的。\n\n汤姆拥有关于客户群的实证数据——由于大多数客户使用信用卡，他可以确定回头客的数量以及这些客户光顾餐厅的频率。他还能确定他们点了哪些菜品。他知道什么时候是高峰期，什么时候是冷清时段。实际上，他已经拥有了丰富的使用信息。这些信息结合客户满意度调查结果，应该能清晰地反映出他餐厅的经营状况。\n\
  \n汤姆对这些信息很满意，但他觉得自己缺少一种客观衡量标准，能够在不询问客户的情况下评估餐厅满足客户的程度。他认为意见卡已经是一种打扰了。\n\n汤姆通过邀请当地美食评论家来评估食物的质量。他通过亲自观察员工以及听取他们对餐厅的意见来评估服务水平。他评估了食物准备和上菜的速度，以及顾客结账的速度。他将这些信息与本地其他顶级餐厅进行了比较。\n\
  \n有了这些输入，汤姆确信自己拥有了从客户角度衡量餐厅质量的良好指标。\n\n在很大程度上，他是对的。还有其他一些衡量指标他可以使用，比如可用性（营业时间）、可靠性（口味、品质和上桌时间的一致性）以及准确性（订单准确无误）。这些指标将有助于完善他的度量体系，让他获得更全面的图景。但目前的客户满意度和使用数据已经是一个很好的开始。\n\
  \n### 消除恐惧\n\n通过关注客户视角，汤姆消除了困扰效率度量的恐惧基础，同时专注于回报与投资——这是大多数管理者渴望深入理解的一个领域。恐惧源于未知。在大多数初期的度量项目中（尤其是在尚未成熟的组织中），未知因素在于信息将如何（以及不会如何）被使用。这就是为什么我极力主张所有度量工作都要明确沟通这些度量指标将如何及不会如何被使用。\n\
  \n即使你承诺收集和报告的数据不会被不当使用，除非你的组织拥有强大的信任文化，否则员工不会相信，恐惧仍将主导一切。至少在使用效率度量时是这样。但如果你从有效性度量开始，就很容易说服他人这些信息不会被用来针对他们。这是因为所有度量都会反映客户的视角。\n\
  \n下面是一个真实的例子。\n\n无论我如何强调度量指标不会被不当使用，我赢得客户信任的唯一方法就是向他们展示这些度量指标。我们以返工形式的准确性为例。在设计度量指标时，如果你坚持它必须源于客户视角这条规则，你甚至不会去收集内部返工的数据。你只会处理从客户角度看到的返工。\n\
  \n当我为我们的印刷服务设计有效性度量指标时，问题围绕什么构成返工而展开。\n\n> *“如果我们必须把打印机送回供应商那里修三次才能修好，这算返工吗？”*\n\
  > \n> *我反问了一个问题。“客户知道你送修了三次吗？”*\n> \n> *“不知道。”*\n> \n> *“那么不算，这不是返工。”*\n> \n> *“如果我们从供应商那里收到了错误的零件呢？”*\n\
  > \n> *我再次以一个问题回应，“客户知道吗？”*\n> \n> *“不知道。”*\n> \n> *“那仍然不是返工。”*\n> \n> *“如果我们修理了一个卡纸故障，但客户尝试打印时，发现还有另一个问题呢？”*\n\
  > \n> *“客户知道吗？”*\n> \n> *“知道，但这不是我们的错……”*\n> \n> *“那么，是的，这就是返工。”*\n> \n> *“但这又不是我们的错……”*\n\
  > \n> *“我明白。但度量指标不是为了推卸责任。它只是让我们了解客户所见的一种方式。如果客户认为这是返工，我们就需要知道。如果不知道问题存在，我们就无法解决它。”*\n\
  \n有效性不是用来评判或归咎责任的。有效性度量指标为我们提供了客户看待我们服务和产品的视角。\n\n### 要事为先\n\n你必须从起点开始，同时牢记终点。终点是一个运作良好、全面的度量体系。但要达到这一点，我们必须拥有一个成熟的组织。我们必须拥有一种信任文化。我们必须实现全方位的开放沟通。我们必须走在相当前面。正如大卫·艾伦在他的书《搞定》（企鹅出版社，2002\
  \ 年）中谈及他的咨询服务时所说，“最需要[他的改进方法]的人，用得最少。”\n\n所以，对于我们其余的人来说，我们必须从起点开始。而你需要做的第一件事，就是像你的客户那样看待你的组织。有效性度量正做到了这一点。\n\
  \n\n\n### 回顾\n\n从起点开始。当你从起点开始时，就能避开许多麻烦。贸然采用组织尚未准备就绪的成熟做法，可能会引发大量问题。最稳妥且最合适的起点是衡量**产品/服务健康度**，即有效性指标。这将帮助你与组织建立良好的合作关系，并改善客户关系。\n\
  \n通过从有效性指标入手，你还能让组织更轻松地适应度量体系，减少恐惧、不确定性和疑虑。尽管组织对于你引入的指标仍会有些担忧，但从客户视角出发，能化解大部分风险。你还可以利用这些指标获得高回报——了解并取悦客户，确实是企业长期成功的基石。\n\
  \n幸运的是，最佳的起点也是最简单、最安全的，而其他可选方案则需要更多努力、付出更多代价来应对问题，并且失败风险最高。\n\n以下是需要记住的重点：\n\n-\
  \   未来健康度指标需要大多数组织尚不具备的成熟度。\n-   组织健康度指标反映的是员工状况，而大多数员工尚未准备好倾听；如果缺乏信任，多数员工也不愿分享。\n\
  -   信任缺失导致衡量组织健康度变得困难，这使得收集关于企业运营状况（流程健康度）的准确数据也几乎不可能。\n-   产品/服务健康度指标需要了解客户——包括客户是谁、他们认为什么重要、以及他们的期望。\n\
  \n## 结论\n\n![图片](img/0607.jpg)\n\n**图 6-7.** 答案密钥——分层与象限\n\n尽管答案密钥（图 6-7）为指标开发提供了多种选择，但正确的起点是产品/服务健康度（有效性），即客户视角。这不仅是最安全的行动路径，同时也是最佳选择，因为它为第三层级的其他象限奠定了基础。如果你围绕产品和服务健康度的有效性建立了一套行之有效且有用的度量方案，你将能够积累必要的信任，进而拓展到效率指标。\n\
  \n一旦你成功解决了回报与投资象限的问题，你就具备了足够的成熟度基础，可以为组织进入\"国情咨文\"象限做好准备。结论如下：\n\n1.  从客户视角（有效性指标）开始。循序渐进，充分实现这一层级指标带来的益处，使其成为组织文化中被接受的一部分。\n\
  2.  在需要深入探究提升有效性的方法时，谨慎地使用业务视角（效率指标）。（我将在后文提供更多见解。）\n3.  在组织内部建立起足够健康的信任水平，并成功运行基于有效性的度量方案后，再拓展到其他象限。\n\
  4.  尽管管理层接下来会倾向于转向业务视角，但除了那些用于提升有效性所必需的指标外，我建议跳过效率指标，转而关注员工视角（组织健康度）。这将有助于建立信任，并为组织的整体有效性带来更大、更快的提升。\n\
  \n    如果员工确实是组织最宝贵的资产——那么在开发出改善客户体验的指标之后，下一个优先事项应当是改善员工体验。将未来健康度指标主要作为判断组织目标实现可能性的工具。然后利用它们来评估目标是否达成。如果你专注于未来健康度中的战略规划部分，就能为度量体系创造出另一个安全区域。\n\
  \n在第 11 章\"运用高级指标\"中，我将更详细地阐述在第三层级各个象限开发指标的好处和方法。目前，重点在于将产品/服务健康度作为正确的起点，并强调在其他领域时机成熟之前需耐心等待。\n\
  \n## 三角验证\n\n创建有效指标的关键\n\n话说从前，鼠妈妈生了三只美丽但失明的幼鼠。它们长大后，农夫的妻子心生怜悯，决定帮助它们在这个世界上生存下去。对于它们而言，由于缺乏视觉，这个世界变得更加危险。\n\
  \n农夫的妻子认为，如果老鼠们能学会分辨哪些动物是友好的，哪些动物更喜欢吃掉它们而不是与它们交谈，那将会很有帮助。由于她原本是个城市姑娘，于是她把三只老鼠装进自己的小货车，出发前往自然历史博物馆。她认为利用展品来介绍，比带它们接触真实的动物更安全。\n\
  \n尽管它们居住的农场里非洲野生动物不算多，但农夫的妻子觉得\"有备无患\"总比后悔好。\n\n> *它们从老虎开始观察。她解释说，老虎只是比谷仓猫大一号的版本。第一只老鼠站在左后爪上。“它有爪子和巨大的脚掌，”它喊道。第二只老鼠站在尾巴上。“它有一条又长又粗的尾巴。”第三只老鼠，比另外两只大三秒钟，站在脸部的位置。“它有大眼睛、大牙齿和胡须。”*\n\
  >\n> *农夫的妻子微笑着问：“那么，这是什么？”*\n>\n> *“一只非常大的猫。”它们异口同声地回答。*\n>\n> *“非常好。这一个呢？”它们都走到下一个动物旁边。*\n\
  >\n> *“这根本不是动物，是一根树干。”第一只老鼠说。*\n>\n> *“不，是一条挂在树上的蛇。”第二只老鼠说。*\n>\n> *而第三只老鼠，再次站在动物的脸部，说道：“从强有力翅膀的感觉来看，这是一只巨鸟。”*\n\
  >\n> *“孩子们，把所有这些感受综合起来。”农夫的妻子建议道。*\n>\n> *它们思考了一会儿，最后极其和谐地齐声喊道：“大象！”*\n>\n> *“非常好。”*\n\
  >\n> *它们就这样继续在动物展区进行观察，识别出了狼、狗、狮子、熊。它们了解了各种类型的动物，无论是家养还是野生的。最后，它们遇到了一种无法解决的动物。它似乎长着狮子的头、山羊的身体和蛇的尾巴。*\n\
  >\n> *“我们已经从头到脚仔细检查过这个动物了。”它们一致同意，“但我们无法就它是什么达成一致！”*\n>\n> *“那是奇美拉。”农夫的妻子说，“你们三个让我印象深刻。凭借对动物生理学的理解，你们利用非常不同的输入信息，成功地识别出了每一种生物。”*\n\
  >\n> *三只老鼠脸上洋溢着喜悦。*\n>\n> *“但是，我们并没有全部答对。”第三只老鼠想到奇美拉时说。*\n>\n> *“不，即使拥有来自多个来源的、各不相同但相互补充的可靠数据，你们也未必总能找到‘真相’。”她对它们已经做得如此出色感到非常满意。有时候，即使拥有大量数据，也可能无法得出正确答案。当然，如果你能亲自观察事物本身，那会有所帮助。*\n\
  \n研究人员是数据的终极使用者。\n\n\n\n### 三角测量——历史视角\n\n实验鼠被迫使用`triangulation`（三角测量）来识别动物。它们比较通过不同方法收集到的不同信息，以确定问题的答案（我们触摸的是什么动物？）。如果老鼠只关注单一信息片段，它们就会得出错误答案。\n\
  \n我向伊利诺伊大学厄巴纳-香槟分校的传播学与社会学教授诺曼·K·登钦致敬，因为他将`triangulation`这一术语用于指代在收集和研究数据时使用两种以上方法。我的定义与其非常相似——即使用多种衡量手段和收集方法，来处理指标中使用的信息。\n\
  \n根据登钦的说法，使用三角测量的一个主要原因是为了减少（甚至消除）研究中的偏差。通过三角测量，我们确保对问题有了全面的答案。\n\n在他的著作《社会学方法：资料汇编》中，登钦描述了以下四种三角测量类型：^(1)\n\
  \n*   **数据源**：使用多个数据来源。\n*   **调查者**：使用多人来收集、分析或解释一组数据。\n*   **理论**：使用多种视角来解释一组数据。\n\
  *   **方法**：使用多种方法来获取数据。\n\n但即便是登钦也不得不承认，这并非他的“发明”，因为他引用了尤金·J·韦布的一篇论文，韦布在文中为社会研究提供了一种三角测量法。登钦指出，随着你不断增加用于洞察单一问题所采用的不同衡量方法，其定义会从抽象概念，演变为经过验证的概念，最终成为被证实的现实。尽管登钦可能并非创造`triangulation`这一术语的第一人，但我欣赏他的解释。这与我在衡量指标项目背景下使用该术语的方式高度吻合。\n\
  \n登钦的四种三角测量类型与我用于衡量指标的不同类型并非完全吻合——这部分是由于我们使用结果的性质不同。登钦为社会研究提供指导，其目的是在其领域内寻找更深层的真理，并通过期刊和实验在科学界对这些真理进行辩论和挑战——而我们的需求（你我的需求）则要简单和实际得多。\n\
  \n______________________________\n\n¹ 诺曼·K·登钦，《社会学方法：资料汇编》（芝加哥：阿尔定出版社，1970 年）。\n\
  \n在我的领域，需要不同调查者的需求相对不必要，尽管在研究领域这对避免分析偏差至关重要。我认同使用不同数据源、不同视角和不同方法。我把视角称为观点。现在让我们来看看我版本的三角测量。\n\
  \n### 三角测量作为实际应用\n\n2003 年，我提出了一个使用多种衡量手段来构建综合指标的概念。当时我正在为我的 IT 部门开发一个衡量指标项目，我需要构建一个完整的叙事，来回答最高执行官提出的两个问题。他的第一个问题是：“你们做得怎么样？”\n\
  \n他是在询问我们 IT 组织的健康状况。这是一个简单但具有驱动性的问题。它不仅催生了一套衡量指标，还开启了我的旅程，最终将我在这本书中记录下的许多方法和理论付诸文档。\n\
  \n执行官的第二个问题是第一个问题的绝佳补充：“你怎么知道？”\n\n我想我喜欢这些问题，最主要的原因是它们的简洁和直接。它们推动我们的组织走向一个可行且实用的衡量指标项目。\n\
  \n#### 衡量指标的三角测量\n\n我将重点放在答案键的有效性象限上（图 7-1），选择从我们客户的角度来限定这个问题——因为提问的执行官正是我们的最高层客户。虽然执行官可能关心我们办事的效率如何，但他首要关心的是我们对客户的服务质量。\n\
  \n![images](img/0701.jpg)\n\n**图 7-1.** 答案键\n\n当我开发用于回答这些问题的衡量指标时，我知道提供一个能被接受为准确的答案至关重要。除了需要对数据收集和分析进行控制之外，我还需要一个基本的指标构建框架。\n\
  \n我知道这个象限。我也知道可能适用的衡量方法（至少是一个起点）。我还知道如何测试这些衡量方法与产品/服务健康象限的一致性。\n\n但为了确保我们获得全面的图景，我采用了三角测量——即使用三种或更多种衡量方法来回答问题。以有效性为例，我们从答案键中识别出主要的几个——交付、使用和客户满意度，如图\
  \ 7-2 所示。\n\n![images](img/0702.jpg)\n\n**图 7-2.** 产品/服务健康象限\n\n我没有只选一两个，而是决定我们应该三者都用，这样能提供更全面的图景。每种衡量方法在数据来源和收集方法上都具有不同的特性。\n\
  \n交付解决了客观衡量我们提供服务和产品质量的需求。这一衡量方法将在没有客户参与的情况下捕获我们有效性的数据。最佳数据来源是 IT 部门使用的问题跟踪和报告工具。衡量指标的好处之一就是它能凸显出你已在使用的工具。\n\
  \n通过使用这些工具的数据，它促使各单位比以前更准确、更频繁地捕获数据。在衡量指标项目之前，这些工具并未得到最佳利用，产生的数据也无用——这就是`GIGO`（垃圾进，垃圾出）。\n\
  \n使用是一种不引人注意地捕获客户观点的方式，在这种情况下，观察客户如何“用脚投票”。这可以通过独立客户数（你到底服务了多少客户）或回头客数来体现。\n\n客户满意度调查可以让你询问自己为客户服务得怎么样，并了解什么对他们重要，但你也可以提出开放式问题，直接获取关于如何改进的意见。尽管\
  \ IT 部门已经针对每个问题案例做了满意度调查，但这些调查只收集了那些对我们的服务或产品表达过不满，并且已经在使用我们产品或服务的客户反馈。\n\n我们也想听听那些对我们的服务没有过任何问题的客户的意见，或许更重要的是，那些还没有尝试过我们服务的客户的意见。我们需要知道潜在客户为什么不找我们来满足他们的需求。一个组织如果只向现有客户进行营销，增长是有限的。在某个时刻，它需要吸引新客户。\n\
  \n因此，除了问题单跟踪调查之外，IT 部门还对整个客户群体进行了年度调查。根据你的业务情况，你可能需要对潜在客户进行抽样调查。\n\n所研究的每个领域都有其客户视角，并处理不同类型的反馈——客观且独立的客户反馈、间接客户反馈以及直接客户反馈。\n\
  \n如果你能引入三角测量的概念并让它被接受，那自然很好。如果你能引入我迄今为止提出的任何概念——从根本问题，到衡量指标框架和分类法，再到文档使用、如何正确与错误地使用指标、答案键、从有效性开始——而无需费力争取其被接受，那也很好。\n\
  \n\n好的，遵照您的要求，以下是翻译后的中文文档：\n\n\n"
- '# 引言


  当我尝试为自己的组织建立一个度量程序时，遇到了很大的阻力。我曾以为这源于“本地无先知”综合征。但在帮助他人建立并实施度量程序之后，我现在认为原因远不止于此。尽管这种综合征确实会造成困难，即使你是一名外部顾问，依然会听到这样的反对声——“去问客户啊！我们的客户满意度调查就够了！”这不仅是有人会大声疾呼，而且还会引来一片强烈的附和声。


  即使在今天，我仍不得不为多维度度量而努力。这不仅是指使用两个以上的度量指标，更是指在同一象限内使用来自不同视角的指标。


  ## 收集方法与来源的三角互证


  三角互证也需要不同的收集方法，如下所示：


  -   **交付量** 是客观收集的，无需客户参与。换句话说，客户不会知道你在收集数据。你不会使用任何意见（全是定量数据）。大多数时候，我也尝试对这些指标使用自动化收集方法（例如问题呼叫跟踪系统、监控系统或时间核算系统）。需要注意的是，这些指标衡量的不是客户，而是组织交付产品和服务的好坏程度。稍后我会解释。

  -   **使用量** 是基于客户行为的度量。他们买了什么？他们给谁打过电话？他们多久使用一次我们的服务？他们是如何知道我们的服务和产品的？我们有多少一次性客户，又有多少回头客？

  -   **客户满意度** 是最以客户为中心的度量组。在这里，我们直接询问客户的意见。将此项目称为“客户直接反馈”可能更贴切。你询问客户对服务和产品的看法，也询问改进建议。这些问题可以通过调查、焦点小组或个人访谈来提出。每种方法各有利弊，从不同的成本到收集数据量的差异。你应该选择最适合你的方法。很多时候，客户群体会决定最佳的反馈工具。


  还记得那三只盲鼠吗？当它们“观察”大象时，很难弄清楚它是什么，直到它们被允许交流各自的观察结果（三角互证）。既然它们能正确识别动物，似乎无需改变这种策略或方法——只需改变样本和来源即可。更精确的三角互证形式会使用多种方法和策略。如果这头大象是活的，而不是博物馆的展品，那么一只老鼠可以用触觉，另一只用嗅觉，第三只则可以向大象提出一系列深思熟虑的问题。


  三角互证要求你使用不同的来源、方法和度量类型。表 7-1 反映了这些可能性。


  ![图像](img/t0701.jpg)


  你可以使用其他分组进行三角互证。我提出这些分组是因为我知道它们行之有效，并且易于实施。其核心思想是至少要涉及三种不同的视角、来源和收集方法。


  三角互证的概念可以应用于度量的每一个层级。我不建议你深入太多，否则你可能会发现自己收集了成千上万种不同的度量指标。我希望你在顶层使用三角互证——在有效性度量中，即在交付量、使用量和客户满意度层面。但是，你也可以在下一层级使用同样的概念。


  对于客户满意度，你可以使用以下三种不同的收集方法：调查、焦点小组和访谈。这可能非常昂贵，尤其是访谈。但你也可以使用两种不同的调查——面向大部分客户群的年度调查，以及问题呼叫调查。你还可以使用工单调查——即在交付服务/产品时提供给客户的问卷。这是对你的活跃客户群进行的另一项调查，但不需要他们有投诉。你还可以在交付后三到六个月进行满意度调查，以了解客户是否：


  1.  在最初的兴奋感消退后，仍然对服务或产品感到满意

  2.  对你的产品或服务的优势或劣势有了新的见解

  3.  已将你的服务或产品推荐给了其他人


  使用量也允许有多个度量指标。你可以衡量独特客户的数量、回头客的数量，以及客户“购买”你服务和产品的频率。我最近在百思买买了一台新笔记本电脑，体验非常愉快，以至于第二周我就带我已成年的女儿去了那里。她为自己买了一台笔记本电脑（和我的完全不同），而我也忍不住买了一个无线键盘和鼠标（我现在正在用它们打字）。我不但自己成了回头客，而且第二周还推荐了另一个人（实际上，我开车送她去商店，帮她挑选电脑，并主动提出帮她把电脑拿到车上）。所有这些都可以用于衡量使用量。


  我把交付量放在最后，因为它是最容易进行三角互证的。在我为我的组织开发的程序中，我将交付量分解为以下三个主要因素：


  -   **可用性**

  -   **速度**

  -   **准确性**


  ### 交付量：可用性


  可用性很直接，但并不总是适用。当客户需要或想要服务或产品时，它是否可用？就电话服务而言，当你拿起听筒时，是否有拨号音？我刚刚因为屋外的电话线故障，在家忍受了五天没有电话服务（我家里仍然有固定电话）。服务（产品）五天内不可用。我和我的妻子都觉得这不可接受。可用性也可以进行三角互证（记住，我警告过不要深入太多）——在这种情况下，完全中断、部分中断和服务降级是三个可行的度量指标。


  ### 交付量：速度


  速度是交付量度量中最有力的指标之一，尤其是在我们当今的社会，甚至是全球社会中——我们都希望事情更快完成。耐心基本上已经是一种遗失的美德。所以，在我的项目中，我们衡量了解决速度、恢复速度和完成工单的速度。我们还衡量了项目交付、软件合同和新产品上市的速度。许多公司另一个偏爱的指标是响应速度——你回复信息、接听电话或亲自响应的速度有多快？速度很容易与可用性相关联。例如，我们不仅想知道中断的次数和持续时间，还想知道我们响应、解决问题和恢复服务的速度有多快。


  耐心基本上是一种遗失的美德，因此预计你的许多产品/服务健康指标将与速度相关。


  以我的电话中断为例，我对响应时间感到不满（技术人员五天后才上门），但我对解决速度感到满意。技术人员在不到 30 分钟内就解决了问题。


  ### 交付量：准确性


  我用于交付量的最后一个领域是准确性。这通常以返工的形式来衡量。在客户认为问题已解决后，有多少工单被重新开启？其他指标可能包括交付产品的缺陷数。服务中也存在错误。我们是否交付了正确的东西？我们是否交付给了正确的人？在正确的时间？在正确的地点？组织可能在很多方面犯错。准确性从客户的角度衡量你的产品或服务的质量。




