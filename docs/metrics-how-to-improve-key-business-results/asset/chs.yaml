- "# 流程健康度量\n\n你可能想衡量一切的成本。你可能想知道每个人每小时（即使是拿年薪的）的薪酬是多少，这样你就可以计算出走廊里的笑声要花公司多少钱。你可能想展示公司年度野餐要花多少钱，或者设备、设施和家具的成本。这些度量*不是*你需要的。\n\
  \n流程健康度量是关于流程，而不是关于人的。按照当前的方式执行给定流程需要花费多少钱？这全都是关于流程改进的。如果你能找到改进流程的方法，成功的度量之一可能是为客户、组织或社会降低成本。\n\
  \n那么，流程成本是多少？每个步骤的成本是多少？你可以将员工的时薪纳入考虑，但请记住你衡量的目的是什么——是为了改进。\n\n大多数流程改进方法都非常擅长衡量正确的事情。除了成本，你会发现大多数方法还希望你衡量执行一个任务或流程步骤需要多长时间。你的客户需要等待服务多长时间？你执行服务需要多长时间？\n\
  \n一个例子是精益六西格玛（一种流程改进方法论），它基于流动和缺陷消除。流动是关于流程如何从起点 A 到终点 Z。你是否有积压、库存堆积或时间损失？完成一个实际耗时仅需几小时的流程，你是否需要几天？步骤之间和步骤内部的等待时间有多长？六西格玛还希望将缺陷降至最低（达到六西格玛水平，即每百万次机会中\
  \ 3.4 个缺陷）。所有方法都使用度量来确定它们改进组织流程的效果如何。\n\n这些是质量度量。错误、返工、缺陷、议题和问题都是流程质量下的词汇。你的工作是使用质量度量来找到流程的改进点，以减少（并希望消除）它们。这可能包括对员工进行培训或再培训。这不包括“逼迫”你的员工更加勤奋。公平地说，你可能需要他们更关注细节，更专注，更勤奋。区别在于你如何做到这一点。你不应该“要求、哄骗、强迫或操纵”他们。你应该培养他们。\n\
  \n资源分配是你在流程健康中可用的另一个度量。除了流程步骤之外，你可能在错误的时间让错误类型的资源执行了错误的步骤。但要小心。向一个问题投入更多资源（资金、人力或设备）很少能长久地解决问题。你需要剖析问题，并找到能经得起时间考验的解决方案。\n\
  \n一套简化的度量包括以下内容：\n\n*   流程步骤数\n*   部门间的交接次数\n*   等待时间\n*   完成时间（按步骤/整体）\n*   接触时间（活跃时间与等待时间的对比）\n\
  *   流程中的成本\n    *   材料\n    *   运输\n    *   存储\n    *   生产\n*   分配的资源（按步骤/整体）\n\
  *   每次机会的缺陷数\n*   缺陷类型\n*   流程可重复性\n    *   是否已文档化？\n    *   是否每次都按相同方式执行？\n*  \
  \ 是否可调整？\n*   流程是否受控？\n\n流程健康象限，如同其他象限一样，可以成为组织改进的有力且有意义的工具。风险在于管理层会利用这些指标来改进员工（而不是培养他）或影响行为（而不是改进流程）。如果你确信这些度量将被正确使用，它们就能带来巨大的好处。流程改进（因此也是流程健康）是大多数组织发展工作的核心。\n\
  \n### 总结\n\n答案关键的第 2、3、4 象限提供了关于组织整体健康的重要洞察。每个象限都有其自身的视角——业务、员工和领导力——并且每个象限都有其益处和风险。还有其他你可以收集、分析和用于构建指标的度量。答案关键为全面的指标程序提供了基础和框架。\n\
  \n除了为组织健康提供有意义的见解之外，这些高级指标还帮助组织成熟为数据驱动的组织。转变为一个基于指标的组织所需的蜕变并非易事。它需要领导层、管理层和服务提供者的耐心和坚定不移的正直。\n\
  \n在产品/服务健康之后，我建议转向组织健康（第 3 象限），在此你使用诸如员工满意度、培训、工作环境和奖励与认可之类的度量。这是风险因素最低的指标，并且具有建立忠诚、敬业和快乐员工队伍的巨大潜力。\n\
  \n我建议接下来应对未来健康（第 4 象限）。唯一的问题可能是你的组织尚未准备好展望未来。它可能正在努力维持现状。我完全相信组织（和人们）不能“为生存而奋斗”。要成功，你必须追求比保持不沉没更高的目标。你必须游向岸边。但是，并非所有人都同意。如果你的组织不关心未来，你可能不得不跳过这个象限。但如果你有战略计划、长期目标或有正在进行中的项目——那么接下来就应对未来健康指标。\n\
  \n最后，我建议你深入钻研流程健康。重要的是要注意，如果你或你的组织正在实施流程改进工作，你很可能正在为这些工作做一些流程健康度量。我绝不是试图阻止你这样去做。这些指标及其度量中的任何一个都可以用来回答特定的根问题。我建议的是，在你已经在组织中建立足够的信誉，并使你的员工信任你使用这些度量的意图和方式之前，不要为这个象限建立一个独立的指标程序来提供组织健康监控。\n\
  \n## 结论\n\n高级指标非常有用，可以帮助组织在许多方面成长。它们也会给组织带来风险。为了减轻这些风险并从指标中获得最大收益，我强烈建议你从你要创建的任何指标的根问题入手。这些指标只应在其能回答根问题且该问题仍需要答案期间“存在”。\n\
  \n如果你必须创建一个独立存在、没有特定根问题的指标程序，我强烈建议你从产品/服务健康（有效性）开始。一旦该程序完全实施，并且你已经建立了对使用（以及*不*使用）指标的方式的一定程度的信任和理解，就考虑纳入其他三个象限。按以下顺序纳入它们：\n\
  \n*   第 3 象限：组织健康\n*   第 4 象限：未来健康\n*   第 2 象限：流程健康（效率）\n\n## ![images](img/ch12.jpg)\n\
  \n\n\n"
- "# 创建服务目录\n## 如何增强报告卡\n\n在我为组织创建报告卡时，最大的挑战之一是让领导层同意一份核心或关键服务清单。由于我成功赢得了在效果衡量指标上优先于效率衡量指标的争论，我需要一份将在`服务/产品健康度指标`中进行评估的服务（或产品）清单。\n\
  \n许多组织都是以职能为中心的。你可以在组织结构图以及组织各部门相互协作的方式中看到这一点。有市场营销、客户关系、项目设计、开发、测试和实施等部门。还有一些专注于客户支持的领域，比如服务台和二级支持功能。这些单位并不专注于某个特定服务，甚至不关注服务这个概念。它们专注于自己提供的职能。它们专注于\"\
  手头的任务\"和\"工作\"。\n\n这未必是件坏事。但当你围绕服务来构建组织时，这与你所获得的成果形成了直接对比。通过专注于服务，你的组织可以真正拥抱持续改进，并成为一个更有效的团队。\n\
  \n这样想吧：如果你以职能为中心，你会专注于向你的客户（内部或外部）交付你的职能。一旦你完成了流程中自己负责的部分并完成了任务，你对这个流程的兴趣也就结束了。另一方面，如果你以服务为中心，就没有\"\
  交接\"环节。每个职能部门都理解自己的努力如何融入服务的整体交付。以服务为导向能促进团队合作。它鼓励以客户为中心的观点。它使组织摆脱个人主义（包括部门孤岛），推动组织走向成熟。\n\
  \n除了对组织成熟度的好处之外，以服务为导向还有助于制定有意义的指标。如果你正在处理答案键的第一个象限——`产品/服务健康度`，这一点尤其正确。由于这个象限关注客户的视角并改善你所提供的服务和产品的健康度——让组织专注于这些相同的服务，会使指标制定变得更加容易。\n\
  \n由于我们的组织主要是以服务为导向的，领导层同意从评估关键或核心服务的健康度开始我们的指标计划。问题在于，要让组织内不同部门的负责人就哪些服务是核心服务达成一致。\n\
  \n当我天真地（且幼稚地）认为这应该是一个简单的决定时，我很快发现自己错了。我想知道哪些服务应被视为\"核心\"，只是为了确定要为哪些服务制定指标，而部门负责人却将这份清单视为对什么重要、什么不重要的判定。\n\
  \n我甚至没有考虑到 FUD（恐惧、不确定性和怀疑）可能成为部门负责人的一个因素。我忘记了人们对指标的反应并不是基于职位、薪水或权力。恐惧是一种人类情感——我们的领导者和基层员工一样，都是凡人。\n\
  \n因此，我关于哪些服务对组织至关重要的天真提问，引发了一场意想不到的激烈辩论。如果 CEO 没有纳入某位部门负责人认为对其团队至关重要的服务，该负责人就会担心这项服务是可被淘汰的。也许未来需要削减开支时，这些非关键服务就会面临风险。这在当时尤为现实，因为二十一世纪初美国经历了经济困境。所以，每位负责人都力争将自己负责的尽可能多的服务纳入清单。任何同行提出的排除某项服务的建议，都被视为对该负责人及其团队保障的攻击。\n\
  \n我的良好意愿丝毫不起作用。我甚至犯了错误，试图说服这些负责人他们的看法是错误的；没有人打算用这些指标来决定如何精简组织。这是一个巨大的错误。我一直小心翼翼地缓解员工的\
  \ FUD，却错过了与领导层做同样工作的机会。\n\n良好的意图无法弥补糟糕的执行。\n\n因此，我为自己制造了一场艰难的斗争，最终——你可能已经猜到了——在没有关键服务清单的情况下不得不继续推进。相反，我选择了七项客户使用率高的服务，并且我认为这些服务负责人会同意它们是关键服务——但这绝不是一份完整的清单。这些服务包括电子邮件、日历、服务台、网络、电话、打印和电子存储服务。\n\
  \n在理想情况下（这要求组织正走在走向成熟的道路上），服务目录会很容易创建，并作为组织自我定义的自然组成部分。如果组织具有内省精神，它就会想要知道自己提供哪些服务（和产品）。除了\"\
  是什么\"，组织还会想知道谁、如何以及特别是为什么。\n\n谁是你的客户？不是流程中的下一个人员或单位，而是最终消费者。\n\n当我说\"如何\"时，你不必详细列出流程（尽管那样会更好）。我说的\"\
  如何\"是指你必须知道服务/产品包含哪些内容。本质上，是另一个\"谁\"。谁参与了服务/产品的提供？哪些单位或部门？\n\n\"为什么\"与客户有关。服务/产品的目的是什么？它为什么有价值？为什么你的客户会为此\"\
  付费\"？\n\n## 如何开发服务目录\n\n虽然服务目录对于`服务/产品健康度`指标项目来说并非必需，但它肯定会有所帮助。所以，让我们花点时间看看如何创建并使用它。\n\
  \n要创建服务目录，你需要对每项服务进行一个简单的分析。在开始之前，先做一个预备步骤：确定你所在的行业。检查你的使命宣言。你的组织为什么存在？它的目的是什么？如果你对此有清晰的认识，那么确定你所提供的服务\"\
  类型\"。我们的指标工作的一个副产品就是识别出了服务类型或类别。作为一个 IT 服务组织，我们最终得到了以下分类：\n\n- 公用设施（包括网络、电话、电子邮件和电子存储）\n\
  - 支持（一般支持，如服务台）\n- 学术服务（针对学院的具体支持服务）\n\n这些分类可能会有所帮助，但并非必要。如果你只提供少数几项服务，比如麦当劳，你可能不需要将服务划分为类别。麦当劳可以按餐点（早餐、午餐/晚餐）、食物类型（主菜、配菜、甜点）或价格（1\
  \ 美元菜单、超值套餐、单品）进行分类。但问题是，这有多大用处？答案将体现在指标中以及你试图回答的问题上。\n\n### 服务/产品健康度服务目录\n\n你需要按照以下步骤来创建目录。\n\
  \n#### 步骤 1：识别服务\n\n这可以简单到写下服务的名称。它叫什么名字？客户如何称呼它？\n\n#### 步骤 2：确定该服务是否适合你预定义的类别\n\
  \n如果该服务不适合你预定义的类别——是因为你遗漏了某个特定类别？还是这项服务不符合你的使命？如果服务不匹配，或许你应该停止提供它。\n\n\n\n### 步骤\
  \ 3：确定服务提供方\n\n组织内部谁负责交付该服务？这可能是跨部门的协作，也可能是组织架构图的一部分。理想情况下，你需要找出产品/服务的提供方，这往往意味着要遍历组织架构图，确定贡献者所在的不同位置。很少有服务是由单独一个人或一个部门提供的——即使是在职能型组织中也如此。\n\
  \n基本上，提供该服务或产品涉及哪些资产？满足客户需求需要什么资源、需要哪些人参与？这些洞察正是服务目录能为组织带来的诸多益处之一。\n\n### 步骤 4：确定客户群\n\
  \n识别客户群的一个简单方法是看谁在使用该服务/产品的产出。最终客户是组织内部还是外部其实并不重要。该服务/产品是“营利性”还是“非营利性”的也无关紧要。你需要知道客户是谁。客户群庞大吗？还是属于利基市场？\n\
  \n### 步骤 5：服务环境如何？\n\n-   该服务的竞争环境如何？是“垄断型”服务吗？客户在选择服务提供方时有其他选项吗？\n-   是本地市场吗？\n\
  -   是区域性市场吗？\n-   是全国性市场吗？\n\n### 步骤 6：服务水平协议是什么？\n\n服务水平协议本质上是组织与客户之间的合同。它清晰地向任何相关方定义了：将交付什么、如何交付。在可能的情况下，它应该超越商定的交付内容——它应当捕捉客户的期望。\n\
  \n如果你无法直接询问客户的期望（当客户群庞大时便是这种情况），你需要从现有信息中推断出这些期望。你可以从明确陈述需求的来源中收集期望信息。书面协议、工作说明书或合同都是很好的信息来源。很多时候，你自己的营销材料也会捕捉到承诺或期望的服务水平。有时，你不得不从隐含或暗示的输入中寻找期望，例如一个部门对另一个部门的非正式承诺，或客户提出的请求。\n\
  \n另一个来源是在衡量服务健康状况的数据收集过程中收到的反馈。即使你尚未制定度量指标计划，你很可能已经在使用客户满意度反馈工具，例如调查问卷、意见卡或主动反馈。\n\
  \n无论信息从何而来，目标都是确定客户对服务的期望。这在制定度量指标的期望值时将非常有用。\n\n### 步骤 7：成本\n\n如果是基于收费的服务，成本是多少？即使你不是利润中心，获取服务也可能存在“成本”。它可能要求某种类型的会员资格，或者要求你是产品的注册购买者/所有者。我们的一些服务除了要求客户是我们的教职工、职员或学生外，没有其他相关成本。\n\
  \n这些步骤也可以作为服务目录的合理章节标题。你可以根据服务类别来组织它们，也可以使用前面任何“步骤”来组织。如果你创建了服务目录的电子（在线）版本，你可以允许基于这些步骤中的任意一项进行搜索或排序。\n\
  \n关于你的服务，还有其他重要问题可以提出并回答。其中一个问题跨越了以`服务/产品健康`为重点的目录和以`流程健康`为重点的目录之间的界限。什么是关键/核心服务？这个问题不回答客户的问题，但客户可以回答它。这个答案对于基于`服务/产品健康`的目录很有用，这样你就知道该衡量哪些服务（假设你并没有资源去衡量所有服务）。从基于`流程健康`的角度来看，关键/核心服务会告诉你其他重要信息。\n\
  \n## 流程健康（效率）服务目录\n\n如果你打算将服务目录的结果用于内部流程改进（特别是答案键中的第二象限），你需要再追问几个问题。\n\n### 步骤 8：关键/核心服务\n\
  \n对服务进行分类，并识别出哪些服务被视为组织成功的“关键”或“核心”，可以通过提出以下一些问题来确定：\n\n-   哪些服务对组织的成功至关重要？\n  \
  \  -   哪些是主要的收入驱动力？\n    -   哪些被视为客户生成器？\n-   哪些服务优先级更高？\n    -   *大部分*资源应该分配到哪里？\n\
  \    -   *最优秀*的资源应该分配到哪里？\n-   哪些服务被视为组织品牌的代表？\n    -   哪些服务必须做得特别好？\n    -   哪些服务有助于塑造客户对整个组织的看法？\n\
  \n\n\n##### 步骤 9：依赖关系\n\n在确定哪些服务/产品对组织成功至关重要之外，了解一项服务在何处以及如何依赖于另一项服务也很有帮助。这有助于厘清服务族。你需要提出的问题包括：\n\
  \n- 是否存在内部依赖关系？\n    - 交付该服务需要什么？\n    - 其他服务是否依赖于该服务？\n- 该服务如何适应组织的整体服务架构？\n  \
  \  - 它是一项基础服务吗？\n    - 该服务是其他服务的支柱吗？或者是某项关键服务的支柱？\n\n当你在服务目录中分析服务时，你将使用这两个可能的视角（有效性或效率）来决定如何构建你的度量指标。因此，这又回到了根本问题。根本问题是关于“服务/产品健康”类型的问题，还是侧重于“流程健康”的问题？当然，你也可以同时使用两种度量方式。如果你的根本问题不是关于一组服务，而是关于某一项具体服务，你可能需要来自每种目录类型的信息。\n\
  \n假设你的根本问题是“我如何为服务 X 增加客户群？”这个问题需要大量工作。增加多少？为什么要增加客户群？你实际想要达成什么目标？但，我们以这个问题为起点。也许提供这项服务的部门需要将其客户群增加\
  \ 30%，组织才会认为它是服务组合中可行的一部分。因此，该部门经理，即服务提供商，只想了解他的部门如何才能生存下去。\n\n对这个非常具体问题的答案可以借助来自多个象限的信息。获取客户视角的信息至关重要。既然你的目标是增加客户数量（30%），那么显而易见，你需要从客户的角度来看待这项服务。\n\
  \n审视交付服务的效率同样有益。如果你能改进交付、使用或客户满意度，你就有很大机会获得更多客户。有效性度量会告诉你是否成功（以及应将精力集中在哪里），而效率度量则会告诉你“如何”改进。例如，如果你确定可以通过更及时（更快）地交付服务来获益，你就会想方设法提高效率，让内部流程“更快”。当然，你也需要确保交付的服务质量上乘。你不能在提高交付速度的同时，让质量大幅下降。这两者都属于内部流程视角。\n\
  \n你甚至可能从一些“未来健康”度量中获益。你可能需要证明增加额外资源的必要性。你很可能还需要得到保证：如果你的部门达到了目标（30% 的增长），就不会被“砍掉”。这意味着你可能希望在战略计划中加入包含“如果-那么”陈述的条款。如果你成功了，会发生什么？当然，如果你失败了，后果也可以记录下来。你需要在一个月内达到目标吗？一年？三年？随着时间的推移进行渐进式改进是否可以接受？\n\
  \n因此，驱动你努力的目标可能来自“未来健康”象限。它很可能是战略计划的一部分。它也可以被视为一个“项目”或项目群的一部分。无论如何，结果显然是面向未来的。\n\
  \n那么，“员工视角”在这里也适用吗？“组织健康”又如何发挥作用呢？首先，并非必须如此。请注意，“未来健康”的纳入并非必要。有效性和效率至关重要，但战略层或项目/项目群层面的度量就没那么关键了。话虽如此，让我们看看它是否适用。\n\
  \n第一个问题是，努力的成果将如何影响员工？如果服务被删除，会有人失业吗？员工会被解雇还是会被重新分配？如果他们成功了，他们的工作是否就有了保障？如果是，保障多久？这种情况将如何影响士气？成功或失败将如何影响该部门的士气？又将如何影响组织其他部门的士气？所有这些问题都属于“组织健康”象限，且都是合理的关切。\n\
  \n诚然，针对第三和第四象限的问题完全不需要服务目录，但我想让你全面了解如何利用来自不同象限的度量来回答关于某一特定服务的具体根本问题。对于源自“服务/产品健康”和“流程健康”象限的问题，服务目录尤其有帮助。\n\
  \n\n\n### 附赠材料\n\n服务目录本质上是一种成熟的行为，还有其他一些行为能够与度量计划良好配合。\n\n在《为何组织如此努力却收效甚微》一文中，我曾警告不要在尚不成熟的组织中尝试实施成熟行为。度量被列为最危险的行为之一。\n\
  \n与度量类似，其他一些难以实施的行为，只要你尝试推行度量计划，反而可能产生积极影响。即使你未能完全成功，也能对组织在以下方面的采纳产生推动作用：\n\n- 流程地图/流程定义\n\
  - 流程改进方法论\n- 培训计划\n- 战略计划\n- 客户反馈工具\n\n这些方面都能通过度量计划得到极大的促进。正如第 13 章关于标准与基准的讨论所述，度量可以推动组织采取其他改进措施。当你试图构建组织流程健康图景时，清晰的流程定义将大有裨益（就像服务/产品健康度量受益于服务/产品目录一样）。要改进某件事，首先需要理解它。清晰完整的流程定义是改进这些流程的必要起点。\n\
  \n一个好的流程定义本身就能通过记录过程帮助你改进流程。\n\n度量计划能让组织清晰地认识到定义流程的必要性——从而更容易被接受。这些流程地图通常是流程改进方法论的副产品。\n\
  \n你的组织可能已经选择了一种偏好的流程改进方法论。这些方法——从全面质量管理到六西格玛再到精益生产等——将有助于定义你在度量中使用的许多信息。而你的度量也可能帮助确定哪些方法最适合你的组织。\n\
  \n另一个受度量计划推动、反过来又能支持度量计划的工具是培训计划。岗位和个人职业发展计划将直接支持围绕员工视角和流程健康构建的度量指标。\n\n战略计划对于\"\
  未来健康\"象限以及组织的未来发展至关重要。战略进展的度量指标与战略计划相辅相成，共同构建理想的未来。\n\n客户反馈形式多样，也可以由服务/产品健康度量来驱动。这一点显而易见——通过实施度量，你促使组织将反馈概念融入日常运营，而非仅将其视为年度或事件驱动型活动。组织将开始主动寻找、收集并利用客户反馈作为业务开展方式。\n\
  \n度量计划带来的不仅是分析、报告和调查被度量对象。它还能产生额外收益，成为其他改进措施、工具和副产品的催化剂。它是构建以产品/服务健康为核心的度量计划的必要基石，也是提升组织成熟度的绝佳工具。它将支持或激发战略计划、流程改进、服务级别协议和明确期望的创建。与大多数改进措施一样，如果执行得当，你将在整个过程中收获诸多额外收益。\n\
  \n### 要点总结\n\n服务目录并非度量计划的强制性组成部分。它是一个有用的工具，尤其是当你的度量指标以服务为中心时（如服务/产品健康度量）。\n\n尝试构建服务目录可能会遭遇负面抵制。那些可能对数据收集产生不利影响的\
  \ FUD 因素，同样会妨碍你创建有效的目录。但这项风险非常值得承担。你将在多方面受益——从更深入了解组织和客户，到确定哪些该做哪些不该做。服务目录及其创建过程，可以成为催化剂，促使组织从各自为政、\"\
  利己为先\"的态度转向团队合作。有时，将一群人凝聚在一起只需要一个共同目标——而服务目录恰好提供了这个共同焦点。\n\n\"答案之书\"中的所有象限都可以在服务目录中\"\
  发挥作用\"，但很可能你最终会得到以有效性或效率为基础的服务目录。请记住利用创建和维护目录过程中产生的间接收益（副产品）。\n\n## 结论\n\n度量计划能够促进并与许多成熟行为良好配合。服务目录对于服务/产品健康度量而言可能是最显而易见的。其他行为则更适合\"\
  答案之书\"的其他象限，具体如下：\n\n- *流程健康*：流程地图与定义\n- *组织健康*：职业发展计划、员工反馈与流程改进方法\n- *未来健康*：战略计划\n\
  \n对于寻求开展全面改进工作的组织而言，服务目录是绝佳工具。它能帮助组织理解自身所处的业务领域。\n\n通过将服务目录与组织使命（或许还有愿景）进行对照，组织可以判断自己是否在做正确的事（有效性）。服务目录的细节（谁提供、向谁提供、预期是什么、成本是多少）本身就能提供宝贵见解，帮助判断组织是否以正确的方式做事（效率）。\n\
  \n## ![images](img/ch13.jpg)\n\n## 建立标准与基准\n\n在度量领域，标准与基准紧密相连。从工业时代至今，标准对于提供互操作性的手段而言价值非凡。工业领域的标准让你能在高端设计师家具店购买的灯具上，使用在沃尔玛购买的电灯泡。标准让你可以在美国任何加油站为自己的汽车加油，而无需担心油枪喷嘴是否能插入油箱。从汤罐上的成分标签到调谐收音机的技术，标准为制造商、分销商、建筑商和客户提供了统一性和互操作性。\n\
  \n与制造业不同，绩效衡量更像一门艺术而非科学。在改进方面使用衡量标准这一做法本身存在争议。有何必要？如果我们提出的问题独一无二，因此答案也独一无二，那么我们的衡量标准为何需要标准？\n\
  \n由于我倡导创建度量指标来回答具体问题，因此很难站在辩论的另一边。确实，为何需要？\n\n我很希望看到衡量指标开发过程能有标准可循；例如使用期望值而非目标值，或对数据所有者进行定义。但整体绩效衡量的标准呢？为何？\n\
  \n在回答这个问题之前，我们先看看基准，以及我认为两者相互关联的原因。\n\n### 基准：最适用于提供有意义的比较\n\n基准最适用于为你的度量指标提供有意义的比较。除了定义期望值之外，你通常还希望了解与同行相比自己的表现如何。如果你有雄心，你会想了解自己与佼佼者相比表现如何——行业最佳、国内最佳，甚至（如果真有雄心）世界最佳。\n\
  \n基准既是祝福也是诅咒。\n\n基准还有助于划定\"基线\"。你可以从自身衡量指标出发建立基线，从而将当前绩效与过往绩效进行比较。当你的目标是改进时，这一点至关重要。\n\
  \n\n\n"
- "# 建立基线\n\n在与客户合作处理指标时，我的乐趣之一就是帮助他们建立基线；这主要是因为它迫使他们将指标前置，融入到改进流程的思考中。我几乎总会遇到诸如提高效益、提高效率、提高生产力或提高客户满意度这样的目标。\n\
  \n“提高” 是一个用在目标陈述中的糟糕动词。你必须用更多信息来限定它——比如“提高”多少？提高一定百分比？还是达到某个具体数字？\n\n关于“提高”型目标的糟糕用法，我最喜欢的一个回忆来自我的教区委员会。当时我希望将组织发展方面的专业知识引入委员会。与我搭档的有：一位退休警官、一位成功的企业主、一位护士、我们的神父，以及一位退休的祖母。目标是什么？提高教堂的会员人数。我并没有感到困扰，因为这类目标（增加、减少等）我已见过很多次。\n\
  \n> *我说：“提高会员人数——提高多少？”*\n>\n> *“你是什么意思？”前警官问道。*\n>\n> *“我的意思是，如果提高会员人数是我们的目标，我们怎么知道已经实现了它？”*\n\
  >\n> *那位企业主说：“哦，你是想让我们设定一个具体目标。”*\n>\n> *我反驳道：“我以为那本就是意图——为今年制定目标？”*\n>\n> *“是的，”企业主说，“但你是想让我们一开始就注定失败。我们设一个数字，如果达不到，我们就失败了。”*\n\
  >\n> *此刻我惊愕地坐着，沉默不语。我可能确实张开又闭上了嘴一两次。“呃。嗯。那么，如果只多一个家庭加入，你们会满意吗？”*\n>\n> *“当然，”护士说。*\n\
  >\n> *“再多都是锦上添花！”前警官说。*\n>\n> *我转向神父，仍然震惊不已。“如果只增加一个家庭，您就认为我们实现了这个目标吗？”*\n>\n> 他摇了摇头，表示否定。作为团队和我教区的领袖，他的意见具有与\
  \ CEO 同等的分量。\n>\n> *“现在每年有多少家庭加入？” 我问道。*\n>\n> *“一年两到三个家庭，”神父回答。*\n>\n> *“那么，如果我们什么都不做，也能实现这个目标？”*\n\
  >\n> *他肯定地点了点头。*\n\n我们最终制定了一个合理且可衡量的增长目标，该目标是在不做任何改变的情况下，超出了预期的增长量。这个目标的目的是为了建设教区。指标的用途则是检验我们的努力是否成功。我们安排了计划、想法和活动，旨在吸引新成员并召回那些已然疏远的教友。我们需要：(1)\
  \ 设定目标以聚焦我们的努力和想法；(2) 设定衡量标准，以告诉我们哪些方法有效，哪些无效。\n\n我们还需要一个基准。如果我们不知道常态是什么，就无法判断任何一项努力是否产生了预期结果。在这种情况下，可以把基准视为一个“控制组”或基准值。你必须知道如果不做任何改变，你会得到什么结果。这样，当你以新的方式尝试新事物时，至少可以假设你所做的改变导致了结果的变化。即使你实施了太多改变，以至于无法确定到底什么有效、什么无效，你至少能知道整体努力是否奏效。\n\
  \n因此，基准基本上能让你知道自己身处何处，从而知道最终到达何方。\n\n基准就是起跑线。\n\n即使基准被用于与你同行进行比较，它本质上也是一条起跑线——一条用来衡量你进展的基线。基准最纯粹的形式是将其设定为内部基线（相对于外部比较而言）。这能够让你衡量进展。\n\
  \n## 负责任地设定基准\n\n当领导者想要将比较性基准作为基线使用时，基准有时会失灵。大多数情况下，事情是这样开始的：“你能拿到我们竞争对手的平均可用性、响应时间或客户满意度评级吗？这样我们就可以和他们进行比较。”\n\
  \n这要求你竞争对手的表现是一个好的起点。\n\n我对追查这类数据的第一个简单反对理由是：“如果你已经比竞争对手做得更好了呢？这是否意味着你已经做得足够好了？”\n\
  \n通常，那个让我去追查数据的领导者——他深信自己的组织远远落后于竞争对手——并没有准备好回答这个问题。我通常需要问两遍。\n\n“不，我们还是需要改进……”\n\
  \n因此，虽然收集另一家组织绩效的信息可能具有启发性，但如果你的目标是改进，那它并没有太大的用处。如果你的目标是比同行更好，那么，这种基准当然至关重要。即使你的目标是比竞争对手更好，你也需要知道：(1)\
  \ 你的努力是否在帮助你改进；(2) 你距离同行的表现还有多远（如果你已经比同行好了，那你就完成了吗？）。\n\n所以，如果你选择只看自己内部的绩效表现，那么标准并非必需。但是，如果你决定（并且当——因为最终你会想了解自己与别人的比较情况）将自己的绩效与同行或竞争对手进行比较，那么标准就至关重要了。当衡量方法不同时，你无法将自己与他人进行比较。\n\
  \n假设你将网络的可用性定义为：在给定时间段内，无中断时间除以总时间。\n\n- `可用性 = 1440 分钟（一天（或 24 小时）的分钟数） – 20 分钟（中断时间）除以\
  \ 1440 分钟`\n- `可用性 = (1440 – 20) ÷ 1440 = 98.6%`\n\n到目前为止，一切顺利。但是，假设你最接近的竞争对手（或同行）在同一时期内的可用率是\
  \ 100%。你会不会再加把劲？你会不会更努力地工作？你的竞争对手是否比你做得更好？\n\n嗯，如果没有标准，你无法判断你的竞争对手是否比你做得更好。如果你将“中断”定义为客户无法使用网络的任何时间段，而你的竞争对手则认为“中断”仅指网络因非计划或意外停机而不可用的时间呢？换句话说，假设在相同的\
  \ 24 小时内，你的竞争对手安排了四小时的计划维护。如果你将“中断”定义为服务不可用的任何时间（这很可能是客户理解的方式），那么竞争对手的可用性*应该*报告如下：\n\
  \n- `竞争对手可用性：(1440 – 240) ÷ 1440 = 83.3%`\n\n如果你拥有竞争对手报告的所有原始数据，就可以使用你个人的“标准”来确定你与竞争对手相比表现如何。但这几乎不可能发生。即使运气极好，你能得到的也只是“分数”——即便从同行和竞争对手那里获得这个分数也相当困难。\n\
  \n因此，你如何定义“中断”，与你竞争对手定义“中断”的方式相比，对于你能否将其衡量指标用作基准至关重要。\n\n## 标准促成与他人的比较\n\n绩效衡量中的标准，归根结底是为了提供在不同组织之间比较衡量指标的能力。就像制造标准使得你的产品能与另一家组织的产品无缝衔接一样，绩效衡量中的标准也使得你能够将自己的衡量指标与另一家组织的衡量指标“无缝对接”。如果绩效衡量实现了标准化，你就可以为了自己的目的而“借用”另一个组织的衡量指标。如果你有相同的问题，就可以相信\
  \ A 公司使用的指标能够用来衡量你组织中的相同事物。\n\n没有标准，很难想象你如何使用不同组织的衡量指标——即使你们有完全相同的根本问题。而将另一个组织产出的衡量指标作为基准来使用，则更加不切实际。\n\
  \n\n\n#### 获取可靠数据\n\n性能衡量标准与基准的这一问题，也给那些致力于提供信息数据仓库的善意组织带来了麻烦。这些信息无一例外都是为了供你进行比对而设计的。要使数据仓库有效，就必须对来自不同组织的信息建立一套明确的标准。\n\
  \n第三方调查公司`HDI`通过控制数据定义，提供客户满意度数据的基准测试。`HDI`负责向你的客户发放调查问卷、收集回复，并为你提供报告、分析和原始数据。由于`HDI`标准化了其提问方式（使用相同的问句，并附带一套相同的五级李克特量表选项作为回复），它能够为你提供与其他组织的对比数据，包括：\n\
  \n*   你的得分（平均值、满意度百分比等）与所有使用过`HDI`服务的其他组织对比\n*   你的得分与同行业其他组织（从列表中自行选择）的对比\n*  \
  \ 你的得分与排名在同行客户群前百分之 N 位的组织对比\n\n这让你对信息的可比性有了更高的信心。当然，也有一些缺点。只有使用`HDI`服务的组织才会被纳入对比范围，而你的主要竞争对手或同行可能并不在其中。即使你将自身结果与整个客户群对比，这仍然可能无法反映你想要的对比群体。另一个小缺点是，你被迫使用一套固定的问题，不容许任何偏差。如果你想使用赖克海德在《终极问题》一书中建议的十级量表，就无法使用`HDI`的服务。而且，即使你使用了十级量表，也无法将数据与那些使用五级量表的数据进行比较。\n\
  \n#### 目标：可靠的行业标准\n\n性能衡量指标的行业标准将使真正的基准测试、排名和同行组织间的比较成为可能。在有机会采用*通用*标准之前，说服某个*行业*（例如高等教育\
  \ IT）标准化其性能衡量指标应该是可行的。你能够缩小的标准化群体范围越精确，达成一致意见就越容易。高等教育信息技术就是一个相当具体的群体。如果你从信息技术性能指标入手——你试图达成标准共识的群体就太大了。如果你将其缩小到*教育*信息技术，情况会好一些。而*高等教育*则使其更精确。\n\
  \n成功需要共识。仅仅发布一个标准并不能使其生效。你必须让（你所在行业的）大多数组织使用这个标准，它才能发挥效用。既然标准的采用需要高参与度，那么合乎逻辑的做法是，在制定标准时尽可能多地让目标受众参与进来。\n\
  \n我认为联盟结构是制定性能衡量标准的最佳途径。联盟为一个行业制定、评估、审查和管理标准。问题可能在于，此处的“行业”很难界定。当然，如果你按照我的建议，对目标受众找到一个更精确的定义，你就能实现目标。但是，将性能衡量本身视为一个行业显然过于宽泛了。因此，作为一名性能衡量专家，你必须定义你的“行业”来建立一个联盟。如果你有一些性能衡量标准可以参考，你就已经领先一步了。\n\
  \n### 要点总结\n\n标准是实现互操作性的工具。在性能衡量方面，标准使得组织之间能够进行比较。\n\n基准要么是你改进工作的起跑线（基线），要么是你需要实现的目标。作为基线，它帮助你确定与实现目标之间的差距、你取得进展的程度以及你已经走了多远。作为目标，它代表了你想要达到的优秀程度——“像\
  \ A 公司一样好”或“高于平均水平”。\n\n要拥有真正的外部基准，你必须拥有与你选择进行比较的组织之间达成一致的标准。\n\n如果你能为你自己的性能指标找到或制定标准，并且你的同行同意这些标准，那么你就可以进行衡量比较了。\n\
  \n**创建你自己的联盟**\n\n根据你所在行业的不同，性能指标的标准化程度可能很低甚至完全没有。如果缺乏标准，你也就失去了与竞争对手或同行进行基准测试的能力。创建一个用于开发、发布和使用行业标准的联盟，是满足这一需求的可行方案。我于\
  \ 2009 年创建了信息技术性能标准制定联盟（`CEITPS`），旨在解决高等教育 IT 领域缺乏性能衡量标准的问题。这项工作比我预想的要困难得多。\n\n\
  一直以来与我合作的人员——来自同行机构的指标分析师——都一致认为，比较性能指标的能力对于组织领导者接受指标至关重要。他们也一致认为，如果没有构成这些指标的衡量标准，这一目标几乎不可能实现。\n\
  \n我不确定让人们起草标准如此困难，是因为衡量指标比较的优先级低，还是人们担心一旦标准被创建和采纳后未来环境将发生改变。在某些情况下，标准可能被“强制执行”——特别是当存在有权力的监管机构时。但如果你和我们大多数人一样，你就必须建立共识、宣传标准、推广它们，然后期待被采纳。在这个努力中，害怕自己成功是有真实原因的。如果你成功了，并且所在行业采用了你的标准，那么你就会被要求将其贯彻到底，允许你所在组织的绩效与同行进行比较。届时将没有借口，也没有关于你实际表现如何的、主观的“感觉”。你将拥有真实的价值来进行比较。虽然大多数指标分析师不会“害怕”这种情况，但许多组织领导者可能会。\n\
  \n我在争取同行协助制定标准方面进展甚微（尽管`CEITPS`拥有健康的会员数量），以至于我转而寻求替代方法来起草标准。在下一次全国会议上（届时大多数代表都会出席），我计划主持一系列分组讨论，为关键衡量指标起草初稿。我将从答案密钥中定义的有效性衡量指标开始。我的希望是，这个联盟能够为我们的第一个标准起草一套完整的衡量指标：基于故障的服务可用性。\n\
  \n\n\n## 结论\n\n标准与基准密不可分。如果没有标准来确保各组织间的定义和衡量方式保持一致，基准就毫无意义。对于外部基准而言，这尤其是个问题——因为你需要借此与同行和竞争对手进行自我排名。\n\
  \n如果只使用内部基准，则无需标准。\n\n基准更适合用于展示相对于基线的进展，而非与外部组织进行比较。\n\n何时需要标准与基准？\n\n- 当你需要将自己的绩效与竞争对手或同行进行比较时。\n\
  \    - 需要外部基准来确定\n        - 比较对象的平均绩效水平\n        - 比较对象的绩效范围\n        - 比较对象中的顶尖表现者\n\
  \    - 需要标准来确保你是在品牌、类型、颜色和尺寸上进行同类比较。换言之，标准是确保比较具体性的必要条件。\n- 当你需要确定一个现实的目标、追踪目标进展，或判断是否已达成目标时。\n\
  \    - 需要内部基准来确定\n        - 一个常态值，以帮助设定切实可行的改进目标\n        - 一个基线或起点，以便从当前状态追踪进展\n\
  \        - 一种判断目标是否达成的方法（当该目标被定义为达到特定改进水平时）\n\n基准还有助于判断你在组织发展或流程改进方面的努力是否对环境、服务或产品产生了积极影响。如果你预期自己的努力（尤其是流程变更）会对绩效产生影响，你就需要为任何可能涉及的领域设定基线。如果可以获取历史数据，则有助于判断这些变化是源于你的努力，还是属于正常波动。\n\
  \n![images](img/ch14.jpg)\n\n## 尊重度量指标的力量\n\n本章篇幅简短，这是有意为之，旨在帮助你聚焦于度量指标的力量。你必须尊重度量指标的力量，并警惕不当使用它们可能给组织带来的损害。\n\
  \n当我还是美国空军一名年轻士兵时，有幸与一位名叫汤姆·伦南的文职电工共事。汤姆是个务实的人，也是我的好友。他比我年长（至今仍是），并多次用金玉良言帮助我。他给我的最佳建议之一，就是尊重电的力量——因为即使是训练有素的电工，也曾在进行电气作业时受重伤，甚至更糟。在建筑行业，触电伤害是导致死亡的第二大原因。\n\
  \n我之所以提到这个，是因为度量指标就如同电。度量指标可以用来做很多有益的事。作为一种工具，它们能帮助我们了解环境，评估我们努力的成效，让沟通更便捷、更清晰。但和电一样，度量指标必须被尊重。遵循规则，你就能利用电——以及度量指标——让生活更美好。但即便你遵循规则，仍存在造成损害的可能性。风险如此之高，以至于你必须在每个案例中权衡：收益是否值得承担这些风险。\n\
  \n本书大部分内容都在讨论如何开发、分析、报告以及（最重要的）*运用*度量指标来实现改进。但与大多数组织改进工具（如培训计划、战略规划和员工表彰计划）不同，度量指标如果用得不当，其危害可能与益处相当。在多数情况下，这是因为数据的使用者没有得到充分训练，或是警惕性不足，未能理解度量指标强大但又充满风险的本质。\n\
  \n度量指标有可能弊大于利。\n\n正如我已经谈到的，你必须努力找到*正确的*根本问题：构建答案的抽象图景，确定描绘该图景所需的信息，然后费尽心血地建立收集、分析和报告该度量指标所需的流程。在整个过程中，你必须反复核查所有环节——从数据到收集方法，再到度量指标本身，最后再到根本问题。\n\
  \n请严谨而勤勉地对待你的努力，因为出错是极为容易的。即使所有数据都已核实，解读上仍可能出现错误。我曾与一位同事就“事实”这一概念进行过一场有趣的辩论。他认为度量指标（至少是好的度量指标）就是事实；如果它们不是事实，我们就不该用它们来展示绩效。我不得不解释（至少从我个人的观点来看）：度量指标并非事实。度量指标首先是指标。它们能让我们获得洞见，但未必是正在寻求的*真相*。它们不是事实。\n\
  \n度量指标不是事实，它们是指标。\n\n\n\n### 指标：是事实还是指示？\n\n指标究竟是事实还是指示，这一区分是正确使用指标的核心。若将指标视为事实，我们极易陷入仓促决策的风险。\n\
  \n那么，测量值或数据又该如何看待？你车上的速度表显示的是关于车速的事实吗？它的读数是否精确无误，还是存在`+/-`的误差？如果速度表显示时速 55 英里，而警用雷达显示为\
  \ 58 英里，哪个才是真相？\n\n你可能会辩称，尽管测量设备存在差异，但实际行驶速度显然是一个客观事实。这一点我同意。在特定时刻，你确实在以某个确切速度行驶。但我几乎不相信，任何用于捕捉特定瞬间数据的设备能精确到足以将测量值称为\"\
  事实\"。\n\n让我们试试主观测量。假设我请你用 1 到 5 分来评价对我服务的满意度，1 分代表非常不满意，2 分不满意，3 分中立，4 分满意，5 分非常满意。那么，我是否应该将你选择的分值视为一个事实呢？\n\
  \n错。\n\n在调查中，我唯一能确定的事实是：我收到的答案就是你给出的答案。即便如此，仍可能存在错误。在客户满意度调查中，我们常发现受访者会颠倒数字，本想打\
  \ 5 分却给了 1 分。排除这类错误，结果难道不能算事实吗？再次强调，我们唯一能明确证实的是：我们拥有的答案就是受访者选择的那个答案。我们无法确知这个给出的答案就是真实答案。\n\
  \n这种不确定性经反复分析与研究，我已能自信地说：大多数答案实际上*并非*真实。在《终极问题》（哈佛商业出版社，2006 年）一书中，弗雷德·赖克海尔德研究了最能预测业务增长潜力的客户满意度问题。他的研究基于推荐者（会推荐产品/服务的人）和贬损者（会劝阻他人使用产品/服务的人）的反馈。这项研究的副产品之一，是发现人们不会完全诚实地填写调查问卷。\n\
  \n基本而言，赖克海尔德发现，在 10 分量表的问题中，`6`分并非真正的中立值。大多数对受评产品或服务持中立态度的人，实际给出了 7 分或 8 分，尽管这档分值明确标注为比中立更具好感。\n\
  \n我相信这种情况在 5 分量表中同样存在。大多数客户若对产品或服务感受矛盾，并不想打`3`分。我们来看一个简单的转换表，如表 14-1 所示，我认为这个表更接近大多数客户满意度调查受访者的真实情况。\n\
  \n![图片](img/t1401.jpg)\n\n我发现，除非受访者确实对服务感到愤怒，否则他不会给`1`分。因此，2 分成了非常不满（接近愤怒但未及）者的选择。3\
  \ 分由那些并不满意，但又不愿明确表达的客户给出。4 分来自勉强满意或无所谓的客户。而 5 分则来自相当满意的客户。\n\n如果你将所有 3 分都视为中立回答，可能会忽略大批不满意的客户。\n\
  \n那么，究竟什么指标才算是事实？尤其是在我们对指标的定义中——它由多个数据、测量值、信息，有时甚至包含其他指标构成。在这个层面上，变量足够多，使得任何答案都远称不上\"\
  事实\"。那么，在最底层呢？比如数据本身？难道数据也不可信赖为事实吗？\n\n不。科学家们不断发现，昨天还被认为是科学事实的东西，今天就被彻底推翻了。自动化数据采集系统很容易校准失误，提供错误数据（我的浴室秤就是铁证）。当我们将人为因素纳入考量时，出错的可能性只会增加。\n\
  \n技术固然伟大；随着技术进步，数据的准确性也在提高。但即便运用当前技术，至关重要的是：切勿将指标视为事实。当你赋予指标超出其应得的权重或意义时，便冒了仅凭数据做决策的风险。\n\
  \n虽然底层信息绝不应被视为完全客观事实或无懈可击，但这不应阻碍你正确使用指标。不过，希望这些认知能引导你按照指标应有的用途来使用它们——即作为支持决策的*指示器*。\n\
  \n指标永远不应取代常识或个人参与。\n\n\n\n### 被误用的指标：“客户讨厌我们”\n\n让我举一个现实中的例子，说明一位经理善意使用指标如何弊大于利。一群辛勤工作的员工被告知，他们被客户群体所厌恶。至少，这是他们对老板分享的信息的理解。\n\
  \n每两周，CEO 会与各部门负责人开会。在会议的前 30 分钟，他们会审查整个组织内所有评分为 1 分或 2 分（满分 5 分）的客户满意度评价。这些评分被标记为“非常不满意”和“不满意”。\n\
  \n实际上，这个流程所展示的仅仅是选择 1 分或 2 分评价的受访者数量。除此之外，我们了解的信息非常有限。\n\n每条评价附带的评论（如果有的话）也会被仔细审查。根据这些评论，大多数客户显然很不高兴，但偶尔也能明显看出是受访者选错了评分。\n\
  \n在逐一查看每个案例后，我很清楚，大多数客户只有在生气时才会给出 1 分，并且他们总是会借此机会写一篇长评论，解释他们为什么不满。\n\n在各部门负责人审查完\
  \ 1 分和 2 分的调查问卷后，如果时间允许，他们还会查看 3 分的评价，因为其附带的评论通常表明存在一定程度的不满，并指出了可以改进的领域。\n\n这种审查是出于好意。毕竟，公司领导层是在倾听客户的声音。这就是他们实施调查并审查负面反馈的原因。\n\
  \n对于每份问卷反馈，都需要解释以下几点：\n\n-   给出低分的原因。如果客户的评论不清楚（或者没有评论），应由员工联系客户进行澄清。\n-   为“纠正问题”而对客户采取了什么措施。\n\
  -   本可以做些什么来避免低分。（更好的表述是：“我们本可以做些什么来防止客户不满？”措辞上的细微差别很重要。如果我们将改进与指标挂钩，而非与行为或流程挂钩，我们就有可能在不改变行为或流程的情况下改善数据。）\n\
  \n不幸的是，最后一点——如何改进才能让客户将来不再不满意——在这些会议上很少得到关注。然而，这并不罕见。我见过领导层要求解释客户不满的原因，但目标应该是改进流程以消除重复事件。\n\
  \n所以，部门负责人做了你可能预料到的事。他们在会议前就仔细审查了调查结果。他们确定了哪些团队是收到 1 分、2 分和 3 分评价的对象。他们责成这些团队（通过他们的经理）去：\n\
  \n1.  联系客户，确定问题的性质。\n2.  解释差评的原因。\n3.  解释他们将采取什么措施来避免再次得到这样的评分（是的——此时经理已经误用了这个指标）。\n\
  \n员工听到的是：\n\n1.  联系客户，看看是否能安抚他们。\n2.  找出谁该负责。\n3.  如果你无法安抚他们，而且责任在你，你打算怎么做？\n\n\
  但让我们回到对团队的影响上。他们从领导层那里听到的只有：调查问卷对他们提出了严厉批评——客户显然讨厌他们。由于领导层只分享了低分调查，团队便认为他们从未获得过高的客户满意度评分。\n\
  \n有趣的是，所有调查结果都对团队开放，但团队中从未有人想过要自己去查看这些调查。\n\n你说的，不一定就是别人听到的。\n\n由于在处理客户满意度指标时犯了以下错误，团队认为自己成了组织的“害群之马”：\n\
  \n-   CEO 和部门负责人（无意中）要求对每一条差评给出解释。\n-   经理将这个要求转达给了团队，却没有考虑这会对他们产生什么影响。\n-   经理从未费心去查看自己团队的调查结果。\n\
  -   团队除了安抚老板之外，也从未想过将调查结果用于其他任何目的。\n\n那么，底线是什么？这些数据只被高层管理用来确保面向客户的服务质量。而当进一步索取信息的请求下达到基层时（这本身是件好事），调查结果却被“断章取义”（团队认为客户讨厌他们），而且没有人分享或查看任何正面的对照数据。\n\
  \n这种无意的行为造成了压力、士气低落，以及对客户对团队满意度的错误认知。\n\n在这种互动持续了一年多之后，我受命为我们组织的关键服务制定一份记分卡。该团队的服务是我们的核心服务之一，因此我去拜访他们以制定他们的记分卡。\n\
  \n当我提议将客户满意度纳入记分卡时，我遇到了意想不到的阻力。我并不知道他们每两个月都在经历着什么。\n\n我知道客户满意度评分在整个组织中一直是一大优势，而且我确信这项服务也不会例外。但团队却同样确信评分会非常糟糕。他们还辩称，由于每份客户满意度调查问卷都是发给那些有问题的客户的（因此他们才需要提供二级支持），结果会对他们不利。\n\
  \n我再次试图向他们保证，这在组织内并不正常。同样，基于他们的观察和经验，他们也再次向我保证，结果肯定会很难看。\n\n在我与指标打交道的工作中，最精彩的时刻之一，就是当我向这个团队展示客户满意度的完整数据时。结果发现，非常满意的客户与给出低分客户的比例远高于团队的想象。事实上，该团队的客户满意度评分始终保持着十比一的良好服务比率！\n\
  \n虽然团队、他们的经理和我都对这一结果感到非常高兴，但这对我们所有人来说都是一个启示：这样一个看似合乎逻辑的指标使用方式，竟然会造成如此大的伤害。\n\n对团队士气的损害足以让我确信，对待指标必须极其谨慎。\n\
  \n### 指标的误用：好的、坏的和丑陋的\n\n尊重指标的力量。这种尊重应包含一种健康的敬畏。在处理指标时，怀有一点点健康的敬畏之心，我希望各级用户都能在让指标影响自己的决策时多加小心。\n\
  \n请放心，如果使用不当，指标会严重危及组织的健康。不尊重指标的力量常常导致我们在使用它们时犯错。这些错误表现为各种形式的滥用。\n\n\n\n"
- "# 好的方面\n\n以下对指标的滥用被归类为“好”，并非因为它们可以接受，而仅仅是因为滥用者缺乏恶意，他们只是无意中误用了指标，而非蓄意造成破坏。有时，这是由于傲慢；另一些时候则是出于无知。无论哪种情况，增加一点健康的尊重都能解决这个问题。\n\
  \n-   *只分享部分故事*。值得注意的是，在花费时间和精力构建了一个完整的故事之后，人们仍然会错误地只分享部分内容。这似乎有违常理。每当你选择性地分享指标的某些部分，而非完整的故事时，你就扭曲了信息。不要因为仅仅不分享完整的故事而造成错误信息。\n\
  -   *根本不分享故事*。同样，为什么要费尽心思构建一个完整的故事，却把结果藏起来呢？你不仅需要与客户（那些可以且应该使用指标的人）分享指标，还应该与那些为你提供数据的人分享。并非所有使用指标的人都是数据的提供者，但所有数据的提供者都应该是使用者。\n\
  \n    我看到的另一种表现形式是，人们根本不愿意构建指标。这源于对指标将揭示什么的恐惧。大多数时候，我听到的是“数据无效”或“我们无法获取数据”。基本上，这些都是旨在扼杀指标（在其被创建之前）的借口。\n\
  \n-   *只分享好的指标*。不展示所有指标的最常见原因是，在某些人看来，指标中的某些内容会让其他人看起来很难堪。当然，如果你正确使用指标，它们是用于改进的指示器。如果你只有好的结果，那你还需要改进什么？不愿意展示不利结果，恰恰忽略了指标的真正意义。为了改进，你需要知道哪些地方需要改进。为了展示进展，你需要能够展示改进。只展示“好结果”，就是剥夺了他人获取有助于改进所需的信息。\n\
  -   *只分享坏的指标*。有时，人们会有意只分享负面结果。例如，当一位经理想要“激励”他的员工时，他可能会选择把情况描绘得比实际更糟一些。我们不会深入探讨更险恶的指标滥用行为——这部分留给你自己去想象。简而言之，另一种数据滥用方式是只揭示负面结果。\n\
  -   *展示数据*。还记得数据、度量、信息和指标之间的区别吗？展示数据（或度量）意味着你将观看者的注意力从故事上转移开。这就像展示用过的调色板而不是画作本身。当你展示数据（而不是指标）时，你邀请观看者自行进行分析并形成他们自己的故事。\n\
  \n你可能已经注意到这些“好”的指标滥用案例有一个共同主题。大多数源于没有展示完整的故事。这也支持了为什么使用根本性问题并构建完整的故事如此重要。\n\n"
- "# 坏的方面\n\n与无意的指标滥用相反，“坏”的方面描述的是知情情况下的滥用。你可能会认为这是罕见的情况。你希望那些接收指标的人不会明知故犯地滥用它们。但有些人并不尊重指标所具有的破坏性力量；他们随意地挥舞它，最终造成严重的损害。这些类型的滥用如下：\n\
  \n-   *利用指标谋取私利*。看到指标后，有些人会决定利用指标来推动自己的目标。也有些人可能纯粹是为了实现个人议程而指派创建指标的任务。这些人很容易被识别出来。他们拒绝与你合作以确定根本问题，要么是因为对渴望特定答案的意图毫不掩饰而感到尴尬，要么是因为在能证明自己的观点之前不愿分享。这些人会找各种借口来避免触及根本。如果你试图正确地使用指标，你会对这种滥用者感到极度沮丧。\n\
  -   *利用指标控制他人*。有一群专业人士以开发、分析和报告“绩效指标”为生，这些指标专门设计用来衡量人们的表现水平。你也可以使用绩效指标来评估流程、系统，甚至硬件。根据在线社区网站的讨论，一个普遍持有的观点是，绩效指标是操纵人们行为的良好工具。这是不可接受的。“控制”或“操纵”这些词可能没有被明确使用，但通过说“你可以并且应该使用指标来推动绩效”，这就是其含义。\n\
  -   *利用指标做决策*。我理解管理层想要指标（他们称之为数据）作为决策的基础，以便做出“知情”的决策。我并不是说这是坏事。只有当领导层认为指标就是事实时，它才变成坏事。当决策仅仅根据指标结果做出时，这就成了问题。指标可以用来为决策提供信息，但前提是它们经过了调查和验证。如果你要基于指标做决策，只知道“是什么”（指标）是不够的；你还必须弄明白“为什么”。\n\
  \n    当我的油表显示快没油时，我会决定是马上去加油，还是再等一会儿。这个决定对任何人来说都不是至关重要的。如果油表显示快没油了，我不立即加油也不会有什么影响。我知道油表是一个指示器，而不是事实（取决于我是在上坡还是下坡，读数会变化）。我也知道它可能有错误；如果我刚加满油，它却显示没油，那肯定是出了别的问题。归根结底呢？我使用数据、度量、信息和指标来*为*我的决策*提供信息*，而不是让它们*直接做出*决策。\n\
  \n-   *利用指标赢得争论或影响观点*。这可能是最常见的指标滥用。我们在政治中看到它。我们在辩论中看到它。我们在会议室里争夺资金的战线上看到它。问题不在于你用指标来证明你的观点，而在于你只使用支持你论点的数据——而忽略了其余部分。这是一种严重的滥用。\n\
  \n你可能已经注意到，这些“坏”的滥用大多基于它们“如何”被使用——即报告背后的意图。如果你的意图是坏的（自私、操纵、控制或懒惰），你最终会滥用信息。负面的意图驱使你以最糟糕的方式滥用指标。\n\
  \n"
- "# 丑陋的方面\n\n如果“好”的方面是非恶意意图的结果，那么“丑陋的方面”则是恶意意图的直接结果。我不会在这方面花费太多时间，因为那些有意滥用指标的人可能根本不会读这本书。\n\
  \n我之所以讨论这一点，只是为了提醒你，有些人会故意使用指标来造成伤害。\n\n所以，你必须尊重指标的力量。你不仅要确保自己谨慎使用它们，还必须保护他人免受其危害。这是你需要与数据提供者建立信任的一部分。仅仅因为你永远不会故意使用指标来伤害他人，并不代表别人不会。当你承担起收集、分析和报告指标的责任时，你也有责任保护他人。\n\
  \n需要持续警惕以确保指标得到恰当使用。\n\n\n\n### 意外后果的艺术\n\n除了讲述错误故事及其所有意外后果（错误决策、改进错误事项、未改进需要改进的事项等）的危险之外，滥用还会导致其他危险后果。\n\
  \n我们已经讨论过仅展示不良指标对士气的损害。除了打击员工士气之外，你还面临创造、延续或加剧以下问题的风险：\n\n-   对指标被滥用的恐惧\n-   对误用和滥用的愤怒\n\
  -   对做什么或将要做什么的不确定性\n-   对指标有效性的怀疑\n-   对收集、分析和报告指标者的不信任\n-   回避可能正面或负面影响指标的活动\n\
  -   不愿参与未来的改进工作\n\n以上每一点都值得讨论，但首先重要的是要意识到我们谈论的对象是谁——那些提供数据的人，以及那些觉得数据与自己相关的人。请注意我说的是数据。无论指标是汇总数据还是讲述一个更大的故事，如果提供数据的人认为数据可能被误用或滥用，他们就不会关心你对该指标的计划。这些对指标的反应是合理的。恐惧、不确定性、怀疑、愤怒、不信任和回避，这些都是无法忽视或争辩的情绪。\n\
  \n对数据误用的情绪反应不可忽视。\n\n让我们更深入地探讨。\n\n-   **对指标及其滥用的恐惧。** 指标是危险的，可能弊大于利。在你收集第一个数据点之前，员工就可能害怕指标的误用和滥用。即使你做对了所有事情——展示了数据将如何被使用（用于讲述完整的故事，进而用于改进流程）以及将如何不被使用（用于惩罚或控制员工）——恐惧可能依然存在。恐惧你不会履行承诺，或改变你对指标使用方式的看法。恐惧其他人会接触到数据并加以误用或滥用。这种恐惧是真实且合理的。你的任务是找到建立足够信任来克服它的方法。简而言之，你将通过解释你将如何使用以及不会如何使用指标，并信守这些承诺来建立信任。\n\
  -   **对做什么或将要做什么的不确定性。** 当为你的指标提供信息的人不确定信息将如何被使用（或者是否会被使用）时，他们可能会犹豫是否提供数据。不确定性会导致许多其他潜在问题，例如最终对你信息的准确性产生怀疑。\n\
  -   **对指标有效性的怀疑。** 有些人并非真正怀疑指标的有效性，而是决定质疑数据的有效性，这样他们就不必处理这些指标了。如果指标无效，那么他们就可以忽略它们。如果指标被证明无效或不准确，那么指标本应产生的力量也就丧失了。\n\
  -   **对误用和滥用的愤怒。** 在我看来，这是比恐惧或不确定性更好的对误用的反应。愤怒表明了一定程度的关注和参与，这是迈向改进的良好基础。然而，愤怒也通常会引发防御性反应，并有可能激发出他人最坏的一面。领导层可能想惩罚那些表现出愤怒的人，或将他们标记为“不满分子”、非团队成员或“破坏分子”。与其简单地谴责那些以愤怒回应的人，他们的热情至少应该得到欣赏。热情、参与和自我激励是无法教授或灌输的。\n\
  -   **对收集、分析和报告指标者的不信任。** 当我们发现不信任时，这是一个比愤怒更深层次的问题。不信任需要付出巨大努力才能克服。整体上的不信任不容易解决，但关于指标使用的不信任是可以解决的。如果你能在这个过程中建立信任，那么也许你可以以此为基础来改善整体信任。建立信任需要坚定不移地坚守原则——仅以你承诺的方式使用指标，并且绝不使用你承诺不会使用的方式。\n\
  -   **回避可能正面或负面影响指标的活动。** 恐惧、不确定性、怀疑、愤怒和/或不信任可能导致对你的指标工作的消极抵抗。最简单的抵抗形式就是回避任何与指标相关的事情——避免参与指标的识别、收集、分析或报告。这种回避除非你需要其参与，否则甚至可能不会被注意到。同样，你必须主动处理这个问题。如果你希望项目成功，处理消极抵抗与处理更明显的行为同等重要。\n\
  -   **不愿参与未来的改进工作。** 在处理指标或任何组织改进工作时，这种后果常常被忽视。当你滥用赋予你的权力时，最简单的反驳方式就是抵制未来的改进工作。即使是无意的，如果之前的方法处理不当，也很难再支持另一种改进工作或技术。\n\
  \n这些意外后果并非必然发生——只要你小心谨慎并尊重指标的力量。\n\n### 总结\n\n指标是一个强大的工具——与大多数强大工具一样，它们可能造成严重损害。你必须采取预防措施，使用适当的安全设备，最终你*必须*尊重这种力量。\n\
  \n经验法则如下：\n\n-   指标可能弊大于利。\n-   指标绝不能取代常识或个人参与。\n-   指标不是事实，是指示器。\n-   你所说的可能并非他人所听到的。\n\
  -   滥用指标造成的损害会伤害组织中的每个人。\n-   需要持续警惕以确保指标被正确使用。\n\n我们涵盖了以下内容：\n\n-   **指标的力量。**\
  \ 即使是无关紧要的指标误用也可能造成损害，例如团队士气低落。如果关于指标误用或滥用的消息在你的组织内传播，将会造成无法弥补的损害。\n-   **指标的误用：好的、坏的和丑陋的。**\
  \ 这些包括：\n    -   只分享部分故事\n    -   完全不分享故事\n    -   只分享好的指标\n    -   只分享坏的指标\n  \
  \  -   展示原始数据\n    -   将指标用于个人目的\n    -   利用指标控制他人\n    -   利用指标做决策\n    -   利用指标赢得争论或影响观点\n\
  -   **意外后果的艺术。** 误用指标可能导致的几类主要后果如下：\n    -   对指标及其滥用的恐惧\n    -   对做什么或将要做什么的不确定性\n\
  \    -   对指标有效性的怀疑\n    -   对误用和滥用的愤怒\n    -   对报告、分析和报告指标者的不信任\n    -   回避可能正面或负面影响指标的活动\n\
  \n## 结论\n\n尊重指标的力量，实质上意味着要谨慎，并对指标可能造成的伤害保持一定的警惕。这种恐惧不应使你瘫痪；相反，它应激励你小心谨慎地处理指标。戴上你的安全装备，采取预防措施，并确保他人远离伤害。\n\
  \n![图片](img/ch15.jpg)\n\n\n\n"
- "# 避免研究陷阱\n\n首先谈谈我对研究的看法。我这里所说的研究，并非指你为确定根本需求而进行的重点明确、方向清晰的调查，也不是指我们在数据中发现异常后所做的进一步探究，更不是指你在为已设计好的具体指标寻找数据、度量、信息、标准或基准时应进行的深入挖掘。\n\
  \n我所说的研究，指的是对信息无明确方向的探索。\n\n这类研究可以细分为许多不同类别，包括科学方法与历史方法；定性研究与定量研究视角；探索性研究、建构性研究与实证研究；一手研究与二手研究；以及其他诸多类型。所有这些类型的研究都具有以下共同点：\n\
  \n- 成本高昂\n- 耗时漫长\n- 投入巨大\n- 适用性未知\n\n政府及其他研究资助机构发现，资助多个领域的研究颇有裨益，期望从中获取的一定比例的分析能带来突破。许多时候，由此产生的创新或见解都出现在与原初意图完全无关的领域。尼龙搭扣和微波炉就是例证。我们的许多新技术都源于军事研究，最终却用于非战斗相关领域。研究是为老问题提供新视角的绝佳手段，有时还能揭示原本会被忽略的新问题。研究是人类进步与未来的重要组成部分。\n\
  \n研究对于寻求信息以改进业务的企业来说，也是一个强大的工具。在《首先，打破一切常规》（马库斯·白金汉与库尔特·科夫曼著，西蒙与舒斯特出版社，1999 年）和《从优秀到卓越》（吉姆·柯林斯著，哈珀柯林斯出版社，2001\
  \ 年）中，作者们对业务绩效提升进行了严肃的研究。柯林斯带领研究团队梳理了近 1500 家公司的业绩历史，而白金汉和科夫曼则运用了盖洛普公司 25 年研究中积累的超过\
  \ 8 万份访谈结果。作者们利用这些结果提出了组织发展的概念和理论。他们的想法源于研究，许多企业也从中获益。\n\n但这种光环效应让一些人认为，他们也应该开展研究，或者至少遵循研究所用的原则。仅仅因为研究被很好地运用过，并不意味着一家企业就应该尝试复制这些努力，尤其是在实际应用方面。\n\
  \n不要忽视或忘记所有失败的创新尝试、所有被证明无用的研究，以及所有将研究人员引向错误方向的结果，这一点至关重要。\n\n许多领导者利用他人成功的范例来推动自己尝试新想法。他们珍视诸如《追求卓越》（汤姆·彼得斯与罗伯特·沃特曼著，华纳图书出版社，1982\
  \ 年）这类书籍，书中充满了成功故事。\n\n大多数领导者希望看到别人正在使用的指标。他们不愿意在没有类似组织或竞争对手已获成功的情况下进行冒险——这在某种程度上确保了它们永远不会处于领先或前沿地位。这种对冒险的规避态度，在关于标杆管理的第\
  \ 13 章中有更详细的论述。\n\n研究可以是件好事。但大多数组织实际上承担不起进行无导向研究（即与产品开发无直接关系的研究）的代价。这并不是说研究不好——它只是在时间和费用成本上过于高昂。\n\
  \n你付得起进行无导向研究的代价吗？\n\n## 研究的成本\n\n研究涉及通过访谈、调查、观察、实验、文档记录和工具手段来收集数据。研究需要大量时间来收集数据；不仅需要研究人员的时间，还需要提供信息者的时间。实验需要时间，尤其是当你需要考虑对照组和双盲技术时。\n\
  \n你承担不起在没有目的的情况下创建指标的代价。你承担不起在没有方向的情况下收集数据、创建度量指标和汇编信息的代价。你也承担不起构建一个框架，然后指望日后有人来填充或使用它的代价。\n\
  \n所以你可能会想：“但我从没想做研究，而且我怀疑我的公司也永远不会想做研究！”\n\n尽管你可能不想做，但我向你保证，你最终还是会去做研究。\n\n如果你在没有根本问题的情况下收集、分析和报告数据，那么你就是在进行无导向研究。\n\
  \n## 伪装的研究\n\n善意的管理层分配给度量分析师的一项常见任务，是找出一些“有趣”的数据。基本上，这位领导者是承认自己不知道想要什么，但愿意让你花时间和精力去尝试找出一些他喜欢的东西。就像波特·斯图尔特大法官关于色情作品的论断一样，他看到了就能认出来。\n\
  \n管理层错误地认为，他们想要的正确指标，只需通过一点试错就能被揭示出来。如果你只是收集足够多的信息，管理层就能分辨出糟粕与精华。\n\n为了满足“出去找一些有用且有趣的度量指标”这个要求，你可以：\n\
  \n- 审视现有产品\n- 阅读关于你所在行业及其相关流程的书籍\n- 向众多行业专家询问他们的观点和经验\n- 研究流程是如何执行的\n- 从许多可用的研究工具（在线数据库、搜索引擎、索引和出版物）中进行选择\n\
  \n没错，你正在进行研究。所以，尽管我同意我们没有人会想在日常工作中进行（或期望进行）研究，但我们最终都还是这样做了。\n\n驱向根本需求至关重要。当你面对那个要求你进行伪装研究的模糊指令时，你必须予以回击。你可能需要以适合你所在组织的方式来回击，但无论如何你必须回击。最好的方法就是谨慎使用“五个为什么”。与其去寻找那些你尚未明确的问题的难以捉摸的答案，不如把精力花在“研究”根本问题上。\n\
  \n大多数组织（包括我工作过的所有组织）都承担不起进行广泛研究，然后处理和利用海量数据的代价。这根本不划算。我们大多数人没有时间或资源去从事无导向研究。\n\n\
  即使我们试图利用外部来源的研究成果，很多时候结果也不尽如人意。我很少能找到恰好符合我所在组织正在处理的特定根本问题的研究数据。\n\n\n\n#### 你是否已然陷入困境？\n\
  \n若你发现自己正在为未知的问题寻求答案，那你很可能已陷入困境。你可能会连续数月每天腾出四小时以上的时间来搜集信息。接着，你开始判断哪些数据是可用的，并从众多来源中挖掘数据。\n\
  \n技术带来的益处与问题之一便是数据的激增。当你清楚自己要寻找什么时，能将所有信息\"尽在掌握\"固然很棒；但当你不知自己要寻找什么时，堆积如山的数据便会将你淹没。\n\
  \n当你深陷困境并收集了大量数据后，将会面临分析这些数据的艰巨任务。你必须厘清如何将它们整合在一起——哪些指标相互关联，哪些则没有。\n\n当你分享辛苦工作的成果时，老板可能会告诉你，你并未切中要点（而这个要点他自己也无法描述、指出或明确）。你无从知晓究竟是数据选错了，还是你对数据的分析出了偏差。即便你跨过了这道坎，还很可能面临一个真正的风险：启发你的老板。他可能会想到其他\"\
  有趣\"的数据供你收集，而这又需要更多的搜寻。如果你找不到任何已发布的二手数据，很可能就得另寻他法来获取数据，包括进行问卷调查、焦点小组访谈、观察，或创建自动化收集工具。单是购买、学习使用或开发工具的成本，就可能极其高昂。你会意识到，这是一条代价不菲的道路——收益却在不断递减。\n\
  \n我能给出的最佳建议是：如果你发现自己在一个坑里，就请停止挖掘。相反，要努力爬出这个坑——最好是向你的经理寻求一点帮助。我通常先请他停止往我头上铲土，然后请他拉我一把，帮我爬出来。这种帮助应体现在他愿意着手解决根本需求上。问题在于，你必须说服老板，让他明白你确实需要他的帮助，需要他付出一些时间和精力。\n\
  \n请老板帮你爬出这个坑（先让他停止往你头上铲土之后）。\n\n##### 停止挖掘\n\n> *\"我们需要三个关键指标。\"老板把我叫进办公室，给我做了一番强有力的动员。*\n\
  > \n> *\"三个？\"我惊叹于有多少组织发展事务都跟数字三有关。三个目标。三项流程改进建议。三个指标。*\n> \n> *\"没错。但如果你能想出四五个，那也行。\"\
  *\n> \n> *\"嗯哼。\"*\n> \n> *\"应该不太难。我们跟一家咨询机构签了合同，他们手头有大量 IT 服务的数据。\"我知道这回事，但并未在他们的数据库里看到多少有用的数据、衡量指标或信息。*\n\
  > \n> *\"您具体想要什么信息？\"我努力不让自己感到沮丧。*\n> \n> *\"你想到什么都可以。就用他们现有的数据作为基准……\"*\n> \n>\
  \ *\"然后找出三个，对吧？\"*\n> \n> *\"没错！\"我能看出他对自己的明确指示很满意。*\n\n我照做了（我总得保住饭碗）。我查看了那家咨询公司的数据，心中没有任何具体问题，试图找到三个可以用作基准的指标。不幸的是，他们的数据与我们的问题领域毫无关联。我们有一些特定领域需要改进。这些问题并非独一无二，但也不是那家咨询公司之前研究过的课题。他们研究的是大致的兴趣领域，却并非我们遇到麻烦的领域。我最终找到的三个指标——服务器可用性、呼叫放弃率以及客户满意度比率——其定义方式与我们自己的定义也大相径庭。\n\
  \n例如，他们以每天 24 小时、每周 7 天为基础来定义可用性——而我们在低使用率时段安排了计划内停机（我们的客户并不期待全天候的可用性）。\n\n呼叫放弃率并未考虑来电者挂断前的时间。我们总是有一段在技术人员接听前必须听完的语音留言。这段留言每天至少更新一次，告知来电者当前存在的问题。例如，如果我们当前存在电子邮件问题，留言可能会说：\"\
  我们正遇到电子邮件连接问题；预计下午 1:00 前解决。\"如果来电的目的就是为了告知我们这个情况，那么他可以在确信我们已知晓并正在处理该问题后挂断电话。在我们看来，这类通话不应被计为放弃。该研究并未区分来电者挂断前在线上停留的时长，因此它与我们的实际情况并不相符。\n\
  \n客户满意度衡量方面的脱节也很明显。该咨询公司的研究采用 4 点量表；而我们过去三年一直使用 5 点量表。他们的问题内容也与我们的不完全匹配。最后，他们给\"\
  非常满意\"赋值为\"1\"，给\"非常不满意\"赋值为\"4\"。我们使用的量表方向正好相反。\n\n在一番强行对比数据的努力下，老板还是让我使用了那些数据，尽管并不完全匹配。他会说：\"\
  可能不是'苹果机'对'苹果机'，但好歹还是'苹果'对'苹果'嘛。\"\n\n找到一仓库数据，可能会误导你去生搬硬套，让你的问题去迎合现有的答案。\n\n要停止这种疯狂行为，你需要向老板承认，你做不到他要求的事。你无法完成这项调研，因为你没有时间、技能或精力去追逐未知。相反，你需要他的帮助。你需要他帮你指明努力方向，让你能更高效、更有成果。你需要他帮你确保你的工作富有成效。\n\
  \n#### 调研有何问题？\n\n你本应先形成自己的问题，然后再通过现有调研或标准来寻找答案。当然，如果你在提出问题时遇到困难，回顾现有的调研数据或许能帮到你，但也可能将你引向更深的迷途。主要风险在于，你可能会满足于现有的数据，而非你真正需要的数据。以下是使用他人调研时需考虑的几点注意事项：\n\
  \n1.  调研数据可能无法完全契合你的需求。正如我老板所说，你可能遇到的是\"苹果\"对\"苹果\"，但你的可能是\"红元帅\"，而我的却是\"澳洲青苹\"\
  。即便你可以使用他人的数据进行对比，也必须指出哪些地方与你的情况不符。\n2.  当你有海量数据可供选择时，很容易跳过问题确定阶段。你最终只是根据现有数据拼凑图像，而不是确定恰当的问题。\n\
  3.  比完全跳过问题更糟的是，当你手握调研结果时，可能会被迫创造问题来迎合指标中的答案。这几乎不可能说服管理层重新评估他们的需求。\n4.  调研数据仍然仅仅是指标，并非真理。发生在类似机构身上的事，并不意味着你的组织也会如此。（我看\
  \ NBA 季后赛时，解说员在讨论从研究人员那里搜集来的众多统计数据之一：\"在七场四胜制的季后赛中，丢掉前两场的球队，最终输掉系列赛的概率超过 80%。\"\
  这或许准确，但并不意味着这支已经输了两场的特定球队就有 80%的几率输掉这轮系列赛。）\n5.  调研并不便宜。虽然技术使数据收集比过去容易得多，但成本依然高昂。监控软件和硬件可能价格不菲。使用人力来分析和报告数据则始终代价高昂。\n\
  \n尽管我强烈反对进行探索性调研，但我完全支持你充分利用那些有时间、资源和意愿去做这件事的人。\n\n\n\n### 回顾\n\n以下几点值得强调：\n\n-\
  \   不要忽视定义自己的问题，因为有人可能会直接给你现成的答案。不要让现有研究模糊你的焦点，阻碍你提出正确的问题。借用他人的研究结果、而不先做好确定自身需求的前期工作，这种诱惑确实存在。\n\
  -   不要让现有研究将你推向一个方向，为了获得可对比的数据而牺牲对自身情况有意义的指标。\n-   不要让他人用模糊的“有趣”来左右你的衡量标准。学会对那些“我觉得这可能会很有趣……”的请求说“不”。\n\
  -   不要依赖他人来替你提出问题——只有你自己才真正了解自己的需求。\n-   不要赋予汇总数据比你自己指标更高的权重。\n\n你可能已经注意到，以上这些告诫都源于制定指标的核心方法——首先要找到根本问题。无导向研究最大的问题往往在于缺乏有意义的问题。如果研究是由独立实体进行的，那么问题通常比较笼统，因此对大多数人来说也就毫无意义。\n\
  \n举个例子，关于单亲家庭子女高中毕业率的研究。这个“有趣”的指标或许能从政府那里获得一笔可观的资助，但这些信息对你所在的地方高中有多大用处呢？除了能说“X 高中单亲家庭学生的毕业率比\
  \ Y 高中高”之外，这些数据还有多大价值？如果数据显示，单亲家庭孩子的毕业率低于双亲家庭孩子，学校是否会因为这些孩子风险更高而区别对待他们？这些数据或许能用来争论单亲养育的弊端，或者为这些家庭争取更多支持。但关键在于，虽然这项研究很有趣，或许也值得资助，但对地方学校来说用处并不大。它有用，但并非用在教育“最关键”的地方。\n\
  \n至少这个例子中的研究还有其目的（尽管很模糊）。而你的组织更可能参与的另一种研究，则问题要大得多。你组织进行的研究，不仅同样缺乏有意义的问题（通常未经深思熟虑或规划，仅仅是因为有人觉得“这可能会很有趣”），而且还会浪费*你的*资源！因此，除非你拥有无限的资源（包括时间），我强烈建议不要收集、分析或报告任何不能回答特定且有意义问题的数据。\n\
  \n## 结论\n\n研究在帮助我们寻找答案方面潜力巨大。关键在于要记住，第三方进行的研究很少能直接（或完全）回答你的问题。你当然应该利用他人的研究成果，但前提是你要先明确自己的问题。\n\
  \n另一个需要记住的要点是：你很可能没有资源去进行无导向的研究（把这类研究留给那些能获得资助的人或专业研究机构吧）。这听起来似乎不难，但当你被指派去寻找“有趣”的数据时，你可能会发现自己正落入研究的陷阱。要警惕这些伪装成任务的“研究”。\n\
  \n你也可能在不知不觉中，自愿地进行无导向的研究。让我们回到起点（我最喜欢开始的地方），找出根本需求。手握根本问题，以终为始地设计你的指标。避开研究的陷阱，明智地利用你的时间。\n\
  \n![images](img/ch16.jpg)\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n"
- "# 拥抱你组织的独特性\n\n> *王子不知该如何解释。那是一见钟情。她俘获了他的全部身心。然后她溜走了，只留下了她的水晶鞋。*\n>\n> *“我必须找到她，”王子说。“她就是那个人。有她在我身边，我无所不能，可以成为任何人。”*\n\
  >\n> *“但是，陛下，”大臣回答道，“她只是个平民。她一个人怎么能让您超越现在的自己呢？”*\n>\n> *“我无法解释，但我知道这会发生。她会让我变得更好。”*\n\
  >\n> *于是，王子派国王的大臣去全国各地搜寻那个偷走他心的神秘女孩。大臣挨家挨户地走，让每个适婚女子试穿那只水晶鞋。*\n>\n> *结果，每只脚都穿得上。*\n\
  >\n> *大臣不知所措。于是，他做了他父亲一直告诫他的事：“心存疑虑时，遵从命令。”他把每一位少女都带回了城堡。*\n>\n> *“陛下，”他说，“我把能穿上这只鞋的女子都带来了。”*\n\
  >\n> *“女子们？”王子瞪大了眼睛看着他。*\n>\n> *“是的，陛下。”*\n>\n> *“有多少个？”*\n>\n> *“所有。”*\n>\n> *“真幽默，”王子说。“‘所有’是几个？”*\n\
  >\n> *“不，陛下。我没有开玩笑。我把她们都带来了。王国里所有适婚的少女都能穿上这只鞋。”*\n>\n> *“这怎么可能？”*\n>\n> *大臣斟酌着措辞。“我相信这叫做‘均码’。”*\n\
  >\n> *“那它还有什么用呢？”王子疑惑道。*\n>\n> *“呃，这是我们仅有的鞋型。”*\n>\n> *“确实，”王子说。*\n>\n> *于是，王子变得沮丧，最终在王国里禁止了所有“均码”的服饰。这让王国的裁缝们非常高兴，但制造业工会却组织了一场革命。他们把鞋子、袜子和\
  \ T 恤衫改造成武器。他们轻而易举地推翻了君主制，建立了一个自由开放的市场。*\n\n尽管王子明白了，一个用于衡量事物的“均码”工具可能毫无意义，但仍有许多人在寻求这种工具。他们想要一个“均码”的度量标准。如果你读到了这里，你应该明白，他人的度量标准对你来说是唯一有意义的，前提是你们有相同的根本问题。即便如此，为了让数据、度量或信息有意义，你也需要以相同的方式定义其组成部分。\n\
  \n只有当你与他人有相同的根本问题时，他人的度量标准才对你有用。\n\n你的组织具有独特性，这本身并没有错。组织，就像人一样，应该拥抱自己的独特性，而不是试图让一切变成“均码”的努力。这种为问题寻找单一解决方案的癖好，实际上引发的问题比它解决的还多。如果你在设计一个像新型节能灯泡这样的产品，你当然希望它能适配大多数（如果不是全部）灯具。但组织是一个复杂的生命体，它需要解答的问题将和我们每个人在生活中面临的问题一样独特。\n\
  \n为你的问题强加一个“均码”的解决方案，实际上引发的问题比它解决的还多。\n\n你可能会争辩说，我们实际上并不独特，我们的共同点远多于不同点。你可能会争辩说，人，以及由人组成组织，他们面临的问题更多是相似而非不同。虽然有足够多的变量确保我们的问题不完全相同，但其根本原因和根本问题却是非常普遍的。\n\
  \n我不得不同意这种观点。\n\n不幸的是，这种共性并无帮助。它实际上会导致我们误入歧途。\n\n当你开始一个度量计划时，很多人会挑战你，让你“不要重复发明轮子”。你会被鼓励去访问像你这样的其他组织，在网上搜索信息，并寻找现有的成功案例来效仿。你将被期望利用他人的工作成果。你将被期望快速产出，因为你无需从零开始。\n\
  \n这会引起问题，因为这种期望——即你可以使用其他组织的度量标准——会让你更难找到自己组织的根本问题。这是有道理的。如果真的有“均码”的度量标准，或者至少有现成的度量标准你可以“借来用”，那么：\n\
  \n-   你就可以使用别人的根本问题，并且\n    -   你不需要征求需求或收集输入\n        -   无需焦点小组\n        -   无需访谈\n\
  \        -   无需问卷调查\n    -   你不需要将根本问题分解成各个组成部分，以确保理解并到达了真正的根本需求\n        -   无需“五个为什么”\n\
  \    -   无需引导\n    -   无需咨询\n-   你可以使用现有的度量开发计划。实际上，你根本不需要开发计划，因为你不需要开发任何度量标准。你只需要使用别人已经创建并记录好的度量标准。\n\
  -   你不需要麻烦领导层、管理层或员工来制定你的度量计划。\n\n当然，你*仍然*需要有相同的收集、分析和报告工具。你还需要有（完全）相同的流程和程序。你还需要提供/交付同样的服务和产品。你必须拥有影响你组织的相同环境因素。当然，这几乎是不可能的。\n\
  \n你的组织*是*独特的。*你是*独特的。你必须拥抱你的独特性才能成功。\n\n你必须拥抱你的独特性才能成功。\n\n我的意思不是说你不能从他人的工作中受益。但是，当领导层让你寻找“标杆”并研究你的同行/竞争对手在做什么时——其目的不是为了让你变得更明智。而是为了节省时间和金钱。是为了避免开发度量计划所需的艰苦工作。\n\
  \n没有捷径可走——那些捷径都不管用。\n\n有很多方法可以更快地完成工作。你可以找到许多捷径。你可以跳过我所提供的许多步骤。你能够（很可能也会）因为走了捷径，而从那狭窄的岩架上跌落下来。\n\
  \n在我工作的大学中心（即使不在地理中心，也在社交中心），有一个学生中心，里面有四个不同的餐厅。如果这些餐厅的经理忽视各自的独特之处，那将是荒谬的。四家不同的食品供应商能在同一栋楼里蓬勃发展（你可以去离你最近的商场看看），主要是因为它们的差异，而非它们的共同点。\n\
  \n你的组织有机会变得卓越，是因为那些让它与众不同的东西，而不是那些它与其他组织共有的东西。这些独特的因素对你的成功至关重要。它们可以是优势，也可以是劣势。第一步就是拥抱这些独特因素。它们不仅会影响你的成功，还会在你的度量计划中扮演重要角色。\n\
  \n### 问题简化\n\n当研究度量计划时（除了使用我在开发计划中提供的工具外），你必须回答五个简单的问题：`Why`、`What`、`When`、`Who`\
  \ 和 `How`。\n\n#### Why\n\n你为什么要做度量？你为什么做某个具体的度量？\n\n“Why” 引领我们找到根本问题。你的 `whys` 可能是、也应该是独一无二的。其他人不会有和你完全相同的需求。除非另一个组织与你处于同一行业、同一市场，并应对着同样的挑战，否则，即使你们的\
  \ `whys` 可能相似，也不会完全相同。\n\n\n\n#### 什么（What）\n\n你在做什么？你的目标是什么？你在衡量什么？\n\n如果你足够幸运，真的找到了另一个拥有相同“为什么”的组织，你可能仍然决定以不同的方式处理它们。如果你和同行面临相同的问题，你会如何决定解决这些问题？你会等待并照搬同行的做法吗？还是想创建自己的解决方案？即使是观察两家非常相似的企业——麦当劳和汉堡王——你也很可能发现比想象中更多的差异。我指的不是它们的配方。它们会有不同的价值观、流程、程序和政策。即使面临相同的问题，它们也有不同的解决方案。\n\
  \n#### 何时（When）\n\n你打算何时实施变革？你希望何时达成目标？\n\n你打算何时进行衡量？每月的第一天？每周的第一个工作日？在早上、下午还是晚上？\n\
  \n你会以什么频率收集、分析和报告你的指标？每天？每周？每月？每季度？你遵循的是财年、自然年还是学年历？\n\n“何时”不仅仅是界定工作范围的一种方式。它有助于你确定截止日期并集中精力。它还能让你洞察到，当你实施一个项目时，工作量和流程将如何变化。\n\
  \n#### 谁（Who）\n\n谁将主导这项工作？谁将协助？谁将参与？谁将收集数据？谁将汇编衡量指标？谁将分析信息？谁将创建指标？谁将报告指标，并向谁报告？谁将解释异常情况？谁将获得功劳？谁将承担责任？谁拥有该项目的所有权？谁有权访问，谁没有？谁将为这项工作买单？\n\
  \n如果你真的想把事情做成，“谁……”是一个关键问题。你必须知道谁是你的客户，谁是提供者，以及谁将使用这些指标。\n\n#### 如何（How）\n\n你将如何实施该计划？你将如何使用这些指标？哪些情况下你不会使用它们？你将如何改进组织？你将如何沟通你的需求？你将如何分享结果？你将如何判断指标的有效性？你将如何淘汰不再需要的指标？\n\
  \n“如何”可以简单到一张检查清单，也可以复杂到一本操作手册。你选择的文档形式将决定“如何”的规模。你选择记录和分享“如何”的方式将推动你组织的变革。\n\n\
  这些是我在你制定指标体系过程中请你思考的众多问题。我再次提醒你关注它们，是为了指出这些问题的答案很可能对你和你的组织来说是独一无二的。旨在帮助改进组织的指标意味着你将处理组织的优势与劣势。这些优势与劣势在其他组织中几乎不会以完全相同的形式存在。你必须在数千个组织中寻找输入，才能找到与你所有独特需求完全匹配的对象。当然，这还要假设有数千个像你一样的组织，已经在做指标工作，并且做得恰当，还愿意与你分享。\n\
  \n### 如果你的老板不同意怎么办？\n\n如果你的老板坚持让你去跟随别人的做法，你该怎么办？如果你无法说服他接受组织的独特性，该怎么办？我提供以下步骤清单供你参考，以此拥抱你的独特性，同时你要明白必须有所取舍，选择最适合你的做法。\n\
  \n#### 不要措手不及\n\n不要措手不及。要预料到领导会派你去做无谓的追寻。\n\n不要抗拒（抗拒是徒劳的）这个任务。相反，尝试解释你仍然需要根源问题，以确保找到好的范例或标杆。假设你遇到一个极其固执的领导，他争辩道：“如果能用别人的，为什么还要创建自己的根源问题？”\
  \ 你可以尝试解释为什么使用别人的需求而非确定自己的需求是一个糟糕的主意。或者，你可以给他一本这本书。或者，你可以直接着手研究，然后尽快搞定它。\n\n在比较或寻找范例*之前*，你需要为你的组织尽可能多地定义好一切。这包括根源问题、指标以及你需要的所有组成部分。尽可能多地完成这些工作，这样你就能清晰地把你想要的东西与你同行/竞争对手需要的东西区分开来。如果同时代的人愿意在等价交换的基础上与你分享，这也会让你有东西可以交换。\n\
  \n#### 进行研究\n\n准备好进行研究。你甚至可以用积极（充满希望！）的态度去进行！你永远不知道，也许你就是那个能证明我所有观点都错误的组织。你可能是规则中的例外。\n\
  \n首先要研究的是，找出你的同行和竞争对手，并了解他们是否有任何指标。你需要确保他们拥有的指标（如果有的话）与你需要的相关（如果你被允许做一些基础工作的话）。确定你想要寻找范例的领域。如果你成功地尽可能构建了你的发展计划，你将能更好地确定你想要比较的内容。\n\
  \n#### 应对失败\n\n如果你发现你*确实是*独特的，不要感到惊讶。或者，你认为是完美匹配的组织要么没有指标，要么不愿意分享他们拥有的东西。你很可能会领先于潮流。你的需求可能是独一无二的。如果是这样，你必须向你的领导汇报你失败了。\n\
  \n当然，你实际上并没有失败。你的任务是寻找范例。研究的一个合理结果就是，你正在研究的假设可能被证明是错误的。\n\n要意识到你的领导可能认为你失败了。虽然他们让你去查明是否存在任何现成的指标，但他们真正想要的是让你找到一个匹配项，这样……\n\
  \n*   他们就不用相信你懂得自己在做什么\n*   他们会感到安心，因为别人已经在用这些指标了\n*   这意味着每个人的工作（包括你）都会减少；成本更低，时间更短，投入更少\n\
  \n\n\n#### 面对成功\n\n我预料你找不到完全匹配的对象，而且我建议，如果你真的找到了，反而应该感到惊讶。这种情况很少见。如果你还能让那个组织愿意免费分享他们的成果和复制方法，那就要心怀感激。如果他们愿意与你合作进行基准测试，让你们双方都能从数据指标中受益，那就更要感恩了。即便这种奇迹真的发生了，也要意识到这不可能适用于所有指标。\n\
  \n即便你找到了一些可行的比较对象，也要预料到：\n\n-   这些比较并非针对所有根本性问题\n-   对方组织可能不愿意分享\n-   对方组织可能没有遵循我建议的任何严谨流程来伴随其信息（没有文档或开发计划）\n\
  \n你找到的完全匹配对象，可能对数据、度量、信息或指标的定义也不尽相同。这意味着你需要用于构建该指标的原始数据。不幸的是，这增加了对方组织不愿意分享的可能性。\n\
  \n对方组织会要求一些回报——哪怕只是看看*你的*原始数据。而你的领导层可能不愿意分享。\n\n要预料到，你领导层对你研究结果的反应并不会让你有成就感。他们很可能会断定你找到的案例并不合适，或者根本不够好（这也许是件好事——但在你找到它们并感到喜悦之后，可能会忘记我希望你拥抱自身独特性）。\n\
  \n你的领导层可能会觉得你失败了，尤其是当你拿不出什么成果来证明你的努力时。如果任务就此结束，你还能暗自庆幸。但更可能的是，你的领导层会希望你重新尝试。他们甚至可能会给你提供他们同行的联系方式。\n\
  \n另一种可能性是，他们可能会决定引入外部帮助，因为他们确信你没有找对地方、没有问对人，或者根本没理解他们的意图。\n\n#### 情况真的那么糟糕吗？\n\n\
  是的，我描绘了一幅相当黯淡的图景。我可以告诉你，根据我的经验，我其实非常现实，但我本可以用更富同情心的方式让你失望。\n\n我不同意这么做。\n\n在拥抱组织独特性的问题上，我再次觉得有必要给你“严厉的爱”，而不是描绘一幅美好的画面。你必须知道可能遇到什么，这样才能做好准备并做出恰当的反应。\n\
  \n武术教导我们，要像水一样。这意味着你的反应要与刺激完全对等，不多不少，然后回归平稳、平静的状态。当你把一颗鹅卵石投入平静的水面，涟漪会从中心向外扩散并逐渐消散，直到水面恢复变化前的平静。希望这种平静、稳定的状态是幸福的；如果不是，你可能需要另谋高就了。我发现，除非你是禅宗大师，或者能预判掉入你池塘的那颗石子的大小，否则你很难做出恰当的反应。\n\
  \n所以，我试着把我认为最有可能发生的反应告诉你，不是为了让你沮丧或害怕，而是为了让你能更容易地像水一样，在我的预测成真时做出恰当的反应。\n\n### 为什么拥抱独特性是健康的\n\
  \n不需要做太多的研究就能意识到，最成功的公司和个人往往是那些拥抱自身独特优势的。我最近做了一个关于远见卓识者的演示，发现他们都有两个共同点。\n\n第一，他们都拥有一个令人信服、改变人生的、积极的愿景（我避开了那些妄想征服世界的狂妄自大者）。\n\
  \n第二，他们都拥抱自己的独特品质，并将其转化为优势。从创作者和发明家，如阿尔伯特·爱因斯坦、玛丽·居里博士、亨利·福特、列奥纳多·达·芬奇、格兰维尔·伍兹、比尔·盖茨和史蒂夫·乔布斯身上，我们学到：仅仅在创造性上拥有独特性是不够的。你需要拥抱这些独特的想法并信任它们。你必须对自己和自己的理念有信心。赫伯特·凯勒就是一个很好的例子，他通过拥抱西南航空的独特性，将其带到了新的高度。他建立了一家成功的客运航空公司，至今仍能经受住行业的低迷。这家公司以其独特的风格和幽默感取得了成功。西南航空公司显然避开了其他航空公司深陷其中的“常规”，并拥抱了自身的独特性。你的组织可能也有像赫伯·凯勒带来的那种独特的经营方式。\n\
  \n保持对自己信念、原则和价值观的信心，需要你相信自己或自己的组织。几乎所有的创新者都不得不经受来自同行的嘲笑风暴，他们中的许多人宁愿说某事做不到，也不愿看着它成功发生。\n\
  \n比利·米切尔上校（美国空军之父）、爱德华·索林神父（圣母大学的创始人）、W·爱德华兹·戴明（全面质量管理之父）、吉米·威尔士（维基百科的创始人）以及李小龙（截拳道的创始人），他们都必须经受住反对者的冷嘲热讽。在大多数情况下，他们最大的反对者往往是朋友、家人和同胞。他们的理念今天能够成功流传，是他们对其理念全身心投入的结果。但这种投入并非易事。他们的理念被视为对现状的挑战，与现有体制对立。这些理念需要对长期以来做事的方式进行根本性的改变。你的组织可能对事情应该如何运作有独特、创新的想法。你必须拥抱这种独特性，并使其成为你组织的优势。\n\
  \n好吧，也许你的组织没有一个能够改变世界的愿景。你可能不是在移山填海、改变人生。也许你只是在努力提供所需的服务。也许你只是为了谋生。\n\n但你应该这样吗？你是否应该做得更多？你的组织是否应该有更远大的目标？一个愿景？\n\
  \n为什么不呢？\n\n无论你做还是不做，无论你的组织做还是不做，你都应该拥抱自己的独特性。你不应该仅仅因为“向来如此”或“别人都这么做”就去随大流。\n\n\
  这里有一个更具体的例子（以防前面的例子太抽象）。假设你的公司关心自己在竞争对手中的位置。假设它看了其最大竞争对手公布的指标，你的领导层决定改变，以匹配这个竞争对手。\n\
  \n假设这两个组织都相对成功，但在某些方面各有特色。例如，组织 1 的 IT 支持人员与受支持人员的比例是 1:10。组织 2 的比例则截然不同——1:50。组织\
  \ 1 完全在美国本土运营，而组织 2 则将支持服务外包给海外国家。\n\n\n\n"
- '# 排版后的内容


  经过研究和指标收集，组织 2 决定改变其支持模式，使其更像组织 1。它相信这样做会取得与组织 1 相同的成功。组织 2 希望获得拥有美国本土支持团队所带来的正面报道，并且领导层认为更小的支持人员与客户比例将与客户建立更好的关系，并提高客户满意度。


  因此，组织 2 投入大量资源来改变其支持模式，并将其运营迁回美国。它还雇佣了更多的 IT 支持人员，以效仿组织 1。这些改变耗时 18 个月才完成。


  组织 2 从这一改变中看到了成效，并对此感到满意。


  大约在同一时间，组织 1 宣布将其 IT 支持职能转移到海外。组织 1 的领导层仔细研究了其最接近的竞争对手（组织 2），并决定他们希望拥有对方公司所具有的规模经济。通过用更少的员工支持更多的客户，并将支持服务转移到海外，组织
  1 预计能够节省成本，并可以将节省的成本返还给客户。它希望这能带来更高水平的客户满意度。它还希望有更多客户尝试其服务，因为他们能够提供更具竞争力的价格（就像改变模式之前的组织
  2 那样）。


  组织 1 也对这一改变感到满意。


  这听起来很牵强？其实不然。体育队这样做，公司这样做，高等教育机构也这样做。但能够经受住风浪的，是那些拥抱自身独特性并相信自己的人和机构。


  与其寻找基准来判断什么是好的，你必须能够根据你所在组织的价值观、原则和目的来判断什么是好的。如果你独立地判断什么是好的，那么你就能找到符合你标准的人。这将使你能够向他人学习；而不是复制或照搬他们的根本问题及其指标。但它将使你能够利用他们的经验。


  要真正成功，你必须为自己定义成功。你必须拥抱你的独特性。


  ## 小结


  保持独特性是可以的。虽然如果我们能找到完全匹配的、如同组织的双胞胎会很好，但这不太可能发生。即使发生了，我们的镜像也不太可能回答我们所有的指标问题。


  我们必须拥抱我们的独特性，并创建适合我们特定和特殊需求的指标。我们可以而且应该利用我们能找到的任何现有指标——但我们必须以将其用作指南而非一套现成答案的目的来使用它们。


  如果我们能专注于我们独特的优势和劣势，我们将创造出在我们环境中具有意义的指标。


  ## 结论


  组织是复杂的有机体。如果你的指标计划旨在帮助你的组织改进，你将不得不拥抱你组织的独特性。正是你组织的独特性，才会给它提供卓越表现的机会。


  ## 附录


  ## 工具与资源


  工具可能（并且经常）与资源混淆。我将对两者进行简单的区分。工具是可以用来“执行”——即实际设计、创建、分析和发布指标——的物品。例如，`Microsoft Excel`。


  另一方面，资源本质上是参考性质的，提供用于设计、创建、分析和发布指标的指导或知识。与像`Minitab`这样的分析工具不同，资源包括关于如何使用软件或执行统计分析、操作视频、文章、博客、书籍以及讨论组（例如在`LinkedIn`等社交网站上找到的）的教科书。还有一些（新的和已建立的）组织，你可以加入并参与其中，以了解更多关于指标的知识。


  在本附录中，我将分享一些我最喜欢的工具，以及一些受到同事和朋友强烈推荐的工具。请不要仅仅因为这些工具被收录在这里就购买它们；相反，如果某个工具听起来不错，请进一步研究它。就像指标本身一样——你需要将可能性与你的特定要求相结合。基于你的根本问题、你的环境以及你开发的程序——可能需要不同的工具和资源。


  ### 工具


  有些工具扮演多种角色，但大多数工具专注于一个主要功能，并将其他功能作为补充。大多数故障工单跟踪工具就是这样工作的。它们被设计用来（并且非常擅长）捕获和跟踪故障工单，也可能提供基本的图表工具。它们不提供太多分析功能；并且几乎不能成为一个完整的指标工具。但故障跟踪工具擅长它们应该做的事情。关键是不要试图让一个特定的工具做超出其设计范围的事情。


  真正的好消息是，一个有意义的、有用的指标程序并不需要大量的统计分析或复杂的图表。始终牢记，指标程序的目的是提供能够支持决策、指导调查和揭示问题领域的洞察。


  工具只是提供了查看你所收集信息的不同方式。根据你的根本问题以及你试图从指标中学到什么，你可以使用许多不同形式的分析。我在本附录中介绍的工具是那些我发现有用且简单的工具。它们对我来说易于制作/使用，并且对我的受众来说易于理解。在展示你的指标时，始终牢记你的受众。即使你使用更复杂的分析来获得答案，你也可能需要找到以更简单的方式展示它们的方法。


  #### `Microsoft Excel`


  我发现`Excel`远不止是一个电子表格软件。我猜想它最初是为了协助会计或簿记而创建的。很久以前，我曾解释说电子表格程序擅长处理数字。如果你想对数据进行数学运算，电子表格是最好的方法。今天，`Microsoft
  Excel`已经发展得远不止是一个美化的计算器。我将它用于我的大部分指标工作。像大多数当前的软件应用程序一样，`Excel`拥有比大多数用户意识到或将要用到的更多的功能。除了功能的广度，`Excel`还提供了很多灵活的力量，例如宏（小程序）和像`PowerPivot`这样的加载项。我使用`Excel`收集、分析并制作我大部分工作的图表。借助`Excel`的加载项，我还可以在电子表格内部执行更复杂的分析。使用`Excel
  2010`，我可以处理我需要的任意多条记录。我将`Excel`作为我工作的基础。


  `Excel`有一个随完整版一起提供的统计加载项，但你必须将其“启用”。它默认不附带此功能。启用它将为你提供一些基本的统计工具，如直方图和回归检验。


  #### `SigmaXL`


  `SigmaXL`是一个可以通过`Excel`访问的工具。它在自己的选项卡中创建了一组比`Excel`自带的统计加载项更直观的菜单项。我特别高兴地发现它有一个`BoxPlot`工具（图表），这是我在任何其他加载项中都找不到的。`SigmaXL`的功能确实让我印象深刻。


  #### `Minitab`


  在我攻读六西格玛绿带期间，我爱上了`SigmaXL`。蜜月还没结束，我的导师就向我介绍了`Minitab`。他们将其描述为比`SigmaXL`更好、更智能、更易于使用且更全面。统计数据最大的问题就是处理起来太难了，尤其是考虑到所获得的收益。`SigmaXL`让这种努力变得值得；而如果`Minitab`更好的话（我还没用过），我想要一份拷贝。




  '
- '# 可视化工具


  可视化工具主要（即便不是唯一）旨在以仪表盘、计分卡或其他可视化的形式，让你能够访问数据。根据我的定义，这些工具可以用于展示指标。


  ## Theoris Vision Software 软件


  `Theoris Vision Software` 提供了一款仪表盘和报告解决方案，包含图表、图形、计分卡、地图和即席报告。所有功能都从仪表盘驱动。我喜欢它的一点是，我可以相当轻松地创建自己的视觉内容和报告内容。据我所见，这款应用真正的强大之处在于它能够映射到各种数据源和文件，而不是像传统方法那样将所有数据汇总到电子表格或数据库中。


  `Vision` 本身并非指标设计工具，但它是一个用于将你的度量进行可视化的强大工具。它还允许其他人（利益相关者）自行访问你的指标。我尤其喜欢在数据中设置层级结构的功能，这反过来让查看者能够进一步深入挖掘数据。这一功能得到了进一步扩展，允许在不同信息层级创建即席报告。这可能是一件坏事——取决于你受众的成熟度——但大多数情况下，这相当出色。总的来说，这确实是一款展示指标并开启关键对话的令人印象深刻的工具。目前，`Vision`
  主要专注于健康行业，但随着 `Vision` 扩展到其他行业，竞争对手最好当心了。这是一款非常好的工具，我已将其列入我的愿望清单。


  ## iDashboards


  `iDashboards` 正如其名所料：一款用于创建和展示仪表盘——或关键流程指标（我称之为度量）汇编——的出色工具。使用 `iDashboards`，你可以利用你的度量，为特定问题创建指标视图。


  就这个目的而言，我喜欢 `Vision` 和 `iDashboards` 这两款工具。对我来说，问题就变成了成本和易用性。如果你正考虑获取一款以这种方式展示数据的工具，我建议你花时间试用一下这两款产品。这款工具也在我的愿望清单上——无论收到哪一款作为圣诞惊喜，我都会很开心。


  ## Tableau


  `Tableau` 并非插件，但它能与 `Excel` 良好配合。你可以轻松地从 `Excel` 或其他常用工具将数据导入 `Tableau`。`Tableau`
  的强大之处在于能够快速、轻松地尝试数据的不同图形表示（可视化）。我认识一些喜欢它并在进行任何彻底分析之前就使用它的人。我还没发现它适合我，但我确实看到了它的潜在价值（我有一份副本，但还没能充分利用起来）。


  '
- '# 调查工具


  以下三款调查工具各有优点。依次来说，第一款能提供一些有用的分析，关于什么对客户重要以及你提供这些服务的表现如何。第二款是第三方服务（并非真正意义上的工具），让调查工作变得简单。最后一款是我的最爱，因为它允许你创建所需的内容，自定义调查以满足你的要求（而且成本很有吸引力）。


  ## TechQual+


  `TechQual+` (www.techqual.org) 是调查工具的一个好例子；它是由我的朋友、佐治亚大学首席信息官蒂莫西·切斯特创建的。`TechQual+`
  中大部分问题都是预设的，这造成了一些限制；但这也是它的优势所在。由于问题是标准化的，你可以将自己的结果与选择使用该工具的其他人进行比较。还有其他第三方调查机构（例如
  HDI），但 `TechQual+` 的一大优势是它是免费的。


  ## HDI


  `HDI` 客户满意度指数是一项调查服务。`HDI` 为你做所有事情：他们调查你的客户，汇总你的结果，并以多种格式向你提供报告。他们还提供与其他人的比较（例如，按行业或所有其他客户）。`HDI`
  只是一个例子；还有其他第三方调查服务提供这种服务。我建议你货比三家*并*寻找那些已经在*你的*行业拥有大量客户基础的服务。客户满意度调查是一个有趣的利基市场。


  ## SurveyMonkey


  我承认——我喜欢 `SurveyMonkey`；部分原因是它是免费的（如果你用得不多；不过，如果你想更大规模地使用，其费用也非常合理），但主要是因为它的简单性。使用
  `SurveyMonkey`，你创建调查问卷；然后向你的客户提供一个指向该调查的链接。`SurveyMonkey` 还提供简单的分析工具，但我通常将结果下载到
  `Excel` 中并自行分析。


  '
- '# IT 解决方案/商业智能工具


  许多“IT 解决方案”公司现在在其服务包中包含了仪表盘和计分卡。这清楚地表明了指标的需求以及软件在帮助交付指标方面的力量。IT 解决方案包可能将指标工具作为服务套件的附加组件——从关键产品（流程控制、管理、架构设计等）中提取数据副产品。


  我发现这些工具与独立工具之间的主要区别在于范围。如果你不需要（或负担不起）大规模解决方案集，你可以从专门为指标设计的工具中获得很多价值。如果你正考虑购买（或已经拥有）大规模
  IT 解决方案，你可能想研究其提供指标辅助的能力。


  ## ASE 10


  一个以数据为中心、使用计分卡、仪表盘和度量来改进组织的工具集例子是来自 `ActiveStrategy` (activestrategy.com) 的 `ASE
  10`。它有点复杂，但提供基于公司规模定价。`ASE 10` 很大程度上依赖于预定义的方法论，但似乎有足够的灵活性来处理你设计的指标。我没有使用过这个工具，但它是由一位我信任其判断的同事推荐的。


  对于大多数较大规模的工具来说，问题在于它们可能功能过多。忽略成本不谈，这些工具提供的功能超过了大多数人的需求——尤其是如果你刚刚开始你的指标之旅。


  '
- '# 其他工具


  其他工具可能完全不符合指标工具的定义，但对你的指标工作非常有帮助。我提供的两个例子处于范围/规模频谱的不同两端。`QPR` 是一个较大规模的流程改进工具，对指标工作有实际应用。`Powerpivot`
  是一个与 `Excel` 配合使用（且“在其内部”工作）的工具。


  ## QPR


  `QPR` (QPR.com) 是一个业务驱动解决方案的例子。其范围如此之大，我无法向你介绍全部。`QPR` 主要被美国以外的公司使用；但我相信它很快会在我们这边引起巨大反响。`QPR`
  的解决方案并非简单、低成本、用途有限的工具，而是一个中端的企业级解决方案。


  `QPR` 基于 Web 的解决方案可以根据你的需求来选择。如果你需要建立对流程的理解，它的一个工具 `Process Analyzer` 通过使用日志文件输入结构来辅助开发业务流程图。如果你需要共享你的业务流程数据库，`ProcessDesigner`
  提供了该解决方案。大多数以指标为中心的报告需求可以通过 `Metrics` 解决方案得到满足。如果你需要集成业务流程报告和指标，这些解决方案的组合可以为你提供一个集成的管理报告系统。


  其成本将反映其强大的功能。我将其列为一个高端工具的例子，因为它做的远不止指标（流程分析、流程管理等），所以较高的成本并不令人惊讶。我尤其喜欢这样一个优秀的企业级解决方案竟然包含了针对指标的特定工具。




  '
- "# 排版后的内容\n\n## PowerPivot\n\n与大多数工具不同，`PowerPivot` 根本不是一个分析工具。它允许你使用 `Excel`，使其更像它的同类产品\
  \ `Microsoft Access`——一种数据库工具。虽然大多数指标都是基于数字的，但很多时候，如果能对数据有一个关系型视图会非常有用。关系型数据库将是完美的工具，*如果*它能够对数据进行数学和统计分析的话。`PowerPivot`\
  \ 承诺为你提供两全其美的方案——一个可以当作关系型数据库来使用的基于数字的程序。我一直在试用它的第一个版本，并且期待着改进版 2.0 的发布。\n\n## 资源\n\
  \n虽然我之前建议你在购买任何工具之前先进行调研（与书籍或组织会员资格相比，工具的成本很高），但在此部分，我建议你尝试一下这些资源。如果你不想购买书籍，可以从当地图书馆借阅。大多数情况下，要判断一个资源是否有用，你需要拥有完全的访问权限。我提供的大部分资源要么是免费的，要么是低成本的（低于\
  \ 50 美元）。\n\n当你搜索资源时，根据你所处的行业，你会找到很多选择。在信息技术领域，我听到了很多关于 `COBIT` 框架、`ISO/IEC 20000`（IT\
  \ 服务管理国际标准）和 `信息技术基础架构库`（`ITIL`）的信息。\n\n与其为你提供一个网站列表，不如分享一些进行搜索的方法。搜索引擎以不同格式提供结果：视频、网页、图片、博客、购物等。最有用的是网页、视频和博客。在网页分类中，你可以找到从电子杂志的文章、书籍和百科全书式的定义，到开发指标的操作指南等所有内容。\n\
  \n如果你搜索 `\"metrics\"`，你会找到太多关于度量衡系统的结果。你需要缩小搜索范围。搜索 `\"Performance Metrics\"`（绩效指标）会让你更接近你要找的目标。即便如此，你可能还需要根据你的特定需求和行业来进一步缩小范围。例如，如果你身处信息技术领域，可以搜索\
  \ `\"IT metrics\"`（IT 指标）或 `\"IT performance metrics\"`（IT 绩效指标）。你也可以搜索 `\"business\
  \ intelligence\"`（商业智能，基于数据决策的最新流行语）或 `\"IT solutions\"`（IT 解决方案）。\n\n根据你所处的行业，你可能会找到一个丰富的标准、基准以及预定义的数据、衡量标准和信息库，用于你的指标。金融行业就是一个拥有强大指标环境的例子。制造业也是。如果你正在阅读这本书，那么你很可能处于一个尚未建立成熟指标框架的行业。很可能你正需要为你的组织和流程寻找有意义的指标。即便如此，你也可以从其他行业及其指标中学习。你可能能够利用一些现有的成果来开展你自己的指标工作。\n\
  \n通过你喜欢的网络搜索引擎进行简单搜索，就会返回一长串测量、统计分析和指标工具。我不会提供一个你可以自己去访问的列表。相反，我会提供一些见解，以及一个简短的资源和参考清单。\n\
  \n虽然这个清单是基于我个人使用过的工具和参考资料，但我强烈建议你按照我从一开始就倡导的那样去做——亲自去调查研究。我发现有些书“很精准”，而另一些书的观点我则要强烈反驳。我读过的每一本书、每一篇博客和文章，对于形成我关于指标的整体观点和概念都是有帮助的。即使是我发现那些离题万里的内容，也证明对我在这本书中提出的整体概念是有益的。\n\
  \n不要仅仅因为你认为某些部分“错误”就全盘否定。你可以从那些与你不一致的人身上学到很多东西。协助我撰写本书的一位同事，他不同意的次数多于同意的次数；这也是我邀请他担任本书技术审阅的原因之一。我相信他会提供诚实的观点，即使那是完全异议的观点。虽然我相信我所提出的概念和工具，但我对其他意见持开放态度。我欢迎这些意见，因为它们应该有助于让我更好地理解如何让指标更有效。\n\
  \n我希望你以同样的方式看待这里列出的资源，以及你之后调查的任何其他资源。没有银弹，也没有圣杯。没有唯一正确的方法来进行组织发展或流程改进。也没有唯一的方法来制定指标。对新的想法和不同的意见保持开放态度。并且始终确保你使用的方法对你是有效的。不要因为我或其他任何人说它好就用它，而是因为你亲自尝试过，并且它对你有效。\n\
  \n那么，让我们看看一些在我指标之旅中发现有用的资源和参考资料。\n\n### 网站\n\n以下是我发现的一些有用的网站。\n\n#### XPC Palladium\
  \ 集团\n\n`XPC` ([`community.thepalladiumgroup.com`](http://community.thepalladiumgroup.com))\
  \ 主要是一个讨论平衡计分卡方法的社区，但我发现它是一个总体上讨论指标的好地方。该网站的大多数参与者都是卡普兰和诺顿的追随者，他们相信使用衡量标准的方式是我不同意的。好消息是他们对其他观点持开放态度。这是一个运营良好的网站。最近我听说他们将对会员收费——而且正如你可能从我关于工具的观点中所了解到的，我不相信为社交机会付费。就像我所有的建议一样，在购买之前（特别是如果需要付费的话），请先核实一下。\n\
  \n#### LinkedIn\n\n我喜欢社交；尤其是专业人士之间的社交。除了我通过不同组织参与的 `LISTSERVs` 邮件列表外，我还喜欢 `LinkedIn`\
  \ ([www.linkedin.com](http://www.linkedin.com))。`LinkedIn` 群组允许你针对几乎任何你感兴趣的话题进行对话和讨论——如果话题不存在，你可以简单地创建一个新的群组/话题。我加入了不止一个与指标相关的群组（`绩效衡量`、`IT\
  \ 绩效衡量` 和 `IT 指标–CEITPS`），并且发现它们非常有用。而且会员资格是免费的。\n\n#### 信息技术绩效指标制定联盟 (CEITPS)\n\
  \n`CEITPS` ([www.ceitps.org](http://www.ceitps.org)) 是我创立的一个非营利组织，唯一目的是制定 IT 绩效衡量标准。这是一个非常年轻的组织。该组织制定的所有标准都将通过网站免费向公众提供。会员费用很低，你花钱获得的最大好处是你有机会参与制定和投票表决这些标准。会员收入仅用于支付网站运营费用。\n\
  \n#### smartKPIs\n\n`smartKPIs.com` 是一个**关键流程指标**（衡量标准）的存储库。因为它免费提供了其 `KPI` 的很大一部分的访问权限，我认为值得提及。我不推荐为他们的任何产品付费（只有高级订阅者才能访问计算、参考资料、`PDF`\
  \ 导出和过滤功能），因为这违背了我对基准和预设指标的看法。但是，如果你想看看别人提出了什么，免费的示例目录是一个很好的起点。\n\n我不会重复我在书中提供的所有警告——但我会建议，如果你使用这个（或其他类似的参考资料），请持保留态度\
  \ *并且* 多问问周围的人。你的行业同行应该是很好的信息来源，通过向他们请教，你将建立你的人际关系和专业网络。\n\n### 书籍\n\n你可能猜到了我会在这里列出哪些书；它们就是我在本书中一直引用的那些。\n\
  \n\n\n### *如何衡量一切*\n\n*《如何衡量一切：发现商业中无形价值》*，作者道格拉斯·W·哈伯德（John Wiley & Sons，2007 年出版）。我非常欣赏哈伯德在衡量任何事物时所持有的积极、实干的态度。尤其喜欢他关于校准自身精确估算能力的论述。部分内容对我来说略显晦涩，但我发现几乎全部内容都既实用又易于阅读。总而言之，这是一本关于如何衡量和估算的优秀著作，且不囿于任何特定的改进方法论。我推荐这本书，但建议你可能会倾向于选择性地阅读或参考某些章节。\n\
  \n### *重塑绩效衡量*\n\n*《重塑绩效衡量：重新思考衡量和驱动组织成功的方式》*，作者迪恩·R·斯皮策博士（美国管理协会，2007 年出版）是另一本我非常喜欢的书。我发现它（除了极少数部分外）非常易读。我认为迪恩与我志同道合。我们主要的分歧在于如何处理围绕指标所产生的恐惧、不确定性和疑虑。然而，在让指标发挥作用所需克服的问题和障碍上，我们的想法是一致的。我相信我们“信仰同一教派，只是坐在不同的长椅上”。绝对值得一读。\n\
  \n### *智慧型公司*\n\n*《智慧型公司》*，作者伯纳德·马尔（John Wiley & Sons，2010 年出版）是又一本我的心头好。我在撰写本书的过程中偶然发现了它，并意识到我找到了衡量领域的另一位同道中人。与斯皮策博士的书类似，我在马尔的书中也发现了一些值得商榷之处。但我认为，这本书比那些充斥着过多行话或术语的书籍更有用。我从不同于自己的观点中学到了很多（更多）。总体而言，我认同的观点多于不认同的观点，*而且*它是一本“轻松”易读的书。我推荐将这本书收入你的藏书。\n\
  \n### *衡量重要之事*\n\n*《衡量重要之事：简化工具以协调团队及其利益相关者》*，作者罗德·纳皮尔和里奇·麦克丹尼尔（Davies-Black Publishing，2006\
  \ 年出版）。我发现这本书更像是一本美国质量协会的操作手册，而非开发指标体系的指南。这并非坏事，但它在我期望的开发指标方面帮助不大，尤其是考虑到它的书名。我更愿意把它当作一本通用组织发展书籍，而非指标书籍。值得翻阅。\n\
  \n### *为何组织费力改善却收效甚微*\n\n如果你对组织发展感兴趣，我谦逊地推荐这本由迈克尔·朗索恩、唐纳德·帕吉特和我合著的《为何组织费力改善却收效甚微：克服组织不成熟》。自从\
  \ 2010 年由格林伍德出版社出版以来，我已经读了两遍。这本书非常易读，其中包含了对为何你难以改进或改变你的组织的重要见解。其中关于指标的章节为本书做了很好的引介。如果你正在考虑实施组织变革，我建议你阅读它。\n\
  \n### *其他书籍*\n\n有些书籍我不推荐用于开发指标体系，但对于进行分析工作却很有用；如果你的书架还有空间，将它们纳入其中也无妨。我特别喜欢的一本是《IT\
  \ 衡量：来自专家的实用建议》（Addison-Wesley，2002 年出版），这是由国际功能点用户组汇编的著作。在我的衡量学心中，对这个组织有特殊的情感，因为我的第一位衡量学导师厄罗尔·希姆曾是该组织全国分会的前任主席。这本拥有\
  \ 43 个章节的书由多位专家撰写。其中确实可以挖掘到一些珍宝——希望我已经为你提供了必要的工具，去发掘那些符合你需求的珍宝。\n\n### *回顾*\n\n\
  工具对于执行工作（设计、创建、分析和发布指标）非常有用。参考资料则是让工作更轻松或更出色的参考依据。不幸的是，工具可能很昂贵。好消息是，我提供的开发指标体系的方法并不需要任何特定的工具。使用你已有的任何工具都能做得相当不错。但随着你在指标开发方面变得熟练，你可能会对工具集有更高的要求，因此我提供了一些可以考虑或探索的工具。记住，这只是一个起点——找到最能满足你需求和预算的工具。\n\
  \n另一方面，参考资料则应该尽早研究。如果你只使用本书，我会倍感荣幸：把它折角、标记出最精彩的段落、在页边空白处做笔记，并用它来帮助你开发指标体系。但是，你很可能不会赞同我提供的所有观点。或者你可能想通过其他著作来寻求确认。或者你可能觉得我在你对材料的理解上留下了一些空白。我鼓励你阅读关于这个话题的其他书籍、文章和论文。\n\
  \n我对自己所教授的指标知识充满信心，并欢迎任何反面论点。如果本书中的概念是正确的，那么它们就能经得起彻底的审视。为此，请随时联系我并提供你的意见——无论是同意还是不同意。在领英的讨论组中加入我，给我发电子邮件，或者在我的网站上发布你的想法、问题或论点。归根结底很简单：行动起来！学习更多，尝试更多，做得更多。分享你的观点，尝试我提供的建议，创建一个有意义的指标，然后看看效果如何。\n\
  \n### *结论*\n\n我认为我在指标领域的启蒙导师之一厄罗尔·希姆是一个巨人般的人物。我认为他是他所在领域（功能点分析和指标分析）的巨人。他教会了我很多，并帮助我踏上了通往形成本书中许多内容之路。他的专业知识令人印象深刻——他能准确预测软件变更的复杂性，并正确估算所需的努力和时间（这些通常与我们团队估算的相差甚远）。\n\
  \n但是，问题在于他的能力是他个人的。这些能力无法转移。它们源于多年的经验。我希望开发一种简化的方法，将他自己独立产生的那些洞察力，提供给任何有需要的人。这些洞察力同时在性质上更通用（涉及整个商业领域的指标），在方法上更具体——从一个根本问题出发，使用数据、度量值、信息和其他指标来讲述一个完整的故事。\n\
  \n我希望你能够开发出有意义的指标。我希望你无需获得统计学证书、购买昂贵的工具或花费数月时间进行培训就能做到这一点。希望本书能为你提供所需的一切，让你能够富有成效地为你的组织开发和实施指标。\n\
  \n## ![images](img/I.jpg)\n\n## 索引\n\n\n\n### A\n\n#### 高级度量指标\n\n- 一致性，249\n- 不成熟组织的收益——目标，247\n\
