  \ 图 2-1 展示了学生中最好的答案之一。\n\n![images](img/0201.jpg)\n\n**图 2-1.** 工作量分配度量指标\n\n这幅图展示了每个人（由不同的杯子代表）拥有不同程度的工作量。液体的高度代表了“每个人杯子中”的工作量。靠近顶部的那条线是液体应该被倒到的最高水位线，因为泡沫会导致它溢出。这条线代表了每个人实际能处理的最大工作量，为“额外”部分——如生病、午餐、假期等——在顶部留出了空间。通过看这幅图，管理者可以轻松理解谁的工作量过多、谁可以承担更多工作、谁的生产力更高、以及谁需要提升技能以便最终能拥有一个更大的杯子。\n\
