- "# 指标开发与报告卡方法论\n\n回顾指标开发计划，你会发现需要明确数据收集和报告的时间表。这些事项并非孤立处理。在确定衡量标准的同时，我们同步制定了预期目标。在制定预期目标的过程中，我们还确定了报告频率和评估周期。我们最终选择了月度全面报告，并汇总至日历年度。当然，理论上也可以选择周报、季报，或仅按日历年度、学年、财政年度进行报告。\n\
  \n## 要点回顾\n\n在现实案例中可以看到，即便是被强制要求实施指标计划，你仍可以回归根本问题，让工作由基础需求驱动。在我所举的案例中，幸运的是领导层的信息需求很容易被解读为“产品/服务健康度”问题。这直接引导我们为每项关键服务开发了有效性指标。\n\
  \n能够始终聚焦在“答案关键”的第一象限， 大大降低了在一个此前从未成功实施大规模指标计划的组织中推行此类计划所面临的风险。这也使得我们能够集中精力，从而开发出报告卡方法论。\n\
  \n三角验证与预期目标的应用对该计划的成功至关重要——部分原因是它能更全面地呈现根本问题的答案，另一部分原因则是有助于消除通常伴随指标而来的大量恐惧、不确定性和疑虑。\n\
  \n## 结论\n\n在奠定了报告卡的基础之后，现在是时候完成这项工作了。我需要一种方法，让这个由基础支撑的“大”图景对总监级别、首席信息官乃至更高层管理者都具有意义。如果组织要为其高层领导发布指标，那么也必须准备好面对其他受众，包括股东或利益相关者。客户可能也想了解组织为其服务的成效如何。\n\
  \n这就要求指标能够轻松调整，以向不同受众展示不同的视图。当然，它也必须对服务提供者具有实际意义。\n\n![images](img/ch10.jpg)\n\n\
  ## 最终成果：指标报告卡\n\n第 9 章介绍了为回答组织内领导层问题而开发的指标。如果只有服务提供者和执行领导者查看结果，我本可以直接发布指标。但由于这些指标需要经过整个管理层的严格审查，并且还会被客户看到，我必须找到一种方法，让结果在每一层级都具有可用性（即便不一定是可读性）。\n\
  \n我与一个顾问团队及服务提供者合作，共同开发了后来的报告卡。这种指标解读方式允许以不同层级和不同聚合度进行查看，同时保留了预期目标的概念。\n\n在基本衡量标准制定完成后，我们（包括顾问团队、服务提供者和我本人）需要找到一种方法将它们整合成报告卡。我们当时只有一组图表，但需要找到一种方式来报告整体服务健康度，同时保留交付、使用和客户满意度这几个独立的衡量类别。由于身处学术机构，采用报告卡的概念作为模板似乎是合乎逻辑的选择。\n\
  \n在报告卡机制中，学生可以选修截然不同的课程——从法医人类学到精美版画制作。评分可以基于完全不同的评估标准，但成绩仍然是可理解的。`A`表示学生超出预期，表现非常出色；`B`表示表现良好；`C`表示学生勉强及格；低于`C`则意味着学生未能达到预期。测验、考试、研究论文和课堂参与均可构成成绩的一部分。还可以采用其他非传统的评估方法，如评审创作的艺术作品、向委员会进行演示，以及审核课堂作业中产生的材料。\n\
  \n无论哪种情况，学生都会获得一个可以转换为绩点数字的字母等级。我们希望获得类似的效果，让高层利益相关者能够一眼看懂并快速掌握。\n\n我们最终确定了`E`、`M`和`O`三个等级。我们需要弄清楚如何评估每项指标和每条信息，将其归类为超出预期、符合预期或改进机会。可用性以百分比形式呈现（例如，放弃呼叫的比率或小于\
  \ 30 秒的放弃呼叫比率）。因此我们可以顺利地将此转换为通用的衡量视图。\n\n### 交付\n\n请记住，在这次讨论中，我将“交付”分解为“可用性”、“速度”和“准确性”。\n\
  \n#### 可用性\n\n对于每项指标，都必须明确其预期目标。表 10-1 显示了可用性的预期目标。\n\n![images](img/t1001.jpg)\n\
  \n这使得分析结果变得简单。将各项指标放入网格中，我们会得到`O`、`M`或`E`的“等级”。然后可用此来生成平均绩点。我们可以在可用性层面汇总等级，也可以在交付层面汇总等级（将可用性、速度和准确性合并）。并且希望最终能将等级汇总为一项总体服务等级。\n\
  \n我们需要做的第一个决定是如何汇总这两个不同的等级。我们选择为每个等级（`E`、`M`或`O`）赋予一个分值。对我们来说，确保结果无可指摘至关重要。由于我们知道错误可能从多个方面渗入，我们必须确保我们的意图永远不会受到质疑。为了将可能复杂的问题变得易于处理（即便不是简化），我们采用了\
  \ 10 分钟的分值体系。`E`值为 10 分；`M`值为 5 分；`O`值为 0 分。然后计算这些数值的平均分。因此，如果我们有两个值需要处理，例如在可用性层面，我们会得到以下结果：\n\
  \n*   `E` = 10，`M` = 5，`O` = 0\n*   一个`E`和一个`M`的平均分是 7.5 分\n*   一个`E`和一个`O`的平均分是\
  \ 5 分\n*   一个`M`和一个`O`的平均分是 2.5 分\n\n现在，我们将计算出的平均分再转换回对预期目标的评估。8 分及以上为`E`级。5 分到\
  \ 8 分之间为`M`级。5 分以下为`O`级。因此，另一种理解方式是：\n\n*   一个`E`和一个`M`平均得 7.5 分，对应等级为`M`\n*   一个`E`和一个`O`平均得\
  \ 5 分，对应等级为`M`\n*   一个`M`和一个`O`平均得 2.5 分，对应等级为`O`\n\n我们很满意这种运作方式。你必须在一项指标上超出预期，才能抵消掉一项改进机会。正如我的朋友唐所说，我们认为这体现了“宁求卓越”的精神。\n\
  \n> 宁求卓越。\n\n一个可能的缺点是，这使得“改进机会”成了“坏事”，而“超出预期”成了“好事”。正如我之前提到的，两者其实都是异常情况。我们真正想要的是“符合预期”。另一个缺点是，合并后的等级可能掩盖异常情况。如果你有相同数量的`E`和`O`，汇总后就会变成`M`等级，看起来好像一切正常，符合预期。\n\
  \n优点是我们能够展示一个总体等级，让人对该项指标的健康状况有一个“感觉”。另一个优点是可以处理被“隐藏”的等级，只需标记出那些数据中潜藏着`O`的`M`或`E`等级即可。这将引导指标的使用者知道应该深入挖掘哪里，以找到这些`O`，并了解那些情况究竟发生了什么。\n\
  \n\n\n对于“差”与“好”这两种情况，我们无法轻易规避。最终，我们决定逐案处理，并强调两者均属异常。我们接受这一做法，因为无论我们如何强调“超出预期”的负面因素，最终，预期被超越本身并非坏事。它之所以“不好”，只取决于你达成这一评级的方式——例如，你忽视了其他重要工作/服务，或投入了过多资源。但如果你通过流程改进或仅仅是在不同领域恰当聚焦而获得此评级，那么这不仅是一件好事，我们甚至能改变客户的预期，因为我们能够始终以这一更高水平交付。这甚至可能成为我们服务相对于竞争对手的营销亮点。至于另一类异常——“有待改进”，则无法相提并论。如果你未能满足预期，大多数情况下，未能达到客户期望本身就是一件坏事。即使你发现这是由于自然灾害或不可控因素所致，客户仍会视其为负面。因此，尽管我希望这两种异常都能引发相同的反应——即进一步调查，但调查的目的显然不同。\n\
  \n一种调查本质上是为了判断该情况未来能否避免，而另一种则是为了看它能否被复制。\n\n这最终促使我们做出决定：使用转换表对数值进行汇总，如果在我们显示的层级之下存在“O”，我们就会在该评级上标注一个图标。（注意：随着我们不断改进工具和流程，当任何异常隐藏在评级为“E”或“O”的数据中时，我们都会调整图标的显示！）\n\
  \n图 10-1 是我们用来将数值评级转换为字母评级（以及反向转换）的转换表。我们最初将“超出”标为绿色，“符合”标为蓝色，“有待改进”标为红色。这使得我们很难说服任何人：“有待改进（红色）”和“超出预期（绿色）”一样，都是需要调查的异常。\n\
  \n![images](img/1001.jpg)\n\n**图 10-1.** 转换表\n\n因此，在查看可用性图表时，我们加入了预期值，这样我们就能从视觉上判断当前可用性的健康水平。这种可视化呈现发生在度量层面，即在我们将评级与其他可用性度量（以生成该类别最终评级）进行汇总之前，以及在我们着手将评级向上归集到交付层面之前。图\
  \ 10-2 和 10-3 显示了带有预期值的放弃率及 30 秒内放弃的电话数量。\n\n![images](img/1002.jpg)\n\n**图 10-2.**\
  \ 带预期值的放弃呼叫率\n\n![images](img/1003.jpg)\n\n**图 10-3.** 30 秒或更短时间内放弃的电话占比\n\n## 速度\n\
  \n速度不像可用性那么简单。我们可以衡量有多少工单的响应（或解决）速度快于预期、符合预期以及慢于预期。问题在于确定这到底意味着什么。什么是好的？我们可以说，任何超出“符合预期”范围（高于或低于）的工单都是异常，应该进行调查。这听起来合乎逻辑，但由于工单数量成千上万，实际操作并不可行。而且，在我与部门成员访谈时，很明显异常情况会时不时发生。有时分析师响应时间比预期的要长；有时他们又在第一声铃响后就接起。这是工作性质、影响绩效的环境因素以及工作负荷共同作用下的自然产物。\n\
  \n因此，针对这些情况，我们决定在第二个层面确定客户的预期。我们提出了以下问题：\n\n*   客户认为应该有多少百分比的工单超出预期？\n*   客户认为应该有多少百分比的工单符合预期？\n\
  *   客户认为可以接受多少百分比的工单未能达到预期？\n\n于是，我们着手以响应时长和解决时长的形式来定义预期。\n\n响应时间\n\n*   *超出*：在\
  \ 5 秒内响应\n*   *符合*：在 6 到 30 秒内响应\n*   *有待改进*：响应时间超过 30 秒\n\n解决时间\n\n*   *超出*：在一小时或更短时间内解决\n\
  *   *符合*：在 24 小时或更短时间内解决\n*   *有待改进*：在五天或更短时间内解决\n\n对于每一项，我们都需要确定客户的预期。客户期望每个类别分别占多少百分比的工单，如表\
  \ 10-2 所示。\n\n![images](img/t1002.jpg)\n\n图 10-4 显示了一小时内解决的工单占比。虽然这是一个很好的度量指标，但需要所有三个指标才能了解全貌。如果只看这一个指标，会对服务的健康状况（就速度而言）产生片面的看法。\n\
  \n![images](img/1004.jpg)\n\n**图 10-4.** 一小时内解决的通话占比\n\n这第二层面的预期使我们能够使用百分比，并且只在异常汇总到相当数量（按预期定义）的工单时才予以关注。值得注意的时，速度的第三个度量：响应时间，其变化方向与其他度量相反。返工情况也是如此，返工率越低越好。\n\
  \n## 准确性\n\n返工最终成为服务台准确性最好的度量指标。图 10-5 以工单占比的形式显示了返工情况。\n\n![images](img/1005.jpg)\n\
  \n**图 10-5.** 返工占比\n\n也许值得一提的是，指标的查看者所得到的印象或感受可能会受到呈现方式的影响。让我们快速看一下返工完全相同数据的两三种不同呈现方式。图\
  \ 10-6 和 10-7 与图 10-5 的数据相同，但我改变了第一张图的颜色和第二张图的刻度。\n\n![images](img/1006.jpg)\n\n\
  **图 10-6.** 返工占比背景颜色反转\n\n![images](img/1007.jpg)\n\n**图 10-7.** 返工占比，刻度从 0-6%增至\
  \ 0-25%\n\n你可以想象出无数种可能影响查看者对数据感知的排列方式。一种方式可能让你觉得数据“糟糕”，另一种让你觉得“还行”，还有一种则可能让你觉得“很好”。\n\
  \n基于数据呈现方式而对度量指标进行的解读必须受到限制。这需要通过持续且彻底的沟通来实现，明确我们要寻找的是——异常。你不能被事物的表象所迷惑；不要纠结于图表看起来如何，也不要纠结于它们如何让你或你的团队看起来如何。\n\
  \n至关重要的是，你必须理解预期，并知道如何评估所呈现的图表。你要寻找的是趋势和异常，而不是基于颜色或数值的“好”或“坏”的感觉。正因为如此，我尽量只给这些图表使用中性颜色，甚至还特意去掉了那些构成“有待改进”与“超出预期”的值的明显分界线。表\
  \ 10-3 显示了返工占比的预期值。\n\n![images](img/t1003.jpg)\n\n我们再次能够使用百分比——这为不同的度量指标提供了一致的视图。虽然我们使用了各种度量指标（三角互证法），但我们通过使用一致的形式、一致的视角（客户的）以及每组度量指标一致的一套“评级”，将所有内容简化了。我们在使用情况方面成功地坚持了这套既定的规范。\n\
  \n\n\n### 使用量\n\n使用量是根据独立客户数量来定义的（表 10-4）。数字（数据）本身毫无意义。但通过将其置于以度量指标和客户基数百分比形式呈现的上下文中，它就变得更有用了。我们刚开始衡量时，是以一年为一个周期进行观察。我们展示了每个月的独立客户数量（一个滚动累计值），这样就能区分出淡季和旺季。当我们随时间展示这些度量指标时，每年都是从零开始。这让我们年初总是低于预期，但随后一年内会稳步增长，直到年底时，我们完全达到了预期（参见图\
  \ 10-8）。\n\n由于这种情况在第二季度之前总是给人留下（并被评为）“有待改进”的印象，我们重新审视了信息的呈现方式。不是因为“看起来糟糕”，而是因为它讲述了错误的故事。我们的使用量并不是在年初偏低——我们错误地每年都从零开始。\n\
  \n![图片](img/t1004.jpg)\n\n图 10-8 展示了当从一年时间跨度来看时，使用量是如何给人一种前三个月存在异常的印象的。\n\n![图片](img/1008.jpg)\n\
  \n**图 10-8.** 使用量：首次来电者累计趋势\n\n因此，更好的呈现方式是将度量指标按滚动时间段展示。我们可以展示一整年的数据（因为我们有足够的历史数据），也可以展示更短的时间段。可选方案包括展示滚动三个月、六个月以及十二个月的累计数据。无论选择哪种，我们都必须确定预期值——我们预计在一年、半年或一个季度内，有多少比例的独立客户会使用我们的服务？\n\
  \n另一个需要考虑的因素是服务的预期使用频率。对于那些可能每年只使用一次的服务（比如汽车保养），服务提供商会按年度周期来衡量首次来电者。\n\n如果服务是半年一次，比如更像换机油，那么按这个间隔来衡量就合情合理了。关键在于，这取决于你预计客户回头使用你的服务或购买你的产品的频率。即使是餐厅也遵循这个规律。高档餐厅可能预计每月或每季度有回头客，而快餐店则可能期望更高的频率。\n\
  \n独立客户的度量指标可以很容易地与回头客指标结合使用。大多数企业的收入主要依赖回头客。回头客率直接反映了企业与客户之间的关系。为了发展，更不用说生存了，企业必须让客户满意，从而赢得他们的信任。如果客户喜欢你的服务或产品，他们最终会再次光顾。\n\
  \n如果你只销售一种产品或服务，且重复购买的几率很小，那么满意的客户仍然是你最好的销售员。与其衡量回头客，不如衡量客户推荐量。还记得我买笔记本电脑的故事（第 7\
  \ 章）吗？一周后，因为选择众多、价格合适，但主要是出于客户服务，我带我女儿去同一家店买了她的笔记本电脑。通常情况下，我三四年都不会再买一台电脑。\n\n当然，这家店销售的不只是电脑，他们应该衡量我是否还会回来购买他们的其他科技产品。一个更纯粹的例子是我的第一本书。我为《为何组织如此难以实现微小改进》感到自豪。这是一本好书。但我能预期同一个客户购买多少本呢？在这种情况下，你可能认为总销量是我唯一需要的度量指标。但是，我也可以从分析使用量指标中学习。想象一下，如果我能获知一个人或一个组织订购的书籍数量；或者推荐量——即受其他读者鼓励而购买我书的销量。另一个度量指标可以是评论数量和评论附带的评分。当然，如果我销售另一本书（比如这本），我会尽可能衡量回头客。有多少人两本书都买了？如果读者喜欢其中一本，希望他们足够喜欢而去读另一本，并期待一定的质量和信息水平。\n\
  \n弗雷德·赖克哈尔德提出的推荐者和批评者预测指标之所以有价值，是因为口碑宣传——那种你无法买到的宣传——对企业的增长至关重要。新客户固然好，但回头客才是你持续成功和未来增长的基础。\n\
  \n在我们的服务台案例中，我们预计客户会每季度遇到一次信息技术问题。如果他们每年只打电话一两次，这可能表明他们在使用其他渠道来解决 IT 问题。这可能包括尝试自己解决问题。如果他们每周都打电话，可能意味着该组织的产品线和服务目录有太多缺陷或错误——需要频繁的帮助。\n\
  \n预期值可以保持不变，但由于我们最初看的是全年的预期值，从逻辑上讲，我们不应该期望在三个月周期内有同样高的首次来电者（独立用户）数量。由于部门认为报告期内的使用量是健康的，我们选择先回顾数据。如果不确定，一个简单的工具就是让度量指标告诉你预期值应该是什么。\n\
  \n图 10-9 为我们展示了没有预期值的图表，这样我们就可以利用数据来确定什么是“正常”。\n\n![图片](img/1009.jpg)\n\n**图 10-9.**\
  \ 首次来电者：三个月滚动累计值（无预期值）\n\n基于以滚动三个月累计值呈现的度量指标图表，正常值看起来在 5%到 15%之间。当我和团队沟通时，他们觉得 5%太低了。尽管这会让他们更频繁地处于“有待改进”的状况，但他们觉得“这样才合理”。他们还觉得“超出预期”应设定为\
  \ 20%，从而使预期范围变为 10%到 20%。由于这些度量指标，我敦促他们找出选择 20%的原因。答案是“15%有点太低了”。于是，我进一步追问：“那为什么是\
  \ 20%呢？”你可能已经猜到了，答案是“它是下一个数值”。\n\n所以，我将范围设定为 10%到 17.5%。不要让惯例阻止你设定正确的预期。\n\n不要让惯例阻止你做正确的事。\n\
  \n图 10-10 展示了首次来电者在三个月滚动累计值下的预期值。\n\n![图片](img/1010.jpg)\n\n**图 10-10.** 首次来电者：三个月滚动累计值（有预期值）\n\
  \n表 10-5 以表格形式列出了这些预期值。\n\n![图片](img/t1005.jpg)\n\n\n\n在确定衡量独立客户及其期望的适当指标后，我们审视了另一项衡量使用情况的指标。另一个选择是，在我们的年度调查中，选择服务台作为其主要服务提供商的受访者所占的百分比。表\
  \ 10-6 展示了我们针对调查结果所确定的期望值。\n\n![images](img/t1006.jpg)\n\n图 10-11 展示了在寻求信息技术问题帮助时，将服务台列为首选的调查受访者所占的百分比。\n\
  \n![images](img/1011.jpg)\n\n**图 10-11.** 倾向于选择服务台寻求帮助的客户百分比\n\n尽管 2008 年的结果并非异常，但与随后一年的结果差异巨大，以至于我们不得不调查原因。我们唯一能确定的原因是，2008\
  \ 年要求受访者选出他们最偏好的三个选项。服务台被 59%的受访者列为前三个首选之一。而接下来的两年，该问题只允许选择一个答案——即首要选择或偏好。你已经看到图表如何改变对指标的认知。这又是一个强有力的例子，说明基于不同的数据收集方式，指标可能截然不同。\n\
  \n如前所述，我们还可以增加一项关于回头客的指标。如果我们想继续使用百分比，可以计算给定时期内回头客占客户总数的比例。同样，这可以按三个月、六个月或十二个月的周期来衡量。真正的好消息是，这项指标可以从计算独立客户数量的同一数据集中衍生出来。独立客户是与总潜在客户（客户群）进行比较，而回头客则是与给定时期内的客户总数进行比较。\n\
  \n我们使用的最后一类指标，是大多数人首先想到要收集的——客户满意度调查。\n\n### 客户满意度\n\n我们再次感到幸运，因为数据已经由他人收集、整理并分析完成。如前所述，我们必须决定哪种数据视图最有效。基本上，我们需要确定基于数据构建哪项指标。\n\
  \n该部门报告这一指标已有很长时间，但仅以 5 点李克特量表的平均值形式呈现。我们的领导层对于如何理解这个平均分数以及如何解读感到困惑。作为问题解决者，他们并未将解决方案留给部门，而是要求提供基准，以便与平均值进行比较。他们的理由是，如果优于“全国平均水平”或竞争对手的平均水平，那就说明做得不错。但实际上，这只能说明他们优于平均水平，可以声称自己处于前\
  \ 50%。如果我们足够幸运，可能会发现以下情况：\n\n1.  我们的同行使用了与我们相同的问题。第三方服务提供商拥有令人印象深刻的客户名单，但他们*并未*囊括我们所有的同行，也未垄断该服务。\n\
  2.  我们的同行使用了与我们相同的 5 点量表。\n3.  我们的同行愿意分享他们的平均分数。\n4.  我们的同行以相同的方式计算平均值——他们可能剔除了短期内的重复客户，可能对客户进行了不同的分类，或者可能未包含某些客户（如服务台的内部用户）。另一个差异可能是他们只调查了部分样本，而我们调查了所有用户。\n\
  \n这种完美的同步可能性极低，更不用说长期保持同步了。因此，我们用作基准的，可能只是部分同行的样本数据。这是我反对使用基准来试图让指标具有意义的第一点理由。\n\
  \n我的第二点理由是，即使与有效的基准进行比较，也只能表明我们相对于所选标准的表现如何——而非我们在多大程度上满足了客户需求。我们完全有可能“处于班级前列”，却仍然远低于客户的期望。如果你带回家的成绩单平均分是\
  \ B-，你的父母很可能不会高兴。如果你告诉他们你是班级第一名，他们可能会稍微印象深刻一些，*或者*他们可能会决定给你转学。一份成绩单应该告诉你自己的表现如何，无论你在毕业班中的排名如何。一旦你知道了自己的表现（或已取得的成绩），了解自己在同龄人中的排名则是一个额外的收获。\n\
  \n我的第三个也是最后一个理由基于原则：在寻找基准*之前*，指标就应对组织有意义。基准应仅作为信息的补充，而非信息的定义者。指标本身必须具有意义。\n\n图 10-12\
  \ 展示了平均分数。尽管我认为这比其他视图的意义较小，但当你加入期望值后，即使是这项指标也变得有用。\n\n![images](img/1012.jpg)\n\n\
  **图 10-12.** 平均客户满意度分数\n\n我仍然希望有一个更好的指标来表示。我们尝试使用推荐者与贬损者的比例，但由于供应商不会改为 10 点量表，我们不得不将\
  \ 5 点量表转换为 Reichheld 建议的方法，以确定客户在支持范围内的位置。我们最终将 5 分定为推荐者，1、2、3 分定为贬损者。这是为了匹配 Reichheld\
  \ 的 1-6 分（贬损者）、7-8 分（中立者）以及 9-10 分（推荐者）的分类。虽然这并不完美（也非最优），但我相信它是有效的，并且可以说我们再次“在追求卓越方面犯了偏保守的错误”。但展示这个比率（高度满意\
  \ vs. 不满意）被证明是有问题的。虽然它比平均评分更有意义，但管理层仍然难以解读。\n\n对话大致会像下面这样进行：\n\n\n\n> *“那么，每收到 1、2\
  \ 或 3 分，我们就对应有十二个 5 分？”*\n> *“是的，你的推荐者与贬损者比例是十二比一。”*\n> *“那 4 分呢？为什么我们不计算 4 分？”*\n\
  > *“因为 4 分被视为中立。我们无法判断他们会如何‘谈论’我们的服务。他们可能会说服务不错，也可能不会。”*\n> *“我以为 3 分才是中立？”*\n>\
  \ *“3 分处于中间位置，既不满意也不满意，我们相信，如果一个人不能说出他们满意（4 分或 5 分），那么他们肯定会负面地谈论我们的服务——他们会损害我们的声誉。”*\n\
  > *“好吧，如果我们忽略 4 分，我们就遗漏了数据……所以这并不完整。”*\n\n![images](img/1013.jpg)\n\n**图 10-13.**\
  \ 推荐者与贬损者比例\n\n与“看起来不错”的平均分相比，这种表示方式（见图 10-13）让服务台看起来非常出色！有趣的是，我相信这更准确地反映了他们有多优秀。\n\
  \n经过两年的争论，我最终让步并找到了另一种表示该数据的方式。我仍然认为推荐者与贬损者的故事是一个好故事（甚至可能是最好的）。有一个公认的“好”的标准可以作为起点。当\
  \ Reichheld 使用这个标准来判断增长潜力时，它作为高质量基准是有效的。话虽如此，少数能够理解推荐者与贬损者衡量标准的部门，总是将这个基准提高到这个标准之上。我合作过的一个客户希望达到\
  \ 90 比 1 的比例。作为健身课程提供商，他们认为让客户高度满意是首要职责，他们期望每 100 名学生中，有 90 名推荐者，9 名中立者，只有 1 名贬损者（他们乐于将\
  \ 5 分制改为 10 分制）。\n\n我们最终采用了一种新的衡量标准——一种解释数据的新方式。我们展示了“满意”的百分比（图 10-14）。这是 4 分和 5\
  \ 分的数量与总受访人数的比值。这绝对比平均分更好。调查的第三方供应商以这种方式（我们以及我们行业的数据）表示数据没有任何问题。他们实际上以多种形式生成了报告，包括这种形式。\n\
  \n![images](img/1014.jpg)\n\n**图 10-14.** 满意客户百分比\n\n在撰写本文时，我们的组织正在测试这种数据视图。这仍然需要一些接受度，而且我确信我会听到争议，认为所有数据都没有显示出来（4\
  \ 分和 5 分被混在一起，而 1 分、2 分和 3 分实际上根本没有显示）。有趣的是，我认为这更多是抵制变革的问题，而不是这些数据表示方式的缺陷。大多数不喜欢推荐者与贬损者比率的人（以及我预期会反对满意百分比的人）并没有抱怨平均分缺乏粒度。在这些更新的视图中，提供的数据比平均分中给出的更多，如表\
  \ 10-7 所示。\n\n![images](img/t1007.jpg)\n\n### 权重与度量\n\n手头有了完整的度量指标，我们的下一步是将它们整合成一个“度量体系”。为了成为一份报告卡，我们需要汇总数据，同时深入分析异常情况。到目前为止，我们的方法论提供了一定的严谨性和灵活性。让我们从这个角度分别审视。\n\
  \n#### 严谨性\n\n*   每个度量指标都使用了三角验证；每个指标至少由三类信息组成（交付、使用和客户满意度）\n*   信息由服务提供商根据他们认为合适的多个度量构建而成\n\
  *   每个度量都按“超出预期”、“符合预期”或“未达预期”进行评定\n*   每个度量都来自客户视角，并符合服务/产品健康状况的规则\n\n#### 灵活性\n\
  \n*   每个度量由服务提供商（我们的服务台部门）选择\n*   每个数据集根据服务提供商的选择构建成一个度量\n*   预期，虽然代表了客户的需求和期望，但由服务提供商定义，并且可以调整，以反映服务提供商希望客户形成的认知。例如，如果客户对低于服务台认为可接受的放弃率感到满意，那么预期可以设定得更高。\n\
  \n对服务提供商来说，另一个重要的灵活性领域是使用权重来分配度量指标的重要性。这首次用于交付类别。由于交付（三个有效性衡量领域之一）由多个度量指标组成——可用性、速度和准确性——服务提供商可以对这些子类别进行不同的加权。\n\
  \n对于一个刚开始使用度量的组织来说，对这些因素进行加权并非易事。我们通过提供建议使其变得更容易。对于支持服务，我们建议速度对客户最重要；对于非支持服务，可用性则占主导地位。因此，对于服务台，我们提供了以下权重：\n\
  \n*   可用性：35%\n*   速度：50%\n*   准确性：15%\n\n服务提供商可以任意更改这些权重。这一点（以及整份报告卡）的关键在于度量的所有权。由于服务提供商“拥有”数据、度量、信息和度量体系——如果他们追逐数据，那就是在“自欺欺人”。我在本章之前给出的许多告诫，都是为了帮助你理解准确性的必要性，但更重要的是诚实的必要性。正如*Getting\
  \ Things Done* (Viking, 2001)的作者 David Allen 所说：“你可以对所有人撒谎，但你骗不了自己。”如果服务提供商出于正确的理由并以正确的方式使用度量，那么领导层就绝不能滥用或误用它们。\n\
  \n尽管我对这个部门有最大的信任，但我仍然强调了“实事求是”的重要性。该部门不仅要“愿意”听到坏消息；如果故事的发展如此，他们还必须*想要*听到它。\n\n对因素进行加权可能成为一种轻易追逐数据的方式，使度量指标讲述你希望的故事，而不是真实的故事。为了降低这种诱惑，我们做的事情之一是在查看数据之前确定权重。然后，如果在看到结果后需要更改权重，自我约束改变权重以单纯追求更好表现的诱惑就会容易得多。\n\
  \n这是年度调查的另一个重要用途。我们可以询问客户，哪些衡量因素最重要。只需询问“解决时间”是否比“响应时间”更重要。你就能发现，等待 30 秒是否比不得不多次回电修复同一个问题（准确性）更麻烦。\n\
  \n当然，你也可以对所有这些因素进行等权加权。\n\n除了对交付的各个组成部分进行加权，我们还可以对三个类别——交付、使用和客户满意度——进行加权。权重应该清晰地传达给查看报告卡的人。\n\
  \n让我们看看如何将绩效度量汇总成一份报告卡。\n\n\n\n### 将数据汇总为等级\n\n现在，我们将前面讨论过的各个组件——用于衡量有效性、三角验证、预期和转换网格的答案关键词类别——整合起来，生成最终的“等级”。这为员工、经理和领导层提供了一种快速、清晰地传达客户对您表现看法的方式。\n\
  \n你需要用到之前的转换网格（见图 10-15），但这次使用中性色调，以降低“超出预期”天然被视为好的倾向。\n\n![images](img/1015.jpg)\n\
  \n**图 10-15.** 转换网格\n\n我在此使用的数值并不反映之前分享的信息。我只是想确保你能清楚地理解如何汇总等级并聚合各项衡量指标。表 10-8 展示了所有衡量指标、其预期值、实际值，以及将这些值转换为“字母等级”的结果。这些都可以编入电子表格，以便自动计算等级。\n\
  \n![images](img/t1008.jpg)\n\n![images](img/t1008a.jpg)\n\n在表 10-8 中，“等级” (显示在`结果`列中)\
  \ 已被转换为字母值——如果实际衡量指标超出预期，则记为`E`；符合预期则记为`M`；未达到预期则记为`O`。\n\n在每个项目（信息层级）内，总等级是使用转换网格计算平均值得出的。如前所述，你甚至可以在类别内使用权重。例如，可以将“30\
  \ 秒内放弃的通话”权重设为 85%，而“放弃通话总数”权重设为 15%。另一个例子是，可以将“整体客户满意度”与其余三个满意度问题之和（各占 16.6%）设为同等权重（各占\
  \ 50%）。在本例中，我们将采用这两个加权选项，其余指标在其各自的信息类别内均采用同等权重。表 10-9 展示了将等级逐步汇总到最终“报告卡”的下一步流程。注意：等级旁边的双星号表示在更低层级存在`O`等级。\n\
  \n![images](img/t1009.jpg)\n\n![images](img/t1009a.jpg)\n\n让我们看看这两个加权指标。如果“可用性”指标权重相同，总等级将简单地是这两个等级（10\
  \ 和 5）的平均值，得出 7.5 分。如果四舍五入，这将会变成`E`。但是，由于我们总是倾向于追求卓越，因此我们不会向上取整。你必须完全达到该等级才能获得对应的字母等级。如果权重互换（“放弃通话总数”占\
  \ 85%，“30 秒内放弃的通话”占 15%），那么总等级将变成`E`，因为仅“放弃通话总数”的 10 分就已经给了你 8.5 分，甚至还未考虑“30 秒内放弃的通话”。\n\
  \n在满意度评分中，我们发现尽管有一个`M`，但总等级仍然是`E`。如果不将整体满意度权重设为 50%，而是对所有三个问题赋予相同权重，那么总等级将简单地是四个等级的平均值，得出\
  \ 8.75 分。仍然是`E`，但分数更低。\n\n请注意，`速度：响应时间` 的结果是 `M`（符合预期），但我加了一个星号来表示下面隐藏着一个`O`。同样，由于下面隐藏着一个`E`，可用性总等级也做了相同处理。这有助于报告卡的查看者快速判断是否需要深入查看信息。被埋藏的`E`和`O`是需要识别出来的异常情况。\n\
  \n让我们继续分析这些结果。如果我们采用为“交付”设定的权重（`速度`占 50%，`可用性`占 35%，`准确性`占 15%），我们将得到交付的下一个层级等级，如表\
  \ 10-10 所示。\n\n![images](img/t1010.jpg)\n\n让我们以同样的方式继续到表 10-11。\n\n![images](img/t1011.jpg)\n\
  \n我们再次面临抉择。`交付`、`使用`和`客户满意度`价值相等吗？只有在试图将所有等级汇总为一个总等级时，才需要做这个决定。在我的组织中，我们止步于这个层级，选择将这三大关键信息类别分开处理，即使跨不同服务也是如此。因此，如果我们汇总三个支持服务（服务台、二线和三线支持），我们会分别展示`交付`总览、`使用`总览以及`客户满意度`总览。我们发现，使用这种基本的三角验证方法来审视服务，已经足够满足我们的需求了。如果你想将其汇总为一个最终等级（GPA），剩下的唯一问题就是权重。为了本例的目的，我们将其简化，赋予它们相等的权重。\n\
  \n![images](img/t1012.jpg)\n\n因此，服务台的最终报告卡，基于每个信息类别的权重，得出的总等级为`M*`。这很容易被解读为：整体服务符合预期，但存在一些需要调查的异常情况。\n\
  \n如果你像我的组织那样看待这些等级——不将主要类别汇总为一个总等级，而是分别查看每个主要“科目”领域——你将得到以下结果：\n\n- *交付*：`O` 表示存在改进的**机**会。此时应花时间调查异常原因。\n\
  - *使用*：`M` 表示我们**符**合预期。此区域无需调查。\n- *客户满意度*：`E` 表示我们**超**出预期。此时应花时间调查异常原因。\n\n最终的总结性报告卡将如图\
  \ 10-16 所示。\n\n![images](img/1016.jpg)\n\n**图 10-16.** 报告卡\n\n对于每一项，在调查结束后，都应附上叙述性文字。这些文字向领导层阐明服务提供者所确定的异常原因，以及为减轻、避免、纠正或复制这些原因而建议采取的任何行动。这些变更针对的是流程（而非人员），并且应旨在控制未来的结果。\n\
  \n如果我们从过去的错误中吸取教训，就不应继续重蹈覆辙。\n\n同样，如果我们从过去的成功中学习，就应该找到方法将异常变为常态（如果这被认为是公平合理的选择的话）。\n\
  \n\n\n### 回顾\n\n报告卡使我们能够汇总指标各个层级的评分。你可以自行决定在哪个层级停止整合成最终分数。你并*不*必须以单一分数作为最终结果。本章通过逐步示例，展示了前述概念如何（并已经）被应用于创建服务级指标。\n\
  \n我以这样的方式进行了回顾：从数据出发，再到衡量指标，进而形成信息，最终构建出指标。从衡量指标阶段起，我展示了如何为每一步应用期望值，从而赋予每个部分背景和意义。除应用期望值外，我还介绍了一种标准化方法，用于在不同衡量类型和领域间统一信息。使用百分比仅仅是实现一致性的方式之一。当你运用不同的衡量指标来评估各类服务和产品时，你会发现这种方式可能并非始终易于操作。根据我的经验，所用的衡量指标在类型上会有所不同。\n\
  \n另一种标准化工具是评分方法，其核心是每一步都力求向卓越倾斜。正因如此，“待改进项”被记为零分，且只有“超出预期”才能将其平衡至“符合预期”。由于我们不采用向上取整（再次确保向卓越倾斜），仅一项“待改进项”就会使总（平均）分永远无法达到`M`，除非其中包含一项`E`。\n\
  \n我们追求的是“符合预期”。其他任何结果都属于异常情况，需要进行调查。\n\n请回顾以下几种可能造成印象偏差的方式：\n\n-   艺术加工——颜色选择、对齐方式等。\n\
  -   用于表示衡量指标的刻度\n-   用于呈现数据的格式（比率、平均值、百分比等）\n\n总体评分能够提供对评估对象健康度的“整体感知”。将各分数汇总为“最终分数”是可行的，但并非总是可取。这取决于目标受众。\n\
  \n报告卡展示了如何展示、汇总和报告你的指标结果。它并未深入探讨你可能选择用于收集数据的工具。我用作示例的组织有多种自动化工具、一些人机交互工具，以及完全主观的调研问卷。请检查你所在组织的现有数据源。通常，你可以（在不引人注意的情况下）收集数据的地方比你预期的要多。\n\
  \n应当发现并利用其他数据收集工具。高等教育 TechQual+项目仅仅是一个（免费的）基于调研问卷的工具示例——即使你不在 IT 组织内，该工具的理念也可应用于你的服务和产品。\n\
  \n*“重要的不是你看什么，而是你看到了什么。”*\n\n——亨利·戴维·梭罗\n\n创新并非提出一个全新的概念或想法。最伟大的创新往往源于以新的视角审视已存在的事物。托马斯·爱迪生的一大优势，便是在他人尝试发明新事物时，看到了他们错过的要点。\n\
  \n## 结论\n\n报告卡是创建记分卡的另一种方式，其额外好处是允许你在需要时将各项衡量指标汇总为单一分数。通过识别衡量指标和信息中的异常值，你可以明确标记哪些是异常情况，并仅将时间投入到那些需要深入调查的异常点上。这使你能够：\n\
  \n-   识别需要进一步调查的领域\n-   仅在必要的地方投入资源\n-   使用通用评估语言，对单一服务或一组服务的健康度建立“整体感知”\n\n关键在于你使用什么工具来收集、分析、汇总或报告你所开发的信息和指标。关键在于找到一种方法来完成这项工作，使其能被你的受众轻松理解。你的指标必须以正确的方式，向正确的受众讲述恰当的故事。\n\
  \n## 进阶指标\n\n你可能在想：“我什么时候应该考虑使用‘答案指引’中的其他象限？”我一直尽力避免在你所在的组织有时间充分运用产品/服务健康度指标（该部分能带来最初的最大收益）之前，让你深入探究其他象限。这并不意味着你不能构建指标来回答特定的根本问题。但是，如果你负责制定指标计划（或者正在分配这项任务），我鼓励你逐步将这些概念和工具引入你的组织。\n\
  \n图 11-1 再次展示了“答案指引”，以便我们回顾你已走过的路径（有效性）以及本章将带你前往的方向。\n\n![images](img/1101.jpg)\n\
  \n**图 11-1.** 重温答案指引\n\n### 浅尝其他象限\n\n那么，你应该在何时着手处理其他三个象限？很有可能，在你在各个象限全面展开正式的指标计划之前，会遇到三方面的机会，让你得以在这些象限中测试水温。\n\
  \n#### 1. 作为产品/服务健康度工作的支撑\n\n如前所述，在服务/产品健康度（有效性）象限内工作时，你很可能会遇到开发和运用流程健康度（效率）衡量指标的机会。举个例子，当你的某个有效性指标出现偏差，你想要改进现状时。假设你的解决速度指标显示低于预期。经过尽职调查后，你发现根据组织的服务级别协议，解决客户问题所花费的时间超出了应有范围。这时，你可以主动与负责该服务的团队合作。你可能需要定义流程，并在过程中设立衡量指标，看看是否能够优化流程。这些衡量指标很可能属于流程健康度范畴。\n\
  \n你可能还记得，我曾强烈反对在你或你的组织尚未准备就绪时，就深入探究效率衡量指标。我还警告过管理层可能会倾向于走这条路。那么，为什么我现在又告诉你，你可能不得不这样做呢？在这种情况下，效率衡量指标将仅用于特定目的——解释有效性异常的原因。这将是一种非常聚焦且有限的使用效率指标的方式。并且，它们将由有效性指标驱动。\n\
  \n#### 2. 指导流程改进工作\n\n另一个早期涉足其他三个象限的机会，可能出现在你进行流程改进工作时。如果你正在使用任何当前流行的改进方法（如六西格玛），你会被要求开发衡量指标——这不仅要证明你的努力取得了成功，还要帮助确定需要改进的地方。虽然这些衡量指标*可能*来自服务/产品健康度象限，但很多时候它们来自“答案指引”中的其他领域。\n\
  \n这完全没问题。\n\n我关于不要从其他三个象限起步的告诫，是基于我不希望你在尚未准备好之前，就在这些象限内“开发一个完整的体系”。如果你是为了配合某项特定工作而开发指标，那么你完全可以使用来自任何象限的衡量指标。\n\
  \n\n\n#### 3. 配合组织发展工作\n\n当你的组织启动发展工作时，应纳入衡量成功的指标。这些指标能明确目标，并让参与者清楚自己距离终点还有多远。\n\
  \n作为一名战略与规划顾问，我曾参与过多个组织发展团队的工作。最近的一个项目包括职业发展团队和员工融合团队。每个团队都希望有指标来展示进展，并尽可能体现成功的程度。\n\
  \n假设有人问你：“我们如何判断自己是否成功了？”或者“我们怎么知道什么时候才算完成？”你的回答通常是：“指标会告诉我们。”\n\n这些衡量指标取决于所涉及的工作。工作内容通常决定了这些指标属于哪个象限。如果你在进行员工职业发展培训，那么指标应归属于\"\
  组织健康\"象限。如果你的问题围绕组织战略目标的实现情况，则可能属于\"未来健康\"象限。\n\n重申一下，这些指标与我之前介绍的\"产品/服务健康\"指标的主要区别在于：它们是针对特定工作产生的根本问题的回应性指标。这些指标的范围应有明确界定。而我提供的产品/服务健康指标是长期指标体系的基石，而非针对特定工作的衡量。\n\
  \n这些围绕特定工作建立的指标，仍然可能具有“风险性”。但由于它们与特定工作“绑定”，恐惧、不确定性和怀疑等风险更容易被化解。\n\n或许更准确的说法是，应将它们视为“其他指标”而非高阶指标。它们并不比有效性指标更复杂。\n\
  \n## 指标为不成熟组织带来的益处\n\n在探讨其他象限的指标之前，让我们先退一步，审视一下我们所处的整体环境。我一向认为，对于一个无法成功推进企业级改进工作的组织而言，指标作为改进工具并不适用。（我在《为何组织如此努力却改进甚微》一文中提供了一份评估，用于判断你的组织是否患有\"\
  组织不成熟症\"。）我之所以长期坚持这一观点，是因为指标本身固有的危险性和风险。我曾目睹恐惧滋生并毒害整个组织——这种恐惧源于定义不当和实施不善的指标。\n\n\
  尽管我仍认为指标是最具风险的工具之一（甚至可能是风险最高的），但我对指标在推动组织前进方面的价值有了新的认识。\n\n我指的不是通过衡量来改变行为——我认为那是指标最危险的用法。不，我指的是实施指标计划带来的一些鲜为人知的副产品。我发现，如果运用得当（或至少安全稳妥），指标可以成为改进的催化剂。通过衡量，组织会发现许多自己未曾意识到的问题。\n\
  \n让我们看一个简单的例子。\n\n当衡量某个流程的速度时，组织会意识到自己所缺乏的信息远比想象中多。很多时候我发现，组织甚至没有充分了解所讨论的流程，以至于无法得出必要的衡量指标。这种认知不足正是由于尝试进行衡量而变得显而易见。\n\
  \n衡量会告诉你那些你未曾意识到的未知。\n\n我学过的每一种流程改进方法，都始于定义需要改进的流程。即使在精益六西格玛中，当你的目标是减少浪费和改善流动时，最常用的工具就是价值流图，而这需要你定义流程。但是，如果你不是在开展流程改进工作呢？如果你的上司正在催逼你拿出衡量指标呢？\n\
  \n那么，这些衡量指标同样可能需要全面理解待衡量的流程。你需要提出这样的问题：\n\n> *流程从何时开始？* 即使这个最简单的问题，对一些组织来说也难以回答。是从流程中员工采取第一个行动开始？还是从客户提出请求开始？还是从识别出需求开始？\n\
  > \n> *流程何时结束？* 是交付之时结束？还是用于跟踪流程进度的文档归档之时结束？结束是否取决于服务或产品的成功交付？还是仅仅标志着尝试的完成？\n> \n\
  > *是否存在子流程？尤其是那些你无法控制的子流程？* 流程中可能包含许多子流程——其中很多被误解或未被察觉。这些子流程归谁所有？它们如何影响你的工作？它们是其他步骤的先决条件吗？它们对你成功完成流程至关重要吗？\n\
  \n通过索要数据、衡量指标、信息，以及最重要的——根本问题，你可以促使（甚至迫使）组织明确定义被衡量的对象。在许多情况下，你会发现必须改进被衡量的对象，才能使其变得可衡量。\n\
  \n你可能需要先改进被衡量的对象，才能使其具备可衡量性。\n\n通过衡量，你能更深入地理解被衡量的对象。这包括流程（如果你在进行流程改进工作）、员工互动与政策、战略计划，以及你处理长期项目的方式。衡量促进的另一个改进领域，是实际改变你做事的方式。\n\
  \n## 让你的流程可重复\n\n流程的步骤不仅需要被理解并传达，还应当具有一致性。它们应该是可重复的。在试图以改进为根本目的来衡量流程时，你会推动组织将流程定义得足够清晰，以便进行衡量。这就是为什么实施指标计划带来的最大收益，可能就在于它要求流程被定义并理解到足以衡量的程度。\n\
  \n即使你定义了流程，除非每次执行时都保持一致性，否则你仍然无法获得有用的衡量数据。这种一致性为修正和改进提供了可能。\n\n你可能已经注意到，我喜欢用体育类比。这里举个简短的例子。我常常惊叹于有些人能从超过\
  \ 25 英尺（约 7.6 米）外，将篮球投进一个 10 英尺（约 3 米）高的水平圆环里。他们称之为“投篮”，仿佛这让它更显技巧。但简单的事实是，他们只是在扔球。许多人采用高弧度抛投，让球穿网而过而不触碰篮筐金属边缘。尤其让我印象深刻的是，球员们使用的姿势和技巧如此多样。我学到的关键不在于你如何持球、如何调整脚步、如何随球动作、甚至如何让臀部对准目标。简单的诀窍就是一致性。如果你每次都以相同的方式“投”球，你就会进步。不是因为你重复同样的过程（否则你会一直投丢），而是因为你可以做出微小的修正。正因为你的出手方式一致，你才能看到每次微小调整如何改变结果。最终，你会找到那个带来高成功率的正确公式、技巧或流程。\n\
  \n一致性带来改进。\n\n这对你所在组织的流程改进同样适用。你必须理解流程。你必须每次以相同的方式重复流程。你必须衡量结果。然后你可以做出调整来改进结果。你的流程或方法可以是独特的，但它们必须是可重复的，并且被切实重复执行。\n\
  \n\n### 衡量有助于鼓励使用现有流程\n\n你并非必须通过衡量来改进某件事才能对其产生积极影响；仅衡量本身便具备这种能力。这就是那句格言“你衡量什么，就能改进什么”的由来。不过，正如我告诉过你的，衡量也可能导致绩效下降。无法保证衡量的结果必定是改进。唯一能保证的是，你所衡量的事物将会发生改变。衡量行为本身就像一场变革的催化剂——无论是好是坏。\n\
  \n虽然这对被衡量的流程本身如此，但也同样会影响其他相关的流程。例如，在我们的服务台场景中，解决问题电话的速度要求使用问题电话跟踪系统。\n\n当我需要衡量我们几个办公室的问题解决时间时，很快发现技术人员并没有使用问题电话系统。部门经理必须逐一检查每个案例的历史记录来调整关闭日期和时间，因为技术人员没有按照流程要求及时关闭案例。他们往往会等上几天甚至几周才关闭案例。这被视为不重要的文档和文书工作。我不止一次听到这样的说法：“这不是真正的工作——真正的工作是帮助客户。”以及“填写那些东西占用的时间，我本可以用来解决更多问题。”\n\
  \n与大多数争论一样，这些说法中包含相当多的实情。但和大多数事情一样，文书工作非常重要。当部门经理争取额外资源时，这一点至关重要。你不仅需要证明你的工作量超出了员工所能处理的范围，还要证明工作效率高，并且增加更多资源就能解决问题。如果没有证据，这很难证明。而如果简单问题的解决时间显示为几周，领导层自然会认为你效率低下。\n\
  \n当我们开发“成绩单”时，这些经理厌倦了我每个月都去找他们对问题电话跟踪系统中的数据做质量检查。这些数据本该是准确的。我构建的指标并不是数据异常的原因。这些指标只是凸显了员工没有正确使用工具。人们没有遵循为他们创建来跟踪问题电话的流程和程序。经理们*知道*员工没有正确完成案例，但这是一场他们不想打的仗。他们实际上很高兴有一个明确的理由来推动员工按照预期方式使用该工具。\n\
  \n### 其他象限中的衡量指标\n\n在第 5 章（讨论了如何使用“答案卡”）和第 6 章（涵盖了有效性指标）中，我讨论了四个象限。我还建议你从有效性开始，以效率结束。虽然你可以（谨慎地）使用效率指标来支持你的产品/服务健康度指标，但你不应该一开始就全面推行流程健康度计划。\n\
  \n我建议添加到你的指标计划中的第二个领域是员工视角，即组织健康度。这可以为你的组织带来巨大的好处。通过关注你的“最大资产”，你可以帮助建立一个更强大、更优秀、更快速、更快乐的组织。第三象限内的衡量将帮助你实现这一目标。\n\
  \n开发组织健康度视图的额外好处，与为什么有效性是最安全的起点是同一个道理。员工误解你意图的风险要小得多。产品/服务健康度指标是从客户的角度出发的。更容易让员工相信，有效性指标不会用来针对他们，因为它们反映了客户的观点。伴随着较低风险因素的最大好处是，通过衡量产品/服务健康度，你可以改善客户对你组织的看法，从而改善你的底线（即使这个底线并非财务驱动）。\n\
  \n通过接下来关注组织健康度（图 11-2），你仍然可以规避相关风险，甚至比有效性指标更容易，因为这些指标是*为了*员工而并非*关于*员工。它也有助于改善你的员工对你的组织的看法。这应该会提升士气、忠诚度和奉献精神。它还应该提高生产力——不是通过衡量、控制和操纵行为，而是通过向你的员工证明，当你说他们是你最大的资产时，你是认真的。\n\
  \n#### 组织健康度\n\n![images](img/1102.jpg)\n\n**图 11-2.** 答案卡的第三象限\n\n你不必只听我的一面之词。发布“500\
  \ 强”企业榜单的《财富》杂志与卓越工作场所研究所合作，评选出“最佳工作场所 100 强”。员工满意度是公司成功的关键因素。\n\n短期内，一家公司可以在员工不快乐和不满的情况下取得巨大成功。专制式领导方式在短期内可能有效。但如果你希望公司获得长期的成功，员工视角至关重要。\n\
  \n《财富》500 强是衡量公司当前成功的一个良好指标。成为最佳工作场所 100 强之一可能有助于你判断一家公司未来是否会成功。第三个可用的衡量指标是根据《彭博商业周刊》评选的\
  \ 100 家“最具创新力公司”。（表 11-1 列出了同时出现在这三个排名中的公司，而表 11-2 则列出了同时出现在《财富》500 强和最佳工作场所榜单中的公司。）\n\
  \n![images](img/t1101.jpg)\n\n有时候，信息少一些反而更好。观察稍少一些信息能为我们提供一幅不同且可能更清晰的图景。选择使用哪些数据是设计指标的重要部分——如果你对你试图回答的根本问题有清晰的理解，这一步会容易得多。\n\
  \n![images](img/t1102.jpg)\n\n![images](img/t1102a.jpg)\n\n\n\n### 概念\n\n在撰写本书的研究过程中，我意识到如果我在找工作，我会更关心找到一家“最佳雇主”，而不是《财富》500\
  \ 强企业。但你可能并不需要寻找衡量下一份雇主的指标。你更可能是在思考需要哪些指标来改进你的组织，以及如何衡量进展。\n\n与登上许多排名榜单类似，你必须提交信息并完成调查，才能被这些公司评估。要成为“最佳雇主百强”之一，你需要花费时间和精力填写相关文件。这不仅涉及你或你的领导层，你的员工也需要完成一份评估工具。\n\
  \n从认可与奖励的角度来看，这是一个有用的工具。但这不是必需的。真正必要的是，你要获取员工的视角，并致力于打造一个坚实而健康的组织。这是一个组织（或领导者）可能陷入“追逐数据”而非努力实现目标的例子。\n\
  \n目标必须独立于用来衡量其实现程度的指标。\n\n目标不应该是“跻身百强榜单”，但目标可以是成为百强公司。你是否被认可为百强公司并不重要。重要的是你拥有一个符合标准的健康组织。你的目标不应该是让员工满意度调查达到某个内部分数，而应该是拥有健康、快乐、忠诚的员工。你可以用调查来衡量这一点，但微妙之处在于细节。如果你只看重调查结果，可能会错失关键，那将是令人尴尬的时刻。\n\
  \n我不止一次看到，某个团队或个人根据收集的衡量标准获得了组织颁发的奖项，但获奖者本人（或团队）却坦言自己不“配”得奖。有人填写了文件，有人回答了调查，有人在不知全貌的情况下提交了提名。当员工获得他们认为并非应得的认可和奖励时，奖励系统在获奖者和其他人眼中就会失去可信度。\n\
  \n如果你追逐数据，就会忽略这一点，最终可能会相信：\n\n1.  你的项目运行良好，因为你收到了大量提交，并且定期颁发奖励。\n2.  组织健康状况良好，因为颁发了很多奖项。\n\
  \n如果员工认为这些奖项给错了人，或者给了不配得到的人，那么该项目将遭受重创。不幸的是，项目管理方（以及领导层）可能永远不会意识到该项目不被视为有效。\n\n\
  不要误解。员工非常关心公司的成功。不仅仅是为了工作保障和每年期望的加薪。一个热爱自己工作、热爱自己公司并对组织忠诚的员工，会像一位热爱母校并关心学校持续成功的大学毕业生一样，关心公司的成功。你的员工队伍可以与组织建立牢固的情感纽带。虽然员工关心公司的成功，但他们也希望领导层关心他们。员工希望他们的上司关心他们。\n\
  \n好消息是，如果领导层和管理层真正关心员工，并把相当多的注意力放在改善员工的工作体验上，那么整个公司都会受益。\n\n##### 员工满意度\n\n如果员工对自己的工作感到满意（快乐），他们会更加努力。他们会寻找帮助组织成功的方法。他们会对公司的成功感到自豪，并视如己出。\n\
  \n在校园里散步时，我习惯性地捡起散落的垃圾。有人问我为什么这么做。我听到过各种争论，有人说有专人负责打扫，说人们还是会乱扔，还说捡别人的垃圾会“有失身份”。我只是微笑，对所有人说同样的话：“这是我的大学。我为什么不清扫它呢？”如果有垃圾飘过我的院子，我也会捡起来。你应该希望你的员工感觉公司是他们的，而不是\
  \ CEO 的。\n\n### 培训\n\n另一个双赢的机会在于培训。当你用真金白银来兑现承诺时，员工会知道你把他们视为宝贵的资产。这种投资不一定是加薪——虽然我没听说过有人对加薪不高兴——但可以是资助他们深造的形式。如果你相信员工是宝贵的资产，你会乐意投入让这项资产变得更加有价值。你可以把精力集中在试图操纵和控制员工的行为*上*，或者你可以专注于建立信任和忠诚度。当你培训员工使其工作更出色时，他们能变得更有生产力。这能建立自豪感。这也让他们知道你关心他们。而且，这能让员工工作起来更高效、更有效。\n\
  \n### 工作环境\n\n你的员工是在拥挤的空间工作吗？你的员工是在格子间农场里生存吗？照明条件差吗？温度控制是否充足？这里是一个快乐的工作场所吗？走廊里的笑声是被视为健康工作环境的标志，还是员工不够忙的信号？\n\
  \n环境很重要！大多数员工在清醒的时间里，待在一个小办公室空间的时间比在任何其他地方都长。\n\n如果你每周五天，每天超过八小时都处于同一个环境中，那么这个环境应该能激发高效的工作。它应该是一个创新、有趣、积极、有回报的工作场所。这不仅关乎设施，也关乎组织的文化。\n\
  \n\n\n##### 奖励与认可\n\n每个人都渴望被关注，希望得到奖赏。事实上，所有生灵都喜欢积极的关注，这能让人感觉良好。这是提升组织健康度的最佳方法之一，但也是最难做好的方法之一。问题在于你必须确保方法得当。正如前文所述——如果奖励错了对象或奖励了不该奖励的行为，你的努力就会适得其反。在发放奖励之前，你必须确保接受者是正确的人选，并且他们确实做出了正确的贡献。这不仅仅需要建立一个\"\
  认可计划\"，也不仅仅是设置一个员工相互提名的系统。它要求管理者真正关注员工的工作表现，关注谁在真正推动积极变化。\n\n搞砸的方法比成功的方法多得多，具体如下：\n\
  \n1. *散弹式奖励*。对所有人进行无差别奖励行不通。\"你们都是优秀员工，所以我给整个组织放一天假！\"如果并非*所有人*都确实表现出色，问题就来了。员工们心里清楚谁是好员工、谁不是。散弹式做法向团队传达的信息是：\n\
  \   1. 你不了解他们\n   2. 你也不想去了解他们\n2. *选举式流程*。如果你推行一个让员工可以提名人选、然后由管理员筛选决定获奖者的程序，那么你创造的将更像是一场游戏，而非真正的奖励与认可工具。员工要么无视这套系统，要么会观察你能给错误的人发多少奖励。在员工眼中，问题很简单：\n\
  \   1. 领导和管理层应该足够关心，了解员工何时值得表扬\n   2. 你在要求员工替管理层完成分内工作\n   3. 信不信由你，大多数应受奖励的员工会羞于提名自己，因此他们会感到更受轻视——因为你强迫他们这样做，或者让他们找别人提名——再次强调，这应该是管理层的职责。\n\
  3. *光环效应与尖角效应*。员工本就认为存在\"宠儿\"。当你推行一套持续奖励那些被认为是宠儿（即便他们\"最近\"并无建树）的程序，同时继续忽略那些过去未曾受到关注却做出优秀成绩的员工时——团队会确信\"\
  富者愈富，穷者愈穷\"。\n\n当然，你可以尝试将奖励和认可建立在绩效指标之上，但这本身也存在一系列问题——包括鼓励\"追逐数据\"。归根结底，这些问题的重要性仅在于它们会影响你为判断组织健康度而制定和使用的衡量指标。\n\
  \n## 衡量组织健康度\n\n理解员工的真实想法将有助于你为这个象限正确设计衡量指标。在审视每项指标时，你必须牢记潜在的问题和失误。\n\n### 员工满意度衡量\n\
  \n这一点毫无意外。你必须包含询问员工感受的工作。但除了收集访谈或调查问卷的主观反馈外，我们仍需借助三角验证法来获取其他衡量指标。我们需要一些客观指标，如留任率和离职率。我们还需要了解各类申诉记录的数量。制定优秀衡量指标的规则并未改变——只是侧重点不同。\n\
  \n### 培训\n\n培训衡量指标应包括技能水平、技能水平的变化，以及所接受培训的数量和质量。您还可以设置基于成熟度的问题，例如：\n\n* 员工是否有培训计划？\n\
  * 是否使用职业发展项目？\n* 技能水平多久评估一次？\n* 是否有交叉培训计划？\n\n但其他简单的衡量指标也同样有效，包括：\n\n* 使用的培训时长\n\
  * 接受培训的员工数量\n* 参与内部培训的员工数量\n* 要求技能水平与现有技能水平之间的差距——以及这个差距是否在缩小\n\n培训还应包含技能。除了已给出的建议，你还可以衡量：你的员工中有多少人被视为所在领域的专家？其他公司是否会向他们寻求建议？你的同行是否认为你的员工是专家？你的员工是否有发表过文章？是否在会议上做过演讲？他们是否被鼓励成为公认的专家？\n\
  \n### 工作环境\n\n同样，问卷调查可以有效确定员工满意度水平。但如同衡量员工满意度一样，你应该寻找其他方式来收集指标，最好是更客观的指标。以下是衡量工作环境健康度的一些可能指标：\n\
  \n* 病假和/或年假使用天数（任何方向的极端值都可能表明工作环境不健康）\n* 员工离职率\n* 走廊里的笑声（以及当老板走过时笑声是否持续）\n* 员工墙上照片的数量（你的员工是否把工作空间布置得宜人，还是像牢房？）\n\
  * 早到和晚走的情况\n\n对于所有示例，问题不在于什么是好是坏，而在于你是否看到了极端值或异常情况。无论哪种情况，它们都表明工作环境的健康度可能存在问题。消极的极端值（例如高缺勤率）固然令人担忧，但任何极端值（比如员工不休年假）也可能是问题的征兆。除了极端值，你还需要调查异常情况（即偏离你组织既定规范的事情）出现时的情况。\n\
  \n\n\n##### 奖励与认可\n\n了解你的团队成员是否感到自己受到重视，这一点至关重要。除了衡量员工在公司内部是否得到了恰当的奖励和认可，你还需要评估他们是否也获得了外部机构的表彰。管理层或领导团队可能需要考虑以下问题：\n\
  \n*   员工是否做出了卓越的成就？\n*   你对你的员工队伍了解多少？\n*   你是否了解员工的爱好和消遣方式？\n*   你是否知道他们是否因工作以外的成就而获奖？\n\
  *   你的员工是否为社区做出了重大贡献？\n\n如果你想衡量“奖励与认可”计划的有效性，可以使用员工满意度指标。如果不了解员工是否认为你的做法得当，就很难评估该计划的价值。你也可以衡量计划本身，例如包含以下几个方面：\n\
  \n*   颁发的奖项数量\n*   获得奖项提名的员工人数\n*   每年获得认可的独特员工数量\n\n对于不成熟的组织，我会建议采用这些衡量指标。奖励与认可计划的问题在于，你*需要*一个这样的计划。有趣的是，我们在没有正式计划的情况下，照样会奖励和认可自己的孩子。有趣的是，我们足够关心他们，会留意他们的成功和失败。父母了解孩子的成就，因为他们在乎孩子能否成功。很多时候，父母会认为孩子的成功就是他们自己的成功。\n\
  \n遗憾的是，管理者似乎做不到这一点，尽管通常会努力确保不要让一个人管理太多下属。\n\n出于某种原因，管理者似乎无法充分关注员工的成功。相反，管理者却对每个员工的失误和不幸了如指掌。这可能是因为错误会被上报给管理者，而很多优秀的业绩却默默无闻。我不打算试图解决实施奖励与认可计划的复杂性。但我确实想强调，衡量这个计划会很有问题，因为你可能根本不想*需要*一个计划。更好的做法是培养一种认可文化。\n\
  \n这才是值得衡量的东西。\n\n#### 未来健康\n\n我建议你处理的第二个象限是未来健康（象限四），如图 11-3 所示。\n\n![images](img/1103.jpg)\n\
  \n**图 11-3.** 答案手册的象限四\n\n### 概念\n\n我们来看看答案手册的象限四。当我说到未来健康时，我指的并不是一个组织未来的财务状况。你可能已经注意到，我根本没有提及财务稳定性。原因在于，我在本书中提出的指标是围绕成熟度方面的健康，而非财务方面的健康。\n\
  \n衡量财务健康（例如《财富》榜单）以及衡量未来财务增长潜力的方法已经有很多。这个领域已被充分探讨，我并不认为你需要去开发或制定这类指标。你应该能找到很多衡量公司财务健康状况的资源——比如市盈率、流动性（公司手头有多少现金）或杠杆率（公司相对于其资本的借款金额）。\n\
  \n从成熟度的角度看，一个组织的未来健康包括其承担并实现大规模项目和计划的能力。实施度量计划实际上就属于这个范畴。组织能否很好地承担这些复杂的任务？组织的能力是否仅仅局限于完成日常运营？\n\
  \n当我指导他人制定愿景时，我会不断提醒他们，切莫深陷于战术层面的琐事。他们必须从战略层面看待事物，进行战略层面规划，并始终专注于长期目标。不成熟的组织做不到这一点。如果你发现自己被日常的繁重工作淹没，无法抬头长远展望，或者无法高瞻远瞩地看到组织的长期目标，那么你的未来健康就岌岌可危了。\n\
  \n在基础层面上，组织必须能够为未来设定强有力的目标，确定工作优先级，并能够完成项目或计划层面的工作。如果组织连这些基本要素都做不到，那它很可能永远无法成长，将停滞在当下。\n\
  \n##### 项目/计划状态衡量指标\n\n要衡量项目和计划的执行情况，就需要有执行这些大规模任务的政策和程序。通常情况下，项目需要跨职能的参与，并在组织内部（可能也包括外部）的不同单位之间共享资源。围绕项目最简单、最基础的衡量指标就是项目工作本身的健康指标。这些指标可以基于状态更新来构建，可能涉及以下问题：\n\
  \n*   有多少个项目正在进行中？\n*   有多少个项目在排队等待？\n*   有多少个项目被搁置？\n*   有多少个项目已经完成？\n\n你可以进一步扩展项目指标。我们公司已经开发了一套全面的衡量指标，包括：\n\
  \n*   项目满足时间表的程度\n*   实际交付与预期目标的对比情况\n*   预算执行情况\n*   交付成果的质量（存在的缺陷数量）\n\n与第一和第三象限一样，我们也希望运用三角验证法，以确保衡量指标的全面性。为此，你可以增加以下衡量指标：\n\
  \n*   发起人/项目负责人对结果的满意度\n*   项目成果的使用情况（制度化程度）\n\n项目/计划状态的许多衡量指标，看起来与你用于衡量目标达成度的指标类似。这很合理，因为大多数项目都可以描述为实现特定目标而做出的协同努力。\n\
  \n\n\n"
- '# 战略规划与目标达成衡量


  如果你已经制定了 SMART（具体的、可衡量的、可实现的、现实的、有时限的）目标，那么衡量标准也就随之确定了。这些将成为衡量目标成功与否的指标。即便如此，我还是要提醒你，不要为了追逐数据而忘记初衷。


  假设你的目标是“在未来六个月内将会员数量增加 50%”。这是一个相当清晰的目标（具体）。它无疑是可衡量的（当前会员数与六个月后会员数对比）、可实现的（假设有足够多的潜在会员使之可行）、现实的（同样，假设这并非不合情理）且有时限的（从现在起六个月后）。


  因此，你可能会争辩，既然目标就是实现 50%的增长，为什么不追逐数据呢？目标本身就体现在数据中——即增加会员数量！从某种程度上说，你完全正确。问题在于，我们只关注了这个陈述的目标，而忽略了目标背后的深层原因。这就是为什么衡量领域要包含战略规划。如果你纯粹追逐数据，你可能会找到一些增加会员数量的方法，但这些方法未必符合目标的根本意图（即长期或永久性地扩大会员基础）。你可能会改变“会员”的定义规则，以便达成数字指标；你也可能提供一些激励措施，结果只带来了暂时性的增长（虽然达成了目标，但却偏离了方向）。


  除了目标定义中已明确的衡量标准，你可能还需要衡量以下几点:


  -   实现目标的成本

  -   实现目标所花的时间（展示随时间推移的进展）

  -   实现目标带来的实际收益（这是一个很少被捕捉到的难点）


  特别是针对战略规划部分，你需要衡量规划的有效性。这可能包括：


  -   总体目标达成情况（作为规划的组成部分）

  -   对规划时间表的遵循程度

  -   对规划资源计划（成本、时间、精力）的遵循程度

  -   对规划的遵循程度

  -   规划被修订的频率（调整得越频繁，越可能是一份活生生的、有用的规划，而非束之高阁的文件）


  在衡量战略规划的价值、目标的实现情况以及项目和计划的效能时，你会意识到要做好这些工作需要一定的优先级排序。优先级设定可以是正式或非正式的，但无论哪种情况，你都需要一个确定优先级的流程。


  ## 优先级设定衡量


  优先级设定的衡量标准，很像衡量准确性。这是一套简单的衡量指标。你是否坚持了自己设定的优先级？还是任由最新的需求打乱你的优先级？你是否会让“噪音最大的那个轮子”获得关注？你的所有计划是否在第一次危机出现时就全盘推翻？


  当然，如果真的发生紧急情况，你可能不得不放下一切去解决危机。但是，你是否发现*总是*有危机存在？你是否发现，一旦紧急情况被克服，你的组织就不会再回到优先级清单上？


  如果一个组织无法设定或坚持既定的优先级，那么它将很难成长。优先级设定不仅指明了方向，还意味着要识别出那些*不会*被执行的任务、目标和项目。要真正成熟起来，一个组织，如同个人一样，必须意识到它无法完成所有被要求的事情。你必须做出一些艰难的决定。如果做不到，你可能会发现自己做了很多事情——甚至超出了预期——但其中很少有自己真正想做的。


  我们要讨论的最后一个象限，是大多数管理者最想开始的——流程健康，如图 11-4 所示。


  ## 流程健康


  你应该处理的最后一个象限是流程健康，即第二象限。


  ![images](img/1104.jpg)


  **图 11-4.** 答案键的第二象限


  ### 概念


  你已经坚持到了这里，终于有机会来运用效率衡量指标了。或者，你可能是跳到了这一部分，因为你*必须*使用它们。流程健康衡量指标风险最高，因为它们最容易滥用。这相当于一位教练掌握了每位球员的生产力统计数据。比如，知道你的球员在面对即将到来的系列赛中每位投手时的击球率。你知道他们在夜场比赛、日场比赛中的表现，甚至知道他们上次进食已过去多久。让我们让它更有意义一些，假设你还有关于所有情况下成本多少、耗时多久、资源如何分配以及工作质量如何的数据。


  但是，如果你想根据数据来安排阵容，你可能还想要更多数据。比如，根据他们吃了什么、喝了什么、具体时间、前一晚睡了多久、星期几来表现如何。这样的清单可以无限列举下去。这就是问题所在。


  要点很简单。虽然关于每个工人在特定情况下表现如何的数据、衡量指标和信息是可用的，但这并*不是*真理。我之前已经分享过这一点，所以不再赘述。但要明白，你无法通过查看数据来逃避主管、经理或领导者的职责。这无异于一位棒球队经理仅凭统计数据来安排他的阵容。你必须了解你的球员。你必须与他们交谈，与他们*一同*工作，并将每个人放在能够成功的岗位上。


  我经常使用体育类比。不是因为我喜欢体育（尽管我确实喜欢），而是因为体育为如何经营一家企业、如何运作一个组织提供了绝佳的范例。表 11-3 展示了运动队与企业团队之间的对比。你可以选择将自己比作职业、大学或高中运动队——就像你可以选择把公司看作大型、中型或小型（夫妻店）组织一样。


  ![images](img/t1103.jpg)


  ![images](img/t1103a.jpg)


  这个类比实际上是无界限的。你可以把它延伸到任何你喜欢的程度。它可以应用于你业务的任何方面。运动队——无论是大学还是职业队——都是工作团队如何运作的绝佳范例。


  如果你的工作团队是一支运动队，他们会有多成功？


  当一位体育经理查看个人和团队的数据时，她会利用这些数据来改进每个人。她的意图是找到让团队尽可能成功的方法。她*可以*将数据作为与球员谈论其表现的起点。如果她发现该球员的表现无法满足其职位需求，她极有可能会尝试培养该球员的才能。团队已经在该球员身上投入了资金。但最终，如果她无法让该球员达到所需的水平，她可能会让他离开并招募新球员。（我甚至喜欢球员是“招募”和“选拔”而来的，而不是“雇用”的。）


  一位优秀的经理会以同样的方式对待绩效衡量指标。他不会利用指标来操纵员工改变行为。他会利用这些信息与员工合作，提升她的能力，尽其所能地培养她。如果像体育经理一样，他失败了，他可能不得不让她离开并雇用新员工。


  请记住，如果劳动力是组织最重要的资产，那么经理的工作就是将这些资产的潜力开发到极致。运动队知道什么是最重要的资产——并且相应地支付报酬。


  经理的职责是最大限度地开发劳动力的潜力。




