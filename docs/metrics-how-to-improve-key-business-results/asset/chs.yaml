- "# 视角三角互证\n\n三角互证是一个简单的概念。尽可能使用多种数据来源，使用一种以上的衡量方式、一种以上的收集方法、一种以上的视角。就你们所讨论的象限而言，不同的视角*并非*指以下四种观点：\n\
  \n1.  顾客的\n2.  企业（管理者）的\n3.  员工的\n4.  领导层的\n\n相反，我提供的是以下视角：\n\n1.  客观的、无顾客参与\n2.\
  \  顾客行为（观察）以及\n3.  顾客直接反馈\n\n就有效性指标（我建议你从这里开始）而言，你只需处理顾客的观点。\n\n“同时考虑内在和外在的测试因素，迫使每位研究者自觉地意识到自己的每一个行为如何可能影响后续的观察。从这个角度来看，研究成为一种社会行为。”^(2)\n\
  \n如果指标成为一种“社会行为”会怎样？如果指标通过三角互证，结合研究结果的公开分享，变成一种协作活动呢？一种组织内部的*社会行为*？这将有助于消除数据的误用和滥用，允许多种视角以确保数据的准确性，更重要的是，能引导对指标（答案）进行更有意义的解读。这种社会行为也可能促使组织提出更优质的问题。\n\
  \n## 人口统计学数据不算\n\n你可能会错误地基于人口统计学数据来对你的指标进行三角互证。这并非真正的数据三角互证，而是分解。例如，在高等教育机构中，我们经常根据客户群（教职员工和学生）的人口统计数据来看待问题。并非每个客户都能明确归入这三类，所以我们也会考虑非机构关联方、高级职员和家庭成员。虽然这提供了多种不同的数据，但它们并非不同的观点、来源和方法。它们只是对已收集数据的细分。这种分解可能非常有用（尤其是在想了解特定群体的反馈时），但并不构成三角互证。\n\
  \n这些细分对于分析客户群体中的子集非常有用，并能让你满足每个群体的特定需求。但这并不满足三角互证的要求。\n\n______________________________\n\
  \n² 诺曼·K·邓金，《社会学方法：资料集》（芝加哥：阿尔丁出版公司，1970 年），第 471-472 页。\n\n根据邓金的观点，在单一调查中使用多种形式的三角互证可以提高对（观察到的）研究结果的信心。他还提出，衡量方式、收集方法、数据解读人员以及数据来源的多样性越高，信心水平就越高。三角互证的程度越高，信心水平就越高。三角互证的程度越低，信心水平就越低。\n\
  \n我认同这个概念，并且很乐意主张，由多种衡量方式构成的任何指标，其信心水平都会高于由较少衡量方式构成的指标。从其他指标推导出的答案能带来更高的信心水平。\n\n\
  但我并不主张通过处处要求元指标（由其他指标构成的指标）来追求这种信心水平。请记住，有些问题可能甚至不需要一个指标。有些可能只需要一个“是”或“否”的答案。其他的可能需要一个（或两个）衡量指标来提供必要的洞察，以便做出更明智的决策。但是，问题越复杂、越关键，就越需要更高的信心水平。如果你的根本问题将被用于帮助决定整个组织的未来方向以及重大的投资决策，你可能就需要对构建指标所用的单个数据以及指标的总体结论抱有更高的信心。\n\
  \n## 相互矛盾的结果\n\n由于我们使用了不同的方法和数据来源，我们面临着获取相互矛盾结果的真实风险。但是，你不应将其视为负面因素，而应将其视为积极因素。\n\
  \n让我们看看餐厅的例子。如果我们餐厅的有效性指标由交付、使用情况和客户满意度构成，我们可能会期望这三个衡量领域的结果始终一致。如果我们服务好（交付），客户满意度评分就应该高。而如果客户满意度高，我们可以假设回头客多，使用频率也高。我们也期望相反的情况：如果客户满意度低，我们预期顾客不会再来；如果我们交付不佳（速度太慢、送错物品或菜单项目缺货），我们就会预期评分低、使用率低。\n\
  \n这些是符合逻辑的假设，但很多时候却是错误的。每一种排列组合都告诉我们一些不同的信息。在表 7-2 中，让我们看看每个指标简单的高/低结果。当然，你指标的实际结果可能要复杂得多——尤其是当你想到每个指标本身也可以运用三角互证时。交付可能可用性和速度很高，但准确性很差。你可能对某类客户群使用率高，而对另一类使用率低。客户满意度可能在有些方面得分高（员工礼貌），在另一些方面得分低（员工效率）。与其进一步复杂化，不如让我们在更高层次上审视这些指标，同时考虑到在较低层次的三角互证中可能存在的复杂性。\n\
  \n除了对每个衡量领域的单独解读，三角互证本身也提供了若你只收集一两个领域就会缺失的信息。\n\n以我们的餐厅业务为例，让我们解读一些可能的指标。在表 7.2\
  \ 中，你可以看到指标结果的不同排列组合如何讲述不同的故事。虽然每个指标都提供了一些基本见解，但将它们相互关联起来审视才更有意义。\n\n![images](img/t0702.jpg)\n\
  ![images](img/t0702a.jpg)\n\n你可能会争辩说，三角互证似乎使结果更加令人困惑，而不是更清晰。但实际上，三角互证确保你拥有更多的数据以及看待这些数据的更多视角。你拥有的信息越多，你的答案就会越好。但在所有情况下，下一步都应该是一样的：调查，调查，再调查。三角互证的美妙之处在于，你已经拥有了如此多的输入，以至于你的调查可以更有针对性，并且用更少的额外工作获得更大的收益。\n\
  \n设想一下，如果你只衡量了客户满意度。如果你在这方面的评分很高，你能得出什么结论？你可能觉得一切都很美好。但如果你没有赚到足够的钱来维持生意，你就会想知道发生了什么。\n\
  \n三角互证不仅允许你使用不同的数据来回答一个单一问题，它实际上还鼓励你这样做。\n\n\n\n### 回顾\n\n三角测量是构建强大度量体系的根本基础。三角测量有许多优点。使用的三角测量越多，这些优势就越明显。但“凡事有度”这句话同样适用于三角测量——任何事都可能过度。你需要找到适合自己的平衡点。让我们看看以下几个优点：\n\
  \n- 对构成度量的测量数据准确性的信心更高\n- 对收集、分析和报告测量数据所用方法的信心更高\n- 对答案有更广阔的视角——提高准确解读度量的可能性\n-\
  \ 因知道自己在“倾听所有客户的声音”而感到满足\n- 更稳健的度量（如果丢失一项测量数据、数据源或分析工具，你还有其他测量数据可以依赖）\n- 确信自己尽可能全面地“看清”了大局\n\
  \n在测量数据收集和分析的多个环节中都采用三角测量非常重要，包括以下方面：\n\n- 多个数据来源\n- 多种收集方法\n- 多种分析方法（跨不同测量数据，以及愿意对同一测量数据应用不同分析手段）\n\
  - 多个领域（如交付、使用和客户满意度）或类别\n\n在如此多元化的环境下，保持聚焦至关重要。从“答案地图”中不同象限收集数据并不符合三角测量的原则。如果通过混合核心视角来稀释你的答案，你可能会迷失在数据中。如果失去焦点，从“答案地图”中互不关联的部分收集数据，很可能你是在试图用一个答案回答多个问题。虽然元度量会将其他度量作为其输入的一部分，但它们仍需严格限定在根本问题所定义的上下文范围内。\n\
  \n一个扎实的度量最终会引导你探索“答案地图”中其他领域的度量，但这必须在你尽职尽责地回答好当前问题之后。\n\n## 结论\n\n三角测量的概念并非度量开发所独有，它已被证明是利用数据的有效指导原则。\n\
  \n三角测量是创建可行度量体系的主要原则。它需要你付出努力，从更多来源、以多种方式收集和分析更多数据，但作为回报，它带来了诸多好处。在“答案地图”的“产品/服务健康”象限中运用三角测量，能让你获得一套强大的测量数据来构建度量。\n\
  \n通过专注于融合多种来源、测量数据和方法，你最终能得到一个全面的度量。你仍需评估该度量对问题的覆盖完整性，但三角测量能让你更轻松、更少困扰地达到目标。\n\n\
  ![图片](img/0703.jpg)\n\n**图 7-3.** 产品/服务健康象限\n\n快速审视“产品/服务健康”象限（图 7-3）即可说明这一点，具体如下：\n\
  \n- 产品/服务健康\n    - 交付\n        - 可用性\n        - 速度\n        - 准确性\n    - *使用*\n\
  \        - 独立用户数\n        - 回头客\n        - 推荐量\n    - 客户满意度\n        - 年度调查\n  \
  \      - 问题解决反馈\n        - 访谈\n\n以上每个类别下都可以有超过三个组成部分。例如，你可以在“交付”中增加“可靠性”，或在“使用”中增加“使用频率”。很多时候，测量数据本身会决定不同的收集和分析方法。调查问卷与访谈有着本质区别。虽然问题解决反馈通常以调查问卷形式呈现，但所提问题的类型与每年进行一次的总体调查截然不同。\n\
  \n每一块信息（交付、使用和客户满意度）都有不同的收集/分析方法论，但在每组内部，你还可以进一步变化收集/分析的工具、流程和方法。\n\n当你将“答案地图”的聚焦特性与三角测量的全面性结合起来时，你会发现自己已准备好向组织推广一个切实可行的度量体系。\n\
  \n## 期望\n\n如何以有意义的方式看待度量\n\n如果说“答案地图”是解锁有用度量体系开发的秘诀，那么使用期望值就是钥匙链。期望值能让你将对度量的许多常见负面看法转变为富有成效的改进。\n\
  \n### 别选错了\n\n我很喜欢《夺宝奇兵 3：圣战奇兵》(1989) 中圣杯骑士平静地宣布“他选错了”这句台词。当时有几十只杯子可供选择，而反派选错了那个。不过这也可以理解——他选了桌上最华丽、镶满宝石的圣杯。\n\
  \n管理者也常常挑选最花哨的工具，却因它们无法胜任而失望。我想帮你避免“选错”。所有度量体系周围的恐惧、不确定性和怀疑，都源于对测量数据的误用和滥用，进而对需要提供数据的人造成伤害。有时，这是由错误或恶意的管理实践造成的。由于我是个乐观主义者，并坚信人性本善，我认为度量的误用很少是出于故意。大多数情况下，度量被滥用是因为领导者被某种不当使用度量的低劣管理技巧所误导。这些技巧包括以下几种：\n\
  \n1.  使用延伸目标\n2.  将测量数据本身作为目标\n3.  目标和阈值\n4.  基于测量数据的激励计划\n\n这些技巧看起来可能相当无害且合理。有不少作者、专家和顾问都在推广其中一种或全部。即使是成功的\
  \ CEO 也会称赞这些“工具”对改进的作用。但不要被迷惑：这些都是对度量的误用，通过这种方式取得的任何成功都只是暂时的。\n\n我们先简要分析一下每种方法，然后介绍一个更简单的解决方案。\n\
  \n\n\n"
- '# 关于“延伸目标”的运用


  通过设定目标来追求成功是件好事。但当领导者曲解这一概念，创造出“延伸目标”并将衡量标准本身当作目标时，他们便会误入歧途。目标本身可以成为强大的工具，愿景、使命和目标是指引组织前进的有力组合。然而，对目标的滥用却可能导致组织的努力付诸东流。


  延伸目标往往并非出于自我提升而自发制定的。在商业环境中，我发现管理者们认为它是激励员工的好工具。可达成的目标还不够，“延伸”目标成了最新的银弹。领导者为一个部门或员工设定延伸目标——瞧！目标达成了。领导者显得英明神武，部门/员工受到赞扬，皆大欢喜。但多数情况下，这个延伸目标是强加的（而非协商确定的），员工对其没有归属感。没有归属感意味着对成就的自豪感也会大打折扣。


  延伸目标通常是一个需要完成的大任务。如果仅此一次倒也还好。但随之而来的思潮是：明年要升级第一个延伸目标，制定一个更艰巨、更庞大的延伸目标。如此循环往复。员工最终会识破这种把戏。


  我仿佛能清晰地听到竞技场上的演说家宣布：“游戏开始了！”


  管理者不断施压，想看看能从员工身上榨出多少油水。员工则精明地意识到他们必须在规定时间内（刚好）达成目标（提前完成意味着年内会面临新的延伸目标——所以按时交付比提前完成更好）。延伸目标并不属于组织——当然也绝对不属于员工。不，这些目标完全是管理层独有的。


  延伸目标的另一个意外后果是，其他工作会因此受损。那些本可以做到模范水平的工作，会因不属于延伸目标范畴而退化为“差不多就行”。当次级目标被奉为卓越标准时，就很难再着眼于全局。


  '
- '# 将衡量标准当作目标


  另一个常见的问题是，误将成功衡量标准（MoS）本身当作目标，而非聚焦于已识别的需求。有时这仅仅是含义上的细微差别。如果你的任务是销售五千件新产品，你是在为目标而衡量，还是为
  MoS 而衡量？


  如果你回答是目标，那你就错了。一个简单的测试是：如果你比“目标”多卖一件（或少卖一件），你会更高兴吗？再多十件（或少十件）呢？再多一百件呢？如果这些差异有关系，那么你就是在把成功衡量标准当作目标。


  这一点之所以重要，是因为员工需要理解组织的宗旨、全局、使命和愿景。当你把员工视为改进过程中的合作伙伴时，你就不会试图通过分配“延伸目标”，或让他们追逐衡量标准（而非实现目标）来操纵（或激励）他们。


  真正的目标可能是改善底线利润。增加销售额是实现这一目标的一个可能任务，而销售特定数量的特定产品则是一个子任务。售出的产品数量则构成一个成功衡量标准。


  当你追逐 MoS 时，你会失去焦点。你可能达成了衡量标准，却未能实现指导性的目标。例如，你或许卖出了五千件新产品，但其他产品线的销售额可能大幅下滑。这最终无助于你实现目标。


  另一种看待这个问题的方法是记住：任何成功衡量标准（或完整的度量指标）都只是一个指示器。因此，你不应该为达到某个 MoS 而庆贺，因为它本身不是目标；它只是可能接近目标的一个信号。


  即使成功衡量标准被正确使用，管理者偶尔也会通过设定目标和门槛，将其变为滥用的工具。


  '
- '# 目标与门槛


  目标，如同延伸目标一样，有一个坏习惯：每次达成后就会被重新设定。如果你有一个目标，你可以打赌它会在最后一刻（如果不是最后一刻的话）才被达成。同样，对员工来说，提前达成目标没有任何好处，因为最常见的反应（在小小的庆祝和奖励之后）就是设定一个新的目标。


  目标（在被滥用时）不会基于逻辑的、数据驱动的决策来调整。它们的调整仅基于是否达成——也就是说，新目标的设定仅仅取决于你完成上一个目标的程度——再次将糟糕的指标当作“真相”。员工很快又会明白游戏规则。如果他们提前达成目标，通常得到的奖励与在最后一刻达成是一样的。有些管理者甚至更奖励最后一刻的英雄壮举，而非提前成功。提前成功被视为管理者低估了员工的能力——目标不够“艰巨”，为何要重赏？


  游戏仍在继续。


  员工最好勉强达标即可。管理者自认为是对员工能力判断精准、激励有方的行家。员工则被视为勤奋努力、能够被鼓励的群体。大家皆大欢喜。


  门槛与目标类似，但从负面角度来看。它不是每次提高标杆并努力触及，而是设定一个最低可接受的绩效水平，挑战员工在整个过程中保持在此标准之上。


  同样，员工比操纵者认为的要聪明得多。他们会保持在这个最低限度之上，但仅仅是勉强超过。如果他们超出太多，最低标准就会被抬高，直到他们失败，届时便会招致管理层因认为其无能而施加的不公正怒火。


  那些老员工告诫新员工“慢点干”，因为精力过剩的新手会让他们相形见绌的故事并非虚构。员工会学习游戏规则，并迅速适应糟糕管理者使用的激励工具。


  你或许在想，清晰地阐明可接受的绩效水平有什么问题？让员工清楚这一点似乎是一种良好的沟通。你的想法没错。但是，当目标和门槛被滥用时，它们永远不会稳定——它们会不断地根据达成情况而变动。俗话说，移动的目标最难打。


  '
- '# 基于衡量标准的激励方案


  我要介绍的最后一个误区是围绕衡量标准建立激励机制。再次强调，就像延伸目标和将成功衡量标准当作目标一样——重点（以及奖励）放错了地方。曾有一位奥运举重运动员，每打破一项举重纪录就会获得巨额奖金。毫不意外，他逐步打破自己的世界纪录——每次只增加被允许计为新纪录的最小重量。他得以多次打破世界纪录。这恐怕并非设立该激励计划的机构原本想要激励的方向。但由于重点放在了衡量标准上，而非目标上，结果自然就偏离了中心。


  因焦点错位而倒闭的企业，其数量远超你的想象。这种焦点的缺失包括：忘记了客户是谁，忘记了组织存在的理由，以及忘记了组织的目标。关注个人喝彩而非组织成功，关注激励而非整体卓越，关注衡量标准而非目标，以及围绕衡量标准设定门槛、目标和激励——这些都与真正重要的事情背道而驰。




  ### 期望值


  使用期望值并非概念或理论上的突破，也不是万能药。同样，它也可能被滥用和误用。


  期望值有助于你专注于重要的事情。它为你衡量指标提供了终极背景——完全基于客户的视角。


  期望值是对客户期望从你的服务或产品中获得什么的清晰描述。当然，你可以将期望值用于“答案指南”中的任何视图，但我们关注的是有效性，因此我们将专注于第一象限。


  以下是你需要提出的问题：


  1.  客户期望何种服务水平？

  2.  客户期望的产品质量如何？

  3.  超越这些期望是否对组织有利？

  4.  未能满足这些期望是否会对组织造成损害？

  5.  客户为何会有这些期望？


  借助期望值，我们首先假设客户对你将提供的服务抱有一系列期望。让我们再次以服务中心/帮助台为例。


  当客户致电服务中心寻求建议时，他会有一些基本的期望。例如，当我在线购买产品并因此需要向服务中心寻求帮助时，我的期望值相当低。我的第一个期望是，我很难在公司的网站上轻松找到可以拨打的电话号码。我很少失望——似乎无论我选择哪个链接、图标或按钮，都会得到更多购买产品的机会。经过一番费力搜索，按下多得数不清的按键（和点击）后，我终于找到了电话号码。拨通电话后，我预期至少要花五分钟在自动应答系统的迷宫中导航，才能与真人通话。在所有提供的选项中，（1
  为办理新业务，2 为延长服务，3 为增加服务，等等），没有一个选项是“转接服务代表”。所以，我没有听完所有选项，直接按了 0。然后，我听到“对不起，这是无效选择，请重试。”于是我再次按下
  0，在同样的录音再次为我的“错误”道歉之前，我又按了一次 0，是的，我终于找到了一个活生生的、有呼吸的代表来接听我的电话！


  现在，我的期望发生了变化：技术人员需要多长时间才能真正与我开始对话？一旦我向技术人员解释了我的问题，他需要多长时间来帮助我？技术人员的解决方案效果如何？所有这些期望都将有助于组织定义用于衡量绩效的指标。


  如果你在衡量响应时间和解决时间——帮助台的两个自然指标——那么你需要从客户的角度（而非管理层的角度）来理解期望值。


  如果你只是查看指标而没有期望值，你会很快意识到缺少了什么。`图 8-1` 展示了这一点。


  ![images](img/0801.jpg)


  **图 8-1.** 在 8 个工作小时内解决的案例


  `图 8-1` 是一张图表，显示了在八小时内解决的帮助台案例百分比。这张图讲述的是好消息还是坏消息？三月份的结果可以接受吗？八月份的结果可以接受吗？整个日历年（CY）的总体百分比是否在可接受的参数范围内？


  没有期望值，我们无法知道这是好消息还是坏消息。


  当你收集期望值时，你需要确定“满足期望”意味着什么。这几乎总应该是一个范围，而不是单一数值。在“解决时间”的场景中，我们可能基于不同的标准（例如问题的严重级别）而有不同的期望。如果客户的问题很简单，那么期望就是快速解决。如果问题很复杂，那么期望就不会那么严格。


  让我们继续用一个简单问题为例：你需要重置密码。这应该花多长时间？我的期望是，一旦我与真人通话，应该在一个小时内完成重置。我期望需要证明自己的身份——即我确实是丢失密码账户的“合法拥有者”。一旦我回答了必要的问题，我期望收到一封包含新密码的电子邮件（作为另一项安全措施）。虽然大多数情况下我能在几分钟内收到这封邮件，但我愿意接受最多一小时。因此，我的期望范围是从五分钟到一小时。


  这些是*我*的期望。满足这些期望会让我成为满意的客户。我不需要更多，如果更差（如果花了一个多小时，我可能会再次致电帮助台）我会感到不满意。如果解决时间少于五分钟，我会很高兴。既高兴又惊讶。但我不会期望下次还会这样。更重要的是，如果花的时间更长（但仍在那一小时的时间范围内），我也不会不满意。如果我在挂断技术人员电话之前就收到了电子邮件，我甚至可能会评论速度之快。同样，这不会改变我的期望，但我会为这意外之喜感到高兴。实际上我还会好奇这怎么可能。


  这是期望值的另一个本质区别——它们不容易或很快被改变。当期望被满足时，客户感到满意。当期望未被满足时，客户感到不满意。当期望被超越时，这确实是一个惊喜。一个令人愉快的惊喜，但终究是惊喜。客户不会每年都提高他们的期望，也不会因为他们的期望被持续满足而提高。满足期望并不必然要求改变期望——反而会强化期望。


  让我们看看在图表中加入期望值会发生什么。`图 8-2` 显示了与 `图 8-1` 相同的数据，但加入了期望值。


  ![images](img/0802.jpg)


  **图 8-2.** 加入期望值


  虚线和点划线表示期望值的流向。当数值保持在边界范围内时，期望值得到满足。超出期望值范围之上的异常点或之下的异常点都值得调查。


  如果你的客户群体庞大且多样化，你如何确定客户的期望？例如，像 Amazon.com、麦当劳或福特汽车公司这样的国际公司？即使有可能询问每位客户的个人期望，也不可能达成共识。因此，对你来说，就客户群的一般期望做出决策至关重要。


  从组织的角度来看，满足客户的期望非常重要。如果组织无法做到这一点，就必须进行改变以达到这一目标。这是服务/产品健康度指标项目的基础。当组织未能满足期望时，应进行进一步调查，以了解未来是否可以避免该原因。大多数组织已经在努力做到这一点。不幸的是，这些组织往往忘记了庆祝满足期望的时刻——反而将精力耗费在因少数几次未能满足期望而自我惩罚上。这些组织也会庆祝和奖励超越期望的时刻。但是，如果期望值被正确识别，*任何*偏差——无论是低于（未能满足）还是高于（超越）——都应该被调查。


  如果未能满足期望，应确定将来是否能防止该事件的发生。也许流程或程序上的改变可以消除其发生。




