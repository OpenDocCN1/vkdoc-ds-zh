    # 电流


    在本节中，我们将通过一个示例来学习如何计算电路中的电流。此外，我们还将研究如何根据基尔霍夫定律求解 RL 电路中的电流。


    ## 示例 9-5

    考虑图 9-6 所示的一个包含八个电阻和两个电池的电路。求流过回路的电流`x`、`y`和`z`。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig6_HTML.jpg](img/483991_1_En_9_Fig6_HTML.jpg)


    *图 9-6 一个电路网络*


    ### 解 9-5

    为了求出流过各回路的电流，我们为每个回路列出如下方程。


    ![$$ \left\{\begin{array}{c}90x-20y-30z=40\\ {}-20x+65y-40z=0\\ {}-30x-40y+150z=500\end{array}\right.
    $$](img/483991_1_En_9_Chapter_TeX_Equ15.png) (15)


    以下代码可用于求解此方程组。


    *Example9p5.m*

    ```

    %Example9p5

    %This code finds currents

    %for an electrical network

    A=[90 -20 -30;-20 65 -40;-30 -40 150];

    B=[40;0;500];

    Sol=(A)\B;

    disp([''x='',num2str(Sol(1))]);

    disp([''y='',num2str(Sol(2))]);

    disp([''z='',num2str(Sol(3))]);

    ```


    执行代码后，我们将得到以下输出。

    ```

    > Example9p5

    x=3

    y=4

    z=5

    >

    ```


    一个电路可以包含多种元件，包括开关、电压源 (V)、电阻 (R) 和电感 (L)，如图 9-7 所示。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig7_HTML.jpg](img/483991_1_En_9_Fig7_HTML.jpg)


    *图 9-7 一个 RL 网络*


    以下是图 9-7 所示网络的控制方程。


    ![$$ L\frac{di}{dt}+ Ri=V $$](img/483991_1_En_9_Chapter_TeX_Equ16.png) (16)


    方程 (16) 的解为


    ![$$ i=\frac{V}{R}\Big(1-\exp \left(-R\ast \frac{t}{L}\right) $$](img/483991_1_En_9_Chapter_TeX_Equ17.png)
    (17)


    ## 示例 9-6

    对于一个 RL 网络，给定系数为`V` = 2 伏特，`R` = 1 欧姆；`L` = 1/2 亨利，0 ≤ `time` ≤ 5。编写代码来模拟电流`i`随时间变化的值。


    ### 解 9-6

    以下代码可用于完成指定任务。


    *Example9p6.m*

    ```

    %Example9p6

    %This code plots current values

    t=0:0.05:5;

    V=2;R=1;L=1/2;

    i=(V/R)*(1-exp(-R.*t/L));

    plot(t,i,''bo'');grid on;

    xlabel(''t'');ylabel(''current'');

    title(''Current with time'');

    ```


    执行代码后，将显示如图 9-8 所示的输出。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig8_HTML.jpg](img/483991_1_En_9_Fig8_HTML.jpg)


    *图 9-8 示例 9-6 中电流的值*


    # 谐波分析


    周期信号可以用傅里叶级数表示为一系列正弦波和余弦波的和。计算此类信号的过程称为*谐波分析*。此时，我们需要回顾一下傅里叶级数的定义。


    ## 备注 9-3

    假设对于所有`x`值，`f(x)` 的定义周期为 2L，即 `f(x) = f(x + 2L)`。那么 `f(x)` 的傅里叶级数为


    ![$$ \boldsymbol{f}\left(\boldsymbol{x}\right)\sim \frac{{\boldsymbol{a}}_{\mathbf{0}}}{\mathbf{2}}+\sum
    \limits_{\boldsymbol{n}=\mathbf{1}}^{\infty}\left({\boldsymbol{a}}_{\boldsymbol{n}}\mathbf{\cos}\left(\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}}\right)+{\boldsymbol{b}}_{\boldsymbol{n}}\mathbf{\sin}\left(\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}}\right)\right). $$](img/483991_1_En_9_Chapter_TeX_Equ18.png)
    (18)


    此处，`a[n]` 和 `b[n]` 被称为*傅里叶系数*，其中


    ![$$ {\boldsymbol{a}}_{\boldsymbol{n}}=\frac{1}{L}{\int}_{-L}^Lf(x)\mathit{\cos}\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}} dx $$](img/483991_1_En_9_Chapter_TeX_Equ19.png)
    (19)


    以及


    ![$$ {b}_{\boldsymbol{n}}=\frac{1}{L}{\int}_{-L}^Lf(x)\mathit{\sin}\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}} dx $$](img/483991_1_En_9_Chapter_TeX_Equ20.png)
    (20)


    其中 `n` = 1, 2, 3, …


    ## 示例 9-7

    如方程 (18)、(19) 和 (20) 所定义的信号 `f(x)` 的系数给定为 `L = 2`，`a[0] = 0`，`a[n] = 0`，以及 ![$$
    {b}_{\boldsymbol{n}}=\left\{\begin{array}{c}\frac{4}{n\pi},n\ is\ odd\\ {}0,n\
    is\ even\ \end{array}\right. $$](img/483991_1_En_9_Chapter_TeX_IEq6.png)。计算当 `n`
    = 49 时，方程 (18) 中的信号 `f(x)`。然后绘制信号 `f(x)` 在 −2`π` ≤ `x` ≤ 2`π` 范围内的图形。


    ### 解 9-7

    如果将给定的 `a[0]`、`a[n]` 和 `b[n]` 代入方程 (18)，我们得到：


    ![$$ f(x)=\frac{4}{\pi}\left(\mathit{\sin}\frac{\pi x}{2}+\frac{1}{3}\mathit{\sin}\frac{3\pi
    x}{2}+\frac{1}{5}\mathit{\sin}\frac{5\pi x}{2}+\frac{1}{7}\mathit{\sin}\frac{7\pi
    x}{2}+\dots \right) $$](img/483991_1_En_9_Chapter_TeX_Equ21.png) (21)


    因此，我们需要计算 `f(x)` 包含 49 项时的方程 (21)。 以下代码可用于获取`f(x)`的图形。


    *Example9p7.m*

    ```

    %Example9p7

    %This code plots graph of a signal

    n=49;Point=1000;

    x=linspace(-2*pi,2*pi,Point);

    bn=zeros(1,Point);a0=0*bn;an=0*bn;

    for i=1:2:n

    Calc=(1/i).*sin((i*pi.*x)/2);

    bn = bn + Calc;

    end

    bn=(4/pi)*bn;fx=a0+an+bn;

    plot(x,fx);grid on;axis(''equal'');

    xlabel(''x'');ylabel(''signal'');

    title(''Square Wave Signal'');

    ```


    执行代码后，输出如图 9-9 所示。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig9_HTML.jpg](img/483991_1_En_9_Fig9_HTML.jpg)


    *图 9-9 示例 9-7 的输出*


    如图 9-9 所示，该信号为方波信号。信号的周期为 4（`L` = 2）。如果在代码中选择更大的`n`，图像将看起来更像一个精确的方波。

