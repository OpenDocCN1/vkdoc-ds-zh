    # 成本、收入和利润


    在所有企业中，保持清晰且恰当的财务记录极其重要。成本、收入和利润的计算在这方面扮演着重要角色。在本节中，我们将讨论这三个重要概念。


    ## 成本


    成本，也称为总成本，是为生产或获取某件物品所花费的货币价值。通常，某物的成本可以通过线性函数计算：


    ![$$ C(x)= mx+b $$](img/483991_1_En_3_Chapter_TeX_Equd.png)


    其中，*m* 代表边际成本，*b* 代表固定成本。


    **例 3-8.** 亚历山大的自行车公司生产自行车进行销售。每生产一辆自行车，公司花费 50 美元，其他固定成本为 35 美元。编写代码计算生产自行车的总成本。代码应询问生产自行车的数量以完成计算。


    **解 3-8.** 以下代码可用于完成给定任务。


    *Example3p8.m*


    ```

    %Example3p8

    %此代码计算成本（总成本）

    Number = input(''生产自行车数量\n'');

    Cost = @(x) 50*x+35;

    CostCalculation = Cost(Number);

    disp([''成本为 '', num2str(CostCalculation)])

    ```


    运行代码，并输入自行车数量为 10 后，输出如下。


    ```

    > Example3p8

    生产自行车数量


    成本为 535

    >

    ```


    ## 收入


    收入是以价格 *P* 销售 *Q* 件物品所获得的总金额。


    ![$$ R=Q\ast P $$](img/483991_1_En_3_Chapter_TeX_Eque.png)


    在该公式中，*R* 代表收入，*Q* 代表售出的物品数量，*P* 代表每件物品的售价。使用给定公式计算总收入并不困难。有些问题需要用户在不同情况下找出最大收入。下一个例子就是这类问题。


    **例 3-9.** 亚历山大的影院公司销售电影放映的门票。影院有 1000 个座位。目前每张票售价 8 美元。亚历山大想提高票价。根据以往经验，他认为如果每张票涨价
    0.50 美元，那么来看电影的观众会减少 50 人。找出使收入最大的票价。


    **解 3-9.** 设 *x* 为涨价 0.50 美元的次数。因此，$8.00 + $0.50*x* 代表一张票的价格，1000 - 50*x* 代表售出的票数。那么收入可以计算为
    *R* = (1000 − 50*x*) ∗ (8.00 + 0.50*x*)。由此，我们可以写出 *R* = −25*x*² + 100*x* + 8000。以下代码可用于完成给定任务。然后我们需要找出一个使
    *R* 值最大的 *x* 值。这部分需要我们进入代码并求解 *x* 以使 *R* 达到最大值。以下代码可用于实现此目的。


    *Example3p9.m*


    ```

    %Example3p9

    %此代码寻找最大值

    syms x

    R = -25*x²+100*x+8000;

    Derivat = diff(R,x);

    Number = solve(Derivat,x);

    EvalFunc = matlabFunction(R);

    MaxVal = EvalFunc(double(Number));

    disp([''最大收入为 '',...

    num2str(MaxVal)])

    ```


    在此代码中，*R* 函数以符号函数形式输入。然后使用 `diff` 函数求其导数。得到的线性方程通过 `solve` 函数求解。得到的 `Number` 值显示为符号数据值。为了将其转换为浮点数，使用了
    `double` 函数。同时，*R* 符号函数被转换为 MATLAB 函数，以在 `x=Number` 值处评估 *R*。最后，使用 `disp` 函数显示最大值。


    运行代码后，输出如下。


    ```

    > Example3p9

    最大收入为 8100

    >

    ```


    **注 3-1.** 对于二次方程（即 *f*(*x*) = *ax*² + *bx* + *c*，*a* ≠ 0 且 *a*, *b*, *c* ∈ *R*），最大值或最小值取决于
    *a* 的符号。如果符号为负（-），则可以从方程导出最大值。如果符号为正（+），则可以找到方程的最小值。这可以通过两种方式实现。第一种方式中，![$$ f\left(\frac{-b}{2a}\right)
    $$](img/483991_1_En_3_Chapter_TeX_IEq6.png) 给出最大值或最小值。第二种方式中，计算 *f*(*x*) 的导数，并求解
    *f*^′(*x*) = 0 方程。*f*(*x*) 的根也取决于 *a* 的符号，给出最大值或最小值。


    在前面的问题中，采用了第二种方法来寻找最大值。

