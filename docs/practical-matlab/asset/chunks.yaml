    hospital(index,:)

    fprintf(''年龄为 50 的信息:\n'')

    hospital(find(hospital.Age==50),:)

    ```


    在这段代码中，命令 `ismember` 用于判断 DIAZ 是否是元胞数组 `hospital.LastName` 的一个成员。如果是，则返回 1，否则返回
    0。通过使用 `find` 命令，可以找出所需信息的索引。


    执行上述代码后，我们将得到如下输出结果。


    ```

    > Example6p6

    姓氏为 DIAZ 的人是:

    ans =

    LastName    Sex    Age   Weight    Smoker    BloodPressure

