    # 2. Fundamentals of MATLAB Language


    In this chapter, you will learn the basic concepts of algorithms, M-files, selection
    structures, controlling mechanisms of the MATLAB language, and user-defined functions.


    A computer program is basically a set of instructions that tells the computer
    what to do. In MATLAB, for larger programs, sometimes called *scripts,* using
    an editor is preferred to typing the whole code sequence at the prompt. The problems
    that we have dealt with so far have been easy to execute and accomplish. It was
    sufficient to use the prompt alone for solving the problems encountered up to
    this point. We could also use the MATLAB editor to solve these problems, though.
    However, for larger and more complex problems, it is recommended that you keep
    your code together and organized in an editor. For that reason, we use the editor
    to create our codes for the problems as much as we can for the rest of the book.


    It is not difficult to write complex, unclear code. After a while, though, if
    you look back to your code for some reason, such as upgrading or editing, it might
    be difficult to understand what you meant. Therefore, one of the primary concerns
    when creating code is to write clear code that is easy to understand. To accomplish
    that, we could put our comments within the code as reminders after the % symbol.
    MATLAB ignores whatever comes after the % symbol. These comments can be placed
    either after a line of code, or as comment blocks, which are longer informative
    expressions between %{ and %}.


    To generate longer comments, the %{ symbol should be standing alone on a line.
    Similarly, the %} symbol used for closing the comment block should also be standing
    alone on the last line, as shown in Figure [2-1](#483991_1_En_2_Chapter.xhtml#Fig1).


    ![../images/483991_1_En_2_Chapter/483991_1_En_2_Fig1_HTML.jpg](images/483991_1_En_2_Chapter/483991_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    An example of a comment block


    Another important rule for obtaining more organized codes is to use meaningful
    names for variables and structures. That helps users recall scripts easily later
    on. Some other useful tips related to writing better code is outside the scope
    of this book. For a basic understanding of the subject, though, we keep it simple
    here.'
