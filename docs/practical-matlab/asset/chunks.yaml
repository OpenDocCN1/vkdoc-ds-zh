- fmt: '### Sorting and Searching


    Sorting in ascending or descending order can easily be achieved via the `sort`
    function.


    **Example 6-2.** Consider the data given by 23, 70, 86, 5, 120, 50, -9, 61, and
    100. Write a code to sort the given values both in ascending and descending order.


    **Solution 6-2.** The data can be introduced as a vector, and then can be sorted
    as shown here at the prompt.


    *Example6p2.m*


    ```

    %Example6p2

    %This code sorts data

    A=[23,70,86,5,120,50,-9,61,100];

    DescendSort = sort(A,''descend'');

    AscendSort = sort(A,''ascend'');

    disp(''Descending Sort:'');

    disp(DescendSort);

    disp(''Ascending Sort:'');

    disp(AscendSort);

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example6p2

    Descending Sort:

    120   100    86    70    61    50    23     5    -9

    Ascending Sort:

    -9     5    23    50    61    70    86   100   120

    >

    ```


    In some cases, multiple sets of data, as in a matrix, need to be sorted. This
    case is shown in Example 6-3.


    **Example 6-3.** Randomly create a 3 × 5 matrix by using the `randi()` function.
    Then, sort each column and each row of the matrix in descending order.


    **Solution 6-3.** The following code can be used to sort the columns and rows
    of the matrix.


    *Example6p3.m*


    ```

    %Example6p3

    %This code sorts rows and columns

    A=randi(100,3,5);

    SortColumn=sort(A,1);

    SortRow=sort(A,2);

    disp(''Original Matrix'');

    disp(A);

    disp(''Column Sorted'');

    disp(SortColumn)

    disp(''Row Sorted'');

    disp(SortRow)

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example6p3

    Original Matrix

    94    29    87   100    58

    46     1    40    54    65

    32    61    26    96    27

    Column Sorted

    32     1    26    54    27

    46    29    40    96    58

    94    61    87   100    65

    Row Sorted

    29    58    87    94   100

    1    40    46    54    65

    26    27    32    61    96

    >

    ```


    As shown in the output, if the command `sort` is used in the form `sort(Matrix,1)`,
    sorting is performed for columns; if `sort(Matrix,2)` is used, then sorting is
    performed for rows.


    Searching is also a straightforward task with MATLAB. Typically, there are three
    different possibilities available for searching. A number can be searched in a
    vector or matrix. A group of letters or a string can be searched in a string cluster.
    Finally, we can search some information within a dataset. We will examine each
    of these cases with an example.


    **Example 6-4.** Consider the matrix given by `Mat = [32,98,17,71,67; 39,71,65,28,17;
    77,49,71,68,71]`. Write code that searches for 71 within this matrix.


    **Solution 6-4.** The following code can be written to perform the search.


    *Example6p4.m*


    ```

    %Example6p4

    %This code find indexes in a matrix

    Matrx =[32,98,17,71,67;...

    39,71,65,28,17;...

    77,49,71,68,71];

    Key = 71;

    Indexing = find(Matrx==Key);

    disp(''Its indexes are: '')

    disp(Indexing);

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example6p4

    Its indexes are:


    >

    ```


    As shown, MATLAB returns the index values where the number 71 occupies a place.
    The fifth, ninth, tenth, and fifteenth elements of the matrix have a value of
    71. From this example, we see that the order of indexing goes column by column.


    **Example 6-5.** Consider the string given by `12345 ABcde Antonio`. Write code
    that looks for the string `antonio` without considering case-sensitivity.


    **Solution 6-5.** MATLAB is a case-sensitive language. Therefore, the strings
    `Antonio` and `antonio` are two different strings. The following code can be used
    to search for the desired string.


    *Example6p5.m*


    ```

    %Example6p5

    %This code finds string

    Text = ''12345 ABcde Antonio'';

    Scr = ''antonio'';

    NewText = upper(Text);

    NewScr= upper(Scr);

    Findit = strfind(NewText,NewScr);

    disp(''Place of string: '');

    disp(Findit);

    ```


    The strings can be defined in MATLAB as vectors containing these strings, as shown
    in the preceding code. After running the code, the following output will be obtained.


    ```

    > Example6p5

    The string is


    >

    ```


    This output states that the searched string is embedded in the bigger string,
    and it starts from the thirteenth element of the vector. If the string did not
    exist, then we would have gotten an empty set `[]`, meaning that the searched
    word could not be found.


    **Example 6-6.** In MATLAB, there is a dataset available for use with the name
    `hospital`. A portion of these data are shown in Figure [6-1](#483991_1_En_6_Chapter.xhtml#Fig1).


    ![../images/483991_1_En_6_Chapter/483991_1_En_6_Fig1_HTML.jpg](images/483991_1_En_6_Chapter/483991_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    A screenshot from the hospital dataset


    Let us load these data into the workspace. Then, search the dataset to find the
    last name DIAZ, and other relevant information. After that, find the people who
    are 50 years old.


    **Solution 6-6.** To find DIAZ, we need to search the column `LastName`, which
    contains strings. To search for the number 50, we need to work with the column
    `Age`. The following code can be used to perform the given tasks.


    *Example6p6.m*


    ```

    %Example6p6

    %This code finds data

    load hospital

    IsThere=ismember(hospital.LastName,''DIAZ'');

    index = find(IsThere);

    fprintf(''The person last name DIAZ is\n'')

    hospital(index,:)

    fprintf(''Information having age 50:\n'')

    hospital(find(hospital.Age==50),:)

    ```


    In this code, the command `ismember` determines whether DIAZ is a member of the
    cell `hospital.LastName` or not. It returns 1 if it is the case, and 0 if it is
    not. By using the `find` command, it is possible to find out the index of the
    required information.


    Once the code is executed, we will obtain the following output.


    ```

