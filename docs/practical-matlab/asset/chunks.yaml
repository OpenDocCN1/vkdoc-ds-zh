    ds=-(beta/N)*x(1)*x(2);

    %dI/dt=Sir(2),x(2)=exposed by infection

    di=(beta/N)*x(1)*x(2)-gamma*x(2);

    %dr/dt=sir(3),x(3)=Recovered from infection

