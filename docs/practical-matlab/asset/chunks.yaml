    Name    Age    Height

    ____    ___    ______

    Alex    35      160

    Slim    40      165

    Bill    45      170

    >

    ```


    The spreadsheet file was saved in the `MyTable.xlsx` file in the directory as
    well.


    More complex applications are available for tables. Here, we have seen only a
    simple example to give an idea about the general concept.


    ## Plotting Graphics


    MATLAB is a very powerful tool for graphics and plotting. A wide range of drawing
    tools are available for tasks such as plotting in polar coordinates, logarithmic
    graphics, animated 3-D plots, volume visualization plots, and so on. This section
    deals with the basic plotting of functions in two dimensions and plotting multiple
    functions on a single coordinate system or on a single figure.


    ### Single Plotting


    The basic command for drawing a function in MATLAB is the `plot` function. The
    simplest form of the `plot` command is `plot(y)`, where y depends on its index.
    The most common use of the plot function is in the form of `plot(x,y)`, which
    is the Cartesian plot of an (x,y) pair.


    **Example 1-18.** Plot the function *y* = 2*sinsin* (*x*) through the interval
    of 0 ≤ *x* ≤ *π*.


    **Solution 1-18.** If x is defined as a vector from 0 to pi using the `linspace`
    command, then we can draw the corresponding values of y versus x. In the following
    code, the distance from 0 to pi is divided into 100 points. If we pick a large
    number of points such as 1,000, the graph will become more precise.


    ```

    > x=linspace(0,pi,100);

    > y=2.*sin(x);

    > plot(x,y)

    >

    ```


    The code just given produces the output shown in Figure [1-6](#483991_1_En_1_Chapter.xhtml#Fig6).


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig6_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Cartesian plot of y=2sin(x) where 0 ≤ *x* ≤ *π*


    Various features of graphics such as title, x label, y label, and grids are available
    in MATLAB. These features are shown in Table [1-15](#483991_1_En_1_Chapter.xhtml#Tab15).


    There are some other features available that allow programmers to work with line
    styles, colors, and sizes, as shown in Table [1-16](#483991_1_En_1_Chapter.xhtml#Tab16).


    To create a regular plot using the `plot` function , different options can be
    included in the drawing.


    There is a remarkable number of special functions available to create two-dimensional
    and three-dimensional plots in MATLAB. In the command window, if you type `>help
    specgraph` and press Enter, you will see which special functions are available
    in your version.'
