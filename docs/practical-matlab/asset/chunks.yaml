    {K}_3= hf\left({x}_i+\frac{1}{2}h,{y}_i+\frac{1}{2}{K}_2h\right)\ {K}_4= hf\left({x}_i+h,{y}_i+{K}_3h\right)\
    {y}_{i+1}={y}_i+\frac{1}{6}\left({K}_1+2{K}_2+2{K}_3+{K}_4\right) $$](img/483991_1_En_4_Chapter_TeX_Equh.png)


    **示例 4-12.** 编写代码，使用 `RK4` 求解以下微分方程的初值问题：


    ![$$ \frac{dy}{dx}=y-x,y(0)=\frac{2}{3},0\le x\le 5 $$](img/483991_1_En_4_Chapter_TeX_Equi.png)


    其精确解为 ![$$ y=\left(x+1\right)-\frac{1}{3}{e}^x $$](img/483991_1_En_4_Chapter_TeX_IEq7.png)。代码应在屏幕上输出
    `y(5)` 的精确解和数值解。网格尺寸 (`h`) 应设置为 `h = 0.0005`。


    **解法 4-12.** 我们可以编写以下代码来完成给定任务。


    `Example14p12.m`


    ```

    %Example 4p12

    %This example solves a first-order ODE

    %by using Runge-Kutta Method of fourth order

