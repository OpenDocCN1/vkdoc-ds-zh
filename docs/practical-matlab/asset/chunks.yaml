- fmt: '# Rolling a Pair of Dice


    Programming the rolling of a pair of dice or a single die can be done in several
    ways. One of the easiest ways is to use the `randi(6,1,2)` command (or `randi(6,1)`
    for a single die). In this way, two integers can be selected between 1 to 6. For
    an illustration, we can take a look at Example 5-4.


    **Example 5-4.** Write code to simulate rolling a pair of dice using the `randi`
    command. The code should ask the user the number of times the pair of dice is
    rolled. Then all outcomes including the sum of each roll should be displayed on
    the screen.


    **Solution 5-4.** To get two numbers to represent die, you can use the `randi(6,1,2)`
    command. To achieve the task, the following code can be used.


    *Example5p4.m*


    ```

    %Example5p4

    %This code rolls die and prints the sum

    N=input(''Enter the number of times to roll\n'');

    [Results,Sums] = RollDie(N);

    disp(''The Rolled Die'');

    disp(Results);

    disp(''The Sums For Each Rolling'');

    disp(Sums);

    function [Results,Sums] = RollDie(Number)

    Results = zeros(Number,2);

    Sums = zeros(Number,1);

    for i=1:Number

    Die=randi(6,1,2);

    Sum=Die(1)+Die(2);

    Results(i,1:2)=Die;

    Sums(i)=Sum;

    end

    end

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example5p4

    Enter the number of times to roll


    The Rolled Die

    6     1

    2     6

    5     1

    2     4

    4     5

    The Sums For Each Rolling


    >

    ```


    **Example 5-5.** Write code to simulate rolling a pair of dice. The code should
    ask the user whether or not the user wants to play. If the user wants to play,
    the code rolls a pair of dice. If the sum of the numbers is 7, the computer should
    output “You WON $100” and the obtained numbers and keep rolling. If the sum of
    the numbers is 10, the computer should output “You WON $50000” and the obtained
    numbers and keep rolling. For the rest of the sum possibilities, the program should
    stop running.


    **Solution 5-5.** The following code can be used to accomplish the given task.


    *Example5p5.m*


    ```

    %Example5p5

    %This code simulates a pair of dice

    N=input(''Enter 1 to roll a pair of dice\n'');

    while (N==1)

    Die=randi(6,1,2);

    switch sum(Die)

    case 7

    disp(''You WON $100'');

    fprintf(''Numbers: %i and %i\n'',...

    Die(1),Die(2));

    case 10

    disp(''You WON $50000'');

    fprintf(''Numbers: %i and %i\n'',...

    Die(1),Die(2));

    otherwise

    N=2;

    fprintf(''Numbers: %i and %i\n'',...

    Die(1),Die(2));

    end

    end

    ```


    Once the code is executed, the following output will be printed on the screen.


    ```

    > Example5p5

    Enter 1 to roll a pair of dice


    You WON $100

    Numbers: 2 and 5

    Numbers: 2 and 1

    >

    ```


    As shown in the output, after running the program and entering 1, the program
    began to run. Then, the computer rolled 2 and 5, the sum of which is 7, and printed
    `You WON $100` and continued. On the second attempt, the rolled numbers are 2
    and 1, the sum of which is 3. Because 3 is not one of the special cases identified,
    the code changed the value of variable `N`, and finished.


    ## Random Walking


    A random walk can be simulated by using the `rand` command as well. This section
    illustrates one-dimensional and two-dimensional cases separately.


    **Example 5-6.** Write a code to simulate a one-dimensional walk where the directions
    picked randomly from either 1 or -1 to go either to the right or left for 20 steps.


    **Solution 5-6.** Although the question is one-dimensional, to see the right and
    left steps clearly, the path will be drawn one step up toward the `y` direction
    in each step. The right step will be in red color and blue will indicate the steps
    to the left. The following code can be used to accomplish the given task.


    *Example5p6.m*


    ```

    %Example5p6

    %The code simulates random walk in 1-d

    close all; Y=1; P = 0;%position

    Steps = 20; Step = 1;

    for i=1:Steps

    W = rand;

    if W>0.5

    P = P + Step;

    St = linspace(P-1,P,21);

    plot(St,Y,''r*'')

    hold on

    else

    St = linspace(P,P-1,21);

    P = P - Step;

    plot(St,Y,''b+'')

    hold on

    end

    Y = Y + 1;

    pause(0.5)

    end

    grid on

    xlabel(''Red-->right | Blue-->left'')

    ylabel(''Direction in each step'')

    title(''Random Walk in Each Step'')

    disp([''Final Place :'',num2str(P)])

    ```


    Once the code is run, the output shown in Figure [5-1](#483991_1_En_5_Chapter.xhtml#Fig1)
    is obtained.


    ![../images/483991_1_En_5_Chapter/483991_1_En_5_Fig1_HTML.jpg](images/483991_1_En_5_Chapter/483991_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Output of Example5p6


    The random walk starts by going left at the beginning. Then it goes right, then
    left again, and so on. At the end, the position is six steps left from the starting
    point. At the prompt, we also obtain the following result.


    ```

    > Example5p6

    Final Place :-6

    >

    ```


    **Example 5-7.** Write code to simulate a two-dimensional random walk. In each
    step, the computer can go just one step right in the `x` direction, or one step
    up in the `y` direction in 15 steps.


    **Solution 5-7.** The following code can be used to accomplish the given tasks.


    *Example5p7.m*


    ```

    %Example5p7

    %The code simulates random walk in 2-d

    close all;clear all;P = 0;%position

    Steps = 15;X=0;Y=0;Step = 1;

    plot(X,Y,''co'');hold on

    format short

    for i=1:Steps

    W = rand;

    if W<0.5

    X = X + Step;

    St = linspace(X-1,X,21);

    plot(St,Y,''r*'')

    hold on

    else

    Y = Y + Step;

    St = linspace(Y-1,Y,21);

    plot(X,St,''b+'')

    hold on

    end

    end

    grid on

    xlabel(''Red-->Right | Blue-->Up'')

    ylabel(''Direction in each step'')

    title(''Random Walk in Each Step'')

    ```


    Once we run the code, the graphic shown in Figure [5-2](#483991_1_En_5_Chapter.xhtml#Fig2)
    is obtained.


    ![../images/483991_1_En_5_Chapter/483991_1_En_5_Fig2_HTML.jpg](images/483991_1_En_5_Chapter/483991_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Output of Example5p7


    As Figure [5-2](#483991_1_En_5_Chapter.xhtml#Fig2) shows, the walk went right
    seven times and upward eight times. That total gives us the total number of steps
    in the code.


    At the prompt, we also got the following after running the code.


    ```

    > Example5p7

    1     0

    2     0

    2     1

    2     2

    2     3

    2     4

    3     4

    4     4

    4     5

    5     5

    5     6

    5     7

    5     8

    6     8

    7     8

    >

    ```'
