    We often encounter problems with percentage change in real life. There are three
    important concepts to understand to solve such types of problems.


    - More than x% of *A* = ![$$ A+A\ast \frac{x}{100}=A\ast \frac{\left(100+x\right)}{100}
    $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_IEq3.png)

    - Less than x% of *A* = ![$$ A-A\ast \frac{x}{100}=A\ast \frac{\left(100-x\right)}{100}
    $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_IEq4.png)

    - % change = ![$$ \frac{new\ value- old\ value}{old\ value}\ast 100 $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_IEq5.png)
    percent


    **Example 3-5.** Martin’s annual salary is $50,000 this year. He will get a 20%
