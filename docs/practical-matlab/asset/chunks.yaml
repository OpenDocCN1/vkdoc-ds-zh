    \ a certain point, or a threshold, then these pixels will be added to the seed\
    \ pixel and the region will be grown. In this method, threshold value or criteria\
    \ will be an important part of the algorithm.\n\n## Mathematical Morphology\n\n\
    Mathematical morphology is a branch of image processing for analysis and processing\
    \ geometric structures such as extracting image components. Operations are performed\
