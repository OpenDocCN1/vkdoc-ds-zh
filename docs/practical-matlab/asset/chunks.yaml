    ```

    textString = get(handles.textresult,''String'');

    if(strcmp(textString,''0'')==1)

    set(handles.textresult,''String'',''0'') ;

    else

    Val=char(textString);

    L=length(textString);

    textString=Val(1:L-1);

    set(handles.textresult,''String'',textString)

    end

    ```


