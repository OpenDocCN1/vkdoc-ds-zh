    (1)


    with a continuous signal.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig1_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


