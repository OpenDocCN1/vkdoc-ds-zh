- fmt: '# Creating GUIs with App Designer


    To create any application, we need to open the App Designer first. On the MATLAB
    toolbar, one can click the `New` button and then the `App` option will be available
    to select. After selecting `App`, the interface of the app will appear.


    On the left, one can select the GUI elements. The objects can be dragged and dropped
    to the center of the canvas to be created. The easiest part is the creation of
    objects. The important part is writing callback functions here, too. In App Designer,
    MATLAB gives you permission to write on the white places in the coding part. As
    an example, one can just write codes on the white spaces seen in Figure [12-7](#483991_1_En_12_Chapter.xhtml#Fig7).
    The rest of the coding is automatically generated depending on the design of objects.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig7_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig7_HTML.jpg)


    Figure 12-7


    An outlook from the code view


    **Example 12-3.** Write a program with App Designer to plot the graphics of trigonometric
    functions of sine, cosine, and tangent between –*π* and *π*. These functions should
    be selected from a `listbox`. There should also be a slider to multiply the selected
    function. Once the `Plot` button is clicked, the code should plot the trigonometric
    function that is multiplied by the coefficient of the selected value of the slider.


    **Solution 12-3.** After designing the GUI, we need to create a callback function.
    Figure [12-8](#483991_1_En_12_Chapter.xhtml#Fig8) shows code used as a callback
    function.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig8_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig8_HTML.jpg)


    Figure 12-8


    Code from `Myapp1.mlapp`


    Figure [12-9](#483991_1_En_12_Chapter.xhtml#Fig9) shows the output once the code
    is run.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig9_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig9_HTML.jpg)


    Figure 12-9


    Obtained output


    What is different from GUIDE is that `app.` should be added as prefix to each
    tag, and the names of the files have an `.mlapp` suffix instead of `.m`. The rest
    of the coding is almost the same as coding with GUIDE, although depending on the
    elements or components library, App Designer has more available options.


    ## Creating Applications


    Many applications can be created using GUIs in MATLAB. In this section, a few
    of them are illustrated in the examples. These applications are created by GUIDE.


    **Example 12-4.** Create a GUI that has four options for plotting the graph of
    a trigonometric function such as sine, cosine, tangent, and cotangent of *x*,
    where *x* is between 0 and 2π. The function should be multiplied by a constant
    having a value between 0 and 100. The value of the constant should be controlled
    using a slider.


    **Solution 12-4.** Figure [12-10](#483991_1_En_12_Chapter.xhtml#Fig10) shows the
    outline of the GUI.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig10_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig10_HTML.jpg)


    Figure 12-10


    Output of the GUI named `PlotZ`


    In Figure [12-10](#483991_1_En_12_Chapter.xhtml#Fig10), we see 10 components on
    the GUI. The names and tags of the elements have been changed.


    Under the `PlotZ_OpeningFcn` function, write the following code.


    ```

    axis(handles.axesSymbol,''off'');

    ht = text(1,0.5,''$0\leq x\leq 2\pi$'',...

    ''HorizontalAlignment'',''Right'',...

    ''Interpreter'',''latex'',''FontSize'',25);

    set(ht,''Parent'',handles.axesSymbol);

    Slide    = get(handles.sliderC, ''Value'');

    Slider = num2str(Slide);

    set(handles.editC, ''String'',Slider);

    ```


    Under the `sliderC_Callback` function, write the following code.


    ```

    Slide    = get(handles.sliderC, ''Value'');

    Slider = num2str(Slide);

    set(handles.editC, ''String'',Slider);

    ```


    Under the `editC_Callback` function, write the following code.


    ```

    Slide    = get(handles.editC, ''String'');

    Slider = str2double(Slide);

    set(handles.sliderC, ''Value'',Slider);

    ```


    Finally, under the `pushbuttonZ_Callback` function, write the following code.


    ```

    ChoicE = get(handles.popupmenuY,''Value'');

    CC=get(handles.editC,''String'');

    C=str2double(CC);

    x=0:0.1:2*pi;

    switch ChoicE

    case 1 % sin(x)

    z=C*sin(x);

    plot(z);

    case 2 %cos(x)

    z=C*cos(x);

    plot(z);

    case 3 %tan(x)

    z=C*tan(x);

    plot(z);

    case 4 %cot(x)

    z=C*cot(x);

    plot(z);

    end

    grid on

    ```


    Once we run the code, we obtain the GUI shown in Figure [12-10](#483991_1_En_12_Chapter.xhtml#Fig10).


    **Example 12-5.** Create a GUI for a restaurant to calculate customers’ bills.
    The logo and the name of the restaurant should be on the GUI as well. Within the
    GUI, there should be panels for soups, desserts, and other available meals. Customers
    can pick only one kind of soup, but they can pick as much as they desire of anything
    else.


    **Solution 12-5.** Figure [12-11](#483991_1_En_12_Chapter.xhtml#Fig11) displays
    the outline of the GUI.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig11_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig11_HTML.jpg)


    Figure 12-11


    Output of the GUI named `Restaurant.m`


    After designing the GUI as shown, and saving it as `Restaurant.fig`, the file
    `Restaurant.m` is automatically generated. Then, the codes given next are entered
    for the corresponding functions.


    As a first step, the logo of the restaurant should be uploaded to the GUI. Hence,
    under the `Restaurant_OpeningFcn` function, write the following code.


    ```

    axis(handles.axes1,''off'');

    myImage = imread(''Restaurant.jpg'');

    axes(handles.axes1);

    imshow(myImage);

    ```


    In the preceding code, the logo is saved as `Restaurant.jpg` within the same directory
    as the files `Restaurant.m` and `Restaurant.fig`.


    Next, we need to write code to calculate the bills for the selected meals. Under
    the `pushbuttonprice_Callback` function, write the following code.'
