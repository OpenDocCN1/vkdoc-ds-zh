    # 4. Numerical Methods


    In this chapter, I present how to solve problems using numerical techniques. First,
    interpolation and extrapolation methods are introduced. Next, curve fitting and
    root finding are explained. Finally, numerical integration and numerical differentiation
    are covered.


    ## Interpolation and Extrapolation


    It is possible to find the corresponding value of a point within a given domain
    using the function `interp1` when dealing with interpolation in one-dimensional
    applications. It is also possible to find a value that is out of a given domain
    via the same function. This method is called extrapolation. Various methods such
    as `linear` or `spline` are available in the `interp1` function (Table [4-1](#483991_1_En_4_Chapter.xhtml#Tab1)).
    Some of the methods, which can be used for interpolation, are not available for
    extrapolation within the `interp1` function. If an outer point is picked for extrapolation
    using a method in which extrapolation does not work, MATLAB returns `NaN` which
    stands for “not a number.” Therefore, the method of choice is important for performing
    interpolation or extrapolation.


    Table 4-1


    Methods Used with `interp1`


    | Option | Explanation |

    | --- | --- |

    | linear | Uses linear interpolation (default value) |

    | nearest | Uses nearest neighbor interpolation |

    | next | Uses next neighbor interpolation |

    | previous | Uses previous neighbor interpolation |

    | spline | Uses piecewise cubic spline interpolation and extrapolation |


    **Example 4-1.** For the given values of *x* = [1, 2, 5, 8] and *y* = [20, 30,
    50, 80], calculate the value of 7 using the default method of the `interp1` function,
    and calculate the value of 10 with the methods `linear` and `spline`.


    **Solution 4-1.** The following code can be used to accomplish the given task.


    *Example4p1.m*


    ```

    %Example4p1

    %This code uses interp1 function

    x=[1, 2, 5, 8];

    y=[20, 30, 50, 80];

    ValX1 = interp1(x,y,7);

    ValX2 = interp1(x,y,10,"linear");

    ValX3 = interp1(x,y,10,"spline");

    fprintf("1st value is %f\n",ValX1)

    fprintf("2nd value is %f\n",ValX2)

    fprintf("3rd value is %f\n",ValX3)

    ```


    Once the code is executed, the following output will be obtained.


    ```

    > Example4p1

    1st value is 70.000000

    2nd value is NaN

    3rd value is 121.428571

    >

    ```


    As shown in the preceding output, the computer prints `NaN` for the `2nd value`.
    It indicates the fact that extrapolation is not available with the `linear` method
    in the `interp1` function.


    ## Curve Fitting


    Using a data set, one can obtain a polynomial function using the function `polyfit`.


    **Example 4-2.** For the given values of *x* = [4, 6, 6.5, 8, 10] and *y* = [4,
    8, 6, 7, 9], obtain four different curves from the first degree to the fourth.
    Then, with these four polynomials, evaluate the values of *x,* where *x* = 3:0.5:20\.
    The code should plot all the curves in a single figure.


    **Solution 4-2.** The following code can be used to accomplish the given task.


    *Example4p2.m*


