- fmt: '# Operations on Images


    There are some functions that make users’ job easier in manipulating images. Some
    of them are given in Table 10-4.


    **Table 10-4** Useful Functions for Manipulating Images


    | Function | Explanation | Example Format |

    | --- | --- | --- |

    | `imadd` | Adds two images, or adds a constant to an image | `Z = imadd(X,Y)`
    |

    | `imrotate` | Rotates the image A in degrees in counterclockwise direction |
    `B = imrotate(A,angle)` |

    | `imadjust` | Adjusts the intensity values of the image | `J = imadjust(I)` |

    | `imresize` | Resizes the image A to specified number of rows and columns | `B
    = imresize(A, [#rows #cols])` |


    **Example 10-3.** Write a program that reads the image from the file `football.jpg`.
    Then, rotate the image 30, 90, and 180 degrees.


    **Solution 10-3.** The following code can be used to accomplish the given task.


    *Example10p3.m*


    ```

    %Example10p3

    %This code rotates images

    F = imread(''football.jpg'');

    F30  = imrotate(F,30);

    F90  = imrotate(F,90);

    F180 = imrotate(F,180);

    subplot(2,2,1),imshow(F)

    title(''Original Image'')

    subplot(2,2,2),imshow(F30)

    title(''Rotation with 30'')

    subplot(2,2,3),imshow(F90)

    title(''Rotation with 90'')

    subplot(2,2,4),imshow(F180)

    title(''Rotation with 180'')

    ```


    There are some images that already exist in MATLAB. One can directly read these
    images without having them in the directory. `Football.jpg` is one of these image
    files.


    In the preceding code, the `imrotate` function rotates the images counterclockwise.
    Once the code is run, the output shown in Figure 10-7 is obtained.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig7_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig7_HTML.jpg)


    **Figure 10-7** Rotating images


    **Example 10-4.** Write a program that reads the images from the files `rice.png`
    and `cowboys.png`, respectively. Then, combine these images, and add 100 to the
    image `rice.png`. While combining images, dimensions of the pictures should match.
    If they do not match, then the code should pick the smallest row and column numbers
    from the dimensions of the pictures. The code should show all of these images
    on one figure separately.


    **Solution 10-4.** Show the images `cowboys.png` and `rice.png` separately in
    a figure. Then, you can show the combined picture and the picture obtained by
    adding 100 to `rice.png` in the same figure. The code can be written as given
    here.


    *Example10p4.m*


    ```

    %Example10p4

    %This code combines images

    I = imread(''rice.png'');

    J = imread(''cowboys.png'');

    [rr,cr]=size(I);[rj,cj]=size(J);

    Row=min(rr,rj);Col=min(cr,cj);

    K = imadd(I(1:Row,1:Col),J(1:Row,1:Col));

    JJ = imadd(I,100);subplot(2,2,1)

    imshow(I);title(''Only Rice'')

    subplot(2,2,2),imshow(J)

    title(''Only cowboy'');subplot(2,2,3)

    imshow(JJ);title(''100 added to Rice'')

    subplot(2,2,4),imshow(K)

    title(''Combined Picture'')

    ```


    Once the code is executed, the images appear as shown in Figure 10-8.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig8_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig8_HTML.jpg)


    **Figure 10-8** Combined images


    As shown in Figure 10-8, after the addition, the combined images get brighter.
    This is due to the fact that having larger numbers in the matrix makes the image
    brighter.


    ## Image Enhancement


    The purpose of image enhancement is to modify the given image so that the revised
    image is improved. This can be done by manipulating the pixel value of the images,
    called point processing. The methods used can be from enhancement in the spatial
    domain or enhancement in the frequency domain.


    ### Point Processing


    Point processing operations can be represented simply in the following form:


    ![$$ g=T(f) $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ1.png)


    (1)


    In Equation (1), `g` represents the output of the processed image pixel value,
    `f` represents the pixel value of the image, and `T` represents the point processing
    operation.


    **Example 10-5.** Write a program that reads the image named `Cowboys.png` to
    the workspace. Then, the code should generate four different images using the
    pixel values of the read image. The output images should be obtained by calculating
    the powers of pixel values of the image as 1/5, 1/2, 2, and 4.


    **Solution 10-5.** The following code can be used to accomplish the given task.


    *Example10p5.m*


    ```

    %Example10p5

    %This code manipulates pixel values

    im=imread(''Cowboys.png'');

    im1=double(im).^(1/5);im2=double(im).^(1/2);

    im3=double(im).^(2);im4=double(im).^(4);

    im1=mat2gray(im1);im2=mat2gray(im2);

    im3=mat2gray(im3);im4=mat2gray(im4);

    subplot(221),imshow(im1);title(''\^(1/5)'');

    subplot(222),imshow(im2);title(''\^(1/2)'');

    subplot(223),imshow(im3);title(''\^(2)'');

    subplot(224),imshow(im4);title(''\^(4)'');

    ```


    In the code, it is not difficult to see that, if the power is smaller, then the
    obtained result becomes smaller, too. If the power increases, the result of the
    calculation increases, too. Before making calculations, pixel values of the image
    are converted to `double` with the `double` command. After calculating powers,
    they are sent back to intensity image values using the `mat2gray` function.


    Once the code is run, the output shown in Figure 10-9 is displayed.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig9_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig9_HTML.jpg)


    **Figure 10-9** Updated image with new pixel values


    Changing specific pixel values within an image is also possible, as illustrated
    in Example 10-6.


    **Example 10-6.** Write a program that reads the image named `Cowboys.png` to
    the workspace, with an array matrix of 356 × 605 × 3. Then, for every element
    of the array having values between 30 and 150, change these values to 1.


    **Solution 10-6.** The following code can be used to accomplish the given task.


    *Example10p6.m*


    ```

    %Example10p6

    %This code changes pixel values in RGB

    [RGB]=imread(''Cowboys.png'');

    [Row,Col,ind]=size(RGB);

    for i=1:ind

    for k=1:Row

    for m=1:Col

    if RGB(k,m,i)>=30 && RGB(k,m,i)<=150

    RGB(k,m,i)=1;

    end

    end

    end

    end

    imshow(RGB)

    ```


    Once the code is executed, the output is shown in Figure 10-10.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig10_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig10_HTML.jpg)


    **Figure 10-10** Updated image with new pixel values


    The preceding code checks each cell value of `R`, `G`, and `B` cells. Then, `1`
    is assigned to elements having values between 30 and 150.


    Using histograms help us to understand how the gray levels are distributed in
    a grayscale image. Therefore, important inferences can be drawn from the appearance
    of a histogram. To obtain the histogram of an image, the `imhist` function is
    used.


    **Example 10-7.** In Example 10-5, there are four images plotted. Write code to
    show the histogram of those four images.


    **Solution 10-7.** The following code can be used to accomplish the given task.


    *Example10p7.m*


    ```

    %Example10p7

    %This code uses imhist function

    im=imread(''Cowboys.png'');

    im1=mat2gray(double(im).^(1/5));

    im2=mat2gray(double(im).^(1/2));

    im3=mat2gray(double(im).^(2));

    im4=mat2gray(double(im).^(4));

    subplot(221),imhist(im1);title(''\^(1/5)'');

    subplot(222),imhist(im2);title(''\^(1/2)'');

    subplot(223),imhist(im3);title(''\^(2)'');

    subplot(224),imhist(im4);title(''\^(4)'');

    ```


    Once the code is run, the histograms shown in Figure 10-11 are the result.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig11_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig11_HTML.jpg)'
