    Then plot the graphic of the signal *f*(*x*) where −2*π* ≤ *x* ≤ 2*π*.


    ### Solution 9-8.

    If we plug the given `a[0]`, `a[n]`, and `b[n]` into Equation [18](#483991_1_En_9_Chapter.xhtml#Equ18),
    we get the following:


    ![$$ f(x)=\frac{4}{\pi}\left(\mathit{\cos}\frac{\pi x}{1.5}+\mathit{\sin}\frac{\pi
    x}{1.5}+\frac{1}{3}\mathit{\cos}\frac{3\pi x}{1.5}+\frac{1}{3}\mathit{\sin}\frac{3\pi
    x}{1.5}+\dots \right) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ22.png)


