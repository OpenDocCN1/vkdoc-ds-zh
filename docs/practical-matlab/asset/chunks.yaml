  raw: '## MATLAB Environment


    When you run MATLAB, the programming frame is opened. The cursor awaits in the
    command window with the prompt > preceding it. If you run the student version,
    the prompt is EDU>.


    Let us explore the console of MATLAB, which has a simple appearance. The default
    window will look like Figure [1-1](#483991_1_En_1_Chapter.xhtml#Fig1).


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig1_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    MATLAB environment


    When you open MATLAB, its interface has the following windows:


    *   *Command Window:* This is the window in which we enter commands.


    *   *Current Folder:* This window shows the directory in which MATLAB operates.


    *   *Workspace:* We can see the program variables in this window.


    *   *Command History:* Here we can monitor the previous commands that we typed
    in the command window.


    *   *Editor:* We can write code that we want to run as an m-file in this window.


    The user might want to close any of these windows to reorganize the interface.
    You can also customize the appearance interface, such as the way it looks in terms
    of color, font, and so on. Click ENVIRONMENT and then Preferencesto open the menu
    shown in Figure [1-2](#483991_1_En_1_Chapter.xhtml#Fig2).


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig2_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Changing properties


    Just by clicking on the items in the left frame shown in Figure [1-2](#483991_1_En_1_Chapter.xhtml#Fig2),
    you can customize these settings based on your preferences.


    When working with MATLAB, one of the most useful commands is the `help` command,
    which illustrates how a command works and how it is used in MATLAB. Once you type
    `help` and press Enter, you can click on any of the underlined subjects on the
    resulting screen to review them in detail.


    If you are new to MATLAB, you can watch some tutorials available through a demo.
    If you type `demo` in the command window, you can select from any of the available
    topics to explore:


    ```

    >demo

    >

    ```


    By clicking on any topic, you can watch the related tutorials, or see explanations
    of commands with illustrative examples. Some of the introductory commands used
    to carry out some basic operations such as closing MATLAB or recording a session
    from the command window are listed in Table [1-1](#483991_1_En_1_Chapter.xhtml#Tab1).


    Table 1-1


    Some Basic Commands Used in MATLAB


    | Function | Explanation | Example |

    | --- | --- | --- |

    | help | Returns information about the specified command | >>help clc |

    | demo | Shows the explanation of any subject in MATLAB | >>demo |

    | save | Saves the workspace variables to the named file | >>save my_var |

    | diary on | Starts recording the session | >>diary on |

    | diary off | Stops recording the session and saves it to a diary file | >>diary
    off |

    | exit | Terminates MATLAB | >>exit |

    | quit | Terminates MATLAB | >>quit |

    | clc | Clears the screen | >>clc |

    | clear | Clears all variables or any specified variable from the workspace |
    >>clear all |

    | who | Displays all the variables in the workspace | >>who |

    | whos | Displays all the variables in the workspace with sizes and types | >>whos
    |


    Throughout the book, examples demonstrate the usage of MATLAB. Each example illustrates
    an important aspect of a feature of the subject in the relevant chapter.


    In MATLAB, you can save your session from start to finish by saving your session
    with the `save` function. We can take a look at the following example of this.


    **Example 1-1.** Type `disp (''Hello World'')` at the prompt. Save your session
    in a file named `my_session`.


    **Solution 1-1.** The following piece of code can be typed at the prompt.


    ```

    > diary my_session

    > disp(''Hello World'')

    Hello World

    > diary off

    ```


    MATLAB will create a file named `my_session` in your current directory. If you
    click on the file, it will be appear in the editor as follows.


    ```

    disp(''Hello World'')

    Hello World

    diary off

    ```


    In this code, the command `disp()` displays whatever is typed between the single
    quotation marks next to it. If the expression to be displayed is a number, then
    there is no need to include the quotation marks. If the expression is a string
    or a letter, then we need to include the quotation marks before and after the
    text along with the `disp()` function.


    ## Using MATLAB as a Calculator


    MATLAB can be used as a calculator, as well. You can find the solution for any
    complex calculation. In the following example, we can see an illustration of this
    function.


    **Example 1-2.** Find the result of ![$$ 5-\frac{8}{3}+ coscos\ \left(\pi \right)-\frac{10}{e^2}+\sqrt{7}
    $$](images/483991_1_En_1_Chapter/483991_1_En_1_Chapter_TeX_IEq1.png).


    **Solution 1-2.** The following code will find the solution.


    ```

    > 5-8/3+cos(pi)-10/exp(2)+sqrt(7)

    ans =

    2.6257

    >

    ```


    As shown in the preceding code, *π* is represented by word `pi` in MATLAB. For
    the Euler’s number ***e***, we need to type `exp(2)`, and `sqrt(7)` should be
    used for finding the square root of 7\. Because we did not assign a variable to
    the result, the result is shown as `ans` and it is printed on the screen, where
    it stands for answer.'
