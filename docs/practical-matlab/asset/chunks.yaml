    for *f*(*x*) having 79 terms in it. The following code can be used to generate
    the graph of *f*(*x*).


    *Example9p8.m*


    ```

    %Example9p8

    %This code plots graph of a signal

    n=79;Point=1000;

    x=linspace(-2*pi,2*pi,Point);

