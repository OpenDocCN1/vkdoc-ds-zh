- fmt: '### Enhancement in the Frequency Domain


    The frequency domain deals with the rate of pixel change. These types of enhancements
    are based on modifying a Fourier transform. Some of the filtering functions used
    are listed in Table [10-6](#483991_1_En_10_Chapter.xhtml#Tab6).


    **Table 10-6** Filtering Functions for the Frequency Domain


    | Function | Explanation |

    | --- | --- |

    | `freqspace` | Used to create frequency responses |

    | `freqz2` | Creates frequency response for a 2-dimensional FIR filter |

    | `fsamp2` | Creates a 2-dimensional FIR filter for an entered frequency response
    |


    The process of enhancement in the frequency domain can be summarized as follows:

    1. Take the Fourier transform of an image.

    2. Multiply the obtained output by a filter transfer function.

    3. Take the inverse Fourier transform of the image.


    ![$$ \mathrm{g}\left({\mathrm{w}}_1,{w}_2\right)=F\left({\mathrm{w}}_1,{\mathrm{w}}_2\right)\ast
    \mathrm{H}\left({\mathrm{w}}_1,{w}_2\right) $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ3.png)
    (3)


    These procedures are illustrated simply in Figure [10-16](#483991_1_En_10_Chapter.xhtml#Fig16).


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig16_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig16_HTML.jpg)


    **Figure 10-16** Diagram of filtering in the frequency domain


    Different filter functions can be selected as `H(u, v)`. For the low pass filter,
    an ideal low pass filter (ILPF) is used in general in two-dimensional applications.


    ![$$ {H}_{LP}\left(u,v\right)=\left\{\begin{array}{c}1,\kern0.5em ifD\left(u,v\right)\le
    {D}_0\\ {}0,\kern0.5em ifD\left(u,v\right)&gt;{D}_0\end{array}\right. $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ4.png)
    (4)


    In Equation [4](#483991_1_En_10_Chapter.xhtml#Equ4), `D[0]` is the radius of the
    circle from the origin. The filter passes all the frequencies within `D[0]`, and
    cuts off the rest of the frequencies. The simplest high pass filter is the complement
    of ILPF defined as follows.


    ![$$ {H}_{HP}\left(u,v\right)=1-{H}_{LP}\left(u,v\right) $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ5.png)
    (5)


    The ideal high pass filter (IHPF) is used in general in two-dimensional applications.


    ![$$ {H}_{LP}\left(u,v\right)=\left\{\begin{array}{c}0,\kern0.5em ifD\left(u,v\right)\le
    {D}_0\\ {}1,\kern0.5em ifD\left(u,v\right)&gt;{D}_0\end{array}\right. $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ6.png)
    (6)


    **Example 10-12.** Write code to apply the ILPF defined earlier to the `Cowboys.png`
    image. The filter should be written as a separate function. The value of `D[0]`
    should be 50. The resulting figure should show the original image, the transformed
    image, the filter, and the final enhanced image.


    **Solution 10-12.** The main body of the code and the separated filter function
    can be written as illustrated in the following code.


    *Example10p12.m*

    ```

    %Example10p12

    %This code works in frequency domain

    im =imread(''cowboys.png'');

    P_grayscale = rgb2gray(im);close all;

    P_grayscale=double(P_grayscale);

    subplot(221),imshow(mat2gray(P_grayscale));

    title(''Original Image'');

    %image i frequency domain

    freq_rec=fft2(P_grayscale);

    freq_rec=fftshift(freq_rec);

    freq_rec_disp=log(1+abs(freq_rec));

    %image shown in frequency domain.

    subplot(222),imshow(mat2gray(freq_rec_disp));

    title(''Fourier transform is applied'');

    [Row,Col]=size(P_grayscale);

    Filter =My_filter(Row,Col);

    % Applying filtering

    Filtering = freq_rec.*Filter;

    Filtering_disp=log(1+abs(Filtering));

    subplot(223),imshow(mat2gray(Filtering_disp));

    title(''Applied Filter'');

    %%% converting back to image

    FilteredIm=real(ifft2(ifftshift(Filtering)));

    subplot(224),imshow(mat2gray(abs(FilteredIm)));

    title(''Enhanced Image'');

    ```

    *My_filter.m*

    ```

    function Filter =My_filter(Roww,Coll)

    Row=ceil(Roww/2);Col=ceil(Coll/2);

    D_0=50;

    Filter=zeros(Roww,Coll);

    for m=1:Roww

    for n=1:Coll

    if((m-Row)^2+(n-Col)^2)^0.5<=D_0

    Filter(m,n)=255;

    end

    end

    end%Filter = 255-Filter; can be tried

    end

    ```

    Once the code is run, the result is shown in Figure [10-17](#483991_1_En_10_Chapter.xhtml#Fig17).


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig17_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig17_HTML.jpg)


    **Figure 10-17** Output of Example 10-12


    ### Enhancement with Other Functions


    Enhancement can also be performed using integral image domain filtering, texture
    filtering, and edge preserving filtering functions, some of which are listed in
    Tables [10-7](#483991_1_En_10_Chapter.xhtml#Tab7) and [10-8](#483991_1_En_10_Chapter.xhtml#Tab8).


    **Table 10-8** Filtering Functions Used for Edge Preserving


    | Function | Explanation |

    | --- | --- |

    | `imbilatfilt` | Perfoms Gaussian bilateral filter on entered image |

    | `imguidedfilter` | Applies filter using the guided filter |

    | `imnlmfilt` | Performs a nonlocal means-based filter to color or grayscale images
    |


    **Table 10-7** Filtering Functions Used in Integral Image Domain


    | Function | Explanation |

    | --- | --- |

    | `integralImage` | Calculates integral image |

    | `integralImage3` | Calculates 3-D integral image |

    | `integralBoxFilter` | Filters the entered integral image with a 3-by-3 box filter
    |


    Apart from the functions listed in Tables [10-7](#483991_1_En_10_Chapter.xhtml#Tab7)
    and [10-8](#483991_1_En_10_Chapter.xhtml#Tab8), `gabor` and `imgabor` functions
    are used in texture filtering.


    **Example 10-13.** Write code that adds Gaussian white noise having zero mean
    and 0.0005 variance to the `peppers.png` image. Then use the `imnlmfilt` nonlocal
    means-based filter to remove the noise.


    **Solution 10-13.** The following code can be used to accomplish the given task.


    *Example10p13.m*

    ```

    %Example10p13

    %This code works with imnlmfilt function

    I = rgb2gray(imread(''peppers.png''));

    noisyImage = imnoise(I,''gaussian'',0,0.0005);

    filteredImage = imnlmfilt(noisyImage);

    subplot(211),imshow(noisyImage);

    title(''Image with noisy'');

    subplot(212),imshow(filteredImage);

    title (''Filtered Image'');

    ```

    Once the code is run, the images shown in Figure [10-17](#483991_1_En_10_Chapter.xhtml#Fig17)
    are obtained.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig18_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig18_HTML.jpg)


    **Figure 10-18** Output of Example 10-13


    ## Image Restoration


    Removing degradation from an image signal and regaining the original signal is
    called *image restoration*. In this section, we look at how the image signals
    lose their original state with salt and pepper noise, Gaussian noise, and periodic
    noise. Then methods of eliminating this noise are presented.'
