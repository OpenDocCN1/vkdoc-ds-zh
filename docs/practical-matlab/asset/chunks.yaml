    \ Moodie, Lead Development Editor at Apress, for being a part of this team, and\
    \ Karpur Shukla, the reviewer of this project. I would like to thank my primary\
    \ PhD supervisor, Associate Professor Dr. Maksat Ashyraliyev from the Software\
    \ Engineering Department of Bahcesehir University, for his priceless contributions\
    \ to my skills. Finally, thanks go to my friend and colleague Ibrahim Emre Celikkale\
    \ for his recommendations.\n\n# About the Author and About the Technical Reviewer\n\
    \n## About the Author\n\n## About the Technical Reviewer\n\n# 1. Introduction\
    \ to MATLAB\n\n`MATLAB` is an abbreviation for the expression Matrix Laboratory.\
    \ It has been widely used in many kinds of applications and fields of study. `MATLAB`\
    \ is a high-level language, the reputation of which has been increasing over time.\
    \ Since its first use in 1970 by Cleve Moler, a famous mathematician and cofounder\
    \ of MathWorks, Inc. (the owner of `MATLAB`), it has shown huge advancement and\
    \ new tools have been added in the new versions released twice a year.\n\nDue\
    \ to the fact that it has a remarkable number of toolboxes, `MATLAB` attracts\
    \ many users from a variety of different areas ranging from engineering to applied\
    \ sciences. `MATLAB` has a large number of built-in functions that make the programmer's\
    \ job easier when it comes to solving problems. Although it is used primarily\
    \ for technical computing and addresses toolbox-oriented jobs, `MATLAB` carries\
    \ a very practical and easy programming language aspect, as well. One of the important\
    \ goals of this book is to emphasize the programming language aspect of this powerful\
    \ software.\n\n`MATLAB` possesses tools that satisfy the programmer's needs in\
    \ many applications. Even, these days, specific tasks often require specific software.\
    \ However, `MATLAB` can suit programmers' demands in most cases.\n\nThe `MATLAB`\
    \ prompt displays as a double greater sign (`>>`) in the command window. Due to\
    \ the trademark and logo usage guidelines of MathWorks, Inc., the `∎>` symbols\
    \ will be used together throughout this book to represent the `MATLAB` prompt.\n\
    \nIn this chapter, you will learn the necessary concepts of coding of the language\
    \ when it comes to solving real-life applications."
