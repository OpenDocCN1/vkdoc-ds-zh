    ## 预备知识


    本节将介绍本章中使用的新术语。MATLAB 拥有用于代数方程计算的符号数据类型，如第 1 章所示。`diff(f,x)` 函数用于计算符号表达式 `f` 对变量
    `x` 的导数。作为演示，我们可以看一下在命令提示符下输入的以下内容。


    ```

    > syms x

    > f=x³-7*x²+6*x-61;

    > y=diff(f,x)

    y =

    3*x² - 14*x + 6

    > t=diff(f,x,2)

    t =

    6*x - 14

    >

    ```


    将 `x` 定义为符号变量并定义 `f` 后，使用 `diff(f,x)` 计算 `f` 对 `x` 的导数，并将计算结果赋值给变量 `y`。接着，使用 `diff(f,x,2)`
    计算 `f` 函数的二阶导数，并将结果赋值给变量 `t`。


    ```

    > syms x

    > y=x²+2*x-8;

    > w=8*x+16;

    > solve(y,x)

    ans =


    > solve(w,x)

    ans =


    >

    ```


    在上述代码中，使用 `solve` 函数找到了使方程等于零的 `y` 的根和 `w` 的解。


    ```

    > syms x

    > y=3*x²-2*x-6;

    > MyFunc = matlabFunction(y);

    > MyFunc(2)

    ans =


    > MyFunc(3)

    ans =


    >

    ```


    此处，使用 `matlabFunction(y)` 将 `y` 的方程转换为 MATLAB 函数。随后，通过 `MyFunc` 函数计算了 `y(2)` 和
    `y(3)` 的值。


    ## 单利与复利


    利息是为借用资金而支付的费用。大多数情况下，根据合同约定，当人们将钱存入银行账户（例如，储蓄账户）时，会获得利息。通常，计算两种类型的利息：单利和复利。


    ### 单利


    *单利*通过本金金额、年利率以及以年为单位的时间相乘来计算。对于单利，每年赚取的利息不会被计入本金中。换句话说，单利仅在本金上产生。如果时间单位不是年，则需要将其转换为年。例如，如果给定时间为六个月，则时间计算为
    `T = (1/12) * 6 = 0.5`。如果给定时间为 30 天，则时间计算为 `T = (1/365) * 30`（假设一年按 365 天计算）。计算单利时，使用以下公式。


    `I = P * R * T`


    其中 `I` 是利息，`P` 是本金，`R` 是年利率，`T` 是以年为单位的时间。


    **示例 3-1.** 编写代码，为银行计算特定本金贷款、年利率和以月为单位的时间的还款金额。代码应要求用户输入这些值，并在屏幕上打印总还款额和已付利息。


    **解答 3-1.** 以下代码可用于完成给定任务。


    *Example3p1.m*


    ```

    %Example3p1

    %此代码计算单利

    P = input(''请输入本金金额: '');

    R = input(''请输入年利率: '');

    T = input(''请输入时间（月）: '');

    Interest=P*R*(1/12)*T;

    Total = P + Interest;

    fprintf(''已付利息金额为: %.2f\n'',Interest)

    fprintf(''总还款额为: %.2f\n'',Total)

    ```


    在代码中，`input` 函数用于在屏幕上输入一个值。输入值后，它会按照前面的说明分别赋值给 `P`、`R` 和 `T`。运行代码后，将得到以下输出。


    ```

    > Example3p1

    请输入本金金额: 2000

    请输入年利率: 0.20

    请输入时间（月）: 24

    已付利息金额为: 800.00

    总还款额为: 2800.00

    >

    ```


    **示例 3-2.** Omar 将 80,000 美元存入一家年利率为 35% 的银行。他计划在存款 19 个月后取出他的钱。银行也允许客户每月提取资金。编写代码计算他在
    19 个月后能获得的金额。


    **解答 3-2.** 以下代码可用于完成给定任务。


    *Example3p2.m*


    ```

    %Example3p2

    %此代码计算利息

    P = 8e+4;

    R=35/100;

    T=(1/12)*18;

    I=P*R*T;

    Balance = P + I;

    fprintf(''余额为 %.2f\n'',Balance);

    ```


    运行代码后，将得到以下输出。


    ```

    > Example3p2

    余额为 122000.00

    >

    ```


    ### 复利


    *复利*与单利不同。对于复利，利息也会在累积的利息上产生。计算出本金的利息后，将该值加入本金，新的金额成为新的本金。重复此过程直至当前时刻或每个计息周期。为了仅计算赚取的利息，需从总收益中减去本金金额。计算复利时，使用以下公式。


    `I = P * (1 + R'')^C - P`


    其中 `I` 是利息，`P` 是本金，`R''` 是周期利率，`C` 是复利期数。周期利率 `R''` 是应用于每个周期本金金额及已赚利息的利率。复利期数
    `C` 是应用利息的总周期数。周期利率通过将年利率除以每年的复利期数来计算。


    `R'' = (年利率) / (每年期数)`


    作为演示，对于 `P` = 100 美元，年利率 = 15%，每年期数 = 3（`R''` = 5%），`C` = 4，16 个月的总赚取金额（余额）可如表
    3-1 所示计算。


    表 3-1


    演示示例


    | 周期 | 利息 | 余额 |

    | --- | --- | --- |

    | 初始 |   | 100.00 美元 |

    | 4 个月 | 100.00 美元 * 5% = 5.00 美元 | 105.00 美元 |

    | 8 个月 | 105.00 美元 * 5% = 5.25 美元 | 110.25 美元 |

    | 12 个月 | 110.25 美元 * 5% = 5.51 美元 | 115.76 美元 |

    | 16 个月 | 115.76 美元 * 5% = 5.79 美元 | 121.55 美元 |


    **示例 3-3.** 编写代码，根据表 3-1 中给出的信息，以复利利率计算总余额。


    **解答 3-3.** 以下代码可用于完成给定任务。


    *Example3p3.m*


    ```

    %Example3p3

    %此代码计算复利

    format short

    P = 100;

    Rprime=0.05;

    C=4;

    Balance = P*((1+Rprime)^C);

    disp(Balance)

    ```


    运行代码后，将得到以下输出。


    ```

    > Example3p3

    121.5506

    >

    ```


    **示例 3-4.** Jennifer 将 150,000 美元存入一个年复利率为 12% 的银行账户。如果她在 5 年后从银行取钱，她能获得多少利息？


    **解答 3-4.** 以下代码可用于完成给定任务。


    *Example3p4.m*


    ```

    %Example3p4

    %此代码计算复利

    format short

    P = 15e+4;

    Rprime=0.12;

    C=5;

    Balance = P*((1+Rprime)^C);

    Interest = Balance - P;

    fprintf(''获得的利息: %.20f\n'',Interest)

    ```


    运行代码后，将得到以下输出。


    ```

    > Example3p4

    获得的利息: 114351.25248000008286908269

    >

    ```

