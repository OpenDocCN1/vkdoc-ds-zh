- fmt: '### Heterogeneous Data Types


    In some cases, due to the nature of the task at hand, we need to use more complex
    data types that are obtained by combining more than one type of data. These mixed
    data types are often called *heterogeneous* data types. Heterogeneous data types
    are encountered as cell arrays, structure arrays, and dataset arrays (tables)
    in MATLAB.


    #### Cell Arrays


    A *cell* can be regarded as a data box, and a cell array is an array of cells.
    Using the `cell` function, it is possible to preallocate empty cell arrays. Elements
    can be indexed by using the cell arrays. As an example, if you type `cell(3,2)`
    at the prompt, a variable of cell class is created as shown here.


    ```

    > CellAr1=cell(3,2)

    CellAr1 =

    []    []

    []    []

    []    []

    >

    ```


    To determine its class, you just need to type `class(CellAr1)` for the case given.


    ```

    > class(CellAr1)

    ans =

    cell

    >

    ```


    There are several ways of creating a cell array. You may either preallocate the
    cell array before assigning values to the array, which is the case shown earlier,
    or you can just define the array and use it without preallocation.


    **Example 1-15.** Define a cell array that holds the data in Table [1-12](#483991_1_En_1_Chapter.xhtml#Tab12).


    **Solution 1-15.** There are two different ways of defining this cell array. In
    the first method, all of the elements can be assigned to a single variable, whereas
    in the second case, the elements should be defined one by one. Let us name the
    cell array `My_cell_array`. Then, type the following at the prompt;


    ```

    > My_cell_array={eye(3),''How are you?'',2015;''Hola'',72,''Alexander''}

    My_cell_array =

    [3x3 double]    ''How are you?''    [     2015]

    ''Hola''          [          72]    ''Alexander''

    >

    ```


    As shown, the index of the cell array is defined within curly brackets.


    #### Structures


    The most significant distinction between structures and cell arrays is the indexing.
    Although cell arrays can be indexed in terms of the elements contained in them,
    it is not possible to loop through the elements of structures. In other words,
    data are stored in a *field* in structures.


    One of two different methods can be followed to create a structure. One is using
    the `struct` function and the other one is using the dot operator.


    **Example 1-16.** A company wants to save an employee’s information as shown in
    Table [1-13](#483991_1_En_1_Chapter.xhtml#Tab13).


    Write a program that stores the information given in Table [1-13](#483991_1_En_1_Chapter.xhtml#Tab13).


    **Solution 1-16.** One way of doing that is to create a structure array by using
    the `struct` function as shown here.


    *StructArrayEx.m*


    ```

    % Name of this file is StructArrayEx.m

    % This is Example 1-16

    % This code creates a structure

    employer=struct(''id'',5001,''name'',''Robert'',''address'',...

    ''San Antonio, TX'',''salary'',39900)

    ```


    As seen in the preceding code, the data are entered next to one another and are
    separated by a comma within the `struct` function. Once the program is executed
    from the command window, the following output will be shown.


    ```

    > StructArrayEx

    employer =

    struct with fields:

    id: 5001

    name: ''Robert''

    address: ''San Antonio, TX''

    salary: 39900

    >

    ```


    #### Tables


    The third class of heterogeneous data types is called *tables.* Tables are especially
    convenient for storing column-oriented data. It is possible to perform useful
    operations on tables such as creating tables, reading data from the tables, changing
    the content of the tables, and so on. Some basic table functions are shown in
    Table [1-14](#483991_1_En_1_Chapter.xhtml#Tab14).


    **Example 1-17.** In a workspace, there are three variables:


    `Name = [''Alex''; ''Slim''; ''Bill'']`, `Age = [35; 40; 45]`, and `Height = [160;
    165; 170]`.


    Using these data, write a program to create a table. The table should then be
    saved in a `MyTable.xlsx` file.


    **Solution 1-17.** The following code can be used to accomplish this task.


    *CreateTables.m*


    ```

    % Name of this file is CreateTables.m

    % This is Example 1-17

    % This code creates a table and

    % saves it as an .xlsx file

    Name = [''Alex'';''Slim'';''Bill''];

    Age = [35; 40; 45];

    Height = [160; 165; 170];

    T = table(Name,Age,Height)

    writetable(T,''MyTable.xlsx'')

    ```


    Once the code is executed, we obtain the following output.


    ```

    > CreateTables

    T =

    3×3 table

    Name    Age    Height

    ____    ___    ______

    Alex    35      160

    Slim    40      165

    Bill    45      170

    >

    ```


    The spreadsheet file was saved in the `MyTable.xlsx` file in the directory as
    well.


    More complex applications are available for tables. Here, we have seen only a
    simple example to give an idea about the general concept.


    ## Plotting Graphics


    MATLAB is a very powerful tool for graphics and plotting. A wide range of drawing
    tools are available for tasks such as plotting in polar coordinates, logarithmic
    graphics, animated 3-D plots, volume visualization plots, and so on. This section
    deals with the basic plotting of functions in two dimensions and plotting multiple
    functions on a single coordinate system or on a single figure.


    ### Single Plotting


    The basic command for drawing a function in MATLAB is the `plot` function. The
    simplest form of the `plot` command is `plot(y)`, where `y` depends on its index.
    The most common use of the `plot` function is in the form of `plot(x,y)`, which
    is the Cartesian plot of an `(x,y)` pair.


    **Example 1-18.** Plot the function *y* = 2 * sin(*x*) through the interval of
    0 ≤ *x* ≤ *π*.


    **Solution 1-18.** If `x` is defined as a vector from 0 to pi using the `linspace`
    command, then we can draw the corresponding values of `y` versus `x`. In the following
    code, the distance from 0 to pi is divided into 100 points. If we pick a large
    number of points such as 1,000, the graph will become more precise.


    ```

    > x=linspace(0,pi,100);

    > y=2.*sin(x);

    > plot(x,y)

    >

    ```


    The code just given produces the output shown in Figure [1-6](#483991_1_En_1_Chapter.xhtml#Fig6).


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig6_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Cartesian plot of `y=2sin(x)` where 0 ≤ *x* ≤ *π*


    Various features of graphics such as title, x label, y label, and grids are available
    in MATLAB. These features are shown in Table [1-15](#483991_1_En_1_Chapter.xhtml#Tab15).


    There are some other features available that allow programmers to work with line
    styles, colors, and sizes, as shown in Table [1-16](#483991_1_En_1_Chapter.xhtml#Tab16).


    To create a regular plot using the `plot` function, different options can be included
    in the drawing.


    There is a remarkable number of special functions available to create two-dimensional
    and three-dimensional plots in MATLAB. In the command window, if you type `>help
    specgraph` and press Enter, you will see which special functions are available
    in your version.'
