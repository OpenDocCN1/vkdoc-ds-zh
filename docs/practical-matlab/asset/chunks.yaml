- fmt: '# 9. Signal Processing


    Signal processing is one of the subfields of electrical engineering that analyzes,
    modifies, and operates information from all sources of data in the universe. A
    *signal* in signal processing is an electrical or electromagnetic current that
    relocates data from one device to another. Everything in the cosmos, such as sounds,
    images, and videos, can be described as a signal in the form of a wave. Signals
    can be represented as functions of one or more independent variables mathematically.


    Signal processing has a very wide field of applications, including brain–computer
    interfaces, voice recognition, motion-sensing games, three-dimensional television,
    wearable technologies, biometric security, and more. Full coverage of this subject
    is beyond the scope of this chapter. Here, we review some introductory topics
    and a few applications in this area with MATLAB, including signal types, currents,
    Fast Fourier Transform, and harmonic analysis.


    ## Signal Types


    Signals can be classified into a few categories such as energy and power signals,
    or deterministic or probabilistic signals. In this section, we take a look at
    continuous and discrete signals, analog and digital signals, periodic and nonperiodic
    signals, and even and odd signals.


    ### Continuous and Discrete Signals


    For a signal defined as a function, if for every value of an independent variable
    (e.g., *t*), there exists a corresponding value (e.g., *y*), then that function
    is called a *continuous time* (CT) signal. However, if a signal represented as
    a function is defined for some discrete values of independent variable *t*, then
    it is called a *discrete time* (DT) signal. DT might not have a function of time
    in some cases. As an example, in a grayscale image, there are two-dimensional
    discrete values in the matrix of the image that represent colors of the image.


    In Figure [9-1](#483991_1_En_9_Chapter.xhtml#Fig1), we see the graphic of *y*(*t*)
    where


    ![$$

    \mathrm{y}(t)=\sin (t),-2\pi \le t\le 2\pi

    $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ1.png)


    (1)


    with a continuous signal.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig1_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    An example of a continuous signal


    In Figure [9-2](#483991_1_En_9_Chapter.xhtml#Fig2), although the same function
    is used, the output is different. Because discrete values of *t* are used, the
    obtained output is a discrete signal as well.


    ![$$

    y\left[t\right]=\sin (t),t=0,\pm \frac{\pi }{6},\pm \frac{2\pi }{6},\pm \frac{3\pi
    }{6},\dots, \pm \frac{12\pi }{6}

    $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ2.png)


    (2)


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig2_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    An example of a discrete signal


    In Equation [2](#483991_1_En_9_Chapter.xhtml#Equ2), because *t* has discrete values,
    the function *y* has discrete values (corresponding to *t* values) as well.


    In general, continuous functions are shown with parenthesis and square brackets
    are used to define discrete functions.


    **Example 9-1.** For the given discrete signal function *y* = *f*[*t*] = cos(2*t*),
    where *t* is defined as −*π* ≤ *t* ≤ *π*, create 10 discrete equally spaced values
    for *t*. The code should then calculate the corresponding *y* values and print
    them on the screen.


    **Solution 9-1.** The following code can be used to accomplish the given task.


    *Example9p1.m*


    ```

    %Example9p1

    %This code has a discrete signal

    t = linspace(-2*pi,2*pi,10);

    y=cos(2*pi*t);

    disp(''y Values:'');

    disp(y);

    ```


    For DC signals, the `linspace` function is very useful to create equally spaced
    values for time. Once the code is executed, the following output is obtained.


    ```

    > Example9p1

    y Values:

    Columns 1 through 9

    -0.2070  0.7580  -0.9983  0.8292  -0.3202  -0.3202  0.8292  -0.9983  0.7580

    Column 10

    -0.2070

    >

    ```


