    ## Simple and Compound Interest


    Interest is the fee paid to borrow money. In most cases, interest is paid when
    people put their money in bank accounts (i.e., into savings accounts), depending
    on the contract. In general, two types of interest are calculated, simple and
    compound interest.


    ### Simple Interest


    *Simple interest* is calculated by multiplying the principal amount , annual rate,
    and time measured by year. For simple interest, the earned amount is not included
    in the principal amount at the end of the year. In other words, simple interest
    is only earned on the principal amount. If the time is not given in years, then
    it is converted to years. As an example, if the time is given as six months, then
    time is calculated as ![$$ T=\frac{1}{12}\ast 6=0.5 $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_IEq1.png).
    If it is given as 30 days, then the time is calculated as ![$$ T=\frac{1}{365}\ast
    30 $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_IEq2.png) (sssuming
    that a year is calculated as 365 days). For calculating simple interest, the following
    formula is used.


    ![$$ I=P\ast R\ast T $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_Equa.png)


    where *I* is the interest, *P* is the principal, *R* is the annual interest rate,
    and *T* if the time measured in years.


    **Example 3-1.** Write code to calculate payment amount for a certain principal
    loan, annual rate, and time in months for a bank. The code should ask the user
    these values, and should print the total payment and interest paid on the screen.


    **Solution 3-1.** The following code can be used to accomplish the given task.


    *Example3p1.m*


    ```

    %Example3p1

    %This code calculates simple interest

    P = input(''Enter Principal Amount: '');

    R = input(''Enter Annual Rate: '');

    T = input(''Enter Time As Month: '');

    Interest=P*R*(1/12)*T;

    Total = P + Interest;

    fprintf(''Paid Interest Amount is: %.2f\n'',Interest)

    fprintf(''Total Payment is: %.2f\n'',Total)

    ```


    In the code, the `input` function is used to enter a value on the screen. Once
    the value is entered, it is assigned to *P, R,* and *T* as specified earlier.
    Once the code is run, the following output is obtained.


    ```

    > Example3p1

    Enter Principal Amount: 2000

    Enter Annual Rate: 0.20

    Enter Time As Month: 24

    Paid Interest Amount is: 800.00

    Total Payment is: 2800.00

    >

    ```


    **Example 3-2.** Omar put $80,000 into a bank with a 35% annual interest rate.
    He plans to withdraw his money at the end of 19 months after depositing it. The
    bank allows customers to withdraw their funds monthly as well. Write code to calculate
    the amount of money he will ger at the end of 19 months.


    **Solution 3-2.** The following code can be used to accomplish the given task.


    *Example3p2.m*


    ```

    %Example3p2

    %This code calculates interest

    P = 8e+4;

    R=35/100;

    T=(1/12)*18;

    I=P*R*T;

    Balance = P + I;

    fprintf(''Balance is %.2f\n'',Balance);

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example3p2

    Balance is 122000.00

    >

    ```


    ### Compound Interest


    *Compound interest* is different from simple interest. For compound interest,
    interest is earned on the interest accrued as well. After calculating the interest
    on principal amount, that value is added to the principal and the new amount becomes
    the new principal amount. The same process is repeated up to the present or for
    each cycle. To find only the earned interest, the principal amount is subtracted
    from the total earnings. For the calculation of compound interest, the following
    formula is used.


    ![$$ I=P\ast {\left(1+{R}^{\prime}\right)}^C-P $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_Equb.png)


    where *I* is the Interest, *P* is the principal, *R’* is the periodic interest
    rate, and C is the compounding period. Periodic interest rate, *R’,* is the rate
    applied to the sum of the principal amount and earned interest for every period.
    Compounding period, *C,* is the the total number periods for which the interest
    is applied. Periodic interest rate is calculated by dividing the annual rate by
    yearly compounding periods.


    ![$$ {R}^{\prime }=\frac{Annual\ rate}{Periods\ per\ year} $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_Equc.png)


    As an illustration, for *P* = $100, annual rate = 15%, periods per year = 3 (*R*′
    = 5%), and *C* = 4, total earned amounts (balances) can be calculated for 16 months
    as shown in Table [3-1](#483991_1_En_3_Chapter.xhtml#Tab1).


    Table 3-1


    An Illustration


    | Period | Interest | Balance |

    | --- | --- | --- |

    | Starting |   | $100.00 |

    | 4 months | $100.00*5%=$5.00 | $105.00 |

    | 8 months | $105.00*5%=$5.25 | $110.25 |

    | 12 months | $110.25*5%=$5.51 | $115.76 |

    | 16 months | $115.76*5%=$5.79 | $121.55 |


    **Example 3-3.** Write code to calculate the total balance with a compound interest
    rate for the information given in Table [3-1](#483991_1_En_3_Chapter.xhtml#Tab1).


    **Solution 3-3.** The following code can be used to accomplish the given task.


    *Example3p3.m*


    ```

    %Example3p3

    %This code calculates compound interest

    format short

    P = 100;

    Rprime=0.05;

    C=4;

    Balance = P*((1+Rprime)^C);

    disp(Balance)

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example3p3

    121.5506

    >

    ```


    **Example 3-4.** Jennifer puts $150,000 into a bank account that pays a compound
    interest rate annually of 12%. If she gets her money from the bank after 5 years,
    how much interest does she get?


    **Solution 3-4.** The following code can be used to accomplish the given task.


    *Example3p4.m*


    ```

    %Example3p4

    %This code calculates compound interest

    format short

    P = 15e+4;

    Rprime=0.12;

    C=5;

    Balance = P*((1+Rprime)^C);

    Interest = Balance - P;

    fprintf(''Obtained interest: %.20f\n'',Interest)

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example3p4

    Obtained interest: 114351.25248000008286908269

    >

    ```'
