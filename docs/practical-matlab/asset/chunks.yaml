    ### 单一 if 结构


    在使用单个 `if` 语句时，如果 `if` 后面的比较语句为真，则执行 `if` 和 `end` 之间的命令。此处给出该结构的一个使用示例：


    ```

    if 比较条件

    语句

    end

    ```


    **示例 2-4.** 编写一个投掷一对骰子的代码。如果两个骰子顶面数字之和为 10，则计算机应打印“You are LUCKY”。计算机还应在屏幕上打印出这两个数字。


    **解法 2-4.** 为完成此任务，可使用以下保存为 `Example2p4.m` 的代码。


    *Example2p4.m*


    ```

    %Example2p4

    % 此程序投掷一对骰子

    Die=randi(6,1,2);

    if Die(1)+Die(2)==10

    fprintf(''You are LUCKY \n'')

    end

    fprintf(''第一个数字是 %d 第二个数字是 % d\n'',...

    Die(1),Die(2))

    ```


    在这段代码中，`randi(6,1,2)` 随机创建一个 1 × 2 的矩阵，其中最大数字为 6。与 `rand` 命令不同，此函数中的元素均为正整数。变量
    `Die` 有两个元素。如果这两个元素之和为 10，则屏幕上会打印出消息“You are LUCKY”。在代码的第七行，使用了三个点（`...`）来告诉 MATLAB
    代码将在下一行继续。最后，在屏幕上打印出数字。


    运行代码后，会得到以下输出。


    ```

    > Example2p4

    第一个数字是 1 第二个数字是  6

    >

    ```


    ### if-else 结构


    如果使用单个 `if-else` 结构，则可以在程序中检查多种情况。此处给出该结构的一个使用示例。


    ```

    if 比较条件

    语句

    elseif 比较条件

    语句

    else

    语句

    end

    ```


    **示例 2-5.** 编写一个询问您年龄的程序。如果输入的年龄小于 6，MATLAB 应在屏幕上打印“Maybe NO School”。如果年龄在 6 到
    12 之间，应打印“Middle School”。如果年龄在 13 到 17 之间，应打印“High School”，如果年龄在 18 到 25 之间，应打印“Maybe
    University”。否则，程序应在屏幕上显示“Professional”。


    **解法 2-5.** 可使用以下代码完成给定任务。


    *Example2p5.m*


    ```

    %Example2p5

    % 此程序询问您的年龄

    Age = input(''请输入您的年龄\n'');

    if Age < 6

    fprintf(''Maybe NO School \n'');

    elseif Age <13

    fprintf(''Middle School \n'');

    elseif Age <18

    fprintf(''High School \n'');

    elseif Age <26

    fprintf(''Maybe University \n'');

    else % 其他可能性

    fprintf(''Professional \n'')

    end

    ```


    代码执行后，将显示以下输出。


    ```

    > Example2p5

    请输入您的年龄


    Maybe University

    >

    ```


    ### 关系运算符与 if 和 if-else 结构


    关系运算符也可以与 `if` 和 `if-else` 结构一起使用。这些运算符列于表 2-3 中。


    **表 2-3** 关系运算符


    | 运算符 | 描述 | 示例 |

    | --- | --- | --- |

    | `>` | 大于 | `3 > 2` |

    | `>=` | 大于或等于 | `4 >= 3` |

    | `<` | 小于 | `2 < 3` |

    | `<=` | 小于或等于 | `2 <= 3` |

    | `==` | 等于 | `4 == 4` |

    | `~=` | 不等于 | `2 ~= 3` |


    为了说明，让我们看下面的示例。


    **示例 2-6.** 表 2-4 中给出了区分您获取驾驶执照资格的年龄段区间。


    **表 2-4** 获取驾驶执照的年龄


    | 区间 | 驾照条件 | 备注 |

    | --- | --- | --- |

    | `Age<16` | 无驾照 | 无驾照 |

    | `16<=Age<18` | 青少年驾照 | 可以获得青少年驾照 |

    | `18<=Age<70` | 标准驾照 | 可以拥有标准驾照 |

    | `70<Age` | 许可驾照 | 应获得许可驾照 |


    编写一个计算机程序，该程序要求输入您的年龄，并根据表 2-4 中给出的备注打印相应信息。


    **解法 2-6.** 可使用以下代码完成给定任务。


    *Example2p6.m*


    ```

    %Example2p6

    %此程序使用关系运算符

    Age=input(''请输入您的年龄 \n'');

    if Age=16

    fprintf(''可以获得青少年驾照  \n'');

    elseif Age=18

    fprintf(''可以拥有标准驾照 \n'');

    else % 其他可能性

    fprintf(''应获得许可驾照\n'');

    end

    ```


    如果在提示符下运行该代码，将得到如下所示的输出。


    ```

    > Example2p6

    请输入您的年龄


    可以拥有标准驾照

    >

    ```


    ### Switch-Case 命令


    `Switch-case` 命令与 `if-else` 结构非常相似。任何使用 `if-else` 命令编程的内容，也可以使用 `switch-case`
    结构来编程。`switch-case` 和 `if-else` 结构之间存在细微差别。与 `if-else` 类型相比，阅读 `switch-case` 类型中的条件可能更容易。然而，`switch-case`
    结构的灵活性低于 `if-else` 结构，这主要是由于其本身的特性。


    `switch-case` 阶梯结构的使用方法如下所示。


    ```

    switch 变量

    case 选项 1

    如果是选项 1，则执行这些操作

    case 选项 2

    如果是选项 2，则执行这些操作

    otherwise

    如果没有任何情况匹配，则执行此操作

    end

    ```


    **示例 2-7.** 编写一个程序，对于用户输入的金额，例如 20 美元、30 美元、40 美元或 50 美元，程序分别告知您可以从包含鸡肉、龙虾、牛肉和鱼的菜单中选择吃什么。


    **解法 2-7.** 可使用以下代码完成给定任务。


    *Example2p7.m*


    ```

    %Example2p7

    %此程序演示 switch-case 的用法

    Money=input(''您有多少钱？ \n'');

    switch Money

    case 20

    fprintf(''您可以吃鸡肉 \n'');

    case 30

    fprintf(''您可以吃龙虾 \n'');

    case 40

    fprintf(''您可以吃牛肉 \n'');

    case 50

    fprintf(''您可以吃鱼 \n'');

    otherwise % 其他可能性

    fprintf(''与菜单不匹配 \n'');

    end

    ```


    在这段代码中，输入的数字必须与 `case` 语句中使用的某个数字完全匹配。否则，将执行 `otherwise` 部分下的脚本并打印到屏幕上。代码运行后，会得到以下输出。


    ```

    > Example2p7

    您有多少钱？


    您可以吃牛肉

    >

    ```


    ### 菜单函数


    `menu` 函数在列出项目时非常有用。它可以与 `switch-case` 命令或 `if-else` 命令一起使用，使界面更美观。`menu` 函数的用法如下所示。


    ```

    名称 = menu(''菜单标题'',''选项 1'',''选项 2'',...,''选项 n'')

    ```


    **示例 2-8.** 使用 `menu` 编写一个程序，提供四个不同的度假地点。根据您的选择，程序应告知您度假费用。地点包括休斯顿、圣安东尼奥、达拉斯和奥斯汀，价格分别为
    450 美元、550 美元、650 美元和 750 美元。


    **解法 2-8:** 为此问题生成的代码如下所示。


    *Example2p8.m*


    ```

    %Example2p8

    %此代码使用 menu 函数

    city=menu(''从菜单中选择一个城市'',...

    ''休斯顿'',''圣安东尼奥'',''达拉斯'',''奥斯汀'');

    switch city

    case 1

    fprintf(''$450 \n'');

    case 2

    fprintf(''$550 \n'');

    case 3

    fprintf(''$650 \n'');

    case 4

    fprintf(''$750 \n'');

    end

    ```


    如第一行所示，三个连续的点（`...`）用于断开该行，并将命令延续到下一行。程序执行后，将得到图 2-3 所示的界面。


    ![../images/483991_1_En_2_Chapter/483991_1_En_2_Fig3_HTML.jpg](img/483991_1_En_2_Fig3_HTML.jpg)


    **图 2-3** 为目的地创建的菜单


    如果选择了第三个选项，即达拉斯，将得到以下输出。


    ```

    > Example2p8

    $650

    >

    ```


    ## 编程控制


    在达到给定条件之前，通常使用循环控制语句来执行代码的特定部分。这些循环有时也被称为重复结构。与大多数编程语言类似，MATLAB 具有 `for` 循环和 `while`
    循环结构。在这些循环中，可以根据情况使用 `break` 和 `continue` 语句来检查条件。另一个重要的控制机制是使用 `try-catch` 块来处理
    MATLAB 中的意外情况。

