    # 算法


    算法是一种计算过程，展示了解决问题所涉及的所有步骤。通常，它会接收一个（或一组）输入，并产生一个（或一组）输出。在解决问题时，会将问题拆分为多个部分，分别分析和解决这些组成要素。这样，就可以更详细地对问题进行分析。这种方法通常称为*自顶向下*方法。有时，将这些组成部分组合起来，可以获取整个系统的信息，从而产生更复杂的系统。通过分析和组合我们已经收集到信息的各个部分，可以构建出系统。这种方法称为*自下而上*处理。


    无论采用哪种方法，算法的目的都是以某种方式定义问题的解决方案，例如通过简单表达式编写解决方案，或使用流程图展示解决方案。


    # 流程图与伪代码


    伪代码和流程图都用于构建计算机程序的算法。伪代码通常由单词和表达式组成，而流程图则由一组简单的图形表示。


    伪代码提供了一种非正式的手段来描述待编写程序的步骤。它有助于程序员规划和开发计算机程序的最终算法。


    流程图是编写程序步骤的图形化表示。它使用简单的形状和图表（表 2-1）来描述计算机程序的算法。


    **表 2-1** 最常用的流程图符号


    | 符号 | 说明 |

    | --- | --- |

    | `[椭圆形]` | 用于程序的开始和结束 |

    | `[矩形]` | 用于表示计算或赋值 |

    | `[菱形]` | 用于表示判断过程 |

    | `[平行四边形]` | 用于表示输入或输出过程 |


    **例 2-1.** 为计算正方形面积的算法绘制伪代码和流程图。正方形的边长需要由用户从外部输入。


    **解 2-1.** 对于伪代码，算法的步骤可以编写如下：


    1. 输入正方形的边长，记为 `B`。

    2. 计算正方形的面积，`Area = B²`。

    3. 输出结果 `Area`。


    # 脚本与 M 文件


    在决定好求解问题的算法后，将生成代码来完成给定的任务。代码可以在 MATLAB 编辑器中编写，并保存为名为 `*.m` 的文件，其中 `*` 是你为程序指定的名称。因此，在
    MATLAB 中编写的代码称为 m 文件，而这些代码也被称为脚本或程序。


    **例 2-2.** 构建一个算法的流程图并生成计算圆的面积和周长的代码，其中半径由用户输入。


    **解 2-2.** 该算法的流程图可以绘制如图 2-2 所示。


    ![例 2-2 的流程图](img/483991_1_En_2_Fig2_HTML.jpg)


    **图 2-2** 例 2-2 的流程图


    `Example2p2.m`


    ```

    %Example2p2

    %此代码计算圆的面积和周长

    Radius = input(''请输入半径\n'');

    AreA = pi*(Radius²);

    Per= 2*pi*Radius;

    disp([''圆的面积是= '',num2str(AreA)]);

    fprintf(''圆的周长是 = % d\n'',Per);

    ```


    运行代码后，得到以下输出结果。


    ```

    >  Example2p2

    请输入半径


    圆的面积是= 314.1593

    圆的周长是 =  6.283185e+01

    >

    ```


    在此解决方案中，使用了四个重要的函数。`input` 命令用于从外部输入数据。在上述代码中，期望输入一个数值。该代码被赋给名为 `Radius` 的变量。`disp`
    和 `fprintf` 函数都用于显示数据。不过，从代码中可以看出，它们的用法不同。`disp` 函数显示括号内的数据。在显示单引号之间的字符串后，通过 `num2str`
    命令将变量 `AreA` 的数值转换为字符串，然后使用 `disp` 函数进行显示。使用 `fprintf` 函数时，同样会显示引号内的数据。但在这里，`%`
    符号告诉 MATLAB 将要打印数据。`%` 符号后面的字母是数据的说明符，它告诉 MATLAB 将要打印哪种数据类型。在本例中，`d` 用于显示十进制数（表
    2-2）。一旦使用了 `''\n''`，光标将移至下一行。因此，变量 `Per` 的值将在文本 `圆的周长是 =` 之后以十进制数的形式打印出来。


    **表 2-2** 使用转换函数格式化文本


    | 说明符 | 说明 |

    | --- | --- |

    | `c` | 显示单个字符 |

    | `d` | 以有符号十进制记数法格式显示 |

    | `e` | 以指数记数法格式显示 |

    | `f` | 以定点记数法格式显示 |

    | `s` | 显示字符向量或字符串数组 |


    当使用诸如 `num2str`、`sprint` 或 `fprintf` 等转换函数时，用户可以自定义对齐方式或精确到指定位数。为了说明，请查看以下示例。


    **例 2-3.** 编写一个程序，以三种不同方式显示 π。第一种方式，代码应显示 π 的值。第二种方式，代码应显示小数点后三位数字。第三种方式，代码应将
    π 的值打印为 15 位数字，并向右侧对齐。


    **解 2-3.** 可以使用以下代码完成给定任务。


    `Example2p3.m`


    ```

    %Example2p3

    %此代码以三种方式显示 pi

    fprintf(''pi :\n %f\n %.3f\n %15f\n'',pi,pi,pi)

    ```


    运行代码后，得到以下输出结果。


    ```

    > Example2p3

    pi :

    3.141593

    3.142

    3.141593

    >

    ```


    在上述代码中，当光标执行到 `%f\n` 时，代码打印 π 的值并换行。执行到 `%.3f\n` 时，打印小数点后三位数字并换行。最后，执行到 `%15f\n`
    时，π 以 15 位数字显示，并向右侧对齐，必要时用空格填充。之后光标会移至下一行。


    # 逻辑函数与选择结构


    在某些情况下，我们可能需要从一组可能的候选项中选出一个选项。这种选择可以通过在 MATLAB 中使用 `if`、`switch` 或 `menu` 命令来实现。在本节中，我们将分别讨论每种情况。


    ## `if` 与 `if-else` 命令


    有些情况下，单独使用一个 `if` 语句就足够了，而 `if-else` 结构则主要用于更复杂的情况。

    '
- fmt: '### Single if Structure


    In the case of using a single `if` statement, if the comparison statement after
    `if` is true, then the commands between `if` and `end` are executed. An example
    usage of the structure is given here:


    ```

    if comparison

    statement

    end

    ```


    **Example 2-4.** Write code that rolls a pair of dice. If the sum of the two numbers
    on the top faces is 10, then the computer should print "You are LUCKY." The computer
    also should print the numbers on the screen.


    **Solution 2-4.** To accomplish this task, the following code, which is saved
    as `Example2p4.m`, can be used.


    *Example2p4.m*


    ```

    %Example2p4

    % This program rolls a pair of dice

    Die=randi(6,1,2);

    if Die(1)+Die(2)==10

    fprintf(''You are LUCKY \n'')

    end

    fprintf(''First # is %d Second # is % d\n'',...

    Die(1),Die(2))

    ```


    In this code, `randi(6,1,2)` creates a 1 × 2 matrix randomly where the highest
    number is 6. The elements are all positive integers in this function, unlike the
    `rand` command. The variable `Die` has two elements. If the sum of these elements
    is 10, then the message "You are LUCKY" is printed on the screen. In the seventh
    row of the code, three dots (`...`) are used to tell MATLAB that the coding will
    continue. Finally, the numbers are printed on the screen.


    After running the code, the following output will be obtained.


    ```

    > Example2p4

    First # is 1 Second # is  6

    >

    ```


    ### if-else Structure


    If using a single `if-else` structure, it is possible to check more than one case
    in the program. An example usage of this structure is shown here.


    ```

    if comparison

    statement

    elseif comparison

    statement

    else

    statement

    end

    ```


    **Example 2-5.** Write a program that asks your age. If the entered age is less
    than 6, MATLAB should print "Maybe NO School" on the screen. If the age is between
    6 and 12, it should print "Middle School." If the age is between 13 and 17, it
    should print "High School," and if the age is between 18 and 25, it should print
    "Maybe University." Otherwise, the program should display "Professional" on the
    screen.


    **Solution 2-5.** The following code can be used to accomplish the given task.


    *Example2p5.m*


    ```

    %Example2p5

    % This program asks your age

    Age = input(''Please enter your age\n'');

    if Age < 6

    fprintf(''Maybe NO School \n'');

    elseif Age <13

    fprintf(''Middle School \n'');

    elseif Age <18

    fprintf(''High School \n'');

    elseif Age <26

    fprintf(''Maybe University \n'');

    else % for other possibilities

    fprintf(''Professional \n'')

    end

    ```


    Once the code is executed, the following output will be shown.


    ```

    > Example2p5

    Please enter your age


    Maybe University

    >

    ```


    ### Relational Operators with if and if-else


    Relational operators can be used with `if` and `if-else` structures as well. These
    operators are listed in Table [2-3](#483991_1_En_2_Chapter.xhtml#Tab3).


    **Table 2-3** Relational Operators


    | Operator | Description | Example |

    | --- | --- | --- |

    | `>` | Greater than | `3 > 2` |

    | `>=` | Greater than or equal to | `4 >= 3` |

    | `<` | Less than | `2 < 3` |

    | `<=` | Less than or equal to | `2 <= 3` |

    | `==` | Equal to | `4 == 4` |

    | `~=` | Not equal to | `2 ~= 3` |


    For an illustration, let us look at the following example.


    **Example 2-6.** The age intervals that identify your status for getting a driver''s
    license are given in Table [2-4](#483991_1_En_2_Chapter.xhtml#Tab4).


    **Table 2-4** Ages for Getting a Driver''s License


    | Interval | License Condition | Comment |

    | --- | --- | --- |

    | `Age<16` | No license | No license |

    | `16<=Age<18` | Youth license | Can get a youth license |

    | `18<=Age<70` | Standard license | Can have a standard license |

    | `70<Age` | Permitted License | Should get a permitted license |


    Write a computer program that requests your age and prints one of the comments
    given in Table [2-4](#483991_1_En_2_Chapter.xhtml#Tab4) accordingly.


    **Solution 2-6.** The following code can be used to accomplish the given task.


    *Example2p6.m*


    ```

    %Example2p6

    %This program uses relational operators

    Age=input(''Please Enter Your Age \n'');

    if Age=16

    fprintf(''Can get a youth license  \n'');

    elseif Age=18

    fprintf(''Can have a standard license \n'');

    else % for the other possibilities

    fprintf(''Should get a permitted license\n'');

    end

    ```


    If we run the code at the prompt, the output shown here results.


    ```

    > Example2p6

    Please Enter Your Age


    Can have a standard license

    >

    ```


    ### Switch-Case Commands


    `Switch-case` commands are very similar to the `if-else` structure. Whatever is
    programmed using the `if-else` commands can be programmed using the `switch-case`
    structure as well. There are minor differences between `switch-case` and `if-else`
    structures. Reading the conditions in a `switch-case` type might be easier compared
    to the `if-else` type. However, the `switch-case` structure is less flexible than
    the `if-else` structure due mainly to its nature.


    The usage of the `switch-case` ladder is shown here.


    ```

    switch variable

    case option1

    In case of option1 do these

    case option2

    In case of option2 do these

    otherwise

    If none of the cases is applied, do this

    end

    ```


    **Example 2-7.** Write a program that, for an amount of money such as $20, $30,
    $40, or $50 entered by the user, tells you what you can eat from a list including
    chicken, lobster, beef, and fish, respectively.


    **Solution 2-7.** The following code can be used for the given task.


    *Example2p7.m*


    ```

    %Example2p7

    %This program has a switch-case illustration

    Money=input(''How much money you have? \n'');

    switch Money

    case 20

    fprintf(''You can eat Chicken \n'');

    case 30

    fprintf(''You can eat Lobster \n'');

    case 40

    fprintf(''You can eat Beef \n'');

    case 50

    fprintf(''You can eat Fish \n'');

    otherwise % for other possibilities

    fprintf(''No match with the menu \n'');

    end

    ```


    In this code, the number entered should match exactly with one of the numbers
    used with the `case` statement. Otherwise, the script written under the `otherwise`
    part is printed on the screen. Once the code is run, the following output is obtained.


    ```

    > Example2p7

    How much money you have?


    You can eat Beef

    >

    ```


    ### Menu


    The `menu` function is very useful in listing items. It can either be used with
    `switch-case` commands or with `if-else` commands, which make the appearance nicer.
    The usage of the `menu` function is represented as shown here.


    ```

    Name   = menu(''memutitle'',''option1'',''option2'',...,''option'')

    ```


    **Example 2-8.** Write a program that offers four different places to go for vacation
    using `menu`. Depending on your choice, the program should tell you how much the
    vacation costs. The venues include Houston, San Antonio, Dallas, and Austin, and
    the prices are $450, $550, $650, and $750, respectively.


    **Solution 2-8:** The code generated for this problem is given here.


    *Example2p8.m*


    ```

    %Example2p8

    %This code uses menu function

    city=menu(''Select a city from the menu'',...

    ''Houston'',''San Antonio'',''Dallas'',''Austin'');

    switch city

    case 1

    fprintf(''$450 \n'');

    case 2

    fprintf(''$550 \n'');

    case 3

    fprintf(''$650 \n'');

    case 4

    fprintf(''$750 \n'');

    end

    ```


    As shown in the first row, three consecutive periods (`...`) cut the line and
    extend the command to the next line. Once the program is executed, the interface
    shown in Figure [2-3](#483991_1_En_2_Chapter.xhtml#Fig3) is obtained.


    ![../images/483991_1_En_2_Chapter/483991_1_En_2_Fig3_HTML.jpg](images/483991_1_En_2_Chapter/483991_1_En_2_Fig3_HTML.jpg)


    **Figure 2-3** Menu created for the venues


    If the third option, Dallas, is selected, the following output will be obtained.


    ```

    > Example2p8

    $650

    >

    ```


    ## Programming Controls


    Until a given condition is reached, loop control statements are used to execute
    a certain part of the code. These loops are sometimes called repetition structures,
    as well. Similar to most programming languages, MATLAB has `for` loop and `while`
    loop structures. Within these loops, `break` and `continue` statements can be
    used to check conditions depending on the cases. Another important control mechanism
    is to use a `try-catch` block to overcome unexpected situations in MATLAB.'
