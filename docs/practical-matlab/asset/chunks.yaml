    # Characters and Strings


    Characters are composed of strings. Letters, numbers, or symbols can be defined
    as characters in MATLAB. Characters can be defined by entering them between single
    quotation marks.


    ```

    > Let="34"

    Let =


    > class(Let)

    ans =

    char

    >

    ```


    In this example, even though we define the variable `Let` as 34 having all numbers,
    due to the fact that these numbers are entered between the single quotation marks,
    MATLAB recognizes `Let` as a character. If the `class` command is used to display
    its class, we will see that it is of type character.


    ```

    > H=''How are you?''

    H =

    How are you?

    > length(H)

    ans =


    > class(H)

    ans =

    char

    >

    ```


    In the preceding example, the variable `H` is defined as a character of length
    12. The variable is defined as a character by putting its name between the single
    quotation marks.


    **Example 1-11.** Three variables are defined as ‘How are you?’, ‘the weather’,
    and ‘is it correct?’ for A, B, and C, respectively. We want to create a new character
    ‘How is the weather’ by using the given three variables alone. Write the code
    to achieve this task.


    **Solution 1-11.** To this point, we have typed the commands in the command window.
    We can write the code in the editor and save it in the working directory of MATLAB.
    Then by just typing the name of the saved file, we can run the code. This code
    is written in editor and saved as `CharEx.m`. The following program can be used
    for this task.


    `*CharEx.m*`


    ```

    % Name of this file is CharEx.m

    % This is Example 1-11

    % This code gets some strings and puts them

    % together for another string

    A = ''How are you?'';

    B = ''the weather'';

    C = ''is it correct?'';

    NewOne = [A(1:4) C(1:3) B]

    ```


    As shown, we extract the first four characters of A, the first three characters
    of C, and all of the B strings, and assign them into a new variable `NewOne`.
    If the percentage (`%`) symbol is put on a line, MATLAB ignores everything that
    comes after that `%` symbol, so this is used for commenting.


    Once we run the code at the prompt, the following output will be obtained.


    ```

    > CharEx

    NewOne =

    How is the weather

    >

    ```


    In MATLAB, there is a very useful command called `char`. Using this command, we
    can print all the characters defined by the American Standard Code for Information
    Interchange (ASCII) as shown in Figure 1-5.


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig5_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig5_HTML.jpg)


    **Figure 1-5** ASCII table


    From 32 to 127, these characters can be viewed as it is shown in the solution
    to Example 1-12.


    **Example 1-12.** Write a program that prints out the lowercase and uppercase
    letters from the ASCII table.


    **Solution 1-12.** The following code can be used to accomplish the given task.


    `*Letters.m*`


    ```

    % Name of this file is Letters.m

    % This is Example 1-12

    % This code prints alphabet letters

    Small   = char(97:122);

    Capital = char(65:90);

    fprintf(''Small letters are : %s\n'',Small);

    fprintf(''Big letters are : %s\n'',Capital);

    ```


    Then in the command window, once we run the code at the prompt, we obtain the
    following output:


    ```

    > Letters

    Small letters are : abcdefghijklmnopqrstuvwxyz

    Big letters are : ABCDEFGHIJKLMNOPQRSTUVWXYZ

    >

    ```


    In the code for `Letters.m`, the `fprintf` function prints purple characters up
    to the `%` symbol. After that, the letter `s` tells MATLAB that after that time,
    strings will be printed that are called `Small` and `Capital`. The `\n` part cuts
    the line and goes to the next line during printing.


    **Example 1-13.** Bob wants to send the message “Start sending messages at 8:30”
    to Alice in a secret way as an encrypted message. Write a program that encrypts
    and decrypts Bob’s message. (Hint: Use the ASCII table)


    **Solution 1-13.** The encryption and decryption parts can be given as follows.


    `*HidingMessage.m*`


    ```

    % Name of this file is HidingMessage.m

    % This is Example 1-13

    % This code encrypts and decrypts a message

    %Encryption starts here

    Message = ''Start sending message at 8:30'';

    Encryp = double(Message)+3;

    fprintf(''Encrypted Message : %s\n'',char(Encryp))

    %Decryption starts here

    Decryp = Encryp-3;

    fprintf(''Decrypted Message : %s\n'',char(Decryp))

    ```


    In this solution, the message is converted to the corresponding numbers in the
    ASCII table using the command `double`. We then add 3 to the corresponding numbers
    of each letter for encryption. This shifts each letter by 3 to the right in the
    ASCII table. After the message is encrypted, it is decrypted back to its original
    version by subtracting 3 from the encrypted values. Once we run the code at the
    prompt, we obtain the following output:


    ```

    > HidingMessage

    Encrypted Message : Vwduw#vhqglqj#phvvdjh#dw#;=63

    Decrypted Message : Start sending message at 8:30

    >

    ```


    MATLAB provides very useful functions for manipulating strings or characters.
    Some of the most commonly used functions are listed in Table 1-10.


    # Numerical Data


    There exist two different kinds of numerical data types in MATLAB: integers and
    floating-point numbers. Integers are comprised of signed and unsigned types. There
    are eight types of integers in total, as shown in Table 1-11. The difference between
    these types is the storage space that they occupy in memory. If it is possible
    to do your calculations with low bit integers, you could save space in memory.
    When higher bit integers are preferred, more memory will be needed.


    To find the maximum or minimum values of integers within the computer, you just
    need to type `intmax(''classname'')`. For example, if we type the following


    ```

    > intmax(''int8'')

    ans =


    > intmin(''int64'')

    ans =


    >

    ```


    we see the values of the highest 8-bit integer and the lowest 64-bit integer.
    Also,


    ```

    > intmin(''uint64'')

    ans =


    > intmax(''uint64'')

    ans =


    >

    ```


    shows the lowest and highest unsigned 64-bit integers in the preceding code, using
    the `intmin` and `intmax` commands.


    There are two types of floating-point numbers; namely, double-precision and single-precision
    numbers. Double-precision floating-point numbers are the default type for all
    entered variables. Single-precision floating-point numbers occupy 32 bits in memory,
    whereas double-precision floating-point numbers occupy 64 bits. We can check the
    highest and lowest values using the same commands we used for integers earlier.


    ```

    > realmax(''double'')

    ans =

    1.7977e+308

    > realmin(''single'')

    ans =

    1.1755e-38

    >

    ```


    # Logical Data


    In MATLAB, along with many other programming languages, 1 represents the logical
    true and 0 represents the logical false.


    **Example 1-14.** Write a program that includes two variables as logical values.
    One should be true, and the other should be false. Compare these values using
    the `logical and` and `logical or` operators.


    **Solution 1-14.** The following code can be used to accomplish the given task.


    `*LogicalEx.m*`


    ```

    % Name of this file is LogicalEx.m

    % This is Example 1-14

    % This code works with logical values

    Logical1 = 3>2 % if it is true, it is 1

    Logical2 = 5<4 % if it is false, it is 0

    CombineWithAnd = Logical1 && Logical2 % and

    CombineWithOr = Logical1 || Logical2  % or

    ```


    If we run the code, we obtain the following result.


    ```

    > LogicalEx

    Logical1 =


    Logical2 =


    CombineWithAnd =


    CombineWithOr =


    > class(CombineWithOr)

    ans =

    logical

    >

    ```


    Once we check the class of the variable `CombineWithOr` after running the code,
    as just shown, it is logical data. Hence, the logical data values can be either
    0 or 1.


    # Symbolic Data


    Symbolic data are used to perform algebraic calculations using MATLAB’s symbolic
    toolbox. There are two ways of defining a symbolic variable. One is to type `syms`
    and the other way is to type `sym` as shown here.


    ```

    > syms x

    > class(x)

    ans =

    ''sym''

    > y=sym(''y'')

    y =

    y

    > class(y)

    ans =

    ''sym''

    >

    ```


    In either method, we can create symbolic data types, and then apply some algebraic
    operations such as taking the integral or derivative of them.

