    \ 语言的控制机制以及用户自定义函数的基本概念。\n\n计算机程序本质上是一组告诉计算机做什么的指令。在 MATLAB 中，对于较大的程序（有时称为*脚本*），更倾向于使用编辑器，而不是在提示符下键入整个代码序列。到目前为止，我们处理的问题都易于执行和完成。仅使用提示符来解决至此遇到的问题就足够了。不过，我们也可以使用\
    \ MATLAB 编辑器来解决这些问题。然而，对于更大、更复杂的问题，建议你将代码在编辑器中整合并组织好。因此，在本书的其余部分，我们会尽可能多地使用编辑器来编写代码解决问题。\n\
    \n编写复杂、不清晰的代码并不难。但是，过一段时间后，如果你出于某些原因（例如升级或编辑）回顾代码，可能很难理解你当时的意思。因此，编写代码时的首要关注点之一就是编写清晰易懂的代码。为此，我们可以在代码中\
    \ `%` 符号后加入注释作为提醒。MATLAB 会忽略 `%` 符号后的所有内容。这些注释可以放在一行代码之后，也可以作为注释块，即 `%{` 和 `%}`\
    \ 之间的较长信息性表达式。\n\n要生成较长的注释，`%{` 符号应单独占一行。同样，用于关闭注释块的 `%}` 符号也应在最后一行单独占一行，如图 2-1\
    \ 所示。\n\n![../images/483991_1_En_2_Chapter/483991_1_En_2_Fig1_HTML.jpg](img/483991_1_En_2_Fig1_HTML.jpg)\n\
    \n图 2-1  \n注释块的示例\n\n获得更有组织代码的另一个重要规则是为变量和结构使用有意义的名称。这有助于用户日后更容易地回忆起脚本。其他一些与编写更好代码相关的小技巧超出了本书的范围。不过，为了对主题有基本的理解，我们在此简单介绍。\n"
- fmt: '# Algorithms


    An algorithm is a computational procedure that shows all the steps involved in
    solving a problem. In general, an input (or a set of inputs) is (are) taken and
    an output (or some outputs) is (are) produced. When solving a problem, the problem
    is separated into parts to analyze and solve the constituent pieces separately.
    In this way, the problem can be analyzed in a more detailed manner. This method
    is often called a *top-down* approach. Sometimes, the pieces are combined to get
    information about the entire system, yielding more complex systems. The system
    can be constructed by analyzing and combining the pieces about which we have already
    gathered information. This method is called *bottom-up* processing.


    In either method, the purpose of an algorithm is to define a solution to a problem
    in some way, such as writing the solution via simple expressions, or showing the
    solution using flowcharts.


    # Flowcharts and Pseudocode


    Both pseudocode and flowcharts are used to construct an algorithm of a computer
    program. Pseudocode is generally composed of words and expressions, whereas flowcharts
    are represented by a set of simple shapes.


    Pseudocode provides an informal means for describing the steps of the program
    to be written. It helps the programmer plan and develop the ultimate algorithm
    for the computer program.


    A flowchart is a graphical representation of the steps in writing the program.
    Simple shapes and diagrams (Table 2-1) are used to describe the algorithm of a
    computer program.


    **Table 2-1** Most Frequently Used Flowchart Symbols


    | Symbol | Explanation |

    | --- | --- |

    | `[Oval]` | Used for initiating and finishing the program |

    | `[Rectangle]` | Used to indicate calculations, or assigning |

    | `[Diamond]` | Used to indicate decision processes |

    | `[Parallelogram]` | Used to indicate input or output processes |


    **Example 2-1.** Construct pseudocode and a flowchart for an algorithm that calculates
    the area of a square. The edge length of the square is to be externally entered
    by the user.


    **Solution 2-1.** For the pseudocode, the steps of the algorithm can be written
    as follows.


    1. Enter the length of the square, called `B`.

    2. Calculate the area of the square, `Area = B^2`.

    3. Display the result, `Area`.


    # Scripts and M-Files


    After an algorithm is decided on for solving the problem, the code will be generated
    to accomplish the given task. Code can be written in the MATLAB editor and saved
    as a file called `*.m`, where `*` is the name you assign to your program. Thus,
    the codes written in MATLAB are called m-files and these codes are called scripts
    or programs.


    **Example 2-2.** Construct the flowchart of an algorithm and generate the code
    that calculates the area and perimeter of a circle, where the radius is entered
    by the user.


    **Solution 2-2.** The flowchart of the algorithm can be drawn as shown in Figure
    2-2.


    ![Flowchart of Example 2-2](images/483991_1_En_2_Chapter/483991_1_En_2_Fig2_HTML.jpg)


    **Figure 2-2** Flowchart of Example 2-2


    `Example2p2.m`


    ```

    %Example2p2

    %this calculates the area and perimeter of a circle

    Radius = input(''Please enter the radius\n'');

    AreA = pi*(Radius^2);

    Per= 2*pi*Radius;

    disp([''Area of the circle is= '',num2str(AreA)]);

    fprintf(''Perimeter of the circle is = % d\n'',Per);

    ```


    Once the code is run, the following output is obtained.


    ```

    >  Example2p2

    Please enter the radius


    Area of the circle is= 314.1593

    Perimeter of the circle is =  6.283185e+01

    >

    ```


    In this solution, four important functions are used. The `input` command is used
    to externally enter the data. A numerical value is expected to be entered in the
    preceding code. The code is assigned to the variable named `Radius`. Both the
    `disp` and `fprintf` functions are used to display data. As seen from the code,
    though, their usages are different. The `disp` function displays the data between
    parentheses. After showing the string between single quotation marks, the numerical
    value of the variable `AreA` is converted to a string by using the `num2str` command,
    and then it is displayed with the `disp` function. When the `fprintf` function
    is used, again the data between quotation marks are shown. Here, though, the `%`
    symbol tells MATLAB that data will be printed. The letter coming after the `%`
    symbol is the specifier of the data. It tells MATLAB what kind of data will be
    printed. In this example, `d` is used to show a decimal number (Table 2-2). The
    cursor goes to the next line once `''\n''` is used. As a result, the value of
    the `Per` variable is printed as a decimal number after the script `Perimeter
    of the circle is =`.


    **Table 2-2** Formatting Text with Conversion Functions


    | Specifier | Explanation |

    | --- | --- |

    | `c` | Displays a single character |

    | `d` | Displays in signed decimal notation format |

    | `e` | Displays in exponential notation format |

    | `f` | Displays in fixed-point notation format |

    | `s` | Displays character vector or string array |


    When a conversion function, such as `num2str`, `sprint`, or `fprintf` is used,
    the user can shape the alignment or precision up to a certain digit. For an illustration,
    look at the following example.


    **Example 2-3.** Write a program that shows π three different ways. In the first
    way, the code should display the value of π. In the second case, the code should
    show three numbers after the decimal. In the third case, the code should print
    the value of π in 15 digits by aligning π toward the right side.


    **Solution 2-3.** The following code can be used to accomplish the given task.


    `Example2p3.m`


    ```

    %Example2p3

    %This code shows three different pi

    fprintf(''pi :\n %f\n %.3f\n %15f\n'',pi,pi,pi)

    ```


    Once the code is run, the following output is obtained.


    ```

    > Example2p3

    pi :

    3.141593

    3.142

    3.141593

    >

    ```


    In the preceding code, when the cursor comes to `%f\n`, the code prints the value
    of π and goes to the next line. When it comes to `%.3f\n` for execution, it prints
    the three numbers after the decimal point and then goes to the next line. Finally,
    when it comes to execute `%15f\n`, π is shown in 15 digits with the alignment
    toward the right side padded with spaces as needed. The cursor then goes to the
    next line.


    # Logical Functions and Selection Structures


    In some situations, we might need to pick an option from among a set of possible
    candidates. This selection can be achieved by using `if`, `switch`, or `menu`
    commands in MATLAB. In this section, we discuss each case separately.


    ## `if` and `if-else` Commands


    There are some cases where it is sufficient to use a single `if` statement alone,
    whereas the `if-else` structure is used primarily in more complex cases.'
