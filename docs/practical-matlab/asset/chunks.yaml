    # 百分比变化


    在现实生活中，我们经常遇到百分比变化的问题。要解决这类问题，需要理解三个重要概念。


    - 比 *A* 多 x% = ![$$ A+A\ast \frac{x}{100}=A\ast \frac{\left(100+x\right)}{100}
    $$](img/483991_1_En_3_Chapter_TeX_IEq3.png)

    - 比 *A* 少 x% = ![$$ A-A\ast \frac{x}{100}=A\ast \frac{\left(100-x\right)}{100}
    $$](img/483991_1_En_3_Chapter_TeX_IEq4.png)

    - 百分比变化 = ![$$ \frac{新值-旧值}{旧值}\ast 100 $$](img/483991_1_En_3_Chapter_TeX_IEq5.png)%


    **例 3-5.** 马丁今年的年薪是 5 万美元。明年他将获得 20%的加薪。马丁明年的年薪是多少？


    **解 3-5.** 以下代码可用于计算薪资。


    *Example3p5.m*


    ```

    %Example3p5

    %此代码计算百分比增量

    Salary = 5e+4; %5e+4 = 50000

    NextY = Salary*(120/100);

    fprintf(''马丁明年薪资是: %.2f\n'',NextY)

    ```


    运行代码后，输出如下。


    ```

    > Example3p5

    马丁明年薪资是: 60000.00

