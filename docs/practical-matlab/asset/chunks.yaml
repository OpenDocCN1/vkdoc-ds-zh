- fmt: '# Sine Wave as Sound


    One can get a sound by using a sine wave defined as


    ![$$ y=A\ast \sin \left(2\ast \pi \ast n\ast {F}_w/{F}_s\right) $$](images/483991_1_En_11_Chapter/483991_1_En_11_Chapter_TeX_Equ1.png)


    (1)


    where `A` is the amplitude of the wave, `Fw` is the frequency of the wave, `Fs`
    is the sample frequency, and `n` is the index of the sample. In some resources,
    the same equation is presented as


    ![$$ y=A\ast \sin \left(2\ast \pi \ast frequency\ast TimeVector\right) $$](images/483991_1_En_11_Chapter/483991_1_En_11_Chapter_TeX_Equ2.png)


    (2)


    where `frequency` = sine frequency, and ![$$ \mathrm{TimeVector}=\frac{\mathrm{Total}\
    \mathrm{Number}\ \mathrm{of}\ \mathrm{Points}}{\mathrm{Sample}\ \mathrm{Frequency}}
    $$](images/483991_1_En_11_Chapter/483991_1_En_11_Chapter_TeX_IEq1.png).


    **Example 11-6.** Write a program that plots the sine wave signal. The variables
    are `amplitude = 32`, `total number of points = 1,000`, `sampling frequency =
    1,000`, and `frequency of sine wave = 20`. The code should play the sound of `y`
    according to Equation [1](#483991_1_En_11_Chapter.xhtml#Equ1) or [2](#483991_1_En_11_Chapter.xhtml#Equ2)
    and plot the signal.


    **Solution 11-6.** The following code can be written to accomplish these tasks.


    `Example11p6.m`


    ```

    %Example11p6

    % This code plays sine wave

    A=32;N=1000;%Total number of points

    Fs=1000;% Sampling frequency

    frequency=20;%Frequency of sine wave

    TimeVector=(0:N-1)/Fs;

    y=A*sin(2*pi* frequency.*TimeVector);

    sound(y);plot(TimeVector,y);

    title(''Sine Wave'');ylabel(''Amplitude'');

    xlabel(''Time'');

    ```


    Once that code is run, a sound of the signal `y` is heard and the plot of the
    signal shown in Figure [11-3](#483991_1_En_11_Chapter.xhtml#Fig3) is obtained.


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig3_HTML.jpg](images/483991_1_En_11_Chapter/483991_1_En_11_Fig3_HTML.jpg)


    Figure 11-3


    Sine wave plot


    **Example 11-7.** Write a program that plots the signal given by `ysin = A * (sin(2
    * π * freq * TimeVector)) + A * (sin(4 * π * freq * TimeVector))`. The variables
    are `amplitude = 1.5`, `total number of points = 1,500`, `sampling frequency =
    1,000`, and `frequency of sine wave = 50`. The code should take the `fft` of signal
    `ysin`, and should play and plot the signal.


    **Solution 11-7.** The following code can be written to accomplish these tasks.


    `Example11p7.m`


    ```

    %Example11p7

    % This plays sound

    A=1.5;% Amplitude

    N=1500;%Total number of points

    Fs=1000;% Sampling frequency

    freq=50;%Frequency of sine wave

    TV=(0:N-1)/Fs;%time vector

    ysin=A*sin(2*pi* freq.*TV)+...

    A*sin(4*pi* freq.*TV);

    Y = fft(ysin);y = abs(Y/N);

    P1=y(1:N/2+1);P1(2:end-1)=2*P1(2:end-1);

    t=Fs*(0:(N/2))/N;sound(ysin);plot(t,P1,''r'');

    ```


    Once that code is run, a sound for the signal `y` is heard and output plot shown
    in Figure [11-4](#483991_1_En_11_Chapter.xhtml#Fig4) is obtained.


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig4_HTML.jpg](images/483991_1_En_11_Chapter/483991_1_En_11_Fig4_HTML.jpg)


    Figure 11-4


    Output of Example 11-7


    Two bars are shown in Figure [11-4](#483991_1_En_11_Chapter.xhtml#Fig4). If we
    play with the coefficients of the sine function or amplitudes in the signal and
    change one of them, say that the amplitude of the first term is twice the amplitude
    of the second term in the signal, then we would get different values for the bars
    in the graphic.


    ## Problems


    * **11.1.** Write a program that loads the audio files `chirp` and `handel` to
    the workspace. Then, the program should play both of the sounds.


    * **11.2.** Write a program that records your voice for 5 seconds with a sampling
    rate of 30,000 Hz, 16 bits with 2 channels. Then, the program should play the
    recorded sound back and plot a graph of the recorded file.


    * **11.3.** Write a program that loads the `chirp` audio file into the workspace.
    Then the program should save the file as `chirp.flac` in the directory. The code
    should add some information to the file. In the comment field, the sound file
    should have the value `Nice Voice`, and in the title field `Bird`. The code should
    play the sound and display the information for the saved file.


    * **11.4.** Write code that loads the audio file `chirp` to the workspace. The
    code should then separate the sound into two equal parts. The code also should
    play the second half first, and then the first half.


    * **11.5.** Write a program that plots the sine wave signal. The variables are
    `amplitude = 10`, `total number of points = 5,000`, `sampling frequency = 8,000`,
    and `frequency of sine wave = 20`. The code should play the sound and plot the
    signal.


    # 12. Applications with Graphical User Interfaces


    A graphical user interface (GUI) can be created in three different ways. The first
    method is to create a GUI programmatically. In this instance, commands are usually
    written directly in the editor. The second way is to use the graphical user interface
    development environment (GUIDE). The third way is to create the GUI via the App
    Designer. In this chapter, we cover how to create GUIs in all of these cases,
    and illustrate how to program applications with them.


    ## GUI Elements


    Although in App Designer, there are more options available, the elements shown
    in Figure [12-1](#483991_1_En_12_Chapter.xhtml#Fig1) can be used with GUIDE and
    programmatically.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig1_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig1_HTML.jpg)


    Figure 12-1


    GUI elements for GUIDE


    The buttons available for use are as follows:


    * Push button

    * Slider

    * Radio button

    * Check box

    * Edit text

    * Static text

    * Pop-up menu

    * List box

    * Toggle button

    * Table

    * Axes

    * Panel

    * Button group

    * ActiveX control


    Using these buttons, it is possible to create neat and useful GUIs in MATLAB.'
