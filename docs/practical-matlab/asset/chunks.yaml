    ## Built-in Functions


    MATLAB has numerous built-in, ready-to-use functions that make the programmer’s
    job much easier. Although it is hard to categorize these functions precisely,
    we can group the most frequently used ones into categories such as elementary
    math functions, trigonometric functions, complex numbers, random numbers, and
    basic plotting functions, although there are more than we can list here. Using
    the `help` command, you can easily review the descriptions of the functions and
    their example uses. For a list of all elementary math functions, simply type `help
    elfun` at the prompt in MATLAB. Most of the other built-in MATLAB functions are
    introduced and explained in subsequent chapters.


