    ## Color Processing


    Color is a physical feature created by combined different frequencies of light
    when they are seen by the eyes. There are different definitions proposed by different
    scientists, but to keep things simple, I leave the definition short here.


    In MATLAB, there are HSV, RGB, YIQ (defined by the National Television Systems
    Committee, or NTSC), YCbCr, and L∗a∗b color spaces. Primarily, though, operations
    are done in RGB space. For other spaces, there are conversion functions between
    RGB and other spaces such as `rgb2hsv`, `rgb2ntsc`, `rgb2ycbcr`, and `lab2rgb`.
    You can type `help` and one of these functions to get more information about that
    function in the command window of MATLAB.


    In this section, we work with RGB colors.


    **Example 10-16.** Write code that reads the `peppers.png` image and splits the
    RGB image into its red, green, and blue channels. The code should show the size
    of the image and the first five elements from each channel on the screen.


    **Solution 10-16.** Using the `imsplit` function, the image can be separated into
    its red, green, and blue channels. The following code can be used to accomplish
    the given task.


    *Example10p16.m*


    ```

    %Example10p16

    %This code separates RGB colors

    RGB = imread(''peppers.png'');

    [R,G,B]=imsplit(RGB);

    disp(size(RGB));

    disp(RGB(1:5,1:5,:));

    subplot(221),imshow(RGB)

    title(''Original Image'');

    subplot(222),imshow(R),title(''R Channel'');

    subplot(223),imshow(G),title(''G Channel'');

    subplot(224),imshow(B),title(''B Channel'');

    ```


