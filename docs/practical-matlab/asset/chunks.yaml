    **示例 8-12.** 使用示例 8-11 中相同的人口规模和时间跨度来模拟 SIS 动态。此示例的系数给定为 *γ* = 0.1 和 *β* = 0.9，以使
    *R*[0] > 1。


    **解决方案 8-12.** 以下代码可用于完成给定任务。


