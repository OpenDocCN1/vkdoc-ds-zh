    ![$$ f\left(x+h\right)-f(x) $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ10.png)


    (10)


    when *h* = 1\. Actually, the smallest value of *h* is 1 if we consider the difference
    between consecutive pixel values horizontally.


    Based on the expression *f* (*x* + 1) − *f* (*x* − 1), horizontal and a vertical
    filters can be defined as [−1, 0, 1], and ![$$ \left|\begin{array}{c}-1\\ {}0\\
    {}1\end{array}\right| $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq1.png).
    The magnitude of the gradient plays an important role in edge detection methods.
    For an image *f* (*x*, *y*), the gradient and its magnitude are defined by


    ![$$ \left[\frac{\partial f}{\partial x}\ \frac{\partial f}{\partial y}\right]
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq2.png), ![$$ \sqrt{{\left(\frac{\partial
    f}{\partial x}\right)}^2+{\left(\frac{\partial f}{\partial y}\right)}^2} $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq3.png)
    .(11)


