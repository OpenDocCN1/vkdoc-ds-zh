- fmt: '# SEIR Epidemic Model


    In this epidemic model, illustrated in Figure [8-16](#483991_1_En_8_Chapter.xhtml#Fig16),
    the exposed stage (`E`) is added to the other known `S`, `I`, and `R` stages.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig16_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig16_HTML.jpg)


    Figure 8-16: Stages of the SEIR model


    The total population of the all organisms should be equal to the total population
    size, `N`. In other words,


    ![$$ S(t)+E(t)+I(t)+R(t)=N. $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ16.png)


    (16)


    The SEIR model without considering births and deaths can be written in the following
    system of equations.


    ![$$ \frac{dS}{dt}=-\frac{\beta }{N} SI $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ17.png)

    (17)


    ![$$ \frac{dE}{dt}=\frac{\beta }{N} SI-\alpha E $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ18.png)

    (18)


    ![$$ \frac{dI}{dt}=\alpha E-\gamma I $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ19.png)

    (19)


    ![$$ \frac{dR}{dt}=\gamma I $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ20.png)

    (20)


    In Equations [17](#483991_1_En_8_Chapter.xhtml#Equ17), [18](#483991_1_En_8_Chapter.xhtml#Equ18),
    [19](#483991_1_En_8_Chapter.xhtml#Equ19), and [20](#483991_1_En_8_Chapter.xhtml#Equ20),
    `β` controls the rate of spread of disease between susceptible and infected persons
    over time, `α` is the contact rate between exposed and infected organisms, and
    `γ` is the recovery rate.


    **Example 8-14.** For the given Equations [17](#483991_1_En_8_Chapter.xhtml#Equ17),
    [18](#483991_1_En_8_Chapter.xhtml#Equ18), [19](#483991_1_En_8_Chapter.xhtml#Equ19),
    and [20](#483991_1_En_8_Chapter.xhtml#Equ20), write code to simulate the population
    sizes for all populations with respect to time. The initial populations are 17,
    2, 1, and 0 for the `S`, `E`, `I`, and `R` groups, respectively. Time span is
    from 0 to 50. Other coefficients are `β = 0.8`, `α = 0.4`, and `γ = 0.3`.


    **Solution 8-14.** The following codes can be used to accomplish the given tasks.


    *Example8p14.m*


    ```

    %Example8p14

    %This code solves SEIR model

    [t,x]=ode45(@Seir,[0,50],[17,2,1,0]);

    plot(t,x);

    xlabel(''time'');ylabel(''population'');

    title(''SEIR Model'');grid on;

    legend(''Susceptible'',...

    ''Exposed'',''Infected'',''Recovered'');

    function SEIR=Seir(t,x)

    N=10;beta=.8;delta=0.4;gamma=1;

    SEIR(1,:)=-(beta/N)*x(1)*x(3);

    SEIR(2,:)=(beta/N)*x(1)*x(3)-delta*x(2);

    SEIR(3,:)=delta*x(2)-gamma*x(3);

    SEIR(4,:)=gamma*x(3);

    end

    ```


    Once the code is run, the output shown in Figure [8-17](#483991_1_En_8_Chapter.xhtml#Fig17)
    is displayed.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig17_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig17_HTML.jpg)


    Figure 8-17: SEIR model


    To see the very beginning of the dynamics clearly, we can substitute the `semilogx`
    command with the `plot` function to get the result shown in Figure [8-18](#483991_1_En_8_Chapter.xhtml#Fig18).


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig18_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig18_HTML.jpg)


    Figure 8-18: Beginning of SEIR dynamics


    As is clear in Figure [8-18](#483991_1_En_8_Chapter.xhtml#Fig18), populations
    of types start varying before the time is equal to 1. In the long term, we see
    that infected and exposed populations become almost zero and the rest of the populations
    belong to the susceptible and recovery states. Considering Figure [8-17](#483991_1_En_8_Chapter.xhtml#Fig17),
    it can be concluded that these situations stay steady when time goes to infinity.


    One important point we need to keep in mind is that these outcomes can be changed
    by just changing the coefficients of the dynamics. If we add mortality or births
    to the equations, then we could encounter totally a different scenario from what
    we saw in the previous examples.


    # Cellular Dynamics of HIV


    Human immunodeficiency virus (HIV) targets and alters the immune system and ultimately
    leads to acquired immune deficiency syndrome (AIDS), which is often fatal. Researchers
    and scientists have been trying for decades to find solutions to protect people
    from HIV and AIDS. HIV attacks a specific type of cell in the body, the CD4 helper
    cell, or T cell. The basic model for T cell and virus dynamics has a system of
    three equations:


    ![$$ \frac{dx}{dt}=\gamma -{d}_xx-\beta xv, $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ21.png)

    (21)


    ![$$ \frac{dy}{dt}=\beta xv-{d}_yy, $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ22.png)

    (22)


    ![$$ \frac{dv}{dt}= ky-{d}_vv-\beta xv $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ23.png)

    (23)


    In this system of equations, `dx/dt` represents the number of uninfected cells
    changing with respect to time, `dy/dt` represents the number of infected cells
    changing with respect to time, and `dv/dt` represents the number of free virus
    particles changing with respect to time where `x[0] > 0`, `v[0] > 0`, and `y[0]
    = 0` should hold for the initial conditions.


    For the model of Equations [21](#483991_1_En_8_Chapter.xhtml#Equ21), [22](#483991_1_En_8_Chapter.xhtml#Equ22),
    and [23](#483991_1_En_8_Chapter.xhtml#Equ23), the basic reproduction number `R[0]`
    is


    ![$$ {R}_0=\frac{k\frac{\beta \gamma}{d_x}}{d_y\left({d}_v+\frac{\beta \gamma}{d_x}\right)}=\frac{N\beta
    \gamma}{d_x{d}_v+\beta \gamma} $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ24.png)

    (24)


    where `γ` is the rate of uninfected cells produced by the immune system, and `βxv`
    is the rate of infected cells as a result of the crossing of free virus and uninfected
    cells. `N` is the number of free virus particles, which should be much greater
    than 1. `d[x]`, `d[y]`, and `d[v]` are the death rates of uninfected cells, infected
    cells, and virus particles, respectively. Time is premeasured in days. `k` is
    the rate of production of free viral particles from an infected cell.


    **Example 8-15.** For Equations [21](#483991_1_En_8_Chapter.xhtml#Equ21), [22](#483991_1_En_8_Chapter.xhtml#Equ22),
    and [23](#483991_1_En_8_Chapter.xhtml#Equ23), write code to simulate the population
    sizes for uninfected cells, infected cells, and virus particles with respect to
    time. The initial populations are 10⁶, 0, and 2 for uninfected cells, infected
    cells, and virus particles, respectively. Time span will be from 0 to 50. Other
    coefficients are `γ = 10⁵`, `k = 200`, `β = 3 ∗ 10⁻⁷`, `d[x] = 0.12`, `d[y] =
    0.5`, and `d[v] = 4`.


    **Solution 8-15.** The following code shows the core function used inside the
    main code.


    *Hiv.m*


    ```

    function HIV=Hiv(t,x)

    dx=0.12;dy=0.5;dv=4;

    beta=3e-7;k=1e+2;gamma=1e+5;

    HIV(1,:)=gamma -dx*x(1)-beta*x(1)*x(3);

    HIV(2,:)=beta*x(1)*x(3) -dy*x(2);

    HIV(3,:)=k*x(2)-dv*x(3)-beta*x(1)*x(3);

    end

    ```


    Most of the values of the variables in the preceding code are taken from *An Introduction
    to Mathematical Biology* by Linda J. S. Allen (Pearson Education, 2007, 278).
    The main part of the code can be written as follows.


    *Example8p15.m*


    ```

    %Example8p15

    %This code solves HIV model

    clear all;close all;

    [t,x]=ode45(@Hiv,[0,50],[1e+6,0,2]);

    plot(t,x(:,1));

    xlabel(''Time in days'');ylabel(''Population'');

    title(''Uninfected Cells'');grid on;

    figure;plot(t,x(:,2))

    xlabel(''Time in days'');ylabel(''Population'');

    title(''Infected Cells'');grid on;

    figure;plot(t,x(:,3))

    xlabel(''Time in days'');ylabel(''Population'');

    title(''Virus Particles'');grid on;

    ```'
