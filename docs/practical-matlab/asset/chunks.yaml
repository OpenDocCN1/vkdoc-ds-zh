    **Example 10-23.** Write code to find the edges of the `cowboys.png` image without
    using MATLAB’s built-in functions with the filter of px=[0,-1,-1;1,0,-1;1,1,0].


    **Solution 10-23.** The following code can be used to accomplish the given task.


    *Example10p23.m*


    ```

    %Example10p23

    %This code finds edges without built-in functions

    Im=double(rgb2gray(imread(''cowboys.png'')));

    [Row,Col]=size(Im);

    Im2=zeros(Row-1,Col-1);

    Im2(1,1)=Im(1,1);

    Filt=[0,-1,-1;1,0,-1;1,1,0];

    Filt=flipud(Filt);

