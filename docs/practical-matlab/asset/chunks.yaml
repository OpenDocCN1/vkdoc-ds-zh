    ### 添加与去除噪声


    图像可能因外部因素（如图像信号传输或通过卫星发送图像信号）而产生误差或噪声。


    **示例 10-14.** 编写代码，向 `peppers.png` 图像中添加椒盐噪声。然后使用 `medfilt2` 滤波器，在噪声密度为 0.2 的情况下去除噪声。


    **方案 10-14.** 以下代码可用于完成给定任务。


    *Example10p14.m*


    ```

