- fmt: '### SIS Epidemic Model


    In this epidemic model, it looks like as if there are three stages: susceptible
    (S) stage, infected (I) stage, and susceptible (S) stage again. The last stage
    is actually the first stage. Therefore, actually only two stages exist in the
    SIS model. All infected organisms become susceptible again. This type of model
    is more applicable to the diseases that commonly have repeat infections in a cycle.


    The total population of the all organisms should be equal to total population
    size, *N.*


    The SIS model without considering births and deaths has the following form:


    ![$$ \frac{dS}{dt}=-\frac{\beta }{N} SI+\gamma I $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ10.png)


    (10)


    ![$$ \frac{dI}{dt}=\frac{\beta }{N} SI-\gamma I $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ11.png)


    (11)


    where *β* is the contact rate by infected people at a point in time, and *γ* is
    the recovery rate.


    The ratio of ![$$ \frac{\beta }{\gamma } $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_IEq5.png)
    is called the *basic reproduction number R*[0]. If *R*[0] > 1, the disease becomes
    endemic, otherwise (*R*[0] ≤ 1 ) it dissipates.


    **Example 8-11.** For the given Equations [10](#483991_1_En_8_Chapter.xhtml#Equ10)
    and [11](#483991_1_En_8_Chapter.xhtml#Equ11), write code to simulate the population
    sizes of the SIS model. The initial populations are 9 and 1 for S and I states,
    respectively. Time span is from 0 to 50. The coefficients are given as *γ* = 1.0
    and *β* = 0.9.


    **Solution 8-11.** The following code can be used to accomplish the given tasks.


    `Example8p11.m`


    ```

    %Example8p11

    %This code solves SIS model

    [t,x]=ode45(@SIS,[0,10],[9,1]);

    plot(t,x);grid on;

    xlabel(''time'');

    title(''SIS Model with ${R}_{0} \ge 1$'',...

    ''FontAngle'',''italic'',''Interpreter'',...

    ''Latex'');

    ylabel(''population'');

    legend(''Susceptible'',''Infected'');

    function Si=SIS(t,x)

    beta=.9;N=10;

    gamma=1.0;%Recovery rate

    %x(1)=susceptible group

    Si(1,:)=-(beta/N)*x(1)*x(2)+gamma*x(2);

    %x(2)=exposed by infection

    Si(2,:)=(beta/N)*x(1)*x(2)-gamma*x(2);

    end

    ```


    In the preceding code, to print *R*[0] ≤ 1 as the title, a LaTeX interpreter is
    used. Once the code is run, the output shown in Figure [8-12](#483991_1_En_8_Chapter.xhtml#Fig12)
    is the result.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig12_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig12_HTML.jpg)


    **Figure 8-12** Dynamics of SIS model when *R*[0] ≤ 1


    It is obvious that the disease fades out over time.


    **Example 8-12.** Simulate the SIS dynamics with the same population sizes and
    time span used for Example 8-11. The coefficients for this example are given as
    *γ* = 0.1, and *β* = 0.9 to make *R*[0] > 1.


    **Solution 8-12.** The following code can be used to accomplish the given tasks.


    `Example8p12.m`


    ```

    %Example8p12

    %This code solves SIS model

    [t,x]=ode45(@SIS,[0,10],[9,1]);

    plot(t,x);grid on;xlabel(''time'');

    title(''SIS Model with ${R}_{0} \ge 1$'',...

    ''Interpreter'',''Latex'');

    ylabel(''population'');

    legend(''Susceptible'',''Infected'');

    function Si=SIS(t,x)

    beta=.9;N=10;

    gamma=0.1;%Recovery rate

    Si(1,:)=-(beta/N)*x(1)*x(2)+gamma*x(2);

    Si(2,:)=(beta/N)*x(1)*x(2)-gamma*x(2);

    end

    ```


    Once the code is run, the output shown in Figure [8-13](#483991_1_En_8_Chapter.xhtml#Fig13)
    is obtained.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig13_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig13_HTML.jpg)


    **Figure 8-13** Dynamics of SIS model when *R*[0] > 1


    As seen in Figure [8-13](#483991_1_En_8_Chapter.xhtml#Fig13), when *R*[0] > 1,
    the disease spreads to the whole population.


    ### SIR Epidemic Model


    In this epidemic model, there are three different stages: susceptible (S), infected
    (I), and recovered (R). The total population of the all organisms should be equal
    to the total population size, *N.* In other words,


    ![$$ S(t)+I(t)+R(t)=N. $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ12.png)


    (12)


    The SIR model without considering births and deaths has the following form:


    ![$$ \frac{dS}{dt}=-\frac{\beta }{N} SI $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ13.png)


    (13)


    ![$$ \frac{dI}{dt}=\frac{\beta }{N} SI-\gamma I $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ14.png)


    (14)


    ![$$ \frac{dR}{dt}=\gamma I $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ15.png)


    (15)


    where *β* is the contact rate by an infected people at a point in time and *γ*
    is the recovery rate. ![$$ {R}_0=\frac{\beta }{\gamma } $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_IEq6.png)
    is the basic reproduction number.


    **Example 8-13.** For the given Equations [13](#483991_1_En_8_Chapter.xhtml#Equ13),
    [14](#483991_1_En_8_Chapter.xhtml#Equ14), and [15](#483991_1_En_8_Chapter.xhtml#Equ15),
    write code to simulate the population sizes for all S, I, and R stages over time.
    The initial populations are 9, 1, and 0 for S, I, and R populations, respectively.
    Time span is from 0 to 50. Other coefficients are given as *γ* = 0.1 and *β* = 0.9.


    **Solution 8-13.** The following codes can be used to accomplish the given tasks.


    `Example8p13.m`


    ```

    %Example8p13

    %This code solves SIR model

    [t,x]=ode45(@SIR,[0,50],[9,1,0]);

    %semilogx(t,x);

    plot(t,x);

    xlabel(''time'');ylabel(''population'');

    title(''SIR Model'');grid on;

    legend(''Susceptible'',''Infected'',''Recovered'');

    function Sir=SIR(t,x)

    beta=.9;%contact rate by people in population i

    gamma=.1;%Recovery rate

    N=10;%N=Total number of population

    %dS/dt=Sir(1),x(1)=susceptible people

    ds=-(beta/N)*x(1)*x(2);

    %dI/dt=Sir(2),x(2)=exposed by infection

    di=(beta/N)*x(1)*x(2)-gamma*x(2);

    %dr/dt=sir(3),x(3)=Recovered from infection

    dr=gamma*x(2);

    Sir=[ds;di;dr];

    end

    ```


    Once the code is run, the output displayed in Figure [8-14](#483991_1_En_8_Chapter.xhtml#Fig14)
    is obtained.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig14_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig14_HTML.jpg)


    **Figure 8-14** Dynamics of SIR model with *R*[0] > 1


    In this outcome, *R*[0] is greater than 1. If we use *γ* = 1.0 and keep the rest
    of the parameters in this example the same, the graphic shown in Figure [8-15](#483991_1_En_8_Chapter.xhtml#Fig15)
    is the output when the reproduction number is equal to or less than 1.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig15_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig15_HTML.jpg)


    **Figure 8-15** Dynamics of SIR model with *R*[0] ≤ 1'
