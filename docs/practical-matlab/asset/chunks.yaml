    ## 图像分割


    图像分割是将图像划分为其组成部分，或将图像分割成不同区域的过程。通常，属于同一分割区域的像素预期具有相似的像素值，因此应形成一个连通区域。常见的分割技术包括阈值分割、边缘检测和基于区域的方法。


    ### 阈值分割


    将灰度图像的每个像素赋值为 0 或 1（考虑精确的一个或多个点）称为阈值分割。阈值分割有两种类型：单阈值分割和双阈值分割。

    '
- fmt: '### Single Thresholding


    In single thresholding, only one point is taken into account. Let us assume that
    the threshold value is defined as `T`. The pixel value at point `(x,y)` can be
    defined as follows:


    ![$$ \mathrm{P}\left(x,y\right)=\left\{\begin{array}{c}\mathrm{white},\mathrm{if}\
    \mathrm{the}\ \mathrm{value}\ \mathrm{at}\ \left(x,y\right)&gt;T\ \\ {}\mathrm{black},\mathrm{if}\
    \mathrm{the}\ \mathrm{value}\ \mathrm{at}\ \left(x,y\right)\le T\end{array}\right.
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ7.png)


    (7)


    Therefore, in Equation [7](#483991_1_En_10_Chapter.xhtml#Equ7), white or black
    coloring is defined for every pixel value of `P(x, y)` within the grayscale image.


    **Example 10-18.** Write code to detect the borders of the `coin.png` file with
    `T = 0.61` as the threshold.


    **Solution 10-18.** The following code can be used to accomplish the given task.


    *Example10p18.m*


    ```

    %Example10p18

    %This code uses thresholding

    T=0.61;

    im=mat2gray(imread(''coins.png''));

    [Row,Col]=size(im);

    NewIm=zeros(Row,Col);

    for i=1:Row

    for k=1:Col

    if im(i,k)>T

    NewIm(i,k)=1;

    else

    NewIm(i,k)=0;

    end

    end

    end

    figure,imshowpair(im,mat2gray(NewIm),''montage'');

    title (''Original Image and Thresholding'');

    ```


    Once the code is run, the output shown in Figure [10-23](#483991_1_En_10_Chapter.xhtml#Fig23)
    is obtained.


