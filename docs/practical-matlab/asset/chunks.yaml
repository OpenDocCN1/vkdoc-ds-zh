    % --- Executes on button press in pick.

    function pick_Callback(hObject, eventdata, handles)

    % hObject    handle to pick (see GCBO)

    % eventdata  reserved - to be defined in a future %version of MATLAB

    % handles    structure with handles and user data  %(see GUIDATA)

    Suit = {''Club'', ''Spade'', ''Heart'', ''Diamond''};

    Numbers={''Ace'',''2'',''3'',''4'',''5'',''6'',''7'',''8'',...

    ''9'',''10'',''Jack'',''Queen'',''King''};

    Su=randi(4,1);Nu=randi(13,1);

    Card=[cellstr(Suit(Su)),cellstr(Numbers(Nu))];

    %Tipp    = get(handles.edittip, ''String'');

    set(handles.textR,''String'',Card);

    ```


    After running the code, the GUI is ready to work.


    Many applications can be created using GUIs. Most of the time, GUIDE is used as
    to create these applications, but App Designer has been used more recently and
    more components have been added to the canvas as well. There is a `Migrate` tool
    to convert an application created in GUIDE into App Designer files. It can easly
    be downloaded from the Mathworks web site.


