    ### Double Thresholding


    In double thresholding, two points are taken into account. Let us assume that
    threshold values are defined as `T[1]` and `T[2]`. The pixel value at point `(x,y)`
    can be defined as follows:


    ![$$ \mathrm{P}\left(x,y\right)=\left\{\begin{array}{c}\mathrm{white},\mathrm{if}\
    \mathrm{the}\ \mathrm{value}\ \mathrm{at}\ \left(x,y\right)\ \mathrm{is}\ \mathrm{between}\
    {T}_1\ \mathrm{and}\ {T}_2\ \\ {}\mathrm{black},\mathrm{if}\ \mathrm{the}\ \mathrm{value}\
    \mathrm{at}\ \left(x,y\right)\mathrm{is}\ \mathrm{elsewhere}\kern4em \end{array}\right.
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ8.png)


    (8)


    **Example 10-20.** Write code to detect the borders of the `coin.png` file with
    `T[1] = 0.618` and `T[2] = 0.382` as thresholding values.


    **Solution 10-20.** The following code can be used to accomplish the given task.


    *Example10p20.m*


    ```

    %Example10p20

    %This code uses double thresholding

    T1=0.618;T2=0.382;

    im=mat2gray(imread(''coins.png''));

    [Row,Col]=size(im);

    NewIm=zeros(Row,Col);

    for i=1:Row

    for k=1:Col

    if (im(i,k)>T2) && (im(i,k)<T1)

    NewIm(i,k)=1;

    else

    NewIm(i,k)=0;

    end

    end

    end

    figure,imshowpair(im,mat2gray(NewIm),''montage'');

    title (''Original Image and Thresholding'');

    ```


