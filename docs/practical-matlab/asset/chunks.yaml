    ```


    ## 习题


    - **3.1.** Bushra 将她的 180,000 美元存入银行，年利率为 25%（单利）。她计划在存款 34 个月后取出所有资金。银行也允许客户按月取款。编写代码计算
    Bushra 在 34 个月末能取出的金额。

    - **3.2.** Alexander 将 240,000 美元存入一个年复利率为 20% 的银行账户。如果他在 8 年后从银行取出资金，他获得的利息是多少？

    - **3.3.** David 的市场以每公斤 39 美元的价格出售西瓜，加价率为 30%。如果他希望在原成本基础上打 10% 的折扣出售，那么 David
    购买西瓜的每公斤成本是多少？编写代码显示成本价和折扣后的价格。

    - **3.4.** 一家咖啡店起初以 20 美元的价格出售一个杯子，随后将价格调整为 25 美元。价格变动的百分比是多少？

    - **3.5.** Benjamin 的自行车公司生产自行车进行销售。每生产一辆自行车，公司需花费 40 美元，另外还有 25 美元的固定成本。编写代码计算生产自行车的总成本。该代码还应计算生产七辆自行车的成本。

    - **3.6.** Lily 的电影院公司为一场电影放映出售门票。该电影院有 1,200 个座位。目前每张票售价 10 美元。Lily 想提高票价。根据以往经验，Lily
    认为如果每张票提价 0.50 美元，那么观影人数将减少 20 人。求能使收入最大化的票价。

    - **3.7.** 对于给定的函数 *R*(*x*) = 2*x*² − 4*x* + 2，求 *R*(*x*) 的最小值。并说明求出 *R*(*x*)
    最大值的可能性。


    # 4. 数值方法


    在本章中，我将介绍如何使用数值技术解决问题。首先介绍插值法和外推法。然后解释曲线拟合和求根。最后涵盖数值积分和数值微分。


    ## 插值与外推


    在一维应用中进行插值时，可以使用函数 `interp1` 找到给定域内某个点的对应值。同样地，通过同一函数也能找到给定域外的值。这种方法称为外推。`interp1`
    函数提供了多种方法，如 `linear` 或 `spline`（表 4-1）。某些可用于插值的方法在 `interp1` 函数中不适用于外推。如果使用一个不支持外推的方法选取外部点进行外推，MATLAB
    会返回 `NaN`，代表“非数值”。因此，选择合适的方法对于执行插值或外推至关重要。


    **表 4-1** `interp1` 使用的方法


    | 选项       | 说明                                       |

    |------------|--------------------------------------------|

    | linear     | 使用线性插值（默认值）                     |

    | nearest    | 使用最近邻插值                             |

    | next       | 使用下一邻点插值                           |

    | previous   | 使用前一邻点插值                           |

    | spline     | 使用分段三次样条插值及外推                 |


    **示例 4-1.** 对于给定的 *x* = [1, 2, 5, 8] 和 *y* = [20, 30, 50, 80]，使用 `interp1` 函数的默认方法计算
    7 处的值，并使用 `linear` 和 `spline` 方法计算 10 处的值。


    **解 4-1.** 以下代码可用于完成给定任务。


    *Example4p1.m*


    ```

    %Example4p1

    %This code uses interp1 function

    x=[1, 2, 5, 8];

    y=[20, 30, 50, 80];

    ValX1 = interp1(x,y,7);

    ValX2 = interp1(x,y,10,"linear");

    ValX3 = interp1(x,y,10,"spline");

    fprintf("1st value is %f\n",ValX1)

    fprintf("2nd value is %f\n",ValX2)

    fprintf("3rd value is %f\n",ValX3)

    ```


    代码执行后，将得到以下输出。


    ```

    > Example4p1

    1st value is 70.000000

    2nd value is NaN

    3rd value is 121.428571

    >

    ```


    如上述输出所示，计算机为 `2nd value` 打印了 `NaN`。这表明在 `interp1` 函数中，`linear` 方法不支持外推。


    ## 曲线拟合


    利用数据集，可以通过函数 `polyfit` 获得一个多项式函数。


    **示例 4-2.** 对于给定的 *x* = [4, 6, 6.5, 8, 10] 和 *y* = [4, 8, 6, 7, 9]，获得从一次到四次的四条不同曲线。然后，利用这四个多项式，在
    *x* = 3:0.5:20 范围内求值。该代码应将所有曲线绘制在同一张图中。


    **解 4-2.** 以下代码可用于完成给定任务。


    *Example4p2.m*


