- fmt: '### Genome Sequencing


    Genes are made up of deoxyribonucleic acid (DNA). DNA has four different bases
    (nucleotides): adenine (A), thymine (T), guanine (G), and cytosine (C). A is paired
    with T, G is paired with C, or vice versa on a strand of DNA. Genome sequencing
    is used to investigate the order of nucleotides in DNA.


    **Example 8-4.** A sequence of DNA is given as `TCAGGGAATTCCTACTTTTGTATTCGCCAG`.
    Write a code to transcribe that sequence to RNA.


    **Solution 8-4.** If you have Bioinformatics Toolbox installed in MATLAB, then
    by just using built-in functions, the code can easily be transcribed into `rna`.
    In this solution, though, we will write all the code required to get the solution.


    *Example8p4.m*


    ```matlab

    %Example8p4

    %This code transcribes DNA code to RNA

    Seq=''TCAGGGAATTCCTACTTTTGTATTCGCCAG'';

    Result = MyDNA2RNA(Seq);

    fprintf(''DNA : %s\n'',Seq'')

    fprintf(''RNA : %s\n'',Result'')

    ```


    Here, the sequence `seq` is passed to the defined function `MyDNA2RNA`. That function
    is saved in a different file so it can be used in different examples as well.
    The defined function does the transcribing. After obtaining the result, the code
    prints both the original code and the transcribed code.


    *MyDNA2RNA.m*


    ```matlab

    function [Result]=MyDNA2RNA(Seq)

    L=length(Seq);

    Result =";

    for i=1:L

    switch Seq(i)

    case ''A''

    Result(i) = ''U'';

    case ''T''

    Result(i) = ''A'';

    case ''G''

    Result(i) = ''C'';

    case ''C''

    Result(i) = ''G'';

    otherwise

    disp(''Code has WRONG Letter'');

    end

    end

    end

    ```


    Once the code is executed, we obtain the following output.


    ```

    >> Example8p4

    DNA : TCAGGGAATT C CTA C TTT T GTATTCGCCAG

    RNA : AGUCCCUUAAGGAUGAAAACAUAAGCGGUC

    >>

    ```


    **Example 8-5.** A sequence of a DNA is given as `TCAACCGGTCGTAGCTAC`. Write code
    to transcribe it to RNA. Then, by using a genetic code table (Figure [8-4](#483991_1_En_8_Chapter.xhtml#Fig4)),
    translate it to a sequence of amino acids. Finally, the code should display the
    final sequence on the screen.


    **Solution 8-5.** In the genetic code table, the nucleotides are separated, or
    grouped as three by three. Every group is called a *codon.* For each of these
    codons, there is a corresponding amino acid except `UAA`, `UAG`, and `UGA`. These
    three codons are known as *nonsense codons*.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig4_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig4_HTML.jpg)


    Figure 8-4: Genetic code table


    All amino acids are listed in Figure [8-4](#483991_1_En_8_Chapter.xhtml#Fig4)
    with three-letter abbreviations. As an example, `AUU` represents isoleucine amino
    acid, and it is abbreviated `Ile`. It can be just shown by its first letter, `I`,
    as well. Some amino acids start with the same letters, however. Different single
    letters are assigned to these amino acids. These single codes are taken from MATLAB’s
    official web site. In this example, we will show each amino acid with both three
    letters and one letter.


    *Example8p5.m*


    ```matlab

    %Example8p5

    %This code transcribes DNA code to RNA

    Seq=''TCAGGGAATTCCTACTTTTGTATTCGCCAG'';

    Convert = MyDNA2RNA(Seq);

    fprintf(''DNA : %s\n'',Seq'');

    fprintf(''RNA : %s\n'',Convert);

    Codons = MyCodons(Convert);

    disp(''Codons :'');

    disp(Codons);

    [Codn3,Codn1]= GeneticCode(Codons);

    disp(''Amino Acids with 3 codes'');

    disp(Codn3);

    disp(''Amino Acids with 1 code'');

    disp(Codn1);

    ```


    In the preceding code, there are three defined functions: `MyDNA2RNA`, `MyCodons`,
    and `GeneticCode`. The first function is the same as in the previous question.
    The other two are shown in the following code.


    *MyCodons.m*


    ```matlab

    function [Out] = MyCodons(Seq)

    %This function takes the sequence

    %and returns them as codons

    L=length(Seq);

    Subst=mod(L,3);

    Seq2=cell(1,(L-Subst)/3);

    for k=1:(L/3)

    Seq2{k} = Seq(3*k-2:3*k);

    end

    Out = Seq2;

    end

    ```


    *GeneticCode.m*


    ```matlab

    function [Out1,Out2] = GeneticCode(Seq)

    L=length(Seq);%Below are 20 amino acids

    Seq2=cell(1,L);Seq3=cell(1,L);

    Phe=[''UUU'',''UUC''];Ile=[''AUU'',''AUC'',''AUA''];

    Leu=[''UUA'',''UUG'',''CUU'',''CUC'',''CUA'',''CUG''];

    Met=[''AUG''];NONE=[''UAA'',''UAG'',''UGA''];

    Val=[''GUU'',''GUC'',''GUA'',''GUG''];

    Ser=[''UCU'',''UCC'',''UCA'',''UCG'',''AGU'',''AGC''];

    Pro=[''CCU'',''CCC'',''CCA'',''CCG''];

    Thr=[''ACU'',''ACC'',''ACA'',''ACG''];

    Ala=[''GCU'',''GCC'',''GCA'',''GCG''];

    Tyr=[''UAU'',''UAC''];His=[''CAU'',''CAC''];

    Gln=[''CAA'',''CAG''];Asn=[''AAU'',''AAC''];

    Lys=[''AAA'',''AAG''];Asp=[''GAU'',''GAC''];

    Glu=[''GAA'',''GAG''];Cys=[''UGU'',''UGC''];

    Arg=[''CGU'',''CGC'',''CGA'',''CGG'',''AGA'',''AGG''];

    Gly=[''GGU'',''GGC'',''GGA'',''GGG''];Trp=[''UGG''];

    for i=1:(L)

    if contains(Seq(i),Phe)

    AA=''Phe'';Aa=''F'';

    elseif contains(Ile,Seq(i))

    AA=''Ile'';Aa=''I'';

    elseif contains(Leu,Seq(i))

    AA=''Leu'';Aa=''L'';

    elseif contains(Met,Seq(i))

    AA=''Met'';Aa=''M'';

    elseif contains(NONE,Seq(i))

    AA=''NON'';Aa=''-'';

    elseif contains(Val,Seq(i))

    AA=''Val'';Aa=''V'';

    elseif contains(Ser,Seq(i))

    AA=''Ser'';Aa=''S'';

    elseif contains(Pro,Seq(i))

    AA=''Pro'';Aa=''P'';

    elseif contains(Thr,Seq(i))

    AA=''Thr'';Aa=''T'';

    elseif contains(Ala,Seq(i))

    AA=''Ala'';Aa=''A'';

    elseif contains(Tyr,Seq(i))

    AA=''Tyr'';Aa=''Y'';

    elseif contains(Gln,Seq(i))

    AA=''Gln'';Aa=''Q'';

    elseif contains(Lys,Seq(i))

    AA=''Lys'';Aa=''K'';

    elseif contains(Glu,Seq(i))

    AA=''Glu'';Aa=''I'';

    elseif contains(Arg,Seq(i))

    AA=''Arg'';Aa=''R'';

    elseif contains(Gly,Seq(i))

    AA=''Gly'';Aa=''G'';

    else

    AA=''---'';Aa=''-'';

    end

    Seq2{i}=AA;Seq3{i}=Aa;

    end

    Out1=Seq2;Out2=Seq3;

    end

    ```


    Once the code is run, the following output is displayed.


    ```

    > Example8p5

    DNA : TCAGGGAATTCCTACTTTTGTATTCGCCAG

    RNA : AGUCCCUUAAGGAUGAAAACAUAAGCGGUC

    Codons :

    Columns 1 through 8

    ''AGU''    ''CCC''    ''UUA''    ''AGG''    ''AUG''    ''AAA''    ''ACA''    ''UAA''

    Columns 9 through 10

    ''GCG''    ''GUC''

    Amino Acids with 3 codes

    Columns 1 through 8

    ''NON''    ''Pro''    ''Ile''    ''Arg''    ''Met''    ''Lys''    ''Thr''    ''NON''

    Columns 9 through 10

    ''Ala''    ''Val''

    Amino Acids with 1 code

    ''-''    ''P''    ''I''    ''R''    ''M''    ''K''    ''T''    ''-''    ''A''    ''V''

    >

    ```


    One dash or three dashes belong to the nonsense codons.


    **Example 8-6.** From the previous example, where the sequence is `TCAACCGGTCGTAGCTAC`,
    remove the first letter, and transcribe the new sequence again. Write the obtained
    amino acids as one single word where each letter represents one amino acid. Explain
    the obtained result.


    **Solution 8-6.** The following code can be used to accomplish the given tasks.


    *Example8p6.m*


    ```matlab

    %Example8p6

    %This code transcribes DNA code to RNA

    Seq=''TCAGGGAATTCCTACTTTTGTATTCGCCAG'';

    Seq2=Seq(2:end);

    Convert = MyDNA2RNA(Seq2);

    Codons = MyCodons(Convert);

    [Codn3,Codn1]= GeneticCode(Codons);

    MySeq=";

    for k=1:length(Codn1)

    MySeq(k)=Codn1{k};

    end

    disp(''Original Sequence:'');disp(Seq);

    disp(''Updated Sequence'');disp(Seq2);

    disp(''Obtained Amino Acids:'');disp(MySeq);

    ```


    Here, the `MyDNA2RNA`, `MyCodons`, and `GeneticCode` functions are the same functions
    as those used before. Once the code is run, the following output is obtained.


    ```

    > Example8p6

    Original Sequence:

    TCAGGGAATTCCTACTTTTGTATTCGCCAG

    Updated Sequence

    CAGGGAATTCCTACTTTTGTATTCGCCAG

    Obtained Amino Acids:

    VL-R-KIKR

    >

    ```


    As shown, the obtained amino acids here and those obtained from the previous question
    are different. This indicates that, if any of the nucleobase is missed in a sequence,
    then a totally different sequence is obtained after transcribing.'
