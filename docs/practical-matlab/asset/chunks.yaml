- fmt: '# Variables and Expressions


    In programming languages such as C, C++, and Java, the type of the variable should
    be specified before the variable is used. However, in MATLAB, this is not the
    case. The variables are ready to use by just assigning their values. That makes
    MATLAB more practical for writing shorter and simpler code more quickly.


    Some expressions, such as `if`, `for`, or `end` are reserved for the scripts of
    the language. These words are called *keywords*. To see a list of the keywords
    used in MATLAB, simply type `iskeyword` at the prompt.


    Unlike in Example 1-2, we can assign variable names to the solutions to use them
    later as well. This is called *assigning*. By typing the following command at
    the prompt,


    ```

    > my_var = 3

    my_var =


    >

    ```


    we assign 3 to the variable named `my_var`. Any defined variable is stored as
    a double precision type in MATLAB by default, unless otherwise specified. Here,
    the variable `my_var` is a 1 x 1 matrix with type double. We examine data types
    later in this chapter.


    To display the defined variables and the information carried by them in the workspace,
    the function `whos` can be used.


    ```

    > whos

    Name        Size            Bytes     Class     Attributes

    my_var      1x1             8         double

    >

    ```


    There are certain rules for assigning a name to a variable. Variable names cannot
    be selected in a random manner; they must meet the following requirements:


    -   They should start with a letter.

    -   They can contain numbers and underscores.

    -   They can be a maximum of 63 characters long (the `namelengthmax` command can
    be used to check this).

    -   They should not be a keyword adopted in the MATLAB language.


    To avoid confusion, any variable name to be assigned can be checked to see whether
    it is usable or not at the prompt using the `isvarname` command.


    Another important point that programmers should keep in mind is that MATLAB is
    a case-sensitive language. In other words, there is a difference between `a=5`
    and `A=5` once they are defined in the workspace.


    **Example 1-3.** Check whether it is permissible to use the following names as
    variable names in MATLAB: `Howareyou`, `hi!`, `Hola+`, `Heidi`, `for`, `name1`,
    `Okay_5`


    **Solution 1-3.** We can use the `isvarname` command to check each of these names.
    If the result is `1`, then it is acceptable to use the name. If the result is
    `0`, the name cannot to be given to a variable. The first two names are checked
    here as an example:


    ```

    > isvarname Howareyou

    ans =

    logical


    > isvarname Hi!

    ans =

    logical


    >

    ```


    Here, 0 or 1 values are assigned to the `ans` variable, the class type of which
    is logical.


    As you can see, whenever new information is entered at the prompt, it is repeated.
    If you do not want the computer to repeat what you typed at the prompt, you can
    insert a semicolon at the end of the line before you press Enter.


    **Example 1-4.** In the equation P*V = n*R*T, the variables are given as P=10,
    n=2, R=7, and T= ½. Find V according to the given formula.


    **Solution 1-4.** We can enter the following in MATLAB for the solution.


    ```

    > P=10;

    > n=2;

    > R=7;

    > T=1/2;

    > V=(n*R*T)/P

    V =

    0.7000

    >

    ```


    As we can see, there are semicolons after each line except the last one. Because
    there is no semicolon to the right of the last line, we can see the result of
    that line after pressing Enter.


    # Formats


    In MATLAB, there are line spacing formats and various numerical formats. Line
    spacing formats control the spacing between the lines in showing the results at
    the command window. Numerical formats shape the representation of the output.


    Per the line spacing format, there are two options: *compact* and *loose*. The
    compact option keeps the lines tight and closer, whereas the loose option introduces
    additional spacing between the lines in the command window.


    **Example 1-5.** Let A=22/7. Show A both in compact format and loose format in
    the command window.


    **Solution 1-5.** If you type the following in the command window, you will see
    the variable A in both formats.


    ```

    > A=22/7;

    > format compact

    > A

    A =

    3.1429

    > format loose

    > A

    A =

    3.1429

    >

    ```


    We use the compact format throughout this book to save space.


    As for the numerical formats, more options are available. If the format is not
    altered, the default, *format short*, is used. This format yields calculations
    to four decimal places by default. Different alternatives are shown in Table 1-2.


    **Table 1-2** Numerical Format Types


    | Style | Display | Example |

    | --- | --- | --- |

    | format short | Shows 4 decimal digits (default) | 0.3333 |

    | format long | Shows 15 decimal digits | 0.333333333333333 |

    | format shortE | Shows 4 decimal digits in scientific notation | 3.3333e-01 |

    | format longE | Shows 15 decimal digits in scientific notation | 3.333333333333333e-01
    |

    | format shortG | Same as format short, or format shortE, whichever is more compact
    | 0.33333 |

    | format longG | Same as format long, or format longE, whichever is more compact
    | 0.333333333333333 |

    | format shortEng | Shows 4 decimal digits in engineering notation | 333.3333e-003
    |

    | format longEng | Shows 12 decimal digits in engineering notation | 333.333333333333e-003
    |

    | format + | Positive/negative/blank | + |

    | format bank | Shows in currency format with 2 digits after decimal points |
    0.33 |

    | format hex | Shows the hexadecimal representation | 3fd5555555555555 |

    | format rat | Converts the decimal number to a fraction | 1/3 |


    **Example 1-6.** Let A=22/7. Show A in the formats of long scientific notation,
    short engineering notation, hexadecimal format, and fraction.


    **Solution 1-6.** The commands used in the solution and the corresponding output
    are shown here.


    ```

    > format longE

    > A

    A =

    3.142857142857143e+00

    > format shortEng

    > A

    A =

    3.1429e+000

    > format hex

    > A

    A =


    > format rat

    > A

    A =

    22/7

    >

    ```


    # Vectors and Matrices


    MATLAB’s foundation is based on matrices. In other words, the basic data type
    in MATLAB is a matrix. There exist close relations among arrays, vectors, and
    matrices. In this section, we explore arrays, vectors, matrices, and the colon
    operator used in MATLAB.


    ## Arrays


    An *array* is a group of objects having the same type, size, and attributes. An
    array that consists of one element is called a *scalar*. Arrays can be specified
    as vectors or matrices. A list of arrays arranged as a column or as a row is a
    one-dimensional matrix. We can think of a 4 × 5 matrix, having two dimensions
    as shown in Figure 1-3.


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig3_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig3_HTML.jpg)


    **Figure 1-3** An array


    In Figure 1-3, the cell filled with yellow represents the array that constitutes
    the second row and the fourth column of the matrix. Therefore, we can think of
    arrays as elements of matrices.'
