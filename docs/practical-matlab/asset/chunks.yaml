    # 正弦波作为声音


    通过使用如下定义的正弦波，可以产生一个声音：


    ![$$ y=A\ast \sin \left(2\ast \pi \ast n\ast {F}_w/{F}_s\right) $$](img/483991_1_En_11_Chapter_TeX_Equ1.png)


    (1)


    其中，`A` 是波的振幅，`Fw` 是波的频率，`Fs` 是采样频率，`n` 是采样点的索引。在某些资源中，相同的公式也被表示为：


    ![$$ y=A\ast \sin \left(2\ast \pi \ast frequency\ast TimeVector\right) $$](img/483991_1_En_11_Chapter_TeX_Equ2.png)


    (2)


    其中 `frequency` = 正弦波频率，而 ![$$ \mathrm{TimeVector}=\frac{\mathrm{总点数}}{\mathrm{采样频率}}
    $$](img/483991_1_En_11_Chapter_TeX_IEq1.png)。


    **示例 11-6.** 编写一个程序，绘制正弦波信号。变量设置为 `amplitude = 32`、`total number of points = 1,000`、`sampling
    frequency = 1,000` 以及 `frequency of sine wave = 20`。代码应根据公式 1 或 2 播放 `y` 的声音，并绘制信号图。


    **解答 11-6.** 可以编写以下代码来完成这些任务。


    `Example11p6.m`


    ```

    %Example11p6

    % This code plays sine wave

    A=32;N=1000;%Total number of points

    Fs=1000;% Sampling frequency

    frequency=20;%Frequency of sine wave

    TimeVector=(0:N-1)/Fs;

    y=A*sin(2*pi* frequency.*TimeVector);

    sound(y);plot(TimeVector,y);

    title(''Sine Wave'');ylabel(''Amplitude'');

    xlabel(''Time'');

    ```


    一旦运行该代码，就会听到信号 `y` 的声音，并得到如图 11-3 所示的信号图。


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig3_HTML.jpg](img/483991_1_En_11_Fig3_HTML.jpg)


    图 11-3


    正弦波图


    **示例 11-7.** 编写一个程序，绘制由 `ysin = A * (sin(2 * π * freq * TimeVector)) + A * (sin(4
    * π * freq * TimeVector))` 给出的信号。变量设置为 `amplitude = 1.5`、`total number of points
    = 1,500`、`sampling frequency = 1,000` 以及 `frequency of sine wave = 50`。代码应对信号
    `ysin` 进行快速傅里叶变换 (`fft`)，并播放和绘制该信号。


    **解答 11-7.** 可以编写以下代码来完成这些任务。


    `Example11p7.m`


    ```

    %Example11p7

    % This plays sound

    A=1.5;% Amplitude

    N=1500;%Total number of points

    Fs=1000;% Sampling frequency

    freq=50;%Frequency of sine wave

    TV=(0:N-1)/Fs;%time vector

    ysin=A*sin(2*pi* freq.*TV)+...

    A*sin(4*pi* freq.*TV);

    Y = fft(ysin);y = abs(Y/N);

    P1=y(1:N/2+1);P1(2:end-1)=2*P1(2:end-1);

    t=Fs*(0:(N/2))/N;sound(ysin);plot(t,P1,''r'');

    ```


    一旦运行该代码，就会听到信号 `ysin` 的声音，并得到如图 11-4 所示的输出图。


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig4_HTML.jpg](img/483991_1_En_11_Fig4_HTML.jpg)


    图 11-4


    示例 11-7 的输出


    图 11-4 中显示了两条柱。如果调整信号中正弦函数的系数或振幅，并改变其中一个，例如，使第一项的振幅是第二项振幅的两倍，那么图形中柱的值将会不同。


    ## 习题


    * **11.1.** 编写一个程序，将音频文件 `chirp` 和 `handel` 加载到工作区。然后，程序应依次播放这两个声音。


    * **11.2.** 编写一个程序，以 30,000 Hz 的采样率、16 位精度和 2 个通道录制你的声音，持续 5 秒。然后，程序应回放录制的声音并绘制录制文件的图形。


    * **11.3.** 编写一个程序，将音频文件 `chirp` 加载到工作区。然后，程序应将该文件保存为当前目录下的 `chirp.flac` 文件。代码应向该文件添加一些信息。在注释字段中，声音文件应包含值
    `Nice Voice`，在标题字段中包含值 `Bird`。代码应播放该声音并显示已保存文件的信息。


    * **11.4.** 编写代码，将音频文件 `chirp` 加载到工作区。然后，代码应将声音分成两个相等的部分。该代码还应先播放后半部分，再播放前半部分。


    * **11.5.** 编写一个程序，绘制正弦波信号。变量设置为 `amplitude = 10`、`total number of points = 5,000`、`sampling
    frequency = 8,000` 以及 `frequency of sine wave = 20`。代码应播放声音并绘制信号图。


    # 12. 图形用户界面应用


    图形用户界面（GUI）可以通过三种不同的方式创建。第一种方法是通过编程方式创建 GUI。在这种情况下，命令通常直接在编辑器中编写。第二种方法是使用图形用户界面开发环境（GUIDE）。第三种方法是通过
    App Designer 创建 GUI。本章将介绍如何在所有这三种情况下创建 GUI，并说明如何使用它们来编程应用程序。


    ## GUI 元素


    尽管在 App Designer 中有更多可用的选项，但图 12-1 中所示的元素同样可以用于 GUIDE 和编程方式。


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig1_HTML.jpg](img/483991_1_En_12_Fig1_HTML.jpg)


    图 12-1


    GUIDE 的 GUI 元素


    可供使用的按钮如下：


    * 推送按钮

    * 滑块

    * 单选按钮

    * 复选框

    * 编辑文本

    * 静态文本

    * 弹出式菜单

    * 列表框

    * 切换按钮

    * 表格

    * 坐标轴

    * 面板

    * 按钮组

    * ActiveX 控件


    使用这些按钮，可以在 MATLAB 中创建漂亮且实用的 GUI。

    '
- fmt: '# Creating GUIs Programmatically


    Using this method, the buttons or elements can be directly defined and used in
    the editor.


    **Example 12-1:** Write code that creates a GUI. The GUI will have two places
    to enter length and height values. Then a button should multiply these entered
    numbers and show the result in noneditable text output with a red background.


    **Solution 12-1.** The following code can be used to accomplish the given task.


    *Example12p1.m*


    ```

    %Example12p1

    % This code creates a GUI programmatically

    close all;clear all; %[xpost,ypost,lngth,hght]

    hFig=figure(''NumberTitle'',''off'',''Menubar'',...

    ''none'',''ToolBar'',''none'',''Position'',...

    [320 180 400 400],''NumberTitle'',''off'',...

    ''Name'',''My First GUI Programmatically'');

    uicontrol(hFig,''Style'', ''text'',...

    ''String'', ''Enter Width: W'',''tag'',''htextW'',...

    ''Position'', [2 200 150 50],''FontSize'',15);

    uicontrol(hFig,''Style'', ''text'',...

    ''String'', ''Enter Length: L'',...

    ''Position'', [2 300 150 50],''FontSize'',15);

    uicontrol(hFig,''Style'',''edit'',''String'',''0'',...

    ''position'', [170 310 100 50],...

    ''FontSize'',15,''tag'',''editL'');

    uicontrol(hFig,''Style'',''edit'',''String'',...

    ''0'',''position'', [170 210 100 50],...

    ''FontSize'',15,''tag'',''editW'');

    uicontrol(hFig,''Style'', ''text'',...

    ''String'', '' 0 '',''BackgroundColor'',''Red'',...

    ''Position'', [200 100 100 40],...

    ''FontSize'',20,''tag'',''textResult'');

    uicontrol(hFig,''Style'', ''pushbutton'',...

    ''String'', ''MULTIPLY L BY W'',...

    ''Position'', [20 100 150 50], ''Callback'',...

    {@Calculate},''FontSize'',12);

    function Calculate(hObject,event)

    LL=findobj(0,''tag'',''editL'');

    L=str2double(get(LL,''String''));

    WW=findobj(0,''tag'',''editW'');

    W=str2double(get(WW,''String''));

    Result=findobj(0,''tag'',''textResult'');

    set(Result,''String'',num2str(L*W));

    end

    ```


    Although this code looks very complicated, it is quite understandable if we look
    at each object separately. In the fourth row, `figure` is the main frame of our
    interface that holds information about the position of the GUI, including the
    name of the GUI. The expression `[320 180 400 400]` sets the position of the GUI
    as `[x-position, y-position, length, height]`. Then every set of rows starting
    with the `uicontrol` function creates an object in the GUI. There are two text
    objects to show texts, two editable objects to enter values, one button object
    to click on, and one more text object to show the result. Therefore, there are
    six rows starting with the `uicontrol` function that create these objects. One
    of them, which is the button object, has a callback function. When that button
    is clicked on the GUI, it calls a function called `Calculate`. Therefore, near
    the end of the code, the `Calculate` function is created to do the core part of
    the coding. If we run the code and enter the values shown on GUI, we obtain dialog
    box shown in Figure [12-2](#483991_1_En_12_Chapter.xhtml#Fig2).


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig2_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig2_HTML.jpg)


    Figure 12-2


    Creating a GUI programmically


    Once we click the Multiply button, it calls the `Calculate` function and the entire
    code inside the function is run. The code should be able to get the entered values
    from the text boxes. This is performed inside the `Calculate` function. These
    objects are found by using their tag names. Therefore, in GUI programming, assigning
    tag names to the objects is extremely important. Using the `findobj` function,
    these objects are found and then their values are obtained using the `get` function.
    Using `str2double`, these values are converted to `double`. After the multiplication,
    the result is assigned to the text with the tag name `textResult` via the `set`
    function.


    ## Creating GUIs Using GUIDE


    One can type `>guide` at the prompt to view the GUIDE. After opening, it asks
    whether the user wants to open a new GUI or an existing GUI. In this scenario,
    you should open a new one and create the following objects by dragging and dropping
    them on the canvas.


    **Example 12-2.** Write a program to code the GUI as shown in Figure [12-3](#483991_1_En_12_Chapter.xhtml#Fig3).


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig3_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig3_HTML.jpg)


    Figure 12-3


    Creating a GUI using GUIDE


    **Solution 12-2.** We need to drag the components from the left and drop them
    on the right side as shown in Figure [12-3](#483991_1_En_12_Chapter.xhtml#Fig3).
    Then, if you double-click the icons, or right-click the icon and select Property
    Inspector, you can change the font size of the strings, values, string names,
    tags, and some other features by choosing from the available options within the
    inspector. Tag names are important in programming the GUI because tags are referred
    to whenever the components are contacted, as explained before. The tag name for
    the Side A text box is `editA`, for the Side B text box the tag name is `editB`,
    for the Perimeter text box it is `textshow`, and for the Area text box it is `editson`.


    After creating the GUI in Figure [12-3](#483991_1_En_12_Chapter.xhtml#Fig3) and
    saving it as `Example12p2.fig`, a function named `Example12p2.m` is automatically
    generated by MATLAB.


    If you run the function `Example12p2` from the command window, or click the green
    button in Figure [12-3](#483991_1_En_12_Chapter.xhtml#Fig3), then the created
    function starts working. If you just click the Calculate button on the GUI, though,
    nothing will happen. At minimum, we need a function that will request the values
    of A and B and then, display the area and perimeter after clicking the Calculate
    button.


    The Calculate button is tagged as `pushbutton1` in the inspector for the button
    (Figure [12-4](#483991_1_En_12_Chapter.xhtml#Fig4)).


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig4_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig4_HTML.jpg)


    Figure 12-4


    Inspector of Calculate button


    In our case, that will be sufficient to write the following code under the `pushbutton1_Callback`
    function in the automatically generated code. The function names might differ
    depending on the tag names you assign to the elements.


    ```

    AA=get(handles.editA,''String'');

    A=str2double(AA);

    BB=get(handles.editB,''String'');

    B=str2double(BB);

    Area = A * B;

    Perimeter= 2*(A+B);

    set(handles.textshow,''String'',Perimeter);

    set(handles.editson,''String'',num2str(Area));

    ```


    In the first line of the preceding code, the string value is obtained. In the
    second line, the value is converted into `double` for length `A`. The same procedure
    is repeated for length `B` in the third and fourth lines. Area and perimeter values
    are calculated by using the formulas in the fifth and sixth lines. Finally, these
    values are assigned to the places that were tagged as `textshow` and `editson`.


    The `pushbutton1_Callback` function should look like the Figure [12-5](#483991_1_En_12_Chapter.xhtml#Fig5).


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig5_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig5_HTML.jpg)


    Figure 12-5


    Additional function written within the generated code


    Once the code is executed, the GUI shown in Figure [12-6](#483991_1_En_12_Chapter.xhtml#Fig6)
    is the result. If we try the GUI with the values A = 10 and B = 61, and click
    Calculate, we get the result shown.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig6_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig6_HTML.jpg)


    Figure 12-6


    Output of the GUI for the given values'
