  trans: '

    # 使用 App Designer 创建 GUI


    要创建任何应用程序，首先需要打开 App Designer。在 MATLAB 工具栏中，可以点击 `New` 按钮，然后选择 `App` 选项。选择 `App`
    后，应用界面将会出现。


    在左侧，可以选择 GUI 元素。可以将对象拖拽到画布中央进行创建。创建对象是最简单的部分，而编写回调函数才是关键。在 App Designer 中，MATLAB
    允许你在编码部分的白色区域编写代码。例如，可以在图 12-7 所示的白色空间内编写代码。其余代码将根据对象的设计自动生成。


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig7_HTML.jpg](img/483991_1_En_12_Fig7_HTML.jpg)


    图 12-7


    代码视图的外观


    **示例 12-3.** 使用 App Designer 编写一个程序，绘制从 –*π* 到 *π* 之间的正弦、余弦和正切三角函数的图形。这些函数应从 `listbox`
    中选择。还应有一个滑块来乘以所选函数。当点击 `Plot` 按钮时，代码应绘制出三角函数图形，该函数需乘以滑块所选值的系数。


    **解决方案 12-3.** 设计 GUI 后，需要创建一个回调函数。图 12-8 展示了用作回调函数的代码。


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig8_HTML.jpg](img/483991_1_En_12_Fig8_HTML.jpg)


    图 12-8


    来自 `Myapp1.mlapp` 的代码


    图 12-9 显示了代码运行后的输出。


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig9_HTML.jpg](img/483991_1_En_12_Fig9_HTML.jpg)


    图 12-9


    获得的输出


    与 GUIDE 的不同之处在于，每个标签前需要添加 `app.` 作为前缀，文件名的后缀是 `.mlapp` 而非 `.m`。其余编码方式与 GUIDE 几乎相同，不过根据组件库的不同，App
    Designer 提供了更多可用选项。


    ## 创建应用程序


    使用 MATLAB 的 GUI 可以创建许多应用程序。本节通过示例展示了其中几个。这些应用程序均使用 GUIDE 创建。


    **示例 12-4.** 创建一个 GUI，提供四个选项用于绘制 *x*（范围 0 到 2π）的三角函数图形，如正弦、余弦、正切和余切。该函数应乘以一个介于
    0 到 100 之间的常数。常数的值应通过滑块控制。


    **解决方案 12-4.** 图 12-10 展示了 GUI 的轮廓。


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig10_HTML.jpg](img/483991_1_En_12_Fig10_HTML.jpg)


    图 12-10


    名为 `PlotZ` 的 GUI 输出


    在图 12-10 中，我们看到 GUI 上有 10 个组件。元素的名称和标签已更改。


    在 `PlotZ_OpeningFcn` 函数下，编写以下代码。


    ```

    axis(handles.axesSymbol,''off'');

    ht = text(1,0.5,''$0\leq x\leq 2\pi$'',...

    ''HorizontalAlignment'',''Right'',...

    ''Interpreter'',''latex'',''FontSize'',25);

    set(ht,''Parent'',handles.axesSymbol);

    Slide    = get(handles.sliderC, ''Value'');

    Slider = num2str(Slide);

    set(handles.editC, ''String'',Slider);

    ```


    在 `sliderC_Callback` 函数下，编写以下代码。


    ```

    Slide    = get(handles.sliderC, ''Value'');

    Slider = num2str(Slide);

    set(handles.editC, ''String'',Slider);

    ```


    在 `editC_Callback` 函数下，编写以下代码。


    ```

    Slide    = get(handles.editC, ''String'');

    Slider = str2double(Slide);

    set(handles.sliderC, ''Value'',Slider);

    ```


    最后，在 `pushbuttonZ_Callback` 函数下，编写以下代码。


    ```

    ChoicE = get(handles.popupmenuY,''Value'');

    CC=get(handles.editC,''String'');

    C=str2double(CC);

    x=0:0.1:2*pi;

    switch ChoicE

    case 1 % sin(x)

    z=C*sin(x);

    plot(z);

    case 2 %cos(x)

    z=C*cos(x);

    plot(z);

    case 3 %tan(x)

    z=C*tan(x);

    plot(z);

    case 4 %cot(x)

    z=C*cot(x);

    plot(z);

    end

    grid on

    ```


    运行代码后，我们将得到如图 12-10 所示的 GUI。


    **示例 12-5.** 为一家餐厅创建一个 GUI 来计算顾客的账单。GUI 上应显示餐厅的标识和名称。GUI 中应有汤品、甜点和其他可选餐食的面板。顾客只能选择一种汤，但其他餐食可以选择任意数量。


    **解决方案 12-5.** 图 12-11 展示了 GUI 的轮廓。


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig11_HTML.jpg](img/483991_1_En_12_Fig11_HTML.jpg)


    图 12-11


    名为 `Restaurant.m` 的 GUI 输出


    如图所示设计 GUI 后，将其保存为 `Restaurant.fig`，文件 `Restaurant.m` 会自动生成。然后，在相应函数中输入以下代码。


    首先，应将餐厅标识上传到 GUI。因此，在 `Restaurant_OpeningFcn` 函数下，编写以下代码。


    ```

    axis(handles.axes1,''off'');

    myImage = imread(''Restaurant.jpg'');

    axes(handles.axes1);

    imshow(myImage);

    ```


    在上述代码中，标识保存为 `Restaurant.jpg`，并与文件 `Restaurant.m` 和 `Restaurant.fig` 位于同一目录。


    接下来，我们需要编写代码来计算所选餐食的账单。在 `pushbuttonprice_Callback` 函数下，编写以下代码。

    '
- fmt: '```

    global Amount

    Soup = get(handles.uibuttongroupsoup,''SelectedObject'');

    PickedSoup = get(Soup,''Tag'');

    switch PickedSoup

    case ''radiobuttontomato''

    Soupprice = 5;

    case ''radiobuttonchicken''

    Soupprice = 7;

    case ''radiobuttonlentil''

    Soupprice = 8;

    otherwise

    msgbox(''You did not pick ANYTHING'');

    end

    Baklava = get(handles.radiobuttonbaklava,''Value'');

    Cake    = get(handles.radiobuttoncake,''Value'');

    RicePudding= get(handles.radiobuttonricepudding,''Value'');

    MixedFruit=get(handles.radiobuttonmixedfruit,''Value'');

    Shish       = get(handles.checkboxshishkebab,''Value'');

    Bursa    = get(handles.checkboxbursaiskender,''Value'');

    Wrapper    = get(handles.checkboxwrapper,''Value'');

    Rice       = get(handles.checkboxrice,''Value'');

    Salad      = get(handles.checkboxsalad,''Value'');

    Compote    = get(handles.checkboxcompote,''Value'');

    Soda       = get(handles.checkboxsoda,''Value'');

    Coffee     = get(handles.checkboxcoffee,''Value'');

    HotTea     = get(handles.checkboxhottee,''Value'');

    Amount = Soupprice+Baklava*5+Cake*5+RicePudding*5+...

    MixedFruit*7+Shish*20+Bursa*22+Wrapper*15+...

    Rice*10+Salad*10+Compote*7+Soda*3+Coffee*3+HotTea*2;

    set(handles.textsonuc,''String'',Amount);

    ```


    Under the `pushbuttontotal_Callback` function, write the following piece of code.


    ```

    global Amount

    if Amount<1

    msgbox(''You did not pick ANYTHING'');

    else

    Tipp    = get(handles.edittip, ''String'');

    Tippp = str2double(Tipp);

    TotalPrice = Amount + Tippp;

    set(handles.texttotal,''String'',TotalPrice);

    end

    ```


    After running the program, the GUI is ready to work.


    ## Example 12-6


    Build a GUI that emulates a calculator.


    ## Solution 12-6


    Figure [12-12](#483991_1_En_12_Chapter.xhtml#Fig12) shows the output of the code.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig12_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig12_HTML.jpg)


    Figure 12-12


    Outline of the GUI named `Calculator1.m`


    It is necessary to write the callback functions for each button on the GUI. Each
    button is tagged with its name. For example, `2` is tagged as `Two`, `+` is tagged
    as `Add`, and so on.


    Under the `One_Callback` function, write the following code.


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''1'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    Under the `Two_Callback` function, write the following code.


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''2'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    We repeat the same thing for buttons `2`, `3`, `4`, `5`, `6`, `7`, `8`, `9`, and
    `0`. For division, enter the following code under the `Divide_Callback` function
    in our case.


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''/'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    Similarly, repeat this procedure for the operations `*`, `-`, `+` and the symbols
    `.` and `,` as well as `π` for their corresponding buttons. For the `sin` button,
    enter the following code under the `Sine_Callback` function.


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''sin((pi/180)*'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    The angle is converted to degrees from radians in this code. That’s why we need
    to write `(pi/180)*` within the second line of the code. Similar code must be
    written for the `cos`, `tan`, and `cot` buttons. For the `Clear` button, enter
    the following code under the `Equal_Callback` function.


    ```

    EvValue   = get(handles.textresult,''String'');

    EvalValue = eval(EvValue);

    set(handles.textresult,''String'',EvalValue);

    ```


    In that code, the function `eval` evaluates the expression `EvValue`. Under the
    `Back_Callback` function, enter the following code.


    ```

    textString = get(handles.textresult,''String'');

    if(strcmp(textString,''0'')==1)

    set(handles.textresult,''String'',''0'') ;

    else

    Val=char(textString);

    L=length(textString);

    textString=Val(1:L-1);

    set(handles.textresult,''String'',textString)

    end

    ```


    After running the code, the GUI is ready to work.


    ## Example 12-7


    Construct a GUI for the guess game.


    ## Solution 12-7


    Figure [12-13](#483991_1_En_12_Chapter.xhtml#Fig13) shows the output of the code.


    ![../images/483991_1_En_12_Chapter/483991_1_En_12_Fig13_HTML.jpg](images/483991_1_En_12_Chapter/483991_1_En_12_Fig13_HTML.jpg)


    Figure 12-13


    General view of the GUI


    The program is required to guess a number whenever it is started over. Therefore,
