    # 7. Data Visualization and Animation


    MATLAB provides very powerful techniques to visualize data. In this chapter, we
    look at how to visualize data and create animations. Visualizing data was already
    touched on in Chapter [1](#483991_1_En_1_Chapter.xhtml). Therefore, the animation
    techniques are emphasized in this chapter. Animations can be created by using
    three basic techniques in MATLAB. These methods can be summarized as updating
    coordinates, applying transformation to objects, and creating movies.


    ## Data Visualization


    We already learned how to visualize two-dimensional data Chapter [1](#483991_1_En_1_Chapter.xhtml)
    for both single plots and multiple plots in a figure. In this section we learn
    how to visualize three-dimensional data (Table [7-1](#483991_1_En_7_Chapter.xhtml#Tab1)).


    Table 7-1

    Some Functions Related to 3-D Plotting


    | Function | Description |

    | --- | --- |

    | `plot3(x,y,z)` | Creates a 3-D line plot |

    | `bar3` | Plots 3-D bar graphs |

    | `comet3(x,y,z)` | Plots an animated 3-D graph |

    | `ezmesh` | Visualizes the function in 3-D |

    | `ezplot3` | A 3-D parametric curve plotter |

    | `mesh(x,y,z)` | Creates a meshed-surface plot |

    | `pie3` | Draws a 3-D pie chart |

    | `scatter3` | Is a 3-D scatter plot function |

    | `stem3` | Creates a 3-D stem plot |

    | `surf` | Plots a 3-D shaded surface |

    | `waterfall` | Creates a waterfall plot |


    **Example 7-1.** Consider the three-dimensional function given here.

    0 ≤ *t* ≤ 4*π*, *x* = sin (t), *y* = cos (t), *z* = t.


    Plot the graph of *x*, *y*, and *z* in a single figure.


    **Solution 7-1.** The following code can be used to accomplish the given task.


    `Example7p1.m`


    ```

    %Example7p1

    %This code plots 3-D

    close all;

    t = linspace(0,8*pi,1000);

    x=sin(3*t);y=cos(2*t)-5;z=3*t;

    plot3(x,y,z)

    xlabel(''sin(t)'');

    ylabel(''cos(t)'');

    zlabel(''t'');

    grid on

    title(''3-D Plot'')

    ```


    In this code, the `close all` command closes all the active figures drawn when
    it is called. Once the code is run, the output shown in Figure [7-1](#483991_1_En_7_Chapter.xhtml#Fig1)
    is displayed.


    ![../images/483991_1_En_7_Chapter/483991_1_En_7_Fig1_HTML.jpg](images/483991_1_En_7_Chapter/483991_1_En_7_Fig1_HTML.jpg)


    Figure 7-1

    Output of `Example7p1`


    There are two important functions that produce values with two variables in MATLAB,
    namely, `peaks` and `meshgrid`.


    The function `peaks(x,y)` produces a 49 × 49 matrix by default via Gaussian distribution.
    The function `meshgrid(x,y)` replicates the grid vectors *x* and *y* to produce
    a full grid.


    Using the functions `[X,Y,Z] = peaks(x,y,z)` and `[X,Y,Z] = meshgrid(x,y,z)`,
    it is possible to create three variables, as well.


    **Example 7-2.** Write code that plots two different functions onto two separate
    figures. The first plot belongs to the following function (which plots the Mexican
    hat):


    ![$$\frac{\sin \left(\sqrt{x^2+{y}^2}\right)}{\sqrt{x^2+{y}^2}}$$](images/483991_1_En_7_Chapter/483991_1_En_7_Chapter_TeX_Equa.png)


    where *x* and *y* are between -8 and 8. The second function (which plots a cowboy
    hat) is


    ![$$\frac{\sin \left(3{x}^2+2{y}^2\right)}{x^2+{y}^2}$$](images/483991_1_En_7_Chapter/483991_1_En_7_Chapter_TeX_Equb.png)


    where *x* and *y* are between -1.5 and 1.5.


    **Solution 7-2.** The following code can be used to accomplish the given task.


    `Example7p2.m`


    ```

    %Example7p2

    %This code uses meshgrid and surf

    close all;

    [x,y] = meshgrid(linspace(-8,8,30));

    [xx,yy]=meshgrid(linspace(-1.5,1.5,30),...

    linspace(-1.5,1.5,30));

    z1 = sin (sqrt(x.^2+y.^2))./sqrt(x.^2+y.^2);

    z2 = sin(3*xx.^2+2*yy.^2)./(xx.^2+yy.^2);

    figure(1)

    surf(z1), shading flat

    title(''Mexican Hat'');

    figure(2)

    surf(z2), shading faceted

    title(''Cowboy Hat'');

    % other possible shadings: flat, faceted, interp

    ```


    Once the code is run, the resulting output is shown in Figures [7-2](#483991_1_En_7_Chapter.xhtml#Fig2)
    and [7-3](#483991_1_En_7_Chapter.xhtml#Fig3).


    ![../images/483991_1_En_7_Chapter/483991_1_En_7_Fig3_HTML.jpg](images/483991_1_En_7_Chapter/483991_1_En_7_Fig3_HTML.jpg)


    Figure 7-3

    Second output of `Example7p2`


    ![../images/483991_1_En_7_Chapter/483991_1_En_7_Fig2_HTML.jpg](images/483991_1_En_7_Chapter/483991_1_En_7_Fig2_HTML.jpg)


    Figure 7-2

    First output of `Example7p2`


    ## Animation


    Three techniques can be applied to create an animation with data: updating coordinates,
    applying transformation, and creating movies.'
