    Output of Example 10-24


    ### Region-Based Methods


    Generally, data clustering, region growing, region merging and splitting, and
    mean shift are the different methods used to apply region-based image segmentation.
    These methods attempt to find common features among the pixel values over a region
    on the image. One of the easiest methods to use is region growing. In this type,
    an initial seed point is picked, and then the difference between the seed point
    and the neighboring pixels is checked. If the difference is tolerable up to a
    certain point, or a threshold, then these pixels will be added to the seed pixel
    and the region will be grown. In this method, threshold value or criteria will
    be an important part of the algorithm.


    ## Mathematical Morphology


    Mathematical morphology is a branch of image processing for analysis and processing
    geometric structures such as extracting image components. Operations are performed
    for noise filtering, segmentation, shape simplifying, and enhancing object structure.
    Dilation and erosion are two important concepts in mathematical morphology. Dilation
    adds pixels to the boundaries of object and erosion removes pixels on the boundaries.


    Assume that *A* and *B* are two sets having pixel values. Then dilation of *A*
    by *B* is defined as


    ![$$ A\oplus B=\left\{\left(x,y\right)+\left(u,v\right):\left(x,y\right)\in A,\left(u,v\right)\in
    B\right\}. $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ11.png)


    (12)


    Erosion of *A* by *B* is defined as


    ![$$ A\ominus B=\Big\{z:{B}_z\subseteq A. $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ12.png)


    (13)


    All of the other operations are defined with a combination of dilation and erosion.
    Table [10-9](#483991_1_En_10_Chapter.xhtml#Tab9) lists some of the most commonly
    used functions in morphology.


    Table 10-9


    Functions Used in Morphology


    | Function | Explanation |

    | --- | --- |

    | bwpack | Packs the entered binary image into `uint32` |

    | bwunpack | Unpacks `uint32` binary image to binary image |

    | imdilate | Dilates the grayscale, binary, or packed image |

    | imerode | Erodes grayscale, binary, or packed image |

    | imclose | Applies morphological closing on grayscale or binary image |

    | imopen | Applies morphological opening on grayscale or binary image |

    | imbothat | Applies morphological bottom-hat filtering to grayscale or binary
    image |

    | translate | Translates a polyshape |


    **Example 10-25.** Write code that resizes the image of `cowboys.png` to 300 by
    400\. Then the code should use the `strel` function, which creates a cube structuring
    element with a width of 3 pixels. Then apply this to the resized image with erosion
    and dilation separately. The code should show the original image with the dilated
    one, and the original image with the eroded one in two different figures.


    **Solution 10-25.** The following code can be used to accomplish the given task.


    *Example10p25.m*


    ```

    %Example10p25

    %This code applies erosion and dilation

    I= rgb2gray(imread(''cowboys.png''));

    BW=imresize(I,[300 400]);

    se = strel(''square'',3);

    BW1=imerode(BW,se);

    BW2 = imdilate(BW,se);

    figure,imshowpair(BW,BW1,''montage'');

    title(''Original  with Erosion'');

    figure,imshowpair(BW,BW2,''montage'');

    title(''Original  with Dilation'');

    ```


    Once the code is run, the outputs shown in Figure [10-32](#483991_1_En_10_Chapter.xhtml#Fig32)
