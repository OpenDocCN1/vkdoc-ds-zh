    radius of the circle should be manually entered through the GUI.

    - **12.2.** Create a GUI that has two options, such as sine and cosine, for plotting
    the graph of the trigonometric functions for the values of `x`, where `x` is between
    `0` and `π`. After the user clicks the `Plot` button, the GUI should plot the
    graph.

    - **12.3.** Create a GUI that performs as a basic calculator with the four basic
