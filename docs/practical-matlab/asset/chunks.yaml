    ## 快速傅里叶变换


    我们已经在上一节关于周期函数的内容中学习了傅里叶级数。当处理非周期信号时，我们需要了解傅里叶变换方法。傅里叶变换将时间序列与频率序列配对。快速傅里叶变换 (FFT)
    是处理离散傅里叶变换 (DFT) 的一种更好方法。然而，在理解 FFT 之前，我们将先了解傅里叶变换的定义。


    ### 备注 9-4.

    函数 *f*(*t*) 的连续时间傅里叶变换定义为：


    ![$$ F(k)={\int}_{-\infty}^{\infty }f(t){e}^{-2\pi ikt} dt,k\in R $$](img/483991_1_En_9_Chapter_TeX_Equ23.png)


    (23)


    ![$$ f(t)={\int}_{-\infty}^{\infty }F(k){e}^{2\pi ikt} dk $$](img/483991_1_En_9_Chapter_TeX_Equ24.png)


    (24)


    其中 `F(k)` 可以通过使用逆傅里叶变换得到。如果方程式 23 的结果收敛，则信号 *f*(*t*) 存在傅里叶变换。逆傅里叶变换将频率序列映射回相应的时间序列。


    ### 备注 9-5.

    时间有限序列 `f[t]`（其中 0 ≤ *t* ≤ *N* − 1）的 DFT 定义为：


    前向 DFT ![$$ F\left[r\right]=\sum \limits_{n=0}^{N-1}f\left[t\right]{e}^{\frac{-2\pi
    jnr}{N}},0\le r\le N-1 $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_IEq8.png)
    (25)


    逆 DFT ![$$ f\left[t\right]=\frac{1}{N}\sum \limits_{n=0}^{N-1}F\left[r\right]{e}^{\frac{-2\pi
    jnr}{N}},0\le k\le N-1 $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_IEq9.png)
    (26)


    尽管方程式 23 和 24 看起来很复杂，但只需代入欧拉方法，即 `e^(ix)` = `cos(x) + isin(x)`，我们就可以让它们变得简单得多，类似于傅里叶级数。


    FFT 是一种能以更优方式求解序列的 DFT 的算法。该算法由 James W. Cooley 和 John W. Tukey 于 1965 年共同开发。Cooley
    和 Tukey 利用了周期正弦波的特性。换句话说，部分计算会出现重复。通过节省这些计算成本，他们减少了所需时间，并获得了一种更好的算法。


    对于长度为 *n* 的信号，使用 DFT 的时间复杂度（处理 *n* 个样本所需的时间）是 `O(n²)`。而 FFT 的复杂度优于 DFT，为 `O(nlog(n))`。


    在 MATLAB 中，使用 `fft` 函数来计算 FFT。由于索引从 1 开始，而不是 0，因此方程式 25 和 26 中求和符号的边界是从 *n* =
    1 到 *N*。


    ### 示例 9-9.

    编写代码，将 `fft` 应用于函数 `x`，其中 `x = sin(2πt)`，0 ≤ *t* ≤ 1。该代码应为 `t` 生成 100 个样本，并且向量
    `x` 的长度应为 512。该代码应在屏幕上绘制 `x` 的图形和功率谱。


    ### 解决方案 9-9.

    以下代码可用于完成给定的任务。


    *Example9p9.m*


    ```

    %Example9p9

    %This code works with fft

    Fs = 100; % Sampling frequency

    t=linspace(0,1,Fs);

    x = sin(2*pi*t);

    Nfft = 512; % Length of FFT

    X = fft(x,Nfft);

    % FFT is symmetric, take half

    X = X(1:Nfft/2);

    % Frequency vector

    f = (0:Nfft/2-1)*Fs/Nfft;

    figure(1);%for graph of sine

    stem(t,x);grid on;

    title(''Signal of Sine Wave'');

    xlabel(''Time'');

    ylabel(''Amplitude'');

    figure(2); % for power spectum

    plot(f,abs(X));grid on;

    title(''Power Spectrum'');

    ylabel(''Power'');

    xlabel(''Frequency'');

    ```


