- fmt: '# Creating Functions


    When writing a complex program, you might need to create your own functions. Actually,
    none of the programming languages offers a complete built-in function library
    for all kinds of problems. Therefore, specific functions can be created for specific
    purposes to make the programmer’s job easier.


    Some user-defined functions return a single value, whereas some others return
    multiple values. A function might not even return any value. In this chapter,
    we present such types of functions.


    **Example 2-15.** Write a function that prints the square of the number entered
    by the user. The program should also check whether a number is passed to the function.


    **Solution 2-15.** To create a function, first we need to satisfy the requirements
    by writing the necessary parts of a function in an editor. We can check the number
    of inputs by using the `nargin` function to make sure that a number is entered
    by the user. The following code can be used to do that.


    *Example2p15.m*


    ```

    function [ Result ] = Example2p15( Number )

    %Example2p15

    %This code accepts ant input

    Checking_if_numeric = isnumeric (Number );

    if Checking_if_numeric == 0 || nargin ~=1

    error(''Just A NUMBER'');

    end

    Result = Number^2;

    end

    ```


    The name of the function is the same as the name of the file, `Example2p15`. The
    function accepts only a single numerical value. This function has an output defined
    as `Result`, and an input defined as `Number`.


    After the program is executed, a logical variable, `Checking_if_numeric`, gets
    either 0 or 1. If the number is numeric, then 1 is assigned to the logical variable
    `Checking_if_numeric`, 0 otherwise. In the fifth row of the code, the line checks
    if the variable is zero, meaning that if it is not a number, or the number of
    inputs is different from 1, then the computer prints the error message, which
    is placed within the `error` function. In MATLAB, the `||` symbol is a logical
    `or` operator.


    We will test both error and calculation cases from the command window. If we call
    the saved function from the command window, and enter a number, such as 5, we
    obtain the following output.


    ```

    > My_udf(5)

    ans =


    >

    ```


    If we run the program for a second time, and pass a string such as `G` to the
    function, we obtain the following output.


    ```

    > Example2p15(8,4)

    Error using Example2p15

    Too many input arguments.

    >

    ```


    In some cases, we might need to get more than one output from our function as
    shown in the following example.


    **Example 2-16.** Write a program that calculates the perimeter, area, and volume
    for a radius entered by the user.


    **Solution 2-16.** The number of outputs should be three. The program is given
    here.


    *Example2p16.m*


    ```

    function [Perimeter,Area,Volume] = Example2p16(radius)

    %Example2p16

    %This function may print 3 outputs

    Perimeter = 2*pi*radius;

    Area = pi*(radius^2);

    Volume = (4/3)*pi*(radius^3);

    ```


    If we run the code from command window, we obtain the following result.


    ```

    > [perimeter,area,volume]=Example2p16(10)

    perimeter =

    62.8319

    area =

    314.1593

    volume =

    4.1888e+03

    >

    ```


    As it is seen, there are three outputs specified. If the outputs are not specified,
    only the first output is displayed.


    ## Local and Global Variables


    The variables that are defined inside a function are called *local variables.*
    Local variables are valid only inside the function, meaning that they are not
    saved into the workspace. To make these variables available outside the function,
    we need to add `global` to the left of the variables to define them as global.
    If you define a function inside another function and use a variable in both functions,
    again, that variable should be defined as a global variable in both functions.
    However, many professional programmers recommend avoiding global variables. Instead,
    passing values to the functions is recommended.


    **Example 2-17.** Write a program that shows the differences between using a global
    variable inside and outside a function.


    **Solution 2-17.** The following code can be used to accomplish the given task.


    *Example2p17.m*


    ```

    %Example2p17

    %This code uses local and global variables.

    Numb1 = 61; %this is global variable

    fprintf("Variable outside :%i\n", Numb1)

    MyFunction();%function is called

    fprintf("Variable outside :%i \n", Numb1)

    function MyFunction

    Numb1 = 55; %this is local variable

    fprintf("Variable inside :%i\n", Numb1)

    end

    ```


    Once the code is executed, the following output results.


    ```

    > Example2p17

    Variable outside :61

    Variable inside :55

    Variable outside :61

    >

    ```


    As shown in the code, the global variable `Numb1` is defined outside the function
    and printed as 61. Once it is called by the `MyFunction` function, then the same
    variable is defined as and printed as 55 as well. After exiting the function,
    its value stays as it was as 61.


    ## Creating Subfunctions


    It is possible to create a file that includes all user-defined functions. The
    first function is defined as the main or primary function. The rest of the functions
    can be called from the main function to execute the corresponding tasks. Other
    functions included in the primary function are called subfunctions. To avoid confusion,
    the name of the primary function and the name of the saved code should be identical.


    **Example 2-18.** Write a function to calculate the volume of a cylinder using
    a subfunction. The radius and the height of the cylinder should be passed to the
    function by the user.


    **Solution 2-18.** The code can be written as shown in the following m-file.


    *Example2p18.m*


    ```

    function Example2p18(Radius,height)

    %Example2p18

    % This PRIMARY FUNCTION calculates

    % the volume of a cylinder

    radius_sq = R_square(Radius);

    Result = pi*height*radius_sq;

    fprintf(''The volume is %f\n'',Result);

    end

    function [r_sq]=R_square(Radius)

    r_sq= Radius^2; %Sub-function

    end

    ```


    As shown, the output of the primary function is not defined. Instead, the result
    is printed on the screen by the body part of the primary function.


    The second function used in the program is an example of a subfunction. Once the
    program is executed, the following output will be shown.


    ```

    > Example2p18(4,10)

    The volume is 502.654825

    >

    ```


    ## Anonymous Functions


    Anonymous functions are the functions that are not stored in a separate file.
    These functions are part of a program associated with one or more variables in
    the file. Anonymous functions possess the `function_handle` data type in MATLAB.


    These functions involve the `@` symbol in their definitions. The `Sqr` function,
    given by `Sqr = @(x) sqrt(x)`, is an example of an anonymous function. The `@`
    symbol tells MATLAB that `Sqr` is a function.


    **Example 2-19.** Write a function that takes an input composed of two numbers
    and calculates their product by using an anonymous function. The product of the
    numbers should be printed on the screen.


    **Solution 2-19.** The following code can be used for this purpose.


    *Example2p19.m*


    ```

    function [Output] = Example2p19(x,y)

    %This is Example2p19

    %This function has an anonymous func.

    Multip = @(x,y) x*y;

    Output =Multip(x,y);

    ```


    After running the code, the following output will be obtained.


    ```

    > Example2p19(5,6)

    ans =


    >

    ```'
