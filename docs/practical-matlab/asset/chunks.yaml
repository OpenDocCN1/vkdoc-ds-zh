- fmt: '# Bacterial Growth and Population Models


    Bacterial growth or a simulation of a population can be modeled using differential
    equations. Ideally, bacterial growth can be represented as ![$$ \frac{dN}{dt}=\alpha
    N $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_IEq1.png), where
    *N* is the number of cells at the time *t* and ***α*** is the growth rate constant.
    This model is a first-order differential equation model that has the solution
    *N* = *N*[0] ∗ *e*^(*αt*) where *N*[0] is the initial condition. For numerical
    solutions, MATLAB''s ODE solvers can be used. The equation can be used to model
    population as well.


    **Example 8-1.** For ![$$ \frac{dN}{dt}=0.1\ast N $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_IEq2.png),
    where *N* represents the number of bacteria cells, write code to plot a graph
    of the growth of the number of bacteria cells. The initial number of cells is
    100, and the time is from 1 to 20. The code should plot the numerical solution
    by using `ode45` solver as well. Both exact and numerical solutions should be
    shown for the same figure.


    **Solution 8-1.** The following code can be used to accomplish the given task.


    `Example8p1.m`


    ```

    %Example8p1

    %This code solves first-order ODE

    %which models Bacterial Growth

    clear all;close all;

    time=0:0.1:20;

    Alpha=0.1;% Grow Rate

    N_0=100;%initial condition

    N=N_0*exp(Alpha*time); %Exact Solution

    [x,y]=ode45(@MyFunc,[0,20],100);

    plot(time,N,x,y,''ro'');

    xlabel(''time:t'');title(''Population Changes'');

    ylabel(''Population'');grid on;

    function Out=MyFunc(x,y)

    Alpha=0.1;

    Out=Alpha*y;

    end

    ```


    Once the code is executed, the output shown in Figure [8-1](#483991_1_En_8_Chapter.xhtml#Fig1)
    is obtained.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig1_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Analytical and numerical solutions


    In Figure [8-1](#483991_1_En_8_Chapter.xhtml#Fig1) the red circles shows the numerical
    solution and the blue line represents the exact solution. They are very close
    to each other, which gives us some idea about how the change occurs.


    One might question the reason for finding numerical solutions as shown here. In
    some cases, you might not know the exact or analytical solution of the question.
    There might be even no solution for a question. In such cases, you might need
    to know what the solution looks like. In this regard, you can use numerical methods
    or solutions to find an answer to your question up to a certain level of accuracy.
    Due to the imprecision of the solution, numerical solutions are sometimes called
    approximated solutions.


    The differential equation,


    ![$$ \frac{dN}{dt}= rN\left(1-\frac{N}{K}\right) $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ1.png)


    (1)


    is called *logistic growth* or a *logistic equation* where *K* is the environmental
    capacity and *r* is the rate of increase. This model can be used for bacterial
    growth, or a population model. The solution of this logistic equation is ![$$
    N(t)=\frac{K{N}_0}{N_0+{e}^{- rt}\left(K-{N}_0\right)} $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_IEq3.png).


    **Example 8-2.** Write code to solve the logistic equation with *K* = 100, *r*
    = 0.1, *N*[0] = 2, and time from 1 to 100. The code should animate the analytical
    solution. Then, both numerical and analytical solutions should be plotted on the
    same figure.


    **Solution 8-2.** The following code can be used to accomplish the given tasks.


    `Example8p2.m`


    ```

    %Example8p2

    %This code solves logistic equation

    clear all;close all;

    K=500;% environmental capacity

    N0=2;% Initial population size

    r=0.1;% growth rate

    time=linspace(1,100,100);

    %N=zeros(1,length(time));

    % analytic (exact) solution

    for i=1:length(time) % Animation part

    N(i)=K/(1+(K/N0-1)*exp(-r*time(i)));

    plot(N,''b'');

    drawnow

    end

    [Tode,Node]=ode45(@lge,[1 100],2);

    plot(time,N,Tode,Node,''r'');

    xlabel(''Time'');title(''Population Changes'');

    ylabel(''Population'');grid on;

    legend(''Analytical Solution'',...

    ''Numerical Solution'');

    function dN=lge(T,N)

    r=0.1;

    K=500;

    dN=r.*N.*(1-N/K);

    end

    ```


    Once the code is executed, we obtain the output shown in Figure [8-2](#483991_1_En_8_Chapter.xhtml#Fig2).


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig2_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Graph of logistic growth


    ## Host–Parasitoid Models


    A parasitoid is an organism that lives very close to its host to benefit from
    it. Parasitoids and their hosts generally take advantage of each other. The *Nicholson-Bailey
    model* is a discrete time model used to simulate a host–parasitoid relationship.


    ![$$ \left\{\begin{array}{c}{H}_{t+1}=r{H}_t\exp \left(-a{P}_t\right)\kern2.25em
    \\ {}{P}_{t+1}=e{H}_t\left(1-\exp \left(-a{P}_t\right)\right)\end{array}\right.
    $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ2.png)


    (2)


    In Equation [2](#483991_1_En_8_Chapter.xhtml#Equ2), *H*[*t*] stands for the density
    of host species and *P*[*t*] stands for density of parasitoid organisms in generation
    *t.* Also *r* is the number of eggs laid by the host, *e* is the number of eggs
    laid by the parasitoid, and *a* is proportionality constant.


    **Example 8-3.** Write code to simulate the Nicholson-Bailey model. The initial
    populations for host and parasitoid are 22 and 10, respectively. The number of
    generation is 25. The coefficients are *e* = 1, *a* = 0.0069, and *r* = 2.


    **Solution 8-3.** The following code can be used to accomplish the given task.


    `Example8p3.m`


    ```

    %Example8p3

    %This code solves Nicholson-Bailey model

    clear all;close all;

    e=1; a=0.069; r=2;

    Ngens=25;  %number of generations

    time=1:1:Ngens;

    H=zeros(1,Ngens); P=zeros(1,Ngens);

    P(1)=10; H(1)=22;%initial conditions

    for t=1:Ngens-1

    H(t+1)=r*H(t)*exp(- a*P(t));

    P(t+1)=e*H(t)*(1-exp(-a*P(t)));

    end

    plot(time,H,''r'',time,P,''b'');

    legend(''Host'',''Parasitoid'');

    xlabel(''Generation t'');ylabel(''Population'');

    title(''Nicholson-Bailey Model'');grid on;

    ```


    Once the code is executed, we obtain the output shown in Figure [8-3](#483991_1_En_8_Chapter.xhtml#Fig3).


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig3_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Graph of Nicholson-Bailey model


