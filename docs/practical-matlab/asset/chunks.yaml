    **Example 11-3.** Write a program that loads the `handel` audio file to the workspace.
    Then the program should save the file as `handel.flac` in the directory. The code
    should add some information to the file. In the comment field, the sound file
    should display “This is my first audio,” in the title field “Hallelujah,” and
    in the artist field “San Antonio.” The bits per sample should be 24. The code
    should play the sound and display the information for the saved file.


    **Solution 11-3.** The following code can be written to accomplish these tasks.


    *Example11p3.m*


    ```

    %Example11p3

    % This code saves an audio file with info

    load handel

    filename = ''handel.flac'';

    audiowrite(filename,y,Fs,''BitsPerSample'',24,...

    ''Comment'',''This is my first audio'',...

    ''Title'',''Hallelujah'',''Artist'',''San Antonio'');

    sound(y,Fs);

    clear y Fs

    info = audioinfo(filename);

    disp(info);

    ```


    In the code shown, the `sound` function plays the vector `y` as sound. The function
    `audiowrite` writes the sound with the defined features to the directory. Once
    the program is run, the following output appears in the command window.


    ```

    >Example11p3

    Filename: ''C:\...\handel.flac''

    CompressionMethod: ''FLAC''

    NumChannels: 1

    SampleRate: 8192

    TotalSamples: 73113

    Duration: 8.9249

    Title: ''Hallelujah''

    Comment: ''This is my first audio''

    Artist: ''San Antonio''

    BitsPerSample: 24

    >

    ```


    The played vector can have values between negative one and positive one. For other
    data types, the ranges are shown in Table [11-1](#483991_1_En_11_Chapter.xhtml#Tab1)
    and the maximum number of channels is listed in Table [11-2](#483991_1_En_11_Chapter.xhtml#Tab2).


    Table 11-2


    Maximum Number of Channels Depending on Data


    | File Format | Maximum Channels |

    | --- | --- |

    | WAVE (`.wav`) | 1,024 |

    | OGG (`.ogg`) | 255 |

    | FLAC (`.flac`) | 8 |

    | MPEG-4 AAC (`.m4a`, `.mp4`) | 2 |


    Table 11-1


    Range for y Depending on Its Data Type


    | Data Type of y | Range of y |

    | --- | --- |

    | uint8 | 0 ≤ `y` ≤ 255 |

    | int16 | -32768 ≤ `y` ≤ +32767 |

    | int32 | -2^31 ≤ `y` ≤ 2^31–1 |

    | single | -1.0 ≤ `y` ≤ +1.0 |

    | double | -1.0 ≤ `y` ≤ +1.0 |


    **Example 11-4.** Write code that loads the `handel` file to play. After playing
    for 3 seconds the file should stop playing and then resume. It should then play
    for 3 more seconds, and then stop.


    **Solution 11-4.** The following code can be written to accomplish these tasks.


    *Example11p4.m*


    ```

    %Example11p4

    % This code pauses and resumes playing

    load handel;

    player = audioplayer(y, Fs);

    play(player);disp(''playing is on'');

    pause(3);

    pause(player);disp(''playing is paused'');

    pause(3);

    resume(player),disp(''playing is resumed'');

    pause(3);

    stop(player),disp(''playing is off'');

    ```


    In this code, the `play` function starts the object `player` at the beginning.
    Then the `pause` function pauses the audio after 3 seconds of playing. The same
    `pause` function holds for 3 more seconds. The `resume` function resumes the playing
    and the program holds for another 3 seconds. Finally, the `stop` function stops
    playing the object. Once the code is run, the following output appears in the
    command window.


    ```

    > Example11p4

    playing is on

    playing is paused

    playing is resumed

    playing is off

    >

    ```


    **Example 11-5.** Write code that loads `handel` file to the workspace. Then the
    code should reverse the audio and play it in the reversed order. The code also
    should print the first five data of the original audio, and the last five data
    of the reversed audio to check their accuracy.


    **Solution 11-5.** The following code can be written to accomplish these tasks.


    *Example11p5.m*


    ```

    %Example11p5

    % This code reverses the hallelujah

    load handel;

    L=length(y);

    y2=zeros(L,1);

    for i=1:L

    y2(L-i+1)=y(i);

    end

    sound(y2,Fs);

    disp(''First 5 Data of Original Handel'');

    disp(y(1:5));

    disp(''Last 5 Data of Reversed Handel'');

    disp(y2(end-4:end));

    ```


    In this code, after loading `handel`, the length of `y` data is stored to the
    `L` variable. Then, a new variable `y2` is initialized as having all zero elements.
    Then the values of `y` are stored in the `y2` variable in reversed order. The
    code then plays the new data and displays the required data on the screen. Once
    the code is run, the following output appears in the command window.


    ```

    > Example11p5

    First 5 Data of Original Handel


    -0.0062

    -0.0750

    -0.0312

    0.0062

    Last 5 Data of Reversed Handel

    0.0062

    -0.0312

    -0.0750

    -0.0062


    >

    ```'
