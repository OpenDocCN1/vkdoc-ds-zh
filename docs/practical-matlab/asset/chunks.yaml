    # 8. 计算生物学


    计算生物学是应用科学的一个分支，它结合了理论方法、数学建模和计算机科学的应用，以解决生物、生态、社会和行为的各种问题。在本章中，我们将看到一些使用 MATLAB
    代码编写的应用实例。通过几个例子说明了细菌生长和种群模型。然后，介绍了包括寄主-寄生蜂模型、生物信息学、捕食者-猎物模型和流行病模型等主题。

