    # 11. Introduction to Sound Processing


    It is possible to record, listen to, or manipulate sounds or audio files in MATLAB.
    This chapter introduces some basic features that are used with audio files, including
    using sine function as a sound. Using the Audio toolbox and other toolboxes, sophisticated
    illustrations can be achieved. In this chapter, though, the examples presented
    take into account that the reader might not have these toolboxes installed on
    MATLAB.


    Sound propagates in the form of waves in the air. Sound is a continuous signal
    that can be digitalized as a discrete signal. Sound waves are recorded with a
    frequency that is the number of samples taken generally per second and measured
    in Hertz (Hz). Sounds with frequencies between 20 and 20,000 Hz comprise the hearing
    range for human beings.


    To record and listen to a sound file, a microphone and a speaker should be installed
    on the system. To determine whether you have these devices, type the command `audiodevinfo`
    at the prompt.


    ```

    > info = audiodevinfo

    info =

    input: [1x2 struct]

    output: [1x2 struct]

    >

    ```


    In that code, the variable `info` is a construction having two fields. To visualize
    the content of `info` for the first data, you can type the following at the prompt.


    ```

    > openvar info.input

    ```


    Then, the window shown in Figure 11-1 opens.


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig1_HTML.jpg](images/483991_1_En_11_Chapter/483991_1_En_11_Fig1_HTML.jpg)


    Figure 11-1 Microphone information


    If your operating system has a language other than English, you might see output
    similar to that shown in Figure 11-1. This display indicates that we have a microphone
    to record sound in MATLAB. To do that, we use the function `audiorecorder`. Using
    `audiorecorder`, we can create an 8,000 Hz, 8-bit, 1-channel audiorecorder file.
    It is also possible to change these default values. Possible numbers of bits include
    8, 16, and 24. The number of channels should be either 1 (mono) or 2 (stereo).


    **Example 11-1.** Write a program that loads the audio file `handel` to the workspace.
    Then, the program should play the sound.


    **Solution 11-1.** The following code can be used to accomplish the given task.


    *Example11p1.m*


    ```

    %Example11p1

    %This code plays hallelujah

    load handel;

    p = audioplayer(y, Fs);

    play(p)

    ```


    As shown, once the `handel` file is loaded, variables of `y` and `Fs` are loaded
    into the workspace. The variable `y` is the played signal, and `Fs` is the sample
    rate. The `audioplayer` function creates an `audioplayer` object for the signal
    `y`, and that object is assigned to the variable `p`. Then in the final row, using
    the command `play`, the `p` variable that has the sound is played.


    To find information about a sound file, such as number of samples, number of channels,
    and so on, you can use the `audioinfo` as illustrated here.


    ```

    > info = audioinfo(''Adele.mp3'')

    info =

    struct with fields:

    Filename: ''C:\...\Adele.mp3''

    CompressionMethod: ''MP3''

    NumChannels: 2

    SampleRate: 44100

    TotalSamples: 12569472

    Duration: 285.0220

    Title: ''Someone Like You''

    Comment: []

    Artist: ''Adele''

    BitRate: 192

    >

    ```


    **Example 11-2.** Write a program that records your voice for 8 seconds with a
    sampling rate of 22,050 Hz, 16 bits with 2 channels. Then, the program should
    play the recorded sound and plot the graph of the recorded file.


    **Solution 11-2.** The following code can be written to accomplish these tasks.


    *Example11p2.m*


    ```

    %Example11p2

    % This records your voice for 8 seconds.

    RecorderVar = audiorecorder(22050, 16, 2);

    disp(''Start speaking now'')

    recordblocking(RecorderVar, 8);

    disp(''End of Recording'');

    play(RecorderVar); % Playing

    % Store data in double-precision array.

    RecordData = getaudiodata(RecorderVar);

    plot(RecordData); % plotting the sound

    ```'
