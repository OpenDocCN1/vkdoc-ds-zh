    In MATLAB, the `fft` function is used to calculate FFT. Because indexing starts
    with 1, not 0, boundaries in the summation symbol for both Equations 25 and 26
    are from *n* = 1 to *N.*


    **Example 9-9.** Write code that applies `fft` to function *x* where *x* = sin(2*πt*),
    0 ≤ *t* ≤ 1, The code should generate 100 samples for *t*, and the length of vector
    *x* should be 512\. The code should plot the graph of *x*, and power spectrum
    on the screen.


    **Solution 9-9.** The following code can be used to accomplish the given task.


    *Example9p9.m*


    ```

    %Example9p9

    %This code works with fft

    Fs = 100; % Sampling frequency

    t=linspace(0,1,Fs);

    x = sin(2*pi*t);

    Nfft = 512; % Length of FFT

    X = fft(x,Nfft);

    % FFT is symmetric, take half

    X = X(1:Nfft/2);

    % Frequency vector

    f = (0:Nfft/2-1)*Fs/Nfft;

    figure(1);%for graph of sine

