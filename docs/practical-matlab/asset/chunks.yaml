- fmt: '### break and continue


    In some cases, a loop might need to be terminated once a condition is tested.
    In such cases, the `break` command is used, which terminates the closest loop
    and gets out of it.


    **Example 2-12.** Write a program that plays a “Guess the Number” game. The user
    should guess the number between 1 and 100 where the number is picked randomly
    by the program. The user will then be guided by the computer to guess either a
    larger or a smaller number. Finally, the program should print the number that
    was guessed correctly.


    **Solution 2-12.** The following code can be used.


    `Example2p12.m`


    ```

    %Example2p12

    %A Guessing game with break command

    Limit=100;%Can be changed

    Picked_Number=randi(Limit,1);

    Counter=1; %initializing counter

    Gues=input(''Enter your guess\n'');

    while true

    if Gues==Picked_Number

    fprintf(''Got it in your %d th try\n'',Counter);

    break;

    elseif Gues>Picked_Number

    Gues=input(''Enter a SMALLER number\n'');

    elseif Gues<Picked_Number

    Gues=input(''Enter a BIGGER number\n'');

    end

    Counter=Counter+1;

    end

    ```


    In the code given, a `true` statement is written next to the `while` command.
    In MATLAB, `true` is a logical variable that always has a value of 1. By writing
    `while true` in the seventh row of the program, we want the program to keep running
    until the selected number is guessed by the user. If the guessed number is equal
    to the number that the computer picked, then the number of tries is printed and
    the loop is terminated by the `break` command.


    Once we run the code, the following output will be shown.


    ```

    > Example2p12

    Enter your guess


    Enter a SMALLER number


    Enter a SMALLER number


    Enter a SMALLER number


    Enter a SMALLER number


    Enter a BIGGER number


    Got it in your 6 th try

    >

    ```


    The `continue` command is used to redirect the code. Unlike with the `break` command,
    the program continues to work without terminating the closest loop.


    **Example 2-13.** Write a program that asks for the user to enter three positive
    numbers to calculate its square root. If the entered number is negative, it shows
    a message indicating that the number should be positive.


    **Solution 2-13.** The following code can be used for this problem.


    `Example2p13.m`


    ```

    %Example2p13

    %This code uses continue command

    Counter = 3;

    while Counter>0

    Number = input(''Enter a number\n'');

    if Number<0

    fprintf(''The number should be positive\n'');

    continue;

    end

    fprintf(''Square root of %d is =%d\n'',...

    Number,sqrt(Number));

    Counter = Counter-1;

    end

    ```


    The following output will be obtained once this code is executed.


    ```

    > Example2p13

    Enter a number


    The number should be positive

    Enter a number


    Square root of 3 is =1.732051e+00

    Enter a number


    Square root of 9 is =3

    Enter a number


    Square root of 4 is =2

    >

    ```


    As shown in the output, if a negative number is entered, the `Counter` is not
    decreased, and the program keeps asking for a new number. After entering three
    numbers, the program stops.


    ### try-catch Block


    While running code, unexpected circumstances or errors might occur. To overcome
    this obstacle and take the necessary actions, the `try-catch` block is used. This
    block is composed of two parts. The first part is followed by `try` and the second
    part is followed by the `catch` statement.


    ```

    try

    statement

    catch

    statement

    end

    ```


    Whatever is written in the `try` statement is regarded as a regular code written
    in the editor or at the prompt. When an error occurs in this part, the rest of
    the code within the `try` part is terminated and MATLAB jumps to the `catch` part.
    This second part is where the user plans to write the alternatives or explanations
    in the case of getting an error in the first part.


    **Example 2-14.** Write a program that tries to multiply two numbers. The program
    should call a function for the multiplication that is not defined. The code should
    give a warning if something goes wrong.


    **Solution 2-14.** The following code can be used to accomplish the given task.


    `Example2p14.m`


    ```

    %Example2p14

    %This code uses try-catch block

    try

    M1=10;

    M2=20;

    Multp = CallFunctionToMultiply(M1,M2);

    fprintf("Multiplication is %f\n",Multp);

    disp("Everything was smooth")

    catch

    warning(''Something is wrong'');

    end

    ```


    Obviously, the program will call the `CallFunctionToMultiply(M1,M2)` function
    for calculation. User-defined functions are examined in the next section. Here,
    though, because the function is not defined, the program will give the warning
    written in the `warning` function. The following output will be obtained once
    the code shown earlier is executed.


    ```

    > Example2p14

    Warning: Something is wrong

    > In Example2p14 (line 10)

    >

    ```


    ## User-Defined Functions


    Users are allowed to define functions for specific purposes. To define a function
    in MATLAB, the program must be created within an m-file. In general, user-defined
    functions are saved as a single m-file to be used for later purposes.


    In a user-defined function, the first line should start with the command `function`,
    generally followed by square brackets including one or more output variables,
    the function name, and parentheses including one or more input variables. The
    structure of the user-defined functions can be summarized as follows: In a user-defined
    function, the command `function` and the name to be assigned are sufficient to
    create a function. Functions generally end either with `end` statements placed
    as a final line, or with the definition of another subfunction. Although a user-defined
    function might occasionally work without the `end` statement, for better readability,
    using it as the last line of the code is recommended.


    ```

    function [ output_variables ] = function_name( input_variables )

    code to be executed

    end

    ```


    As mentioned earlier, the output variables should be between square brackets and
    the input variables should be enclosed within parentheses. The function name should
    be identical to the name of the saved file.


    Beginning from the second half of 2016, with the R2016b version, another important
    feature has been incorporated into MATLAB that allows user-defined functions to
    be added at the end of the code within the same file. This new structure can be
    summarized as follows.


    ```

    a piece of code

    function function1

    code to be executed

    end

    function function2

    code to be executed

    end

    ```'
