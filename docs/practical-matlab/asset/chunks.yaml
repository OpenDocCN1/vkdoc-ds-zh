    *This book is dedicated to the lovers of MATLAB.*


    Introduction


    This book emerged as a result of programming lecture notes, experiences gathered
    from different computational algorithms, and reading about mathematical models
    of real-life problems. The purposes of this book are to introduce and teach MATLAB
    as a programming language and apply the programming concepts to computational
    models in finance, numerical methods, simulation of randomness, analyzing data
    with basic statistics, visualization and animation, computational biology, signal
    processing, image processing, and sound processing. Apart from these illustrations,
    the book teaches how to create applications with graphical user interfaces (GUIs).


    The intended audiences of this project are people who want to learn MATLAB as
    a programming language, users of MATLAB who want to excel in problem solving,
    and advanced users of the language looking to prepare applications with GUIs.


    The book has two parts. In the first part, the general concepts of the language
    such as variables, data types, and common built-in functions are explained. Besides
    these topics, fundamentals of the language such as algorithms, m files, selection
    structures, loops, and user-defined functions are presented. In the second part
    of the book, I illustrate solving problems from different areas. In the examples,
    the algorithmic approach is explained when necessary. Every new item, whether
    it is a function or a command, is explained so that the reader can understand
    the subjects and does not miss anything new.


    This product can be used as a textbook, or as supplemental material for undergraduate
    or low-level one-semester graduate courses in colleges or universities. These
    courses might include but are not limited to computer programming with MATLAB,
    science and engineering problem solving with MATLAB, scientific computing, and
    mathematical modeling with MATLAB. The first part of the book should be taught
    in such courses. The chapters do not depend on each other in the second part of
    the book. Therefore, topics from the second part can be selected freely depending
    on the needs of the class. Prior to learning the content of this book, knowledge
    of mathematics at the precalculus level helps to understand the modeling concepts,
    so this is recommended as a prerequisite to taking this course. Although a background
    in any programming language might help to grasp the algorithms used in the examples,
    it is not a prerequisite. The book is also a practical resource and textbook for
    individual learners. It provides 152 illustrative and instructive examples including
    the solutions along with the codes.


    Source code for this book is accessible via the Download Source Code button located
    at [`www.apress.com/9781484252802`](http://www.apress.com/9781484252802) .


    Acknowledgments


    I would like to mention and thank a few people who helped me in the preparation
    of this book. I especially thank Steve Anglin, Associate Editorial Director of
    Apress, who allowed me the honor of authoring this book. I also gratefully thank
    Mark Powers, Editorial Operations Manager of Apress, who helped me and guided
    me in bringing this product to life. I also thank Matthew Moodie, Lead Development
    Editor at Apress, for being a part of this team, and Karpur Shukla, the reviewer
    of this project. I would like to thank my primary PhD supervisor, Associate Professor
    Dr. Maksat Ashyraliyev from the Software Engineering Department of Bahcesehir
    University, for his priceless contributions to my skills. Finally, thanks go to
    my friend and colleague Ibrahim Emre Celikkale for his recommendations.


    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Introduction to MATLAB


    MATLAB is an abbreviation for the expression Matrix Laboratory. It has been widely
    used in many kinds of applications and fields of study. MATLAB is a high-level
    language, the reputation of which has been increasing over time. Since its first
    use in 1970 by Cleve Moler, a famous mathematician and cofounder of MathWorks,
    Inc. (the owner of MATLAB), it has shown huge advancement and new tools have been
    added in the new versions released twice a year.


    Due to the fact that it has a remarkable number of toolboxes, MATLAB attracts
    many users from a variety of different areas ranging from engineering to applied
    sciences. MATLAB has a large number of built-in functions that make the programmer’s
    job easier when it comes to solving problems. Although it is used primarily for
    technical computing and addresses toolbox-oriented jobs, MATLAB carries a very
    practical and easy programming language aspect, as well. One of the important
    goals of this book is to emphasize the programming language aspect of this powerful
    software.


    MATLAB possesses tools that satisfy the programmer’s needs in many applications.
    Even, these days, specific tasks often require specific software. However, MATLAB
    can suit programmers’ demands in most cases.


    The MATLAB prompt displays as a double greater sign (>>) in the command window.
    Due to the trademark and logo usage guidelines of MathWorks, Inc., the ∎> symbols
    will be used together throughout this book to represent the MATLAB prompt.


    In this chapter, you will learn the necessary concepts of coding of the language
    when it comes to solving real-life applications.'
