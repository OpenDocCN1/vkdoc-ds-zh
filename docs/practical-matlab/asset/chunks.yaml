    ## Numerical Differentiation


    In this section, numerical methods for solving ordinary differential equations
    are discussed.


    ### Ordinary Differential Equations


    Numerical solution of ordinary differential equations has important applications
    in a wide variety of areas in engineering and applied sciences. MATLAB provides
    numerous built-in functions that solve ordinary differential equations with an
    initial condition.


    Ordinary differential equations (ODEs) with initial values can also be solved
    using Euler’s method and the Runge–Kutta method. This section covers how to solve
    initial value problems of ODEs using the ODE solvers, Euler’s method, and the
    fourth-order Runge–Kutta method.


    #### ODE Solver Functions


    MATLAB has numerous functions for solving ODEs. Although `ode45` is the first
    one to come to mind, the user should consider the type of the problem (stiff or
    nonstiff) when selecting the solver.


    **Example 4-10.** Write code to solve the following initial value problem given
    by


    ![$$ \frac{dy}{dx}=y-x,y(0)=\frac{2}{3},0\le x\le 5 $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equc.png)


    using the `ode45` solver, where the exact solution is ![$$ y=\left(x+1\right)-\frac{1}{3}{e}^x
    $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq5.png). The code
    should print the solution at x = 5 (y(5)) to the screen.


    **Solution 4-10.** The following code can be used to accomplish the given tasks.


    *Example4p10.m*


    ```

    %Example4p10

    %This code uses ode45 function

    format long

    y = 2.0/3.0; %initial condition

    x0=0; xF =5;

    f = @MyFunc;

    xval = [0,5];% 0<=x<=5

    [t,Result]=ode45(f,xval,y);

    Lengt = length(Result);

    fprintf("ode45 Solution of y(5): %.10f\n", Result(Lengt));

    y_exact = 5.0 + 1.0 - (1.0/3.0)*exp(5.0);

    fprintf("Exact Solution of y(5): %.10f\n",y_exact);

    function Res = MyFunc(x,y)

    Res = y-x; %defined function

    end

    ```


    In the code, the precision is set to show 10 decimal digits and the function `ode45`
    is called by an anonymous function. Once we run the code, the following output
    is displayed on the screen.


    ```

    > Example4p10

    ode45 Solution of y(5): -43.4717851406

    Exact Solution of y(5): -43.4710530342

    >

    ```'
