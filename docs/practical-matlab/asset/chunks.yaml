    # 10. Image Processing


    MATLAB provides very powerful tools to work with graphics and image files, as
    well as for manipulating sounds, audio, and video files. This chapter deals with
    different topics related to image processing. At the beginning, I present the
    types of images. That is followed by discussions on converting image types and
    formats, operations on images, image enhancement, image restoration, color processing,
    image segmentation, and mathematical morphology.


    ## Image Types


    In MATLAB, most images are represented by two-dimensional matrices. In a matrix,
    every element corresponds to a pixel. If an image is composed of *n* × *m* pixels,
    its matrix will also have a size of *n* × *m*. Hence, every single pixel in an
    image corresponds to an element in its matrix representation.


    Let us think of an image that has two dimensions, *n* × *m*. Its corresponding
    matrix will have *n* rows and *m* columns. If we call the matrix *M,* then its
    elements can be represented as shown in Figure [10-1](#483991_1_En_10_Chapter.xhtml#Fig1).


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig1_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig1_HTML.jpg)


    **Figure 10-1** Matrix for a two-dimensional image


    There is a remarkable number of supported image formats in MATLAB. These formats
    include `.bmp`, `.gif`, `.jpg`, `.jpeg`, `.hdf`, `.pcx`, `.png`, `.tiff`, `.xwd`,
    and more.


    In the Image Processing Toolbox in MATLAB®, there are basically four different
    types of images: binary images, grayscale images, indexed images, and truecolor
    (RGB) images.


    ### Binary Images


    Binary images are composed of zeros and ones in their corresponding matrix representations.
    Zero represents the white color, and one represents the black color in the image.
    A binary image is stored as a logical array in the workspace. Figure [10-2](#483991_1_En_10_Chapter.xhtml#Fig2)
    is an example of a binary image.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig2_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig2_HTML.jpg)


    **Figure 10-2** An example of a binary image


    ### Grayscale Images


    Grayscale images are represented by data matrices having various intensity values
    depending on the class of the matrix. Data types might belong to one of the classes
    `uint8`, `uint16`, `int16`, `single`, or `double`. Values for `single` or `double`
    data types range from 0 to 1. For `uint8`, the values range from 0 to 255. For
    `uint16`, the range is between 0 and 65,535. Finally, for `int16`, the values
    range from -32,768 to 32,767. Figure [10-3](#483991_1_En_10_Chapter.xhtml#Fig3)
    is the grayscale version of the same image shown in Figure [10-2](#483991_1_En_10_Chapter.xhtml#Fig2).


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig3_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig3_HTML.jpg)


    **Figure 10-3** An example of a grayscale image'
