    ## Numerical Integration


    MATLAB provides various built-in functions, shown in Table [4-2](#483991_1_En_4_Chapter.xhtml#Tab2),
    to calculate integrals numerically.


    Table 4-3


    Common ODE Solvers in MATLAB


    | Solver | Accuracy | Explanation |

    | --- | --- | --- |

    | ode45 | Medium | Most of the time, this solver should be the first one tried;
    used for nonstiff problems |

    | ode113 | Low to high | Used for nonstiff problems, and when ODE is expensive
    to evaluate |

    | ode15s | Low to medium | Recommended when `ode45` fails, and when solving differential
    algebraic equations for stiff problems |

    | ode15i | Low | Solves fully implicit differential equations for stiff problems
    |


    Table 4-2


    Functions Used in Numerical Integration


    | Function | Explanation |

    | --- | --- |

    | integral | Performs integration by using the global adaptive quadrature |

    | integral2 | Evaluates double integrals numerically |

    | integral3 | Evaluates triple integrals numerically |

    | cumtrapz | Calculates cumulative integrals using the trapezoidal method |

    | trapz | Calculates integrals using the trapezoidal method |


    **Example 4-9.** Write code to numerically calculate the integral of ![$$ 2x{e}^{x^2}
    $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq4.png) from 0 to
