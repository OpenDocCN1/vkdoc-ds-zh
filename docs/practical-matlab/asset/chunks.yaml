    } \boldsymbol{x}}{\boldsymbol{L}}\right)\right). $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ18.png)


    (18)


    Here, *a*[*n*] and *b*[*n*] are called the *Fourier coefficients* where


    ![$$ {\boldsymbol{a}}_{\boldsymbol{n}}=\frac{1}{L}{\int}_{-L}^Lf(x)\mathit{\cos}\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}} dx $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ19.png)


    (19)


    and


    ![$$ {b}_{\boldsymbol{n}}=\frac{1}{L}{\int}_{-L}^Lf(x)\mathit{\sin}\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}} dx $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ20.png)


    (20)


    for *n* = 1, 2, 3, …


    **Example 9-7.** Coefficients of a signal *f*(*x*) as defined in Equations [18](#483991_1_En_9_Chapter.xhtml#Equ18),
    [19](#483991_1_En_9_Chapter.xhtml#Equ19), and [20](#483991_1_En_9_Chapter.xhtml#Equ20)
    are given as *L* = 2, *a*[0] = 0, *a*[*n*] = 0, and ![$$ {b}_{\boldsymbol{n}}=\left\{\begin{array}{c}\frac{4}{n\pi},n\
    is\ odd\\ {}0,n\ is\ even\ \end{array}\right. $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_IEq6.png).
    Calculate the signal *f*(*x*) for *n* = 49 as in Equation [18](#483991_1_En_9_Chapter.xhtml#Equ18).
    Then plot the graphic of the signal *f*(*x*) where −2*π* ≤ *x* ≤ 2*π*.


    **Solution 9-7.** If we plug the given *a*[0], *a*[*n*], and *b*[*n*] into Equation
    [18](#483991_1_En_9_Chapter.xhtml#Equ18), we get the following:


    ![$$ f(x)=\frac{4}{\pi}\left(\mathit{\sin}\frac{\pi x}{2}+\frac{1}{3}\mathit{\sin}\frac{3\pi
    x}{2}+\frac{1}{5}\mathit{\sin}\frac{5\pi x}{2}+\frac{1}{7}\mathit{\sin}\frac{7\pi
    x}{2}+\dots \right) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ21.png)


    (21)


    Therefore, we need to calculate Equation [21](#483991_1_En_9_Chapter.xhtml#Equ21)
    for *f*(*x*) having 49 terms in it. The following code can be used to get the
    graph of *f*(*x*).


    *Example9p7.m*


    ```

    %Example9p7

    %This code plots graph of a signal

    n=49;Point=1000;

    x=linspace(-2*pi,2*pi,Point);

    bn=zeros(1,Point);a0=0*bn;an=0*bn;

    for i=1:2:n

    Calc=(1/i).*sin((i*pi.*x)/2);

    bn = bn + Calc;

    end

    bn=(4/pi)*bn;fx=a0+an+bn;

    plot(x,fx);grid on;axis(''equal'');

    xlabel(''x'');ylabel(''signal'');

    title(''Square Wave Signal'');

    ```


