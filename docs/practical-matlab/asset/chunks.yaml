- fmt: '### Fixed-Point Iteration


    The fixed-point iteration method is generally used for finding the roots of equations
    in the form `f(x) = 0`. From the given equation, the iteration’s function must
    be derived. In this method, the given equation is rewritten in the form `x = g(x)`,
    where `g(x)` is the iteration function. In the algorithm, an initial point `x[0]`
    is selected. Then, the iteration function is recursively processed by `x[n + 1]
    = g(x[n])`. If the function `f` is continuous and `x[n]` converges to a number,
    say `M`, then `M` is a fixed point of the iteration function.


    For a certain function, more than one equation can be picked as the iteration
    function. Converging to a number plays an important role in picking the iteration
    function. To grasp the idea of how to select the iteration function, take a look
    at the following example.


    **Example 4-7.** Considering the function given by `f(x) = x² − x − 4`, find possible
    iteration functions `g(x)` to find the roots of `f(x)`.


    **Solution 4-7.** The iteration function `g(x)` can be selected as follows.


    1.  `g(x) = x² − 4`

    2.  `g(x) = 1 + 4 / x`

    3.  `g(x) = sqrt(x + 4)`


    **Example 4-8.** Write code to find the root of `f(x) = x³ − 3*x + 1` with an
    initial value of 0.5. The code should calculate the value up to a tolerance given
    by `10^(−10)` using the fixed-point iteration method.


    **Solution 4-8.** The following code can be used to find the root using this method.


    *Example4p8.m*


    ```matlab

    %Example4p8

    %This code uses fixed-point iteration method

    format long

    tolerans=1e-10;

    x0 = 0.5;

    f = @(x) x^3-3*x+1;% function comes here

    while (abs(f(x0)) > tolerans)

    Result =  (x0 ^ 3 + 1) / 3; %fixed point function

    x0 = Result;

    end

    fprintf(''Root = f ( %d ) = %d \n'',x0,f(x0));

    ```


    Once the code is executed, the following output will be displayed on the screen.


    ```

    > Example4p8

    Root = f ( 3.472964e-01 ) = -5.213918e-11

    >

    ```


    If we compare the results obtained by the different methods given, Newton’s method
    yields a slightly better result than the others.


    ## Numerical Integration


    MATLAB provides various built-in functions, shown in Table 4-2, to calculate integrals
    numerically.


    **Table 4-2** Functions Used in Numerical Integration


    | Function | Explanation |

    | --- | --- |

    | `integral` | Performs integration by using the global adaptive quadrature |

    | `integral2` | Evaluates double integrals numerically |

    | `integral3` | Evaluates triple integrals numerically |

    | `cumtrapz` | Calculates cumulative integrals using the trapezoidal method |

    | `trapz` | Calculates integrals using the trapezoidal method |


    **Example 4-9.** Write code to numerically calculate the integral of `2x * e^(x^2)`
    from 0 to 1 by using the function `integral`. Then, compare the numerical solution
    with the analytical solution. The code should display the numerical result, analytical
    result, and error on the screen.


    **Solution 4-9.** The following code can be used to accomplish the given task.


    *Example4p9.m*


    ```matlab

    %Example4p9

    %This code uses integral function

    format long

    Myfun = @(x) 2*exp(x.^2).*x;

    NumericSol = integral(Myfun,0,1);

    AnalyticSol = exp(1)-1;

    Error = abs(NumericSol - AnalyticSol);

    fprintf(''Numerical solution :%e\n'',NumericSol)

    fprintf(''Analytical solution:%e\n'',AnalyticSol)

    fprintf(''Error is           :%e\n'',Error)

    ```


    Once the code is executed, the following output will be printed on the screen.


    ```

    > Example4p9

    Numerical solution :1.718282e+00

    Analytical solution:1.718282e+00

    Error is           :4.440892e-16

    >

    ```


    ## Numerical Differentiation


    In this section, numerical methods for solving ordinary differential equations
    are discussed.


    ### Ordinary Differential Equations


    Numerical solution of ordinary differential equations has important applications
    in a wide variety of areas in engineering and applied sciences. MATLAB provides
    numerous built-in functions that solve ordinary differential equations with an
    initial condition.


    Ordinary differential equations (ODEs) with initial values can also be solved
    using Euler’s method and the Runge–Kutta method. This section covers how to solve
    initial value problems of ODEs using the ODE solvers, Euler’s method, and the
    fourth-order Runge–Kutta method.


    #### ODE Solver Functions


    MATLAB has numerous functions for solving ODEs. Although `ode45` is the first
    one to come to mind, the user should consider the type of the problem (stiff or
    nonstiff) when selecting the solver.


    **Table 4-3** Common ODE Solvers in MATLAB


    | Solver | Accuracy | Explanation |

    | --- | --- | --- |

    | `ode45` | Medium | Most of the time, this solver should be the first one tried;
    used for nonstiff problems |

    | `ode113` | Low to high | Used for nonstiff problems, and when ODE is expensive
    to evaluate |

    | `ode15s` | Low to medium | Recommended when `ode45` fails, and when solving
    differential algebraic equations for stiff problems |

    | `ode15i` | Low | Solves fully implicit differential equations for stiff problems
    |


    **Example 4-10.** Write code to solve the following initial value problem given
    by


    `dy/dx = y - x`, `y(0) = 2/3`, `0 ≤ x ≤ 5`


    using the `ode45` solver, where the exact solution is `y = (x + 1) - (1/3) * e^x`.
    The code should print the solution at `x = 5` (`y(5)`) to the screen.


    **Solution 4-10.** The following code can be used to accomplish the given tasks.


    *Example4p10.m*


    ```matlab

    %Example4p10

    %This code uses ode45 function

    format long

    y = 2.0/3.0; %initial condition

    x0=0; xF =5;

    f = @MyFunc;

    xval = [0,5];% 0<=x<=5

    [t,Result]=ode45(f,xval,y);

    Lengt = length(Result);

    fprintf("ode45 Solution of y(5): %.10f\n", Result(Lengt));

    y_exact = 5.0 + 1.0 - (1.0/3.0)*exp(5.0);

    fprintf("Exact Solution of y(5): %.10f\n",y_exact);

    function Res = MyFunc(x,y)

    Res = y-x; %defined function

    end

    ```


    In the code, the precision is set to show 10 decimal digits and the function `ode45`
    is called by an anonymous function. Once we run the code, the following output
    is displayed on the screen.


    ```

    > Example4p10

    ode45 Solution of y(5): -43.4717851406

    Exact Solution of y(5): -43.4710530342

    >

    ```'
