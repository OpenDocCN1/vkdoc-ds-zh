    **Example 4-12.** Write code to solve the initial value problem given by


    ![$$ \frac{dy}{dx}=y-x,y(0)=\frac{2}{3},0\le x\le 5 $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equi.png)


