    ### 不动点迭代法


    不动点迭代法通常用于求解形如 `f(x) = 0` 的方程的根。需要从给定方程推导出迭代函数。在这种方法中，给定方程被重写为 `x = g(x)` 的形式，其中
    `g(x)` 就是迭代函数。在算法中，首先选取一个初始点 `x[0]`。然后，通过 `x[n + 1] = g(x[n])` 对迭代函数进行递归处理。如果函数
    `f` 是连续的，并且 `x[n]` 收敛于某个数，例如 `M`，那么 `M` 就是迭代函数的一个不动点。


    对于某个特定的函数，可以选择多个方程作为迭代函数。是否收敛于某个数在选择迭代函数时起着重要作用。为了理解如何选择迭代函数，请看下面的示例。


    **示例 4-7.** 对于由 `f(x) = x² − x − 4` 给出的函数，找出可能的迭代函数 `g(x)` 来求 `f(x)` 的根。


    **解法 4-7.** 迭代函数 `g(x)` 可以选择如下。


    1.  `g(x) = x² − 4`

    2.  `g(x) = 1 + 4 / x`

    3.  `g(x) = sqrt(x + 4)`


    **示例 4-8.** 编写代码，使用不动点迭代法求 `f(x) = x³ − 3*x + 1` 的根，初始值为 0.5。代码应将值计算到给定容差 `10^(−10)`
    以内。


    **解法 4-8.** 以下代码可用于通过此方法求根。


    *Example4p8.m*


    ```matlab

    %Example4p8

    %此代码使用不动点迭代法

    format long

    tolerans=1e-10;

    x0 = 0.5;

    f = @(x) x³-3*x+1;% 函数在此

    while (abs(f(x0)) > tolerans)

    Result =  (x0 ^ 3 + 1) / 3; % 不动点函数

    x0 = Result;

    end

    fprintf(''根 = f ( %d ) = %d \n'',x0,f(x0));

    ```


    一旦代码执行，以下输出将显示在屏幕上。


    ```

    > Example4p8

    根 = f ( 3.472964e-01 ) = -5.213918e-11

    >

    ```


    如果我们比较不同方法给出的结果，牛顿法得到的结果略优于其他方法。


    ## 数值积分


    MATLAB 提供了多种内置函数来进行数值积分计算，如表 4-2 所示。


    **表 4-2** 数值积分中使用的函数


    | 函数 | 说明 |

    | --- | --- |

    | `integral` | 使用全局自适应求积法执行积分 |

    | `integral2` | 数值计算二重积分 |

    | `integral3` | 数值计算三重积分 |

    | `cumtrapz` | 使用梯形法计算累积积分 |

    | `trapz` | 使用梯形法计算积分 |


    **示例 4-9.** 编写代码，使用 `integral` 函数数值计算 `2x * e^(x²)` 从 0 到 1 的积分。然后，将数值解与解析解进行比较。代码应在屏幕上显示数值结果、解析结果和误差。


    **解法 4-9.** 以下代码可用于完成给定的任务。


    *Example4p9.m*


    ```matlab

    %Example4p9

    %此代码使用 integral 函数

    format long

    Myfun = @(x) 2*exp(x.²).*x;

    NumericSol = integral(Myfun,0,1);

    AnalyticSol = exp(1)-1;

    Error = abs(NumericSol - AnalyticSol);

    fprintf(''数值解            :%e\n'',NumericSol)

