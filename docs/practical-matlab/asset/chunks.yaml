    \ Then dilation of *A* by *B* is defined as\n\n![$$ A\\oplus B=\\left\\{\\left(x,y\\\
    right)+\\left(u,v\\right):\\left(x,y\\right)\\in A,\\left(u,v\\right)\\in B\\\
    right\\}. $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ11.png)\n\
    \n(12)\n\nErosion of *A* by *B* is defined as\n\n![$$ A\\ominus B=\\Big\\{z:{B}_z\\\
    subseteq A. $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ12.png)\n\
