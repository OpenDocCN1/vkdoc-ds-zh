    ## Data Types


    In MATLAB, the default data type is double. This means that anything entered at
    the prompt is saved as double unless otherwise specified.


    We can divide the data types into two major categories in MATLAB: homogeneous
    data types and heterogeneous data types (Figure [1-4](#483991_1_En_1_Chapter.xhtml#Fig4)).
    Homogeneous data types include the same type of data, whereas the heterogeneous
    data types have mixed or complex data types.


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig4_HTML.jpg](images/483991_1_En_1_Chapter/483991_1_En_1_Fig4_HTML.jpg)


    Figure 1-4

    Data types


    ### Homogeneous Data Types


    Homogeneous data types have the same characteristics. These types may be characters,
    strings, integers, floating-point numbers, or logical data.'
