    If the function *f* is continuous and *x*[*n*] converges to a number, say *M*,
    then *M* is a fixed point of the iteration function.


    For a certain function, more than one equation can be picked as the iteration
    function. Converging to a number plays an important role in picking the iteration
    function. To grasp the idea of how to select the iteration function, take a look
    at the following example.


    **Example 4-7.** Considering the function given by *f*(*x*) = *x*² − *x* − 4,
    find possible iteration functions *g*(*x*) to find the roots of *f*(*x*).


    **Solution 4-7.** The iteration function *g*(*x*) can be selected as follows.


    1.  *g*(*x*) = *x*² − 4


