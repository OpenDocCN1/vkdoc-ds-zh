    ## 边缘检测


    边缘检测定义为检测图像内对象的边界。它是用于图像分割和数据提取的主要图像处理技术之一。在 MATLAB 中，有多种不同的算法和方法用于此目的。要查找图像中的边缘，需使用`edge`函数。用于此目的的方法包括`sobel`、`prewitt`、`roberts`、`log`、`zerocross`、`canny`和`approxcanny`。如果未选择这些方法中的任何一个，则默认使用`sobel`方法。


    许多边缘检测算子都是基于微分构建的。


    ![$$ \frac{df}{dx}=\underset{h\to 0}{\lim}\left(\frac{f\left(x+h\right)-f(x)}{h}\right)
    $$](img/483991_1_En_10_Chapter_TeX_Equ9.png)


    (9)


    导数的定义如公式 9 所示。该表达式可以重写为


    ![$$ f\left(x+h\right)-f(x) $$](img/483991_1_En_10_Chapter_TeX_Equ10.png)


    (10)


    当`h = 1`时。实际上，如果考虑水平方向上相邻像素值之间的差值，`h`的最小值为 1。


    基于表达式`f(x+1) - f(x-1)`，可以将水平和垂直滤波器定义为`[-1, 0, 1]`和![$$ \left|\begin{array}{c}-1\\
    {}0\\ {}1\end{array}\right| $$](img/483991_1_En_10_Chapter_TeX_IEq1.png)。梯度幅值在边缘检测方法中起着重要作用。对于图像`f(x,
    y)`，其梯度和梯度幅值定义为


    ![$$ \left[\frac{\partial f}{\partial x}\ \frac{\partial f}{\partial y}\right]
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq2.png)，![$$ \sqrt{{\left(\frac{\partial
    f}{\partial x}\right)}²+{\left(\frac{\partial f}{\partial y}\right)}²} $$](img/483991_1_En_10_Chapter_TeX_IEq3.png)。(11)


    **例 10-21.** 编写一个程序，从文件`cowboys.png`中读取图像。然后，使用`canny`和`prewitt`方法查找图像中的边缘。


