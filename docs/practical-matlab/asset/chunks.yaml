    ## Cost, Revenue, and Profit


    In all businesses, keeping a clear and proper financial account is extremely important.
    Calculation of cost, revenue, and profit plays an important role in this regard.
    In this section, we deal with these three important concepts.


    ### Cost


    Cost, also known as total cost, is the monetary value spent to produce or obtain
    an item. In general, the cost of something can be calculated by using the linear
    function


    ![$$ C(x)= mx+b $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_Equd.png)


    The marginal cost is represented by *m*, and *b* represents the fixed costs.


    **Example 3-8.** Alexander’s biking company produces bike to sell. Production
    of each bike costs the company $50 and other fixed costs of the company are $35\.
    Write code to calculate the total cost of produced bikes. The code should ask
    the for number of bikes produced to complete the calculation.


    **Solution 3-8.** The following code can be used to accomplish the given task.


    *Example3p8.m*


    ```

    %Example3p8

    %This code calculates cost (total cost)

    Number = input(''Number of bikes for production\n'');

    Cost = @(x) 50*x+35;

    CostCalculation = Cost(Number);

    disp([''The cost is '', num2str(CostCalculation)])

    ```


    Once the code is run, and number of bikes is entered as 10, the following output
    is obtained.


    ```

    > Example3p8

    Number of bikes for production


    The cost is 535

    >

    ```


    ### Revenue


    Revenue is the total money obtained from selling *Q* items at price *P.*


    ![$$ R=Q\ast P $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_Eque.png)


    In this equation, *R* represents revenue, *Q* represents the number of items sold,
    and *P* represents the price of each item sold. Finding the total revenue by using
    the given formula is not that difficult. There are questions that require the
    user to find the maximum revenue in different cases. The next example is such
    a question.


    **Example 3-9.** Alexander’s cinema company sells tickets for a film showing.
    The cinema has 1,000 seats. One ticket costs $8 currently. Alexander wants to
    increase the price. From past experience, he thinks that if he increases the price
    $0.50 for each ticket, then 50 fewer people will attend the showing. Find the
    price of a ticket that maximizes revenue.


    **Solution 3-9.** Let *x* be the number of $0.50 increases. Therefore, $8.00 +
    $0.50*x* represents the price of one ticket and 1,000 - 50*x* represents the number
    of tickets sold. Then the revenue can be calculated as *R* = (1000 − 50*x*) ∗ (8.00 + 0.50*x*).
    From here, we can write *R* =  − 25*x*² + 100*x* + 8000\. The following code can
    be used to accomplish the given task. Then we need to find an *x* value that maximizes
    the *R* value. This is the part where we need to enter into the code and solve
    for *x* to make *R* the maximum value. The following code can be used to achieve
    this.


    *Example3p9* *.m*


    ```

    %Example3p9

    %This code finds maximum value

    syms x

    R = -25*x^2+100*x+8000;

    Derivat = diff(R,x);

    Number = solve(Derivat,x);

    EvalFunc = matlabFunction(R);

    MaxVal = EvalFunc(double(Number));

    disp([''Maximum Revenue is '',...

    num2str(MaxVal)])

    ```


    In this code, the *R* function is entered as a symbolic function. Then its derivative
    is found by using the `diff` function. The obtained linear equation is solved
    by using the `solve` function. The obtained `Number` value shown is a symbolic
    data value. To convert it to a floating number, the `double` function is used.
    In the meantime, `the` *R* symbolic function is converted to a MATLAB function
    to evaluate *R* at `x=Number` value. Finally, the maximum value is shown with
    the `disp` function.


    Once the code is run, the following output is obtained.


    ```

    > Example3p9

    Maximum Revenue is 8100

    >

    ```


    **Remark 3-1.** For quadratic equations (i.e., *f*(*x*) = *ax*² + *bx* + *c*,
    *a* ≠ 0 and *a*, *b*, *c* ∈ *R*), maximum value or minimum value can be calculated
    depending on the sign of *a*. If the sign is negative (-), then the maximum value
    can be derived from the equation. If the sign is positive (+), then the minimum
    value of the equation can be found. This can be done in two ways. In the first
    way, ![$$ f\left(\frac{-b}{2a}\right) $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_IEq6.png)
    gives us the maximum or minimum value. In the second case, the derivative of *f*(*x*)
    is calculated, and the *f*^′(*x*) = 0 equation is solved. The root of *f*(*x*)
    gives us the maximum or minimum value depending on the sign of *a* as well.


    In the preceding problem, the second method is preferred for finding the maximum
    value.'
