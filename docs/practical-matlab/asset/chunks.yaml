    FFT 也可以应用于音频文件和图像文件进行分析。作为示例，我们将展示如何对图像应用 `fft2` 函数。这里，`fft2` 是 `fft` 的二维函数。在此示例中，`fft2`
    函数被用作滤波器，而非用于分析。处理图像文件是一个广泛的课题，将在下一章进行探讨。


    ### 示例 9-11

    编写代码，将 FFT 作为滤波器应用于彩色图像。图像名为 `covboys.png`，位于与代码相同的目录中。应用 FFT 后，应在屏幕上显示图像。然后，应将图像转换回原始图像，并在另一个不同的图形上显示原始图像。


