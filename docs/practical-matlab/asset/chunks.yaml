    图 8-3


    Nicholson-Bailey 模型的图形


    ## 生物信息学


    生物信息学是一个广泛的交叉学科领域。它开发包括算法和软件在内的方法来理解生物学数据。全面涉及该主题的内容超出了本书的范围。本节介绍与分子生物学基因相关的几个应用。

