    Figure 10-19


    Adding and cleaning salt and pepper noise


    **Example 10-15.** Write code that adds speckle multiplicative noise to the `peppers.png`
    image with noise density of 0.05. Then using the FIR filter and adaptive filter,
    remove the noise from the image. The code should generate the original, noisy,
    FIR filtered, and adaptive filtered images in the same figure.


    **Solution 10-15.** The following code can be used to accomplish the given task.


    *Example10p15.m*


    ```

    %Example10p15

    %This code applies and cleans noise

    im = rgb2gray(imread(''peppers.png''));

    no1=imnoise(im,''speckle'',0.05);

