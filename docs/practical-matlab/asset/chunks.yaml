    # 8. Computational Biology


    Computational biology is a division of applied science that combines application
    of theoretical methods, mathematical modeling, and computer science to solve biological,
    ecological, social, and behavioral problems. In this chapter, we see some of its
    applications written with MATLAB code. Bacterial growth and population models
    are illustrated with a few examples. Then, topics including host–parasitoid models,
    bioinformatics, predator–prey models, and epidemic models are presented.'
