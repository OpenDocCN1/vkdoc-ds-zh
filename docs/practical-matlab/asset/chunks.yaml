    # MATLAB 环境


    当您运行 MATLAB 时，编程框架会被打开。光标会停留在命令窗口中，前面带有提示符 `>`。如果您运行的是学生版，提示符则为 `EDU>`。


    让我们来探索一下 MATLAB 的控制台，它的外观非常简洁。默认窗口如图 1-1 所示。


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig1_HTML.jpg](img/483991_1_En_1_Fig1_HTML.jpg)


    图 1-1


    MATLAB 环境


    当您打开 MATLAB 时，其界面包含以下窗口：


    *   *命令窗口：* 这是我们输入命令的窗口。

    *   *当前文件夹：* 此窗口显示 MATLAB 运行的目录。

    *   *工作区：* 我们可以在该窗口中查看程序变量。

    *   *命令历史记录：* 在这里可以监控之前在命令窗口中输入过的命令。

    *   *编辑器：* 我们可以在此窗口中编写希望以 m 文件形式运行的代码。


    用户可能需要关闭其中任何一个窗口来重新组织界面。您也可以自定义外观界面，例如颜色、字体等方面的样式。点击 `ENVIRONMENT`，然后选择 `Preferences`，即可打开图
    1-2 所示的菜单。


    ![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig2_HTML.jpg](img/483991_1_En_1_Fig2_HTML.jpg)


    图 1-2


    更改属性


    只需点击图 1-2 所示左侧框架中的项目，您就可以根据自己的偏好自定义这些设置。


    在使用 MATLAB 时，最有用的命令之一是 `help` 命令，它说明了某个命令的工作原理以及在 MATLAB 中的使用方法。一旦您输入 `help` 并按
    `Enter` 键，就可以点击结果屏幕中任何带下划线的主题进行详细查看。


    如果您是 MATLAB 新手，可以通过演示观看一些教程。如果在命令窗口中输入 `demo`，您可以从任何可用主题中进行选择并探索：


    ```

    >demo

    >

    ```


    点击任何主题，您都可以观看相关教程，或通过示例来查看命令的解释。表 1-1 列出了一些用于执行基本操作的入门命令，例如关闭 MATLAB 或从命令窗口记录会话。


    表 1-1


    MATLAB 中使用的部分基本命令


    | 函数 | 说明 | 示例 |

    | --- | --- | --- |

    | `help` | 返回有关指定命令的信息 | `>>help clc` |

    | `demo` | 显示 MATLAB 中任何主题的解释 | `>>demo` |

    | `save` | 将工作区变量保存到指定文件 | `>>save my_var` |

    | `diary on` | 开始记录会话 | `>>diary on` |

    | `diary off` | 停止记录会话并保存到日记文件 | `>>diary off` |

    | `exit` | 终止 MATLAB | `>>exit` |

    | `quit` | 终止 MATLAB | `>>quit` |

    | `clc` | 清除屏幕 | `>>clc` |

    | `clear` | 清除工作区中的所有变量或任何指定变量 | `>>clear all` |

    | `who` | 显示工作区中的所有变量 | `>>who` |

    | `whos` | 显示工作区中所有变量及其大小和类型 | `>>whos` |


    在本书中，示例将演示 MATLAB 的用法。每个示例都说明了相关章节中某个主题特性的重要方面。


    在 MATLAB 中，您可以通过使用 `save` 函数来保存整个会话，从开始到结束。我们可以看看下面的示例。


    **示例 1-1.** 在提示符下输入 `disp(''Hello World'')`。将会话保存到名为 `my_session` 的文件中。


    **解法 1-1.** 可以在提示符下输入以下代码。


    ```

    > diary my_session

    > disp(''Hello World'')

    Hello World

    > diary off

    ```


    MATLAB 会在您的当前目录中创建一个名为 `my_session` 的文件。如果点击该文件，它将在编辑器中显示如下。


    ```

    disp(''Hello World'')

    Hello World

    diary off

    ```


    在这段代码中，命令 `disp()` 会显示紧随其后的单引号内的任何内容。如果要显示的表达式是一个数字，则无需加引号。如果表达式是字符串或字母，则需要在文本前后加引号，并与
    `disp()` 函数一起使用。


    ## 将 MATLAB 用作计算器


    MATLAB 也可以用作计算器。您可以找到任何复杂计算的解。在下面的示例中，我们可以看到这一功能的说明。


    **示例 1-2.** 求 ![$$ 5-\frac{8}{3}+ coscos\ \left(\pi \right)-\frac{10}{e²}+\sqrt{7}
    $$](img/483991_1_En_1_Chapter_TeX_IEq1.png) 的结果。


    **解法 1-2.** 以下代码将求出解。


    ```

    > 5-8/3+cos(pi)-10/exp(2)+sqrt(7)

    ans =

    2.6257

    >

    ```


    如上代码所示，*π* 在 MATLAB 中用单词 `pi` 表示。对于欧拉数 ***e***，我们需要输入 `exp(2)`，而求 7 的平方根则应使用 `sqrt(7)`。因为我们没有将结果赋值给变量，所以结果显示为
    `ans` 并打印在屏幕上，它代表答案。

