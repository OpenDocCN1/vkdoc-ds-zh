    # 6. Basic Statistics and Data Analysis


    This chapter begins with a brief discussion about basic statistical functions
    used in MATLAB. After that, sorting, searching, and processing data with Microsoft
    Excel files are presented.


    ## Basic Statistics


    MATLAB offers a great variety of features and ready-to-use, built-in functions
    in the area of statistics. In this book, I only introduce an outline of the topic
    with some basic statistical functions (Table [6-1](#483991_1_En_6_Chapter.xhtml#Tab1)).


    Table 6-1


    Some of the Basic Functions Related to Statistics in MATLAB


    | Function | Explanation | Example |

    | --- | --- | --- |

    | `max()` | Returns the maximum element | `max([1,34,21,5])` |

    | `mean()` | Returns the average or mean value | `mean([1,34,21,5])` |

    | `median()` | Returns the median value | `median([1,34,21,5])` |

    | `min()` | Returns the smallest value | `min([1,34,21,5])` |

    | `mode()` | Returns the most frequently occurring value | `mode([1,34,5,21,5])`
    |

    | `std()` | Returns the standard deviation | `std([1,34,5,21,5])` |

    | `var()` | Returns the variance | `var([1,34,5,21,5])` |


    **Example 6-1.** Create a 3 × 4 matrix randomly by using the function `randi()`.
    Then, calculate the maximum value, mean value, and standard deviation of each
    column of the matrix.


    **Solution 6-1.** The following code can be used to create the matrix and find
    the desired values for each column of the matrix.


    *Example6p1.m*


    ```

    %Example6p1

    %This code finds statistical values

    A=randi(100,3,4);

    %Maximum number is set as 100

    Maximum = max(A);

    MeanVal = mean(A);

    StanDev = std(A);

    disp([''The maximum numbers are '',...

    num2str(Maximum)])

    disp([''The mean numbers are '',...

    num2str(MeanVal)])

    disp([''The standard deviations are '',...

    num2str(StanDev)])

    ```


    Once the code is executed, the following output will be displayed on the screen.


    ```

    > Example6p1

    The maximum numbers are 84  92  97  98

    The mean numbers are 37.6667           57      60.3333      56.3333

    The standard deviations are 40.2782       44.441      32.5167      36.8556

    >

    ```


    ## Data Analysis


    This section presents various sorting and searching functions, along with data
    processing examples.'
