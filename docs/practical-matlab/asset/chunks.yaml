    ### 单阈值分割


    在单阈值分割中，只考虑一个点。假设阈值定义为`T`。点`(x,y)`处的像素值可定义如下：


    ![$$ \mathrm{P}\left(x,y\right)=\left\{\begin{array}{c}\mathrm{white},\mathrm{if}\
    \mathrm{the}\ \mathrm{value}\ \mathrm{at}\ \left(x,y\right)&gt;T\ \\ {}\mathrm{black},\mathrm{if}\
    \mathrm{the}\ \mathrm{value}\ \mathrm{at}\ \left(x,y\right)\le T\end{array}\right.
    $$](img/483991_1_En_10_Chapter_TeX_Equ7.png)


    (7)


    因此，在公式 7 中，为灰度图像内`P(x, y)`的每个像素值定义了白色或黑色着色。


    **例 10-18.** 编写代码，以`T = 0.61`为阈值检测`coin.png`文件的边界。


    **解 10-18.** 以下代码可用于完成给定任务。


    *Example10p18.m*


    ```

    %Example10p18

    %This code uses thresholding

    T=0.61;

    im=mat2gray(imread(''coins.png''));

    [Row,Col]=size(im);

    NewIm=zeros(Row,Col);

    for i=1:Row

    for k=1:Col

    if im(i,k)>T

    NewIm(i,k)=1;

    else

    NewIm(i,k)=0;

    end

    end

    end

    figure,imshowpair(im,mat2gray(NewIm),''montage'');

    title (''Original Image and Thresholding'');

    ```


