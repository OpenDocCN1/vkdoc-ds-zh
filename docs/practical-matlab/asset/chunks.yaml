- fmt: '### Adding and Removing Noise


    Errors or noise can happen on images due to external factors such as transmission
    of image signals, or sending image signals via satellite.


    **Example 10-14.** Write code that adds salt and pepper noise to the `peppers.png`
    image. Then use the `medfilt2` filter to remove the noise with 0.2 noise density.


    **Solution 10-14.** The following code can be used to accomplish the given task.


    *Example10p14.m*


    ```

    %Example10p14

    %This code applies salt & pepper noise

    I1 = rgb2gray(imread(''peppers.png''));

    WithNois=imnoise(I1,''salt & pepper'',0.2);

    I2=medfilt2(I1);

    subplot(121),imshow(WithNois);

    title(''Salt & Pepper Noise'');

    subplot(122),imshow(I2);

    title (''Cleaning Noise'');

    ```


