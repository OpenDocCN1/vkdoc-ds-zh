    ## Edge Detection


    Edge detection is defined as the detection of the boundaries of the objects within
    an image. It is one of the primary image processing techniques used for image
    segmentation and data extraction. There are different algorithms and methods used
    for this purpose in MATLAB. To find the edges in an image, the `edge` function
    is used. The methods used for this purpose include `sobel`, `prewitt`, `roberts`,
    `log`, `zerocross`, `canny`, and `approxcanny`. If any of these methods is not
    selected, the `sobel` method is used by default.


    Many of the edge detection operators are constructed considering differentiation.


    ![$$ \frac{df}{dx}=\underset{h\to 0}{\lim}\left(\frac{f\left(x+h\right)-f(x)}{h}\right)
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ9.png)


    (9)


    The definition of the derivative is given in Equation [9](#483991_1_En_10_Chapter.xhtml#Equ9).
    This expression can be rewritten as


    ![$$ f\left(x+h\right)-f(x) $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_Equ10.png)


    (10)


    when `h = 1`. Actually, the smallest value of `h` is 1 if we consider the difference
    between consecutive pixel values horizontally.


    Based on the expression `f(x+1) - f(x-1)`, horizontal and vertical filters can
    be defined as `[-1, 0, 1]` and ![$$ \left|\begin{array}{c}-1\\ {}0\\ {}1\end{array}\right|
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq1.png). The magnitude
    of the gradient plays an important role in edge detection methods. For an image
    `f(x, y)`, the gradient and its magnitude are defined by


    ![$$ \left[\frac{\partial f}{\partial x}\ \frac{\partial f}{\partial y}\right]
    $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq2.png), ![$$ \sqrt{{\left(\frac{\partial
    f}{\partial x}\right)}^2+{\left(\frac{\partial f}{\partial y}\right)}^2} $$](images/483991_1_En_10_Chapter/483991_1_En_10_Chapter_TeX_IEq3.png)
    .(11)


    **Example 10-21.** Write a program that reads the image from the file `cowboys.png`.
    Then, use the methods `canny` and `prewitt` to find the edges within the image.


    **Solution 10-21.** The following code can be used to accomplish the given task.


    *Example10p21.m*


    ```

    %Example10p21

    %This code finds edges

    Im = imread(''cowboys.png'');

    Im2 = rgb2gray(Im);

    CannyM = edge(Im2,''canny'');

    PrewittM = edge(Im2,''prewitt'');

    figure, imshow(CannyM);

    title(''Canny method'');

    figure, imshow(PrewittM);

    title(''Prewitt method'');

    ```


    Once the code is run, the outputs obtained are displayed in Figures [10-26](#483991_1_En_10_Chapter.xhtml#Fig26)
    and [10-27](#483991_1_En_10_Chapter.xhtml#Fig27).


