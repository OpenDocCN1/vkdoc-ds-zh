- fmt: '### `fzero` Function


    `fzero` is a built-in function that finds the roots of a nonlinear function in
    MATLAB. This function is very easy to code and it has two different uses. The
    first use consists of the calculation of the root around a point for the defined
    function.


    ```

    > fzero(Myfunction,x0)

    ```


    In this use, the given function is `Myfunction`, and the point is defined by `x0`.


    In the second use, the function finds the root within a given interval.


    ```

    > fzero(Myfunction, [x0, x1])

    ```


    In this use, the given function is `Myfunction` and the root is searched between
    the points `x0` and `x1`. The function can be defined using an anonymous function
    as in the following example.


    **Example 4-3.** Write code to find the root of `2 * cos(x)`. The code should
    separately find the root around `π/4` and the root within the interval of `π`
    and `2π`. The code should print the values in terms of degrees on the screen.


    **Solution 4-3.** The following code can be used to find the roots.


    *Example4p3.m*


    ```

    %Example4p3

    %This code uses fzero function

    Myfunc = @(x) 2*cos(x); % function

    x0 = pi/4; % around this point

    FirstKind = fzero(Myfunc,x0); % the usage

    CorrespondingDegree1 = (FirstKind)*(180/pi);

    fprintf("1st root is %d degree\n",CorrespondingDegree1)

    interval = [pi, 2*pi];% interval for 2nd usage

    SecondKind = fzero(Myfunc,interval);

    CorrespondingDegree2 = (SecondKind)*(180/pi);

    fprintf("2nd root is %d degree\n",CorrespondingDegree2)

    ```


    As shown in the code, the values of the corresponding roots are converted from
    radians to degrees by simply multiplying these values by `180/π`.


    Once the code is executed, the following output will be printed on the screen.


    ```

    > Example4p3

    1st root is 90 degree

    2nd root is 270 degree

    >

    ```


    ### Bisection Method


    The bisection method can be implemented by creating a user-defined function. There
    is no built-in function like `fzero` in MATLAB for the bisection method. The algorithm
    in the following example can be used for the implementation of this method. In
    the bisection method, the boundary points should be picked carefully. Due to the
    nature of the method, the defined function must have different signs at the boundaries
    (at `a` and `b` as presented in the code).


    **Example 4-4.** Write a code to find the root of `f(x) = x³ - 3x + 1` between
    0 and 1. The code should calculate the value up to a tolerance given by `10⁻¹⁰`
    using the bisection method.


    **Solution 4-4.** The following code can be used to find this root.


    *Example4p4.m*


    ```

    %Example4p4

    %This code uses bisection algorithm

    format long

    tolerance=1e-10;

    a = 0.0; b = 1.0;

    f=@(x) x^3-3*x+1;% function is defined here

    Result = MyBisect (f,a,b,tolerance);

    fprintf(''Root is = f ( %d ) = %d \n'',Result,f(Result));

    function [c] = MyBisect (f,a,b,tolerance)

    c = (a + b)/2;

    while (abs(f(c)) > tolerance)

    c = (a + b)/2;

    if ( f(a)*f(c) < 0 )

    b = c;

    else

    a = c;

    end

    end

    end

    ```


    Once the code is executed, the following output will be printed on the screen.


    ```

    > Example4p4

    Root is = f ( 3.472964e-01 ) = -4.365619e-11

    >

    ```


    ### Newton’s Method


    In some textbooks, Newton’s method is referred to as the Newton–Raphson method.
    There is no built-in function in MATLAB to calculate a root by using this method,
    but its algorithm is quite easy to implement.


    `xₙ₊₁ = xₙ - f(xₙ) / f''(xₙ)`


    The function must be defined by the user to calculate the root using this algorithm.


    **Example 4-5.** Write code to find the root of `f(x) = x³ - 3x + 1` with an initial
    value of 0.5. The code should calculate the value up to a tolerance given by `10⁻¹⁰`
    by using Newton’s method.


    **Solution 4-5.** The following code can be used to illustrate Newton’s method.


    *Example4p5.m*


    ```

    %Example4p5

    %This code uses Newton''s algorithm

    format long

    tolerans=1e-10;

    x0 = 0.5;

    F = @(x) x^3-3*x+1; %Function written here

    Derivat = @(x) 3*x^2-3; % Its derivative should be here

    %Make sure Derivat(x0) is NOT equal to zero

    x0 = MyNewton (F,Derivat ,x0 ,tolerans);

    fprintf(''Root = f ( %d ) = %d \n'',x0,F(x0));

    function x0 = MyNewton (F,Derivat,x0,tolerans)

    while (abs(F(x0)) > tolerans)

    Result = x0 - (F(x0) / Derivat (x0));

    x0=Result;

    end

    end

    ```


    Once we run the code, the following output will be displayed on the screen.


    ```

    > Example4p5

    Root = f ( 3.472964e-01 ) = -2.220446e-16

    >

    ```


    Note that the initial value plays an important role in finding the root more quickly.


    ### Secant Method


    The secant method is yet another method for finding the root of an equation. The
    algorithm for this method is


    `xₙ₊₁ = xₙ - ((xₙ - xₙ₋₁) / (f(xₙ) - f(xₙ₋₁))) * f(xₙ)`


    The function must be defined by the user to calculate the root using this algorithm.
    The following example can be used to illustrate the secant method.


    **Example 4-6.** Write a code to find the root of `f(x) = x³ - 3x + 1` with the
    first two initial values of 0 and 1. The code should calculate the value up to
    a tolerance given by `10⁻¹⁰` by using the secant method.


    **Solution 4-6.** The following code can be used to find the root via the secant
    method.


    *Example4p6.m*


    ```

    %Example4p6

    %This code uses the secant method

    format long

    tolerance=1e-10;

    x0 = 0.0;

    x1 = 1.0;

    f = @(x) x^3-3*x+1; % function comes here

    x1 = MySecant (f,x0,x1,tolerance);

    fprintf(''Root = f ( %d ) = %d \n'',x1,f(x1));

    function x1 = MySecant (f,x0,x1,tolerance)

    while (abs(f(x1)) > tolerance)

    Result = x1 - ( (x1 - x0) / (f(x1)-f(x0)) ) * f(x1);

    x0 = x1;

    x1 = Result;

    end

    end

    ```


    Once the code is executed, the following output will be shown on the screen.


    ```

    > Example4p6

    Root = f ( 3.472964e-01 ) = -4.440892e-16

    >

    ```'
  raw: '### fzero Function


    `fzero` is a built-in function that finds the roots of a nonlinear function in
    MATLAB. This function is very easy to code and it has two different uses. The
    first use consists of the calculation of the root around a point for the defined
    function.


    ```

    > fzero(Myfunction,x0)

    ```


    In this use, the given function is `Myfunction`, and the point is defined by `x0`.


    In the second use, the function finds the root within a given interval.


    ```

    >fzero(Myfunction, [x0, x1])

    ```


    In this use, the given function is `Myfunction` and the root is searched between
    the points `x0` and `x1`. The function can be defined using an anonymous function
    as in the following example.


    **Example 4-3.** Write code to find the root of 2 *cos* (*x*). The code should
    separately find the root around ![$$ \frac{\pi }{4} $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq1.png)
    and the root within the interval of *π* and 2*π*. The code should print the values
    in terms of degrees on the screen.


    **Solution 4-3.** The following code can be used to find the roots.


    *Example4p3.m*


    ```

    %Example4p3

    %This code uses fzero function

    Myfunc = @(x) 2*cos(x); % function

    x0 = pi/4; % around this point

    FirstKind = fzero(Myfunc,x0); % the usage

    CorrespondingDegree1 = (FirstKind)*(180/pi);

    fprintf("1st root is %d degree\n",CorrespondingDegree1)

    interval = [pi, 2*pi];% interval for 2nd usage

    SecondKind = fzero(Myfunc,interval);

    CorrespondingDegree2 = (SecondKind)*(180/pi);

    fprintf("2nd root is %d degree\n",CorrespondingDegree2)

    ```


    As shown in the code, the values of the corresponding roots are converted from
    radians to degrees by simply multiplying these values by 180/*π*.


    Once the code is executed, the following output will be printed on the screen.


