    ## Fast Fourier Transform


    We already learned about Fourier series in the previous section on periodic functions.
    When it comes to work with nonperiodic signals, we need to know the Fourier transform
    method. A Fourier transform pairs a time series with the series of frequencies.
    Fast Fourier Transform (FFT) is a better way to handle discrete Fourier transforms
    (DFTs). Before understanding FFT, though, we will take a look at the definition
    of a Fourier transform.


    ### Remark 9-4.

    The continuous time Fourier transform of a function *f*(*t*) is given by:


    ![$$ F(k)={\int}_{-\infty}^{\infty }f(t){e}^{-2\pi ikt} dt,k\in R $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ23.png)


    (23)


    ![$$ f(t)={\int}_{-\infty}^{\infty }F(k){e}^{2\pi ikt} dk $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ24.png)


    (24)


    where `F(k)` can be obtained by using an inverse Fourier transform. The signal
    *f*(*t*) has a Fourier transform if the result of Equation [23](#483991_1_En_9_Chapter.xhtml#Equ23)
    converges. An inverse Fourier transform maps the series of frequencies back into
    the relevant time series.


    ### Remark 9-5.

    A DFT of a time-limited sequence `f[t]` where 0 ≤ *t* ≤ *N* − 1 is given by:


    Forward DFT ![$$ F\left[r\right]=\sum \limits_{n=0}^{N-1}f\left[t\right]{e}^{\frac{-2\pi
    jnr}{N}},0\le r\le N-1 $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_IEq8.png)
    (25)


    Inverse DFT ![$$ f\left[t\right]=\frac{1}{N}\sum \limits_{n=0}^{N-1}F\left[r\right]{e}^{\frac{-2\pi
    jnr}{N}},0\le k\le N-1 $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_IEq9.png)
    (26)


    Although Equations [23](#483991_1_En_9_Chapter.xhtml#Equ23) and [24](#483991_1_En_9_Chapter.xhtml#Equ24)
    look very complex, by just substituting Euler’s method where `e^(ix)` = `cos(x)
    + isin(x)`, we can make them much easier, similar to Fourier series.


    FFT is an algorithm that finds a solution to the DFT of a sequence in a better
    way. The algorithm was codeveloped by James W. Cooley and John W. Tukey in 1965.
    Cooley and Tukey took advantage of periodic sinusoids. In other words, some pieces
    of the calculations repeat themselves. By saving these computational costs, they
    reduced the time required and obtained a better algorithm.


    For a signal with length *n*, time complexity (the time required to process *n*
    samples) is `O(n²)` using DFT. This complexity is much better in FFT than DFT,
    which is `O(nlog(n))`.


    In MATLAB, the `fft` function is used to calculate FFT. Because indexing starts
    with 1, not 0, boundaries in the summation symbol for both Equations 25 and 26
    are from *n* = 1 to *N*.


    ### Example 9-9.

    Write code that applies `fft` to function `x` where `x = sin(2πt)`, 0 ≤ *t* ≤
    1. The code should generate 100 samples for `t`, and the length of vector `x`
    should be 512. The code should plot the graph of `x`, and power spectrum on the
    screen.


    ### Solution 9-9.

    The following code can be used to accomplish the given task.


    *Example9p9.m*


    ```

    %Example9p9

    %This code works with fft

    Fs = 100; % Sampling frequency

    t=linspace(0,1,Fs);

    x = sin(2*pi*t);

    Nfft = 512; % Length of FFT

    X = fft(x,Nfft);

    % FFT is symmetric, take half

    X = X(1:Nfft/2);

    % Frequency vector

    f = (0:Nfft/2-1)*Fs/Nfft;

    figure(1);%for graph of sine

    stem(t,x);grid on;

    title(''Signal of Sine Wave'');

    xlabel(''Time'');

    ylabel(''Amplitude'');

    figure(2); % for power spectum

    plot(f,abs(X));grid on;

    title(''Power Spectrum'');

    ylabel(''Power'');

    xlabel(''Frequency'');

    ```


    Once the code is run, the output shown in Figure [9-11](#483991_1_En_9_Chapter.xhtml#Fig11)
    is the result.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig11_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig11_HTML.jpg)


    **Figure 9-11** Signal of sine wave


    For the power spectrum of the sine wave, we generated the output shown in Figure
    [9-12](#483991_1_En_9_Chapter.xhtml#Fig12).


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig12_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig12_HTML.jpg)


    **Figure 9-12** Power spectrum of sine wave'
