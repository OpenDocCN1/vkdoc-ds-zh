    ### 更新坐标


    在此类动画中，对象属性会在循环中被更新和调用。这些属性大多是 `x` 和 `y` 坐标的数据，如示例 7-3 所示。


    **示例 7-3.** 考虑以下函数。


    ![$$ y=\sin \left({x}²\right),0\le x\le 3\pi $$](img/483991_1_En_7_Chapter_TeX_Equc.png)


    编写代码，通过改变其系数来制作函数 `y` 的动画。


    **解答 7-3.** 以下代码可用于完成给定任务。


    *Example7p3.m*


    ```

    %Example7p3

    %This code animates 2-D

    x = 0:0.05:3*pi;

    y = sin(x.²);

    N = length(x);

