    如代码所示，录制的声音被赋值给变量 `RecorderVar`。第五行中，`recordblocking` 函数对对象变量进行了 8 秒的录制，并在录制完成后才返回。`play`
    函数用于播放录制的声音。`getaudiodata` 函数将录制的音频数据作为双精度数组返回。当通过 `plot` 函数绘制这些数据后，我们便得到了图 11-2
    所示的图形，该图形代表了录制的声音。


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig2_HTML.jpg](img/483991_1_En_11_Fig2_HTML.jpg)


    图 11-2


    录制的声音


    请记住，当不同的人运行同样的代码并对麦克风说话时，输出的结果会因每个人的声音不同而与图 11-2 有所差异。绘图结果也与之前使用 `plot` 函数得到的结果不同，这是因为图
    11-2 中使用了原始的音频数据。


    **示例 11-3.** 编写一个程序，将 `handel` 音频文件加载到工作区。然后，程序应将文件以 `handel.flac` 的名称保存到目录中。代码应向文件中添加一些信息。在注释字段中，声音文件应显示“This
    is my first audio”，在标题字段中显示“Hallelujah”，在艺术家字段中显示“San Antonio”。每样本位数应为 24。代码应播放该声音并显示已保存文件的信息。


    **解 11-3.** 可以编写以下代码来完成这些任务。


    *Example11p3.m*


    ```

    %Example11p3

    % This code saves an audio file with info

    load handel

    filename = ''handel.flac'';

    audiowrite(filename,y,Fs,''BitsPerSample'',24,...

    ''Comment'',''This is my first audio'',...

    ''Title'',''Hallelujah'',''Artist'',''San Antonio'');

    sound(y,Fs);

    clear y Fs

    info = audioinfo(filename);

    disp(info);

    ```


    在所示的代码中，`sound` 函数将向量 `y` 作为声音播放。`audiowrite` 函数将具有定义特征的声音写入目录。运行程序后，命令窗口中将出现以下输出。


    ```

    >Example11p3

    Filename: ''C:\...\handel.flac''

    CompressionMethod: ''FLAC''

    NumChannels: 1

    SampleRate: 8192

    TotalSamples: 73113

    Duration: 8.9249

    Title: ''Hallelujah''

    Comment: ''This is my first audio''

    Artist: ''San Antonio''

    BitsPerSample: 24

    >

    ```


    播放的向量可以取 -1 到 +1 之间的值。对于其他数据类型，其范围如表 11-1 所示，最大通道数列于表 11-2 中。


    表 11-2


    依赖于数据的最大通道数


    | 文件格式 | 最大通道数 |

    | --- | --- |

    | WAVE (`.wav`) | 1,024 |

    | OGG (`.ogg`) | 255 |

    | FLAC (`.flac`) | 8 |

    | MPEG-4 AAC (`.m4a`, `.mp4`) | 2 |


    表 11-1


    y 的取值范围（取决于其数据类型）


    | y 的数据类型 | y 的取值范围 |

    | --- | --- |

    | uint8 | 0 ≤ `y` ≤ 255 |

    | int16 | -32768 ≤ `y` ≤ +32767 |

    | int32 | -2³¹ ≤ `y` ≤ 2³¹–1 |

    | single | -1.0 ≤ `y` ≤ +1.0 |

    | double | -1.0 ≤ `y` ≤ +1.0 |


    **示例 11-4.** 编写代码，加载 `handel` 文件进行播放。播放 3 秒后，文件应停止播放，然后继续播放。接着再播放 3 秒，然后停止。


    **解 11-4.** 可以编写以下代码来完成这些任务。


    *Example11p4.m*


    ```

    %Example11p4

    % This code pauses and resumes playing

    load handel;

    player = audioplayer(y, Fs);

    play(player);disp(''playing is on'');

    pause(3);

    pause(player);disp(''playing is paused'');

    pause(3);

    resume(player),disp(''playing is resumed'');

    pause(3);

    stop(player),disp(''playing is off'');

    ```


    在这段代码中，`play` 函数从头开始启动对象 `player`。然后，`pause` 函数在播放 3 秒后暂停音频。同样的 `pause` 函数再保持
    3 秒。`resume` 函数恢复播放，程序再保持 3 秒。最后，`stop` 函数停止播放该对象。运行代码后，命令窗口中将出现以下输出。


    ```

    > Example11p4

    playing is on

    playing is paused

    playing is resumed

    playing is off

    >

    ```


    **示例 11-5.** 编写代码，将 `handel` 文件加载到工作区。然后，代码应反转音频并以反转后的顺序播放。代码还应打印原始音频的前五个数据以及反转后音频的最后五个数据，以检查其准确性。


    **解 11-5.** 可以编写以下代码来完成这些任务。


    *Example11p5.m*


    ```

    %Example11p5

    % This code reverses the hallelujah

    load handel;

    L=length(y);

    y2=zeros(L,1);

    for i=1:L

    y2(L-i+1)=y(i);

    end

    sound(y2,Fs);

    disp(''First 5 Data of Original Handel'');

    disp(y(1:5));

    disp(''Last 5 Data of Reversed Handel'');

    disp(y2(end-4:end));

    ```


    在这段代码中，加载 `handel` 后，`y` 数据的长度被存储到变量 `L` 中。然后，一个新变量 `y2` 被初始化为所有元素为零。接着，`y` 的值以反转顺序存储到
    `y2` 变量中。代码随后播放新数据，并在屏幕上显示所需数据。运行代码后，命令窗口中将出现以下输出。


    ```

    > Example11p5

    First 5 Data of Original Handel


    -0.0062

    -0.0750

    -0.0312

    0.0062

    Last 5 Data of Reversed Handel

    0.0062

    -0.0312

    -0.0750

    -0.0062


    >

    ```

