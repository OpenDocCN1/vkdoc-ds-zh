    **Example 11-1.** Write a program that loads the audio file `handel` to the workspace.
    Then, the program should play the sound.


    **Solution 11-1.** The following code can be used to accomplish the given task.


    *Example11p1.m*


    ```

    %Example11p1

    %This code plays hallelujah

    load handel;

    p = audioplayer(y, Fs);

    play(p)

    ```


    As shown, once the `handel` file is loaded, variables of *y* and *Fs* are loaded
    into the workspace. The variable *y* is the played signal, and *Fs* is the sample
    rate. The `audioplayer` function creates an `audioplayer` object for the signal
    *y,* and that object is assigned to the variable *p*. Then in the final row, using
    the command `play`, the *p* variable that has the sound is played.


    To find information about a sound file, such as number of samples, number of channels,
    and so on, you can use the `audioinfo` as illustrated here.


    ```

    > info = audioinfo(''Adele.mp3'')

    info =

    struct with fields:

    Filename: ''C:\...\Adele.mp3''

    CompressionMethod: ''MP3''

    NumChannels: 2

    SampleRate: 44100

    TotalSamples: 12569472

    Duration: 285.0220

    Title: ''Someone Like You''

    Comment: []

    Artist: ''Adele''

    BitRate: 192

    >

    ```


    **Example 11-2.** Write a program that records your voice for 8 seconds with a
    sampling rate of 22,050 Hz, 16 bits with 2 channels. Then, the program should
    play the recorded sound and plot the graph of the recorded file.


    **Solution 11-2.** The following code can be written to accomplish these tasks.


    *Example11p2.m*


    ```

    %Example11p2

    % This records your voice for 8 seconds.

    RecorderVar = audiorecorder(22050, 16, 2);

    disp(''Start speaking now'')

    recordblocking(RecorderVar, 8);

    disp(''End of Recording'');

    play(RecorderVar); % Playing

    % Store data in double-precision array.

    RecordData = getaudiodata(RecorderVar);

    plot(RecordData); % plotting the sound

    ```'
