    An indexed image is composed of an array and a colormap matrix. The colormap matrix
    is an *m* × 3 matrix of class `double`, where its elements range from 0 to 1\.
    Each element in the array points to one of the rows in the colormap matrix to
    set the color of the images. The relationship between a colormap matrix and an
    array matrix is clearly shown in Figure [10-4](#483991_1_En_10_Chapter.xhtml#Fig4).


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig4_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig4_HTML.jpg)


    Figure 10-4


    An indexed image with pixel values, index number, and colormap


    ### Truecolor (RGB) Images


    Truecolor images are sometimes called RGB (Red-Green-Blue) images, as well. They
    are composed of three matrices, each one of which is of size *n* × *m*. Accordingly,
    for a truecolor image (`n, m, 1`) shows the values for red, (`n, m, 2`) shows
    the values for green, and `(n, m, 3)` shows the values for blue. A combination
    of these three matrices determines the color of the truecolor (RGB) image. The
    array representing a truecolor image can be of class `uint8`, `uint16`, `single`,
    or `double`, where the pixel values specify the intensity values.


    Obviously, RGB images represent the colors directly, rather than mapping the pixel
    values to a colormap matrix.


    **Example 10-1.** Write a program that reads the pixel values of a truecolor image
    in the file named `peppers.png`. Then, take the transpose of red, green, and blue
    colors. Display the modified data as a new image.


    **Solution 10-1.** The following code can be used to accomplish the given task.


    *Example10p1.m*


    ```

    %Example10p1

    %This code takes the transpose of RGB

    RGB = imread(''peppers.png'');

    subplot(211);imshow(RGB)

    New_RGB(:,:,1) = RGB(:,:,1)'';

    New_RGB(:,:,2) = RGB(:,:,2)'';

    New_RGB(:,:,3) = RGB(:,:,3)'';

    subplot(212);imshow(New_RGB)

    ```


    This code reads the image `peppers.png` by using the `imread` command . Then the
    original image is shown in the first row of a figure. After that, transposes of
    each color—R, G, and B—are taken and assigned to a new variable named `New_RGB`.
    Finally, in the second row of the figure, the modified image is shown with the
    `imshow` function .


    Once the code is executed, the image shown in Figure [10-5](#483991_1_En_10_Chapter.xhtml#Fig5)
    appears .


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig5_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig5_HTML.jpg)


    Figure 10-5


    Output of Example10p1


    As you can see from Figure [10-5](#483991_1_En_10_Chapter.xhtml#Fig5), the colors
    are preserved, but the direction of the image is altered .


    ## Converting Image Types and Formats


    Sometimes we might need to convert an image from one type to another. During this
    conversion, though, we might lose the quality of the original image.


    There are several functions available for the conversion between class types,
    some of which are given in Table [10-1](#483991_1_En_10_Chapter.xhtml#Tab1).


    Table 10-1


    Useful Functions for Converting Class Types


    | Function | Explanation |

    | --- | --- |

    | im2double | Converts image to double precision |

    | im2int16 | Converts image to 16-bit signed integers |

    | im2single | Converts image to single precision |

    | im2uint16 | Converts image to 16-bit unsigned integers |

    | im2uint8 | Converts image to 8-bit unsigned integers |


    Table [10-2](#483991_1_En_10_Chapter.xhtml#Tab2) provides a list of some of the
    useful functions for converting image types.


    Table 10-2


    Useful Functions for Converting Image Types


    | Function | Explanation |

    | --- | --- |

    | im2bw | Converts image to a binary image |

    | ind2gray | Converts indexed image to grayscale image |

    | gray2ind | Converts grayscale or binary image to indexed image |

    | rgb2gray | Converts RGB image or colormap to grayscale |

    | ind2rgb | Converts indexed image to RGB image |


    There are several functions for reading, writing, and performing other operations
    related to images, some of which are listed in Table [10-3](#483991_1_En_10_Chapter.xhtml#Tab3).


    Table 10-3


    Useful Functions Related to Images


    | Function | Explanation |

    | --- | --- |

    | imread | Reads image from graphics file |

    | imwrite | Writes image to graphics file |

    | imfinfo | Gives information about graphics file |

    | frame2im | Returns image data associated with movie frame |

    | im2frame | Converts image to movie frame |


    Images can be saved in a different format using the `imwrite` function .


    **Example 10-2.** Write a program that reads the image from the file `moon.tif`.
    Then, convert this image into`.jpg` format.


    **Solution 10-2.** First, the following code reads the image. Then, the image
    is written in the target file format.


    *Example10p2.m*


    ```

    %Example10p2

    %This code converts jpg to png format

    Cowboy = imread(''Cowboys2.jpg'');

    imwrite(Cowboy,''Cowboys2.png'');

    Cowboy_png = imread(''Cowboys2.png'');

    imshow(Cowboy_png)

    ```


    Once the code is executed, the image shown in Figure [10-6](#483991_1_En_10_Chapter.xhtml#Fig6)
    is the result.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig6_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig6_HTML.jpg)


    Figure 10-6


    Image converted from `.jpg` to `.png`'
