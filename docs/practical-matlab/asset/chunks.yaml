- fmt: '# Electrical Currents


    In this section, we learn how to find currents in an electrical network using
    an example. In addition, we examine how to find currents in an RL circuit considering
    Kirchhoff’s laws.


    ## Example 9-5

    Consider an electrical network containing eight resistors and two batteries shown
    in Figure 9-6. Find the currents `x`, `y`, and `z` flowing through the loops.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig6_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig6_HTML.jpg)


    *Figure 9-6 An electrical network*


    ### Solution 9-5

    To find the currents passing through the loops, we write down the equations for
    each loop as following.


    ![$$ \left\{\begin{array}{c}90x-20y-30z=40\\ {}-20x+65y-40z=0\\ {}-30x-40y+150z=500\end{array}\right.
    $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ15.png) (15)


    The following code can be used to solve this system of equations.


    *Example9p5.m*

    ```

    %Example9p5

    %This code finds currents

    %for an electrical network

    A=[90 -20 -30;-20 65 -40;-30 -40 150];

    B=[40;0;500];

    Sol=(A)\B;

    disp([''x='',num2str(Sol(1))]);

    disp([''y='',num2str(Sol(2))]);

    disp([''z='',num2str(Sol(3))]);

    ```


    Once the code is executed, we obtain the following output.

    ```

    > Example9p5

    x=3

    y=4

    z=5

    >

    ```


    An electrical circuit can have a variety of components, including a switch, a
    voltage source (V), a resistor (R), and an inductor (L), as illustrated in Figure
    9-7.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig7_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig7_HTML.jpg)


    *Figure 9-7 An RL network*


    The following is the governing equation of the network shown in Figure 9-7.


    ![$$ L\frac{di}{dt}+ Ri=V $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ16.png)
    (16)


    The solution of Equation (16) is


    ![$$ i=\frac{V}{R}\Big(1-\exp \left(-R\ast \frac{t}{L}\right) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ17.png)
    (17)


    ## Example 9-6

    For an RL network, coefficients are given as `V` = 2 Volt, `R` = 1 Ohm; `L` =
    1/2 Henry, 0 ≤ `time` ≤ 5. Write code to simulate the values of current `i` with
    respect to time.


    ### Solution 9-6

    The following code can be used to accomplish the given task.


    *Example9p6.m*

    ```

    %Example9p6

    %This code plots current values

    t=0:0.05:5;

    V=2;R=1;L=1/2;

    i=(V/R)*(1-exp(-R.*t/L));

    plot(t,i,''bo'');grid on;

    xlabel(''t'');ylabel(''current'');

    title(''Current with time'');

    ```


    Once the code is executed, the output shown in Figure 9-8 is displayed.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig8_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig8_HTML.jpg)


    *Figure 9-8 Values of current in Example 9-6*


    # Harmonic Analysis


    Periodic signals can be represented with a sum of sine and cosine waves using
    a Fourier series. Computing such signals is called *harmonic analysis*. At this
    point, we need to remember the definition of a Fourier series.


    ## Remark 9-3

    Suppose that for all `x` values, `f(x)` is defined having period as 2L, meaning
    that `f(x) = f(x + 2L)`. Then the Fourier series of `f(x)` is


    ![$$ \boldsymbol{f}\left(\boldsymbol{x}\right)\sim \frac{{\boldsymbol{a}}_{\mathbf{0}}}{\mathbf{2}}+\sum
    \limits_{\boldsymbol{n}=\mathbf{1}}^{\infty}\left({\boldsymbol{a}}_{\boldsymbol{n}}\mathbf{\cos}\left(\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}}\right)+{\boldsymbol{b}}_{\boldsymbol{n}}\mathbf{\sin}\left(\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}}\right)\right). $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ18.png)
    (18)


    Here, `a[n]` and `b[n]` are called the *Fourier coefficients* where


    ![$$ {\boldsymbol{a}}_{\boldsymbol{n}}=\frac{1}{L}{\int}_{-L}^Lf(x)\mathit{\cos}\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}} dx $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ19.png)
    (19)


    and


    ![$$ {b}_{\boldsymbol{n}}=\frac{1}{L}{\int}_{-L}^Lf(x)\mathit{\sin}\frac{\boldsymbol{n}\boldsymbol{\pi
    } \boldsymbol{x}}{\boldsymbol{L}} dx $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ20.png)
    (20)


    for `n` = 1, 2, 3, …


    ## Example 9-7

    Coefficients of a signal `f(x)` as defined in Equations (18), (19), and (20) are
    given as `L = 2`, `a[0] = 0`, `a[n] = 0`, and ![$$ {b}_{\boldsymbol{n}}=\left\{\begin{array}{c}\frac{4}{n\pi},n\
    is\ odd\\ {}0,n\ is\ even\ \end{array}\right. $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_IEq6.png).
    Calculate the signal `f(x)` for `n` = 49 as in Equation (18). Then plot the graphic
    of the signal `f(x)` where −2`π` ≤ `x` ≤ 2`π`.


    ### Solution 9-7

    If we plug the given `a[0]`, `a[n]`, and `b[n]` into Equation (18), we get the
    following:


    ![$$ f(x)=\frac{4}{\pi}\left(\mathit{\sin}\frac{\pi x}{2}+\frac{1}{3}\mathit{\sin}\frac{3\pi
    x}{2}+\frac{1}{5}\mathit{\sin}\frac{5\pi x}{2}+\frac{1}{7}\mathit{\sin}\frac{7\pi
    x}{2}+\dots \right) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ21.png)
    (21)


    Therefore, we need to calculate Equation (21) for `f(x)` having 49 terms in it.
    The following code can be used to get the graph of `f(x)`.


    *Example9p7.m*

    ```

    %Example9p7

    %This code plots graph of a signal

    n=49;Point=1000;

    x=linspace(-2*pi,2*pi,Point);

    bn=zeros(1,Point);a0=0*bn;an=0*bn;

    for i=1:2:n

    Calc=(1/i).*sin((i*pi.*x)/2);

    bn = bn + Calc;

    end

    bn=(4/pi)*bn;fx=a0+an+bn;

    plot(x,fx);grid on;axis(''equal'');

    xlabel(''x'');ylabel(''signal'');

    title(''Square Wave Signal'');

    ```


    Once the code is executed, the output is shown in Figure 9-9.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig9_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig9_HTML.jpg)


    *Figure 9-9 Output of Example 9-7*


    As shown in Figure 9-9, the signal is the square wave signal. The period of the
    signal is 4 (`L` = 2). If `n` is picked higher in the code, the image will look
    like exactly a square wave.'
