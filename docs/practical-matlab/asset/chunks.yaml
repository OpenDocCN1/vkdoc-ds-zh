    ## 颜色处理


    颜色是一种物理特征，由人眼看到的、不同频率的光线组合而成。不同科学家提出了多种定义，但为简洁起见，此处不赘述。


    在 MATLAB 中，有 HSV、RGB、YIQ（由美国国家电视系统委员会即 NTSC 定义）、YCbCr 和 L*a*b* 等颜色空间。不过，操作主要是在
    RGB 空间中进行的。对于其他颜色空间，存在 RGB 与其他空间之间的转换函数，例如 `rgb2hsv`、`rgb2ntsc`、`rgb2ycbcr` 和
    `lab2rgb`。你可以在 MATLAB 命令窗口中输入 `help` 并加上这些函数名之一，以获取该函数的更多信息。


    在本节中，我们将使用 RGB 颜色。


