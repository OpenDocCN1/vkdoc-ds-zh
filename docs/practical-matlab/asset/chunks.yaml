    In this section, we use an image function, `imagesc`, to represent vehicle traffic
    with color. In other words, we color different sections of the road to represent
    traffic flow.


    **Example 5-8.** Write code to show a flow for a vehicle where the width and length
    of the road are 5 and 20 units, respectively.


    **Solution 5-8.** The following code can be used to accomplish the given tasks.


    *Example5p8.m*


    ```

    %Example5p8

    %This code shows traffic flow

    rw=5;%road width

    rl=25;%road length

    road = zeros(rw,rl);

    xpos=2;ypos=4;

    road(ypos,xpos)=1;

    imagesc(road)

    axis equal

    for t=0:20

    %clear previous vehicle

    road(ypos,xpos)=0;

    %update new position

    xpos=xpos +1;

    road(ypos,xpos)=1;

    %plot new position

    imagesc(road)

    Time=sprintf(''Time: %i'',t);

    title(Time)

    axis equal;

    pause(0.4);

    end

    ```


    As shown in the code, after moving to the right side in each iteration, the color
    of the vehicle road is assigned to 0. To move forward, the color of the road is
    assigned to 1. And each time, the colors are displayed with the `imagesc` function.
    This is done to display a traffic flow in a graphic form. Between each frame,
    the computer waits 0.4 seconds to see the simulation slowly.


    Figure [5-3](#483991_1_En_5_Chapter.xhtml#Fig3) shows the final frame of the simulation
    done with the code.


