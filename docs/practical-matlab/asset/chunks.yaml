    y=2*sin(4*t)+cos(6*t-2);

    plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''A Periodic Signal'');

    ```


    Once the code is executed, we see the output shown in Figure [9-4](#483991_1_En_9_Chapter.xhtml#Fig4).


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig4_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Graph of *y*(*t*) = 2*sin*(4*t*) + *cos*(6*t* − 2) signal


    Obviously, as shown in Figure [9-4](#483991_1_En_9_Chapter.xhtml#Fig4), the signal
    repeats itself after every π period.


    ### Even and Odd Signals


    A continuous time signal *y*(*t*) is called *even* if it satisfies the following
    equality.


    ![$$ y\left(-t\right)=y(t) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ11.png)


    (11)


    and it is called *odd* if it satisfies the following:


    ![$$ y\left(-t\right)=-y(t) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ12.png)


    (12)


    In a similar manner, a discrete time signal *y*[*t*] is called even if it satisfies
    the following:


    ![$$ y\left[-t\right]=y\left[t\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ13.png)


    (13)


    and it is called odd if it satisfies the following:


    ![$$ y\left[-t\right]=-y\left[t\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ14.png)


    (14)


    **Example 9-4.** For the given CT signal *y*(*t*) = *sin*²(*t*) + cos(*t*) + 1,
    write a code to see whether the signal is even or odd over the graphic. Both graphics
    of *y*(*t*), and *y*(−*t*) should be shown on the same figure.


    **Solution 9-4.** The following code can be used to accomplish the given task.


    *Example9p4.m*


    ```

    %Example9p4

    %This code plots an even signal

    t = -pi:0.001:pi;

    y=(sin(t)).^2+cos(3*t)+1;

    subplot(121);plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''Signal of y(t)'');

    t = -t;

    y=(sin(t)).^2+cos(3*t)+1;

    subplot(122);plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''Signal of y(-t)'');

    ```


    Once the code is executed, we obtain the output shown in Figure [9-5](#483991_1_En_9_Chapter.xhtml#Fig5).


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig5_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Graph of *y*(*t*) = *sin*²(*t*) + *cos*(*t*) + 1 signal


    Figure [9-5](#483991_1_En_9_Chapter.xhtml#Fig5) shows that both drawings are exactly
    the same, which indicates that the signal is an even signal.'
  trans: '

    # 模拟信号和数字信号


    从信号的幅度来考虑，信号可分为模拟信号和数字信号。*模拟信号*是一种连续波，能够在一段时间内保持其变化。而*数字信号*的幅度值个数是有限的，这些值既非连续也无无限多。此外，模拟信号的波形类似正弦函数，而数字信号的波形则像方波。


    模拟信号的例子有声音、音乐、温度以及空气中的 Wi-Fi 信号。数字信号的例子则包括录制在 CD 上的声音、数字温度计以及 MP3 播放器中的音乐。


    # 周期信号和非周期信号


    经过一段时间后能重复自身的信号称为*周期信号*。在一段时间内不重复自身的信号则称为非周期信号或*非周期信号*。


    如果满足以下等式，则连续时间信号 `y(t)` 被称为周期信号。


    ![$$ y(t)=y\left(t+{T}_0\right) $$](img/483991_1_En_9_Chapter_TeX_Equ3.png)


    (3)


    对所有 `t` 和正常数 `T0` 成立。


    类似地，如果满足以下等式，则离散时间信号 `y[t]` 被称为周期信号。


    ![$$ y\left[t\right]=y\left[t+{T}_0\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ4.png)


    (4)


    对所有 `t` 和正常数 `T0` 成立。


    **注释 9-1.** 假设 `y(t)` 是代表连续信号的函数。那么如果


    ![$$ y(t)=k\ast {\sin}^n\left( at+b\right), $$](img/483991_1_En_9_Chapter_TeX_Equ5.png)


    (5)


    或者


    ![$$ y(t)=k\ast {\cos}^n\left( at+b\right), $$](img/483991_1_En_9_Chapter_TeX_Equ6.png)


    (6)


    那么，信号 `y(t)` 的周期 `T0` 为


    ![$$ {T}_0=\left\{\begin{array}{c}\frac{2\uppi}{\mid a\mid },\mathrm{if}\ n\ \mathrm{is}\
    \mathrm{an}\ \mathrm{odd}\ \mathrm{integer}\\ {}\frac{\uppi}{\mid a\mid },\mathrm{if}\
    n\ \mathrm{is}\ \mathrm{an}\ \mathrm{even}\ \mathrm{integer}\end{array}\right.
    $$](img/483991_1_En_9_Chapter_TeX_Equ7.png)


    (7)


    在方程 (5) 和 (6) 中，常数 `k`、`a` 和 `b` 均为实数，且 `n` 应为整数。在方程 (7) 中，`|a|` 是 `a` 的绝对值。


    **注释 9-2.** 假设 `y(t)` 是代表连续信号的函数。那么如果


    ![$$ y(t)=k\ast {\tan}^n\left( at+b\right), $$](img/483991_1_En_9_Chapter_TeX_Equ8.png)


    (8)


    或者


    ![$$ y(t)=k\ast {\cot}^n\left( at+b\right), $$](img/483991_1_En_9_Chapter_TeX_Equ9.png)


    (9)


    那么，信号 `y(t)` 的周期 `T0` 为


    ![$$ {T}_0=\frac{\uppi}{\mid a\mid } $$](img/483991_1_En_9_Chapter_TeX_Equ10.png)


    (10)


    在方程 (8) 和 (9) 中，常数 `k`、`a` 和 `b` 均为实数，且 `n` 应为整数。


    **示例 9-2.** 定义了一个连续时间信号 `y(t) = 5*sin³(4*t − 1)`。求该信号的周期。然后编写代码绘制该信号在 `−2*π ≤
    t ≤ 2*π` 范围内的图形。


    **解答 9-2.** 在该示例中，信号是连续信号。因此，我们可以使用注释 9-1 来求周期。我们看到 `n = 3`，是一个奇数，并且 `a = 4`。那么
    `T0 = (2π) / |4| = π / 2`。


    以下代码可用来完成给定任务。


    *Example9p2.m*


    ```

    %Example9p2

    %This code has a periodic signal

    t = -2*pi:0.001:2*pi;

    y=5*(sin(4*t-1)).³;

    plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''A Periodic Signal'');

    ```


    代码运行后，输出结果如图 9-3 所示。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig3_HTML.jpg](img/483991_1_En_9_Fig3_HTML.jpg)


    **图 9-3** `y(t) = 5*sin³(4*t − 1)` 的图形


    如图 9-3 所示，该信号每隔 `π/2` 重复自身。


    **示例 9-3.** 定义了一个连续时间信号 `y(t) = 2*sin(4*t) + cos(6*t − 2)`。求该信号的周期。然后编写代码绘制该信号在
    `−π ≤ t ≤ π` 范围内的图形。


    **解答 9-3.** 在该示例中，信号是将正弦函数与余弦函数相加。我们将分别计算这两个函数的周期。然后求出这两个周期的最小公倍数。我们将正弦项的周期定义为
    `T0`，余弦项的周期定义为 `T1`。然后根据注释 9-1，可得 `T0 = (2π) / |4| = π/2`，`T1 = (2π) / |6| = π/3`。那么
    `最小公倍数(π/2, π/3) = π`。该信号的图形周期应为 `π`。


    以下代码可用来完成给定任务。


    *Example9p3.m*


    ```

    %Example9p3

    %This code has a periodic signal

    t = -pi:0.001:pi;

    y=2*sin(4*t)+cos(6*t-2);

    plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''A Periodic Signal'');

    ```


    代码执行后，我们得到如图 9-4 所示的输出。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig4_HTML.jpg](img/483991_1_En_9_Fig4_HTML.jpg)


    **图 9-4** `y(t) = 2*sin(4*t) + cos(6*t − 2)` 信号的图形


    显然，如图 9-4 所示，该信号每隔 `π` 周期重复自身。


    # 偶信号和奇信号


    如果满足以下等式，则连续时间信号 `y(t)` 被称为*偶信号*。


    ![$$ y\left(-t\right)=y(t) $$](img/483991_1_En_9_Chapter_TeX_Equ11.png)


    (11)


    如果满足以下等式，则被称为*奇信号*。


    ![$$ y\left(-t\right)=-y(t) $$](img/483991_1_En_9_Chapter_TeX_Equ12.png)


    (12)


    类似地，如果满足以下等式，则离散时间信号 `y[t]` 被称为偶信号。


    ![$$ y\left[-t\right]=y\left[t\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ13.png)


    (13)


    如果满足以下等式，则被称为奇信号。


    ![$$ y\left[-t\right]=-y\left[t\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ14.png)


    (14)


    **示例 9-4.** 对于给定的连续时间信号 `y(t) = sin²(t) + cos(t) + 1`，编写代码通过图形判断该信号是偶信号还是奇信号。`y(t)`
    和 `y(−t)` 的图形应显示在同一张图中。


    **解答 9-4.** 以下代码可用来完成给定任务。


    *Example9p4.m*


    ```

    %Example9p4

    %This code plots an even signal

    t = -pi:0.001:pi;

    y=(sin(t)).²+cos(3*t)+1;

    subplot(121);plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''Signal of y(t)'');

    t = -t;

    y=(sin(t)).²+cos(3*t)+1;

    subplot(122);plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''Signal of y(-t)'');

    ```


    代码执行后，我们得到如图 9-5 所示的输出。


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig5_HTML.jpg](img/483991_1_En_9_Fig5_HTML.jpg)


    **图 9-5** `y(t) = sin²(t) + cos(t) + 1` 信号的图形


    图 9-5 显示两个图形完全相同，这表明该信号是偶信号。

