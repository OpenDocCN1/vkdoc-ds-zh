- fmt: '### Model with Three Species


    There exists a modified Lotka-Volterra model for three species. This model has
    a system of three equations.


    ![$$ \frac{dA}{dt}=\gamma A-\alpha A B; $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ4.png)


    (4)


    ![$$ \frac{dB}{dt}=-\delta B+\beta AB- eBC; $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ5.png)


    (5)


    ![$$ \frac{dC}{dt}=- fC+ gBC. $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ6.png)


    (6)


    Here `C` is another type of organism besides `A` and `B`, which were introduced
    in the previous section. `C` can hunt the predator `B` when there is an interaction.
    The population of organism `C` can go down with the absence of predators. According
    to Equations [4](#483991_1_En_8_Chapter.xhtml#Equ4), [5](#483991_1_En_8_Chapter.xhtml#Equ5),
    and [6](#483991_1_En_8_Chapter.xhtml#Equ6), there is no interaction between organisms
    `A` and `C`.


    **Example 8-9.** For the given Equations [4](#483991_1_En_8_Chapter.xhtml#Equ4),
    [5](#483991_1_En_8_Chapter.xhtml#Equ5), and [6](#483991_1_En_8_Chapter.xhtml#Equ6),
    write code to simulate the population sizes for predators, prey, and the third
    organism with respect to time. The initial population is 100 for all three organisms.
    Time span will be from 0 to 60. Other coefficients are given as `γ` = 0.4, `α`
    = 0.4, `δ` = 2.0, `β` = 0.2, `e` = 0.2, `f` = 0.1, and `g` = 0.15.


    **Solution 8-9.** The following code can be used to accomplish the given tasks.


    `Example8p9.m`


    ```

    %Example8p9

    %Lotka-Volterra eqns with 3 species

    clear all;close all;

    y0 = [100;100;100];%initial populations

    [t,x] = ode45(@LVfunc2,[0 60],y0);

    A = x(:,1);%Prey

    B = x(:,2);%Predator

    C = x(:,3);%3rd Organism

    figure(''Name'',''Predator-Prey Model'',...

    ''NumberTitle'',''off'',''MenuBar'', ''none'');

    plot(t,A,''-o'',t,B,''r-'',t,C,''gx'');grid on;

    legend(''Preys'',''Predators'',''3rd organism'');

    title(''Population Along With Time'')

    xlabel(''Time'');ylabel(''Population'');

    ```


    `LVfunc2.m`


    ```

    function dxdt = LVfunc2(t,x)

    dxdt=[0;0;0]; gama = 0.4; alpha = 0.4;

    delta = 2.0; beta = 0.2;

    e=0.2;f=0.1;g=0.15;

    dxdt(1)=gama*x(1)-alpha*x(1)*x(2);%prey

    dxdt(2)=-delta*x(2)+beta*x(1)*x(2)-...

    e*x(2)*x(3);%predators

    dxdt(3)=f*x(2)*x(3)-g*x(3);%3rd organism

    end

    ```


    Once the code is run, the output in Figure [8-8](#483991_1_En_8_Chapter.xhtml#Fig8)
    is displayed.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig8_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig8_HTML.jpg)


    Figure 8-8


    Populations of three species


    In Figure [8-8](#483991_1_En_8_Chapter.xhtml#Fig8), we can see the long run of
    populations. By just looking at this output, we can say that populations of prey
    and the third organism decrease over time. This picture is misleading, however.
    If we increase the final time from 60 to 100, we see that the bars for each organism
    stabilize, and they behave predictably after a certain amount of time. We can
    see this scenario in Figure [8-9](#483991_1_En_8_Chapter.xhtml#Fig9), where the
    final time is entered as 200.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig9_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig9_HTML.jpg)


    Figure 8-9


    Populations of three species at the outset


    For the very beginning of the dynamics, we can take a look at the output in Figure
    [8-10](#483991_1_En_8_Chapter.xhtml#Fig10).


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig10_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig10_HTML.jpg)


    Figure 8-10


    Population of three species at the outset


    ## Epidemic Models


    In this section, epidemic models of SI, SIS, SIR, SIRS, and HIV dynamics are presented.


    ### SI Epidemic Model


    In this epidemic model , there exist two different stages, susceptible (`S`),
    and infected (`I`). The total population of both organisms should be equal to
    the total population size, `N`. In other words,


    ![$$ S(t)+I(t)=N. $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ7.png)


    (7)


    The SI model without considering births and deaths has the following form:


    ![$$ \frac{dS}{dt}=-\frac{\beta }{N} SI, $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ8.png)


    (8)


    ![$$ \frac{dI}{dt}=\frac{\beta }{N} SI. $$](images/483991_1_En_8_Chapter/483991_1_En_8_Chapter_TeX_Equ9.png)


    (9)


    Here, `β/N SI` represents the number of infections due to infected individuals
    at a given time, and `β` is the contact rate by an infected person at a given
    time.


    **Example 8-10.** For the given Equations [7](#483991_1_En_8_Chapter.xhtml#Equ7),
    [8](#483991_1_En_8_Chapter.xhtml#Equ8), and [9](#483991_1_En_8_Chapter.xhtml#Equ9),
    write code to simulate the population sizes of SI stages with respect to time.
    The initial populations are 9 for susceptible, and 1 for the infected group, making
    the total population 10. Time span will be from 0 to 10, and `β` = 0.9.


    **Solution 8-10.** The following code can be used to accomplish the given tasks.


    `Example8p10.m`


    ```

    %Example8p10

    %This code solves SI model

    [t,x]=ode45(@SI,[0,10],[9,1]);

    plot(t,x);grid on;

    xlabel(''time'');title(''SI Model'');

    ylabel(''population'');

    legend(''Susceptible'',''Infected'',''Recovered'');

    function Si=SI(t,x)

    beta=.9;N=10;

    %x(1)=susceptible group

    Si(1,:)=-(beta/N)*x(1)*x(2);

    %x(2)=exposed by infection

    Si(2,:)=(beta/N)*x(1)*x(2);

    end

    ```


    Once the code is run, the output shown in Figure [8-11](#483991_1_En_8_Chapter.xhtml#Fig11)
    is displayed.


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig11_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig11_HTML.jpg)


    Figure 8-11


    Dynamics of SI model


    As shown in Figure [8-11](#483991_1_En_8_Chapter.xhtml#Fig11), the infected population
    starts with 1 person, and at the end, all populations have become infected. Conversely,
    the susceptible population starts with 9 persons and is reduced to 0 at the end
    of 10 days as everybody went from the `S` to `I` stage. In this model, everyone
    becomes infected when time goes to infinity. Therefore, it can be concluded that
    this model is more suitable for highly infectious diseases.'
