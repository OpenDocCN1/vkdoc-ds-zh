    **Example 10-17.** Write code that multiplies every channel with different coefficients
    of the `peppers.png` image. The first coefficients of the red, green, and blue
    channels are 1/3, 2/3, and 3/3; the second coefficients are 2/3, 3/3, and 1/3;
    and the last coefficients are 3/3, 1/3, and 2/3. After each channel is calculated
    with the given coefficients, channels should be combined to represent an RGB image.
    Therefore, there should be three color images obtained from different coefficients.
    The code should show three all of these images and the original image in one figure.


    **Solution 10-17.** To keep the calculations for each channel, we can create a
    four-dimensional array. In this array, the first two dimensions belong to pixel
    values of each channel. The third dimension can keep the values for R, G, and
    B. The last dimension can keep the values with given coefficients. The following
    code can be used to accomplish the given task.


    *Example10p17.m*


    ```

    %Example10p17

    %In code, channels different coefficients

    RGB=imread(''peppers.png'');

    New(:,:,1,1)=RGB(:,:,1)*(1/3);

    New(:,:,2,1)=RGB(:,:,2)*(2/3);

    New(:,:,3,1)=RGB(:,:,3)*(3/3);

    New(:,:,1,2)=RGB(:,:,1)*(2/3);

    New(:,:,2,2)=RGB(:,:,2)*(3/3);

    New(:,:,3,2)=RGB(:,:,3)*(1/3);

    New(:,:,1,3)=RGB(:,:,1)*(3/3);

    New(:,:,2,3)=RGB(:,:,2)*(1/3);

    New(:,:,3,3)=RGB(:,:,3)*(2/3);

    subplot(221),imshow(RGB);

    title(''Original Image'');

    subplot(222),imshow(mat2gray(New(:,:,:,1)));

    title(''Image with R*(1/3)-G*(2/3)-B*1'');

    subplot(223),imshow(mat2gray(New(:,:,:,2)));

    title(''Image with R*(2/3)-G*(1)-B*(1/3)'');

    subplot(224),imshow(mat2gray(New(:,:,:,3)));

    title(''Image with R*(1)-G*(1/3)-B*(2/3)'');

    ```


    Once the code is run, the images shown in Figure [10-22](#483991_1_En_10_Chapter.xhtml#Fig22)
    are obtained in the command window.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig22_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig22_HTML.jpg)


    Figure 10-22


    Output of Example 10-17


    ## Image Segmentation


    Image segmentation is the process of partitioning an image into constituent parts,
    or dividing an image into different regions. Generally, pixels that belong to
    the same segment are expected to have similar pixel values, and are thus expected
    to form a connected region. Common techniques for segmentation are thresholding,
    edge detection, and region-based methods.


    ### Thresholding


    Assigning zero or one to each pixel of a grayscale image considered an exact point
    or points is called thresholding. There are two types of thresholding: single
    and double.'
