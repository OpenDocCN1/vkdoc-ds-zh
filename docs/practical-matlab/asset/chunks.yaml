    \ to taking this course. Although a background in any programming language might\
    \ help to grasp the algorithms used in the examples, it is not a prerequisite.\
    \ The book is also a practical resource and textbook for individual learners.\
    \ It provides 152 illustrative and instructive examples including the solutions\
    \ along with the codes.\n\nSource code for this book is accessible via the Download\
    \ Source Code button located at [`www.apress.com/9781484252802`](http://www.apress.com/9781484252802).\n\
    \n# Acknowledgments\n\nI would like to mention and thank a few people who helped\
    \ me in the preparation of this book. I especially thank Steve Anglin, Associate\
    \ Editorial Director of Apress, who allowed me the honor of authoring this book.\
    \ I also gratefully thank Mark Powers, Editorial Operations Manager of Apress,\
