    # 11. 声音处理导论


    在 MATLAB 中，可以录制、收听或处理声音或音频文件。本章介绍一些用于音频文件的基本功能，包括使用正弦函数作为声音。利用音频工具箱和其他工具箱，可以实现复杂的演示。不过，本章中的示例考虑到了读者可能没有在
    MATLAB 中安装这些工具箱。


    声音以波的形式在空气中传播。声音是一种连续信号，可以数字化为离散信号。声波以一定的频率被录制，该频率通常指每秒采集的样本数，单位为赫兹（Hz）。频率在 20
    到 20,000 赫兹之间的声音构成了人类的听觉范围。


    要录制和收听声音文件，系统上应安装了麦克风和扬声器。要确定你是否拥有这些设备，请在提示符下输入命令`audiodevinfo`。


    ```

    > info = audiodevinfo

    info =

    input: [1x2 struct]

    output: [1x2 struct]

    >

    ```


    在上述代码中，变量`info`是一个包含两个字段的结构。若要查看`info`中第一个数据的内容，你可以在提示符下输入以下命令。


    ```

    > openvar info.input

    ```


    然后，将打开如图 11-1 所示的窗口。


    ![../images/483991_1_En_11_Chapter/483991_1_En_11_Fig1_HTML.jpg](img/483991_1_En_11_Fig1_HTML.jpg)


    图 11-1 麦克风信息


    如果你的操作系统语言不是英语，你可能会看到与图 11-1 类似的输出。该显示表明我们有一个可用于在 MATLAB 中录制声音的麦克风。为此，我们使用`audiorecorder`函数。使用`audiorecorder`，我们可以创建一个
    8000 Hz、8 位、单声道的音频录制器文件。也可以更改这些默认值。可能的位数包括 8、16 和 24。声道数应为 1（单声道）或 2（立体声）。


    **示例 11-1.** 编写一个程序，将音频文件`handel`加载到工作区。然后，程序应播放该声音。


    **解法 11-1.** 以下代码可用于完成给定的任务。


    *Example11p1.m*


    ```

    %Example11p1

    %此代码播放哈利路亚

    load handel;

    p = audioplayer(y, Fs);

    play(p)

    ```


    如图所示，一旦加载了`handel`文件，变量`y`和`Fs`就会被加载到工作区。变量`y`是播放的信号，而`Fs`是采样率。`audioplayer`函数为信号`y`创建一个`audioplayer`对象，并将该对象赋值给变量`p`。然后在最后一行，使用命令`play`播放包含声音的变量`p`。


    要查找声音文件的信息，例如样本数量、声道数等，你可以使用如下所示的`audioinfo`函数。


    ```

    > info = audioinfo(''Adele.mp3'')

    info =

    struct with fields:

    Filename: ''C:\...\Adele.mp3''

    CompressionMethod: ''MP3''

    NumChannels: 2

    SampleRate: 44100

    TotalSamples: 12569472

    Duration: 285.0220

    Title: ''Someone Like You''

    Comment: []

    Artist: ''Adele''

    BitRate: 192

    >

    ```


    **示例 11-2.** 编写一个程序，以 22050 Hz 的采样率、16 位、2 声道录制你的声音 8 秒钟。然后，程序应播放录制的声音并绘制录制文件的图表。


    **解法 11-2.** 可以编写以下代码来完成这些任务。


    *Example11p2.m*


    ```

    %Example11p2

    % 此程序录制你的声音 8 秒钟。

    RecorderVar = audiorecorder(22050, 16, 2);

    disp(''现在开始说话'')

    recordblocking(RecorderVar, 8);

    disp(''录制结束'');

    play(RecorderVar); % 播放

    % 将数据存储为双精度数组。

    RecordData = getaudiodata(RecorderVar);

    plot(RecordData); % 绘制声音图形

    ```

