    名为 `Calculator1.m` 的 GUI 概览


    需要为 GUI 上的每个按钮编写回调函数。每个按钮都以其名称作为标签。例如，`2` 的标签为 `Two`，`+` 的标签为 `Add`，以此类推。


    在 `One_Callback` 函数下，写入以下代码。


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''1'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    在 `Two_Callback` 函数下，写入以下代码。


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''2'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    我们对按钮 `2`、`3`、`4`、`5`、`6`、`7`、`8`、`9` 和 `0` 重复相同的操作。对于除法，在本例中，在 `Divide_Callback`
    函数下输入以下代码。


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''/'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    类似地，对运算符 `*`、`-`、`+`、符号 `.`、`,` 以及 `π` 对应的按钮重复此步骤。对于 `sin` 按钮，在 `Sine_Callback`
    函数下输入以下代码。


    ```

    OldVal=get(handles.textresult,''String'');

    NewVal=''sin((pi/180)*'';

    TextString = strcat(OldVal,NewVal);

    set(handles.textresult,''String'',TextString);

    ```


    在此代码中，角度以弧度制转换为度数。这就是为什么我们需要在代码第二行写入 `(pi/180)*`。必须为 `cos`、`tan` 和 `cot` 按钮编写类似的代码。对于
    `Clear` 按钮，在 `Equal_Callback` 函数下输入以下代码。


