- fmt: '### Euler’s Method


    Euler’s method is yet another way to find approximate solutions to initial value
    problems of ODEs of the following type:


    ![$$ \Big\{\frac{dy}{dx}=f\left(x,y\right)\ y(a)={y}_a $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equd.png)


    ![$$ {y}_{i+1}={y}_i+ hf\left({x}_i,{y}_i\right) $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Eque.png)


    where `h` is the mesh size (in a uniform mesh) over the interval `[a, b]`.


    **Example 4-11.** Write code to solve the initial value problem given by


    ![$$ \frac{dy}{dx}=y-x,y(0)=\frac{2}{3},0\le x\le 5 $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equf.png)


    using Euler’s method, where the exact solution is ![$$ y=\left(x+1\right)-\frac{1}{3}{e}^x
    $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq6.png). The code
    should print the exact solution and the numerical solution of `y(5)` on the screen.
    The mesh size (`h`) should be set to `h = 0.0005`.


    **Solution 4-11.** The following code can be used to accomplish the given tasks.


    `Example4p11.m`


    ```

    %Example4p11

    %This code uses Euler''s method

    format long

    f = @(x,y) y-x; %defined function

    y = 2.0/3.0; %initial condition

    xval = linspace(0,5,10001);% 0<=x<=5

    h = xval(2)-xval(1); %h is mesh size and it is uniform

    for i=1:length(xval)

    y = y + f(xval(i),y)*h; %Euler formula

    end

    fprintf("Numerical Solution of y(5): %.10f\n", y)

    y_exact = 5.0 + 1.0 - (1.0/3.0)*exp(5.0);

    fprintf("Exact Solution of y(5)    : %.10f\n",y_exact)

    ```


    In the code, the precision is set to show 10 decimal digits. Once the code is
    executed, the following output will be shown on the screen.


    ```

    > Example4p11

    Numerical Solution of y(5): -43.4334780673

    Exact Solution of y(5)    : -43.4710530342

    >

    ```


    ### Runge–Kutta Method of Fourth Order


    Runge–Kutta methods are another group of methods for solving initial value problems
    of ODEs. In this section, we consider the fourth-order (`RK4`) formula, which
    has the following form:


    ![$$ \Big\{\frac{dy}{dx}=f\left(x,y\right)\ y(a)={y}_a,a\le x\le b $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equg.png)


    ![$$ \Big\{{K}_1= hf\left({x}_i,{y}_i\right)\ {K}_2= hf\left({x}_i+\frac{1}{2}h,{y}_i+\frac{1}{2}{K}_1h\right)\
    {K}_3= hf\left({x}_i+\frac{1}{2}h,{y}_i+\frac{1}{2}{K}_2h\right)\ {K}_4= hf\left({x}_i+h,{y}_i+{K}_3h\right)\
    {y}_{i+1}={y}_i+\frac{1}{6}\left({K}_1+2{K}_2+2{K}_3+{K}_4\right) $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equh.png)


    **Example 4-12.** Write code to solve the initial value problem given by


    ![$$ \frac{dy}{dx}=y-x,y(0)=\frac{2}{3},0\le x\le 5 $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equi.png)


    using `RK4`, where the exact solution is ![$$ y=\left(x+1\right)-\frac{1}{3}{e}^x
    $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq7.png). The code
    should print the exact solution and the numerical solution of `y(5)` on the screen.
    The mesh size (`h`) should be set to `h = 0.0005`.


    **Solution 4-12.** We can write the following code for the given tasks.


    `Example14p12.m`


    ```

    %Example 4p12

    %This example solves a first-order ODE

    %by using Runge-Kutta Method of fourth order

    format long

    f = @(x,y) y-x; %defined function

    y = 2.0/3.0; %initial condition

    xval = linspace(0,5,10001);% 0<=x<=5

    h = xval(2)-xval(1); %h is mesh size and it is uniform

    for i=1:length(xval)

    K1 = h*f(xval(i),y);

    K2 = h*f(xval(i) + 0.5*h, y + 0.5*K1*h);

    K3 = h*f(xval(i) + 0.5*h, y + 0.5*K2*h);

    K4 = h*f(xval(i) + h, y + K3*h);

    y = y + (1.0/6.0)*(K1 + 2.0*K2 + 2.0*K3 + K4);%RK4

    end

    fprintf("Numerical Solution of y(5): %.10f\n", y)

    y_exact = 5.0 + 1.0 - (1.0/3.0)*exp(5.0);

    fprintf("Exact Solution of y(5)    : %.10f\n",y_exact)

    ```


    In this code, the precision is set to show 10 decimal digits. Once the code is
    executed, the following output will be displayed on the screen.


    ```

    > Example4p12

    Numerical Solution of y(5): -43.4703160436

    Exact Solution of y(5)    : -43.4710530342

    >

    ```


    ## Problems


    - **4.1.** Given the values `x = [1, 4, 8, 9]` and `y = [15, 30, 50, 60]`, calculate
    the value of 6 using the default method of the `interp1` function.


    - **4.2.** Write code to find the root of `3 * sin(x)`. The code should find the
    root within the interval ![$$ \frac{\pi }{2} $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq8.png)
    and ![$$ \frac{3\pi }{2} $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_IEq9.png).
    The obtained value should be displayed on the screen in degrees.


    - **4.3.** Write code to find the root of `f(x) = x⁴ + 4*x + 2` between -1 and
    1. The code should calculate the value within the tolerance given by `10^(-6)`
    using the bisection method.


    - **4.4.** Write code to find the root of `f(x) = x⁴ + 4*x + 2` with an initial
    value of -1. The code should calculate the value within the tolerance given by
    `10^(-6)` using Newton’s method.


    - **4.5.** Write code to find the root of `f(x) = x⁴ + 4*x + 2` with an initial
    value of -0.5. The code should calculate the value within the tolerance given
    by `10^(-6)` using the fixed-point iteration method.


    - **4.6.** Write code to calculate the integral of `sin(2*x)` from 0 to π numerically
    using the `integral` function. Then, compare the numerical solution with the analytical
    solution. The code should print the numerical result, analytical result, and the
    discrepancy on the screen.


    - **4.7.** Write code to solve the initial value problem given by


    ![$$ \frac{dy}{dx}=2{x}^2+7x+6-y,y(0)=3,0\le x\le 5 $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equj.png)


    using Euler’s method. The code should print the numerical solution of `y(5)` on
    the screen. The mesh size (`h`) should be set to `h = 0.0005`.


    # 5. Applications in Simulation


    In this chapter, we first cover how to generate random numbers. Then, flipping
    a coin, rolling a pair of dice, random walking, and traffic flow topics are covered.
    In each section, I provide illustrations of the relevant programming ideas and
    explain them when necessary.'
