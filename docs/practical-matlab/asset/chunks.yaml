    # 9. Signal Processing


    Signal processing is one of the subfields of electrical engineering that analyzes,
    modifies, and operates information from all sources of data in the universe. A
    *signal* in signal processing is an electrical or electromagnetic current that
    relocates data from one device to another. Everything in the cosmos, such as sounds,
    images, and videos, can be described as a signal in the form of a wave. Signals
    can be represented as functions of one or more independent variables mathematically.


    Signal processing has a very wide field of applications, including brain–computer
    interfaces, voice recognition, motion-sensing games, three-dimensional television,
    wearable technologies, biometric security, and more. Full coverage of this subject
    is beyond the scope of this chapter. Here, we review some introductory topics
    and a few applications in this area with MATLAB, including signal types, currents,
    Fast Fourier Transform, and harmonic analysis.


    ## Signal Types


    Signals can be classified into a few categories such as energy and power signals,
    or deterministic or probabilistic signals. In this section, we take a look at
    continuous and discrete signals, analog and digital signals, periodic and nonperiodic
    signals, and even and odd signals.


