    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig6_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Predator–prey population model


    In Figure [8-6](#483991_1_En_8_Chapter.xhtml#Fig6), we see that population starts
    with 100 and 10 for predators and prey, respectively. To see clearly what happens
    at the very beginning horizontally, in the ninth row of the code, we can use the
    `semilog` function instead of the `plot` function. By changing just these two
    functions, we get the graph shown in Figure [8-7](#483991_1_En_8_Chapter.xhtml#Fig7).


    ![../images/483991_1_En_8_Chapter/483991_1_En_8_Fig7_HTML.jpg](images/483991_1_En_8_Chapter/483991_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Predator–prey populations with *semilog*


    Figure [8-6](#483991_1_En_8_Chapter.xhtml#Fig6) and Figure [8-7](#483991_1_En_8_Chapter.xhtml#Fig7)
    use the same *x* and *y* values. In the second plot, logarithmic scale values
    for base 10 are used for the *x* axis.


    In Figure [8-7](#483991_1_En_8_Chapter.xhtml#Fig7), we clearly see that starting
    from the beginning, the population of the prey decreases exponentially and the
    population of predators increases slowly, compared to the speed of decline in
    the prey. Before time is equal to 1, the populations for both predators and prey
    become equal. For the rest of the time, or in the long run, we can take a look
    Figure [8-6](#483991_1_En_8_Chapter.xhtml#Fig6).


    As the population of prey gets higher, after a certain amount of time, the population
    of predators increases as well. The predators eat prey faster than the prey can
    reproduce. As a result of, the population of prey begins to fall. The food supply
    thus diminishes for predators, so their population begins to fall as well. After
    some time, the whole scenario starts repeating itself, and the populations behave
    predictably with respect to time.'
