  raw: '### Profit


    Profit can be defined as the difference between the revenue (total revenue) and
    the cost (total cost).


    ![$$ \Pr =\mathrm{R}-\mathrm{C} $$](images/483991_1_En_3_Chapter/483991_1_En_3_Chapter_TeX_Equf.png)


    where *Pr* stands for profit, *R* stands for revenue, and *C* stands for cost.


    **Example 3-10.** A company sells t-shirts with cost function *C*(*x*) = 3 + 2*x*,
    and the revenue function is *R*(*x*) =  − *x*² + 4*x* + 12 where *x* indicates
    the number of t-shirts. For the maximum revenue value *R*, find *x*. Then by using
    the same *x*, calculate cost (*C)* and profit (*Pr).*


    **Solution 3-10.** The following code can be used for the solution.


    *Example3p10.m*


    ```

    %Example3p10

    %This code profit

    syms x

    R = -x^2+4*x+12;

    Derivat = diff(R,x);

    Number = double(solve(Derivat,x));

    C = @(x) 3+2*x;

    Rev = @(x) -x^2+4*x+12;

    disp([''For maximum R, x ='',...

    num2str(Number)])

    Profit=Rev(Number)-C(Number);

    disp([''Profit, Pr='',...

    num2str(Profit)])

    ```


    Here, *R*, which stands for revenue, is defined in the fourth row. Using this,
    the maximum *x* variable is calculated by taking its derivative and setting it
    equal it to zero so that its solution can be found using the `solve` function.
    Then the same revenue and cost function are defined as anonymous functions. These
    functions are evaluated at `x=Number`, and the results are shown with the `disp`
    function . Once the code is run, the following output is obtained.


    ```

    > Example3p10

    For maximum R, x =2

    Profit, Pr=9

    >

    ```


