    include `.bmp`, `.gif`, `.jpg`, `.jpeg`, `.hdf`, `.pcx`, `.png`, `.tiff`, .`xwd`,
    and more.


    In the Image Processing Toolbox in MATLAB^®, there are basically four different
    types of images: binary images, grayscale images, indexed images, and truecolor
    (RGB) images.


    ### Binary Images


    Binary images are composed of zeros and ones in their corresponding matrix representations.
    Zero represents the white color, and one represents the black color in the image.
    A binary image is stored as a logical array in the workspace. Figure [10-2](#483991_1_En_10_Chapter.xhtml#Fig2)
    is an example of a binary image.


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig2_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig2_HTML.jpg)


    Figure 10-2


    An example of a binary image


    ### Grayscale Images


    Grayscale images are represented by data matrices having various intensity values
    depending on the class of the matrix. Data types might belong to one of the classes
    `uint8`, `uint16`, `int16`, `single`, or `double`. Values for `single` or `double`
    data types range from 0 to 1\. For `uint8`, the values range from 0 to 255\. For
    `uint16`, the range is between 0 and 65,535\. Finally, for `int16`, the values
    range from -32,768 to 32,767\. Figure [10-3](#483991_1_En_10_Chapter.xhtml#Fig3)
    is the grayscale version of the same image shown in Figure [10-2](#483991_1_En_10_Chapter.xhtml#Fig2).


    ![../images/483991_1_En_10_Chapter/483991_1_En_10_Fig3_HTML.jpg](images/483991_1_En_10_Chapter/483991_1_En_10_Fig3_HTML.jpg)


    Figure 10-3


    An example of a grayscale image'
