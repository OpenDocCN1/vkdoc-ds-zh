- fmt: '# Analog and Digital Signals


    Considering the amplitudes of signals, a signal can be analog or digital. An *analog
    signal* is a continuous wave that maintains the change for a period of time. *Digital
    signals*, however, can have a finite number of amplitude values. These values
    are not continuous and infinite. In addition, the wave type of an analog signal
    looks like a sinusoidal function, whereas the wave of a digital signal looks like
    a square wave.


    Some examples of analog signals are voices, music, temperature, and Wi-Fi signals
    in the air. Examples of digital signals are voice recorded on a CD, a digital
    thermometer, and music in an MP3 player.


    # Periodic and Nonperiodic Signals


    A signal that repeats itself after a period of time is called a *periodic signal*.
    A signal that does not repeat itself over a period of time is called an aperiodic
    or *nonperiodic* signal.


    A continuous time signal `y(t)` is called periodic if it satisfies the following
    equality.


    ![$$ y(t)=y\left(t+{T}_0\right) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ3.png)


    (3)


    for all `t` and positive constant `T0`.


    Similarly, a discrete time signal `y[t]` is called periodic if it satisfies the
    following equality.


    ![$$ y\left[t\right]=y\left[t+{T}_0\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ4.png)


    (4)


    for all `t` and positive constant `T0`.


    **Remark 9-1.** Suppose that `y(t)` is a function representing a continuous signal.
    Then if


    ![$$ y(t)=k\ast {\sin}^n\left( at+b\right), $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ5.png)


    (5)


    or


    ![$$ y(t)=k\ast {\cos}^n\left( at+b\right), $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ6.png)


    (6)


    then, the period, `T0`, of signal `y(t)` is


    ![$$ {T}_0=\left\{\begin{array}{c}\frac{2\uppi}{\mid a\mid },\mathrm{if}\ n\ \mathrm{is}\
    \mathrm{an}\ \mathrm{odd}\ \mathrm{integer}\\ {}\frac{\uppi}{\mid a\mid },\mathrm{if}\
    n\ \mathrm{is}\ \mathrm{an}\ \mathrm{even}\ \mathrm{integer}\end{array}\right.
    $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ7.png)


    (7)


    In Equations (5) and (6), constant values of `k`, `a`, and `b` are all real numbers,
    and `n` should be an integer. In Equation (7), `|a|` is the absolute value of
    `a`.


    **Remark 9-2.** Suppose that `y(t)` is a function representing a continuous signal.
    Then if


    ![$$ y(t)=k\ast {\tan}^n\left( at+b\right), $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ8.png)


    (8)


    or


    ![$$ y(t)=k\ast {\cot}^n\left( at+b\right), $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ9.png)


    (9)


    then, the period `T0`, of signal `y(t)` is


    ![$$ {T}_0=\frac{\uppi}{\mid a\mid } $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ10.png)


    (10)


    In Equations (8) and (9), constant values of `k`, `a`, and `b` are all real numbers,
    and `n` should be an integer.


    **Example 9-2.** A CT signal is defined as `y(t) = 5*sin³(4*t − 1)`. Find the
    period of the signal. Then write a code to plot the signal where `−2*π ≤ t ≤ 2*π`.


    **Solution 9-2.** In the example, the signal is a continuous signal. Therefore,
    we can use Remark 9-1 to find the period. We see that `n = 3`, which is an odd
    number, and `a = 4`. Then `T0 = (2π) / |4| = π / 2`.


    The following code can be used to accomplish the given task.


    *Example9p2.m*


    ```

    %Example9p2

    %This code has a periodic signal

    t = -2*pi:0.001:2*pi;

    y=5*(sin(4*t-1)).^3;

    plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''A Periodic Signal'');

    ```


    Once the code is run, the output shown in Figure 9-3 is the result.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig3_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig3_HTML.jpg)


    **Figure 9-3** Graph of `y(t) = 5*sin³(4*t − 1)`


    As shown in Figure 9-3, the signal repeats itself after every `π/2` value.


    **Example 9-3.** A CT signal is defined as `y(t) = 2*sin(4*t) + cos(6*t − 2)`.
    Find the period of the signal. Then write a code to plot the signal where `−π
    ≤ t ≤ π`.


    **Solution 9-3.** In the example, signal has a sine function added to the cosine.
    We will calculate the periods of these two functions separately. Then we will
    find the least common multiple (LCM) of those two periods. Let us define the period
    of sine term as `T0`, and period of cosine term as `T1`. Then by considering Remark
    9-1, we see that `T0 = (2π) / |4| = π/2`, and `T1 = (2π) / |6| = π/3`. Then `LCM(π/2,
    π/3) = π`. The graph should have a period of `π` for the signal.


    The following code can be used to accomplish the given task.


    *Example9p3.m*


    ```

    %Example9p3

    %This code has a periodic signal

    t = -pi:0.001:pi;

    y=2*sin(4*t)+cos(6*t-2);

    plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''A Periodic Signal'');

    ```


    Once the code is executed, we see the output shown in Figure 9-4.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig4_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig4_HTML.jpg)


    **Figure 9-4** Graph of `y(t) = 2*sin(4*t) + cos(6*t − 2)` signal


    Obviously, as shown in Figure 9-4, the signal repeats itself after every `π` period.


    # Even and Odd Signals


    A continuous time signal `y(t)` is called *even* if it satisfies the following
    equality.


    ![$$ y\left(-t\right)=y(t) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ11.png)


    (11)


    and it is called *odd* if it satisfies the following:


    ![$$ y\left(-t\right)=-y(t) $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ12.png)


    (12)


    In a similar manner, a discrete time signal `y[t]` is called even if it satisfies
    the following:


    ![$$ y\left[-t\right]=y\left[t\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ13.png)


    (13)


    and it is called odd if it satisfies the following:


    ![$$ y\left[-t\right]=-y\left[t\right] $$](images/483991_1_En_9_Chapter/483991_1_En_9_Chapter_TeX_Equ14.png)


    (14)


    **Example 9-4.** For the given CT signal `y(t) = sin²(t) + cos(t) + 1`, write
    a code to see whether the signal is even or odd over the graphic. Both graphics
    of `y(t)` and `y(−t)` should be shown on the same figure.


    **Solution 9-4.** The following code can be used to accomplish the given task.


    *Example9p4.m*


    ```

    %Example9p4

    %This code plots an even signal

    t = -pi:0.001:pi;

    y=(sin(t)).^2+cos(3*t)+1;

    subplot(121);plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''Signal of y(t)'');

    t = -t;

    y=(sin(t)).^2+cos(3*t)+1;

    subplot(122);plot(t,y);grid on;

    xlabel(''t'');ylabel(''y'');

    title(''Signal of y(-t)'');

    ```


    Once the code is executed, we obtain the output shown in Figure 9-5.


    ![../images/483991_1_En_9_Chapter/483991_1_En_9_Fig5_HTML.jpg](images/483991_1_En_9_Chapter/483991_1_En_9_Fig5_HTML.jpg)


    **Figure 9-5** Graph of `y(t) = sin²(t) + cos(t) + 1` signal


    Figure 9-5 shows that both drawings are exactly the same, which indicates that
    the signal is an even signal.'
