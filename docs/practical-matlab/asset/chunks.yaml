    ![$$ {x}_{n+1}={x}_n-\frac{\left({x}_n-{x}_{n-1}\right)}{\left(f\left({x}_n\right)-f\left({x}_{n-1}\right)\right)}f\left({x}_n\right)
    $$](images/483991_1_En_4_Chapter/483991_1_En_4_Chapter_TeX_Equb.png)


    The function must be defined by the user to calculate the root using this algorithm.
