    # 利润


    利润可以定义为收入（总收入）与成本（总成本）之差。


    ![$$ \Pr =\mathrm{R}-\mathrm{C} $$](img/483991_1_En_3_Chapter_TeX_Equf.png)


    其中 *Pr* 代表利润，*R* 代表收入，*C* 代表成本。


    **示例 3-10.** 某公司销售 T 恤，其成本函数为 *C*(*x*) = 3 + 2*x*，收入函数为 *R*(*x*) = −*x*² + 4*x*
    + 12，其中 *x* 表示 T 恤的数量。要求取最大收入值 *R* 所对应的 *x*。然后，利用相同的 *x* 值，计算成本 (*C*) 和利润 (*Pr*)。


    **解 3-10.** 以下代码可用于求解。


    *Example3p10.m*


    ```

    %Example3p10

    %This code profit

    syms x

    R = -x²+4*x+12;

    Derivat = diff(R,x);

    Number = double(solve(Derivat,x));

    C = @(x) 3+2*x;

    Rev = @(x) -x²+4*x+12;

    disp([''For maximum R, x ='',...

    num2str(Number)])

    Profit=Rev(Number)-C(Number);

    disp([''Profit, Pr='',...

    num2str(Profit)])

    ```


    此处，第四行定义了代表收入的 *R*。通过对其求导并令导数为零，可计算出使收入最大的 *x* 变量，然后利用 `solve` 函数求解。接着，将相同的收入和成本函数定义为匿名函数。这些函数在
    `x=Number` 处求值，并通过 `disp` 函数显示结果。运行代码后，将得到以下输出。


    ```

    > Example3p10

