    ### 点阵图


    点阵图用于展示给定两个序列的比较结果。为了绘制图形，通常会生成一个二维矩阵，因此得到的图形也是二维的。第一个给定序列放置在矩阵的行上，第二个给定序列放置在矩阵的列上。在矩阵中，`1`
    表示匹配，`0` 表示不匹配。


    **示例 8-7.** 对于给定的两个序列 `Seq1=AATGCAATT` 和 `Seq2=ATTGACT`，编写代码以打印出点矩阵并绘制点阵图。在图形中，匹配点应显示为红色，不匹配点应显示为蓝色。


    **解法 8-7.** 以下代码可用于完成给定任务。


    *Example8p7.m*


    ```

    %Example8p7

    %This code creates dot matrix and dot plot

    Seq1=''AATGCAATT'';Seq2=''ATTGACT'';

    X=length(Seq1);Y=length(Seq2);

    DotMatrix=zeros(Y,X);

    for i=1:Y

    Places=strfind(Seq1,Seq2(i));

    DotMatrix(i,Places)=1;

    end

    disp(''The Dot Matrix:'');

    disp(DotMatrix);figure;hAxes=gca;

    imagesc(hAxes,DotMatrix);

    colormap(hAxes,[0,0,1;1,0,0]);

    ylabel(fliplr(Seq2));title(Seq1);

    ```


    在上述代码中，使用 `strfind` 命令找到了 `Seq2` 变量中每个元素的匹配位置。然后，在这些位置将 `DotMatrix` 中的值赋为 `1`。创建矩阵后，使用
    `figure` 函数生成图形。`gca` 命令用于处理当前图形的坐标轴，并通过 `imagesc` 函数使用缩放颜色显示图形。使用 `colormap`
    命令为当前图形分配匹配和不匹配的颜色。`Seq2` 变量的顺序使用 `fliplr` 命令反转，并将其放置在 *y* 轴上，同时 `Seq2` 变量作为标题显示。


    执行代码后，我们将得到以下输出。


