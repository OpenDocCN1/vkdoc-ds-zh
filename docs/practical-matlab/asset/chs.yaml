  \n图 10-26：例 10-21 的第一个输出结果\n\n**例 10-22:** 定义两个滤波器为![$$ {P}_x=\\left[\\begin{array}{cc}-1&amp;\
  \ 0\\kern0.5em 1\\\\ {}\\begin{array}{c}-1\\\\ {}-1\\end{array}&amp; \\begin{array}{c}0\\\
