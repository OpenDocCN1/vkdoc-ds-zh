  \n**解 10-22.** 以下代码可用于完成给定任务。\n\n*Example10p22.m*\n\n```\n%Example10p22\n%This code\
  \ finds edges\nI = imread('cowboys.png');\ns = rgb2gray(I);\npx=[-1,0,1;-1,0,1;-1,0,1];\n\
  py=px';\nSx=imfilter(s,px);\nSy=imfilter(s,py);\nimshow(Sx),title('Applying Px');\n\
  figure,imshow(Sy),title('Applying Py');\n```\n\n\n\n一旦代码运行，将获得如图 10-28 和图 10-29\
