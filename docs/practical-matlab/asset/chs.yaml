  \ |\n| `sign` | 返回 -1、0 或 1（符号函数） |\n\n## 数据类型\n\n在 MATLAB 中，默认数据类型是双精度浮点型。这意味着，除非另有指定，在提示符下输入的任何内容都将保存为双精度浮点型。\n\
  \n我们可以将 MATLAB 中的数据类型分为两大类：同质数据类型和异质数据类型（图 1-4）。同质数据类型包含相同类型的数据，而异质数据类型包含混合或复杂的数据类型。\n\
  \n![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig4_HTML.jpg](img/483991_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n数据类型\n\n### 同质数据类型\n\n同质数据类型具有相同的特性。这些类型可以是字符、字符串、整数、浮点数或逻辑数据。\n\n\n\n\
  ```markdown\n#### 字符与字符串\n\n字符构成字符串。在 MATLAB 中，字母、数字或符号均可定义为字符。将内容输入到单引号之间即可定义字符。\n\
  \n```\n> Let=\"34\"\nLet =\n\n> class(Let)\nans =\nchar\n>\n```\n\n在此示例中，尽管我们将变量\
  \ `Let` 定义为全由数字组成的 `34`，但由于这些数字被输入在单引号之间，MATLAB 会将其识别为字符。如果使用 `class` 命令显示其类别，我们会看到它是字符类型。\n\
  \n```\n> H='How are you?'\nH =\nHow are you?\n> length(H)\nans =\n\n> class(H)\n\
  ans =\nchar\n>\n```\n\n在上述示例中，变量 `H` 被定义为长度为 12 的字符。通过将名称置于单引号之间，变量即被定义为字符。\n\n\
  **示例 1-11.** 分别为 A、B、C 定义了三个变量：‘How are you?’、‘the weather’ 和 ‘is it correct?’。我们希望仅使用这三个变量创建一个新的字符\
  \ ‘How is the weather’。编写实现此任务的代码。\n\n**解法 1-11.** 至此，我们一直在命令窗口中输入命令。现在可以在编辑器中编写代码，并将其保存到\
  \ MATLAB 的工作目录中。然后只需输入保存文件的名称即可运行代码。此代码在编辑器中编写并保存为 `CharEx.m`。以下程序可用于此任务。\n\n`*CharEx.m*`\n\
  \n```\n% 此文件名是 CharEx.m\n% 此为示例 1-11\n% 此代码获取一些字符串并将它们组合成另一个字符串\nA = 'How are you?';\n\
  B = 'the weather';\nC = 'is it correct?';\nNewOne = [A(1:4) C(1:3) B]\n```\n\n如图所示，我们提取了\
  \ A 的前四个字符、C 的前三个字符以及 B 的全部字符串，并将它们赋值给一个新变量 `NewOne`。如果在某一行放置百分号（`%`），MATLAB 会忽略该\
  \ `%` 符号之后的所有内容，因此这用于添加注释。\n\n在提示符下运行代码后，将获得以下输出。\n\n```\n> CharEx\nNewOne =\nHow\
  \ is the weather\n>\n```\n\n在 MATLAB 中，有一个非常有用的命令叫做 `char`。使用此命令，我们可以打印美国信息交换标准码（ASCII）定义的所有字符，如图\
  \ 1-5 所示。\n\n![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig5_HTML.jpg](img/483991_1_En_1_Fig5_HTML.jpg)\n\
  \n**图 1-5** ASCII 表\n\n从 32 到 127，这些字符可以像示例 1-12 的解法中所示的那样查看。\n\n**示例 1-12.** 编写一个程序，打印\
  \ ASCII 表中的小写和大写字母。\n\n**解法 1-12.** 以下代码可用于完成给定任务。\n\n`*Letters.m*`\n\n```\n% 此文件名是\
  \ Letters.m\n% 此为示例 1-12\n% 此代码打印字母表中的字母\nSmall   = char(97:122);\nCapital = char(65:90);\n\
  fprintf('小写字母为 : %s\\n',Small);\nfprintf('大写字母为 : %s\\n',Capital);\n```\n\n然后在命令窗口中，在提示符下运行代码后，我们将获得以下输出：\n\
  \n```\n> Letters\n小写字母为 : abcdefghijklmnopqrstuvwxyz\n大写字母为 : ABCDEFGHIJKLMNOPQRSTUVWXYZ\n\
  >\n```\n\n在 `Letters.m` 代码中，`fprintf` 函数会打印直到 `%` 符号的紫色字符。之后，字母 `s` 告知 MATLAB 接下来将打印名为\
  \ `Small` 和 `Capital` 的字符串。`\\n` 部分用于在打印时换行。\n\n**示例 1-13.** Bob 想要以加密消息的保密方式向 Alice\
  \ 发送消息 “Start sending messages at 8:30”。编写一个程序，对 Bob 的消息进行加密和解密。（提示：使用 ASCII 表）\n\
  \n**解法 1-13.** 加密和解密部分如下所示。\n\n`*HidingMessage.m*`\n\n```\n% 此文件名是 HidingMessage.m\n\
  % 此为示例 1-13\n% 此代码对消息进行加密和解密\n%加密部分开始\nMessage = 'Start sending message at 8:30';\n\
  Encryp = double(Message)+3;\nfprintf('加密消息 : %s\\n',char(Encryp))\n%解密部分开始\nDecryp\
  \ = Encryp-3;\nfprintf('解密消息 : %s\\n',char(Decryp))\n```\n\n在此解法中，使用 `double` 命令将消息转换为\
  \ ASCII 表中对应的数字。然后，为了加密，我们在每个字母对应的数字上加 3。这会将每个字母在 ASCII 表中向右移动 3 位。消息加密后，通过从加密值中减去\
  \ 3，将其解密回原始版本。在提示符下运行代码后，我们将获得以下输出：\n\n```\n> HidingMessage\n加密消息 : Vwduw#vhqglqj#phvvdjh#dw#;=63\n\
  解密消息 : Start sending message at 8:30\n>\n```\n\nMATLAB 提供了非常有用的函数来处理字符串或字符。一些最常用的函数列在表\
  \ 1-10 中。\n\n#### 数值数据\n\nMATLAB 中存在两种不同类型的数值数据类型：整数和浮点数。整数包括有符号和无符号类型。总共有八种整数类型，如表\
  \ 1-11 所示。这些类型之间的区别在于它们在内存中占用的存储空间不同。如果可能使用低位整数进行计算，则可以节省内存空间。当选择使用高位整数时，将需要更多内存。\n\
  \n要查找计算机内整数的最大值或最小值，只需输入 `intmax('类名')`。例如，如果我们输入以下内容\n\n```\n> intmax('int8')\n\
  ans =\n\n> intmin('int64')\nans =\n\n>\n```\n\n我们会看到最高 8 位整数和最低 64 位整数的值。此外，\n\n\
  ```\n> intmin('uint64')\nans =\n\n> intmax('uint64')\nans =\n\n>\n```\n\n使用 `intmin`\
  \ 和 `intmax` 命令，在上面的代码中显示了最低和最高的无符号 64 位整数。\n\n浮点数有两种类型：即双精度数和单精度数。双精度浮点数是所有输入变量的默认类型。单精度浮点数在内存中占用\
  \ 32 位，而双精度浮点数占用 64 位。我们可以使用之前用于整数的相同命令来检查最高值和最低值。\n\n```\n> realmax('double')\n\
  ans =\n1.7977e+308\n> realmin('single')\nans =\n1.1755e-38\n>\n```\n\n#### 逻辑数据\n\
  \n在 MATLAB 以及许多其他编程语言中，1 表示逻辑真，0 表示逻辑假。\n\n**示例 1-14.** 编写一个包含两个逻辑值变量的程序。一个应为真，另一个应为假。使用“逻辑与”和“逻辑或”运算符比较这些值。\n\
  \n**解法 1-14.** 以下代码可用于完成给定任务。\n\n`*LogicalEx.m*`\n\n```\n% 此文件名是 LogicalEx.m\n%\
  \ 此为示例 1-14\n% 此代码处理逻辑值\nLogical1 = 3>2 % 如果为真，则为 1\nLogical2 = 5<4 % 如果为假，则为 0\n\
  CombineWithAnd = Logical1 && Logical2 % 与\nCombineWithOr = Logical1 || Logical2\
  \  % 或\n```\n\n如果运行此代码，我们将获得以下结果。\n\n```\n> LogicalEx\nLogical1 =\n\nLogical2 =\n\
  \nCombineWithAnd =\n\nCombineWithOr =\n\n> class(CombineWithOr)\nans =\nlogical\n\
  >\n```\n\n运行代码后，检查变量 `CombineWithOr` 的类别，如上所示，它是逻辑数据。因此，逻辑数据值只能是 0 或 1。\n\n####\
  \ 符号数据\n\n符号数据用于使用 MATLAB 的符号数学工具箱执行代数计算。有两种定义符号变量的方法。一种是输入 `syms`，另一种是输入 `sym`，如下所示。\n\
  \n```\n> syms x\n> class(x)\nans =\n'sym'\n> y=sym('y')\ny =\ny\n> class(y)\nans\
  \ =\n'sym'\n>\n```\n\n使用任一方法，我们都可以创建符号数据类型，然后应用一些代数运算，例如求积分或求导。\n```\n\n\n### 异构数据类型\n\
  \n在某些情况下，由于手头任务的性质，我们需要使用由多种数据类型组合而成的更复杂的数据类型。这些混合数据类型通常被称为*异构*数据类型。在 MATLAB 中，异构数据类型以元胞数组、结构体数组和数据集数组（表格）的形式出现。\n\
  \n#### 元胞数组\n\n一个*元胞*可以被视为一个数据盒子，而元胞数组则是元胞的数组。使用 `cell` 函数可以预分配空的元胞数组。可以通过元胞数组对元素进行索引。例如，如果在提示符下输入\
  \ `cell(3,2)`，就会创建一个如下所示的元胞类变量。\n\n```\n> CellAr1=cell(3,2)\nCellAr1 =\n[]    []\n\
  []    []\n[]    []\n>\n```\n\n要确定其类别，只需针对该情况输入 `class(CellAr1)` 即可。\n\n```\n> class(CellAr1)\n\
  ans =\ncell\n>\n```\n\n创建元胞数组的方法有多种。你可以在给数组赋值之前预分配元胞数组（如前所述），也可以直接定义数组并使用它，而不进行预分配。\n\
  \n**示例 1-15.** 定义一个元胞数组，用于存储表 1-12 中的数据。\n\n**解法 1-15.** 定义这个元胞数组有两种不同的方法。在第一种方法中，所有元素可以赋值给一个变量；而在第二种方法中，元素需要逐个定义。我们将这个元胞数组命名为\
  \ `My_cell_array`。然后，在提示符下输入以下内容；\n\n```\n> My_cell_array={eye(3),'How are you?',2015;'Hola',72,'Alexander'}\n\
  My_cell_array =\n[3x3 double]    'How are you?'    [     2015]\n'Hola'         \
  \ [          72]    'Alexander'\n>\n```\n\n如上所示，元胞数组的索引是在花括号内定义的。\n\n#### 结构体\n\n\
  结构体与元胞数组之间最显著的区别在于索引方式。虽然元胞数组可以根据其包含的元素进行索引，但无法遍历结构体的元素。换句话说，数据存储在结构体的*字段*中。\n\n\
  可以采用两种方法之一来创建结构体。一种是使用 `struct` 函数，另一种是使用点运算符。\n\n**示例 1-16.** 一家公司想要保存如表 1-13 所示的一名员工的信息。\n\
  \n编写一个程序来存储表 1-13 中给出的信息。\n\n**解法 1-16.** 实现此目的的一种方法是使用 `struct` 函数创建一个结构体数组，如下所示。\n\
  \n*StructArrayEx.m*\n\n```\n% Name of this file is StructArrayEx.m\n% This is Example\
  \ 1-16\n% This code creates a structure\nemployer=struct('id',5001,'name','Robert','address',...\n\
  'San Antonio, TX','salary',39900)\n```\n\n正如上述代码所示，数据在 `struct` 函数中依次输入，并用逗号分隔。一旦程序从命令窗口执行，将显示以下输出。\n\
  \n```\n> StructArrayEx\nemployer =\nstruct with fields:\nid: 5001\nname: 'Robert'\n\
  address: 'San Antonio, TX'\nsalary: 39900\n>\n```\n\n#### 表格\n\n第三类异构数据类型称为*表格*。表格特别适合存储面向列的数据。可以对表格执行有用的操作，例如创建表格、从表格读取数据、更改表格内容等。表\
  \ 1-14 中展示了一些基本的表格函数。\n\n**示例 1-17.** 在工作区中有三个变量：\n\n`Name = ['Alex'; 'Slim'; 'Bill']`,\
  \ `Age = [35; 40; 45]`, 以及 `Height = [160; 165; 170]`。\n\n使用这些数据，编写一个程序来创建一个表格。然后，该表格应保存到一个\
  \ `MyTable.xlsx` 文件中。\n\n**解法 1-17.** 可以使用以下代码来完成此任务。\n\n*CreateTables.m*\n\n```\n\
  % Name of this file is CreateTables.m\n% This is Example 1-17\n% This code creates\
  \ a table and\n% saves it as an .xlsx file\nName = ['Alex';'Slim';'Bill'];\nAge\
  \ = [35; 40; 45];\nHeight = [160; 165; 170];\nT = table(Name,Age,Height)\nwritetable(T,'MyTable.xlsx')\n\
  ```\n\n代码执行后，我们会得到以下输出。\n\n```\n> CreateTables\nT =\n3×3 table\nName    Age    Height\n\
  ____    ___    ______\nAlex    35      160\nSlim    40      165\nBill    45    \
  \  170\n>\n```\n\n电子表格文件也已保存在目录中的 `MyTable.xlsx` 文件中。\n\n表格还有更复杂的应用。这里我们只展示了一个简单的例子，以便让您对基本概念有所了解。\n\
  \n## 绘图\n\nMATLAB 是一个在图形和绘图方面非常强大的工具。有大量的绘图工具可用于诸如极坐标绘图、对数图形、动画三维图、体可视化图等任务。本节介绍基本的二维函数绘图，以及在单个坐标系或单个图形上绘制多个函数。\n\
  \n### 单一绘图\n\n在 MATLAB 中绘制函数的基本命令是 `plot` 函数。`plot` 命令最简单的形式是 `plot(y)`，其中 `y` 依赖于其索引。`plot`\
  \ 函数最常用的形式是 `plot(x,y)`，即一个 `(x,y)` 对的笛卡尔图。\n\n**示例 1-18.** 绘制区间 0 ≤ *x* ≤ *π* 内的函数\
  \ *y* = 2 * sin(*x*)。\n\n**解法 1-18.** 如果使用 `linspace` 命令将 `x` 定义为从 0 到 pi 的向量，那么我们就能绘制出\
  \ `y` 相对于 `x` 的对应值。在以下代码中，从 0 到 pi 的距离被划分为 100 个点。如果我们选择大量的点，例如 1,000 个，图形将变得更加精确。\n\
  \n```\n> x=linspace(0,pi,100);\n> y=2.*sin(x);\n> plot(x,y)\n>\n```\n\n上述代码产生的输出如图\
  \ 1-6 所示。\n\n![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig6_HTML.jpg](img/483991_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n`y=2sin(x)` 的笛卡尔图，其中 0 ≤ *x* ≤ *π*\n\nMATLAB 提供了各种图形功能，例如标题、x 轴标签、y 轴标签和网格线。这些功能如表\
  \ 1-15 所示。\n\n还有一些其他可用功能，允许程序员处理线型、颜色和大小，如表 1-16 所示。\n\n要使用 `plot` 函数创建常规图形，可以在绘图中包含不同的选项。\n\
  \n在 MATLAB 中，有大量可用的特殊函数用于创建二维和三维图形。在命令窗口中，如果您输入 `>help specgraph` 并按回车键，您将看到您的版本中有哪些可用的特殊函数。\n\
  \n\n\n### 多重绘图\n\n可以在同一张图上绘制多个图形。这可以通过两种方式实现。\n\n除了在一张图上绘制彼此分离的图形外，我们还可以在同一坐标系中绘制多个图形。如果你想在同一坐标轴上绘制不同的函数，可以通过使用单个\
  \ `plot` 函数，或者使用 `hold` 命令和多个 `plot` 命令来实现。\n\n**示例 1-19.**  绘制带网格的 *y* = 2 * sinx*\
  \ 函数。然后，保留第一个图形，在同一区间内绘制第二个函数 *y* = *coscos*(*x*)。同时为每个数据集添加标签。\n\n**解答 1-19.**\
  \  可以通过以下程序获得所需的图形，结果如图 1-7 所示。\n\n![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig7_HTML.jpg](img/483991_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7  \n函数 y=2sin(x) 和 y2=cos(x) 的图形\n\n```\n> x=linspace(0,pi,100);\n> y=2.*sin(x);\n\
  > plot(x,y)\n> hold\nCurrent plot held\n> y2=cos(x);\n> plot(x,y2)\n> title('Title\
  \ comes here')\n> xlabel('This is x label')\n> ylabel('This is y label')\n> legend('2sin(x)','cos(x)')\n\
  > grid on\n>\n```\n\n也可以通过 `subplot` 命令在同一张图上使用不同的坐标轴来绘制多个图形。\n\n**示例 1-20.**  使用\
  \ `subplot` 命令，在示例 4-5 中给出的三个函数绘制在同一张图的不同坐标轴上。\n\n**解答 1-20.**  可以在命令提示符下输入以下程序来完成给定任务。\n\
  \n```\n> x=linspace(0,pi,200);\n> subplot(3,1,1)\n> plot(x,sin(x))\n> subplot(312)\n\
  > plot(x,cos(x))\n> subplot(3,1,3)\n> plot(x,sin(x)+cos(x))\n> grid on\n>\n```\n\
  \n如图所示，这里使用了 `subplot(312)` 代替 `subplot(3,1,2)`。两者将产生相同的结果。程序执行后，将得到如图 1-8 所示的输出。\n\
  \n![../images/483991_1_En_1_Chapter/483991_1_En_1_Fig8_HTML.jpg](img/483991_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8  \n使用 `subplot` 在同一张图上绘制三个函数\n\n## 习题\n\n* **1.1.**  计算由 ![$$ y=\\frac{e³}{14}+8\\\
