  \nMATLAB 拥有大量内置的、可直接使用的函数，极大地简化了程序员的工作。虽然很难对这些函数进行精确分类，但我们可以将最常用的函数分组为初等数学函数、三角函数、复数、随机数和基本绘图函数等类别，尽管其数量远不止此处列出的这些。使用\
  \ `help` 命令，您可以轻松查看函数的描述及其用法示例。要获取所有初等数学函数的列表，只需在 MATLAB 提示符下键入 `help elfun`。大多数其他内置\
  \ MATLAB 函数将在后续章节中介绍和解释。\n\n### 部分初等数学函数\n\n在本节中，我介绍指数函数以及一些用于舍入和求除法余数的其他重要函数。\n\
