  你刚刚定义的函数接受四个参数。第一个参数 `tag` 表示图表将从 HTML 页面中的哪个标签开始绘制。第二个和第三个参数 `w` 和 `h`（宽度和高度）是用于绘制图表的画布尺寸。最后一个参数\
  \ `series` 是一个值，用于告知函数图表上将显示哪个系列。\n\n通过提供一个带参数的函数来指定代码后，你可以在外部绘制图表，每次调整其属性，而无需修改代码。例如，一个简单的属性可以是决定是否在多系列图表中显示某个系列。\n\
  \n用户将从一组可能的选项中选择一个；单选按钮是实现此目的的最佳控件选择。因此，让我们为每个单选按钮分配一个系列。如清单 10-5 所示，所有控件（按钮）都包含在表格内的一个内部列表中。每个按钮由一个\
  \ `<input>` 元素指定，其中四个系列也作为值被指定。\n\n**清单 10-5.** `ch10_01.html`\n\n```html\n<table>\n\
  \  <tr>\n    <td>\n      <div>\n        <ul>\n          <li><input name=\"dataSeries\"\
  \ value=\"0\" type=\"radio\" checked />欧洲</li>\n          <li><input name=\"dataSeries\"\
  \ value=\"1\" type=\"radio\" />亚洲</li>\n          <li><input name=\"dataSeries\"\
  \ value=\"2\" type=\"radio\" />美洲</li>\n          <li><input name=\"dataSeries\"\
  \ value=\"3\" type=\"radio\" />全部</li>\n        </ul>\n      </div>\n    </td>\n\
  \  </tr>\n</table>\n```\n\n然而，仅在 HTML 页面中设置控件定义是不够的；你还必须创建将单选按钮与 D3 图表关联起来的函数。根据哪个单选按钮处于\
  \ `checked` 状态，图表中将加载数据集中的不同子集。\n\n当用户选择不同的单选按钮时，会将其 `checked` 属性从 `'false'` 更改为\
  \ `'true'`。单选按钮的状态变化会触发检测此事件的 `change()` 函数。该函数为 `series` 变量赋值，指示图表中将显示哪个系列（值为 3\
  \ 表示应显示所有系列），并最终强制重新绘制图表。这样，新数据就会在图表中呈现，而无需重新加载页面（参见清单 10-6）。\n\n**清单 10-6.** `ch10_01.html`\n\
