  \ { return color(d.group); });\n});\n```\n\n现在散点图上有了许多彩色标记，但缺少对颜色及其所属组别的说明。因此，有必要添加一个图例，显示与不同颜色关联的各个组别的名称（见`Listing\
  \ 7-7`）。\n\n`Listing 7-7. Ch7_01.html`\n\n```\nd3.tsv(\"data_09.tsv\", function(error,\
  \ data) {\n  ...\n  svg.selectAll(\".dot\")\n      .data(data)\n    .enter().append(\"\
  circle\")\n      .attr(\"class\", \"dot\")\n      .attr(\"r\", 3.5)\n      .attr(\"\
  cx\", function(d) { return x(d.time); })\n      .attr(\"cy\", function(d) { return\
  \ y(d.intensity); })\n      .style(\"fill\", function(d) { return color(d.group);\
  \ });\n\n  var legend = svg.selectAll(\".legend\")\n      .data(color.domain())\n\
  \    .enter().append(\"g\")\n      .attr(\"class\", \"legend\")\n      .attr(\"\
  transform\", function(d, i) {\n        return \"translate(0,\" + (i * 20) + \")\"\
  ; });\n\n  legend.append(\"rect\")\n      .attr(\"x\", w - 18)\n      .attr(\"width\"\
  , 18)\n      .attr(\"height\", 18)\n      .style(\"fill\", color);\n\n  legend.append(\"\
  text\")\n      .attr(\"x\", w - 24)\n      .attr(\"y\", 9)\n      .attr(\"dy\",\
  \ \".35em\")\n      .style(\"text-anchor\", \"end\")\n      .text(function(d) {\
  \ return d; });\n});\n```\n\n完成所有工作后，你将得到如图 7-1 所示的散点图。\n\n![A978-1-4842-0865-6_7_Fig1_HTML.jpg](img/A978-1-4842-0865-6_7_Fig1_HTML.jpg)\n\
  \n图 7-1. 展示数据分布的散点图\n\n### 标记与符号\n\n在绘制散点图时，一个不容忽视的方面是用于表示数据点的标记形状。毫不意外，D3 库提供了多种方法来通过符号管理标记的表示。在本章中，你将学习这一主题，因为它非常适合散点图这类图表，但其应用并不局限于其他类型的图表（例如折线图）。\n\
  \n\n\n#### 使用符号作为标记\n\n`D3` 库提供了一组可直接用作标记的符号。在表 7-1 中，你可以看到列出了各种预定义符号的表格。\n\n**表\
  \ 7-1.** `D3` 库中的预定义符号\n\n| 符号 | 描述 |\n| --- | --- |\n| `Circle` | 圆形 |\n| `Cross`\
  \ | 希腊十字（或加号） |\n| `Diamond` | 菱形 |\n| `Square` | 与坐标轴对齐的正方形 |\n| `Triangle-down`\
  \ | 向下的等边三角形 |\n| `Triangle-up` | 向上的等边三角形 |\n\n继续之前的示例，你将散点图中的圆点替换为用作标记的不同符号。这些符号将根据数据所属的系列（`Exp1`、`Exp2`\
  \ 或 `Exp3`）而变化。因此，这次为了区分数据所属的系列，将同时使用标记的颜色和形状。\n\n首先，你需要在 `groupMarker` 对象内为每个系列分配一个符号，如代码清单\
  \ 7-8 所示。\n\n**代码清单 7-8.** `Ch7_01b.html`\n\n```\nvar margin = {top: 70, right:\
  \ 20, bottom: 40, left: 40},\nw = 500 - margin.left - margin.right,\nh = 400 - margin.top\
  \ - margin.bottom;\n\nvar groupMarker = {\nExp1: \"cross\",\nExp2: \"diamond\",\n\
  Exp3: \"triangle-down\"\n};\n\nvar color = d3.scale.category10();\n```\n\n然后，从代码中删除与圆点表示相关的行（见代码清单\
  \ 7-9）。这些行将被生成标记的其他代码替换（见代码清单 7-10）。\n\n**代码清单 7-9.** `Ch7_01b.html`\n\n```\nsvg.selectAll(\"\
  .dot\")\n.data(data)\n.enter().append(\"circle\")\n.attr(\"class\", \"dot\")\n.attr(\"\
  r\", 3.5)\n.attr(\"cx\", function(d) { return x(d.time); })\n.attr(\"cy\", function(d)\
  \ { return y(d.intensity); })\n.style(\"fill\", function(d) { return color(d.group);\
  \ });\n```\n\n实际上，你将生成一些符号，它们不过是预定义的 SVG 路径。从代码清单 7-10 中通过使用 `append(\"path\")`\
  \ 函数来添加符号这一事实，你可以猜到这一点。至于符号本身的生成，`D3` 库提供了一个特定的函数：`d3.svg.symbol()`。要显示的符号通过 `type()`\
  \ 函数作为参数传递，例如，如果你想使用交叉符号，则使用 `type(\"cross\")`。\n\n然而，在这种情况下，需要表示的符号有三个，并且它们取决于每个点的系列。因此，你必须通过对\
  \ `groupMarker` 应用函数 `(d)` 来实现对所有数据的迭代，该函数将返回对应于“cross”、“diamond”和“triangle-down”符号的字符串。\n\
  \n最后，由于符号由 SVG 路径构成，因此也可以通过调整层叠样式表（CSS）样式来更改符号。在此示例中，你可以选择通过将 `fill` 属性设置为 `white`\
  \ 来仅表示符号的轮廓。\n\n**代码清单 7-10.** `Ch7_01b.html`\n\n```\nd3.tsv(\"data_09.tsv\", function(error,\
  \ data) {\n...\nsvg.append(\"text\")\n.attr(\"class\", \"label\")\n.attr(\"transform\"\
  , \"rotate(-90)\")\n.attr(\"y\", 6)\n.attr(\"dy\", \".71em\")\n.style(\"text-anchor\"\
  , \"end\")\n.text(\"Intensity\");\n\nsvg.selectAll(\"path\")\n.data(data)\n.enter().append(\"\
  path\")\n.attr(\"transform\", function(d) {\nreturn \"translate(\" + x(d.time) +\
  \ \",\" + y(d.intensity) + \")\";\n})\n.attr(\"d\", d3.svg.symbol().type( function(d)\
  \ {\nreturn groupMarker[d.group];\n}))\n.style(\"fill\", \"white\")\n.style(\"stroke\"\
  , function(d) { return color(d.group); })\n.style(\"stroke-width\", \"1.5px\");\n\
  \nvar legend = svg.selectAll(\".legend\")\n...\n});\n```\n\n图 7-2 展示了使用各种符号代替圆点的散点图。\n\
  \n![A978-1-4842-0865-6_7_Fig2_HTML.jpg](img/A978-1-4842-0865-6_7_Fig2_HTML.jpg)\n\
  \n**图 7-2.** 在散点图中，系列可以用不同的符号表示\n\n#### 使用自定义标记\n\n你刚刚看到，使用 `D3` 库的标记不过是 SVG 路径。你可以利用这一点，通过创建其他符号并将其添加到已定义的符号中来自定义图表。\n\
  \n在互联网上，你可以找到大量的 SVG 符号；一旦决定了要使用的符号，就可以获取其路径，以便将其添加到你的网页中。更具探索精神的读者也可以决定使用 SVG 编辑器来编辑\
  \ SVG 符号。我建议你使用 `Inkscape` 编辑器（见图 7-3）；你可以从其官方网站下载： [`http://inkscape.org`](http://inkscape.org/)。或者，更简单的方法是，你可以从一个已经设计好的\
  \ SVG 符号开始，然后根据自己的喜好进行修改。为此，我推荐使用此链接的 SVG Tryit 页面： [`www.w3schools.com/svg/tryit.asp?filename=trysvg_path`](http://www.w3schools.com/svg/tryit.asp?filename=trysvg_path)（见图\
  \ 7-4）。\n\n![A978-1-4842-0865-6_7_Fig4_HTML.jpg](img/A978-1-4842-0865-6_7_Fig4_HTML.jpg)\n\
  \n**图 7-4.** Tryit 是一个有用的工具，可以通过插入路径来实时预览 SVG 符号\n\n![A978-1-4842-0865-6_7_Fig3_HTML.jpg](img/A978-1-4842-0865-6_7_Fig3_HTML.jpg)\n\
  \n**图 7-3.** Inkscape：一个用于生成符号的优秀 SVG 编辑器\n\n因此，选择三个新符号（例如，新月形、星形和火星符号）来替换默认符号。提取它们的路径，然后插入到一个名为\
  \ `markers` 的新对象的定义中，如代码清单 7-11 所示。\n\n**代码清单 7-11.** `Ch7_01c.html`\n\n```\nvar\
  \ margin = {top: 70, right: 20, bottom: 40, left: 40},\nw = 500 - margin.left -\
  \ margin.right,\nh = 400 - margin.top - margin.bottom;\n\nvar markers = {\nmars:\
  \ \"m15,7 a 7,7 0 1,0 2,2 z l 1,1 7-7m-7,0 h 7 v 7\",\nmoon: \"m15,3 a 8.5,8.5 0\
  \ 1,0 0,13 a 6.5,6.5 0 0,1 0,-13\",\nstar: \"m11,1 3,9h9l-7,5.5 2.5,8.5-7.5-5-7.5,5\
  \ 2.5-8.5-7-6.5h9z\"\n};\n\nvar groupMarker = {\n...\n```\n\n现在，你需要更新在 `groupMarker`\
  \ 变量中定义的符号与组之间的关联，如代码清单 7-12 所示。\n\n**代码清单 7-12.** `Ch7_01c.html`\n\n```\nvar groupMarker\
  \ = {\nExp1: markers.star,\nExp2: markers.moon,\nExp3: markers.mars\n};\n```\n\n\
