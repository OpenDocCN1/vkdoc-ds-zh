  \n**图 11-5.** 包含三个图表的手风琴小部件\n\n默认情况下，你需要点击手风琴标题来激活关联的面板。但你可以更改此行为，设置激活每个面板中部分的事件。例如，你可以将`mouseover`设置为激活事件。为此，你需要将事件作为参数传递给`accordion()`函数。\n\
