- "# 8. 使用 D3 绘制雷达图\n\n本章将介绍一种你尚未读过的图表类型：雷达图。首先，你将了解它是什么，包括其基本特征，以及如何使用 D3 库提供的 SVG\
  \ 元素创建一个雷达图。\n\n你将首先从一个 CSV 文件中读取少量代表性数据。然后，参考这些数据，你将看到如何一步步实现雷达图的所有组件。在本章的第二部分，你将使用相同的代码从更复杂的文件中读取数据，其中要处理的序列数量和数据量都更大。当你需要从头开始表示一种新的图表类型时，这种方法是一种相当常见的做法。你从一个简单但完整的示例开始，然后，一旦实现了基本示例，你将用更复杂、更真实的数据对其进行扩展。\n\
  \n### 雷达图\n\n雷达图因其典型的网状结构，也被称为网络图或蜘蛛图（见图 8-1）。它们是二维图表，能够表示三个或更多定量变量。它们由一系列角度相同的辐条组成，每条辐条代表其中一个变量。每条辐条上都有一个点，该点到中心的距离与给定变量的大小成正比。然后，一条线连接每条辐条上报告的点，从而使图形呈现网状外观。如果没有这条连接线，图表看起来会更像扫描雷达。\n\
  \n![A978-1-4842-0865-6_8_Fig1_HTML.jpg](img/A978-1-4842-0865-6_8_Fig1_HTML.jpg)\n\
  \n**图 8-1.** 雷达图看起来像蜘蛛网\n\n\n\n#### 构建自动缩放坐标轴\n\n复制以下数据并将其保存为 `data_11.csv` 文件（参见代码清单\
  \ 8-1）。\n\n**代码清单 8-1.** `data_11.csv`\n\n```\nsection,set1,set2,\nA,1,6,\nB,2,7,\n\
  C,3,8,\nD,4,9,\nE,5,8,\nF,4,7,\nG,3,6,\nH,2,5,\n```\n\n在代码清单 8-2 中，你定义了绘图区域和边距。然后，你使用\
  \ `category10()` 函数创建了一个颜色序列。\n\n**代码清单 8-2.** `Ch8_01.html`\n\n```\nvar margin\
  \ = {top: 70, right: 20, bottom: 40, left: 40},\nw = 500 - margin.left - margin.right,\n\
  h = 400 - margin.top - margin.bottom;\nvar color = d3.scale.category20();\n```\n\
  \n在你刚刚定义的绘图区域内，你还需要定义一个能够容纳圆形（此处为雷达图）的特定区域。定义好这个区域后，你像定义笛卡尔坐标轴一样定义半径。实际上，雷达图上的每个辐条都被视为一个坐标轴，你可以在其上放置一个变量。因此，你在半径上定义了一个线性比例尺，如代码清单\
  \ 8-3 所示。\n\n**代码清单 8-3.** `ch8_01.html`\n\n```\nvar circleConstraint = d3.min([h,\
  \ w]);\nvar radius = d3.scale.linear()\n    .range([0, (circleConstraint / 2)]);\n\
  ```\n\n你需要找到绘图区域的中心。这是雷达图的中心，也是所有辐条向外辐射的起点（参见代码清单 8-4）。\n\n**代码清单 8-4.** `Ch8_01.html`\n\
  \n```\nvar centerXPos = w / 2 + margin.left;\nvar centerYPos = h / 2 + margin.top;\n\
  ```\n\n开始绘制根元素 `<svg>`，如代码清单 8-5 所示。\n\n**代码清单 8-5.** `Ch8_01.html`\n\n```\nvar\
  \ svg = d3.select(\"body\").append(\"svg\")\n    .attr(\"width\", w + margin.left\
  \ + margin.right)\n    .attr(\"height\", h + margin.top + margin.bottom)\n    .append(\"\
  g\")\n    .attr(\"transform\", \"translate(\" + centerXPos + \", \" + centerYPos\
  \ + \")\");\n```\n\n现在，如代码清单 8-6 所示，你使用 `d3.csv()` 函数读取文件内容。你需要验证读取的值 `set1` 和 `set2`\
  \ 被解释为数值。你还希望知道所有这些值中的最大值，以便定义一个根据其值进行扩展的比例尺。\n\n**代码清单 8-6.** `ch8_01.html`\n\n\
  ```\nd3.csv(\"data_11.csv\", function(error, data) {\n    var maxValue = 0;\n  \
  \  data.forEach(function(d) {\n        d.set1 = +d.set1;\n        d.set2 = +d.set2;\n\
  \        if(d.set1 > maxValue)\n            maxValue = d.set1;\n        if(d.set2\
  \ > maxValue)\n            maxValue = d.set2;\n    });\n});\n```\n\n一旦知道了输入数据的最大值，你就将完整比例尺的值设置为该最大值乘以\
  \ 1.5。在这种情况下，你无法使用坐标轴上自动生成的刻度，而必须手动定义它们。实际上，这些刻度具有球形形状，因此具有相当特殊的特征。此示例将半径轴的范围划分为五个刻度。定义好刻度的值后，你可以为半径轴分配一个定义域（参见代码清单\
  \ 8-7）。\n\n**代码清单 8-7.** `Ch8_01.html`\n\n```\nd3.csv(\"data_11.csv\", function(error,\
  \ data) {\n    ...\n    data.forEach(function(d) {\n        ...\n    });\n    var\
  \ topValue = 1.5 * maxValue;\n    var ticks = [];\n    for(i = 0; i < 5; i += 1){\n\
  \        ticks[i] = topValue * i / 5;\n    }\n    radius.domain([0, topValue]);\n\
  });\n```\n\n现在你已经拥有了所有数值，我们可以嵌入一些 `<svg>` 元素，以设计一个雷达网格，该网格的形状和值将根据输入的数据而变化（参见代码清单\
  \ 8-8）。\n\n**代码清单 8-8.** `Ch8_01.html`\n\n```\nd3.csv(\"data_11.csv\", function(error,\
