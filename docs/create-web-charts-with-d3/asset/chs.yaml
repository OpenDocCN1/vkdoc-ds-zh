  ### DOM


  在使用作用于 HTML 页面结构元素层面的库时，我们不可避免地要谈到 DOM。我将经常提及这个概念，因为它是每个网页的基础结构。万维网联盟（W3C）认为有必要（也确实如此）为结构化文档的表示创建一个官方标准，以便为所有编程语言和平台制定指导方针。HTML
  文档以及 XML 文档的树形结构完全遵循该标准制定的指导方针。以下是一个 HTML 文档的示例：


  ```

  <HTML>

  <HEAD>

  <TITLE>一个标题</TITLE>

  </HEAD>

  <BODY>

  你好

  <BR>

  </BODY>

  </HTML>

  ```


  该文档的 DOM 树可以如图 1-11 所示进行表示。


  ![A978-1-4842-0865-6_1_Fig11_HTML.jpg](img/A978-1-4842-0865-6_1_Fig11_HTML.jpg)


  **图 1-11.** DOM 树形结构示例


  但是，DOM 标准并不仅限于制定文档中 DOM 应如何构建的指导方针；该标准还定义了许多旨在作用于构成文档的元素的功能。因此，任何与文档相关的操作（创建、插入、删除）都应遵循
  DOM 标准。结果就是，无论你使用哪种编程语言或工作在哪个平台上，你总能找到该标准所表达的相同功能。通常，术语 DOM 也适用于管理网页所有元素的 API。


  所有这些都很重要，因为任何选择阅读本书的人都有兴趣开发图表，这些图表不仅使用 DOM，而且本身也是 DOM 的一部分，并且其每个方面都可以在 JavaScript
  中进行检查和操作。在本书中，你将学习如何充分利用 D3 库。借助这个 JavaScript 库，你可以访问每个图表元素，例如更改对象的颜色和位置。




