  \n**图 11-8.** 网页展示了三个封闭在不同容器中的折线图\n\n### 本章小结\n\n在本章中，你已经了解了如何利用 jQuery UI 库提供的小部件的潜力，这些小部件有助于改善图表的呈现方式。你已经了解了如何将多个图表放入诸如折叠面板和选项卡之类的容器中，这样即使它们占据同一区域，你也可以逐个查看它们。你还了解了如何调整这些容器的大小，并将这种能力扩展到使用\
  \ jqPlot 库开发的图表上。\n\n在下一章也是最后一章中，你将了解如何使用 JSON 格式处理结构化数据。你将看到处理高度结构化数据以进行数据可视化是多么“自然”，而使用其他\
  \ JavaScript 库和编程语言来实现这种可视化可能颇具挑战性。\n\n"
- "# 12. JSON 与布局——处理结构化数据\n\n处理完图表的所有图形方面之后，是时候更详细地分析输入数据了。在前面的章节中，你开始将输入数据的值分配给数组。然后，你使用了包含在\
  \ CSV 或 TSV 文件中的表格数据。这一步使你能够处理可视化所需的大部分数据，但实际上，还有更复杂的数据结构，例如树形层次结构。\n\n实际上，为了获取此类数据，通常需要与其他技术进行交互，为此，你需要找到一种非常适合任何数据源的方法。需要使用一种通用的文本格式，该格式易于被不同的脚本语言（尤其是\
  \ JavaScript）处理，并且对人类来说仍然易于理解，这导致了 JavaScript 对象表示法（JSON）格式的使用。你在第 1 章中简要了解了这种格式，但现在你将看到如何具体使用它来处理来自外部源的输入数据。\n\
  \n本章将详细研究 JSON 格式。首先，你将通过分析一些语法图来了解 JSON 格式中如何存在结构化数据。然后，你将进入实际示例。\n\n\n\n### JSON\
  \ 格式\n\nJSON（JavaScript 对象表示法）是一种数据交换格式（详见 [`http://json.org`](http://json.org/)）。由于其树状结构（每个元素被称为一个名称-值对），人类易于读写，机器也易于解析和生成。这是其日益普及的主要原因。\n\
  \nJSON 结构建立在两种不同结构的组合之上：数组和对象（见图 12-1）。在其中，你可以定义所有常用的经典原始值，即使在其它语言中也是如此：数字、布尔值、字符串和空值。这使得其中包含的值可以在各种编程语言之间进行交换。（在\
  \ [`www.json.org`](http://www.json.org/) 上，你可以找到所有处理 JSON 格式的语言列表，以及所有相关技术的列表，例如库、模块、插件等。）\n\
  \n![A978-1-4842-0865-6_12_Fig1_HTML.jpg](img/A978-1-4842-0865-6_12_Fig1_HTML.jpg)\n\
  \n图 12-1. JSON 的语法图\n\n为了更好地理解图 12-1 中的语法图，你可以分析 JSON 格式是如何构建的。你必须考虑两件事。第一，对象和数组都包含一系列由图中\
  \ `value` 标签标识的值。`value` 指的是任何类型的值，例如字符串、数字或布尔值，它甚至可以是对象或数组。\n\n除此之外，你很容易猜到 JSON\
  \ 结构是一个具有不同层级的树状结构。树的节点要么是数组，要么是对象；叶子节点是其中包含的值。\n\n考虑一些例子。如果你有一个只有一层结构的 JSON，那么只有两种可能：\n\
  \n- 一个值的数组\n- 一个带有值的对象\n\n如果你将结构扩展到两层，则有四种可能（为简单起见，假设树是对称的）：\n\n- 数组的数组\n- 对象的数组\n\
  - 带有数组的对象\n- 带有对象的对象\n\n以此类推；情况逐渐变得更加复杂。通过这种方式，你可以生成所有可能的数据结构，例如树（见图 12-2）。\n\n\
  ![A978-1-4842-0865-6_12_Fig2_HTML.jpg](img/A978-1-4842-0865-6_12_Fig2_HTML.jpg)\n\
  \n图 12-2. 一种树状数据结构\n\n现在，根据上述关于 JSON 格式的说明，编写图 12-2 中所示的树结构，然后将文件保存为 `tree.json`。如清单\
  \ 12-1 所示，通过交替使用对象和数组，可以描述任何数据结构，甚至更复杂的结构。\n\n清单 12-1. Tree.json\n\n```\n{\n  \"\
  name\": \"root\",\n  \"children\": [\n    {\n      \"name\": \"parent A\",\n   \
  \   \"children\": [\n        {\"name\": \"child A1\"},\n        {\"name\": \"child\
  \ A2\"}\n      ]\n    },{\n      \"name\": \"parent B\",\n      \"children\": [\n\
  \        {\"name\": \"child B1\"}\n      ]\n    },{\n      \"name\": \"parent C\"\
  ,\n      \"children\": [\n        {\"name\": \"child C1\"},\n        {\"name\":\
  \ \"child C2\"},\n        {\"name\": \"child C3\"}\n      ]\n    }\n  ]\n}\n```\n\
  \n### JSON 不是 JavaScript 对象字面量\n\n这一点值得更详细地讨论，因为人们很容易混淆 JSON 和 JavaScript 对象字面量。\n\
  \n当你有两个不同的系统（可能使用不同的编程语言）并且它们需要通信时，它们将使用字符串来交换数据。字符串中描述的数据将遵循一种格式，在你的例子中就是 JSON。\n\
  \n即使 JSON 字符串与 JavaScript 结构化对象具有相同的格式，它也只是一个字符串。\n\n相反，一旦 JSON 文件被 `d3.json()`\
  \ 函数解释，它将被视为一个实际的结构化对象，其数据存储在变量、数组和对象中，以 JavaScript 处理这些实例的方式。\n\n### D3 布局\n\n\
  该库提供了称为布局的 D3 模块，帮助开发者构建结构以处理复杂数据。此外，D3 布局凭借其内部实现，在管理构成图表的元素坐标计算方面，是非常有用的工具。事实上，一旦将数据结构加载到布局（例如树）中，布局就会为每个将在绘图区域中占据位置的节点计算\
  \ `x` 和 `y` 坐标。\n\n正是由于可能的数据结构数量庞大，D3 库提供了一组内置布局。特别是，为了处理层次化数据结构，D3 库提供了以下布局：\n\n\
  - `partition`\n- `tree`\n- `cluster`\n- `pack`\n- `treemap`\n\n### 从一个简单的树开始\n\n\
  作为第一个示例，你将实现一个显示树的 HTML 页面。层次结构的数据正是包含在文件 `tree.json`（见清单 12-1）中的数据。到目前为止，你已经看到借助\
  \ `d3.csv()` 和 `d3.tsv()` 函数读取 CSV 或 TSV 文件中的数据是多么容易。类似地，D3 库提供了一个名为 `d3.json()`\
  \ 的函数。\n\n```\nd3.json(\"path/to/file.json\", function(error, root){\n  ...\n});\n\
  ```\n\n在专门为层次化数据结构提供的各种 D3 布局中，`d3.layout.tree` 最适合所选示例。作为参考，我选择了一个复杂的树状图表示，即 M.\
  \ Bostock 的示例 #4063570 ([`http://bl.ocks.org/mbostock/4063570`](http://bl.ocks.org/mbostock/4063570))。\n\
  \n清单 12-2. Ch12-1.html\n\n```\n<HTML>\n<HEAD>\n<meta charset=\"utf-8\">\n<script\
  \ src=\"http://d3js.org/d3.v3.js\"></script>\n<STYLE>\n.node circle {\n  fill: #fff;\n\
  \  stroke: steelblue;\n  stroke-width: 1.5px;\n}\n.node {\n  font: 20px sans-serif;\n\
  }\n.link {\n  fill: none;\n  stroke: #ccc;\n  stroke-width: 1.5px;\n}\n</STYLE>\n\
  </HEAD>\n<body>\n<script>\nvar width = 600;\nvar height = 500;\n\nvar tree = d3.layout.tree()\n\
  \    .size([height, width-200]);\n\nvar diagonal = d3.svg.diagonal()\n    .projection\
  \ (function(d) {return [d.y, d.x];});\n\nvar svg = d3.select(\"body\").append(\"\
  svg\")\n    .attr(\"width\",width)\n    .attr(\"height\",height)\n  .append(\"g\"\
  )\n    .attr(\"transform\", \"translate(100, 0)\");\n\nd3.json(\"tree.json\", function(error,\
  \ root){\n  var nodes = tree.nodes(root);\n  var links = tree.links(nodes);\n\n\
  \  var link = svg.selectAll(\".link\")\n      .data(links)\n    .enter().append(\"\
  path\")\n      .attr(\"class\", \"link\")\n      .attr(\"d\", diagonal);\n\n  var\
  \ node = svg.selectAll(\".node\")\n      .data(nodes)\n    .enter().append(\"g\"\
  )\n      .attr(\"class\", \"node\")\n      .attr(\"transform\", function(d) { return\
  \ \"translate(\" + d.y + \", \" + d.x + \")\"; });\n\n  node.append(\"circle\")\n\
  \      .attr(\"r\", 4.5);\n\n  node.append(\"text\")\n      .attr(\"dx\", function(d)\
  \ { return d.children ? -8 : 8; })\n      .attr(\"dy\", 3)\n      .style(\"text-anchor\"\
  , function(d) { return d.children ? \"end\" : \"start\"; })\n      .text( function(d){return\
  \ d.name;});\n});\n</script>\n</BODY>\n</HTML>\n```\n\n通过这种方式，你得到了一棵树（见图 12-3），它与图\
  \ 12-2 中表示的树非常相似。\n\n![A978-1-4842-0865-6_12_Fig3_HTML.jpg](img/A978-1-4842-0865-6_12_Fig3_HTML.jpg)\n\
  \n图 12-3. 从 JSON 文件动态生成的树\n\n\n\n### 树形布局分析\n\n如果你仔细观察图 12-3 中的树，就会发现它不过是`tree.js`文件中以\
  \ JSON 格式描述的层次结构的动态呈现。你在本例中实现的代码能够表示任意树形结构，无论其层级、节点和叶子的数量如何。\n\n这种高效的数据管理 JSON 及其正确可视化，很大程度上归功于\
  \ D3 布局所扮演的角色。在本例中，你使用了`d3.layout.tree`。现在你将详细了解它的工作原理，以及它如何在内部处理从 JSON 文件读取的数据。\n\
  \n通过分析清单 12-2 所示的代码，你可以看到布局的声明。下一步是使用`size()`函数声明绘图区域的大小（见清单 12-3）。这一步非常重要，因为布局的主要目的之一就是自动计算树中所有节点的所有`x`和`y`坐标。计算出的`x`和`y`值完全取决于传递给`size()`函数的两个参数。\n\
  \n**清单 12-3.** `Ch12-1.html`\n\n```\nvar tree = d3.layout.tree()\n    .size([height,\
  \ width-200]);\n```\n\n从 JSON 文件读取的数据存储在`root`变量中。然后，通过`nodes()`函数将其加载到布局中（见清单 12-4）。此操作会生成一个包含构成树的所有节点的数组，你将把这个数组存储在`nodes`变量中。下一步操作是生成一个包含连接树中所有节点的链接的数组`links`。你可以使用`links()`函数来创建它。\n\
  \n**清单 12-4.** `Ch12-1.html`\n\n```\nd3.json(\"tree.json\", function(error, root){\n\
  \    var nodes = tree.nodes(root);\n    var links = tree.links(nodes);\n    ...\n\
  });\n```\n\n查看刚刚创建的两个数组的内容，你会发现一系列嵌套的数据结构，比 JSON 文件中描述的复杂得多。该树由 10 个节点和 9 个链接组成，这些对象分别包含在`nodes`和`links`两个数组中（见图\
  \ 12-4）。此外，你还会注意到每个节点都附带两个新字段`x`和`y`，这正是布局计算出的坐标。\n\n![A978-1-4842-0865-6_12_Fig4a_HTML.jpg](img/A978-1-4842-0865-6_12_Fig4a_HTML.jpg)![A978-1-4842-0865-6_12_Fig4b_HTML.jpg](img/A978-1-4842-0865-6_12_Fig4b_HTML.jpg)\n\
  \n**图 12-4.** `d3.layout.tree` 的内部结构相当复杂\n\n图 12-5 清晰地展示了布局节点中的`x`和`y`坐标如何与将在树上呈现的绘图区域相匹配。\n\
  \n![A978-1-4842-0865-6_12_Fig5_HTML.jpg](img/A978-1-4842-0865-6_12_Fig5_HTML.jpg)\n\
  \n**图 12-5.** `d3.layout.tree` 根据绘图区域的大小自动计算每个节点的坐标\n\n### 圆形树形表示\n\n你在前一个示例中看到的树形结构是一个简单的结构，随着节点和层级数量的增加，结构会变得越来越复杂。在这种情况下，一种常见的做法是将树表示为圆形。\n\
  \n首先，通过编写一个新的 JSON 格式结构（见清单 12-5）来增加树的复杂度，然后将其保存为`tree2.json`。\n\n**清单 12-5.** `tree2.json`\n\
  \n```\n{\n    \"name\": \"root\",\n    \"children\": [\n        {\n            \"\
  name\": \"parent A\",\n            \"children\": [\n                {\"name\": \"\
  child A1\"},\n                {\"name\": \"child A2\"},\n                {\"name\"\
  : \"child A3\"},\n                {\"name\": \"child A4\"},\n                {\"\
  name\": \"child A5\"},\n                {\"name\": \"child A6\"}\n            ]\n\
  \        },{\n            \"name\": \"parent B\",\n            \"children\": [\n\
  \                {\"name\": \"child B1\"},\n                {\"name\": \"child B2\"\
  },\n                {\"name\": \"child B3\"},\n                {\"name\": \"child\
  \ B4\"},\n                {\"name\": \"child B5\"},\n                {\"name\":\
  \ \"child B6\"},\n                {\"name\": \"child B7\"},\n                {\"\
  name\": \"child B8\"}\n            ]\n        },{\n            \"name\": \"parent\
  \ C\",\n            \"children\": [\n                {\"name\": \"child C1\"},\n\
  \                {\"name\": \"child C2\"},\n                {\"name\": \"child C3\"\
  },\n                {\"name\": \"child C4\"}\n            ]\n        }\n    ]\n\
  }\n```\n\n现在输入用于表示圆形树的 HTML 页面代码（见清单 12-6）。\n\n**清单 12-6.** `ch12-2.html`\n\n```\n\
  <HTML>\n<HEAD>\n<meta charset=\"utf-8\">\n<script src=\"http://d3js.org/d3.v3.js\"\
  ></script>\n<style type=\"text/css\">\n.node circle {\n    fill: #fff;\n    stroke:\
  \ steelblue;\n    stroke-width: 1.5px;\n}\n.node {\n    font: 20px sans-serif;\n\
  }\n.link {\n    fill: none;\n    stroke: #ccc;\n    stroke-width: 1.5px;\n}\n</style>\n\
