  \n\n\n现在，请思考您想要设定的颜色和域。在前面的案例中，您为每个条形（国家）绘制了不同的颜色。实际上，您甚至可以让所有条形都使用同一种颜色。您之前的方法是一种可选方案，主要出于美学因素的考虑。然而，在本例中，使用一组不同的颜色是必要的，以便区分构成每个条形的各个部分。因此，每个条形将拥有一系列相同的颜色，其中每种颜色对应一个生产部门。一个小提示：当您需要图例来标识不同的数据表示时，您需要使用一系列颜色，反之亦然。您根据文件的标题行定义颜色的域，并通过一个过滤器删除第一个项目“Country”（国家）（参见清单\
