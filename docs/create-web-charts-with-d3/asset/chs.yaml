  \ `x` 和 `y` 的最大值（有时也需要最小值）。在前面的案例中，你使用了 `d3.max` 和 `d3.min` 函数，但这些函数只对数组有效，对对象无效。你插入的输入数据数组是一个对象数组。如何解决这个问题？有几种方法。也许最直接的方法是扫描数据，找出\
  \ `x` 和 `y` 的最大值。在清单 3-16 中，你定义了两个变量来存放这两个最大值。然后，每次扫描一个对象的 `x` 和 `y` 值，将当前的 `x`\
  \ 和 `y` 值与 `xMax` 和 `yMax` 的值进行比较，以确定哪个值更大。两者中较大的那个将成为新的最大值。\n\n**清单 3-16.** `Ch3_02.html`\n\
  \n```\nvar xMax = 0, yMax = 0;\ndata.forEach(function(d) {\n  if(d.x > xMax)\n \
  \   xMax =  d.x;\n  if(d.y > yMax)\n    yMax =  d.y;\n});\n```\n\n有几个有用的 D3 函数可以处理数组，那么为什么不直接从输入的对象数组中创建两个数组呢？一个包含\
