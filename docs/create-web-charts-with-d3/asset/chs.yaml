  \n**Figure 5-10.** 一个甜甜圈图\n\n### 极区图\n\n极区图与饼图非常相似，但不同之处在于每个扇区从圆心延伸的距离，从而可以表示另一个值。每个扇区的范围与这个新添加的值成正比（见图\
