  \n**图 8-7.** 带有颜色填充区域的雷达图\n\n### 总结\n\n本章解释了如何实现雷达图。这种图表类型并不常见，但对于突出 D3 库的潜力特别有用。它通过一个示例帮助你理解如何开发其他不同于最常见类型的图表。\n\
  \n下一章通过考虑两个不同的案例来结束本书。这些案例旨在以简化的方式提出开发人员在处理真实数据时经常面临的经典情况。在第一个示例中，你将看到如何使用 D3 来表示实时生成或获取的数据。你将创建一个不断更新的图表，始终显示当前状态。在第二个示例中，你将使用\
  \ D3 库读取数据库中包含的数据。\n\n\n\n"
- "# 9. 使用 D3 处理实时数据\n\n在本章中，你将学习如何使用 D3 库开发实时图表。具体来说，你将创建一个折线图，用于显示由一个模拟外部数据源的函数生成的实时数值。数据将持续生成，因此折线图也会随之变化，始终展示最新情况。\n\
  \n在本章的第二部分，你将开发一个稍微复杂的图表。这次，你将使用一个数据源为真实数据库的示例。首先，你将实现一个折线图，用于读取外部文件中包含的数据。随后，你将学习如何使用该示例读取相同的数据，但这次数据来自数据库中的表。\n\
  \n### 实时图表\n\n你有一个数据源，它模拟了一个返回变量性能随机变化的函数。这些值存储在一个具有缓冲区功能的数组中，你希望该数组仅包含最近的十个值。对于每个生成或获取的输入值，最旧的值将被新值替换。该数组中的数据以折线图的形式显示，每\
  \ 3 秒更新一次。所有操作通过点击一个按钮来激活。\n\n让我们先为绘制折线图打下基础（如需回顾使用 D3 库开发折线图，请参阅第 3 章）。首先，编写用于构建图表的\
  \ HTML 结构，如代码清单 9-1 所示。\n\n**代码清单 9-1.** `Ch9_01.html`\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"http://d3js.org/d3.v3.js\"\
  ></script>\n<style>\n// 在此处添加 CSS 样式\n</style>\n<body>\n<script type=\"text/javascript\"\
  >\n// 在此处添加 JavaScript 代码\n</script>\n</body>\n</html>\n```\n\n现在，你开始定义在编写代码过程中会用到的变量，首先从输入数据的管理开始。如前所述，你将在图表上表示的数据来自一个函数，该函数从一个起始值生成正或负的随机变化。你决定从\
  \ 10 开始。\n\n因此，从这个值开始，你从随机函数接收一系列值，并将它们收集到一个名为 `data` 的数组中（见代码清单 9-2）。目前，你只为其分配了起始值\
  \ (10)。对于这个数组，为了实时接收值，你需要设置一个最大限制，在本例中为十一个元素（0–10）。一旦填满，你将把该数组作为一个队列来管理，其中最旧的项将被移除，以便为新项腾出空间。\n\
  \n**代码清单 9-2.** `Ch9_01.html`\n\n```javascript\n<script type=\"text/javascript\"\
  >\nvar data = [10];\nw = 400;\nh = 300;\nmargin_x = 32;\nmargin_y = 20;\nymax =\
  \ 20;\nymin = 0;\ny = d3.scale.linear().domain([ymin, ymax]).range([0 + margin_y,\
  \ h - margin_y]);\nx = d3.scale.linear().domain([0, 10]).range([0 + margin_x, w\
  \ - margin_x]);\n</script>\n```\n\n`data` 数组中包含的值将沿 y 轴表示，因此有必要确定刻度标签需要覆盖的值范围。从值\
  \ 10 开始，你可以决定，例如，该范围覆盖从 0 到 20 的值（稍后，你将确保刻度对应于 5 的倍数范围，即 0、5、10、15 和 20）。由于要显示的值是随机生成的，它们会逐渐达到甚至超过\
  \ 20，如果发生这种情况，你会看到线条消失在图表的上边缘之外。该怎么办呢？\n\n因为主要目标是创建一个在获取新数据后能重绘自身的图表，所以你将确保刻度标签也能根据\
  \ `data` 数组中包含的值所覆盖的范围进行调整。为此，你需要使用 `ymax` 和 `ymin` 变量定义 `y` 的范围，而 `x` 范围则覆盖静态范围\
  \ [0–10]。\n\n`w` 和 `h` 变量（宽度和高度）定义了绘制折线图的绘图区域的大小，而 `margin_x` 和 `margin_y` 则允许你调整边距。\n\
  \n现在，让我们创建将表示图表各个部分的标量矢量图形（SVG）元素。你首先创建 `<svg>` 根元素，然后定义 x 轴和 y 轴，如代码清单 9-3 所示。\n\
  \n**代码清单 9-3.** `Ch9_01.html`\n\n```javascript\n<script type=\"text/javascript\"\
  >\n...\ny = d3.scale.linear().domain([ymin, ymax]).range([0 + margin_y, h - margin_y]);\n\
  x = d3.scale.linear().domain([0, 10]).range([0 + margin_x, w - margin_x]);\n\nvar\
  \ svg = d3.select(\"body\")\n    .append(\"svg:svg\")\n    .attr(\"width\", w)\n\
  \    .attr(\"height\", h);\n\nvar g = svg.append(\"svg:g\")\n    .attr(\"transform\"\
  , \"translate(0, \" + h + \")\");\n\n// 绘制 x 轴\n```\n\n\n\n```javascript\ng.append(\"\
  svg:line\")\n.attr(\"x1\", x(0))\n.attr(\"y1\", -y(0))\n.attr(\"x2\", x(w))\n.attr(\"\
  y2\", -y(0));\n// 绘制 y 轴\ng.append(\"svg:line\")\n.attr(\"x1\", x(0))\n.attr(\"\
  y1\", -y(0))\n.attr(\"x2\", x(0))\n.attr(\"y2\", -y(25));\n</script>\n```\n\n接下来，在两个坐标轴上添加刻度线和对应的标签，然后添加网格。最后，使用\
  \ `line()` 函数在图表上绘制线条（参见清单 9-4）。\n\n**清单 9-4.** `Ch9_01.html`\n\n```javascript\n\
  <script type=\"text/javascript\">\n...\ng.append(\"svg:line\")\n.attr(\"x1\", x(0))\n\
  .attr(\"y1\", -y(0))\n.attr(\"x2\", x(0))\n.attr(\"y2\", -y(25));\n// 绘制 x 轴标签\n\
  g.selectAll(\".xLabel\")\n.data(x.ticks(5))\n.enter().append(\"svg:text\")\n.attr(\"\
  class\", \"xLabel\")\n.text(String)\n.attr(\"x\", function(d) { return x(d) })\n\
  .attr(\"y\", 0)\n.attr(\"text-anchor\", \"middle\");\n// 绘制 y 轴标签\ng.selectAll(\"\
  .yLabel\")\n.data(y.ticks(5))\n.enter().append(\"svg:text\")\n.attr(\"class\", \"\
  yLabel\")\n.text(String)\n.attr(\"x\", 25)\n.attr(\"y\", function(d) { return -y(d)\
  \ })\n.attr(\"text-anchor\", \"end\");\n// 绘制 x 轴刻度线\ng.selectAll(\".xTicks\")\n\
  .data(x.ticks(5))\n.enter().append(\"svg:line\")\n.attr(\"class\", \"xTicks\")\n\
  .attr(\"x1\", function(d) { return x(d); })\n.attr(\"y1\", -y(0))\n.attr(\"x2\"\
  , function(d) { return x(d); })\n.attr(\"y2\", -y(0) - 5);\n// 绘制 y 轴刻度线\ng.selectAll(\"\
  .yTicks\")\n.data(y.ticks(5))\n.enter().append(\"svg:line\")\n.attr(\"class\", \"\
  yTicks\")\n.attr(\"y1\", function(d) { return -1 * y(d); })\n.attr(\"x1\", x(0)\
  \ +5)\n.attr(\"y2\", function(d) { return -1 * y(d); })\n.attr(\"x2\", x(0))\n//\
  \ 绘制 x 轴网格\ng.selectAll(\".xGrids\")\n.data(x.ticks(5))\n.enter().append(\"svg:line\"\
  )\n.attr(\"class\", \"xGrids\")\n.attr(\"x1\", function(d) { return x(d); })\n.attr(\"\
  y1\", -y(0))\n.attr(\"x2\", function(d) { return x(d); })\n.attr(\"y2\", -y(25));\n\
