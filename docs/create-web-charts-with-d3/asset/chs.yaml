  \n**图 7-8.** 该散点图展示了应用于 TSV 文件中数据的聚类分析的一种可能结果\n\n\n\n### 高亮数据点\n\n你尚未在 `D3` 库中涉及的另一项功能，但在\
  \ `jqPlot` 库中已经见过（参见第 10 章），即高亮显示及其相关事件。`D3` 库甚至允许你为图表添加此功能，并以与 `jqPlot` 库非常相似的方式处理事件。\n\
  \n`D3` 库提供了一个特定的函数来激活或移除事件监听器：`on()` 函数。该函数通过方法链直接应用于选择集，通常需要两个参数：事件类型和监听器。\n\n\
  `selection.on(type, listener);`\n\n第一个参数是你要激活的事件类型，以包含事件名称的字符串形式表示（例如 `mouseover`、`submit`\
  \ 等）。第二个参数通常由一个函数构成，该函数充当监听器，在事件触发时执行操作。\n\n基于以上内容，如果要添加高亮功能，你需要管理两个特定事件：一个是用户将鼠标悬停在数据点上时将其高亮显示，另一个是用户将鼠标从数据点上移开时，将其恢复为正常状态。这两个事件在\
  \ `D3` 库中分别定义为 `mouseover` 和 `mouseout`。现在你需要将这些事件与两个不同的操作关联起来。对于 `mouseover`，你将放大数据点的体积，并增强其颜色的鲜艳度，使其与其他数据点形成更鲜明的对比。而对于\
  \ `mouseout`，你将执行完全相反的操作，恢复原始数据点的颜色和大小。\n\n清单 7-28 展示了应用于散点图代码的高亮功能。\n\n**清单 7-28.**\
