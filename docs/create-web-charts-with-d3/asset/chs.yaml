  \n\n\n### 使用滑块\n\n在之前的示例中，用户首先通过选中某个单选按钮来设置要显示的序列。这一次，当选中某个序列时，其他序列将保持不变，但你可以修改所选序列的颜色。为此，你将插入一组三个滑块。在此场景中，用户以预定义颜色选择一个序列，然后可以通过调整构成该颜色的三个\
  \ RGB 值来修改它。现在，你有了一个选择，随后可以进行精细调整。\n\n当你需要通过在一段连续值范围内滚动来更改某个属性的值时，滑块就是所需的控件类型。在这种情况下，需要三个滑块，分别对应每种颜色（红、绿、蓝），以便用户可以调整\
