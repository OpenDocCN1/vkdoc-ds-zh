  \n**图 9-2.** 从 TSV 文件读取数据的多系列图表\n\n\n\n#### 进入实际案例\n\n现在，让我们进入实际案例，你将处理数据库中的表。对于数据源，你选择\
  \ MySQL 测试数据库中一个名为 `sales` 的表。创建好这个名称的表后，你可以通过执行 SQL 序列来填充数据（见代码清单 9-13）。\n\n**代码清单\
  \ 9-13.** `sales.sql`\n\n```sql\ninsert into sales\nvalues ('2012-02-12', 52, 40);\n\
  insert into sales\nvalues ('2012-02-27', 56, 35);\ninsert into sales\nvalues ('2012-03-02',\
  \ 31, 45);\ninsert into sales\nvalues ('2012-03-14', 33, 44);\ninsert into sales\n\
  values ('2012-03-30', 44, 54);\ninsert into sales\nvalues ('2012-04-07', 50, 34);\n\
  insert into sales\nvalues ('2012-04-18', 65, 36);\ninsert into sales\nvalues ('2012-05-02',\
  \ 56, 40);\ninsert into sales\nvalues ('2012-05-19', 41, 56);\ninsert into sales\n\
  values ('2012-05-28', 45, 32);\ninsert into sales\nvalues ('2012-06-03', 54, 44);\n\
  insert into sales\nvalues ('2012-06-18', 43, 46);\ninsert into sales\nvalues ('2012-06-29',\
  \ 39, 52);\n```\n\n最好将 PHP 脚本写在单独的文件中，并保存为 `myPHP.php`。该文件的内容如代码清单 9-14 所示。\n\n\
  **代码清单 9-14.** `myPHP.php`\n\n```php\n<?php\n$username = \"dbuser\";\n$password\
  \ = \"dbuser\";\n$host = \"localhost\";\n$database = \"test\";\n$server = mysql_connect($host,\
  \ $username, $password);\n$connection = mysql_select_db($database, $server);\n$myquery\
  \ = \"SELECT * FROM sales\";\n$query = mysql_query($myquery);\nif ( ! $myquery )\
  \ {\n    echo mysql_error();\n    die;\n}\n$data = array();\nfor ($x = 0; $x < mysql_num_rows($query);\
  \ $x++) {\n    $data[] = mysql_fetch_assoc($query);\n}\necho json_encode($data);\n\
  mysql_close($server);\n?>\n```\n\n通常，PHP 脚本可以通过其特殊的开始和结束处理指令 `<?php` 和 `?>` 来识别。这段简短但功能强大且多用途的代码片段通常在我们需要连接数据库时使用。让我们仔细看看它的作用。\n\
  \n在这个例子中，选择了 `dbuser` 作为用户名，`dbuser` 作为密码，但这些值取决于你要连接的数据库。数据库和主机名的值也是如此。因此，为了连接数据库，你必须首先定义一组标识变量，如代码清单\
  \ 9-15 所示。\n\n**代码清单 9-15.** `myPHP.php`\n\n```php\n$username = \"homedbuser\";\n\
  $password = \"homedbuser\";\n$host = \"localhost\";\n$database = \"homedb\";\n```\n\
  \n定义好这些变量后，PHP 提供了一组已实现的函数，你只需将这些变量作为参数传递，即可与数据库建立连接。在这个例子中，你需要调用 `mysql_connect()`\
  \ 和 `mysql_select_db()` 函数来创建与数据库的连接，无需再定义其他内容（见代码清单 9-16）。\n\n**代码清单 9-16.** `myPHP.php`\n\
  \n```php\n$server = mysql_connect($host, $username, $password);\n$connection = mysql_select_db($database,\
  \ $server);\n```\n\n即使是输入 SQL 查询，PHP 也证明了自己是一个非常实用的工具。代码清单 9-17 是一个非常简单的示例，展示了如何执行\
  \ SQL 查询以从数据库中检索数据。如果你不熟悉 SQL 语言，查询是一种针对特定数据库的声明性语句，用于获取其中包含的所需数据。你可以轻松识别查询，因为它由一个\
  \ `SELECT` 语句后跟一个 `FROM` 语句，并且几乎总是在末尾有一个 `WHERE` 语句。\n\n> **注意：** 如果你没有 SQL 语言经验，并且想在不安装数据库和其他环境的情况下进行一些练习，我建议访问\
  \ w3schools 网站的以下网页：[`www.w3schools.com/sql`](http://www.w3schools.com/sql)。在该页面中，你将找到关于命令的完整文档，包含许多示例，甚至可以通过嵌入\
  \ SQL 测试查询来查询网站提供的示例数据库（请参阅“自己试试”部分）。\n\n在这个简单的例子中，`SELECT` 语句后面跟着 `'*'`，这意味着你想要获取\
  \ `FROM` 语句中指定的表（本例中为 `sales`）中所有列的数据。\n\n**代码清单 9-17.** `myPHP.php`\n\n```php\n\
  $myquery = \"SELECT * FROM sales\";\n$query = mysql_query($myquery);\n```\n\n执行查询后，你需要检查是否成功，并在发生错误时进行处理（见代码清单\
  \ 9-18）。\n\n**代码清单 9-18.** `myPHP.php`\n\n```php\nif ( ! $query ) {\n    echo mysql_error();\n\
  \    die;\n}\n```\n\n如果查询成功，那么你需要处理查询返回的数据。你将把这些值放入一个名为 `$data` 的数组中，如代码清单 9-19\
  \ 所示。这部分与 D3 中的 `csv()` 和 `tsv()` 函数非常相似，只是它不是逐行读取文件，而是从数据库中检索到的表中逐行读取数据。`mysql_num_rows()`\
  \ 函数返回表中的行数，类似于 `for()` 循环中使用的 JavaScript 的 `length()` 函数。`mysql_fetch_assoc()`\
  \ 函数将查询检索到的数据逐行分配给数据数组。\n\n**代码清单 9-19.** `myPHP.php`\n\n```php\n$data = array();\n\
  for ($x = 0; $x < mysql_num_rows($query); $x++) {\n    $data[] = mysql_fetch_assoc($query);\n\
  }\necho json_encode($data);\n```\n\n脚本的关键在于调用 PHP 的 `json_encode()` 方法，该方法将数据格式转换为\
  \ JSON，然后通过 `echo` 返回数据，D3 将解析这些数据。最后，你必须关闭与服务器的连接，如代码清单 9-20 所示。\n\n**代码清单 9-20.**\
  \ `myPHP.php`\n\n```php\nmysql_close($server);\n```\n\n现在，回到 JavaScript 代码，只更改一行（是的，只有一行！）（见代码清单\
  \ 9-21）。你将 `tsv()` 函数替换为 `json()` 函数，并直接将 PHP 文件作为参数传递。\n\n**代码清单 9-21.** `Ch9_02b.html`\n\
  \n```javascript\nd3.json(\"myPHP.php\", function(error, data) {\n    //d3.tsv(\"\
  data_03.tsv\", function(error, data) {\n    data.forEach(function(d) {\n       \
  \ d.day = parseDate(d.day);\n        d.income = +d.income;\n        d.expense =\
  \ +d.expense;\n    });\n```\n\n最终，你将得到相同的图表（见图 9-3）。\n\n![A978-1-4842-0865-6_9_Fig3_HTML.jpg](img/A978-1-4842-0865-6_9_Fig3_HTML.jpg)\n\
  \n**图 9-3.** 直接从数据库获取数据的多系列图表\n\n### 小结\n\n本章通过考虑两个不同的案例进行了总结。在第一个示例中，你了解了如何创建一个能够表示实时生成或获取的数据的网页。在第二个示例中，你学习了如何使用\
  \ D3 库读取数据库中包含的数据。\n\n在下一章中，我将介绍一个新主题：控件。我将描述在图表中引入控件的重要性，并理解如何使用控件更改图表属性。这为用户提供了实时选择属性参数的机会。\n\
  \n"
- "# 10. 为图表添加控件\n\n有时，在运行时直接从浏览器更改设置，然后使用这些新设置重新绘制图表会非常有用。一种典型的方法是添加活动控件。这些控件使图表具有交互性，允许用户实时做出选择，例如决定图表应如何呈现。通过插入控件，你可以让用户控制图表属性的值。\n\
  \n在本章中，你将学习如何在网页中引入控件。你还将考虑导致选择一种控件而非另一种的因素。一系列包含三种最常用控件的示例将带你更深入地了解这个主题。\n\n\n\n\
  ### 添加控件\n\n对控件进行分组的一种方式是根据其功能。某些控件（例如按钮、菜单）作为开关（命令控件）工作，用户可以通过它们触发特定事件或启动命令。其他控件（例如复选框、单选按钮、组合框、滑块）则绑定到特定的值或属性。通过这类控件，用户可以进行选择或通过文本字段（文本区域）输入值。还有一些控件（例如滚动条）具有导航功能，特别适用于需要移动对象的情况，例如列表中的选中项或框架或网页中包含的大图像。\n\
  \n在这里，您将研究那些与值相关联的控件，这些控件允许用户通过做出选择来与图表进行交互。这些控件应以某种方式图形化地表示特定属性可以取的值（这些值通常是在您的\
  \ JavaScript 代码中分配给某些变量的值，仅限于您希望提供给用户的值）。您对控件的选择将取决于要设置的属性及其可以取的值：\n\n-   为了让用户从一组值中做出单一选择（例如，三种可能的颜色之一），将互斥的单选按钮作为控件是最佳选择（见图\
  \ 10-1a）。\n-   为了让用户选择图表中应显示哪些系列，您需要使用复选框（见图 10-1b）。\n-   为了允许用户在特定属性的值范围内进行选择（例如，通过调整定义颜色的红绿蓝\
  \ (RGB) 值来改变对象的颜色），滑块通常是最佳选择（见图 10-1c）（在这种情况下，您将使用三个滑块作为控件，分别对应红色、绿色和蓝色）。\n\n![A978-1-4842-0865-6_10_Fig1_HTML.jpg](img/A978-1-4842-0865-6_10_Fig1_HTML.jpg)\n\
  \n图 10-1. 三种最常用的控件：(a) 单选按钮，(b) 复选框，(c) 滑块\n\n可能的控件列表并不仅限于此。但是，理解这些控件背后的机制使图表开发人员能够处理绝大多数情况，包括那些最复杂的情况。\n\
  \n在以下示例中，您将了解如何将这三个控件应用于您的图表。\n\n### 使用单选按钮\n\n为了说明控件的使用，我们首先来看一下单选按钮。单选按钮是一组以列表形式分组的小按钮（见图\
  \ 10-1a）。它们通常表示为小的空心圆圈，旁边带有文本。如前所述，这种类型的控件链接到某个值或属性。单选按钮的特殊之处在于它们的值是互斥的；因此，用户只能选择其中一个。\n\
  \n举例来说，我们以一个简单的多系列折线图为例，在该图表中，您希望允许用户决定显示哪个系列，而不是显示所有系列。为了进行选择，用户将单击其中一个单选按钮，用圆点填充圆圈。与该控件对应的系列随后将绘制在图表上。\n\
  \n#### 添加单选按钮控件\n\n首先，您需要编写导入所有必要库的 HTML 页面（见清单 10-1）。\n\n清单 10-1. `ch10_01.html`\n\
  \n```html\n<HTML>\n<HEAD>\n<TITLE>使用控件进行系列选择</TITLE>\n<meta charset=\"utf-8\">\n\
  <script src=\"http://code.jquery.com/jquery-1.9.1.min.js\"></script>\n<script src=\"\
  http://d3js.org/d3.v3.min.js\"></script>\n<script src=\"./multiseries.js\"></script>\n\
  <link rel=\"stylesheet\" href=\"./multiseries.css\"/>\n<script>\n$(document).ready(function(){\n\
  \  //在此处添加您的代码\n});\n</script>\n</HEAD>\n<BODY>\n<div id=\"myChart\"></div>\n<!--\
  \ 在此处添加带有控件的表格 -->\n</BODY>\n</HTML>\n```\n\n或者，如果您更喜欢使用内容分发网络 (CDN) 服务，可以使用以下代码：\n\
