  图 4-6. 带图例的排序堆叠条形图\n\n### 归一化堆叠条形图\n\n在本节中，你将学习如何将前面的图表转换为归一化图表。所谓“归一化”，是指将图表中要显示的值范围转换为另一个目标范围，该范围通常是从\
  \ 0 到 1，或者如果讨论百分比，则是从 0 到 100（在第 2 章的“范围、域和比例尺”部分中已经讨论过非常相似的概念）。因此，如果你想比较覆盖彼此差异很大的值范围的不同序列，就需要进行归一化，将这些区间全部报告为\
  \ 0 到 100（或 0 到 1）之间的百分比值。事实上，当需要比较多个数据序列时，我们通常对其相对特征感兴趣。例如，在我们的示例中，你可能对机械部门如何影响一个国家的经济收入（归一化）感兴趣，并且还想比较这种影响在不同国家之间的差异（归一化值之间的比较）。因此，为了满足这样的需求，你可以用归一化格式来表示你的堆叠图表。\n\
  \n你已经在 y 轴上报告了百分比值；然而，每个生产部门的百分比是根据所有国家收入总额计算的。这次，百分比将根据每个国家的收入来计算。因此，在这种情况下，你并不关心每个单独部分在全球收入（指所有五个国家）中所占的百分比，而只关心每个部门在其各自国家中产生的收入百分比。因此，在这种情况下，每个国家将由一个\
  \ 100% 的条形图表示。现在，没有关于哪个国家比其他国家产生更多收入的信息，你只对每个国家内部的信息感兴趣。\n\n所有这些推理对于你理解以下内容很重要：尽管从相同的数据出发，但你需要根据你想让图表观看者关注的重点来选择不同类型的图表。\n\
  \n对于这个示例，你将使用相同的文件 `data_05.csv`（参考清单 4-14）；正如我们刚才所说，输入的信息是相同的，但对其解释是不同的。为了归一化之前的堆叠条形图，你需要对代码进行一些更改。首先，将左右边距各扩展几个像素，如清单\
  \ 4-24 所示。\n\n**清单 4-24.** `Ch4_03.html`\n\n```\nvar margin = {top: 70, right: 70,\
