  \n**图 4-10.** 在每个条形上方显示数值的分组条形图\n\n\n\n### 包含负值的水平条形图\n\n到目前为止，你只使用了正值，但如果同时有正负值该怎么办？如何在条形图中表示它们？例如，下面这个包含正负值的序列（见代码清单\
  \ 4-41）。\n\n**代码清单 4-41.** `Ch4_05.html`\n\n```\nvar data = [4, 3, 1, -7, -10, -7,\
  \ 1, 5, 7, -3, -5, -12, -7, -11, 3, 7, 8, -1];\n```\n\n在分析要显示的数据之前，先像代码清单 4-42 所示那样，为图表添加边距。\n\
  \n**代码清单 4-42.** `Ch4_05.html`\n\n```\nvar data = [4, 3, 1, -7, -10, -7, 1, 5, 7,\
  \ -3, -5, -12, -7, -11, 3, 7, 8, -1];\n\nvar margin = {top: 30, right: 10, bottom:\
  \ 10, left: 30},\n    w = 700 - margin.left - margin.right,\n    h = 400 - margin.top\
  \ - margin.bottom;\n```\n\n在这个特定案例中，你将使用水平条形图，输入数组中的值将在 x 轴上表示，且 0 值位于中间。为了实现这一点，首先需要找到绝对值（包括负值和正值）中的最大值。然后，你在线性比例尺上创建\
  \ `x` 变量，而 `y` 变量则分配给一个序数比例尺，该比例尺包含数据在输入数组中放置的顺序（见代码清单 4-43）。\n\n**代码清单 4-43.**\
  \ `Ch4_05.html`\n\n```\n...\nvar margin = {top: 30, right: 10, bottom: 10, left:\
  \ 30},\n    w = 700 - margin.left - margin.right,\n    h = 400 - margin.top - margin.bottom;\n\
  \nvar xMax = Math.max(-d3.min(data), d3.max(data));\n\nvar x = d3.scale.linear()\n\
  \    .domain([-xMax, xMax])\n    .range([0, w])\n    .nice();\n\nvar y = d3.scale.ordinal()\n\
  \    .domain(d3.range(data.length))\n    .rangeRoundBands([0, h], .2);\n```\n\n\
  在代码清单 4-44 中，你将这两个比例尺分配给对应的 x 轴和 y 轴。这次，x 轴将绘制在图表的上部，而 y 轴将朝下（y 值向下递增）。\n\n**代码清单\
  \ 4-44.** `Ch4_05.html`\n\n```\nvar y = d3.scale.ordinal()\n    .domain(d3.range(data.length))\n\
  \    .rangeRoundBands([0, h], .2);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n\
  \    .orient(\"top\");\n\nvar yAxis = d3.svg.axis()\n    .scale(y)\n    .orient(\"\
  left\");\n```\n\n至此，剩下的工作就是开始实现绘图区域。创建根 `<svg>` 元素，并分配之前定义好的边距。然后，定义 x 轴和 y 轴（见代码清单\
  \ 4-45）。\n\n**代码清单 4-45.** `Ch4_05.html`\n\n```\nvar yAxis = d3.svg.axis()\n   \
  \ .scale(y)\n    .orient(\"left\");\n\nvar svg = d3.select(\"body\").append(\"svg\"\
  )\n    .attr(\"width\", w + margin.left + margin.right)\n    .attr(\"height\", h\
  \ + margin.top + margin.bottom)\n    .append(\"g\")\n    .attr(\"transform\", \"\
  translate(\" + margin.left + \", \" + margin.top + \")\");\n\nsvg.append(\"g\")\n\
  \    .attr(\"class\", \"x axis\")\n    .call(xAxis);\n\nsvg.append(\"g\")\n    .attr(\"\
  class\", \"y axis\")\n    .attr(\"transform\", \"translate(\"+x(0)+\",0)\")\n  \
  \  .call(yAxis);\n```\n\n最后，你需要为每个要表示的条形插入一个 `<rect>` 元素，并注意将条形分为两个不同的组：负值条形和正值条形（见代码清单\
  \ 4-46）。必须区分这两类，以便通过 CSS 样式类（例如颜色）分别设置它们的属性。\n\n**代码清单 4-46.** `Ch4_05.html`\n\n\
  ```\nsvg.append(\"g\")\n    .attr(\"class\", \"y axis\")\n    .attr(\"transform\"\
  , \"translate(\"+x(0)+\",0)\")\n    .call(yAxis);\n\nsvg.selectAll(\".bar\")\n \
  \   .data(data)\n    .enter().append(\"rect\")\n    .attr(\"class\", function(d)\
  \ {\n        return d < 0 ? \"bar negative\" : \"bar positive\";\n    })\n    .attr(\"\
  x\", function(d) { return x(Math.min(0, d)); })\n    .attr(\"y\", function(d, i)\
  \ { return y(i); })\n    .attr(\"width\", function(d) { return Math.abs(x(d) - x(0));\
  \ })\n    .attr(\"height\", y.rangeBand());\n```\n\n事实上，如果你用 Firebug 分析图 4-11 中的结构，你会看到迭代在同一组内创建了两种不同类型的条形，可通过类名\
  \ `\"bar positive\"` 和 `\"bar negative\"` 的特征来识别。通过这两个不同的名称，你可以应用两种不同的 CSS 样式，以区分负值条形和正值条形。\n\
