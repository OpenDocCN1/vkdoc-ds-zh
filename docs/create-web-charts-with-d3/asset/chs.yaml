  function( callback ){\nwindow.setTimeout(callback, 1000);\n};\n})();\nrequestAnimFrame(setTimeout(updateData,3000));\n\
  render();\n};\n```\n\n现在，当点击“更新”按钮后，一条线会从左侧开始绘制由生成随机变化的函数获取的值。一旦线条到达图表的右端，它将在每次获取时更新，仅显示最后十个值（参见图\
