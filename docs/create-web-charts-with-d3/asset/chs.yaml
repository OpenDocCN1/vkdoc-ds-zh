  \    <li><a href=\"#tabs-4\">第四个标题</a></li>\n  </ul>\n  <div id=\"tabs-1\">\n  \
  \  <p>第一个标签面板</p>\n  </div>\n  <div id=\"tabs-2\">\n    <p>第二个标签面板</p>\n  </div>\n\
  \  <div id=\"tabs-3\">\n    <p>第三个标签面板</p>\n  </div>\n  <div id=\"tabs-4\">\n  \
  \  <p>第四个标签面板</p>\n  </div>\n</div>\n```\n\n在 JavaScript 代码中，你需要指定标签页部件，如清单 11-5\
  \ 所示。\n\n**清单 11-5.** `Ch11_01b.html`\n\n```\n$(function() {\n  $( \"#tabs\" ).tabs();\n\
  });\n```\n\n还必须定义 CSS 样式类，如清单 11-6 所示。\n\n**清单 11-6.** `Ch11_01b.html`\n\n```\n\
