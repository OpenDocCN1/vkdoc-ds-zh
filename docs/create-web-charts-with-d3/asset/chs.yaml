  \n**图 8-6.** 包含四个序列的雷达图\n\n哇，成功了！准备好添加另一个功能了吗？到目前为止，你已经绘制了一条穿过各个辐条并循环回到起点的线；这个趋势现在描述了一个特定的区域。你通常会对雷达图中由不同线条界定的区域更感兴趣，而不是线条本身。如果你想对雷达图进行这个小改动以显示区域，你只需要再添加一条路径，如清单\
