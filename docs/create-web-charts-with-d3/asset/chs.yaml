  \n**图 3-11.** 一个更完整的折线图，包含标题和坐标轴标签\n\n现在你已经学会了如何制作折线图，可以尝试一些更复杂的图表了。通常，你想在图表中显示的数据并不存在于网页中，而是存在于外部文件中。在接下来的部分中，你将把如何从外部文件读取数据与你目前所学的内容结合起来。\n\
  \n### 从 CSV 文件中的数据绘制折线图\n\n在设计图表时，你通常会引用各种格式的数据。这些数据通常来自几个不同的来源。最常见的情况是，服务器（你的网页所指向的）上的应用程序从数据库或通过仪器提取数据，或者你甚至可能拥有收集在这些服务器上的数据文件。这里的示例使用服务器上的一个逗号分隔值（CSV）文件作为数据源。这个\
  \ CSV 文件包含数据，可以直接加载到服务器上，或者更常见的是，由其他应用程序生成。\n\nD3 被设计用来处理这种类型的文件并非巧合。为此，D3 提供了 `d3.csv()`\
  \ 函数。你将通过一个示例来了解更多关于这个主题的内容。\n\n\n\n#### 读取与解析数据\n\n首先，你需要定义“画布”的尺寸，或者更准确地说，定义你希望绘制图表的区域的大小和边距。这次，你需要定义四个边距。这将让你对绘图区域拥有更多控制权（参见清单\
  \ 3-26）。\n\n**清单 3-26.** `Ch3_06a.html`\n\n```\n<!DOCTYPE html>\n<meta charset=\"\
  utf-8\">\n<style>\n</style>\n<body>\n<script src=\"http://d3js.org/d3.v3.js\"></script>\n\
  <script>\nvar margin = {top: 70, right: 20, bottom: 30, left: 50},\n    w = 400\
  \ - margin.left - margin.right,\n    h = 400 - margin.top - margin.bottom;\n```\n\
  \n现在来处理数据；用文本编辑器将清单 3-27 中的数据写入一个文件，并将其保存为 `data_01.csv`。\n\n**清单 3-27.** `data_01.csv`\n\
  \n```\ndate,attendee\n12-Feb-12,80\n27-Feb-12,56\n02-Mar-12,42\n14-Mar-12,63\n30-Mar-12,64\n\
  07-Apr-12,72\n18-Apr-12,65\n02-May-12,80\n19-May-12,76\n28-May-12,66\n03-Jun-12,64\n\
  18-Jun-12,53\n29-Jun-12,59\n```\n\n这些数据包含两组由逗号分隔的值（回想一下，CSV 代表逗号分隔值）。第一列是日期格式，列出了举办特定活动（如会议或集会）的日期。第二列列出了参会人数。请注意，日期没有用任何引号括起来。\n\
  \n与 jqPlot 类似，D3 拥有许多控制时间格式的工具。实际上，为了处理 CSV 文件中包含的日期，你必须指定一个解析器，如清单 3-28 所示。\n\n\
  **清单 3-28.** `Ch3_06a.html`\n\n```\nvar parseDate = d3.time.format(\"%d-%b-%y\"\
  ).parse;\n```\n\n这里你需要指定 CSV 文件中包含的格式：`%d` 表示日期的数字格式，`%b` 表示用前三个字符表示的月份，`%y` 表示用最后两位数字表示的年份。你可以指定\
  \ x 和 y 的值，并通过比例尺和范围来赋值，如清单 3-29 所示。\n\n**清单 3-29.** `ch3_06a.html`\n\n```\nvar\
  \ x = d3.time.scale().range([0, w]);\nvar y = d3.scale.linear().range([h, 0]);\n\
  ```\n\n现在你已经处理好了输入数据的正确解析，可以开始创建图形组件了。\n\n#### 实现坐标轴与网格\n\n你将首先学习如何以图形方式实现两个笛卡尔坐标轴。在这个例子中，如清单\
  \ 3-30 所示，你将通过 `d3.svg.axis()` 函数采用最合适的方式来指定 x 轴和 y 轴。\n\n**清单 3-30.** `ch3_06a.html`\n\
  \n```\nvar xAxis = d3.svg.axis()\n    .scale(x)\n    .orient(\"bottom\")\n    .ticks(5);\n\
  \nvar yAxis = d3.svg.axis()\n    .scale(y)\n    .orient(\"left\")\n    .ticks(5);\n\
  ```\n\n这让你可以专注于数据，而所有与坐标轴相关的问题（刻度、标签等）都由坐标轴组件自动处理。因此，在创建了 `xAxis` 和 `yAxis` 之后，你将\
  \ x 和 y 的比例尺分配给他们，并设置方向。这很简单，对吧？是的；这次你不需要指定所有那些关于坐标轴的繁琐细节——它们的范围、在哪里放置刻度和标签等等。与之前的例子不同，所有这些都通过很少的代码行自动完成。我选择现在介绍这个概念，是因为在之前的例子中，我想强调你设计的每个元素都是一个可以用\
  \ D3 管理的积木，无论这个过程之后是否在 D3 库中被自动化。\n\n现在你可以将 SVG 元素添加到页面中，如清单 3-31 所示。\n\n**清单 3-31.**\
  \ `ch3_06a.html`\n\n```\nvar svg = d3.select(\"body\").append(\"svg\")\n    .attr(\"\
