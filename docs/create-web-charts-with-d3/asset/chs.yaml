- "# 6. 使用 D3 绘制 K 线图\n\n在这一章虽然简短但很重要，你将学习 K 线图。这种图表类型基于一种特定的数据格式（OHLC，即开盘价-最高价-最低价-收盘价）。因此，你需要实现一个解析器来从外部文件读取\
  \ OHLC 数据。此外，你需要解决的另一个重要方面是如何处理日期和时间数据。\n\n尽管听起来很复杂，但在本章中，你将发现 D3 库为你提供了哪些工具，让事情变得简单而直接。\n\
  \n你首先将从构建一个简单的 OHLC 图表开始，以便特别关注 OHLC 数据的读取。然后，你将详细了解 D3 如何处理日期和时间数据，最后你将仅使用标量矢量图形（SVG）元素（如线条）来表示\
  \ OHLC 图表。\n\n在最后一部分，你只需进行少量修改，就能将你的 OHLC 图表转换为更完整的 K 线图。\n\n\n\n### 创建 OHLC 图表\n\
