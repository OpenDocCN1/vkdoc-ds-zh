  \ `Ch9_01.html`\n\n```javascript\nfunction getRandomInt (min, max) {\nreturn Math.floor(Math.random()\
  \ * (max - min +1)) + min;\n};\n```\n\n清单 9-8 展示了 `updateData()` 函数，其中将 `getRandomInt()`\
  \ 函数生成的值添加到数组的最新值上，以模拟趋势的变化。这个新值被存储在数组中，同时移除最旧的值；因此，数组的大小始终保持不变。\n\n**清单 9-8.**\
  \ `Ch9_01.html`\n\n```javascript\nfunction updateData() {\nvar last = data[data.length-1];\n\
  if(data.length >10){\ndata.shift();\n}\nvar newlast = last + getRandomInt(-3,3);\n\
  if(newlast <0)\nnewlast = 0;\ndata.push(newlast);\n};\n```\n\n如果 `getRandomInt()`\
  \ 函数返回的新值大于或小于 y 轴表示的范围，您会看到数据线延伸到图表边缘之外。为了防止这种情况发生，您必须通过改变 `ymin` 和 `ymax` 变量来更改\
  \ y 轴上的区间，并使用这些新值更新 `y` 的范围，如清单 9-9 所示。\n\n**清单 9-9.** `Ch9_01.html`\n\n```javascript\n\
  function updateData() {\n...\nif(newlast <0)\nnewlast = 0;\ndata.push(newlast);\n\
  if(newlast > ymax){\nymin = ymin + (newlast - ymax);\nymax = newlast;\ny = d3.scale.linear().domain([ymin,\
  \ ymax])\n.range([0 + margin_y, h - margin_y]);\n}\nif(newlast < ymin){\nymax =\
  \ ymax - (ymin - newlast);\nymin = newlast;\ny = d3.scale.linear().domain([ymin,\
  \ ymax])\n.range([0 + margin_y, h - margin_y]);\n}\n};\n```\n\n因为获取的新数据必须重新绘制，所以需要删除无效的\
  \ SVG 元素并用新元素替换。让我们同时对刻度标签和数据线进行此操作（参见清单 9-10）。最后，需要以固定的时间间隔重复刷新图表。因此，使用 `requestAnimFrame()`\
  \ 函数，可以重复执行 `UpdateData()` 函数的内容。\n\n**清单 9-10.** `Ch9_01.html`\n\n```javascript\n\
  function updateData() {\n...\nif(newlast < ymin){\nymax = ymax - (ymin - newlast);\n\
