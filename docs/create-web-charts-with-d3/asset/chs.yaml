  \n**图 6-1.** OHLC 图表\n\n\n\n### 日期格式\n\n处理这类使用 OHLC 数据的图表时，你总是需要处理 x 轴上的时间和日期值。因此，借鉴这一观察结果，我们来分析\
  \ D3 库如何处理这类数据。\n\n如果在之前的示例中，日期和月份没有用零填充，或者年份只用了两位数字表示（例如“8/9/12”），会发生什么情况？在`d3.csv()`函数内部，D3\
  \ 将无法读取这种格式的日期，因此蜡烛图也不会显示。实际上，你需要做的非常简单，即猜测出要在解析器中插入的正确格式化字符序列。所谓格式化字符，是指一组前面带有“%”符号的字符，根据特定（区分大小写）的字符，以某种方式表示时间单位。\n\
  \n`var parseDate = d3.time.format(\"%m/%e/%y\").parse;`\n\n即使是文字表达的日期也可以用同样的方式处理。你已经见过这种日期格式：\n\
  \n`08-Aug-12,1.238485,1.2327,1.240245,1.2372,`\n\n它可以用这个解析器处理：\n\n`var parseDate\
  \ = d3.time.format(\"%d-%b-%y\").parse;`\n\n但还有更复杂的情况，例如：\n\n`Monday 16 April 2012,1.238485,1.2327,1.240245,1.2372,`\n\
  \n它可以用这个解析器处理：\n\n`var parseDate = d3.time.format(\"%A %e %B %Y\").parse;`\n\n不同值之间的所有分隔字符（包括空格）都应在解析器中处于相同位置。因此，如果日期是这样定义的...\n\
  \n`'8 Aug-12',1.238485,1.2327,1.240245,1.2372,`\n\n你必须在定义解析器的字符串中同时插入空格和引号，否则日期将无法被识别。\n\
  \n`var parseDate = d3.time.format(\"'%d %b-%y'\").parse;`\n\n你还必须记住，在 csv 文件中唯一不能添加的分隔字符是“,”。如果你必须插入它，则必须使用\
  \ TSV（制表符分隔值）文件。\n\n表 6-1 包含了所有可用的格式化字符。它们的组合应能覆盖任何输入格式。\n\n**表 6-1.** D3 日期和时间格式化字符\n\
  \n| 格式化字符 | 描述 |\n| --- | --- |\n| `%a` | 缩写的星期几名称 |\n| `%A` | 完整的星期几名称 |\n| `%b`\
  \ | 缩写的月份名称 |\n| `%B` | 完整的月份名称 |\n| `%c` | 日期和时间，格式为“`%a %b %e %H:%M:%S %Y`” |\n\
  | `%d` | 月份中的第几天，十进制数，零填充 [01,31] |\n| `%e` | 月份中的第几天，十进制数，空格填充 [ 1,31] |\n| `%H`\
  \ | 小时（24 小时制），十进制数 [00,23] |\n| `%I` | 小时（12 小时制），十进制数 [01,12] |\n| `%j` | 年份中的第几天，十进制数\
  \ [001,366] |\n| `%m` | 月份，十进制数 [01,12] |\n| `%M` | 分钟，十进制数 [00,59] |\n| `%p` |\
  \ 上午或下午 |\n| `%S` | 秒，十进制数 [00,61] |\n| `%U` | 年份中的第几周（周日为一周的第一天），十进制数 [00,53] |\n\
  | `%w` | 星期几，十进制数 [0(星期日),6] |\n| `%W` | 年份中的第几周（周一为一周的第一天），十进制数 [00,53] |\n| `%x`\
  \ | 日期，格式为“`%m/%d/%y`” |\n| `%X` | 时间，格式为“`%H:%M:%S`” |\n| `%y` | 不带世纪的年份，十进制数 [00,99]\
  \ |\n| `%Y` | 带世纪的年份，十进制数 |\n| `%Z` | 时区偏移量，例如“–0700” |\n| `%%` | 字面意义的“`%`”字符 |\n\
  \n### 蜡烛图中的箱线表示\n\n使用 jqPlot 时，你还看到了显示 OHLC 数据的其他方式。例如，这类数据通常由一条垂直线和一个覆盖其特定长度的垂直矩形框表示。垂直线与之前的蜡烛图表示相同，位于\
  \ OHLC 的最高值和最低值之间。而矩形框则表示开盘价和收盘价之间的范围。此外，如果开盘价大于收盘价，矩形框将是一种颜色，反之则是另一种颜色。\n\n你使用`data_08.csv`文件中包含的相同数据，并从上一个示例的代码开始，查看需要进行的更改。\n\
  \n将`ext`、`open`和`close`这三行替换为以下三行：`ext`、`ext1`和`ext2`（参见清单 6-10）。然后你需要添加代表矩形框的矩形。线条应为黑色，而当开盘价大于收盘价时，矩形框应为红色；反之，矩形框将为绿色。\n\
  \n**清单 6-10.** `Ch6_02.html`\n\n```\nsvg.selectAll(\"line.ext\")\n.data(data)\n\
  .enter().append(\"svg:line\")\n.attr(\"class\", \"ext\")\n.attr(\"x1\", function(d)\
  \ { return x(d.date)})\n.attr(\"x2\", function(d) { return x(d.date)})\n.attr(\"\
  y1\", function(d) { return y(d.min);})\n.attr(\"y2\", function(d) { return y(d.max);});\n\
  \nsvg.selectAll(\"line.ext1\")\n.data(data)\n.enter().append(\"svg:line\")\n.attr(\"\
  class\", \"ext\")\n.attr(\"x1\", function(d) { return x(d.date)+3})\n.attr(\"x2\"\
  , function(d) { return x(d.date)-3})\n.attr(\"y1\", function(d) { return y(d.min);})\n\
  .attr(\"y2\", function(d) { return y(d.min); });\n\nsvg.selectAll(\"line.ext2\"\
  )\n.data(data)\n.enter().append(\"svg:line\")\n.attr(\"class\", \"ext\")\n.attr(\"\
  x1\", function(d) { return x(d.date)+3})\n.attr(\"x2\", function(d) { return x(d.date)-3})\n\
  .attr(\"y1\", function(d) { return y(d.max);})\n.attr(\"y2\", function(d) { return\
  \ y(d.max); });\n\nsvg.selectAll(\"rect\")\n.data(data)\n.enter().append(\"svg:rect\"\
  )\n.attr(\"x\", function(d) { return x(d.date)-3; })\n.attr(\"y\", function(d) {\
  \ return y(Math.max(d.open, d.close));})\n.attr(\"height\", function(d) {\nreturn\
  \ y(Math.min(d.open, d.close))-y(Math.max(d.open, d.close));})\n.attr(\"width\"\
  , 6)\n.attr(\"fill\", function(d) {\nreturn d.open > d.close ? \"darkred\" : \"\
  darkgreen\" ;});\n});\n```\n\n最后要做的是设置清单 6-11 中的 CSS 样式类。\n\n**清单 6-11.** `Ch6_02.html`\n\
  \n```\n<style>\nbody {\nfont: 16px sans-serif;\n}\n.axis path,\n.axis line {\nfill:\
  \ none;\nstroke: #000;\nshape-rendering: crispEdges;\n}\nline.ext, line.ext1, line.ext2\
  \ {\nstroke: #000;\nstroke-width: 1;\nshape-rendering: crispEdges;\n}\n</style>\n\
  ```\n\n图 6-2 显示了最终结果。\n\n![A978-1-4842-0865-6_6_Fig2_HTML.jpg](img/A978-1-4842-0865-6_6_Fig2_HTML.jpg)\n\
  \n**图 6-2.** 蜡烛图\n\n### 总结\n\n在本章中，你看到了本书第一部分专门介绍 jqPlot 库时已经讨论过的蜡烛图类型，但这次你使用了 D3。你已经看到，在保持对每个图形元素的完全控制的同时，如何轻松获得类似的结果。此外，由于这种图表使用时间数据，这里你更深入地探讨了\
  \ D3 库如何管理这类数据以及管理格式的各种方法。\n\n继续遵循 jqPlot 库和 D3 库在实现各种图表类型方面的并行性，在下一章中，你将学习散点图和气泡图，以及如何使用\
  \ D3 库实现它们。\n\n\n\n"
- "# 7. 使用 D3 绘制散点图和气泡图\n\n在本章中，你将学习散点图。当你有一组数据对 `[x, y]` 并希望分析它们在 xy 平面上的分布时，就会用到这种图表。因此，你将首先了解如何使用\
  \ D3 库制作这种图表。在第一个示例中，你将开始读取一个包含多个数据系列的 TSV（制表符分隔值）文件，并通过这些数据了解如何实现散点图。\n\n完成散点图后，你将看到如何使用特定形状的标记来表示数据点，这些标记可以从预定义集合中选择，也可以自行创建。\n\
  \n这类图表非常重要。它是分析数据分布的基本工具；事实上，通过这些图表，你可以发现特定的趋势（趋势线）和分组（聚类）。在本章中，两个简单的示例将向你展示如何表示趋势线和聚类。\n\
  \n此外，你还将了解如何通过事件处理为图表添加高亮功能，以及 D3 库如何管理它。\n\n最后，本章将以一个最终示例结束，在该示例中，你需要用三个参数 `[x,\
  \ y, z]` 来表示数据。因此，通过适当修改散点图，你将发现如何得到气泡图，这是一种经过修改以能够表示额外参数的散点图。\n\n### 散点图\n\n借助\
  \ D3 库，你可以生成的图形表示形式没有限制，可以将图形元素像积木一样组合起来。散点图的创建也不例外。\n\n你从一组数据（见清单 7-1）开始，这次是表格形式（因此是一个\
  \ TSV 文件），你将复制并保存为名为 `data_09.tsv` 的文件。（请参阅下面的注释。）\n\n**注释**\n\n请注意，TSV 文件中的值是用\
  \ TAB 键分隔的，因此当你编写或复制清单 7-1 时，请记得检查每个值之间是否只有一个 TAB 字符。\n\n**清单 7-1.** `data_09.tsv`\n\
  \n```\ntime  intensity group\n10    171.11    Exp1\n14    180.31    Exp1\n17   \
  \ 178.32    Exp1\n42    173.22    Exp3\n30    145.22    Exp2\n30    155.68    Exp3\n\
  23    200.56    Exp2\n15    192.33    Exp1\n24    173.22    Exp2\n20    203.78 \
  \   Exp2\n18    187.88    Exp1\n45    180.00    Exp3\n27    181.33    Exp2\n16 \
  \   198.03    Exp1\n47    179.11    Exp3\n27    175.33    Exp2\n28    162.55   \
  \ Exp2\n24    208.97    Exp1\n23    200.47    Exp1\n43    165.08    Exp3\n27   \
  \ 168.77    Exp2\n23    193.55    Exp2\n19    188.04    Exp1\n40    170.36    Exp3\n\
  21    184.98    Exp2\n15    197.33    Exp1\n50    188.45    Exp3\n23    207.33 \
  \   Exp1\n28    158.60    Exp2\n29    151.31    Exp2\n26    172.01    Exp2\n23 \
  \   191.33    Exp1\n25    226.11    Exp1\n60    198.33    Exp3\n```\n\n假设文件中的数据属于三个不同的实验（标记为\
  \ `Exp1`、`Exp2` 和 `Exp3`），每个实验应用于不同的对象（例如，三种发光物质），你需要测量它们的发射强度随时间的变化情况。读数在不同时间重复进行。你的目标是在\
  \ xy 平面上表示这些值，以便分析它们的分布和潜在特性。\n\n观察数据，你可以看到它们由三列组成：`time`、`intensity` 和 `group`\
  \ 成员关系。这是一种典型的数据结构，可以以散点图的形式显示。你将把时间刻度放在 x 轴上，把强度值放在 y 轴上，最后通过标记的形状或颜色来标识组别，这些标记将标示点在散点图中的位置。\n\
  \n按照惯例，你从编写清单 7-2 中的代码开始。这段代码代表你的起始代码，由于它几乎与你在前面示例中看到的所有图表相同，因此无需进一步解释。\n\n**清单\
  \ 7-2.** `Ch7_01.html`\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
  utf-8\">\n<script src=\"http://d3js.org/d3.v3.js\"></script>\n<style>\nbody {\n\
  \  font: 16px sans-serif;\n}\n.axis path,\n.axis line {\n  fill: none;\n  stroke:\
  \ #000;\n  shape-rendering: crispEdges;\n}\n</style>\n</head>\n<body>\n<script type=\"\
  text/javascript\">\nvar margin = {top: 70, right: 20, bottom: 40, left: 40},\n \
  \   w = 500 - margin.left - margin.right,\n    h = 400 - margin.top - margin.bottom;\n\
  \nvar color = d3.scale.category10();\n\nvar x = d3.scale.linear()\n    .range([0,\
  \ w]);\n\nvar y = d3.scale.linear()\n    .range([h, 0]);\n\nvar xAxis = d3.svg.axis()\n\
  \    .scale(x)\n    .orient(\"bottom\");\n\nvar yAxis = d3.svg.axis()\n    .scale(y)\n\
  \    .orient(\"left\");\n\nvar svg = d3.select(\"body\").append(\"svg\")\n    .attr(\"\
  width\", w + margin.left + margin.right)\n    .attr(\"height\", h + margin.top +\
  \ margin.bottom)\n  .append(\"g\")\n    .attr(\"transform\", \"translate(\" + margin.left+\
  \ \",\" +margin.top+ \")\");\n\nvar title = d3.select(\"svg\").append(\"g\")\n \
  \   .attr(\"transform\", \"translate(\" + margin.left+ \",\" +margin.top+ \")\"\
  )\n    .attr(\"class\",\"title\");\n\ntitle.append(\"text\")\n    .attr(\"x\", (w\
  \ / 2))\n    .attr(\"y\", -30 )\n    .attr(\"text-anchor\", \"middle\")\n    .style(\"\
  font-size\", \"22px\")\n    .text(\"My Scatterplot\");\n</script>\n</body>\n</html>\n\
  ```\n\n\n\n在`Listing 7-3`中，你使用`d3.tsv()`函数从 TSV 文件读取表格数据，并确保数值类型能被正确识别。这里，即使第一列包含时间数据，也无需进行解析，因为它们以秒为单位，因此可以视为线性比例尺。\n\
  \n`Listing 7-3. Ch7_01.html`\n\n```\n...\nvar svg = d3.select(\"body\").append(\"\
  svg\")\n    .attr(\"width\", w + margin.left + margin.right)\n    .attr(\"height\"\
  , h + margin.top + margin.bottom)\n  .append(\"g\")\n    .attr(\"transform\", \"\
  translate(\" + margin.left+ \",\" +margin.top+ \")\");\n\nd3.tsv(\"data_09.tsv\"\
  , function(error, data) {\n  data.forEach(function(d) {\n    d.time = +d.time;\n\
  \    d.intensity = +d.intensity;\n  });\n});\n\nvar title = d3.select(\"svg\").append(\"\
  g\")\n    .attr(\"transform\", \"translate(\" + margin.left+ \",\" +margin.top+\
  \ \")\")\n    .attr(\"class\",\"title\");\n...\n```\n\n关于定义域（domain）的赋值也非常简单，如`Listing\
  \ 7-4`所示。此外，你还会使用`nice()`函数，该函数会对定义域的值进行取整。\n\n`Listing 7-4. Ch7_01.html`\n\n```\n\
  d3.tsv(\"data_09.tsv\", function(error, data) {\n  data.forEach(function(d) {\n\
  \    d.time = +d.time;\n    d.intensity = +d.intensity;\n  });\n\n  x.domain(d3.extent(data,\
  \ function(d) { return d.time; })).nice();\n  y.domain(d3.extent(data, function(d)\
  \ { return d.intensity; })).nice();\n});\n```\n\n你还需要添加坐标轴标签，在 x 轴上显示“Time [s]”，在\
  \ y 轴上显示“Intensity”，如`Listing 7-5`所示。\n\n`Listing 7-5. Ch7_01.html`\n\n```\nd3.tsv(\"\
  data_09.tsv\", function(error, data) {\n  ...\n  x.domain(d3.extent(data, function(d)\
  \ { return d.time; })).nice();\n  y.domain(d3.extent(data, function(d) { return\
  \ d.intensity; })).nice();\n\n  svg.append(\"g\")\n      .attr(\"class\", \"x axis\"\
  )\n      .attr(\"transform\", \"translate(0,\" + h + \")\")\n      .call(xAxis);\n\
  \n  svg.append(\"text\")\n      .attr(\"class\", \"label\")\n      .attr(\"x\",\
  \ w)\n      .attr(\"y\", h + margin.bottom - 5)\n      .style(\"text-anchor\", \"\
  end\")\n      .text(\"Time [s]\");\n\n  svg.append(\"g\")\n      .attr(\"class\"\
  , \"y axis\")\n      .call(yAxis);\n\n  svg.append(\"text\")\n      .attr(\"class\"\
  , \"label\")\n      .attr(\"transform\", \"rotate(–90)\")\n      .attr(\"y\", 6)\n\
  \      .attr(\"dy\", \".71em\")\n      .style(\"text-anchor\", \"end\")\n      .text(\"\
  Intensity\");\n});\n```\n\n最后，你需要在图表上直接绘制标记。这些标记可以用 SVG 元素`<circle>`来表示。因此，图表上表示的数据点将是半径为\
  \ 3.5 像素的小圆点（见`Listing 7-6`）。为了区分不同组别的表示，标记会以不同颜色绘制。\n\n`Listing 7-6. Ch7_01.html`\n\
  \n```\nd3.tsv(\"data_09.tsv\", function(error, data) {\n  ...\n  svg.append(\"text\"\
  )\n      .attr(\"class\", \"label\")\n      .attr(\"transform\", \"rotate(-90)\"\
  )\n      .attr(\"y\", 6)\n      .attr(\"dy\", \".71em\")\n      .style(\"text-anchor\"\
  , \"end\")\n      .text(\"Intensity\");\n\n  svg.selectAll(\".dot\")\n      .data(data)\n\
  \    .enter().append(\"circle\")\n      .attr(\"class\", \"dot\")\n      .attr(\"\
  r\", 3.5)\n      .attr(\"cx\", function(d) { return x(d.time); })\n      .attr(\"\
