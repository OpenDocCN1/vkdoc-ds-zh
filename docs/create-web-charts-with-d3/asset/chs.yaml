- '# 图表技术概述


  当我们需要以图形方式表示数据或定性结构，以展示某种关系——进行比较或突出趋势时，我们会使用图表。图表是一种图形结构，由符号组成，例如折线图中的线条、柱状图中的柱形或饼图中的扇区。图表是有效的工具，可以帮助我们辨别和理解大量数据背后的关系。对人类而言，阅读图表等图形表示比阅读原始数字数据更容易。如今，在众多专业领域以及日常生活的许多其他方面，使用图表已成为普遍做法。因此，根据数据的结构和需要突出的现象，图表呈现出多种形式。例如，如果你的数据被分成不同的组，并且想要表示每组占总数的百分比，你通常会将这些数据组显示在饼图或柱状图中。相反，如果你想展示某个变量随时间变化的趋势，折线图通常是最佳选择。


  在本书中，你将学习如何使用基于 JavaScript 的各种技术，根据你的需求创建、绘制和调整图表。然而，在开始使用 JavaScript 开发图表之前，理解本书各章节将涵盖的基本概念非常重要。在本章中，我将简要概述这些概念。


  首先，我将向你展示如何识别构成图表的最常见元素。了解这些元素将很有帮助，因为你将在专为实现图表而创建的 JavaScript 库中，以组件、变量和对象的形式找到它们。


  接下来，我将列出最常见的图表类型。你对图表及其特性了解得越多，就越容易为你的数据选择正确的表示方式。做出正确的选择至关重要，这样才能突出你想要表示的关系，而仅仅阅读数据是不够的。只有当你熟悉了最常见的图表类型后，你才能选择出最适合你目的的图表。


  一旦你熟悉了这些概念，就需要学习如何通过网络实现它们，以及当前有哪些技术可以帮助你实现这一目标。因此，在本章的第二部分，我将讨论这些技术方面的问题，逐一介绍本书示例开发中所涉及的技术。


  最后，鉴于我们所有的工作都将集中在 JavaScript 代码的开发上，我认为提供对某些数据类型的简要描述会有所帮助。不熟悉 JavaScript 的读者可以从这个关于数据在代码中呈现形式的快速参考中受益。不过，我强烈建议读者更深入地研究本章讨论的概念和技术。


  ### 图表中的元素


  你很快就会看到，图表可以呈现多种形式。在图表中，数据通过特定于图表类型的符号来呈现图形结构；然而，所有图表都有一些共同特征。


  通常，每个图表都有一个标题，位于顶部，提供对数据的简短描述。较少情况下，会使用副标题或脚注来提供额外的描述（主要是与数据相关的信息，如参考文献、地点、日期和注释）。


  图表通常有坐标轴——两条垂直的线，允许用户参考每个数据点 `P(x, y)` 的坐标值（`x`，`y`），如图 1-1 所示。水平线通常代表 `x` 轴，垂直线代表
  `y` 轴。


  ![A978-1-4842-0865-6_1_Fig1_HTML.jpg](img/A978-1-4842-0865-6_1_Fig1_HTML.jpg)


  图 1-1. 一个二维图表


  每个轴上定义了一个刻度。刻度可以是数值型的，也可以是分类型的。每个轴被划分为与刻度所代表的特定数值范围相对应的段。段与段之间的边界称为刻度线。每个刻度线报告与该轴关联的刻度值。通常，这些被称为刻度标签。


  图 1-2 显示了四个具有不同刻度的坐标轴。轴 `a` 和 `b` 具有数值刻度，其中 `a` 是线性刻度，`b` 是对数刻度。轴 `c` 和 `d` 具有分类刻度，其中
  `c` 是有序的，因此遵循升序，而 `d` 只是没有特定顺序的类别序列。


  ![A978-1-4842-0865-6_1_Fig2_HTML.jpg](img/A978-1-4842-0865-6_1_Fig2_HTML.jpg)


  图 1-2. 四个具有不同刻度的坐标轴


  在每个坐标轴旁边，最好显示一个标签，简要描述所表示的维度；这些被称为轴标签。如果刻度是数值型的，标签应在括号中显示度量单位。例如，如果你有一个报告一组数据时间的
  `x` 轴，你可以将“时间”写为轴标签，并将秒单位（此处为秒）放在方括号中，如 `[s]`（见图 1-3）。


  ![A978-1-4842-0865-6_1_Fig3_HTML.jpg](img/A978-1-4842-0865-6_1_Fig3_HTML.jpg)


  图 1-3. 一个轴标签


  在显示图表的绘图区域中，可能包含网格线，以帮助数据的视觉对齐。图 1-4 显示了一个图表的网格，其 `x` 轴为线性时间刻度，`y` 轴为对数刻度。


  ![A978-1-4842-0865-6_1_Fig4_HTML.jpg](img/A978-1-4842-0865-6_1_Fig4_HTML.jpg)


  图 1-4. 一个具有两种不同刻度的图表


  你已经了解了数据如何以符号方式表示。然而，文本标签也可以用来突出显示特定的数据点。点标签在图表中直接在相应点处提供值，而工具提示是当鼠标悬停在某个点上时动态出现的小框架。这两种标签如图
  1-5 所示。


  ![A978-1-4842-0865-6_1_Fig5_HTML.jpg](img/A978-1-4842-0865-6_1_Fig5_HTML.jpg)


  图 1-5. 数据点的点标签和工具提示


  数据通常被分组到多个系列中，为了在同一个图表中表示它们，必须能够区分它们。最常见的方法是为每个系列分配不同的颜色。在其他情况下，例如在折线图中，线条的描边（虚线、点线等）也可以用来区分不同的系列。一旦你确定了颜色（或描边）的顺序，就需要添加一个表格来显示颜色与组之间的对应关系。这个表格称为图例，如图
  1-6 所示。


  ![A978-1-4842-0865-6_1_Fig6_HTML.jpg](img/A978-1-4842-0865-6_1_Fig6_HTML.jpg)


  图 1-6. 一个图例


  尽管讨论本节涵盖的概念可能看似琐碎，但定义我将在全书中引用的元素的术语非常重要。它们构成了你将用于构建图表的构建块。你还将看到，专门用于图表表示的 JavaScript
  库如何使用这些术语，并将它们与编辑和设置组件相关联（请参阅第 8 章中的“插入选项”一节）。




  ### 最常见的图表类型


  本节简要概述了最常见的图表类型。本书后续章节将对每种图表进行更详细的介绍。


  ![A978-1-4842-0865-6_1_Fig10_HTML.jpg](img/A978-1-4842-0865-6_1_Fig10_HTML.jpg)


  图 1-10. 蜡烛图


  - **蜡烛图**：一种专门用于描述价格随时间变化趋势的图表。每个数据点由四个数值组成，通常称为开盘价-最高价-最低价-收盘价（OHLC），其形状类似蜡烛（见图
  1-10）。


  ![A978-1-4842-0865-6_1_Fig9_HTML.jpg](img/A978-1-4842-0865-6_1_Fig9_HTML.jpg)


  图 1-9. 气泡图和雷达图


  - **气泡图**：一种二维散点图，其中第三个变量通过数据点的大小来表示（见图 1-9）。

  - **雷达图**：一种图表，其中一系列数据分布在多个轴上，这些轴从图表中心的原点径向延伸。这种图表通常呈现蜘蛛网的形状（见图 1-9）。


  ![A978-1-4842-0865-6_1_Fig8_HTML.jpg](img/A978-1-4842-0865-6_1_Fig8_HTML.jpg)


  图 1-8. 折线图和饼图


  - **折线图**：由一条线连接的一系列有序数据点。图表中报告了数据点 `P(x, y)`，表示 `x` 和 `y` 两个轴的刻度（见图 1-8）。

  - **饼图**：一个被分割成若干扇区（切片）的圆形（饼）。每个切片代表一组数据，其大小与百分比值成比例（见图 1-8）。


  ![A978-1-4842-0865-6_1_Fig7_HTML.jpg](img/A978-1-4842-0865-6_1_Fig7_HTML.jpg)


  图 1-7. 直方图和柱状图


  - **直方图**：建立在 `x` 轴上的相邻矩形，被分割成离散的区间（组距），其面积与该组距的观测频率成比例（见图 1-7）。

  - **柱状图**：形状与直方图相似，但本质不同，这是一种由矩形条组成的图表，其长度与所代表的值成比例。每个条形代表一组数据（见图 1-7）。


  > **注意**：开盘价-最高价-最低价-收盘价（OHLC）是四个数值，通常用于说明金融工具价格随时间的变化。


  ### 如何在 Web 上实现图表


  现在我已经描述了最常见的图表类型及其组成元素，下一步是快速了解一下当前可用于实现图表的技术。


  如今，Web 技术日新月异：每天都有新的解决方案被提出，解决那些不久前还相当复杂的问题。这些创新使您能够仅通过编写几行 JavaScript 代码，就能实现具有引人注目的图形的高度交互式图表。整个过程可以快速轻松地完成，因为大部分工作都由高度专业化的图表表示
  JavaScript 库为您完成。这些库现在在网络中随处可见。


  在本书中，您将使用 `D3` 库，这是目前使用最广泛的库，它能为图表实现过程中可能出现的几乎所有问题提供通用解决方案。


  但是，在深入学习这个库之前（这将在后续章节中进行），您必须先了解构成 JavaScript 图表开发基础的所有技术，因为这些技术将伴随您阅读本书的其余部分。


  ### HTML5


  最近，关于 HTML5 的讨论很多，它实际上正在彻底改变 Web 应用程序的开发方式。在它出现之前，如果您想引入交互式图形内容，使用 Adobe Flash 之类的应用程序几乎是必经之路。但是，使用
  Flash 或类似应用程序在 Web 上开发图表或其他图形表示存在一个明显的限制：依赖最终用户机器上安装的插件。此外，这类应用程序在智能手机上不受支持。得益于
  HTML5，开发人员现在无需依赖 Flash 即可创建高级图形和动画。


  在阅读本书的过程中，您将看到 HTML5 如何催生了许多其他技术，有些是新的，有些是旧的但焕发了新生，例如 JavaScript。事实上，作为一种语言，JavaScript
  正在经历重生，这得益于正是为了利用 HTML5 引入的创新而开发的新库。HTML5 有许多新的语法特性，包括 `<canvas>` 元素和标量矢量图形（SVG）内容的集成。借助这些元素，无需使用
  Flash 即可非常轻松地在 Web 上集成多媒体和图形内容。


  在 Flash 的位置上，您将使用 `D3` 库。目前，这是可用于实现数据图形可视化等任务的最广泛、最完整的库。然而，Web 技术世界在不断演进；在互联网上，您总能找到具有与
  `D3` 库类似特性的新库。


  ### 使用 SVG 和 CANVAS 绘制图表


  在 HTML5 引入的新技术可以实现的众多图形应用中，我将重点介绍通过图表进行数据表示和可视化。使用 JavaScript 作为编程语言，我们现在可以利用嵌入在新浏览器中的强大渲染引擎。作为该语言新能力的基础，我将提及
  HTML5 canvas 和 SVG。与在服务器上绘制静态图像然后下载到浏览器中不同，SVG 和 canvas 允许您开发完全交互式的图表，从而通过内置的动画、过渡和工具提示来丰富您的图形表示。这是因为
  SVG 和 canvas 内容是在浏览器中绘制的，因此构成图表的图形元素可以在不刷新页面的情况下进行转换。此功能对于可视化实时数据至关重要，这些数据要求图表随着数据变化而持续更新。以这种方式操作将确保真正的客户端图表绘制。事实上，通过利用这些技术，图表实际上是在客户端绘制的，只需要从服务器传递数据即可。这一方面带来了相当多的优势，其中最重要的是无需从服务器下载大型图形文件。




  #### Canvas 与 SVG 对比


  HTML5 的 Canvas 和 SVG 都是允许你在浏览器中创建丰富图形的 Web 技术，但它们有着本质上的不同。在本文中，你将主要看到 D3 如何利用 SVG
  技术。其他与 D3 类似的库（例如 `jqPlot` 和 `Highcharts`）则利用 HTML5 的 `<canvas>` 元素来绘制图表。相比之下，D3
  并不使用 Canvas；它依赖 SVG 技术进行图形表示。


  SVG 是一种基于 XML 的矢量图形格式。SVG 内容可以是静态的、动态的、交互式的或动画的，这使得它非常灵活。你还可以使用层叠样式表（CSS）来设置 SVG
  元素的样式，并通过 SVG 文档对象模型（DOM）提供的应用程序编程接口（API）方法为其添加动态行为。因此，选择这种格式，你所能获得的远不止简单的矢量图形和动画：你可以开发高度交互的
  Web 应用程序，包括脚本、高级动画、事件、滤镜，以及几乎任何你能想象到的功能。


  HTML5 Canvas 规范是一个多功能的 JavaScript API，允许你编写程序化的绘图操作。Canvas 本身允许你定义一个画布上下文对象，在 HTML
  页面中显示为 `<canvas>` 元素。然后，你可以使用 Web 图形库（WebGL）通过二维或三维绘图上下文在该元素内部进行绘制。


  与 SVG 相比，Canvas 的优势在于其高性能的绘图能力以及更快的图形和图像编辑速度。当需要在像素级别工作时，Canvas 是更优的选择。然而，使用 Canvas
  时，没有可供操作的 DOM 节点可能是一个劣势，尤其是在你没有使用 JavaScript 框架的情况下。另一个缺点是文本渲染能力较弱。


  与 Canvas 相比，SVG 的优势在于其分辨率无关性、良好的动画支持，以及能够使用声明式语法对元素进行动画处理。但最重要的是，你可以通过 JavaScript
  中的 SVG DOM API 完全控制每个元素。然而，当复杂度增加时，渲染速度慢可能成为一个问题，但浏览器供应商正在努力使浏览器变得更快（参见表 1-1 和 1-2）。


