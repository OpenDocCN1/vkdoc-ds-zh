  \n**图 4-1.** 一个简单的条形图\n\n### 绘制堆叠条形图\n\n你已经通过最简单的案例介绍了条形图，其中每个国家/地区都有多个组以及一个对应的值（收入）。很多时候，你需要表示稍微复杂一些的数据，例如，你想按部门划分总收入的数据。在这种情况下，每个国家的收入将被分成多个部分，每个部分代表一个生产部门的收入。在我们的示例中，我们将使用一个\
  \ CSV 文件，其方式与上一个示例（参见清单 4-1）非常相似，但每个国家/地区有多个值，以便你可以处理多系列条形图。因此，使用文本编辑器编写清单 4-14\
  \ 中的数据，并将其保存为 `data_05.csv`。\n\n**清单 4-14.** `data_05.csv`\n\n```\nCountry,Electronics,Software,Mechanics\n\
