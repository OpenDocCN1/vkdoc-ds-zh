  ]\n},{\n\"name\": \"parent C\",\n\"children\": [\n{\"name\": \"child C1\", \"size\"\
  : 23},\n{\"name\": \"child C2\", \"size\": 51},\n{\"name\": \"child C3\", \"size\"\
  : 33},\n{\"name\": \"child C4\", \"size\": 4}\n]\n}]\n}\n```\n\n而清单 12-8 展示了用于显示树形扇形区域的\
  \ HTML 页面代码。作为参考，我选择了 M. Bostock 的示例#4063423（[`bl.ocks.org/mbostock/4063423`](http://bl.ocks.org/mbostock/4063423)）中的“旭日图”表示。\n\
  \n**清单 12-8.** `ch12_03.html`\n\n```\n<HTML>\n<HEAD>\n<meta charset=\"utf-8\">\n\
  <script src=\"http://d3js.org/d3.v3.js\"></script>\n</HEAD>\n<body>\n<script>\n\
  var radius = 250;\nvar angle = 360;\nvar color = d3.scale.category10();\nvar svg\
  \ = d3.select(\"body\").append(\"svg\")\n.attr(\"width\", 2*radius)\n.attr(\"height\"\
  , 2* radius)\n.append(\"g\")\n.attr(\"transform\", \"translate(\"+radius + \", \"\
  \ + radius + \")\");\nvar partition = d3.layout.partition()\n.size([2 * Math.PI,\
  \ radius]);\nvar arc = d3.svg.arc()\n.startAngle(function(d) { return d.x; })\n\
  .endAngle(function(d) { return d.x + d.dx; })\n.innerRadius(function(d) { return\
  \ d.y; })\n.outerRadius(function(d) { return d.y + d.dy; });\nd3.json(\"tree3.json\"\
  , function(error, root) {\nvar size = function(d) { return d.size; };\nvar nodes\
  \ = partition.value(size).nodes(root);\nvar path = svg.datum(root).selectAll(\"\
  path\")\n.data(nodes)\n.enter().append(\"path\")\n.attr(\"display\", function(d)\
  \ { return d.depth ? null : \"none\"; })\n.attr(\"d\", arc)\n.style(\"stroke\",\
  \ \"#fff\")\n.style(\"fill\", function(d) { return color((d.children ? d : d.parent).name);\
  \ })\n.style(\"fill-rule\", \"evenodd\");\n});\n</script>\n</body>\n</HTML>\n```\n\
  \n图 12-8 展示了代码的运行结果。\n\n![A978-1-4842-0865-6_12_Fig8_HTML.jpg](img/A978-1-4842-0865-6_12_Fig8_HTML.jpg)\n\
  \n图 12-8. 树的另一种圆形表示\n\n现在让我们详细分析`d3.layout.partition`的工作原理。分区布局的声明与树布局非常相似（参见清单\
  \ 12-9）。通过传递给`size()`函数的两个参数，你可以将第一个参数设置为圆形范围（本例中为整圆角度），第二个参数设置为半径。\n\n**清单 12-9.**\
  \ `ch12_03.html`\n\n```\nvar partition = d3.layout.partition()\n.size([2 * Math.PI,\
  \ radius]);\n```\n\n在`json()`函数内部，你可以通过`root`变量将 JSON 文件中包含的结构化数据分配给分区布局。叶子节点的大小值通过递归传递给`value()`函数（参见清单\
  \ 12-10）。\n\n**清单 12-10.** `ch12_03.html`\n\n```\nd3.json(\"tree3.json\", function(error,\
  \ root) {\nvar size = function(d) { return d.size; };\nvar nodes = partition.value(size).nodes(root);\n\
  ```\n\n如果你详细分析分区布局的内部结构，可以看到它在图 12-9 中的结构方式。\n\n![A978-1-4842-0865-6_12_Fig9_HTML.jpg](img/A978-1-4842-0865-6_12_Fig9_HTML.jpg)\n\
  \n图 12-9. 分区布局的详细结构\n\n最后，函数`d3.svg.arc()`会将`x`、`y`、`dx`和`dy`值转换为构成整个图表的扇形区域（参见清单\
  \ 12-11）。\n\n**清单 12-11.** `ch12_03.html`\n\n```\nvar arc = d3.svg.arc()\n.startAngle(function(d)\
  \ { return d.x; })\n.endAngle(function(d) { return d.x + d.dx; })\n.innerRadius(function(d)\
  \ { return d.y; })\n.outerRadius(function(d) { return d.y + d.dy; });\n```\n\n####\
  \ JSON 与布局的无限可能\n\n在前两个示例中，你亲眼看到了 D3 库（结合 JSON 技术进行数据输入）所能提供的无限可能性的冰山一角。\n\n对于任何有兴趣进一步扩展该主题的人，我强烈建议访问[`https://github.com/mbostock/d3/wiki/Gallery`](https://github.com/mbostock/d3/wiki/Gallery)。该页面内包含大量使用\
  \ D3 库开发的示例。\n\n### 总结\n\n在本章中，你了解了 D3 库如何读取 JSON 格式的结构化数据。此外，你还了解了布局及其在处理具有复杂结构（如树）的数据时所起的作用。\n\
  \n### 结语\n\n通过本章，你已读完了本书。全书呈现并讨论了许多图表示例。至此，你应该熟悉了所有最常见的图表类型。此外，你应该已经养成了使用 D3 库实现\
  \ JavaScript 代码的良好实践，以创建一系列 SVG 图形，从而构建你需要的各种图表。\n\n此外，示例的顺序经过精心选择，以便你能够逐步学习 D3\
  \ 库所依据的所有概念（选择器、布局、域、比例尺、链式方法等）。\n\n我必须说，尽管涵盖了大量的主题，但还有许多其他主题我本想添加。我希望这本书能让你更好地欣赏数据可视化世界，尤其是图表。我也希望这本书能为你提供良好的数据可视化基础知识，并证明它在你处理图表的所有场合中都能成为宝贵的帮手。\n\
  \n\n\n"
- '# 书中示例的使用指南


  本附录将指导你如何结合使用 XAMPP 和 Aptana Studio，在个人电脑上搭建一个开发环境，以便你能够开发、运行并修复书中提供的示例。


  ### 安装 Web 服务器


  如今，在网络上，你可以轻松找到包含所需一切组件的免费软件包，用于为所有示例以及所有与网络世界相关的内容搭建测试环境。


  这些软件包最大限度地减少了需要安装的程序数量。更重要的是，它们可以通过一次安装完成。这些软件包通常包含 Apache HTTP 服务器、MySQL 数据库，以及
  PHP、Perl 和 Python 编程语言的解释器。最完整的软件包是 XAMPP（可从 Apache Friends 网站 [`www.apachefriends.org/en/index.html`](http://www.apachefriends.org/en/index.html)
  下载）。XAMPP 完全免费，其主要特点是它是一个跨平台软件包（支持 Windows、Linux、Solaris、MacOS）。此外，XAMPP 还包含一个 Tomcat
  应用服务器（用于 Java 编程语言）和一个 FileZilla FTP 服务器（用于文件传输）。其他解决方案则具有平台特异性，如其名称的首字母所示：


  *   `WAMP` (Windows)

  *   `MAMP` (MacOS)

  *   `LAMP` (Linux)

  *   `SAMP` (Solaris)

  *   `FAMP` (FreeBSD)


  实际上，XAMPP 是一个首字母缩略词；其字母代表以下术语：


  *   `X`，代表操作系统

  *   `A`，代表 Apache，即 Web 服务器

  *   `M`，代表 MySQL，即数据库管理系统

  *   `P`，代表 PHP、Perl 或 Python，即编程语言


  因此，选择最适合你平台的 Web 服务器解决方案，并将其安装在你的电脑上。


  ### 安装 Aptana Studio IDE


  安装好 Web 服务器后，需要安装一个集成开发环境（IDE），用于开发 JavaScript 代码。在本附录中，你将安装 Aptana Studio 作为你的开发环境。


  访问 Aptana 网站（[`www.aptana.com`](http://www.aptana.com/)），点击 Aptana Studio 3 软件的
  Products 标签页（在撰写本文时，最新版本是 3.4.2）。下载独立版本（已集成 Eclipse IDE）：`Aptana_Studio_3_Setup_3.4.2.exe`。


  下载完成后，运行可执行文件以安装 Aptana Studio IDE。安装结束时，启动应用程序，你应该会看到工作台打开，如图 A-1 所示。


  ![A978-1-4842-0865-6_13_Fig1_HTML.jpg](img/A978-1-4842-0865-6_13_Fig1_HTML.jpg)


  图 A-1. Aptana Studio IDE 工作台


  在安装 Aptana Studio 的过程中，软件会自动检测各种浏览器和已安装的 Web 服务器，并进行相应配置。


  ### 设置 Aptana Studio 工作空间


  在开始开发书中的示例之前，你必须创建一个工作空间。首先，你应该在 Aptana Studio 中设置工作空间，使其指向 Web 服务器的文档根目录。


  以下是使用 XAMPP 时的典型路径：


  *   Windows：`C:\xampp\htdocs`

  *   Linux：`/opt/lamp/htdocs`

  *   MacOS：`/Applications/XAMPP/xamppfiles/htdocs`


  而使用 WAMP 时，路径为：


  *   `C:\WAMP\www`


  因此，从菜单中选择 File ➤ Switch Workspace ➤ Other . . .。然后，在字段中输入 Web 服务器文档根目录的路径，如图 A-2
  所示。


  ![A978-1-4842-0865-6_13_Fig2_HTML.jpg](img/A978-1-4842-0865-6_13_Fig2_HTML.jpg)


  图 A-2. 在文档根目录上设置工作空间


  ### 创建项目


  创建工作空间的下一步是在 Aptana Studio 中创建一个项目：


  ![A978-1-4842-0865-6_13_Fig3_HTML.jpg](img/A978-1-4842-0865-6_13_Fig3_HTML.jpg)


  图 A-3. 创建默认项目


  从菜单中选择 New ➤ Web Project。会出现一个如图 A-3 所示的窗口。选择 Default Project，然后点击 Next。输入 `charts`
  作为项目名称。这将是工作空间中的一个目录，你将使用 Aptana Studio 在其中编写书中描述的所有示例文件。


  ### 完成工作空间


  设置好 Aptana Studio 工作空间并创建项目后，即可完成工作空间的配置。


  让我们打开文档根目录，并创建一个名为 `src` 的新目录。现在，你将在整本书中使用的工作空间由两个目录组成：


  *   `src`

  *   `charts`


  `src` 目录应包含所有与库相关的文件。


  `charts` 目录应包含与书中示例相关的所有 HTML、图像和层叠样式表（CSS）文件（这实际上是一个项目）。每个示例文件都应在此目录中创建（如果你更喜欢采用不同的方式，也可以，但重要的是要注意
  HTML 页面中引用库文件和图像时的不同路径）。


  注意


  本书附带的源代码（可从 Apress 网站 [`www.apress.com`](http://www.apress.com/) 的源代码/下载区域获取）实际上已经打包在一个工作空间中。其中，你会找到
  charts 项目的两个版本：内容分发网络（CDN）版和本地版。`charts_CDN` 目录包含所有引用远程分发服务的库的示例。`charts_local`
  目录包含所有引用 `src` 目录内库的示例。


  ### 用库文件填充 src 目录


  如果你选择通过引用本地库来开发 HTML 页面，则需要下载所有库文件。这些文件将被收集在 `src` 目录中。这是一个好方法，因为你可以开发多个项目，这些项目将使用相同的库，而无需为每个项目复制它们。


  本附录中列出的版本是用于实现书中示例的版本。如果你安装其他版本，可能会出现不兼容问题，或者你可能会观察到与描述不同的行为。


  #### D3 库版本 3


  访问 D3 网站（[`http://d3js.org`](http://d3js.org/)），下载库文件：`d3.v3.zip`。直接解压所有内容，并将其放置在
  `src` 目录中。现在，`src` 目录中应该有两个新文件：


  *   `d3.v3.js`

  *   `d3.v3.min.js`


  至此，你已获得 `src` 目录，该目录应包含如图 A-4 所示的子目录和文件。


  ![A978-1-4842-0865-6_13_Fig4_HTML.jpg](img/A978-1-4842-0865-6_13_Fig4_HTML.jpg)


  图 A-4. `src` 目录中包含的文件和子目录


  注意


  按照惯例，你将在 `charts` 目录中开发示例。如果你想采用其他方式，则在将其他文件包含到网页中时，需要考虑新的路径。


  如果你在 `charts` 目录内开发 HTML 页面，则需要使用以下代码：


  ```

  <script type="text/javascript" src="../src/d3.v3.js"></script>

  ```


  相反，如果你更愿意直接在文档根目录中开发，则使用以下代码：


  ```

  <script type="text/javascript" src="src/d3.v3.js"></script>

  ```


  简而言之，重要的是要考虑你所包含的文件相对于你正在实现的页面的路径。




  ### 运行示例


  在工作区创建或复制 HTML 文件后，若要在 Aptana Studio IDE 中运行它，请从菜单中选择 `运行` ➤ `运行`，或单击工具栏上的 `运行`
  按钮（见图 A-5）。


  ![A978-1-4842-0865-6_13_Fig5_HTML.jpg](img/A978-1-4842-0865-6_13_Fig5_HTML.jpg)


  图 A-5. 工具栏上的 `运行` 按钮


  随后，您的默认浏览器将立即打开，并加载所选的 HTML 页面。


  查看 `运行配置`（见图 A-6），方法是从 `运行` 图标的上下文菜单中选择 `运行配置...`。例如，让我们将 `http://localhost/` 设置为您的基址
  URL；为此，请选择 `附加项目名称` 选项，如图所示。然后，单击 `应用` 按钮以确认您的设置。


  ![A978-1-4842-0865-6_13_Fig6_HTML.jpg](img/A978-1-4842-0865-6_13_Fig6_HTML.jpg)


  图 A-6. 必须为每个浏览器正确设置运行配置


  现在，您已具备轻松处理本书所有示例所需的一切条件。


  一旦您对 Aptana IDE 达到一定熟悉程度，您会发现它是开发许多其他项目的绝佳环境，无论是 JavaScript 项目还是其他编程语言（例如 PHP）项目。


  那么，祝您玩得开心！


  ### 总结


  本附录提供了关于如何将 XAMPP 和 Aptana Studio 结合使用，在您的 PC 上创建开发环境的指南。使用这些应用程序并非强制要求，还有许多其他解决方案可供选择；互联网上有许多应用程序可以执行类似操作。但是，如果您希望实现并快速测试本书中描述的示例，该环境将证明是一个不错的选择。




