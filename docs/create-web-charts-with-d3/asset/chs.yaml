  \n**图 4-12.** 一个水平条形图\n\n### 本章小结\n\n在本章中，你几乎涵盖了与实现条形图相关的所有基本方面，这种图表类型与本书第一部分使用\
  \ jqPlot 库开发的图表类型相同。这里，你使用了 D3 库。因此，你看到了如何逐个元素地实现一个简单的条形图；然后你继续学习了堆叠条形图和分组条形图的各种情况，最后研究了一个非常特殊的情况：一个描绘负值的水平条形图。\n\
  \n在下一章中，你将采用相同的方法：你将学习如何以类似于使用 jqPlot 时的方式来实现饼图，但这次你将使用 D3 库。\n\n"
- "# 5. 使用 D3 绘制饼图\n\n在上一章中，你刚刚了解了条形图如何表示特定类别的数据。你还看到，从相同的数据结构出发，根据你的意图，你可以选择一种图表类型而不是另一种，以突出数据的特定方面。例如，在选择归一化堆叠条形图时，你希望关注每个行业在其国家收入中所占的百分比。\n\
  \n通常，条形图表示的此类数据也可以使用饼图来表示。在本章中，你将学习如何使用 D3 库创建这种图表类型。鉴于该库不像 jqPlot 那样提供已经实现好的图形，而是要求用户使用基本的可缩放矢量图形（SVG）元素来构建它们，你将首先了解如何构建弧线和扇形。事实上，就像条形图的矩形和折线图的线条一样，这些形状对于实现饼图（使用扇形）或环形图（使用弧线）至关重要。在实现了一个经典的饼图示例之后，我们将通过创建一些变体来进一步深入探讨该主题。在本章的第二部分，你将处理环形图，管理从逗号分隔值（CSV）文件中读取的多个数据系列。\n\
  \n最后，我们将以一个尚未涉及过的图表来结束本章：极区面积图。这种图表类型是饼图的进一步演变，其中扇区不再局限于一个圆内，而是都具有不同的半径。使用极区面积图，信息将不再仅由扇区所占的角度表示，还由其半径表示。\n\
  \n\n\n### 基础饼图\n\n为了更好地突出柱状图与饼图之间的相似性，本示例将使用与创建基础柱状图时相同的 CSV 文件（参见第 4 章中的“绘制柱状图”部分）。因此，在本节中，你的目标是使用相同的数据来实现对应的饼图。为此，在开始“烘焙”饼图和甜甜圈图之前，你必须先获得形状合适的“烤盘”。D3\
  \ 库也允许你表示弧形和扇形等弯曲形状，尽管实际上并没有这样的 SVG 元素。事实上，正如你很快会看到的，借助其一些方法，D3 可以像处理其他真实的 SVG 元素（矩形、圆形、线条等）一样处理弧线和扇形。一旦你熟悉了这些元素的实现，创建基础饼图的工作就基本完成了。在本节的第二部分，你将主要通过对形状边框和颜色的调整，来制作一些主题变体。\n\
  \n### 绘制基础饼图\n\n请再次关注名为 `data_04.csv` 的 CSV 文件中包含的数据（参见代码清单 5-1）。\n\n代码清单 5-1. `data_04.csv`\n\
  \n```\ncountry,income\nFrance,14\nRussia,22\nJapan,13\nSouth Korea,34\nArgentina,28\n\
  ```\n\n现在，我们将演示这些数据如何完美地适用于饼图表示。首先，在代码清单 5-2 中，定义了绘图区域和边距。\n\n代码清单 5-2. `Ch5_01a.html`\n\
  \n```\nvar margin = {top: 70, right: 20, bottom: 30, left: 40},\n    w = 500 - margin.left\
  \ - margin.right,\n    h = 400 - margin.top - margin.bottom;\n```\n\n即使是饼图，你也需要使用一系列颜色来区分不同的扇区。通常，使用\
  \ `category10()` 函数来创建颜色域是常见的做法，这也是你到目前为止所做的。在本例中你可以做同样的事情，但这并非总是必需的。因此，我们借此机会看看如何传递自定义的颜色序列。通过逐个定义你喜欢的颜色来创建一个自定义示例，如代码清单\
  \ 5-3 所示。\n\n代码清单 5-3. `Ch5_01a.html`\n\n```\nvar margin = {top: 70, right: 20,\
  \ bottom: 30, left: 40},\n    w = 500 - margin.left - margin.right,\n    h = 400\
  \ - margin.top - margin.bottom;\n\nvar color = d3.scale.ordinal()\n    .range([\"\
  #ffc87c\", \"#ffeba8\", \"#f3b080\", \"#916800\", \"#dda66b\"]);\n```\n\n之前你使用 `rect`\
  \ 元素构建了柱状图，而现在你需要处理的是圆形的扇区。因此，你将涉及圆形、角度、弧线、半径等概念。D3 提供了一整套工具，允许你处理这类对象，从而简化饼图的工作。\n\
  \n为了表示饼图的扇区（圆形扇区），D3 为你提供了一个函数：`d3.svg.arc()`。这个函数实际上定义了弧线。术语“弧”指的是由一个角度和两个圆（一个半径较小（内半径），另一个半径较大（外半径））所界定的特定几何表面。圆形扇区，即饼图的一个切片，无非就是内半径等于\
  \ 0 的弧（参见图 5-1）。\n\n![A978-1-4842-0865-6_5_Fig1_HTML.jpg](img/A978-1-4842-0865-6_5_Fig1_HTML.jpg)\n\
  \n图 5-1.\n\n通过增加内半径，可以从圆形扇区转变为弧\n\n首先，你需要计算一个与绘图区域大小相协调的半径。然后，根据这个范围，界定外半径和内半径，在本例中内半径为\
  \ 0（参见代码清单 5-4）。\n\n代码清单 5-4. `Ch5_01a.html`\n\n```\n...\nvar color = d3.scale.ordinal()\n\
  \    .range([\"#ffc87c\", \"#ffeba8\", \"#f3b080\", \"#916800\", \"#dda66b\"]);\n\
  \nvar radius = Math.min(w, h) / 2;\n\nvar arc = d3.svg.arc()\n    .outerRadius(radius)\n\
  \    .innerRadius(0);\n```\n\nD3 还提供了一个定义饼图的函数：`d3.layout.pie()` 函数。该函数构建一个布局，允许你非常轻松地计算弧的起始角度和结束角度。使用这个函数并非强制要求，但饼图布局会自动将数据数组转换为对象数组。因此，如代码清单\
  \ 5-5 所示，定义一个对收入值进行迭代的函数来创建饼图。\n\n代码清单 5-5. `Ch5_01a.html`\n\n```\n...\nvar arc\
  \ = d3.svg.arc()\n    .outerRadius(radius)\n    .innerRadius(0);\n\nvar pie = d3.layout.pie()\n\
  \    .sort(null)\n    .value(function(d) { return d.income; });\n```\n\n现在，如代码清单\
  \ 5-6 所示，插入根元素 `<svg>`，并为其分配正确的尺寸和适当的 `translate()` 变换。\n\n代码清单 5-6. `Ch5_01a.html`\n\
  \n```\n...\nvar pie = d3.layout.pie()\n    .sort(null)\n    .value(function(d) {\
  \ return d.income; });\n\nvar svg = d3.select(\"body\").append(\"svg\")\n    .attr(\"\
  width\", w + margin.left + margin.right)\n    .attr(\"height\", h + margin.top +\
  \ margin.bottom)\n    .append(\"g\")\n    .attr(\"transform\", \"translate(\" +\
  \ (w / 2 + margin.left) +\n          \",\" + (h / 2 + margin.top) + \")\");\n```\n\
  \n\n\n接下来，对于 CSV 文件中的数据读取，你一如既往地使用 `d3.csv()` 函数。同样，你必须确保收入被解释为数值，而不是字符串。然后，你使用\
  \ `forEach()` 函数编写迭代，并用 `+` 符号为收入赋值，如清单 5-7 所示。\n\n**清单 5-7.** `Ch5_01a.html`\n\n\
  ```\n...\n.append(\"g\")\n.attr(\"transform\", \"translate(\" +(w/2+margin.left)+\n\
  \",\" +(h/2+margin.top)+ \")\");\nd3.csv(\"data_04.csv\", function(error, data)\
  \ {\ndata.forEach(function(d) {\nd.income = +d.income;\n});\n});\n```\n\n现在是时候添加一个\
  \ `<arc>` 元素了，但这个元素并不作为 SVG 元素存在。实际上，你在这里使用的是描述弧线形状的 `<path>` 元素。正是 D3 本身借助 `pie()`\
  \ 和 `arc()` 函数构建了相应的路径。这为你省去了一个过于复杂的工作。你只需定义这些元素，就好像它们是 `<arc>` 元素一样（参见清单 5-8）。\n\
  \n**清单 5-8.** `Ch5_01a.html`\n\n```\nd3.csv(\"data_04.csv\", function(error, data)\
  \ {\ndata.forEach(function(d) {\nd.income = +d.income;\n});\nvar g = svg.selectAll(\"\
  .arc\")\n.data(pie(data))\n.enter().append(\"g\")\n.attr(\"class\", \"arc\");\n\
  g.append(\"path\")\n.attr(\"d\", arc)\n.style(\"fill\", function(d) { return color(d.data.country);\
  \ });\n});\n```\n\n如果你用 Firebug 分析 SVG 结构，可以在图 5-2 中看到弧线路径是自动创建的，并且每个扇区都有一个 `<g>`\
  \ 元素。\n\n![A978-1-4842-0865-6_5_Fig2_HTML.jpg](img/A978-1-4842-0865-6_5_Fig2_HTML.jpg)\n\
  \n**图 5-2.** 使用 Firebug，你可以看到 D3 库如何自动构建弧线元素\n\n此外，有必要为每个扇区添加一个指示性标签，以便你能理解它对应哪个国家，如清单\
  \ 5-9 所示。请注意 `arc.centroid()` 函数。此函数计算弧线的质心。质心定义为内半径和外半径以及起始角度和结束角度之间的中点。因此，标签文本完美地出现在每个扇区的中间。\n\
  \n**清单 5-9.** `Ch5_01a.html`\n\n```\nd3.csv(\"data_04.csv\", function(error, data)\
  \ {\n...\ng.append(\"path\")\n.attr(\"d\", arc)\n.style(\"fill\", function(d) {\
  \ return color(d.data.country); });\ng.append(\"text\")\n.attr(\"transform\", function(d)\
  \ {\nreturn \"translate(\" + arc.centroid(d) + \")\"; })\n.style(\"text-anchor\"\
  , \"middle\")\n.text(function(d) { return d.data.country; });\n});\n```\n\n即使对于饼图，在顶部中央位置添加标题也是一种好的做法（参见清单\
  \ 5-10）。\n\n**清单 5-10.** `Ch5_01a.html`\n\n```\nd3.csv(\"data_04.csv\", function(error,\
