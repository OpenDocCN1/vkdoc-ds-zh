  \n**图 3-20.** 多系列折线图\n\n#### 图例\n\n在处理多系列图表时，下一步逻辑是添加图例，以便用颜色和标签对系列进行分类。由于图例与其他图形对象一样，你需要添加允许在图表上绘制它的\
