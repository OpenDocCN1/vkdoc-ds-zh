  **图 3-7.** 一个带有网格和坐标轴标签的折线图，该图考虑了输入数组中的 `y` 值\n\n\n\n#### 控制坐标轴范围\n\n在你刚刚绘制的折线图代码中，数据线会始终位于图表顶部。如果你的数据在非常高的水平上波动，而\
  \ `y` 轴的刻度从 0 开始，那么趋势线可能会被压平。当 `y` 轴的上限等于 `y` 的最大值时，也不是最佳选择。在这里，你将添加对坐标轴范围的检查。为此，在代码清单\
  \ 3-20 中，你定义了四个变量来指定 `x` 轴和 `y` 轴的下限和上限。\n\n**代码清单 3-20.** `Ch3_03.html`\n\n```\n\
  var xLowLim = 0;\nvar xUpLim = d3.max(ax);\nvar yUpLim = 1.2 * d3.max(ay);\nvar\
  \ yLowLim = 0.8 * d3.min(ay);\n```\n\n因此，你将所有对极限值的引用替换为这些变量。请注意，代码变得更具可读性。以直接的方式指定这四个限制，使你能够根据需要轻松修改它们。在这种情况下，只表示了\
