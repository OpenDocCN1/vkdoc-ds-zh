  \ { return v.attendee; });\n    }),\n    d3.max(continents, function(c) {\n    \
  \  return d3.max(c.values, function(v) { return v.attendee; });\n    })\n  ]);\n\
  \  ...\n});\n```\n\n得益于新的数据结构，你可以为每个大洲添加一个包含折线路径的 SVG 元素 `<g>`，如清单 3-57 所示。\n\n\
