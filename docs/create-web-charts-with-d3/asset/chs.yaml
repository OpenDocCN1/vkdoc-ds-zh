  \n**图 3-12.** 一个准备填充数据的空白图表\n\n使用 FireBug，你可以看到你刚刚定义的 SVG 元素的结构（参见图 3-13）。\n\n![A978-1-4842-0865-6_3_Fig13_HTML.jpg](img/A978-1-4842-0865-6_3_Fig13_HTML.jpg)\n\
