  #### 运行和调试 JavaScript


  如果我们想在客户端-服务器框架中定义 `JavaScript`，它是一种完全客户端的编程语言。它不需要编译，并且除了 `HTML` 文档之外，代码片段还可以出现在许多其他特定于其他语言的文件类型中，例如
  `.JSP` 或 `.PHP`。


  这些代码片段未经任何处理就原封不动地通过应用服务器。只有浏览器负责运行 `JavaScript` 代码。因此，`JavaScript` 代码仅在网页下载时或之后响应事件时运行。如果
  `JavaScript` 代码规模较大或将来可能有用，则可以将其定义在外部 `.JS` 文件中；在这里，你将找到本书中提到的所有 `JavaScript` 库和框架。然而，无论其形式如何，`JavaScript`
  都直接在浏览器中运行。


  因此，即使你不使用真正的 `IDE` 来开发和调试 `JavaScript` 代码，你也可以简单地将代码插入到一个空的 `HTML` 文件中，然后直接在浏览器（`Chrome`、`Internet
  Explorer` 和 `Firefox` 是最常见的）中加载该文件。为了将其与页面上的其他文本区分开来，你必须将代码放在 `<script></scripts>`
  标签内：


  ```

  <script type="text/javascript">


  // JavaScript 代码


  </script>

  ```


  如果 `JavaScript` 代码位于外部文件中，则需要将其包含在 `HTML` 页面中，编写如下：


  ```

  <script type="text/javascript" src="library.js"></script>

  ```


  因此，只要执行 `JavaScript` 的目的不是为了安装某些东西，你就拥有了所需的一切。谁的操作系统上没有网页浏览器呢？


  #### JavaScript 中的数据类型


  如前所述，本书既不会解释编写优秀 `JavaScript` 代码的规则和语法，也不会过多地停留在编程细节上。尽管如此，我们将要开发的代码是围绕图表展开的，或者更确切地说，是围绕数据处理以及如何显示它们展开的。让我们从最简单的情况开始。所有数据结构的最小构建块是变量（当它包含单个值时）。在处理数据类型方面，`JavaScript`
  与其他编程语言非常不同。当你想要将值存储到 `JavaScript` 变量中时，你无需指定值的类型（`int`、`string`、`float`、`boolean`
  等）；你只需使用 `var` 关键字来定义它。


  在 `Java` 或 `C` 中，包含整数值的变量与包含文本的变量的声明方式不同：


  ```

  int value = 3;

  String text = "这是一个字符串值";

  ```


  在 `JavaScript` 中，存储值的类型无关紧要。一切都用 `var` 声明，因此相同的声明是：


  ```

  var value = 3;

  var text = "这是一个字符串值";

  ```


  因此，在 `JavaScript` 中，我们可以将变量视为用于存储任何类型值的容器。


  为简单起见，这里将变量视为单个值的容器，从而代表了最简单的数据结构。然而，实际上，变量也可能包含更复杂的数据类型：数组和对象。


  **注意**


  在 `JavaScript` 中使用变量实际上稍微复杂一些。你也可以在不使用 `var` 关键字声明的情况下使用变量。`var` 关键字将在当前作用域内声明该变量。如果缺少
  `var`，`JavaScript` 将搜索在更高作用域级别声明的同名变量。如果 `JavaScript` 没有找到这个变量，则会声明一个新的变量；否则，`JavaScript`
  将使用找到的变量中的值。因此，变量的不正确使用有时会导致难以检测的错误。




  ### 数组


  数组是由逗号分隔、并用方括号 `[ ]` 括起来的一系列值：


  ```

  var array = [ 1, 6, 3, 8, 2, 4 ];

  ```


  数组是 JavaScript 中最简单、最广泛使用的数据结构，因此你应该非常熟悉它们。通过在数组名后的方括号中指定其索引（在数组中的位置），可以访问数组中的任何值。在
  JavaScript 中，索引从 0 开始：


  ```

  array[3]  //返回 8

  ```


  数组可以包含任何类型的数据，而不仅仅是整数：


  ```

  var fruits = [ "banana", "apple", "peach" ];

  ```


  有许多函数可以帮助我们处理这种对象。由于其有用性，我将在本书中频繁使用此对象，因此有必要快速了解一下。


  可以通过以下方式知道数组中值的数量：


  ```

  fruits.length  //返回 3

  ```


  或者，如果你知道值，可以通过以下方式获取对应的索引：


  ```

  fruits.indexOf("apple") //返回 1

  ```


  此外，还有一组函数允许我们在数组中添加和删除项目。`push()` 和 `pop()` 函数用于添加和删除数组的最后一个元素，而 `shift()` 和 `unshift()`
  函数用于添加和删除数组的第一个元素：


  ```

  fruits.push("strawberry");


  // 现在数组是 ["banana", "apple", "peach", "strawberry"];


  fruits.pop();   //返回 "strawberry"


  // 现在数组是 ["banana", "apple", "peach"];


  fruits.unshift("orange", "pear");


  // 现在数组是 ["orange", "pear", "banana", "apple", "peach"];


  fruits.shift(); //返回 "orange"


  // 现在数组是 ["pear", "banana", "apple", "peach"];

  ```


  有时，需要遍历数组中的每个值以对其执行某些操作。在其他编程语言中广泛使用的一种方法是使用 `for()` 函数。例如，要计算数组中值的总和，你可以这样写：


  ```

  var sum = 0;


  for (var i = 0; i < array.length; i++) {


  sum += array[i];


  }

  ```


  但是，在 JavaScript 中更常见的是使用 `forEach()` 函数，其中 `d` 按顺序依次取数组中的值：


  ```

  var sum = 0;


  array.forEach(function(d) {


  sum += d;


  });

  ```


  ### 对象


  数组对于简单的值列表很有用，但如果你想要结构化数据，则需要定义一个对象。对象是一种自定义数据结构，其属性和值由你定义。你可以通过将属性括在两个花括号 `{ }`
  中来定义对象；每个属性由一个名称后跟冒号（`:`）和赋值的值定义，逗号分隔每个属性/值对：


  ```

  var animal = {


  species: "lion",


  class: "mammalia",


  order: "carnivora",


  extinct: false,


  number: 123456


  };

  ```


  在 JavaScript 代码中，点表示法通过指定属性名称来引用每个值：


  ```

  animal.species      //返回 "lion"

  ```


  现在你已经了解了对象和数组，可以看到如何将它们组合起来，以在 JavaScript 中获得更复杂的数据结构。你可以创建对象数组、数组对象，甚至是对象中的对象。方括号用于表示数组，花括号用于表示对象。例如，让我们这样定义一个对象数组：


  ```

  var animals = [


  {


  species: "lion",


  class: "mammalia",


  order: "carnivora",


  extinct: false,


  number: 123456


  },


  {


  species: "gorilla",


  class: "mammalia",


  order: "primates",


  extinct: false,


  number: 555234


  },


  {


  species: "octopus",


  class: "cephalopoda",


  order: "octopoda",


  extinct: false,


  number: 333421


  }


  ];

  ```


  要获取这些数据结构的值，你需要同时使用带索引的方括号和属性名称：


  ```

  animals[0].extinct //返回 false


  animals[2].species //返回 "octopus"

  ```


  ### Firebug 和 DevTools


  要进行调试，如果你使用 IDE，可以轻松利用其中包含的各种调试工具。但是，如果你无法使用 IDE，仍然可以利用外部工具。将浏览器视为一个开发环境，可以通过从互联网下载的插件集成调试工具。目前互联网上有许多可用的工具，但我想推荐的是
  Firebug，这是一个为那些喜欢使用 Mozilla Firefox 浏览器的用户准备的 Web 开发工具。Firebug 是一个无缝集成到 Firefox
  浏览器中的插件，如图 1-15 所示。


  ![A978-1-4842-0865-6_1_Fig15_HTML.jpg](img/A978-1-4842-0865-6_1_Fig15_HTML.jpg)


  图 1-15. Firebug 是 Mozilla Firefox 的一个扩展，并完全集成到浏览器中


  Firebug 将在整个过程中被证明是一个非常实用的工具，尤其是在使用 jQuery 和 D3 库时，这些库要求始终控制 DOM 的结构。此工具将允许你直接监控
  DOM 的结构。


  然而，对于那些喜欢使用 Google Chrome 的用户，有 DevTools，它已经集成到浏览器中（见图 1-16）。要访问此工具，只需单击浏览器右上角的按钮。


  接下来，选择工具 ➤ 开发者工具，或者只需右键单击任何页面元素，然后在上下文菜单中选择检查元素。


  ![A978-1-4842-0865-6_1_Fig16_HTML.jpg](img/A978-1-4842-0865-6_1_Fig16_HTML.jpg)


  图 1-16. 使用 DevTools 可以监控关于网页的大量信息


  使用这两个工具，你不仅可以轻松检查 DOM 的每个元素——其属性和它们的值——还可以检查应用于它们的 CSS 样式。你还可以输入对这些值的更改，以实时观察效果，而无需每次都修改文件中的代码并保存。Firebug
  和 DevTools 还包括各种用于监控页面性能的工具，包括渲染和网络性能。


  使用 DevTools 时，还应特别注意控制台的使用。通过它，你可以使用诸如 `console.log()` 之类的方法访问诊断信息。此方法经常用于通过控制台显示许多变量的值，将变量名称作为参数传递，并添加文本作为指示：


  ```

  var x = 3;


  console.log("The value of x is " + x); // x 的值是 3

  ```


  还可以使用诸如 `$()` 或 `profile()` 之类的方法输入命令并与文档进行交互。有关这些方法的更多信息，请参阅关于 Console API ( [`https://developers.google.com/chrome-developer-tools/docs/console-api`](https://developers.google.com/chrome-developer-tools/docs/console-api)
  ) 和 Command Line API ( [`https://developers.google.com/chrome-developer-tools/docs/commandline-api`](https://developers.google.com/chrome-developer-tools/docs/commandline-api)
  ) 的文档。


  ### JSON


  JSON 是一种将数据组织为 JavaScript 对象的特定语法。这种格式通常用于基于浏览器的代码中，尤其是在 JavaScript 中。JSON 是 XML
  组织数据的有效替代方案。两者都与编程语言无关，但 JSON 比 XML（一种完整的标记语言）更快，更容易用 JavaScript 解析。此外，D3 与 JSON
  配合得很好。其结构完全遵循我们在 JavaScript 中定义的对象和数组的规则：


  ```

  var company = {


  "name": "Elusive Dinamics",


  "location": "France",


  "sites": 2,


  "employees": 234,


  "updated": true


  };

  ```




