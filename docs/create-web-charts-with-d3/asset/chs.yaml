  \n**图 3-14.** 开始绘制水平网格线\n\n你的图表现在已准备好显示来自 CSV 文件的数据了。\n\n\n\n#### 使用 `csv()` 函数绘制数据\n\
  \n现在，是时候在图表中显示数据了，你可以使用 D3 函数 `d3.csv()` 来实现，如清单 3-36 所示。\n\n**清单 3-36.** `ch3_06a.html`\n\
  \n```\nd3.csv(\"data_01.csv\", function(error, data) {\n\n// 这里我们将放置所有受数据影响的 SVG\
