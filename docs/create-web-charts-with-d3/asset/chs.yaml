  \n**图 7-6.** 每个组都显示其趋势线\n\n\n\n#### 聚类\n\n在使用散点图时，你可能需要进行聚类分析。互联网上存在许多分析方法和算法，可以让你执行各种聚类识别与研究操作。\n\
  \n聚类分析是一种分类技术，其目标是在数据分布（本例中为 xy 平面上的散点图）中识别数据组（即聚类）。各个数据点分配到这些聚类的过程并非预先定义，而是由聚类分析来确定选择与分组的准则。这些聚类应尽可能相互区分，在本例中，聚类分析将基于各个数据点与代表该聚类的点（称为质心，见图\
  \ 7-7）之间的精确距离作为分组准则。\n\n因此，该分析的主要目的是识别数据分布中可能存在的相似性。在这方面，没有什么比散点图更合适的了——你可以根据聚类归属，通过不同点的不同颜色来突出这些相似性。\n\
  \n在本节中，你将了解如何实现一个聚类分析算法，以及如何将其集成到散点图中。\n\n![A978-1-4842-0865-6_7_Fig7_HTML.jpg](img/A978-1-4842-0865-6_7_Fig7_HTML.jpg)\n\
  \n图 7-7. 聚类分析将一组数据点围绕每个聚类的质心进行分组\n\n##### K-均值算法\n\n鉴于聚类分析的复杂性，本章不会深入探讨该主题。你只关心如何以不同于其所属系列（Exp1、Exp2\
  \ 和 Exp3）的方式突出显示散点图中的各个点。在本例中，你希望根据数据点所属的聚类为其着色。为此，你将使用一个简单的聚类分析案例：K-均值算法。首先，你需要定义要将所有数据划分成的聚类数量，然后为每个聚类选择一个代表点（质心）。每个数据点与三个质心之间的距离将被视为归属准则。\n\
  \n互联网上有一些应用了 K-均值方法的示例，并且完全是用 JavaScript 实现的；其中我选择了 Heather Arthur 开发的一个示例（[`https://github.com/harthur/clusterfck`](https://github.com/harthur/clusterfck)），但你可以用其他任何示例替换它。\n\
  \n对于本例，我擅自修改了代码，使其尽可能简单。从 TSV 文件中包含的数据点开始，并将它们呈现在散点图中，你实际上是在分析这些点在 xy 空间中的分布情况。现在，你希望在此分布中识别出，例如，三个不同的聚类。\n\
  \n为此，你将应用以下算法：\n\n1. 随机选择三个数据点作为聚类质心。\n2. 遍历文件中的所有数据点，将每个数据点分配给具有最近质心的聚类。最终，所有数据点被分为三个聚类。\n\
  3. 在每个聚类内部，计算一个新的质心，这次它不会对应任何给定的点，而是位于聚类中所有点之间的“中点”。\n4. 重复步骤 2 和 3，直到新的质心与之前的质心重合（即质心在\
  \ xy 平面上的坐标保持不变）。\n\n算法完成后，散点图中的点将呈现三种不同的颜色，对应三个不同的聚类。\n\n请注意，此算法中没有优化，因此每次在浏览器中刷新页面时，结果都会不同。事实上，你每次得到的结果都只是一种可能的解决方案，而非“最佳解决方案”。\n\
  \n现在，为了保持一定的模块化，你将把聚类分析的代码写在一个外部文件中，并将其命名为 `kmeans.js`。\n\n首先，你将实现 `randomCentroids()`\
  \ 函数，该函数将从文件包含的点中（此处通过 `points` 数组传入）选择 `k` 个点（本例中 `k` = 3），并将它们指定为 k 个聚类的质心（见清单\
  \ 7-18）。此函数对应算法的第 1 步。\n\n**清单 7-18.** `kmeans.js`\n\n```\nfunction randomCentroids(points,\
  \ k) {\n  var centroids = points.slice(0);\n  centroids.sort(function() {\n    return\
  \ (Math.round(Math.random()) - 0.5);\n  });\n  return centroids.slice(0, k);\n};\n\
  ```\n\n现在，你需要将文件中包含的所有点分配到三个不同的聚类中。为此，你需要计算每个数据点与相关质心之间的距离，因此需要实现一个特定的函数来计算两点之间的距离。在清单\
  \ 7-19 中，定义了 `distance()` 函数，该函数返回通用点 `v1` 和 `v2` 之间的距离。\n\n**清单 7-19.** `kmeans.js`\n\
  \n```\nfunction distance(v1, v2) {\n  var total = 0;\n  for (var i = 0; i < v1.length;\
  \ i++) {\n    total += Math.pow((v2[i] - v1[i]), 2);\n  }\n  return Math.sqrt(total);\n\
  };\n```\n\n\n\n现在你已经知道如何计算两点之间的距离，就可以实现一个函数，用于判断每个数据点的簇分配：计算该点与所有质心的距离，并选择距离最小的那个。因此，你可以将\
  \ `closestCentroid()` 函数添加到代码中，如清单 7-20 所示。\n\n**清单 7-20.** `kmeans.js`\n\n```\n\
  function closestCentroid(point, centroids) {\n    var min = Infinity;\n    var index\
  \ = 0;\n    for (var i = 0; i < centroids.length; i++) {\n        var dist = distance(point,\
  \ centroids[i]);\n        if (dist < min) {\n            min = dist;\n         \
  \   index = i;\n        }\n    }\n    return index;\n}\n```\n\n现在你可以编写一个函数，完整地表达之前首次介绍的算法。该函数需要两个参数：输入数据点（`points`）和这些点将被划分成的簇的数量（`k`）（见清单\
  \ 7-21）。在函数内部，你将使用新实现的 `randomCentroids()` 函数来选择质心（算法的第 1 步）。\n\n**清单 7-21.** `kmeans.js`\n\
  \n```\nfunction kmeans(points, k) {\n    var centroids = randomCentroids(points,\
  \ k);\n}\n```\n\n选定三个质心后，你可以将所有数据点（包含在 `points` 数组中）分配到三个簇中，并定义 `assignment` 数组，如清单\
  \ 7-22 所示（算法的第 2 步）。该数组的长度与 `points` 数组相同，其构造方式使得元素的顺序与数据点的顺序相对应。每个元素包含其所属簇的编号。例如，如果\
  \ `assignment` 数组的第三个元素值为 2，则表示第三个数据点属于第三个簇（簇的编号为 0、1 和 2）。\n\n**清单 7-22.** `kmeans.js`\n\
  \n```\nfunction kmeans(points, k) {\n    var centroids = randomCentroids(points,\
  \ k);\n    var assignment = new Array(points.length);\n    var clusters = new Array(k);\n\
  \    var movement = true;\n    while (movement) {\n        for (var i = 0; i < points.length;\
  \ i++) {\n            assignment[i] = closestCentroid(points[i], centroids);\n \
  \       }\n        movement = false;\n    }\n    return clusters;\n}\n```\n\n最后，通过每次选择一个簇，你将重新计算质心，并重复整个过程，直到获得始终相同的值。首先，如清单\
  \ 7-23 所示，你使用迭代器 `j` 进行迭代，每次分析一个簇。在迭代内部，基于 `assignment` 数组的内容，你将所有属于该簇的数据点填充到 `assigned`\
  \ 数组中。这些值用于计算定义在 `newCentroid` 变量中的新质心。要确定其新坐标 `[x, y]`，你需要分别对该簇所有点的所有 `x` 值和 `y`\
  \ 值求和。然后将这些总和除以点的数量，因此新质心的 `x` 和 `y` 值不过是所有坐标的平均值。\n\n为了实现这一切，你需要使用迭代器 `g` 和 `i`\
  \ 实现一个双重迭代（两个 `for()` 循环）。对 `g` 的迭代允许你每次处理一个坐标（先处理 `x`，再处理 `y`，以此类推），而对 `i` 的迭代允许你逐个点求和，以完成累加。\n\
  \n如果新质心与之前的质心不同，那么各个数据点到簇的分配将再次重复，循环重新开始（算法的第 3 步和第 4 步）。\n\n**清单 7-23.** `kmeans.js`\n\
  \n```\nfunction kmeans(points, k) {\n    ...\n    while (movement) {\n        for\
  \ (var i = 0; i < points.length; i++) {\n            assignment[i] = closestCentroid(points[i],\
  \ centroids);\n        }\n        movement = false;\n        for (var j = 0; j <\
  \ k; j++) {\n            var assigned = [];\n            for (var i = 0; i < assignment.length;\
  \ i++) {\n                if (assignment[i] == j) {\n                    assigned.push(points[i]);\n\
  \                }\n            }\n            if (!assigned.length) {\n       \
  \         continue;\n            }\n            var centroid = centroids[j];\n \
  \           var newCentroid = new Array(centroid.length);\n            for (var\
  \ g = 0; g < centroid.length; g++) {\n                var sum = 0;\n           \
  \     for (var i = 0; i < assigned.length; i++) {\n                    sum += assigned[i][g];\n\
  \                }\n                newCentroid[g] = sum / assigned.length;\n  \
  \              if (newCentroid[g] != centroid[g]) {\n                    movement\
  \ = true;\n                }\n            }\n            centroids[j] = newCentroid;\n\
  \            clusters[j] = assigned;\n        }\n    }\n    return clusters;\n}\n\
  ```\n\n\n\n#### 将聚类分析应用于散点图\n\n完成聚类分析的 JavaScript 代码后，现在需要回到网页中。正如你为趋势线示例所做的那样，你将使用清单\
