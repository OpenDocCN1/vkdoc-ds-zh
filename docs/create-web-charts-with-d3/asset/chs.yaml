  \ 所示，其中包含图例。\n\n![A978-1-4842-0865-6_3_Fig21_HTML.jpg](img/A978-1-4842-0865-6_3_Fig21_HTML.jpg)\n\
  \n**图 3-21.** 带图例的多系列折线图\n\n\n\n#### 插值线\n\n在折线图中，数据点通常按顺序用直线逐一连接。有时，你会看到所有点都连接成曲线的折线图表示。实际上，这种效果是通过插值实现的。从数学角度来看，D3\
  \ 库以更精确的方式涵盖了数据点的插值。因此，你需要更深入地理解这个概念。\n\n当你有一组数值并想用折线图表示它们时，本质上是想了解这些数值所暗示的趋势。根据这个趋势，你可以评估在一个数据点与下一个数据点之间的中间点可能获得哪些值。这种估算实际上就是在进行插值。根据你想要达到的趋势和精度，你可以使用各种数学方法来控制连接数据点的曲线形状。\n\
  \n最常用的方法是样条插值。（如果你想深入了解该主题，请访问 [`http://paulbourke.net/miscellaneous/interpolation/`](http://paulbourke.net/miscellaneous/interpolation/)\
  \ 。）表 3-1 列出了 D3 库提供的各种插值类型。\n\n**表 3-1.** D3 库中可用的折线插值选项\n\n| 选项 | 描述 |\n| ---\
  \ | --- |\n| `basis` | B 样条，在端点处复制控制点。 |\n| `basis-open` | 开放 B 样条；可能不与起点或终点相交。\
  \ |\n| `basis-closed` | 闭合 B 样条，如同一个循环。 |\n| `bundle` | 等同于 `basis`，但使用张力参数来拉直样条。\
  \ |\n| `cardinal` | 基数样条，在端点处复制控制点。 |\n| `cardinal-open` | 开放基数样条；可能不与起点或终点相交，但会与其他控制点相交。\
  \ |\n| `cardinal-closed` | 闭合基数样条，如同一个循环。 |\n| `Linear` | 分段线性线段，如同折线。 |\n| `linear-closed`\
  \ | 闭合线性线段以形成多边形。 |\n| `monotone` | 保持 y 方向单调性的三次插值。 |\n| `step-before` | 在垂直和水平线段之间交替，如同阶梯函数。\
  \ |\n| `step-after` | 在水平和垂直线段之间交替，如同阶梯函数。 |\n\n你可以通过访问 [`https://github.com/mbostock/d3/wiki/SVG-Shapes#wiki-line_interpolate`](https://github.com/mbostock/d3/wiki/SVG-Shapes#wiki-line_interpolate)\
  \ 找到这些选项。\n\n现在你更好地理解了什么是插值，可以看一个实际案例。在之前的例子中，你有三个系列，由不同颜色的线表示，并由连接数据点 (x,y) 的线段组成。但也可以绘制相应的插值线来代替。\n\
  \n如清单 3-59 所示，你只需向 `d3.svg.line` 添加 `interpolate()` 方法即可获得所需效果。\n\n**清单 3-59.**\
  \ Ch3_08b.html\n\n```\nvar line = d3.svg.line()\n  .interpolate(\"basis\")\n  .x(function(d)\
  \ { return x(d.date); })\n  .y(function(d) { return y(d.attendee); });\n```\n\n\
  图 3-22 显示了应用于图表中三个系列的插值线。连接数据点的直线已被曲线取代。\n\n![A978-1-4842-0865-6_3_Fig22_HTML.jpg](img/A978-1-4842-0865-6_3_Fig22_HTML.jpg)\n\
  \n**图 3-22.** 平滑的多系列折线图\n\n### 差异折线图\n\n这种图表描绘了两个系列之间的区域。在第一个系列大于第二个系列的范围内，区域显示一种颜色；在小于的范围内，区域显示另一种颜色。这类图表的一个典型例子是比较收入和支出随时间变化的趋势。当收入大于支出时，区域为绿色（通常绿色代表良好），而当收入小于支出时，区域为红色（表示糟糕）。将清单\
  \ 3-60 中的值写入一个 TSV（或 CSV）文件，并将其命名为 `data_03.tsv`（参见注释）。\n\n**注意**\n\nTSV 文件中的值由制表符分隔，因此当你编写或复制清单\
  \ 3-60 时，请记得检查每个值之间是否只有一个制表符。\n\n**清单 3-60.** data_03.tsv\n\n```\nDate        income\
  \    expense\n12-Feb-12    52        40\n27-Feb-12    56        35\n02-Mar-12  \
  \  31        45\n14-Mar-12    33        44\n30-Mar-12    44        54\n07-Apr-12\
  \    50        34\n18-Apr-12    65        36\n02-May-12    56        40\n19-May-12\
  \    41        56\n28-May-12    45        32\n03-Jun-12    54        44\n18-Jun-12\
  \    43        46\n29-Jun-12    39        52\n```\n\n开始编写清单 3-61 中的代码；这次不包含解释，因为该示例与前一个几乎相同。\n\
  \n**清单 3-61.** Ch3_09.html\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
  utf-8\">\n<script src=\"http://d3js.org/d3.v3.js\"></script>\n<style>\nbody {\n\
  \  font: 10px verdana;\n}\n.axis path,\n.axis line {\n  fill: none;\n  stroke: #333;\n\
  }\n.grid .tick {\n  stroke: lightgrey;\n  opacity: 0.7;\n}\n.grid path {\n  stroke-width:\
  \ 0;\n}\n</style>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar margin\
  \ = {top: 70, right: 20, bottom: 30, left: 50},\n    w = 400 - margin.left - margin.right,\n\
  \    h = 400 - margin.top - margin.bottom;\n\nvar parseDate = d3.time.format(\"\
  %d-%b-%y\").parse;\n\nvar x = d3.time.scale().range([0, w]);\nvar y = d3.scale.linear().range([h,\
  \ 0]);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n    .orient(\"bottom\")\n  \
  \  .ticks(5);\n\nvar yAxis = d3.svg.axis()\n    .scale(y)\n    .orient(\"left\"\
  )\n    .ticks(5);\n\nvar xGrid = d3.svg.axis()\n    .scale(x)\n    .orient(\"bottom\"\
  )\n    .ticks(5)\n    .tickSize(-h, 0, 0)\n    .tickFormat(\"\");\n\nvar yGrid =\
  \ d3.svg.axis()\n    .scale(y)\n    .orient(\"left\")\n    .ticks(5)\n    .tickSize(-w,\
  \ 0, 0)\n    .tickFormat(\"\");\n\nvar svg = d3.select(\"body\").append(\"svg\"\
  )\n    .attr(\"width\", w + margin.left + margin.right)\n    .attr(\"height\", h\
  \ + margin.top + margin.bottom)\n  .append(\"g\")\n    .attr(\"transform\", \"translate(\"\
  \ + margin.left + \",\" + margin.top + \")\");\n\n// 这里我们添加 d3.tsv 函数\n// 需要包含在\
  \ d3.tsv() 函数中的代码部分开始\nd3.tsv(\"data_03.tsv\", function(error, data) {\n  svg.append(\"\
  g\")\n      .attr(\"class\", \"x axis\")\n      .attr(\"transform\", \"translate(0,\"\
  \ + h + \")\")\n      .call(xAxis);\n\n  svg.append(\"g\")\n      .attr(\"class\"\
  , \"y axis\")\n      .call(yAxis);\n\n  svg.append(\"g\")\n      .attr(\"class\"\
  , \"grid\")\n      .attr(\"transform\", \"translate(0,\" + h + \")\")\n      .call(xGrid);\n\
  \n  svg.append(\"g\")\n      .attr(\"class\", \"grid\")\n      .call(yGrid);\n});\n\
  // 需要包含在 d3.tsv() 函数中的代码部分结束\n\nvar labels = svg.append(\"g\")\n    .attr(\"class\"\
  , \"labels\");\n\nlabels.append(\"text\")\n    .attr(\"transform\", \"translate(0,\"\
  \ + h + \")\")\n    .attr(\"x\", (w-margin.right))\n    .attr(\"dx\", \"-1.0em\"\
  )\n    .attr(\"dy\", \"2.0em\")\n    .text(\"[月份]\");\n\nlabels.append(\"text\"\
  )\n    .attr(\"transform\", \"rotate(-90)\")\n    .attr(\"y\", -40)\n    .attr(\"\
  dy\", \".71em\")\n    .style(\"text-anchor\", \"end\")\n    .text(\"百万美元\");\n\n\
  var title = svg.append(\"g\")\n    .attr(\"class\", \"title\");\n\ntitle.append(\"\
  text\")\n    .attr(\"x\", (w / 2))\n    .attr(\"y\", -30 )\n    .attr(\"text-anchor\"\
  , \"middle\")\n    .style(\"font-size\", \"22px\")\n    .text(\"差异图表\");\n</script>\n\
  </body>\n</html>\n```\n\n首先，你读取 TSV 文件以检查收入和支出值是否为正数。然后，你解析所有日期值（参见清单 3-62）。\n\n\
  **清单 3-62.** Ch3_09.html\n\n```\nd3.tsv(\"data_03.tsv\", function(error, data) {\n\
  \  data.forEach(function(d) {\n    d.date = parseDate(d.date);\n    d.income = +d.income;\n\
  \    d.expense = +d.expense;\n  });\n...\n});\n```\n\n\n\n此处与之前展示的示例（多系列折线图）不同，无需重构数据，因此可以直接在\
  \ `x` 和 `y` 上创建比例尺（domain），如代码清单 3-63 所示。最大值和最小值是通过每一步用 `Math.max` 和 `Math.min`\
  \ 比较收入和支出值获得的，然后使用 `d3.min` 和 `d3.max` 找出每一步影响迭代的值。\n\n**代码清单 3-63.** `Ch3_09.html`\n\
  \n```\nd3.tsv(\"data_03.tsv\", function(error, data) {\n  data.forEach(function(d)\
  \ {\n    ...\n  });\n  x.domain(d3.extent(data, function(d) { return d.date; }));\n\
  \  y.domain([\n    d3.min(data, function(d) {return Math.min(d.income, d.expense);\
  \ }),\n    d3.max(data, function(d) {return Math.max(d.income, d.expense); })\n\
  \  ]);\n  ...\n});\n```\n\n在添加 SVG 元素之前，需要定义一些 CSS 类。当支出大于收入时，使用红色；否则使用绿色。需要定义这些颜色，如代码清单\
  \ 3-64 所示。\n\n**代码清单 3-64.** `Ch3_09.html`\n\n```\n<style>\n  ...\n  .area.above\
  \ {\n    fill: darkred;\n  }\n  .area.below {\n    fill: lightgreen;\n  }\n  .line\
  \ {\n    fill: none;\n    stroke: #000;\n    stroke-width: 1.5px;\n  }\n</style>\n\
  ```\n\n由于需要表示线条和区域，可以通过数据点之间的插值来定义它们（参见代码清单 3-65）。\n\n**代码清单 3-65.** `Ch3_09.html`\n\
  \n```\nd3.tsv(\"data_03.tsv\", function(error, data) {\n  ...\n  svg.append(\"g\"\
  )\n    .attr(\"class\", \"grid\")\n    .call(yGrid);\n\n  var line = d3.svg.area()\n\
  \    .interpolate(\"basis\")\n    .x(function(d) { return x(d.date); })\n    .y(function(d)\
  \ { return y(d[\"income\"]); });\n\n  var area = d3.svg.area()\n    .interpolate(\"\
  basis\")\n    .x(function(d) { return x(d.date); })\n    .y1(function(d) { return\
  \ y(d[\"income\"]); });\n});\n```\n\n如你所见，实际上只定义了收入点的线条；没有涉及支出值。但我们需要的是收入和支出两条线之间的区域，因此在定义\
  \ `path` 元素时，为了绘制这个区域，可以将支出值作为边界，通过一个通用函数迭代 `d` 值（参见代码清单 3-66）。\n\n**代码清单 3-66.**\
  \ `Ch3_09.html`\n\n```\nd3.tsv(\"data_03.tsv\", function(error, data) {\n  ...\n\
  \  var area = d3.svg.area()\n    .interpolate(\"basis\")\n    .x(function(d) { return\
  \ x(d.date); })\n    .y1(function(d) { return y(d[\"income\"]); });\n\n  svg.datum(data);\n\
  \  svg.append(\"path\")\n    .attr(\"class\", \"area below\")\n    .attr(\"d\",\
  \ area.y0(function(d) { return y(d.expense); }));\n\n  svg.append(\"path\")\n  \
  \  .attr(\"class\", \"line\")\n    .attr(\"d\", line);\n});\n```\n\n如果现在加载网页，应该会得到所需的区域（参见图\
  \ 3-23）。\n\n![A978-1-4842-0865-6_3_Fig23_HTML.jpg](img/A978-1-4842-0865-6_3_Fig23_HTML.jpg)\n\
  \n**图 3-23.** 两条趋势线之间区域的初始表示\n\n但所有区域都是绿色的。相反，我们希望其中一些区域是红色的。需要选择由收入和支出线围成的区域，其中收入线位于支出线上方，并排除不符合此方案的区域。在处理需要添加或减去部分区域的区域时，有必要引入\
  \ SVG 裁剪路径（clip path）元素。\n\n裁剪路径是 SVG 元素，可以附加到先前使用 `path` 元素绘制的图形上。裁剪路径描述了一个“窗口”区域，仅显示路径定义区域内的内容。图形的其他区域保持隐藏。\n\
  \n请看图 3-24。可以看到收入线是黑色且较粗的。该线上方的所有绿色区域（在印刷版书籍中为浅灰色）应被裁剪路径隐藏。但需要什么样的裁剪路径呢？需要由收入线上方较低区域边界路径所描述的裁剪路径。\n\
  \n![A978-1-4842-0865-6_3_Fig24_HTML.jpg](img/A978-1-4842-0865-6_3_Fig24_HTML.jpg)\n\
  \n**图 3-24.** 使用裁剪路径区域选择正区域\n\n需要对代码进行一些修改，如代码清单 3-67 所示。\n\n**代码清单 3-67.** `ch3_09.html`\n\
  \n```\nd3.tsv(\"data_03.tsv\", function(error, data) {\n  ...\n  svg.datum(data);\n\
  \  svg.append(\"clipPath\")\n    .attr(\"id\", \"clip-below\")\n    .append(\"path\"\
  )\n    .attr(\"d\", area.y0(h));\n\n  svg.append(\"path\")\n    .attr(\"class\"\
  , \"area below\")\n    .attr(\"clip-path\", \"url(#clip-below)\")\n    .attr(\"\
  d\", area.y0(function(d) { return y(d.expense); }));\n\n  svg.append(\"path\")\n\
  \    .attr(\"class\", \"line\")\n    .attr(\"d\", line);\n});\n```\n\n现在需要对红色区域（在印刷版书籍中为深灰色）执行相同的操作。始终从收入和支出线围成的区域开始，必须消除收入线下方的区域。因此，如图\
  \ 3-25 所示，可以使用描述收入线上方区域的裁剪路径作为窗口区域。\n\n![A978-1-4842-0865-6_3_Fig25_HTML.jpg](img/A978-1-4842-0865-6_3_Fig25_HTML.jpg)\n\
  \n**图 3-25.** 使用裁剪路径区域选择负区域\n\n将其转换为代码，需要在代码中添加另一个 `clipPath`，如代码清单 3-68 所示。\n\n\
  **代码清单 3-68.** `Ch3_09.html`\n\n```\nd3.tsv(\"data_03.tsv\", function(error, data)\
  \ {\n  ...\n  svg.append(\"path\")\n    .attr(\"class\", \"area below\")\n    .attr(\"\
  clip-path\", \"url(#clip-below)\")\n    .attr(\"d\", area.y0(function(d) { return\
  \ y(d.expense); }));\n\n  svg.append(\"clipPath\")\n    .attr(\"id\", \"clip-above\"\
  )\n    .append(\"path\")\n    .attr(\"d\", area.y0(0));\n\n  svg.append(\"path\"\
  )\n    .attr(\"class\", \"area above\")\n    .attr(\"clip-path\", \"url(#clip-above)\"\
  )\n    .attr(\"d\", area.y0(function(d) { return y(d.expense); }));\n\n  svg.append(\"\
  path\")\n    .attr(\"class\", \"line\")\n    .attr(\"d\", line);\n});\n```\n\n最后，两个区域同时绘制，得到所需的图表（参见图\
  \ 3-26）。\n\n![A978-1-4842-0865-6_3_Fig26_HTML.jpg](img/A978-1-4842-0865-6_3_Fig26_HTML.jpg)\n\
  \n**图 3-26.** 差异面积图的最终表示\n\n### 总结\n\n本章展示了如何构建折线图的基本元素，包括坐标轴、轴标签、标题和网格。特别地，你了解了比例尺（scale）、定义域（domain）和值域（range）的概念。\n\
  \n然后，你学习了如何从外部文件（特别是 CSV 和 TSV 文件）读取数据。此外，在开始处理多系列数据时，你学习了如何实现多系列折线图，包括了解完成它们所需的所有元素，如图例。\n\
  \n最后，你学习了如何创建一种特殊类型的折线图：差异折线图。这有助于你理解裁剪路径区域。\n\n在下一章中，你将处理条形图。利用到目前为止学到的关于 D3 的所有知识，你将看到如何使用仅\
  \ SVG 元素来实现构建条形图所需的所有图形组件。更具体地说，你将看到如何使用相同的技术来实现所有可能类型的多系列条形图，从堆叠条形图到分组条形图，包括水平和垂直方向。\n\
  \n"
- "# 4. 使用 D3 绘制条形图\n\n在本章中，你将看到如何使用 D3 库构建最常用的图表类型：条形图。作为第一个示例，你将从一个简单的条形图开始，练习使用标量矢量图形（SVG）元素实现所有组件。\n\
  \n\n\n### 绘制柱状图\n\n为此，我们选择用垂直柱状图来表示一些国家的收入，以便进行比较。作为分类标签，你将使用国家名称。与绘制折线图时一样，你决定使用一个外部文件，例如包含所有数据的逗号分隔值（CSV）文件。然后，你的网页将使用\
  \ `d3.csv()` 函数读取文件中的数据。因此，请将清单 4-1 中的数据写入一个文件，并将其保存为 `data_04.csv`。\n\n**清单 4-1.**\
  \ `data_04.csv`\n\n```\ncountry,income\nFrance,14\nRussia,22\nJapan,13\nSouth Korea,34\n\
  Argentina,28\n```\n\n清单 4-2 展示了一个空白网页，作为开发柱状图的起点。你必须记得在网页中包含 D3 库（更多信息请参见附录 A）。如果你更喜欢使用内容分发网络（CDN）服务，可以将引用替换为：\n\
  \n```\n<script src=\"http://d3js.org/d3.v3.min.js\"></script>\n```\n\n**清单 4-2.**\
  \ `Ch4_01.html`\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
  >\n<script src=\"../src/d3.v3.js\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\n// 在此处添加 D3 代码\n</script>\n</body>\n</html>\n```\n\n首先，定义你希望绘制柱状图的绘图区域大小是一个好习惯。尺寸由\
  \ `w` 和 `h`（宽度和高度）变量指定，但你还需要考虑边距的空间。这些边距值必须从 `w` 和 `h` 中减去，从而适当地限制分配给图表的区域（参见清单\
  \ 4-3）。\n\n**清单 4-3.** `Ch4_01.html`\n\n```\n<script type=\"text/javascript\">\n\
  var margin = {top: 70, right: 20, bottom: 30, left: 40},\n    w = 500 - margin.left\
  \ - margin.right,\n    h = 350 - margin.top - margin.bottom;\nvar color = d3.scale.category10();\n\
  </script>\n```\n\n此外，如果你查看 CSV 文件中的数据（参见清单 4-1），你会发现一系列五个国家及其对应的数值。如果你想用颜色来标识每个国家，就需要定义一个颜色比例尺，正如你已经看到的，这可以通过\
  \ `category10()` 函数来完成。\n\n下一步是定义 x 轴和 y 轴的比例尺。x 轴上没有数值，而是标识国家名称的字符串值。因此，对于这种类型的值，你必须定义一个序数比例尺，如清单\
  \ 4-4 所示。实际上，`rangeRoundBands` 函数将作为参数传入的范围划分为离散的区间，这正是柱状图所需要的。对于 y 轴，由于它表示数值变量，你只需选择一个线性比例尺。\n\
  \n**清单 4-4.** `Ch4_01.html`\n\n```\n<script type=\"text/javascript\">\n...\nvar\
  \ color = d3.scale.category10();\nvar x = d3.scale.ordinal()\n    .rangeRoundBands([0,\
  \ w], .1);\nvar y = d3.scale.linear()\n    .range([h, 0]);\n</script>\n```\n\n现在，你需要使用\
  \ `d3.svg.axis()` 函数将这两个比例尺分配给相应的坐标轴。在处理柱状图时，y 轴上报告的值通常不是名义值，而是它们占总值的百分比。因此，你可以通过\
  \ `d3.format()` 定义一个百分比格式，然后通过 `tickFormat()` 函数将其分配给 y 轴上的刻度标签（参见清单 4-5）。\n\n**清单\
