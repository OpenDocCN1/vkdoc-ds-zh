  \n**图 5-3.** 一个简单的饼图\n\n### 饼图的一些变体\n\n现在，你将对你刚刚创建的基本饼图进行一些更改，说明你可以获得的关于该主题的无限变化可能性中的一部分：\n\
  \n-   处理颜色序列；\n-   对饼图中的扇区进行排序；\n-   在扇区之间添加间距；\n-   仅用轮廓表示扇区；\n-   结合以上所有方法。\n\n\
  #### 处理颜色序列\n\n在前面的例子中，我们在比例尺中定义了颜色，并且在之前的例子中我们使用了 `category10()` 函数。还有其他已定义好的分类颜色比例尺：`category20()`、`category20b()`\
  \ 和 `category20c()`。将它们应用到你的饼图中，看看它们如何影响其外观。清单 5-12 展示了一个使用 `category10()` 函数的案例。对于其他类别，你只需将此函数替换为其他函数即可。\n\
  \n**清单 5-12.** `Ch5_01b.html`\n\n```\nvar color = d3.scale.category10();\n```\n\n\
  图 5-4 显示了这些比例尺之间的颜色变化（在印刷品中反映为不同的灰度色调）。`category10()` 和 `category20()` 函数生成具有交替颜色的比例尺；而\
  \ `category20b()` 和 `category20c()` 则生成颜色渐变缓慢的比例尺。\n\n![A978-1-4842-0865-6_5_Fig4_HTML.jpg](img/A978-1-4842-0865-6_5_Fig4_HTML.jpg)\n\
  \n**图 5-4.** 不同的颜色序列：a) category10, b) category20, c) category20b, d) category20c\n\
  \n#### 对饼图中的扇区进行排序\n\n另一件需要注意的事情是，默认情况下，D3 中的饼图会进行隐式排序。因此，如果你没有像清单 5-13 所示那样通过向\
  \ `sort()` 函数传递 `null` 来显式地提出请求。\n\n**清单 5-13.** `Ch5_01c.html`\n\n```\nvar pie\
  \ = d3.layout.pie()\n//.sort(null)\n.value(function(d) { return d.income; });\n\
  ```\n\n那么，饼图看起来会有所不同，如图 5-5 所示。\n\n![A978-1-4842-0865-6_5_Fig5_HTML.jpg](img/A978-1-4842-0865-6_5_Fig5_HTML.jpg)\n\
  \n**图 5-5.** 一个带有排序扇区的简单饼图\n\n在饼图中，第一个扇区是最大的，然后其他扇区按降序逐渐添加。\n\n#### 在扇区之间添加间距\n\n\
  通常，扇区之间会显示间距，这很容易实现。你只需要对 `path` 元素的 CSS 样式类进行一些更改，如清单 5-14 所示。\n\n**清单 5-14.**\
  \ `Ch5_01d.html`\n\n```\n.arc path {\nstroke: #fff;\nstroke-width: 4;\n}\n```\n\n\
  图 5-6 显示了当扇区被白色间隙隔开时，饼图如何呈现出更令人愉悦的外观。\n\n![A978-1-4842-0865-6_5_Fig6_HTML.jpg](img/A978-1-4842-0865-6_5_Fig6_HTML.jpg)\n\
  \n**图 5-6.** 扇区被白色空间分隔开\n\n\n\n##### 仅用轮廓表示扇区\n\n绘制一个仅由彩色边框界定、内部为空的饼图扇区会稍微复杂一些。你在\
  \ `jqPlot` 中见过类似的情况。修改 CSS 样式类，如清单 5-15 所示。\n\n**清单 5-15.** `Ch5_01e.html`\n\n```css\n\
  .arc path {\n  fill: none;\n  stroke-width: 6;\n}\n```\n\n实际上，这次你不想用特定颜色填充扇区，而是希望定义扇区的边缘用特定颜色着色。因此，你需要在\
  \ SVG 元素的样式定义中，用 `stroke` 属性替换 `fill`。现在，线条被赋予了指示性颜色。但你还需要做另一个改动，这个改动理解起来稍微复杂一些。\n\
  \n你使用每个扇区的边框来指定着色部分，但它们实际上是重叠的。因此，后面的颜色会部分覆盖前面的颜色，并且所有扇区紧密相连看起来不够整洁。最好添加一个小的间隙。这很容易实现，只需为每个扇区应用一个平移变换。每个扇区都应沿离心方向偏离中心一小段距离。因此，每个扇区的平移量都不同，这里你利用了\
  \ `centroid()` 函数的功能，该函数提供了平移的方向（x 和 y 坐标）（参见清单 5-16）。\n\n**清单 5-16.** `Ch5_01e.html`\n\
  \n```javascript\nvar g = svg.selectAll(\".arc\")\n    .data(pie(data))\n    .enter().append(\"\
  g\")\n    .attr(\"class\", \"arc\")\n    .attr(\"transform\", function(d) {\n  \
  \      a = arc.centroid(d)[0]/6;\n        b = arc.centroid(d)[1]/6;\n        return\
  \ \"translate(\" + a +\", \"+b + \")\";\n    })\n\ng.append(\"path\")\n    .attr(\"\
  d\", arc)\n    .style(\"stroke\", function(d) { return color(d.data.country); });\n\
  ```\n\n图 5-7 展示了这些改动如何影响饼图。\n\n![A978-1-4842-0865-6_5_Fig7_HTML.jpg](img/A978-1-4842-0865-6_5_Fig7_HTML.jpg)\n\
  \n**图 5-7.** 未填充扇区的饼图\n\n##### 综合运用\n\n但这还没完。你可以在最后这两个饼图之间创建一个折中方案：让扇区拥有颜色更深的边缘，并用较浅的颜色填充内部。只需定义两个相同但颜色不同的路径即可，如清单\
  \ 5-17 所示。第一个路径将使用一种略微暗淡的均匀颜色，而第二个路径则只有彩色边缘，内部为白色。\n\n**清单 5-17.** `Ch5_01f.html`\n\
  \n```javascript\nvar g = svg.selectAll(\".arc\")\n    .data(pie(data))\n    .enter().append(\"\
  g\")\n    .attr(\"class\", \"arc\")\n    .attr(\"transform\", function(d) {\n  \
  \      a = arc.centroid(d)[0]/6;\n        b = arc.centroid(d)[1]/6;\n        return\
  \ \"translate(\" + a +\", \"+b + \")\";\n    })\n\ng.append(\"path\")\n    .attr(\"\
  d\", arc)\n    .style(\"fill\", function(d) { return color(d.data.country); })\n\
  \    .attr('opacity', 0.5);\n\ng.append(\"path\")\n    .attr(\"d\", arc)\n    .style(\"\
  stroke\", function(d) { return color(d.data.country); });\n```\n\n图 5-8 展示了带有两个路径（分别为扇区和边框着色）的分离式饼图。\n\
  \n![A978-1-4842-0865-6_5_Fig8_HTML.jpg](img/A978-1-4842-0865-6_5_Fig8_HTML.jpg)\n\
  \n**图 5-8.** 饼图扇区着色的另一种方式\n\n### 环形图\n\n饼图之于柱状图，正如环形图之于多系列柱状图。实际上，当你有多个数据集时，你需要为每个系列绘制一个饼图。如果改用环形图，你可以将它们全部表示在一起，并在单个图表中进行比较（参见图\
  \ 5-9）。\n\n![A978-1-4842-0865-6_5_Fig9_HTML.jpg](img/A978-1-4842-0865-6_5_Fig9_HTML.jpg)\n\
  \n**图 5-9.** 一个展示饼图与柱状图在单系列和多系列数据下平行关系的示意图\n\n首先编写清单 5-18 中的代码；我们不会提供任何解释，因为它与前面的示例完全相同。\n\
