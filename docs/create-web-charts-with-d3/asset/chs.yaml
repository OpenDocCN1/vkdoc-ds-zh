  \ 函数提供了一个包含 10 种不同颜色的序列。只需编写清单 3-52 中的代码行，即可为多系列折线图创建一个颜色集。\n\n**清单 3-52.** `Ch3_08a.html`\n\
  \n```\n...\nvar x = d3.time.scale().range([0, w]);\nvar y = d3.scale.linear().range([h,\
