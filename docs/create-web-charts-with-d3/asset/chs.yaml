  \n**图 4-8.** 带标签作为图例的归一化堆叠条形图\n\n### 绘制分组条形图\n\n始终使用 `data_05.csv` 中包含的相同数据，你可以得到另一种表示形式：分组条形图。当你想要关注每个生产部门的个人收入时，这种表示形式最为合适。在这种情况下，你并不关心各部门在总收入中所占的比例。因此，百分比消失了，取而代之的是\
