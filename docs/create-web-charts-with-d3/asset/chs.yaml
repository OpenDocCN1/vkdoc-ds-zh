  \n**图 10-5.** 带有复选框和按钮的自定义图例\n\n如果你点击标有“取消全选”的按钮，所有复选框都将被取消选中，并且对应的序列将在图表中隐藏。随后，该按钮将显示标签“全选”。这次点击它时，所有复选框都将被选中，并且对应的序列将显示在图表中。\n\
  \n### 本章小结\n\n在本章中，你已经了解了如何使用各种控件，例如单选按钮、滑块和复选框，来增加图表的交互性。通过引入控件，我们作为程序员不再是唯一能够直接控制图表属性值的人；通过这些控件，用户也能够做出适当的选择。\n\
  \n此外，你还学习了如何将 jQuery UI 小部件与 D3 库集成，将这些小部件用作控件。\n\n在下一章中，你将通过使用 jQuery UI 小部件作为图表的容器来完成这种集成。这种组合极大地扩展了使用\
  \ D3 库开发和表示图表的可能性。\n\n"
- "# 11. 在 jQuery 小部件中嵌入 D3 图表\n\n在本章中，你将利用在某些特定容器（通常称为小部件，例如选项卡面板和折叠面板）中表示图表的能力，这些容器由包括\
  \ jQuery UI 在内的一些库提供。这使你能够利用 jQuery UI 小部件的巨大潜力，进一步改进图表的表示方式。\n\n结合 jQuery UI 和\
  \ D3 库的优势是多方面的：你可以在网页中占用相同空间的情况下显示更多图表，同时保持页面上下文的干净整洁。另一个优势是 jQuery UI 小部件可以调整大小，甚至用户也可以调整\
  \ D3 图表的大小。\n\n在本章中，你将探讨三个简单的案例，这些案例将使刚才提到的优势变得显而易见。\n\n\n\n### jQuery UI：小部件\n\n\
  除了 D3 库之外，还有另一个库可以帮助你将交互式和图形化对象集成到网页中：jQuery UI。该库提供了一整套工具，例如小部件、主题、特效和交互功能，这些工具能够丰富网页，将其转变为高度交互的\
  \ Web 应用程序。就我们的目的而言，小部件尤其值得关注。这些小型的图形化应用程序可以成为有价值的工具，当将它们添加到网页中时，能使你的图表更具交互性。小部件促进了网页底层程序的交互，并且通常本身就是真正的微型应用程序。在最简单的形式中，小部件表现为表格、手风琴、组合框，甚至是按钮。\n\
  \n与 D3 库一样，如果你想集成其小部件，需要在网页中包含插件文件。在本章将要看到的示例中，我们将使用 jQuery UI 1.10.3 版本。你还必须包含代表主题的\
  \ CSS 文件。这可以通过 Google Hosted Libraries 服务来完成：\n\n```\n<link rel=\"stylesheet\" href=\"\
  http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js\"\
  ></script>\n<script src=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/jquery-ui.min.js\"\
  ></script>\n```\n\n你也可以从官方的 CDN jQuery 网站下载：\n\n```\n<link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css\"/>\n<script src=\"\
  http://code.jquery.com/jquery-1.9.1.min.js\"></script>\n<script src=\"http://code.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n```\n\n如果你更倾向于在本地下载这些库，或者使用本书附带的源代码中的工作区（参见附录 A），你可以按如下方式引用这些库：\n\n\
  ```\n<link rel=\"stylesheet\" href=\"../src/css/smoothness/jquery-ui-1.10.3.custom.min.css\"\
  />\n<script src=\"../src/js/jquery-1.9.1.js\"></script>\n<script src=\"../src/js/jquery-ui-1.10.3.custom.min.js\"\
  ></script>\n```\n\n**注意：** 本书中用于 jQuery UI 小部件的主题是 smoothness。可用主题列表非常广泛，涵盖了多种颜色和形状的组合。这个丰富的列表可以在\
  \ ThemeRoller (http://jqueryui.com/themeroller) 上找到。ThemeRoller 是 jQuery 官方网站上的一个页面，允许你预览小部件，然后从可用的主题中下载你最喜欢的一个。\n\
  \n访问 jQuery UI 官方网站 (http://jqueryui.com/) 时，你会注意到该库提供的小部件数量众多。在此，我将只讨论最常见的示例，特别是那些最有可能被集成到包含图表的页面中的示例。\n\
  \n正如你将在本书中看到的，其中一些小部件将被用作容器，利用其特殊功能，例如调整大小和封装，包括：\n\n- 手风琴\n- 选项卡\n\n其他小部件将用于替换\
  \ HTML 提供的简单控件，因为前者更加先进且功能丰富，包括以下内容：\n\n- 按钮\n- 组合框\n- 菜单\n- 滑块\n\n还有一些小部件将执行指示器的功能。通过这些，你将看到如何集成一个特定的小部件类：\n\
  \n- 进度条\n\n### 手风琴\n\n手风琴小部件是一组可折叠的面板，使网页能够在紧凑的空间内显示大量信息（更多信息，请参考 http://jqueryui.com/accordion/）。\n\
  \njQuery UI 手风琴允许你将相关内容组织到不同的部分（称为面板）中，每次只显示一个面板。每个面板可以容纳一个主题区域，或者，正如你将在后续章节中看到的，不同类型的图表。通过点击每个面板的标签来显示内容，允许用户在不切换页面的情况下从一个面板移动到另一个面板。手风琴的面板会根据用户的选择展开和收缩，这样在任何给定时间只有一个面板显示其内容。\n\
  \n要在页面中获得手风琴小部件，你需要编写的 HTML 结构由一个包含所有面板的外部 `<div>` 标签组成。每个面板依次由一个位于两个 `<h3>` 标签之间的标题和一个\
  \ `<div></div>` 对指定，内容位于其间。清单 11-1 展示了一个包含四个面板的简单手风琴。\n\n**清单 11-1.** `Ch11_01a.html`\n\
  \n```\n<div id=\"accordion\">\n  <h3>第一个标题</h3>\n  <div>第一个内容面板</div>\n  <h3>第二个标题</h3>\n\
  \  <div>第二个内容面板</div>\n  <h3>第三个标题</h3>\n  <div>第三个内容面板</div>\n  <h3>第四个标题</h3>\n\
  \  <div>第四个内容面板</div>\n</div>\n```\n\n在 JavaScript 代码中，你需要添加清单 11-2 中的代码片段来获得一个手风琴小部件。\n\
  \n**清单 11-2.** `Ch11_01a.html`\n\n```\n$(function() {\n  $( \"#accordion\" ).accordion();\n\
  });\n```\n\n图 11-1 展示了我们的手风琴。\n\n![A978-1-4842-0865-6_11_Fig1_HTML.jpg](img/A978-1-4842-0865-6_11_Fig1_HTML.jpg)\n\
  \n**图 11-1.** 手风琴由可折叠的面板组成，适合在有限的空间内包含信息\n\n但是，这还不够。最好能够控制手风琴的样式。这可以通过添加清单 11-3\
  \ 中给出的代码来实现。\n\n**清单 11-3.** `Ch11_01a.html`\n\n```\n<style type=\"text/css\">\n\
  .ui-accordion {\n  width: 690px;\n  margin: 2em auto;\n}\n.ui-accordion-header {\n\
  \  font-size: 15px;\n  font-weight: bold;\n}\n.ui-accordion-content {\n  font-size:\
  \ 12px;\n}\n</style>\n```\n\n结果如图 11-2 所示。\n\n![A978-1-4842-0865-6_11_Fig2_HTML.jpg](img/A978-1-4842-0865-6_11_Fig2_HTML.jpg)\n\
  \n**图 11-2.** 通过修改 CSS 样式属性，你可以随心所欲地改变手风琴的外观\n\n\n\n#### 标签页\n\n在功能上与折叠面板非常相似的一个部件是带有标签页的面板。在这里，每个面板都是独立的，但顶部有多个标签页，通过不同的标题进行标识。尽管如此，这个部件提供了在有限空间内展示大量信息的可能性，用户每次只能选择查看一个标签页的内容。更重要的是，它失去了面板垂直展开的特性（更多信息，请参考\
  \ [`http://jqueryui.com/tabs/`](http://jqueryui.com/tabs/)）。\n\n要在网页中获得一个标签页部件，你需要编写的\
  \ HTML 结构比之前的稍微复杂一些。标题以无序列表 `<ul>` 的形式给出，其中每个列表项 `<li>` 必须引用一个锚点标签 `<a>`。每个标签页的内容都包含在一对\
  \ `<div></div>` 中，其 `id` 属性与锚点标签中的引用相对应（参见清单 11-4）。\n\n**清单 11-4.** `Ch11_01b.html`\n\
  \n```\n<div id=\"tabs\">\n  <ul>\n    <li><a href=\"#tabs-1\">第一个标题</a></li>\n \
