  \ 美元 | 2,117,500 美元 |\n| [i] 每台冷柜所需的平均例行维修次数（来源：模型输入） | 3 | 4 | 5 |\n| [j] 每次例行维修的收费（来源：模型输入）\
  \ | 45 美元 | 50 美元 | 55 美元 |\n| [k] 维修期间预计售出的零件数量（来源：计算：[g]/[i]） | 744 | 1,400 |\
  \ 1,925 |\n| [l] 通过新冷柜产生的潜在额外零件收入（来源：计算：[j]/[k]） | 33,480 美元 | 70,000 美元 | 105,875\
  \ 美元 |\n| [m] 冷柜服务的年均市场容量（来源：模型输入） | 13,500,000 美元 | 15,000,000 美元 | 16,500,000\
  \ 美元 |\n| [n] 每台冷柜的平均服务收入（来源：计算：[m]/[c]） | 1,500 美元 | 1,667 美元 | 1,834 美元 |\n| [o]\
  \ 通过新冷柜产生的额外服务收入（来源：计算：[n]*[g]） | 372,000 美元 | 583,450 美元 | 706,090 美元 |\n| [p]\
  \ 年度总收益（来源：计算：[h]+[l]+[o]） | 4,455,480 美元 | 2,403,450 美元 | 2,929,465 美元 |\n\n对正在考虑的举措进行预期收益的量化，使组织能够将特定时间段的成本与收益进行比较，并做出明智的投资决策。\n\
  \n虽然用于计算收益范围的三点法非常有用，但在某些情况下，组织需要更高的粒度，并以特定的概率计算上限和下限。蒙特卡洛方法可用于运行数百甚至数千个这样的场景。通常使用商业软件工具来运行这些模拟，使组织能够确定风险和预测收益。这种方法可应用于投资规模巨大或输入变量数量众多且数值范围显著的情形。在决定哪种方法适合组织时，应将模拟软件的成本以及在特定概率水平上预测收益范围的需求，与执行三点法的简便性和更快的速度进行权衡。\n\
  \n图 3-17 是一个软件包输出的示例。该软件在为一个潜在举措建立的商业案例模型基础上运行了蒙特卡洛模拟。\n\n![A978-1-4842-0986-8_3_Fig17_HTML.gif](img/A978-1-4842-0986-8_3_Fig17_HTML.gif)\n\
  \n**图 3-17.** 商业案例的蒙特卡洛模拟输出示例\n\n如图 3-17 所强调的，这种方法有助于以特定的置信水平识别预测收益的上限和下限。通过将此置信水平调整到可接受的概率，组织可以在做出明智的投资决策之前，看到可能收益的下限和上限。\n\
  \n## 其他需要权衡的因素\n\n随着我们为这类项目构建商业案例，我们可能会开始发现与为更新的数据管理系统创建企业级平台相关的额外成本。同时，由于商业案例的迫切性，我们可能也会看到对面向未来状态的架构有更快上市时间的要求。\n\
  \n第一个挑战可能是找到构建和使用所考虑技术足迹所需的技能型人才。例如，与 `Hadoop` 相关的数据科学家仍然稀缺且昂贵。幸运的是，如今有多种方法可以在 `Hadoop`\
  \ 中访问和分析数据，包括使用 `SQL` 接口和流行的预测分析工具。对于 `ETL` 卸载，许多常见的 `ETL` 工具现在都已完全支持 `Hadoop`。\n\
  \n对更快企业级部署和运营支持的需求，也可能促使我们考虑评估购买预集成的服务器、存储和软件单元，作为自助式（`DIY`）配置的替代方案。例如，针对不断演变的信息架构中典型的各种数据管理系统，可用的设备种类越来越多。\n\
  \n许多 `Hadoop` 集群开始时，在实验室或生产环境中的类似小型配置中只使用相对较少的节点。随着对更大集群的需求增加，运营工作量和相关风险也随之上升。组织可能会在宝贵资源上受到严重制约，并迅速达到那个临界点。图\
  \ 3-18 说明了这一挑战。\n\n![A978-1-4842-0986-8_3_Fig18_HTML.gif](img/A978-1-4842-0986-8_3_Fig18_HTML.gif)\n\
  \n**图 3-18.** 大数据环境增长中的自助式资源考量\n\n另一个可以考虑的选项是云部署策略。与构建自己的系统相比，基于云的解决方案似乎相当简单，如图\
  \ 3-19 所示。采用基于云的方法可以带来显著的成本和上市时间优势。\n\n![A978-1-4842-0986-8_3_Fig19_HTML.gif](img/A978-1-4842-0986-8_3_Fig19_HTML.gif)\n\
  \n**图 3-19.** 自助式部署与基于云的大数据环境的运营影响\n\n能够根据业务需求快速扩展或缩减，以及通过使用自助服务方法快速部署的能力，可能极具吸引力。权衡因素通常是技术性的，尤其是在大型数据集可能位于与基于云的解决方案相距甚远的位置，并且需要利用所有数据源共同寻找业务解决方案的情况下。此时，关于网络带宽和灵活性的讨论会首先浮现在脑海中，而解决这些问题相关的成本也变得更加明显。\n\
  \n## 我们仅仅是开了个头\n\n我们才刚刚开始我们的商业案例。在这一点上，我们现在可能有了更强烈的信念，认为我们可以证明一个或多个项目的合理性。而这些项目将推动定义和部署未来状态架构的需求。然而，我们也意识到，在收集到更多信息后，我们需要在方法论后续步骤中重新审视该商业案例。\n\
  \n既然已经确定了一些业务驱动力，并且我们将它们与优先举措对齐，接下来我们将要确定所需的潜在数据源。同时，我们还将更深入地了解我们的报表、查询和分析需求，以及数据将如何帮助回答我们在本章中识别出的一些业务挑战。\n\
  \n\n"
- "# 大数据与物联网的业务信息映射\n\n至此，我们已按照成功方法论，为一个潜在项目定义了宽泛的业务与 IT 愿景。既然我们已将愿景与更详细的战略及对组织目标的更深入理解相融合，现在应该对项目的潜在业务目标有了更细致的认识。利益相关者和潜在赞助方也正在被识别。然而，我们距离理解那些将影响现有信息架构的必要数据流与处理变革仍有相当距离。\n\
  \n在本章中，我们将把支撑业务运营所需的关键绩效指标（KPI）映射回其数据源。我们还将开始了解在数据方面存在的差距、所需的分析工作，以及数据如何呈现给业务。我们的业务信息映射（或本章中有时简称的\
  \ BIM）将推动我们在成功方法论下一阶段重新设计技术架构。但在此，你可能会问为什么要开发一系列映射图来达成此目的。\n\n数据流的映射将在多个方面帮助我们。有句老话说：“一图胜千言”。图形化表达能够简化复杂思想的沟通。当我们用手指在地图上追踪物体在两点之间的移动路径时，这一点尤为明显。数千年来，我们一直用这样的地图来指引旅程。\n\
  \n在某种程度上，我们之所以能利用地图理解世界的复杂性，得益于大脑天生善于处理眼睛收集的二维图像。事实上，今天的神经科学家认为，超过一半的大脑功能是用于处理视觉信息的。这就是为什么我们能如此轻松地理解并发现模式。\n\
  \n可以说，我们的大脑已经适应了以这种方式处理大数据分析的可视化输出。这种输出通常以图形形式呈现。例如，比较随机选择与系统选择结果的增长图，能帮助我们更好地理解预测的有效性。\n\
  \n相比之下，语言在人类进化史上出现得相对较晚。而理解书面语言，更是我们在学校经过多年训练才适应。因此，你能够理解我们在本书中描述的方法论与细节（我们期望如此）。\n\
  \n多维图像比单一维度的文本能够传达多得多的信息。它们在打破因语言和文化造成的误解壁垒方面极为有效。当我们使用普遍接受和认可的符号与图形图标时，这一点尤其突出。因此，在本章中，我们将采用一个公认的数据流映射标准：Yourdon\
  \ / DeMarco。我们将借鉴（无论字面还是比喻意义上）这一标准来提供可视化分析。\n\n由于本书关注的是大数据与物联网的架构，我们将效仿物理世界中的建筑师的做法。我们将创建目标受众能够理解的图像，并以易于吸收的格式传达相关信息。\n\
  \n图 4-1 展示了我们在成功方法论中当前所处的阶段。同时勾勒出本章涵盖的关键主题。\n\n![A978-1-4842-0986-8_4_Fig1_HTML.jpg](img/A978-1-4842-0986-8_4_Fig1_HTML.jpg)\n\
  \n*图 4-1. 成功方法论中的业务信息映射阶段*\n\n本章分为两部分。第一部分主要关注开发当前状态的业务信息映射。第二部分则阐述定义未来状态并将其映射到代表这一未来的\
  \ BIM 上的过程。\n\n## 映射当前状态\n\n在提供如何创建当前状态业务信息映射的示例之前，我们首先介绍一些背景知识：Yourdon / DeMarco\
  \ 符号体系，这套符号通常用于定义我们在此使用的数据流图中的组件。这将帮助你理解本章各图表的含义，同时为你日后自行开发的映射建立标准。\n\n我们还将再次审视方法论前几个阶段的输出成果如何帮助我们构建业务信息映射。我们会回顾一个之前已在方法论中揭示的理论业务场景，并利用已获得的背景知识来开发代表当前状态的\
  \ BIM。\n\n\n\n### 数据流图基础\n\n数据流图（DFD）这一名称恰如其分，因为它用于以图形方式表示系统的输入及由此产生的输出。它还可用于说明关键流程和数据存储。爱德华·尤登和汤姆·德马科创建了一组标准对象，这些对象是典型数据流图中使用的组件。\n\
  \n根据尤登/德马科的定义，DFD 的四个基本组件描述如下：\n\n- **输入/输出**：系统外部但与系统交互的个人、组织或系统。\n- **流程**：因特定原因执行的活动或功能。它可以是手动的，也可以是计算机化的。每个流程应仅执行一项活动。\n\
  - **数据存储**：永久存储的数据集合。\n- **数据流**：在上述任何组件之间移动的单个数据项或信息的逻辑集合。\n\n图 4-2 展示了使用尤登/德马科表示法绘制的这四个组件的符号或图标。\n\
  \n![A978-1-4842-0986-8_4_Fig2_HTML.gif](img/A978-1-4842-0986-8_4_Fig2_HTML.gif)\n\
  \n**图 4-2.** 尤登/德马科表示法\n\nDFD 用于直观地表示数据来自何处、系统如何处理数据以及处理产生的输出。这些系统可能已存在（当前状态）或处于规划阶段（未来状态）。系统分析师通常首先与业务分析师和架构师会面，然后创建\
  \ DFD 图。图表创建后，他们会请同样的人员验证这些图是否反映了现实情况或预期的结果。\n\n以下是创建数据流图的最佳实践：\n\n- 一系列数据流总是起始或终止于输入/输出，并起始或终止于数据存储。反之，这意味着一系列数据流不能起始或终止于流程。\n\
  - 一个流程必须同时有数据流入和流出。\n- 所有数据流都必须用正在交换的精确数据来标记。\n- 流程名称应以动词开头，以名词结尾。\n- 数据流应命名为描述性名词。\n\
  - 数据存储必须至少有一个数据流入。\n- 数据流不能在输入/输出和数据存储之间直接流动，中间必须有流程。\n- 数据流不能在两个数据存储之间直接流动，中间必须有流程。\n\
  - 为避免线条交叉，输入/输出和数据流可以在数据流图中重复，但流程不能重复。\n\n开发 DFD 的第一步是创建一个上下文图，并以正在建模的系统命名。有时，该图被称为零级（0\
  \ 级）图，因为没有更高层次的抽象。它将整个系统表示为一个单一的流程，以及与该系统交互的输入/输出之间的数据流。与其他定义的低层级流程（如 1 级、2 级等）不同，上下文流程通常是系统的名称。低层级流程的名称通常以类似动词的标识符开头。通常，上下文图不会描绘数据存储，因为它们位于系统内部。\n\
  \n图 4-3 展示了一个上下文图或 0 级 DFD 的典型示例。\n\n![A978-1-4842-0986-8_4_Fig3_HTML.gif](img/A978-1-4842-0986-8_4_Fig3_HTML.gif)\n\
  \n**图 4-3.** 标题为“发布者”的上下文（0 级）DFD 示例\n\n你可以将上下文流程圆环想象成一个通向正在分析的基础系统的检修孔。在这个抽象的最高层级，数据流就像电缆一样，从检修孔消失并再次出现。为了进一步理解上下文流程内部进行的通信和处理，我们需要至少下降一层，进入我们的地下世界，沿着数据流电缆前行。下降的第一层称为\
  \ 1 级。在这里，我们可以追踪从 0 级检修孔进出的数据电缆，观察它们经过哪些额外的子流程。这些子流程本身就像检修孔一样，可能下降到更详细的层级。从这些地下检修孔中出来的一些数据电缆将通往数据存储或“水库”（文件和数据库）。这些“水库”可能由一条或多条数据电缆连接到其他流程。\n\
  \n例如，如果我们把图 4-3 中的上下文 DFD 分解成一个 1 级 DFD，它可能看起来像图 4-4 所示的图表。\n\n![A978-1-4842-0986-8_4_Fig4_HTML.gif](img/A978-1-4842-0986-8_4_Fig4_HTML.gif)\n\
  \n**图 4-4.** 标题为“发布者”的（1 级）DFD 示例\n\n到目前为止，我们介绍了通用的尤登/德马科概念。现在，我们引入关键绩效指标（KPI）符号，作为我们业务信息地图中一个极其重要的表示法。回想一下，KPI\
  \ 是业务分析师或业务流程做出业务决策所需的关键指标。KPI 通常出现在高管仪表盘中。在图 4-5 中，我们说明了如何在 BIM 图中表示它们。\n\n![A978-1-4842-0986-8_4_Fig5_HTML.gif](img/A978-1-4842-0986-8_4_Fig5_HTML.gif)\n\
  \n**图 4-5.** 在 BIM 图中表示的关键绩效指标\n\n\n\n### 了解当前状况\n\n在第 3 章中，我们描述了一个流程，其中包括了解业务需求、识别关键成功因素，以及了解解决当前业务问题所需的衡量标准和关键绩效指标（KPI）。在创建业务信息图之前，我们会先经历这个流程。为了给创建业务信息图奠定基础，我们将以虚构的豪华汽车制造商\
  \ Lux Motor Cars（LMC）为例，说明如何收集这类信息。\n\nLMC 在全球销售精美汽车。在美国，其销售的 70%至 75%的新车是通过内部租赁公司\
  \ LMC Lease 提供融资的。租赁车辆的比例正在增长。使用这种融资方案的客户喜欢以下特点：\n\n- 低成本、可预测，且无需支付任何“预付”金。换句话说，租赁公司实际上购买了车辆，并以固定价格在固定期限内将其有效租赁给承租人，从而平滑了车辆折旧和资本支出的实际利息。\n\
  - 制造商通过新车保修承担了重大维修风险。\n\n为了确保车辆在市场上具有竞争力定价，LMC 将新车销售的毛利率维持在很低的水平。这一策略是可行的业务方法，因为车辆质量很高，由此产生的保修成本远低于行业平均水平。由于车辆使用时间长，LMC\
  \ 最终通过在定期维护中消耗的车辆配件和专有润滑剂上保持较高利润率，获得了大部分利润。LMC 知道，保持利润增长、降低保修成本的最佳方式是鼓励车主使用 LMC\
  \ 品牌产品主动进行保养（保持液位充足、按时更换机油滤清器等）。因此，行业数据显示，LMC 在其提供的每类车辆中，拥有最低的总拥有成本。\n\n虽然租赁数字持续增长，但\
  \ LMC 管理层却看到了一个令人不安的趋势。不仅 LMC 在美国的客户质量评级在下降，保修成本也在上升。进一步分析发现，在美国由 LMC Lease 拥有的车辆导致了保修成本的意外增加，同时承租人的满意度评分也在下降。\n\
  \n利用信息发现工具筛选美国所有 LMC Lease 车辆的服务记录后，发现了以下信息：\n\n- 车辆应进行定期保养的时间与实际进行保养的时间之间存在很大差异。换句话说，承租人似乎不像其他\
  \ LMC 车主那样严格遵守保养计划。\n- LMC Lease 车辆在“检查发动机”灯亮起后的行驶里程数显著更高。似乎承租人没有认真对待“检查发动机”灯。\n\
  \n承租人似乎更倾向于将 LMC Lease 车辆视为租赁车。对索赔金额最高的承租人进行访谈后，发现了以下情况：\n\n- 承租人认为自己非常忙碌，并表示他们看到“保养到期”灯亮后会迅速致电\
  \ LMC 经销商的服务部门。然而，当面临立即进行定期保养还是等待安排代步车时，他们选择了等待。显然，他们看重的是车辆持续可用。\n- 最昂贵的保修索赔来自“检查发动机”灯亮起且驾驶员表示感觉车辆运转不太正常的租赁车辆。但同样，当他们致电要求服务时，他们选择等待直到有代步车可用。他们不想租用替代车辆，尤其是在不知道需要租用多久的情况下。\n\
  \n现在让我们回顾一下迄今为止收集到的信息。两个关键的 LMC 业务目标凸显出来：降低美国不断攀升的保修成本，以及提高承租人中的车辆质量评级。\n\n经过进一步讨论，我们发现保修支持组织认为，如果\
  \ LMC Lease 的车辆配备了一个能够报告问题并在问题报告时自动安排维修的远程信息处理系统，30%至 50%的保修索赔成本是可以避免的。这样的系统可以使服务团队更好地优化维修车间的员工配备水平。车队管理团队可以更好地优化代步车的数量，并根据需要适当补充租车。最后，公司从收集的市场研究数据中了解到，客户愿意为此类服务支付溢价。\n\
  \n业务部门显然希望跟踪多个 KPI。这些 KPI 包括终身保修成本、终身车辆盈利能力、服务安排等待时间、代步车可用性和利用率、服务车间盈利能力、高级服务盈利能力以及客户满意度。\n\
  \nLMC 目前还无法实施这样的计划。他们运行此类项目所需的大部分数据目前尚不可用，尽管业务部门对此尚未完全了解。因此，接下来我们将构建描述当前状态的业务信息图，以便所有人都能更好地理解业务这一部分如何利用现有数据运作。\n\
  \n好消息是，LMC 已准备好进行远程信息处理方面的投资。我们将在本章后面探讨这项投资的潜在影响。届时，我们将研究当这些数据在未来状态下可用时，业务流程可以如何改变。\n\
  \n\n\n### 构建当前状态业务信息地图\n\n`BIM`通常是通过了解业务的高管、分析师、数据科学家以及`IT`部门（尤其是在业务分析师和数据科学家不确定数据可能来源的情况下）之间的协作来开发的。业务部门的高管提供了关于他们如何利用所提供的数据做出决策的重要信息。\n\
  \n**注意：**`IT`部门可能希望提供他们在当前状态下对数据流的看法。这没问题。但是，在许多组织中，业务部门会创建额外的报告，其中包含未记录在案的数据源。因此，我们应该采访所有相关方，以真正了解数据的当前状态及其使用方式。\n\
  \n你可能会问，为什么我们要在绘制未来状态图之前，先为当前状态构建`BIM`。当前状态为我们提供了一个基线理解，即当前可用的数据源以及它们是如何被利用的。这种理解可以包括数据存储的类型、当前环境中的数据集成方法，以及报告和分析能力。我们将在定义未来状态时，以此基线为基础进行构建。\n\
  \n在我们的`LMC`示例中，我们需要与来自公司多个业务领域的关键高管和业务分析师进行交谈。通过研讨会进行这种发现是一种常见的方法。必须从产品开发、租赁、保修支持、经销商服务以及车队管理业务部门收集信息。我们需要了解当前的数据馈送在决策时如何被使用、它们提供了哪些智能信息，以及当前的局限性。\n\
  \n为了在我们的第一次`BIM`实践中取得良好的开端，让潜在的业务发起人启动会议是一个好主意。对于像`LMC`这样的公司，我们可能希望让`车辆产品开发副总裁`或类似职位的人来开场讨论。这有助于凸显这项工作的重要性。\n\
  \n在研讨会或访谈期间，我们将首先验证组织内不同部门如何看待这个机会和当前状况。对于`LMC`，以下是我们可能发现内容的示例：\n\n-   从我们的租赁团队访谈中，我们发现，虽然我们了解客户的信用度，但我们也发现许多承租人将租赁等同于“汽车即服务”。一个常见的要求是以溢价提供延长服务保修，保证在需要时能提供代步车。\n\
  -   我们的保修支持团队认为，车辆中的传感器日志是控制成本的关键。目前，车上的车载系统会提醒驾驶员可能存在的问题以及该怎么做（例如，需要保养、检查发动机等）。传感器产生的错误代码存储在车辆中，当车辆进行保养时，这些数据会被下载。他们认为，通过实时处理数据，可以避免重大的车辆故障并降低服务成本。\n\
  -   服务部门认为，缺少代步车会延误及时维修。他们与客户的唯一接触点是车辆被送来维修的时候。他们认为，更及时的服务也能降低保修成本。\n-   车队管理部门只衡量代步车的使用率。由于该百分比很高（例如，95%），他们觉得自己提供了优化良好的服务。\n\
  -   高管们表示，保修支持方面缺乏可见的`KPI`尤其令人担忧。\n\n现在，让我们看看`LMC`维护与保修（`M&W`）系统当前的运作方式。我们首先从最高层级（第\
  \ 0 级）来表示当前状态的业务信息地图。首先，我们识别潜在的数据源：\n\n-   **传感器**：传感器安装在由`LMC Lease`拥有的`LMC`汽车中。`M&W`系统从传感器收集数据，但不提供反馈。\n\
  -   **车库**：车库代表 LMC 经销商的服务部门。`M&W`系统与各个服务部门交互，但其运作方式超出了本分析的范围。\n-   **代步车**：这代表我们车队管理的代步车数据。虽然代步车可用性不足是一个问题，但该部门的运作方式也超出了本分析的范围。为完整起见，我们将展示其与`M&W`系统的关系。\n\
  -   **承租人**：这代表`LMC Lease`车辆的驾驶员/承租人。`LMC Lease`中驾驶车辆的客户显然是`LMC`业务的核心，但仅处于本分析的边缘。同样，为完整起见，我们将展示其与`M&W`系统的关系。\n\
  -   **利益相关者**：这代表关心`M&W`系统性能的`LMC`高管。我们将指出，目前并没有太多`KPI`反馈给这些利益相关者。\n\n这些数据源在图 4-6\
  \ 中表示。此时，我们不会说明`M&W`系统内部的数据存储（例如车辆数据库或来自车载电子设备的数据）。\n\n![A978-1-4842-0986-8_4_Fig6_HTML.gif](img/A978-1-4842-0986-8_4_Fig6_HTML.gif)\n\
  \n**图 4-6.** 名为“LMC 维护与保修系统”的当前状态上下文（第 0 级）BIM 的局部视图\n\n接下来，让我们评估数据如何从这些源流出。我们在图\
  \ 4-7 中表示以下数据流：\n\n![A978-1-4842-0986-8_4_Fig7_HTML.gif](img/A978-1-4842-0986-8_4_Fig7_HTML.gif)\n\
  \n**图 4-7.** 名为“LMC 维护与保修系统”的已完成当前状态上下文（第 0 级）BIM\n\n-   `传感器`通过仪表盘下的汽车诊断扫描端口发送批量诊断日志（批量诊断）。\n\
  -   `传感器`发送实时数据，这些数据在`M&W`系统的车载电子设备部分进行处理（RT 传感器测量值）。\n-   `承租人`和/或驾驶员以实时指示灯和仪表盘的形式，从`M&W`系统的车载电子设备部分接收信息（RT\
  \ 驾驶员指示器）。\n-   `承租人`和/或驾驶员通过进行汽车维修调度协商，与`M&W`系统交换信息（承租人调度）。\n-   `承租人`和/或驾驶员接收维修发票的非保修部分（承租人发票）。\n\
  -   `代步车队管理`在执行业务过程中，与`M&W`系统交换信息以进行代步车调度协商（代步车调度）。\n-   `代步车队管理`向`M&W`系统发送代步车发票以进行成本核算（代步车发票）。\n\
  -   `车库`从`M&W`系统接收车辆数据，包括诊断结果和服务建议（服务数据）。\n-   `车库`与`M&W`系统交换信息，并进行服务调度协商（车库调度）。\n\
  -   `车库`向`M&W`系统发送完整的维修发票，包括保修和非保修部分（总发票）。\n\n如你所见，我们在一个相当简单的图中展示了所有这些数据流。业务信息地图开始讲述我们的当前维护与保修系统是如何运作的。现在，我们准备在更深入的层面上探索该系统的运作方式。\n\
