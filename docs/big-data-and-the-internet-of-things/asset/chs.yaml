  \n图 4-10.  \n完成的当前状态（第 1 层）“LMC M&W 系统”BIM\n\n## 定义未来状态\n\n从我们当前的业务信息图可以清楚地看到，我们无法获取之前确定的、优化运营汽车保养与保修业务所必需的关键绩效指标（KPI）。在我们召集的团队的协助下定义未来状态时，我们将确定数据必须如何流动，以便向业务提供那些至关重要的缺失信息。\n\
