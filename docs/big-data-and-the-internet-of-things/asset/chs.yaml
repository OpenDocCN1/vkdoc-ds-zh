  通过为所有预测的 IT 和业务收益考虑三个数据点，组织可以制定出具有合理分布范围的综合预测收益以供评审，如图 3-16 所示。\n\n![A978-1-4842-0986-8_3_Fig16_HTML.gif](img/A978-1-4842-0986-8_3_Fig16_HTML.gif)\n\
  \n**图 3-16.** 三种场景下的示例预测收益——保守、务实和积极\n\n### 业务价值\n\n识别和量化业务价值的过程与上一节描述的 IT 价值量化过程类似。然而，其类别和影响/价值却显著不同，并且在很大程度上更依赖于行业业务驱动因素和公司业务举措。业务价值往往远高于\
  \ IT 价值，是决策过程中的主要驱动因素。\n\n通常情况下，大部分业务收益可以再次归纳为几个类别，正如本章前面所述。以下是一些代表性收益的列表，这些收益可以作为业务案例制定过程的一部分进行量化：\n\
  \n*   推出新业务服务的能力\n*   对收入的影响\n*   成本规避与削减\n*   降低业务风险\n*   计划内和计划外非计划停机对业务的影响\n\
  *   提高对客户及市场需求的敏捷性和响应能力\n*   由于 IT 与组织业务之间的战略伙伴关系而产生的额外组织协同效应\n\n接下来，我们将根据我们在几个行业中观察到的大数据和物联网常见举措，来看几个例子。我们将提供示例的行业是零售业和制造业。\n\
  \n如今，几乎所有的大型零售商都在投资全渠道战略。这种方法将实体店和网店的管理与分析无缝衔接，以创造无缝的购物体验。由于网络日志的存在以及通过社交媒体表达的购物者情绪的重要性，这些解决方案通常被设计为将\
  \ Hadoop 作为信息架构的一部分。当然，各个门店的交易记录在关系数据库中，数据仓库也是其中的一部分。未来的信息架构状态可以积极影响线上收入和实体店业务，这得益于供应链和运营效率的提升。表\
  \ 3-5 提供了一个计算示例，描述了可能对在线销售产生的业务影响：\n\n**表 3-5.** 某零售商在线销售影响的详细计算示例\n\n| 说明 | 保守\
  \ | 务实 | 积极 |\n| --- | --- | --- | --- |\n| `[a]` 该部门的年度销售额（来源：模型输入。最新年报） | $2,970,000,000\
  \ | $3,300,000,000 | $3,630,000,000 |\n| `[b]` 通过门店品牌销售的百分比（来源：模型输入。根据研讨会记录） | 36%\
  \ | 40% | 44% |\n| `[c]` 门店中品牌产品的销售额（来源：计算：`[a]*[b]`） | $1,069,200,000 | $1,320,000,000\
  \ | $1,597,200,000 |\n| `[d]` 门店销售商品的网络销售百分比（来源：模型输入。根据研讨会记录） | 18% | 20% | 22%\
  \ |\n| `[e]` 该部门的在线销售收入（来源：计算：`[c]*[d]`。同时基于最新的第一、第二季度业绩和上一年年报。该部门贡献了 71%至 78%的在线商务。这也与预测的销售收入一致。）\
  \ | $192,456,000 | $264,000,000 | $351,384,000 |\n| `[f]` 由技术驱动的业务影响带来的预期增长（来源：模型输入）\
  \ | 11% | 12% | 13% |\n| `[g]` 由技术创新驱动的数字销售影响预测（来源：计算：`[e]*[f]`） | $20,785,248 |\
  \ $31,680,000 | $46,382,688 |\n\n类似地，其他业务收益可以按年度量化，然后预测未来三到五年的情况，以展示未来架构状态的真正影响。\n\
  \n\n\n在我们的第二个示例中，一家工业餐厅设备制造商正在评估分析冷柜传感器数据的价值。该制造商的业务部门认为，他们可以利用这项技术来改善当前冷柜的销售，并增加维修业务的收入。同时，他们还相信，在此过程中可以延长设备的使用寿命，从而提升客户满意度。表格\
  \ 3-6 概述了其业务影响。\n\n**表 3-6.** 通过冷柜服务实现业务影响的详细计算示例\n\n| 描述 | 保守型 | 务实型 | 激进型 |\n\
