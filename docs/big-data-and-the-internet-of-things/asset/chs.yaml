  \n图 7-8. 路线图高管演示——当前状态信息架构图\n\n图 7-9 用于说明基础设施必须如何改变。有时，最有效地描述这种改变的方法是创建一个构建幻灯片，说明向未来状态的逐步过渡，并与关键项目阶段保持一致。\n\
  \n![A978-1-4842-0986-8_7_Fig9_HTML.gif](img/A978-1-4842-0986-8_7_Fig9_HTML.gif)\n\
  \n图 7-9. 路线图高管演示——未来状态信息架构图\n\n我们可能预料到，听众可能会对这个项目的复杂性和其他方面感到震惊。我们的下一张幻灯片（图 7-10）说明我们已经考虑了许多风险，并制定了风险缓解计划。除了寻求他们对我们的计划的信心之外，在讨论这一点时，我们可能开始寻求对培训计划和顾问需求的认同。我们还可以利用这次讨论来开启关于所有迄今为止对计划的反对意见的对话，并将这些问题摆到桌面上。\n\
  \n![A978-1-4842-0986-8_7_Fig10_HTML.jpg](img/A978-1-4842-0986-8_7_Fig10_HTML.jpg)\n\
  \n图 7-10. 路线图高管演示——已识别的风险与计划缓解措施\n\n高管演示必须在掌握项目资金的人面前建立并维持可信度。我们力求在每一步都确认我们有一个可靠的计划。如果我们未能建立这种信任，项目很可能无法获得批准。因此，演示文稿背后的项目计划中必须有足够的细节，以便我们能够自信地回答将会出现的问题。\n\
  \n我们现在应该准备用“下一步”讨论来结束我们的演示。我们将请求项目资金，并指出任何阻碍因素。在结尾部分，我们还用来描述我们已预见的任何其他下一步措施，部分目的是展示我们对获得批准的信心。当然，我们会记下高管提出的任何其他步骤，并将他们的想法纳入我们的计划。\n\
  \n描述下一步措施的幻灯片如图 7-11 所示。你可能注意到，我们在这张幻灯片上重申了预期的增量业务收益以及请求的资金金额。继续强调潜在的投资回报率，有助于传达这样的信息：虽然有些人可能认为项目成本高昂，但它将为组织带来巨大的价值。\n\
  \n![A978-1-4842-0986-8_7_Fig11_HTML.jpg](img/A978-1-4842-0986-8_7_Fig11_HTML.jpg)\n\
  \n图 7-11. 路线图高管演示——结束语幻灯片\n\n\n\n## 获得批准与过渡阶段\n\n至此，我们应该相信我们的路线图演示已准备好接受高管评审。我们已做好了充分准备，该计划对我们而言似乎完全可行。我们也已将详细计划记录在案，在演示过程中回答问题时可以依赖其中的信息。那么，可能会出什么问题呢？\n\
  \n除非该倡议是 CEO 直接下达的任务，否则我们在呈现路线图时很可能面对一群高度怀疑的听众。高管们可能极度厌恶风险，并且可能认为大数据和物联网项目只是被过度炒作、成本高昂的计划，是他们想要避免的。也许，组织内部在部署此类创新项目方面有过不良记录。高管们还可能有一些我们未曾意识到的其他热点问题和业务顾虑。\n\
  \n我们可以采取几个步骤来为高管会议做好更充分的准备。首先，我们应该与项目发起人一起审查我们的内容，并就我们准备的材料征求他们的指导。我们还可以与将出席会议的部分高管或其直接下属一起审查内容，以征求他们的反馈（包括他们已有的或预计会提出的任何顾虑）。如果我们能在会议前与一些决策者会面，我们也可以争取他们尽早对项目表示支持。\n\
  \n如果我们被告知高管听众需要更多直观的证据来理解项目将提供的价值，我们可以构建一个演示，展示一些示例仪表盘或构建图表显示业务流程将如何改进。我们可以在高管演示之前，与我们的`test`受众一起审查这些演示以及演示文稿中的其他补充内容，并进一步征求反馈，了解这些视觉辅助工具在帮助我们论证项目资金需求方面所具有的价值。\n\
  \n### 高管会议\n\n我们的路线图演示在高管会议议程中的位置以及实际出席演示的人员，将表明我们的项目对高管的重要性。如果被安排在议程最后，且只剩下少数几位高管在场，这不是一个好兆头。至少，如果演示被缩短，我们还有些准备，因为正如前一节所述，我们已将建议、商业利益以及我们要请求的事项提前总结。在这种情况下，争取在日后得到全面听证或许是我们最好的期望。我们可以利用初次会议，在有限的时间和有限的听众面前，开始推销项目的价值。\n\
  \n在演示过程中，可能会发生三种情况。最好的结果是资金获得批准。然而，我们可能会遇到第二种结果：没有资金，项目将不被考虑。第三种选择在某些组织中往往最为常见——推迟对项目资金的决策，等待更多信息或召集不同的高管听众进行演示。让我们看看，如果在会议中出现后两种情况，我们可以做些什么。\n\
  \n如果项目因缺乏资金而未能获得批准，真正的原因可能是商业案例和/或发起人的支持力度不够。在许多组织中，真正有说服力的商业案例能够推动资金重新分配给某个项目。既然我们已经确立了正向的投资回报率，也许问题是回报周期太慢。我们必须直接询问，是什么阻碍了做出积极决策。缺乏资金可能并非真正的问题所在。项目可能并非没有希望，我们可以稍后再回来，带着对高管关切的答复，从而获得资金批准。\n\
  \n在一些组织中，要做出任何形式的决策都很难。如果决策被推迟，我们必须找出推迟决策的确切原因，并询问未来我们如何以及何时能再次提出该项目，并确保能做出决策。\n\
  \n如果决策是设立资金并推进项目，那么在离开会议并庆祝之前，我们应该询问高管们他们是否希望定期收到关于项目进展的报告，以及这些报告应如何提交。我们可以建议在后续高管会议中留出五分钟来汇报进展并提出遇到的任何问题。\n\
  \n\n\n### 过渡到实施阶段\n\n资金到位后，就该着手组建项目团队了。项目发起人可能认为资金一到位他们的工作就结束了，但他们在整个实施过程中仍应是团队的关键成员。他们通常在业务部门与高管层之间扮演关键联络人的角色。当需要在项目团队会议上强调该计划对业务的重要性时，他们也能发挥重要作用。\n\
  \n组建项目团队的关键在于任命项目经理。项目经理将确定所需资源，为团队招募或聘用这些资源，设定并协商里程碑，并监督项目进度，确保在批准的预算内达成里程碑节点。项目经理应熟悉组织内用于跟踪和监控活动与任务的标准项目管理框架。他们还需持续监控项目质量与范围变更，并在质量问题、范围蔓延或团队成员间的问题影响到及时交付既定业务目标的能力时，召集相关方共同解决。\n\
  \n一旦被任命，项目经理将审阅详细计划中迄今为止收集到的所有信息。如果他们不理解某些权衡取舍的原因，会向早期参与制定初始计划的成员提出疑问。在组建团队时，他们会要求团队成员及值得信赖的顾问在计划制定过程中寻找漏洞，判断计划可能失败的原因，然后修复潜在的计划缺陷。\n\
  \n**注意**  \n优秀的项目经理在与各类受众沟通时极为高效，受众范围从高度专业的技术人员、业务专家到团队领导和企业高管。他们组织能力出众，尤其擅长解决问题。他们通常具备敏锐的政治嗅觉，懂得如何以推动项目前进的创新问题解决策略来传递坏消息。\n\
  \n通常会组建多个团队，并使其成为更大项目团队的一部分。其中一些团队可能围绕以下角色组建：\n\n- 业务分析师和数据科学家（包括业务部门代表）\n- 数据管理系统架构师\n\
  - 数据采集专家\n- 企业架构师\n- 基础设施与设计架构师（服务器、存储和内部网络）\n- IT 运维人员（例如，熟悉组织最佳管理实践、标准和服务水平协议的人员）\n\
  - 智能传感器开发专家和程序员（适用于物联网项目）\n- 网络设计与运维人员（负责将数据从传感器传输到分析基础设施）\n\n团队成员的选择基于其定义和构建解决方案的能力。当然，他们还必须具备人际交往能力，以及在时间和交付范围截止日期的压力下工作的能力。正如我们在技能评估过程中所讨论的，团队成员可能来自内部员工、顾问、系统集成商，或这些来源的混合组合。\n\
  \n随着成员的加入，团队可能会变得庞大，以至于需要自身的管理层级，因此通常会在每个团队内指定团队负责人。鉴于团队负责人在解决方案交付过程中的关键作用，他们通常需要具备与项目经理相似的技能。\n\
  \n经验丰富的项目经理还会在资金获批后、实施前的这段时间，利用从团队获取的信息，为项目计划补充更多细节。图 7-12 展示了数据采集团队可能提供的 ETL（数据提取、转换、加载）开发简化高级计划。以这种格式呈现的图表有时被称为甘特图。在此\
  \ ETL 计划之下，还有另一层级的细节，描述如何构建解决方案，以便从内部和第三方数据源提取关键数据，并将其加载到支持各业务领域（如销售、营销和供应链）的解决方案中。\n\
  \n![A978-1-4842-0986-8_7_Fig12_HTML.gif](img/A978-1-4842-0986-8_7_Fig12_HTML.gif)\n\
  \n*图 7-12. 典型的 ETL 开发高级项目管理计划*\n\n你可能已经猜到，一份详细的整体项目计划可能包含数百项活动和数千个任务。在此规划阶段，项目经理特别关注的是理解各项活动和任务之间的相互关系，以及特定任务的延迟如何影响关键里程碑。这通常通过关键路径法（CPM）来实现，该方法识别出处于完成活动关键路径上的任务。有时会使用\
  \ PERT（计划评审技术）图作为甘特图的替代方案来表示任务进度，因为它能清晰展示关键路径上的任务。\n\n到目前为止，我们在这些阶段的工作主要涉及设计和规划，因此架构师通常处于领导地位。正如你所见，我们正在将项目领导权过渡给项目经理。当然，架构师的工作尚未完成，你将在最后一章中看到这一点。\n\
  \n最后一章描述的是将产生我们方法论设计成果的阶段：一个能够实现所需业务解决方案的实施。与本书其他章节类似，我们将重点介绍在该项目阶段观察到的**最佳实践**。\n\
  \n\n\n"
- "# 8. 实施计划\n\n我们以涵盖项目实施计划的这一章来结束本书。在此阶段，我们为准备计划和获取资金所付出的所有辛勤工作都应得到回报。我们将开始交付解决方案，这些方案能提供我们在商业案例中所承诺的价值。我们能否在此阶段取得成功，部分取决于我们在早期阶段执行成功方法论的效果。\n\
  \n然而，在宣布成功之前，仍有许多工作要做。在项目的这个最终阶段，可能会出现许多陷阱。我们将在本章中涉及其中许多内容。鉴于包含大数据和物联网技术的项目具有创新性，这一阶段可能尤其具有挑战性。\n\
  \n当我们开始这一阶段时，我们已经制定了项目计划，任命了项目经理，并组建了团队（如第 7 章所述），我们已准备好开始创建和运营能够实现新解决方案的技术。在本章中，我们首先描述一种逐步实施的方法及相关最佳实践。我们还将描述可能导致项目时间表发生变化的情况，这些情况需要我们留意。\n\
  \n解决方案开发完成后，我们必须准备好将可投入生产的方案投入运营。我们将从技术角度描述解决方案投入运营时发生的转变，并重新审视我们在第 6 章中描述的一些早期设计考虑因素。我们还将描述在此阶段执行变更管理计划的重要性。\n\
  \n当项目按照定义的范围完全部署后，我们将宣布项目结束。许多组织在这一步骤上会遇到困难，因为这些项目往往会因业务部门请求更多功能而不断演变。一旦业务部门开始设想这些解决方案可能提供的其他可能性，这种情况尤其常见。当然，我们的项目成功必须在高管和关键利益相关者心中确立并得到加强。这将有助于我们建立信任，证明我们有能力成功交付这些项目。\n\
  \n此时，我们还需要重新评估我们的解决方案在多大程度上满足了最初的商业案例，并审视我们在此过程中所做的任何调整。我们应该吸取经验教训，使其成为我们未来最佳实践的一部分。我们还可能发现，业务部门提出的新需求在范围上如此之大，以至于可能启动一个拥有自身生命周期的新项目。\n\
  \n我们的最后一部分描述了围绕新的、早期范围之外的需求启动另一个项目。虽然我们将重复我们的成功方法论，但参与下一个项目的所有相关人员都将从前一个项目中学到很多东西。对成功的业务和技术期望很可能会更高。\n\
  \n图 8-1 强调我们正处于成功方法论中的项目实施计划阶段，并说明我们将本章分为四个部分：实施计划中的步骤、使解决方案投入运营、结束项目以及重新开始。虽然这是本书的最后一章，但我们相信，当项目成功交付并为业务带来承诺的价值时，可以建立一个永无止境的循环。\n\
  \n![A978-1-4842-0986-8_8_Fig1_HTML.jpg](img/A978-1-4842-0986-8_8_Fig1_HTML.jpg)\n\
  图 8-1. 成功方法论中的实施计划阶段\n\n在下一节中，我们将描述如何采用逐步方法实施我们的项目。正如您从前面章节中回忆的那样，我们这样做是为了交付增量式的临时解决方案，这些解决方案的工作范围更易于管理，同时在此过程中也能展示进展和业务价值。每\
  \ 90 到 180 天交付的增量解决方案被认为具有合理的交付时间表，因为时间序列足够短，能够保持业务部门的关注。\n\n## 实施步骤\n\n一旦项目团队组建完毕且计划就位，我们就可以认真开始项目实施阶段了。实施阶段常见的第一步是举行项目启动会议。这次会议不应仅仅是走个形式。启动会议是一个让整个团队达成共识、在各方参与者之间建立共同目标的机会。\n\
  \n典型的启动会议应是管理团队主持的面对面会议。基于网络和电话的会议无法实现启动会议的目标。会议议程通常包括以下内容：\n\n-   由一位非常高级别的业务主管讨论并概述该项目为何对业务具有重要意义\n\
  -   简要介绍解决方案的业务愿景是如何形成的，并由项目发起人重申其重要性\n-   介绍团队负责人和到场的团队\n-   由首席架构师讨论信息架构的规划演进\n\
  -   由项目经理描述项目计划，包括讨论关键里程碑，例如如何监控范围、工作质量和进度；如何提出对时间表的担忧；以及项目评估会议的预定时间表\n-   由助理项目经理或高级团队负责人描述活动与任务将如何被跟踪，以及这种跟踪的重要性\n\
  -   由项目发起人对项目进行总结性发言\n\n会议的一个目标是让每个人对项目感到兴奋，并对实施者所属的团队充满热情。我们还希望团队成员理解自己在成功完成项目中所扮演的角色。在这次面对面会议中建立的工作关系可以带来更好的团队合作，并在后期项目中，当顺利交接和协作至关重要时，节省大量时间。这也是各个团队聚集在一起，讨论他们在执行计划中自己那部分任务时所扮演角色的机会。\n\
  \n会议结束时，每个人都应清楚了解自己负责的活动和任务、现有的预算限制以及交付的截止日期。团队应具有共同的目标感并理解具体的绩效目标，同时团队中个人的互补技能也应得到理解。所有参与者都应对项目有坚定的承诺，对其他团队成员有相互信任，并理解自己将被问责。\n\
  \n项目的成功将通过持续交付范围明确、增量式的开发成果来衡量。必须谨慎管理任何变更，并且理想情况下，这些变更应保持在已建立的项目时间表内。\n\n\n\n###\
  \ 项目计划与关键路径法\n\n在第 7 章中，我们简要介绍了如何使用关键路径法（CPM）来识别处于关键路径上的任务，这些任务关系到各项活动和项目本身的完成。里程碑被定义为任务或活动必须完成的日期。项目经理在项目启动和持续推进过程中，会特别关注这些里程碑的达成情况。有时，不在关键路径上的任务会有最早开始和最早完成日期，即该任务可能开始和完成的最早日期。同样常被提及的还有最晚开始和最晚完成日期，即任务可以开始和完成的最晚日期。最晚日期与最早日期之间的差值在进度表中被称为“浮动时间”或“宽裕时间”。\n\
  \n当然，CPM 活动网络中的任务依赖于前置任务。因此，持续跟踪对于了解项目进展状况至关重要。大多数团队还会在项目推进过程中，使用 CPM 来跟踪任务和活动的持续成本，以便发现并缓解可能出现的成本超支风险。\n\
  \n> **注**  \n> 一些项目经理倾向于在其 CPM 模型中，为任务的完成日期和工期设置变动范围，以考虑到某些人在提供时间估算时天生保守，而另一些人在估算完成任务所需时间时则不够严谨。时间估算在项目推销阶段往往偏短，而当意识到手头任务的完整范围时，估算时间又会变长。\n\
  \n为了说明 CPM 的工作原理，我们将参考图 8-2，该图展示了开发工作中关键路径图的一小部分。图中描绘了从同一天（6 月 3 日）开始的并行任务，但其中一条路径成为了关键路径。模型中的节点标识符由图中圆圈内的四位数字表示。任务从起始节点开始，持续时间为节点间连接线上所示的时长。为简化任务完成日期的计算，我们假设团队每周工作七天。\n\
  \n![A978-1-4842-0986-8_8_Fig2_HTML.gif](img/A978-1-4842-0986-8_8_Fig2_HTML.gif)\
  \  \n*图 8-2. 简单的关键路径法示意图*\n\n此图中的关键路径是构建社交媒体客户数据 ETL 代码的那条路径，因为执行这一系列任务所需时间更长。因此，从数据仓库中的数据构建报告的开始日期为\
  \ 6 月 9 日，尽管事务性客户数据最早可在 6 月 7 日就加载到数据仓库中。\n\n鉴于客户事务性数据的 ETL 代码构建不在关键路径上，我们可以为该任务设定一个最晚开始日期为\
  \ 6 月 6 日（而非图中所示的 6 月 4 日）。构建此 ETL 任务的最晚完成日期将是 6 月 8 日，因此我们将在加载社交媒体数据的同一天，将这批数据加载到数据仓库中。这不会延迟构建报告的开始日期。\n\
  \n项目经理会密切关注那些耗时异常长或消耗资源超出原计划的任务和活动。这些偏差可能由多种原因造成，包括原始时间和资源需求估算严重失误、缺乏具备适当技能的人员来执行任务，或是新需求和变更导致的范围蔓延。上述任何一种情况都可能导致里程碑无法达成，并需要重新分析计划的可行性。在特别棘手的时刻，人员选择有时也会受到重新审视。\n\
  \n为确保里程碑能够实现，项目经理有时会在工作开展之前，在关键路径上创建“管理储备”任务。这些任务并非实际工作，而仅仅是额外的时间缓冲。所增加的时间百分比通常取决于项目经理和团队领导对其团队交付所需任务能力的了解程度。增加\
  \ 10%到 15%的额外时间是常见做法。当任务实施时间超出关键路径上分配的时限时，便会启用管理储备任务。\n\n\n\n### 推动按时进展的最佳实践\n\n\
  尽管有些参与者可能希望只在达成里程碑时才召开项目更新会议，但这种做法可能导致问题积压，从而引发难以挽回的延误。因此，大多数项目经理更倾向于与各个团队举行每周更新会议。当然，如果在会议间隔期间发现重大问题，项目经理需要立即得到通知。\n\
  \n在关键开发阶段有时会采用的一种技术是：将解决方案开发到足够成熟的阶段，使其成为一个可向关键业务赞助商和分析师演示的工作原型。在大数据和物联网项目中，原型对于早期测试组件集成以及解决方案交付业务预期成果的能力，极具价值。这种方法有助于确保：当从技术开发角度达成里程碑时，业务部门会认同解决方案交付了承诺的成果。\n\
  \n交付物的质量也必须被跟踪。项目经理必须理解交付物是否符合当前任务的规格要求。未能监控质量可能会带来负面影响，因为当认为某个增量解决方案即将交付时，可能需要进行大量的返工。质量可以通过多种技术进行评估，包括同行评审、外部顾问评估以及业务部门早期采用者的审查。\n\
  \n随着增量解决方案接近完成，对解决方案进行弹性和功能测试是必要的。进行这种测试是为了确保已完成的开发工作能够处理输入数据量，并在所有条件下交付所界定的解决方案的同时满足其他要求。任何异常情况都应在设计和实现中加以考虑。\n\
  \n项目进度会在评审会议上定期向关键利益相关方报告。在项目团队内部，管理评审会持续进行，以更好地管理风险，尤其是在时间和成本估算存疑，或任务/活动的范围不明确时。当达成里程碑且预期应交付部分业务价值时，也会举行定期评审。在这些关键节点上，有时会做出关于项目是否应在进一步变更前继续推进的决定，同时可能在此刻进行技术评审。\n\
  \n**注意**\n\n有时，项目中已沉没的成本会形成一种继续开发的势头，即使项目的商业案例变得存疑。此时，有必要将因已投入资金而产生的情感与对商业案例的重新评估分离开来，以确定按当前形式继续推进项目是否合理。\n\
  \n项目时间线的变更从来都不是理想之事。然而，在像大数据和物联网实施中常见的那样复杂项目中，有时又是不可避免的。每当发生变更时，必须向所有相关方恰当传达项目的状态。时间线的变更及其对业务效益交付和项目成本的影响，应该引起广泛关注。诸如变更增量解决方案交付顺序等重要决策，可能需要讨论。优先级变更需要与业务利益相关方以及技术实施团队进行讨论。\n\
  \n项目范围的任何变更都应通过正式的变更控制流程来处理。实施正式流程有助于项目经理控制项目范围的变更。应向项目经理提交正式的项目变更请求，由其酌情审查并批准或拒绝。当提出此类变更时，必须向项目经理提供足够的信息，使其不仅了解变更的范围，还要了解其对进度、成本、交付物质量以及所需资源的影响。必须理解这些变更为成功按时交付增量解决方案及整个项目解决方案所带来的风险。\n\
  \n\n\n### 项目时间表变更的原因\n\n项目时间表发生不可避免的变更可能有许多原因。对于大数据和物联网项目，可能存在技能问题以及复杂的技术实施和管理挑战。然而，项目及其时间表的调整也可能并非由技术引起，而是由业务需求的变化所导致。\n\
  \n鉴于此类项目对人才的需求，人员技能管理问题经常出现。技术娴熟的个人和顾问通常难以寻觅。团队成员有时会在项目过程中收到其他有吸引力的工作邀请，而当他们决定离职时，很难找到替代人员。监控关键人员的管理并建立储备人才库至关重要。\n\
  \n当组织外部的合作伙伴提供系统开发、集成或工程技能时，如果合作伙伴无法交付符合范围和质量要求的可交付成果，解决方案的开发工作可能会放缓。在合作伙伴评估期间提供的简历，可能与实际参与项目人员的技能不符。可能需要就人员配置方面的某些变更进行协商。\n\
  \n随着实施的推进，可能会发现，虽然团队中的开发人员拥有原型开发所需的技能，但他们可能不具备创建可供企业基础架构部署和管理的、可用于生产环境的解决方案所需的技能。当在一个不熟悉大数据和/或物联网技术组件的组织中操作化解决方案时，这一点会变得尤为明显。如果发现这种技能差距，了解企业运营标准的额外资源应加入团队。\n\
  \n开发工作也可能因作为解决方案一部分的关键技术要素快速变化而面临挑战。例如，主要的 Hadoop 版本和 NoSQL 数据库版本可能在一年内发布多次。每个版本都可能包含重要的新功能，能以更好的方式解决旧的技术问题，但有时需要新的编码工作。必须做出决定：是重新编码解决方案以利用新功能，还是继续已在进行中的开发路径。\n\
  \n实现里程碑还可能遇到许多其他挑战。\n\n在物联网项目中，在合适的设备位置缺乏合适的传感器，以及由此导致无法收集所需数据，都可能导致项目延期。有必要与设备制造商紧密合作以解决此类问题，或者自行设计定制解决方案。工程团队与软件开发团队之间需要密切协调。\n\
  \n通信骨干网提供商在物联网项目中也可能扮演至关重要的角色。他们的设计和实施需要与工程和软件开发团队密切协作。缺乏此类解决方案经验的通信骨干网提供商，可能会在网络带宽、安全性、可用性或其他问题出现时，为项目实施设置障碍。\n\
  \n在业务方面，组织变革或关键业务发起人的离职都可能对项目的成功构成挑战。推动使用正在构建的更先进解决方案的业务分析师，可能会转移到组织中的不同岗位，并被能力较差、无法使用先进解决方案的分析师所取代。业务需求也可能因组织面临新的竞争压力，或由高级管理层指示的业务方向变更而发生变化。\n\
  \n**注意**\n\n这些变更中的任何一项都会给项目计划的成功带来新的风险。所有相关方之间的密切协调对于管理风险和变更计划至关重要。当然，可以而且应该提出关切。如果项目发起人和高管对重大关切不感兴趣，那么该项目或许被认为并不那么重要。这本身就可能是一个信号，表明前方存在问题。\n\
  \n## 解决方案的操作化\n\n随着里程碑的达成，项目阶段准备就绪上线，基础开发工作结束，解决方案的操作化将开始。此时，解决方案必须支持已商定的服务水平以确保成功交付。此前作为设计考量引入的许多可用性、管理和数据治理方面的考虑因素，此时将重新评估。我们还要为\
  \ IT 部门记录我们的操作流程，并审查我们为业务分析师群体记录的 ETL 流程效果如何。\n\n我们还必须再次审视所需的技能赋能，以使 IT 部门能够管理这些解决方案，并使业务分析师能够有效地使用它们。在此阶段，我们将实施需要密切协作和培训的变更管理技术。我们还将开始向更广泛的受众推销正在交付的业务能力，以激发对该项目的进一步热情。\n\
  \n\n\n### 服务级别与文档编制\n\n在前期收集项目需求时，我们便开始了解所需的服务级别。如果尚未明确定义，此处必须详细制定服务级别协议（SLA）。SLA\
  \ 将驱动我们的部署策略和配置，以满足性能、可靠性、可用性、可服务性和安全性的需求。\n\n例如，我们应清楚了解解决方案投入生产后，将有多少业务分析师使用它，并理解可能产生的工作负载。我们还应该对分析师群体的最终规模及其未来的工作负载需求有所预期。在将解决方案发布到生产环境之前，我们需要对其进行扩展性测试，以确保能够达到或超出已商定的\
  \ SLA。\n\n我们还会在生产环境上线前，测试满足 SLA 所需的管理最佳实践。应测试的流程包括以下内容：\n\n-   日常运维管理能力，包括在软件、服务器或通信基础设施发生故障，或遭遇灾难事件时，维持数据和解决方案可用性的能力\n\
  -   对包括事件管理在内的整个基础设施进行监控\n-   问题与事件管理及补丁修复\n-   性能管理与调优\n-   基础设施变更与应用程序发布管理\n-\
  \   业务用户管理与数据保护管理，包括访问控制、数据加密和审计\n\n在此测试过程中，我们将制定并记录必须落实的运维流程。我们应在运维团队内部，并通过服务器、软件和通信供应商关系，建立明确的支持流程。\n\
  \n例如，我们可以定义一套用于更新 Hadoop 集群上托管应用程序的流程。如图 8-3 所示，应用程序发布管理流程首先会在一个与生产环境截然不同的开发环境中，对新版本的应用程序进行初步测试。这种早期测试将在由虚拟机组成的“伪分布式环境”中进行。伪环境用于验证应用程序是否已准备好进入与生产环境相似的环境中进行更高级的测试。高级测试使我们能够确定新版本在功能、性能和可用性方面满足\
  \ SLA 的能力。测试成功后，应用程序接下来可能会部署到集群的灾难恢复站点，然后是主生产站点。\n\n![A978-1-4842-0986-8_8_Fig3_HTML.gif](img/A978-1-4842-0986-8_8_Fig3_HTML.gif)\n\
  \n图 8-3.\n\nHadoop 集群上的应用程序更新流程\n\n应用程序发布管理文档的一部分还可能包含对经过验证的集群备份和恢复流程的引用，以防在此过程中出现任何问题。我们可以定义如何使用\
  \ Linux 操作系统实用程序来备份集群上的程序文件、源代码和配置文件。由于 Hadoop 集群中的数据量巨大，使用传统的备份和恢复程序无法满足恢复时间目标，因此我们将描述数据副本的存储位置，以及在应用程序测试期间如何管理测试数据集。\n\
  \n我们编写的、描述此方法及其他方法的逐步文档，将建立可重复的流程，这些流程可供运维人员成功实践。在测试中难以掌握文档步骤和流程的人员，可能需要接受进一步培训（或者文档本身需要进一步改进）。\n\
  \n> **注意**  \n> 在开发解决方案时，我们应在 ETL 编码过程中以及通过部署的商业智能工具，定义技术和业务元数据。这是文档编制过程的另一个重要部分，它使业务人员在进行数据沿袭分析和使用分析工具时，能够理解数据所代表的含义。\n\
  \n### 组织变革管理\n\n经验丰富的项目经理深知，在解决方案投入运营的这个阶段，关注变革管理的重要性。如果业务分析师没有准备好使用按交付的解决方案，项目几乎注定会失败，并且后续资金可能会被削减。项目的正投资回报率通常取决于业务部门是否理解如何从解决方案中获取最大价值，并利用它来交付可衡量的业务成果。\n\
  \n为业务线制定的变革管理流程通常包含一个培训计划，该计划将使分析师能够获得使用新部署的分析工具所需的技能。通用的工具培训通常对分析师价值有限。一个更合适的培训计划应侧重于如何以符合项目业务目标的方式，从数据中获取商业洞察。\n\
  \n这通常也是数据所有权可能移交给业务线的时刻。如果在解决方案运营化过程中移交数据所有权，则还应针对新的数据管理者、数据赞助者和数据保管者制定培训计划。\n\n\
  同样，通常也会为 IT 部门制定培训计划，以应对新系统和数据管理解决方案的上线。进入生产环境后，大数据和物联网项目需要具备的企业管理技能，更接近于为数据仓库和其他\
  \ IT 基础设施提供的传统技能。正如我们之前在其他地方讨论的，这类技能通常供不应求，并且/或者当项目超出研发阶段时，需要重新审视这些技能。因此，很可能需要额外的培训。\n\
  \n在我们增量式解决方案部署的早期，我们可能会观察到预期的业务价值未能完全实现。我们还可能发现基础设施管理是个问题。这应让我们停下来，重新评估项目时间表和未来阶段，并调整我们的变革管理流程。我们应该在朝着可能失败的方向走得太远之前，找到问题的根源。\n\
  \n> **注意**  \n> 当增量解决方案部署后能够清晰展示业务价值时，我们应该开始宣传成功。这样做是为了在开发团队中保持项目势头和热情，同时也是为了鼓励更广泛的业务采纳。当然，我们需要避免过于兴奋的业务用户提出过多新需求，导致范围蔓延，超出我们按项目时间表交付的能力。不过，此时我们可以开始为未来阶段或未来项目收集新需求。这是一个令人愉悦的挑战。\n\
  \n\n\n## 结束项目\n\n我们在许多组织中观察到的挑战之一是结束这类项目。对改进的需求常常会拉伸原有项目的时间和范围。但到了某个节点，项目必须结束，以便其能完全融入组织。\n\
  \n项目结束的标志是所有关键任务均已完成，并交付了双方一致认可的最终解决方案。应当讨论并确定过渡日期，这些日期涉及项目所有权移交、剩余培训的完成，以及任何延期支持和保修范围（如果可交付成果由外部方提供保修）的启动。当所有剩余的范围内任务均完成且达到组织满意时，应记录正式的验收。\n\
  \n当项目结束时，宣告成功至关重要，即使其他项目可能已经准备就绪。那句老话“人人都支持赢家”在这里尤其适用。此外，对项目进行一次事后分析也是必要的，以便了解在下一次项目规划和执行时，哪些方面可以做得更好。\n\
  \n### 宣告成功\n\n如果我们在这个阶段遵循了方法论，那么我们现在应该有一份清单，列出了在增量解决方案的推出过程中，项目实现了哪些业务价值。我们收集了关于所提供效益的客观可衡量货币价值以及主观意见。我们还有交付这些项目阶段和整个项目的实际增量成本。现在，我们必须重新审视我们在业务案例和路线图中的最初预测，并将早期预测的业务价值与实际发生的情况进行比较。\n\
  \n我们很可能会发现，一些增量解决方案带来的价值远超我们的预期，而另一些则远低于预期。这很正常。重要的是，当我们把可衡量的货币价值加起来时，整个解决方案所获得的收益要超过项目的成本。我们必须确保业务部门高管和发起人认识到这一点，并支持我们的结论。\n\
  \n我们还应该探索收益如何随着时间的推移而持续累积。当然，我们应该在未来的投资回报率（ROI）中包括维护基础设施的持续成本。一些增量解决方案可能在部署初期尚未收回成本，但假以时日，它们可能会产生正的\
  \ ROI。也有可能它们是项目中稍后出现的其他更有利可图阶段的先决条件。\n\n### 事后分析\n\n在期待新项目之前，我们应该回顾一下即将完成的项目，并收集经验教训。这将使我们能够在下次开发业务案例、架构和项目计划，以及管理项目时更加明智。\n\
  \n精明的项目经理会持续记录项目各个阶段出现问题的提醒事项。他们衡量个人和团队的表现，以及过程中变化带来的影响。随着项目接近完成，他们通常会访谈团队领导和关键团队成员，寻求关于项目执行过程中哪些方面做得好、哪些方面不足的意见。可能会重新评估交付成果的质量以及质量问题对项目成功的影响。项目经理和其他团队领导也可能访谈业务部门的关键人员，了解他们对项目进展如何以及项目是否兑现承诺的看法。\n\
  \n事后分析中可能会问到的一些问题包括：\n\n*   解决方案交付成果是否匹配了业务期望？如果没有，原因是什么？\n*   项目里程碑是否按时并在预算内完成？如果没有，原因是什么？\n\
  *   交付成果是否顺利地从开发阶段转移到了生产环境？如果出现过问题，是哪些问题？\n*   整个项目的初始预算是否准确？如果不准确，原因是什么？\n*   哪些团队效率最高、效果最好？为什么？\n\
  *   哪些团队效率最低、效果最差？为什么？\n*   哪些技能被发现有所欠缺、在过程中得到了发展，或者仍然供不应求？\n*   质量评估实践是否改进了项目的交付成果？是如何改进的？\n\
  *   业务对项目解决方案的采纳是否带来了预测的业务价值？\n*   技术运营和业务变革管理计划是否得到了充分的规划和良好的执行？\n\n**注意**\n\n\
  在方法论早期阶段担任领导角色的架构师也应参与此阶段的访谈。事后分析提供了一个机会，可以了解架构在哪些方面取得了成功，又在哪些地方导致了实施问题。架构还将根据其在多大程度上实现了项目承诺的目标来进行评估。项目完成并投入生产后，架构师可以学到许多经验教训，并将其应用于后续的设计。\n\
  \n一旦收集了这些信息，就应与关键高管、发起人以及业务分析师社区的其他领导者一起评审项目成果。他们很可能也对哪些方面做得好以及未来的挑战有自己的看法，并且可能并未完全了解项目的收益。项目经理应准备好展示以下内容：\n\
  \n*   归功于项目的业务成果摘要及早期反馈\n*   项目进展和上线的时间线\n*   项目开发和推广过程中遇到的挑战以及如何克服的\n*   经验教训\n\
  *   项目开发期间搁置的修改请求及后续步骤\n\n收集所有这些信息有助于对项目成果进行公正的评估。应准备一份详细报告，记录项目的目标、挑战、经验教训以及取得的成果。它应在团队和关键发起人之间广泛分享。这将有助于证明在整个方法论中采用了非常彻底和一致的方法。它可以进一步建立项目领导和团队工作的可信度，并且在争取下一个项目获得资金批准时，将证明其极为有用。\n\
  \n当然，成功项目的最后一步通常是举行庆祝聚会。这是一个认可和感谢每个人为使项目取得成功所付出努力的机会——从项目团队成员、团队领导、架构师，到提供支持和指导的关键发起人、高管和业务分析师。目标之一通常是强化成就感，并鼓励优秀的团队成员考虑参与未来设想的项目。一些管理者也利用这个机会，在前一个项目的成功光环依然耀眼之时，开始与潜在的未来发起人讨论新项目。\n\
  \n\n\n## 重新开始\n\n我们的成功方法论现已完备。我们已经走过了整个方法论流程，交付了项目，并评审了成果。既然已经完整经历了这一方法论，当我们准备启动新项目时，就不会从零开始了。\n\
  \n我们现在已经建立了一套可供参考的业绩记录。希望这套记录是良好的。如果下一个项目是前一个项目的延伸，那么很可能我们已经收集了大量需求。无论如何，当我们重新开始时，应该再次遵循这套成功方法论。\n\
  \n> **注意**\n> 在某些组织中，开发项目的项目团队也会将其投入生产，然后完全投入到对已完成解决方案的持续管理和进一步改进中。这种方法可能会严重限制组织承接新项目的能力。一种更可取的做法是将已完成项目的控制权移交给运维团队。这使得项目团队能够开始专注于开发新项目，也使组织能够利用该团队此前积累的众多项目管理和开发经验。\n\
  \n我们将再次从与业务部门和 IT 部门讨论“可能性的艺术”开始，并共同与大家描绘愿景。如果我们之前的项目是成功的，并且许多相同的人员也参与了新项目的规划，那么我们的讨论将比第一次经历该流程时更具互动性和启发性。我们此前从业务部门收集的大量信息以及我们对技术版图的理解，在开始建立新愿景时可能会被证明非常有用。\n\
  \n和之前一样，接下来我们将收集有关潜在业务驱动因素、关键成功因素以及所需衡量标准和关键绩效指标的更多细节，并开始构建一个潜在的业务案例。接下来，我们将把所需的数据源映射到所需的输出，并描述所发生的数据处理过程。然后，我们将更详细地定义要部署的信息架构。我们将制定一份实施路线图，以便我们推销项目并获得资金。一旦获得资金，我们将更详细地制定项目计划，并开始另一个项目的实施。\n\
  \n图 8-4 展示了我们现在熟悉的、如何在成功方法论中推进的图表。你现在也应该开始理解为什么我们将其表示为一个闭环。如图所示，我们既了解前方的情况，又在开始每个新项目时借鉴了我们以往的经验。\n\
  \n![A978-1-4842-0986-8_8_Fig4_HTML.jpg](img/A978-1-4842-0986-8_8_Fig4_HTML.jpg)\n\
  \n**图 8-4.** 作为闭环的成功方法论\n\n随着这些周期的重复，通过对当前状态的分析、未来状态的设计以及成功几率的评估，使用这种重复性方法将会持续改进。我们将更清晰地了解各个团队和个人在执行此类项目时的表现如何，并且我们将越来越清楚问题可能出在哪里。我们还将更好地理解技术限制以及如何克服它们。\n\
  \n通过在以往成功的基础上再接再厉，这些项目对业务赞助方和技术团队的风险应该会大大降低。这反过来应该会为架构师、项目经理、开发人员、业务分析师、业务主管，以及组织中与解决方案开发和这些解决方案应用相关的其他所有人，带来更多获得资助的项目和机会。\n\
