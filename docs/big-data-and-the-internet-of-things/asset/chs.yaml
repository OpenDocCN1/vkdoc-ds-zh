  > — 乔治·S·帕拉斯，EAdirections 董事总经理\n\n> 本书提供了丰富的信息，指导如何定义和开发一个项目，使技术基础设施从传统数据管理平台演进为同时包含\
  \ Hadoop 和 NoSQL 数据库的基础设施。在我看过的书中，鲜有能像本书这样，阐述如何定义和开发必须部署在现代信息管理架构上的解决方案。\n> — 保罗·克罗斯，Salesforce.com\
  \ 高级副总裁兼联合销售主管\n\n## 引言\n\n\n\n## 本书的缘起\n\n本书的缘起可以追溯到 2012 年。当时 Hadoop 正在主流组织中探索应用，我们相信信息架构即将迎来变革。多年来，商业智能和分析解决方案一直围绕企业数据仓库和数据集市展开，并聚焦于定义、填充和分析其中数据的最佳实践。针对结构化数据的最优关系型数据库设计及其管理已成为许多工作中的核心。然而，我们看到这种关注点正在发生变化。\n\
  \n流式数据源首次被视为解决业务问题的潜在重要手段。人们尝试以实验方式探索此类数据，希望发现隐藏的价值。不幸的是，许多努力都无果而终。作者们对此深有体会，因为我们曾被邀请到许多组织提供建议。\n\
  \n我们确实发现一些组织在分析新数据源方面取得了成功。当我们退一步审视时，看到了一种正在引领他们走向成功的共同模式。在启动大数据计划之前，这些组织的利益相关者已经形成了关于新数据将如何改善业务决策的理论。在构建原型时，他们能够迅速验证或推翻这些理论。\n\
  \n这种成功的方法并非完全新颖。事实上，许多人在开发对企业运营至关重要的数据仓库、商业智能和高级分析解决方案时，也使用了相同的策略。在本书中，我们将这种分阶段的方法描述为一种成功的方法论。我们将在每一章中详细阐述该方法论的各个阶段，并描述它们如何应用于大数据和物联网项目。\n\
  \n早在 2012 年，我们就开始记录这种方法论并整理相关素材，这些素材在为客户提供建议时被证明很有用，无论他们采用何种技术架构。随后，我们与 Oracle 企业架构社区、系统集成商以及我们的客户合作，测试并完善了这种方法。\n\
  \n有时，这种方法会引导我们推荐传统的技术架构。然而，新的数据源常常需要引入 Hadoop 和 NoSQL 数据库解决方案。我们越来越多地看到物联网应用也推动了新的架构需求。因此，我们让数据源和需要解决的业务问题来驱动架构设计。\n\
  \n在我们举办研讨会的两年左右时间里，我们注意到，尽管许多书籍描述了大数据和物联网项目背后的技术组件，但它们很少涉及如何评估和推荐与组织信息架构或业务需求相一致的解决方案。幸运的是，我们在\
  \ Apress 的朋友也看到了类似的需求，这正与我们的想法不谋而合。\n\n这本书并不会取代您书架上那些详细描述未来信息架构可能包含的组件的技术参考书。这并非本书的意图所在。（我们有时会问企业架构师哪些组件是相关的，而数量很快就能增长到数百个。）\n\
  \n我们的目的是为您提供一个坚实的基础，让您理解为何以及在未来的信息架构中应如何将这些组件整合在一起。我们将带您走完一套方法论，这套方法包括：确立未来架构的愿景；收集业务需求、数据需求和分析需求；评估技能；确定需要的信息架构变更；并定义路线图。最后，我们还会就实施过程中需要考虑的事项提供一些指导。\n\
  \n我们相信，本书将为本书大部分内容所针对的企业架构师提供价值。但我们同样认为，它对于 IT 部门和其他业务部门中希望在这些项目上取得成功的人来说，也是一份宝贵的资源。\n\
  \n帮助您成功是我们的首要目标。我们希望这本书能助您实现目标。\n\n## 致谢\n\n我们首先要感谢我们的客户。与三年前我们初次考虑写这本书时相比，我们现在要聪明得多。在此期间，我们利用书中记录的这套成功方法论，主持了两百多场研讨会。我们的客户总是期望我们在考虑他们过去的投资和架构设计的同时，为他们业务和技术挑战提出新的解决方案。您会发现，基于这一经验，我们在整本书中遵循了一条演进式的路径。\n\
