  ## 从穿孔卡片到决策支持


  关于现代计算始于何时，众说纷纭。我们的历史描述从计算超越机械计算器之时开始。我们从专注于提供特定信息的数据处理方案讲起。许多人认为，一个重要的早期数据处理方案——它为后来的发展奠定了基础——是基于赫尔曼·何乐礼发明的穿孔卡片及设备。


  这项发明最初解决的业务问题是对美国人口普查收集的数据进行制表与报告。在何乐礼于 19 世纪 80 年代提出其方案时，普查的概念当然不新鲜。数个世纪以来，政府一直手动收集其领土内的居民数量。在此期间，人们希望收集的数据项范围不断扩大，例如公民姓名、地址、性别、年龄、家庭规模、城乡地址、出生地、教育水平等。对更多此类关键绩效指标（`KPIs`）的需求，加之人口增长，推动了对更自动化数据收集与处理方式的需求。何乐礼的穿孔卡片方案满足了这些需求。到
  20 世纪 30 年代，该技术已在其他类型的数据处理应用中广泛流行，例如为大型企业的会计系统提供基础。


  20 世纪 40 年代及第二次世界大战带来了更快解决复杂军事问题的需求，包括破译加密信息以及计算大型火炮发射炮弹的最佳弹道。快速且渐进式解决问题的需求，推动了早期电子计算设备的发展，这些设备由开关、真空管和布线机架组成，占满整个房间。战后，为军事计划制造更快计算机的研究继续进行，该技术也进入商业领域，用于财务会计等用途。


  随后的几十年见证了现代软件操作系统与编程语言（使应用开发更简单、更快速）以及数据库（实现数据的快速简便检索）的引入。数据库从层次结构演变为更灵活的关系模型，其中数据存储于由行和列组成的表中。表通过公共列之间的外键进行关联。结构化查询语言（`SQL`）很快成为访问关系数据库的标准方式。


  在整个 20 世纪 70 年代早期，应用开发侧重于对频繁更新的数据进行处理与报告，这后来被称为联机事务处理（`OLTP`）。软件开发的前提是捕获并报告业务或组织所需的特定`KPI`。尽管晶体管和集成电路极大地提升了这些系统的能力并开始降低计算成本，但大型机和软件仍然过于昂贵，无法进行大量实验。


  所有这一切在 20 世纪 70 年代末至 80 年代初随着低成本小型计算机及个人电脑的引入而改变。电子表格和关系数据库使得最初被称为决策支持系统的数据能进行更灵活的分析。但随着时间的推移，数据变得更加分散，人们逐渐意识到，不一致的数据收集方法会导致存疑的分析结果和业务结论。定义新的信息架构方法的时机已经成熟。




  '
- "# 数据仓库\n\n比尔·恩门（Bill Inmon）通常被认为是首个将这些新型数据存储角色定义为“数据仓库”的人。他将数据仓库描述为“一种面向主题的、集成的、非易失的、随时间变化的数据集合，用于支持管理决策”。20\
  \ 世纪 90 年代初，他进一步完善了企业数据仓库（EDW）的概念。EDW 被设计为一家公司所有历史数据的单一存储库。它被描述为包含一个第三范式数据模型，其中所有属性都是原子的且包含唯一值，类似于\
  \ OLTP 数据库中的模式。\n\n图 1-2 展示了一个虚构的航空票务数据仓库第三范式模型的极小部分。如图所示，它可用于分析单个航空旅客交易、已出票的飞机座位、航段、已售票价以及促销/常旅客奖励。\n\
  \n![A978-1-4842-0986-8_1_Fig2_HTML.gif](img/A978-1-4842-0986-8_1_Fig2_HTML.gif)\n\
  \n图 1-2. 简单的第三范式（3NF）模式\n\nEDW 加载的数据是从源系统的 OLTP 表中提取的。在从各种来源提取数据时，通过转换来实现数据定义的一致性，并实施数据质量规则和标准。在数据仓库最初开发时，源和目标之间的抽取、转换、加载（ETL）处理通常以批处理模式按周或按月进行。然而，企业对近乎实时数据分析的需求不断推动数据仓库更频繁地加载数据。如今，数据加载通常是持续不断的涓流式输入，加载过程中的任何时间延迟通常源于数据必须经历的转换的复杂性。许多组织发现，减少数据转换造成延迟的唯一方法是对数据在\
  \ OLTP 系统中的初始填充方式制定更严格的规则，从而在源端确保质量和一致性，并减少转换需求。\n\n许多早期的实践者最初专注于尽可能多地在数据仓库中收集数据，认为业务分析人员之后会自行决定如何利用这些数据。这种“建好了他们自然会来”的方法，常常因为业务分析人员无法轻松处理回答其业务问题所需的数据而导致项目停滞。许多业务分析师使用自己创建的多种提取工具，简单地将数据从\
  \ EDW 下载到电子表格中。他们有时还会用自己有权访问的其他来源的数据来补充这些数据。随后关于“单一事实版本”存在于何处引发了争论。这导致许多早期的 EDW\
  \ 被宣布为失败，因此其设计受到了重新评估。\n\n> **注意**  \n> 如果 EDW 这种“建好了他们自然会来”的方法听起来与当今 IT 主导的 Hadoop\
  \ 和 NoSQL 数据库项目中所尝试的方法相似，作者认为这并非巧合。正如任何架构师所知，形式应服从功能。另一方面，颠倒过来的概念并不是设计解决方案的正确方式。不幸的是，我们在许多这类大数据项目中看到历史正在重演，除非重新吸取过去的教训，否则其后果可能同样惨淡。\n\
  \n正当许多公司和组织的业务部门内部就 EDW 的实用性展开辩论时，拉尔夫·金博尔（Ralph Kimball）引入了一种方法，该方法似乎使业务分析人员能够以更直观的方式执行临时查询。他的星型模式设计以一个大型事实表为中心，周围环绕着维度表（有时称为查找表）并包含层次结构。这种模式被广泛部署在数据集中中，这些数据集通常被定义为面向业务部门的主题化数据仓库。\n\
  \n为了说明其用途，我们有一个非常简单的航空数据集市，如图 1-3 所示。我们想要确定 2014 年 7 月从美国飞往墨西哥的客户。如该星型模式所示，客户交易存储在事实表中。始发地和目的地维度表包含地理下钻信息（大洲、国家、州或省、城市和机场代码）。时间维度支持下钻到特定时间段（年、月、周、日、一天中的小时）。\n\
  \n![A978-1-4842-0986-8_1_Fig3_HTML.gif](img/A978-1-4842-0986-8_1_Fig3_HTML.gif)\n\
  \n图 1-3. 简单的星型模式\n\n并非所有关系型数据库最初都擅长在定义了星型模式的情况下提供最优的查询性能。这些性能挑战促使了专门设计用于处理层次结构和星型模式的多维在线分析处理（MOLAP）引擎的诞生。MOLAP\
  \ 引擎之所以表现如此出色，是因为这些“立方体”由预连接的数据钻取路径组成。图 1-4 描绘了一个三维立方体的物理表示。\n\n![A978-1-4842-0986-8_1_Fig4_HTML.jpg](img/A978-1-4842-0986-8_1_Fig4_HTML.jpg)\n\
  \n图 1-4. 三维立方体表示\n\n后来，随着关系型数据库优化器的成熟，在关系型数据库管理系统内部署星型模式时，实现良好的查询性能成为可能。这些实现被称为关系型在线分析处理（ROLAP）实现。\n\
  \n\n\n### 独立数据集市与从属数据集市\n\n在 20 世纪 90 年代中期，关于`EDW`与数据集市相比的实用性曾引发大量争论。当业务分析师发现星型模式更易于导航（并常常自行部署数据集市）时，一些\
  \ IT 数据库程序员通过在`EDW`中的数据和模式之上创建视图来回应这一反对意见。然而，构建视图所需的编程和维护工作通常不够及时，无法满足业务分析师日益增长的需求。\n\
  \n另一个问题也时常出现。当各个数据集市相互独立地定义和部署，且不遵循`EDW`内建立的数据定义规则时，通用数据的不一致表示会让人质疑真实数据的存储位置。图 1-5\
  \ 展示了当不同业务线构建自己独立的数据集市并直接从`OLTP`源提取数据时可能出现的复杂性。在实际实施中，复杂性有时比图中所示的更大，因为数据也可能直接在数据集市之间流动。此图还可能加入电子表格，作为与独特数据存储和表示相关联的商业智能工具。以这种方式部署的组织通常会在业务会议上花费大量时间争论谁的报告能正确反映业务的真实状态，即使这些报告本应显示相同的`KPI`。\n\
  \n![A978-1-4842-0986-8_1_Fig5_HTML.gif](img/A978-1-4842-0986-8_1_Fig5_HTML.gif)\n\
  \n图 1-5.\n\n源与目标集市之间具有独特`ETL`的独立数据集市\n\n归根结底，争论本不应该是`EDW`与数据集市之间的对立。只要应用了正确的架构指南，两种方法都有其价值，而且理由充分。随着许多信息和数据仓库架构师开始认识到这一点，一种混合方法成为了最佳实践。`EDW`得以实施，并随着数据集市中对新数据源的需求而逐步扩展。数据集市被设计为依赖于`EDW`中的数据定义。由于`EDW`仍然是历史记录的数据库，输入集市的数据均从`EDW`中提取。`EDW`作为所有数据源的例外情况通常发生在存在仅与组织中某一条业务线相关的独特第三方数据时。此时，这些独特数据仅存储在该业务线的数据集中。\n\
  \n图 1-6 展示了依赖于`EDW`的数据集市。这种方法通常会导致定义一致性维度，以在数据集市之间建立一致性。当定义了一致性维度后，就可以提交单个查询来访问多个数据集市的数据（因为这些维度在各个数据集中代表了相同的层次结构）。\n\
  \n![A978-1-4842-0986-8_1_Fig6_HTML.gif](img/A978-1-4842-0986-8_1_Fig6_HTML.gif)\n\
  \n图 1-6.\n\n从`EDW`（可信数据源）进行`ETL`的从属数据集市\n\n您最有可能遇到的、作为数据仓库和/或数据集市引擎的数据库数据管理平台包括：`Oracle\
  \ (数据库企业版和 Essbase)`、`IBM (DB2 和 Netezza)`、`Microsoft SQL Server`、`Teradata`、`SAP\
  \ HANA` 和 `HP Vertica`。常用的`ETL`工具包括`Informatica`、`Oracle Data Integrator`、`IBM DataStage`\
  \ 和 `Ab Initio`。\n\n注意\n\n当`EDW`和数据集市首次成为企业运营的核心和必备要素时，信息架构师开始认识到这些平台也需要具备高可用性、可恢复性和安全性。如今，随着`Hadoop`集群和`NoSQL`数据库对业务线的重要性日益提升，对这些平台提出类似能力的需求正在推动这些发行版中新特性和功能的创建。这体现在开源社区较新的软件版本以及提供各种发行版的供应商越来越关注改进可用性、可恢复性和安全性。\n\
  \n### 增量方法\n\n早期的数据仓库设计工作有时会陷入“过度分析导致的瘫痪”，侧重于优雅的 IT 设计，却未与业务线的需求相匹配。早期`EDW`的设计通常需要\
  \ 12 个月或更长时间，远远超出业务需求的范围或业务发起人的关注周期。一些早期的从业者采用经典的瀑布式方法，首先确定整个`EDW`的工作范围，然后分配时间和资源。\n\
  \n图 1-7 说明了瀑布式方法。冗长的项目计划、延误以及缺乏对业务的关注，常常导致业务线自行其是，开发和部署独立的数据集市，或在电子表格中创建伪数据集市，以解决他们最紧迫的问题。\n\
  \n![A978-1-4842-0986-8_1_Fig7_HTML.gif](img/A978-1-4842-0986-8_1_Fig7_HTML.gif)\n\
  \n图 1-7.\n\n瀑布式方法\n\n鉴于这些问题，许多人放弃了瀑布式方法，转而采用敏捷增量方法来设计和开发。IT 部门与业务线之间建立了合作伙伴关系。在许多组织中，120\
  \ 天或更短的时间范围内实施和评估业务解决方案的进展已变得司空见惯。图 1-8 展示了增量方法，并说明了分配固定时间和固定资源的情况。\n\n![A978-1-4842-0986-8_1_Fig8_HTML.gif](img/A978-1-4842-0986-8_1_Fig8_HTML.gif)\n\
  \n图 1-8.\n\n增量方法\n\n尽管图 1-8 显示可变范围，但应在流程的每个增量中展示一些与业务目标相符的实际商业价值。因此，在实践中，所应用的方法通常是增量方法和瀑布式方法的混合平衡。\n\
  \n使用这种方法，解决方案的实用性会在每一步中重新评估。在更短的时间增量内定义和评估`EDW`及从属数据集市意味着，IT 设计和开发可以在与业务期望严重偏离之前进行调整。可以定期计算投资回报率，并反映范围的任何变化。\n\
  \n一些公司选择将业务分析师嵌入到 IT 组织中，以推动持续识别增量需求。另一些公司则创建商业智能卓越中心作为虚拟组织，定期将业务线的分析师与 IT 架构师和开发人员聚集在一起。无论采用何种方法，团队之间持续的沟通和灵活性对于成功至关重要。\n\
  \n注意\n\n提供新业务解决方案的成功大数据项目通常也采用增量方法开发。在组织内部，各团队之间就所发现的内容及其潜在业务影响进行持续对话，是成功的关键。\n\n\
  \n\n### 更快的实施策略\n\n早期的数据仓库实施完全基于定制化设计。由于数据模型当时尚未成熟且未广泛可用，大量时间被用于从头定义和设计数据模型。工作负载特性及其随时间的变化极难预测，使得服务器和存储的规格制定困难重重。随着经验积累和数据仓库设计的成熟，最佳实践逐渐明晰，基于这些经验的解决方案也应运而生。\n\
  \n其中一类解决方案是基于常见数据分析需求预定义数据模型。这些模型可供特定行业（如零售、通信和银行业）使用，并提供横向分析解决方案（例如财务、销售、营销和供应链）。如今，此类模型已由软件供应商和咨询公司提供，其特点是定义了逻辑设计，有时还包含物理模式。它们涵盖关键业务领域，并包含启动数据仓库部署所需的表和其他数据元素。有些模型还附带\
  \ ETL 脚本，可用于从流行的 ERP 和 CRM 事务处理源中提取数据并加载到数据模型中。当然，大多数组织会根据自身独特的业务需求定制这些模型。然而，这些模型确实为许多数据仓库项目提供了起点，并且在使用增量方法时最有可能成功部署。\n\
  \n正如我们之前提到的，为数据仓库工作负载配置服务器和存储也给信息架构师及服务器与存储架构师带来了挑战。由于数据量的增长速度远快于物理磁盘驱动器访问速度的提升，大多数平台发现，如果对整体系统设计不够重视，其吞吐量就会受限。近年来，部署专为数据仓库和数据市集配置的设备化平台的概念已变得相当普遍。一些同时提供服务器和存储的关系数据库供应商也提供了多种此类产品。存储中闪存的应用进一步提升了性能，前提是数据库软件针对闪存进行了优化。最近，内存成本的大幅降低、能够处理海量内存的新一代处理器的推出，以及数据库在内存中存储和检索常用数据能力的进一步改进，带来了巨大的查询响应和分析性能提升。所有这些都有助于减轻许多以前必需的复杂数据库调优和设计任务。\n\
  \n话虽如此，随着吞吐量等某些服务器和存储瓶颈被克服，其他瓶颈自然会浮现，因为系统中的某个地方始终存在物理限制。业务分析师将继续要求新的分析应用，以利用新的平台能力并推动技术边界。\n\
  \n> **注意**：在本书出版时，Hadoop 集群和 NoSQL 数据库的应用数量还相当少，但正在增长。针对这些数据管理引擎，可用的设备化服务器和存储平台也在增多。随着需要此类引擎的解决方案的商业价值得到认可，实施效率和服务水平保障能力的重要性将日益凸显。因此，预计对这类优化配置设备的需求将会增长，其普及轨迹将与数据仓库设备的采用情况类似。\n\
  \n### 为分析师匹配商业智能工具\n\n数据的访问和利用方式取决于业务线人员的需求和技能。对于那些需要通过查看数据来做出决策的人来说，他们可能使用的工具范围从简单的报表工具到极其复杂的数据挖掘工具。现代基础设施有时还包括用于自动化推荐和操作以及信息发现工具的引擎。\n\
  \n图 1-9 展示了各种工具和技术及其相对用户群体规模和复杂程度。\n\n![A978-1-4842-0986-8_1_Fig9_HTML.gif](img/A978-1-4842-0986-8_1_Fig9_HTML.gif)\n\
  \n**图 1-9.** 各类分析师工具的潜在业务分析师和用户群体规模\n\n向业务分析师传达信息的最简单方式是通过预定义的报表来显示由报表开发者选定的关键绩效指标\
  \ (KPI)。报表在可查看的信息方面灵活性有限，但也确保了广泛的业务用户能够成为信息的消费者，因为它们的访问方式简单。开发者使用的报表工具会生成 SQL 来访问所需数据。报表开发者通常根据报表呈现\
  \ KPI 的清晰度，以及生成、共享和分发报表的简便性和灵活性来评判报表工具的质量。例如，通常支持多种模板类型用于打印，如 PDF、RTF 和 XSL。\n\n\
  即席查询与分析工具提供了更高的灵活度，因为业务分析师可以通过自行浏览数据库表来提出假设性问题。开发者会创建业务元数据，将晦涩的表名转换为有意义的面向业务的数据描述。业务用户浏览数据的难易程度也取决于数据库中底层模式的设计。正如我们之前所述，采用维度模型和层次结构的星型模式尤其易于浏览。图\
  \ 1-10 展示了一个界面，其中包含由销售事实表及其周围的维度（包括时间、产品、办公室等）组成的结构。在界面背后，这些工具也会生成 SQL 来访问数据。除了灵活性，现代即席查询与分析工具还以其提供的数据可视化能力来评判。\n\
  \n![A978-1-4842-0986-8_1_Fig10_HTML.jpg](img/A978-1-4842-0986-8_1_Fig10_HTML.jpg)\n\
  \n**图 1-10.** 典型的事实与维度即席查询工具界面\n\n如今您可能会看到正在使用的典型即席查询、分析和报表工具包括 Oracle Business\
  \ Intelligence Foundation Suite、SAP Business Objects、IBM Cognos、MicroStrategy、Tableau、QlikView、Pentaho\
  \ 以及 Tibco Jaspersoft。当然，很多人会说 Microsoft Excel 是组织中最常用的此类工作工具。在大多数组织中，会使用来自不同供应商的工具。\n\
  \n少数但不断增长的业务分析师会处理海量数据，并试图利用数据发现隐藏的模式和/或预测未来结果。分析类型范围从您可能在大学学过的简单统计（例如均值、标准差等）到基于更复杂数据挖掘算法的模型。\n\
  \n业务分析师为弄清数据含义所用的统计函数通常属于以下类别：\n\n*   基本统计函数，如汇总、排序、排名和频率\n*   密度、概率和分位数函数\n*  \
  \ 特殊函数，如 Gamma 函数\n*   检验函数，如卡方检验、简单和加权 kappa 系数以及相关性分析\n\n\n\n"
- "# 高级数据挖掘算法\n\n高级数据挖掘算法用于需要理解哪些变量对准确预测结果至关重要，以及定义随后用于预测结果的预测模型时。这些模型通常应用于存在数百个变量但只有十几个或更少变量影响结果的情况。数据挖掘算法可分为以下几类：\n\
  \n- **聚类算法**：用于探索某些业务结果是否属于具有共同特征（如青少年、男性等）的特定群体。\n- **逻辑模型**：用于某些事件发生后，其他事件将随之发生的情况（通常称为决策树）。\n\
  - **神经网络**：一种黑箱数学模型，针对已知结果的样本集进行训练。\n- **异常检测算法**：用于检测异常值和罕见事件。\n\n在您当前架构中，可能已安装并提供统计和数据挖掘能力的供应商包括：`SAS\
  \ Institute`、`IBM SPSS`、`R`（一种开源统计引擎）和 `Oracle Advanced Analytics`。\n\n从历史上看，统计学家和数据挖掘者同时也是领域专家，有时被称为“量化分析师”。随着\
  \ `Hadoop` 的日益普及，出现了数据科学家这一新角色。早期的数据科学家尤其擅长利用利用 `Hadoop` 特性的高级编程技术。\n\n> **注意**\
  \  \n> 如今关于数据科学家的技能和定义存在诸多争论。一些人仍然认为数据科学家是统计学家和 `Hadoop` 编程大师的结合。然而，许多具备这些技能的人被雇佣后，已显示出他们缺乏理解数据中应寻找什么以及对业务潜在影响所需的领域专业知识。在当今许多组织中，数据科学家与业务领域专家配对，作为一个团队工作以确保成功。\n\
  \n本世纪初，人们认识到探索可能包含结构化、半结构化以及流数据的大规模数据集的需求日益增长。引入的信息发现工具能够在不预定义模式的情况下探索数据。这些工具通常要么拥有自己的专有数据存储引擎（如\
  \ `Oracle Endeca Information Discovery`），要么依赖 `Hadoop` 来探索数据集及数据组合。所分析的数据通常来源于 `OLTP`\
  \ 源、`EDW`、`NoSQL` 数据库和 `Hadoop`。`Tibco Spotfire`、`Oracle Big Data Discovery` 以及我们之前在本章提到的一些商业智能工具可以直接访问\
  \ `Hadoop`，并用于信息发现。\n\n最后，对于某些问题，必须实时采取行动。示例可能包括：在网站购物访问期间推荐可能感兴趣的产品，或建议检查某设备是否需要维护，因为预测该设备在不久的将来会发生故障。\n\
  \n网站活动数据通常使用预测分析模型进行分析。模型结果会定期以批处理更新的方式提供给实时推荐引擎。该引擎随后根据模型的指导，推荐网站向用户呈现特定的网页或通知。随着分析的进行，推荐会不断调整并变得更加准确。通常，报告工具用于监控这些自动化操作的结果。\n\
  \n其他业务问题，例如设备即将发生故障，可能需要在任何详细数据分析之前立即采取行动，因为上述学习过程中存在延迟。业务规则引擎或事件处理引擎可以预编程，以便根据检测到的事件采取特定行动。这些通常部署在物联网解决方案中，以便根据传感器检测到的情况触发即时响应。\n\
  \n在本书后续部分，我们将描述如何发现对这些不同工具和解决方案的需求，然后描述它们成为信息架构设计一部分时的技术考量。\n\n## 数据管理策略的演变\n\n\
  随着业务工作负载需求的变化以及新技术要求的推动，关系型数据库不断发展，并引入了旨在满足这些要求的新功能。然而，一些人发现，基于数据严格适合行和列概念的技术引入了过多的开销，或者与需要解决的问题不一致。正是出于这些原因，`NoSQL`\
  \ 数据库和 `Hadoop` 引擎大约在本世纪初开始出现。\n\n巧合的是，它们出现在“开源”运动势头正盛之时，并反过来助长了这一势头。在开源模型中，供应商和个人可以访问源代码，这些“提交者”提交他们愿意分享的更新和实用工具。`NoSQL`\
  \ 数据库的源代码可以从 `Apache Software Foundation` 和 `GNU` 获得许可。`Hadoop` 的许可可以从 `Apache`\
  \ 获得。随着新功能被纳入开源代码的新版本，软件供应商随后决定在自己的发行版中包含哪些内容。尽管这些发行版可以免费下载，但供应商相信，通过订阅（包括支持）和提供付费服务来产生收入，他们最终可以成为盈利且成功的公司。\n\
  \n\n\n### NoSQL 数据库\n\nNoSQL 数据库这一术语可追溯到 20 世纪 90 年代末，旨在描述一类广泛的非关系型数据库引擎，它们被设计用于处理快速更新和摄入海量数据，同时提供水平可扩展性。这种更新和摄入工作负载对某些在线应用（如网站上的购物车）来说已成为一项挑战，在这些应用中，尽管用户数量庞大，但快速的更新性能至关重要。\n\
  \n早期的 NoSQL 数据库不支持 SQL，因此得名。随着时间的推移，许多可用的 NoSQL 数据库已不同程度地增加了对 SQL 的支持。早期的 NoSQL\
  \ 数据库也不提供关系型数据库所具备的传统原子性、一致性、隔离性和持久性（ACID）属性。这种支持被认为是不必要的，因为它需要过多的开销，会妨碍所需的性能。如今，许多\
  \ NoSQL 数据库声称至少支持部分 ACID 属性。然而，人们普遍认为，它们不应被用作 OLTP 关系型数据库引擎的替代品，也不适用于需要跨维度连接多种类型数据的场景。\n\
  \n现已出现了多种 NoSQL 数据库类型，包括以下几种：\n\n- **键值对**：由键和一个值或一组值组成的数据库，通常用于非常轻量级的事务，并且与键关联的值的数量会随时间增长。\n\
  - **列式**：一个或多个键值对的集合，有时被描述为二维数组，用于表示记录，以便数据查询可以返回完整的记录。\n- **文档型**：与列式 NoSQL 数据库类似，专为文档存储而设计，具有深度嵌套能力，能够构建复杂结构，从而实现文档中存储文档。\n\
  - **图式**：使用具有节点和边的树状结构，并通过关系进行连接的数据库。\n\nNoSQL 数据库通过一种称为分片的技术实现水平可扩展性。分片简单来说就是将数据分布到集群中的多个独立服务器或节点上。性能取决于节点的能力，同时也取决于数据分布的方式是否与各个服务器的性能相匹配。例如，如果所有最新数据都放在单个节点上，而大部分活动都与最新数据相关，那么应用将无法良好扩展。许多\
  \ NoSQL 数据库供应商专注于自动化分片过程，以提供更好的负载均衡，并更轻松地在集群中添加或移除容量。\n\n尽管在支持高可用性故障转移场景方面不如关系型数据库强大，但\
  \ NoSQL 数据库确实支持数据复制，以便在服务器或节点发生故障时提供数据库可用性。数据副本通常会被复制到与主数据所在节点不同的节点上。\n\n我们描述的各种类型的\
  \ NoSQL 数据库引擎有数十种。您更有可能遇到的一些包括 `Apache Cassandra`、`MongoDB`、`Amazon DynamoDB`、`Oracle\
  \ NoSQL Database`、`IBM Cloudant`、`Couchbase` 和 `MarkLogic`。由于这些数据库的功能列表可能会迅速变化，了解正在考虑部署的版本所提供的功能非常重要。例如，有些仅在其较新的版本中才添加了内存计算功能。\n\
  \n### Hadoop 的演变\n\n在本世纪初，来自网站的流式数据馈送越来越让那些试图分析其搜索引擎有效性的公司和组织感到头疼。这些数据流包含嵌入的标识符和有价值的数据，但也包含其他杂项字符。图\
  \ 1-11 展示了网络日志中典型数据的一个示例。显然，这类数据不太适合存储在关系型数据库中。早在 2002 年，Doug Cutting 就开始研究通过开发一种名为\
  \ Nutch 的新引擎来解决这个问题。2003 年和 2004 年，谷歌发表了两篇重要论文，描述了谷歌文件系统（GFS）和 MapReduce。分布式文件系统的概念在当时并不新鲜，但谷歌的论文阐述了一种如何解决搜索问题的愿景。\n\
  \n`![A978-1-4842-0986-8_1_Fig11_HTML.jpg](img/A978-1-4842-0986-8_1_Fig11_HTML.jpg)`\n\
  \n图 1-11. 典型的网络日志数据流\n\nCutting 理解谷歌这些论文的重要性，并对自己正在进行的工作进行了修改。`MapReduce` 能够映射数据流，并将流中的数据缩减为有价值的数据。`GFS`\
  \ 提供了如何扩展引擎的线索，鉴于部署的网站数量正在爆炸式增长，这种可扩展性被视为尤为关键。2006 年，Cutting 加入雅虎，并以他儿子的玩具大象名字重新命名了他的存储和处理项目。Hadoop\
  \ 诞生了。同年，Hadoop 成为 Apache 软件基金会的一个项目。\n\n分布式文件系统能够跨海量存储实现高度并行的负载。`MapReduce` 与数据位于同一位置，提供了所需的可扩展性。当早期倡导者讨论这种组合时，它通常被描述为解决大数据问题，即数据具有巨大的体量、多样性和速度。随着时间的推移，大数据这个术语的含义变得更加广泛，因为供应商们已经推出了许多不同的解决方案来解决许多不同但类似的问题。\n\
  \n如今，Hadoop 集群被视为处理多种类型工作负载的理想解决方案。其中一些集群现在用于通过提供源系统和数据仓库之间的高度并行转换来加速 ETL（数据提取、转换、加载）处理。其他\
  \ Hadoop 集群则用于预测分析工作负载，分析师们使用诸如 `R` 或 `SAS` 等工具，或者利用 Hadoop 自己的机器学习和数据挖掘编程库 `Mahout`。数据科学家有时会编写代码（使用\
  \ `Java`、`Python`、`Ruby on Rails` 或其他语言），并在代码中嵌入 `MapReduce` 或 `Mahout` 来发现数据中的模式。此外，越来越多的人通过各种\
  \ SQL 接口（如 `Hive`、`Impala` 或其他供应商的类似产品）来访问集群中的数据。\n\n**注**：本书中描述的较新数据管理解决方案是为了通过满足特定新兴工作负载需求来提供优化解决方案而发明的。然而，对于许多这类以开源方式推广的数据存储，人们的看法是它们更便宜。这可能导致这些软件发行版被应用于其技术优势领域之外，以降低获取和支持成本。随着开发者抱怨与那些被认为成本更高的其他引擎相比功能有限，创建这些软件发行版的供应商通常会通过添加新特性和功能来回应。一个悬而未决的问题是，随着这些发行版与传统数据管理解决方案以及彼此之间的功能重叠越来越多，它们在资源利用率和性能方面的许多优势是否会消失。\n\
  \n\n\n### Hadoop 特性与工具\n\nApache 软件基金会为 Hadoop 的特性和工具提供孵化器，并将其归类为开发项目。随着新版本的发布，这些项目的成果会以不同程度进入来自\
  \ Cloudera、Hortonworks、IBM、MapR 和 Pivotal 等厂商的 Hadoop 发行版中。Apache Hadoop 项目状态更新会发布在\
  \ `apache.org` 网站上。\n\n如果你是 Hadoop 新手，了解一些发行商和开发者常作为 Hadoop 技术和特性谈论的关键项目的定义可能会有所帮助。一些核心数据管理特性包括：\n\
  \n*   `HDFS`：Hadoop 分布式文件系统。\n*   `Parquet`：一种用于 Hadoop 的压缩列式存储格式。\n*   `Sentry`：一个为\
  \ Hadoop 中存储的数据和元数据提供细粒度、基于角色的授权的系统。\n*   `Spark`：一个支持 Hadoop 内存数据处理的引擎。\n*   `YARN`：用于调度和管理作业及集群资源的框架。\n\
  *   `Zookeeper`：分布式应用的协调服务。\n\nHadoop 中用于数据传输和收集的重要特性包括：\n\n*   `Flume`：用于在 `HDFS`\
  \ 中收集和聚合流式数据（包括日志和事件数据）的服务。\n*   `Kafka`：一个设计用于处理实时数据流的发布-订阅消息代理平台。\n*   `Sqoop`：用于在\
  \ Hadoop 和数据库之间传输数据的工具。\n\nHadoop 中的编程工具、应用程序编程接口（API）和实用程序包括：\n\n*   `Hive`：一种用于在\
  \ Hadoop 中查询数据的类 SQL 结构（`HiveQL`）。\n*   `MapReduce`：一种早期的 Hadoop 编程范式，对分布在节点间的数据执行“映射”（过滤和排序）然后进行“归约”（汇总操作）。\n\
  *   `Oozie`：用于管理 Hadoop 作业的工作流作业调度器。\n*   `Pig`：用于数据处理的数据流语言和并行执行框架。\n*   `Spark\
  \ GraphX`：一个 API，支持将数据视为图与集合、对图进行转换和连接以形成弹性分布式数据集（`RDD`），以及在 `Spark` 中创建自定义图算法。\n\
  *   `Spark MLib`：在 `Spark` 中实现的机器学习库。\n*   `Spark SQL`：一个 API，支持在结构化的（`Hive`）上下文中查询\
  \ `Spark` 中的 `RDD`。\n*   `Spark Streaming`：一个 API，支持在 `Spark` 中创建流处理流程。\n*   `Solr`：一个全文索引和搜索平台。\n\
  \n基于 Hadoop 的应用程序的创建者有时会寻求 NoSQL 数据库在其设计中提供的功能。`HBase` 提供了一个部署在 `HDFS` 上的 NoSQL\
  \ 列式数据库，支持随机读写。它在处理数据稀疏性问题时尤其有用。除了支持即席查询外，`HBase` 还常用于提供数据摘要。\n\n在底层服务器和存储上布局 Hadoop\
  \ 集群需要指定名称节点、数据节点以及提供我们之前提到的特性的服务的节点。在集群中正确部署服务可以消除可能导致整个 Hadoop 集群宕机的关键单点故障。数据通常会进行三副本复制，以确保在节点发生故障时数据仍然可用。\n\
  \n关于何时适合将 Hadoop 集群作为信息架构中的一个组件，而不是建议使用关系数据库部署数据仓库，仍然存在一些争论。表格 1-1 试图突出各自的优势。由于数据管理引擎的功能正在迅速变化，你应根据当前最新的可用信息重新验证这些特性，以便在考虑自己项目的部署选项时做出决策。\n\
  \n**表 1-1。** 部署 Hadoop 与数据仓库（关系数据库）的一些差异总结\n\n| 特性 | Hadoop | 数据仓库 |\n| --- | ---\
  \ | --- |\n| 数据价值 | 数据通常质量与价值混杂——数量最重要 | 仅高质量价值的数据最重要 |\n| 模式 | 最常用作分布式文件系统 | 最常见的是\
  \ 3NF 与星型模式混合 |\n| 典型工作负载 | 信息发现、预测分析、ETL 处理 | 历史事务报告、即席查询、OLAP |\n| 数据源 | 从流式数据到结构化数据的各种数据类型\
  \ | 结构化数据源 |\n| 可用性 | 跨节点复制数据 | 保证一致的故障转移 |\n| 安全性 | 身份验证、加密、访问控制列表 | 与 Hadoop 相同，外加更细粒度的控制\
  \ |\n| 可扩展性 | 可分布在数百个节点、数百 PB 数据上 | 多节点，通常为数百 TB 或数 PB 数据 |\n\n\n\n"
- "# 物联网\n\n在这十年间，从传感器和控制设备收集数据并进行分析报告的做法日益普及，其价值已清晰显现。早在 20 世纪 80 年代，人们就已开始探讨此类解决方案的价值，并通过连接至互联网的自动售货机进行了初步实验。本世纪初，业界对机器对机器（M2M）通信及其潜在价值进行了大量讨论，甚至有人开玩笑说，你的厨房电器或许正在暗中密谋对付你。然而，人们很快意识到，解决方案的范围远不止设备本身，因此“物联网”这一术语便应运而生，进入了我们的词汇表。\n\
  \n在这类概括性术语诞生之前，许多设备制造商已经通过为其产品配备智能传感器和控制器，增加了从设备收集数据的能力。有些制造商还包含了早期版本的简易数据收集软件。然而，早期传感器和控制器在价格、尺寸以及功能上的局限性，有时也限制了所收集数据的实用性。此外，对于此类数据潜在业务用途的理解尚未普及，用于分析数据的软件也并非最优。因此，即使在数据源处收集了数据，也常常不会进行传输或分析，这些数据往往被直接丢弃。\n\
  \n由于制造产品的设计需要漫长的准备时间，且产品一旦生产出来往往拥有相当长的使用寿命，工程师们始终将传感器和数据收集能力融入到他们设计的产品中。他们预见到，有朝一日，这些数据将在多方面发挥作用。许多工程师意识到，此类数据可用于更好地理解产品质量和组件的潜在故障，实现自动化的服务请求，提供环境因素信息，辅助更优的能源管理，并为数百种其他潜在应用提供数据。\n\
  \n> **注**  \n> 技术狂热者有时会要求我们描述其行业中大数据（特别是 Hadoop）的“杀手级应用场景”。当传感器和智能控制器提供的数据对业务运营至关重要时，他们所寻求的应用场景便会变得清晰可见。他们的大数据用例可能是由分析物联网数据的迫切需求所驱动的。\n\
  \n对传感器的日益增长的需求推动了更多研究，进而实现了传感器的进一步微型化和价格的显著降低。微型化在一定程度上得益于传感器能耗的大幅减少。因此，如今已有数十亿个传感器投入使用，预计到本十年末，这一数字将迅速增长至数千亿。这种不断增长的规模与持续降低的成本，将继续推动传感器应用的进一步创新和动力。\n\
  \n幸运的是，在传感器和智能控制器普及的同时，第二项突破也在发生。这项突破体现在新型数据管理软件能够摄取和分析海量流式数据的能力上。尽管 NoSQL 数据库和\
  \ Hadoop 最初最常用于处理和分析网站流量及社交媒体数据，但事实证明，这些引擎同样是捕获和分析来自传感器和控制器数据流的理想工具。\n\n如今，它们被用于收集和分析来自汽车、喷气发动机、移动设备、健康监测器、运输中物品以及众多其他来源的流式数据。图\
  \ 1-12 简化展示了物联网的关键组件。我们在本章前面介绍的信息架构主要集中在图的右侧，即数据管理和商业智能平台。物联网进一步引入了对数据路由和事件处理、传感器上软件的配置和管理、用于保护中间层数据传输安全的身份访问控制，以及从传感器和设备到企业内网基础设施的适当通信网络的需求。在本出版物发布之时，这些领域新兴且相互竞争的标准和联盟仍对此类实施构成挑战。参与其中的包括开放互联网联盟（端到端物联网架构）、IETF（通信和编码）、AllSeen\
  \ 联盟（近端设备连接性）、IPSO 联盟（数据表示）、开放移动联盟（设备管理和对象注册）以及 Thread 集团（智能家居网络）。工业互联网联盟则致力于为工业应用标准化垂直解决方案，而各种行业团体也在试图定义相关标准。\n\
  \n![A978-1-4842-0986-8_1_Fig12_HTML.gif](img/A978-1-4842-0986-8_1_Fig12_HTML.gif)\
  \  \n**图 1-12.** 物联网组件简化视图\n\n希望分析物联网数据的组织已经采用了多种策略。有些组织自行设计并开发了整个图示架构。其他组织则设计、部署并管理智能传感器代码（通常使用\
  \ Java 编程），同时聚焦于数据的收集与分析，并与通信基础设施提供商合作以支持并保障传输安全。还有一部分组织只专注于数据分析，将通信和传感器智能化的工作交由其他方完成。\n\
  \n我们关于扩展信息架构以纳入 NoSQL 数据库和 Hadoop 集群的描述，将适用于以上所有三种场景。但在本书后续章节中，我们还将介绍物联网所特有的一些额外组件，以及您在考虑智能传感器的通信、安全性和配置时可能需要做出的额外决策。\n\
  \n"
- "# 本书的方法论\n\n本书的其余部分描述了一种用于开发和部署项目的方法论。作者观察到，在前一代项目成功时，这种方法论被普遍采用。现在，它正被应用并扩展到大数据和物联网领域。\n\
  \n我们描述的方法论并非革命性的。它建立在大多数企业架构师所熟知的公认最佳实践之上。我们意识到本书的读者群体远不止具有架构背景的人士，因此接下来我们将介绍广受欢迎的\
  \ The Open Group 架构框架（TOGAF）模型，以及如何将其应用于我们的方法论中。在应用任何方法论来构建下一代信息架构时，尤为重要的是采用我们本章前面描述过的增量方法。\n\
  \n\n\n### TOGAF 与架构原则\n\nThe Open Group 是一个提供企业架构标准与认证计划的全球性组织。`TOGAF` 自 1995 年首次确立以来，已被广泛采用，并为其众多成员组织中的架构设计方法提供了基础。截至本书出版时，已有超过\
  \ 350 个组织参与其中。许多组织参与了定义最佳实践与标准的 The Open Group 董事会、理事会、成员论坛、工作组或技术工作组。\n\n`TOGAF`\
  \ 本身描述了四种架构类型。所有这些类型都适用于定义我们在本书中描述的信息架构。这四种类型如下：\n\n- **业务架构**，由业务战略、治理、组织及关键业务流程构成\n\
  - **数据架构**，包含逻辑和物理数据资产结构以及数据管理资源\n- **应用架构**，描述应用程序如何部署、它们之间如何交互，以及它们如何与业务架构所定义的业务流程相关联\n\
  - **技术架构**，描述所需的逻辑软件、服务器、存储、网络及通信能力\n\n当 IT 专家和架构师定义并开发信息架构时，业务架构往往是四种类型中最容易被忽视的，但它在实现这些项目的整体成功中至关重要。我们在本书中花了一些篇幅来描述如何发掘公司或组织的业务战略及其对运营至关重要的流程。业务组织显然可以驱动技术信息架构的多个方面，例如，可能需要在何处建立数据集市以满足特定业务线的需求。数据治理这一主题在业务和\
  \ IT 领域都是重中之重，并且在多个章节中均有出现。\n\n信息架构的核心是数据架构和技术架构。你会看到我们在讨论收集 IT 需求以及未来状态设计的章节中重点关注这些领域。`TOGAF`\
  \ 所描述的应用架构定义了信息架构中的业务解决方案，以及这些解决方案在基于底层数据和技术架构组件构建时彼此之间的关系。\n\n你或你的架构团队最熟悉的可能是作为标准的\
  \ `TOGAF`。`TOGAF` 标准包含以下部分：\n\n- 对企业架构和 `TOGAF` 关键概念的介绍\n- 一种架构开发方法（`ADM`），描述了逐步开发企业架构的方法\n\
  - 一系列应用 `ADM` 的指南和技术\n- 一个架构内容框架，包括可重用的架构构建块（`ABBs`）和典型的架构交付物\n- 一个企业连续系列，它提供了一个对工件进行分类并展示它们如何随时间被重用和修改的模型\n\
  - `TOGAF` 参考模型，包括技术参考模型（`TRM`）和集成信息基础设施模型（`III-RM`）\n- 一个架构能力框架，为在组织或公司内建立架构实践提供了有用的指南、模板和资源\n\
  \n`TOGAF` 的范围与我们本书中描述的信息架构方法论高度吻合，这并非巧合，因为该方法论基于使用源自 `TOGAF` 的标准架构技术所获得的经验教训。如果你希望获取比本书涵盖范围更详细的关于\
  \ `TOGAF` 的信息，我们强烈建议你访问 The Open Group 的网站：[`www.opengroup.org/TOGAF`](http://www.opengroup.org/TOGAF)。成为其成员可以让你接触到丰富的信息，并且，如果你是一名架构师，还能为你提供机会，成为提供架构思想领导力的社区中的贡献成员。\n\
  \n**注意**\n\n本书的 IT 读者可能还想知道 `ITIL`（原名信息技术基础架构库）在定义信息架构时的适用性。`ITIL` 与 `ISO/IEC 20000`（一项\
  \ IT 服务管理的国际标准）紧密相关，并定义了一个框架和认证流程。最近，`ITIL` 的持续开发由 `AXELOS`（[`www.axelos.com`](http://www.axelos.com/)）指导，这是一家由英国内阁办公室和\
  \ Capita PLC 共同创立的公司。`ITIL` 涉及的五大服务领域是：服务战略、服务设计、服务转换、服务运营和持续服务改进。所提供的 IT 服务水平必须符合组织的业务需求，而这些需求反过来应指导你定义本书后续描述的“未来状态技术架构”。因此，`ITIL`\
  \ 是对 `TOGAF` 的补充，因为它可以帮助你确定如何将架构化的未来状态付诸实践。\n\n\n\n### 我们的成功方法论\n\n本书后续章节重点介绍的方法论包含七个阶段，从早期的概念愿景贯穿到项目落地实施。每个阶段在本书中都有对应章节进行阐述。\n\
  \n我们详细描述的第一个阶段，是建立未来状态信息架构的初步愿景。接下来，我们需要确定所需的业务驱动力和关键绩效指标（KPI）。然后，我们将 KPI 和关键指标映射到数据来源，并确定如何将数据转化为可用的信息。接着评估组织内现有的人才技能。基于前几个阶段收集的信息，我们便可以更详细地设计未来的信息架构。之后，我们需要定义并商定一份路线图，用以描述未来架构的实施顺序。至此，我们便做好了开始实施的准备。\n\
  \n图 1-13 展示了这一过程。该图呈现为一个连续的循环，以表明流程并非在实施阶段就终止了。我们简单看一下每个阶段的具体内容。\n\n![A978-1-4842-0986-8_1_Fig13_HTML.jpg](img/A978-1-4842-0986-8_1_Fig13_HTML.jpg)\n\
  \n**图 1-13.** 成功方法论的各个阶段\n\n> **注意**  \n> 在实践中，方法论的各个阶段有时会重叠。例如，在执行某个阶段时，你可能会发现所需的关键信息缺失，而这些信息本应在上一阶段完成收集。当然，一旦出现这种情况，你必须返回去补全缺失的信息，才能继续当前阶段的工作。\n\
  \n当我们描绘未来架构的愿景时，我们先要对当前状态有基本的了解，并开始推测其可能的演变方向。许多组织面临的一个挑战是，在初始阶段，技术愿景可能与业务愿景不一致。事实上，业务愿景的制定者和潜在赞助方必须驱动技术愿景。因此，我们必须了解当前业务对现有信息架构的利用方式，以及这种利用方式未来可能如何变化。正如我们将在下一章中描述的，愿景阶段主要是关于需求收集和探索可能性边界。\n\
  \n方法论的下一阶段会更深入地审视业务驱动力。业务线负责人和业务分析师会提供更多关于当前业务运营要求以及他们所面临的新挑战的洞见。在此阶段，我们必须理解他们的关键成功因素、业务分析师所需的关键绩效指标，以及必须收集的衡量指标。所有这些都将指导后续的技术架构设计。我们还需开始了解访问这些数据可能带来的潜在业务收益，并根据业务价值和成功机会，开始对项目的不同阶段进行优先级排序。\n\
  \n一旦我们理解了业务分析师需要哪些数据，就必须确定数据来源。业务线负责人和业务分析师在此方面同样能提供帮助。他们可以描述所需的数据质量、他们信赖的数据源以及数据治理要求。此外，他们还能帮助我们了解数据分析的方式、所需的粒度、数据的保留期限以及交付形式（例如，是报表形式、临时查询工具，还是通过数据探索和可视化工具）。他们还能描述由“利用数据及时决策”这一需求所驱动的基础设施可用性要求，以及这些要求对业务的潜在影响。\n\
  \n至此，我们应当已经理解了数据和分析需求。现在可以开始设计未来的技术架构，IT 架构团队将在此阶段深度参与。然而，在开始更详细的设计之前，我们可能想先了解组织内现有人才的技能，以及这些技能（或技能缺失）可能对架构产生的影响。我们还需要清晰地了解当前架构的优势与不足，以及如何通过引入新的软件组件和系统来对其进行扩展。此时，重新定义业务版图所需的成本规模，应已初步显现。\n\
  \n硬件和软件的材料清单很有用，但要真正理解何时能获得正向投资回报，还必须开始评估所构想的各个阶段的潜在实施成本。实施成本通常远高于软件及其他基础设施方面的考虑。根据识别出的技能差距，我们应开始评估系统集成商为弥补这些差距所需的服务成本。此外，还需评估工作范围、实施风险等其他因素。\n\
  \n一旦掌握了这些信息，我们就可以制定一份高层次的实施路线图，并以合理且易于理解的商业案例作为支撑。路线图的目标受众包括将为项目提供资金的高管和赞助方。如果在整个过程中我们工作到位，那么在此阶段应该不会出现太多意外情况。演示的一部分可以是针对将要交付的业务能力进行模拟展示。讨论的重点应围绕优先级以及项目各阶段的顺序是否正确。高管和赞助方还可能询问有关成本的更多细节，这些问题很可能集中在实施成本上。但只要拥有可靠的商业案例，项目获得批准继续推进的可能性就很大。\n\
  \n最后，就是实施阶段本身。如前所述，采用增量式方法可以确保项目轨迹良好且假设正确。在实施过程中，后续阶段可能会根据业务优先级的变化以及在实施中发现的新挑战，重新排序或提前到初始阶段进行。所有这些都必须在避免范围蔓延的前提下完成。除了展示解决方案交付的进展外，跟踪实施成本并定期报告，也能体现问责制的落实。\n\
  \n当项目初步完成，并且你按照商定的蓝图交付成果时，庆祝成功至关重要。然而，业务线和 IT 部门很可能已经开始构思下一步的修订愿景。随着业务需求的变化以及业务分析师对可行性理解的不断深入，这些项目总是在不断演变。因此，这个循环会一次又一次地重复。\n\
  \n在本书的其余章节，我们将对上述每个主题进行更深入的探讨。我们将从理解“可能性边界”开始，定义未来状态信息架构的愿景。\n\n\n"
- '# 2. 评估可能性之艺术


  害怕落后于人可能是一种强大的动力。如今，许多组织开始构建大数据和物联网原型，仅仅是因为他们担心竞争对手正在抢占先机。率先将差异化解决方案推向市场，是初创公司吸引风险投资家资金的共同目标。尽管许多初创公司会失败，但有些却取得了巨大成功，并在新市场中站稳了脚跟，这反过来又威胁到了这些市场中原有的成熟公司。面对新的竞争，成熟公司的首席执行官和高级业务领导者们，并未忘记凭借创新型解决方案率先进入市场所能获得的巨大优势。


  这些组织中的许多还开始专注于依据事实管理业务，而非凭直觉做出决策，后者曾主导他们过去的决策。数据成为了王道，从数据中挖掘出的信息被视为至关重要。能够回溯过去并准确评估所发生事件的能力，已成为一种基本要求。在评估各种方案以及新决策的潜在影响时，利用数据来预测未来也变得越来越重要。


  从表面上看，大数据理应能帮助组织满足这两方面的需求。毕竟，更多的数据种类和更大的数据量应该有助于发现新的事实真相，或者说，许多企业高管都愿意如此相信。而物联网似乎开辟了新的商业可能性，不仅适用于针对传统竞争对手的策略，也适用于在相邻市场开发新战略。


  因此，许多 IT 部门的任务就是制定一项战略，利用大数据开发能对业务产生影响的解决方案。出于许多相同的原因，物联网现在也受到了类似的关注。想要弄清楚这些计划可能在哪里产生价值，一种常见的初步方法是寻找同行业其他公司发现的杀手级用例。另一种方法是尝试通过探索海量的多样化数据，做出重大的、出乎意料的业务发现，并寄希望于出现一些“灵光一现”的时刻。然而，如果对于通过分析所有数据（包括来自传感器、社交媒体、网站和其他流数据源的数据）可能解决哪些业务问题没有一个坚实的假设，这些方法很少能奏效。


  为了提出这样的假设，你的公司或组织或许需要召开一次愿景研讨会。当然，IT 高管、企业架构师和 IT 架构师将会对 IT 的发展方向有看法，并且对大数据和物联网的潜在影响也有所认识。然而，我们正在寻找的用例很可能存在于业务领导者的头脑中。巧合的是，他们可能也拥有为这些项目提供资金的预算。在我们协助组织的规划会议中，描述过此类项目需求的人员包括营销总监、风险管理负责人以及工程副总裁（仅举几例）。


  在本章中，我们将描述如何通过评估“可能性之艺术”，来发现你未来信息架构中可能包含的内容，并推动未来的项目。当你的组织召开这样的研讨会时，你可能会发现许多潜在的项目。但本章概述的技术也将帮助你，对这些期望项目的可行性进行切合实际的早期评估。这样一来，你将能够专注于那些确实获得了足够支持，并且能够对业务产生真正影响的项目。


  图 2-1 强调了我们在方法论中所处的阶段以及本章涵盖的内容。愿景研讨会中的讨论包括对当前和未来业务架构、数据架构、应用架构以及技术架构的评估。由于这只是我们探索过程的开始，一旦我们确立了愿景并确信可能存在值得追求的项目，后续还会有许多阶段。


  ![A978-1-4842-0986-8_2_Fig1_HTML.jpg](img/A978-1-4842-0986-8_2_Fig1_HTML.jpg)


  图 2-1.


  我们成功方法论中的“可能性之艺术”愿景阶段


  ## 了解当前状态


  在描绘我们可能前进方向的愿景之前，了解我们当前所处的位置至关重要。对于当前状态，总是存在业务和技术两种视角。从业务角度来看，我们需要了解我们的业务高管和分析师是否对他们所拥有的信息和数据感到满意。这通常会引发关于他们如何使用数据及其原因、数据粒度、可访问的历史数据广度以及数据质量的讨论。还会讨论缺失的数据源和数据历史，以及添加这些数据将对未来容量需求产生的影响。对数据的及时性需求以及可接受的及时性标准也在讨论之列。


  从 IT 角度来看，我们需要了解当前的关键数据源、数据如何传输以及在何处传输、使用了哪些数据管理系统、以及当前使用或缺乏哪些业务分析工具。除了软件之外，我们还应该了解当前状态架构中服务器和存储组件的能力和使用年限。我们还应该了解，针对业务的服务水平协议是否得到满足，以及当业务必须响应不断变化的条件时，技术基础设施的灵活性和敏捷性如何。




  ### 信息架构成熟度自评估


  对当前信息架构的成熟度进行早期自评估，有助于洞察组织扩展其现有架构的能力。如果某个组织连基础的数据仓库实施都困难重重，那么就不应指望大数据项目能神奇地解决所有问题。事实上，此类项目反而可能阻碍解决业务线更希望优先处理的高优先级问题。


  出版物中存在多种信息架构成熟度评级标准。我们发现，组织通常遵循一条路径：可能从信息和数据孤岛开始，接着是信息和数据的标准化，应用高级业务优化技术，最后将信息作为一种服务提供。图
  2-2 展示了这一路径。


  ![A978-1-4842-0986-8_2_Fig2_HTML.gif](img/A978-1-4842-0986-8_2_Fig2_HTML.gif)


  图 2-2. 信息架构成熟度阶段


  以下是每个阶段所发生情况的定义:


  - **信息和数据孤岛**: 数据跨多个独立的数据集市和工具进行不一致的重复存储，主要由业务线管理，且经常就哪个数据集是真实数据集展开争论。因此，对数据分析所得结果的解读往往受到质疑。

  - **信息和数据标准化**: 集中管理的从属数据集市和企业数据仓库用于报表和临时查询，并关注数据质量、一致性和安全性。IT 部门与业务线协作扩展数据集市并推出新的集市。

  - **高级业务优化**: 引入流数据以增强传统数据源。利用预测分析来更好地理解和预测决策结果。

  - **信息即服务**: 内部开发的可信数据存储和分析工具在公司或组织外部同样具有价值。作为商业合作的好处，为优选合作伙伴提供访问权限。订阅者愿意为这项服务付费，并可以获得访问权限。


  这些阶段并非总是按顺序进行。组织可能同时推进其中几个举措。例如，组织常常在数据孤岛和标准化之间摇摆，尤其是在 IT 部门行动不够快，无法满足业务线不断变化的分析需求时。预测分析和流数据的引入有时会在这种摇摆过程中被探索和实施。


  当然，成功跨越前三个阶段的组织将创造出具有非凡商业价值的东西。此时，一些组织会考虑设立订阅服务，并可能开始与所在行业的数据聚合商展开竞争，因为他们开始将信息作为一种服务来提供。


  在评估组织成熟度时，重要的是要认识到，当您从数据孤岛迈向信息即服务时，IT 部门必须为组织带来的角色和技能也变得更加高级。承接一个新项目时需要考虑的因素之一是：您是否正在为组织引入一套截然不同的技能组合，以及获取这些技能所需的投入是应该花在这里，还是花在那些要求较低但可能同样有利可图的任务上。


  ### 行业当前业务状况


  在制定未来信息架构时，了解行业趋势以及最优秀的竞争对手如何重新定义其信息架构来应对这些趋势也至关重要。请记住，大数据和物联网的引入正在导致许多行业竞争格局的重新定义。一些公司基于以新方式理解数据的能力，正选择进入其他行业，从而开启新的业务切入点和解决方案。


  最具影响力的信息架构项目总是与解决特定业务问题相关联。以下按行业列出了典型的数据仓库项目以及将信息架构扩展到包含 Hadoop 和/或物联网的项目的示例清单。当与组织内的业务目标对齐时，这份清单可能会为您探索新项目领域带来一些想法，这些新项目可能产生显著的投资回报。




  ## 行业应用场景


  ### 农业


  - **数据仓库**：农业生产成本与优化分析、产量分析、农产品大宗商品定价/交易分析。

  - **Hadoop / 物联网**：基于田间传感器和天气数据的耕作模式、施肥、收获成熟度及水分含量的分析与优化。


  ### 汽车制造


  - **数据仓库**：制造成本与质量分析、供应链分析、保修分析、销售与营销分析、人力资本管理。

  - **Hadoop / 物联网**：客户情绪分析、联网车辆分析（包括部件故障、服务需求与服务调度、驾驶历史及自动驾驶汽车）、驾驶员紧急情况检测与响应。


  ### 银行业


  - **数据仓库**：跨金融渠道的客户统一视图、财务分析、欺诈检测、信用评估、人力资源管理、房地产管理与优化。

  - **Hadoop / 物联网**：欺诈检测、风险分析、客户情绪分析。


  ### 通信行业


  - **数据仓库**：定价策略与财务分析、客户支持与服务、营销分析、供应链、物流与流程优化、合规监管、房地产优化、人力资本管理。

  - **Hadoop / 物联网**：社交数据分析、移动设备使用分析、网络质量与可用性分析（利用传感器）、网络欺诈检测，以及面向物联网的扩展网络管理与优化。


  ### 消费品行业


  - **数据仓库**：销售、营销、供应商、制造、物流、消费趋势及风险分析。

  - **Hadoop / 物联网**：促销效果分析（通过社交媒体和店内传感器）、供应链分析、运输途中成品状态分析、零售终端产品陈列分析及风险分析。


  ### 教育与科研


  - **数据仓库**：机构或设施财务分析、人员与人力资本管理、校友档案与捐赠模式分析。

  - **Hadoop / 物联网**：基于传感器数据的学生风险分析、科研传感器数据分析、设施监控与利用率优化。


  ### 医疗健康（支付方）


  - **数据仓库**：医疗成本、医疗质量、风险与欺诈分析。

  - **Hadoop / 物联网**：参保客户情绪分析、风险与欺诈分析。


  ### 医疗健康（提供方）


  - **数据仓库**：医疗成本分析、医疗质量分析、人员与人力资源分析、风险分析。

  - **Hadoop / 物联网**：疾病与流行病模式研究、患者监护、设施监控与优化、患者情绪分析、风险分析。


  ### 高科技与工业制造


  - **数据仓库**：供应商与分销商分析、物流管理、制造质量与保修分析。

  - **Hadoop / 物联网**：车间生产与质量分析、子组件质量分析、产品故障与潜在故障分析、自动化服务请求。


  ### 保险（财产与意外险）


  - **数据仓库**：销售与营销分析、人力资源分析、风险分析。

  - **Hadoop / 物联网**：客户情绪分析与风险分析。


  ### 执法


  - **数据仓库**：物流优化、犯罪统计分析、人力资源优化。

  - **Hadoop / 物联网**：威胁分析（通过社交媒体和视频捕获识别）。


  ### 媒体与娱乐


  - **数据仓库**：观众偏好分析、媒体频道流行度分析、广告销售分析、营销推广分析。

  - **Hadoop / 物联网**：观看习惯分析（基于机顶盒）、娱乐场所客户行为分析、客户情绪分析。


  ### 石油与天然气


  - **数据仓库**：钻井勘探成本分析、潜在勘探点分析、生产分析、人力资源分析、物流优化。

  - **Hadoop / 物联网**：钻井勘探传感器分析（故障预防）。


  ### 制药


  - **数据仓库**：临床试验分析（包括药物相互作用研究、受试者结果分析）、研发与生产财务分析、销售与营销分析、人力资源分析。

  - **Hadoop / 物联网**：临床研究传感器数据分析、社交行为与疾病追踪（通过社交媒体）、基因组学研究。


  ### 零售


  - **数据仓库**：市场购物篮分析、销售分析、供应链优化、房地产优化、物流与配送优化。

  - **Hadoop / 物联网**：全渠道分析与客户情绪分析。


  ### 运输与物流


  - **数据仓库**：设备与机组人员物流及路线规划、销售与营销分析、房地产优化、人力资源分析与优化。

  - **Hadoop / 物联网**：交通优化（基于高速公路传感器数据）、交通安全分析与控制、设备性能与潜在故障分析（基于车载传感器）、物流管理（基于传感器）、客户情绪分析。


  ### 公用事业


  - **数据仓库**：物流优化、电网电力传输分析与优化、客户能源使用分析、人力资源分析与优化。

  - **Hadoop / 物联网**：基于智能电表数据的电网优化与状态分析、主动维护优化。


  ---


  **注意**：上述列表仅代表了 2015 年已部署或进行中的部分项目与实施方案。随着各组织不断发掘该技术的创新用途，并寻求针对先前无法解决的问题的新业务方案，该列表也在持续变化。


  在本书后续章节中，我们将讨论此类项目的优先级排序。优先级排序（以及通常所需的资金支持）要求业务部门与信息技术部门协同合作。当项目定义和优先级排序作为联合活动开展时，项目最终成功的概率将显著提升。




  ## 是否需要新的愿景？


  至此，我们已经对自身的信息架构成熟度进行了自我评估，并审查了一些可能的项目。或许可以通过对现有信息架构进行小幅修改来推进期望的新项目。例如，如果分析所需的数据大多结构化，且数据仓库基础设施完善，那么最有效的做法可能就是在此基础上直接构建。然而，当基础设施与业务需求不匹配时，现在或许是时候构想一个方案来应对这些日益增长的需求了。


  一个显而易见需要修改架构的理由（你可能已经从本书的主题中猜到了），就是识别出那些需要分析数据仓库难以轻松处理的新数据源的业务需求。例如，新的数据源可能包括流式数据或半结构化数据。可能会引入高速、高容量的数据摄取需求。这些需求可能导致将
  NoSQL 数据库和 Hadoop 纳入信息架构，而之前它们可能并不存在或并非必需。探索 Hadoop 的数据科学家可能渴望并推动采用新的信息发现工具和预测分析引擎。


  你如何收集需求，并共同制定未来状态信息架构的愿景？我们合作过的公司和组织通常会召开规划会议（有时称为研讨会）并收集需求。初步的需求收集可能只需两三个小时，但它能帮助确定后续所有工作的方向。


  在愿景制定会议期间，与会者应讨论他们对当前数据仓库、商业智能、ETL 工具及处理流程的满意程度。讨论可能会延伸到包括服务器和存储在内的底层基础设施。通常正是在这个阶段，人们会首次考虑对现有组件进行升级或变更。例如，如果目标数据仓库上的
  ETL 性能及所需资源存在问题，那么考虑利用为处理流式数据源而引入的 Hadoop 集群来充当 ETL 引擎或许是个好主意。实际上，Hadoop 引擎可以成为所有数据的初始着陆点。如果出现了对预测分析的新兴需求，或者正在重新评估如何部署预测分析，那么你也可以探索使用
  Hadoop 集群来处理该工作负载。


  通常在这个阶段，IT 部门的许多人会开始担忧当前信息架构的成熟度是否与正在讨论的愿景严重脱节。IT 部门或业务部门的技能差距可能会变得非常明显。数据治理和运营问题也可能浮现。潜在的预算成本和影响通常是
  IT 高层管理的首要关注点。


  所有这些问题即使在现阶段提出来也是好的。然而，我们才刚刚开始。我们正在构建未来信息架构可能成为什么样子的愿景。我们尚不够了解业务案例（包括是否有业务案例），无法确定我们是否能够推进一个项目。我们也没有关于所需数据的足够细节。这些我们将在后续阶段更好地理解。之后，我们还会更仔细地评估所需技能。当我们开始定义更详细的未来状态信息架构时，我们将开始更好地理解解决方案的潜在成本。


  而现在，我们只是在探索可能性的艺术。


  ## 制定愿景


  愿景通常是在有引导的规划和白板会议中制定的。即使在推测修订信息架构的最初阶段，你也会希望有各种关键利益相关者参与会议。当然，你希望了解当前架构及其组件的架构师和
  IT 管理人员在场。但在这个时间点，组织中业务主管和分析师可能最清楚地知道必须将哪些新的数据源纳入进来，以解决新出现的业务问题。至于数据需要多精细以及数据需要保留多久，业务分析师与
  IT 部门的看法可能截然不同。请记住，现在不是争论的时候。现在是收集每个人需求的时候。


  当然，在会议前做好预习工作并无坏处。如果 CIO 或其他 IT 高级领导不经常参加业务规划会议，那么你需要回顾组织在财报电话会议、财务报表、内部广播和其他内部论坛中阐述的最高业务优先级。你也可以对竞争对手进行类似的研究，因为贵公司的业务主管很可能对竞争压力非常敏感。


  **注意**


  在一些公司和组织中，如果 IT 部门与业务部门脱节，并且不被视为值得信赖或可靠的交付伙伴，我们曾见过 IT 团队试图独立定义和推行他们认为具有普遍意义的信息架构修改。在重新与业务部门建立信任并开展联合愿景制定和规划之前，此类努力往往停留在研发阶段，且几乎没有可自由支配的资金支持。


  为了吸引合适的人员参加会议，你应该在会议前传达愿景制定会议的目标和议程。例如，一个明确的目标可能是：希望就一项 IT 投资的五年计划获得初步意见，以帮助公司提供更好的客户体验。请注意，我们除了
  IT 目标外，也提到了一个业务目标。如果我们希望业务人员参加会议，就需要描述这对他们有什么好处。


  愿景制定会议上讨论的议程大纲可能如下所示：


  - 会议总体目标

  - 与会者自我介绍及自述会议目标

  - 概述需要收集的信息类型

  - 讨论当前信息架构成熟度及其影响

  - 回顾现有信息架构覆盖范围及所提供的业务解决方案

  - 讨论需要改变什么以及为什么

  - 信息架构和业务解决方案如何演进的愿景

  - 讨论后续步骤及其他所需会议


  你应在会议一开始就明确表示，会记录下大家的意见和白板上的画图。你还应提前承诺，会议结束后将提供并分发一份总结所收集信息的报告。




  '
- "# 数据仓库的当前状态与未来状态\n\nIT 部门很可能已经绘制出高度技术性且详尽的状态信息架构图。在我们着手确定可能发生的信息架构演进过程时，这些图表可以作为有用的参考资料。但我们需要简化这些图表，并聚焦于与参与愿景制定的业务领域需求相关的部分。\n\
  \n图 2-3 展示了一家拥有零售商店的企业中，当前状态的数据足迹可能的表现形式，其愿景制定的重点在于提升促销和销售活动的成功率。我们将以此图或类似图表为起点。在该示例中，企业数据仓库（EDW）提供了历史数据库记录。数据从多个\
  \ OLTP 系统（图中展示了 ERP 和 CRM 系统）中提取。数据集市围绕 EDW 分布。业务分析师使用报表、即席查询和分析工具来访问数据集市及/或 EDW。图中还标出了一些当前数据足迹中的关键技术，以便我们在讨论过程中进行参考。\n\
  \n![A978-1-4842-0986-8_2_Fig3_HTML.gif](img/A978-1-4842-0986-8_2_Fig3_HTML.gif)\n\
  \n**图 2-3.** 典型的当前状态信息架构图\n\n在围绕此架构图展开的讨论中，可以深入探讨许多主题。这些讨论中经常出现的主题包括：\n\n*   当前数据的粒度以及\
  \ EDW 中历史数据的时长（以及期望的时长）\n*   数据集市当前的有用性，包括它们之间的重叠、扩展或部署新数据集的灵活性，以及所需的历史数据时长\n* \
  \  当前报表、商业智能工具和仪表盘的有用性\n*   如果同时存在多个功能重叠、用户群体规模不一的商业智能工具，是否可能进行标准化\n*   是否需要具备一致维度（conformed\
  \ dimensions）的维度模型\n*   是否需要预测分析和数据挖掘\n*   对当前查询和分析性能的满意度\n*   是否需要实时告警或建议\n*  \
  \ 第三方数据源的重要性，以及这些数据对一个或多个数据集市的适用性\n*   是否需要额外的数据源来解决新出现的业务问题\n*   EDW 和数据集市当前的数据质量，以及未来期望达到的质量标准\n\
  *   数据更新的频率，以及能否及时将数据交付到 EDW 或数据集市（并最终交付给分析师），以便做出业务决策\n*   对数据安全（包括静态数据和传输中的数据的顾虑）\n\
  *   是否需要更高可用性的 EDW 或数据集市\n\n尽可能多地收集在场所有人的意见，并视需要在白板上做好记录。你需要记录下数据集市、数据源和其他组件的名称，以便大家对讨论内容有一致的理解。\n\
  \n**注意**\n\n如果你对当前状态信息架构只是略知一二，而参加会议的其他架构师想要修正你的图示，请欣然将记号笔交给他们，让他们绘制自己版本的图。他们的图可能与本章提供的插图大相径庭，但看到他们的版本能让在场所有人对当前架构的认知有极大启发。这将有助于建立对现有架构更全面的共同理解，并在确定未来状态架构愿景时，就哪些方面需要改进展开更好的协作。\n\
  \n正如我们刚才提到的，数据安全问题可能会在此次讨论中出现。部分讨论可能由该组织所在行业的特定需求驱动。如果你在某个特定行业或政府机构工作，你可能对必须执行的合规标准已经很熟悉。但如果你在不同行业间提供咨询服务，表\
  \ 2-1 可以帮助说明一些经常被提及的较为通用的标准。\n\n**表 2-1.** 各行业数据安全标准示例\n\n| 行业 | 标准名称 | 描述 |\n|\
  \ --- | --- | --- |\n| 欧盟 | 欧盟数据保护指令 (EUDPD) | 要求所有欧盟成员国采用安全指令 |\n| 金融/银行业 | (美国)\
  \ FFIEC 审计员安全指南 | 定义网上银行安全要求 |\n| 金融/银行与服务 | 格拉姆-里奇-比利雷法案 (GLB 或 GLBA) | 为所收集金融数据的隐私和安全设定要求\
  \ |\n| 金融与零售—支付处理 | 支付卡行业数据安全标准 (PCI DSS) | 支付卡数据安全处理框架：身份验证、欺诈检测与预防 |\n| 医疗保健—病历\
  \ | 健康保险流通与责任法案 (HIPAA) | 医疗数据的访问控制、审计、数据完整性、加密标准 |\n| 美国教育部 | 家庭教育权利和隐私法案 (FERPA)\
  \ | 学生数据（包括成绩、注册、账单）的隐私标准 |\n| 美国政府 | 联邦信息处理标准 (FIPS)，来自 NIST | 定义美国机构的身份验证、加密密钥管理和物理安全\
  \ |\n\n你也可以开始与业务分析师探讨，是否需要易于访问的沙箱，以便他们能根据需要探索来自各种来源的数据。过去，这些沙箱有时被设置在 EDW 中，或作为一次性数据集市提供。近来，一些信息发现工具已经出现，它们自带数据管理引擎，或使用\
  \ Hadoop 进行数据管理。这些工具在探索新数据方面更加灵活、及时，因为它们通常是“无模式”的——换句话说，不需要预先定义模式就能发挥作用。\n\n图 2-4\
  \ 在我们当前状态的数据仓库架构中，加入了信息发现工具的概念。理解通过使用此类工具探索数据所获得的洞察价值，有助于我们了解如何更好地利用 Hadoop 集群中的数据，同时，使用此类工具也可能有助于推动未来数据集市和传统商业智能工具构建的需求。\n\
  \n![A978-1-4842-0986-8_2_Fig4_HTML.gif](img/A978-1-4842-0986-8_2_Fig4_HTML.gif)\n\
  \n**图 2-4.** 信息架构图中的信息发现\n\n请记得从在场的业务分析师那里收集他们确信能够通过实现报表和分析愿景而带来的具体业务收益。他们可能分享关于行业最佳实践的数据，或者研究过自己组织的效率，并提供一些有力证据，说明可能创造的价值。这些信息在后续我们更详细地探讨如何为该项目的商业模式论证、以及如何在竞争性项目中确定其优先级时，将非常重要。\n\
  \n\n\n### 确定 Hadoop 与 NoSQL 数据库的适用场景\n\n现在，我们准备探讨是否需要扩展信息架构以纳入 Hadoop 和 NoSQL 数据库。这种扩展很可能源于需要以比关系数据库技术更高效的方式来处理流式数据和半结构化数据源。\n\
  \n如果你的公司像许多组织一样，可能已经在开展研发工作，试图确定此类数据能带来的价值。如果你的组织已有此类项目，你应将其记录为当前状态的一部分。例如，如果 Hadoop\
  \ 原型正在开发中，或者 Hadoop 已成为生产环境的一部分，你可以探讨以下主题：\n\n- Hadoop 集群的当前数据来源\n- 加载到 Hadoop 集群中的数据所代表的历史时间长度及其当前数据量\n\
  - 希望加载到 Hadoop 集群中的额外数据源\n- 希望存储的数据历史时间长度及其对数据量的影响\n- 当前和未来计划的数据摄取速率\n- 当前和未来计划在\
  \ Hadoop 集群中的工作负载（`MapReduce`、SQL 查询、`Solr`/搜索、预测分析、`ETL` 等）\n- 当前和未来计划的分析工具（商业智能、信息发现、搜索、预测分析、`ETL`\
  \ 等）\n- 对当前理解数据并驱动业务价值能力的满意程度（包括与技能相关的任何挑战）\n- 对数据安全（包括静态数据和传输中数据）的顾虑\n- 对集群中数据的可恢复性和可用性的顾虑\n\
  \n图 2-5 展示了众多在 Hadoop 中分析数据的项目是如何启动的。该图描述了一家拥有零售门店的公司的典型 Hadoop 计划。图中，基于 Hadoop\
  \ 的工作被描绘为与已有的数据仓库及其周边基础设施完全分离。\n\n![A978-1-4842-0986-8_2_Fig5_HTML.gif](img/A978-1-4842-0986-8_2_Fig5_HTML.gif)\n\
  \n**图 2-5.** 在独立的研发工作中使用 Hadoop 和 NoSQL 数据库\n\n在这个理论上的零售门店示例中，业务目标是更好地理解促销和销售活动的成效。数据在购物者购买商品、浏览网站以及进入实体门店时被捕获，随后收集到\
  \ Hadoop 中。表达购物者与该公司进行交易体验的评价数据则从社交媒体收集到 Hadoop。流式数据落地到 NoSQL 数据库集群中，这些集群可以轻松扩展以满足高摄取需求，然后加载到\
  \ Hadoop 中进行分析。\n\n请注意，从传感器收集数据的部分以非常简化的物联网架构视图表示。图中缺失了很多内容，包括配置、安全和其他必要服务。就定义一个如何将所有这一切整合在一起的愿景而言，目前这样是可以的。\n\
  \n### 链接 Hadoop 与数据仓库基础设施\n\n接下来，我们将确定是否需要同时查询和分析驻留在传统数据仓库信息架构和 Hadoop 集群中的数据。了解我们分析师群体的专业水平以及他们为回答业务问题而同时访问两个数据源的频率，将有助于我们确定要推荐的最佳方案。\n\
  \n例如，如果我们需要提供维度模型以便业务分析师探索数据，那么我们要么需要将有价值的数据从 Hadoop 集群迁移到数据仓库，要么提供一个能将 Hadoop 集群用作数据仓库扩展存储的基础设施。如果我们计划提供一个包含两个数据源数据的预测分析平台，那么我们很可能希望所有待分析的数据都驻留在\
  \ Hadoop 集群中。如前所述，我们需要向业务分析师收集联合分析这些不同来源数据所带来的潜在业务收益。\n\n图 2-6 展示了 Hadoop 和 NoSQL\
  \ 数据库如何通常成为现有数据仓库信息架构的一部分。由于我们可能还想利用 Hadoop 进行 `ETL` 处理，我们将以前直接馈送给企业数据仓库的数据源描绘为成为\
  \ Hadoop 的输入。这同样是一个高度简化的示意图。\n\n![A978-1-4842-0986-8_2_Fig6_HTML.gif](img/A978-1-4842-0986-8_2_Fig6_HTML.gif)\n\
  \n**图 2-6.** 链接到数据仓库基础设施的 Hadoop 和 NoSQL 数据库\n\n在愿景构建会议的这个阶段，有时会就数据应托管在何处展开辩论。这些新数据源的数据应该首先落地并在云端进行分析吗？还是数据应该落地到一个包含现有数据仓库和\
  \ Hadoop 集群的本地基础设施中？\n\n数据量以及通过网络（带宽有限）所需的移动量将帮助您决定数据是最适合放在云端、本地还是混合模式。为了了解数据移动量，您需要了解针对各种数据管理系统中数据的查询和分析活动及其位置。这些选项应在技术信息架构得到更好定义后再进行更详细的探讨。届时，您将对设想的业务用例以及解决这些问题所需的数据有更清晰的认识。\n\
  \n> **注意：** 如今，许多组织使用云来快速部署 Hadoop、NoSQL 或数据仓库的研发工作，尤其是在业务价值不明确的情况下；随后，当考虑到整体生产基础设施不断增长的数据量和定制化要求时，再将基础设施引入内部。\n\
  \n\n\n### 实时推荐与行动\n\n显而易见，图 2-6 所描绘的基础架构因数据在点与点之间传输而引入了显著的时延（即延迟）。针对企业可能遇到的某些问题，可能需要提供实时推荐并采取相应行动。例如，当购物者正在网站上选购商品时，你希望在他们浏览网站期间智能地推荐其他商品，而不是在他们离开网站之后才进行推荐。\n\
  \n对于此类场景，我们使用实时推荐引擎来引导购物者，在他们浏览网上商店时向其展示特定产品。关于购买和购物行为的预测分析模型在 Hadoop 集群或数据仓库中进行处理。当然，目标是做出明智的推荐，让购物者购买更多商品，并更快地找到他们想要的东西。推荐引擎中的模型会根据当前的购买模式定期更新，随着时间推移，引擎的推荐能力会变得越来越智能。\n\
  \n在部署了智能传感器和控制器的场景中，对及时行动的迫切需求可能意味着需要在进行分析之前就制定某些规则来驱动行动。这正是当今事件处理和业务规则引擎常被部署为智能传感器解决方案一部分的原因。例如，如果实体店中的传感器开始检测到顾客到达收银台的延误以及不满意的顾客放弃他们想购买的商品，预定义的规则可能会触发设备向正在从事其他活动的收银员发出信号，要求他们开放额外的收银台，以缓解拥堵。\n\
  \n图 2-7 展示了在我们网站中添加实时推荐引擎的情况，该引擎的数据模型在 Hadoop 集群中运行，并定期向引擎提供更新。购物者画像和位置信息被传递给引擎。具体的推荐则通过网站返回给在线购物者。\n\
  \n![A978-1-4842-0986-8_2_Fig7_HTML.gif](img/A978-1-4842-0986-8_2_Fig7_HTML.gif)\n\
  \n图 2-7。\n\n信息架构中的实时推荐引擎与事件处理\n\n我们还展示了在实体店部署传感器的情况下，闭环事件处理和业务规则的加入。除了我们的收银台瓶颈示例，当购物者使用运行我们忠诚度应用的手机进入商店时，我们可能希望开始监控他们的位置，并根据我们收集到的关于他们最近在我们网站上浏览过的商品信息，让我们的销售人员更好地为他们提供帮助。\n\
  \n我们刚才展示的图表对于业务分析师来说可能看起来有点技术性。然而，我们的经验是，此类图表可以帮助业务分析师理解当前基础设施的局限性，以及可用于解决他们问题的数据流和分析选项。这些图表还有助于就为了交付他们所构想的业务解决方案而需要做出的改变，尽早获得大家的认同。\n\
  \n## 验证愿景\n\n愿景规划会议通常以在白板上绘制当前状态和未来状态架构图而告终，这些图通常通过用手机拍照来保存。其他时候，这些图表会保留在活动挂图的可撕页上。会议主持人在讨论当前状态和期望的未来状态期间，也应该收集了大量笔记。这些笔记应包括来自业务部门、IT\
  \ 高级管理层、架构师以及任何其他出席人员的意见。一些笔记可能包含关于未来状态信息架构一旦部署后，将对做出更好业务决策的能力产生何种影响的假设。\n\n现在是时候以更正式的方式总结所有收集到的信息了。这些信息应以报告或演示文稿的形式，反馈给所有参与愿景规划会议的相关方。这样做有助于验证是否已捕获关于未来需求的所有关键信息。这也可能引发对所需内容的进一步澄清。通常，在一到两周内将信息反馈给初始与会者是最佳实践，这有助于维持初次会议中所建立的团队合作精神。\n\
  \n> **注意**  \n> 在某些项目中，我们曾收到请求，要求邀请截然不同的受众参加后续会议，而该会议本意是总结之前规划会议中的发现。这种情况之所以发生，有时是因为原始与会者对讨论过的潜在未来状态架构感到兴奋并分享了这份兴奋，从而吸引了更多利益相关方。在其他情况下，来自其他业务部门的领导者对这个过程产生了兴趣，并希望确保他们的需求也被记录下来。这是一个积极的信号，表明组织中的许多人认为这样的项目具有价值，并且未来有可能获得资助和实施。请记住，如果后续会议更多地侧重于进一步探索，而不是对前期工作的汇报和验证，那么一个好的方法是主动提出撰写一份新版本的报告，然后安排对该版本的另一次汇报和验证。\n\
  \n在愿景规划会议期间所发现内容的汇报报告或演示文稿中，通常应包含以下内容：\n\n*   当前的业务挑战，包括由当前信息架构引发的挑战\n*   当前状态的信息架构描述与图表\n\
  *   新兴的业务需求，可能预期的进一步业务模式变更，以及有效运营业务所需的内容\n*   能够应对需求和挑战的未来状态信息架构图\n*   未来状态信息架构到位后可能实现的业务收益（理想情况下包括这些收益可能的财务规模）\n\
  *   后续步骤，包括本书后续章节中概述活动的日程安排\n\n在某些组织中，我们观察到 IT 架构师希望利用在此愿景规划活动中收集的信息，立即开始未来状态信息架构的详细设计。然而，仍有许多未知因素。我们还没有掌握与业务运营相关的关键成功因素的详细信息，包括所需的关键绩效指标和衡量标准。我们还不清楚如何分项目阶段来实施期望的解决方案，也不清楚各阶段的优先级应该如何排序。\n\
  \n\n正因如此，我们目前尚未形成可靠的商业案例，尽管对于其可能来源已有些初步设想。关于哪些数据源能提供所需指标并对应关键绩效指标，我们的认知极为有限。此外，我们也不确定组织内部（缺乏）相关技能会对部署管理预期解决方案、或利用该方案提升业务运营效率产生何种影响。\n\
  \n现阶段，在项目定义清晰之前，我们仍需进行更多调研与文档编制工作。但至少我们已初步了解调整信息架构的可行性与可能性，并且更清楚应从何处寻找论证依据。此外，我们开始隐约知晓业务赞助可能来自何方。因此，下一步我们将与业务部门合作伙伴共同深入挖掘实际需求。\n\
  \n"
- "# 3. 理解业务\n\n在这个信息驱动的时代，我们正处在数据革命的十字路口。我们正站在利用大数据与物联网革命性技术获取洞察、优化运营、赢得竞争性商业优势的转折点。增强并改造现有数据仓库与分析体系已成为众多组织的当务之急。在开始整合新技术之前，我们应自问几个基本问题：回答“为何”要这样做，以及“如何”使技术支撑业务战略。尽管这些问题看似直观基础，但这正是正确的起点。我们的经验表明，那些在启程前就理解业务驱动因素、关键成功要素及优先级的组织，其成功概率远高于他人。这也有助于在快速有效启动项目时获得必要的内部支持，同时成功实现预期的业务收益。\n\
  \n本章将阐述如何识别与分析组织在制定未来信息架构前的业务挑战与需求。图 3-1 标明了当前所处的阶段。在此阶段，我们开始更详细地揭示所需的业务架构。本书后续章节将带领读者进入技术架构阶段。\n\
  \n![A978-1-4842-0986-8_3_Fig1_HTML.jpg](img/A978-1-4842-0986-8_3_Fig1_HTML.jpg)\n\
  \n图 3-1. 成功方法中的业务驱动因素与关键绩效指标\n\n## 理解业务计划\n\n将业务需求与创新同信息架构计划相连接，有助于加速实现业务价值。我们也能更有效地进行规划。数据来源的增长与变化，以及信息需求模式的改变，给跨业务条线的信息需求预测与优先级排序带来了挑战。通常，利用新技术的架构创新会因无法将新分析能力与预期业务成果对齐，以及缺乏信息需求优先级排序而受阻。组织应以明确聚焦业务成果为方向，制定信息战略以满足数据与分析需求。将信息交付与业务成果对齐，能提升\
  \ IT 响应能力，使投资精准投向最需要的领域。\n\n### 大数据与物联网对业务的影响\n\nIT 提供的商业智能与分析能力有时未能体现对组织的附加价值。如图\
  \ 3-2 所示，在从业务战略到 IT 系统的串联过程中，提出正确问题至关重要：包括业务战略如何塑造业务目标，以及需要哪些信息能力来支撑该战略。我们必须了解关键数据源的位置及潜在数据缺口。基于本书的范畴与重点，我们需明确\
  \ IT 解决方案在哪些环节可能需要纳入大数据与物联网组件。\n\n![A978-1-4842-0986-8_3_Fig2_HTML.jpg](img/A978-1-4842-0986-8_3_Fig2_HTML.jpg)\n\
  \n图 3-2. 为更高业务价值对齐优先级\n\n典型的商业智能与分析应用侧重于分析历史数据，试图回答组织过去表现如何的问题。然而，这种能力可能无法让业务分析师灵活应对并快速调整业务方向。这如同通过后视镜观察已走过的路径。尽管运营分析对于了解过去业务表现至关重要，但引入预测性分析能使分析师前瞻未来、快速反应并影响组织航向，从而提供更高业务价值。鉴于大数据与物联网项目通常具备高数据量、多样性与高速性的特征，统一的企业信息架构中通常同时提供预测性与运营分析能力。这种信息架构方法能助力组织跃升至新的业务效率层级。\n\
  \n**注**  \n通常，大数据项目的创新会因组织无法将新分析能力与明确业务成果对齐，以及无法对信息需求进行优先级排序而受阻。\n\n通常仅有少数几项新技术能力能真正为业务增值，如图\
  \ 3-3 所示。理解这些能力如何切实影响业务至关重要。确定其影响程度并加以衡量的能力，使组织能够更优地规划与执行。\n\n![A978-1-4842-0986-8_3_Fig3_HTML.gif](img/A978-1-4842-0986-8_3_Fig3_HTML.gif)\n\
  \n图 3-3. 需与分析需求对齐的代表性业务价值驱动因素\n\n一些可衡量的典型影响及可能发生的改进包括：\n\n\n\n*   **更高营收**：以市场份额提升和新市场渗透率来衡量。\n\
  \    *   通过构建更丰富的客户画像、吸引新客户、促进创新并实现交叉销售/向上销售，提升销量。\n    *   具备进入/创造新市场的能力，或在价值链上提供新服务以改善营收。\n\
  *   **增强利润**：以商品及服务的直接与间接成本降低，以及营销投资回报率提高来衡量。\n    *   降低供应链中的成本与浪费，并灵活应对营销活动所激增的需求。\n\
  \    *   通过优化定价策略、加强需求与供应管理，提升客户留存率与满意度。\n*   **提升效率**：以设备与系统维护成本及可用性的改善来衡量。\n \
  \   *   延长现有设备寿命、提高可用性与运行效率。\n    *   通过改进需求管理提升设备利用率。\n*   **核心竞争力**：以公众与合作伙伴对公司的正面认知，及其灵活应对外部因素的能力来衡量。\n\
  \    *   提升公司股价与价值，优化合作伙伴关系，加快对竞争威胁的响应速度。\n    *   显著缩短产品上市时间。\n\n**注意**\n\n当大数据与物联网计划仅由\
  \ IT 部门驱动，且只关注技术需求与现有数据时，企业往往最终建立一套分析平台，但这类平台影响力甚微，而无法构建能够提供更高整体业务影响力的统一分析解决方案。\n\
  \n大数据与物联网技术可以在我们刚刚描述的领域提供变革性能力。下一步，我们需要理解它们如何增强我们的信息架构，并带来这些业务收益。图`3-4`展示了一个示例性高层战略地图。此类图表可以有多种变体，并可用于帮助使\
  \ IT 计划与业务战略保持一致。\n\n![A978-1-4842-0986-8_3_Fig4_HTML.gif](img/A978-1-4842-0986-8_3_Fig4_HTML.gif)\n\
  \n图 3-4.\n使 IT 与信息战略对齐业务战略的示例图\n\n### 数据收集方法\n\n理解业务需求，并使 IT 计划与业务目标及战略保持一致，对此类项目的成功至关重要。对于许多此类计划，工作可分为三步：规划探索、初步调研以及与关键干系人访谈。我们在图`3-5`中展示了这一过程。\n\
  \n![A978-1-4842-0986-8_3_Fig5_HTML.gif](img/A978-1-4842-0986-8_3_Fig5_HTML.gif)\n\
  \n图 3-5.\n探索的主要组成部分\n\n#### 规划探索\n\n事前投入时间进行探索规划，将有助于以最高效、最及时的方式收集业务驱动因素、挑战、能力与优先级。其结果将是对所有这一切有更深入的理解。任何主要的规划活动都应由以下要素定义：\n\
  \n*   范围、目标与预计时间表\n*   所需信息、潜在信息来源以及数据收集方法\n\n#### 开展初步调研\n\n在进行访谈之前，我们应做好功课。一些可能提供有价值洞察的来源包括：\n\
  \n*   年度与季度报告\n*   内部业务战略文档\n*   各业务线报告的关键成功指标\n*   行业数据库及任何其他相关的离线信息来源\n*   关键干系人的个人绩效评估与薪酬影响因素\n\
  \n初步调研通常是重要信息的来源，可以帮助我们形成初步价值假设，并在访谈中指导早期提问方向。一般而言，调研范围越广，初步分析就越丰富。尽管高价值数据正越来越多地在线提供，但最佳信息来源往往来自线下。坚持与创造力始终有助于收集尽可能多的信息，以理解支持大数据与物联网计划的潜在业务驱动因素与用例。\n\
  \n#### 进行访谈\n\n在此探索阶段，重点是收集与正在考虑的业务用例相关的额外信息与见解。此阶段旨在收集独家、未公开且独特的信息。通过访谈和焦点小组进行探索是常见的初步研究方法，可以产生定性与定量数据。以下是一些可以访谈的关键样本群体/资源：\n\
  \n*   业务线负责人（例如市场、供应链等部门负责人）\n*   首席财务官及财务支持组织\n*   企业战略部门\n*   首席信息官、IT 负责人及组织内的其他企业架构师与信息架构师\n\
  \n访谈的深度取决于正在探索的用例数量以及所需信息。许多访谈可用于从同一批人那里收集定性与定量数据。收集定量数据需要更具结构化的方法，通常包括问卷与数据收集模板的组合。在可能的情况下，建议进行面对面访谈以高效收集信息并理解业务需求。\n\
  \n小组研讨会与探索会议通常旨在收集定性信息。这些会议使参与者能够对正在考虑的用例发表看法。互动可以产生新想法，交流可能非常有效。通过比较参与者与探索过程中其他关键群体对类似问题的回答，可以了解该群体的观点。\n\
  \n## 识别关键成功因素\n\n对于任何信息架构计划，都应确定一组业务与 IT 成功因素。这些因素将被映射到一个项目上，该项目将定义拟议的未来状态架构。成功因素通常用于解决现有挑战和/或提供能够推动业务创新与差异化的新能力。\n\
  \n\n\n### 业务驱动力\n\n业务驱动力影响组织当前和未来的业务绩效。理解组织及其所属行业的关键业务驱动力至关重要。我们必须了解这些驱动力将如何影响我们提议的未来状态。例如，图\
  \ 3-6 列出了交通行业具有代表性的一些关键业务驱动力。\n\n![A978-1-4842-0986-8_3_Fig6_HTML.gif](img/A978-1-4842-0986-8_3_Fig6_HTML.gif)\n\
  \n图 3-6. 交通公司常常考虑的未来状态驱动力\n\n如今，释放数据的力量通常取决于组织能否在企业层面有效整合结构化、半结构化和流式数据，并构建与业务需求相一致的统一信息架构。作者认为，分析来自物联网和其他大数据源的数据可以带来更好的业务成果。表\
  \ 3-1 列出了交通行业中典型用例的代表性清单，这些用例可对该行业公司的业务产生积极影响。\n\n表 3-1. 交通行业大数据与物联网的重点关注领域\n\n\
  | 业务类别 | 重点领域 | 收益 |\n| --- | --- | --- |\n| 互联交通模式 | 提升安全性 | 利用车辆传感器数据进行早期故障检测、服务警报和排放监测。监控驾驶员行为/模式以进行风险分析和改进指导。通过传感器数据分析预防事故/实现自动制动。\
  \ |\n| | 额外的基于位置的服务 | 通过混搭播客、音乐或新闻，提供基于位置的播放列表。基于车辆位置开发个性化广告活动和警报。 |\n| | 优化导航与改善驾驶员体验\
  \ | 基于实时交通模式的智能路线引导和导航。为操作员提供驾驶室个性化设置。 |\n| | 降低保修成本 | 持续的实时监控和远程诊断将直接带来保修索赔中的成本规避/节省潜力。\
  \ |\n| | 保险远程信息处理与新的数据货币化机会 | 通过分析基于实时驾驶统计数据的风险概况，降低索赔与保费比率。 |\n| 互联交通与企业 | 精准的业务需求规划与物流\
  \ | 改进的仓库和车队管理。优化的需求与生产管理。优化的库存水平和改进的物流，实现可预测的商品和服务交付。增强的合作伙伴关系与整合以改善整个供应链的运营。 |\n\
  | | 优化运营 | 车队管理和保修效率。提供差异化服务，避免代价高昂的公开召回。 |\n| | 更高的业务价值与改善的客户体验 | 增加服务收入。能够推出新的、改进的、个性化的移动服务以获取更高收入。整体成本优化、更好的利润/改进的价格实现。有效且个性化的营销活动、供应链优化以及主动的客户互动。\
  \ |\n\n每个行业和每个组织都有独特的业务用例。我们在第 2 章中对一些可能的用例提供了广泛指导。在发现过程中识别这些用例至关重要。\n\n确定业务用例后，识别支持这些用例的具体成功因素至关重要。我们必须确定关键成功因素、关键绩效指标和所需的关键衡量标准。例如，如果一个组织希望其在线销售额增长\
  \ 10%，我们应该了解当前状态的信息架构是如何衡量销售额的。我们还希望了解如何通过提议的未来状态架构来衡量对销售的影响。如本章后续所述，在构建包含预期收益量化的业务案例时，理解这些内容非常重要。\n\
  \n### IT 驱动力及与业务举措的关联\n\n尽管发掘业务举措是本章本节的主要关注点，但在此讨论 IT 驱动力同样重要。两者之间的协调一致对于开发能够有效满足业务需求的企业级统一解决方案至关重要。\n\
  \n一旦定义了举措的业务用例被确定，就需要进行环境的技术评估和差距分析，以确定当前状态与支持用例所需的未来状态之间的差距。我们在第 2 章中介绍了信息架构成熟度自我评估的概念。在成熟度谱系上，图\
  \ 3-7 也显示了与组织转型的关联性。作者认为，大多数组织目前正从标准化环境向更敏捷和灵活的环境转变。他们正在考虑分析各种数据类型所带来的好处。随着环境变得越来越先进，对实时行动和实时推荐的需求已成为一个期望且可行的目标。如今，许多此类想法都处于\
  \ IT 部门的关注焦点。\n\n![A978-1-4842-0986-8_3_Fig7_HTML.gif](img/A978-1-4842-0986-8_3_Fig7_HTML.gif)\n\
  \n图 3-7. 集成分析成熟度连续体\n\n规划良好的举措会同时考虑业务驱动力和 IT 能力。有时，对技术能力的讨论会开启业务方面更多可能性的讨论。\n\n\
  差距分析可以使组织确保提议的解决方案能够提供支持业务需求所需的能力。以下是与主要考虑领域相关的关键属性列表，这些属性可能推动信息架构变更的需求：\n\n*  \
  \ **战略**：属性可包括总体战略、资本和运营预算、绩效指标、赞助，以及项目和计划论证。\n*   **技术**：属性可描述技术的适当性、适用性、集成性、对标准的支持，以及技术及\
  \ IT 架构在相关负载下的性能表现。\n*   **数据**：属性可包括所有数据类型的数据质量、相关性、可用性、可靠性、治理、安全性和可访问性。\n*   **人员**：可考虑的属性包括技术和分析技能、团队内与团队间协作，以及组织结构、领导力、培训和文化准备度。\n\
  *   **流程**：属性可包括数据采集处理、数据整合、数据集成交互、数据分析、信息分发与消费，以及决策制定。\n\n技术和数据领域尤其值得关注，因为它们之间紧密相连，能够帮助实现业务战略和业务流程中定义的业务需求。随着基础设施变得更加灵活，我们拥有了更多解决方案的可能性。至此，我们将关于人员和组织技能的细节推迟到本书的第\
  \ 5 章讨论。\n\n**提示**：确保所选的技术解决方案在信息成熟度规模的所有主要属性上均经过评估。我们将在本书的多个地方描述如何做到这一点。这对于实现更高的收益至关重要。\n\
  \n\n\n图 3-8 展示了部分有助于定义统一信息架构的关键技术组件和数据属性。至此，我们对未来状态的信息架构如何整合其中某些属性已有了初步构想。当我们构建早期业务案例，以更好地判断一个或多个项目是否具备初步可行性时，我们将开始了解这项工作的潜在范围和可能产生的成本。\n\
  \n![A978-1-4842-0986-8_3_Fig8_HTML.jpg](img/A978-1-4842-0986-8_3_Fig8_HTML.jpg)\n\
  \n图 3-8. 通常定义信息架构的关键组件\n\n识别技术和业务驱动因素将使组织能够选择正确的解决方案，并尽早启动实际项目规划，同时有助于量化对信息技术部门和业务的价值。\n\
  \n## 将举措优先排序，形成早期路线图\n\n当我们踏上转型之旅时，渐进式的方法比大爆炸式的替换更有可能成功。这同样适用于所有信息架构项目，包括大数据和物联网项目。由于其中一些技术足迹在大多数组织中相对较新，它们通常是以试验性方式部署的，可能最初只是在实验室中作为概念验证启动。\n\
  \n要跨越试验阶段，需要理解技术能够驱动的潜在业务成果，以及这些项目是否具有影响力和变革性。如果是这样，并且正在考虑多个项目，则通常根据特定业务成果的重要性和可能存在的潜在资金来确定阶段。项目的资金优先级通常由部署解决方案所能实现的潜在投资回报率决定。在预算范围内，投资回报率最高的项目阶段会获得资金。\n\
  \n你可以设想一个三阶段的方法：从识别举措，到确定业务影响，最后对举措进行优先级排序，如图 3-9 所示。鉴于本章已花费大量篇幅描述如何发现举措，接下来我们将重点探讨如何确定业务影响。\n\
  \n![A978-1-4842-0986-8_3_Fig9_HTML.gif](img/A978-1-4842-0986-8_3_Fig9_HTML.gif)\n\
  \n图 3-9. 优先级排序方法\n\n### 确定业务影响并排列举措优先级\n\n应遵循一致且系统的方法，将可能的项目与业务目标联系起来，并确定项目可能产生的影响程度。如图\
  \ 3-10 所示，业务和流程绩效驱动因素及其结果被映射到成功衡量标准，而这些衡量标准又被映射到项目举措。这种方法可以确保我们能够从项目中捕获对业务的潜在投资回报。\n\
  \n![A978-1-4842-0986-8_3_Fig10_HTML.gif](img/A978-1-4842-0986-8_3_Fig10_HTML.gif)\n\
  \n图 3-10. 优先级排序方法\n\n让我们详细了解一下如何分三步执行此方法。\n\n**步骤 1**：在此步骤中，我们确定最高级的组织目标及其预期的成果。接下来，我们根据这些目标对组织的重要性为其分配权重。为简单起见，我们可以使用低、中、高三个等级（1\
  \ 到 3 分）。如果团队希望粒度更细，可以使用 1 到 10 分的标准来打分。同样，我们将指出这些成果被认为如何影响目标。可以使用 1 到 3 分或 1 到\
  \ 10 分的标准进行评分。在此阶段获得利益相关者的共识至关重要，以确保完全获得认同。评分完成后，每个成果都会有一个加权分数，代表它将如何影响组织目标。（该分数通过将每个业务驱动因素的权重与其对应的成果得分相乘，再求和得到）。图\
  \ 3-11 提供了一个示例评分卡，作为步骤 1 中优先级排序的一部分。\n\n![A978-1-4842-0986-8_3_Fig11_HTML.gif](img/A978-1-4842-0986-8_3_Fig11_HTML.gif)\n\
  \n图 3-11. 优先级排序方法的步骤 1\n\n在制造业/汽车行业中，从不同角度出发，与有效的保修管理相关的一些代表性成果可能包括：\n\n*   **财务**：按产品管理保修成本的能力。\n\
  *   **客户**：为高端产品提供有竞争力保修的能力。\n*   **内部**：关联服务与保修履行以判断是否存在欺诈的能力。\n*   **创新与增长**：将保修作为产品差异化一部分的能力。\n\
  \n**步骤 2**：在此步骤中，我们获取步骤 1 的总分，并将其作为每个成果的相对权重。与步骤 1 类似，我们评估每个成功衡量标准如何影响成果，并计算每个成功衡量标准的总分。图\
  \ 3-12 提供了一个代表性计算示例，用于得出已识别成功衡量标准的分数。\n\n*   继续我们的示例，以下是针对同一视角下已识别成果的几个代表性成功衡量标准：\n\
  \    *   **财务**：减少保修储备基金，节省数百万美元、欧元等。（衡量标准：按产品划分的保修成本）\n    *   **客户**：匹配的保修服务有助于改善产品形象。（衡量标准：产品满意度）\n\
  \    *   **内部**：报告时间从五天减少到按需生成。服务的领先指标通常是保修运营的可视性。（衡量标准：与订单相关的缺陷数及产品更换订单数）\n   \
  \ *   **创新与增长**：通过提供更长周期且有利可图的保修服务来增加销售额。（衡量标准：各时间段内每种产品的保修索赔数量）\n\n![A978-1-4842-0986-8_3_Fig12_HTML.gif](img/A978-1-4842-0986-8_3_Fig12_HTML.gif)\n\
  \n图 3-12. 优先级排序方法的步骤 2\n\n**步骤 3**：接下来，我们获取步骤 2 的汇总分数，并将其作为成功衡量标准的相对权重。然后，我们根据每个已识别的项目举措预计如何影响这些成功衡量标准来为其打分。评分完成后，每个举措都会有一个最终分数，用以表示它预计将如何影响业务成果。得分较高的举措预计将产生更高的业务影响。图\
  \ 3-13 突出显示了在一个代表性场景中，所有已识别举措的最终得分。\n\n*   在我们的制造业组织示例中，可能出现的一些举措示例如下：\n    *  \
  \ 通过构建客户 360 度全景视图，我们可以推出改进后的个性化与移动服务，从而增加服务收入。\n    *   通过持续进行远程诊断，我们可以对车辆进行更好的预防性和主动性维护，从而直接避免成本或节省保修索赔支出。\n\
  \n![A978-1-4842-0986-8_3_Fig13_HTML.gif](img/A978-1-4842-0986-8_3_Fig13_HTML.gif)\n\
  \n图 3-13. 优先级排序方法的步骤 3\n\n**提示**：在成功衡量标准和影响评估方法上达成初步共识，通常能让所有利益相关者站在同一立场。确保所有主要利益相关者都有机会在此过程中投票，以帮助确保获得认可。在影响评估过程中，让众多利益相关者参与打分，将有助于使过程更易被接受，并使分数更准确。\n\
  \n\n\n### 其他优先级考量因素\n\n在各项举措完成评分、其对业务的影响得以量化之后，我们需要对每项举措所需的工作量和资源数量进行早期估算。我们还将开始考虑成本、实施难度、预计实施时间，以及任何其他对举措落地执行至关重要的因素。\n\
  \n尽管各业务条线可能会确定多项举措，但这些额外因素将有助于我们进一步评估各项举措的可行性。图 3-14 是一个示例图表，它将各项举措绘制在一个网格中，比较了战略影响和价值与风险和复杂程度。此类图表可以帮助我们确定优先级和阶段。在此类图表中还可以选择并显示其他坐标轴——所选坐标轴取决于公司或组织的价值取向。\n\
  \n![A978-1-4842-0986-8_3_Fig14_HTML.gif](img/A978-1-4842-0986-8_3_Fig14_HTML.gif)\n\
  \n**图 3-14.** 战略路线图\n\n我们可能还希望在决策中指明其他因素。例如，可以使用不同颜色的气泡来标识转型主题或举措所属的业务条线。可以在气泡周围添加额外的圆圈来表示实施举措所需的时间。可能性有很多。关键是要确保通过这些图表能够做出明智的投资决策，并且我们也会在规划项目阶段时使用它们。\n\
  \n### 制定初步业务案例\n\n在推进关键举措时，拥有支持可行技术解决方案的业务案例至关重要。它有助于证明投资的合理性，也有助于为举措赢得内部支持。现阶段，我们尚不具备制定全面业务案例所需的所有信息。我们还无法提供详细的技术设计，也无法详细估算实施成本。但现在正是开始确定我们设想的项目和未来状态架构是否能够通过业务案例获得合理支撑的好时机。\n\
  \n在这一阶段，为构建一个简单的业务案例，我们将重点关注以下三个领域：\n\n-   **总拥有成本（TCO）：** 在特定时间段内解决方案的直接成本。\n-\
  \   **IT 价值：** IT 流程改进和成本规避的量化体现。\n-   **业务价值：** 特定举措及其用例所带来的业务收益。\n\n我们观察到，当 IT\
  \ 部门和业务部门都参与到业务案例的制定中时，项目最有可能成功启动。这种协同努力能更准确地预测新举措的真实总收益。\n\n如图 3-15 所示，当组织超越单纯计算\
  \ TCO，开始量化预期的 IT 和业务收益时，量化收益的难度和耗时确实会增加。产生这种复杂性的原因在于，需要涉及来自业务条线、IT 和公司的多个团队，并且难以收集高质量的数据点。如果能够预先确定关键绩效指标（KPI），量化相关收益将变得更容易，业务案例的准确性也会提高。\n\
  \n![A978-1-4842-0986-8_3_Fig15_HTML.gif](img/A978-1-4842-0986-8_3_Fig15_HTML.gif)\n\
  \n**图 3-15.** 全面业务案例的主要组成部分\n\n> **注意**\n> 在制定全面业务案例时，应重点关注所有三个重要领域——TCO、IT 价值和业务价值。这将提升手头业务案例的质量和完整性。\n\
  \n业务案例可以帮助组织评估解决方案的各种备选方案。尽管关键技术方面、解决方案实施和集成可行性在筛选潜在方案时起主要作用，但财务业务案例可以打破平衡，帮助推动最终决策，同时验证投资需求。业务案例有助于确定资本支出（CapEx）和运营支出（OpEx）为举措提供资金的程度，或者在组织出于融资需求而希望将资本支出转换为运营支出时，如何实现这种转换。\n\
  \n在着手制定业务案例时，明确全部或部分资金的来源非常重要。例如，资金可能来自 CIO 部门、CFO 部门、各业务条线，或者来自公司资金池。组织中可能存在费用回收机制，或者存在一个可被视为成本中心的中央资金池，因此无需进行费用回收。如果决策者的绩效或薪酬与计划中的在范围举措所解决的业务成果挂钩，我们在与高管讨论时就需要调整我们的“价值语言”。在向决策者制定和提交业务案例时，务必确保考虑到所有这些因素。\n\
  \n在制定业务案例时，确定组织内部资金的核算方式同样重要。这方面可能各不相同，通常通过决策者使用的语言来体现。理解他们语言的细微之处，便能够以与组织相符的方式分析财务状况。例如，一些组织会强调三到五年的运营率分析，因为他们专注于降低运营支出（OpEx），而另一些组织则同等关注资本支出（CapEx）和运营支出（OpEx）。\n\
  \n虽然许多组织已经投资于实验室或概念验证环境来测试诸如 `Hadoop` 之类的下一代信息架构组件，但有些组织已将下一代蓝图部署到生产环境中。在组织已进行此类投资的情况下，重要的是要找出支持业务举措所需的预期增长率、现有设备的使用年限和折旧情况，以及设备是自有还是租赁。这些因素也可能对修订后的信息架构（包括大数据和物联网技术）中的变革性投资的总体案例产生影响。\n\
  \n\n\n## 总拥有成本（TCO）\n\n`TCO` 计算应考虑服务器、存储、软件、系统环境成本、安装及实施成本。所有与解决方案选项相关的硬成本都应纳入审查，包括任何会影响直接成本的额外人员相关投资。以下是针对替代解决方案进行简单\
  \ `TCO` 比较时可能考虑的代表性因素列表：\n\n- **硬件：**\n    - 节点（服务器和存储）、传感器和网络组件的采购成本\n    - 年度支持成本\n\
  - **软件：**\n    - 软件许可成本（数据发现工具、商业智能工具、数据管理软件、应用许可、集成工具以及支持全面解决方案的任何其他适用组件）\n   \
  \ - 年度支持成本\n    - 因采用新技术替换旧软件而节省的任何软件成本\n- **环境考量：**\n    - 电力和冷却成本（我们强烈建议无论资金来源或\
  \ `IT` 部门是否已设立收费机制，都应包含这些成本。）\n    - 数据中心空间成本（对于受空间限制的数据中心而言，这可能是一个非常大的因素。）\n- **安装与实施：**\n\
  \    - 关于解决方案安装与实施成本的最佳初步估算\n    - 解决方案的培训需求及相关成本\n    - 与企业级别其他系统的额外集成成本\n\n通常，我们将独立解决方案的\
  \ `TCO` 与一组预期的 `IT` 及业务效益进行比较。表 3-2 提供了一个 18 节点 Hadoop 集群高层次 `TCO` 摘要的示例。为便于比较，应为每个正在考虑的解决方案选项制定类似的\
  \ `TCO` 摘要。\n\n**表 3-2.** 商业案例中 `TCO` 摘要示例部分\n\n| 类别 | 五年总计 |\n| --- | --- |\n|\
  \ 硬件采购 | `$327,330+$0+$0+$0+$0 = $327,330` |\n| 硬件支持 | `$45,826+$45,826+$45,826+$45,826+$45,826\
  \ = $229,130` |\n| 软件采购 | `$113,400+$113,400+$113,400+$113,400+$113,400 = $567,000`\
  \ |\n| 软件支持 | `$0+$0+$0+$0+$0 = $0` |\n| 场地、电力和冷却 | `$16,367+$16,367+$16,367+$16,367+$16,367\
  \ = $81,835` |\n| 实施、迁移和培训 | `$62,400+$0+$0+$0+$0 = $62,400` |\n| 总计 | `$565,323+$175,593+$175,593+$175,593+$175,593\
  \ = $1,267,695` |\n| 净现值（`NPV`） | `$1,131,397` |\n\n## IT 价值\n\n商业案例的这一部分涉及量化 `IT`\
  \ 流程改进和所实现的成本规避。一些代表性的 `IT` 效益可能包括以下内容：\n\n- **流程改进：**\n    - 能够更快地响应业务需求（由具备敏捷能力的解决方案所增加的价值，该能力可应用于正在审查的项目之外）\n\
  \    - 能够更快地部署解决方案（`IT` 部门的上市时间效益，例如构建一个解决方案所需的时间 vs. 一个可以更快部署的选项）\n    - 修补、配置、问题解决方面的改进（环境的有效维护）\n\
  \    - 增强的监控和诊断能力（生态系统中内置或可用的工具，用于提供卓越的监控和集成能力）\n    - 能够在企业级别集成到组织生态系统中，而非仅限于项目级别的集成（例如，能够轻松与企业级信息架构集成的解决方案）\n\
  \    - 改进的服务水平协议（`SLA`）指标\n    - 来自其他架构因素（如可靠性、可扩展性和标准化）的收益（由于这些因素在很大程度上取决于特定的技术解决方案，因此当规格发生变化时，应经常重新审视。有时，正在考虑的选项在这些方面可能具有变革性能力，并为组织增加显著价值。）\n\
  - **IT 员工生产力提升：**\n    - 由于 `IT` 流程改进而减少的管理工作量（从初始安装、测试、集成到持续的运维和管理所需时间减少，从而释放出时间用于更高价值的活动）\n\
  \    - 能够使用固定资源扩展平台（相比于随着平台扩展而需要增加资源）\n- **成本规避：**\n    - 与正在考虑的其他选项相比，某选项的资本支出和运营支出更低\n\
  \    - 由于解决方案的变革性质，避免了未来的计算和存储采购\n    - 避免 `SLA` 或其他罚款\n\n此列表仅具有代表性。`IT` 效益在不同组织之间差异很大。表\
  \ 3-3 展示了一个简单的 `IT` 效益价值量化示例。\n\n**表 3-3.** 商业案例中 `IT` 价值摘要示例部分\n\n| 效益 | 总成本 |\
  \ 年节省额 |\n| --- | --- | --- |\n| 缩短配置、监控、调优和管理环境的时间 | 用于配置、监控、调优的员工工时：`2000*$65\
  \ = $130,000`（每年一名专职人员） | 成本的 10% `$13,000` |\n| 预测试的补丁包减少了升级和修补的时间，降低了复杂性，减少了手动集成\
  \ | 用于修补、集成和纠正集成过程中出现错误的员工工时：`1000*$65 = $65,000`（每年半个人力） | 成本的 20% `$13,000` |\n\
  | 更快的数据访问 | 用于访问数据、运行查询等的员工工时：`4400*$65 = $286,000`（假设 20 名员工每年工作 220 天，每天 1 小时。如果采用集成度更高的解决方案，可实现更高效益。）\
  \ | 成本的 10% `$28,600` |\n| 减少停机时间和 IT 生产力损失 | 每年发生次数：`4*$42,530 = $170,120`（IT 生产力：根据历史记录或行业基准计算的数据中心宕机平均成本）\
  \ | 成本的 50% `$85,060` |\n| 接口改进 | 员工在美国境外及境内运行查询所花费的工时：`1100*$65 = $71,500`（五名员工每年在境外工作\
  \ 220 天，每天一小时） | 成本的 100% `$71,500` |\n| 高效、更简单的存储管理（配置、调优、复制、克隆、性能监控） | 用于管理环境的员工工时：`5000*$65\
  \ = $325,000`（得益于卓越的存储策略以及数据和信息策略） | 成本的 40% `$130,000` |\n| **总计** |  | **`$341,160`**\
  \ |\n\n\n\nIT 方面的收益可能看起来并不十分显著。对于这类计算而言，这并不罕见。变革性的信息架构项目，例如那些包含大数据和物联网的项目，因其能够提供的业务价值而具有巨大的潜力（本章后面部分将会看到这一点）。IT\
  \ 成本节约通常并非驱动这类项目的主要因素。\n\n请记住，对 IT 和业务收益进行量化时，大约包含 80%的事实数据和 20%的推测，这源于可能存在的各种变化以及一些较难量化的收益。然而，在目前阶段，我们只是想了解可能成为我们商业案例一部分的潜在收益。因此，在这一阶段对所包含的内容保持灵活态度是好的。\n\
  \n> **提示**\n>\n> 随着组织开始制定复杂的商业案例，我们建议为所声称的每一项收益至少收集三个数据点，以确保收益合理，并代表一个可能的价值范围。这三个点通常分别代表保守、务实和积极的收益预测。\n\
  \n在许多场景下，预期收益可能会因所做的假设不同而有很大差异。表 3-4 展示了如何使用三点法（定义保守、务实和积极的收益预测）在多种场景下计算相同的节余：\n\
  \n**表 3-4.** IT 价值驱动因素的详细计算示例\n\n| 说明 | 保守 | 务实 | 积极 |\n| --- | --- | --- | ---\
  \ |\n| `[a]` 支持该环境的管理员数量（来源：模型输入） | 1 | 1 | 1 |\n| `[b]` 每位管理员的完全负担劳动力成本（来源：模型输入）\
