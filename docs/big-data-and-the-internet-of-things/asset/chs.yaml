- "# 6. 设计未来状态信息架构\n\n在早期的愿景会议中探索“可能性艺术”时，我们已初步接触了信息架构的当前状态和可能的未来状态。尽管这些练习很有价值，但我们当时只是浅尝辄止地评估了当前状态中的关键组件。那时，我们利用有限的知识开始设想未来可能需要的增强功能。随后，我们对潜在的业务用例有了更深入的了解，并在业务部门的帮助下准备了业务信息地图。这些需求以及期望的未来状态业务信息地图现在将帮助我们进一步理解当前信息架构中的差距以及它必须如何变革。在定义未来状态架构的发展方向时，我们还会考虑对组织内现有技能的初步评估。\n\
  \n在本阶段开始设计未来状态信息架构时，我们首先要捕获当前状态信息架构的更详细视图，并探索当前存在的各种组件。您可能还记得，我们在第 1 章中对大数据和物联网项目中通常部署的关键技术进行了初步介绍。现在，我们将从架构的角度来审视它们。在本阶段，我们还将捕获有关这些组件所需属性的详细信息，以及这些需求将如何影响未来状态的设计。一旦收集到这些信息，我们将把当前状态的业务信息地图映射到架构上，以验证我们是否已捕获所有相关组件。\n\
  \n在该方法论的前一个阶段，我们还收集了未来状态的业务信息地图。我们很可能会发现，现在需要在信息架构中提供新的能力，以支持业务运营方式中设想的变革。未来状态的业务信息地图可以帮助我们确定提供和处理所需数据所需的额外数据源和数据管理系统。因此，我们将利用这些需求来创建我们的未来状态信息架构。在引入这些新组件时，我们将重新审视未来状态版图中所需的其他各种能力。\n\
  \n本章结束时，我们将准备好着手制定项目获得资金至关重要的路线图。我们将对当前项目的范围有更清晰的认识。我们不仅会理解技术组件，还会更好地理解成功可能需要的额外技能。我们将开始思考如何分阶段交付未来状态信息架构和业务解决方案，从而使这些阶段与我们当前的状态以及未来的发展方向最佳对齐。\n\
  \n图 6-1 说明了我们在成功方法论中的当前阶段。它还概述了本章的重点。\n\n![A978-1-4842-0986-8_6_Fig1_HTML.jpg](img/A978-1-4842-0986-8_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 在我们的成功方法论中设计未来状态架构阶段\n\n与之前涵盖业务信息地图的章节类似，本章关于信息架构的内容也分为两个部分，分别聚焦于当前状态和未来状态。在本章中，我们将首先专注于记录当前状态的信息架构，并验证我们之前绘制的当前状态业务信息地图。第二部分将逐步定义未来状态的信息架构，该架构将交付与之前创建的未来状态业务信息地图相一致的能力。\n\
  \n## 当前状态信息架构\n\n我们开始此阶段的工作，需要足够详细地探索当前状态的信息架构，以便理解它对我们正在规划的项目的影响。我们将探索的关键组件包括当前的数据源、数据集成工具、事件处理（在物联网部署中尤为常见）、用于分析的数据管理系统、数据集成工具、信息访问应用程序和工具，以及其他用户界面。我们将部分地通过绘制架构的概念版本来描述这些组件。\n\
  \n我们还将评估底层安全性和数据治理、共享服务以及服务器和存储基础设施。我们将从盘点所有组件及其角色开始。我们还将评估它们在满足当前期望方面的表现如何。此过程的一部分通常包括对现有供应商的盘点，以及他们当前提供的组件对组织未来发展是否具有战略意义。\n\
  \n### 数据源\n\n当前信息架构将包含许多不同的数据源。其中一些将是文档完善的内部系统，例如企业资源计划系统、供应链系统、客户关系管理系统和财务系统。在某些行业中，我们会发现其他文档完善的企业级系统，它们对业务运营至关重要。例如，在金融服务业，我们会发现银行的信息架构会包含资金管理系统。这些内部系统通常托管关系数据库，这些数据库非常适合在线事务处理，因为数据高度结构化且更新频繁。\n\
  \n其他提供关键数据来源的系统可能文档记录不那么完善。这些有时包括业务部门用来填充特定部门数据集市或电子表格的外部数据源。根据这些数据生成的报告可能被视为业务运营的关键。如果我们在方法论的前期阶段工作做得好，我们应该已经在业务信息地图中记录了这些数据源。此类数据源的一个例子是营销信息的外部数据聚合器。数据聚合器能够提供更广泛的行业数据，这些数据是无法从现有的内部数据源中收集到的。\n\
  \n即使其他现有的内部或外部数据源尚未集成到更广泛的企业信息架构中，此时也可能会被盘点。例如，来自内部网站的点击流数据目前可能大部分未被使用。传感器可能已部署在设备上，但数据可能至今未被处理。提供对组织重要的客户情感和其他特性报告的第三方可以分析社交媒体数据。然而，第三方可能不提供实际的原始源数据。\n\
  \n我们对所有这些数据源的理解将有助于我们后续审视未来的业务信息地图，并开始理解可用数据中的差距。图 6-2 展示了典型的数据源，这些数据源是我们概念性信息架构图的起点。\n\
  \n![A978-1-4842-0986-8_6_Fig2_HTML.gif](img/A978-1-4842-0986-8_6_Fig2_HTML.gif)\n\
  \n图 6-2. 概念性信息架构图中展示的数据源\n\n在开发表示当前数据源清单的概念图时，我们还会收集关于这些源目前提供的服务级别的其他信息。我们这样做是因为这些服务级别可能会影响我们未来交付所需商业智能和分析解决方案的能力。\n\
  \n我们可能收集的一些关键属性包括以下内容：\n\n\n\n*   可用性：\n    *   源系统是否提供 99.999% 的可用性？\n    *   需要达到什么级别的可用性？\n\
  \    *   是否存在用于灾难恢复的第二个站点，并且是否强制要求有第二个站点？\n*   可恢复性：\n    *   数据归档策略是什么？\n    *\
  \   如果数据已归档，恢复数据需要多长时间？\n    *   数据恢复时间范围是否满足业务需求？\n*   性能：\n    *   源系统是否有保证的性能级别？\n\
  \    *   如何管理源系统以满足性能级别要求？\n*   数据粒度：\n    *   数据的详细程度如何？\n    *   源系统中保留历史数据的时间是多长？\n\
  \    *   所需的详细程度和历史数据长度是否会随时间变化？它们是如何变化的？\n*   数据安全与治理：\n    *   源系统当前对静态数据采取了何种安全措施？数据是否已加密？\n\
  \    *   实施了何种访问控制安全策略？某些数据字段是否对特定业务用户进行了编辑处理？\n    *   现有的安全措施是否满足行业标准（例如医疗行业的\
  \ HIPAA 或金融交易的 PCI）的要求？\n    *   整个基础设施是否保持了相同的安全标准？如果没有，它们有何不同？\n\n## 用于分析的数据管理系统\n\
  \n接下来我们要探索的信息架构的主要部分，包括用于数据分析的数据管理系统。这些系统包括我们通常使用关系数据库部署的数据仓库和数据市场。一些数据市场的变体可能使用\
  \ OLAP 技术部署。越来越多的 Hadoop 集群被部署来在此架构中发挥多种作用。各种类型数据管理系统的组合通常统称为“逻辑数据仓库”。\n\n如今，Hadoop\
  \ 集群可能用于处理来自传感器和其他来源的流式数据。它们也可能充当所有数据的着陆点，并作为预测分析的首选位置。Hadoop 集群还可以充当高度并行化且高性能的\
  \ ETL 引擎。\n\n当然，对当前用于分析的数据管理系统的讨论，自然会引向关于这些数据管理系统如何填充数据的思考。虽然在数据质量和数据合理化是流程一部分的情况下，ETL\
  \ 工具是流行的选择，但有时仅需提取和加载过程就已足够，因此会部署更轻量级的引擎。在加载 Hadoop 集群时，有时会使用现有的原生工具（如 Flume）进行数据加载。\n\
  \n图 6-3 展示了随着我们添加用于分析的数据管理系统和关键集成组件，我们的信息架构概念图的演进过程。在这个当前状态图中，我们展示了 ETL 处理与 Hadoop\
  \ 集群独立进行。\n\n![A978-1-4842-0986-8_6_Fig3_HTML.gif](img/A978-1-4842-0986-8_6_Fig3_HTML.gif)\n\
  \n图 6-3.\n\n添加到概念图中的用于分析和集成的数据管理系统 注\n\n如果组织已经部署了物联网解决方案并正在处理传感器数据，那么传感器数据将被加载到一个分析数据管理系统中，这很可能是一个\
  \ Hadoop 集群或 NoSQL 数据库。鉴于通常需要针对事件做出实时响应，您可能会发现定义了业务规则来提供这种响应。这些规则将使用事件处理引擎来实现。您还可以在图\
  \ 6-3 中看到事件处理被展示为一个组件。\n\n在收集有关当前数据仓库、数据市场和 Hadoop 集群以及它们如何填充的信息时，在确定这些系统和工具的特性时，我们应提出可能包括以下方面的问题：\n\
  \n*   模式：\n    *   数据仓库的模式是第三范式、星型模式还是混合模式？\n    *   数据市场中存在何种类型的模式？\n    *   如果存在多个数据市场，维度在各个数据市场之间是否一致？\n\
  *   可用性：\n    *   数据仓库和/或数据市场和/或 Hadoop 集群和/或 NoSQL 数据库的可用性要求是什么？\n    *   网络的可用性要求是什么？\n\
  \    *   是否有灾难恢复计划？计划内容是什么？\n*   可恢复性：\n    *   作为逻辑数据仓库一部分部署的各种系统的数据归档策略是什么？\n\
  *   性能：\n    *   是否有任何系统有保证的性能级别？\n    *   它们如何被管理以满足这些性能级别？\n    *   是否将内存数据库作为部署足迹的一部分？内存解决方案的影响和/或局限性是什么？\n\
  \    *   如果部署了 Hadoop，它是否利用了 YARN 和 Spark 技术？\n*   数据粒度与容量：\n    *   每个系统中存储的数据的详细程度如何？\n\
  \    *   每个系统中保留历史数据的时间是多长？\n    *   每个系统中的数据量（原始数据和压缩数据）是多少？\n    *   当前系统中数据量的增长速度有多快？\n\
  *   数据安全与治理：\n    *   逻辑数据仓库当前具有何种级别的数据安全？\n    *   各个系统之间的安全级别是否一致？\n    *   安全级别是否达到/超过行业标准（例如医疗行业的\
  \ HIPAA）？\n    *   每个系统中的数据是否已加密？通过网络传输时数据是否已加密？\n    *   每个系统中如何管理访问控制？\n*   数据加载：\n\
  \    *   ETL 是如何处理的（例如，转换发生在何处，以及处理的并行化程度如何）？\n    *   数据加载的频率如何，加载需要多长时间？\n   \
  \ *   系统之间移动的数据量以及提取和加载过程中使用的映射是什么？\n    *   如果存在 Hadoop 集群，数据摄入 Hadoop 的速率是多少？\n\
  \    *   是否使用 NoSQL 数据库作为 Hadoop 集群的前端以加速数据摄入或采用其他技术？\n*   数据质量与含义：\n    *   数据质量分析和数据质量改进是否是\
  \ ETL 处理的一部分？\n    *   是否为构成逻辑数据仓库的系统中的数据定义了元数据（并且是否也通过 ETL 工具进行了定义）？\n\n\n\n###\
  \ 数据分析工具与接口\n\n我们将记录的第三个主要领域涵盖现有的数据分析工具与接口。这些工具供业务分析师和数据科学家用于理解业务，但也包括非专业业务决策者和管理人员使用的简单工具。许多工具提供对已发生事件的回顾，但另一些工具还能针对决策对未来业务结果的影响进行预测性分析。\n\
  \n提供的最简单工具将报告业务成果。它们可能直接从`OLTP`源系统收集数据以显示业务当前状态，或从逻辑数据仓库中的任何数据管理系统收集数据。\n\n一些业务分析师可能通过即席查询来自行创建报告，并使用即席查询与分析工具来应对不断变化的业务需求。这些工具可指向逻辑数据仓库中的任何数据管理系统。当需要高数据质量并需要引导式下钻时，它们最常指向数据集市或采用混合模式结构的企业级数据仓库。\n\
  \n当需要探索数据集市或数据仓库模式不支持的新型数据组合时，信息发现工具可提供相应手段。这些工具可以访问逻辑数据仓库中任何位置的数据，既可直接从各种来源提取数据，也可访问作为企业数据枢纽（例如，作为所有数据的汇集点）的`Hadoop`集群中的数据。此类工具底层的数管理引擎是“无模式”的，支持对数据进行自由形式的探索。\n\
  \n最先进的业务分析师、统计学家和数据科学家可能使用数据挖掘和预测分析工具。这些工具通常也用于分析逻辑数据仓库中任何数据管理系统中的数据。它们提供的数学算法用于对数据建模并分析结果模式。当模型经过优化后，它们便用于指示未来事件的可能结果。\n\
  \n任何这些工具都可能用于生成所需的洞察力，不仅用于展示已发生或将要发生的事件，还能帮助定义在观察到特定结果或行为时可以自动运行的特定业务流程。您可能会发现已部署的补充技术包括：在商业智能工具中触发的业务流程执行语言（`BPEL`）脚本，或利用预测分析的实时推荐引擎。\n\
  \n图 6-4 展示了我们添加数据分析工具与接口后信息架构概念图的进一步演进。\n\n![A978-1-4842-0986-8_6_Fig4_HTML.gif](img/A978-1-4842-0986-8_6_Fig4_HTML.gif)\n\
  \n图 6-4.\n添加到概念图中的数据分析工具与接口\n\n进一步审视现有的工具与能力时，在确定其属性过程中，我们可能会提出以下问题：\n\n- **报告：**\n\
  \    - 报告生成的频率如何，以及谁在使用它们？\n    - 数据源是什么，如何访问它们（例如，通过`SQL`直接访问、通过供应商特定选项访问，或通过`Hive`等通用接口访问）？\n\
  \    - 为了满足业务需求，报告必须达到多高的可用性？\n    - 驱动报告需求的业务要求是什么？\n- **即席查询与分析工具：**\n    - 谁使用即席查询与分析工具？\n\
  \    - 数据源是什么，数据更新频率如何，如何访问数据，以及访问频率如何？\n    - 为了满足业务需求，工具及底层数据必须达到多高的可用性？\n   \
  \ - 驱动部署即席查询与分析工具的业务要求是什么？\n    - 通过工具必须满足哪些数据可视化需求？\n- **信息发现工具：**\n    - 谁使用信息发现工具？\n\
  \    - 数据源是什么，如何访问它们？\n    - 什么因素驱动了对信息发现工具的需求？它们是如何使用的？\n    - 工具必须提供哪些数据可视化能力？\n\
  - **预测分析与数据挖掘工具：**\n    - 谁使用预测分析与数据挖掘工具？\n    - 数据源是什么，如何访问它们？为了满足业务需求，工具及底层数据必须达到多高的可用性？\n\
  \    - 驱动使用这些工具的业务要求是什么？这些工具和分析师在满足业务需求方面的成功率如何？\n    - 这些工具必须提供哪些数据可视化能力？\n- **作为输出的自动化业务流程：**\n\
  \    - 执行这些自动化流程对业务有何影响？\n    - 数据源是什么，数据可以在哪里访问（例如，在数据存储或数据流中），以及随着数据处理流程需要多快完成？\n\
  \    - 为了满足业务需求，流程及底层数据必须达到多高的可用性？\n\n### 验证当前的 BIM\n\n如果您所在组织当前的概念信息架构与图 6-4 几乎一致，那么在此抽象层级上，您可能面临相对较少的变更。然而，随着新项目的设计、开发和实施，架构中现有组件的许多细节可能会发生变化。\n\
  \n相反，我们经常发现，大多数组织中更常见的信息架构缺少该图中所示的许多组件。为了说明我们通常发现的情况，让我们再次审视在第 4 章中描述的虚构`LMC`汽车制造商收集的当前状态`BIM`。然后，我们将查看该`BIM`背后公司更可能的当前状态信息架构概念图。\n\
  \n您可能还记得，维护与保修系统的当前状态`BIM`由图 6-5 中的图表表示，我们在此处重现。\n\n![A978-1-4842-0986-8_6_Fig5_HTML.gif](img/A978-1-4842-0986-8_6_Fig5_HTML.gif)\n\
  \n图 6-5.\n已完成的当前状态（第 1 级）“LMC M&W 系统”BIM\n\n该`BIM`图表展示了当车辆在`LMC`维修车间时，能够将车辆中存储的数据下载到车辆数据库中（例如，作为批量诊断）。账户和服务调度数据也存储在该数据库中。车辆中的传感器无法实时直接与数据库通信。\n\
  \n我们预计与当前状态`BIM`中数据流相匹配的`LMC`当前状态信息架构，将类似于图 6-6 中的图表。\n\n![A978-1-4842-0986-8_6_Fig6_HTML.gif](img/A978-1-4842-0986-8_6_Fig6_HTML.gif)\n\
  \n图 6-6.\n与“LMC M&W 系统”BIM 对齐的当前状态信息架构\n\n这里描绘的架构是我们目前在设备和产品中部署传感器时常见的情况。当我们在本章下一主要部分重新审视`LMC`的未来状态`BIM`时，您将看到信息架构必须如何改变，以交付所需数据并满足`LMC`的新业务需求。\n\
  \n\n\n### 底层服务器与存储\n\n到目前为止，我们重点关注了软件组件，但尚未评估基础设施中当前存在的底层服务器、存储和网络基础设施。在我们定义支持数据管理系统及周边中间件的未来状态信息架构时，这些组件很可能也会影响我们的一些选择。\n\
  \n在探索这些组件时，我们需要提出一些问题，这些问题可能看起来与我们之前提出的一些问题有所重叠。但这些问题将向系统、存储和网络架构师提出，他们可能持有与之前不同的观点。以下问题具有代表性，可供我们参考：\n\
  \n-   **服务器：**\n    -   当前的在线事务处理（OLTP）和逻辑数据仓库服务器能否支持当前的工作负载需求，并能轻松适应变化？\n    -\
  \   系统上的当前工作负载是否受到 CPU、内存或吞吐量问题的限制？\n    -   如果服务器配置为高可用性以满足服务水平协议，它们是如何配置的？\n \
  \   -   是否有灾难恢复计划？服务器和存储的配置是什么？\n    -   是否已建立参考配置，或者是否更倾向于使用工程化系统/设备？\n    -  \
  \ 开发和测试系统是否可用？它们是否与生产系统相同？\n-   **存储：**\n    -   存储架构是与服务器分开管理，还是更倾向于使用工程化系统/设备？\n\
  \    -   是否有用于归档数据的信息生命周期管理策略？具体是什么？\n    -   每个系统都有哪些备份和恢复流程？这些流程是否经过充分测试并被证明是可靠的？\n\
  \    -   存储系统对于工作负载需求变化和数据增长的灵活性如何？\n    -   部署了哪种类型的 RAID 策略？该策略如何受到服务水平协议和性能要求的影响？\n\
  -   **网络：**\n    -   当前，集群内部、数据中心内系统之间或组织内部是否存在网络瓶颈？\n    -   采用了哪些网络标准（例如以太网、InfiniBand\
  \ 等）？\n    -   从数据中心外部源移动数据的网络策略是什么？\n    -   为网络制定了哪些服务水平协议？\n    -   通过网络传输数据时，数据是如何确保安全的？\n\
  \    -   数据传输时是否需要遵守行业标准和/或认证级别（例如，医疗保健领域的 HIPAA 和金融交易领域的 PCI）？\n\n上述每个问题的答案都可能提供详尽且技术复杂的细节。此外，务必牢记，部署选择背后也可能存在出于政治考量的组织原因。例如，存储架构组是否因感受到威胁而不赞成使用工程化系统和设备？业务部门是否因\
  \ IT 部门配置和上线新系统所需的时间过长而感到沮丧？如果目标是确保未来状态信息架构的设计能得到关键影响者和利益相关者的广泛认可，那么也必须理解这类问题的答案。\n\
  \n> **注意**\n> 由于某些系统充当数据管理平台，而另一些则支持中间层软件解决方案，因此上述问题的答案可能存在很大差异。必须了解系统和网络在业务运行中的关键程度，以及系统和网络服务水平协议是否已协商好并必须得到满足。许多组织试图标准化其系统和网络的设计、部署和管理，以确保一致的服务质量并简化基础设施。理解组织当前的理念，对于理解未来需求可能如何衍生，以及所述需求对未来状态信息架构设计的重要性至关重要。\n\
  \n### 其他当前状态实践\n\n在评估当前状态时，我们还应该记录当前用于数据管理和中间件软件平台、服务器、存储以及网络组件的监控和管理实践。在设计未来状态信息架构时，我们需要考虑如何引入新组件，而不会不必要地对当前方法造成过多干扰。引入新工具和流程将带来额外的采购成本以及对进一步技能发展的需求。我们需要了解此类变更可能会被接受的程度。\n\
  \n我们还应该了解当前组织如何开发和运营项目。我们应该了解组织在创建新代码以及测试提议解决方案的功能、性能和可用性时所采用的方法论。我们还应该了解在测试环境和生产环境中应用补丁的策略，以及新解决方案通常如何投入生产。\n\
  \n## 设计未来状态\n\n至此，我们已经收集了大量关于当前状态信息架构的信息，包括组织内公认的设计、部署和管理技术。我们将描述当前数据流的业务信息图应用到底层信息架构图上，并确认了其准确性。正如前一章所述，我们也了解了组织中现存的技能，并通过之前的技能评估，能够更好地理解我们承担这个新项目的能力。\n\
  \n现在是时候利用我们收集的新业务需求以及相关的未来状态 BIM，开始用图表来规划我们预计的信息架构了。一旦我们定义了未来状态，我们将探讨引入包括 Hadoop\
  \ 和 NoSQL 数据库在内的新数据管理平台，以及物联网项目所需的其他技术可能带来的影响。我们还将探索运营管理规划的早期阶段。\n\n\n\n### 未来状态\
  \ BIM 与信息架构\n\n在第 4 章中，我们描述了 LMC 更全自动化的维护与保修系统的未来状态 BIM。当时我们开始怀疑，当前的信息架构可能无法为所需的业务解决方案提供必要的基础支撑。\n\
  \n维护与保修系统的未来状态 BIM 重新展示在图 6-7 中。你可能还记得前一章的内容，该图展示了从车辆捕获的传感器数据传输至车辆事件数据库。系统会检测维护事件，并以优化方式安排车辆维修。所有事件都记录在车辆日志数据库中，以便车辆维修时进行后续处理。此外，还会报告一系列关键绩效指标（KPI），描述维护是如何安排的、何时发生以及最终结果如何。如图\
  \ 6-5 先前所示，维护任务和会计数据也存储在车辆数据库中。\n\n![A978-1-4842-0986-8_6_Fig7_HTML.gif](img/A978-1-4842-0986-8_6_Fig7_HTML.gif)\n\
  \n**图 6-7.** 未来状态“LMC 维护与保修系统”BIM\n\n我们所开发的未来状态信息架构图必须产生一种设计，使其与未来状态 BIM 中所呈现的数据流和流程保持一致。图\
  \ 6-8 展示了我们未来状态信息架构图可能呈现的一个示例。\n\n![A978-1-4842-0986-8_6_Fig8_HTML.gif](img/A978-1-4842-0986-8_6_Fig8_HTML.gif)\n\
  \n**图 6-8.** 未来状态“LMC 维护与保修系统”信息架构\n\n图 6-8 中的未来状态图与之前图 6-6 中的当前状态图之间的差异非常显著。图中新增了许多技术组件，包括\
  \ NoSQL 数据库、事件处理、Hadoop 集群和预测分析。来自事务性数据源的 ETL 处理显示为在加载到数据仓库之前先通过 Hadoop 集群进行路由。由于信息架构中提出了重大变更，LMC\
  \ 在向未来状态过渡时必须面对众多涉及设计、部署、维护和技能方面的考量。\n\n### 广泛的未来状态考量\n\n在定义包含大数据和物联网组件的修订后信息架构时，许多组织都面临与我们虚构的\
  \ LMC 案例所描述的类似挑战。由于引入的复杂性增加，基于云的部署策略有时会被视为一种替代方案。如今，未来状态组件的早期测试和开发通常发生在公有云中。然而，随着测试和开发接近尾声，通常会认真审视本地解决方案中已有的数据量以及云中可能存在的数据量。如果基于云的解决方案与本地解决方案之间的数据量和数据移动需求巨大，对网络性能的要求可能会构成挑战。因此，在这一过渡期间，有时会进行评估，考虑是将所有平台重新托管到云中、将架构部署为混合云和本地解决方案，还是将从新数据源收集的数据作为更广泛的本地信息架构的一部分进行托管。当然，每种方法的成本和灵活性权衡也会进行比较。\n\
  \n我们还必须重新评估我们已记录的当前状态部署中所使用的方法将如何应用于未来状态。例如，随着我们从更多样化的来源收集更多数据，数据仓库中的数据量可能会大幅增长。以前被认为足够的管理、调优和备份流程，可能证明难以胜任新需求。现有的报表和即席查询解决方案，在解决新的业务问题时也可能力不从心。因此，我们的关注点应超越新平台，延伸到现有基础设施中必要的变更。\n\
  \n> **注意**\n> 对现有基础设施潜在变更的一个例子，是考虑将 ETL 处理迁移到 Hadoop 引擎，如图 6-8 所示。Hadoop 的高度并行特性使其非常适合处理逻辑数据仓库中经常发生的复杂数据转换。\n\
  \n数据治理是一个在此阶段需要特别关注的话题。我们应重新审视整个基础设施所需的数据质量水平。在将预测分析应用于庞大数据集时，数据质量可能不那么重要（因为考虑到问题解决中使用的统计技术，低质量数据很可能作为噪声被消除）。相比之下，当存在可疑数据时，报表和即席查询解决方案可能会呈现出截然不同的结果。使用此类工具时，通常只希望使用可信数据。因此，在我们未来状态图所代表的信息架构中，企业数据仓库将仍然作为历史记录数据库。如果将主数据管理（MDM）战略作为未来状态战略的一部分来推进，那么它更有可能在企业数据仓库及跨数据集市中得到实施。\n\
  \n如果意图在报表或即席查询中混合来自不同来源的数据，那么在整个修订后的基础设施中保持数据的一致性将是一项挑战。因此，业务分析师必须理解数据血统，以便能够追踪数据在这套混合数据管理系统之间移动时发生的变化。一致的元数据也将极为有用，并且应存在于即席查询与报表工具、ETL\
  \ 工具，以及数据管理系统中定义元数据的地方。\n\n\n\n### Hadoop 注意事项\n\n正如我们在虚构示例中所描述的，基于远程信息处理系统从传感器收集数据并传输的数据特性，将\
  \ Hadoop 纳入 LMC 未来状态信息架构是极具意义的。尽管 LMC 目前的技术差距可能构成挑战，但培养这些技能看来是一项明智的投资。然而，Hadoop\
  \ 还引入了其他一些应予以高度重视的具体注意事项。\n\n来自传感器或其他流数据源（例如社交媒体信息流）的数据量可能非常庞大，并且很可能会持续增长。将数据摄入\
  \ Hadoop 集群需要具有高度可扩展性。为了处理如此庞大的数据量，当前一种常见的架构是在 Hadoop 集群前端部署 NoSQL 数据库，以便根据需要快速扩展。一种可能的替代方案（在本书首次出版时，许多组织正在探索中）是在\
  \ Hadoop 中使用 Kafka 的发布和订阅模型。\n\nHadoop 带来了独特的可用性挑战。目前确保数据可用性的主要方法是对数据进行三副本复制。通常，数据的一个副本会被复制到另一个站点，以提供灾难恢复手段。必须规划好集群离线或通信接口故障时如何处理数据的特殊考量。此外，数据复制通常被视为在其他地方拥有备份副本的唯一可行策略。数据量通常非常巨大，以至于大多数人认为对存储在\
  \ Hadoop 集群中的数据进行恢复是不切实际的。\n\n调整 Hadoop 集群配置的规模也可能具有挑战性。集群中的节点由 CPU、内存和存储组成。所需的原始数据存储和复制量往往决定了当前规模调整活动的主要工作内容。尽管通过首先计算原始数据存储需求，然后将该值与一定数量节点提供的存储容量进行比较（同时除以数据复制因子）来调整集群规模可能很诱人，但这种方法很可能导致失败。\n\
  \n重要的是要记住，集群还必须为 MapReduce 作业和其他工作负载提供临时和工作空间。一个常见的做法是将集群的可用容量调整为原始存储容量的 65% 到 70%\
  \ 左右。例如，如果一个集群拥有 600 TB 的原始容量，复制因子为 3，我们将计算 200 TB（考虑复制后的剩余存储）的 65%，并估算出可以存储 130\
  \ TB 的数据。当然，由于大多数 Hadoop 集群支持不同级别的压缩，且压缩率因数据类型而异，130 TB 的数据存储量仅仅是一个初步且保守的估计。\n\n\
  由于存储容量会随着节点的增加而增长，因此当达到容量上限时，许多人只是简单地向集群添加更多节点。在调整性能大小时，通常也需要增加节点。例如，将数据分散到更多的磁盘和节点上可以减少争用。\n\
  \n随着内存技术（例如 Spark）在处理 Hadoop 数据中扮演重要角色，对适当内存大小的需求变得更加重要。越来越多的信息发现和数据访问工具现在依赖于 Spark。内存处理能力推动了对单个节点更大内存容量的需求（在本书出版时，通常配置为\
  \ 128 到 512 GB），同时也导致向集群添加更多节点。由于内存技术会利用 CPU 中所有可用的核心，因此增加节点所带来的 CPU 核心扩展也很有帮助。\n\
  \n确保集群中各节点间具有足够的互连速度有时会被忽视，但它能为处理各种工作负载提供灵活性。随着生产级性能要求变得越来越高，许多人选择重新评估使用商品化服务器和网络与使用预配置、包含大内存配置和可扩展高速互连的工程化系统和设备之间的权衡。\n\
  \n**注意**\n\n为了获得最佳性能，处理特定工作负载的 Hadoop 集群中的节点应在物理上彼此靠近。虽然在部署本地解决方案时这凭直觉就能理解（例如，通常会将新节点网络连接到与现有节点物理相邻的集群中），但在基于云的公共部署场景中，新节点的配置可以自动化，因此情况并非总是如此。当您尝试配置额外的相邻节点时，可能会发现没有可用的相邻节点或服务器。如果这是一个具有苛刻工作负载需求的生产集群，并且您希望向其添加节点，您的云提供商可能会建议将整个集群迁移到其设施中的另一个位置，或迁移到另一个有足够相邻节点可用的设施。\n\
  \n保护 Hadoop 集群中的数据也需要考虑。Hadoop 安全方面的最新改进应有助于您定义一个安全的环境。可以使用 Kerberos 来保障访问控制的安全。当然，如果\
  \ Kerberos 目前也作为其他拟议和现有数据管理系统的安全机制得到支持和部署，那将对您很有帮助。或者，您也可以决定使用现有的供应商解决方案之一，通过数据仓库或其他查询引擎将\
  \ SQL 查询传递到 Hadoop 集群。对于以数据库为中心的解决方案，您可以简单地利用关系数据库中已有的安全模型，这极大地简化了您部署和维护数据访问控制的方式。\n\
  \n您还应该考虑 Hadoop 集群中静态数据的安全性，以及互连网络和与其他数据管理系统网络连接中传输中数据的安全性。当前 Hadoop 发行版中的加密功能可以保护这些数据。为了跟踪人们如何访问数据以及他们对数据做了什么，您可能希望将审计工具作为未来状态信息架构的一部分。\n\
  \n\n### 物联网考量\n\n本章示例中，我们用作参考的未来 LMC 状态信息架构图（图 6-8）包含从车辆传感器收集的数据。这些数据被传输至一个车辆事件`NoSQL`数据库，并在`Hadoop`中进一步处理。此场景符合许多人对物联网足迹的定义。为此类项目设计未来状态信息架构时，其足迹已从传统数据管理组件扩展到用于数据采集和智能决策的传感器软件。传感器与设备管理、安全及事件处理软件有时被称为中间件组件，它们提供关键功能。将这些组件（包括所需网关）连接起来的网络设计，也是架构定义的组成部分。\n\
  \n图中所示的智能传感器有时由传感器供应商预编程，或需要定制编程。大多数智能传感器支持使用`Java`编程，不过有时也会支持或要求使用其他语言。\n\n传感器和设备管理软件用于注册和管理设备。注册过程可维护设备清单。传感器状态受到监控，检测到问题时可应用诊断程序。传感器和设备管理软件还能管理更新，并为设备和传感器配置软件。鉴于其作用，该软件还应能访问身份目录，以确保只有经授权的更新才能推送到设备。在我们的示例中，LMC\
  \ 不希望恶意指令关闭租赁用户的车辆而可能引发危险情况。\n\n事件处理能在传感器读数检测到特定条件时，立即执行智能决策。应用的业务规则是预编程的，通常与先前在特定条件下可能手动应用的最佳实践相匹配。它们通常直接应用于数据流（使用`Java`等语言）或驻留在`NoSQL`数据库引擎中的数据。在我们的示例中，当车辆部件发生故障、即将发生故障或需要其他维护时，事件处理用于触发在\
  \ LMC 服务部门预约车辆维修。\n\n> **注意：**  \n> 从远程信息处理系统和传感器传输的数据通常首先发送到“云”进行暂存。如果其他关键数据和分析平台托管在云中，这些数据可能保留在云端，也可能传输到本地平台。如本章前面所述，所需的数据量和网络带宽将帮助我们确定要部署的正确架构。\n\
  \n鉴于创建、管理和维护网络的复杂性，大多数组织会与移动通信提供商建立合作关系。然而，在网络可用性、强度和弹性的规格方面进行密切协调至关重要，同样重要的是进行联合工程，以确保传感器与负责处理的数据管理系统之间的通信得以维持。\n\
  \n如第 1 章所述，众多开源组织、标准组织和联盟正在制定数据、通信、设备连接、设备管理和架构标准。有时，这些标准被认为给选择要部署的平台和通信网络增加了进一步的复杂性。我们在图\
  \ 6-9 中展示了通信和数据标准在描述和定义智能设备时发挥的关键作用。\n\n![A978-1-4842-0986-8_6_Fig9_HTML.jpg](img/A978-1-4842-0986-8_6_Fig9_HTML.jpg)\n\
  \n**图 6-9.** 典型物联网设备通信与数据标准\n\n部分行业团体也在定义和采纳特定标准。在定义未来状态时，理解并采纳这些标准对于简化初始部署、确保未来能够支持并对系统足迹进行持续修改至关重要。请参阅本书的附录\
  \ B，其中列出了可供您探索和考虑的标准、开源项目和联盟参考列表。\n\n### 早期运营规划\n\n尽管我们将在第 8 章描述项目实施时重新讨论信息架构的运维落地问题，但在当前设计阶段就开始思考如何实现这一目标并不算早。如果不尽早且频繁地进行规划，可能会导致一个创新的原型无法在生产环境中得到支持。我们在本章中已开始触及将设计投入运营的某些方面。让我们简要看看如何评估手头的任务。\n\
  \n解决方案运维落地的关键任务将包括日常运营、监控、变更管理、应用发布管理、调优、打补丁、硬件和软件更新以及数据保护。要首先评估谁将执行这些任务，通常会准备一张`RACI`表或图。`RACI`是负责（Responsible）、问责（Accountable）、咨询（Consulted）和知情（Informed）的缩写。您将在图\
  \ 6-10 中看到，我们将`RACI`映射到了各项任务及一组人员（利益相关者和业务线负责人、业务分析师和数据科学家、系统管理员、数据库管理员（`DBA`）、存储管理员、网络管理员、应用开发人员以及\
  \ IT 经理）。\n\n![A978-1-4842-0986-8_6_Fig10_HTML.jpg](img/A978-1-4842-0986-8_6_Fig10_HTML.jpg)\n\
  \n**图 6-10.** `RACI`表：未来状态信息架构的运维落地\n\n准备`RACI`表可在多个方面对我们有所帮助。它可以帮助我们确定哪些人员将负责关键任务，从而找出最需要提升技能和接受培训的目标人群。它还可以帮助我们了解所需的运营管理工具类型。被标记为问责的人员很可能会为运营团队争取合适的技能发展，并确保部署合适的管理基础设施的工具和策略。该表还能帮助我们根据不同的任务，确定在哪些方面需要进行持续的沟通。\n\
  \n> **注意：**  \n> `RACI`表因组织而异，并在一定程度上取决于组织信息架构中的组件和策略。虽然本章的示例表体现了典型的角色和职责，但您为所服务的组织准备的版本可能需要进行大量修改。您还可以通过在图\
  \ 6-10 中所示的每个大类任务背后定义详细的子任务，来创建比示例更详细的`RACI`表。例如，您可以为打补丁这个任务创建一个`RACI`表，专门聚焦于管理整个流程的人员。\n\
  \n用于管理`Hadoop`和物联网平台的工具和技术正在快速演进。这种变化是由平台新特性和新功能的引入，以及简化现有功能管理需求所驱动的。虽然各供应商都有专门用于管理其平台的工具，但许多组织在将`Hadoop`和物联网平台引入其信息架构时，也会探索扩展其现有工具。\n\
  \n\n\n### 制定路线图的恰当时机\n\n通过本章所述的活动，我们收集并创建了大量当前技术设计、部署、管理和支持文档以及未来计划。当我们收集完所有这些信息后，应该能更清晰地描绘出未来状态信息架构的蓝图。我们很可能第一次对即将面临的组织变革程度以及当前任务的复杂性有了清晰的认知。\n\
  \n部分参与者可能希望在此刻对技术计划进行精细调整。然而，在方法论的这个阶段，我们仍未获得项目资助。获取资助最关键的一点，是基于项目将带来的潜在投资回报率，获得关键利益相关者和赞助者的支持。在计算回报率时，我们需要了解项目的可能成本。在探究成本时，最大的一部分并非来自技术组件的购买或维护，而是来自于解决方案的构建。\n\
  \n我们此刻是否准备好进入下一阶段，很可能取决于我们有多大把握能够掌控项目的总成本。在我们成功方法论的下一个阶段，收集到的成本数字无需精确无误，但也不能在后来被证明与我们将在资助和项目提案中申请的金额相差一个数量级。我们需要对解决方案有足够的定义，以便有信心在方法论下一阶段，对该项目所能带来的收益、成本及风险进行切合实际的评估。\n\
  \n"
- "# 定义初步计划与路线图\n\n我们未来状态信息架构的设计已在第 6 章中描述。鉴于其设计方式，它应该能提供一个符合组织业务需求的解决方案。现在，我们暂时将技术设计工作搁置。基于我们先前对技能的评估，我们相信能够弥补技能差距，并成功部署和维护该架构（尽管现在必须进一步探索这一点）。到目前为止，我们的赞助者很满意。但是，我们仍不完全了解实施此设计的成本，也不清楚我们何时能开始为业务赞助者和组织交付价值。这可能让赞助者感到担忧，因为我们即将进入需要获得高级管理人员支持并获取项目资金的阶段。\n\
  \n本章将描述我们如何定义未来状态架构部署的初步计划。然后，我们将描述如何制定一份路线图，以回答我们刚才提出的问题并解决其他疑虑。该路线图将面向组织的高管，并提供足够的信息来获取项目资金。换句话说，在这个阶段，项目将获得真正的推进承诺。\n\
  \n通过遵循我们迄今为止的方法论，我们应该为成功获得这种承诺奠定了基础。我们在整个过程中收集业务输入的彻底性，很可能已被潜在的项目资金来源方注意到。我们对技术细节的关注也应该让我们的\
  \ IT 支持者感到兴奋和乐观。因此，提出一份路线图和预算申请应该是意料之中的事，而非一个意外。\n\n在准备路线图时，我们将整合所有收集到的相关背景信息。既然我们已经更好地定义了未来状态信息架构，就可以更深入地重新审视我们认为所需的技能。我们还将重新验证业务优先级，并将其映射到项目阶段。然后，我们将准备好计算分阶段实施的成本，所需技能可能由内部员工、新员工或将要聘请的顾问和系统集成商提供。我们还将收集硬件、软件、网络、其他组件以及持续支持的定价，以便构建更准确的商业案例。\n\
  \n在本章后面部分，我们将涵盖所有这些主题，描述如何为广泛的高管受众准备和交付路线图演示。我们还将描述如果首次资金申请得到的是“不”的答复该怎么办，以及如果答案是“是”，如何过渡到实施阶段。\n\
  \n图 7-1 展示了我们成功方法论中的当前阶段，以及将我们带到这一点的先前阶段。早期所有阶段收集的信息都将为当前阶段做出贡献。尽管项目计划的实施阶段是下一步，但出于多种原因，顺利度过此阶段可能是最困难的一步，我们将在本章中描述这些原因。当然，最重要的原因是组织面临着为项目投入资金的决策，而该决策将产生政治和财务预算方面的影响。\n\
  \n![A978-1-4842-0986-8_7_Fig1_HTML.jpg](img/A978-1-4842-0986-8_7_Fig1_HTML.jpg)\n\
  \n**图 7-1.** 成功方法论中的路线图定义阶段\n\n我们将从重新审视所需技能开始。回顾一下，在第 3 章中，我们描述了一种在零售公司以及与消费者和客户有实体和网络交互的任何组织中正变得流行的全渠道战略。在本章中，我们将以一个全渠道项目作为我们的项目示例。对于此类项目，我们未来状态信息架构的实施显然可以标记为大数据和物联网项目，并且它将需要许多新技能。\n\
  \n## 重新审视早期发现\n\n在第 5 章中，我们列出了为成功定义、部署和管理项目可能需要的一系列广泛技能。我们的技能评估有助于确定我们在哪些方面存在需要克服的重大差距。现在，是时候详细审视这些技能需求了，以便我们能更好地了解开发和获取这些技能的成本。\n\
  \n我们也在更早的阶段开始确定业务解决方案推广的优先级，并在第 3 章中讨论了这一过程。现在，我们可以结合技能差距分析，重新审视我们之前的优先级列表，并进一步细化我们将交付项目业务解决方案的顺序。例如，如果我们拥有所有必需的技能，我们可能希望将项目的部分内容提前纳入交付计划，并推迟项目中需要我们花时间开发或获取技能的其他阶段。\n\
  \n\n\n### 细化我们的技能评估\n\n我们将继续使用此前在第 5 章中描述的技能评估方法。我们在第 5 章展示的电子表格中记录了所需的技能、技能的当前状态以及期望的未来状态。但现在，随着我们聚焦于可能需要填补的技能差距，我们将把先前在电子表格中概述的技能类别细化为更具体的个人技能。理解这种详细程度所需的技能，对于本章后面制定需求建议书（RFP）以及为项目实施和持续管理获取更准确的成本估算至关重要。\n\
  \n我们未来的信息架构可能需要综合运用我们已经掌握的技能以及组织内可能稀缺的技能。我们应该更详细地重新评估所有必需的技能。在本章中，我们将重点关注那些在大数据和物联网项目中可能尤为稀缺的技能。\n\
  \n例如，由于我们为全渠道项目所定义的未来信息架构需要一个 Hadoop 集群，我们发现现在需要进一步调查这些技能在我们组织内的存在情况。有三类关键人员必须掌握此类技能，且对项目成功至关重要：**Hadoop\
  \ 管理员**、**Hadoop 开发者**和**数据科学家**。\n\n`Hadoop 管理员`在大数据平台的定义和部署中扮演着关键角色。他们的技能对于系统后续的成功管理也至关重要。在大多数组织中，这些人员通常隶属于\
  \ IT 部门。他们应具备并需要评估的一些具体技能包括对以下方面的理解和专业知识：\n\n*   `Hadoop` 内核，包括 `MapReduce`、`HDFS`\
  \ 和 `YARN`\n*   集群和/或部署到云基础设施的服务器与存储基础设施规模规划\n*   集群服务配置、监控和故障排除\n*   资源调度和性能调优（以满足服务级别协议）\n\
  *   `Hadoop` 集群可用性（通过在 `Hadoop` 软件和基础设施设计过程中消除单点故障）\n*   数据可用性（通过集群内和/或到辅助集群的数据复制）、备份和恢复\n\
  *   `Hadoop` 数据治理与安全（包括授权与访问控制、认证、数据加密和审计）\n*   `Hadoop` 数据加载（包括用于将流数据加载到 `Hadoop`\
  \ 的 `Flume`，以及用于从关系型数据库加载数据的 `Sqoop`，及其他供应商的加载选项）\n*   部署、配置和管理 `HBase`\n\n使用我们在第\
  \ 5 章中描述的电子表格对该角色进行差距分析，可以生成如图 7-2 所示的图表。该图清晰地展示了我们对当前技能的评估（内层连接的点集）以及我们认为应达到的未来技能状态（外层连接的点集）。两者之间的空间表示我们需要填补的差距。请注意，我们的分析考虑了这些技能是否存在以及这些技能的普及程度。该图表明，我们具备部分技能，但项目成功需要更多掌握这些技能的人员。\n\
  \n![A978-1-4842-0986-8_7_Fig2_HTML.gif](img/A978-1-4842-0986-8_7_Fig2_HTML.gif)\n\
  \n**图 7-2.** 评估 Hadoop 管理员的组织差距分析图\n\n> **注意：** 在刚接触 Hadoop 的组织中，管理技能有时主要存在于研发环境或创新中心。如果组织尚未拥有\
  \ Hadoop 生产环境，则某些所需的“企业级”技能可能尚未完全发展或被充分理解（例如对高可用性、高级安全性和既定服务等级的需求）。\n\n我们应进一步评估的第二类技能属于\
  \ `Hadoop 开发者`。Hadoop 开发者必须掌握构建分析从传感器及其他流数据源传输数据的软件所需的技能。在大多数组织中，这些开发者通常也隶属于 IT\
  \ 部门。他们应具备对以下方面的理解和专业知识：\n\n*   Hadoop 架构与生态系统\n*   用于分析 Hadoop 中数据的 `MapReduce`\
  \ 及其他功能和特性\n*   数据科学（下文将进一步描述）\n*   `Spark`（用于加速性能）\n*   `HBase` 作为列式数据存储，用于提供灵活的数据访问\n\
  \n`数据科学家`有时隶属于 IT 部门，但更常见的是与业务分析师一起在创新中心或业务部门工作。他们应具备的技能包括对以下方面的理解和专业知识：\n\n*  \
  \ 数据访问与操作编程（例如，使用 `Java` 和 `Python` 等语言以及 `MapReduce`、`Pig` 和 `Oozie` 等 Hadoop 特性进行编程的能力，以及优化为\
  \ `YARN`、`Spark` 等开发的应用程序的能力）\n*   使用信息发现工具来理解数据特征\n*   理解如何使用商业智能工具和 `SQL` 访问 Hadoop\
  \ 中的数据（通过 `Hive`、`Impala` 或其他供应商接口）\n*   使用高级分析和机器学习工具与技术（`R`、`SAS`、`Mahout` 等）\n\
  \n如您所见，此处讨论的技能列表比本书前面介绍的更长、更详细。正是这种详细程度开始描述我们项目成功所需的人才类型，并将为撰写职位描述和确定个人期望的认证水平奠定基础。这种详细程度也能更好地指示现有人员可能需要的技能发展和培训的类型与数量。\n\
  \n当使用可扩展的 NoSQL 数据库作为前端接入 Hadoop 集群的摄取引擎时，我们还需要进一步评估我们在配置、管理和编程这些平台方面的技能。典型的管理技能包括安装、配置复制和容错、分片、索引、性能调优、监控以及备份与恢复技能。除了理解如何使用\
  \ `Java`、`Python` 和 `C#` 等语言进行编码外，所需的 NoSQL 数据库编程技能还包括使用语言驱动程序、`JSON`、集合中的动态模式设计、索引以及数据的插入与查询。\n\
  \n如果项目部分依赖于构建物联网生态的其他组成部分，包括智能传感器、控制器和通信骨干网，那么所需技能将变得更加多样化，并且部分技能将属于工程角色，而非 IT 部门。例如，智能传感器开发技能通常存在于电气工程师和软件工程师团队中。\n\
  \n电气工程师在参与传感器开发时需要掌握的一些典型技能包括对以下方面的专业知识和理解：\n\n\n- 微芯片设计\n- 模拟与数字电路设计\n- 电源设计与电池充电\n\
  - 音频电路设计\n- 印刷电路板（PCB）设计、布局与原型制造\n- 射频（RF）设计\n- 无线技术（如`WiFi`、`蓝牙`、`低功耗蓝牙`、`蜂窝网络`、`GPS`和`近场通信\
  \ [NFC]`）\n- 用户界面设计（如`LED`、`按钮`和`开关`）\n- 硬件与传感器集成\n- RFID 集成\n- 根本原因故障分析\n- 元器件分析与优化\n\
  \n参与智能传感器和控制器设计工作的软件工程师可能需要具备以下技能：\n\n- 硬件设备驱动程序\n- 无线模块（如`WiFi`、`蓝牙`、`低功耗蓝牙`、`蜂窝网络`、`GPS`、`RFID`和`NFC`）\n\
  - 控制逻辑\n- 电源管理\n- 安全性\n- 诊断\n- 数据采集\n- 用户界面设计\n- 操作系统（`Linux`、`iOS`、`Android`）及嵌入式固件\n\
  \n建立和维护传感器与分析基础设施之间通信骨干所需的技能，属于网络编程专家以及网络设计师和管理员的专业领域。网络编程专家将与业务分析师和数据科学家合作，了解应用程序工作负载对网络的影响。他们还要与网络设计师和管理员协作，后者拥有丰富的路由、交换和网络可用性知识，以及在管理和保障网络安全方面的知识与经验。\n\
  \n### 再谈项目优先级\n\n在第 3 章中，我们基于战略影响和价值，以及项目存在的风险与复杂程度，描述了一个用于选择项目及确定项目内部优先级的流程。此时，我们开始更清楚地认识到，组织内部技能差距可能给项目成功带来的风险。我们或许会选择此时重新评估我们的项目选择，转而追求一个与我们现有技能更加匹配的项目。\n\
  \n然而，我们所做的项目选择及其战略影响和价值可能极其重大，以至于承担风险是值得的，尤其是当那些被认定为缺失的技能会影响到我们执行其他同样具有高价值的项目时。我们所面临的挑战是，在部署和管理某些关键技能缺失的项目时，能够尽早并频繁地取得成功。\n\
  \n一种常用的技巧是将项目分解为多个阶段，以增量方式交付业务价值。项目先从更容易完成的阶段入手，将更困难的阶段留到后面。例如，我们可能参与了一个将构建欺诈检测解决方案列为高优先级的项目。将所有数据收集到一个充当数据池的`Hadoop`集群中，并在其中执行高级分析，这可能是非常有意义的。但如果目前缺乏及时部署该解决方案的技能，我们可以采取另一种方法。与其这样，我们不如先利用已有的内部技能，通过传统数据仓库解决业务问题，同时在幕后培养`Hadoop`技能，着手部署一个数据池，并计划最终将工作负载迁移到其上。\n\
  \n请记住，无论部署何种技术解决方案，甚至即使它仅仅是一个临时方案，都有可能获得显著的正投资回报率。如果我们能更快地获得期望的业务结果并展示出正投资回报率，那么即使某些技术后来被替换，这笔投入也并非浪费。\n\
  \n对于物联网项目而言，智能传感器的设计与编码，以及通信骨干的建立与管理，可能是组织内部所不具备的全新且迥异的技能。一些组织选择只专注于解决方案的分析层面，而依靠其他组织来构建智能传感器和提供通信网络。\n\
  \n在我们流程的下一步构建商业案例时，了解项目如何分阶段部署就变得非常重要。我们需要收集详细的技术和实施方案成本。虽然我们可以自行收集所有数据，但也有大量的供应商、顾问和系统集成商可以根据他们的经验帮助我们估算成本，从而提供支持。\n\
  \n## 站得住脚的商业案例\n\n一个站得住脚的商业案例必须包含可信的收益。你可能还记得，在第 3 章中，我们采取了一种务实的方法。在我们方法论的那个早期阶段，目标是判断我们是否拥有一个可行的商业案例。现在，我们要确认这一点。\n\
  \n在更早的阶段，我们也对成本进行了非常初步的估算。我们对未来的状态信息架构会是什么样子并不十分确定。我们也完全不知道技能差距可能带来的成本影响。现在，我们准备将可信的成本纳入考量。因此，接下来我们将探讨如何获取真实的成本。\n\
  \n\n\n### 获取真实的成本估算\n\n为了解项目实施及后期持续支持的真实成本，一种常见的方法是让供应商和咨询合作伙伴提供成本估算。通常，这通过提案请求（`RFP`）流程完成。一份典型的`RFP`包含关于服务器、存储、软件、网络以及实施与管理能力的问题，并寻求提供和支持这些项目的成本。\n\
  \n以下是通常涵盖在大数据和物联网`RFP`中的一些关键领域：\n\n- 集群/节点（服务器和存储）技术规格，包括 CPU、内存、存储容量、性能和环境细节，以及定价和支持成本\n\
  - 集群互连技术细节，以及定价和支持成本\n- 数据管理系统软件技术细节，包括性能和可扩展性、可管理性、可用性、功能特性（支持的数据类型、分析能力）和安全特性（用于访问管理、加密和审计），以及定价和支持成本\n\
  - 数据集成软件技术细节，包括性能和可扩展性、支持的数据管理系统和数据源，以及支持数据沿袭和数据质量计划的能力，以及定价和支持成本\n- 数据发现、商业智能和高级分析技术细节，包括性能和可扩展性、支持的数据管理系统和数据源，以及定价和支持成本\n\
  - 智能传感器和控制器技术细节，包括可编程能力、支持的通信协议、安全特性、环境因素，以及定价和支持成本\n- 网络骨干技术细节（用于将智能传感器和控制器连接到我们的分析基础设施），包括支持的通信协议、安全特性，以及定价和支持成本\n\
  - 用于部署和管理上述内容的技术培训课程，包括培训模块的成本\n- 用于优化利用未来状态信息架构所提供数据的业务培训课程，包括培训模块的成本\n- 上述技术组件与项目阶段和交付解决方案相关的实施成本\n\
  - 任何可能提出的其他持续管理、支持或云服务成本\n\n由于`RFP`通常会发送给许多潜在供应商和实施合作伙伴，可能会提出各种解决方案和选项，有时会以截然不同的价格提供截然不同的能力。要提供关于我们需求的适当详细程度，并引导响应者提供一致的信息，需要事先规划。我们希望进行同类比较，而不是把苹果、手风琴和汽车混为一谈。\n\
  \n> 注意\n> \n> 我们明确将此描述为提案请求（`RFP`）流程，而非信息请求（`RFI`）流程。我们的经验是，`RFI`流程通常是组织试图从供应商那里获得教育的一种尝试，但有时它发生的时候与任何真实或紧迫的业务计划没有关联。收到的回复常常答非所问，因为`RFI`中根本没有描述目标。在本章中，我们反而概述了一个与本书前面所述工作相关联的`RFP`流程。这些工作产生了明确可识别的关键业务计划。由于我们之前的努力，我们也了解了自身的技能差距以及未来状态架构的可能面貌。我们依赖合作伙伴来填补空白，建议与我们架构相匹配的具体产品以及能够填补技能差距的人才。在他们提供这些信息的同时，他们也会向我们提供与其建议相关的成本。\n\
  \n在审阅这些`RFP`时，我们应该对部署成功项目的能力建立信心，并且应该对各个部分如何整合以及项目的真实成本有更清晰的认识。现在，是时候接受这些输入并修订我们的商业案例了。\n\
  \n### 修订商业案例\n\n在第 3 章中，我们基于对项目总拥有成本（`TCO`）、IT 价值和业务价值的初步估算创建了一个商业案例。我们`TCO`计算中包含的价值包括硬件采购和支持成本、软件采购和支持成本、环境（占地空间、电力和冷却）成本，以及实施、迁移和培训成本。在评估的那个阶段，我们填入电子表格的成本是基于对未来状态信息架构的初步设想而进行的非常粗略的估算。\n\
  \n完成`RFP`流程后，我们将获得多种方案，这些方案可以映射到我们按照第 6 章所述创建的更详细的未来状态信息架构。该设计基于我们在此过程中发现的真实业务需求。我们可能会在`RFP`回复中发现对我们设计的改进建议，并且我们可能会选择采纳这些建议。最重要的是，我们现在有了一些真实的成本估算可以纳入我们的`TCO`计算。使用之前介绍过的相同计算模型，我们现在来精炼我们的`TCO`计算。\n\
  \n`RFP`回复还可能为我们提供一些最初未考虑到的额外 IT 和业务价值主张。这些可能非常重要，尤其是如果我们最初的成本被严重低估，而修订后的成本使得我们的商业案例看起来存在问题。我们可能考虑的其他成本权衡因素包括：更仔细地审视本地部署计算与基于云的解决方案的成本，以及内部培养技能与聘请顾问和系统集成商的成本。\n\
  \n在大多数组织中，负责提供资金的 CFO 和其他业务高管会询问我们这些成本数字的来源。提供这种程度的细致考察和详细信息，将大大有助于获得对这些数字的信心以及对项目的支持。\n\
  \n## 定义路线图\n\n我们现在可以创建一个初步的实施计划和路线图了。我们在此描述的初步计划将针对 IT 组织，并提供包含当前状态和未来状态信息架构、未来状态架构背后的业务驱动力、项目阶段，以及如何提供项目成功所需的技能、成本和风险等详细信息。这些详细信息将补充我们将在实施路线图演示文稿中提供的信息。\n\
  \n实施路线图是为一个截然不同的受众准备的。我们组织的高管和发起人不太可能关心我们收集的所有详细信息。他们只想了解为什么提议该项目、该项目对组织的价值是什么、可能存在哪些风险以及我们如何克服这些风险、项目将花费多少成本、何时开始交付业务价值，以及他们可以期望获得多少价值。因此，实施路线图演示文稿主要是面向业务的，切中要点，并且仅包含足够准确传达项目全部范围所需的技术信息。\n\
  \n\n\n### IT 初步计划\n\n我们的 IT 初步计划将提供技术受众能够理解的详细程度。汇总我们发现内容的目的，在于解释我们为何以及如何得出未来的信息架构设计，以及实施将如何进行。如果在项目实施过程中计划发生修改，本文档将成为以后重要的参考依据。它还有助于解答我们在即将描述的“实施路线图”演示中提出的详细问题。\n\
  \n根据我们的经验，初步计划通常以两种形式创建。一份详细的文档，用于汇总我们迄今为止在该项目上的所有工作。同时还会准备一份演示文稿，用于详细介绍计划内容，并与技术受众进行讨论。\n\
  \n一份典型的初步项目计划文档包含以下信息：\n\n-   对项目迄今为止历史的讨论（项目何时开始、制定项目计划所遵循的流程，以及参与此流程的人员）\n-  \
  \ 我们的初步愿景成果（发现的潜在业务驱动因素及其对当前架构状态的影响）\n-   关键业务驱动因素和关键绩效指标（包括关键成功因素、已确定的关键衡量指标和业务优先级）\n\
  -   数据源映射以及为交付与我们关键业务驱动因素相一致的信息所必需的分析（业务信息图）\n-   详细的当前状态和最终的未来状态信息架构图\n-   项目阶段以及信息架构随时间推移的演变（包括所需技能、弥补技能差距的方法以及项目各阶段的成本估算）\n\
  -   与不断演变的信息架构项目阶段相关联的、不断发展的商业案例\n-   项目成功所面临的风险\n-   项目批准后的后续步骤\n\n配套的图表将进入技术演示文稿中，需要强调的要点总结也是如此（例如历史、业务驱动因素、技能覆盖计划和风险/风险缓解）。可能会使用类似于图\
  \ 7-3 的图表，从 IT 角度说明和总结主要项目阶段。该图显示了测试和开发何时开始，以及主要任务何时转入生产环境。还将提供其他更详细的图表，深入展示这些任务背后各个步骤的细节。\n\
  \n![A978-1-4842-0986-8_7_Fig3_HTML.gif](img/A978-1-4842-0986-8_7_Fig3_HTML.gif)\n\
  图 7-3. 为 IT 总结的主要项目阶段\n\n注意\n\n随着技术演示文稿在细节和篇幅上的增长，通常需要为 IT 管理层准备一份高管级别的技术演示文稿，总结项目中关键阶段的交付情况。与详细的技术演示文稿一样，它往往比面向更广泛高管受众的路线图演示文稿更少业务导向，我们将在本章下一节对此进行描述。\n\
  \n现在我们已经汇总了迄今为止发现的所有信息，并且确信项目的可行性，我们的下一个目标是获取资金。我们需要创建一份面向业务执行层面的内容版本，这将对组织中的决策者有意义，并有助于推销项目。\n\
  \n### 构建路线图\n\n定义清晰的路线图可以帮助高管们规划出一条通往新目标的路径。然而，这条路线图还必须为高管们提供他们愿意遵循这条路径的理由，包括为什么值得投入时间和金钱，以及他们如何确信能够到达目的地。路线图通常以演示文稿的形式呈现，但也可能会准备一份总结文档。\n\
  \n请记住，面向广泛的高管受众进行演示时，简洁明了是最好的方法。在下面的流程中，我们将在示例中用一张幻灯片代表每个主要要点。应当涵盖的内容如下：\n\n-  \
  \ 我们的建议（我们也会在演示结束时再次提及）：\n    -   一分钟总结解决了哪些业务问题以及工作范围，为我们在演示结束时请求资金做铺垫\n-   议程：\n\
  \    -   描述我们将如何支持资金请求的议程\n-   业务驱动因素：\n    -   回顾各业务部门提供的关键业务驱动因素，回答“为何要行动”的问题\n\
  -   项目阶段及相关商业案例：\n    -   项目阶段时间线和投资回报率\n-   技术解决方案：\n    -   从当前状态到未来状态的解决方案演进\n\
  -   风险与缓解措施：\n    -   项目成功面临的重大风险及缓解这些风险的步骤总结\n-   结论与后续步骤：\n    -   描述项目为何必须立即启动的总结，以及资金请求\n\
  \n现在，让我们看一个路线图演示文稿的示例。面向高管受众、描述我们全渠道项目的路线图演示文稿可以基于一组类似于下图的幻灯片。我们从一张前置总结幻灯片开始，如图\
  \ 7-4 所示。\n\n![A978-1-4842-0986-8_7_Fig4_HTML.jpg](img/A978-1-4842-0986-8_7_Fig4_HTML.jpg)\n\
  图 7-4. 路线图高管演示文稿——建议幻灯片\n\n如您所见，我们将快速确立项目将交付的内容（客户的单一视图以及渠道效率的提升）、项目成本（2800 万美元），并强调可衡量的业务收益（我们期望获得的增量销售收入，9800\
  \ 万美元）。我们还将强调这些收益将在多快的时间内实现（到 2017 年底）。\n\n注意\n\n在我们的项目中可能实现其他业务收益，事实上，我们稍后会在示例演示文稿中指出一些。然而，在我们的建议幻灯片上，我们希望关注点仅限于那些我们有可靠且得到充分支持的数字的收益。在演示中过早地就我们的假设展开对抗性讨论是不合适的。\n\
  \n当然，我们的高管受众会希望我们为这些陈述提供依据。因此，我们的下一张幻灯片（如图 7-5 所示）说明了我们的演示文稿在论证时将遵循的议程。\n\n![A978-1-4842-0986-8_7_Fig5_HTML.jpg](img/A978-1-4842-0986-8_7_Fig5_HTML.jpg)\n\
  图 7-5. 路线图高管演示文稿——议程幻灯片\n\n在继续之前，我们应该询问高管们，他们认为议程中是否遗漏了任何内容。他们可能会提到我们本来也计划涵盖的特定关切事项。但这将有助于我们确定在哪个议程项目上可能需要花更多时间。\n\
  \n\n\n"
- "# 排版后的文档\n\n当然，我们的听众必须在他们愿意投资并为项目提供资金之前理解预期的业务成果。在图 7-6 中，我们概述了全渠道项目的关键业务驱动因素。需要明确的是，为了让该项目按利益相关者设想的那样成功，它必须提供一个能够跨渠道优化促销、跨渠道优化供应链以及跨渠道提升客户收入的解决方案。\n\
  \n![A978-1-4842-0986-8_7_Fig6_HTML.jpg](img/A978-1-4842-0986-8_7_Fig6_HTML.jpg)\n\
  \n图 7-6. 路线图高管演示——业务驱动因素幻灯片\n\n我们还在幻灯片上提供了关于期望成果和可衡量目标的更多细节。所有陈述的可衡量目标必须得到我们关键利益相关者（例如，营销、供应链管理和销售领域备受尊敬的领导者）的认可，证明其是合理的。这些应该与我们之前制定商业案例时使用的数字相同。我们的关键利益相关者必须愿意再次支持这些数字，并支持项目的关键目标。\n\
  \n高管听众会希望了解项目如何分解为可管理的阶段，这些阶段将开始带来我们刚刚描述的业务回报。他们还想知道这些阶段是否能够降低项目失败和成本超支的风险。\n\n\
  图 7-7 展示我们如何说明这些阶段。下轴上的标记表示随时间推移预期的增量收入。这种图表有时也用于在收益累积的同时说明项目成本随时间的变化。\n\n![A978-1-4842-0986-8_7_Fig7_HTML.gif](img/A978-1-4842-0986-8_7_Fig7_HTML.gif)\n\
  \n图 7-7. 路线图高管演示——项目阶段\n\n该图还表示了这个听众可能关心的其他活动（你可以将图 7-7 及其活动与图 7-3 中针对 IT 管理层的活动进行比较）。例如，我们在此指出，我们将制定一个变更管理和培训计划，并在上线阶段之前执行。将该图添加到图表中是为了预期高管们可能提出的一些反对意见，这些意见涉及业务部门使用拟议解决方案的能力以及\
  \ IT 部门管理它的能力。\n\n尽管提出了一个坚实的商业案例，我们的听众可能仍然想知道为什么项目如此昂贵。他们可能不清楚我们正在描述实体店和 IT 部门内的基础设施的重大改造。这些改造是由跨多个渠道收集和分析数据的需求驱动的，而这是目前不存在的方式；我们需要向他们展示这一点。\n\
  \n图 7-8 以简化的形式展示了我们当前的基础设施状态。我们可以用这个图来说明，关于客户的数据目前存储在孤岛中。作为业务领导者，他们应该已经认识到，组织目前可以看到客户在每个渠道购买了什么，但几乎无法实现我们刚才概述的三个业务目标，而这些目标需要跨渠道的客户视图。\n\
