  \n谨以此书献给那些将技术视为解决业务问题途径的先驱者们。\n\n## 赞誉\n\n> 对于当今任何需要负责架构设计并满足复杂企业信息需求的业务或技术专业人士来说，这本书是必读之作。鲍勃和他的团队清晰而简洁地阐述了如何满足这些需求，并引导您将大数据和信号数据转化为强大的企业资产。\n\
