  接下来，我们将探讨评估技能时可能使用的指标。然后，我们提供许多可能需要的关键技能的概要描述。最后，我们将介绍如何传达有关技能差距的发现，包括验证我们在评估过程中发现的内容，以及我们可用于弥补差距的一些选择。




  ## 技能评估与衡量指标


  技能评估通常由一系列与项目成功息息相关的业务线和部门的访谈组成。访谈对象通常是精通下属技能的部门经理。在此过程中，我们不仅要确定组织内是否有人具备某项技能，还需了解该技能的普及程度。毕竟，如果某项关键技能仅掌握在一个人手中，这将严重制约我们扩展项目规模或增加项目数量的能力。


  为了评估和量化现有技能的成熟度，我们建议采用从 0 到 5 的简单评分标准。通常，这项工作会借助电子表格来完成，我们描述的各项指标数据也会在其中收集。有些人还会在电子表格中，除了记录当前评分外，也记下期望的未来技能成熟度水平。然后，该电子表格可用来显示哪些地方存在可能阻碍项目成功的技能差距，以及差距有多大。


  对于技能成熟度的评估，表 5-1 包含了可用于评估组织内现有技能的定义。评分等级数值代表了一个范围，从完全没有技能到非常先进且广泛可用的技能，包括用于转型活动的技能。您可以根据自身独特需求修改此处提供的技能指标的定义和描述，但该表格至少提供了一个起点。


  **表 5-1. 技能评估指标**


  | 评分 | 定义 | 技能应用领域 |

  | --- | --- | --- |

  | 0 | 组织内任何地方都未发现该技能 | 技能从未被应用，或即使应用也是外包的 |

  | 1 | 技能处于非常早期的开发阶段，已计划或非常有限 | 技能开发通常通过原型构建进行 |

  | 2 | 技能已在非常战术的层面上得到开发 | 技能直接与某个项目挂钩 |

  | 3 | 技能在本地化的一组当前项目中可用且具有战略意义 | 技能已在或将在部门级别多次应用 |

  | 4 | 技能在广泛的当前项目中可用且具有战略意义 | 技能已在或将在企业范围内多次应用 |

  | 5 | 技能在广泛的转型项目中可用且具有战略意义 | 拥有足够的关键技能人才，以满足整个企业创新项目的需求 |


