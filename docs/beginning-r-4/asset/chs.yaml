  换句话说，调节回归的一般公式


  ![$$ {\displaystyle \begin{array}{l}y={b}_0+{b}_1\ast x\\ {}\kern0.6em +{b}_2\ast
  w\\ {}\kern0.6em +{b}_3\ast \left(x\ast w\right)+\varepsilon \end{array}} $$](img/495868_1_En_12_Chapter_TeX_Eque.png)


  变成了具体公式


  ![$$ {\displaystyle \begin{array}{l} body\_ mass\_g=-36097.06+196.07\ast flipper\_
  length\_ mm\\ {}\kern4.559998em +1771.80\ast bill\_ depth\_ mm\\ {}\kern4.679997em
