  包 [18] 实现了这一点。和之前一样，`R` 可能会自动为你安装一些额外的包作为 `readxl` 的依赖项。还要注意，`R` 函数对其输入可能有点“智能”。在这种情况下，我们利用了
  `install.packages()` 函数期望包名作为**第一个**输入这一事实。因此，我们不需要显式地写出 `pkgs = "readxl"`。今后，我们会在首次介绍一个函数时使用其正式输入名。首次使用之后，我们仅在必要时才使用正式输入名。


