  \n掌握了这些数据，我们再来探索表 4-1 中的更多运算符。能够将多个逻辑运算符链式调用是非常有用的。在本例中，`%like%` 运算符选择 `UserID`\
  \ 在任何位置包含 `19` 的所有行。这是一个所谓的*模糊*匹配的例子。它与其他运算符更精确的性质形成对比。接下来，我们要求 `STRESS` *大于或等于\
  \ 4 且严格小于 6*。消极情绪 `NegAff` 必须*严格小于 2*。从表 4-1 中注意，这同样可以写成 `NegAff < 2`。通常，在 `R` 中，就像在生活中一样，解决问题的方法不止一种。最后，要求\
  \ `SurveyInteger` 精确等于 `2`：\n\n```\nacesData[UserID %like% \"19\" &\nSTRESS  %gel%\
  \  c(4, 6) &\nNegAff %l% 2 &\nSurveyInteger == 2]\n##     UserID  SurveyDay SurveyInteger\
