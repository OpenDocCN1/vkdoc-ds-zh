  \n\n\n### 假设与数据清洗\n\n多元回归与线性回归具有相同的假设条件，因此你可以参考第 8 章了解更多细节。\n\n通常在简单线性回归和多元回归之间有所区别的诊断方法只有两点：(1)\
  \ 假设所有预测变量（而非仅一个）都呈线性关联；(2) 有时检查预测变量之间是否存在高度相关性会很有帮助。第二个问题——预测变量高度相关——通常被称为**多重共线性**。虽然这个概念听起来很复杂，但其原理并不难理解。\n\
  \n假设你想根据校友在校期间各门课程的成绩，来预测其毕业后的工作薪资。你有一门课程的数据，该课程进行了一系列小测验和一次期末考试。你拥有课堂总成绩、小测验总成绩和期末考试成绩这三项数据。你可以将小测验成绩和期末考试成绩，或小测验成绩和总成绩，或期末考试成绩和总成绩纳入回归模型，但不能同时加入这三个变量。之所以不能三者全用，是因为课堂总成绩恰好是小测验成绩与期末考试成绩之和。尽管你拥有三个变量，且任意两个变量都不完全相同，但其中两个变量能完美预测第三个变量。这就是多重共线性的含义。表面上看似有多个变量，但实际上其中某个或多个变量并未提供独特有效的信息。\n\
  \n在实际操作中，即使你的某个预测变量不能被其余变量完美预测，它依然可能带来问题。例如，你可能拥有一些高度相关的变量，比如两个变量之间的相关系数 *r* > 0.90\
  \ 或 *r* < -0.90。在同一回归模型中引入高度相关的变量会产生问题，原因在于——回想一下，多元回归的用途之一就是识别某个变量的**独特**贡献。然而，如果你有两个相关系数\
  \ *r* = 0.95 的预测变量，那么两者携带的独特信息都非常少。它们几乎全部的预测能力都是重叠的，而非独特的。在最极端的情况下，比如课堂总成绩恰好等于期末考试成绩与小测验成绩之和，回归模型将无法得出唯一解，因此\
  \ `R` 通常会自动为你剔除一个预测变量，否则回归无法进行估计。\n\n总的来说，多重共线性并非一个主要问题。而且，通常只需了解你的预测变量是什么，就能判断出是否可能存在此问题。例如，如果你拥有课堂数据，即使不做任何统计计算，也能知道小测验成绩和期末考试成绩会与总成绩存在共线性。我们在实践中发现，除了运用常识判断两个预测变量是否实质上捕捉了相同信息之外，多重共线性并不常见，也很少需要特别处理。如果你确实遇到了多重共线性问题，或者对此有所担忧，最常见的解决方法就是直接剔除一个或多个预测变量。还有其他一些可选方案，但已超出入门书籍的讨论范围。\n\
  \n### 示例\n\n为了举例说明假设检验的过程，我们回顾一下本章一直在使用的那个多元回归示例。我们之前简要地检查过假设条件，情况尚可。现在，我们来更仔细地审视一遍。首先，我们可以快速检查一下压力与社会支持这两个变量是否高度相关。由于压力和社会支持是不同的衡量指标，多重共线性不太可能成为问题；但如果你不确定，随时可以查看它们之间的相关性：\n\
  \n```\nacesData[, cor(STRESS, SUPPORT, use = \"pairwise.complete.obs\")]\n## [1]\
  \ -0.03476\n```\n\n压力与社会支持之间的相关系数实际上非常接近于零，因此多重共线性完全不成问题。接下来，我们可以使用 `modelDiagnostics()`\
  \ 函数来计算诊断结果，并用 `plot()` 函数来创建可视化图形：\n\n```\n### 评估模型诊断结果\nm2d <- modelDiagnostics(m2,\
  \ ev.perc = .005)\nplot(m2d, ncol = 2, ask = FALSE)\n```\n\n如前所述，正态性假设通常通过将模型残差与正态分布进行比较来检验。独立性假设通常无法直接检验，但如果参与者之间相互独立（例如，他们不是兄弟姐妹，我们没有对同一个人进行重复测量等），我们通常假定该假设成立。\n\
  \n方差齐性假设通常通过绘制残差与预测值的散点图来进行评估。预期结果是，在预测值的整个范围内，残差的分布（方差）大致相等，并且残差中不应出现任何系统性的变化趋势。\n\
  \n虽然不属于假设条件，但我们通常希望识别出可能不当影响我们研究结果的异常值或极端值。这通常通过检查模型的残差来完成。\n\n图 11-12 的**左图**显示了残差的密度图（实心黑色线条），并附有具有相同均值和残差方差的标准正态分布的密度图（蓝色虚线）作为参考。密度图下方的地毯图（细小的竖直线条）显示了原始数据点的分布位置。x\
  \ 轴标签（对应残差）显示了最小值、第 25 百分位数、中位数、第 75 百分位数和最大值，提供了一个快速的定量摘要。\n\n左图的下方是一个 QQ 偏差图；这与通常所说的\
  \ QQ 图有关。该图以 x 轴表示观测分位数，以 y 轴表示观测分位数与理论正态分位数之间的偏差。如果点恰好落在线上，则表明这些点完全符合正态分布下的预期位置。地毯图和\
  \ QQ 偏差图中的点：如果非极端值，则以浅灰色显示；如果满足调用 `modelDiagnostics()` 时指定的极端值标准，则以实心黑色显示。以图 11-12\
  \ 为例，左下角的面板中有两个这样的极端值。\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig12_HTML.png](img/495868_1_En_11_Fig12_HTML.png)\n\
  \n图 11-12\n\n回归模型诊断图。左图显示了用于评估正态性的残差图，若为极端值则以黑色突出显示。右图显示了预测值与残差值的散点图，用于帮助评估方差齐性假设。\n\
  \n\n\n图 11-12 的**右面板**显示了模型预测值与残差的散点图。这有助于评估方差齐性假设。如果残差方差是齐性的，我们期望残差（y 轴）的散布在所有预测值水平上大致相同。有时这很容易通过视觉观察，有时则不那么容易。为了辅助视觉解释，图中添加了分位数回归线。分位数回归线允许回归模型预测第\
  \ 10 和第 90 百分位数。这些预测值以蓝色虚线添加。在方差齐性的假设下，我们期望这些线大致水平且相互平行。如果它们不平行，则表明某些预测值的方差比其他预测值更大/更小，这称为异方差性。中间的实蓝线是一条`loess`平滑线，理想情况下也应是平坦的且接近零，以表明残差中没有系统偏差。系统偏差可能发生，例如，当低预测值对应的残差总是为正，而高预测值对应的残差总是为负时，这通常表明数据存在天花板/地板效应和/或需要通过修订模型来解决的问题。与密度图一样，散点图的坐标轴显示了最小值、第\
  \ 25 百分位数、中位数、第 75 百分位数和最大值，提供了残差和预测值的良好定量汇总。\n\n这些图形看起来相当不错。它们并不完美，但真实数据从来都不完美，且残差散布的变异程度并不极端。我们可能有理由认为正态性和方差齐性假设已满足，或者至少没有严重违背。\n\
  \n### 示例\n\n我们来看另一个结果变量`NegAff`，即负面情感。我们再次使用`STRESS`和`SUPPORT`作为预测变量：\n\n```\nmalt\
  \ <- lm(NegAff ˜ STRESS + SUPPORT, data = acesData)\n## assess model diagnostics\n\
  maltd <- modelDiagnostics(malt, ev.perc = .005)\nplot(maltd, ncol = 2, ask = FALSE)\n\
  ```\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig13_HTML.png](img/495868_1_En_11_Fig13_HTML.png)\n\
  \n图 11-13\n\n回归模型诊断。左面板显示用于评估正态性的残差图，若存在极端值则会以黑色高亮显示。右面板显示预测值与残差值的图，以帮助评估方差齐性假设。\n\
  \n图 11-13 中显示的这些图形清楚地表明了模型中的问题。残差完全不符合正态分布。根据当前标准，存在极端值。方差齐性图看起来并不那么糟糕，但残差中的极端值显而易见。至少，我们希望移除这些极端值。然而，显著的非正态性也是一个问题。虽然其数学原理超出了本书的范围，但“修复”大的正极端值的一种方法是使用对数变换。为示例起见，我们在此进行此操作。对数（及其他变换）的“魔力”在另一本书[22]中有深入讨论。\n\
  \n与大多数魔法一样，对数变换是有代价的，并且仅在所有结果分数大于零时才有定义。在零或以下，对数未定义。\n\n我们拟合一个新模型`malt2`，使用`log()`获取负面情感的对数并将其作为结果变量。我们再次绘制诊断图，如图\
  \ 11-14 所示：\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig14_HTML.png](img/495868_1_En_11_Fig14_HTML.png)\n\
  \n图 11-14\n\n对结果变量进行对数变换后的回归模型诊断图\n\n```\nmalt2 <- lm(log(NegAff) ˜ STRESS + SUPPORT,\
  \ data = acesData)\n## assess model diagnostics\nmalt2d <- modelDiagnostics(malt2,\
  \ ev.perc = .005)\nplot(malt2d, ncol = 2, ask = FALSE)\n```\n\n即使经过对数变换，极端值仍然存在。\n\
  \n如果我们移除那些值呢？\n\n极端值存储在诊断对象输出`malt2d`中并可访问。它显示了结果变量的分数、索引（数据中极端值所在的行）以及它们作为极端值的效应类型，在此例中为残差上的极端值。我们使用`Index`值将它们从数据集中移除，然后重新拟合模型。我们可以在索引前使用`-`来告诉数据表，我们要**排除**这些行，而不是选择它们：\n\
  \n```\nmalt2d$extremeValues\n##    log(NegAff) Index EffectType\n## 1:       1.565\
  \   123  Residuals\n## 2:       1.066   174  Residuals\nmalt3 <- lm(formula = log(NegAff)\
  \ ˜ STRESS,\ndata = acesData[-malt2d$extremeValues$Index])\n## assess model diagnostics\n\
  malt3d <- modelDiagnostics(malt3, ev.perc = .005)\nplot(malt3d, ncol = 2, ask =\
  \ FALSE)\n```\n\n结果显示在图 11-15 中。\n\n在排除了初始的极端值后，出现了一个新的极端值。然而，它相对不那么极端；尽管仍有证据表明残差的方差不相等，但整体模型诊断看起来现在好多了。注意，对于低预测值，负残差如何小得多，并且随着预测值的增加，负残差变得更大。此时我们已无太多办法来改善模型假设。残差方差可能（甚至很可能）不相等（违反方差齐性）这一情况，我们将在任何报告中承认其作为一项局限性，并在解释此多元回归结果时加以考虑（即，由于假设可能至少在一定程度上被违反，结果可能会有轻微偏差）。\n\
  \n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig15_HTML.png](img/495868_1_En_11_Fig15_HTML.png)\n\
  \n图 11-15\n\n对结果变量进行对数变换并移除极端值后的回归模型诊断图\n\n更高级的统计学书籍涵盖了不需要相同假设的替代分析方法，但这些方法要复杂得多。实际上，对数变换和移除极端值需要巧妙的手法。我们向您展示这个更复杂的示例，主要目的是表明假设检验是必要的。一个有用的次要目的是鼓励您在读完本书后继续学习；通常有一些方法可以对数据进行变换，以提取出一些有用的信息。这往往需要更多的时间和练习。\n\
  \n\n\n## 11.4 分类预测变量\n\n除了连续变量外，分类变量也可以作为回归中的预测变量/解释变量。纳入分类预测变量最常用的方法是使用虚拟变量编码。虚拟变量编码的基本思想是将一个具有\
  \ *k* 个水平的分类预测变量转化为 *k* 个独立的虚拟编码变量，其中每个虚拟编码变量在变量的某个特定水平上编码为 1，在其他水平上编码为 0。最简单的情况是二分类变量，即只有两个水平的分类变量（例如，年轻成年人、年长成年人），此时你可以创建一个新的虚拟编码变量，其中\
  \ 1 = 年长成年人，0 = 年轻成年人。这个虚拟编码变量现在是一个数值型预测变量（包含 0 和 1），可以像往常一样纳入回归分析。“虚拟编码”这个名称源于你创建一组替代（即虚拟）变量的想法。它有时也被称为独热编码，因为它创建的新变量每次只有一个旧变量的水平是“活跃的”或“热的”（hot\
  \ 指带电的导线），编码为 `1`。\n\n解释虚拟编码变量与解释常规连续预测变量之间唯一的实际区别在于：(1) 零点并非随意设定，而是代表某一个特定组（例如，年轻成年人）；(2)\
  \ 虚拟编码变量的一个单位变化也不是随意的，而是代表组与组之间的差异（因为从 0 到 1 **就是**一个单位的变化）。\n\n为了具体说明，我们可以查看 `mtcars`\
  \ 数据集的前几行。其中有一个变量 `cyl`，表示汽车的汽缸数：4、6 或 8。下表展示了 `cyl` 的前几行以及虚拟编码变量的样子：\n\n```\n##\
  \                 cyl dummy_cyl4 dummy_cyl6 dummy_cyl8\n## Mazda RX4         6 \
  \         0          1          0\n## Mazda RX4 Wag     6          0          1\
  \          0\n## Datsun 710        4          1          0          0\n## Hornet\
  \ 4 Drive    6          0          1          0\n## Hornet Sportabout 8        \
  \  0          0          1\n## Valiant           6          0          1       \
  \   0\n```\n\n在该示例中，注意观察例如 `dummy_cyl4` 在 *cyl* = 4 时编码为 1，否则编码为 0。\n\n虽然我们总可以为分类变量的每个唯一水平创建一个虚拟编码变量，但在回归模型中，我们只纳入\
  \ *k* − 1 个虚拟编码变量。其原因在于，否则这些虚拟编码变量之间存在多重共线性。例如，延续 `cyl` 的例子，我们知道该数据集中的每辆车都有四个、六个或八个汽缸。如果我们在模型中纳入\
  \ `dummy_cyl4` 和 `dummy_cyl6`，那么如果一辆车的 `cyl4` 为 1，我们就知道它有四个汽缸。如果它的 `cyl6` 为 1，我们就知道它有六个汽缸。如果它在\
  \ `cyl4` 和 `cyl6` 上都为 0，那么剩下的唯一可能就是它是一辆八缸汽车。\n\n一般规则是，如果你有一个 *k* 水平的分类预测变量，你可以创建\
  \ *k* 个虚拟编码，并在回归模型中纳入 *k* – 1 个虚拟编码。在汽缸的例子中，有三个水平；我们可以创建三个虚拟编码，但在任何回归模型中我们只会纳入两个虚拟编码。\n\
  \n我们的书 *Advanced R Statistical Programming and Data Models: Analysis, Machine Learning,\
  \ and Visualization* [22] 更详细地介绍了虚拟编码。\n\n然而，不需要另一本书，因为使用虚拟编码将分类预测变量纳入回归的功能已内置于\
  \ `R` 中。`R` 会自动对你作为预测变量输入回归的任何因子变量进行虚拟编码，因此你无需手动操作。如果变量不是因子，你可能需要先使用 `factor()`\
  \ 函数将其转换为因子。\n\n请看一个包含分类预测变量的简单线性回归。我们拟合模型并将结果存储在 `mcat1` 中。我们也可以像之前的回归模型一样将结果绘制成图表。在这个例子中，我们将使用积极情感作为结果变量，但使用教育水平作为预测变量。`EDU`\
  \ 是一个二分类变量，0/1，表示人们是否完成了学士学位（1）或未完成（0）。首先，我们将其设为因子变量，然后像往常一样将其添加到线性回归中：\n\n```\n\
  acesData[, EDU := factor(EDU)]\nmcat1 <- lm(formula = PosAff ~ EDU,\ndata = acesData)\n\
  APAStyler(modelTest(mcat1))\n##                 Term                   Est     \
  \     Type\n##  1:      (Intercept) 2.82*** [ 2.62, 3.02] Fixed Effects\n##  2:\
  \             EDU1   -0.13 [-0.47, 0.20] Fixed Effects\n##  3: N (Observations)\
  \                   187 Overall Model\n##  4:        logLik DF                 \
  \    3 Overall Model\n##  5:           logLik               -284.24 Overall Model\n\
  ##  6:              AIC                574.47 Overall Model\n##  7:            \
  \  BIC                584.16 Overall Model\n##  8:               F2            \
  \      0.00 Overall Model\n##  9:               R2                  0.00 Overall\
  \ Model\n## 10:           Adj R2                  0.00 Overall Model\n## 11:   \
  \           EDU   f2 = 0.00, p = .436  Effect Sizes\nvisreg(mcat1, xvar = \"EDU\"\
  , partial = FALSE, rug = FALSE, gg = TRUE) +\nggtitle(\"EDU as a categorical predictor\"\
  )\n```\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig16_HTML.png](img/495868_1_En_11_Fig16_HTML.png)\n\
  \n**图 11-16**\n\n来自 `visreg` 的简单线性回归图，包含一个分类预测变量（教育），展示了每个教育水平的预测积极情感和 95% 置信区间\n\
  \n图 11-16 用蓝色实线展示了每个教育水平的预测积极情感，灰色阴影区域是预测均值周围的 95% 置信区间。在这个简单例子中，由于没有其他预测变量，截距（即预测变量为\
  \ 0 时积极情感的期望值）是低教育水平人群（*EDU* = 0）的积极情感均值，而 `EDU` 的回归系数是低教育水平人群与高教育水平人群之间平均积极情感的**差异**，我们可以看到这个差异在统计上并不显著。\n\
  \n起初将 `EDU1` 的回归系数称为均值差异可能看起来很奇怪。毕竟，我们一直把回归系数说成是直线的斜率。实际上两者都成立。`EDU1` 的回归系数就是一条直线的斜率。因为\
  \ 0 表示低教育水平，1 表示高教育水平，一个单位的变化（即该直线的斜率）恰好就是低教育水平与高教育水平人群之间的预测差异。事实上，虚拟编码成为一种流行技术的全部原因就在于，它允许我们利用回归的工作原理（计算斜率）来获取关于分类预测变量的有意义信息。\n\
  \n顺便提一下，这个使用虚拟编码的线性回归结果，将与我们通过双样本 t 检验得到的结果完全一致（将低教育水平组的均值与截距和均值差异进行比较，以及 `EDU1`\
  \ 的 p 值）：\n\n```\nt.test(PosAff ~ EDU,\ndata = acesData,\nvar.equal = TRUE)\n##\n\
  ##      Two Sample t-test\n##\n## data:  PosAff by EDU\n## t = 0.78, df = 185, p-value\
  \ = 0.4\n## alternative hypothesis: true difference in means is not equal to 0\n\
  ## 95 percent confidence interval:\n##  -0.2044  0.4721\n## sample estimates:\n\
  ## mean in group 0 mean in group 1\n##           2.822           2.688\n```\n\n\
  然而，我们要学习如何在回归中进行此操作的原因是，与 t 检验不同，回归可以包含多个预测变量以及分类和连续预测变量的混合，从而能够拟合比 t 检验复杂和灵活得多的模型。\n\
  \n\n\n### 示例\n\n接下来，考虑使用一个具有三个水平而非两个水平的分类预测变量。在本章开头，我们有一段代码创建了一个分类的压力变量，该变量编码为压力\
  \ 0、1 或 2+，并存储为因子变量，名为`StressCat`。\n\n我们将使用该分类变量来预测积极情感。注意，由于`StressCat`具有三个水平，即使我们只添加一个预测变量，一旦将其进行虚拟编码，模型中就会加入两个虚拟编码后的预测变量。我们还将使用`modelDiagnostics()`运行一些模型诊断，这与使用连续预测变量时的做法相同。结果如图\
  \ 11-17 所示。残差与预测值图看起来可能与我们之前见过的有些不同，因为对于分类预测变量，我们实际上并不会生成连续的预测值；只有三个可能的预测值，尽管观测到的结果数据是连续的，因此残差仍然是连续的：\n\
  \n```\nmcat2 <- lm(formula = PosAff ~ StressCat,\ndata = acesData)\nplot(modelDiagnostics(mcat2),\
  \ ncol = 2)\n```\n\n尽管预测值是离散的（这并不违反任何回归假设——只有结果变量需要是连续的），但诊断结果看起来相当不错。接下来，我们可以再次使用`modelTest()`函数获取模型结果和效应量：\n\
  \n```\nAPAStyler(modelTest(mcat2))\n##                 Term                    \
  \ Est          Type\n##  1:      (Intercept)  3.14*** [ 2.88,  3.39] Fixed Effects\n\
  ##  2:       StressCat1    -0.32 [-0.74,  0.11] Fixed Effects\n##  3:      StressCat2+\
  \ -0.69*** [-1.03, -0.34] Fixed Effects\n##  4: N (Observations)               \
  \      187 Overall Model\n##  5:        logLik DF                       4 Overall\
  \ Model\n## ---\n##  8:              BIC                  575.22 Overall Model\n\
  ##  9:               F2                    0.08 Overall Model\n## 10:          \
  \     R2                    0.08 Overall Model\n## 11:           Adj R2        \
  \            0.07 Overall Model\n## 12:        StressCat     f2 = 0.08, p < .001\
  \  Effect Sizes\n```\n\n在结果中，我们可以看到包含了`StressCat`的两个虚拟编码。被省略的虚拟编码变量是`StressCat0`，这意味着当其他两个虚拟编码为零时，模型的截距就是无压力者预测的积极情感值。因此，我们现在可以将截距解释为当所有预测变量为零时预测的积极情感得分，在这种情况下即指`StressCat`\
  \ = 0。\n\n第一个预测变量是`StressCat1`，它捕捉了无压力人群与压力评分为 1 的人群之间的差异。负号表明压力评分为 1 的人积极情感低于压力为\
  \ 0 的人，但我们可以看到它并未达到统计显著性，并且 95%置信区间包含零。\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig17_HTML.png](img/495868_1_En_11_Fig17_HTML.png)\n\
  \n图 11-17\n\n仅包含分类预测变量时的回归诊断图\n\n第二个预测变量是`StressCat2+`，它捕捉了无压力人群与压力评分为 2+的人群之间的差异。负号表明压力评分为\
  \ 2+的人积极情感低于压力为 0 的人，我们可以看到它具有统计显著性，`p` < .001，并且 95%置信区间不包含零。\n\n通过`modelTest()`，我们还得到了效应量估计。注意，这只是一个效应量和一个\
  \ p 值。最后显示的效应量和 p 值实际上针对的是整个`StressCat`变量。也就是说，它测试的是该变量整体（两个虚拟编码共同）是否与积极情感相关。这是一种了解分类预测变量整体是否具有统计显著性及其总体效应量大小的有用方法。\n\
  \n你可能会好奇的一点是，尽管两个虚拟编码都告诉我们压力为 1 或 2+的人群在积极情感上是否与压力为 0 的人群不同，但我们并没有检验压力为 1 的人群与压力为\
  \ 2+的人群是否存在差异。也就是说，我们并没有获得分类预测变量各水平之间所有可能的成对比较。当只有两个水平时，这不成问题，但当分类预测变量有三个或更多水平时，你可能会有许多成对比较。通常有两种选择。首先，你可以更改被省略的虚拟编码变量，这将使其成为新的“比较”组，从而让你获得其他成对比较。然而，这需要重新拟合模型，如果你有一个五水平的分类预测变量，你可能需要这么做很多次。另一种方法是使用`emmeans`包[13]，它提供了对回归模型运行附加测试的有用函数。我们将探讨这个选项。我们需要使用两个函数。首先，我们使用`emmeans()`函数，将回归模型作为第一个参数，将我们要计算均值的变量作为`specs`参数。我们保存这些结果并打印它们。显示的是每组中估计的积极情感均值以及\
  \ 95%置信区间：\n\n```\nmcat2.means <- emmeans(object = mcat2, specs = \"StressCat\"\
  )\nmcat2.means\n## StressCat emmean    SE  df lower.CL upper.CL\n## 0          \
  \ 3.14 0.130 184     2.88     3.39\n## 1           2.82 0.174 184     2.48     3.16\n\
  ## 2+          2.45 0.119 184     2.22     2.69\n##\n## Confidence level used: 0.95\n\
  ```\n\n现在我们有了一个包含每个压力类别水平积极情感均值的对象，我们可以使用`pairs()`函数获取所有可能的成对比较。默认情况下，`pairs()`还会使用\
  \ Tukey 方法对多重比较进行 p 值调整。在输出中，我们可以看到每组之间的均值差异，标记为“estimate”和“p.value”，后者指示这两组之间是否显著不同。从结果中，我们可以看到压力为\
  \ 2+的人群与压力为 0 的人群显著不同（基于中间那一行的 p 值列），但其他比较未达到统计显著性：\n\n```\npairs(mcat2.means)\n\
  ## contrast estimate    SE  df t.ratio p.value\n## 0 - 1       0.316 0.217 184 1.451\
  \   0.3172\n## 0 - (2+)    0.685 0.177 184 3.880   0.0004\n## 1 - (2+)    0.370\
  \ 0.211 184 1.751   0.1893\n##\n## P value adjustment: tukey method for comparing\
  \ a family of 3 estimates\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 示例\n\n在最后一个示例中，我们再次审视`StressCat`，但这次是在一个多元回归中，其中我们还有一个连续预测变量，即社会支持`SUPPORT`。我们首先以一种现在希望是熟悉的方式来拟合模型，然后绘制一些模型诊断图，如图\
  \ 11-18 所示：\n\n```\nmcat3 <- lm(formula = PosAff ˜ StressCat + SUPPORT,\ndata =\
  \ acesData)\nplot(modelDiagnostics(mcat3), ncol = 2)\n```\n\n诊断结果看起来相当不错，因此我们可以继续进行。首先，我们将结果图形化，以帮助理解和解释它们。我们像之前一样使用`visreg()`函数。我们将存储在`mcat3`中的多元回归模型结果传递给它。x\
  \ 轴变量是`SUPPORT`。通常最好将连续预测变量放在 x 轴上。我们还做了一些新的事情。我们将`StressCat`添加到`by`参数中。这将为`StressCat`的每个级别创建一条单独的回归线。`overlay=TRUE`参数意味着我们希望所有三条线都放在一个图中，而不是单独的面板中：\n\
  \n```\nvisreg(mcat3, xvar = \"SUPPORT\", by = \"StressCat\",\npartial = FALSE, rug\
  \ = FALSE, overlay = TRUE,\ngg = TRUE) +\nggtitle(\"SUPPORT and StressCat as predictors\"\
  )\n```\n\n结果在图 11-19 中。我们可以看到有三条线，分别对应压力类别的每个级别。然而，尽管我们有三条线，但它们的斜率都是平行的。这是因为社会支持与积极情感之间的关联被认为是相同的。唯一改变的是，对于不同的压力类别，线的水平高度可以不同。我们也可以通过比较三条线的高度来观察压力的关联。例如，很明显，有\
  \ 2+个压力源的人通常积极情感最低，尽管社会支持的斜率足够大，例如，社会支持为 10 且有 2+个压力源的人，其预测的积极情感仍然高于压力为 0 但支持为 0\
  \ 的人。\n\n回归模型的系数捕获了图 11-19 的几个不同部分。截距将是所有预测变量为零（即 0 压力和 0 支持）时的预期积极情感。压力类别的回归系数捕获了线的高度相对于截距的差异。社会支持的斜率捕获了图中线的斜率。现在我们将使用`modelTest()`来获取数值模型结果：\n\
  \n```\nAPAStyler(modelTest(mcat3))\n##                 Term                    Est\
  \           Type\n##  1:      (Intercept)  2.12*** [ 1.74,  2.50] Fixed Effects\n\
  ##  2:       StressCat1    -0.22 [-0.61,  0.17] Fixed Effects\n```\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig18_HTML.png](img/495868_1_En_11_Fig18_HTML.png)\n\
  \n图 11-18\n\n包含一个分类预测变量和一个连续预测变量时的回归诊断图\n\n```\n##  3:      StressCat2+ -0.63***\
  \ [-0.94, -0.32] Fixed Effects\n##  4:          SUPPORT  0.18*** [ 0.13,  0.23]\
  \ Fixed Effects\n##  5: N (Observations)                     187 Overall Model\n\
  ## ---\n## 10:               F2                    0.35 Overall Model\n## 11:  \
  \             R2                    0.26 Overall Model\n## 12:           Adj R2\
  \                    0.25 Overall Model\n## 13:        StressCat     f2 = 0.09,\
  \ p < .001  Effect Sizes\n## 14:          SUPPORT     f2 = 0.25, p < .001  Effect\
  \ Sizes\n```\n\n在这些结果中，我们可以再次看到，在控制了社会支持后，压力类别 2+的积极情感显著低于压力类别 0。压力类别 1 仍然与 0 没有差异（同样，你可以在“Est”列中看到，其置信区间包含\
  \ 0）。在控制了压力类别后，社会支持与积极情感呈显著的正相关。我们还可以比较效应量，并看到社会支持作为一个变量具有中等效应量`f²`，而压力类别总体上具有较小的效应量。\n\
  \n最后，如果我们想要压力类别之间的所有成对比较，我们可以重用之前的代码。`emmeans()`函数计算了在保持其他变量（本例中为社会支持）为样本平均值时的调整后均值：\n\
  \n```\nmcat3.means <- emmeans(object = mcat3,\nspecs = \"StressCat\")\nmcat3.means\n\
  ##  StressCat emmean    SE  df lower.CL upper.CL\n##  0           3.09 0.117 183\
  \     2.86     3.33\n##  1           2.87 0.157 183     2.57     3.18\n##  2+  \
  \        2.46 0.107 183     2.25     2.67\n```\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig19_HTML.png](img/495868_1_En_11_Fig19_HTML.png)\n\
  \n图 11-19\n\n来自`visreg`的简单线性回归图，包含连续预测变量`SUPPORT`，显示了每个`StressCat`级别的预测积极情感和 95%置信区间\n\
  \n```\n##\n## Confidence level used: 0.95\npairs(mcat3.means)\n##  contrast estimate\
  \    SE  df t.ratio p.value\n##  0 – 1       0.219 0.196 183 1.117   0.5045\n##\
  \  0 - (2+)    0.630 0.159 183 3.963   0.0003\n##  1 - (2+)    0.411 0.190 183 2.164\
  \   0.0802\n##\n## P value adjustment: tukey method for comparing a family of 3\
  \ estimates\n```\n\n从这些比较中，我们可以看到，比较有 1 个压力源与有 2+个压力源的人现在几乎达到了统计学显著性，`p` = .08，而在我们没有控制社会支持时，这个结果并不接近。因此，在这种情况下，控制社会支持似乎确实使压力的结果略微强一些，尽管仍然没有达到统计学显著性。\n\
  \n## 11.5 总结\n\n本章探讨了多元回归，它允许我们对单个结果变量有多个预测变量。此外，我们学习了如何使用虚拟变量或独热编码将分类预测变量添加到回归模型中，从而允许我们检查连续或分类变量的任意组合作为结果的预测变量。表\
  \ 11-1 应该是你本章所学关键概念的良好参考。\n\n表 11-1\n\n章节总结\n\n| 概念 | 含义 |\n| --- | --- |\n| `factor()`\
  \ | 将字符型（分类）列转换为包含数值型（虚拟）因子的列。 |\n| `fifelse()` | 快速 if/else；如果（条件为真）则执行 A，否则执行\
  \ B。 |\n| Call | 重复线性模型公式。 |\n| Residuals | 是实际值与预测值之间的差异；如果正态，中位数 == 0。 |\n| Coefficients\
  \ | 给出每个预测变量的 b 值和 p 值。 |\n| Residual | 用于进一步计算和缺失值的标准误差统计数据。 |\n| R-squared | y\
  \ 值中由 x 值解释的方差比例。 |\n| F-statistic | 包括模型整体是否显著的 p 值。 |\n| `confint()` | 用于模型；给出`bs`的置信区间。\
  \ |\n| `qt()` | 学生 t 分布的分位数函数；与`qnorm()`比较。 |\n| `visreg()` | 帮助可视化回归模型。 |\n| `annotate()`\
  \ | `ggplot2`函数，用于添加文本（包括用于`visreg()`）。 |\n| `xlab()` | `ggplot2`函数，用于添加 x 轴标签。\
  \ |\n| `ylab()` | `ggplot2`函数，用于添加 y 轴标签。 |\n| `ggtitle()` | `ggplot2`函数，用于添加标题文本。\
  \ |\n| `ev.perc =` | `modelDiagnostics()`的新参数，用于极端值。 |\n| Cohen's `f`^`2`^ | 近似效应量；¿=\
  \ .02 为小，¿= .15 为中等，¿= .35 为大。 |\n| `APAStyler` | “整洁地”打印`modelTest()`对象；提供`f`^`2`^。\
  \ |\n| Multicollinearity | 高度相关的预测变量；通常不是问题。 |\n| `log()` | 对数函数；用于正值、非正态值以“使其”正态。\
  \ |\n| Categorical | 预测变量通过独热或虚拟编码包含在多元回归模型中。 |\n| `emmeans()` | 显示给定分类预测变量的均值输出。\
  \ |\n| `pairs()` | 显示一对分类预测变量的均值输出之间的差异。 |\n\n\n\n## 11.6 掌握练习\n\n通过完成一些练习来检查你的进度并在实践中成长。理解性检验会提出批判性思考问题，最好以书面或口头回答。统计学的艺术之一在于成功地向利益相关者或受众传达结果。有时受众是高度技术性的，而其他时候则非常不技术。练习则是对本章所探讨概念的更直接应用。\n\
  \n### 理解性检验\n\n1.  想想企鹅的情况，我们知道比斯科岛似乎没有改变阿德利企鹅的某些特征。因此，我们可能会忽略岛屿因素。此外，我们知道喙深度在预测体重方面似乎并不十分有效。除了鳍状肢长度，还有哪些变量能让我们对体重有更深入的了解？\n\
  \n2.  如果任何额外的企鹅变量是分类变量，我们是否需要先将它们转换为因子？`str()` 函数告诉我们关于 `penguinsData` 的什么信息？\n\n\
