  ## 6.4 位置


  在探讨了数据中心之后，让我们来考虑数据的整体位置。你已经知道中位数正好位于数据的正中间。换句话说，50% 的数据点小于或等于中位数，另外 50% 的数据点大于或等于中位数。


  有时，了解除正中间以外的其他位置的分界点也很有用。这些分界点被称为**分位数**。你可能熟悉常见的分位数有*四分位数*（在 25%、50%、75% 和 100%
  位置将数据四等分）和*百分位数*（按百分比将数据从 1% 到 100% 进行切片）。


  分位数的常见用途包括人均收入或家庭收入（正如我们在 `salaries` “数据”中简要探讨的那样）。事实上，这类分位数可以对数据进行分类（例如 `acesData$SES_1`
  就部分基于财富指标）。


  计算分位数的函数恰如其名，称为 `quantile()`，它接受两个参数。第一个参数是数据，第二个参数是一个数值列表，用于指示分界点或概率。


  使用第 5 章介绍的 `seq()` 函数，你可以为一些常见分位数创建分界点：


  ```

  quartiles <- seq(0, 1, 0.25)

  deciles <- seq(0, 1, 0.10)

  grades <- seq(0.6, 1, 0.10)

  percentiles <- seq(0, 1, 0.01)

  ```


  此处，我们通过 `quartiles`（四分位数）来考察薪资数据。如你所见，`median()` 函数是第 50 百分位数的一个特例：


  ```

  quantile(salaries, quartiles)

  ##     0%    25%    50%    75%    100%

  ##      0  28682  57364  78682  100000

  median(salaries)

  ## [1] 57364

  quantile(salariesEven, quartiles)

  ##     0%    25%    50%    75%    100%

  ##      0  15000  38682  68023  100000

  median(salariesEven)

  ## [1] 38682

  ```


  现在，让我们用更大的数据集来探索这种基于分位数的分类思想。




  ### 示例


  回想图 6-8 中的点图。与其将数据排列成直方图形状，我们不如直接查看原始数据并自行做出判断。


  为此，我们使用几乎和平时一样的 `ggplot()` 代码。但首次，我们不仅将 `flipper_length_mm` 映射到水平 x 值上，还设置了 `y =
  0`。然后，用 `geom_jitter()` 代替 `geom_dotplot()`。图 6-18 的结果显示了所有 344 个企鹅鳍肢长度（实际上是 344
  减去缺失值后的数量）：


  ```

  ggplot(data = penguinsData,

  mapping = aes(x = flipper_length_mm, y = 0))+

  geom_jitter()

  ## Warning: Removed 2 rows containing missing values (geom_point).

  ```


  注意图表右侧是较长的巴布亚企鹅鳍肢（回顾图 6-9），中间有一小段间隔将它们分开，形成自己的集群。


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig18_HTML.png](img/495868_1_En_6_Fig18_HTML.png)


  图 6-18


  企鹅抖动图


  这与分位数有什么关系？图 6-18 中的点可以按分位数区间来思考。仔细观察这些点，思考`四分位数`，看看你是否能将不同长度分组为最短的 25%、最长的 50%
  等。你可能已经猜到，由于鳍肢长度存在一些缺失值，我们必须使用万无一失的代码短语 `na.rm = TRUE`。注意我们一开始并没有使用它。虽然 `R` 中并非所有错误信息都有帮助，但它们通常是有用的。此外，即使是很晦涩的错误代码，通过将确切的短语复制粘贴到互联网搜索引擎中，也常常能提供有用的线索：


  ```

  quantile(penguinsData$flipper_length_mm, quartiles)

  ## Error in quantile.default(penguinsData$flipper_length_mm, quartiles): missing
  values and NaN''s not allowed if ''na.rm'' is FALSE

  quantile(penguinsData$flipper_length_mm, quartiles, na.rm = TRUE)

  ##   0%  25%  50%  75% 100%

  ##  172  190  197  213  231

  ```


  这是一种对数据集进行分段的常见方法，因其常见，所以有专门的图表帮助我们可视化。这种图表就是 `箱线图`（或`盒须图`）。在图 6-19 中，你可以看到半透明的箱线图覆盖在企鹅鳍肢长度的点上。


  箱线图的两侧是须线。它们显示了数据底部的 25% 和顶部的 25% 所在的位置。*箱子内部*是数据的*中间* 50%（范围从 25% 分位数到 75% 分位数）。一条粗实的垂直竖线表示*中位数*。


  注意，就鳍肢长度而言，要将四分之一的数据点放入 25%–50% 的区间，会导致箱线图的这一部分相当狭窄。另一方面，从 50% 到 75% 的数据点分布则宽得多。将这些信息与图
  6-1 的直方图进行比较和对比。直方图和箱线图不仅展示了数据的完整*范围*，还展示了*频数*。


  记住，到目前为止，我们的目标只是理解、探索和描述数据。我们还未对这些数据进行评估。拥有几个常用图表（如直方图、点图、抖动图和箱线图）对于从稍微不同的视角观察事物非常有用（请原谅我们玩了个文字游戏）。


  一如既往，`ggplot()` 使得添加 `geom_boxplot()` 变得简单。但在实际应用中，人们不会总是同时包含抖动点和箱线图。这是因为抖动图中的点可能会分散注意力。如果目标是总结数据，那么在传达信息方面往往“少即是多”。然而，箱线图是本书中较难理解的图表之一。因此我们倾向于同时展示两者。因为我们要同时展示两者，在接下来的代码中你会看到一个新的参数。为了让箱线图足够透明以显示背后的点，我们将
  `alpha` 从 1 降低到 0.5：


  ```

  ggplot(data = penguinsData,

  mapping = aes(x = flipper_length_mm, y = 0))+

  geom_jitter()+

  geom_boxplot(alpha = 0.5)

  ## Warning: Removed 2 rows containing non-finite values (stat_boxplot).

  ## Warning: Removed 2 rows containing missing values (geom_point).

  ```


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig19_HTML.png](img/495868_1_En_6_Fig19_HTML.png)


  图 6-19


  企鹅箱线图




  ### 示例


  假设你需要更好地理解不同年龄段的人在`acesData`中的调查回应情况。或许值得先查看整个调查数据集的年龄分布（这有助于在进行分析前发现规律）。


  但请记住，参与者通常不会重新输入他们的年龄——许多调查都存在年龄缺失的情况。因此，在探索数据之前，我们必须先清洗或*整理*数据。


  这在真实世界的数据中很*常见*。事实上，在任何数据集上，超过一半的工作通常都花在数据整理上。当你将所学的技巧应用于真实场景时，这一点非常重要。同样重要的是，要向利益相关者（例如经理、主管、客户等）说明：尽管实际分析看起来很简单，但数据质量往往是限制因素。


  要清理`Ages`这一列，我们只需用每个参与者的惯用年龄来填充缺失值即可。尽管前面介绍得有些吓人，但用`data.table`来实现这个操作其实很快！


  回顾第 5 章的频数表：


  ```

  acesData[order(Age), .N, by = Age]

  ##     Age    N

  ##  1:  18  347

  ##  2:  19  908

  ##  3:  20  889

  ##  4:  21 1278

  ##  5:  22  821

  ##  6:  23  583

  ##  7:  24  396

  ##  8:  25 1036

  ##  9:  26  121

  ## 10:  NA  220

  ```


  我们有 220 个缺失的年龄需要修正。一种方法是使用我们刚学过的`mean()`函数。如果我们把每个`UserID`的`Age`设为其平均年龄（并设置`rm.na=TRUE`），问题就迎刃而解了！


  我们需要对所有行执行此操作，因此`i`位置的行操作为空。我们正在给`Age`赋新值，所以这里包含了新的赋值。


  现在来到了数据整理的关键时刻：我们是否要添加一个新列来占用内存？如果在`j`位置添加一个新列，我们就可以保留原始的`Age`列。这可能对未来的其他分析有帮助。另一方面，添加一个新列会增加
  6599 个新数据位，而这些数据大多是从原始列复制过来的（除了那 220 个缺失值）。此外，我们还得记住分析时*要使用哪一列*年龄数据。大多数这样的决策都需要权衡利弊。在本例中，我们创建一个名为`meanAge`的新年龄列。


  最后，我们需要的是*每位参与者*的平均年龄。因此，在数据表的最后一个位置使用`by = UserID`可以确保我们不会得到整体的平均年龄：


  ```

  acesData[, meanAge := mean(Age, na.rm = TRUE), by = UserID]

  ```


  再看一下更新后的频数表，现在使用`meanAge`，我们只剩下 26 行缺失数据。如果你进一步（自行）探索这些数据，你会发现它们全部来自一个从未报告过年龄的参与者：


  ```

  acesData[order(meanAge), .N, by = meanAge]

  ##     meanAge    N

  ##  1:      18  359

  ##  2:      19  932

  ##  3:      20  919

  ##  4:      21 1310

  ##  5:      22  844

  ##  6:      23  606

  ##  7:      24  413

  ##  8:      25 1064

  ##  9:      26  126

  ## 10:     NaN   26

  ```


  清理完数据集后，你现在就可以着手将参与者进入调查数据的情况进行可视化呈现了。图 6-20 上现在有超过 6500 个点。看着这些点，很难看出规律。不过，你会看到箱线图很好地总结了数据分布情况：一半的调查回复来自较年轻的参与者。


  生成这张图的代码与前面示例中的代码大致相同。唯一的区别是，通过将透明度（alpha）降低到 0.4，为`geom_jitter`添加了透明效果：


  ```

  ggplot(data = acesData,

  mapping = aes(x = meanAge, y = 0))+

  geom_jitter(alpha = 0.4)+

  geom_boxplot(alpha = 0.85)

