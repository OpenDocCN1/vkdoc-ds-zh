  ##  1:       (Intercept) -6541.91*** [-7605.56, -5478.26] Fixed Effects\n##  2:\
  \ flipper_length_mm    51.54*** [   47.87,    55.21] Fixed Effects\n##  3:     bill_depth_mm\
  \       22.63 [   -3.49,    48.76] Fixed Effects\n##  4:  N (Observations)     \
  \                         342 Overall Model\n```\n\n```r\n##  5:         logLik\
  \ DF                                4 Overall Model\n```\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig11_HTML.png](img/495868_1_En_11_Fig11_HTML.png)\n\
  \n图 11-11\n\n鳍长与喙深对企鹅体重的多元回归。此图仅展示鳍长与体重的独特关联。\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig10_HTML.png](img/495868_1_En_11_Fig10_HTML.png)\n\
  \n图 11-10\n\n鳍长与喙深对企鹅体重的多元回归。此图仅展示喙深与体重的独特关联。\n\n![../images/495868_1_En_11_Chapter/495868_1_En_11_Fig9_HTML.png](img/495868_1_En_11_Fig9_HTML.png)\n\
  \n图 11-9\n\n企鹅数据多元回归曲面的 3D 图形。\n\n```r\n##  6:            logLik               \
  \          -2526.97 Overall Model\n##  7:               AIC                    \
  \      5061.94 Overall Model\n##  8:               BIC                         \
  \ 5077.28 Overall Model\n##  9:                F2                             3.18\
  \ Overall Model\n## 10:                R2                             0.76 Overall\
  \ Model\n## 11:            Adj R2                             0.76 Overall Model\n\
  ## 12: flipper_length_mm              f2 = 2.25, p < .001  Effect Sizes\n## 13:\
