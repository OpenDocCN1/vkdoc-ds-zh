- '# 2. 安装包和使用库


  你已经安装了 `R` 和 RStudio 并熟悉了它们。现在是时候发现 `R` 的另一个有助于你学习统计学的功能了。


  在第 1 章中，你的第一个 `R` 脚本使用了函数 `plot(x = mtcars$wt, y = mtcars$mpg)`。然后，像变魔术一样，一个图形出现在你右下角的绘图面板中——但这并不是魔术。在幕后，你其实悄悄使用了
  `graphics` 包。


  什么是包？当一个程序员编写了打算多次使用的代码时，他们通常会为这些代码取一个名字，我们称这些名字为*函数*。一个 `R` *包*通常是一个或多个为解决常见或相似任务而收集在一起的函数。通过将这些函数收集在一个包中，该包可以与许多人共享。请记住，`R`
  是免费的，并且被世界上许多顶尖研究人员使用。每个人都有自己的技能来解决特定类型的问题。通过在包中分享他们的函数，我们都能共同受益。


  这正是你使用 `plot()` 函数时发生的事情。一些程序员（在这个例子中是 `R` 核心开发团队）聚在一起，在一个脚本中编写了一些用于创建图形的函数（包括 `plot`
  函数）。他们将所有这些代码放在 `graphics` 包中。


  使用 `plot()` 不需要你付出任何额外工作，因为有些包非常流行，默认就包含在 `R` 中。然而，大多数包并非默认包含。并非所有人都需要所有包；如果全部包含，下载
  `R` 的时间会变得太长。相反，包保存在 CRAN 上，需要时即可下载。包的内容比我们这里介绍的更丰富。如果你想了解更多关于包的信息（或许还想编写自己的包），请参阅《Advanced
  R: Data Programming and the Cloud》以获取详细信息。


  到本章结束时，你应该能够：


  *   理解包是为 `R` 添加额外功能的一种方式。

  *   使用 `install.packages()` 函数为 `R` 安装附加包。

  *   使用 `library()` 函数为你的 `R` 脚本激活包。

  *   理解何时从 CRAN 安装包，以及何时使用本地库。


  如果你已经了解包，并渴望开始学习统计学，请继续安装表 2-1 中的这些包，然后进入下一章。如果你希望跟随我们一起了解你将在本书中使用的这些包，请继续阅读本章。


  **表 2-1 包列表**


  | 包 | 用途 |

  | --- | --- |

  | `haven` | 输入和输出来自 SPSS、Stata 和 SAS 的常见统计文件类型。 |

  | `readxl` | 将 Microsoft .xlsx 文件输入到 `R`。 |

  | `writexl` | 从 `R` 输出 Microsoft .xlsx 文件。 |

  | `data.table` | 高效、便捷地管理数据/行/列。 |

  | `extraoperators` | 一个包含运算符的 R 包，用于加速日常任务。 |

  | `JWileymisc` | 一个包含 `aces_daily` 模拟数据的 R 包。 |

  | `ggplot` | 用于探索性数据分析（EDA）的可定制可视化、图形和图表。 |

  | `visreg` | 回归模型的可视化。 |

  | `emmeans` | 汇总统计模型。 |

  | `ez` | 因子实验的简便分析和可视化（我们将用于方差分析）。 |

  | `palmerpenguins` | 一个关于企鹅的新鲜有趣的数据集（目前在 GitHub 上）。 |




  ## 2.1 安装包


  一个包**每台电脑**只需安装一次。换句话说，每次开始新项目时都不应重新安装。在学习这么多新知识时，很难记住什么时候该做什么。因此，如果你和我们一样使用同一台电脑学习`R`语言，那么每个包只需要安装一次。无论是在项目中安装包，还是直接在控制台窗格中安装，都没有关系。无论哪种方式，包都会被安装到你的电脑上，并且这些功能/函数将可用于你在这台电脑上曾经拥有、正在拥有或将要拥有的任何项目。话虽如此，如果你换了一台新电脑并希望在那台新机器上运行脚本，你当然需要在那台新机器上重新安装你使用的包。


  关于包，还有一点需要了解：它们通常*依赖*于其他包。因此，在安装每个包时，你可能会发现，尽管计划只安装一个包，但在控制台窗格中看到`R`实际上正在安装好几个包。这都是包安装过程中的自然现象，无需担心。`R`足够智能，能够知道所有需要的依赖项，并且只会安装缺失的包（因此，包的安装顺序可能会有所不同）。


  要从 CRAN 安装一个新包，我们使用 `install.packages(pkgs = "")` 函数。`R` 是一种区分大小写的语言，并且 CRAN 强制执行一条规则：任何包都不能与其他包拥有完全相同的名称。但是，必须注意精确地拼写包名；否则，安装函数的搜索功能将无法工作。此外，由于
  `R` 区分大小写，还必须完美匹配大小写字母。因此，以下每个小节都不会遵循标准的大写规则。相反，我们选择仅使用完全正确的包名形式。


  在逐一安装每个包的过程中，我们还会简要提及其用法以及它为`R`基础功能增加了哪些额外特性。


  请注意，安装包时，控制台可能会输出大量信息。这看起来可能令人不知所措，但你无需担心。通常，如果出现问题，你会看到关于“error”（错误）或有时“non-zero
  exit status”（非零退出状态）的信息，这是技术领域中表示至少存在一个（或多个）错误或问题的常见方式。虽然这看起来令人困惑，但其理念源于“零退出状态”表示退出安装过程时没有问题。从这个角度看，“非零退出状态”意味着存在一些错误或问题。如果没有出现错误或“非零退出状态”，那么包安装时显示的所有信息和文本很可能都无需担心。


  最后，尽管我们会使用多个不同的附加包，但你不需要了解这些包的所有内容。也就是说，你不需要学习每一个包。我们有时只使用一个包中的几个函数，以便尽可能简单高效地完成任务。为了使用一个函数而安装一个包，却不学习该包中其他（可能很多）函数，这是完全可以接受的。


  ### haven


  在统计计算领域，`R` 是一个越来越受欢迎的新秀。由于 `R` 是新秀，有时需要从诸如 SPSS、Stata 或 SAS 等经典程序导入数据。`haven` 包
  [19] 提供了从这些来源读取数据到 `R` 的函数。


  取决于你的电脑，如果系统之前从未安装过 `R` 或任何包，你可能会发现安装的不仅仅是 `haven` 包。这是因为 `haven` 本身依赖于其他一些包。同样，如果在运行
  `install.packages(pkgs = "haven")` 后，你看到输出的最后部分与我们的相符，那么你的第一个外部包安装就成功了。我们将在关于数据输入和输出的第
  3 章中介绍 `haven` 函数的实际应用。


  ```

  install.packages(pkgs = "haven")

  ## 正在将包安装到 ''C:/Users/.../R/win-library/4.0''

  ## （因为未指定 ''lib''）

  ## 包 ''haven'' 成功解压并检查了 MD5 校验和

  ##

  ## 下载的二进制包位于

  ##      C:\...\downloaded_packages

  ```


