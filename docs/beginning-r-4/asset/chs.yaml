  ### 示例


  对于最后一个箱线图示例，我们来探讨**异常值**的概念。回想一下图 6-11 中的“完美”数据集。看看该图左侧的正常数据。现在，再看看图 6-21 的左侧（正常数据）。请注意箱线图的中间
  50%部分非常狭窄。这很好理解，因为那里正是直方图最高的区域。接着，两边的须线相对较长；这也说得通。那些较长的区域就是直方图两边的长尾区域。


  现在，看看图 6-21 中那些放大的点。这些点在箱线图上的位置，对应着抖动散点图中最稀疏的那些点。这些稀疏的点（既包括作为箱线图总结一部分的大点，也包括代表该数据集实际原始数据值的小点）就是**异常值**。


  在太阳系中，外围的小行星距离中心非常遥远。同样地，数据中的异常值也是距离中心非常远的点。


  从图 6-21 中的这两个箱线图还能注意到其他一些现象：正态分布的箱线图中间部分非常紧凑，须线更长，并且存在异常值（大点）。而均匀分布的箱线图，其四个部分间隔均匀，并且没有异常值。尽管如此，这两组数据的中位数，乃至均值，都是相同的。


  这两组数据共享中位数和众数。它们的范围大致都在 0 到 5 之间（略有增减）。然而它们的箱线图看起来却不同。我们该如何对比这两组数据呢？这种对比有什么用处吗？




  '
- '# 6.5 湍流


  答案是肯定的。我们用来描述图 6-21 中差异的语言，正是数据*湍流*或*方差*的语言。正态数据围绕均值聚集，而均匀数据则不然。


  一般而言，在其他条件相同的情况下，正态数据由于其“围绕均值聚集”的特性，其**方差**或**标准差**会比其它数据*更小*。


  记住我们在图 6-22 中的“近乎完美”数据集，请考虑以下输出（再次提醒，对于这个“完美”示例，我们隐藏了代码，只显示输出结果）。请注意正态数据和均匀数据之间标准差的差异：


  ```

  ##      variable Variance StandardDeviation ArithmeticMean Median

  ##  1:    normal   0.5486            0.7406          2.505  2.503

  ##  2:   uniform   2.0830            1.4433          2.522  2.545

  ```


  你之前很可能已经接触过标准差。你有没有在新闻中看到过民调显示“……±3%”？样本估计中的这种波动或涨落或湍流，就与方差和标准差相关。


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig21_HTML.jpg](img/495868_1_En_6_Fig21_HTML.jpg)


  **图 6-21** 箱线图中的异常值


  正式地说，方差是标准差的平方。另一种说法是，方差开平方根就是标准差。


  回想一下我们之前的讨论：大写拉丁字母和小写希腊字母用于表示总体，而小写拉丁字母用于表示样本。当然，我们使用 `R` 来进行计算。不过，我们仍有必要聊聊这些正式的公式。这有助于你将来选择更深入地探索统计学，尽管本书是一本方法书。


  对于所有四个公式（总体方差、总体标准差、样本方差和样本标准差），其整体思想是相同的。目标是*将每一个*单独的行元素（例如，*x*[*i*]）与算术均值进行比较。在数学中，差异是通过减法来求得的。因此，这四个公式的核心都是
  *x*[*i*] − *MEAN*。


  不要让这些符号迷惑了你！它们实际上只是一个公式，而不是四个。记住，总体均值是 *μ*，而样本均值是 ![$$ \overline{x} $$](img/495868_1_En_6_Chapter_TeX_IEq4.png)。当然，我们还有用于总体数量的
  *N* 和用于样本数量的 *n*。这些公式唯一的真正区别在于，计算总体时是除以总数；而计算样本时，则是除以 *n* − 1。


  请记住，样本比总体要小。在现实生活中，我们几乎从未拥有过总体层面的参数数据。相反，我们通过抽取样本，然后将从较小子样本中学到的东西推广到更大的总体。*n* −
  1 是对公式的一个调整，目的是使样本方差和样本标准差比没有这个调整时更大。我们将在后续章节中看到，这如何让我们能够从样本中对总体做出更保守的估计。


  可以这样理解：在正态数据中，由于数据聚集在中心附近，你可以相当确定，如果你从图中随机抽取一个点，那么你很可能抽到一个靠近中间的点。相比之下，均匀数据则分布在一个更宽的区域内。在某种程度上，标准差告诉你在随机抽取中最可能获得的、围绕中位数的范围。因此，通过使样本的标准差变宽，统计学家确保我们向人们报告“大多数”结果时，能给出一个更宽泛的可能范围。同样，我们稍后将再次深入探讨这个概念。


  关于方差和标准差，我们要指出的最后一点是：`R` 专注于利用样本来推断总体。因此，`R` 中常用的方差函数（`var()`）和标准差函数（`sd()`）会自动使用这些公式的样本版本。


  **总体方差公式：**


  ![$$ {\sigma}²=\frac{\sum {\left({x}_i-\mu \right)}²}{N} $$](img/495868_1_En_6_Chapter_TeX_Equc.png)


  **总体标准差公式：**


  ![$$ \sigma =\sqrt{\frac{\sum {\left({x}_i-\mu \right)}²}{N}} $$](img/495868_1_En_6_Chapter_TeX_Equd.png)


  **样本方差公式 – `var()`：**


  ![$$ {s}²=\frac{\sum {\left({x}_i-\overline{x}\right)}²}{n-1} $$](img/495868_1_En_6_Chapter_TeX_Eque.png)


  **样本标准差公式 – `sd()`：**


  ![$$ s=\sqrt{\frac{\sum {\left({x}_i-\overline{x}\right)}²}{n-1}} $$](img/495868_1_En_6_Chapter_TeX_Equf.png)


  手动计算样本标准差公式是有价值的。有一道练习会让你这样做。然而，绝大多数这类手动计算都是在非常小的、玩具数据集上进行的。当然，我们不会在较大的数据集上这样做（即使像
  344 只企鹅这样相对较小的“较大数据”也不行）。现代数据量太大，无法手动计算。


  在当今更大的数据集中，我们更常关注的是如何使用标准差来帮助概括和描述数据。一种方法是用标准差来描述数据的“通常范围”。就像你在民意调查中可能看到的“60% 支持率
  ±3%”一样，我们可以将数据视为*均值*加上或减去标准差。


  为了直观地展示样本标准差 *s* 的这种用法，请看图 6-22，我们“完美”的正态曲线周围有标记着均值附近箱体的线段。请注意，被 `1s`（代表*一个标准差*）相交的直方图条柱代表了大部分计数（记住直方图的高度意味着该处有更多数据）。然后，如果我们将距离扩展到
  `2s`，我们就能覆盖几乎所有的条柱。


  事实上，在统计学中，有一条规则叫做**经验法则**，它指出约 68% 的数据将落在第一个标准差的区域内。该规则进一步说明，约 95% 的数据落在两个标准差的区域内，约
  99.7% 的数据落在三个标准差的区域内。事实上，这条规则有时也被称为 *68-95-99.7* 法则。虽然你会在本书中学到如何使用代码来计算你需要的任何精确比率，但了解这条经验法则有助于理解，仅通过知道标准差和均值，就能很好地判断特定数据集可能的行为模式。


  如果你在商业领域待过，你可能听说过“六西格玛”。这种管理哲学的名称来源于一个理念：工作的精确度——即使在质量上存在通常程度的*方差*——也应当高到，即使在距离均值*六个*标准差处，产品仍然具有可用的质量。


  正如你可能想象到的，要保持在标准差如此极端的范围内还能让产品可用，就需要标准差非常小，这样 ![$$ \overline{x}\pm 6s $$](img/495868_1_En_6_Chapter_TeX_IEq5.png)
  才能停留在一个非常狭窄的范围内。


  图 6-23 [6] 展示了看待同一概念的另一种方式。这个正态分布图用 σ 符号表示标准差，并且它们向外延伸到了 ±4σ。现在，不要让图 6-23 中的信息让你不知所措；我们将在第
  9 章更详细地讨论这张图。目前，请关注曲线底部附近写有“与均值的标准差个数”的那条线。看到在 0 的两侧分别有 −1σ 和 +1σ 吗？注意到这两点之间的区域被标记为
  0.3413 吗？当然，如果我们把这两个区域加起来，0.3413 + 0.3413 = 0.6826。这约等于 68%，这就是经验法则中 68% 这个数字的由来。类似地，如果我们把
  −3σ 到 +3σ 之间的区域都算上，我们得到 0.0214 + 0.1359 + 0.3413 + 0.3413 + 0.1359 + 0.0214 = 0.9972。这就是经验法则中
  99.7% 这个数字的由来。




  图 6-22 来自一个用`R`生成的*样本*，而图 6-23 则来自一个（理论上的）*总体*。这两张图有助于我们理解，思考样本（以及数据点的概率）如何帮助我们认识总体。


  当我们把注意力转向一些使用熟悉数据集的**标准差**示例时，请记住，你已经在本章中学习和思考了很多内容。目前，标准差或许看起来还不能简洁地概括成千上万的数据点。你需要时间充分运用这些新学的描述方式，直到它们对你真正有用。在探索数据的过程中，请专注于实践这些理念和视角。随着时间推移，通过比较和对照更多的数据集，你将逐渐培养出对各类描述符所探索内容的感知力。


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig23_HTML.jpg](img/495868_1_En_6_Fig23_HTML.jpg)


  图 6-23


  正态分布 [6]


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig22_HTML.png](img/495868_1_En_6_Fig22_HTML.png)


  图 6-22


  标准差区间覆盖的柱状条带


  ### 示例


  在本示例中，我们使用三个不同但独立的函数。第一个函数是 `summary()`，它汇总了前几节讨论的几个指标。具体来说，它给出了**均值**、**极差**和**四分位数**。如果忽略均值，其余部分有时被描述为*五数汇总*。注意，五数汇总正是箱线图上的五个关键点。箱线图的设计初衷就是为了帮助我们一次性直观地理解多个五数汇总。`summary()`
  函数的输入是一个单独的数据列，并且要求该列是定距或定比类型的定量数据：


  ```

  summary(penguinsData$flipper_length_mm)

  ##    Min. 1st Qu.  Median    Mean 3rd Qu.   Max.   NA''s

  ##     172     190     197     201     213    231      2

  ```


  从汇总结果中，我们看到了许多关于鳍状肢长度的已知信息。其极差范围从最小值 172 毫米到最大值 231 毫米。由于中位数 197 小于均值 201，可知数据集中有一个较大的簇更靠近最大值而非最小值（可查看图
  6-9 确认这是**巴布亚企鹅**物种）。最后，我们知道所有鳍状肢长度中，有一半介于第一四分位数 190 和第三四分位数 213 之间。


  我们之前提到过 `var()` 和 `sd()`，分别用于计算样本方差和样本标准差。它们同样接受定距或定比类型的定量数据。它们还可以将 `rm.na = TRUE`
  作为第二个参数传入（仅当数据包含缺失值时需要）：


  ```

  var(penguinsData$flipper_length_mm, na.rm = TRUE)

  ## [1] 197.7

  sd(penguinsData$flipper_length_mm, na.rm = TRUE)

  ## [1] 14.06

  ```


  根据我们对*经验法则*的讨论，可以猜想 68% 的数据应该落在均值 201 ± 14 的范围内。实际情况果真如此吗？通过加减计算，我们得到的一个标准差区间是从
  187 到 215。根据四分位数数据来看，这个区间*大约*比中间 50% 的数据范围略大一点。


  如果想更精确地验证，快速计数会有所帮助。虽然可以做些复杂的操作，但这是探索性数据分析。记住企鹅数据集有 344 个观测值，而实际计数结果为 227/344 =
  0.66，这表明这些数据并不完全符合经验法则。当然，你对此并不会感到惊讶。经验法则适用于*正态*数据；正如你之前所见，企鹅数据集并不真正符合那种模式。尽管如此，这个估计仍然很接近，实际上非常接近：


  ```

  count <- penguinsData[flipper_length_mm %between% c(187, 215),.N]

  count

  ## [1] 227

  count/nrow(penguinsData)

  ## [1] 0.6599

  ```


  经验法则适用于正态数据。标准差区间与经验法则的匹配度越低，说明你的数据偏离正态分布越远。你将在后续学习其他检验正态性的方法（除了你已经掌握的最简单的目视检查）。不过，这依然是你的技能库中又一个探索性工具。


  最后，回顾我们对方差和标准差的形式化探讨，这两个公式是相关的。方差是标准差的平方，因此方差的平方根（`sqrt()`）应当等于标准差。为了增加一点趣味（并确保你对自己的逻辑运算符保持熟练），我们加入了一个验证：


  ```

  sqrt(var(penguinsData$flipper_length_mm, na.rm = TRUE)) ==

  sd(penguinsData$flipper_length_mm, na.rm = TRUE)

  ##  [1] TRUE

  ```




  ### 示例


  虽然`penguinsData`数据因简短易懂而总是适合探索，但`acesData`数据是基于人类研究模拟的。因此，尝试将这些数据也运用我们所学的内容总是有益的。你能找到并练习这些技术的数据集越多，你训练比较与对比能力的速度就会越快、效果也会越好。反过来，比较与对比也是数据科学中*艺术性*的一部分。它能帮助你发现数字背后的故事，并向利益相关者、消费者、管理者或社区传递重要的事实。


  我们首先使用`summary()`函数，并注意到这些数据中存在`NA`值：


  ```

  summary(acesData$meanAge)

  ##    Min. 1st Qu.  Median    Mean 3rd Qu.   Max.   NA''s

  ##    18.0    20.0    21.0    21.7    23.0   26.0     26

  ```


  由于存在缺失数据，我们在`var()`和`sd()`函数中加入了第二个参数选项`na.rm = TRUE`。现在是提及研究中一个关键点的好时机。即使是在完美的随机样本中，参与者也有权不回应（这是道德要求，也是知情同意的一部分）。如果参与者随机选择不回应，那么一切还好。然而，如果参与者按照某种模式不回应，那么尽管你做了所有努力，偏差仍会重新出现在你的数据中。传统上，统计方程别无选择，只能删除`NA`值并接受偏差的回归。虽然这超出了本书的范围，但你可能希望查阅我们的一本统计编程与数据模型书籍
  [22]，以了解更多关于“解决”*缺失数据*（并减少偏差）的内容。


  不过目前，我们只需简单地移除缺失变量：


  ```

  var(acesData$meanAge, na.rm = TRUE)

  ## [1] 4.899

  sd(acesData$meanAge, na.rm = TRUE)

  ## [1] 2.213

  ```


  根据我们对*经验法则*的讨论，我们可能仍然会想象 68%的数据应该落在 21.7 岁±2.2 岁之间。这是否成立？相减和相加得到的一个标准差范围是 19.5 到
  23.9。基于我们的四分位数数据，这个范围看起来*大致*是合理的，比中间 50%的数据范围稍宽一些。


  然而，从之前企鹅数据的例子出发，我们暂停片刻，快速查看一下直方图。正如你所见，图 6-24 看起来并不太符合正态分布。因此，我们怀疑经验法则可能并不完全适用于这些数据。不过，它看起来接近正态，所以我们或许可以预期某些接近经验法则的结果：


  ```

  ggplot(data = acesData,

  mapping = aes(x = meanAge))+

  geom_histogram()

  ## ''stat_bin()'' using ''bins = 30''. Pick better value with ''binwidth''.

  ## Warning: Removed 26 rows containing non-finite values (stat_bin).

  ```


  和以前一样，为了更仔细地检查，快速计数会有所帮助。`acesData`中存在一些缺失的年龄数据，所以记得要对`meanAge`数据使用`is.na()`逻辑检查。这个检查会找到缺失值，因此必须用感叹号进行取反。这些数据在直方图上看起来比企鹅数据更接近正态，而最终结果
  0.56 也更接近经验法则：


  ```

  count <- acesData[meanAge %between% c(19.5, 23.9) &

  !is.na(meanAge),

  .N]

  count

  ## [1] 3679

  count/nrow(acesData[!is.na(meanAge)])

  ## [1] 0.5597

  ```


