  \n话虽如此，我们在图 12-2 中展示了一个常规诊断的示例。对此，我们的解读方式与往常相同：\n\n![../images/495868_1_En_12_Chapter/495868_1_En_12_Fig2_HTML.png](img/495868_1_En_12_Fig2_HTML.png)\n\
  \n*图 12-2*：调节回归模型的回归诊断图\n\n```r\nmint1d <- modelDiagnostics(mint1)\nplot(mint1d,\
  \ ncol = 2, ask = FALSE)\n```\n\n有一点需要注意：在图 12-2 右侧面板的残差与预测值散点图中，分位数回归拟合失败。判断依据是，通常用于突出显示残差第\
  \ 10 和第 90 百分位数的蓝色虚线，其位置明显不在第 10 或第 90 百分位数上。这些线条通常有助于我们直观地判断百分位数是否大致平行。这并不值得担忧；我们在此情况下只需忽略它们即可。添加蓝色线条始终只是为了辅助视觉解读，而非替代人工判断。\n\
  \n## 12.4 R 中的连续变量×连续变量调节效应\n\n两个连续预测变量也可以在回归中产生交互作用。其概念解释和实际应用与我们本章前面讨论的连续×分类变量的交互作用非常相似。\n\
  \n或许主要区别在于，由于交互作用中的两个预测变量都是连续的，我们无法讨论某个特定人群组在某一变量上的斜率。相反，我们必须讨论在另一个变量的特定取值上的简单斜率。当然，我们在前文关于压力变量的部分已经看到了如何处理这种情况。\n\
  \n拥有两个连续预测变量也使得绘制最终的回归曲面变得更加困难。这样的图形严格来说是三维的。尽管如此，这并没有看起来那么可怕。这是因为在现实生活中的模型中，我们经常使用多个预测变量；因此，我们无法以任何人类可见的方式来绘制整个模型。毕竟，一个七维的图形会是什么样子呢？所以，虽然我们会展示一个三维图形，但它仅仅有助于学习一些良好的结果解读原则。大多数现代模型都无法被完全图形化。\n\
  \n在我们的示例中，我们考察压力、年龄及其交互作用对积极情感的预测作用。拟合调节回归模型的过程与我们所有其他回归模型遵循相同的格式。我们将此模型命名为`mint2`：\n\
  \n```r\nmint2 <- lm(formula = PosAff ~ STRESS * Age,\ndata = acesData)\n```\n\n\
  在深入探讨代码、方程、解读和输出之前，我们先看一下这个回归曲面的样子。你可能还记得第 11 章中我们有几个三维回归曲面的例子。那时曲面是完全平坦的，像一张纸。当我们加入交互作用时，就意味着回归曲面不再是平坦的。它发生了扭曲。我们刚才拟合的模型`mint2`所预测的、在不同压力和年龄水平下的积极情感值，如图\
  \ 12-3 所示。你可以看到这个曲面并不平坦。如果你观察年龄与积极情感之间的斜率，它会随着压力的取值不同而不同。同样，如果你观察压力与积极情感之间的斜率，它也会随着年龄的变化而变化。这就是交互作用的含义。当两个连续变量交互时，其中一个变量没有天然的“断点”，所以我们不能仅仅绘制三条线来涵盖所有情况。要涵盖所有情况，我们需要绘制一个回归曲面，如图\
  \ 12-3 所示。\n\n![../images/495868_1_En_12_Chapter/495868_1_En_12_Fig3_HTML.png](img/495868_1_En_12_Fig3_HTML.png)\n\
  \n*图 12-3*：调节多元回归曲面的三维图形\n\n本节的剩余部分将尝试阐明我们如何理解、解读、检验和展示调节回归模型的结果，以及如何将图 12-3 转化为文字和数字，并通过检验来确定哪些差异是可靠的，哪些可能仅仅只是噪声。这是一项需要培养的重要技能，因为现实生活中的大多数模型都无法完全图形化。因此，我们必须建立起相应的思维理解能力，使得数值输出“合乎情理”。\n\
  \n作为一个方程，`mint2`可以表示为：\n\n![$$ PosAff={b}_0+{b}_1\\ast STRESS+{b}_2\\ast Age+{b}_3\\\
  ast \\left( STRESS\\ast Age\\right)+\\varepsilon $$](img/495868_1_En_12_Chapter_TeX_Equl.png)\n\
  \n交互项的回归系数，即 *b*[3]，表示当另一个变量变化一个单位时，压力或年龄的简单斜率会如何不同。如果我们重新排列方程并提取公因式（压力或年龄），可以得到以下等价的方程：\n\
  \n\n\n![$$ {\\displaystyle \\begin{array}{l} PosAff={b}_0+{b}_1\\ast Stress+{b}_2\\\
  ast Age\\\\ {}\\kern2.52em +{b}_3\\ast \\left( Stress\\ast Age\\right)+\\varepsilon\
  \ \\\\ {}\\kern2.04em ={b}_0+{b}_1\\ast Stress\\\\ {}\\kern2.759999em +\\left({b}_2+{b}_3\\\
  ast Stress\\right)\\ast Age+\\varepsilon \\\\ {}\\kern2.04em ={b}_0+{b}_2\\ast Age\\\
  \\ {}\\kern2.759999em +\\left({b}_1+{b}_3\\ast Age\\right)\\ast Stress+\\varepsilon\
  \ \\end{array}} $$](img/495868_1_En_12_Chapter_TeX_Equm.png)\n\n这些强调说明，在包含交互作用的模型中，压力（`Stress`）的简单斜率是`b[1]\
  \ + b[3] * Age`。`b[1]`是当年龄为零时压力的简单斜率。\n\n同样，年龄（`Age`）的简单斜率是`b[2] + b[3] * Stress`。`b[2]`是当压力为零时年龄的简单斜率。\n\
  \n虽然压力的范围是 0 到 10，因此零值并非不合理，但年龄在此样本中的范围是 18 到 26，因此求零岁时的压力简单斜率是对样本数据的严重不合理外推。\n\n\
  我们可以像处理所有其他回归模型一样获取模型信息和效应量：\n\n```r\nmint2Test <- modelTest(mint2)\nAPAStyler(mint2Test)\n\
  ##                 Term                  Est          Type\n##  1:      (Intercept)\
  \ 2.82** [ 0.86, 4.77] Fixed Effects\n##  2:           STRESS   0.56 [-0.05, 1.16]\
  \ Fixed Effects\n##  3:              Age   0.01 [-0.08, 0.10] Fixed Effects\n##\
  \  4:       STRESS:Age -0.03* [-0.06, 0.00] Fixed Effects\n##  5: N (Observations)\
  \                  187 Overall Model\n## ---\n## 11:               R2          \
  \       0.13 Overall Model\n## 12:           Adj R2                 0.12 Overall\
  \ Model\n## 13:           STRESS  f2 = 0.02, p = .073  Effect Sizes\n## 14:    \
  \          Age  f2 = 0.00, p = .801  Effect Sizes\n## 15:       STRESS:Age  f2 =\
  \ 0.03, p = .024  Effect Sizes\n```\n\n在输出中，我们可以看到`b[3]`（交互作用系数）为 -0.03，且具有统计显著性（`p`\
  \ < .05，基于星号 *）。负号表示，随着压力或年龄的增加，另一变量的简单斜率会减小。\n\n两个简单斜率均未达到统计显著性，即当年龄为零时压力的简单斜率（即`b[1]`，0.56）与零无显著差异，当压力为零时年龄的简单斜率（即`b[2]`，0.01）与零也无显著差异。\n\
  \n我们看到交互作用具有较小的效应量，`f² = 0.03`。与分类变量×连续变量的交互作用类似，我们不解释其他变量的效应量，因为它们本质上是当另一个变量为零时的简单效应量。例如，单独解释压力的效应量，就是当年龄为零时压力效应的效应量。\n\
  \n我们可以通过**中心化**变量来改进简单效应量的**解释**。想象一下给一棵树拍照。树牢牢地扎根在地下，但你可以通过移动相机，确保树是**居中**的。这样做并不会改变树的任何属性。然而，与拍摄一张偏斜的照片相比，这能帮助你的朋友更好地理解这棵树。\n\
  \n在我们的案例中，虽然压力对于参与者来说可以为零，但年龄不能：\n\n```r\nrange(acesData$Age,\nna.rm = TRUE)\n##\
  \ [1] 18 26\nsummary(acesData$Age)\n##    Min. 1st Qu.  Median    Mean 3rd Qu. \
  \   Max.    NA's\n##    18.0    20.0    21.0    21.6    23.0    26.0       2\n```\n\
  \n我们注意到均值是 21.6，因此我们可能决定对年龄变量进行中心化或调整，使得 0 表示 22 岁而不是 0 岁。就像在照片中把一棵大树居中并不一定意味着树是完全对称的一样，我们也可以决定在哪里以及如何对数据进行中心化。虽然这个想法听起来可能很复杂，但编码却非常简单。我们创建一个新列，命名为`Age\
  \ Centered at 22`，或简写为`Agec22`。这是一个列运算，我们希望每个参与者的每个年龄都比原来小 22：\n\n```r\nacesData[,\
  \ Agec22 := Age - 22]\n```\n\n完成！\n\n顺便提一下，就像我们在前一章中做的`log()`**变换**一样，中心化也是一种数据变换，帮助我们更好地使用或理解数据和结果。如果你在本书接近尾声时，已经在寻找接下来要学习的新主题，那么变换将是一个值得加入你清单的好内容。\n\
  \n变换必须在模型拟合**之前**进行。因此，我们使用这个新中心化的变量重新拟合回归模型，并再次运行`modelTest()`。记住，树仍然是那棵树！实际上什么也没有改变，只是我们现在得到了压力在`Agec22`为零（即针对\
  \ 22 岁的人，这更合理）时的简单效应，包括简单斜率和简单效应量，而不是针对零岁的人（这不合理）：\n\n```r\nmint2b <- lm(formula\
  \ = PosAff ˜ STRESS * Agec22,\ndata = acesData)\nmint2bTest <- modelTest(mint2b)\n\
  APAStyler(mint2bTest)\n##                 Term                     Est         \
  \ Type\n##  1:      (Intercept)  3.07*** [ 2.87,  3.27] Fixed Effects\n##  2:  \
  \         STRESS -0.15*** [-0.21, -0.09] Fixed Effects\n##  3:           Agec22\
  \     0.01 [-0.08,  0.10] Fixed Effects\n##  4:    STRESS:Agec22   -0.03* [-0.06,\
  \  0.00] Fixed Effects\n##  5: N (Observations)                     187 Overall\
  \ Model\n## ---\n## 11:               R2                    0.13 Overall Model\n\
  ## 12:           Adj R2                    0.12 Overall Model\n## 13:          \
  \ STRESS     f2 = 0.12, p < .001  Effect Sizes\n## 14:           Agec22     f2 =\
  \ 0.00, p = .801  Effect Sizes\n## 15:    STRESS:Agec22     f2 = 0.03, p = .024\
  \  Effect Sizes\n```\n\n现在，当我们说什么都没改变时，我们是指**实质性**的内容没有改变。毕竟，如果你给一棵树拍了一张偏斜的照片，你可能会漏掉一些树枝。而居中后，你可能会看到树后面一栋以前没注意到的建筑。因此，你会注意到截距发生了变化，并且一些其他数字看起来也会不同。然而，压力与年龄之间的交互作用——无论年龄是否中心化——**不会改变**，就像无论你如何构图，树与地面之间的交互作用都不会改变一样。\n\
  \n与其他交互作用类似，促进解释的一种常用方法是计算简单斜率并绘制成图。两个变量都是连续的，因此我们没有自然定义的“组”。然而，我们可以使用之前的方法，将“低”、“平均”和“高”定义为低于均值一个标准差、均值、以及高于均值一个标准差。\n\
  \n尽管我们努力对模型进行了中心化，但如果基于标准差通过`R`计算简单斜率，则中心化变量并没有实际好处，因此我们将直接使用原始模型`mint2`。\n\n首先，我们将计算在不同压力水平下年龄的简单斜率。这实际上揭示了一个情况，即*M*\
  \ ± 1*SD* 的方法有时并不适用。`STRESS`的取值范围是 0 到 10，但低于均值一个标准差会出现负值（可以从全局环境中的变量`m2.MeanSDlow`看出）。负的压力值是不可能的，因此我们手动将其设为最小值\
  \ 0：\n\n```r\nm2.MeanSDlow <- mean(acesData$STRESS, na.rm = TRUE) -\nsd(acesData$STRESS,\
  \ na.rm = TRUE)\nm2.MeanSD <- mean(acesData$STRESS, na.rm = TRUE)\nm2.MeanSDhigh\
  \ <- mean(acesData$STRESS, na.rm = TRUE) +\nsd(acesData$STRESS, na.rm = TRUE)\n\
  m2.MeanSDlow <- 0\n```\n\n`emtrends()`代码的格式与我们在本章前面分类变量×连续变量交互作用中使用的格式相同：\n\n\n\n\
  ```R\nm2int.slopes <- emtrends(\n  object = mint2,\n  specs = \"STRESS\",\n  var\
  \ = \"Age\",\n  at = list(STRESS = c(m2.MeanSDlow,\n                       m2.MeanSD,\n\
  \                       m2.MeanSDhigh)))\nsummary(m2int.slopes, infer = TRUE)\n\
  ##  STRESS Age.trend     SE  df lower.CL upper.CL t.ratio p.value\n##    0.00  \
  \  0.0114 0.0453 183   -0.078   0.1008  0.252  0.8014\n##    2.12   -0.0565 0.0343\
  \ 183   -0.124   0.0111 -1.649  0.1009\n##    4.55   -0.1342 0.0486 183   -0.230\
  \  -0.0384 -2.762  0.0063\n##\n## Confidence level used: 0.95\n```\n\n观察结果，我们可以看到，对于压力水平较低的人群，年龄与积极情感无关（第一行的\
  \ p 值大于 alpha）。\n\n只有当压力高于均值一个标准差时，我们才会发现年龄较大的人积极情感较低。具体来说，对于压力值为 4.6（高于均值一个标准差）的人群，他们每增加一岁，积极情感预计会下降\
  \ -0.136，*p* = .010。\n\n接下来，我们可以用同样的方法计算不同年龄下压力的简单斜率。不过，这次我们将年龄四舍五入到最近的整年。这样做有助于我们更好地进行解读：\n\
  \n```R\nm2.MeanSDAgelow <- round(mean(acesData$Age, na.rm = TRUE) -\n          \
  \                sd(acesData$Age, na.rm = TRUE), 0)\nm2.MeanSDAge <- round(mean(acesData$Age,\
  \ na.rm = TRUE), 0)\nm2.MeanSDAgehigh <- round(mean(acesData$Age, na.rm = TRUE)\
  \ +\n                           sd(acesData$Age, na.rm = TRUE), 0)\n```\n\n使用我们设定的年龄截点，让\
  \ `emtrends()` 执行计算，然后查看 `summary()`：\n\n```R\nm2intAge.slopes <- emtrends(\n  object\
  \ = mint2,\n  specs = \"Age\",\n  var = \"STRESS\",\n  at = list(Age = c(m2.MeanSDAgelow,\n\
  \                    m2.MeanSDAge,\n                    m2.MeanSDAgehigh))\n)\n\
  summary(m2intAge.slopes, infer = TRUE)\n##  Age STRESS.trend     SE  df lower.CL\
  \ upper.CL t.ratio p.value\n##   19      -0.0521 0.0504 183   -0.151   0.0473 -1.034\
  \  0.3024\n##   22      -0.1481 0.0317 183   -0.211  -0.0856 -4.676  <.0001\n##\
  \   24      -0.2121 0.0443 183   -0.300  -0.1247 -4.786  <.0001\n##\n## Confidence\
  \ level used: 0.95\n```\n\n从这些结果中，我们看到，除了最年轻的参与者外，对于所有其他人，更高的压力与显著更低的积极情感相关（*p*\
  \ < .001）。对于 19 岁的参与者（低于年龄均值一个标准差），方向是相同的，但该简单斜率不具有统计学显著性（p 值大于 0.05 的 alpha 水平）。\n\
  \n我们可以使用 `visreg()` 函数来绘制模型中的简单斜率。我们需要一个新的参数 `breaks`，它指定要使用的断点，因为我们的调节变量是连续型变量。当我们有分类调节变量时，`visreg()`\
  \ 会直接使用该分类变量的不同水平，但现在最好由我们选择并指定所需的断点。结果如图 12-4 所示，该图以图形方式展示了我们之前用 `emtrends()` 进行的简单斜率检验。通常，同时进行数值简单斜率检验和绘制图形会很有帮助。图形有助于人们理解模式，而数值检验则为视觉呈现提供了具体的值和\
  \ p 值：\n\n![图 12-4：带有交互项的调节回归。](img/495868_1_En_12_Fig4_HTML.png)\n\n**图 12-4**\
  \ 预测积极情感的压力与年龄交互作用的调节回归。线条为在年龄 M – 1 SD、均值及 M + 1 SD 处的预测值，并带有 95% 置信区间\n\n```R\n\
  visreg(mint2, xvar = \"STRESS\", by = \"Age\",\n       breaks = c(m2.MeanSDAgelow,\
  \ m2.MeanSDAge, m2.MeanSDAgehigh),\n       partial = FALSE, rug = FALSE, overlay\
  \ = TRUE,\n       gg = TRUE) +\n  ggtitle(\"STRESS and Age as predictors\")\n```\n\
  \n在线性模型中，斜率的差异是线性的，因此均值大约会位于低值和高值（均值 – 1 SD 和均值 + 1 SD）的中间。有时为了让图形看起来更简洁，人们会省略均值简单斜率的线条，只展示极端值。我们还可以使用\
  \ `ggplot2` 包中的 `annotate()` 函数来添加一些文本标签。这里我们添加了从 `emtrends()` 计算出的简单斜率和 p 值，以便将数值摘要包含在图中，并使用\
  \ `ylab()` 函数重新标记 y 轴，使其更简洁。结果如图 12-5 所示：\n\n![图 12-5：带有交互项的调节回归。](img/495868_1_En_12_Fig5_HTML.png)\n\
  \n**图 12-5** 预测积极情感的压力与年龄交互作用的调节回归。线条为在年龄 M – 1 SD 和 M + 1 SD 处的预测值，并带有 95% 置信区间\n\
  \n```R\nvisreg(mint2, xvar = \"STRESS\", by = \"Age\",\n       breaks = c(19,  24),\n\
  \       partial = FALSE, rug = FALSE, overlay = TRUE,\n       gg = TRUE) +\n  ggtitle(\"\
  Stress x Age interaction on Positive Affect\") +\n  annotate(\"text\", x = 5, y\
  \ = 3, label = \"Age M - 1 SD (19): b = -.05, p = .302\") +\n  annotate(\"text\"\
  , x = 5, y = 1.6, label = \"Age M + 1 SD (24): b = -.21, p < .001\") +\n  ylab(\"\
  Positive Affect\")\n```\n\n正如我们之前指出的，交互作用中不存在方向性。一个变量并非总是预测变量，另一个也不总是调节变量。你可以选择将任一变量绘制在\
  \ x 轴上。\n\n因此，也有必要按压力水平分解年龄的简单斜率，如图 12-6 所示：\n\n![图 12-6：带有交互项的调节回归。](img/495868_1_En_12_Fig6_HTML.png)\n\
  \n**图 12-6** 预测积极情感的压力与年龄交互作用的调节回归。线条为在压力 M – 1 SD、均值及 M + 1 SD 处的预测值，并带有 95% 置信区间\n\
  \n```R\nvisreg(mint2, xvar = \"Age\", by = \"STRESS\",\n       breaks = c(m2.MeanSDlow,\n\
  \                  m2.MeanSD,\n                  m2.MeanSDhigh),\n       partial\
  \ = FALSE, rug = FALSE, overlay = TRUE,\n       gg = TRUE) +\n  ggtitle(\"STRESS\
  \ and Age as predictors\")\n```\n\n## 12.5 总结\n\n本章探讨了什么是统计调节效应，以及如何通过回归中的交互项对其进行检验。您应该能够理解如何检验调节效应，以及在出现显著交互作用时，如何通过简单斜率或效应以及图表来解读和呈现结果。表\
  \ 12-1 可以作为您在本章所学关键概念的良好参考。\n\n**表 12-1** 章节总结\n\n| 概念 | 含义 |\n| --- | --- |\n|\
  \ `lm()` | 用于拟合回归模型的函数，包括调节回归。 |\n| `modelTest()` | 用于以简洁方式汇总回归模型（包含置信区间和效应量）的函数。\
  \ |\n| `emmeans()` | 用于从回归模型中计算分类预测变量各组的估计边际均值及组间均值差异的函数。 |\n| `emtrends()` | 用于在回归模型存在交互作用时计算连续变量简单斜率的函数。\
  \ |\n| `visreg()` | 用于绘制和可视化回归模型（包括调节回归模型）结果的函数。 |\n\n## 12.6 实践精进\n\n通过完成一些练习题来检查你的进度并在实践中成长。理解性质的问题会提出批判性思维问题，最好通过书面或口头回答。统计学的艺术之一在于成功地将结果传达给你的利益相关者或受众。有时受众是高度技术性的，而其他时候则非常非技术性。练习题是对章节中所探讨概念的更直接应用。\n\
  \n\n\n### 理解检查\n\n1.  直线的斜率表示 x 轴输入与 y 轴输出之间的变化率关系。斜率越陡，变化率越快。请查看图 12-6。是否存在某个压力水平，使得年龄成为积极因素？哪条直线的斜率最陡？对于斜率最陡的直线，年龄每*增加*两年，积极情绪大约会*减少*多少？\n\
  \n2.  我们何时使用 `emmeans()` 和 `pairs()`，何时使用 `emtrends()` 和 `summary()`？分类预测变量与连续预测变量是否会影响选择？\n\
