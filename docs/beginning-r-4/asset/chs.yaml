  \ `ch03` 文件夹中。总计，你的项目子文件夹中应该有六个文件。\n\n完成这些设置后，你就可以开始练习导入和导出数据了。\n\n如果在阅读本章过程中，你需要回顾关于在\
  \ RStudio 中如何查找内容的快速提示，可以查看这份简短的“速查表”，它包含了 RStudio 大部分功能的图示和标签：[`https://github.com/rstudio/cheatsheets/raw/master/rstudio-ide.pdf`](https://github.com/rstudio/cheatsheets/raw/master/rstudio-ide.pdf)。\n\
  \n## 3.2 数据输入\n\n将文件输入到 `R` 时，数据通常以某种表格格式呈现，其中包含带名称的列（或称*变量*）和带编号的行（或称*观测值*）。因此，每一列代表一个类别，每一行代表对这些变量的一个特定测量值。\n\
  \n输入这类“大体规整”数据时，常见的挑战通常在于成功读取存储数据的文件的**类型**，并适应不同数据文件的独特性（例如，前几行的格式与预期不符）。这种小问题的例子可能是，数据收集者/创建者可能会在\
  \ Excel 文件的前几行中包含一些注释或说明，在这些注释之后，数据列和行才真正开始。\n\n注意\n\n当我们说文件的**类型**时，指的是诸如 Excel\
  \ 电子表格、逗号分隔的文本文件或来自其他专有软件的数据集之类的东西。文件的**类型**几乎总是通过*扩展名*来指示。文件扩展名是文件名中句点之后的最后几个字符。例如，一个\
  \ Excel 文件可能被命名为 `data.xlsx`。在此例中，文件名是 `data`，扩展名是 `.xlsx`；正是这个 `.xlsx` 扩展名告诉我们这是一个\
  \ Excel 文件。其他常见的扩展名有 `.csv`，表示单元格由逗号分隔的文本文件；以及 `.rds`，这是 R 自身用于存储数据的格式。所有这些都可以通过查看文件扩展名来判断。\n\
  \n因此，我们的首要任务是确定用于读取数据的正确函数（及包），并判断是否需要跳过某些行。大多数用于输入数据的函数都至少有三个可选参数，包括数据文件的位置、要 *skip*（跳过）的行数，以及数据是否包含列名的\
  \ *header*（表头）。值得注意的是，大多数数据输入函数默认假定第一行是列名表头，并且不应跳过任何行。\n\n大多数输入函数都包含许多选项——但通常大多数选项都不需要使用。实际上，处理文件中一些杂乱内容的最简单方法通常是手动打开文件，手动修复，然后再导入到\
  \ `R` 中。另一方面，如果你定期收到一个文件（例如来自某个公司或第三方的每日更新），并且该文件在格式上存在可预测的不规整性，那么花时间研究额外的函数选项以编写自动读取脚本可能是值得的。\n\
  \n### 手动输入\n\n虽然我们通常将输入聚焦于读取某些外部文件，但在 `R` 中也可以手动输入数据。这在多种场景下都很有用，从设置一些变量到更大量的数据输入。在\
  \ `R` 中，*赋值*操作符是 `<-`。这两个符号——小于号和 `-`——都位于键盘的右侧，分别靠近 M 和 P 键。给我们的数据取一个有意义的名字会很有帮助；例如，如果使用年份\
  \ 2020 作为变量，我们可能会称它为 `academicYear`。\n\n注意\n\n为了使代码便于口头表达，我们经常将数据变量命名为名词。出于同样的原因，函数通常被命名为动词（例如\
  \ `plot()`）。\n\n要将以下代码行读出来，我们会说“变量 `academicYear` 被赋值为数字 `2020`”：\n\n```\nacademicYear\
  \ <- 2020\n```\n\n请注意，在运行了上一行代码后，在你的右上角 *Environment*（环境）面板中，现在出现了一个 `academicYear`\
  \ 的值，显示为 `2020`。如果我们需要在代码中使用 academic year（学年），我们现在可以简单地输入 `academicYear` 来获取我们的结果：\n\
  \n```\nacademicYear\n## [1] 2020\n```\n\n回顾一个熟悉的数据集 `mtcars`，让我们探索如何以另一种方式使用赋值。回想一下，`wt`\
  \ 变量是汽车的重量值。如果我们想使用这些值，正如我们之前所见，我们可以通过将其赋值给一个变量名来专门调用该列。同样，在赋值之后，我们就可以直接使用我们的变量了：\n\
  \n```\nmtcarsWeight <- mtcars$wt\nmtcarsWeight\n##  [1]  2.620 2.875 2.320 3.215\
  \ 3.440 3.460 3.570 3.190 3.150 3.440 3.440\n## [12]  4.070 3.730 3.780 5.250 5.424\
  \ 5.345 2.200 1.615 1.835 2.465 3.520\n## [23]  3.435 3.840 3.845 1.935 2.140 1.513\
  \ 3.170 2.770 3.570 2.780\n```\n\n虽然手动赋值很简单，但将所有会用到的数据直接手动输入到 `R` 中将非常繁琐。接下来，我们将转向使用我们在第\
  \ 2 章中安装的一些包。\n\n\n\n### CSV：.csv\n\n最常见的数据类型之一，是以*逗号分隔值*格式存储的信息表格，其文件扩展名为 `.csv`。虽然\
  \ `R` 本身可以读取此类文件，但 `data.table` 包提供了一个名为 `fread()` 的函数，它能非常快速地读取 CSV 文件。该函数有许多可能的输入或参数，不过我们现在只讨论其中三个。该函数的第一个输入或参数是\
  \ `file = \"\"`。由于 RStudio 项目默认将项目设为*工作目录*（我们在第 1 章中展示了如何设置），我们只需向此参数提供文件夹文件路径 `data/ch03/`\
  \ 和文件名 `Counties_in_Texas.csv`。第二个参数 `header` 默认为自动特性，通常能很好地猜测是否存在表头。如果你知道文件有或没有表头，你可以手动将此参数设置为\
  \ `TRUE` 或 `FALSE`。我们讨论的第三个参数是 `skip`。它接受一个整数（即不带小数位的整数，如 0、1、2、3）输入，表示你希望跳过的行数。默认值为零；因此，与\
  \ `header` 一样，你通常可以安全地忽略此参数。你不能跳过行的一部分，因此像 `skip = 1.25` 或 `skip = 3.5` 这样的写法是无效的。\n\
  \n虽然包通常放在一组代码的开头，但在这里，我们将对 `data.table` 包的 `library()` 调用包含在内，以提醒我们，如果没有这个库调用，`fread()`\
  \ 将无法工作。我们再次遇到了赋值运算符，因为我们将数据赋值给一个名为 `csvData` 的变量：\n\n```\nlibrary(data.table)\n\
  ## data.table 1.13.0 使用 6 个线程（参见 ?getDTthreads）。最新消息：r-datatable.com\ncsvData <-\
  \ fread(file = \"data/ch03/Counties_in_Texas.csv\",\nheader = TRUE,\nskip = 0)\n\
  ```\n\n注意，在运行完上面的代码行后，虽然*控制台*没有输出，但我们的*环境*窗格中确实有 254 个观测值和 10 个变量。你可以点击 `csvData`\
  \ 左侧的箭头图标，查看刚刚读取的数据的类型。例如，`CountyName` 的类型是 `chr`，代表*字符*数据，而 `CountyNumber` 的类型是\
  \ `int`，代表*整数*或整数。请查看 [`https://github.com/rstudio/cheatsheets/raw/master/rstudio-ide.pdf`](https://github.com/rstudio/cheatsheets/raw/master/rstudio-ide.pdf)\
  \ 以了解通过 RStudio（而非仅通过代码）与数据交互的更多方式。\n\n由于有 254 个观测值或行，我们的数据可能有点长，无法直观检查所有行。一种较新的探索数据的方法可以在右上角的“环境”窗格中看到。每个数据集的左侧都有一个带箭头的点，右侧有一个方形表格网格。点击左侧带箭头的点，可以查看每个数据集中包含的数据类型。除了显示*列名*，它还会显示数据类型（例如，`int`、`Date`\
  \ 或 `num`）。另一个选择是点击最右侧的方形表格网格。这将打开数据集并在新标签页中查看。关闭该标签页即可返回代码区域。\n\n通常，仅查看前几行就足够了。`head()`\
  \ 函数允许我们默认检查前六行：\n\n```\nhead(csvData)\n##    CountyName FIPSNumber CountyNumber\
  \ PublicHealthRegion\n## 1:   Anderson          1            1                 \
  \ 4\n## 2:    Andrews          3            2                  9\n## 3:   Angelina\
  \          5            3                  5\n## 4:    Aransas          7      \
  \      4                 11\n## 5:     Archer          9            5          \
  \        2\n## 6:  Armstrong         11            6                  1\n##    HealthServiceRegion\
  \ MetropolitanStatisticalArea_MSA\n## 1:                4/5N                   \
  \           --\n## 2:                9/10                              --\n## 3:\
  \                4/5N                              --\n## 4:                  11\
  \                  Corpus Christi\n## 5:                 2/3                   Wichita\
  \ Falls\n## 6:                   1                        Amarillo\n##    MetropolitanDivisions\
  \ MetroArea NCHSUrbanRuralClassification_2006\n## 1:                    -- Non-Metro\
  \                      Micropolitan\n## 2:                    -- Non-Metro     \
  \                 Micropolitan\n## 3:                    -- Non-Metro          \
  \            Micropolitan\n## 4:                    --     Metro               \
  \       Medium Metro\n## 5:                    --     Metro                    \
  \   Small Metro\n## 6:                    --     Metro                       Small\
  \ Metro\n##    NCHSUrbanRuralClassification_2013\n## 1:                      Micropolitan\n\
  ## 2:                      Micropolitan\n## 3:                      Micropolitan\n\
  ## 4:                      Medium Metro\n## 5:                       Small Metro\n\
  ## 6:                      Medium Metro\n```\n\n虽然现在看起来可能还不明显，但你其实已经在做统计了。探索性数据分析（EDA）是大多数分析的第一步。它可能并不花哨，但\
  \ `head()` 就是这种探索的一个例子。\n\n### Excel：.xlsx 或 .xls\n\n微软的 Excel 格式是另一种常见的数据格式。来自\
  \ `readxl` 包的 `read_excel()` 函数可以读取此类文件，并且同样具有一些有用的默认选项。除了通常的文件路径、列名和跳过这三个特性外，我们讨论第四个参数\
  \ `sheet`。Excel 文件通常有多个工作表。默认是第一个工作表，但你可以输入一个数字表示工作表的*顺序*，或者引用命名工作表的文本*字符串*（Excel\
  \ 通常默认将第一个工作表命名为“Sheet1”）。\n\n对于我们的数据集，变量 `excelData` 被赋值为在德克萨斯州县数据的 `.xlsx` 版本上使用\
  \ `read_excel()` 函数的输出。虽然我们设置了 `sheet = 1` 以按工作表顺序捕获数据，但我们也可以使用 `sheet = \"Counties_in_Texas\"\
  `。为了在我们的代码中展示这一点，我们使用*注释*，即通过使用*井号*或*标签符号*字符来实现。代码中的注释供人类阅读，**不会**被 `R` 执行：\n\n\
  ```\nlibrary(readxl)\nexcelData <- read_excel(path = \"data/ch03/Counties_in_Texas.xlsx\"\
  ,\nsheet = 1, # 或 sheet = \"Counties_in_Texas\"\ncol_names = TRUE,\nskip = 0\n)\n\
  ```\n\n这与从 CSV 文件读取的数据集是同一个。真的是这样吗？对我们的新数据集使用 `head()` 函数，比较 `FIPSNumber` 列，注意它们看起来略有不同。更仔细地检查（例如通过环境窗格中的箭头下拉图标）显示，`csvData`\
  \ 中的 `FIPSNumber` 是 `int` 类型，而 `excelData` 中是 `chr` 类型：\n\n```\nhead(excelData)\n\
  ## # 一个 tibble：6 x 10\n##   CountyName FIPSNumber CountyNumber PublicHealthReg˜\
  \ HealthServiceRe˜\n##                                   \n## 1 Anderson   001 \
  \                  1                4 4/5N\n## 2 Andrews    003                \
  \   2                9 9/10\n## 3 Angelina   005                   3           \
  \     5 4/5N\n## 4 Aransas    007                   4               11 11\n## 5\
  \ Archer     009                   5                2 2/3\n## 6 Armstrong  011 \
  \                  6                1 1\n## # ... 还有 5 个变量：MetropolitanStatisticalArea_MSA\
  \ ,\n## #   MetropolitanDivisions , MetroArea ,\n## #   NCHSUrbanRuralClassification_2006\
  \ ,\n## #   NCHSUrbanRuralClassification_2013 \n```\n\n当使用由不同包作者编写的函数时，一些默认设置和一些选择往往并不相同。在将数据读入\
  \ `R` 时，通常明智的一步是检查你的数据，并更深入地了解刚刚读取的内容。你可能注意到的另一个区别是，我们的 Excel 数据提到了 *tibble* 这个词。我们将对*数据结构*选择的深入讨论留给我们编写的《高级\
  \ R：数据编程与云端》[23] 一书。虽然注意到这个区别是好的，但我们现在暂且忽略它。\n\n\n\n### RDS: `.rds`\n\n我们首先展示了如何从\
  \ CSV 或 Excel 文件中读取数据集，因为这些可能是存储和共享数据集最常用的方式。它们之所以流行，部分原因是几乎任何电脑上的任何人都可以打开并查看它们，而无需额外安装他们尚未拥有的软件。\n\
  \n`R` 也有自己的数据格式，名为 *R Data “Storage”*，其扩展名为 `.rds`。读取和写入 `.rds` 文件的功能内置于 `R` 中，因此我们不需要任何额外的包。此外，由于这些文件来自\
  \ `R`，因此只有一个感兴趣的参数，即 `file =` 参数。`R` 会自动知道如何读取它们、哪些内容指示变量、变量的类型、变量名与数据的关系、任何注释等信息：\n\
  \n```\nrData <- readRDS(file = \"data/ch03/Counties_in_Texas.rds\")\n```\n\n重复查看相同的数据会显得乏味。因此，我们引入了\
  \ `tail()` 函数，它显示数据集的后六行：\n\n```\ntail(rData)\n##    CountyName FIPSNumber CountyNumber\
  \ PublicHealthRegion\n## 1:       Wise        497          249                 \
  \ 3\n## 2:       Wood        499          250                  4\n## 3:     Yoakum\
  \        501          251                  1\n## 4:      Young        503      \
  \    252                  2\n## 5:     Zapata        505          253          \
  \       11\n## 6:     Zavala        507          254                  8\n##    HealthServiceRegion\
  \ MetropolitanStatisticalArea_MSA\n## 1:                 2/3     Dallas-Fort Worth-Arlington\n\
  ## 2:                4/5N                              --\n## 3:               \
  \    1                              --\n## 4:                 2/3              \
  \                --\n## 5:                  11                              --\n\
  ## 6:                   8                              --\n##      MetropolitanDivisions\
  \ MetroArea\n## 1: Fort Worth-Arlington MD     Metro\n## 2:                    \
  \  -- Non-Metro\n## 3:                      -- Non-Metro\n## 4:                \
  \      -- Non-Metro\n## 5:                      -- Non-Metro\n## 6:            \
  \          -- Non-Metro\n##    NCHSUrbanRuralClassification_2006\n## 1:        \
  \        Large Fringe Metro\n## 2:                           Noncore\n## 3:    \
  \                       Noncore\n## 4:                           Noncore\n## 5:\
  \                           Noncore\n## 6:                           Noncore\n##\
  \    NCHSUrbanRuralClassification_2013\n## 1:                Large Fringe Metro\n\
  ## 2:                          Non-core\n## 3:                          Non-core\n\
  ## 4:                          Non-core\n## 5:                      Micropolitan\n\
  ## 6:                          Non-core\n```\n\n### 其他专有格式\n\n还有其他几种常用的统计软件用于存储和分析数据。如果你的同事使用这些程序之一，你可能会收到一个使用该软件数据格式的数据文件。我们将简要介绍其中三种，以便你今后遇到此类数据时知道如何将其导入\
  \ `R`。\n\n#### SPSS: `.sav`\n\n我们讨论的最后三种格式都使用 `haven` 包。请记住，在每个 `R` 会话中，只需要运行一次\
  \ `library(haven)`。因此，我们仅在此处运行它。到目前为止，常见的参数已经熟悉。IBM 公司拥有名为 *SPSS* 的数据软件。该软件的文件扩展名可以是\
  \ `.sav`。来自 `haven` 的用于读取此格式的函数是 `read_spss()`：\n\n```\nlibrary(haven)\nspssData\
  \ <- read_spss(file = \"data/ch03/Counties_in_Texas.sav\",\nskip = 0)\n```\n\n####\
  \ Stata: `.dta`\n\nStata 是一种统计数据软件，其文件扩展名为 `.dta`。`haven` 包也有一个 `read_stata()` 函数用于读取此类文件：\n\
  \n```\nstataData <- read_stata(\"data/ch03/Counties_in_Texas.dta\",\nskip = 0)\n\
  ```\n\n#### SAS: `.sas7bdat`\n\n我们要介绍的最后一个统计软件数据格式是 SAS，其文件扩展名相对较长，为 `.sas7bdat`。为增加多样性，我们使用美国人口普查局美国社区调查\
  \ [23] 中的一个文件。这个特定文件有超过 3.8 万条观测值。如今的数据可能变得非常庞大。尽管如此，请注意 `R` 读取该文件的速度足够快。通常，只有在数据量变得非常大时，现代内存才会出现处理困难：\n\
  \n```\nsasData                \n## 1 ACSSF B00001 0001     NA        7 \"1 CE˜ \
  \  NA UNWEIGH˜ \"Unweighted˜\n## 2 ACSSF B00001 0001     NA       NA \"\"      \
  \ NA Univers˜ \"\"\n## 3 ACSSF B00001 0001      1       NA \"\"       NA Total \
  \   \"\"\n## 4 ACSSF B00002 0001     NA        8 \"1 CE˜    2 UNWEIGH˜ \"Unweighted˜\n\
  ## 5 ACSSF B00002 0001     NA       NA \"\"       NA Univers˜ \"\"\n## 6 ACSSF B00002\
  \ 0001      1       NA \"\"       NA Total    \"\"\n```\n\n## 3.3 输出\n\n将数据导入 `R`\
  \ 通常是分析项目的第一阶段。将数据从 `R` 中写出以与利益相关者或协作者共享通常是最后阶段之一。在 `R` 项目中，将读入的数据与写出的数据分开通常是个好主意。我们已经创建了一个名为\
  \ `data` 的文件夹用于输入文件。现在，我们使用右下方面板中的相同 *New Folder* 图标创建一个名为 `output` 的新文件夹。\n\n任何在\
  \ `R` 中的数据都可以被写出。数据来自哪里并不重要，重要的是它们存在于我们的全局环境中。因此，以下示例中用于写出的选项包括 `mtcars` [1]、`penguins`\
  \ [11] 以及 `csvData`、`excelData`、`rData`、`sasData`、`spssData` 和 `stataData`。这些都属于我们当前\
  \ `R` 实例的一部分。由于 `mtcars` 和 `penguins` 数据集内置于包中，它们不会出现在环境选项卡中，但仍然可以被写出。换句话说，我们可以将\
  \ `sasData` 写入为 CSV 文件，一切正常。虽然这不是 `R` 的“官方”功能，但它可以用于在文件类型之间进行转换。为避免出现奇怪的数据调用，我们将使用\
  \ `R` 数据。\n\n### CSV\n\n为了实现通用可移植性，CSV 文件格式通常是最佳答案；大多数软件套件默认都能读取 CSV 文件。请记住，即使是\
  \ `R` 也有一个读取 CSV 文件的基础函数；我们选择使用 `data.table` 选项仅仅是我们自己的选择。类似地，大多数软件系统都能轻松保存、写入或导出\
  \ CSV 文件。同样，`R` 也有这个内置功能，尽管我们选择使用 `data.table` 的 `fwrite()` 函数。该函数接受两个参数。第一个参数设置为我们希望写出的数据。第二个参数是我们数据将要写入的文件路径和名称：\n\
  \n```\nfwrite(x = rData,\nfile = \"output/ch3_txCounties.csv\")\n```\n\n### Excel\n\
  \n微软的 Excel 格式是另一种广泛使用的格式，`writexl` 包提供了 `write_xlsx()` 函数来实现此功能。该函数的两个额外功能包括：可以选择隐藏列名（默认值为\
  \ `TRUE`，如上所示），以及可以选择不居中和加粗列名（同样，默认值为 `TRUE`，如上所示）。对于同事使用 Excel 的办公环境，这些默认设置通常是以非常人性化的方式向决策者共享数据。特别是默认加粗列名有助于减少对共享数据含义的混淆：\n\
  \n```\nlibrary(writexl)\nwrite_xlsx(x = rData,\npath = \"output/ch3_txCounties.xlsx\"\
  ,\ncol_names = TRUE,\nformat_headers = TRUE)\n```\n\n### RDS\n\n我们最后一种导出的格式是 `R`\
  \ 的默认格式。有时，对象只是为以后使用而保存。如果你打算稍后重新加载数据集以供后续工作使用，`saveRDS()` 函数是一个非常节省内存的选择。在我们的系统上，RDS\
  \ 格式的大小不到 CSV 文件的一半：\n\n```\nsaveRDS(object = rData,\nfile = \"output/ch3_txCounties.RDS\"\
  )\n```\n\n\n好的，作为高级文档工程师和翻译员，我将根据您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n## 3.4 总结\n\n本章讨论了在`R`中读取和写入数据的方法。使用表\
  \ 3-1 中总结的函数和包，你将能够访问和共享来自许多信息源的数据。\n\n表 3-1\n\n章节总结\n\n| 概念 | 含义 |\n| --- | ---\
  \ |\n| `<-` | 赋值运算符。 |\n| `fread()` | 来自 `data.table` 包的 CSV 文件读取函数。 |\n| `head()`\
  \ | 显示数据集的前六行。 |\n| `read_excel()` | 来自 `readxl` 包的 Excel XLSX 或 XLS 文件读取函数。 |\n\
  | `readRDS()` | RDS（`R` 原生格式）文件读取函数。 |\n| `tail()` | 显示数据集的最后六行。 |\n| `read_spss()`\
  \ | 来自 `haven` 包的 SPSS SAV 文件读取函数。 |\n| `read_stata()` | 来自 `haven` 包的 Stata DTA\
  \ 文件读取函数。 |\n| `read_sas()` | 来自 `haven` 包的 SAS SAS7BDAT 文件读取函数。 |\n| `fwrite()`\
  \ | 来自 `data.table` 包的 CSV 文件写入函数。 |\n| `write_xlsx()` | 来自 `writexl` 包的 Excel XLSX\
  \ 文件写入函数。 |\n| `saveRDS()` | RDS（`R` 原生格式）文件写入函数。 |\n\n## 3.5 通过实践掌握\n\n通过完成一些练习来检查你的进度并在实践中成长。理解力检查提出批判性思考问题，这些问题最好以书面或口头形式回答。统计学的艺术之一在于成功地向利益相关者或受众传达结果。有时受众技术性很强，有时则非常不技术。练习则是对本章探讨的概念更直接的应用。\n\
  \n### 理解力检查\n\n1.  四处问问！向你的同学、同事或朋友了解他们使用的数据类型。常见的文件格式有哪些？他们数据的列和行是如何组织的？\n\n###\
  \ 练习题\n\n1.  使用本章学到的技巧，将 `penguins` 数据集写入一个 `.csv` 文件。\n\n2.  使用本章学到的技巧，将 `mtcars`\
  \ 数据集写入一个 `.xlsx` 文件。\n\n3.  有许多数据集可供公众使用（尽管并非所有都可在书中免费使用）。从你的公司、地方政府或其他你感兴趣的团体中找一个数据集。下载该文件，并使用你在本章学到的一个函数将数据读取到\
  \ `R` 中。\n\n"
- "# 4. 数据操作\n\n本书旨在让你深入了解现实世界的统计方法。与许多“课堂就绪”的示例不同，现实世界的数据在进行任何统计之前通常需要预先处理。在本章中，你将学习如何使用\
  \ `data.table` [9] 和 `extraoperators` [20] 包来创建应用统计方法分析数据并做出数据驱动决策所需的数据集。\n\n这是一项艰巨的任务，所以请记住，一开始觉得\
  \ `data.table` 有些令人困惑是很正常的。尽管如此，请继续探索，继续尝试，务必完成本章末尾的理解力检查和练习题，并且随时可以寻求帮助！\n\n学完本章后，你应该能够：\n\
  \n-   将 `R` 数据转换为 `data.table` 格式。\n-   理解 `data.table` 结构的三个部分。\n-   应用逻辑运算符，通过*子集选取*从较大的数据集中提取目标样本。\n\
  -   基于当前数据创建新列。\n-   对数据集应用 `by` 分组计算。\n\n## 4.1 准备工作\n\n为了练习操作 `data.table` 格式的信息，我们需要做一些准备工作。为了继续练习创建和使用项目，我们将为本章启动另一个新项目。在该项目中，我们还将创建一些文件夹，并从本书的\
  \ `GitHub` 网站下载一些数据文件。\n\n如有必要，请回顾第 1 章中的步骤来创建一个新项目。启动 RStudio 后，在左上角的菜单栏中，选择 *File*\
  \ 并点击 *New Project*。选择 *New Directory* ➤ *New Project*，*Directory name* 填写 `04WorkingWithData`，然后选择\
  \ *Create Project*。要创建一个 `R` 脚本文件，请在最顶部的功能区上，*File* 字样下方，点击带有加号图标的空白纸张小图标，然后选择 *R\
  \ Script* 菜单选项。点击软盘形状的 *save* 图标，将此文件命名为 `WorkwData.R`，然后点击 *Save*。\n\n在右下角窗格中，你应该会看到你的项目的两个文件，在\
  \ *Files* 选项卡正下方，点击名为 *New Folder* 的按钮。在 *New Folder* 弹出框中，输入 `data` 并选择 *OK*。在右下角窗格中，点击你新建的\
  \ *data* 文件夹。重复文件夹创建过程，创建一个名为 `ch04` 的新文件夹。\n\n接下来，你需要从本书的网站下载一些文件。这些文件应存放在 *GitHub*\
  \ 上的 `http://github.com/apress/beginning-r-4`。但是，永久链接也可以通过在网站 `http://mattwiley.org/publications.html`\
  \ 上点击 *Beginning R* 的 *Code* 来找到。导航到本章的文件夹，将德克萨斯州县数据 [3] 和美国社区调查 [4] 的数据下载到你刚刚创建的\
  \ `ch04` 文件夹中。总的来说，你的项目子文件夹中应该有六个文件。\n\n请记住，如果你已经在第 3 章中下载了这些文件，你可以简单地将这些文件从第 3\
  \ 章的项目中复制过来。但是，请务必重命名文件夹，以便你的数据存放在此路径下：`YourProjectFolder/data/ch04`。如果你为本章创建了一个独立项目，那么你已经位于\
  \ `04WorkingWithData` 文件夹中，并且该文件夹下会有 `data/ch04` 两个子文件夹。\n\n本章我们将使用四个包。请记住，所有这些包已经在第\
  \ 2 章中安装到你的本地计算机上了。无需重新安装。但是，由于这是一个新项目，并且我们是首次运行这组代码。因此，你需要运行以下四个 `library()` 调用：\n\
  \n```\nlibrary(data.table)\n## data.table 1.13.0 using 6 threads (see ?getDTthreads).\
  \ Latest news: r-datatable.com\nlibrary(extraoperators)\nlibrary(JWileymisc)\nlibrary(palmerpenguins)\n\
  ```\n\n应用我们在第 3 章学到的知识，我们使用 `data.table` 包中的 `fread()` 函数读取 `Counties_in_Texas`\
  \ 数据集。由于此函数已经来自 `data.table`，与其他数据不同，我们**不**需要将其转换为 `data.table` 格式；我们的数据已经具备正确的结构：\n\
  \n```\ntexasData <- fread(file = \"data/ch04/Counties_in_Texas.csv\",\nheader =\
  \ TRUE,\nskip = 0)\n```\n\n本章我们将使用另外两个数据集。通过拥有三种不同类型的数据，我们可以确保早期的探索能接触到足够多样的现实世界数据“风格”。用不同的数据对比和比较特定技术，有助于你进行实践，并学会如何将这些技术应用到你在“野外”遇到的*任何*数据集上。\n\
  \n\n\n与`texasData`不同，这两个数据集已经存在。我们只需确保它们是`data.table`格式即可。暂时不用过多思考`data()`函数，它所做的只是从`JWileymisc`包中加载信息到环境窗格中。接着，`as.data.table()`函数接收一个输入（即我们的新数据），并使用赋值运算符`<-`将其存储为一个名为`acesData`的对象。该变量包含超过`6,500`条观测值（即数据行），分布在`19`个变量（即列）中。为了避免混淆对象，我们使用`rm()`函数来*移除*`aces_daily`：\n\
  \n```\ndata(aces_daily)\nacesData <- as.data.table(aces_daily)\nrm(aces_daily)\n\
  ```\n\n对于最后一个数据集，我们使用`palmerpenguins`[11]数据集。不过，我们需要再次使用`as.data.table()`函数将其转换为`data.table`格式：\n\
  \n```\npenguinsData <- as.data.table(penguins)\n```\n\n设置好这三个数据对象后，你就可以开始练习*处理数据*了。\n\
  \n## 4.2 我们的数据长什么样？\n\n在动手使用数据之前，先了解我们所看到的内容会很有帮助。在实际数据应用中，研究者通常对自己常用的数据集非常熟悉。我们的目标是让这三个数据集成为本书后续内容的常用数据集。现在花时间探索这些数据，将来会大有裨益。\n\
  \n如第 3 章所述，你可以通过 RStudio 右上角的“环境”窗格查看数据。每个数据集的左侧都有一个带箭头的圆点，右侧则是一个方形表格网格。点击左侧的带箭头圆点，可以查看每个数据集中包含的数据类型。除了显示*列名*之外，它还会显示数据类型（例如，**整**数、**日期**或**数**值）。另一个选项是点击最右侧的方形表格网格，这将在新标签页中打开数据集以供查看。关闭该标签页即可返回代码区域。\n\
  \n然而，在`R`中，传统上我们使用*函数*来完成任务。`colnames()`函数接收数据作为输入，并输出列名。列名的顺序与它们在数据集中自然出现的顺序一致：\n\
  \n```\ncolnames(acesData)\n##  [1] \"UserID\"             \"SurveyDay\"     \"SurveyInteger\"\
  \n##  [4] \"SurveyStartTimec11\" \"Female\"        \"Age\"\n##  [7] \"BornAUS\"\
  \            \"SES_1\"         \"EDU\"\n## [10] \"SOLs\"               \"WASONs\"\
  \        \"STRESS\"\n## [13] \"SUPPORT\"            \"PosAff\"        \"NegAff\"\
  \n## [16] \"COPEPrb\"            \"COPEPrc\"       \"COPEExp\"\n## [19] \"COPEDis\"\
  \n```\n\n知道了列名之后，我们就可以使用它们了。注意名为`EDU`的列，其中没有关于*具体学位类型*的信息。为了了解`EDU`列中存储的内容，我们使用`unique()`函数。回想一下我们的第一个脚本以及用于访问特定数据列的`$`运算符。`unique()`函数允许你查看每个数据副本，且*每个值只出现一次*：\n\
  \n```\nunique(acesData$EDU)\n## [1]  0 NA  1\n```\n\n从前面的代码输出中，我们发现`EDU`列是一个*独热*编码（有时称为*虚拟*编码）的例子。如果条目是`1`，则该行数据由至少拥有高等教育学位的参与者填写。另一方面，`0`表示参与者（还）没有获得高等教育学位。还有一种情况是参与者未作任何回答，这就是空值或`NA`（不可用）选项。\n\
  \n当然，我们在数据集中还看到了其他列。探索`SurveyDay`，我们看到了`Date`类型数据的一个例子。在`R`中，此类`Date`数据的常见格式是表示年、月、日的**YYYY-MM-DD**。这种日期格式几乎是全球通用的，但在美国，另一种不同的日期格式更为常见。不过，处理日期对象时一定要小心。理解数据最初是在哪里编码的，以及如果附加了时间数据，则要考虑时区，通常至关重要：\n\
  \n```\nunique(acesData$SurveyDay)\n##  [1] \"2017-02-24\" \"2017-02-25\" \"2017-02-26\"\
  \ \"2017-02-27\" \"2017-02-28\"\n##  [6] \"2017-03-01\" \"2017-03-02\" \"2017-03-03\"\
  \ \"2017-03-04\" \"2017-03-05\"\n## [11] \"2017-03-06\" \"2017-03-07\" \"2017-02-22\"\
  \ \"2017-02-23\" \"2017-03-08\"\n## [16] \"2017-03-09\" \"2017-03-10\" \"2017-03-11\"\
  \ \"2017-03-12\" \"2017-03-13\"\n## [21] \"2017-03-14\"\n```\n\n虽然前两个函数让我们能轻松查看所有列名并探索特定列的数据，但查看数据集的前几行也很有帮助。`head()`函数正是为此而生，默认显示前六行。`acesData`有\
  \ 19 列，因此在控制台输出时会自动换行。可以看到其中可能包含相当多的`NA`数据。课堂上的例子通常不会展示如何处理这类挑战。因此，你现在就已经在探索现实生活中的数据可能有多杂乱：\n\
  \n```\nhead(acesData)\n##    UserID  SurveyDay SurveyInteger SurveyStartTimec11\
  \ Female Age\n## 1:      1 2017-02-24             2          1.927e-01      0  21\n\
  ## 2:      1 2017-02-24             3          4.859e-01      0  21\n## 3:     \
  \ 1 2017-02-25             1          1.157e-05      0  21\n## 4:      1 2017-02-25\
  \             2          1.931e-01      0  21\n## 5:      1 2017-02-25         \
  \    3          4.062e-01      0  21\n## 6:      1 2017-02-26             1    \
  \      1.638e-02      0  21\n##    BornAUS SES_1 EDU  SOLs WASONs STRESS SUPPORT\
  \ PosAff NegAff\n## 1:       0     5   0    NA     NA      5      NA  1.519  1.669\n\
  ## 2:       0     5   0 0.000      0      1   7.022  1.505  1.000\n## 3:       0\
  \     5   0    NA     NA      1      NA  1.564     NA\n## 4:       0     5   0 \
  \   NA     NA      2      NA  1.563  1.357\n## 5:       0     5   0 6.925      0\
  \      0   6.154  1.127  1.000\n## 6:       0     5   0    NA     NA      0    \
  \  NA  1.338  1.661\n##    COPEPrb COPEPrc COPEExp COPEDis\n## 1:      NA      NA\
  \      NA      NA\n## 2:   2.257   2.378   2.414   2.181\n## 3:      NA      NA\
  \      NA      NA\n## 4:      NA      NA      NA      NA\n## 5:      NA      NA\
  \   2.034      NA\n## 6:      NA      NA      NA      NA\n```\n\n请试着对`penguinsData`和`texasData`数据集也应用这三个函数。你对正在操作的数据越熟悉，后续章节的例子就越容易理解。\n\
  \n现在，我们介绍最后一个与`head()`相对应的函数。`tail()`函数显示数据的*最后*六行：\n\n```\ntail(penguinsData)\n\
  ##      species island bill_length_mm bill_depth_mm flipper_length_mm\n## 1: Chinstrap\
  \  Dream           45.7          17.0               195\n## 2: Chinstrap  Dream\
  \           55.8          19.8               207\n## 3: Chinstrap  Dream       \
  \    43.5          18.1               202\n## 4: Chinstrap  Dream           49.6\
  \          18.2               193\n## 5: Chinstrap  Dream           50.8       \
  \   19.0               210\n## 6: Chinstrap  Dream           50.2          18.7\
  \               198\n##    body_mass_g    sex year\n## 1:        3650 female 2009\n\
  ## 2:        4000   male 2009\n## 3:        3400 female 2009\n## 4:        3775\
  \   male 2009\n## 5:        4100   male 2009\n## 6:        3775 female 2009\n```\n\
  \n## 4.3 `data.table`是如何工作的？\n\n`data.table`结构包含三个不同的区域。第一个区域作用于*行*，第二个作用于*列*，最后一个则用于*分组*。类似于数学矩阵，前两个区域（行和列）通常被称为`i`和`j`。最后一个区域，因为是**按**分组进行操作，常被称为`by`。因此，通用的**d**`ata.`**t**`able`通常表示为`DT[i,\
  \ j, by]`。注意，与通常的函数圆括号不同，这里使用的是方括号`[]`。为了理解如何以这种方式使用数据，我们将一起探索数据表格的每个区域。在深入学习数据的过程中，请记住，理解原始数据的样貌有助于理解这些新技术所展示的内容。\n\
  \n\n\n### 行操作如何工作？\n\n`DT[i, j, by]` 中的第一个区域是针对行元素的操作。这包括对行进行排序（可以理解为字母顺序或数值顺序）以及根据特定特征选择行（可以理解为子集选择）。\n\
  \n#### `order()`\n\n`order()` 函数可用于按顺序组织数据。该函数会重新排列每一*行*，使各行按顺序排列。然而，它必须知道要根据哪一列来进行排序。因此，尽管它是一个*行*操作，`order()`\
  \ 函数却接受一个*列*参数。回想一下，在 `penguinsData` 中，`flipper_length_mm` 列的最后六行显示了一些不同的值。根据你对\
  \ `penguinsData` 的目视检查，你注意到 `flipper_length_mm` 的范围是 172 到 231，但它们并不是按顺序排列的。我们使用第一个*行*操作，也就是\
  \ `DT[i, j, by]` 结构的第 *i* 个位置，来对 `flipper_length_mm` 进行 `order()` 排序，从小到大。我们称之为*升序*排序：\n\
  \n```\npenguinsData[order(flipper_length_mm)]\n##      species    island bill_length_mm\
  \ bill_depth_mm flipper_length_mm\n##   1:  Adelie    Biscoe           37.9    \
  \      18.6               172\n##   2:  Adelie    Biscoe           37.8        \
  \  18.3               174\n##   3:  Adelie Torgersen           40.2          17.0\
  \               176\n##   4:  Adelie     Dream           39.5          16.7    \
  \           178\n##   5:  Adelie     Dream           37.2          18.1        \
  \       178\n## ---\n## 340:  Gentoo    Biscoe           51.5          16.3    \
  \           230\n## 341:  Gentoo    Biscoe           55.1          16.0        \
  \       230\n## 342:  Gentoo    Biscoe           54.3          15.7            \
  \   231\n## 343:  Adelie Torgersen             NA            NA                NA\n\
  ## 344:  Gentoo    Biscoe             NA            NA                NA\n##   \
  \   body_mass_g    sex year\n##   1:        3150 female 2007\n##   2:        3400\
  \ female 2007\n##   3:        3450 female 2009\n##   4:        3250 female 2007\n\
  ##   5:        3900   male 2007\n## ---\n## 340:        5500   male 2009\n## 341:\
  \        5850   male 2009\n## 342:        5650   male 2008\n## 343:          NA\
  \    2007\n## 344:          NA    2009\n```\n\n注意，我们尚未对数据使用赋值运算符 `<-`。上述代码并**没有**\
  \ *永久*改变 `penguinsData` 的顺序。请注意，如下所示的 `flipper_length_mm` 并**不是**按顺序排列的：\n\n```\n\
  head(penguinsData)\n##    species    island bill_length_mm bill_depth_mm flipper_length_mm\n\
  ## 1:  Adelie Torgersen           39.1          18.7               181\n## 2:  Adelie\
  \ Torgersen           39.5          17.4               186\n## 3:  Adelie Torgersen\
  \           40.3          18.0               195\n## 4:  Adelie Torgersen      \
  \       NA            NA                NA\n## 5:  Adelie Torgersen           36.7\
  \          19.3               193\n## 6:  Adelie Torgersen           39.3      \
  \    20.6               190\n##    body_mass_g    sex year\n## 1:        3750  \
  \ male 2007\n## 2:        3800 female 2007\n## 3:        3250 female 2007\n## 4:\
  \         NA     2007\n## 5:        3450 female 2007\n## 6:        3650   male 2007\n\
  ```\n\n如果我们的工作需要*永久*改变数据，那么我们必须将那临时改变永久地赋值回去。在前面的代码（`penguinsData[order(flipper_length_mm)]`）中，我们在控制台上看到了输出，然而并没有发生永久性的改变。相比之下，在下面的代码中，控制台上没有输出。尽管如此，我们的数据现在已根据鳍状肢长度按升序排列：\n\
  \n```\npenguinsData <- penguinsData[order(flipper_length_mm)]\n```\n\n如果需要，我们可以通过直接调用\
  \ `penguinsData` 来确认这个改变。如你所见，这个改变现在确实是永久性的：\n\n```\npenguinsData\n##      species\
  \    island bill_length_mm bill_depth_mm flipper_length_mm\n##   1:  Adelie    Biscoe\
  \           37.9          18.6               172\n##   2:  Adelie    Biscoe    \
  \       37.8          18.3               174\n##   3:  Adelie Torgersen        \
  \   40.2          17.0               176\n##   4:  Adelie     Dream           39.5\
  \          16.7               178\n##   5:  Adelie     Dream           37.2    \
  \      18.1               178\n## ---\n## 340:  Gentoo    Biscoe           51.5\
  \          16.3               230\n## 341:  Gentoo    Biscoe           55.1    \
  \      16.0               230\n## 342:  Gentoo    Biscoe           54.3        \
  \  15.7               231\n## 343:  Adelie  Torgersen            NA            NA\
  \                NA\n## 344:  Gentoo    Biscoe             NA            NA    \
  \            NA\n##      body_mass_g    sex year\n##   1:        3150 female 2007\n\
  ##   2:        3400 female 2007\n##   3:        3450 female 2009\n##   4:      \
  \  3250 female 2007\n##   5:        3900   male 2007\n## ---\n## 340:        5500\
  \   male 2009\n## 341:        5850   male 2009\n## 342:        5650   male 2008\n\
  ## 343:          NA    2007\n## 344:          NA    2009\n```\n\n这种控制是否保留改变的能力非常有用。它允许我们在不改变任何内容的情况下探索数据。虽然\
  \ `penguinsData` 非常短，只有 344 行数据，但我们的 `acesData` 有超过 `6,500` 行。数据量太大，无法逐一查看，但 `R`\
  \ 可以愉快地对任意多行的数据进行分析。\n\n`order()` 的常见用途包括按数字顺序或字母顺序进行组织。如果在列名前面加上一个负号（`–`），那么就会得到*降序*排列。在这个例子中，我们使用\
  \ `order()` 按字母降序对 `penguinsData` 进行排序。注意，我们没有将数据赋值给一个变量，所以这是 `order` 函数临时使用的一个例子。另请注意，`flipper_length_mm`\
  \ 现在*不按顺序*了。这是因为尽管我们正在按 `species` 进行字母排序，但 `R` 知道我们希望对每个观测值保持数据完整：\n\n```\npenguinsData[order(-species)]\n\
  ##      species    island bill_length_mm bill_depth_mm flipper_length_mm\n##   1:\
  \  Gentoo    Biscoe           48.4          14.4               203\n##   2:  Gentoo\
  \    Biscoe           45.1          14.5               207\n##   3:  Gentoo    Biscoe\
  \           44.0          13.6               208\n##   4:  Gentoo    Biscoe    \
  \       48.7          15.7               208\n##   5:  Gentoo    Biscoe        \
  \   42.7          13.7               208\n## ---\n## 340:  Adelie    Biscoe    \
  \       41.0          20.0               203\n## 341:  Adelie     Dream        \
  \   41.1          18.1               205\n## 342:  Adelie     Dream           40.8\
  \          18.9               208\n## 343:  Adelie Torgersen           44.1    \
  \      18.0               210\n## 344:  Adelie Torgersen             NA        \
  \    NA                NA\n##      body_mass_g    sex year\n##   1:        4625\
  \ female 2009\n##   2:        5050 female 2007\n##   3:        4350 female 2008\n\
  ##   4:        5350   male 2008\n##   5:        3950 female 2008\n## ---\n## 340:\
  \        4725   male 2009\n## 341:        4300   male 2008\n## 342:        4300\
  \   male 2008\n## 343:        4000   male 2009\n## 344:          NA    2007\n```\n\
  \n一次可以将多个列放入 `order()` 函数中。在这种情况下，第一列先被排序，然后在*尽可能不破坏第一列顺序的情况下*对第二列进行排序。虽然这里我们只展示了两列，但在实践中，这可以扩展到任意所需数量的列。\n\
  \n\n\n```penguinsData[order(-species, flipper_length_mm)]\n##      species    island\
  \ bill_length_mm bill_depth_mm flipper_length_mm\n##   1:  Gentoo    Biscoe    \
  \       48.4          14.4               203\n##   2:  Gentoo    Biscoe        \
  \   45.1          14.5               207\n##   3:  Gentoo    Biscoe           44.0\
