  ## 1.8 精进练习


  通过完成一些练习来检查进度并在实践中成长。理解题提出批判性思维问题，最好通过书面或口头回答。统计学的艺术之一在于能成功地向利益相关者或受众传达结果。有时受众技术性很强，有时则不然。习题则是对本章所学概念的更直接应用。


