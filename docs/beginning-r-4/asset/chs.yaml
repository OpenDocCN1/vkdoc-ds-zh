  \n到本章结束时，你应该能够：\n\n*   通过后缀识别常见的文件类型。\n*   应用 R 包和函数将数据*导入*`R`。\n*   应用 R 包和函数将数据*导出*`R`。\n\
  \n\n\n## 3.1 环境设置\n\n为了练习输入和输出你可能用到的各种文件类型，我们需要做一些环境设置。为了继续练习创建和使用项目，我们将为本章创建一个新项目。在该项目中，我们还将创建一些文件夹，并从本书的\
