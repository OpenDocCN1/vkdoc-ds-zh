  \ = anova2$aov,\nspecs = \"StressCat\",\nby = \"Female\")\nsummary(anova2.meansA,\
  \ infer = TRUE)\n## Female = 0:\n##  StressCat emmean    SE  df lower.CL upper.CL\
  \ t.ratio p.value\n##  0          3.17 0.209 181     2.75     3.58 15.153  <.0001\n\
