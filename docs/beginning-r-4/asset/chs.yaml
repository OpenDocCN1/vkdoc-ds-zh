  \ `data.table` 的下一部分。在下一节中，我们将在学习更多关于 `data.table` 知识的同时，继续了解更多的逻辑运算。\n\n\n\n###\
  \ 列操作如何工作？\n\n在 `DT[i, j, by]` 中，第二个区域用于对列进行操作。这包括仅选择某些列以及创建新列。\n\n#### 选择列\n\n\
  你可能已经注意到我们的 `acesData` 和 `texasData` 包含多个列。如果我们只对其中几列感兴趣该怎么办？我们可以通过在 *j* 位置使用列操作来选择我们想要的列。只选择一列非常简单。只需在\
  \ *j* 位置输入列名即可。为此，我们需要让 `R` 知道我们要*跳过*第一个或 *i* 位置。要跳过，只需使用一个逗号。在这里，我们只查看 `EDU` 列中的数据。我们看到\
  \ `0` 表示*未获得高等教育学位*，`1` 表示*已获得高等教育学位*，而 `NA` 表示缺失数据。请注意我们代码中的逗号！\n\n```\nacesData[,\
