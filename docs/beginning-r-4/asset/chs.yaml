  \ `EDU` 状态。换句话说，在 `acesData` 中，是否有调查参与者选择不回应教育水平？根据我们目前学到的知识，下面的两行代码之一可能看起来是可行的。毕竟，我们之前对\
  \ `CountyName == \"Victoria\"` 和 `SurveyInteger == 2` 使用了类似的技术：\n\n```\nacesData[EDU\
  \ == \"NA\"]\n## Empty data.table (0 rows and 19 cols): UserID,SurveyDay,SurveyInteger,SurveyStartTimec11,Female,Age...\n\
  acesData[EDU == NA]\n## Empty data.table (0 rows and 19 cols): UserID,SurveyDay,SurveyInteger,SurveyStartTimec11,Female,Age...\n\
  ```\n\n不要被迷惑！尽管前面的代码行似乎表明没有结果，但实际上有很多观测值缺少教育状态！缺失数据很复杂。现在，我们不会在本文中深入探讨其原因——这是另一个话题。你需要记住的是，缺失数据很棘手，并且\
  \ `R` 有一个特殊函数来处理它们。要使用的函数是 `is.na()` 函数。由于它在特定列的每一行中检查缺失数据，所以它位于我们预期的位置，即 `data.frame`\
