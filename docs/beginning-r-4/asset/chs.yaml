  图 6-13


  裁剪后的 `COPEExp` 直方图


  ## 6.3 集中趋势


  在前面的章节中，“中间”这个词反复出现。然而，尽管这些是大多数人已经熟悉的统计学概念，我们却刻意避免使用一些“中间”的同义词。我们一直没有使用“均值”或“中位数”这类词。现在是时候纠正这一点，来讨论用一个单一数值将整列数据归纳为一个集中趋势的方法。


  记住故事往往比记忆大量看似无关的事实更容易。你的目标是通过更容易获取、规模可控的样本来理解总体。即便如此，样本的量往往也很大。你已经掌握了一些很好的可视化方法来总结样本的数值行为。而集中趋势的目的，就是找到一些常见的、居中的或常规的数值，来描述样本中“最可能”出现的值。


  在日常生活中，人们经常使用“平均值”这个词来描述这些概念。由于这里我们要追求数学上的精确，我们将尽量避免使用这个词。相反，我们将介绍三种计算“平均值”的方法，它们通常会得出不同的结果。通过比较和对比这些差异，你不仅能学到一些总结样本的好方法，还能更深入地了解样本本身。




  ### 算术平均值


  通常，当人们在数学意义上说“平均值”（例如，维多利亚州的平均收入）时，他们指的是**算术平均值**。假设有两个人，一个人收入为 0 美元，另一个人收入为 10
  万美元。将这两个数字相加，然后除以人数，得到平均工资为 5 万美元。


  虽然我们可以手动计算，但正如你所见，这信息量不大。对于一些随机的读者来说，要理解我们在做什么也更困难：


  ```

  (0 + 100000)/ 2

  ## [1] 50000

  ```


  更好的方法是使用 `R` 语言中计算算术平均值的函数 `mean()`，作用于我们创建的、包含这两个工资数据的变量上：


  ```

  salaries <- c(0, 100000)

  mean(salaries)

  ## [1] 50000

  ```


  如果我们的样本中有三个人呢？假设我们在其中再加入一个人，其工资为 57,364 美元。那么，你现在需要将三个收入相加，然后除以 3，而不是 2：


  ```

  (0 + 100000 + 57364)/3

  ## [1] 52455

  salaries <- c(0, 100000, 57364)

  mean(salaries)

  ## [1] 52455

  ```


  在数学和统计学中，我们经常使用符号来表示概念。虽然符号有时会显得有些晦涩，但它们能让研究人员快速交流思想。有两种方式来表述算术平均值的等式。了解这一点很有用，这样你就能理解其他文献中的内容；在本书中，我们使用
  `mean()`。


  第一种方式使用省略号（...）来表示“依此类推”。算术平均值（用 ![$$ \overline{x} $$](img/495868_1_En_6_Chapter_TeX_IEq1.png)
  或“x bar”符号表示）是所有变量之和除以变量的*个数*；公式为 ![$$ \overline{x}=\left({x}_1+\dots +{x}_n\right)/n
  $$](img/495868_1_En_6_Chapter_TeX_IEq2.png)。你刚才在 `n = 2` 和 `n = 3` 的例子中已经看到了。


  表达完全相同意思的更传统或更正式的方式是使用大写的希腊字母 *sigma*（可以把 sigma 理解为表示***求和***）。在这种情况下，*i* 表示我们从集合的开头到结尾遍历所有值。


  ![$$ \overline{x}=\frac{x_1+\dots +{x}_n}{n}=\frac{\sum {x}_i}{n} $$](img/495868_1_En_6_Chapter_TeX_Equa.png)


  注意，我们对样本变量使用了小写的*拉丁*字母（例如 `x`、`n` 和 ![$$ \overline{x} $$](img/495868_1_En_6_Chapter_TeX_IEq3.png)）。当然，我们确实用大写的*希腊*字母代替了省略号。


  总体是庞大的，它们的数据值和摘要被称为*参数*，并且对于总体，我们最常使用小写的*希腊*字母或大写的*拉丁*字母。这些是我们想要研究的对象。


  样本是总体的较小子集，它们的数据值和摘要被称为*统计量*，并且对于样本，我们最常使用小写的*拉丁*字母。因为研究整个总体通常很困难，我们“退而求其次”使用统计量，并利用它们来*估计*或*推断*关于总体和总体参数的信息。


  如果你好奇的话，尽管数学计算方式相同，但存在一个正式的总体参数方程。如果一个人有幸知道整个总体中每个人的工资值，那么最恰当的方式是用希腊字母 `μ`（大致发音为“mu”）和表示总人口数的拉丁大写字母
  `N` 来标记。希腊字母 `μ` 对应着*平均值*（参见粗略发音）：


  ![$$ \mu =\frac{\sum {x}_i}{N} $$](img/495868_1_En_6_Chapter_TeX_Equb.png)


  现在，我们再次强调，所有这些符号都是为了让你具备与全球研究人员和数据交互的良好能力。无论是使用 `R`（`mean()`）、省略号、大写的 sigma（`Σ`）还是小写的
  mu（`μ`），对于算术平均值而言，最终计算结果并无差异。


  ### 示例


  计算算术平均值（之所以这样称呼，是因为在除以计数之前，你需要使用算术方法对每个值求和）使用 `mean()` 函数。默认情况下，它有两个参数。第一个是定量数据，例如可以在一个列中找到的数据。第二个参数是可选的，仅当数据包含
  `NA` 时才需要；它就是 `na.rm = TRUE`。


  在这里，你会看到在 `penguinsData$flipper_length_mm` 上运行 `mean()` 的结果，分别是在不删除和删除缺失数据的情况下。无论哪种方式，你都能获得一些有用的信息：


  ```

  mean(penguinsData$flipper_length_mm)

  ## [1] NA

  mean(penguinsData$flipper_length_mm, na.rm = TRUE)

  ## [1] 200.9

  ```


  在视觉上，我们可以使用函数 `geom_vline()` 在图表中添加一条垂直线。但是，我们没有将任何数据映射到垂直线的外观上。由于垂直线由 x 轴截距上的一个点决定，因此我们必须在映射参数的二次调用中提供该信息。在这里不必过于担心代码。你要关注的是图
  6-14 中的算术平均值，虽然它明显位于所有点的中间，但实际上并未穿过直方图最高的部分：


  ```

  ggplot(data = penguinsData,

  mapping = aes(x = flipper_length_mm))+

  geom_histogram()+

  geom_vline(mapping = aes(xintercept = mean(flipper_length_mm, na.rm = TRUE)))

  ## ''stat_bin()'' using ''bins = 30''. Pick better value with ''binwidth''.

  ## Warning: Removed 2 rows containing non-finite values (stat_bin).

  ```


  因此，虽然当被问及企鹅鳍状肢的长度时，201 可能是一个很好的“平均”数字，但你可以看到，我们可能需要其他方式来讨论集中趋势。稍后会有更多相关内容！


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig14_HTML.png](img/495868_1_En_6_Fig14_HTML.png)


  **图 6-14** 带有算术平均值的企鹅直方图


  ### 示例


  类似地，可以为我们的 `acesData` 计算 `mean()`：


  ```

  mean(acesData[SurveyInteger == 3]$COPEExp)

  ## [1] NA

  mean(acesData[SurveyInteger == 3]$COPEExp, na.rm = TRUE)

  ## [1] 2.37

  ```


  这一次，图 6-15 中的垂直线似乎不仅位于数据中间：它还处于数据的“密集”区域：


  ![../images/495868_1_En_6_Chapter/495868_1_En_6_Fig15_HTML.png](img/495868_1_En_6_Fig15_HTML.png)


  **图 6-15** 带有算术平均值的 COPEExp 直方图


  ```

  ggplot(data = acesData[SurveyInteger == 3],

  mapping = aes(x = COPEExp))+

  geom_histogram()+

  geom_vline(mapping = aes(xintercept = mean(COPEExp, na.rm = TRUE)))

  ## ''stat_bin()'' using ''bins = 30''. Pick better value with ''binwidth''.

  ## Warning: Removed 264 rows containing non-finite values (stat_bin).

