  ## 6.6 本章小结


  本章介绍了可用于理解任何数据集的探索性数据分析工具。具体来说，你学会了如何使用`ggplot()`快速将数据绘制成直方图、点图和箱线图。你应用了`median()`、`mean()`、`summary()`和`sd()`来创建摘要，并从集中趋势、位置和波动性方面加深对数据集的理解。在此过程中，你将数据集与两个“完美”模型（一个“正态”和一个“均匀”）进行了比较。总而言之，你现在拥有了比较和对比任意两个数据集并理解其异同的知识、技能和能力。你付出了大量努力来学习这些概念，在练习中磨练技能时，可以随时参考表
  6-1。


  **表 6-1** 本章小结


  | 概念 | 含义 |

  | --- | --- |

  | `hist()` | 基础`R`绘图包中的直方图函数。 |

  | `setdiff()` | 比较集合 x 与集合 y，并返回 x 中不在 y 中的元素。 |

  | `dotchart()` | 基础`R`绘图包中的点图。 |

  | `ggplot()` | 图形语法包的主函数，接收数据和映射参数。 |

  | `aes()` | 从数据列中接收`x =`、`y =`、`fill =`参数。 |

  | `geom_histogram()` | 将 ggplot 对象转换为直方图。 |

  | `geom_dotplot()` | 将 ggplot 对象转换为点图。 |

  | `geom_jitter()` | 将 ggplot 对象转换为一组散点。 |

  | `geom_boxplot()` | 将 ggplot 对象转换为箱线图。 |

  | 正态数据 | 均值和众数是最常见的数据点。 |

  | 均匀数据 | 矩形数据，其中每个点出现的概率与其他点相同。 |

  | `mean()` | 计算算术平均值。 |

  | `median()` | 返回数据精确中间位置的数据点。 |

  | `quantile()` | 计算数据元素的相对位置。 |

  | 异常值 | 远离均值及大部分数据的数据点。 |

  | 标准差 | 衡量数据波动性的指标。 |

  | `sd()` | 计算标准差的函数调用。 |

  | 经验法则 | 也称为 68-95-99.7 规则。 |

  | `summary()` | 箱线图的数值版本。 |


  ## 6.7 掌握练习


  通过完成一些练习题来检查你的进度并在实践中成长。理解检查题提出批判性思维问题，最好以书面或口头形式回答。统计的艺术之一在于成功地将结果传达给你的利益相关者或受众。有时受众技术水平很高，有时则非技术性很强。练习题则是本章所探讨概念的更直接应用。


  ### 理解检查题


  1.  用你自己的话来说，平均值和中位数之间的区别是什么？它们各自的计算过程是怎样的？如果你想要用一个数字来描述一个国家“普通”公民的收入，哪个指标可能更好？为什么？


  2.  在研究 A 国和 B 国之间的年龄差异时，你发现两国的年龄中位数都是 36 岁，平均年龄都是 40 岁。然而，A 国的标准差为 4.5 年，而 B 国的标准差为
  10.2 年。你知道年龄通常大致遵循正态分布（中位数和平均数接近支持了这一点）。关于这两个国家的总体直方图，你可能预期到什么？哪个国家更有可能有一位 104 岁的公民？




  ### 练习


  1.  最好的学习方式是动手实践。复制本章中每个生成图形的示例代码。然后，将数据集中同一列的 `x =` 替换为另一列（例如，将 `x = flipper_length_mm`
  替换为 `x = body_mass_g`）。你从其他数据列中学到了什么？它们中有任何*正态分布*或*均匀分布*的数据吗？


  2.  在完成上一练习中对图形的列替换后，继续对你探索的每个新列使用 `summary()` 和 `sd()` 函数。将新的均值和标准差与你已见过的值进行比较和对比。同时比较和对比图形。你是否开始对标准差较大和较小时的视觉差异有所感觉？


  3.  回忆一下样本标准差——`sd()`——遵循公式 ![$$ s=\sqrt{\frac{\sum {\left({x}_i-\overline{x}\right)}²}{n-1}}
  $$](img/495868_1_En_6_Chapter_TeX_IEq6.png)。如何用手工传统方式计算标准差？嗯，对于 344 行数据，完全手工计算可能要求过高。相反，按照以下代码逐步操作，看看标准差究竟在做什么：


  ```

  #首先，你获取一个只包含长度的数据表

  standardDeviationpenguin <- penguinsData[,.(flipper_length_mm)]

  #你需要知道平均长度

  standardDeviationpenguin[, Mean := mean(flipper_length_mm, na.rm = TRUE)]

  #到目前为止，我们每只企鹅的鳍状肢长度都有一个条目，以及总体平均值。

  head(standardDeviationpenguin)

  ##    flipper_length_mm  Mean

  ## 1:               181 200.9

  ## 2:               186 200.9

  ## 3:               195 200.9

  ## 4:                NA 200.9

  ## 5:               193 200.9

  ## 6:               190 200.9

  #这是每个长度与平均值之间的残差

  standardDeviationpenguin[ , x_iMinusMean := (flipper_length_mm - Mean)]

  #这让我们看到三只企鹅（通过目测，它们恰好来自不同物种）

  standardDeviationpenguin[c(1, 153, 277)]

  ##    flipper_length_mm  Mean x_iMinusMean

  ## 1:               181 200.9      -19.915

  ## 2:               211 200.9       10.085

  ## 3:               192 200.9       -8.915

  ```


  请注意，到目前为止，我们在 `x_iMinusMean` 中看到的是每个鳍状肢长度与平均长度之间的*差值*或**残差**。 -19.9 告诉我们第一个鳍状肢比平均值小很多。第二个物种的
  10.1 告诉我们这个鳍状肢比平均值长。


  正态分布数据的标准差较小。这说明在这些数据集中，残差总是很小。均匀分布数据的标准差较大，这说明残差不总是很小。


  现在，按目前情况来看，如果你将 `x_iMinusMean` 的值求和，负数会在某种程度上被正数“抵消”（反之亦然）。这并不完全公平，因为请注意第一只企鹅与平均值
  201 的整体距离最大。


  因此，在数学中，为了消除负数，我们对它们进行平方：


  ```

  standardDeviationpenguin[ , x_iMinusMeanSquared := (x_iMinusMeanˆ2)]

  #这让我们看到三只企鹅（通过目测，它们恰好来自不同物种）

  standardDeviationpenguin[c(1, 153, 277)]

  ##    flipper_length_mm  Mean x_iMinusMean x_iMinusMeanSquared

  ## 1:               181 200.9      -19.915              396.62

  ## 2:               211 200.9       10.085              101.70

  ## 3:               192 200.9       -8.915               79.48

  ```


  回头再看*均值*公式，回忆一下 ![$$ \overline{x}=\frac{\sum {x}_i}{n} $$](img/495868_1_En_6_Chapter_TeX_IEq7.png)。请注意，计算算术平均值的方法是将所有值求和并除以项目数量。


  现在，我们的 `x_iMinusMeanSquared` 列可以在没有任何抵消的情况下求和；这正是我们对方差所做的！方差就是残差平方的算术平均值。它告诉我们通常的平方残差：


  ```

  variance <- sum(standardDeviationpenguin$x_iMinusMeanSquared, na.rm = TRUE) / (nrow(standardDeviationpenguin)
  - 1)

  ```


  通常，平方值对人类来说没有意义，因此我们取平方根，回到鳍状肢长度而不是鳍状肢长度的平方。因此，方差的平方根就是标准差。你可以使用 `sd()` 函数检查你的工作：


  ```

  sqrt(variance)

  ## [1] 14.02

  sd(standardDeviationpenguin$flipper_length_mm, na.rm = TRUE)

  ## [1] 14.06

  ```


  看过这段代码后，请自行对 `mtcarsData` 数据集的 `mpg` 列重复此过程。记得使用 `sd()` 检查你的工作！


