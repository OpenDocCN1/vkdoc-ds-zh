  \     estimate   SE  df t.ratio p.value\n##  Adelie - Chinstrap     -158 64.2 327\
  \  -2.465 0.0377\n##  Adelie - Gentoo       -1311 54.4 327 -24.088 <.0001\n##  Chinstrap\
  \ - Gentoo    -1152 66.8 327 -17.246 <.0001\n##\n## sex = male:\n##  contrast  \
