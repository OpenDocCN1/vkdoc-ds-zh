  比较并对比图 6-14 和图 6-15。算术平均值一定能告诉你“平均”数据是什么样的吗？




  ### 中位数


  由于算术平均数并不总能完美概括数据，因此引入其他度量指标是有益的。一种可行方案是找出数据点列表中处于正中心位置的那个数据点。


  回顾我们之前三个薪资的小示例：


  ```

  salaries

  ## [1]      0 100000   57364

  ```


  在该示例的三个人中，有*两人*的收入*高于*算术平均数。位于中间的薪资 57364 美元即为 `median()` 中位数。在这种情况下，中位数或许能更好地代表“普通人”的收入水平。它是一个真实的薪资值，且位于这三人的中间位置。与之前相同，`R`
  函数可以接受两个参数：一个数据项和可选的第二个参数 `na.rm = TRUE`：


  ```

  mean(salaries)

  ## [1] 52455

  median(salaries)

  ## [1] 57364

  ```


  需要注意的重要一点是，该薪资数据集的个数为奇数。因此，能精确找到中间值。当数据个数为*偶数*时，则会取*中间两个*值的平均值。请看下面这个扩展示例，`R` 的
  `median()` 函数会自动识别中间两个值并计算它们的 `mean()` 平均值：


  ```

  salariesEven <- c(0, 100000, 57364, 20000)

  sort(salariesEven)

  ## [1]       0 20000 57364 100000

  median(salariesEven)

  ## [1] 38682

  mean(c(57364, 20000))

  ## [1] 38682

  ```


  ### 示例


  针对企鹅数据，对比分析平均值与中位数。当平均值更大时，你能从中发现什么？


  ```

  mean(penguinsData$flipper_length_mm, na.rm = TRUE)

  ## [1] 200.9

  median(penguinsData$flipper_length_mm, na.rm = TRUE)

  ## [1] 197

  ```


  观察直方图（同样，无需在 `ggplot()` 代码上花费过多时间）。在图 6-16 中，中位数以虚线形式添加。如图所示，在这种情况下，中位数或许能更好地衡量这些数据的集中趋势——它穿过了图形中数据更密集的部分：


  ```

  ggplot(data = penguinsData,

  mapping = aes(x = flipper_length_mm))+

  geom_histogram()+

  geom_vline(mapping = aes(xintercept = mean(flipper_length_mm, na.rm = TRUE)))+

  geom_vline(mapping = aes(xintercept = median(flipper_length_mm, na.rm = TRUE)),

  linetype = "dashed")

  ## ''stat_bin()'' using ''bins = 30''. Pick better value with ''binwidth''.

  ## Warning: Removed 2 rows containing non-finite values (stat_bin).

  ```


