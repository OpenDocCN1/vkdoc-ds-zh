  \n\n\n### 子集选择\n\n从数据集中选择或*子集化*某些行也是一项很有用的技能，这属于行操作。因此，我们使用 `DT[i, j, by]` 的第一个*行*操作或第\
  \ *i* 个位置来进行子集选择。子集是通过使用*逻辑*运算符（有时称为布尔运算符）来实现的。首先写出 `TRUE` 的条件，然后，计算结果为 `TRUE` 的行将被选中。为了设定这些条件，我们使用基础\
  \ `R` 和我们的 `extraoperators` 包中的运算符。作为参考，在我们给出一些带代码的实际示例之前，我们先在表 4-1 中展示常用的运算符和函数。\n\
  \n#### 注意：区间表示法\n\n区间表示法是一种紧凑的方式，可以非常精确地定义你想要的数字区间。例如，假设你有一组数字：1, 2, 3, 4, 5。用文字描述，我们可以写成“大于\
  \ 3 且小于 5 的数字”，那么在我们这个小集合中，就会得到数字 4。我们也可以说“至少为 3 且小于 5 的数字”，那么在我们的数字集合中，就会得到数字 3\
  \ 和 4。用文字描述这些的方式相对较长，因此人们经常使用区间表示法。区间表示法使用圆括号“（”和“）”，以及方括号“[”和“]”。圆括号表示大于“（”或小于“）”。方括号表示大于或等于“[”或小于或等于“]”。例如，描述“大于\
  \ 3 且小于 5 的数字”的区间表示法是 `(3, 5)`。描述“大于或等于 3 且小于 5 的数字”的区间表示法是 `[3, 5)`。表 4-1 中的许多逻辑运算符都用于选择特定区间。\n\
  \n#### 表 4-1：逻辑函数\n\n| 函数 | 作用 |\n| :--- | :--- |\n| `==` | 值/向量是否相等？ |\n| `!=`\
  \ | 值/向量是否不相等？ |\n| `%like%` | 值是否类似于引号内的字符？ |\n| `<` 或 `%l%` | 小于。 |\n| `<=` 或\
  \ `%le%` | 小于或等于。 |\n| `>` 或 `%g%` | 大于。 |\n| `>=` 或 `%ge%` | 大于或等于。 |\n| `%gl%`\
  \ | 大于且小于，`(x, y)`。 |\n| `%gel%` | 大于或等于且小于，`[x, y)`。 |\n| `%gle%` | 大于且小于或等于，`(x,\
  \ y]`。 |\n| `%gele%` | 大于或等于且小于或等于，`[x, y]`。 |\n| `%in%` | 属于。 |\n| `%nin%` | 不属于。\
  \ |\n| `%c%` | 对右侧的操作进行链式调用。 |\n| `%e%` | 集合运算符，用于使用集合表示法。 |\n| `is.na()` | 选择缺失数据的函数。\
  \ |\n\n相等是一个相当常见的逻辑运算，这里我们尝试在 `texasData` 上应用它。与 `order()` 非常相似，即使这是一个*行*操作，我们也必须在特定的*列*内部执行它。因此，使用\
  \ `CountyName` 列，我们*只*选择那些与 `Victoria` **完全匹配**的行。Victoria 恰好是德克萨斯州的一个县，是我们其中一人的工作院校所在地。再次请注意，由于我们没有使用\
  \ `<-` 运算符将此结果赋值给任何变量，我们目前只是在探索数据。数据集中的观测数量没有变化（可以在右上角的“环境”窗格中确认）：\n\n```\ntexasData[CountyName\
  \ == \"Victoria\"]\n##    CountyName FIPSNumber CountyNumber PublicHealthRegion\n\
  ## 1:   Victoria        469          235                  8\n##    HealthServiceRegion\
  \ MetropolitanStatisticalArea_MSA\n## 1:                   8                   \
  \     Victoria\n##    MetropolitanDivisions MetroArea NCHSUrbanRuralClassification_2006\n\
  ## 1:                    --     Metro                       Small Metro\n##    NCHSUrbanRuralClassification_2013\n\
  ## 1:                       Small Metro\n```\n\n有时候，我们想要的不是精确*匹配*，而是**不**匹配。这称为“不等于”；在\
  \ `R` 中，**不**是用感叹号“!”编码的。在这种情况下，回到我们的 `penguinsData`，我们只选择**不是** `Adelie` 物种的数据：\n\
  \n```\npenguinsData[species != \"Adelie\"]\n##        species island bill_length_mm\
  \ bill_depth_mm flipper_length_mm\n##   1: Chinstrap  Dream           46.1     \
  \     18.2               178\n##   2: Chinstrap  Dream           58.0          17.8\
  \               181\n##   3: Chinstrap  Dream           42.4          17.3     \
