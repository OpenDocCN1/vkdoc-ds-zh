- '# 观察图形特征


  当你查看图形时，请注意其一些特征。随着 `mtcars$wt` 的 x 轴值增加，`mtcars$mpg` 的 y 轴值减小。这是我们预期会看到的现象；汽车的重量应该会降低燃油效率。如果你在自己的系统上运行这段代码，可能会注意到图形看起来略有不同。例如，图
  1-5 的宽度大于高度，但我们可以调整宽高比（图形高度与宽度的比例）；虽然数据相同，但看起来却有所不同。为了说明这一点，我们在图 1-6 中制作了同样的图形，但这次高度和宽度大致相等。


