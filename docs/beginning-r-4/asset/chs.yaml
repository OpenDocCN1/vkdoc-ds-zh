  继续往下，看过重量和每加仑英里数后，我们准备用可视化方式观察这两个数据点。如果这一步成功，你将写出第一个程序，用`plot()`绘制并可视化这两个数据集，同时也印证了
  RStudio 和`R`一切就绪。


  要告诉`R`我们想绘制图形，可以使用名为`plot(x, y)`的函数。函数接收一个或多个*输入*（此处为重量和每加仑英里数），并给出输出（此处为这两个数字对的散点图）。如果你从代数中熟悉
  x 轴和 y 轴，你应该能预见到如图 1-5 所示的图形。请精确复制代码到脚本窗口，高亮并运行代码！图形将显示在*Plots*窗格（之前是*Files*窗格）。注意，你可以随时点击返回
  Files 窗格，也可以*导出*你的图形。现在正是与世界分享你的第一个散点图的好时机。在编程中，这类第一步有时被称为"Hello World"（因为在我们最初学习编程时，图形和可视化很罕见，所以第一个程序往往只是在控制台打印"hello
  world"——那些艰苦的岁月！）。更重要的是，这不再是一个 1970 年代的旧数据集——你现在可以视觉化任何能导入`R`的数据集。相当强大的功能。


