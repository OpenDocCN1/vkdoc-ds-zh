- '# 9. 置信区间


  我们对于第 8 章中的回归模型有多确信？同样地，你有多大把握认为一个*样本*均值统计量是总体均值参数的良好估计？我们如何在这些估计中引入一些“浮动空间”，从而持续传达预期可能达到的准确度？


  你很可能见过这样的估计：一个单一数值后紧跟一个正负量。单一数值的估计称为**点估计**，而正负量所构成的区间称为**置信区间**（CI）。例如，我们可以自信地告诉你，这本书受到全球
  50% 统计学家的推荐，误差范围为 ±50%。尽管全球好评率达 50% 的点估计可能令人印象深刻，但你很快会意识到置信区间是从 0% 到 100%。这就不那么令人印象深刻了。


  注意


  置信区间通常缩写为 **CI**。置信区间（即 CI）定义了一个区间，由两部分组成：置信下限和置信上限。例如，在前面的例子中，置信区间是 0%–100%。那么
  0% 就是置信下限，100% 就是置信上限。这些通常缩写为 **LL** 表示下限，**UL** 表示上限。有时你也会看到它们被缩写为 **2.5** 和 **97.5**，这是最常见置信区间类型（置信水平**CL**为
  95% 的置信区间）的百分位数。我们将在本章中学习更多关于置信区间的知识，但希望这有助于你熟悉一些常用术语。


  因此，目标是建立一个统计框架，使你能够创建出可用的置信区间。一个好的置信区间应该能传达不确定性水平。一个好的数据样本应足够稳健，能将置信区间的范围缩小到可用的水平。


  学完本章，你应该能够：


  *   通过 z 分数理解置信区间的理论。

  *   理解 t 分数置信区间的应用。

  *   使用 t 分数方法创建置信区间。

  *   评估两个样本以判断其总体相似性/相异性。


