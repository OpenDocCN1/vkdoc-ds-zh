  \     185\n##   5: Chinstrap  Dream           43.2          16.6               187\n\
  ## ---\n## 188:    Gentoo Biscoe           52.1          17.0               230\n\
  ## 189:    Gentoo Biscoe           51.5          16.3               230\n## 190:\
  \    Gentoo Biscoe           55.1          16.0               230\n## 191:    Gentoo\
  \ Biscoe           54.3          15.7               231\n## 192:    Gentoo Biscoe\
  \             NA            NA                NA\n##      body_mass_g    sex year\n\
  ##   1:        3250 female 2007\n##   2:        3700 female 2007\n##   3:      \
  \  3600 female 2007\n##   4:        3700 female 2007\n##   5:        2900 female\
  \ 2007\n## ---\n## 188:        5550   male 2009\n## 189:        5500   male 2009\n\
  ## 190:        5850   male 2009\n## 191:        5650   male 2008\n## 192:      \
  \    NA    2009\n```\n\n在讨论其他行选择运算符之前，有两种方法可以*组合*逻辑值。一种是*且*，用 `&` 编码；另一种是*或*，用 `|`\
  \ 编码。以下代码展示了两个不同的例子，其中相同的独立逻辑值（例如，`species == \"Gentoo\"` 加上 `flipper_length_mm\
  \ == 230`）首先通过*且*连接，然后通过*或*连接。结果的差异很具有启发性。同时请注意，字符值使用引号 `\"\"`，而数值则不需要：\n\n```\n\
  penguinsData[species == \"Gentoo\" &\nflipper_length_mm == 230]\n##    species island\
  \ bill_length_mm bill_depth_mm flipper_length_mm\n## 1:  Gentoo Biscoe         \
