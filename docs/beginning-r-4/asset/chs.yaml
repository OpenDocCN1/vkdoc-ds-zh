  \n7.  将这些练习与本章中的示例进行比较和对比。特别注意各个代码块中的变量选择。观察哪些变量被更改以及哪些部分适用，请记住，大多数优秀程序员都是从复制可运行的代码开始，稍作编辑，然后运行编辑后的代码看看结果如何。\n\
  \n"
- "# 13. 方差分析\n\n你一直在研究的企鹅生活在三个不同的岛屿上。我们最初探索了比斯科岛上的阿德利企鹅——并将它们与所有阿德利企鹅进行了比较。然而，这种方法可能略有缺陷。我们真正想做的是测量每个岛屿上阿德利企鹅的平均体重——看看是否有三个岛屿与众不同。这种测量组间变化或*方差*的检验被称为方差分析（简称\
  \ ANOVA）。本章将帮助你使用方差分析来检测分类组之间的差异——或者，用 `R` 的话来说，即 `factor()`。\n\n学完本章，你应该能够：\n\n\
  *   评估适用于方差分析的数据结构和研究问题。\n\n*   创建可视化图表以理解方差分析结果。\n\n*   评估单因素方差分析和多因素方差分析之间的差异（以及何时使用）。\n\
  \n\n\n## 13.1 R 环境设置\n\n按照惯例，为了继续练习创建和使用项目，我们为本章节新建一个项目。\n\n如有需要，请回顾第 1 章中创建新项目的步骤。启动\
