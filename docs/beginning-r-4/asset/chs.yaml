  \n请记住，本章使用的所有包已在第 2 章中安装到你的本地计算机上。无需重新安装。不过，这是一个新项目，我们是首次运行这组代码。因此，你需要运行以下`library()`调用：\n\
  \n```r\nlibrary(data.table)\n## data.table 1.13.0 using 6 threads (see ?getDTthreads).\
  \ Latest news: r-datatable.com\nlibrary(ggplot2)\nlibrary(visreg)\nlibrary(emmeans)\n\
  library(palmerpenguins)\nlibrary(ez)\n## Registered S3 methods overwritten by 'lme4':\n\
  ##   method                          from\n##   cooks.distance.influence.merMod\
