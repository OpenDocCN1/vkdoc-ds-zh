  \ 菜单选项。点击软盘形状的 *save* 图标，将此文件命名为 `DataIO.R`，然后点击 *Save*。\n\n在右下方面板中，你应该能看到你项目中的两个文件。在\
  \ *Files* 选项卡正下方，点击标题为 *New Folder* 的按钮。在弹出的 *New Folder* 对话框中，输入 `data` 并选择 *OK*。在右下方面板中，点击你新建的\
  \ *data* 文件夹。重复创建文件夹的步骤，创建一个名为 `ch03` 的新文件夹。\n\n接下来，你需要从本书的网站下载一些文件。这些文件应该存放在 *GitHub*\
