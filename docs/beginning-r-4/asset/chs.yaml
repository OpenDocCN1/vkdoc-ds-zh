- '# 12. 调节回归


  多元回归允许使用多个变量来预测感兴趣的结果。这通常倾向于产生更准确的模型。然而，多元回归本身不允许两个预测变量相互交互。想想企鹅的情况，也许体重不仅取决于鳍状肢长度或喙深度，而是两者之间存在某种独特的协同作用，共同造就了一只体态圆润的企鹅。本章探讨两个（或更多）预测变量可能相互交互的方式。通常，这些方法可以创建更完整的模型。


  在本章结束时，你应该能够：


  -   理解多元回归和调节回归之间的区别。

  -   创建调节回归模型和可视化图表。

  -   分析来自调节回归模型的各种数据的含义。

  -   创建人性化的图表和沟通内容，以传达调节回归模型的结果。


