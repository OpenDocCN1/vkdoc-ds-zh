- "# 5. 为晋升做好准备\n\n运用技能与态度解锁新机遇\n\n在本章中，你将学习如何培养和运用你的技能来解锁那些能带来加薪、晋升或新机遇的机会。\n\n尽管你可能想跳过本章，专注于谈判以快速取胜，但请注意，本章是你谈判尝试中不可或缺的一部分。如果你可以在玩游戏前学习好策略和纯粹碰运气之间做选择，那么采用前一种方法你更有可能成功。\n\
  \n这就是为什么无论你的目标是加薪、晋升，还是计划面试新职位，或是打算自主创业，我们都要专注于影响力建设、自信果断、沟通技巧、反馈循环以及许多其他实用的工具。\n\
  \n## 社交技能与自信果断\n\n**本节目标：**\n\n-   发现建立持久关系的关键。\n-   通过考虑他人的意见来改善沟通，从而彰显自我。\n- \
  \  通过学习非暴力沟通来最小化冲突。\n\n你的沟通方式直接影响着你的职业生涯。无论你选择哪条职业道路，你都将与人沟通。\n\n有些工作需要你时刻沟通，而另一些则让你沉浸在技术挑战中。例如，如果你是专家、设计师或软件工程师，你可能整天在电脑前工作，不与任何人交谈。沟通不足会对你的社交技能产生重大影响。因此，即使你的工作几乎不需要沟通，也请确保在空闲时间进行足够的社交活动。\n\
  \n戴尔·卡内基的经典著作《人性的弱点》⁴³ 在撰写本书时，是`Amazon.com`上领导力、求职与职业指南、人际关系类别的畅销书。在培养软技能和人际关系方面，书中的建议被认为是坚实可靠的。无论是薪资谈判、日常业务还是个人关系，本书阐述的通用原则都适用于大多数情况。\n\
  \n戴尔·卡内基的书概述了一些通用的沟通经验法则，这些法则对你的职业生涯大有裨益。这不是一个完整的列表，而是我本人多次阅读此书后的一些心得体会：\n\n-  \
  \ 思考他人想要什么。帮助他人，并表现出对他们的真诚兴趣。\n-   从对方的兴趣点出发进行交谈。\n-   永远不要责备他人。批评他人要非常谨慎。绝不要公开批评任何人。\n\
  -   尊重他人的意见。即使你认为他们错了，也绝不要攻击他们。可以通过提问来沟通。\n-   犯错时，要迅速承认。\n-   让他人感到自己很重要。经常称呼他们的名字。\n\
  -   避免长时间争论。辩论中只有输家。\n-   尽可能经常微笑。\n\n我建议带着批判的眼光去阅读这本书。遗憾的是，这本书没有强调在使用这些原则时明确你的意图的重要性。每个原则既可以出自善意，也可以源于非常错误的动机。\n\
  \n例如，经常微笑是很好的，前提是微笑是真诚的。每个人都喜欢和面带微笑的人相处。然而，一旦微笑是假装的，人们会察觉到你的非语言沟通。伪装非语言沟通需要耗费太多精力；因此，经常微笑更是一个建议你转变情绪状态而非变得虚伪的原则。\n\
  \n至于使用谈话对象的名字，要适可而止。如果你以前从不在谈话中称呼老板的名字，那么在下次讨论中突然五次提及他或她的名字，很可能会让老板觉得你这次谈话别有目的。赢得朋友和让人反感之间只有一线之隔；因此，每项技巧都应结合常识来使用。\n\
  \n你越早明白沟通的重点不在于你自己，就越好。如果你一直谈论自己想要什么，没多少人会在意。先帮助他人。如果你想要什么，就告诉别人他们能从中得到什么。责备或批评他人可能是致命的，尤其是公开批评。\n\
  \n人类能够察觉他人的情绪。因此，我们能够表现出同理心，并感受到对方的感受。这是一项可以磨练的技能。一旦你知道他人正在做什么，你就会注意到自己在他们身上引发了什么样的感受。情绪状态传递是一个交换过程，沟通双方在此过程中交换情绪。积极的情绪交换需要情感财富。情感财富匮乏的人往往会消耗谈话对象的精力。为了避免成为“能量吸血鬼”，请确保戴尔·卡内基的原则是出于真诚、善意的出发点，而非操控。持久的成功来自同理心和情商，而操控可能只能带来暂时的成功。\n\
  \n\n### 注意\n\n与情感财富匮乏的人进行情绪交流可能会让你精疲力竭。不幸的是，患有 B 类人格障碍（如自恋、马基雅维利主义和反社会人格）的人往往能相当有效地在公司阶梯上攀升。如果他们的意图被发现，他们会利用谎言、操纵和卑劣手段另寻出路。这些人可能会通过假装脆弱、向你发送矛盾信号、以欺骗性方式运用戴尔·卡耐基的原则，以及专挑你爱听的话说，来拉拢你或其他人为他们的意图提供支持。这个过程会让大多数心理健康的人在情感上消耗殆尽。\n\
  \n请记住保护你的情感财富，免受掠夺性行为和能量吸血鬼的侵害——这些人通过消耗他人来汲取能量，同时假装进行真诚的情感交流。如果你的老板是个自恋者，喜欢与你玩心理游戏，或表现出反社会倾向的迹象，那么你的最佳选择很可能是另谋高就。如果你是这类人的管理者，你需要极其可靠的建议来保护你自己、你的团队以及你的公司，免受你下属意图的侵害。\n\
  \n你的行为会对他人产生影响。例如，当你告诉某个人他们错了时，你很可能会让他们的心情变得比之前更糟。同样，当你心情愉悦时，你会微笑且充满活力，与你互动的人也会受到感染而充满能量。\n\
  \n许多人难以接受这样一个事实：通往卓越人际交往技能的道路在于避免争论，并在我们犯错时坦然承认。既然对话的重点不应是我们自己，那么试图说服对方我们是对的就不值得。\n\
  \n如果你对他人抱有某种期望的结果，那么你达成这个结果的可能性，相比于不执着于结果的心态，反而会更低。因此，讨好型人格者在尝试运用戴尔·卡耐基的原则时，往往承受着最大的痛苦。\n\
  \n### 注意\n\n《人性的弱点》中的原则可能并不适合讨好型人格者。这是因为：（1）讨好行为并非真诚之举，其背后隐藏着某种意图；（2）其中一些原则甚至会助长更多的讨好行为，使得讨好型人格者不断寻求他人对其新策略的看法。\n\
  \n你是如何看待那些在街上接近你或者打陌生电话给你的销售员的？由于我一生中接触过太多这样的人，我能轻易嗅出他们那种刻意的沟通策略。尽管如此，我还是会时不时地上当。\n\
  \n不久前，我去英国参加一个公司活动。在最后一天，我不得不独自提前几小时离开，因为当晚我安排了一场教练辅导课程，我想准时到家以免让我的客户失望。一切看似很简单，因为我可以乘火车到伦敦，然后从那里坐飞机飞回，从而省下那些时间。\n\
  \n当我穿过纽波特火车站附近的一座桥时，我注意到一个当地人友好地向我打招呼。他看到我因之前的一次事故而走路有点跛，便主动提出帮忙。他通过询问我的情况让我打开了话匣子；然后他开始和我分享一些他自己的故事。我当时认为他的兴趣是真诚的；毕竟，他接近我的方式很自然。几分钟后，他迅速改变了话锋，暴露了他的真实意图。他想要从我这里得到钱。\n\
  \n在这种情况下，你会作何感受？你还会感激这个人的善意吗？\n\n让我再和你分享一个故事。我的一位前同事约我见面。我没有拒绝，因为我们过去关系不错，而且我们也就每隔几年见一次面。\n\
  \n他想让我看看他的新办公室。他正与商业伙伴一起开始一项新的事业。他有个爱好，就是开着他的新`BMW`到处兜风，但这一次，那辆`BMW`不见了。我问他：“你没把车撞坏吧？”他回答说：“没有，我待会再告诉你。”神秘兮兮的，不过没关系，毕竟我们正要走进他的新办公室，而且他看起来兴致勃勃。\n\
  \n接下来的半小时里，我们讨论了他的商业计划，同时他也询问了我的生活和近况。空气中弥漫着一种诡异的气氛。他知道我是个多么直截了当的人，然而他不仅让我说了很多关于自己的事，还从一个肤浅的话题跳到另一个。\n\
  \n我从洗手间回来后，他给我端来咖啡。我们站着的时候，我注意到他在模仿我的姿势。我换了个姿势，他看似自然地迅速跟着我改了过来。就在那一刻，我确信我的前同事并非真的对我感兴趣；他另有所图。\n\
  \n我引导话题，想探明他到底想要什么。在他正式提出请求之前，他对我说：“其实我知道，以我对你的了解，我不太可能成功，但我还是想试试。”他在开始之前就已经在心里放弃了他想要的东西；从那一刻起，他对我的兴趣，那些模仿技巧，以及其他一切，都彻底崩塌了。\n\
  \n在这种情况下，你会是什么感觉？\n\n这正是讨好型人格者试图利用“赢得朋友和影响他人”的技巧去取悦他人时，可能引发的后果。真正能赢得朋友、影响他人的社交技能，源于真诚的兴趣，而非假装的兴趣。我们通过维持积极的情感交流来赢得朋友，而这种交流源于情感财富视角下的“富足心态”。讨好行为则源于“匮乏心态”，因为我们想要的是那些我们认为自己无法拥有的东西。\n\
  \n### 得到你想要的的最快方式，是给予你自己\n\n根据亚伯拉罕·马斯洛和托尼·罗宾斯的研究，我们知道人类有各种需求。我们都渴望安全感、多样性、重要性、连接感、爱以及许多其他东西。\n\
  \n根据我作为教练、导师和实践型开发经理的经验，职场中的痛苦大多源于对确定性或重要性需求未得到满足。当一名员工强烈渴望加薪或升职，或者正在考虑离开公司时，其背后必然有一个未被满足的核心需求。\n\
  \n这通常与成长无关。如果你想学习新技能，你可以在工作之余进行，或者你可以规划你的进步并执行所需的步骤来获得提升。挫折感和愤怒源于匮乏心态。我们倾向于认为自己不够好，并因此感到痛苦。我也曾经历过这种境地，感觉好像不知道能做些什么来改变现状。似乎我们的经理并不关心我们。我们可能认为他们故意通过支付低薪来压榨我们的服务价值。在这种心态下，任何争取更高薪水的尝试都可能很容易适得其反。\n\
  \n与此同时，那些拥有很多选择并且总体上很快乐的人，能够专注于贡献。即使他们不主动要求，他们也能获得加薪和晋升。\n\n即使你得到了你想要的，你的需求也可能并未得到满足。加薪带来的情绪高峰能持续多久？几周？几天？几小时？回想当年我还不够自信、情绪远不如现在成熟的时候，我记得自己得到过一次\
  \ 25%的加薪。下午签了合同，等我回到家时，就已经在盘算着如何瞄准下一次加薪了。\n\n我得到了我想要的，然而，我对“重要性”这一人类需求仍然没有得到满足。那\
  \ 25%的加薪证明了我对这个薪资水平来说是“足够好”的。我值得比以前多赚 25%。但是，当我想到那些挣得比我还要多的人时，我立刻又感到了自己的渺小。我把这称为*人类需求悖论*——很多时候，即使得到了，也并非意味着我们的需求得到了满足。\n\
  \n\n\n### 说明\n\n人类需求的悖论可以通过从内在满足自身需求来解决。如果你需要感到自己很重要，你可以无条件地感受自我价值，而不依赖于他人或外界环境。环境并不能定义你是谁，他人也无法界定你的自我价值。运用你的技能为他人和自己创造价值，是一种更为健康的方式，来满足你对重要性和确定性的需求。只要你活着，你就可以确信自己有能力创造价值。因此，你有理由感到自己很重要。\n\
  \n这就是为什么我要提醒你谨慎使用沟通技巧。当这些技巧源于真诚时，它们是出色的；但当它们并非如此时，就如同在需要消毒的深伤口上贴一块创可贴。即使你的症状可能会缓解，但创可贴下的根本问题却可能恶化。\n\
  \n### 说明\n\n沟通技巧的目的并非让你变得“无需求”。你也许能暂时成功地隐藏自己的需求，但代价是内心的煎熬。唯一能长久摆脱“需求感”的方式，是从内在满足自己的需求。\n\
  \n你可以通过付出来感受自己的重要性。你也可以通过成长和贡献来确信自己走在正确的轨道上。\n\n这个策略在理论上很完美，但还缺少一个特殊的要素。情境通常分为四种类型：双赢、我贏你输、你赢我输、以及双输。\n\
  \n通过付出，我们确保对方获胜。这可能是一种“你赢我输”或“双赢”的局面。人生中应该追求的最优情境是双赢。这符合所有人的利益，因为如果你生活在富足之中，你就能从你所拥有的中给予更多。创造双赢局面的最佳沟通策略是**坚定自信的沟通**。\n\
  \n### 坚定自信的沟通\n\n无论我们多么顾及他人的利益，我们的任务始终是达成互惠互利的结论。\n\n顺从型沟通者几乎不考虑自己的利益。他们倾向于认为自己的意见无关紧要，并顺从地去服务他人的利益。一个顺从的人几乎从不谈判，且轻易放弃。\n\
  \n攻击型沟通者只关心自己的利益，甚至不惜牺牲他人的利益。没有多少人喜欢攻击性行为。攻击性往往会在他人身上触发防御机制，从而终止谈判。\n\n我们想要在追求自身利益的同时，也顾及他人利益，在这两者之间找到一种平衡的沟通方式。这就是坚定自信沟通的基本理念。如果你能进行坚定自信的沟通，你就是在为双赢而努力。\n\
  \n要进行坚定自信的沟通，你必须相信自己的信息是重要的，并且你的利益必须是清晰的。这本身就是一项挑战，因为很多人根本不知道自己在生活中想要什么。这就是为什么他们会转向操纵式的谈判技巧。\n\
  \n坚定自信的沟通意味着一定程度的**脆弱性**。我们表达自己的观点，并对讨论持开放态度，而不试图说服任何人我们的观点在任何方面都更优越。我们的目标是达成一个结论，这个结论通常位于你的理想结果和对方的理想结果之间的某个中点。一旦双方意识到共同利益，彼此就能产生共鸣，从而达成结论。\n\
  \n通常，理解感受比弄清事实更重要。我们总是在不经意间简化或曲解彼此的信息。因此，练习积极倾听至关重要。很多人在讨论中并非真正参与，而只是在等待轮到自己发言。我们的目标是理解对方，并传达出“你的信息已被听见”的信号。\n\
  \n### 说明\n\n不理解他人的主要原因在于忽视了他们的感受。一个让你变得更有同理心的简单方法，就是把他人的感受当作事实来对待。\n\n“安迪说他感到被冒犯了，因为你没有在\
  \ 5 分钟内回复他。”这是一个真实陈述。在数理逻辑中，这被认为是一个“具体化陈述”。这类陈述应被视作我们知识库中的断言。\n\n接受他人的感受作为事实，并不意味着你必须同意他们。这仅仅意味着你在考虑自己的行动时，必须将这些感受当作事实来考量。\n\
  \n为鼓励讨论，请多使用停顿；并确保在停顿之前，你的话语以**降调**结尾。这就是“**爆发与停顿**”技巧。你像爆发一样说出你的观点；然后停下来，让对方消化你的信息。或者，你的谈话伙伴可能会有问题，你可以回答。专业钢琴家兼作曲家阿图尔·施纳贝尔曾说过：“我处理的音符并不比许多钢琴家高明。但音符之间的停顿——啊，那才是艺术所在。”\n\
  \n当你阅读到这里时，可能会好奇为什么降调很重要。首先，这让你听起来更成熟。其次，如果你以升调结束话语，你的谈话伙伴永远不知道你什么时候说完了。\n\n在沟通时，其他人正忙于他们内心的独白。我们可以通过积极倾听来了解这些独白的要素。我们可以弄清楚他人对我们的看法。下一步则是弄清楚对方想要什么。\n\
  \n\n\n### 注意\n\n内部叙述的结构被认为是一个高级话题。网络营销人员、文案撰写者、专业成交者和销售人员被迫学习逆向解析人们的内部叙述来完成工作。软件开发人员没有这种特权。请记住，一个人神经质程度越高，就越少听你所说的话，而更多听他们自己想听的话。例如，一个有自恋型人格障碍的人可能会将与自身理想化形象相矛盾的每一句话视为人身攻击，或者如果他们没有认真对待你的意见，就可能直接拒绝听取和理解你的信息。\n\
  \n在加薪的情况下，我们的贡献就是我们销售的产品。外部存在一个市场，即你的公司为解决有意义的问题所需的技能组合。专注于如何为你的市场提供最好的产品，你的价值就会提升。这就是*产品/市场契合*背后的理念。理解你公司的需求，理解你能够提供的服务，并确保你的雇主理解你如何能为公司服务。\n\
  \n确定如何在日常工作中让你的经理脱颖而出也很重要。始终确保你考虑到他们的利益；否则，在任何谈判过程中你都会遇到隐藏的障碍。\n\n在某些情况下，你的同事或经理可能会与你发生长期冲突。在组织中争夺权力并不罕见。我倾向于说，本质上这类组织不值得为之工作。然而，你可能处于无法挑剔工作机会的境地。在这种情况下，自信坚定往往是正确的做法。考虑对方的利益。通过自信坚定，你可能会发现，即使有人最初想解雇你，也可能存在解决方案。\n\
  \n即使在持久的利益冲突情况下，也有办法达成双赢的结论。通常，你的任务是扩展讨论的范围，找到你们双方都认同的东西。例如，你们双方都希望公司成功。如果你们能在某些方面达成一致，使公司更加成功，你们之间就会开始建立融洽的关系；最终，你们将能够足够好地理解彼此，从而在解决更大冲突方面进行合作。\n\
  \n这个过程的一个副作用是，其他人会将你视为一个足够成熟、可以合作的人。这种态度将为你打开机遇之门。\n\n始终追求双赢的局面。在我的职业生涯中，曾有过这样的情况：在一个技术决策上，常识站在我这边，但我的两位同事不理解我提出的解决方案的好处。鉴于我的经理总体上对技术一无所知，我是唯一完全理解这个决策影响的人。\n\
  \n后来，我的经理坦言，她曾考虑解雇我，因为我觉得我比较难以对付，因为我坚持己见，似乎也合作得不够好。如果我当时使用了自信果断的沟通方式，她就不会有解雇我的困扰。我没有尝试考虑其他人的意见并理解他们的动机，而是想当然地认为我的建议更好。\n\
  \n我后来才回想起来，我的经理考虑解雇我的原因之一是我的一位同事开始抱怨我。运用一些同理心，我同事的动机或多或少是可以理解的。我没有给他留下任何表达意见的空间。他对未来的看法是，他认为我是一个专横的人，并认为他会因此更难脱颖而出。\n\
  \n像这样的错误教会了我自信果断的沟通有多么重要。我们本可以私下讨论两种意见，我本可以通过提问和积极倾听他对此问题的看法来指导我的同事找到正确的方法。这样，他自己就能推导出他的建议长期来看会适得其反。我们的决定本不会导致任何冲突。\n\
  \n后来，我设法消除了与这位同事的冲突，并为我当时的行为方式道了歉。我还告诉他，我考虑的是公司的利益，绝无意损害他的声誉。最终，我确保我们为未来的合作建立了共同基础，并且在他对任何事情感到不满时，我为他打开了反馈的渠道。我让他感到自己被重视，并让他参与所有重要的讨论。作为交换，我赢得了一个盟友。\n\
  \n自信坚定是消除障碍的一个非常重要的工具。你可能认为自己的工作做得非常出色，但有些人有其他利益。发现这些利益，并确保你不得罪他人，这与做好本职工作同样重要。\n\
  \n自信果断的沟通包括说“不”的行为。我读过的最好的一本关于自信沟通的书是曼纽尔·J·史密斯的《当我说不时，我感到内疚》。^(⁴⁴)\n\n戴尔·卡内基建议尽可能避免长时间的冲突。然而，自信坚定要求你时不时地与他人发生冲突。如果你不具备有效解决冲突的技能，这些冲突可能会失控。当冲突失控时，自信果断的方法很容易变成攻击。因此，学习一些处理冲突的技巧是值得的。\n\
  \n\n\n### 非暴力沟通\n\n解决冲突的技能非常有价值，前提是你不是一个毫无实际益处却持续引发冲突的人。通常，冲突在浮出水面之前就可以被避免。\n\n\
  在捍卫你的观点时，有些冲突是重要的。然而，许多冲突都可以通过社交智慧来避免。\n\n马歇尔·卢森堡在非暴力沟通方面的研究^(⁴⁵)让你能够以一种最大程度减少冲突的方式表达自己。这个过程包含以下部分：\n\
  \n1. 观察\n2. 感受\n3. 需要\n4. 请求\n\n首先，进行一些观察。你可以观察任何困扰你的事情，包括流程中的缺陷或让你不满意的回复。例如，有人没有回应你的请求，这就可以作为一个观察。\n\
  \n第二步是表达你的感受。在这个例子中，你传达的自然感受是感到被忽视。\n\n感受会触发需要。在第三步，你应该能够表达出你的需要是不想感到被忽视。\n\n最后，你以一个请求来结束这个过程。例如：“你能花几分钟和我一起想办法，让我们合作得更顺畅吗？”\n\
  \n- 让我们把整个信息整合起来：“萨姆，我很困扰，因为我发现我的问题常常要等好几天才能收到回复。这让我感到被忽视。我需要更快的回复才能在你负责的项目上支持你。因此，你能花几分钟和我一起想办法，让我们合作得更顺畅吗？”\n\
  \n将这种方法与这样说进行比较：“你总是忽视我！我现在就要答案！”判断哪种说法更能让你愿意合作。\n\n尽管非暴力沟通有其适用场景，但有时会感觉有点刻意。尤其在表达你的需要时，有时需要由上下文暗示出来，而其他时候则可能显得有些做作。对我来说，最有效的公式是，当我把我的需要与对方满足我需求后能享受到的益处联系起来时。\n\
  \n让我们用另一个例子来结束这一部分。想象你在一个地中海国家工作，室外温度是 35 摄氏度，但空调却开到 18 摄氏度。冷风正直接吹到你的脸上。其他人在寒冷中感觉很舒适，但你却不。你该怎么办？\n\
  \n我注意到空调的冷风吹到了我的脸上（观察），这让我感到非常不舒服，因为我怕着凉（感受）。我希望在工作场所感到舒适（需要）；因此，我们能否商量一个既让你感觉舒适、温度又更高一些的设定？\n\
  \n你会惊讶地发现，仅仅因为一些幼稚的争吵，比如关于开窗的争执、指责别人说话太大声、或者对室温的意见不一致，你就能轻易失去加薪的机会。一旦争论变得激烈，其他人可能会开始阻挠你的进展。\n\
  \n#### 练习\n\n1. 通过以一种自信的方式表达你的观点来测试自己。首先，从工作场所以外低压力的环境开始，以此积累动力。然后，在你能创造互惠互利结果的情境中开始阐述观点。\n\
  \n2. 在对话过程中，留意“爆发与停顿”的技巧。倾听对方想要说话或提问的线索。\n\n3. 回想一下过去你让经理难堪时所犯的错误。总结出未来如何避免这些错误的结论。\n\
  \n4. 你在工作场所中经常遇到哪些冲突？你能做些什么来解决或预防这些冲突？\n\n## 成为不可或缺的人\n\n**本节目标：**\n\n- 定义你的职业标准。\n\
  - 区分技能、知识和行动。\n- 摆脱对时间估算的恐惧，学习如何更准确地估算你的任务。\n- 学习专业人士如何进行谈判。\n- 了解操纵和吹嘘如何阻碍你的职业发展，而隐性影响如何帮助你。\n\
  \n在前几章中，我们已经奠定了专业精神的基础。无论是沟通、职业道德、学习计划，还是说“不”的能力，强大的意志力是专业人士的特征。\n\n当业余者似乎失去动力时，专业人士仍然可靠地尽力而为。专业人士不是随机行动，而是养成习惯。专业人士的日常习惯能提高效率，最大化精力，他们几乎总是看起来准备好做任何工作。\n\
  \n尽管专业人士有很高的标准，但他们并非完美主义者。专业人士确切地知道工作质量何时达到自己的标准。\n\n专业精神是你最重要的资产之一。你对自己的工作感觉会更好，其他人也会更认真地对待你。\n\
  \n### 注解\n\n关于“成为不可或缺的人”这个术语的一些说明。一些企业员工倾向于通过守护专有技术和拒绝指导他人来保护自己。这样，他们就成为了一个单点故障（SPOF），从而为自己创造了谈判筹码。我不鼓励这种行为，因为它在操纵部分中提到了缺点。根据我们的定义，成为不可或缺的人意味着你增加的价值如此之大，以至于替换你是不划算的。根据我的主观估计，愿意选择这条路的人并不多；因此，在这个意义上，成为不可或缺的人比你想象的要容易。\n\
  \n如果人们认真对待你，你在谈判桌上会轻松得多。你要么获得更多支持，要么更容易找到另一份工作。\n\n\n\n### 确立标准并坚持执行\n\n专业人士为何备受重视？首先，专业人士不为工作找借口，而是为其负责。其次，专业人士内心有一套质量标准。业余人士只会听从他人指令行事，而专业人士则遵循自己的质量标准行事。\n\
  \n专业人士倾向于承担经过计算的风险。业余人士害怕被解雇，而专业人士则被期望能坦率建言，无论其建议是否受欢迎。换言之，专业人士的观点不取决于他人的期待。\n\n\
  假设一位业余人士和一位专业人士被要求在三个月内完成一个项目，而两人都知道，要做出专业的解决方案至少需要九个月。\n\n业余人士承诺会尽全力。在管理者的认知里，\"\
  尽全力\"意味着责任现在落在了开发团队身上，并且他们承诺在三个月内完成项目。\n\n在其著作 *《代码整洁之道：程序员的职业素养》* ^((46)) 中，罗伯特·C·马丁指出，最好的决策来自于对立角色之间的交锋。这意味着，作为专业人士，你有责任保持坚定立场，避免屈服于不负责任管理者的策略。\n\
  \n*《代码整洁之道》* 是对此前提到的《当我说不时，我感到内疚》一书的绝佳补充。*《代码整洁之道》* 将坚定自信的原则置于软件开发的具体情境中。\n\n当不专业的开发者说\"\
  好吧，我试试\"时，他们常常想成为当天的英雄。这是一个永远无法实现的梦想。成为英雄是专业精神的副产品。不专业的工作不会得到赞扬，即使你通过低质量代码赶上了截止日期。\n\
  \n在自信和自尊方面，专业人士不需要任何庆祝。专业人士倾向于从内心获取自我价值。\n\n如果有人不惜交付不专业的解决方案也要成为英雄，这很可能是一种过度补偿行为，源于因缺乏专业精神而导致的自尊缺失。\n\
  \n你的自尊会随着你按照自身价值观行事而增长。价值观是你所专注的东西。这就是为什么交付不专业的解决方案或说\"好吧，我试试\"这类话对你的自尊非常危险。\n\n\
  在某些情况下，专业人士做好了被解雇的准备。在另一些情况下，专业人士会在被解雇之前主动辞职。\n\n你必须认清在哪些情况下开启谈判才有意义。如果你的管理者派你执行不可能完成的任务，并且他们不尊重你的意见，那么你除了另谋高就别无选择。想想看。如果你说不，总会有业余人士自愿接下这份工作。如果你说是，最终，你的管理者会认为工作质量低下的原因是你能力不足。在这种情况下，准备好辞职，找一份更好的工作，一份专业人士能受到尊重的工作。\n\
  \n如果你承诺在余下的职业生涯中成为一名专业人士，那么当你想要改变时，你总会有选择。换句话说，你将有能力持不同意见，并离开专横的雇主。\n\n### 不要陷入防御心态\n\
  \n在我们的文化中，我们常常将专业精神与无所不知混为一谈。我个人向来反对过分强调词汇性知识。这就是为什么我经常在技术面试中让许多应聘者感到惊讶。\n\n例如，有一次我设计了一套招聘流程来招聘优秀的软件开发人员。第一步是一项测试。这项测试的惊人之处在于，分数并非我主要关注的点。我更关注的是应聘者如何完成测试。\n\
  \n我可以看到应聘者在一个选择题上花了多少时间。十道题中有三道题需要在实践中展示解决问题的能力。大多数人这些题都答错了。\n\n剩下的七道选择题是为了减缓开发人员的速度。如果他们知道如何作答，他们只需花一分钟理解问题并选出正确答案。如果他们知道如何用谷歌搜索答案，则需要\
  \ 1.5 到 2 分钟。如果他们不知道搜索什么，甚至可能会花上 5 分钟。\n\n那些在十道多选题上花费 40 分钟的人，只剩下 20 分钟来完成编程任务。那些在选择题上花费\
  \ 15 分钟的人，则有 45 分钟。\n\n编程任务并非标准题型，无法在 `Codility`、`HackerRank` 或 `LeetCode` 上找到。因此，谷歌搜索解决方案并没有太大用处。我再次考察的是实际解决问题能力。\n\
  \n我还可以回放他们得出结论的过程。有些人代码结构良好，但未能将所有碎片拼凑起来。他们仍然进入了下一轮筛选。另一些人完成了任务，但耗时很长，代码也一团糟。我没有邀请他们面试。\n\
  \n有趣的是，这一步完全淘汰了那些试图伪装成自己并不擅长之事的开发者。这一步之后，后续面试的成功率大幅提升。从那以后，我们再也不用在试用期解雇任何人。\n\n\
  在面试环境中，专注于技能的运用而非死记硬背知识点会带来回报。\n\n专业精神源于基于经验和常识解决专业问题的能力。如果你在某个领域能力不足，重新学习相关知识是完全没问题的。人们会逐渐习惯你观点的份量，并知道有时你需要做研究才能形成可靠的意见。\n\
  \n尽管词汇性知识不会让你成为专业人士，但它仍能助你前进。大多数专业人士都具备好奇心这一品质。专业人士倾向于查漏补缺，填补自己的知识空白。专业人士每周都会花数小时学习。建立词汇性知识是专业精神的副产品。\n\
  \n我们大脑的工作方式是，我们对某个主题了解得越多，就能建立越多关联。我们运用的关联越多，解决问题的能力就越强。拥有良好解决问题能力的人，往往拥有高于平均水平的词汇性知识。\n\
  \n只扩展词汇性知识而不付诸实践几乎毫无用处。这就是为什么我鼓励你将想法付诸行动，在实践中学习。这样你的大脑中会建立更多的关联。\n\n\n\n### 时间预估的心理学\n\
  \n大多数人害怕预估完成一项任务所需的时间。这种恐惧的原因之一是*地位焦虑*，即依赖他人的看法。我们的超我会告诉我们，给出时间预估是危险的。\n\n在我们恐惧中，一旦错过了截止日期，我们就会被认为不太可靠。表面上，未能按时完成任务显得非常不专业。我们内心的批评者会开始责备我们拖延。最终，在宣布截止日期时，你甚至真的会感到身体上的疼痛。\n\
  \n你有机会直面这种恐惧，并转变对截止日期的思维方式。\n\n让我们探索一下截止日期（deadline）这个神话。首先，问题在于这个词本身就包含“死亡”（dead）。这是一个充满负面能量的词，听起来也极其严肃。我几乎不用这个词，即使在协调重要里程碑时也是如此。然而，对于这个词本身我们能做的并不多；它是英语语言的一部分。\n\
  \n我通常建议使用*目标日期*这个短语。它不仅听起来更柔和，而且还强调了它只是一个目标。换句话说，如果发生意外情况，目标日期是可以调整的。\n\n我也确实会用“截止日期”这个词来强调关键任务。例如，如果客户要求我们在两周内完成一项任务，而他们可能会因此放弃合作，导致我所在的公司损失相当于我年薪\
  \ 100 倍的金额，那么确保我们传达了情况的严重性就是值得的。只要你谨慎使用“截止日期”这个词，其他人会尽力而为，并且他们也会支持你。\n\n说到预估，专业人士会做出最佳情况、一般情况和最坏情况的预估。根据业务方的反应，我们的沟通方式也应相应调整。例如，如果他们只关注最佳情况，你有责任告知他们，最佳情况并非有约束力的预估。如果他们要求你尽力而为，就要明确说明“尽力而为”是我们的默认行为。\n\
  \n始终检查所有依赖关系；合理地规划你的任务。在目标日期上加入容错空间。当事情可能出错时，它往往就会出错。\n\n计算容错对于处理意外情况是必要的。专业性体现在一种良好的直觉，能在时间预估中植入容错因子。这种容错是不可协商的。如果你说“尽力而为”并消除了这个容错因子，那么一旦出现任何意外情况，你都将危及项目的交付。这种态度并非合作，而是非常不专业的。\n\
  \n如果你的雇主说需要修改你的预估以让你更早完成，你最好的选择是开始协商可交付成果的范围。\n\n缩减范围也出现在《代码整洁之道》中。Robert C. Martin\
  \ 强调了争取最佳结果的重要性。当提出不可能的要求时，可以按时、在预算内部署一部分功能子集，并满足你的质量标准。\n\n如果重新划定范围仍无法达成一致，你最后的办法是开始构建技术债务，同时协商如何偿还这笔债务。技术债务是指在可维护性方面质量较低的解决方案。直白地说，这就是软件开发人员所谓的“黑客技巧”。不过，要确保在协商中管理好软件的整个生命周期。当你决定构建技术债务时，务必在承担之前也协商好偿还计划。否则，业务方会把构建技术债务视为捷径，并可能轻易迫使你妥协，直到你的应用在可维护性方面“破产”。\n\
  \n运用上一节的术语，争取最佳结果是一种自信的行为。你信息的力量来源于高度的自尊。你知道你的信息很重要，并且你不愿与自己的价值观发生冲突。\n\n如果你的雇主强制你接受不合理的截止日期，请务必提升自己，以便能够尽快辞职。\n\
  \n不健康的时限压力会损害你的工作质量和生活质量。这可能导致你需要通过治疗、教练辅导、成瘾行为或娱乐活动来补偿这种压力，而这些可能会抵消你在有毒环境中获得的任何薪资收益。不要最终把钱花在人为修复不健康雇佣关系造成的损害上。\n\
  \n### 专业精神与协商\n\n你的行动应该体现专业精神，而不是你关于自己的声明。如果你穿着一件印有“无需证明”的 T 恤，那你就是在试图证明你无需证明。这是一个矛盾。使用“我是专业人士”这样的说法，恰恰说明你不太确定你的雇主是否认为你是专业人士，很可能你并不是真正的专业人士。因此，是你的标准在说明你是否专业。\n\
  \n换句话说，寻求合作，而非竞争。如果你向雇主展示采纳你的标准对他们有什么好处，他们会更加开放和感激。\n\n### 选择正确的工作任务\n\n假设你可以在简单任务和困难任务之间选择。你的经理对这些任务的难度一无所知，他只看到你完成的任务数量。你会更愿意选择简单任务还是困难任务？为什么？\n\
  \n当人们被观察时，他们往往想脱颖而出。结果，许多人宁愿选择短平快的任务，也不愿选择困难且耗时的任务，因为他们发现，通往成功的道路在于“单位时间解决问题数量”这个关键绩效指标（KPI）。\n\
  \n在大多数情况下，这确实是一个 KPI，但仅仅是用来避免被解雇的。要想获得晋升，你必须以另一种方式做出改变。\n\n许多人就像本文这样，转向博客和培训材料，寻找“圣杯”，希望借助各种框架和说辞在职场步步高升。网络营销人员也发现了这一趋势，并用有趣的比喻向你推销产品。不幸的是，有更多人举手购买那些能提升生产力、绩效、赚钱能力等的“神奇药丸”。购买神奇药丸无异于花钱买一个与不劳而获的成功相关的虚幻梦想。\n\
  \n希望到现在，你已经明白神奇药丸并不存在，因为成功不应该是轻而易举、一蹴而就的。你的成就并不会让你快乐。让你或非常快乐或非常悲伤的是你在过程中变成了什么样的人。旅程本身就是成功不可或缺的一部分，因此任何神奇的捷径都只是欺骗和自欺欺人的方式。\n\
  \n网络营销人员倾向于向你兜售问题的简单解决方案，而简单解决方案本就不该存在。大多数人真正需要的“神奇药丸”是承担责任。这是一个令人不舒服的真相；因此，这个建议只在特定的细分市场有效。\n\
  \n这个建议也适用于你应该选择简单任务还是困难任务的问题。没有绝对正确或错误的答案。显然，满足你被雇佣来执行的 KPI 很重要。除此之外，更困难的任务可能会提升你的技能和未来的赚钱能力。\n\
  \n短期内，选择策略来达成你的 KPI 可能会影响别人对你的看法。长期来看，通过走艰难的道路，应对无人敢触碰的挑战，你会获得更多的回报。其他人可能通过花招、权谋手段和操纵暂时获得好位置；但从长远来看，这些技巧是自我毁灭的。因此，避免操纵是明智的职业选择。\n\
  \n\n\n### 防范操纵\n\n操纵是为达成自身目标，刻意在他人心中塑造自身形象的行为。操纵手段往往流于表面，它们索求额外价值，却从不给予回报。\n\n>\
  \ **注意**  \n> 自恋型人格障碍者关注的是他人如何看待自己，而非如何行善。这正是自恋者在职场中危险的原因。他们表面上显得有用，实则利用同事无意识的帮助来实现自身意图。被自恋者招募并操纵的人被称为*代理人*。代理人通常不知道自己在支持自恋者的隐秘议程，他们只是按照自身的价值观或标准行事。\n\
  \n代理员工的工作方式如同代理服务器。我们可能以为是在与代理人互动，但实际上是在与自恋者打交道。\n\n虽然耍弄操纵手段对自身并无益处，但能够防范操纵者却大有益处。识别他人的操纵企图至关重要。\n\
  \n> **注意**  \n> 避免与操纵者进行情感交流，因为这种交流的性质往往会消耗你的能量。操纵源于情感财富的贫瘠。当情感富足者与情感匮乏者交换情感时，结果通常对操纵者有利，而牺牲另一方的利益。\n\
  \n操纵者的兴趣在于实行双重标准，并将事情保持模糊状态。即使你是他们的直线经理，操纵者也会要求你遵守严格的标准。同时，操纵者对自己却采用另一套标准。\n\n>\
  \ **注意**  \n> 防范操纵最简单的方法是将所有决策以书面形式记录，不给创造性解读留下空间。如同软件一样，事实和定义明确的验收标准不会给不良解读留下余地。\n\
  \n不同的社会体系对操纵的容忍度不同。例如，比较美国和德国，美国的雇佣法赋予雇主更多权利，而在德国，雇员往往拥有更多权利。在一些国家，解雇持有无固定期限合同的员工是违法的。在一些国家，劳资委员会成员受到保护，超过一定规模的公司依法必须设立劳资委员会。在某些环境中，有可能加固自身地位，以至于可以从事掠夺性活动，劫持企业系统以谋取私利。这种现象在初创公司和大型企业中都有可能发生，尽管在初创公司中较少见。当你遇到一个似乎劫持了系统的人时，务必保护好自己。\n\
  \n我曾经有一个客户，他被一位高管要求监视其他人。这位高管间接暗示，如果他想留在公司就别无选择。幸运的是，他现在已在一家不同的公司担任了更好的职位。\n\n在学会如何保护自己免受操纵实体侵害后，你可能会问：加入“黑暗面”是否值得。尽管这个问题会打开潘多拉魔盒，引发关于“艺术”这一模糊术语的哲学辩论，但我可以用一个词概括我的总体观点：不值得。\n\
  \n加入“黑暗面”的问题在于，你会变得容易受到人格扭曲的影响，而你可能对此毫无准备。操纵源于匮乏。匮乏源于需求。需求源于未被满足的需要。有未被满足需求的人不知道如何从内心满足这些需求。这会导致自尊降低和痛苦。\n\
  \n当别人试图操纵你或以牺牲你来为自己获取资源时，你可能会感到不安、愤怒、沮丧或怨恨。我曾有同样的感受，直到我意识到这些人只是在受苦，因为他们还没有找到更有效的方式来满足自己的需求。世上没有绝对的好人或坏人，因为这些概念是相对的。\n\
  \n在我开始探索 IFS（内在家庭系统）疗法背后的基本原理后，我意识到有一种思维模式帮助我理解了那些过去在我看来是负面的意图。我现在使用的思维模式是：每个行动都有其积极的意图。一个人操纵行为背后的积极意图往往是出于保护，因为对他来说，某种威胁是真实存在的。大多数人经历过创伤事件，而创伤储存在我们的身体里。如果你对这个话题感兴趣，我推荐的最好的书是《身体从未忘记：创伤疗愈中的大脑、心智和身体》。^(⁴⁷)\n\
  \n如果你想避免扭曲自己的认知，最佳的防御就是为自己的处境负责，做正确的事，避免通过操纵他人来获取想要的东西。这并不意味着你不应该学习系统是如何运作的，因为玩好游戏以增加你的效用不仅对你自己有益，也对系统有益。聪明不会扭曲你的认知。为了私利劫持系统才会。\n\
  \n操纵的另一个问题是，一个值得为之效力的公司，其员工是聪明且富有经验的。\n\n> **注意**  \n> 如果某人值得你留下深刻印象，那么他们很可能能看穿你试图打动他们的企图。这就是显性影响往往失败的原因。你要么打动了错误的目标，要么试图打动一个能看穿你每一次尝试的人。\n\
  \n你曾和那些总在担心自己形象的人共事过吗？识别这些人最简单的方法就是看他们是否缺乏倾听能力。当你说话时，他们不是在听你说话，而是在听自己内心的独白：“难道你看不出我是最好的吗？难道不明显吗，我该为此得到奖赏？难道你看不出我又解决了一个难题？难道你看不出我正在指导同事？我是不是应该每天把这些话再重复五遍，好让你最终奖赏我？”\
  \ 如果你和这样的人共事了一段时间，你会提拔他，还是宁愿解雇他？\n\n通过使用显性影响，你面临失去他人信任的风险，也面临着损害自身自尊的风险。你的直线经理可能会开始质疑你的诚信。\n\
  \n### 隐性影响\n\n大多数人都能察觉到操纵者的存在，而操纵者很少能长久立足。让我们转而关注积极的榜样吧。你是否曾有过非常受欢迎的同事，他们不仅专业，还能在恰当的时机说出恰当的话？\n\
  \n这些同事无意识地运用了隐性影响。隐性影响是指你通过自身的品格、创造价值以及拥有值得信赖的观点来影响他人。隐性影响者之所以被信任，是因为他们甚至没有试图去影响你。影响仅仅是他们行为的一个副产品。\n\
  \n在没有增加价值的情况下要求加薪，可能会断送你未来的路。在尊重自身价值观和标准的同时追求职业目标，这是一项其他人通常会支持的追求。\n\n隐性影响并非一夜之间就能学会。但努力提升增加你职业魅力的因素，仍然是可行的。\n\
  \n\n\n### 注意\n\n隐性影响力的另一个说法是叙事影响力。这是因为叙事影响力会让他人在心中对你形成一种内在的叙事。叙事影响力能让你的行为替你发声，而不是你自我吹嘘。\n\
  \n以下清单将帮助你培养隐性影响力：\n\n1.  接纳真实的自己。排除操控性行为，并摒弃脑海中所有关于“为了显得比现在的自己更好而必须做什么”的规则。\n2.\
  \  练习表达你的观点。能够清楚地表达观点，让他人愿意倾听。你的观点不应取决于他人想听什么，而应基于你最好的判断。始终应用有效沟通的所有原则，并避免引发负面情绪的争论。\n\
  3.  通过从错误中学习，定期提升你的沟通技巧。培养同理心。留意你与他人交谈时，对方的感受。\n4.  积累专业知识。你的观点不仅要有良好的表达，还要有实质内容。\n\
  5.  乐于以专业方式解决问题。无论问题领域为何，解决问题的能力都非常宝贵。\n\n要想变得引人注目，你必须决定是走显性影响力之路还是隐性影响力之路。在展示技能与保持低调之间，存在一种天然的矛盾。\n\
  \n引人注目是你行动价值的自然结果。如果你处理重要事务，他人就会愿意与你合作，从而形成积极的内在叙事。\n\n#### 练习\n\n1.  写下你工作日的日常安排。\n\
  2.  对你的日常安排进行微小的、渐进式的调整，以制定一个让你能专业表现的时间表。哪些改变能提升你的精力和注意力？\n3.  定义你的质量标准。\n4.  如果因外界压力不得不降低质量标准，你会怎么做？在这些情况下，你如何进行沟通？\n\
  5.  回想那些你感觉自己行为不够专业的时刻。那让你感觉如何？是什么恐惧导致你做出了妥协？\n6.  想三个场景，在这些场景中，你自己的质量标准会让你无法认同雇主的的标准。\n\
  7.  对截止日期或目标日期估算，你感觉如何？如果你发现任何由限制性信念引起的不良情绪，请使用 `ABCDE` 方法将其消除。\n8.  你未来 12 个月有哪些学习目标？哪些技能能让你成为更专业的行家？\n\
  9.  你在职场上的主要优势是什么？你定期采取哪些行动来发挥这些优势？他人对你的行动有何反应？\n\n## 给予和接收反馈\n\n**本节目标：**\n\n-\
  \   了解反馈为何重要。\n-   让自己更从容地应对负面反馈。\n-   学习如何给予和接收一针见血的反馈。\n-   考虑承担额外任务以加速进步。\n-\
  \   学习如何应对建设性与破坏性的批评。\n\n一方面，你必须交出卓越的工作成果。另一方面，吹嘘自己做的事又会导致显性影响力。此外，做了难以被注意的事，却对自己的成就过于谦虚，最终必然会得到一个平庸的绩效评估。\n\
  \n许多企业环境倾向于采用绩效评级系统。由于大规模追踪员工绩效很困难，绩效评级通过给每位员工贴标签简化了这项任务。在某些系统中，表现优秀和表现不佳的标签有固定的分配比例。这导致了一场不光彩的争夺，即必须将一些“表现不佳”的标签分配给那些根本无法接受的人。\n\
  \n一些科技巨头倾向于通过自动将绩效垫底的 10%员工列入绩效评估来制造竞争。其他公司则只是给一部分员工贴上“有待发展”的标签，这让他们感到被低估。采用此标准的公司并不在乎这种标签造成的伤害，因为接下来可能发生两件事中的一件：员工要么努力增加更多价值，要么选择离职。\n\
  \n不幸的是，在现实生活中，情况要复杂一些，因为生活总会干扰巅峰表现。我们的人生都有起有落。失去亲人、分手或健康问题都可能对我们的表现产生暂时的负面影响。有时，我们的经理甚至不了解原因。\n\
  \n没有什么比给一位技术高超、但却未能充分发挥其应有技能的软件开发人员打出糟糕的评级更糟糕的事了。有一次，我试图找到一些合理化理由，用可以在董事会面前辩护的客观原因来保护这位开发人员，而董事会会对将某人归入某一类别的每个理由提出质疑。就在那时，我陷入了困境，因为我对这位开发人员在做什么几乎毫不知情。缺少必要的最低限度的反馈文件，因为这位开发人员没有为自己的绩效提供任何说明。\n\
  \n我从这位开发人员的一些同事那里收集了反馈，以确保我的评级没有犯重大错误。然后，我开始应用我在约束逻辑规划方面的经验，将那些令人生畏的标签分配给一些开发人员。\n\
  \n结果发现，那些建立反馈循环并确保其他人了解他们工作内容的人，其绩效表现好于那些不关心自我评估文档的人。在每一个案例中，他们的同事都给了我褒贬不一的评价。一个常见的建设性批评模式浮出水面：缺乏透明度。\n\
  \n### 注意\n\n正直，在于根据工作中的专业准则，始终如一地执行任务。你做一件事的方式，就是你做所有事情的方式。如果你在自我评估上敷衍了事，你很可能在工作中的其他方面也在敷衍。\n\
  \n让你的行动以自然的方式引发他人心中的积极想法。这就是隐性影响力。多走一里路，基于常理思考你的任务，并始终思考如何变得更高效。\n\n谈论专业、高标准和高效是显性的，也是人为的。展示这些高标准、承担比别人更多的任务、用技巧提升自己的效率，则是隐性的。\n\
  \n正确运用隐性影响力会带来更多的信任和更好的合作。这就是你希望在本节达到的全部目标。确保你的行动确实是隐性的，而不是操控性的。\n\n当他人开始将你视为在某方面做得好的榜样时，你就知道你已经成功了。随着你的成长和做出改变，人们自然会倾向于赞美你。\n\
  \n\n\n### 在正确的时间做正确的事\n\n假设你的公司出现了一个紧急情况，但你非但没有去处理这个紧急情况，反而在想一个能让你的团队工作更高效的绝妙主意。\n\
  \n尽管你首先注意到了这个紧急情况，你却让初级员工去接手处理。这导致了额外的 2 小时停机时间。\n\n一天后，当你的主管还在忙着沟通这个紧急情况时，你向他展示了你那个绝妙的主意。你的想法确实能为重复性任务每月节省数千欧元的工资成本。然而，公司却因为停机的连锁反应损失了\
  \ 2 万欧元。你的努力会被如何看待呢？\n\n这个例子是虚构的。在现实生活中，我听说过一个人，他对紧急情况的信号非常敏感。每当紧急情况即将发生时，他就会走开，去抽上一根长长的烟。\n\
  \n很多时候，员工并不擅长判断在特定时间点什么对企业是重要的。当他们自私地掌控并无视真正重要的事情时，灾难就可能发生。如果你发现了一个紧急情况，至少你应该向你的主管请教优先级。\n\
  \n### 注意\n\n在工作中承担更多责任的一种方法是变得更懂商业。为企业创造切实的价值比仅仅关注技术要困难得多。许多专业人士拒绝接受这种形式的责任，并逃避到“高效率拖延”的迷宫中，交付了无法变现的绝妙解决方案，因为业务在当时需要的是别的东西。拒绝商业头脑，你的赚钱潜力和效用也会因此受限。\n\
  \n我的客户杰森曾对金钱持有局限信念。他受不了听到关于商业头脑的事情。他认为，弄清楚如何利用他的努力来赚钱是商人的工作。\n\n杰森来找我，是因为他想从软件工程师的角色转型为软件架构师，并且正在寻找成长的方法。我问他是否喜欢他目前的工作环境，他的回答是明确的“是”。杰森热爱他的同事们，一想到要离开他们，他就感到难过。\n\
  \n然后，我请他找出一些他能够增加价值的业务需求。这就是我们卡住的地方。杰森拒绝考虑任何与业务相关的事情。他交付软件解决方案，但他不想听到关于钱的事。\n\n\
  作为他信念的自然结果，我问他是否乐于赚更多的钱。他说，如果他的经理看重他的贡献，他很乐意接受更多的钱。然而，他绝不会主动要求加薪，因为这会让他感到不舒服。\n\n\
  杰森显然对金钱有局限信念。在表面层面上，我可以帮助他，请他在公司里找一位能将他的技能与业务联系起来的导师。不幸的是，他过于害羞，不敢说出自己想要什么。\n\n\
  结果，他有两个选择：要么找一份责任更重大的新工作，要么经历一场情感上的转变，放下他对软件开发商业层面的局限信念。\n\n### 注意\n\n一种健康的`雇佣`关系是共生关系。作为组织的一员，员工能够比单打独斗赚到更多的钱。雇主为员工支付薪水也是有利可图的，因为员工的工作在短期或长期内都能转化为正向的财务回报。如果共生关系的任何一部分缺失了，雇佣关系就无法持续。\n\
  \n有些人天生对什么重要有出色的感知力；其他人则通过经验来学习。经验是通过反馈获得的。你的团队主管或你的经理就是你的客户。最终，公司是你团队的服务对象。你的职责是高效运作，以满足客户的需求和愿望。发现这些需求和渴望的唯一途径是建立定期的反馈。\n\
  \n为了让自己变得显眼，请把反馈纳入考虑。在正确的时间高效地做正确的事，是你能在职业生涯中取得领先地位的最重要的事情之一。\n\n### 将反馈作为谈判筹码\n\
  \n利用隐性影响力进行谈判很困难，有时甚至是不可能的。然而，我们总是可以建立在隐性影响力和反馈循环的优势之上。\n\n在谈判桌上，与其自吹自擂，不如利用你已经建立好的反馈循环。当你寻求反馈时，你听到的是经过修饰的、你经理内心叙事的呈现。定期的反馈循环能确保你了解哪些行动会带来真诚的积极反应。与其告诉你的经理你有多棒，不如直接去寻求反馈。\n\
  \n在定期建立反馈的情况下，如果你能记录下一些关于反馈内容和时间点痕迹，这会很有帮助。寻求改进建议，并逐个解决，这是一个强大的工具。如果你能善用反馈，你就会拥有一个持续改进的、有据可查的业绩记录。这个业绩记录比任何形式的显性影响力都珍贵一千倍。\n\
  \n最后要说的是，在谈判过程中，通常需要最低限度的显性影响力；否则，你如何能够坚定地为自己争取利益呢？如果对你的表现已经有了共识，那么使用显性影响力可能会很有成效。这意味着你对自己的评价已经存在于你经理的脑海中了。\n\
  \n反馈将成为你谈判更高薪水时，工具腰带中最重要的武器。反馈不仅是成为更优秀专业人士的必需品，也是一个绝佳工具，可以让你发现需要做什么才能在你当前的岗位上做出改变。\n\
  \n通过掌握提供专业反馈的基本原则来推动整个团队前进，你将成为一个更有价值的团队成员。你也会因为更善于与人打交道而受益。\n\n通过开放和持续的反馈所获得的信息价值，也将使谈判过程变得更加顺畅。\n\
  \n\n\n### 倡导开放的反馈文化\n\n健康的企业拥有开放的反馈文化。归根结底，成功的创始人明白，公司的成功直接取决于其员工。\n\n您可能会遇到所在公司似乎并不提倡开放和频繁的反馈的情况。没有反馈的后果相当严重。\n\
  \n即使一切顺利，大多数人也会形成自己内心的独白。人们可能会认为自己的工作不被重视、不被欣赏，或者自己做得很糟糕。有些人可能会无缘无故地担心被解雇。\n\n恐惧可能会导致人们戴上面具，隐藏自己意图和行动的某些方面。这些面具阻碍了顺畅的合作。你的面具隐藏了你了解但他人不知道的部分。\n\
  \n恐惧也会让人变得盲目，在某种意义上无法解读反馈。这与戴上面具相反。别人能看到你自己看不到的关于你的一些东西。\n\n最糟糕的一类包括你和你周围的人都不知道的某些行为和举动。这个未知的部分可能会在辩论和引发的情绪状态中浮出水面。\n\
  \n自我意识和开放的反馈文化可以减少所有这三类问题。交流反馈不仅能让你意识到自己经常犯的一些错误，还能帮助他人更多地了解你。\n\n一个著名的模型总结了上述认知层次：*乔哈里窗*。^(⁴⁸)\n\
  \n|   | 自己知道 | 自己不知道 |\n| --- | --- | --- |\n| 他人知道 | 开放区 | 盲区 |\n| 他人不知道 | 隐藏区\
  \ | 未知区 |\n\n你越是扩大开放区的面积，同时缩小其他三个区域，你作为专业人士的成长就会越好。\n\n反馈通常应该是一种权利，而不是一种责任。一个成功的公司不能承受与自我认知水平低下的员工共事，这些员工只会装点门面，让自己表现得与实际工作不符。\n\
  \n不幸的是，行使这项权利并不总是那么容易。有些公司似乎受到了“没有反馈就是好反馈”这一口头禅的影响。如果你所在公司的反馈文化不尽如人意，我建议采取以下行动计划：\n\
  \n1.  每当有人值得感谢时，经常说谢谢。\n2.  向你的同事提供反馈。\n3.  观察情况如何变化。\n4.  寻求针对性的、容易给出的反馈。\n5. \
  \ 养成与你的经理交流反馈的习惯。\n\n**说谢谢**，每当有人做了你认为有价值的、你欣赏的事情时，告诉他们为什么他们的努力对你很重要。\n\n**提供反馈。**培养付出的心态。用你希望别人对待你的方式来对待他人。你可能会发现，和你一样，其他人也可能缺少反馈。即使是你的经理也欣赏反馈。\n\
  \n为了避免造成伤害或让自己陷入恐慌区，请从正面反馈开始。\n\n**观察情况如何变化。**你的同事可能会更频繁地给你反馈。如果没有任何改变，并且人们被你的反馈吓到了，那么可能是你所在的公司有问题，或者你表达反馈的方式有问题。\n\
  \n**偶尔，寻求针对性的反馈。**一旦你完成了一个里程碑、一个项目或一项艰巨的任务，可以随时寻求反馈。你可以表明你真诚地希望改进工作，因此，对于如何提高效率的建议，你将不胜感激。\n\
  \n**养成与你的经理交流反馈的习惯。**如果在你的公司没有定期的反馈谈话，就果断地告诉你的领导你的需求。告诉他们，你很难应对缺乏定期反馈的情况，因为优化你任务的所有责任都在你身上。你确信，遵循他人的建议，你有些事情可以做得更好。\n\
  \n你越早达到这个阶段越好。我们的目标是建立定期的反馈谈话。想象一下，在一家没有反馈文化的公司工作一年。一旦你联系你的经理，说出“绩效评估”这个神奇的词，你的经理很可能会感到困惑。这很少是你谈钱的最佳时机。你希望处于一个强有力的位置。通往强有力位置的道路是通过持续的行动。如果你根据反馈中得到的要点进行改进，你最终会被公认为一个付出额外努力的人。\n\
  \n### 应对批评\n\n很多人会把负面反馈个人化。不要成为他们中的一员。你的目标是从各种形式的反馈中学习。\n\n每当你收到反馈时，总是问自己以下两个问题：\n\
  \n- 谁给了你反馈？\n- 你收到的反馈背后是什么意图？\n\n例如，如果一个你从未见过的醉汉告诉你他讨厌你，你一定对几件事非常确定。比如，这个人给你建议并不真诚。其次，他的意图很可能不是善意的。很可能他只是在第一个见到的人身上发泄自己的沮丧。因此，你可以安全地忽略他的意见。\n\
  \n同样，如果你的同事刚被解雇，他告诉你，是你的工作导致他无法完成自己的工作，这个说法也无法说明你的能力如何。然而，这一次，他的意见也起到了警示作用。\n\n\
  有两种类型的负面反馈：\n\n- 建设性批评\n- 破坏性批评\n\n建设性批评无非是指出你某项弱点的反馈，目的是让你在这一工作领域有所改进。\n\n破坏性批评是你收到的，因为有人要么感到沮丧，要么对你怀有恶意。破坏性批评的目的不是让你从中学习并改进工作，而是一种人身攻击。\n\
  \n在这两种情况下，都要尽可能多的进行过滤，少问问题，把反馈当作建设性的来处理。不要让你的情绪控制你的行动。你最不需要的就是因为破坏性批评而争论。\n\n如果你曾经以破坏性批评回应，或者开始争论，最终你会发现你并不比对方高明。因此，要从不同的角度来看待讨论。给你破坏性批评的人最终会发现他们无法与你对抗，因此，他们会停止批评你。\n\
  \n无论批评是建设性的还是破坏性的，你都必须过滤哪些适用于你，哪些不适用。你的兴趣在于尽可能多地了解反馈。\n\n运用倾听和反思的原则。使用这样的短语：\n\n\
  - 所以你的意思是……\n- 为确认我的理解……\n\n例如，想象一下你收到了这样的反馈：你是一个糟糕的专业人士，因为你使用 JavaScript 工作，而 JavaScript\
  \ 是一种简单的、不能当真的玩具语言。因此，你也不能被当真。你是在假装自己是个软件开发者，而实际上你什么都不知道。\n\n\n\n### 注意\n\n当接收到破坏性批评时，你很可能无法从这些反馈中获益，因为反馈与客观现实脱节。你的任务是展现社交智慧，以达成共识，或至少避免无意义的争论。\n\
  \n在这个例子中，你可以通过复述反馈来回应：\"所以你是说`JavaScript`是一种不严肃、无法被认真对待的玩具语言，因此我也不是一个严肃的专业人士？好吧，这也是一种看法。\"\
  \n\n通过这个回答，你实现了以下几点：\n\n-   你通过复述反馈，表明你已听到对方的信息。\n-   你承认该信息可以算作某人的一种看法，从而与对方达成共识。\n\
  -   一旦达成共识，关于这个主题就无需再讨论其他内容了。\n\n你不是在反驳反馈。你既没有表示同意，也没有表示不同意。\n\n遗憾的是，仅有语言是不够的。根据你的语气和体态，这个回应可能被解读为戏谑、就事论事、机械、讽刺、挖苦、戒备、被动攻击、沮丧、愤怒，甚至带有人身攻击。如果你对这个回应感到不舒服，你也可以选择让自己轻松些，只说一句：\"\
  谢谢您的反馈。\" 不幸的是，这个回应缺乏\"确认收到\"和\"达成共识\"的要素，但你仍然有很大机会避免陷入无意义的争论。\n\n你可以选择帮助和引导对方，而不是直接结束对话。在这种情况下，指出你察觉到的某些感受可能会有所帮助：\n\
  \n-   你似乎对这一点很担忧。请详细说说吧！\n-   你听起来对这个问题的一些潜在解决方案有些困惑。我们要不要先思考一下，等研究后再回到这个具体问题上？\n\
  \n当某个观点需要澄清时，请随时提问：\n\n-   您能澄清一下您所说的意思吗？\n-   请更详细地解释一下这个想法。\n\n我们的目标有两个。首先，我们需要获取尽可能多的信息，因为即使是破坏性批评也可能包含一些建设性反馈的痕迹。其次，我们需要确保通过考量反馈来积极倾听。\n\
  \n缓和反馈的一个必要条件是放弃争辩。在接收反馈时，放下你的防备，去倾听。即使反馈是错误的，通过争辩来证明你是对的也对你没有任何好处。\n\n当你收到来自经理的反馈时，无论其背后的意图如何，都要先表示感谢。复述反馈中的一些要点，并向你的经理承诺你会针对这些要点进行改进，然后带着你的进展向他/她汇报。\n\
  \n每当你谈论自己的感受时，确保你保持坚决自信的态度。这意味着：\n\n-   你表达出你是如何解读某个说法的。\n-   你表达出这种解读在你内心触发了何种感受。\n\
  -   你表达出这些想法和感受所带来的后果，同时考虑到双方的立场。\n\n例如，假设你的经理对你说：\"你是一个解决问题非常准确的人。无论情况如何，你总能找到完美的解决方案，而且几乎从不犯错。因此，我鼓励你稍微加快速度，即使这意味着可能会犯更多错误。要相信你的同事；他们最终会帮你发现错误。\"\
  \n\n假设你用内心的独白以以下方式解读了上述信息：\"我的经理在说我动作很慢。他是不是认为我没用，什么也做不成？我所有的同事都犯了很多错误，我纠正了他们所有的错误。我怎么能信任他们？犯错的是他们，完美无缺的是我，结果得到奖励的却是他们。这不公平！\"\
  \ 你有权利进行这样的内心独白吗？绝对有！\n\n### 注意\n\n与接收反馈相关的内心独白应被视为一种具象化陈述。具象化陈述是事实。在你看来，争论人们\"\
  应该\"如何感受，被视为对心理边界的侵犯。\n\n当你否认自己的选择，并将某种情况归咎于他人时，就发生了边界侵犯。人们有权以任何理性或非理性的方式解读反馈。当你因对方以一种你无法理解的解读方式而责备他们时，你就侵犯了他人的边界。\n\
  \n保护你不侵犯他人边界的工具是**坚决自信的沟通**，因为它迫使你去考虑对方的利益。同时，坚决自信的沟通也能帮助你防止他人侵犯你的边界，因为它代表了你的利益。\n\
  \n让我们用顺从/服从式、攻击式和坚决自信式沟通来回应我们经理的反馈。\n\n顺从的方式就是简单地重复并接受对方的说法：\"是的，我可能确实比应有的速度慢了一些。以后我会更加注重效率。\"\
  \ 这种方式的问题在于，你内心的独白将来还会继续。顺从的回应没有代表你的利益。\n\n攻击式的回应极具破坏性，这可能会阻塞未来反馈的渠道：\n\n-   \"\
  你是说我慢吗？\"\n-   \"不，我不慢！不像某些人，你知道是谁（！！！），我不会拿公司的资源去赌博！\"\n\n不论回答本身如何，请注意攻击式做法是针对那个本想通过反馈帮助你的人。\n\
  \n让我们看看坚决自信式方法：\"当你给我这个反馈时，我有一瞬间感到有点沮丧，因为我最初的理解是：我做事非常慢。但仔细思考这个情况后，我明白你给我这个反馈是有充分理由的。同时，我之所以没有更快，也是有原因的。我想和你分享一下我的原因，这样我们可以一起得出结论，看看未来如何推进。\"\
  \n\n坚决自信式方法显然胜出。你的经理最终会帮助你平息内心的斗争，而你在这个问题上的内心独白也终将停止。你把你的感受摆到了桌面上，同时选择了进行情绪控制。你选择不生气，也选择不对反馈做出仓促的判断。并且还有一个后续行动计划来跟进反馈的要点。这才是专业人员的处理方式。\n\
  \n有些人因为脑海中关于工作的内心独白从未停止而夜不能寐。每当你采取顺从的方式，你就会累积压力。攻击式方式会暂时释放你的一部分压力，但它并不能为你提供解决方案或长期的解脱，因为未来的挫折和愤怒会累积更多的压力。最终，你的认知会扭曲，其他人也将无法再给你反馈。\n\
  \n唯一双赢的局面来自坚决自信式方法。坚决自信式方法能化解双方的压力。\n\n\n\n### 注意事项\n\n接受反馈的一个重要因素是情绪控制。你需要对自己的情绪负责。情绪理论区分了情绪的两个组成部分：现象本身和我们的解读。一般而言，事件是中性的，我们往往无法控制它们。我们能够影响的，是我们对发生在自己身上的事情做出的反应。如果你感到被冒犯，变得悲伤、愤怒或恐惧，那是你自己的选择。\n\
  \n由于我自认为本质上崇尚精英主义，因此我倾向于看重表现而非其他因素。所以，对我来说，指出某些问题并向他人提供反馈通常是理所当然的。\n\n在撰写本书时，我仍在努力克服自己的头号缺点，即未能认识到对反馈可能产生的破坏性解读。我克服这一缺点的策略是提醒自己：不承认他人有权对事件进行破坏性解读，无异于侵犯了他人的心理边界。通过这种方式，我就能在情绪上控制自己倾向于不承认那些违背我精英主义信念的解读。这种情绪控制能力在处理冲突和提供反馈时都很有用。\n\
  \n### 给予反馈\n\n戴尔·卡耐基所著《人性的弱点》一书前几章强调了一个事实：人们渴望被赞扬，渴望感到自己很重要。此外，正向强化是唯一有效的强化方式。\n\
  \n让人们感到自己重要的唯一方法，就是把他们的利益放在首位。试着站在他们的角度思考，问问自己，他们会如何理解你的信息。\n\n如果你真心关心你的同事，他们就会理解你的意思。给予反馈不应当以委婉或隐瞒真相为特征。反馈是一种帮助他人变得更好的工具。\n\
  \n一些专横的经理倾向于向下施压。他们告诉下属自己有多么不可靠、多么糟糕、多么无能。换句话说，他们用恐惧来命令他人。这是错误的。从长远来看，没有人会容忍这种行为。侵略性的沟通方式是在利用他人，他们会竭尽全力避免这种互动，甚至不惜以辞职为代价。\n\
  \n给予优质的反馈至关重要，但同时也很困难。如果你的反馈听起来积极但空洞，多数人会发现你不够真诚。\n\n很多人也知道“赞扬-批评-赞扬”三明治公式。他们想给出建设性反馈，于是用两个赞扬包裹住建设性的批评，使之显得缓和。尽管这种方法在工作中仍比粗暴的批评更有效，但如果使用不当，也可能带有一定的操纵性。\n\
  \n当我们在组织语言时，说出了并非真心想说的话，只是为了触发对方的某种情绪，我将这种技巧称为操纵性技巧。\n\n例如，“赞扬-批评-赞扬”三明治就具有操纵性，每当你为了完成这个“三明治”结构而有意识地加入赞扬时便是如此。盲目遵循这个方法的人，会先给一个空洞的赞扬，然后从自己的角度深入谈论第二部分，最后再用一个空洞的赞扬收尾。同样这些人会纳闷为什么自己的反馈没有效果，然后去寻找另一个“圣杯”模式来遵循。实际上，他们需要的圣杯是言行一致和承担责任。\n\
  \n赞扬、批评、再赞扬，只有在前两个赞扬也是诚实且你本来就会提及它们时，这种方法才有效。\n\n从对方的角度来组织反馈语言。不要害怕以正确的方式说出真相。诀窍在于找到对方愿意接受反馈的时机和方法。\n\
  \n负面反馈不应表现为批评。你应该帮助他人。因此，你应尽可能做到实事求是并提供帮助。以下指南将对你有所帮助：\n\n1.  **收集事实**：确保你的反馈有坚实依据。没有证据时，你只是在猜测。在这种情况下，提问和非正式地讨论这个话题比直接给出反馈更合适。\n\
  \n2.  **将这些事实与后果联系起来**：描述你所评论领域的实际影响和附带影响。\n\n3.  **建立共识**：确保双方对情况的理解一致，并且不存在会导致你得出错误结论的信息。\n\
  \n4.  **就期望的结果达成一致**：理想情况下，期望的结果应符合 `SMART` 原则，即 `具体的`、`可衡量的`、`可实现的`、`现实的` 和 `有时限的`。有时你可以忽略其中某些或全部要素。例如，如果有人遇到个人生活问题，我们要表示最大限度的理解，而不应将同事的生活当作一个项目来处理。给同事设定一个解决私事的截止日期毫无意义。在这种情况下，期望的结果是在问题解决之前放宽我们的期望。\n\
  \n5.  **提供帮助并跟进**：一次会议往往不够。帮助总是受欢迎的。\n\n\n\n"
- "# 排版后的文本\n\n这个过程并未涉及你的沟通方式。与生活中的方方面面一样，你表达信息的方式远比信息本身重要。你的沟通工具是同理心、情商和坚定自信的沟通。\n\
  \n每当你设身处地为他人着想时，就会产生共情的连接。在构思你的信息时，始终要感受当他人脱离上下文阅读或听到你的信息时，可能会产生怎样的感受。这个练习将帮助你培养同理心。\n\
  \n你坚定自信；你同时维护自己和他人的权利。你避免咄咄逼人，也避免因接受错误之事而采取被动行为。\n\n让我们用五步公式来比较一下以攻击性方式和坚定自信方式表述的反馈。\n\
  \n*   “你三次未能及时告知我关于（……）的延误。因此，与你共事的人可能会认为你不可靠。我猜你没有任何借口来解释为何没有告知我这些延误，对吧？”\n\n这里几乎没有留下学习的空间。要么引发一场争论，要么对方会试图立刻结束对话。假设你以下列方式结束反馈环节：\n\
  \n*   “从今天开始，请（……）。一个月后我们将审查你所有的项目，我会收集你这边所有的延误情况。如果你有任何问题，你知道在哪里可以找到我。”\n\n在这条反馈中，给予者直接具有攻击性。因此，这种反馈不太可能有所帮助。第一句话就已经触发了接收者的防御机制。正因如此，接收者可能已经在精神上抽离，退回到自己的内心独白中。称某人为不可靠是破坏你与同事关系的好方法。谈论借口只会挑起争论。到了这个阶段，可能会出现以下四种情况之一：\n\
  \n1.  同事失去工作动力。\n2.  最大程度的防御，使反馈信息无效。\n3.  同事攻击你，导致争吵。\n4.  你的信息将被完全忽略。你可能会收到一句谢谢，然后你的同事将来会避开你。\n\
  \n反馈给予者的思路是监控和惩罚。激励另一个人的唯一方法是让他们愿意与你合作，具体方法是：\n\n*   发现并满足他们的需求\n*   提出积极的激励措施\n\
  \n让我们对同一情况，使用坚定自信的风格来表述反馈：\n\n*   “我非常感谢你对反馈持开放态度，尤其是在这样一个艰难的项目之后。我理解，在你的处境下，我可能也没有时间或精力去通知其他各方。让我们利用这个情境从中吸取教训。你是否考虑过是什么因素导致了延误？你有没有什么办法可以更早地发现延误？”\n\
  \n这种反馈开启了一场讨论，以理解彼此的观点。你可以用积极的方式结束反馈环节。\n\n*   “总结一下要点，我们已经就（……）达成一致。这是一个非常好的成果。谢谢你的想法。希望新的流程能减轻你一些额外不必要的责任。作为交换，你能确认当你预见到延误时，会乐意去（……）吗？”\n\
  \n第二条反馈似乎创造了一个双赢的局面。双方都感到高兴和满意。反馈变成了关于如何解决问题的建设性讨论。\n\n请注意，攻击性方法将所有责任都推给了反馈接收者。而坚定自信的方法则在反馈给予者和接收者之间分担责任。从长远来看，这是赢得朋友和支持者的方法。\n\
  \n我曾经进行一次反馈谈话，因为我感觉一位软件开发者没有足够好地“拥有”他的工作成果。换句话说，他写了代码，却依赖别人运用常识来发现解决方案中的错误。在软件开发中，在代码仍然有误的状态下声称“准备好了”，就像宣称手术已经完成，而伤口还在流血一样。我们称我的同事为弗兰克。\n\
  \n如果我当时说：“听着，弗兰克。你需要在准确性上多下功夫，并且需要更好地测试你的解决方案。”弗兰克要么会采取防御姿态，要么会不假思索地说：“好的，当然，我会做的。”\n\
  \n我相当确定弗兰克也有点困扰，而且他的表现比平时稍差是有原因的。我也确信这个可怜的家伙比平时更不走运，因为所有可能出错的事情都真的出错了。\n\n因此，我通过告诉他我想指导他如何提升自己在公司中的价值来开始这次反馈。这个消息立刻抓住了他的注意力。\n\
  \n然后，我让他评估部署到线上系统的代码中的各种错误。他需要给这些错误打分，从零到十分。零分意味着错误是不可避免的；我们不能指望任何人发现它。十分意味着即使是实习生也应该能发现这个错误，哪怕这个实习生刚睡醒盯着屏幕看。我要求弗兰克极其诚实地打分，因为我们要从中吸取教训。\n\
  \n有趣的是，弗兰克发现了好几个九分和十分的错误，他的平均分大约在六分。弗兰克已经知道了事情的结果，并告诉我这个认识让他相当震惊。我对他说：“没有人期望你得零分，每个人都有犯错的权力。最优秀的开发者平均分可能在一分；普通开发者可能在三分左右。而你的情况，弗兰克，我知道你完全有能力做到三分以下。”\n\
  \n然后我问他是否有任何困难，并主动提供帮助。弗兰克说他暂时失去了一点动力。确实，我们曾许诺给他一项额外福利，但由于我们无法控制的行政原因而延迟了。此外，弗兰克曾考虑离开公司，但最终他决定留下。\n\
  \n最后我告诉他，可靠是一项巨大的财富。许多开发者从不付出额外努力，从不承担那种“拥有”自己任务的责任——他们不仅仅是勉强达标地解决问题。我给他的反馈确保了他如果想进步，就有明确的关注点。在一年之内，弗兰克的薪水增长了超过\
  \ 30%，而他并没有应用任何谈判策略。\n\n我们解决了所有问题。弗兰克不仅在处理自身问题上得到了帮助，他还成功地激励自己创造了额外的价值。\n\n因此，给予反馈是协商更高薪水的一个非常重要的工具。其他人会试图学习你给予反馈的诀窍，即使你根本没有诀窍。你所需要的只是坚定自信；确保你弄清楚人们想要什么，并且你谈论的是他们，而不是你自己。\n\
  \n\n### 额外任务\n\n协商更高薪资的一个重要筹码，是去解决那些令你上司头疼的问题，或是你的公司愿意花钱解决的问题。请记住，金钱总是与责任相伴。\n\n\
  假设你发现公司正面临一个重大问题，并且你知道自己有能力解决它。你可以这样对你的经理说：你有动力去解决这个特定问题，因为它能为公司节省更多资金或带来远超你当前处理问题的利润。\n\
  \n额外任务不应取代你现有的职责，而应是在其之上增加的部分。换句话说，与其在 8 小时工作时间里花 2 小时社交，不如做出短期牺牲，做出点成绩。\n\n在极端情况下，你可以像内部创业者一样，针对公司面临的问题发明出解决方案。如果你创造了额外收入或节省了成本，你的公司很可能会欢迎你的努力。有些公司甚至设有专项资金，用于支持内部创业者启动内部项目。这对你来说意味着，你可能会获得一些预算，并且可以通过从事自己定义的工作来赚取薪水。\n\
  \n我见过有员工向他们所任职的公司推销高级培训课程。这些人识别出需求，做了大量研究，投入了全部精力，最终开发出了一流的培训方案。公司也通过这个培训节省了大量资金，因此这是一个双赢的局面。\n\
  \n如果你真的对某个额外任务充满热情，但不知道做什么，那就成为一名导师吧。即使经验不多的人，如果在某个领域获得了专长，也可以指导他人。通过指导他人，你提供帮助并创造了价值。\n\
  \n#### 练习\n\n### 备注\n\n这一章节的练习要求你在现实世界中付诸行动。你或许有绝妙的想法，但如果你从不开始着手实施，这些想法对你来说将毫无用处。唯有行动，才能区分梦想家与实干家。\n\
  \n沟通练习可能会很困难，尤其是对内向的人来说。每当你觉得某个练习太难时，可以先从更简单的练习开始，直到你能够应对更大的挑战。如果你在这方面需要更多帮助，我也可以推荐你阅读我的书《魅力程序员》（*The\
  \ Charismatic Coder*），它能帮助你达到社交流畅状态，并毫不费力地以真实方式进行沟通。\n\n我无法承诺其他，唯有你在本章节中的辛勤付出。你努力的回报，将是日常生活的巨大改善。\n\
  \n1.  列举出你现在就可以做的四件事，让你在工作中更有效率。逐一攻克这些改进点，开始采取行动。\n\n2.  你多久说一次“谢谢”？你是否发现自己处于本可以说“谢谢”却没说出口的情况？除了说“谢谢”，你还会表扬别人吗？提醒自己在任何合适的场合都说一声“谢谢”。\n\
  \n3.  每天找一个值得表扬的行动。如果你害怕表扬同事，请运用识别和消除限制性信念的原则，制定一个计划来扩展你的舒适区。例如，你可以先开始表扬你的家人，然后是你最好的朋友，然后是商店里的某个人，最后是一个陌生人。一旦你建立了势头，你就可以开始接近你的一些同事了。\n\
  \n4.  在日常情境中练习主动倾听。运用本部分学到的公式，表明你对同事所说的话感兴趣。在适当的时候，进行总结、指出对方的感受，并请求澄清。\n\n5.  在工作场所内外练习坚定自信的沟通。确保你通过自己的沟通风格为公司增加价值。\n\
  \n6.  在接下来的几个月里，通过提出建设性的批评来练习坚定自信的沟通。如果你对此感到不自在，可以先在公司外尝试。\n\n7.  请一位同事给你诚实的反馈。\n\
  \n8.  请你的经理给你反馈。建立一个每月一次的反馈渠道。认真对待所有学到的知识，并改进你的工作。\n\n## 无需谈判，即可晋升\n\n**本部分目标：**\n\
  \n*   确定能让你获得晋升的任务。\n*   理解承担责任的重要性。\n\n信不信由你，在很多公司里，如果你在正确的时间、正确的任务上投入足够的精力，你就能创造奇迹。正确的任务不是其他人都在做的任务，甚至可能不是你过去做过的任务。\n\
  \n你的任务可以归为两类：\n\n1.  你为保住工作而做的任务（职责）\n2.  你为获得晋升而做的任务（机会）\n\n在第一类中，大多是你从别人那里接到的任务。为了不被解雇而只交付最低限度的工作，从长远来看是非常危险的，因为你将错失进步的机会。只需一场经济危机，你就会发现自己陷入深深的麻烦。你的薪水也不会增长太多。\n\
  \n完全专注于你的职责而忽略第二类任务，可能会损害你的职业发展。只专注于强制性的低级任务，只能证明你的贡献与目前的职位非常匹配。晋升将会授予那些愿意承担额外责任的人。\n\
  \n是选择只做别人告诉你的事，还是运用常识并发展解决问题的能力，这完全取决于你自己。\n\n经济学讲的就是供需关系。有很多人不愿意承担责任。这些人的收入较低，因为他们是可以被替代的。你会惊讶地发现，具备专业商业头脑的解决问题能力是多么稀缺的资源。通过为你工作的各个方面承担责任，你可以轻松跻身所在领域的前\
  \ 5%。\n\n每当指导新入职的软件开发人员成为我的职责之一时，我总是强调以下信息：“你是在 20 名申请者中被选中的那一个人。你和其他人的区别在于，你展示了高水平的解决问题能力、合作精神以及成熟的思考过程。在这家公司，每个人都应该为自己的工作承担责任，并运用常识，而不仅仅是盲目地解读需求。请记住要管好你自己的分内事。与其他团队坦诚沟通，确保你理解他们的工作，以便无需任何外部帮助就能与他们合作。”\n\
  \n我很幸运能在一个梦之队工作，因为整个招聘流程的设立就是为了找到那些愿意承担最低限度责任的人。\n\n起初，做决定很困难，因为你内心会感到一些不确定。然而，一旦你获得了势头，你就会发现你主宰着自己的工作。这会让你更快乐，因为你感到自己的贡献很重要。\n\
  \n作为一项练习，某天工作结束后，出去坐一趟公交车或地铁。开始观察周围的人。你能看到那些精力充沛、迫不及待想去改变世界的快乐的人吗？你看到的，是否更多是那些行动缓慢、犹豫不决、几乎没力气回到家打开电视或游戏机的人？\n\
  \n喜欢自己工作的人通常更快乐、更有活力。在职场中获得持久幸福的途径，在于创造价值、做出改变，并为自己的行为负责。完全的负责需要你在肩上有一定的责任。\n\n\
  如果你不习惯，责任会带来巨大的压力。一旦你进入下一个层次，这种压力就会消失。你会把自己看作一个正在朝着目标前进的人。\n\n\n\n### 金钱还是责任？\n\n\
  有时你会面临在更多金钱与更多责任之间的两难抉择。\n\n例如，你可以在以下两份工作中选择：\n\n-   在一家公司担任高薪职位，但需要重复执行相同任务，直到你离职。你的薪资仍会增长，因为随着经验积累，你的工作效率将提升\
  \ 10%-20%。\n-   一份薪资略低，但能积累大量经验的工作。你还有望在一年内实现薪资翻倍。\n\n令人惊讶的是，许多人选择了第一份工作，直到后来才发现自己浪费了一两年的光阴。\n\
  \n我个人曾面临在成为领导还是成为专家之间的抉择。许多人想成为领域专家，却放弃了专长而选择成为领导。鉴于这些人对领导工作并无热情，他们多半会失望。失望的原因在于他们期望赚更多钱——成为领导后薪资或许能小幅增长，但从长远来看，坚守专家路线本可以赚得更多。\n\
  \n我选择了折中路线，成为技术型管理者。我依然与技术保持接触，同时在公司需要流程优化判断时提供帮助。\n\n在 21 世纪，专家角色是能获得回报的。专家的薪资往往高于团队领导。\n\
  \n长远来看，选择更多责任几乎总是更好的。金钱最终会与责任匹配。\n\n### 注释\n\n能力是通过应对挑战形成的。责任紧随能力而来。金钱则追随责任。\n\n\
  你今天或许可以做出的决定是：抓住每个机会去做有用的事。随之而来的自尊与自信提升终将带来回报。\n\n首先，如果某事令你困扰，就去解决它。提出能提升效率的创新想法。成为在实践中验证好想法的先驱。\n\
  \n定期解决棘手问题。不久之后，一旦问题变得复杂，人们就会首先想到你。保持正确的心态能让你持续保持动力，因为解决难题甚至可能让人上瘾。\n\n拒绝晋升从长远来看可能更有利。我曾有机会申请产品总监职位。这意味更高的收入和新人脉。遗憾的是，这并非我的专长领域；因此接受这个职位可能应验\"\
  彼得原理\"——让雇主误以为我的工程能力能轻易转化为产品能力。比起从职业角度可能存在的潜在威胁——自欺欺人，我反而不那么担心欺骗雇主。\n\n虽然我以某种形式从事软件工程已超过\
  \ 20 年，但产品管理经验有限。我的视角天然偏向工程思维。更重要的是，我会想念工程工作，并打乱自己的成长轨迹。在当前职业阶段，稍高的薪资不足以弥补这些损失。这就是评估选择时职业规划如此重要的原因。\n\
  \n#### 练习\n\n1.  谁参与了你的薪资决策过程？\n2.  这些人面临哪些挑战？你能做些什么来承担部分挑战？\n\n### 总结\n\n本章的核心观点是：自信主动终有回报。在顾及他人利益的同时维护自身利益，是职业发展的必要组成部分。\n\
  \n随着你承担更多责任，社交智慧在职业生涯中的重要性日益凸显。社交智慧源于情绪自我调节。当他人因突发事件而情绪波动时，你有能力以成熟方式应对，并从每次经历中学习。\n\
  \n社交智慧还能让你意识到：可把握的机会远比想象中更多。这意味着操控对你而言毫无意义，因为回报并不丰厚。尽管你可能认定操控对自己无益，但这不意味着你不会被他人操控。懂得自我保护至关重要。\n\
  \n拒绝操控意味着将行动从显性影响转向隐性影响。不必自我吹嘘，你可以让他人自行得出结论，在心中默默确认你的贡献有多重要。\n\n无论你供职于初创公司还是大企业，你都有权获得工作反馈。本章阐述了给予和接收反馈的有效方法。反馈还能帮助你发现成长机会和可承担的额外任务。\n\
  \n有时你无需主动争取就能获得晋升。晋升源于不仅做好本职工作，更主动创造能帮助团队的创新方案。\n\n如果你认真对待这些步骤，很可能无需阅读接下来的两章。事实上，你可能会面临需要拒绝许多机会，以便为真正适合的机会留出时间。幸运的是，说\"\
  不\"本身就是自信的特质，会随着自信训练自然形成。\n\n在接下来的两章中，我们将继续夯实基础，学习如何像专业人士一样进行谈判。\n\n脚注  \n1  \n\
  2  \n3  \n4  \n5  \n6\n\n\n\n"
- "# 6. 谈判加薪与晋升\n\n获得你应得的报酬\n\n本章将为你提供一个谈判加薪与晋升的框架。作为软件开发人员，我们时常会遇到需要主动争取才能获得真正想要的东西的时刻。即便我们的经理支持我们的进步且心怀善意，这种情况也时有发生。有时他们并未意识到我们的成长。\n\
  \n想象一下，你负责管理一个 20 人的部门。你能追踪每个人的进展吗？如果你是 20 人中的一员，你的未来大多掌握在自己手中。\n\n许多开发人员认为经理了解他们付出的每一份努力，并会给予相应的回报。当回报未能如期而至时，他们会感到沮丧，继而继续等待。这种沮丧会扭曲他们对之前支持过自己的经理的看法。然后，他们才会联系经理讨论绩效评估。这样的评估通常结果如何？\n\
  \n通常不太理想。\n\n你可能会在错误的时间要求加薪，更糟的是，你的态度可能会让你自断后路。你在公司的形象也可能因此改变。\n\n当你受情绪影响时，你的决策就会欠佳。这正是我们在本章要解决的问题。你将获得一个完整的框架，用于争取加薪或晋升。\n\
  \n在第一部分，你将了解薪资如何管理以及公司对你的期望。你将学会如何把握提出要求的时机，以及如何通过你的陈述提供额外价值。\n\n第二部分将教你如何陈述你的诉求。你首先需要准备一份薪资调研文件，用数据支持你的主张。你将学习如何传达你对自己在公司角色的愿景。在本部分结尾，你将制定出一个难以拒绝的提议。\n\
  \n第三部分是关于有效谈判加薪和新职位的方方面面。我们将破除许多让你无法专注于真正重要之事的迷思。\n\n谈判结束后，第四部分将告诉你如何表达感激，以及如何在谈判后用行动进行跟进。\n\
  \n在第五部分，我将给出一些理由，说明为什么对许多人来说，在要求加薪前先去获取外部 offer 并不明智。这将为你省下大量时间和精力，让你能专注于争取加薪这件事。\n\
  \n## 了解你的谈判对象\n\n**本部分目标：**\n\n*   查明公司管理薪资的具体细节。\n*   制定在正确时机争取加薪的策略。\n*   理解公司的利益点。\n\
  \n当谈判有利结果时，设身处地站在对方立场考虑，可以最大程度增加你的机会。如果你深入了解你所在的公司、负责你发展的经理以及你未来可能参与的项目，你就能获得宝贵的信息、洞察力和策略。通过主动探寻如何才能创造最大价值，你在谈判加薪时会比跳过这一步轻松得多。\n\
  \n### 了解薪资是如何管理的\n\n为了谈判加薪，了解影响薪资的因素至关重要。这些因素包括公司流程以及决策者的内部说法。\n\n公司流程因公司而异。科技初创公司比政府机构更灵活。小公司通常比大公司更灵活。另一方面，大公司通常财力更雄厚，因此平均薪酬更高。\n\
  \n公司通常为每个职位设定一个薪资范围。招聘人员的目的是找到适合该职位、且期望薪资在该范围内的人选。\n\n通常情况下，求职者是先说出期望薪资的一方。有时，强硬的谈判者会迫使公司透露其薪资范围，而他们的策略则是先隐藏自己的期望，直到展示完自身技能。\n\
  \n你的过往决定了你的声誉。如果你本身也是位强硬的谈判者，你必须提供一些独特的东西。许多人认为自己能提供独特价值，但实际上他们完全可以被替代。因此，要确保他人能充分了解你的技能。这就是你的个人品牌和面试表现如此重要的原因。\n\
  \n在极端情况下，你的招聘人员甚至可能是你的粉丝。想象一下，你是一位科技博主，并且是公司所需技能的专家。你未来的面试官可能每周都阅读你的博客，而他们公司可能已经在使用你编写的开源软件。在这种情形下，你就有资本争取高于目标职位薪资范围的薪酬，而公司很可能满足你的期望。\n\
  \n在其他情况下，招聘团队可能经验不足，在压力下会妥协。我的一位朋友告诉我，他申请了一个初级职位，其薪资范围是每年 4 万至 4.5 万欧元，这个范围也符合行业标准。基于一些错误信息和计算，我的朋友声称年薪低于\
  \ 5.2 万欧元他就不愿 relocate。他最终得到了这份工作。后来，HR 团队透露这远超出了常规标准，他们不得不额外申请批准来支付这笔薪水。然而，一旦获得批准，HR\
  \ 也就没有再拒绝录用我这位朋友的意愿了。\n\n\n\n### 争取加薪\n\n一些咨询公司有固定的薪酬计划。它们设有固定的职位，例如实习顾问、初级顾问、顾问、经理和合伙人。你的职位决定你的薪资。这套体系是“非升即走”。规则清晰，没有协商余地。在这样一家公司里，你几乎也没有时间去协商。\n\
  \n在其他公司，包括一些知名的金融机构，全年只有一天是加薪日。没有任何例外。即使你升职了，你也得整整一年拿着原来的薪水。\n\n公职岗位通常有固定薪资。绝对没有协商余地。要么接受条件，要么放弃。其中一些公司也不提供任何升职机会。\n\
  \n你的任务是弄清楚规则。这可以通过多种方式实现。你可以与同事建立人脉，并与合适的人公开交流信息。你可以访问类似`glassdoor.com`或`payscale.com`这样的基准查询网站。或者，在某些公司，你可以礼貌地向你的经理、部门主管、CEO\
  \ 或副总裁询问内部规则。这需要良好的关系和积极的感情储备。换句话说，在提出此类问题之前，你必须通过持续交付高质量的工作来“付出”。\n\n在某些情况下，你寻求加薪的努力到此为止。汲取前面所有章节的经验教训；学习你在另一份工作中需要掌握的技能。\n\
  \n幸运的是，这种情况越来越少见，因为企业的利益在于拥有留住最优秀人才的选择。因此，即使你公司的规则看起来很严格，但作为一名表现卓越且自信的谈判者，一些通常不对普通员工开放的大门可能会为你敞开。\n\
  \n只要你的薪水没有显著高于你贡献的市场价值，通常就存在谈判空间。\n\n有些公司有固定的加薪制度，同时也设有特殊加薪的流程。这个流程通常不太方便，需要收集多个审批意见。如果你在一家官僚作风的公司，这个流程可能相当复杂。无论如何，你的任务是弄清障碍所在，并坚定地跟进你争取加薪的进展。好消息是，如果你的表现极其出色，即便大众认为不可能，获得足够支持以实现特殊加薪也并非不可能。\n\
  \n企业通常有规章制度，但这些规则在高层那里是可以变通的。另一个极端情况是完全没有规则。这种情况发生在小公司，那里的预算有限，但灵活性最大。如果你的感知地位很高，且你的角色足够独特，你或许能够为你的服务定价。如果你是全球五位能够处理核电站爆炸后遗症的行家之一，并且正值紧急情况需要你们五人全部上阵，那么价格由你来定。\n\
  \n没有规则并不意味着上不封顶。要认识到这种情况只对“没有约束你经理的繁琐手续和流程”这一点有利。你仍然需要尽力提升你的市场价值，并且你仍然需要进行谈判。\n\n\
  大多数公司会指定一位负责人来管理部门的预算。他们负责根据主管和经理的建议以及一些公开或私下的经验法则来分配加薪。在极端情况下，即使预算已经用尽，为了处理紧急情况，也仍有有限的余地来申请追加预算。\n\
  \n让我澄清一下“紧急情况”的含义。假设你是一个非常关键的人物，你的贡献无可替代。如果你离职，公司的一个重要项目将严重延期。假设你目前年薪€50,000，而另一家公司给你€65,000。对你的公司来说，这是“要么接受，要么放弃”的处境。如果公司迫切需要你的服务，他们至少愿意支付€62,000，甚至€65,000，因为他们仍能从你的贡献中获利，而且业务连续性不会受到威胁。\n\
  \n我们将讨论这种方法的利弊。在收到外部 offer 后等待对方提高报价是一个薄弱方案。几乎总有一个更干净利落的方案，它能带来同等的预期金钱回报，同时还能附带保持雇主信任的好处。\n\
  \n注意另一个重要方面：财年。一些公司在新的财年开始前会获得新预算。当你感觉还有余钱可以满足你的要求时，就把握好时机提出。在财年开始前几个月提出申请的成功率最高，因为预算负责人有时间动用今年预算中未使用的款项，或者他可以提前规划你的加薪，并可能及时申请更多预算。\n\
  \n一些公司有固定的月份来处理所有加薪事宜。如果财年从一月开始，那么公司在 1 月和 7 月处理所有加薪事宜是合理的。其他公司可能每季度都有加薪的可能。了解这些月份，因为最坏的情况下，你可能需要等待长达\
  \ 5 个月，除非你想给预算负责人制造麻烦。\n\n在继续之前，让我们总结一下：\n\n*   一些公司不论表现如何，都实行固定薪水和固定加薪制度。\n*  \
  \ 其他公司则实行薪资范围制度。\n*   你的贡献越有价值，你就越有可能获得超出你职位所属薪资范围的薪酬。\n*   加薪通常受流程和预算约束。\n*   紧急情况可能证明突破流程和预算是合理的，但制造紧急情况是有代价的。\n\
  *   了解加薪通常何时进行。了解财年何时开始。\n*   在极端情况下，根本没有薪资范围、预算或流程。\n\n\n\n### 公司的利益\n\n许多人在规划谈判过程时，未能考虑公司的利益。尤其是自恋型员工，往往认为无人能及自己的表现，而公司严重亏待了他们。\n\
  \n不理解公司需要你提供什么，是酿成灾难的根源。\n\n为获得某些好处，你必须回报有价值的东西。为了弄清你的经理、预算负责人以及公司需要什么，你需要从多个层面去理解他们。\n\
  \n决策是由人做出的。如果你能考虑他们的利益，长远来看你会更成功。每当你说话时，其他人就会在脑海中开始一段内心独白。这段独白可能包含怀疑、质疑、警告或缺乏兴趣。如果你努力去理解这段独白，就能避免许多潜在问题。\n\
  \n如果你在透露了更高的 offer 后寻求加薪，你经理的内心独白可能从缺乏兴趣到陷入绝望。最有可能的是，他甚至可能认为你只是在虚张声势。这对你来说是最糟糕的情况之一，因为无论结果如何，你经理的内心独白几乎都不可能是正面的。\n\
  \n假设你找到经理，流露出对自己现状的沮丧，抱怨公司缺乏认可。根据你经理的性格，他们的内心独白会与你的诉求背道而驰。他在想：怎么回事？这人为什么这么沮丧？我做错了什么吗？这个人以后还能专业地行事吗？公司与这位员工的关系已经破裂，还是仍有挽回余地？除了金钱，还有哪些方面可能引发了这种行为？这人知道这些行为在职场上不被接受吗？我是否该解雇他来尽量减少连锁反应？\n\
  \n你的任务是确保你经理的内心独白能支持你的论点。这就是情商、同理心和自信沟通派上用场的地方。\n\n在某些情况下，你的过往记录会给你带来巨大优势。假设你的薪水是`$80,000`。你发现这对于你所在城市、你的职位和经验水平来说是一个不错的薪资水平。然而，你也意识到薪资范围通常在`$60,000`到`$100,000`之间。你找到了一个极高的`$100,000`的\
  \ offer 和几个`$90,000`的 offer，而大多数 offer 都在`$80,000`或以下。\n\n假设你自加入公司以来一直贡献着最大价值。假设你总是寻求反馈，并总在考虑改进工作。你多次通过确保按时完成关键任务来帮助你的经理，并且有一次你还提出了优化某些流程的建议，节省了大量人工工作。\n\
  \n因此，你与经理的关系非常好。你经常表现出真诚的关心，你们也常常非正式地交谈。有一天，你提到需要在未来的职业规划上获得一些指导。你所需要做的就是诚实地告诉你的经理你的情况，确保你的故事完全真实且坦诚。这种沟通的一些要素如下：\n\
  \n- 这家公司是一个很棒的工作场所。\n- 如果遇到挑战，我有责任告知你，以便我们共同解决。\n- 我不会让这些挑战升级到可能以任何方式威胁业务连续性的地步。\n\
  - 我尊重你，所以告诉你真相。\n- 我愿意解决任何能为公司创造更多价值的有意义的挑战，你甚至不必担心需要额外培训我。\n\n例如，如果你喜欢简单明了，下面这样的沟通内容就足够了：\n\
  \n- “我想知道如何才能增加我为公司创造的价值。我有一些想法，但经验不足，无法独自决定。我们能一起头脑风暴一下吗？我感觉目前在自己的岗位上有点停滞不前，我想知道下一步我该如何提高自己的赚钱能力。”\n\
  \n这也是一个很好的对话开场白。你明确表示你想要更多钱，但你也愿意付出回报。你考虑了公司的利益。这样的信息也显得坦诚。其中没有明显的影响意图，因为你没有吹嘘过去的成就。\n\
  \n根据环境的不同，这种直接程度可能恰到好处，也可能过于直白。如果鼓励直接沟通，你甚至可以这样表述：\n\n- “我们可以进行一次反馈面谈吗？我想弄清楚如何才能对公司更有价值。我觉得自己有能力赚得更多，我想知道需要做什么、学习什么或达成什么才能进入下一个阶段。”\n\
  \n在这条信息中你也没有隐藏任何东西。许多人在利用反馈时，因为羞于直接要求加薪，所以只是请求进行一次反馈面谈。然后在面谈结束时，他们才说其实对现状相当沮丧，并想赚更多钱。\n\
  \n“就像你说的我干得不错，那我应该值更多钱，对吧？”嗯，错。没有人喜欢被设圈套。这无异于一个陷阱，从长远来看会扼杀诚实的反馈循环，因为你的经理会害怕说出那些你可能会用来对付他、从而再次要求加薪的话。反馈是为了让你自我提升和发展叙述性影响力。反馈不是为了让你对给予反馈者发起修辞攻击，从公司榨取更多钱。\n\
  \n### 注意\n\n不要利用良好的反馈来套路你的经理。我听过的最极端的案例是，一位经理告诉我，他的员工在被解雇后想起诉公司，原因是他一年前得到了良好的反馈。反馈是你绩效的一个快照，其目的是让你进一步提升技能。如果你不再满足期望或做了违法的事，反馈并不能保护你免于被解雇。\n\
  \n#### 练习\n\n1.  识别你公司的流程、预算限制和时间限制。\n2.  收集关于你职位、在公司中的认知价值以及行业标准的所有信息。将所有福利考虑在内！\n\
  3.  判断追求加薪是否值得。\n\n## 准备并演练你的请求\n\n**本章目标：**\n\n-  发现你的服务在市场上值多少钱。\n-  明确你能提供什么价值。\n\
  -  准备一份公司难以拒绝的、有吸引力的提议。\n\n如果你认为你的公司有能力给你加薪，那么请求的顺利执行和时机把握就至关重要。在本节中，你将学习如何准备你的请求。\n\
  \n公司很难找到人才。招聘成本可能高达五位数美元。大多数情况下，让员工满意对公司来说很重要。这包括你感到舒适的自在程度、能帮助你释放潜力的有意义的项目，以及更多的钱。\n\
  \n为了制定出合适的说辞，你必须做三件事。首先，你必须研究你的服务在就业市场上值多少钱。然后思考你如何能为公司的增长做出贡献。构想一个能为公司带来价值的、引人入胜的未来愿景。一旦你明确了你所提供的价值和你目标中的加薪幅度，就制定一个*无法拒绝的提议*，并演练你的请求，直到你对此感到得心应手。\n\
  \n\n\n### 薪资调研文档\n\n有时公司在谈论薪资时会存在偏见。招聘团队通常掌握着大量关于公司内部员工薪酬的参考数据。如果公司某个职位的平均薪资是 65,000\
  \ 美元，而市场平均水平是 72,000 美元，招聘经理甚至可能不会意识到自己支付的水平低于市场平均水平。\n\n公司规模越小，薪资越灵活。而对于大公司来说，有关加薪、起薪和奖金的规定往往限制了人力资源团队的自主权。\n\
  \n调研自身的市场价值是你的职责所在。你的调研越精确、越客观，效果就越好。在调研文档中应包含多个信息来源，例如：\n\n- `PayScale`⁴⁹ 是你可获得的最佳资源之一。一旦你填写完关于当前职位、经验、资历和技能的表格，就会收到一份详细的薪资报告，显示薪资中位数、前\
  \ 20% 的标记线以及前 10% 的标记线。你还能得知自己的薪资处于哪个百分位。\n- `Glassdoor`⁵⁰ 提供了大量薪资数据。如果你的公司规模足够大，或者你足够幸运，甚至可能找到同事的薪资。\n\
  - `Stack Overflow Careers`⁵¹ 为标注了薪资范围的职位提供了竞争优势。我总能在那里找到有价值且可验证的信息。\n- 其他求职网站也有公开的薪资信息。\n\
  - `Google` 是你的好帮手。尤其是针对前 20% 的薪资水平，我倾向于把 `Google` 当作求职网站来使用。例如，如果你想了解自己作为慕尼黑的 `Java`\
  \ 开发人员是否能赚到 80,000 欧元，可以搜索“`Java developer Munich 80000`”。在撰写本文时，`Google` 的第一页搜索结果提供了\
  \ 8 个不同求职网站的链接，其中包含薪资高达 80,000 欧元的 `Java` 开发人员和高级 `Java` 开发人员职位。部分索引结果可能已失效，但依然可用于你的薪资调研文档。\n\
  - 与同事交谈。在某些文化中，谈论薪资是一个禁忌话题；而在另一些文化中，人们则会公开谈论薪资。有些公司要求你在合同中签署保密条款，强制你对薪资保密；另一些公司则公开列出每个人的薪资。根据具体情况，我总能找到可以交换信息的伙伴。你对薪资水平了解得越多，判断力就越强。毕竟，你不是\
  \ CEO，也不在人力资源或财务部门工作，因此在可获取的数据方面处于劣势。只要选择情商高且成熟的人谈论薪资，这类交流通常不会对任何人造成伤害。此类讨论仅应用于推测公司内部可能的薪资范围。切勿泄露他人的薪资，也永远不要以别人赚得比你多为由提出论点。\n\
  \n### 注意\n\n不幸的是，一些员工因缺乏安全感而对薪资产生了扭曲的认知。一旦他们得知别人的薪资信息，就会进行攀比。这时，那些内心脆弱的开发人员就会感到痛苦，因为他们觉得自己不够好、不值钱。这种痛苦可能表现为沮丧、愤怒、怨恨、苦涩或冷嘲热讽。如果你有这样的感受，请记住，你没有任何问题，也并非不完整。你只是还没有为自己争取到你认为应得的东西。我也鼓励你重新完成本书第\
  \ 2 章的所有练习。\n\n从技术上讲，你可以和招聘人员交谈来获取额外的参考点。不过，我建议不要这样做，因为你很容易最终收到一个工作邀约，即使你并不想接受。招聘人员非常执着，他们会尽力赚取佣金。\n\
  \n完成数据收集后，请准备一份简短的薪资调研文档。以 `PayScale` 的模板为例，并附上可验证的链接，这样你的雇主如果想核对，也能重新生成数据。\n\n\
  再附上几个你找到的其他链接。这些链接应能证实存在各个级别的开发人员职位，作为 `PayScale` 数据的例证。\n\n但不要做得太过；你不需要提供 20 页的参考资料。一张包含\
  \ `PayScale` 数据、一些 `Glassdoor` 结果以及一些其他职位招聘广告的简单页面就完全足够了。\n\n很可能你根本用不上这份薪资调研文档。不过，在你提出加薪请求时，最好带上它，这样如果你的上级需要，你可以随时递过去。\n\
  \n### 注意\n\n薪资调研文档的意图并非为你创造谈判筹码来对抗你的经理。薪资调研文档的目的是帮助你的经理支持你。\n\n公开你的调研内容，并且仅包含必要信息，这是一个成功的策略。一旦谈到具体数字，你甚至可以在调研中提及。将你的调研文档交给上级，并询问他们是否愿意利用你的调研成果向人力资源部门反馈市场趋势，这样做是合情合理的。\n\
  \n### 愿景\n\n你可以通过回顾所得到的反馈来判断自己在公司内部的价值几何。难怪我们此前如此专注于准备反馈循环。\n\n了解你在 `PayScale` 上的百分位有助于你量化当前在财务上被认可的程度。完成薪资调研后，你也能知道基于反馈你应该获得多少报酬。\n\
  \n你的愿景在于进一步提升自己未来的价值。思考你的雇主所面临的挑战。找出你能做些什么来改善雇主的处境。\n\n这一步说起来容易做起来难。首先，界定你的影响力范围。在软件开发领域，通常不缺乏挑战。在某些情况下，你还可能发现你的工作与公司盈利方式之间存在某种商业联系。\n\
  \n你的贡献可以多种方式体现。按对你雇主的价值大小排序，考虑以下四个类别：\n\n1.  你帮助公司赚取更多利润。\n2.  你帮助公司节省成本。\n3.  你帮助公司降低遭受重大经济损失的风险。\n\
  4.  你帮助你的经理和团队提高效率，而无需指定可量化的财务影响。\n\n即使是第 4 级别的贡献也是有价值的。想办法让你的团队更高效。通过为团队着想，而不是毫无付出地宣布你的新要价，你已经比\
  \ 90% 的其他开发人员做得更好了。大多数人是因为沮丧才要求加薪，他们除了自己之外什么也想不到。这种心态并不健康。\n\n\n\n### 注意\n\n我们已经提到，有些开发者不愿承认商业敏锐度是一项重要技能。我主张商业敏锐度不仅重要，而且是超越一定水平所必需的。金钱来自商业活动。因此，如果你想赚得更多，了解你的贡献如何与业务相关联是值得的。\n\
  \n请确保不要过度推行你的任何建议。你应该与团队保持良好关系，绝不要为了自身进步而游说引入不必要的负担。\n\n以下是一些你可以引入的示例：\n\n-   通过自愿帮助他人学习重要知识来鼓励知识传递。\n\
  -   审视开发流程，并自愿额外参与试行有助于团队的变更。\n-   找出对他人来说困难的任务，并接手完成。\n-   一旦你学到公司需要的某项技能，就主动要求承担额外任务。例如，如果你指出应用程序缺少验收测试层来保驾护航，你可以自愿引入验收测试。\n\
  -   引入或改进编码标准。\n\n关于验收测试的例子，如果你做得很好，它可以成为三级贡献。缺乏端到端测试通常是一个重大问题，因为你很难保证高水平的服务。\n\n\
  三级贡献的核心在于指出潜在风险。如果该风险值得修复，你的贡献将很有价值。然而，没有人愿意为他们不想要或不需要的东西付费。一旦你证明了问题的严重性，你就能帮助公司消除威胁。例如：\n\
  \n-   改进关键应用的单元测试、集成测试和/或验收测试。\n-   根据过去的紧急情况，预测代码中的薄弱区域。\n-   对应用程序的性能进行基准测试，并识别出随着公司发展，软件解决方案中可能变得缓慢或无法使用的组件。\n\
  -   指出系统中的漏洞并提出修复方案。你可能会惊讶于仍有那么多系统可以通过 SQL 注入被攻破。\n\n二级贡献是最容易发现的。如果你能指出一项能为公司节省成本的变更，方向就对了。开发者常常思考如何通过解决方案来自动化手工工作。你所要做的就是量化你的成果。\n\
  \n将一个每周需要耗费数小时的手工流程自动化。量化节省的金额非常容易。对业务重要的任务比开发任务更有价值。如果你的想法能节省相当于你年薪的金额，那么要求大幅加薪就变得轻而易举了。\n\
  \n关于二级贡献，唯一的风险是你可能自动化了一些对公司无关紧要的事情。\n\n当你达到一级贡献时，奇迹就会开始发生。你将能够极大地放大你的努力成果。你不仅会获得高得多的薪水，还会被视为适合担任更高级别职位的人。一级贡献因公司而异。与你公司其他部门的人共进午餐，了解他们的需求。\n\
  \n例如，假设你为一家股票交易公司开发软件，而你自己也是业余股票交易员。在试用竞争对手的服务时，你发现了一个很酷的功能，可以更容易地观察市场趋势。你有机会利用你的领域专业知识，帮助公司引入这个功能，并与业务部门接洽，为其设计订阅模式。\n\
  \n或者，想象一下你的公司正在使用一项用户体验很差的服务。如果该服务足够容易实现和托管，你可以建立一个开源或付费的解决方案。\n\n一级贡献难度大且耗时。然而，有些开发者在这方面非常成功。我的一些同事在他们的产品基础上创立了衍生公司。这很辛苦，但今天，他们不必再为自己的薪水发愁，因为他们是自己的老板。\n\
  \n你应该已经对什么对公司重要有了概念。这就是反馈循环的作用所在。你所要做的就是选择一些贡献方式，并确保把它们从头到尾执行好。\n\n根据你提供的价值，为自己设定一个薪资目标。如果你计划提供四级、三级或二级贡献，你的目标很可能在薪资范围内。一些一级贡献会让你被视为内部创业者，你就能设定一个高于你职位最高薪资的目标。\n\
  \n### 不可抗拒的提议\n\n你必须构思一个快速有效的信息来传达你的主张。确保你直击要点，并且谈论价值。\n\n你和你的经理保持足够好的关系以讨论加薪，这一点至关重要。幸运的是，前五章已经为你和经理之间建立良好、开放的关系奠定了基础。\n\
  \n在家练习你的说辞，因为这关系到一大笔钱。你不仅是为了一份额外的金额而争取，也是在为你未来加薪设定一个新的基本薪资。\n\n如果你对讨论感到不自在，请回到“限制性信念”一节。请允许自己犯错，并且保持冷静。训练自己的一个方法是把自己对着镜头说话的过程录下来。你会犯错，你内心的批判会让你非常难受。然而，从长远来看，你会允许自己犯越来越多的错误而不再自我评判。犯错没什么大不了的，因为错误让我们成为人，而我们倾向于与人类共事。\n\
  \n允许自己犯错对你有好处。原因是，讨论你财务状况的会议几乎从来不会按照你想象的剧本进行。你无法排除讨论中另一方的角色，你必须准备好应对意外情况。\n\n接受事情的发展会与你想象的不同。接受你可能会犯错。接受你的领导可能会误解你的信息，你将不得不使用不同的词语来澄清情况。\n\
  \n制定一个不可抗拒的提议，最重要的元素是引人入胜的故事。你将有机会根据你的过往经验讲述一个好故事，突出你提议的实用性。人们对故事比对数字更有共鸣。回想一下创建简历的那一节，那也是在讲述一个故事。\n\
  \n第二个最重要的元素是，你应该将你的提议与对你的团队、经理或公司有用的某些业务成果联系起来。\n\n\n\n### 为什么我必须提供比仅仅要求加薪更多的东西？\n\
  \n你不一定非得这样做，但这完全合情合理。首先，如果你在某些方面具有特殊性，你就能收取更高的费用。其次，你会获得更多盟友，他们可能掌握着你所瞄准的预算的决策权。第三，你将与你的领导建立一种专业关系，而不是利用这种关系，这将在你的职业生涯中带来回报。\n\
  \n有时，你的市场价值和你的薪水之间存在巨大差距。在这种情况下，即使不提供其他任何东西，你的要求也有充分的依据。然而，如果不提供任何东西，你将错过很多好处。\n\
  \n万一你什么都不提供，请确保不要因为你的薪资状况而显得缺乏动力。\n\n我曾指导过一位软件开发人员，他给他的领导发了一封电子邮件，说他想赚更多钱，因为他觉得自己正在失去动力。他声称，他越快加薪，就能越快重获动力。显然，这条信息被精心包装在正式措辞和巧妙的语言之下。\n\
  \n我非常确定，这封邮件破坏了他与领导之间的信任。信任必须被修复。\n\n### 注意\n\n你的动力不是一种商品。一旦你试图利用动力作为筹码，损害就会造成，因为你失去了作为专业人士的态度。专业人士是内驱型的。\n\
  \n作为领导者，你不能期望每个人都遵循你的职业行为准则。不幸的是，大多数人依赖外部激励。打出“失去动力”这张王牌，要比承担起自我激励的责任容易得多。\n\n重要的是要认识到，有些人就是不愿接受承担责任和保持内在动力的负担，因为他们无法理解延迟满足。此外，我们生活在一个消费主义的世界里。通过提供各种体验即时满足的选择，消费水平被维持在高位。随着生活变得过于舒适，许多人倾向于失去内心的火焰，只过着享乐主义的生活。虽然从哲学角度来看，享乐主义生活方式或许并无大错，但其代价是，随着我们被鼓励待在舒适区，社会的生存技能开始萎缩。\n\
  \n“生存”、“责任”和“内在动机”这些词对某些人来说可能很可怕。如果你处于领导地位，你必须接受并与这些自然过程共存。\n\n在我早年，我曾相信我可以只雇用那些有责任感的人，这样我就不必面对这些问题。不幸的是，现实生活并非如此。\n\
  \n### 注意\n\n一个优秀的领导者能够与那些并非内在驱动的人合作并激励他们，并且能够协调和优化那些具有不同专业水平和责任心的人的工作。\n\n因此，当你为公司创造更多价值时，请接受并尊重那些为公司做出贡献、但与你观点不同的人。\n\
  \n#### 练习\n\n1.  考虑每周录制自己谈论不同话题的音频或视频。之后观看自己，观察你内心的评判者是如何批评你的。每周做这个练习，观察你是如何越来越允许自己做自己的。\n\
  \n2.  创建一份薪资调研文件。\n\n3.  设计你的陈述方案（Pitch）。\n\n4.  在反馈会议中验证你的陈述方案。\n\n5.  安排一次讨论薪资调整的会议。\n\
  \n6.  在会议前练习你的陈述方案。\n\n## 有效谈判的秘诀\n\n**本节目标：**\n\n*   不要自我困惑。理解如何停止为自己制造障碍。\n\n\
  *   学习如何构建你的信息，以便你的经理能轻松与你合作。\n\n*   探究一些假设情景背后的真相，以消除你的恐惧。\n\n没有一个通用的框架可以处理所有情况。然而，有一些指导原则可以帮助你。\n\
  \n首先，不要自我困惑！你的经理很可能会理解你的动机。\n\n如果你读过一些关于在谈判中要表现得像“阿尔法男”或“阿尔法女”的胡言乱语，请确保不要失去你的本色。首先，你不想显得咄咄逼人。其次，任何纯粹是演戏的技巧最终都会对你不利。别忘了，你计划与每天共事的人进行谈判。为你工作创造一个角色，再为谈判创造另一个角色，这很少对你有益。\n\
  \n有几个人告诉过我：“Zsolt，你应该读读克里斯·沃斯写的《掌控谈话》^(⁵²)这本书！”我读了，但我仍然要说，作为一名软件开发人员员工，谈判并非赚大钱的地方。\n\
  \n如果你经营一家企业或者是自由职业者，我理解你有时需要一点优势，尤其是当你面对商业鲨鱼或那些想以你为代价创造“赢-输”局面的人时。然而，作为一名员工，情况就不同了。如果你的雇主剥削你，作为一名专业人士，你有足够多的选择去爬上一架值得攀爬的梯子。\n\
  \n### 注意\n\n软件开发人员中普遍存在一种倾向，即将自己缺乏成功归咎于不懂如何谈判。虽然谈判技巧很实用，但仅仅专注于谈判而牺牲了绩效，可能很容易适得其反。记住，在心理上将责任外包给一些被炒得神乎其神的“神奇药丸”式技巧，是件很容易的事。虽然在某些情况下谈判技巧能帮到你，但它们并非旨在为你提供简单的解决方案，而承担责任恰恰是最简单的解决方案。\n\
  \n有些人确实通过应用一些虚假的技巧取得了成功。然而，正确的问题是，这些人是 *因为* 使用了技巧（尽管是以牺牲真诚为代价）而成功，还是 *尽管* 使用了技巧却依然成功？很多时候，答案是“尽管”。\n\
  \n大多数时候，你的经理给予你的帮助会比你以为的多得多。你所需要做的就是清晰地表达你的陈述方案。你必须提到你对公司很满意，并且你设想自己的未来在那里。然而，你遇到了麻烦，因为你发现了证据表明市场为你的服务支付了高得多的报酬。提及你还没有去面试是完全可以的，因为你信任公司。但是，你了解你自己，你不会白白让\
  \ `X` 数额的钱摆在桌上。考虑可能的加薪让你思考如何能为公司做出更大的贡献。\n\n然后，你可以提出你的方案。讨论的框架应该围绕着贡献的价值。你必须确保在讨论的这一部分结束时，你的经理感到满意。\n\
  \n然后，你可以请求你的经理帮助你达到你目标中的薪水。你可以告诉他，如果他需要证据，你准备好了一份薪资调研文件。向你的经理保证，该文件基于可信的服务，包含了相关数据的无偏汇总。到这一步，你的大计就完成了。\n\
  \n\n\n### 如果我的通知期很短怎么办？\n\n我个人就经历过这种情况，当时我只有几周的通知期。这会让你感到非常不安，尤其是当你产生恐惧和限制性信念，认为你会因为搞砸谈判而被解雇时。\n\
  \n没有人能保证你不会被解雇。即使你工作做得非常出色，也可能仅仅因为资金短缺而被解雇。问题在于，仅仅因为试图协商一份公平的薪水而被解雇的可能性有多大。\n\n\
  实际上，因要求加薪而被解雇通常是一个非常罕见的事件。你越优秀，公司替换你的成本就越高。我们谈论的是高达五位数（美元）的成本。公司替换你的成本，往往比给你要求的加薪并为此支付一年费用还要高。\n\
  \n我给你的建议是客观地看待你的处境。让你感到不安是否有实际原因？你与团队和经理的关系是否足够良好？是否有你可以改进的地方？\n\n显然，你也可以出去面试其他地方。然而，从你未来与公司关系的角度来看，告诉你经理你已经在别处获得了录用通知，并索要\
  \ `$15,000` 的加薪才能留下，并不是你能做的最好的事情，尤其是当你这个要求是突然提出的时候。\n\n如果有办法，我通常更倾向于在确保自己已尽一切努力在更稳固的基础上促成合作之前，不去其他地方面试。\n\
  \n### 如果我的经理认为我试图取代他/她的职位怎么办？\n\n这种情况非常不可能发生。但我之所以把这部分写进书里，是因为我不止一次收到这个问题。\n\n害怕不存在的情况是很自然的。我们百分之九十的恐惧都没有坚实的依据。让我们建立一些信念，让这种情况变得不太可能发生：\n\
  \n1.  从长远来看，合作总是胜于竞争。你的经理会意识到与你合作是互利共赢的。\n2.  在当今的就业市场中，你的赚钱能力不再直接取决于你管理的人数。这是上世纪\
  \ 90 年代的收入模式。关键技能带来关键回报。一系列独立的关键技能能推动公司前进。\n3.  当你读到这一章时，你已经收到了很多关于如何与经理建立基于信任的、开放关系的资料。很少有人能掌握如此程度的软技能。你坦诚透明，并且能完成工作。\n\
  \n### 如果我的经理不愿意帮助我怎么办？\n\n无论你做什么，总会有与经理关系不好的情况。我们并非身处乌托邦世界。\n\n在困难情况下与强势的经理谈判是一个棘手的话题。\n\
  \n首先，问自己一个问题：把自己生命中另外 1%或 2%的时间花在那些无法忍受你的人身上，对你来说有意义吗？\n\n我不会告诉你，你能在那些故意阻碍你进步的人身上创造奇迹。这种情况不太可能发生，但如果真的发生了，请注意，在办公室环境中争斗会造成双输的关系。始终保持专业。\n\
  \n我们的谈判技巧依赖于赢得领导者的信任，这并非什么大秘密。如果这种信任无法通过合理的努力获得，你就必须调整策略。原则仍然有效。尽管提出一个难以拒绝的报价要困难得多，但为每个人创造双赢的局面并非不可能。你仍然可以坦诚地告诉你的经理，你打算要求加薪。如果他说不，你可以联系另一个可能听取你想法的人，或者你可以询问人力资源部门如何表达你的利益。对此保持开放态度是可以的。\n\
  \n万一你的经理开始与你玩职场游戏，请保持职业的一面。如果你没有做错任何事，就没有理由担心。有些人玩游戏并滥用职权，仅仅是因为他们不够成熟。这些人常常会失去团队的信任并被解雇。然而，如果你没有明确的证据表明这种情况很有可能发生，就不要用这一节内容来困扰自己。你的经理会在毫无征兆的情况下开始破坏你的可能性微乎其微。\n\
  \n最坏的情况下，请确保你准备好应对一些不便。记录你的决定总是有用的，因为你将始终有足够的证据来反驳不合理的指控。事实往往能击败虚假的指控。专业性往往能化解坏脾气。\n\
  \n\n\n### 如果经理告诉我没有预算满足我的要求，该怎么办？\n\n无论发生什么，都不要把事情个人化。有时你的经理确实束手无策，而有时这看起来只是他们的一种托词。这正是你需要坚定自信的原因。\n\
  \n作为一名软件专业人士，你应该以在工作中展现坚定自信而闻名。因此，在谈判过程中，你能够从容地、无所畏惧地代表自己的利益，同时也兼顾公司的利益。\n\n如果你的经理告诉你没有预算，他理应了解具体情况。他应该清楚你的市场价值，也应该明白你对公司的价值。他很可能非常清楚失去你所要付出的代价。\n\
  \n如果你在谈判前已经表现得足够出色，那么你的感知价值与薪水之间就会存在明显的差距。因此，你的经理将很难直接拒绝你。他会知道，对你而言，离开公司并在别处赚取更多薪水并非难事。\n\
  \n因此，你的经理很可能会持开放合作的态度。你只需要对当前的预算状况表示理解，并请求制定一个达到你目标薪资的计划。\n\n表明你愿意就贡献程度进行协商，并且始终乐于接受额外任务。然而，从长远来看，表现出甘于接受远低于自身价值的薪酬，对你来说毫无意义。\n\
  \n你能传达出的最糟糕的信息，就是表示你理解预算状况，并且没有那么急需那笔钱。在某些场合保持谦逊很重要；但是，当你贡献了巨大价值时，你必须能够接受自己应得的回报。\n\
  \n你的策略是让你的经理尽可能保持诚实。同时，你也以诚实和透明作为回报。这是一种双赢的局面。\n\n构成你策略的各个要素如下：\n\n-   你贡献了巨大的价值。\n\
  -   你愿意在未来贡献更多价值。\n-   你坚定地致力于创造双赢的局面。\n-   你在就业市场上炙手可热。\n-   你足够坚定，能够去争取你想要的条件。\n\
  -   你仍然给予公司优先权，让他们决定是否想留住你。\n\n这些都是你“无法拒绝的提议”的基础。\n\n站在你经理的角度思考一下。不带任何偏见地想想，如果你本有机会给你的同事加薪，却对他说没有预算满足要求，这会多么容易说出口？破坏那个可能成为你在推动公司发展过程中的盟友之人的进步，对你来说又有多大意义？你决定试图开除这位同事的可能性有多大？这甚至有可能吗？\n\
  \n一旦你仔细思考了这些问题，你就会明白自己的处境有多强势。你不需要 FBI 的人质谈判技巧来为自己争取更高的薪水。显然，相信你只需要一些秘密技巧的观念很有市场，而且看起来比我的方法省力得多。你甚至可能通过谈判技巧获得一些回报，但这只是你通过坚定自信、努力创造双赢局面所能取得成果的一小部分。\n\
  \n成就感是另一个因素。如果你还记得第二章中关于享乐幸福和实现幸福的部分，那么更多的钱或许能带给你一些暂时的快乐。然而，有所回报并带来改变，可能会带给你持久的幸福。个人成长并在你的影响范围内做出改变，会带来实现幸福。\n\
  \n#### 练习\n\n1.  检查你“无法拒绝的提议”中的每个要素。根据你自身的状况，给每个要素从 0 到 10 打分。然后问问自己，从今天开始，需要做些什么来改进这些方面。一旦你对这些要素充满信心，你就走上了为自己谈判加薪的正确道路。\n\
  \n## 通过表达感激来建立持久的关系\n\n**本章节目标：**\n\n-   理解持久职业关系的价值。\n-   学习如何在谈判后采取后续行动。\n\n如果你的经理表现出与你合作的意愿，请展现你对这种合作的感激之情。即使几个月后你接受了另一份工作机会并离开了公司，表达感激之情也能让你将来有机会与现团队的成员再次合作。无论谈判结果如何，你和经理之间的情感平衡都可以保持积极状态。\n\
  \n世界很小。你永远不知道何时会再次与你的经理合作。你也永远不知道何时需要一份关于与你共事感受的推荐信。更重要的是，人生苦短，没必要自断后路。建立良好关系、构建信任，会带来双赢的局面。\n\
  \n### 谈判之后会发生什么？\n\n假设你计划提供更多价值，那么你与公司的关系将比以往任何时候都更牢固，尽管他们付给你的薪水比以前更高了。为了巩固这种积极的关系，现在轮到你加倍努力，做好你的工作了。\n\
  \n交付超出承诺的成果，是未来获得加薪和升职的基础，并将加速你的进步。在专业层面上，你的技能将得到提升，使你的经理能够赋予你更多责任和更大自主权。\n\n记录你的成就，并向你的主管汇报完成了什么以及何时完成的。\n\
  \n很多关于薪资谈判的课程从未强调加薪后会发生什么。从心理学角度看，一旦人们获得了期望的外部认可，确认自己的服务价值更高时，他们的自信心就会增强。\n\n保持谦逊是提升自尊的关键。了解自己的价值，并通过加倍努力来表达感激之情。\n\
  \n#### 练习\n\n1.  谈判结束后，你只有一项任务：制定一个履行承诺的后续计划。确保你学到所有需要的东西。创建并记录你的里程碑，并向你的主管汇报你的进展。\n\
  \n\n\n## 挽留式加薪的阴暗面\n\n**本节目标：**\n\n-   了解当你并不想离开现雇主时，为何利用外部 offer 进行谈判会导致双输的局面。\n\
  \n安迪很沮丧，因为他没有得到自己认为应得的经济认可。因此，他进入就业市场开始寻找其他公司。一位猎头联系了他。安迪起初对自己期望的薪资犹豫不决。这位猎头在处理求职申请方面经验丰富，他向安迪保证，自己是代表安迪的利益。安迪松了一口气，并告诉了他的猎头自己的薪资期望。\n\
  \n在审核了一些不相关的 offer 后，安迪最终面试了一家他喜欢的公司。他感觉有点糟糕，因为他更喜欢现在的公司，尽管薪资较低。如果能挣得更多，他根本没有理由离开现在的雇主。事实上，他现在的工作在专业上更具挑战性。\n\
  \n面试结束后，安迪的猎头问他，现雇主是否有可能会给出一个挽留式加薪方案。安迪不得不表示这不太可能，因为公司给他的薪酬一直严重偏低。\n\n安迪收到了一份符合他期望的\
  \ offer，感到非常兴奋。他看到一个数字在他面前呈现。这个数字他已经梦想了好几个月。\n\n第二天早上，安迪醒来时感到害怕、内疚和沮丧。他想留在现在的雇主那里。然而，他什么也没做来促成这件事。\n\
  \n安迪不得不与他的主管召开了一次紧急会议。安迪的主管表示，他已经在计划给安迪加薪了。此外，公司对安迪的工作非常满意，而且他们无法很快找到接替他的人。\n\n\
  当人力资源部、总经理和安迪的主管正在讨论加薪事宜时，安迪的猎头打来许多电话和发送 Skype 消息，催促他促成这笔交易。这对猎头来说关系到一大笔钱，因为他如果促成这笔交易，可能获得五位数的收入。如果安迪的现雇主成功留住了他，猎头将一无所获。\n\
  \n### 注意\n\n如果猎头成功让你被公司录用，他通常能赚取你年薪的 15-20%。这就是为什么有些猎头相当咄咄逼人。\n\n最终，安迪不得不在两个优厚的\
  \ offer 之间做出选择。无论他如何选择，只要出去找找机会拿到一个 offer，他就能挣到更多的钱。表面上看起来，安迪似乎稳赢。但这种方法仍然有些不对劲。\n\
  \n首先，安迪表现出了不成熟和不专业。在晋升方面，他成功地破坏了自己与公司的职业关系。高层职位需要更多的自主权、更多的信任和更高的成熟度。\n\n其次，通过这种方式获得加薪，未来很容易让你付出高昂代价。从长远来看，公司可能会阻碍你的进步，因为他们希望在你身上获得更高的投资回报。\n\
  \n第三，接受挽留式加薪后，你的处境不会有太大改变。只要犯一个大错，或者开始表现不佳，你的经理们就可能轻易开始怀疑你。\n\n### 注意\n\n我观察到，在大幅加薪后，人们有时会放松下来，因为他们得到了自己为之奋斗的东西。许多经理都知道这种效应。即使那些不知道的经理，如果你不再表现优异，他们也更有可能注意到。不要仅仅因为你加了薪就放松努力，因为这样做得不偿失。\n\
  \n第四，你的自尊心可能会受挫，而你的内疚感可能在一段时间内都不会消失。\n\n请注意，利用外部 offer 并非获得加薪最干净的方式。这是一种懦弱的行为，源于我们未对自己的行为负责。\n\
  \n一些自恋型自信的人不断告诉自己，自己值得更高的薪酬，公司是在剥削他们。作为“惩罚”，这些人开始去其他地方求职。鉴于自恋型自信是对缺乏自信的一种过度补偿，这些人不得不寻求外部认可来证明自己的价值。\n\
  \n一旦拿到 offer，这位开发人员就回到了自己的公司。公司处理紧急情况，动用了额外预算，批准了加薪。这个过程的一个副作用是，信任可能永远无法恢复。\n\n\
  为了将来能侥幸获得一次紧急加薪，不论你是否持有外部 offer，你的工作都必须极具价值。\n\n在本节中，我们将探讨一些在特定情况下利用挽留式加薪时出现常见问题。由于每种情况都不同，你可能会选择用一份挽留式加薪来给自己撑腰，即使你并不需要它。这有时很重要，否则你就没有勇气去执行你的自我主张策略。因此，尽管挽留式加薪通常是不必要的，但在某些特定情况下，它仍然能派上用场。\n\
  \n### 挽留式加薪总是有害的吗？\n\n并非如此。在某些情况下，这是获得加薪的唯一途径。然而，问问自己，这次加薪对你来说值得吗？根据我的经验，90%的情况下，接受另一份\
  \ offer 并在别处继续发展你的职业生涯要明智得多。\n\n### 如果我处于试用期怎么办？\n\n你已经阅读了大量关于如何基于情商、同理心和自信沟通来建立职业关系的建议。你也有机会战胜内心的恐惧和限制性信念。只要你制造一个极具吸引力的条件，被解雇的几率就会被降到最低。\n\
  \n如果一份外部 offer 能给你带来完成这个过程所需的心理安慰，那么获取一份外部 offer 对你来说是完全合理的。然而，如果你能把握好提出请求的时机，很可能你甚至无需透露你已有其他\
  \ offer。在试用期期间，在不提及另一份 offer 的情况下成功谈判加薪，会让你信心大增。\n\n如果你仅将外部 offer 作为万一被解雇时的一种可能的安全网，那么这种策略就行得通。一旦你得到证据表明你不会被解雇，就继续与你现任雇主建立关系。\n\
  \n### 如果我没有其他选择怎么办？\n\n你可能处于一种离开现雇主损失巨大的境况。\n\n例如，你可能在一个小城市，那里只有一家很棒的公司可以为之工作，而你的下一个选择在几百公里之外。办公室恋情也可能是你不想离开现任雇主的另一个原因。无论你的理由是什么，有时你可能比正常情况下要损失更多。\n\
  \n如果你有充分的理由留在现任雇主那里，那么打造一个极具吸引力条件的各个组成部分就更加重要了，因为你计划在你现任雇主这里度过职业生涯中相当重要的一部分。\n\n\
  \n### 如果企业官僚主义阻碍我，该怎么办？\n\n安德烈亚斯在一家跨国公司担任 IT 工程师，工作表现出色。他忙于工作，以至于没有注意到同事们占据了关键职位。\
  \  \n只要安德烈亚斯忙着，他的经理就乐得让他维持现状，因为他看起来像是一位非常高效的工程师。\n\n当安德烈亚斯开始明确表示想涨薪时，经理告诉他，公司流程不允许特殊加薪，除非启动紧急加薪申请流程。然而，经理对此并不感兴趣，因为他即将离开团队。\n\
  \n安德烈亚斯有了新经理，这位经理对流程非常不熟悉，也完全不了解安德烈亚斯的薪酬状况。他必须从零开始建立信任，并且需要付出额外努力，请求他的经理走流程来兑现前任经理的承诺。这耗费了大量时间，因为安德烈亚斯优先考虑的是不造成太多麻烦，而不是自己的利益。\n\
  \n问题出在哪里？安德烈亚斯是一位出色的专业人士，但他的问题在于，为了晋升到高层，他未能展现出必要的自信。一旦安德烈亚斯开始变得自信，他完全有能力迅速攀登任何企业的晋升阶梯。原因在于，安德烈亚斯是一个真正的奉献者。一旦他专注于集中精力，他也会在这个过程中收获回报。\n\
  \n要自信地要求加薪，一个必要条件是将承诺书面化，特别是当你得知你的经理可能离职时。\n\n### 如果我处于财务紧急状况，该怎么办？\n\n回想一下你上次飞行时的安全须知：当氧气面罩落下时，先帮助自己，再帮助他人。\n\
  \n处理紧急情况没有固定规则。如果需要外部 offer，就去争取。但请注意，有时你的领导无需你拿到外部 offer 也能帮助你。\n\n如果你要求加薪，遵循与没有紧急情况时完全相同的流程。你的财务状况与加薪本身无关，除了你提出请求的时机和紧迫性。不要在工作场合利用你的财务困境，因为这既不专业，也适得其反。\n\
  \n确保将损失降到最低。如果你觉得损害了与雇主的关系，可以告诉你的领导，你理解情况特殊，并且你有非常充分的理由坚持你的计划。非常时期需要非常手段。在你所处的境地，大多数人会不惜一切代价筹集足够资金来解决问题。\n\
  \n### 总结\n\n在本章中，你已经了解了何时以及如何要求加薪和晋升，如何处理极端情况，以及获得加薪后该怎么做。\n\n请注意，你的经理可能需要执行某些流程，这些流程会限制你加薪的时间。因此，选择合适的时机提出请求会带来回报。\n\
  \n你还需要考虑恰当地陈述你的请求。在本章中，你看到了如何创造令人无法拒绝的条件，以及如何用数据来支持你的调研。\n\n一旦准备好说辞，你就需要进行陈述。保持真诚往往比尝试你不熟悉的方法更好。\n\
  \n如果你得到了想要的结果，要表达感激之情，并且不要吝啬你的努力。\n\n虽然通常无需拿到外部 offer 就能获得期望的加薪，但在某些情况下，你最好的选择是离开当前雇主，寻找新的机会。因此，在下一章中，我们将重点讨论如何寻找新工作。\n\
  \n脚注 1 2 3 4\n\n"
- '# 7. 获得你的梦想工作


  专业软件开发者成功面试指南


  在作为软件开发人员工作了 10 年之后，我在执行和参与面试流程方面都积累了经验。许多求职者之所以挣扎，是因为他们很少能得到可以用来提升自己技能的反馈。


  尽管我个人不同意不向求职者提供反馈的做法，但我能理解世界就是这样运作的，这是我们不得不接受的。通过主动请求反馈，你可以最大限度地获得反馈的机会。


  面试的心理层面也很艰难，因为你时不时会被拒绝。即使是最优秀的开发者有时也会被拒。我们将重点讨论如何最大化你被录用的机会。我们将同时关注面试中的人力资源和技术方面。尽管这本书并非关于编码谜题，^(⁵³)
  但我将详细阐述解决编程任务以及发挥自身最佳水平的思维过程。


  在第一部分，你将读到两个技术面试的故事。我是根据自己面试过 500 多名候选人的经验，塑造了这两个角色，重点突出了心态，并省略了我当时寻找的大部分主观标准。


  第二部分是关于进行你的研究。在向目标公司发送简历之前，值得先对其做一番研究。我将举例说明哪些该做，哪些不该做。


  在第三部分，我们将从非技术的角度涵盖面试情景。你会发现提出正确的问题是多么重要。你还将了解到在回答问题时保持诚实的重要性。


  在第四部分，你将了解更多关于通过技术面试的内容。你将学习如何展示你的思维过程，以及如何让面试官成为你的盟友。我们还将讨论如何完成面试前的作业任务，以及在面试中讨论你的任务时需要注意什么。


  第五部分是关于有效的薪资谈判。你将获得一些基于常识的策略。


  最后两部分将为你提供两份清单，分别针对有经验和无经验的求职目标。这些清单作为总结，帮助你检验在本书中学到的内容。


  ## 两个技术面试的故事


  **本节目标：**


  *   比较和对比一位成功候选人 and 一位不成功候选人的表现。

  *   了解成功的候选人如何留下持久印象。


  两位候选人，一个目标：在一家科技初创公司获得软件工程师的职位。两位候选人都拥有同样令人信服的过往业绩。


  表面上，两位申请人马特和戴夫之间没有太大区别。他们甚至在准备申请材料上投入了相近的精力。然而，他们之间的差异很快就会变得明显。


  马特在面试中惨败。在回家的路上，他可能一直在想为什么自己总是碰到难题。他认为一切都很顺利，直到他遇到了一个起初看起来非常简单的问题。


  戴夫不仅轻松获得了工作机会，还拿到了比该职位最高预算工资还要高的起薪。他还获得了一条成为首席开发人员的职业发展路径。戴夫对这一 offer 非常满意，并为自己再次通过了面试而感到自豪。不过，在回家的路上，他在想自己应该接受哪个
  offer。


  为什么戴夫比马特成功得多？从不同角度观察这一情景，在本节结束时，你也会得出结论：成功总会留下线索。有时，为何一位候选人得到工作的机会比另一位高出一百倍是显而易见的，即使成功的候选人要求的薪水要高得多。




  ### 申请流程


  为简单起见，我们将重点关注申请流程的以下几个方面：


  1.  申请材料

  2.  HR 面试

  3.  家庭作业

  4.  技术面试

  5.  薪资谈判


  我们将逐一分析每个方面，并比较两位候选人的表现。


  所有公司都有不同的申请流程，不同的面试官看重的方面也各不相同。在某次面试中有效的方法，在另一次面试中可能并不适用。


  ### 申请材料


  马特和戴夫的表现都足够出色，成功引起了注意。他们在简历中展示了相关经验。


  马特经验更丰富，但相关经验较少。马特的申请材料中唯一让我担心的是，他对自己不仅按年、甚至按月来计算工作经验感到自豪。显然，在市场价值上，10 年经验要比 2 周经验多得多。然而，在超越一定熟悉程度之后，工作年限与工作表现之间并不存在相关性。关于这一现象有多项研究。例如，在汤姆·德马克和蒂莫西·李斯特合著的《人件：生产性项目与团队》^(⁵⁴)一书中，对“编程战争”游戏进行了分析。拥有
  10 年经验的人并不比拥有 2 年经验的同行表现更出色。工作表现与熟悉程度之间的正相关性只有在经验低于 6 个月时才开始形成。


  表面上看，这似乎与我的文章《设计你的职业生涯——做到极致，让他们无法忽视你》^(⁵⁵)相矛盾，在那篇文章中，我引用了 10000 小时刻意练习的法则。^(⁵⁶)


  通过理解什么是刻意练习，这个悖论便能迎刃而解。刻意练习需要全神贯注的努力。它是一种拓展式的锻炼，让你走出舒适区并扩展它。它要么是一种心流状态下的练习，让你深度沉浸其中以至于忘记时间；要么是刻意掌握和完善某个活动的步骤，直到达到所需的标准。


  这就是为什么工作年限并不能很好地反映用于刻意练习、走出舒适区和深度工作所花费的时间。一些热衷者每天练习 4 小时，每年练习 300 天。在 2 年内，他们积累了
  2400 小时的刻意练习。一个更放松的开发者每年可能花在刻意练习上的时间不足 100 小时。


  因此，假设马特和戴夫在其专业领域都拥有最低限度的可接受的相关经验，我选择不被工作年限这个指标所打动。不过，我仍留意了马特按月计算经验的做法，因为这显然是一个不合常规的指标。


  我记得另一位拥有 5 年经验的开发者曾声称，他整个职业生涯中编写的代码超过 10 万行。这个说法就好比一个健美运动员说他整个职业生涯中吃掉了 300 万千卡的食物。


  如果你在太多地方提及工作年限，人们很可能会将其解读为*显性影响*。*叙事性影响*则更富有成效，因为它能让招聘方自行得出结论。


  戴夫的简历要简洁得多。他写下了所有我们认为相关的内容，并省略了不重要的技能。毕竟，罗列微软 Excel、驾驶执照和 Haskell 知识并不会增加马特的机会。少即是多。


  马特的求职信全是自夸。信中以“凭借我 6 年的经验、资历和成就，我相信自己将成为贵公司宝贵的财富”这句话结尾。这是他在求职信中唯一一次提及我们公司。


  戴夫则随和得多，脚踏实地，待人友善。他也很不拘礼节。他表达了在读到我们的招聘广告时是多么高兴，因为他一直渴望在一个能够充分发挥其专业特长的工作环境中工作。这封求职信听起来像是他真心在乎我们是否能够合作。


  我还研究了他们的领英推荐信和 GitHub 主页。两者都很前沿。马特在 GitHub 上似乎有更多测试项目。戴夫在一个开源仓库中收集了数百颗星，后来发现有一家公司正在商业使用这个仓库。


  马特有一个博客，写了五篇短文。拥有博客总是好的，即使它并非前沿。但博客质量欠佳。它看起来像是马特为了展示自己有个博客而创建的。我个人仍将他的博客视为一个积极的因素。


  戴夫有一个个人作品集网站，展示了他的开源贡献，包括一些演示。他还写下了自己的人生使命。读起来非常有趣。


  总而言之，从技术角度来看，马特和戴夫都足够有趣。戴夫明显领先，但到目前为止，两人都未曾在面试环境中展现出任何实质性的成果。


  ### 行为面试


  马特继续施展显性影响。他以牺牲团队为代价来强调自己的成就，有时还会抱怨他曾工作过的每个团队都有缺陷，以及自己如何优秀。他并没有就公司或其产品提出太多问题。


  马特似乎对工作以外的事情不太感兴趣。他还提到，他的首要兴趣是发展自己的能力。


  面试快结束时，马特开始询问加班政策、请假规定以及该职位相关的福利。他说这些信息对他很重要，因为过去他因工作量过大而压力重重，正在寻求一种平衡的生活。


  马特几乎没有费心透露任何关于他个性的信息。他保持着职业化的风格。毕竟，这次面试对他来说或多或少只是一种形式。他确实询问了申请流程的下一步。最后，HR 经理和马特都如释重负地离开了面试室。


  此时，有些 HR 经理甚至会因为候选人对公司缺乏兴趣，而向最优秀的专业人士关上大门。马特并没有给 HR 经理留下持久的印象。他的处境勉强让他得以凭借这种态度过关。


  戴夫迟到了 10 分钟。他为未能准时到达而道歉，并向 HR 经理保证他没有迟到的习惯。道完歉后，他没有开始解释原因，只是坐下，神态自如。


  我记得有一次，我因为交通事故面试迟到了将近半小时。这类事情时有发生。你能遇到的最坏情况是失去专注力。找借口和自我解释是相当无用的。


  戴夫保持专注，开始向 HR 经理一个接一个地提出问题。问题的质量和数量让 HR 经理由衷地感到惊讶。过了一会儿，戴夫也意识到 HR 经理也想问问题。


  假装兴趣和展现真正兴趣之间有着天壤之别。戴夫对公司、他未来的职位以及同事，包括他正在谈话的 HR 经理，都充满了好奇。戴夫并非急功近利地试图留下印象，而是尽力收集尽可能多的信息，以判断这份工作是否适合自己。某种意义上，他才是那个待价而沽的奖品，而公司则是竞标他服务的一方。


  面试结束后，公司已经对戴夫留下了极好的印象。至于马特，他做了通过所有测试所必需的最低限度努力。他的资历和经验表明他是合适的人选，然而，他显然没有付出额外的努力。




  ### 作业任务


  两位候选人在完成所有要求的功能方面都表现出色。马特的速度非常快；他清楚自己在做什么。他从下载作业开始计算，总共花了 1.5 小时完成任务。戴夫完成同样的任务则用了
  3.5 小时。


  马特正确理解了需求说明，并充分实现了所有功能。这些功能或多或少还算健壮；只是这里那里存在一些小错误，以及一个他忽略的重大缺陷。


  观察代码可以发现，马特在一些较复杂的功能上明显遇到了困难。他的一些方法看起来更像是基于试错写出来的，而不是经过妥善规划。


  在马特的作业中，应用程序里没有统一的注释风格，并且在需要注释的地方明显缺失了注释。


  文档也完全缺失。尽管这不是硬性要求，但文档有时甚至能为开发人员节省时间。例如，与其实现一段处理边界情况的明显代码，不如直接记录预期的输入格式，并将完整的解决方案列为改进建议，表明你愿意应要求完成它。这样开发人员节省了时间，面试官也会知道功能缺失并非由于疏忽或意识不足。


  马特又一次勉强通过了关卡。他快速完成了所有功能，因此没有理由拒绝他。然而，至此，关于软技能和问题解决能力的警示信号已经出现。这些警示将在第二轮面试中进行考察。


  尽管被要求完成所有功能，戴夫却未能实现最后一个功能。他在文档中写道，由于时间不足他省略了该功能，但如果其余代码不够有说服力，他愿意在接下来的版本中实现它。


  戴夫的文档堪称完美。安装说明、假设条件以及软件设计考量都清晰地表明，其实现背后有一个顺畅的思考过程。


  戴夫声称他在实现过程中实践了测试驱动开发。的确，所有测试都显示出精心的设计。我很快回想起马特甚至没有编写任何测试。马特和戴夫都在自己的技能描述中提到了测试驱动开发。然而，戴夫在自己的任务说明中明确表示，他总是以
  100%的测试覆盖率为目标。一看到这个任务，我就得出结论，这绝非空话。即使在没有要求的情况下，他也提供了测试覆盖。


  所有已实现的功能都完美无瑕。我花了 10 分钟尝试用不规范的输入来破坏这个解决方案。我习惯于进行这种“猴子测试”，这项技能在我的职业生涯中非常实用。令人惊讶的是，我只能发现一处微小的不一致。我甚至不能明确称其为缺陷。在更深入地检查代码之前，我记录了这个不一致之处以备后用。


  代码本身组织良好且注释一致。即使没有注释，我也能轻松理解代码。


  ### 备注


  “聪明程序员与专业程序员的一个区别在于，专业人士明白清晰至上。专业人士善用自己的能力，编写他人能理解的代码。”——罗伯特·C·马丁，《代码整洁之道》


  经过所有调查之后，再去追问那个缺失的功能已经没有太大意义了。戴夫已经展示了他对工艺的态度。


  ### 技术面试


  马特技术面试的目的是，确定他是否是一个足够好的备选方案，以防戴夫拒绝我们。


  戴夫技术面试的目的，则更像是要说服他，他的技能将得到最大化利用，并且他能在我们这里获得远超他处的人力资本，这意味着他在这里能比在其他地方成长得更快。


  在这一点上，马特显然相信他已经出色地通过了所有关卡。他满怀信心地来了。


  我问他是否有任何问题。他问了几个关于我们技术栈的问题；然后他询问了我们的开发方法。到目前为止一切顺利。接着他问了一个关于加班的问题，随后又问了绩效考核周期的问题。他最后一个问题是关于福利，比如是否有参加会议的预算。


  这些问题暴露了他自私的本性。首先，他在寻求舒适；然后，他在寻求回报。自私本身没问题，只要你能提供足够的人力资本作为回报。一定程度的自私是不可避免的，无论是对于个人生活还是职业生涯。回想一下飞机起飞前观看的飞行安全演示：“一旦氧气面罩落下，请先帮助自己，再帮助他人。”


  马特是否有足够的人力资本可以贡献？我们很快就找到了答案。我要求马特修正他作业中的一些小错误。马特没有专注于解决方案，而是专注于道歉。他表达了自己多么不喜欢这些错误，以及他通常能抓住这类错误。我告诉他没关系，因为我们都会犯错，并让他在代码中修正。


  我向他展示了另一个小错误，然后是他代码中最重大的错误。道歉对他来说变得越来越难堪。就在这时，马特意识到自己的机会正在减少。


  对马特来说不幸的是，这个主要缺陷是个硬骨头，他花了大量的时间和指导才修复。令我警觉的是，他没有记录任何有助于他解决问题的信息；他反而把一个长达 30 行的方法当作一个黑箱来处理，并同时测试了两处修改。他实际上非常幸运地修复了错误，而没有引入另外两个错误作为副作用。在观察了他的思考过程后，我给了他最后一次证明自己的机会。


  马特接到了一个技术谜题，这个谜题只要求解决问题的能力。马特需要理解一个问题，制定一个解决方案，并用大约十行代码实现他的计划。尽管他可以访问所有资源，他可以谷歌任何他想要的东西，他也可以向我提问。但他的解决问题能力就是不到位。他开始过度复杂化他的解决方案，并落入了自己设下的陷阱。


  我们很清楚，即使没有雇佣戴夫，他也不会得到这个职位。从马特的角度来看，可能很难理解这个决定。


  开始面试戴夫时有点令人担忧，因为我们有招聘压力，而且没有备选。在介绍性谈话之后，戴夫掌控了面试节奏，他主动聊起了公司的领导风格、使用的技术和开发方法，甚至对团队的历史表现出了兴趣。


  我确信他的词汇知识非常出色，这是源于兴趣发展而来的。


  然后我们转而讨论作业任务。我描述了戴夫代码中的一个小缺陷。他笑着说：“抓得好。”他立即跳进他的测试套件，编写了一个失败的测试，并在一分钟内修正了代码。一旦他的测试通过，他演示了应用程序的运行。这个过程让我确信，不仅缺陷被修复了，而且在更改之后没有其他测试报告任何失败。


  解决问题的任务对他来说同样简单。戴夫解释了他的方法，并在 5 分钟内将他的思考过程转化为可工作的代码。


  面试的其余部分只是走个形式。我们一起解决了一些我在工作中遇到的问题。戴夫只在其中一个问题上卡住了，但即使在那里，他也展示出了出色的思考过程，并为解决方案做出了贡献。马特甚至没有到达面试的这一阶段。




  ## 谈判风格


  马特并没有机会谈判录用条件。我们所知的只是他在面试中一直在试探额外福利，并且尽力限制加班等自身风险。他常通过显性影响力来展示自己的价值，表达自己对自身经验和知识的见解。然而，当涉及隐性影响力，也就是真正需要大放异彩的时候，他却缺乏职业资本。


  戴夫则是一位自信的谈判者。他不会使用"在我们透露薪资范围前绝不透露自己薪资"这类技巧。相反，他非常清楚自己的服务价值几何，也对我们公司的薪酬范围了如指掌。如果他的报价与我们的预算不匹配，他甚至会准备好列举所有研究来源来佐证。


  戴夫只是说："我知道我要求的薪资较高，可能略微超出贵公司的预算范围。但如果贵公司选择录用我，我会尽全力证明这稍高的投入是值得的。"


  额外的好处是，我们在面试中聊到了他的职业抱负。戴夫表达了对带领小团队的浓厚兴趣。虽然他没有获得一个明确的领导职位，但他得到了两个承诺：一年内的工作表现评估，以及一个他可以主导的项目。此外，他还获得了公司领导力培训的全部权限。


  戴夫最终获得了录用。思考一下你自己的处境：你希望成为马特还是戴夫？想一件你现在就能做、并能提升自身机会的事。今天就开始行动，积蓄势能。


  ### 你的面试入场券


  **本部分目标：**


  -   研究职位和公司。

  -   定制并精简你的申请材料。


  在本部分，我们将把你第四章学习和创建的所有内容，运用到申请具体职位的场景中。记住，你必须根据你所申请职位的要求来定制你的申请。


  #### 做好研究


  有些人会定期用一份通用的简历向大量公司海投。很多开发者会想："高级 Java 开发职位？没问题，我有 PHP、Python 和一些 JavaScript 的经验。凭我的经验，总会有公司要我的。"


  这些开发者的申请材料回复率通常很低。多年来在审阅简历的过程中，有几个申请人的名字让我感到眼熟，不是因为他们有多么优秀，而是因为他们坚持不懈地每 3 到 6 个月就给我发来同样的简历。每当我们设定一个新职位，无论职位性质如何，那个我记忆犹新的人的申请很快就会到来。他们的策略在其他地方想必也相当不成功，因为他已经这样申请了好几年。像他这样的人一直在坚持不懈地申请，就盼着有人能忽略他们与岗位需求明显不符的事实。


  其中一些开发者可能会付出更多努力去说服招聘团队他们是合适的人选。


  科技公司的主要担忧之一是雇用到不会写代码的人。因此，许多公司会采用一些技巧来筛选申请人，收集他们具备足够编码能力的证据。如果你没有展示出在所需编程语言或技术方面的专长，那么你很可能只有在所有其他经验匹配的候选人都被考虑之后，才能获得面试机会。


  即使你缺乏某项技术的专业经验，你仍然有可能进入第一轮面试。你的职业发展道路应该合情合理。在求职信中，*预先铺垫*一下情况是明智的。你可以写明你的大部分职业生涯都在使用技术
  X 和 Y，并且你的技能可以迁移到技术 Z 上。作为证明，可以附上一个你学习和使用过技术 Z 的开源项目仓库。记住你的学习计划，并将其付诸行动。


  如果你无法展示任何关于某项技术的经验，也不要气馁而不去申请。你的机会可能会更低，但有些公司正在寻找具有解决问题能力或良好文化契合度的人，即使他们并不专精于某些对其职位至关重要的领域。


  ### 注意


  候选人的自我设限常常使他们在提交申请之前就先否定了自己。许多申请人认为他们必须满足职位描述中的每一点要求。实际情况并非如此，并且获得工作机会的申请人往往不是满足职位要求最多的人。


  尽力定制你的申请。突出与公司需求相似的技能，让你的求职信脱颖而出。瞄准最佳的文化契合度。你或许能在面试中与公司的现有员工建立联系，并说服他们，在正式入职时你就能熟练掌握他们所需的技术。尽管你的机会低于满足所有标准的人，但也值得记住：不申请，录用你的机会就是零。


  如果你认真对待一份申请，那就去研究这家公司正在做什么。观看他们的职业发展视频，搜集关于公司的资源。


  早在 2016 年，我曾研究过声田。你可以获取关于他们办公室的信息，了解他们的工作方式以及他们认为重要的价值观。你可以研究你将与之共事的人，访问他们的领英（LinkedIn）个人资料。然后，你可以深入了解他们的技术栈，并直接阅读来自声田员工的科技博客文章。想了解更多关于职业发展步骤的信息？博客上就有。接着，我继续寻找并观看了关于声田工程文化的视频。看完视频后，我自问：有什么变化？然后我偶然发现了一篇文章，详细解释了为什么声田不再使用个人目标和关键成果（OKR）。你看，这就是面试中可以提出的绝佳问题。如果你研究亚马逊的招聘流程，你甚至能找到更多信息。


  研究一些公司可以让你走得很远。如果你发现某家公司确实存在严重问题，你可能会拒绝一些你不想为之工作的公司。最好的情况是，你会因为渴望见到他们而变得非常热情，从而创造出绝佳的面试氛围。


  我强烈建议使用 Glassdoor 来研究在一家公司工作是什么样的体验。不过要小心。有些人可能会在离开一家不错的大公司时心态不佳。这些人往往会给出偏负面的评价。有些公司则鼓励正面评价，甚至伪造好评，以便在候选人眼中显得更好。因此，我建议客观地看待评价，并提取对你有用的信息。


  不要告诉面试官你在 Glassdoor 上研究过他们。这是敏感信息。在不太可能发生的情况下，如果他们问起这个问题，你可以诚实地回答说你显然使用了 Glassdoor
  作为信息来源。然而，试图通过询问关于 Glassdoor 评价的问题来与公司拉近关系，对你来说意义不大。


  你的研究还包括谷歌搜索你的面试经历。Glassdoor 有一个面试专区，谷歌还会为你揭示许多其他秘密。即使有些信息已经过时，你可能仍然能获得一些参考点，以便在面试中做到最好。请不要滥用这些信息来获取本不属于你的工作机会，那对所有人来说都将是一个双输的局面。不过，你利用从合法渠道找到的信息，这是合情合理的。




  #### 量身定制你的求职材料


  我知道有些人说，你必须聘请一位专业的简历写手，花费 500 到 800 美元来制作一份尖端简历。这样做你可能会获得宝贵的经验，因为它可能是一次很棒的学习经历。然而，这并不是提高你求职成功率最具成本效益的解决方案。


  第 4 章对你也是一次学习经历，你已拥有制作专业简历所需的一切。


  量身定制你的求职材料是能带来最大成果的任务。使用一份专业撰写的简历，然后把它寄给你能找到的每家公司，这种做法不太可能奏效。


  收集你的雇主正在寻找的能力，并用公司的眼光审视你的简历。如果你简历的某一部分对公司不重要，就删除它，或者降低它的重要性。突出你的雇主正在寻找的技能。


  你的简历是一到三页的广告，应该吸引雇主的注意。让它脱颖而出，并确保你传达了正确的信息。如果你做得足够充分的研究，你就会知道某家特定公司对什么感兴趣。利用这个知识，向公司发送正确的求职材料包。


  #### 练习


  1.  回到第 4 章。重新阅读前两节。


  2.  然后找一家你想研究的公司。从准备你的求职材料包的角度，找出这家公司与你在所有相关方面的信息。然后打开你的简历和求职信模板。根据你的研究对其进行修改，使其与你刚刚研究的公司更相关。


  3.  你也可以考虑从头开始写一封求职信。这对于你的前两到三次求职申请是完全有意义的，这样你可以获得更多经验。


  ### 出色完成行为面试


  **本节目标：**


  -   学习如何留下良好的第一印象。

  -   了解为何出色完成第一次面试而不仅仅是勉强通过非常重要。

  -   学习如何回答一些典型的面试问题。

  -   找出在第一次面试中你应该提出的正确问题。


  许多软件开发人员将非技术面试视为一种必要的麻烦。如果你不努力，你会错过大量机会和金钱。


  非技术面试总是比它看起来更重要。仅仅这场面试就可能影响以下方面：


  -   技术面试的难度级别

  -   你的薪资范围

  -   你是被视为普通人才，还是能提供让你脱颖而出的特殊价值

  -   你是否契合公司文化

  -   你未来的职位，例如，你之后是否目标是担任领导或专家职位


  #### 面试我的人是谁？


  你的面试官可能是人力资源或内部招聘团队的成员，也可能是在公司担任关键技术或非技术职位的人员。


  即使你作为软件开发人员接受面试，你也有可能见到产品经理、项目经理、副总裁、架构师、用户体验负责人、软件开发团队主管、首席技术官，甚至首席执行官。例如，在小型初创公司中，你很可能会被首席执行官或首席技术官面试。


  在极端情况下，一些公司将招聘外包给外部招聘团队。大多数情况下，你在被录用之前迟早会见到公司的一位关键负责人。


  如果人力资源或内部招聘人员在场，请确保你给予他们与技术面试人员同等的尊重。


  ### 注意


  我在面试中看到的第一大错误是，一些软件开发人员表现出优越感，并且对人力资源缺乏尊重和耐心。


  既然你的面试官是被选中来面试你的，那么即使是一个天才，也可能因为缺乏尊重而被淘汰。


  我曾听说在一次面试中，候选人只与技术面试官进行眼神交流，而忽视了招聘人员。我们永远不会知道这是否是一种无意识的行为。然而，面试结束后，招聘人员指出她被忽视了，技术面试官也开始意识到候选人明显缺乏软技能。


  #### 有多少人面试我？


  通常，会有一到三个人面试你。通常会有一人代表人力资源和招聘，以及最多两位专家、主管或经理。


  一些公司，尤其是初创公司，倾向于将人力资源和招聘排除在面试流程之外。只要公司规模小，他们更倾向于收集与他们共事人员的实践经验。


  其他公司会邀请大量候选人，并组织一整天的招聘活动。这会形成有趣的动态，因为你可能会面对一个由四到五人组成的评审团，并且需要与其他候选人合作解决和展示任务。


  作为候选人，我经历过最极端的一次第一次面试是面对四位技术专家。尽管他们在企业环境中工作，但他们试图营造轻松的氛围。然而，与所有四位专家建立联系是一项艰巨的任务。当你处于这种情况时，不要专注于取悦每个人。只要保持礼貌和尊重，与每个人进行眼神交流，然后继续面试，就像你只有一两个面试官一样。


  关于眼神交流，有些面试官可能会坐在你旁边。这使得眼神交流很不舒服，因为你说话时可能不得不转动 180 度。你可以告诉坐在你旁边的人，你想建议一个不同的座位安排，因为不停地左右转动对你来说不舒适，而且忽视任何一位面试官都不是一个选择。你设定好框架，你的面试官会配合你。


  与多位面试官打交道的内心博弈，关键在于相信你自己就是那个值得争取的奖赏，而你的听众越多，你真正打动某人的机会就越大。


  面试中任何事情都可能发生。有一次，一家小型初创公司邀请我进行非正式的初次面试。我有机会见到了团队。在会面期间，投资者和首席执行官出现了，他们临时召集了一场关于软件开发事宜的
  15 分钟会议。作为局外人坐在那里让我感到尴尬。然后我见到了投资者、首席执行官、首席技术官和一些开发人员。


  你参加的面试越多，你在极端情况下就会越自如。熟能生巧。


  #### 讲故事框架


  许多公司会给你提示，告诉你预期如何回答行为面试问题。


  你可能听说过由哈吉马斯·拉斯洛和亚历山大·博托斯提出的 STAR、STARR 和 SOARA 技巧。它们如下：


  - **STAR**：情境、任务、行动、结果

  - **STARR**：情境、任务、行动、结果、反思

  - **SOARA**：情境、目标、行动、结果、后续影响


  这些技巧为你提供了一个讲故事框架。需要有引人入胜的挑战来吸引听众。你是故事的主角，其目标是克服一些逆境完成某件事。在“行动”部分制造悬念。你所采取的行动应该呈现出通往预期结果的非显而易见路径。然后，你可以选择是否对故事进行反思，这取决于你的听众是否能自己得出结论。


  讲故事时一个常见的错误是在故事中添加太多松散的情节，这使得听众难以跟上主线，也使他们无法得出你想要的结论。


  另一个常见错误是，候选人运用这些讲故事框架来讲述一些显而易见、毫无说服力的事情。




  #### 练习行为面试题


  我鼓励你阅读以下问题并大声回答。用手机录下你的回答，随后听一遍。


  如果你喜欢挑战，可以用笔记本或手机摄像头录制自己，并观察自己。起初你可能会感到不自在，但当你意识到真实面试会因此变得多么轻松时，所有的努力都是值得的。


  在做这个练习时，你会处于*训练心态*。你将有机会分析自己的方法并做出调整。


  而当你真正参加面试时，你将处于*信任心态*。你只需相信自己的能力，并将改进后的技巧付诸实践。此时，你已没有时间再分析和微调你的方法了；因此，你必须事先做好功课。


  我们将模拟一场面试。面试前，请先针对某家公司进行研究，并假装你正在参加它们的面试。


  我会一次性给你所有问题。先做练习，然后阅读我对这些问题的点评。记住，没有唯一的正确答案。你的表述应当前后一致、真诚可信，并且有时要注意避开一些陷阱。


  1.  请简单介绍一下你自己。

  2.  你目前是否也在面试其他公司？

  3.  你是从哪里看到这个职位招聘的？

  4.  你为什么想和我们一起工作？

  5.  你对我们公司了解多少？

  6.  你最喜欢的项目/角色是哪个？

  7.  你为什么要离开现在的工作？

  8.  你更喜欢什么样的工作环境？

  9.  你的同事会如何形容你？

  10. 你的兴趣爱好是什么？

  11. 三年后，你希望自己成为技术专家还是担任管理角色？


  我们将用这些问题来覆盖面试的基础内容。显然，现实中会存在一些刁钻或不公平的问题，但你不需要为每一种情况都做准备。


  如果你被问到一个不合法或不道德的问题，比如你的宗教信仰、性取向，或者你是否打算近期要孩子，你可以明确表示你认为这类问题超出了面试的范畴。但前提是你之前没有回答过任何非法问题。想象一下，如果你回答了三个非法问题，然后拒绝回答第四个，这几乎和直接回答一样暴露了信息，因为你在三个问题上选择了配合，却在第四个问题上有所抵触。记住，坚定自信的核心在于捍卫自己的边界。


  对于你认为是非法的问题，轻松对待，就像什么都没发生一样。如果面试官坚持要你回答一个非法问题，我个人的原则是礼貌地告诉他们，基于此次面试的体验，我对这个职位不再感兴趣。


  你也可以通过缓和语气、做出条件性陈述来留一扇后门，例如：“如果申请流程要求我回答法律禁止的问题，我将撤回我的申请。请告知我们是应该终止面试，还是你们接受不回答这个问题而继续面试。”


  现在，让我们来剖析这十一个问题。


  #### 1. 请简单介绍一下你自己！


  这个问题不是让你讲述你的人生故事，但它仍然需要包含故事性。


  讲一两个关于你职业生涯中有趣的故事。重点选择与你申请的职位相关的故事。


  如果你难以选择故事，就从当下开始。你目前的职位是什么？然后过渡到你过去取得的一个成就故事。你克服了哪些挑战？最近取得了什么成果？


  如果你是基于故事叙述原则来写简历的，那么你只需要把一两个故事展开，说得更生动一些。你可以用你的技能和经验的逻辑结论来结束故事，并展望你未来寻求的方向。


  #### 2. 你目前是否也在面试其他公司？


  你不必透露你正在面试的具体公司。但是，分享你的进展是双方都关心的事。


  有些公司希望给你提供良好的面试体验，这意味着它们有时会根据你的需要灵活安排面试时间。很多初创公司都是这样做的。


  其他公司则不那么灵活。例如，一些大公司有固定的面试流程。


  回答这个问题时，还有一点需要考虑：你才是那个被争抢的“奖品”。当然，你也在面试其他公司，这很自然。


  当你在筛选想要加入的公司时，只面试少数几家公司是合理的。你可以提及你只专注于最优秀的公司，并且目前与其他任何公司都还没有进入最终阶段。


  如果你还没有面试其他公司，假装有也不明智。你大可以说你很可能接下来会联系几家公司，但你刚刚开始面试，所以这是你的第一场面试。


  #### 3. 你是从哪里看到这个职位招聘的？


  你能说的最糟糕的话就是：“我不知道。我最近看了太多招聘信息，投了太多简历，记不清是在 `LinkedIn`、`Stack Overflow` 还是别的求职网站上看到的了。”


  要随时准备好说出你看到该职位招聘的渠道。


  你应该直截了当。这不是向雇主表达你有多么喜欢这份招聘广告的地方。但详细说明你对公司做的研究是有意义的，因为这表明你为了解所申请的职位付出过努力。如果你是招聘人员推荐的，请说出他的名字。如果你是该公司在职员工推荐的，说出推荐人是谁也是可以的。


  #### 4. 你为什么想和我们一起工作？


  这是一个难题，因为你既要表现出真正的热情，又要保持你作为“被争抢对象”的地位。


  你对公司的研究至关重要。做好功课，记下让你对公司感到好奇的几点内容。


  许多公司会拍摄招聘宣传视频。与视频产生共鸣很容易。或者，你也可以阅读他们的博客、查看他们的产品，或参加他们的线下活动。


  你不可避免地会找到一些与你相关的主题。从你自身技能的角度过滤这些主题，然后讲一个故事。


  确保不要利用你目前缺失的东西来贬低你当前或过去的雇主。


  例如，你可以这样组织陈述：


  *   “在过去三年里，我在一家小型初创公司工作，我们采用临时性的流程来应对工作环境中的日常挑战。这对我来说是一次很棒的经历，作为一名应届毕业生，我在应对这些挑战的过程中成长了很多。我也有机会建立了一些新流程，因为这是我硕士学习期间的专业方向。不过，我现在想从内部看看一家规模更大的公司，因为我的发展还没到你们公司目前的阶段。我想看看自己如何能在一个拥有完善质量管控的成熟组织中创造价值。当我观看你们信息技术部门的视频时，我看到你们公司正处于我所追求的那种成熟阶段。”


  这个故事要比说“我目前住在印度，我想住在欧洲”可信得多。后一种表述只会让人觉得城市和公司对你来说无所谓，你只看重所在的大洲。





  ### 注意


  动机分为两种：*趋近型*和*回避型*。“回避型”动机的问题在于，求职者并非在选择一家公司，而只是在计划逃离。这并不理想，因为面试官寻找的是有技能且有动力的候选人。毕竟一个巴掌拍不响，从其他公司逃离的候选人，很可能具有某种在新公司同样会引发问题的性格特质。因此，怀有“回避型”动机的人，其被录用几率低于怀有“趋近型”动机的人。


  **5\. 你对我们公司了解多少？**


  是时候将你的调研成果付诸实践了。表达任何你充满热情的事物。例如，如果你本人喜爱音乐，正在面试 SoundCloud 或 Spotify，那你很容易胜任。如果你曾进行股票交易，正在面试一家创建实时股票交易平台的公司，你也容易与公司员工产生共鸣。


  如果公司的产品和服务与你本人及生活无关呢？你仍然可以将话题联系到其专业性、技术挑战、技术栈以及公司文化上。


  招聘经理希望看到，假设他们录用你，你是否能代表他们的公司。他们也希望看到，你通过调研，对自己潜在雇主的态度是认真的。


  如果你无话可说，那么通过告诉面试官你感到惊讶的地方来建立联系是合理的，同时你也可以顺便提出一两个问题。


  **6\. 你最喜欢的项目/角色是哪个？**


  你的面试官希望听到你对自己的工作充满热情。展示热情的最佳方式就是谈论你过去面临的挑战。


  如果你经验丰富，参与过多个项目，这个问题就很简单。也许你曾与一个出色的团队共事。或者你曾有机会从头到尾全权负责一个项目，影响了开发方法、技术栈甚至团队构成。或者，你也可以谈谈如何克服重大障碍，交付了你曾认为不可能实现的结果。


  这是你通过讲述自身优势的故事来培养叙事影响力的机会。如果你想成为专家，你最喜欢的项目应该是那个你需要进行深入研究并参与关键技术决策的项目。如果你曾是领导，你最喜欢的项目很可能是那个因团队顺畅协作而取得成果的项目。


  **7\. 你为什么离开现在的雇主？**


  这个问题并不像看起来那么复杂。如果你已经很好地回答了前面几个问题，那么很明显你是在寻找特定类型的挑战。


  永远不要诋毁你现在的雇主。即使你没有得到期望的对待，也要始终对你获得的机会心怀感激。


  如果你与雇主有过冲突，不要对此持负面态度。凡事都有两面性，每个冲突都可以有多种解读方式。不要在面试中寻求外界的认可。如果你对现在的雇主不满意，显然，你是在寻找更多的挑战。


  对与错之间只有一线之隔。如果你想坦诚相待，你也可以说你对现在的雇主不满意，但这不是他们的错。你只是需要不同的工作条件和职业关系。


  这个问题的变体是讲述一个你与雇主意见不合、但仍需执行任务的事件。


  **8\. 你偏爱哪种工作环境？**


  将这个问题与你对公司的调研联系起来。有些东西对你来说必须很重要。


  例如，如果你习惯了每日站会以及每两周一次的整天会议，那么比起临时应对，你可能更偏爱完善的流程。如果信任和自主权对你很重要，坦言相告也无妨。你更喜欢正式的上下级关系，还是务实且平易近人的同事？这些对你和公司而言都是重要因素。


  不要害怕表达观点。之后可能发生三种情况。


  面试官可能会认识到他们能提供你所寻求的东西。这会让他们自豪地告诉你，你的偏好将得到满足。


  或者，公司可能会承认他们以不同的方式运作。尤其是在初创公司，一些流程尚未建立。这可能会引发一场关于他们能否满足你需求的讨论。


  一些公司可能会粉饰或隐瞒他们对你的回答的看法，然后继续下一个问题。


  无论哪种方式，表达你的观点而不是寻求面试官的认可都是有益的。你依然是那个值得争取的人才。


  **9\. 你的同事会如何描述你？**


  回答这个问题有多种方式。


  首先，如果你有一些领英上的推荐信，可以利用它们，向面试官多谈谈你与之前同事的关系。


  你也可以提及你获得过的真实赞誉，无论是非正式会议中对团队成就的祝贺，还是绩效评估中的表扬。


  或者，专注于你的几个优势，并将它们置于具体情境中。构思一个故事，确保你不是在自夸，而是在给面试官讲一个有趣的故事。


  坦白你的一些弱点也是可以的，只要有一个好的故事，并且这些弱点对这份工作来说并非致命缺陷。


  如果你曾是自由职业者，你一定有过客户。那就谈谈你与客户的关系。


  **10\. 你的爱好和兴趣是什么？**


  这个问题很难出错。只要你的回答不空洞且政治正确，就应该没问题。


  面试官想了解你是一个什么样的人。他们希望能在某种程度上与你产生共鸣，而爱好很重要。


  假装有爱好没什么意义。有些人建议你找出面试官是谁、喜欢什么，然后假装你也喜欢同样的东西。但记住，一旦你被录用，你将与这些人共事。


  如果你说你喜欢浏览网页和看电视，你的形象就不会那么好。如果你想快速被淘汰，就把这个回答和“你想搬到加拿大，工作或城市对你来说并不重要，你只在乎有好的网络和电视信号”的故事结合起来。你的面试官不太可能相信你会很好地融入公司文化。


  **11\. 你设想自己三年后是技术专家还是管理角色？**


  如果你做了功课，意味着你为自己设计了一条职业道路。在这个问题中，你有机会表达你正在追寻的目标。


  有些人在表明自己其实想成为领导者时会遇到困难。这可能是因为缺乏自信，或者因为他们害怕面试官会阻挠他们的发展。


  事实并非如此。优秀的领导者供不应求。许多公司更倾向于从内部填补领导职位，而你给了他们一个机会，如果双方都认为合适，可以将你们的合作提升到新高度。


  记住，如果你对自己的抱负撒谎，未来你将与同一群人共事。


  这个面试问题一点也不刁钻。如果面试官问这个问题，他们是想知道，如果你们继续共事几年，他们能否把你当作领导者或专家来依靠。




  #### 面试时你提问的作用


  只要有机会，就在面试过程中提问。在研究公司时，提前准备好几个你感兴趣的问题。


  这是你深入了解雇主、团队、技术栈、开发流程、公司文化、公司政策、工作外的休闲活动以及许多其他事情的机会。


  你可以通过评论面试官的答案，并在评论后再提出下一个问题，从而为你的面试官创造一次精彩的面试体验。


  如果有什么不清楚的地方，也可以就面试问题本身进行提问。这就是你如何将面试转变为一场友好对话的方法。


  记住，你们是平等的双方，你应该有机会像面试官面试你一样去面试他们。你同样需要决定是否愿意与这家雇主共事；这不仅仅是他们单方面的事情。


  你的问题越切中要害，你就越显得清楚自己想要什么。这意味着你`qualify`面试官的程度，与他们考察你的程度是相同的。


  #### 第一次面试的利害关系远不止通过与否


  第一次面试并不仅仅是一个关于公司是否继续与你推进的二元决定。对你来说，最佳结果是让面试官成为你的粉丝。如果面试官喜欢你，当你在技术问题卡壳时，他们会帮助你。


  出色的第一印象甚至可能在收到公司录取通知后，为你带来公司方面的二次出价。作为一名候选人，我有过两次这样的经历：当我要了一天时间考虑录取通知后，我就在收件箱里收到了对方更高的报价，而我并未主动要求。其中一次，一家公司直接发给我一份合同草案，里面甚至还提高了我的潜在薪资。


  ### 搞定技术面试和作业任务


  **本节目标：**


  *   找到准备技术面试的方法。

  *   了解即使不知道如何解题也能提高成功率的技巧。

  *   学习如何通过作业任务的技术审查。


  接下来你将了解到更多关于如何进行技术面试的方法。你将学会如何展示你的思考过程，以及如何让面试官成为你的盟友。我们还将讨论如何完成作业任务，以及在面试情景中讨论你的作业时需要注意什么。


  #### 不要自我迷惑


  技术面试并不像看上去那么难。面试官和你一样也是普通人。害怕各种情况对你来说毫无意义。


  编程面试让我想起了我的大学考试。早在 2001 年，我必须参加线性代数和图论考试。这意味着我必须记住所有定理和证明，才能通过课程，并在考官面前解决问题，清晰表明我理解了材料，而不仅仅是死记硬背。


  学习事实和记忆数据当时并不是我的强项。那时我还不知道《与爱因斯坦月球漫步》^(⁶⁴)这本书。如果我知道一些酷炫的记忆技巧，我本可以轻松通过大部分这类考试。


  尽管我学习了很多，但我仍然害怕像双线性函数理论，或者证明“任何地图都可以用五种不同颜色着色，前提是相邻国家颜色不同”这样的命题。准确地说，四种颜色就足够了，但幸运的是，我们不需要学习这个证明。^(⁶⁵)


  考官是一群博士生和一些教授。其中有一个特别让每个人都害怕的教授。无论是在宿舍还是在邮件列表中，都流传着这样的信息：当受害者达不到他的水平时，这位考官会轻蔑地看着他们。


  我们十个人在一个宽敞的报告厅开始考试。当我打开题目时，令我恐惧的是，正好是着色定理。太棒了，我想，然后我开始根据模糊的记忆构建证明。我开始串联线索，构建了证明的某些部分。然而，我卡在了一个点上。


  由于我无法回忆起缺失的部分，我决定，一旦有和善的考官靠近我，我就立刻举手。我认出了一位实验室助理，他总是态度很好，从不深究细节。当我举手时，那位助理从我身边走了过去。


  那位令人生畏的讲师看到了我，并开始向我走来。他带着温暖的微笑向我打招呼，然后开始研究我的笔记。一分钟后，他让我开始解释。证明过程一开始很顺利。我的思绪已经超前了一点，因为我知道他会让我详细说明那些缺失的拼图。


  我选择承认自己卡住了。然后我列举了可以继续推导出解决方案的两种方法。


  “我们顺着第二种思路继续。你在寻找一个矛盾，但这个结构有点过于复杂，难以检查。想想两个独立的情况，”我的教授说。


  “这两种情况最终都会导致矛盾，”我补充道。


  “没错。你如何限制图的结构，来让自己更容易些呢？”


  我开始尝试，而当我找到了正确的结构时，考官给了我非语言的肯定信号。我自己推导出了矛盾。我们又花了一些时间研究另一个结构，但最终，证明完成了。


  我的考官开始问我一些随机问题。随着问题越来越难，我开始回忆起我听到过的那些恐怖故事。我也注意到，考官变得越来越担忧。


  短暂的沉默后，考官开口了：“真的很抱歉……我不能给你 A，只能给 B。”


  我得到了第二好的成绩。这对我来说是一次大开眼界的经历。到底发生了什么？


  与第 4 章中“你的 SMART 学习计划”一节的另一个故事相反，这次，我成了故事中的英雄，尽管我被那些因将失败归咎于外部原因而扭曲事实的故事所迷惑。这个外部原因只存在于他们的想象中。考官对我非常公平，他设法给了我一个能完美映射我知识水平的分数。他甚至帮助了我，并尽其所能找出我知道什么，而不是我不知道什么。大多数人倾向于妖魔化他们的面试官。保持客观，专注于真正重要的事情。


  此外，请注意，软技能能让你与面试官建立联系。成功合作的关键有两点：我从未试图伪装不懂的知识。我自然而然地承认了自己的弱点。我也表达了希望继续在考官指导下进行下去的意愿。大多数人在面临挑战时会当场放弃。你的策略应该是赢得面试官的支持。


  你的职业行为准则会为你的努力背书。以我自己作为面试官的经验，我可以告诉你，我总是帮助那些尽力表达自己想法并试图向我展示他们思考过程的人。


  你可能会好奇我为什么选择承认自己卡住了。我的教授在这个领域已经工作了十多年。他见过成千上万的学生。大多数学生试图伪装自信，而他对此心知肚明。他肯定已经发展出了多种方法来查明真相。


  ### 注意


  刻意努力去打动别人是不值得的。如果对方不值得你费心去打动，那你就是白费力气。如果对方值得你打动，你可以放心地假设，他们能看穿你所有试图打动他们的努力。




  #### 技术面试准备


  回顾巅峰表现心理学中关于*训练心态*和*信任心态*的概念。在准备阶段，你处于训练心态。一旦面试开始，你必须信任自己的能力。不要在最后一刻试图学习新知识而给自己施加压力。只需尽力而为。


  有些雇主可能不喜欢我这么说，但站在你的角度，即使你并不想找这份工作，积累一些面试经验也是完全可以接受的。如果你有怯场的问题，请尽力将自己置于棘手的场景中，这样在真正重要的时刻你才能表现出色。


  面试通常涉及通用性讨论。根据你的专业方向，可能会涉及以下任何主题：


  - 开发方法论与流程

  - 技术栈

  - Git，版本控制

  - 架构设计与详细设计

  - 设计模式

  - 函数式与面向对象编程

  - REST，GraphQL

  - CICD 流水线

  - SOLID 原则

  - 数据库概念（包括 NoSQL）

  - 组合与继承

  - 自动化测试

  - 常用框架与库

  - TDD，ATDD，BDD

  - 云技术

  - CAP 定理

  - Docker，Kubernetes

  - 项目管理

  - 利益相关者管理

  - 产品管理


  这份清单远非完整，你的专业方向可能需要你学习其他人并不需要的内容。


  市面上有很多关于编程面试练习的书籍和课程，其中包括畅销书《*破解编程面试*》。^(⁶⁶)


  如果你是一名 JavaScript 开发者，我也推荐我的书《*ES6 实战*》。^(⁶⁷)除了常见问题外，我还加入了 20 道编程面试题及其答案。你将有机会练习
  JavaScript 面试题并构建解题思路。


  无论你选择哪种编程语言，我都可以向你强烈推荐几个网站，在那里你可以免费磨练你的编码技能。


  `Codility`^(⁶⁸)是我的首选推荐。`Codility` 引导你掌握算法的基础知识，并总结了你作为软件开发人员需要了解的关键原则。它从迭代和数组等简单友好的内容入手，提供平缓的学习曲线，最终逐步深入到贪婪算法和动态规划等令人生畏的主题。如果你目标是获得高薪职位，`Codility`
  是必备工具。坚持每天完成一道挑战题，你的编码技能将在数月内大幅提升。


  `HackerRank`^(⁶⁹)在我的推荐列表中排名第二。`Codility` 的界面更友好，而且由于练习题提交缺乏质量控制，`HackerRank` 上的某些任务理解起来可能更困难。


  如果你想进入四大科技公司工作，不妨考虑 `Project Euler`。^(⁷⁰)但请谨慎，这些任务会变得非常数学化，你可能在永远不会用到的任务上花费过多时间。


  编程面试并不仅仅涉及数学和算法。例如，`LeetCode`^(⁷¹)也支持数据库和 shell 相关的题目。


  我个人认为，技术面试往往存在缺陷。有些面试完全不要求你写任何代码。我参加过多次面试，整个过程都停留在表面层次。只要我声称掌握正确的技术并且软技能达标，就能被录用。作为求职者，这让我感到担忧，因为招聘流程反映了你未来团队的技术水平。


  编程面试的另一个极端是过度偏重算法。我理解软件开发人员应该具有创造力。但困难的算法谜题并不一定能测试开发者的算法能力。在最高层级，你测试的其实是候选人之前是否解决过类似的问题。


  想想看。动态规划并不是在 20-30 分钟内被发明的。而这道练习题的时限恰好就是 20-30 分钟。如果你对动态规划一无所知，那么祝你好运能完成编码练习的复杂度要求。


  编码谜题的另一个变体是，面试官会测试软件开发人员是否了解某门编程语言边界情况的全部细节。


  我们可以争论编程面试是否公平，但这种争论不会让你获得工作机会。因此，我们将聚焦于从职业发展的角度哪些事情是重要的，并接受世界的现状。研究你预期会遇到的面试体验，并进行相应练习。


  如果你需要更多练习，可以寻找提供模拟面试的职业中心或机构。在撰写本文时，我通过自己的网站提供免费咨询。^(⁷²)




  #### 编程面试


  编程面试中最重要的一件事就是展示你的思考过程，并尽可能与面试官协作。你可以回忆一下我大学考试的故事。面试官和我的教授一样，都愿意帮助你。


  试着站在面试官的角度思考。在他遇到你之前，可能已经连续拒绝了十名开发者。我面试过几百名候选人，其中大约 70%的人都在第一轮面试中被我拒绝了。


  很多软件开发人员连简单的任务都解决不了。每当我看到有人能够熟练编写代码时，我就会变得精神振奋，并会尽一切努力让候选人的面试体验更轻松——比如纠正他们的拼写错误或帮助他们一起研究问题。


  如果你在解决问题之前先表达你的思考过程，你就能获得宝贵的反馈。要让面试官参与到构建解决方案的过程中来。


  有一次我面试一个前端开发岗位。那时`MongoDB`还很新。CEO 问我一个问题：“我们同时使用`MySQL`和`MongoDB`。你在什么情况下会用`MySQL`，又在什么情况下会用`MongoDB`？”


  我开始慢慢地表达我的想法：“让我想想。我曾用过一次`MongoDB`，所以我可以补充一些已知的信息。当我使用`MongoDB`时，我可以把 JavaScript
  对象直接存到数据库里。那时我学过一点关于面向对象数据库的知识，包括它们的区别和用例……SQL 和表结构则简单且直接。”


  面试官打断了我。他说：“想想`select`语句结果的结构，然后把它和 JSON 数据对比一下。”


  我立刻回答：“在关系型数据库中，数据是高度结构化的，并且针对检索进行了优化。而在面向对象数据库中，结果集的元素在结构上没有限制。我可以想象，当你需要整合不同类型的数据源时，处理对象要比为了支持这些对象和关联而修补关系型数据库的
  schema 方便得多，尤其是在数据结构经常变化的情况下。”


  这次面试的关键在于面试官帮助了我。他不仅确认了我最初的思考有一定价值，还给了我一个提示。


  有时候，展示你的思考过程并找出问题的答案，比单纯背出答案更有说服力。一旦你得出正确的结论，面试官很可能对你印象深刻。


  不过，并非所有面试官都会帮助你。有时他们甚至会在你进行编码练习时离开房间。如果你的面试官在你编码时一直陪着你，一定要随时说出你正在思考的内容。


  始终验证你的解决方案，并打磨你的调试技巧。要知道什么时候该用日志，什么时候该用断点。要知道你在查找什么值，以及你期望得到什么结果。每次只测试一个假设。一旦你对一个假设的测试完成，立即清理你的代码。


  在编码任务中，承认自己走错了方向需要很大的勇气。如果你发现代码越来越庞大，开始搞不清逻辑走向时，有时硬重启会很有帮助。我们常常在尝试了一条更困难、更不直接的路径之后，反而能得到一个更简单的思路。出人意料的是，只有一小部分开发者会放弃臃肿的代码，转而采用更好的思路。修补一段根本跑不通的代码是困难的。通过换个思路重新开始任务，你往往能增加成功的机会。


  在技术面试中，光有编码能力是不够的。你还必须掌握表达自己思考过程的技巧。沟通并不总是容易的。如果你想变得更好，可以做以下任何一项练习：


  - 录制自己解释某个算法的过程，然后听一遍回放。

  - 向你的软件开发者朋友讲解某个算法。

  - 围绕你喜欢的某个活动制定一个流程，并把它当作一个 IT 流程来表达。

  - 撰写规范的文档和博客文章。

  - 即使你不打算找工作，也要练习面试。


  不要忘记尽可能多地提出有用的问题。了解你的面试官，确保你弄清楚所有需要的信息，以便做出明智的决定。回想一下本章开头的案例研究，记住你提出的问题的重要性。在技术面试中，你可以了解到很多关于未来雇主的信息。


  最后，你参加的面试越多，就越有可能遇到不公平的问题。毕竟面试官也是人，有些人提出莫名其妙的问题也在所难免。每当我发现面试官缺乏能力时，我就知道这家公司不适合我；因此，在面试结束时我会当场拒绝他们。幸运的是，这种情况很少发生。


  如果你被拒绝了，你可能听说过可以向对方询问面试反馈。很多公司不会给你反馈，要么是他们没时间写，要么是他们觉得不方便。


  不过，你仍然可以在发出第一封邮件几天后，再次发送反馈请求，从而最大限度地提高获得反馈的几率。


  如果一场技术面试以成功告终，你会得到以下三种结果之一：


  1. 另一轮技术面试的预约

  2. 一份录用通知

  3. 一项课后作业


  接下来，我们将继续讨论课后作业任务。




  ### 作业任务


  课后作业的内容可能千差万别。我听说有公司要求你编写一个具有人工智能的扑克机器人。也有一些无名初创公司会给你分配一项艰巨的任务。一旦你提交了解决方案，他们就会拒绝你，并利用你的免费劳动成果。这类欺诈性的面试官很容易识别，幸运的是，这种情况并不多见。


  大多数时候，你的课后作业是合理的。为了出色地完成编程作业，请遵循以下规则。


  **深入阅读并理解整个练习。** 确保你理解任务的每一个细节。如有任何不清楚的地方，可以向公司询问。*有些公司会故意把任务说明写得不够详细，目的就是测试你的主动性。*


  **只解决要求解决的问题，不多也不少。** 永远不要添加未被要求的功能。这些功能很少会得到赏识；它们只会给你的解决方案增加干扰。如果你未能完成某些任务，与其他完成所有功能的开发者相比，你将处于劣势。你仍有可能被录用，但你的解决方案必须在其他方面出类拔萃。


  **编写易于维护的代码。** 使用你喜欢的 lint 工具，为代码添加注释，使其保持一致性和可读性。在设计解决方案时，要考虑到可维护性。展现出你的成熟度。避免使用
  hack 手段。关于这个主题，有很多优秀的著作：


  - 罗伯特·C·马丁：《代码整洁之道：程序员的职业素养》

  - 史蒂夫·麦康奈尔：《代码大全：软件构造实践手册（第二版）》


  **注明你所有的参考来源。** 你无需一切从零开始。只要有助于你推进工作，你可以使用样板代码或其他由他人编写的仓库。但是，你必须证明你的选择是合理的，并注明来源。切勿在未注明出处的情况下使用他人的代码。


  **撰写解决方案文档。** 我收到的解决方案中，约有 30%没有附带安装说明。有时我无法启动应用。有时我收到的任务依赖于全局包依赖，而这些包并未安装在我的电脑上。我不得不手动确定需要安装哪些包才能运行和评估应用程序。


  **编写无缺陷的代码。** 多花些功夫调试你的解决方案。你的面试官对他们的挑战任务了如指掌。这意味着，如果你提交了有缺陷的代码，他们就会发现你的错误。如果你传递出“连编写一个小型应用都无法避免错误”的信息，他们就会开始怀疑你编写高质量代码的能力。


  **善用工具。** 使用框架、库和样板代码。如果你的解决方案表明你一直在重复造轮子，你会被视为初级开发者，这在薪资谈判中对你不利。


  **自动化测试。** 如果在你的家庭作业中添加了测试覆盖，这通常是一个很大的加分项。


  **研究你的解决方案。** 如果你的家庭作业被接受，请准备好接受相关问题。因此，在开始第二轮面试之前，请确保你能够运行并解释你的代码。


  ## 有效谈判


  **本章目标：**


  - 学习薪资谈判的心理学。

  - 掌握谈判技巧，最大化你的收入能力。

  - 破除薪资谈判的迷思。

  - 了解如何进行谈判练习。


  这一部分是关于有效的薪资谈判。我们将揭穿“总要还价两倍”的流行观念。你将读到一些符合常识的策略。


  我们从薪资谈判的心理背景开始。你会发现谁是你的盟友，并可能得出令人惊讶的结论。然后你将了解职场自助行业产生的迷思。


  当职业教练传播某些迷思时，他们可能没有意识到，他们的客户有时之所以成功，是因为他们的策略，但有时也是*尽管*采取了该策略，却并非*因为*该策略。请记住，软件开发者经常参与招聘过程。他们中的许多人都听说过主流建议。


  一旦你能区分常识性建议和华而不实的迷思，就该学习一些谈判技巧了。这些技巧与本书其余内容完全一致。


  我们将以一些关于如何练习谈判的建议来结束本节。


  ### 薪资谈判心理学


  许多软件开发者每两年才谈判一次薪资。这几乎不足以获得竞争优势。因此，许多开发者非常不擅长谈判。


  谈判通常发生在面试过程的尾声。你可能已经猜到，你的机会很大程度上取决于你在面试中的表现。然而，在最后阶段仍然有一些可以争取的利益。


  从求职者的角度来看，你的利益在于避免过早承诺薪资范围，以及避免表现出急切的需求。不要透露你非常需要这份工作，因为这可能会让你损失金钱。你的利益在于在面试的各个阶段都表现出色，用你的个性和技能给面试官留下深刻印象。如果你把基础打好，就无需担心结果。


  ### 注意事项


  公司希望了解他们为该职位设定的预算是否与候选人的薪酬期望相符。他们越早弄清楚这一点，就越不必在不切实际候选人身上投入。候选人则希望延迟透露自己的期望值，直到他们能用一些自身的独特优势吸引住面试官。


  价格由供需决定。一个候选人越独特、越有价值，其所能提供能力的供应就越低。候选人的技能与公司需求匹配度越高，需求就越大。需求增加和供应减少会推高价格。


  与股票交易、扑克或任何涉及金钱的游戏类似，两种相反的力量塑造着我们的行为：*害怕*失去交易，以及*渴望*获得更多资源。托尼·罗宾斯将此称为“痛苦-快乐原则”，并补充说，对大多数人而言，痛苦比快乐是更强的驱动力。


  由于害怕，候选人通常会犯以下一些错误：


  - 他们透露的金额或范围低于自己的真实价值或期望。

  - 他们告诉面试官自己寻求市场价值的薪酬，并会接受公司的报价。

  - 即使被压价，他们也从不还价。

  - 他们没有给面试官留下足够好的印象，因为他们害怕说错话。

  - 他们没有建立个人联系，因为看起来害怕面试情境，导致双方都不自在。


  一些软件开发者学会了如何通过遵循职场大师的建议，使用某些技巧假装自信，从而*隐藏*恐惧。好消息是，这通常是一种比完全被动更成功的策略。坏消息是，这可能会损害你与未来同事的关系。由于面试你的都是聪明人，很多人会看穿你的伪装。这些尝试如下：


  - 过早提出薪资和其他福利问题

  - 不停地自夸（参见隐性影响与叙事性影响）

  - 即使之前已承诺过较低的薪资数字，即使你获得的薪资已高于市场价值，也要进行两次还价

  - 不考虑大局，采用冷酷无情且具有剥削性的谈判技巧




  ### 注意


  许多公司倾向于拒绝那些看起来要求高的开发者。如果一位开发经理曾因处理过具有 B 类人格障碍特质（如自恋型人格障碍、马基雅维利主义或精神病态）的员工而感到挫败，他们会筛选要求低的员工，而某些虚假技巧会对你产生不利影响。看起来虚假的技巧并未融入你的个性。这些技巧让你显得像是在操纵规则。而操纵规则本身就是一种马基雅维利式的方式。


  你的面试官往往与你有相似感受。他们也害怕错过优秀候选人，并且有动力达成一笔好交易。不过，这些感受的强烈程度有所不同。在面试过程初期，面试官几乎总是没什么可失去的。随着你显得越来越有价值，你会达到一个临界点，此时你对雇主的独特价值将变得更加真实。


  ### 注意


  招聘人员能从你的年薪中抽取 15–20% 的佣金。如果你一年赚 `$100,000`，这就是 `$15,000–$20,000`。平均而言，招聘一名合格开发者的成本在五位数范围内。这意味着一旦你收到录用通知，这笔五位数的机会成本很可能与你的录用决策相关联。这就是为什么你通常拥有谈判筹码，仅仅是因为公司不想再投入另一个五位数的成本去寻找另一位合适的应聘者。


  当你的面试官需要你时，你的处境会很舒适。在其他情况下，面试官往往会袖手旁观，主观地评估你的技能和薪资期望。


  在两种情况下，你的谈判对手束手无策：


  * 有些公司有固定的起薪。你或许能争取到一些小福利或灵活性，但薪资是固定的。

  * 你的面试官可能受到预算限制，无法满足你的薪资期望。如果你特别优秀，他们可能会申请额外批准，但奇迹很少发生。


  我曾面试一家初创公司的职位。第二次面试结束时，他们非常喜欢我，希望我加入。不幸的是，他们的预算上限是 `$150,000`，而我的最低期望是 `$200,000`。这笔交易无法达成，尽管他们已经在计划如何在多个层面利用我的经验。


  在其他情况下，是有利可图的。我个人的经验是，一旦你的谈判伙伴知道你是一名高于平均水平的开发者，他们常常会站在你这边。许多面试官会意识到双赢局面，并明白如果让你获胜，所有人都会赢。在这种情况下，激进的谈判没什么意义，因为你的谈判伙伴是支持你的。自信比激进更可取。


  很容易将获得低薪归咎于自己的谈判技巧。实际上，你得到的报价远低于预期，主要有以下两个原因：


  1. 你在面试中表现不佳。由于你没有留下持久印象，你并不被视为抢手人才。

  2. 无论你的谈判技巧如何，你的雇主都故意想压低你的薪资。他们是索取者^(⁷³)，想利用谈判弱势方，而不愿为优质服务支付更高价格。


  在第一种情况中，错误发生在谈判之前，你必须提升面试表现。在第二种情况中，你唯一的错误是没有充分“面试”你的面试官，以判断终止面试流程对你更有利。但作为交换，你投入的时间仍换来了宝贵的经验。


  要意识到，你的谈判伙伴站在你一边的次数比你想象的要多。你的专业水平越高，就越不需要专注于谈判。优秀的公司无法承受少付知识工作者薪酬的代价。因此，双赢的局面随处可见。


  ### 注意


  招聘经理是管理预算的员工。预算管理的第一条规则是：预算要么与影响招聘经理薪资的关键绩效指标（KPI）松散挂钩，要么完全与这些 KPI 无关。预算管理的第二条规则是：预算必须在财政年度结束前花掉，否则就会流失。尽管限制条件可能阻止招聘经理做出极端决定，但当他们找到非常优秀的候选人时，他们会支持为其提供最好的待遇。


  ### 关于谈判建议的认知迷雾


  不久前，我回家与家人共度圣诞节。我也在我长大的房间里独处了一段时间。我偶然翻到了大学笔记，发现了一份关于我第一个 IT 职业研讨会的文件。笔记中最突出标注的一句话是：“先说出数字的人就输了谈判。”


  参加这门课程几个月后，我被要求说出薪资期望。我按照在职业研讨会上学到并练习过的方法行事。我依然记得坐在我对面的一位经验丰富的 CEO 的笑容。他说：“哦，是的，你认为先报出数字的人就输了。”




  ### 注意


  谈判建议通常利用“信息不对称”的概念，暗示你通过透露自己的期望会吃亏。这是因为公司掌握大量数据，而你没有。在谷歌、Glassdoor 和 PayScale 盛行的时代，这种建议在我看来已经过时了。然而，你的雇主仍然比你自己更了解他们的限制条件。谈判建议还忽略了一点：你的技能水平越高，信息不对称对你造成的不利影响就越小。由于本书旨在帮助扎实的优秀专业人士，你很可能最终会面临多家公司争相为你提供服务的情况，从而使你能够超越预算限制。


  先出价的人真的总会吃亏吗？


  有时是的。如果你报错了价格，有些人会利用你缺乏调研的弱点。这正是我要求你在谈判前做好调研的原因。在 21 世纪，有足够的信息可以判断你对某家公司而言价值多少。


  当不确定时，参加多场面试，并索要比调研结果略高的起薪是合理的。你可以从拒绝中学习，而且说不定你会撞大运。


  例如，刚毕业时，我面试过一位经验不足的 HR 经理。我其实并不想与他们共事。我不太确定，但感觉他们对应届毕业生的预算相当低。当她要求我透露薪资期望时，我报了一个很高的数字。这位
  HR 经理难掩惊讶。她开始说，也许加上餐补、培训预算和额外福利，他们能给到接近这个数字，但要支付这个金额不太可能。于是我告诉她，考虑到这份工作需要我投入大量专业知识，这个薪资对我来说非常重要。之后，我们结束了面试，她让我考虑好较低的起薪后再联系她。


  这次面试发生了什么？


  我报了一个很高的数字。我的谈判对手透露了大量关于他们预算的宝贵信息。然后他们试图与我达成一致。显然，他们的预算限制使这笔交易无法达成。


  我带着宝贵的信息离开了，如果这家公司的预算不那么紧张，我本可以为他们工作。


  当我开始自由职业时，我对知名自由职业网站上其他熟练自由职业者提供的低报价感到震惊。更让我震惊的是，看到客户发布项目，期望软件开发者投入大量工作却只换取两位数的报酬，而许多开发者为了积累能让自己起步的反馈，竟然真的去申请了。有一次，一位客户对我的相关经验印象深刻，询问我的报价。我报了
  `$120/小时`，尽管他本可以为同样的工作从 `$30–$50/小时` 的范围内选择数百名开发者，但他还是接受了。我其实并不介意失去这个项目；实际上，我本以为自己接不到。令我惊讶的是，客户无条件接受了我的条件，并雇佣了我大约半年，每月
  20–40 小时。凭借更强的个人品牌，收费 `$200`、`$500` 甚至 `$1,000/小时` 也是可能的。


  尽管这些费率看起来很高，但应用我最喜欢的策略——按项目收费并保证结果——甚至可以收费更高。这样，自由职业者承担风险，并在提前完成时获得回报。客户将完成艰巨任务外包出去，并不关心你如何完成。在这种情况下，我定下条款、提供保证，并确定我的收费。


  在 `$120/小时` 的例子中，我本可能收到 `$50/小时` 的初始报价。如果我说 `$120`，我就必须成为非常优秀的谈判者才能不降低报价。如果你按项目收费，同样需要良好的谈判经验。


  ### 注意


  如果你预计谈判伙伴会故意或因缺乏对你的了解而给出低价，*不先说出你的期望可能会损害你的机会*，尤其是当你不是经验丰富的谈判者时。


  大多数人担心报出比预算范围略高的数字会在谈判中伤害自己。这有时是事实；然而，你能提供的价值越多，你在谈判中的地位就越强。


  回顾专业精神和承担责任的原则。无论你的经验水平如何，你都有责任研究自己的薪资期望。然后你有责任将其传达给你的潜在客户。


  逃避责任的人会要求公司给出一个合理的报价。这个报价充其量只是合理。你很少会收到一个非凡的报价。隐藏期望所能达到的，只是让公司透露一个你在网上就能查到的数字。


  根据另一个谈判误区，你总是需要多次还价。你在这个领域越久，就越了解何时你的客户或潜在雇主已经达到了他们选择的极限。如果你在面试中表现得极其出色，会发生两件事：


  1.  你开始通过自己定价获得更多利益。

  2.  你的雇主可能会承认，他们给出了被授权给出的最高薪资。


  即使面对看似不可协商的事实，也仍有谈判空间，但在某些情况下，确实没有进一步获利的余地了。


  另一个误区是始终将期望隐藏到最后。在某些情况下，这会使你被淘汰出局。在其他情况下，你可能会向站在你这边的人隐藏期望。例如，如果你与外部招聘人员合作，他们的利益是赚更多钱。如果你的目标是更高的薪水，而他们能从你的薪资中获得
  20% 的佣金，那么最大化你的薪资对你们双方都有共同利益。这是一个宝贵信息来源，招聘人员可能会向你提供内部信息。


  在某些情况下，没有任何借口能让你免于透露期望。最简单的例子是填写表格，最低可填数值是签证要求的最低收入，这在许多国家是一份合理的薪资。最高值没有上限。你不能填零，也不能填负数，系统会自动筛选出那些填写金额超过预算上限的候选人。用非常规策略联系公司也不划算，因为每个人都必须执行相同的流程。


  ### 注意


  如果一家公司坚持要求你填写期望薪资，你以后有权改变主意，特别是当面试过程揭示了某些信息，使你的职责更加重要时。


  这个论证结束了破除误区的章节。这些论点并不代表普遍真理：


  *   先出价的人就输了。

  *   收到报价时，还价总是值得的。

  *   你可以将透露期望推迟到面试过程结束。


  我并不是说这些指导原则永远无效。但我的意思是，这些指导原则并不总是对你有利。有时你必须运用自己的判断力，优化在特定情况下有效的做法。任何通用规则都算是一种思想迷雾，旨在阻止你看清现实。




  ### 谈判指南


  尽管并非总是如此，但将谈判推迟到面试流程的最后阶段通常对你有利。如果面试官在第一次面试中、在对你一无所知时就询问你的期望薪资，你可以扭转局面。你可以告诉他们，你对公司几乎一无所知，也还没有见到很多同事，因此你没有足够的信息给出具体数字。然后你可以建议，双方在面试过程中先加深了解，这样后续达成对彼此都有利的协议就会容易得多。这段话的简短版本是，你仍在了解情况。这是一个合理的理由，尤其是当你刚搬到新的州、城市、国家，或者刚进入新的角色或行业时。


  有时，你的谈判对手会坚持要了解你的期望。此时你的兴趣点在于，利用自己对信息的渴求，将你的期望模糊成一个范围，这个范围取决于许多因素。给出范围的思路是，让最终结果取决于许多后续在面试过程中才会揭晓的因素。然而，你的个人品牌越强大，在许多情况下，一个经过充分调研的高期待值就越有可能为你带来回报。你越接近面试流程的尾声，你就越能自信地给出一个具体的数字，而不是一个范围。


  还有一种选择是与你的谈判对手结成同盟，你可以说，你知道她的工作是确保你的要求不会高得不切实际。因此，如果她告诉你公司的预算范围，你可以告诉她，对你而言继续推进是否合理。是的，我们又回到了那个著名的“先报价者输”的规则；但在这种特殊情况下，你只是抵消了一个不公平的劣势。一旦你得到答案，你应该告诉她，你有信心双方能达成一致。你甚至不需要透露具体数字，也不必暗示你的信心是源于期望薪资在预算范围之内还是之外。确保不要说你的期望与预算范围完全吻合，因为这会限制你未来薪酬的上限空间。


  第三种选择能为你节省一些时间。你可以透露一个关于你期望的更准确的线索。如果你的谈判对手表示担忧，或认为期望存在差距，你可以告诉她，你知道这些数字有点高，但你在面试过程中的职责就是证明你的贡献远超这个数字的价值。此外，你相信长久的关系；因此，对你而言，接受一份低于市场水平的薪资的工作意义不大。


  有些公司要求你在第一次面试前以书面形式透露你的期望薪资。遇到这种情况，你完全可以写上“`可协商`”。这或许有用，或许没用。最坏的情况是，公司会再次联系你。在这种情况下，你将不得不输入一个合理的数字——不是零，也不是`999999`，而是你真实的期望值。你可以通过明确说明你填写的数字只是初步的、不具有约束力，来最大化你的机会，因为你需要通过面试来收集足够的信息来确定你的期望。记住你有权改变主意，特别是在你接触到新信息的情况下。


  有些公司倾向于要求你透露当前薪资。明确表示此信息属于机密是完全没问题的。你无需解释。你当前的薪资可能会被用来对付你，特别是当它低于你的目标薪资时。在许多国家，这属于非法问题，尤其当你的雇佣合同规定薪资保密时。


  不要自断后路。即使谈判结果不如你所愿，也永远不要侮辱潜在的雇主。他们同样有人脉，世界很小，不值得因你缺乏专业素养而承担潜在后果。每当无法达成协议时，只需感谢谈判对手的努力，然后继续前行。


  要诚实。不要躲在那些你无法坦然呈现的谈判技巧背后。如果你是一名优秀的专业人士，不雇佣你或者支付低薪导致你流失，雇主失去的会比你多得多。个人诚信益处良多。


  例如，我的一个朋友在伦敦找到了一份工作。收到录用通知后，他根据自己所做的调研，要求将薪资提高 20%。他自信自己值得这个数目。他甚至再次与公司代表沟通，出示证据证明自己的要求并非虚言。最终，他得到了他要求的薪资。


  一年后他发现，他的薪资是他所在团队中最高的。他还发现，人力资源部门为他办理录用手续时需要获得特别批准。然而，他在面试中的表现非常出色，以至于人力资源部门认为，为此获得额外的批准是值得的。


  ### 练习谈判


  始终保持挑战自己的极限。最好的挑战方式就是积累亲身面试的经验。当风险较低时，你可以自信地进行谈判。如果你觉得将理论付诸实践很困难，那就投出几份简历，开始面试。只要确保不要选择你梦想中的公司来练习就行。


  在日常情境中练习谈判。当你去市场或者订购产品时，尝试协商一点折扣。你会通过练习变得越来越擅长。


  有一个练习能极大地帮助你建立自信：在合法录音的情况下，录下自己谈判的过程并重看。起初，这会非常不自在。如果你这样做 10 到 20 次，你会对自己的非语言沟通方式更加熟悉。你也会比以往任何时候都更适应自己。




  ## 有经验求职新目标清单


  假设你已下定决心，并正因充分理由考虑离开当前公司。


  - **设计你的职业发展路径**（第 3 章）。

  - **确定你希望迈出的下一步**（第 3 章）。

  - **评估当前雇主是否能助你迈出下一步**。在开始申请流程前，先了解获得晋升需要具备哪些条件（第 5–6 章）。

  - **收集符合期望的职位信息**。总结你需要学习哪些内容才能脱颖而出（第 7 章）。

  - **制定学习计划**。创建有意义的项目，优选开源项目。撰写博客分享所学内容。参加相关行业聚会（第 4 章）。

  - **更新社交媒体形象**，并根据个人品牌更新基础简历（第 4 章）。

  - **整理思路，转变心态与态度**。这有助于你在面试中发挥最佳水平。同时不要忽视当前角色，将他们视为你的客户（第 2 章）。

  - **针对每个职位执行待办清单**（详见下文），以获取录用通知。

  - **接受录用后正式辞职**。确保只接受一份录用。提前离职仅在确定能轻松找到新工作的情况下才有意义。


  针对每个职位：


  - **研究目标公司**，判断其录用条件是否令你满意。寻找推荐信或内部信息（第 7 章）。

  - **根据每家公司的需求逐一定制申请材料**。包括简历、求职信及相关项目清单。运用你的个人品牌（第 4 及 7 章）。

  - **提前准备面试**。提升自尊与自我形象，审视内心恐惧与限制性信念，确保沟通方式得体（第 2、5、7 章）。

  - **练习并准备**非技术面试与技术面试（第 7 章）。

  - **当被问及薪资期望时积极谈判**（第 7 章）。

  - **尽可能多地了解目标公司**。面试不仅是公司考核你，你也需判断是否愿意与该公司共事。一旦发现公司无法提供良好的工作氛围，果断拒绝（第 7 章）。

  - **运用沟通技巧收集反馈**（第 5 章）。

  - **评估录用通知**。你高质量完成的项目越多，越有可能在多个录用中择优选择。

  - **在接受录用前判断谈判的必要性**。若你本就打算拒绝该录用，则毫无损失可言（第 7 章）。


  ## 无经验求职新目标清单


  当你缺乏相关经验时，情况会略有不同。你可能是毫无经验的在校大学生，或正计划转行。


  我假设你目前没有工作。如果你已有工作，请务必与雇主协商离职通知期，并在获得录用后正式辞职。


  你很可能从初级全栈开发人员起步。设计职业发展路径固然有益，但并非找到第一份工作的关键。能够回答“五年后你希望成为什么样的人”或许能加分，但坦诚地说，在缺乏相关经验的情况下，现在不必为此类问题焦虑。


  - **设计你的职业发展路径**（第 3 章）。至少考虑三年，最好规划五年。

  - **制定学习计划并建立人脉**。建立你的作品集。创建有意义的项目，优选开源项目。撰写博客分享所学内容。参加相关行业聚会（第 4 章）。用展示出的技能替代实际工作经验。

  - **每学习一小时，分配两到四小时进行实践**。边做边学。建立作品集。一个你能侃侃而谈的已上传开源项目，其价值远超任何证书。

  - **社交媒体**。在领英（LinkedIn）上展示相关学习和经验很有价值。关于可靠性与软技能的推荐信通常具有正面作用。有深度的推文也会受到认可。社交媒体虽非求职中的决定性因素，但你需要从某处开始积累（第
  4 章）。

  - **训练你的软技能、心态与态度**（第 2 及 5 章）。这些技能将在面试中派上用场。


  针对每个职位：


  - **研究目标公司，聚焦于快速积累职业资本**，判断其录用条件是否令你满意。寻找推荐信或内部信息。你的第一份工作不太可能带来丰厚收入，因此应寻找值得学习的宝贵技能或公司内部的职业发展路径（第
  3 及 7 章）。

  - **根据每家公司的需求逐一定制申请材料**。一封展现高情商、并附带完成教程及副项目以证明专业能力的求职信，能让你超越 90%无经验的求职者（第 4 及 7
  章）。

  - **练习并准备**非技术面试与技术面试（第 7 章）。

  - **当被问及薪资期望时积极谈判**（第 7 章）。但需做好牺牲初级开发者薪资以换取职业资本的准备。务必要展现出你是一个愿意与公司合作的人。要自信，同时保持现实。若公司无法支付你期望的薪资，请确保能讨论出一个对双方而言双赢的条款，使你们能按你设想的方式合作。

  - **尽可能多地了解目标公司**。面试不仅是公司考核你，你也需判断是否愿意与该公司共事。一旦发现公司氛围或职业资本不适合你，果断拒绝（第 7 章）。

  - **运用沟通技巧收集反馈**（第 5 章）。

  - **评估录用通知**。你高质量完成的项目越多，越有可能在多个录用中择优选择。

  - **在接受录用前判断谈判的必要性**。若你本就打算拒绝该录用，则毫无损失可言（第 7 章）。




  ### 总结


  无论你是否有经验，在面试某个职位时，都需要经历同样的挑战。你会与人力资源、业务人员和工程师进行交流。你需要与所有各方建立联系。


  你最好的策略是付出额外的努力，表现出真诚的兴趣，并尊重你遇到的每一个人，即使面试看起来已经结束。


  在提交简历时，请确保根据你申请的职位进行定制。在行为面试和技术面试中，你最好的策略通常是坦诚地分享你的思考过程。这样，面试官将能够为你提供帮助。


  虽然谈判是申请过程中的重要部分，但最大的回报是在申请过程中赢得的。一旦你让自己的生活尽可能轻松，在为自己争取更高薪酬的谈判中，你将会拥有优势。


  不要忘记本部分末尾适用于你的清单，以便为下一次面试做好准备。


