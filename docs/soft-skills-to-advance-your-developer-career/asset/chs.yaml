- "# 4. 你的线上与线下形象\n\n软件开发者的个人品牌塑造\n\n工作满意度是软件开发者关注的重要话题。有些开发者只想赚更多钱，另一些则追求更好的工作保障或工作条件。还有开发者希望通过影响许多人的生活并打造令自己真正自豪的事业来留下传承。\n\
  \n为了朝着目标方向继续前行，你必然需要明确自己的信息并传达给外界。这样一来，他人会了解你的职业目标，你也会在旅途中获得盟友。通过建立线上与线下形象，你将消除可能阻碍他人与你合作的潜在借口。别人会发现你的独特之处，其中一些人会认定值得与你这位专家合作。\n\
  \n要加速进步，你不仅要学习技能，更要投资于让这些技能被看见。\n\n我们将从设计个人品牌开始，探索你希望外界了解你什么。这一决定将直接影响你社交媒体内容、项目与博客内容的创作。\n\
  \n明确信息后，我们将开始建立你的社交媒体形象，让他人愿意与你合作。\n\n与许多职业不同，在软件工程领域，展示你所知比空谈所知更能助你获得录用。因此，我们将讨论构建作品集的基本功。\n\
  \n在探讨成功作品集背后的原则后，我们将讨论博客如何成为构建作品集的最佳资产之一。博客的趣味性体现在多个方面：首先，写作能更好地理清思路；其次，你会挑战自己学习并分享新事物；最后，你的努力会让你成为特定领域的专家。\n\
  \n创建网络研讨会和 YouTube 频道则将一切提升到新层次，因为以专业方式即时谈论某个主题难度更大。\n\n我们还会识别沿途的时间浪费点。根据帕累托原则，80%的成果源于\
  \ 20%的任务。尽管这听起来像陈词滥调，但它凸显了大多数任务其实无关紧要。我们将识别那些不会让你进步的时间浪费点。\n\n我们将探讨线下聚会和会议的作用。你常会遇到可合作的伙伴，并聆听绝妙的想法。\n\
  \n让我们从你的个人品牌开始。\n\n## 设计你的个人品牌\n\n**本节目标：**\n\n- 发现你的价值观。\n- 确定你作为开发者提供的价值。\n- 学习如何为线上形象创建个人品牌。\n\
  \n乍看之下，你可能认为个人品牌与软件开发关系不大。在本节中，你会发现它不仅必要，更是 21 世纪的热门话题。\n\n随着社交媒体普及，我们能连接的人比以往任何时候都多。越来越多的人试图争夺我们的注意力。因此，注意力已成为比以往更稀缺的资源。如果他人无法感知到正向回报，就不会听你说话。\n\
  \n人们会将注意力导向有价值的信息。因此，我们将基于价值观引入个人品牌概念。在打造个人品牌的过程中，我们会向他人明确自己的价值观。\n\n你的价值观可以用来塑造特定企业群体想要雇用的专业形象。这意味着你要帮助特定类型的企业更多了解你。如果你清楚想为哪些企业工作，就会在求职中节省更多时间。了解价值观是确定目标企业类型的方法之一。\n\
  \n个人品牌的关键在于展现你的价值观。受众的看法就像相机的镜头：镜头可能变形、损坏或污浊。我们完全无法影响相机本身，只能影响我们展示自身的部分。这正是个人品牌的核心。\n\
  \n虽然无法影响相机，但你能影响：\n\n- 对准哪些镜头\n- 如何在镜头前站立\n\n在站到镜头前，先思考获取理想职位所需的专业技能，并据此塑造个人品牌。通过创作故事并传递情感，打造持久印象。\n\
  \n### 什么是品牌？\n\n品牌是一个带有某些期待的故事。创建品牌时，你相当于做出了一个承诺，他人会期待你兑现。有些期待与更高价值相关，有些则关联较低价值。\n\
  \n期待之所以重要，是因为人们依赖你提供的内容。就业市场中的\"市场\"一词意味着供需规律的存在。如果你不注重个人品牌，就业市场对你知之甚少，就会导致对你服务的需求低迷。如果你向潜在雇主传递混乱信号，就会在你周围形成不确定性的迷雾。\n\
  \n这就是为何要识别值得向外界广播的自身信息。\n\n有多种发展个人品牌的方法和框架。我强烈推荐 Luigi Centenaro 的个人品牌画布。^(²⁸)如果你从职业角度审视这个画布，你将得出非常有用的结论，消除当前或未来雇主眼中的不确定性。\n\
  \n21 世纪是品牌的世纪。品牌所有者需要其品牌与客户建立可持续的关系。\n\n要创建可信品牌，你必须知道当下所处位置以及未来想去之处。如果你正按顺序研读本书材料，那么你已经弥合了差距。\n\
  \n为支持你抵达理想目的地的旅程，你需要了解自己的价值观。\n\n\n\n### 确定你的价值观\n\n多数人用当前的工作来定义自己。请牢记，你的工作是你个人品牌的一部分，但还有许多其他方面值得你思考。\n\
  \n你的日常行为都基于你的价值观。弄清楚你的价值观是什么，这样你才能更接近真实的自己。你可能已经知道自己的个人价值观是什么。如果需要帮助，可以填写`VIA Character\
  \ Strengths`问卷。^(²⁹)\n\n在首次填写这份问卷的半年之前，我曾自己确定过我的价值观，试图把在一篇关于托尼·罗宾斯的文章中找到的性格优势排序。^(³⁰)\n\
  \n那时，我的生活面临着许多挑战，这些挑战源于试图满足他人的期望。我的价值观被扭曲了，因为它们不是关于我真正想要的，而是关于别人希望从我这里得到什么。每当我面临道德困境时，我会思考我的价值观并据此行事。但这些行为一点也不令人舒适。我感觉缺失了什么。\n\
  \n在填写完`VIA Character Strengths`问卷后，一切才变得合理。我曾认为最能代表我的两个核心价值，在新榜单中甚至没能进入前十。这让我对自己的价值观产生了质疑：它们究竟是我自己的，还是仅仅为了满足他人的期望而存在？\n\
  \n如果你的价值观不属于你自己，你就活在否认之中。这就是为什么根据你自己想要的、而不是他人希望你成为的样子来选择价值观至关重要。\n\n在发现自己的性格优势后，一切豁然开朗。我的决定变得舒适自如，我甚至明白了当时为什么那么热爱我为之工作的那家公司。我也明白了自己为何晋升得如此迅速。我公司最看重的四大价值观，都出现在我个人价值观的前六项中。一旦你知道不仅你的公司，而且你本人也在践行这些价值观，合作就会变得非常顺畅。\n\
  \n通常，我们真实的价值观与我们感知到的价值观是不同的。原因之一是社会的影响。当许多人想要违背社会期望去追求自己的梦想时，他们会感到内疚。不要走上这条路！你应该活出自己的梦想，而不是别人的梦想。\n\
  \n现在，你可以重新思考你期望的目标。如果过去你是在构建别人的梦想，那么请随意回到第 3 章，重新规划你的未来五年。设定目标是一个迭代的过程。当你发现生活或自己的新变化时，不要害怕改变你的目标。\n\
  \n### 注意\n\n践行价值观的另一个方面是，人们往往会为了满足自身需求而违背自己的价值观。这就是为什么第 2 章如此重要。强大的自我形象、高自尊、成长型思维以及普遍摆脱受害者心态，这些都有助于你满足自身需求。这反过来会增强你排除干扰、践行价值观的能力。\n\
  \n请注意我们方法的层次：\n\n*   第 2 章：学习如何从内心满足自身需求。\n*   第 3 章：明晰你的愿景和使命。\n*   第 4 章：发现你的价值观并在线上传达。\n\
  \n你个人品牌最重要的要素之一，是你被感知到的表现。你需要展示出你正在将自己的长处用于正当的事业。\n\n你的表现必须由你的价值观和道德准则来引导。没有道德准则的表现毫无意义，而且也会让人失去动力。例如，当我思考自己的道德准则时，我想到了以下几点：\n\
  \n*   每当我交付解决方案时，我追求卓越。\n*   我致力于创造最大可能的价值。\n*   我有明确定义的质量标准，并且我拒绝在长期内降低我的质量标准。\n\
  *   在短期内，如果业务需求要求我妥协质量标准，我会配合，并申请事后时间来妥善清理问题。\n*   我在基于信任和尊重的环境中与所有人合作。我拒绝与暴君合作。\n\
  *   我每周都会训练自己，解锁新能力。这导致我技能水平的指数级增长。\n*   解决问题的过程对我而言比词汇知识更重要。\n*   我的方法很灵活。常识可能凌驾于我生活和职业生涯中的任何规则之上。\n\
  *   我欣赏良好的品格特质。我拒绝工作场所的有毒行为，并捍卫我的边界。\n\n如果你想更进一步，我强烈推荐阅读或收听雷·达里奥的《原则：生活与工作》这本书。^(³¹)\
  \ 我知道雷·达里奥不是一名软件开发人员。然而，他的原则启发了我自己的职业生涯，因为他作为一名管理者和精英领导，激励我重新定义了自己对专业精神的看法。\n\n\
  我很少明确传达这些规则。它们是我交付成果的方式，而人们对我的道德准则有很好的了解，因为我的行为与它们**一致**。\n\n例如，当我的经理告诉我，除非我们在两周内完成某项工作，否则我们将失去一个重要客户时，我告诉他我会尽一切努力在两周内交付，他可以信赖我们。但同时，我也需要在之后的两周时间来清理这个过程中的遗留问题。我立即获得了额外两周的批准，并且可以指望这额外两周的重构时间。\n\
  \n在另一个项目中，出现了规格变更，导致至少需要额外两天的工作量。我的意见是，根据我们的协议，应该拒绝这个变更。只有尊重当前处理的工作里程碑的范围，我们才能交付质量。我仍然鼓励进行讨论，因为在里程碑发布后立即进行的增量更新中，将包含这些变更。\n\
  \n常识凌驾于这些规则之上。例如，如果规格变更导致减少了三天的工作量，那么显然我们应该例外处理并改变范围。\n\n每当你需要行动时，思考你的价值观，并始终如一地按照你的规则行事。\n\
  \n### 你提供的价值\n\n确定你能提供什么。如果你缺乏经验，并且提供 WordPress 开发服务，你知道竞争非常激烈。你提供的价值很可能就是“便宜”。\n\
  \n如果你作为一名 WordPress 开发者拥有闪亮的作品集，你可以预期会收到更多雇主的邀约，但市场上仍有很多人能提供类似质量的工作。\n\n一个以创建获奖\
  \ WordPress 网站而闻名的开发者则属于不同的类别。此外，如果你声明自己专攻实现快速的 Headless CMS 解决方案，并且你的标语是“WordPress\
  \ 领域获奖的 Headless CMS 开发者”，并附上最新的版本号，那么可以放心，人们会找到你。\n\n\n\n### 注意\n\n如果你持续更新所用软件的版本号，人们就会知道你始终处于**最新状态**。简历中若是出现诸如`PHP5`或`ECMAScript\
  \ 5`这类过时技能，没有什么比这更糟糕的了。就连`AngularJs`也是个陷阱，因为从 2.0 版本开始，这个框架就被称为`Angular`。\n\n更进一步说，如果你是一个无头\
  \ WordPress 开源仓库的贡献者之一，那么你几乎不会在求职或自主创业方面遇到任何问题。\n\n思考所有你想让别人记住的技术技能，并且别忘了要专精。我见过太多简历声称其主人精通`JavaScript`、`PHP`、`MySQL`、`.NET`、`Java`、`C`、`C++`、`Prolog`、`Haskell`、面向对象编程、`UML`、函数式编程、各种框架，甚至还有\
  \ Microsoft Office。回想一下我自己的经历，我大学毕业前的一份简历就是这样。那时，我真的不知道该如何推销自己，只能靠过往成就来展示个人价值。选择一个细分领域并坚持下去。如果是`Angular\
  \ 7`，那就从简历中删掉其他所有不相关的信息。谁在乎你有没有驾照？谁在乎你懂不懂 Microsoft Excel？你到底是软件工程师还是财务管理员？这条建议适用于你所有线上线下的个人形象展示。你不必隐藏过往的工作经历，但也不要展示一长串无聊且不相关的技能列表。\n\
  \n你的软技能同样重要。确定你希望别人记住你的地方，并确保你持续练习这些技能。确保你能够始终如一地运用它们。你不应该在领英上写自己是个出色的沟通者。相反，要创建一个引人注目的使命宣言，编辑你的职位描述，并在他人的推荐信明确表明你是个出色的沟通者时，利用这些社会证明。\n\
  \n根据路易吉·森特纳罗的说法，你可以提供四种类型的利益。\n\n**功能性利益**主要取决于你的常规技能和解决问题的能力。如果你的雇主知道你有能力解决问题，你就很有机会提供这些功能性利益。例如，以下是一个潜在的功能性利益：领导一个由三名开发人员组成的团队，为公司的某项服务创建一个基于`REST\
  \ API`的客户端富网络应用用户界面。\n\n**情感性利益**主要基于软技能。你需要创造大量价值，因为没有软技能可以替代价值。另一方面，一个很难交流、经常醉醺醺地上班、不洗澡、有时还拒绝工作的天才，在任何地方也都不受欢迎。每个人都必须提供作为可靠之人的基本利益，且无需过多维护。领导者以及需要与利益相关者沟通的人，则必须提供更多。\n\
  \n展示情感性利益很困难，因为你绝不想吹嘘自己的软技能有多棒。要运用讲故事的方法来培养叙事影响力，确保其他人知道你是因为始终如一地运用软技能而闻名，并且能够满足他人的需求。\n\
  \n**自我表达型利益**群组比前两者更难表达。这主要关乎兑现你个人品牌的承诺，兑现你希望被人记住的那些方面的承诺。\n\n**社会性利益**则更为明显，并且在某种程度上与情感性利益相关联。一个软技能出色的人很可能同时具备这两者。然而，社会性利益超越了沟通能力。其他人与你相处应该更加融洽。这意味着你的性格应该心智成熟。拥有有趣的业余生活和爱好也很有帮助。你也许以每周末举办核心训练聚会而闻名。或者，你可能是那个在公司引入半小时冥想课程以提高效率的人。你也可能是那个在公司建立读书会或跑步俱乐部的人。\n\
  \n你的可信度来自：\n\n- 一致性\n- 在你所能提供价值的情境下展示你的能力\n- 通过不展示无关细节来聚焦个人简介\n- 创造能满足雇主或客户需求的价值\n\
  \n### 使命宣言、愿景宣言、标语\n\n一旦你明确了规则，就更容易为你线上的个人形象创建愿景宣言、使命宣言和标语。缺乏这些宣言，意味着别人会认为你是一个可被替代的人。\n\
  \n**使命宣言**回答了你要如何达成目标。这些是你已经在做的事情，或者是你希望世界知道你在做的事情。\n\n**愿景宣言**回答了你正朝着什么目标前进这一疑问，并详细说明了你想成为什么样的人。你还记得那个人力资源老套的问题“你如何看待自己五年后的样子”吗？愿景宣言就是你对此想法的一个简短总结。\n\
  \n**标语**是对你核心目标的一个非常简短的总结。试着只用几个词来表达。\n\n### 注意\n\n如果你难以构想出愿景、使命和标语，那就思考你的价值观。思考一下**为什么**你想要改变世界。是什么在驱动你？然后思考你**将如何**去做。最后，思考你**打算**做什么。寻求灵感的话，可以看看西蒙·斯涅克名为*《伟大的领袖如何激励行动》*的演讲。^(³²)\n\
  \n在领英资料和简历中使用你的愿景宣言、使命宣言和标语，并准备好口头表达它们。\n\n你的使命宣言、愿景宣言和标语应该传达出，为什么你是你所承担项目的最佳人选。在线上和线下（无论是领英、推特、你的博客，甚至你的脸书账号）都要始终如一地传递这一信息。\n\
  \n例如，假设你的**愿景**是创造一个环境，让协作能汇聚专业人士，不论他们的专长领域。为什么？因为你喜欢与那些乐于贡献而非竞争的人共事。因为在你内心深处，看到大量宝贵的精力因开发者、用户体验、产品管理与业务部门之间缺乏共同语言而经常浪费，这让你感到沮丧。\n\
  \n\n### 注意\n\n在解释为何你对自己的愿景感受强烈时，最简单的回答是“因为我热爱通过这种方式带来改变”。你的情感本身就是普遍成立的陈述。如果你声明自己热爱某件事，这便会默认被接受为一种正当理由。同时，这也表明你工作的动力超越了仅仅赚取薪水。\n\
  \n`**使命陈述**`（mission statement）回答的是“如何做”的问题。例如，你可以通过定义协作方式来构建一个组件库，从而将用户体验（UX）和前端开发团队凝聚在一起，以此改善合作同仁的工作体验。这个库能帮助开发者理解\
  \ UX 概念和考量，也能帮助 UX 团队了解开发者如何思考和使用他们的组件。\n\n你的`**标语**`（tagline）可以是这样：我通过构建可维护、易用的\
  \ Web 组件库，将 UX 设计师和 Web 开发者紧密联系起来。\n\n每当你未能基于过去的承诺传达出他人对你的期望时，你的个人品牌就未能实现其主要目的。由于你正是这些期望的创造者和塑造者，因此你的每一句话都至关重要。例如，如果你的个人品牌表明你是一个值得认真对待的人，那么公开在\
  \ Facebook 上发布一张在大多数人看来尴尬的场景照片，通常就毫无意义。其他人也许能安然过关，因为他们的个人品牌与以自己的方式寻找乐趣并不冲突。\n\n\
  有些公司绝不容忍任何人的此类行为。另一些公司则可能在查看你的 Facebook 个人资料后立刻将你拒之门外。不同的镜头会构建出你不同的形象。我建议你向他们展示自己专业的一面，并将\
  \ Facebook 上的敏感内容设置为仅好友可见。\n\n做自己总是有道理的。塑造一个你假装想成为、但实际并不想成为的虚假人设，是毫无意义的。如果你无法扮演好这个人设，别人很快就能识破，这意味着你的工作可能在试用期结束时就岌岌可危了。\n\
  \n如果你想将这些想法更进一步，可以创建一个`**电梯演讲**`（elevator pitch）。电梯演讲就是用几句话，在遇到陌生人时描述你的职业。它必须非常有趣；否则，别人不会对你有任何印象。它还必须通俗易懂，即使你遇到的人对你所在的专业领域一无所知。用寥寥数语，以最佳方式表达你自己。\n\
  \n### 头像、着装、仪容\n\n有一次，我的经理注意到一个现象：有些软件开发者只有在打算离职、开始去别处面试时，才会刮胡子、好好着装。我不同意这种一概而论，但不幸的是，我能回忆起至少五位表现出这种倾向的软件开发者。阅读本节内容，你将有机会脱颖而出。\n\
  \n你的外表不是全部，但它确实重要。你的衣橱，你的个人风格，也是你个人品牌的一部分。在某些公司，着装要求是强制性的。如果你尝试穿得比公司规定稍微正式一点，绝不会出错。\n\
  \n在一些初创公司，穿西装反而可能对你不利，会让人觉得你与他们不是一类人。如果你觉得商务休闲装穿着舒适，仍然可以穿。\n\n当我做顾问时，我的经纪人要求我穿商务休闲装。即使其他人都穿得很随意，我反而以一种积极的方式脱颖而出，受到了尊重，甚至有人评论说终于有人穿得有品位了。获得这些评价的关键在于，你的衣服必须让你感觉舒适。只穿对衣服是不够的，你还必须懂得如何穿。\n\
  \n合身通常比你穿的品牌更重要。我承认，以前有些衣服对我来说有点松垮，尤其是在我开始减肥之后。一旦我学会注重衣着，并从之前穿过的同一个品牌买了更合身的衣服，一些同事就开始称赞我。有一次和一位女同事吃午饭，她坦言整个部门都注意到我变得更时尚了。\n\
  \n这为什么重要？\n\n人们仅凭你穿着得体就对你产生积极评价，其原因在于`**光环效应**`（halo effect）。他们对你生活中某一领域的印象，会影响他们对另一领域的看法。换句话说，如果你穿着得体，更多人可能会认为你工作也同样出色。唯一的例外是，当你穿着不自在，或者你的着装与他人截然相反时。在这些情况下，人们不会对你印象深刻，也就没有什么积极因素能影响他们对你的工作评价。\n\
  \n通常，你的工作成果会说明一切。然而，你永远不会有第二次机会来制造第一印象。衣着和光环效应正是第一印象的重要组成部分。\n\n你的着装应该与你要传达的信息保持一致。如果你想做一个平易近人、接地气的人，那么穿着皮夹克、牛仔裤和\
  \ T 恤去参加会议做演讲，完全没问题。\n\n### 注意\n\n作为一名软件开发者，我尽可能理性地思考。不幸的是，在时尚方面，理性思考很难掌握。理解时尚背后逻辑的关键在于，要接受穿时尚服装需要付出代价。时尚的衣服有时会不舒适。有些配饰毫无功能，因此从理性角度看不合逻辑。从进化角度看，这些物品显得时尚的原因在于，其拥有者能够承担穿戴它们所需付出的成本。想想熨烫衬衫使其完美无瑕所需的时间和金钱。使一件物品时尚的不是它的功能，而是它所传递的讯息：你乐于穿着它。\n\
  \n把服装看作表达自我的一种方式。你是否希望别人知道你是个沙发上的运动爱好者，就因为你一件有趣的 T 恤上这么写着？如果幽默是你的价值观之一，这完全没问题，因为你每天都会被期望穿上有趣的\
  \ T 恤。否则，这只会为你真实的形象增添噪音。\n\n一旦你对自己的穿着感到自在，就去拍一张专业的头像照，并始终如一地在各处使用它。你想平易近人吗？穿休闲装。你想彰显高地位吗？穿一套合身的西装。你想看起来像个丑角吗？那就穿一套完全不合身的西装，系一条结打得笨拙的领带，确保你的衬衫是皱的，并且颜色搭配也不协调。\n\
  \n### 触达你的受众\n\n如果你的目标受众找不到你，那么你的品牌就毫无价值。例如，如果你正在转行，那么你的新个人品牌对你当前的雇主来说价值并不大。写博客、启动一些相关的副业项目会有所帮助。但是，目标受众必须能找到你。\n\
  \n让你自己的名字广为人知！如有需要，就去回答 Stack Overflow 上的问题，去 Quora，在[medium.​com](http://medium.com/)上写作，参加线下聚会和会议，在聚会上做演讲，创建播客，制作\
  \ YouTube 视频，在 GitHub 上创建有意义的内容，或者直接去参加求职面试。\n\n在软件行业寻找榜样，看看他们在做什么。也许你自己也能学到一些东西。不要模仿他们的个性，只需寻找想法，并结合你自己的曝光度去思考它们。\n\
  \n如果你提供了大量价值，人们会开始谈论你，你的曝光度也会自然而然地增加。结识新朋友仍然会增加你的机会，因为你可以从更多的机遇中进行选择。因此，在接下来的章节中，我们将致力于提升你的曝光度。\n\
  \n\n\n#### 练习\n\n1.  根据本部分提到的 VIA 问卷调查，确定你自己的价值观。如果感觉这些价值观有误，可以随意覆盖。开始解决内心的冲突。\n\
  2.  制定你的商业行为准则，明确你作为软件开发者的行事方式。我强烈推荐阅读雷·达里奥的著作《*原则：生活与工作*》。\n3.  思考你能提供的价值，包括路易吉·森特纳罗定义的四种利益类型。\n\
  4.  阐述你的愿景、使命，并创作一句标语。\n5.  准备一份电梯演讲，并在镜子前练习。\n6.  识别你当前的个人风格，并考虑是否需要提升。如果需要，今天就朝着提高创造良好第一印象的能力迈出一步。\n\
  \n## 令人无法抗拒的简历和求职信\n\n**本节目标：**\n\n-   利用你的个人品牌来确定简历的内容。\n-   让你的简历和求职信显得真实。\n-\
  \   了解雇主的需求，并针对他们定制你的申请材料。\n-   通过讲故事来丰富读者的体验。\n-   用钩点将你的求职信和简历连接起来。\n-   如果职位值得，可以考虑更进一步，制作一个视频。\n\
  \n是时候将你的个人品牌转化为简历了。\n\n我明白写简历可能不是你最喜欢的活动。我理解你可能认为自己正在写一份甚至不会被阅读的纸张。很多人可能在 5 秒后就合上你的简历。因此，我们首先需要创造一些优势。\n\
  \n想象一下，创建一份能吸引许多人注意的简历。想象一下，如果你的简历为你要谈论的内容提供了一些线索，那么面试过程对你来说会有多么轻松。简历的目的不是获得面试的入场券。真正的目的是设定面试的框架，让整个面试过程更容易。\n\
  \n我们将焦点从获得入场券转移到设定面试框架上。毕竟，软件开发者正处于高需求状态。一些公司即使你的简历平平也会给你面试机会。问题是：你将如何在面试中让自己更轻松？你将如何最大化你的赚钱能力？\n\
  \n通过学习如何制作一份好的简历，你还能节省时间。这只是一个小小的投资，但你会获得更多机会，并且随着实践经验的积累，你制作简历所需的时间会越来越少。正如你在上一章所知，营销自己是当今一项不可或缺的技能。学会写好简历可能会为你带来数十万美元，甚至在你整个职业生涯中达到七位数的收入。\n\
  \n你的简历不是一份过去工作的清单。它是你作为专业人士如何生活的证明，清晰地指明了你的职业发展方向。\n\n在撰写本节内容时，我已经有超过 9 年评估求职申请的积极经验。即使我们不会在一周内收到数百份简历，我发现筛选申请仍然很困难。在看过超过\
  \ 500 名应聘者的实际操作后，我总结出了很多人在写简历时做错的事情，以及只有少数人做对的事情。\n\n大多数人只是列举他们的工作经历、学习经历，加入一些陈词滥调，然后听天由命。当时运不济时，他们就开始散布经验，说就业市场不行，你如果有份工作就该庆幸了。要摆脱这种危机，你需要做的就是从大众竞争的底层提升自己，瞄准顶层，那里是优秀专业人士收获回报的地方。\n\
  \n正如我们在上一节得出的结论，每个人、每个招聘经理、每家公司对你的个人品牌解读都不同。你的个人品牌如同被不同的相机捕捉成的不同影像。因此，我们的个人品牌本质上是富有弹性的。\n\
  \n弹性并不意味着我们要通过否定真实的自我来满足他人的期望。它只是意味着我们会根据我们目标职位和公司，强调我们身份、技能组合和经验中的不同特征。这种弹性将在你的简历和求职信中清晰可见。\n\
  \n这正是专业简历写手不能解决你所有问题的确切原因。无论你得到的简历质量如何，你都必须对其进行调整。专业撰写的简历对于你申请的某个职位来说是一笔巨大的财富，但之后你将不得不进行修改，而你的修改必须与简历的风格保持一致。\n\
  \n一致性也意味着你的个人风格应该与简历的风格保持一致。基于我们在本书中重视的四项基本软技能，承担自己撰写简历的责任对你来说将是一项宝贵的技能。你将在面试中收获撰写简历的回报，因为你的大脑中会形成更多的神经连接。\n\
  \n请思考一下：你的简历是众多营销工具中的一种。在 21 世纪，营销自己将是至关重要的。除非你雇佣了自己的营销团队，否则你必须变得善于自我营销。第一步就是掌控你的简历。\n\
  \n无论你是愿意花 100 到 1000 美元请专业人士写简历，还是自己动手，请记住它必须*真实*。外面有很多不诚实的求职者，这使得招聘经理比以往任何时候都更加不宽容。真实性是一种巨大的价值。在这个社会中，人们竭尽所能地根据他人的期望改变自己的形象，以至于到了失去自我的地步。\n\
  \n请记住，如果你不愿意学习这项技能，你仍然可以从专业简历写手那里学到很多。除非你购买廉价、二流的服务，否则专业撰写的简历会比写得差的简历看起来更好。然而，迟早，学会如何自己营销自己是值得的。\n\
  \n如果你选择雇佣专业简历写手，请尽最大努力从他们撰写简历的过程中尽可能多地汲取知识。运用横向思维，弄清楚你可以在哪里学习这些技能。然后完善你的领英资料。完善你的博客。\n\
  \n如果你与专业简历写手合作得足够好，你的简历将会是真实的。因此，当有人向我提出 100 美元代写简历时，我持怀疑态度。根本没有足够的时间进行迭代并建立共识。\n\
  \n\n\n### 企业在寻找什么样的人才？\n\n首先，企业希望确保你具备足够的胜任力，能够独立做出贡献。许多公司曾被那些看似内行、实则制造麻烦多于创造价值的人所蒙骗。因此，你必须在求职材料中展现出高度成熟，并提供一些证明。\n\
  \n企业也在寻找不需要过多管理的员工。他们需要能独立解决有意义的问题、主动提出方案，而不会因微小障碍就停滞不前的人。\n\n企业希望找到在文化层面能融入团队的人。我们都知道，与那些从冰箱里拿走你的午餐、拒绝完成分内工作、或不断分散他人注意力的人共事是多么困难。\n\
  \n除了这些基本需求，我可以向你推荐西奥迪尼教授的《影响力》一书。^([^(33] (#fn33))) 你的简历和求职信应传达影响力的六大基本原则。\n\n西奥迪尼的六大原则——互惠、一致性、社会认同、权威、喜好和稀缺——已被转化到职场语境中。更多详情，请查阅题为“说服原则”的文章和视频。^([^(34]\
  \ (#fn34)))\n\n### 创造产品-市场匹配\n\n把你的职业生涯看作一门生意，你的服务就是产品。你必须在就业市场中为这些服务找到一个合适的位置。你的任务就是为你的服务创造市场匹配。\n\
  \n为了实现产品-市场匹配，你需要简历、求职信以及面试；你需要设定自己的价格。在幕后，你个人品牌的所有其他表现形式，都支持着产品-市场匹配的达成。\n\n如果你想面向所有人，那么愿意为你的服务出价的人就不会多。这就是为什么单纯罗列所有过往雇主、所有技能、仅仅依赖数据是毫无意义的。然而，大多数人恰恰采用了这种策略，还纳闷为什么自己的产品没有市场。\n\
  \n许多人不知道应该展现自己的哪些方面。他们制作出一份基于数据的简历和一封充满陈词滥调的求职信。而你需要做的，恰恰是证明你拥有某个职位所需的技能。\n\n为了证明你的技能，你需要能够通过口头和书面两种方式讲述故事。故事能留下持久的印象，而且听起来不像自夸。故事也具有说服力，因为你让听众自己形成结论，而不是直接告诉他们你是公司完美的资产。为了塑造恰当的形象，你必须讲述合适的故事。\n\
  \n雇主的兴趣在于了解你是否能激励同事。他们想知道你是否能很好地融入团队，还是会因为你的情绪、态度和破坏性行为而让他们花费大量金钱。你可以是世界上最优秀的专业人士，但如果五个同事中有五个都因为你而辞职，那么对任何公司来说，雇用你都不值得。\n\
  \n你的简历应为你软技能塑造积极印象。唯一可信的方式就是通过讲故事。如果你写出诸如：\n\n*   你是公司的宝贵资产\n*   你交付高质量的工作\n*  \
  \ 你拥有出色的沟通能力\n\n这样的陈词滥调，你的招聘经理很可能将这些句子视为废话。但如果你讲述一个简短的故事，内容是关于你如何克服挑战，通过发现一个沟通错误节省了十万美元，或者提前完成了时间紧迫的更新任务，那么你的招聘经理很可能会认为你将是一名宝贵资产，你能交付高质量的工作，并且你值得信赖，能交付出色的成果。\n\
  \n此外，由于前面提到的光环效应，人类的想象力往往会倾向于你，为你关联更多优秀的性格特质。\n\n确保你的雇主在阅读你的简历时，会开始为你构想一个能为他们公司带来巨大盈利潜力的形象。这将提升你很可能从潜在雇主那里成功获得的薪资期望。\n\
  \n### 放手去做：无拘无束地讲述故事\n\n讲故事非常困难，尤其是对新手而言。如果你不习惯写作，你会面临一些挑战。在专业简历中，篇幅限制也会对你造成不利。这就是为什么你需要学习讲故事的基本原理。\n\
  \n当我在 [zsoltnagy.​eu](http://zsoltnagy.eu/) 撰写第一篇文章时，我很害怕在 Hacker News 上发布。我以为人们会批评我。当你思考将基于事实的简历改写为我建议的格式时，你可能也有同样的恐惧。\n\
  \n你可能还会觉得，自己不配提及某项成就，甚至不配瞄准一个高薪职位。这是另一种你应该消除的限制性信念。相信我，尽你所能，写好最好的简历，值得付出一切努力。你可能比最合适的候选人经验更少，却获得了梦想的工作。\n\
  \n如果你先修炼好自身，放下恐惧，你的故事就会真实可信。你会敞开心扉，变得有弱点，其他人也会更好地与你产生共鸣。这就是你如何留下持久印象的方法。\n\n人们喜爱故事。故事能抓住我们的注意力，让我们的信息独一无二且引人共鸣。一份好的简历能以引人共鸣的方式讲述你的故事。在读完故事后，读者会了解你，了解你的历程，并且更愿意在你的求索之路上与你合作。\n\
  \n创作一个好故事的秘诀在于分析你的受众。你的简历不在于你。你未来的雇主感兴趣的是，通过选择你，他们能获得什么价值。问问自己，潜在雇主在寻找哪些技能？他们正面临哪些问题？在评估你的简历并考虑雇用你时，你的雇主担心什么？始终根据职位广告来个性化你的故事。使用他们的表述，向他们表明，你并非随机发送了数百封内容完全相同的申请。\n\
  \n抛开所有常规。简历这件事，根本不存在什么常规。你能做的最糟糕的事情，就是使用像 Europass 简历格式这样的流行模板。\n\n故事的核心，是关于一个挑战。\n\
  \n\n\n### 故事化简历\n\n让我们为制作简历打下基础。\n\n从传统方式入手是合理的。如果你选择附上自己的照片，请使用专业的头像。填写你的个人信息。简历上不需要标题，因为那是多余的。在第一页顶部展示`Resume`或`Curriculum\
  \ Vitae`毫无意义；这只会让你显得不够亲切。\n\n简历的顶部区域应包含你在线形象的链接。链接到你的`LinkedIn`个人资料、`GitHub`个人资料、`Stack\
  \ Overflow`个人资料、`Medium`账号以及你的博客（如果你有的话）。如果你做过任何其他值得一提的事情，考虑附上相关信息链接。\n\n简历的第一部分应该关于你的职业目标，以及你希望创造何种不同影响的动力。思考你的愿景、使命宣言和你的标语。以一种对雇主而言看起来不错的方式来表述。大多数人从不这样做。因此，你的招聘经理不太可能仔细阅读这一部分，并且会迫不及待地想了解更多关于你的信息。\n\
  \n在前面的部分，你构建了你的电梯演讲。用类似的方式围绕你的一些成就构建一个故事。用数据支撑你的成就，并围绕其构建一个故事。\n\n故事的框架如下：\n\n-\
  \   你的项目目标是什么？\n-   你面临了哪些挑战？\n-   你是如何克服这些挑战的？\n-   你取得了什么成果？\n\n例如：\n\n-   协调开发了一个旨在实现客户经理工作自动化的用户界面。由于与客户经理的持续合作，我们成功理解并自动化了他们的大部分工作。这使得我们无需增员就能将客户规模从\
  \ 100 家扩展到 800 家，每年节省数十万欧元。\n-   我负责优化我们各端点的性能，使我们的平均响应时间从 2.5 秒降低到 0.4 秒。挑战在于查询由数千个\
  \ SQL 语句构成，我的目标是设计一个能够消除 90%查询的查询规划器。由于只有两周的时间限制，我不得不专注于能带来最大改变的优化。最终结果与客户留存率的提高相关联。我们的服务器负载降低了\
  \ 10%。\n-   当我加入 X 公司时，我的任务是将紧急热修复比率从每天八次降低到每周一次。这促使我跳出框架思考，因为我们必须衡量是改变开发流程、减少技术债务、鼓励知识转移、解决缺乏自动化测试的问题，还是改变团队处理热修复的方式，对于降低错误率影响最为显著。我喜欢这些挑战，因为它们不仅是技术性的，还涉及到人。这些度量指标激励着我，18\
  \ 个月后，得益于整个团队的帮助和承诺，我们似乎已经实现了目标。\n\n确保你的故事没有充斥着数字和外来词汇。下面这个故事就不够理想：在 28 个工作日内，将包含`Backbone+Marionette`技术栈和`Stickit`双向模型视图绑定器的\
  \ 15 万行代码，替换为`React`和`Redux`。任务包括重写 2735 个`Mocha+Chai+SinonJs`单元测试和集成测试。\n\n在你最突出的成就之后，你可以向读者介绍你的工作经历；但不要侧重于你的职位，而要用简短的叙事形式来描述你的角色和职责。为了使你的故事更具吸引力，将你的职责与成就联系起来。如果你能量化你为公司赚了多少钱或节省了多少钱，并且这个数字不是秘密，就把它写在简历里。如果不能，考虑一个足以描述你成就的\
  \ KPI（关键绩效指标）。\n\n如果你的工作经历太长且转换过专业方向，可以只写出**相关的工作经历**，并附上你的`LinkedIn`个人资料链接以获取更多详细信息。\n\
  \n除非你是应届毕业生，否则教育经历在简历中不应占据过多篇幅。如果你没有足够的工作经历，你的个人品牌和作品集将极具价值。你可以通过讲述创作背后的动机来展示你的个人项目。同时，提及你大学期间任何值得注意的、且可能与雇主相关的科学竞赛或活动。\n\
  \n通过突出雇主需要的技能来格式化你的故事和成就。与其创建一个列出长长一串编程语言的技能部分，不如突出你在实践中使用过这些技能就足够了。这不仅节省空间，而且你也不太可能被贴上“通才”的标签。如果你坚持要在简历中包含技能部分，请将其命名为**相关技能**，并且只列举雇主可能需要的技能。例如，如果雇主需要具有`React`经验的\
  \ JavaScript 开发人员，你可以提及你精通`Redux`，并具备使用`Mocha`、`Chai`和`SinonJs`进行自动化测试的知识。你的`Java`知识是不相关的。熟悉`Zend`框架也是不必要的。\n\
  \n撰写一份好的简历是一个创造性的过程，超出了本书的范围。你瞄准的职位责任越高，在如何恰当定位你的服务这件事上，涉及的利害关系就越大。如果你在此过程中需要帮助，欢迎联系我进行免费的初步咨询，网址为：[`http://devcareermastery.com/resume-service/`](http://devcareermastery.com/resume-service/)。\n\
  \n\n\n\n### 求职信应该写什么？\n\n专业简历撰写者能为你提供的帮助仅限于搭建框架和一些范例。在撰写求职信时，你需要独立完成，并且必须根据你所了解的应聘公司信息进行个性化定制。\n\
  \n让求职信具有个人色彩。仔细阅读职位申请要求，创作一封真诚的求职信，其中包含适合该职位的正式元素即可。对于某些初创公司，可以适当非正式；而在企业环境中，则更应保持正式。\n\
  \n避免使用“我将成为宝贵资产”或“我是一个勤奋、专业、积极主动的人”这类陈词滥调。这些陈述属于**显性影响**。如果你直接告诉对方他们应该看到什么，他们反而不太可能相信，不如他们自己内心的判断。因此，你的最佳选择是采用**叙事（隐性）影响**。通过讲述一个故事，让你的未来雇主自然而然地得出关于你的正面结论，而无需你自己在简历中写明。\n\
  \n一种常见的结构是“你的要求–我的成果”对比，将岗位要求与你的成就一一对应。这是一种直截了当且有效的格式。改进此格式的一个建议是，通过引用你简历内容的方式设置“钩子”点。\n\
  \n始终要谈及你申请背后的原因。为什么是他们？为什么是现在？\n\n根据你的愿景，你正从 A 点（你现在的位置）走向 B 点（你想去的地方）。对你而言，合乎逻辑的下一步是在一个专业环境中运用你的技能，在那里你可以通过将行业\
  \ X 的经验付诸实践，并运用技术 Y 来做出最大贡献。这就是为什么你非常欣赏阅读该公司的博客，并了解到他们在行业 X 的专业知识。请引用具体的文章。你也欣赏\
  \ CTO 在 [medium.com](http://medium.com/) 上关于技术 Y 的专业文章，这表明你将能够定期交流最佳实践信息。告诉他们，与具有专业态度和高度内在驱动力的个人共事对你很重要。\n\
  \n通过这种方式，你仅用一个紧凑的段落就表明了你**根据自己的标准来考量雇主**。同时，你也透露了一部分你的职业准则和愿景，让自己显得有趣且引发共鸣。你还借助叙事影响，在未来雇主眼中展现了你的技能。\n\
  \n急于得到这份工作可能会让你处于不利地位。不要写你非常渴望这份工作。你需要表达对公司的兴趣，但过度赞美公司会显得刻意且有些急切。这也是为什么通过“考量”公司来赞美它是一个合理的方法。\n\
  \n确保在求职信中不要过多谈论自己。即使是在讲述你的愿景和目标时，也要与公司的利益相契合。一个关于求职信的实用经验法则是检查你的求职信中“我”这个词的出现频率，如果某个段落里出现太多次，就考虑重写。\n\
  \n如果你想真正写好求职信，请给雇主一两个关于你将如何为公司创造利润的暗示。将你简历中排名前三的成就之一与求职信联系起来，并设立一个“钩子”点。写明你曾为一个交付成果\
  \ Z 的项目做出贡献，并且根据公司的情况，你有兴趣参与类似或更高级别的项目。然后提及该项目的一个有趣事实，并以“更多信息请参见我的简历”作为段落结尾。\n\n\
  ### 大多数求职者从未走过的“额外里程”\n\n如果你已处于高级职位，并且目标是高薪——可能是六位数范围——那么录制一段关于你自己的精美视频是值得的。\n\n\
  只有在感到舒适的情况下才这样做。当视频看起来和听起来都像你与同事之间真实的专业交流时，你就知道状态对了。一旦你在镜头前不再感到不自在，你就能达到该视频所需的质量标准。你只需要做一个简短的视频自我介绍。\n\
  \n如果你害怕在镜头前说话，我甚至鼓励你更频繁地尝试，但只有当结果符合你的标准时，才将其作为申请材料的一部分发送。在镜头前说话锻炼的技能和消除的恐惧，对你的职业生涯至关重要。这些技能包括领导力、公开演讲，以及克服对被拒绝的恐惧。\n\
  \n你可以从每天录制自己开始。首先，说 1 分钟，然后 2 分钟，再然后 5 分钟。主题可以任意选择。然后回看自己的视频。这个过程被称为**意识流**。起初，观看自己会是一种不舒服的感觉，但引用瑞安·霍利迪的话：“障碍即是道路。”\n\
  \n最重要的是，意识流练习能帮助你进入状态。米哈伊·契克森米哈赖将这种状态称为**心流**。心流是人类的一种最佳体验，我们面对挑战，但同时拥有应对该挑战所需的所有资源。在心流状态下，我们会失去时间感，因为我们完全沉浸在活动中。多项调查表明，心流体验是我们最愉悦的生活体验之一。\n\
  \n录制一段好视频就是一种心流体验。如果你有兴趣达到能够录制视频的最佳状态，可以查阅我的书《魅力程序员》。^(³⁵)\n\n如果你更倾向于不录制视频自我介绍，另一个替代方案是为你的雇主准备一份相关的案例研究。你可以写一个可能与雇主相关的挑战，例如，在一个由\
  \ X 名开发者组成的团队中建立知识传递机制，提升并衡量你 Web 应用程序的用户体验，以创造更满意的客户。使其真实可信；让你的招聘经理和技术面试官都有兴趣阅读你的附件。你可以通过在求职信中设置一个“钩子”点来实现这一点，例如：“当团队在知识共享方面达成共识时，他们的工作效率最高。许多团队在这方面都存在困难。以下是我们采取的一系列步骤，以使知识传递尽可能有效。我非常希望在面试中与你们比较一下我们的知识传递方法。欢迎随时阅读附件中的案例研究。”\n\
  \n提交案例研究在某种程度上听起来像是天方夜谭。它并非对所有雇主都有效，尤其是当雇主的工作条件较差时。\n\n当你给予雇主一份免费礼物时，你运用了**互惠原则**。作为交换，雇主不仅更有动力邀请你面试，而且他们也会觉得应该讨论你提出的议题，更不用说你还通过这种方式“考量”了他们，暗示你想与那些鼓励团队合作和知识共享的公司共事，而不是写下“我是一个优秀的团队成员”这类陈词滥调。\n\
  \n撰写简历很难。这就是为什么我们首先从你的个人品牌开始。你将能够在简历中展示你个人品牌的元素。\n\n通过了解雇主的期望，并以有趣且易读的格式提供满足其需求的方案，你将能够创建一份引人入胜的简历。为了使你的申请材料更具吸引力，你可以运用故事讲述的技巧。将焦点从数据和列表转移到故事上来。\n\
  \n\n\n## 为求职信注入叙事技巧\n\n为你的求职信也采用讲故事的方法。提及雇主的期望，并将求职信与简历关联起来。让读者对你的求职信和简历都产生兴趣。\n\
  \n始终根据每家公司的需求定制你的申请材料包。虽然针对每家公司会花费更多时间准备，但通过这种精准投递的方法，你在整个求职过程中反而能节省时间。你还有机会比那些用同一份简历海投数百家公司的人获得更高薪酬。\n\
  \n考虑做一些别人没做过的事。你可以在申请材料包中附上一段视频，或者创建一个附件，展示一个项目案例研究，或者你在职业生涯中解决过的一个有趣且相关的问题。\n\n\
  #### 练习\n\n在完成这些练习前，请先阅读下一节“社交媒体”！你或许应该考虑在创建简历之前先创建或完善你的领英档案。\n\n1.  审视三份与你背景匹配的招聘信息。记录雇主在寻找什么样的人才。\n\
  2.  从你当前专业领域角度，讲述三个与你最重要的成就相关的故事。\n3.  根据本节内容更新你的简历。\n4.  从你之前选择的三个职位中选出最佳的一个。对该职位所属公司进行详尽调研。然后根据调研结果定制你的简历，并撰写一封求职信完成你的申请材料包。\n\
  5.  用你的相机或手机录制一段 2-3 分钟的自我介绍视频。如果你没有相关经验，请反复练习，直到你可以在镜头前不间断地讲述 2-3 分钟。这可能是一项艰巨的任务，需要花费数小时甚至数天，但从自尊和职业发展的角度来看，这是值得的。\n\
  \n## 社交媒体\n\n**本节目标：**\n\n-   聚焦你的领英档案以获得最佳效果。\n-   清理你的脸书档案。\n-   额外加分项：发布关于技术的推文或帖子。\n\
  \n人们尊重那些分享想法的人。这就是为什么你可以通过付出额外努力、建立社交媒体形象来丰富你的个人品牌。你将能够建立有意义的联系，并为你的个人品牌增加社会证明。\n\
  \n问自己一个问题：你的核心信息是什么？审视你的愿景和使命宣言，并将精力集中在这个领域。记住，品牌是一种承诺，你的受众有期待。你通过传递一致的信息来兑现承诺。\n\
  \n你用来分享想法的平台越多越好。这就是为什么本节专门讨论社交媒体。\n\n本书将重点介绍以下平台：\n\n-   领英 (LinkedIn)\n-   脸书\
  \ (Facebook)\n-   推特 (Twitter)\n\n从职业发展角度来看，最重要的社交媒体账号是领英。在 21 世纪，你几乎不可能没有领英档案。其他资料可能也很重要，但我鼓励你优先考虑领英，将其置于其他所有平台之上。\n\
  \n### 领英：你的在线简历\n\n大多数雇主都会找到你的领英档案。确保你的资料达到全明星等级。\n\n鉴于个人品牌建设和撰写简历的所有原则都适用于创建领英档案，本节内容建立在撰写简历的原则之上。但是，建议在创建简历之前先创建领英档案。这是因为你的领英档案包含的信息范围比简历更广。无论特定职位要求是什么，你都应从专业领域角度展示自己。\n\
  \n你的领英档案仍然是目标导向的，你也有目标受众；然而，这个受众群体涵盖范围很广，以至于仅凭领英档案在申请材料包中是不够的。\n\n事实上，我不鼓励你将领英档案导出为简历，因为与发送一份附有领英链接的普通简历相比，这样做效果要差得多。\n\
  \n确保你的简历以领英档案为基础，并保持两者一致。如果存在重大差异，这对你将非常不利。无论这种不一致是错误还是谎言，无论雇主是否就此提问，在他们发现不一致的那一刻，损害就已经造成了。\n\
  \n你领英档案中最重要的元素之一是社会证明。如果你与其他可信赖的人建立了有意义的联系，并且他们为你写了推荐信，你的机会就会增加。\n\n一些招聘经理告诉我，他们会定期在领英上进行一致性检查，并询问那些为候选人写推荐信的人以确认其技能。\n\
  \n我仍然记得有一次，一家公司的 CEO 在我面试时对我进行了交叉核实。他没有向我提及此事，而是联系了我在另一家公司的经理。幸运的是，我与那位经理有着极好的工作关系，所以他甚至主动联系我，问我是否有任何值得特别提及的事情可以增加我的机会。\n\
  \n正如你所见，领英推荐信必须足够可信，才能经受住潜在雇主偶尔的查证。\n\n以下是一些领英技巧：\n\n-   领英上可写的空间比传统简历更多。领英的格式使你的内容易于浏览。\n\
  -   每当你改变专业方向时，重写你的整个档案。让你不相关的成就变得不那么突出，而与当前专业相关的成就则要凸显出来。\n-   每当你与过去的同事关系良好时，请求他们为你的过往职位撰写推荐信。你经理或\
  \ CEO 的推荐比同行的推荐更有价值。\n-   从你当前专业的角度对你的技能进行排序。你可以覆盖领英的默认排序顺序，以鼓励他人为你认可的技能投票。例如，商务人士倾向于为“PHP”投票，仅仅因为他们听说过它。如果你将\
  \ PHP 隐藏在技能列表中，或者使其不可见，你将获得正确的赞成票。\n-   当你的职位发生变化时，在就业记录中创建一个新条目是合理的；否则，你成就的描述会变得模糊不清。\n\
  \n### 尴尬还是脸书？\n\n理论上，公司不允许基于个人生活属性进行歧视。实际上，招聘经理经常查看你的脸书档案。尽管许多公司尊重职业与个人生活之间的界限，但也有其限度。\n\
  \n因此，确保你不要暴露那些有损你个人品牌形象的照片、视频和帖子。如果你有争议性内容，确保只有你的朋友可以看到。这并不会让你成为更好或更差的专业人士，但我们希望消除招聘经理脑海中的噪音。我们希望他们专注于我们的职业生活。\n\
  \n如果你的生活很有趣，你的生活方式吸引人，那么你的脸书档案就会成为一个优势。它向他人展示你是一个有趣且接地气的人。影响力的一个属性就是人们是否**喜欢**你。你的爱好使你更**有共鸣**。\n\
  \n脸书很少用于职业目的，除非你为某个副业项目或副业创建了一个脸书页面。本节内容并非关于如何使用脸书来展示你的技术技能，而是关于如何让你的个人资料更讨喜一些。\n\
  \n\n\n### Twitter\n\n定期发布技术相关的推文，并转发行业大咖的推文，表明你正在紧跟技术潮流。这样做的一个附带好处是，你可能会积累一定数量的粉丝，这将成为你个人能力的社交证明。\n\
  \n如果你启动了一个副业项目，一定要在 Twitter 上发布相关推文。如果你在 Hacker News 上发布了任何内容，也请发推文。如果你在 Hacker\
  \ News 或新闻网站上读到有趣的内容，同样发推文。如果你参加了一场会议，发推文。如果你在会议上发表演讲，提前准备好几条推文。\n\n当然，你也可以出于个人目的使用\
  \ Twitter。只要确保你不会发布有争议的内容而损害自己的声誉即可。记住，有趣的话题能提升你的声誉。而有争议的话题，比如色情内容、政治议题、带有破坏性的批评以及仇恨言论，对你毫无益处。\n\
  \n关注你所在领域的正确大咖，这样你就能更快地获取行业新闻。你甚至可以利用 Twitter 来进行人脉拓展。\n\n### 其他社交媒体呢？\n\n只要它们不会毁掉你的声誉，你完全可以出于个人目的自由使用。\n\
  \n我给你的最后建议是，从职业发展的角度来看，不要在上面浪费大量时间。花几个小时发帖通常得不偿失。创建一个完美的领英（LinkedIn）个人资料，并获得一些社交证明，这就已经足够了。\n\
  \n#### 练习\n\n1.  创建或完善你的全星级领英（LinkedIn）个人资料。\n\n2.  检查你的脸书（Facebook）个人资料，并制定一个策略，决定哪些内容应该设为公开，哪些内容仅限好友可见。\n\
  \n3.  找到你专业领域的主要大咖，并在 Twitter 上关注他们。在接下来的一个月里，养成每周至少发布两条原创推文，并每周至少转发两条有趣新闻的习惯。\n\
  \n## 选择合适的副业项目来打造你的个人品牌\n\n> **本节目标：**\n\n*   找出 90% 的开发者在学习上做错了什么。\n*   制定一个激励人心、前沿的学习计划。\n\
  *   学习如何打造一个出色的作品集。\n*   搭建一个博客，并写下你学到的东西。\n*   理解为什么许多其他开发者的策略对你的目标来说是错误的。\n\n\
  许多软件开发者容易养成不良的学习习惯。这些习惯不仅让他们以最高效的方式浪费时间，还会让他们在学习过程中变得非常不自信和沮丧。如果你遵循以下两条规则，你就能比大多数同事更高效：\n\
  \n1.  不要什么都学！只学你需要的。\n2.  创建有意义的副业项目，来充实你的作品集。\n\n许多开发者试图学习一切，从而给自己带来了巨大压力。回想一下，在第二章中，你学到了拿自己和别人比较是一种不健康的策略，会导致挫败感。试图学习一切，往往源于害怕别人已经掌握了你还不知道的技能。\n\
  \n你可以通过制定一个支持你短期和长期目标的学习计划来对抗这些恐惧。你将应用帕累托原则（二八定律），专注于那些能带来 80% 成果的那 20% 的任务。\n\n\
  在选择合适的副业项目以加速职业成长方面，这也至关重要。除非你有开创性的想法，否则再构建一个框架意义不大。通常情况下，人们创建框架是出于学习新东西的动力。这种努力的回报是学习经验，而这些经验原本可以通过从事一些有意义的事情更快地获得。\n\
  \n为你找到合适副业项目的第一步是创建一个培训计划。\n\n### 你的 SMART 学习计划\n\n本节的目标不仅仅是规划什么对你有用。我们还要通过将你的学习目标与你的职业规划联系起来，来创造杠杆效应。\n\
  \n你何时才能知道自己已准备好迈入职业生涯的下一阶段？当你创造出一些有形的成果时。什么是有形的成果？是你觉得可以放心向外界展示的东西。一篇高质量的博文、一个在线服务、一个\
  \ GitHub 仓库，这些都是很好的例子。\n\n回想大学时期，我是一个非常善于学习的人，别人都认为我是个聪明的学生。根据我对过去表现的自我评价，我坚信自己是一个能力平平但毅力远超平均水平的学生。我的动力来自于我童年时期养成的那种“成就者”应对策略。\n\
  \n\n\n### 注意  \n\n婴儿是脆弱的，他们的生命依赖于被爱。这种爱最初是无条件的，因为婴儿无法为父母做太多事。然而，父母迟早会形成期望，这让孩子感觉不再被无条件地爱着。一个两岁的孩子无法区分“我的行为很糟糕”和“我很糟糕”这两句话。因此，当未能满足父母的期望时，孩子的内心会保护自己，避免产生“我不够好”或“我不值得被爱”的想法。这种保护以孩子选择的应对策略的形式出现。这就是为什么我们中有些人成为叛逆者，有些人退缩为隐士，有些人则成为讨好者。一种流行的讨好方式就是取得成就。\
  \  \n\n隐士和叛逆者都很难与他人学习和合作。前者倾向于放弃合作，拒绝寻求帮助，并退缩到自己的舒适区。后者则积极争辩并反对他们的导师。这两种应对策略都阻碍了人们与他人合作。\
  \  \n\n然而，讨好者的任务更为艰巨，因为讨好者的真正问题是**有效率的拖延**。有效率的拖延是指表现得看似高效，却回避了通向成功所必需的那些令人不适的步骤。一个成就者的目标可能是通过考试、从头到尾阅读或观看学习材料，或是获得认证。讨好者取悦的是导师、同事，却很少取悦自己。成就者和讨好者的活动往往倾向于回避处理最重要但令人不适的步骤，并用取得成就或取悦他人来为推迟这些行动辩护。\
  \  \n\n根据瑞安·霍利迪的杰作《障碍即是道路》^(³⁶)，无论你的应对策略是什么，请记住：让你感到最不舒服的那类挑战，恰恰为你指明了通向自身成功的道路。应对策略会欺骗我们，让我们相信可以通过取得成就、讨好他人、反抗或退缩来获得成功。而实际上，我们只需要负责创造他人欣赏的实际成果，学习新技能只是做有用之事的副产品。\
  \  \n\n作为一名成就者，我学会了通过考试需要什么。我在大学里建立起非凡的声誉，这甚至时常让我自己感到惊讶。例如，我记得有一次考试，我必须从 20 个题目中随机抽取一个进行论述。那已是我大学岁月的尾声。\
  \  \n\n考试前，我已连续一年门门功课都取得了优异成绩。我没有只修满规定的 60 学分，而是完成了超过 80 学分的课程。我还赢得了一项科学竞赛，受雇于一个由欧盟资助的大学研究项目，并开始发表关于语义网的论文。由于过去的成就，我不仅建立了声誉，也开始需要放松并开始享受生活。那时，我加倍努力想成为一名更好的卡丁车赛车手，我的约会生活也变得丰富多彩。换句话说，我开始过上一种全面充实的生活。\
  \  \n\n不幸的是，我的成就者倾向在工作以及生活的其他领域继续困扰着我。考试前，我断定自己没有时间充分学好这门课。我没去听课，只复习了两天。不过，对于这门课的大多数话题，我尚能在讨论的背景下熟练掌握。只有两个话题让我感到不适。\
  \  \n\n在我进入考场前，我看到一些同学已经查到了成绩。我将使用评分等级：`A` 代表优异；`B`、`C`、`D` 分别代表第二、第三和第四好的成绩；`F`\
  \ 代表不及格。我的同学们大多得了 `C` 和 `F`。我的一位成就者朋友在这门课上花了一周时间，并且参加了大部分课程。他当然得了 `A`。  \n\n我走进了考场。我的教授向我打招呼，因为他从另一个辅助项目中对我很熟悉。他让我随机抽取一个题目。\
  \  \n\n大多数学生都有过这样的经历：学了 20 个题目中的 19 个，却偏偏抽到了第 20 个。这就是我的不幸故事。幸运的是，我考前刚读过我的提纲，所以我开始飞快地记下要点，以免忘记。\
  \  \n\n在我记完笔记后，教授让我开始论述。仅仅几分钟后，他一定发现我对这个题目知之甚少。出于好意想帮我，他随机问了我一些其他题目相关的问题。他能察觉到我在这里那里学到了一些基础知识，但凭借他的经验，他也知道我对他的这门学科理解不深。\
  \  \n\n随着考试的进行，我越来越清楚地意识到自己可能会不及格。这是一种不适感，因为过去我从未在大学考试中失利过。我注意到教授在考试过程中变得越来越不安，仿佛有什么事情深深困扰着他。他似乎害怕什么。他问了最后一个看似简单的问题，我好歹能在某种程度上沾点边并做出一点贡献，但在我这边，却缺少将材料进行建设性运用的经验。\
  \  \n\n在我明显的失败之后，教授表示，这一刻对他来说非常不适。我已经做好了听到坏消息的准备。也许是 `D`，也许是 `F`，谁知道呢，无论如何我知道我必须重考了。但接着，令我惊讶的是，他继续说道：“我本可以问你更多问题来争取\
  \ `A`，但我感觉现在能给你的最好成绩是 `B`。”  \n\n那一刻对我来说很不舒服，因为我未能拿到 `A`。我知道什么或不知道什么，在当时对我来说真的不重要。然而后来，我理性地认识到，学位证书上的这个\
  \ `B` 其实无关紧要。我不用再重考了。我足够好了。  \n\n当我现在写下这些文字时，我能清晰地看到，在这个故事里我才是反派，而非英雄。我同样是最大的输家，因为我只是欺骗了自己。在我教授的学生群体中，有些同学毕业后起薪是我的三倍。他们理应如此，因为他们没有专注于取得好成绩。他们专注于成为优秀的专业人士，为此不惜在对自己无关紧要的科目上拿到低分。而直到今年，我都以牺牲在重要领域变得卓越为代价，在每件事上都取得了好成绩。\
  \  \n\n我掌握了以成绩、研究论文和科学竞赛胜利的形式交付成果。我也掌握了遗忘许多学过的知识，因为考试后，我没有继续进行间隔重复来巩固知识。  \n\n这门特定的课程对我来说并不重要。然而，多年后，我意识到自己的知识存在重大缺口，因为我过于专注获取好成绩，有时甚至没有创造任何有用的东西。我又花了几年时间，通过参与有趣的项目才填补了这些缺口。如今，我再也不会把一份培训材料从头到尾通读来吸收知识了。我把培训材料视为帮助我实现目标的参考书。你现在将会学习如何做到这一点。\
  \  \n\n你的学习计划将由五个步骤组成。如果你阅读这些步骤的首字母，会得到单词`smart`。从现在起，我们将这些步骤称为`SMART`学习计划。  \n\n\
  1. **同步**：同步你的学习计划与职业规划。  \n2. **里程碑**：创建达成目标的高层级步骤。  \n3. **分析**：将这些里程碑分解为更小的可执行步骤。\
  \  \n4. **完善**：获取反馈，并根据所学内容迭代改进你的项目。  \n5. **测试**：通过向你的受众展示你的交付成果来验证你的知识。  \n\n\n\
  \n### 说明\n\nSMART 学习计划遵循项目式学习的原则。我们只学习足够创造实际成果的内容。这种学习体验不一定能为你提供完整的词汇知识。然而，你将学会如何在实践中解决有意义的问题，并通过完成项目获得自信。在这段体验结束时，你还能获得实实在在的成果，并将其展示在你的作品集中。\n\
  \n让我们逐一看看这五点。\n\n#### 同步\n\n为了掌握一项技能，你需要知道自己为何想要它。首先明确你的目标。问问自己以下几个问题：\n\n1.  你的职业目标是什么？\n\
  2.  为了实现这些目标，你需要哪些技能？\n3.  学习这些技能需要哪些资源？\n\n同时关注你职业中的技术与非技术方面。也要关注多种时间跨度，例如：\n\n\
  -   你五年内的职业目标是什么？\n-   为了实现五年目标，三年内需要达成什么？\n-   为了实现三年目标，一年内需要达成什么？\n-   为了实现一年目标，六个月内需要达成什么？\n\
  -   为了实现六个月目标，三个月内需要达成什么？\n-   为了实现三个月目标，一个月内需要达成什么？\n\n你可能需要学习一门新的编程语言、领导力技能、演讲技巧、软件架构、函数式编程、使用`Selenium`进行验收测试，或者任何你清楚在不久的将来会用到的知识。\n\
  \n一旦你的清单准备就绪，就回答你学习计划中最重要的问题：你应该采取的第一步、最关键的一步是什么？让你下一步的规划清晰明确，并开始专注于它。\n\n#### 里程碑\n\
  \n针对你想要提升的每一项技能，确定能衡量你知识的项目和活动。启动那些能将你的新技能付诸实践的项目。从“为什么”开始，“做什么”就会水到渠成。\n\n让这些项目对你有用。为真实用户构建应用比仅仅为自己构建要好得多。教授他人、写博客、录制\
  \ YouTube 视频都是衡量你进步的好方法。\n\n确保你的目标和里程碑是实实在在的。不要制定像“我想通过理解购买的书中示例来学习 React”这样的目标。你很可能会把大部分时间花在学习那些一周内就会忘记的琐碎细节上。\n\
  \n许多书籍和课程都非常出色。我自己也从中学到了很多。然而，如果你读完一本书，却没有创造出超越其内容的新东西，你对这个主题的知识会随着时间的推移而消退。如果你能超越理论，挑战自我，你将学到一些可能伴随你整个职业生涯的技能。\n\
  \n一个合理的目标可能是这样的：\n\n-   创建一个使用 React 和 ES6 的单页应用，让软件开发人员能够使用番茄工作法以及其他有用的效率技巧（例如...）来追踪自己的生产力。\n\
  \n之后可以随时细化具体规格。\n\n你的项目也能让你的工作保持专注。你不会把时间浪费在不重要的细节上。你会学到真正重要的东西。在我撰写《ES6 实战》¹⁾时，我牢记三条指导原则：\n\
  \n-   每个章节只提供足够你开始解决练习的知识。\n-   练习会向你讲述故事，并以持续增加的难度挑战你。你不仅在完成一些练习后会感觉良好，而且你会知道你可以独立解决问题。有些练习包含的概念，其他书可能会放在理论章节中介绍。通过解决这样的练习，你向自己证明，一旦需要用到新概念，你就有能力去学习它们。这应当能让你对自己的能力有信心，同时加深你的理解。最坏的情况下，你阅读答案也能像阅读其他教程一样学到很多东西。\n\
  -   你可以通过包含技术面试练习和家庭作业来提升你的面试技巧。\n\n具体说明你愿意在个人项目中投入的时间。人们往往低估技术项目所需的时间，通常是实际需要的\
  \ 2 到 3 倍。如果你发现你的生活方式不允许你创建一个复杂的个人项目，你就需要做出一些人生抉择。你要么改变生活方式或职业规划，要么为自己制定一个不同的学习计划。\n\
  \n> 你的目标可能非常简单。例如，如果你正在学习 React 并且已经有一个博客，你可以为自己设定以下目标：\n\n1.  写一篇关于你所学内容的博客文章\n\
  \    -   技能：更结构化的 React 知识\n    -   可交付成果：博客文章\n\n2.  使用你的 React 模板在`todomvc.com`上实现一个待办事项应用\n\
  \    -   技能：更深入的 React 知识\n    -   可交付成果：基于创建应用的学习成果优化后的 React 模板\n\n3.  为 React\
  \ 应用创建一个模板，并将其上传到 GitHub\n    -   技能：ES6、React 基础、Webpack、NPM、Babel\n    -   可交付成果：GitHub\
  \ 上的 React 模板\n\n有时，你可能会为自己设定一个宏伟的目标，并分多个里程碑逐步交付解决方案。例如，为了实现一个生产力应用，你可能需要创建：\n\n\
  1.  可能需要的服务端代码和数据库：\n    -   技能：Node.js、MongoDB\n    -   可交付成果：一个完整可用的解决方案\n\n2.\
  \  你可能希望使用像 Redux 这样的库来管理应用状态：\n    -   技能：Redux 或 React 的 Context API\n    -  \
  \ 可交付成果：一个带有模拟后端的完整应用\n\n3.  React 层：\n    -   技能：React、NPM、Webpack、Babel\n    -\
  \   可交付成果：无，因为将 D 和 E 放在一起做完全合理\n\n4.  开发和测试可能需要自动化测试和模拟技术：\n    -   技能：Mocha、Chai、Sinon.js、API\
  \ 端点设计\n    -   可交付成果：连接到应用的自动化测试框架，以及一种拦截和模拟 API 调用的方法。设计你的 API 端点。\n\n5.  一个使用组件的响应式网站：\n\
  \    -   技能：Bootstrap 或预制 Web 组件\n    -   可交付成果：包含静态数据的网站骨架\n\n6.  一个待实现的抽象生产力模型：\n\
  \    -   技能：番茄工作法、看板、生产力研究\n    -   可交付成果：生产力模型、文档、软件规格说明\n\n如你所见，在这六个里程碑中，你可能会接触到大量的技术栈。通过估算完成应用所需的工作量，为自己设定一些截止日期。\n\
  \n确保不要因为未达成截止日期而过于苛责自己。衡量时间的重要性在于，它能让你了解自己在评估个人开发速度方面的能力。\n\n像这样的个人项目会让你忙碌很长一段时间。然而，一旦你能演示你的应用，你将收获回报。如果你的应用足够有用，你甚至可能将其商业化。\n\
  \n教你如何将应用商业化超出了本书的范畴。为了开发一个盈利的应用，你需要不断测试用户的需求并积极调整你的产品。这个过程不一定能为你创造最佳的学习体验，所以我们暂时继续专注于你的职业发展。\n\
  \n\n\n### 分析\n\n现在，是时候分解每个里程碑了。为你自己创建一个关于该主题的目录，就像在写一本书一样。确定如何将新技能分解为小块。\n\n发现先决条件和冗余主题，并确定你将重点关注的内容。不必担心做到完美无缺。你将会有多次机会来完善你的计划。\n\
  \n从多个来源进行研究。就技术而言，你可以访问官方文档，或者查看书籍、课程、YouTube 频道、在线教程和博客的目录。你甚至可能找到有用的 GitHub 仓库。\n\
  \n收集完信息后，确保你要组织好这些信息。例如，一张包含以下列出的表格就很合适：\n\n- 模块编号\n- 描述\n- 目标/任务\n- 资源\n- 状态\n\n\
  尽力为你自己创建的各个模块之间检测依赖关系，并据此对模块进行排序。如果你遗漏了一两个依赖项，也不必担心，因为你的学习计划足够精简，可以接受后续的迭代。第 4 步将完全围绕迭代你的计划展开。\n\
  \n将完成的成果与你大部分模块关联起来；否则，你将很难跟踪自己的进度。你在实践中运用所学知识越多，你的理解就会越深刻。如果你只是读了一本书，预计会忘记 90%\
  \ 的内容。如果你做了笔记，可能会忘记 80%。如果你写了一篇带有示例代码的文章，你可能只会忘记所学内容的一半。一旦你完成了一个实践项目，你很可能在多年后仍然记得基础要点。\n\
  \n### 细化\n\n当你实现一个模块时，你会遇到困难。记录下这些困难，并自底向上修改你的学习计划，从第 3 步开始，到第 1 步结束。\n\n例如，你可能会发现一个阻碍你的依赖项。你可以重新编排模块顺序，或者添加新的模块来扫清障碍。你甚至可能会发现，从最终成果的角度来看，你的一些模块是没有用的。\n\
  \n始终以目标为导向。划掉那些对你的目标没有贡献的模块。我再怎么强调帕累托法则的重要性也不为过：20% 的努力创造了 80% 的成果。在学习方面，正确的 20%\
  \ 会为你打下坚实的基础，你可以在未来的职业生涯中以此为基础进行构建。如果你需要深挖，你会深入理解你所需要的主题。许多专业人士陷入那 80% 次要学习内容的泥潭，却没能做好那\
  \ 20% 的关键部分。只有在你知道了该往哪里挖的时候，深挖才有意义。\n\n最频繁的修改只影响你里程碑的宏观蓝图。这通常只需要你重新迭代第 3 步。\n\n\
  有时，你会发现跨里程碑的依赖关系，或者随着你对该主题的了解加深，你可能会替换使用的技术。例如，你最初可能决定在你的项目中使用 REST API，但后来偶然发现了\
  \ GraphQL。既然你已经了解 REST API，而且 GraphQL 非常适合你的项目，那么你重新设计整个里程碑可能是合理的。这样一来，你可以更好地利用时间，并学习一些新东西。\n\
  \n你的一些决定和发现可能导致你的职业规划发生小变化。其他变化可能会塑造你项目的描述。确保你回到第 1 步和第 2 步，并更新它们。\n\n不必担心频繁更改你的计划。灵活性是为自己获得最佳学习体验的关键。\n\
  \n你的迭代也可能依赖于外部反馈。对你的副业项目持开放态度。把它们展示给你的同事和朋友。在网上发布它们，并在技术论坛和社区中讨论你的发现。你会惊讶于自己的技能提升得有多快。\n\
  \n最后但同样重要的是，时不时地退后一步，审视你的职业道路。学习新事物可能会为你开启新的可能性。这些是你之前未曾意识到的路径。有些路径可能会彻底改变你未来的项目，甚至是你当前的项目。如果你开启了一条新路径，不要害怕以自上而下的方式修改你的学习计划。\n\
  \n### 测试\n\n通过创造切实的成果并与观众分享来测试你的知识。无论是 GitHub 仓库、作品集网站，还是博客文章，找到一种方式向观众展示你的成果。\n\
  \n总会有人喜欢你做的事情。也总会有人讨厌。正如著名的城市词典中所言，“黑子注定要黑”。每当你收到批评时，问问自己批评背后的意图是什么。始终客观地看待事物，并尽最大努力改进你的产品。对建设性的批评心怀感激。\n\
  \n你也可能会收到破坏性的批评。不要受其影响。如果被影响了，请回到第 2 章并克服你的恐惧和限制性信念。批评让你更强大。最重要的是，恰当面对批评能塑造你的品格，磨练你的职业准则，并让你在工作场所获得一点优势。\n\
  \n在完成一个副业项目后，务必总结结论。问问自己学到了哪些技能，以及将来会如何使用这些技能。\n\n## 你的作品集\n\n随着你完成一些副业项目，你的作品集将以一种自然的方式建立起来。你的作品集有两个重要的支柱：\n\
  \n- 你的 GitHub 个人资料\n- 你的个人网站\n\n一些软件开发人员说他们不想费心去构建作品集。这完全没问题。某些职业道路可能会对你关闭，但你仍然有机会成为一名受人尊敬且收入颇丰的专业人士，同时拥有极佳的工作与生活平衡。\n\
  \n其他一些软件开发人员说他们强迫自己每天在 GitHub 上提交代码。我很好奇他们在假期时怎么办。软件开发一直是我生活中不可或缺的一部分。然而，在我开车 12\
  \ 小时从匈牙利到德国、整理行李并归还租来的车的那一天，我可能处于一种不适合编写一行代码的精神状态。我可以进入代码仓库，通过提交一行无用的代码来假装我在工作。然而，最了解这个把戏的人——我自己——最终会确保在做出这种行为后感到尴尬。这不是建立自尊的正确方式。炫耀自己能每天提交代码并不值得付出这种努力。专注于增加职业资本，而不是保持连胜记录。根据你自己的生活决策，找到适合你自己的时间安排。\n\
  \n如果你不想自己托管作品集，为你的副业项目设置一个 `github.io` 页面是很容易的。对于大多数软件开发人员来说，了解 Git 和 GitHub 是必不可少的。如果你不知道如何使用\
  \ Git，这可能是你学习的第一个主题。关于这个主题，有非常棒的免费书籍和教程。\n\n网页设计是另一个阻碍人们创建作品集网站的领域。我不会担心网页设计。我的第一个作品集网站看起来很糟糕。它只是一些指向我作品集元素的链接，并附有描述。但我仍然凭借它获得了一份报酬丰厚的职位。\n\
  \n那时，我没有使用模板，并且想自己编写所有代码。请注意，你可以下载许多免费的作品集网站模板。只需在网上搜索 Bootstrap 或 WordPress 作品集模板即可。另外，你也可以在\
  \ `github.io` 上托管你的作品集，并找到基于 Jekyll 的作品集网站，你可以对其进行调整。\n\n作品集对于被雇佣是必需的吗？就就业而言，答案是否定的，但它肯定有帮助。它有助于向你的雇主证明你使用过他们需要的技术。雇主最担心的是他们招聘到一个不会编码的人。一份好的作品集能够立即消除这种恐惧。\n\
  \n\n\n### 注意\n\n作为自由职业者，你的作品集比作为雇员时更重要，因为客户关心的是你创造的结果，而他们很少有一套体系来培训你以增加价值。作为雇员，你的经验和教育程度越低，作品集项目就越重要。为什么？因为你的作品集项目能证明你和拥有学位的开发者一样优秀，某些雇主可能会因此给你机会。\n\
  \n如果你的简历足够好，你可能会认为创建作品集没什么意义，因为你已经获得了足够多的面试机会。我仍然鼓励你创建一个。为什么？仅仅是因为这能让你成为更专业的从业者。你的作品集是你职业经验的副产品。在完成\
  \ 98%的学习计划后，不额外投入 2%来向世界展示你的能力，会是事倍功半的。\n\n如果你获得了足够多的初面机会，但之后常常被拒绝，合适的作品集可能会提高你被录用的几率。如果你的面试官读到你的某些副业项目并对此产生热情，你的面试就可能变得轻而易举。\n\
  \n### 你的博客\n\n有时你的学习计划并不允许你为作品集开发软件。例如，基于本书第 2 章来创建代码意义不大。这时候发布一篇博客文章就非常合理了。\n\n\
  即使你完成了副业项目，一篇总结心得的博客文章也能巩固你的学习体验。除了梳理你的思路，一篇博客文章还能为你带来一些关注度。\n\n许多软件开发者都有博客。通常，他们写四到五篇文章后就放弃了。当我审核一份带有两年未更新博客的申请时，我认为这是一个非常小的加分项。即使是一个过时的博客，也表明创建者曾经学到过东西。当我看到一个持续更新的博客时，我知道博客的主人很可能对他的职业充满热情。这种热情是很难伪装的。\n\
  \n### 注意\n\n热门内容创作者宣扬了一种时髦的观念：定期发布内容并放眼长远。这种长远眼光意味着，通过持续稳定地创作内容，你可以可预测地从零增长到每月数十万的浏览量。如果你的梦想是获得数十万粉丝并让你的品牌变现，那就去做吧。如果你只是想被雇佣或获得更多客户，那么每周花时间写一篇博客文章或制作两个视频可能并不划算。你还必须确定自己是处于大众市场还是利基市场。如果你通过专业化选择了一个好的利基，那么超过某个阈值后，创作更多内容的回报会递减。如果你积极推销自己，例如通过投递申请材料，你需要能展示你专业能力的文章。如果你希望不通过社交网络就被他人发现，那么博客能帮你吸引机会。\n\
  \n你可能听过这样的建议：你应该每周更新博客。类似于“每日提交代码”的想法，我不会走这么远。创作一篇高质量的博客文章是费力的工作。你不会想把生命中的时间都投入到仅仅为了创作内容上。虽然每周写一篇博客文章会带来一些好处，但成功建博的秘诀在于帕累托原则。\n\
  \n你的一些文章会很出色；另一些则可能只有几个人打开。如果你坚持每周更新的日程，总会有一些时候你根本不在创作顶尖内容的状态中。\n\n支持每周更新的理由是，你的品牌是一个承诺，表明你能持续交付。然而，通过持续交付低于平均质量的内容，你注定会为自己创造一个你不想要品牌。本书的基调是创造双赢的局面。如果紧凑的内容创作日程让你快乐，那就去做；否则，请考虑取悦你生活中最重要的人：你自己。如果你能坚持一个更宽松的日程，不仅你赢了，你的读者也赢了，因为他们将能接触到更高质量的材料。\n\
  \n在你这边，一个日程安排仍然是有意义的；因此，你可能要考虑提前写一些文章，并按照你的发布计划来发布它们。这样，即使你生病了，或者那天你要开车 14 个小时，你也能露面并产出高质量的代码。当你忙于生活时，`WordPress`可以自动发布你的文章。\n\
  \n### 注意\n\n博客可能会吸引许多你意想不到的机会。这本书就是我的出版商发现我的作品后创造出的一个机会。我创作过书籍和在线课程，在线上训练营中指导学生，并获得了许多其他机会。我的博客也帮助我接触到在职业生涯中遇到重大问题的软件开发者，我通过指导项目帮助他们提升水平。\n\
  \n这些机会帮助你在职业生涯中承担更多责任，这条道路超越了单纯的雇佣关系。作为雇员，我们都会达到自己的极限；超过一定水平后，积累的职业资本会指引你走向成为企业家的方向。这一步能让你从对外部系统的依赖中解放出来，因为你自己就是创造系统的人。\n\
  \n根据我的经验，我可以帮助你如何成为书籍或课程作者、教练或顾问。自 2016 年以来，我一直在为客户提供指导和咨询，而我的首次在线课程尝试可以追溯到 2015\
  \ 年。这段经历使我能够提炼出你所需的知识，帮助你开始塑造个人品牌，朝着成为一名自给自足的作者、教练或顾问的方向发展。这个主题超出了本书的范围。如果你对此感兴趣，请访问\
  \ `devcareermastery.com`。\n\n\n\n### 我该如何获得读者？\n\n这个问题经常被提及。当开发者开始写博客时，他们不知道是否有人会找到并阅读他们的文章。有些开发者建立了博客，但每周只有寥寥几位访客。缺乏访客会令人非常沮丧，也容易导致失去动力。\n\
  \n大多数人不知道，获得访客其实比想象中要容易。大多数软件开发话题都设有论坛、每周简报和留言板，你可以在这些地方分享你的内容。一个新闻聚合网站是 `Hacker\
  \ News`（[`https://news.ycombinator.com/`](https://news.ycombinator.com/)）。`Hacker\
  \ News` 的主要优势是，如果你的话题走红，它会变得非常火爆。缺点在于它并非针对特定领域。\n\n你可以肯定，在你的专业领域内也存在新闻聚合网站。万一你找不到任何新闻聚合网站，那你刚好从我这里得到了一个绝佳的副业点子：自己建一个。相比面向庞大的软件开发人员群体，针对性的受众更有可能访问你的网站。\n\
  \n你也可以尝试使用 `Reddit`。不过要提醒你，有些子版块会禁止明示推广来自同一来源的内容。因此，你必须通过分享其他问题和内容来提供价值。此外，一些 `Reddit`\
  \ 用户只会给你破坏性的批评。另一些人则专门为引战评论点赞。记住：只管做好自己的事，持续提升文章质量，无论做什么，都要记住“黑子终究会黑”。\n\n根据你的喜好，`Quora`\
  \ 和 `Stack Overflow` 可能会宽容一些。在这两个平台上，你可以通过回答来解答受众的问题。\n\n不必担心在有些人面前显得糟糕。即使你的目标受众看到喷子经常攻击你，他们也会同情你。建设性的批评会提升你内容的质量。这才是最重要的。\n\
  \n### 开设 YouTube 频道有意义吗？\n\n根据移动通信公司 `Ericsson` 的数据，到 2021 年，视频将占移动流量的 70%³⁸。这并不意味着每十份内容中就有七份是视频，因为我们讨论的是数据流量，而非上网时长。不过，视频消费的上升趋势仍然值得关注。\n\
  \n开设一个 `YouTube` 频道有意义吗？我对这个问题的回答是“视情况而定”。上传高质量视频有两个前提条件。\n\n首先，你必须很好地梳理你的思路。如果你写一篇好的博文都有困难，为什么要开始录制视频呢？你仍然需要为你的视频做笔记，有时甚至要写脚本。这项任务相当于写一篇博文。\n\
  \n其次，你必须克服恐惧。在镜头前说话，集合了人们习惯感受到的大多数恐惧：对被拒绝的恐惧、对失败的恐惧、对公开演讲的恐惧。在镜头前说话也会让你体验到，你内心的自我批评有多么苛刻。你可能听到别人犯错时会原谅，但对自己却总是要求严苛。如果你觉得克服所有这些恐惧和内心的自我批判能让你成为更专业的职场人，那么这个挑战对你来说就值得。否则，在当前阶段，制作视频只会分散你对职业发展核心事项的注意力。\n\
  \n`YouTube` 频道并非找到工作的必要条件，甚至未必是时间最明智的投资。如果你为应用商店开发应用、或是创建网页应用或网站，`YouTube` 频道也不是最佳投资。我主要鼓励你创建\
  \ `YouTube` 内容，如果你是想成为教练、顾问、导师或作者的话。为了获得工作或自由职业机会，你最好只制作几个高质量视频来丰富你的个人资料，或者什么都不做。\n\
  \n### 我必须处理托管问题吗？\n\n除了自建托管，还有很多替代方案。我也是从在 `github.io` 上搭建博客开始的，通过复制一个 `Jekyll`\
  \ 模板。这对我来说很省力，我的博客几小时就上线运行了。当看到我的受众增长后，我决定使用 `WordPress` 并搭配一个免费主题进行自建托管。你也可以这样做。\n\
  \n在 `github.io` 上托管的好处是，你可以同时创建作品集和博客。`github.io` 的缺点是，没有人会为你的内容做推广。\n\n如果你想立刻获得流量，`Medium`\
  \ 是一个不错的发布平台³⁹。我的两位同事各在 `Medium` 上发表了一篇文章，两人都获得了大量读者。由于他们写的是热门话题，`Medium` 直接将他们的文章分享给了众多读者。即使没有发表记录，你的第一篇文章也可能产生数千次浏览量。\n\
  \n### 写博客还能带来哪些其他好处？\n\n> 你会时不时收到一些机会的联系。这些邀约可能包括：\n\n* 工作邀请。\n* 咨询邀约。\n* 邀请撰写客座文章或参与播客。\n\
  * 其他形式的合作请求。\n* 为第三方网站创建付费教程的机会。\n* 有些人甚至会问你，是否允许他们将你的文章翻译成外语。例如，我的一些文章就被翻译成了日语⁴⁰。\n\
  \n\n\n### 关于专注的几点建议\n\n请从职业发展的角度，专注于那些真正重要的事务。许多人一直在做那些无法带来成果的事情。一旦发现预期的结果并未出现，他们反而会变本加厉地重复同样的行为。做同样的事却期待不同的结果，这无异于一种疯狂。\n\
  \n从职业发展的角度来看，专注和拥有清晰的目标至关重要。基于帕累托法则（二八定律）的个人品牌建设能为你带来最大化的成果。这里列出的一些工具或许能增长你的知识，但并不能为你带来显著的职业优势。\n\
  \n`Stack Overflow` 是一个用于协作解决问题的优秀工具。大多数软件开发者每天都在使用它。然而，仅仅为了打造个人品牌而去回答 `Stack Overflow`\
  \ 上的问题，几乎得不偿失。我鼓励你通过回答问题来帮助他人，但请不要抱有任何隐藏的动机，比如指望面试官会被你回答的质量所折服，或者机会会自动找上门来。在 `Stack\
  \ Overflow` 上撰写内容相比什么都不做确实是一个优势，但你可以用同样的精力，去写一些关于热门话题的 Medium 文章。\n\n`写博客` 如果方式不当，也可能阻碍你。以超出自身舒适区的高频率创作内容，不仅会耗费你的精力，还会占用你用于专业发展的时间。而且，一旦访客意识到你的内容缺乏一贯的质量，他们很快就会流失。记住，少即是多。当你没有什么有趣的观点要表达时，不要勉强自己按计划更新。质量胜于数量。\n\
  \n`社交媒体` 在你想为博客引流时非常有用。但 `社交媒体` 并非用来通过持续发帖来打造个人品牌的工具。唯一的例外可能是 `LinkedIn`，在这里你有机会成为有影响力的人，并通过你的文章接触到大量的专业人士。\n\
  \n`无用的项目` 纯粹是浪费时间。例如，没有多少人想看你开发的待办事项应用是怎么运行的，因为 `TodoMVC` 网站已经用至少 50 种方式完美实现了它。没有人希望你重新发明那些已经被发明过无数次的东西。\n\
  \n如果你的目标岗位明确要求`认证`，那么获得它对你有好处。实际上，大多数工作都不需要你获得认证。一些初创公司甚至将认证视为一种劣势，因为认证并不能证明你能够解决实际工作中的有意义的问题。只有当认证是你的硬性要求时，才去关注它。否则，建立你的作品集会让你更快地获得回报。\n\
  \n`竞技编程挑战` 对于测试和磨练你的技能非常有益。高难度的编程谜题对于练习编程面试也很有帮助。但在打造个人品牌方面，这类挑战通常没什么用。有少数例外情况，比如获胜者会获得一些工作机会和能在简历上加分的徽章。另一个例外是，像\
  \ `Google` 这样的科技巨头会通过监控你在某些编程挑战中的搜索历史来招募人才。竞争非常激烈。为了登顶，你需要投入大量精力去解决编程谜题，而其中一些谜题与你本职工作以及提升工作能力的相关性，远不如在工作中积累更多经验来得强。如果你的目标是打造个人品牌，希望你已清楚这些精力应该投向何处。\n\
  \n#### 练习\n\n1.  创建一个符合 `SMART` 原则的学习计划。\n\n2.  启动一个副业项目。\n\n3.  收集你过去的成就，并创建一个作品集网站。\n\
  \n4.  创建一个博客。\n\n5.  为你的博客和作品集引流，然后看看会发生什么。\n\n## 在社交活动与会议中拓展人脉\n\n**本章节的目标：**\n\
  \n*   理解社交活动、工作坊和会议在你职业生涯中的作用。\n\n*   考虑自己也成为一名演讲者。\n\n*   发现那些明星程序员在技术技能上往往并不比你更优秀。\n\
  \n许多人认为软件开发者性格内向、缺乏沟通技巧。社交活动、工作坊和会议为你提供了打破这种刻板印象的机会。从小的开始，参加一些社交活动，与人交流，看看你能将舒适圈扩展到多大。\n\
  \n在本节中，我们将详细分析如何充分利用社交活动、工作坊和会议。你将学习如何作为一名参与者最高效地利用时间，以及如何成为一名演讲者。\n\n\n\n### 参加聚会、工作坊和大会\n\
  \n一旦你参加了一次聚会，就会发现大多数人心中并没有明确的目标。他们参加聚会只是为了消费内容，或者可能提几个问题。把参加聚会当作学习技术新知识的好方法，其实并非最佳选择。首先，时间往往不足以深入探讨；其次，你之后可以在\
  \ YouTube 或 Vimeo 上按自己的节奏观看演示。第三，从你学习计划的角度来看，至少有一半的主题与你无关。\n\n聚会的主要好处在于，你能建立起有意义的联系。一旦参加聚会，你就可以与其他软件开发者建立人脉，了解他们在做什么，并找到与他们合作的方式。与大会不同，聚会是本地化的，这意味着你之后更容易与其他参与者见面。\n\
  \n聚会的次要好处在于，你能发现一些有助于职业生涯的新想法。最宝贵的信息总能为你带来新的视角。如果你能带回一个富有成效的想法，让自己变得更高效，那么你在聚会上花的时间就值得了。\n\
  \n如果你积极主动，参加工作坊对你来说很有意义。遇到问题时随时举手提问。如果卡住了，就寻求帮助。确保自己充分利用这次体验。如果你付了费，就应该有所收获。\n\n\
  工作坊也是建立人脉的好地方。与人交谈，通过深入了解他们的动机来建立更深层次的联系，并思考互利的合作方式。然后交换你们的联系方式。\n\n大会则将一切提升到了新的高度。你需前往特定的城市，而组织者会尽最大努力为你提供最佳体验。有些大会的座位售价高达四位数，你甚至还得抽签才有机会购得。因此，我认为仅仅为了学习和消费内容而去参加大会，是一种巨大的金钱浪费。建立人脉对你至关重要。为了建立人脉，你必须能够有所付出。这就是为什么提前建立线上形象非常有用。即使你没有线上形象，你至少可以给予对方关注，并在你了解如何与他们合作之后再联系他们。\n\
  \n从小处着手，先通过参加聚会来学习建立人脉的技巧。等到你去参加大会时，就会知道该怎么做。\n\n如果你对社交感到不自在，不必担心。当你与人交谈时，你会发现每个人都喜欢得到一些关注。每个人都有同样最喜欢的主题：他们自己。如果你对他们表现出兴趣，你的人脉通常也会乐于与你保持联系。\n\
  \n建立人脉是无需使用“游击战术”就能进入隐形就业市场的最佳方式。许多合作都是在大会上达成的。如果你参加大会只是为了学习，请睁大双眼，看看外面存在的机遇。\n\n\
  尽管大多数人首先关注的是自己，但不要害怕成为一个给予者。我强烈推荐阅读《*给予与收获：成功的革命性方法*》^(⁴¹)这本书，你会在其中发现，不仅是最不成功的人，而且最成功的人也都是给予者。没有索取者或互利者能复制真正给予者的成功。成功给予者与不成功给予者的主要区别在于，成功的给予者知道自己的努力花在哪里最有效。他们能识别出索取者，要么远离他们，要么鼓励他们也成为给予者。他们还会给予对他人有价值的帮助，同时仍高效地完成自己的职责。即使你的付出没有回报，也不要害怕给予。\n\
  \n另一本关于给予行为的书值得一提，那就是西奥迪尼教授的《*影响力：说服心理学*》。^(⁴²) 通过扮演给予者的角色，他人会受到激励去 *回报*，即想办法给予你一些回馈。给予者是出于本性给予。互利者则是出于互惠互利的考虑而给予。索取者可能会出于内疚，或出于维持一段有利关系的自私目的而给予。回想一下上次有人请你吃午餐的情景。你感觉如何？你是否想回请对方呢？\n\
  \n### 成为一名演讲者\n\n与开通你的 YouTube 频道类似，你不可能一夜之间就成为大会的演讲者。随着你在小型活动中积累经验并建立个人品牌，你的机会会越来越大。\n\
  \n从大会组织者的角度来看，他们显然希望与明星开发者合作，以便卖出更贵的门票。如果他们无法证明你拥有在观众面前演讲的能力，除非你的主题非常出色，否则你很可能会被拒绝。\n\
  \n为了平衡机会，并为新人提供新鲜见解，许多组织者会对申请者的摘要进行匿名处理，并在不考虑个人品牌的情况下选择最佳者。这为新人提供了一个获得演讲名额的绝佳机会。请注意，一些大会组织者要求你至少提交一个视频，证明你有能力在镜头前讲话。\n\
  \n如果你觉得录制一段 1 分钟的演讲推介很困难，别担心。这很正常。起初，我花了半个多小时才录好一段 1 分钟的推介。我感觉自己既笨拙又尴尬。但随着我讲话经验越来越丰富，我也感到越来越自在。\n\
  \n在镜头前讲话并发布结果，事后感觉很不错。通过每周对着镜头讲话，你就有机会大幅提高沟通技巧。想象一下，从长远来看，这些技能对你的职业生涯意味着什么。你甚至可能像明星开发者一样在台上侃侃而谈。\n\
  \n鉴于大多数大会都想要大腕，一些明星开发者也能通过非正式申请流程获得演讲名额。如果你想成为其中一员，这倒是一条值得追求的道路。\n\n从小事做起是明智的。先在聚会上演讲。你甚至可以自己组织一场聚会。然后，在工作坊提供帮助。最终，你会积累足够的经验，并能从容地参加大会。\n\
  \n如果你觉得自己已经准备好进行大会演讲，那就不要退缩！我的一些同事在聚会和工作坊上没有任何经验，也没有线上形象，却仍获得了演讲名额。他们唯一的优势就是有一个有趣的主题。\n\
  \n别担心你的演讲技巧。大多数大会都会为你准备一套提示，帮助准备高质量的演讲。你的同事也可能在预演中听取你的演讲。\n\n关于演讲，我给你的最后一条建议是：放下内心的评判。录下你自己，也录下另一个人。观看两段视频。注意你犯错时对自己的苛刻，以及当别人犯下同样错误时你有多么宽容。意识到你的观众也会同样宽容地对待你。你只需要允许自己犯错。你是个凡人，这样反而会让人感觉更亲近。\n\
  \n#### 练习\n\n1.  找一个你感兴趣的细分领域。为你感兴趣的领域制定一个学习计划。\n2.  找到与你所选主题相关的本地聚会，并参加其中一些。\n\
  3.  准备一个简短的演示，并在本地聚会上演讲。\n4.  考虑争取一个大会的演讲名额。尽可能多地申请成为演讲者，以此挑战自己。\n\n\n\n"
