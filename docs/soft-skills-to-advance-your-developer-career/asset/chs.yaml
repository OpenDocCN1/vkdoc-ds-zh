- "# 1. 软技能的重要性\n\n## 开发者的优势\n\n你微笑着来到办公室门前，思考着即将展现在你面前的冒险。你负责一个将影响数百万人生活的敏感项目。你的经理们支持你的所有决定，你的团队由杰出的人才组成。\n\
  \n你很高兴今天开始工作，因为在这种环境中你能如此迅速地成长，你开始思考开发产品的速度。你的道路上没有管理不善、沟通不畅或许多软件项目失败的常见原因所造成的任何障碍。由于你的公司允许远程工作，你正在考虑购买一套度假屋。你的工作让你能够享受地中海气候，而不是漫长、阴暗、寒冷的冬日。你在对的地方工作。你正活在你的梦想中。\n\
  \n对一些人来说，这幅画面是日常现实。对另一些人来说，这个场景听起来如此遥远，以至于他们认为自己永远无法达到职业生涯的这一步。本书的最终目标是让你的梦想成真。本书为你提供了加速职业发展的优势。\n\
  \n通往梦想工作的道路值得追求，因为你不仅能在最后收获丰厚的回报，而且在旅途中也会得到奖赏。无论你是在寻找更多的金钱、更好的职业保障，还是打造让你引以为傲的东西，我都挑战你享受旅程的每一步。在做选择时，永远记住：进步就是幸福。实现目标并不会让你幸福。你在此过程中成为什么样的人，才是关键所在。\n\
  \n通过阅读本章，你将迈出第一步。\n\n我们将探讨为什么软件开发者的职业是特殊的。你会发现为什么你或许应考虑寻求软件专业人士的帮助，而不是一位从未在软件开发领域工作过的职业教练。\n\
  \n然后，你将学习塑造你职业生涯的四种基本软技能。不仅本书，你的旅程也基于这四种软技能。掌握这些技能，你将总能从职业生涯的角度知道下一步该怎么做。\n\n借助这四种基本软技能，我们将构建一个整体模型，为你提供一张指引旅程的地图。然后，我们将讨论一些方法，让你在职业生涯中快速取得一些立竿见影的小胜。\n\
  \n永远不要不采取行动就“离开现场”；在你的职业生涯中实施一些快速的改变将建立动力并加速你的进步。这意味着，不要只是读完这本书，然后去做一些完全不相关的事情，比如看电影或玩电子游戏。不要说“总有一天我会去做”，因为那一天永远不会到来。现在就采取行动。每天努力推进职业发展所需的精力会少得多。\n\
  \n让我们从探索是什么让软件开发者的职业如此特别开始我们的旅程。\n\n\n\n## 为什么软件开发者职业如此特别\n\n**本节目标：**\n\n-   理解为何在\
  \ 21 世纪成为一名软件开发者是如此美好\n-   理解软件开发者职业所面临的挑战\n\n如果你希望在软件开发者职业生涯中有所作为，那么你很可能已经确信自己拥有地球上最好的职业之一。正如我的一位朋友所说，我们是带着热爱去工作，并且还能因此获得报酬。编写软件是一种富有回报且充满创意的体验。我们为交付专业、能正常运行的解决方案而感到自豪。\n\
  \n不幸的是，软件开发也有其阴暗面。软件开发者常常专注于抽象概念，与电脑互动而非与他人交流。这使我们在清晰表达思想和情感方面处于劣势，因为我们在这方面的实践经验较少，不如那些面向客户的职位（如销售人员）。因此，我们中的许多人需要帮助才能为自己争取到更好的工作条件，或是恰当地进行自我推销。\n\
  \n职业晋升常常因为我们缺乏与完全不精通技术的人合作的能力而受阻。要与业务利益相关者合作，我们需要一些在学校里从未有人教过的技能。\n\n许多开发者在职业生涯达到一个平台期后，开始寻找进步的机会。有些人提升自己的专业技能，而另一些人则向职业教练寻求建议——这些教练要么根本不了解软件开发，要么早在多年前就已与行业脱节。\n\
  \n一些教练是企业家或被称为“明星开发者”的开发者名人。他们常常激励我们，谈论一些很棒的话题。然而，他们建议的有效性取决于他们的专业水平。我从他们那里学到了职业精神、何时该说“是”、何时该说“不”、如何使用某些生产力工具，以及如何管理团队。我尝试了许多概念、策略、技巧和最佳实践；我发现有些对我非常有效，而另一些则不然。\n\
  \n在经历了一些惨痛的教训后，我问自己一个问题：如果别人的策略就是不适合我呢？如果我必须承担起责任，根据我自己的优缺点去发现什么在我的情况下是有效的呢？如果这些概念仅仅让我变成了一个缺乏安全感、想要假装自信的人的翻版呢？\n\
  \n假装自信的问题在于，你内心并不感到自信。假装自信就像一个掩盖症状的补丁，而没有解决根本原因。隐藏所有潜在根本原因的症状，往往比妥善修复它需要更多的工作。在这本书中，你将学习如何解决感到不安全的根本原因。一旦根本原因消失，你将不再需要在那些原本不得不假装自信的场合伪装自己。职业教练给我们提供了一张地图上的路径，却没有考虑真实的地形，也没有考虑我们自身的能力。有些人成功了，因为遵循这条路总比漫无目的地游荡要好。但同时，另一些人却陷入困境，因为没人教他们如何游泳，而这条路径恰好要穿过深水区。\n\
  \n不要把地图和分步解决方案混为一谈。我知道寻找简单的解决方案很诱人，但有时，简单的解决方案根本不存在。在这种情况下，对自己的行为负责是唯一持久的解决方案。那些听起来更容易的解决方案，不过是思维迷雾罢了。\n\
  \n### 注\n\n思维迷雾是指你遵循一个看似能引导你的概念。然而，思维迷雾非但不能引导你，反而会扭曲你对现实的感知。许多概念会阻碍你对情况做出清晰的判断，并限制你的思维过程。相信地球是平的是一种思维迷雾。同样，相信在面试官开口之前你绝不应透露薪资期望也是一种思维迷雾。我的方法表演教练\
  \ Shredy Jabarin（[`www.shredyjabarin.com`](http://www.shredyjabarin.com)）向我介绍了这个概念。他把摆脱思维迷雾称为“清空垃圾”。\n\
  \n思维迷雾占据了你大脑的空间，并扭曲了你的感知，因为你透过一个滤镜来看世界。本书的大部分内容都将帮助你摆脱这种思维迷雾，让你能清晰地看清事物。\n\n思维迷雾可能以多种形式出现。某一策略可能并不适用于你，原因可能在于：\n\
  \n1.  软件开发者职业具有其特殊性。\n2.  你个人的情况与该策略不兼容。\n\n虽然我们会在后面讨论第二点，但本节我们将重点讨论第一点。软件开发者的情况非常独特，以至于我常常需要努力去解读那些地图和路径，使其最符合我的目标。这个过程的结果总结在了本书中。\n\
  \n让我们探讨一下，为什么当涉及到选择适合你的职业建议时，作为一名软件开发者，你处于一种独特的情况。\n\n**需求与供给**：软件开发者处于极高的需求状态。IT\
  \ 行业的职位空缺远多于准备就绪的合格专业人员数量。公司不仅需要软件开发者：他们需要的是具备专业态度、能够与业务部门合作、并能解决复杂抽象问题的人才。一旦你掌握了公司所寻求的技能，找到工作将毫无问题。\n\
  \n**薪资范围跨度很大**：从实习生到首席技术官，薪资各不相同。一旦你成为一名初级软件开发人员，你的收入很可能已经超过了大多数非技术工人。随着你职业生涯的进步，你将有机会获得六位数（美元或欧元）的薪资。\n\
  \n**软件开发者常被视为成本**：这是就业市场效率低下的原因之一。IT 工作是如此抽象，以至于需要相当的智慧才能发现和定义卓越的表现。如果一个销售人员每个月完成\
  \ 1000 万美元的业绩，而团队平均水平是 100 万，那么你知道这个人是一个超级明星。但一个“10 倍效率”的开发者做了什么？解决问题快十倍？谁注意到了？做出架构决策，防止团队浪费相当于项目成本十倍的金钱？你如何衡量决策质量？直到今天，衡量\
  \ IT 技能的关键绩效指标仍然难以定义。\n\n每个人都想与最优秀的人共事；然而，他们并不理解，最优秀的开发者也和任何人一样，想要成为英雄。将软件开发者视为成本，使得开发者很难证明他们的贡献为什么价值更高，因为他们的表现几乎从未与公司的利润挂钩。不过别担心，这场仗还没输。我将向你展示如何构建你的论据。\n\
  \n\n  \n**业务与 IT 之间的紧张关系**：除非你身处一家对技术有深刻理解且开发流程健康的科技公司，否则你的团队与雇主之间可能会产生紧张关系。业务人员追求快速获得可衡量的成果。他们不理解复杂性，并将软件开发视为简单的线性流程。如果一个项目需要\
  \ 200 天完成，那么四倍人力就能在 50 天内完成，对吧？错。快进到第 100 天，项目 50%的部分已经可见且完成，对吧？错。在需求文档中修改一句话很容易；毕竟那只是一个小改动，对吧？错。当紧张关系出现时，业务人员往往比软件开发人员更强硬。如果你给出模糊的回应，他们会将其视为承诺，并在无法交付时将责任归咎于你。与此同时，软件开发人员渴望成为当天的英雄，这使得他们即便在相关风险过高时也轻易做出承诺。\n\
  \n**缺乏超额完成的激励**：除非你在一个创新公司（目前或曾经是科技初创企业）工作，否则你的公司很可能不会为你提供超额完成的激励。许多公司甚至不支付加班费。如果你在想需要做什么才能获得加薪，你并不孤单。我鼓励你继续阅读，学习如何向雇主提出令人难以拒绝的诉求。\n\
  \n**工作不会教你谈判和坚持自我**：面对现实吧，编写代码并不能提升我们的人际交往能力。具备良好人际和社交技能的软件开发人员更容易在职业选择中找到方向。与此同时，销售人员每天都在达成交易。尽管销售人员通常赚取佣金，但他们有许多可以谈判的地方。由于这是他们的本职工作，他们比软件开发人员更可能坚持自我。\n\
  \n**丰富的转型路径**：我们有很多选择。一些开发者感觉自己被迫成为技术主管，以避免职业停滞。这完全不符合事实。在当今世界，许多专家比他们的领导挣得更多。然而，大多数人听到解决方案架构师、首席技术官、副总裁、团队主管、工程经理、设计思维教练、Scrum\
  \ Master、产品经理、技术项目经理、技术负责人、开发主管和软件工程师这些头衔时仍会感到困惑。机会如此之多，似乎令人不知所措。如果你不清楚自己的方向，你的时间和精力可能会投入到一个你并不想要的目标上。\n\
  \n**你的表现难以被衡量**：由于你的工作通常过于抽象而难以量化，负责追踪你表现的人可能很难清晰了解你有多优秀。在一些公司，负责决定你薪资的人对软件开发一无所知。他们只看到结果。为了弥合你实际表现与感知表现之间的差距，你必须努力让你的工作可见且易于理解。这需要在过于谦逊和吹嘘自己成就这两个危险极端之间取得平衡。\n\
  \n在收集了所有这些挑战后，我开始思考我最初的假设是否正确。我曾假设软件开发人员很快乐，因为他们热爱自己的工作。然而，我们与雇主的合作常常让我们难以真正享受热情所在。我仍然相信，每个开发者都有机会体验到一种环境带来的快乐——在这种环境中，我们可以专注于自己的热情，而不是那些困扰我们的事情。我也相信，只要我们能提供足够价值作为交换，就能学会所有必需的技能，以获得理想的工作条件和回报。\n\
  \n本书描述了如何与当前及未来的雇主创造双赢局面的学习路径。\n\n## 职业晋升的四大关键软技能\n\n**本节目标：**\n\n*   从职业角度出发，找出为何软技能至关重要。\n\
  *   发现四大关键软技能，它们是你职业生涯的四个基石。\n*   认识到这四大关键软技能如何帮助你掌握其他技能。\n\n软技能是个人属性，使人能够与他人有效且和谐地互动。马歇尔·戈德史密斯在他的著作《习惯力》¹中指出，当技能水平超过某个门槛后，每个人的能力都足够出色。一旦你达到这个水平，你的软技能将决定你的成功。\n\
  \n好消息是，你可以有意识地专注于培养软技能。这将在你的整个职业生涯中带来显著优势。发展软技能不仅能加速你的职业发展，还能让你成为更优秀的专业人士。\n\n你是否发现过某些同事有不妥当的行为？你是否曾遇到过这样的同事：\n\
  \n*   对他人快速做出判断，并用破坏性评论将其判断正式化\n*   倾向于帮助任何人，即使对方并不欢迎这种帮助\n*   在任何情况下都不愿接受任何帮助\n\
  *   一有机会就不断吹嘘自己的成就\n*   在工作场所传播负面情绪，如愤怒或缺乏动力，影响他人心情\n*   从不给予任何反馈，甚至连感谢都不说\n*  \
  \ 在对话中只顾等待自己发言的机会，或者不断打断你，拒绝倾听\n*   对你很友好，但当你不在场时却说你的坏话\n*   无缘无故被冒犯，并因其对某个随意话题的感受而责怪你\n\
  *   获取并独占你所有成就的功劳？\n\n关于人们做出损害自己职业发展行为的故事数不胜数。不要成为其中之一！\n\n通过软技能，你可以代表团队的利益。软技能还将帮助你获得晋升、加薪、更好的工作条件，并通过提升你的面试技巧来增加就业选择。\n\
  \n你可能会觉得此时开始行动非常困难。这就是为什么我们现在将聚焦于四大关键软技能——从职业角度看，它们至关重要。你将初步了解这四大软技能，从而看清本书将为你带来的全貌。在后续章节中，我们将从职业角度逐一深入探讨这些软技能。你不仅能获得一些新的思考方向，还会得到一些可以付诸实践的练习。\n\
  \n这四大软技能如下：\n\n*   正直品格\n*   承担责任\n*   专业素养\n*   沟通能力\n\n这个列表可能让你惊讶。灵活性在哪里？承诺在哪里？时间管理呢？团队合作？领导力？指导能力？解决问题？礼貌呢？\n\
  \n花点时间思考所有这些技能。没有正直品格、承担责任、专业素养和沟通能力，有可能运用这些技能吗？没有沟通能力、正直品格、承担责任以及通过专业素养以身作则，有可能领导他人吗？如果你缺乏专业素养且无法沟通自己的思考过程，有可能在实践中解决有意义的问题或指导他人吗？\n\
  \n优秀的性格特质和有价值的技能都建立在坚实的基础之上。一旦基础牢固，其余的一切就容易就位。想想修复代码中的一个错误。有治标的方法，也有解决根本原因的方法。专业人士会解决根本原因。专业人士通过沟通必须修复根本原因来保持正直品格，即使在此之前需要先通过热修复处理表面症状。\n\
  \n\n雇主们都在寻找具备以下四项技能的人才。一位兼具**个人诚信**、**自我负责**和**良好沟通能力**的软件专业人士实属难得，而这正是你的优势所在。如果你经常锻炼这些技能，你当前的雇主可能会相对较快地察觉到你的态度变化。或者，如果你的雇主毫无察觉，那也不是什么大问题，因为你会有很多其他选择。其他雇主一定会对你的服务表现出兴趣。\n\
  \n让我们来详细探讨这四项基本的软技能。\n\n### 个人诚信\n\n在你的职业生涯中，无论做什么，都要始终考虑全局。所有决定都会对你的职业生涯产生连锁效应。以完全的诚信来做决定，意味着你将永远不会为自己所做之事感到后悔。\n\
  \n以诚信行事意味着你诚实坦率，并坚守自己的道德和伦理价值观。你做你认为正确的事情。你有一套道德准则；并且你不会因为恐惧、为了迎合他人的期望或渴望获得短期利益而做出妥协。\n\
  \n拥有个人诚信并不意味着你不需要塑造一个代表公司利益的角色（例如在董事会或谈判中），它仅仅意味着这个角色与你的个人品格融为一体。因此，你的行为会显得真实可信，更值得信赖。\n\
  \n诚信是我们整体模型的核心。这就是为什么你会从第 3 章开始，致力于培养你的个人诚信。你将学习如何建立自尊、培养自信，以及如何作为一名专业人士成长。这将使你能够挺身而出，做你认为正确的事情，而不是寻求他人认为正确的事情。\n\
  \n如果你对这个过程有所怀疑，我能理解。我过去的行为也曾被自己的恐惧所驱使。我有许多限制性的信念，阻碍了我以诚信行事。在我的内心深处，我觉得自己不配去做真正想做的事，因为优先考虑他人的需求和期望才是首要的。在过去，这种心态不仅毒害了我的思想，也耗尽了我的精力和内在动力。\n\
  \n每当我访问一个安全的城市，我都有个习惯：在周一早上乘坐公共交通，观察人们的心情。我经常看到的是低能量和缺乏动力。对许多人来说，工作并没有给他们的生活带来意义。他们工作五天，只为换取两天的享乐。周一早上，享乐刚刚结束。\n\
  \n以诚信生活意味着，你做事的方式贯穿于你所做的每一件事。因此，你没有理由在周一感觉比周末更好或更差。你一定见过至少一位同事，几乎每个周一早上都高高兴兴地来上班。这个人是否很可能是在以诚信行事呢？工作满意度的关键在于能够以诚信行事。你的职业生涯可能尚未达到这个境界。这就是为什么我们要为你设定有意义的目标，并让你走上一条值得追求的职业道路。\n\
  \n本书的所有章节都建立在诚信的基础之上。谎言或任何挑战你个人诚信的行为，在软件专业人士的生活中都不应有立足之地。\n\n### 承担责任\n\n有些公司能够持续发布没有质量保证团队的软件。有些公司能够在没有项目经理负责协调资源的情况下有效运作。实现这一切的必要条件是，在个人和团队层面承担责任。\n\
  \n雇主们寻找的是那些愿意多走一步的人。那些主动负责的人绝不会告诉你，帮助他们自己的公司去做他们不擅长的工作不是他们的职责。承担责任的人绝不会坐在电脑前感到束手无策，等待答案送上门来。正如这种软技能的名称所示，他们会主动站起来，去获取他们需要的信息，从而承担责任。在扫清障碍之前，他们绝不轻言放弃。\n\
  \n如果你拥有勇于承担责任的名声，优秀的雇主就会重视你的贡献。在对软件开发人员需求日益增长的时代，许多开发人员认为即使不承担责任也能混得过去，因为他们总能找到工作。虽然有些开发人员可能带着这种心态也能过关，但这很可能会阻碍他们在职场的进步。与此同时，如果你从入职第一天起就承担责任，那么你很可能就是第一个被考虑晋升的人。\n\
  \n有些人倾向于为自己的错误责怪他人。在大多数情况下，这些人很难承认自己犯了错。你的武器则是以诚信行事，甚至为你的错误承担责任。过段时间，你会意识到犯错对于成长至关重要。如果你不犯错，你学得就慢。如果你害怕犯错，你的贡献价值就会降低。\n\
  \n请注意，当别人指责你时，个人诚信会帮助你。只要你是以诚信行事，指责就不会得逞。\n\n在第 3 章中，你将学会通过引入“你对自己的技能发展负有责任”这一理念来开始承担责任。你将学习如何转变思维模式以快速成长。之后，你将发现动机和意志力之间的联系。你可能会得出关于激励自己的重要结论。\n\
  \n第 5 章将帮助你利用反馈的力量来改进自己的弱点。如果得不到反馈，也没关系；你将学习如何主动出击，建立反馈循环。如果你没有被注意到，你可以主动承担责任，去完成那些无人能够忽视的事情。即使反馈没有立即带来加薪，也要记住，从长远来看，金钱最终会与承担责任相匹配。\n\
  \n在招聘流程的谈判阶段，你可以展示你承担责任的态度，而无需直接吹嘘。你甚至可以主动研究你的薪资水平，并回应你的期望，而无需屈从于关于信息不对称和“先出价者输”这一公认公理的信息迷雾。正如每个半真半假的陈述一样，先出价的人有时会输，有时会赢。一切都取决于具体情况。\n\
  \n### 备注\n\n招聘流程中的信息不对称，描述了候选人与雇主相比，在薪资相关信息方面掌握不足的情况。\n\n\n\n### 职业素养\n\n职业素养对于职业发展至关重要。结合个人诚信与责任感，他人会将你视为一个专业意见值得尊重的人。很少有软件开发者能掌握这些技能。这是开发者害怕面试和薪资谈判的首要原因。这也是许多开发者甚至缺乏自信去考虑争取那些他们本可获得的最优厚职位的第一大原因。\n\
  \n什么是职业素养？这是一个非常难回答的问题，因为很多人对职业素养有着不同的标准。我们将从多个角度来探讨它。\n\n专业人士是指在提供服务时坚持既定高标准的人。这些标准包括专业人士的行为准则。\n\
  \n许多人，尤其是软件开发领域之外的人，往往只停留在表面，根据你的*外表*来判断你的职业素养水平。尽管外表很重要，但它并非全部。你的着装规范、组织任务的方式，以及你吃饭、举止和言谈的方式，都会影响他人对你的评价。这些方面都包含在你的*个人品牌*中。然而，如果你的同事都穿\
  \ T 恤和短裤，没有人会要求你改变风格开始穿西装。运用常识，穿得比你的同事稍微好一点即可。这样，他们不仅会接纳你，还会尊敬你。\n\n在某种程度上，穿着与职业素养确实关系不大。但正如我一位做交易员的朋友所说，\"\
  市场总是对的。\" 抗拒别人对你的看法是没意义的。即使假设是错误的，如果你的穿着比同事差，而且办公桌上有 20 个空饮料瓶，很多人会认为你不如其他人专业。\n\n\
  职业素养的第二个组成部分是你的*资历、学历、成就和证书*。面对现实吧，在有些雇主眼中，一所大学的学位比无名学院或短期训练营的学位更有分量。对于拥有既定流程的大公司来说，标准认证也可能很重要。\n\
  \n好消息是，在 21 世纪，即使你没有学位或任何证书，你也能有所作为。如果你有专业的态度，就能解决有意义的问题。如果你知道如何建立个人品牌并推销它，你达到职业目标的速度将比收集证书更快。精心营销的实践经验几乎总能胜过理论知识。此外，许多知名公司根本不看你的资历或证书；他们只评估你的作品集和经验。\n\
  \n我们将在第 4 章中研究所有这些组成部分。你将了解到打造一份专业申请材料需要什么，同时也会获得关于如何投入少量工作来建立你的在线形象的的建议。\n\n少量工作并不意味着你种下一颗职业种子，你的在线形象就能神奇地凭空长出来。少量工作意味着我们要运用二次帕累托法则。根据帕累托法则，20%的努力会带来\
  \ 80%的结果。在这 20%中再次应用同样的帕累托法则，我们可以得出结论：4%的努力会带来 64%的结果。我们将确定那些能对你的职业生涯产生重大影响的速赢点。例如，在第\
  \ 2 章中，你将树立远大理想，并为自己制定一条清晰的职业道路。这包括找到一个值得作为软件专业人士去深耕的专业方向。\n\n在第 6 章和第 7 章中，你将学习研究自己薪酬的来龙去脉，以避免在被问及薪资期望时显得不专业。\n\
  \n在某个专业领域具备能力非常重要，这也是软件专业人士的特征。其他人会来向你寻求建议，并信任你的能力。在第 4 章中，你将读到如何为自己制定学习计划，并应用基于项目学习和横向思维来加速你的学习过程。高效学习会有回报。许多人难以跟上技术进步的节奏。他们不停地看书，却从不停下来将知识付诸实践。在学习方面，专业人士知道少即是多。\n\
  \n职业素养的一个重要方面是你值得信赖且能够承担责任。与其过度承诺却交付不足，不如尽力信守承诺；如果这些承诺无法兑现，你要尽快告知所有人。与其躲在借口后面，不如主动承担责任，并愿意参与讨论错误的结论。专业人士保留自己可以不完美的权利，并在纠正错误时竭尽全力。\n\
  \n承担责任与肩负责任相辅相成。一个将责任包含在职业素养中的模型也是有效的。然而，在本书中，我们将把责任与职业素养分开，因为你在生活的其他领域（不仅仅是职业生涯中）也可以承担责任。职业素养并不要求你处理那些阻碍你在谈判桌上发挥出色表现的创伤性事件。而承担责任则要求这样做，因为它意味着你拒绝成为环境的牺牲品，也拒绝接受现状。\n\
  \n诚信意味着你按照自己的价值观生活。对你重要的价值观包含在专业人士的行为准则中。只要你的行为符合你的职业行为准则，你就展现出了职业诚信。一旦你的职业形象融入你自己的个性，你就开始以完全的诚信行事。\n\
  \n另外，在第 5 章中有整整一节关于职业素养的内容。在其他作者关于此主题所写内容的基础上，我们将创建我们自己的职业规范。\n\n\n\n### 沟通\n\n\
  无论我们在生活中追求什么，第四项也是最后一项必备软技能都至关重要。沟通不仅能补足所有其他软技能，还能助你将它们提升至新的高度。\n\n许多软件开发者不善于表达自己。每天在电脑前坐数小时写代码、思考抽象概念、锻炼分析思维，这并不能很好地帮助你提升沟通能力。\n\
  \n与他人沟通并不是你应该学会的唯一技能，以取得更大成功。我们还将聚焦于与你生命中相处时间最久的那个人——你自己——进行沟通。你对自己说的话，决定了你的自尊，塑造了你的自我形象，并能让你更加自信。你将不再被恐惧所驱使，你会允许自己超越当前的想象。这正是第\
  \ 3 章要探讨的内容。\n\n在第 4 章中，我们将建立你的线上形象。这是一项书面沟通任务，你需要说服外部世界，让他们认为你应该被考虑。如果你想瞄准更好的工作，自我展示是一项至关重要的技能。\n\
  \n工作场所的沟通决定了你的团队对你的信任程度。给予和接收反馈决定了你成长的速度。当谈到你的下一次加薪时，反馈也能增加你在谈判桌上的胜算。第 5 章为你提供了建立有效沟通基础所需的策略。\n\
  \n基于坚实的基础，你已经准备好为自己协商更高的薪水，或者开始求职。在第 6 和第 7 章中，我们将精细打磨你的谈判技巧，让你的生活尽可能轻松。你可以成为一个自信的谈判者。这包括你面对现任雇主以及其他雇主的能力，在创造双赢局面的同时，坚定地表达你的利益。\n\
  \n我对思想迷雾采取零容忍政策。市场倾向于在那些本就不应有捷径存在的地方，为你提供问题的简单解决方案。不幸的是，向大众推广这样一个理念更为困难：承担责任并提升你的沟通技巧，才能带你走向你想去的地方，而这是满足你需求的最简单方案。任何捷径都只会制造进步的假象，扭曲你对现实的感知。通常，发生在你身上最糟糕的事情，就是通过捷径获得了成功。\n\
  \n在沟通方面，大多数人会给你一些普适规则，比如“在谈判桌上，先出价的人就输了。”这个理论有信息不对称作为支撑。我有证据表明，在我所阐述的这条道路上，不先出价反而可能更常产生适得其反的后果，超出你的想象。这并不意味着先出价总是有益的，因为某些公司环境可能要求你在考虑信息不对称的情况下玩谈判游戏。然而，假设你晋升到了所在专业领域的前\
  \ 5%，你通常有足够的筹码来改变规则并赚取更多金钱。\n\n这本书的全部意义在于为你提供坚实的基础，使你能够识别并摒弃思想迷雾。\n\n大多数人通过依赖谈判技巧、牺牲个人诚信，将自己置于非常艰难的境地。我们将致力于让你的生活尽可能轻松。你做好本职工作，你的雇主通常会支持你。否则，你的现任雇主很可能会失去你，因为其他潜在雇主会争相挖角你。\n\
  \n我也对操纵、缺乏诚实、自恋、马基雅维利主义、精神变态以及勒索采取零容忍政策。虽然拥有 BATNA（最佳替代方案）总是有帮助的，但你并不需要外部的录用通知才能与现任雇主谈判加薪。再次强调，在某些环境中，人们会砸钱留你，但一个专业人员的技能水平通常就足以作为\
  \ BATNA。换句话说，如果你遵循我阐述的道路，你的雇主会知道你可以随时离开，并按照自己的条件找到一份好工作，而让你满意符合他们的利益。\n\n你不需要炫耀你的成就，因为你会学习如何利用反馈为自己创造优势，以及如何赢得经理的尊重，从而能够从他们那里看到和听到你的成就。\n\
  \n虽然本书主要关注健康的工作环境，但有时你必须保护自己免受毒性环境的侵害。注意，这四项必备软技能已经让你处于一个绝佳的位置，为你提供了一些盔甲，以抵御那些被消耗欲驱使、并为一己私利而玩弄规则的掠食者。例如，请注意，沟通和个人诚信包括捍卫你自己的心理边界。因此，别人将无法侵犯你的边界，让你为他们的感受负责，尤其是当他们的情绪与客观现实脱节时。\n\
  \n\n\n### 四项核心软技能的影响\n\n诚信、责任心、专业精神和沟通能力有助于你在职业生涯的其他领域取得进步。让我们来看几个例子。\n\n**团队合作**：专业人士意识到他们必须依赖他人。通过主动负责和有效沟通，你将能更好地与团队协作，从而比单独行动更高效、更出色地解决有意义的问题。\n\
  \n**职业道德**：专业人士的行为准则包含对职业道德的高标准要求。否则，专业人士将面临丧失诚信的风险。专业人士懂得如何聪明地工作、主动出击，并在需要帮助时能够与他人合作。\n\
  \n**领导力**：通过展现你的专业态度并承担责任，你能够鼓励你的团队也具备同样的特质，从而成为更出色的人。\n\n**导师指导**：软件开发者在工作场所内外寻找导师。即使作为初级开发者，你也能成为可信赖的导师。至少，你拥有一个视角，可以告诉他人你是如何克服学习新事物的困难的。而一位资深开发者可能难以回忆起过去学习时的挣扎。你可以教会他人如何提出专业的解决方案。指导他人也是打磨自身沟通技巧的绝佳方式。\n\
  \n**问题解决**：软件专业人士的态度会持续挑战你的问题解决能力，因为你不断在解决职业生涯中有意义的问题。专业人士从不满足于针对症状的解决方案。专业人士总是深入挖掘，以找到并消除问题的根本原因。假设你会在持续的正规工作中变得更好，那么培养你的问题解决能力将成为专业精神以及你希望成为真正软件专业人士的诚信之心的副产品。\n\
  \n**时间管理**：这似乎是另一项与四项核心软技能几乎或完全没有关联的技能。让我们深入探讨一下。涉及时间管理、生产力、深度工作和有效工作的主题，在软件专业人士的生活中至关重要。假设你想要交付一个专业的解决方案，那么从职业角度来看，把时间浪费在无关紧要的事情上几乎毫无意义。设定自己的界限也是你的责任。有时你必须告诉别人你正忙，请他们一两个小时后再来找你。这需要沟通技巧。有时你需要告诉自己，你需要站起来、走一走、放松一下，恢复精力。其他时候，你可能需要告诉自己，浏览\
  \ Facebook 并不能解决你感到无聊的问题。也许你需要解决你感到无聊的根源，并让你的工作更有效率。\n\n**情商**：这是四项核心软技能如何被应用以改善你职业生涯的最后一个，但同样重要的例子。你的情商越高，你对这四项核心软技能的掌握就越好。因此，你可以将本书的大部分内容视为在软件开发背景下关于情商的训练。\n\
  \n在本书中，我们将利用这四项软技能来打造你的开发者优势。这一显著优势不仅会让你成为更优秀的专业人士，还会帮助你获得梦想中的工作。让我们继续了解我们方法的整体模型。\n\
  \n## 通往梦想工作与梦想生活的道路\n\n**本节目标：**\n\n- 从整体视角观察你的旅程。\n- 了解每一步的重要性，以便逐一理解后续主题的作用。\n\
  \n整体模型的任务是向你展示你旅程中各个步骤之间的部分与整体关系。我将向你展示本书的不同章节将如何为你带来你想要的结果。\n\n类似于计算机网络中分层的 `ISO-OSI`\
  \ 模型，我们将按层次思考。我们将专注于三个简单的层次，它们能为你带来最大的收益。这三个层次如下：\n\n- 职业心态\n- 表达自我身份\n- 谈判技巧\n\n\
  **职业心态**，即第一层，完全关乎情商。你将学习如何建立自尊，形成恰当的自我形象，从而变得势不可挡。你将能够通过管理自己的情绪并允许自己犯错来加速成长。你将学会如何面对恐惧，无论是公开演讲还是与老板进行艰难的对话，而不是逃避它们。你还将开发在艰难时期自我激励的方法。\n\
  \n我们将通过建立你的职业心态来培养所有四项核心软技能。个人诚信能提升你的自尊。你将把自己视为一个值得成功的人。你将学习如何消除负面情绪，即使在他人放弃保持专业精神时，也能保持你的专业态度。最后但同样重要的是，你的情绪平衡使你能够有效沟通，而无需技巧和花招。一旦我们奠定了职业心态的基础，我们将继续设计你的职业道路。你将拥有实现远大梦想所需的所有工具。远大梦想是为你设计一个五年职业路径所必需的。这将是你内在的动力，是你起床并朝着目标前进时内心的火焰。\n\
  \n第二层为你提供了**表达自我身份**的工具。在发现你从生活中想要什么之后，你将建立你的线上和线下形象。你将学习如何设计你的个人品牌。你将能够为自己制作比许多自由职业者甚至一些公司更好的宣传材料。如果你想成为明星开发者，你能够实现它。如果你想将薪水提高到六位数，凭借着良好的个人品牌、简历、在线作品集、博客、研讨会或会议演讲以及其他材料，你将更容易实现它。\n\
  \n你将学习有效沟通的方方面面，以代表自身利益，同时考虑他人利益。你将制定你的职业行为准则，即定义你作为软件专业人士界限的规则。你还将学习如何给予、如何接受并鼓励反馈，这些反馈甚至可能让你无需谈判就能获得晋升。\n\
  \n表达自我身份的第二层强烈依赖于第一层。如果没有心理平衡，你在尝试表达自己时会丧失诚信。假设你已具备职业心态，你的尝试将显得更有意义，并且你会产生更大的影响力。\n\
  \n基于这两层，代表你**谈判技巧**的第三层将变得非常容易掌握。许多信息产品犯了一个明显的错误，即一上来就专注于谈判技巧。换句话说，他们给你一颗药丸来治疗某些症状，这可能会也可能不会让你前进。通过先打好较低层次的基础，你就能用更少的精力专注于你的谈判技巧。\n\
  \n他人会知道你拥有个人诚信，你是一个专业人士，并且你为自己的行为承担全部责任。你的个人品牌和你的态度会为你说话。\n\n\n\n"
- '# 排版后内容


  我理解，关于谈判技巧的两个章节是任何职业类书籍中最受欢迎的话题。这是人类与生俱来的运作方式。我能听到这样的争论：“是的，Zsolt，这种心态理论很酷，但我首先得赚钱，然后才会关注另外两个层面。”问题在于，了解和钻研策略很容易，但运用这些策略却需要你承担责任并打好基础。


  大多数速效解决方案就像《黑客帝国》里的红色药丸。你只需吞下它，就会看到真相。但这种药丸在现实生活中并不存在，除非你称之为“为提高自身能力承担责任”。大多数人失败是因为将责任外包给了外部权威。当你阅读我的书时，我可能就是你的这个权威，我能让你相信，你只需要一套话术和一系列行动就能为自己谈判到更高的薪水。我的一些读者会成功。另一些人则会心跳加速地执行这些步骤，过程中充满羞耻感和内疚感。


  另一方面，如果你落实了前五章的所有改变，甚至没有阅读关于如何获得加薪或找新工作的内容，你大幅提高赚钱能力的机会有多大？对于我的许多读者来说，答案是肯定的。


  我仍然强烈建议你阅读关于争取加薪和面试新职位这两个章节。无论你多么专业，总有一些内幕信息能提高你的成功率。你会在正确的时间发出兴趣信号，使用正确的薪资范围，并以正确的方式展示你的技能。你还会了解到，成功不需要什么，以及哪些流行的职业建议反而会降低你在谈判桌上的机会。


  在大多数小节末尾，一些练习将挑战你将本书中的想法付诸行动。这些问题不仅能鼓励你思考自己的职业生涯，还能帮助你提升技能。


  我希望你现在已准备好开始你的旅程。谁知道呢，你买这本书也许是为了谈成 20%的加薪。而这只是你前方转变的开始。


  要开始这段通往精通的旅程，最好的方法莫过于积累几个快速的胜利。如果你能在接下来的章节中实践一些想法，你将在几天内取得可衡量的进步。


  ## 如何通过速赢建立势头


  **本节目标：**


  -   腾出一些时间来处理对您重要的事情。

  -   变得更有条理，并向你的主管展示这一点。

  -   制定学习计划，建立你的在线形象。

  -   了解如何研究薪资范围、公司和面试问题。

  -   利用你的研究写出顶尖的、不会被拒的求职材料。


  如果你发现自己陷入了一个深坑，你需要有意识的努力，并忍受随之而来的痛苦期，才能爬出来。本节将让这段痛苦期变得尽可能简单直接。


  ### 注意


  有毒的自助读物会描绘出一个完美的榜样形象，他拥有完全的掌控力和所有的机会。这些榜样常常将自己的成功归因于一个决定：要在巅峰状态表现、奋斗、努力、变得心智坚强并取得成就。这些榜样的追随者往往沉浸于这个梦想，并开始模仿他们的行为，却没有建立适当的体系。这导致了短暂的兴奋，代价是持续消耗意志力。随着意志力耗尽，曾经热情的追随者放弃成为他们梦想中的人，并安于舒适的生活。


  那些鼓吹会走上“成就者之路”行动的大师、榜样、网红和名人们只忘记了一件事：对普通人日常现实的同理心。你只有先爬出自己所在的那个深坑，才能征服山顶上的城堡。试图在你的生活中制造重大改变，就像用弹弓从你的坑里朝城堡发射泥巴。最终，你在取得任何成就之前就会筋疲力尽。


  第一步往往是最难迈出的。我大学时的一个同行布莱恩想启动一个个人项目，他问我如何在全职工作之外还有精力运营两个博客。我让他告诉我他一天的生活。


  他通常在早上 5:30 左右起床，通勤 45 分钟去上班。如果他睡过头，由于早高峰，通勤时间会变成 1.5 小时。他通常在下午 5:00 下班，除非有紧急情况。过去两周，他通常晚上
  8:00 才到家，因为下班后经常有些杂事。不过，正常情况下，他会在下午 6:00 到 8:00 之间到家。


  “你什么时候睡觉？”我问他，同时注意到他看起来疲惫不堪。


  “大约午夜。但晚上 8:00 到午夜这段时间，我几乎没什么精力做任何有效率的事情，”他补充道。


  “你至少需要 7 个小时的睡眠，除非你用一些科学方法优化过睡眠。有些人需要 8 小时。难怪你晚上无法集中精力。”


  “我知道，但我妻子通常早上 9:00 上班，她在午夜前睡不着。我也很难入睡。”


  “你定期冥想或锻炼吗？”


  “我每周跑步两次，每次半小时。但除此之外没有了。”


  “周末呢？”


  “有时我睡到 11 点，还是觉得累。周六还能做点工作，但周日我们要和家人一起安排一些活动。”


  诊断结果很明确。布莱恩做出的生活选择不适合他，并且耗尽了他大部分的能量储备。等他到家时，他甚至无法集中注意力。


  ### 塑造你的环境


  几个月后，布莱恩选择搬到了城里。由于他可以在几个月内终止租房协议，所以搬家对他来说并不难。这一改变让他可以在上午 9:00 开始工作，睡到早上 7:00 或 8:00，不再牺牲自己的睡眠时间。


  在搬家之前，布莱恩申请了每月几天在家办公，并获得了批准。节省长途通勤的时间带来了回报。


  就你而言，可能还有其他环境限制因素让你无法发挥最佳状态。找出它们，并相应地塑造你的环境。


  他还找了一家健身房，并在一天中、午餐前安排了雷打不动的锻炼时间。为了恢复更多精力，布莱恩找到了独处时间，每天冥想 15 分钟。当其他人去抽根烟假装放松时，他清理了思绪，并通过冥想真正放松了下来。


  对你来说，做出这些重大改变可能不太可能；因此，你可以寻找其他节省时间、获得更多精力的方法：在下一个行动项中，你会找到一个每天节省 1 小时的资源。


  ### 每天多出一小时，节省时间


  作为软件开发人员，我们常常为时间所困。一天中总没有足够的时间去做所有你想做的事情！如果有一种方法可以“创造”时间呢？你愿意至少将其中一部分时间更愉快地投入到你的职业生涯中吗？你当然愿意。你可以尝试一些技巧来提高效率，从而有时间去做其他事情。关于如何在你生活中找回时间的技巧，请访问我的网站（`www.devcareermastery.com/onehouraday`），下载我的指南，并将这个速赢方法应用到你的生活中。


  ### 通过更有条理来增强责任感


  责任感是大五人格特质之一，与职场成功呈正相关。




  ### 说明


  大五人格特质，也称为 OCEAN 模型，包含开放性、尽责性、外向性、宜人性和神经质。文章[`https://positivepsychologyprogram.com/big-five-personality-theory/`](https://positivepsychologyprogram.com/big-five-personality-theory/)
  详细解释了这一模型。


  大多数软件开发人员都需要完成各种差事：编写应用程序、修复 Bug、在周三前部署更新、参加会议、引入架构变更、指导同事、或向董事会展示你的解决方案。有些任务很紧急，有些很重要，还有些既紧急又重要。请使用软件来跟踪你的任务。


  有些人用简单的文本文件来记录待办事项清单。作为一名开发者，很容易发现这种本地记录的弊端：如果电脑关机且你没有频繁保存，数据就会丢失。此外，由于清单是单向度的，你的用户体验也不会是最佳的。我们需要一个持久的多维数据存储方案。


  我可以推荐的一款免费软件是 Trello。^(⁴) Trello 的看板和卡片能帮助你组织一周的工作。假设有五个列分别对应本周接下来的五天，还有一个“已完成”列来存放你本周已完成的任务。设置一张
  Trello 卡片只需一分钟。你可以添加标签来指示紧急性和重要性。按优先级排列你每日的任务。挑选一项任务，着手处理。完成后，将其放入“已完成”列。如果有人因请求打断你，你可以简单地创建一张新卡片，并根据紧急性和重要性将其插入到正确的位置。这样你就可以说：“我周四再回复你，可以吗？”如果到了周四，其他任务改变了你的优先级，Trello
  会提醒你应该联系同事，重新安排他请求的任务。


  过完一天后，你可以将该列移动到看板的右侧。下一周你可以重复使用这个列。作为一个小改动，你还可以在“已完成”列旁边添加一个“今日”列。例如，如果今天是周三，把所有卡片从周三列移动到今日列，然后将周三列拖到右侧。如果今天积压了太多事情，可以根据你的工作量重新安排并分配卡片。


  请随意定制看板，使其契合你在岗位中的实际需求。例如，如果你需要提前规划超过一周的任务，可以在看板右侧添加一个“稍后”列。


  你的条理程度不仅能为你自己节省时间，还能帮助你保存意志力，因为关于要做什么的决定会变得容易得多。你将避免因未跟进事务而产生的挫败感，而且与不做规划相比，你会显得更加专业。


  完成任务能帮助你建立前进的势头。快速完成最重要的职责，并专注于余下时间而无需担忧任何事情，这在情感上是非常有益处的。有时你下午两点就完成了所有义务，这意味着你余下的时间就处于“自由发挥”状态。其他时候你可能会卡在某项任务上。但嘿，你卡在你最重要的任务上，那个你本应专注的任务上。所以你没有理由为此感到内疚。你只需要回顾剩余的任务，并重新安排你的待办事项清单。


  除了 Trello，另一款很棒的软件是 KanbanFlow。^(⁵) 只要你是个人使用，它就是免费的。该应用内置了一个番茄钟跟踪器，因此你可以将其与“每天找回一小时”指南中提到的番茄工作法（`www.devcareermastery.com/onehouraday`）结合使用。


  如果你在跟踪进度和养成习惯方面需要更多指导，Habitica^(⁶) 应用可以为你提供游戏化的体验，提醒你希望自己的生活是什么样子。通过合理设置在角色扮演游戏虚拟世界中可获得的奖励，Habitica
  会提醒你日常事务中的各个元素。我测试过 Habitica 几周，但对我来说管理开销太大了。不过，如果你痴迷于在角色扮演游戏中升级，你可以假装在玩《辐射 4》的同时推进你的职业生涯。


  有可能 Habitica、KanbanFlow 或 Trello 并不适合你，因为你更喜欢开销更低的解决方案。在这种情况下，我更建议你寻求更多专注，而不是微观管理。清晰即力量。对我来说，决定能否更好专注的首要因素，是我将任何一周所追求的目标数量限制在三个以内。只有当我完成了为自己设定的全部三个目标后，我才能添加更多目标。这样一来，我既不会因为设定过高目标而沮丧，也不会分心。我清楚每天该专注什么，并且有内在动力去推动处理手头最重要的任务。


  我所做的只是将三个目标以纯文本格式发布在一个智囊团小组中，例如：


  ```

  1. [x] 完成我的 JavaScript 视频课程的第三课。

  2. [ ] 为 Puppet、Terraform 和 Bamboo 的网络研讨会创建幻灯片。

  3. [ ] 完成我的纳税申报，并为我的会计师准备好所有需提交的材料。

  ```


  注意这些目标的简洁性。它们是二元的。即使第二个目标中我需要交付三场网络研讨会，我也只有在全部完成时才能勾选。保持简单能让你专注。审视你的目标会引导你的大脑去问自己：“我现在可以做些什么来取得进展？”将目标限制为每周三个会引导你的大脑去问自己：“对我来说，哪一件事最重要，能带来最大的改变？”


  ### 说明


  启动效应是指利用大脑的网状激活系统（RAS）来注意和解读事件，从而采取正确行动的过程。例如，请查看`https://tinyurl.com/career-priming`。


  纳税申报是必须完成的，毋庸置疑。即使有会计师帮助我，我也必须亲自提交所需材料。除非我把它列为生活中的优先事项，否则很可能第一周完成 80%，第二周完成 90%，第三周完成
  95%；而我会因持续切换上下文感到负担。将其设为优先事项则能消除这些上下文切换。


  这同样适用于工作。你可能有季度目标。规划你的一周并计划你要做什么。当别人为你制定了一个计划时，看看你的清单，思考那个计划是否比你为自己设定的目标更重要。在这方面你可能需要经理的帮助，所以你可以简单地将经理纳入你的计划中。这引出了下一点...




  ### 向你的主管发送周报


  现在，你的卡片已经放在了“已完成”列，在归档它们之前，不妨将这些信息用于另一个目的：向你的主管发送一份简洁、精炼的简短周报。


  收集你本周的成果，并将其总结在一封电子邮件中，用几个要点写下你本周的贡献。


  如果你有悬而未决的问题，也请将其包含在报告中。这将确保你能得到答复，并且让你的主管了解哪些事情正在阻碍你。


  临近周末时，你的下几周对应的列中可能已经有了一些卡片。在“下周计划”这一章节下，用几个要点来总结它们。


  这样一来，你的主管不仅能知道你本周完成了哪些工作以及遇到了哪些问题，还能准确了解你下周的工作量。如果你的工作优先级与业务需求不符，你的主管将有机会重新安排它们。


  你认为这样的报告能改善你与主管的关系吗？我猜会的。如果你的主管对此类信息不感兴趣，这很可能是一个强烈的信号，表明你待错了公司。


  请注意，过去有一些自由职业者向我汇报过。其中一些人选择每天发送一份包含他们成就、阻碍和问题的报告。我发现这份报告是了解我在该自由职业者身上的投入是否获得正向回报的最佳工具。


  ### 研究你的薪资


  这本书是关于职业发展的。如果你想取得进展，就必须知道你的贡献价值几何。研究你当前的职位以及你的目标职位。


  有两个进行薪资研究的绝佳资源：Glassdoor ( [`www.glassdoor.com`](http://www.glassdoor.com) ) 和 PayScale
  ( [`www.payscale.com`](http://www.payscale.com) )。


  你不仅可以查看薪资范围，还可以看到人们为换取特定薪资而工作公司的评价。请注意，评价有时会有偏差。一个对公司完全满意的人，发表评价的可能性通常低于一个刚刚决定离职的人。满意的人倾向于客观看待事物；不满意的人则往往非常主观地看待事物。最后，人们的意见也受限于他们的认知。就某些公司而言，我读到过许多不公平的评价，这些评价完全基于对不良行为缺乏支持，而另一些公司则鼓励正面评价以提高其在吸引力方面的排名。


  另一个有用的资源是 [`http://stackoverflow.com/jobs`](http://stackoverflow.com/jobs) ，它可以让你在你专业领域内寻找工作机会。通常，在
  Stack Overflow 上，你会收到与你自己相关的职位邀请。有些招聘广告会注明薪资范围。你不仅能了解在你期望的国家或城市应该瞄准的薪资范围，还能了解你正在申请的公司期望值。LinkedIn
  Jobs ( [`www.linkedin.com/jobs/`](http://www.linkedin.com/jobs/) ) 也可能是一个有趣的职位来源。


  只需一次谷歌搜索，你就能找到其他求职网站。可能有些网站专门针对你的城市或你的特定领域。


  如果你目前的收入没有达到应有水平，不要灰心。专注于重要的事情，请放心，只要采取正确的行动，你的薪水会增加。


  ### 制定学习计划


  在进行职位研究后，你可能已经收集了一些需要打磨的技能。如果你的目标是加薪或在当前组织中获得新职位，你也可以向同事和主管请教，了解什么能让你的团队更进一步。或者，如果你的目标是不同的团队，你也很容易就能发现他们在工作中使用了哪些技能。


  仅仅阅读这些技能是远远不够的，因为你会立刻忘记 90% 的内容。做笔记会有些帮助，但你仍然会忘记很多东西。我鼓励你采用基于项目的学习方式。


  创建一个有意义的副项目，该项目需要用到你想学习的技能。确保你的副项目不仅仅是一个没有实用性的模拟应用，而是你正在解决一个有意义的问题。


  通过从事有意义的副项目，你不仅能声称自己拥有某项工作所需的技能，而且还能展示它们。迟早会有人因为合作机会而联系你。GitHub 上的开源仓库也可能吸引其他合作者，前提是你知道如何让世界知道你在开发什么，并且找到了一个乐于接受的社区。


  不过要小心。我见过很多人构建的副项目几乎没什么意义。不要重复造轮子；要做一些独特的东西。例如，在 React、Angular 和 Vue 成为框架战争的赢家之前，每个人都想发明自己的框架。过了一段时间，社区开始对新框架持怀疑态度。


  如果你没有时间和精力去创建一个副项目，我鼓励你写博客文章。如果你不想，甚至不必托管自己的博客。像 GitHub Pages 和 Medium 这样的服务可以托管你的博客。


  撰写你正在学习的主题是在大脑中建立持久联系的好方法。额外的好处是，当你申请新职位时，可以展示你的副项目或博客。


  ### 重新审视你的简历


  如果你想申请一份新工作，请查看职位描述。然后看看你的简历。这份工作所要求的技能和经验在你的简历中是否清晰可见？让它们突出显示！


  是否有与你所申请职位几乎无关的技能、描述和资历？把它们从简历中删掉，或者精简！


  你是否链接了与这份工作相关的作品集网站、副项目、博客文章和其他活动？如果没有，请重新审视。


  你是否写得太多了？没有多少人会阅读一份长达十页的简历；让内容更紧凑。如果你想详细描述你的成就，我建议创建一个附件，在其中进行更详细的阐述。那些对你职业生涯细节感兴趣的人会阅读你的附件；不感兴趣的人也可能将此附件视为一个加分项。


  你是在写你自己（职能视角），还是在写公司如何从你的服务中获益（效用视角）？我建议采用后者；思考你的目标公司想读什么。


  你的简历是否足够好地反映了你的专业领域？如果没有，让它突出显示。


  如果你的简历中包含了照片，请到 Photofeeler ( [`www.photofeeler.com/`](http://www.photofeeler.com/)
  ) 上进行测试。如果你的评分很差，不放头像比保留要好。或者，你也可以去照相馆拍一张更好的头像。




  '
- '# 研究面试


  [glassdoor.​com](http://www.glassdoor.com) 的优势在于，你可以查找你所在领域的典型面试问题。很多人在面试时并不知道自己在做什么。因此，要做好遇到奇怪流程的准备。只要你保持专业态度并磨练解决问题的技巧，你的机会仍然很大。


  Toptal 的博客（`www.toptal.com/`）也为你提供了一些按兴趣领域分类的面试问题。我个人认为 Toptal 的面试流程公平且可信。


  不要把 Toptal 看作是破解代码面试的终极秘籍。也不要把类似标题的书籍视为能让你在面试中占尽先机的法宝。这些资源或许能帮到你，前提是你要正确使用它们：建立与学习计划之间的反馈通道。然而，没有任何资源能替代你自身的努力。


  如果你不知道某个问题的答案，不要死记硬背，而是回到你的学习计划中，在你存在的知识缺口与你可能已知的其他领域，或需要练习的领域之间建立联系。


  公司越是成熟，你能找到的关于招聘流程和公司期望的信息就越多。例如，在亚马逊，他们的内部招聘人员会给你发送一个资料包，里面包含了你准备面试所需的一切信息。


  '
- '# 练习面试


  你也可以定期申请一些工作，积累一些技术面试的经验，以此来获得练习。你甚至可以去一家公司面试，即使你并不想被他们录用。经常面试的好处是，你可以免费接触到更多的问题和答案。你可以利用获得的经验来完善你的学习计划。但为了获取反馈而面试的坏处是，你可能会对自己未被录用的原因得出错误的结论。


  例如，在我开始追求领导者和专家职位之前，我的面试官很少给我反馈。有时候我是因为文化契合度不高。我的家庭作业做得不够好。我的技能与公司不太匹配。但原因是什么呢？很多时候，人们很容易得出错误的结论，并改变那些本来行之有效的东西。


  把面试过程想象成一个漏斗。如果你很少获得首轮面试的机会，你就需要打造你的个人品牌来吸引更多机会。一旦你获得了首轮面试，你需要结合具体情境分析发生的一切。例如，你可能很清楚自己到底在寻找什么。如果你清楚自己的价值观，你在面试中可能会显得更有争议性。这意味着，如果面试官与你的价值观不符，你可能会让他们感到不悦。由此产生的拒绝，实际上可以被解读为一种成功。如果你因为能力上的差距而被淘汰，那就从中学习。如果你的家庭作业做得不够好，也从中学习。


  漏斗最难的部分是底部，即当你获得录用通知但谈判尝试却未成功的时候。你可能采取了错误的谈判策略。你的表现可能会在某个面试官心中留下一些疑虑。但究竟是哪个面试官？在哪个阶段？这时，有针对性的反馈比任何东西都更能帮助你。


  目前还有很多悬而未决的问题，或许通过讨论或练习来梳理这些问题是明智之举。一种方法是进行一次模拟面试。如果你有兴趣与我进行一次模拟面试来练习你的技能，请随时通过我的网站
  `http://devcareermastery.com/free-interview/` 联系我。


  ### 总结


  我们在本书的第一章已经讨论了许多基础性工作。首先，你了解到软件开发人员的职业生涯在某种意义上是特殊的，因为通用的职业发展建议可能并不适用于你。


  为了为你职业生涯的进步打下坚实的基础，我定义了四种关键的软技能，它们能帮助你以持久的方式结构化你的努力。通过坚持个人诚信、专业精神、承担责任以及发展沟通技巧，你将拥有在工作中创造价值的基础，最终你的赚钱能力也会随之增长。


  由于设计一个令人满意的职业生涯是一个长期项目，许多开发者需要动力来起步。因此，最后一节向你展示了一些基本步骤，帮助你获得一些快速的成果，从而为你带来更多的精力、时间和影响力，以便在你的职业生涯中做出改变。


