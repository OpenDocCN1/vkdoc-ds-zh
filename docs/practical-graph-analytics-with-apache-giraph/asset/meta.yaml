- - '##'
  - 真实世界示例：最短路径查找器
- - '###'
  - 本代码操作一个图，其中每个顶点的顶点数据包含一个 `LongWritable` 类型的 ID 和一个 `DoubleWritable` 类型的到源顶点的距离。所有边都关联了
    `FloatWritable` 标签，表示两个连接顶点之间的距离。通过 `SimpleShortestPathsVertex.sourceId` 命令行选项将源顶点传递给实现；该选项应为一个
    `LongWritable` 类型的 ID。你需要测量图中从该源顶点到所有其他顶点的距离。初始时，你将所有顶点（除了起始顶点）的距离度量设为 `Double.MAX_VALUE`。每个顶点期望收到其邻居发来的消息，宣布从源顶点到每个邻居的距离，再加上邻居顶点与接收顶点之间的距离。然后，你选择最小的值（因为你对最短路径感兴趣），如果它恰好小于当前距离，你就假设发现了一条通过某个邻居的更短路径；接着，你向邻居发送消息宣布这一事实。最后，无条件调用
    `voteToHalt()` 确保只要有未处理的消息，计算就会继续。这是合理的，因为当没有消息剩余时，意味着每个顶点都已获得最短距离，剩下的只是记录图的状态。
