  \ 展示了如何通过将相同 Twitter 图分解为每条边的信息来表示它。请注意，基于边的表示不包含关于顶点本身的信息。如果你尝试从边信息重建 Twitter 图，最终将丢失顶点信息。通常，当你想通过顶点之间的关系来描述图的结构时，基于边的表示更合适。\n\
