  \ A 在 Twitter 上关注了 B。尽管顶点和边是图的基本组成元素，但在大多数情况下，你希望将有趣的信息（即元数据）与顶点和边关联起来。在社交网络的场景中，顶点可能与用户档案信息相关联。此处，顶点有关联的用户年龄。你可能已经注意到，这对应于你在第\
  \ 5 章中了解到的`Vertex`值。每条边也关联了一个数字，表示一个用户提及另一个用户的次数；这对应于`Edge`值。\n\n从这张图片中概念化一个图很容易；但是要将这个图存储到磁盘上，你必须将其分解成信息片段，以便日后能够重建原始图。存储图的典型方式是存储顶点信息——基于顶点的表示，或者存储顶点之间关系的信息——基于边的表示。\n\
  \n在基于顶点的表示中，图由每个顶点的信息集合定义。邻接表是最常见的基于顶点的图表示之一。在最简单的形式中，邻接表是一个列表的集合，其中每个列表对应一个顶点，并包含该顶点的邻居。例如，图\
