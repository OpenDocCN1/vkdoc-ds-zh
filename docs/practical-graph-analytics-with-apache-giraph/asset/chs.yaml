- "# 揭示 Giraph 中的并行性\n\n本章涵盖\n\n- 每工作节点计算\n- Giraph 中的线程安全性\n- 图划分的重要性\n- 实现自定义分区器\n\
  \n在前面的章节中，你了解了 Giraph 的不同编程原语，并学会了如何使用它们来实现图算法。在实现图算法的过程中，你以抽象的方式考虑图，仅将它们视为可以通过消息相互通信的顶点和边。幸运的是，你无需担心底层发生了什么；也就是说，当\
  \ Giraph 在集群上执行你的算法时，这些顶点和边位于何处，或者消息是如何实际实现的。你也不必担心 Giraph 如何将算法的执行并行化。事实上，这正是 Giraph\
  \ 的一大优势；它为你隐藏了在大型计算集群上执行图算法所带来的复杂性。\n\n随后在第 6 章中，你更深入地了解了 Giraph 的内部架构，并发现它是如何管理超大规模图的并行处理的。你了解到\
  \ Giraph 将顶点分组到分区中，并将它们分发给负责处理每个分区的实际机器或工作节点，从而实现并行处理。你还了解到 Giraph 甚至可以在同一工作节点内的不同线程上执行处理，从而实现进一步的并行化。\n\
  \n在本章中，你将重新审视 Giraph 如何并行化大型图的处理，但目标有所不同。你将看到，只需了解一些并行处理机制的知识，就可以在 Giraph 之上构建更高效的应用程序。例如，本章将讨论如何通过工作节点计算的概念来利用顶点到工作节点的分布。具体来说，你将学习如何使用每工作节点计算来增强以顶点为中心的算法，这些计算允许你在物理上位于同一工作节点上的顶点之间共享数据和计算。你将在几个场景中看到，共享数据和计算可以帮助你增加新功能或显著提高应用程序的性能。\n\
  \n本章还将讨论图划分，即顶点在不同工作节点之间的放置。简单的示例描述了不同的图划分策略可能对应用程序性能产生的影响。然后你将学习不同的图挖掘场景如何从不同的划分策略中受益。最后，你将学习如何通过实现自定义分区器来控制图划分以使其对你有益。\n\
  \n## 工作节点计算\n\n正如你在第 6 章中所了解的，Giraph 将图分割成多个分区，并将分区分配给集群机器或工作节点。这使得 Giraph 能够通过将分区分配给不同的工作节点，甚至可能将不同的分区分配给同一工作节点内的不同\
  \ CPU 核心来实现图的并行处理。更具体地说，每个工作节点或核心负责为该工作节点或核心上的所有顶点调用 `compute` 函数。到目前为止，很好的一点是，作为程序员，你无需担心图在底层是如何划分的，以及\
  \ Giraph 如何处理每个分区；你只需要抽象地思考图和算法，将其视为带有边的顶点以及顶点计算即可。\n\n然而，在本节中，你将发现有时了解分区和工作节点分布这一概念可以帮助你构建更好的应用程序。具体来说，你将学习到一些算法可能不仅受益于以顶点为单位的计算，还可能受益于以工作节点为单位的计算。你将首次执行不属于\
  \ Giraph 典型以顶点为中心思维的运算。在这里，你将回顾一些常见的用例，并学习如何利用划分的概念，以便为你的应用程序添加功能或使其更高效。\n\n\n\n\
  ### 用例：在工作线程间共享数据\n\n每个工作线程的独立计算中最常见的应用场景之一，就是需要在同一个工作线程的所有顶点间共享某种数据结构。通常情况下，顶点计算内部的编程逻辑需要访问数据，这些数据可能来自某个外部服务（例如分布式存储系统），并且对所有顶点都是通用的。\n\
  \n为了更具体地说明，假设你要处理图 9-1 中熟悉的 Twitter 关系图，统计每个用户拥有的男性或女性粉丝数量。\n\n![A978-1-4842-1251-6_9_Fig1_HTML.jpg](img/A978-1-4842-1251-6_9_Fig1_HTML.jpg)\n\
  \n**图 9-1.** 一个 Twitter 关系图示例\n\n事实上，在第 3 章中你已经见过该算法简化版本的伪代码，它仅统计 Twitter 粉丝数。在介绍更复杂的算法之前，我们通过代码清单\
  \ 9-1 来看看这个简化版应用在实际代码中是什么样子。\n\n**代码清单 9-1.** 统计 Twitter 粉丝数的算法\n\n```\npublic static\
