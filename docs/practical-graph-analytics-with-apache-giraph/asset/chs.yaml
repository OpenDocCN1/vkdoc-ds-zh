- '# 1. Giraph 简介


  本章涵盖


  - 利用海量图数据获取更深层次的洞察

  - 理解 Giraph 的具体目标与设计宗旨

  - 在 Hadoop 生态系统中定位 Giraph

  - 识别 Giraph 与其他图处理工具之间的差异


  本章将讨论数据驱动决策的重要性，以及如何利用大数据实现这一目标。你将看到如何通过使用海量数据来提升附加价值的示例。你还会了解到 Giraph 如何在众多可用于分析大型数据集的工具中找准自身定位。本章将
  Giraph 置于 Hadoop 生态系统中，并介绍它如何与生态中的其他组件协同工作。此外，本章还会将 Giraph 与图数据库等其他基于图的技术进行对比，解释何时以及为何应该使用每种技术。这是一个入门章节，因此会介绍一些概念和理念，这些内容将在后续章节中更深入地探讨。


  ## 数据，数据，还是数据


  几年前，《纽约时报》发表了一篇关于数据分析的引人入胜的文章。¹ 故事是这样的：一位明尼阿波利斯附近的父亲向塔吉特（Target）的一名员工投诉，抱怨他的未成年女儿收到了与孕期相关的优惠券。“我女儿收到了这个！”他指着打印出来的优惠券说，“她还在上高中，你们就给她寄婴儿服和婴儿床的优惠券？你们是想鼓励她怀孕吗？”塔吉特的代表道歉了，几天后又给这位父亲打电话进一步道歉——但对话却出现了意想不到的转折。“我和女儿谈过了，”这位父亲说，“原来我家里发生了一些我完全没察觉到的事情。她八月份预产期。我应该向你道歉。”


  与其它零售商一样，塔吉特为每位顾客分配一个唯一 ID（例如信用卡号），并利用这些 ID 记录顾客在实体店和网上的购买记录。通过分析这些历史数据，企业能够对顾客及其购物行为进行画像。他们能识别出的事情之一就是怀孕。不仅如此，他们还能在很小的误差范围内估算出预产期。显然，润肤露是个不错的指标；很多人都会买润肤露，但孕妇往往会在孕中期购买大量无香型润肤露。此外，在孕早期，她们会购买钙、镁、锌等补充剂。这些产品本身并非孕期专用，但消费量的突然激增，再加上其他产品（如洗手液和毛巾）的购买行为，就成了怀孕和临近预产期的信号。塔吉特的统计学家通过分析顾客的购买记录，发现了这些模式。


  很可能在不久的将来，当你穿梭于商店和购物中心时，你的手机就会收到符合你当前需求和喜好的优惠通知，比如你一直想要的那双鞋，或者快用完的意大利面。但购买数据只是可用于深入了解顾客行为的数据示例之一。我们周围的新设备和传感器，让我们能够以越来越高的精度测量和记录周围的世界。正如马克·维瑟所说：“最深远的技术是那些消失的技术。它们将自己编织进日常生活的布匹中，直到与之难以区分。”²
  现在，或许该让我们那些无处不在的计算设备——带着它们的互联网连接和全套传感器——融入日常生活的布匹中了。当这一切发生时，我们将面临前所未有的海量数据需要管理。为了让这些技术能够有效地融入并“消失”，管理它们所产生数据的基础设施也必须随之演进。


  这些技术所提供的能力深刻地、广泛地影响着我们，包括我们沟通和社交的方式。我们联系和分享得越多，就越会去做。如图 1-1 所示，2011 年全球创建和共享的数据总量（从文档到图片再到推文）达到了
  2 泽字节³，大约是 2005 年的九倍；而 2015 年的预测数据量是 8 泽字节。这些数据包括社交行为、金融、天气、生物学等方面的信息。它不仅在科学领域有价值，而且企业也可以有效地利用它来了解客户并提供更好的服务。


