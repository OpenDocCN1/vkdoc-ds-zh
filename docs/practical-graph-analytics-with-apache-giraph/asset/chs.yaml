  \ CPU 的压力，使其不得不频繁地序列化和反序列化对象，但通常其优势是值得付出代价的。\n\n### 随机访问友好的出边\n\n如前所述，`HashMapEdges`支持高效的边值查找，但为此会为每条边生成大量对象。在字节数组中支持随机查找需要额外的复杂性，例如对边进行排序并执行二分查找，或每次查找时执行线性查找。此外，前一种方法仅在假设边值大小固定的情况下才可行，但在\
  \ Giraph 应用中情况并非总是如此。本节讨论的另一种方法是使用原始类型的哈希映射。开源项目 fastutil\\¹为常见的 Java 集合数据结构（如映射、集合、列表等）提供了快速且紧凑的类型特定实现。与使用原生\
  \ Java 对象不同，这些数据结构通过预处理器自动生成，适用于不同 Java 原始类型的组合。例如，它提供了一个`Int2ByteMap`接口，该接口扩展了\
