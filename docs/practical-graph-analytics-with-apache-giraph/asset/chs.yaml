  \ final ConcurrentMap<Integer, ConcurrentMap<I, T>> map; #1\n\n    /** Giraph configuration\
  \ */\n    protected final ImmutableClassesGiraphConfiguration<I, ?, ?> config;\n\
  \n    /**\n     * Constructor\n     *\n     * @param messageValueFactory Message\
  \ class held in the store\n     * @param service Service worker\n     */\n    //\
  \ ... 后续代码未列出\n}\n```\n\n\n\n### `SimpleMessageStore` 类\n\n```\n/**\n * @param config\
  \ Giraph 配置\n */\npublic SimpleMessageStore(\n    MessageValueFactory<M> messageValueFactory,\n\
  \    CentralizedServiceWorker<I, ?, ?> service,\n    ImmutableClassesGiraphConfiguration<I,\
