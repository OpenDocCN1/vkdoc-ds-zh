  \ 方法首先获取内部的按分区映射，然后获取顶点消息，接着依赖 `getMessagesAsIterable()` 方法将消息打包成一个可迭代对象，该对象会与顶点一起传递给计算\
  \ `compute` 方法。其次，你可能已经注意到，`getMessagesAsIterable()` 的实现并未提供。这正是因为，取决于存储方式，对于给定的顶点，你可能在字节数组中有一个序列化的消息列表，或者当涉及合并器时，你仅有一条单一消息。你需要让实现者进一步处理这个方面。\n\
  \n让我们看看后一种情况。清单 11-4 展示了 `OneMessagePerVertexStore` 的部分实现，如前所述，它通过合并器为每个顶点仅存储一条消息。\n\
