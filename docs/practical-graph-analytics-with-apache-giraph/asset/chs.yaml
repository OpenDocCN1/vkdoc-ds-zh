  \n\n\n## 输入格式\n\n无论采用何种表示形式，图都可以存储在不同的存储系统中，并且可能以不同格式分布。Giraph 提供了一种称为\"输入格式\"的工具，用于简化读取输入图的任务。输入格式的实现本质上是一种指定如何从存储系统读取数据，然后将数据转换为熟悉的`Vertex`和`Edge`对象的方式。Giraph\
  \ 提供了一个简单的 API，你可以通过实现该 API 来支持新型存储系统和格式。而 Giraph 则负责为你完成繁重的工作。\n\n基于顶点的图表示的 Giraph\
  \ API 是`VertexInputFormat`，基于边的图表示的 API 是`EdgeInputFormat`。这些是你扩展以实现新输入格式的最基本的抽象类。Giraph\
  \ 还提供了更专门的 API，用于支持常见的存储系统和格式；例如，一种常见格式是存储在 Hadoop 分布式文件系统（HDFS）或 HBase 表上的邻接列表文本文件。\n\
  \n通常，你可以扩展基本 API 来编写适合自己应用场景的自定义输入格式实现，也可以扩展现有的专用 API。在许多情况下，你无需从头实现输入格式；Giraph\
  \ 提供的现有实现很可能已经满足你的需求。\n\n> **提示：** 在创建自己的输入输出格式实现之前，建议先查看可用的实现。Giraph 的代码库在不断丰富，你可能会在那里找到所需内容，从而节省时间。\n\
