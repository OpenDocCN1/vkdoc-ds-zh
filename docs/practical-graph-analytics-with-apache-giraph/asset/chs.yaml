  \ 的`Int2ObjectOpenHashMap`类，因为键是整数分区 ID，值是内部映射对象（本例中为`Int2FloatOpenHashMap`对象），用于将顶点\
  \ ID 映射到消息。该类中`addPartitionMessages()`和`getVertexMessages()`方法的工作方式与之前两个类类似。然而这次无法复用`SimpleMessageStore`类的代码，因为所有功能都针对特定的原始类型进行了定制。最后要说明的是如何指定用作消息存储的类。与其他类一样，消息存储类通过\
  \ Giraph 参数指定。具体来说，必须使用`giraph.messageStoreFactoryClass`参数来指定一个生成`MessageStore`实现的工厂类。工厂类的示例随\
  \ Giraph 源代码中的消息存储一起提供；感兴趣的读者可查阅源代码了解工厂实现的示例。\n\n\n\n## 内存外溢\n\n本书多次强调，`Giraph`\
  \ 专为在内存中计算图算法而设计，这也是其能够在海量图上实现如此快速计算的关键因素。然而，这也可能是 `Giraph` 的弱点，因为有时数据量过大，工作节点可能会耗尽内存。在前面的章节中，您已经了解到\
  \ `Giraph` 如何实现一些巧妙的技巧来最小化内存占用，以及如何定制您的数据结构以进一步减少内存使用。然而，有时所有这些努力仍可能不够。在这种情况下，您可以尝试\
  \ `Giraph` 将过量数据溢出到磁盘的功能。请记住，此功能应被视为最后的手段，因为过度使用可能会显著降低性能。\n\n`Giraph` 可以在每个超步的计算过程中，将消息和图（包括拓扑结构、顶点和边的值）都存储到本地磁盘。`Giraph`\
  \ 能够使用磁盘这一事实并不意味着它变成了一个数据库。其对磁盘的访问不应被视为持久化层，而更像是操作系统中的交换分区。它将主存中无法容纳的、过多的状态和图数据溢出到磁盘，以完成计算。换句话说，从用户的角度来看，启用或禁用内存外溢功能运行\
  \ `Giraph` 并无区别，除了可能影响性能。用户唯一需要做的是选择溢出哪些内容：是消息、图、还是两者都溢出，以及溢出的程度。本节将简要描述此功能的工作原理，以便您做出选择并找到最适合您应用的方式。\n\
  \n### 内存外溢图\n\n每个工作节点将其分配的顶点存储在所谓的分区内。一个分区内包含了分配给该分区的所有顶点及其边。在一个超步期间，工作节点会逐个处理分区，或者在使用多个计算线程时并行处理多个分区。在分区内部，顶点会逐个处理。内存外溢图功能（简称\
  \ OOCG）允许工作节点仅在内存中保留用户指定数量的分区，而其余分区则存储在本地磁盘上。当工作节点处理完所有当前位于内存中的分区后，它会将一些已处理的分区溢出到磁盘，以便将未处理的分区从磁盘加载到内存中。工作节点不会开始溢出或加载任何一个顶点，直到该顶点所属的分区被完全处理。这意味着\
  \ OOCG 工作在分区级别粒度上。没有任何单个顶点（或边）会被单独从磁盘溢出或加载。\n\n当 OOCG 默认激活时，`Giraph` 会在内存中保留 N 个分区，其中一部分被视为粘性分区，通常定义为\
  \ N - k（这里 N 是始终保持在内存中的分区数量，k 是计算线程或输入线程的数量）。粘性分区是永远不会被交换到磁盘的分区。在使用 k 个计算线程时，您希望保留至少\
  \ k 个非粘性分区，这样每个计算线程都可以将一个分区与一个未处理的分区进行交换，而无需等待。默认情况下，哪些分区是粘性的会在计算开始时随机选择，并且不会改变。由于在大多数图算法中，所有分区在每个超步都需要被处理（但不一定是其中的所有顶点）；始终在内存中保留一定数量的粘性分区可以最大限度地减少交换次数。\n\
  \n然而，您的分区算法可能允许将图分割成这样的方式：只有某些分区包含需要处理的活跃顶点，而其他分区在某些超步中可以忽略。针对这些情况，`Giraph` 也可以忽略粘性分区，并在选择哪个分区交换到磁盘以为新分区腾出空间时，使用最近最少使用（LRU）策略。在这种设置下，分区存储实际上像一个缓存一样工作。您可以通过\
  \ `Giraph` 的参数 `giraph.useOutOfCoreGraph` 来激活 OOCG，通过参数 `giraph.maxPartitionsInMemory`\
  \ 来定义内存中保留的分区数量，并且可以通过 `giraph.stickyPartitions` 参数覆盖粘性分区的自动设置。\n\nOOCG 的工作原理很简单。当存储在本地磁盘时，每个分区保存在两个文件中，一个用于顶点，一个用于边。顶点文件的布局是：在一段简短的头信息之后，是通过\
  \ `Writable` 接口逐个序列化的顶点序列。类似地，边文件是按照源顶点分组的边序列。将分区溢出到磁盘是 IO 高效的，因为这是对这两个文件进行顺序写入，不涉及读取或寻道操作，从而最大限度地利用了\
  \ IO 磁盘带宽。同样，从磁盘读取分区也是顺序读取这两个相同的文件，并通过 `Writable` 接口定义的方法再次解析它们。将顶点和边分别存储在两个不同文件中的原因是为了在可能的情况下最小化\
  \ IO。许多算法作用于静态图，例如 PageRank、SSSP、连通分量等。静态图意味着边和顶点不会被添加或删除，并且边值（例如权重）不会改变。根据这个定义，标签传播算法和随机梯度下降算法（均在第\
  \ 4 章中描述）并不操作静态图，因为它们会改变边值。由于在计算过程中只有顶点值会发生变化，`Giraph` 可以在分区首次被交换到磁盘时，将顶点和边都溢出到本地磁盘。之后再次交换时，只需要将有变化的元素，即顶点值，写入磁盘。当分区被读回内存时，会使用首次写入的边和最近一次写入的顶点。考虑到边是图中最庞大的部分，这节省了大量的写入\
  \ IO。用户可以通过 `giraph.isStaticGraph` 参数来指定其算法是否作用于静态图。\n\n最后，您可以使用 `giraph.partitionsDirectory`\
  \ 参数指定本地磁盘上用于存储内存外溢分区的目录。该参数接受一个以逗号分隔的目录列表。如果有多个磁盘可用，最好在每个磁盘上指定一个目录。OOCG 将分区分布在多个磁盘上，当计算线程将分区从内存交换到磁盘时，它们会并行地进行\
  \ IO 操作以实现更快的数据传输，从而最大化吞吐量。\n\n\n\n### 核外消息\n\n您已经了解到，Giraph 将传入消息存储在称为消息存储的收件箱中，每个工作节点对应一个。如果消息存储中的消息数量超过了堆能管理的上限，工作节点就会内存溢出。为此，Giraph\
  \ 允许您设置一个阈值，限制在消息开始写入磁盘之前，内存中最多能存储多少条消息。每当消息存储达到其最大容量时，其内容就会被写入磁盘上的一个文件，并创建一个新的空消息存储来容纳新的传入消息。\n\
  \n更准确地说，核外消息（或 `OOCM`）的工作方式如下。首先，当 `OOCM` 激活时，计算线程会按照顶点 ID 决定的排序顺序处理顶点。其次，当消息存储在达到给定阈值后被写入磁盘时，消息会按照目标顶点\
  \ ID 排序后依次存储。自然产生的结果是，文件中按目标顶点 ID 将消息分组在一起，因为排序导致发往同一顶点的所有消息被连续写入。消息在内存中排序后，会以顺序操作的方式非常高效地写入磁盘。第三，由于在一个超步中消息会在不同时间到达，发往特定顶点的消息会分散在多个文件中。这三个要素使得\
  \ `OOCM` 无需索引或文件内寻道操作即可从磁盘提供消息。换句话说，它们是通过顺序读取来扫描的。\n\n当一个超步开始且消息存储被打开用于读取时，存储会在每个文件的起始位置设置一个游标。当请求某个特定顶点的消息时，消息存储会检查所有游标，看它们是否指向发往该顶点的消息。如果某个游标确实指向此类消息，则用它从文件中读取消息（实际上是在消费消息时进行流式处理）。请注意，作为读取的副作用，游标会自动前进到下一组消息。如果游标指向的消息是发往不同顶点的，则可以完全跳过该文件对当前顶点的处理。事实上，如果文件包含该顶点的消息，那么这些消息当前应该正被游标指向。这是必要条件，因为消息是按超步处理顺序排序存储的。假设顶点（和消息）是按升序存储的，如果某个游标没有指向给定顶点的消息，那么它一定指向发往一个更大\
  \ ID 且仍需处理的顶点的消息。注意，消息存储对指向当前内存中已排序消息的游标执行相同的操作。只要消息是排序的，这些操作对消息的存储位置是透明的。图 11-1\
  \ 展示了为顶点 v4 读取数据时 `OOCM` 的布局。\n\n![A978-1-4842-1251-6_11_Fig1_HTML.jpg](img/A978-1-4842-1251-6_11_Fig1_HTML.jpg)\n\
  \n*图 11-1. 核外消息为顶点 v4 读取数据*\n\n这种技术非常高效，因为它仅基于对磁盘的顺序写入和读取，因此 IO 效率很高。然而，它需要定期对部分消息进行（内存中的）排序，然后再写入磁盘，如果需要写入磁盘的消息很多，这将会非常昂贵。此外，使用较低的阈值会迫使\
  \ Giraph 生成许多小文件。虽然每个文件内的读取在逻辑上是顺序的，但磁盘必须物理地寻道到不同区域来读取每个游标指向的内容。因此，应该在高阈值下使用 `OOCM`，而不是在内存极度紧缺的情况下（在这种情况下，应使用更可预测的\
  \ `OOCG`）。`OOCM` 通过 `giraph.useOutOfCoreMessages` 参数激活，阈值通过 `giraph.maxMessagesInMemory`\
  \ 参数设置。用于存储消息的本地磁盘目录列表通过 `giraph.messagesDirectory` 参数设置。与 `OOCG` 一样，`OOCM` 也可以利用多个磁盘来并行化磁盘\
  \ IO。\n\n\n\n## Giraph 参数\n\nGiraph 是一个大型系统，与任何足够大的系统一样，它拥有大量影响其行为和性能的参数。要精确地定义某些参数如何对所有应用表征系统的行为和性能是很困难的。更复杂的是，要描述多个参数如何相互影响则更加困难。以下是一份参数列表，并附有关于其作用的说明。其中一些参数很简单；另一些，比如线程数和缓冲区大小，则取决于你的应用程序、图、集群和设置。正如本章开头所述，你需要亲自衡量不同取值对你的应用产生的影响。通过本节内容，你应该能在这方面的探索中得到指引。\n\
  \n*   `giraph.useBigDataIOForMessages=[true|false], 默认 false`：`BigDataIO` 是一组类，通过将多个字节数组包装在一起，可以突破\
  \ Java 对字节数组大小的限制。当某些顶点预计会接收到大量消息时，可以使用它。\n*   `giraph.jmap.histo.enable=[true|false],\
  \ 默认 false`：启用此参数后，你要求 JVM 打印工作进程中的对象直方图，甚至可能打印到远程控制器。这对于了解你的内存用在了哪里（即哪些对象使用了内存且应进行优化）非常方便。\n\
  *   `giraph.metrics.enable=[true|false], 默认 false`：启用此参数后，你要求 Giraph 打印额外的度量信息，例如每个工作进程将大部分时间花在哪里。例如，你可以测量每个超步和每个工作进程在计算顶点、服务消息等方面所花费的时间。\n\
  *   `giraph.oneToAllMsgSending=[true|false], 默认 false`：如果激活此参数，你告诉 Giraph 每个顶点向所有邻居发送相同的消息。例如，PageRank\
  \ 就是这种情况，但加权 SSSP 不是，因为其消息依赖于每条边的权重。一旦 Giraph 知道这一点，它就可以进行某些优化，以最大限度地减少存储在内存中的消息数量。\n\
  *   `giraph.numInputThreads=整数, 默认 1`：可以并发读取输入分片以加快图加载速度。\n*   `giraph.numOutputThreads=整数,\
  \ 默认 1`：可以使用多个线程遍历顶点并在计算结束时输出结果。\n*   `giraph.nettyClientThreads=整数, 默认 4`：客户线程负责将数据从工作进程发送到其他工作进程。当你有大量工作进程时，需要增加线程数。线程数过多会增加开销，而线程数过少则会在缓冲区填满时导致网络利用率不足。\n\
  *   `giraph.nettyServerThreads=整数, 默认 16`：服务线程负责接收来自其他工作进程的数据。当你有大量工作进程时，需要增加线程数。线程数过多会增加开销，而线程数过少则会在缓冲区填满时导致网络利用率不足。\n\
  *   `giraph.serverReceiveBufferSize=整数, 默认 524288`：当你的应用程序发送大量数据时（例如，大量和/或大型消息），需要增大缓冲区大小。这可以避免服务端不断地在小数据块之间进行搬运。\n\
  *   `giraph.clientSendBufferSize=整数, 默认 524288`：与服务端缓冲区类似，当你的应用程序发送大量数据时（例如，大量和/或大型消息），需要增大缓冲区大小。这可以避免服务端不断地在小数据块之间进行搬运。\n\
  \n其中一些参数共同发挥作用。特别是缓冲区大小和线程数密切相关。增大缓冲区大小可以确保 IO 开销被分摊。增加线程数可以确保数据不会在缓冲区中停滞。然而，为大量线程使用大缓冲区会增加堆的使用，存在内存溢出的风险。\n\
  \n## 总结\n\nGiraph 是一个大规模图处理系统，它可以在跨越数百台机器的数千个内核上运行你的代码，且复杂性较低。它的通用性，尽管特定于图算法，仍然为针对每种用例进行优化留下了一些空间。特别是，你已经了解了以下内容：\n\
  \n*   存储在内存中并通过网络发送的数据量可能产生瓶颈或阻碍完成计算的能力\n*   在商用机器上运行时，某些硬件和 Hadoop 集群设置选择更适合大规模图处理\n\
  *   Giraph 使用特定的内存布局来最小化 JVM 中垃圾收集器的影响\n*   根据对边的访问模式，不同的边存储可能更合适\n*   用户可以为边和消息实现基于原始类型的定制数据结构以减少内存占用\n\
  *   必要时，Giraph 可以将过多的数据、图和消息溢出到磁盘\n\n根据应用程序对资源的使用情况，许多参数可以影响其行为和性能。\n\n脚注 1\n\n\
  [`​fastutil.​di.​unimi.​it/​`](http://fastutil.di.unimi.it/)\n\n"
- "# 云中的 Giraph\n\n本章包含：\n\n*   云计算的高级架构概述\n*   对云中图处理提出的特定需求的分析\n*   深入探讨在亚马逊提供的公有云上使用\
  \ Giraph\n\n如你在前几章所学，Giraph 利用 Hadoop 集群作为其主要执行框架，并且可以从多个不同的数据源获取数据，而不仅仅是 HDFS。这使得\
  \ Giraph 应用非常适合在由各种公有和私有云计算平台提供的共享基础设施上运行。利用云计算服务，你可以专注于图处理，而供应商则负责部署和运营可扩展的 Hadoop\
  \ 集群等事务。本章首先概述云计算服务，重点介绍那些最适合让 Giraph 应用尽可能无缝运行的服务。\n\n由于并非所有云计算供应商都提供 Hadoop 集群即服务，我们将简要概述更基础但仍然有用的基础设施虚拟化服务。在需要对\
  \ Giraph 可用的 Hadoop 版本进行精确控制的情况下，这些类型的服务也会派上用场。\n\n尽管当今有大量的公有云提供商，并且私有云实现的生态系统一如既往地强大，但本章主要关注亚马逊网络服务（AWS）。我们专注于\
  \ AWS 有两个原因。首先，它是最流行的公有云之一。最重要的是，在 AWS 上运行图处理作业的经验将使你使用其他公有云和私有云变得更加自然。在 AWS 中，我们将专注于一组称为\
  \ Elastic MapReduce 的 API，它允许你动态地创建任意数量的虚拟服务器，这些服务器对你的 Giraph 应用来说就像一个真正的 Hadoop\
  \ 集群。尽管 Giraph 并非预装，但它仍然是将你的应用从单节点执行扩展到任意数量节点（只要你愿意付费）的最简单方法。安装、配置和管理 Apache Hadoop\
  \ 的所有复杂性都对你隐藏了。\n\n\n\n## 云计算快速入门\n\n试想一下，在贵公司部署任何图处理应用程序所投入的精力。最起码，你需要购买和安装足以满足潜在数据集和处理需求的大量存储和计算硬件。在将这些硬件打造成一个功能完备的\
  \ `Hadoop` 集群之前，你还得花时间和金钱管理电力、冷却和网络。之后，你仍然需要在集群中的每个节点上安装并配置操作系统和 `Hadoop`。只有到那时，你才能开始收集数据并运行\
  \ `Giraph` 应用程序。当然，为了让一切保持运行，你必须监控任何可能出问题的地方（无论是硬件还是软件），并相应地维护集群。简而言之，这意味着大量的前期投入和有限的扩展性。换句话说，当你对数据集大小的需求发生变化时，你仍然受限于同一个集群。\n\
  \n避免这种初始投入和复杂性的一种方法是在云计算环境中运行你的 `Giraph` 应用程序，由他人负责设置和管理所有基础设施。\n\n简单来说，云计算是一系列服务的集合，其核心理念是通过网络以可扩展且灵活的方式提供各种计算、软件和信息资源。云计算的另一个关键方面是自助服务的概念：它允许任何客户根据应用程序需求请求任意数量的资源，而无需任何人工干预。你不再需要等待\
  \ IT 人员在公司数据中心采购和部署物理硬件：只需通过定义明确的 `API` 调用在线请求资源即可。例如，通过几次 `API` 调用，你就可以获得一个可通过网络访问的功能完备的\
  \ `Hadoop` 集群。\n\n### 云计算能提供哪些类型的服务？\n\n云计算供应商提供的所有服务可分为三大类，每一类都建立在前一类的基础之上：\n\n\
  * **基础设施即服务（IaaS）**：提供物理基础设施（如服务器、存储、负载均衡器、网络设备等）虚拟化实例的一系列服务。\n* **平台即服务（PaaS）**：提供构建应用程序所需的基础\
  \ `API` 的一系列服务。例如执行运行时、数据库实例、Web 和应用服务器等。\n* **软件即服务（SaaS）**：通过网络向最终用户提供软件应用程序的一系列服务。应用程序的范围之广可与桌面端软件媲美，但最常见的例子包括电子邮件、通讯、游戏和虚拟桌面。\n\
  \n大多数云服务提供商提供来自这三个类别的组合服务。例如，`Amazon Web Services (AWS)` 既可作为 `IaaS` 使用，让你创建任意规模的虚拟数据中心；也可作为\
  \ `PaaS` 使用，不仅提供裸服务器，还提供可扩展的数据库或 `Hadoop` 集群等。在云端运行 `Giraph` 需要 `IaaS` 能力，但不一定需要\
  \ `PaaS` 或 `SaaS`。然而，`PaaS` 或 `SaaS` 能力的存在，可能为 `Giraph` 分析提供额外的数据源。\n\n云计算通常与公有云关联：即通过公共互联网向任何人提供的服务。然而，云计算敏捷且自助的服务特性，使其正迅速进入企业公司的私有数据中心。过去，企业数据中心被视为运行着各种操作系统的服务器机架。今天，它很可能被视为一种至少提供\
  \ `IaaS` 级别 `API` 的云计算服务。这就是所谓的私有云。\n\n人们可能会认为不同云计算解决方案提供的 `API` 是兼容的，在一个云平台上能做的事情在另一个云平台上也能做。好消息是，在概念上这大致上是成立的（这也是本章只聚焦于\
  \ `AWS` 的原因）。坏消息是，实现同一目标所需的 `API` 集在不同云平台之间是不同的。每个云计算解决方案（公有或私有）通常都附带有软件库和工具，让你能够创建和管理各种资源。\n\
  \n## 亚马逊云服务上的 Giraph\n\n`Amazon Web Services (AWS)` 云平台提供的一项主要服务是 `弹性计算云 (EC2)`。`EC2`\
  \ 允许任何人从静态虚拟机 (`VM`) 镜像中实例化任意数量的虚拟服务器；它可以被视为 `AWS IaaS` 层的基础构建块。这些 `VM` 镜像被称为 `Amazon\
  \ 机器镜像 (AMI)`。通过将虚拟资源（`CPU`、内存、`I/O` 带宽等）与某个 `AMI` 关联，你可以从一个 `AMI` 实例化任意数量的虚拟服务器。这些服务器是自包含的、虚拟化的操作系统，运行在某个\
  \ `AWS` 数据中心内。它们被称为实例。你的账户将根据每小时运行的实例数量以及每个实例所使用的资源量（`CPU`、内存、本地存储、网络带宽等）进行计费。与这些实例交互的唯一方式是通过互联网。例如，你可以决定直接使用\
  \ `SSH` 登录它们，或者在它们上面运行任何类型的网络服务，比如 `HTTP` 等。你需要知道的只是每个实例的公共 IP 地址。\n\n`EC2` 是一个非常简单，同时又极具可扩展性的服务，你可以用它来手动在云端部署\
  \ `Hadoop` 集群。毕竟，一旦 `EC2` 返回与你创建的每个实例相对应的 IP 地址集，你就可以像使用物理主机一样，在其上部署一个 `Hadoop`\
  \ 集群（关于 `Hadoop` 部署提示，请参考附录）。实际上，在 2006 年 `AWS` 刚推出时，自己动手是将实例组织成任何计算集群的唯一方法。\n\n\
  当 `Amazon` 在其 `AWS` 服务组合中引入一个名为 `Elastic MapReduce (EMR)` 的更高级服务时，情况发生了变化。`EMR`\
  \ 是首批更像 `PaaS` 而非 `IaaS` 级别服务运行的服务之一。使用 `EMR`，管理单个主机并将其配置成 `Hadoop` 集群的具体细节对你来说是隐藏的。尽管如此，一个\
  \ `EMR` 集群仍然由一个或多个实例组成，因此可以被视为 `IaaS` 级别的产品。组成 `EMR` 集群的实例源自 `Amazon` 维护的特定 `AMI`。你可以将其视为\
  \ `Amazon` 以 `AMI` 形式打包的自家 `Hadoop` 发行版。该发行版有多个版本可供使用（构建在不同版本的 `Hadoop` 之上）。整个集群的创建和销毁可以作为一个单一操作完成，无需跟踪和管理所有节点。实际上，你甚至可以在运行中向集群添加节点以加速计算或利用\
  \ `Amazon` 的定价模式。\n\n然而，在尝试启动第一个 `EMR` 集群之前，你还需要对环境进行一些预先配置，以便能够与 `AWS` 进行交互。\n\n\
  \n\n### 开始之前\n\n与 AWS 交互的前提是你在亚马逊上拥有一个账户。亚马逊在其《AWS 入门》教程中提供了详细的操作指南。设置好账户后，你便可以登录\
  \ AWS 管理控制台（一个网页应用）、使用命令行工具，并从你的业务应用程序内部直接发起 AWS API 调用。AWS 管理控制台是最便捷的入门方式，因为它为常见操作提供了直观的网页界面。不过，一旦你在亚马逊云中运行的任务越来越多，就会发现自己需要更高程度的自动化和程序化控制能力。一种选择是让你放弃特定语言的\
  \ SDK，直接将 AWS 集群与基础设施管理逻辑嵌入业务应用程序。这提供了对云基础设施使用最精确的控制级别，但代价是需要投入精力协调与 AWS 的所有交互。命令行（CLI）工具在网页\
  \ UI 的临时性和特定语言 SDK 的精确控制之间提供了一个便利的中间地带。尽管存在几种不同版本的 CLI 工具，但在本章剩余部分，你将使用 Amazon AWS\
  \ CLI 的具体实现。\n\n所有与 AWS 的程序化交互都需要用户身份验证。这通过提供两条信息来完成：访问密钥 ID（一串类似`AKIAIOSFODNN7EXAMPLE`的字符）和秘密访问密钥（一串类似`wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY`的字符）。这两条信息都可以在注册过程中（或之后）通过\
  \ Amazon AWS 网页控制台获取。你可以通过环境变量，或者运行`aws configure`命令并在提示符下输入所需信息，来向 AWS CLI 工具提供这两条信息。\n\
  \n如果你尚未在桌面上安装 AWS CLI 工具，请务必阅读并遵循[`docs.aws.amazon.com/cli/latest/userguide/`](http://docs.aws.amazon.com/cli/latest/userguide/)上的说明进行安装。请记住，与本书中的其他内容不同，AWS\
  \ CLI 是用 Python 编程语言实现的，这可能要求你搭建一个 Python 环境。Amazon 用户指南提供了相应的操作说明。一旦 Python 环境就绪，安装\
  \ AWS CLI 就简化为列表 12-1 中概述的几个步骤。\n\n**列表 12-1.** 在 Linux 或 Mac OS 上设置 AWS CLI 工具\n\
  \n```\n$ wget https://s3.amazonaws.com/aws-cli/awscli-bundle.zip   # 下载捆绑包\n$ unzip\
  \ awscli-bundle.zip                                    # 解压捆绑包\n$ ./awscli-bundle/install\
  \ -b ∼/bin/aws                       # 将 AWS CLI 安装到用户主目录\n$ PATH=∼/bin:$PATH  \
  \                                         # 确保 aws CLI 在 PATH 路径中可用\n$ aws configure\
  \                                              # 使用用户凭证配置 AWS CLI\nAWS Access Key\
  \ ID [None]: AKIAIOSFODNN7EXAMPLE\nAWS Secret Access Key [None]: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n\
  Default region name [None]: us-east-1\nDefault output format [None]: json\n$ aws\
  \ ec2 describe-regions                                   # 运行最简单的 EC2 请求，确保一切正常\n\
  ```\n\n在通过`aws configure`命令告知你的访问密钥和秘密密钥，并将默认 AWS 数据中心设置为 US EAST（美国东部）后，你几乎就完成了所有设置和配置，可以开始在亚马逊云上实例化你的第一个集群了。但是，要远程登录到集群的各个节点，你还需要设置一组安全外壳（SSH）密钥对。这是你需要设置的最后一个身份验证信息。可以这样理解：访问密钥\
  \ ID 和秘密访问密钥用于向 AWS 请求服务，而当这些服务为你实例化出虚拟基础设施后，则需要一组 SSH 密钥对来远程登录到该基础设施。SSH 密钥对需要具有唯一的名称。此处我们将它命名为`giraph-keys`。如果你已经有一个同名的\
  \ SSH 密钥对，可以跳过列表 12-2 中的步骤。\n\n**列表 12-2.** 设置一个`giraph-keys` SSH 密钥对\n\n```\n$\
  \ aws ec2 create-key-pair --key-name giraph-keys --query 'KeyMaterial' \\\n  --output\
  \ text > ∼/giraph-keys.pem\n$ chmod 500 ∼/giraph-keys.pem\n$ aws emr create-default-roles\n\
  ```\n\n列表 12-2 中的第一个命令请求创建 SSH 密钥对，并将私钥材料输出到用户主目录下的`giraph-keys.pem`文件中。第二个命令用于确保该文件的权限仅允许文件所有者本人读取，而系统上的其他用户无法读取。这是\
  \ SSH 所期望的默认权限。最后，最后一个命令用于确保用户具有使用 EMR 的权限；每个用户账户只需执行一次此命令。\n\n你可能已经注意到一个常见模式，即如何从命令行执行\
  \ AWS CLI 工具。首先，指定你要操作的亚马逊云 API 子集（例如 EC2、EMR 等），这成为你的主命令。然后，选择你要对该子系统执行的操作（动词）（例如，创建密钥对或列出区域），这成为你的子命令。最后，你可以通过`--flag`选项指定影响操作语义的标志（例如，为你的密钥对命名）。此命令行调用的结果总是\
  \ AWS CLI 代表你发起的一个或几个 AWS API 调用，并返回 JSON 格式的响应。AWS CLI 调用 API 的方式毫无神奇之处；你自己的应用程序也可以通过各种特定语言的\
  \ SDK 发出完全相同的 API 调用。\n\n带着这些理解，让我们开始在你的亚马逊云上创建第一个可运行的 Hadoop 集群吧。令人惊奇的是，所要做的仅仅是执行一次\
  \ AWS CLI 工具而已。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n\
  ### 在亚马逊云上创建你的第一个集群\n\n在亚马逊云上操作 Hadoop 集群所需的大部分操作都由 `emr` 命令提供。你可以运行 `aws emr help`\
  \ 来查看哪些子命令可用。在接下来的章节中，你将会使用到其中的不少命令，但现在，让我们先使用 `create-cluster` 子命令来创建最基本的 Hadoop\
  \ 集群，如代码清单 12-3 所示。请注意，为了便于阅读，我们再次使用了反斜杠字符来断开冗长的单行命令。\n\n**代码清单 12-3.** 在亚马逊云上创建你的第一个集群\n\
  \n```\n$ aws emr create-cluster   \\\n--ami-version 2.4.11         \\\n--instance-groups\
  \             \\\nInstanceGroupType=MASTER,InstanceCount=1,InstanceType=m3.xlarge\
  \       \\\nInstanceGroupType=CORE,InstanceCount=2,InstanceType=m3.xlarge      \
  \      \\\n--no-auto-terminate                                                 \
  \   \\\n--ec2-attributes KeyName=giraph-keys\n{\n    \"ClusterId\": \"j-DEADBEEF\"\
  \n}\n```\n\n恭喜！你刚刚在亚马逊云上实例化了你的第一个集群。该集群由一个 `MASTER` 节点和两个 `CORE` 节点组成（总共三个节点）；它能够运行\
  \ MapReduce 作业。你用来创建集群的命令虽然很长，但含义非常清晰。你需要调用 `aws` 的 `emr` 子命令，并给它一个动词 `create-cluster`\
  \ 来要求创建一个集群。该操作要求你指定想要使用的 Hadoop 版本（`--ami-version 2.4.11`），然后是集群的拓扑结构（`--instance-groups`），描述每个节点的角色、分配给特定角色的节点总数，以及与每个节点关联的\
  \ AWS 实例类型。你还要求不立即终止集群（`--no-auto-terminate`），并提供了一个密钥对，以便稍后可以登录集群（`--ec2-attributes\
  \ KeyName=giraph-keys`）。这是你需要提供给 `AWS EMR` 以创建集群的最少信息量。运行此命令的结果是以 JSON 格式输出的一个集群\
  \ ID（`j-DEADBEAF`）。请留意这个集群 ID，本章中你还会在其他地方用到它。\n\n现在，Hadoop 集群已在亚马逊云中启动并运行，你能用它做什么呢？如果此时你无需再做其他事情就能运行\
  \ Giraph 应用程序，那就太棒了。不幸的是，Amazon EMR 集群默认不会像捆绑 Apache Hive、Pig 和其他 Hadoop 生态系统项目那样预装\
  \ Giraph 组件。在继续让 Giraph 在集群上可用之前，让我们先确保至少可以在上面运行一个简单的 MapReduce 作业。\n\n你将在新创建的集群上启动测试\
  \ MapReduce 作业的方式很简单：登录到它的网关节点，并使用预装的 `hadoop` 命令行工具来启动一个 Pi 作业（Hadoop 对 MapReduce\
  \ 中 HelloWorld 的回应），如代码清单 12-4 所示。请注意，设置集群可能需要相当长的时间。因此，第一个命令可能需要几分钟才能让你登录集群，因为需要等待集群完全上线。\n\
  \n**代码清单 12-4.** 登录到 EMR 集群的网关节点并运行一个 Pi MapReduce 作业\n\n```\n$ aws emr ssh    \
  \                                \\\n--cluster-id j-DEADBEEF                  \\\
  \n--key-pair-file ∼/giraph-keys.pem\nWaiting for the cluster to start.\nssh -i ∼/giraph-keys.pem\
  \ hadoop@ec2-54-82-189-117.compute-1.amazonaws.com\n% hostname    # 打印主机名以确保我们确实在云中了\n\
  ip-172-31-51-237.ec2.internal\n% hadoop jar hadoop-*examples.jar pi 10 100   # 运行一个测试作业\n\
  ...\nEstimated value of Pi is 3.14800000000000000000\n% exit # 退出集群，返回我们的工作站\n```\n\
  \n这里你所做的是使用了 EMR API 集合中的 `ssh` 操作。你提供了代码清单 12-3 输出中的集群 ID（`--cluster-id`），以及你最初创建集群时使用的同一个密钥对（`--key-pair-file`）。运行此命令的结果是一个常规的\
  \ SSH 会话，它为你提供了一个集群网关节点上的 shell。所有以 `%` 为前缀的命令此时都在远程网关节点的 shell 中执行。你在网关上运行的第一个命令是打印其\
  \ `hostname`，以确保你确实在云端。之后，你使用 `hadoop` 命令行工具运行了 Pi 计算作业，并收到了预期的（尽管有些不精确的）结果。这个集群看起来和用起来都像一个真正的\
  \ Hadoop 集群。你做的最后一件事是使用 `exit` 命令退出网关节点，返回到你的工作站。\n\n请记住，此时你在亚马逊云上运行着三个节点。即使它们没有执行任何有用的工作，亚马逊仍然会向你收费。一旦你完成实验，请务销毁你的集群，并检查是否有残留的节点在运行，如代码清单\
  \ 12-5 所示。\n\n**代码清单 12-5.** 查找残留集群并终止它们\n\n```\n$ aws emr list-clusters\n$ aws\
  \ emr terminate-clusters --cluster-id j-DEADBEAF\n```\n\n第一个命令会输出一个非常详细的 JSON，描述了亚马逊正在或曾经为你维护的所有集群。你需要查找那些状态未列为\
  \ `TERMINATED` 的集群，并使用 `terminate-clusters` 操作来终止它们。\n\n\n\n### EMR 集群的基本构建块\n\n\
  在亚马逊云上执行的大多数操作都可以分解为对虚拟服务器的操作。这些虚拟服务器被称为`实例`，对于亚马逊云的用户而言，它们与实际服务器机架并无区别。与任何真实服务器一样，`实例`运行着一个操作系统的副本，你可以通过远程\
  \ shell 登录到该操作系统（通过 SSH），或者与运行在这些虚拟服务器上的其他软件服务（如 Web 或数据库服务）进行交互。然而，与真实服务器不同的是，只要你愿意付费，你可以创建任意数量的实例。\n\
  \n在亚马逊云上运行的每一个`实例`都由以下部分定义：\n\n*   一个完整配置的操作系统镜像。这被称为 Amazon 机器镜像（`AMI`），本质上包含一个操作系统从中启动的磁盘驱动器的内容。\n\
  *   物理资源的数量（例如，CPU 数量、RAM 和磁盘大小）。\n\n如今，亚马逊云上有成千上万种包含各种操作系统的 AMI。有些由操作系统供应商维护，有些由志愿者维护。有些是免费的（如基于\
  \ Linux 的镜像），有些则需要付费使用（如基于 Microsoft Windows 的镜像）。如果你找不到合适的`AMI`，亚马逊会提供所有必要工具供你自行维护\
  \ AMI。如果你在寻找喜欢的操作系统镜像，可以访问 Cloud Market 网站[`http://thecloudmarket.com`](http://thecloudmarket.com/)。请记住，选择运行哪个\
  \ AMI 的决定与分配给它的资源数量是相互独立的。\n\n虽然亚马逊云不允许你为`实例`指定任意数量的资源，但你可以从一组预选的模板中进行选择。这些模板被称为`实例类型`。亚马逊在[`http://aws.amazon.com/ec2/instance-types/`](http://aws.amazon.com/ec2/instance-types/)提供了分配给每种`实例类型`的不同类型资源的详细概述。如果你想了解运行不同`实例类型`的计费影响，这也是一个值得访问的页面。\n\
  \n为了便于管理操作，实例可以分组为称为`预留`（或`实例组`）的块。一个组内的所有实例在所使用的镜像（`AMI` 规格）以及分配给组内每个实例的资源数量（`实例类型`）方面都是相同的。这使得向亚马逊云指示始终维护一定数量的相同服务器变得简单。无论你在一个`预留`中请求一个实例还是一百个，你都是在创建一个组。\n\
  \n这些是亚马逊 IaaS 层为你提供的基本构建块。通过使用它们，你可以选择不自行搭建 Hadoop 集群，或者请求亚马逊服务为你完成这项工作。\n\n###\
  \ EMR 集群的组成：实例组\n\n基于`实例组`的基本概念，一个 Amazon EMR 集群由属于三个不同`实例组`的若干节点组成。\n\n*   `MASTER`\
  \ 实例组。该实例组始终只包含一个节点，该节点配置为运行 Hadoop 集群的所有集中式服务：HDFS `NameNode`、YARN `ResourceManager`\
  \ 或 MapReduce `JobTracker`。它被配置为网关，以便你可以通过使用 `aws emr ssh` 操作手动启动临时的 MapReduce 或\
  \ YARN 作业。亚马逊还确保客户端捆绑软件（如 Hive、Pig 等）默认可用。不幸的是，Giraph 不在此列表之列，需要单独安装在此节点上。如果你运行的是一个单节点集群，该节点必须属于此组。它还将运行来自`CORE`实例组的所有服务。\n\
  *   `CORE` 实例组。该实例组包含一个或多个作为 Hadoop 从节点的节点。此组中每个节点运行的两个基本服务是 HDFS `DataNode`（用于存储数据）和\
  \ YARN `NodeManager`/MapReduce `TaskTracker`。此组中的节点执行所有数据处理。无论何时你想加快计算速度，都可以动态地向此组添加节点，但无法动态地移除它们。\n\
  *   `TASK` 实例组。该实例组是可选的，包含的节点功能与`CORE`实例组中的节点几乎完全相同，但有一个例外：它们不运行 HDFS `DataNode`\
  \ 服务，因此无法在本地处理数据（数据始终需要从外部位置获取）。由于此实例组中的节点是完全临时的（它们不存储 HDFS 块），你可以增加或减少此组中的节点数量。当处理通常驻留在外部存储库（例如\
  \ Amazon Simple Storage Service (S3)）中的数据时，或者当你希望使用竞价型实例来降低运营成本时，此实例组非常方便。\n\n综合来看，你现在可以理解\
  \ `aws emr create-cluster` 子命令给出的前两个选项的含义了（此处重复列出，见清单 [12-6]）。\n\n**清单 12-6.** 在亚马逊云上创建你的第一个集群\n\
  \n```\n$ aws emr create-cluster\n--ami-version 2.4.11\n--instance-groups\nInstanceGroupType=MASTER,InstanceCount=1,InstanceType=m3.xlarge\n\
  InstanceGroupType=CORE,InstanceCount=2,InstanceType=m3.xlarge\n```\n\n第一个选项（`--ami-version`）指定了用于在三个组中启动实例的\
  \ AMI。这是一种间接指定，因为你实际上引用的是亚马逊维护的 EMR 堆栈的版本，而不是 AMI ID。你可以将其视为任何其他 Hadoop 发行版：你只能选择发行版本身的版本。无法选择该发行版中\
  \ Apache Hadoop 及其生态系统组件的版本。如果你想知道哪些版本的 Amazon EMR 堆栈对应哪些组件，可以访问网页 [`http://docs.aws.amazon.com/ElasticMapReduce/latest/DeveloperGuide/ami-versions-supported.html`](http://docs.aws.amazon.com/ElasticMapReduce/latest/DeveloperGuide/ami-versions-supported.html)。你在示例中使用的版本对应于基于\
  \ Hadoop 1.0.x 的堆栈。必须指出的是，亚马逊作为给定 Hadoop 堆栈的一部分为你维护的 AMI 毫无神秘之处。你可以创建该 AMI 的实例，就像创建具有任意操作系统的任何其他\
  \ AMI 的实例一样。\n\n你提供给 `create-cluster` 命令的第二个选项（`--instance-groups`）是对每个实例组大小和类型的精确说明。它由一组、两组或三组键值对列表组成，描述了你要添加到集群的三个实例组中的每一个（MASTER\
  \ 是唯一必需的组）。以下键是必需的。\n\n*   `InstanceGroupType` 定义实例组。此处的值为 `MASTER`、`CORE` 或 `TASK`。\n\
  *   `InstanceCount` 定义组中的实例（节点）数量。\n*   `InstanceType` 指定组中每个节点获得的实例类型（分配给每个节点的资源量）。此处的值是\
  \ AWS 可识别的任何有效实例类型说明。\n\n你创建的集群的图形表示如图 [12-1] 所示。\n\n![A978-1-4842-1251-6_12_Fig1_HTML.jpg](img/A978-1-4842-1251-6_12_Fig1_HTML.jpg)\n\
  \n**图 12-1.** 由两个实例组和三个节点组成的集群\n\n图 [12-1] 中的白色方框代表一个 AMI 模板，实际实例由此模板派生并放置到请求的实例组中：一个放入`MASTER`实例组，两个放入`CORE`实例组。\n\
  \n\n\n### 将 Giraph 应用部署到 EMR 集群\n\n如前所述，Amazon 并未将 Giraph 纳入其 Hadoop 发行版。如果未来有所改变（Amazon\
  \ 以倾听客户需求著称），那当然很好，但鉴于 Giraph 主要是一个框架，而非应用，这倒也不算太严重的问题。\n\n从 Hadoop 集群的角度来看，任何基于\
  \ Giraph 构建的图处理应用看起来都像一个自定义的 MapReduce 或 YARN 作业。考虑到这一点，让我们创建一个 JAR 包，它包含第 5 章中的一个示例应用，并同时打包\
  \ Giraph 及其所有依赖项。使用 Maven 可以很轻松地做到这一点。你只需告诉 Maven 创建一个 `jar-with-dependencies` 构件包，如清单\
  \ 12-7 所示（请确保先回到你在清单 5-4 中为示例应用创建的文件夹）。\n\n**清单 12-7.** 将 Giraph 应用部署到 EMR 集群\n\n\
  ```\n$ mvn clean compile assembly:assembly -DdescriptorId=jar-with-dependencies\n\
  ```\n\n```\n$ aws emr put --cluster-id j-DEADBEEF --key-pair-file ∼/giraph-keys.pem\
  \  \\\n  --src target/*jar-with-dependencies.jar\n```\n\n第一条命令指示 Maven 构建一个自包含的\
  \ JAR 文件，然后你使用 `put` 操作将该文件复制到 EMR 集群的网关节点。和往常一样，你需要指定集群 ID（`--cluster-id`）和密钥对（`--key-pair-file`）以允许访问指定的集群。给\
  \ `put` 操作的额外参数是要复制的 JAR 文件的位置（`--src`）。\n\n此时，你可以使用 `aws emr ssh` 命令登录到 EMR 集群，并像在清单\
  \ 11-3 中执行 Pi 估算作业一样，执行图处理示例。作为替代，我们将考虑将其作为 EMR 集群处理规范中的一个步骤进行远程调度。\n\n### EMR 集群数据处理步骤\n\
  \nEMR 集群最常见的用例是按需创建，只要还有需要执行的数据处理步骤就保持运行，然后让 Amazon 云关闭集群。当然，你也可以请求集群保持运行，等待明确的关闭\
  \ API 调用。这正是你使用 `--no-auto-terminate` 选项时所做的事情。拥有一个可用于交互式操作的集群对于探索 EMR 来说很方便。然而，一旦你开始转向数据管道的完全自动化，让\
  \ Amazon 云管理集群生命周期就变得更加自然。\n\n如果你希望依赖 Amazon 云进行端到端的集群生命周期管理，那么在创建集群时需要向 AWS 传达一些额外的信息：\n\
  \n-   要在 EMR 集群上安装的附加应用集。目前，你可以通过这种方式安装 Hive、Pig、HBase、Ganglia、Impala 和 MapR 发行版。\n\
  -   你想要在实例创建之后、集群启动之前执行的一系列引导操作。这可能包括安装额外的软件、调整集群以及操作系统配置等。简单来说，引导操作是存储在外部可见存储（S3、HTTP\
  \ 等）上的脚本，并在集群节点上运行。\n-   集群启动并运行后，你想要执行的一系列数据处理步骤。目前，这些步骤可以包括以下内容：\n    -   从自包含的\
  \ JAR 包运行自定义的 MapReduce 或 YARN 作业\n    -   在 MASTER 节点上运行自定义脚本\n    -   运行 Hadoop\
  \ Streaming 作业\n    -   运行 Hive、Pig 或 Impala 查询\n\n使用引导操作和数据处理操作的模式非常相似。由于你不需要对集群进行任何特殊的调整，我们将推迟展示引导操作示例，先专注于数据处理步骤。一个有趣的附注是：虽然无法为已经运行的集群请求额外的引导操作，但可以请求额外的数据处理步骤。\n\
  \n使用 AWS CLI 工具时，引导操作和数据处理步骤都需要通过 JSON 规范或简写符号传递给 `aws emr create-cluster` 命令。清单\
  \ 12-8 使用 JSON 规范向一个已运行的集群添加了一个 Giraph 数据处理步骤。\n\n**清单 12-8.** 运行 Giraph 数据处理步骤\n\
  \n```\n$ aws emr add-steps --cluster-id j-DEADBEAF\n```\n\n```\n--steps ’[{\n\"\
  Type\":\"CUSTOM_JAR\",\n\"Name\":\"GiraphApp\",\n\"MainClass\":\"org.apache.giraph.GiraphRunner\"\
  ,\n\"ActionOnFailure\":\"CONTINUE\",\n\"Jar\":\"file:///home/hadoop/book-examples-1.0.0-jar-with-dependencies.jar\"\
  ,\n\"Args\":[\"GiraphHelloWorld\",\n\"-vip\", \"input\",\n\"-vif\", \"org.apache.giraph.io.formats.IntIntNullTextInputFormat\"\
  ,\n\"-w\", \"1\"]}]’\n```\n\n```\n{ \"StepIds\": [\"s-STEPID\"]}\n```\n\n上述命令为立即执行添加了一个处理步骤到由\
  \ `--cluster-id` 标识的已可用集群上。处理步骤的描述是一个格式良好的 JSON 数组，每个条目对应你希望在集群上运行的一个处理步骤。每个条目包含以下键值对：\n\
  \n-   `Type`：定义处理步骤的类型。在这种情况下，你请求通过 Java 执行一个自定义 JAR 包。还有其他类型的步骤可用，包括执行 Pig 或 Hive\
  \ 脚本、Streaming 作业以及其他操作。`CUSTOM_JAR` 类型是最灵活的。\n-   `Name`：一个符号名称，用于在所有未来的输出中标识该处理步骤；可以是任何字符串。\n\
  -   `MainClass`：对于 `CUSTOM_JAR` 类型的步骤；标识入口点类的名称。\n-   `ActionOnFailure`：指定步骤失败时执行的操作。有效值包括\
  \ `CONTINUE`、`TERMINATE_CLUSTER` 和 `CANCEL_AND_WAIT`。\n-   `Jar`：对于 `CUSTOM_JAR`\
  \ 类型的步骤；指定 JAR 文件的位置。\n-   `Args`：对于 `CUSTOM_JAR` 类型的步骤；指定要传递给 main 方法的参数。\n\n命令的输出提供了一个步骤\
  \ ID，如果你想了解该步骤的状态或结果，可以引用它。最后，如果你想知道是否可以避免在命令行中输入冗长的 JSON 规范，答案是肯定的。`--steps` 标志可以从文件读取\
  \ JSON，前提是你要给它一个文件 URL 而不是实际的 JSON，就像这样：`--steps file://./step.json`。\n\n总的来说，向\
  \ EMR 集群添加数据处理步骤非常简单。实际上，你可以在请求创建集群时，通过向 `create-cluster` 操作提供完全相同的 `--steps` JSON\
  \ 规范来指定一系列步骤。这样，你可以让 Amazon 云启动一个集群，运行一系列数据处理步骤，最后关闭集群，从而最大限度地减少你为 EC2 资源付费的时间。本章稍后会尝试这个操作，但现在，让我们看看你的处理步骤是否成功。你可以运行清单\
  \ 12-9 中所示的查询命令，并在 JSON 输出中查找 `State` 键。\n\n**清单 12-9.** 运行 Giraph 数据处理步骤\n\n```\n\
  $ aws emr describe-step --cluster-id j-DEADBEEF --step-id s-STEPID\n```\n\n```\n\
  {\n\"Step\": {\n\"Status\": {\n\"Timeline\": {\n\"EndDateTime\": 1440475780.643,\n\
  \"CreationDateTime\": 1440475759.648,\n\"StartDateTime\": 1440475780.635\n},\n\"\
  State\": \"FAILED\",\n\"StateChangeReason\": {}\n},\n....\n```\n\n信不信由你，数据处理步骤失败了。你现在需要找出失败的原因。\n\
  \n\n\n### 当事情出错时：调试 EMR 集群\n\n当 EMR 集群或它应该处理的作业出现任何问题时，你需要能够追踪问题所在。通常，最好的选择是分析日志文件并尝试推断故障根源。EMR\
  \ 集群有两个可用的日志文件来源：S3 上的聚合日志和集群节点上的本地日志文件。在仍然运行中的集群上，你可以通过 `ssh` 进入网关节点，并直接查看收集在 `/mnt/var/log/`\
  \ 下的日志文件。例如，要找出上一节的数据处理步骤失败的原因，让我们查看一下 `/mnt/var/log/hadoop/steps`。该文件夹包含与提交给集群的每个数据处理步骤相对应的子文件夹。在这些子文件夹下，你会看到三个日志文件：\n\
  \n*   `controller`：包含数据处理步骤精确调用的日志文件。在本例中，它包含一个自定义 jar 的 Hadoop 调用命令。\n*   `stdout`：包含控制器命令在其标准输出流上产生的输出的日志文件。\n\
  *   `stderr`：包含控制器命令在其错误输出流上产生的输出的日志文件。\n\n首先，让我们看看当你通过自定义 JAR 提交 Giraph 数据处理步骤时，controller\
  \ 调用了什么。你会看到与列表 12-10 非常相似的内容。\n\n列表 12-10。`/mnt/var/log/hadoop/steps/s-STEPID/controller`\
  \ 的内容\n\n```\n2014-07-14T19:36:33.251Z INFO startExec ’hadoop jar /home/hadoop/book-examples-1.0.0-jar-with-dependencies.jar\
  \ org.apache.giraph.GiraphRunner GiraphHelloWorld -vip inputt -vif org.apache.giraph.io.formats.IntIntNullTextInputFormat\
  \ -w 1 -ca giraph.SplitMasterWorker=false’\n...\n```\n\n这看起来就像是你通过 `'hadoop jar\
  \ ...'` 命令手动提交来运行 Giraph 工作流时所用的完全相同命令。也许，如果你查看一下该命令产生的错误执行情况，就能找到它失败的原因。你在那里看到的内容与列表\
  \ 12-11 非常相似。\n\n列表 12-11。`/mnt/var/log/hadoop/steps/s-STEPID/stderr` 的内容\n\n```\n\
  Exception in thread \"main\" java.lang.IllegalArgumentException: Invalid vertex\
  \ input path (-vip): input\nat org.apache.giraph.utils.ConfigurationUtils.populateGiraphConfiguration(ConfigurationUtils.java:406)\n\
  at org.apache.giraph.utils.ConfigurationUtils.parseArgs(ConfigurationUtils.java:207)\n\
  \      at org.apache.giraph.GiraphRunner.run(GiraphRunner.java:74)\n```\n\n当然，这说得通——你试图在一个不存在的输入数据集上运行\
  \ Giraph 应用程序。如何使数据集可用于 EMR 集群并获取结果是下一节的主题。\n\n### 我的东西在哪里？EMR 集群的数据迁入与迁出\n\nEMR\
  \ 集群是一个临时的节点集合。它们按需创建以完成特定的数据处理步骤序列；之后通常会被立即销毁。这是一种便捷且符合云理念的资源利用模式，但它确实要求初始数据集来自某个永久存储位置，并且在集群及其\
  \ HDFS 存储层消失之前，以某种方式捕获结果数据集。\n\n通常，Amazon 云依赖 S3 作为其永久存储层。几乎所有 AWS 服务都支持将 S3 作为数据源或数据目标。例如，AMI\
  \ 存储在 S3 中；它也可以用作大多数 AWS 服务日志记录的目标。S3 将所有对象存储在存储桶（bucket）中。你可以将存储桶视为在你的 AWS 账户下管理的顶层文件系统文件夹。创建存储桶后，你可以使用它来创建类似文件的对象，以保存任何类型的数据。一个任意、唯一且长度不超过\
  \ 1024 字节的键引用每个对象。将对象命名得如同文件系统中的文件一样是很方便的（但这并非强制要求），使用传统的 Unix 路径名约定（用 `/` 字符分隔文件夹）。遵循此约定使得使用\
  \ S3 或 HTTP URI 引用 S3 对象变得自然。例如，如果你创建一个名为 `giraph.examples` 的存储桶，并将一个名为 `datasets/1/data.txt`\
  \ 的对象放入其中，那么你可以将其引用为 `s3://giraph.examples/datasets/1/data.txt` 或 `https://s3.amazonaws.com/giraph.examples/``datasets/1/data.txt`。\n\
  \n请记住，存储桶名称在 AWS 上共享一个全局命名空间。这意味着你可能需要发挥一些创意。很可能，任何像 `mybucket` 这样简单的名称都已被占用。考虑到这一点，为\
  \ Giraph 应用程序提供数据的第一步是创建一个唯一的存储桶，并将你在第 5 章中使用的示例输入数据复制到其下，如列表 12-12 所示。\n\n列表 12-12。将输入数据放入\
  \ S3\n\n```\n$ aws s3 mb s3://unique.bucket\n$ aws s3 cp src/main/resources/1/graph.txt\
  \ s3://unique.bucket/datasets/1/graph.txt\n```\n\n既然示例图描述已存在于 S3 中，距离将其提供给 Giraph\
  \ 处理就完成了一半。Amazon EMR 方便地提供了一个自定义 JAR 文件，该文件实现了从 S3 存储桶到 HDFS 的高效数据传输，Giraph 可以在\
  \ HDFS 中获取数据。触发此传输的方法是为集群再添加一个步骤，如列表 12-13 所示。请注意，这次你使用简写符号来指定所有必需的键值对，而不是使用格式正确的\
  \ JSON 对象。两种方式都可以。\n\n列表 12-13。通过自定义 JAR 步骤将数据从 S3 传输到 HDFS\n\n```\n$ aws emr add-steps\
  \ --cluster-id j-DEADBEAF                                \\\n--steps Type=CUSTOM_JAR,Name=UploadInputData,\
  \                              \\\nJar=/home/hadoop/lib/emr-s3distcp-1.0.jar,  \
  \                              \\\nArgs=--src,s3://unique.bucket/datasets/1/,  \
  \                             \\\n--dest,hdfs:///user/hadoop/input\n```\n\n你传递给自定义\
  \ JAR 的参数通过 `--src` 指定源 S3 存储桶，并通过 `--dest` 指定 HDFS 中的目标位置。当然，这个步骤也可以反向工作。如果你在集群销毁后需要捕获任何数据集，只需添加一个将一批文件从\
  \ HDFS 复制到 S3 存储桶的步骤即可。\n\n提醒一句：S3 很昂贵，并且它会一直保存你的数据，直到你明确删除它；请仅将其用于最终结果。S3 中保留的任何数据都会根据其大小按月向你的账户收费。\n\
  \n此时，你可以重新运行列表 12-8 中的图处理步骤，以查看这次它是否能够运行完成，并显示退出状态为 `COMPLETED`。然而，与其这样做，不如让我们将所有内容整合起来，看看如何使用一个真正的临时集群进行数据处理。\n\
  \n\n\n### 整合所有要素：临时图处理 EMR 集群\n\n至此，你已经掌握了在 Amazon 云上运行图处理作业所需的全部要素，该作业将尽可能接近生产环境中的实际使用情况。我们将沿用经典的“Hello\
  \ World”图处理示例，但需要确保数据和自定义 JAR 文件从 S3 上传到临时 EMR 集群，并将最终结果数据集记录到某个 S3 存储桶中。同时，你还需确保所有日志均被传输至\
  \ S3，以便在集群消失后仍能进行诊断。鉴于上述需求，数据处理步骤的定义会变得相当长。为了避免在命令行中逐一指定，你将采用 JSON 文件来定义，如代码清单 12-14\
  \ 所示。\n\n**代码清单 12-14.** 数据处理步骤的 JSON 定义文件 `steps.json`\n\n```json\n[\n  {\n   \
  \ \"Type\": \"CUSTOM_JAR\",\n    \"Name\": \"UploadInputData\",\n    \"ActionOnFailure\"\
  : \"CANCEL_AND_WAIT\",\n    \"Jar\": \"/home/hadoop/lib/emr-s3distcp-1.0.jar\",\n\
  \    \"Args\": [\n      \"--src\",\n      \"s3://unique.bucket/datasets/1/\",\n\
  \      \"--dest\",\n      \"hdfs:///user/hadoop/input\"\n    ]\n  },\n  {\n    \"\
  Type\": \"CUSTOM_JAR\",\n    \"Name\": \"GiraphJob\",\n    \"MainClass\": \"org.apache.giraph.GiraphRunner\"\
  ,\n    \"ActionOnFailure\": \"CANCEL_AND_WAIT\",\n    \"Jar\": \"s3://unique.bucket/jars/giraph-hello.jar\"\
  ,\n    \"Args\": [\n      \"GiraphHelloWorld\",\n      \"-vip\",\n      \"input\"\
  ,\n      \"-op\",\n      \"output\",\n      \"-vif\",\n      \"org.apache.giraph.io.formats.IntIntNullTextInputFormat\"\
  ,\n      \"-vof\",\n      \"org.apache.giraph.io.formats.GraphvizOutputFormat\"\
  ,\n      \"-w\",\n      \"1\",\n      \"-ca\",\n      \"giraph.SplitMasterWorker=false\"\
  \n    ]\n  },\n  {\n    \"Type\": \"CUSTOM_JAR\",\n    \"Name\": \"DownloadOutputData\"\
  ,\n    \"ActionOnFailure\": \"CANCEL_AND_WAIT\",\n    \"Jar\": \"/home/hadoop/lib/emr-s3distcp-1.0.jar\"\
  ,\n    \"Args\": [\n      \"--src\",\n      \"hdfs:///user/hadoop/output\",\n  \
  \    \"--dest\",\n      \"s3://unique.bucket/output/\"\n    ]\n  }\n]\n```\n\n一个有趣的附带说明是：由于\
  \ EMR 集群允许从 S3 引入自定义 JAR，你实际上无需额外执行 put 操作。你只需将 `GiraphHelloWorld` JAR 上传至 S3 即可，如代码清单\
  \ 12-15 所示。\n\n**代码清单 12-15.** 将 `GiraphHelloWorld` JAR 复制到 S3 存储桶\n\n```bash\n\
  $ aws s3 cp target/*-jar-with-dependencies.jar s3://unique.bucket/jars/giraph-hello.jar\n\
  ```\n\n现在，所有必需的文件都已存放在 S3 中，剩下唯一要做的就是启动一个临时 EMR 集群，并使其按照 `steps.json` 中指定的数据处理步骤运行，如代码清单\
  \ 12-16 所示，并使用熟悉的相关步骤。但你还需添加日志存储位置（`--log-uri`），并要求在处理步骤完成后终止集群（`--auto-terminate`）。\n\
  \n**代码清单 12-16.** 在 EMR 上启动一个临时图处理作业\n\n```bash\n$ aws emr create-cluster --ami-version\
  \ 2.4.11 \\\n  --instance-groups \\\n  InstanceGroupType=MASTER,InstanceCount=1,InstanceType=m3.xlarge\
  \ \\\n  --log-uri s3://unique.bucket/logs/ --auto-terminate \\\n  --steps file://./steps.json\n\
  ```\n\n```json\n{\n  \"ClusterId\": \"j-DEADBEEF2\"\n}\n```\n\n和之前一样，该命令会输出集群 ID，你需要等待该集群退出后才能检查整体执行日志。使用代码清单\
  \ 12-17 中的命令可以方便地监控集群状态。该命令基于 `describe-cluster` 操作的 JSON 输出，并通过 `--query` 标志指定的自定义\
  \ JSON 查询请求来打印集群状态。这是一种减少 JSON 输出量的便捷方式。关于如何指定 JSON 查询，请参阅 `aws help`。\n\n**代码清单\
  \ 12-17.** 监控集群状态\n\n```bash\n$ aws emr describe-cluster --cluster-id j-DEADBEEF2\
  \ \\\n  --query Cluster.Status.State\n```\n\n```\n\"TERMINATED\"\n```\n\n一旦集群终止，你只需检查留在\
  \ S3 中的日志，确认处理步骤已成功完成，并获取作业的最终输出。这可以通过一系列 `s3` 命令完成，如代码清单 12-18 所示。第一个命令将 Giraph\
  \ 应用的运行输出复制到你的工作站，并命名为 `output.txt`；第二个命令演示了如何列出存储桶某部分的内容（如同操作文件夹），以查找可能感兴趣的日志文件。\n\
  \n**代码清单 12-18.** 集群终止后检查日志和输出\n\n```bash\n$ aws s3 cp s3://unique.bucket/output/part-m-00000\
  \ output.txt\n$ aws s3 ls s3://unique.bucket/logs/j-DEADBEEF2/\n```\n\n```\nPRE\
  \ daemons/\nPRE jobs/\n```\n\n至此，所有输出数据（包括日志）都已保存在 S3 中。这对于集中存储而言非常理想，但如果你不清除不再需要的日志并精简输出数据集，最终可能会产生高昂的费用。\n\
  \n在 EMR 上运行时降低成本是首要关注点之一，而存储成本可能对最终账单贡献巨大。不过，Amazon 提供了多种有吸引力的定价模型，使 EMR 集群的使用更具成本效益。其中一种模型——竞价实例（Spot\
  \ Instances）——将在下一节中介绍。\n\n\n\n### 物超所值：Amazon EMR 竞价实例\n\n到目前为止，您所了解的亚马逊云定价模型假定每种实例类型都有固定的计费率。然而，这并不是唯一的模式。另一种为计算资源付费的方式是针对亚马逊云中的闲置容量进行竞价投标。这适用于所有实例类型，其每小时价格通常低于同类实例类型的固定计费率。竞价实例的缺点在于，当需求增加且您的出价低于当前市场价时，亚马逊会关闭这些实例。对于传统的\
  \ MapReduce 工作负载来说，这并非大问题（毕竟，Hadoop 的设计初衷就是能够承受节点故障），并且它为您提供了一种非常便捷的方式来利用廉价的计算资源加速数据处理。\n\
  \n竞价实例在 EMR 集群中的典型用途是作为任务（TASK）实例组的一部分，这样节点可以随时添加（和移除）而不会中断集群操作。要指示某个实例组需要启用竞价实例计费，您只需在实例组规范中添加\
  \ `BidPrice` 属性即可，如 12-19 清单所示。\n\n**清单 12-19.** 使用竞价实例 TASK 实例组创建集群\n\n```\n$ aws\
  \ emr create-cluster --ami-version 2.4.11      \\\n--instance-groups           \
  \                        \\\nInstanceGroupType=MASTER,InstanceCount=1,InstanceType=m3.xlarge\
  \           \\\nInstanceGroupType=CORE,InstanceCount=2,InstanceType=m3.xlarge  \
  \              \\\nInstanceGroupType=TASK,InstanceCount=3,InstanceType=m3.xlarge,BidPrice=0.10\
  \ \\\n--log-uri s3://giraph.examples/logs/ --auto-terminate    \\\n--steps file://./steps.json\n\
  ```\n\n如果您运行上述命令，亚马逊云会立即为您创建三个节点：一个在主控（MASTER）实例组，两个在核心（CORE）实例组。这些节点用于管理集群上的存储（HDFS），并为图处理应用提供最低保证的计算资源量。您可能还会期望任务（TASK）实例组中的另外三个节点随时添加到您的集群中（也可能随时被从您那里移除）。对于传统的\
  \ MapReduce 应用，这些额外节点能带来暂时的性能优势。然而，Giraph 应用给这种模式带来了些许复杂之处。\n\n大多数传统 MapReduce 工作负载对映射器可用的计算节点总数没有严格的要求。如果某些节点发生故障，通常只会导致整体执行速度变慢，但您的作业最终仍会完成。Giraph\
  \ 将映射器用作并行工作节点，并要求在任何时候都有特定数量的工作节点（通过 `--w` 选项指定的值）可用。如果一个节点发生故障，Giraph 期望 Hadoop\
  \ 在另一个节点上重新调度一个映射器，这只有在该 Giraph 应用可用的总计算资源量超过其预期工作节点数时才可能实现。这给 Giraph 应用使用竞价实例带来了复杂性。毕竟，竞价实例的全部意义在于，在价格合适时为您的集群提供临时的性能提升，并在价格上涨时缩减规模。\n\
  \n将竞价实例与 Giraph 一起使用被视为一项实验性功能，仅推荐给高级用户。如果您有兴趣尝试，请务必注意以下配置属性，您需要在配置中明确指定这些属性（通过\
  \ `--ca` 命令行选项或 `giraph-site.xml`）。\n\n- `giraph.maxWorkers`: Giraph 可以在集群上利用的工作节点总数。请根据您期望亚马逊分配给集群的最大节点数（CORE\
  \ + TASK）进行设置实验。\n- `giraph.minWorkers`: Giraph 进入下一个超步所需的最小工作节点数。请根据您期望亚马逊保证分配给集群的节点数（CORE）进行设置实验。\n\
  - `giraph.minPercentResponded`: 进入下一个超步所需的最少健康工作节点百分比。请尝试将其设置为约 100 × `giraph.minWorkers`\
  \ ÷ `giraph.maxWorkers`。\n- `giraph.checkpointFrequency`: 工作节点状态检查点之间连续的迭代步数。请尝试将其设置为\
  \ 1，并根据您应用的性能特征逐步增加。\n\n至此，您已经了解了运行普通 EMR 集群的所有不同方式。但是，如果您需要优化价格、性能，或两者兼而有之，以最好地满足您的图处理应用需求，又该怎么办呢？\n\
  \n\n\n### 因地制宜：微调您的 EMR 集群\n\n到目前为止，您一直在使用 EMR 集群的默认配置，而没有过多关注其针对图处理任务的优化程度。作为第一步，这没问题（而且这些简单的示例本身也不需要太多额外配置），但对于任何实际工作负载，都需要进行一定程度的调优。您需要调优\
  \ EMR 集群的原因有两个且相互关联：性能与成本。\n\n每个 Giraph 应用程序都各不相同，但鉴于其灵活的架构，任何使用 Giraph 的应用程序都可能对三种基本资源造成压力：CPU、内存和\
  \ I/O。上一章中提到的所有性能调优建议仍然适用于在云端运行 Giraph。当然，您需要从实际为所有资源使用付费的角度来看待它。因此，确定能提供足够性能所需的最少资源数量就成了关键。\n\
  \n在 EMR 上，您能做的最有价值的选择就是为您的任务选择正确的实例规格。如前所述，EMR 提供数十种不同的实例规格，要猜对合适的规格可能令人生畏。这里的最佳建议是从较小的规格开始，部署诸如\
  \ Ganglia 之类的性能监控工具，然后试验不同的实例规格，以找到成本与性能之间的最佳平衡点。将实例类型参考表保存在手边（[`http://aws.amazon.com/ec2/instance-types/`](http://aws.amazon.com/ec2/instance-types/)），并做一些实验，看看您的方向是否正确。\n\
  \n某些工作负载在具有大量 RAM 的实例上运行时性能最佳。如果您属于这种情况，请务必告知 EMR 为此类环境配置您的集群。通常，任何特定于集群的调整都可以作为集群引导操作的一部分来实现。引导操作本质上是在集群启动时执行的脚本，并会影响\
  \ Hadoop 配置文件。例如，为内存密集型工作负载配置 Hadoop 的最简单方法是添加一个引导操作，引用 Amazon 自己的脚本，如 12-20 所示。\n\
  \n**代码清单 12-20** 为内存密集型工作负载配置 Hadoop\n\n```\n$ aws emr create-cluster --bootstrap-actions\
  \                                      \\\n     Path=s3n://elasticmapreduce/bootstrap-actions/configurations/latest/memory-intensive,\
  \ \\\n     Name=mem-config                                                     \
  \         \\\n     Args=string1,string2                                        \
  \                 \\\n  --ami-version 2.4.6 ...\n```\n\n由于引导操作是调整 Hadoop 配置的主要工具，建议您下载\
  \ 2-20 中提到的 `memory-intensive` 脚本，并将其作为创建您自己的引导操作的参考。\n\n另一个需要考虑的基本变量是 CORE 和 TASK\
  \ 实例组中的实例数量。同样，EMR 使得从小规模开始，并动态调整 TASK 实例组的大小以查看是否有助于加快处理速度变得很容易。\n\n最后，在使用任何 AWS\
  \ 服务时，请确保您所做的一切都限制在同一 AWS 区域内；更好的是，限制在同一可用区。跨区域数据传输成本高昂，并且与同一区域内的 I/O 相比，提供的带宽要少得多。最佳情况是您的数据处理集群的所有元素都位于同一可用区。\n\
  \n## 总结\n\n在云端运行 Giraph 提供了一种可扩展、弹性且易于使用的方式来执行图处理应用程序，而无需担心管理基础设施。所有集群配置都已为您完成，同时保留了足够的灵活性来进行所有必要的调整。并非所有云都是相同的。虽然本章只讨论了亚马逊云，但相同的核心原则也适用于其他公有云和私有云。如果您的云提供商不是亚马逊，那么至少您现在知道应该寻找哪些服务了。\n\
  \n"
- "# 13. 安装和配置 Giraph 与 Hadoop\n\n本章涵盖：\n\n- 运行 Giraph 和 Hadoop 的系统要求\n- Giraph 和\
  \ Hadoop 的安装方法\n- 为 Giraph 应用程序运行 Hadoop 的不同模式\n- 为所有三种不同运行模式配置 Hadoop\n\n在本书中，一直假定您有一个可用的\
  \ Hadoop 安装环境来运行示例和试验 Giraph。由于 Giraph 运行在 Hadoop 之上，拥有一个可用的 Hadoop 环境是基本前提。本附录首先探讨\
  \ Hadoop 和 Giraph 部署的系统依赖关系。接着，它描述了安装 Hadoop 和 Giraph 的各种方法，展示了它们各自的优缺点。然后，它探讨了不同类型的\
  \ Hadoop 部署，以及 Giraph 如何处理其需要利用的 Hadoop 生态系统项目的不同版本。最后，本附录概述了 Hadoop 和 Giraph 配置管理的基础知识，并讨论了在不同执行模式下运行\
  \ Giraph 所需的 Hadoop 配置。\n\n## 系统要求\n\nGiraph 和 Hadoop 都是使用 Java 编程语言实现的，可以在基于 Unix\
  \ 的系统、Mac OS X 和 Windows 系统上运行。Giraph 需要 Oracle JDK 7 或更高版本。由于 Giraph 任务由运行 Hadoop\
  \ 框架的同一个 JVM 执行，这为 Hadoop 部署可使用的 JDK 版本设置了下限。这意味着，如果您有一个需要用于运行 Giraph 应用程序的现有 Hadoop\
  \ 集群，您必须确保该集群是使用 JDK 7 或更高版本部署的。\n\n您还需要在将要启动 Giraph 应用程序的主机上以及在将用于 Giraph 应用程序开发的主机上安装\
  \ JDK。Giraph 和 Hadoop 都在 Oracle 的 JDK 上经过了广泛测试，OpenJDK（Oracle JDK 的一个开源、社区驱动的版本）是部署的次优选择。如果您尚未安装\
  \ JDK 且想使用 Oracle 版本，请访问 [`www.java.com/jdk`](http://www.java.com/jdk) 并按照您操作系统的安装步骤操作。另一方面，如果您决定选择\
  \ OpenJDK，您可能会发现它已由供应商为您打包在操作系统中。\n\n无论您如何安装 JDK，请确保安装目录的位置通过环境变量 `JAVA_HOME` 对所有应用程序可用。如果您希望该位置也能提供所有\
  \ Java 命令行实用程序（包括启动 JVM 本身）的二进制文件，您可能需要使用该设置更新您的 `PATH`。在 Unix 平台上，通常可以方便地在全局 shell\
  \ 启动文件（如 `/etc/profile`、`~/.bashrc` 或 `~/.bash_profile`）中设置这些值，类似于 A-1 所示。\n\n**代码清单\
  \ A-1** 设置 `JAVA_HOME` 并将 Java 二进制文件添加到 PATH 中\n\n```\nJAVA_HOME=/usr/lib/jvm/default-java\n\
  export JAVA_HOME\nPATH=$JAVA_HOME/bin:$PATH\n```\n\n> **注意：** 在操作系统方面，各种 Linux 发行版是测试最广泛的部署平台。虽然可以在\
  \ Mac OS X 甚至 Windows 上运行 Giraph 和 Hadoop，但这些平台主要用于开发。\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将以下英文文本翻译成中文。\n\
  \n\n### Hadoop 安装\n\n除非您已经有一个可用的 Hadoop 集群来运行 Giraph 应用程序（无论是本地部署还是云服务），否则您的第一步是决定要使用哪个主要版本的\
  \ Hadoop。目前，有两个主要版本可用：Hadoop 1.x 和 Hadoop 2.x。这两个版本都被认为是稳定的，可以安全地用于生产环境。两者的区别归结为：Hadoop\
  \ 1.x 正逐渐过渡到维护模式，开发活动很少。相比之下，Hadoop 2.x 的开发活动仍然非常活跃，错误修复和新功能开发都在快速推进。这两个版本之间的另一个根本区别是\
  \ MapReduce 框架的架构。Hadoop 1.x 忠实实现了原始 Google 论文中描述的 MapReduce 框架，而 Hadoop 2.x 则更进一步，本质上提供了\
  \ MapReduce v2 的实现，作为一个位于通用资源调度器 YARN 之上的应用程序。\n\n#### MapReduce v1 有什么问题？\n\nMapReduce\
  \ 的原始实现（现在称为 MapReduce v1）在架构上决定将特定于 MapReduce 的逻辑与更底层的集群资源管理和调度混为一谈。虽然这为功能性实现提供了最快的途径（并为\
  \ Hadoop 的世界统治铺平了道路），但它也存在许多技术限制：可扩展性问题、容错性差、以及在同一集群上运行非 MapReduce 框架的困难是其中的主要问题。事实上，正如您在第\
  \ 6 章中看到的，Giraph 实现必须欺骗 MapReduce v1，让它认为 Giraph 是作为一个通用的 map-reduce 应用程序在运行，而实际上，Giraph\
  \ 应用程序根本不符合通用的 MapReduce 模型。\n\nHadoop 2.x 试图通过提供一个称为 YARN（Yet Another Resource\
  \ Negotiator，另一种资源协调者）的独立层来提供底层集群资源管理和调度能力，并在 YARN 之上运行 MapReduce 框架，从而解决这些限制。这种架构使得其他分布式框架可以与\
  \ MapReduce 应用程序并排运行，而无需假装映射到 MapReduce 模型。值得重申的是，这纯粹是一个实现层面的变化；所有现有的 MapReduce\
  \ v1 应用程序仍然与 MapReduce v2 API 兼容。尽管 MapReduce 工作负载如今仍主导着 Hadoop 2.x 集群，但人们对于将其他分布式计算框架移植到\
  \ YARN 上运行有浓厚的兴趣：Giraph、Apache Spark（用于数据处理的内存引擎）和 Hamster（OpenMPI）只是其中的几个例子。\n\n\
  在本书中，您一直使用 Hadoop 1.x 实现，通过纯 map 的 MapReduce 作业来运行示例。同样的工作流程仍然适用于在 Hadoop 2.x MapReduce\
  \ 实现上运行。尽管您还没有探索如何在 YARN 上运行（因为它仍被认为有些实验性质），但如果您决定安装 Hadoop 2.x，除了通过 MapReduce 运行\
  \ Giraph 之外，您还可以尝试将 Giraph 作为 YARN 客户端运行。无论您选择哪个 Hadoop 版本，下一步都是在您的主机上安装 Hadoop\
  \ 的二进制发行版。\n\n除非您需要担心在大型 Linux 主机集群上安装 Hadoop，否则获取 Hadoop 二进制发行版的最简单方法是从 Apache\
  \ 软件基金会 Hadoop 发布页面 [`http://hadoop.apache.org/releases.html`](http://hadoop.apache.org/releases.html)\
  \ 下载打包为 gzip 压缩 tar 文件的稳定版本。\n\n将下载的文件解压到您文件系统中的某个子目录中（稍后您将使用相同的子目录来安装 Giraph），如清单\
  \ A-2 所示。\n\n**清单 A-2.** 在 Unix 或 Mac OS X 工作站上安装 Hadoop 1.2.1\n\n```\n$ mkdir ∼/dist\n\
  $ cd ∼/dist\n$ tar xzf hadoop-1.2.1.tar.gz\n```\n\n至此，您已拥有 Hadoop 的二进制安装，并且需要将该安装的位置暴露给您将要运行的所有其他命令行工具。这可以通过设置几个环境变量来实现，如清单\
  \ A-3 所示（别忘了，您可以像之前添加 `JAVA_HOME` 一样，将它们添加到您的 profile 文件中）。\n\n**清单 A-3.** 设置环境以运行\
  \ Hadoop 应用程序\n\n```\n$ HADOOP_HOME=∼/dist/hadoop-1.2.1\n$ export HADOOP_HOME\n\
  $ PATH=$HADOOP_HOME/bin:$PATH\n$ hadoop version\nHadoop 1.2.1\nSubversion https://svn.apache.org/repos/asf/hadoop/common/branches/branch-1.2\n\
  Compiled by mattf on Mon Jul 22 15:23:09 PDT 2013\nFrom source with checksum 6923c86528809c4e7e6f493b6b413a9a\n\
  This command was run using /Users/shapor/dist/hadoop-1.2.1/hadoop-core-1.2.1.jar\n\
  ```\n\n清单 A-3 中的最后一个命令通过运行 `hadoop` 命令行工具并查看预期输出来证明 Hadoop 安装成功。这是确保您的 Hadoop 安装正确并且可以在您的系统上找到\
  \ Java 的最简单方法。\n\n> **注意**：按照描述在所有集群机器上安装 Hadoop。\n\n尽管上述安装 Hadoop 的方法非常简单，并且应该适用于大多数操作系统，但您可能希望使用包管理器从二进制发行版安装。这样做将保证\
  \ Giraph 和 Hadoop 二进制文件来自同一个发行版，并且它们已经过集成和测试，可以协同工作。以下部分提供了有关如何进行此操作的更多信息。\n\n\n\
  \n### Giraph 安装\n\n现在你已经完成了 Hadoop 的安装，可能会觉得在系统上安装 Giraph 理应更简单。好消息是，由于 Giraph 恰好是一个纯客户端应用，它不需要安装在集群的所有主机上。只需要让\
  \ Giraph 安装在集群中通常提交 MapReduce 或 YARN 任务的某台机器上即可（这些机器被称为网关节点或边缘节点）。坏消息是，与 Hadoop\
  \ 不同，选择与集群中部署的其他 Hadoop 生态系统组件兼容的现成 Giraph 二进制发行版可能并非易事。\n\n这里的棘手问题在于依赖关系。Giraph\
  \ 至少有一个对 Hadoop 的基本依赖；但实际情况是，其依赖项集合至少与 Giraph I/O 格式需要交互的 Hadoop 生态系统项目数量一样多。Apache\
  \ Hadoop 生态系统项目有幸从开源和商业社区的不同贡献者那里获得了大量代码贡献。项目的高速发展导致代码库经历了多次重大重构，也催生了许多基于 Hadoop\
  \ 发展历程中不同节点的商业产品。\n\n总体而言，Hadoop 生态系统开发社区值得称赞，因为他们非常注重公共 API 层面的向后兼容性。就像 Linux 内核禁止通过更改公共\
  \ API 来破坏用户态应用程序一样，Hadoop 在不过度影响应用程序开发者方面有着良好的记录。除了一些小错误，针对 Hadoop 1.x 编写的 MapReduce\
  \ 应用程序（且未使用任何私有或不断演进的 API）应该能在未修改的情况下运行于 Hadoop 2.x。但问题是，这需要对应用程序的 Java 代码进行重新编译。\n\
  \n这对 Giraph 的二进制版本意味着，在构建时它们必须精确地指向运行时集群中将要部署的同一版本的 Hadoop（以及 Hadoop 生态系统项目）。至少，Giraph\
  \ 必须发布两个二进制版本：一个针对 Hadoop 1.x 构建，另一个针对 Hadoop 2.x 构建。然而，这仍然没有考虑到其他依赖项的差异，例如 Hive、HBase\
  \ 等。\n\n这个问题并非 Giraph 特有；它被称为“依赖组合爆炸”：不同版本依赖项的组合数量会随着依赖项数量的增加而呈指数级增长。\n\n迄今为止，软件工程界已经开发出两种不同的策略来处理依赖组合爆炸问题：\n\
  \n-   作为软件安装过程的一部分，从源代码构建二进制文件\n-   发布紧密集成组件的完整栈（或二进制软件分发版），而不是提供单个组件的独立二进制文件并期望任意版本组合能协同工作\n\
  \n在你深入了解这些策略的详细描述之前，我们首先要认识到第一个策略实际上是第二个策略的子集。决定从源代码构建你的 Giraph 安装，实际上意味着你正在着手一项任务：生成你自己的二进制软件分发版，其中包含部署到你集群上的组件确切版本。\n\
  \n#### 软件项目 vs. 软件栈\n\n有趣的是，一般而言，Apache 软件基金会试图避免发布其项目的二进制发行版，而是将这一责任留给下游打包者。对于成熟的项目（例如\
  \ Apache HTTP 服务器），这些打包者通常是各种操作系统（Linux 等）的分发者。操作系统分发者会确保最终进入其特定操作系统版本的所有各种 ASF\
  \ 软件项目能够彼此顺畅地协同工作。然而，Hadoop 及其生态系统项目尚未被列入操作系统打包者的议程。\n\n为了填补这一空白，各种 Hadoop 发行版的商业供应商开始提供完全集成的软件包，这些软件包不需要重新编译，并且已知能够彼此良好协作。这些商业发行版大多基于\
  \ Apache Bigtop 的工作：一个 100% 开源、社区驱动的 Apache Hadoop 大数据管理发行版。对于大多数 Hadoop 及其生态系统项目的用户来说，安装来自\
  \ Apache Bigtop 或商业供应商的完全集成发行版是入门最简便的方式。对于那些拥有现有集群的用户来说，从源代码编译 Giraph 以匹配集群上部署的依赖项的确切版本，可能是唯一的选择。\n\
  \n### 安装 Giraph 的二进制发行版\n\n如前所述，安装二进制发行版是最简单的选择，但也是限制最多的。如果你决定走这条路，基本上就是让 Giraph\
  \ 的二进制发行版来决定你将使用的 Hadoop 和 Hadoop 生态系统组件的版本。虽然它对于实际工作可能用处不大——除了快速搭建一个用于运行本书示例的环境之外——但它很简单，并且与本附录开头描述的\
  \ Hadoop 安装过程非常相似。\n\n与 Hadoop 一样，Giraph 也有两个可用的二进制发行版：一个针对 Hadoop 1.x 的最新版本构建，另一个针对\
  \ Hadoop 2.x 的最新版本构建。就像 Hadoop 的二进制发行版一样，Giraph 的二进制发行版被打包成 gzip 压缩的 tar 文件。每个发布的\
  \ Giraph 版本都包含两个二进制工件：一个针对 Hadoop 1.x 的 Giraph 二进制发行版（可下载为 `giraph-dist-X.Y.Z-bin.tar.gz`），以及一个针对\
  \ Hadoop 2.x 的 Giraph 二进制发行版（可下载为 `giraph-dist-X.Y.Z-hadoop2-bin.tar.gz`）。这两个 gzip\
  \ 压缩的 tar 文件都可以从 Giraph 项目网站 [`giraph.apache.org/releases.html`](http://giraph.apache.org/releases.html)\
  \ 下载。\n\n由于本书一直使用在 Hadoop 1.2.1 上运行的 Giraph 1.1.0 的示例，你需要获取的二进制文件是 `giraph-dist-1.1.0-bin.tar.gz`。下载该二进制文件后，请确保将其解压到之前安装\
  \ Hadoop 的同一台工作站上。请注意，解压归档文件后创建的顶层文件夹在其名称中嵌入了 Hadoop 1.x 的确切版本，看起来像 `giraph-1.1.0-for-hadoop-1.2.1`。另外，请记住，在真正的集群上，这是一个网关节点。如果你不知道你的网关节点在哪里，请咨询你的\
  \ Hadoop 管理员。无论你是在笔记本电脑还是网关节点的安装，都必须按照清单 A-4 所示的一系列步骤进行操作。\n\n```\nListing A-4.\
  \ 安装为在 Hadoop 1.2.1 上运行而构建的 Giraph 1.1.0\n\n$ cd ∼/dist\n$ tar xzf giraph-dist-1.1.0-bin.tar.gz\n\
  $ GIRAPH_HOME=∼/dist/giraph-1.1.0-for-hadoop-1.2.1\n$ export GIRAPH_HOME\n$ PATH=$GIRAPH_HOME/bin:$PATH\n\
  $ giraph\n   Usage: giraph [-D<Hadoop property>] <jar containing vertex>\n     \
  \            <parameters to jar>\n   At a minimum one must provide a path to the\
  \ jar containing the vertex to be executed.\n```\n\n如你所见，清单 A-4 与你使用 Hadoop 所做的（参见清单\
  \ A-3）非常相似，并且与 Hadoop 一样，清单中的最后一行证明了 Giraph 已安装并准备就绪。\n\n\n\n### 作为打包版 Hadoop 发行版的一部分安装\
  \ Giraph\n\n几乎所有的 Hadoop 集群实际部署都是在 Linux 操作系统上，以来自 Hadoop 二进制软件分发的原生 Linux 软件包（DEB\
  \ 或 RPM）形式进行的。这些软件包有两个来源：Hadoop 发行版的商业供应商和 Apache Bigtop。鉴于几乎所有商业 Hadoop 发行版都源自\
  \ Apache Bigtop，本节将重点介绍它。Bigtop 与商业发行版之间的区别归结为技术支持（你无法购买 Bigtop 的技术支持）以及新版 Hadoop\
  \ 生态系统组件被整合到打包中的速度（Bigtop 往往比商业发行版更快）。\n\n将 Hadoop 及其生态系统项目作为 Linux 上打包版 Hadoop\
  \ 发行版的一部分进行安装，可以确保每个组件都已集成，并且已知能与来自同一发行版的其他组件协同工作。不仅如此，这些软件包还通过遵循特定 Linux 发行版的打包指南，确保与底层\
  \ Linux 操作系统良好集成。最终结果是，以这种方式使用安装好的 Hadoop，与使用任何随 Linux 操作系统捆绑的系统软件并无二致。这种安装方法的唯一缺点在于它仅限于\
  \ Linux（尽管 Max OS X 的 brew 移植版正在开发中），并且需要提升超级用户权限。请务必与你的系统管理员沟通（或查阅 Linux 操作系统文档），以便你的账户能够使用`sudo(8)`以提升权限运行命令。\n\
  \n从 Apache Bigtop 发行版启用 Hadoop 安装的第一步，是告知你的 Linux 存储库管理器软件包所在的 URL。导航到[`archive.apache.org/dist/bigtop/stable/repos/`](http://archive.apache.org/dist/bigtop/stable/repos/)。确保找到与你\
  \ Linux 操作系统版本对应的文件夹，并下载名为`bigtop.XXX`的存储库定义文件（其中`XXX`是特定于你所使用的 Linux 版本的扩展名）。获取文件后，请确保将其复制到你的\
  \ Linux 操作系统存储库管理器查找外部存储库定义的位置（别忘了使用`sudo(8)`以便复制到系统位置）。表 A-1 总结了各种 Linux 发行版的存储库定义文件位置。\n\
  \n**表 A-1.** 存储库定义的位置\n\n| Linux 发行版 | 需要复制存储库文件的文件夹 |\n| --- | --- |\n| Debian\
  \ 和 Ubuntu | `/etc/apt/sources.list.d` |\n| CentOS、RHEL 和 Fedora | `/etc/yum/repos.d`\
  \ |\n| SUSE 和 OpenSUSE | `/etc/zypp/repos.d` |\n\n将 Bigtop 存储库定义文件添加到表 A-1 列出的某个文件夹后，下一步是导入存储库密钥。导入密钥允许软件包管理器确保其安装的是正版软件包。由于存储库密钥建立了信任，请务必始终从安全的[`dist.apache.org/repos/dist/release/bigtop/KEYS`](https://dist.apache.org/repos/dist/release/bigtop/KEYS)下载并存储在当前目录中。完成此操作后，只需添加密钥并刷新本地缓存的存储库定义即可。之后，你就可以使用\
  \ Linux 上软件包安装的常规方法来安装 Hadoop 和 Giraph。所需步骤总结在表 A-2 中，各行同样对应不同版本的 Linux。\n\n**表\
  \ A-2.** 通过 Linux 二进制软件包安装 Giraph\n\n| Debian 和 Ubuntu | CentOS、RHEL 和 Fedora |\
  \ SUSE 和 OpenSUSE |\n| --- | --- | --- |\n| `$ sudo apt-key add < KEYS` `$ sudo\
  \ apt-get update` `$ sudo apt-get install giraph` | `$ sudo rpm --import KEYS` `$\
  \ sudo yum clean metadata` `$ sudo yum install giraph` | `$ sudo rpm --import KEYS`\
  \ `$ sudo zypper update` `$ sudo install giraph` |\n\n运行最后一条命令的一个有趣附带作用是，Giraph\
  \ 与 Hadoop 之间的依赖关系会被正确识别，并且合适的 Hadoop 软件包会被隐式地安装到你的系统上。从某种意义上说，一旦你决定通过 Linux 软件包安装\
  \ Giraph，安装 Hadoop 的最佳（也是最简单的！）方式就是也以打包形式安装它。事实上，你甚至无需显式执行该步骤：系统会自动获取正确的 Hadoop\
  \ 软件包。\n\n如果你想知道通过 Linux 软件包安装 Giraph 后需要如何设置环境变量`HADOOP_HOME`和`GIRAPH_HOME`，好消息是你再也不必担心这些了。你可以像在\
  \ Linux 系统上运行任何可执行文件一样，直接运行`hadoop`和`giraph`命令行工具：只需输入其名称即可。\n\n不可否认，通过 Linux 软件包安装是安装\
  \ Giraph 和 Hadoop 迄今为止最简单的方法。如果你选择商业供应商之一，还可以注册获得专业支持。然而，缺点是，通过安装预打包的组件，你将放弃为你的环境选择独特\
  \ Giraph 和 Hadoop 版本组合的权利。如果你发现自己需要将 Giraph 与自定义版本的 Hadoop 及其生态系统组件相匹配，那么通过从源代码构建来安装\
  \ Giraph 可能是你唯一的选择。\n\n\n\n### 通过源码编译安装 Giraph\n\nGiraph 的源代码以 gzipped tar 文件形式打包，您可以在下载二进制文件的同一项目网站上获取：[`http://giraph.apache.org/releases.html`](http://giraph.apache.org/releases.html)。对于\
  \ Giraph 1.1.0 版本，请下载名为 `giraph-dist-1.1.0-src.tar.gz` 的文件，并将其解压到您的开发工作站上的某个位置。\n\
  \nGiraph 的构建基础设施由 Apache Maven 管理。如果您决定通过从源代码构建来安装 Giraph，则必须确保您的环境中安装了 Maven 3\
  \ 或更高版本。如果您没有安装 Maven，请确保按照项目网站 [`http://maven.apache.org`](http://maven.apache.org/)\
  \ 提供的安装说明进行操作。本附录的其余部分假设您已设置好 Maven，并且可以成功运行 `mvn` 命令行工具。\n\n> **注意：** 当您现有的 Hadoop\
  \ 集群所依赖的组件版本（包括 Hadoop 本身）与打包的 Giraph 二进制文件不匹配时，您将通过从源代码构建的方式来安装 Giraph。尽管可以针对任意版本的依赖项构建\
  \ Giraph，但请注意，这种组合很可能从未经过测试。\n\nGiraph 的构建基础设施提供了一种便捷的方式来指定 Giraph 需要构建所依赖的确切版本。您无需下载任何这些依赖项，也无需在环境中额外配置它们——Maven\
  \ 会为您处理。您需要使用 Maven 构建配置文件来指定 Hadoop 的主版本号，以及当您希望将 Giraph 构建为 YARN 客户端而不是纯 MapReduce\
  \ 应用程序时。最常用的构建配置文件总结在表 A-3 中。\n\n**表 A-3.** 常用的 Maven 构建配置文件\n\n| 配置文件名称 | 配置文件效果\
  \ |\n| --- | --- |\n| `hadoop_1` | 生成与 Hadoop 1.x 兼容的构建 |\n| `hadoop_2` | 生成与 Hadoop\
  \ 2.x 兼容的构建 |\n| `hadoop_yarn` | 生成基于 YARN 的 Giraph 构建（假设使用 Hadoop 2.x） |\n\n使用\
  \ Maven 构建配置文件可以将大多数属性预设为所需的值，同时仍然允许进行精确修改以匹配依赖项的次版本号和微版本号。虽然从源代码构建 Giraph 时可以调整数十个属性，但最常用的属性总结在表\
  \ A-4 中。\n\n**表 A-4.** 用于指定 Giraph 依赖项确切版本的常用属性\n\n| 属性名称 | 属性效果 |\n| --- | ---\
  \ |\n| `hadoop.version` | 用于指定 Hadoop 依赖项的确切版本 |\n| `dep.accumulo.version` | 用于指定\
  \ Accumulo 依赖项的确切版本 |\n| `dep.hbase.version` | 用于指定 HBase 依赖项的确切版本 |\n| `dep.hcatalog.version`\
  \ | 用于指定 HCatalog 依赖项的确切版本 |\n| `dep.hive.version` | 用于指定 Hive 依赖项的确切版本 |\n| `dep.zookeeper.version`\
  \ | 用于指定 ZooKeeper 依赖项的确切版本 |\n\n从指定配置文件开始，然后指定所有所需的版本属性，可以让您对生成的 Giraph 二进制文件进行非常精细的控制。例如，假设您的集群运行的是\
  \ Hadoop 2.7.1 和 HBase 0.98。清单 A-5 概述了构建与您的集群依赖项兼容的、支持 YARN 的 Giraph 的方法。但是，在运行此命令之前，请记住，您所请求的特定依赖项组合可能未经测试。其后果可能包括构建失败、单元测试失败或运行时失败。一旦偏离常规路径，您就需要自行解决问题，尽管它也可能正常工作。因此，如果单元测试失败，请不要气馁。其中一些单元测试对它们所针对开发的依赖项版本较为敏感；可以通过向\
  \ Maven 构建传递 `-DskipTests` 来关闭它们。\n\n**清单 A-5.** 针对 Hadoop 2.7.1 和 HBase 0.98 构建\
  \ Giraph 的示例\n\n```\n$ mvn -Phadoop_yarn -Dhadoop.version=2.7.1 -Ddep.hbase.version=0.98\
  \ -DskipTests\n```\n\n构建完成后，您将在 `giraph-dist/target` 文件夹下找到与之前章节中下载的非常相似的二进制文件。在那里找到\
  \ gzipped tar 文件，并按照上一节中描述的步骤，在您的网关节点上解压并安装该自定义版本的 Giraph。不要忘记像在清单 A-4 中那样设置 `GIRAPH_HOME`\
  \ 并将 Giraph 二进制文件添加到您的 `$PATH` 变量中。\n\n正如您所见，到目前为止，在系统上安装 Hadoop 和 Giraph 有几种不同的方法。当然，安装完成后，您还需要配置它们。在配置之前，这些安装包实际上无法用于任何操作。这正是下一节的主题。\n\
  \n### Hadoop 及 Hadoop 生态系统项目配置基础\n\n几乎所有 Hadoop 生态系统的成员（包括 Hadoop 本身）都共享通用的配置管理系统，该系统基于一组编码了键值对属性设置的平面\
  \ XML 文件。这些配置文件所在的文件夹因项目和安装方法而异。对于通过 Linux 软件包（DEB 或 RPM）安装的任何项目，配置文件的位置在 `/etc/<项目名称>/conf`\
  \ 下。但是，如果是手动安装，相同的配置文件则位于项目的 `HOME` 文件夹下的 `conf` 子文件夹中。Hadoop 和 Giraph 的配置文件具体位于何处取决于安装方法，总结于表\
  \ A-5 中。\n\n**表 A-5.** 按安装方法区分的配置文件位置\n\n| 安装方法 | Hadoop 配置文件夹 | Giraph 配置文件夹 |\n\
  | --- | --- | --- |\n| Linux 软件包 | `/etc/hadoop/conf` | `/etc/giraph/conf` |\n|\
  \ 手动安装 | `$HADOOP_HOME/conf` | `$GIRAPH_HOME/conf` |\n\n在这些文件夹中，您会找到一个或多个 XML 文件，类似于清单\
  \ A-6 中所示的示例。请注意，虽然 Giraph 只需要一个名为 `giraph-site.xml` 的配置文件，但 Hadoop 将其配置分散在至少三个不同的文件中——`core-site.xml`、`hdfs-site.xml`\
  \ 和 `mapred-site.xml`——而 `yarn-site.xml` 是用于配置作为 Hadoop 2.x 一部分的 YARN 的附加文件。\n\n\
  **清单 A-6.** Hadoop 配置文件示例\n\n```\n<configuration>\n   <property>\n    <name>prop.name</name>\n\
  \    <value>prop.value</value>\n    <description>关于此属性作用的自由格式描述</description>\n\
  \  </property>\n</configuration>\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将以下英文文本翻译成中文。\n\
  \n\n## 配置 Giraph\n\n严格来说，默认情况下，Giraph 实际上不需要在其 XML 配置文件中进行任何设置。任何可能是必需的配置选项（例如指定工作节点数量）都可以通过其命令行工具传递给\
  \ Giraph。不过，很快就会因为不断地在命令行中输入所有必需的选项而感到沮丧，这时你就可以开始利用 `giraph-site.xml` 来存储特定于你环境的配置（只需确保将其放在表\
  \ A-5 列出的文件夹中即可）。例如，如果你发现在本地模式下配置的 Hadoop 之上运行 Giraph 应用程序，那么拥有一个类似于清单 A-7 的 Giraph\
  \ 配置文件可能会很有用。\n\n**清单 A-7.** 示例 Giraph 配置文件 `giraph-site.xml`\n\n```\n<configuration>\n\
  \   <property>\n      <name>giraph.SplitMasterWorker</name>\n      <value>false</value>\n\
  \      <description>此设置允许 Giraph 应用在单个任务中运行</description>\n   </property>\n</configuration>\n\
  ```\n\n尽管 Giraph 有自己的配置文件，但它仍然依赖于通过特定于 Hadoop 的配置文件来正确配置的 Hadoop 客户端。配置 Hadoop 和匹配\
  \ Hadoop 客户端是下一节的主题。\n\n## 配置 Hadoop\n\n从根本上说，Hadoop 作业可以在以下三种模式之一中运行：\n\n*   在完全分布式\
  \ Hadoop 集群上，并在网关节点上配置客户端\n*   在伪分布式 Hadoop 集群上，客户端位于同一位置\n*   在本地 Hadoop 配置中，客户端模拟特定于集群的\
  \ Hadoop 机制\n\n本书中的绝大多数示例都假设你在本地模式下配置的 Hadoop 之上运行 Giraph 应用程序。本地模式是最容易设置的。它不需要在任何地方运行任何活动进程，并且确保\
  \ Giraph 作业在单个 JVM 中与其他所有内容一起运行。本地模式不使用 HDFS，而是读写本地文件系统中的文件，这使得它更容易使用。你甚至不需要配置任何东西来启用本地模式，因为它恰好也是默认模式（因此不需要\
  \ XML 配置文件或空文件来启用它）。\n\n本地模式非常适合开发和调试你的 Giraph 应用程序，但它也有一些限制。首先，它一次只能运行一个任务，这要求你将\
  \ Giraph 工作节点的数量限制为一个，并将主节点和工作节点合并到同一个任务中。也许一个更大的限制是，本地模式执行不会触发在真实 Hadoop 集群上运行时通常触发的相同代码路径。在调试\
  \ Giraph 应用程序时请记住这一点——你可能会看到行为上的差异。最后，尽管本地模式应该是最快的（至少在小型数据集上是这样），但 Hadoop 仍然需要做相当多的工作来引导\
  \ MapReduce 框架。这可能会导致 Giraph 代码开始执行之前有长达 20 秒的延迟。\n\n与本地模式完全相反的是完全分布式 Hadoop 集群。这是在生产环境中运行\
  \ Giraph 应用程序的常用方式；它假设有一个完全分布的 Hadoop 集群可用。Giraph 充当纯客户端，你需要从集群网关节点提交 Giraph 作业。网关节点的可用\
  \ Hadoop 配置需要与集群所有其他节点上运行的 Hadoop 所使用的配置相匹配。这通常由 Hadoop 集群管理员完成；不需要集群用户进行任何显式配置。管理员需要确保的是，Hadoop\
  \ 配置文件夹的内容在集群中的所有节点（包括网关节点）上保持同步。\n\n## 配置伪分布式模式的 Hadoop\n\n在有些受限的本地模式和需要大量设置的重量级完全分布式模式之间，一个非常好的折衷方案是\
  \ Hadoop 的伪分布式配置。在这种模式下，你可以在一个尽可能接近真实集群的环境中运行你的作业，而无需设置多节点集群的麻烦（尽管正如你在第 12 章中所看到的，这种麻烦可以通过使用\
  \ Hadoop 云服务来缓解）。伪分布式模式会在同一台主机上运行真实集群所拥有的所有进程（守护进程）。这些进程运行在不同的 JVM 中，并通过回环网络接口进行通信。除此之外，其配置与你将在真实集群上看到的完全相同。伪分布式模式是本地模式和完全分布式模式之间一个很好的中间地带。\n\
  \n启用伪分布式模式的最简单方法是从 Linux 软件包安装 Hadoop。有一个名为 `hadoop-conf-pseudo` 的特殊软件包，它可以拉取所有正确的依赖项，并在\
  \ `/etc/hadoop/conf` 中预设伪分布式模式所需的配置参数。只需安装该软件包即可。\n\n在无法从 Linux 软件包安装 Hadoop 的情况下，另一种选择是手动将\
  \ Hadoop 二进制文件安装到 `$HADOOP_HOME` 文件夹下（如本附录前面所述），并确保在适当的配置文件中设置表 A-6 中总结的属性。\n\n\
  **表 A-6.** 伪分布式模式所需的 Hadoop 配置\n\n| 配置文件 | 属性名称 | 属性值 | 属性作用 |\n| --- | --- | ---\
  \ | --- |\n| `core-site.xml` | `fs.default.name` | `hdfs://localhost/` | 为伪分布式 HDFS\
  \ 文件系统设置 URL |\n| `hdfs-site.xml` | `dfs.replication` | `1` | 设置复制因子为 1，因为在伪分布式模式下，你只有一个数据节点\
  \ |\n| `mapred-site.xml` | `mapred.job.tracker` | `localhost:8021` | 为伪分布式 Job Tracker\
  \ 设置 URL |\n| `yarn-site.xml` | `yarn.nodemanager.aux-services` | `mapreduce_shuffle`\
  \ | 让 YARN 知道 MapReduce 框架需要的额外服务 |\n| `yarn-site.xml` | `yarn.nodemanager.aux-services.mapreduce_shuffle.class`\
  \ | `org.apache.hadoop.mapred.ShuffleHandler` | 指定实现 `mapreduce_shuffle` 服务的类的名称\
  \ |\n\n由于伪分布式模式需要运行一些进程，配置后的最后一步是启动必要的服务并初始化其状态。首先，你需要启动 HDFS。根据你是从 Linux 软件包安装还是从二进制\
  \ gzip 压缩的 tar 文件安装，使用表 A-7 中提供的说明。当然，如果你没有从软件包安装 Hadoop，不要忘记将 `$HADOOP_HOME` 添加到你的\
  \ `$PATH` 中，如清单 A-3 所示。\n\n**表 A-7.** 在伪分布式模式下启动 HDFS\n\n| 从 Linux 软件包安装 Hadoop\
  \ | 从二进制 gzip 压缩的 tar 文件安装 Hadoop |\n| --- | --- |\n| `$ sudo service hadoop-hdfs-namenode\
  \ format` `$ sudo service hadoop-hdfs-namenode start` `$ sudo service hadoop-hdfs-datanode\
  \ start` `$ sudo –u hdfs hadoop fs –chmod 777 /` | `$ hadoop namenode –format` `$\
  \ hadoop-daemon.sh start namenode` `$ hadoop-daemon.sh start datanode` `$ hadoop\
  \ fs –chmod 777 /` |\n\n> **注意：** 最后一个命令使 HDFS 的根子目录对所有用户可读可写。在一个真实的、完全分布式的、多租户集群上，这将是一个巨大的安全问题。然而，在伪分布式设置中，它允许你跳过一些设置步骤，而不会损害\
  \ HDFS 的功能。\n\n\n\n至此，你应该拥有一个功能完备的 HDFS。你可以通过执行清单 A-8 所示的命令来验证其是否已启动并运行。\n\n**清单\
  \ A-8.** 验证能否向伪分布式 HDFS 复制文件及从中复制文件\n\n```\n$ hadoop fs –put /etc/hosts /test.file\n\
  $ hadoop fs –cat /test.file\n$ hadoop fs –rm /test.file\n```\n\n只要所有命令都执行成功，你就可以确信伪分布式\
  \ HDFS 设置无误。设置伪分布式 Hadoop 集群的最后一步是启动 MapReduce 服务（针对 Hadoop 1.x）或 YARN 服务（针对 Hadoop\
  \ 2.x）。所需命令分别总结在表 A-8 和表 A-9 中。\n\n**表 A-9.** 在伪分布式模式下启动 YARN\n\n| 通过 Linux 软件包安装的\
  \ Hadoop | 通过二进制 gzip 压缩 tar 文件安装的 Hadoop |\n| --- | --- |\n| `$ sudo service hadoop-yarn-resourcemanager\
  \ start` `$ sudo service hadoop-yarn-nodemanager start` `$ cd /usr/lib/hadoop-mapreduce`\
  \ | `$ hadoop-daemon.sh start resourcemanager` `$ hadoop-daemon.sh start nodemanager`\
  \ `$ cd $HADOOP_HOME/share/hadoop/mapreduce` |\n\n**表 A-8.** 在伪分布式模式下启动 MapReduce\n\
  \n| 通过 Linux 软件包安装的 Hadoop | 通过二进制 gzip 压缩 tar 文件安装的 Hadoop |\n| --- | --- |\n|\
  \ `$ sudo service hadoop-mapred-jobtracker start` `$ sudo service hadoop-mapred-tasktracker\
  \ start` `$ cd /usr/lib/hadoop` | `$ hadoop-daemon.sh start jobtracker` `$ hadoop-daemon.sh\
  \ start tasktracker` `$ cd $HADOOP_HOME` |\n\n无论你设置的是 Hadoop 1.x 还是 Hadoop 2.x，执行完这些命令后，请务必在当前工作目录（即上一条\
  \ `cd` 命令将你定位到的目录）中运行一个测试 MapReduce 作业。如果清单 A-9 中显示的命令成功运行至完成，则意味着你的伪分布式 Hadoop\
  \ 集群已完全就绪，可以用于你的 Giraph 应用程序了。\n\n**清单 A-9.** 验证是否能在伪分布式 Hadoop 集群上运行 MapReduce\
  \ 作业\n\n```\n$ hadoop jar *examples*jar pi 10 1000\n....\nJob Finished in 35.513\
  \ seconds\nEstimated value of Pi is 3.14080000000000000000\n```\n\n## 总结\n\n你可以通过多种不同的方式安装\
  \ Hadoop 和 Giraph。需要牢记的关键问题是，无论安装哪个版本的 Hadoop，它都必须与你将要使用的 Giraph 二进制文件版本相匹配。如果你计划使用\
  \ I/O 格式将 Giraph 与 Hadoop 生态系统中的其他成员（例如 Hive、HBase 等）连接，这些版本也必须匹配。安装完成后，最后一步是配置两者。Giraph\
  \ 默认不需要任何配置。Hadoop 必须配置为以下三种模式之一运行：本地模式、完全分布式模式或伪分布式模式。在本附录中，你了解了以下主题：\n\n*   运行\
  \ Hadoop 和 Giraph 的系统要求：Linux 或 Mac OS X 上的 JDK 7+\n*   使用两种主要方法安装 Hadoop 的步骤：二进制\
  \ gzip 压缩 tar 文件或 Linux 二进制软件包\n*   使用三种不同安装方法安装 Giraph 的步骤：二进制 gzip 压缩 tar 文件、Linux\
  \ 二进制软件包或从源码构建\n*   使用本地平面 XML 配置文件配置 Hadoop 和 Giraph\n*   执行简单的命令行以确保你的 Giraph\
  \ 和 Hadoop 部署运行正常\n\n尽管本附录提供了多种可选方案来完成安装和配置这两个基本任务，但如果你是从头开始安装所有内容，只需选择对你环境而言最简便的方法即可。然而，如果你正在处理现有的\
  \ Hadoop 集群，你可能会发现其中一些备选方法很有用。\n\n\n"
