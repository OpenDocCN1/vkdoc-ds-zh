  \n#2 根据姓名从分类器中获取性别\n\n#3 向该顶点关注的所有用户发送性别标签\n\n#4 如果这是第一个超步，则投票停止并返回\n\n#5 在第二个超步中，消息包含关注者的性别标签\n\
  \n#6 将性别计数器设置为顶点值\n\n这个新算法同样相当直接。与简化版相比，区别在于在超步 0 期间，顶点会联系外部服务来获取性别分类器，以判断其代表的用户是男性还是女性。之后，它会向所有该用户关注的用户发送\"\
