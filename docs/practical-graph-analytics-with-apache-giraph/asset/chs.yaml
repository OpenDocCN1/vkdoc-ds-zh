  如您所见，Giraph 在其维护的 ZooKeeper 状态中暴露了丰富的信息。这显然有助于调试；另一个不那么明显的好处是与外部应用程序的集成，这些应用程序可能需要跟踪正在运行的
  Giraph 应用程序的进度。请记住，Giraph znode 的位置和内容被视为 Giraph 的内部 API，并且可能在不同版本之间不经通知而更改。图 [6-10]
  为您提供了各种 Giraph 服务用于协调和元数据管理的 `znode` 层次结构的完整视图。


  ![A978-1-4842-1251-6_6_Fig10_HTML.jpg](img/A978-1-4842-1251-6_6_Fig10_HTML.jpg)


  **图 6-10.** 各种 Giraph 服务用于协调的 znode 树


  示例中的所有 `znode` 都根植于 `/giraph/examples/_hadoopBsp/job_1394131425944_0001`。这个公共前缀由
  `giraph.zkBaseZNode` 设置和 Giraph 当前运行的图处理作业的 ID 共同决定。在该公共根目录下，大致有五类不同的 `znode`，按照其功能用颜色区分。品红色的
  znode（名称以 `_vertexInputSplit` 开头）用于协调处理分片的 Worker。黄色的 znode（名称以 `_edgeInputSplit`
  开头）用于在请求了边分片处理时达到相同目的。对于这两类 znode，其名称的后缀决定了它们的用途：


  -   `_vertexInputSplitDir` 和 `_edgeInputSplitDir` 包含由 Master 写入的输入分片路径。

  -   `_vertexInputSplitDoneDir` 和 `_edgeInputSplitDoneDir` 包含已完全处理的顶点输入分片路径。

  -   `_vertexInputSplitsAllReady` 和 `_edgeInputSplitsAllReady` 包含准备好由 Worker 处理的顶点输入分片路径。

  -   `_vertexInputSplitsAllDone` 和 `_edgeInputSplitsAllDone` 包含已完成的顶点输入分片路径，用于通知
  Worker 继续执行。


  利用这四个 `znode`，您可以创建一个容错的工作共享方案，由活动的 Master 协调边和/或顶点输入分片的处理与分配，作为创建初始图拓扑的一部分。绿色的
  znode 用于选举活动的 Master（`_masterElectionDir`），并在活动 Master 宕机时，将全局的、特定于 Master 的作业状态保存在安全位置（`_masterJobState`）。紫色的
  znode 用于从客户端发出信号，以停止当前的图处理作业，并跟踪 Worker 的清理活动：


  -   `_haltComputation`：设置此全局标志的客户端可以指示 Giraph 停止计算，无论计算是否应该自然停止。这是在不尝试保存任何内容的情况下中止作业的最快方式。

  -   `_checkpointAndStop`：设置此全局标志的客户端可以指示 Giraph 对当前状态进行检查点操作，然后停止计算。这是一种优雅的停止作业的方式。

  -   `_cleanedUpDir`：此 znode 表示哪些 Worker 已被清理。


  最后，蓝色的 znode 是图处理的核心。每个图处理应用程序在运行给定图处理作业时，都会经历一定数量的尝试，这与 Hadoop MapReduce 执行在声明失败前会尝试运行映射阶段一定次数的方式相同。所有尝试都在
  `_applicationAttemptsDir/<attempt ID>` 这个 znode 路径下进行跟踪。在每个尝试的 `znode` 内，`_superstepDir`
  按 ID（从 -1 开始）跟踪超级步。在每个超级步期间，Master 协调 Worker 之间的工作进度并重新平衡图分区。以下 znode 用于实现此目的：




  `_workerHealthyDir`和`_workerUnhealthyDir`用于将集群中的工作节点（节点）划分为可分配任务的集合和需要跳过任务分配的集合。每个工作节点可以被分配到其中一个集合。


  `_workerFinishedDir`和`_workerWroteCheckpointDir`包含已完成当前超步或已完成当前超步状态检查点（如果启用了检查点）的工作节点的`znode`。


  `_addressesAndPartitions`用于跟踪主节点和工作节点的地址以及分区分配。


  `_partitionExchangeDir`有助于协调工作节点之间的分区交换。


  `_superstepFinished`将此超步标记为已完成。


  大多数情况下，Giraph 实现不会显式地与 ZooKeeper 客户端 API 交互，而是将所有 API 调用封装到由`ZooKeeperExt`类提供的方法中。该类不仅充当
  ZooKeeper 客户端 API 的外观，还提供扩展功能，例如递归路径创建和非原子操作。


  Giraph 创建的大多数`znode`都属于常规（非临时、非顺序）`znode`类别；使用它们与在常规文件系统中使用文件非常相似。然而，在 Giraph 需要使用临时和顺序类型`znode`的
  API 时，存在少数例外情况：


  *   根据工作节点是否认为自身健康，它们会在`_workerHealthyDir`或`_workerUnhealthyDir` `znode`下创建临时、非顺序的`znode`（根据运行工作节点的主机名命名）。Giraph
  提供了一个钩子用于定义节点不健康的判断标准，但默认实现始终返回任何节点的健康状态为“健康”。因为这些`znode`是临时的，ZooKeeper 保证当一个工作节点死亡时，与之关联的`znode`也会消失，并且活动主节点将收到通知，因为它维护着对这两个位置的监视。

  *   处理由主节点分配的分片的工作节点通过创建一个临时、非顺序的`znode`（名称对应于分配给它的输入分片）来声明需要完成的工作。当工作节点失败时，其工作预留`znode`会消失，允许其他工作节点声明其先前读取的分片。

  *   不同的主节点服务通过在`_masterElectionDir`下创建一个临时、顺序的`znode`来竞标成为活动主节点。一旦竞标完成，ZooKeeper
  会对文件名施加全局排序。在该顺序中竞标 ID 最小的主节点会假定自己可以充当活动主节点并继续执行。其余主节点阻塞，并监视`_masterElectionDir`
  `znode`的子节点。每当活动主节点死亡时，其临时`znode`会被 ZooKeeper 自动移除。这随后会唤醒所有候选主节点。其竞标关联的顺序 ID 最小的候选主节点将承担活动主节点的职责。

  *   活动主节点服务通过将全局状态写入一个持久（非临时）但同时是顺序的`_masterJobState/jobState_XXX` `znode`，来维护整个
  Giraph 作业全局状态的定期快照。这保证了主节点不会覆盖先前状态，而是不断创建具有递增 ID 的额外快照。此内部状态快照用于在主节点故障期间的恢复。


  至此，对三种服务（主节点、工作节点和协调器）的设计与实现的回顾告一段落。到目前为止，本章重点介绍了正常执行路径，并未花太多篇幅介绍容错性问题。这将是本章剩余部分的主题。


  ## 容错


  如前所述，Giraph 的许多架构都是由有效解决分布式计算谬误所反映的问题的需求所驱动的。最大问题往往是，在 Giraph 典型的运行规模下，没有任何东西可以假设是可靠的。


  ### 它多久会损坏一次？


  众所周知，谷歌是管理世界信息的权威。但鲜为人知的是，基于其构建和运营大型数据中心的记录，谷歌已成为数据中心建设和维护领域的领先权威之一。公司对其数据中心内所有内容的设计都极为谨慎，但根据谷歌研究员
  Jeff Dean（在他的“构建大规模分布式系统的软件工程建议”演讲中）的说法，即便如此，许多事情仍然会出错。


  在每个集群的第一年，通常会发生 1,000 次单独的机器故障；以及数千次硬盘故障。Dean 表示，会发生一次电源分配单元故障，导致 500 到 1,000 台机器停机约
  6 小时；会发生 20 次机架故障，每次导致 40 到 80 台机器从网络消失；会有 5 个机架“出现问题”，其一半的网络数据包丢失；并且集群将需要重新布线一次，在
  2 天的时间内，随时影响 5% 的机器。而且，集群有大约 50% 的可能性过热，在不到 5 分钟内导致大多数服务器宕机，并需要一到两天进行恢复。


  到目前为止，在本章中，您已经看到了 Giraph 为抵御各种故障场景而采用的许多技术。本节将审视这些场景，并回顾 Giraph 从磁盘故障、节点故障和网络故障中恢复所必须采取的步骤。


  ### 磁盘故障


  如前所述，Giraph 不关心存储管理。然而，它确实与各种存储层交互以实现以下目标：


  *   读取初始图数据，并可能在应用程序运行结束时输出最终图数据。大多数情况下，数据来自 HDFS；但随着可用于其他存储框架的 Giraph 输入/输出格式数量的增加，HDFS
  可能不再被使用。

  *   在计算过程中存储每个顶点状态的检查点。与为将 Giraph 连接到各种数据源提供无限灵活性的输入/输出格式不同，在检查点方面，灵活性非常有限。目前，Giraph
  实现只能使用 Hadoop 兼容的文件系统，但大多数情况下使用的是标准的 HDFS。


  对于这两种用例，当磁盘发生故障时会发生什么在很大程度上取决于所使用的存储底层。对于正确部署和配置的 HDFS，Giraph 不会注意到每天几个磁盘的故障率。HDFS
  专门设计用于在后台处理这类故障，并向客户端屏蔽它们。这是通过将所有数据的副本保存在至少三个节点上（一个在同一服务器机架上，一个在不同服务器机架上）来实现的。至于元数据（文件名和块之间的映射），它通常也存储在几个备选位置。这使得基于
  HDFS 之上的存储框架（HBase、Hive 等）运行的 Giraph 检查点和输入/输出格式非常可靠，并且不关心典型数据中心的磁盘故障率。在正确配置的 HDFS
  部署上，Giraph 应用程序因磁盘故障而失败需要一组非常不可能的事件（托管同一块的所有三个磁盘同时发生故障）。


  当然，无论多么不可能，它仍然可能发生。此外，还存在用于非 HDFS 后端存储框架的输入/输出格式。这些框架可能不像 HDFS 那样容忍单个磁盘故障。无论哪种方式，如果磁盘发生故障并且存储框架无法静默恢复，则错误会传递到
  Giraph 层面。此时，如果错误是在输入/输出格式读取或写入数据时遇到的，则应用程序将以错误消息失败。




  ### 节点故障


  由于集群中的节点通常托管着多种不同的服务，分析节点故障时发生的情况，一种有用的方法是观察某个特定服务发生故障时会发生什么。这样，单个节点的故障可以视为一个复杂事件，即其托管的所有服务同时发生故障。


  #### Giraph 主节点故障


  主节点服务可能处于两种状态之一：它可能在竞选活跃主节点的竞标中被阻塞，或者它本身正作为一个活跃主节点运行。处于竞标阻塞状态的主节点服务没有任何内部状态。因此，当它发生故障时，唯一重要的事件是，它在协调服务中用于宣告竞选活跃主节点资格的
  znode 会消失。不存在需要恢复的内部状态（因为被阻塞的主节点没有任何状态），并且可以非常容易地启动额外的主节点服务（并等待其变为活跃状态）。


  活跃主节点的故障则更为复杂。如果活跃主节点发生故障，其临时顺序 znode 也会消失，该事件会唤醒所有因竞标而阻塞的主节点服务。这些主节点服务中的一个会发现它的
  znode 现在是 `_masterElectionDir` 的第一个子节点，并会继续成为活跃主节点（其余节点则继续保持竞标阻塞状态）。由于活跃主节点将其大部分状态保存在协调服务中，新任命的主节点无需恢复故障主节点的状态。即使是聚合器的值也无需恢复，因为它们是在每个超步结束时从它们被分配到的
  worker 那里获取的。


  总而言之，无论活跃主节点在何处发生故障，新的活跃主节点都可以从协调当前超步的起始点开始，从其他服务获取状态，并重演前一个主节点故障之前的所有步骤。


  #### Girap Worker 节点故障


  Worker 服务的目的是管理分配给它的图分区和聚合器。这意味着，与主节点服务不同，故障的 worker 会丢失大量与其关联的独特状态。这些状态对每个 worker
  都是唯一的，且没有冗余，Giraph 若因一个 worker 故障就不得不重启整个计算过程，这是不可取的。幸运的是，正如本章前面提到的，您可以通过使用检查点来保护长时间运行的计算免受这种风险的影响。


  在进一步讨论检查点之前，请回忆一下，一个 worker 服务会经历两个阶段：拆分加载阶段和超步循环。在拆分加载阶段（被指定为 ID 为 -1 的伪超步），每个
  worker 负责加载初始图数据，将其转换为顶点和/或边，并通过网络 API 调用将这些对象发送给归属的 worker。每个 worker 会尝试加载尽可能多的输入分片。主节点监控整体进度，并等待所有输入分片被加载并（可能）在接收的
  worker 上设置检查点。如果在拆分加载阶段有任何 worker 发生故障，主节点将中止整个应用的运行。这种方法意味着在拆分加载阶段不需要特殊的恢复机制。


  拆分加载阶段之后，每个 worker 进入超步循环。如果启用了检查点，则可以确保初始图数据已安全存储在 HDFS 中。从那时起，每当一个健康的 worker 发生故障时，其临时
  znode 会从 `_workerHealthyDir` 中消失，协调服务会通知活跃主节点。收到此通知后，活跃主节点会声明当前超步失败，立即从最后一个设置检查点的超步重新启动其自身的超步循环，并指示所有健康的
  worker 加载对应于该最后检查点超步的状态。一旦完成，计算继续进行，当前超步就是最后一个检查点超步加一。当然，如果未启用检查点，即使是单个 worker 的丢失也意味着整个应用运行会立即终止，并被标记为故障。


  #### ZooKeeper 服务故障


  ZooKeeper 的架构设计使其能够通过将其状态可靠地复制到大多数节点，从而能够抵抗其集合中单个节点发生的故障。它还保证了节点在宕机或与服务的其他部分断开连接后，能够重新加入集合的可靠流程。只要集合中的大多数节点可用，服务就将是可用且一致的。


  从客户端角度来看，单个 ZooKeeper 节点故障会触发连接丢失事件。但由于客户端会获得集合中所有节点的列表，它们可以尝试重新连接到仍在正常运行的节点。


  如果 Giraph 使用外部 ZooKeeper 服务，集合中的节点数量是预先确定的，无法更改。如果 Giraph 管理其自身的协调服务节点，您可以通过设置 `giraph.zkServerCount`
  配置属性来控制集合的大小。默认值为 1，这不允许任何形式的恢复。如果您必须使用 Giraph 管理的协调服务运行，请务必将此值设置为至少 3。通常，明智的做法是将其设置为奇数，因为与较小的奇数相比，偶数并不会显著提高整个服务的可靠性。例如，如果您将其设置为
  4，ZooKeeper 最多只能容忍一个节点故障（因为如果超过一个节点发生故障，剩余的一两个节点将无法构成多数）。这与将其设置为 3 没有区别，后者也最多只能容忍一个节点故障。




  ### 网络故障


  当一个节点无法再与集群中的某个节点子集通信时，就会发生网络故障。一种特别棘手的网络故障类型被称为网络分区，这种情况发生在集群节点的两个子集之间无法相互通信，但每个子集内部的节点之间仍然保持完美的通信能力。


  网络故障主要通过两种方式影响 Giraph。首先，网络错误可能会阻止组成正在运行的 Giraph 应用程序的各个服务（主节点、工作节点和协调节点）之间的通信。正如你在本章中所见，整个图计算是通过主节点和工作节点服务使用一组支持网络的
  API 调用进行通信来完成的。主节点和工作节点通过基于 Netty 实现的 `NettyClient` 和 `NettyServer` 相互通信。通常，`NettyClient`
  实现会尽可能采用异步方式。在一个超步（superstep）中发起的远程 API 调用是非阻塞的，它们会进入一个待处理请求队列，等待异步处理。当待处理请求队列被清空时，该超步被认为已完成。这是通过依赖于同步方法
  `waitAllRequests()` 来实现的，该方法会阻塞，直到所有未完成的 API 调用都完成。但它并非仅仅是被动阻塞；它会持续轮询待处理请求的状态，轮询频率由
  `giraph.waitingRequestMsecs` 属性（默认值为 15 秒）决定。每个 API 请求在待处理请求队列中停留的时间不会超过 `giraph.maxRequestMilliseconds`
  属性（默认值 10 分钟）所设定的时间。任何耗时超过此限制的请求都将被视为失败并被重新发送。待处理请求队列的大小由 `giraph.maxNumberOfOpenRequests`
  属性（默认值为 10,000）决定。


  由于与协调服务的通信并非基于 Netty，而是依赖于原生的 ZooKeeper Java API，因此其工作方式略有不同，并且依赖于一组不同的超时和轮询间隔。如你所见，`ZooKeeperExt`
  类的对象管理着主节点和工作节点与协调服务的连接。在其初始化过程中，它期望接收到以下与网络相关的 ZooKeeper 客户端设置的值：


  - 连接处于故障状态多久后，与整个 ZooKeeper 集合（ensemble）的整个会话被声明为超时（由配置属性 `giraph.zkSessionMsecTimeout`
  设置，默认值为 1 分钟）。

  - 在放弃之前，重试连接到 ZooKeeper 集合的次数（由 `giraph.zkOpsMaxAttempts` 属性设置，默认值为 3）。

  - 因连接丢失而重试之前等待的时间。此超时间隔由两个属性控制。客户端侧的 `giraph.zkOpsRetryWaitMsecs` 属性（默认值 5 秒）决定主节点和工作节点连接到
  ZooKeeper 集合的超时时间。`giraph.zkServerlistPollMsecs` 属性控制某些内部操作的相同超时时间，也用于按需启动协调服务节点（而不是使用永久性的
  ZooKeeper 集合）。其默认值为 3 秒。


  最后，Giraph 可能不知道的是，与网络相关的故障可能会影响其所交互服务的内部状态。例如，如果你正在使用一个外部的 ZooKeeper 集合，并且网络分区将该集合一分为二，那么不同的主节点和工作节点最终可能会与单个
  ZooKeeper 集合的不同子集进行交互。ZooKeeper 服务有责任确保它采取一切必要措施，向所有 Giraph 主节点和工作节点呈现一个一致的世界视图。你最不希望看到的就是一个活跃的主节点对工作节点的认知与工作节点自身报告的情况不一致。这种情况可能发生在以下场景：少数工作节点将其状态报告给
  ZooKeeper 集合的一部分，而这部分集合当前与主节点所连接的集合子集处于分区状态。这种情况之所以不会发生，与 ZooKeeper 如何对抗网络分区有关；描述
  ZooKeeper 的实现超出了本书的范围。


  请记住，每当 Giraph 服务与外部分布式服务通信时，它们都依赖这些服务要么报告错误，要么维持其世界模型的完全一致性。通常，Giraph 的架构设计并不适用于与最终一致性服务进行交互。


  ## 总结


  本章涵盖了以下主题：


  - Giraph 框架的高层架构概览

  - 共同构成 Giraph 实现的内部服务的详细解读

  - Giraph 如何利用 Apache Hadoop 处理所有底层集群管理任务，同时通过将 Giraph 业务逻辑放入独立的 `GraphTaskManager`
  类中，保持了足够的灵活性，允许接入其他集群管理框架

  - Giraph 如何使用 Apache ZooKeeper 实现来处理其所有协调任务，以及各个 Giraph 服务用于相互通信的 znode 树的整体结构

  - 故障场景和可扩展性挑战的回顾，以及 Giraph 如何处理它们


  本章的关键要点是，Giraph 架构从根本上围绕着三种类型的内部网络服务（主节点、工作节点和协调节点）构建，这些服务以分布式方式运行，并共同协调每个超步需要完成的工作：


  - 工作节点由两个阶段定义：设置阶段和超步循环阶段。每个阶段都涉及处理由活跃主节点分配给每个工作节点的特定分区数据（输入数据或图数据）。

  - 主节点在协调工作节点的分区分配（针对输入数据和图数据）以及协调工作节点在阶段之间和超步之间的转换方面发挥着核心作用。

  - 协调节点构成一个 ZooKeeper 集合，让主节点和工作节点能够相互协调，同时跟踪 Giraph 服务分配中角色的整体构成。


  在本章中，你了解了每个服务特有的各种“旋钮”，以及这些旋钮的不同设置如何影响 Giraph 应用程序的整体执行（例如，通过 `giraph.zkServerCount`
  设置主节点数量，或通过为 `giraph.checkpointFrequency` 设置非零值来指定检查点间隔）。总的来说，Giraph 的实现具有极高的可调性；为了理解改变其行为的方法，你需要深入研究
  Giraph 的源代码（从 `GiraphConstants` 开始）或查阅位于 [`http://giraph.apache.org/options.html`](http://giraph.apache.org/options.html)
  的手册。


  尽管本章技术细节较多，但它提供了 Giraph 实现内部机制的一个重要概述——这在任何时候需要调试或调优 Giraph 应用程序时都非常有用。有一件事你还没有花太多时间研究，那就是
  Giraph 如何通过其灵活的输入/输出格式扩展与外部存储框架进行交互。这将是下一章的重点。



