- "# 4 在每个超步结束后，于每个工作节点上调用\n\n要理解如何扩展`WorkerContext`抽象类，首先必须了解`WorkerContext`对象的生命周期。对于\
  \ Giraph 作业运行的每个机器工作节点，Giraph 都会创建一个`WorkerContext`实例。在你的算法开始执行之前，Giraph 会为每个工作节点调用`preApplication()`方法。你可以使用此方法来设置`WorkerContext`。执行开始后，Giraph\
  \ 会在每个超步开始前调用每个`WorkerContext`的`preSuperstep()`方法。超步结束后，Giraph 会调用`postSuperstep()`方法。最后，在你的算法执行完毕时，Giraph\
  \ 会为每个工作节点调用`postApplication()`方法。在算法的整个执行过程中，顶点计算可以通过调用`getWorkerContext()`方法来访问`WorkerContext`对象。\n\
  \n接下来，你将看到如何在我们特定的场景中实现这些方法。你将创建一个`WorkerContext`，用于联系外部服务以获取性别分类器对象，并将其共享给同一工作节点上的所有顶点。清单\
  \ 9-4 展示了实现。\n\n清单 9-4\\. `WorkerContext`的示例实现\n\n```\npublic class MyWorkerContext\
  \ extends WorkerContext {\n\n    private GenderClassifier classifier;          \
  \    #1\n\n    @Override\n    public void preApplication() throws InstantiationException,\n\
  \        IllegalAccessException {\n        classifier = getClassifierFromService();\
  \        #2\n    }\n\n    public GenderClassifier getClassifier() {\n        return\
  \ classifier;                              #3\n    }\n\n}\n```\n\n#1 保存性别分类器的变量\n\
  \n#2 在应用程序启动前从外部服务加载数据\n\n#3 提供对分类器变量的访问权限\n\n首先，`WorkerContext`实现包含一个`GenderClassifier`类型的变量，这与原始算法中的类型相同，用于保存所有顶点将要共享的信息。回想一下，在这种情况下，你需要访问一个外部服务并读取一些数据以在所有顶点之间共享。这是一个你只需要执行一次的步骤，因为这些数据在算法执行过程中不会改变。`preApplication()`方法是执行此操作的理想选择。你使用此方法从外部服务获取分类器，使用与之前相同的\
  \ API 调用来连接服务。这确保了数据在任何顶点的计算发生之前被加载，并且只加载一次。在此示例中，你将保持`WorkerContext`类的其他方法为空。\n\
  \n现在，让我们看看如何修改算法，以便从顶点计算方法内部访问分区上下文中维护的共享数据。这如清单 9-5 所示。\n\n清单 9-5\\. 修改后的算法以访问`WorkerContext`中的共享数据\n\
  \n```\npublic static class CountFollowersByGender\n    extends AbstractComputation<\
  \ Text, Text, NullWritable, Text, Text> {\n\n    @Override\n    public void compute(Vertex<Text,\
  \ Text, NullWritable> vertex,\n        Iterable<Text> messages) throws IOException\
  \ {\n\n        if (getSuperstep()==0) {\n            MyWorkerContext context = (MyWorkerContext)getWorkerContext();\
  \   #1\n            GenderClassifier classifier = context.getClassifier();     \
  \      #2\n            String gender = classifier.get(vertex.getId());\n       \
  \     sendMessageToAllEdges(vertex, new Text(gender));\n            voteToHalt();\n\
  \            return;\n        }\n\n        int femaleFollowers = 0;\n        int\
  \ maleFollowers = 0;\n\n        for (Text msg : messages) {\n            if (msg.toString().equals(\"\
  female\")) {\n                femaleFollowers++;\n            } else {\n       \
  \         maleFollowers++;\n            }\n        }\n\n        String vertexValue\
  \ =\n            \"female:\"+femaleFollowers+\", male:\"+maleFollowers;\n      \
  \  vertex.setValue(new Text(vertexValue));\n        voteToHalt();\n    }\n\n}\n\
  ```\n\n#1 获取工作上下文的引用并将其转换为你的实现类型\n\n#2 获取`WorkerContext`中包含的`GenderClassifier`对象\n\
  \n在这个实现中，唯一的区别在于你如何获取`GenderClassifier`对象。你不会每次都从外部服务读取它，而是从一个已经为你加载好它的`WorkerContext`对象中获取它。Computation\
  \ API 提供了`getWorkerContext()`方法，该方法返回`WorkerContext`对象。请记住，此方法返回的是`WorkerContext`父类的对象，因此在你开始使用它之前，必须将其强制转换为刚刚实现的类型。此时，你可以随心所欲地访问它。在这种情况下，你只需获取`GenderClassifier`对象的引用，并像之前一样使用它即可。\n\
  \n通过使用这种基于分区计算的简单概念，你不仅成功简化了应用程序，还使其更加高效。这种方式避免了为每个顶点加载和维护一个共享数据结构。这节省了计算开销、通信开销和内存，因为你不再需要多次复制相同的数据结构。本质上，你在此案例中所做的只是创建了一个简单的对象缓存，该缓存一次填充，然后在所有顶点之间重用。一旦你开始构建更复杂的应用程序，这项技术可能会非常有用。\n\
  \n最后你必须注意的一个细节是，如何告诉 Giraph 在启动作业时使用特定的`WorkerContext`实现。与 Giraph 的许多可定制方面一样，你可以在启动作业时将其作为命令行参数传递。具体来说，你可以将`giraph.workerContextClass`参数设置为你`WorkerContext`实现的完整类名。你可以通过在命令行中添加以下内容来实现：\n\
  \n```\n–ca giraph.workerContextClass=MyWorkerContext.\n```\n\n\n\n### 使用案例：每工作节点性能统计\n\
  \n每工作节点计算的另一个有用场景，是监控并计算算法运行时的细粒度统计信息。请注意，Giraph 已经为您维护了一些总体统计信息，例如总处理时间、图的总体规模等。除此之外，您还可以在\
  \ Giraph 任务的日志中找到有用的性能统计信息。然而，您可能希望维护更精细的算法性能视图，例如检测特定于应用程序的性能问题。例如，您可能希望计算每个工作节点持有的顶点数，或每个工作节点发生的计算次数，以监控计算在各工作节点间的分布均匀程度。\n\
  \n为此，您将使用 `WorkerContext` 提供的相同功能：能够跨一个工作节点上的所有顶点共享一个对象。在此案例中，该对象持有性能统计信息，并可被每个顶点计算访问和修改。\n\
  \n在了解如何实现之前，我们先确定要维护的信息类型。在这个场景中，您希望统计每个工作节点上顶点计算的发生次数。这能让您了解每个工作节点的处理负载，并可能有助于检测节点间分布不均的情况。在应用程序结束时，您还需要以某种方式输出这些信息，以便呈现给运行算法的人。\n\
  \n现在，假设您已经构建了一个名为 `Performance` 的类，用于保存运行时性能信息，例如顶点计算次数。我们将保持此类简单，并假设它只包含一个递增计算次数的方法。显然，您可以扩展此类并维护更多的性能指标，如代码清单\
  \ 9-6 所示。\n\n**代码清单 9-6.** 用于维护简单性能统计的类\n\n```java\npublic class Performance {\n\
  \    private int numComputations;         #1\n    public void getNumComputations()\
  \ {   #2\n        return numComputations;\n    }\n    public void incNumComputations()\
  \ {   #3\n        numComputations++;\n    }\n}\n```\n\n#1 保存工作节点上的顶点计算次数  \n#2 返回当前工作节点的计算次数\
  \  \n#3 将工作节点的计算次数增加 1\n\n接下来，您将实现一个 `WorkerContext`，通过它来操作这些性能统计信息。在此应用程序中，您需要在每次\
  \ compute 方法执行时更新性能统计信息；同时还需要输出这些统计信息。让我们看看代码清单 9-7 中 `WorkerContext` 的实现。\n\n**代码清单\
  \ 9-7.** 用于维护性能统计的 `WorkerContext` 实现\n\n```java\npublic class PerfStatsWorkerContext\
  \ extends WorkerContext {\n    private Performance perf;\n\n    @Override\n    public\
  \ void preApplication()\n        throws InstantiationException, IllegalAccessException\
  \ {\n        perf = new Performance();                               #1\n    }\n\
  \n    synchronized public void incComputations() {\n        perf.incComputations();\
  \                                 #2\n    }\n\n    @Override\n    public void postApplication()\
  \ {                            #3\n        String id =\n            getContext().getConfiguration().get(\"\
  mapred.task.id\");  #4\n        Counter counter =                              \
  \         #5\n            getContext().getCounter(                             #5\n\
  \                \"Worker Computations\",                          #5\n        \
  \        \"Worker_\"+id);                                  #5\n        counter.increment(perf.getNumComputations());\
  \           #5\n    }\n\n    @Override\n    public void postSuperstep() {      \
  \                        #6\n        String id =\n            getContext().getConfiguration().get(\"\
  mapred.task.id\");\n        Counter counter =\n            getContext().getCounter(\
  \                             #7\n                \"Worker Computations\",     \
  \                     #7\n                \"Worker_\"+id);                     \
  \             #7\n    }\n```\n\n\n\n`\"Worker_\"+id+\"_\"+getSuperstep()`;     \
  \                `#7`\n\n`counter.increment(perf.getNumComputations());`\n\n`}`\n\
  \n`}`\n\n## 性能统计\n\n`#1` 初始化性能统计类\n`#2` 在每个顶点计算时调用\n`#3` 在最后输出统计数据\n`#4` 获取工作节点\
  \ ID\n`#5` 获取 Hadoop 计数器并设置值\n`#6` 在每个超步后输出统计信息，用于细粒度分析\n`#7` 根据工作节点 ID 和超步号构造计数器\n\
  \n## 使用`Mapper.Context`\n\n通常你可能需要从`Mapper.Context`对象中获取一些配置信息，该对象继承自 Hadoop。每个\
  \ Giraph 工作节点都被实现为一个 Hadoop 映射器，`Mapper.Context`提供了映射器配置的相关信息。在这个场景中，你使用它来：（i）获取映射器的唯一索引，即`mapred.task.id`属性的值，也就是\
  \ Giraph 工作节点的唯一索引；（ii）访问 Hadoop 计数器接口。\n\n在此场景中，`WorkerContext`实现包含一个名为`Performance`的字段来保存统计信息。你使用`preApplication()`方法初始化该字段。该`WorkerContext`实现还提供了一个名为`incComputations()`的公共方法，通过调用`Performance`对象中的相应方法来增加计算次数。接下来你将看到如何以及何时调用此方法。\n\
  \n此外，你实现了`postApplication()`方法，用于输出算法执行期间收集的信息，即每个工作节点的总计算次数。除此之外，你还希望计算并输出所有工作节点的总计算次数。换句话说，你希望聚合不同工作节点维护的部分统计信息。Giraph\
  \ 提供了多种向用户输出信息的方式。例如，第 7 章讨论了输出格式。这里，你使用了另一种机制，一种从 Hadoop 借鉴的机制，称为计数器。Hadoop 计数器通过简单的\
  \ API 使统计信息的聚合和输出变得容易。\n\n除了最终的计算次数，你可能还想以更细的粒度衡量此指标，并观察每个超步期间的性能。你可以在`WorkerContext`的`postSuperstep()`方法中轻松执行相同的操作。Giraph\
  \ 在每个超步结束后调用此方法，在算法执行期间提供详细信息。\n\n## 使用 Hadoop 计数器\n\n计数器是 Hadoop 提供的一种机制，用于以友好的方式向用户输出有用的统计信息。如果你运行过\
  \ Hadoop 或 Giraph 作业，你应该已经在输出中看到过计数器。Hadoop Web 界面或终端中显示的输出包含此类计数器。\n\n计数器通常属于一个具有特定名称的计数器组，例如“Giraph\
  \ Stats”。每个组可能包含多个计数器，每个计数器都有一个名称和关联值。例如，Giraph 计数器组包含显示每个超步所用时间的计数器。\n\n你可以使用 Hadoop\
  \ API 在代码中创建新计数器并为其赋值。实际上，计数器类似于聚合器；你可以从代码中的任何位置根据计数器名称递增其值，Hadoop 会负责计算计数器值的最终总和。\n\
  \n现在让我们来看最后缺失的部分：如何在应用程序内部更新性能统计信息。清单 9-8 展示了一个计算函数的实现。你省略了计算的细节，专注于如何访问`WorkerContext`。可以想象，这可以是任何你实现的计算。\n\
  \n**清单 9-8.** 从应用程序内部修改性能统计信息\n\n```\npublic class MyComputation extends BasicComputation\
  \ {\n\n    @Override\n    public void compute(Vertex<I, V, E> vertex,\n        Iterable<M1>\
  \ messages) {\n\n        PerfStatsWorkerContext context =        #1\n          \
  \  (PerfStatsWorkerContext)getWorkerContext();\n\n        context.incComputations()\
  \               #2\n        ...                                       #3\n     \
  \   ...                                       #3\n    }\n}\n```\n\n`#1` 获取工作上下文句柄\n\
  `#2` 增加计算次数\n`#3` 执行剩余的计算逻辑\n\n在`compute()`方法内部，你只需获取工作上下文对象的引用。回想一下，你需要先将其强制转换为自定义实现的类型。之后，你可以使用任何已实现的自定义功能。在此示例中，你只是递增了计算次数。至此，实现已完成。请记住，要启用此`WorkerContext`实现，你必须在命令行中添加以下选项：\n\
  \n`–ca giraph.workerContextClass=PerfStatsWorkerContext`\n\n如果忘记这样做，Giraph 将使用默认实现，并且在运行时显然无法将`WorkerContext`对象强制转换为你的自定义实现。\n\
  \n\n\n### Giraph 中的线程安全\n\n前两节介绍的两个用例都利用了同一功能——在顶点之间共享`WorkerContext`，但有一个重要区别：在第一个用例中，顶点只读取共享数据结构，而在第二个用例中，它们还会修改该数据结构。作为\
  \ Giraph 用户，你需要关注这一区别，因为它会影响程序的线程安全性。\n\n你一定已经注意到，尽管本书整本都在讲述并行算法的设计与实现，但这是第一次讨论线程安全。在编写并行程序时，这通常是一个重要问题，也往往是各种问题的根源。不过，截至目前你所使用的\
  \ Giraph 核心编程模型，刻意隐藏了所有复杂的同步和线程安全问题。当你编写以顶点为中心的程序时，无需担心顶点是否同时执行，也无需关心它们的计算顺序。在 BSP\
  \ 模型中，你假设每个顶点的计算都是独立的，并通过消息进行显式同步。\n\n然而，随着`WorkerContext`的引入，你开始接触到 Giraph 内部机制的更多细节。这带来了你已看到的益处，但同时也要求你更加谨慎。具体来说，你现在必须意识到，同一`WorkerContext`实例可能被多个线程同时访问。回想一下，Giraph\
  \ 将图分割成多个分区，而单个工作机可能持有多个分区。每个分区的处理可能由不同的线程完成，从而利用同一工作机内部的并行化机会。\n\n因此，你必须确保应用程序的线程安全性。在某些情况下，你可能只读取`WorkerContext`维护的数据结构，因此保证线程安全相对容易。前面的例子——从外部服务读取数据并让所有顶点读取——就属于这一类。在其他情况下，比如性能监控示例，你可能还会修改`WorkerContext`对象。在该示例中，你通过`incComputations()`方法实现了这一点。你可能已经注意到，你将此方法声明为`synchronized`，因为你预计该方法会被不同线程调用。这确保了性能统计数据的一致访问与修改。随着你在`WorkerContext`内部维护越来越复杂的数据结构，线程安全是需要关注的问题。\n\
  \n**注意**\n\n你无需对实现的`preApplication()`、`postApplication()`、`preSuperstep()`和`postSuperstep()`方法进行同步。Giraph\
  \ 在每个超步中只调用这些方法一次。\n\n在本节中，你重新审视了图的分区与分布概念，并学习了如何通过每次工作计算来利用其优势。你只了解了可以用`WorkerContext`实现的一小部分功能。你可以发挥更多创意，找到更高级的使用方式。通常，这需要你对算法有更多的信息和理解。无论如何，你应记住：将某些共享进程或共享数据从主应用逻辑中提取出来，放入`WorkerContext`中，可能会提升算法的性能。接下来，你将更进一步，学习如何实际控制\
  \ Giraph 在工作机之间对图进行分区的方式。\n\n### 控制图分区\n\n到目前为止，你并未关心 Giraph 如何将图分割成多个分区，因为这并不影响你编写算法。仔细想想，你只是在逻辑层面指定了每个顶点的计算和消息交换。顶点位于何处、消息如何交换其实并不重要。即使你在上一节进行了每工作机计算，你也无需关心工作机持有哪些顶点；Giraph\
  \ 抽象了这些细节。\n\n在本节中，你将进一步探讨 Giraph 如何并行化处理的具体细节，特别是 Giraph 如何对图进行分区。你将看到，尽管 Giraph\
  \ 在工作机之间分配图的方式不会影响算法的正确执行，但它可能会对图算法的执行性能产生影响。你将简要了解智能分区如何提升性能，然后重点关注 Giraph 为用户提供的可自由控制图分区的机制。\n\
  \n\n\n### 分区的重要性\n\n在深入探讨`Giraph` API 的细节之前，我们先来看看为什么需要关注图分区。图分区决定了图的不同顶点如何分配到各个分区，并以不同方式影响算法执行的性能。首先，它直接影响图算法执行期间集群上的网络流量。我们通过图\
  \ 9-2 中的示例图来理解这一点，看看不同分区策略对网络流量的影响。\n\n![A978-1-4842-1251-6_9_Fig2_HTML.jpg](img/A978-1-4842-1251-6_9_Fig2_HTML.jpg)\n\
  \n**图 9-2.** 一个包含六名用户的社交网络示例图\n\n假设你的集群只有两台工作机器`A`和`B`，并且`Giraph`以随机方式将图分区到这些机器上。具体来说，`Giraph`会计算顶点\
  \ ID（本例中为用户名称）的哈希值。如果哈希值为偶数，则将顶点分配到机器`A`；如果为奇数，则分配到机器`B`。这几乎等同于随机决定顶点的放置位置，就像`Giraph`掷硬币一样，将顶点分配到两台机器中的一台。实际上，这就是`Giraph`的默认分区策略。假设最终放置结果如图\
  \ 9-3 所示。\n\n![A978-1-4842-1251-6_9_Fig3_HTML.jpg](img/A978-1-4842-1251-6_9_Fig3_HTML.jpg)\n\
  \n**图 9-3.** 六节点社交图在两台工作机器上的示例分区\n\n### Giraph 中的哈希分区\n\n`Giraph`中的默认分区策略是哈希分区。假设`Giraph`需要将图划分到`P`个分区中。对于每个顶点，`Giraph`计算顶点\
  \ ID 的哈希码`H`，然后计算`H mod P`（即`H`除以`P`的余数）。该运算的结果就是该顶点所属的分区。\n\n哈希分区是一种非常常见的数据分区技术。它计算简单，并且能实现数据项（本例中为顶点）在分区间的均匀分布。\n\
  \n现在，假设在算法某个超步的执行过程中，每个顶点都向其所有邻居发送一条消息。这是一种非常常见的模式；例如，你在第 3 章中看到的`PageRank`算法就是这样运行的。从该图中可以明显看出，有\
  \ 10 条消息会跨机器传输，从而在集群上产生网络流量。其余消息，例如从 Natalie 发送给 Anna 的消息，则会在各工作机器的内存内部进行交换。\n\n\
  接下来，我们看看如果不采用掷硬币式的随机放置方式，而是以更智能、更知情的方式来决定顶点放置，会发生什么。具体来说，我们尝试确保每个顶点的大部分邻居都位于同一台工作机器上。图\
  \ 9-4 展示了另一种分区方案。目前，我们假设你有办法指示`Giraph`按照你的意愿放置顶点。\n\n![A978-1-4842-1251-6_9_Fig4_HTML.jpg](img/A978-1-4842-1251-6_9_Fig4_HTML.jpg)\n\
  \n**图 9-4.** 另一种跨两台工作机器的分区方案，产生的网络流量更少\n\n显然，就产生的网络流量而言，这种分区方案更为有利。图中只有一条图边跨越了两台工作机器，因此只有两条消息通过网络传输：一条从\
  \ Peter 到 Anna，另一条从 Anna 到 Peter。\n\n尽管对于如此小的图，不同的分区方案在性能上可能看不出明显差异，但当你开始使用真实的大型图时，分区就变得至关重要了。跨工作机器的大量消息会给你的网络带来巨大负担，可能影响可扩展性并增加`Giraph`作业的处理时间。\n\
  \n请注意，寻找好的分区方案是图管理研究的一个完整领域，可能取决于多种因素，例如图的类型和所使用的算法。研究不同的分区技术超出了本章的范围。相反，我们这里重点介绍`Giraph`\
  \ API，它允许你插入不同的分区方案。也就是说，一旦你找到了将顶点映射到分区的合适技术，就可以通过 API 提供的一种简便方式将其插入`Giraph`，并在执行过程中强制执行该映射。后续小节将对此进行介绍。\n\
  \n\n\n### 实现自定义分区器\n\n如您所见，Giraph 使用的默认哈希分区技术并未考虑产生的网络流量，因此您可能希望用更智能的分区方式替换它。通常，您可以通过实现一个名为\
  \ `WorkerGraphPartitioner` 的接口来完成此操作，该接口负责将顶点分配给各个分区。\n\n为了说明该接口的用法，我们将以网页图为例，描述一种在处理如图\
  \ 9-5 所示的网页图时常用的替代分区技术。\n\n![A978-1-4842-1251-6_9_Fig5_HTML.jpg](img/A978-1-4842-1251-6_9_Fig5_HTML.jpg)\n\
  \n图 9-5. 一个网页图示例\n\n回顾一下，网页图描述了网页之间如何通过链接相互连接。在第 3 章中，您看到了可能希望在网页图上运行的算法示例，例如 PageRank。在此图中，顶点代表网页，边代表从一个页面到另一个页面的链接。在\
  \ Giraph 中，您将网页 URL 用作顶点的 ID。\n\n为简单起见，假设我们的计算集群再次由两台工作机器 A 和 B 组成。和之前一样，如果使用默认的哈希分区，Giraph\
  \ 会随机放置顶点，分区结果将如图 9-6 所示，其中有多条边跨越这两台机器。\n\n![A978-1-4842-1251-6_9_Fig6_HTML.jpg](img/A978-1-4842-1251-6_9_Fig6_HTML.jpg)\n\
  \n图 9-6. 在两个工作节点上对网页图进行基于哈希的分区\n\n在这个网页图中，我们可以采用一种更好的方法。请记住，在 Twitter 图的例子中，智能分区基于这样一个理念：您应尽最大努力将某个顶点及其邻居顶点放在同一个工作节点上。在小型\
  \ Twitter 图中，这很简单，您只需直观地查看图就能轻松完成分配。在这里，我们将使用一种更有原则性的策略来决定放置代表网页的顶点的位置。具体来说，该策略基于这样一个事实：网页上的大多数链接都指向通常位于同一域名下的其他网页。例如，`cnn.com/index.html`\
  \ 上的大多数链接都指向诸如 `cnn.com/technology.html` 和 `cnn.com/economy.html` 之类的页面，这些页面都属于\
  \ `cnn.com` 域名。这应该已经让您对如何划分图有了提示。我们将使用一种类似哈希分区的技术，但不是对顶点 ID 进行哈希，而是仅对域名前缀进行哈希；例如，前缀\
  \ `cnn.com`。这确保了具有相同域名下 URL 的顶点被放置在同一工作节点上。图 9-7 展示了这种分区方式。\n\n![A978-1-4842-1251-6_9_Fig7_HTML.jpg](img/A978-1-4842-1251-6_9_Fig7_HTML.jpg)\n\
  \n图 9-7. 基于每个网页域名前缀对同一网页图的分区\n\n接下来，我们将研究如何实现 `WorkerGraphPartitioner` 来应用此逻辑。但在深入分区器的核心之前，我们先介绍一些您必须首先实现的辅助性但必要的其他接口。\n\
  \n首先，您必须实现 `GraphPartitionerFactory` 接口。`GraphPartitionerFactory` 对象负责创建实际分区器实现的实例。具体来说，Giraph\
  \ 使用 `GraphPartitionerFactory` 来实例化 `MasterGraphPartitioner` 和 `WorkerGraphPartitioner`\
  \ 对象，以执行所有主要操作。在代码清单 9-9 中，您可以看到该接口中您必须实现的仅有的两个方法。\n\n**代码清单 9-9.** `GraphPartitionerFactory`\
  \ 接口\n\n```\npublic interface GraphPartitionerFactory<I extends WritableComparable,\n\
  \    V extends Writable, E extends Writable> extends\n    ImmutableClassesGiraphConfigurable\
  \ {\n```\n\n\n\n"
- "# 排版后的内容：\n\n`MasterGraphPartitioner<I, V, E> createMasterGraphPartitioner();`\
  \  #1\n\n`WorkerGraphPartitioner<I, V, E> createWorkerGraphPartitioner();`  #2\n\
  \n`}`\n\n#1 实例化并返回一个 `MasterGraphPartitioner` 对象  \n#2 实例化并返回一个 `WorkerGraphPartitioner`\
  \ 对象\n\n在深入探讨这些接口的具体实现之前，我们首先描述它们的作用，并展示需要实现的各个方法。随后，你将逐一实现它们，以实现实际的哈希分区技术。\n\n\
  第一个接口 `MasterGraphPartitioner` 主要负责建立和维护用于存储所有分区信息的必要数据结构。其方法如列表 9-10 所示。稍后将通过一个示例对其进行详细说明。\n\
  \n**列表 9-10.** `MasterGraphPartitioner` 接口\n\n```\npublic interface MasterGraphPartitioner<I\
  \ extends WritableComparable,\n    V extends Writable, E extends Writable> {\n\n\
  \  Collection<PartitionOwner> createInitialPartitionOwners(\n      Collection<WorkerInfo>\
  \ availableWorkerInfos, int maxWorkers); #1\n\n  Collection<PartitionOwner> generateChangedPartitionOwners(\n\
  \      Collection<PartitionStats> allPartitionStatsList,\n      Collection<WorkerInfo>\
  \ availableWorkers,\n      int maxWorkers,\n      long superstep);             \
  \                                 #2\n\n  Collection<PartitionOwner> getCurrentPartitionOwners();\
  \           #3\n\n  PartitionStats createPartitionStats();                     \
  \       #4\n}\n```\n\n#1 基于可用工作节点创建 `PartitionOwner` 对象  \n#2 在每个超步开始时调用，用于潜在创建新的\
  \ `PartitionOwner` 对象  \n#3 返回当前 `PartitionOwner` 对象的列表  \n#4 返回一个用于保存分区统计信息的对象\n\
  \n这里最重要的数据结构是 `PartitionOwner`。`PartitionOwner` 封装了关于分区本身的信息，也包含了拥有该分区的工作机器（即该分区所在的工作机器）的信息。如你所见，`MasterGraphPartitioner`\
  \ 负责创建一组 `PartitionOwner` 对象，这些对象通常描述当前场景的配置；也就是说，运行任务的工作节点集合以及将图分割成的分区数量。\n\n`PartitionOwner`\
  \ 实际上是一个接口，根据你想要维护的分区所有者元数据类型，它可以有不同的实现。在这里，我们不深入探讨 `PartitionOwner` 接口的细节，而是使用\
  \ Giraph 已经提供的实现 `BasicPartitionOwner`。`BasicPartitionOwner` 主要包含它所对应的分区 ID，以及该分区所在工作节点的信息。这种\
  \ `PartitionOwner` 的实现应该足以满足大多数场景。\n\n但现在让我们看看如何利用这些来实现一个基于哈希的分区器。首先，你实现 `GraphPartitionerFactory`\
  \ 接口。实现相当简单，如列表 9-11 所示。\n\n**列表 9-11.** 一个 `GraphPartitionerFactory` 实现示例\n\n```\n\
  public class HashPartitionerFactory<I extends WritableComparable,\n    V extends\
  \ Writable, E extends Writable>\n    implements GraphPartitionerFactory<I, V, E>\
  \ {\n\n  private ImmutableClassesGiraphConfiguration conf;                  #1\n\
  \n  @Override\n  public MasterGraphPartitioner<I, V, E> createMasterGraphPartitioner()\
  \ {\n    return new HashMasterPartitioner<I, V, E>(getConf());            #2\n \
  \ }\n\n  @Override\n  public WorkerGraphPartitioner<I, V, E> createWorkerGraphPartitioner()\
  \ {\n    return new HashWorkerPartitioner<I, V, E>();                     #3\n \
  \ }\n\n  @Override\n  public ImmutableClassesGiraphConfiguration getConf() {\n \
  \   return conf;                                                     #4\n  }\n\n\
  \  @Override\n```\n\n\n\n`public void setConf(ImmutableClassesGiraphConfiguration\
  \ conf) {`\n\n`this.conf = conf;                                               \
  \  #5`\n\n`}`\n\n`}`\n\n#1 持有作业配置的对象  \n#2 返回基于哈希的 `MasterGraphPartitioner` 实现实例\
  \  \n#3 返回基于哈希的 `WorkerGraphPartitioner` 实现实例  \n#4 返回配置对象  \n#5 在工厂初始化时调用，用于设置配置对象\
  \  \n\n在此实现中，你可以看到工厂仅实例化了两个对象：类型分别为 `MasterGraphPartitioner` 和 `WorkerGraphPartitioner`。接下来，让我们更详细地查看\
  \ `HashMasterPartitioner` 的实现，以了解设置 `PartitionOwner` 数据结构的典型方式（参见清单 9-12）。\n\n**清单\
  \ 9-12.** `HashMasterPartitioner` 的实现\n\n```\npublic class HashMasterPartitioner<I\
  \ extends WritableComparable,\n    V extends Writable, E extends Writable> implements\n\
  \    MasterGraphPartitioner<I, V, E> {\n\n    private ImmutableClassesGiraphConfiguration\
  \ conf;                    #1\n    private List<PartitionOwner> partitionOwnerList;\
  \                     #2\n\n    public HashMasterPartitioner(ImmutableClassesGiraphConfiguration\
  \ conf) {\n        this.conf = conf;                                           \
  \     #3\n    }\n\n    @Override\n    public Collection<PartitionOwner> createInitialPartitionOwners(\
  \      #4\n        Collection<WorkerInfo> availableWorkerInfos, int maxWorkers)\
  \ {\n\n        int partitionCount = PartitionUtils.computePartitionCount(      \
  \ #5\n            availableWorkerInfos, maxWorkers, conf);\n\n        List<PartitionOwner>\
  \ ownerList = new ArrayList<PartitionOwner>();\n        Iterator<WorkerInfo> workerIt\
  \ = availableWorkerInfos.iterator();\n\n        for (int i = 0; i < partitionCount;\
  \ ++i) {\n            PartitionOwner owner =                                   \
  \    #6\n                new BasicPartitionOwner(i, workerIt.next());\n\n      \
  \      if (!workerIt.hasNext()) {                                   #7\n       \
  \         workerIt = availableWorkerInfos.iterator();\n            }\n\n       \
  \     ownerList.add(owner);                                        #8\n        }\n\
  \n        this.partitionOwnerList = ownerList;\n        return ownerList;\n    }\n\
  \n    @Override\n    public Collection<PartitionOwner> getCurrentPartitionOwners()\
  \ {\n        return partitionOwnerList;\n    }\n\n    @Override\n    public Collection<PartitionOwner>\
  \ generateChangedPartitionOwners(\n        Collection<PartitionStats> allPartitionStatsList,\n\
  \        Collection<WorkerInfo> availableWorkerInfos,\n        int maxWorkers,\n\
  \        long superstep) {\n\n        return PartitionBalancer.balancePartitionsAcrossWorkers(\n\
  \            conf,\n            partitionOwnerList,\n            allPartitionStatsList,\n\
  \            availableWorkerInfos);\n    }\n\n    @Override\n    public PartitionStats\
  \ createPartitionStats() {\n        return new PartitionStats();\n    }\n\n}\n```\n\
  \n#1 保存配置  \n#2 维护 `PartitionOwner` 对象的列表  \n#3 构造 `HashMasterPartitioner` 时，需传入作业配置\
  \  \n#4 在执行前调用，用于创建初始的 `PartitionOwner` 对象集  \n#5 获取分区数量，通常是一个配置选项  \n#6 为每个分区创建一个分区所有者，并指定下一个可用的工作节点\
  \  \n#7 如果已为所有工作节点分配了分区，则重新开始  \n#8 创建后，将 `PartitionOwner` 添加到维护的列表中  \n\n`HashMasterPartitioner`\
  \ 实现中最重要的方法是 `createInitialPartitionOwners()`。该方法首先计算你想要的分区数量。这个数字通常是一个配置参数，可能取决于集群中的总核心数等因素。之后，它为每个分区创建一个\
  \ `PartitionOwner` 对象，并以轮询方式将其分配给一个可用的工作节点。在此处，你可以应用自己的逻辑。例如，如果通过某些外部服务能够获取每个工作节点的负载信息，你可以将其纳入分区分配策略中。最后，该方法仅返回所创建的\
  \ `PartitionOwner` 对象列表。\n\n接下来，你需要实现 `generateChangedPartitionOwners()` 方法。Giraph\
  \ 会在每个超步执行后调用此方法，让你有机会根据需要更改工作节点的初始分区分配。例如，可能是因为你发现某个工作节点崩溃了，此时需要将其分区分配给另一个工作节点。另一种可能的情况是，你注意到某个工作节点最终拥有的分区超出了其处理能力，此时你可能希望将部分处理任务卸载到另一台工作节点上。在所有这些情况下，每个超步结束后，你都可以通过为分区选择新位置来调整分区。但请注意，不允许更改顶点到分区的分配。\n\
  \n在此特定实现中，修改分区所有者的决策被委托给一个名为 `PartitionBalancer` 的特殊辅助类。简而言之，`PartitionBalancer`\
  \ 确保每个工作节点被分配大致相同的工作量，从而提供良好的集群利用率。关于平衡器及其重要性的讨论将推迟到下一节。在那里，你还会看到如何在运行时通过 `generateChangedPartitionOwners()`\
  \ 修改分区。\n\n`createPartitionStats()` 方法返回一个 `PartitionStats` 类型的对象，该对象保存有关分区的有用统计信息。这些统计信息包括分区中的顶点和边数量，以及此分区中顶点发送的消息数。这些统计信息对于应用依赖运行时行为的复杂分区技术可能很有用。更具体地说，你可以使用该类维护的信息来决定当\
  \ Giraph 调用 `generateChangedPartitionOwners()` 方法时如何更新分区所有者。Giraph 已经提供了一个基础的 `PartitionStats`\
  \ 类，其中包含最常见的统计信息，你可以继续使用它。如果你需要，也可以自由扩展此类以维护更多信息，以适应你的特定场景。\n\n现在你已经实现了所有辅助类，接下来就可以实现由\
  \ `WorkerGraphPartitioner` 接口定义的分区器主要逻辑了。一旦 Giraph 使用分区器工厂和 `HashMasterPartitioner`\
  \ 创建了 `PartitionOwner` 对象集合，它就可以将顶点分配给已构建的分区所有者。这就是 `WorkerGraphPartitioner` 的工作。其方法在清单\
  \ 9-13 中说明。\n\n**清单 9-13.** `WorkerGraphPartitioner` 接口\n\n```\npublic interface\
  \ WorkerGraphPartitioner<I extends WritableComparable,\n    V extends Writable,\
  \ E extends Writable> {\n\n    PartitionOwner createPartitionOwner();          \
  \               #1\n    PartitionOwner getPartitionOwner(I vertexId);          \
  \        #2\n    Collection<PartitionStats> finalizePartitionStats(            \
  \ #3\n        Collection<PartitionStats> workerPartitionStats,\n        PartitionStore<I,\
  \ V, E> partitionStore);\n    PartitionExchange updatePartitionOwners(         \
  \              #4\n        WorkerInfo myWorkerInfo,\n        Collection<? extends\
  \ PartitionOwner> masterSetPartitionOwners,\n        PartitionStore<I, V, E> partitionStore);\n\
  \    Collection<? extends PartitionOwner> getPartitionOwners();     #5\n\n}\n```\n\
  \n#1 创建一个空的 `PartitionOwner` 对象  \n#2 将顶点 ID 映射到 `PartitionOwner`  \n#3 在超步结束时调用\
  \  \n#4 确定哪些分区必须从特定工作节点发送  \n#5 返回当前的 `PartitionOwner` 对象列表  \n\n\n\n`getPartitionOwner()`方法是其中最重要的，它接收一个顶点\
  \ ID 作为输入，并返回该顶点对应的`PartitionOwner`对象。Giraph 使用此方法来决定顶点的放置位置。接下来，将通过一个基于哈希的分区器示例，解释`GraphWorkerPartition`接口的所有方法。清单\
  \ 9-14 展示了这些方法的实现。\n\n**清单 9-14. `HashWorkerPartitioner` 实现**\n\n```\npublic class\
  \ HashWorkerPartitioner<I extends WritableComparable,\nV extends Writable, E extends\
  \ Writable>\nimplements WorkerGraphPartitioner<I, V, E> {\n\n    protected List<PartitionOwner>\
  \ partitionOwnerList =               #1\n        Lists.newArrayList();\n\n    @Override\n\
  \    public PartitionOwner createPartitionOwner() {\n        return new BasicPartitionOwner();\
  \                             #2\n    }\n\n    @Override\n    public PartitionOwner\
  \ getPartitionOwner(I vertexId) {\n        URL url = new URL(vertexId.toString());\
  \                      #3\n        String domain = url.getHost();              \
  \                  #3\n        return partitionOwnerList.get(                  \
  \              #4\n            Math.abs(domain.hashCode() % partitionOwnerList.size()));\n\
  \    }\n\n    @Override\n    public Collection<PartitionStats> finalizePartitionStats(\n\
  \        Collection<PartitionStats> workerPartitionStats,\n        PartitionStore<I,\
  \ V, E> partitionStore) {\n        return workerPartitionStats;\n    }\n\n    @Override\n\
  \    public PartitionExchange updatePartitionOwners(\n        WorkerInfo myWorkerInfo,\n\
  \        Collection<? extends PartitionOwner> masterSetPartitionOwners,\n      \
  \  PartitionStore<I, V, E> partitionStore) {\n        return PartitionBalancer.updatePartitionOwners(partitionOwnerList,\n\
  \            myWorkerInfo, masterSetPartitionOwners, partitionStore);\n    }\n\n\
  \    @Override\n    public Collection<? extends PartitionOwner> getPartitionOwners()\
  \ {\n        return partitionOwnerList;\n    }\n}\n```\n\n#1 保存当前`PartitionOwner`对象的列表\
  \  \n#2 创建一个空的`BasicPartitionOwner`对象  \n#3 从 URL 中提取域名  \n#4 在域名上应用哈希分区逻辑  \n\n\
  基于哈希的分区逻辑核心位于`getPartitionOwner()`方法内部。给定一个顶点 ID（即网页 URL），该方法从 URL 中提取域名，然后计算域名的哈希码，并求其除以分区数的余数。结果指示指定顶点应被分配到哪个分区。\n\
  \n请注意，本例中的分区逻辑非常简单，但你可以在该方法内放置任意逻辑，甚至可以连接到负责维护图分区的外部服务。\n\n此外，你还需要实现`updatePartitionOwners()`方法。Giraph\
  \ 会在每个超步结束时调用此方法，用于确定是否以及哪些分区需要从其他工作节点发送过来。此决策同样委托给了`PartitionBalancer`，稍后将对此类进行介绍。\n\
  \n最后，既然你已经实现了自定义分区器的所有必要部分，你可能会想知道如何实际告知 Giraph 使用它们。要启用自定义分区器，只需将参数`giraph.graphPartitionerFactoryClass`设置为你分区器工厂的完整类名即可。像往常一样，你可以通过命令行完成此操作。\n\
  \n在此特定场景中，启动作业时需要在命令行中添加 `–ca giraph.graphPartitionerFactoryClass=HashPartitionerFactory`\
  \ 选项。其余的工作 Giraph 会自动处理。\n\n### 分区平衡\n\n在前面关于分区的讨论中，你只了解了分区如何影响网络流量，并进而影响应用程序性能。分区还有另一个可能影响性能的方面，称为分区平衡。通常，当所有工作节点包含大致相同数量的顶点或边时，分区是平衡的。但首先，让我们看看平衡为何重要。\n\
  \n考虑之前看到的图，并设想在工作节点间有第三种分区方式，如图 9-8 所示。\n\n![A978-1-4842-1251-6_9_Fig8_HTML.jpg](img/A978-1-4842-1251-6_9_Fig8_HTML.jpg)\n\
  \n图 9-8. 非平衡分区示例\n\n这是一种完全有效的图分区方式，但它存在一个问题。注意，工作节点 A 包含的顶点数远多于工作节点 B，此处是后者的两倍。因为机器上顶点数量越多，其\
  \ CPU 负载也越大；这种图在工作节点间的不均匀分布同样会导致 CPU 负载的不平衡。结果，部分工作节点（此处为工作节点 B）未被充分利用，从而无法获得集群的最大性能。\n\
  \n相反，均匀分布工作负载可以有效利用集群资源，并减少总处理时间。`PartitionBalancer` 是一个辅助类，其方法可以找到分区的正确放置位置，从而实现平衡分区。本质上，它利用分区\
  \ API 提供的能力，通过 `GraphMasterPartitioner` 的 `generateChangedPartitionOwners()` 方法和\
  \ `WorkerGraphPartitioner` 的 `updatePartitionOwners()` 方法在运行时修改分区位置——正如你之前所见。\n\n\
  重要的是，`PartitionBalancer` 支持不同类型的平衡。第一种平衡类型称为顶点平衡，确保每个工作节点持有大致相同数量的顶点。除此之外，它还支持边平衡，尝试确保所有工作节点包含大致相同数量的边。哪种更合适取决于你要运行的算法类型，以及每个工作节点的\
  \ CPU 负载取决于其持有的顶点数还是边数。\n\n以你在 第 4 章 中见到的 PageRank 算法为例，它用于网页排名。在 PageRank 中，每个顶点从其邻居接收消息，每条消息携带一个数值。对于接收到的每条消息，顶点执行一次运算，将消息值累加至其本地排名值。因此，顶点完成的总工作量主要取决于其具有的邻居（即边）数量。所以，为了在工作节点间均匀分布工作负载，你希望每个工作节点拥有大致相同数量的边。\n\
  \n通常，在顶点平衡和边平衡之间进行选择需要对你算法的计算和通信模式有深入了解。通常，只需将算法的计算和通信模式与某些其他算法（如 PageRank）进行比较，你可能就能理解哪种平衡类型更合适。无论如何，正确平衡分区可以积极影响算法性能和集群资源利用率。\n\
  \n\n\n## 概要\n\nGiraph 的编程核心 API 隐藏了其并行化图处理过程的细节。与此同时，通过向用户开放这一过程，你能够编写出更高效的应用程序。\n\
  \n-   在某些应用场景下，可能需要跨顶点共享数据，这乍看起来会打破以顶点为中心的计算模型。\n-   在这种情况下，`WorkerContext` 变得非常有用。它允许你在每个\
  \ Worker 的基础上进行计算，并在同一 Worker 上的所有顶点之间共享数据结构。这既能简化你的应用，也能提升性能。\n-   不要忘记，使用 `WorkerContext`\
  \ 可能会引发线程安全问题。某些应用可能会修改 `WorkerContext` 持有的数据，并且这种修改可能由不同线程并发进行。请务必将方法声明为 `synchronized`，以避免竞态条件。\n\
  -   图的分区方式会对应用的可扩展性和性能产生重大影响。\n-   默认情况下，Giraph 使用哈希分区，这是一种常见的做法，能使图在机器之间均匀分布，但可能导致较高的网络流量。\n\
  -   以智能方式对图进行分区通常取决于具体的图和应用程序。\n-   一旦你为你的场景确定了合适的分区方案，请使用 `WorkerGraphPartitioner`\
  \ 及其所有相关接口来实现自定义分区器。\n\n最后几章重点介绍了 Giraph 的内部机制和更高级的特性。在下一章中，我们将延续这一思路。你会再次回顾如何从各种存储系统读取图以及将图写入其中，但这次我们将探讨更高级的存储系统（例如\
  \ HBase）的场景，它能使你将 Giraph 连接到任何数据源。\n\n"
- "# 10. 高级输入输出\n\n本章内容包括\n\n-   使用 Hive 表进行输入输出\n-   通过 Gora 访问数据\n\n在本章中，我们将继续探讨\
  \ Giraph 的更高级特性，重点介绍读取输入数据和写入输出数据的方法。回想一下，你的输入图通常以某种特殊格式存储在存储系统上，因此必须指示 Giraph 如何从你的存储系统读取数据，以及如何将其转换为内部表示形式；即，使用\
  \ `VertexInputFormat` 和 `EdgeInputFormat` 实现来创建顶点和边。例如，在第 7 章中，你了解了从 Hadoop 分布式文件系统（HDFS）读写数据的基础知识，这些数据通常为文本格式，这是存储图数据的一种非常常见的场景。\n\
  \n然而，HDFS 并非唯一的选择。有各种各样的存储系统和不同格式可以存储你的数据。例如，你可以使用 NoSQL 类型的存储系统（如 Hive 和 HBase）以半结构化表格的形式存储数据。Accumulo\
  \ 是另一个分布式键值存储，它允许你以表格格式存储数据，并提供访问控制机制以实施与安全相关的策略。像 Redis 这样的内存数据存储也越来越流行，因为它们允许低延迟的数据访问。\n\
  \n为了支持所有这些不同的存储选项，Giraph 提供了一个 API，使得扩展至不同格式和存储系统变得容易。除此之外，它还提供了针对多种存储系统的这些 API\
  \ 的实现。\n\n在本章中，你将研究两个特定的存储系统案例：Hive 和 Gora。请注意，本章的目标并非穷举所有系统或数据格式。相反，通过本章学习，你将了解如何定制现有的\
  \ API 实现，或扩展它以满足你的特定应用场景。\n\n## 访问 Hive 中的数据\n\n首先，你将了解基于表格的格式——特别是 Hive。通常，用于存储数据的基于表格的格式非常普遍。Hive\
  \ 允许你将数据视为半结构化表格，并使用类似 SQL 的查询语言查询数据。Hive 运行在 Hadoop 集群之上。Hive 表存储在 HDFS 上，Hive\
  \ 查询作为 Hadoop 作业执行，为存储和查询半结构化表数据提供了一个可扩展的平台。基于这些原因，它是一种流行的存储系统。\n\nHive 表按行存储数据，每行由多个列组成。在\
  \ Hive 中，一行中各列包含的数据数量和类型是预先协商好的；这就是表的模式（schema）。\n\n在这里，你将看到 Hive 表如何存储代表输入图的信息。现在，就像你在早期章节中看到的基于文本的输入格式一样，Hive\
  \ 表可能以基于边或基于顶点的格式存储有关输入图的数据。在基于边的格式中，一行 Hive 数据包含构建一条边所需的所有信息；即，边两个端点的标识符及其边值。在基于顶点的格式中，一行\
  \ Hive 数据可能包含构建一个顶点所需的所有信息；即，顶点 ID、其值以及该顶点所有边的信息。例如，在基于顶点的格式中，一个 Hive 列可能包含一个顶点所有边的列表。\n\
  \n\n\n### 读取输入数据\n\n假设你正在运营一个微博客服务，用户可以发布文章并与其他用户分享。通常，每当有人发布这样的文章时，你需要将其存储起来以便进一步分析。例如，找出哪些用户发布的文章最多，过去一周哪些用户互动最频繁，用户最常讨论的话题是什么，以及其他有用的指标。基于表的存储是存储这些数据的好选择。表\
  \ 10-1 展示了一个如何存储这些数据的示例。\n\n**表 10-1.** 示例服务中存储文章分享事件的表\n\n| user | shared_with\
  \ | date | article |\n| --- | --- | --- | --- |\n| George | John | 2015-03-01 |\
  \ [`www.cnn.com/big-data-economy.html`](http://www.cnn.com/big-data-economy.html)\
  \ |\n| Mary | Nick | 2015-02-14 | [`www.howto.com/analyze-graphs.html`](http://www.howto.com/analyze-graphs.html)\
  \ |\n| Mark | George | 2015-04-29 | [`www.techcrunch.com/monetize-data.html`](http://www.techcrunch.com/monetize-data.html)\
  \ |\n| John | Maria | 2015-03-02 | [`www.cnn.com/big-data-economy.html`](http://www.cnn.com/big-data-economy.html)\
  \ |\n| Maria | Mark | 2015-03-03 | [`www.cnn.com/big-data-economy.html`](http://www.cnn.com/big-data-economy.html)\
  \ |\n| … | … | … | … |\n| … | … | … | … |\n\n尽管可能不那么显而易见，但在你服务中活跃的用户会形成一种网络。每当用户\
  \ A 与另一个用户分享一篇文章时，这就构成了两个用户之间的连接。现在假设 George 是你服务中一个受欢迎且活跃的用户，你希望了解 George 发布的文章在你的服务中传播速度有多快。换句话说，一旦\
  \ George 发布一篇文章，它在到达所有用户之前需要被分享多少次？\n\n这种分析听起来可能很熟悉；你本质上是在计算用户之间的距离。在第 4 章中，你看到了如何编写一个\
  \ Giraph 应用来计算用户之间的最短路径。这正是你在这里需要的。既然你已经了解了如何计算这个指标，本章中你将只关注如何从输入表数据中构建输入图。\n\n\
  现在，回顾一下，Giraph 提供了两种基本的输入格式：基于边和基于顶点。在基于边的格式中，你的数据包含图中顶点连接的信息；而在基于顶点的格式中，数据包含顶点本身的信息。如果你查看表\
  \ 10-1，会发现它存储了关于哪个用户与特定另一个用户分享文章的信息；也就是说，用户之间的连接。\n\n与基于文本的格式和 HDFS 一样，Giraph 已经抽象了从\
  \ Hive 表读取数据的大部分细节，并提供了一个你需要实现的简单接口。实现这个接口基本上需要你指定如何从表行创建一条边，就像你在表 10-1 中看到的那样。回想一下，一条边定义的组成部分包括：源顶点\
  \ ID、目标顶点 ID 以及边值。这些就是你必须从 Hive 表行中提取的信息。但让我们来看一下你需要实现的具体方法。稍后，你将通过一个针对特定场景的示例实现看到它们的作用。清单\
  \ 10-1 展示了 Giraph 提供的 `SimpleHiveToEdge` 抽象类。\n\n**清单 10-1.** 用于将 Hive 行转换为边对象的\
  \ `SimpleHiveToEdge` 类\n\n```\npublic abstract class SimpleHiveToEdge<I extends\
  \ WritableComparable,\nE extends Writable> extends AbstractHiveToEdge<I, E> {\n\n\
  \  public abstract I getSourceVertexId(HiveReadableRecord hiveRecord);\n  public\
  \ abstract I getTargetVertexId(HiveReadableRecord hiveRecord);\n  public abstract\
  \ E getEdgeValue(HiveReadableRecord hiveRecord);\n}\n```\n\n这是你可能需要实现的最简单的类，用于从\
  \ Hive 读取数据。你需要实现的第一个方法 `getSourceVertexId()` 接收一个 `HiveReadableRecord` 类型的对象作为输入，该对象是\
  \ Hive 行的一个抽象。该方法的作用是从 `HiveReadableRecord` 中构建源顶点 ID。你稍后会看到如何实现。第二个方法 `getTargetVertexId()`\
  \ 有类似的作用，即从 Hive 记录中提取目标 ID。最后，通过 `getEdgeValue()` 方法，你定义了给定输入 Hive 记录时的边值。注意，与前几章中看到的输入格式一样，这种输入格式也有参数：顶点\
  \ ID 的类型（`I`）和边值的类型（`E`）。\n\n现在，让我们看看所有这些方法的实际应用。在这个特定场景中，你感兴趣的 Hive 表中有两列：“user”列将成为边的源，“shared_with”列将成为边的目标。顶点\
  \ ID 代表用户的名称，因此在你的实现中，它们属于 `Text` 类型。清单 10-2 展示了实现。\n\n**清单 10-2.** 使用 `IntWritable`\
  \ 顶点 ID 和 `NullWritable` 边值的边的示例实现\n\n```\npublic class TextNullHiveRowToEdge\n\
  \  extends SimpleHiveToEdge<Text, NullWritable> {\n\n  @Override\n  public NullWritable\
  \ getEdgeValue(HiveReadableRecord hiveRecord) {\n    return NullWritable.get();\n\
  \  }\n\n  @Override\n  public Text getSourceVertexId(HiveReadableRecord hiveRecord)\
  \ {\n    return new Text(hiveRecord.getString(0));\n  }\n\n  @Override\n  public\
  \ Text getTargetVertexId(HiveReadableRecord hiveRecord) {\n    return new Text(hiveRecord.getString(1));\n\
  \  }\n}\n```\n\n首先，注意所有方法都接收一个 `HiveReadableRecord` 类型的对象作为输入，该对象代表一个 Hive 记录，本质上就是表的一行。在你的实现中，你将使用\
  \ `HiveReadableRecord` 类的方法来访问 Hive 行的不同列。\n\n让我们逐一查看方法的实现。第一个方法 `getEdgeValue()`\
  \ 必须返回一个代表边值的对象。在这个特定场景中，你不想为边分配特定值；相反，它的类型是 `NullWritable`，因此该方法简单地通过静态方法 `NullWritable.get()`\
  \ 返回一个 `NullWritable` 对象。\n\n接下来，你必须读取源 ID 和目标 ID。你已经知道边的源 ID 位于行的第一列，目标 ID 位于第二列。`HiveReadableRecord`\
  \ 允许你通过列索引（索引从 0 开始）来检索行中存储的数据。清单 10-3 展示了 `HiveReadableRecord` 接口的所有方法。\n\n**清单\
  \ 10-3.** 使用 `HiveReadableRecord` 接口的方法从 Hive 表行的列中访问各种类型的数据\n\n```\npublic interface\
  \ HiveReadableRecord {\n  int numColumns();\n  int numPartitionValues();\n  HiveType\
  \ columnType(int index);\n  Object get(int index, HiveType type);\n  boolean getBoolean(int\
  \ index);\n  byte getByte(int index);\n  short getShort(int index);\n  int getInt(int\
  \ index);\n  long getLong(int index);\n  float getFloat(int index);\n  double getDouble(int\
  \ index);\n  String getString(int index);\n  <K, V> Map<K, V> getMap(int index);\n\
  \  <T> List<T> getList(int index);\n  boolean isNull(int index);\n}\n```\n\n\n\n\
  ### Giraph 与 Hive 集成：输入与输出格式\n\n另一个你必须注意的方面是每列所存储的数据类型。每一列可能存储不同类型的数据。例如，用户名可能以字符串形式存储在列中；而日期可能以`long`类型的时间戳形式存储在列中。根据每列的数据类型，你需要使用`HiveReadableRecord`接口的相应方法。在上一个代码清单中，你可以看到该接口提供了访问所有基本类型数据的方法，例如整数、浮点数、字符串，以及列表和映射等结构。\n\
  \n回到你的实现，现在你将看到如何实现`getSourceVertexId()`和`getTargetVertexId()`方法。你使用`HiveReadableRecord`接口的`getString()`方法来分别检索索引为\
  \ 0 和 1 的列，因为这些列是字符串类型，然后将其放入`Text`对象中。这样就完成了。\n\n现在唯一缺少的是指示 Giraph 使用这个特定的输入格式实现，并告诉它从哪个\
  \ Hive 表读取数据。你将在启动 Giraph 作业时使用熟悉的`-eif`命令行参数来完成此操作。\n\n请注意，这里并未讨论实际计算的实现。重要的是 Giraph\
  \ 允许你在不同存储系统的数据上运行相同的计算，而无需更改代码。你只需编写一个输入格式，其余部分保持不变。事实上，在很多情况下，你甚至不需要编写自己的实现。Giraph\
  \ 代码库已包含多种从 Hive 表读取数据的输入格式实现。其中一种可能已经适用于你的特定场景。\n\n在本例中，输入图以基于边的格式存储。如前所述，在 Hive\
  \ 中也可以使用基于顶点的输入格式。尽管我们不深入细节，但 Hive 中基于顶点的输入格式的概念与你在前几章中看到的基于文本的格式并无太大差异。Giraph 提供了一个接口，用于将单个\
  \ Hive 行（就像基于文本格式中的文本行一样）转换为一个顶点。清单 10-4 展示了你需要实现的接口。\n\n#### 清单 10-4. 用于将 Hive\
  \ 行转换为顶点对象的 `SimpleHiveToVertex` 类\n\n```\npublic abstract class SimpleHiveToVertex<I\
  \ extends WritableComparable,\n    V extends Writable, E extends Writable>\n   \
  \ extends AbstractHiveToVertex<I, V, E> {\n\n    public abstract I getVertexId(Row\
  \ record);\n    public abstract V getVertexValue(Row record);\n    public abstract\
  \ Iterable<Edge<I, E>> getEdges(Row record);\n}\n```\n\n与基于顶点的格式类似，在这种情况下，你必须指定如何从行中提取以下信息：顶点的\
  \ ID、顶点的值以及顶点的边。与基于边的格式一样，你可以使用`HiveReadableRecord`接口提供的方法访问 Hive 表的列。作为练习，我们建议你实现一个基于顶点的输入格式，从表\
  \ 10-2 构建图。\n\n#### 表 10-2. 基于顶点格式的示例输入 Hive 表\n\n| user | shared_with |\n| ---\
  \ | --- |\n| George | {John, Mark} |\n| Mary | {Nick, Maria, Mark, George} |\n|\
  \ Mark | {George} |\n| John | {Maria, Helen, George} |\n| Maria | {Mark, John, Nick,\
  \ Helen} |\n| … | … |\n| … | … |\n\n该表包含与上一表类似的信息；只是在这种情况下，创建顶点所需的所有信息都在同一行中：代表用户的顶点\
  \ ID 以及该用户与之共享的人。\n\n### 写入输出数据\n\n到目前为止，我们讨论了如何从 Hive 读取输入数据，但你自然可能希望应用程序的输出存储在\
  \ Hive 表中。这样，你可以使用 Hive 查询语言轻松查询分析结果。在本节中，你将看到如何实现这一点。\n\n首先，让我们决定输出 Hive 表的结构。在这个特定场景中，你计算每个用户与\
  \ George 的距离。在最简单的形式中，输出表包含每个用户的计算距离（参见表 10-3）。\n\n#### 表 10-3. 示例 Hive 输出表\n\n\
  | user | value |\n| --- | --- |\n| George | 0 |\n| Mary | 4 |\n| Mark | 3 |\n| John\
  \ | 1 |\n| Maria | 2 |\n| … | … |\n| … | … |\n\n输出表每个用户包含一行。每行有一列用于存储用户名，称为“user”，包含字符串类型的数据，以及一列用于存储计算出的距离，称为“value”，包含双精度类型的数据。这里，我们假设此表已存在并具有此特定架构。如果你想了解更多关于如何创建\
  \ Hive 表的信息，请参考 Hive 文档。\n\n与输入格式类似，Giraph 抽象了大部分细节，让你能够轻松地用输出填充此表。实际上，你执行的是逆向操作；你告诉\
  \ Giraph 如何从顶点表中提取信息，以及如何将其放入表行中。让我们看一下清单 10-5 中所示的实现。\n\n#### 清单 10-5. 用于将顶点对象转换为\
  \ Hive 行的 `SimpleVertexToHive` 类\n\n```\npublic abstract class SimpleVertexToHive<I\
  \ extends WritableComparable,\n    V extends Writable, E extends Writable> extends\n\
  \    AbstractVertexToHive<I, V, E> {\n\n    public abstract void fillRecord(Vertex<I,\
  \ V, E> vertex,\n        HiveWritableRecord record);\n}\n```\n\n这里唯一需要实现的方法是`fillRecord()`方法，它接受一个`Vertex`对象和一个`HiveWritableRecord`对象作为输入。Giraph\
  \ 会为图中的每个`Vertex`调用此方法，并将`Vertex`对象作为输入传递。同时，它还会传入一个代表输出 Hive 表行的`HiveWritableRecord`对象。你的职责是指定如何用从`Vertex`对象中提取的信息填充该行。\n\
  \n与`HiveReadableRecord`类似，`HiveWritableRecord`接口提供了一组方法，使你可以轻松地将不同类型的信息存储到 Hive\
  \ 行的列中。这些方法如清单 10-6 所示。\n\n#### 清单 10-6. 用于修改 Hive 记录的方法\n\n```\npublic interface\
  \ HiveWritableRecord {\n    void set(int index, Object value, HiveType type);\n\
  \    void setBoolean(int index, boolean value);\n    void setByte(int index, byte\
  \ value);\n    void setShort(int index, short value);\n    void setInt(int index,\
  \ int value);\n    void setLong(int index, long value);\n    void setFloat(int index,\
  \ float value);\n    void setDouble(int index, double value);\n    void setString(int\
  \ index, String value);\n    void setMap(int index, Map value);\n    void setList(int\
  \ index, List value);\n    List<Object> getAllColumns();\n}\n```\n\n通常，你只需要指定要存储信息的列的索引以及要存储的值。除此之外，你需要确保根据表的架构（即每列存储的数据类型）使用正确的方法。\n\
  \n现在，我们来考虑你的特定场景。输出表有两列：一列是字符串类型，用于存储用户名；另一列是双精度类型，用于存储该用户的计算距离。清单 10-7 显示了实现。\n\
  \n#### 清单 10-7. 将顶点对象写入 Hive 行的示例实现\n\n\n\n### `public class` `MyVertexToHiveRow`\
  \ `extends`\n\n`SimpleVertexToHive<Text, DoubleWritable, NullWritable> {`\n\n`public\
  \ void` `fillRecord(Vertex<Text, DoubleWritable, NullWritable> vertex,`\n\n`HiveWritableRecord\
  \ record) {`\n\n`record.setString(0, vertex.getId().toString());`\n\n`record.setDouble(1,\
  \ vertex.getValue().get());`\n\n`}`\n\n`}`\n\n与输入表相同，你需要使用索引来标识所引用的列，列索引从 0 开始。请牢记，必须了解输出表的模式，并将正确的值写入正确的列。如果你试图将某个值写入类型不同的列，将会引发异常。\n\
  \n至此，输出格式的实现就结束了。现在，与输入格式类似，你需要指示 Giraph 使用此特定的输出格式实现，并告知它要将数据写入哪个 Hive 表。为此，你需要在启动\
  \ Giraph 作业时使用 `–of` 命令行参数。\n\n## 访问 Gora 中的数据\n\n接下来，让我们来看另一种存储系统，特别是内存存储系统。内存存储系统是另一类流行的系统，因为它们能提供快速的数据访问。本节将讨论\
  \ Apache Gora，这是一个提供内存数据模型的框架，同时也支持将数据持久化到不同的底层存储系统：数据库（如 MySQL）、列存储（如 HBase 和 Cassandra）、键值存储（如\
  \ Redis），甚至是 HDFS 上的简单文件。关于所支持存储系统的完整列表，请访问 Apache Gora 网站。\n\n虽然 Apache Gora 提供了对这些系统的持久化能力，但它抽象了如何持久化对象的细节，允许用户操作对象的内存表示，从而从编程角度来看，使得对象的访问和操作更加容易。通常，Gora\
  \ 系统被配置为映射底层存储系统中的数据；例如，将一个 HBase 行映射成一个内存中的 Java 对象。此后，用户可以像使用索引一样，根据对象键从 Gora\
  \ 中访问数据。\n\n在本节的剩余部分，你将了解如何使用 Giraph 的输入格式从 Gora 读取数据。本节不会涉及如何配置带有底层持久化存储系统的 Gora，也不会涉及如何定义底层存储系统与内存对象之间的映射。相反，你将了解如何访问内存中的\
  \ Gora 对象，并将它们转换为表示 Giraph 内部图的 `Vertex` 和 `Edge` 对象。\n\n你将使用与上一节相同的应用场景。输入数据代表一组相互分享文章的用户，从而形成一个社交网络，而你需要计算在这个社交网络中，所有用户与用户\
  \ George 之间的距离。\n\n### 读取输入数据\n\n让我们来看看如何从 Gora 内存存储系统读取输入数据。首先，回想一下，Gora 提供了一个内存数据模型。这意味着它是以\
  \ Java 对象的形式向应用程序提供数据。虽然底层数据可能持久化在不同的存储系统中，但作为用户，你操作的是其内存版本。这个转换工作交给 Gora 系统本身来处理。\n\
  \n我们暂时假设，Gora 中用户的内存表示是一个名为 `GoraUser` 的对象，其形式如清单 10-8 所示。\n\n**清单 10-8.** Gora\
  \ 内存数据模型中用户的一个示例表示\n\n```\npublic class GoraUser {\n    String name;\n    Map<String,\
  \ String> sharedArticles;\n}\n```\n\n这个对象代表一个用户，包含的信息与你之前在 Hive 中存储数据时看到的类似。每个用户都有一个用于标识自身的名字，以及一组与之分享文章的用户。`sharedArticles`\
  \ 映射包含从用户名到与该用户分享的文章的映射关系。为简单起见，这里假设一个用户只能与另一个用户分享一篇分享文章。\n\n与一般的输入格式一样，你需要决定是实现基于边的输入格式，还是基于顶点的输入格式。实际上，Giraph\
  \ 代码既包含基于边的实现，也包含基于顶点的实现，用于从 Gora 读取数据。现在，你应该已经注意到，内存中用户的表示包含了构建一个顶点所需的所有信息；因此，这里自然选择基于顶点的输入格式。\n\
  \n那么，让我们来看看为了从 Gora 读取基于顶点的数据，你需要实现的接口。不出所料，Gora 接口是通过扩展我们熟悉的 `VertexInputFormat`\
  \ 类来实现的。`GoraVertexInputFormat` 的许多设置细节已经实现好了。剩下的功能，如清单 10-9 所示，主要要求你创建一个 `GoraVertexReader`。\n\
  \n**清单 10-9.** 用于将内存对象转换为顶点对象的 `GoraVertexInputFormat`\n\n```\npublic abstract class\
  \ GoraVertexInputFormat\n    <I extends WritableComparable, E extends Writable>\n\
  \    extends VertexInputFormat<I, E> {\n\n    @Override\n    public abstract GoraVertexReader\
  \ createVertexReader(InputSplit split,\n        TaskAttemptContext context) throws\
  \ IOException;\n}\n```\n\n正如你在第 7 章中看到的，`VertexReader` 负责执行读取输入数据时的大部分工作；即，将输入数据转换为构成图的\
  \ `Vertex` 对象。特别地，`GoraVertexReader` 负责将内存中的 `Gora` 对象转换为 `Vertex`。清单 10-10 展示了为了能够从\
  \ Gora 读取数据，你需要实现的唯一方法。\n\n**清单 10-10.** `GoraVertexReader` API\n\n```\nprotected\
  \ abstract class GoraVertexReader extends VertexReader<I, V> {\n    protected abstract\
  \ Vertex<I, V> transformVertex(Object goraObject);\n}\n```\n\n请注意，所提供的 API 相当灵活。它向你传递一个通用的\
  \ Java 对象，并期望你将其转换为一个顶点。这个对象实际上就是你之前看到的用户内存表示，而你的输入格式实现则指定了如何将其转换为 Giraph 的 `Vertex`\
  \ 对象。让我们看看清单 10-11 中的实现。\n\n\n\n### 排版后的文本\n\n在深入细节之前，请注意该类如何将顶点 ID、顶点值和边值的类型作为参数。与上一节的应用场景类似，你将\
  \ ID 表示为 `Text` 类型的对象，将顶点值（即计算出的距离）表示为 `DoubleWritable` 类型的对象，最后，由于不关心边的值，你使用 `NullWritable`\
  \ 类型的对象。具体实现见代码清单 10-11。\n\n**代码清单 10-11.** 将 Gora 对象转换为顶点对象的示例实现\n\n```\npublic\
  \ class GoraUserVertexInputFormat\n    extends GoraVertexInputFormat<Text, DoubleWritable,\
  \ NullWritable> {\n\n  public GoraVertexReader createVertexReader(\n      InputSplit\
  \ split, TaskAttemptContext context) throws IOException {\n    return new GoraGVertexVertexReader();\n\
  \  }\n\n  protected class GoraGVertexVertexReader extends GoraVertexReader {\n\n\
  \    @Override\n    protected Vertex<LongWritable, DoubleWritable, FloatWritable>\n\
  \        transformVertex(Object goraObject) {\n\n      Vertex<LongWritable, DoubleWritable,\
  \ FloatWritable> vertex;\n      vertex = getConf().createVertex();             \
  \                      // #1\n\n      GoraUser user = (GoraUser) goraObject;   \
  \                           // #2\n\n      Text vrtxId = new Text(user.getName())\
  \                              // #3\n      DoubleWritable vrtxValue = new DoubleWritable(0);\
  \                   // #4\n\n      vertex.initialize(vrtxId, vrtxValue);       \
  \                        // #5\n\n      for (Map.Entry<String, String> entry : user.getSharedArticles())\
  \ {\n        String userName = entry.getKey();                                 //\
  \ #6\n        String article = entry.getValue();                               \
  \ // #6\n        Edge<Text, NullWritable> edge = EdgeFactory.create(\n         \
  \   new Text(userName), NullWritable.get());                      // #7\n      \
  \  vertex.addEdge(edge);                                             // #8\n   \
  \   }\n\n      return vertex;                                                  \
  \    // #9\n    }\n  }\n}\n```\n\n`#1` 创建一个空的顶点对象  \n`#2` 将输入的通用对象强制转换为 `GoraUser`\
  \ 特定类型  \n`#3` 提取名称并从中创建一个类型为 `Text` 的新顶点 ID  \n`#4` 顶点的初始值应为 0  \n`#5` 使用其 ID 和值初始化该空顶点对象\
  \  \n`#6` 遍历该用户的共享文章映射中的每个条目  \n`#7` 以条目的键作为目标 ID 创建一条边  \n`#8` 将每个新创建的边添加到顶点中 \
  \ \n`#9` 至此，你已经创建了顶点对象并可以返回它\n\n现在，让我们深入探讨该 API 的实现。第一步是创建一个空的 `Vertex` 对象，然后用来自\
  \ Gora 对象的信息填充它。回顾一下，Giraph 已经提供了一些实用方法来实例化对象，例如边和顶点。在这种情况下，你可以直接调用 `getConf().createVertex()`\
  \ 来创建一个空且未初始化的 `Vertex` 对象。接下来，你将看到如何用必要的信息（即它的值和边）来填充它。\n\n接下来，你需要提取内存中对象的信息。由于\
  \ API 的输入是一个通用对象，你首先需要将其转换为期望的内部表示形式；在本例中，就是 `GoraUser` 类。如果你尝试转换的类型与实际对象在内存中的表示不一致，这自然会在运行时抛出异常。\n\
  \n首先，你提取顶点的 ID。为此，你将使用 `GoraUser` 对象的“name”字段，假设用户名可以唯一标识一个用户。正如你已经看到的，在 Giraph\
  \ 中，你通常将字符串类型的 ID 表示为 `Text` 对象。类似地，从该字符串字段中，你创建一个新的 `Text` 对象来表示顶点 ID。\n\n然后，你设置顶点的值。回顾一下，在计算距离的算法中，顶点的初始值为零。你需要做的就是创建一个设置为\
  \ 0 的 `DoubleWritable` 对象。既然已经创建了顶点的 ID 和值，你可以调用 `Vertex.initialize()` 方法，将这些值设置到你新创建的\
  \ `Vertex` 对象中。\n\n最后，你将提取顶点的边。在这里，你假设每个用户对象以映射的形式存储该用户与他人共享的文章。顶点读取器实现会遍历所有包含用户-文章对的映射条目，并使用\
  \ `EdgeFactory` 实用类创建一条边。创建的每条边都有对应的用户名作为目标 ID，即映射条目的键。在这种场景下，你不需要边值，因此将其设置为 `NullWritable`。一旦创建了\
  \ `Edge` 对象，你就可以使用熟悉的 `Vertex.addEdge()` API 将其添加到顶点中。\n\n\n\n### 写入输出数据\n\n接下来，你将学习如何输出数据。在此情形下，你需要将顶点和对象的\
  \ Giraph 表示转换为 Gora 内存模型。同样，你无需担心 Gora 如何持久化对象——这由底层系统负责，从而简化了你的工作。Giraph 通过提供输出格式实现（`GoraVertexOutputFormat`\
  \ 和 `GoraEdgeOutputFormat`）来抽象这一过程的细节，并要求你实现几个方法，使整个过程变得简单。\n\n在深入输出格式实现的细节之前，与往常一样，你需要决定是否需要基于顶点或基于边的输出格式。在此例中，你需要输出作业计算出的每个顶点的距离，因此基于顶点的输出格式是自然选择。接下来，让我们看看你需要实现的\
  \ API。\n\n回顾一下，`VertexWriters` 是 Giraph 将`Vertex`对象输出到任意存储系统的方式。这里也不例外。Giraph 将这些细节抽象到`GoraVertexWriter`类中，如清单\
  \ 10-12 所示。\n\n清单 10-12\\. GoraVertexWriter API\n\n```\nprotected abstract class\
  \ GoraVertexWriter extends VertexWriter<I, V, E> {\n\n    protected abstract Object\
  \ getGoraKey(Vertex<I, V, E> vertex);\n\n    protected abstract Persistent getGoraVertex(Vertex<I,\
  \ V, E> vertex);\n\n}\n```\n\n该接口非常简单，只需要你实现两个方法。第一个方法`getGoraKey()`将`Vertex`对象作为输入，并返回一个键。这个键将用于在内存存储中唯一标识该对象。通常，Gora\
  \ 键与顶点 ID 一致，用于唯一标识顶点。稍后你将看到实际应用。\n\n你需要实现的第二个方法是`getGoraVertex()`，它将`Vertex`对象作为输入，并返回一个实现\
  \ Gora 的`Persistent`接口的对象。尽管你可以自己实现`Persistent`接口来存储输出，但 Giraph 已经提供了一个通用实现——名为`GVertexResult`——它允许你存储关于顶点的任何信息，例如其\
  \ ID 和值。在下面的示例中，你将看到它的实际使用。\n\n首先，让我们看一下清单 10-13 中所示输入格式的实现。如前所述，Giraph 通过`GoraVertexOutputFormat`（一个你需要继承的抽象类）抽象了许多细节。将你的实现命名为`GoraUserVertexOutputFormat`。和往常一样，你需要实现`createVertexWriter()`方法，该方法返回一个实现`VertexWriter`接口的对象，该对象完成大部分工作。我们将其称为`GoraUserVertexWriter`。现在，让我们更详细地看一下`VertexWriter`的实现。\n\
  \n清单 10-13\\. 将顶点对象保存为 Gora 对象的示例实现\n\n```\npublic class GoraUserVertexOutputFormat\n\
  \    extends GoraVertexOutputFormat<Text, DoubleWritable, NullWritable> {\n\n  \
  \  @Override\n    public VertexWriter<Text, DoubleWritable, NullWritable>\n    createVertexWriter(TaskAttemptContext\
  \ context)\n        throws IOException, InterruptedException {\n        return new\
  \ GoraUserVertexWriter();\n    }\n\n    protected class GoraUserVertexWriter extends\
  \ GoraVertexWriter {\n\n        @Override\n        protected Object getGoraKey(\n\
  \            Vertex<Text, DoubleWritable, NullWritable> vertex) {\n            String\
  \ goraKey = vertex.getId().toString();                          #1\n           \
  \ return goraKey;\n        }\n\n        @Override\n        protected Persistent\
  \ getGoraVertex(Vertex<Text, DoubleWritable, NullWritable> vertex) {\n         \
  \   GVertexResult userVertex = new GVertexResult();                      #2\n  \
  \          userVertex.setVertexId(vertex.getId().toString());                  \
  \ #3\n            userVertex.setVertexValue(vertex.getValue().get());          \
  \        #4\n            return userVertex;\n        }\n\n    }\n\n}\n```\n\n#1\
  \ 提取顶点 ID，并将其字符串表示作为 Gora 键返回  \n#2 创建一个空的`GVertexResult`对象，用于保存该顶点的输出  \n#3 使用提供的\
  \ API 设置其顶点 ID  \n#4 类似地，设置其顶点值  \n\n首先，让我们看一下`getGoraKey()`方法的实现。该方法应返回一个用于在内存中唯一标识对象的对象。尽管这不是必须的，但使用顶点\
  \ ID 是最佳选择，因为你知道它唯一标识一个顶点。对于 Gora 键，你不需要`Writable`对象（例如`Text`），因此只需提取键的`String`表示并返回即可。\n\
  \n接下来，让我们看看`getGoraVertex()`方法的实现，它完成了大部分工作。在此方法中，你需要提取所有要存储在`Vertex`对象中的必要信息，并将其封装在\
  \ Gora 能理解的类型的对象中；即实现`Persistent`接口的对象。Giraph 源代码包含一个通用对象——名为`GVertexResult`——它实现了该接口，并允许你向其中存储信息。我们不会在此详细描述其实现；重要的是它抽象了`Persistent`接口的细节，并提供了简单的\
  \ API 调用，例如获取和设置顶点 ID、值以及边。该实现会处理将这些字段转换为正确底层表示的细节。\n\n现在，让我们看看方法实现的主体。第一步是创建一个新类型的对象`GVertexResult`，它将保存输出。回顾一下，在此特定场景中，你关心的输出是顶点\
  \ ID 及其值；即计算出的距离。为此，你使用`GVertexResult`类的`setVertexId()`和`setVertexValue()`方法。尽管此处未展示，但这些方法的内部实现会将字符串和双精度浮点值转换为`GVertexResult`的预期格式。\n\
  \n此外，尽管在你的特定场景中不需要，但`GVertexResult`也允许你设置顶点的边。用于维护边信息的数据结构本质上是一个映射。清单 10-14 中的代码片段展示了如何使用它。\n\
  \n清单 10-14\\. 设置 GVertexResult 的边\n\n```\nIterator<Edge<Text, DoubleWritable>> it\
  \ = vertex.getEdges().iterator();      #1\nwhile (it.hasNext()) {\n    Edge<Text,\
  \ DoubleWritable> edge = it.next();\n    userVertex.getEdges().put(            \
  \                                      #2\n        edge.getTargetVertexId().toString(),\
  \                                    #3\n        edge.getValue().toString()\n  \
  \  );\n}\n```\n\n#1 遍历顶点的边  \n#2 通过`getEdges()`方法访问边的数据结构  \n#3 使用`put()` API 插入目标\
  \ ID 和边值  \n\n至此，关于从 Gora 访问数据的内容就结束了。尽管你在此未学到，但 Giraph 也提供了基于边的输出格式实现，用于写入 Gora。同时请注意，尽管\
  \ Giraph 代码库中输出格式和接口（例如`GVertexResult`）的实现可以满足你的大部分需求，但你仍可能需要对其进行自定义。不过，现有的实现可以作为扩展你自己实现的完美指南。\n\
  \n\n\n## 总结\n\n在前面几章中，你已经了解了如何使用 HDFS 作为数据输入与输出的基本存储。然而，Giraph 提供了一套灵活的 API，允许扩展至多种存储系统。在本章中，你探讨了基于表的内存存储系统。\n\
  \n* 基于表的存储系统因其能够存储和查询半结构化数据而变得相当流行。\n* 在其他基于表的存储系统中，Giraph 提供了基于顶点和基于边的 API，用于访问\
  \ Hive 表中的数据。通常，你将单个 Hive 表行转换为一个 `Vertex` 或 `Edge` 对象。\n* 内存存储系统是另一类流行的系统，允许快速访问数据。Apache\
  \ Gora 提供了一种内存数据模型，该模型抽象了底层存储的细节，并允许你将其插入不同的存储系统以实现持久化。\n* Giraph 进一步隐藏了从 Gora 内存模型中读取数据和写入数据的许多复杂性。你可以使用\
  \ `GoraVertexInputFormat` 和 `GoreEdgeInputFormat` API 在通用的 Gora 对象与 Giraph 的 `Vertex`\
  \ 和 `Edge` 对象之间进行转换。\n\n到现在，你应该已经熟悉了如何从多种数据存储中访问数据。Giraph 为比本章涵盖的更多系统提供了接口。你应该查阅代码库和文档以获取更多信息。你将在下一章继续学习更高级的功能——特别是调优和性能。\n\
  \n"
- "# 11. 调优 Giraph\n\n本章涵盖\n\n* Giraph 中的关键性能因素和瓶颈\n* 托管 Giraph 的 Hadoop 集群的最佳配置\n\
  * 针对算法设计和实现优化的特设数据结构\n* 必要时将溢出数据写入磁盘\n* 不同的 Giraph 参数和调节旋钮\n\n到目前为止，你已经了解了如何使用 Giraph\
  \ 在数百台机器上对大型图执行图分析。你已经了解了 Giraph 的架构和编程模型，这些模型允许你编写可扩展的程序。使用以顶点为中心的编程模型编写程序非常简洁，无需担心并行和分布式系统编程的麻烦。你编写一个\
  \ `compute` 函数，Giraph 负责在顶点上执行它、交换消息，并在你的机器之间执行系统的所有功能。所有这些机制的工作原理对你来说是隐藏的，以便你可以专注于应用程序的语义。\n\
  \n然而，有时候你会想方设法从 Giraph 应用程序中榨取所有可能的性能，尤其是当它运行得比预期慢时。或者更糟的是，有时你的应用程序会因为资源需求过高而无法完整运行，例如内存不足。无论是哪种情况，你都需要了解\
  \ Giraph 在底层是如何工作的，以及如何利用可用的钩子和调节旋钮来突破这些限制。在前面的章节中你已经看到了一些相关内容。在本章中，你将回顾它们，这次将特别关注性能调优，并且你将接触到一组新的可以操作的旋钮和类。\n\
  \n性能调优有点像“黑魔法”。它是直觉、经验和感觉的混合体。尽管如此，这与运气无关。要调优大型系统的性能，你需要掌握两件事。首先，你需要深入了解系统运行背后的原理。也就是说，你必须下功夫学习架构，理解数据和计算如何流经所有不同的组件。其次，你需要有耐心和毅力去尝试不同的解决方案，并对它们进行测量。\n\
  \n在计算机系统乃至整个计算机科学中，有一个很大的误解：如果你对系统的运行原理有想法，那么你就可以在纸上决定系统的最佳调优方案。诚然，你可以做一些假设和估算，进行复杂度分析，但最终细节（或者说常量）中藏着魔鬼，你必须用实际时间来检验你的假设和计算。这意味着在本章中，我们会给你一些思路，并解释\
  \ Giraph 调优旋钮背后的原理，但我们无法告诉你如何改进你自己的应用程序。只有你自己才能通过“有依据的”试错来做到这一点。希望本章的内容能让你更轻松些。\n\
  \n\n\n## Giraph 关键性能因素\n\n描述计算（或系统、应用程序等）性能的方法有很多。其中一种方法是将其归入以下两类之一。\n\n- **计算密集型**：这类计算由于复杂程度高，大部分时间都用于计算工作。换言之，这类计算大部分时间都在对相对较小的数据量执行指令。计算密集型计算的例子包括素数计算、可满足性求解器（SAT）、模拟等。\n\
  - **数据密集型**：这类计算处理大量数据，但不对这些数据执行特别复杂的计算，因此大部分时间都用于输入/输出（IO）。换句话说，这类计算大部分时间都在遍历数据并移动它们。数据密集型计算的例子包括大多数\
  \ Hadoop 计算、数据过滤与聚合、索引等。\n\n直观上，判断一个计算是计算密集型还是数据密集型的方法之一是，看它更依赖于更快的 CPU，还是更快的磁盘/网络。\n\
  \nHadoop 领域的许多计算都是数据密集型的。例如，大多数 MapReduce 应用程序的大部分时间都用于读取数据文件、过滤、分割和排序记录、在 mapper\
  \ 和 reducer 之间传递记录、聚合记录，并将它们写回文件。这些操作中的许多都需要从磁盘和网络进行读写。事实上，为了加速 MapReduce 集群，你通常希望每台机器上有多个磁盘，这样当一个核心在一个磁盘上执行\
  \ IO 时，其他核心不必空闲等待访问同一磁盘。理想情况下，每个核心应该从一个不同的“专用”磁盘读取数据。这也是为什么 MapReduce 作业可以利用快速网络的原因，因为在\
  \ map 阶段和 reduce 阶段之间的 shuffle 和 sort 阶段，大量数据只是被传递。\n\n毕竟，这就是它被称为大数据的原因。大数据关注的是对大量小信息片段执行简单计算，然后将结果汇总起来。这基本上就是数据密集型计算的定义。图算法也不例外；事实上，它们是数据密集型计算的绝佳范例。正如你所见，图中的信息包含在顶点之间的连接中，仅此而已。图算法多次遍历这些连接和顶点，并对每个连接和顶点执行简单计算。以\
  \ PageRank 为例。在每次迭代中，每个顶点都会根据收到的消息和出站边进行计算。但在每个顶点上所做的实际上只是汇总传入的 PageRank 值，将总和除以出站边的数量，然后通过出站边传递结果。这些都不是复杂的操作。你拥有的数据（即边和顶点）越多，计算持续的时间就越长。SSSP（单源最短路径）算法也是如此。每个顶点遍历其接收到的消息，找出最小的一个。如果找到一个比当前值更小的值，就将其传递下去。这也是一种相当廉价的计算，其成本几乎完全取决于它所处理的数据量。\n\
  \n> **注意**  \n> 图计算往往是数据密集型的，因为它们需要多次遍历数据图，并对每个顶点或边执行少量计算。Giraph 计算是数据密集型的，因为大部分运行时间都花在处理图数据上。即，在每个顶点、其关联的边和值以及发送给它的消息上执行\
  \ `compute` 函数，并在工作节点之间交换消息。\n\n现在，在 Giraph 计算中，有两类数据项会填满工作节点的内存：\n\n- **图**：顶点及其边占据了堆内存的很大一部分。默认情况下，Giraph\
  \ 在整个计算期间将图存储在内存中，因此图越大，所需的内存就越多。\n- **计算状态**：Giraph 计算中的状态包括顶点值（有时也包括边值，如果它们在计算过程中发生变化）以及正在传输的消息。通常，消息的数量与边的数量成正比，而边是任何合理图中最频繁出现的元素。\n\
  \n换句话说，图和消息共同占用了几乎所有已使用的堆内存。此外，在每个超步骤中，工作节点花费大量时间“仅仅”通过网络传输消息。这就是为什么 combiner（组合器）和良好的分区可以加速计算，有时甚至可以将计算时间减半，并显著降低内存使用量：原因很简单，它们可以大幅减少存储和通过网络交换的数据量。\n\
  \n本章的要点是，为了减少内存占用量并加速计算，你需要减少存储在内存中的数据量及其大小；即顶点和边的值，以及通过网络发送的数据量及其大小，也就是消息。在本章的剩余部分，你将了解如何通过\
  \ Giraph 使用的某些数据结构的“紧内存”实现来解决这些问题。不幸的是，本章无法讨论其他一些内容；例如，在 Giraph 编程模型中，有多种方法可以实现每个算法。然而，我们无法讨论特定于算法的实现问题，因为它们确实取决于每个具体的算法。\n\
  \n## Giraph 对 Hadoop 的要求\n\nGiraph 作为 Hadoop 应用程序运行。因此，它可以利用或受制于一些涉及托管 Hadoop 集群的设置以及与集群相关的作业配置参数的决定。\n\
  \n\n\n### 与硬件相关的选择\n\n通常情况下，你会在一个自己无法完全控制的集群上运行 `Giraph`。你只是一个没有集群管理权限的用户。但如果你能与\
  \ Hadoop 管理员沟通并请求一些变更，本节将介绍你需要关注的内容。此外，一些组织会使用专用集群或节点子集来运行 `Giraph`。如果你能用 `Giraph`\
  \ 解决的问题数量随时间推移而增加，那么在扩展集群时做出一些面向 `Giraph` 的决策是合理的。\n\n最适合 `Giraph` 的机器配置是拥有大量主内存（即\
  \ RAM）。`Giraph` 不需要大量的磁盘存储空间，因此在考虑 `Giraph` 时，磁盘并不是你需要关注的重点。正如你将在本章后面看到的，`Giraph`\
  \ 能够将部分图数据和消息存储在本地磁盘上，但你应该将此视为备选方案，而非设计初衷。传统上，`MapReduce` 任务对主内存需求不高，因为数据会直接从磁盘和网络流式传输。然而，最近主内存即使对于\
  \ `MapReduce` 任务也变得更加重要，例如用于加速基于磁盘的混洗排序阶段，以及执行 `Hive` 和 `Pig` 等计算中更耗内存的操作符。这意味着你的机器现在很可能已经拥有大量内存，但如果你计划为\
  \ `Giraph` 购买机器来扩展集群，请将重点放在内存上。\n\n其次，如前所述，`Giraph` 计算中有很大一部分时间花在了工作节点之间的消息交换上。加速这一阶段的方法（除了在算法上减少消息的大小和数量）是使用高速网络。与内存相比，你对可用网络的控制权可能更小。尽管如此，仍值得考虑将网络接口绑定在一起，或利用同一机架内的机器。`Giraph`\
  \ 在可扩展性方面更为传统，虽然它可以水平扩展，但它更倾向于垂直扩展；也就是说，少数高性能机器优于许多小型机器。因此，一种解决方案是在一个机架中配备几台高性能机器，并仅将这些机器用于\
  \ `Giraph`。\n\n**提示：**  \n`Giraph` 更倾向于使用少数高性能机器而非许多小型机器。当你考虑购买机器来扩展 `Hadoop` 集群以适应\
  \ `Giraph` 时，请将重点放在内存而非存储上，并尽量将这些机器放在同一个机架中。\n\n关于垂直扩展的考虑非常重要，因此本节剩余部分将重点讨论这一点。在开始之前，让我们明确这里所说的垂直扩展是指什么。在\
  \ `Hadoop` 领域，垂直扩展通常被视为一种昂贵的“过时”基础设施部署方式，可能因依赖少量机器而可靠性较低（即冗余度较低）。此处指的是选择使用核心数更多的少量机器，以达到集群所需的总核心数，同时仍保持在“商用机器”的范畴内。原因如下。\n\
  \n在 `Giraph` 中，给定相同的算法和相同的图，随着机器/工作节点数量的增加，通过网络发送的数据量也会增加。直观地说，当你向集群添加一台新机器/工作节点时，需要通过网络传输的消息会比之前更多，原因很简单：原本本地的顶点（即存储在同一台机器上）现在变成了远程的（其中一些顶点位于新机器/工作节点上）。原本在同一工作节点内交换（因此无需传输）的两个顶点之间的消息，现在需要通过网络传输。毋庸置疑，这比简单地将消息放入同一工作节点内的顶点收件箱（在同一个\
  \ JVM 内部，这仅相当于将一个对象放入映射中）要慢得多。\n\n现在，增加工作节点的数量也会提高并行度，因此为了提升性能，你需要向计算中添加更多计算单元。但是，如果可能，你希望通增加核心数而不是机器数量来实现这一点。在不增加工作节点的情况下增加核心数，可以在不增加网络使用量的前提下提高并行度。具体来说，拥有\
  \ 10 台每台 8 核的机器，优于 80 台每台单核的机器。总核心数仍然是 80，但更少的机器能获得更多本地顶点，从而减少网络使用量。请注意，虽然增加机器数量能提高并行度，但也会增加网络传输的数据量。通过增加机器所能获得的运行性能提升是有限的，你需要通过运行测试来发现这种权衡。\n\
  \n\n\n### 与作业相关的选择\n\nGiraph 通过计算线程实现每个工作线程的并行处理。在 Giraph 中，每个工作线程被分配一定数量的分区，每个分区包含若干顶点。Giraph\
  \ 的并行粒度是分区级别的，这意味着每个计算线程被分配到一定数量的分区，并负责对属于这些分区的每个顶点执行计算函数。通过计算线程，一个工作线程可以充分利用所有可用的核心。请注意，在一次计算过程中，Giraph\
  \ 还会运行其他一些线程，但这将在后文讨论。相关参数将在本章后续部分进行描述。\n\n利用集群可用核心有两种方式。假设你有 10 台机器，每台有 10 个核心。一种方式是运行\
  \ 100 个工作线程，每台机器分配 10 个工作线程，每个工作线程使用 1 个计算线程。另一种方式是运行 10 个工作线程，每台机器分配 1 个工作线程，每个工作线程使用\
  \ 10 个计算线程。虽然理论上最终都能充分利用 100 个核心，但两者的主要区别如下：\n\n- 使用 100 个工作线程时，与使用 10 个工作线程相比，局部性较差，因此通过网络传输的消息更多。你可能会说，因为每台机器上有\
  \ 10 个工作线程，所以网络使用量无论如何都会减少；也就是说，同一台机器上的工作线程之间通信较少。这确实如此。然而，即使两个工作线程被分配到同一台机器上可以通过回环通信，Giraph\
  \ 内部仍然必须将它们视为远程通信（Giraph 无法感知这种每个工作线程在同一台机器上的局部性）；例如，通过基于 Netty 的组件对消息进行序列化和反序列化，通过套接字读写数据等。\n\
  - 内存被浪费在开销上。拥有 100 个工作线程意味着 100 个 Hadoop 任务和 100 个 JVM。所有这些冗余会导致内存浪费，因为你可以用少 10\
  \ 倍的任务和 JVM 获得相同的结果。此外，Giraph 工作线程内部的许多数据结构所占用的空间与使用的工作线程数量成正比，因此会消耗更多的堆内存。\n\n\
  你可能会认为这一点显而易见，甚至没有必要指出。为什么你会每台机器使用多个工作线程呢？事实证明，要求 Hadoop 每台机器只运行一个任务并不简单，尤其是在你必须共享的集群上；例如，MapReduce\
  \ 作业。这个设置通常不由集群管理员决定（即 `mapred.tasktracker.map.tasks.maximum`），并且提交作业的用户无法覆盖该设置。\n\
  \n> **提示**：避免每台机器使用多个工作线程，尽量让工作线程的数量等于你可用机器的数量。相反，通过在每个工作线程上使用多个计算线程来实现每台机器内部的并行。\n\
  \n在 Pre-YARN 集群上，Giraph 计算作为单一的 Map-only MapReduce 作业运行，其中每个工作线程作为 mapper 任务执行。传统上，每台机器或其\
  \ `TaskTracker` 会被设置为容纳多个并发的 mapper 和 reducer 任务，通常与核心数或磁盘数成比例。此外，每个任务的最大堆大小与总内存大小除以可接受的任务数成比例，以避免过度分配。这意味着，要获得一台机器上的所有可用资源，你必须请求所有可用的\
  \ mapper 任务作为工作线程，从而导致前面描述的每台机器使用多个工作线程的次优场景。在较旧版本的 Hadoop 上，可以通过在客户端将每个 `TaskTracker`\
  \ 的最大 mapper 任务数设置为 1 来克服这个问题。然而，这个选项在较新版本中已被取消。\n\n使用 YARN 后，情况发生了变化。YARN 是基于容器的概念设计的。容器代表物理资源的集合，例如内存、CPU\
  \ 核心和磁盘。YARN 没有固定的 mapper 和 reducer 任务数量，而是取决于可用资源和请求的资源。一个容器可以定义为最小和最大尺寸，相对于机器的可用资源；例如，总内存的\
  \ 80%。当一个容器被分配了机器上可用内存的 80% 或 90% 时，`ResourceManager` 将不会在该机器上再申请更多容器。当 Giraph 在\
  \ YARN 上运行时，每个工作线程使用自己的容器。这意味着，通过为每个工作线程/容器请求每台机器上所有可用的资源（例如内存），你可以实现每台机器一个工作线程的设置。这里，我们假设所有这些内存都是必要且被使用的，因此讨论了一种申请内存以最小化冗余的方法。在实际操作中，可以通过提交堆大小接近机器可用内存大小（在异构集群的情况下，取集群中最小机器的内存大小）的\
  \ Giraph 作业来实现这一点。\n\n> **提示**：使用 YARN 时，为每个容器请求与单台机器可用的内存和 CPU 相当的量。这使得每台机器上可以运行一个工作线程。\n\
  \n本节最后简要讨论同构和异构集群。这个讨论与性能的硬件和作业两方面都相关。由于同步屏障的存在，Giraph 的一个超步的持续时间取决于最慢或负载最重的机器完成其份额所需的时间。因此，你希望使用具有相似计算资源的可比机器，这样你的快速机器就不必在同步屏障处空闲等待最慢（或负载最重）的机器完成。此外，你还需要确保每台机器具有与其他机器相同的负载。这通常通过分区来实现，确保顶点在工作线程之间以相似数量进行分区。默认的哈希分区方案通常能保证这一点。请注意，相似的计算资源意味着相似的\
  \ CPU、内存和网络。所有这些资源都同等重要。如果一台机器的 CPU 较慢，它计算其工作部分所需的时间就会更长。如果它的内存较少，它可能会在其他机器之前填满堆，并耗尽内存（请注意，你对堆的请求对所有工作线程都是全局的）。如果它的网络较慢，它传输消息所需的时间就会更长。无论如何，这都会导致其他工作线程在屏障处空闲等待。同时，如果一台机器被分配了更多的工作线程，它的负载就更重，因此分配给它的工作线程就需要更多时间来完成其超步部分。这与拥有计算资源较少的机器具有相同的效果。\n\
  \n> **提示**：Giraph 更倾向于由具有相似计算资源（如 CPU、主存大小和网络）的机器组成的同构集群。最慢的机器决定了每个超步的持续时间，导致较快的机器在同步屏障处空闲等待它。\n\
  \n\n\n## 调优数据结构\n\nGiraph 在内部设计中致力于最小化内存使用。Giraph 的早期版本为所有边、顶点和消息都使用了纯 Java 对象。当图包含数十亿条边和顶点，且每个超步中都会创建和消费数十亿条消息时，JVM\
  \ 的内存管理组件将承受巨大压力。对于应用创建的所有对象，JVM 都必须额外分配内存来记录这些对象。此外，JVM 垃圾回收器会持续追踪正在创建和销毁的对象，并移动它们以避免堆内存碎片化。这些本可以用来执行应用代码（即\
  \ Giraph 和你的代码）的 CPU 周期就这么被消耗了。正因如此，Giraph 采用了若干非常规技巧来最小化内存占用以及垃圾回收所花费的时间。\n\n简而言之，Giraph\
  \ 自行完成了一部分内存管理。例如，它将某些数据（如边、消息和顶点值）以序列化形式存储在计算开始时分配的字节数组中。尽管如此，它仍然提供了一个纯 Java 的面向对象\
  \ API。为了实现这种抽象，Giraph 保留了一些内部称为“代表对象”的对象，在将这些对象传递给用户之前，会利用二进制数组中的数据重新初始化它们；当用户使用完毕后，再将其序列化回数组中。例如，此机制用于包含传递给计算函数的消息的\
  \ `Iterable`，以及用于存储每个顶点边的 `OutEdges` 接口的默认实现。要了解其工作原理，我们来看看这两个类的默认实现。\n\n### `OutEdges`\
  \ 接口\n\n顶点的边包含在一个实现了 `OutEdges` 接口的类中。`OutEdges` 接口扩展了 `Iterable<Edge<I, E>>` 接口，并增加了添加、删除边以及统计存储边数量的能力。该接口用于访问边，每条边包含在一个\
  \ `Edge<I, E>` 对象中。直观来看，你可能会认为顶点的出边会被存储在，例如，一个 `Map<I, E>` 中以实现高效的随机访问，或者存储在 `List<Edge<I,\
  \ E>>` 中以便高效迭代。在深入了解实现细节之前，理解 Giraph 计算中访问边的这两种模式至关重要。\n\n例如，以 PageRank 和 SSSP 为例。在这两种算法中，计算函数都会遍历出边，向其他端点发送消息，并在遍历边的过程中根据需要处理边的权重。由于你永远不会通过顶点\
  \ ID（或另一端点的 ID）来查找特定的边，因此将边存储在支持高效迭代的数据结构中（如数组或列表）就足够了。请注意，将边存储在数组中进行迭代会更快，因为数据存储在一段连续的内存中，并且空间效率更高，因为你只需要一个指向边的指针数组。另一方面，如果考虑第\
  \ 4 章描述的标签传播算法，你需要根据消息的发送者来访问边，以便用新的标签更新边的值。对于这种访问模式，将边存储在映射中可以实现更快的查找（在未排序数组中搜索元素的代价与数组大小成正比），但由于映射实现本身（如树或哈希映射）会带来额外的开销。此外，树通常比数组迭代起来更慢。因此，根据你的算法所决定的边的访问模式，你需要为\
  \ `OutEdges` 接口选择合适的实现。\n\n除了 `OutEdges` 接口中便于迭代的 API 之外，Giraph 还提供了一个额外的接口：`StrictRandomAccessOutEdges<I,\
  \ E>`。该接口扩展了 `OutEdges` 接口，增加了通过查找边目标顶点 ID 来获取和设置边值的方法。Giraph 为此接口提供了一个名为 `HashMapEdges`\
  \ 的实现，顾名思义，它由一个 Java 哈希映射支持，用于对边的随机访问。默认情况下，Giraph 使用一个名为 `ByteArrayEdges` 的类，该类将边序列化后存储在一个字节数组中，并且不支持对边的随机访问。你可以通过\
  \ Giraph 参数 `giraph.outEdgesClass` 来选择用于存储出边的类，包括你自己的实现。接下来，我们来看看 `ByteArrayEdges`\
  \ 为何以及如何使用字节数组来最小化内存占用。\n\n### 便于迭代的 `OutEdges`\n\n由于 `OutEdges` 扩展了 `Iterable`\
  \ 接口，`ByteArrayEdges` 必须提供 `Iterator<Edge<I, E>>` 的实现。换句话说，它必须能够在每次调用迭代器的 `next()`\
  \ 方法时返回一个 `Edge<I, E>` 对象。这个协议很重要，因为它允许用户忽略实现了 `OutEdges` 的任何类内部是如何运作的。如前所述，一个简单的实现会使用大量原生\
  \ Java 对象——例如，每条边一个，每个边值以及与该边关联的目标顶点 ID 也各一个。这些对象的存在会引入额外的内存开销并给垃圾回收器（GC）带来压力。`ByteArrayEdges`\
  \ 并非创建并持有这些对象，而是通过这些对象为了检查点而必须支持的 `Writable` 接口提供的方法，将它们存储在一个字节数组中。将边数据以序列化形式存储在字节数组中能大幅减少对象数量，但你仍然需要提供\
  \ Java 对象以符合 Giraph API 的要求。因此，`ByteArrayEdges` 保留了一些对象，这些对象在底层会根据其字节数组中的数据进行重新初始化，然后再返回给调用者。由于这些内部代表对象会被不断地覆盖，调用者不能持有对它们的引用，但如有需要可以复制一份。这没问题，因为典型的出边访问模式（例如前面提到的算法）仅仅是迭代边并在迭代的每一步局部使用它们的值。为了确保用户了解这一注意事项，`ByteArrayEdges`\
  \ 实现了 `ReusableObjectsOutEdges` 接口，该接口精确地描述了这一行为。为了更好地理解该机制，我们来看一下清单 11-1 中作为 `ByteArrayEdges`\
  \ 内部类实现的 `Iterator<Edge<I, E>>`。\n\n清单 11-1. `ByteArrayEdgeIterator`\n\n```\nprivate\
  \ class ByteArrayEdgeIterator\n    extends UnmodifiableIterator<Edge<I, E>> {\n\
  \  /** 用于处理字节的输入 */\n  private ExtendedDataInput extendedDataInput =\n      getConf().createExtendedDataInput(\n\
  \          serializedEdges, 0, serializedEdgesBytesUsed); #1\n\n  /** 代表边对象。 */\n\
  \  private ReusableEdge<I, E> representativeEdge =\n      getConf().createReusableEdge();\
  \ #2\n\n  @Override\n  public boolean hasNext() {\n    return serializedEdges !=\
  \ null && !extendedDataInput.endOfInput(); #3\n  }\n\n  @Override\n  public Edge<I,\
  \ E> next() {\n    try {\n      WritableUtils.readEdge(extendedDataInput, representativeEdge);\
  \ #4\n    } catch (IOException e) {\n      throw new IllegalStateException(\n  \
  \        \"next: Failed on pos \" +\n          extendedDataInput.getPos() + \" edge\
  \ \" + representativeEdge);\n    }\n    return representativeEdge; #4\n  }\n}\n\
  ```\n\n#1 在内部，我们将来自外部类的字节数组封装到一个 `ExtendedDataInput` 中，我们需要用它来为 `Writable` 接口方法提供数据\n\
  \n#2 创建一个可重用的边，我们将把它返回给用户\n\n#3 检查边是否存在，以及我们是否还没有消费完所有边\n\n#4 用数组中下一个可用数据重写代表边，并将其返回给用户\n\
