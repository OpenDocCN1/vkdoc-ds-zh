  \n\n好的，这是根据您的要求翻译的中文版本：\n\n\n### `MessageStore` 接口\n\n消息是填充工作线程堆的另一类数据。某些算法（如 PageRank）产生的消息数量与边数成正比，其他算法产生的消息数量较少，且每个超步的消息数量取决于多种因素，例如图的拓扑结构。此外，某些算法会生成非常大的消息，例如计算聚类系数的算法，它会发送邻居\
  \ ID 列表作为消息来检测三角形。为最小化消息的影响，Giraph 采用了与上一节中关于边的技术类似的机制来存储消息。\n\n与`ReusableObjectsOutEdges`接口类似，消息的引用仅在每次调用`compute()`方法时传递给每个顶点的迭代器的`next()`方法之前有效。原因如下：消息以序列化格式存储在字节数组中，迭代器传递给用户的是一个代表消息的对象，该对象在每次调用时都会用消息数据重新初始化。这一技巧由`ByteArrayMessagesPerVertexStore`类实现，该类是`MessageStore`接口的默认实现。\n\
  \n`MessageStore`是 Giraph 存储发送给所有顶点的消息的收件箱。每个工作线程都有一个这样的存储，在存储内部，消息按目标顶点分组，而顶点本身则按分区组织。换句话说，你可以将`MessageStore`想象成一个嵌套的映射（Map），其中分区是外层映射的键，顶点\
  \ ID 是内层映射的键。\n\n需要注意的一点是，组合器（Combiner）会显著减少系统中传输的消息数量。这对存储的运行时管理有特别的影响。事实上，当使用组合器时，Giraph\
  \ 会使用不同的默认实现，因为 Giraph 会在消息到达目标工作线程时，在存储层级将所有传入的消息合并。换句话说，当涉及组合器时，Giraph 在存储中仅保留一条消息（如果有的话）。\n\
  \n那么问题来了：既然 Giraph 提供的默认消息存储已经很高效了，你如何进一步节省内存？思路与上一节中看到的类似。你可以通过使用基于`fastutil`提供的原始类型（primitive\
  \ types）的类，来使用针对你应用程序中使用的数据类型定制的数据结构。虽然原始存储已经足够紧凑且最小化了对象数量，但为了尽可能通用地支持顶点 ID 类型和消息值，它们仍然基于原生的\
  \ Java `HashMap` 类。然而，由于你想要尽可能减小存储的内存占用，你可以放弃这种通用性要求，实现一个完全围绕特定数据类型定义的存储。\n\n我们先来看看\
