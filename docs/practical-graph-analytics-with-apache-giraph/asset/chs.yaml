  \ 会创建一个`VertexReader`对象，该对象处理相应的数据并创建最终构成图的`Vertex`对象。图 7-5 展示了整个过程。\n\n![A978-1-4842-1251-6_7_Fig5_HTML.jpg](img/A978-1-4842-1251-6_7_Fig5_HTML.jpg)\n\
  \n图 7-5.\n\n将所有部分整合在一起。`VertexInputFormat`将输入分割成多个部分。`VertexReader`处理一个部分并创建`Vertex`对象\n\
  \n现在让我们来看看`VertexReader`的细节以及如何实现它。代码清单 7-4 显示了在`VertexReader`抽象类中定义的方法。\n\n**代码清单\
  \ 7-4.** `VertexReader`抽象类\n\n```\npublic abstract class VertexReader<I extends\
  \ WritableComparable,\nV extends Writable, E extends Writable> extends\nDefaultImmutableClassesGiraphConfigurable<I,\
  \ V, E>\nimplements WorkerAggregatorUsage {\npublic abstract void initialize(InputSplit\
  \ inputSplit,\nTaskAttemptContext context)\nthrows IOException, InterruptedException;\n\
  public abstract boolean nextVertex() throws IOException,\nInterruptedException;\n\
  public abstract Vertex<I, V, E> getCurrentVertex()\nthrows IOException, InterruptedException;\n\
  public abstract void close() throws IOException;\n}\n```\n\n在代码清单 7-5 中，你实现了`SimpleTextVertexReader`，它负责逐一读取文本文件中的行，并为每一行创建一个`Vertex`对象。此示例展示了如何实现`VertexReader`的每个方法。\n\
  \n**代码清单 7-5.** 一个基于文本的`VertexReader`示例\n\n```\npublic class SimpleTextVertexReader\n\
  extends VertexReader<Text, IntWritable, IntWritable> {\nprivate RecordReader<LongWritable,\
  \ Text> lineRecordReader;\nprivate TaskAttemptContext context;\n@Override\npublic\
  \ void initialize(InputSplit inputSplit, TaskAttemptContext context)\nthrows IOException,\
  \ InterruptedException {\nthis.context = context;\nlineRecordReader = new LineRecordReader();\
  \                            #1\nlineRecordReader.initialize(inputSplit, context);\
  \                     #1\n}\n@Override\npublic final boolean nextVertex()\nthrows\
  \ IOException, InterruptedException {\nreturn lineRecordReader.nextKeyValue(); \
  \                              #2\n}\n@Override\npublic final Vertex<Text, IntWritable,\
  \ IntWritable> getCurrentVertex()\n```\n\n\n\n```java\npublic void readVertices(VertexReader\
  \ reader, \n    TaskAttemptContext context) throws IOException, InterruptedException\
  \ {\n  while (reader.nextVertex()) {\n    Vertex<Text, IntWritable, IntWritable>\
  \ vertex = reader.getCurrentVertex();\n    // 处理顶点\n  }\n}\n```\n\n`throws IOException,\
  \ InterruptedException {`\n\n`Text line = lineRecordReader.getCurrentValue();` //\
  \ #3\n\n`Vertex<Text, IntWritable, IntWritable> vertex =`\n`getConf().createVertex();`\
  \ // #4\n\n`String[] words = line.toString().split(’ ’);` // #5\n\n`Text id = new\
  \ Text(words[0]);` // #6\n\n`IntWritable age = new IntWritable(Integer.parseInt(words[1]));`\
  \ // #7\n\n`List<Edge<TextWritable, IntWritable>> edges = new ArrrayList();`\n\n\
  `for (int n = 2; n < tokens.length; n=n+2) {`\n`Text destId = new Text(tokens[n]);`\
  \ // #8\n`IntWritable numMentions =` // #8\n`new IntWritable(Integer.parseInt(tokens[n+1]));`\
  \ // #8\n`edges.add(new DefaultEdge(dstId, numMentions));` // #9\n`}`\n\n`vertex.initialize(id,\
  \ age, edges);` // #10\n\n`return vertex;`\n`}`\n\n`@Override`\n`public void close()\
  \ throws IOException {`\n`lineRecordReader.close();` // #11\n`}`\n`}`\n\n#1 创建行记录读取器以读取文本文件。\n\
  #2 检查是否还有更多行需要读取。\n#3 获取当前行。\n#4 创建一个空的顶点对象。\n#5 将行分割为标记。\n#6 第一个标记是顶点 ID。\n#7 第二个标记是顶点值。\n\
  #8 解析目标 ID 和提及次数。\n#9 创建边对象。\n#10 初始化顶点对象。\n#11 关闭输入文件。\n\n您实现的第一个方法是 `initialize()`，Giraph\
  \ 在创建 `VertexReader` 之后、开始使用它之前会立即调用该方法。Giraph 将 `VertexReader` 要处理的 `InputSplit`\
  \ 以及一个包含配置信息（如 HDFS 输入目录）的 `TaskAttemptContext` 对象作为输入传递给此方法。通常，您可以在执行前使用此方法来设置\
  \ `VertexReader`。在示例中，您使用此方法初始化局部变量并创建一个 `LineRecordReader`。`LineRecordReader` 是一个辅助类，您可以从\
  \ Hadoop API 中借用它来逐行读取 HDFS 上的文本文件。为简化示例，此处省略了 `LineRecordReader` 的细节；您只需将 `InputSplit`\
  \ 和上下文信息传递给它，即可直接使用。\n\n接下来的两个方法 `nextVertex()` 和 `getCurrentVertex()` 类似迭代器接口。`nextVertex()`\
  \ 方法必须返回 true（如果还有更多顶点需要读取），并将迭代器推进到下一个顶点。`getCurrentVertex()` 方法返回迭代器当前指向的顶点。Giraph\
  \ 会重复调用这两个方法作为一对，直到输入中没有更多数据可读。\n\n现在来看看如何实现这些方法。在示例中，`nextVertex()` 只需要检查文件中是否还有更多行，如果有，则读取并缓存下一行。这是\
  \ `LineRecordReader` 自动为您执行的操作，因此您无需担心细节。\n\n而 `getCurrentVertex()` 方法则必须根据文本行创建一个\
  \ `Vertex` 对象。首先，它获取当前已读取的文本行。然后，创建一个空的 `Vertex` 对象，您需要为其填充信息：ID、类值及其边。回想一下，输入图采用邻接表形式，如下所示：\n\
  \n`John 22 Peter 10`\n\n`Mark 40 John 23 Anne 11`\n\n`Jack 19 Mark 1 Anne 9`\n\n\
  `Julia 29 Mark 32 Natalie 4`\n\n`...`\n\n将文本行分割为单词后，行中的第一个单词描述用户的顶点 ID。下一个单词描述顶点值，即用户的年龄，您将其解析为\
  \ `IntWritable` 对象。接下来的单词描述该用户在 Twitter 上关注的 ID 以及该用户提及这些 ID 的次数。您可以使用这些信息创建顶点边：解析行中的每一对这样的数据，并创建\
  \ `Edge` 对象。解析完整个行后，您使用 `Vertex` 类的 `initialize()` 方法将必要的信息填充到空的 `Vertex` 对象中。\n\
  \n最后，读取完一个 `InputSplit` 后，Giraph 会调用 `VertexReader` 的 `close()` 方法。在示例中，您使用此方法关闭初始化时打开的文件。同样，`LineRecordReader`\
  \ 会为您处理此操作。\n\n至此，`VertexInputFormat` 的操作就结束了。通过这个简单但非常实用的示例，您现在可以开始编写自己的基于顶点的输入格式了。\n\
  \n\n\n### 基于边的输入格式\n\n如上一节所述，基于边的图表示也十分常见。回顾一下，对于示例中的 Twitter 图，其基于边的表示形式如图 7-6\
  \ 所示。\n\n![A978-1-4842-1251-6_7_Fig6_HTML.jpg](img/A978-1-4842-1251-6_7_Fig6_HTML.jpg)\n\
  \n图 7-6. Twitter 图的基于边表示法。边的值代表提及次数\n\n清单 7-6 展示了如何将这种表示法存储在文本文件中。文件中的每一行都代表图中的一条边。回顾一下，从\
  \ A 到 B 的一条边表示用户 A 关注了 B，并且附带 A 提及 B 的次数。文件中的每一行也就在每条边旁边包含了这些信息。\n\n清单 7-6. Twitter\
  \ 图的示例基于边输入文件\n\n```\nJohn Peter 10\nMark John 23\nMark Anne 11\nJack Mark 1\nJack\
  \ Anne 9\nJulia Mark 32\nJulia Natalie 4\nAnne Julia 20\nAnne Peter 10\nNatalie\
  \ Peter 2\nNatalie Anne 50\nNatalie John 10\n```\n\n`Giraph` 提供了一种读取此类表示法的简单方式，称为\
  \ `EdgeInputFormat`。与 `VertexInputFormat` 类似，`Giraph` 使用 `EdgeInputFormat` 将输入数据分割成多个部分，然后处理每个分片中的数据。基本的区别在于\
  \ `EdgeInputFormat` 不创建 `Vertex` 对象，而是创建 `Edge` 对象。此时你可能会好奇 `Vertex` 对象是如何创建的；毕竟，当你实现一个\
  \ `Computation` 时，`Giraph` 会传递一个 `Vertex` 对象供你操作。答案是 `Giraph` 为你处理了 `Vertex` 对象的创建。这是\
  \ `EdgeInputFormat` 提供的便利之一。\n\n让我们深入了解 API 的细节，如清单 7-7 所示。请注意它与 `VertexInputFormat`\
  \ 的相似之处。前两个方法的目的完全相同：检查配置的有效性并返回描述输入部分的 `InputSplit` 对象列表。需要注意的一个区别是，`EdgeInputFormat`\
  \ 不要求你指定顶点值类型 `V`，只要求指定顶点 ID 类型 `I` 和边值类型 `E`。请记住，顶点 ID 类型和边值类型仍必须与你的 `Computation`\
  \ 中的类型匹配。\n\n清单 7-7. `EdgeInputFormat` 抽象类\n\n```\npublic abstract class EdgeInputFormat<I\
  \ extends WritableComparable,\n    E extends Writable> extends GiraphInputFormat<I,\
  \ Writable, E> {\n\n    public abstract void checkInputSpecs(Configuration conf);\n\
  \    public abstract List<InputSplit> getSplits(JobContext context,\n        int\
  \ minSplitCountHint) throws IOException, InterruptedException;\n    public abstract\
  \ EdgeReader<I, E> createEdgeReader(\n        InputSplit split,\n        TaskAttemptContext\
  \ context) throws IOException;\n}\n```\n\nAPI 中最重要的区别是 `createEdgeReader()` 方法，它返回一个扩展了\
  \ `EdgeReader` 抽象类的对象，如清单 7-8 所示。`EdgeReader` 负责读取 `InputSplit` 描述的数据并创建 `Edge`\
  \ 对象。\n\n清单 7-8. `EdgeReader` 抽象类\n\n```\npublic abstract class EdgeReader<I extends\
  \ WritableComparable,\n    E extends Writable> {\n\n    public abstract void initialize(InputSplit\
  \ inputSplit,\n        TaskAttemptContext context)\n        throws IOException,\
  \ InterruptedException;\n    public abstract boolean nextEdge()\n        throws\
  \ IOException, InterruptedException;\n    public abstract I getCurrentSourceId()\n\
  \        throws IOException, InterruptedException;\n    public abstract Edge<I,\
  \ E> getCurrentEdge()\n        throws IOException, InterruptedException;\n    public\
  \ abstract void close() throws IOException;\n}\n```\n\n让我们逐一查看这些方法以及如何实现它们来读取清单\
  \ 7-9 中的示例文件。这个实现被称为 `SimpleTextEdgeReader`。\n\n清单 7-9. 用于基于文本格式的示例 `EdgeReader`\n\
  \n```\npublic class SimpleTextEdgeReader extends EdgeReader<Text, IntWritable> {\n\
  \    private RecordReader<LongWritable, Text> lineRecordReader;\n\n    @Override\n\
  \    public void initialize(InputSplit inputSplit,                    #1\n     \
  \                      TaskAttemptContext context)               #1\n          \
  \  throws IOException, InterruptedException {              #1\n        lineRecordReader\
  \ = new LineRecordReader();                   #1\n        lineRecordReader.initialize(inputSplit,\
  \ context);            #1\n    }\n\n    @Override\n    public final boolean nextEdge()\
  \                                  #2\n            throws IOException, InterruptedException\
  \ {              #2\n        return lineRecordReader.nextKeyValue();           \
  \          #2\n    }\n\n    @Override\n    public final Text getCurrentSourceId()\
  \ throws IOException,\n            InterruptedException {\n        Text line = getRecordReader().getCurrentValue();\
  \             #3\n        String[] words = line.toString().split(\" \");       \
  \         #3\n        return new Text(words[0]);                               \
  \   #3\n    }\n\n    @Override\n    public final Edge<Text, IntWritable> getCurrentEdge()\n\
  \            throws IOException, InterruptedException {\n        Text line = getRecordReader().getCurrentValue();\n\
  \        String[] words = line.toString().split(\" \");\n        Text targetVertexId\
  \ = new Text(words[1]);                    #4\n        IntWritable edgeValue = Integer.parseInt(words[2]);\
  \         #5\n        return new DefaultEdge(targetVertexId, edgeValue);       \
  \   #6\n    }\n\n    @Override\n    public void close() throws IOException {   \
  \                     #7\n        lineRecordReader.close();                    \
  \               #7\n    }\n}\n```\n\n- #1 此方法在最开始时被调用，用于设置 `EdgeReader`。\n- #2 检查是否存在文本行。\n\
  - #3 获取当前文本行，并解析源顶点 ID。\n- #4 解析目标顶点。\n- #5 解析边值。\n- #6 使用解析后的值创建一个 `Edge` 对象。\n\
  - #7 此方法在最后被调用，用于关闭已打开的文件。\n\n首先，请注意你需要像使用 `VertexReader` 那样实现 `initialize()` 和\
  \ `close()` 方法。这些方法在 `Giraph` 开始使用读取器之前以及执行结束时被调用。这里你使用它们来打开和关闭 `InputSplit` 所描述的文件，方式与之前相同。在这个例子中，它们的实现完全相同，因此我们不再赘述。让我们转而探讨\
  \ `EdgeReader` 最有趣的部分。\n\n`EdgeReader` 实现了一个类似于 `VertexReader` 的迭代器风格的接口。如果输入文件中还有更多边需要读取，`nextEdge()`\
  \ 方法返回 true，并将迭代器推进到下一条边。虽然细节未显示，但如果有一行可用，`LineRecordReader` 会读取并缓冲它。在 `Giraph`\
  \ 调用此方法后，它可以接着使用以下两个方法。首先它会调用 `getCurrentSourceId()` 方法。此方法必须返回迭代器当前指向的边的源 ID。回顾一下，`Giraph`\
  \ 会自动为你创建 `Vertex` 对象；`Giraph` 正是通过这种方式知道应该将边附加到哪个 `Vertex` 上。在这个实现中，你所要做的就是读取一行中的第一个单词，并将其作为\
  \ `Text` 对象返回。最后，`Giraph` 调用 `getCurrentEdge()` 方法来创建一个 `Edge` 对象并将其添加到顶点。一条边由目标顶点\
  \ ID 和边值定义。为了获取这些信息，该实现解析每一行的第二个和第三个单词，然后创建并返回一个 `Edge` 对象。\n\n注意 `Edge` 对象的创建。在第\
  \ 5 章中，你只关心通过 `Vertex` 访问 `Edge` 对象；你从未需要创建过 `Edge` 对象。实际上，`Edge` 是一个接口；在底层，`Giraph`\
  \ 使用实现了 `Edge` 接口的特定类型。`DefaultEdge` 是 `Giraph` 提供的这些 `Edge` 实现之一。大多数时候，默认类型能满足你的需求，但你可以自由编写自己的\
  \ `Edge` 实现。\n\n#### 使用内置的边实现\n\n\n\nGiraph 提供了 `Edge` 接口的不同实现，以满足不同用途。你可以在 `org.apache.giraph.edge`\
  \ 包中找到这些实现。例如，当边没有关联值时，`EdgeNoValue` 边类型非常适用，因为这种实现比默认实现更节省内存。为方便起见，Giraph 提供了 `EdgeFactory`\
  \ 工具类，其中包含简化 `Edge` 对象创建过程的方法。\n\n## 组合输入格式\n\n你已经了解到，图可以基于顶点或基于边这两种表示形式进行存储。但在某些场景下，一张图可能同时以多种表示形式存储。一种常见的情况是通过分离图结构来存储图：即，将连接边与每个顶点的信息分开存储。这样做有多种实际原因。例如，不同的分析应用可能需要不同的数据；你可以出于性能原因分离数据，这样任何应用都无需每次都读取所有数据。在\
  \ Twitter 图场景中，你可能希望将以基于边格式存储在 HDFS 文本文件中的“谁关注谁”关系，与以基于顶点格式存储在键值存储中的每个用户的个人资料信息分开管理。图\
  \ 7-7 展示了这种分离的示例。\n\n![A978-1-4842-1251-6_7_Fig7_HTML.jpg](img/A978-1-4842-1251-6_7_Fig7_HTML.jpg)\n\
  \n图 7-7.\n\n图信息被拆分为两种独立的表示形式\n\n这种分离可能是一种常见做法，但应用为了以有意义的方式分析图而组合数据源也同样常见。一个应用必须能够将图\
  \ 7-7 右侧的两个数据源组合起来，以重建原始图。\n\n你可能会想，处理这种情况是否需要基于顶点或基于边的输入格式。但你会很快意识到，单独任何一种输入格式都不足以应对此场景。例如，在前一小节中，`EdgeInputFormat`\
  \ 不提供指定顶点值的方法，因此你无法使用它来读取个人资料信息。同样，你也不能使用 `VertexInputFormat`，因为单个顶点的信息分散在输入的不同位置。作为一种变通方法，你可以在读取之前对数据进行预处理，将两个数据源合并为一个基于顶点格式的输入数据集。但这种方法可能既繁琐又低效，因为每次进行分析时你都必须读取相同的数据两次。\n\
  \n幸运的是，Giraph 提供了一种更便捷高效的方式来处理此场景，它允许你组合两种不同的图表示形式。具体来说，你可以同时使用一个负责读取边表示来创建边的 `EdgeInputFormat`，以及一个负责读取个人资料信息来设置顶点值的\
  \ `VertexInputFormat`。\n\n回顾一下第 5 章中的示例，当你启动作业时，你使用 `–vif` 命令行参数指定了顶点输入格式的类名，并使用\
  \ `–vip` 参数指定了顶点输入路径。类似地，你可以通过将这些参数替换为 `–eif` 参数（指定边输入格式类名）和 `–eip` 参数（指定边输入路径）来使用边输入格式。组合两种类型的输入格式只需在你的命令行中包含所有这四个参数即可。其余工作由\
  \ Giraph 处理。\n\n## 输入过滤器\n\n过滤图是图分析中的常见操作。过滤意味着从原始图中移除部分顶点或边，然后在剩余的图上进行分析。这样做有多种原因。某些图挖掘算法即使执行在图的随机样本上，也能给出良好的近似结果。这通常作为一种加速计算的方式而备受青睐。\n\
  \n在其他情况下，过滤是应用的隐含需求。一种常见场景是，图中边的权重表示顶点之间连接的强度，而你只想对具有强连接的用户进行分析。考虑 Twitter 场景，假设你想通过查看\
  \ Mark 关注的人——Anne 和 John——关注了谁，来向 Mark 推荐新朋友。例如，John 关注了 Peter，那么 Peter 可能也是 Mark\
  \ 的一个不错的推荐。但为了使推荐更相关，你可能只想将 Mark 与之有强连接的邻居包含在此分析中。在这种情况下，你需要过滤掉权重低的边。例如，你可以过滤掉用户提及次数少于\
  \ 20 次的邻居，在此例中排除了 Anne，这表明 Julia 可能不是对 Mark 的相关推荐。\n\n你甚至可以根据每个顶点的信息来执行此类过滤。例如，你可能希望对特定年龄段内的\
  \ Twitter 用户执行此分析。这样，你可以确保不会根据年长用户关注的人来向年轻人推荐朋友。为此，你可以从图中过滤掉所有年龄超过某个阈值的顶点。这些只是可能需要过滤的少数几个例子。\n\
  \nGiraph 提供了一种优雅的方式，让你在必要时将此过滤过程集成到分析中。它允许你指定顶点过滤器和边过滤器，与 `VertexInputFormat` 和\
  \ `EdgeInputFormat` 一起使用。顶点和边过滤器提供了一种方法，让你可以在加载输入数据期间指定是否应将某个顶点或边添加到最终图中。你可以通过实现\
  \ `VertexInputFilter` 和 `EdgeInputFilter` 接口来指定过滤器，这些接口分别如代码清单 7-10 和代码清单 7-11 所示。\n\
  \n代码清单 7-10. `VertexInputFilter`\n\n```java\npublic interface VertexInputFilter<I\
  \ extends WritableComparable,\n\nV extends Writable, E extends Writable> {\n\nboolean\
  \ dropVertex(Vertex<I, V, E> vertex);                 #1\n\n}\n\n#1 决定是否丢弃顶点。\n\
  ```\n\n代码清单 7-11. `EdgeInputFilter`\n\n```java\npublic interface EdgeInputFilter<I\
  \ extends WritableComparable,\n\nE extends Writable> {\n\nboolean dropEdge(I sourceId,\
  \ Edge<I, E> edge);\n\n}\n```\n\n对于基于顶点的输入格式，在加载图的过程中，Giraph 使用 `VertexInputFilter`\
  \ 对象来决定是否应过滤某个顶点。`VertexInputFilter` 接口有一个名为 `dropVertex()` 的单一方法，返回布尔值。回顾前几节，Giraph\
  \ 使用 `VertexReader` 来创建 `Vertex` 对象。对于 `VertexReader` 创建的每个 Vertex 对象，Giraph 会调用\
  \ `dropVertex()` 并将该 `Vertex` 对象作为输入参数传入，以决定是否保留相应的顶点。如果该方法返回 true，那么 Giraph 将丢弃该顶点。\n\
  \n\n\n类似地，对于基于边的输入格式，Giraph 使用 `EdgeInputFilter` 来决定读取到的边是否应被包含在图中。对于创建的每个 `Edge`\
  \ 对象，Giraph 会调用 `dropEdge()` 方法，并将该边源顶点的 ID 以及边对象本身作为参数传入。如果该方法返回 true，Giraph 就会丢弃该边。清单\
  \ 7-12 展示了一个 `EdgeInputFilter` 的示例实现，该实现根据边的权重来决定是否包含某条边。以 Twitter 图为例，你可以使用这种边过滤器来过滤掉那些提及次数较少、被认定为弱连接的边。\n\
  \n**清单 7-12. 一个边输入过滤器示例**\n\n```\npublic class WeightInputFilter extends EdgeInputFilter<Text,IntWritable>\
  \ {\n\n   public static int THRESHOLD = 10;\n\n   boolean dropEdge(Text sourceId,\
  \ Edge<Text,IntWritable> edge) {\n      if (edge.getValue().get() < THRESHOLD) {\n\
  \         return true;\n      }\n      return false;\n   }\n}\n```\n\n正如你可能预料到的，顶点\
  \ ID 和边值类型必须与你所使用的输入格式实现的类型相匹配。\n\n一旦实现了你的过滤器，你就可以通过命令行指定使用它。你可以通过在执行命令中添加 `giraph.vertexInputFilterClass`\
  \ 自定义参数，并将你的过滤器实现类名设为其值来实现这一点。\n\n请注意，如果你愿意，也可以在你的应用程序中使用你在第 5 章中学到的变异 API 来实现过滤逻辑。这样，你就可以将计算的第一个超步专门用于过滤。然而，使用过滤器有几个好处。首先，它允许你将过滤逻辑与主应用程序逻辑解耦，从而实现清晰、可复用的代码。其次，使用输入过滤器，Giraph\
  \ 可以在读取图的早期阶段进行过滤，从而使图的加载更高效。这样做速度更快，且所需内存更少。\n\n或者，你也可以通过单独的脚本来预处理你的图。但这可能是一项繁琐的任务，因为你需要编写代码从不同的存储系统和格式中读取数据。而\
  \ Giraph 及其输入格式已经提供了这一功能。此外，这样做可能效率也不高，因为每次想要分析图时，你都需要读取两次图：一次用于预处理，另一次用于实际分析。输入过滤器简化了这些任务。\n\
  \n## 输出格式\n\n你已经学习了如何读取输入图以及如何在其上执行有用的分析。为了完善整个流程，你所缺少的是一种输出分析结果的方法。毕竟，如果无法以某种方式保存结果以供后续使用，那么这个结果也就毫无价值了。输出格式正是\
  \ Giraph 为此提供的工具。在计算结束时，图中的 `Vertex` 和 `Edge` 对象包含了所有你想要存储的有用信息。例如，在你在第 5 章编写的短路径应用中，计算结束时顶点包含了最短距离的值。Giraph\
  \ 使用一种输出格式将 `Vertex` 和 `Edge` 对象的内容保存到存储系统中。\n\n与输入格式类似，存在基于顶点和基于边的两种输出格式。正如你可能猜到的，基于顶点的输出格式用于保存各个顶点的信息，而基于边的输出格式则用于保存在\
  \ `Edge` 对象中的信息。在第 5 章的示例中，你主要使用的是基于顶点的输出格式。你需要哪种输出格式取决于你的具体场景。例如，当你计算每个顶点的度量值（如距离或排名）时，你自然需要一种基于顶点的输出格式。但假设你以基于边的输入格式读取了一个输入图，并且只想对其进行转换。（你在第\
  \ 4 章中看到过这样一个转换的例子，其中你将无向图转换成了有向图。）在这种情况下，你可能也希望将转换后的图以基于边的格式保存。\n\n与读取输入图类似，你可能希望将结果信息存储到不同的存储系统并以不同的格式保存。为了适应这一点，Giraph\
  \ 导出了两个基本的抽象类 `VertexOutputFormat` 和 `EdgeOutputFormat`，你可以对其进行扩展。例如，你在第 5 章中使用的\
  \ `GraphvizOutputFormat` 就是为你提供的一个 `VertexOutputFormat` 实现。在本节中，你将学习如何编写自己的输出格式。本章重点介绍基于文本的格式，但在第\
  \ 9 章中，你将了解如何将数据输出到任何存储系统以及以任何格式输出。\n\n\n\n### 基于顶点的输出格式\n\n首先，你将学习如何实现一个基于顶点的输出格式。假设你运行了最短距离应用，并希望将计算出的每个顶点的距离保存到文本文件中，然后存储到\
  \ HDFS——这是典型的场景。为此，你需要继承 `VertexOutputFormat` 抽象类，如代码清单 7-13 所示。\n\n```\npublic\
  \ abstract class VertexOutputFormat<\n  I extends WritableComparable, V extends\
  \ Writable,\n  E extends Writable> {\n  public abstract void checkOutputSpecs(JobContext\
  \ context)\n    throws IOException, InterruptedException;\n  public abstract VertexWriter<I,\
  \ V, E> createVertexWriter(\n    TaskAttemptContext context) throws IOException,\
  \ InterruptedException;\n  public abstract OutputCommitter getOutputCommitter(\n\
  \    TaskAttemptContext context) throws IOException, InterruptedException;\n}\n\
  ```\n\n在 `VertexOutputFormat` 中，首先需要注意的一点是，顶点 ID、顶点值和边值类型是该类的参数。这意味着你的实现（除非是抽象的）必须指定这些类型，并且它们必须与你的\
  \ `Computation` 中的相应类型匹配。\n\n接下来，代码清单 7-14 描述了 `VertexOutputFormat` 类的方法并实现了它们。这个实现被称为\
  \ `SimpleTextVertexOutputFormat`。\n\n```\npublic class SimpleTextVertexOutputFormat\n\
  \  extends VertexOutputFormat<Text, IntWritable, IntWritable> {\n  @Override\n \
  \ public void checkOutputSpecs(JobContext context)\n    throws IOException, InterruptedException\
  \ {\n    textOutputFormat.checkOutputSpecs(context);\n  }\n  @Override\n  public\
  \ VertexWriter<Text, IntWritable, E> createVertexWriter(\n    TaskAttemptContext\
  \ context)\n    throws IOException, InterruptedException {\n    return new SimpleTextVertexWriter();\
  \                         #1\n  }\n  @Override\n  public OutputCommitter getOutputCommitter(TaskAttemptContext\
  \ context)\n    throws IOException, InterruptedException {\n    return textOutputFormat.getOutputCommitter(context);\n\
  \  }\n}\n```\n\n#1 这返回一个继承自 `VertexWriter` 类的对象。\n\nGiraph 在作业开始时调用 `checkOutputSpecs()`，并向其传递一个包含配置信息的\
  \ `JobContext` 对象。其作用是执行类似于你在输入格式中学到的检查。例如，你可以检查输出目录是否已在作业配置中设置，如果已设置，则检查该目录是否已存在且包含无法覆盖的数据。在这种情况下，此方法可能会抛出异常。\n\
  \n与 `VertexReader` 对象类似，Giraph 使用 `VertexWriter` 对象来完成将对象中的顶点信息写入输出的主要工作。具体来说，在你的计算完成后，Giraph\
  \ 会在集群中的每个工作机器上创建一个 `VertexWriter` 对象，并使用这些对象将每个顶点的信息写入输出。它通过调用 `VertexOutputFormat`\
  \ 类的 `createVertexWriter()` 方法来实现这一点，该方法返回一个继承自 `VertexWriter` 抽象类的对象。每个这样的对象负责处理图中的一组顶点。图\
  \ 7-8 展示了这一过程。\n\n![A978-1-4842-1251-6_7_Fig8_HTML.jpg](img/A978-1-4842-1251-6_7_Fig8_HTML.jpg)\n\
  \n**图 7-8.** 使用 `VertexOutputFormat` 和 `VertexWriter` 对象保存图\n\n请注意，Giraph 遵循的流程与其读取图时执行的流程相反。Giraph\
  \ 从文本文件重建图开始，现在它必须将图保存回相同类型的格式。但让我们更详细地看一下 `VertexWriter` 中发生了什么。代码清单 7-15 显示了你需要实现的\
  \ `VertexWriter` 抽象类方法。\n\n```\npublic abstract class VertexWriter<I extends WritableComparable,\n\
  \  V extends Writable, E extends Writable> {\n  public abstract void initialize(TaskAttemptContext\
  \ context)\n    throws IOException, InterruptedException;\n  public abstract void\
  \ writeVertex(Vertex<I, V, E> vertex)\n    throws IOException, InterruptedException;\n\
  \  public abstract void close(TaskAttemptContext context)\n    throws IOException,\
  \ InterruptedException;\n}\n```\n\n示例输出格式返回一个名为 `SimpleTextVertexWriter` 的 `VertexWriter`，它被设计用于将顶点信息写入文本文件。代码清单\
  \ 7-16 展示了 `SimpleTextVertexWriter` 及其方法的实现。\n\n```\npublic class SimpleTextVertexWriter\n\
  \  extends VertexWriter<Text, IntWritable, IntWritable> {\n  private RecordWriter<Text,\
  \ Text> lineRecordWriter;\n  @Override\n  public void initialize(TaskAttemptContext\
  \ context)\n    throws IOException, InterruptedException {\n    lineRecordWriter\
  \ = createLineRecordWriter(...);            #1\n  }\n  @Override\n  public final\
  \ void writeVertex(Vertex vertex) throws\n    IOException, InterruptedException\
  \ {\n    String line = vertex.getId() + \" \" + vertex.getValue();   #2\n    lineRecordWriter.write(new\
  \ Text(line), null);             #3\n  }\n  @Override\n  public void close(TaskAttemptContext\
  \ context)\n    throws IOException, InterruptedException {\n    lineRecordWriter.close(context);\
  \                          #4\n  }\n}\n```\n\n#1 创建一个行记录写入器对象。\n#2 生成一个包含待写入顶点信息的字符串。\n\
  #3 使用记录写入器写入该字符串。\n#4 关闭记录写入器。\n\n在开始使用 `VertexWriter` 之前，Giraph 会调用 `initialize()`，并传入一个\
  \ `TaskAttemptContext` 作为输入。`initialize()` 方法通常使用 `TaskAttemptContext` 对象中的配置信息来设置输出文件。例如，这涉及创建输出文本文件并获取该文件的句柄。要将输出写入\
  \ HDFS，你使用 `LineRecordWriter` 类，它可以为你处理这些任务。在 `VertexWriter` 初始化之后，Giraph 会为图中的每个顶点调用\
  \ `writeVertex()` 方法。在此方法中，你必须指定要输出哪些信息以及如何写入这些信息。在这里，你将顶点值写入输出文本文件。该实现首先生成一个包含顶点\
  \ ID 和顶点值的字符串；然后使用 `LineRecordWriter` 将该字符串追加到输出文件中。\n\n**使用 LINERECORDWRITER**\n\
  \n注意，你使用 `LineRecordWriter` 的 `write()` 方法将文本追加到文件中。`write()` 方法接受两个输入参数：一个键和一个值。然后，`LineRecordWriter`\
  \ 将键和值参数都写入输出文件。这里你只需要写入一个字符串，所以只需将其作为键参数传递，并将第二个参数保留为 `null`。`LineRecordWriter`\
  \ 知道忽略 `null` 参数。\n\n在写入每个顶点后，Giraph 会调用 `close()` 方法，该方法在此示例中会关闭你在初始化时打开的文件。同样，`LineRecordWriter`\
  \ 会为你处理此任务。\n\n这里的一个新特性是 `OutputCommitter`。输出提交器是一个从 Hadoop 借用的组件；其主要工作是设置作业的输出目录。这包括设置一个目录，用于在作业完成前写入临时输出文件，并在作业成功完成后将文件从临时目录移动到最终目录。这里我们不深入探讨\
  \ `OutputCommitter` 方法的细节。对于 HDFS 输出，你可以简单地重用 Hadoop API 提供的标准 `OutputCommitter`，它会为你处理设置输出目录所涉及的所有任务。第\
  \ 9 章在讨论存储系统时会再次提到 `OutputCommitter`。\n\n\n\n### 基于边的输出格式\n\n基于边的输出格式与基于顶点的输出格式非常相似。你可以在代码清单\
  \ 7-17 中立即看到相似之处，该清单展示了`EdgeOutputFormat`抽象类。\n\n**代码清单 7-17.** `EdgeOutputFormat`\
  \ 抽象类\n\n```\npublic abstract class EdgeOutputFormat<\n    I extends WritableComparable,\
  \ V extends Writable,\n    E extends Writable> {\n  public abstract void checkOutputSpecs(JobContext\
  \ context)\n      throws IOException, InterruptedException;\n  public abstract OutputCommitter\
  \ getOutputCommitter(\n      TaskAttemptContext context) throws IOException, InterruptedException;\n\
  \  public abstract EdgeWriter<I, V, E> createEdgeWriter(\n      TaskAttemptContext\
  \ context) throws IOException, InterruptedException;\n}\n```\n\n基本的区别在于，现在需要实现的是`EdgeWriter`而不是`VertexWriter`。代码清单\
  \ 7-18 展示了`EdgeWriter`抽象类。这个类中最重要的方法是`writeEdge()`；Giraph 会为图中的每条边调用此方法。\n\n**代码清单\
  \ 7-18.** `EdgeWriter` 抽象类\n\n```\npublic abstract class EdgeWriter<\n    I extends\
  \ WritableComparable, V extends Writable,\n    E extends Writable>\n  public abstract\
  \ void initialize(TaskAttemptContext context)\n      throws IOException, InterruptedException;\n\
  \  public abstract void writeEdge(I sourceId, V sourceValue, Edge<I,E> edge)\n \
  \     throws IOException, InterruptedException;\n  public abstract void close(TaskAttemptContext\
  \ context)\n      throws IOException, InterruptedException;\n}\n```\n\n让我们看一个如何实现`EdgeWriter`的示例，该`EdgeWriter`将边及其数值保存到存储在\
  \ HDFS 上的文本文件中。这个实现名为`SimpleTextEdgeWriter`，如代码清单 7-19 所示。\n\n**代码清单 7-19.** 一个基于文本的`EdgeWriter`示例\n\
  \n```\npublic class SimlpeTextEdgeWriter<\n    extends EdgeWriter<Text, NullWritable,\
  \ IntWritable> {\n  private RecordWriter<Text, Text> lineRecordWriter;\n\n  @Override\n\
  \  public void initialize(TaskAttemptContext context)             #1\n      throws\
  \ IOException, InterruptedException {                #1\n    lineRecordWriter =\
  \ createLineRecordWriter(...);              #1\n  }\n\n  @Override\n  public final\
  \ void writeEdge(Text sourceId,\n      IntWritable sourceValue, Edge<Text, IntWritable>\
  \ edge)\n      throws IOException, InterruptedException {\n    String line = sourceId+\"\
  \ \"+                                 #2\n        edge.getTargetVerexId()+\" \"\
  +                            #2\n        edge.getValue();                      \
  \                  #2\n    lineRecordWriter.write(new Text(line), null);       \
  \        #3\n  }\n\n  @Override\n  public void close(TaskAttemptContext context)\n\
  \      throws IOException, InterruptedException {\n    lineRecordWriter.close(context);\
  \                            #4\n  }\n}\n```\n\n#1 通过创建行记录写入器来初始化`EdgeWriter`。 \
  \ \n#2 构建要写入输出的字符串。  \n#3 使用行记录写入器写入该字符串。  \n#4 最后关闭输出文件。\n\n到目前为止，你需要为`EdgeWriter`实现的大多数方法应该不会让你感到意外。你使用`initialize()`方法，通过创建熟悉的`LineRecordWriter`来设置`EdgeWriter`。与`VertexWriter`类似，Giraph\
  \ 会为图中的每条边调用`writeEdge()`。Giraph 会向此方法传递边的源顶点 ID、它的顶点值以及边对象本身。在这个实现中，你构建了一个包含源顶点\
  \ ID、目标顶点 ID 和边值的字符串。然后，你使用`LineRecordWriter`将该字符串写入到输出文件中。\n\n输出格式为你提供了输出图中存储信息（顶点值和边值）所需的所有工具。但请记住，Giraph\
  \ 程序还允许你将信息保存在不同的对象中。其中最有用的就是聚合器。\n\n## 聚合器写入器\n\n聚合器用于保存关于整个图的信息，例如计数器和聚合统计数据。例如，在第\
  \ 5 章中，你看到了一个如何使用聚合器来追踪拥有最多关注者的 Twitter 用户的示例。通常，在程序结束时，聚合器会持有有用的信息——在这个例子中，是最受欢迎的\
  \ Twitter 用户——你希望像输出图中顶点和边所持有的信息一样，将这些信息输出到文件中。\n\n为了实现这一点，Giraph 提供了一种称为聚合器写入器的工具。Giraph\
  \ 使用聚合器写入器将聚合器的值保存到你选择的存储介质和格式中：例如，保存到 HDFS 上的文本文件中。在第 5 章中，你使用了 Giraph 代码库中提供的一种聚合器写入器实现，该实现将聚合器值保存到一个文件中。在这里，你将学习如何实现你自己的聚合器写入器。\n\
  \n为了指定如何保存聚合器的值，你必须实现代码清单 7-20 中所示的`AggregatorWriter`接口。Giraph 在每个超步结束时使用`AggregatorWriter`来保存存储在聚合器中的值。\n\
  \n**代码清单 7-20.** `AggregatorWriter` 接口\n\n```\npublic interface AggregatorWriter\n\
  \    extends ImmutableClassesGiraphConfigurable {\n  void initialize(Context context,\
  \ long applicationAttempt)\n      throws IOException;\n  void writeAggregator(Iterable<Entry<String,\
  \ Writable>> aggregatorMap,\n      long superstep) throws IOException;\n  void close()\
  \ throws IOException;\n}\n```\n\n让我们看一个如何实现这些方法以自定义保存聚合器信息的示例。代码清单 7-21 展示了一个简单的聚合器写入器，名为`SimpleAggregatorWriter`，它将聚合器值导出到\
  \ HDFS 上的一个文本文件中。\n\n**代码清单 7-21.** 示例聚合器写入器\n\n```\npublic class SimpleAggregatorWriter\
  \ implements AggregatorWriter {\n  private FSDataOutputStream output;\n\n  @Override\n\
  \  public void initialize(Context context, long applicationAttempt)\n      throws\
  \ IOException {\n    Path p = new Path(\"aggregatedValues_\" + applicationAttempt);\
  \  #1\n    FileSystem fs = FileSystem.get(context.getConfiguration());\n    output\
  \ = fs.create(p, true);                                  #2\n  }\n\n  @Override\n\
  \  public void writeAggregator(\n      Iterable<Entry<String, Writable>> aggregatorMap,\n\
  \      long superstep) throws IOException {\n    for (Entry<String, Writable> entry\
  \ : aggregatorMap) {        #3\n      String text = entry.getKey()+\" \"+entry.getValue();\n\
  \      output.writeChars(text);                                   #4\n    }\n  \
  \  output.flush();\n  }\n\n  @Override\n  public void close() throws IOException\
  \ {\n    output.close();                                               #5\n  }\n\
  }\n```\n\n#1 根据应用尝试次数命名输出文件。  \n#2 在 HDFS 上创建一个文件。  \n#3 遍历所有聚合器。  \n#4 将聚合器名称和值附加到文件中。\
  \  \n#5 关闭输出文件。\n\n你实现的第一个方法是`initialize()`。Giraph 在开始使用聚合器之前立即调用此方法，并且通常用它来设置聚合器写入器。它传递的第一个参数是一个`Context`对象，其中包含关于作业的配置信息。第二个参数指示应用尝试的次数。每当\
  \ Giraph 选出一个新的主节点时，就会发生一次应用尝试；在大多数情况下，这只会发生一次，但有时，例如主节点发生故障后，必须选出新的主节点。该示例使用此方法创建了用于输出聚合器值的\
  \ HDFS 文件。请注意，你根据应用尝试次数命名输出文件，这样你就可以区分不同的尝试。\n\n\n\n### 接下来，你需要实现 `writeAggregator()`\
  \ 方法\n\nGiraph 会在每个超步结束时调用此方法，并传入两个参数。第一个参数是一个 `Map`，其中包含每个已注册聚合器的键值对，键是代表聚合器名称的\
  \ `String`，值是聚合器对应的值。第二个参数是刚刚结束的超步编号。请注意，Giraph 使用特殊超步编号 `-1` 来表示这是最后一个超步。你可以利用这一信息来决定是在每个超步都执行某些操作，还是只在最后执行。本示例会遍历所有聚合器；对于每个聚合器，我们会在输出文件中写入一行，包含该聚合器的名称和值。\n\
  \n在此方法中，你可以实现任意逻辑。例如，你可能只想选择特定的聚合器导出到文件，或者决定只在最后一个超步时才导出聚合器的值。你可能还希望将不同的聚合器输出到不同的文件名，甚至将值输出到不同的存储系统或格式。你可以根据自己的特定应用场景进行灵活调整。\n\
  \n### 最后，你需要实现 `close()` 方法\n\nGiraph 会在成功执行结束时调用此方法。在这里，我们使用此方法来关闭初始化时打开的文件。\n\n\
  ## 总结\n\n读取输入图是使用 Giraph 时需要执行的第一步，而保存分析结果同样必不可少。这些听起来是简单的任务，但一旦开始考虑图谱可能存储的各种格式和存储系统，它们就会变得具有挑战性。Giraph\
  \ 提供了必要的工具来简化这一过程。\n\n在本章中，你学习了以下内容：\n\n-   了解输入图的表示方式、存储系统的细节及其格式，是管理输入和输出数据的第一步。\n\
  -   你可以使用 `VertexInputFormat` 和 `EdgeInputFormat` 的实现来分别读取基于顶点和基于边的输入数据。它们的作用是将原始输入数据转换为可供使用的\
  \ `Vertex` 和 `Edge` 对象。\n-   `VertexOutputFormat` 和 `EdgeOutputFormat` 的实现则允许你以基于顶点或基于边的格式保存输出信息。\n\
  -   Giraph 提供了一个支持常见情况的输入输出格式库，可能满足你的需求。请务必检查现有的代码库，因为它可能会为你节省时间。\n-   当你开始以更高级的方式使用\
  \ Giraph，并将其集成到你特定的数据分析架构中时，你可能需要更多基础功能之外的东西。扩展输入输出格式 API 可以让你添加更多功能——例如，支持新的存储系统。\n\
  -   你可能经常需要组合不同的图表示形式。在这种情况下，组合 `VertexInputFormat` 与 `EdgeInputFormat` 的能力会变得非常有用。\n\
  \n在最后几章中，你已经学习了如何使用基本的 Giraph API。尽管这让你能够对图进行复杂的分析，但 Giraph API 的功能更加强大。接下来的章节将探讨\
  \ Giraph 提供的高级特性；你将学习如何为应用添加功能、提高效率，以及编写更清晰、更可复用的代码。\n\n"
- "# 8. 超越基础 API\n\n本章涵盖：\n\n-   图突变\n-   聚合器 API\n-   顶点协调\n-   编写模块化应用\n\n在前面的章节中，你学习了如何使用\
  \ Giraph 编程 API 的基础部分来实现各种图算法。虽然基础 API 已经为你提供了足够的灵活性来构建大量有用的图挖掘算法，但本章将介绍 Giraph\
  \ API 中超越基础的功能特性，这些特性使你能够编写更复杂的应用。Giraph API 功能丰富，允许你为应用添加更多功能、更高效地编写算法，甚至从编程角度让你的工作更轻松。\n\
  \n虽然我们通常将输入图视为不可变的数据结构，但本章将讨论你想要通过添加或删除顶点和边来改变输入图的场景。Giraph 提供了一个允许你对输入图执行此类突变的\
  \ API。我们将使用示例来描述使用此 API 的不同方式。\n\n接下来，我们将重新审视聚合器，这是一种允许你计算整个图的全局统计信息的工具。在前面的章节中，你已经看到了典型聚合器的示例，并学习了如何在应用中使用它们。在此，我们将介绍\
  \ Giraph 提供的用于编写自定义聚合器的 Java API；并通过实现聚合器来进行说明。\n\n此外，分布式算法中最重要的特性之一就是协调。到目前为止，你已经学会了以顶点为中心的方式进行思考，编写程序使得顶点之间通过消息以分布式方式进行通信。Giraph\
  \ 负责协调算法的执行。在此，你将学习如何在希望进一步自定义算法执行时干预这一协调过程。\n\n本章还将涵盖 Giraph API 中那些从编程角度让你更容易编写复杂应用的特性。你将学习如何将一个可能很复杂的算法分解为执行不同逻辑操作的模块，从而产生更清晰、更易于理解的代码。反过来，你也将学习如何将这些模块组合到不同的应用中，从而提高代码复用率并节省编程工作量。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n## 图表突变\n\n在本小节中，您将探索在算法执行期间改变图结构的能力。通常，改变图意味着添加或移除顶点和边。虽然大部分情况下，您考虑的是分析输入的图，但在这里您会看到，改变图通常是此分析过程的一部分。\n\
  \n出于不同的原因，图突变可能是必要的。在某些场景中，您可能只是想转换输入图；例如，作为预处理步骤。您已经在第 3 章和第 5 章中看到了图转换的示例，那里您学习了如何将有向图转换为无向图。在这种情况下，图突变是一个自然的需求。\n\
  \n在其他场景中，您分析的结果可能是一个与输入图完全不同的图。一个常见的例子是，您想将一个输入图划分为社区或集群，然后分析这些社区之间的连接关系。社区检测是社交网络分析中的一个常见应用。在在线社交网络中，您可能希望找到具有相似特征的用户社区，并输出这些社区本身是如何相互连接的。在这种情况下，社区检测算法的输出是一个代表社区的图，这是一个与您的输入图完全不同的图结构。这意味着，在算法执行期间，您必须以某种方式创建一个图；也就是说，创建新的顶点并用新的边将它们连接起来。\n\
  \n图生成器是另一个需要图突变的应用场景。图生成器是有用的工具，允许用户构建符合某些模型（如流行的“小世界”模型）的合成图。事实上，Giraph 代码已经包含了几个图生成器的实现。在这种情况下，图突变是自然而然的；这些工具可以从一个空图或一个初始种子图开始，逐步添加顶点和边，直到构建出最终的图。\n\
  \n在深入了解允许您更改图的 API 之前，理解改变输入图意味着什么非常重要。在这一点上，您必须记住，Giraph 将输入图加载到内存中，并在内部表示中维护一个副本。Giraph\
  \ 操作并可以（如果需要）改变的就是这个图的副本。图的原始副本保持不变。例如，如果您将图存储在 Hadoop 集群的 HDFS 目录中，然后执行一个使用突变 API\
  \ 的算法，那么 HDFS 上的图数据在执行后将完全相同。\n\n当然，用户可以改变这个图的内存副本，并将一个新的副本输出到某个外部存储系统。在将有向图转换为无向图的情况下，您将创建该图的一个无向形式的新副本。这将是\
  \ Giraph 作业的输出。\n\n**注**：用户始终可以在顶点计算函数内部修改原始图。假设该图存储在一个表存储系统中，例如 HBase。没有任何东西可以阻止用户编写一个连接到\
  \ HBase 并修改图的顶点计算。然而，这样的操作将超出 Giraph 的范围。Giraph 不保证这些更改的一致性。例如，如果某个 Giraph 工作节点发生故障，Giraph\
  \ 保证能产生正确的结果，但不保证这种外部更改的正确性。这是 Giraph 编程 API 灵活性带来的一种能力和风险。如果您选择利用这种灵活性，您应该意识到所有风险，并格外小心地设计您的程序，以确保它不会引起任何问题，尤其是在生产环境中使用时。\n\
  \n既然我们已经讨论了图突变的实用性，那么让我们来探索赋予您这种能力的实际 API。第 5 章简要介绍了突变 API，而这里将通过多种示例对其进行详细解释。\n\
  \n## 突变 API\n\nGiraph 提供了三种在执行期间改变图结构的方法：（i）对顶点的直接突变，（ii）突变请求，以及（iii）通过消息进行突变。这些方法可能允许不同类型的图突变，并且在突变何时实现方面具有不同的语义。接下来，您将回顾每种突变类型的\
  \ API 并说明它们的用法。\n\n### 直接突变\n\n为了说明直接突变 API 的用法，让我们使用一个您已经在第 5 章中看过的示例。在这个示例中，您想要将一个输入图从有向图转换为无向图。图\
  \ 8-1 展示了这种转换。\n\n![A978-1-4842-1251-6_8_Fig1_HTML.jpg](img/A978-1-4842-1251-6_8_Fig1_HTML.jpg)\n\
  \n**图 8-1.** 将有向图转换为无向图\n\n在图 8-1 中，您看到这种转换需要您更改图结构。特别是，您需要在现有顶点之间添加一些额外的边。\n\n\
  `Vertex` 接口包含了许多方法，允许顶点计算函数直接更改顶点的结构——即更改其边。\n\n*   它们只能更改调用它们的顶点。\n*   这种调用的效果是立即生效的。\n\
  \n让我们看看允许改变其结构的 `Vertex` 方法：\n\n*   `addEdge(Edge<I, E> edge)`：向顶点添加一条边。边的 ID 和值通过传递的\
  \ `Edge` 对象指定。\n*   `removeEdges(I targetVertexId)`：从顶点中移除所有具有指定目标 ID 的边。\n*   `setEdges(Iterable<Edge<I,\
  \ E>> edges)`：通过遍历传递的 `Iterable` 并逐条添加边来设置顶点的出边。\n\n在清单 8-1 中，让我们重新审视第 5 章中的示例代码；接下来将详细解释它使用突变\
  \ API 的方式。\n\n**清单 8-1.** 将图从有向图转换为无向图\n\n```\npublic class ConvertToUndirected\
  \ extends\n\n  BasicComputation<Text, DoubleWritable, NulleWritable, Text> {\n\n\
  \  static final NullWritable DEFAULT_EDGE_VALUE = NullWritable.get();\n\n  @Override\n\
  \n  public void compute(Vertex<Text, DoubleWritable, DoubleWritable> vertex,\n\n\
  \                      Iterable<Text> messages) {\n\n    if (getSuperstep() == 0)\
  \ {                                           #1\n      sendMessageToAllEdges(vertex,\
  \ vertex.getId());                     #1\n    } else {\n\n       for (Text m :\
  \ messages) {                                         #2\n\n          if (vertex.getEdgeValue(m)==null)\
  \ {                            #3\n\n           vertex.addEdge(EdgeFactory.create(m,\
  \ DEFAULT_EDGE_VALUE));    #4\n\n         }\n\n      }\n\n    }\n\n    vertex.voteToHalt();\n\
  \n  }\n\n}\n```\n\n#1 在第一个超步中，每个顶点都将其自身的 ID 发送给它的所有邻居。\n#2 在第二个超步中，顶点接收到来自每个拥有指向它的边的顶点的消息。\n\
  #3 对于收到的每一条此类消息，顶点检查对应的边是否已经存在。\n#4 如果边不存在，顶点则添加该边。\n\n请注意，`addEdge` 方法将一个实现了 `Edge`\
  \ 接口的对象作为输入。虽然您可以实现自己的 `Edge` 类型，但 Giraph 已经提供了在大多数情况下应该足够使用的默认实现。特别是，您可以使用 `EdgeFactory`\
  \ 实用类的 `create()` 方法来创建 `Edge` 对象。\n\n\n\n### 变异请求\n\n接下来，你将看到一个示例，说明直接变异可能并不总是适合修改图结构，并了解变异请求如何提供更高的灵活性。假设你想分析一个类似\
  \ Twitter 的社交网络，并探索不同国家的用户是如何关联的——而不是像你之前做的那样分析单个用户连接。从原始的社交图谱开始，你想创建一个新图谱，其中每个顶点对应一个国家，边表示这些国家的用户之间存在连接关系。这让你能够构建\
  \ Twitter 图谱的高层视图，并在国家层面观察社交影响力，如图 8-2 所示。\n\n![A978-1-4842-1251-6_8_Fig2_HTML.jpg](img/A978-1-4842-1251-6_8_Fig2_HTML.jpg)\n\
  \n图 8-2. 分析不同国家用户之间的连接关系\n\n很明显，在分析原始图谱的同时，你也在创建一个新图谱。事实上，新图谱才是该算法的实际输出。然而，由于这个新图谱的顶点并非预先存在，你无法像之前那样直接使用直接变异。让我们看看变异请求是如何解决这个问题的。\n\
  \n变异请求是 `Computation` 接口中的方法。就像直接变异一样，你可以在顶点计算函数中调用这些方法。但是，与直接变异不同，变异请求具有以下属性：\n\
  \n-   它可以修改图的任何部分，无论发起请求的是哪个顶点。例如，顶点 A 可以请求在顶点 B 和 C 之间添加一条边。\n-   变异请求的效果只有在当前超步完成后、下一个超步开始前才可见。\n\
  \n**注意**\n\n第二个属性起初可能看起来有点不自然，但它实际上是为了简化你的程序。这个属性允许你将处理顶点和边创建或删除的逻辑与其余编程逻辑分离开来。即使顶点请求修改了同一个顶点，该请求对发起请求的顶点剩余的当前超步计算也没有影响。它也不会影响其他顶点在请求发出后、但仍在同一超步内进行的计算。\n\
  \n接下来，让我们看看这个 API 的实际应用。\n\n清单 8-2 显示了这个算法的实现。虽然逻辑可能不是一目了然，但所有部分稍后都会解释清楚。\n\n**清单\
  \ 8-2.** 在 Twitter 图谱中查找国家连接关系\n\n```\npublic class CreateCountryGraph extends\n\
  BasicComputation<Text, Text, NullWritable, Text> {\n\n  static final NullWritable\
  \ DEFAULT_EDGE_VALUE = NullWritable.get();\n\n  @Override\n  public void compute(Vertex<Text,\
  \ Text, NullWritable> vertex,\n                      Iterable<Text> messages) {\n\
  \    Text myCountry = vertex.getValue();\n    if (getSuperstep()==0) {         \
  \                                    #1\n      sendMessageToAllEdges(vertex, myCountry);\
  \                          #1\n    } else {\n      for (Text m : messages) {   \
  \                                       #2\n        addEdgeRequest(m,          \
  \                                      #3\n          EdgeFactory.create(myCountry,\
  \ DEFAULT_EDGE_VALUE));            #3\n      }\n      removeVertexRequest(vertex.getId());\
  \                               #4\n      vertex.voteToHalt();\n    }\n  }\n}\n\
  ```\n\n#1 向我关注的每个用户发送我自己国家的名称。  \n#2 在超步 1，每条消息都包含一个关注我的用户所在的国家。  \n#3 对于每条消息，创建一条从对方国家指向我所在国家的新边。\
  \  \n#4 每个用户顶点将自己从图中移除，这样最后剩下的只有国家顶点。\n\n在这个场景中，顶点的 ID 类型为 `Text`，代表用户的名称，而顶点的值类型也是\
  \ `Text`，代表用户所在的国家。算法运行的大致思路应该很熟悉。你需要了解关注关系图中隐藏着哪些国家之间的配对关系。自然的做法是让每个顶点将其所属国家告知其邻居。算法的第一个超步正是实现了这一逻辑。每个顶点向它关注的顶点发送自己的顶点值，即其对应的国家（#1）。\n\
  \n在第二个超步中，每个顶点现在都知道它的粉丝来自哪些国家。换句话说，它知道了在新的国家图谱中应该存在怎样的边。此时，它可以使用 `addEdgeRequest()`\
  \ 方法（#3）简单地请求创建一条从粉丝所在国家指向自己国家的边。`addEdgeRequest()` 方法会请求在指定源 ID 的顶点处添加一条边。边的值和目标\
  \ ID 通过传递的边对象来指定。\n\n**注意**\n\n你不需要显式创建代表国家的顶点。通过请求在两个国家之间创建一条边，Giraph 会自动创建相应的顶点（如果它们尚不存在）。\n\
  \n不过，你还没有完成。通过创建这些新边，算法执行结束时存在两种类型的顶点：构成原始图谱的用户顶点和构成国家图谱的国家顶点。如果你使用输出格式，你会看到输出包含这两种类型的顶点。但在这个案例中，你只关心国家图谱，所以理想情况下你希望最终的图只包含代表国家的顶点。\n\
  \n变异请求 API 为此提供了解决方案。除了修改顶点的边之外，变异请求 API 还允许你创建或删除顶点。为此，你可以使用 `removeVertexRequest()`\
  \ API。在超步 0，除了创建新边和新顶点，你还可以移除不需要的顶点。每个顶点还会通过调用 `removeVertexRequest()` 方法并传入自己的\
  \ ID 作为参数，来请求移除自身。\n\n**算法细节**\n\n细心的读者可能已经注意到，在超步 0 中没有任何顶点停止。想象一下，如果那些没有粉丝的顶点在超步\
  \ 0 就停止了会发生什么。它们永远不会在超步 1 中收到消息，因此它们不会被激活并运行 `compute()` 函数。通过在超步 0 不让顶点停止，你可以让每个顶点都在超步\
  \ 1 运行 `compute()` 函数，从而允许它们通过 `removeVertexRequest()` 方法从图中移除自身。\n\n最后，请记住，通过调用\
  \ `addEdgeRequest()` 和 `removeVertexRequest()` 方法，顶点只是向 Giraph 注册了这些请求。边并不会立即创建，顶点也不会立即被移除。你必须等到下一个超步，这些更改才会真正生效。\n\
  \n除了你在示例中看到的这两个方法之外，`Computation` 接口还提供了以下方法：\n\n\n\n- `addVertexRequest(I id, V\
  \ value, OutEdges<I, E> edges)`: 发起请求，创建一个具有指定 ID、值和边的顶点。\n- `addVertexRequest(I\
  \ id, V value)`: 发起请求，创建一个具有指定 ID 和值的顶点。创建的顶点没有边。\n- `removeVertexRequest(I vertexId)`:\
  \ 发起请求，移除具有指定 ID 的顶点。如果具有指定 ID 的顶点不存在，则不执行任何操作。\n- `addEdgeRequest(I sourceId, Edge<I,\
  \ E> edge)`: 发起请求，在具有指定源 ID 的顶点处添加一条边。边的值和目标 ID 通过传入的边对象指定。请注意，此请求仅影响具有源 ID 的顶点。\n\
  - `removeEdgesRequest(I sourceId, I targetId)`: 发起请求，从具有传入源 ID 的顶点中移除一条边。具体来说，它移除具有传入目标\
  \ ID 的那条边。如果该边不存在，则不执行任何操作。此调用仅影响源顶点，不影响目标顶点。\n\n尽管这个示例没有使用这些方法，但它们具有相似的语义。它们允许的修改并非立即生效，而是在下一个超步开始时才实现。\n\
  \n## 通过消息进行变更\n\n接下来，让我们看看在 Giraph 中修改图的第三种替代方式。除了通过之前的 API 进行显式图变更外，Giraph 还允许通过向不存在的顶点发送消息来隐式地创建一个顶点。让我们来看看这究竟意味着什么，以及它如何发挥作用。\n\
  \n让我们看看如何通过前面的例子来使用这种创建顶点的方式。事实上，你将通过计算更多信息来丰富它。假设现在你不仅想知道哪些国家相互连接，还想知道来自一个国家的用户有多少关注了来自另一个国家的用户。这为我们提供了对国与国之间关系更全面的视角；你还可以了解国家间关系的强度，以及从总粉丝数来看，哪个国家是被关注最多的。图\
  \ 8-3 展示了通过分析原始输入图你希望得到的结果。\n\n![A978-1-4842-1251-6_8_Fig3_HTML.jpg](img/A978-1-4842-1251-6_8_Fig3_HTML.jpg)\n\
  \n图 8-3。计数来自一个国家的用户关注了来自另一个国家的用户的数量\n\n现在让我们来看一下计算这些更详细统计数据的算法。与之前的示例不同，这里我们假设边的值类型为`IntWritable`，用于在程序执行结束时保存粉丝数。清单\
  \ 8-3 展示了其实现。\n\n清单 8-3。计算国家间粉丝关注的数量\n\n```\npublic class CreateCountryGraphWithCounts\
  \ extends\n    BasicComputation<Text, Text, IntWritable, Text> {\n\n  @Override\n\
  \  public void compute(Vertex<Text, Text, IntWritable> vertex,\n      Iterable<Text>\
  \ messages) {\n    Text myCountry = vertex.getValue();\n    if (getSuperstep()==0)\
  \ {                                             // #1\n      sendMessageToAllEdges(vertex,\
  \ myCountry);                          // #1\n    } else if (getSuperstep()==1)\
  \ {                                      // #2\n      for (Text m : messages) {\
  \                                          // #2\n        sendMessage(m, myCountry)\
  \                                        // #3\n      }\n      removeVertexRequest(vertex.getId());\
  \                               // #4\n      vertex.voteToHalt();\n    } else {\
  \                                                             // #5\n      for (Text\
  \ m : messages) {                                          // #6\n        IntWritable\
  \ edgeValue = vertex.getEdgeValue(m);                  // #7\n        if (edgeValue\
  \ == null) {                                         // #7\n          vertex.addEdge(EdgeFactory.create(m,\
  \ new IntWritable(1)));     // #7\n        } else {                            \
  \                             // #8\n          vertex.setEdgeValue(m, new IntWritable(edgeValue.get()+1));\
  \    // #8\n        }\n      }\n      vertex.voteToHalt();\n    }\n  }\n}\n```\n\
  \n- `#1` 告诉我正在关注的用户，我来自哪个国家。\n- `#2` 在超步 1，每条消息都包含一个关注我的用户所在的国家。\n- `#3` 对于每一个关注我的国家，向一个\
  \ ID 设置为该特定国家的目标发送一条消息。消息中包含此顶点自己的国家名称。\n- `#4` 和之前一样，每个用户顶点将自己从图中移除。\n- `#5` 在超步\
  \ 2，代表国家的顶点被创建并接收消息。\n- `#6` 消息包含一个国家名称，代表该国家中一个用户的关注关系。\n- `#7` 对于每一个这样的国家，检查此顶点是否已经有一条到它的边。如果没有，添加一条新边并将其初始值设为\
  \ 1。\n- `#8` 如果该国家已经存在，则对于每一条包含相应国家名称的消息，将其边的值加一。\n\n### 算法细节\n\n在初始的用户图中，边的值无关紧要，你只需假设当图通过使用`InputFormat`构建时，其值被设置为`0`。\n\
  \n回顾一下，Giraph 模型允许一个顶点通过简单地指定目标的 ID 来发送消息。在大多数情况下，一个顶点会向其邻居之一发送消息。它通常通过查看其边（在加载输入图期间构建）来选择一个\
  \ ID。然而，Giraph 的 API 实际上更加灵活，允许你在`sendMessage()`方法中使用任何 ID。既然你可以指定任何 ID，你可能想知道如果你指定了一个输入图中实际不存在的\
  \ ID 会发生什么。\n\n答案是 Giraph 会为你创建该顶点。这样，你的程序可以通过向一个顶点发送消息来动态地创建它。在这种情况下，创建的顶点被初始化为没有边，并且顶点值被设置为`null`。\n\
  \n> **注意**：作为程序员，你有责任编写代码来处理这种初始化。\n\n该算法的第一部分与之前相同。在超步 0，每个顶点通过消息将自己的国家发送给它关注的顶点（`#1`）。因此，在超步\
  \ 1，每个用户顶点都会收到包含国家名称的消息。\n\n在开始超步 2 之前，Giraph 发现有消息是发送给代表国家的顶点的。这些顶点尚不存在。因此，Giraph\
  \ 会创建它们，然后超步 2 像往常一样开始执行。它将消息传递给所有顶点，并调用`compute()`函数。\n\n在这种情况下，只有新创建的国家顶点有消息。消息同样包含国家名称。国家\
  \ A 收到的一条包含国家名称 B 的消息意味着存在一条从国家 A 到国家 B 的单个关注关系。首先，这意味着代表国家 A 的顶点和代表国家 B 的顶点之间应该有一条边（`#7`）。其次，通过统计包含国家\
  \ B 的消息数量，你就能够确切地知道来自国家 A 的用户中有多少人关注了来自国家 B 的用户。这个数量就是所创建边的值。\n\n现在，你已经了解了在算法执行过程中修改图结构的三种不同方式。通常，使用哪一种取决于你的算法以及你的创意。有时你会发现可以用这些方式中的任何一种来实现一个算法，而在其他场景中，你会发现更倾向于某一种变更类型。例如，当你只需要向顶点添加边，并且每个顶点只负责添加自己的边时，就像第一个例子那样，直接变更可能是更好的选择，因为它们更快。另一方面，如果你需要创建顶点，或者某个顶点负责向其他顶点添加边，那么变更请求就是解决方案。总的来说，你需要稍微思考一下算法的设计，然后选择最合适的选项。\n\
  \n\n\n## 处理变更冲突\n\n尽管之前的示例中并未体现，但变更请求中可能发生冲突。例如，两个顶点可能发出以下冲突请求：一个顶点请求添加一条具有特定值的边，而另一个顶点可能请求创建同一条边但带有不同的值。此时这条边的值应如何确定？有时甚至会出现更令人困惑的请求，比如某个程序可能同时发出向一个顶点添加边的请求，以及删除该顶点的请求。\n\
  \n乍看之下，这类请求似乎不合逻辑；你可能会疑惑为什么会有人编写这样的程序。但你会发现，在编写分布式程序时，不同计算过程之间出现此类分歧是不可避免的。事实上，只要存在解决冲突的方式，这种设计就是分布式算法的一部分。不妨想想一个简单的多线程程序：两个线程试图递增同一个共享计数器。如果程序设计不当，结果将是未定义的，而编程语言通常提供同步原语来帮助正确设计程序。接下来你将看到\
  \ `Giraph` 如何解决这类冲突。\n\n首先，回顾一下创建推特国家关系图的示例。代码如 8-4 所示。请注意，\"Mark\"顶点和\"Anna\"顶点都发出请求，为\"\
  Germany\"顶点创建一条目标 ID 为\"UK\"的边。\n\n每当一个顶点发生一组变更（如添加或删除边）时，`Giraph` 会使用 `VertexChange`\
  \ 对象表示这些变更，并使用 `VertexResolver` 对象（它以 `VertexChange` 作为输入）来定义实际处理变更的方式。我们先从描述 8-4\
  \ 中的 `VertexResolver` 接口开始。\n\n**代码清单 8-4\\. `VertexResolver` 接口**\n\n```\npublic\
  \ interface VertexResolver<I extends WritableComparable,\n                     \
  \           V extends Writable, E extends Writable> {\n    Vertex<I, V, E> resolve(I\
  \ vertexId,                        #1\n                            Vertex<I, V,\
  \ E> vertex,            #2\n                            VertexChanges<I, V, E> vertexChanges,\
  \ #3\n                            boolean hasMessages);              #4\n}\n```\n\
  \n#1 待解析的顶点 ID。\n#2 应用变更前的原始顶点。\n#3 该顶点的变更集合。\n#4 定义该顶点在上一个超步中是否有发往它的消息。\n\n`VertexResolver`\
  \ 接口只有一个方法。`Giraph` 会为每个顶点调用该方法，并将已发生的变更集合传递给它。当你实现此方法时，你本质上就定义了变更后 `Vertex` 应呈现的状态。如\
  \ 8-5 所示的 `VertexChange` 接口有助于确定请求对该顶点执行的变更。\n\n**代码清单 8-5\\. `VertexChanges` 接口**\n\
  \n```\npublic interface VertexChanges<I extends WritableComparable,\n          \
  \                     V extends Writable, E extends Writable> {\n    List<Vertex<I,\
  \ V, E>> getAddedVertexList();   #1\n    int getRemovedVertexCount();          \
  \         #2\n    List<Edge<I, E>> getAddedEdgeList();           #3\n    List<I>\
  \ getRemovedEdgeList();                  #4\n}\n```\n\n#1 返回请求针对此顶点 ID 添加的顶点列表。\n\
  #2 返回针对此顶点 ID 的删除请求数量。\n#3 返回请求添加到此顶点的边列表。\n#4 返回请求从此顶点移除的边列表。\n\n在实现你自己的 `VertexResolver`\
  \ 之前，先看看如果让 `Giraph` 使用默认的 `VertexResolver` 会发生什么。默认的顶点解析器会执行以下操作：\n\n\n\n如果存在任何边移除请求，首先执行这些移除操作。如果存在顶点移除请求，则将其移除。这通过将返回的\
  \ `Vertex` 对象设置为 `null` 来实现。如果存在顶点添加请求，且该顶点不存在，则创建该顶点。如果顶点有消息发送给它，且该顶点不存在，则创建该顶点。如果存在向顶点添加边的请求，若该顶点不存在，则先创建顶点再添加边；否则，直接添加边。\n\
  \n此列表的顺序很重要，因为它精确地定义了 Giraph 默认解决冲突的方式。这意味着，例如，如果同时存在移除顶点和添加顶点的请求，那么由于默认解析器在删除顶点之后才检查顶点创建，因此最终会创建该顶点。\n\
  \n## 默认顶点解析器实现\n\n尽管此处未展示 `DefaultVertexResolver` 的实现，但建议你查看其源代码作为额外示例。这能让你更深入地了解\
  \ `VertexResolver` 的用法。\n\n现在假设你想更改此默认行为。具体来说，让我们稍微不同地处理同一边的多个添加请求。与仅仅将边添加到顶点不同，你实际上希望统计存在的请求数量，并将此数量设置为边的值。这本质上为你提供了一种替代方法来统计一个国家关注另一个国家用户的数量。在清单\
  \ 8-6 中，让我们看看如何通过创建一个自定义 `VertexResolver` 来简单地实现这一点。\n\n**清单 8-6.** 一个计算边添加次数的自定义\
  \ VertexResolver\n\n```\npublic class MyVertexResolver implements VertexResolver<Text,\
  \ Text, IntWritable, Text> {\n\n    @Override\n    public Vertex<Text, Text, IntWritable>\
  \ resolve(\n        Text vertexId,\n        Vertex< Text, Text, IntWritable> vertex,\n\
  \        VertexChanges<Text, Text, IntWritable > changes,\n        boolean hasMessages)\
  \ {\n\n        if (changes!=null) {\n            if (!changes.getAddedEdgeList().isEmpty())\
  \ {         #1\n                if (vertex==null) {                            \
  \ #2\n                    vertex = getConf().createVertex();          #2\n     \
  \               vertex.initialize(vertexId,                 #2\n               \
  \         getConf().createVertexValue());\n                }\n                for\
  \ (Edge<I, E> edge : changes.getAddedEdgeList()) {\n                    IntWritable\
  \ edgeValue =                     #3\n                        vertex.getEdgeValue(edge.getTargetVertexId());\
  \ #3\n                    if (edgeValue==null) {\n                        edge.setValue(new\
  \ IntWritable(1));      #4\n                        vertex.addEdge(edge);      \
  \             #4\n                    } else {\n                        vertex.setEdgeValue(edge.getTargetVertexId(),\
  \  #5\n                            new IntWritable(edgeValue.get()+1));       #5\n\
  \                    }\n                }\n            }\n        }\n    }\n}\n\
  ```\n\n#1 首先，检查是否存在边添加请求。\n#2 如果存在边添加请求，且该顶点尚不存在，则创建它。\n#3 对于每条边的添加，检查该边是否已存在。\n\
  #4 如果不存在，则添加它并将其值设置为 1。\n#5 如果已存在，则仅将其值加 1。\n\n在此示例中，你假设只需要处理边添加请求。自定义解析器首先检查是否存在任何此类添加请求\
  \ (#1)。如果有，则需要检查源顶点是否已存在。回想一下，在这种情况下，你创建了表示国家的顶点，而这些顶点尚不存在。因此，如果顶点尚不存在，则需要创建它 (#2)。之后，每当你看到同一边的请求时，只需将该边的值加\
  \ 1 (#5)。\n\n现在你已经实现了自定义解析器，唯一缺少的是告诉 Giraph 使用此特定的顶点解析器实现来替代默认实现。和往常一样，通过熟悉的命令行自定义参数来实现。只需将以下内容添加到命令行：`-ca\
  \ giraph.vertexResolverClass=MyVertexResolver`。\n\n总体而言，突变是一种高级特性，一旦你开始考虑更复杂的应用程序，就会发现它非常有用。接下来，将讨论另一个高级特性：如何编写你自己的聚合器。\n\
  \n## 聚合器 API\n\n聚合器是一种非常有用且易于使用的工具，它允许你计算整个图的全局统计数据。你已经在第 3 章和第 5 章中看到了几个使用聚合器的示例。Giraph\
  \ 已经提供了一组通用的聚合器函数（例如 sum 或 max），你可以在应用程序中使用它们。同时，Giraph 允许你实现自己的聚合器函数。本节将更详细地解释聚合器接口，并展示如何编写新的聚合器。\n\
  \nGiraph 提供了两种实现自定义聚合器的方式。第一种方式是实现 `Aggregator` 接口，这为你实现聚合器提供了最大的灵活性。清单 8-7 展示了该接口的方法。\n\
  \n**清单 8-7.** Aggregator 接口\n\n```\npublic interface Aggregator<A extends Writable>\
  \ {\n    void aggregate(A value);            #1\n    A createInitialValue();   \
  \          #2\n    A getAggregatedValue();             #3\n    void setAggregatedValue(A\
  \ value);   #4\n    void reset();                       #5\n}\n```\n\n#1 将输入值聚合到聚合器的当前值。\n\
  #2 在任何聚合发生之前创建聚合器的初始值。\n#3 返回聚合器的当前值。\n#4 设置聚合器的当前值。\n#5 重置聚合器的值。\n\n为了理解聚合器的实现，让我们先讨论一下\
  \ Giraph 如何使用此接口。`createInitialValue()` 在 Giraph 开始聚合任何值之前被调用。每当顶点想要向聚合器添加一个值时，Giraph\
  \ 都会调用 aggregate 方法。聚合器的实现负责维护适当的数据结构以实现此聚合。例如，如果你正在实现一个求和聚合器，你的实现应维护一个部分和，并向其中添加值。\n\
  \n除了 `Aggregator` 接口之外，Giraph 还提供了一个抽象类，它实现了 `Aggregator` 接口的一部分，涵盖了最常见的聚合器功能。大多数情况下，扩展此抽象类就能满足你的需求。让我们看看\
  \ `BasicAggregator` 的详细信息，然后看一个扩展它以实现新聚合器的示例。（参见清单 8-8。）\n\n**清单 8-8.** BasicAggregator\
  \ 抽象类\n\n```\npublic abstract class BasicAggregator<A extends Writable> implements\n\
  \    Aggregator<A> {\n\n    private A value;                                #1\n\
  \n    public BasicAggregator() {                      #2\n        value = createInitialValue();\n\
  \    }\n\n    @Override\n    public A getAggregatedValue() {                 #3\n\
  \        return value;\n    }\n\n    @Override\n    public void setAggregatedValue(A\
  \ value) {       #4\n        this.value = value;\n    }\n\n    @Override\n    public\
  \ void reset() {                           #5\n        value = createInitialValue();\n\
  \    }\n}\n```\n\n#1 聚合器的内部值。它保存当前的部分聚合结果。\n#2 默认构造函数将内部值设置为其初始值。\n#3 返回聚合器的当前值。\n\
  #4 直接设置聚合器的内部值。\n#5 将聚合器的值重置为其初始值。\n\n\n\n"
- "# `BasicAggregator`与自定义聚合器\n\n`BasicAggregator`维护的唯一数据结构是聚合器内部的值，其类型与您的聚合体类型相同。这本质上是聚合器当前的局部值。当您扩展`BasicAggregator`时，您唯一的职责是通过`createInitialValue()`方法定义初始值，并通过`aggregate()`方法定义如何将新值聚合到聚合器的当前内部值中。让我们通过一个示例来说明。\n\
  \n您已经见过编写最大值或求和聚合器的逻辑；这里将展示如何编写一个实现布尔 OR 函数的聚合器。您可以使用这样的聚合器来检测图中是否有任何顶点满足某个条件。例如，假设一个社交图中每个顶点都标有用户的年龄。您还假设有时年龄信息可能缺失，在这种情况下您会停止分析并打印一条消息。因此，您真正想知道的是是否存在至少一个顶点缺少年龄信息。布尔\
  \ OR 聚合器将以\"至少一个\"的逻辑实现这一点。换句话说，如果有至少一个顶点向聚合器添加了值`true`，聚合器的值应为布尔值`true`，否则为`false`。清单\
  \ 8-9 展示了实现。\n\n**清单 8-9.** 实现布尔 OR 的自定义聚合器\n\n```\npublic class BooleanOr extends\
  \ BasicAggregator<BooleanWritable> {\n\n    @Override\n    public BooleanWritable\
  \ createInitialValue() {       #1\n        return new BooleanWritable(false);\n\
  \    }\n\n    @Override\n    public void aggregate(BooleanWritable value) {\n  \
  \      boolean currValue = getAggregatedValue().get();   #2\n        boolean newValue\
  \ = currValue || value.get();      #3\n        getAggregatedValue().set(newValue);\
  \               #4\n    }\n\n}\n```\n\n#1 将聚合器的值初始化为`false`。\n\n#2 获取聚合器的当前值。\n\n\
  #3 在当前聚合器值与聚合值之间执行逻辑 OR 操作。\n\n#4 将操作结果设置为聚合器的新值。\n\n## OR 运算的交换律和结合律\n\n在第 3 章中，您了解到为了让\
  \ Giraph 能够高效地执行聚合，运算必须满足交换律和结合律。显而易见，逻辑 OR 运算符(`||`)确实同时满足交换律，因为：\n\n`a || b =\
  \ b || a`\n\n并且满足结合律，因为：\n\n`(a || b) || c = a || (b || c)`\n\n实现相当直接。显然，如果没有顶点向聚合器添加值，结果应为`false`。因此，`createInitialValue()`通过使用布尔类型的`Writable`实现，将聚合器的值初始化为布尔值`false`。接着，通过`aggregate()`方法，您实际上是在当前聚合器值(#2)与新聚合值(#3)之间执行逻辑\
  \ OR 操作。结果替换了聚合器的值(#4)。\n\nGiraph 已经为最常见的操作提供了丰富的聚合器实现集合。与往常一样，随着您的应用程序变得越来越定制化和复杂，您越希望超越基本功能并实现自己的功能。该\
  \ API 提供了一种简单的方法来实现有用的聚合器，Giraph 能够以可扩展且高效的方式为您计算这些聚合器，而您无需担心底层实现。在下一节中，您将再次遇到聚合器，这次将探讨它们如何帮助协调分布式程序。\n\
  \n## 集中式算法协调\n\n到目前为止，您了解到在 Giraph API 中编程的基本原则是\"以顶点为中心\"的编程，这要求您从图中顶点的角度思考。相应地，您必须编写一个每个顶点都会执行的`compute()`函数。这导致了自然分布式的算法，其中每个顶点不需要知道图中其他顶点的状态，只为自己进行计算。\n\
  \n但在某些情况下，您发现要实现算法，顶点之间需要相互协调。这种协调可能涉及共享某种对整个图通用的信息，或通过执行一些影响整个算法的集中式计算。事实上，您已经在第\
  \ 5 章中看到了这样的例子，其中您必须通过使用聚合器来计算 Twitter 中最受欢迎的用户。聚合器提供了一种集中式协调和计算的形式，因为所有顶点共同贡献于单个聚合器的值，然后这个值再被提供给所有顶点。这里，我们将讨论`MasterCompute`，这是另一种协调顶点的方式。\n\
  \n总的来说，除了通过熟悉的`compute()`函数在每个顶点上执行的分布式计算之外，您可能还需要执行一些依赖于或影响整个图和计算的操作。例如，考虑一下，应用程序的停止取决于聚合器的值，而不是每个顶点个体。幸运的是，Giraph\
  \ 提供了`MasterCompute`，一种为此而设计的机制。您已经见过一些如何使用`MasterCompute`的例子，但这里将更详细地解释它，并提供更多关于用它实现什么功能的示例。\n\
  \n`MasterCompute`本质上提供了一个集中位置，您可以在其中执行操作，例如读取和设置聚合器值、获取关于整个图的统计信息，甚至停止整个作业执行。实际上，您可以将`MasterCompute`视为一段应用程序逻辑，它在每个超步结束后只执行一次。（见图\
  \ 8-4。）\n\n![A978-1-4842-1251-6_8_Fig4_HTML.jpg](img/A978-1-4842-1251-6_8_Fig4_HTML.jpg)\n\
  \n**图 8-4.** `MasterCompute`集中式计算点。`compute()`方法在每个超步之前执行一次。聚合器值从`MasterCompute`传递给顶点。\n\
  \n清单 8-10 展示了`MasterCompute`抽象类的方法，随后将结合示例进行说明。\n\n**清单 8-10.** `MasterCompute`抽象类\n\
  \n```\npublic abstract class MasterCompute\n    extends DefaultImmutableClassesGiraphConfigurable\n\
  \    implements MasterAggregatorUsage, Writable {\n\n  public abstract void initialize()\
  \        #1\n   throws InstantiationException, IllegalAccessException;\n\n  public\
  \ abstract void compute();          #2\n\n}\n```\n\n#1 在算法执行开始前调用。\n\n#2 在每个超步结束后为整个图恰好调用一次。\n\
  \n`MasterCompute`的`initialize()`方法在算法开始执行之前被调用一次；它通常用于设置您的`MasterCompute`实现。您稍后将看到，这对于设置聚合器的操作非常有用。`compute()`方法是`MasterCompute`的核心工作方法。Giraph\
  \ 在每个超步执行之前恰好调用一次此方法；也就是说，在它调用顶点的`compute()`方法之前。更具体地说，Giraph 第一次调用`MasterCompute`的`compute()`方法是在超步\
  \ 0 执行之前。接下来，让我们看看一些可以在`MasterCompute`的`compute()`函数中执行的示例。\n\n\n\n### 终止计算\n\n\
  决定何时停止执行是分布式图算法的核心方面之一。想一想你在第 4 章中看到的 PageRank 算法。PageRank 算法在每次迭代中都会改变网页的排名。停止决策可能取决于你目前已执行的迭代次数，或者自上次迭代以来网页排名的变化幅度。无论如何，你都需要一种方法来指示\
  \ Giraph 停止计算。\n\n到目前为止，你已经了解到要停止 Giraph 计算，必须满足两个条件：每个顶点都调用了 `voteToHalt()` 方法，并且当前超步中没有发送任何消息。这些条件完全取决于你的顶点计算逻辑。实际上，在第\
  \ 4 章中，你看到了许多算法示例以及它们如何实现这种停止条件。但你可能需要基于关于图及算法执行的一些聚合信息（而非单个顶点）来做出停止计算的决策。例如，你可能希望这样的决策依赖于某个聚合器的值。以\
  \ PageRank 为例，如果自上次迭代以来排名的总差异变化不大（即 PageRank 已收敛），你可能希望停止计算。这种类型的决策无法由每个顶点单独做出，而必须由某个中心化实体来完成。正如你可能已经猜到的，`MasterCompute`\
  \ 正是执行此操作的地方。\n\nGiraph 通过 `MasterCompute` API 为你提供了一种额外的方法，可以在中心化控制点终止计算。回想一下，`MasterCompute`\
  \ 类的 `compute()` 方法是在超步结束之后、下一个超步开始之前调用的。在 `MasterCompute` 的 `compute()` 方法内部，你可以调用\
  \ `haltComputation()` 方法来终止执行。请注意，一旦调用了此方法，无论是否仍有顶点发送消息，或者是否并非所有顶点都已调用 `voteToHalt()`\
  \ 方法（正如你之前所知的那样），执行都会终止。换句话说，从 `MasterCompute` 调用 `haltComputation()` 会优先于通常的终止条件。\n\
  \n让我们看一个如何使用它的示例。决定算法终止的一种典型方式是依据目前已执行的超步数。你在第 4 章中看到的 PageRank 算法就是这样一个例子。在那里，你将停止逻辑放在顶点计算本身内部；而这里你将看到如何从\
  \ `MasterCompute` 内部实现这一点。这样做的一个好处是，你可以保持主要计算逻辑更清晰。代码清单 8-11 展示了如何在 `MasterCompute`\
  \ 实现中执行此操作。\n\n**代码清单 8-11.** 基于超步数的终止\n\n```\npublic class MyMasterCompute extends\
  \ DefaultMasterCompute {\n\n    @Override\n    public void compute() {\n       \
  \ if (getSuperstep() == 10) {                         #1\n            haltComputation();\
  \                              #1\n        }\n    }\n\n}\n```\n\n#1 基于超步编号终止计算。\n\
  \n通常，你可以在 `MasterCompute` 的 `compute()` 方法内实现任意逻辑。此逻辑在超步之间执行。在这个例子中，你简单地检查是否处于超步\
  \ 10，并通过终止计算来采取相应行动。否则，`compute()` 方法不需要做其他事情。\n\n回想一下，当你在 `MasterCompute` 内部调用\
  \ `getSuperstep()` 时，它返回即将执行的超步的编号。在上一个示例中，`compute()` 方法在超步 9 执行完毕之后、超步 10 执行之前调用了\
  \ `haltComputation()`。因此，超步 10 将永远不会被执行。这是一个你需要留意的小细节，以避免错误地编写终止条件逻辑。\n\n\n\n###\
  \ 使用聚合器进行协调\n\n你已经了解到聚合器在计算全局统计数据方面的强大作用。除了全局统计，聚合器还有其他实用功能，协调便是其中之一。我们先讨论一个需要协调的具体例子。回想一下你在第\
  \ 4 章中看到的推荐算法，它用于预测用户与物品之间的推荐关系。这些算法会迭代优化一个机器学习模型，旨在最小化预测误差。预测误差通过所有顶点的聚合误差计算得出，并借助聚合器来完成。这类算法通常在聚合预测误差低于特定阈值时停止执行。将聚合器与\
  \ `MasterCompute` 结合使用，便是协调执行停止的一种方式。\n\n更具体地说，你可以将聚合器视为一个所有顶点都能读写数据的全局变量。通过聚合器，你可以将信息从各个顶点收集到一个中心位置（即\
  \ `MasterCompute`），然后在算法执行期间从该位置将信息传回所有顶点，让它们根据这些信息做出决策。在这个例子中，你传递的是聚合误差的值给顶点，顶点则根据这个值采取行动。换言之，聚合器是主控节点与顶点通信的途径。具体而言，在顶点\
  \ `compute()` 被调用之前，聚合器的值会广播给所有工作节点；而在主控节点 `compute()` 被调用之前，聚合器的值会被收集。清单 8-12 展示了这一示例。\n\
  \n**清单 8-12.** 基于聚合器值终止执行\n\n```\npublic class MyMasterCompute extends DefaultMasterCompute\
  \ {\n\n    @Override\n    public void compute() {\n        if (((DoubleWritable)getAggregatedValue(\"\
  error\")).get() < 0.001) { #1\n            haltComputation();                  \
  \                           #2\n        }\n    }\n}\n```\n\n#1 终止条件基于聚合器预测误差低于阈值。\n\
  \n#2 当此条件成立时，终止执行。\n\n在此示例中，假设顶点使用“error”聚合器来累加总预测误差。每轮超步结束后，聚合误差会提供给 `MasterCompute`，你可以在其\
  \ `compute()` 方法中读取该值，以决定是否终止执行。\n\n如前所述，除了读取聚合器的值，在 `MasterCompute` 的 `compute()`\
  \ 方法内部，你还可以设置聚合器的值，并将其“广播”给图中的每个顶点。该聚合器的值将在下一轮超步执行期间对所有顶点可用。例如，假设在上一个例子中，你希望在每轮超步后计算所有顶点误差的平均值，然后将该平均值反馈给所有顶点。平均误差随后被每个顶点用作反馈，以改进预测。\n\
  \n实现方式之一是先计算所有顶点的预测误差总和。你已了解如何使用“error”聚合器完成这一步。之后，在 `MasterCompute` 中，将聚合器误差除以图中的顶点数，即可轻松计算出平均值，然后将其广播给所有顶点。清单\
  \ 8-13 展示了这一过程。\n\n**清单 8-13.** 在 MasterCompute 中设置聚合器的值\n\n```\npublic class MyMasterCompute\
  \ extends DefaultMasterCompute {\n\n    @Override\n    public void compute() {\n\
  \        double totalError =\n            ((DoubleWritable)getAggregatedValue(\"\
  error\")).get();          #1\n        double avgError = totalError / (double)getTotalNumVertices();\
  \    #2\n        setAggregatedValue(\"avg.error\", new DoubleWritable(avgError));\
  \   #3\n    }\n}\n```\n\n#1 获取所有顶点的聚合器误差。\n\n#2 通过除以顶点数来计算平均误差。\n\n#3 通过一个新的聚合器将平均误差广播给所有顶点。\n\
  \n在这个 `MasterCompute` 实现中，你首先读取了持有所有顶点预测误差总和的“error”聚合器的值（#1）。之后，利用 `getTotalNumVertices()`\
  \ 方法，轻松计算出平均误差（#2）。最后，使用 `MasterCompute` 的 `setAggregatedValue()` 方法，将“avg.error”聚合器的值设置为你刚计算出的平均值（#3）。该聚合器的值将在下一轮超步中对所有顶点可用。\n\
  \n总的来说，`MasterCompute` 是协调顶点之间关系的一个非常实用的工具。在这个例子中，它实现了仅使用分布式顶点中心编程接口所无法实现的功能。具体来说，它允许你通过聚合信息来收集顶点间的通信，并使整个图都能获取这些信息。在下一节中，你将了解使用\
  \ `MasterCompute` 的另一种独特方式——如何由更简单的模块组合成复杂算法。\n\n## 编写模块化应用\n\n到目前为止，你已经探索了 Giraph\
  \ API 提供的那些能让你在应用中增加更多功能或编写更高效算法的特性。在本节中，你将了解 Giraph API 的一个特性，该特性有助于你从编程角度编写更好的应用。具体来说，你将看到\
  \ Giraph 如何让你将可能很复杂的算法从更简单的逻辑块中组合出来，从而提高代码的可读性和复用性。通过示例，你将学习如何识别那些可能被分解为更简单算法的算法，以及如何使用\
  \ Giraph API 来简化其开发过程。\n\n\n\n### 将算法结构化为阶段\n\n我们首先讨论属于此类别且能从可组合性中获益的算法类型。这些编程模式出现在许多算法中，且易于识别。不过请注意，这绝非一个详尽的列表。这些仅作为常见案例，帮助您理解可组合的\
  \ API，并在出现新场景时能更具创造力地使用它。\n\n在您目前看到的 Giraph 算法中，您可能已经观察到一种常见的编程模式：算法内部的逻辑可能取决于当前正在执行的超步。这是在\
  \ Giraph 中将复杂算法分解为更简单算法的基本模式。让我们重新审视一个您在第三章中见过的算法，该算法将有向图转换为无向图。换句话说，该算法确保：如果原始图中存在从顶点\
  \ A 到顶点 B 的边，那么输出图中也会包含一条从 B 到 A 的边。许多算法都基于无向图运行，因此这是一个常见的预处理步骤。在第三章中，您看到了该算法的伪代码；在此为您展示实际代码。（参见代码清单\
  \ 8-14。）\n\n**代码清单 8-14.** 将有向图转换为无向图的算法\n\n```\npublic class ConvertGraph\n\nextends\
  \ BasicComputation<\n\nIntWritable, NullWritable, NullWritable, IntWritable> {\n\
  \n@Override\n\npublic void compute(\n\nVertex<IntWritable, NullWritable, NullWritable>\
  \ vertex,\n\nIterable<IntWritable> messages) {\n\nif (getSuperstep()==0) {\n\nsendMessageToAllEdges(vertex,\
  \ vertex.getId())   #1\n\nvertex.voteToHalt()\n\n} else {\n\nfor (IntWritable msg\
  \ : messages) {              #2\n\nIntWritable id = (IntWritable)msg.get();    \
  \  #2\n\nif (vertex.getEdgeValue(id))==null) {         #3\n\nvertex.addEdge(message)\
  \                     #3\n\n}\n\n}\n\nvertex.voteToHalt()\n\n}\n\n}\n\n}\n```\n\n\
  #1 将该顶点的 ID 发送给它的所有邻居。\n#2 我收到了一条消息，其中包含一个来自某个指向我的顶点的 ID。\n#3 如果不存在指向该目标 ID 的边，则添加它。\n\
  \n在该算法中，在超步 0 期间，每个顶点都向它所指向的所有顶点发送一条包含其自身顶点 ID 的消息。这样一来，在超步 1 期间，如果顶点 B 有一条指向 A\
  \ 的边，顶点 A 就会收到来自 B 的消息。如果顶点 A 没有指向 B 的边，它就可以添加这条边。图 8-5 展示了这两个步骤。\n\n![A978-1-4842-1251-6_8_Fig5_HTML.jpg](img/A978-1-4842-1251-6_8_Fig5_HTML.jpg)\n\
  \n**图 8-5.** 将有向图转换为无向图的步骤\n\n这是一个非常具有代表性的示例，说明了算法如何从由更简单的模块组合成算法的能力中获益，原因如下。首先，您可以立即观察到它符合前面描述的模式：计算逻辑取决于当前正在执行的超步。具体来说，有两个清晰分离的阶段：一个在超步\
  \ 0 期间执行，另一个在超步 1 期间执行。\n\n其次，将图转换为无向图通常是一个预处理步骤，相对于应用程序的主要逻辑来说是次要的。这样一来，您必须将这种转换逻辑连同您的主要逻辑一起包含在计算函数中。例如，假设您想在无向图上运行您在第四章中看到的连通分量算法。在这种情况下，在执行算法的主要逻辑之前，您必须通过应用转换逻辑来确保图已被转换为无向图。\n\
  \n为了说明这一点，我们首先来看一下如何实现原始的连通分量算法。第四章用伪代码描述了该算法；代码清单 8-15 展示了实际代码。\n\n**代码清单 8-15.**\
  \ 连通分量算法\n\n```\npublic class ConnectedComponents\n\nextends BasicComputation<\n\
  \nIntWritable, NullWritable, NullWritable, IntWritable> {\n\n@Override\n\npublic\
  \ void compute(\n\nVertex<IntWritable, NullWritable, NullWritable> vertex,\n\nIterable<IntWritable>\
  \ messages) {\n\nif (getSuperstep()==0) {\n\nsendMessageToAllEdges(vertex, vertex.getId())\
  \                       #1\n\nvertex.voteToHalt()\n\n} else {\n\nint maxId = vertex.getValue().get()\
  \                                 #2\n\nfor (IntWritable msg : messages) {     \
  \                             #3\n\nif (msg.get()>maxId) {                     \
  \                       #4\n\nmaxId = msg.get();                               \
  \               #4\n\n}                                                        \
  \         #4\n\n}\n\nif (maxId>vertex.getValue().get()) {                      \
  \          #5\n\nvertex.setValue(maxId);                                       \
  \    #5\n\nsendMessageToAllEdges(vertex, maxId)                              #5\n\
  \n}\n\nvertex.voteToHalt();\n\n}\n\n}\n\n}\n```\n\n#1 在超步 0 中，每个顶点将自己的 ID 发送给所有邻居。\n\
  #2 每个顶点维护迄今为止看到的最大 ID，该 ID 代表该顶点所属分量的 ID。\n#3 在后续的每个超步中，顶点会收到其所有邻居的 ID。\n#4 顶点在其自身\
  \ ID 和其邻居的 ID 中找出最大的 ID。\n#5 如果该最大 ID 大于当前存储在顶点值中的 ID，则更新该值，并将新的最大 ID 传播给所有邻居。\n\
  \n现在您已经掌握了连通分量的逻辑，让我们看看如何修改它以执行相同的算法，但在将有向图转换为无向图之后（参见代码清单 8-16）。\n\n**代码清单 8-16.**\
  \ 在无向图上应用连通分量算法\n\n```\npublic class ConnectedComponents\n\nextends BasicComputation<\n\
  \nIntWritable, NullWritable, NullWritable, IntWritable> {\n\n@Override\n\npublic\
  \ void compute(\n\nVertex<IntWritable, NullWritable, NullWritable> vertex,\n\nIterable<IntWritable>\
  \ messages) {\n\nif (getSuperstep()==0) {                          #1\n\nsendMessageToAllEdges(vertex,\
  \ vertex.getId())   #1\n\nvertex.voteToHalt()                             #1\n\n\
  } else if (getSuperstep()==1) {                   #1\n\nfor (IntWritable msg : messages)\
  \ {              #1\n\nIntWritable id = (IntWritable)msg.get();      #1\n\nif (vertex.getEdgeValue(id))==null)\
  \ {         #1\n\nvertex.addEdge(message)                     #1\n\n}          \
  \                                   #1\n\n}                                    \
  \           #1\n\nvertex.voteToHalt()                             #1\n\n} else if\
  \ (getSuperstep()==2) {                   #2\n\nsendMessageToAllEdges(vertex, vertex.getId())\
  \   #2\n\nvertex.voteToHalt()                             #2\n\n} else if (getSuperstep()>2)\
  \ {                    #2\n\nint maxId = vertex.getValue().get();            #2\n\
  \nfor (IntWritable msg : messages) {              #2\n\nif (msg.get()>maxId) { \
  \                       #2\n\nmaxId = msg.get();                          #2\n\n\
  }                                             #2\n\n}                          \
  \                     #2\n\nif (maxId>vertex.getValue().get()) {            #2\n\
  \nvertex.setValue(maxId);                       #2\n\nsendMessageToAllEdges(vertex,\
  \ maxId)          #2\n\n}                                               #2\n\nvertex.voteToHalt();\
  \                            #2\n\n}\n\n}\n\n}\n```\n\n#1 图转换逻辑在前两个超步中应用。\n#2 主要算法逻辑在后续超步中应用。\n\
  \n\n\n你可以清楚地看到，该算法混合了两种逻辑：图转换和连通分量算法。同样，它通过超步编号来区分不同阶段：前两个超步用于图转换，之后的超步则执行连通分量的逻辑。\n\
  \n尽管这种组织算法的方式完全正确，但你可能会发现，它会导致代码变得不必要的复杂——因为你的计算逻辑中混入了与核心算法无关的代码。随着算法复杂度的提升，你最终会在同一个计算过程中塞入多个不同的逻辑块。例如，就像这里的图预处理步骤，在某些场景下，主逻辑执行后还需要在后续超步中执行后处理阶段，这进一步增加了应用的复杂度。更糟的是，当你为算法编写单元测试时，即使转换逻辑与主逻辑无关，你也必须设计相应的测试用例来验证它。\n\
  \n第三，将图转换为无向图这一逻辑片段，在不同需要处理无向图的算法中可能会重复出现。事实上，你完全可以将超步 0 和 1 中的代码直接复制到其他算法中。但这并非良好的编程实践，原因如下：首先，这迫使你修改主算法，使其仅从超步\
  \ 2 开始执行主逻辑；其次，这会增加代码复用和维护的难度。例如，若在转换逻辑中发现缺陷，你必须修复所有使用该逻辑的算法。相反，一旦开始构建算法库，你最好能直接复用这些通用逻辑模块，而不是每次都重新编码。接下来，我们将探讨如何真正解决这些问题。\n\
  \n### 可组合 API\n\n希望到目前为止，你已经意识到从编程角度看，编写算法可能会变得复杂。现在让我们看看 Giraph 如何简化这一过程。从高层来看，Giraph\
  \ 允许你为不同超步指定不同的计算类，并以简单的方式决定在每个超步执行哪个计算。这样，你不仅能将逻辑分离到不同计算类中，还能将它们组合到单个算法的执行过程中。让我们通过一个示例来了解具体实现方法，随后再解释其带来的所有好处。\n\
  \n具体来说，我们仍以图转换为无向图的场景为例。第一步，将图转换的逻辑拆分为两个独立的计算：第一个计算负责将顶点 ID 发送给所有邻居，这对应原始单体应用中超步\
  \ 0 的操作；第二个计算负责接收 ID 消息，若对应边不存在则添加边，这对应原始算法中超步 1 的操作。你可以在代码清单 8-17 中看到这两个计算。\n\n\
  **代码清单 8-17.** 将顶点 ID 传播到邻居的计算\n\n```\npublic class PropagateId\nextends BasicComputation<\n\
  IntWritable, NullWritable, NullWritable, IntWritable> {\n\n  @Override\n  public\
  \ void compute(\n    Vertex<IntWritable, NullWritable, NullWritable> vertex,\n \
  \   Iterable<IntWritable> messages) {\n      sendMessageToAllEdges(vertex, vertex.getId())\
