  \n此处您可以注意到`getMesssagesAsIterable()`方法如何将唯一的消息打包到单例迭代器中。您还可以了解`addPartitionMessages()`方法如何将消息插入存储中。此外，消息在接收时会被缓冲，然后按组放入存储中。特别要注意的是，消息在存储中依次与当前存储的消息（如果有）进行合并。\n\
