- "# 5. 使用 Giraph\n\n前几章介绍了通用的 Giraph 编程模型，并讨论了一些易于建模为图处理应用的常见用例。本章涵盖开发 Giraph 应用的实践方面，重点介绍如何在\
  \ Hadoop 上运行 Giraph。\n\n编写 Giraph 应用本质上就是将自定义图处理逻辑插入 Giraph 框架。这通过为接口和抽象类提供自定义实现来完成，这些实现后续由\
  \ Giraph BSP 机制编排。在本章中，你将学习如何通过扩展基本抽象类 `BasicComputation` 并提供 `compute` 函数的自定义实现来快速构建图处理应用。这是构建图处理应用所需的最少代码量，许多实用的\
  \ Giraph 应用也正是如此实现的；然而，更复杂的应用会选择使用 Giraph 框架的各种组件，本章将详细探讨这些组件。\n\n接着，你将了解通过将 Giraph\
  \ 应用作为 MapReduce 作业提交到 Hadoop 来执行它所需的条件。由于 Giraph 框架是在 Hadoop 之上实现的，图处理算法无需关心它们是在单个节点上运行，还是在数万个节点的集群上运行。执行\
  \ Giraph 应用的过程保持不变。\n\n本章其余部分将聚焦于通过 Hadoop 的本地作业运行器在单节点上执行。由于本地作业运行器在单个 Java 虚拟机（JVM）中执行作业，其优势在于极易与常见的\
  \ IDE 和调试工具配合使用（唯一的缺点是你无法使用完整数据集——必须在图数据的一小部分样本上运行）。一旦你对本地运行的实现感到满意，你可以选择直接部署到完全分布式的\
  \ Hadoop 集群，或者采取中间步骤，在伪分布式 Hadoop 集群上运行。伪分布式集群让用户有机会体验 Hadoop 机制的所有细节，同时仍在单台主机上运行（它们在不同的\
  \ JVM 中运行，通过回环网络接口通信）。无论哪种方式，好消息是你无需更改实现中的任何内容——只需使用不同的配置文件集。如果你想了解更多关于 Hadoop 的各种选项，请直接前往附录\
  \ A，然后返回本章。\n\n与传统图数据库不同，Giraph 在将非结构化数据转化为图关系方面表现出色。本章将探讨如何通过输入输出格式实现这种灵活性，以及如何直接使用内置实现或扩展它们，让\
  \ Giraph 从任何数据源读取数据并将其存入任意类型的数据接收端。\n\n最后，你将了解 Giraph API 的一些更高级的用例，例如消息组合器、主计算和聚合器。在一章中涵盖如此多的基础设施内容——系好安全带，准备出发吧！\n\
  \n## Giraph 中的 “Hello World”\n\n遵循布莱恩·克尼汉（Brian Kernighan）及其贝尔实验室 C 语言黑客同行们所开创的古老传统，你的第一个\
  \ Giraph 应用是 “Hello World”：尽可能简单的实现，输出几条文本消息。经典的 “Hello World” 与图处理的 “Hello World”\
  \ Giraph 应用之间一个显著区别是需要输入数据。没有给定的图定义，你的 Giraph 应用就无法运行；毕竟，Giraph 是一个图处理框架。\n\n在本章剩余部分，你将使用第\
  \ 3 章中看到的 Twitter 关注关系图（以及计算入度/出度的伪代码示例）。不过在本节中，你将从更简单的、作用于该图的代码开始。它所做的只是为每个顶点（在此例中为人）打印一条\
  \ “Hello World” 消息，并输出该顶点所连接的邻居（该人关注的对象）。为了使代码尽可能简单，它使用数字而不是人名。输出最终将如下所示：\n\n`Hello\
  \ world from the 5 who is following: 1 2 4`\n\n你看到的所有输出都基于图 5-1。这是一个展示 Twitter 上谁关注谁的关注关系图。观察节点\
  \ #5。指向节点 1、2 和 4 的箭头表示用户 #5 关注了另外三个用户。\n\n![A978-1-4842-1251-6_5_Fig1_HTML.jpg](img/A978-1-4842-1251-6_5_Fig1_HTML.jpg)\n\
  \n图 5-1. Twitter 关注关系有向图\n\n### 定义 Twitter 关注关系图\n\n你的 Giraph 应用能够识别的、图 5-1 最简单的文本表示形式是清单\
  \ 5-1 中所示的 ASCII 文件。它编码了每个顶点的邻接列表，输入文件中的每一行格式如下：`顶点 邻居 1 邻居 2...`。\n\n清单 5-1. `src/main/resources/1/graph.txt`\
  \ 的内容\n\n```\n1 2\n2\n3 1 4\n4 2 7\n5 1 2 4\n6 3 4\n7 3 5\n```\n\n如果你熟悉如何向 Hadoop\
  \ MapReduce 作业提供输入数据，你会发现 Giraph 采用相同的方法：Giraph 应用处理给定子目录（本例中为 `src/main/resources/1`）中的所有文件，并将它们视为同一图定义的一部分。你可以将定义给定顶点拓扑的每一行放入单独的文件，或将它们分组到多个文件中，都能达到相同效果。例如，清单\
  \ 5-2 和 5-3 中由两个文件组成的输入，被认为与清单 5-1 中的输入完全相同。\n\n清单 5-2. `src/main/resources/1.1/1.txt`\
  \ 的内容\n\n```\n1 2\n7 3 5\n```\n\n清单 5-3. `src/main/resources/1.1/2.txt` 的内容\n\n\
  ```\n2\n3 1 4\n4 2 7\n5 1 2 4\n6 3 4\n```\n\n\n\n## 创建你的第一个图应用\n\n有了输入数据后，我们现在来编写你的第一个“Hello\
  \ World”Giraph 应用的 Java 实现（`GiraphHelloWorld.java`，如清单 5-4 所示）。请记住，你的目标是打印出与图中顶点数量相等的行数，每行内容为“Hello\
  \ world from the X who is following: Y Z...”。\n\n清单 5-4. `GiraphHelloWorld.java`\n\
  \n```java\nimport org.apache.giraph.edge.Edge;\nimport org.apache.giraph.GiraphRunner;\n\
  import org.apache.giraph.graph.BasicComputation;\nimport org.apache.giraph.graph.Vertex;\n\
  import org.apache.hadoop.io.IntWritable;\nimport org.apache.hadoop.io.NullWritable;\n\
  import org.apache.hadoop.util.ToolRunner;\n\n// Giraph 应用是自定义类，通常使用 BasicComputation\
  \ 类作为默认基类……\n// 但 compute 方法必须由用户自行定义\n\npublic class GiraphHelloWorld extends\n\
  \    BasicComputation<IntWritable, IntWritable,\n                     NullWritable,\
  \ NullWritable> {\n\n    @Override\n    public void compute(Vertex<IntWritable,\n\
  \                               IntWritable, NullWritable> vertex,\n           \
  \             Iterable<NullWritable> messages) {\n        System.out.print(\"Hello\
  \ world from the: \" +\n                         vertex.getId().toString() + \"\
  \ who is following:\");\n\n        // 遍历顶点的邻居\n        for (Edge<IntWritable, NullWritable>\
  \ e : vertex.getEdges()) {\n            System.out.print(\" \" + e.getTargetVertexId());\n\
  \        }\n        System.out.println(\"\");\n\n        // 标记当前顶点的 BSP 计算结束\n \
  \       vertex.voteToHalt();\n    }\n\n    public static void main(String[] args)\
  \ throws Exception {\n        System.exit(ToolRunner.run(new GiraphRunner(), args));\n\
  \    }\n}\n```\n\n即使在这个简单的示例中，也包含了不少内容。首先，你扩展了一个用于在 Giraph 的 BSP 模型实现中进行计算的基本抽象类：`BasicComputation`。你立即需要指定四个类型参数，告诉\
  \ Giraph 如何建模图。回想一下，Giraph 框架通过一个分布式数据结构来建模每个图，该数据结构由以下参数化：每个顶点的类型（`VertexID`）、每个顶点关联的标签类型（`VertexData`）、每条边关联的标签类型（`EdgeData`），以及\
  \ BSP 框架将在网络上通信的消息类型（`MessageData`）。即使在这个简单的示例中，你也需要根据输入图的表示方式（顶点使用整数 ID，无边标签）对这四种类型做出选择。因此，你需要选择的类型参数是：`VertexID`\
  \ 和 `VertexData` 使用 `IntWritable`，`EdgeData` 和 `MessageData` 使用 `NullWritable`。再次强调，这些选择是由你所采用的简单输入数据格式预先确定的；它们还必须与在向\
  \ Hadoop 提交计算作业时（如后面的清单 5-8 所示）给予 Giraph 命令行执行器的顶点输入格式的实际实现兼容。最后，这些选择意味着 `GiraphHelloWorld`\
  \ 实现的其余部分期望能够访问图的拓扑结构，即每个顶点都有一个 `Integer` ID 和一个连接到其他 `Integer` ID 的边列表；但它不期望边关联任何标签，最重要的是，它不会在图中的顶点之间发送消息（`NullWritable`\
  \ 表示没有数据）。\n\n### Giraph 编程的“四大金刚”\n\n在整个 Giraph 中，你会看到以下四元组类型变量被用于各种泛型：\n\n- `VertexID`\
  \ 是一种可用于引用每个顶点的类型。\n- `VertexData` 是附加到每个顶点的标签类型。\n- `EdgeData` 是附加到每条边的标签类型。\n\
  - `MessageData` 是可以在两个顶点之间发送的消息类型。\n\n所有这四种类型都需要扩展 Hadoop 序列化框架的一个基本构建块，即 `Writable`\
  \ 接口。除此之外，由于表示顶点的对象必须在集群的不同节点之间进行分区，`VertexID` 有更严格的保证，需要扩展 `WritableComparable`\
  \ 接口。重用 Hadoop 的对象序列化方法意味着 Giraph 可以使用大量通用代码。另外，考虑到位于集群不同节点上的顶点之间传递消息是 BSP 框架的关键特性之一，你使用的类型在序列化和反序列化时必须非常高效。换句话说，它们需要针对网络流量进行优化。幸运的是，Hadoop\
  \ 通过创建自己基于 `Writable` 接口的序列化和反序列化方法，解决了其 MapReduce 框架中的同样问题。在任何 Giraph 应用中，你都可以使用\
  \ Hadoop 提供的、实现了 `Writable` 接口的大量类，这些类映射了 Java 应用可能需要的所有常见数据类型（`boolean`、`int`、`Array`、`Map`\
  \ 等）。\n\nGiraph 要求你在一个名为 `compute()` 的方法中实现所有计算，该方法会为每个顶点调用（至少最初调用一次，之后只要有该顶点的消息就会继续调用）。由于你扩展的是一个抽象类，你必须为\
  \ `compute()` 提供定义。本示例打印一条消息，其中包含一个顶点 ID，后跟该顶点所有邻居 ID 的列表。邻居是通过遍历所有边并查找每条边目标顶点的\
  \ ID 来确定的。最后，你调用 `voteToHalt()`，从而标记给定顶点的计算结束。当所有顶点都调用此方法时，就标志着当前 BSP 计算迭代的结束（并且，除非还有消息未处理，这也标志着整个\
  \ Giraph 应用运行的结束）。\n\n最后，如果你想知道为什么定义了 `main()` 方法，那并非必需，但在你想手动执行示例而不必调用 `giraph`\
  \ 命令行执行器时，这会很方便。第 12 章中给出了一个这样的示例，当时你在亚马逊云上运行 Giraph 应用。\n\n### 项目构建\n\n`GiraphHelloWorld`\
  \ 的 Java 实现就绪后，剩下的唯一一项管理工作就是创建一个项目（Maven 或 Ant），以帮助引入正确的依赖项并编译该示例。如果你决定使用 Maven，清单\
  \ 5-5 显示了你的项目的 Maven `pom.xml` 文件应该是什么样子。请注意，唯一需要的依赖项是 `giraph-core` 和 `hadoop-core`。\n\
  \n清单 5-5. Maven 项目对象模型定义：`pom.xml`\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<project>\n    <modelVersion>4.0.0</modelVersion>\n    <groupId>giraph</groupId>\n\
  \    <artifactId>book-examples</artifactId>\n    <version>1.0.0</version>\n    <dependencies>\n\
  \        <dependency>\n            <groupId>org.apache.giraph</groupId>\n      \
  \      <artifactId>giraph-core</artifactId>\n            <version>1.1.0</version>\n\
  \        </dependency>\n        <dependency>\n            <groupId>org.apache.hadoop</groupId>\n\
  \            <artifactId>hadoop-core</artifactId>\n            <version>1.2.1</version>\n\
  \        </dependency>\n    </dependencies>\n    <build>\n    </build>\n</project>\n\
  ```\n\n此时，请确保 `pom.xml` 位于源代码树的顶层，而 Java 实现位于 `src/main/java` 目录下。这样，你就可以通过执行清单\
  \ 5-6 所示的命令轻松构建项目。\n\n清单 5-6. 构建 `HelloWorld` 项目\n\n```bash\n$ mvn package\n```\n\
  \n一旦 Maven 完成构建，你应该会在 `target` 子目录下看到生成的 jar 文件。下一节将解释如何使用这个 jar 来执行 `GiraphHelloWorld`\
  \ 应用。\n\n\n\n### 启动你的应用\n\n要运行该示例，你只需要额外安装 Hadoop 和 Giraph 的独立版本（附录 A 提供了两者的详细安装说明）。安装完毕后，更新你的\
  \ Shell 环境。如果你使用的是 bash Shell，代码清单 5-7 即可完成设置（如果使用其他 Shell，请务必查阅其关于如何导出环境变量的文档）。\n\
  \n代码清单 5-7：为 Giraph 执行定义 Shell 环境\n\n```\n$ export HADOOP_HOME=<Hadoop 安装目录的根路径>\n\
  $ export GIRAPH_HOME=<Giraph 安装目录的根路径>\n$ export HADOOP_CONF_DIR=$GIRAPH_HOME/conf\n\
  $ PATH=$HADOOP_HOME/bin:$GIRAPH_HOME/bin:$PATH\n```\n\n只要你在当前 Shell 会话中保留了上述环境变量，就可以使用\
  \ Hadoop 的本地执行模式来运行示例 Giraph 应用，如代码清单 5-8 所示。请注意，执行 Giraph 应用时，命令行会相当长。为了在书页中完整显示，我们将这条命令用反斜杠（`\\\
  `）字符拆成了多行。在终端窗口中输入此命令时，你可以采用同样的方式（确保反斜杠是每行的最后一个字符），或者将其作为单行输入。\n\n代码清单 5-8：运行 Giraph\
  \ 应用\n\n```\n$ giraph target/*.jar GiraphHelloWorld -vip src/main/resources/1  \
  \       \\\n-vif org.apache.giraph.io.formats.IntIntNullTextInputFormat        \
  \    \\\n-w 1 -ca giraph.SplitMasterWorker=false,giraph.logLevel=error\n...\nHello\
  \ world from 2 who is following:\nHello world from 1 who is following: 2\nHello\
  \ world from 3 who is following: 1 4\nHello world from 4 who is following: 2 7\n\
  Hello world from 5 who is following: 1 2 4\nHello world from 6 who is following:\
  \ 3 4\nHello world from 7 who is following: 3 5\n```\n\n恭喜！你已经开发并执行了第一个 Giraph 应用。诚然，它相当简单，而且输出可以通过打印人名而非数字\
  \ ID 来优化（下一节将处理这个问题），但这毕竟是一个只需几十行代码就能独立运行的 Giraph 应用。顺便提一下，如果你看到的输出行顺序与代码清单 5-8\
  \ 略有不同，不必惊讶：Giraph 中顶点的处理顺序是非确定性的，当然，所有顶点最终都会被处理。\n\n让我们再审视一遍代码清单 5-8，逐一了解命令行的各个组成部分。第一个参数（`target/*.jar`）指定了包含图处理“Hello\
  \ World”应用实现的 JAR 文件位置。第二个参数（`GiraphHelloWorld`）指定了包含 `compute` 方法的类名，该方法将应用于图中的所有顶点。第三个参数（`-vip`）指定了图数据的输入路径。第四个参数（`-vif\
  \ org.apache.giraph.io.formats.IntIntNullTextInputFormat`）告诉 Giraph 实现使用哪种输入格式来解析图数据。第五个参数（`-w\
  \ 1`）让 Giraph 仅使用一个工作节点来处理示例图中的所有顶点（因为你并非在集群上运行，所以只能使用一个工作节点）。最后，命令行最后一个参数（`-ca\
  \ giraph.SplitMasterWorker=false,giraph.logLevel=error`）调整了 Giraph 实现的一些内部参数，以允许使用单个工作节点执行，并将日志输出级别降低为仅显示错误。\n\
  \n虽然使用 `-ca` 命令行选项在运行时配置 Giraph 应用执行很有用，但更实际的做法是将任何可复用的配置放入 XML 配置文件中。任何熟悉 Hadoop\
  \ 配置 API 的人都会发现 Giraph 的配置与之非常相似（在内部，Giraph 只是复用了 Hadoop 的配置 API 实现）。例如，要为本地 Hadoop\
  \ 执行环境创建永久的 Giraph 配置，你可以将代码清单 5-9 所示的配置放入 `$GIRAPH_HOME/conf` 文件夹下的 `giraph-site.xml`\
  \ 配置文件中（有关如何安装和配置 Giraph 的更多信息，请参见附录 A）。\n\n代码清单 5-9：Giraph 配置\n\n```\n<configuration>\n\
  <property>\n<name>giraph.SplitMasterWorker</name>\n<value>false</value>\n</property>\n\
  <property>\n<name>giraph.logLevel</name>\n<value>error</value>\n</property>\n</configuration>\n\
  ```\n\n有了这个配置，你在执行 Giraph 应用时就不再需要提供命令行选项中的最后一行了。\n\n**注意**：请记住，你在静态配置文件中设置的所有内容都将应用于所有\
  \ `giraph` 运行，因此跟踪其中定义的属性非常重要。\n\n\n\n\n#### 使用更自然的 Twitter 关注关系图定义\n\n如前所述，示例应用的一个小问题是其输出的消息描述性不够强。如果图\
  \ 5-2 中每个顶点旁显示的不是数字标识符，而是人物的原始姓名，效果是否会更好呢？\n\n![A978-1-4842-1251-6_5_Fig2_HTML.jpg](img/A978-1-4842-1251-6_5_Fig2_HTML.jpg)\n\
  \n**图 5-2.** Twitter 关注关系有向图\n\n即使图本身的定义，如清单 5-10 所示，看起来也更加自然（该定义使用虚拟的 0 作为顶点和边标签的值，因为目前你并不关心这些值）。\n\
  \n**清单 5-10.** 存储在`src/main/resources/2/g.txt`中的更自然的 Twitter 关注关系图定义\n\n```\nJohn\
  \ 0 Peter 0\nPeter 0\nMark 0 John 0 Anne 0\nAnne 0 Peter 0 Julia 0\nNatalie 0 John\
  \ 0 Peter 0 Anne 0\nJack 0 Mark 0 Anne 0\nJulia 0 Mark 0 Natalie 0\n```\n\n图的定义现在看起来更完整了，但格式仍有几个令人头疼的限制。所有内容必须由单个制表符（`\\\
  t`）分隔（空格无效），并且即使从未使用过，也必须为顶点和边标签值指定虚拟的 0。如果能有一种更灵活的格式就好了；但信不信由你，Giraph 默认并不支持这种格式。你必须等到第\
  \ 8 章才能了解如何扩展 I/O 格式的内置实现，使其符合自己的偏好。目前，这些烦人的 0 仍将保留，因为`TextDoubleDoubleAdjacencyListVertexInputFormat`期待这种格式。\n\
  \n虽然很自然地会认为此时你可以直接将这个新的图定义提供给现有的 Giraph 应用，但你将顶点表示从整数改为字符串这一事实，要求你必须修改`compute()`方法及其所在类中使用的类型变量。对`GiraphHelloWorld`的修改很简单；新的实现如清单\
  \ 5-11 所示。请注意，你使用了 Hadoop 的`Text`类型来表示字符串。这与之前关于使用 Hadoop 类型以方便 I/O 管理的建议是一致的。\n\
  \n**清单 5-11.** `GiraphHelloWorld2.java`\n\n```\nimport org.apache.giraph.edge.Edge;\n\
  import org.apache.giraph.GiraphRunner;\nimport org.apache.giraph.graph.BasicComputation;\n\
  import org.apache.giraph.graph.Vertex;\nimport org.apache.hadoop.io.DoubleWritable;\n\
  import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.io.NullWritable;\nimport\
  \ org.apache.hadoop.util.ToolRunner;\n\npublic class GiraphHelloWorld2 extends\n\
  \    // 注意：类型变量已更改，以匹配新的输入\n    BasicComputation<Text, DoubleWritable, DoubleWritable,\
  \ NullWritable> {\n\n  @Override\n  public void compute(Vertex<Text, DoubleWritable,\
  \ DoubleWritable> vertex,\n      Iterable<NullWritable> messages) {\n    System.out.print(\"\
  Hello world from the: \" +\n        vertex.getId().toString() + \" who is following:\"\
  );\n    for (Edge<Text, DoubleWritable> e : vertex.getEdges()) {\n      System.out.print(\"\
  \ \" + e.getTargetVertexId());\n    }\n    System.out.println(\"\");\n    vertex.voteToHalt();\n\
  \  }\n}\n```\n\n使用前述源代码重新构建 jar 文件后，不要忘记在命令行中指定新的`InputFormat`，如清单 5-12 所示。\n\n\
  **清单 5-12.** 使用不同的`InputFormat`运行 Giraph 应用\n\n```\n$ giraph target/*.jar GiraphHelloWorld2\
  \  -vip src/main/resources/2 -vif           \\\n    org.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat\
  \    \\\n    -w 1 -ca giraph.SplitMasterWorker=false,giraph.logLevel=error\n\nHello\
  \ world from Julia who is following: Mark Natalie\nHello world from Natalie who\
  \ is following: John Peter Anne\nHello world from Jack who is following: Mark Anne\n\
  Hello world from Anne who is following: Peter Julia\nHello world from Peter who\
  \ is following:\nHello world from Mark who is following: John Anne\nHello world\
  \ from John who is following: Peter\n```\n\n如你所见，在输入格式之间切换非常容易。你只需更新 Java 实现中的类型变量，并在命令行的第四个参数中指定不同的输入格式（`org.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat`）。命令行的其余部分与清单\
  \ 5-8 完全相同。\n\n既然你已经了解了 Giraph 应用的基础，接下来我们将探讨更复杂的图处理算法如何预期使用 Giraph API。\n\n\n\n\
  ### 统计 Twitter 连接数\n\n现在，你应该已经熟悉了 Giraph 框架的基础知识。是时候更进一步，实现更多应用程序了。在本节中，你将把第 3 章中的伪代码示例转化为实际的\
  \ Java 代码，这些代码可以像执行“Hello World”Giraph 应用程序一样在 Giraph 上运行。第一个示例是统计 Twitter 上的关注关系，如代码清单\
  \ 5-13 所示。\n\n**代码清单 5-13.** `TwitterConnections.java`\n\n```\nimport org.apache.giraph.GiraphRunner;\n\
  import org.apache.giraph.graph.BasicComputation;\nimport org.apache.giraph.graph.Vertex;\n\
  import org.apache.hadoop.io.DoubleWritable;\nimport org.apache.hadoop.util.ToolRunner;\n\
  import org.apache.hadoop.io.Text;\n\npublic class TwitterConnections extends\n\n\
  // 注意最后一个类型变量不再是 NullWritable。\n// 这是因为我们将向顶点的邻居发送 Text 消息，\n// 作为通知目标顶点我们与它们相连的一种方式。\n\
  \nBasicComputation<Text, DoubleWritable, DoubleWritable, Text> {\n\n    @Override\n\
  \    public void compute(Vertex<Text, DoubleWritable, DoubleWritable> vertex,\n\
  \                        Iterable<Text> messages) {\n\n        if (getSuperstep()\
  \ == 0) {\n            // 这表示我们正处于 BSP 的第一个超级步，\n            // 是时候发送将在下一个超级步（else\
  \ 分支）中处理的消息了\n            vertex.setValue(new DoubleWritable(vertex.getNumEdges()));\n\
  \            sendMessageToAllEdges(vertex, new Text());\n        } else {\n    \
  \        int inDegree = 0;\n            for (Text m : messages) {\n            \
  \    inDegree++;\n            }\n            vertex.setValue(new DoubleWritable(vertex.getValue().get()\
  \ +\n                    inDegree));\n        }\n        vertex.voteToHalt();\n\
  \    }\n}\n```\n\n上述算法的总体思路是使用空消息作为一种方式，通知接收消息的顶点存在一个连接（回想一下，Giraph 并不存储连接到某个给定顶点的所有顶点的集合）。你在\
  \ BSP 计算的第一个超级步（`getSuperstep()` 返回 0）中发送消息。由于有待处理的消息，`compute()` 方法会在下一个超级步再次被调用。你通过统计这些消息（在上一个超级步中发送的）的数量，并将总和赋给每个顶点的标签，从而处理它们。这就是你如何为每个顶点得出\
  \ `inDegree` 值的方法。\n\n阅读代码后自然会问，如果代码没有产生任何输出，你到底该如何找出每个顶点的最终 `inDegree`？答案在于 Giraph\
  \ 中与输入格式互补的设施：输出格式。输出格式正是这样一种方式：Giraph 在运行完成后，可以转储图的拓扑结构和所有标签。使用输出格式很简单，只需指定两个命令行选项：`-vof`\
  \ 用于请求特定的实现，`-op` 用于指定输出子目录。代码清单 5-14 展示了指定输出格式所需的命令行，该输出格式与代码清单 5-12 中使用的输入格式完全相同。请注意，你首先做的是删除输出子目录；这是因为\
  \ Giraph 期望请求的子目录不存在。还要注意，最后一条命令会输出所有文件的内容，Giraph 的输出格式可能将结果图分割到这些文件中。对于大型图，这可能会有不少名为\
  \ `part-XXX` 的单独文件。最后，尽管在本地模式下运行 Hadoop 会在本地文件系统中产生输出，但通常最后一条命令会基于调用 Hadoop 的文件系统工具，正如你在下一节中看到的。\n\
  \n**代码清单 5-14.** 使用 `OutputFormat` 运行 `TwitterConnections` 示例\n\n```\n$ rm -rf output\n\
  $ giraph target/*.jar  TwitterConnections  -op output   \\\n    -vof org.apache.giraph.io.formats.AdjacencyListTextVertexOutputFormat\
  \ \\\n    -vip src/main/resources/2    \\\n    -vif \\\n    org.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat\
  \ \\\n    -w 1 -ca giraph.SplitMasterWorker=false,giraph.logLevel=error\n$ cat output/part*\n\
  Julia    3.0    Mark    0.0    Natalie  0.0\nNatalie  4.0    John    0.0    Peter\
  \    0.0    Anne    0.0\nJack     2.0    Mark    0.0    Anne     0.0\nAnne     5.0\
  \    Peter   0.0    Julia    0.0\nPeter    3.0\nMark     4.0    John    0.0    Anne\
  \     0.0\nJohn     3.0    Peter   0.0\n```\n\n让我们回顾一下你目前所学到的内容。每个 Giraph 应用程序都从一组输入文件中读取图定义开始。这些数据描述了初始的图拓扑结构，并由通过\
  \ `Edge` 对象连接的 `Vertex` 对象组成。Giraph 应用程序以分布式方式运行，迭代处理一组 `Vertex` 对象，并调用用户定义的计算类中提供的\
  \ `compute()` 方法。实现 `Computation` 接口是自定义计算类的唯一要求。不过在实践中，大多数应用程序会继承两个抽象类之一：`AbstractComputation`\
  \ 或 `BasicComputation`。后者是前者的一个稍有限制性的形式。所有必需顶点的 `Compute()` 方法在一系列超级步中执行。当所有顶点都调用\
  \ `voteToHalt()` 时，一个超级步结束。超级步从 0 开始编号，并且始终可以通过调用 `getSuperstep()` 来请求当前超级步的编号。“Hello\
  \ World”示例正好包含一个超级步：超级步 0。当前示例在两个超级步中运行；大多数实际的 Giraph 应用程序会遍历可变数量的超级步，作为算法收敛过程的一部分。最后，`compute()`\
  \ 可以选择在其 `Vertex` 对象上调用 `voteToHalt()`，表明除非在下一个超级步中有新消息传递给该顶点，否则它希望不再被调用。整个 Giraph\
  \ 应用程序在其所有顶点都已停止且没有任何待处理消息时结束。此时，如果用户请求将图的整个状态刷新到存储中，输出格式就会接管，并确保数据序列化到所需位置下的文件中。\n\
  \n保持输入和输出格式兼容，使得可以将 Giraph 应用程序以任意管道方式串联起来，每个应用程序处理前一个或多个应用程序的输出。Giraph 算法接近 Unix\
  \ 工具哲学，即一个工具旨在“做好一件事”。表现力并非来自每个工具或算法的复杂性，而是来自于从多个阶段构建任意管道的灵活性，这些阶段都操作在公共数据集上。\n\n\
  有了这个理论背景，让我们转向第 3 章中的第二个示例：将有向图转换为无向图。\n\n\n\n## 将 Twitter 变成 Facebook\n\n从图论角度来看，Facebook\
  \ 与 Twitter 的最大区别在于方向性。Twitter 的社交图是**有向**的（用户关注他人不代表对方也会关注自己），而 Facebook 的图是**无向**的（你的好友也视你为好友）。在前面的示例中，我们一直使用的是\
  \ Twitter 关注关系图。这还有一个额外的好处：能够与 Giraph 的有向图模型保持一一对应。如果你想用 Giraph 建模 Facebook 的关系图，就必须确保顶点之间是双向连接的。\n\
  \n现在，让我们通过运行清单 5-15 中的代码，用 Giraph 将现有的 Twitter 连接图转换为 Facebook 关系图。\n\n**清单 5-15.**\
  \ `Twitter2Facebook.java`\n\n```java\nimport org.apache.giraph.GiraphRunner;\nimport\
  \ org.apache.giraph.graph.BasicComputation;\nimport org.apache.giraph.graph.Vertex;\n\
  import org.apache.giraph.edge.EdgeFactory;\nimport org.apache.hadoop.io.DoubleWritable;\n\
  import org.apache.hadoop.util.ToolRunner;\nimport org.apache.hadoop.io.Text;\n\n\
  public class Twitter2Facebook extends\n    BasicComputation<Text, DoubleWritable,\
  \ DoubleWritable, Text> {\n\n    // 以下两个常量分别表示原始边和用于模拟 Facebook 连接关系的新建边\n    static\
  \ final DoubleWritable ORIGINAL_EDGE = new DoubleWritable(1);\n    static final\
  \ DoubleWritable SYNTHETIC_EDGE = new DoubleWritable(2);\n\n    @Override\n    public\
  \ void compute(Vertex<Text, DoubleWritable, DoubleWritable> vertex,\n        Iterable<Text>\
  \ messages) {\n        if (getSuperstep() == 0) {\n            sendMessageToAllEdges(vertex,\
  \ vertex.getId());\n        } else {\n            for (Text m : messages) {\n  \
  \              DoubleWritable edgeValue = vertex.getEdgeValue(m);\n            \
  \    if (edgeValue == null) {\n                    vertex.addEdge(EdgeFactory.create(m,\
  \ SYNTHETIC_EDGE));\n                } else {\n                    // 对于已有的边，仅标记其类型\n\
  \                    vertex.setEdgeValue(m, ORIGINAL_EDGE);\n                }\n\
  \            }\n        }\n        vertex.voteToHalt();\n    }\n}\n```\n\n至此，你可以像运行之前示例那样直接运行这段代码。不过，这样生成的图输出虽然对\
  \ Giraph 友好，但对人类读者而言并不直观。因此，我们可以换用一种能直接输入到多种图可视化工具的输出格式。毕竟，一图胜千言。清单 5-16 的运行方式与之前几乎相同，区别仅在于使用了另一种输出格式（`org.apache.giraph.io.formats.GraphvizOutputFormat`）。\n\
  \n**清单 5-16.** 使用可视化友好的输出格式运行`Twitter2Facebook`\n\n```bash\n$ rm -rf output\n$ giraph\
  \ target/*.jar Twitter2Facebook   -op output        \\\n    -vof org.apache.giraph.io.formats.GraphvizOutputFormat\
  \     \\\n    -vip src/main/resources/2                                  \\\n  \
  \  -vif \\\norg.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat\
  \ \\\n    -w 1 -ca giraph.SplitMasterWorker=false,giraph.logLevel=error\n```\n\n\
  要可视化此命令生成的输出结果，首先需要让 Hadoop 将输出文件的各个部分合并成一个文件。接着，添加 Graphviz 格式所需的文件头和文件尾，最后运行 Graphviz\
  \ 可视化命令行工具，生成一个可直接查看的图片文件。这四个步骤如清单 5-17 所示，图 5-3 展示了最终生成的图片。\n\n![A978-1-4842-1251-6_5_Fig3_HTML.jpg](img/A978-1-4842-1251-6_5_Fig3_HTML.jpg)\n\
  \n**图 5-3.** 与 Twitter 关注关系图对应的 Facebook 关系图\n\n**清单 5-17.** 可视化 Giraph 的 Graphviz\
  \ 格式输出\n\n```bash\n$ hadoop fs -getmerge output data.txt\n$ echo \"digraph Giraph\
  \ {\" > giraph.dot\n$ cat data.txt            >> giraph.dot\n$ echo \"}\"      \
  \          >> giraph.dot\n$ circo giraph.dot –Tpng -ogiraph.png\n```\n\n## Graphviz\
  \ (DOT)：图可视化的通用语言\n\nGraphviz 是一款开源图可视化软件。Graphviz 及其输入语言 DOT 最初由 AT&T 实验室研发，用于快速可视化任意图数据，现已独立发展壮大。大多数\
  \ Unix 平台都提供参考实现，同时也有许多基于 DOT 格式的纯软件可视化工具。如果你的平台没有 DOT 可视化工具（`circo`），也可以将`giraph.dot`文件的内容粘贴到在线\
  \ Graphviz 工具（例如[`www.webgraphviz.com`](http://www.webgraphviz.com/)）中，来可视化 Facebook\
  \ 关系图。\n\n通过图可视化，你可以看到每个顶点对应的顶点值，以及每条边对应的边值。由于本示例未使用顶点值，在图 5-3 中，所有顶点值都显示为 0.0，位于姓名旁边的方框中。而边的标签则根据其类型标注：转换过程中新增的边标记为(2)，图中原本就存在的边标记为(1)。\n\
  \n这是通过添加新边来改变图拓扑结构的第一个示例。下一节将介绍更多动态更改图结构的方法。\n\n\n\n## 改变图结构\n\n为图添加新边相当简单，但添加新顶点呢？如何不通过外部数据源读取数据，直接在内存中构建完整的图片段？一个极端的例子是根据特定条件从头生成图。如果你将\
  \ Giraph 作业视为一个流水线，生成图可能就是该流水线的第一步。这是复杂图算法仿真和系统测试中的典型方法。下一个示例（见清单 5-18）演示了如何从空图开始生成你的老朋友——Twitter\
  \ 关注关系图。\n\n**清单 5-18.** `GenerateTwitter.java`\n\n```java\nimport org.apache.giraph.GiraphRunner;\n\
  import org.apache.giraph.graph.BasicComputation;\nimport org.apache.giraph.graph.Vertex;\n\
  import org.apache.giraph.edge.EdgeFactory;\nimport org.apache.hadoop.io.DoubleWritable;\n\
  import org.apache.hadoop.util.ToolRunner;\nimport org.apache.hadoop.io.Text;\nimport\
  \ java.io.IOException;\n\npublic class GenerateTwitter extends\n    BasicComputation<Text,\
  \ DoubleWritable, DoubleWritable, Text> {\n\n  // 两个静态数组，定义与清单 5-10 输入数据相同的图结构\n\
  \  private static final String[] twitterMembers = { \"seed\",\n      \"John\", \"\
  Peter\", \"Mark\", \"Anne\", \"Natalie\", \"Jack\", \"Julia\" };\n  private static\
  \ final byte[][] twitterFollowership = {{0},\n      {2},   {},      {1, 4},  {2,\
  \ 7}, {1, 2, 4}, {3, 4}, {3, 5}};\n\n  @Override\n  public void compute(Vertex<Text,\
  \ DoubleWritable, DoubleWritable> vertex,\n      Iterable<Text> messages) throws\
  \ IOException {\n    if (getSuperstep() == 0) {\n      for (int i = 1; i < twitterFollowership.length;\
  \ i++) {\n        Text destVertexID = new Text(twitterMembers[i]);\n        addVertexRequest(destVertexID,\
  \ new DoubleWritable(0));\n        for (byte neighbour : twitterFollowership[i])\
  \ {\n          addEdgeRequest(destVertexID, EdgeFactory.create(\n              new\
  \ Text(twitterMembers[neighbour]),\n              new DoubleWritable(0)));\n   \
  \     }\n      }\n      removeVertexRequest(new Text(\"seed\"));\n    } else {\n\
  \      vertex.voteToHalt();\n    }\n  }\n}\n```\n\n运行此示例时，一个非常合乎逻辑的假设是：既然该 Giraph\
  \ 应用的全部目的就是从头生成图，那么你不应该给 Giraph 提供任何输入文件。更高级的 Giraph 用法支持这样做，但对于这个简单示例，你面临一个小挑战。生成图的代码位于`compute()`方法中，而由于`compute()`方法是为输入图的顶点调用的，实现需求的最简单方式是给\
  \ Giraph 提供一个尽可能小的图：一个仅含单个顶点、没有边的图，如清单 5-19 所示。\n\n**清单 5-19.** 仅含单个顶点、没有边的最小图定义（`src/main/resources/3/g.txt`）\n\
  \n```\nseed 0\n```\n\n有了这个输入文件，你就可以像之前所有示例一样运行 Giraph。让我们用 Graphviz 输出格式运行它（如清单\
  \ 5-20 所示），这样你可以快速检查可视化后的图，确保代码生成了图 5-2 中的原始图。\n\n**清单 5-20.** 使用 Graphviz 输出格式运行\
  \ `GenerateTwitter`\n\n```\n$ rm -rf output\n$ giraph target/*.jar GenerateTwitter\
  \   -op output              \\\n  -vof org.apache.giraph.io.formats.GraphvizOutputFormat\
  \          \\\n  -vip src/main/resources/3                                     \
  \  \\\n  -vif \\\n  org.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat\
  \ \\\n  -w 1 -ca giraph.SplitMasterWorker=false,giraph.logLevel=error\n```\n\n本例中用于修改图拓扑的两个\
  \ Giraph API 调用（`addVertexRequest`和`addEdgeRequest`）属于更广泛的 API 集合，称为图变异 API。这些 API\
  \ 调用大多以某种方式修改图的整体结构。这些变更可以立即或在下一个超步中对所有计算进程成员可见（这就是为什么示例中你不能立即退出，而必须等待下一个超步）。以下是对实际应用中常用变异\
  \ API 方法的总结：\n\n*   `setValue()`：修改自身的值。此操作的结果立即（在同一超步内）对整个计算可见。\n*   `setEdgeValue()`：修改出边的边值。尽管结果也立即对整个计算可见，但此方法的应用有限，因为通常只有源顶点才能访问出边。\n\
  *   `addEdge()`、`removeEdges()`：通过添加或删除边来修改图的局部拓扑结构，且源顶点保持不变。\n*   `addVertexRequest()`、`removeVertexRequest()`、`addEdgeRequest()`、`removeEdgesRequest()`：请求从下一个超步开始修改图的全局拓扑结构。\n\
  \n通过使用这些方法，你可以创建与 Giraph 执行开始时可用图结构及拓扑截然不同的图。有趣的是，除了这里介绍的直截了当的图变异方法外，还有一种不那么明显的方法与\
  \ Giraph 中的多面手——消息——有关。这正是下一节的主题。\n\n\n\n## 发送与合并多条消息\n\n如前所述，Giraph 的消息传递拓扑与图拓扑完全独立。换句话说，每个顶点可以向其他任意顶点发送消息。向不存在的顶点发送消息会创建该顶点。（看到了吗？消息也可以被视为图变异\
  \ API 的一部分！）\n\n这正是下一个示例利用的技巧，用于并行构建图拓扑。不同于在单个主机上运行单循环遍历所有顶点及其边，这里采用了两阶段方法。首先通过发送消息创建所有顶点，每条消息包含该新顶点的一个邻居。当顶点被创建并分配到集群的工作节点后，每个顶点开始并行遍历接收到的消息，并创建连接其与邻居的边。清单\
  \ 5-21 对上一个示例进行了修改，实现了这一功能。\n\n**清单 5-21.** `GenerateTwitterParallel.java`\n\n```\n\
  import org.apache.giraph.GiraphRunner;\nimport org.apache.giraph.graph.BasicComputation;\n\
  import org.apache.giraph.graph.Vertex;\nimport org.apache.giraph.edge.EdgeFactory;\n\
  import org.apache.hadoop.io.DoubleWritable;\nimport org.apache.hadoop.util.ToolRunner;\n\
  import org.apache.hadoop.io.Text;\nimport java.io.IOException;\n\npublic class GenerateTwitterParallel\
  \ extends\n    BasicComputation<Text, DoubleWritable, DoubleWritable, IntWritable>\
  \ {\n\n  private static final String[] twitterMembers = { \"\",\n      \"John\"\
  , \"Peter\", \"Mark\", \"Anne\", \"Natalie\", \"Jack\", \"Julia\" };\n  private\
  \ static final byte[][] twitterFollowership = {{0},\n      {2},   {},      {1, 4},\
  \  {2, 7}, {1, 2, 4}, {3, 4}, {3, 5}};\n\n  @Override\n  public void compute(Vertex<Text,\
  \ DoubleWritable, DoubleWritable> vertex,\n      Iterable<IntWritable> messages)\
  \ throws IOException {\n    if (getSuperstep() == 0) {\n      for (int i = 1; i\
  \ < twitterFollowership.length; i++) {\n        Text destVertexID = new Text(twitterMembers[i]);\n\
  \        for (byte neighbour : twitterFollowership[i]) {\n          sendMessage(destVertexID,\
  \ new IntWritable(neighbour));\n        }\n      }\n      removeVertexRequest(new\
  \ Text(\"seed\"));\n    } else {\n      for (IntWritable m : messages) {\n     \
  \   Text neighbour = new Text(twitterMembers[m.get()]);\n        vertex.addEdge(EdgeFactory.create(neighbour,\n\
  \            new DoubleWritable(0)));\n      }\n      vertex.voteToHalt();\n   \
  \ }\n  }\n}\n```\n\n当然，对于这样一个小图，相同代码的串行版本与并行版本之间的差异微乎其微。但这确实凸显了每个 Giraph 应用需要考虑的一个重要设计点：并行图处理始终受限于无法并行化的串行代码量。这同样被称为阿姆达尔并行定律。\n\
  \n最新示例使得图中的边可以并行创建，而非在超步 0 的单循环中创建。这是一项改进，但仍有进一步优化的空间。\n\n考虑到每条边都需要创建一条专属消息，而消息中仅需传递一个整数\
  \ ID，开销可能相当高。如果能够将邻居 ID 聚合或合并为单条消息，效率将大幅提升。实现方法之一是改变消息的数据类型为字节数组，另一种方式是使用 Giraph\
  \ 的组合器（combiner）。\n\n当存在自然的方式将多条消息聚合为一条时，就可以为顶点间发送的消息实现组合器。Giraph 提供了一些有用的默认组合器。例如`SimpleSumMessageCombiner`将单条消息求和为一个；`MinimumIntMessageCombiner`从包含单独整数的消息中找出最小值并创建一条包含该值的消息。然而，下一个示例创建了一个自定义组合器，将所有消息合并为一个位图数组。消息中发送的每个整数值都表示为位图中的一位。例如，如果消息包含整数\
  \ 3，则从右边数起第三位被设为 1。清单 5-22 展示了`BitArrayCombiner`的代码。\n\n**清单 5-22.** `BitArrayCombiner.java`\n\
  \n```\nimport org.apache.giraph.combiner.MessageCombiner;\nimport org.apache.hadoop.io.IntWritable;\n\
  \npublic class BitArrayCombiner\n    extends MessageCombiner<IntWritable, IntWritable>\
  \ {\n\n  // 每个组合器的核心是一个方法，定义了如何将新消息合并到总体消息累加器中\n  @Override\n  public void combine(IntWritable\
  \ vertexIndex,\n                      IntWritable originalMessage,\n           \
  \           IntWritable messageToCombine) {\n    originalMessage.set((1<<messageToCombine.get())\
  \ |\n        originalMessage.get());\n  }\n\n  // 这是一个定义如何创建初始消息累加器的方法\n  // 本例中简单创建了一个所有位均为\
  \ 0（即未看到任何消息）的位图数组\n  @Override\n  public IntWritable createInitialMessage() {\n\
  \    return new IntWritable(0);\n  }\n}\n```\n\n通常，组合器非常简洁：只需定义返回初始消息的函数即可。此消息用作`compute()`执行过程中发出的消息的累加器。累加数据的任务由`combine()`方法中定义的代码执行。如你所见，该方法将`originalMessage`视为可变累加器；本例中，它在整数位数组中设置了与邻居整数\
  \ ID 对应的位。\n\n组合器虽然有用，但并非透明。首先，必须告诉 Giraph 需要使用组合器。这通常通过将类名传递给`-c`命令行选项实现，就像传递输入格式一样。其次，必须修改上一个示例的代码，以便解包现在作为每条消息负载的位数组。这个问题，加上只能处理少于\
  \ 32 个顶点（因为 Java 中整数为 32 位）的限制，使得`BitArrayCombiner`有些不太实用，仅作为展示编写组合器多么简单的示例。\n\n\
  说到限制，如果你尝试运行上一个示例，可能注意到实现中存在一个细微的 bug：无法生成零邻居的顶点。减少此类 bug 可能性的常用方法是，结合验证正确性的单元测试来开发代码。本章到目前为止的代码开发没有任何测试或验证，现在是时候做出改变了。\n\
  \n\n\n### 对 Giraph 应用进行单元测试\n\n针对任何框架开发复杂应用通常都需要一套单元测试，以确保在代码修改和重构过程中语义不会意外改变。幸运的是，Giraph\
  \ 应用的**事件驱动**特性使得独立测试各种方法（如 `compute()`）的语义变得极其容易。你还可以创建一个微型执行环境来进行完整的应用测试。\n\n\
  如前所述，前面的例子中存在一个细微的问题。考虑到这一点，我们来创建一个单元测试，验证最终生成的图拓扑结构是否确实符合预期；请参阅列表 [5-23]。\n\n**列表\
  \ 5-23.** `TestGiraphApp.java`\n\n```\nimport org.junit.Test;\nimport org.junit.Assert;\n\
  import org.junit.Ignore;\nimport org.apache.giraph.conf.GiraphConfiguration;\nimport\
  \ org.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat;\n\
  import org.apache.giraph.io.formats.AdjacencyListTextVertexOutputFormat;\nimport\
  \ org.apache.giraph.utils.InternalVertexRunner;\n\npublic class TestGiraphApp  {\n\
  \    final static String[] graphSeed = new String[] { \"seed\\t0\" };\n    final\
  \ static int EXPECTED_VERTICES = 7; // 我们期望最终图中创建的顶点数量\n\n    @Test\n    public\
  \ void testNumberOfVertices() throws Exception {\n        GiraphConfiguration conf\
  \ = new GiraphConfiguration(); // Giraph 配置对象：它将配置我们的测试 Giraph 运行，就像我们在所有之前的例子中使用的静态配置文件和命令行选项的组合一样\n\
  \n        conf.setComputationClass(GenerateTwitterParallel.class);\n        conf.setVertexInputFormatClass(\n\
  \            TextDoubleDoubleAdjacencyListVertexInputFormat.class);\n        conf.setVertexOutputFormatClass(\n\
  \            AdjacencyListTextVertexOutputFormat.class);\n\n        // 以下就是我们的测试模拟完整\
  \ Giraph 应用运行所需的全部内容：conf 用于配置模拟，graphSeed 是一个用于模拟输入图数据的字符串数组。它返回的结果允许我们遍历模拟输出，以检查关于\
  \ GenerateTwitterParallel 代码执行完毕后我们期望结果的各种假设。\n        Iterable<String> results\
  \ =\n            InternalVertexRunner.run(conf, graphSeed);\n\n        // 遍历模拟输出是检查结果图结构的方法。在我们的例子中，我们简单地统计模拟输出的行数。\n\
  \        int totalVertices = 0;\n        for (String s: results ) {\n          \
  \  totalVertices++;\n        }\n\n        // 我们期望模拟输出中呈现特定数量的行（顶点描述）。\n        Assert.assertEquals(EXPECTED_VERTICES,\
  \ totalVertices);\n    }\n}\n```\n\n尽管这个实现只有几行代码，但得益于 `InternalVertexRunner` 的实现，后台发生了许多引人注目的事情。此示例中使用的\
  \ `run()` 方法要求你提供 Giraph 的配置和一个模拟输入内容的 `String` 数组。调用 `run()` 得到的是一个模拟输出的 `String`\
  \ 数组，该输出模拟了在应用正常运行时写入文件系统的内容。虽然输入和输出文件是模拟的，但其他所有内容都并非如此。`conf` 对象的构建方式与实际运行应用时完全相同：结合默认设置、`giraph-site.xml`\
  \ 中的设置以及 `giraph` 命令行指定的设置。如果你不想受命令行语法的约束，可以编写一个 `main()` 方法来显式设置配置值。\n\n运行单元测试很简单，要么将其连接到你的构建系统（Ant、Maven\
  \ 或 Gradle），要么将其传递给 JUnit 执行器。如果你使用 Maven 来构建示例，只需将测试用例保存到项目文件树的 `src/test/java/TestGiraphApp.java`\
  \ 下，并将 JUnit 依赖项添加到 `pom.xml` 文件中，如列表 [5-24] 所示。之后，执行 `mvn test` 将为你运行单元测试（`mvn\
  \ package` 命令也会执行）。\n\n**列表 5-24.** Maven 项目对象模型定义：添加 JUnit 依赖项后的 `pom.xml`\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
  \  <groupId>giraph</groupId>\n  <artifactId>book-examples</artifactId>\n  <version>1.0.0</version>\n\
  \  <dependencies>\n    <dependency>\n      <groupId>org.apache.giraph</groupId>\n\
  \      <artifactId>giraph-core</artifactId>\n      <version>1.1.0</version>\n  \
  \  </dependency>\n    <dependency>\n      <groupId>org.apache.hadoop</groupId>\n\
  \      <artifactId>hadoop-core</artifactId>\n      <version>1.2.1</version>\n  \
  \  </dependency>\n    <dependency> <!-- 这是我们添加到原始 pom 文件中的唯一部分 -->\n      <groupId>junit</groupId>\n\
  \      <artifactId>junit</artifactId>\n      <version>4.12</version>\n    </dependency>\n\
  \  </dependencies>\n  <build>\n  </build>\n</project>\n```\n\n无论哪种方式，断言都会失败，因为生成的图比你预期少了一个顶点。如何让单元测试通过将作为练习留给你；下一节将讨论\
  \ Giraph 提供的 BSP 计算模型扩展这一较为独立的主题。\n\n### 超越单一顶点视角：启用全局计算\n\n到目前为止，你所看到的 Giraph 应用都假设不同顶点之间没有共享状态。在给定的两个顶点之间（甚至在给定顶点与一组消息接收者之间）传递数据时，发送消息效果很好；但如果整个计算需要维护一个可由处理图中所有顶点的所有\
  \ `compute()` 方法更新和访问的连续累加计数，那么它就不太适用了。\n\n例如，想象一种需要对图进行并行搜索的情况。假设你的图代表一张地图，顶点是城市，边是道路，边上的标签是城市间的距离。理想情况下，你可以找到两个顶点之间的绝对最短路径；但通常情况下，一个接近最短路径的近似值就足够了。那么问题就变成了：你如何跟踪当前最短路径距离，以及当路径足够短（但可能不是绝对最短路径）时，如何中止计算？\n\
  \nGiraph 提供了一种高效的解决方法：命名聚合器。接下来的两节将讨论聚合器以及它们如何与主计算协同工作。\n\n\n\n### 使用聚合器\n\n如前所述，当你需要追踪那些并不天然从属于任何顶点（甚至不隶属于顶点子集）的图统计量时，聚合器便真正大显身手了。其中一个统计量就是图中连接（边）的总数。清单\
  \ 5-25 提供了一种非常简单的、利用聚合器计算图中边数的方法。该聚合器恰好是一个求和聚合器，但除非你查看清单 5-26 并发现该聚合器实现是以名称 `TotalNumberOfEdgesMC.ID`\
  \ 注册的，否则你无法知晓这一点。\n\n**清单 5-25.** `TotalNumberOfEdges.java`\n\n```java\nimport org.apache.giraph.graph.BasicComputation;\n\
  import org.apache.giraph.graph.Vertex;\nimport org.apache.hadoop.io.Text;\nimport\
  \ org.apache.hadoop.io.DoubleWritable;\nimport org.apache.hadoop.io.NullWritable;\n\
  import org.apache.hadoop.io.LongWritable;\n\npublic class TotalNumberOfEdges extends\n\
  \    BasicComputation<Text, DoubleWritable, DoubleWritable, NullWritable> {\n\n\
  \    @Override\n    public void compute(Vertex<Text, DoubleWritable, DoubleWritable>\
  \ vertex,\n                        Iterable<NullWritable> messages) {\n        aggregate(TotalNumberOfEdgesMC.ID,\
  \ new LongWritable(vertex.getNumEdges()));\n        vertex.voteToHalt();\n    }\n\
  }\n```\n\n这里的思路很简单：每个 `compute()` 方法都将与给定顶点关联的出边数量推送至一个名为 `TotalNumberOfEdgesMC.ID`\
  \ 的聚合器。如你所见，`compute()` 方法既不在意发送给聚合器的值会如何处理，也不关心它们发送值给哪种聚合器。设置聚合器本身就是在第一个超步之前必须执行一次的全局操作示例，因此你不能在以顶点为中心的\
  \ `compute()` 方法中执行该操作。你得使用在每个超步之前运行一次的少量代码，而清单 5-26 中展示的主计算实现恰好允许你做到这一点。\n\n**清单\
  \ 5-26.** `TotalNumberOfEdgesMC.java`\n\n```java\nimport org.apache.giraph.aggregators.LongSumAggregator;\n\
  import org.apache.giraph.master.DefaultMasterCompute;\n\npublic class TotalNumberOfEdgesMC\
  \ extends DefaultMasterCompute { // 主计算\n    // 实现通常继承 DefaultMasterCompute 抽象类\n\
  \    // 就像我们的基本 BSP 计算实现继承 BasicComputation 一样。\n    // 与 BasicComputation 不同的是，你必须为两个方法提供实现：\n\
  \    // compute() 和 initialize()\n\n    public static final String ID = \"TotalNumberOfEdgesAggregator\"\
  ; // 所有注册的\n    // 聚合器都通过唯一的（在给定应用内）但任意的字符串进行引用\n\n    @Override\n    public void\
  \ compute() {\n        // 这是一个全局主计算方法，将在每个超步之前执行一次。\n        // 在我们的例子中，我们只是输出图中总边数的运行总计\n\
  \        System.out.println(\"在超步 \" +\n            getSuperstep() + \" 时的总边数为 \"\
  \ +\n            getAggregatedValue(ID));\n    }\n\n    @Override\n    // 该方法在 Giraph\
  \ BSP 机制的总体初始化期间被调用。\n    // 它是注册所有必需聚合器的理想位置。\n    public void initialize() throws\
  \ InstantiationException,\n        IllegalAccessException {\n        registerAggregator(ID,\
  \ LongSumAggregator.class); // 这就是我们如何将\n        // 聚合器 ID 与特定的聚合器实现关联起来：\n    \
  \    // 在我们的例子中，我们使用内置的 LongSumAggregator，\n        // 它简单地对其接收到的所有值进行求和\n    }\n\
  }\n```\n\n主计算允许你利用整个图拓扑以及你可用的所有聚合器值来执行全局操作。由于主计算的 `initialize()` 方法在 Giraph 初始化的很早阶段运行一次，因此这是注册给定应用中使用的所有聚合器的理想位置。聚合器注册后，以顶点为中心的\
  \ `compute()` 方法可以向它们发送值，而主 `compute()` 方法可以在每个超步之前检查聚合器的状态。在这个例子中，你使用主计算实现的 `compute()`\
  \ 方法来打印求和聚合器的当前值。在实际应用中，你可以基于其结果进行任何类型的全局计算，甚至可以根据这些结果提前终止你的应用（前提是你选择的某个全局计算启发式条件已得到满足）。\n\
  \n在 Hadoop 本地模式下执行该示例会提供预期的输出，但对于集群执行，更明智的做法是在应用执行期间的特定时间间隔内，将聚合器的状态记录到外部存储中。可以把它想象成在运行结束时记录图的最终状态。当然，你可以替换主计算中的\
  \ `System.out.println()` 调用，但有更好的方法。Giraph 提供了聚合器写入器的概念。聚合器写入器类需要实现 `AggregatorWriter`\
  \ 接口，并为 `writeAggregator()` 方法提供实现，该方法在每个超步结束时接收一个包含所有已注册聚合器名称、其值以及该超步数值 ID 的映射（计算结束时通过传递\
  \ ID `LAST_SUPERSTEP` 来标识）。和往常一样，你可以自由实现自己的聚合器写入器，或者使用默认的 `TextAggregatorWriter`。现在，我们先使用默认的。\n\
  \n综合起来，清单 5-27 展示了如何从命令行运行你的边计数 Giraph 应用。\n\n**清单 5-27.** 运行边计数应用\n\n```bash\n\
  $ rm -rf aggregatorValues*\n$ giraph target/*.jar TotalNumberOfEdges -mc TotalNumberOfEdgesMC\
  \  \\\n    -aw org.apache.giraph.aggregators.TextAggregatorWriter         \\\n \
  \   -ca giraph.textAggregatorWriter.frequency=1                    \\\n    -vip\
  \ src/main/resources/2                                      \\\n    -vif \\\norg.apache.giraph.io.formats.TextDoubleDoubleAdjacencyListVertexInputFormat\
  \ \\\n    -w 1 -ca giraph.SplitMasterWorker=false,giraph.logLevel=error\nTotal number\
  \ of edges at superstep 0 is 0\nTotal number of edges at superstep 1 is 12\n$ cat\
  \ aggregatorValues*\nsuperstep=0    TotalNumberOfEdgesAggregator=0\nsuperstep=-1\
  \    TotalNumberOfEdgesAggregator=12\n```\n\n关于清单 5-27 中展示的 `giraph` 命令行，有几点值得注意。首先，由于你使用了主计算，你告知\
  \ Giraph 包含该实现的类作为第三个参数（`-mc TotalNumberOfEdgesMC`）。其次，你告知 Giraph 使用一个将聚合器值输出到默认\
  \ Hadoop 文件系统的聚合器写入器（`-aw org.apache.giraph.aggregators.TextAggregatorWriter`）。最后，你指定要在每个超步都记录聚合器值（`-ca\
  \ giraph.textAggregatorWriter.frequency=1`）。请注意，你是通过提供一个 `TextAggregatorWriter`\
  \ 实现能够识别的属性来指定频率的。你也可以在自己实现的配置属性中使用相同的方法。\n\n清单 5-27 中的最后一个命令演示了 `TextAggregatorWriter`\
  \ 确实记录了每个超步时你的聚合器状态。这些值与你的 `System.out.println` 语句产生的值相同。\n\n\n\n\n\n下一节将提供关于聚合器与\
  \ master 计算机制如何运作的更多细节。不过，首先，让我们花点时间看看清单 5-28 中展示的`LongSumAggregator`的实现。尽管这个聚合器是开箱即用的，但了解创建自定义专用聚合器是多么简单，仍然很有价值。\n\
  \n**清单 5-28.** `LongSumAggregator`的实现\n\n```\nimport org.apache.hadoop.io.LongWritable;\n\
  \n// 大多数自定义聚合器都继承自 BasicAggregator 类，并专注于实现两个关键方法：\n// createInitialValue() 和 aggregate()。BasicAggregator\
  \ 使用的类型变量定义了\n// 聚合器将从 compute()方法接收的值类型，以及向其消费者提供的值类型。\n\npublic class LongSumAggregator\
  \ extends BasicAggregator<LongWritable> {\n\n  @Override\n  public LongWritable\
  \ createInitialValue() {\n    // 此方法用于为聚合器创建初始状态，在我们的例子中，初始值为 0\n    return new\
  \ LongWritable(0);\n  }\n\n  @Override\n  public void aggregate(LongWritable value)\
  \ {\n    // 此方法用于将传入的值合并到前一个方法创建的聚合器中\n    getAggregatedValue().set(getAggregatedValue().get()\
  \ + value.get());\n  }\n}\n```\n\n这里的实现已经简单到了极致，但这并非一个玩具示例。这段代码直接从 Giraph 代码库中原封不动地提取出来。希望这能充分激发你的灵感，以便在\
  \ Giraph 未提供你所需的聚合器时，能自行创建。\n\n### 聚合器与 Master Compute\n\n如你所见，聚合器通过简单的扁平`String`名称空间进行引用。每个名称都与一个实现了`Aggregator`接口的类相关联。一旦建立这种关联，每个顶点的`compute()`方法就可以通过调用`aggregate(name,\
  \ value)`方法提供一个待聚合的值，或者通过调用`getAggregatedValue(name)`查询聚合器的当前状态，并期望返回值类型与相应`aggregate()`方法调用中提供的类型一致。聚合器的实现定义了如何将来自不同顶点的多次`aggregate()`调用提供的多个值聚合为同一类型的单个值。这与你在组合器（combiners）中看到的模式类似。\n\
  \n例如，聚合器可以对数值求和，或寻找最小值/最大值。Giraph 提供了大约十几个聚合器，用户可以通过直接实现`Aggregator`接口，或者更好的方式是继承`BasicAggregator`抽象类来扩充这个集合。对于大多数实用的聚合器来说，后者提供了一个合理的起点，而前者则不受实现方式的约束。你可以根据需求创建任意数量的聚合器：它们在数据类型以及对来自不同顶点的多个值执行的聚合操作上都是相互独立的。\n\
  \n最后，聚合器可以是常规的（regular）或持久的（persistent）。区别在于，常规聚合器的值在每个超步（superstep）中会重置为初始值，而持久聚合器的值在整个应用程序运行期间都存在。你可以根据是通过调用`registerAggregator()`还是`registerPersistentAggregator()`进行注册，来决定将同一个聚合器实现用作常规聚合器还是持久聚合器。\n\
  \n聚合器作为顶点间汇合点的功能很有用，但它们在影响图计算方面的真正强大之处，在于与 master compute 的结合使用。master compute 背后的思想是对纯\
  \ BSP 模型的一个轻微扩展。你所做的只是在每个超步开始时（在调用各个顶点的`compute()`方法之前），引入一个钩子（hook）来运行 master compute\
  \ 对象的特殊`compute()`方法。这为你提供了一个集中位置来影响图计算后续流程的各个方面。Master compute 为注册和初始化聚合器，以及在连续超步之间检查其状态，提供了绝佳的机会。反过来，聚合器为工作节点（worker）和\
  \ master compute 方法之间提供了一种通信手段。在给定的超步中，所有工作节点上所有聚合器的值始终是一致的，因为这些值会在每个超步开始时进行广播。另一方面，在每个超步结束时，这些值会被收集起来，并可供下一次\
  \ master compute 调用使用。这意味着，工作节点使用的聚合器值与同一超步中 master 使用的聚合器值是一致的；而 master 使用的聚合器值与上一个超步中工作节点使用的聚合器值是一致的。\n\
  \n## 真实世界示例：最短路径查找器\n\n到目前为止，我们一直专注于一些人为的小型示例，以突出 Giraph API 的某些方面。你可能会认为真实的 Giraph\
  \ 应用程序要复杂和繁琐得多。然而，事实往往是，即使在处理超大规模图数据的任务中，所使用的应用程序也往往相当简洁。\n\n总的来说，Giraph 应用程序遵循\
  \ Unix 哲学，即编写只做一件事并且做好的小工具。在 Unix 中，通常使用管道，让下一个工具处理上一个工具的输出，Giraph 也是如此。Giraph 管道由连续的\
  \ Giraph 应用程序串联而成，每个后续应用程序处理前一个应用程序序列化的图表示。\n\nGiraph 开箱即用地提供了一些著名的、有用的算法。你可以通过给\
  \ Giraph 传递命令行参数`-la`来获取内置算法的列表。\n\n清单 5-29 中展示的示例是图论中一个典型算法的完整实现：它查找图中的最短路径（也称为\
  \ Dijkstra 算法）。它的作用如下：给定一个图表示和一个顶点，它找出该顶点与图中所有其他顶点之间的最短路径。例如，如果你将图想象成一张地图，顶点代表城市，边代表道路，整数边标签代表驾驶距离，那么结果就是所选城市与地图上其他城市之间的最短驾驶距离。\n\
  \n这个算法的思路相当直接。你首先为所选城市分配驾驶距离 0（毕竟，你不需要开车去那里），并为所有其他城市分配无穷大的距离（最坏的情况是其他所有城市与起始城市之间没有路径）。然后，你并行地计算每个顶点的值（当前到该顶点的最短距离）加上到该顶点所有邻居的距离之和。你可以将其视为每个顶点向它所有的邻居广播其已知的最佳最短路径，而邻居则有机会根据这些信息更新它们自己的值。如果这样的更新提供了一个更短的距离，那么邻居没有理由不把它视为新的最短路径。当图中不再有更新发生时，算法收敛。\n\
  \n清单 5-29 是直接从 Giraph 代码库中提取的未删节源码。这是一个很好的例子，说明即使是最小、最简单的图处理算法在实践中也是不可或缺的。它也给了你一个机会来回顾你在本章中学到的相当多的\
  \ API 调用。\n\n\n\n\n### 本代码操作一个图，其中每个顶点的顶点数据包含一个 `LongWritable` 类型的 ID 和一个 `DoubleWritable`\
  \ 类型的到源顶点的距离。所有边都关联了 `FloatWritable` 标签，表示两个连接顶点之间的距离。通过 `SimpleShortestPathsVertex.sourceId`\
  \ 命令行选项将源顶点传递给实现；该选项应为一个 `LongWritable` 类型的 ID。你需要测量图中从该源顶点到所有其他顶点的距离。初始时，你将所有顶点（除了起始顶点）的距离度量设为\
  \ `Double.MAX_VALUE`。每个顶点期望收到其邻居发来的消息，宣布从源顶点到每个邻居的距离，再加上邻居顶点与接收顶点之间的距离。然后，你选择最小的值（因为你对最短路径感兴趣），如果它恰好小于当前距离，你就假设发现了一条通过某个邻居的更短路径；接着，你向邻居发送消息宣布这一事实。最后，无条件调用\
  \ `voteToHalt()` 确保只要有未处理的消息，计算就会继续。这是合理的，因为当没有消息剩余时，意味着每个顶点都已获得最短距离，剩下的只是记录图的状态。\n\
  \n### 清单 5-29. `SimpleShortestPathsComputation.java`\n\n```java\nimport org.apache.giraph.graph.BasicComputation;\n\
  import org.apache.giraph.conf.LongConfOption;\nimport org.apache.giraph.edge.Edge;\n\
  import org.apache.giraph.graph.Vertex;\nimport org.apache.hadoop.io.DoubleWritable;\n\
  import org.apache.hadoop.io.FloatWritable;\nimport org.apache.hadoop.io.LongWritable;\n\
  import org.apache.log4j.Logger;\nimport java.io.IOException;\n\npublic class SimpleShortestPathsComputation\
  \ extends\n    BasicComputation<LongWritable, DoubleWritable,\n    FloatWritable,\
  \ DoubleWritable> {\n\n  // 这就是我们如何传递起始顶点的 ID：\n  // 通过 giraph 执行工具的命令行参数传递。\n \
  \ public static final LongConfOption SOURCE_ID =\n      new LongConfOption(\"SimpleShortestPathsVertex.sourceId\"\
  , 1,\n          \"最短路径的 ID\");\n\n  private static final Logger LOG =\n      Logger.getLogger(SimpleShortestPathsComputation.class);\n\
  \n  private boolean isSource(Vertex<LongWritable, ?, ?> vertex) {\n    return vertex.getId().get()\
  \ == SOURCE_ID.get(getConf());\n  }\n\n  @Override\n  public void compute(\n   \
  \   Vertex<LongWritable, DoubleWritable, FloatWritable> vertex,\n      Iterable<DoubleWritable>\
  \ messages) throws IOException {\n    if (getSuperstep() == 0) {\n      vertex.setValue(new\
  \ DoubleWritable(Double.MAX_VALUE));\n    }\n\n    double minDist = isSource(vertex)\
  \ ? 0d : Double.MAX_VALUE;\n    for (DoubleWritable message : messages) {\n    \
  \  minDist = Math.min(minDist, message.get());\n    }\n\n    if (LOG.isDebugEnabled())\
  \ { // 处理调试输出的好方法\n      LOG.debug(\"顶点 \" + vertex.getId() + \" 获取到的最小距离 = \" +\n\
  \          minDist + \" 顶点值 = \" + vertex.getValue());\n    }\n\n    // 以下是最短路径算法的核心\n\
  \    if (minDist < vertex.getValue().get()) {\n      vertex.setValue(new DoubleWritable(minDist));\n\
  \      for (Edge<LongWritable, FloatWritable> edge : vertex.getEdges()) {\n    \
  \    double distance = minDist + edge.getValue().get();\n        if (LOG.isDebugEnabled())\
  \ {\n          LOG.debug(\"顶点 \" + vertex.getId() + \" 发送到 \" +\n              edge.getTargetVertexId()\
  \ + \" = \" + distance);\n        }\n        sendMessage(edge.getTargetVertexId(),\n\
  \            new DoubleWritable(distance));\n      }\n    }\n    vertex.voteToHalt();\n\
  \  }\n}\n```\n\n## 总结\n\n本章涵盖以下主题：\n\n* 构建你的第一个“Hello World”Giraph 应用并为其编写单元测试\n\
  * 发现指定图定义数据的多种方式\n* 探索 Giraph 图计算模型的细节\n* 操作图结构的拓扑结构\n* 深入研究消息传递的高级用法\n* 利用 Giraph\
  \ 对简单 BSP 计算模型的扩展，例如聚合器和主计算\n\nGiraph 框架提供了一套强大的 API，可满足各种图处理算法的需求。所有 Giraph 实现的一个共同点是，它们必须提供\
  \ `compute()` 方法的实现，该方法至少为每个顶点调用一次。每个 `compute()` 的实现都可以完全访问各种实用方法：\n\n* 每个 Giraph\
  \ 应用在需要指示顶点完成计算时，都会使用 `voteToHalt()`。当所有顶点都调用 `voteToHalt()` 且没有待处理的消息时，整个计算就会停止。\n\
  * 你可以使用 `sendMessage()` 和 `sendMessageToAllEdges()` 等方法，从任意顶点向任何其他顶点发送消息（无论它们是否连接）。如果目标顶点不存在，则会创建它。\n\
  * 在输入/输出方面，你可以访问大量的内置输入和输出格式，用于解析各种图表示形式，并且如果需要，还可以选择自行编写。你在本章中看到了 `IntIntNullTextInputFormat`\
  \ 和 `TextDoubleDoubleAdjacencyListVertexInputFormat`，但 Giraph 还提供了更多格式，使你可以不仅从文件，还可以从\
  \ HBase、Hive 和其他数据存储中读取数据。\n* 另一组常用的 API 提供了查询图拓扑结构的方法（`getEdgeValue()`、`getVertexId()`\
  \ 等），并且可以在应用运行期间修改图（`addVertexRequest()`、`addEdge()` 等）。\n* 一部分 API（支持聚合器和主计算）超出了基本的\
  \ BSP 图计算模型。\n* 如果发送消息的成本成为问题，Giraph 提供了有效的工具来处理它：通过将组合器应用于多条消息，并有效压缩流量。\n\n本章为本书后续部分奠定了实际使用\
  \ Giraph API 的基础，但你尚未了解 Giraph 框架的实现细节，以及它如何使用 Hadoop MapReduce 和 Apache ZooKeeper\
  \ 等底层机制。这将是下一章的重点。\n\n"
- '# 6. Giraph 架构


  前一章介绍了大量 Giraph API，并展示了如何将它们用于各种图处理应用。本章将深入 Giraph 实现的内部，向你展示在图处理应用执行和调用 API 时，幕后发生了哪些事情。


  在本章的其余部分，你将使用第 5 章中介绍的 Giraph 示例应用。假设应用操作的图的大小以数十亿行输入来衡量。基于此假设，本章将追踪应用在 Hadoop 集群上运行的每一步。你将首先了解组成一个运行中的
  Giraph 应用的不同服务的功能角色，这些服务如何分配到集群中的计算节点，以及它们如何协调活动以执行整个图处理任务。你还将研究对输入进行分区和加载初始图拓扑所需的步骤，以便每个顶点都能分配给一个执行计算操作的工作者。然后，你将深入探讨每个服务的实现细节，并在本章结束时，审查
  Giraph 实现需要应对的故障场景。




  ## Giraph 的诞生


  到目前为止，你仅使用过那些能轻松放入单台主机磁盘和内存空间的小型数据集上的 Giraph。虽然 Giraph 当然适用于中小型图，但其真正的威力在于它的可扩展性。为了让您体验
  Giraph 实现所需达到的可扩展性水平，不妨看看它在 Facebook 的使用场景：分析社交网络成员的关系图。2013 年，顶点总数估计约为 11 亿，边的数量则高达数万亿。即使存储每个与顶点或边相关的数据块仅需几百字节，仅图表示本身就已接近
  PB 级别。在单节点上存储如此规模的数据集是不可能的；而使用单节点的 CPU 资源进行分析将耗时巨大，令人望而却步。满足存储和计算需求的唯一扩展途径是利用商用硬件集群。


  因此，一个运行中的 Giraph 应用是集群中不同节点上并行运行的一组分布式网络服务，这并不令人意外。这些服务中的每一个都为 Giraph 应用的其余部分提供特定功能，拥有自己的生命周期，并通过远程
  API 调用与运行在不同节点上的其他服务交互。由于这些交互大多基于网络，因此需要处理网络编程的所有复杂性（统称为*分布式计算的谬误*）。例如，Giraph 实现花费大量时间调整其内部服务的生命周期，以便在单个服务发生故障时能够实现最高效的恢复。


  ### 分布式计算的谬误


  早在 1994 年，Sun Microsystems 的几位聪明工程师就开始意识到局域网设计进步所释放的分布式计算的力量。大约在同一时间，其中一位工程师 John
  Gage 提出了“网络即计算机”这一说法，以概括公司的新方向。这是好消息。坏消息则由另一位 Sun 工程师 (Peter Deutsch) 汇编，作为在设计这种下一代计算机架构时需注意的一系列错误假设，传递给后世工程师。这个列表被称为分布式计算的谬误，并且时至今日，其相关性仍与
  20 年前一样高：


  *   网络是可靠的。

  *   延迟为零。

  *   带宽是无限的。

  *   网络是安全的。

  *   拓扑结构不会改变。

  *   存在一个管理员。

  *   传输成本为零。

  *   网络是同质的。


  在阅读本章时请牢记此列表——它将帮助您理解 Giraph 实现所做的相当多的架构决策。


  ## Giraph 构建块与概念


  无论您是在单台主机上（如您在第 5 章中所做的那样）还是在一个 1000 节点的集群上运行示例应用程序，Giraph 所做的一切归根结底就是确保一段作为特定类型网络服务的
  Java 代码能够在指定数量的主机上执行。在继续之前，让我们快速定义作为 Giraph 架构基本构建块的三种网络服务类型：*主节点* (master)、*工作节点*
  (worker) 和*协调器* (coordinator)。


  每一次 Giraph 计算都是这些服务协调执行的结果，它们作用于被分割成分区并并行处理的顶点子集。分区是一个关键的优化手段，它允许并行执行图处理任务；它是动态的，意味着分区到工作节点的分配可以根据运行中应用程序的特性而变化。然而，在每个超步中，Giraph
  应用程序的整体功能结构如图 6-1 所示。此图中表示的所有服务都是 Giraph 实现内部的，对最终用户不可见，但了解其架构仍然很重要——即使只是为了能够在 Giraph
  应用程序运行出错时进行调试。


  ![A978-1-4842-1251-6_6_Fig1_HTML.jpg](img/A978-1-4842-1251-6_6_Fig1_HTML.jpg)


  **图 6-1.** 运行中的 Giraph 应用程序的功能结构


  ### 主节点 (Masters)


  始终有一个活跃的主节点服务和若干个备用主节点，当当前主节点发生故障时，备用主节点会竞争成为活跃主节点。备用主节点处于休眠状态，在运行中的 Giraph 应用程序生命周期中不扮演活跃角色。一旦主节点变为活跃状态，其职责就是协调计算。此任务包括执行以下操作：


  *   以协调的方式将工作节点从一个超步过渡到下一个超步

  *   在每个超步之前，将分区分配给活跃的工作节点

  *   运行主节点计算代码

  *   监控所有工作节点的健康状况和统计数据


  ### 工作节点 (Workers)


  工作节点构成了 Giraph 服务的大部分。它们的主要功能是管理分配给它们的图分区状态。每个工作节点都暴露一组网络 API，以允许远程工作节点操作分配给它的分区中的数据。再次注意，这些网络
  API 是 Giraph 实现内部的，不期望对最终用户可用。工作节点按照活跃主节点的指示从一个超步过渡到下一个超步。在每个超步期间，工作节点遍历其拥有的图分区，并为属于这些分区的所有顶点执行
  `compute()` 方法。工作节点还负责不时地对其状态进行检查点设置，作为从工作节点故障中恢复的一种手段。


  请注意，图分区到工作节点的分配不是永久性的，并且在每个超步之前会由主节点驱动的重新平衡进行调整。实现 `MasterGraphPartitioner` 接口的类提供了分区逻辑的实现。属于活跃主节点的该类的实例管理当前的分区到工作节点映射，并提供
  `generateChangedPartitionOwners()` 方法，以便根据来自工作节点的各种统计数据重新评估映射。主节点通过协调服务更新映射。另一方面，工作节点会查找哪些分区不再属于它们，并通过发出网络
  API 调用在目标工作节点上重建这些分区的状态。




  ### 协调节点


  运行协调服务的节点为 Giraph 的其他服务提供“神经组织”。它们不参与执行任何图处理工作；相反，它们为 Giraph 的其余部分提供分布式配置、同步和命名注册服务。


  有几种可用的协调服务实现，但在 Hadoop 生态系统中，默认选择始终是 Apache ZooKeeper。`ZooKeeper` 服务如此普遍，以至于难以想象一个生产环境的
  Hadoop 集群部署可以没有它。它已成为 Hadoop 生态系统中任何应用协调的代名词。


  运行协调服务的节点集合统称为 `ZooKeeper` 集合（ensemble）。集合中的所有节点都被视为对等节点，每个节点都拥有 `ZooKeeper` 状态的一个副本，以此实现高可用性和容错性。只要大多数节点处于运行状态，服务就能正常运行。


  Giraph 提供了两种管理协调服务的选项。默认选项是在 Giraph 应用运行时按需启动 `ZooKeeper` 集合节点。这样，协调服务与主节点或工作节点并无区别：它们完全由
  Giraph 管理，并在应用退出后消失。第二个选项是使用作为集群一部分进行集中维护的独立 `ZooKeeper` 集合。在这种情况下，Giraph 应用充当纯粹的客户端，无需在
  Giraph 应用使用的节点上运行协调服务。


  建议在生产环境中使用 Giraph 时采用第二种方法。它便于进行事后分析和实时调试（因为协调服务在 Giraph 应用退出后仍保持运行）。此外，由于它使用集群范围、集中化、经过高度调优和维护良好的
  `ZooKeeper` 集合，你的应用性能可能会更佳。


  ## 引导 Giraph 服务


  考虑第 5 章中的任意示例，但这次假设你必须处理一个更大的输入数据集。数据集的大小使得在单台主机上执行应用成本过高，并需要使用集群。好消息是，你无需更改应用即可使其在计算资源集群上运行：Giraph
  架构足够灵活，可以弹性扩展。要开始使用集群，你只需告诉 Giraph 它可以为哪些目的使用多少计算资源。


  设置配置属性 `giraph.maxWorkers`（或通过命令行选项 `-w` 传递相同值）可以告诉 Giraph 应该使用多少计算资源来执行工作节点服务。另一个配置属性
  `giraph.zkServerCount`（默认值为 1）告诉 Giraph 需要分配多少计算资源来运行主节点和协调服务。最后，应用使用的集群资源总数由配置属性
  `giraph.SplitMasterWorker` 决定。如果该属性设置为 `false`，则所有服务可以在所有集群资源上运行，使用的资源总数等于 `giraph.maxWorkers`
  的值。另一方面，如果设置为 `true`（其默认值），则使用的资源总数是 `giraph.maxWorkers` 与 `giraph.zkServerCount`
  之和。


  在本章剩余部分，假设集群至少包含十个节点，以便你可以使用设置为 8 的 `giraph.maxWorkers` 和设置为 2 的 `giraph.zkServerCount`
  来执行示例应用。同时假设 `giraph.SplitMasterWorker` 使用默认值 (`true`)，这样使用的集群资源总数正好是十个（八加二）。这些资源将用于运行恰好八个工作节点服务、两个主节点服务和两个协调服务（主节点和协调服务部署在同一位置）。


  牢记这些设置，让我们来看一下底层机制，该机制将每个服务所需的 Java 代码片段推送到所需的集群资源，并使其表现为一组八个工作节点服务、两个主节点服务和两个协调服务。参见图
  6-2。


  ![A978-1-4842-1251-6_6_Fig2_HTML.jpg](img/A978-1-4842-1251-6_6_Fig2_HTML.jpg)


  图 6-2. 在 10 个主机的集群上运行示例


  虽然知道在命令行选项正确组合的情况下，Giraph 可以开始利用 Hadoop 集群的强大功能是件好事，但你在本章中要回答的问题是这是如何发生的。一种在计算资源集群上分发服务的方法，需要构建一个定制的、特定于
  Giraph 的集群管理层，并特意为图处理应用而设计。这样做本身并无不妥；Apache Hama（一个与 Giraph 非常相似的图处理框架）正是做出了这种类型的设计决策。它允许更高级别的控制，但代价是维护与图处理无关的底层集群管理代码。


  与 Hama 不同，Giraph 决定使用现有的集群管理解决方案来完成所有繁重的工作。Apache Hadoop 是最流行的解决方案，也是 Giraph 发行版默认自带的方案。不过，它不是唯一的选择。即使在
  Hadoop 项目内部，Giraph 也有两种选择：更经典的 MapReduce 框架（在早期版本的 Hadoop 中也可用）和一套全新的资源管理 API，称为
  YARN。YARN 后端仍处于实验阶段，本章假设示例应用是使用 Hadoop MapReduce 框架执行的。


  ### 当 MapReduce 并非真正意义上的 MapReduce





  `MapReduce`框架用于分布式数据分析，最早由两位谷歌工程师（Jeffrey Dean 和 Sanjay Ghemawat）在 2004 年的开创性论文《MapReduce:
  Simplified Data Processing on Large Clusters》中提出。该框架的核心思想虽然简单，但要求应用程序设计进行根本性转变。论文提出，每个数据处理应用程序应围绕两个核心代码构建：一个称为`mapper`，另一个称为`reducer`。这两段代码会透明地在大型计算资源集群上实例化，从而使应用程序能够利用所有可用的计算资源处理尽可能多的数据。换句话说，成千上万个`mapper`副本并行运行，全部向同样并行运行的数百个`reducer`提供数据。程序员无需处理底层集群管理的繁琐工作，可以专注于实现`mapper`和`reducer`。


  `Apache Hadoop`是首个广受欢迎的开源`MapReduce`框架实现。它的出现使得那些可以简洁地分解为`mapper`和`reducer`的数据处理应用数量激增。图处理不属于此类应用；它通常更具迭代性，并需要不同的数据分区方式。


  因此，当使用`MapReduce`作为后端运行时，`Giraph`无法充分利用该框架的核心理念。它只需要从`Hadoop`获得一种方法，将其自身代码推送到指定数量的计算资源上。`Giraph`采用的方式是构建一个虚假的`MapReduce`应用程序，该应用使用固定数量的`mapper`且没有`reducer`，这被称为仅`map`应用。由于它与`Hadoop`的所有数据管道断开连接（从`Hadoop`的角度来看），它会“永久运行”（与普通的`MapReduce`应用程序相反，后者会一直运行直到未处理的数据耗尽）。正因如此，`Giraph`实现必须处理初始数据的摄入并限制应用程序的运行时间。


  即使一个正在运行的`Giraph`应用程序在`Hadoop`集群看来像一个`MapReduce`应用程序，它的行为与典型的`MapReduce`任务也几乎没有关系。


  `Giraph`是如何使用`MapReduce`来启动所有必需的内部服务的呢？这需要将`Giraph`的业务逻辑封装在`GraphTaskManager`类实现中，并期望它在`Giraph`应用程序可用的每个节点上被实例化。`MapReduce
  Hadoop`框架期望`GraphTaskManager`提供一种执行`mapper`的方式。`Giraph`无需关心`GraphTaskManager`实例是如何创建的细节；相反，它专注于在`Giraph`服务的整体网格中需要执行的任务。当`Giraph`使用`MapReduce`作为后端时，实例化`GraphTaskManager`对象的任务属于`mapper`。这个不寻常的`mapper`唯一做的事情就是如此。


  在最高层面上，在机器集群上执行`Giraph`应用的整个流程包括以下步骤（如图 6-3 所示）：


  ![A978-1-4842-1251-6_6_Fig3_HTML.jpg](img/A978-1-4842-1251-6_6_Fig3_HTML.jpg)


  Figure 6-3.


  在节点集群上引导一个`Giraph`应用程序 底层集群管理框架（很可能是`Hadoop`的`MapReduce`或`YARN`，尽管`Giraph`也可以接入其他框架）在多个节点上实例化一个`GraphTaskManager`类实现。具体数量由`Giraph`的配置决定。
  同一框架随后调用`GraphTaskManager.setup()`方法，该方法负责初始化，并确定该节点应向`Giraph`应用的其他部分提供哪种内部`Giraph`服务（主节点、工作节点或协调服务）。
  `GraphTaskManager.execute()`方法获得控制权。`Giraph`应用程序开始运行，每个节点承担三种内部服务之一的角色：主节点、工作节点或协调器。


  尽管架构简单，但这意味着`Giraph`无需关心寻找合适集群资源、调度容器在资源上运行、在容器失败时在不同主机上重启它们，以及分配底层资源的细节。这是一种非常灵活的方法，使得`Giraph`应用可以根据需要拥有任意数量的工作节点；集群管理框架负责维护工作节点池。这一切都是好消息，除了一个细节：容器可以在集群中的任何主机上实例化，如果它们不知道其他服务的主机名（或
  IP 地址），它们如何相互通信？


  这个问题的答案在于`Giraph`使用了一个所有容器都能与之通信的协调服务。不同的`Giraph`服务将协调服务作为一个公告板或目录，所有容器可以在其中发布关于自身的信息（例如网络坐标、运行状态等），并查看其他容器发布的信息。因此，每个容器无需跟踪所有其他容器的网络地址和状态，引导`Giraph`框架所需的唯一信息就是协调服务的位置。


  协调服务扮演中央信息分发器角色的一个有趣后果是，它承担了与每个容器通信的主要负担。为了避免使其过载，`Giraph`实现试图最小化每个容器与协调服务之间的流量。其方法是通过协调服务管理少量元数据，并在尽可能的情况下选择容器之间的直接通信。


  只要`Giraph`服务正常运行，像`Hadoop`这样的集群管理框架就不会干预。如果服务失败（由于软件错误或硬件故障），则由集群管理框架负责启动新实例。协调服务在帮助`Giraph`实现检测服务何时失败以及何时（可能在不同主机上）恢复上线方面发挥着至关重要的作用。这样，活跃的主节点总能找到在活跃工作节点之间重新平衡当前图计算的方法。


  当然，检测服务失败并启动新实例只解决了一半问题。当一个服务宕机时，它也会将其内存中的状态一起带走。如果仅仅因为成千上万个服务中的一个宕机，`Giraph`就不得不重启整个计算，那将是件不幸的事。解决这个问题的一个优雅方案是使用定期检查点。在指定的时间间隔（通过`giraph.checkpointFrequency`配置属性设置），`Giraph`将所有服务的状态记录到`HDFS`中的一个永久位置（位于当前用户的主目录下）。假设`giraph.checkpointFrequency`设置为
  5。这意味着每五个超步之后，所有服务的状态都会被检查点保存。如果某个服务失败，计算最多只需重做最近的五个超步，因为它会从检查点保存的状态重新启动。检查点频率的具体设置值高度依赖于具体应用。一方面，更频繁的检查点会增加应用程序的总运行时间；另一方面，它会加速工作节点失败后的恢复。尝试不同的值，然后选择最适合你的那个。请记住，此属性的默认值是
  0：默认情况下，检查点是禁用的。


  既然你已经了解了`Giraph`如何使用集群计算资源的机制，接下来让我们详细了解每个`Giraph`服务的作用以及它们如何交互。





  ## Giraph 服务架构剖析


  一旦完全启动并运行，每个 Giraph 应用程序都由一个服务网络构成，这些服务通过网络 API 调用相互通信，共同完成图处理。Giraph 实现的两种服务（主节点和工作节点）共享基于
  `CentralizedService` 接口及其实现类 `BspService` 抽象类的通用设计。协调服务由独立的 Apache ZooKeeper 项目单独实现，本书不对此进行讨论。


  ### 什么是 Apache ZooKeeper？


  Apache ZooKeeper 致力于开发并维护一个开源服务器，以实现高度可靠的分布式协调。它的诞生是为了应对高度分布式应用程序的激增，这些应用程序都试图以临时方式实现类似的功能。你可以在
  [`http://zookeeper.apache.org`](http://zookeeper.apache.org/) 或由其两位作者 Flavio Junqueira
  和 Benjamin Reed 编写的书籍《*ZooKeeper：分布式进程协调*》（O''Reilly, 2013）中找到关于 ZooKeeper 设计与实现的信息。


  主节点提供的所有功能都在 `BspServiceMaster` 类中实现。在工作节点端，对应的实现是 `BspServiceWorker`。这两个类都通过继承
  `BspService` 并实现更具体的接口，来扩展其通用功能，如图 6-4 中的类层次结构所示。


  ![A978-1-4842-1251-6_6_Fig4_HTML.jpg](img/A978-1-4842-1251-6_6_Fig4_HTML.jpg)


  **图 6-4.** Giraph 服务类层次结构


  这两种服务通过使用实现以下接口的类，同时充当网络服务器和客户端：


  *   对于主节点：`MasterClient` 和 `MasterServer`。

  *   对于工作节点：`WorkerClient` 和 `WorkerServer`。


  目前，这四个接口的唯一可用实现都是基于 Netty 框架。Netty 是一个新的 I/O (NIO) 客户端/服务器框架，能够快速、轻松地开发网络应用程序，例如协议服务器和客户端。如果你不熟悉
  Netty，也不必担心；只要你了解它实现了 NIO，就应该能毫无困难地理解 Giraph 如何使用它。Giraph 通过将提供通用、支持 Netty 的客户端/服务器交互的代码封装到两个独立的类（`NettyClient`
  和 `NettyServer`）中，来抽象化这一层。这部分与 Giraph 图处理模型关系不大。而与模型相关的部分则被封装到图 6-5 所示的四个类中。


  ![A978-1-4842-1251-6_6_Fig5_HTML.jpg](img/A978-1-4842-1251-6_6_Fig5_HTML.jpg)


  **图 6-5.** 支持 Netty 的客户端/服务器架构


  如你所见，每个类都通过将所有非 Giraph 特定的客户端/服务器交互委托给它所拥有的 `NettyClient` 或 `NettyServer` 对象，来实现相应的接口。


  确定哪个节点应提供哪个 Giraph 服务由 `GraphTaskManager.setup()` 处理。此决定在 Giraph 应用程序运行期间是永久的，并由提供给
  Giraph 框架的配置参数驱动。例如，如果通过 `giraph.zkList` 配置选项指定了外部 ZooKeeper 集合，那么 Giraph 就无需将此服务分配给它管理的节点。该实现可以灵活地将任何服务组合分配给给定节点，但有一个例外：协调服务不能是分配给节点的唯一服务。换句话说，运行协调服务的节点始终同时运行一个额外的主节点服务，或者同时运行所有三种服务。仅有的两种不可能存在的节点服务分配组合是：


  *   专门用于运行协调服务的节点

  *   运行协调服务和工作节点服务的节点


  现在你已经对 Giraph 如何实现其主节点、工作节点和协调服务的通用方面有了足够的了解，是时候更深入地研究它们的详细架构了。


  ## 主节点服务


  主节点服务始终作为由 `MasterThread` 类实现的额外 Java 线程运行。该类的实例拥有对 `BspServiceMaster` 对象的引用，并通过编排对
  `BspServiceMaster` 暴露的 API 的调用来实现其功能。主节点算法非常简单，但其设计需要具有弹性，以便在当前主节点发生故障时，另一个主节点（通常在不同的主机上运行）能够接替其职责。图
  6-6 展示了每个主节点服务都会经历的高级步骤。


  ![A978-1-4842-1251-6_6_Fig6_HTML.jpg](img/A978-1-4842-1251-6_6_Fig6_HTML.jpg)


  **图 6-6.** 单个主节点服务生命周期


  主节点做的第一件事是通过 `BspServiceMaster.becomeMaster()` 调用，竞标成为活动主节点。请注意，尽管所有主节点都会发出此调用，但除一个之外的所有主节点都将被阻塞。成功的那一个将确定活动主节点；其他主节点将保持阻塞状态，直到活动主节点失败。届时，其中一个阻塞的调用将返回，从而确定下一个活动主节点。正如你稍后将看到的，此同步屏障是通过使用协调服务的功能来实现的。


  成为活动主节点后，主节点线程会实例化一个 `MasterCompute` 对象（前提是 Giraph 应用程序配置中请求了该对象）。这反过来又有机会在活动主节点上注册应用程序聚合器。


  在进入超步循环之前，活动主节点尝试执行另一个重要功能：为图数据（包括顶点数据和边数据）创建一组输入分片，以由适当的输入格式加载。由于 Giraph 应用程序通常操作存储在分布式文件系统中的一组巨大文件，因此有效地将加载该数据的工作分配给所有可用的工作节点是一个关键的可扩展性要求。此功能在
  `BspServiceMaster.createInputSplits()` 方法中实现，其工作方式如下。首先，它查询协调服务，以查看哪个工作节点应加载哪个文件的映射是否已建立。如果尚未建立，则生成映射并将其持久化到协调服务中。这同时完成了两件事。其一，由于每个工作节点都在监视协调服务的更新，一旦映射可用，工作节点就可以加载其那部分输入数据（此步骤的详细信息见下文“协调服务”一节）。其二，将映射作为事务持久化到协调服务，使得备份主节点能够在活动主节点宕机时有效地接替其工作。


  一旦输入分片的映射对所有工作节点可用，活动主节点就会转换到超步循环，只要还有超步就持续运行。驱动超步循环的大部分功能实现在 `BspServiceMaster`
  的方法 `coordinateSuperstep()` 中，并由以下步骤组成：




  通过观察协调服务中的自报告信息来确定健康工作者的集合。主节点在超步持续期间通过监听协调服务事件来观察健康工作者，并在它们发生故障时采取纠正措施。


  将图分区分配给健康工作者。这是针对特定超步的动态分配，并且可能会在下一个超步中基于工作者负载和其他考虑因素而改变。如果有任何分区被分配给了本地内存中没有该分区图数据的工作者，那么拥有该分区的工作者负责通过发出
  API 调用来发送图数据，从而在目标工作者上重建该分区。如果此超步是从检查点重新启动的，分区数据也可能来自检查点文件。


  将聚合器从前一个超步的状态最终确定，并将它们发送给新的工作者所有者。这是两阶段分布式聚合器管理的最后一步。此时，主节点已完成最终聚合，并准备将值发回，以便在当前超步期间进行进一步聚合。请参阅下面的“工作者服务”部分，了解两阶段分布式聚合器实现中工作者侧的内容。


  如果当前超步是一个输入超步（这是一个伪超步，用于让工作者从输入分片加载初始图数据），则协调顶点和边数据的加载。这是通过将数据文件划分成输入分片，并将输入分片到工作者的映射写入协调服务来实现的。在协调服务中监视更新的工作者会注意到属于它们的映射已可用，并将其解释为开始加载数据的信号。


  等待所有工作者完成当前超步的处理。如果在处理当前超步期间有任何工作者发生故障，则尝试从检查点状态重新启动。如果成功，超步循环的下一次迭代将假定前一个超步是从检查点状态恢复的那个超步。


  如果满足检查点频率，则等待所有工作者检查其状态，然后全局完成检查点过程（包括检查聚合器）。


  此时，假设所有工作者已成功完成当前超步，并且可以安全地收集分配给它们的聚合器的值。


  一旦所有聚合器值都被收集，并且聚合器的全局状态（存储在活动主节点的内存中）被更新，调用主计算的 `compute()` 方法。


  确定是否该停止整个计算。为此，首先检查是否在协调服务中设置了外部标志，该标志指示因任意原因停止计算。如果没有，则检查是否所有顶点都投票停止，并且没有更多待发送到顶点的消息。最后，检查发生的超步数是否超过了此应用程序允许的最大超步数（你可以使用
  `giraph.maxNumberOfSupersteps` 属性为此设置一个值）。如果这些条件中的任何一个为真，则在此作业的全局统计信息中记录计算已停止的事实，并退出超步循环。


  将聚合后的应用程序状态发布到协调服务中。


  根据 `giraph.textAggregatorWriter.frequency` 的值，检查是否到了输出所有已注册聚合器状态的时间。如果是，则调用提供的 `AggregatorWriter`
  实现。


  一旦超步循环结束，主节点唯一剩下要做的就是调用清理例程 `BspServiceMaster.cleanup()`。所有主进程应通过向协调服务发布一种特殊类型的通知来表明它们已完成。当通知的数量等于工作者和主节点的分区数量时，主节点清理与作业关联的全局状态。这就是在协调服务的帮助下实现全局屏障的方式。


  回到示例应用程序，始终正好运行两个主节点服务：一个活动，一个备用。如果活动主节点发生故障，备用主节点会恢复协调活动。只要主节点处于活动状态，其超步循环就会执行图
  6-7 中概述的步骤。


  ![A978-1-4842-1251-6_6_Fig7_HTML.jpg](img/A978-1-4842-1251-6_6_Fig7_HTML.jpg)


  **图 6-7.** 示例应用程序的活动主节点超步循环




  ### 工作服务


  在 Giraph 应用中，工作服务的核心功能是管理由主节点分配给它的若干图分区的状态。与主节点一样，工作节点的生命周期由 `GraphTaskManager.execute()`
  方法管理，该方法编排对 `BspServiceWorker` 类对象所暴露 API 方法的调用，而该类提供了大部分实现。


  每个工作服务都在与主节点相同的容错约束下运行。工作节点故障在 Giraph 应用中是一种常态，工作节点算法在设计时应考虑到这种可能性。


  该算法包含两个阶段：**设置阶段**和**超级步循环阶段**。设置阶段主要涉及将初始图数据加载到所有工作节点的内存中。其关键步骤在图 6-8 中进行了概述。


  ![A978-1-4842-1251-6_6_Fig8_HTML.jpg](img/A978-1-4842-1251-6_6_Fig8_HTML.jpg)


  **图 6-8.** 工作服务生命周期的设置阶段


  毫不意外，`BspServiveWorker.setup()` 提供了设置阶段的实现。在加载数据之前，它会检查 `setup()` 的调用是否作为重启失败超级步的一部分。如果是这种情况，它会从检查点加载状态并退出，因为
  `setup()` 机制的其余部分仅在首次初始化整个 Giraph 应用时适用：


  -   启动一个伪超级步，该超级步不进行计算，而是等待主节点计算输入分片，然后加载分配给此工作节点的输入数据切片。在内部，此超级步被称为 `INPUT_SUPERSTEP`，其数字
  ID 为 -1。关于加载输入分片的一个重要说明：通常，你不应期望分配给工作节点的分片中的输入数据所生成的顶点，恰好属于分配给同一工作节点的图分区。因此，加载顶点和边数据的工作节点几乎必然会产生网络流量，向其他工作节点发送消息，并请求它们在其分区中创建顶点。

  -   只要还有未处理的输入分片，就持续加载数据并创建新的顶点或边。`VertexInputSplitsCallable` 和 `EdgeInputSplitsCallable`
  这两个类提供了此功能的实现。

  -   当没有剩余分片需要处理时，通过向协调服务发布消息来表明此工作节点已完成，并等待其他工作节点完成。这是必要的，因为它允许已完成的工作节点仍然能够接收网络
  API 调用，并使用仍在处理其输入分片的工作节点所加载的顶点来更新其分区。所有工作节点均已完成这一事实由主节点识别，并反映在协调服务中。

  -   当主节点已发出信号表明所有工作节点均已完成数据加载时，执行一些内务处理任务：创建此工作节点拥有的其余分区（那些尚未有输入数据到达的分区），并最终确定源自向属于此工作节点管理的分区中的顶点添加边请求的变更。

  -   等待主节点发出信号，表明伪 `INPUT_SUPERSTEP` 已完成，并且所有顶点已准备好进入超级步循环。


  一旦所有工作节点准备好过渡到超级步循环，它们会同时进行，并进入 Giraph 应用的主要计算循环。只要还有超级步存在，此工作服务超级步循环就会循环执行以下步骤：


  1.  通过调用 `BspServiceWorker.startSuperstep()` 为当前超级步做准备。此调用会合并在前一个超级步期间收到的所有 API
  请求，并相应地修改图分区（添加、删除和更新顶点等）。它还会等待主节点完成工作节点之间的分区重新平衡，并返回此工作节点的分区分配。

  2.  基于当前的分区分配，工作节点可能必须将其部分分区推送到它们被分配到的其他工作节点。它通过调用 `BspServiceWorker.exchangeVertexPartitions()`
  来实现。该方法确保在其所有依赖项完成向其发送数据之前不会返回。像往常一样，工作节点通过向协调服务发送消息来表明其推送自身数据的完成；它依赖主节点来聚合这些消息，并在整个工作节点集群完成图分区交换时发出信号。

  3.  检查此超级步是应该从检查点状态加载，还是应该将当前状态保存到检查点（由 `checkpointFrequencyMet()` 方法指示）。这两种操作的实现由
  `BspServiceWorker` 中定义的两个互补方法提供：`loadCheckpoint()` 和 `storeCheckpoint()`。

  4.  调用 `BspServiceWorker.prepareSuperstep()` 方法，该方法目前主要关注同步此工作节点拥有的聚合器状态与其他工作节点的聚合器状态。在此步骤中，工作节点从主节点获取其管理的聚合器的状态，并阻塞直到这些聚合器被推送到所有其他工作节点。

  5.  为属于此工作节点管理的所有顶点调用 `compute()`。遍历所有顶点，但仅对未暂停或有可用消息的顶点调用 `compute()`。这是以多线程方式完成的，线程使用
  `ComputeCallable` 类作为需要添加到任务队列并稍后执行的任务的实现。

  6.  调用 `BspServiceWorker.finishSuperstep()` 方法，该方法完成结束当前超级步所需的所有工作，然后阻塞，等待主节点发出信号表明所有工作节点已准备好开始下一个超级步。作为此步骤的一部分，所有在此工作节点上最终被赋予了值的聚合器都会被发送给其合法所有者（所有者由主节点动态选择）。然后，等待从所有其他工作节点接收由此工作节点管理的聚合器的值。一旦完成，进行最后一次聚合，并将结果推送回主节点。由
  `finishSuperstep()` 方法执行的最后一项内务处理是将当前超级步的统计信息反映到协调服务中。这是为了出于可观测性和负载均衡的原因，跟踪每个工作节点上发生的事情。

  7.  由于上一步使全局 Giraph 统计信息对每个工作节点可用，只要图中还有活跃顶点剩余，超级步循环就会继续到下一个超级步。


  再次回到示例应用，每个工作节点（一旦进入超级步循环阶段）都会经历图 6-9 中概述的一系列转换。


  ![A978-1-4842-1251-6_6_Fig9_HTML.jpg](img/A978-1-4842-1251-6_6_Fig9_HTML.jpg)


  **图 6-9.** 工作服务生命周期的设置阶段


  工作节点超级步循环是驱动每个 Giraph 应用执行的核心过程。大多数步骤都非常易于理解，唯一值得重申的部分是分片聚合器的实现。步骤 4 和 6 是理解分片聚合器如何工作的关键。




  首先，在每个超步（superstep）期间，提供给聚合器的值会在工作节点本地进行部分聚合。这一过程不涉及任何网络 API 调用。一旦超步完成，这些来自不同工作节点的部分聚合值需要再次进行聚合，最终值必须可供
  `MasterCompute.compute()` 使用。一种选择是让主节点管理所有聚合器，因为无论如何这些值最终都要汇总到主节点。可惜，如果应用程序使用了大量聚合器，这种简单的方法将无法实现扩展；它会使主节点在计算和网络通信两方面都成为瓶颈。


  Giraph 采取的方法是在集群的工作节点之间动态分片聚合器。其工作方式如下：当超步结束时，每个聚合器会被分配给一个工作节点，该工作节点负责从邻居节点接收部分聚合值。同时，它还需要将最终的聚合值推送给主节点。这样一来，主节点无需执行任何聚合操作，并且每个聚合器它始终只会收到一个最终值。当主节点接收到这些值并完成
  `MasterCompute.compute()` 的执行后，主节点将每个值仅发送给对应聚合器的所有者（即那个工作节点）。最后一步，所有者需要将这些值分发给它们的邻居节点。


  ## 协调服务


  如前所述，Giraph 并未实现协调服务。该实现来自独立的 Apache ZooKeeper 项目。尽管如此，了解其提供的 API 以及主节点和工作节点如何使用它们仍然非常重要。Giraph
  放入 ZooKeeper 的大部分数据都是永久性的，因此了解 Giraph 如何外部化其状态的细节，对于调试失败的应用程序来说是一个极具价值的工具。如果你想更轻松地观察和诊断正在运行的
  Giraph 应用程序，请使用外部 ZooKeeper 集合（通过设置 `giraph.zkList` 属性）运行它们，而不是依赖 Giraph 按需启动协调服务。通过使用外部
  ZooKeeper 集合运行，你可以随时检查协调服务的内部状态（进而了解 Giraph 应用程序的内部状态），而不仅仅是在应用程序运行期间。


  ZooKeeper 的一个关键特性是其提供的高可用性服务。其实现方式要求 ZooKeeper 集合中的所有节点都知道集合内其他每个节点的网络地址（主机名和端口）。这样，它们就能尽最大努力在尽可能多的节点之间同步公共状态。ZooKeeper
  客户端（请记住，Giraph 只是一个 ZooKeeper 客户端）一次只与一个 ZooKeeper 节点通信。但即使是客户端也必须知道 ZooKeeper 集合中尽可能多节点的网络地址。毕竟，如果客户端当前正在通信的节点宕机，客户端需要知道到哪里重新连接。


  只要 Giraph 使用外部 ZooKeeper 服务，集合中所有节点的网络地址就会通过 `giraph.zkList` 属性以静态的逗号分隔列表形式传递给工作节点和主节点服务。另一方面，如果
  Giraph 需要按需启动一个协调服务，它就无法预先知道这些服务将在集群中的哪些节点上实例化。这是一个有趣的“先有鸡还是先有蛋”的问题：Giraph 需要 ZooKeeper
  来存储所有必须在不同节点上运行的服务之间共享的信息，但 ZooKeeper 节点的网络地址恰恰是需要存储在 ZooKeeper 中的那种信息。看起来 Giraph
  需要 ZooKeeper 才能引导启动 ZooKeeper。如何避免这种无限递归呢？


  Giraph 使用了所有 Giraph 服务都知道如何访问的另一种存储基础：HDFS。尽管大多数时候，HDFS 对于保存需要频繁更新的小文件来说是一个非常差的选择，但按情况断点使用还是可以的。Giraph
  正是这样使用它的。它将 ZooKeeper 集合节点的网络地址记录为 HDFS 文件的名称。存储这些文件的确切位置由 `giraph.zkManagerDirectory`
  属性设置；默认值为 `_bsp/_defaultZkManagerDir`（请注意，由于默认值使用的是相对路径而非绝对路径，因此它位于运行该作业的用户主目录下）。




  现在您已经了解了 ZooKeeper 集合的引导方式以及主服务和 Worker 服务如何作为客户端连接到它，接下来让我们看看它们使用了哪些 ZooKeeper
  客户端 API。从客户端的角度来看，ZooKeeper 提供了一个类似文件系统的分层 API，其命名空间结构化为一个节点树（树中的每个节点，包括内部节点，都称为
  `znode`），每个节点都响应一小部分 API 调用。层次结构中的每个 `znode` 可以保存一些数据，可以成为其他节点的父节点，或者与任何文件系统不同，它可以同时做到这两点。`ZooKeeper`
  专为协调而设计，通常需要在 `znode` 中存储小块数据（数据量上限为 1MB）。所有 API 都是原子性的，这意味着客户端要么接收全部数据，要么什么都收不到。当客户端创建一个
  `znode` 时，它可以选择将该 `znode` 声明为临时节点，从而保证只有当创建它的客户端连接到 ZooKeeper 时，该节点才可见。如果节点不是临时的，则被视为持久节点，需要显式调用
  `delete` 才能将其从树中移除。这两种类型的 `znode` 都可以有一个额外的属性：有序性（因此 ZooKeeper 的 `znode` 分为四类：临时、临时有序、非临时、非临时有序）。有序
  `znode` 的名称源自 `create` API 调用中提供的初始名称以及 ZooKeeper 为其分配的序列号。因此，如果多个客户端尝试使用相同的路径名创建一个有序
  `znode`，每个客户端最终都会创建一个唯一的 `znode`，并且其顺序由 ZooKeeper 服务保证。最后，客户端可以注册监视器，当其他客户端对 `znode`
  树执行某些类型的操作时，这些监视器会被触发。创建、删除和修改等事件都可以通过这种方式进行跟踪。


  ## 检查 ZooKeeper Znode 树


  默认情况下，Giraph 不提供任何工具来检查它在 ZooKeeper 服务中维护的 `znode` 树。强烈建议您单独下载并安装 Apache ZooKeeper，并使用命令行工具
  `zkCli.sh` 或 `zkCli.cmd` 来浏览文件树。您需要提供的唯一命令行参数是 `-server`。这是客户端连接的 ZooKeeper 集合节点列表，以逗号分隔。客户端启动后，其行为类似于
  `ftp` 客户端。输入 `help` 可以快速查看支持的命令概览。


  Giraph 将其所有的协调元数据和内部状态数据都保存在以 `_hadoopBsp` 为根的 `znode` 下。默认情况下，它直接创建在 ZooKeeper
  层次结构的根目录下，但您也可以通过设置 `giraph.zkBaseZNode` 属性来指示 Giraph 将其根植于某个子树。例如，将 `giraph.zkBaseZNode`
  设置为 `/giraph/examples` 将导致正在运行的 Giraph 应用程序创建如 [6-1] 所示的 `znode` 集合。


  **清单 6-1.** 使用 `zkCli.sh` 命令行工具检查正在运行的 Giraph 应用程序的 Znode 树


  ```

