  trans: '

    # 操作表达式


    我们不仅能检查表达式，还能在程序中修改或创建新的表达式。两个原始表达式——常量和符号——无法被修改，因为它们只是数据。不过，我们可以修改调用和配对列表，尽管后者并非我们通常的做法。我们在创建新函数时会用到配对列表，但通常要么创建新的配对列表来设置函数的形参，要么从另一个函数中获取参数，很少修改现有的配对列表。无论如何，配对列表和调用都可以通过对其组件进行索引来赋值。


    先解决这个问题，下面是一个修改配对列表的示例。我们可以像这样构造定义函数的表达式：


    ```

    f <- quote(function(x) 2 * x)

    f

    ## function(x) 2 * x

    ```


    这是一个“调用”类型的表达式——它调用了定义函数的 `function` 函数（试试快速念出这句话）——其第二个参数是定义函数参数的配对列表。


    ```

    f[[2]]

    ## $x

    ```


    如果我们对此配对列表中的元素进行赋值，就相当于为函数提供了默认参数。赋给它们的值必须是加引号的表达式。


    ```

    f[[2]][[1]] <- quote(2 * y)

    f

    ## function(x = 2 * y) 2 * x

    ```


    要改变函数参数的名称，就必须修改配对列表组件的名称。我们可以使用 `names<-` 函数来实现这一点。


    ```

    names(f[[2]]) <- c("a")

    f[[3]] <- quote(2 * a)

    f

    ## function(a = 2 * y) 2 * a

    ```


    在这个示例中，我们还看到了如何通过第三个组件来修改函数体。


    通过这个示例，我们已经掌握了修改调用表达式所需的一切知识。我们修改的只是调用的一个特例——对 `function` 的调用。任何其他调用都可以用相同方式修改。


    ```

    expr <- quote(2 * x + y)

    expr

    ## 2 * x + y

    expr[[1]] <- as.symbol("/")

    expr

    ## 2 * x/y

    expr[[2]][[1]] <- as.symbol("+")

    expr

    ## (2 + x)/y

    ```


    我们可以使用 `call` 函数构造新的调用对象。该函数的第一个参数是所要调用的函数，可以是符号或字符串，并且会自动被加引号。之后，您可以传入数量可变的参数，这些参数在被放入构造的表达式之前会先被求值。


    ```

    call("+", quote(2 * x), quote(y))

    ## 2 * x + y

    call("+", call("*", 2, quote(x)), quote(y))

    ## 2 * x + y

    ```


    如果您要创建的是对带有具名参数的函数的调用（而非运算符调用），也可以将这些参数提供给 `call` 函数。


    ```

    call("f", a = quote(2 * x), b = quote(y))

    ## f(a = 2 * x, b = y)

    ```


    如果您不希望参数被求值，那么务必对其加引号。`call` 函数不会为您自动完成这一步。


    ```

    z <- 2

    call("+", 2 * z, quote(y))

    ## 4 + y

    ```


    在 `rlang` 包中，还有两个用于创建调用的函数。`lang` 函数的功能与 `call` 函数类似，但您可以指定所调用函数应在其中被查找到的命名空间。`new_language`
    函数则允许您以显式的配对列表形式提供调用参数。


    ```

    library(rlang)

    lang("+", quote(2 * x), quote(y))

    ## 2 * x + y

    new_language(as.symbol("+"), pairlist(quote(2 * x), quote(y)))

    ## 2 * x + y

    ```


    如果您计划在 R 中进行大量元编程，那么 `rlang` 包值得探索。它提供了多个用于操作和创建表达式、函数以及管理环境的函数。我们将在第 8 章中进一步探讨这个包。


    如果所创建的调用是针对 `function` 的，则会有一个额外的复杂情况。这个函数需要一个配对列表作为其第二个参数，因此您必须创建这样一个对象。如果您想创建一个没有默认参数的函数，则需要创建一个在命名位置上包含“缺失”元素的列表。创建缺失参数的方法是不带参数地调用
    `substitute`，因此一个用于创建无默认参数函数参数列表的函数可以像下面这样：


    ```

    make_args_list <- function(args) {

    res <- replicate(length(args), substitute())

    names(res) <- args

    as.pairlist(res)

    }

    ```


    我们可以用它来像这样构造一个对 `function` 的调用：


    ```

    f <- call("function",

    make_args_list(c("x", "y")),

    quote(2 * x + y))

    f

    ## function(x, y) 2 * x + y

    ```


    但请记住，这只是创建函数的表达式，并非函数本身，它不会像函数那样运作。


    ```

    f(2, 3)

    ## Error in f(2, 3): could not find function "f"

    ```


    这里的错误信息看起来有点奇怪。R 并不是在抱怨 `f` 不是函数，而是说找不到函数 `f`。这是因为当您使用符号进行函数调用时，R 会去查找函数，并且不会将值
    `f` 与函数 `f` 混淆。这里我们只有一个值版本的 `f`。总之，要得到实际的函数，我们需要对该调用进行求值。


    ```

    f <- eval(f)

    f

    ## function (x, y)

    ## 2 * x + y

    f(2, 3)

    ## [1] 7

    ```


    创建函数更直接的方法是使用 `rlang` 包中的 `new_function` 函数。


    ```

    f <- new_function(make_args_list(c("x", "y")),

    quote(2 * x + y))

    f

    ## function (x, y)

    ## 2 * x + y

    f(2, 3)

    ## [1] 7

    ```


    作为最后一个示例，我们可以将前面学到的表达式创建方法与上一节中的表达式探索函数结合起来，将包含未绑定变量的表达式转换为函数。我们可以使用前面的 `collect_symbols_`
    函数收集表达式中的所有未绑定变量，然后使用 `new_function` 创建函数。


    ```

    expr_to_function <- function(expr) {

    expr <- substitute(expr)

    unbound <- collect_symbols_(expr, caller_env())

    new_function(make_args_list(unbound), expr, caller_env())

    }

    ```


    这里，我使用了 `rlang` 中的另一个函数 `caller_env`。该函数的功能与我们之前使用的 `parent.frame` 相同，但名称更具信息量。因此，我推荐使用
    `caller_env` 替代 `parent.frame`。


    在此次对 `new_function` 的调用中，我们提供了比之前使用它时更多的参数。之前我们只提供了两个参数：函数的参数及其函数体。这里，我们还提供了函数的环境。这将是函数的封闭环境。函数将在此环境中找到那些非函数局部变量或非函数参数的变量值。由于我们将调用者环境中的变量视为已绑定的，我们必须确保创建的函数也能找到它们，因此我们将函数置于同一环境中。如果此解释对您来说不清晰，那么在阅读第
    7 章（其中我们将更详细地探讨环境）之后，再回来看这个示例。理想情况下，到那时它会更清晰。


    `expr_to_function` 完全实现了我们的预期功能。它根据一个表达式创建函数，该函数的参数就是表达式中的未绑定变量。


    ```

    f <- expr_to_function(2 * x + y)

    f

    ## function (y, x)

    ## 2 * x + y

    f(x = 2, y = 3)

    ## [1] 7

    g <- expr_to_function(function(x) 2 * x + y)

    g

    ## function (y)

    ## function(x) 2 * x + y

    g(y = 3)(x = 2)

    ## [1] 7

    ```


    函数中变量的顺序取决于它们在表达式中出现的顺序，以及 `unique` 函数处理后的顺序。因此，调用生成的函数时最好使用具名参数。


    脚注 1


    `substitute` 函数会用变量在当前作用域中的值，或在作为第二个参数提供的环境中的值来替换变量，但全局环境中的变量除外。这些变量保持不变。如果您试验
    `substitute` 函数，请注意它在函数作用域内的行为与在全局作用域内的行为不同。

    '
- fmt: "# 6. Lambda Expressions\n\nWith the techniques we have seen so far, we are\
    \ now able to implement some useful domain-specific languages. In this chapter,\
    \ we examine a toy example, lambda expressions. It is perhaps not something we\
    \ would use in real-world code, as it simply gives an alternative syntax to anonymous\
    \ functions, which are already supported in R. However, it is an excellent example\
    \ of code that is potentially useful and gives us a chance to experiment with\
    \ syntax.\n\nWe will use the `rlang` package.\n\n```r\nlibrary(rlang)\n```\n\n\
    ## Anonymous functions\n\nLambda expressions are anonymous functions, in other\
    \ words, functions we have not named. We already have anonymous functions in R.\
    \ This is the default kind of functions since a function is anonymous until we\
    \ assign it to a variable. If we do not want to save a function in a variable\
    \ to get access to it later, we can just use the `function` expression to create\
    \ it where we need it. For example, to map over a vector of numbers, we could\
    \ write the following:\n\n```r\nsapply(1:4, function(x) x**2)\n## [1]  1  4  9\
    \ 16\n```\n\nThis is a toy example since vector expressions are preferable in\
    \ situations like the following, but it illustrates the point.\n\n```r\n(1:4)**2\n\
    ## [1]  1  4  9 16\n```\n\nUsing `function` expressions is verbose, so we might\
    \ want to construct an alternative syntax for anonymous functions. We can then\
    \ use it as an exercise in constructing a domain-specific language. Our goal is\
    \ to change the previous `sapply` syntax into this syntax:\n\n```r\nsapply(1:4,\
    \ x := x**2)\n```\n\nWe use the `:=` assignment operator for two reasons. One,\
    \ we can overload it, something we cannot do with `->` or `<-`. Two, it has the\
    \ lowest precedence of the operators, so the operator we create will be called\
    \ with the left- and right-hand sides before these are evaluated.\n\nTo implement\
    \ this syntax, we need to make the left-hand side of assignments into function\
    \ headers, which means pair lists of arguments. We also need to make the right-hand\
    \ side into a function body we can evaluate in the environment where we define\
    \ the lambda expression. The good news is that this only involves techniques we\
    \ have already seen. We can write a function for turning a list of arguments into\
    \ a pair list that we can use to define the formal arguments of a function like\
    \ this:\n\n```r\nmake_args_list <- function(args) {\n  res <- replicate(length(args),\
    \ substitute())\n  names(res) <- args\n  as.pairlist(res)\n}\n```\n\nFor the assignment\
    \ operator, we need to use `substitute` to avoid evaluating the two arguments.\
    \ We then use `make_args_list` to turn the left-hand side into formal arguments,\
    \ but we keep the right-hand side expression as it is. After that, we turn the\
    \ combination into a function using `new_function` from the `rlang` package. Since\
    \ we want to evaluate the new function in the scope where we define the lambda\
    \ expression, we use `caller_env` to get this environment and provide it to `new_function`.\
    \ The entire implementation is as simple as this:\n\n```r\n`:=` <- function(header,\
    \ body) {\n  header <- substitute(header)\n  body <- substitute(body)\n  args\
    \ <- make_args_list(as.character(header))\n  new_function(args, body, caller_env())\n\
    }\n```\n\nNow, we can use the new syntax as syntactic sugar for anonymous functions.\n\
    \n```r\nsapply(1:4, x := x**2)\n## [1]  1  4  9 16\n```\n\nWhat about lambda expressions\
    \ with more than one argument? We might want syntax similar to this:\n\n```r\n\
    mapply(x,y := x*y, x = 1:6, y = 1:2)\n```\n\nHowever, this is not possible since\
    \ we cannot override how R interprets commas. If we want to group some parameters,\
    \ we need to put them in a function call. We can do something like this:\n\n```r\n\
    mapply(.(x,y) := x*y, x = 1:6, y = 1:2)\n## [1]  1  4  3  8  5 12\n```\n\nWhat\
    \ happens here is that the `make_args_list` translates all the components of the\
    \ left-hand expression into function parameters. A function call object is just\
    \ like any other expression list, so in this particular example, we create a function\
    \ with three arguments, `.`, `x`, and `y`. Since `.` is not used inside the function\
    \ body, it does not matter that we do not provide it when the function is called.\
    \ However, if we reuse one of the parameter names as the function name in the\
    \ call, this happens:\n\n```r\nmapply(x(x,y) := x*y, x = 1:6, y = 1:2)\n## Error\
    \ in (function (x, x, y) : argument 1 matches multiple formal arguments\n```\n\
    \nWe can get rid of the function name in calls by removing the first element in\
    \ the list.\n\n```r\n`:=` <- function(header, body) {\n  header <- substitute(header)\n\
    \  if (is.call(header)) header <- header[-1]\n  body <- substitute(body)\n  args\
    \ <- make_args_list(as.character(header))\n  new_function(args, body, caller_env())\n\
    }\n```\n\nNow the earlier example will work.\n\n```r\nmapply(x(x,y) := x*y, x\
    \ = 1:6, y = 1:2)\n## [1]  1  4  3  8  5 12\n```\n\n## Experiments with Alternatives\
    \ to the Syntax\n\nUsing an assignment operator to define a function in this way\
    \ might not be the most obvious syntax you could choose, but we have plenty of\
    \ options for playing around with alternatives.\n\nWe could start with the functionality\
    \ that we have implemented as a single function. There is no reason to have a\
    \ special syntax if all we need is a single function, so instead, we could implement\
    \ lambda expressions like this:\n\n```r\nlambda <- function(...) {\n  spec <-\
    \ eval(substitute(alist(...)))\n  n <- length(spec)\n  args <- make_args_list(spec[-n])\n\
    \  body <- spec[[n]]\n  new_function(args, body, caller_env())\n}\n```\n\nThe\
    \ idea here is that the `lambda` function will take a list of arguments where\
    \ the last element in the list is the function body and the preceding are the\
    \ parameters of the lambda expression.\n\n```r\nsapply(1:4, lambda(x, 4 * x**2))\n\
    ## [1]  4 16 36 64\nmapply(lambda(x, y, y*x), x = 1:4, y = 4:7)\n## [1]  4 10\
    \ 18 28\n```\n\nThe `eval(substitute(alist(...)))` expression might look a little\
    \ odd if you are not used to it. What we do is take the variable number of arguments,\
    \ captured by the three dots argument, and create an expression that turns those\
    \ into a list. The function `alist`, unlike `list`, will not evaluate the expressions\
    \ but keep the arguments as they are, which is what we want in this case. The\
    \ `substitute` expression only creates the expression, so we need to evaluate\
    \ it with `eval` to get the actual list. Once we have the list, we make the first\
    \ arguments into function parameters and the last into the body of the lambda\
    \ expression and create the function.\n\nIn production code, we should add some\
    \ checks to make sure that the lambda expression parameters are symbols and not\
    \ general expressions. However, the full functionality for lambda expressions\
    \ is present in the function we have just written.\n\nOf course, the `lambda`\
    \ function does not behave like a normal function. The non-standard evaluation\
    \ (NSE) we apply to make a function out of the arguments to `lambda` is very different\
    \ from how functions normally behave, where the arguments we provide are considered\
    \ values rather than symbols and expressions. To make it clear from the syntax\
    \ that something different is happening, you could change the syntax. For example,\
    \ we could go for square brackets instead of parentheses. We can implement a version\
    \ that uses those like this:\n\n```r\nlambda <- structure(NA, class = \"lambda\"\
    )\n`[.lambda` <- function(x, ...) {\n  spec <- eval(substitute(alist(...)))\n\
    \  n <- length(spec)\n  args <- make_args_list(spec[-n])\n  body <- spec[[n]]\n\
    \  new_function(args, body, caller_env())\n}\n```\n\nWe use it like this:\n\n\
    ```r\nsapply(1:4, lambda[x, 4 * x**2])\n## [1]  4 16 36 64\nmapply(lambda[x, y,\
    \ y*x], x = 1:4, y = 4:7)\n## [1]  4 10 18 28\n```\n\nThe approach here is to\
    \ make `lambda` an object with a class we can use for defining a special case\
    \ of the subscript operator. The sole purpose of `lambda` is to dispatch the subscript\
    \ function to the right specialization, and that specialization of the subscript\
    \ operator is the one that creates the new function. The only difference is that\
    \ it takes an extra first argument, which is the `lambda` object. We do not use\
    \ it for anything, so we just ignore it."
  raw: '# 6. Lambda Expressions


    With the techniques we have seen so far, we are now able to implement some useful
    domain-specific languages. In this chapter, we examine a toy example, lambda expressions.
    It is perhaps not something we would use in real-world code, as it simply gives
    an alternative syntax to anonymous functions, which are already supported in R.
    However, it is an excellent example of code that is potentially useful and gives
    us a chance to experiment with syntax.


    We will use the `rlang` package.


    ```

    library(rlang)

    ```


    ## Anonymous functions


    Lambda expressions are Anonymous functions, in other words, functions we have
    not named. We already have anonymous functions in R. This is the default kind
    of functions since a function is anonymous until we assign it to a variable. If
    we do not want to save a function in a variable to get access to it later, we
    can just use the `function` expression to create it where we need it. For example,
    to map over a vector of numbers, we could write the following:


    ```

    sapply(1:4, function(x) x**2)

    ## [1]  1  4  9 16

    ```


    This is a toy example since vector expressions are preferable in situations like
    the following, but it illustrates the point.


    ```

    (1:4)**2

    ## [1]  1  4  9 16

    ```


    Using `function` expressions is verbose, so we might want to construct an alternative
    syntax for anonymous functions. We can then use it as an exercise in constructing
    a domain-specific language. Our goal is to change the previous `sapply` syntax
    into this syntax:


    ```

    sapply(1:4, x := x**2)

    ```


    We use the `:=` assignment operator for two reasons. One, we can overload it,
    something we cannot do with `->` or `<-`. Two, it has the lowest precedence of
    the operators, so the operator we create will be called with the left- and right-hand
    sides before these are evaluated.


    To implement this syntax, we need to make the left-hand side of assignments into
    function headers, which means pair lists of arguments. We also need to make the
    right-hand side into a function body we can evaluate in the environment where
    we define the lambda expression. The good news is that this only involves techniques
    we have already seen. We can write a function for turning a list of arguments
    into a pair list that we can use to define the formal arguments of a function
    like this:


    ```

    make_args_list <- function(args) {

    res <- replicate(length(args), substitute())

    names(res) <- args

    as.pairlist(res)

    }

    ```


    For the assignment operator, we need to use `substitute` to avoid evaluating the
    two arguments. We then use `make_args_list` to turn the left-hand side into formal
    arguments, but we keep the right-hand side expression as it is. After that, we
    turn the combination into a function using `new_function` from the `rlang` package.
    Since we want to evaluate the new function in the scope where we define the lambda
    expression, we use `caller_env` to get this environment and provide it to `new_function`
    . The entire implementation is as simple as this:


    ```

    `:=` <- function(header, body) {

    header <- substitute(header)

    body <- substitute(body)

    args <- make_args_list(as.character(header))

    new_function(args, body, caller_env())

    }

    ```


    Now, we can use the new syntax as syntactic sugar for anonymous functions.


    ```

    sapply(1:4, x := x**2)

    ## [1]  1  4  9 16

    ```


    What about lambda expressions with more than one argument? We might want syntax
    similar to this:


    ```

    mapply(x,y := x*y, x = 1:6, y = 1:2)

    ```


    However, this is not possible since we cannot override how R interprets commas.
    If we want to group some parameters, we need to put them in a function call. We
    can do something like this:


    ```

    mapply(.(x,y) := x*y, x = 1:6, y = 1:2)

    ## [1]  1  4  3  8  5 12

    ```


    What happens here is that the `make_args_list` translates all the components of
    the left-hand expression into function parameters. A function call object is just
    like any other expression list, so in this particular example, we create a function
    with three arguments, `.`, `x`, and `y`. Since `.` is not used inside the function
    body, it does not matter that we do not provide it when the function is called.
    However, if we reuse one of the parameter names as the function name in the call,
    this happens:


    ```

    mapply(x(x,y) := x*y, x = 1:6, y = 1:2)

    ## Error in (function (x, x, y) : argument 1 matches multiple formal arguments

    ```


    We can get rid of the function name in calls by removing the first element in
    the list.


    ```

    `:=` <- function(header, body) {

    header <- substitute(header)

    if (is.call(header)) header <- header[-1]

    body <- substitute(body)

    args <- make_args_list(as.character(header))

    new_function(args, body, caller_env())

    }

    ```


    Now the earlier example will work.


    ```

    mapply(x(x,y) := x*y, x = 1:6, y = 1:2)

    ## [1]  1  4  3  8  5 12

    ```


    ## Experiments with Alternatives to the Syntax


    Using an assignment operator to define a function in this way might not be the
    most obvious syntax you could choose, but we have plenty of options for playing
    around with alternatives.


    We could start with the functionality that we have implemented as a single function.
    There is no reason to have a special syntax if all we need is a single function,
    so instead, we could implement lambda expressions like this:


    ```

    lambda <- function(...) {

    spec <- eval(substitute(alist(...)))

    n <- length(spec)

    args <- make_args_list(spec[-n])

    body <- spec[[n]]

    new_function(args, body, caller_env())

    }

    ```


    The idea here is that the `lambda` function will take a list of arguments where
    the last element in the list is the function body and the preceding are the parameters
    of the lambda expression.


    ```

    sapply(1:4, lambda(x, 4 * x**2))

    ## [1]  4 16 36 64

    mapply(lambda(x, y, y*x), x = 1:4, y = 4:7)

    ## [1]  4 10 18 28

    ```


    The `eval(substitute(alist(...)))` expression might look a little odd if you are
    not used to it. What we do is take the variable number of arguments, captured
    by the three dots argument, and create an expression that turns those into a list.
    The function `alist`, unlike `list`, will not evaluate the expressions but keep
    the arguments as they are, which is what we want in this case. The `substitute`
    expression only creates the expression, so we need to evaluate it with `eval`
    to get the actual list. Once we have the list, we make the first arguments into
    function parameters and the last into the body of the lambda expression and create
    the function.


    In production code, we should add some checks to make sure that the lambda expression
    parameters are symbols and not general expressions. However, the full functionality
    for lambda expressions is present in the function we have just written.


    Of course, the `lambda` function does not behave like a normal function. The non-standard
    evaluation (NSE) we apply to make a function out of the arguments to `lambda`
    is very different from how functions normally behave, where the arguments we provide
    are considered values rather than symbols and expressions. To make it clear from
    the syntax that something different is happening, you could change the syntax.
    For example, we could go for square brackets instead of parentheses. We can implement
    a version that uses those like this:


    ```

    lambda <- structure(NA, class = "lambda")

    `[.lambda` <- function(x, ...) {

    spec <- eval(substitute(alist(...)))

    n <- length(spec)

    args <- make_args_list(spec[-n])

    body <- spec[[n]]

    new_function(args, body, caller_env())

    }

    ```


    We use it like this:


    ```

    sapply(1:4, lambda[x, 4 * x**2])

    ## [1]  4 16 36 64

    mapply(lambda[x, y, y*x], x = 1:4, y = 4:7)

    ## [1]  4 10 18 28

    ```


    The approach here is to make `lambda` an object with a class we can use for defining
    a special case of the subscript operator. The sole purpose of `lambda` is to dispatch
    the subscript function to the right specialization, and that specialization of
    the subscript operator is the one that creates the new function. The only difference
    is that it takes an extra first argument, which is the `lambda` object. We do
    not use it for anything, so we just ignore it.'
  trans: "\n# 6. Lambda 表达式\n\n借助目前所学的技术，我们现在已经能够实现一些有用的领域特定语言。在本章中，我们将研究一个玩具示例：lambda\
    \ 表达式。它可能并非我们在实际代码中会用到的东西，因为它只是为匿名函数提供了一种替代语法，而 R 语言本身已经支持匿名函数。不过，这是一个极好的示例，展示了可能具有实用价值的代码，并让我们有机会对语法进行实验。\n\
    \n我们将使用 `rlang` 包。\n\n```r\nlibrary(rlang)\n```\n\n## 匿名函数\n\nLambda 表达式就是匿名函数，换句话说，就是我们没有命名的函数。在\
    \ R 语言中，我们已经有了匿名函数。这是函数的默认形式，因为函数在被赋值给变量之前都是匿名的。如果我们不想将函数保存到变量中以便后续访问，可以直接在需要的地方使用\
    \ `function` 表达式来创建它。例如，要遍历一个数值向量，我们可以编写如下代码：\n\n```r\nsapply(1:4, function(x)\
    \ x**2)\n## [1]  1  4  9 16\n```\n\n这是一个玩具示例，因为在类似的情况下，向量化表达式更可取，但它足以说明问题。\n\n\
    ```r\n(1:4)**2\n## [1]  1  4  9 16\n```\n\n使用 `function` 表达式比较冗长，因此我们可能想要为匿名函数构建一种替代语法。然后，我们可以将其作为构建领域特定语言的一次练习。我们的目标是将之前的\
    \ `sapply` 语法改写成这种形式：\n\n```r\nsapply(1:4, x := x**2)\n```\n\n我们使用 `:=` 赋值运算符有两个原因。其一，我们可以重载它，这是\
    \ `->` 或 `<-` 无法做到的。其二，它的运算符优先级最低，因此我们创建的运算符会在左右两侧被求值之前被调用。\n\n为了实现这种语法，我们需要将赋值运算符的左侧部分变成函数参数列表，即参数对列表。我们还需要将右侧部分变成一个函数体，以便在定义\
    \ lambda 表达式的环境中对其进行求值。好消息是，这只需要用到我们已经学过的技术。我们可以编写一个函数，将参数列表转换为可用于定义函数形式参数的参数对列表，如下所示：\n\
    \n```r\nmake_args_list <- function(args) {\n  res <- replicate(length(args), substitute())\n\
    \  names(res) <- args\n  as.pairlist(res)\n}\n```\n\n对于赋值运算符，我们需要使用 `substitute`\
    \ 来避免对两个参数进行求值。然后，我们使用 `make_args_list` 将左侧部分转换成形式参数，但保持右侧表达式不变。之后，我们使用 `rlang`\
    \ 包中的 `new_function` 将组合结果转换成一个函数。由于我们希望在定义 lambda 表达式的作用域内对该新函数进行求值，因此我们使用 `caller_env`\
    \ 来获取此环境，并将其提供给 `new_function`。整个实现过程就这么简单：\n\n```r\n`:=` <- function(header,\
    \ body) {\n  header <- substitute(header)\n  body <- substitute(body)\n  args\
    \ <- make_args_list(as.character(header))\n  new_function(args, body, caller_env())\n\
    }\n```\n\n现在，我们可以使用这种新语法作为匿名函数的语法糖。\n\n```r\nsapply(1:4, x := x**2)\n## [1]  1\
    \  4  9 16\n```\n\n那么，具有多个参数的 lambda 表达式呢？我们可能想要类似于这样的语法：\n\n```r\nmapply(x,y\
    \ := x*y, x = 1:6, y = 1:2)\n```\n\n然而，这是不可能的，因为我们无法覆盖 R 语言对逗号的解释方式。如果要对某些参数进行分组，我们需要将它们放在一个函数调用中。我们可以这样做：\n\
    \n```r\nmapply(.(x,y) := x*y, x = 1:6, y = 1:2)\n## [1]  1  4  3  8  5 12\n```\n\
    \n这里发生的是，`make_args_list` 将左侧表达式的所有组成部分都转换成了函数参数。函数调用对象就像任何其他表达式列表一样，因此在这个特定的例子中，我们创建了一个包含三个参数（`.`、`x`\
    \ 和 `y`）的函数。由于 `.` 在函数体内并未被使用，所以在调用函数时即使不提供它也没关系。然而，如果我们将其中一个参数名称作为函数名重复用于调用中，就会发生这种情况：\n\
    \n```r\nmapply(x(x,y) := x*y, x = 1:6, y = 1:2)\n## Error in (function (x, x,\
    \ y) : argument 1 matches multiple formal arguments\n```\n\n我们可以通过移除列表中的第一个元素来去掉调用中的函数名。\n\
    \n```r\n`:=` <- function(header, body) {\n  header <- substitute(header)\n  if\
    \ (is.call(header)) header <- header[-1]\n  body <- substitute(body)\n  args <-\
    \ make_args_list(as.character(header))\n  new_function(args, body, caller_env())\n\
    }\n```\n\n现在，之前的例子就能正常工作了。\n\n```r\nmapply(x(x,y) := x*y, x = 1:6, y = 1:2)\n\
    ## [1]  1  4  3  8  5 12\n```\n\n## 对替代语法的实验\n\n用这种方式使用赋值运算符来定义函数可能不是你所能选择的最直观的语法，但我们在尝试替代方案方面有很多选择。\n\
    \n我们可以从已实现为单个函数的功能开始入手。如果我们只需要一个函数，就没有必要使用特殊的语法，因此，我们可以像下面这样实现 lambda 表达式：\n\n\
    ```r\nlambda <- function(...) {\n  spec <- eval(substitute(alist(...)))\n  n <-\
    \ length(spec)\n  args <- make_args_list(spec[-n])\n  body <- spec[[n]]\n  new_function(args,\
    \ body, caller_env())\n}\n```\n\n这里的思想是，`lambda` 函数会接收一个参数列表，其中列表的最后一个元素是函数体，前面的元素则是\
    \ lambda 表达式的参数。\n\n```r\nsapply(1:4, lambda(x, 4 * x**2))\n## [1]  4 16 36 64\n\
    mapply(lambda(x, y, y*x), x = 1:4, y = 4:7)\n## [1]  4 10 18 28\n```\n\n`eval(substitute(alist(...)))`\
    \ 这个表达式如果不太熟悉的话，看起来可能会有点奇怪。我们所做的是，获取由三个点参数捕获的可变数量的参数，并创建一个将它们转换成列表的表达式。与 `list`\
    \ 不同，`alist` 函数不会对表达式进行求值，而是保持参数的原样，这恰恰是我们在这种情况下想要的。`substitute` 表达式仅创建这个表达式，因此我们需要使用\
    \ `eval` 对其进行求值才能获得实际的列表。一旦我们得到了这个列表，就将前面的参数做成函数参数，最后一个做成 lambda 表达式的函数体，然后创建这个函数。\n\
    \n在生产级代码中，我们应该添加一些检查，以确保 lambda 表达式的参数是符号而不是一般的表达式。不过，我们刚刚编写的函数已经具备了 lambda 表达式的完整功能。\n\
    \n当然，`lambda` 函数的行为并不像一个普通函数。我们为了从 `lambda` 的参数中构建出一个函数而应用的非标准求值（NSE），与函数的常规行为截然不同——在常规行为中，我们提供的参数被视为值，而不是符号和表达式。为了从语法上明确表示正在发生不同寻常的操作，你可以更改语法。例如，我们可以使用方括号来代替圆括号。我们可以像下面这样实现一个使用方括号的版本：\n\
    \n```r\nlambda <- structure(NA, class = \"lambda\")\n`[.lambda` <- function(x,\
    \ ...) {\n  spec <- eval(substitute(alist(...)))\n  n <- length(spec)\n  args\
    \ <- make_args_list(spec[-n])\n  body <- spec[[n]]\n  new_function(args, body,\
    \ caller_env())\n}\n```\n\n我们可以这样使用它：\n\n```r\nsapply(1:4, lambda[x, 4 * x**2])\n\
    ## [1]  4 16 36 64\nmapply(lambda[x, y, y*x], x = 1:4, y = 4:7)\n## [1]  4 10\
    \ 18 28\n```\n\n这里的方法是，将 `lambda` 变成一个具有特定类的对象，我们可以利用这个类来定义下标运算符的一种特殊情况。`lambda`\
    \ 的唯一目的是将下标函数分发到正确的特化版本，而下标运算符的这个特化版本就是用来创建新函数的。唯一的区别是，它多接收了一个参数，即 `lambda` 对象本身。我们并不用它做任何事情，所以直接忽略它即可。"
- fmt: "# Don’t Do This at Home\n\nImplementing syntactic sugar for lambda expressions\
    \ as we have done only saves us minimal typing compared to using function expressions.\
    \ Those familiar with function expressions should know that this will potentially\
    \ do more harm than good, but it might not be the case with our home-made syntax\
    \ for them. Consequently, I do not recommend that you construct a new syntax for\
    \ language constructions that are already implemented in R. We implemented the\
    \ lambda expressions here to illustrate how we can construct new syntax with very\
    \ little code.\n\n# 7. Environments and Expressions\n\nWe have already used environments\
    \ in a couple of examples to evaluate expressions in a different context than\
    \ where we usually evaluate them, which is known as non-standard evaluation. Many\
    \ domain-specific languages that we could implement in R will need some variety\
    \ of non-standard evaluation, but getting the evaluation to occur in the right\
    \ context can be problematic. The rules for how expressions are evaluated are\
    \ simple, while evaluation contexts, which are chains of environments, can be\
    \ complicated.\n\nWe will use the `rlang` package.\n\n```r\nlibrary(rlang)\n```\n\
    \n## Scopes and Environments\n\nR evaluates an expression in a scope that determines\
    \ which value any given variable refers to. In the standard evaluation, R uses\
    \ what is known as lexical scope. This essentially means that variables in an\
    \ expression are referring to the variables defined in the blocks around the expression.\
    \ If you write an expression at the outermost level of an R script, or in the\
    \ global environment, then variable names in the expression refer to global variables.\
    \ An expression inside a function, on the other hand, is evaluated in the scope\
    \ of a function execution, which means that variable symbols refer to local variables\
    \ or function parameters if they are defined; only if they are not defined do\
    \ they refer to global variables. A function defined inside another function will\
    \ have a nested scope — variables in an expression there will first be searched\
    \ for in the innermost function, then the surrounding function, and only if they\
    \ are not found either place, in the global environment.\n\nConsider this abstract\
    \ example:\n\n```r\nx <- 1\nf <- function(y) {\nz <- 3\nfunction() x + y + z\n\
    }\ng <- f(2)\nh <- f(3)\ng()\n## [1] 6\nh()\n## [1] 7\n```\n\nIn the example,\
    \ we define four variables in the global environment, `x`, `f`, `g`, and `h`.\
    \ In the function `f` we have one formal parameter, `y`, and one local variable,\
    \ `z`. Whenever we call `f`, a scope where `y` exists is created, and the first\
    \ statement in the function call adds `z` to this scope. The function returns\
    \ another function, a closure, that contains an expression that refers to variables\
    \ `x`, `y`, and `z`. If we call this function, which we do when we call functions\
    \ `g` and `h` that are the results of two separate calls to `f`, we will evaluate\
    \ this expression. When R evaluates the expression, it needs to find the three\
    \ variables. They are neither formal arguments nor local variables in the functions\
    \ we call (`g` and `h`), but since the functions were created inside calls to\
    \ `f`, they can see `y` and `z` in their surrounding scope. Both can find `x`\
    \ in the global environment. Since `g` and `h` are the results of separate calls\
    \ to `f`, the surrounding scope of calls to them are different instances of local\
    \ scopes of `f`.\n\nScopes are implemented through environments, and even though\
    \ the rules that guide environments and evaluation are straightforward, you have\
    \ to be careful if you start manipulating them. You can think of environments\
    \ as tables that map variables to values. Also, all environments have a parent\
    \ environment, an enclosing scope, that R will search in if a variable is not\
    \ found when it searches the first environment. Environments thus have a tree\
    \ structure that usually follows nested scopes, and that ends in a root in the\
    \ empty environment. Packages you load are put on top of this environment, and\
    \ on top of all loaded environments, we have the global environment — which is\
    \ why you can find variables defined in packages if you search in the global environment.\n\
    \nStrictly speaking, there are a few other details on how packages and environments\
    \ interact that I do not include in this view on environments, but they are not\
    \ important for the discussion here. If you are interested, you can find these\
    \ details in my other book, *Meta-programming in R* (Mailund, 2017c). For this\
    \ book, we will simply assume that everything we define at the global level or\
    \ any package is found in the global environment and consider this the root of\
    \ the environment tree.\n\nWhen we define new functions, we do not create new\
    \ environments, but we do associate the functions with one — the environment in\
    \ which we define the function. When we defined function `f` in the previous example,\
    \ it got associated with the global environment, because that is where we defined\
    \ it. We can get the environment a function is associated with using the `environment`\
    \ function.\n\n```r\nenvironment(f)\n## \n```"
