  trans: "\n# 请勿在家中尝试\n\n像我们这样为 lambda 表达式实现语法糖，与使用函数表达式相比，只是节省了少量输入。熟悉函数表达式的人应该知道，这样做可能弊大于利，但我们自制的语法可能并非如此。因此，我不建议你为\
    \ R 语言中已有的语言结构构造新语法。我们在此实现 lambda 表达式，只是为了说明如何用极少的代码构建新语法。\n\n# 7. 环境与表达式\n\n\
    在前面的几个示例中，我们已经使用环境来在不同于常规求值的上下文中求值表达式，这种做法被称为非标准求值。许多我们可能在 R 中实现的领域特定语言都需要某种非标准求值，但让求值发生在正确的上下文中可能存在问题。表达式求值的规则很简单，但求值上下文（即环境链）可能很复杂。\n\
    \n我们将使用 `rlang` 包。\n\n```r\nlibrary(rlang)\n```\n\n## 作用域与环境\n\nR 在作用域中求值表达式，该作用域决定了任何给定变量所引用的值。在标准求值中，R\
    \ 使用所谓词法作用域。这实质上意味着表达式中的变量引用的是表达式周围块中定义的变量。如果你在 R 脚本的最顶层（即全局环境）编写表达式，那么表达式中的变量名引用的是全局变量。另一方面，函数内部的表达式在函数执行的作用域中求值，这意味着变量符号引用的是局部变量或函数参数（如果它们被定义了）；只有当它们未定义时，才引用全局变量。在另一个函数内部定义的函数将具有嵌套的作用域——那里表达式中的变量将首先在最内层函数中搜索，然后是外层函数，只有当在这两处都找不到时，才在全局环境中搜索。\n\
    \n请看这个抽象示例：\n\n```r\nx <- 1\nf <- function(y) {\n  z <- 3\n  function() x + y\
    \ + z\n}\ng <- f(2)\nh <- f(3)\ng()\n## [1] 6\nh()\n## [1] 7\n```\n\n在这个示例中，我们在全局环境中定义了四个变量：`x`、`f`、`g`\
    \ 和 `h`。在函数 `f` 中，有一个形式参数 `y` 和一个局部变量 `z`。每当我们调用 `f` 时，就会创建一个 `y` 存在的作用域，并且函数调用中的第一条语句将\
    \ `z` 添加到此作用域中。该函数返回另一个函数，即一个闭包，它包含一个引用变量 `x`、`y` 和 `z` 的表达式。如果我们调用这个函数（当我们调用\
    \ `g` 和 `h` 时就会这样做，它们是两次独立调用 `f` 的结果），我们将求值这个表达式。当 R 求值这个表达式时，它需要找到这三个变量。它们既不是我们调用的函数（`g`\
    \ 和 `h`）中的形式参数，也不是局部变量，但由于这些函数是在 `f` 的调用内部创建的，它们可以在其周围作用域中看到 `y` 和 `z`。两者都可以在全局环境中找到\
    \ `x`。由于 `g` 和 `h` 是对 `f` 的独立调用的结果，因此调用它们时的周围作用域是 `f` 的局部作用域的不同实例。\n\n作用域通过环境实现，虽然指导环境和求值的规则很简单，但如果你开始操作它们就必须小心。你可以将环境视为将变量映射到值的表。此外，所有环境都有一个父环境，即封闭作用域，如果在第一个环境中找不到变量，R\
    \ 会在父环境中搜索。因此，环境具有树状结构，通常遵循嵌套作用域，并以空环境为根结束。你加载的包位于此环境之上，而在所有已加载环境之上，我们有全局环境——这就是为什么如果你在全局环境中搜索，可以找到包中定义的变量。\n\
    \n严格来说，关于包和环境如何交互，还有几个我未在此环境视图中包含的细节，但它们对于这里的讨论并不重要。如果你感兴趣，可以在我的另一本书《R 中的元编程》（Mailund,\
    \ 2017c）中找到这些细节。对于本书，我们只需假设我们在全局层或任何包中定义的所有内容都能在全局环境中找到，并将此视为环境树的根。\n\n当我们定义新函数时，我们不会创建新环境，但我们会将函数与一个环境关联起来——即我们定义该函数的环境。在之前的示例中定义函数\
    \ `f` 时，它被关联到全局环境，因为那正是我们定义它的地方。我们可以使用 `environment` 函数获取函数关联的环境。\n\n```r\nenvironment(f)\n\
    ## \n```\n"
- fmt: "由于`f`是在全局层级定义的，其执行环境为全局环境。当我们进行函数调用时，会创建一个称为**执行环境**的新环境。该环境用于存储参数和局部变量。与函数关联的环境将作为此执行环境的父环境。调用函数`f`时，我们会创建一个环境，其中包含从`y`和`z`到其值的映射，其父环境为全局环境，由此我们可以在其中找到变量`x`。在调用`f`的过程中，我们创建了一个新的（匿名）函数并将其返回。该函数也会有一个与之关联的环境，但这次环境是我们调用`f`时创建的局部环境。因此，与`g`和`h`关联的环境是两个不同的环境，因为它们是两次不同调用`f`的结果。\n\
    \n```\nenvironment(g)\n## \nenvironment(h)\n## \n```\n\n在其他函数内部定义的函数会携带创建它们的外部函数被调用时所创建的环境，即使从外部函数中返回，它们仍会保留这个闭合作用域。由于它们记住了外部作用域中的局部变量和参数，我们将此类函数称为**闭包**。\n\
    \n在图[7-1](#A465211_1_En_7_Chapter.html#Fig1)中，我绘制了一个简化的图表，展示了在调用函数`g`的示例中，哪些环境存在以及它们是如何连接的。我使用灰色背景表示环境，变量则表示为指向其所引用值的指针圆圈，而函数则由三个组件定义：形式参数、函数体以及闭合作用域——即与函数关联的环境。\n\
    \n函数`f`的闭合环境是全局环境，而`g`和`h`的闭合作用域是两次不同调用`f`的实例。这些实例或执行环境的父环境是全局环境，因为全局环境是`f`的闭合作用域。由于它们是`f`的两个不同实例，其中的变量可以指向不同的值，正如我们在变量`y`上所见。对于函数`g`，`y`指向3；而对于函数`h`，`y`指向2。在调用函数`g`时，我们为函数调用创建了一个局部环境——如图右下角所示。`g`内部没有任何局部变量，因此该环境不包含任何变量，但其父环境是创建`g`的那个`f`实例。\n\
    \n![A465211_1_En_7_Fig1_HTML.png](A465211_1_En_7_Fig1_HTML.png)\n\n图7-1 调用`g`时的环境图\n\
    \n当我们在调用`g`内部求值表达式`x + y + z`时，需要将变量映射到值。查找将从局部环境开始，然后沿着父环境链向上查找，直到找到匹配的变量。对于变量`y`和`z`，我们在`g`调用的父环境——即创建`g`的那个`f`调用实例——中找到其值。对于`x`，我们在祖父环境——即全局环境——中找到其值。\n\
    \n求值表达式的规则始终如一：我们通过搜索环境来查找变量，从求值表达式所在的直接环境开始，并沿着父环境链搜索。我们依次检查链中的每个环境，直到找到要查找的变量。由于函数与创建它们的环境关联，并且这个环境被设置为执行环境的父环境，因此我们得到了词法作用域的标准求值规则。理解R中如何求值表达式的唯一诀窍在于理解使用了哪些环境。对于函数体，就如同我刚刚解释的那样简单，但对于函数参数，还有一些额外的规则需要考虑。\n\
    \n## 默认参数、惰性求值与承诺\n\n当将数字等基本类型的值传递给函数参数时，无需进行求值，因此不会出现复杂情况。这就是为什么我们在前面的示例中不必担心参数环境的原因。然而，如果将表达式作为参数传递，则需了解它们应如何被求值。\n\
    \n在大多数情况下，R的行为表现如同表达式在函数调用前已被求值，但实际情况并非如此。如果我们将值而非表达式传递给函数，就无法像前几章那样使用`substitute`来获取表达式。在R中调用函数时，参数将引用未求值的表达式；此类表达式称为**承诺**。承诺会在首次使用参数变量时被求值，而在此之前不会——这种参数求值方法称为**惰性求值**。如果从未引用某个参数，则相应的表达式永远不会被求值，因此我们可以编写如下代码而不会引发异常：\n\
    \n```\nf <- function(x, y) x\nf(2, stop(\"error!\"))\n## [1] 2\n```\n\n我们从未在函数`f`体内引用参数`y`，因此从未对其求值。相应地，我们也从未调用`stop`来引发错误。\n\
    \n因此，由于参数可以包含表达式，我们需要一个规则来决定如何对其求值。这里，函数创建时定义的默认参数与函数调用时提供的参数之间存在差异。前者在函数调用的局部作用域中求值，而后者则在调用函数的环境中求值。\n\
    \n考虑以下函数：\n\n```\nf <- function(y, z = 2 * y) y + z\n```\n\n该函数接受两个参数：`y`和`z`。\n\
    \n```\nf(2, 1)\n## [1] 3\n```\n\n但如果只提供`y`，则`z`会被设置为`2 * y`。\n\n```\nf(2)\n##\
    \ [1] 6\n```\n\n当在函数调用中对`z`指向的承诺进行求值时——这发生在使用该变量的表达式中——会对承诺的表达式进行求值。这意味着R需要找到变量`y`。如果试图在函数定义的作用域——即全局环境——中求值表达式`2\
    \ * y`，则会收到错误，因为该作用域中没有定义`y`变量。默认参数的语义可能是：在定义函数的作用域中对其进行求值。若如此，则无法使默认参数依赖于其他参数，而这正是我们所需要的——我们希望`z`在未明确提供值时依赖于`y`。实际的语义是：承诺在函数调用环境中进行求值。当我们调用`f`时，在求值`y\
    \ + z`表达式之前，情况如图[7-2](#A465211_1_En_7_Chapter.html#Fig2)所示。这里，我将`z`的承诺绘制为作为函数参数传递的表达式，以及应在其下进行求值的环境。\n\
    \n![A465211_1_En_7_Fig2_HTML.png](A465211_1_En_7_Fig2_HTML.png)\n\n图7-2 默认参数承诺\n\
    \n当使用一个表达式作为参数调用`f`时，我们不希望在该函数调用作用域内对该表达式求值。考虑如下情况：\n\n```\ny <- 2\nf(2 * y)\n\
    ## [1] 12\n```\n\n其意图是用`2 * y`调用`f`，由于`y`是2，结果应为4。然而，如果在函数调用内部尝试对其求值，则会出现循环依赖。在函数调用内部，`y`是一个变量，如果它指向`2\
    \ * y`，那么在不清楚`y`是什么的情况下无法求值该表达式，而不知道`y`是什么又无法求值……"
  raw: "Since `f` is defined at the global level, its environment is the global environment.\
    \ When we make a function call, we create a new environment called the execution\
    \ environment . This environment is where we store parameters and local variables.\
    \ The environment associated with the function will be the parent environment\
    \ for this execution environment. When we call function `f`, we thus create an\
    \ environment where we get a mapping from `y` and `z` to their values and with\
    \ a parent environment that is the global environment, in which we can find the\
    \ variable `x`. Inside the call to `f`, we create a new (anonymous) function and\
    \ return it. This function will also have an environment associated with it, but\
    \ this time it is the local environment we created when we called `f`. Thus, the\
    \ environments associated with `g` and `h` are two different environments as they\
    \ are the result of two different calls to `f`.\n\n```\nenvironment(g)\n## \n\
    environment(h)\n## \n```\n\nFunctions defined inside other functions thus carry\
    \ along with them the environments that were created when the surrounding function\
    \ was called, and if we return them from the surrounding function, they still\
    \ carry this enclosing scope along with them. Since they remember the local variable\
    \ and parameters from the enclosing scope, we call such functions closures.\n\n\
    In Figure [7-1](#A465211_1_En_7_Chapter.html#Fig1), I have drawn a simplified\
    \ graph that shows which environments exist and how they are wired together in\
    \ the example at the point where we call function `g`. I show environments with\
    \ a gray background, variables as circles with pointers to the values the variables\
    \ refer to, and functions as the three components that define a function: the\
    \ formal parameters, the function body, and the enclosing scope—the environment\
    \ associated with the function.\n\nThe enclosing environment for function `f`\
    \ is the global environment, while the enclosing scopes of `g` and `h` are the\
    \ two different instances of calls to `f`. These instance or execution environments\
    \ have the global environment as their parents since that is the enclosing scope\
    \ of `f`. Because they are two different instances of `f`, the variables in them\
    \ can point to different values, as we see for the variable `y`. For function\
    \ `g`, `y` points to 3, while for function `h`, `y` points to 2. In a call to\
    \ function `g`, we create a local environment for the function call—shown at the\
    \ bottom right in the figure. We do not have any local variables in `g`, so this\
    \ environment does not contain any variables, but it has a parent that is the\
    \ `f` instance where we created `g`.\n\n![A465211_1_En_7_Fig1_HTML.png](A465211_1_En_7_Fig1_HTML.png)\n\
    \nFigure 7-1\n\nEnvironment graph when calling g\n\nWhen we evaluate the expression\
    \ `x + y + z` inside the call to `g`, we need to map variables to values. The\
    \ search will start in the local environment and then progress up the parent links\
    \ until it finds a matching variable. For variables `y` and `z` we find values\
    \ in the parent of the `g` call, the instance of the `f` call that created `g`.\
    \ For `x` we find the value in the grandparent, the global environment.\n\nThe\
    \ rule for evaluating expressions is always the same: we look for variables by\
    \ searching in environments, starting with the immediate environment where we\
    \ evaluate the expression and search along the chain of parent environments. We\
    \ check each environment in the chain in turn until we find the variable we are\
    \ looking for. We get the standard evaluation rules of lexical scoping because\
    \ functions get associated with the environment where they are created and since\
    \ this environment is set as the parent environment of execution environments.\
    \ The only trick to understanding how expressions are evaluated in R is to understand\
    \ which environments are used. For the body of functions, it is as simple as I\
    \ have just explained, but for function parameters, there are a few more rules\
    \ to consider.\n\n## Default Parameters, Lazy Evaluation, and Promises\n\nWhen\
    \ you pass primitive values such as numbers to a function parameter, there is\
    \ nothing we need to evaluate, so there are no complications. This is why we didn’t\
    \ have to worry about the environment of the arguments in the previous example.\
    \ If we pass expressions along as parameters, however, we need to know how they\
    \ should be evaluated.\n\nMost of the time, R behaves as if expressions are evaluated\
    \ before a function is called, but this not what happens. If we passed values\
    \ to functions rather than expressions, we would not be able to get the expressions\
    \ using `substitute` as we have done in previous chapters. When we call a function\
    \ in R, the parameters will refer to unevaluated expressions; such expressions\
    \ are known as promises. Promises are evaluated the first time we use a parameter\
    \ variable but not before—an approach to parameter evaluation known as lazy evaluation\
    \ . If we never refer to an argument, the corresponding expression will never\
    \ be evaluated, so we can write code such as this without raising exceptions:\n\
    \n```\nf <- function(x, y) x\nf(2, stop(\"error!\"))\n## [1] 2\n```\n\nWe never\
    \ refer to the parameter `y` inside the body of `f`, so we never evaluate it.\
    \ Consequently, we never call `stop` to raise the error.\n\nSo, since parameters\
    \ can contain expressions, we need a rule for how to evaluate them. Here, there\
    \ is a difference between default parameters, defined when the function is created,\
    \ and parameters provided when the function is called. The former is evaluated\
    \ in the local scopes of function calls, while the latter is evaluated in the\
    \ environment where the function is called.\n\nConsider this function:\n\n```\n\
    f <- function(y, z = 2 * y) y + z\n```\n\nThe function takes two parameters, `y`\
    \ and `z`.\n\n```\nf(2, 1)\n## [1] 3\n```\n\nBut if we only provide `y`, then\
    \ `z` will be set to `2 * y`.\n\n```\nf(2)\n## [1] 6\n```\n\nWhen we evaluate\
    \ the promise that `z` points to when the function is called—we do this in the\
    \ expression where we use the variable—the promise expression is evaluated. This\
    \ means that R needs to find the variable `y`. If we try to evaluate the expression\
    \ `2 * y` in the scope where the function is defined—the global environment—then\
    \ we would get an error, as there is no `y` variable defined there. The semantics\
    \ of default parameters could be such that we evaluated them in the scope where\
    \ we define a function. If so, we wouldn’t be able to make default parameters\
    \ depend on other parameters, which is what we want here—we want `z` to depend\
    \ on `y` if we do not explicitly provide a value to it. The actual semantics is\
    \ that the promise is evaluated in the function-call environment. When we call\
    \ `f`, before we evaluate the `y + z` expression, the situation is therefore as\
    \ shown in Figure [7-2](#A465211_1_En_7_Chapter.html#Fig2). Here, I have drawn\
    \ the promise for `z` as the expression passed along as the function argument\
    \ together with the environment in which it should be evaluated.\n\n![A465211_1_En_7_Fig2_HTML.png](A465211_1_En_7_Fig2_HTML.png)\n\
    \nFigure 7-2\n\nDefault parameter promise\n\nWhen we call `f` with a parameter\
    \ that is an expression, we do not want to evaluate this expression in function-call\
    \ scope. Consider this:\n\n```\ny <- 2\nf(2 * y)\n## [1] 12\n```\n\nThe intent\
    \ is to call `f` with `2 * y`, which should be `4` since `y` is 2\\. If we tried\
    \ to evaluate it inside the function call, however, we would have a circular dependency.\
    \ Inside the function call, `y` is a variable, and if it points to `2 * y`, we\
    \ cannot evaluate the expression without knowing what `y` is, which we cannot\
    \ know until we have evaluated the expression, which we cannot because we do not\
    \ know what `y` is…."
  trans: "\n由于`f`是在全局层级定义的，其执行环境为全局环境。当我们进行函数调用时，会创建一个称为**执行环境**的新环境。该环境用于存储参数和局部变量。与函数关联的环境将作为此执行环境的父环境。调用函数`f`时，我们会创建一个环境，其中包含从`y`和`z`到其值的映射，其父环境为全局环境，由此我们可以在其中找到变量`x`。在调用`f`的过程中，我们创建了一个新的（匿名）函数并将其返回。该函数也会有一个与之关联的环境，但这次环境是我们调用`f`时创建的局部环境。因此，与`g`和`h`关联的环境是两个不同的环境，因为它们是两次不同调用`f`的结果。\n\
    \n```\nenvironment(g)\n## \nenvironment(h)\n## \n```\n\n在其他函数内部定义的函数会携带创建它们的外部函数被调用时所创建的环境，即使从外部函数中返回，它们仍会保留这个闭合作用域。由于它们记住了外部作用域中的局部变量和参数，我们将此类函数称为**闭包**。\n\
    \n在图 7-1 中，我绘制了一个简化的图表，展示了在调用函数`g`的示例中，哪些环境存在以及它们是如何连接的。我使用灰色背景表示环境，变量则表示为指向其所引用值的指针圆圈，而函数则由三个组件定义：形式参数、函数体以及闭合作用域——即与函数关联的环境。\n\
    \n函数`f`的闭合环境是全局环境，而`g`和`h`的闭合作用域是两次不同调用`f`的实例。这些实例或执行环境的父环境是全局环境，因为全局环境是`f`的闭合作用域。由于它们是`f`的两个不同实例，其中的变量可以指向不同的值，正如我们在变量`y`上所见。对于函数`g`，`y`指向\
    \ 3；而对于函数`h`，`y`指向 2。在调用函数`g`时，我们为函数调用创建了一个局部环境——如图右下角所示。`g`内部没有任何局部变量，因此该环境不包含任何变量，但其父环境是创建`g`的那个`f`实例。\n\
    \n![A465211_1_En_7_Fig1_HTML.png](img/A465211_1_En_7_Fig1_HTML.png)\n\n图 7-1 调用`g`时的环境图\n\
    \n当我们在调用`g`内部求值表达式`x + y + z`时，需要将变量映射到值。查找将从局部环境开始，然后沿着父环境链向上查找，直到找到匹配的变量。对于变量`y`和`z`，我们在`g`调用的父环境——即创建`g`的那个`f`调用实例——中找到其值。对于`x`，我们在祖父环境——即全局环境——中找到其值。\n\
    \n求值表达式的规则始终如一：我们通过搜索环境来查找变量，从求值表达式所在的直接环境开始，并沿着父环境链搜索。我们依次检查链中的每个环境，直到找到要查找的变量。由于函数与创建它们的环境关联，并且这个环境被设置为执行环境的父环境，因此我们得到了词法作用域的标准求值规则。理解\
    \ R 中如何求值表达式的唯一诀窍在于理解使用了哪些环境。对于函数体，就如同我刚刚解释的那样简单，但对于函数参数，还有一些额外的规则需要考虑。\n\n##\
    \ 默认参数、惰性求值与承诺\n\n当将数字等基本类型的值传递给函数参数时，无需进行求值，因此不会出现复杂情况。这就是为什么我们在前面的示例中不必担心参数环境的原因。然而，如果将表达式作为参数传递，则需了解它们应如何被求值。\n\
    \n在大多数情况下，R 的行为表现如同表达式在函数调用前已被求值，但实际情况并非如此。如果我们将值而非表达式传递给函数，就无法像前几章那样使用`substitute`来获取表达式。在\
    \ R 中调用函数时，参数将引用未求值的表达式；此类表达式称为**承诺**。承诺会在首次使用参数变量时被求值，而在此之前不会——这种参数求值方法称为**惰性求值**。如果从未引用某个参数，则相应的表达式永远不会被求值，因此我们可以编写如下代码而不会引发异常：\n\
    \n```\nf <- function(x, y) x\nf(2, stop(\"error!\"))\n## [1] 2\n```\n\n我们从未在函数`f`体内引用参数`y`，因此从未对其求值。相应地，我们也从未调用`stop`来引发错误。\n\
    \n因此，由于参数可以包含表达式，我们需要一个规则来决定如何对其求值。这里，函数创建时定义的默认参数与函数调用时提供的参数之间存在差异。前者在函数调用的局部作用域中求值，而后者则在调用函数的环境中求值。\n\
    \n考虑以下函数：\n\n```\nf <- function(y, z = 2 * y) y + z\n```\n\n该函数接受两个参数：`y`和`z`。\n\
    \n```\nf(2, 1)\n## [1] 3\n```\n\n但如果只提供`y`，则`z`会被设置为`2 * y`。\n\n```\nf(2)\n##\
    \ [1] 6\n```\n\n当在函数调用中对`z`指向的承诺进行求值时——这发生在使用该变量的表达式中——会对承诺的表达式进行求值。这意味着 R 需要找到变量`y`。如果试图在函数定义的作用域——即全局环境——中求值表达式`2\
    \ * y`，则会收到错误，因为该作用域中没有定义`y`变量。默认参数的语义可能是：在定义函数的作用域中对其进行求值。若如此，则无法使默认参数依赖于其他参数，而这正是我们所需要的——我们希望`z`在未明确提供值时依赖于`y`。实际的语义是：承诺在函数调用环境中进行求值。当我们调用`f`时，在求值`y\
    \ + z`表达式之前，情况如图 7-2 所示。这里，我将`z`的承诺绘制为作为函数参数传递的表达式，以及应在其下进行求值的环境。\n\n![A465211_1_En_7_Fig2_HTML.png](img/A465211_1_En_7_Fig2_HTML.png)\n\
    \n图 7-2 默认参数承诺\n\n当使用一个表达式作为参数调用`f`时，我们不希望在该函数调用作用域内对该表达式求值。考虑如下情况：\n\n```\ny\
    \ <- 2\nf(2 * y)\n## [1] 12\n```\n\n其意图是用`2 * y`调用`f`，由于`y`是 2，结果应为 4。然而，如果在函数调用内部尝试对其求值，则会出现循环依赖。在函数调用内部，`y`是一个变量，如果它指向`2\
    \ * y`，那么在不清楚`y`是什么的情况下无法求值该表达式，而不知道`y`是什么又无法求值……\n"
- fmt: "当我们用表达式作为参数调用函数时，相应的`promise`会在调用函数的环境中被求值，因此在`f`内部求值`y + z`之前，状态如图[7-3](#A465211_1_En_7_Chapter.html#Fig3)所示。在函数调用的环境内部，`y`和`z`都指向`promise`，但这些`promise`关联于不同的环境。为了求值表达式`y\
    \ + z`，我们需要对两个`promise`都进行求值。要得到`y`的值，我们需要在全局作用域中求值`2 * y`，得到4；要得到`z`的值，我们需要在局部作用域中求值`2\
    \ * y`，得到8。\n\n![A465211_1_En_7_Fig3_HTML.png](A465211_1_En_7_Fig3_HTML.png)\n\
    \n图 7-3  \n使用表达式`y`调用`f`\n\n冒着把这个例子引申得有点过远的风险，让我们考虑从另一个函数中调用`f`的情况。\n\n```\ng\
    \ <- function(x) f(2 * x)\ng(2 * y)\n## [1] 24\n```\n\n在函数`f`内部求值表达式`y + z`之前，环境图的状态如图[7-4](#A465211_1_En_7_Chapter.html#Fig4)所示。弄清楚我们想要求值`y\
    \ + z`时发生了什么需要花点功夫，但完成这个练习将大大有助于理解环境。\n\n![A465211_1_En_7_Fig4_HTML.png](A465211_1_En_7_Fig4_HTML.png)\n\
    \n图 7-4  \n使用依赖于变量`y`的表达式`x`调用`g`\n\n我们尚未对`promise` `y`和`z`进行求值。由于`z`依赖于`y`，我们需要先求值`y`。为此，我们需要在调用`g`的作用域内求值表达式`2\
    \ * x`。在这里，我们需要求值`x`，而`x`是另一个`promise`：即表达式`2 * y`，它应当在全局作用域中求值（在全局作用域中，`y`指向一个与`f`实例内局部变量不同的变量）。在全局作用域中，`y`指向值2，因此我们可以直接求值`2\
    \ * y`并得到值4。这个值随后会替换调用`g`的作用域中的那个`promise`。一旦我们对某个`promise`进行了求值，该变量就指向这个值，而不再是表达式。现在这意味着我们可以在`g`调用的作用域中求值`2\
    \ * x`，得到8。因此，在`f`调用中的`y`现在指向8。这意味着我们可以求值`2 * y`得到16，并将其赋值给变量`z`。最后，我们可以求值`y +\
    \ z`得到8 + 16 = 24。\n\n总结本节，我们传递给函数的参数，如果不是基本类型的值，就会被视为需要在某个时刻进行求值的表达式。与这些表达式相关联的，是我们对其进行求值的作用域。不过还有一个注意事项，我在之前的例子中暗示过：参数只有在第一次被求值之前才被视为表达式；在那之后，它们就是这次求值的结果。\n\
    \n这种语义各有利弊——不过弊端居多。我们可以避免计算不需要的值，因为`promise`在我们引用持有它们的变量之前不会被求值。此外，我们可以让默认参数依赖于函数调用内部的某个计算，前提是在使用需要该参数的变量之前先完成这些计算。例如，我们可以根据函数内部设置的变量来定义一个默认参数。\n\
    \n```\nh <- function(x, y = 2 * w) {\nw <- 2\nx + y\n}\nh(1)\n## [1] 5\n```\n\n\
    然而，如果我们在计算所需变量之前就引用了需要该变量的`promise`，这将会失败。\n\n```\nh <- function(x, y = 2 * w)\
    \ {\nres <- x + y\nw <- 2\nres\n}\nh(1)\n## Error in h(1): object 'w' not found\n\
    ```\n\n如果`promise`依赖于我们在计算过程中更新的变量，我们必须非常小心。请注意，`promise`只会被求值一次；求值之后，原本持有该`promise`的变量现在持有求值结果，而不再是`promise`表达式。如果我们更改了`promise`中出现过的变量，并不会更新该变量现在持有的值。\n\
    \n```\nh <- function(x, y = 2 * w) {\nw <- 1\nres <- x + y\nw <- 2\nres\n}\nh(1)\n\
    ## [1] 3\n```\n\n由默认参数持有的`promise`通常不会引发问题。我们很容易追踪函数中哪些局部变量会发生变化，以及`promise`会在哪个时刻被求值。然而，参数的惰性求值与闭包结合使用时，常常是问题的来源。考虑以下函数：\n\
    \n```\nmake_adder <- function(n) function(m) n + m\n```\n\n这返回一个闭包，该闭包会将其参数`m`加上`n`。我们可以这样使用它：\n\
    \n```\nadd_1 <- make_adder(1)\nadd_2 <- make_adder(2)\nadd_1(1)\n## [1] 2\nadd_2(1)\n\
    ## [1] 3\n```\n\n这里没有问题，但现在考虑这个：\n\n```\nadders <- vector(\"list\", 3)\nfor (i\
    \ in 1:3) adders[[i]] <- make_adder(i)\n```\n\n这里的意图是创建三个加法器函数，它们分别向其参数加1、加2和加3。然而，当我们调用第一个函数时，却得到了一个令人不快的意外。\n\
    \n```\nadders[[1]](1)\n## [1] 4\n```\n\n闭包内部的表达式`n + m`直到我们调用它时才会被求值。在我们调用`adders[[1]](1)`求值函数体之前，环境图如图[7-5](#A465211_1_En_7_Chapter.html#Fig5)所示。所有三个加法器都是闭包，它们指向`make_adders`的不同实例，但这些实例中的`n`都指向一个`promise`，即表达式`i`。变量`i`位于全局环境中，而不是在闭包环境中。在我们创建完所有三个闭包之后，`i`指向数字3。为了在加法器内部求值`n\
    \ + m`，我们必须首先对`n`所指向的`promise`进行求值。我们搜索`n`，并在函数调用的父环境（闭包环境）中找到它，其中`n`指向`i`，而`i`应在全局环境中求值。我们对其进行求值，现在`n`指向3，如图[7-6](#A465211_1_En_7_Chapter.html#Fig6)所示。这就是为什么调用`adders[[1]]`并将`m`设为1会返回4而不是2的原因。\n\
    \n![A465211_1_En_7_Fig6_HTML.png](A465211_1_En_7_Fig6_HTML.png)\n\n图 7-6  \n在`adders[[1]]`中求值`n`这个`promise`之后的加法器\n\
    \n![A465211_1_En_7_Fig5_HTML.png](A465211_1_En_7_Fig5_HTML.png)\n\n图 7-5  \n在求值`adders[[1]](1)`调用的函数体之前的加法器\n\
    \n在调用这个闭包之后，变量`n`不再指向一个`promise`，而是指向值3，因此此时更改`i`不会影响这个闭包。\n\n```\ni <- 1\nadders[[1]](1)\n\
    ## [1] 4\n```\n\n然而，这会影响那些我们尚未对`promise`进行求值的闭包，因此如果在更改`i`之后调用其他闭包之一，我们就会看到更改带来的结果。\n\
    \n```\nadders[[2]](1)\n## [1] 2\n```\n\n这是一个只有在创建闭包时才可能发生的问题，但每当你创建闭包时，风险都存在。你可以在返回闭包之前显式地对`promise`进行求值来避免这个问题；这正是`force`函数的作用。\n\
    \n```\nmake_adder <- function(n) {\nforce(n)\nfunction(m) n + m\n}\nfor (i in\
    \ 1:3) adders[[i]] <- make_adder(i)\nfor (i in 1:3) print(adders[[i]](0))\n##\
    \ [1] 1\n## [1] 2\n## [1] 3\n```"
  raw: 'When we call a function with an expression as an argument, the corresponding
    promise will be evaluated in the environment where we call the function, so before
    we evaluate `y + z` inside `f`, the situation is as shown in Figure [7-3](#A465211_1_En_7_Chapter.html#Fig3).
    Inside the environment of the function call, both `y` and `z` refer to promises,
    but these promises are associated with different environments. To evaluate the
    expression `y + z`, we need to evaluate both promises. To get the value for `y`,
    we need to evaluate `2 * y` in the global scope, which gives us 4, and to get
    the value for `z` we need to evaluate `2 * y` in the local scope, which gives
    us 8.


    ![A465211_1_En_7_Fig3_HTML.png](A465211_1_En_7_Fig3_HTML.png)


    Figure 7-3


    Calling f with an expression for y


    At the risk of taking the example a step too far, let’s consider the situation
    where we call `f` from another function.


    ```

    g <- function(x) f(2 * x)

    g(2 * y)

    ## [1] 24

    ```


    Before we evaluate the expression `y + z` inside function `f`, the state of the
    environment graph is as shown in Figure [7-4](#A465211_1_En_7_Chapter.html#Fig4).
    It takes a little effort to see what happens when we want to evaluate `y + z`,
    but doing this exercise will go a long way toward understanding environments.


    ![A465211_1_En_7_Fig4_HTML.png](A465211_1_En_7_Fig4_HTML.png)


    Figure 7-4


    Calling g with an expression for x that depend on variable y


    We have not yet evaluated the promises `y` and `z`. Since `z` depends on `y`,
    we need to evaluate `y` first. To do this, we need to evaluate the expression
    `2 * x` in the scope of the call to `g`. Here, we need to evaluate `x`, which
    is another promise: the expression `2 * y` that should be evaluated in the global
    scope (where `y` refers to a different variable than the local variable inside
    the `f` instance). In the global scope, `y` refers to the value 2, so we can evaluate
    `2 * y` directly and get the value 4\. This value then replaces the promise in
    the scope of the call to `g`. Once we have evaluated a promise, the variable refers
    to the value and no longer the expression. This now means that we can evaluate
    `2 * x` in the scope of the `g` call to get 8\. So now `y` in the call to `f`
    refers to 8\. This means we can evaluate `2 * y` to get 16, which we assign the
    variable `z`. Finally, we can evaluate `y + z` to get 8 + 16 = 24.


    To summarize this section, parameters we pass to functions, if they are not primitive
    values, are considered expressions that must be evaluated at some point. Associated
    with the expressions, we have a scope in which to evaluate the them. There is
    one more caveat, though, which I hinted to in the previous example: parameters
    are considered expressions only until the first time we evaluate them. After that,
    they are the result of this evaluation.


    There are pros and cons with these semantics—though predominantly cons. We can
    avoid computing values we do not need because promises are not evaluated until
    we refer to the variable that holds them. Moreover, we can make default parameters
    that depend on some computation inside a function call as long as we do those
    computations before we use the variable that needs them. For example, we can define
    a default parameter in terms of a variable we set inside a function.


    ```

    h <- function(x, y = 2 * w) {

    w <- 2

    x + y

    }

    h(1)

    ## [1] 5

    ```


    However, this will fail if we refer to the promise that needs the variable before
    we compute it.


    ```

    h <- function(x, y = 2 * w) {

    res <- x + y

    w <- 2

    res

    }

    h(1)

    ## Error in h(1): object ''w'' not found

    ```


    We have to be careful if a promise depends on a variable that we update during
    a computation. Note that a promise is evaluated only once; after the evaluation,
    the variable that used to hold it now holds the result of the evaluation and no
    longer the promise expression. If we change variables that occurred in the promise,
    we do not update the value that the variable now holds.


    ```

    h <- function(x, y = 2 * w) {

    w <- 1

    res <- x + y

    w <- 2

    res

    }

    h(1)

    ## [1] 3

    ```


    The promises held by default parameters do not usually cause problems. It is simple
    to follow which local variables will change in the function and at what point
    the promise will be evaluated. Lazy evaluation of arguments, however, is a common
    source of problems when combined with closures. Consider this function:


    ```

    make_adder <- function(n) function(m) n + m

    ```


    This returns a closure that will add `n` to its argument, `m`. We can use it like
    this:


    ```

    add_1 <- make_adder(1)

    add_2 <- make_adder(2)

    add_1(1)

    ## [1] 2

    add_2(1)

    ## [1] 3

    ```


    No problems here, but now consider this:


    ```

    adders <- vector("list", 3)

    for (i in 1:3) adders[[i]] <- make_adder(i)

    ```


    The intent here is to create three adder functions that add 1, 2, and 3, respectively,
    to their argument. When we call the first function, though, we get an unpleasant
    surprise.


    ```

    adders[[1]](1)

    ## [1] 4

    ```


    The expression `n + m` inside the closure is not evaluated until we call it. Before
    we evaluate the body in the `adders[[1]](1)` call, the environment graph looks
    like Figure [7-5](#A465211_1_En_7_Chapter.html#Fig5). All three adders are closures
    that refer to different instances of `make_adders`, but all these instances have
    `n` refer to a promise that is the expression `i`. The variable `i` is found in
    the global environment and not in the closure environment. After we have created
    all three closures, `i` refers to the number 3\. To evaluate `n + m` inside the
    adder, we must first evaluate the promise that `n` refers to. We search for `n`
    and find it in the parent environment of the function call (the closure environment)
    where `n` refers to `i` that should be evaluated in the global environment. We
    evaluate it and now `n` refers to 3, as shown in Figure [7-6](#A465211_1_En_7_Chapter.html#Fig6).
    This is why the result of calling `adders[[1]]` with `m` set to 1 returns 4 and
    not 2.


    ![A465211_1_En_7_Fig6_HTML.png](A465211_1_En_7_Fig6_HTML.png)


    Figure 7-6


    Adders after evaluating the n promise in adders[[1]]


    ![A465211_1_En_7_Fig5_HTML.png](A465211_1_En_7_Fig5_HTML.png)


    Figure 7-5


    Adders before evaluating the body of the adders[[1]](1) call


    After we have called this closure, the variable `n` no longer refers to a promise
    but to the value 3, so changing `i` at this point will not affect the closure.


    ```

    i <- 1

    adders[[1]](1)

    ## [1] 4

    ```


    It will, however, affect the closures where we haven’t evaluated the promise yet,
    so if we call one of the other closures after changing `i`, we will see the result
    of the change.


    ```

    adders[[2]](1)

    ## [1] 2

    ```


    This is a problem that can occur only when you create closures, but every time
    you do, the risk is there. You can avoid the problem by explicitly evaluating
    promises before you return the closure; this is what the function `force` is for.


    ```

    make_adder <- function(n) {

    force(n)

    function(m) n + m

    }

    for (i in 1:3) adders[[i]] <- make_adder(i)

    for (i in 1:3) print(adders[[i]](0))

    ## [1] 1

    ## [1] 2

    ## [1] 3

    ```'
  trans: "\n当我们用表达式作为参数调用函数时，相应的`promise`会在调用函数的环境中被求值，因此在`f`内部求值`y + z`之前，状态如图 7-3\
    \ 所示。在函数调用的环境内部，`y`和`z`都指向`promise`，但这些`promise`关联于不同的环境。为了求值表达式`y + z`，我们需要对两个`promise`都进行求值。要得到`y`的值，我们需要在全局作用域中求值`2\
    \ * y`，得到 4；要得到`z`的值，我们需要在局部作用域中求值`2 * y`，得到 8。\n\n![A465211_1_En_7_Fig3_HTML.png](img/A465211_1_En_7_Fig3_HTML.png)\n\
    \n图 7-3  \n使用表达式`y`调用`f`\n\n冒着把这个例子引申得有点过远的风险，让我们考虑从另一个函数中调用`f`的情况。\n\n```\ng\
    \ <- function(x) f(2 * x)\ng(2 * y)\n## [1] 24\n```\n\n在函数`f`内部求值表达式`y + z`之前，环境图的状态如图\
    \ 7-4 所示。弄清楚我们想要求值`y + z`时发生了什么需要花点功夫，但完成这个练习将大大有助于理解环境。\n\n![A465211_1_En_7_Fig4_HTML.png](img/A465211_1_En_7_Fig4_HTML.png)\n\
    \n图 7-4  \n使用依赖于变量`y`的表达式`x`调用`g`\n\n我们尚未对`promise` `y`和`z`进行求值。由于`z`依赖于`y`，我们需要先求值`y`。为此，我们需要在调用`g`的作用域内求值表达式`2\
    \ * x`。在这里，我们需要求值`x`，而`x`是另一个`promise`：即表达式`2 * y`，它应当在全局作用域中求值（在全局作用域中，`y`指向一个与`f`实例内局部变量不同的变量）。在全局作用域中，`y`指向值\
    \ 2，因此我们可以直接求值`2 * y`并得到值 4。这个值随后会替换调用`g`的作用域中的那个`promise`。一旦我们对某个`promise`进行了求值，该变量就指向这个值，而不再是表达式。现在这意味着我们可以在`g`调用的作用域中求值`2\
    \ * x`，得到 8。因此，在`f`调用中的`y`现在指向 8。这意味着我们可以求值`2 * y`得到 16，并将其赋值给变量`z`。最后，我们可以求值`y\
    \ + z`得到 8 + 16 = 24。\n\n总结本节，我们传递给函数的参数，如果不是基本类型的值，就会被视为需要在某个时刻进行求值的表达式。与这些表达式相关联的，是我们对其进行求值的作用域。不过还有一个注意事项，我在之前的例子中暗示过：参数只有在第一次被求值之前才被视为表达式；在那之后，它们就是这次求值的结果。\n\
    \n这种语义各有利弊——不过弊端居多。我们可以避免计算不需要的值，因为`promise`在我们引用持有它们的变量之前不会被求值。此外，我们可以让默认参数依赖于函数调用内部的某个计算，前提是在使用需要该参数的变量之前先完成这些计算。例如，我们可以根据函数内部设置的变量来定义一个默认参数。\n\
    \n```\nh <- function(x, y = 2 * w) {\nw <- 2\nx + y\n}\nh(1)\n## [1] 5\n```\n\n\
    然而，如果我们在计算所需变量之前就引用了需要该变量的`promise`，这将会失败。\n\n```\nh <- function(x, y = 2 * w)\
    \ {\nres <- x + y\nw <- 2\nres\n}\nh(1)\n## Error in h(1): object 'w' not found\n\
    ```\n\n如果`promise`依赖于我们在计算过程中更新的变量，我们必须非常小心。请注意，`promise`只会被求值一次；求值之后，原本持有该`promise`的变量现在持有求值结果，而不再是`promise`表达式。如果我们更改了`promise`中出现过的变量，并不会更新该变量现在持有的值。\n\
    \n```\nh <- function(x, y = 2 * w) {\nw <- 1\nres <- x + y\nw <- 2\nres\n}\nh(1)\n\
    ## [1] 3\n```\n\n由默认参数持有的`promise`通常不会引发问题。我们很容易追踪函数中哪些局部变量会发生变化，以及`promise`会在哪个时刻被求值。然而，参数的惰性求值与闭包结合使用时，常常是问题的来源。考虑以下函数：\n\
    \n```\nmake_adder <- function(n) function(m) n + m\n```\n\n这返回一个闭包，该闭包会将其参数`m`加上`n`。我们可以这样使用它：\n\
    \n```\nadd_1 <- make_adder(1)\nadd_2 <- make_adder(2)\nadd_1(1)\n## [1] 2\nadd_2(1)\n\
    ## [1] 3\n```\n\n这里没有问题，但现在考虑这个：\n\n```\nadders <- vector(\"list\", 3)\nfor (i\
    \ in 1:3) adders[[i]] <- make_adder(i)\n```\n\n这里的意图是创建三个加法器函数，它们分别向其参数加 1、加 2\
    \ 和加 3。然而，当我们调用第一个函数时，却得到了一个令人不快的意外。\n\n```\nadders[[1]](1)\n## [1] 4\n```\n\n\
    闭包内部的表达式`n + m`直到我们调用它时才会被求值。在我们调用`adders[[1]](1)`求值函数体之前，环境图如图 7-5 所示。所有三个加法器都是闭包，它们指向`make_adders`的不同实例，但这些实例中的`n`都指向一个`promise`，即表达式`i`。变量`i`位于全局环境中，而不是在闭包环境中。在我们创建完所有三个闭包之后，`i`指向数字\
    \ 3。为了在加法器内部求值`n + m`，我们必须首先对`n`所指向的`promise`进行求值。我们搜索`n`，并在函数调用的父环境（闭包环境）中找到它，其中`n`指向`i`，而`i`应在全局环境中求值。我们对其进行求值，现在`n`指向\
    \ 3，如图 7-6 所示。这就是为什么调用`adders[[1]]`并将`m`设为 1 会返回 4 而不是 2 的原因。\n\n![A465211_1_En_7_Fig6_HTML.png](img/A465211_1_En_7_Fig6_HTML.png)\n\
    \n图 7-6  \n在`adders[[1]]`中求值`n`这个`promise`之后的加法器\n\n![A465211_1_En_7_Fig5_HTML.png](img/A465211_1_En_7_Fig5_HTML.png)\n\
    \n图 7-5  \n在求值`adders[[1]](1)`调用的函数体之前的加法器\n\n在调用这个闭包之后，变量`n`不再指向一个`promise`，而是指向值\
    \ 3，因此此时更改`i`不会影响这个闭包。\n\n```\ni <- 1\nadders[[1]](1)\n## [1] 4\n```\n\n然而，这会影响那些我们尚未对`promise`进行求值的闭包，因此如果在更改`i`之后调用其他闭包之一，我们就会看到更改带来的结果。\n\
    \n```\nadders[[2]](1)\n## [1] 2\n```\n\n这是一个只有在创建闭包时才可能发生的问题，但每当你创建闭包时，风险都存在。你可以在返回闭包之前显式地对`promise`进行求值来避免这个问题；这正是`force`函数的作用。\n\
    \n```\nmake_adder <- function(n) {\nforce(n)\nfunction(m) n + m\n}\nfor (i in\
    \ 1:3) adders[[i]] <- make_adder(i)\nfor (i in 1:3) print(adders[[i]](0))\n##\
    \ [1] 1\n## [1] 2\n## [1] 3\n```\n"
- fmt: "# Quotes and Non-standard Evaluation\n\nWhat we have seen so far in this chapter\
    \ is the standard way to evaluate expressions, but as you can probably guess,\
    \ the reason we call it the standard way is because there are alternatives to\
    \ it—non-standard evaluation. That would be any other way we could evaluate expressions.\n\
    \nNon-standard evaluation follows the same rules from looking up variables to\
    \ value mappings that standard evaluation follows. We have a chain of environments,\
    \ and we search them in turn. What makes it non-standard evaluation is that we\
    \ chain together environments in alternative ways.\n\nTo implement non-standard\
    \ evaluation, we first need an expression to evaluate—rather than the value that\
    \ is the result of evaluating one. We have already seen two ways of obtaining\
    \ such an expression: we have used `quote` to get an expression from a literal\
    \ expression, or we can use `substitute` to translate a function argument into\
    \ an expression. There are other ways to create quoted expressions—see, for example,\
    \ functions `expression` and `bquote`—and `substitute` can be used for more than\
    \ simply translating function arguments into expressions, but `quote` and `substitute`\
    \ on arguments suffice for most uses of non-standard evaluation. They both give\
    \ us a quoted expression with no environment associated with it.\n\n```\nex1 <-\
    \ quote(2 * x + y)\nex1\n## 2 * x + y\nf <- function(ex) substitute(ex)\nex2 <-\
    \ f(2 * x + y)\nex2\n## 2 * x + y\n```\n\nWhen implementing lambda expressions,\
    \ we used such expressions to create new functions.\n\n```\ng <- rlang::new_function(alist(x=,\
    \ y=), body = ex1)\ng\n## function (x, y)\n## 2 * x + y\ng(1,3)\n## [1] 5\n```\n\
    \nA more direct way to evaluate an expression is using `eval`.\n\n```\nx <- 1\n\
    y <- 3\neval(ex1)\n## [1] 5\n```\n\nWith `eval`, we will evaluate the expression\
    \ in the environment where we call `eval` by default, so previously we evaluated\
    \ `ex1` in the global environment, and in the following example we evaluate it\
    \ in the local environment of calls to function `h`.\n\n```\nh <- function(x,\
    \ y) eval(ex1)\nh\n## function(x, y) eval(ex1)\nh(1,3)\n## [1] 5\n```\n\nIf we\
    \ use the default environment in calls to `eval`, we get the standard evaluation,\
    \ but we do not have to use the default environment. We can provide an environment\
    \ to `eval`, which is the one we want it to evaluate the expression in. For example,\
    \ we can make function `h` evaluate `ex1` in the calling environment instead of\
    \ its own local environment.\n\n```\nh <- function(x, y) eval(ex1, rlang::caller_env())\n\
    x <- y <- 1\nh(4,4)\n## [1] 3\n```\n\nHere, we call `h` from the global environment\
    \ where `x` and `y` are set to 1. Even though the local variables in the call\
    \ to `h` are 4 and 4, `2 * x + y` evaluates to 3 because it is the values of `x`\
    \ and `y` in the global environment that are used.\n\nSimilarly, we can use an\
    \ alternative environment for functions we create. By default, `new_function`\
    \ will use the environment where we create the function, so for example, we can\
    \ create a function that creates a closure this way:\n\n```\nf\nf(2)(2)\n## [1]\
    \ 6\n```\n\nWe can provide an environment to `new_function`, however, to change\
    \ this behavior. Consider, for example, this function:\n\n```\ng <- function(x)\
    \ {\n  rlang::new_function(alist(y=), ex1, rlang::caller_env())\n}\ng(2)\n## function\
    \ (y)\n## 2 * x + y\ng(2)(2)\n## [1] 4\n```\n\nWhen we call `g`, we get a new\
    \ function, but this function will be evaluated in the scope where we call `g`,\
    \ not the scope inside the call to `g`. Thus, the argument `x` to `g` will not\
    \ be used when evaluating `2 * x + y`. In this example, we instead use the global\
    \ variable `x`, which we set to 1 earlier.\n\nWith `eval`, the environment parameter\
    \ doesn’t have to be an environment. You can use a `list` or a `data.frame` (which\
    \ is strictly speaking also a `list`) instead.\n\n```\neval(ex1, list(x = 4, y\
    \ = 8))\n## [1] 16\ndf <- data.frame(x = 1:4, y = 1:4)\neval(ex1, df)\n## [1]\
    \  3  6  9 12\n```\n\nEvaluating expressions in the scope of lists and data frames\
    \ is a powerful tool exploited in domain-specific languages such as `dplyr`. But\
    \ lists and data frames do not have the graph structure that environments have,\
    \ which leads us to ask: if we do not find a variable in the list or data frame,\
    \ where do we find it when we call `eval`? To answer this, `eval` takes a third\
    \ argument that determines the enclosing scope. If variables are not found in\
    \ the environment parameter, then `eval` will search in the enclosing scope parameter.\n\
    \nConsider the functions `f` and `g` defined here:\n\n```\nf <- function(expr,\
    \ data, y) eval(expr, data)\ng <- function(expr, data, y) eval(expr, data, rlang::caller_env())\n\
    ```\n\nThey both evaluate an expression in a context defined by `data`, but `f`\
    \ then uses the function call scope as the enclosing scope, while `g` uses the\
    \ calling scope as the enclosing environment in the call to `eval`. Both take\
    \ the parameter `y`, but if we use `y` in the expression we pass to the functions,\
    \ only `f` will use the parameter; `g`, on the other hand, will look for `y` in\
    \ the calling scope if it is not in `data`.\n\n```\ndf <- data.frame(x = 1:4)\n\
    y <- 1:4\nf(quote(x + y), df, y = 5:8) == 1:4 + 5:8\n## [1] TRUE TRUE TRUE TRUE\n\
    g(quote(x + y), df, y = 5:8) == 1:4 + 1:4\n## [1] TRUE TRUE TRUE TRUE\n```\n\n\
    The combination of quoted expressions and non-standard evaluation is undoubtedly\
    \ a powerful tool for creating domain-specific languages. However, it has its\
    \ pitfalls: complications on who is responsible for quoting expressions and complications\
    \ on stringing environments together correctly.\n\nLet’s consider these in turn.\
    \ Some code must be responsible for turning an expression into a quoted expression.\
    \ The simplest solution to this is to leave it up to the user to always quote\
    \ expressions that must be quoted. This would be the solution in a function like\
    \ this:\n\n```\nf <- function(expr, data) eval(expr, data, rlang::caller_env())\n\
    f(quote(u + v), data.frame(u = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\nIt is, however,\
    \ a bit cumbersome to explicitly quote every time you call such a function, and\
    \ it goes against the spirit of domain-specific languages where we want to make\
    \ new syntax for easier code writing. However, if we let the function quote the\
    \ expression using `substitute`, as in this function:\n\n```\nfq <- function(expr,\
    \ data) {\n  eval(substitute(expr), data, rlang::caller_env())\n}\nfq(u + v, data.frame(u\
    \ = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\nthen we potentially run into problems\
    \ if we want to call this function from another function. We can try just calling\
    \ `fq` with an expression.\n\n```\ng <- function(expr) fq(expr, data.frame(u =\
    \ 1:4, v = 1:4))\ng(u + v)\n## Error in eval(substitute(expr), data, rlang::caller_env()):\
    \ object 'u' not found\n```\n\nThis doesn’t work because `expr` is now considered\
    \ a promise that should be evaluated in the global scope, so inside `fq` we try\
    \ to evaluate the expression, which we cannot do because `u` and `v` are not defined.\
    \ We would be even worse off if we used an expression that we actually can evaluate\
    \ because it wouldn’t be obvious that we were evaluating it in the wrong scope\
    \ and thus on the wrong data.\n\n```\nu <- v <- 5:8\ng(u + v)\n## [1] 10 12 14\
    \ 16\n```\n\nWe could try to get the expression quoted using `substitute` inside\
    \ `g`.\n\n```\ng <- function(expr) {\n  fq(substitute(expr), data.frame(u = 1:4,\
    \ v = 1:4))\n}\ng(u + v)\n## expr\n```\n\nThis fails in a different way. The expression\
    \ that we get inside `fq` when that function calls `substitute` is the expression\
    \ the function was called with, which is `substitute(expr)`. So, it evaluates\
    \ `substitute(substitute(expr))` and gets `expr`, not `u + v`. The same would\
    \ happen if we used `quote`, in this case because `quote(expr)` doesn’t substitute\
    \ the function argument into `expr`.\n\n```\ng <- function(expr) {\n  fq(quote(expr),\
    \ data.frame(u = 1:4, v = 1:4))\n}\ng(u + v)\n## expr\n```"
  raw: "## Quotes and Non-standard Evaluation\n\nWhat we have seen so far in this\
    \ chapter is the standard way to evaluate expressions, but as you can probably\
    \ guess, the reason we call it the standard way is because there are alternatives\
    \ to it—non-standard evaluation. That would be any other way we could evaluate\
    \ expressions.\n\nNon-standard evaluation follows the same rules from looking\
    \ up variables to value mappings that standard evaluation follows. We have a chain\
    \ of environments, and we search them in turn. What makes it non-standard evaluation\
    \ is that we chain together environments in alternative ways.\n\nTo implement\
    \ non-standard evaluation, we first need an expression to evaluate—rather than\
    \ the value that is the result of evaluating one. We have already seen two ways\
    \ of obtaining such an expression: we have used `quote` to get an expression from\
    \ a literal expression, or we can use `substitute` to translate a function argument\
    \ into an expression. There are other ways to create quoted expressions—see, for\
    \ example, functions `expression` and `bquote`—and `substitute` can be used for\
    \ more than simply translating function arguments into expressions, but `quote`\
    \ and `substitute` on arguments suffice for most uses of non-standard evaluation.\
    \ They both give us a quoted expression with no environment associated with it.\n\
    \n```\nex1 <- quote(2 * x + y)\nex1\n## 2 * x + y\nf <- function(ex) substitute(ex)\n\
    ex2 <- f(2 * x + y)\nex2\n## 2 * x + y\n```\n\nWhen implementing lambda expressions,\
    \ we used such expressions to create new functions.\n\n```\ng <- rlang::new_function(alist(x=,\
    \ y=), body = ex1)\ng\n## function (x, y)\n## 2 * x + y\ng(1,3)\n## [1] 5\n```\n\
    \nA more direct way to evaluate an expression is using `eval`.\n\n```\nx <- 1\n\
    y <- 3\neval(ex1)\n## [1] 5\n```\n\nWith `eval`, we will evaluate the expression\
    \ in the environment where we call `eval` by default, so previously we evaluated\
    \ `ex1` in the global environment, and in the following example we evaluate it\
    \ in the local environment of calls to function `h`.\n\n```\nh <- function(x,\
    \ y) eval(ex1)\nh\n## function(x, y) eval(ex1)\nh(1,3)\n## [1] 5\n```\n\nIf we\
    \ use the default environment in calls to `eval`, we get the standard evaluation,\
    \ but we do not have to use the default environment. We can provide an environment\
    \ to `eval`, which is the one we want it to evaluate the expression in. For example,\
    \ we can make function `h` evaluate `ex1` in the calling environment instead of\
    \ its own local environment.\n\n```\nh <- function(x, y) eval(ex1, rlang::caller_env())\n\
    x <- y <- 1\nh(4,4)\n## [1] 3\n```\n\nHere, we call `h` from the global environment\
    \ where `x` and `y` are set to 1\\. Even though the local variables in the call\
    \ to `h` are 4 and 4, `2 * x + y` evaluates to 3 because it is the values of `x`\
    \ and `y` in the global environment that are used.\n\nSimilarly, we can use an\
    \ alternative environment for functions we create. By default, `new_function`\
    \ will use the environment where we create the function, so for example, we can\
    \ create a function that creates a closure this way:\n\n```\nf \nf(2)(2)\n## [1]\
    \ 6\n```\n\nWe can provide an environment to `new_function` , however, to change\
    \ this behavior. Consider, for example, this function:\n\n```\ng <- function(x)\
    \ {\nrlang::new_function(alist(y=), ex1, rlang::caller_env())\n}\ng(2)\n## function\
    \ (y)\n## 2 * x + y\ng(2)(2)\n## [1] 4\n```\n\nWhen we call `g`, we get a new\
    \ function, but this function will be evaluated in the scope where we call `g`,\
    \ not the scope inside the call to `g`. Thus, the argument `x` to `g` will not\
    \ be used when evaluating `2 * x + y`. In this example, we instead use the global\
    \ variable `x`, which we set to 1 earlier.\n\nWith `eval`, the environment parameter\
    \ doesn’t have to be an environment. You can use a `list` or a `data.frame` (which\
    \ is strictly speaking also a `list`) instead.\n\n```\neval(ex1, list(x = 4, y\
    \ = 8))\n## [1] 16\ndf <- data.frame(x = 1:4, y = 1:4)\neval(ex1, df)\n## [1]\
    \  3  6  9 12\n```\n\nEvaluating expressions in the scope of lists and data frames\
    \ is a powerful tool exploited in domain-specific languages such as `dplyr`. But\
    \ lists and data frames do not have the graph structure that environments have,\
    \ which leads us to ask: if we do not find a variable in the list or data frame,\
    \ where do we find it when we call `eval`? To answer this, `eval` takes a third\
    \ argument that determines the enclosing scope. If variables are not found in\
    \ the environment parameter, then `eval` will search in the enclosing scope parameter.\n\
    \nConsider the functions `f` and `g` defined here:\n\n```\nf <- function(expr,\
    \ data, y) eval(expr, data)\ng <- function(expr, data, y) eval(expr, data, rlang::caller_env())\n\
    ```\n\nThey both evaluate an expression in a context defined by `data`, but `f`\
    \ then uses the function call scope as the enclosing scope, while `g` uses the\
    \ calling scope as the enclosing environment in the call to `eval`. Both take\
    \ the parameter `y`, but if we use `y` in the expression we pass to the functions,\
    \ only `f` will use the parameter; `g`, on the other hand, will look for `y` in\
    \ the calling scope if it is not in `data`.\n\n```\ndf <- data.frame(x = 1:4)\n\
    y <- 1:4\nf(quote(x + y), df, y = 5:8) == 1:4 + 5:8\n## [1] TRUE TRUE TRUE TRUE\n\
    g(quote(x + y), df, y = 5:8) == 1:4 + 1:4\n## [1] TRUE TRUE TRUE TRUE\n```\n\n\
    The combination of quoted expressions and non-standard evaluation is undoubtedly\
    \ a powerful tool for creating domain-specific languages. However, it has its\
    \ pitfalls: complications on who is responsible for quoting expressions and complications\
    \ on stringing environments together correctly.\n\nLet’s consider these in turn.\
    \ Some code must be responsible for turning an expression into a quoted expression.\
    \ The simplest solution to this is to leave it up to the user to always quote\
    \ expressions that must be quoted. This would be the solution in a function like\
    \ this:\n\n```\nf <- function(expr, data) eval(expr, data, rlang::caller_env())\n\
    f(quote(u + v), data.frame(u = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\nIt is, however,\
    \ a bit cumbersome to explicitly quote every time you call such a function, and\
    \ it goes against the spirit of domain-specific languages where we want to make\
    \ new syntax for easier code writing. However, if we let the function quote the\
    \ expression using `substitute`, as in this function:\n\n```\nfq <- function(expr,\
    \ data) {\neval(substitute(expr), data, rlang::caller_env())\n}\nfq(u + v, data.frame(u\
    \ = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\nthen we potentially run into problems\
    \ if we want to call this function from another function. We can try just calling\
    \ `fq` with an expression.\n\n```\ng <- function(expr) fq(expr, data.frame(u =\
    \ 1:4, v = 1:4))\ng(u + v)\n## Error in eval(substitute(expr), data, rlang::caller_env()):\
    \ object 'u' not found\n```\n\nThis doesn’t work because `expr` is now considered\
    \ a promise that should be evaluated in the global scope, so inside `fq` we try\
    \ to evaluate the expression, which we cannot do because `u` and `v` are not defined.\
    \ We would be even worse off if we used an expression that we actually can evaluate\
    \ because it wouldn’t be obvious that we were evaluating it in the wrong scope\
    \ and thus on the wrong data.\n\n```\nu <- v <- 5:8\ng(u + v)\n## [1] 10 12 14\
    \ 16\n```\n\nWe could try to get the expression quoted using `substitute` inside\
    \ `g`.\n\n```\ng <- function(expr) {\nfq(substitute(expr), data.frame(u = 1:4,\
    \ v = 1:4))\n}\ng(u + v)\n## expr\n```\n\nThis fails in a different way. The expression\
    \ that we get inside `fq` when that function calls `substitute` is the expression\
    \ the function was called with, which is `substitute(expr)`. So, it evaluates\
    \ `substitute(substitute(expr))` and gets `expr`, not `u + v`. The same would\
    \ happen if we used `quote`, in this case because `quote(expr)` doesn’t substitute\
    \ the function argument into `expr`.\n\n```\ng <- function(expr) {\nfq(quote(expr),\
    \ data.frame(u = 1:4, v = 1:4))\n}\ng(u + v)\n## expr\n```"
  trans: "\n# 引号与非标准求值\n\n本章迄今为止所讨论的都是表达式的标准求值方式，但你可能已经猜到，之所以称之为标准方式，是因为存在替代方案——非标准求值。任何其他求值表达式的方式都可归为此类。\n\
    \n非标准求值在变量到值的映射查找规则上与标准求值遵循相同逻辑：我们拥有一系列环境，并依次在其中进行搜索。而使其成为非标准求值的关键在于，我们以非标准的方式将这些环境串联起来。\n\
    \n要实现非标准求值，我们首先需要获得一个待求值的表达式——而不是该表达式求值后得到的结果值。我们已见过两种获取此类表达式的方法：使用`quote`从字面表达式获取，或使用`substitute`将函数参数转换为表达式。还有其他创建带引号表达式的方法——例如，`expression`和`bquote`函数——而`substitute`的用途也不仅限于将函数参数转换为表达式，但针对参数使用`quote`和`substitute`足以应对大多数非标准求值场景。两者都为我们提供一个不带关联环境的带引号表达式。\n\
    \n```\nex1 <- quote(2 * x + y)\nex1\n## 2 * x + y\nf <- function(ex) substitute(ex)\n\
    ex2 <- f(2 * x + y)\nex2\n## 2 * x + y\n```\n\n在实现 lambda 表达式时，我们曾使用此类表达式来创建新函数。\n\
    \n```\ng <- rlang::new_function(alist(x=, y=), body = ex1)\ng\n## function (x,\
    \ y)\n## 2 * x + y\ng(1,3)\n## [1] 5\n```\n\n更直接的表达式求值方式是使用`eval`。\n\n```\nx <-\
    \ 1\ny <- 3\neval(ex1)\n## [1] 5\n```\n\n使用`eval`时，默认情况下会在调用`eval`的环境中求值表达式，因此上面的例子中我们在全局环境中求值了`ex1`，而下面的例子则在函数`h`调用的局部环境中求值。\n\
    \n```\nh <- function(x, y) eval(ex1)\nh\n## function(x, y) eval(ex1)\nh(1,3)\n\
    ## [1] 5\n```\n\n如果在调用`eval`时使用默认环境，我们得到的是标准求值方式，但我们并非必须使用默认环境。我们可以为`eval`提供一个环境，指定我们希望表达式在其中求值的环境。例如，我们可以让函数`h`在调用环境而非其自身局部环境中求值`ex1`。\n\
    \n```\nh <- function(x, y) eval(ex1, rlang::caller_env())\nx <- y <- 1\nh(4,4)\n\
    ## [1] 3\n```\n\n这里我们从全局环境调用`h`，其中`x`和`y`被赋值为 1。尽管在`h`的调用中局部变量是 4 和 4，但`2 * x\
    \ + y`求值得出 3，因为实际使用的是全局环境中`x`和`y`的值。\n\n类似地，我们可以为创建的函数使用替代环境。默认情况下，`new_function`会使用我们创建函数时的环境，例如，我们可以这样创建一个生成闭包的函数：\n\
    \n```\nf\nf(2)(2)\n## [1] 6\n```\n\n然而，我们可以为`new_function`提供一个环境来改变这种行为。请考虑以下函数：\n\
    \n```\ng <- function(x) {\n  rlang::new_function(alist(y=), ex1, rlang::caller_env())\n\
    }\ng(2)\n## function (y)\n## 2 * x + y\ng(2)(2)\n## [1] 4\n```\n\n当我们调用`g`时，会得到一个新函数，但这个函数将在调用`g`的作用域中求值，而不是在`g`内部的作用域中。因此，在求值`2\
    \ * x + y`时不会用到`g`的参数`x`。在本例中，我们转而使用的是之前赋值为 1 的全局变量`x`。\n\n对于`eval`，环境参数不一定是环境对象。你也可以使用`list`或`data.frame`（严格来说也是一种`list`）。\n\
    \n```\neval(ex1, list(x = 4, y = 8))\n## [1] 16\ndf <- data.frame(x = 1:4, y =\
    \ 1:4)\neval(ex1, df)\n## [1]  3  6  9 12\n```\n\n在列表和数据框的作用域中求值表达式是一项强大工具，被诸如`dplyr`等特定领域语言所利用。但列表和数据框不具备环境那样的图结构，这引出一个问题：如果我们在列表或数据框中找不到某个变量，调用`eval`时又该去哪里寻找？为此，`eval`接受第三个参数，该参数决定了外层作用域。如果在环境参数中找不到变量，`eval`将在外层作用域参数中搜索。\n\
    \n考虑下面定义的函数`f`和`g`：\n\n```\nf <- function(expr, data, y) eval(expr, data)\ng <-\
    \ function(expr, data, y) eval(expr, data, rlang::caller_env())\n```\n\n两者都在由`data`定义的上下文中求值表达式，但`f`使用函数调用作用域作为外层作用域，而`g`在调用`eval`时使用调用作用域作为外层环境。两者都接受参数`y`，但如果在传递给函数的表达式中使用`y`，只有`f`会使用该参数；而`g`如果未在`data`中找到，则会到调用作用域中查找`y`。\n\
    \n```\ndf <- data.frame(x = 1:4)\ny <- 1:4\nf(quote(x + y), df, y = 5:8) == 1:4\
    \ + 5:8\n## [1] TRUE TRUE TRUE TRUE\ng(quote(x + y), df, y = 5:8) == 1:4 + 1:4\n\
    ## [1] TRUE TRUE TRUE TRUE\n```\n\n带引号的表达式与非标准求值的结合无疑是创建特定领域语言的强大工具。然而，它也存在陷阱：关于谁负责对表达式加引号的复杂性，以及正确串联环境的复杂性。\n\
    \n我们逐一分析这些问题。必须由某段代码负责将表达式转换为带引号的表达式。最简单的解决方案是让用户始终负责为需要加引号的表达式手动添加引号。这将是诸如以下函数的解决方案：\n\
    \n```\nf <- function(expr, data) eval(expr, data, rlang::caller_env())\nf(quote(u\
    \ + v), data.frame(u = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\n然而，每次调用此类函数时都显式加引号略显繁琐，而且违背了特定领域语言旨在通过新语法简化代码编写的初衷。但如果让函数使用`substitute`来自动加引号，如下所示：\n\
    \n```\nfq <- function(expr, data) {\n  eval(substitute(expr), data, rlang::caller_env())\n\
    }\nfq(u + v, data.frame(u = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\n那么，当我们想从另一个函数调用此函数时，就可能遇到问题。我们可以尝试直接用一个表达式调用`fq`。\n\
    \n```\ng <- function(expr) fq(expr, data.frame(u = 1:4, v = 1:4))\ng(u + v)\n\
    ## Error in eval(substitute(expr), data, rlang::caller_env()): object 'u' not\
    \ found\n```\n\n这行不通，因为此时`expr`被视为一个应在全局作用域中求值的 promise，所以在`fq`内部我们试图求值表达式，但由于`u`和`v`未定义而无法完成。如果我们使用一个实际上能够求值的表达式，情况会更糟——因为将难以察觉我们是在错误的作用域中求值，从而使用了错误的数据。\n\
    \n```\nu <- v <- 5:8\ng(u + v)\n## [1] 10 12 14 16\n```\n\n我们可以尝试在`g`内部使用`substitute`来获取带引号的表达式。\n\
    \n```\ng <- function(expr) {\n  fq(substitute(expr), data.frame(u = 1:4, v = 1:4))\n\
    }\ng(u + v)\n## expr\n```\n\n这以另一种方式失败了。当`fq`调用`substitute`时，它得到的表达式是调用该函数时使用的参数，即`substitute(expr)`。因此，它求值了`substitute(substitute(expr))`，得到的是`expr`，而不是`u\
    \ + v`。如果使用`quote`也会发生相同情况，因为`quote(expr)`不会将函数参数代入到`expr`中。\n\n```\ng <- function(expr)\
    \ {\n  fq(quote(expr), data.frame(u = 1:4, v = 1:4))\n}\ng(u + v)\n## expr\n```\n"
- fmt: "# 排版后的 Markdown 文档\n\nThere is no good way to resolve this problem. If you\
    \ call a function that quotes an expression, you should give it a literal expression\
    \ to quote. Such functions are essentially not useful for programming—they provide\
    \ an interface to a user of your domain-specific language, but you cannot use\
    \ them to implement the language by calling them from other functions.\n\nThe\
    \ solution is to have functions that expect expressions to be quoted, like the\
    \ function `f` we wrote before `fq`, and use them when you call one function from\
    \ another.\n\n```\ng <- function(expr) {\n  f(substitute(expr), data.frame(u =\
    \ 1:4, v = 1:4))\n}\ng(u + v)\n## [1] 2 4 6 8\n```\n\nIf you want some functionality\
    \ to be available for programming—in other words, calling a function from another\
    \ function—and also as an operation in your language, then write one that expects\
    \ expressions to be quoted and another that wraps it.\n\n```\nf <- function(expr,\
    \ data) eval(expr, data, rlang::caller_env())\nfq <- function(expr, data) f(substitute(expr),\
    \ data)\nfq(u + v, data.frame(u = 1:4, v = 1:4))\n## [1] 2 4 6 8\n```\n\nThis,\
    \ however, brings us to the second pitfall—getting environments wired up correctly.\
    \ Consider these two functions:\n\n```\ng <- function(x, y, z) {\n  w <- x + y\
    \ + z\n  f(quote(w + u + v), data.frame(u = 1:4, v = 1:4))\n}\nh <- function(x,\
    \ y, z) {\n  w <- x + y + z\n  fq(w + u + v, data.frame(u = 1:4, v = 1:4))\n}\n\
    ```\n\nFunction `g` explicitly quotes the expression `w + u + v` and calls `f`;\
    \ `h` instead calls `fq` that takes care of the quoting for it. The first function\
    \ works, the second does not.\n\n```\ng(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) +\
    \ 1:4 + 1:4\n## [1] TRUE TRUE TRUE TRUE\nh(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4)\
    \ + 1:4 + 1:4\n## Error in eval(expr, data, rlang::caller_env()): object 'w' not\
    \ found\n```\n\nThis time, the problem is not quoting. Both functions attempt\
    \ to evaluate the same expression, `w + u + v`, inside function `f`. The problem\
    \ is that the variable `w` is available to `f` only when we call it from `g`.\
    \ To see why, consider the environments in play. We do not define any nested functions,\
    \ so all four functions (`f`, `fq`, `g`, and `h`) only have access to their local\
    \ environment and the global environment. The expression that `f` gets as its\
    \ argument, however, is not evaluated in `f`'s local environment but in its caller's\
    \ environment. When `f` is called directly from `g`, the caller environment is\
    \ the local environment of the `g` call, where `w` is defined. When `f` is called\
    \ from `h`, however, it is not called directly. Since `h` calls `fq` that then\
    \ calls `f`, the caller of `f` in this case is `fq`. The variable `w` is defined\
    \ in the local scope of `h`, but this is not where `f` tries to evaluate the expression;\
    \ `f` tries to evaluate the expression in the scope of `fq` where `w` is not defined.\n\
    \nIt is less obvious how we should resolve this issue. It is possible to pass\
    \ environments along with expressions as separate function parameters, but this\
    \ becomes cumbersome if we have to work with more than one expression. What we\
    \ want is to associate expressions with the environment in which we want to look\
    \ up variables we do not explicitly override, for example by getting them from\
    \ a data frame.\n\nExpressions do not carry along with them any environment, so\
    \ we cannot get there directly. Formulas, however, do. Instead of using expressions,\
    \ we can use one-sided formulas. Quoting would now involve making a formula out\
    \ of an expression. If the formula is one-sided, we can get the expression as\
    \ the second element in it, and the environment where the formula is defined is\
    \ available using the `environment` function. We can rewrite the `f` and `fq`\
    \ functions to be based on formulas.\n\n```\nff <- function(expr, data) {\n  eval(expr[[2]],\
    \ data, environment(expr))\n}\nffq <- function(expr, data) {\n  expr <- eval(substitute(~\
    \ expr))\n  environment(expr) <- rlang::caller_env()\n  ff(expr, data)\n}\n```\n\
    \nWith `ff` you need to explicitly create the formula—similar to how you had to\
    \ quote expressions in `f` explicitly—and this automatically gives you the environment\
    \ associated with the formula. With `ffq` we translate an expression into a formula\
    \ using `substitute` and explicitly set its environment to the caller environment.\
    \ We can now define `g` and `h` similar to before, except that `g` uses a formula\
    \ instead of `quote`.\n\n```\ng <- function(x, y, z) {\n  w <- x + y + z\n  ff(~\
    \ w + u + v, data.frame(u = 1:4, v = 1:4))\n}\nh <- function(x, y, z) {\n  w <-\
    \ x + y + z\n  ffq(w + u + v, data.frame(u = 1:4, v = 1:4))\n}\n```\n\nThis time,\
    \ both functions will evaluate the expressions in the right scope.\n\n```\ng(1:4,\
