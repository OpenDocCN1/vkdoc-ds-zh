- fmt: '# Expression Manipulation


    Our goal for writing this matrix DSL is to optimize evaluation of these matrix
    expressions. There are several optimizations we can consider, but R’s matrix implementation
    is reasonably efficient already. It is hard to beat if we try to replace any computations
    by our own implementations—at least as long as we implement our alternatives in
    R. Therefore, it makes sense to focus on the arithmetic rewriting of expressions.


    We can rewrite expressions recursively and use a generic function with specializations
    for the three concrete classes we have. A template (that does not do anything
    yet) would look like this:


    ```

    rearrange_matrix_expr <- function(expr) {

    UseMethod("rearrange_matrix_expr")

    }

    rearrange_matrix_expr.matrix_data <- function(expr) {

    expr

    }

    rearrange_matrix_expr.matrix_mult <- function(expr) {

    matrix_mult(rearrange_matrix_expr(expr$left),

    rearrange_matrix_expr(expr$right))

    }

    rearrange_matrix_expr.matrix_sum <- function(expr) {

    matrix_sum(rearrange_matrix_expr(expr$left),

    rearrange_matrix_expr(expr$right))

    }

    ```


    These functions traverse a matrix expression and return the same expression structure.
    We can modify the functions based on patterns of expressions, however, to start
    rearranging.


    We can make some reasonable guesses at how many operations are needed to evaluate
    an expression from these two rules: 1) multiplying an `n × k` matrix to a `k ×
    m` matrix involves `n × k × m` operations, and 2) adding two `n × m` matrices
    together involves `n × m` operations. If we can do any rewriting of an expression
    that reduces the number of operations we have to do, then we are improving the
    expression.


    There are some obvious patterns we could try to match and rewrite. For instance,
    we should always prefer `(A + B)C` over `AC + BC`. However, we can probably expect
    that the programmer writing an expression already knows this, so we will likely
    get little to gain from such obvious rewrites. Where we might get some performance
    improvements is when expressions consist of several matrices multiplied together.
    There, the order of multiplications matters for the number of operations we have
    to perform, and the optimal order depends on the dimensions of the matrices; we
    cannot merely look at the arithmetic expression and see the obvious way of setting
    parentheses to get the best performance.


    ## Optimizing Multiplication


    Before we start rewriting multiplication expressions, though, we should figure
    out how to find the optimal order of multiplication. Let’s assume that we have
    this matrix multiplication: `A[1] × A[2] × … × A[n]`. We need to set parentheses
    somewhere, say `(A[1] × A[2] × …A[i]) × (A[i+1]…× A[n])`, to select the last matrix
    multiplication. If we first multiply together, in some order, the first `i` and
    the last `n – i` matrices, the last multiplication we have to do is the product
    of those two. If the dimensions of `(A[1] × …A[i])` are `n × k` and the dimensions
    of `(A[i+1]…× A[n])` are `k × m`, then this approach will involve `n × k × m`
    operations plus how long it takes to produce the two matrices. Assuming that the
    best possible way of multiplying the first `i` matrices involves `N[1,i]` operations
    and assuming the best possible way of multiplying the last `n – i` matrices together
    involves `N[i+1,n]` operations, then the best possible solution that involves
    setting the parentheses where we just did involves `N[1,i] + N[i+1,n] + n × k
    × m` operations. Obviously, to get the best performance, we must pick the best
    `i` for setting the parentheses at the top level, so we must minimize this expression
    for `i`. Recursively, we can then solve for the sequences `1` to `i` and `i +
    1` to `n` to get the best performance.


    Put another way, the minimum number of operations we need to multiply matrices
    `A[i], A[i+1], …, A[j]` can be computed recursively as `N[i,j] = 0` when `i =
    j` and


    ![$$ {N}_{i,j}=\underset{k}{\min}\left\{{N}_{i,k}+{N}_{k+1,j}+\mathrm{nrow}\left({A}_i\right)\times
    \mathrm{ncol}\left({A}_k\right)\times \mathrm{ncol}\left({A}_j\right)\right\}
    $$](A465211_1_En_2_Chapter_Equa.gif)


    otherwise. Actually computing this recursively would involve recomputing the same
    values many times, but using dynamic programming we can compute the `N[i,j]` table
    efficiently, and from that table we can backtrack and find the optimal way of
    setting parentheses as well.


    In the following implementation, we assume that we have such a list of matrices
    as input. We then collect their dimensions in a table, `dims`, for easy access.
    Then, we simply create a table to represent the `N[i,j]` values and fill it using
    the previous equation. Once we have filled the table, we backtrack through it
    to work out the optimal way of multiplying together the matrices from `1` to `n`,
    given the dimensions, table, and matrices.


    ```

    arrange_optimal_matrix_mult <- function(matrices) {

    n <- length(matrices)

    dims <- matrix(0, nrow = n, ncol = 2)

    for (i in seq_along(matrices)) {

    dims[i,] <- dim(matrices[[i]])

    }

    N <- matrix(0, nrow = n, ncol = n)

    for (len in 2:n) {

    for (i in 1:(n - len + 1)) {

    j <- i + len - 1

    k <- i:(j - 1)

    N[i,j] <- min(dims[i,1]*dims[k,2]*dims[j,2] + N[i,k] + N[k + 1,j])

    }

    }

    # Backtrack through the table. This function will

    # be defined shortly.

    backtrack_matrix_mult(1, n, dims, N, matrices)

    }

    ```


    We use a table of matrix dimensions because it allows us to compute the minimum
    of the expression using a vector expression over `k`, something we could not do
    using the `A` list quite as easily. We loop over the length of intervals rather
    than just `i` and `j` because we need to compute the `N[i,j]` values in order
    of increasing lengths for the dynamic programming algorithm to work. If we did
    not do it in this order, we would not be guaranteed that the `N` values we use
    in the expression are filled out yet. Otherwise, though, we just implement the
    computation sketched earlier.


    The backtracking function is equally simple. We want to find the optimal way of
    multiplying matrices `i` to `j`, and we have the table that tells us what `N[i,j]`
    is. So, we should find a split point where we can get that value from the recursion.
    That is where we should set the parentheses and then solve to the left and right,
    recursively, until we get to the base case of a single matrix, which of course
    is already the result we should return.


    ```

    backtrack_matrix_mult <- function(i, j, dims, N, matrices) {

    if (i == j) {

    matrices[[i]]

    } else {

    k <- i:(j - 1)

    candidates <- dims[i,1]*dims[k,2]*dims[j,2] + N[i,k] + N[k + 1,j]

    split <- k[which(N[i,j] == candidates)][1]

    left <- backtrack_matrix_mult(i, split, dims, N, matrices)

    right <- backtrack_matrix_mult(split + 1, j, dims, N, matrices)

    matrix_mult(left, right)

    }

    }

    ```


    At each step in the backtracking function, we construct a multiplication object
    using `matrix_mult`, so we rearrange the original expression in this way.'
  raw: '## Expression Manipulation


    Our goal for writing this matrix DSL is to optimize evaluation of these matrix
    expressions. There are several optimizations we can consider, but R’s matrix implementation
    is reasonably efficient already. It is hard to beat if we try to replace any computations
    by our own implementations—at least as long as we implement our alternatives in
    R. Therefore, it makes sense to focus on the arithmetic rewriting of expressions.


    We can rewrite expressions recursively and use a generic function with specializations
    for the three concrete classes we have. A template (that does not do anything
    yet) would look like this:


    ```

    rearrange_matrix_expr <- function(expr) {

    UseMethod("rearrange_matrix_expr")

    }

    rearrange_matrix_expr.matrix_data <- function(expr) {

    expr

    }

    rearrange_matrix_expr.matrix_mult <- function(expr) {

    matrix_mult(rearrange_matrix_expr(expr$left),

    rearrange_matrix_expr(expr$right))

    }

    rearrange_matrix_expr.matrix_sum <- function(expr) {

    matrix_sum(rearrange_matrix_expr(expr$left),

    rearrange_matrix_expr(expr$right))

    }

    ```


