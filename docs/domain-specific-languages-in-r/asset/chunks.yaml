    operator—to evaluate two statements. The first updates the list `v`, and the second
    continues the recursion. It is precisely because we use tidy evaluation that this
    function works. It is essential that the assignment we do in the recursive case
    is evaluated in the environment where we write the expression. Otherwise, we would
    not be updating the correct list.


    ```

    list_to_vector  NULL,

    CONS(car, cdr) -> {

    v[[i]] % unlist

    }

    ```


    Translating a `list` to a linked list is simple enough and doesn’t use any pattern
    matching—we cannot pattern match on `list` objects after all.


    ```

    vector_to_list <- function(vec) {

    lst <- NIL

    for (i in seq_along(vec)) {

    lst <- CONS(vec[[i]], lst)

    }

    reverse_list(lst)

    }

    ```


    With these few functions, we can translate to and from vectors and work with lists.


    ```

    lst % reverse_list %>% list_to_vector

    ## [1] 5 4 3 2 1

    ```


    Extending the functionality of linked lists with additional functions, I will
    leave as an exercise to the interested reader. You can experiment to your heart’s
    desire.


    ## Search Trees


    As another example, we can implement search trees. These are trees, containing
    ordered values, that satisfy the recursive property that all elements in the left
    subtree of a search tree will have values less than the value stored at the root
    of the tree, and all elements in the right subtree of a search tree will have
    values larger than the value in the root.


    To define search trees, we try a different approach than the binary trees from
    earlier. We define an empty tree, `E`, and a tree with two subtrees, `left` and
    `right`, and a `value`.


    ```

    search_tree :=

    E | T(left : search_tree, value, right : search_tree)

    ```


    We will just implement two functions for the example, insertion and test for membership.
    For more functions on search tree, I will refer to Mailund (2017a, Chapter [6](#A465211_1_En_6_Chapter.html)).


    Both functions search recursively down the tree until they either find the value
    they want to insert or the value we want to check membership for is in the tree,
    respectively. For insertion, the base case, when it hits a leaf, is to insert
    the element there. It will create a tree, with two empty subtrees, containing
    the value. The recursive function builds a tree in the recursion by using the
    `T` constructor to create new trees in each recursive call. Thus, the tree created
    at a leaf will be put into the updated tree that the `insert` function creates.
    For the `member` function, we do not need to update the tree. If we hit a leaf,
    we know that the element is not in the tree, and we can just return `FALSE`. In
    both functions, the search checks the value in the tree they see in the recursive
    case. If the value there is greater than `x`, then the only place `x` could be
    found would be in the left subtree, so we continue the search there. If, on the
    other hand, `x` is greater than the value, then we must search in the right subtree.
    If it is neither smaller than nor greater than the value, it must be equal to
    the value. For insertion, this means we do not have to do anything, and we can
    just return the tree that already contains `x`. For the membership test , we can
    return `TRUE`.


    ```

    insert  T(E, x, E),

    T(left, val, right) -> {

    if (x  val)

    T(left, val, insert(right, x))

    else

    T(left, x, right)

    })

    }

    member  FALSE,

    T(left, val, right) -> {

    if (x  val) member(right, x)

    else TRUE

    })

    }

    ```


    We can build a tree like this:


    ```

    tree <- E

    for (i in sample(2:4))

    tree <- insert(tree, i)

    ```


    Once the tree is built, we can test membership like this:


    ```

    for (i in 1:6) {

    cat(i, “ : “, member(tree, i), “\n”)

    }

    ## 1  :  FALSE

    ## 2  :  TRUE

    ## 3  :  TRUE

    ## 4  :  TRUE

    ## 5  :  FALSE

    ## 6  :  FALSE

    ```


    The worst-case time usage for both of these functions is proportional to the depth
    of the tree, and that can be linear in the number of elements stored in the tree.
    If we keep the tree balanced, though, the time is reduced to logarithmic in the
    size of the tree. A classical data structure for keeping search trees balanced
    is so-called red-black search trees. Implementing these using pointer or reference
    manipulation in languages such as C/C++ or Java can be quite challenging, but
    in a functional language, balancing such trees is a simple matter of transforming
    trees based on local structure. See, for example, Okasaki (1999), Germane and
    Might (2014), or Mailund (2017a).


    Red-black search trees are binary search trees where each tree has a color associated,
    either red or black. We can define colors using constructors like this:


    ```

    colour :=

    R | B

    ```


    We add a color to all nonempty trees like this:


    ```

    rb_tree :=

    E | T(col : colour, left : rb_tree, value, right : rb_tree)

    ```


    Except for including the color in the pattern matching, the `member` function
    for this data structure is the same as for the plain search tree.'
