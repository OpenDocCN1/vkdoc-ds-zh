- fmt: "# Exploring Expressions\n\nAn expression is a recursive data structure, and\
    \ you can explore it as such. We can define expressions in a grammar like this:\n\
    \n```\nEXPRESSION ::= CONSTANT\n|  NAME\n|  PRIMITIVE\n|  PAIRLIST\n|  CALL EXPRESSION_LIST\n\
    EXPRESSION_LIST\n::= EXPRESSION\n|  EXPRESSION EXPRESSION_LIST\n```\n\nWe will\
    \ not expend the grammar of expressions further, but just agree that they will\
    \ be any legal R expressions. All expressions are one of the five. The first four\
    \ are terminals in the grammar, while `call` expressions are recursive; a call\
    \ is constructed from a function and its arguments, and all these are other expressions.\n\
    \nWe can explore expressions using recursive functions where the first three meta-variables,\
    \ `CONSTANT`, `NAME`, and `PRIMITIVE`, are basis cases that do not contain other\
    \ expressions, while `PAIRLIST` might and `CALL` will contain other expressions\
    \ and must be handled in recursive calls.\n\nOf the meta-variables, `CONSTANT`\
    \ refers to any literal data such as numbers or strings, `NAME` refers to any\
    \ variable name, `PRIMTIVE` refers to a function written in C as part of the implementation\
    \ of R, `PAIRLIST` refers to formal arguments in function definitions (more on\
    \ this below), and `CALL` refers to function calls. Function calls capture everything\
    \ more complicated than the first four options. Since everything in R that does\
    \ anything is considered a function call, including such statements as function\
    \ definitions and control structures, these are captured in the `CALL` case. As\
    \ we saw earlier, calls are list-like and always have at least one element. The\
    \ first element is the function that is called, and the remaining components are\
    \ the arguments to that function.\n\nTo recursively explore an expression, we\
    \ can write functions that test the four cases. Constants are recognized by the\
    \ `is.atomic` function, names by the `is.name` function, primitives by the `is.primitive`\
    \ function, pair lists by the `is.pairlist`, and calls by the `is.call` function.\
    \ A function for printing out an expression’s structure can look like this:\n\n\
    ```\nprint_expression \\n\")\nprint_expression((expr[[i]]), new_indent)\n}\ncat(indent,\
    \ \"    ]\\n\")\n} else {\nprint_expression((expr[[1]]), indent)\nnew_indent <-\
    \ paste0(\"  \", indent)\nfor (i in 2:length(expr)) {\nprint_expression(expr[[i]],\
    \ new_indent)\n}\n}\n}\n```\n\nHere, we do not explicitly test for the type of\
    \ calls; if the expression is not one of the first four cases, it must be the\
    \ fifth. There are two special cases we handle in this printing expression—source\
    \ references for function definitions and missing expressions in pair lists. We\
    \ discuss these next.\n\nWe can see the function in action by calling it on the\
    \ expression we explored earlier.\n\n```\nprint_expression(quote(2 * x + y))\n\
    ##   -  +\n##     -  *\n##       -  2\n##       -  x\n##     -  y\n```\n\nThe\
    \ pretty-printed expression shows the structure we explored explicitly in the\
    \ previous section.\n\nDeclaring a function is considered a function call—a call\
    \ to the function `function`.\n\n```\nprint_expression(quote(function(x) x))\n\
    ##   -  function\n##     -  [\n##         x  ->\n##            -  MISSING\n##\
    \        ]\n##     -  x\n##     -  srcref = function(x) x\n```\n\nFor a function\
    \ definition, we have a call object where the first argument is `function`, the\
    \ second argument is the pair list that defines the function parameters, and the\
    \ third element is the function body—another expression. There is also a fourth\
    \ element called `srcdef`, an atomic vector that captures the actual code used\
    \ to define the function. In the printing function, we just print the text representation\
    \ of the source definition, which we get by pasting the expression.\n\nThe argument\
    \ list of a function we declare is where the pair list data structure is used.\
    \ We can get the names of the formal parameters using the `names` function and\
    \ the default arguments by indexing into the pair list. Parameters without default\
    \ arguments are a special case here, and the expression they contain is an empty\
    \ string. In the printing function, we make this explicit by changing the empty\
    \ string to the string `MISSING`. If we have default arguments, then those are\
    \ represented as expressions we can explore recursively.\n\n```\nprint_expression(quote(function(x\
    \ = 2 * 2 + 4) x))\n##   -  function\n##     -  [\n##         x  ->\n##      \
    \      -  +\n##              -  *\n##                -  2\n##                -\
    \  2\n##              -  4\n##        ]\n##     -  x\n##     -  srcref = function(x\
    \ = 2 * 2 + 4) x\nprint_expression(quote(function(x, y = 2 * x) x + y))\n##  \
    \ -  function\n##     -  [\n##         x  ->\n##            -  MISSING\n##   \
    \      y  ->\n##            -  *\n##              -  2\n##              -  x\n\
    ##        ]\n##     -  +\n##       -  x\n##       -  y\n##     -  srcref = function(x,\
    \ y = 2 * x) x + y\n```\n\nThe usual case for function calls is that the first\
    \ element in the “call” list is a symbol that refers to a function, and any expression\
    \ that returns a function can be used as a function in R. This means the first\
    \ element of calls can be any expression. For example, if we define a function\
    \ and call it right after, the first element of the call object will be the function\
    \ definition.\n\n```\nexpr \n##              -  MISSING\n##          ]\n##   \
    \    -  x\n##       -  srcref = function(x) x\n##     -  2\nexpr[[1]]\n## (function(x)\
    \ x)\nexpr[[2]]\n## [1] 2\n```\n\nAs an example of doing something non-trivial\
    \ with expressions, we can write a function that collects all unbound variables\
    \ in an expression. If we recurse through an expression, we can collect all the\
    \ bound and unbound symbols. To get the unbound variables, we can keep track of\
    \ those that are bound and not collect those. Ignoring, at first, those variables\
    \ that might be bound outside of the expression itself—in the scope where we will\
    \ call the function—the variables that are bound are those that are named in a\
    \ function definition. We can identify those from the pair list that is the second\
    \ argument to calls to `function`. When recursing over expressions, we capture\
    \ those and pass them on down the recursion. Aside from that, we simply collect\
    \ the symbols. In the following implementation, I use the linked lists we saw\
    \ earlier to collect the symbols, and I translate the symbols into characters\
    \ as I collect them. I do this because I can use the character representation\
    \ of symbols to check whether a symbol exists in an environment later. I use the\
    \ `cons` function to collect symbols in a linked list.\n\n```\ncons <- function(car,\
    \ cdr) list(car = car, cdr = cdr)\ncollect_symbols_rec <- function(expr, lst,\
    \ bound) {\nif (is.symbol(expr) && expr != \"\") {\nif (as.character(expr) %in%\
    \ bound) lst\nelse cons(as.character(expr), lst)\n} else if (is.pairlist(expr))\
    \ {\nfor (i in seq_along(expr)) {\nlst <- collect_symbols_rec(expr[[i]], lst,\
    \ bound)\n}\nlst\n} else if (is.call(expr)) {\nif (expr[[1]] == as.symbol(\"function\"\
    ))\nbound <- c(names(expr[[2]]), bound)\nfor (i in 1:length(expr)) {\nlst <- collect_symbols_rec(expr[[i]],\
    \ lst, bound)\n}\nlst\n} else {\nlst\n}\n}\n```\n\nFor processing the lists, it\
    \ is easier to work with `list` than with linked-lists objects, so we need the\
    \ `lst_to_list` function from earlier as well.\n\n```\nlst_length <- function(lst)\
    \ {\nlen <- 0\nwhile (!is.null(lst)) {\nlst <- lst$cdr\nlen <- len + 1\n}\nlen\n\
    }\nlst_to_list <- function(lst) {\nv <- vector(mode = \"list\", length = lst_length(lst))\n\
    index <- 1\nwhile (!is.null(lst)) {\nv[[index]] <- lst$car\nlst <- lst$cdr\nindex\
    \ <- index + 1\n}\nv\n}\n```"
