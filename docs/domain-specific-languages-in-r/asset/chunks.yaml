    is possible, and with this function, we would dispatch on the `y` argument (and
    search for the generic function `foo`, not `bar`).


    ```

    foo("foo",2,3)

    ## default foo

    bar("foo",2,3)

    ## numeric

    bar(1,"bar",3)

    ## default foo

    ```


    Going back to the rules for dispatching, when `UseMethod` is called, it starts
    to search for functions based on their name. It will take the classes of an object
    and search those in order. If it doesn’t find any matching function, it will call
    the default, if it exists.


    So, let’s consider again `foo` where we have a numeric and a default implementation.


    ```

    x <- 1

    foo(x, 2, 3)

    ## numeric

    ```


    Here, we have created the object `x` that is numeric, so when we call `foo`, we
    match the numeric function. But we can change the class of `x` and see what happens.


    ```

    class(x) <- c("a", "b", "c")

    foo(x, 2, 3)

    ## default foo

    ```


    Now, since `x` has the classes `a`, `b`, and `c` but not `numeric`, `UseMethod`
    does not find the numeric version but hits the default one. We can, of course,
    define functions for the other classes and see what happens.


    ```

    foo.a <- function(x, y, z) cat("a\n")

    foo.b <- function(x, y, z) cat("b\n")

    foo.c <- function(x, y, z) cat("c\n")

    foo(x, 2, 3)

    ## a

    ```


    Because we now have functions for `x`’s classes, we can find them, and because
    `a` is the first class, that is the one that will be called. If we change the
    order of `x`’s classes, we call the other functions— `UseMethod` always calls
    the first it finds.


    ```

    class(x) <- c("b", "a", "c")

    foo(x, 2, 3)

    ## b

    class(x) <- c("c", "b", "a")

    foo(x, 2, 3)

    ## c

    ```


    When calling `UseMethod`, we will find and call the first matching function. The
    related `NextMethod` function can be invoked to find and call the next function
    in the chain of classes. To see it in action, we can redefine the three `a`, `b`,
    and `c foo` implementations and make them call the next function in line.


    ```

    foo.a <- function(x, y, z) {

    cat("a\n")

    NextMethod()

    }

    foo.b <- function(x, y, z) {

    cat("b\n")

    NextMethod()

    }

    foo.c <- function(x, y, z) {

    cat("c\n")

    NextMethod()

    }

    ```


    They will all call the next function in line, and since we have a default implementation
    of `foo`, the last in line will call that one. The order in which the functions
    are called depends entirely on the order of `x`’s classes.


    ```

    class(x) <- c("a", "b", "c")

    foo(x, 2, 3)

    ## a

    ## b

    ## c

    ## default foo

    class(x) <- c("b", "a", "c")

    foo(x, 2, 3)

    ## b

    ## a

    ## c

    ## default foo

    class(x) <- c("c", "b", "a")

    foo(x, 2, 3)

    ## c

    ## b

    ## a

    ## default foo

    ```


    This generic dispatch mechanism is extremely flexible, so it will require some
    discipline to ensure a robust object-oriented design. To implement domain-specific
    languages, though, we are interested in how we can use it to add operators to
    our language.'
  trans: '

    # 泛型函数


    S3 系统中的泛型函数机制是通过 `UseMethod` 和 `NextMethod` 函数实现的。要定义一个名为 `foo` 的泛型函数，你可以编写如下代码：


    ```

    foo <- function(x, y, z) UseMethod("foo")

    ```


    调用 `foo` 时会触发 `UseMethod`，它将搜索 `foo` 的具体实现。这类函数仅通过名称来识别——任何名称以 `foo.` 开头的函数都被视为
    `foo` 的实现，具体选用哪个实现取决于参数 `x` 所属的类。我们目前尚未编写任何 `foo` 的实现，因此调用该函数只会返回错误信息。


    ```

    foo(1, 2, 3)

    ## Error in UseMethod("foo"): no applicable method for ''foo'' applied to an object
    of class "c(''double'', ''numeric'')"

    ```


    不过，我们可以创建一个默认实现。泛型函数的默认实现——即当 `UseMethod` 找不到更合适的匹配实现时调用的那个——其名称以 `.default` 结尾。我们可以这样实现：


    ```

    foo.default <- function(x, y, z) {

    cat("default foo\n")

    }

    ```


    当我们用一个没有更好实现的类来调用 `foo` 时，就会执行这个函数。


    ```

    foo(1, 2, 3)

    ## default foo

    ```


    要为特定类定制泛型函数，我们只需定义名称相符的函数即可。任何以 `foo.` 开头的函数名称都可以使用，当用相应类的对象调用 `foo` 时，就会调用该函数。例如，要为
    `numeric` 类型定制 `foo`，我们可以编写：


    ```

    foo.numeric <- function(x, y, z) {

    cat("numeric\n")

    }

    ```


    现在，当 `x` 是数值类型时，将会调用以下函数。


    ```

    foo(1, 2, 3)

    ## numeric

    ```


    在继续探索如何针对用户自定义类进行泛型函数的分发之前，先快速说明一点：当我们在 `foo` 的定义中使用 `UseMethod` 时，我们传递的名称是 `foo`。这就是它搜索泛型函数实现时所依据的名称。我们也可以让它搜索其他函数。当我们定义
    `foo` 时为其指定的泛型函数名称，并非决定调用时搜索内容的关键——真正起到决定作用的是我们传给 `UseMethod` 的名称。此外，我们看到它默认根据
    `foo` 的第一个参数进行分发，但这只是默认行为。我们也可以为 `UseMethod` 指定另一个对象来执行分发。


    ```

    bar <- function(x, y, z) UseMethod("foo", y)

    ```


    我不建议这样做——这违反了 `R` 语言中的惯例——但确实可行，使用这个函数时，我们会根据 `y` 参数进行分发（并搜索泛型函数 `foo`，而非 `bar`）。


    ```

    foo("foo",2,3)

    ## default foo

    bar("foo",2,3)

    ## numeric

    bar(1,"bar",3)

    ## default foo

    ```


    回到分发规则，当 `UseMethod` 被调用时，它会根据函数名称开始搜索。它会按顺序获取对象的类并进行搜索。如果找不到任何匹配的函数，且默认实现存在，则会调用默认实现。


    那么，让我们再次审视 `foo`，假设我们已经有了数值类型和默认实现。


    ```

    x <- 1

    foo(x, 2, 3)

    ## numeric

    ```


    这里，我们创建了数值对象 `x`，因此调用 `foo` 时，会匹配到数值函数。但我们可以改变 `x` 的类，看看会发生什么。


    ```

    class(x) <- c("a", "b", "c")

    foo(x, 2, 3)

    ## default foo

    ```


    现在，由于 `x` 的类是 `a`、`b` 和 `c`，而不是 `numeric`，`UseMethod` 未能找到数值版本，因此调用了默认版本。当然，我们可以为其他类定义函数并进行观察。


    ```

    foo.a <- function(x, y, z) cat("a\n")

    foo.b <- function(x, y, z) cat("b\n")

    foo.c <- function(x, y, z) cat("c\n")

    foo(x, 2, 3)

    ## a

    ```


    因为我们现在为 `x` 的类定义了函数，所以能够找到它们，并且由于 `a` 是第一个类，因此会调用该函数。如果我们改变 `x` 的类的顺序，则会调用其他函数——`UseMethod`
    总是调用它找到的第一个函数。


    ```

    class(x) <- c("b", "a", "c")

    foo(x, 2, 3)

    ## b

    class(x) <- c("c", "b", "a")

    foo(x, 2, 3)

    ## c

    ```


    当调用 `UseMethod` 时，我们会找到并调用第一个匹配的函数。可以调用相关的 `NextMethod` 函数来查找并调用类链中的下一个函数。为了演示其效果，我们可以重新定义
    `a`、`b` 和 `c` 的三个 `foo` 实现，让它们依次调用下一个函数。


    ```

    foo.a <- function(x, y, z) {

    cat("a\n")

    NextMethod()

    }

    foo.b <- function(x, y, z) {

    cat("b\n")

    NextMethod()

    }

    foo.c <- function(x, y, z) {

    cat("c\n")

    NextMethod()

    }

    ```


    它们都会调用链中的下一个函数，由于我们有 `foo` 的默认实现，链中最后一个函数将调用默认实现。这些函数被调用的顺序完全取决于 `x` 的类的顺序。


    ```

    class(x) <- c("a", "b", "c")

    foo(x, 2, 3)

    ## a

    ## b

    ## c

    ## default foo

    class(x) <- c("b", "a", "c")

    foo(x, 2, 3)

    ## b

    ## a

    ## c

    ## default foo

    class(x) <- c("c", "b", "a")

    foo(x, 2, 3)

    ## c

    ## b

    ## a

    ## default foo

    ```


    这种泛型分发机制非常灵活，因此需要一定的纪律来确保面向对象设计的稳健性。不过，对于实现领域特定语言而言，我们更关注如何利用它为我们的语言添加运算符。

