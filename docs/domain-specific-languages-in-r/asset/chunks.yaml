  trans: '

    ## 引用与求值


    如果你写下像下面这样的表达式，R 会立即尝试对其求值：


    ```

    2 * x + y

    ```


    它会在当前作用域中查找变量 `x` 和 `y`，如果找到了，就对表达式求值；如果找不到，就会报错。当 R 完成表达式求值时，我们要么得到一个值，要么得到一个错误。如果是前者，该表达式本质上就等同于求值结果（计算时间暂且不论）。像这样的字面表达式，我们无法在程序中捕获到它——我们得到的要么是错误，要么是表达式求值后的结果。如果我们想捕获实际的表达式，就需要对其进行“引用”。如果我们将表达式包裹在函数
    `quote` 的调用中，就会阻止对表达式求值，并得到一个表示未经求值的表达式的数据结构。


    ```

    quote(2 * x + y)

    ## 2 * x + y

    ```


    这种表达式的类别是“调用”（call）。


    ```

    expr <- quote(2 * x + y)

    class(expr)

    ## [1] "call"

    ```


    之所以是调用，是因为中缀运算符本质上是函数调用的语法糖，且所有函数调用表达式都属于这种类型。对于“调用”对象，我们可以像对列表那样通过索引来获取其组成部分。第一个元素是函数名，其余元素是函数调用的参数。对于二元运算符，自然会有两个参数。


    对于这个表达式，其函数调用是加法运算：


    ```

    expr[[1]]

    ## `+`

    expr[[2]]

    ## 2 * x

    expr[[3]]

    ## y

    ```


    之所以是加法运算，是因为乘法优先级高于加法，所以该表达式等同于以下式子：


    ```

    (2 * x) + y

    ```


    这是因为乘法在表达式中的嵌套层级比加法更深。乘法的结果作为加法调用的第一个参数被访问，所以该对象中的第二个元素如下所示：


    ```

    expr[[2]][[1]]

    ## `*`

    expr[[2]][[2]]

    ## [1] 2

    expr[[2]][[3]]

    ## x

    ```


    要对一个已引用的表达式求值，我们可以使用函数 `eval`。下面的表达式：


    ```

    eval(quote(2 * x + y))

    ```


    等同于直接写出其中的字面表达式：


    ```

    2 * x + y

    ```


    `eval` 函数在表达式求值方式上提供了更大的灵活性，因为它可以修改求值的作用域，我们将在第 7 章详细讨论这一点。


    将引用表达式与函数结合会引入额外的复杂性，至少在我们想要在函数调用中处理引用时是这样。不过，我们可以将引用表达式作为参数传递给函数，如下所示：


    ```

    f <- function(expr) expr[[1]]

    f(quote(2 * x + y))

    ## `+`

    ```


    但是，如果我们想直接把字面表达式传递给函数，情况就变得更复杂了。


    ```

    f(2 * x + y)

    ## Error in f(2 * x + y): object ''x'' not found

    ```


    在函数 `f` 中，当我们返回 `expr[[1]]` 时，R 会先尝试对表达式求值，但该表达式依赖于未定义的变量 `x` 和 `y`。即使我们定义了 `x`
    和 `y`，我们得到的仍然不是一个可供操作的“调用”对象，而是表达式求值的结果。


    ```

    x <- 2

    y <- 3

    f(2 * x + y)

    ## [1] 7

    ```


    在函数内部使用 `quote` 也帮不了我们。如果我们写 `quote(expr)` ，得到的是表达式 `expr`——一个单一的符号——而不是我们传递给
    `f` 的那个参数。


    ```

    f <- function(expr) {

    expr <- quote(expr)

    expr[[1]]

    }

    f(2 * x + y)

    ## Error in expr[[1]]: object of type ''symbol'' is not subsettable

    ```


    为了将实际参数作为引用表达式获取，我们需要使用 `substitute` 函数。


    ```

    f <- function(expr) {

    expr <- substitute(expr)

    expr[[1]]

    }

    f(2 * x + y)

    ## `+`

    ```


    实现这一功能需要两个因素共同作用。首先，R 中的函数参数是惰性求值的，所以只要我们不使用 `expr` 参数，它就不会被求值。因此，即使 `x` 和 `y`
    未定义，只要不对 `f` 的参数求值，就不会报错。其次，`substitute` 不会对其参数求值，而是返回一个引用对象，其中变量会被替换为它们在当前作用域中的值。¹
    `substitute` 的参数不必是一个单一的变量名，它可以是任何表达式，该表达式会被视为已引用，随后会进行变量替换，返回值将是修改后的引用表达式。


    ```

    f <- function(expr) {

    expr <- substitute(expr + expr)

    expr

    }

    f(2 * x + y)

    ## 2 * x + y + (2 * x + y)

    ```


    另一个复杂情况出现在我们试图在函数内部对一个引用表达式求值时。你可能会认为以下两个函数是等价的，因为 `eval(quote(expr))` 应该等同于 `expr`，但它们并不等价。


    ```

    f <- function(expr) {

    expr + expr

    }

    g <- function(expr) {

    x <- substitute(expr + expr)

    eval(x)

    }

    ```


    如果我们确保 `x` 和 `y` 都已定义，那么函数 `f` 返回的是表达式值的两倍。


    ```

    x <- 2; y <- 3

    f(2 * x + y)

    ## [1] 14

    ```


    而函数 `g` 则会报错，因为 `x` 的类型不正确。


    ```

    g(2 * x + y)

    ## Error in 2 * x: non-numeric argument to binary operator

    ```


    默认情况下，`eval` 函数会在当前作用域内对表达式求值，而在函数内部，当前作用域就是该函数的求值环境。在 `g` 内部，我们将 `x` 定义为从 `substitute`
    调用得到的表达式，因此 `eval` 看到的正是这个 `x`。如果你希望 `eval` 在另一个作用域中求值表达式，则需要将环境作为第二个参数传递给它。如果你希望它在调用函数的作用域（而非函数内部作用域）中对表达式求值，可以使用
    `parent.frame` 函数来获取该作用域。


    ```

    g <- function(expr) {

    x <- substitute(expr + expr)

    eval(x, parent.frame())

    }

    g(2 * x + y)

    ## [1] 14

    ```


    我们将在第 7 章更详细地讨论环境、作用域以及表达式求值方式。在本章的剩余部分，我们将重点放在操作表达式上，而不是对它们求值。

