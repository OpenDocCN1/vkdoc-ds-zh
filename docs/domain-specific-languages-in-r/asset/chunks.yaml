    # 4. 函数、类与运算符


    严格来说，我所指的语法就是句法规则。语言学家用"语法"一词同时指形态学和句法学，其中句法学是关于词语如何组合成句的规则。但在计算机科学中，"语法"一词的用法与我此处相同。因此，我将交替使用"句法"和"语法"这两个术语。


    纯粹主义者可能会抱怨说，解析器构建的是解析树而非抽象语法树（AST）。两者的区别在于：解析树包含输入中的所有信息（如括号、空格等），但不包含关于其所代表语法结构的元信息；而抽象语法树只包含输入中的相关部分，但在此基础上还包含了语法信息。如果你愿意，可以先将解析过程视为处理输入语言的两个独立步骤：先进行解析，再将结果转换为抽象语法树。而我认为这两个步骤是同一过程的一部分，因此我主张解析器直接构建抽象语法树。


    但请注意，赋予语句含义与赋予其正确含义之间存在区别。你的程序计算出了某个结果，并不意味着它计算出了你预期的结果。当我们构建一门语言时，无论是领域特定语言还是通用语言，我们都能赋予语句含义，但我们无法——这在理论上是不可能的——保证这就是预期的含义。这始终是程序员的职责。


    运算符优先级是我们用来描述不同运算符"绑定紧密程度"的术语，即哪些运算符优先被调用，换句话说，就是在表达式中隐式设置括号的位置。乘法的绑定比加法更紧密——具有更高优先级——因此表达式
    `2*x + 4*y` 被解释为 `(2*x) + (4*y)`，而不是例如 `2*(x + (4*y))`。优先级还告诉我们运算符是从左到右求值还是从右到左求值，因此
    `x + y + z` 被求值为 `(x + y) + z` 而不是 `x + (y + z)`，因为 `+` 是从左到右求值的。对于加法，从左到右或从右到左的顺序不影响结果，但对于某些运算符则不然，例如乘方，它是从左到右求值的。所以，`x**y**z`
    是 `x**(y**z)`，这（通常）不同于 `(x**y)**z`。如果你在领域特定语言中使用运算符，那么运算符的优先级会影响你的语言。


    我们尚未正式定义如何在用于指定语法的句法规则中指定非文字标记，而这样做也不会让示例更清晰，所以我们就非正式地说明一下。


    如果你不熟悉连续时间马尔可夫链，可以用非正式的方式这样描述：连续时间马尔可夫链是一个图，其中节点代表状态，边代表状态之间的转移，每条边上标注着变化发生的速率。该模型是随机的，因此速率应被视为随时间变化的期望值。如果状态
    `s` 和 `t` 之间速率为 1，那么每个时间单位，我们预期会看到一次从 `s` 到 `t` 的变化。如果我们想知道在时间 =0 时处于状态 `s`，在某个时间
    `t` 时处于状态 `t` 的概率，我们不能孤立地考虑状态 `s` 和 `t`。可能还有其他状态可以从 `s` 到达，如果去了那些状态，到达 `t` 所需的时间可能更长或更短；或者可能存在从
    `t` 可以继续到达的状态，因此我们可能在时间 `t` 之前经过 `t`，但不再停留在那里。我们必须考虑所有边和所有速率。因此，计算在时间 `t` 时处于状态
    `t` 的概率依赖于矩阵运算，特别是矩阵指数运算。


    ## 函数、类与运算符


    在 R 中，你做的所有事情都通过函数完成。因此，如果你想实现一门领域特定语言，就必须通过编写函数来实现。你的新领域特定语言应支持的所有操作都必须用函数实现，如果你希望为领域特定语言提供特殊语法，就必须编写用于解析该语法的函数。正如我们将看到的，在实现嵌入式领域特定语言时，大部分解析工作可以外包给
    R 的解析器。为此付出的代价是领域特定语言的语法受到一些限制——领域特定语言必须是语法上有效的 R 代码。我们无法为嵌入式语言构建任意语法，但通过使用运算符重载或元编程，以及定义新的中缀运算符，我们在设计领域特定语言时确实拥有一定的灵活性。


    在前两章中，我们看到了如何利用运算符重载和元编程将 R 表达式视为嵌入式语言中的表达式。本章的目的是深入探讨运算符选项的细节，而下一章将涵盖通过元编程显式操控表达式的可能性。


    ### S3 面向对象编程系统


    关于 R 支持的面向对象编程系统，你可以写一整本书——我知道，因为我写过这样一本书——但对于运算符重载和实现领域特定语言解析器，我们只需要少数面向对象特性，本节将快速介绍这些内容。本书中我们将只使用最简单的面向对象系统——S3
    系统。如果你已经熟悉 S3 系统，可以直接跳到下一节。


    #### 对象与类


    S3 系统采用了一种简单直接的方式实现面向对象。它允许我们将类与任何对象关联（`NULL` 除外）。类是没有任何结构的文本字符串，你可以通过调用函数 `class`
    获取与对象关联的类。


    ```r

    class(4)

    ## [1] "numeric"

    class("foo")

    ## [1] "character"

    class(TRUE)

    ## [1] "logical"

    class(sin)

    ## [1] "function"

    ```


    你可以使用相应的赋值函数设置对象的类，如下所示：


    ```r

    class(sin) <- "foo"

    class(sin)

    ## [1] "foo"

    ```


    这不会影响对象的本质或功能。


    ```r

    sin(0)

    ## [1] 0

    ```


    某些对象的类是可以修改的——例如，你无法更改字面数字和字符串的类，因此如果你尝试这样做：


    ```r

    class(2) <- "character"

    class("foo") <- "numeric"

    ```


    你会收到错误信息。尽管如此，你可以随时自由修改对象的类。与对象关联的类只是一个包含一个或多个类名的属性——在前面的例子中，所有对象都只有一个类，但我们在第
    2 章创建的矩阵表达式则具有多个类。类名的向量既用于多重继承也用于单继承，并且根本没有正式的类结构。你可以以任何方式设置类。类属性只是一个被解释为类名的字符串向量。


    与你可以与对象关联的其他属性相比，类属性之所以有趣，唯一的原因在于它如何用于分发泛型函数。当你调用一个泛型函数时，实际被调用的函数取决于其参数之一的类，通常是第一个参数（如果你没有显式提供参数，则始终是第一个）。'
- fmt: '# Generic Functions


    The generic function mechanism in the S3 system is implemented in the `UseMethod`
    and `NextMethod` functions. To define a generic function, `foo`, you would, for
    example, write the following:


    ```

    foo <- function(x, y, z) UseMethod("foo")

    ```


    Calling `foo` would then invoke `UseMethod` that would search for concrete implementations
    of `foo`. Such functions are identified by their name alone—any function whose
    name starts with `foo.` is considered an implementation of `foo`, and the one
    that will be chosen depends on the class of the argument `x`. We haven’t done
    any implementations of `foo` yet, so calling the function will just give us an
    error for now.


    ```

    foo(1, 2, 3)

    ## Error in UseMethod("foo"): no applicable method for ''foo'' applied to an object
    of class "c(''double'', ''numeric'')"

    ```


    However, we can make a default implementation. The default implementation for
    a generic function—the one that will be used if `UseMethod` can find no better
    matching implementation—has a name that ends with `.default`. We can implement
    the following:


    ```

    foo.default <- function(x, y, z) {

    cat("default foo\n")

    }

    ```


    and this function will be invoked if we call `foo` with an object that doesn’t
    have a better implementation.


    ```

    foo(1, 2, 3)

    ## default foo

    ```


    To specialize a generic function to specific classes, we just have to define functions
    with appropriate names. Any function name that begins with `foo.` can be used
    and will be called if we call `foo` with an object of the appropriate class. To
    specialize `foo` to `numeric` values, for example, we could write the following:


    ```

    foo.numeric <- function(x, y, z) {

    cat("numeric\n")

    }

    ```


    Now the following function will be called if `x` is numeric.


    ```

    foo(1, 2, 3)

    ## numeric

    ```


    A quick note before we continue to explore how dispatching is done on generic
    functions for user-defined classes: when we used `UseMethod` in the definition
    of `foo`, we called it with the name `foo`. This is why it looks for that name
    when it searches for implementations of the generic function. We could have asked
    it to search for other functions. The name we gave the generic function when we
    defined `foo` is not what determines what we search for when we call the function—that
    is determined by the name we give `UseMethod`. Further, we have seen it dispatches
    on the first argument of `foo`, but this is just a default. We could give `UseMethod`
    another object to dispatch on.


    ```

    bar <- function(x, y, z) UseMethod("foo", y)

    ```


    I do not recommend doing this—it goes against the conventions used in `R`—but
    it is possible, and with this function, we would dispatch on the `y` argument
    (and search for the generic function `foo`, not `bar`).


    ```

    foo("foo",2,3)

    ## default foo

    bar("foo",2,3)

    ## numeric

    bar(1,"bar",3)

    ## default foo

    ```


    Going back to the rules for dispatching, when `UseMethod` is called, it starts
    to search for functions based on their name. It will take the classes of an object
    and search those in order. If it doesn’t find any matching function, it will call
    the default, if it exists.


    So, let’s consider again `foo` where we have a numeric and a default implementation.


    ```

    x <- 1

    foo(x, 2, 3)

    ## numeric

    ```


    Here, we have created the object `x` that is numeric, so when we call `foo`, we
    match the numeric function. But we can change the class of `x` and see what happens.


    ```

    class(x) <- c("a", "b", "c")

    foo(x, 2, 3)

    ## default foo

    ```


    Now, since `x` has the classes `a`, `b`, and `c` but not `numeric`, `UseMethod`
    does not find the numeric version but hits the default one. We can, of course,
    define functions for the other classes and see what happens.


    ```

    foo.a <- function(x, y, z) cat("a\n")

    foo.b <- function(x, y, z) cat("b\n")

    foo.c <- function(x, y, z) cat("c\n")

    foo(x, 2, 3)

    ## a

    ```


    Because we now have functions for `x`’s classes, we can find them, and because
    `a` is the first class, that is the one that will be called. If we change the
    order of `x`’s classes, we call the other functions— `UseMethod` always calls
    the first it finds.


    ```

    class(x) <- c("b", "a", "c")

    foo(x, 2, 3)

    ## b

    class(x) <- c("c", "b", "a")

    foo(x, 2, 3)

    ## c

    ```


    When calling `UseMethod`, we will find and call the first matching function. The
    related `NextMethod` function can be invoked to find and call the next function
    in the chain of classes. To see it in action, we can redefine the three `a`, `b`,
    and `c` foo implementations and make them call the next function in line.


    ```

    foo.a <- function(x, y, z) {

    cat("a\n")

    NextMethod()

    }

    foo.b <- function(x, y, z) {

    cat("b\n")

    NextMethod()

    }

    foo.c <- function(x, y, z) {

    cat("c\n")

    NextMethod()

    }

    ```


    They will all call the next function in line, and since we have a default implementation
    of `foo`, the last in line will call that one. The order in which the functions
    are called depends entirely on the order of `x`’s classes.


    ```

    class(x) <- c("a", "b", "c")

    foo(x, 2, 3)

    ## a

    ## b

    ## c

    ## default foo

    class(x) <- c("b", "a", "c")

    foo(x, 2, 3)

    ## b

    ## a

    ## c

    ## default foo

    class(x) <- c("c", "b", "a")

    foo(x, 2, 3)

    ## c

    ## b

    ## a

    ## default foo

    ```


    This generic dispatch mechanism is extremely flexible, so it will require some
    discipline to ensure a robust object-oriented design. To implement domain-specific
    languages, though, we are interested in how we can use it to add operators to
    our language.'
