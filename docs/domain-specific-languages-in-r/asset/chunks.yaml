  raw: 'The last two statements in this function, the calls to `assign`, create functions
    for printing elements of the type we are creating. We will implement the `deparse_construction`
    and `construction_printer` functions in a moment. They extract information about
    values from meta-information we will store in objects of the new type, and we
    can use the same functions for all types we define in our language. We use them
    to specialize the `toString` and `print` functions for this specific type. The
    `paste0` calls create the names of the specializations of the generic `toString`
    and `print` functions. The `assign` function then stores `deparse_construction`
    and `construction_printer` under the appropriate names in the environment we get
    from `get_env(data_type)`, in other words, the environment where we define the
    type.


    The expression on the right-hand side of `:=` defines how we construct elements
    of the new type. We allow there to be more than one way to do this, and we separate
    the various choices using the or operator, `|`. This approach resembles how we
    describe different alternatives when we specify a grammar, so it is a natural
    choice. To process the right-hand side, we use the function `process_` `alternatives`
    .


    ```

    process_alternatives <- function(constructors,

    data_type_name,

    env) {

    if (is_lang(constructors) && constructors[[1]] == "|") {

    process_alternatives(

    constructors[[2]],

    data_type_name,

    env

    )

    process_alternatives(

    constructors[[3]],

    data_type_name,

    env

    )

    } else {

    process_constructor(

    constructors,

    data_type_name,

    env

    )

    }

    }

    ```


    In addition to the constructor expression, we pass the name of the type and the
    environment we are defining it in as parameters. We do not use these directly
    in this function but merely pass them along. We will use them later when we create
    the actual constructors.


    The `process_alternatives` function recursively parse the expression to get all
    alternatives separated by `|`. The actual constructors will be either a function
    or a symbol, so the constructor specifications will not have higher precedence
    than the or operator. The first time we see something that isn’t a call to `|`,
    then, we have a constructor. We handle those using the `process_constructor` function.


    ```

    process_constructor <- function(constructor,

    data_type_name,

    env) {

    if (is_lang(constructor)) {

    process_constructor_function(

    constructor,

    data_type_name,

    env

    )

    } else {

    process_constructor_constant(

    constructor,

    data_type_name,

    env

    )

    }

    }

    ```


    This function figures out whether what we are looking at is a function constructor
    or a constant, in other words, a symbol. We use the `is_lang` function to test
    whether we are looking at a function. It does the same as `is.call` from the `base`
    package; I just prefer the `rlang` functions for this chapter.


    Constant constructors are the simplest. They are merely symbols, so to make them
    available for programmers, we need to define a value for each such symbol. We
    will use `NA` as the value of these variables and store some meta-information
    with them. We set the class, so the `construction_printer` function will be called
    when we try to print the object, and we set the attribute `constructor_` `constant`
    that we will later need for pattern matching.


    ```

    process_constructor_constant <- function(constructor,

    data_type_name,

    env) {

    stopifnot(is_symbol(constructor))

    constructor_name <- as_string(constructor)

    constructor_object <- structure(

    NA,

    constructor_constant = constructor_name,

    class = data_type_name

    )

    assign(constructor_name, constructor_object, envir = env)

    }

    ```


    For the function constructors, we need to create, you guessed it, functions. We
    analyze the arguments given to the constructor specification and build a function
    out of that, and this function we then store in the environment where the constructor
    is defined. We permit two kinds of parameters to a constructor: either a symbol
    or a symbol with a type. For the latter, we use the `:` operator. If a parameter
    is a `:` call, then we consider the left-hand side the parameter and the right-hand
    side the type. We use the types to guarantee that values we construct are of the
    expected kind. If there is no type specified, we will allow a parameter to hold
    any value. We use the following function to translate the list of parameters from
    a function constructor expression into a data frame where the first column holds
    the argument names and the second column holds their type. We use `NA` to indicate
    that we allow any type. The function works by first translating the arguments—that
    are in the form of a `call` object—into a list. We have to use the base `as.list`
    function for this, rather than the `rlang as_list`, since the latter will not
    translate `call` objects into lists. Once we have the arguments as a list, we
    map the `process_arg` function over the elements. This function creates a row
    for the data frame per element, and we combine the rows using the `bind_rows`
    function from `dplyr`.


    ```

    process_arguments %

    as.list %>%

    purrr::map(process_arg) %>%

    bind_rows

    }

    ```


    The `process_constructor_function` translates a function construction specification
    into a function. The first element of the specifications, which is a `call` object,
    is the name of the function. For the remaining elements, we translate them into
    a data frame using the function we just saw. After that, we need to create the
    function that will work as the constructor. Here, we create a closure without
    arguments and then add formal parameters afterward, as we did in the previous
    chapter, and we get the actual parameters that the closure is called with using
    the `as_list(environment())` trick.


    The value we return from the closure is just the list of arguments that are provided
    to it but tagged with a `constructor` attribute we can use for pattern matching
    and a `class` set to the type we are defining, something we use for type checking.
    The type checking is the chief part of the constructor. Here, we check that we
    get the right number of arguments and that they have the right type if a type
    was specified.


    Once we have created the closure and set its formal arguments, we also update
    its class, so it is both a `constructor` and a `function`. Giving constructor
    functions the class `constructor` is also something we will need when pattern
    matching. Then we assign it to the environment associated with the specification
    to make it available to the programmer.


    ```

    process_constructor_function <- function(constructor,

    data_type_name,

    env) {

    stopifnot(is_lang(constructor))

    constructor_name <- quo_name(constructor[[1]])

    constructor_arguments <- process_arguments(constructor[-1])

    # Create the constructor function

    constructor <- function() {

    args <- as_list(environment())

    # Type check!

    stopifnot(length(args) == length(constructor_arguments$arg))

    for (i in seq_along(args)) {

    arg <- args[[constructor_arguments$arg[i]]]

    type <- constructor_arguments$type[i]

    stopifnot(is_na(type) || inherits(arg, type))

    }

    structure(args,

    constructor = constructor_name,

    class = data_type_name)

    }

    formals(constructor) <- make_args_list(constructor_arguments$arg)

    # Set meta information about the constructor

    class(constructor) <- c("constructor", "function")

    # Put the constructor in the binding scope

    assign(constructor_name, constructor, envir = env)

    }

    ```'
