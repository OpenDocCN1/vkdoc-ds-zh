- fmt: '### Expression Rewriting


    With the dynamic programming algorithm in place, we know how to arrange multiplications
    in optimal order. We need to have them in a list, however, to access them by index
    in constant time in the backtracking function, but what we have as input is an
    expression that gives us a tree of mixed multiplications, addition, and data objects.
    So, the first step we must perform in the rearrangement is to collect the components
    of the multiplication in a list.


    It is simple enough to visit all the relevant values in an expression. We recurse
    on all `matrix_mult` objects but not data or `matrix_sum` objects since it is
    these that we want to collect. It is inefficient to traverse the tree and grow
    an actual `list` object one element at a time; whenever you extend the length
    of a `list` object by one element, you need to copy all the old elements. Instead,
    we can implement a linked list—that we can prepend elements to in constant time—and
    translate that into a `list` object later.


    To see this in action, we can consider a simpler tree first.


    ```

    leaf <- function(x) structure(x, class = c("leaf", "tree"))

    inner <- function(left, right)

    structure(list(left = left, right = right),

    class = c("inner", "tree"))

    ```


    Let’s say we have such a tree as shown here (and we do not a priori know that
    it has four leaves):


    ```

    tree <- inner(leaf(1), inner(inner(leaf(2), leaf(3)), leaf(4)))

    ```


    And say we want to construct a list containing the values in the leaves.


    One way to implement linked lists is as a `list` object containing two values,
    which are the head of the list (an actual value) and the tail of the list (another
    list, or potentially `NULL` representing the empty list).


    Since `head` and `tail` are useful built-in functions in R, we will call these
    two elements `car` and `cdr` instead. These are the names they have in the Lisp
    programming language and many other functional programming languages. We can construct
    a list from a `car` and `cdr` element like this:


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    ```


    To traverse a tree, we use recursion, but we don’t want to test the class of subtrees
    explicitly. Here is what we would usually do: have a test for the base case of
    having a leaf and another case for when we have an inner node. This approach would
    be sensible on this simple tree. However, once we start working with expressions
    where we can have many different node types, it might not be obvious what should
    be considered a base case or a recursive case. For any particular traversal, it
    is better to use generic functions.


    ```

    collect_leaves_rec <- function(tree, lst)

    UseMethod("collect_leaves_rec")

    collect_leaves_rec.leaf <- function(tree, lst) {

    cons(tree, lst)

    }

    collect_leaves_rec.inner <- function(tree, lst) {

    collect_leaves_rec(tree$left, collect_leaves_rec(tree$right, lst))

    }

    ```


    Using a generic function like this is certainly overkill for this simple example,
    but it illustrates the idea, which will be useful for more complex trees. Each
    node type is responsible for handling itself and potentially recursing further
    if this is needed. Here, the leaf handler prepends the tree to the list that is
    passed down the recursion. The tree is just the leaf, so this is the value we
    want to collect. The result is an updated list that we return from the recursion.
    For inner nodes, we first call recursively toward the right, passing along the
    `lst` object. This will prepend the elements in the right subtree to create a
    new list that we then pass along to a recursion on the left subtree.


    The result of this traversal is a linked list containing all the leaves. To create
    a `list` object out of this, we need to run through the list and compute its length,
    allocate a `list` of that length, and then run through the linked list again to
    insert the elements in the `list`. This is one of the few tasks in R that is easier
    done with a loop than a functional solution, so that is what we will use.


    ```

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    Len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    ```


    To improve the readability of the example, we will just add a function that gives
    us a `vector` instead of a `list`.


    ```

    lst_to_vec <- function(lst) unlist(lst_to_list(lst))

    ```


    Now we can use the combination of the traversal and transformation from the linked
    list to implement the function we want.


    ```

    collect_leaves <- function(tree) {

    lst_to_vec(collect_leaves_rec(tree, NULL))

    }

    collect_leaves(tree)

    ## [1] 1 2 3 4

    ```


    We can use the same approach to implement a better version of the `rearrange_matrix_expr.matrix_mult`
    function from earlier—one that rearranges the multiplication instead of just returning
    the original expression. We need it to collect the components of the multiplication—those
    would be data and sum objects—and then rearrange them using the dynamic programming
    algorithm.


    ```

    rearrange_matrix_expr.matrix_mult <- function(expr) {

    matrices <- collect_mult_components(expr)

    arrange_optimal_matrix_mult(matrices)

    }

    ```


    The `collect_mult_components` function can be implemented using a traversal with
    a generic function like this:


    ```

    collect_mult_components_rec <- function(expr, lst)

    UseMethod("collect_mult_components_rec")

    collect_mult_components_rec.default <- function(expr, lst)

    cons(rearrange_matrix_expr(expr), lst)

    collect_mult_components_rec.matrix_mult <- function(expr, lst)

    collect_mult_components_rec(expr$left,

    collect_mult_components_rec(expr$right, lst))

    collect_mult_components <- function(expr)

    lst_to_list(collect_mult_components_rec(expr, NULL))

    ```


    We use the default implementation to prepend expressions that are not multiplications
    to the list we are building, while we call recursively on the multiplication objects.
    Once we have collected all the components we need in a linked list, we translate
    it into a `list` object that lets us look up elements by index, as we need in
    the dynamic programming algorithm.


    To see the rearranging in action, we can create the expression we used in the
    previous chapter. We have four matrices that we multiply together without setting
    any parentheses.


    ```

    A <- matrix(1, nrow = 400, ncol = 300)

    B <- matrix(1, nrow = 300, ncol = 30)

    C <- matrix(1, nrow = 30, ncol = 500)

    D <- matrix(1, nrow = 500, ncol = 400)

    expr <- m(A) * m(B) * m(C) * m(D)

    ```


    This implicitly sets parentheses such that the expression will be evaluated by
    multiplying from left to right.


    ```

    expr

    ## ((([A] * [B]) * [C]) * [D])

    ```


    This, however, is not the optimal order. Instead, it is better to first multiply
    `A` with `B` and `C` with `D` and then multiply the results.


    ```

    rearrange_matrix_expr(expr)

    ## (([A] * [B]) * ([C] * [D]))

    ```'
  raw: '### Expression Rewriting


    With the dynamic programming algorithm in place, we know how to arrange multiplications
    in optimal order. We need to have them in a list, however, to access them by index
    in constant time in the backtracking function, but what we have as input is an
    expression that gives us a tree of mixed multiplications, addition, and data objects.
    So, the first step we must perform in the rearrangement is to collect the components
    of the multiplication in a list.


    It is simple enough to visit all the relevant values in an expression. We recurse
    on all `matrix_mult` objects but not data or `matrix_sum` objects since it is
    these that we want to collect. It is inefficient to traverse the tree and grow
    an actual `list` object one element at a time; whenever you extend the length
    of a `list` object by one element, you need to copy all the old elements. Instead,
    we can implement a linked list—that we can prepend elements to in constant time—and
    translate that into a `list` object later.


    To see this in action, we can consider a simpler tree first.


    ```

    leaf <- function(x) structure(x, class = c("leaf", "tree"))

    inner <- function(left, right)

    structure(list(left = left, right = right),

    class = c("inner", "tree"))

    ```


    Let’s say we have such a tree as shown here (and we do not a priori know that
    it has four leaves):


    ```

    tree <- inner(leaf(1), inner(inner(leaf(2), leaf(3)), leaf(4)))

    ```


    And say we want to construct a list containing the values in the leaves.


    One way to implement linked lists is as a `list` object containing two values,
    which are the head of the list (an actual value) and the tail of the list (another
    list, or potentially `NULL` representing the empty list).


    Since `head` and `tail` are useful built-in functions in R, we will call these
    two elements `car` and `cdr` instead. These are the names they have in the Lisp
    programming language and many other functional programming languages. We can construct
    a list from a `car` and `cdr` element like this:


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    ```


    To traverse a tree, we use recursion, but we don’t want to test the class of subtrees
    explicitly. Here is what we would usually do: have a test for the base case of
    having a leaf and another case for when we have an inner node. This approach would
    be sensible on this simple tree. However, once we start working with expressions
    where we can have many different node types, it might not be obvious what should
    be considered a base case or a recursive case. For any particular traversal, it
    is better to use generic functions.


    ```

    collect_leaves_rec <- function(tree, lst)

    UseMethod("collect_leaves_rec")

    collect_leaves_rec.leaf <- function(tree, lst) {

    cons(tree, lst)

    }

    collect_leaves_rec.inner <- function(tree, lst) {

    collect_leaves_rec(tree$left, collect_leaves_rec(tree$right, lst))

    }

    ```


    Using a generic function like this is certainly overkill for this simple example,
    but it illustrates the idea, which will be useful for more complex trees. Each
    node type is responsible for handling itself and potentially recursing further
    if this is needed. Here, the leaf handler prepends the tree to the list that is
    passed down the recursion. The tree is just the leaf, so this is the value we
    want to collect. The result is an updated list that we return from the recursion.
    For inner nodes, we first call recursively toward the right, passing along the
    `lst` object. This will prepend the elements in the right subtree to create a
    new list that we then pass along to a recursion on the left subtree.


    The result of this traversal is a linked list containing all the leaves. To create
    a `list` object out of this, we need to run through the list and compute its length,
    allocate a `list` of that length, and then run through the linked list again to
    insert the elements in the `list`. This is one of the few tasks in R that is easier
    done with a loop than a functional solution, so that is what we will use.


    ```

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    Len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    ```


    To improve the readability of the example, we will just add a function that gives
    us a `vector` instead of a `list`.


    ```

    lst_to_vec <- function(lst) unlist(lst_to_list(lst))

    ```


    Now we can use the combination of the traversal and transformation from the linked
    list to implement the function we want.


    ```

    collect_leaves <- function(tree) {

    lst_to_vec(collect_leaves_rec(tree, NULL))

    }

    collect_leaves(tree)

    ## [1] 1 2 3 4

    ```


    We can use the same approach to implement a better version of the `rearrange_matrix_expr.matrix_mult`
    function from earlier—one that rearranges the multiplication instead of just returning
    the original expression. We need it to collect the components of the multiplication—those
    would be data and sum objects—and then rearrange them using the dynamic programming
    algorithm.


    ```

    rearrange_matrix_expr.matrix_mult <- function(expr) {

    matrices <- collect_mult_components(expr)

    arrange_optimal_matrix_mult(matrices)

    }

    ```


    The `collect_mult_components` function can be implemented using a traversal with
    a generic function like this:


    ```

    collect_mult_components_rec <- function(expr, lst)

    UseMethod("collect_mult_components_rec")

    collect_mult_components_rec.default <- function(expr, lst)

    cons(rearrange_matrix_expr(expr), lst)

    collect_mult_components_rec.matrix_mult <- function(expr, lst)

    collect_mult_components_rec(expr$left,

    collect_mult_components_rec(expr$right, lst))

    collect_mult_components <- function(expr)

    lst_to_list(collect_mult_components_rec(expr, NULL))

    ```


    We use the default implementation to prepend expressions that are not multiplications
    to the list we are building, while we call recursively on the multiplication objects.
    Once we have collected all the components we need in a linked list, we translate
    it into a `list` object that lets us look up elements by index, as we need in
    the dynamic programming algorithm.


    To see the rearranging in action, we can create the expression we used in the
    previous chapter. We have four matrices that we multiply together without setting
    any parentheses.


    ```

    A <- matrix(1, nrow = 400, ncol = 300)

    B <- matrix(1, nrow = 300, ncol = 30)

    C <- matrix(1, nrow = 30, ncol = 500)

    D <- matrix(1, nrow = 500, ncol = 400)

    expr <- m(A) * m(B) * m(C) * m(D)

    ```


    This implicitly sets parentheses such that the expression will be evaluated by
    multiplying from left to right.


    ```

    expr

    ## ((([A] * [B]) * [C]) * [D])

    ```


    This, however, is not the optimal order. Instead, it is better to first multiply
    `A` with `B` and `C` with `D` and then multiply the results.


    ```

    rearrange_matrix_expr(expr)

    ## (([A] * [B]) * ([C] * [D]))

    ```'
  trans: '

    ### 表达式重写


    有了动态规划算法，我们就知道如何以最优顺序安排乘法运算。然而，我们需要将这些运算放入一个列表中，以便在回溯函数中通过索引在常数时间内访问。但作为输入的是一个表达式，它给出了一个由混合乘法、加法和数据对象构成的树。因此，在重排过程中，我们首先要做的是将乘法的各个组成部分收集到一个列表中。


    遍历表达式中的所有相关值相当简单。我们对所有 `matrix_mult` 对象进行递归，而不处理 data 或 `matrix_sum` 对象，因为我们要收集的正是这些乘法对象。逐一遍历树并逐个元素地增长一个实际的
    `list` 对象是低效的：每当你将一个 `list` 对象的长度增加一个元素时，你需要复制所有旧元素。相反，我们可以实现一个链表——我们可以在常数时间内将元素插入其前端——并稍后将其转换为一个
    `list` 对象。


    为了直观展示这一过程，我们可以先考虑一个更简单的树。


    ```

    leaf <- function(x) structure(x, class = c("leaf", "tree"))

    inner <- function(left, right)

    structure(list(left = left, right = right),

    class = c("inner", "tree"))

    ```


    假设我们有这样一棵树（并且我们事先不知道它有四个叶子节点）：


    ```

    tree <- inner(leaf(1), inner(inner(leaf(2), leaf(3)), leaf(4)))

    ```


    再假设我们希望构造一个包含所有叶子节点值的列表。


    实现链表的一种方法是使用一个包含两个值的 `list` 对象：即链表的头部（一个实际的值）和链表的尾部（另一个列表，或者可能表示空列表的 `NULL`）。


    由于 `head` 和 `tail` 是 R 中有用的内置函数，我们改用 `car` 和 `cdr` 来命名这两个元素。这是它们在 Lisp 编程语言以及许多其他函数式编程语言中的名称。我们可以像这样从一个
    `car` 和 `cdr` 元素构造一个列表：


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    ```


    为了遍历树，我们使用递归，但我们不想显式地测试子树的类别。通常我们会这样做：有一个测试基例（即叶子节点）的情况，以及另一个针对内部节点的情况。这种方法对于这个简单的树来说是合理的。然而，一旦我们开始处理包含多种不同节点类型的表达式时，哪些应被视为基例或递归情况可能就不那么明显了。对于任何特定的遍历，最好使用泛型函数。


    ```

    collect_leaves_rec <- function(tree, lst)

    UseMethod("collect_leaves_rec")

    collect_leaves_rec.leaf <- function(tree, lst) {

    cons(tree, lst)

    }

    collect_leaves_rec.inner <- function(tree, lst) {

    collect_leaves_rec(tree$left, collect_leaves_rec(tree$right, lst))

    }

    ```


    对于这个简单的例子来说，使用这样的泛型函数无疑是小题大做，但它说明了这个想法，该想法对于更复杂的树将很有用。每个节点类型负责处理自身，并在需要时可能进一步递归。这里，叶子节点的处理程序将树（即叶子节点本身）前置到递归传递下来的列表前端。结果是一个更新后的列表，我们从递归中返回它。对于内部节点，我们首先向右递归调用，传入
    `lst` 对象。这将把右子树中的元素前置到列表前端，创建一个新列表，然后我们将这个新列表传递给对左子树的递归。


    这种遍历的结果是一个包含所有叶子节点的链表。要从中创建一个 `list` 对象，我们需要遍历该链表并计算其长度，分配一个该长度的 `list`，然后再次遍历链表以将元素插入到
    `list` 中。这是在 R 中少数几个用循环比用函数式解决方案更容易完成的任务之一，因此我们将采用循环方式。


    ```

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    ```


    为了提升示例的可读性，我们只需添加一个函数，使其返回一个 `vector` 而不是 `list`。


    ```

    lst_to_vec <- function(lst) unlist(lst_to_list(lst))

    ```


    现在我们可以结合遍历和从链表转换的方法来实现我们想要的函数。


    ```

    collect_leaves <- function(tree) {

    lst_to_vec(collect_leaves_rec(tree, NULL))

    }

    collect_leaves(tree)

    ## [1] 1 2 3 4

    ```


    我们可以用同样的方法来实现之前 `rearrange_matrix_expr.matrix_mult` 函数的更好版本——该版本可以对乘法进行重排，而不仅仅是返回原始表达式。我们需要它收集乘法的各个组成部分——这些包括
    data 和 sum 对象——然后使用动态规划算法对它们进行重排。


    ```

    rearrange_matrix_expr.matrix_mult <- function(expr) {

    matrices <- collect_mult_components(expr)

    arrange_optimal_matrix_mult(matrices)

    }

    ```


    `collect_mult_components` 函数可以使用类似这样的泛型函数通过遍历来实现：


    ```

    collect_mult_components_rec <- function(expr, lst)

    UseMethod("collect_mult_components_rec")

    collect_mult_components_rec.default <- function(expr, lst)

    cons(rearrange_matrix_expr(expr), lst)

    collect_mult_components_rec.matrix_mult <- function(expr, lst)

    collect_mult_components_rec(expr$left,

    collect_mult_components_rec(expr$right, lst))

    collect_mult_components <- function(expr)

    lst_to_list(collect_mult_components_rec(expr, NULL))

    ```


    我们使用默认实现将非乘法的表达式前置到正在构建的列表前端，同时对乘法对象进行递归调用。一旦我们将所需的所有组件收集到一个链表中，我们就将其转换成一个 `list`
    对象，这样我们就可以通过索引查找元素，正如动态规划算法所需要的那样。


    为了观察重排的实际效果，我们可以创建上一章中使用的表达式。我们有四个矩阵相乘，且没有设置任何括号。


    ```

    A <- matrix(1, nrow = 400, ncol = 300)

    B <- matrix(1, nrow = 300, ncol = 30)

    C <- matrix(1, nrow = 30, ncol = 500)

    D <- matrix(1, nrow = 500, ncol = 400)

    expr <- m(A) * m(B) * m(C) * m(D)

    ```


    这会隐式地设置括号，使得表达式将从左到右进行计算。


    ```

    expr

    ## ((([A] * [B]) * [C]) * [D])

    ```


    然而，这不是最优顺序。相反，更好的做法是先将 `A` 与 `B` 相乘、`C` 与 `D` 相乘，然后再将结果相乘。


    ```

    rearrange_matrix_expr(expr)

    ## (([A] * [B]) * ([C] * [D]))

    ```

