    # 2. Matrix Expressions


    In the next chapter we discuss computer languages in a more theoretical way, but
    here we will consider a concrete case—the matrix expressions mentioned in Chapter
    [1](#A465211_1_En_1_Chapter.html). This example is a relatively simple domain-specific
    language, but parsing matrix expressions, optimizing them, and then evaluating
    them are all the phases we usually have to implement in any DSL, and the implementation
    will also have examples of most of the techniques we will cover in more detail
    later. The example will use some tricks that I will not explain until later in
    the book, so some aspects might not be evident at this point, but the broader
    strokes should be and will ideally serve as a sneak peek of what follows in future
    chapters.


    Our goal for writing a language for matrix expressions is to improve upon the
    default performance of the built-in matrix expressions. We achieve this by taking
    a more global view of expressions than R does—R will handle each operator one
    at a time from left to right, but we will analyze expressions and rearrange them
    to improve performance. These are the steps we must take to do this:


    1.  Parse expressions into data that we can manipulate.  

    2.  Rearrange the expressions into more efficient expressions.  

    3.  Provide a way to evaluate the expressions.  


    In this chapter, we use the following library:


    ```

    library(microbenchmark)

    ```


    ## Parsing Expressions


    To keep things simple, we will only consider matrix multiplication and matrix
    addition. We do not include scalar multiplication or inverting or transposing
    matrices or any other functionality. Adding more components of the expression
    language in the example will follow the same ideas as we need for multiplication
    and addition. It will not teach us anything new regarding embedding DSLs in R.
    When you understand the example, you will be able to do this easily yourself.


    With these restrictions, we can say that a matrix expression is either just a
    matrix, the product of two matrix expressions, or the sum of two matrix expressions.
    We can represent this as a class hierarchy with one (abstract) superclass representing
    expressions and three (concrete) subclasses for actual data, products, and sums.
    If you are not familiar with object-oriented programming in R, we will have a
    short guide to everything you need to know in Chapter [4](#A465211_1_En_4_Chapter.html).
    Constructors for creating objects of the three concrete classes can look like
    these:


    ```

    m <- function(data) {

    structure(list(data = data),

    nrow = nrow(data),

    ncol = ncol(data),

    def_expr = deparse(substitute(data)),

    class = c("matrix_data", "matrix_expr"))

    }

    matrix_mult <- function(A, B) {

    structure(list(left = A, right = B),

    nrow = nrow(A),

    ncol = ncol(B),

    class = c("matrix_mult", "matrix_expr"))

    }

    matrix_sum <- function(A, B) {

    structure(list(left = A, right = B),

    nrow = nrow(A),

    ncol = ncol(B),

    class = c("matrix_sum", "matrix_expr"))

    }

    ```


    We just wrap the parameters of the constructors in a list and set the appropriate
    class attributes, and we store the number of rows and number of columns because
    we will need them when optimizing matrix multiplication, as we saw in Chapter
    [1](#A465211_1_En_1_Chapter.html).


    The only purpose of the `def_expr` attribute we set in the `m` function is pretty
    printing. It makes the output of the expressions we manipulate in the following
    pages easier to follow. Strictly speaking, we do not need any pretty printing
    for manipulating expressions, but it does make debugging easier, so I tend always
    to write some code for that. For the matrix expressions, we can use the following
    code:


    ```

    toString.matrix_data <- function(x, ...) {

    paste0("[", attr(x, "def_expr"), "]")

    }

    toString.matrix_mult <- function(x, ...) {

    paste0("(", toString(x$left), " * ", toString(x$right), ")")

    }

    toString.matrix_sum <- function(x, ...) {

    paste0("(", toString(x$left), " + ", toString(x$right), ")")

    }

    print.matrix_expr <- function(x, ...) {

    cat(toString(x), "\n")

    }

    ```


    Using the constructors and the pretty-printing code, we can try to construct a
    small expression.


    ```

    A <- matrix(1, nrow = 10, ncol = 20)

    B <- matrix(1, nrow = 20, ncol = 10)

    C <- matrix(1, nrow = 10, ncol = 10)

    matrix_sum(matrix_mult(m(A), m(B)), m(C))

    ## (([A] * [B]) + [C])

    ```


    There is nothing in what we have done so far that qualifies as providing a language
    as such. We have just implemented a few constructor functions. However, if we
    overload the multiplication and addition operators for matrix expressions, we
    get something that starts to resemble a language at least.


    ```

    `*.matrix_expr` <- function(A, B) {

    stopifnot(ncol(A) == nrow(B))

    matrix_mult(A, B)

    }

    `+.matrix_expr` <- function(A, B) {

    stopifnot(dim(A) == dim(B))

    matrix_sum(A, B)

    }

    ```


    With these, we can write the same expression more familiarly.


    ```

    m(A) * m(B) + m(C)

    ## (([A] * [B]) + [C])

    ```


    I have put some assertions—the calls to `stopifnot()` —into the code for the operators
    to make sure that the dimensions of the matrices involved in operators are valid.
    We could also have placed these in the constructor functions, but later, we will
    manipulate expressions where we know that the dimensions are valid, so we do not
    need to check them there. We do not expect a user to call the constructors directly
    but use the operators, so this is the natural place to put the checks.'
