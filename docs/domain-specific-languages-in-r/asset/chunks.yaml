    `force` 对累加器的求值，以避免惰性求值。在惰性求值下，我们会构建越来越大的 `CONS` 表达式，这些表达式直到递归结束时才会被求值。到那时，我们构建的表达式可能已经大到超出函数求值所需的栈空间。例如，请参阅
