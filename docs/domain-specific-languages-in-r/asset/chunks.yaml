- fmt: '# Specifying a Grammar


    Since we are using R to parse expressions, we do not have much flexibility in
    what can be considered tokens, and we have some limitations in the kinds of grammars
    we can implement. However, we have some flexibility for the grammars in how we
    combine functions and operators.


    To specify grammars in this book, I will take a traditional approach and describe
    them in terms of "rules" for generating sentences valid within a grammar. Consider
    the following grammar:


    ```

    EXPRESSION ::= NUMBER

    |  EXPRESSION ''+'' EXPRESSION

    |  EXPRESSION ''*'' EXPRESSION

    |  ''('' EXPRESSION '')''

    ```


    This grammar describes rules for generating expressions consisting of the addition
    and multiplication of numbers, with parentheses to group expressions.


    You should read this as "An expression is either a number, the sum of two expressions,
    the product of two expressions, or an expression in parentheses." The definition
    is recursive—an expression is defined in terms of other expressions—but we have
    a base case, a number, that lets us create a base expression, and from such an
    expression we can generate more complex expressions.


    The syntax I use here for specifying grammars is itself a grammar—a meta-grammar
    if you will. The way you should interpret it is thus: the grammatical object we
    are defining is to the left of the `::=` object. After that, we have a sequence
    of one or more ways to construct such an object, separated by `|`. These rules
    for constructing the object we define will be a sequence of other grammatical
    objects. These can be either objects we define by other rules (I will write those
    in all capitals and refer to them as meta-variables) or concrete lexical tokens
    (I write those in single quotes, as with the `''+''` in the second rule for creating
    a sum). This notation contains the same information as the graphical notation
    I used in Figure [3-1](#A465211_1_En_3_Chapter.html#Fig1) where meta-variables
    are shown in italics and concrete tokens are put in gray boxes.


    Meta-grammars like this are used to define languages formally, and there are many
    tools that will let you automatically create parsers from a grammar specification
    in a meta-grammar. I will use this home-made meta-grammar much less formally.
    I use it as a concise way to describe the grammar of DSLs we create or simply
    a pseudo-code for grammar.


    To create an expression, we must follow the meta-grammar rules by using one of
    the four alternatives provided: either reduce an expression to a number (a sum
    or product) or create another in parentheses. For example, we can apply the rules
    in turn and get the following:


    ```

    EXPRESSION > EXPRESSION ''*'' EXPRESSION                     (3)

    > ''('' EXPRESSION '')'' ''*'' EXPRESSION             (4)

    > ''('' EXPRESSION ''+'' EXPRESSION '')'' ''*'' EXPRESSION (2)

    > ''('' number[2] ''+'' number[2] '')'' ''*'' number[3]  (1x3)

    ```


    This lets us construct the expression `(2 + 2) * 3` from the rules.


    If there are different ways to go from meta-variables to the same sequence of
    terminal rules (there are rules that lead to the exact sequence of lexical tokens),
    then we have a problem with interpreting the language. The same sequence of tokens
    could be interpreted as specifying two different grammatical objects. For the
    expression grammar, we have ambiguities when we have expressions such as `2 +
    2 * 3`. We can parse this in two different ways, depending on which rules we apply
    to get from the meta-variable `EXPRESSION` to the concrete expression. We can
    apply multiplication first and get what amounts to `(2 + 2) * 3`, or we can apply
    the addition rule first and get `2 + (2 * 3)`. We know from the traditional mathematical
    notation that we should get the second expression because multiplication has higher
    precedence[⁴](#A465211_1_En_3_Chapter.html#Fn4) than addition, so the `*` symbol
    binds 2 and 3 together tighter than `+` does 2 and 2, but the grammar does not
    guarantee this. The grammar is ambiguous.


    It is possible to fix this by changing the grammar to this:


    ```

    EXPRESSION ::= TERM ''+'' EXPRESSION | TERM

    TERM ::= TERM ''*'' FACTOR | FACTOR

    FACTOR ::= ''('' EXPR '')'' | NUMBER

    ```


    This is a more complex grammar that lets you create the same expressions, but
    through three meta-variables that are recursively defined in terms of each other.
    It is structured such that products will naturally group closer than sums—the
    only way to construct the expression `2 + 2 * 3` is the parse tree shown in Figure
    [3-2](#A465211_1_En_3_Chapter.html#Fig2). The order in which we apply the rules
    can vary, but the tree will always be this form and group the product closer than
    the sum.


    ![A465211_1_En_3_Fig2_HTML.png](A465211_1_En_3_Fig2_HTML.png)


    Figure 3-2


    Parse tree for `2 + 2 * 3`


    An unambiguous grammar is preferable over an ambiguous one for obvious reasons,
    but creating one can complicate the specification of the grammar, as we see for
    expressions. This can be alleviated by making a smarter parser that takes such
    things as operator precedence into account or keeps track of context when parsing
    a string. Regardless of whether we write smarter parsers or unambiguous grammars,
    we would never work long with expression trees as complex as that shown in Figure
    [3-2](#A465211_1_En_3_Chapter.html#Fig2)—this tree explicitly shows all grammar
    meta-variables, but in practice, we would simplify it after parsing it and before
    processing the expression.


    When writing embedded DSLs, we are stuck with R''s parser, and we must obey its
    rules. If you are writing your own parser entirely, you can pass context along
    as you parse a sequence of tokens, but if you want to exploit R''s parser and
    create an embedded DSL, you are better off ensuring that all grammatically valid
    sequences of tokens unambiguously refer to one grammatical meta-variable. Precedence
    ambiguities will be taken care of by R as will associativity—the rules mean that
    `1 + 2 + 3 + 4` is interpreted as `(((1 + 2) + 3) + 4)`. Exploiting R''s parsing
    rules will allows us to construct languages where each expression uniquely matches
    a parser meta-variable if we are a little careful with designing the language.


    As an example grammar that isn''t just expressions, imagine that we want a language
    for specifying graphs—graphs as in networks or state machines, not plots. We can
    define a grammar for directed acyclic graphs (DAGs) by saying that a DAG is either
    an empty graph or a graph followed by an edge.


    ```

    DAG ::= ''dag()'' | DAG ''+'' EDGE

    ```


    We use a function, `dag()`, to create an empty DAG. Calling this function brings
    us into the graph specification DSL and gives us an object we can use to program
    the grammar operations in R. We will use the plus operator to add edges to a DAG.
    That is a somewhat arbitrary choice, but it makes it easy to implement the parser
    since we simply will have to overload the generic `+` function. For edges, we
    will keep it simple and just require that we have a "from" node and a "to" node.
    We can define our own infix operator to create them.


    ```

    EDGE ::= NODE ''%=>%'' NODE

    ```


    We cannot define any infix operator we want—we would be out of luck, for example,
    if we wanted the operator to be `==>` since R''s parser would interpret that as
    two tokens, `==` and `>`. We can always define our own, however, if we name them
    something starting and ending with the percentage sign. We can also reuse the
    existing infix operators through overloading, as we will do with the plus sign
    to add edges to a DAG, but for this graph grammar, we can run into some problems
    if we attempt this, as we will see next. For nodes, we will not expand them more
    now. They are atomic tokens—we can, for example, require them to be strings.[⁵](#A465211_1_En_3_Chapter.html#Fn5)'
