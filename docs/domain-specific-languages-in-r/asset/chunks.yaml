  trans: '

    在下一章中，我们将深入探讨如何编写解析器，但对于这种简单的语言，我们可以快速创建一个。解析器需要收集边，因此我们将使用链表来处理，自然地，创建一个空的有向无环图（DAG）就是让其包含一个空的边列表。然后，向
    DAG 添加边就意味着将这些边添加到列表的前端。这样的实现非常简单：


    ```

    cons %` <- function(from, to) c(from, to)

    `+.dag` <- function(dag, edge) {

    dag$edges <- cons(edge, dag$edges)

    dag

    }

    ```


    仅凭这四个函数，我们就可以使用如下语法创建一个 DAG：


    ```

    dag() +

    "foo" %=>% "bar" +

    "bar" %=>% "baz"

    ```


    这可能不是我们能想出的最佳语法，但它比嵌套函数调用更容易阅读。


    ```

    add_edge <- function(dag, from, to) {

    dag$edges <- cons(c(from, to), dag$edges)

    dag

    }

    add_edge(add_edge(dag(), "foo", "bar"), "bar", "baz")

    ```


    不过，对于熟悉 `magrittr` 的管道操作符的人来说，使用它可能会更具可读性。


    ```

    dag() %>% add_edge("foo", "bar") %>% add_edge("bar", "baz")

    ```


    无论如何，我们已经构建了一个小型语言，只需定义四个函数即可解析——如果忽略并非该语言特有的链表 `cons` 函数，那么只需要三个函数。


    我们使用了 `%=>%` 来构造边。我们可以使用 `=>` 吗？简短的回答是：不行。R 的解析器会将其视为两个标记，即 `=` 和 `>`，尽管我们可以使用反引号使其成为有效的标识符来定义这个名称的函数，但我们无法得到一个中缀操作符。


    ```

    `=>` `("foo", "bar")

    "foo" => "bar"

    ## 错误: :3:8: 意外的 ''>''

    ## 2: `=>`("foo", "bar")

    ## 3: "foo" =>

    ##           ^

    ```


    如果我们想要一个不使用百分号的中缀操作符，就必须重载 R 已有的某个操作符——而 `=>` 并非其中之一（大于等于号是 `>=`）。


    那么，我们可以改用 `>` 吗？这个操作符是 R 的中缀操作符，因此我们可以重载它。为此，我们只需要一个节点类型。如果我们将节点指定为字符串，就必须修改字符串的操作符，但我们不想这样做——这可能会破坏大量现有代码——所以最好的方法是定义一个节点类来操作。


    ```

    node .node` <- function(from, to) c(from, to)

    ```


    有了这些函数，我们就可以使用以下语法创建一条边：


    ```

    node("foo") > node("bar")

    ## [1] "foo" "bar"

    ```


    然而，将 `%` 中缀操作符改为 `>` 会改变优先级。`%` 操作符的优先级高于 `+`，这就是为什么我们之前可以将边添加到 DAG 中；但 `>` 的优先级低于
    `+`，所以我们会先将左侧节点添加到 DAG，然后才调用 `>` 操作符。


    ```

    dag() + node("foo") > node("bar")

    ## $edges

    ## $edges$car

    ## [1] "foo"

    ## attr(,"class")

    ## [1] "node"

    ##

    ## $edges$cdr

    ## NULL

    ##

    ##

    ## [[2]]

    ## [1] "bar"

    ```


    当然，我们可以使用括号来修复这个问题。


    ```

    dag() + (node("foo") > node("bar"))

    ## $edges

    ## $edges$car

    ## [1] "foo" "bar"

    ##

    ## $edges$cdr

    ## NULL

    ##

    ##

    ## attr(,"class")

    ## [1] "dag"

    ```


    依赖程序员记住添加括号并不特别安全，因此更好的解决方案是确保优先级正确。我们可以通过选择不同的操作符来向 DAG 添加边来实现这一点。例如，如果我们将 `+`
    替换为 `|`，就能得到正确的行为，因为 `|` 的优先级低于 `>`。


    ```

    `|.dag`  node("bar")

    ## $edges

    ## $edges$car

    ## [1] "foo" "bar"

    ##

    ## $edges$cdr

    ## NULL

    ##

    ##

    ## attr(,"class")

    ## [1] "dag"

    ```


    使用操作符重载有利有弊。将字符串标记改为节点标记需要更多的输入，但另一方面，我们可以在解析表达式时利用这一点进行验证，确保节点是字符串。


    或者，我们可以使用元编程，显式地遍历表达式，以确保 `>` 操作符是用于创建边的操作符，而不是用于字符串比较，类似于我们在上一章中重写矩阵表达式的方法。


    暂且回到 `magrittr` 的解决方案，我认为值得指出的是，语言设计并不仅仅是定义新的语法。我们这里为了定义图而设计的语言，其功能与管道操作符相同，因此在这个特定案例中，我们不需要指定新的语法结构就能获得所有想要的好处。使用管道时，我们避免了使代码难以阅读的嵌套函数调用，并且可以将
    DAG 指定为一个不断添加边的列表。管道操作符对大多数程序员来说都很熟悉，最重要的是，如果使用它，我们就不需要实现任何解析代码。不过，当我们定义操作 DAG
    的函数时，我们仍然在创建领域特定语言。提供一套能够表达领域思想的词汇的函数，同样是语言设计。`dplyr` 包就是一个例子——它与管道操作符一起使用，将各种操作串联起来，因此它并没有提供太多新的语法，但它为指定数据操作提供了一种非常强大的语言。


    在我们探讨的各种解决方案中，我更喜欢基于管道的方案。它使得扩展边的信息（不仅仅是“起始”节点和“目标”节点）变得容易——而二元操作符很难做到这一点——并且我们无需任何语言代码就能实现；我们只需要让
    DAG 成为所有我们将要添加到该语言中的操作函数的第一个参数即可。当然，这个解决方案之所以可行，仅仅是因为我们考虑的语言是一系列简单的操作。情况并非总是如此，所以有时我们确实需要多做一些工作。

    '
- fmt: '# Designing Semantics


    The reason we write domain-specific languages is to achieve some effect—we want
    to associate meaning, or semantics, to expressions in the DSL, and we want our
    DSL expressions to achieve some result, whether that is by executing some computations
    or by building some data structures. The purpose of a DSL merely is to provide
    a convenient interface to whatever semantics we want the language to have.


    If we always make our parsing code construct a parse tree, then the next step
    in processing the DSL involves manipulating this tree to achieve the desired effect.
    There might be several steps involved in this—for example, we rewrote expressions
    in the matrix expression example to optimize computations—but at the end of the
    processing we will execute the commands the DSL expression describes.


    Executing the DSL is sometimes straightforward and can be done as a final traversal
    of the parse tree. This is what we did with the matrix expressions where the purpose
    of the DSL was to rewrite expressions rather than evaluate them—the latter being
    a simple matter of multiplying and adding matrices. In other cases, it makes sense
    to separate the semantic model and the DSL by having a framework for the actions
    we want the language to execute. Having a framework for the semantics of the language
    lets us develop and test the semantic model separately from the language we use
    as an interface for it; it even allows us to have different input languages for
    manipulating the same semantic model—not that I recommend having many different
    languages to achieve the same goals.


    To illustrate this, we can consider a language for specifying a finite state continuous
    time Markov chain (CTMC). I chose this example because we have already implemented
    several versions of a finite state system when we implemented the graph DSL, and
    for a CTMC we just have to associate rates with all the edges. Continuous time
    Markov chains are used many places in mathematical modeling, and the implementation
    mostly comes down to specifying an instantaneous rate matrix. This is a matrix
    that specifies the rate at which we move from one state to another. Such a matrix
    should have non-negative values on all off-diagonal entries, and on the diagonal,
    we should have minus the sum of the other entries in the rows. In a framework
    where we use CTMCs, we would likely implement the functionality to work on rate
    matrices, but for specifying the CTMCs, a domain-specific language might be easier
    to use.


    Calling it the “semantics” of the language to translate graph specifications into
    a matrix might be stretching the word, but if we consider the DSL as a way of
    specifying models and the (imagined) framework that manipulates them as part of
    the language, then I think we can justify it. Using the language will consist
    of specifying the CTMC, translating it into the corresponding rate matrix, and
    then manipulating it as intended. The language part of it is the translation from
    the specification into a matrix.


    As for the graphs shown previously, we need to specify the edges in the chain.
    We need to have a rate associated with each edge, so the most natural syntax will
    be the pipe version—with this version it is simpler to specify three values for
    an edge: the “from” and “to” states and the rate. I will keep these in three different
    linked lists, just because it makes it easier to construct the matrix this way.


    We reuse these two functions we wrote in the previous chapter:


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    ```


    We then define the following functions for specifying CTMCs:


    ```

    ctmc <- function()

    structure(list(from = NULL,

    rate = NULL,

    to = NULL),

    class = "ctmc")

    add_edge <- function(ctmc, from, rate, to) {

    ctmc$from <- cons(from, ctmc$from)

    ctmc$rate <- cons(rate, ctmc$rate)

    ctmc$to <- cons(to, ctmc$to)

    ctmc

    }

    ```


    Translating the lists into a rate matrix is now simply a normal programming job.
    We collect the nodes from the “from” and “to” lists—we translate them into R lists
    first since those are easier to work with once we are done collecting elements—and
    we then get the unique node names. These become the rows and columns of the rate
    matrix, and we iterate through all the edges to insert the rates. After that,
    we set the diagonal, and we are done.


    ```

    rate_matrix <- function(ctmc) {

    from <- lst_to_list(ctmc$from) %>% unlist

    rate <- lst_to_list(ctmc$rate) %>% unlist

    to <- lst_to_list(ctmc$to) %>% unlist

    nodes <- c(from, to) %>% unique %>% unlist

    n <- length(nodes)

    Q <- matrix(0, nrow = n, ncol = n)

    rownames(Q) <- colnames(Q) <- nodes

    for (i in seq_along(from)) {

    Q[from[[i]], to[[i]]] <- rate[[i]]

    }

    diag(Q) <- - rowSums(Q)

    Q

    }

    ```


    Constructing a CTMC rate matrix using this small language is now as simple as
    this:


    ```

    Q <- ctmc() %>%

    add_edge("foo", 1, "bar") %>%

    add_edge("foo", 2, "baz") %>%

    add_edge("bar", 2, "baz") %>%

    rate_matrix()

    Q

    ##     bar foo baz

    ## bar  -2   0   2

    ## foo   1  -3   2

    ## baz   0   0   0

    ```


    Once we have translated the CTMC into this matrix, we can consider the language
    design over. However, integrating CTMC construction and the operations that we
    can do on a CTMC will be important for ease of use of the DSL and can be considered
    part of the language as well. In this particular case, the good news is that the
    actual language design is done for us. The pipe operator tells us how to combine
    our CTMCs with further processing—we just have to write functions that can be
    used in a pipe. For example, if we want to know the transition probabilities of
    the CTMC over a time interval—i.e., we want to know the probability of going from
    any one state to any other over a given time—we can add a function for that. The
    probabilities can be computed using matrix exponentiation (if you are not familiar
    with CTMC theory, just trust me on this). To make such a function compatible with
    a pipeline, we simply have to make the most likely data to come from the left
    in a pipe the first argument of the function. So, we could write this:


    ```

    transitions_over_time <- function(Q, t) {

    expm(Q * t)

    }

    P <- Q %>% transitions_over_time(0.2)

    P

    ## 3 x 3 Matrix of class "dgeMatrix"

    ##           bar       foo     baz

    ## bar 0.6703200 0.0000000 0.32968

    ## foo 0.1215084 0.5488116 0.32968

    ## baz 0.0000000 0.0000000 1.00000

    ```


    Even with the language constructions in place—the pipe operator—there is still
    some language design to be done. It is not always obvious what the flow of data
    will be through a pipe after all. An example is when we want to evolve vectors
    of state probability.


    ```

    probs <- c(foo=0.1, bar=0.9, baz=0.0)

    ```


    Is it more natural to have the probability vectors flow through the pipeline?


    ```

    evolve <- function(probs, Q, t) {

    probs %*% expm(Q * t)

    }

    evolve(probs, Q, 0.2)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    Or, would it be more natural to always have the CTMC (or its rate matrix) flow
    through the pipeline?


    ```

    evolve <- function(Q, t, probs) {

    probs %*% expm(Q * t)

    }

    Q %>% evolve(0.2, probs)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    The former might feel more natural if we think of the system evolving over time,
    but the latter would fit better with a pipeline where we construct the CTMC first,
    then translate it into a rate matrix, and finally evolve the system.


    ```

    ctmc() %>%

    add_edge("foo", 1, "bar") %>%

    add_edge("foo", 2, "baz") %>%

    add_edge("bar", 2, "baz") %>%

    rate_matrix() %>%

    evolve(0.2, probs)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    Only use cases and experimentation will tell us what the best language design
    is. But then, that is also what makes designing languages so interesting.'
  raw: '## Designing Semantics


    The reason we write domain-specific languages is to achieve some effect—we want
    to associate meaning, or semantics, to expressions in the DSL, and we want our
    DSL expressions to achieve some result, whether that is by executing some computations
    or by building some data structures. The purpose of a DSL merely is to provide
    a convenient interface to whatever semantics we want the language to have.


    If we always make our parsing code construct a parse tree, then the next step
    in processing the DSL involves manipulating this tree to achieve the desired effect.
    There might be several steps involved in this—for example, we rewrote expressions
    in the matrix expression example to optimize computations—but at the end of the
    processing we will execute the commands the DSL expression describes.


    Executing the DSL is sometimes straightforward and can be done as a final traversal
    of the parse tree. This is what we did with the matrix expressions where the purpose
    of the DSL was to rewrite expressions rather than evaluate them—the latter being
    a simple matter of multiplying and adding matrices. In other cases, it makes sense
    to separate the semantic model and the DSL by having a framework for the actions
    we want the language to execute. Having a framework for the semantics of the language
    lets us develop and test the semantic model separately from the language we use
    as an interface for it; it even allows us to have different input languages for
    manipulating the same semantic model—not that I recommend having many different
    languages to achieve the same goals.


    To illustrate this, we can consider a language for specifying a finite state continuous
    time Markov chain (CTMC).[⁶](#A465211_1_En_3_Chapter.html#Fn6) I chose this example
    because we have already implemented several versions of a finite state system
    when we implemented the graph DSL, and for a CTMC we just have to associate rates
    with all the edges. Continuous time Markov chains are used many places in mathematical
    modeling, and the implementation mostly comes down to specifying an instantaneous
    rate matrix. This is a matrix that specifies the rate at which we move from one
    state to another. Such a matrix should have non-negative values on all off-diagonal
    entries, and on the diagonal, we should have minus the sum of the other entries
    in the rows. In a framework where we use CTMCs, we would likely implement the
    functionality to work on rate matrices, but for specifying the CTMCs, a domain-specific
    language might be easier to use.


    Calling it the “semantics” of the language to translate graph specifications into
    a matrix might be stretching the word, but if we consider the DSL as a way of
    specifying models and the (imagined) framework that manipulates them as part of
    the language, then I think we can justify it. Using the language will consist
    of specifying the CTMC, translating it into the corresponding rate matrix, and
    then manipulating it as intended. The language part of it is the translation from
    the specification into a matrix.


    As for the graphs shown previously, we need to specify the edges in the chain.
    We need to have a rate associated with each edge, so the most natural syntax will
    be the pipe version—with this version it is simpler to specify three values for
    an edge: the “from” and “to” states and the rate. I will keep these in three different
    linked lists, just because it makes it easier to construct the matrix this way.


    We reuse these two functions we wrote in the previous chapter:


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    ```


    We then define the following functions for specifying CTMCs:


    ```

    ctmc <- function()

    structure(list(from = NULL,

    rate = NULL,

    to = NULL),

    class = "ctmc")

    add_edge <- function(ctmc, from, rate, to) {

    ctmc$from <- cons(from, ctmc$from)

    ctmc$rate <- cons(rate, ctmc$rate)

    ctmc$to <- cons(to, ctmc$to)

    ctmc

    }

    ```


    Translating the lists into a rate matrix is now simply a normal programming job.
    We collect the nodes from the “from” and “to” lists—we translate them into R lists
    first since those are easier to work with once we are done collecting elements—and
    we then get the unique node names. These become the rows and columns of the rate
    matrix, and we iterate through all the edges to insert the rates. After that,
    we set the diagonal, and we are done.


    ```

    rate_matrix % unique %>% unlist

    n <- length(nodes)

    Q <- matrix(0, nrow = n, ncol = n)

    rownames(Q) <- colnames(Q) <- nodes

    for (i in seq_along(from)) {

    Q[from[[i]], to[[i]]] <- rate[[i]]

    }

    diag(Q) <- - rowSums(Q)

    Q

    }

    ```


    Constructing a CTMC rate matrix using this small language is now as simple as
    this:


    ```

    Q %

    add_edge("foo", 1, "bar") %>%

    add_edge("foo", 2, "baz") %>%

    add_edge("bar", 2, "baz") %>%

    rate_matrix()

    Q

    ##     bar foo baz

    ## bar  -2   0   2

    ## foo   1  -3   2

    ## baz   0   0   0

    ```


    Once we have translated the CTMC into this matrix, we can consider the language
    design over. However, integrating CTMC construction and the operations that we
    can do on a CTMC will be important for ease of use of the DSL and can be considered
    part of the language as well. In this particular case, the good news is that the
    actual language design is done for us. The pipe operator tells us how to combine
    our CTMCs with further processing—we just have to write functions that can be
    used in a pipe. For example, if we want to know the transition probabilities of
    the CTMC over a time interval—i.e., we want to know the probability of going from
    any one state to any other over a given time—we can add a function for that. The
    probabilities can be computed using matrix exponentiation (if you are not familiar
    with CTMC theory, just trust me on this). To make such a function compatible with
    a pipeline, we simply have to make the most likely data to come from the left
    in a pipe the first argument of the function. So, we could write this:


    ```

    transitions_over_time % transitions_over_time(0.2)

    P

    ## 3 x 3 Matrix of class "dgeMatrix"

    ##           bar       foo     baz

    ## bar 0.6703200 0.0000000 0.32968

    ## foo 0.1215084 0.5488116 0.32968

    ## baz 0.0000000 0.0000000 1.00000

    ```


    Even with the language constructions in place—the pipe operator—there is still
    some language design to be done. It is not always obvious what the flow of data
    will be through a pipe after all. An example is when we want to evolve vectors
    of state probability.


    ```

    probs <- c(foo=0.1, bar=0.9, baz=0.0)

    ```


    Is it more natural to have the probability vectors flow through the pipeline?


    ```

    evolve % evolve(Q, 0.2)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    Or, would it be more natural to always have the CTMC (or its rate matrix) flow
    through the pipeline?


    ```

    evolve % evolve(0.2, probs)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    The former might feel more natural if we think of the system evolving over time,
    but the latter would fit better with a pipeline where we construct the CTMC first,
    then translate it into a rate matrix, and finally evolve the system.


    ```

    ctmc() %>%

    add_edge("foo", 1, "bar") %>%

    add_edge("foo", 2, "baz") %>%

    add_edge("bar", 2, "baz") %>%

    rate_matrix() %>%

    evolve(0.2, probs)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    Only use cases and experimentation will tell us what the best language design
    is. But then, that is also what makes designing languages so interesting.


    Footnotes [1](#A465211_1_En_3_Chapter.html#Fn1_source)'
  trans: '

    # 设计语义


    我们编写领域特定语言（DSL）是为了达到某种效果——我们希望将意义（即语义）与 DSL 中的表达式关联起来，并且期望 DSL 表达式能产生某种结果，无论是通过执行计算还是构建数据结构来实现。DSL
    的目的仅仅是为语言所需的任何语义提供一个便捷的接口。


    如果我们总是让解析代码构建一棵解析树，那么处理 DSL 的下一步就是操作这棵树以达到预期效果。其中可能涉及多个步骤——例如，我们在矩阵表达式示例中重写了表达式以优化计算——但在处理过程的最后，我们将执行
    DSL 表达式所描述的命令。


    执行 DSL 有时很直接，可以作为对解析树的最终遍历来完成。这就是我们在矩阵表达式中所做的——DSL 的目标是重写表达式而非求值，而求值本身只是简单的矩阵乘法和加法。在其他情况下，通过为语言要执行的操作建立一个框架，将语义模型与
    DSL 分离是合理的。为语言的语义建立框架，可以让我们独立于作为接口的语言来开发和测试语义模型；甚至允许我们使用不同的输入语言来操作同一个语义模型——不过我并不推荐为了达到相同目标而使用多种不同的语言。


    为了说明这一点，我们可以考虑一种用于指定有限状态连续时间马尔可夫链（CTMC）的语言。我选择这个例子是因为我们在实现图 DSL 时已经实现过有限状态系统的几个版本，而对于
    CTMC，我们只需为所有边关联速率。连续时间马尔可夫链广泛应用于数学建模中，其实现主要归结为指定一个瞬时速率矩阵。这是一个指定了从一个状态转移到另一个状态的速率的矩阵。这样的矩阵中，所有非对角线元素应为非负值，而对角线元素则应等于该行其他元素之和的相反数。在使用
    CTMC 的框架中，我们很可能会实现处理速率矩阵的功能，但在指定 CTMC 时，使用领域特定语言可能更方便。


    将图规范翻译成矩阵称之为语言的“语义”可能有些牵强，但如果我们把 DSL 视为一种指定模型的方式，并将（想象中的）操作这些模型的框架视为语言的一部分，那么我认为这是合理的。使用该语言包括指定
    CTMC、将其翻译成对应的速率矩阵，然后按预期操作它。语言部分的作用在于将规范翻译成矩阵。


    正如之前展示的图，我们需要指定链中的边。每条边都需要关联一个速率，因此最自然的语法是管道版本——用这个版本可以更简单地指定一条边的三个值：“从”状态、“到”状态和速率。我将把这三个值分别保存在三个不同的链表中，因为这样更容易构建矩阵。


    我们重用了上一章编写的这两个函数：


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    ```


    然后我们定义了以下用于指定 CTMC 的函数：


    ```

    ctmc <- function()

    structure(list(from = NULL,

    rate = NULL,

    to = NULL),

    class = "ctmc")

    add_edge <- function(ctmc, from, rate, to) {

    ctmc$from <- cons(from, ctmc$from)

    ctmc$rate <- cons(rate, ctmc$rate)

    ctmc$to <- cons(to, ctmc$to)

    ctmc

    }

    ```


    现在，将这些链表翻译成速率矩阵只是一个普通的编程任务。我们从“from”和“to”列表中收集节点——先将它们转换成 R 列表，因为一旦收集完元素，处理 R
    列表会更方便——然后获取唯一的节点名称。这些名称成为速率矩阵的行和列，接着我们遍历所有边来插入速率。之后，设置对角线元素，工作就完成了。


    ```

    rate_matrix <- function(ctmc) {

    from <- lst_to_list(ctmc$from) %>% unlist

    rate <- lst_to_list(ctmc$rate) %>% unlist

    to <- lst_to_list(ctmc$to) %>% unlist

    nodes <- c(from, to) %>% unique %>% unlist

    n <- length(nodes)

    Q <- matrix(0, nrow = n, ncol = n)

    rownames(Q) <- colnames(Q) <- nodes

    for (i in seq_along(from)) {

    Q[from[[i]], to[[i]]] <- rate[[i]]

    }

    diag(Q) <- - rowSums(Q)

    Q

    }

    ```


    现在，使用这个小语言构建 CTMC 速率矩阵就变得非常简单：


    ```

    Q <- ctmc() %>%

    add_edge("foo", 1, "bar") %>%

    add_edge("foo", 2, "baz") %>%

    add_edge("bar", 2, "baz") %>%

    rate_matrix()

    Q

    ##     bar foo baz

    ## bar  -2   0   2

    ## foo   1  -3   2

    ## baz   0   0   0

    ```


    一旦我们将 CTMC 翻译成这个矩阵，就可以认为语言设计完成了。然而，将 CTMC 的构建与我们可以对 CTMC 执行的操作集成在一起，对于 DSL 的易用性至关重要，并且也可以被视为语言的一部分。在这种特殊情况下，好消息是实际的语言设计已经为我们完成了。管道运算符告诉了我们如何将
    CTMC 与进一步的处理结合起来——我们只需编写可以在管道中使用的函数。例如，如果我们想知道 CTMC 在一段时间间隔内的转移概率——即我们想知道在给定时间内从任意一个状态转移到其他状态的概率——我们可以添加一个函数来实现。概率可以通过矩阵指数计算（如果你不熟悉
    CTMC 理论，请先相信我）。为了使这样一个函数与管道兼容，我们只需将管道中从左端传入的数据设为函数的第一个参数。因此，我们可以这样写：


    ```

    transitions_over_time <- function(Q, t) {

    expm(Q * t)

    }

    P <- Q %>% transitions_over_time(0.2)

    P

    ## 3 x 3 Matrix of class "dgeMatrix"

    ##           bar       foo     baz

    ## bar 0.6703200 0.0000000 0.32968

    ## foo 0.1215084 0.5488116 0.32968

    ## baz 0.0000000 0.0000000 1.00000

    ```


    即使有了语言结构（管道运算符），仍然有一些语言设计工作要做。毕竟，数据通过管道的流向并不总是显而易见。一个例子是当我们想要演化状态概率向量时。


    ```

    probs <- c(foo=0.1, bar=0.9, baz=0.0)

    ```


    将概率向量通过管道传递是否更自然？


    ```

    evolve <- function(probs, Q, t) {

    probs %*% expm(Q * t)

    }

    evolve(probs, Q, 0.2)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    或者，始终让 CTMC（或其速率矩阵）通过管道传递是否更自然？


    ```

    evolve <- function(Q, t, probs) {

    probs %*% expm(Q * t)

    }

    Q %>% evolve(0.2, probs)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    如果我们把系统看作随时间演化，前一种方式可能感觉更自然；但后一种方式更适合这样的管道：先构建 CTMC，然后将其翻译成速率矩阵，最后演化系统。


    ```

    ctmc() %>%

    add_edge("foo", 1, "bar") %>%

    add_edge("foo", 2, "baz") %>%

    add_edge("bar", 2, "baz") %>%

    rate_matrix() %>%

    evolve(0.2, probs)

    ## 1 x 3 Matrix of class "dgeMatrix"

    ##            bar        foo     baz

    ## [1,] 0.6154389 0.05488116 0.32968

    ```


    只有通过用例和实验，我们才能知道哪种语言设计才是最佳的。但话说回来，这也正是设计语言如此有趣的原因。

    '
- fmt: '# 4. Functions, Classes, and Operators


    Technically, what I refer to as grammar is syntax. Linguists use grammar to refer
    to both morphology and syntax, where syntax is the rules for stringing words together.
    In computer science, though, the term grammar is used as I use it here. Therefore,
    I will use syntax and grammar interchangeably.


    The purists might complain here and say that a parser will construct a parse tree
    and not an AST. The difference between the two is that a parse tree contains all
    the information in the input (such as parentheses, spaces, and so on) but not
    the meta-information about which grammatical structures it represents. The AST
    contains only the relevant parts of the input but includes grammatical information
    on top of that. If you want, you can consider first parsing and then translating
    the result into an AST as two separate steps in handling an input language. I
    consider them part of the same and will claim that a parser constructs an AST.


    Notice, however, that there is a distinction between giving a statement meaning
    and giving it the correct meaning. Just because your program computes something
    doesn’t mean it computes what you intended it to compute. When we construct a
    language, domain-specific or general, we can give meaning to statements, but we
    cannot—this is theoretically impossible—guarantee that it is the intended meaning.
    That will always be the responsibility of the programmer.


    Operator precedence is a term we use to describe how “tightly” different operators
    bind, i.e., which operators are invoked before others, or put in another way,
    where we implicitly set parentheses in an expression. Multiplication binds tighter
    than addition—has a higher precedence—so the expression `2*x + 4*y` is interpreted
    as `(2*x) + (4*y)` rather than, for example, `2*(x + (4*y))`. Precedence also
    tells us whether operators are evaluated left to right or right to left, so `x
    + y + z` is evaluated as `(x + y) + z` rather than `x + (y + z)` because `+` evaluates
    left to right. For addition, the left-to-right or right-to-left order doesn’t
    matter because we will end up with the same result, but for some operators it
    does, for example, exponentiation, which is evaluated left to right. So, `x**y**z`
    is `x**(y**z)`, which (usually) is different from `(x**y)**z`. If you use operators
    in a domain-specific language, the precedence of the operators will affect your
    language.


    We haven’t formally defined how we would specify non-literate tokens in the syntax
    we use for specifying grammars, and doing so will not make the example any clearer,
    so let’s just state that informally.


    If you are not familiar with continuous time Markov chains an informal description
    could be this: A CTMC is a graph where nodes represent states and edges transition
    between states, and each edge is annotated with the rate at which changes happen.
    The model is stochastic, so rates should be thought of as expectations of change
    over time. If we have a rate of 1 between states `s` and `t`, then for each time
    unit, we would expect to see one change from `s` to `t`. If we want to know the
    probability of being in state `t` at some time `t` if we are in state `s` at time
    =0, we cannot consider the states `s` and `t` in isolation. There might be other
    states we can go to from `s` and if we go to those, it might take a longer or
    shorter time to reach `t`, or there might be states we can continue to from `t`
    so we might go through `t` before time `t` but no longer be there. We have to
    take all edges and all rates into account. Figuring out the probability of being
    at state `t` at time `t` is therefore dependent on matrix operations, in particular
    matrix exponentiation.


    ## Functions, Classes, and Operators


    Everything you do in R, you do with functions. Consequently, if you want to implement
    a domain-specific language, you must do so by writing functions. All the actions
    that your new DSL should support must be implemented using functions, and should
    you want a special syntax for your DSL, you will have to write functions for parsing
    this syntax. When implementing an embedded DSL, as we shall see, much of the parsing
    can be outsourced to R’s parser. The price for this is some restrictions to the
    syntax for the DSL—the DSL must be syntactically valid R code. We cannot construct
    arbitrary syntaxes for embedded languages, but by using operator overloading or
    meta-programming and by defining new infix operators, we do have some flexibility
    in designing our DSLs.


    In the previous two chapters, we saw examples of how to use both operator overloading
    and meta-programming to treat R expressions as expressions in an embedded language.
    The purpose of this chapter is to go into the details of the operator option,
    while the next chapter will cover the possibility of explicitly manipulating expressions
    through meta-programming.


    ### The S3 Object-Oriented Programming System


    You could write a whole book about the object-oriented programming systems supported
    by R—I know because I have written such a book—but for operator overloading and
    implementing DSL parsers, we need only a few of the object orientation features,
    and this section will give you a quick introduction to those. We will use only
    the simplest object orientation system in this book, the S3 system. If you are
    already familiar with the S3 system, feel free to skip ahead to the next section.


    #### Objects and Classes


    The S3 system has a straightforward approach to object orientation. It lets us
    associate classes with any object (except for `NULL`). Classes are text strings
    with no structure, and you can get the classes associated with an object by calling
    the function `class`.


    ```r

    class(4)

    ## [1] "numeric"

    class("foo")

    ## [1] "character"

    class(TRUE)

    ## [1] "logical"

    class(sin)

    ## [1] "function"

    ```


    You can set the class of an object with the corresponding assignment function,
    shown here:


    ```r

    class(sin) <- "foo"

    class(sin)

    ## [1] "foo"

    ```


    without affecting what the object is or does.


    ```r

    sin(0)

    ## [1] 0

    ```


    There are some limits to which objects you can change the class of—you cannot
    change the class of literal numbers and strings, for example, so if you attempted
    this:


    ```r

    class(2) <- "character"

    class("foo") <- "numeric"

    ```


    you would get errors. Still, you are free to modify the classes of objects any
    time you want. The class associated with an object is just an attribute containing
    one or more class names—in the previous cases, all the objects have a single class,
    but the matrix expressions we created Chapter 2, for example, had multiple classes.
    Vectors of class names are used both for multiple inheritance and for single inheritance,
    and there is no formal class structure at all. You can set the classes any way
    you want. The class attribute is just a vector of strings that are interpreted
