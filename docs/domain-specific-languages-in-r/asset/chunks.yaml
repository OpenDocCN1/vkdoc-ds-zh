    `construction_printer` 中调用这个函数，该函数被赋值给我们定义的任何类型的专用 `print` 函数。


    这个函数并不复杂。我们首先检查对象是否具有 `constructor` 属性。严格来说，只有函数构造函数具备此属性——常量构造函数具有 `constructor_constant`
    属性，但 `attire` 函数如果收到唯一前缀时会自动选取属性，因此也能获取到。如果没有 `constructor` 属性，那就不是由我们语言定义的内容构造的元素，它必然是其他类型的值——我们只需将其转换为字符串并返回。为此，我们使用通用的
    `toString` 函数。该函数可将任何对象转换为字符串。它未必是对象的漂亮表示，但如果有需要，你可以对其进行特化。


