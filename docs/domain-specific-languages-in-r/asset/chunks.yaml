    So, the status is now that we have all the test conditions. We can take these
    test conditions, combine them with the expressions for evaluating the recursions,
    and construct a sequence of `if`-`else` expressions. If we construct an `if` call
    with two arguments, this is interpreted as the test condition and the value to
    compute when the test is true. If we construct a call with three arguments, the
    third is considered the `else` part of the statement. The simplest way to construct
    a sequence of `if`-`else` statements is, therefore, to start from the end of the
    list. We can translate the last case into an `if` statement without an `else`
    part—or we can make an `else` part that throws an error if we prefer. We can then
    iterate through the cases, at each case constructing a new `if` expression that
    takes the previous case as the `else` part. This idea can be implemented like
    this:


    ```

    make_recursion_case <- function(

    test_expr,

    value_expr,

    continue

    ) {

    if (rlang::is_null(continue)) {

    rlang::call2("if", test_expr, value_expr)

    } else {

    rlang::call2("if", test_expr, value_expr, continue)

    }

    }

    make_update_expr <- function(

    ranges,

    patterns,

    conditions,

    recursions

    ) {

    conditions <- make_condition_checks(

    ranges,

    patterns,

    conditions,

    recursions

    )

    continue <- NULL

    for (i in rev(seq_along(conditions))) {

    continue <- make_recursion_case(

    conditions[[i]], recursions[[i]], continue

    )

    }

    continue

    }

