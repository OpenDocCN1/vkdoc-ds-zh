    If we define `Ops.c`, then we define a function that will be called for all of
    these operators when used on an element of class `c`.


    ```

    Ops.c <- function(e1, e2) {

    cat(paste0("Ops.c (", .Generic, ")\n"))

    NextMethod()

    }

    z <- 2

    class(z) <- "c"

    z + 1

    ## Ops.c (+)

    ## [1] 3

    ## attr(,"class")

    ## [1] "c"

    1 + z

    ## Ops.c (+)

    ## [1] 3

    ## attr(,"class")

    ## [1] "c"

    z ^ 3

    ## Ops.c (^)

    ## [1] 8

    ## attr(,"class")

    ## [1] "c"

    ```


    The “magical” variable `.` `Generic` contains the name of the operator that is
    called, and calling `NextMethod` will dispatch to the relevant next implementation
    of the operator.


    If you implement both the `Ops` group generic and concrete implementations of
    some individual operator generics, then the latter takes precedence. If, for example,
    we have an object of class `a` and `c`, where we have defined addition for class
    `a` and have the group generic for `c`, the addition will invoke the `+.a` function.
    All other operators will invoke the `Ops.c` function.


    ```

    class(z) <- c("a", "c")

    1 + z

    ## Binary

    ## [1] 3

    ## attr(,"class")

    ## [1] "a" "c"

    2 * z

    ## Ops.c (*)

    ## [1] 4

    ## attr(,"class")

    ## [1] "a" "c"

    ```


    With `Ops` you have a method for catching all operators for which you do not explicitly
    write specialized generics.'
  trans: '

    # 运算符重载


    大多数运算符（箭头赋值运算符 `<-` 和 `->`，以及槽位和组件访问运算符 `@` 和 `$` 除外）都作为泛型函数运行，并且可以被重载。重载运算符的机制与实现新版本泛型函数的机制并无不同——如果你以正确的方式命名函数，当泛型函数被调用时，该函数就会被触发。


    例如，要定义对 `a` 对象的加法，我们需要定义 `+.a`，可以按如下方式实现：


    ```

    `+.a` <- function(e1, e2) {

    cat("+.a\n")

    NextMethod()

    }

    x + 2

    ## +.a

    ## [1] 3

    ## attr(,"class")

    ## [1] "c" "b" "a"

    ```


    在这里，我们打印一些输出，然后通过调用 `NextMethod` 来调用底层的数值加法——因为这里的对象 `x` 既是数值，也是类 `a` 的对象。使用 `NextMethod`
    非常重要。如果我们直接使用加法，就会再次调用 `+.a`。因此不要尝试这样做：


    ```

    `+.a` <- function(e1, e2) {

    cat("+.a\n")

    e1 + e2

    }

    ```


    这个函数会导致无限递归，这不是你想要的结果。


    重载运算符的方式与定义泛型函数的特化版本相同，但两者在分派方式上存在差异。对于标准泛型函数，你会根据第一个参数进行分派。而对于运算符，有一些启发式规则确保无论操作数的顺序如何，都会调用相同的函数。你可以轻易想象出，调试那些交换操作数顺序就会调用完全不同函数的程序是多么痛苦。在
    R 中不会发生这种情况，因为运算符与其他泛型函数并不完全相同。


    如果我们定义了 `+.a`，并尝试将一个数字加到 `x` 上，那么无论顺序如何，调用的都将是 `+.a` 函数。


    ```

    x + 3

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "c" "b" "a"

    3 + x

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "c" "b" "a"

    ```


    如果我们向 `x` 添加另一个不同类的对象，情况也是如此。


    ```

    x <- 1 ; y <- 3

    class(x) <- "a"

    class(y) <- "b"

    x + y

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "a"

    y + x

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "b"

    ```


    除非我们也为该类定义了加法运算符。


    ```

    `+.b` <- function(e1, e2) {

    cat("+.bn")

    NextMethod()

    }

    x + y

    ## Warning: Incompatible methods ("+.a", "+.b") for

    ## "+"

    ## [1] 4

    ## attr(,"class")

    ## [1] "a"

    y + x

    ## Warning: Incompatible methods ("+.b", "+.a") for

    ## "+"

    ## [1] 4

    ## attr(,"class")

    ## [1] "b"

    ```


    如果类 `a` 和类 `b` 都有各自的加法版本，那么我们需要一种方法来解决 `x+y` 和 `y+x` 应该调用哪个版本的问题。在这里，第一个操作数优先，因此它决定了调用哪个函数——对于这种混乱操作，你会得到一条理所应当的警告。


    你或许能想出其他规则来解决此类情况。例如，可以规定应调用最抽象的方法，因此如果 `x` 和 `y` 都属于类 `b`，但只有 `x` 也属于类 `a`，那么我们应该调用
    `+.b`。


    ```

    class(x) <- c("a","b")

    class(y) <- "b"

    ```


    不幸的是，在 S3 系统中你无法制定这样的规则。但在 S4 系统中是可行的，你可以在其中基于多个参数分派泛型函数，但这超出了本书的范围。我们将通过适当构建语法来确保避免需要添加定义了相同运算符的不同类对象的情况。


    不过请注意，多类与 `NextMethod` 的组合仍然像以前一样工作。在 S3 系统中，我们无法定义基于多个参数分派的泛型方法，但可以在评估运算符时使用
    `NextMethod` 调用多个方法。如果我们在对象 `x` 上调用 `+.a`，而 `x` 现在具有类 `a` 和 `b`，那么在该函数实现中对 `NextMethod`
    的调用将先调用 `+.b`，然后该函数再调用数值加法。


    ```

    class(x) <- c("a", "b")

    x + 2

    ## +.a

    ## +.bn

    ## [1] 3

    ## attr(,"class")

    ## [1] "a" "b"

    x + y

    ## Warning: Incompatible methods ("+.a", "+.b") for

    ## "+"

    ## [1] 4

    ## attr(,"class")

    ## [1] "a" "b"

    ```


    R 既有二元运算符，也有一元运算符。否定运算符 `!` 仅作为一元运算符存在，你可以通过定义一个接受单个参数的函数来为给定类特化它。


    ```

    `!.a` <- function(x) {

    cat("Not for a\n")

    NextMethod()

    }

    !x

    ## Not for a

    ## [1] FALSE

    ```


    但对于 `-` 和 `+` 运算符，我们使用相同的符号来表示一元和二元运算符。在这里，我们必须对两者使用相同的函数，因为我们识别运算符函数的唯一方式是通过其名称，而一元和二元运算符的名称是相同的。我们可以通过测试第二个参数是否缺失来确定该函数是作为一元运算符还是二元运算符的一部分被调用。如果缺失，则是一元运算符；否则是二元运算符。


    ```

    `+.a` <- function(e1, e2) {

    if (missing(e2)) {

    cat("Unary\n")

    } else {

    cat("Binary\n")

    }

    NextMethod()

    }

    class(x) <- "a"

    +x

    ## Unary

    ## [1] 1

    ## attr(,"class")

    ## [1] "a"

    2+x

    ## Binary

    ## [1] 3

    ## attr(,"class")

    ## [1] "a"

    ```


    ## 分组泛型函数


    还有另一种基于操作数类来重载运算符的方法：分组泛型函数。顾名思义，分组泛型函数将多个运算符分组。它们提供了一种方法，让我们可以定义单个函数来处理某一特定类型的所有运算符。对于算术和逻辑运算符（`+`、`-`、`*`、`/`、`^`、`%%`、`%/%`、`&`、`|`、`!`、`==`、`!=`、`<`、`<=`、`>=`
    和 `>`），相关的分组泛型函数是 `Ops`。


    如果我们定义 `Ops.c`，那么当类 `c` 的元素使用所有这些运算符时，都会调用我们定义的函数。


    ```

    Ops.c <- function(e1, e2) {

    cat(paste0("Ops.c (", .Generic, ")\n"))

    NextMethod()

    }

    z <- 2

    class(z) <- "c"

    z + 1

    ## Ops.c (+)

    ## [1] 3

    ## attr(,"class")

    ## [1] "c"

    1 + z

    ## Ops.c (+)

    ## [1] 3

    ## attr(,"class")

    ## [1] "c"

    z ^ 3

    ## Ops.c (^)

    ## [1] 8

    ## attr(,"class")

    ## [1] "c"

    ```


    “魔法”变量 `.Generic` 包含被调用运算符的名称，而调用 `NextMethod` 将分派到该运算符相关的下一个实现。


    如果你同时实现了 `Ops` 分组泛型函数和某些具体运算符泛型函数的具体实现，那么后者会优先。例如，如果我们有一个同时属于类 `a` 和 `c` 的对象，其中我们为类
    `a` 定义了加法，并为类 `c` 定义了分组泛型函数，那么加法运算将调用 `+.a` 函数。所有其他运算符将调用 `Ops.c` 函数。


    ```

    class(z) <- c("a", "c")

    1 + z

    ## Binary

    ## [1] 3

    ## attr(,"class")

    ## [1] "a" "c"

    2 * z

    ## Ops.c (*)

    ## [1] 4

    ## attr(,"class")

    ## [1] "a" "c"

    ```


    通过 `Ops`，你拥有一个方法来捕获所有你没有显式编写特化泛型函数的运算符。

