    作为使用构造语言的一个示例，我们可以将二叉树定义为：要么是一棵包含左子树和右子树的树，要么是一片叶子。


    ```

    tree := T(left : tree, right : tree) | L(value : numeric)

    我们可以使用构造函数创建一棵树：

    x <- T(T(L(1),L(2)),L(3))

    x

    ## T(left=T(left=L(value=1), right=L(value=2)), right=L(value=3))

    ```


    使用这些构造函数创建的值可以像列表一样访问——实际上它们就是列表——只需使用我们在类型规范中使用的变量名即可。


    ```

    x$left$left$value

    ## [1] 1

    x$left$right$value

    ## [1] 2

    x$right$value

    ## [1] 3

    ```


    不过，类型检查相当严格。我们要求传递给构造函数函数的值必须与规范中给出的类型一致——即它们必须继承自规范中的类——这在某些情况下可能会出问题，因为 R 在其他情况下通常只会直接进行值转换。例如，在
    `L` 构造函数的规范中，我们要求参数是 `numeric`。如果传入一个 `integer` 类型，就会报错。


    ```

    L(1L)

    ## Error: is_na(type) || inherits(arg, type) is not TRUE

    ```


    在这种情况下，我们可以使用不带类型的变体参数：


    ```

    tree := T(left : tree, right : tree) | L(value)

    L(1L)

    ## L(value=1)

    ```


    另一种解决方案是在规范中指定多个类型。如果你感兴趣，可以自行尝试。这里我就不赘述了，接下来进入模式匹配。


    ## 模式匹配


    我们想要实现模式匹配，使得像这样的表达式：


    ```

    cases(L(1),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 1

    ```


    应返回 1，因为模式 `L(v)` 与值 `L(1)` 匹配，我们返回 `v`，预期 `v` 被绑定为 1。同样，我们希望这个表达式返回 9，因为 `v`
    应绑定为 4，`w` 绑定为 5，并返回求值 `v + w` 的结果。


    ```

    cases(T(L(4), L(5)),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 9

    ```


    我们希望 `otherwise` 关键字表示匹配任何情况，并将其用作默认模式，因此在这个表达式中，我们希望返回 5。


    ```

    cases(T(L(1), T(L(4), L(5))),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 5

    ```


    模式匹配的语法使用了右箭头运算符。这个运算符通常是赋值。我们无法对箭头赋值进行特化，但仍可以在元编程函数中使用它。我们使用赋值运算符，原因与我们使用 `:=`
    运算符定义类型相同。由于赋值运算符优先级最低，我们无需担心运算符左右两侧的绑定紧密度。我们本也可以使用那个运算符，但我个人更喜欢用箭头来做匹配。它清晰地展示了不同模式映射到的结果。不过，使用
    `->` 运算符时需要小心，因为它实际上是 `<-` 的语法糖。这意味着一旦使用了 `->` 的表达式，我们实际看到的是对 `<-` 的调用，且左右两侧会互换。


    `cases` 函数接受可变数量的参数。第一个参数是我们要匹配的表达式，其余参数通过三点运算符捕获。这些表达式不应直接求值，因此我们将它们捕获为 quosure。然后遍历它们，将其拆分为左侧和右侧，并测试左侧是否与表达式匹配。用于测试模式的函数，若匹配则返回一个包含已绑定变量的环境，否则返回
    `NULL`。如果匹配成功，我们在匹配模式得到的环境作为上层作用域下，对 quosure 环境中的右侧表达式进行求值。


    ```

    cases <- function(expr, ...) {

    matchings <- quos(...)

    for (i in seq_along(matchings)) {

    eval_env <- get_env(matchings[[i]])

    match_expr <- quo_expr(matchings[[i]])

    stopifnot(match_expr[[1]] == "<-")

    test_expr <- match_expr[[3]]

    result_expr <- match_expr[[2]]

    match <- test_pattern(expr, test_expr, eval_env)

    if (!is_null(match))

    return(eval_tidy(result_expr, data = match, env = eval_env))

    }

    stop("No matching pattern!")

    }

    ```


    在 `test_pattern` 函数中，我们创建用于绑定匹配变量的环境。如果模式是 `otherwise`，则返回空环境——不绑定任何变量。否则，我们需要递归地探索模式和表达式。


    我们使用 `test_pattern_rec` 函数来完成此操作，但并非直接调用它。相反，我们使用一个名为 `callCC` 的函数。这个名称代表“带当前续延的调用”（call
    with current continuation），它有时会让不熟悉函数式编程的人感到困惑。不过这种困惑大可不必，因为这个函数所做的全部，就是提供一种方式，让我们可以返回到调用
    `callCC` 的那个点。

