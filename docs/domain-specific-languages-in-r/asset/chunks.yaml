- fmt: '## Expression Evaluation


    We want to do more than manipulate matrix expressions; we want to evaluate them.
    This is something we can do easily in a recursive way, using a generic function
    to handle the different cases once again.


    ```

    eval_matrix_expr <- function(expr) UseMethod("eval_matrix_expr")

    eval_matrix_expr.matrix_data <- function(expr) expr$data

    eval_matrix_expr.matrix_mult <- function(expr)

    eval_matrix_expr(expr$left) %*% eval_matrix_expr(expr$right)

    eval_matrix_expr.matrix_sum <- function(expr)

    eval_matrix_expr(expr$left) + eval_matrix_expr(expr$right)

    ```


    The base case, the `matrix_data` case, gives us an R object that should be a matrix.
    In the recursive calls, we use matrix multiplication (`%*%`) and addition (`+`)
    on the results of recursive calls, so what we apply to these operators on are
    R objects—which means that the `+` operator is not the operator we wrote to create
    `matrix_sum` objects.


    Since we are explicitly delaying the evaluation of matrix expressions so we can
    rearrange them for optimal evaluation, we need a way to trigger the actual evaluation,
    and this would be the natural place to rearrange an expression as well, so we
    write a function for that.


    ```

    v <- function(expr) eval_matrix_expr(rearrange_matrix_expr(expr))

    ```


    Of course, we can also combine the parsing—the meta-programming approach that
    we looked at earlier—and an evaluation of the expression. We can write a function
    for doing faster evaluation of an expression like this:


    ```

    fast <- function(expr) {

    v(build_matrix_expr(substitute(expr), parent.frame()))

    }

    ```


    As long as we stick to `%*%` and `+` operators, this function will evaluate to
    the same value as a plain matrix expression.


    ```

    all(A %*% B %*% C %*% D == fast(A %*% B %*% C %*% D))

    ## [1] TRUE

    ```


    However, it is not generally usable because we have changed the definition of
    `*`. You can modify the parser, though, and you have an optimizer for speeding
    up your matrix multiplications.


    ```

    res <- microbenchmark(A %*% B %*% C %*% D,

    fast(A %*% B %*% C %*% D))

    options(microbenchmark.unit="relative")

    print(res, signif = 3, order = "mean")

    ## Unit: relative

    ##                       expr min   lq mean median

    ##  fast(A %*% B %*% C %*% D) 1.0 1.00 1.00   1.00

    ##        A %*% B %*% C %*% D 5.8 5.79 5.09   5.85

    ##    uq  max neval

    ##  1.00 1.00   100

    ##  5.41 2.36   100

    ```


    The recursion in `build_matrix_expr` stops the first time it does not recognize
    a call object and creates a data object. A better implementation would try to
    go deeper and optimize as much of the expression as it could, but this is more
    an exercise in meta-programming than in domain-specific languages.


    As a DSL, matrix algebra is really simple. It’s so simple that you might not consider
    it a language at all perhaps, but it is; algebraic notation is a DSL that is so
    useful that we get so familiar with it that we forget how amazing it is compared
    to the alternative—prose. Still, what we have implemented in this chapter is very
    simple, and while we might use the meta-programming techniques for code optimization,
    we probably would not write a DSL for something as simple as this. Nevertheless,
    the example illustrates the phases in reading, analyzing, and evaluating expressions
    we see in most DSLs. The three phases can be simpler or more complex in other
    DSLs (the “analysis” step might be entirely missing), and they might be merged
    so parsing and evaluation are done as a single step, but conceptually these are
    the steps we usually see.


    # 3. Components of a Programming Language


    While this is not a book about compilers and computer languages in general, it
    will be helpful to have some basic understanding of the components of software
    that parse and manipulate computer languages—or at least domain-specific computer
    languages.


    When we write software for processing languages, we usually structure this such
    that the input gets manipulated in distinct phases from the raw input text to
    the desired result, a result that is often running code or some desired data structures.
    When processing an embedded DSL, however, there is not necessarily a clear separation
    between parsing your DSL, manipulating expressions in the language, and evaluating
    them. In many cases, embedded DSLs describe a series of operations that should
    be executed sequentially—this is, for example, the case with graphical transformations
    in `ggplot2` or data manipulation in `magrittr` and `dplyr`. When this is the
    case, you wouldn’t necessarily split evaluations of DSL expressions into a parsing
    phase and an evaluation phase; you can perform transformations one at a time as
    they are seen by the R parser. Conceptually, though, there are still two steps
    involved—parsing a DSL statement and evaluating it—and you have to be explicit
    about this with more complex DSLs. Even with simple DSLs, however, there are benefits
    to keeping the different processing phases separate. It introduces some overhead
    in programming as you need to represent the input language in some explicit form
    before you can implement its semantics, but it also allows you to separate the
    responsibility of the various processing phases into separate software modules,
    making them easier to implement and test.


    This chapter describes the various components of computer languages and the phases
    involved in processing a domain-specific language. We will use the following packages:


    ```

    library(magrittr) # for the %>% operator

    library(Matrix)   # for the `exam` function

    ```'
