- fmt: '# Manipulating Expressions


    We can do more than simply inspect expressions. We can also modify them or create
    new ones from within programs. You cannot modify the two primitive expressions,
    constants and symbols. They are simply data. We can, however, modify calls and
    pair lists, although the second is not something we would usually do. We work
    with pair lists when we create new functions, but usually we either create new
    pair lists to set the formal arguments of a function or take the arguments from
    another function; we rarely modify existing pair lists. In any case, both pair
    lists and calls can be assigned to by indexing into their components.


    To get it out of the way with, the following is an example where we modify a pair
    list. We can construct the expression for defining a function like this:


    ```

    f <- quote(function(x) 2 * x)

    f

    ## function(x) 2 * x

    ```


    This is an expression of the type “call”—it is a call to the function `function`
    that defines functions (try saying that fast)—and its second argument is the pair
    list that defines its arguments.


    ```

    f[[2]]

    ## $x

    ```


    If we assign to the elements in this pair list, we provide default arguments to
    the function. The values we assign must be quoted expressions.


    ```

    f[[2]][[1]] <- quote(2 * y)

    f

    ## function(x = 2 * y) 2 * x

    ```


    To change the names of function arguments, we must change the names of the pair
    list components. We can do this using the `names<-` function.


    ```

    names(f[[2]]) <- c("a")

    f[[3]] <- quote(2 * a)

    f

    ## function(a = 2 * y) 2 * a

    ```


    In this example, we also saw how we could modify the function body through its
    third component.


    Through this example, we have already seen all we need to know about how to modify
    call expressions. What we were modifying was simply a particular case of a call—the
    call to `function`. Any other call can be changed the same way.


    ```

    expr <- quote(2 * x + y)

    expr

    ## 2 * x + y

    expr[[1]] <- as.symbol("/")

    expr

    ## 2 * x/y

    expr[[2]][[1]] <- as.symbol("+")

    expr

    ## (2 + x)/y

    ```


    We can construct new call objects using the `call` function. As its first argument,
    this function takes the function to call. This can be a symbol or a string and
    will automatically be quoted. After that, you can give it a variable number of
    arguments that will be evaluated before they are put into the constructed expression.


    ```

    call("+", quote(2 * x), quote(y))

    ## 2 * x + y

    call("+", call("*", 2, quote(x)), quote(y))

    ## 2 * x + y

    ```


    If you are creating a call to a function with named arguments, rather than an
    operator, you can provide those to the `call` function as well.


    ```

    call("f", a = quote(2 * x), b = quote(y))

    ## f(a = 2 * x, b = y)

    ```


    It is essential that you quote the arguments if you do not want them evaluated.
    The `call` function will not do it for you.


    ```

    z <- 2

    call("+", 2 * z, quote(y))

    ## 4 + y

    ```


    In the `rlang` package you have two additional functions for creating calls. The
    function `lang` works as the `call` function except that you can specify a namespace
    in which the called function should be found. The `new_language` function lets
    you provide the call arguments as an explicit pair list.


    ```

    library(rlang)

    lang("+", quote(2 * x), quote(y))

    ## 2 * x + y

    new_language(as.symbol("+"), pairlist(quote(2 * x), quote(y)))

    ## 2 * x + y

    ```


    The `rlang` package is worth exploring if you plan to do much meta-programming
    in R. It provides several functions for manipulating and creating expressions
    and functions and for managing environments. We will explore the package more
    in Chapter [8](#A465211_1_En_8_Chapter.html).


    There is one extra complication if the call you are making is to `function`. This
    function needs a pair list as its second argument, so you will have to make such
    an object. If you want to create a function without default parameters, you need
    to make a list with “missing” elements at named positions. The way to make a missing
    argument is by calling `substitute` without arguments, so a function that creates
    a list of function parameters without default arguments can look like this:


    ```

    make_args_list <- function(args) {

    res <- replicate(length(args), substitute())

    names(res) <- args

    as.pairlist(res)

    }

    ```


    We can use it to construct a call to `function` like this:


    ```

    f <- call("function",

    make_args_list(c("x", "y")),

    quote(2 * x + y))

    f

    ## function(x, y) 2 * x + y

    ```


    Remember, however, that this is an expression for creating a function; it is not
    the function itself, and it does not behave like a function.


    ```

    f(2, 3)

    ## Error in f(2, 3): could not find function "f"

    ```


    The error message here looks a bit odd. R is not complaining that `f` is not a
    function but that the function `f` cannot be found. This is because R will look
    for functions when you use a symbol for a function call and will not confuse the
    value `f` with the function `f`. Here, we only have a value-version of `f`. Anyway,
    to get the actual function, we need to evaluate the call.


    ```

    f <- eval(f)

    f

    ## function (x, y)

    ## 2 * x + y

    f(2, 3)

    ## [1] 7

    ```


    A more direct way of creating a function is by using the `new_function` function
    from the `rlang` package.


    ```

    f <- new_function(make_args_list(c("x", "y")),

    quote(2 * x + y))

    f

    ## function (x, y)

    ## 2 * x + y

    f(2, 3)

    ## [1] 7

    ```


    As a final example, we can combine the expression creating methods we have seen
    with the expression exploration functions from the previous section to translate
    expressions with unbound variables into functions. We can collect all unbound
    variables in an expression using the `collect_symbols_` function from earlier
    and then use `new_function` to create the function.


    ```

    expr_to_function <- function(expr) {

    expr <- substitute(expr)

    unbound <- collect_symbols_(expr, caller_env())

    new_function(make_args_list(unbound), expr, caller_env())

    }

    ```


    Here, I have used another function from `rlang`, `caller_env`. This function does
    the same as the `parent.frame` we have used earlier but with a more informative
    name. I recommend using `caller_env` over `parent.frame` for that reason.


    We provide more arguments in this call to `new_function` than in the previous
    example where we used it. There, we provided only two arguments, the parameters
    of the function and its body. Here, we also provide its environment. This will
    be the function’s enclosing environment. It is here that the function will find
    the value of variables that are not local to the function itself or parameters
    to the function. Since we consider variables found in the caller environment as
    bound, we have to make sure that the function we create can also find them, so
    we put the function in the same environment. If this explanation is unclear to
    you, then return to this example after you have read Chapter [7](#A465211_1_En_7_Chapter.html)
    where we go into environments in much more detail. It should, ideally, be clearer
    then.


    `expr_to_function` does exactly what we intended it to do. It creates a function
    from an expression, whose arguments are the unbound variables.


    ```

    f <- expr_to_function(2 * x + y)

    f

    ## function (y, x)

    ## 2 * x + y

    f(x = 2, y = 3)

    ## [1] 7

    g <- expr_to_function(function(x) 2 * x + y)

    g

    ## function (y)

    ## function(x) 2 * x + y

    g(y = 3)(x = 2)

    ## [1] 7

    ```


    The order of the variables in the function will depend on the order in which they
    appear in the expression and in whatever order the unique function will leave
    them in. Therefore, calling the resulting function is best done with named arguments.


    Footnotes [1](#A465211_1_En_5_Chapter.html#Fn1_source)


    The `substitute` function will replace variables by the value they contain in
    the current scope or the value they have in an environment you provide as a second
    argument, except for variables in the global environment. Those variables are
    left alone. If you experiment with `substitute`, be aware that it behaves differently
    inside the scope of a function from how it behaves in the global scope.'
  raw: '## Manipulating Expressions


    We can do more than simply inspect expressions. We can also modify them or create
    new ones from within programs. You cannot modify the two primitive expressions,
    constants and symbols. They are simply data. We can, however, modify calls and
    pair lists, although the second is not something we would usually do. We work
    with pair lists when we create new functions, but usually we either create new
    pair lists to set the formal arguments of a function or take the arguments from
    another function; we rarely modify existing pair lists. In any case, both pair
    lists and calls can be assigned to by indexing into their components.


