  trans: '

    # 指定语法


    由于我们使用 R 来解析表达式，因此在哪些内容可以被视为词法单元方面没有太多灵活性，并且我们能够实现的语法类型也存在一些限制。不过，在如何组合函数和运算符方面，我们对语法仍有一定的灵活度。


    为了在本书中指定语法，我将采用传统方法，通过描述在特定语法内生成有效句子的"规则"来实现。请考虑以下语法：


    ```

    EXPRESSION ::= NUMBER

    |  EXPRESSION ''+'' EXPRESSION

    |  EXPRESSION ''*'' EXPRESSION

    |  ''('' EXPRESSION '')''

    ```


    该语法描述了生成表达式的规则，这些表达式由数字的加法和乘法组成，并使用括号对表达式进行分组。


    你应该这样理解："一个表达式要么是一个数字，要么是两个表达式的和，要么是两个表达式的积，要么是一个带括号的表达式"。这个定义是递归的——用一个表达式来定义另一个表达式——但我们有一个基础情形，即数字，它让我们能够创建一个基础表达式，并且从这个基础表达式出发，我们可以生成更复杂的表达式。


    我在这里用于指定语法的语法本身也是一种语法——如果你愿意，可以称之为元语法。你应该这样理解：我们要定义的语法对象位于 `::=` 对象的左侧。之后，我们有一个或多个构造此类对象的方式序列，彼此之间用
    `|` 分隔。这些用于构造我们所定义对象的规则，将是其他语法对象的一个序列。它们可以是我们通过其他规则定义的对象（我会将其全部用大写字母表示，并称之为元变量），也可以是具体的词法单元（我会用单引号括起来，比如第二个创建和的规则中的
    `''+''`）。这种表示法包含的信息与我在图 3-1 中使用的图形表示法相同，在该图形中，元变量以斜体显示，具体词法单元则放在灰色框中。


    像这样的元语法被用来正式地定义语言，并且有许多工具可以让你根据元语法中的语法规范自动创建解析器。我会以非正式的方式使用这种自制的元语法。我将其作为一种简洁的方法来描述我们创建的
    DSL 的语法，或者仅仅是语法的伪代码。


    为了创建一个表达式，我们必须遵循元语法规则，使用提供的四种替代方案之一：要么将表达式简化为一个数字（一个和或积），要么创建另一个带括号的表达式。例如，我们可以依次应用这些规则，得到以下结果：


    ```

    EXPRESSION > EXPRESSION ''*'' EXPRESSION                     (3)

    > ''('' EXPRESSION '')'' ''*'' EXPRESSION             (4)

    > ''('' EXPRESSION ''+'' EXPRESSION '')'' ''*'' EXPRESSION (2)

    > ''('' number[2] ''+'' number[2] '')'' ''*'' number[3]  (1x3)

    ```


    这让我们能够根据规则构造出表达式 `(2 + 2) * 3`。


    如果存在多种方式可以从元变量转换到相同的终结规则序列（即有规则可以导出完全相同的词法单元序列），那么我们就会在解释语言时遇到问题。相同的词法单元序列可能被解释为指明两个不同的语法对象。对于表达式语法，当我们遇到像
    `2 + 2 * 3` 这样的表达式时，就会产生歧义。我们可以用两种不同的方式解析这个表达式，具体取决于我们从元变量 `EXPRESSION` 推导到具体表达式时应用了哪些规则。我们可以先应用乘法规则，得到相当于
    `(2 + 2) * 3` 的结果；或者可以先应用加法规则，得到 `2 + (2 * 3)`。根据传统的数学符号，我们知道应该得到第二个表达式，因为乘法比加法具有更高的优先级⁴，所以
    `*` 符号将 2 和 3 结合得比 `+` 将 2 和 2 结合得更紧密，但语法并不能保证这一点。这种语法是有歧义的。


    可以通过将语法修改如下来解决这个问题：


    ```

    EXPRESSION ::= TERM ''+'' EXPRESSION | TERM

    TERM ::= TERM ''*'' FACTOR | FACTOR

    FACTOR ::= ''('' EXPR '')'' | NUMBER

    ```


    这是一个更复杂的语法，它允许你创建相同的表达式，但通过三个元变量来相互递归定义。它的结构确保了乘积自然比和结合得更紧密——构造表达式 `2 + 2 * 3`
    的唯一方式就是图 3-2 中所示的解析树。我们应用规则的顺序可以变化，但解析树始终是这种形式，并且乘积比和结合得更紧密。


    ![A465211_1_En_3_Fig2_HTML.png](img/A465211_1_En_3_Fig2_HTML.png)


    图 3-2


    `2 + 2 * 3` 的解析树


    出于显而易见的原因，无歧义的语法比有歧义的语法更可取，但创建无歧义语法可能会使语法的规范变得复杂，正如我们在表达式中所见。这可以通过制作一个更智能的解析器来缓解，该解析器可以考虑运算符优先级等因素，或者在解析字符串时跟踪上下文。无论我们是编写更智能的解析器还是无歧义的语法，我们都不会长时间处理像图
    3-2 中那样复杂的表达式树——这棵树显式地展示了所有语法元变量，但在实践中，我们会在解析之后、处理表达式之前对其进行简化。


    在编写嵌入式 DSL 时，我们必须使用 R 的解析器，并且必须遵守其规则。如果你完全编写自己的解析器，可以在解析词法单元序列时传递上下文，但如果你想利用 R
    的解析器并创建嵌入式 DSL，那么最好确保所有语法上有效的词法单元序列都能无歧义地指向一个语法元变量。优先级歧义以及结合性都将由 R 来处理——这意味着 `1
    + 2 + 3 + 4` 会被解释为 `(((1 + 2) + 3) + 4)`。利用 R 的解析规则将使我们能够构建这样的语言：只要我们稍加注意语言的设计，每个表达式都能唯一地匹配一个解析器元变量。


    作为不仅仅是表达式的语法示例，想象一下我们想要一种用于指定图的语言——这里的图是指网络或状态机，而不是绘图。我们可以定义一个用于有向无环图（DAG）的语法，规定一个
    DAG 要么是一个空图，要么是一个图后跟一条边。


    ```

    DAG ::= ''dag()'' | DAG ''+'' EDGE

    ```


    我们使用函数 `dag()` 创建一个空 DAG。调用此函数会将我们带入图规范 DSL 中，并为我们提供一个可用于在 R 中编程语法操作的对象。我们将使用加号运算符来向
    DAG 添加边。这是一个有点随意的选择，但它使解析器的实现变得容易，因为我们只需重载通用的 `+` 函数即可。对于边，我们保持简单，只要求有一个"起始节点"和一个"目标节点"。我们可以定义自己的中缀运算符来创建它们。


    ```

    EDGE ::= NODE ''%=>%'' NODE

    ```


    我们不能定义任意我们想要的中缀运算符——例如，如果我们想让运算符是 `==>`，那么我们会遇到麻烦，因为 R 的解析器会将其解释为两个词法单元：`==` 和
    `>`。不过，只要我们将其命名为以百分号开头和结尾的名称，我们总是可以定义自己的运算符。我们也可以通过重载来重用现有的中缀运算符，就像我们用加号将边添加到
    DAG 那样，但对于这种图形语法，如果我们尝试这样做，可能会遇到一些问题，我们将在后面看到。对于节点，我们现在不进行更多展开。它们是原子词法单元——例如，我们可以要求它们为字符串。⁵

    '
- fmt: 'We will dig more into writing parsers in the next chapter, but for this simple
    language we can quickly create one. The parser needs to collect edges, so we will
    use linked lists for this, and it is natural to make an empty DAG contain an empty
    list of edges. Then, adding edges to a DAG means prepending them to this list.
    Such an implementation is as simple as this:


    ```

    cons %` <- function(from, to) c(from, to)

    `+.dag` <- function(dag, edge) {

    dag$edges <- cons(edge, dag$edges)

    dag

    }

    ```


    With only these four functions, we can create a DAG using syntax like this:


    ```

    dag() +

    "foo" %=>% "bar" +

    "bar" %=>% "baz"

    ```


    It might not be the best syntax we can come up with, but it’s easier to read than
    nested function calls.


    ```

    add_edge <- function(dag, from, to) {

    dag$edges <- cons(c(from, to), dag$edges)

    dag

    }

    add_edge(add_edge(dag(), "foo", "bar"), "bar", "baz")

    ```


    Using the pipe operator from `magrittr` might be even more readable, though, for
    people familiar with it.


    ```

    dag() %>% add_edge("foo", "bar") %>% add_edge("bar", "baz")

    ```


    In any case, we have built a small language that we can parse by defining only
    four functions—three if we discount the list `cons` function, which isn’t specific
    to the language.


    We used `%=>%` to construct edges. Could we use `=>` instead? The short answer
    is no. R’s parser will consider this two tokens, `=` and `>`, and although we
    could define a function with that name, using backquotes to make it a valid identifier,
    we wouldn’t get an infix operator.


    ```

    `=>` `("foo", "bar")

    "foo" => "bar"

    ## Error: :3:8: unexpected ''>''

    ## 2: `=>`("foo", "bar")

    ## 3: "foo" =>

    ##           ^

    ```


    If we want to have an infix operator that does not use percentage signs, we have
    to overload one of the operators that R already has—and `=>` is not one of them
    (greater-than-or-equal is `>=`).


    Could we use `>` instead then? This is an R infix operator, and, therefore, we
    can overload it. We just need a type for a node to do this. If we keep nodes specified
    as strings, we would have to change the string operator, and we do not want to
    do that—it could potentially break a lot of existing code—so the best approach
    would be to define a node class to work with.


    ```

    node .node` <- function(from, to) c(from, to)

    ```


    With these functions, we can create an edge with this syntax:


    ```

    node("foo") > node("bar")

    ## [1] "foo" "bar"

    ```


    Changing a `%` infix operator to `>` changes the precedence, however. A `%` operator
    has higher precedence than `+`, which is why we got edges that we could add to
    the DAG earlier, but `>` has lower precedence than `+`, so we add the left node
    to the DAG first and only then invoke the `>` operator.


    ```

    dag() + node("foo") > node("bar")

    ## $edges

    ## $edges$car

    ## [1] "foo"

    ## attr(,"class")

    ## [1] "node"

    ##

    ## $edges$cdr

    ## NULL

    ##

    ##

    ## [[2]]

    ## [1] "bar"

    ```


    We can fix this using parentheses, of course.


    ```

    dag() + (node("foo") > node("bar"))

    ## $edges

    ## $edges$car

    ## [1] "foo" "bar"

    ##

    ## $edges$cdr

    ## NULL

    ##

    ##

    ## attr(,"class")

    ## [1] "dag"

    ```


    It is not particularly safe to rely on programmers to remember parentheses, so
    a better solution is to get the precedence right. We can do that by choosing a
    different operator for adding edges to DAGs. If we replace `+` with `|`, for example,
    we get the right behavior since `|` has lower precedence than `>`.


    ```

    `|.dag`  node("bar")

    ## $edges

    ## $edges$car

    ## [1] "foo" "bar"

    ##

    ## $edges$cdr

    ## NULL

    ##

    ##

    ## attr(,"class")

    ## [1] "dag"

    ```


    There are pros and cons to using operator overloading. Having to change string
    tokens into node tokens requires more typing, but on the other hand, we can use
    this to validate expressions while we parse them and make sure that nodes are
    strings.


    Alternatively, we could use meta-programming and explicitly traverse expressions
    to make sure that the `>` operator will be the edge-creating operator instead
    of string comparison, similar to how we rewrote matrix expressions in the previous
    chapter.


    Returning to the `magrittr` solution for a brief moment, I think it is worth mentioning
    that designing a language is not all about defining new syntax. The language we
    are defining here, for specifying graphs, is doing the same as the pipe operator
    does, so in this particular case, we do not need to specify a new grammar to get
    all the benefits we want to achieve. When using pipes, we avoid the nested function
    calls that would make our code hard to read, and we can specify a DAG as a list
    of edges that we add to it. The pipe operator will be familiar to most programmers,
    and best of all, if we use it, we do not need to implement any parsing code. We
    are still creating a DSL, though, when we define the functions to manipulate a
    DAG. Providing functions that give you a vocabulary to express domain ideas is
    also language design. The `dplyr` package is an example of this—it is used together
    with the pipe operator to string various operations together, so it does not provide
    much in terms of new syntax, but it provides a very strong language for specifying
    data manipulation.


    Of the various solutions we have explored, I prefer the pipe-based. It makes it
    easy to extend edge information to more than a “from” node and a “to” node—which
    is hard with a binary operator—and we can implement it without any language code;
    we just have to make the DAG the first argument to all the manipulation functions
    we would add to the language. Of course, this solution is possible only because
    the language we considered was a simple string of operations. This is not always
    the case, so sometimes we do need to do a bit more work.'
