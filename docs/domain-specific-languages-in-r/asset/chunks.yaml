    ## 元编程解析


    使用像`m`这样的显式函数来引导我们进入矩阵表达式语言，是利用 R 自身解析器为我们服务的最简单方法，但这并非唯一方法。在 R 中，我们可以像操作数据一样操作表达式，这一特性称为元编程，我们会在第
    5 章中再次讨论。目前，只需知道表达式可以递归地探索即可。我们可以使用谓词`is.name`来检查表达式是否引用了一个变量，使用谓词`is.call`来检查它是否是一个函数调用——所有运算符都是函数调用。因此，给定一个不使用`m`函数、从而未进入我们
    DSL 的表达式，我们可以将其转换为如下形式：


    ```

    build_matrix_expr <- function(expr) {

    if (is.name(expr)) {

    return(substitute(m(name), list(name = expr)))

    }

    if (is.call(expr)) {

    if (expr[[1]] == as.name("("))

    return(build_matrix_expr(expr[[2]]))

    if (expr[[1]] == as.name("*") ||

    expr[[1]] == as.name("%*%")) {

    return(call(''*'',

    build_matrix_expr(expr[[2]]),

    build_matrix_expr(expr[[3]])))

    }

    if (expr[[1]] == as.name("+")) {

    return(call(''+'',

    build_matrix_expr(expr[[2]]),

    build_matrix_expr(expr[[3]])))

    }

    }

    stop(paste("Parse error for", expr))

    }

    ```


    在这个实现中，我们同时考虑了`*`和`%*%`矩阵乘法，这样我们就能将使用了矩阵乘法的 R 表达式视为此类。另请注意，我们考虑了括号调用。在 R 中，括号也是函数调用，如果我们希望语言允许使用括号，就必须处理它们——就像这里，我们只是继续递归。当我们使用`m`和运算符重载显式编写表达式时，我们不必担心这一点，因为
    R 已经负责赋予括号正确的语义。


