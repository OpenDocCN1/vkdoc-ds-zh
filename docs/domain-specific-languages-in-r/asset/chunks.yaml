    # 10. Continuous-Time Markov Chains


    We now turn to an example of a domain-specific language where we combine tidy
    evaluation and the `magrittr` pipe operator. We will write a language for specifying
    continuous-time Markov chains (CTMCs) and for computing the likelihood of parameters
    in such CTMCs given a trace of which states the chain is in at different time
    points. As with the list comprehension example in the previous chapter, we are
    not going to use operators to create a new syntax for the language but will create
    a DSL by providing functions that can be strung together to construct “sentences.”


    We will use the packages `magrittr` and `rlang` to construct the language, the
    package `tibble` for data frames, and the package `expm` for matrix exponentiation.


    ```

    library(magrittr)

    library(rlang)

    library(tibble)

    library(expm)

    ```


    We will reuse the linked list code plus the functions `collect_symbols_rec` and
    `make_args_list` we implemented in previous chapters.


    ```

    cons <- function(car, cdr) list(car = car, cdr = cdr)

    lst_length <- function(lst) {

    len <- 0

    while (!is.null(lst)) {

    lst <- lst$cdr

    len <- len + 1

    }

    len

    }

    lst_to_list <- function(lst) {

    v <- vector(mode = "list", length = lst_length(lst))

    index <- 1

    while (!is.null(lst)) {

    v[[index]] <- lst$car

    lst <- lst$cdr

    index <- index + 1

    }

    v

    }

    collect_symbols_rec <- function(expr, lst, bound) {

    if (is.symbol(expr) && expr != "") {

    if (as.character(expr) %in% bound) lst

    else cons(as.character(expr), lst)

    } else if (is.pairlist(expr)) {

    for (i in seq_along(expr)) {

    lst <- collect_symbols_rec(expr[[i]], lst, bound)

    }

    lst

    } else if (is.call(expr)) {

    if (expr[[1]] == as.symbol("function"))

    bound <- c(names(expr[[2]]), bound)

    for (i in 1:length(expr)) {

    lst <- collect_symbols_rec(expr[[i]], lst, bound)

    }

    lst

    } else {

    lst

    }

    }

    make_args_list <- function(args) {

    res <- replicate(length(args), substitute())

    names(res) <- args

    as.pairlist(res)

    }

    ```


    We will use these functions to construct functions from a CTMC specification by
    extracting the unbound symbols in expressions we associate with transition rates.
    We will not use the `collect_symbols` function we implemented to collect unbound
    variables but instead a version that expects its expression is quoted already.


    ```

    collect_symbols_q % lst_to_list() %>% unique() %>%

    purrr::discard(exists, env) %>%

    unlist()

    }

    ```


    This is because we plan to quote expressions in the DSL functions and then call
    this function with these quoted expressions.


    ## Constructing the Markov Chain


    We explored several approaches to design a language for CTMCs in Chapter [3](#A465211_1_En_3_Chapter.html).
    In this chapter, we will use the variation that uses the pipe operator, `%>%`,
    together with an `add_edge` function. We will collect edges in three lists: one
    list for the “from” states, one for the “to” states, and one for the rates associated
    with the transitions. Also, we will collect the unbound variables in the rate
    expressions when we create new edges, so later changes to scopes will not affect
    the parameters of the CTMC model. To represent a CTMC, we create a class and a
    list that holds the “from” state, “to” state, rates, and parameters lists.


    ```

    ctmc <- function()

    structure(list(from = NULL,

    rate = NULL,

    to = NULL,

    params = NULL),

    class = "ctmc")

    ```


    We want the syntax for constructing a CTMC to look like this:


    ```

    m %

    add_edge(foo, a, bar) %>%

    add_edge(foo, 2*a, baz) %>%

    add_edge(foo, 4, qux) %>%

    add_edge(bar, b, baz) %>%

    add_edge(baz, a + x*b, qux) %>%

    add_edge(qux, a + UQ(x)*b, foo)

    ```


    Therefore, we need to implement the `add_edge` such that it takes four arguments:
    the CTMC, the “from” state, the rate of the transition, and the “to” state. The
    CTMC is implicitly provided to the function calls when we are using the pipe operator.
    The other three arguments should be provided as expressions, and the `add_edge`
    function will implement a non-standard evaluation to handle them.


    We want the “from” and “to” states to be single symbols, but we will translate
    these into strings that we can use as row and column names in the rate matrix
    for the CTMC. The rate associated with a transition should be an expression, and
    to get the scope of the expression right, we will translate it into a quosure.
    We will then extract the unbound variables in this expression—unbound in the environment
    in which the quosure is defined—and add them to the parameters of the model. The
    implementation looks like this:


    ```

    add_edge <- function(ctmc, from, rate, to) {

    from <- enexpr(from); stopifnot(is_symbol(from))

    to <- enexpr(to); stopifnot(is_symbol(to))

    from <- as_string(from)

    to <- as_string(to)

    ctmc$from <- cons(from, ctmc$from)

    ctmc$to <- cons(to, ctmc$to)

    r <- enquo(rate)

    ctmc$rate <- cons(r, ctmc$rate)

    ctmc$params <- cons(collect_symbols_q(get_expr(r), get_env(r)),

    ctmc$params)

    ctmc

    }

    ```


    We use `enexpr` for `from` and `to` since we want these symbols to be just that,
    symbols, and not something we will want to evaluate in any context. We use `enquo`
    for the `rate` parameter, on the other hand, because we do want to have its environment
    available when we evaluate the expression. We do not evaluate it yet, though.
    We cannot evaluate it until we know the parameters for the model, and we do not
    want those to be fixed inside the CTMC object. We use the rate environment, however,
    when extracting the unbound variables in the rate expression.


    Generally, it is a good idea to be able to get some information about an object
    we construct by printing it, but the default print function for a `ctmc` object
    will show the list of lists. This representation, especially for the linked lists,
    can be hard to decipher. Instead, we can implement a print function for this class
    by defining a function with the name `print.ctmc`. The information we want to
    display is the parameters of the model and the edge structure, and we can implement
    this function like this:


    ```

    print.ctmc % rev()

    to % rev()

    rate % rev()

    parameters %

    unlist() %>% unique() %>% rev()

    cat("CTMC:\n")

    cat("parameters:", paste(parameters), "\n")

    cat("transitions:\n")

    for (i in seq_along(from)) {

    cat(from[[i]], "->", to[[i]],

    "\t[", deparse(get_expr(rate[[i]])), "]\n")

    }

    cat("\n")

    }

    ```'
  trans: "\n在这里，我们通过列表推导将列表 `x` 和 `y` 中的元素配对，然后使用 `bind` 合并列表。必须结合使用 `do.call` 和 `bind`\
    \ 才能从中得到表格，而花括号则是必要的，以便将 `lc` 的结果作为 `do.call` 的第二个参数（而非第一个参数）。关于如何将花括号与管道运算符一起使用的说明，请参阅\
    \ `magrittr` 文档。\n\n列表推导是另一个例子，说明极少量的代码就能创造出一种新的语言结构。将其称为一种语言可能有些牵强，但我们确实在创造一种新的语法来帮助我们编写更易读的代码——当然，前提是你认为列表推导比\
    \ `map` 和 `filter` 的组合更易读。\n\n# 10. 连续时间马尔可夫链\n\n现在，我们来看一个特定领域语言的例子，它将整洁求值与 `magrittr`\
    \ 管道运算符结合在一起。我们将编写一种语言，用于指定连续时间马尔可夫链（CTMC），并根据链在不同时间点所处状态的轨迹，计算此类 CTMC 中参数的似然。与上一章中的列表推导示例一样，我们不会使用运算符为语言创建新的语法，而是通过提供可串联起来构建“句子”的函数来创建一种领域特定语言（DSL）。\n\
    \n我们将使用 `magrittr` 和 `rlang` 包来构建语言，使用 `tibble` 包处理数据框，并使用 `expm` 包进行矩阵指数运算。\n\
    \n```\nlibrary(magrittr)\nlibrary(rlang)\nlibrary(tibble)\nlibrary(expm)\n```\n\
    \n我们将重用链表代码，以及前面章节中实现的 `collect_symbols_rec` 和 `make_args_list` 函数。\n\n```\ncons\
    \ <- function(car, cdr) list(car = car, cdr = cdr)\nlst_length <- function(lst)\
    \ {\nlen <- 0\nwhile (!is.null(lst)) {\nlst <- lst$cdr\nlen <- len + 1\n}\nlen\n\
    }\nlst_to_list <- function(lst) {\nv <- vector(mode = \"list\", length = lst_length(lst))\n\
    index <- 1\nwhile (!is.null(lst)) {\nv[[index]] <- lst$car\nlst <- lst$cdr\nindex\
    \ <- index + 1\n}\nv\n}\ncollect_symbols_rec <- function(expr, lst, bound) {\n\
    if (is.symbol(expr) && expr != \"\") {\nif (as.character(expr) %in% bound) lst\n\
    else cons(as.character(expr), lst)\n} else if (is.pairlist(expr)) {\nfor (i in\
    \ seq_along(expr)) {\nlst <- collect_symbols_rec(expr[[i]], lst, bound)\n}\nlst\n\
    } else if (is.call(expr)) {\nif (expr[[1]] == as.symbol(\"function\"))\nbound\
    \ <- c(names(expr[[2]]), bound)\nfor (i in 1:length(expr)) {\nlst <- collect_symbols_rec(expr[[i]],\
    \ lst, bound)\n}\nlst\n} else {\nlst\n}\n}\nmake_args_list <- function(args) {\n\
    res <- replicate(length(args), substitute())\nnames(res) <- args\nas.pairlist(res)\n\
    }\n```\n\n我们将使用这些函数，通过提取与转移速率相关的表达式中未绑定的符号，从 CTMC 规范中构造函数。我们不会使用之前实现的 `collect_symbols`\
    \ 函数来收集未绑定的变量，而是使用一个期望其表达式已被引用的版本。\n\n```\ncollect_symbols_q <- function(expr,\
    \ env) {\nexpr %>%\n    collect_symbols_rec(lst = NULL, bound = names(env)) %>%\n\
    \    lst_to_list() %>%\n    unique() %>%\n    purrr::discard(exists, env) %>%\n\
    \    unlist()\n}\n```\n\n这是因为我们计划在领域特定语言（DSL）函数中引用表达式，然后使用这些被引用的表达式来调用此函数。\n\n\
    ## 构造马尔可夫链\n\n在第 3 章中，我们探讨了几种为连续时间马尔可夫链（CTMC）设计语言的方法。在本章中，我们将使用一种变体，该变体将管道运算符\
    \ `%>%` 与 `add_edge` 函数结合使用。我们将边收集在三个列表中：一个用于“起始”状态，一个用于“目标”状态，一个用于与转移相关的速率。此外，当我们创建新边时，我们会在速率表达式中收集未绑定的变量，这样后续作用域的变化就不会影响\
    \ CTMC 模型的参数。为了表示 CTMC，我们创建一个类和一个包含“起始”状态、“目标”状态、速率和参数列表的列表。\n\n```\nctmc <- function()\n\
    structure(list(from = NULL,\nrate = NULL,\nto = NULL,\nparams = NULL),\nclass\
    \ = \"ctmc\")\n```\n\n我们希望构造 CTMC 的语法如下所示：\n\n```\nm <- ctmc() %>%\n    add_edge(foo,\
    \ a, bar) %>%\n    add_edge(foo, 2*a, baz) %>%\n    add_edge(foo, 4, qux) %>%\n\
    \    add_edge(bar, b, baz) %>%\n    add_edge(baz, a + x*b, qux) %>%\n    add_edge(qux,\
    \ a + UQ(x)*b, foo)\n```\n\n因此，我们需要实现 `add_edge`，使其接受四个参数：CTMC、“起始”状态、转移速率和“目标”状态。当使用管道运算符时，CTMC\
    \ 会被隐式传递给函数调用。其他三个参数应作为表达式提供，而 `add_edge` 函数将实现非标准求值来处理它们。\n\n我们希望“起始”和“目标”状态是单个符号，但我们会将它们转换为字符串，以用作\
    \ CTMC 速率矩阵的行名和列名。与转移关联的速率应该是一个表达式，为了正确获取表达式的作用域，我们将其转换为一个 quosure（带环境的引用表达）。然后，我们将提取此表达式中的未绑定变量——指在定义该\
    \ quosure 的环境中未绑定的变量——并将它们添加到模型的参数中。实现如下所示：\n\n```\nadd_edge <- function(ctmc,\
    \ from, rate, to) {\n    from <- enexpr(from); stopifnot(is_symbol(from))\n  \
    \  to <- enexpr(to); stopifnot(is_symbol(to))\n    from <- as_string(from)\n \
    \   to <- as_string(to)\n    ctmc$from <- cons(from, ctmc$from)\n    ctmc$to <-\
    \ cons(to, ctmc$to)\n    r <- enquo(rate)\n    ctmc$rate <- cons(r, ctmc$rate)\n\
    \    ctmc$params <- cons(collect_symbols_q(get_expr(r), get_env(r)),\n       \
    \                 ctmc$params)\n    ctmc\n}\n```\n\n我们对 `from` 和 `to` 使用 `enexpr`，因为我们希望这些符号就只是符号，而不是我们打算在任何上下文中求值的东西。另一方面，我们对\
    \ `rate` 参数使用 `enquo`，因为在求值表达式时我们确实需要有它的环境可用。不过，我们目前还不对其求值。在知道模型参数之前，我们无法对其求值，而我们又不希望这些参数在\
    \ CTMC 对象内部被固定下来。然而，在提取速率表达式中的未绑定变量时，我们会使用速率环境。\n\n通常，能够通过打印来获取有关我们构建对象的一些信息是一个好主意，但\
    \ `ctmc` 对象的默认打印函数会显示列表的列表。这种表示形式，尤其是对于链表，可能难以解读。相反，我们可以通过定义一个名为 `print.ctmc`\
    \ 的函数来为该类实现打印函数。我们希望显示的信息是模型的参数和边结构，我们可以像这样实现此函数：\n\n```\nprint.ctmc <- function(x,\
    \ ...) {\n    from <- x$from %>% rev()\n    to <- x$to %>% rev()\n    rate <-\
    \ x$rate %>% rev()\n    parameters <- x$params %>%\n        unlist() %>% unique()\
    \ %>% rev()\n    cat(\"CTMC:\\n\")\n    cat(\"parameters:\", paste(parameters),\
    \ \"\\n\")\n    cat(\"transitions:\\n\")\n    for (i in seq_along(from)) {\n \
    \       cat(from[[i]], \"->\", to[[i]],\n            \"\\t[\", deparse(get_expr(rate[[i]])),\
    \ \"]\\n\")\n    }\n    cat(\"\\n\")\n}\n```\n"
- fmt: "实现很简单。我们将链表转换为列表，以便在遍历边时更容易处理，并将它们反转，以便按添加到模型的顺序显示。对于链表，我们会在前面添加新边，因此它们的表示顺序与添加顺序相反。对于参数，我们也使用`unique`去除重复。之后，我们只需将参数打印为列表，并为每条边打印一行，显示“从”和“到”状态以及边上的速率表达式。对于后者，我们使用`get_expr`获取裸表达式（而不是quosure），并使用函数`deparse`将表达式转换为可打印的字符串。\n\
    \n使用目前已定义的三个函数，我们现在可以创建并打印一个连续时间马尔可夫链。\n\n```\nx <- 0\nm <- ctmc(\n  foo ~ bar,\
    \ foo ~ baz, foo ~ qux,\n  bar ~ baz, baz ~ qux, qux ~ foo,\n  rates = list(a,\
    \ 2*a, 4, b, a + x*b, a + UQ(x)*b)\n)\nm\n```\n\n此示例表明，我们可以在边上使用常量表达式，例如从`foo`到`qux`的边，其速率为4。我们可以使用包含未绑定变量`a`、`b`和`2*a`的表达式。我们还可以使用包含绑定变量的表达式（最后两条边）。请注意，倒数第二条边（从`baz`到`qux`）的速率表达式包含（未求值的）变量`x`，而最后一条边（从`qux`到`foo`）包含表达式`a\
    \ + 2*b`，其中已插入了`x`的值。这就是在表达式中包含绑定变量与对其取消引用的区别。由于`x`是一个绑定变量，它不被视为模型的参数，但在倒数第二个表达式中，它在求值速率时会被使用。如果更改其值，我们也会更改速率表达式的值。对于最后一个速率表达式，我们已经插入了`x`的值，因此在这里更改`x`的值不会改变表达式。\n\
    \n## 构建速率矩阵\n\n我们在第[3](#A465211_1_En_3_Chapter.html)章中看到了如何将边列表转换为速率矩阵，但在本章中，我们希望更进一步。在第[3](#A465211_1_En_3_Chapter.html)章中，边上的速率是数值；现在我们有表达式。我们不会将CTMC转换为速率矩阵，而是创建一个用于生成速率矩阵的函数——一个给定马尔可夫模型参数值就能提供相应速率矩阵的函数。\n\
    \n我们通过闭包来实现此功能。我们编写一个函数，从`ctmc`对象中提取构建速率矩阵所需的信息，然后定义一个用于根据模型参数计算速率矩阵的函数。然后它返回这个闭包函数。实现如下所示：\n\
    \n```\nget_rate_matrix_function <- function(model) {\n  edges <- get_edges(model)\n\
    \  from <- edges$from %>% rev()\n  to <- edges$to %>% rev()\n  rate <- edges$rate\
    \ %>% rev()\n  nodes <- c(from, to) %>% unique() %>% unlist()\n  parameters <-\
    \ edges$parameters %>%\n    unlist() %>% unique() %>% rev()\n  n <- length(nodes)\n\
    \  f <- function() {\n    args <- as_list(environment())\n    Q <- matrix(0, nrow\
    \ = n, ncol = n)\n    rownames(Q) <- colnames(Q) <- nodes\n    for (i in seq_along(from))\
    \ {\n      Q[from[[i]], to[[i]]] <- eval_tidy(rate[[i]], args)\n    }\n    diag(Q)\
    \ <- -rowSums(Q)\n    Q\n  }\n  formals(f) <- make_args_list(parameters)\n  f\n\
    }\n```\n\n同样，我们将链表转换为`list`对象并反转它们。然后，通过组合`from`和`to`列表、去除重复项，我们获得模型中唯一节点的列表，并将结果列表转换为向量，稍后用于设置速率矩阵的行名和列名。我们通过将链表转换为`list`来提取模型的参数，然后将其转换为向量，去除重复项，并反转结果，以获取按添加到边的顺序排列的参数。\n\
    \n我们定义的闭包最初不接收形式参数。我们在定义函数之后根据CTMC参数来设置这些参数。我们这样做仅仅是因为与构建表达式并使用类似之前使用的`new_function`构造相比，这是定义函数的更简单方法。在返回闭包之前，它会有一个形式参数列表。由于我们不知道这些参数是什么，我们使用一个技巧来在闭包内部获取它们：我们在定义任何局部变量之前获取本地环境——此时它只包含传递给函数调用的参数——并将它们组成一个列表。稍后我们可以使用这个列表来覆盖闭包内部速率表达式的求值作用域。\n\
    \n对于速率矩阵的实际构建，没有什么出乎意料的。我们根据CTMC中的状态数获取矩阵的大小。然后创建矩阵，并根据它们表示的节点命名行和列。然后我们（整洁地）求值所有速率表达式以填充矩阵的单元格，最后，调整对角线以使所有行的和为零。\n\
    \n现在我们语言中有了一个用于获取速率矩阵函数的命令。\n\n```\nQf <- m %>% get_rate_matrix_function()\nQf\n\
    ```\n\n当我们向此函数提供模型参数时，我们得到速率矩阵。\n\n```\nQf(a = 2, b = 4)\n```\n\n请记住，从`baz`到`qux`的边包含一个引用全局变量`x`的表达式。如果我们更改此变量的值，我们也会更改求值`Qf`函数的结果。\n\
    \n```\nx <- 1\nQf(a = 2, b = 4)\n```\n\n从`qux`到`foo`的边（我们在创建边时使用`UQ`替换了`x`的值）不会改变。"
  raw: "The implementation is straightforward. We translate the linked lists into\
    \ lists to make them easier to work with when we loop over the edges, and we reverse\
    \ them so we will display them in the order in which they were added to the model.\
    \ With the linked lists, we prepend new edges, so they are represented in the\
    \ opposite order than the one in which they were added. For the parameters, we\
    \ remove duplications using `unique` as well. After that, we simply print the\
    \ parameters as a list and print a line for each edge, showing the “from” and\
    \ “to” states together with the rate expression on the edge. For the latter, we\
    \ use `get_expr` to get the bare expression, rather than the quosure, and we use\
    \ the function `deparse` to translate the expression into a string that we can\
    \ print.\n\nWith the three functions we have defined so far, we can now create\
    \ and print a continuous time Markov chain.\n\n```\nx %\nadd_edge(foo, a, bar)\
    \ %>%\nadd_edge(foo, 2*a, baz) %>%\nadd_edge(foo, 4, qux) %>%\nadd_edge(bar, b,\
    \ baz) %>%\nadd_edge(baz, a + x*b, qux) %>%\nadd_edge(qux, a + UQ(x)*b, foo)\n\
    m\n## CTMC:\n## parameters: a b\n## transitions:\n## foo -> bar   [ a ]\n## foo\
    \ -> baz   [ 2 * a ]\n## foo -> qux   [ 4 ]\n## bar -> baz   [ b ]\n## baz ->\
    \ qux   [ a + x * b ]\n## qux -> foo   [ a + 2 * b ]\n```\n\nThis example shows\
    \ that we can have expressions on the edges that are constants, such as the edge\
    \ from `foo` to `qux` that has the rate four. We can have expressions with unbound\
    \ variables, `a`, `b`, and `2*a`. And we can have expressions that involve a bound\
    \ variable, the last two edges. Notice here that the second-to-last edge, from\
    \ `baz` to `qux`, has a rate expression that includes the (unevaluated) variable\
    \ `x`, while the last edge, from `qux` to `foo`, contains the expression `a +\
    \ 2*b`, where the value of `x` has been inserted. This is the difference between\
    \ including a bound variable and unquoting it in the expression. Since `x` is\
    \ a bound variable, it is not considered a parameter of the model, but in the\
    \ second-to-last expression, it will be used when we evaluate the rate. If we\
    \ change its value, we also change the value of the rate expression. For the last\
    \ rate expression, we have already inserted the value of `x`, so here we will\
    \ not change the expression by changing the value of `x`.\n\n## Constructing a\
    \ Rate Matrix\n\nWe saw how we could translate a list of edges into a rate matrix\
    \ in Chapter [3](#A465211_1_En_3_Chapter.html), but in this chapter, we want to\
    \ do a little more. In Chapter [3](#A465211_1_En_3_Chapter.html), we had numeric\
    \ rates on the edges; we now have expressions. Instead of translating the CTMC\
    \ into a rate matrix, we will create a function for generating rate matrices—a\
    \ function that, given values for the parameters of the Markov model, will provide\
    \ us with the corresponding rate matrix.\n\nWe implement this functionality via\
    \ a closure. We write a function that extracts the information we need to build\
    \ the rate matrix from the `ctmc` object and then define a function for computing\
    \ the rate matrix given the model’s parameters. It then returns this closure function.\
    \ The implementation can look like this:\n\n```\nget_rate_matrix_function % rev()\n\
    to % rev()\nrate % rev()\nnodes % unique() %>% unlist()\nparameters %\nunlist()\
    \ %>% unique() %>% rev()\nn <- length(nodes)\nf <- function() {\nargs <- as_list(environment())\n\
    Q <- matrix(0, nrow = n, ncol = n)\nrownames(Q) <- colnames(Q) <- nodes\nfor (i\
    \ in seq_along(from)) {\nQ[from[[i]], to[[i]]] <- eval_tidy(rate[[i]], args)\n\
    }\ndiag(Q) <- -rowSums(Q)\nQ\n}\nformals(f) <- make_args_list(parameters)\nf\n\
    }\n```\n\nOnce again, we translate the linked lists into `list` objects and reverse\
    \ them. We then get a list of unique nodes in the model by combining the `from`\
    \ and `to` lists, removing duplicates, and we translate the resulting list into\
    \ a vector that we will later use to set row and column names of the rate matrix.\
    \ We extract the parameters for the model by translating the linked list into\
    \ a `list`, and we then translate that into a vector, remove duplicates, and reverse\
    \ the result to get the parameters in the order in which they were added to the\
    \ edges.\n\nThe closure we define initially takes no formal arguments. We set\
    \ those from the CTMC arguments after we have defined the function. We do it this\
    \ way only because it is an easier way to define the function compared to constructing\
    \ expressions and using something like the `new_function` construction we used\
    \ earlier. Before we return the closure, it will have a list of formal arguments.\
    \ Since we don’t know what these will be, we use a trick to get hold of them inside\
    \ the closure: we get the local environment before we define any local variables—so\
    \ at this point it will contain only the parameters passed to the function call—and\
    \ make a list out of them. That list, we can use later to over-scope the evaluation\
    \ of the rate expressions inside the closure.\n\nFor the actual construction of\
    \ the rate matrix, there is little to surprise. We get the size of the matrix\
    \ from the number of states in the CTMC. We then create the matrix and name rows\
    \ and columns according to the nodes they represent. Then we (tidy) evaluate all\
    \ the rate expressions to fill in the cells of the matrix, and finally, we adjust\
    \ the diagonal so all rows sum to zero.\n\nWe now have a command in our language\
    \ for getting a rate matrix function.\n\n```\nQf % get_rate_matrix_function()\n\
    Qf\n## function (a, b)\n## {\n##     args \n```\n\nWhen we provide the model parameters\
    \ to this function, we get the rate matrix.\n\n```\nQf(a = 2, b = 4)\n##     foo\
    \ bar baz qux\n## foo -10   2   4   4\n## bar   0  -4   4   0\n## baz   0   0\
    \ -10  10\n## qux  10   0   0 -10\n```\n\nRemember that the edge from `baz` to\
    \ `qux` holds an expression that refers to the global variable `x`. If we change\
    \ the value of this variable, we also change the result of evaluating the `Qf`\
    \ function.\n\n```\nx <- 1\nQf(a = 2, b = 4)\n##     foo bar baz qux\n## foo -10\
    \   2   4   4\n## bar   0  -4   4   0\n## baz   0   0  -6   6\n## qux  10   0\
    \   0 -10\n```\n\nThe edge from `qux` to `foo`, where we substitute the value\
    \ for `x` at the time we created the edge, using `UQ`, does not change."
  trans: "\n实现很简单。我们将链表转换为列表，以便在遍历边时更容易处理，并将它们反转，以便按添加到模型的顺序显示。对于链表，我们会在前面添加新边，因此它们的表示顺序与添加顺序相反。对于参数，我们也使用`unique`去除重复。之后，我们只需将参数打印为列表，并为每条边打印一行，显示“从”和“到”状态以及边上的速率表达式。对于后者，我们使用`get_expr`获取裸表达式（而不是\
    \ quosure），并使用函数`deparse`将表达式转换为可打印的字符串。\n\n使用目前已定义的三个函数，我们现在可以创建并打印一个连续时间马尔可夫链。\n\
    \n```\nx <- 0\nm <- ctmc(\n  foo ~ bar, foo ~ baz, foo ~ qux,\n  bar ~ baz, baz\
    \ ~ qux, qux ~ foo,\n  rates = list(a, 2*a, 4, b, a + x*b, a + UQ(x)*b)\n)\nm\n\
    ```\n\n此示例表明，我们可以在边上使用常量表达式，例如从`foo`到`qux`的边，其速率为 4。我们可以使用包含未绑定变量`a`、`b`和`2*a`的表达式。我们还可以使用包含绑定变量的表达式（最后两条边）。请注意，倒数第二条边（从`baz`到`qux`）的速率表达式包含（未求值的）变量`x`，而最后一条边（从`qux`到`foo`）包含表达式`a\
    \ + 2*b`，其中已插入了`x`的值。这就是在表达式中包含绑定变量与对其取消引用的区别。由于`x`是一个绑定变量，它不被视为模型的参数，但在倒数第二个表达式中，它在求值速率时会被使用。如果更改其值，我们也会更改速率表达式的值。对于最后一个速率表达式，我们已经插入了`x`的值，因此在这里更改`x`的值不会改变表达式。\n\
    \n## 构建速率矩阵\n\n我们在第 3 章中看到了如何将边列表转换为速率矩阵，但在本章中，我们希望更进一步。在第 3 章中，边上的速率是数值；现在我们有表达式。我们不会将\
    \ CTMC 转换为速率矩阵，而是创建一个用于生成速率矩阵的函数——一个给定马尔可夫模型参数值就能提供相应速率矩阵的函数。\n\n我们通过闭包来实现此功能。我们编写一个函数，从`ctmc`对象中提取构建速率矩阵所需的信息，然后定义一个用于根据模型参数计算速率矩阵的函数。然后它返回这个闭包函数。实现如下所示：\n\
    \n```\nget_rate_matrix_function <- function(model) {\n  edges <- get_edges(model)\n\
    \  from <- edges$from %>% rev()\n  to <- edges$to %>% rev()\n  rate <- edges$rate\
    \ %>% rev()\n  nodes <- c(from, to) %>% unique() %>% unlist()\n  parameters <-\
    \ edges$parameters %>%\n    unlist() %>% unique() %>% rev()\n  n <- length(nodes)\n\
    \  f <- function() {\n    args <- as_list(environment())\n    Q <- matrix(0, nrow\
    \ = n, ncol = n)\n    rownames(Q) <- colnames(Q) <- nodes\n    for (i in seq_along(from))\
    \ {\n      Q[from[[i]], to[[i]]] <- eval_tidy(rate[[i]], args)\n    }\n    diag(Q)\
    \ <- -rowSums(Q)\n    Q\n  }\n  formals(f) <- make_args_list(parameters)\n  f\n\
    }\n```\n\n同样，我们将链表转换为`list`对象并反转它们。然后，通过组合`from`和`to`列表、去除重复项，我们获得模型中唯一节点的列表，并将结果列表转换为向量，稍后用于设置速率矩阵的行名和列名。我们通过将链表转换为`list`来提取模型的参数，然后将其转换为向量，去除重复项，并反转结果，以获取按添加到边的顺序排列的参数。\n\
    \n我们定义的闭包最初不接收形式参数。我们在定义函数之后根据 CTMC 参数来设置这些参数。我们这样做仅仅是因为与构建表达式并使用类似之前使用的`new_function`构造相比，这是定义函数的更简单方法。在返回闭包之前，它会有一个形式参数列表。由于我们不知道这些参数是什么，我们使用一个技巧来在闭包内部获取它们：我们在定义任何局部变量之前获取本地环境——此时它只包含传递给函数调用的参数——并将它们组成一个列表。稍后我们可以使用这个列表来覆盖闭包内部速率表达式的求值作用域。\n\
    \n对于速率矩阵的实际构建，没有什么出乎意料的。我们根据 CTMC 中的状态数获取矩阵的大小。然后创建矩阵，并根据它们表示的节点命名行和列。然后我们（整洁地）求值所有速率表达式以填充矩阵的单元格，最后，调整对角线以使所有行的和为零。\n\
    \n现在我们语言中有了一个用于获取速率矩阵函数的命令。\n\n```\nQf <- m %>% get_rate_matrix_function()\nQf\n\
    ```\n\n当我们向此函数提供模型参数时，我们得到速率矩阵。\n\n```\nQf(a = 2, b = 4)\n```\n\n请记住，从`baz`到`qux`的边包含一个引用全局变量`x`的表达式。如果我们更改此变量的值，我们也会更改求值`Qf`函数的结果。\n\
    \n```\nx <- 1\nQf(a = 2, b = 4)\n```\n\n从`qux`到`foo`的边（我们在创建边时使用`UQ`替换了`x`的值）不会改变。\n"
- fmt: "### Traces\n\nAn observation for a continuous-time Markov chain is a trace\
    \ — a sequence of states and at which time points we observe the states. In any\
    \ real data analysis, we would probably write functions to obtain data from files,\
    \ but since we are exploring domain-specific languages, let’s write one for specifying\
    \ traces. We will make traces depend on the CTMC that we want to use them with\
    \ so we can test that the states in a trace are also states in the CTMC. If you\
    \ want to use several CTMCs to analyze the same trace, you could remove these\
    \ tests, or you could make the trace object depend on a list of legal states instead\
    \ of a `ctmc` object.\n\nWe take the same approach as for the `ctmc` class: we\
    \ write a function for creating an object to represent traces, and we then have\
    \ functions for adding information to a trace. The information we want to store\
    \ in a trace is a list of states and a list of time points in which we observe\
    \ the states. For the consistency checks between CTMC and trace, we will also\
    \ store the nodes in the CTMC. The constructor for the trace class looks like\
    \ this:\n\n```\nctmc_trace <- function(ctmc) {\n    nodes <- ctmc[[\"nodes\"]]\
    \ %>% unique %>% unlist\n    structure(list(nodes = nodes, states = NULL, at =\
    \ NULL),\n              class = \"ctmc_trace\")\n}\n```\n\nWe add a verb to the\
    \ language, a function adding observations of states at specific time points.\
    \ This function mainly checks the consistency between states and the `ctmc` object\
    \ and then adds states and time points to the `ctmc_trace` object’s lists.\n\n\
    ```\nadd_observation <- function(trace, state, at) {\n    stopifnot(state %in%\
    \ trace$nodes)\n    stopifnot(at > trace$at$car)\n    trace$states <- cons(state,\
    \ trace$states)\n    trace$at <- cons(at, trace$at)\n    trace\n}\n```\n\nAs for\
    \ CTMC objects, we want a printing function for traces. Here, I will take a different\
    \ approach than what we did for the `ctmc` print function. I will translate traces\
    \ into data frames — `tibble` objects to be precise — and print the result. If\
    \ I was writing a package for CTMCs, I might take a different approach, but I\
    \ will use the transformation into data frames later to compute likelihoods, so\
    \ I exploit the transformation in the print function as well. To translate a `ctmc_trace`\
    \ object into a `tibble` object, we specialize the `as_tibble` function. After\
    \ that, we specialize the `print` function.\n\n```\nas_tibble.ctmc_trace <- function(x,\
    \ ...) {\n    states <- x[[\"states\"]] %>% lst_to_list() %>% unlist() %>% rev()\n\
    \    at     <- x[[\"at\"]]     %>% lst_to_list() %>% unlist() %>% rev()\n    tibble(state\
    \ = states, at = at)\n}\nprint.ctmc_trace <- function(x, ...) {\n    df <- as_tibble(x)\n\
    \    cat(\"CTMC trace:\\n\")\n    print(df)\n}\n```\n\nWe now have the functionality\
    \ to create and print traces.\n\n```\ntr <- ctmc_trace(ctmc) %>%\n    add_observation(foo,\
    \ at = 0.0) %>%\n    add_observation(bar, at = 0.1) %>%\n    add_observation(baz,\
    \ at = 0.3) %>%\n    add_observation(qux, at = 0.5) %>%\n    add_observation(foo,\
    \ at = 0.7) %>%\n    add_observation(baz, at = 1.1)\ntr\n## CTMC trace:\n## #\
    \ A tibble: 6 x 2\n##   state    at\n##   <chr> <dbl>\n## 1 foo   0.\n## 2 bar\
    \   0.100\n## 3 baz   0.300\n## 4 qux   0.500\n## 5 foo   0.700\n## 6 baz   1.10\n\
    ```\n\n### Computing Likelihoods\n\nThe final functionality we will implement\
    \ for this example is for computing the likelihood of parameters given a CTMC\
    \ and a trace. In Chapter [3](#A465211_1_En_3_Chapter.html), we saw how to translate\
    \ a rate matrix into a transition-probability matrix by first multiplying the\
    \ rate matrix by a scalar — the time period that has passed between two observations\
    \ — and then (matrix-)exponentiating the result. We will reuse the function we\
    \ implemented there.\n\n```\ntransition_probabilities <- function(Q, t) expm(Q\
    \ * t)\n```\n\nFor computing the likelihood, we will create a verb in our domain-specific\
    \ language that translates a CTMC and a trace into a function. This function will\
    \ take the parameters of the CTMC as arguments — as the function for creating\
    \ rate matrices we wrote earlier — and then return the likelihood for those parameters.\
    \ This is a function we could then use for maximum-likelihood estimation by combining\
    \ it with an optimization algorithm, of which there are several available in various\
    \ R packages.\n\nThe implementation is straightforward. We get the rate matrix\
    \ function from the `ctmc` object and translate the trace into a data frame and\
    \ store the results in the closure of the function. Then we use the same trick\
    \ as we used earlier to get the arguments inside the closure, evaluate the rate-matrix\
    \ function to get the rate-matrix, and put the data from the data frame into a\
    \ format we need for the computation. That computation is just running through\
    \ the trace and computing the transition probabilities from two consecutive observations.\
    \ Since it is a Markov model, the joint probability is the product of them. After\
    \ we have created the closure, we set its formal arguments, similar to what we\
    \ did with the rate-matrix function.\n\n```\nget_likelihood_function <- function(ctmc,\
    \ trace) {\n    rate_func <- ctmc %>% get_rate_matrix_function()\n    trace_df\
    \  <- as_tibble(trace)\n    lhd_function <- function() {\n        args <- as_list(environment())\n\
    \        Q <- do.call(rate_func, args)\n        n <- length(trace_df$state)\n\
    \        from <- trace_df$state[-n]\n        to <- trace_df$state[-1]\n      \
    \  delta_t <- trace_df$at[-1] - trace_df$at[-n]\n        lhd <- 1\n        for\
    \ (i in seq_along(from)) {\n            P <- transition_probabilities(Q, delta_t[i])\n\
    \            lhd <- lhd * P[from[i], to[i]]\n        }\n        lhd\n    }\n \
    \   formals(lhd_function) <- formals(rate_func)\n    lhd_function\n}\n```\n\n\
    That is it; we can now compute likelihoods for a CTMC.\n\n```\nlhd <- get_likelihood_function(ctmc,\
    \ tr)\nlhd(a = 2, b = 4)\n## [1] 0.00120108\n```\n\nIn an actual data analysis\
    \ context, we probably would want to compute the log likelihood instead. For traces\
    \ of any useful length, the actual likelihood will lead to underflow since we\
    \ are dealing with finite-bit floating-point numbers. Modifying the likelihood\
    \ function to a log-likelihood function is a simple matter of changing the product\
    \ to a sum and taking the log of `P[from[i], to[i]]`.\n\nThere might be more functionality\
    \ you would like to add to a language like this, but even with the few functions\
    \ we have implemented so far, we have a useful domain-specific language. We have\
    \ not used any operator overloading to implement it; we didn’t have to do that.\
    \ We have used tidy evaluation extensively, though, to implement the non-standard\
    \ evaluation we use for rate expressions."
