  trans: "\n# 探索表达式\n\n表达式是一种递归数据结构，你可以像探索其它递归结构一样探索它。我们可以用如下文法来定义表达式：\n\n```\nEXPRESSION\
    \ ::= CONSTANT\n|  NAME\n|  PRIMITIVE\n|  PAIRLIST\n|  CALL EXPRESSION_LIST\n\
    EXPRESSION_LIST\n::= EXPRESSION\n|  EXPRESSION EXPRESSION_LIST\n```\n\n我们不会进一步展开表达式的文法，只需约定它们都是合法的\
    \ R 表达式即可。所有表达式都属于这五类之一。前四类是文法中的终结符，而`call`表达式是递归的；一个调用由函数及其参数构成，而所有这些也都是其它表达式。\n\
    \n我们可以使用递归函数来探索表达式，其中前三个元变量 `CONSTANT`、`NAME` 和 `PRIMITIVE` 是不包含其他表达式的基本情况，而 `PAIRLIST`\
    \ 可能包含、`CALL` 则必然包含其他表达式，因此必须在递归调用中处理。\n\n在这几个元变量中，`CONSTANT` 指代任何字面数据（如数字或字符串），`NAME`\
    \ 指代任何变量名，`PRIMTIVE` 指代用 C 语言编写的、作为 R 实现一部分的函数，`PAIRLIST` 指代函数定义中的形参（后面会详述），`CALL`\
    \ 指代函数调用。函数调用包含了比前四种更复杂的所有情况。由于 R 中任何有实际作用的操作都被视为函数调用，包括函数定义和控制结构等语句，因此它们都属于`CALL`类型。正如我们之前所见，调用类似于列表，并且总是至少包含一个元素：第一个元素是被调用的函数，其余分量是该函数的参数。\n\
    \n为了递归地探索表达式，我们可以编写函数来测试这四种情况。常量通过`is.atomic`函数识别，名称通过`is.name`函数识别，原语通过`is.primitive`函数识别，点对列表通过`is.pairlist`识别，调用通过`is.call`函数识别。一个用于打印表达式结构的函数可以如下所示：\n\
    \n```\nprint_expression <- function(expr, indent = \"\") {\n  if (is.atomic(expr))\
    \ {\n    cat(indent, \"- \", expr, \"\\n\", sep = \"\")\n  } else if (is.name(expr))\
    \ {\n    cat(indent, \"- \", as.character(expr), \"\\n\", sep = \"\")\n  } else\
    \ if (is.pairlist(expr)) {\n    cat(indent, \"-  [\\n\")\n    new_indent <- paste0(indent,\
    \ \"    \")\n    for (i in seq_along(expr)) {\n      cat(new_indent, names(expr)[i],\
    \ \" ->\\n\")\n      print_expression((expr[[i]]), new_indent)\n    }\n    cat(indent,\
    \ \"    ]\\n\")\n  } else {\n    print_expression((expr[[1]]), indent)\n    new_indent\
    \ <- paste0(\"  \", indent)\n    for (i in 2:length(expr)) {\n      print_expression(expr[[i]],\
    \ new_indent)\n    }\n  }\n}\n```\n\n这里我们没有显式测试调用类型；如果表达式不属于前四种情况，那它必然是第五种。在这个打印函数中，我们处理了两个特殊情况——函数定义的源码引用和点对列表中的缺失表达式。我们将在后面讨论这些。\n\
    \n我们可以通过在我们之前探索过的表达式上调用该函数来观察其运行效果。\n\n```\nprint_expression(quote(2 * x + y))\n\
    ##   -  +\n##     -  *\n##       -  2\n##       -  x\n##     -  y\n```\n\n这个美化打印的表达式清晰地展示了我们在前一节中探索过的结构。\n\
    \n声明一个函数被视为一个函数调用——即对 `function` 函数的调用。\n\n```\nprint_expression(quote(function(x)\
    \ x))\n##   -  function\n##     -  [\n##         x  ->\n##            -  MISSING\n\
    ##        ]\n##     -  x\n##     -  srcref = function(x) x\n```\n\n对于函数定义，我们有一个调用对象，其第一个参数是\
    \ `function`，第二个参数是定义函数参数的点对列表，第三个元素是函数体——即另一个表达式。此外还有一个名为 `srcdef` 的第四个元素，它是一个原子向量，捕获了用于定义函数的实际代码。在打印函数中，我们只需打印源码定义的文本表示，这可以通过粘贴表达式得到。\n\
    \n我们声明的函数参数列表就是使用点对列表数据结构的地方。我们可以使用 `names` 函数获取形参的名称，并通过索引点对列表来获取默认参数。没有默认参数的参数在这里是一种特殊情况，它们包含的表达式是一个空字符串。在打印函数中，我们通过将空字符串改为字符串\
    \ `MISSING` 来显式表示这一点。如果有默认参数，那么它们会被表示为我们可以递归探索的表达式。\n\n```\nprint_expression(quote(function(x\
    \ = 2 * 2 + 4) x))\n##   -  function\n##     -  [\n##         x  ->\n##      \
    \      -  +\n##              -  *\n##                -  2\n##                -\
    \  2\n##              -  4\n##        ]\n##     -  x\n##     -  srcref = function(x\
    \ = 2 * 2 + 4) x\nprint_expression(quote(function(x, y = 2 * x) x + y))\n##  \
    \ -  function\n##     -  [\n##         x  ->\n##            -  MISSING\n##   \
    \      y  ->\n##            -  *\n##              -  2\n##              -  x\n\
    ##        ]\n##     -  +\n##       -  x\n##       -  y\n##     -  srcref = function(x,\
    \ y = 2 * x) x + y\n```\n\n函数调用的通常情况是，“调用”列表中的第一个元素是一个指向函数的符号，在 R 中任何能返回函数的表达式都可以被用作函数。这意味着调用的第一个元素可以是任何表达式。例如，如果我们定义一个函数并立即调用它，那么调用对象的第一个元素将是该函数定义本身。\n\
    \n```\nexpr <- quote((function(x) x)(2))\nprint_expression(expr)\n##   -  (\n\
    ##     -  function\n##       -  [\n##           x  ->\n##              -  MISSING\n\
    ##          ]\n##       -  x\n##       -  srcref = function(x) x\n##     -  2\n\
    expr[[1]]\n## (function(x) x)\nexpr[[2]]\n## [1] 2\n```\n\n作为对表达式进行一些有实际意义操作的示例，我们可以编写一个函数来收集表达式中所有未绑定的变量。如果我们递归遍历一个表达式，可以收集所有已绑定和未绑定的符号。为了获取未绑定的变量，我们可以跟踪那些已绑定的变量并避免收集它们。首先，忽略那些可能在表达式本身之外绑定的变量（即在我们将要调用函数的那个作用域中绑定的变量），已绑定的变量是在函数定义中被命名的那些变量。我们可以通过\
    \ `function` 调用的第二个参数（即点对列表）来识别它们。在递归遍历表达式时，我们捕获这些变量并将它们向下传递给递归过程。除此之外，我们只收集符号。在下面的实现中，我使用我们之前见过的链表来收集符号，并在收集时将符号转换为字符。之所以这样做，是因为以后我可以使用符号的字符表示来检查某个符号是否存在于某个环境中。我使用\
    \ `cons` 函数在链表中收集符号。\n\n```\ncons <- function(car, cdr) list(car = car, cdr =\
    \ cdr)\ncollect_symbols_rec <- function(expr, lst, bound) {\n  if (is.symbol(expr)\
    \ && expr != \"\") {\n    if (as.character(expr) %in% bound) lst\n    else cons(as.character(expr),\
    \ lst)\n  } else if (is.pairlist(expr)) {\n    for (i in seq_along(expr)) {\n\
    \      lst <- collect_symbols_rec(expr[[i]], lst, bound)\n    }\n    lst\n  }\
    \ else if (is.call(expr)) {\n    if (expr[[1]] == as.symbol(\"function\"))\n \
    \     bound <- c(names(expr[[2]]), bound)\n    for (i in 1:length(expr)) {\n \
    \     lst <- collect_symbols_rec(expr[[i]], lst, bound)\n    }\n    lst\n  } else\
    \ {\n    lst\n  }\n}\n```\n\n为了处理列表，使用 `list` 对象比使用链表对象更容易操作，因此我们还需要之前提到过的 `lst_to_list`\
    \ 函数。\n\n```\nlst_length <- function(lst) {\n  len <- 0\n  while (!is.null(lst))\
    \ {\n    lst <- lst$cdr\n    len <- len + 1\n  }\n  len\n}\nlst_to_list <- function(lst)\
    \ {\n  v <- vector(mode = \"list\", length = lst_length(lst))\n  index <- 1\n\
    \  while (!is.null(lst)) {\n    v[[index]] <- lst$car\n    lst <- lst$cdr\n  \
    \  index <- index + 1\n  }\n  v\n}\n```\n"
- fmt: "我们显式地避免在收集符号时收集空符号。空符号是在我们对没有默认值的函数参数的配对列表进行递归时得到的符号。我们不将其视为变量，无论是否绑定。我们处理符号的方式很直接。对于配对列表，我们收集将被绑定的参数，并递归遍历默认参数以收集其中任何未绑定的变量。对于调用，我们通过扩展绑定变量列表然后递归来处理函数定义。对于其他任何情况——实际上是指任何原子值——我们只需返回调用函数时使用的列表。毕竟常量值中没有未绑定的变量。\n\
    \n该递归函数对一个被引用的表达式进行操作，并收集该表达式内部所有未绑定的符号。我们将其封装在一个函数中，该函数对表达式进行引用，调用递归函数，然后移除在调用作用域（`parent.frame`）中定义的符号。\n\
    \n```r\ncollect_symbols <- function(expr) {\n  expr %>%\n    substitute() %>%\n\
    \    lst_to_list() %>%\n    unique() %>%\n    purrr::discard(exists, parent.frame())\
    \ %>%\n    unlist()\n}\n```\n\n这里，我使用了`purrr`包中的`discard`函数来移除所有满足谓词的元素。对于谓词，我使用了函数`exists`，其第二个参数是调用环境`parent.frame`。这可以移除在调用`collect_symbols`的作用域中定义的符号，包括全局定义的函数，例如`*`、`+`和`function`。\n\
    \n我通过`unlist`对最终结果进行管道操作，将`list`转换为字符向量。这仅出于美化打印的原因。它在控制台打印时能提供更好的输出。对于编程来说，您既可以使用向量，也可以使用`list`。\n\
    \n如果我们移除之前定义的变量`x`和`y`，那么表达式`2 * x + y + z`应该有三个未绑定的变量：`x`、`y`和`z`。这正是我们所发现的：\n\
    \n```r\nrm(x) ; rm(y)\ncollect_symbols(2 * x + y + z)\n## [1] \"z\" \"y\" \"x\"\
    \n```\n\n如果我们定义了其中一个变量，例如`z`，那么它就不再是未绑定的。\n\n```r\nz <- 3\ncollect_symbols(2 *\
    \ x + y + z)\n## [1] \"y\" \"x\"\n```\n\n函数定义也会绑定变量，因此这些变量不会被收集。\n\n```r\ncollect_symbols(function(x)\
    \ 2 * x + y + z)\n## [1] \"y\"\ncollect_symbols(function(x) function(y) f(2 *\
    \ x + y))\n## NULL\n```\n\n默认值可以包含未绑定的变量；我们收集这些值。\n\n```r\ncollect_symbols(function(x,\
    \ y = 2 * w) 2 * x + y)\n## [1] \"w\"\n```\n\n关于如何探索表达式，我们尚未完全了解。如前所述，对表达式进行实际的递归探索很简单。但通常，它必须与对表达式的求值相结合。而且，这种求值通常不遵循表达式求值的常规规则，因为我们必须对某些表达式求值，同时保持其他表达式被引用。当我们开始操纵表达式如何求值时，我们称之为非标准求值，这是第[7](#A465211_1_En_7_Chapter.html)章的主题。然而，在这里，我想让您初步了解它涉及的内容。\n\
    \n如果我们编写一个像这样的简单函数：\n\n```r\nf <- function(expr) collect_symbols(expr)\n```\n\n\
    我们可能期望它能给出表达式中的未绑定变量，但它返回一个空列表，如下所示：\n\n```r\nf(2 + y * w)\n## NULL\n```\n\n这是因为当我们尝试对所谓的非标准求值的函数进行编程时，将会遇到两个问题的结合。首先，当我们在`collect_symbols`函数中使用`substitute`时，我们得到的是调用`substitute`时的字面表达式。我们传递给`f`中`substitute`的参数是`expr`。`f`本身被调用时所用的表达式并不会被传递进去。其次，我们在`collect_symbols`内部测试绑定变量的环境是调用环境。当我们从`f`调用该函数时，调用环境是`f`的函数体。在这个环境中，变量`expr`是已定义的——它是函数的形式参数——因此它将被视为已绑定。\n\
    \n我们稍后将详细探讨环境以及如何使用非标准求值进行编程，但针对这些问题的通用解决方案是避免在您计划从其他函数调用的函数中使用非标准求值。这是一种用于编写领域特定语言的强大技术，但请将其限制在语言的接口层，而不是内部函数。对于`collect_symbols`，我们可以通过编写另一个函数来解决这个问题，该函数接受一个被引用的表达式和一个我们应该在其中查找变量的环境作为参数。然后，当我们想要进行非标准求值时，可以从`collect_symbols`调用此函数；如果我们想从其他函数中使用它，则直接调用另一个函数。\n\
    \n```r\ncollect_symbols_ <- function(expr, env) {\n  expr %>%\n    lst_to_list()\
    \ %>%\n    unique() %>%\n    purrr::discard(exists, env) %>%\n    unlist()\n}\n\
    collect_symbols <- function(expr) {\n  collect_symbols_(substitute(expr), parent.frame())\n\
    }\n```"
  raw: 'We explicitly avoid the empty symbol when we collect symbols. The empty symbol
    is the symbol we get when we recurse on a pair list for a function parameter without
    a default value. We do not consider this a variable, bound or otherwise. The way
    we handle symbols is straightforward. For pair lists, we collect the parameters
    that will be bound and recurse through the default arguments to collect any unbound
    variables there. As for calls, we handle the function definitions by extending
    the list of bound variables and then recursing. For anything else—which in practice
    means for any atomic value—we just return the list we called the function with.
    There are no unbound variables in constant values after all.


    The recursive function works on a quoted expression and collects all symbols that
    are not bound within the expression itself. We wrap it in a function that does
    the quoting of the expression, call the recursive function, and then remove the
    symbols that are defined in the calling scope (the `parent.frame` ).


    ```

    collect_symbols % lst_to_list() %>% unique() %>%

    purrr::discard(exists, parent.frame()) %>%

    unlist()

    }

    ```


    Here, I use the `discard` function from the `purrr` package to remove all elements
    that satisfy a predicate. For the predicate, I use the function `exists` with
    a second argument that is the calling environment, `parent.frame`. This gets rid
    of symbols that are defined in the scope where we call `collect_symbols` , including
    globally defined functions such as `*`, `+`, and `function`.


    I pipe the final result through `unlist` to translate the `list` into a character
    vector. This is only for pretty-printing reasons. It gives nicer output when printed
    in the console. For programming, you can work with `list`s as well as with vectors.


    If we get rid of variables `x` and `y` that we defined earlier, the expression
    `2 * x + y + z` should have three unbound variables, `x`, `y`, and `z`. This is
    indeed what we find:


    ```

    rm(x) ; rm(y)

    collect_symbols(2 * x + y + z)

    ## [1] "z" "y" "x"

    ```


    If we define one of the variables, for example, `z`, then it is no longer unbound.


    ```

    z <- 3

    collect_symbols(2 * x + y + z)

    ## [1] "y" "x"

    ```


    Function definitions also bind variables, so those are not collected.


    ```

    collect_symbols(function(x) 2 * x + y + z)

    ## [1] "y"

    collect_symbols(function(x) function(y) f(2 * x + y))

    ## NULL

    ```


    Default values can contain unbound variables; we collect those values.


    ```

    collect_symbols(function(x, y = 2 * w) 2 * x + y)

    ## [1] "w"

    ```


    We are not entirely done learning about how to explore expressions yet. The actual
    recursive exploration of expressions is simple, as shown previously. But often,
    it must be combined with an evaluation of expressions. And often, this evaluation
    does not follow the usual rules for how expressions are evaluated because we have
    to evaluate some expressions while we keep others quoted. When we start manipulating
    how expressions are evaluated, we call it non-standard evaluation , which is the
    topic of Chapter [7](#A465211_1_En_7_Chapter.html). Here, however, I want to give
    you a taste of what it involves.


    If we write a simple function such as this:


    ```

    f <- function(expr) collect_symbols(expr)

    ```


    we might expect it to give us the unbound variables in an expression, but it returns
    an empty list, as shown here:


    ```

    f(2 + y * w)

    ## NULL

    ```


    This is because of the combination of the two issues we will have when we try
    to program the functions of the so-called non-standard evaluation. First, when
    we use `substitute` in the `collect_symbols` function, we get the literal expression
    that `substitute` was called with. The argument we give to `substitute` in `f`
    is `expr`. The expression that `f` itself is called with does not get passed along.
    Second, the environment in which we test for a bound variable inside `collect_symbols`
    is the calling environment. When we call the function from `f`, the calling environment
    is the body of `f`. In this environment, the variable `expr` is defined—it is
    the formal argument of the function—so it will be considered bound.


    We will explore environments and how to program with non-standard evaluation in
    some detail later, but the general solution to these problems is to avoid using
    non-standard evaluation in functions you plan to call from other functions. It
    is a powerful technique for writing a domain-specific language, but keep it to
    the interface of the language and not the internal functions. For `collect_symbols`
    , we can get around the problem by writing another function that takes as arguments
    a quoted expression and an environment we should look for variables in. We can
    then call this function from `collect_symbols` when we want a non-standard evaluation
    and call the other function directly if we want to use it from other functions.


    ```

    collect_symbols_ % lst_to_list() %>% unique() %>%

    purrr::discard(exists, env) %>%

    unlist()

    }

    collect_symbols <- function(expr) {

    collect_symbols_(substitute(expr), parent.frame())

    }

    ```'
