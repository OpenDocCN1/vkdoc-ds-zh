  raw: 'There is no good way to resolve this problem. If you call a function that
    quotes an expression, you should give it a literal expression to quote. Such functions
    are essentially not useful for programming—they provide an interface to a user
    of your domain-specific language, but you cannot use them to implement the language
    by calling them from other functions.


    The solution is to have functions that expect expressions to be quoted, like the
    function `f` we wrote before `fq`, and use them when you call one function from
    another.


    ```

    g <- function(expr) {

    f(substitute(expr), data.frame(u = 1:4, v = 1:4))

    }

    g(u + v)

    ## [1] 2 4 6 8

    ```


    If you want some functionality to be available for programming—in other words,
    calling a function from another function—and also as an operation in your language,
    then write one that expects expressions to be quoted and another that wraps it.


    ```

    f <- function(expr, data) eval(expr, data, rlang::caller_env())

    fq <- function(expr, data) f(substitute(expr), data)

    fq(u + v, data.frame(u = 1:4, v = 1:4))

    ## [1] 2 4 6 8

    ```


    This, however, brings us to the second pitfall—getting environments wired up correctly.
    Consider these two functions:


    ```

    g <- function(x, y, z) {

    w <- x + y + z

    f(quote(w + u + v), data.frame(u = 1:4, v = 1:4))

    }

    h <- function(x, y, z) {

    w <- x + y + z

    fq(w + u + v, data.frame(u = 1:4, v = 1:4))

    }

    ```


    Function `g` explicitly quotes the expression `w + u + v` and calls `f`; `h` instead
    calls `fq` that takes care of the quoting for it. The first function works, the
    second does not.


    ```

    g(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) + 1:4 + 1:4

    ## [1] TRUE TRUE TRUE TRUE

    h(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) + 1:4 + 1:4

    ## Error in eval(expr, data, rlang::caller_env()): object ''w'' not found

    ```


    This time, the problem is not quoting. Both functions attempt to evaluate the
    same expression, `w + u + v`, inside function `f`. The problem is that the variable
    `w` is available to `f` only when we call it from `g`. To see why, consider the
    environments in play. We do not define any nested functions, so all four functions
    (`f`, `fq`, `g`, and `h`) only have access to their local environment and the
    global environment. The expression that `f` gets as its argument, however, is
    not evaluated in `f`’s local environment but in its caller’s environment. When
    `f` is called directly from `g`, the caller environment is the local environment
    of the `g` call, where `w` is defined. When `f` is called from `h`, however, it
    is not called directly. Since `h` calls `fq` that then calls `f`, the caller of
    `f` in this case is `fq`. The variable `w` is defined in the local scope of `h`,
    but this is not where `f` tries to evaluate the expression; `f` tries to evaluate
    the expression in the scope of `fq` where `w` is not defined.


    It is less obvious how we should resolve this issue. It is possible to pass environments
    along with expressions as separate function parameters, but this becomes cumbersome
    if we have to work with more than one expression. What we want is to associate
    expressions with the environment in which we want to look up variables we do not
    explicitly override, for example by getting them from a data frame.


    Expressions do not carry along with them any environment, so we cannot get there
    directly. Formulas, however, do. Instead of using expressions, we can use one-sided
    formulas. Quoting would now involve making a formula out of an expression. If
    the formula is one-sided, we can get the expression as the second element in it,
    and the environment where the formula is defined is available using the `environment`
    function. We can rewrite the `f` and `fq` functions to be based on formulas.


    ```

    ff <- function(expr, data) {

    eval(expr[[2]], data, environment(expr))

    }

    ffq <- function(expr, data) {

    expr <- eval(substitute(~ expr))

    environment(expr) <- rlang::caller_env()

    ff(expr, data)

    }

    ```


    With `ff` you need to explicitly create the formula—similar to how you had to
    quote expressions in `f` explicitly—and this automatically gives you the environment
    associated with the formula. With `ffq` we translate an expression into a formula
    using `substitute` and explicitly set its environment to the caller environment.
    We can now define `g` and `h` similar to before, except that `g` uses a formula
    instead of `quote`.


    ```

    g <- function(x, y, z) {

    w <- x + y + z

    ff(~ w + u + v, data.frame(u = 1:4, v = 1:4))

    }

    h <- function(x, y, z) {

    w <- x + y + z

    ffq(w + u + v, data.frame(u = 1:4, v = 1:4))

    }

    ```


    This time, both functions will evaluate the expressions in the right scope.


    ```

    g(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) + 1:4 + 1:4

    ## [1] TRUE TRUE TRUE TRUE

    h(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) + 1:4 + 1:4

    ## [1] TRUE TRUE TRUE TRUE

    ```


    Associating environments to expressions is the idea behind quosures from the `rlang`
    package. The word is a portmanteau created from quotes and closures—similar to
    how closures are functions with associated environments, quosures are quoted expressions
    with associated environments. Quosures are based on formulas, and we could use
    formulas as in the example we just saw, but the `rlang` package provides functionality
    that makes it much simpler to program domain-specific languages using quosures.
    The `rlang` package implements so-called tidy evaluation, which is the topic of
    the next chapter.


    # 8. Tidy Evaluation


    The so-called tidyverse refers to a number of R packages designed to work well
    together and based on similar designs that can all be considered domain-specific
    languages in themselves. These packages include `dplyr`, `tidyr`, and `ggplot2`
    and mainly consist of functions that do non-standard evaluation. The way they
    manage non-standard evaluation is consistent among the packages and based on what
    they call tidy evaluation, which primarily relies on two features implemented
    in the `rlang` package: quosures and quasi-quotation.


    We will use the `rlang` package once more, but to make it explicit when we use
    this package and not basic R non-standard evaluation, I will usually use fully
    qualified names. In other words, I will write `rlang::quo` instead of `quo` and
    not load the package. We will also use the `purrr` package, but here as well I
    will use fully qualified names. I will load `magrittr` to get the pipeline operator,
    however, and the `tibble` and `dplyr` packages for working with data frames.


    ```

    library(magrittr)

    library(dplyr)

    library(tibble)

    ```'
  trans: "\n# 排版后的 Markdown 文档\n\n要解决这个问题并没有好办法。如果你调用一个需要引用表达式的函数，你应该给它一个字面表达式来引用。这类函数本质上对编程没有帮助——它们为特定领域语言的用户提供了一个接口，但你无法通过从其他函数调用它们来实现该语言。\n\
    \n解决方案是编写那些期望表达式被引用的函数，比如我们之前编写的函数 `f` 和 `fq`，并在从一个函数调用另一个函数时使用它们。\n\n```\ng <-\
    \ function(expr) {\n  f(substitute(expr), data.frame(u = 1:4, v = 1:4))\n}\ng(u\
    \ + v)\n## [1] 2 4 6 8\n```\n\n如果你希望某些功能既可用于编程（即从一个函数调用另一个函数），也可作为语言中的操作，那么就编写一个期望表达式被引用的函数，再编写一个包装它的函数。\n\
    \n```\nf <- function(expr, data) eval(expr, data, rlang::caller_env())\nfq <-\
    \ function(expr, data) f(substitute(expr), data)\nfq(u + v, data.frame(u = 1:4,\
    \ v = 1:4))\n## [1] 2 4 6 8\n```\n\n然而，这引出了第二个陷阱——如何正确连接环境。考虑以下两个函数：\n\n```\n\
    g <- function(x, y, z) {\n  w <- x + y + z\n  f(quote(w + u + v), data.frame(u\
    \ = 1:4, v = 1:4))\n}\nh <- function(x, y, z) {\n  w <- x + y + z\n  fq(w + u\
    \ + v, data.frame(u = 1:4, v = 1:4))\n}\n```\n\n函数 `g` 显式引用了表达式 `w + u + v` 并调用\
    \ `f`；`h` 则调用 `fq`，由 `fq` 负责引用工作。第一个函数能工作，第二个则不能。\n\n```\ng(1:4, 1:4, 1:4) ==\
    \ (1:4 + 1:4 + 1:4) + 1:4 + 1:4\n## [1] TRUE TRUE TRUE TRUE\nh(1:4, 1:4, 1:4)\
    \ == (1:4 + 1:4 + 1:4) + 1:4 + 1:4\n## Error in eval(expr, data, rlang::caller_env()):\
    \ object 'w' not found\n```\n\n这次，问题不在于引用。两个函数都试图在函数 `f` 内部求值同一个表达式 `w + u + v`。问题在于，只有当我们从\
    \ `g` 调用 `f` 时，变量 `w` 才对 `f` 可用。要理解原因，请考虑所涉及的环境。我们没有定义任何嵌套函数，因此所有四个函数（`f`、`fq`、`g`\
    \ 和 `h`）只能访问它们自身的局部环境和全局环境。然而，`f` 作为参数收到的表达式，并非在 `f` 的局部环境中求值，而是在其调用者的环境中求值。当\
    \ `f` 直接从 `g` 调用时，调用者的环境是 `g` 调用的局部环境，其中定义了 `w`。但当 `f` 从 `h` 调用时，它并不是直接调用的。由于\
    \ `h` 调用了 `fq`，然后 `fq` 再调用 `f`，那么在这种情况下 `f` 的调用者是 `fq`。变量 `w` 定义在 `h` 的局部作用域中，但这并不是\
    \ `f` 试图求值表达式的地方；`f` 试图在 `fq` 的作用域中求值表达式，而 `fq` 中并未定义 `w`。\n\n如何解决这个问题并不那么显而易见。可以将环境连同表达式作为单独的函数参数传递，但如果需要处理多个表达式，这会变得很繁琐。我们想要的是将表达式与我们所希望在其中查找未显式覆盖的变量的环境关联起来，比如从数据框中获取这些变量。\n\
    \n表达式本身并不携带任何环境，因此我们无法直接实现这一点。然而，公式（formula）可以。我们可以改用单边公式，而不是表达式。此时的引用工作将涉及从表达式创建一个公式。如果公式是单边的，我们可以获取其第二个元素作为表达式，并且可以通过\
    \ `environment` 函数获取公式定义时的环境。我们可以重写 `f` 和 `fq` 函数，使其基于公式工作。\n\n```\nff <- function(expr,\
    \ data) {\n  eval(expr[[2]], data, environment(expr))\n}\nffq <- function(expr,\
    \ data) {\n  expr <- eval(substitute(~ expr))\n  environment(expr) <- rlang::caller_env()\n\
    \  ff(expr, data)\n}\n```\n\n使用 `ff` 时，你需要显式创建公式——类似于之前在 `f` 中显式引用表达式——这会自动为你提供与公式关联的环境。使用\
    \ `ffq` 时，我们通过 `substitute` 将表达式转换为公式，并显式将其环境设置为调用者的环境。现在我们可以像之前一样定义 `g` 和 `h`，只是\
    \ `g` 使用公式而非 `quote`。\n\n```\ng <- function(x, y, z) {\n  w <- x + y + z\n  ff(~\
    \ w + u + v, data.frame(u = 1:4, v = 1:4))\n}\nh <- function(x, y, z) {\n  w <-\
    \ x + y + z\n  ffq(w + u + v, data.frame(u = 1:4, v = 1:4))\n}\n```\n\n这次，两个函数都会在正确的作用域中求值表达式。\n\
    \n```\ng(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) + 1:4 + 1:4\n## [1] TRUE TRUE TRUE\
    \ TRUE\nh(1:4, 1:4, 1:4) == (1:4 + 1:4 + 1:4) + 1:4 + 1:4\n## [1] TRUE TRUE TRUE\
    \ TRUE\n```\n\n将环境与表达式关联起来，正是 `rlang` 包中 quosure 背后的思想。这个词是 quotes 和 closures\
    \ 的混成词——类似于闭包是带有环境的函数，quosure 是带有环境的引用表达式。Quosure 基于公式，我们可以像刚才的例子那样使用公式，但 `rlang`\
    \ 包提供的功能使得使用 quosure 来编程特定领域语言更加简单。`rlang` 包实现了所谓的整洁求值（tidy evaluation），这是下一章的主题。\n\
    \n# 8. 整洁求值\n\n所谓的 tidyverse 指的是一组设计上协同工作且基于相似设计的 R 包，这些包本身都可以被视为特定领域语言。这些包包括\
    \ `dplyr`、`tidyr` 和 `ggplot2`，主要由执行非标准求值的函数组成。它们管理非标准求值的方式在各包中是一致的，并且基于所谓的整洁求值，这主要依赖于\
    \ `rlang` 包中实现的两个特性：quosure 和准引用（quasi-quotation）。\n\n我们将再次使用 `rlang` 包，但为了明确指出何时使用该包而非基本的\
    \ R 非标准求值，我通常会使用完全限定名。换句话说，我会写 `rlang::quo` 而不是 `quo`，并且不加载该包。我们还会使用 `purrr` 包，但这里我也将使用完全限定名。不过，我会加载\
    \ `magrittr` 以获得管道操作符，以及 `tibble` 和 `dplyr` 包来处理数据框。\n\n```\nlibrary(magrittr)\n\
    library(dplyr)\nlibrary(tibble)\n```\n"
- fmt: "## Quosures\n\nThe `rlang` package provides functions to replace `quote` and\
    \ `substitute` that create quosures—expressions based on formulas that carry with\
    \ them their environment—instead of quoted expressions. To create a quosure from\
    \ an expression, you use `quo`.\n\n```\nq <- rlang::quo(2 * x)\nq\n##   expr:\
    \ ^2 * x\n##   env:  global\n```\n\nInside a function call, the quosure analog\
    \ to `substitute` is `enquo`.\n\n```\nf <- function(x) rlang::enquo(x)\nf(2 *\
    \ x)\n##   expr: ^2 * x\n##   env:  global\n```\n\nIn both examples, the scope\
    \ associated with the quosure is the global environment because this is the level\
    \ at which the expression is written.\n\nA quosure is just a special type of formula,\
    \ so we can access one as we did in the previous section to get the environment\
    \ and expression,\n\n```\nq[[2]]\n## 2 * x\nenvironment(q)\n## <environment: R_GlobalEnv>\n\
    ```\n\nHowever, `rlang` provides functions for working with quosures that make\
    \ the intent of our code clearer. To get the expression out of a quosure, we use\
    \ the function `get_expr`.\n\n```\nrlang::get_expr(q)\n## 2 * x\n```\n\nThe term\
    \ is ironic since the unquote function returns a quoted expression, but it does\
    \ strip away the quosure-ness and gives us a raw expression. There is another\
    \ unquote function, `UQ`, that does unquote an expression in the sense of evaluating\
    \ it, but it has a different purpose that we get to in the next section.\n\nGetting\
    \ the environment associated with a quosure can be done using `environment` as\
    \ we saw earlier, but the `rlang` function for this is `get_env`.\n\n```\nrlang::get_env(q)\n\
    ## <environment: R_GlobalEnv>\n```\n\nWith quosures, you can no longer evaluate\
    \ them with `eval`. A quosure is a formula, and the result of evaluating a formula\
    \ is the formula itself.\n\n```\neval(q)\n##   expr: ^2 * x\n##   env:  global\n\
    ```\n\nInstead, you need to use the function `eval_tidy`.\n\n```\nx <- 1\nrlang::eval_tidy(q)\n\
    ## [1] 2\nx <- 2\nrlang::eval_tidy(q)\n## [1] 4\n```\n\nThe quosure is evaluated\
    \ inside the environment it is associated with. We created quosure `q` inside\
    \ function `f`, but its environment is the global environment, so when we modify\
    \ this, by changing `x`, it affects the result of evaluating `q`.\n\nIf we create\
    \ a quosure inside a local function scope, it will remember this context—just\
    \ like a closure. For example, if we define function `f` as this\n\n```\nf <-\
    \ function(x, y) rlang::quo(x + y + z)\n```\n\nthe quosure will know the function\
    \ parameters `x` and `y` from when `f` is called but will have to find `z` elsewhere.\
    \ Consider the contrast between evaluating the quosure and the expression `x +\
    \ y + z` directly, shown here:\n\n```\nq <- f(1, 2)\nx <- y <- z <- 3\nrlang::eval_tidy(q)\
    \ # 1 + 2 + 3\n## [1] 6\nx + y + z # 3 + 3 + 3\n## [1] 9\n```\n\nJust like `eval`,\
    \ `eval_tidy` lets you provide a list, data frame, or environment with bindings\
    \ from variables to values. When you do this, the values you provide will overrule\
    \ the variables in the quosure’s environment—an effect known as over-scoping.\
    \ Consider this:\n\n```\nx <- 1:4\ny <- 1:4\nq <- quo(x+y)\nrlang::eval_tidy(q)\n\
    ## [1] 2 4 6 8\nrlang::eval_tidy(q, list(x = 5:8))\n## [1]  6  8 10 12\n```\n\n\
    The quosure `q` is bound to the global environment, so when we evaluate it, `x`\
    \ and `y` are both `1:4`. However, when we provide the second argument to `eval_tidy`,\
    \ we can override the value of `x` to `5:8`. You will recognize this feature from\
    \ `dplyr` where you have access to columns in data frames in arguments you provide\
    \ to the functions there, and these columns overrule any global variable that\
    \ might otherwise have been used.\n\nThis can also be used to override variables\
    \ in a function call with function parameters. Consider these two functions:\n\
    \n```\nf <- function(expr,x) {\n  q <- rlang::enquo(expr)\n  rlang::eval_tidy(q)\n\
    }\ng <- function(expr,x) {\n  q <- rlang::enquo(expr)\n  rlang::eval_tidy(q, environment())\n\
    }\nf(x + y, x = 5:8)\n## [1] 2 4 6 8\ng(x + y, x = 5:8)\n## [1]  6  8 10 12\n\
    ```\n\nThe function `f` evaluates the quosure in its scope, which doesn’t contain\
    \ the function parameter `x`, while the function `g` over-scopes with the function\
    \ environment. This makes the variable `x` refer to the function parameter rather\
    \ than the global parameter.\n\nThe expression you evaluate with `eval_tidy` doesn’t\
    \ have to be a quosure. The function is equally happy to evaluate bare expressions,\
    \ and then it behaves just like `eval`.\n\n```\nrlang::eval_tidy(quote(x + y))\n\
    ## [1] 2 4 6 8\n```\n\nJust like `eval`, `eval_tidy` takes a third argument that\
    \ will behave as the enclosing scope. This is used for bare expressions—those\
    \ created with `quote`.\n\n```\nrlang::eval_tidy(quote(xx), env = list2env(list(xx\
    \ = 5:8)))\n## [1] 5 6 7 8\n```\n\nIt is not used with quosures.\n\n```\nrlang::eval_tidy(quo(xx),\
    \ env = list2env(list(xx = 5:8)))\n## Error in rlang::eval_tidy(quo(xx), env =\
    \ list2env(list(xx = 5:8))): object 'xx' not found\n```\n\nThe `list2env` function\
    \ I have used here translates a list into an environment—as strongly hinted by\
    \ the name. It is a quick way to construct an environment and populate it with\
    \ variables.\n\nIf you want to create a closure with over-scoping (in other words,\
    \ you want to create a function that evaluates a quosure where it first finds\
    \ local variables and then look in the quosure’s environment), you cannot directly\
    \ call `eval_tidy` when creating the function. This would ask R to attempt to\
    \ evaluate the closure, but you do not yet have the variables you need—those are\
    \ provided when you call the closure. Instead, you can separate the bare expression\
    \ and the environment of the quosure using `get_expr` and `get_env`, respectively.\
    \ Consider the function `make_function` shown here:\n\n```\nmake_function <- function(args,\
    \ body) {\n  body <- rlang::enquo(body)\n  rlang::new_function(args, rlang::get_expr(body),\
    \ rlang::get_env(body))\n}\ng <- make_function(alist(x = , y = ), x + y)\ng(x\
    \ = 1:4, y = 1:4)\n## [1]  3  6  9 12\n```\n\nHere, `make_function` takes two\
    \ arguments, a pair list of arguments and an expression for the body of a function.\
    \ It is slightly more primitive than the lambda expressions we wrote in the previous\
    \ chapter, but it is essentially doing the same thing. In this example, I am focusing\
    \ on the closure we create rather than on language design issues. We translate\
    \ the function body into a quosure, which guarantees that we have an environment\
    \ associated with it. In the function we create using `new_function`, however,\
    \ we strip the environment from the quosure to create the body of the new function,\
    \ but we assign the function’s environment to be the quosure environment.\n\n\
    In the function `f` we have a local scope that knows the value of `z`, and we\
    \ create a new function in this scope. The quosure we get from this is associated\
    \ with the local `f` scope, so it also knows about `z`. We provide variables `x`\
    \ and `y`, when calling `g`, but the `z` value is taken from the local scope of\
    \ `f`.\n\nIf called directly, there is no difference between using the caller’s\
    \ environment or the quosure’s environment.\n\n```\nmake_function_quo <- function(args,\
    \ body) {\n  body <- rlang::enquo(body)\n  rlang::new_function(args, rlang::get_expr(body),\
    \ rlang::get_env(body))\n}\nmake_function_quote <- function(args, body) {\n  body\
    \ <- substitute(body)\n  rlang::new_function(args, body, rlang::caller_env())\n\
    }\ng <- make_function_quo(alist(x=, y=), x + y)\nh <- make_function_quote(alist(x=,\
    \ y=), x + y)\ng(x = 1:4, y = 1:4)\n## [1] 2 4 6 8\nh(x = 1:4, y = 1:4)\n## [1]\
    \ 2 4 6 8\n```\n\nHowever, consider a more involved example, where we collect\
    \ expressions in a list and have a function for translating all the expressions\
    \ into functions that we can then apply over values using the `invoke_map` function\
    \ from the `purrr` package. We can construct the expressions like this, using\
    \ the linked lists structure we have previously used:\n\n```\ncons <- function(elm,\
    \ lst) list(car=elm, cdr=lst)\nlst_length <- function(lst) {\n  len <- 0\n  while\
    \ (!is.null(lst)) {\n    lst <- lst$cdr\n    len <- len + 1\n  }\n  len\n}\nlst_to_list\
    \ <- function(lst) {\n  v <- vector(mode = \"list\", length = lst_length(lst))\n\
    \  index <- 1\n  while (!is.null(lst)) {\n    v[[index]] <- lst$car\n    lst <-\
    \ lst$cdr\n    index <- index + 1\n  }\n  v\n}\nexpressions <- function() list(ex\
    \ = NULL)\nadd_expression <- function(ex, expr) {\n  ex$ex <- cons(rlang::enquo(expr),\
    \ ex$ex)\n  ex\n}\n```"
  raw: "## Quosures\n\nThe `rlang` package provides functions to replace `quote` and\
    \ `substitute` that create quosures—expressions based on formulas that carry with\
    \ them their environment—instead of quoted expressions. To create a quosure from\
    \ an expression, you use `quo`.\n\n```\nq \n##   expr: ^2 * x\n##   env:  global\n\
    ```\n\nInside a function call, the quosure analog to `substitute` is `enquo`.\n\
    \n```\nf \n##   expr: ^2 * x\n##   env:  global\n```\n\nIn both examples, the\
    \ scope associated with the quosure is the global environment because this is\
    \ the level at which the expression is written.\n\nA quosure is just a special\
    \ type of formula, so we can access one as we did in the previous section to get\
    \ the environment and expression,\n\n```\nq[[2]]\n## 2 * x\nenvironment(q)\n##\
    \ \n```\n\nHowever, `rlang` provides functions for working with quosures that\
    \ make the intent of our code clearer. To get the expression out of a quosure,\
    \ we use the function `get_expr`.\n\n```\nrlang::get_expr(q)\n## 2 * x\n```\n\n\
    The term is ironic since the unquote function returns a quoted expression, but\
    \ it does strip away the quosure-ness and gives us a raw expression. There is\
    \ another unquote function, `UQ`, that does unquote an expression in the sense\
    \ of evaluating it, but it has a different purpose that we get to in the next\
    \ section.\n\nGetting the environment associated with a quosure can be done using\
    \ `environment` as we saw earlier, but the `rlang` function for this is `get_env`.\n\
    \n```\nrlang::get_env(q)\n## \n```\n\nWith quosures, you can no longer evaluate\
    \ them with `eval` . A quosure is a formula, and the result of evaluating a formula\
    \ is the formula itself.\n\n```\neval(q)\n## \n##   expr: ^2 * x\n##   env:  global\n\
    ```\n\nInstead, you need to use the function `eval_tidy`.\n\n```\nx <- 1\nrlang::eval_tidy(q)\n\
    ## [1] 2\nx <- 2\nrlang::eval_tidy(q)\n## [1] 4\n```\n\nThe quosure is evaluated\
    \ inside the environment it is associated with. We created quosure `q` inside\
    \ function `f`, but its environment is the global environment, so when we modify\
    \ this, by changing `x`, it affects the result of evaluating `q`.\n\nIf we create\
    \ a quosure inside a local function scope, it will remember this context—just\
    \ like a closure. For example, if we define function `f` as this\n\n```\nf <-\
    \ function(x, y) rlang::quo(x + y + z)\n```\n\nthe quosure will know the function\
    \ parameters `x` and `y` from when `f` is called but will have to find `z` elsewhere.\
    \ Consider the contrast between evaluating the quosure and the expression `x +\
    \ y + z` directly, shown here:\n\n```\nq <- f(1, 2)\nx <- y <- z <- 3\nrlang::eval_tidy(q)\
    \ # 1 + 2 + 3\n## [1] 6\nx + y + z # 3 + 3 + 3\n## [1] 9\n```\n\nJust like `eval`,\
    \ `eval_tidy` lets you provide a list, data frame, or environment with bindings\
    \ from variables to values. When you do this, the values you provide will overrule\
    \ the variables in the quosure’s environment—an effect known as over-scoping .\
    \ Consider this:\n\n```\nx <- 1:4\ny <- 1:4\nq <- quo(x+y)\nrlang::eval_tidy(q)\n\
    ## [1] 2 4 6 8\nrlang::eval_tidy(q, list(x = 5:8))\n## [1]  6  8 10 12\n```\n\n\
    The quosure `q` is bound to the global environment, so when we evaluate it, `x`\
    \ and `y` are both `1:4`. However, when we provide the second argument to `eval_tidy`,\
    \ we can override the value of `x` to `5:8`. You will recognize this feature from\
    \ `dplyr` where you have access to columns in data frames in arguments you provide\
    \ to the functions there, and these columns overrule any global variable that\
    \ might otherwise have been used.\n\nThis can also be used to override variables\
    \ in a function call with function parameters. Consider these two functions:\n\
    \n```\nf <- function(expr,x) {\nq <- rlang::enquo(expr)\nrlang::eval_tidy(q)\n\
    }\ng <- function(expr,x) {\nq <- rlang::enquo(expr)\nrlang::eval_tidy(q, environment())\n\
    }\nf(x + y, x = 5:8)\n## [1] 2 4 6 8\ng(x + y, x = 5:8)\n## [1]  6  8 10 12\n\
    ```\n\nThe function `f` evaluates the quosure in its scope, which doesn’t contain\
    \ the function parameter `x`, while the function `g` over-scopes with the function\
    \ environment. This makes the variable `x` refer to the function parameter rather\
    \ than the global parameter.\n\nThe expression you evaluate with `eval_` `tidy`\
    \ doesn’t have to be a quosure. The function is equally happy to evaluate bare\
    \ expressions, and then it behaves just like `eval`.\n\n```\nrlang::eval_tidy(quote(x\
    \ + y))\n## [1] 2 4 6 8\n```\n\nJust like `eval`, `eval_` `tidy` takes a third\
    \ argument that will behave as the enclosing scope. This is used for bare expressions—those\
    \ created with `quote`.\n\n```\nrlang::eval_tidy(quote(xx), env = list2env(list(xx\
    \ = 5:8)))\n## [1] 5 6 7 8\n```\n\nIt is not used with quosures.\n\n```\nrlang::eval_tidy(quo(xx),\
    \ env = list2env(list(xx = 5:8)))\n## Error in rlang::eval_tidy(quo(xx), env =\
    \ list2env(list(xx = 5:8))): object 'xx' not found\n```\n\nThe `list2env` function\
    \ I have used here translates a list into an environment—as strongly hinted by\
    \ the name. It is a quick way to construct an environment and populate it with\
    \ variables.\n\nIf you want to create a closure with over-scoping (in other words,\
    \ you want to create a function that evaluates a quosure where it first finds\
    \ local variables and then look in the quosure’s environment), you cannot directly\
    \ call `eval_tidy` when creating the function. This would ask R to attempt to\
    \ evaluate the closure, but you do not yet have the variables you need—those are\
    \ provided when you call the closure. Instead, you can separate the bare expression\
    \ and the environment of the quosure using `get_expr` and `get_env`, respectively.\
    \ Consider the function `make_function` shown here:\n\n```\nmake_function \ng(x\
    \ = 1:4, y = 1:4)\n## [1]  3  6  9 12\n```\n\nHere, `make_function` takes two\
    \ arguments, a pair list of arguments and an expression for the body of a function.\
    \ It is slightly more primitive than the lambda expressions we wrote in the previous\
    \ chapter, but it is essentially doing the same thing. In this example, I am focusing\
    \ on the closure we create rather than on language design issues. We translate\
    \ the function body into a quosure, which guarantees that we have an environment\
    \ associated with it. In the function we create using `new_function`, however,\
    \ we strip the environment from the quosure to create the body of the new function,\
    \ but we assign the function’s environment to be the quosure environment.\n\n\
    In the function `f` we have a local scope that knows the value of `z`, and we\
    \ create a new function in this scope. The quosure we get from this is associated\
    \ with the local `f` scope, so it also knows about `z`. We provide variables `x`\
    \ and `y`, when calling `g`, but the `z` value is taken from the local scope of\
    \ `f`.\n\nIf called directly, there is no difference between using the caller’s\
    \ environment or the quosure’s environment.\n\n```\nmake_function_quo <- function(args,\
    \ body) {\nbody <- rlang::enquo(body)\nrlang::new_function(args, rlang::get_expr(body),\
    \ rlang::get_env(body))\n}\nmake_function_quote <- function(args, body) {\nbody\
    \ <- substitute(body)\nrlang::new_function(args, body, rlang::caller_env())\n\
    }\ng <- make_function_quo(alist(x=, y=), x + y)\nh <- make_function_quote(alist(x=,\
    \ y=), x + y)\ng(x = 1:4, y = 1:4)\n## [1] 2 4 6 8\nh(x = 1:4, y = 1:4)\n## [1]\
    \ 2 4 6 8\n```\n\nHowever, consider a more involved example, where we collect\
    \ expressions in a list and have a function for translating all the expressions\
    \ into functions that we can then apply over values using the `invoke_map` function\
    \ from the `purrr` package. We can construct the expressions like this, using\
    \ the linked lists structure we have previously used:\n\n```\ncons <- function(elm,\
    \ lst) list(car=elm, cdr=lst)\nlst_length <- function(lst) {\nlen <- 0\nwhile\
    \ (!is.null(lst)) {\nlst <- lst$cdr\nlen <- len + 1\n}\nlen\n}\nlst_to_list <-\
    \ function(lst) {\nv <- vector(mode = \"list\", length = lst_length(lst))\nindex\
    \ <- 1\nwhile (!is.null(lst)) {\nv[[index]] <- lst$car\nlst <- lst$cdr\nindex\
    \ <- index + 1\n}\nv\n}\nexpressions <- function() list(ex = NULL)\nadd_expression\
    \ <- function(ex, expr) {\nex$ex <- cons(rlang::enquo(expr), ex$ex)\nex\n}\n```"
  trans: "\n## 引号表达式\n\n`rlang` 包提供了替代 `quote` 和 `substitute` 的函数，用于创建引号表达式（quosures）——一种基于公式的表达式，它会携带其所在的环境——而非单纯的引号表达式。要从一个表达式创建引号表达式，可以使用\
    \ `quo`。\n\n```\nq <- rlang::quo(2 * x)\nq\n##   expr: ² * x\n##   env:  global\n\
    ```\n\n在函数调用内部，与 `substitute` 对应的引号表达式函数是 `enquo`。\n\n```\nf <- function(x) rlang::enquo(x)\n\
    f(2 * x)\n##   expr: ² * x\n##   env:  global\n```\n\n在这两个例子中，与引号表达式关联的作用域都是全局环境，因为表达式正是在这个层面上编写的。\n\
    \n引号表达式只是公式的一种特殊类型，因此我们可以像上一节那样访问它的环境和表达式：\n\n```\nq[[2]]\n## 2 * x\nenvironment(q)\n\
    ## <environment: R_GlobalEnv>\n```\n\n然而，`rlang` 提供了专门处理引号表达式的函数，能让我们的代码意图更加清晰。要获取引号表达式中的表达式，可以使用\
    \ `get_expr` 函数。\n\n```\nrlang::get_expr(q)\n## 2 * x\n```\n\n这个术语有些反讽，因为 unquote\
    \ 函数返回的是一个引号表达式，但它确实剥离了引号表达式的包装，返回了一个原始表达式。还有一个反引号函数 `UQ`，它会在求值的意义上对表达式进行反引号，但其用途不同，我们将在下一节介绍。\n\
    \n获取与引号表达式关联的环境，可以使用前面提到的 `environment` 函数，但 `rlang` 中对应的函数是 `get_env`。\n\n```\n\
    rlang::get_env(q)\n## <environment: R_GlobalEnv>\n>\n\n使用引号表达式时，就不能再用 `eval` 对其进行求值了。引号表达式本质上是一个公式，而公式的求值结果就是公式本身。\n\
    \n```\neval(q)\n##   expr: ² * x\n##   env:  global\n```\n\n相反，你需要使用 `eval_tidy`\
    \ 函数。\n\n```\nx <- 1\nrlang::eval_tidy(q)\n## [1] 2\nx <- 2\nrlang::eval_tidy(q)\n\
    ## [1] 4\n```\n\n引号表达式会在其关联的环境中求值。我们在函数 `f` 内部创建了引号表达式 `q`，但它的环境是全局环境，所以当我们修改\
    \ `x` 的值时，会影响 `q` 的求值结果。\n\n如果我们在一个局部函数作用域内创建引号表达式，它会记住这个上下文——就像闭包一样。例如，我们将函数\
    \ `f` 定义如下：\n\n```\nf <- function(x, y) rlang::quo(x + y + z)\n```\n\n这个引号表达式会记住调用\
    \ `f` 时的函数参数 `x` 和 `y`，但 `z` 则需要从别处获取。考虑一下直接求值引号表达式与求值表达式 `x + y + z` 的区别：\n\n\
    ```\nq <- f(1, 2)\nx <- y <- z <- 3\nrlang::eval_tidy(q) # 1 + 2 + 3\n## [1] 6\n\
    x + y + z # 3 + 3 + 3\n## [1] 9\n```\n\n与 `eval` 相似，`eval_tidy` 允许你提供一个列表、数据框或环境，其中包含变量到值的绑定。当你这样做时，你提供的值会覆盖引号表达式环境中的变量——这种效果被称为**超域作用**。示例如下：\n\
    \n```\nx <- 1:4\ny <- 1:4\nq <- quo(x+y)\nrlang::eval_tidy(q)\n## [1] 2 4 6 8\n\
    rlang::eval_tidy(q, list(x = 5:8))\n## [1]  6  8 10 12\n```\n\n引号表达式 `q` 绑定到全局环境，因此当我们求值时，`x`\
    \ 和 `y` 都是 `1:4`。但是，当我们向 `eval_tidy` 提供第二个参数时，可以将 `x` 的值覆盖为 `5:8`。这个特性你应该在 `dplyr`\
    \ 中见过，在那里你可以通过参数访问数据框中的列，并且这些列会覆盖任何可能被使用的全局变量。\n\n这个特性也可以用来在函数调用中用函数参数覆盖变量。考虑以下两个函数：\n\
    \n```\nf <- function(expr,x) {\n  q <- rlang::enquo(expr)\n  rlang::eval_tidy(q)\n\
    }\ng <- function(expr,x) {\n  q <- rlang::enquo(expr)\n  rlang::eval_tidy(q, environment())\n\
    }\nf(x + y, x = 5:8)\n## [1] 2 4 6 8\ng(x + y, x = 5:8)\n## [1]  6  8 10 12\n\
    ```\n\n函数 `f` 在其作用域内求值引号表达式，该作用域不包含函数参数 `x`；而函数 `g` 使用函数环境进行超域作用。这使得变量 `x` 指向了函数参数而非全局参数。\n\
    \n你在 `eval_tidy` 中求值的表达式不必是引号表达式。该函数同样可以愉快地求值原始表达式，此时它的行为与 `eval` 完全一致。\n\n```\n\
    rlang::eval_tidy(quote(x + y))\n## [1] 2 4 6 8\n```\n\n与 `eval` 一样，`eval_tidy`\
    \ 接受第三个参数，该参数将作为封闭作用域。这用于处理原始表达式——那些通过 `quote` 创建的表达式。\n\n```\nrlang::eval_tidy(quote(xx),\
    \ env = list2env(list(xx = 5:8)))\n## [1] 5 6 7 8\n```\n\n对于引号表达式，则不会使用此参数。\n\n\
    ```\nrlang::eval_tidy(quo(xx), env = list2env(list(xx = 5:8)))\n## Error in rlang::eval_tidy(quo(xx),\
    \ env = list2env(list(xx = 5:8))): object 'xx' not found\n>\n\n（正如其名所暗示的）我在这里使用的\
    \ `list2env` 函数可以将列表转换为环境。它是快速构造环境并填充变量的方法。\n\n如果你想创建一个具有超域作用的闭包（换句话说，你想创建一个函数，它在求值引号表达式时先查找局部变量，然后再查找引号表达式的环境），那么在创建函数时不能直接调用\
    \ `eval_tidy`。这会让 R 尝试求值该闭包，但此时你还没有所需的变量——这些变量是在你调用闭包时才提供的。相反，你可以分别使用 `get_expr`\
    \ 和 `get_env` 来分离原始表达式和引号表达式的环境。考虑下面所示的 `make_function` 函数：\n\n```\nmake_function\
    \ <- function(args, body) {\n  body <- rlang::enquo(body)\n  rlang::new_function(args,\
    \ rlang::get_expr(body), rlang::get_env(body))\n}\ng <- make_function(alist(x\
    \ = , y = ), x + y)\ng(x = 1:4, y = 1:4)\n## [1]  3  6  9 12\n```\n\n这里，`make_function`\
    \ 接受两个参数：一个参数的对偶列表和一个函数体的表达式。这比我们在前一章编写的 lambda 表达式更底层一些，但本质上是相同的。在这个例子中，我关注的是我们创建的闭包，而不是语言设计问题。我们将函数体转换为引号表达式，这保证了它有一个关联的环境。然而，在使用\
    \ `new_function` 创建的函数中，我们从引号表达式中提取环境来创建新函数的函数体，但我们将函数的环境设置为该引号表达式的环境。\n\n在函数\
    \ `f` 中，我们有一个知道 `z` 值的局部作用域，并在该作用域内创建了一个新函数。由此得到的引号表达式与局部作用域 `f` 关联，因此它也知道 `z`。调用\
    \ `g` 时我们提供了变量 `x` 和 `y`，但 `z` 的值取自 `f` 的局部作用域。\n\n如果直接调用，使用调用者的环境和使用引号表达式的环境是没有区别的。\n\
    \n```\nmake_function_quo <- function(args, body) {\n  body <- rlang::enquo(body)\n\
    \  rlang::new_function(args, rlang::get_expr(body), rlang::get_env(body))\n}\n\
    make_function_quote <- function(args, body) {\n  body <- substitute(body)\n  rlang::new_function(args,\
    \ body, rlang::caller_env())\n}\ng <- make_function_quo(alist(x=, y=), x + y)\n\
    h <- make_function_quote(alist(x=, y=), x + y)\ng(x = 1:4, y = 1:4)\n## [1] 2\
    \ 4 6 8\nh(x = 1:4, y = 1:4)\n## [1] 2 4 6 8\n```\n\n但是，考虑一个更复杂的例子：我们将表达式收集到一个列表中，并编写一个函数将所有表达式转换为函数，然后使用\
    \ `purrr` 包中的 `invoke_map` 函数将这些函数应用于数值。我们可以像这样使用之前用过的链表结构来构建表达式：\n\n```\ncons\
    \ <- function(elm, lst) list(car=elm, cdr=lst)\nlst_length <- function(lst) {\n\
    \  len <- 0\n  while (!is.null(lst)) {\n    lst <- lst$cdr\n    len <- len + 1\n\
    \  }\n  len\n}\nlst_to_list <- function(lst) {\n  v <- vector(mode = \"list\"\
    , length = lst_length(lst))\n  index <- 1\n  while (!is.null(lst)) {\n    v[[index]]\
    \ <- lst$car\n    lst <- lst$cdr\n    index <- index + 1\n  }\n  v\n}\nexpressions\
    \ <- function() list(ex = NULL)\nadd_expression <- function(ex, expr) {\n  ex$ex\
    \ <- cons(rlang::enquo(expr), ex$ex)\n  ex\n}\n```\n"
- fmt: "将表达式转换为函数非常直接。如果我们希望函数的顺序与添加顺序一致，则需要对结果列表进行反转，因为我们在使用链表时总是将表达式添加到列表头部。\n\n\
    ```\nmake_functions <- function(ex, args) {\n  results <- vector(\"list\", length\
    \ = lst_length(ex$ex))\n  i <- 1; lst <- ex$ex\n  while (!is.null(lst)) {\n  \
    \  results[[i]] <-\n      rlang::new_function(args, rlang::get_expr(lst$car),\n\
    \                          rlang::get_env(lst$car))\n    i <- i + 1\n    lst <-\
    \ lst$cdr\n  }\n  rev(results)\n}\n```\n\n借助这个用于收集表达式的小型领域特定语言，我们可以编写一个函数，该函数根据给定的截距创建用于计算直线上各点\
    \ `y` 坐标的表达式。\n\n```\nmake_line_expressions <- function(intercept) {\n  new_expr_list()\
    \ %>%\n    add_expression(coef + intercept) %>%\n    add_expression(2*coef + intercept)\
    \ %>%\n    add_expression(3*coef + intercept) %>%\n    add_expression(4*coef +\
    \ intercept)\n}\n```\n\n当调用`make_line_expressions`时，这些表达式就已经知晓截距（`intercept`）的值——至少这是设计意图——但斜率（`coef`）应该在后续的函数调用中提供。我们可以通过另一个函数为这些表达式创建具体的函数。\n\
    \n```\neval_line <- function(ex, coef) {\n  ex %>%\n    make_functions(alist(coef=))\
    \ %>%\n    purrr::invoke_map(coef = coef) %>% unlist()\n}\n```\n\n`invoke_map`函数类似于`purrr`包中的各种`map`函数，但它不是将一个函数应用于多个值，而是接受一系列函数，并将每个函数应用于同一个值。\n\
    \n现在，我们可以将这些函数通过管道连接起来，以获取直线上的点。\n\n```\nmake_line_expressions(intercept = 0)\
    \ %>% eval_line(coef = 1)\n## [1] 1 2 3 4\nmake_line_expressions(intercept = 0)\
    \ %>% eval_line(coef = 2)\n## [1] 2 4 6 8\nmake_line_expressions(intercept = 1)\
    \ %>% eval_line(coef = 1)\n## [1] 2 3 4 5\n```\n\n这里一切都按预期工作，但如果使用引号（即裸表达式，而非`quo`/`expr`）会怎样呢？编写对应的函数很简单。\n\
    \n```\nadd_expression <- function(ex, expr) {\n  ex$ex <- cons(substitute(expr),\
    \ ex$ex)\n  ex\n}\nmake_functions <- function(ex, args) {\n  results <- vector(\"\
    list\", length = lst_length(ex$ex))\n  i <- 1; lst <- ex$ex\n  while (!is.null(lst))\
    \ {\n    results[[i]] <- rlang::new_function(args, lst$car, rlang::caller_env())\n\
    \    i <- i + 1\n    lst <- lst$cdr\n  }\n  rev(results)\n}\n```\n\n然而，如果我们尝试像之前那样使用它们，会得到一个错误。\n\
    \n```\nmake_line_expressions(intercept = 0) %>% eval_line(coef = 1)\n## Error\
    \ in (function (coef) : object 'intercept' not found\n```\n\n一旦我们考虑哪些环境中包含`intercept`的信息，原因就很明显了。这个变量存在于`make_line_expressions`调用作用域内，但当我们创建函数时，是从`eval_line`内部调用`make_functions`的。这些函数创建时，其闭包是`eval_line`的局部环境，而`intercept`并不在那里。\n\
    \n通常，在非标准求值中使用`quosure`比使用裸表达式更安全，这正是因为它们携带着定义时的环境，缓解了我们在跟踪求值环境时遇到的问题。\n\n在进入下一个主题之前，需要提到`quos`函数。这个函数的工作方式类似于`quo`，但它接收一系列参数，并以`quosure`列表的形式返回。\n\
    \n```\nrlang::quos(x, y, x+y)\n## [[1]]\n## \n##   expr: ^x\n##   env:  global\n\
    ##\n## [[2]]\n## \n##   expr: ^y\n##   env:  global\n##\n## [[3]]\n## \n##   expr:\
    \ ^x + y\n##   env:  global\n```\n\n`quos`的主要用途是将三点参数（`...`）转换为一个`quosure`列表。\n\
    \n```\nf <- function(...) rlang::quos(...)\nf(x, y, z)\n## [[1]]\n## \n##   expr:\
    \ ^x\n##   env:  global\n##\n## [[2]]\n## \n##   expr: ^y\n##   env:  global\n\
    ##\n## [[3]]\n## \n##   expr: ^z\n##   env:  global\n```\n\n## 准引用\n\n本章的最后一个主题涉及准引用。这是一种机制，我们可以处理引用的表达式，同时用子表达式的求值结果替换表达式的某些部分。当直接调用执行非标准求值的函数时，我们通常可以按需提供表达式，但一旦我们在程序中使用这些非标准求值函数（例如从其他函数中调用它们），我们就需要一定的灵活性来构建表达式。我们可以通过修改`call`对象的元编程方式来实现，但更好的方法是使用`rlang`包实现的准引用机制。\n\
    \n考虑这个简单的例子。我们有一个数据框，想要过滤掉某个指定列包含缺失数据的行。我们可以使用`dplyr`的`filter`函数实现：\n\n```\ndf\
    \ <- tibble::tibble(x = c(1, NA, 3, 4, 5, NA, 7), \n                     y = c(1,\
    \ 2, 3, NA, 5, 6, NA))\ndf %>% dplyr::filter(!is.na(x))\n## # A tibble: 5 x 2\n\
    ##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n## 2     3     3\n## 3\
    \     4    NA\n## 4     5     5\n## 5     7    NA\ndf %>% dplyr::filter(!is.na(y))\n\
    ## # A tibble: 5 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n\
    ## 2    NA     2\n## 3     3     3\n## 4     5     5\n## 5    NA     6\n```\n\n\
    这里，我们对两个不同的变量使用了相同的代码。这段代码很简单，所以为了演示，我们不会写一个函数来避免重复，但对于更复杂的管道，我们通常会这样做。因此，我们尝试将这个管道封装成一个函数。\n\
    \n```\nfilter_on_na <- function(df, column) {\n  column <- substitute(column)\n\
    \  df %>% dplyr::filter(!is.na(column))\n}\ndf %>% filter_on_na(x)\n## Warning\
    \ in is.na(column): is.na() applied to non-\n## (list or vector) of type 'symbol'\n\
    ## # A tibble: 7 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n\
    ## 2    NA     2\n## 3     3     3\n## 4     4    NA\n## 5     5     5\n## 6 \
    \   NA     6\n## 7     7    NA\n```\n\n我们使用`substitute`将列名转换为符号，然后应用`filter`管道。当然，它不起作用，原因是`filter`也执行非标准求值，并将谓词`!is.na(column)`直接当作表达式处理。所以，它需要知道变量`column`。现在，由于`filter`将其参数当作`quosure`求值，它可以找到变量`column`，但它发现这是一个符号——在本例中，它是符号`x`——但这并不是我们想要它看到的内容。我们想让`filter`看到列`x`，但这并不是`filter`的工作方式。\n\
    \n我们想要做的是将变量`column`中持有的符号替换到`filter`所看到的表达式（`quosure`）中。我们可以通过“砰-砰”（bang-bang）操作符`!!`来实现。\n\
    \n```\nfilter_on_na <- function(df, column) {\n  column <- rlang::enexpr(column)\n\
    \  df %>% dplyr::filter(!is.na(!!column))\n}\ndf %>% filter_on_na(x)\n## # A tibble:\
    \ 5 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n## 2     3   \
    \  3\n## 3     4    NA\n## 4     5     5\n## 5     7    NA\ndf %>% filter_on_na(y)\n\
    ## # A tibble: 5 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n\
    ## 2    NA     2\n## 3     3     3\n## 4     5     5\n## 5    NA     6\n```\n\n\
    这个操作符对其后面的表达式进行“反引用”（unquote），求值并将结果插入到`filter`看到的引用表达式中。所以，是将变量`column`的值（而不是符号`column`）插入到`!is.na(!!column)`中。\n\
    \n你可能已经注意到，我使用了另一个函数`rlang::enexpr`来创建引用的列名。在`rlang`包中，有两个函数的行为类似于`quote`和`substitute`，它们创建裸表达式，但允许使用`!!`操作符进行准引用，这是`substitute`和`quote`所不具备的。考虑如下定义的函数`f`和`g`：\n\
    \n```\nf <- function(x) substitute(x)\ng <- function(x) rlang::enexpr(x)\n```\n\
    \n当直接调用时，两者都会返回作为参数`x`传入的表达式，但考虑从另一个函数`h`中调用它们的情况，我们希望在`h`中将其参数值替换为`f`或`g`的参数`x`。"
  raw: "Translating the expressions into functions is straightforward. We need to\
    \ reverse the resulting list only if we want the functions in the order we add\
    \ them since we prepend expressions when we use the linked lists.\n\n```\nmake_functions\
    \ <- function(ex, args) {\nresults <- vector(\"list\", length = lst_length(ex$ex))\n\
    i <- 1; lst <- ex$ex\nwhile (!is.null(lst)) {\nresults[[i]] <-\nrlang::new_function(args,\
    \ rlang::get_expr(lst$car),\nrlang::get_env(lst$car))\ni <- i + 1\nlst <- lst$cdr\n\
    }\nrev(results)\n}\n```\n\nWith this small domain-specific language for collecting\
    \ expressions, we can write a function that creates expressions for computing\
    \ y-coordinates of a line given an intercept.\n\n```\nmake_line_expressions %\n\
    add_expression(coef + intercept) %>%\nadd_expression(2*coef + intercept) %>%\n\
    add_expression(3*coef + intercept) %>%\nadd_expression(4*coef + intercept)\n}\n\
    ```\n\nThe expressions know the intercept when we call `make_line_expressions`—that\
    \ is the intent at least—but the coefficient should be added later in a function\
    \ call. We can create the functions for the expressions using another function.\n\
    \n```\neval_line % make_functions(alist(coef=)) %>%\npurrr::invoke_map(coef =\
    \ coef) %>% unlist()\n}\n```\n\nThe `invoke_map` function is similar to the various\
    \ `map` functions from `purrr`, but instead of mapping a function over several\
    \ values, it takes a sequence of functions and applies each to a value.\n\nWe\
    \ can now pipe these functions together to get points on a line.\n\n```\nmake_line_expressions(intercept\
    \ = 0) %>% eval_line(coef = 1)\n## [1] 1 2 3 4\nmake_line_expressions(intercept\
    \ = 0) %>% eval_line(coef = 2)\n## [1] 2 4 6 8\nmake_line_expressions(intercept\
    \ = 1) %>% eval_line(coef = 1)\n## [1] 2 3 4 5\n```\n\nEverything works as intended\
    \ here, but what would happen if we used quotes instead? It is simple to write\
    \ the corresponding functions.\n\n```\nadd_expression <- function(ex, expr) {\n\
    ex$ex <- cons(substitute(expr), ex$ex)\nex\n}\nmake_functions <- function(ex,\
    \ args) {\nresults <- vector(\"list\", length = lst_length(ex$ex))\ni <- 1; lst\
    \ <- ex$ex\nwhile (!is.null(lst)) {\nresults[[i]] <- rlang::new_function(args,\
    \ lst$car, rlang::caller_env())\ni <- i + 1\nlst <- lst$cdr\n}\nrev(results)\n\
    }\n```\n\nWe will get an error if we try to use them as before, however.\n\n```\n\
    make_line_expressions(intercept = 0) %>% eval_line(coef = 1)\n## Error in (function\
    \ (coef) : object 'intercept' not found\n```\n\nThe reason for this is obvious\
    \ once we consider which environments contain information about the intercept.\
    \ This variable lives in the scope of calls to `make_line_expressions` , but when\
    \ we create the functions, we do so by calling `make_functions` from inside `eval_line`.\
    \ The functions are created with `eval_line` local environments as their closures,\
    \ and `intercept` is not found there.\n\nIn general, it is safer to use quosures\
    \ than bare expressions for non-standard evaluation exactly because they carry\
    \ their environment with them, alleviating the problems we have with keeping track\
    \ of which environment to evaluate expressions in.\n\nOne thing to mention before\
    \ we move on to the next topic is the function `quos`. This function works as\
    \ `quo` but for a sequence of arguments that are returned as a list of quosures.\n\
    \n```\nrlang::quos(x, y, x+y)\n## [[1]]\n## \n##   expr: ^x\n##   env:  global\n\
    ##\n## [[2]]\n## \n##   expr: ^y\n##   env:  global\n##\n## [[3]]\n## \n##   expr:\
    \ ^x + y\n##   env:  global\n```\n\nThe primary use of `quos` is to translate\
    \ the three-dots argument into a list of quosures.\n\n```\nf \n##   expr: ^x\n\
    ##   env:  global\n##\n## [[2]]\n## \n##   expr: ^y\n##   env:  global\n##\n##\
    \ [[3]]\n## \n##   expr: ^z\n##   env:  global\n```\n\n## Quasi-quoting\n\nThe\
    \ final topic of this chapter involves quasi-quoting. This is a mechanism by which\
    \ we can work with quoted expressions but at the same time substitute some parts\
    \ of the expression by the value that subexpressions evaluate to. When we directly\
    \ call functions that do non-standard evaluation, we can usually provide expressions\
    \ exactly as we want them, but as soon as we start using such non-standard evaluation\
    \ functions in programs where we call them from other functions, we need some\
    \ flexibility in how we construct expressions. We can do this with meta-programming\
    \ where we modify `call` objects, but a better approach is implemented in the\
    \ `rlang` package, the so-called quasi-quoting.\n\nConsider this simple example.\
    \ We have a data frame, and we want to filter away rows where a given column has\
    \ missing data. We can do this using `dplyr`’s `filter` function like this:\n\n\
    ```\ndf % dplyr::filter(!is.na(x))\n## # A tibble: 5 x 2\n##       x     y\n##\
    \    \n## 1    1\\.    1.\n## 2    3\\.    3.\n## 3    4\\.   NA\n## 4    5\\\
    .    5.\n## 5    7\\.   NA\ndf %>% dplyr::filter(!is.na(y))\n## # A tibble: 5\
    \ x 2\n##       x     y\n##    \n## 1    1\\.    1.\n## 2   NA     2.\n## 3  \
    \  3\\.    3.\n## 4    5\\.    5.\n## 5   NA     6.\n```\n\nHere, we use the same\
    \ code for two different variables. It is straightforward code, so we would not\
    \ write a function to avoid the duplication, but for more complicated pipelines,\
    \ we would. Therefore, for the sake of argument, let’s imagine that we want to\
    \ replace the pipeline with a function. We could attempt to write it like this:\n\
    \n```\nfilter_on_na % dplyr::filter(!is.na(column))\n}\ndf %>% filter_on_na(x)\n\
    ## Warning in is.na(column): is.na() applied to non-\n## (list or vector) of type\
    \ 'symbol'\n## # A tibble: 7 x 2\n##       x     y\n##    \n## 1    1\\.    1.\n\
    ## 2   NA     2.\n## 3    3\\.    3.\n## 4    4\\.   NA\n## 5    5\\.    5.\n\
    ## 6   NA     6.\n## 7    7\\.   NA\n```\n\nWe use `substitute` to translate the\
    \ column name into a symbol and then apply the `filter` pipeline. It doesn’t work,\
    \ of course, and the reason is that `filter` does non-standard evaluation as well\
    \ and translates the predicate `!is.na(column)` into this exact expression. So,\
    \ it needs to know the variable `column`. Now, since `filter` evaluates its argument\
    \ as a quosure, it can find the variable `column`, but it finds that this is a\
    \ symbol—it is, in this case, the symbol `x`—but that is not what we want it to\
    \ see. We want `filter` to see the column `x`, but that is not how `filter` works.\n\
    \nWhat we want to do is to substitute the symbol held in the variable `column`\
    \ into the expression/quosure that `filter` sees. We can do this with the “bang-bang”\
    \ operator `!!`.\n\n```\nfilter_on_na % dplyr::filter(!is.na(!!column))\n}\ndf\
    \ %>% filter_on_na(x)\n## # A tibble: 5 x 2\n##       x     y\n##    \n## 1  \
    \  1\\.    1.\n## 2    3\\.    3.\n## 3    4\\.   NA\n## 4    5\\.    5.\n## 5\
    \    7\\.   NA\ndf %>% filter_on_na(y)\n## # A tibble: 5 x 2\n##       x     y\n\
    ##    \n## 1    1\\.    1.\n## 2   NA     2.\n## 3    3\\.    3.\n## 4    5\\\
    .    5.\n## 5   NA     6.\n```\n\nThis operator unquotes the following expression,\
    \ evaluates it, and puts the result into the quoted expression that `filter` sees.\
    \ So the value of `column`, rather than the symbol `column`, gets inserted into`!is.na(!!column)`.\n\
    \nYou will have noticed that I used a different function, `rlang::enexpr`, to\
    \ create the quoted column name. In the `rlang` package there are two functions\
    \ that behave like `quote` and `substitute` in that they create bare expressions,\
    \ but they allow quasi-quoting with the bang-bang operator, something `substitute`\
    \ and `quote` do not. Consider the functions `f` and `g` defined like this:\n\n\
    ```\nf <- function(x) substitute(x)\ng <- function(x) rlang::enexpr(x)\n```\n\n\
    When called directly, both will return the expression we give as the parameter\
    \ `x`, but consider the case where we call them from another function, `h`, where\
    \ we want to substitute its parameter for the parameter `x`."
