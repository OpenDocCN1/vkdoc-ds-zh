- fmt: '# Text, Tokens, Grammars, and Semantics


    First, we need to define some terminology. Since this book is not about language
    or parser theory, I will stick with a few informal working definitions for terms
    we will need later.


    When we consider a language, we can look at it at different levels of detail,
    from the most basic components to the meanings associated with expressions and
    statements. For a spoken language, the most basic elements are the phonemes —
    the distinct sounds used in the language. When strung together, phonemes become
    words, words combine to make sentences, and sentences have meanings. For a written
    language, the atomic elements are glyphs — the letters in languages that are written
    using alphabets, such as English. Sequences of letters can form words, but a written
    sentence contains more than just words—we have punctuation symbols as well. Together,
    we can call these tokens. A string of tokens forms a sentence, and again, we assign
    meanings to sentences.


    For computer languages, we have the same levels of abstractions on strings of
    symbols. The most primitive level is just a stream of input characters, but we
    will have rules for translating such character sequences into sequences of tokens.
    This process is called tokenization. The formal definition of a programming language
    will specify what the available tokens in the language are and how a string of
    characters should be translated into a string of tokens.


    Consider the following string of R code:


    ```

    foo(x, 2*x)

    ```


    This is obviously a function call, but seen by the tokenizer it is a string of
    characters that it needs to translate into a sequence of tokens. It will produce
    this:


    ```

    identifier["foo"] ''('' identifier["x"],

    number[2], ''*'', identifier["x"]

    '')''

    ```


    I am using a home-brewed notation for this, but the idea is that a tokenizer will
    recognize that there are some identifiers and numbers (and it will identify what
    those identifiers and numbers are) and then some verbatim tokens such as `''(''`,
    `''*''`, and `'')''`.


    The tokenizer, however, will be equally happy to process a string such as this:


    ```

    foo x ( 2 ) x *

    ```


    into the following sequence:


    ```

    identifier["foo"] identifier["x"] ''(''

    number[2] '')'' identifer["x"] ''*''

    ```


    This is obviously not a valid piece of R code, but the tokenizer does not worry
    about this. It merely translates the string into a sequence of tokens (with some
    associated data, such as the strings `"foo"` and `"x"` for the identifiers and
    the number `2` for the number). It does not worry about higher levels of the language.


    When it comes to tokenizing an embedded language, we are bound to what that language
    will consider as valid tokens. We cannot create arbitrary kinds of tokens since
    all languages we write as embedded DSLs must also be valid R. The tokens we can
    use are either already R tokens or variables and functions we define to have special
    meaning. Mostly, this means creating objects through function calls and defining
    functions for operator overloading.


    What a language considers a valid string of tokens is defined by its grammar.¹
    A parser is responsible for translating a sequence of tokens into an expression
    or a language statement. Usually, what a parser does is translate a string of
    tokens into an expression tree—often referred to as an abstract syntax tree (AST).²
    The tree structure associates more structure to a piece of code than the simple
    sequential structure of the raw input and the result of the tokenization. An example
    of how an abstract syntax tree for the function call we tokenized earlier could
    look like Figure 3-1. Here, the italic labels refer to a syntactic concept in
    the grammar, while the monospace font labels refer to verbatim input text. Tokens
    are shown in gray boxes. As we see, these can either be verbatim text or have
    some grammatical information associated with them, describing what type of token
    they are (in this example, this is either an identifier or a number). When there
    is information associated, I have chosen to show this as two nodes in the tree:
    one that describes the syntactical class the token is (identifier or number) and
    a child of that node that contains the actual information (`foo`, `x`, and `2`
    in this case).


    ![A465211_1_En_3_Fig1_HTML.png](A465211_1_En_3_Fig1_HTML.png)


    Figure 3-1 Example of an abstract syntax tree for a concrete function call


    Grammatical statements are those a parser will consider valid. Such sentences
    are, if we return to natural languages, those sentences that follow the grammatical
    rules. This set of grammatical sentences is distinct from the set of sentences
    that have some associated meaning. It is entirely possible to construct meaningless
    but grammatically correct sentences. The sentence “Colourless green ideas sleep
    furiously” is such a sentence, created by the linguist Noam Chomsky. It is entirely
    grammatical and also completely meaningless. Semantics is the term we use to link
    grammatical sentences to their meaning. You will know this distinction in programming
    languages when you run into runtime exceptions. If you get an exception when you
    run a program, you will have constructed a grammatical sentence—otherwise, the
    parser would have complained about syntactical errors—but the sentence is violating
    language rules in some other way. A grammatical sentence does not need to have
    a well-defined meaning. For example, an expression that adds two variables, `x
    + y`, is grammatical, but if the variables contain two incompatible types (`x`
    could be a string while `y` is a number), the sentence violates the language’s
    type rules. Semantics, when it comes to programming languages, define what actual
    computations a statement describes. A compiler or an interpreter—the latter for
    R programs—gives meaning to grammatical statements.³


    For embedded DSLs, the semantics of a program is what we do to evaluate an expression
    once we have parsed it. We are not going to formally specify semantics or implement
    interpreters, so for this book, the semantics part of a DSL is plain old R programs.
    More often than not, what we use embedded DSLs for is an interface to some library
    or framework. It is the functionality of this framework that provides the semantics
    of what we do with the DSL; the actual language is just an interface to the framework.'
