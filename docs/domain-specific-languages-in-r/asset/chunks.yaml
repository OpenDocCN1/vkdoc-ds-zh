    # 12. Dynamic Programming


    As yet another example, we will create a domain-specific language for specifying
    dynamic programming algorithms. Dynamic programming is a technique used for speeding
    up recursive computations. When we need to compute a quantity from a recursion
    that splits into other recursions and these recursions overlap—so the computation
    involves evaluating the same recursive calls multiple times—we can speed up the
    computation by memorizing the results of the recursions. If we a priori know the
    values we will need to compute, we can build up a table of these values from the
    basic cases up to the final value instead of from the top-level recursion and
    down where we need more bookkeeping to memorize results.


    Take a classical example such as Fibonacci numbers . The Fibonacci number F(n)
    = 1 if n is 1 or 2; otherwise, F(n) = F(n – 1) + F(n – 2) . To compute F(n), we
    need to recursively compute F(n – 1) and F(n – 2). To compute F(n – 1), we need
    to compute F(n – 2) and F(n – 3), which obviously overlap the recursions needed
    to compute F(n – 2), which is computed from F(n – 3) and F(n – 4).


    We could compute the n’th Fibonacci number recursively, but we would have to compute
    an exponential number of recursions. Instead, we could memorize the results of
    F(m) for each m we use in the recursions to avoid recomputing values. A much more
    straightforward approach is to compute F(m) for m = 1,…,n in that order and store
    the results in a table.


    ```

    n <- 10

    F <- vector("numeric", length = n)

    F[1] <- F[2] <- 1

    for (m in 3:n) {

    F[m] <- F[m-1] + F[m-2]

    }

    F[n]

    ## [1] 55

    ```


    Another, equally classical, example is computing the edit distance between two
    strings, x and y, of length n and m, respectively. This is the minimum number
    of transformations—character substitutions, deletions, or insertions—needed to
    translate x into y and can be defined recursively for ![$$ i=1,\dots, n+1 $$](A465211_1_En_12_Chapter_IEq1.gif)
    and ![$$ j=1,\dots, m+1 $$](A465211_1_En_12_Chapter_IEq2.gif) as follows:


    ![$$ E\left[i,j\right]=\kern0.5em \Big\{\kern12.625em {\displaystyle \begin{array}{l}\begin{array}{c}\
    i-1\kern15.125em j=1\\ {}j-1\kern15.25em i=1\end{array}\\ {}\min \kern0.5em \Big\{\kern4.5em
    \begin{array}{l}E\left[i-1,j\right]+1,\kern6.625em \left(\mathrm{Insertion}\right)\\
    {}\kern4.5em E\left[i,j-1\right]+1,\kern6.875em \left(\mathrm{Deletion}\right)\\
    {}E\left[i-1,j-1\right]+{1}_{x\left[i-1\right]\ne y\left[j-1\right]}\kern5.625em
    \left(\mathrm{Substitution}\right)\end{array}\end{array}} $$](A465211_1_En_12_Chapter_Equa.gif)


    There are two base cases, capturing the edit distance of a prefix of x against
    an empty string or an empty string against a prefix of y, and then there are three
    cases for the recursion: one for insertion, where we move from ![$$ x=\left[1,\dots,
    i-2\right] $$](A465211_1_En_12_Chapter_IEq3.gif) to ![$$ x\left[1,\dots, i-1\right]
    $$](A465211_1_En_12_Chapter_IEq4.gif) against ![$$ y\left[1,\dots, j-1\right]
    $$](A465211_1_En_12_Chapter_IEq5.gif); one for deletion, where we move from ![$$
    y\left[1,\dots, j-2\right] $$](A465211_1_En_12_Chapter_IEq6.gif) to ![$$ y\left[1,\dots,
    j-1\right] $$](A465211_1_En_12_Chapter_IEq7.gif) against ![$$ x\left[1,\dots,
    i-1\right] $$](A465211_1_En_12_Chapter_IEq8.gif); and finally substitution, where
    we move from ![$$ x=\left[1,\dots, i-2\right] $$](A465211_1_En_12_Chapter_IEq9.gif)
    against ![$$ y\left[1,\dots, j-2\right] $$](A465211_1_En_12_Chapter_IEq10.gif)
    to ![$$ x=\left[1,\dots, i-2\right] $$](A465211_1_En_12_Chapter_IEq11.gif) against
    ![$$ y\left[1,\dots, j-2\right] $$](A465211_1_En_12_Chapter_IEq12.gif). The cost
    of this is 0 if ![$$ x\left[i-1\right]=y\left[j-1\right] $$](A465211_1_En_12_Chapter_IEq13.gif)
    and 1 if ![$$ x\left[i-1\right]\ne y\left[j-1\right] $$](A465211_1_En_12_Chapter_IEq14.gif),
    which is captured by the indicator variable ![$$ {1}_{x\left[i-1\right]\ne y\left[j-1\right]}
    $$](A465211_1_En_12_Chapter_IEq15.gif).'
