    # 搜索树


    作为另一个例子，我们可以实现搜索树。这些树包含有序的值，并满足递归性质：搜索树的**左**子树中的所有元素的值都小于存储在树根处的值，而搜索树的**右**子树中的所有元素的值都大于树根中的值。


    为了定义搜索树，我们采用了一种与之前二叉树不同的方法。我们定义了一个空树 `E`，以及一个具有两个子树 `left` 和 `right` 以及一个 `value`
    的树。


    ```

    search_tree :=

    E | T(left : search_tree, value, right : search_tree)

    ```


    对于这个例子，我们将只实现两个函数：插入和成员测试。关于搜索树的更多函数，请参阅 Mailund (2017a, 第 6 章)。


    这两个函数都在树中递归搜索，直到它们分别找到要插入的值，或者找到要检查其成员资格的值在树中。对于插入操作，基本情况是当到达叶子节点时，在该处插入元素。它将创建一个树，包含两个空子树，并存储该值。递归函数通过在递归调用中使用
    `T` 构造函数创建新树来构建树。因此，在叶子节点处创建的树将被放入 `insert` 函数创建的更新后的树中。对于 `member` 函数，我们不需要更新树。如果到达叶子节点，我们就知道该元素不在树中，可以直接返回
    `FALSE`。在这两个函数中，搜索都会检查在递归情况下看到的树的节点值。如果该值大于 `x`，则 `x` 可能存在的唯一位置是左子树，因此我们继续在那里搜索。另一方面，如果
    `x` 大于该值，则我们必须搜索右子树。如果它既不小于也不大于该值，则它必定等于该值。对于插入操作，这意味着我们无需执行任何操作，可以直接返回已经包含 `x`
    的树。对于成员测试，我们可以返回 `TRUE`。


    ```

    insert  T(E, x, E),

    T(left, val, right) -> {

    if (x  val)

    T(left, val, insert(right, x))

    else

    T(left, x, right)

    })

    }

    member  FALSE,

    T(left, val, right) -> {

    if (x  val) member(right, x)

    else TRUE

    })

    }

    ```


    我们可以像这样构建一棵树：


    ```

    tree <- E

    for (i in sample(2:4))

    tree <- insert(tree, i)

    ```


    树构建完成后，我们可以像这样测试成员资格：


    ```

    for (i in 1:6) {

    cat(i, “ : “, member(tree, i), “\n”)

    }

    ## 1  :  FALSE

    ## 2  :  TRUE

    ## 3  :  TRUE

    ## 4  :  TRUE

    ## 5  :  FALSE

    ## 6  :  FALSE

    ```


    这两个函数的最坏情况时间开销与树的深度成正比，而树的深度可能随树中存储的元素数量线性增长。但是，如果我们保持树的平衡，则时间开销会减少到树大小的对数级别。一种用于保持搜索树平衡的经典数据结构是所谓的红黑搜索树。在
    C/C++ 或 Java 等语言中使用指针或引用操作来实现这些树可能相当具有挑战性，但在函数式语言中，平衡此类树只是基于局部结构进行树变换的简单问题。例如，请参阅
    Okasaki (1999)、Germane 和 Might (2014) 或 Mailund (2017a)。


    红黑搜索树是二叉搜索树，其中每个树都有一个关联的颜色，红色或黑色。我们可以像这样使用构造器来定义颜色：


    ```

    colour :=

    R | B

    ```


    我们可以像这样为所有非空树添加颜色：


    ```

    rb_tree :=

    E | T(col : colour, left : rb_tree, value, right : rb_tree)

    ```


    除了在模式匹配中包含颜色之外，此数据结构的 `member` 函数与普通搜索树的完全相同。

