    ```

    parse_matrix_expr(A * B)

    ## m(A) * m(B)

    ```


    这并非一个完美的解决方案，并且存在一些陷阱，其中之一是你无法直接从其他函数中使用这个函数。`substitute`函数可能难以使用。更进一步的问题是，我们正在创建一个新的表达式，但它是
    R 表达式，而不是我们希望在矩阵表达式语言中得到的数据结构。你可以将 R 表达式视为一段文字形式的代码；它尚未被求值以成为我们想要的结果。为此，我们需要`eval`函数，并且我们需要在正确的上下文中对表达式求值。处理表达式，尤其是在不同环境中对表达式求值，是
