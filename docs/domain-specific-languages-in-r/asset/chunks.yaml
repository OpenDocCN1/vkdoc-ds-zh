    if (is.call(expr)) {

    if (expr[[1]] == as.name("("))

    return(build_matrix_expr(expr[[2]], env))

    if (expr[[1]] == as.name("*") || expr[[1]] == as.name("%*%"))

    return(matrix_mult(build_matrix_expr(expr[[2]], env),

    build_matrix_expr(expr[[3]], env)))

    if (expr[[1]] == as.name("+"))

    return(matrix_sum(build_matrix_expr(expr[[2]], env),

    build_matrix_expr(expr[[3]], env)))

    }

