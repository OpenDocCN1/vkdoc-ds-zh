- fmt: 'The only remaining function to write for the constructors is the function
    for printing them. Here, we write a function that translates a constructed object
    into a string; this function we can then use recursively to translate any constructed
    element into a string. We then just call this function in `construction_printer`,
    which is the function that is assigned to the specialized `print` function for
    any type we define.


    There is nothing complicated in the function. We first check whether the object
    has an attribute `constructor`. Strictly speaking, only the function constructors
    have this—the constant constructors have the attribute `constructor_constant`,
    but the `attire` function will pick an attribute if it gets a unique prefix, so
    we also get that. If we do not have a `constructor` attribute, then it isn’t an
    element constructed from something we have defined from our language, so it must
    be a value of some other type—we just convert it into a string and return this.
    We use the generic `toString` function for this. This function converts any object
    into a string. It’s not necessarily a beautiful representation of the object,
    but you can specialize it if you need to do so.


    If the object we have is a constructor, it is either a constant or the result
    of a constructor function call. If the latter, it will be a list. If it is a list,
    then we must convert all the elements in the list into strings and paste them
    together. Otherwise, the name of the constructor is the string representation
    of the object.


    ```

    deparse_construction % purrr::map(deparse_construction)

    print_args <- vector("character", length = length(components))

    for (i in seq_along(components)) {

    print_args[i] <- paste0(components[i], "=", values[i])

    }

    print_args <- paste0(print_args, collapse = ", ")

    paste0(constructor_name, "(", print_args, ")")

    } else {

    constructor_name

    }

    }

    construction_printer <- function(x, ...) {

    cat(deparse_construction(x), "\n")

    }

    ```


    As an example of using the construction language, we can define a binary tree
    as either a tree with a left and right subtree or a leaf.


    ```

    tree := T(left : tree, right : tree) | L(value : numeric)

    We can use the constructors to create a tree:

    x <- T(T(L(1),L(2)),L(3))

    x

    ## T(left=T(left=L(value=1), right=L(value=2)), right=L(value=3))

    ```


    Values we create using these constructors can be accessed just as lists—which,
    in fact, they are—using the variable names we used in the type specification.


    ```

    x$left$left$value

    ## [1] 1

    x$left$right$value

    ## [1] 2

    x$right$value

    ## [1] 3

    ```


    The type checking is rather strict, however. We demand that the values we pass
    to the constructor functions are of the types we give in the specification—in
    the sense that they must inherit the class from the specification—and this can
    be a problem in some cases where R would otherwise ordinarily just convert values.
    In the specification for the `L` constructor, for example, we require that the
    argument is `numeric`. We will get an error if we give it an `integer`.


    ```

    L(1L)

    ## Error: is_na(type) || inherits(arg, type) is not TRUE

    ```


    This situation is where we can use the variant of parameters without a type:


    ```

    tree := T(left : tree, right : tree) | L(value)

    L(1L)

    ## L(value=1)

    ```


    An alternative solution could be to specify more than one type in the specification.
    If you are interested, you can play with that. I will just leave it here and move
    on to pattern matching.


    ## Pattern Matching


    We want to implement pattern matching such that an expression like this:


    ```

    cases(L(1),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 1

    ```


    should return 1, since the pattern `L(v)` matches the value `L(1)` and we return
    `v`, which we expect to be bound to 1. Likewise, we want this expression to return
    9 since `v` should be bound to 4 and `w` to 5 and we return the result of evaluating
    `v + w`.


    ```

    cases(T(L(4), L(5)),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 9

    ```


    We want the `otherwise` keyword to mean anything at all and use it as a default
    pattern, so in this expression, we want to return 5.


    ```

    cases(T(L(1), T(L(4), L(5))),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 5

    ```


    The syntax for pattern matching uses the right-arrow operator. This operator is
    usually an assignment. We cannot specialize arrow assignments, but we can still
    use them in a meta-programming function. We use an assignment operator for the
    same reasons as we had for using the `:=` operator for defining types. Since assignment
    operators have the lowest precedence, we don’t have to worry about how tight the
    operators to the left and right of the operator binds. We could also have used
    that operator here, but I like the arrow more for this function. It shows us what
    different patterns map to. You need to be careful with the `->` operator, though,
    since it is syntactic sugar for `<-`. This means that once we have an expression
    that uses `->`, we will actually see a call to `<-`, and the left- and right-hand
    sides will be switched.


    The `cases` function will take a variable number of arguments. The first is the
    expression we match against, and the rest are captured by the three-dots operator.
    The expressions there should not be evaluated directly, so we capture them as
    quosures. We then iterate through them, split them into left-hand and right-hand
    sides, and test the left-hand side against the expression. The function we use
    for testing the pattern will return an environment that contains bound variables
    if it matches, and `NULL` otherwise. If we have a match, we evaluate the right-hand
    side in the quosure environment over-scoped by the environment we get from matching
    the pattern.


    ```

    cases <- function(expr, ...) {

    matchings <- quos(...)

    for (i in seq_along(matchings)) {

    eval_env <- get_env(matchings[[i]])

    match_expr <- quo_expr(matchings[[i]])

    stopifnot(match_expr[[1]] == "<-")

    test_expr <- match_expr[[3]]

    result_expr <- match_expr[[2]]

    match <- test_pattern(expr, test_expr, eval_env)

    if (!is_null(match))

    return(eval_tidy(result_expr, data = match, env = eval_env))

    }

    stop("No matching pattern!")

    }

    ```


    In the `test_pattern` function we create the environment where we will bind matched
    variables. If the pattern is `otherwise`, we return the empty environment—no variables
    are bound there. Otherwise, we need to explore both pattern and expression recursively.


    We use the function `test_pattern_rec` to do this, but we do not call it directly.
    Instead, we use a function called `callCC`. The name stands for call with current
    continuation, and it is a function that sometimes causes some confusion for people
    not intimately familiar with functional programming. There is no need for this
    confusion, however, because all the function does is provide us with a way to
    return to the point where we called `callCC`.'
  raw: 'The only remaining function to write for the constructors is the function
    for printing them. Here, we write a function that translates a constructed object
    into a string; this function we can then use recursively to translate any constructed
    element into a string. We then just call this function in `construction_` `printer`
    , which is the function that is assigned to the specialized `print` function for
    any type we define.


    There is nothing complicated in the function. We first check whether the object
    has an attribute `constructor`. Strictly speaking, only the function constructors
    have this—the constant constructors have the attribute `constructor_constant`,
    but the `attire` function will pick an attribute if it gets a unique prefix, so
    we also get that. If we do not have a `constructor` attribute, then it isn’t an
    element constructed from something we have defined from our language, so it must
    be a value of some other type—we just convert it into a string and return this.
    We use the generic `toString` function for this. This function converts any object
    into a string. It’s not necessarily a beautiful representation of the object,
    but you can specialize it if you need to do so.


    If the object we have is a constructor, it is either a constant or the result
    of a constructor function call. If the latter, it will be a list. If it is a list,
    then we must convert all the elements in the list into strings and paste them
    together. Otherwise, the name of the constructor is the string representation
    of the object.


    ```

    deparse_construction % purrr::map(deparse_construction)

    print_args <- vector("character", length = length(components))

    for (i in seq_along(components)) {

    print_args[i] <- paste0(components[i], "=", values[i])

    }

    print_args <- paste0(print_args, collapse = ", ")

    paste0(constructor_name, "(", print_args, ")")

    } else {

    constructor_name

    }

    }

    construction_printer <- function(x, ...) {

    cat(deparse_construction(x), "\n")

    }

    ```


    As an example of using the construction language, we can define a binary tree
    as either a tree with a left and right subtree or a leaf.


    ```

    tree := T(left : tree, right : tree) | L(value : numeric)

    We can use the constructors to create a tree:

    x <- T(T(L(1),L(2)),L(3))

    x

    ## T(left=T(left=L(value=1), right=L(value=2)), right=L(value=3))

    ```


    Values we create using these constructors can be accessed just as lists—which,
    in fact, they are—using the variable names we used in the type specification.


    ```

    x$left$left$value

    ## [1] 1

    x$left$right$value

    ## [1] 2

    x$right$value

    ## [1] 3

    ```


    The type checking is rather strict, however. We demand that the values we pass
    to the constructor functions are of the types we give in the specification—in
    the sense that they must inherit the class from the specification—and this can
    be a problem in some cases where R would otherwise ordinarily just convert values.
    In the specification for the `L` constructor, for example, we require that the
    argument is `numeric`. We will get an error if we give it an `integer`.


    ```

    L(1L)

    ## Error: is_na(type) || inherits(arg, type) is not TRUE

    ```


    This situation is where we can use the variant of parameters without a type:


    ```

    tree := T(left : tree, right : tree) | L(value)

    L(1L)

    ## L(value=1)

    ```


    An alternative solution could be to specify more than one type in the specification.
    If you are interested, you can play with that. I will just leave it here and move
    on to pattern matching.


    ## Pattern Matching


    We want to implement pattern matching such that an expression like this:


    ```

    cases(L(1),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 1

    ```


    should return 1, since the pattern `L(v)` matches the value `L(1)` and we return
    `v`, which we expect to be bound to 1\. Likewise, we want this expression to return
    9 since `v` should be bound to 4 and `w` to 5 and we return the result of evaluating
    `v + w`.


    ```

    cases(T(L(4), L(5)),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 9

    ```


    We want the `otherwise` keyword to mean anything at all and use it as a default
    pattern, so in this expression, we want to return 5.


    ```

    cases(T(L(1), T(L(4), L(5))),

    L(v) -> v,

    T(L(v), L(w)) -> v + w,

    otherwise -> 5)

    ## [1] 5

    ```


    The syntax for pattern matching uses the right-arrow operator. This operator is
    usually an assignment. We cannot specialize arrow assignments, but we can still
    use them in a meta-programming function. We use an assignment operator for the
    same reasons as we had for using the `:=` operator for defining types. Since assignment
    operators have the lowest precedence, we don’t have to worry about how tight the
    operators to the left and right of the operator binds. We could also have used
    that operator here, but I like the arrow more for this function. It shows us what
    different patterns map to. You need to be careful with the `->` operator, though,
    since it is syntactic sugar for `<-`. This means that once we have an expression
    that uses `->`, we will actually see a call to `<-`, and the left- and right-hand
    sides will be switched.


    The `cases` function will take a variable number of arguments. The first is the
    expression we match against, and the rest are captured by the three-dots operator.
    The expressions there should not be evaluated directly, so we capture them as
    quosures. We then iterate through them, split them into left-hand and right-hand
    sides, and test the left-hand side against the expression. The function we use
    for testing the pattern will return an environment that contains bound variables
    if it matches, and `NULL` otherwise. If we have a match, we evaluate the right-hand
    side in the quosure environment over-scoped by the environment we get from matching
    the pattern.


    ```

    cases <- function(expr, ...) {

    matchings <- quos(...)

    for (i in seq_along(matchings)) {

    eval_env <- get_env(matchings[[i]])

    match_expr <- quo_expr(matchings[[i]])

    stopifnot(match_expr[[1]] == "<-")

    test_expr <- match_expr[[3]]

    result_expr <- match_expr[[2]]

    match <- test_pattern(expr, test_expr, eval_env)

    if (!is_null(match))

    return(eval_tidy(result_expr, data = match, env = eval_env))

    }

    stop("No matching pattern!")

    }

    ```


    In the `test_pattern` function we create the environment where we will bind matched
    variables. If the pattern is `otherwise`, we return the empty environment—no variables
    are bound there. Otherwise, we need to explore both pattern and expression recursively.


    We use the function `test_pattern_rec` to do this, but we do not call it directly.
    Instead, we use a function called `callCC` . The name stands for call with current
    continuation, and it is a function that sometimes causes some confusion for people
    not intimately familiar with functional programming. There is no need for this
    confusion, however, because all the function does is provide us with a way to
    return to the point where we called `callCC`.'
