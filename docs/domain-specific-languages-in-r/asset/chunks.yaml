  trans: "\n### 轨迹\n\n连续时间马尔可夫链的观测结果称为轨迹——即一系列状态以及观测到这些状态的时间点。在实际数据分析中，我们通常会编写从文件获取数据的函数，但既然我们在探索领域特定语言，那就先编写一个用于定义轨迹的函数。我们将让轨迹依赖于我们想使用的\
    \ CTMC，这样就能检验轨迹中的状态是否也是 CTMC 中的状态。如果你想用多个 CTMC 分析同一条轨迹，可以移除这些检验，或者让轨迹对象依赖于一个合法状态列表，而非`ctmc`对象。\n\
    \n我们采用与`ctmc`类相同的做法：编写一个创建轨迹对象的函数，再编写用于向轨迹添加信息的函数。我们要在轨迹中存储的信息包括状态列表以及观测到这些状态的时间点列表。为了进行\
    \ CTMC 与轨迹之间的一致性检验，我们还会存储 CTMC 中的节点。轨迹类的构造函数如下所示：\n\n```\nctmc_trace <- function(ctmc)\
    \ {\n    nodes <- ctmc[[\"nodes\"]] %>% unique %>% unlist\n    structure(list(nodes\
    \ = nodes, states = NULL, at = NULL),\n              class = \"ctmc_trace\")\n\
    }\n```\n\n我们向该语言添加一个动词，即一个用于添加特定时间点状态观测值的函数。该函数主要检验状态与`ctmc`对象的一致性，然后将状态和时间点添加到`ctmc_trace`对象的列表中。\n\
    \n```\nadd_observation <- function(trace, state, at) {\n    stopifnot(state %in%\
    \ trace$nodes)\n    stopifnot(at > trace$at$car)\n    trace$states <- cons(state,\
    \ trace$states)\n    trace$at <- cons(at, trace$at)\n    trace\n}\n```\n\n与 CTMC\
    \ 对象类似，我们也需要为轨迹编写打印函数。这里我将采用与`ctmc`打印函数不同的方法。我会将轨迹转换为数据框——准确来说是`tibble`对象——然后打印结果。如果我要编写一个\
    \ CTMC 包，可能会采用不同方法，但我稍后会利用这种数据框转换来计算似然值，因此我也在打印函数中利用这一转换。要将`ctmc_trace`对象转换为`tibble`对象，我们需要专门化`as_tibble`函数。之后，再专门化`print`函数。\n\
    \n```\nas_tibble.ctmc_trace <- function(x, ...) {\n    states <- x[[\"states\"\
    ]] %>% lst_to_list() %>% unlist() %>% rev()\n    at     <- x[[\"at\"]]     %>%\
    \ lst_to_list() %>% unlist() %>% rev()\n    tibble(state = states, at = at)\n\
    }\nprint.ctmc_trace <- function(x, ...) {\n    df <- as_tibble(x)\n    cat(\"\
    CTMC trace:\\n\")\n    print(df)\n}\n```\n\n现在我们已经具备了创建和打印轨迹的功能。\n\n```\ntr <-\
    \ ctmc_trace(ctmc) %>%\n    add_observation(foo, at = 0.0) %>%\n    add_observation(bar,\
    \ at = 0.1) %>%\n    add_observation(baz, at = 0.3) %>%\n    add_observation(qux,\
    \ at = 0.5) %>%\n    add_observation(foo, at = 0.7) %>%\n    add_observation(baz,\
    \ at = 1.1)\ntr\n## CTMC trace:\n## # A tibble: 6 x 2\n##   state    at\n##  \
    \ <chr> <dbl>\n## 1 foo   0.\n## 2 bar   0.100\n## 3 baz   0.300\n## 4 qux   0.500\n\
    ## 5 foo   0.700\n## 6 baz   1.10\n```\n\n### 计算似然值\n\n我们将为本示例实现的最后一个功能是：给定 CTMC\
    \ 和轨迹，计算参数的似然值。在第 3 章中，我们看到了如何将速率矩阵转换为转移概率矩阵——首先将速率矩阵乘以一个标量（即两次观测之间经过的时间段），然后对结果进行（矩阵）指数运算。我们将重用在那里实现的函数。\n\
    \n```\ntransition_probabilities <- function(Q, t) expm(Q * t)\n```\n\n为了计算似然值，我们将在领域特定语言中创建一个动词，用于将\
    \ CTMC 和轨迹转换为一个函数。该函数将 CTMC 的参数作为参数（与之前编写的速率矩阵创建函数类似），然后返回这些参数的似然值。我们可以将这个函数与优化算法结合使用进行最大似然估计——R\
    \ 的各种包中提供了多种优化算法。\n\n实现方法很直接。我们从`ctmc`对象中获取速率矩阵函数，将轨迹转换为数据框，并将结果存储在函数的闭包中。然后使用与之前相同的技巧获取闭包内的参数，评估速率矩阵函数以获得速率矩阵，并将数据框中的数据转换为计算所需的格式。计算过程就是遍历轨迹，计算连续两次观测之间的转移概率。由于这是一个马尔可夫模型，联合概率就是这些概率的乘积。创建闭包后，我们设置其形式参数，就像我们对速率矩阵函数所做的那样。\n\
    \n```\nget_likelihood_function <- function(ctmc, trace) {\n    rate_func <- ctmc\
    \ %>% get_rate_matrix_function()\n    trace_df  <- as_tibble(trace)\n    lhd_function\
    \ <- function() {\n        args <- as_list(environment())\n        Q <- do.call(rate_func,\
    \ args)\n        n <- length(trace_df$state)\n        from <- trace_df$state[-n]\n\
    \        to <- trace_df$state[-1]\n        delta_t <- trace_df$at[-1] - trace_df$at[-n]\n\
    \        lhd <- 1\n        for (i in seq_along(from)) {\n            P <- transition_probabilities(Q,\
    \ delta_t[i])\n            lhd <- lhd * P[from[i], to[i]]\n        }\n       \
    \ lhd\n    }\n    formals(lhd_function) <- formals(rate_func)\n    lhd_function\n\
    }\n```\n\n这就完成了；我们现在可以计算 CTMC 的似然值了。\n\n```\nlhd <- get_likelihood_function(ctmc,\
    \ tr)\nlhd(a = 2, b = 4)\n## [1] 0.00120108\n```\n\n在实际数据分析场景中，我们可能更想计算对数似然值。对于任何有意义的轨迹长度，实际的似然值都会导致下溢，因为我们处理的是有限位数的浮点数。将似然函数修改为对数似然函数很简单，只需将乘积改为求和，并对`P[from[i],\
    \ to[i]]`取对数即可。\n\n你可能还想为这样的语言添加更多功能，但即使只实现到目前为止的几个函数，我们也拥有了一个有用的领域特定语言。我们没有使用任何运算符重载来实现它；我们没有必要这样做。不过，我们广泛使用了整洁评估（tidy\
    \ evaluation）来实现速率表达式中的非标准评估。\n"
- fmt: "# 11. Pattern Matching\n\nIn languages such as ML or Haskell, you can define\
    \ data types by specifying functions you will use to construct values of any given\
    \ type. In itself, that is not that interesting, but combined with a pattern matching\
    \ feature of these languages, you can write very succinct functions for transforming\
    \ data structures.\n\nIn my book *Functional Data Structures in R* (Mailund, 2017a),\
    \ I describe several algorithms that depend on the transformation of various trees\
    \ based on their structure. Such transformations involve figuring out the current\
    \ structure of a tree—does it have a left subtree? Is that tree a leaf? If it\
    \ is a red-black search tree, what is the color of the tree? And the color of\
    \ its right subtree? In the algorithms I presented in that book, most of the functions\
    \ contained tens of lines of code just for matching such a tree structure.\n\n\
    With the language we implement in this chapter, we will make writing such transformation\
    \ functions vastly more efficient. We will write two main constructions. The first\
    \ is for defining a data structure, which we can use to define red-black search\
    \ trees like this:\n\n```\ncolour := R | B\nrb_tree := E | T(col : colour, left\
    \ : rb_tree, value, right : rb_tree)\n```\n\nThe second construction is used to\
    \ match values of such types and then perform actions accordingly. A balancing\
    \ function for red-black search trees can be implemented succinctly like this:\n\
    \n```\nbalance(\n  T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  T(B, T(R, T(R, a,\
    \ x, b), y, c), z, d) -> T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  T(B, a, x,\
    \ T(R, b, y, T(R, c, z, d))) -> T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  T(B,\
    \ a, x, T(R, T(R, b, y, c), z, d)) -> T(R, T(B, a, x, b), y, T(B, c, z, d)),\n\
    \  otherwise -> tree\n)\n```\n\nThis function is a mere eight lines, compared\
    \ to the 42 lines of code used in *Functional Data Structures in R*, where I also\
    \ use some pattern matching tricks but not a domain-specific language uniquely\
    \ designed for it. Such a language is what we will implement in this chapter.\n\
    \nFor the chapter, we will need to use the following packages:\n\n```r\nlibrary(rlang)\n\
    library(magrittr)\nlibrary(dplyr)\n```\n\nWe will also need the `make_args_list`\
    \ function we defined in Chapter [6](#A465211_1_En_6_Chapter.html).\n\n```r\n\
    make_args_list <- function(args) {\n  res <- replicate(length(args), substitute())\n\
    \  names(res) <- args\n  as.pairlist(res)\n}\n```\n\nFor a package that implements\
    \ the functionality described in this chapter, and more, see [`https://mailund.github.io/pmatch/`](https://mailund.github.io/pmatch/).\n\
    \n## Constructors\n\nThe key feature of this domain-specific language is the type\
    \ constructors—how we define values of a given type. The pattern matching aspect\
    \ of the DSL will consist of nested constructor calls, so it is how we define\
    \ the constructors that is the essential aspect of the language.\n\nHere, we are\
    \ inspired by function calls. We will use a syntax for constructors that matches\
    \ variables and function calls.\n\n```\nTYPEDEF ::= TYPENAME ':=' CONSTRUCTORS\n\
    CONSTRUCTORS ::= CONSTRUCTOR | CONSTRUCTOR '|' CONSTRUCTORS\nCONSTRUCTOR ::= NAME\
    \ | NAME '(' ARGS ')'\nARGS ::= ARG | ARG ',' ARGS\nARG ::= NAME | NAME ':' TYPE\n\
    TYPE ::= NAME\n```\n\nWe define a new type by giving it a name, to the left of\
    \ a `:=` operator, and by putting a sequence of constructors on the right of the\
    \ `:=` operator. Constructors, then, are separated by `|` and are either single\
    \ names or a name followed by arguments in parentheses, where an argument is either\
    \ a single name or a name followed by `:` and then a type, where we require that\
    \ a type is a name.\n\nWe implement this grammar by implementing the `:=` operator.\
    \ An assignment has the lowest precedence, which means that whatever we write\
    \ to the left or right of this operator will be arguments to the function. We\
    \ do not have to worry about an expression in our language being translated into\
    \ some `call` object of a different type. We cannot override the other assignment\
    \ operators, `<-`, `->`, and `=`, so we have to use `:=`. Since this is also traditionally\
    \ used to mean \"defined to be equal to,\" it works quite well.\n\nThe approach\
    \ we take in implementing this part of the pattern matching DSL is different from\
    \ the examples we have seen earlier. We do not create a data structure that we\
    \ can analyze nor do we evaluate expressions directly from expressions in our\
    \ new language. Instead, we combine parsing expressions with code generation—we\
    \ generate new functions and objects while we parse the specification. We add\
    \ these functions, and other objects for constants, to the environment in which\
    \ we call `:=`. Adding these objects to this environment allows us to use the\
    \ constructors after we have defined them with no further coding, but it does\
    \ mean that calling `:=` will have side effects.\n\nThe construction function\
    \ will expect a type name as its left-hand parameter and an expression describing\
    \ the different ways of constructing elements of the type on its right-hand side.\
    \ We will translate the left-hand side into a quosure because we want to get its\
    \ associated environment. The right-hand side we will turn into an expression.\
    \ For the construction specification, we do not want to evaluate any of the elements\
    \ (unless the user invokes quasi-quotations). The left-hand side—the type we are\
    \ defining—is just treated as a string since that is how the S3 system deals with\
    \ types, so we will make sure it is a single symbol and then get the string representation\
    \ of it. For this, we can use the `quo_name` function from `rlang`. The right-hand\
    \ side we have to parse, but we delegate this to a separate function that we define\
    \ next. Finally, we specify a function for pretty-printing elements of the new\
    \ type we define.\n\n```r\n`:=` <- function(data_type, constructors) {\n  data_type\
    \ <- enquo(data_type)\n  constructors <- enexpr(constructors)\n  stopifnot(quo_is_symbol(data_type))\n\
    \  data_type_name <- quo_name(data_type)\n  process_alternatives(\n    constructors,\n\
    \    data_type_name,\n    get_env(data_type)\n  )\n  assign(paste0(\"toString.\"\
    , data_type_name),\n         deparse_construction, envir = get_env(data_type))\n\
    \  assign(paste0(\"print.\", data_type_name),\n         construction_printer,\
    \ envir = get_env(data_type))\n}\n```"
  raw: '# 11. Pattern Matching


    In languages such as ML or Haskell, you can define data types by specifying functions
    you will use to construct values of any given type. In itself, that is not that
    interesting, but combined with a pattern matching feature of these languages,
    you can write very succinct functions for transforming data structures.


    In my book Functional Data Structures in R (Mailund, 2017a), I describe several
    algorithms that depend on the transformation of various trees based on their structure.
    Such transformations involve figuring out the current structure of a tree—does
    it have a left subtree? Is that tree a leaf? If it is a red-black search tree,
    what is the color of the tree? And the color of its right subtree? In the algorithms
    I presented in that book, most of the functions contained tens of lines of code
    just for matching such a tree structure.


    With the language we implement in this chapter, we will make writing such transformation
    functions vastly more efficient. We will write two main constructions. The first
    is for defining a data structure, which we can use to define red-black search
    trees like this:


    ```

    colour := R | B

    rb_tree := E | T(col : colour, left : rb_tree, value, right : rb_tree)

    ```


    The second construction is used to match values of such types and then perform
    actions accordingly. A balancing function for red-black search trees can be implemented
    succinctly like this:


    ```

    balance  T(R,T(B,a,x,b),y,T(B,c,z,d)),

    T(B,T(R,T(R,a,x,b),y,c),z,d) -> T(R,T(B,a,x,b),y,T(B,c,z,d)),

    T(B,a,x,T(R,b,y,T(R,c,z,d))) -> T(R,T(B,a,x,b),y,T(B,c,z,d)),

    T(B,a,x,T(R,T(R,b,y,c),z,d)) -> T(R,T(B,a,x,b),y,T(B,c,z,d)),

    otherwise -> tree)

    }

    ```


    This function is a mere eight lines, compared to the 42 lines of code used in
    Functional Data Structures in R, where I also use some pattern matching tricks
    but not a domain-specific language uniquely designed for it. Such a language is
    what we will implement in this chapter.


    For the chapter, we will need to use the following packages:


    ```

    library(rlang)

    library(magrittr)

    library(dplyr)

    ```


    We will also need the `make_args_list` function we defined in Chapter [6](#A465211_1_En_6_Chapter.html).


    ```

    make_args_list <- function(args) {

    res <- replicate(length(args), substitute())

    names(res) <- args

    as.pairlist(res)

    }

    ```


    For a package that implements the functionality described in this chapter, and
    more, see [`https://mailund.github.io/pmatch/`](https://mailund.github.io/pmatch/)
    .


    ## Constructors


    The key feature of this domain-specific language is the type constructors—how
    we define values of a given type. The pattern matching aspect of the DSL will
    consist of nested constructor calls, so it is how we define the constructors that
    is the essential aspect of the language.


    Here, we are inspired by function calls. We will use a syntax for constructors
    that matches variables and function calls.


    ```

    TYPEDEF ::= TYPENAME '':='' CONSTUCTORS

    CONSTUCTORS ::= CONSTUCTOR | CONSTUCTOR ''|'' CONSTRUCTORS

    CONSTRUCTOR ::= NAME | NAME ''('' ARGS '')''

    ARGS ::= ARG | ARG '','' ARGS

    ARG ::= NAME | NAME : TYPE

    TYPE ::= NAME

    ```


    We define a new type by giving it a name, to the left of a `:=` operator, and
    by putting a sequence of constructors on the right of the `:=` operator. Constructors,
    then, are separated by `|` and are either single names or a name followed by arguments
    in parentheses, where an argument is either a single name or a name followed by
    `:` and then a type, where we require that a type is a name.


    We implement this grammar by implementing the `:=` operator. An assignment has
    the lowest precedence, which means that whatever we write to the left or right
    of this operator will be arguments to the function. We do not have to worry about
    an expression in our language being translated into some `call` object of a different
    type. We cannot override the other assignment operators, `<-`, `->`, and `=`,
    so we have to use `:=`. Since this is also traditionally used to mean “defined
    to be equal to,” it works quite well.


    The approach we take in implementing this part of the pattern matching DSL is
    different from the examples we have seen earlier. We do not create a data structure
    that we can analyze nor do we evaluate expressions directly from expressions in
    our new language. Instead, we combine parsing expressions with code generation—we
    generate new functions and objects while we parse the specification. We add these
    functions, and other objects for constants, to the environment in which we call
    `:=`. Adding these objects to this environment allows us to use the constructors
    after we have defined them with no further coding, but it does mean that calling
    `:=` will have side effects.


    The construction function will expect a type name as its left-hand parameter and
    an expression describing the different ways of constructing elements of the type
    on its right-hand side. We will translate the left-hand side into a quosure because
    we want to get its associated environment. The right-hand side we will turn into
    an expression. For the construction specification, we do not want to evaluate
    any of the elements (unless the user invokes quasi-quotations). The left-hand
    side—the type we are defining—is just treated as a string since that is how the
    S3 system deals with types, so we will make sure it is a single symbol and then
    get the string representation of it. For this, we can use the `quo_name` function
    from `rlang`. The right-hand side we have to parse, but we delegate this to a
    separate function that we define next. Finally, we specify a function for pretty-printing
    elements of the new type we define.


    ```

    `:=` <- function(data_type, constructors) {

    data_type <- enquo(data_type)

    constructors <- enexpr(constructors)

    stopifnot(quo_is_symbol(data_type))

    data_type_name <- quo_name(data_type)

    process_alternatives(

    constructors,

    data_type_name,

    get_env(data_type)

    )

    assign(paste0("toString.", data_type_name),

    deparse_construction, envir = get_env(data_type))

    assign(paste0("print.", data_type_name),

    construction_printer, envir = get_env(data_type))

    }

    ```'
  trans: "\n# 11. 模式匹配\n\n在 ML 或 Haskell 这类语言中，你可以通过指定用于构造任意给定类型值的函数来定义数据类型。这本身并不太引人注目，但结合这些语言的模式匹配特性后，你就能编写出极其简洁的函数来转换数据结构。\n\
    \n在我的著作《*Functional Data Structures in R*》（Mailund，2017a）中，我描述了几种依赖于基于树结构进行转换的算法。这类转换涉及分析树的当前结构——它是否有左子树？那棵子树是叶节点吗？如果是红黑搜索树，树的颜色是什么？其右子树的颜色又是什么？在该书给出的算法中，大部分函数仅用于匹配这种树结构的代码就占了几十行。\n\
    \n借助本章实现的编程语言，编写这类转换函数的效率将大大提高。我们将构建两个主要结构。第一个用于定义数据结构，例如我们可以这样定义红黑搜索树：\n\n```\n\
    colour := R | B\nrb_tree := E | T(col : colour, left : rb_tree, value, right :\
    \ rb_tree)\n```\n\n第二个结构用于匹配此类类型的值，并据此执行相应操作。红黑搜索树的平衡函数可以简洁地实现如下：\n\n```\nbalance(\n\
    \  T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  T(B, T(R, T(R, a, x, b), y, c), z,\
    \ d) -> T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  T(B, a, x, T(R, b, y, T(R, c,\
    \ z, d))) -> T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  T(B, a, x, T(R, T(R, b,\
    \ y, c), z, d)) -> T(R, T(B, a, x, b), y, T(B, c, z, d)),\n  otherwise -> tree\n\
    )\n```\n\n这个函数仅需八行代码，而《*Functional Data Structures in R*》中则用了 42 行代码，尽管那里也使用了一些模式匹配技巧，但并没有专为它设计的领域特定语言。这种语言正是本章要实现的目标。\n\
    \n本章我们将使用以下 R 包：\n\n```r\nlibrary(rlang)\nlibrary(magrittr)\nlibrary(dplyr)\n\
    ```\n\n此外还需要使用我们在第 6 章定义的`make_args_list`函数。\n\n```r\nmake_args_list <- function(args)\
    \ {\n  res <- replicate(length(args), substitute())\n  names(res) <- args\n  as.pairlist(res)\n\
    }\n```\n\n如需包含本章及更多功能的完整 R 包，可参考 [`https://mailund.github.io/pmatch/`](https://mailund.github.io/pmatch/)。\n\
    \n## 构造器\n\n这种领域特定语言的核心特性在于类型构造器——即我们如何定义给定类型的值。DSL 的模式匹配部分将由嵌套的构造器调用组成，因此构造器的定义方式是该语言的核心要素。\n\
    \n这里我们借鉴函数调用的方式。构造器将采用与变量和函数调用相匹配的语法。\n\n```\nTYPEDEF ::= TYPENAME ':=' CONSTRUCTORS\n\
    CONSTRUCTORS ::= CONSTRUCTOR | CONSTRUCTOR '|' CONSTRUCTORS\nCONSTRUCTOR ::= NAME\
    \ | NAME '(' ARGS ')'\nARGS ::= ARG | ARG ',' ARGS\nARG ::= NAME | NAME ':' TYPE\n\
    TYPE ::= NAME\n```\n\n我们通过以下方式定义新类型：在`:=`操作符左侧指定类型名称，右侧放置一系列构造器。构造器之间用`|`分隔，可以是单个名称，也可以是名称后跟括号内的参数列表，其中参数可以是单个名称，也可以是名称后跟`:`及类型名（类型名必须为名称）。\n\
    \n我们通过实现`:=`操作符来解析该语法。赋值操作拥有最低优先级，这意味着该操作符左右两侧的内容都将成为函数的参数。我们无需担心语言中的表达式会被翻译成其他类型的`call`对象。由于无法重写其他赋值操作符（如`<-`、`->`和`=`），因此必须使用`:=`。这恰好与传统上表示“定义为等于”的用法一致。\n\
    \n实现模式匹配 DSL 这部分的方法与之前示例不同。我们既不会创建可分析的数据结构，也不会直接基于新语言的表达式求值。相反，我们将解析表达式与代码生成相结合——在解析规范的同时生成新的函数和对象。我们将这些函数及其他用于常量的对象添加到调用`:=`的环境中。将这些对象添加到环境后，我们无需额外编码即可使用这些构造器，但这意味着调用`:=`会产生副作用。\n\
    \n该构造函数将类型名称作为左侧参数，右侧参数则是描述构造类型元素的不同方式的表达式。我们将左侧参数转换为 quosure，以便获取其关联环境。右侧参数则转换为表达式。对于构造规范，我们不希望对任何元素求值（除非用户调用准引用）。左侧参数（即要定义的类型）仅作为字符串处理（因为\
    \ S3 系统以字符串方式处理类型），因此需确保其为单个符号并获取其字符串表示。为此可使用`rlang`的`quo_name`函数。右侧参数需进行解析，但我们将此任务委托给后续定义的独立函数。最后，我们为定义的新类型指定格式化打印函数。\n\
    \n```r\n`:=` <- function(data_type, constructors) {\n  data_type <- enquo(data_type)\n\
    \  constructors <- enexpr(constructors)\n  stopifnot(quo_is_symbol(data_type))\n\
    \  data_type_name <- quo_name(data_type)\n  process_alternatives(\n    constructors,\n\
    \    data_type_name,\n    get_env(data_type)\n  )\n  assign(paste0(\"toString.\"\
    , data_type_name),\n         deparse_construction, envir = get_env(data_type))\n\
    \  assign(paste0(\"print.\", data_type_name),\n         construction_printer,\
    \ envir = get_env(data_type))\n}\n```\n"
- fmt: "The last two statements in this function, the calls to `assign`, create functions\
    \ for printing elements of the type we are creating. We will implement the `deparse_construction`\
    \ and `construction_printer` functions in a moment. They extract information about\
    \ values from meta-information we will store in objects of the new type, and we\
    \ can use the same functions for all types we define in our language. We use them\
    \ to specialize the `toString` and `print` functions for this specific type. The\
    \ `paste0` calls create the names of the specializations of the generic `toString`\
    \ and `print` functions. The `assign` function then stores `deparse_construction`\
    \ and `construction_printer` under the appropriate names in the environment we\
    \ get from `get_env(data_type)`, in other words, the environment where we define\
    \ the type.\n\nThe expression on the right-hand side of `:=` defines how we construct\
    \ elements of the new type. We allow there to be more than one way to do this,\
    \ and we separate the various choices using the or operator, `|`. This approach\
    \ resembles how we describe different alternatives when we specify a grammar,\
    \ so it is a natural choice. To process the right-hand side, we use the function\
    \ `process_alternatives`.\n\n```\nprocess_alternatives <- function(constructors,\n\
    data_type_name,\nenv) {\nif (is_lang(constructors) && constructors[[1]] == \"\
    |\") {\nprocess_alternatives(\nconstructors[[2]],\ndata_type_name,\nenv\n)\nprocess_alternatives(\n\
    constructors[[3]],\ndata_type_name,\nenv\n)\n} else {\nprocess_constructor(\n\
    constructors,\ndata_type_name,\nenv\n)\n}\n}\n```\n\nIn addition to the constructor\
    \ expression, we pass the name of the type and the environment we are defining\
    \ it in as parameters. We do not use these directly in this function but merely\
    \ pass them along. We will use them later when we create the actual constructors.\n\
    \nThe `process_alternatives` function recursively parse the expression to get\
    \ all alternatives separated by `|`. The actual constructors will be either a\
    \ function or a symbol, so the constructor specifications will not have higher\
    \ precedence than the or operator. The first time we see something that isn’t\
