    we would be invoking the operators for R’s matrix class instead. And since `*`
    is not matrix multiplication (for that you need to use `%*%` because the `*` operator
    is component-wise multiplication), you get an error.


    We need a way of bootstrapping us from R’s matrices to the matrices in our expression
    language. That is what we use `m` for.


    ## Meta-Programming Parsing


    Using an explicit function such as `m` to bootstrap us into the matrix expression
    language is the simplest way to use R’s own parser for our benefits, but it is
    not the only way. In R, we can manipulate expressions as if they were data, a
    feature known as meta-programming and something we return to in Chapter [5](#A465211_1_En_5_Chapter.html).
    For now, it suffices to know that an expression can be explored recursively. We
    can use the predicate `is.name` to check whether the expression refers to a variable,
    and we can use the predicate `is.call` to check whether it is a function call—and
    all operators are function calls. So, given an expression that does not use the
    `m` function and thus does not enter our DSL, we can transform it into one that
    goes like this:


    ```

    build_matrix_expr <- function(expr) {

    if (is.name(expr)) {

    return(substitute(m(name), list(name = expr)))

    }

    if (is.call(expr)) {

    if (expr[[1]] == as.name("("))

    return(build_matrix_expr(expr[[2]]))

    if (expr[[1]] == as.name("*") ||

    expr[[1]] == as.name("%*%")) {

    return(call(''*'',

    build_matrix_expr(expr[[2]]),

    build_matrix_expr(expr[[3]])))

    }

    if (expr[[1]] == as.name("+")) {

    return(call(''+'',

    build_matrix_expr(expr[[2]]),

    build_matrix_expr(expr[[3]])))

    }

    }

    stop(paste("Parse error for", expr))

    }

    ```


    In this implementation, we consider both `*` and `%*%` matrix multiplication so
    that we would consider an R expression that uses matrix multiplication as such.
    Notice also that we consider calls that are parentheses. Parentheses are also
    function calls in R, and if we want to allow our language to use parentheses,
    we have to deal with them—like here, where we just continue the recursion. We
    did not have to worry about that when we explicitly wrote expressions using `m`
    and operator overloading because there R already took care of giving parentheses
    the right semantics.


    For this function to work, it needs a so-called quoted expression. If we write
    a raw expression in R, then R will try to evaluate it before we can manipulate
    it. We will get an error before we even get to rewrite the expression.


    ```

    build_matrix_expr(A * B)

    ## Error in A * B: non-conformable arrays

    ```


    To avoid this, we need to quote the expression.


    ```

    build_matrix_expr(quote(A * B))

    ## m(A) * m(B)

    ```


    We can avoid having to explicitly quote expressions every time we call the function
    by wrapping it in another function that does this for us. If we call the function
    `substitute` on a function parameter, we get the expression it contains so that
    we can write a function like this:


    ```

    parse_matrix_expr <- function(expr) {

    expr <- substitute(expr)

    build_matrix_expr(expr)

    }

    ```


    Now, we do not need to quote expressions to do the rewriting.


    ```

    parse_matrix_expr(A * B)

    ## m(A) * m(B)

    ```


    This isn’t a perfect solution, and there are some pitfalls, among which is that
    you cannot use this function from other functions directly. The `substitute` function
    can be difficult to work with. The further problem is that we are creating a new
    expression, but it’s an R expression and not the data structure we want in our
    matrix expression language. You can think of the R expression as a literate piece
    of code; it is not yet evaluated to become the result we want. For that, we need
    the `eval` function, and we need to evaluate the expression in the right context.
    Working with expressions, especially evaluating expressions in different environments,
    is among the more advanced aspects of R programming, so if it looks complicated
    right now, do not despair. We cover it in detail in Chapter [7](#A465211_1_En_7_Chapter.html).
    For now, we will just use this function:


    ```

    parse_matrix_expr <- function(expr) {

    expr <- substitute(expr)

    modified_expr <- build_matrix_expr(expr)

    eval(modified_expr, parent.frame())

    }

    ```


    It gets the (quoted) expression, builds the corresponding matrix expression, and
    then evaluates that expression in the “parent frame,” which is the environment
    where we call the function. With this function, we can get a data structure in
    our matrix language from an otherwise ordinary R expression.


    ```

    parse_matrix_expr(A * B)

    ## ([A] * [B])

    ```


    The approach we take here involves translating one R expression into another to
    use our `m` function to move us from R to matrix expressions. This involves parsing
    the expression twice, once when we transform it and again when we ask R to evaluate
    the result. The approach is also less expressive than using the `m` function directly.
    We can call `m` with any expression that generates a matrix, but in the expression
    transformation, we only allow identifiers.


    As an alternative, we can build the matrix expression directly using our constructor
    functions. We will use `matrix_mult` and `matrix_sum` when we have a call that
    is `*`, `%*%`, or `+`, and otherwise, we will call `m`. This way, any expression
    we do not recognize as multiplication or addition will be interpreted as a value
    we should consider a matrix. This approach, however, adds one complication. When
    we call function `m`, we need to call it with a value, but what we have when traversing
    the expression is quoted expressions. We need to evaluate such expressions, and
    we need to do so in the right environment. We will need to pass an environment
    along with the traversal for this to work.


    ```

    build_matrix_expr <- function(expr, env) {

    if (is.call(expr)) {

    if (expr[[1]] == as.name("("))

    return(build_matrix_expr(expr[[2]], env))

    if (expr[[1]] == as.name("*") || expr[[1]] == as.name("%*%"))

    return(matrix_mult(build_matrix_expr(expr[[2]], env),

    build_matrix_expr(expr[[3]], env)))

    if (expr[[1]] == as.name("+"))

    return(matrix_sum(build_matrix_expr(expr[[2]], env),

    build_matrix_expr(expr[[3]], env)))

    }

    data_matrix <- m(eval(expr, env))

    attr(data_matrix, "def_expr") <- deparse(expr)

    data_matrix

    }

    ```


    Most of this function should be self-explanatory, except for where we explicitly
    set the `def_expr` attribute of a data matrix. This is the attribute to be used
    for pretty printing, and when we call the `m` function, it is set to the literate
    expression we called `m` with. This would be `eval(expr, env)` for all matrices
    we create with this function. To avoid that, we explicitly set it to the expression
    we use in the evaluation.


    Once again, we can wrap the function in another that gets us the quoted expression
    and provide the environment in which we should evaluate expressions.


    ```

    parse_matrix_expr <- function(expr) {

    expr <- substitute(expr)

    build_matrix_expr(expr, parent.frame())

    }

    parse_matrix_expr(A * B + matrix(1, nrow = 10, ncol = 10))

    ## (([A] * [B]) + [matrix(1, nrow = 10, ncol = 10)])

    ```


    There is more to know about manipulating expressions, especially about how they
    are evaluated, but we will return to that in later chapters.'
