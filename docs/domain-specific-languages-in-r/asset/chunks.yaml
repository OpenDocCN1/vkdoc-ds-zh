    \ the very least you should be familiar with functional and object-oriented programming\
    \ in R (although the next chapter will review the object-oriented programming\
    \ features we will use). It will be helpful to have some experience with meta-programming\
    \ when it comes to evaluating expressions in contexts that interact with the surrounding\
    \ R code. However, Chapter [7](#A465211_1_En_7_Chapter.html) gives a crash course\
