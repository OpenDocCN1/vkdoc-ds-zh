    \n本书介绍在 R 语言中嵌入领域特定语言。术语“领域特定语言”（DSL）指的是专用于特定目的的编程语言，与通用编程语言相对。在理想情况下，领域特定语言能让你在特定上下文中，以精确的方式指定想要执行的任务和实现的目标。正则表达式就是领域特定语言的一个例子，它提供了专门的符号来表达文本模式。你可以使用这种领域特定语言来定义要搜索的文本字符串，或指定修改文本的规则。正则表达式通常被认为难以阅读，但它们确实为描述文本模式提供了有用的语言。领域特定语言的另一个例子是\
    \ SQL——一种专用于从关系数据库提取和修改数据的语言。通过 SQL，你拥有一种表达力丰富的领域特定语言，可以指定要访问或修改数据库中哪些数据点的规则。\n\
    \n## 本书读者对象\n\n本书面向有经验的 R 语言程序员。本书涵盖的一些概念较为高级，因此你至少应熟悉 R 语言中的函数式编程和面向对象编程（尽管下一章将复习我们将使用的面向对象编程特性）。在需要与周围\
    \ R 代码交互的上下文中求值表达式时，具备一些元编程经验会有所帮助。不过，第 7 章将为我们将在本书中使用的技术提供速成课程，因此你稍加努力便能掌握。\n"
- fmt: '# Domain-Specific Languages


    With domain-specific languages we often distinguish between “external” and “embedded”
    languages. Regular expressions and `SQL` are typically specified as strings when
    you use them in a program, and these strings must be parsed and interpreted when
    your program runs. In a sense, they are languages separated from the programming
    language you use them in. They need to be compiled separately and then called
    by the main programming language. They are therefore considered “external” languages.
    In contrast, embedded domain-specific languages provide domain-specific languages
    expressed in the general-purpose language in which they are used. In R, the grammar
    of graphics implemented in `ggplot2` or the data transformation operations implemented
    in `dplyr` provides small languages—domain-specific languages—that you can use
    from within R, and you write the programs for these languages in R as well.


    Embedded DSLs extend the programming language in which you are working. They provide
    more than what you usually find in a framework in the form of functions and classes
    as they offer a high level of flexibility in what you can do with them. They are
    programming languages, after all, and you can express complex ideas and tasks
    in them. They provide a language for expressing thoughts in a specific domain,
    so they do not give you a general programming language as the language you use
    them from, but they do extend that surrounding language with new expressive power.
    However, being embedded in the general-purpose language means that they will follow
    the rules you are familiar with there—or mostly, at least, since in languages
    such as R it is possible to modify the rules a bit using so-called non-standard
    evaluation. You can expect the syntax of the embedded DSL to follow the rules
    of the general-purpose language. The semantics will be determined by the DSL,
    but when you write programs in the DSL, the syntax is already familiar to you.
    If you implement a DSL yourself, embedding it in a general-purpose language lets
    you reuse the parsing and evaluation done by the general-purpose language so that
    you can focus on designing the domain-specific language.


    Implementing embedded domain-specific languages often involves meta-programming;
    that is, it consists of treating the program you are writing as data that you
    can manipulate from within the language itself. This might sound more complicated
    than it is, but quite often, it is reasonably straightforward to achieve. Using
    classes and operator overloading, we can use R’s parser to parse embedded languages
    by simply designing the language such that evaluating expressions automatically
    parse them. This leaves us with data structures we, ourselves, have defined, without
    us having to parse anything, and we can rewrite the results of such parsed expressions
    in various ways before we evaluate them to run the embedded program. Evaluating
    expressions can be relatively straightforward or involve a deeper analysis of
    the parsed expressions.


    To get a feel for what we can do with embedded domain-specific languages, let’s
    consider a simple DSL: matrix multiplication (an example we cover in more detail
    in Chapter [2](#A465211_1_En_2_Chapter.html)). You might not think of matrix expressions
    as much of a programming language, but the arithmetic notation is highly efficient
    for expressing ideas in a limited domain. Just imagine having to do mathematics
    without this notation. Of course, R already supports this language—it has infix
    operators and the semantics we associate with arithmetic expressions when we write
    them in an R program. However, since matrix multiplication is a well-known task,
    it serves as an excellent example to illustrate some of the things we can do if
    we extend R with other smaller programming languages.


    R already supports arithmetic with matrices, and if you use the operator `%*%`,
    you can do matrix multiplication (if you use `*`, you will do component-wise multiplication
    instead). Multiplications are done one at a time, so if you have a series of them,
    such as this:


    ```

    A %*% B %*% C %*% D

    ```


    then the product will be computed from left to right, like this:


    ```

    ((A %*% B) %*% C) %*% D

    ```


    For each multiplication, you produce a new matrix that will be used in the next
    multiplication.


    Now, matrix multiplication is associative, so you should be able to set the parentheses
    in any way, as long as you respect the left-to-right order of the matrices (matrix
    multiplication is not commutative, after all), and you will get the same result.
    The running time, however, will not be the same. We can do a small experiment
    to see this using the `microbenchmark` package.


    ```

    A <- matrix(1, nrow = 400, ncol = 300)

    B <- matrix(1, nrow = 300, ncol = 30)

    C <- matrix(1, nrow = 30, ncol = 500)

    D <- matrix(1, nrow = 500, ncol = 400)

    library(microbenchmark)

    res <- microbenchmark(A %*% B %*% C %*% D,

    ((A %*% B) %*% C) %*% D,

    (A %*% (B %*% C)) %*% D,

    (A %*% B) %*% (C %*% D),

    A %*% (B %*% (C %*% D)),

    A %*% ((B %*% C) %*% D))

    options(microbenchmark.unit="relative")

    print(res, signif = 3, order = "mean")

    ## Unit: relative

    ##                     expr  min   lq mean median

    ##  (A %*% B) %*% (C %*% D) 1.00 1.00 1.00   1.00

    ##  A %*% (B %*% (C %*% D)) 3.92 3.87 3.49   3.84

    ##      A %*% B %*% C %*% D 6.13 6.06 5.42   6.03

    ##  ((A %*% B) %*% C) %*% D 6.12 6.05 5.51   6.04

    ##  A %*% ((B %*% C) %*% D) 7.71 7.62 6.75   7.57

    ##  (A %*% (B %*% C)) %*% D 9.88 9.76 8.73   9.69

    ##    uq  max neval

    ##  1.00 1.00   100

    ##  3.62 1.41   100

    ##  5.57 2.06   100

    ##  5.61 2.35   100

    ##  7.00 2.30   100

    ##  8.99 3.71   100

    ```


    Here, I’ve computed the matrix product in the five different possible ways. There
    are six expressions, but the first two will compute the matrix multiplication
    in the same order. With `microbenchmark` we compute each expression 100 times
    and collect the time each evaluation takes. We collect the time it takes to compute
    each expression, and here I have displayed the running time relative to the fastest
    expression, sorted by the mean evaluation time.


    On average, there is almost a factor of ten between the fastest and the slowest
    evaluation (for the slowest evaluations in the two cases the difference is a factor
    of two, which is still a substantial relative difference). There is something
    to be gained by setting parentheses optimally if we multiply together several
    large matrices. The dimensions of matrices are not necessarily known before runtime,
    however, so ideally we want to set the parentheses when we evaluate expressions
    in an optimal way.


    The approach we take in Chapter [2](#A465211_1_En_2_Chapter.html) is to delay
    the evaluation of matrix multiplication and instead build a data structure for
    matrix expressions, one we can evaluate later when we have the entire matrix multiplication
    expression constructed. It is a simple DSL, but it contains all the components
    we typically need in one: we need code for parsing an expression and creating
    a representation of it, we need to do some manipulation of expressions, and then
    we need to evaluate them.


    For parsing expressions, we need to capture matrices and multiplications. We wrap
    matrices in a class to make them objects of our language, rather than plain R
    data.


    ```

    m <- function(data) {

    structure(data,

    nrow = nrow(data),

    ncol = ncol(data),

    class = c("matrix_expr", class(data)))

    }

    ```


    The class `matrix_expr` is one we will use to overload the multiplication operator,
    and we want all elements of this class to know their dimensions, so when we wrap
    the data, we save the number of rows, `nrow`, and the number of columns, `ncol`.


    We also want to capture matrix multiplications, where we do not evaluate the multiplication
    but simply save references to the matrices that we want to multiply together.'
