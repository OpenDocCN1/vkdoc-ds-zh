  raw: 'Technically, what I refer to as grammar is syntax. Linguists use grammar to
    refer to both morphology and syntax, where syntax is the rules for stringing words
    together. In computer science, though, the term grammar is used as I use it here.
    Therefore, I will use syntax and grammar interchangeably.


    [2](#A465211_1_En_3_Chapter.html#Fn2_source)


    The purists might complain here and say that a parser will construct a parse tree
    and not an AST . The difference between the two is that a parse tree contains
    all the information in the input (such as parentheses, spaces, and so on) but
    not the meta-information about which grammatical structures it represents. The
    AST contains only the relevant parts of the input but includes grammatical information
    on top of that. If you want, you can consider first parsing and then translating
    the result into an AST as two separate steps in handling an input language. I
    consider them part of the same and will claim that a parser constructs an AST.


    [3](#A465211_1_En_3_Chapter.html#Fn3_source)


    Notice, however, that there is a distinction between giving a statement meaning
    and giving it the correct meaning. Just because your program computes something
    doesn’t mean it computes what you intended it to compute. When we construct a
    language, domain-specific or general, we can give meaning to statements, but we
    cannot—this is theoretically impossible—guarantee that it is the intended meaning.
    That will always be the responsibility of the programmer.


    [4](#A465211_1_En_3_Chapter.html#Fn4_source)


    Operator precedence is a term we use to describe how “tightly” different operators
    bind, i.e., which operators are invoked before others, or put in another way,
    where we implicitly set parentheses in an expression. Multiplication binds tighter
    than addition—has a higher precedence—so the expression 2*x + 4*y is interpreted
    as (2*x) + (4*y) rather than, for example, 2*(x + (4*y)). Precedence also tells
    us whether operators are evaluated left to right or right to left, so x + y +
    z is evaluated as (x + y) + z rather than x + (y + z) because + evaluates left
    to right. For addition, the left-to-right or right-to-left order doesn’t matter
    because we will end up with the same result, but for some operators it does, for
    example, exponentiation, which is evaluated left to right. So, x**y**z is x**(y**z),
    which (usually) is different from (x**y)**z. If you use operators in a domain-specific
    language, the precedence of the operators will affect your language.


    [5](#A465211_1_En_3_Chapter.html#Fn5_source)


    We haven’t formally defined how we would specify non-literate tokens in the syntax
    we use for specifying grammars, and doing so will not make the example any clearer,
    so let’s just state that informally.


    [6](#A465211_1_En_3_Chapter.html#Fn6_source)


    If you are not familiar with continuous time Markov chains an informal description
    could be this: A CTMC is a graph where nodes represent states and edges transition
    between states, and each edge is annotated with the rate at which changes happen.
    The model is stochastic, so rates should be thought of as expectations of change
    over time. If we have a rate of 1 between states s and t, then for each time unit,
    we would expect to see one change from s to t. If we want to know the probability
    of being in state t at some time t if we are in state s at time =0, we cannot
    consider the states s and t in isolation. There might be other states we can go
    to from s and if we go to those, it might take a longer or shorter time to reach
    t, or there might be states we can continue to from t so we might go through t
    before time t but no longer be there. We have to take all edges and all rates
    into account. Figuring out the probability of being at state t at time t is therefore
    dependent on matrix operations, in particular matrix exponentiation.


    # 4. Functions, Classes, and Operators


    Everything you do in R, you do with functions. Consequently, if you want to implement
    a domain-specific language, you must do so by writing functions. All the actions
    that your new DSL should support must be implemented using functions, and should
    you want a special syntax for your DSL, you will have to write functions for parsing
    this syntax. When implementing an embedded DSL, as we shall see, much of the parsing
    can be outsourced to R’s parser. The price for this is some restrictions to the
    syntax for the DSL—the DSL must be syntactically valid R code. We cannot construct
    arbitrary syntaxes for embedded languages, but by using operator overloading or
    meta-programming and by defining new infix operators, we do have some flexibility
    in designing our DSLs.


    In the previous two chapters, we saw examples of how to use both operator overloading
    and meta-programming to treat R expressions as expressions in an embedded language.
    The purpose of this chapter is to go into the details of the operator option,
    while the next chapter will cover the possibility of explicitly manipulating expressions
    through meta-programming.


    ## The S3 Object-Oriented Programming System


    You could write a whole book about the object-oriented programming systems supported
    by R—I know because I have written such a book—but for operator overloading and
    implementing DSL parsers, we need only a few of the object orientation features,
    and this section will give you a quick introduction to those. We will use only
    the simplest object orientation system in this book, the S3 system. If you are
    already familiar with the S3 system, feel free to skip ahead to the next section.


    ### Objects and Classes


    The S3 system has a straightforward approach to object orientation. It lets us
    associate classes with any object (except for `NULL`). Classes are text strings
    with no structure, and you can get the classes associated with an object by calling
    the function `class`.


    ```

    class(4)

    ## [1] "numeric"

    class("foo")

    ## [1] "character"

    class(TRUE)

    ## [1] "logical"

    class(sin)

    ## [1] "function"

    ```


    You can set the class of an object with the corresponding assignment function,
    shown here:


    ```

    class(sin) <- "foo"

    class(sin)

    ## [1] "foo"

    ```


    without affecting what the object is or does.


    ```

    sin(0)

    ## [1] 0

    ```


    There are some limits to which objects you can change the class of—you cannot
    change the class of literal numbers and strings, for example, so if you attempted
    this:


    ```

    class(2) <- "character"

    class("foo") <- "numeric"

    ```


    you would get errors. Still, you are free to modify the classes of objects any
    time you want. The class associated with an object is just an attribute containing
    one or more class names—in the previous cases, all the objects have a single class,
    but the matrix expressions we created Chapter [2](#A465211_1_En_2_Chapter.html),
    for example, had multiple classes. Vectors of class names are used both for multiple
    inheritance and for single inheritance, and there is no formal class structure
    at all. You can set the classes any way you want. The class attribute is just
    a vector of strings that are interpreted as class names.


    The only thing that makes the class attribute interesting, compared to any other
    attributes you could associate with objects, is how it is used for dispatching
    generic functions. When you call a generic function, the actual function that
    gets called depends on the class of one of its arguments, usually the first (if
    you do not provide the argument explicitly, it will always be the first).'
