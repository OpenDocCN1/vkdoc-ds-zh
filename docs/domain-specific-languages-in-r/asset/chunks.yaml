- fmt: "```markdown\nWe wrap the `test_pattern_rec` function in a closure, `tester`,\
    \ that is called with a function that we call `escape`. This is the function that\
    \ `callCC` will provide. If, at any point, we call the function `escape`, it will\
    \ terminate whatever we are doing and return to the point where we called `callCC`.\
    \ This means we can use `escape` to get out of deep recursions if we find out\
    \ at some point that the pattern doesn’t match the expression. We do not need\
    \ to propagate a failed match up the call stack through the recursive function\
    \ calls. As soon as we call `escape`, we are taken back to the end of `test_pattern`.\
    \ Whatever we called `escape` with—it is a function of a single parameter—will\
    \ be the return value of the `callCC` call. So, if we find that a pattern doesn’t\
    \ match, we will call `escape` with `NULL`. This will then be the result of `test_pattern`.\
    \ If we never call `escape` but instead return normally from `test_pattern_rec`,\
    \ then what we return from that function will also be the return value of the\
    \ `callCC` call. So, if we match the pattern and return an environment from `test_pattern_rec`,\
    \ this will also be the return value of the `test_pattern` call.\n\n```\ntest_pattern\
    \ <- function(expr, test_expr, eval_env) {\n  # Environment in which to store\
    \ matched variables\n  match_env <- env()\n  if (test_expr == quote(otherwise))\n\
    \    return(match_env)\n  # Test pattern\n  tester <- function(escape)\n    test_pattern_rec(escape,\
    \ expr, test_expr,\n                     eval_env, match_env)\n  callCC(tester)\n\
    }\n```\n\nIt is in `test_pattern_rec` the real work is done. It analyzes the pattern\
    \ expression, stored in the `test_expr` variable, and matches it against the value\
    \ stored in the `expr` variable. It also takes two environments as parameters.\
    \ One is the environment where the expression and pattern are defined; it needs\
    \ this environment to look up variables to check what they are. The other is the\
    \ environment in which it should bind variables from the pattern. It, of course,\
    \ also knows the `escape` function that it can use if it finds out that the pattern\
    \ isn’t matching.\n\n```\ntest_pattern_rec <- function(escape, expr, test_expr,\n\
    \                             eval_env, match_env) {\n  # Is this a function-constructor?\n\
    \  if (is_lang(test_expr)) {\n    func <- get(as_string(test_expr[[1]]), eval_env)\n\
    \    if (inherits(func, \"constructor\")) {\n      # This is a constructor.\n\
    \      # Check if it is the right kind\n      constructor <- as_string(test_expr[[1]])\n\
    \      expr_constructor <- attr(expr, \"constructor\")\n      if (is_null(expr_constructor)\
    \ ||\n          constructor != expr_constructor)\n        escape(NULL) # wrong\
    \ type\n      # Now check recursively\n      for (i in seq_along(expr)) {\n  \
    \      test_pattern_rec(\n          escape,\n          expr[[i]], test_expr[[i+1]],\n\
    \          eval_env, match_env\n        )\n      }\n      # If we get here, the\
    \ matching was successfull\n      return(match_env)\n    }\n  }\n  # Is this a\
    \ constant-constructor?\n  if (is_symbol(test_expr) &&\n      exists(as_string(test_expr),\
    \ eval_env)) {\n    constructor <- as_string(test_expr)\n    val <- get(constructor,\
    \ eval_env)\n    val_constructor <- attr(val, \"constructor_constant\")\n    if\
    \ (!is_null(val_constructor)) {\n      expr_constructor <- attr(expr, \"constructor\"\
    )\n      if (is_null(expr) || constructor != expr_constructor)\n        escape(NULL)\
    \ # wrong type\n      else\n        return(match_env) # Successfull match\n  \
    \  }\n  }\n  # Not a constructor.\n  # Must be a value to compare with or a variable\
    \ to bind to\n  if (is_symbol(test_expr)) {\n    assign(as_string(test_expr),\
    \ expr, match_env)\n  } else {\n    value <- eval_tidy(test_expr, eval_env)\n\
    \    if (expr != value) escape(NULL)\n  }\n  match_env\n}\n```\n\nThere are three\
    \ cases to consider. The `test_expr` is a constructor function, a constructor\
    \ constant, or something else.\n\nIf `test_expr` is a function call, we test this\
    \ using `is_lang` from `rlang`, then it might be a function constructor. To figure\
    \ out whether it is, we look the function name up in the evaluation environment,\
    \ in other words, the environment where the test pattern was written. We then\
    \ test whether the function inherits a `constructor`. The functions we create\
    \ in our DSL will also be constructor objects, so if it does inherit `constructor`,\
    \ we know we have such one. We then check whether `expr` has an attribute `constructor`.\
    \ If it was generated by a call to a constructor, it will. If it doesn’t, then\
    \ we cannot have a match, and we escape with `NULL`. We also escape if the names\
    \ of the constructors do not match. If they do, we iterate through all the elements\
    \ in the pattern and expression calls and attempt to match these. If they do not\
    \ match, we will never return from a recursive call—they will have used the `escape`\
    \ function to jump directly to the `callCC` point in `test_pattern`. If they return,\
    \ the pattern did match the expression, and we return the `match_env` that now\
    \ contains any variables that were bound in the matching.\n\nIf `test_expr` is\
    \ not a function call, it might still be a constructor. If it is, then it will\
    \ be a symbol, and the symbol will be a variable in the `eval_env` scope—we test\
    \ this with the `exists` function. These two tests tell us only that there is\
    \ a variable with the name from `test_expr` in `eval_env`. Not that it is a constant\
    \ constructor. To test this, we get the value the variable evaluates to, using\
    \ the `get` function, and check if it has an attribute called `constructor_constant`.\
    \ If it does, then that is the name of the constructor, and we can test that against\
    \ the value in `expr` that either will be the object that represents the constant\
    \ (in which case we have a match) or will be something else (in which case we\
    \ escape).\n\nIf we get past the first two tests, we do not have a constructor.\
    \ We now either have a value that we must test against `expr` or have a variable\
    \ that we should bind to the value of `expr`. Here, I have decided that any symbol\
    \ will be interpreted as a variable that should be bound, and anything else should\
    \ be a value that we evaluate and compare against `expr`. We could also have checked\
    \ if the variable was bound and used its value in that case, but that could clearly\
    \ lead to hard-to-fix bugs. In any case, you can always use quasi-quoting to achieve\
    \ the same effect.\n\n```\nx  \"x\",\nL(!!y) -> \"y\")\n## [1] \"x\"\n```\n\n\
    So, we bind any variable by assigning the value of `expr` to the symbol in the\
    \ `match_env` environment. Anything that isn’t a symbol should be a value that\
    \ is the same as `expr`. To get this value, we evaluate the `test_expr` in the\
    \ `eval_env`.\n\nThat was the entire implementation of pattern matching. It might\
    \ not be trivial code, but it is not horribly complicated either, and we have\
    \ created an efficient language in less than 200 lines of code.\n\nWe can try\
    \ it, now, by implementing a depth-first traversal of the binary tree type we\
    \ defined earlier. The following function is a simple traversal that adds together\
    \ all the values found in leaves. The `match` call considers the basis case (a\
    \ leaf) and the recursive case (a tree with a `left` and `right` subtree) and\
    \ doesn’t need an `otherwise` case.\n\n```\ndft  v,\n                        \
    \       T(left, right) -> dft(left) + dft(right))\n}\ndft(L(1))\n## [1] 1\ndft(T(L(1),L(2)))\n\
    ## [1] 3\ndft(T(T(L(1),L(2)),L(3)))\n## [1] 6\n```\n```"
