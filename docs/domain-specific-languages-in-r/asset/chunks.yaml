- fmt: '# Operator Overloading


    Most operators, with exceptions of arrow assignments (`<-` and `->`) and slot
    and component access (`@` and `$`), behave as generic functions and can be overloaded.
    The mechanism for overloading operators is not different from the mechanism for
    implementing a new version of a generic function—if you name a function the right
    way, it will be invoked when a generic function is called.


    For example, to define addition on `a` objects, we need to define the `+.a`, which
    we could do like this:


    ```

    `+.a` <- function(e1, e2) {

    cat("+.a\n")

    NextMethod()

    }

    x + 2

    ## +.a

    ## [1] 3

    ## attr(,"class")

    ## [1] "c" "b" "a"

    ```


    Here, we print some output and then invoke the underlying numeric addition—since
    the object `x` here is a numeric value as well as an object of class `a`—by invoking
    `NextMethod`. It is important that we use `NextMethod` here. If we use addition,
    we would be calling `+.a` once again. So do not attempt this:


    ```

    `+.a` <- function(e1, e2) {

    cat("+.a\n")

    e1 + e2

    }

    ```


    This function causes infinite recursion, and it is not what you want.


    You overload operators in the same way as you would define specializations of
    generic functions, but there are differences between the two and how they dispatch.
    With standard generic functions, you would dispatch based on the first argument.
    With operators, there are heuristics that are there to make sure that the same
    function is called regardless of the order of the operands. You could easily imagine
    the pain to debug programs where switching the order of the operands would also
    call entirely different functions. That doesn’t happen in R because operations
    are not exactly the same as other generic functions.


    If we have defined `+.a` and we try to add a number to `x`, then we can do that
    in either order, and it will be the `+.a` function that is called.


    ```

    x + 3

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "c" "b" "a"

    3 + x

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "c" "b" "a"

    ```


    This is also the case if we add to `x` an object of a different class.


    ```

    x <- 1 ; y <- 3

    class(x) <- "a"

    class(y) <- "b"

    x + y

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "a"

    y + x

    ## +.a

    ## [1] 4

    ## attr(,"class")

    ## [1] "b"

    ```


    unless we have also defined an addition operator for that class.


    ```

    `+.b` <- function(e1, e2) {

    cat("+.bn")

    NextMethod()

    }

    x + y

    ## Warning: Incompatible methods ("+.a", "+.b") for

    ## "+"

    ## [1] 4

    ## attr(,"class")

    ## [1] "a"

    y + x

    ## Warning: Incompatible methods ("+.b", "+.a") for

    ## "+"

    ## [1] 4

    ## attr(,"class")

    ## [1] "b"

    ```


    If both `a` and `b` have their own version of addition, then we need a way to
    resolve which version `x+y` and `y+x` should call. Here, the first operand takes
    precedence, so it determines which function is called—and you get a well-deserved
    warning for getting up to such shenanigans.


    You might be able to come up with other rules on how to resolve such situations.
    For example, you could say that the most abstract method should be called, so
    if both `x` and `y` were of class `b` but only `x` was also of class `a`, then
    we should call `+.b`.


    ```

    class(x) <- c("a","b")

    class(y) <- "b"

    ```


    Unfortunately, you cannot make such rules in the S3 system. It is possible with
    the S4 system, where you can dispatch generic functions based on multiple arguments,
    but that goes beyond the scope of this book. We will make sure to avoid situations
    where we have to add different classes of objects that define the same operators
    by constructing grammars appropriately.


    Notice, though, that the combination of multiple classes and `NextMethod` still
    works as before. In the S3 system, we cannot define generic methods that dispatch
    based on multiple arguments, but we can use `NextMethod` to invoke several methods
    as we evaluate an operator. If we invoke `+.a` on object `x`, which now has classes
    `a` and `b`, the call to `NextMethod` in the implementation of that function will
    invoke `+.b` before that function invokes the numeric addition.


    ```

    class(x) <- c("a", "b")

    x + 2

    ## +.a

    ## +.bn

    ## [1] 3

    ## attr(,"class")

    ## [1] "a" "b"

    x + y

    ## Warning: Incompatible methods ("+.a", "+.b") for

    ## "+"

    ## [1] 4

    ## attr(,"class")

    ## [1] "a" "b"

    ```


    R has unary operators as well as binary operators. The negation operator, `!`,
    only exists in a unary operator, and you can specialize it for a given class by
    defining a function that takes a single argument.


    ```

    `!.a` <- function(x) {

    cat("Not for a\n")

    NextMethod()

    }

    !x

    ## Not for a

    ## [1] FALSE

    ```


    For the `-` and `+` operators, though, we use the same symbol for both unary and
    binary operators. Here, we have to use the same function for both since the only
    way we identify operator functions is through their name, and that would be the
    same for the unary and binary operators. The way we can determine whether the
    function is called as part of a unary or binary operator is to test whether the
    second argument is missing. If it is, we have a unary operator; otherwise, it
    is binary.


    ```

    `+.a` <- function(e1, e2) {

    if (missing(e2)) {

    cat("Unary\n")

    } else {

    cat("Binary\n")

    }

    NextMethod()

    }

    class(x) <- "a"

    +x

    ## Unary

    ## [1] 1

    ## attr(,"class")

    ## [1] "a"

    2+x

    ## Binary

    ## [1] 3

    ## attr(,"class")

    ## [1] "a"

    ```


    ## Group Generics


    There is another way you can overload operators based on their operands’ class:
    group generics. Group generics, as the name suggests, group several operators.
    They provide a way for us to define a single function that handles all operators
    of a given type. For arithmetic and logical operators (`+`, `-`, `*`, `/`, `^`,
    `%%`, `%/%`, `&`, `|`, `!`, `==`, `!=`, `<`, `<=`, `>=`, and `>`), the relevant
    group generic is `Ops`.


    If we define `Ops.c`, then we define a function that will be called for all of
    these operators when used on an element of class `c`.


    ```

    Ops.c <- function(e1, e2) {

    cat(paste0("Ops.c (", .Generic, ")\n"))

    NextMethod()

    }

    z <- 2

    class(z) <- "c"

    z + 1

    ## Ops.c (+)

    ## [1] 3

    ## attr(,"class")

    ## [1] "c"

    1 + z

    ## Ops.c (+)

    ## [1] 3

    ## attr(,"class")

    ## [1] "c"

    z ^ 3

    ## Ops.c (^)

    ## [1] 8

    ## attr(,"class")

    ## [1] "c"

    ```


    The “magical” variable `.Generic` contains the name of the operator that is called,
    and calling `NextMethod` will dispatch to the relevant next implementation of
    the operator.


    If you implement both the `Ops` group generic and concrete implementations of
    some individual operator generics, then the latter takes precedence. If, for example,
    we have an object of class `a` and `c`, where we have defined addition for class
    `a` and have the group generic for `c`, the addition will invoke the `+.a` function.
    All other operators will invoke the `Ops.c` function.


    ```

    class(z) <- c("a", "c")

    1 + z

    ## Binary

    ## [1] 3

    ## attr(,"class")

    ## [1] "a" "c"

    2 * z

    ## Ops.c (*)

    ## [1] 4

    ## attr(,"class")

    ## [1] "a" "c"

    ```


    With `Ops` you have a method for catching all operators for which you do not explicitly
    write specialized generics.'
