    # 文本、令牌、语法与语义


    首先，我们需要定义一些术语。由于本书并非关于语言或解析器理论，我将为后续需要用到的术语提供若干非正式的工作定义。


    当我们审视一门语言时，可以从不同细节层次进行观察，从最基本的构成元素到表达式与语句所关联的含义。对于口语而言，最基本的元素是音素——即该语言中使用的不同发音。音素组合成单词，单词组合成句子，而句子则具有含义。对于书面语言而言，原子元素是字形——即使用字母表书写的语言（如英语）中的字母。字母序列可以构成单词，但书面句子不仅包含单词，还有标点符号。我们可以将这些统称为**令牌**（tokens）。一串令牌构成一个句子，同样，我们为句子赋予含义。


    对于计算机语言而言，我们在符号字符串上也有类似的抽象层次。最原始的层次仅仅是输入字符流，但我们会有相应的规则将这些字符序列转换为令牌序列。这一过程被称为**词法分析**（tokenization）。编程语言的正式定义会规定该语言中可用的令牌有哪些，以及字符串应如何被转换为令牌串。


    考虑以下 R 代码字符串：


    ```

    foo(x, 2*x)

    ```


    这显然是一个函数调用，但对于词法分析器来说，它看到的是一串需要转换为令牌序列的字符。它将产生如下结果：


    ```

    identifier["foo"] ''('' identifier["x"],

    number[2], ''*'', identifier["x"]

    '')''

    ```


    这里我采用了一种自创的表示法，但其核心思想是：词法分析器会识别出标识符和数字（并记录这些标识符与数字的具体内容），以及诸如 `''(''`、`''*''`
    和 `'')''` 这样的逐字令牌。


    然而，词法分析器在处理如下字符串时同样会感到满意：


    ```

    foo x ( 2 ) x *

    ```


    并将其转换为以下令牌序列：


    ```

    identifier["foo"] identifier["x"] ''(''

    number[2] '')'' identifer["x"] ''*''

    ```


    这显然不是一段合法的 R 代码，但词法分析器并不关心这一点。它仅仅将字符串转换为令牌序列（附带一些相关数据，例如标识符对应的字符串 `"foo"` 与 `"x"`，以及数字对应的值
    `2`）。它不关心语言中更高级的层次。


    当涉及对内嵌语言进行词法分析时，我们受限于该语言所认可的合法令牌。我们不能随意创建各种令牌，因为我们编写的所有内嵌 DSL 都必须同时也是合法的 R 代码。我们能够使用的令牌要么是已有的
    R 令牌，要么是我们定义的具有特殊含义的变量和函数。这通常意味着通过函数调用创建对象，以及定义用于运算符重载的函数。


    一门语言认为合法的令牌串由其**语法**（grammar）定义。¹ **解析器**（parser）负责将令牌序列转换为表达式或语言语句。通常，解析器所做的工作是将令牌串转换为表达式树——通常称为**抽象语法树**（abstract
    syntax tree，AST）。² 相比于原始输入和词法分析结果中简单的线性结构，树形结构为代码赋予了更多的结构性。对于之前我们进行词法分析的那个函数调用，其抽象语法树的一个示例如图
    3-1 所示。在此图中，*斜体*标签指代语法中的句法概念，而 `等宽字体` 标签指代逐字输入文本。令牌以灰色方框显示。如我们所见，这些令牌可以是逐字文本，也可以附带某些语法信息以描述其令牌类型（在此示例中，令牌类型要么是标识符，要么是数字）。当有关联信息时，我选择将其在树中显示为两个节点：一个描述令牌的语法类别（标识符或数字），另一个则是包含实际信息的子节点（本案例中为
    `foo`、`x` 和 `2`）。


    ![A465211_1_En_3_Fig1_HTML.png](img/A465211_1_En_3_Fig1_HTML.png)


    图 3-1 一个具体函数调用的抽象语法树示例


    符合语法规则的语句是解析器认为合法的语句。如果回到自然语言领域，这类句子就是遵循语法规则的句子。这组合法句子的集合与具有某种含义的句子集合是不同的。完全有可能构造出毫无意义但语法正确的句子。语言学家诺姆·乔姆斯基创造的句子“无色的绿色思想狂怒地睡觉”正是这样的例子：它完全符合语法，却又完全无意义。**语义**（semantics）这个术语用于将语法句子与其含义联系起来。当你在编程语言中遇到运行时异常时，就会理解这种区别。如果程序运行时出现异常，说明你构造了一个语法正确的句子——否则解析器会报告语法错误——但该句子在某种其他方面违反了语言规则。一个语法正确的句子并不一定具有明确的含义。例如，将两个变量相加的表达式
    `x + y` 是符合语法的，但如果变量包含两种不兼容的类型（例如 `x` 是字符串而 `y` 是数字），则该句子违反了语言的类型规则。对于编程语言而言，**语义**定义了语句实际描述的计算过程。编译器或解释器——对于
    R 程序而言是后者——为语法正确的语句赋予含义。³


    对于内嵌 DSL 而言，程序的语义是指一旦我们解析了表达式之后，如何对其进行求值。我们不会正式地规定语义或实现解释器，因此对于本书而言，DSL 的语义部分就是普通的
    R 程序。通常，我们使用内嵌 DSL 的目的是作为某个库或框架的接口。正是这个框架的功能性为 DSL 的使用提供了语义；而实际的语言仅仅是与框架交互的接口。

