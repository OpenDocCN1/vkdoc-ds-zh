- fmt: "### Precedence and Evaluation Order\n\nAs soon as we start working with operators,\
    \ their `precedence` becomes important. The syntax for normal function calls makes\
    \ the evaluation order relatively clear—with nested function calls we have inner\
    \ and outer functions in an expression. While that does not give us guarantees\
    \ about which order parameters to a function will be evaluated in, we do know\
    \ that arguments to a function will be evaluated before the function itself is\
    \ evaluated. With operators, the syntax does not tell us in which order functions\
    \ will be called. To know that, we need to know the `precedence` rules.\n\n`Precedence`\
    \ rules tell us the order in which operator functions get called by ordering the\
    \ operators from highest to lowest precedence and by specifying whether operators\
    \ are evaluated from left to right or from right to left. In an expression such\
    \ as this:\n\n```\nx + y * z\n```\n\nwe know that the multiplication, `y * z`,\
    \ is evaluated before the addition, so the expression is equivalent to the following:\n\
    \n```\nx + (y * z)\n```\n\nbecause multiplication has higher precedence than addition.\
    \ With operators at the same level of precedence, we might be less aware of the\
    \ order, but here, the left-to-right or right-to-left order is also guaranteed\
    \ by precedence rules. Of the operators you can overload, only the exponentiation\
    \ operator evaluates right to left, while all the others evaluate left to right.\
    \ Therefore, the following:\n\n```\nx ^ y ^ z\n```\n\nis equivalent to this:\n\
    \n```\nx ^ (y ^ z)\n```\n\nAnd this:\n\n```\nx * y / z\n```\n\nwill be evaluated\
    \ as follows:\n\n```\n(x * y) / z\n```\n\nThe operators you can use are listed,\
    \ from highest to lowest precedence, here:\n\n| Operator | Usual Meaning     \
    \                |\n|----------|-----------------------------------|\n| `[ [[`\
    \   | Indexing                          |\n| `^`      | Exponentiation (evaluates\
    \ right to left) |\n| `- +`    | Unary minus and plus              |\n| `%any%`\
    \  | Special operators                 |\n| `* /`    | Multiply, divide      \
    \            |\n| `+ -`    | Binary add and subtract           |\n| `< >`    |\
    \                                   |\n| `<= >=`  | Ordering and comparison  \
    \         |\n| `== !=`  |                                   |\n| `!`      | Negation\
    \                          |\n| `& &&`   | And                               |\n\
    | `| ||`   | Or                                |\n| `:=`     | Assignment    \
    \                    |\n| `-> ->>` | Assignment                        |\n| `<-\
    \ <<-` | Assignment (right to left)        |\n| `?`      | Help              \
    \                |\n\nOf these, you cannot overload the “arrow” assignment operators,\
    \ only the `:=` operator.\n\nIn the graph specifications language from the previous\
    \ chapter, we could use addition and `%=>%` together because user-defined infix\
    \ operators—those defined using percentages symbols—have higher precedence than\
    \ `+`, so we would construct edges before we would add them to a graph. Using\
    \ `>` and `|` together works for the same reason. Further, because addition (as\
    \ well as logical or) is evaluated from left to right, the `dag()` object we created\
    \ at the beginning of a graph specification would be added to the first edge,\
    \ which would produce another graph that then would be added to the next edge\
    \ and so forth. If the evaluation of addition were right to left, we would be\
    \ adding edges to edges, instead of graphs to edges, which would complicate the\
    \ implementation of the parser.\n\n## Code Blocks\n\nA final syntactical component\
    \ that can be useful when designing a domain-specific language is not an operator\
    \ but the braces that construct a block of code. We cannot overload how these\
    \ are interpreted, but we can certainly find a use for them when we create a new\
    \ language. Before we can exploit them fully, we need to know both how to manipulate\
    \ expressions and how to evaluate them in different contexts—which we cover in\
    \ the next chapter and in Chapter 7—but as a quick example, consider creating\
    \ an index operator that repeats a statement a number of times. We can define\
    \ it this way:\n\n```\n`%times%` <- function(n, body) {\n  body <- substitute(body)\n\
    \  for (i in 1:n)\n    eval(body, parent.frame())\n}\n```\n\nThe following takes\
    \ the `body` argument and changes it to an expression so we can evaluate it repeatedly:\n\
    \n```\nbody <- substitute(body)\n```\n\nIf we did not do this, we would evaluate\
    \ it only the first time we accessed `body`—this is how R’s lazy evaluation works—but\
    \ using `substitute` we can get the verbatim expression out of the argument. To\
    \ evaluate it, we then have to use the `eval` function, and to evaluate it in\
    \ the context where we call the `%times%` operator, we need the calling frame,\
    \ which we get using `parent.frame` (see Chapter 7 for more details on evaluation\
    \ and environments).\n\nThe `body` argument to `%times%` can be a single statement,\
    \ like this:\n\n```\n4 %times% cat(\"foo\\n\")\n## foo\n## foo\n## foo\n## foo\n\
    ```\n\nHowever, since braces (`{}`) are considered expressions as well, we can\
    \ also use a sequence of statements as long as we wrap them in braces.\n\n```\n\
    2 %times% {\n  cat(\"foo\\n\")\n  cat(\"bar\\n\")\n}\n## foo\n## bar\n## foo\n\
    ## bar\n```\n\nBecause we can use braces to pass blocks of code as arguments to\
    \ functions, we can use these to create new control structures, like the `%times%`\
    \ operator shown previously. To fully exploit this, we need to understand how\
    \ we evaluate general expressions in R and how we control the environment in which\
    \ we evaluate them. We also need to parse and manipulate expressions to analyze\
    \ blocks of code and maybe modify them. We will leave further discussion of braces\
    \ until we have covered those topics.\n\nFootnotes:\n\n1.  I am not entirely honest\
    \ here. R has lazy evaluation, so there is no guarantee that arguments to a function\
    \ will be evaluated at all—but if they are, they will be evaluated before we return\
    \ from the function they are arguments to, so conceptually we can think of them\
    \ as being evaluated before we call the function.\n\n2.  The last operator in\
    \ the table, the `:=` assignment operator, is special in the list. It is not really\
    \ an operator that is defined in R. You cannot use it as an assignment operator—for\
    \ that, you should use `<-` or `->`—but the R parser recognizes it as an infix\
    \ operator, which means you can use it when you design a domain-specific language.\n\
    \n# 5. Parsing and Manipulating Expressions\n\nA powerful feature of the R programming\
    \ language is that it readily allows us to treat expressions in the language itself\
    \ as data that we can examine and modify as part of a program—so-called meta-programming.\
    \ From within a program we can take a piece of R code and computationally manipulate\
    \ it before we evaluate it. We need to get hold of the code before it is evaluated,\
    \ and there are several ways to do that. The simplest is to “quote” expressions,\
    \ which leaves them as unevaluated expressions.\n\nIn this chapter, we will use\
    \ the following libraries:\n\n```\nlibrary(purrr)\nlibrary(rlang)\nlibrary(magrittr)\n\
    ```"
  raw: '## Precedence and Evaluation Order


    As soon as we start working with operators, their precedence becomes important.
    The syntax for normal function calls makes the evaluation order relatively clear—with
    nested function calls we have inner and outer functions in an expression. While
    that does not give us guarantees about which order parameters to a function will
    be evaluated in, we do know that arguments to a function will be evaluated before
    the function itself is evaluated.[¹](#A465211_1_En_4_Chapter.html#Fn1) With operators,
    the syntax does not tell us in which order functions will be called. To know that,
    we need to know the precedence rules.


    Precedence rules tell us the order in which operator functions get called by ordering
    the operators from highest to lowest precedence and by specifying whether operators
    are evaluated from left to right or from right to left. In an expression such
    as this:


    ```

    x + y * z

    ```


    we know that the multiplication, `y * z`, is evaluated before the addition, so
    the expression is equivalent to the following:


    ```

    x + (y * z)

    ```


    because multiplication has higher precedence than addition. With operators at
    the same level of precedence, we might be less aware of the order, but here, the
    left-to-right or right-to-left order is also guaranteed by precedence rules. Of
    the operators you can overload, only the exponentiation operator evaluates right
    to left, while all the others evaluate left to right. Therefore, the following:


    ```

    x ^ y ^ z

    ```


    is equivalent to this:


    ```

    x ^ (y ^ z)

    ```


    And this:


    ```

    x * y / z

    ```


    will be evaluated as follows:


    ```

    (x * y) / z

    ```


    The operators you can use are listed, from highest to lowest precedence, here:


    | Operator | Usual Meaning |

    | --- | --- |

    | [ [[ | Indexing |

    | ^ | Exponentiation (evaluates right to left) |

    | - + | Unary minus and plus |

    | %any% | Special operators |

    | * / | Multiply, divide |

    | + - | Binary add and subtract |

    | < > |   |

    | <= >= | Ordering and comparison |

    | == != |   |

    | ! | Negation |

    | & && | And |

    | &#124; &#124;&#124; | Or |

    | := | Assignment |

    | -> ->> | Assignment |

    | <- <<- | Assignment (right to left) |

    | ? | Help |


    Of these, you cannot overload the “arrow” assignment operators, only the `:=`
    operator.[²](#A465211_1_En_4_Chapter.html#Fn2)


    In the graph specifications language from the previous chapter, we could use addition
    and `%=>%` together because user-defined infix operators—those defined using percentages
    symbols—have higher precedence than `+`, so we would construct edges before we
    would add them to a graph. Using `>` and `|` together works for the same reason.
    Further, because addition (as well as logical or) is evaluated from left to right,
    the `dag()` object we created at the beginning of a graph specification would
    be added to the first edge, which would produce another graph that then would
    be added to the next edge and so forth. If the evaluation of addition were right
    to left, we would be adding edges to edges, instead of graphs to edges, which
    would complicate the implementation of the parser.


    ## Code Blocks


    A final syntactical component that can be useful when designing a domain-specific
    language is not an operator but the braces that construct a block of code. We
    cannot overload how these are interpreted, but we can certainly find a use for
    them when we create a new language. Before we can exploit them fully, we need
    to know both how to manipulate expressions and how to evaluate them in different
    contexts—which we cover in the next chapter and in Chapter [7](#A465211_1_En_7_Chapter.html)—but
    as a quick example, consider creating an index operator that repeats a statement
    a number of times. We can define it this way:


    ```

    `%times%` <- function(n, body) {

    body <- substitute(body)

    for (i in 1:n)

    eval(body, parent.frame())

    }

    ```


    The following takes the `body` argument and changes it to an expression so we
    can evaluate it repeatedly:


    ```

    body <- substitute(body)

    ```


    If we did not do this, we would evaluate it only the first time we accessed `body`—this
    is how R’s lazy evaluation works—but using `substitute` we can get the verbatim
    expression out of the argument. To evaluate it, we then have to use the `eval`
    function, and to evaluate it in the context where we call the `%times%` operator,
    we need the calling frame, which we get using `parent.frame` (see Chapter [7](#A465211_1_En_7_Chapter.html)
    for more details on evaluation and environments).


    The `body` argument to `%times%` can be a single statement, like this:


    ```

    4 %times% cat("foo\n")

    ## foo

    ## foo

    ## foo

    ## foo

    ```


    However, since braces (`{}`) are considered expressions as well, we can also use
    a sequence of statements as long as we wrap them in braces.


    ```

    2 %times% {

    cat("foo\n")

    cat("bar\n")

    }

    ## foo

    ## bar

    ## foo

    ## bar

    ```


    Because we can use braces to pass blocks of code as arguments to functions, we
    can use these to create new control structures, like the `%times%` operator shown
    previously. To fully exploit this, we need to understand how we evaluate general
    expressions in R and how we control the environment in which we evaluate them.
    We also need to parse and manipulate expressions to analyze blocks of code and
    maybe modify them. We will leave further discussion of braces until we have covered
    those topics.


    Footnotes [1](#A465211_1_En_4_Chapter.html#Fn1_source)


    I am not entirely honest here. R has lazy evaluation, so there is no guarantee
    that arguments to a function will be evaluated at all—but if they are, they will
    be evaluated before we return from the function they are arguments to, so conceptually
    we can think of them as being evaluated before we call the function.


      [2](#A465211_1_En_4_Chapter.html#Fn2_source)


    The last operator in the table, the := assignment operator, is special in the
    list. It is not really an operator that is defined in R. You cannot use it as
    an assignment operator—for that, you should use <- or ->—but the R parser recognizes
    it as an infix operator, which means you can use it when you design a domain-specific
    language.


    # 5. Parsing and Manipulating Expressions


    A powerful feature of the R programming language is that it readily allows us
    to treat expressions in the language itself as data that we can examine and modify
    as part of a program—so-called meta-programming. From within a program we can
    take a piece of R code and computationally manipulate it before we evaluate it.
    We need to get hold of the code before it is evaluated, and there are several
    ways to do that. The simplest is to “quote” expressions, which leaves them as
    unevaluated expressions.


    In this chapter, we will use the following libraries:


    ```

    library(purrr)

    library(rlang)

    library(magrittr)

    ```'
  trans: "\n### 优先级和求值顺序\n\n一旦我们开始使用运算符，它们的`优先级`就变得重要起来。常规函数调用的语法使得求值顺序相对清晰——在嵌套函数调用中，表达式里有内部函数和外部函数。虽然这并不能保证函数参数的求值顺序，但我们确实知道，函数自身的求值会在其参数求值之后进行。对于运算符，语法并未告知我们函数的调用顺序。要了解这一点，我们需要知道`优先级`规则。\n\
    \n`优先级`规则通过将运算符从高到低排序，并指定运算符是**从左到右**还是**从右到左**求值，来告诉我们运算符函数的调用顺序。在像这样的表达式中：\n\
    \n```\nx + y * z\n```\n\n我们知道乘法 `y * z` 会在加法之前求值，因此该表达式等价于：\n\n```\nx + (y * z)\n\
    ```\n\n因为乘法优先级高于加法。对于优先级相同的运算符，我们可能不太清楚求值顺序，但在这里，从左到右或从右到左的顺序同样由优先级规则保证。在你可以重载的运算符中，只有指数运算符是从右向左求值的，其他所有运算符都是从左向右求值。因此，下面的表达式：\n\
    \n```\nx ^ y ^ z\n```\n\n等价于：\n\n```\nx ^ (y ^ z)\n```\n\n而下面的表达式：\n\n```\nx *\
    \ y / z\n```\n\n将按如下方式求值：\n\n```\n(x * y) / z\n```\n\n你可以使用的运算符，按从高到低的优先级列出如下：\n\
    \n| 运算符         | 通常含义                              |\n|----------------|---------------------------------------|\n\
    | `[ [[`         | 索引                                  |\n| `^`            | 指数运算（从右向左求值）\
    \              |\n| `- +`          | 一元减号和加号                        |\n| `%any%`\
    \        | 特殊运算符                            |\n| `* /`          | 乘法、除法      \
    \                      |\n| `+ -`          | 二元加法和减法                        |\n\
    | `< >`          |                                       |\n| `<= >=`        |\
    \ 排序和比较                            |\n| `== !=`        |                     \
    \                  |\n| `!`            | 逻辑非                                |\n\
    | `& &&`         | 逻辑与                                |\n| `| ||`         | 逻辑或\
    \                                |\n| `:=`           | 赋值                    \
    \              |\n| `-> ->>`       | 赋值                                  |\n|\
    \ `<- <<-`       | 赋值（从右向左）                      |\n| `?`            | 帮助    \
    \                              |\n\n其中，你不能重载“箭头”赋值运算符，只能重载`:=`运算符。\n\n在上一章的图形规范语言中，我们可以同时使用加法和`%=>%`，因为用户定义的中缀运算符——那些使用百分号定义的运算符——优先级高于`+`，所以我们可以在将边添加到图之前先构建边。出于同样的原因，同时使用`>`和`|`也是可行的。此外，由于加法（以及逻辑或）是从左向右求值的，在图形规范开头创建的`dag()`对象会被添加到第一条边上，这会生成另一个图，然后该图再被添加到下一条边上，以此类推。如果加法的求值顺序是从右向左，我们就会把边添加到边上，而不是将图添加到边上，这会使解析器的实现变得复杂。\n\
    \n## 代码块\n\n在设计领域特定语言时，一个可能有用的最终语法组件不是运算符，而是用于构造代码块的花括号。我们不能重载这些花括号的解释方式，但在创建新语言时，我们当然可以为它们找到用途。在完全利用它们之前，我们需要知道如何操作表达式以及如何在不同的上下文中对它们求值——我们将在下一章和第\
    \ 7 章中介绍这些内容——但作为一个快速的例子，考虑创建一个重复执行某个语句若干次的索引运算符。我们可以这样定义它：\n\n```\n`%times%`\
    \ <- function(n, body) {\n  body <- substitute(body)\n  for (i in 1:n)\n    eval(body,\
    \ parent.frame())\n}\n```\n\n下面的代码将`body`参数转换成一个表达式，以便我们可以重复求值：\n\n```\nbody <-\
    \ substitute(body)\n```\n\n如果我们不这样做，我们只会在第一次访问`body`时对其进行求值——这就是 R 语言惰性求值的工作原理——但使用`substitute`，我们可以从参数中获取逐字的表达式。要对其求值，我们必须使用`eval`函数，并且要在调用`%times%`运算符的上下文中求值，我们需要调用框架，这可以通过`parent.frame`获得（关于求值和环境的更多细节，请参见第\
    \ 7 章）。\n\n`%times%`的`body`参数可以是单个语句，如下所示：\n\n```\n4 %times% cat(\"foo\\n\")\n\
    ## foo\n## foo\n## foo\n## foo\n```\n\n然而，由于花括号（`{}`）也被视为表达式，我们也可以使用一系列语句，只要将它们包裹在花括号中即可。\n\
    \n```\n2 %times% {\n  cat(\"foo\\n\")\n  cat(\"bar\\n\")\n}\n## foo\n## bar\n\
    ## foo\n## bar\n```\n\n因为我们可以使用花括号将代码块作为参数传递给函数，所以我们可以利用花括号来创建新的控制结构，比如前面展示的`%times%`运算符。为了充分利用这一点，我们需要了解如何在\
    \ R 中求值一般表达式，以及如何控制我们求值的环境。我们还需要解析和操作表达式，以便分析代码块，甚至可能修改它们。我们将把对花括号的进一步讨论留到我们涵盖这些主题之后。\n\
    \n脚注：\n\n1.  我在这里并不完全诚实。R 语言有惰性求值机制，因此不能保证函数参数一定会被求值——但如果它们被求值，它们会在我们返回其所属的函数之前被求值，所以从概念上讲，我们可以认为它们是在调用函数之前被求值的。\n\
    \n2.  表中的最后一个运算符`:=`赋值运算符，在列表中比较特殊。它并不是 R 中真正定义的运算符。你不能将它用作赋值运算符——为此，你应该使用`<-`或`->`——但\
    \ R 解析器将其识别为中缀运算符，这意味着你在设计领域特定语言时可以使用它。\n\n# 5. 解析和操作表达式\n\nR 编程语言的一个强大特性是，它允许我们将语言本身的表达式视为数据，作为程序的一部分进行检查和修改——即所谓的元编程。在程序中，我们可以获取一段\
    \ R 代码，在对它求值之前进行程序化操作。我们需要在代码被求值之前获取它，有几种方法可以实现。最简单的方法是“引用”表达式，这会使表达式保持未求值状态。\n\
    \n在本章中，我们将使用以下库：\n\n```\nlibrary(purrr)\nlibrary(rlang)\nlibrary(magrittr)\n```\n"
- fmt: '## Quoting and Evaluating


    If you write an expression such as the following, R will immediately try to evaluate
    it:


    ```

    2 * x + y

    ```


    It will look for the variables `x` and `y` in the current scope, and if it finds
    them, it will evaluate the expression; if it does not, it will report an error.
    By the time R has evaluated the expression, we have either a value or an error.
    If it is the former, the expression is essentially equivalent to the result of
    evaluating the expression (computation time notwithstanding). A literate expression
    as this one is not something we can get a hold on to in a program—we get either
    an error or the value the expression evaluates to. If we want to get hold of the
    actual expression, we need to “quote” it. If we wrap the expression in a call
    to the function `quote`, then we prevent the evaluation of the expression and
    instead get a data structure that represents the unevaluated expression.


    ```

    quote(2 * x + y)

    ## 2 * x + y

    ```


    The class of an expression is a “call.”


    ```

    expr <- quote(2 * x + y)

    class(expr)

    ## [1] "call"

    ```


    It is a call because infix operators are syntactic sugar for function calls, and
    all function call expressions will have this type. For “call” objects, we can
    get their components by indexing as we would a list. The first element will be
    the function name, and the remaining elements will be the arguments to the function
    call. For binary operators, of course, there will be two arguments.


    For this expression, the function call is an addition:


    ```

    expr[[1]]

    ## `+`

    expr[[2]]

    ## 2 * x

    expr[[3]]

    ## y

    ```


    It is an addition because multiplication has higher precedence than addition,
    so the expression is equivalent to the following:


    ```

    (2 * x) + y

    ```


    This is because the multination is nested deeper in the expression than the addition.
    The multiplication can be accessed as the first argument to the addition call,
    so the second element in the object is as follows:


    ```

    expr[[2]][[1]]

    ## `*`

    expr[[2]][[2]]

    ## [1] 2

    expr[[2]][[3]]

    ## x

    ```


    To evaluate a quoted expression, we can use the function `eval`. The following
    expression:


    ```

    eval(quote(2 * x + y))

    ```


    is equivalent to writing the literate expression shown here:


    ```

    2 * x + y

    ```


    The `eval` function provides more flexibility in how an expression is evaluated
    since we can modify the scope of the evaluation, something we return to in more
    detail in Chapter [7](#A465211_1_En_7_Chapter.html).


    Combining quoted expressions and functions introduces additional complications,
    at least if we want to handle the quoting within a function call. We can, however,
    pass quoted expressions as parameters to a function, as shown here:


    ```

    f <- function(expr) expr[[1]]

    f(quote(2 * x + y))

    ## `+`

    ```


    However, it gets more complicated if we want to provide the literate expression
    to the function.


    ```

    f(2 * x + y)

    ## Error in f(2 * x + y): object ''x'' not found

    ```


    In the function `f`, when we return `expr[[1]]`, R will first attempt to evaluate
    the expression, but the expression depends on the variables `x` and `y`, which
    are undefined. Even if we define `x` and `y`, we still do not get a “call” object
    that we can manipulate. We get the result of evaluating the expression.


    ```

    x <- 2

    y <- 3

    f(2 * x + y)

    ## [1] 7

    ```


    Using `quote` inside the function doesn’t help us. If we write `quote(expr)` ,
    we get the expression `expr`—a single symbol—as a result, not the argument we
    give to `f`.


    ```

    f <- function(expr) {

    expr <- quote(expr)

    expr[[1]]

    }

    f(2 * x + y)

    ## Error in expr[[1]]: object of type ''symbol'' is not subsettable

    ```


    To get the actual argument as a quoted expression, we need to use the function
    `substitute` .


    ```

    f <- function(expr) {

    expr <- substitute(expr)

    expr[[1]]

    }

    f(2 * x + y)

    ## `+`

    ```


    Two things come together to make this work. First, function arguments in R are
    lazily evaluated, so the `expr` argument is never evaluated if we do not use it
    in an expression. So, even though `x` and `y` are not defined, we do not get any
    errors as long as we do not evaluate the argument to `f`. Second, `substitute`
    does not evaluate its argument, but it returns a quoted object where variables
    are replaced with the value they have in the current scope.[¹](#A465211_1_En_5_Chapter.html#Fn1)
    The argument to `substitute` does not have to be a single variable name. It can
    be any expression that will be considered quoted after which variable substitution
    is done, and the return value will be the modified quoted expression.


    ```

    f <- function(expr) {

    expr <- substitute(expr + expr)

    expr

    }

    f(2 * x + y)

    ## 2 * x + y + (2 * x + y)

    ```


    Another complication appears if we attempt to evaluate a quoted expression inside
    a function. You might expect these two functions to be equivalent since `eval(quote(expr))`
    should be the same as `expr` , but they are not equivalent.


    ```

    f <- function(expr) {

    expr + expr

    }

    g <- function(expr) {

    x <- substitute(expr + expr)

    eval(x)

    }

    ```


    If we make sure that both `x` and `y` are defined, then the function `f` returns
    twice the value of the expression.


    ```

    x <- 2; y <- 3

    f(2 * x + y)

    ## [1] 14

    ```


    Function `g`, on the other hand, raises an error because the type of `x` is incorrect.


    ```

    g(2 * x + y)

    ## Error in 2 * x: non-numeric argument to binary operator

    ```


    By default, the eval function will evaluate an expression in the current scope,
    which inside a function will be that function’s evaluation environment. Inside
    `g`, we have defined `x` to be the expression we get from the call to `substitute`
    , so it is this `x` that is seen by `eval`. If you want `eval` to evaluate an
    expression in another scope, you need to give it an environment as a second argument.
    If you want it to evaluate the expression in the scope where the function is called,
    rather than inside the function scope itself, then you can get that using the
    `parent.frame` function.


    ```

    g <- function(expr) {

    x <- substitute(expr + expr)

    eval(x, parent.frame())

    }

    g(2 * x + y)

    ## [1] 14

    ```


    We will discuss environments, scopes, and how expressions are evaluated in more
    detail in Chapter [7](#A465211_1_En_7_Chapter.html). For the remainder of this
    chapter, we will focus on manipulating expressions and not on evaluating them.'
