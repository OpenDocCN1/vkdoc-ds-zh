    \n```\nfilter_on_na <- function(df, column) {\n  column <- substitute(column)\n\
    \  df %>% dplyr::filter(!is.na(column))\n}\ndf %>% filter_on_na(x)\n## Warning\
    \ in is.na(column): is.na() applied to non-\n## (list or vector) of type 'symbol'\n\
    ## # A tibble: 7 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n\
    ## 2    NA     2\n## 3     3     3\n## 4     4    NA\n## 5     5     5\n## 6 \
    \   NA     6\n## 7     7    NA\n```\n\n我们使用`substitute`将列名转换为符号，然后应用`filter`管道。当然，它不起作用，原因是`filter`也执行非标准求值，并将谓词`!is.na(column)`直接当作表达式处理。所以，它需要知道变量`column`。现在，由于`filter`将其参数当作`quosure`求值，它可以找到变量`column`，但它发现这是一个符号——在本例中，它是符号`x`——但这并不是我们想要它看到的内容。我们想让`filter`看到列`x`，但这并不是`filter`的工作方式。\n\
    \n我们想要做的是将变量`column`中持有的符号替换到`filter`所看到的表达式（`quosure`）中。我们可以通过“砰-砰”（bang-bang）操作符`!!`来实现。\n\
    \n```\nfilter_on_na <- function(df, column) {\n  column <- rlang::enexpr(column)\n\
    \  df %>% dplyr::filter(!is.na(!!column))\n}\ndf %>% filter_on_na(x)\n## # A tibble:\
    \ 5 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n## 2     3   \
    \  3\n## 3     4    NA\n## 4     5     5\n## 5     7    NA\ndf %>% filter_on_na(y)\n\
    ## # A tibble: 5 x 2\n##       x     y\n##    <dbl> <dbl>\n## 1     1     1\n\
    ## 2    NA     2\n## 3     3     3\n## 4     5     5\n## 5    NA     6\n```\n\n\
    这个操作符对其后面的表达式进行“反引用”（unquote），求值并将结果插入到`filter`看到的引用表达式中。所以，是将变量`column`的值（而不是符号`column`）插入到`!is.na(!!column)`中。\n\
    \n你可能已经注意到，我使用了另一个函数`rlang::enexpr`来创建引用的列名。在`rlang`包中，有两个函数的行为类似于`quote`和`substitute`，它们创建裸表达式，但允许使用`!!`操作符进行准引用，这是`substitute`和`quote`所不具备的。考虑如下定义的函数`f`和`g`：\n\
    \n```\nf <- function(x) substitute(x)\ng <- function(x) rlang::enexpr(x)\n```\n\
    \n当直接调用时，两者都会返回作为参数`x`传入的表达式，但考虑从另一个函数`h`中调用它们的情况，我们希望在`h`中将其参数值替换为`f`或`g`的参数`x`。\n"
- fmt: "```r\nh <- function(func, var) func(!!var)\nh(f, quote(x))\n## !(!var)\nh(g,\
    \ quote(x))\n## x\n```\n\n在`f`中，当我们使用`substitute`时，我们得到表达式`!!var`返回，但在函数`g`中，当我们使用`enexpr`时，替换完成并得到了期望的结果`x`。\n\
    \n函数`enexpr`的工作方式类似于`enquo`，将函数参数转换为表达式，但它会将它们转换为裸表达式而不是 quosure。作为`quo`的类比——它直接接收表达式并创建\
    \ quosure——我们有`expr`，它创建一个裸表达式（类似`quote`），但允许准引用。\n\n```r\nx \n##   expr: ^2 *\
    \ x + 1\n##   env:  global\n```\n\n使用 bang-bang 操作符时需要格外小心，具体取决于您使用的`rlang`包版本。它由取反操作符`!`构建而成，其优先级较低。唯一优先级更低的操作符是逻辑操作符和赋值操作符。这意味着，如果您试图在表达式`x\
    \ + y`中对`x`进行反引用，那么如果您简单地写成`!!x + y`，实际上可能是对整个表达式进行反引用。只有当表达式中使用的操作符是逻辑操作符时，`!!`才会绑定到`x`。\n\
    \n如果您尝试评估这个表达式，您将看到您使用的是旧版本还是新版本的包。如果您使用的是旧版本，由于`!`的优先级低于`+`，第一个表达式将评估`x + y`；如果您使用的是较新版本的`rlang`，那么只有`x`的值会被替换到表达式中。\n\
    \n```r\nx <- y <- 2\nrlang::expr(!!x + y)\n## 2 + y\n```\n\n该包的最新版本（撰写本文时）已解决了此问题；它不依赖\
    \ R 的优先级规则，而是会在评估未引用表达式之前检查表达式，并赋予 bang-bang 操作符比取反操作符更紧密的优先级。然而，如果您没有最新版本的包，您可以使用括号或使用反引用的函数变体`UQ`来绕过此问题。\n\
    \n```r\nrlang::expr(UQ(x) + y)\n## 2 + y\n```\n\n当我们将函数参数转换为表达式（使用`enexpr`）或 quosure（使用`enquo`）时，bang-bang\
    \ 操作符或`UQ`函数会将表达式的结果替换到我们创建的表达式/quosure 中，这就是第二个`filter_on_na`函数起作用的原因。\n\n您也可以在函数调用的命名参数左侧进行反引用，但\
    \ R 解析器不允许编写如下代码：\n\n```r\nf(UQ(var) = expr)\n```\n\n这是因为函数调用参数左侧必须是符号。为解决此问题，`rlang`包提供了`:=`操作符的实现，它允许此类赋值。考虑以下示例：\n\
    \n```r\nf % mutate(UQ(summary_name) := UQ(summary_expr))\n}\ntibble(x = 1:4, y\
    \ = 1:4) %>% f(z, x + y)\n## # A tibble: 4 x 3\n##       x     y     z\n##   \
    \  \n## 1     1     1     2\n## 2     2     2     4\n## 3     3     3     6\n\
    ## 4     4     4     8\n```\n\n以下命名函数调用：\n\n```r\ndf %>% mutate(UQ(summary_name)\
    \ := UQ(summary_expr))\n```\n\n在准引用替换完成后，其行为类似于带有命名参数的常规函数调用。\n\n您必须了解的最后一个准引用函数是`UQS`。该函数的行为类似于`UQ`，它会评估其参数并将结果放入引用表达式中，但其目的是将一组\
    \ quosure 拼接（splice）到函数调用中。\n\n考虑这个示例：\n\n```r\nargs <- rlang::quos(x = 1, y =\
    \ 2)\nq <- rlang::expr(f(rlang::UQS(args)))\nq\n## f(x = ~1, y = ~2)\n```\n\n\
    在这里，我们为参数`x`和`y`创建了一组 quosure，并创建了一个表达式来调用带有这些参数的函数`f`。`UQS`函数的作用就是将参数拼接到函数调用的表达式中。如果使用`UQ`，我们会得到不同的表达式。\n\
    \n```r\nq <- rlang::expr(f(rlang::UQ(args)))\nq\n## f(list(x = ~1, y = ~2))\n\
    ```\n\n与`UQ`类似，`UQS`也有一个操作符版本——三重感叹号操作符：`!!!`。\n\n```r\nq <- rlang::expr(f(!!!args))\n\
    q\n## f(x = ~1, y = ~2)\n```\n\n为了观察`UQS`的实际应用，我们再考虑一个玩具示例。我们编写一个函数，用于在给定数据框的情况下计算表达式的均值。假设我们希望遍历多个数据框并计算同一个表达式的均值（或类似操作）。为此，我们构建一个函数，该函数将我们捕获为\
    \ quosure 的表达式进行评估，并计算该表达式在数据框中的均值，同时使用额外的参数来修改对`mean`的调用。\n\n```r\nmean_expr\
    \ <- function(ex, ...) {\nex <- rlang::enquo(ex)\nextra_args <- rlang::dots_list(...)\n\
    mean_call <- rlang::expr(with(\ndata,\nmean(!!rlang::get_expr(ex), !!!extra_args))\n\
    )\nrlang::new_function(args = alist(data=),\nbody = mean_call,\nenv = rlang::get_env(ex))\n\
    }\nmean_sum <- mean_expr(x + y, na.rm = TRUE)\nmean_sum\n## function (data)\n\
    ## with(data, mean(x + y, na.rm = TRUE))\n```\n\n这里有几个值得注意的新特性。我们使用`dots_list`来评估`...`参数中的参数。我们也可以通过其他方式处理，但我们的目的既不是让它们被延迟评估，又是要获取一个列表作为对`mean`调用的额外参数。我们从`ex`参数创建了一个表达式。这里，我们将`ex`中的裸表达式包装在一个涉及`with`函数的表达式中，以包含数据框形式的数据。我们使用`!!!`操作符将额外的参数拼接到对`mean`的调用中。然后，我们构建一个新函数，它接受一个参数`data`；在其函数体中评估`with(mean(...))`表达式；并且评估作用域为`ex`定义时的环境。\n\
    \n我们可以使用之前创建的数据框来测试它：\n\n```r\ndf\n## # A tibble: 7 x 2\n##       x     y\n##\
    \    \n## 1    1\\.    1.\n## 2   NA     2.\n## 3    3\\.    3.\n## 4    4\\.\
    \   NA\n## 5    5\\.    5.\n## 6   NA     6.\n## 7    7\\.   NA\nmean_sum(df)\n\
    ## [1] 6\n```\n\n为了验证我们评估表达式的环境正是它被定义的环境，我们可以编写一个函数在局部作用域中捕获一个参数，并观察在调用均值函数时该作用域仍然可用。\n\
    \n```r\nf \ng(df)\n## [1] 9\n```\n\n使用 quosures 和准引号会增加您在非标准评估中跟踪环境时可能遇到的问题。我强烈建议您使用这些方法，而不是使用原始的\
    \ R 函数`quote`和`substitute`。但是，它们并不能解决何时引用参数以及何时调用将参数转换为表达式的函数这一决策问题。如果您从一个已经引用了参数的函数中调用一个使用`enquo`的函数，那么您将得到双重引用的结果。\n\
    \n```r\nf \n##   expr: ^x + y\n##   env:  global\ng(x + y)\n## \n##   expr: ^rlang::enquo(expr)\n\
    ##   env:  0x7f9b016be9c8\nrlang::eval_tidy(f(x + y), list(x = 1, y = 2))\n##\
    \ [1] 3\nrlang::eval_tidy(g(x + y), list(x = 1, y = 2))\n## \n##   expr: ^x +\
    \ y\n##   env:  global\n```\n\n这里的解决方案与之前相同：如果您需要使用已经引用的表达式来调用函数，请创建两个版本——一个期望其参数被引用，另一个则为您完成引用。"
  raw: "```\nh <- function(func, var) func(!!var)\nh(f, quote(x))\n## !(!var)\nh(g,\
    \ quote(x))\n## x\n```\n\nIn `f`, where we use `substitute`, we get the expression\
    \ `!!var` back, but in function `g`, where we use `enexpr`, we get the substitution\
    \ done and get the desired result `x`.\n\nThe function `enexpr` works like `enquo`\
    \ to translate function parameters into expressions, but it translates them into\
    \ bare expressions rather than quosures. As the analog to `quo`, which takes an\
    \ expression directly and creates a quosure, we have `expr`, which creates a bare\
    \ expression—like `quote`—but allows quasi-quotation.\n\n```\nx \n##   expr: ^2\
    \ * x + 1\n##   env:  global\n```\n\nYou have to be a little bit careful when\
    \ using the bang-bang operator, depending on which version of the `rlang` package\
    \ you use. It is built from the negation operator, `!`, which has a low precedence.\
    \ The only operators with lower precedence are the logical operators and assignments.\
    \ This means if you try to unquote `x` in the expression `x + y`, you might, in\
    \ fact, be unquoting the entire expression if you simply write `!!x + y`. You\
    \ only get `!!` bound to `x` if the operator you use in the expression is a logical\
    \ operator.\n\nIf you try to evaluate this express, you will see whether you have\
    \ an old version or a new version of the package. If you have an old version,\
    \ the first expression will evaluate `x + y` since `!` has lower precedence than\
    \ `+`; if you have a newer version of `rlang`, then only the value of `x` will\
    \ be substitute into the expression.\n\n```\nx <- y <- 2\nrlang::expr(!!x + y)\n\
    ## 2 + y\n```\n\nThe most recent version of the package, at the time of writing,\
    \ has resolved this; instead of relying on R’s precedence rules, it will examine\
    \ the expression before it evaluates unquoted expressions, and it gives the bang-bang\
    \ operator a much tighter precedence than the negation operator has. If you do\
    \ not have the latest version of the package, however, you can get around this\
    \ problem using parentheses, or you can use the function-variant of unquoting,\
    \ `UQ`.\n\n```\nrlang::expr(UQ(x) + y)\n## 2 + y\n```\n\nWhen we translate a function\
    \ argument into an expression, with `enexpr` , or a quosure, with `enquo`, the\
    \ bang-bang operator or the `UQ` function will substitute the results of expressions\
    \ into the expressions/quosures we create, which is why the second `filter_on_na`\
    \ function worked.\n\nYou can unquote on the left-hand side of named parameters\
    \ in function calls as well, but the R parser does not allow you to write code\
    \ such as this:\n\n```\nf(UQ(var) = expr)\n```\n\nThis is because the left-hand\
    \ side in function call arguments must be symbols. To get around this problem,\
    \ the `rlang` package provides an implementation of the `:=` operator that does\
    \ allow such assignments. Consider the following:\n\n```\nf % mutate(UQ(summary_name)\
    \ := UQ(summary_expr))\n}\ntibble(x = 1:4, y = 1:4) %>% f(z, x + y)\n## # A tibble:\
    \ 4 x 3\n##       x     y     z\n##     \n## 1     1     1     2\n## 2     2 \
    \    2     4\n## 3     3     3     6\n## 4     4     4     8\n```\n\nThe named\
    \ function call in the following:\n\n```\ndf %>% mutate(UQ(summary_name) := UQ(summary_expr))\n\
    ```\n\nbehaves like a usual function call with named parameters after the quasi-quotation\
    \ substitution has taken place.\n\nA final quasi-quotation function you must know\
    \ is `UQS`. This function behaves as `UQ` in that it evaluates its arguments and\
    \ puts the result into a quoted expression, but it is intended for splicing a\
    \ list of quosures into a function call.\n\nConsider this example:\n\n```\nargs\
    \ <- rlang::quos(x = 1, y = 2)\nq <- rlang::expr(f(rlang::UQS(args)))\nq\n## f(x\
    \ = ~1, y = ~2)\n```\n\nHere, we create a list of quosures for arguments `x` and\
    \ `y` and create an expression that calls the function `f` with these arguments.\
    \ The `UQS` function is what splices the arguments into the expression for the\
    \ function call. Using `UQ`, we would get a different expression.\n\n```\nq <-\
    \ rlang::expr(f(rlang::UQ(args)))\nq\n## f(list(x = ~1, y = ~2))\n```\n\nAs for\
    \ `UQ`, though, there is an operator version of `UQS`, the triple-bang operator:\
    \ `!!!`.\n\n```\nq <- rlang::expr(f(!!!args))\nq\n## f(x = ~1, y = ~2)\n```\n\n\
    To see `UQS` in action, we consider another toy example. We write a function for\
    \ evaluating the mean of an expression given a data frame. Imagine that we want\
    \ to map over several data frames and compute the mean of the same expression\
    \ or something like that. We construct a function for this that evaluates an expression\
    \ we capture as a quosure and computes the mean of the expression in a data frame,\
    \ using additional arguments to modify the call to `mean`.\n\n```\nmean_expr <-\
    \ function(ex, ...) {\nex <- rlang::enquo(ex)\nextra_args <- rlang::dots_list(...)\n\
    mean_call <- rlang::expr(with(\ndata,\nmean(!!rlang::get_expr(ex), !!!extra_args))\n\
    )\nrlang::new_function(args = alist(data=),\nbody = mean_call,\nenv = rlang::get_env(ex))\n\
    }\nmean_sum <- mean_expr(x + y, na.rm = TRUE)\nmean_sum\n## function (data)\n\
    ## with(data, mean(x + y, na.rm = TRUE))\n```\n\nThere are a few new things to\
    \ observe here. We use `dots_list` to evaluate the arguments in the `...` parameter.\
    \ We could deal with this in other ways, but we don’t necessarily want them to\
    \ be evaluated lazily, and we just want a list to use as extra arguments to a\
    \ call to `mean`. We create an expression from the `ex` parameter. Here, we wrap\
    \ the bare expression in `ex` inside an expression that involves the `with` function\
    \ to include data in the form of a data frame. We use the `!!!` operator to splice\
    \ the additional parameters into the call to `mean`. We then construct a new function\
    \ that takes a single argument, `data`; evaluates the `with(mean(...))` expression\
    \ in its body; and is evaluated in the scope where `ex` was defined.\n\nWe can\
    \ test it with the data frame we created earlier:\n\n```\ndf\n## # A tibble: 7\
    \ x 2\n##       x     y\n##    \n## 1    1\\.    1.\n## 2   NA     2.\n## 3  \
    \  3\\.    3.\n## 4    4\\.   NA\n## 5    5\\.    5.\n## 6   NA     6.\n## 7 \
    \   7\\.   NA\nmean_sum(df)\n## [1] 6\n```\n\nTo see that the environment we evaluated\
    \ the expression in is where it was defined, we can write a function to capture\
    \ a parameter in a local scope and see that this scope is available when we call\
    \ the mean function.\n\n```\nf \ng(df)\n## [1] 9\n```\n\nUsing quosures and quasi-quotes\
    \ adds to the problems you can have with keeping track of environments for non-standard\
    \ evaluation. I strongly suggest you use these instead of the bare R `quote` and\
    \ `substitute` approach. They do not, however, fix the problem with deciding when\
    \ to quote arguments and with calling functions that translate arguments into\
    \ expressions. If you call a function that uses `enquo` from a function where\
    \ you have already quoted the argument, then you get it double-quoted.\n\n```\n\
    f \n##   expr: ^x + y\n##   env:  global\ng(x + y)\n## \n##   expr: ^rlang::enquo(expr)\n\
    ##   env:  0x7f9b016be9c8\nrlang::eval_tidy(f(x + y), list(x = 1, y = 2))\n##\
    \ [1] 3\nrlang::eval_tidy(g(x + y), list(x = 1, y = 2))\n## \n##   expr: ^x +\
    \ y\n##   env:  global\n```\n\nHere, the solution is as before: if you need to\
    \ call functions with already quoted expressions, make two versions—one that expects\
    \ its argument to be quoted and one that does it for you."
