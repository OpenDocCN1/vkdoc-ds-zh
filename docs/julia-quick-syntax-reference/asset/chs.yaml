  \ | v0.9.4 |\n\n本章旨在介绍一些主题，这些主题虽然可能并非严格必要，但对于以高效方式编写高效代码（即运行速度快且易于（并有趣地）编写的代码）却非常重要。\n\
  \n我首先讨论代码性能，然后转向并行化以进一步加速执行。接着，我继续讨论允许开发者检查程序是否遵循预期行为并便于早期错误定位的工具。最后，我将介绍可用于隔离并可能纠正运行时出现问题的构造。\n\
