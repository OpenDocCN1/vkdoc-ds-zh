- "# 第 3 章 控制流与函数\n\n现在你已经了解了 Julia 中可用的主要类型和容器，是时候让它们发挥作用了。\n\n#### 3.1 代码块结构与变量作用域\n\
  \n所有典型的流程控制结构（`for`、`while`、`if/else` 和 `do`）都得到支持。其语法通常采用以下形式：\n\n```\n<关键字> <条件>\n\
  ... 块内容...\nend\n```\n\n例如：\n\n```\nfor i in 1:5\n    println(i)\nend\n```\n\n注意，条件周围的括号不是必需的，并且块以关键字\
  \ `end` 结束。\n\n© Antonello Lobianco 2019\nA. Lobianco，《Julia 快速语法参考》，`doi.org/10.1007/978-1-4842-5190-4_3`\n\
  \n第 3 章 控制流与函数\n\n##### 变量作用域\n\n请注意，在块内部，变量的可见性会发生变化，并且 Julia 在这方面比大多数其他语言更严格。\n\
  \n当你定义变量时（例如在 REPL、Atom 或 IJulia Notebook 中），你是在全局作用域中定义它们。\n\n大多数块（`for`、`while`，但值得注意的是\
  \ `if` 不是）和函数都会定义新的局部作用域，这些作用域继承自周围的作用域。\n\n全局变量仅被继承用于读取，而不是写入。以下代码片段将导致 `UndefVarError`：未定义的代码错误。\n\
  \n```\na = 4\nwhile a > 2\n    a -= 1\nend\n```\n\n要赋值给全局变量，你需要显式使用 `global`：\n\n\
  ```\na = 5\nwhile a > 2\n    global a\n    println(\"a: $a\")\n    b = a\n    while\
  \ b > 2\n        println(\"b: $b\")\n        b -= 1\n    end\n    a -= 1\nend\n\
  ```\n\n第 3 章 控制流与函数\n\n注意，对 `b` 的赋值仍然是可行的，因为 `b` *不是*全局变量，而是在第一个 `while` 块中定义、然后在第二个块中继承的局部变量。\n\
  \n使用关键字 `local x`，你可以指定变量 `x` 必须被视为一个新的局部变量，与同名的全局变量无关。\n\n滥用全局变量会使代码更难阅读，可能导致意外结果，并且常常是计算瓶颈的根源。请谨慎使用它们！\n\
  \n#### 3.2 重复迭代：for 和 while 循环、列表推导、Map\n\n`for` 和 `while` 结构非常灵活。首先，条件可以用多种方式表达：`for\
  \ i = 1:2`、`for i in anArray`、`while i < 3`……\n\n其次，可以在同一个循环中指定多个条件。考虑这个例子：\n\n\
  ```\nfor i=1:2,j=2:5\n    println(\"i: $i, j: $j\")\nend\n```\n\n在这种情况下，对范围 `1:2`\
  \ 启动一个较高级别的循环，然后对于每个元素，对 `2:5` 执行一个嵌套循环。\n\n支持 `break` 和 `continue`，并且它们按预期工作——`break`\
  \ 立即中止循环序列，而 `continue` 立即进入下一次迭代。\n\nJulia 支持其他用于重复迭代的结构，即列表推导和映射。\n\n第 3 章 控制流与函数\n\
  \n列表推导本质上是一种编写 `for` 循环的非常简洁的方式：\n\n```\n[myfunction(i) for i in [1,2,3]]\n[x +\
  \ 2y for x in [10,20,30], y in [1,2,3]]\n```\n\n例如，你可以使用列表推导从一个或多个数组填充字典：\n\n```\n\
  [mydict[i]=value for (i, value) in enumerate(mylist)]\n[students[name] = sex for\
  \ (name,sex) in zip(names,sexes)]\n```\n\n你可以使用列表推导编写复杂的表达式，例如 `[println(\"i: $i\
  \ - j: $j\") for i in 1:5, j in 2:5 if i > j]`，但此时或许显式编写循环更好。\n\n`map` 将一个函数应用到一个参数列表。填充字典的同一个例子也可以使用\
  \ `map` 编写（效率稍低）：`map((n,s) -> students[n] = s, names, sexes)`\n\n当映射具有单个参数的函数时，该参数可以省略，如下所示：`a\
  \ = map(f, [1,2,3])` 等价于 `a = map(x->f(x), [1,2,3])`\n\n#### 3.3 条件语句：if 块、三元运算符\n\
  \n条件语句可以使用典型的 `if/elseif/else` 结构编写：\n\n```\ni = 5\nif i == 1\n    println(\"i 是\
  \ 1\")\nelseif i == 2\n    println(\"i 是 2\")\nelse\n    println(\"既不是 1 也不是 2\"\
  )\nend\n```\n\n第 3 章 控制流与函数\n\n可以使用逻辑运算符考虑多个条件：*与*（`&&`）、*或*（`||`）和*非*（`!`）（不要与按位运算符\
  \ `&` 和 `|` 混淆）。\n\n注意，当条件语句的结果能在表达式求值结束之前推断出来时，剩余部分将不会被求值（它们被“短路”了）。典型情况是 `&&`\
  \ 运算符的第一个条件为假，或者 `||` 运算符的条件为真。在这种情况下，求值第二个条件是没用的。\n\n正如列表推导是编写 `for` 循环的简洁方式一样，三元运算符是编写条件语句的简洁方式。\n\
  \n其语法如下：\n\n```\na ? b : c\n```\n\n这意味着“如果 `a` 为真，则执行表达式 `b`；否则，执行表达式 `c`”。请确保 `?`\
  \ 和 `:` 运算符周围有空格。与列表推导一样，重要的是不要滥用三元运算符来编写复杂的条件逻辑。\n\n#### 3.4 函数\n\nJulia 的函数非常灵活。它们可以内联定义为\
  \ `f(x,y) = 2x+y`，或者使用 `function` 关键字引入自己的块：\n\n```\nfunction f(x)\n    x+2\nend\n\
  ```\n\n第 3 章 控制流与函数\n\n定义函数的第三种常见方式是创建一个匿名函数并将其赋值给一个命名空间（我们稍后会讨论这一点）。\n\n函数被*定义*后，你可以调用它来执行。请注意，与大多数高级语言一样，在\
  \ Julia 中没有一个单独的*声明*函数的步骤。\n\n函数甚至可以嵌套，即函数定义可以嵌入到另一个函数定义内部，或者可以是递归的，即函数定义内部存在对自身的调用。\n\
  \n\n\n"
- "# 嵌套函数：\n\n`JULIA`\n\n```julia\nfunction f1(x)\n    function f2(x, y)\n       \
  \ x + y\n    end\n    f2(x, 2)\nend\n```\n\n\n\n"
- "# 递归函数\n\n```julia\nfunction fib(n)\n    if n == 0 return 0\n    elseif n == 1\
  \ return 1\n    else\n        return fib(n-1) + fib(n-2)\n    end\nend\n```\n\n\
  在 Julia 社区中，函数调用遵循以下规则被认为是良好的编程实践：\n\n- 函数调用应包含其逻辑所需的所有元素（即，除了常量全局变量外，不读取其他变量）。\n\
  - 函数不应更改程序中参数以外的任何其他部分（即，除了最终修改其参数外，不会产生任何“副作用”）。\n\n遵循这些规则将帮助你编写出快速、可靠（每个函数的输出唯一地取决于其输入集合）且易于阅读和调试的代码。\n\
  \n##### 3.4.1 参数\n\n函数参数通常按位置指定（*位置参数*）。但是，如果在函数定义的参数列表中使用了分号（`;`），则该分号之后列出的参数必须按名称指定（*关键字参数*）。\n\
  \n函数调用必须遵守这种区别，按位置调用位置参数，按名称调用关键字参数。换句话说，不能按名称调用位置参数，也不能按位置调用关键字参数。\n\n最后的参数（无论是位置参数还是关键字参数）都可以指定一个默认值。例如：\n\
  \n- 定义：`myfunction(a,b=1;c=2) = (a+b+c)`（定义包含两个位置参数和一个关键字参数）\n- 函数调用：`myfunction(1,c=3)`（调用\
  \ `(1+1+3)`）请注意，调用中未提供 `b`，因此使用了默认值。\n\n你可以选择通过使用类型注释参数来限制函数应接受的参数类型：\n\n```julia\n\
  myfunction(a::Int64,b::Int64=1;c::Int64=2) = (a+b+c)\n```\n\n指定参数类型的原因与其说是为了获得速度提升。Julia\
  \ 会尝试解析可能的参数类型和返回值，只有在极少数情况下，它才无法将返回类型唯一确定为输入类型的函数。在这些情况下（类型不稳定），指定参数类型可能有助于解决类型不稳定问题。\n\
  \n限制参数类型最重要的原因是为了尽早捕获错误，当函数被意外地使用其设计时未考虑的参数类型调用时。在这种情况下，如果函数被注释了允许的参数类型，Julia 将向用户返回一个有用的错误消息，而不是默默地尝试使用该参数。\n\
  \n然而，一种常见情况是，你希望函数处理给定参数的单个值（标量）或向量。你然后有两个选择：\n\n- 你可以编写处理标量的函数，然后在调用时依赖点符号来广播该函数（稍后讨论）。\n\
  - 或者，你可能希望在函数定义中直接处理这个问题。在这种情况下，你可以使用联合类型将参数声明为标量类型 `T` 或向量 `T`。例如：`function f(par::Union{Float64,\
  \ Vector{Float64}}) [...] end`。然后，你可以通过使用 `typeof` 检查参数类型来实现你想要的逻辑。\n\n最后，Julia\
  \ 中的函数也可以接受可变数量的参数。展开运算符（即省略号 `...`）可以在函数定义的参数声明中指定可变数量的参数，并可以在函数调用中“拼接”参数列表或数组：\n\
  \n```julia\nvalues = [1,2,3]\n\nfunction additionalAverage(init, args...)\n    #\
  \ 使用省略号的参数必须是最后一个\n    s = 0\n    for arg in args\n        s += arg\n    end\n \
  \   return init + s/length(args)\nend\n\na = additionalAverage(10,1,2,3) # 12.0\n\
  a = additionalAverage(10, values ...) # 12.0\n```\n\n##### 3.4.2 返回值\n\n使用 `return`\
  \ 关键字提供返回值是可选的。默认情况下，函数返回最后计算的值。\n\n通常，`return` 用于立即终止函数，例如，在出现某些条件时。请注意，返回值也可以是一个元组（一次性返回多个值）：\n\
  \n```julia\nmyfunction(a,b) = a*2,b+2\n\nx,y = myfunction(1,2)\n```\n\n##### 3.4.3\
  \ 多重分派（即多态）\n\n当类似的逻辑应应用于不同类型（即不同的类型）的对象时，你可以编写共享相同名称但具有不同类型或不同数量参数（以及不同实现）的函数。这极大地简化了应用程序的应用程序编程接口，因为只需要记住一个名称。\n\
  \n调用此类函数时，Julia 会根据调用中的参数选择正确的函数，默认选择更严格的版本。\n\n这些不同的版本在 Julia 中被称为*方法*，如果函数是类型安全的，分派是在编译时实现的，速度非常快。\n\
  \n你可以通过使用 `methods(myfunction)` 列出给定函数的所有方法。\n\n多重分派多态是面向对象运行时多态的一种泛化，其中相同的函数名称根据对象的类执行不同的任务。传统面向对象语言中的多态仅应用于单个元素，而在\
  \ Julia 中，它应用于所有函数参数（但面向对象语言在编译时确实具有多参数多态性）。\n\n在处理第 4 章中的类型继承时，我将更深入地探讨多重分派。\n\n\
  ##### 3.4.4 模板（类型参数化）\n\n可以指定函数操作的类型。你可以通过使用*模板*来实现这一点：\n\n```julia\nmyfunction(x::T,\
  \ y::T2, z::T2) where {T <: Number, T2} = x + y + z\n```\n\n此函数首先定义了两个类型，`T`（`Number`\
  \ 的子集）和 `T2`，然后指定每个参数必须属于这两个类型中的哪一个。\n\n你可以使用 `(1,2,3)` 或 `(1,2.5,3.5)` 作为参数来调用它，但不能使用\
  \ `(1,2,3.5)`，因为 `myfunction` 的定义要求第二个和第三个参数必须是相同的类型（无论是什么）。\n\n##### 3.4.5 函数作为对象\n\
  \n函数本身也是对象，可以赋值给新变量、返回或嵌套。请看这个例子：\n\n```julia\nf(x) = 2x # 内联定义一个函数 f\n\na = f(2)\
  \ # 调用 f 并将返回值赋给 a。àìs 是一个值\n\na = f # 将 f 绑定到一个新的变量名。àìs 现在是一个函数\n\na(5) # 再次调用（相同的）函数\n\
  ```\n\n##### 3.4.6 按引用传递/按值传递\n\nJulia 函数使用一种约定进行调用——在其他语言中有时被称为*按共享传递*——它某种程度上介于传统的*按引用传递*（仅将指向原始变量的内存指针传递给函数）和*按值传递*（传递变量的副本，函数在此副本上操作）之间。\n\
  \n在 Julia 中，函数操作新的局部变量，这些变量仅在函数内部已知。将变量赋值给另一个对象不会影响原始变量。但是，如果与变量绑定的对象是可变的（例如，数组），则此对象的*修改*也将应用于原始变量：\n\
  \n```julia\nfunction f(x,y)\n    x = 10\n    y[1] = 10\nend\n\nx = 1\ny = [1,1]\n\
  f(x,y) # x 不会改变，但 y 现在将变为 [10,1]\n```\n\n（另请参阅第 2 章末尾的“内存和复制问题”部分。）按约定，会修改其参数的函数，其名称后跟一个\
  \ `!`。例如，`myfunction!(ref_par, other_pars)`。仍然按约定，第一个参数是将会被修改的那个。\n\n##### 3.4.7\
  \ 匿名函数（即“Lambda”函数）\n\n有时你不需要命名一个函数（例如，当函数是传递给高阶函数（如 `map` 函数）的参数之一时）。要定义匿名（无名）函数，你可以使用\
  \ `->` 语法，如下所示：\n\n```julia\nx -> x² + 2x - 1\n```\n\n这定义了一个无名函数，它接受一个参数 `x`，并产生\
  \ `x² + 2x - 1`。可以使用元组提供多个参数，如下所示：\n\n```julia\n(x,y,z) -> x + y + z\n```\n\n你仍然可以这样将匿名函数赋值给一个变量：\n\
  \n```julia\nf = (x,y) -> x+y\n```\n\n不要将用于定义匿名函数的单箭头 `->` 与用于定义键值对（例如，在字典中）的双箭头\
  \ `=>` 混淆。\n\n##### 3.4.8 广播函数\n\n你经常会有一个设计用于处理标量的函数，但你想将其重复应用于容器内的值，例如数组的元素。你可以不编写\
  \ `for` 循环，而是依赖 Julia 的原生功能，即*广播*函数到你希望的元素上。\n\n例如，考虑以下函数：\n\n```julia\nf1(a::Int64,b::Int64)\
  \ = a*b\n```\n\n它期望输入两个标量。例如：\n\n```julia\nf1(2,3)\n```\n\n但是，如果 `a` 和 `b` 是向量（例如\
  \ `a=[2,3]` 和 `b=[3,4]`）呢？你不能直接调用函数 `f1([2,3],[3,4])`。解决方案是使用 `broadcast()` 函数，该函数将原始函数作为其第一个参数，后跟原始函数的参数：\n\
  \n```julia\nbroadcast(f1,[2,3],[3,4])\n```\n\n输出是一个向量，其中包含原始函数首先应用于 `(a=2,b=3)`，然后应用于\
  \ `(a=3,b=4)` 的结果。\n\n一个方便的广播快捷方式是使用点符号，即原始函数名后跟一个点：`f1.([2,3],[3,4])`。\n\n有时原始函数本身接受一些参数作为向量，而你想将广播限制在标量参数上。在这种情况下，你可以使用\
  \ `Ref()` 函数来保护你不想被广播的参数：\n\n```julia\nf2(a::Int64,b::Int64,c::Array{Int64,1},d::Array{Int64,1})\
  \ = a*b+sum(c)-sum(d)\n\nf2(1,2,[1,2,3],[0,0,1]) # 不带广播的正常调用\nf2.([1,1,1],[2,2,2],Ref([1,2,3]),Ref([0,0,1]))\
  \ # 仅广播前两个参数\n```\n\n#### 3.5 Do 块\n\n我们通过分析 do 块来结束本章。Do 块允许开发人员定义作为参数传递给外部函数的“匿名”函数。\n\
  \n例如，你编写 `f1(f2,x,y) = f2(x+1,x+2)+y`。要使用这个 `f1` 函数，你首先需要另一个函数来充当 `f2`（内部函数）。\n\n\
  你可以将其定义为 `f2(g,z) = g*z`，然后调用 `f1` 作为 `f1(f2,2,8)`。\n\n每当第一个参数是一个函数时，这都可以*事后*用 do\
  \ 块来编写。因此，你可以使用 do 块获得相同的结果：\n\n```julia\nf1(2,8) do i,j\n    i*j\nend\n```\n\n\
  这将 `i` 和 `j` 定义为可供 do 块使用的局部变量。它们的值在 `f1` 函数中确定（在这种情况下，`i=2+1` 和 `j=2+2`）。然后，块计算的结果作为充当\
  \ `f1` 第一个参数的函数的输出提供。同样，此值的用途由 `f1` 函数的定义指定（在这种情况下，值 `8` 被加到它上面，得到 `20`，即返回值）。\n\
  \nDo 块的另一个典型用途是在输入/输出操作中，如第 5 章所述。\n\n#### 3.6 退出 Julia\n\n要退出正在运行的 Julia 会话，请按\
  \ `Ctrl+D`（或在可能的情况下使用 `Ctrl+C` 抛出 `InterruptException`，无需关闭进程即可重新获得对 Julia 提示符的控制）。\n\
  \n要以编程方式退出脚本，请使用 `exit(exit_code)`，其中默认的零退出码按约定表示程序正常终止。\n\n最后，有时你希望能够定义在 Julia\
  \ 进程退出时运行的代码。这正是 `atexit(f)` 函数的作用。它允许你定义一个零参数函数 `f()`，该函数将在退出时被调用。\n\n例如，你可以使用它在调用给定函数时启动一个新的“干净\
  \ Julia 会话”。作为示例，在你的全局或本地的 `startup.jl` 文件中键入以下函数：\n\n```julia\nfunction workspace()\n\
  \    atexit() do\n        run(`$(Base.julia_cmd())`)\n    end\n    exit()\nend\n\
  ```\n\n现在，每当调用 `workspace()` 函数时，当前的 Julia 进程将被关闭，并启动一个新进程（请注意，`workspace` 是先前 Julia\
  \ 版本中一个清理工作区函数的名称；它不再可用。此脚本复制了其功能，尽管代价是强制重启整个 Julia 进程。）。\n\n### 第 4 章：自定义类型\n\n\
  第 2 章“数据类型与结构”讨论了内置类型，包括容器。在本章中，我们将研究如何创建用户定义的类型。\n\n*类型与结构*\n\n让我们在 Julia 语言的背景下澄清这两个术语。\n\
  \n用通俗的英语来说，一个对象的*类型*指的是描述该对象的一组特征。例如，一个 *sheet* 类型的对象可以用其尺寸、重量、大小或颜色来描述。\n\nJulia\
  \ 中的所有值都是属于给定类型的真实对象（它们是给定类型的各个“实例”）。\n\nJulia 类型包括所谓的*原始类型*（由固定数量的比特组成，如所有数值类型，如\
  \ `Int64`、`Float64` 和 `Char`）和*复合类型*或*结构*，其中对象的特征是使用多个字段和可变数量的比特来描述的。\n\n*结构*和*原始类型*都可以由用户定义，并且是分层组织的。*结构*大致对应于其他语言中所谓的*类*。\n\
  \n在处理类型时，有两个运算符特别重要：\n\n- `::` 运算符用于约束对象属于给定类型。例如，`a::B` 意味着“a 必须是 B 类型”。\n- `<:`\
  \ 运算符具有类似含义，但稍微宽松一些，因为对象可以是给定类型的任何子类型。例如，`A<:B` 意味着“A 必须是 B 的子类型”，即 B 是“父”类型，A 是它的“子”类型。\n\
  \n使用这些运算符的主要原因是为了确认程序按预期方式工作。在某些情况下，提供这些额外信息也可以提高性能。\n\n#### 4.1 原始类型定义\n\n用户定义的原始类型使用关键字\
  \ `primitive type` 及其名称和所需的比特数来定义：\n\n```\nprimitive type [名称] [比特数] end\n```\n\n\
  例如：\n\n```julia\nprimitive type My10KBBuffer 81920 end\n```\n\nJulia 的一个（当前）限制是比特数必须是\
  \ 8 的倍数且小于 8388608。\n\n也可以选择指定父类型，如下所示：\n\n```\nprimitive type [名称] <: [超类型] [比特数]\
  \ end\n```\n\n请注意，具有相同比特数的两个用户定义类型的内部表示是完全相同的。唯一改变的是它们的名称，但这是一个重要的区别：当这些类型的对象作为参数传递时，函数的行为方式会改变，也就是说，在整个程序中使用命名类型来区分它们，而不是它们的实现。\n\
  \n#### 4.2 结构定义\n\n要定义结构，请使用关键字 `mutable struct`，为结构指定一个名称，指定字段，并使用 `end` 关键字结束定义：\n\
  \n```julia\nmutable struct MyOwnType\n    field1\n    field2::String\n    field3::Int64\n\
  end\n```\n\n请注意，虽然你可以选择将每个单独的字段定义为给定类型（例如，`field3::Int64`），但不能将字段定义为给定类型的子类型（例如，`field3<:Number`）。为此，你可以在结构定义中使用模板：\n\
  \n```julia\nmutable struct MyOwnType{T<:Number}\n    field1\n    field2::String\n\
  \    field3::T\nend\n```\n\n使用模板，结构的定义会在首次构造一个其 `field3` 为 `T` 类型的对象时动态创建。\n\n用于注释单个字段的类型可以是原始类型（如前面的示例），也可以是对另一个结构的引用（请参见后面的示例）。\n\
  \n还要注意，与 Julia 不同，与其他高级语言（例如 Python）不同，你不能在定义结构后添加或删除字段。如果你需要此功能，则必须使用字典，但请注意，你将牺牲这种灵活性来换取更差的性能。\n\
  \n相反，为了获得性能（但同样牺牲了灵活性），你可以在 `struct` 前省略 `mutable` 关键字。这样，一旦创建了该类型的对象，其字段就不能再更改（即，结构默认是不可变的）。\n\
  \n请注意，可变对象（如数组）在不可变结构中仍然是可变的。\n\n#### 4.3 对象初始化与使用\n\n定义自定义类型（原始类型或结构）后，你可以从该类型初始化任意数量的对象：\n\
  \n```julia\nmyObject = MyOwnType(\"something\",\"something\",10)\na = myObject.field3\
  \ # 10\nmyObject.field3 = 20 # 仅当 myObject 是可变结构时\n```\n\n请注意，你必须按照结构定义中指定的相同顺序使用值来初始化对象。你不能按名称初始化对象（为此，请考虑使用具名元组）：\n\
  \n```julia\nMyOwnType(field3 = 10, field1 = \"something\", field2 = \"something\"\
  ) # 错误！\n```\n\n要访问对象字段或更改其值，你可以像大多数其他语言一样，使用 `object.field` 语法。\n\n*函数与结构*\n\n\
  请注意，处理对象的函数不是在类型定义中定义或声明的，即它们不与特定类型相关联。\n\n这意味着，在 Julia 中，你不需要像调用对象方法那样使用 `myobj.func(x,y)`，而是将对象作为参数传递，例如\
  \ `func(myobj,x,y)`，无论它是作为第一个、第二个还是更后面的参数。\n\n#### 4.4 抽象类型与继承\n\n你可以使用关键字 `abstract\
  \ type` 创建抽象类型。抽象类型不允许包含任何字段，也不能从中实例化对象。相反，带有字段的具体类型可以被定义为它们的子类型，并从它们实例化对象。一个允许抽象类实际持有字段的问题（请参见\
  \ https://github.com/JuliaLang/julia/issues/4935）目前是开放的，可能会在 Julia 的下一个主要版本中实现。\n\
  \n你可以创建整个抽象类型层次结构，尽管当前不支持多重继承（一个类型是多个类型的子类型）：\n\n```julia\nabstract type MyOwnGenericAbstractType\
  \ end\nabstract type MyOwnAbstractType1 <: MyOwnGenericAbstractType end\nabstract\
  \ type MyOwnAbstractType2 <: MyOwnGenericAbstractType end\nmutable struct AConcreteType1\
  \ <: MyOwnAbstractType1\n    f1::Int64\n    f2::Int64\nend\nmutable struct AConcreteType2\
  \ <: MyOwnAbstractType1\n    f1::Float64\nend\nmutable struct AConcreteType3 <:\
  \ MyOwnAbstractType2\n    f1::String\nend\n```\n\n你不能定义具体类型的子类型，只能定义抽象类型的子类型。\n\n\
  如果抽象类型不能有字段，为什么还需要继承？不是为了节省一次性跨多个类型定义公共字段的时间（为此你可以使用*组合*，稍后讨论）。相反，在整个程序中对类型的*使用*使得定义它们的层次结构变得有用。\n\
  \n考虑以下对象：\n\n```julia\no1 = AConcreteType1(2,10)\no2 = AConcreteType2(1.5)\no3 =\
  \ AConcreteType3(\"aa\")\n```\n\n由于它们都是 `MyOwnGenericAbstractType` 的子类型，你可以定义一个为它们提供默认实现的函数：\n\
  \n```julia\nfunction foo(a :: MyOwnGenericAbstractType)\n    println(\"默认实现： $(a.f1)\"\
  )\nend\n\nfoo(o1) # 默认实现： 2\nfoo(o2) # 默认实现： 1.5\nfoo(o3) # 默认实现： aa\n```\n\n然后，你可以决定提供一个函数，为所有类型是\
  \ `MyOwnAbstractType1` 子类型的对象提供更专门的实现：\n\n```julia\nfunction foo(a :: MyOwnAbstractType1)\n\
  \    println(\"一个更专门的实现： $(a.f1*4)\")\nend\n\nfoo(o1) # 一个更专门的实现： 8\nfoo(o2) # 一个更专门的实现：\
  \ 6.0\nfoo(o3) # 默认实现： aa\n```\n\n这是可能的，这要归功于第 3 章中讨论的*多重分派*机制。当一个函数的多个*方法*可用于分派函数调用时，Julia\
  \ 会选择更严格的那个，即在精确的参数类型或其更直接的*超类型*（父类型）上定义的那个：\n\n```julia\nfunction foo(a :: AConcreteType1)\n\
  \    println(\"一个更更专门的实现： $(a.f1 + a.f2)\")\nend\n\nfoo(o1) # 一个更更专门的实现： 12\nfoo(o2)\
  \ # 一个更专门的实现： 6.0\nfoo(o3) # 默认实现： aa\n```\n\n##### 4.4.1 在 Julia 中实现面向对象范式\n\n\
  Julia 既支持继承也支持组合模型，尽管支持程度不同。\n\n*继承*就是你刚才看到的，当一个类型的层次结构通过将一个类型声明为另一个类型的子类型来获得时。你也看到了在\
  \ Julia 中使用继承的局限性，即只能继承行为（而不是结构）。\n\n那么，如何在 Julia 中实现面向对象模型呢？嗯，Julia 社区的偏好是使用组合而非继承。\n\
  \n*组合*是指你将给定类型的一个字段声明为另一个复合类型的对象。通过这个（被引用的）对象，你就可以访问另一个类型的字段。\n\n考虑以下示例，你首先定义一个通用的\
  \ `Person` 结构，然后再定义两个更具体的 `Student` 和 `Employee` 结构：\n\n```julia\nstruct Shoes\n\
  \    shoesType::String\n    colour::String\nend\n\nstruct Person\n    myname::String\n\
  \    age::Int64\nend\n\nstruct Student\n    p::Person\n    school::String\n    shoes::Shoes\n\
  end\n\nstruct Employee\n    p::Person\n    monthlyIncomes::Float64\n    company::String\n\
  \    shoes::Shoes\nend\n```\n\n你没有使用继承将 `Student` 和 `Employee` 声明为 `Person` 的子类型，而是使用组合为两者都分配了一个\
  \ `Person` 类型的字段 `p`。正是由于这个字段，你无需重复两者共有的字段。\n\n类型必须先定义，然后才能用于引用对象。因此，`Shoes` 的定义必须放在\
  \ `Students` 和 `Employee` 定义之前。\n\n然后，你可以创建专门类型的实例，要么先创建引用的对象，要么在专门类型的构造函数中内联创建：\n\
  \n```julia\ngymShoes = Shoes(\"gym\",\"white\")\nproShoes = Shoes(\"classical\"\
  ,\"brown\")\n\nMarc = Student(Person(\"Marc\",15),\"Divine School\",gymShoes)\n\
  MrBrown = Employee(Person(\"Brown\",45),3200.0,\"ABC Corporation Inc.\", proShoes)\n\
  ```\n\n最后，你可以使用多重分派为专门类型提供定制实现，并通过点（`.`）运算符的链式使用来访问引用的对象和/或通用字段：\n\n```julia\nfunction\
  \ printMyActivity(self::Student)\n    println(\"嗨！我是 $(self.p.myname)，我在 $(self.school)\
  \ 学校学习，我穿 $(self.shoes.colour) 颜色的鞋子\")\nend\n\nfunction printMyActivity(self::Employee)\n\
  \    println(\"你好。我的名字是 $(self.p.myname)，我在 $(self.company) 公司工作，我穿 $(self.shoes.colour)\
  \ 颜色的鞋子\")\nend\n\nprintMyActivity(Marc) # 嗨！我是 Marc，...\nprintMyActivity(MrBrown)\
  \ # 你好。我的名字是 MrBrown，...\n```\n\n虽然明智地使用继承在实际中可以满足你可能遇到的许多建模设计情况，但 Julia 核心语言在表现力方面确实有所欠缺，因为你无法直接考虑和/或区分对象之间关系的不同概念，如特化（例如，`Person→Student`）、组合（例如，`Person→Arm`）和弱关系（例如，`Person→Shoes`）。\n\
  \n为了解决这个不足，已经发布了一些第三方包（本书未讨论）来提高 Julia 在这个领域的灵活性，例如用于模拟多重继承的 `SimpleTraits` 包，或用于自动将字段声明从父类型复制到子类型的\
  \ `OOPMacro.jl`。\n\n#### 4.5 与类型相关的一些有用函数\n\n为了完成关于用户定义类型的讨论，你可能会发现以下与类型相关的函数很有用：\n\
  \n- `supertype(MyType)`：返回一个类型的父类型\n- `subtypes(MyType)`：列出一个类型的所有子类型\n- `fieldnames(MyType)`：查询一个结构的所有字段\n\
  - `isa(obj,MyType)`：检查 `obj` 是否是 `MyType` 类型\n- `typeof(obj)`：返回 `obj` 的类型\n- `eltype(obj)`：返回集合的内部元素类型，例如数组的内部元素\n\
  \n### 第 5 章：输入/输出\n\n本章包含以下第三方包的讨论：\n\n**包名** | **URL** | **版本**\n--- | --- | ---\n\
  `CSV.jl` | [`github.com/JuliaData/CSV.jl`](https://github.com/JuliaData/CSV.jl)\
  \ | v0.5.11\n`HTTP.jl` | [`github.com/JuliaWeb/HTTP.jl`](https://github.com/JuliaWeb/HTTP.jl)\
  \ | v0.8.4\n`XLSX.jl` | [`github.com/felipenoris/XLSX.jl`](https://github.com/felipenoris/XLSX.jl)\
  \ | v0.5.4\n`JSON2.jl` | [`github.com/quinnj/JSON2.jl`](https://github.com/quinnj/JSON2.jl)\
  \ | v0.3.1\n\nJulia 中的输入/输出是通过首先选择合适的 `IOStream` 对象——文件、用户终端或网络对象——然后在该流上应用所需的函数来实现的。总体思路是打开流，执行所需操作，然后关闭流。\n\
  \n关于用户终端，Julia 通过内置的 `stdin` 和 `stdout`（以及可能的 `stderr`）`IO` 流提供与之交互。这些流已经打开，是输入和输出操作的默认流。\n\
  \n关于网络资源，你目前仍然需要使用第三方包。我们将在本章中考虑 `HTTP.jl`（请参见 https://github.com/JuliaWeb/HTTP.jl）。\n\
  \n#### 5.1 读取（输入）\n\n##### 5.1.1 从终端读取\n\n- `aString = readline()`：读取用户输入到终端的任何内容，直到按下\
  \ `Enter`。\n- `anInteger = parse(Int64, readline())`：读取用户在终端输入的数字。\n\n让我们注意，你很少需要这个。Julia\
  \ 是交互式的，你可以直接通过终端或正在使用的编辑器运行代码片段或更改变量。\n\n尽管如此，你可以创建一个 Julia 脚本（如下例所示）并运行它（使用 `julia\
  \ myScript.jl` 或在 Julia 提示符中使用 `include(\"myScript.jl\")`）。这将模拟经典的“脚本”行为，用户运行脚本时无法完全控制它，只能输入脚本请求的用户输入：\n\
  \n```julia\nprintln(\"欢迎来到 Julia 脚本\\n\\n\")\n\nfunction getUserInput(T=String,msg=\"\
  \")\n    print(\"$msg \")\n    if T == String\n        return readline()\n    else\n\
  \        try\n            return parse(T,readline())\n        catch\n          \
  \  println(\"抱歉，我无法解释你的答案。请再试一次\")\n            getUserInput(T,msg)\n        end\n\
  \    end\nend\n\nsentence = getUserInput(String,\"你想重复哪句话？\");\nn = getUserInput(Int64,\"\
  你想重复多少次？\");\n[println(sentence) for i in 1:n]\nprintln(\"完成！\")\n```\n\n请注意，在此代码片段中，函数使用运行时异常来确保用户的响应与你想要的类型兼容。你将在第\
  \ 8 章中了解更多关于运行时异常的信息。\n\n##### 5.1.2 从文件读取\n\nJulia 中的文件读取（以及你将看到的写入）与其他语言相似。\n\n\
  你打开文件，指定模式（`r`，代表“reading”），将文件绑定到一个对象，对该对象进行操作，并在完成时 `close()` 它。\n\n一个更好的选择是将文件操作封装在一个\
  \ do 块中，该块会在块结束时自动关闭文件。\n\n- 一次性读取整个文件：\n\n```julia\nopen(\"afile.txt\", \"r\")\
  \ do f # \"r\" 代表读取\n    filecontent = read(f,String) # 注意它只能使用一次。如果第二次使用而不重新打开文件，read()\
  \ 将返回一个空字符串\nend\n```\n\n\n\n"
- "# 第 5 章 输入/输出\n\n## 逐行读取文件：\n\n```julia\nopen(\"afile.txt\", \"r\") do f\n    for\
  \ ln in eachline(f)\n        # ... 对该行进行所需操作 ...\n    end\nend\n```\n\n即使是不适合存入内存的非常大的文件，也可以使用此方法。\n\
  \n## 逐行读取文件并记录行号：\n\n```julia\nopen(\"afile.txt\", \"r\") do f\n    for (i, ln)\
  \ in enumerate(eachline(f))\n        println(\"$i $ln\")\n    end\nend\n```\n\n\
  ## 为矩阵导入数据\n\n你可以使用 `readdlm()`（位于标准库包 `DelimitedFiles` 中）将文件中的数据导入到矩阵中。你可以使用切片操作符跳过某些行和/或列，然后将其转换为所需的类型：\n\
  \n```julia\nmyData = convert(Array{Float64,2}, readdlm(\"myinputfile.csv\", '\\\
  t')[2:end, 4:end]); # 跳过头 1 行和前 3 列\n```\n\n## 解析逗号分隔值（CSV）文件\n\n你可以使用 `CSV.jl`\
  \ 包中的 `read` 函数：\n\n```julia\nmyData = CSV.read(file; delim=';', missingstring=\"\
  NA\", decimal=',')\n```\n\n`read` 支持一长串（大多是自解释的）选项：`delim`（对于制表符分隔的文件请使用 `\\t`）、`quotechar`、`openquotechar`、`closequotechar`、`escapechar`、`missingstring`、`dateformat`、`append`、`writeheader`、`header`、`newline`、`quotestrings`、`decimal`、`header`、`normalizenames`、`datarow`、`skipto`、`footerskip`、`limit`、`transpose`、`comment`、`use_mmap`、`type`、`types`、`typemap`、`pool`、`categorical`、`strict`\
  \ 和 `silencewarnings`。\n\n结果是一个 `DataFrame`（一种广泛使用的表格数据格式，你将在第 10 章中详细了解它）。除非使用了\
  \ `header=false` 选项，否则第一行将被解释为表头。\n\n每个字段的类型是通过大量初始行自动识别的，但有时这还不够。例如，在某些数据集中，你可能有一个字段全是缺失值，然后突然在数据集很靠后的位置出现非缺失值。当你尝试用某些值填充该字段时，这种情况会触发\
  \ `TypeError`，因为它已被识别为 `Missing` 类型。\n\n诀窍是使用 `types` 参数（一个向量或字典，例如 `types=Dict(\"\
  myFieldFoo\" => Union{Missing,Int64})`）手动指定列类型。\n\n虽然这里你使用了 `CSV.jl` 包，但你可能会对另一个较新的替代包\
  \ `CSVFiles.jl`（参见 [`github.com/queryverse/CSVFiles.jl`](https://github.com/queryverse/CSVFiles.jl)）感兴趣，它允许你通过\
  \ URL 直接访问文件，或者访问 gzip 压缩的文件。\n\n##### 5.1.3 从 Excel 导入数据\n\n使用 `XLSX` 包，你可以：\n\n\
  - 获取工作表名称列表：`XLSX.sheetnames(XLSX.readxlsx(\"myExcelFile.xlsx\"))`\n- 导入指定工作表中的所有数据：`m\
  \ = XLSX.readxlsx(\"myExcelFile.xlsx\")[\"mySheet\"][:]`\n- 导入特定范围内的所有数据：`m = XLSX.readxlsx(\"\
  myExcelFile.xlsx\")[\"mySheet\"][\"B3:D6\"]` 或 `m = XLSX.readdata(\"myExcelFile.xlsx\"\
  , \"mySheet\", \"B3:D6\")`\n- 将数据导入为 `DataFrame`：`df = DataFrame(XLSX.readtable(\"\
  myExcelFile.xlsx\", \"mySheet\")...)`\n\n最后一个方法值得解释一下。`XLSX` 通常以标准矩阵格式（`Array{T,2}`）导出数据。为了方便以\
  \ `DataFrame` 格式导出数据，提供了另一个函数 `XLSX.readtable()`，它返回一个元组，其中第一个元素是列数据的向量（即 `Array{Array{T,1},1}`），第二个元素是表头名称的向量。这种格式使用展开构造函数将元组拆分成两个独立的参数，允许你匹配\
  \ `DataFrames` 的构造函数方法之一，即 `DataFrame(data, headers)`。\n\n如果你只想将工作表的某个范围导入到 `DataFrame`，你可以在\
  \ `readtable()` 中指定要导入的列作为第三个位置参数（例如，`B:D`）以及要开始导入的 `first_row`。\n\n不过，此时你可能最好使用像\
  \ `ExcelFiles.jl`（参见 [`github.com/queryverse/ExcelFiles.jl`](https://github.com/queryverse/ExcelFiles.jl)）这样的包，它允许直接导入到\
  \ `DataFrame` 格式。\n\n##### 5.1.4 从 JSON 导入数据\n\nJavaScript 对象表示法（JSON）是一种通用的开放标准、语言无关的数据格式，它使用人类可读的文本（由属性-值对组成）来序列化和传输数据对象。\n\
  \n这里，我介绍 `JSON2.jl` 包（[`github.com/quinnj/JSON2.jl`](https://github.com/quinnj/JSON2.jl)）。用于读取或导出\
  \ JSON 格式数据的其他常见选项包括 `JSON.jl`（[`github.com/JuliaIO/JSON.jl`](https://github.com/JuliaIO/JSON.jl)）和\
  \ `LazyJSON.jl`（[`github.com/JuliaCloud/LazyJSON.jl`](https://github.com/JuliaCloud/LazyJSON.jl)）（后者尤其会在需要时才解析\
  \ JSON 文件，而不是一次性解析所有内容）。\n\n假设你在 Julia 中有以下 JSON 数据作为字符串，它代表了诺丁汉森林的一个片段：\n\n```julia\n\
  jsonString = \"\"\"\n{\n    \"species\": \"Oak\",\n    \"latitude\": 53.204199,\n\
  \    \"longitude\": -1.072787,\n    \"trees\": [\n        {\n            \"vol\"\
  : 23.54,\n            \"id\": 1\n        },\n        {\n            \"vol\": 12.25,\n\
  \            \"id\": 2\n        }\n    ]\n}\n\"\"\"\n```\n\n有两种方法可以将此数据导入到你的程序中。第一种方法是使用\
  \ `JSON2.read(jsonString, T)`，即将数据导入为特定的类型（该类型必须已定义）：\n\n```julia\nstruct ForestStand\n\
  \    sp::String\n    lat::Float64\n    long::Float64\n    trees::Array{Dict{String,Float64},1}\n\
  end\n\nnottFor = JSON2.read(jsonString, ForestStand)\n```\n\n`nottFor` 将是一个 `ForestStand`\
  \ 对象。注意，结构中定义的字段名称和导入的 JSON 数据中的字段名称不必匹配。重要的是字段的顺序和类型。\n\n第二种方法是不为导入的对象指定任何类型，如下所示：\n\
  \n```julia\nnottFor2 = JSON2.read(jsonString)\n```\n\n`nottFor2` 将是一个 `NamedTuple`，其字段可以使用普通的点符号访问，例如\
  \ `nottFor2.trees[1].vol`。\n\n##### 5.1.5 访问网络资源（HTTP）\n\n可以使用名为 `HTTP.jl` 的第三方包（[`github.com/JuliaWeb/HTTP.jl`](https://github.com/JuliaWeb/HTTP.jl)），通过超文本传输协议（HTTP）访问网络资源[1]。`HTTP.jl`\
