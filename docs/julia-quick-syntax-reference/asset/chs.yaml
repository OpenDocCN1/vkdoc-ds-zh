  \ v0.10.2)\n\n尽管 Julia 本身已经为处理表格（和多维）数据提供了快速的原生结构 `Array{T,n}` 参数化类型，但为了专门处理数值数据，人们还是创建了非常庞大的第三方包集合。\n\
  \n总的来说，这是因为两个需求。\n\n© Antonello Lobianco 2019  \nA. Lobianco，*Julia 快速语法参考*，`doi.org/10.1007/978-1-4842-5190-4_9`\n\
  \n**第九章 处理数据**\n\n第一个需求是更好的便利性。像 `DataFrames` 或 `IndexedTables` 这样的包添加了元数据（如列名），允许开发者通过名称而不是位置来检索数据，使用\
  \ `Query.jl` 或 `DataFramesMeta.jl` 进行查询，然后通过 `Pipe.jl` 进行连接、分组、链式操作等。\n\n第二个需求是高效处理异构数据。在\
