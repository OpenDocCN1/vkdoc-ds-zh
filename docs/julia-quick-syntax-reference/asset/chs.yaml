  \               consumption = [4.3,7.4,2.5,9.8,3.2,4.3,6.5,3.0])\n```\n\n要创建一个空的\
  \ `df`：\n\n```\ndf = DataFrame(A = Int64[], B = Float64[])\n```\n\n**第 9 章 数据处理**\n\
  \n要从一个数据矩阵和一个（单独的）列名向量转换出 `df`：\n\n```\nmat = [1 2 3; 4 5 6]\nheaderstrs = [\"c1\"\
  , \"c2\", \"c3\"]\ndf = DataFrame([[mat[:,i]...] for i in 1:size(mat,2)], Symbol.(headerstrs))\n\
  ```\n\n要从一个矩阵转换出 `df`，其中标题定义在矩阵的第一行：\n\n```\nmat = [\"c1\" \"c2\" \"c3\"; 1 2 3;\
  \ 4 5 6]\ndf = DataFrame([[mat[2:end,i]...] for i in 1:size(mat,2)],\n         \
  \      Symbol.(mat[1,:]))\n```\n\n要从代码中定义的表格创建 `df`：\n\n```\nusing CSV\ndf = CSV.read(IOBuffer(\"\
  \"\"\nregion product year production consumption\nUS Hardwood 2010 3.3 4.3\nUS Hardwood\
  \ 2011 3.2 7.4\nUS Softwood 2010 2.3 2.5\nUS Softwood 2011 2.1 9.8\nEU Hardwood\
  \ 2010 2.7 3.2\nEU Hardwood 2011 2.8 4.3\nEU Softwood 2010 1.5 6.5\nEU Softwood\
  \ 2011 1.3 3.0\n\"\"\"), delim=\" \", ignorerepeated=true, copycols=true)\n```\n\
  \n如果没有 `copycols=true` 参数，生成的 `DataFrame` 将处于只读模式。\n\n**第 9 章 数据处理**\n\n要从 OpenDocument\
  \ 电子表格文件（OpenOffice、LibreOffice、MS Excel 等使用的格式）导入 `df`，请使用 `OdsIO` 包中的 `ods_read()`\
  \ 函数，并配合 `retType=\"DataFrame\"` 参数以及左上/右下范围：\n\n```\ndf = ods_read(\"spreadsheet.ods\"\
  ; sheetName=\"Sheet2\", retType=\"DataFrame\",\n              range=((tl_row,tl_col),(br_row,br_col)))\n\
  ```\n\n##### 9.1.3 了解数据概况\n\n一旦你拥有了一个 `DataFrame`，你可能想分析它的数据或结构：\n\n- `show(df)`：显示\
  \ `df` 的一个子集（取决于可用空间）。使用 `allrows=true` 和 `allcols=true` 可检索完整的 `df`，无论其大小。\n- `first(df,\
  \ n)`：显示 `df` 的前 *n* 行。\n- `last(df, 6)`：显示 `df` 的后 *n* 行。\n- `describe(df)`：检索\
  \ `df` 每一列的类型和基本描述性统计信息。\n- `names(df)`：返回列名数组（以符号形式，而非字符串）。\n- `for r in eachrow(df)`：遍历每一行。\n\
  - `for c in eachcol(df)`：遍历每一列。\n- `unique(df.fieldName)` 或 `[unique(c) for c in\
  \ eachcol(df)]`：返回各列的唯一元素。\n- `[eltype(c) for c in eachcol(df)]`：返回列类型数组。\n- `size(df)`（行数，列数），`size(df)[1]`（行数），`size(df)[2]`（列数）：返回\
  \ `df` 的大小。\n\n**第 9 章 数据处理**\n\n请注意，列名是 Julia 符号，而不是字符串。要以编程方式组合列名，需要使用 `Symbol(aString)`\
  \ 构造函数。例如，`Symbol(\"value_\",0)`。\n\n##### 9.1.4 过滤数据（选择或查询数据）\n\n要选择（过滤）数据，可以使用\
  \ `DataFrame` 包提供的方法，或其他包（如 `DataFrameMeta.jl` 或 `Query.jl`）提供的专用方法。\n\n特别地，`Query.jl`\
  \ 包旨在提供一个通用的 API，该 API 无论数据后端如何都有效。\n\n- 选择整列：\n  - `df[:,:cNames]`：通过复制数据选择多列（例如，`df[:,[:product,:year]\
  \ ]`）。\n  - `df[!,:cNames]`：通过引用数据选择多列（例如，`df[!,[:product,:year] ]`）。\n  - `df.cName`：选择单列（例如，`df.product`）（引用方式，即等同于\
  \ `df[!,:cName]`）。\n  - `df[cPos]`：通过复制数据选择一列或多列（例如，`df[2]`）。\n- 选择整行：\n  - `df[rPos,:]`：选择一行或多行（例如，`df[2,:]`）。与列不同，行没有标题名称。\n\
  - 选择单元格：\n  - `df.cName[rPos]`：选择 `cName` 列中的特定单元格（例如，`df.product.[1:2:6]`）。\n \
  \ - `df[rPos, :cName(s)]` 或 `df[rPos,cPos]`：通过行位置和列名或位置选择特定单元格（例如，`df[2,:product]`）。\n\
  \n**第 9 章 数据处理**\n\n其中：\n- `cName` 是单个列名（符号）。\n- `cNames` 是一个列名（符号）数组。\n- `rPos`\
  \ 是行位置（标量、数组或范围）。\n- `cPos` 是列位置（标量、数组或范围）。\n\n返回的选择结果是：\n- 如果是单列，则为 `Array{T,1}`\n\
  - 如果是单行，则为 `DataFrameRow`（类似于 `DataFrame`）\n- 如果是单个单元格，则为 `T`\n- 否则为另一个 `DataFrame`\n\
  \n过滤：\n- `df[arrayOfBooleans,:]`：选择 `arrayOfBooleans`（大小必须一致）为 `true` 的行。这被称为“布尔选择”。\n\
  \n这同样适用于使用列位置同时选择行和列（但不能用于作为掩码的布尔值矩阵）。以下是一些示例：\n\n- `df[ [true,true,false,false,false,false,false,false],\
  \ [true,true,true,false,true] ]` 选择前两行，以及除第四列外的所有列。\n- `df[ [i in [\"US\",\"China\"\
  ] for i in df.region], :]` 通过列表推导式进行布尔选择，根据值是否在列表中过滤。列表推导部分根据条件返回一个布尔值数组，然后在此之上进行布尔选择。\n\
  \n**第 9 章 数据处理**\n\n- `df[([i in [\"US\",\"China\"] for i in df.region] .> 0) .&\
  \ (df.year .== 2010), :]` 通过布尔选择中的多个条件进行过滤。需要点号来向量化操作。注意位运算与单个 & 符号的使用。\n- `df[startswith.(df.region,\"\
