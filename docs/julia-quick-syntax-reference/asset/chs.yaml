  \ # 错误！\n\n#### 9.3 使用管道运算符\n\n管道运算符（[`github.com/oxinabox/Pipe.jl`](https://github.com/oxinabox/Pipe.jl)）改进了\
  \ Julia Base 中的管道运算符 `|>`。\n\n链式调用（或称“管道”）允许你以紧凑且易读的方式将多个函数调用串联起来。它避免了保存中间结果，也无需将函数调用相互嵌套。\n\
  \n使用链式运算符 `|>`，`|>` 右侧的代码对 `|>` 左侧代码的结果进行操作。实际上，左侧操作的结果会成为右侧函数调用的参数。\n\n链式调用对于数据处理非常有用。假设你想使用以下（简单的）函数依次对某些数据进行操作，并打印最终结果：\n\
  \n```\nadd6(a) = a+6; div4(a) = a/4;\n```\n\n你可以引入临时变量，或者嵌套函数调用：\n\n```\n# 方法 #1，使用临时变量：\n\
  a = 2;\nb = add6(a);\nc = div4(b);\nprintln(c) # 输出: 2\n```\n\n```\n# 方法 2，链式函数调用：\n\
  println(div4(add6(a)))\n```\n\n使用管道，你可以这样写：\n\n```\na |> add6 |> div4 |> println\n\
  ```\n\n基本的管道功能非常有限，因为它只支持具有一个参数的函数，并且一次只能“管道”一个函数。\n\n相反，Pipe 包提供了 `@pipe` 宏，它重写了\
  \ `|>` 运算符。它允许你使用具有多个参数的函数（你可以使用下划线字符 `_` 作为左侧值的占位符）。你还可以在单个管道步骤中对多个函数进行管道操作，如下所示：\n\
  \n```\naddX(a,x) = a+x; divY(a,y) = a/y\na = 2\n```\n\n```\n# 使用临时变量：\nb = addX(a,6)\n\
  c = divY(a,4)\nd = b + c\nprintln(c)\n```\n\n```\n# 使用 @pipe：\n@pipe a |> addX(_,6)\
  \ + divY(4,_) |> println # 输出: 10.0\n```\n\n你甚至可以将多个值嵌入元组中进行管道操作：\n\n```\ndata =\
  \ (2,6,4)\n```\n\n```\n# 使用临时变量：\nb = addX(data[1],data[2]) # 8\nc = divY(data[1],data[3])\
  \ # 0.5\nd = b + c # 8.5\nprintln(c)\n```\n\n```\n# 使用 @pipe：\n@pipe data |> addX(_[1],_[2])\
  \ + divY(_[1],_[3]) |> println\n```\n\n请注意，与基本管道一样，需要单个参数且该参数由管道数据提供的函数不需要加括号。\n\
  \n#### 9.4 绘图\n\n##### 9.4.1 安装与后端\n\n在 Julia 中绘图可以使用特定的绘图包（例如，[`github.com/dcjones/Gadfly.jl`](https://github.com/dcjones/Gadfly.jl)\
  \ 的 Gadfly，[`github.com/nolta/Winston.jl`](https://github.com/nolta/Winston.jl)\
  \ 的 Winston），或者像许多人偏爱的，使用 Plots 包（[`github.com/JuliaPlots/Plots.jl`](https://github.com/JuliaPlots/Plots.jl)），它提供了一个包装器，带有统一的\
  \ API，可支持多个后端。\n\n后端的选取方式是在调用绘图函数之前运行 `chosenbackend()`——即相应后端包的名称，但全部用小写字母书写。Plots\
  \ 包默认使用 GR 作为其后端（见图 9-1），并且 GR.jl 会与 Plot.jl 一同安装。\n\n如果你需要其他后端，只需安装相应的包即可。\n\n\
  两个比较完善的后端是：\n\n• Plotly.JS（[`github.com/sglyon/PlotlyJS.jl`](https://github.com/sglyon/PlotlyJS.jl)）：对\
  \ plotly.js（[`plot.ly`](https://plot.ly)）可视化库的 Julia 封装\n• PyPlot（[`github.com/JuliaPy/PyPlot.jl`](https://github.com/JuliaPy/PyPlot.jl)）：对\
  \ Python matplotlib（[`matplotlib.org/api/pyplot_api.html`](http://matplotlib.org/api/pyplot_api.html)）的封装\n\
  \n例如：\n\n```\nusing Pkg\nPkg.add(\"Plots\")\nusing Plots\nplot(cos,-4pi,4pi, label=\"\
  余弦函数 (GR)\") # 使用默认的 GR 后端绘图\nPkg.add(\"PyPlot\")\nPkg.add(\"PlotlyJS\")\nPkg.add(\"\
  ORCA\") # PlotlyJS 所需\npyplot()\nplot(cos,-4pi,4pi, label=\"余弦函数 (PyPlot)\")\nplotlyjs()\n\
  plot(cos,-4pi,4pi, label=\"余弦函数 (PlotlyJS)\")\n```\n\n![图片 16](img/index-178_1.jpg)\n\
  \n***图 9-1.** 使用默认后端 GR 绘制的余弦函数*\n\n虽然 GR 是默认后端，即除非调用了其他后端，否则每次新会话都会使用它，但你可以在 `~/.julia/config/startup.jl`\
  \ 文件中设置自己的默认后端 `ENV[\"PLOTS_DEFAULT_BACKEND\"] = \"myPreferredBackend\"`。\n\n确保不要混用不同的绘图包（例如，Plots\
  \ 和直接使用它的某个后端）。这很可能会引发问题。如果你已经导入了一个绘图包并想使用另一个，你应该始终重启 Julia 内核（在使用 Plots 包的不同后端之间切换时，这不是必须的，并且这也是其优势之一）。\n\
  \n你可以通过 `backend()` 检查 Plots 当前正在使用哪个后端。\n\n有许多不同的后端。虽然基本绘图几乎可以从任何后端获得，但每个后端在某些特性上都有自己的优势——例如速度、美观性或交互性。某些高级属性可能仅被一部分后端支持。\n\
  \n针对你的特定情况选择正确的后端很重要。以下页面可能对此有所帮助：\n\n• 应该选择哪个后端？（[`docs.juliaplots.org/latest/backends/`](http://docs.juliaplots.org/latest/backends/)）\n\
  • 各后端支持的图表和属性（[`docs.juliaplots.org/latest/supported/`](http://docs.juliaplots.org/latest/supported/)）\n\
  \n##### 9.4.2 Plot 函数\n\n如果你使用 Juno，图表将渲染在“绘图”面板中；如果你使用 REPL，则会显示在单独的窗口中（除非你使用 UnicodePlots\
  \ 后端，它采用字符在文本终端中渲染图表）。\n\n遗憾的是，第一次绘图时间相对较长是正常现象。\n\n你已经看到过一个 `plot` 函数方法的示例。\n\n\
  \n\n`specifically plot(func, lBound, uBound; keywArgs)`。另一种方式是使用 `plot(xData, yData;\
  \ keywArgs)` 来绘制数据，其中 `xData` 是一个由数字或字符串组成的 `Array{T,1}`，代表横轴坐标；`yData` 可以是另一个 `Array{T,1}`（即列向量），也可以是\
  \ `Array{T,2}`（即矩阵）。在第一种情况下，将绘制单个序列；在第二种情况下，矩阵的每一列将被视为独立的数据序列（见图 9-2）：\n\n```\n\
  x = [\"a\",\"b\",\"c\",\"d\",\"e\",]\n```\n\n**JULIA**\n\n```\ny = rand(5,3)\nplot(x,y)\n\
  ```\n\n![Image 17](img/index-180_1.jpg)\n\n## 第 9 章 数据处理\n\n***图 9-2.** 绘制多个序列*\n\
  \n虽然绘图对象可以像其他对象一样保存，通过 `myPlot = plot(...)`，其特殊之处在于最后一次对 `plot` 的调用定义了“当前”绘图，这是可视化和保存的默认绘图。而使用\
  \ `plot!` 函数，您可以向现有绘图添加元素，如果没有特别指定（即通过将您操作的绘图对象作为第一个参数），精确地说是向“当前”绘图添加。\n\n因此，绘制多个序列的另一种方法是先绘制一个序列，然后使用\
  \ `plot!` 一次添加一个序列。以下代码片段生成的绘图与上一个完全相同：\n\n```\nplot(x,y[:,1]) # 创建一个新的“当前绘图”\n\
  ```\n\n**JULIA**\n\n```\nplot!(x,y[:,2]) # 向当前绘图添加一个序列\nplot!(x,y[:,3]) # 向当前绘图添加一个序列\n\
