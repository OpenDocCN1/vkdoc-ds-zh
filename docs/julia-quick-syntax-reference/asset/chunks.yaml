    **4.4.1 Implementation of the Object-Oriented**


    **Paradigm in Julia**


    Julia allows both inheritance and composition models, although with different
    levels of support.


    *Inheritance* is what you just saw, when a hierarchical structure of types is
    obtained declaring one type as a subtype of another. You also saw the limits of
    using inheritance in Julia, when only the behavior (and not the structure) can
    be inherited.


    ChAptEr 4 Custom typEs


    So, how do you implement an object-oriented model in Julia? Well, the preference
    in the Julia community is to use composition over inheritance.


    *Composition* is when you declare one field of a given type as being an object
    of another composite type. Through this (referenced) object, you then gain access
    to the fields of the other type.


    Consider the following example, where you first define a generic


    Person structure and then two more specific Student and Employee


    structures:


    struct Shoes


    JULIA


    shoesType::String


    colour::String


    end


    struct Person


    myname::String


    age::Int64


    end


    struct Student


    p::Person


    school::String


    shoes::Shoes


    end


    struct Employee


    p::Person


    monthlyIncomes::Float64


    company::String


    shoes::Shoes


    end


    ChAptEr 4 Custom typEs


    Instead of using inheritance declaring Student and Employee as


    subtypes of Person, you use composition to assign a field p of type Person to
    both of them. It is thanks to this field that you do not need to repeat the fields
    that are common to both.


    types must be defined before they can be used to reference


    objects. hence, the Shoes definition must come before the


    Students and Employee definitions.


    You can then create instances of the specialized type, either by creating the
    referenced object first, or doing that inline in the constructor of the specialized
    type:


    gymShoes = Shoes("gym","white")


    JULIA


    proShoes = Shoes("classical","brown")


    Marc = Student(Person("Marc",15),"Divine School",gymShoes) MrBrown = Employee(Person("Brown",45),3200.0,"ABC
    Corporation Inc.", proShoes)


    Finally, you can use multiple dispatch to provide tailored


    implementation for the specialized types and access referenced objects and/or
    general fields through a chained use of the dot (.) operator: function printMyActivity(self::Student)


    JULIA


    println("Hi! I am $(self.p.myname), I study at $(self.school) school, and I wear
    $(self.shoes.colour) shoes")


