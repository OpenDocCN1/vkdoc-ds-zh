    \ values for that specific dimension. If the result is a single value, a named\
    \ tuple is returned; another sparse indexed table is returned if not.\n\nAs claimed,\
    \ the selection is very fast:\n\n```\nn = 1000\n    JULIA\n    keys = shuffle!(reshape([[a\
    \ b] for a in 1:n, b in 1:n], n^2))\n```"
