- fmt: "# `topeka = 0.12599999999999997`\n\n## Chapter 10 MatheMatiCal libraries\n\
    \n### 10.1.2 Choosing Between Pizzas and Sandwiches, a Non-Linear Problem\n\n\
    The only differences with non-linear problems are that you have to provide good\
    \ starting points for the variables (try running the following example with 0\
    \ as a starting point!), you define the (non-linear) constraints with the specific\
    \ `@NLconstraints` macro, and you define the (non-linear) objective with the `@NLobjective`\
    \ macro.\n\nNote that you don’t need to provide any additional information (in\
    \ particular, no derivatives are needed).\n\n#### The Problem\n\nA student has\
    \ to choose how to allocate her weekly food budget of 80 dollars. She can choose\
    \ only between pizzas (`p`) and sandwiches (`s`). Pizzas cost $10, while sandwiches\
    \ cost only $4.\n\nHer “utility function” (how happy she is with any given combination\
    \ of pizzas and sandwiches) is `100 * p - 2 * p^2 + 70 * s - 2 * s^2 - 3 * p *\
    \ s`. She likes both, with a preference for pizza.\n\nYou use a simple problem\
    \ of maximization of a non-linear function of two variables subject to a single\
    \ constraint. To make the example simple, you don’t use sets here (i.e., both\
    \ variables and constraints are just scalar).\n\n`max 100 * p - 2 * p^2 + 70 *\
