    \    s = @distributed (+) for i = 1:n    # 使用变量 s 上的 sum 进行聚合\n        i/2   \
    \                          # for 循环的最后一个元素被聚合器使用\n    end\n    return s\nend\n\
    \n@benchmark f(10000000)      # 中位时间: 11.478 ms\n@benchmark pf(10000000)     #\
    \ 中位时间: 4.458 ms\n```\n\n所展示的两种案例是代码并行化中最常见的几种情况。Julia 提供了相当完整的高层和底层并行化函数列表，一些外部包，如\
    \ `DistributedArrays`（参见 [`github.com/JuliaParallel/DistributedArrays.jl`](https://github.com/JuliaParallel/DistributedArrays.jl)），有助于以相对简单的方式在许多情况下实现高效的并行化代码。\n\
