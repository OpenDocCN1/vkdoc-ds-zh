    \n© Antonello Lobianco 2019  \nA. Lobianco, *Julia Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_9](#index_split_001.html#p147)\n\
    \n**Chapter 9 Working With Data**\n\nThe first one was better convenience. Packages\
    \ like `DataFrames` or `IndexedTables` add metadata like column names, allowing\
    \ developers to retrieve data by name instead of by position, query it with `Query.jl`\
    \ or `DataFramesMeta.jl`, and then join, group, chain operations with `Pipe.jl`,\
    \ etc.\n\nThe second need was for efficient heterogeneous data. In a Julia base\
    \ `Array{T,2}` all data of the matrix must be of the same type, for efficiency’s\
