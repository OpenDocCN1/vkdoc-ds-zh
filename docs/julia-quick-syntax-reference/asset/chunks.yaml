    \ out the many keyboard shortcuts available\n\nfrom help ➤ Keyboard Shortcuts.\n\
    \n• need to run Julia in a computational environment\n\nfor a team or a class?\
    \ Use Jupyterh[ub (https://](https://github.com/jupyterhub/jupyterhub)\n\n[github.com/jupyterhub/jupyterhub),](https://github.com/jupyterhub/jupyterhub)\
    \ the multi-user solution based on Jupyter.\n\nChapTer 1 GeTTInG STarTed\n\n**1.3\
    \ Running Julia**\n\nThere are many ways to run Julia code, depending on your\
    \ needs:\n\n1\\. Julia can run interactively in a console. Start julia\n\nto obtain\
    \ the REPL console, and then type the\n\ncommands there (type exit() or use CTRL+D\
    \ when\n\nyou are finished).\n\n2\\. Create a script, i.e. a text file ending\
    \ in .jl, and\n\nlet Julia parse and run it with julia myscript.jl\n\n[arg1, arg2,..].\n\
    \nScript files can also be run from within the Julia\n\nconsole. Just type include(\"\
    myscript.jl\").\n\n3\\. In Linux or on MacOS, you can instead add at the\n\ntop\
    \ of the script the location of the Julia interpreter\n\non your system, preceded\
    \ by #! and followed by\n\nan empty row, e.g. #!/usr/bin/julia (You can\n\nfind\
    \ the full path of the Julia interpreter by typing\n\nwhich julia in a console.).\
    \ Be sure that the file is\n\nexecutable (e.g., chmod +x myscript.jl).\n\nYou\
    \ can then run the script with ./myscript.jl.\n\n4\\. Use an Integrated Development\
    \ Environment (such\n\nas those mentioned), open a Julia script, and use the\n\
    \nrun command specific to the editor.\n\nYou can define a global (for all users\
    \ of the computer) and local (for a single user) Julia file that will be executed\
    \ at any startup, where you can for example define functions or variables that\
    \ should always be available. The location of these two files is as follows:\n\
    \n![Image 4](index-23_1.png)\n\nChapTer 1 GeTTInG STarTed\n\n• Global Julia startup\
    \ file: [JULIA_INSTALL_FOLDER]\\\n\netc\\julia\\startup.jl (where JULIA_INSTALL_FOLDER\n\
    \nis where Julia is installed)\n\n• Local Julia startup file: [USER_HOME_FOLDER]\\\
    .julia\\\n\nconfig\\startup.jl (where USER_HOME_FOLDER is\n\nthe home folder of\
    \ the local user, e.g. %HOMEPATH% in\n\nWindows and ~ in Linux)\n\nRemember to\
    \ use the path with forward slashes ( / ) with Linux. Note that the local config\
    \ folder may not exist. In that case, just create the config folder as a .julia\
    \ subfolder and start the new startup.jl file there.\n\nJulia keeps all the objects\
    \ created within the same work session\n\nin memory. You may sometimes want to\
    \ free memory or “clean up”\n\nyour session by deleting no longer needed objects.\
    \ If you want to do this, just restart the Julia session (you may want to use\
    \ the trick mentioned at the end of Cha[pter 3) or use the](#index_split_000.html#p55)\
    \ Revise.jl\n\n[(https://github.com/timholy/Revise.jl](https://github.com/timholy/Revise.jl))\
    \ package for finer control.\n\nYou can determine which version of Julia you are\
    \ using with the\n\nversioninfo() option (within a Julia session).\n\nChapTer\
    \ 1 GeTTInG STarTed\n\n**1.4 Miscellaneous Syntax Elements**\n\nJulia supports\
    \ single-line ( # ) and multi-line ( #= [...] =# ) comments.\n\nMulti-line comments\
    \ can be nested and appear anywhere in the line: println(\"Some code..\")\n\n\
    JULIA\n\n#=\n\nMultiline comment\n\n#= nested multiline comment =#\n\nStill a\
    \ comment\n\n=#\n\nprintln(#= A comment in the middle of the line =# \"This is\
    \ a\n\ncode\") # Normal single-line comment\n\nYou don’t need to use semicolons\
    \ to indicate the end of a statement. If they’re used, semicolons will suppress\
    \ the command output (this is done automatically in scripting mode). If the semicolon\
    \ is used alone in the REPL, it allows you to switch to the OS command shell prompt\
    \ in order to launch a system-wide command.\n\nBlocks don’t need to be surrounded\
    \ by parentheses, but they do\n\nrequire the keyword end at the close.\n\nWhile\
    \ indentation doesn’t carry any functional meaning in the\n\nlanguage, empty spaces\
    \ sometimes are important. For example,\n\nfunction calls must uses parentheses\
    \ with the inputs strictly attached to the function name, e.g.:\n\nprintln (x)\
    \ # rise an ERROR\n\nTEXT\n\nprintln(x) # OK\n\n![Image 5](index-25_1.jpg)\n\n\
    ![Image 6](index-25_2.jpg)\n\nChapTer 1 GeTTInG STarTed\n\nIn Julia, variable\
    \ names can include a subset of Unicode symbols,\n\nallowing a variable to be\
    \ represented, for example, by a Greek letter.\n\nIn most Julia development environments\
    \ (including the console), to type a Greek letter, you use a LaTeX-like syntax.\
    \ This involves typing \\, then the LaTeX name for the symbol (e.g. \\alpha for\
    \ α), and then\n\npressing Tab to confirm. Using LaTeX syntax, you can also add\
    \ subscripts, superscripts, and decorators.\n\nAll the following are valid, if\
    \ not crazy, variable names: x1, x̃, α, y1, y(a+b), y2,\n\n, and\n\n.\n\nNote,\
    \ however, that while you can use y2 as a variable name, you can’t use 2y, as\
    \ the latter is automatically interpreted as 2 * y. Together with Unicode, this\
    \ greatly simplifies the transposition in computer code of mathematical equations.\n\
    \nIf you come from a language that follows a zero-indexing standard\n\n(such as\
    \ C or Python), one important point to remember is that Julia arrays are one-based\
    \ indexed (counting starts from 1 and not 0). There are ways to override this\
    \ behavior, but in many cases doing so probably would do more harm than good.\n\
    \n**1.5 Packages**\n\nJulia developers have chosen an approach where the core\
    \ of Julia is relatively light, and additional functionality is usually provided\
    \ by external\n\n“packages”.\n\nJulia binaries ship with a set of these packages\
    \ (think to it as a “Standard Library”) and a powerful package manager that is\
    \ able to download (typically directly from GitHub repositories), pre-compile,\
    \ update, and solve dependencies, all with a few simple commands.\n\nChapTer 1\
    \ GeTTInG STarTed\n\nWhile *registered* packages can be installed simply by using\
    \ their name, unregistered packages need their source location to be specified.\
    \ At the time of this writing, over 2,400 registered packages have been published.\n\
    \nKnowing how packages work is essential to efficiently working in Julia, and\
    \ this is why I have chosen to introduce package management early in the book\
    \ and complement the book with a discussion of some common\n\npackages.\n\n**1.5.1\
    \ Using the Package Manager**\n\nThere are two ways to access package management\
    \ features, interactively and as an API from within other Julia code:\n\n• The\
    \ interactive way is to type ] in the REPL console\n\nto enter a “special” pkg\
    \ mode. The prompt will then\n\nchange from julia> to (vX.Y) pkg>, where vX.Y\
    \ is the\n\ncurrent Julia version.\n\nYou can then run any package manager commands\n\
    \nor go back to the normal interpreter mode with\n\nBACKSPACE.\n\n• The API way\
    \ is to import the pkg module into your\n\ncode (using Pkg) and then run Pkg.command(ARGS).\n\
    \nObviously, nothing inhibits you from using the API\n\napproach in an interactive\
    \ session, but the special\n\npackage mode has tab completion and other goodies\n\
    \nthat make it more comfortable to use.\n\n• Note that the two interfaces are\
    \ not 100% consistent,\n\nwith the API interface being slightly more stringent.\n\
    \nChapTer 1 GeTTInG STarTed\n\nSome of the useful package commands are explained\
    \ in the following list:\n\n• status: Retrieves a list (name and version) of the\n\
    \nlocally installed packages.\n\n• update: Updates the local index of packages\
    \ and all the\n\nlocal packages to the latest version.\n\n• add pkgName: Automatically\
    \ downloads and installs\n\na given package. For multiple packages use add Pkg1\n\
    \nPkg2 or Pkg.add([\"Pkg1\",\"Pkg2\"]).\n\n• add pkgName#master, add pkgName#branchName,\
    \ or\n\nadd pkgName#vX.Y.Z: Checks out the master branch of\n\na given package,\
    \ a specific branch, or a specific release,\n\nrespectively.\n\n• free pkgName:\
    \ Returns the package to the latest\n\nrelease.\n\n• rm pkgName: Removes a package\
    \ and all its dependent\n\npackages that have been installed automatically only\n\
    \nfor it.\n\n• add git@github.com:userName/pkgName.jl.git:\n\nChecks out a non-registered\
    \ package from a Git\n\nrepository (here, it’s GitHub).\n\n**1.5.2 Using Packages**\n\
    \nTo access the functionalities of a package, you need to either *use* or *import*\
    \ it. The difference is as follows:\n\n• Using a package allows you to access\
    \ the package\n\nfunctions directly. Just include a using mypackage\n\nstatement\
    \ in the console or at the beginning of the script.\n\nChapTer 1 GeTTInG STarTed\n\
    \n• Importing a package does the same, but helps in\n\nkeeping the namespace clean,\
    \ as you need then to\n\nrefer to the package functions using their full names,\n\
    \nas myPkg.myFunction. You can use aliases or choose\n\nto import only a subset\
    \ of functions (that you can then\n\naccess directly).\n\nFor example, to access\
    \ the function plot(), which is available in the package Plots, you can do the\
    \ following (see the “Plotting” section in Chapt[er 9 for s](#index_split_001.html#p147)pecific\
    \ plotting issues):\n\n• Access the package function directly with using\n\nmyPackage\
    \ :\n\nusing Plots\n\nJULIA\n\nplot(rand(4,4))\n\n• Access the package functions\
    \ using their full names\n\nwith import myPackage :\n\nimport Plots\n\nJULIA\n\
    \nconst pl = Plots # This (optionally) creates an an\n\nalias, equivalent to Python\
    \ ìmport Plots as pl`.\n\nDeclaring it constant may improves the performances.\n\
    \npl.plot(rand(4,4)) # Èquivalent to Plots.\n\nplot(rand(4,4))`\n\n• Access the\
    \ package functions directly with import\n\nmyPackage:myfunction :\n\nimport Plots:\
    \ plot # We can import multiple\n\nfunctions at once using commas\n\nJULIA\n\n\
    plot(rand(4,4))\n\nChapTer 1 GeTTInG STarTed\n\nFinally, you can also include\
    \ any Julia source files using this line: include(\"MyFile.jl\") :\n\nWhen that\
    \ line runs, the included file is completely ran (not only parsed) and any symbol\
    \ defined there becomes available in the *scope* (the region of code within which\
    \ a variable is visible) relative to where the include was called.\n\nYou can\
    \ read more about packages in the relevant se[ction (https://](https://julialang.github.io/Pkg.jl/v1/)\n\
    \n[julialang.github.io/Pkg.jl/v1/) of the J](https://julialang.github.io/Pkg.jl/v1/)ulia\
    \ documentation, or by typing help or help COMMAND in pkg mode to get more details\
    \ on the package manager commands.\n\nacross this book, I refer to several packages,\
    \ either in the\n\nstandard library or third-party packages. When I state that\
    \ a given function belongs to a given package, remember to add using\n\n*PackageName*\
    \ in order to run the code in the examples (I will not repeat this each time).\n\
    \n**1.6 Help System**\n\nJulia comes with an integrated help system that retrieves\
    \ usage\n\ninformation for most functions directly from the source code. This\
    \ is true also for most third-party packages.\n\nTyping ? in the console leads\
    \ to the Julia help system, and the prompt changes to help?>. From there, you\
    \ can search for the function’s API.\n\n![Image 7](index-30_1.png)\n\nChapTer\
    \ 1 GeTTInG STarTed\n\nIn non-interactive environment like IJulia notebooks, you\
    \ can use\n\n?search_term to access the documentation.\n\nIn Juno, you can right-click\
    \ to open the contextual menu and choose Show documentation to bring up documentation\
    \ for the object.\n\nIf you don’t remember the function name exactly, Julia is\
    \ kind enough to return a list of similar functions.\n\nWhile the actual content\
    \ returned may vary, you can expect to see the following information for each\
    \ function you query:\n\n• Its signature\n\n• One-line description\n\n• Argument\
    \ list\n\n• Hints to similar or related functions\n\n• One or more usage examples\n\
    \n• A list of methods (for functions that have multiple\n\nimplementations)\n\n\
    **CHAPTER 2**\n\n**Data Types and**\n\n**Structures**\n\nJulia natively provides\
    \ a fairly complete and hierarchically organized set of predefined types (especially\
    \ the numerical ones). These are either *scalar*—like integers, floating-point\
    \ numbers, and chars,—or *container- like* structures able to hold other objects—like\
    \ multidimensional arrays, dictionaries, sets, etc.\n\nIn this chapter, we discuss\
    \ them, and in the Chapt[er 4](#index_split_000.html#p70), where we cover Julia\
    \ custom types, we consider their hierarchical organization.\n\nEvery value (even\
    \ the primitive ones) has its own unique type.\n\nBy convention types start with\
    \ a capital letter, such as Int64 or Bool.\n\nSometimes (such as for all container-like\
    \ structures and some non-\n\ncontainer ones), the name of the type is followed\
    \ by other parameters inside curly brackets, like the types of the contained elements\
    \ or the number of dimensions. For example, Array{Int64,2} would be used for a\
    \ two-dimensional array of integers.\n\nIn Julia terminology, these are referred\
    \ as to *parametric types*. In this book, we will use T as a placeholder to generically\
    \ indicate a type.\n\nThere is no division between object and non-object values.\
    \ All values in Julia are true objects having a type. Only values, not variables,\
    \ have types. Variables are simply names bound to values. The :: operator can\
    \ be used to attach type annotations to expressions and variables in programs.\n\
    \nThere are two primary reasons to do this:\n\n© Antonello Lobianco 2019\n\nA.\
    \ Lobianco, *Julia Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_2](#index_split_000.html#p31)\n\
    \nChapter 2 Data types anD struCtures\n\n• As an assertion to help confirm that\
    \ your program\n\nworks the way you expect.\n\n• To provide extra type information\
    \ to the compiler,\n\nwhich can then, in some cases, improve performance.\n\n\
    **2.1 Simple Types (Non-Containers)**\n\nIndividual characters are represented\
    \ by the Char type, e.g. a = 'a'\n\n(Unicode is fully supported). Boolean values\
    \ are represented by the Bool type, whose unique instances are true and false.\n\
    \nIn Julia, single and double quotes are not interchangeable. Double quotes produce\
    \ a char (e.g., x = 'a'), whereas single quotes\n\nproduce a string (e.g., x =\
    \ \"a\").\n\nWhile the Boolean values true and false in a integer context\n\n\
    are automatically cast and evaluated as 1 and 0, respectively, the opposite is\
    \ not true: if 0 [...] end would indeed rise\n\na non- Boolean (Int64) used in\
    \ Boolean context TypeError.\n\nThe “default” integer type in Julia is Int64 (there\
    \ are actually 10\n\ndifferent variants of integer types), and it is able to store\
    \ values between\n\n-2^63 and 2^63-1\\. Similarly, the “default” floating-point\
    \ type is Float64.\n\nComplex numbers (Complex{T}) are supported through the global\n\
    \nconstant im, representing the principal square root of -1.\n\nA complex number\
    \ can then be defined as a = 1 + 2im. The\n\nmathematical focus of Julia is evident\
    \ by the fact that there is a native type even for exact ratios of integers, Rational{Int64},\
    \ whose instances can be constructed using the // operator:\n\na = 2 // 3\n\n\
    Chapter 2 Data types anD struCtures\n\n**2.1.1 Basic Mathematic Operations**\n\
    \nAll standard basic mathematical arithmetic operators are supported in the obvious\
    \ way (+ , - , * , /). To raise a number to a power, use the ̂ operator (e.g.,\
    \ a = 3^2). Natural exponential expressions (i.e., with the Euler’s number *e*\
    \ as a base) are created with a = exp(b) or by using the global constant e (This\
    \ is not the normal letter e, but the special Unicode symbol for the Euler’s number:\
    \ type\n\nin the REPL to obtain it or use\n\nMathConstants.e.). Integer divisions\
    \ are implemented with the ÷ operator (\n\n) and their remainders are given using\
    \ the “modulo” % operator, as follows:\n\na = 3 % 2\n\nThe pi constant is available\
    \ as a global constant pi or π (\n\n).\n\n**2.1.2 Strings**\n\nThe String type\
    \ in Julia can be seen in some ways as a specialized array of individual chars\
    \ (for example, strings support indexing or looping over their individual letters\
    \ like an Array would). Unlike arrays, strings are immutable (a=\"abc\"; a[2]='B'\
    \ would raise an error).\n\nA string on a single row can be created using a single\
    \ pair of double quotes, while a string on multiple rows can use a triple pair\
    \ of double quotes: a = \"a string\"\n\nJULIA\n\nb = \"a string\\non multiple\
    \ rows\\n\"\n\nc = \"\"\"\n\na string\n\non multiple rows\n\n\"\"\"\n\na[3] #\
    \ Returns 's'\n\nChapter 2 Data types anD struCtures\n\nJulia supports most typical\
    \ string operations. For example:\n\n• split(s, \" \") defaults to whitespace\n\
    \n• join([s1,s2], \"\")\n\n• replace(s, \"toSearch\" => \"toReplace\")\n\n• strip(s)\
    \ Removes leading and trailing whitespace\n\nTo convert strings representing numbers\
    \ to integers or floats, use myInt = parse(Int,\"2017\"). To convert integers\
    \ or floats to strings, use myString = string(123).\n\n**Concatenation**\n\nThere\
    \ are several ways to concatenate strings:\n\n• Using the concatenation operator:\
    \ *\n\n• Using the string function: string(str1,str2,str3)\n\n• Using interpolation,\
    \ that is combining string variables\n\nusing the dollar sign: a = \"$str1 is\
    \ a string and\n\n$(myObject.int1) is an integer\" (note the use of\n\nparentheses\
    \ for larger expressions)\n\nWhile both the string function and the use of interpolation\n\
    \nautomatically cast compatible types (e.g., Float64 and Int64) into strings,\
    \ the concatenation operator * doesn’t. Be careful not to\n\nmistake the string\
    \ function (with a lowercase s) with the String\n\ntype and the homonymous constructor\
    \ (with a capital s).\n\n![Image 8](index-35_1.png)\n\nChapter 2 Data types anD\
    \ struCtures\n\n**2.2 Arrays (Lists)**\n\nArrays Array{T,nDims} are N-dimensional\
    \ mutable containers. In this section, we deal with one-dimensional arrays (e.g.,\
    \ Array{Float64,1}).\n\nIn the next section, we consider two or more dimensional\
    \ arrays (e.g., Array{Float64,2}).\n\nIn Julia, you may also encounter vectors\
    \ and matrices.\n\nVector{T} is just an alias for a one-dimensional Array{T,1}\
    \ and\n\nMatrix{T} is just an alias for a two-dimensional Array{T,2}.\n\nThere\
    \ are several ways to create an Array of type T:\n\n• Column vector (one-dimensions\
    \ array): a = [1;2;3]\n\nor a=[1,2,3]\n\n• Row vector (in Julia, this is a two-dimensional\
    \ array\n\nwhere the first dimension is made of a single row;\n\nsee the next\
    \ section “Multidimensional and Nested\n\nArrays”): a = [1 2 3]\n\n• Empty (zero-elements)\
    \ arrays:\n\n• a = [] (resulting in a Array{Any,1})\n\n• a = T[], e.g. a = Int64[]\n\
    \n• Using the constructor explicitly: a = Array{T,1}()\n\n• Using the Vector alias:\
    \ c = Vector{T}()\n\n• *n*-element zeros array: a=zeros(n) or\n\na=zeros(Int64,n)\n\
    \n• *n*-element ones array: a=ones(n) or a=ones(Int64,n)\n\nChapter 2 Data types\
    \ anD struCtures\n\n• *n*-element array whose content is garbage:\n\na=Array{T,1}(undef,n)\n\
    \n• *n*-element array of identical *j* elements: a=fill(j, n)\n\n• *n*-element\
    \ array of random numbers: a = rand(n)\n\nArrays are allowed to store heterogeneous\
    \ types, but in such\n\ncases, the array will be of type Any and it will be in\
    \ general much slower: x = [10, \"foo\", false].\n\nHowever, if you need to store\
    \ a limited set of types in the array, you can use the Union keyword and still\
    \ have an efficient implementation, e.g., a = Union{Int64,String,Bool}[10, \"\
    Foo\", false].\n\na = Int64[] is just shorthand for a = Array{Int64,1}() (e.g.,\
    \ a =\n\nAny[1,1.5,2.5] is equivalent to a = Array{Any,1}([1,1.5,2.5])).\n\na\
    \ = Array{Int64,1} (without the parentheses) doesn’t create\n\nan array at all,\
    \ but just assigns the “data type” Array{Int64,1} to a.\n\nSquare brackets are\
    \ used to access the elements of an array (e.g. a[1]).\n\nThe slice syntax from:step:to\
    \ is generally supported and in several contexts will return a (fast) iterator\
    \ rather than an array. To then transform the iterator into an array, use collect(myIterator),\
    \ such as:\n\na = collect(5:10)\n\nBounding limits are included in the sequence.\
    \ For example,\n\ncollect(4:2:8) will return the array [4,6,8] and collect(8:-2:4)\
    \ will return [8,6,4].\n\nTogether with the keyword end, you can use the slice\
    \ operator to\n\nreverse an array, although you are probably better off with the\
    \ dedicated function reverse(a).\n\ncollect(a[end:-1:1])\n\n![Image 9](index-37_1.png)\n\
    \nChapter 2 Data types anD struCtures\n\nYou can initialize an array with a mix\
    \ of values and ranges with either y = [2015; 2025:2030; 2100] (note the semicolons!)\
    \ or the vcat\n\ncommand (which stands for vertical concatenation):\n\ny = vcat(2015,\
    \ 2025:2030, 2100)\n\nThe following functions are useful when working with arrays:\n\
    \nBy convention, functions that end with an exclamation mark will\n\nmodify the\
    \ first of their arguments.\n\n• push!(a,b): Push an element to the end of a.\
    \ If b\n\nis an array, it will be added as a single element to a\n\n(equivalent\
    \ to Python append).\n\n• append!(a,b): Append all the elements of b to a.\n\n\
    If b is a scalar, obviously push! and append! are\n\ninterchangeable. Note that\
    \ a string is treated as an array\n\nby append!. It is equivalent to Python extend\
    \ or +=.\n\n• c = vcat(1,[2,3],[4,5]): Concatenate arrays.\n\n• pop!(a): Remove\
    \ an element from the end.\n\n• popfirst!(a): Remove an element from the beginning\n\
    \n(left) of the array.\n\n• deleteat!(a, pos): Remove an element from an\n\narbitrary\
    \ position.\n\n• pushfirst!(a,b): Add b to the beginning (left) of a\n\n(and no,\
    \ sorry, appendfirst! doesn’t exist).\n\nChapter 2 Data types anD struCtures\n\
    \n• sort!(a) or sort(a): Sort a (depending on whether\n\nyou want to modify the\
    \ original array).\n\n• unique!(a) or unique(a): Remove duplicates\n\n(depending\
    \ on whether you want to modify the original\n\narray).\n\n• reverse(a) or a[end:-1:1]:\
    \ Reverse the order of\n\nelements in the array.\n\n• in(b, a): Check for the\
    \ existence of b in a. Also\n\navailable as an operator: if b in a [...] end.\n\
    \n• length(a): Get the length of a.\n\n• a... (the “splat” operator): Convert\
    \ the values of an\n\narray into function parameters (used inside function\n\n\
    calls; see the next line).\n\n• maximum(a) or max(a...): Get the maximum value\n\
    \n(max returns the maximum value between the given\n\narguments).\n\n• minimum(a)\
    \ or min(a...): Get the minimum value\n\n(min returns the maximum value between\
    \ the given\n\narguments).\n\n• sum(a): Return the summation of the elements of\
    \ a.\n\n• cumsum(a): Return the cumulative sum of each element\n\nof a (i.e.,\
    \ it returns an array).\n\n• empty!(a): Empty an array (works only for column\n\
    \nvectors, not for row vectors).\n\n• b = vec(a): Transform row vectors into column\
    \ vectors.\n\n• shuffle(a) or shuffle!(a): Random-shuffle the\n\nelements of a\
    \ (requires using Random before).\n\nChapter 2 Data types anD struCtures\n\n•\
    \ isempty(a): Check if an array is empty.\n\n• findall(x -> x == value, myArray):\
    \ Find a value\n\nin an array and return its indexes. This is a bit tricky.\n\n\
    The first argument is an anonymous function (see\n\nChapter [3) th](#index_split_000.html#p55)at\
    \ returns a Boolean value for each value of myArray, and then findall() returns\
    \ the index\n\npositions.\n\n• deleteat!(myarray, findall(x -> x ==\n\nmyUnwantedItem,\
    \ myArray)): Delete a given item from\n\na list.\n\n• enumerate(a): Get (index,element)\
    \ pairs, i.e. return\n\nan iterator to tuples, where the first element is the\
    \ index\n\nof each element of the array a and the second is the\n\nelement itself.\n\
    \n• zip(a,b): Get (a_element, b_element) pairs, i.e.,\n\nreturn an iterator to\
    \ tuples made of elements from\n\neach of the arguments (e.g., zip(names,sex,age)\
    \ will\n\nresult in something like [(\"Marc\",'M',18),(\"Anne\",\n\n'F',16)]).\
    \ Note that, like enumerate, it is an iterator\n\nthat is returned.\n\n**2.2.1\
    \ Multidimensional and Nested Arrays**\n\nIn this section, we deal with multi-dimensional\
    \ arrays (e.g., a two-dimensional array Array{T,2} or Matrix{T}) and nested arrays,\
    \ as an array of arrays Array{Array{T,1},1} (i.e., the main structure remains\
    \ a one-dimensional array, but the individual elements are themselves arrays).\
    \ The main difference between a *matrix* and an *array of array* is that, with\
    \ a matrix, the number of elements on each column (row) must 25\n\nChapter 2 Data\
    \ types anD struCtures\n\nbe the same and rules of linear algebra apply. As in\
    \ matrix algebra, the first dimension is interpreted as the vertical dimension\
    \ (rows) and the second dimension is the horizontal one (columns).\n\nMulti-dimensional\
    \ arrays Array{T,N} can be created similarly to as one-dimensional ones (in fact,\
    \ the later are just specific cases of the former):\n\n• By column: a = [[1,2,3]\
    \ [4,5,6]]. Elements of the first\n\ncolumn, elements of the second column, and\
    \ so on. Note\n\nthat this is valid only if you write the matrix in a single line.\n\
    \n• By row: a = [1 4; 2 5; 3 6]. Elements of the first\n\nrow, elements of the\
    \ second row.\n\n• Empty (zero-element) arrays:\n\n• Using the constructor explicitly:\
    \ a = Array{T}\n\n(undef, 0, 0, 0)\n\n• Using the Matrix alias: a = Matrix{T}()\n\
    \n• *n,m,g*-element zeros array: a = zeros(n,m,g)\n\nor a = zeros(Int64,n,m,g)\n\
    \n• *n,m,g*-element ones array: a = ones(n,m,g) or\n\na = ones(Int64,n,m,g)\n\n\
    • *n,m,g*-element array whose content is garbage:\n\na = Array{T,3}(undef,n,m,g)\n\
    \n• *n,m,g*-element array of identical j elements:\n\na = fill(j,n,m,n)\n\n• *n,m,g*-element\
    \ array of of random numbers:\n\na = rand(n,m,g)\n\nMultidimensional arrays often\
    \ arise from using list comprehension.\n\nFor example, a = [3x + 2y + z for x\
    \ in 1:2, y in 2:3, z in 1:2]\n\n(see Chapter [3 for details a](#index_split_000.html#p55)bout\
    \ list comprehension).\n\nChapter 2 Data types anD struCtures\n\n*Matrix versus\
    \ Nested Arrays*\n\nnote this important difference:\n\n• a = [[1,2,3],[4,5,6]]\
    \ creates a one-dimensional array with\n\ntwo elements (each of those is again\
    \ a vector).\n\n• a = [[1,2,3] [4,5,6]] creates a two-dimensional array\n\n(a\
    \ matrix with two columns) with six scalar values.\n\nNested arrays can be accessed\
    \ with double square brackets, such as a[2][3].\n\nElements of n-dimensional arrays\
    \ can be accessed instead with the\n\na[idxDim1,idxDim2,..,idxDimN] syntax (e.g.,\
    \ a[row,col] for a matrix), where again the slice syntax can be used. For example,\
    \ given that a is a 3x3\n\nmatrix, a[1:2,:] would return a 2x3 matrix with all\
    \ the column elements of the first and second rows.\n\nNote that in order to push\
    \ elements to an array, they have to be\n\ncompatible with the array type. The\
    \ following code would not work: a = [1,2,3]; push!(a,[1 2])\n\nBecause the first\
    \ command automatically creates an Array{Int64,1}, i.e., an array of scalars,\
    \ you then try to push on it an inner array. In order for this work, a must be\
    \ defined either as a = Any[1,2,3] or more\n\nexplicitly as a = Union{Int64,Array{Int64,1}}[1,2,3].\n\
    \nBoolean selection is implemented using a Boolean array (possibly\n\nmultidimensional)\
    \ for the selection:\n\na = [[1,2,3] [4,5,6]]\n\nJULIA\n\nmask = [[true,true,false]\
    \ [false,true,false]]\n\nChapter 2 Data types anD struCtures\n\na[mask] returns\
    \ a one-dimensional array with 1, 2, and 5\\. Note\n\nthat the Boolean selection\
    \ always results in a flatted array, even if you delete a whole row or a whole\
    \ column of the original data. It is up to the programmer to reshape the data\
    \ accordingly.\n\nFor row vectors, both a[2] and a[1,2] return the second\n\n\
    element.\n\nSeveral functions are particularly useful when working with\n\nn-dimensional\
    \ arrays (on top of those you saw in the previous section):\n\n• size(a): Return\
    \ a tuple (i.e., an immutable list) with\n\nthe sizes of the *n* dimensions.\n\
    \n• ndims(a): Return the number of dimensions of the\n\narray (e.g., 2 for a matrix).\n\
    \n• reshape(a, nElementsDim1, nElementsDim2,...,\n\nnElemensDimN): Reshape the\
    \ elements of a in a new\n\nn-dimensional array with the dimensions given.\n\n\
    Returns a DimensionMismatch error if the new\n\ndimensions are not consistent\
    \ with the number of\n\nelements held by a.\n\n• dropdims(a, dims=(dimToDrop1,dimToDrop2)):\n\
    \nRemove the specified dimensions, provided that the\n\nspecified dimension has\
    \ only a single element,\n\ne.g., a = rand(2,1,3); dropdims(a,dims=(2)).\n\n•\
    \ transpose(a) or a': Transpose a one- or\n\ntwo- dimensional array.\n\nChapter\
    \ 2 Data types anD struCtures\n\nDo not confuse reshape(a) with transpose(a):\n\
    \njulia> a = [[1 2 3]; [4 5 6]]\n\nJULIA\n\n2×3 Array{Int64,2}:\n\n1 2 3\n\n4\
    \ 5 6\n\njulia> reshape(a,3,2)\n\n3×2 Array{Int64,2}:\n\n1 5\n\n4 3\n\n2 6\n\n\
    julia> transpose(a)\n\n3×2 LinearAlgebra.Adjoint{Int64,Array{Int64,2}}:\n\n1 4\n\
    \n2 5\n\n3 6\n\n• collect(Iterators.flatten(a)), vec(a), or a[:]:\n\nFlatten a\
    \ multi-dimensional array into a column vector.\n\nnote that reshape(), transpose(),\
    \ and vec() perform a\n\n*shadow copy*, returning a different “view” of the underlying\
    \ data (so modifying the original matrix modifies the reshaped, transposed, or\
    \ flatted matrix). you can use collect()to force a *deep copy*, where the new\
    \ matrix holds independent data (see the section “Memory and Copy Issues” for\
    \ details).\n\n![Image 10](index-44_1.png)\n\nChapter 2 Data types anD struCtures\n\
    \n• hcat(col1, col2): Concatenate horizontally anything\n\nthat makes sense to\
    \ concatenate horizontally (vectors,\n\nmatrices, DataFrames,…).\n\n• vcat(row1,\
    \ row2): Concatenate vertically anything\n\nthat makes sense to concatenate vertically\
    \ (vectors,\n\nmatrices, DataFrames,…).\n\n**2.3 Tuples**\n\nUse tuples (Tuple{T1,T2,...})\
    \ to create a immutable list of elements: t = (1,2.5,\"a\")\n\nOr without parentheses:\n\
    \nt = 1,2.5,\"a\"\n\n*Immutable* refers to the fact that once they are created,\
    \ elements of this data structure cannot be added, removed, or changed (rebound\
    \ to other objects).\n\nnote that if the element in a tuple is itself mutable\
    \ (e.g., an\n\nArray), this is still allowed to mutate (i.e. “internally” change).\
    \ What is “immutable” is the memory addresses or the actual bits of the\n\nvarious\
    \ objects in the tuple.\n\nTuples can be easily unpacked to multiple variables:\
    \ var1, var2 =\n\n(x,y). This is useful, for example, for collecting the values\
    \ of functions returning multiple values, where the returned object would be a\
    \ tuple.\n\nChapter 2 Data types anD struCtures\n\nIn contrast to arrays, tuples\
    \ remain efficient even when hosting\n\nheterogeneous types, as the information\
    \ on the types of each element hosted is retained in the type signature. For example,\n\
    \ntypeof(((1,2.5,\"a\")) is *not* Tuple{Any} (as it would be for an array) but\
    \ Tuple{Int64,Float64,String} (you will see why this\n\nmatters in Chapter [8.).](#index_split_001.html#p125)\n\
    \nUseful tricks:\n\n• Convert a tuple into an array: t=(1,2,3); a = [t...]\n\n\
    or a = [i[1] for i in t] or a=collect(t)\n\n• Convert an array into a tuple: t\
    \ = (a...,) (note the\n\ncomma after the splat operator)\n\n**2.4 Named Tuples**\n\
    \nNamed tuples (NamedTuple) are collections of items whose position in the collection\
    \ (index) can be identified not only by their position but also by their name.\n\
    \n• nt = (a=1, b=2.5): Define a NamedTuple\n\n• nt.a: Access the elements with\
    \ the dot notation\n\n• keys(nt): Return a tuple of the keys\n\n• values(nt):\
    \ Return a tuple of the values\n\n• collect(nt): Return an array of the values\n\
    \n• pairs(nt): Return an iterable of the pairs (key,value).\n\nUseful for looping:\
    \ for (k,v) in pairs(nt) [...] end\n\nChapter 2 Data types anD struCtures\n\n\
    As with “normal” tuples, named tuples can hold any value, but cannot be modified\
    \ (i.e., are immutable). They too remain efficient even when hosting heterogeneous\
    \ types.\n\nBefore Julia 1.0, named tuples were implemented in a separate\n\n\
    package (NamedTuple.jl, at [https://github.com/](https://github.com/JuliaData/NamedTuples.jl)\n\
    \n[JuliaData/NamedTuples.jl.)](https://github.com/JuliaData/NamedTuples.jl) now\
    \ that they are implemented in the Julia core, use of that package implementation\
    \ is discouraged, unless you have to use packages that still depend on it.\n\n\
    **2.5 Dictionaries**\n\nDictionaries (Dict{Tkey,Tvalue}) store mappings from keys\
    \ to values and they have an apparently random sorting.\n\nYou can create an empty\
    \ (zero-element) dictionary with mydict =\n\nDict() or specify the key and values\
    \ types with Dict{String,Int64}(). To initialize a dictionary with some values,\
    \ use:\n\nmydict = Dict('a'=>1, 'b'=>2, 'c'=>3)\n\nHere are some useful methods\
    \ for working with dictionaries:\n\n• mydict[akey] = avalue: Add pairs to the\
    \ dictionary.\n\n• delete!(amydict,'akey'): Delete the pair with the\n\nspecified\
    \ key from the dictionary.\n\n• map((i,j) -> mydict[i]=j, ['a','b','c'],\n\n[1,2,3]):\
    \ Add pairs using maps (i.e., from vectors of\n\nkeys and values to the dictionary).\n\
    \n• mydict['a']: Retrieve a value using the key (it raises an\n\nerror if the\
    \ key doesn’t exist).\n\nChapter 2 Data types anD struCtures\n\n• get(mydict,'a',0):\
    \ Retrieve a value with a default\n\nvalue for a nonexistent key.\n\n• keys(mydict):\
    \ Return all the keys (the result is an\n\niterator, not an array). Use collect()\
    \ to transform it.\n\n• values(mydict): Return all the values (result is again\n\
    \nan iterator).\n\n• haskey(mydict, 'a'): Check if a key exists.\n\n• in(('a'\
    \ => 1), mydict): Check if a given key/value pair\n\nexists (that is, if the key\
    \ exists and has that specific value).\n\nYou can iterate through the key and\
    \ the values of a dictionary at the same time:\n\nfor (k,v) in mydict\n\nJULIA\n\
    \nprintln(\"$k is $v\")\n\nend\n\nWhile named tuples and dictionaries can look\
    \ similar, there are some important differences between them:\n\n• Name tuples\
    \ are immutable, while dictionaries are\n\nmutable.\n\n• Dictionaries are type-unstable\
    \ if different types of\n\nvalues are stored, while named tuples remain type-\n\
    \nstable:\n\n• d = Dict(:k1=>\"v1\", :k2=>2) #\n\nDict{Symbol,Any}\n\n• nt = (k1=\"\
    v1\", k2=2) # NamedTuple{(:k1,\n\n:k2),Tuple{String,Int64}}\n\n• The syntax is\
    \ a bit less verbose and readable with\n\nnamed tuples: nt.k1 versus d[:k1].\n\
    \nChapter 2 Data types anD struCtures\n\nOverall, named tuples are generally more\
    \ efficient and should be\n\nthought more as anonymous structs rather than as\
    \ dictionaries.\n\n**2.6 Sets**\n\nUse sets (Set{T}) to represent collections\
    \ of unordered, unique values.\n\nSets are mutable collections.\n\nHere are some\
    \ methods:\n\n• s = Set() or s = Set{T}(): Create an empty (zero-\n\nelement)\
    \ set.\n\n• s = Set([1,2,2,3,4]): Initialize a set with values.\n\nNote that the\
    \ set will then have only one instance of 2.\n\n• push!(s, 5): Add elements.\n\
    \n• delete!(s,1): Delete elements.\n\n• intersect(set1,set2), union(set1,set2),\n\
    \nsetdiff(set1,set2): Set common operations of\n\nintersection, union, and difference.\n\
    \n**2.7 Memory and Copy Issues**\n\nIn order to avoid copying large amounts of\
    \ data, Julia by default copies only the memory addresses of objects, unless the\
    \ programmer explicitly requests a so-called “deep” copy or the compiler determines\
    \ that an actual copy is more efficient.\n\nUse copy() or deepcopy() when you\
    \ don’t want subsequent\n\nmodifications of the copied object to apply to the\
    \ original object.\n\nChapter 2 Data types anD struCtures\n\nIn detail:\n\nEqual\
    \ sign (a=b)\n\n• This performs a *name binding*, i.e., it binds (assigns)\n\n\
    the entity (object) referenced by b to the a identifier\n\n(the variable name).\n\
    \n• The possible results are as follows:\n\n• If b rebinds to some other object,\
    \ a remains\n\nreferenced to the original object.\n\n• If the object referenced\
    \ by b mutates (i.e., it\n\ninternally changes), so does (being the same\n\nobject)\
    \ those referenced by a.\n\n• If b is immutable and small in memory, under some\n\
    \ncircumstances, the compiler would instead create a\n\nnew object and bind it\
    \ to a, but being immutable for\n\nthe user this difference would not be noticeable\n\
    \n• As for many high level languages, you don’t need\n\nto explicitly worry about\
    \ memory leaks. A garbage\n\ncollector exists so that objects that are no longer\n\
    \naccessible are automatically destroyed.\n\nChapter 2 Data types anD struCtures\n\
    \na = copy(b)\n\n• This creates a new, “independent” copy of the object\n\nand\
    \ binds it to a. This new object may reference other\n\nobjects through their\
    \ memory addresses. In that case, it\n\nis their memory addresses that are copied\
    \ and not the\n\nreferenced objects.\n\n• The possible results are as follows:\n\
    \n• If these referenced objects (e.g., the individual\n\nelements of the vector)\
    \ are rebound to some other\n\nobjects, the new object referenced by a maintains\n\
    \nthe reference to the original objects.\n\n• If these referenced objects mutate,\
    \ so do (being the\n\nsame objects) the objects referenced by the new\n\nobject\
    \ referenced by a.\n\na = deepcopy(b)\n\n• Everything is “deep copied” recursively.\n\
    \nChapter 2 Data types anD struCtures\n\nThe following code snippet highlights\
    \ the differences between these three methods for “copying” an object:\n\njulia>\
    \ a = [[[1,2],3],4] # [[[1, 2], 3], 4]\n\nJULIA\n\njulia> b = a # [[[1, 2], 3],\
    \ 4]\n\njulia> c = copy(a) # [[[1, 2], 3], 4]\n\njulia> d = deepcopy(a) # [[[1,\
    \ 2], 3], 4]"
