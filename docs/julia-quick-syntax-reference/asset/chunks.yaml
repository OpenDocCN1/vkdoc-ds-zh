    wideWideDf = join(wideDf_p,wideDf_c, on=[:region,:year])\n```\n\n### The Pivot\
    \ Function\n\nThe `pivot(df, [:rowField(s)], :variableCol, :valueCol; <keyword\
    \ arguments>)` function from the `LAJuliaUtils.jl` package (<https://github.com/sylvaticus/LAJuliaUtils.jl>)\
    \ can be used in order to pivot and optionally filter and sort a stacked (long)\
    \ DataFrame into a single function using a spreadsheet-like pivot fashion.\n\n\
    `pivot` accepts, like `unstack`, the list of columns that should remain as categorical\
    \ variables even in the wide format, the name of the column storing the category\
    \ that will have to be expanded on the horizontal axis, and the name of the column\
    \ containing the corresponding values.\n\nThe optional keywords are as follows:\n\
    \n- `ops=sum`: The operations to perform on the data, the default is to sum them.\
    \ `ops` can be any supported Julia operation over a single array, for example:\
    \ `sum`, `mean`, `length`, `countnz`, `maximum`, `minimum`, `var`, `std`, and\
    \ `prod`. Multiple operations can be specified using an array, and in such cases,\
    \ an additional `op` column is created to index them.\n- `filter`: An optional\
    \ filter, in the form of a dictionary of `column_to_filter => [list of admissible\
    \ values]` (only the `in` filter is supported).\n- `sort`: Optional row fields\
    \ to sort. Using a tuple instead of just `:colname`, you can specify reverse ordering\
    \ (e.g., `(:colname, true)`) or even a custom sort order (e.g., `(:colname, [val1,val2,val3])`).\
    \ In such cases, the elements that you do not specify are placed at the end. You\
    \ can pass multiple columns to be sorted in an array, e.g., `[(:col1,true),:col2,(:col3,[val1,val2,val3])]`.\n\
    \nFor example, the `pivot` function can be used with the timber long DataFrame\
    \ in the following way:\n\n```\npivDf = pivot(longDf, [:region, :product],:variable,:value,\n\
    \    JULIA\n    ops = [mean, var],\n    filter = Dict(:variable => [:consumption]),\n\
    \    sort = [:product, (:region, true)]\n)\n```\n\n| **Region** | **Product**\
    \ | **Op** | **Consumption** |\n|------------|-------------|--------|-----------------|\n\
    | US         | hardwood    | mean   | 5.85            |\n| US         | hardwood\
    \    | var    | 4.805           |\n| eU         | hardwood    | mean   | 3.75\
    \            |\n| eU         | hardwood    | var    | 0.605           |\n| US\
