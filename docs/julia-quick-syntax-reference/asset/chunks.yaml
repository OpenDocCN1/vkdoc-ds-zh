    \ 10-1）：\n\n```julia\nfit.param # [497.07, 0.05, 53.5]\n\nfitX = 0:maximum(obsVols.age)*1.2\n\
    fitY = [fit.param[1] / (1 + exp(-fit.param[2] * (x - fit.param[3]))) for x in\
    \ fitX]\n\nplot(fitX, fitY, seriestype=:line, label=\"拟合值\")\nplot!(obsVols.age,\
    \ obsVols.vol, seriestype=:scatter, label=\"观测值\")\nplot!(obsVols.age, fit.resid,\
    \ seriestype=:bar, label=\"残差\")\n```\n\n![Image 22](img/index-206_1.png)\n\n\
    第 10 章 数学库\n\n***Figure 10-1**. 观测数据与拟合数据对比*\n\n## 第 11 章\n\n## 工具\n\n我们以对以下第三方包的讨论来结束本书，如下表所示：\n\
    \n| 包名        | URL                                                  | 版本    \
    \ |\n|-------------|------------------------------------------------------|----------|\n\
    | Weave.jl    | [`github.com/mpastell/weave.jl`](https://github.com/mpastell/weave.jl)\
    \ | v0.9.1   |\n| ZipFile.jl  | [`github.com/fhs/ZipFile.jl`](https://github.com/fhs/ZipFile.jl)\
    \ | v0.8.3   |\n| Interact.jl | [`github.com/JuliaGizmos/Interact.jl`](https://github.com/JuliaGizmos/Interact.jl)\
    \ | v0.10.2  |\n| Mux.jl      | [`github.com/JuliaWeb/Mux.jl`](https://github.com/JuliaWeb/Mux.jl)\
    \ | v0.7.0   |\n\n我还提到了一些其他更通用的 Julia 包。\n\n### 11.1 Weave 用于动态文档\n\n`Weave` ([`github.com/mpastell/weave.jl`](https://github.com/mpastell/weave.jl))\
    \ 允许开发者生成所谓的\"动态文档\"，其中产生\"结果\"的代码直接嵌入到文档中。文档的总体结构是 *markdown* 文档，而 Julia 代码则作为*代码单元*插入到主文档中。\n\
    \n在许多情况下，这非常有用，因为它使得从假设到结果，再到这些结果的呈现和讨论的逻辑能够在同一个文档中呈现。\n\n© Antonello Lobianco\
    \ 2019\nA. Lobianco, *Julia Quick Syntax Reference*, `doi.org/10.1007/978-1-4842-5190-4_11`\n\
    \n第 11 章 工具\n\n`Weave` 将代码与（基于 markdown 的）文档混合在一起，类似于 Jupyter Notebook。其主要优点是代码单元不是*预先定义*的，但你仍然可以在\
    \ Juno 中运行你需要的那部分代码，而无需依赖于你在文档中组织单元的方式。这要归功于名为 *language-weave* 的 Atom 包 ([`atom.io/packages/language-weave`](https://atom.io/packages/language-weave))。\n\
    \n来看一个例子，将以下文档视为一个扩展名为`.jmd`的文件（例如 `testWeave.jmd`）：\n\n```julia\ntitle : 测试包含内嵌\
    \ Julia 代码和引用的文档\ndate : 2019 年 9 月 5 日\nbibliography: biblio.bib\n```\n\n# 第\
    \ 1 节 (与上方文档标题之间留两行)\n\n`Weave.jl`，在 @Pastell:2017 中提到，是一个由 Matti Pastell 为 Julia\
    \ 开发的科学报告生成器/文学化编程工具，类似于 R 语言的 Knitr [见 @Xie:2015]。\n\n## 1.1 小节\n\n这将打印一个图。注意，使用\
    \ `echo=false` 时，我们不会在最终 PDF 中渲染源代码：\n\n```{julia;echo=false}\nusing Plots\npyplot()\n\
    plot(sin, -2pi, pi, label=\"正弦函数\")\n```\n\n第 11 章 工具\n\n这里，我们将在 PDF 中同时渲染脚本源代码及其输出：\n\
    \n```{julia;}\nusing DataFrames\ndf = DataFrame(\n    colour = [\"绿色\",\"蓝色\"\
    ,\"白色\",\"绿色\",\"绿色\"],\n    shape = [\"圆形\", \"三角形\", \"正方形\",\"正方形\",\"圆形\"\
    ],\n    border = [\"虚线\", \"实线\", \"实线\", \"实线\", \"虚线\"],\n    area = [1.1, 2.3,\
    \ 3.1, missing, 5.2]\n)\ndf\n```\n\n另请注意，我们可以引用之前代码块（或\"单元\"，沿用 Jupyter 的术语）中定义的变量：\n\
    \n```{julia;}\ndf.colour\n```\n\n### 子小节\n\n更完整的示例，请参见 [Weave 文档](http://weavejl.mpastell.com/stable/)。\n"
