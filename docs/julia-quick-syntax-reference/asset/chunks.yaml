    \ sumColRow(M) # 中位时间: 4.787 ms\n```\n\n## 8.2 代码并行化\n\nJulia 提供了核心功能来促进代码并行化，既可以使用多线程，也可以使用多进程。线程共享同一内存（因此无需在多个线程之间复制数据），但受限于在同一\
    \ CPU 上运行。此外，很难“保证”安全的多线程操作。Julia 中的线程支持仍处于实验阶段，尽管其开发进展迅速 2。\n\n进程各自拥有独立的内存（因此数据需要在进程之间复制，这代表了需要与并行执行带来的优势相平衡的计算成本），并且可以分布在多个\
    \ CPU 甚至多台机器上（例如，通过 SSH 连接）。由于 Julia 中的多进程并行化已经成熟且稳定，在本节的剩余部分，我将讨论它。你看到的所有函数都是\
    \ `Distributed` 标准库包的一部分。\n\n### 8.2.1 添加和移除进程\n\n进程可以随时添加和移除：\n\n```\nwksIDs\
    \ = addprocs(3) # 2,3,4\n```\n\n```\nprintln(\"工作进程 pid: \")\nfor pid in workers()\n\
    \    println(pid) # 2,3,4\nend\n\nrmprocs(wksIDs[2]) # 或 rmprocs(workers()[2])\
    \ 移除进程 pid 3\n\nprintln(\"工作进程 pid: \")\nfor pid in workers()\n    println(pid)\
    \ # 2,4 剩余\nend\n\n@everywhere println(myid()) # 2,4\n```\n\n第一行添加了三个进程。在此例中，它们被添加到运行主\
    \ Julia 进程的同一台机器上，但可以在 `addprocs()` 中直接指定 SSH 连接详情，以便将进程添加到其他机器（这些机器也必须安装 Julia）。\n\
    \n通常，让 `n` 等于机器上可用的核心数是合理的。\n\n也可以使用命令行标志 `-p`（例如，`./julia -p 2`）直接启动带有多个进程的 Julia。`-p`\
    \ 参数会隐式加载 `Distributed` 模块。\n\n在此示例中，新进程的“内部 ID”（不同于操作系统分配的 pid）被保存在数组 `wksIDs`\
    \ 中，尽管你并不一定需要它，因为调用 `workers()` 也会返回该数组。\n\n主 Julia 进程（例如，提供交互式提示符的进程）的 pid 始终为\
    \ 1，并且除非它是唯一进程，否则它不被视为工作进程。\n\n然后，你可以检查活动的工作进程，并通过 `rmprocs(pid)` 移除不再需要的进程。\n\
    \n最后，你可以使用函数 `myid()` 返回进程的 PID，并使用 `@everywhere` 宏将该函数传播到所有工作进程并打印。\n\n### 8.2.2\
    \ 在项目列表上运行繁重计算\n\n本节考虑两种常见的并行化模式。\n\n第一种模式涉及对一个项目列表执行计算开销很大的操作，并且你对每个项目的结果都感兴趣。关键在于，每个项目的计算是独立于其他项目的。\n\
    \n例如，你将重用之前见过的 `fib` 函数。首先需要确保所有进程（假设你已使用 `addprocs(3)` 添加了三个工作进程）都知道你希望它们使用的函数。你可以在函数定义前使用\
    \ `@everywhere` 宏，以便将该函数传输给所有工作进程（如果你在后续阶段添加更多进程，它们将无法访问该函数）。如果你需要在工作线程中调用多个函数（或者需要调用多个子函数），一个方便的选择是将它们及其所需的全局变量定义在一个以\
    \ `@everywhere` 宏为前缀的 `begin` 块中（即 `@everywhere begin [共享函数定义] end`），或者将它们放入一个文件并运行\
    \ `@everywhere include(\"computationalcode.jl\")`。\n\n然后，你可以创建输入数据数组，并使用 `pmap(op,\
    \ inputData)` 对每个元素运行繁重操作：\n\n```\na = rand(1:35,100)\n```\n\n```\n@everywhere\
    \ function fib(n)\n    if n == 0 return 0 end\n    if n == 1 return 1 end\n  \
    \  return fib(n-1) + fib(n-2)\nend\n\n@benchmark results = map(fib, a)      #\
    \ 串行: 中位时间: 490.473 ms\n@benchmark results = pmap(fib, a)     # 并行: 中位时间: 249.295\
    \ ms\n```\n\n`pmap` 函数会自动动态地选取“空闲”进程，为其分配任务，并将结果合并到返回的数组中。只有函数的计算部分在工作进程中执行。当函数的计算成本很高时（例如本例），`pmap`\
    \ 非常方便。但请注意，即使你使用了三个工作线程，计算时间的缩减系数也远低于三 3。\n\n### 8.2.3 聚合结果\n\n第二种情况是，你想要对每个项目执行一个小型操作，但同时希望最后执行一个“聚合函数”来获取一个标量值（如果输入是矩阵，则获取一个数组）。\n\
    \n在这些情况下，你可以使用 `@distributed (aggregationFunction) for` 结构。例如，你并行执行除以 2 的操作，然后使用\
