    call the function f1([2,3],[3,4]). The solution is to use the function broadcast(),
    which takes the original function as its first argument followed by the original
    function’s arguments:


    broadcast(f1,[2,3],[3,4]).


    The output is a vector that holds the result of the original function applied
    first to (a=2,b=3) and then to (a=3,b=4).


    A handy shortcut to broadcast is to use the dot notation, i.e., the original function
    name followed by a dot: f1.([2,3],[3,4]).


    Sometimes the original function natively takes some parameters as a vector, and
    you want to limit the broadcast to the scalar parameters.


