    \n### 9.1.9 数据透视\n\n表格化数据可以使用两种布局等效表示：*长格式*和*宽格式*。\n\n*长格式*布局是指你在单独的列中指定每个维度，然后有一个单独的列存放你认为的“值”。如果数据库中有多个变量，那么“变量”也会成为一个维度列。\n\
    \n例如，使用木材市场示例，表 9-1 显示了一个长格式的表格。\n\n***表 9-1.** 长格式表格*\n\n| **地区** | **产品** |\
    \ **年份** | **变量** | **值** |\n|------------|-------------|----------|--------------|-----------|\n\
    | 美国       | 硬木    |          | 产量   | 3.3       |\n| 美国       | 硬木    |     \
    \     | 产量   | 3.3       |\n| 美国       | 硬木    |          | 产量   | 3.2       |\n\
    | 美国       | 软木    |          | 产量   | 2.3       |\n| ...等..   |             |\
    \          |              |           |\n\n长格式可读性较差，但非常易于操作和进行数据分析。\n\n另一方面，在*宽格式*中，值在多个列上表示，其中一个或多个维度沿水平轴表示。参见表\
    \ 9-2。\n\n***表 9-2.** 宽格式表格*\n\n| **地区** | **产品** | **年份** | **产量** | **消费量**\
    \ |\n|------------|-------------|----------|----------------|-----------------|\n\
    | 美国       | 硬木    |          | 3.3            | 4.3             |\n| 美国     \
    \  | 硬木    |          | 3.2            | 7.4             |\n| 美国       | 软木  \
    \  |          | 2.3            | 2.5             |\n| 美国       | 软木    |     \
    \     | 2.1            | 9.8             |\n| ...等..   |             |       \
    \   |                |                 |\n\n木材示例的原始格式是一个宽表，但你也可以使用多个水平轴创建更宽的表格（`DataFrames`\
    \ 包不支持）。参见表 9-3。\n\n***表 9-3.** 更宽的格式表格（带有多个水平轴）*\n\n|             | **产量** |\
    \            | **消费量** |            |\n|-------------|----------------|------------|-----------------|------------|\n\
    |             | **硬木**   | **软木** | **硬木**    | **软木** |\n| 美国          | 3.3\
    \            | 2.3        | 4.3             | 2.5        |\n| 美国          | 3.2\
    \            | 2.1        | 7.4             | 9.8        |\n| 欧盟          | 2.7\
    \            | 1.5        | 3.2             | 6.5        |\n| 欧盟          | 2.8\
    \            | 1.3        | 4.3             |            |\n\n在水平和垂直维度之间移动轴的操作称为*透视*。具体来说，*堆叠*将列移动并扩展为新的行，因此从宽格式转换为长格式。*取消堆叠*则相反，它将行提取出来并将其值放置为新的列，从而创建一个更“宽”的表格。\n\
    \n### 堆叠列\n\n`DataFrames` 包提供了 `stack(df, [cols])` 函数，你需要指定要堆叠的列，以及 `melt(df,\
    \ [cols])` 函数，你需要指定其他列，即已经处于堆叠形式的分类列。\n\n最后，`stack(df)`——不带列名——会自动堆叠所有浮点型列。\n\n\
    请注意，堆叠列的标题将作为数据插入到 `variable` 列（变量名是符号，而非字符串）中，相应的值则插入到 `value` 列中。\n\n```\nlongDf\
    \ = stack(df,[:production,:consumption])\n    JULIA\nlongDf1 = melt(df,[:region,:product,:year])\n\
    longDf2 = stack(df)\nlongDf == longDf1 == longDf2 # true\n\n│ 行  │ 变量  │ 值 │ 地区\
    \ │ 产品 │ 年份 │\n│     │ Symbol │ Float64 │ String │ String │ Int64 │\n├─────┼──────────┼────────┼────────┼─────────┼───────┤\n\
    │ 1   │ 产量 │ 3.3   │ 美国     │ 硬木 │ 2010 │\n│ 2   │ 产量 │ 3.2   │ 美国     │ 硬木 │\
    \ 2011 │\n│ 3   │ 产量 │ 2.3   │ 美国     │ 软木 │ 2010 │\n│ 4   │ 产量 │ 2.1   │ 美国 \
    \    │ 软木 │ 2011 │\n...等等...\n```\n\n### 取消堆叠\n\n`DataFrames` 包还提供了 `unstack(longDf,\
    \ [:rowField(s)], :variableCol, :valueCol)`，你需要提供即使在宽格式下也应保持为分类变量的列列表、存储需要在水平轴上展开的类别的列名，以及包含相应值的列名。\n\
    \n你可以使用 `unstack(longDf, :variableCol, :valueCol)` 省略分类变量列表，这样除了定义列名的列和定义列值的列之外的所有现有列都将作为分类列保留：\n\
    \n```\nwideDf = unstack(longDf,[:region, :product, :year],:variable,:value)\n\
    \    JULIA\nwideDf1 = unstack(longDf,:variable,:value)\nwideDf == wideDf1 # true\n\
    ```\n\n### 多轴表格\n\n`unstack` 的 `:variable` 参数是标量而非向量的原因是 Julia DataFrames 仅支持一个水平轴。\n\
    \n虽然多水平轴 DataFrames 在分析和处理时很混乱，但在某些上下文中作为数据的最终展示形式可能很有用。你可以通过在不同列上取消堆叠然后水平合并子数据框来模拟多水平轴\
    \ DataFrames。要获得表 9-3，你可以使用：\n\n```\nwideDf_p = unstack(wideDf,[:region,:year],:product,:production)\n\
    \    JULIA\nwideDf_c = unstack(wideDf,[:region,:year],:product,:consumption)\n\
    rename!(wideDf_p, Dict(:Hardwood => :prod_Hardwood, :Softwood => :prod_Softwood))\n\
    rename!(wideDf_c, Dict(:Hardwood => :cons_Hardwood, :Softwood => :cons_Softwood))\n\
    wideWideDf = join(wideDf_p,wideDf_c, on=[:region,:year])\n```\n\n### 透视函数\n\n\
    `LAJuliaUtils.jl` 包（<https://github.com/sylvaticus/LAJuliaUtils.jl>）中的 `pivot(df,\
    \ [:rowField(s)], :variableCol, :valueCol; <keyword arguments>)` 函数可用于以类似电子表格透视的方式，在单个函数中透视并可选地过滤和排序堆叠（长格式）DataFrame。\n\
    \n`pivot` 与 `unstack` 类似，接受即使在宽格式下也应保持为分类变量的列列表、存储需要在水平轴上展开的类别的列名，以及包含相应值的列名。\n\
    \n可选关键字如下：\n\n- `ops=sum`：对数据执行的操作，默认为求和。`ops` 可以是任何支持的单个数组上的 Julia 操作，例如：`sum`、`mean`、`length`、`countnz`、`maximum`、`minimum`、`var`、`std`\
    \ 和 `prod`。可以使用数组指定多个操作，在这种情况下，会创建一个额外的 `op` 列来索引它们。\n- `filter`：可选的过滤器，形式为 `待过滤列\
    \ => [可接受值列表]` 的字典（仅支持 `in` 过滤器）。\n- `sort`：可选的行字段进行排序。使用元组而不是简单的 `:colname`，你可以指定反向排序（例如\
    \ `(:colname, true)`）甚至自定义排序顺序（例如 `(:colname, [val1,val2,val3])`）。在这种情况下，你未指定的元素将被放在末尾。你可以以数组形式传递多个要排序的列，例如\
    \ `[(:col1,true),:col2,(:col3,[val1,val2,val3])]`。\n\n例如，`pivot` 函数可以以以下方式与木材长格式\
    \ DataFrame 一起使用：\n\n```\npivDf = pivot(longDf, [:region, :product],:variable,:value,\n\
    \    JULIA\n    ops = [mean, var],\n    filter = Dict(:variable => [:consumption]),\n\
    \    sort = [:product, (:region, true)]\n)\n```\n\n| **地区** | **产品** | **操作**\
    \ | **消费量** |\n|------------|-------------|--------|-----------------|\n| 美国 \
    \      | 硬木    | 平均值   | 5.85            |\n| 美国       | 硬木    | 方差    | 4.805\
    \           |\n| 欧盟       | 硬木    | 平均值   | 3.75            |\n| 欧盟       | 硬木\
    \    | 方差    | 0.605           |\n| 美国       | 软木    | 平均值   | 6.15          \
    \  |\n| 美国       | 软木    | 方差    | 26.645          |\n| 欧盟       | 软木    | 平均值\
    \   | 4.75            |\n| 欧盟       | 软木    | 方差    | 6.125           |\n\n除了关键字参数外，与\
    \ `unstack` 的主要区别在于，如果你手动列出分类列但省略了一列或多列（例如，你在 `wideDf = unstack(longDf,[:region,\
    \ :product],:variable,:value)` 中省略了 `:year`），你最终会在取消堆叠的 DataFrame 中得到重复条目（行），而同一类别下的最后条目会覆盖最早的条目。另一方面，使用\
    \ `pivot` 时，所有条目都会被考虑，并使用指定的聚合操作（如果未指定，则为 `sum`）进行处理。\n\n### 排序\n\nDataFrames\
    \ 可以使用多列进行排序，使用 `sort!(df, (:columnsToSort), rev = (reverseSortingFlags))`（例如，`sort!(df,(:year,\
    \ :region, :product), rev = (false, true, false))`）。（可选的）反向排序参数 (`rev`) 必须是一个布尔值元组，其大小与\
    \ `cols` 参数相同。\n\n如果你需要对行进行自定义排序，你可以再次依赖 `LAJuliaUtils`，它提供了 `customSort!(df,\
    \ sortops)`，其中 `sortops` 与你之前在 `pivot` 函数中看到的 `sort` 选项相同。\n\n### 9.1.10 数据框导出\n\
    \n#### 导出为 CSV\n\n将 DataFrames 导出为 CSV 格式直接由我们在第 5 章中看到的 `CSV.jl` 包支持：\n\n```\n\
    CSV.write(\"file.csv\", df)\n```\n\n有关导出选项，请参考第 5 章“导出为 CSV”部分。\n\n#### 导出为 OpenDocument\
    \ 电子表格文件\n\n同样，导出为 OpenDocument 电子表格格式（由 OpenOffice、LibreOffice、MS Excel 等支持）可通过\
    \ `OdsIO_` 包（<https://github.com/sylvaticus/OdsIO.jl>）实现：\n\n```\nods_write(\"\
    spreadsheet.ods\",Dict( (\"MyDestSheet\",3,2) => df) )\n```\n\n其中字典的键是一个三元组，指定工作表名称和左上角单元格的数值坐标，以确定导出\
    \ DataFrame 的位置。\n\n#### 导出为矩阵\n\n你可以使用 `convert` 将数据库或其一部分转换为矩阵。\n\n- `convert(Matrix,\
    \ df)`：转换为 `Array{Any,2}`\n- `convert(Matrix{Union{String,Int64,Float64}}, df)`：更好，转换为\
    \ `Array{Union{Float64, Int64, String},2}`\n- `convert(Matrix, df[:,[:production,\
    \ :consumption]])`：选取同类型列，生成一个 `Array{Float64,2}`\n\n#### 导出为字典\n\n要将 DataFrame\
    \ 转换为字典，可以使用 `LAJuliaUtils` 包提供的 `toDict(df, [:dimCols], :valueCol)`，它通过指定用作键的列（按给定顺序）和用于存储字典值的列，将\
    \ DataFrame 转换为字典。\n\n例如，`toDict(df,[:region,:product,:year],:production)` 将产生以下结果：\n\
    \n```\nDict{Any,Any} with 8 entries:\n    JULIA\n    (\"EU\", \"Softwood\", 2011)\
    \ => 1.3\n    (\"US\", \"Softwood\", 2010) => 2.3\n    (\"US\", \"Hardwood\",\
    \ 2010) => 3.3\n    (\"US\", \"Hardwood\", 2011) => 3.2\n    (\"EU\", \"Softwood\"\
    , 2010) => 1.5\n    (\"US\", \"Softwood\", 2011) => 2.1\n    (\"EU\", \"Hardwood\"\
    , 2010) => 2.7\n    (\"EU\", \"Hardwood\", 2011) => 2.8\n```\n\n#### 导出为 hdf5\
    \ 格式\n\n要使用 `HDF5` 包（<https://github.com/JuliaIO/HDF5.jl>）处理 hdf5，某些系统可能需要你安装系统级的\
    \ hdf5 二进制文件。例如，在基于 Debian 的 Linux 发行版中，你应该运行 `sudo apt-get install hdf5-tools`。\n\
    \n`HDF5` 包不直接支持 DataFrames，因此你需要先将它们导出为矩阵。进一步的限制是它不接受 `Any` 或 `Union{}` 类型的矩阵，因此你可能需要分两部分导出\
    \ DataFrame——字符串和数值列分别导出。\n\n```\nh5write(\"out.h5\", \"mygroup/myDf\", convert(Array,\
