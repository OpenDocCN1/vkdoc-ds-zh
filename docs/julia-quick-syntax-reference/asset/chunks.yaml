    [(https://github.com/](https://github.com/timholy/Rebugger.jl)


    [timholy/Rebugger.jl), or the J](https://github.com/timholy/Rebugger.jl)uno IDE
    ([https://junolab.org/).](https://junolab.org/)


    Since these functionalities are similar, and perhaps using a graphical user interface
    is a bit more comfortable, let’s discuss only the integration of the debugger
