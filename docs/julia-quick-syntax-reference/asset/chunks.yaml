    \ possible thanks to the understanding and support of\n\nmy family.\n\nxiii\n\n\
    **Introduction**\n\nThis Julia quick syntax reference book covers the main syntax\
    \ elements of the Julia language as well as some of its more important packages.\n\
    \nThe first chapter explains the basic skills needed to set up the software you\
    \ need to run and develop Julia programs, including managing Julia packages.\n\
    \nChapt[er 2 pr](#index_split_000.html#p31)esents the many predefined types (integers,\
    \ strings, arrays, etc.) and the methods to work with them. Memory and copy issues\
    \ are also presented in this chapter, together with an important discussion about\
    \ the implementation of the various concepts of *missingness*.\n\nAfter the basic\
    \ data types have been introduced, Chapter [3 de](#index_split_000.html#p55)als\
    \ with how to organize them in a sequence of logical statements to compose your\
    \ program. Control flow, functions, blocks, and scope are all discussed in this\
    \ chapter.\n\nIn Chapter [4, w](#index_split_000.html#p70)e extend our discussion\
    \ to custom types—in Julia, both primitive and composite types can be custom-defined—and\
    \ to their organization in the program, either using inheritance or composition.\
    \ This chapter will be of particular use to readers accustomed to other object-oriented\
    \ programs, in order to see how to apply object-oriented concepts in Julia.\n\n\
    Chapt[er 5 expl](#index_split_000.html#p80)ains how to retrieve the inputs needed\
    \ by your program from a given source (the terminal, a text/CSV/Excel/JSON file,\
    \ or a remote resource) and conversely, to export the outputs of your program.\n\
    \nIn Chapter [6, w](#index_split_000.html#p94)e discuss a peculiar feature of\
    \ Julia, that is, the possibility to manipulate the code itself after it has been\
    \ parsed, but before it is compiled and run. This paves the way to powerful macro\
    \ programming. We discuss it and present the concepts of *symbols* and *expressions*\
    \ in Chapt[er 6](#index_split_000.html#p94).\n\nxv\n\nInT\n\nIn roduCTIon\n\n\
    CTI\n\nJulia is a relatively new language, and while the package ecosystem is\
    \ developing extremely rapidly (as most packages can be written directly in the\
    \ Julia language alone), it is highly likely that you will still need libraries\
    \ for which a direct port to Julia is not yet available. Conversely, your main\
    \ workflow may be in another, slower, high-level language and you may want to\
    \ use Julia to implement some performant-critical tasks. Chapt[er 7](#index_split_000.html#p104)\
    \ shows how to use C, C++, Python, and R code and their relative libraries in\
    \ Julia and, conversely, embed Julia code in Python or R programs.\n\nThe following\
    \ chapter (Chapt[er 8](#index_split_001.html#p125)) gives a few recommendations\
    \ for writing efficient code, with runtime performances comparable to compiled\
    \ languages. We also deal here with *programmer’s efficiency*, discussing profiling\
    \ and debugging tools and with a short introduction to runtime exceptions.\n\n\
    This completes the discussion of the *core* of the language. Julia, however, has\
    \ been designed as a thin language where most features are provided by external\
    \ packages, either shipped with Julia itself (a sort of Julia Standard Library)\
    \ or provided by third parties.\n\nTherefore, the second part of the book deals\
    \ with this Julia package ecosystem. Chapt[er 9 in](#index_split_001.html#p147)troduces\
    \ the main packages for working with numerical data: storage with data structure\
    \ packages like DataFrames and IndexedTables; munging with DataFramesMeta, Query,\
    \ and Pipe; and\n\nvisualization with the Plot package.\n\nIf Chapt[er 9](#index_split_001.html#p147)\
    \ deals with processing numerical data, Chapter [10](#index_split_001.html#p186)\n\
    \ndeals with mathematical libraries for more theoretical work. JuMP is an acclaimed\
    \ “algebraic modeling language” for numerical optimization (and can be in itself\
    \ the primary reason to learn about Julia). We present two complete examples with\
    \ linear and non-linear models. The second model is then rewritten to be analytically\
    \ resolved with SymPy, which is a library for symbolic computation, e.g. the analytical\
    \ resolution of derivatives, integrals, and equations (and systems of equations).\
    \ Chapt[er 10 ends](#index_split_001.html#p186)\n\nwith a presentation of LsqFit,\
    \ a powerful and versatile library to fit data.\n\nFinally, Chapter [11](#index_split_001.html#p207)\
    \ concludes the book with a series of tools that are of xvi\n\nInTrodu\n\nT\n\n\
    CTI\n\nrodu\n\non\n\nmore general use, like composing dynamic documents with Wave,\
    \ dealing with ZIP files with ZipFile, and exposing a given Julia model on the\
    \ web with Interact and Mux. Examples given in the text are intentionally trivial.\n\
    \nThey are minimal working examples of the syntax for the concepts they explain.\
    \ If you are looking for recipes directly applicable to your domain, a\n\n“cookbook”\
    \ kind of book may be more convenient.\n\nWhile each package has been tested specifically\
    \ with Julia 1.2 and 1.3-rc4, thanks to the Julia developers’ commitment to a\
    \ stable API, they should remain relevant for the entire 1.x series. Concerning\
    \ third-party packages, we report the exact version we tested our code with. The\
    \ section entitled “Using the Package Manager” in Chapter [1](#index_split_000.html#p17)\
    \ explains how to update a package to a given version if subsequent versions of\
    \ the package break the API.\n\nIs such cases, please report the problem to us\
    \ using the form at\n\n[https://julia-book.com. W](https://julia-book.com)e will\
    \ regularly publish updates and errata on this site, where a discussion forum\
    \ focused on the book is also available.\n\nxvii\n\n**PART I**\n\n**Language Core**\n\
    \n**CHAPTER 1**\n\n**Getting Started**\n\n**1.1 Why Julia?**\n\nWith so many programming\
    \ languages available, why create yet another one? Why invest the time to learn\
    \ Julia? Is it worth it?\n\nOne of the main arguments in favor of using Julia\
    \ is that it contributes to improving a trade-off that has long existed in programming—fast\
    \ coding versus fast execution.\n\nOn the one side, Julia allows the developer\
    \ to code in a dynamic, high-level language similar to Python, R, or MATLAB, interacting\
    \ with the code and having powerful expressivity (see Chapt[er 6](#index_split_000.html#p94),\
    \ for example).\n\nOn the other side, with minimum effort, developers can write\n\
    \nprograms in Julia that run (almost) as fast as programs written in C or FORTRAN.\n\
    \nWouldn’t it be better, though, to optimize existing languages, with their large\
    \ number of libraries and established ecosystems, rather than create a new language\
    \ from scratch?\n\nWell, yes and no. Attempts to improve runtime execution of\
    \ dynamic languages are numerous. PyPy ([https://pypy.org), C](https://pypy.org)ython\
    \ ([https://](https://cython.org)\n\n[cython.org), and N](https://cython.org)umba\
    \ ([https://numba.pydata.org) ar](https://numba.pydata.org)e three notable examples\
    \ for the Python programming language. They all clash with one fact: Python (and,\
    \ in general, all the current dynamic languages) was designed before the recent\
    \ development of just-in-time (JIT) compilers, and hence it offers features that\
    \ are not easy to optimize. The optimization tools either fail or require complex\
    \ workarounds in order to work.\n\n© Antonello Lobianco 2019\n\nA. Lobianco, *Julia\
    \ Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_1](#index_split_000.html#p17)\n\
    \nChapTer 1 GeTTInG STarTed\n\nConversely, Julia has been designed from the ground\
    \ up to work\n\nwith JIT compilers, and the language features—and their internal\n\
    \nimplementations—have been carefully considered in order to provide the programmer\
    \ with the expected productivity of a modern language, all while respecting the\
    \ constraints of the compiler. The result is that Julia-compliant code is guaranteed\
    \ to work with the underlying JIT compiler, producing in the end highly optimized\
    \ compiled code.\n\n***The Shadow Costs of Using a New Language***\n\n **If it\
    \ is true that the main “costs” of using a new language relate to learning the\
    \ language and having to abandon useful libraries\n\nand comfortable, feature-rich\
    \ development editors that you are\n\naccustomed to, it is also true that in the\
    \ Julia case these costs are mitigated by several factors:\n\n• The language has\
    \ been designed to syntactically\n\nresemble mainstream languages (you’ll see\
    \ it in this\n\nbook!). If you already know a programming language,\n\nchances\
    \ are you will be at ease with the Julia syntax.\n\n• Julia allows you to easily\
    \ interface your code with all\n\nthe major programming languages (see Chapter\
    \ [7,](#index_split_000.html#p104)\n\n“Interfacing Julia with Other Languages”),\
    \ hence\n\nreusing their huge sets of libraries (when these are not\n\nalready\
    \ ported to Julia).\n\nChapTer 1 GeTTInG STarTed\n\n• The development environments\
    \ that are available—\n\ne.g., Juno ([https://junolab.org](https://junolab.org)),\
    \ IJulia Jupiter kernel ([https://github.com/JuliaLang/](https://github.com/JuliaLang/IJulia.jl)\n\
    \n[IJulia.jl),](https://github.com/JuliaLang/IJulia.jl) and VSCode Julia plugin\
    \ ([https://](https://github.com/JuliaEditorSupport/julia-vscode)\n\n[github.com/JuliaEditorSupport/julia-](https://github.com/JuliaEditorSupport/julia-vscode)\n\
    \n[vscode](https://github.com/JuliaEditorSupport/julia-vscode))—are frankly quite\
    \ cool, with many common features already implemented. They allow you to be\n\n\
    productive in Julia from the first time you code with it.\n\nApart from the breakout\
    \ in runtime performances from traditional\n\nhigh-level dynamic languages, the\
    \ fact that Julia was created from scratch means it uses the best, most modern\
    \ technologies, without concerns over maintaining compatibility with existing\
    \ code or internal architectures.\n\nSome of the features of Julia that you will\
    \ likely appreciate include built-in Git-based package manager, full code introspection,\
    \ multiple dispatches, in-core high-level methods for parallel computing, and\
    \ Unicode\n\ncharacters in variable names (e.g., Greek letters).\n\nThanks to\
    \ its computational advantages, Julia has its natural roots in the domain of scientific,\
    \ high-performance programming, but it is becoming more and more mature as a general\
    \ purpose programming\n\nlanguage. This is why this book does not focus specifically\
    \ on the mathematical domain, but instead develops a broad set of simple,\n\n\
    elementary examples that are accessible even to beginner programmers.\n\n**1.2\
    \ Installing Julia**\n\nJulia code can be run by installing the Julia binaries\
    \ for your system available in the download se[ction (http://julialang.org/downloads/)\
    \ of](http://julialang.org/downloads/)\n\nthe Julia Project websit[e (https://julialang.org](https://julialang.org)).\n\
    \nChapTer 1 GeTTInG STarTed\n\nThe binaries ship with a Julia interpreter console\
    \ (aka, the “REPL”—\n\nRead, Eval, Print, Loop), where you can run Julia code\
    \ in a command-line fashion.\n\nFor a better experience, check out an Integrated\
    \ Development\n\nEnvironment, for example, Juno ([http://junolab.org/) an IDE\
