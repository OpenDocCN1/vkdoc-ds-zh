    \n## Chapter 9 Working With Data\n\n***Figure 9-2.** Plotting multiple series*\n\
    \nWhile plot objects can be saved as any other object, with `myPlot = plot(...)`,\
    \ the peculiarity is that the last call to `plot` defines the “current” plot,\
    \ which is the default to be visualized or saved. Using instead the `plot!` function,\
    \ you add elements to an existing plot, precisely the “current” one if not otherwise\
    \ specified (i.e., by indicating the plot object you are operating as the first\
    \ argument).\n\nAn alternative way to plot multiple series is hence to first plot\
    \ a single series, and then add one series at a time with `plot!`. This snippet\
    \ provides a plot exactly equal to the previous one:\n\n```\nplot(x,y[:,1]) #\
    \ create a new \"current plot\"\n```\n\n**JULIA**\n\n```\nplot!(x,y[:,2]) # add\
    \ a serie to the current plot\nplot!(x,y[:,3]) # add a serie to the current plot\n\
    ```\n\n## Chapter 9 Working With Data\n\nThe default type of chart drawn is a\
    \ `:line` chart. Different types of charts can be specified with the `seriestype`\
    \ keyword argument of the `plot` function, as follows:\n\n```\nplot(x,y[:,1];\
    \ seriestype=:scatter)\n```\n\n**JULIA**\n\nCommon type of charts are `:scatter`,\
    \ `:line`, `:histogram`, etc. You can obtain the full list of types supported\
