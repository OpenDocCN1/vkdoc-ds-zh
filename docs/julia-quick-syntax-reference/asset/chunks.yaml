    \ `df.product`) (referenced, i.e., equal to `df[!,:cName]`).\n  - `df[cPos]`:\
    \ Select one or more columns (e.g., `df[2]`) by copying the data.\n- Select whole\
    \ rows:\n  - `df[rPos,:]`: Select one or more rows (e.g., `df[2,:]`). Unlike columns,\
