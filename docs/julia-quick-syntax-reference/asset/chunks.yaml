    \ | v0.8.1 |\n\n虽然 Julia 是一种完善的通用编程语言，但不可否认的是，其社区目前的关注点主要集中在数学和计算问题上。您已经看到了用于处理数值数据的大量库，以及从\
    \ Julia 开发之初，计算性能的考量如何塑造了相关决策。\n\n本章列出了部分最成熟的数学分析库。其中一些库，例如用于数值优化的 JuMP，本身就常常成为人们开始使用\
