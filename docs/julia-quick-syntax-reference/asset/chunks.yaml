    **10.3 LsqFit, a Data Fit Library**


    As a third example, I selected a data fit model. Statistics (and the related field
    of machine learning) is possibly the area with the most active development in
    the Julia community. The LsqFit package offers lots of flexibility while remaining
    user-friendly.


    You will use it to estimate the logistic growth curve (Verhulst model) of a forest
    stand of beech (a broadleaved species) given a sample of timber volume data from
    a stand in northwest France[1.](#index_split_001.html#p203)


    1 Data is from ENGREF, (1984) *Tables de production pour les forets francaises*,
    2e édition, p. 80\. Age is given in years, volumes in metric cubes per hectare.


    Chapter 10 MatheMatiCal libraries


    **10.3.1 Loading the Libraries and Defining**


    **the Model**


    You start by specifying the functional form of the model you want to fit and where
    the parameters to be estimated stand. The @. macro is a useful tool to avoid specifying
    the dot operator (for broadcasting) on each operation.


    The model you want to estimate is the well-known logistic function: *par*


    *vol* =


    1+ *e*- *par* *2( *age*- *par* 3)


    using LsqFit,CSV,Plots


    JULIA


    # **** Fit volumes to logistic model ***


    @. model(age, pars) = pars[1] / (1+exp(-pars[2] * (age - pars[3]))) obsVols =
    CSV.read(IOBuffer("""


    age vol


    20 56


    35 140


    60 301


    90 420


    145 502


    """), delim=" ", ignorerepeated=true, copycols=true) **10.3.2 Parameters**


    Since the algorithm to find the fit is non-linear, you must provide some


    “reasonable” starting points. In the case of the logistic functions, the first
    parameter is the maximum level reached by the function (the “carrying capacity”),
    the second is the growth rate, and the third is the midpoint on the x scale. The
    following could be reasonable starting points:


    par0 = [600, 0.02, 60]


    JULIA


    Chapter 10 MatheMatiCal libraries


    **10.3.3 Fitting the Model**


    Once the model has been defined, you can fit it with your data and your initial
    guess of the parameters (you could have also specified lower and upper bounds
    of the parameters and then passed them as lower=lb,


    upper=ub). This is the stage where the least-squares fitting happens.


    fit = curve_fit(model, obsVols.age, obsVols.vol, par0) JULIA


    **10.3.4 Retrieving the Parameters and**


    **Comparing them with the Observations**


    Fitted parameters are now available in the fit.param array. At this point, you
