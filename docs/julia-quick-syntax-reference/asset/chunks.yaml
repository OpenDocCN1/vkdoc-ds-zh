- fmt: "# Chapter 7: Interfacing Julia with Other Languages\n\n`addresses` its capacity\
    \ to interface with code written in other languages, and in particular to use\
    \ the huge number of libraries available in those languages.\n\nAt its core, this\
    \ resulted in the capacity of the Julia language to natively call C and FORTRAN\
    \ libraries. This in turn allowed Julia developers to write packages to interface\
    \ with the most common programming languages.\n\n© Antonello Lobianco 2019\n\n\
    A. Lobianco, *Julia Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_7](#index_split_000.html#p104)\n\
    \nI will discuss some of them in this chapter. Finally, this allowed higher-level\
    \ packages to leverage these \"language-interface\" packages to easily wrap existing\
    \ libraries, written in other languages, and present an interface to them for\
    \ Julia programmers.\n\nTo sum up, if you need a common functionality, it is highly\
    \ likely that you will find a package that either (a) implements the functionality\
    \ directly in Julia (such as `DataFrames` at [https://github.com/JuliaData/DataFrames.jl](https://github.com/JuliaData/DataFrames.jl))\
    \ or (b) wraps an existing library in another language (for the same functionality,\
    \ such as `Pandas` at [https://github.com/JuliaPy/Pandas.jl](https://github.com/JuliaPy/Pandas.jl)).\n\
    \nI will discuss some of these packages in the second part of the book.\n\nThe\
    \ rest of this chapter will show how to explicitly link Julia with other languages,\
    \ either by calling functions implemented in other languages or by calling Julia\
    \ functions from other languages.\n\nWhen it would be ambiguous (such as when\
    \ using prompts of different languages), I include the prompt symbols in the code\
    \ snippets.\n\n## 7.1 Julia ⇄ C\n\nAs stated, calling C code is native to the\
    \ language and doesn't require any third-party code.\n\nLet's first build a C\
    \ library. I show this in Linux using the GCC compiler. The procedure in other\
    \ environments is similar but not necessarily identical.\n\n`myclib.h`:\n\n```c\n\
    extern int get2();\nextern double sumMyArgs(float i, float j);\n```\n\n`myclib.c`:\n\
    \n```c\nint get2() {\n    return 2;\n}\n\ndouble sumMyArgs(float i, float j) {\n\
    \    return i + j;\n}\n```\n\nNote that you need to define the function you want\
    \ to use in Julia as `extern` in the C header file.\n\nYou can then compile the\
    \ shared library with `gcc`, a C compiler:\n\n```bash\ngcc -o myclib.o -c myclib.c\n\
    gcc -shared -o libmyclib.so myclib.o -lm -fPIC\n```\n\nYou are now ready to use\
    \ the C library in Julia:\n\n```julia\nconst myclib = joinpath(@__DIR__, \"libmyclib.so\"\
    )\n\na = ccall((:get2, myclib), Int32, ())\nb = ccall((:sumMyArgs, myclib), Float64,\
    \ (Float32, Float32), 2.5, 1.5)\n```\n\nThe `ccall` function takes as the *first*\
    \ argument a tuple `(function name, library path)`, where the library path must\
    \ be expressed in terms of a full path, unless the library is in the search path\
    \ of the OS. If it isn't, and you still want to express it relative to the file\
    \ you are using, you can use the `@__DIR__` macro, which expands to the absolute\
    \ path of the directory of the file. The variable hosting the full path of the\
    \ library must be set constant, and the tuple acting as the first argument of\
    \ `ccall` must be *literal*.\n\nThe *second* argument of `ccall` is the return\
    \ type of the function.\n\nNote that while C `int` maps to Julia `Int32` or `Int64`,\
    \ C `float` maps to Julia `Float32` and C `double` maps to Julia `Float64`. In\
    \ this example, you could have instead used the corresponding Julia type aliases\
    \ `Cint`, `Cfloat`, and `Cdouble` (among others) in order to avoid memorizing\
    \ the mapping.\n\nThe *third* argument is a tuple of the types of the arguments\
    \ expected by the C function. If there is only one argument, it must still be\
    \ expressed as a tuple, e.g. `(Float64,)`.\n\nFinally, the remaining arguments\
    \ are passed to the C function.\n\nI have just scratched the surface here. Linking\
    \ C (or FORTRAN) code can become pretty complex in real-world situations, and\
    \ consulting the official documentation at [https://docs.julialang.org/en/v1/manual/calling-c-and-fortran-code/](https://docs.julialang.org/en/v1/manual/calling-c-and-fortran-code/)\
    \ can prove indispensable.\n\n## 7.2 Julia ⇄ C++\n\nAs with C, C++ workflow is\
    \ partially environment-dependent. This section uses `Cxx.jl` under Linux, although\
    \ `Cxx.jl` also has experimental support for Windows[1.](#index_split_000.html#p107)\n\
    \nIts main advantage over other C++ wrap modules (notably, `CxxWrap.jl` at [https://github.com/JuliaInterop/CxxWrap.jl](https://github.com/JuliaInterop/CxxWrap.jl))\
    \ is that it allows you to work on C++ code in multiple ways depending on the\
    \ workflow that is required.\n\n### 7.2.1 Interactive C++ Prompt\n\nIf you type\
    \ `<` in the Julia REPL (after you type `using Cxx`), you obtain an interactive\
    \ C++ prompt, as shown in Figure 7-1.\n\n![Image 12](index-108_1.jpg)\n\n**Figure\
    \ 7-1.** C++ interactive prompt at the Julia REPL\n\nNote in Figure 7-1 how the\
    \ code compilation you typed is done just-in-time, as with Julia itself, so any\
    \ compilation errors are reported straight away.\n\n### 7.2.2 Embed C++ Code in\
    \ a Julia Program\n\nIn addition to the REPL prompt, you can use C++ code in your\
    \ Julia program without ever leaving the main Julia environment. Let's start with\
    \ a simple example:\n\n```julia\nusing Cxx\n\n# Define the C++ function and compile\
    \ it\ncxx\"\"\"\n#include<iostream>\n\nvoid myCppFunction() {\n    int a = 10;\n\
    \    std::cout << \"Printing \" << a << std::endl;\n}\n\"\"\"\n\n# Execute it\n\
    icxx\"myCppFunction();\"  # Return \"Printing 10\"\n\n# OR\n# Convert the C++\
    \ function to a Julia function\nmyJuliaFunction() = @cxx myCppFunction()\n\n#\
    \ Run the function\nmyJuliaFunction()  # Return \"Printing 10\"\n```\n\nThe workflow\
    \ is straightforward: You first embed the C++ code with the `cxx\"...\"` string\
    \ macro. You are then ready to \"use\" the functions defined in `cxx\"...\"` either\
    \ by calling them directly with C++ code embedded in `icxx\"...\"` or by converting\
    \ them in a Julia function with the `@cxx` macro and using Julia code to call\
    \ the (Julia) function.\n\nThis example doesn't imply any transfer of data between\
    \ Julia and C++. If you want to embed C++, most likely it is in order to pass\
    \ some data to C++ and retrieve the output to use in your Julia program.\n\nThe\
    \ following example shows how data transfer between Julia and C++ (both ways)\
    \ is handled automatically for elementary types:\n\n```julia\nusing Cxx\n\ncxx\"\
    \"\"\n#include<iostream>\n\nint myCppFunction2(int arg1) {\n    return arg1 +\
    \ 1;\n}\n\"\"\"\n\njuliaValue = icxx\"myCppFunction2(9);\"  # 10\n\n# OR\nmyJuliaFunction2(arg1)\
    \ = @cxx myCppFunction2(arg1)\njuliaValue = myJuliaFunction2(99)  # 100\n```\n\
    \nHowever, when the transfer involves complex data structures (like arrays or,\
    \ as in the following example, arrays of arrays), things become more complex.\
    \ The Julia types have to be converted into the C++ types and vice versa:\n\n\
    ```julia\nusing Cxx\n\ncxx\"\"\"\n#include <vector>\nusing namespace std;\n\n\
    vector<double> rowAverages (vector< vector<double> > rows) {\n    // Compute average\
    \ of each row..\n    vector <double> averages;\n    for (int r = 0; r < rows.size();\
    \ r++) {\n        double rsum = 0.0;\n        double ncols = rows[r].size();\n\
    \        for (int c = 0; c < rows[r].size(); c++) {\n            rsum += rows[r][c];\n\
    \        }\n        averages.push_back(rsum / ncols);\n    }\n    return averages;\n\
    }\n\"\"\"\n\nrows_julia = [[1.5, 2.0, 2.5], [4, 5.5, 6, 6.5, 8]]\nrows_cpp = convert(cxxt\"\
    vector< vector< double > >\", rows_julia)\nrows_avgs = collect(icxx\"rowAverages($rows_cpp);\"\
    )\n```\n\n---\n\n[1](#index_split_000.html#p107) `Cxx` is compatible only with\
    \ Julia 1.1 or 1.2 (although compatibility with Julia 1.3 is expected soon)."
