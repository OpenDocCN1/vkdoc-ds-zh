    **11.1 Weave for Dynamic Documents**


    Weave [(https://github.com/mpastell/weave.jl](https://github.com/mpastell/weave.jl))
    allows developers to produce so-called “dynamic documents,” where the code producing
    the


    “results” is embedded directly into the document. The overall structure of the
    document is a *markdown* document, while the Julia code is inserted as *code cells*
    within the main document.


    In many situations, this is very useful, as it enables the logic going from the
    assumptions to the results and the presentation and discussion of these results
    to be presented in the same document.


    © Antonello Lobianco 2019


    A. Lobianco, *Julia Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_11](#index_split_001.html#p207)


    Chapter 11 Utilities


    Weave, mixing the code and the (markdown-based) documentation, is


    similar to a Jupyter Notebook. Its main advantage is that the code cells are not
    defined *a priori*, but you can still run the part of the code that you need in
    Juno, independent of the way you organized the cells in the document.


    This is thanks to the Atom package called *language-weave* [(https://atom.](https://atom.io/packages/language-weave)


    [io/packages/language-weave).](https://atom.io/packages/language-weave)


    To see an example, consider the following document as being a file with the .jmd
    extension (e.g., testWeave.jmd):


    JULIA


    title : Test of a document with embedded Julia code and


    citations


    date : 5th September 2019


