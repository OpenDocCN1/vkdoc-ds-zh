    Debugging is much harder in compiled languages, and this prompted


    the development of many sophisticated, dedicated tools to help debugging programs.


    The interactive and introspective nature of Julia makes debugging


    relatively simple, as the programmer can easily analyze, and eventually change,
    the code at any step. Still, specialized debugging tools have been 128


    ![Image 14](index-141_1.jpg)


