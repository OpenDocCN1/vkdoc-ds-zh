  trans: "\n# Markdown 排版输出\n\n- `end`，即 splat 运算符。\n\n- `df = hcat(df1, df2, makeunique=true)`：横向拼接具有相同行数的数据框。如果待合并的数据框包含同名列，则需要设置\
    \ `makeunique=true`。\n\n- `fullDf = join(df1, df2, on = :commonCol)`：横向连接数据框。`on`\
    \ 参数也可以是一个由共同列组成的数组。连接方式有多种，最常见的有 `:inner`（默认值；仅返回两侧键值都存在的行）、`:left`（左侧数据框中键值在右侧不存在的行也会返回）、`:right`（与\
    \ `:left` 相反）以及 `:outer`（两个数据框中任何一侧缺少元素的行都会返回）。\n\n- `df2 = similar(df1, 0)`：复制数据框的结构（到一个空数据框）。\n\
    \n## 9.1.7 处理缺失值\n\n回顾一下，缺失值（即 `missing`，它是单例类型 `Missing` 的唯一实例）如果未得到处理，会在操作中静默传播。DataFrames\
    \ 包提供了一系列方法，允许程序员根据对缺失性的解释来决定如何处理这些数据：\n\n- `dropmissing(df)` 和 `dropmissing!(df)`：返回只包含完整行的数据框，即任何字段都不含缺失值（也可使用\
    \ `dropmissing(df[[:col1,:col2]])`）。在操作内部（例如求和），你可以使用 `dropmissing()` 来在执行操作前跳过缺失值。\n\
    \n- `completecases(df)` 或 `completecases(df[[:col1,:col2]])`：返回一个布尔数组，指示整行或指定字段中是否无缺失。\n\
    \n- `[df[ismissing.(df[!,i]), i] .= 0 for i in names(df) if Base.nonmissingtype(eltype(df[!,i]))\
    \ <: Number]`：将所有数值列（如 `Float64` 和 `Int64`）中的缺失值替换为 0。\n\n- `[df[ismissing.(df[!,i]),\
    \ i] .= \"\" for i in names(df) if Base.nonmissingtype(eltype(df[!,i])) <: String]`：将所有字符串列中的缺失值替换为\
    \ `\"\"`。\n\n- `isequal.(a,b)`：进行比较时不传播缺失值（例如，`isequal(\"US\", missing)` 返回 `false`，而\
    \ `\"US\" == missing` 既不是 `true` 也不是 `false`，而是返回 `missing`）。\n\n- `nMissings\
    \ = length(findall(x -> ismissing(x), df.col))`：统计某列中缺失值的数量。\n\n## 9.1.8 分裂-应用-合并策略\n\
    \nDataFrames 包通过 `by` 函数支持常见的*分裂-应用-合并*策略，该函数接受三个参数：(1) 一个数据框，(2) 用于分裂数据框的一列或多列，(3)\
    \ 要应用到每个数据框子集上的函数或表达式。\n\n使用 `by` 函数时，“内部”函数会被应用到每个子组上，它返回的任何内容（标量、数组、命名元组或数据框）会先与定义子组的值进行横向合并，然后再纵向合并（“组合”），最终组成由\
    \ `by` 函数返回的数据框。返回命名元组或数据框允许对新列进行标记，出于性能考虑，推荐优先使用命名元组。\n\n`by` 函数的另一种形式是将函数作为第一个参数，因此通常使用\
    \ `do` 代码块来应用。\n\n在内部，`by` 函数使用了 `groupby()` 函数，正如在代码中，它被定义为：\n\n```\nby(d::AbstractDataFrame,\
    \ cols, f::Function) =\ncombine(map(f, groupby(d, cols))) JULIA\nby(f::Function,\
    \ d::AbstractDataFrame, cols) = by(d, cols, f)\n```\n\n让我们看看如何将 `by` 函数应用于一些常见的数据转换模式。\n\
    \n### 聚合\n\n在聚合的情况下，你需要降低每个子组的维度，定义一个或多个操作，每个操作用一个标量值代替子组中可能存在的多个值（例如，求和或平均值）。\n\
    \n内部函数必须返回一个*行*——例如命名元组、DataFrameRow 或单行数据框。\n\n以下示例展示了按区域和产品进行聚合的不同方式。这些示例使用了先前木材市场数据的例子（`mean`\
    \ 函数需要标准库包 `Statistics`）：\n\n```\n# 内部函数返回一个水平数组（一行）\n# （新列会被自动命名）\nJULIA\nby(df,\
    \ [:region, :product]) do subgroup\n    [mean(subgroup.production) sum(subgroup.consumption)]\n\
    end\n```\n\n```\n# 内部函数返回一个命名元组（返回的列有名称）\nby(df, [:region, :product]) do subgroup\n\
    \    (avgProduction=mean(subgroup.production),\n     totalConsumption=sum(subgroup.consumption))\n\
    end\n```\n"
- fmt: "# Inner function returning a DataFrame with a single row per subgroup\n\n\
    `by(df, [:region, :product]) do subgroup`\n`    DataFrame(avgProduction=mean(subgroup.production),\
    \ totalConsumption=sum(subgroup.consumption))`\n`end`\n\nAs aggregating is a very\
    \ common operation, the `DataFrames` package provides a specialized `aggregate(df,\
    \ aggregationColumn(s), operation(s))` function that directly aggregates the `df`\
    \ by the required fields and applies the specified operations to each group in\
    \ order to retrieve a single value for each group. For example, `aggregate(df,\
    \ [:region, :product], [sum, mean])` (using the earlier example) would return\
    \ the sum and mean of the sets of values (production and consumption) corresponding\
    \ to each category.\n\nNote that the convenience of the `aggregate` function is\
    \ paid by a loss in generality. You can’t specify which operation to perform on\
    \ the different values to aggregate (e.g., in the previous examples, the `mean`,\
    \ just for the production, and the `sum`, just for the consumption).\n\nFurther,\
    \ all categorical columns must be included in the parameter `aggregationColumns`;\
    \ otherwise, Julia will try to apply the operations over them, in most cases,\
    \ raising an error (as the operation expects numerical values while the categorical\
    \ columns are typically strings) instead of just ignoring them.\n\nThe workaround\
    \ is to remove the fields you don’t need before performing the aggregation (in\
    \ this example, the year: `select!(df, Not(:year)); aggregate(df, [:region, :product],\
    \ [sum, mean])`).\n\n## Computing the Cumulative Sum by Categories\n\nLet’s consider\
    \ again the original (fictional) database of timber markets and seek to obtain\
    \ the yearly cumulative production.\n\nThe difficulty of this task is that values\
    \ on a given row depend on values of the previous rows of the same subgroup, which\
    \ means that order matters.\n\nYou can use again the split-apply-combine strategy\
    \ with the `by` function:\n```\ndfCum = by(df,[:region,:product]) do subdf\n \
    \   JULIA\n    return (year = subdf[:year], cumProd = cumsum(subdf[:production]))\n\
    end\n```\n\nUnlike the aggregation case, for each subgroup here, you need several\
    \ rows, one for each original record. To the columns that define the subgroups\
    \ (`region` and `product`), you add back the `year` and `cumsum` columns, obtained\
    \ using the homologous function. Note that the `DataFrames` package is “smart”\
    \ enough to expand the `year` scalar to an array of `cumProd` length.\n\nAlternatively,\
    \ you can use the split-apply-combine strategy with the `@linq` macro (from `DataFramesMeta`):\n\
    \nThe `DataFramesMeta` package provides the `@linq` macro, which supports a *Language\
    \ Integrated Query* style over chained data transformation operations, in a way\
    \ similar to R’s `dplyr` package (<https://cran.r-project.org/web/packages/dplyr/>):\n\
    \n```\ndfCum = @linq df |>\n    JULIA\n    groupby([:region,:product]) |>\n  \
    \  transform(cumValue = cumsum(:production))\n```\n\nHere, `|>` represents the\
    \ *pipe* operator (we’ll see it in more in detail in a later section), which passes\
    \ the object returned from the operation on the left as the first argument to\
    \ the operation on the right. Data (`df`) is initially passed to the `groupby`\
    \ function for it to be slit, and the split subgroups are finally passed to the\
    \ `transform(df, operation)` function to be modified.\n\n### 9.1.9 Pivoting Data\n\
    \nTabled data can be equivalently represented using two kinds of layouts, *long*\
    \ and *wide*.\n\nA *long* layout is when you specify each dimension on a separate\
    \ column and then you have a single column for what you consider the “value”.\
    \ If you have multiple variables in the database, the “variable” becomes a dimensional\
    \ column too.\n\nFor example, using the timber market example, Table 9-1 shows\
    \ a long-formatted table.\n\n***Table 9-1.** A Long-Formatted Table*\n\n| **Region**\
    \ | **Product** | **Year** | **Variable** | **Value** |\n|------------|-------------|----------|--------------|-----------|\n\
    | US         | hardwood    |          | production   | 3.3       |\n| US     \
    \    | hardwood    |          | production   | 3.3       |\n| US         | hardwood\
    \    |          | production   | 3.2       |\n| US         | Softwood    |   \
    \       | production   | 2.3       |\n| ...etc..   |             |          |\
    \              |           |\n\nThe long format is less human-readable, but it\
    \ is very easy to work with and to perform data analysis.\n\nIn the *wide* format,\
    \ on the other hand, values are expressed on multiple columns, where one or multiple\
    \ dimensions are expressed along the horizontal axis. See Table 9-2.\n\n***Table\
    \ 9-2.** A Widely Formatted Table*\n\n| **Region** | **Product** | **Year** |\
    \ **Production** | **Consumption** |\n|------------|-------------|----------|----------------|-----------------|\n\
    | US         | hardwood    |          | 3.3            | 4.3             |\n|\
    \ US         | hardwood    |          | 3.2            | 7.4             |\n|\
    \ US         | Softwood    |          | 2.3            | 2.5             |\n|\
    \ US         | Softwood    |          | 2.1            | 9.8             |\n|\
    \ ...etc..   |             |          |                |                 |\n\n\
    The timber example in the original format was a wide table, but you can create\
    \ even more widely styled tables using multiple horizontal axes (not supported\
    \ by the `DataFrames` package). See Table 9-3.\n\n***Table 9-3.** A Even More\
    \ Widely Formatted Table (with Multiple Horizontal Axes)*\n\n|             | **Production**\
    \ |            | **Consumption** |            |\n|-------------|----------------|------------|-----------------|------------|\n\
    |             | **Hardwood**   | **Softwood** | **Hardwood**    | **Softwood**\
    \ |\n| US          | 3.3            | 2.3        | 4.3             | 2.5     \
    \   |\n| US          | 3.2            | 2.1        | 7.4             | 9.8   \
    \     |\n| eU          | 2.7            | 1.5        | 3.2             | 6.5 \
    \       |\n| eU          | 2.8            | 1.3        | 4.3             |   \
    \         |\n\nThe operation of moving axes between the horizontal and the vertical\
    \ dimensions is called *pivoting*. In particular, *stacking* moves columns and\
    \ expands them as new rows, moving hence from wide to long format. *Unstacking*\
    \ does the opposite, taking rows and placing their values as new columns, thus\
    \ creating a “wider” table.\n\n### Stacking Columns\n\nThe `DataFrames` package\
    \ provides the `stack(df, [cols])` function, where you specify the columns that\
    \ you want to stack, and the `melt(df, [cols])` function, where you specify instead\
    \ the other columns, i.e., the categorical columns that are already in stacked\
    \ form.\n\nFinally, `stack(df)`—without column names—automatically stacks all\
    \ floating-point columns.\n\nNote that the headers of the stacked columns are\
    \ inserted as data in a `variable` column (with the names of the variables being\
    \ symbols, not strings) and the corresponding values in a `value` column.\n\n\
    ```\nlongDf = stack(df,[:production,:consumption])\n    JULIA\nlongDf1 = melt(df,[:region,:product,:year])\n\
    longDf2 = stack(df)\nlongDf == longDf1 == longDf2 # true\n\n│ Row │ variable │\
    \ value │ region │ product │ year │\n│     │ Symbol   │ Float64 │ String │ String\
    \ │ Int64 │\n├─────┼──────────┼────────┼────────┼─────────┼───────┤\n│ 1   │ production\
    \ │ 3.3   │ US     │ Hardwood │ 2010 │\n│ 2   │ production │ 3.2   │ US     │\
    \ Hardwood │ 2011 │\n│ 3   │ production │ 2.3   │ US     │ Softwood │ 2010 │\n\
    │ 4   │ production │ 2.1   │ US     │ Softwood │ 2011 │\n...etc...\n```\n\n###\
    \ Unstacking\n\nThe `DataFrames` package also provides `unstack(longDf, [:rowField(s)],\
    \ :variableCol, :valueCol)`, where you give the list of columns that should remain\
    \ as categorical variables even in the wide format, the name of the column storing\
