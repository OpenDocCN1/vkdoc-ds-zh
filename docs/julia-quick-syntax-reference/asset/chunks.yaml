    \n## 8.3 调试\n\n*调试*，通常是指“消除计算机程序中错误或故障的过程”（来自 Merriam-Webster 词典）。\n\n在编译型语言中调试要困难得多，这促使了许多复杂、专用工具的开发以帮助调试程序。\n\
    \nJulia 的交互式和内省特性使得调试相对简单，因为程序员可以轻松地分析并在任何步骤更改代码。尽管如此，专门的调试工具已经被开发出来，用于帮助调试函数内部的代码，否则这些代码的各个组成部分将难以分析。\n\
    \n### 8.3.1 内省工具\n\n*内省*是程序检查自身的能力，特别是*类型内省*是程序在运行时检查对象类型或属性的能力。\n\n广义上讲，第一个“内省”工具是工作区（Workspace）面板，它在多个\
    \ Julia 开发环境中都有提供（图 8-2 显示了 Juno 中可用的面板）。它显示了当前作用域内所有标识符（变量、函数等）以及绑定到它们的对象。\n\n\
    ***图 8-2.** Juno IDE 中的工作区面板*\n\n此外，Julia 提供了以下内省函数：\n\n- `methods(myfunction)`：检索所有函数签名，即函数在被调用时接受的所有不同类型的参数。\n\
    - `@which myfunction(myargs)`：发现特定调用中会使用哪个方法（在可用的多个方法中，因为 Julia 支持多重分派）。\n- `typeof(a)`：发现给定对象的类型。\n\
    - `eltype(a)`：发现给定对象内部元素的类型，例如 `typeof(ones(Int64,10))` 返回 `Array{Int64,1}`，而\
    \ `eltype(ones(Int64,10))` 返回 `Int64`。\n- `fieldnames(aType)`：发现给定类型包含哪些字段。\n\
    - `dump(myobj)`：获取关于给定对象的详细信息。\n\n### 8.3.2 调试工具\n\nJulia 提供了一个功能完备的调试器栈。基础功能由\
    \ `JuliaInterpreter.jl` 包（参见 [`github.com/JuliaDebug/JuliaInterpreter.jl`](https://github.com/JuliaDebug/JuliaInterpreter.jl)）提供，而用户界面则由命令行包\
    \ `Debugger.jl`（[`github.com/JuliaDebug/Debugger.jl`](https://github.com/JuliaDebug/Debugger.jl)）和\
    \ `Rebugger.jl`（[`github.com/timholy/Rebugger.jl`](https://github.com/timholy/Rebugger.jl)）或\
    \ Juno IDE（[`junolab.org/`](https://junolab.org/)）提供。\n\n由于这些功能类似，并且使用图形用户界面可能更方便，我们只讨论\
    \ Juno 中调试器的集成。Juno 集成的调试器允许开发者在任意点检查源代码并设置*断点*，断点是执行暂停的点，以便程序员检查状态、更改代码或继续执行。\n\
    \n让我们重用 `fib` 函数并为其打开一个调试会话（见图 8-3）。\n\n***图 8-3.** Juno IDE 中的调试会话*\n\n你可以通过在\
    \ Juno REPL 中输入 `Juno.@enter function(args)` 来启动调试会话。在这种情况下，你可以使用 `Juno.@enter\
    \ fib(10)`。如果尚未可见，启动调试会话将打开特定的调试器面板（如图 8-3 右侧所示）。REPL 提示符也会变为 `debug>`。\n\n从图\
    \ 8-3 中，你可以看到你使用了调试提示符来打印变量 `n` 的值（但你从左侧的工作区面板已经知道），并且最有趣的是，动态地更改了它的值。你用它来运行一个奇怪的斐波那契数列，跳过了从\
    \ 8 到 6 的递归。\n\n点击主编辑器面板中行号的左侧将切换该行的断点（一个红点）。断点列在调试器面板的底部。它们可以被禁用（这样就不再活动），或者可以被编辑，使其仅在满足特定条件时适用（此处是当\
    \ `n` 小于或等于 4 时）。红点将变为蓝色，表示这是一个*条件断点*。\n\n在调试器面板的顶部是调试会话的图形控制。从左到右，这些控制是：\n\n\
    - *继续（Continue）：* 继续执行，直到调试的函数终止或遇到有效的断点。`Juno.@run function(args)` 是 `Juno.@enter\
    \ function(args)` 后接按下 Continue 的快捷方式。\n- *完成函数（Finish Function）：* 继续执行，直到当前函数退出或遇到有效的断点。\n\
    - *下一行（Next Line）：* 评估当前行，并在评估下一行之前停止。\n- *执行到选中行（Step to Selected Line）：* 继续执行，直到选中的行或遇到有效的断点。\n\
    - *下一个表达式（Next Expression）：* 评估下一个表达式。仅当同一行定义了多个表达式时，才与 Next Line 有所不同。\n- *步入函数（Step\
    \ Into Function）：* 执行下一个函数调用，并在子函数的开头停止（例如，在图 8-3 中，它将调用 `fib(2)` 并在其起始处暂停)。即将被调用的函数显示在控件下方。\n\
    - *停止调试（Stop Debugging）：* 终止调试会话并将控制权交给正常的 REPL。\n\n最后，请注意调试器面板中间的调用堆栈（Callstack）会话：它提供了导致当前状态的调用链的可点击历史记录。\n\
