    ## 9.3 Using the Pipe Operator


    The Pipe operator ([https://github.com/oxinabox/Pipe.jl](https://github.com/oxinabox/Pipe.jl))
    improves the Pipe operator `|>` in Julia Base.


    Chaining (or “piping”) allows you to string together multiple function calls in
    a way that is at the same time compact and readable. It avoids saving intermediate
    results without having to embed function calls within one another.


    With the chain operator `|>`, the code to the right of `|>` operates on the result
    of the code to the left of it. In practice, the result of the operation on the
    left becomes the argument of the function call that is on the right.


    Chaining is very useful for data manipulation. Let’s assume that you want to use
    the following (silly) functions to operate, one after the other, on some data
    and print the final result:


    ```

    add6(a) = a+6; div4(a) = a/4;

    ```


    You could either introduce temporary variables or embed the function calls:


    ```

    # Method #1, temporary variables:

    a = 2;

    b = add6(a);

    c = div4(b);

    println(c) # Output: 2

    ```


    ```

    # Method 2, chained function calls:

    println(div4(add6(a)))

    ```


    With piping, you can instead write:


    ```

    a |> add6 |> div4 |> println

    ```


    Basic piping is very limited, in the sense that it supports only functions with
    one argument and “piping” over only one single function at a time.


    Conversely, the Pipe package provides the `@pipe` macro, which overrides the `|>`
    operator. It allows you to use functions with multiple arguments (and you can
    use the underscore character `_` as a placeholder for the value of the left side).
    You can also pipe multiple functions in a single piping step, like so:


    ```

    addX(a,x) = a+x; divY(a,y) = a/y

    a = 2

    ```


    ```

    # With temporary variables:

    b = addX(a,6)

    c = divY(a,4)

    d = b + c

    println(c)

    ```


    ```

    # With @pipe:

    @pipe a |> addX(_,6) + divY(4,_) |> println # Output: 10.0

    ```


    You can even pipe over multiple values by embedding them in tuples:


    ```

    data = (2,6,4)

    ```


    ```

    # With temporary variables:

    b = addX(data[1],data[2]) # 8

    c = divY(data[1],data[3]) # 0.5

    d = b + c # 8.5

    println(c)

    ```


    ```

    # With @pipe:

    @pipe data |> addX(_[1],_[2]) + divY(_[1],_[3]) |> println

    ```


    Note that, as with the basic pipe, functions that require a single argument that’s
    provided by the piped data don’t require parentheses.


    ## 9.4 Plotting


    ### 9.4.1 Installation and Backends


    Plotting in Julia can be obtained using a specific plotting package (e.g., Gadfly
    at [https://github.com/dcjones/Gadfly.jl](https://github.com/dcjones/Gadfly.jl),
    Winston at [https://github.com/nolta/Winston.jl](https://github.com/nolta/Winston.jl),
    or, as many prefer, using the Plots package [https://github.com/JuliaPlots/Plots.jl](https://github.com/JuliaPlots/Plots.jl),
    which provides a wrapper with a unified API to several supported backends.


    Backends are chosen by running `chosenbackend()`—that is, the name of the corresponding
    backend package, but written all in lowercase—before calling the plot function.
    The Plots package comes with GR as its default backend (see Figure 9-1), and GR.jl
    is installed alongside Plot.jl.


    If you require other backends, you can simply install the relative packages.


    Two fairly complete backends are:


    • Plotly.JS ([https://github.com/sglyon/PlotlyJS.jl](https://github.com/sglyon/PlotlyJS.jl)):
    A Julia wrapper to the plotly.js ([https://plot.ly](https://plot.ly)) visualization
    library

    • PyPlot ([https://github.com/JuliaPy/PyPlot.jl](https://github.com/JuliaPy/PyPlot.jl)):
    A wrapper to the Python matplotlib ([http://matplotlib.org/api/pyplot_api.html](http://matplotlib.org/api/pyplot_api.html))


    For example:


    ```

    using Pkg

    Pkg.add("Plots")

    using Plots

    plot(cos,-4pi,4pi, label="Cosine function (GR)") # Plot using the default GR backend

    Pkg.add("PyPlot")

    Pkg.add("PlotlyJS")

    Pkg.add("ORCA") # Required by PlotlyJS

    pyplot()

    plot(cos,-4pi,4pi, label="Cosine function (PyPlot)")

    plotlyjs()

    plot(cos,-4pi,4pi, label="Cosine function (PlotlyJS)")

    ```


    ![Image 16](index-178_1.jpg)


    ***Figure 9-1.** Cosine function with the default backend GR*


    While GR is the default backend, i.e., the one that will be used on every new
    session unless a call to other backend is made, you can set your own default setting
    `ENV["PLOTS_DEFAULT_BACKEND"] = "myPreferredBackend"` in the `~/.julia/config/startup.jl`
    file.


    Be sure not to mix different plotting packages (e.g., Plots and one of its backends
    used directly). This will likely create trouble. If you have imported a plot package
    and want to use a different one, you should always restart the Julia kernel (this
    is not necessary, and it is one of the advantages, when switching between different
    backends of the Plots package).


    You can check which backend is currently being used by Plots with `backend()`.


    There are many different backends. While basic plots can be obtained from virtually
    any backend, each has its own edge on some characteristic—whether it’s speed,
    aesthetics, or interactivity, for example. Some advanced attributes may be supported
    only by a subset of backends.


    It’s important to choose the right backend for your specific case. The following
    pages may be of interest in this regard:


    • Which backend should you choose? ([http://docs.juliaplots.org/latest/backends/](http://docs.juliaplots.org/latest/backends/))

    • Charts and attributes supported by the various backends ([http://docs.juliaplots.org/latest/supported/](http://docs.juliaplots.org/latest/supported/))


