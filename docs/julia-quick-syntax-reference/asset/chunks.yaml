    fitY = [fit.param[1] / (1+exp(-fit.param[2] * (x - fit.


    param[3]))) for x in fitX]


    plot(fitX,fitY, seriestype=:line, label="Fitted values") plot!(obsVols.age, obsVols.vol,
    seriestype=:scatter, label="Obs values")


