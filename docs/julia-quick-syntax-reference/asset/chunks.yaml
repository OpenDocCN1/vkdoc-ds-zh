    **3.4.3 Multiple-Dispatch (aka Polymorphism)**


    When similar logic should be applied to different kinds of objects (i.e., different
    types), you can write functions that share the same name but have different types
    or different numbers of parameters (and different implementation). This highly
    simplifies the Application Programming Interface (API) of your application, as
    only one name has to be remembered.


    ChApTer 3 CoNTrol FloW ANd FuNCTIoNs


    When calling such functions, Julia will pick up the correct one


    depending on the parameters in the call, selecting by default the stricter version.


    These different versions are called *methods* in Julia and, if the function is
    type-safe, dispatch is implemented at compile time and is very fast.


    You can list all the methods of a given function by using


    methods(myfunction).


    The multiple-dispatch polymorphism is a generalization of object-


    oriented runtime polymorphism, where the same function name


    performs different tasks, depending on which is the object’s class. The polymorphism
    in traditional object-oriented languages is applied only to a single element,
    whereas in Julia it applies to all the function arguments (it remains true however
    that object-oriented languages have multiple- parameters polymorphism at compile-time).


    I’ll go more in depth into multiple-dispatch when dealing with type inheritance
    in Chapter [4.](#index_split_000.html#p70)


