    \ series, `plot` defines alias functions like `scatter(args)` that correspond\
    \ to `plot(args, seriestype=:scatter)`.\n\nUsing first `plot` and then `plot!`,\
    \ you can mix several types of charts together (see Figure [9-3](#index_split_001.html#p182)):\n\
    \n```\nplot(x,y[:,1], seriestype=:bar)\n```\n\n**JULIA**\n\n```\nplot!(x,y[:,2],\
    \ seriestype=:line)\nplot!(x,y[:,3], seriestype=:scatter)\n```\n\n![Image 18](index-182_1.png)\n\
    \n## Chapter 9 Working With Data\n\n***Figure 9-3.** Plotting multiple types of\
    \ charts*\n\n`seriestype` and `label` are just two of the many keyword arguments\
    \ supported by `plot`. They are too numerous to be described in detail in this\
    \ book. Refer to the `Plots.jl` documentation or use the inline help guide `?plot`\
    \ and `plotattr()` if you want to learn more.\n\n### 9.4.3 Plotting from DataFrames\n\
    \nInstead of plotting data from arrays, you can plot data from DataFrames directly,\
