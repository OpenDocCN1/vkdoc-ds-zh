    \ 8: Effectively Write Efficient Code\n\nThis chapter includes a discussion of\
    \ the following third-party packages:\n\n| Package Name | URL | Version |\n|---|---|---|\n\
    | `BenchmarkTools.jl` | [https://github.com/JuliaCI/BenchmarkTools.jl](https://github.com/JuliaCI/BenchmarkTools.jl)\
    \ | v0.4.2 |\n| `ProfileView.jl` | [https://github.com/timholy/ProfileView.jl](https://github.com/timholy/ProfileView.jl)\
    \ | v0.4.1 |\n| `JuliaInterpreter.jl` | [https://github.com/JuliaDebug/JuliaInterpreter.jl](https://github.com/JuliaDebug/JuliaInterpreter.jl)\
    \ | v0.6.1 |\n| `Juno` | [https://junolab.org](https://junolab.org) / [https://github.com/JunoLab/Atom.jl](https://github.com/JunoLab/Atom.jl)\
    \ | v0.9.1 |\n| `atom-julia-client` | [https://github.com/JunoLab/atom-julia-client](https://github.com/JunoLab/atom-julia-client)\
    \ | v0.9.4 |\n\nThe objective of this chapter is to present topics that, while\
    \ maybe not strictly essential, are nevertheless very important for writing efficient\
    \ code in an efficient manner, i.e. code that runs fast and is easy (and fun)\
    \ to write.\n\nI first deal with code performance, then move to parallelization\
    \ in order to speed up execution even more. I continue discussing tools that allow\
    \ developers to check that the program is following the intended behavior and\
    \ facilitate early bug determination. I finish the chapter with the constructs\
    \ that you can employ to isolate, and possibly correct, problems that arise at\
