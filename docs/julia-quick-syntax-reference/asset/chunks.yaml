    \ `sort` option you saw in the `pivot` function.\n\n### 9.1.10 Dataframe Export\n\
    \n#### Exporting to CSV\n\nExporting DataFrames to CSV format is directly supported\
    \ by the `CSV.jl` package that we saw in Chapter 5:\n\n```\nCSV.write(\"file.csv\"\
