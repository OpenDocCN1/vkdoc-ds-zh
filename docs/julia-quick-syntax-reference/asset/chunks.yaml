    \nviii\n\n**About the Author**\n\n**Antonello Lobianco**, PhD is a research engineer\
    \ employed by a French Grande école (Polytechnic University). He works on biophysical\
    \ and economic modeling of the forest sector and is responsible for the\n\nLab\
    \ Models portfolio. He uses C++, Perl, PHP, Python, and Julia. He teaches environmental\
    \ and forest economics at the undergraduate and graduate levels and modeling at\
    \ the PhD level. He has been following the development of Julia as it fits his\
    \ modeling needs, and he is the author of several Julia packages (search for sylvaticus\
    \ on GitHub for more information).\n\nix\n\n**About the Technical Reviewer**\n\
    \n**Germán González-Morris** is a polyglot software architect/engineer with 20+\
    \ years in the field. He has knowledge of Java (EE), Spring, Haskell, C, Python,\
    \ and JavaScript, among others. He works with web distributed applications. Germán\
    \ loves math puzzles (including reading Knuth) and swimming. He has tech reviewed\
    \ several books, including an application container book (Weblogic), as well as\
    \ titles covering various programming languages (Haskell, TypeScript, WebAssembly,\
    \ Math for Coders, and\n\nRegExp, for example). You can find more information\
    \ on his blog\n\n([https://devwebcl.blogspot.com/](https://devwebcl.blogspot.com/))\
    \ or Twitter account (@devwebcl).\n\nxi\n\n**Acknowledgments**\n\nThis work has\
    \ been supported by the French National Research Agency through the Laboratory\
    \ of Excellence, ARBRE, part of the “Investissements d’Avenir” program (ANR 11\
    \ – LABX-0002-01).\n\nI want to thank Germán González-Morris for his valuable\
    \ help in\n\nfinding errors in the code and improving the description of the language.\n\
    \nI want to also thank Mark Powers, the Apress coordinating editor, for his numerous\
