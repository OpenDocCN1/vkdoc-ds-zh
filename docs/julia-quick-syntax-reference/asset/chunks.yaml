    \ 与用于定义键值对（例如，在字典中）的双箭头 `=>` 混淆。\n\n## 3.4.8 广播函数\n\n你经常会有一个设计用于处理标量的函数，但你想将其重复应用于容器内的值，例如数组的元素。你可以不编写\
