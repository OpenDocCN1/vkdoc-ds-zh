    \ except the fourth one.\n- `df[ [i in [\"US\",\"China\"] for i in df.region],\
    \ :]` filters by value, based on a value being in a list using Boolean selection\
    \ through list comprehension. The list comprehension part returns an array of\
    \ Boolean values based on the condition, then you use the Boolean selection over\
    \ it.\n\n**Chapter 9 Working With Data**\n\n- `df[([i in [\"US\",\"China\"] for\
    \ i in df.region] .> 0) .& (df.year .== 2010), :]` filters by multiple conditions\
    \ in the Boolean selection. The dot is needed to vectorize the operation. Note\
    \ the use of the bitwise and the single ampersand.\n- `df[startswith.(df.region,\"\
    E\"),:]` filters based on the initial pattern of the desired values.\n- `@where(df,\
    \ condition(s))`: Filter using `@where` (from the `DataFrameMeta` package). In\
    \ case of multiple conditions, all of them must be verified. If the column name\
    \ is stored in a variable, you need to wrap it using the `cols()` function. For\
    \ example, `colToFilter = :region; @where(df, :production .> 3, cols(colToFilter)\
    \ .== \"US\")`.\n\nAnother (and perhaps more elegant, although longer) way to\
    \ query a `DataFrame` is to use the `Query` package (see [https://github.com/queryverse/Query.jl](https://github.com/queryverse/Query.jl)).\
    \ The first example selects a subset of rows and columns; the second one highlights\
    \ how you can mix multiple selection criteria:\n\n```\ndfOut = @from i in df begin\n\
    @where i.region == \"US\"\n```"
