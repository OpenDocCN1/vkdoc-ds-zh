    \ of the string printed.\n- `print(\"Hello World\");`\n- `println(\"Hello World\"\
    )` — Call `print(\"Hello World\")` and add a newline.\n\n#### `write` versus `print`\n\
    \nThe main difference between the two functions is that while `write` outputs\
    \ the raw bytes of the object, `print` outputs a text representation of it. This\
    \ representation is already defined for all the built-in types, and a default\
    \ is provided for custom types (in contrast with `write()`, which would throw\
    \ a `MethodError`). This default can be modified by overriding `print()`:\n\n\
