    \"\"), delim=\" \", ignorerepeated=true, copycols=true)\n\n# Here we are converting\
    \ the table in a \"(plant, market) => distance\" dictionary\n# r[:plants]: the\
    \ first key, using the cell at the given row and `plants` field\n# m: the second\
