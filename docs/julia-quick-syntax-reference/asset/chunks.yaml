    \ to a `DataFrame`) if it’s a single row\n- `T` if it’s a single cell\n- Another\
    \ `DataFrame` otherwise\n\nFiltering:\n- `df[arrayOfBooleans,:]`: Select the rows\
    \ where `arrayOfBooleans` (that must be of congruent size) is `true`. This is\
