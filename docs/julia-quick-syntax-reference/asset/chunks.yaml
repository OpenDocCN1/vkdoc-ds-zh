    \ libraries\n\n```julia\nplants = [\"seattle\",\"san-diego\"] # canning plants\n\
    markets = [\"new-york\",\"chicago\",\"topeka\"] # markets\n```\n\n### Defining\
    \ the Parameters\n\nThe capacity of plants and the demand of markets are directly\
