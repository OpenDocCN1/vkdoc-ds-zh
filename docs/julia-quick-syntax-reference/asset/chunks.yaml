    **10.1 JuMP, an Optimization Framework**


    JuMP ([https://github.com/JuliaOpt/JuMP.jl) is an “](https://github.com/JuliaOpt/JuMP.jl)Algebraic
    Modeling Language” (AML) for mathematical optimization problems, similar to GAMS
    ([https://www.gams.com/), AMP](https://www.gams.com/)[L (https://ampl.com/) or
    P](https://ampl.com/)yomo ([http://www.pyomo.org/](http://www.pyomo.org/)).


    Optimization problems are problems that find the “optimal” quantities of decision
    variables in the context of an objective function and the constraints between
    the variables. Constraints arise everywhere in the real world, be it with business
    decisions (e.g., “How much should we produce of X?”), engineering settings (e.g.,
    “At which angle should we design a flap for maximum efficiency?”), or personal
    choices (e.g., “A small flat in the city or a large house far in the countryside?”).


    These kinds of problems can be mathematically formulated in terms of a function
    to maximize (or minimize) subject to other functions acting as constraints.


    Software “tools” have been created to solve these problems. They


    typically require you to formulate the optimization problem in a matrix format
    and, for non-linear problems, to provide some additional


    information about the problem in terms of first and second derivatives to help
    find the numerical optimal solution. Solver-based approaches in the MATLAB optimization
    toolbox or R’s optim function are two well known examples.


    AMLs take a different approach in the sense that they decouple the formulation
    of the problem to the specific algorithm used to solve it. The problem can now
    be coded algebraically, using the same mathematical notation that is used to describe
    it.


    Chapter 10 MatheMatiCal libraries


    Critically, variables can be indexed across any dimension using the concept of
    “sets,” thus allowing you to code equations like Demand[year,ti me,region,product]
    = Supply[year,time,region,product]. Tools that


    automatically provide the derivatives are included.


    Once they are formulated, the problems can be solved by any “solver engine” supported
    by the AML software and suited for that specific problem class.


    Commercial AMLs do have a drawback, however—they each use


    their own specific language. Being language-specific, they lag behind


    “real,” general purpose, programming languages in many characteristics (data handling,
    availability of developer tools, language constructs, etc.).


    Interfacing them with other parts, not linked to optimization, in a larger model
    could be difficult.


    JuMP is instead part of the “third generation” of optimization tools (the first
    one being the solver engines themselves and the second one being the commercial,
    language-specific AMLs) that are AML embedded as a software library in a general
    purpose programming language.


    JuMP offers the same simplicity of modeling and solver-independency of language-specific
    AMLs while offering the benefits of a much more practical modeling environment.
    If it’s combined with free solver engines (e.g., GLPK for Mixed Integer Problems
    and IPOPT for Non Linear


    problems), it is a complete open-source solution.


    In this section, you learn how to use JuMP by implementing two


    problems, one with only linear functions and one where the objective is non-linear.
    The general settings of the problems will be the same: you choose the solver more
    suited to the specific problem, you load the Julia package for the solver-specific
    interface, you create the problem “object,”


    and you add to it its characteristic elements, like variables, objective functions,
    and constraints. At this point, you can “solve” the problem and retrieve its solutions.


    The examples serve also to highlight the power of Julia macros. Using them, JuMP
    implements its own language, while still remaining Julia.


