    **3.4.8 Broadcasting Functions**


    You’ll often have a function designed to work with scalars, but you want to apply
    it repetitively to values within a container, like the elements of an array. Instead
    of writing for loops, you can rely on a native functionality of Julia, which is
    to *broadcast* the function over the elements you wish.


    Take, for example, the following function:


    f1(a::Int64,b::Int64) = a*b


    It expects as input two scalars. For example:


    f1(2,3)


