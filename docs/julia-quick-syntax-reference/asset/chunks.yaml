    \ to override also `println()`)\n```\n\n### 5.2.2 Writing to a File\n\nWriting\
    \ to a file is similar to reading a file, but with the modality `w` (overwrite\
    \ the file) or `a` (append to the existing data) instead of `r` in the `open()`\
    \ function call. You must also, of course, use an output function such as `write`\
    \ or `print` over the `IO` object:\n\n```julia\nopen(\"afile.txt\", \"w\") do\
