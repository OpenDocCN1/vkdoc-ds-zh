    , 2011) => 2.8\n```\n\n#### Exporting to the hdf5 Format\n\nIn order to use hdf5\
    \ with the `HDF5` package (<https://github.com/JuliaIO/HDF5.jl>), some systems\
    \ may require you to install system-wide hdf5 binaries. For example, in Deb-based\
    \ Linux distributions, you should run `sudo apt-get install hdf5-tools`.\n\nThe\
    \ `HDF5` package doesn’t support DataFrames directly, so you need first to export\
    \ them as matrixes. A further limitation is that it doesn’t accept a matrix of\
    \ `Any` or `Union{}` types, so you may have to export the DataFrame in two pieces—the\
    \ string and the numeric columns separately.\n\n```\nh5write(\"out.h5\", \"mygroup/myDf\"\
    , convert(Array, df[:,[:cols]]))\n```\n\nYou can read back the data by using `data\
    \ = h5read(\"out.h5\", \"mygroup/myDf\")`.\n\n## 9.2 Using IndexedTables\n\n`IndexedTables`\
    \ (<https://github.com/JuliaComputing/IndexedTables.jl>) are alternative table-like\
    \ data structures. Their API is somehow less convenient compared to those of DataFrames,\
    \ but they are particularly interesting (a) for performant row selections, as\
    \ they internally use indexed named tuples (instead of arrays in a DataFrame),\
    \ and (b) for being part of a large `JuliaDB` ecosystem (<https://juliadb.org/>)\
    \ of data-management packages, capable of handling very large sets of data that\
    \ aren’t held in the memory of a single machine.\n\nThey come in two variants—normal\
    \ indexed tables (`IndexedTable`) and sparse ones (`NDSparse`).\n\nOf the two,\
    \ I discuss only the second one, as the first one is selectable by row position,\
    \ and it’s potentially less interesting than `NDSparse`, where you can use keys\
    \ instead.\n\n### 9.2.1 Creating an IndexedTable (NDSparse)\n\n```\nmyTable =\
    \ ndsparse((\n    JULIA\n    region = [\"US\",\"US\",\"US\",\"US\",\"EU\",\"EU\"\
    ,\"EU\",\"EU\"],\n    product = [\"Hardwood\",\"Hardwood\",\"Softwood\",\"Softwood\"\
    ,\"Hardwood\",\"Hardwood\",\"Softwood\",\"Softwood\"],\n    year = [2011,2010,2011,2010,2011,2010,2011,2010]\n\
    ),(\n    production = [3.3,3.2,2.3,2.1,2.7,2.8,1.5,1.3],\n    consumption = [4.3,7.4,2.5,9.8,3.2,4.3,6.5,3.0]\n\
    ))\n```\n\nSparse indexed tables are created with the `ndsparse` function, which\
    \ accepts either a named tuple (the reason for the two parentheses) or a pair\
    \ of them. The reason is that `IndexedTables` explicitly divides between *key*\
    \ columns and *value* ones (the method with a single named tuple assumes the last\
    \ column as the value).\n\nThe division between key and value columns is evident\
    \ when the indexed table is visualized:\n\n```\njulia> myTable\n    JULIA\n  \
    \  3-d NDSparse with 8 values (2 field named tuples):\n    region product year\
    \ │ production consumption\n    ──────────────────┼──────────────────\n    \"\
    EU\" \"Hardwood\" 2010 │ 2.8 4.3\n    \"EU\" \"Hardwood\" 2011 │ 2.7 3.2\n   \
    \ \"EU\" \"Softwood\" 2010 │ 1.3 3.0\n    \"EU\" \"Softwood\" 2011 │ 1.5 6.5\n\
    \    \"US\" \"Hardwood\" 2010 │ 3.2 7.4\n    \"US\" \"Hardwood\" 2011 │ 3.3 4.3\n\
    \    \"US\" \"Softwood\" 2010 │ 2.1 9.8\n    \"US\" \"Softwood\" 2011 │ 2.3 2.5\n\
    ```\n\nFurther, you may notice that the table has been automatically sorted, like\
    \ in a dictionary.\n\nIndexed tables can also be obtained, using the same function,\
    \ from an existing DataFrame, e.g., `myTable = ndsparse(df)`.\n\n(Sparse) indexed\
    \ tables are accepted as arguments in some self-explanning functions, such as\
    \ `show`, `first`, `colnames`, `pkeynames`, and `keytype`.\n\nIndexed tables are\
