    ## 9.1.5 Editing Data


    There are many ways in which you can edit data:


    - `df[rowIdx,:col1] .= aValue`: Edit values by specifying rows and columns (e.g.,
    `df[[1,2],:production] .= 4.2`).

    - `df[(df.col1 .== "foo"), :col2] .= aValue`: Change values by filtering through
    a Boolean selection (e.g., `df[(df.region .== "US") .& (df.product .== "Hardwood"),
    :production] .= 5.2`).

    - `df.col1 = map(akey->myDict[akey], df.col1)`: Replace values (or add columns)
    based on a dictionary (the original data—`df.col1`—could be in a different column
    or in a different DataFrame, e.g., `rFullName = Dict("US" => "United States",
    "EU" => "European Union"); df.regFullName = map(rShortName->rFullName[rShortName],
    df.region)`).

    - `df.newCol = df.col1 .* " " .* df.col2`: Concatenate (string) values for several
    columns to create the value in a new column (e.g., `df.regAndProduct = df.region
    .* " " .* df.product`).

    - `df.a = df.b .* df.c`: Compute the value of an existing or new column based
    on the values of other columns. Note that you need to make element-wise operations.
    Sometimes (e.g., with addition and subtractions) it is not needed, but in general
    the operation between the columns should use the dot operator (except for the
    actual assignation with the equals sign). Alternatively, you can use `map`. For
    example, `df.netExport = map((p,c) -> p - c, df.production, df.consumption)`.

    - `push!(df, [aRowVector])`: Append a row to the `df`, e.g., `push!(df,["EU" "Softwood"
    2012 5.2 6.2])`.

    - `deleterows!(df,rowIdx)`: Delete the given rows. `rowIds` can be a scalar, a
    vector, or a range. You can alternatively just copy the `df` without the rows
    that are not needed, e.g., `i=3; df2 = df[[1:(i-1);(i+1):end],:]`.

    - `df = similar(df,0)`: Empty a `df`. `df2 = similar(df,n)` copies the structure
    of a `df` by adding `n` rows (with rubbish data) to the new DataFrame (`n` defaults
    to `size(df)[1]`). You can use it with `n=0` in order to empty a given `df`.


    ## 9.1.6 Editing Structure


    There are also many ways in which you can edit the structure of the data:


    - `select!(df,Not([:col1,:col2]))`: Delete columns by name.

    - `names!(df, [:newCName1,:newCName2,:newCName3])`: Rename all columns. Use `rename!(df,
    Dict(:oldCName1=> :newCName1))` to rename only a few columns.

    - `df = df[:,[:b, :a] ]`: Change the column order.

    - `df.id = 1:size(df, 1)`: Add an "id" column (useful for unstacking an operation;
    we see more of this later in this chapter).

    - `addCols!(df, [:colNames], [colTypes])`: Add to the DataFrame empty columns
    called `colNames` of types `colTypes` (from the `LAJuliaUtils` package). For example,
    `addCols!(df, [:import, :export], [Float64, Float64])`.

    - `df.a = Array{Union{Missing,Float64},1}(missing,size(df,1))`: Add a `Float64`
    column (filled with missing values by default).

    - `insert!(df, i, [colContent], :colName)`: Insert a column at position `i`.

    - `df.a = convert(Array{T,1},df.a)`: Convert column type to `T`.

    - `df.a = map(string, df.a)`: Convert from `Int64` (or `Float64`) to `String`
    (e.g., `df.namedYear = map(string,df.year)`).

    - `stringToFloat(str) = try parse(Float64, str) catch; return(missing) end; df.a
    = map(stringToFloat, df.a)`: Convert from `String` to `Float` (converting to integers
    is similar).

    - `categorical!(df, [:a, :b])`: "Pool" specific columns in order to efficiently
    store repeated categorical variables. Note that while the memory decreases, filtering
    with categorical values is not necessarily quicker (indeed it can be a bit slower).

    - `collect(df.a)`: Convert a categorical array into a normal one.


    ## Merging/Joining/Copying Datasets


    You can use these methods to join datasets:


    - `df = vcat(df1,df2,df3)`: Vertically concatenate different DataFrames with the
    same structure (or `df = vcat([df1,df2,df3]...)` (note the three dots at the end).'
