- fmt: "# Markdown 排版输出\n\n- `end`, i.e., the splat operator).\n\n- `df = hcat(df1,df2,\
    \ makeunique=true)`: Horizontally concatenate DataFrames with the same number\
    \ of rows. `makeunique=true` is needed if the DataFrames to be merged have columns\
    \ with identical names.\n\n- `fullDf = join(df1, df2, on = :commonCol)`: Join\
    \ DataFrames horizontally. The `on` parameter can also be an array of common columns.\
    \ There are many possible types of join. The most common ones are `:inner` (the\
    \ default; only rows with keys on both sides are returned), `:left` (rows on the\
    \ left df with keys not present on the right df are also returned), `:right` (opposite\
    \ of `:left`), and `:outer` (rows with elements missing in any of the two dfs\
    \ are also returned).\n\n- `df2 = similar(df1, 0)`: Copy the structure of a DataFrame\
    \ (to an empty one).\n\n## 9.1.7 Managing Missing Values\n\nRecall that missing\
    \ values (i.e., `missing`, the only instance of the singleton `Missing` type)\
    \ will propagate silently across operations if they aren’t dealt with. The DataFrames\
    \ package provides a series of methods to allow the programmer to decide what\
    \ to do with this data, depending on the interpretation of missingness:\n\n- `dropmissing(df)`\
    \ and `dropmissing!(df)`: Return a df with only complete rows, i.e., without missing\
    \ in any field (`dropmissing(df[[:col1,:col2]])` is also available). Within an\
    \ operation (e.g., a sum), you can use `dropmissing()` in order to skip missing\
    \ values before the operation takes place.\n\n- `completecases(df)` or `completecases(df[[:col1,:col2]])`:\
    \ Return a Boolean array concerning absence in the whole row or in the specified\
    \ fields.\n\n- `[df[ismissing.(df[!,i]), i] .= 0 for i in names(df) if Base.nonmissingtype(eltype(df[!,i]))\
    \ <: Number]`: Replace missing with 0 values in all numeric columns, like `Float64`\
    \ and `Int64`.\n\n- `[df[ismissing.(df[!,i]), i] .= \"\" for i in names(df) if\
    \ Base.nonmissingtype(eltype(df[!,i])) <: String]`: Replace missing with `\"\"\
    ` values in all string columns.\n\n- `isequal.(a,b)`: Compare without missing\
    \ propagation (e.g., `isequal(\"US\",missing)` returns `false`, while `\"US\"\
    \ == missing` would neither be `true` nor `false` but `missing`).\n\n- `nMissings\
    \ = length(findall(x -> ismissing(x), df.col))`: Count missing values in a column.\n\
    \n## 9.1.8 The Split-Apply-Combine Strategy\n\nThe DataFrames package supports\
    \ the common *Split-Apply-Combine* strategy through the `by` function, which takes\
    \ in three arguments: (1) a DataFrame, (2) a column (or columns) to split the\
    \ DataFrame on, and (3) a function or expression to apply to each subset of the\
    \ DataFrame.\n\nUsing the `by` function, the “inner” function will be applied\
    \ to each subgroup and whatever it returns (a scalar, an array, a named tuple,\
    \ or a DataFrame) will be first horizontally merged with the values defining the\
    \ subgroups and then vertically merged (“combined”) to compose a final DataFrame\
    \ returned by the `by` function. Returning a named tuple or a DataFrame allows\
    \ the new columns to be labeled, with the first to be preferred for performance\
    \ reasons.\n\nOne method of the `by` function takes instead the function as the\
    \ first argument, and it’s hence commonly applied using `do` blocks.\n\nInternally,\
    \ the `by` function uses the `groupby()` function, as in the code, it is defined\
    \ as nothing else than:\n\n```\nby(d::AbstractDataFrame, cols, f::Function) =\n\
    combine(map(f, groupby(d, cols))) JULIA\nby(f::Function, d::AbstractDataFrame,\
    \ cols) = by(d, cols, f)\n```\n\nLet’s see how to apply the `by` function to some\
    \ common data transformation patterns.\n\n### Aggregating\n\nIn case of aggregation,\
    \ you want to reduce the dimensionality of each subgroup defining one or more\
    \ operations, each returning a scalar in place of the many possible values of\
    \ the subgroup (e.g., a sum or a mean).\n\nThe inner function must return a *row*—such\
    \ as a named tuple or a DataFrameRow, a DataFrame with a single line.\n\nThe following\
    \ examples show the different ways to aggregate by region and by product. These\
    \ examples use the prior example of the timber market data (the `mean` function\
    \ requires the standard library package `Statistics`):\n\n```\n# Inner function\
    \ returning an horizontal array (a row)\n(new columns are given automatic names)\n\
    JULIA\nby(df, [:region, :product]) do subgroup\n    [mean(subgroup.production)\
    \ sum(subgroup.consumption)]\nend\n```\n\n```\n# Inner function returning a named\
    \ tuple (returned columns are named)\nby(df, [:region, :product]) do subgroup\n\
    \    (avgProduction=mean(subgroup.production),\n     totalConsumption=sum(subgroup.consumption))\n\
    end\n```"
