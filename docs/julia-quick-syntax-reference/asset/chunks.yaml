    Chapter 6 MetaprograMMing and MaCros


    In Julia and a few other languages (notably those derived or inspired by the Lisp
    programming language), the code written by the programmer is parsed and translated
    to computer instructions in what is known as the Abstract Syntax Tree (or AST).
    At this point, the code is in the form of a data structure that can be traversed,
    created, and manipulated from within the language (without the need for a third-party
    tool or a separate building step). That means that the “code substitution” (later
    called a *macro*) can now be much more expressive and powerful, as you can directly


    manipulate computer instructions instead of text.


    This chapter introduces the concepts of *symbols* and *expressions*, and then
    explains how macros work.


    **6.1 Symbols**


    Symbols are intimately bound with the ability of Julia to represent the language’s
    code as a data structure in the language itself. A *symbol* is indeed a way to
    refer to a data object and still keep it in an unevaluated form. For example,
    when dealing with a variable, you can use a symbol to refer to the actual identifiers
    and not to the variable’s value. Symbols can also refer to operators and any other
    parts of the (parsed) computer instructions. For example, :myVar , :+ , and :call
    are all valid symbols.


    To form a symbol, use the colon : prefix operator or the symbol()


    function. For example:


    a = :foo10 is equal to a=Symbol("foo10")


    The symbol() function can optionally concatenate its arguments to


    form the symbol, as follows:


    a=Symbol("foo",10)


    To convert a symbol back to a string, use string(mysymbol).


    Chapter 6 MetaprograMMing and MaCros


    **6.2 Expressions**


    Expressions are unevaluated computer instructions. In Julia they too are objects.
    Specifically, they are instances of the expr type, whose fields are head, defining
    the kind of expression, and args, defining the array of elements. These can be
    symbols, primitive (not modifiable) values such as strings and numbers, or other
    sub-expressions (from which the tree data structure is obtained).


    Being objects, expressions are first-class citizens in Julia. They support all
    the operations generally available to other entities, as being passed as an argument,
    returned from a function, modified, or assigned to a variable.


    Expressions are normally created by parsing the computer code and


    their ultimate destiny is to be evaluated.


    For example, the string "b = a+1" when parsed becomes an expression. In the AST,
    this is seen as follows:


    julia> expr = Meta.parse("b = a+1 # This is a comment") JULIA julia> typeof(expr)


    Expr


    julia> dump(expr)


    Expr


    head: Symbol =


    args: Array{Any}((2,))


    1: Symbol b


    2: Expr


    head: Symbol call


    args: Array{Any}((3,))


    1: Symbol +


    2: Symbol a


    3: Int64 1


    Chapter 6 MetaprograMMing and MaCros


    In the first line of the script, you start creating an expression object by parsing
    the string "b=a+1 # This is a comment" and saving it in the expr variable. You
    then dump it in order to examine its internals.


    Note that the comments have been stripped out and that this simple expression
    is interpreted as a branch. The master is the equals sign and the two arguments
    are the variable b and a lower-level expression, which itself is a call to the
    + operator with the parameters a and 1.


    This shows you that internally, b = a+1 is seen as b = +(a,1), i.e., the plus
    operator is acting like a normal function that takes parameters.


    **6.2.1 Creating Expressions**


    There are many ways to create expressions, discussed next.


    **Parse a String**


    The first way to create an expression is what you just saw—by parsing a string
    with meta.parse(). This is what Julia uses when parsing a .jl script or the REPL
    input.


    **Colon Prefix Operator**


    Expressions can be created using the same colon : prefix operator you saw for
    individual symbols, this time applied to a whole expression (given in brackets):


    expr = :(a+1)


    **Quote Block**


    An alternative to the :([...]) operator is the quote [...] end block: expr = quote


    JULIA


    b = a+1


    end


    Chapter 6 MetaprograMMing and MaCros


    **Use the Exp Constructor with a Tree**


    An expression can be also directly constructed from a given tree. So this: expr2
    = Expr(:(=), :b, Expr(:call,:+,:a,1))


    is equivalent to this:


    expr = Meta.parse("b = a+1") or expr = :(b = a+1)


    **6.2.2 Evaluating Symbols and Expressions**


    To evaluate an expression or a symbol, use the eval() function:


    expr = Meta.parse("3+2")


    JULIA


    eval(expr) # 5


    the evaluation happens at the global scope, even if the eval()


    call is done within a function. that is, the expression being evaluated will have
    access to the global variables but not to the local ones.


    This code is trivial, as it only contains literals, i.e., immutable values known
    at compile time. But what happens when the expression contains variables? Will
    the computation consider the value bound to the variable at the time the expression
    is composed or when it is evaluated?


    It ends up that you can choose this when you compose the expression, as shown
    in the following snippet:


    a = 1


    JULIA


    expr1 = Meta.parse("$a + b + 3")


    expr2 = :($a + b + 3) # Equiv. to expr1


    expr3 = quote $a + b + 3 end # Equiv. to expr1


    expr4 = Expr(:call, :+, a, :b, 3) # Equiv. to expr1


    Chapter 6 MetaprograMMing and MaCros


    eval(expr1) # UndefVarError: b not defined


    b = 10


    eval(expr1) # 14


    a = 100


    eval(expr1) # Still 14


    b = 100


    eval(expr1) # 104


    In the first line, you define the variable a and assign it a starting value. In
    expressions 1 to 3, you use the dollar $ operator to interpolate (“unquote”) the
    variable a. This indicates that you want to store its content in the expression,
    not the variable itself. This is why a has to exist beforehand.


    Conversely, with b, you indicate that it is the identifier b and not the value
    that is stored in the expression. This variable doesn’t even need to be defined
    at this point.


    Note that when you use the Expr constructor method to define expr4, you deal directly
    with unquoted entities. When you indicate a, you hence mean *the value bound to
    it*, and to indicate an identifier instead, you need to use a symbol (such as
    :b ).


    When you try to evaluate the expression, at this point Julia tries to look up
    the b symbol, and not finding it, throws an error. You must define and assign
    a value to b before the expression can be evaluated.


    Finally, note that whatever happens to the variable a has no effect on the evaluations
    of the expression, but modifying the value of b affects it.


    *A Loose Comparison to C/C++ Pointers*


    in C/C++, the & operator, when applied to a variable, returns its memory address.
    Conversely, the * operator, when applied to a


    memory address, returns the value of the variable stored at that


    address.


    Chapter 6 MetaprograMMing and MaCros


    in Julia, you can think of the variable name as the address itself. that means
    :var (like &var ) returns the variable name, while $var


    (like *var ) returns the value bound to that variable.


    **6.3 Macros**


    The possibility to represent code as expressions is at the heart of macros’


    power. Macros in Julia take one or more input expressions (and optionally literals
    and symbols) and return a modified expressions at parse time.


    Contrast this with normal functions that, at runtime, take input values (arguments)
    and return a computed value.


    Macros move the computation from the runtime to the compile-time,


    as the expression is generated and compiled directly rather than requiring a runtime
    eval call like a function would.


    **6.3.1 Macro Definition**'
  trans: "\n# A. Lobianco，《Julia 快速语法参考》，`doi.org/10.1007/978-1-4842-5190-4_6`\n\n\
    ## 第 6 章 元编程与宏\n\n在 `Julia` 和其他少数语言（尤其是那些派生或受 Lisp 编程语言启发的语言）中，程序员编写的代码会被解析并翻译成计算机指令，这一过程的结果称为抽象语法树（或\
    \ `AST`）。此时，代码呈现为一种数据结构，可以在语言内部进行遍历、创建和操作（无需借助第三方工具或单独的构建步骤）。这意味着“代码替换”（后来被称为\
    \ *宏*）可以拥有更强的表达能力和更强大的功能，因为你可以直接操作计算机指令，而不是操作文本。\n\n本章将介绍*符号*和*表达式*的概念，然后解释宏的工作原理。\n\
    \n### 6.1 符号\n\n符号与 `Julia` 将自身语言代码表示为数据结构的能力紧密相关。*符号*本质上是一种引用数据对象，同时使其保持未求值状态的方式。例如，在处理变量时，你可以使用符号来引用实际的标识符，而不是变量的值。符号也可以引用运算符和（已解析的）计算机指令的任何其他部分。例如，`:myVar`、`:+`\
    \ 和 `:call` 都是有效的符号。\n\n要创建一个符号，请使用冒号 `:` 前缀运算符或 `symbol()` 函数。例如：\n```julia\n\
    a = :foo10\n```\n等价于：\n```julia\na = Symbol(\"foo10\")\n```\n\n`symbol()` 函数可以有选择地连接其参数来组成符号，如下所示：\n\
    ```julia\na = Symbol(\"foo\",10)\n```\n\n要将符号转换回字符串，请使用 `string(mysymbol)`。\n\n\
    ### 6.2 表达式\n\n表达式是未经求值的计算机指令。在 `Julia` 中，它们同样也是对象。具体来说，它们是 `expr` 类型的实例，其字段包括\
    \ `head`（用于定义表达式的类型）和 `args`（用于定义元素数组）。这些元素可以是符号、原始（不可修改）值（如字符串和数字），或者其他子表达式（树形数据结构由此形成）。\n\
    \n作为对象，表达式在 `Julia` 中是“一等公民”。它们支持通常可用于其他实体的所有操作，例如作为参数传递、从函数返回、被修改或赋值给变量。\n\n\
    表达式通常通过解析计算机代码来创建，其最终命运是被求值。\n\n例如，字符串 `\"b = a+1\"` 在解析后会变成一个表达式。在 `AST`中，它看起来像这样：\n\
    ```julia\njulia> expr = Meta.parse(\"b = a+1 # 这是一个注释\")\njulia> typeof(expr)\n\
    Expr\njulia> dump(expr)\nExpr\n  head: Symbol =\n  args: Array{Any}((2,))\n  \
    \  1: Symbol b\n    2: Expr\n      head: Symbol call\n      args: Array{Any}((3,))\n\
    \        1: Symbol +\n        2: Symbol a\n        3: Int64 1\n```\n\n在脚本的第一行，你开始通过解析字符串\
    \ `\"b=a+1 # 这是一个注释\"` 来创建一个表达式对象，并将其保存在 `expr` 变量中。然后你使用 `dump` 来检查其内部结构。\n\n\
    请注意，注释已被剥离，并且这个简单的表达式被解释为一个分支。主节点是等号，两个参数分别是变量 `b` 和一个更低层级的表达式，该表达式本身是对 `+` 运算符的调用，其参数为\
    \ `a` 和 `1`。\n\n这表明在内部，`b = a+1` 被视为 `b = +(a,1)`，即加法运算符的行为就像一个接受参数的普通函数。\n\n\
    #### 6.2.1 创建表达式\n\n有多种创建表达式的方法，下面将逐一介绍。\n\n**解析字符串**\n\n创建表达式的第一种方法就是你刚刚看到的——使用\
    \ `Meta.parse()` 解析一个字符串。这就是 `Julia` 在解析 `.jl` 脚本或 `REPL` 输入时所采用的方法。\n\n**冒号前缀运算符**\n\
    \n可以使用你之前看到的应用于单个符号的同一个冒号 `:` 前缀运算符来创建表达式，这次它应用于整个表达式（用括号括起来）：\n```julia\nexpr\
    \ = :(a+1)\n```\n\n**引用块**\n\n`:([...])` 运算符的一个替代方案是 `quote [...] end` 块：\n```julia\n\
    expr = quote\n    b = a+1\nend\n```\n\n**使用树形结构配合 `Expr` 构造器**\n\n也可以直接从给定的树结构直接构建表达式。因此：\n\
    ```julia\nexpr2 = Expr(:(=), :b, Expr(:call, :+, :a, 1))\n```\n等价于：\n```julia\n\
    expr = Meta.parse(\"b = a+1\")\n```\n或：\n```julia\nexpr = :(b = a+1)\n```\n\n\
    #### 6.2.2 对符号和表达式求值\n\n要对表达式或符号求值，请使用 `eval()` 函数：\n```julia\nexpr = Meta.parse(\"\
    3+2\")\neval(expr) # 5\n```\n\n即使 `eval()` 调用发生在函数内部，求值也是在全局作用域中进行的。也就是说，被求值的表达式可以访问全局变量，但无法访问局部变量。\n\
    \n这段代码很简单，因为它只包含字面量，即编译时已知的不可变值。但如果表达式中包含变量会发生什么？计算会考虑表达式组合时绑定到变量的值，还是求值时的值？\n\
    \n事实证明，你可以在组合表达式时做出选择，如以下代码片段所示：\n```julia\na = 1\nexpr1 = Meta.parse(\"$a + b\
    \ + 3\")\nexpr2 = :($a + b + 3) # 等价于 expr1\nexpr3 = quote $a + b + 3 end # 等价于\
    \ expr1\nexpr4 = Expr(:call, :+, a, :b, 3) # 等价于 expr1\n\neval(expr1) # UndefVarError:\
    \ b not defined\nb = 10\neval(expr1) # 14\na = 100\neval(expr1) # 仍然是 14\nb =\
    \ 100\neval(expr1) # 104\n```\n\n在第一行，你定义了变量 `a` 并为其赋予了一个初始值。在表达式 1 到 3 中，你使用了美元\
    \ `$` 运算符来插值（“取消引用”）变量 `a`。这表明你想将它的值存储到表达式中，而不是变量本身。这就是为什么 `a` 必须事先存在的原因。\n\n\
    相反，对于 `b`，你指明存储在表达式中的是标识符 `b`，而不是其值。此时甚至不需要定义这个变量。\n\n请注意，当你使用 `Expr` 构造器方法定义\
    \ `expr4` 时，你直接处理的是取消引用的实体。当你指明 `a` 时，你指的是*绑定到它的值*；而要指明一个标识符，你需要使用一个符号（如 `:b`）。\n\
    \n当你尝试对表达式求值时，此时 `Julia` 会尝试查找 `b` 符号，如果找不到，就会抛出错误。你必须在表达式能够被求值之前定义 `b` 并为其赋值。\n\
    \n最后，请注意，无论变量 `a` 发生什么变化，都不会影响表达式的求值结果，但修改 `b` 的值会影响它。\n\n**与 C/C++ 指针的粗略比较**\n\
    \n在 `C/C++` 中，`&` 运算符应用于变量时，返回其内存地址。相反，`*` 运算符应用于内存地址时，返回存储在该地址的变量的值。\n\n在 `Julia`\
    \ 中，你可以将变量名本身视为地址。这意味着 `:var`（如同 `&var`）返回变量名，而 `$var`（如同 `*var`）返回绑定到该变量的值。\n\
    \n### 6.3 宏\n\n将代码表示为表达式的可能性是宏强大能力的核心。在 `Julia` 中，宏接受一个或多个输入表达式（以及可选的字面量和符号），并在解析时返回一个修改后的表达式。\n\
    \n这与普通函数形成对比，普通函数在运行时接受输入值（参数）并返回计算出的值。宏将计算从运行时移到编译时，因为表达式是直接生成并编译的，而不是像函数那样需要在运行时调用\
    \ `eval`。\n\n#### 6.3.1 宏定义\n"
- fmt: "# Defining a Macro\n\nDefining a macro is similar to defining a normal function.\
    \ The differences are that you use the `macro` keyword in place of the `function`\
    \ keyword and you compose the expression that the macro should return. For example,\
    \ using a quote block where the variables used as parameters are unquoted using\
    \ the dollar symbol (`$`). That makes sense, as the parameters of the macro are\
    \ expressions, and so using the dollar symbol for the variable bound to them means\
    \ injecting their content (an expression) within the broader context of the whole\
    \ expression defined in the quote block.\n\nLet’s look at an example:\n\n```julia\n\
    macro customLoop(controlExpr,workExpr)\n    return quote\n        for i in $controlExpr\n\
    \            $workExpr\n        end\n    end\nend\n```\n\nHere you use a macro\
    \ to define a generic loop, which is given by both the control you apply to the\
    \ `for` loop and the expression(s) to be evaluated inside the loop.\n\n# Macro\
    \ Invocation\n\nOnce a macro is defined, you can call it using its name, prefixed\
    \ with the at symbol (`@`). The macro is then followed by the expressions that\
    \ it will accept in the same row, separated by spaces (use the `begin` block syntax\
    \ to group expressions together).\n\nFor example:\n\n```julia\na = 5\n@customLoop\
    \ 1:4 println(i)\n@customLoop 1:a println(i)\n@customLoop 1:a if i > 3 println(i)\
    \ end\n@customLoop [\"apple\", \"orange\", \"banana\"] println(i)\n@customLoop\
    \ [\"apple\", \"orange\", \"banana\"] begin print(\"i: \"); println(i) end\n```\n\
    \nYou can see how the “expanded” macro will look using, well, another macro, called\
    \ `@macroexpand`:\n\n```julia\njulia> @macroexpand @customLoop 1:4 println(i)\n\
    quote\n    #= /path/to/source/file/metaprogramming.jl:65 =#\n    for #92#i = 1:4\n\
    \        #= /path/to/source/file/metaprogramming.jl:66 =#\n        (Main.println)(#92#i)\n\
    \    end\nend\n```\n\nNote that a macro doesn’t create a new scope, and variables\
    \ declared or assigned within the macro may collide with variables in the scope\
    \ at the point where the macro is actually called.\n\n# String Macros\n\nFinally,\
    \ a convenient type of macro (whose long but technically correct name is “non-standard\
    \ string literals”) allows developers to perform compile-time custom operations\
    \ on text entered as `xxx\"...text...\"`. This is a custom prefix that’s immediately\
    \ attached to the text to be processed and entered as a string (tripled quotas,\
    \ such as `xxx\"\"\"...multi-line text...\"\"\"` can be used as well).\n\nFor\
    \ example, the following macro defines a custom eight-column display of the entered\
    \ text:\n\n```julia\nmacro print8_str(mystr)\n    limits = collect(1:8:length(mystr))\n\
    \    for (i,j) in enumerate(limits)\n        st = j\n        en = i==length(limits)\
    \ ? length(mystr) : j+7\n        println(mystr[st:en])\n    end\nend\n```\n\n\
    These special macros, whose names end with `_str`, can then be called using a\
    \ non-standard string literal, where the prefix matches the macro name without\
    \ the `_str` part:\n\n```julia\njulia> print8\"123456789012345678\"\n```\n\nYou\
    \ will see applications of these macros in the next chapter, “Interfacing Julia\
    \ with Other Languages,” where string macros will be used to process text representing\
    \ code in a foreign language (C++, Python, or R).\n\n# Interfacing Julia with\
    \ Other Languages\n\nThis chapter includes a discussion of the following third-party\
    \ packages:\n\n| Package Name | URL | Version |\n|--------------|-----|---------|\n\
    | `Cxx.jl` | [https://github.com/JuliaInterop/Cxx.jl](https://github.com/JuliaInterop/Cxx.jl)\
    \ | v0.3.2 |\n| `PyCall.jl` | [https://github.com/JuliaPy/PyCall.jl](https://github.com/JuliaPy/PyCall.jl)\
    \ | v1.91.2 |\n| `PyJulia` | [https://github.com/JuliaPy/pyjulia](https://github.com/JuliaPy/pyjulia)\
    \ | v0.4.1 |\n| `RCall.jl` | [https://github.com/JuliaInterop/RCall.jl](https://github.com/JuliaInterop/RCall.jl)\
    \ | v0.13.3 |\n| `JuliaCall` | [https://github.com/Non-Contradiction/JuliaCall](https://github.com/Non-Contradiction/JuliaCall)\
    \ | v0.16.5 |\n\nJulia is a relatively new language (the first public release\
    \ is dated February 2012), which means there is obvious concern regarding the\
    \ availability of packages that implement its functionalities. To address this\
    \ concern, one specific area of Julia development..."
