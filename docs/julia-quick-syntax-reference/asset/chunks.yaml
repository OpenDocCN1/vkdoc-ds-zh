    **9.2 Using IndexedTables**


    IndexedTables [(https://github.com/JuliaComputing/IndexedTables.jl](https://github.com/JuliaComputing/IndexedTables.jl))
    are alternative table-like data structures. Their API is somehow less convenient
    compared to those of DataFrames, but they are particularly interesting (a) for
    performant row selections, as they internally use indexed named tuples (instead
    of arrays in a DataFrame), and (b) for being part of a large JuliaDB ecosystem
    ([https://juliadb.org/) of d](https://juliadb.org/)ata-management packages, capable
    of handling very large sets of data that aren’t held in the memory of a single
    machine.


    They come in two variants—normal indexed tables (IndexedTable)


    and sparse ones (NDSparse).


    Of the two, I discuss only the second one, as the first one is selectable by row
    position, and it’s potentially less interesting than NDSparse, where you can use
    keys instead.


    Chapter 9 Working With Data


    **9.2.1 Creating an IndexedTable (NDSparse)**


    myTable = ndsparse((


    JULIA


    region = ["US","US","US","US","EU","EU","EU","EU"], product = ["Hardwood","Hardwood","Softwood",


    "Softwood","Hardwood","Hardwood",


    "Softwood","Softwood"],


    year = [2011,2010,2011,2010,2011,2010,2011,2010]


    ),(


    production = [3.3,3.2,2.3,2.1,2.7,2.8,1.5,1.3],


    consumption = [4.3,7.4,2.5,9.8,3.2,4.3,6.5,3.0]


    ))


    Sparse indexed tables are created with the ndsparse function, which accepts either
    a named tuple (the reason for the two parentheses) or a pair of them. The reason
    is that IndexedTables explicitly divides between *key* columns and *value* ones
    (the method with a single named tuple assumes the last column as the value).


    The division between key and value columns is evident when the


    indexed table is visualized:


    julia> myTable


    JULIA


    3-d NDSparse with 8 values (2 field named tuples):


    region product year │ production consumption


    ──────────────────┼──────────────────


    "EU" "Hardwood" 2010 │ 2.8 4.3


    "EU" "Hardwood" 2011 │ 2.7 3.2


    "EU" "Softwood" 2010 │ 1.3 3.0


    "EU" "Softwood" 2011 │ 1.5 6.5


    "US" "Hardwood" 2010 │ 3.2 7.4


    "US" "Hardwood" 2011 │ 3.3 4.3


    "US" "Softwood" 2010 │ 2.1 9.8


    "US" "Softwood" 2011 │ 2.3 2.5


    Chapter 9 Working With Data


    Further, you may notice that the table has been automatically sorted, like in
    a dictionary.


    Indexed tables can also be obtained, using the same function, from an existing
    DataFrame, e.g., myTable = ndsparse(df).


    (Sparse) indexed tables are accepted as arguments in some self- explaining functions,
    such as as show, first, colnames, pkeynames, and keytype.


    indexedtables are not suited for data where the "combined" key (the key across
    all the dimensions) is duplicated. the constructor would still let you create
    the indexed table, but then many methods would generate an error.


    **9.2.2 Row Filtering**


    As stated, the main advantage of indexed tables is that they provide very fast
    row selection.


    t[keyForDim1,keyforDim2,:,keyForDim3,...]


    This selects the rows matching the given set of keys, with a colon (:), indicating
    all values for that specific dimension. If the result is a single value, a named
    tuple is returned; another sparse indexed table is returned if not.


    As claimed, the selection is very fast:


    n = 1000


    JULIA


    keys = shuffle!(reshape([[a b] for a in 1:n, b in 1:n], n^2))'
