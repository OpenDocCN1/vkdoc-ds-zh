    \ 函数的便利性是以牺牲通用性为代价的。你不能指定对不同值执行哪种聚合操作（例如，在前面的示例中，仅对生产量计算平均值，仅对消费量计算总和）。\n\n此外，所有分类列都必须包含在参数\
    \ `aggregationColumns` 中；否则，Julia 会尝试对它们应用这些操作，在大多数情况下，会引发错误（因为该操作期望数值，而分类列通常是字符串），而不是直接忽略它们。\n\
    \n解决方法是，在执行聚合之前移除不需要的字段（在此示例中，移除年份：`select!(df, Not(:year)); aggregate(df, [:region,\
    \ :product], [sum, mean])`）。\n\n## 按类别计算累积和\n\n让我们再次考虑原始的（虚构的）木材市场数据库，并试图获取每年的累积产量。\n\
    \n这项任务的难点在于，某行的值取决于同一子组中前几行的值，这意味着顺序很重要。\n\n你可以再次使用 `by` 函数采用分割-应用-合并策略：\n```\n\
    dfCum = by(df,[:region,:product]) do subdf\n    JULIA\n    return (year = subdf[:year],\
    \ cumProd = cumsum(subdf[:production]))\nend\n```\n\n与聚合情况不同，这里的每个子组需要多行，每个原始记录对应一行。在定义子组的列（`region`\
    \ 和 `product`）中，你使用同源函数重新添加了 `year` 和 `cumsum` 列。请注意，`DataFrames` 包足够“智能”，可以将\
    \ `year` 标量扩展为 `cumProd` 长度的数组。\n\n或者，你也可以使用 `@linq` 宏（来自 `DataFramesMeta`）采用分割-应用-合并策略：\n\
    \n`DataFramesMeta` 包提供了 `@linq` 宏，它支持在链式数据转换操作上采用*语言集成查询*风格，方式类似于 R 的 `dplyr`\
    \ 包（<https://cran.r-project.org/web/packages/dplyr/>）：\n\n```\ndfCum = @linq df\
