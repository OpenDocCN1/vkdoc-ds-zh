- fmt: "# Let's use a modified version of our example data with more years and just\
    \ one region:\n\n```\ndf = DataFrame(\n  product = [\"Softwood\",\"Softwood\"\
    ,\"Softwood\",\"Softwood\",\n             \"Hardwood\",\"Hardwood\",\"Hardwood\"\
    ,\"Hardwood\"],\n  year = [2010,2011,2012,2013,2010,2011,2012,2013],\n  production\
    \ = [120,150,170,160,100,130,165,158],\n  consumption = [70,90,100,95, 80,95,110,120]\n\
    )\n```\n\n```\npyplot()\nmycolours = [:green :orange]  # note it's a row vector\
    \ and the colors of the series will be alphabetically ordered whatever order we\
    \ give it here\n\n@df df plot(:year, :production, group=:product, linestyle =\
    \ :solid, linewidth=3, label=reshape((\"Production of \" .* sort(unique(:product)))\
    \ ,(1,:)), color=mycolours)\n@df df plot!(:year, :consumption, group=:product,\
    \ linestyle = :dot, linewidth=3, label =reshape((\"Consumption of \" .* sort(unique(:product)))\
    \ ,(1,:)), color=mycolours)\n```\n\n![Image 19](index-184_1.png)\n\n## Chapter\
    \ 9 Working With Data\n\n***Figure 9-4.** Plotting multiple series from a DataFrame*\n\
    \nThe key point of the previous snippet is to use `group=:product` in order to\
    \ split the original series. You then use the `color` attribute to graphically\
    \ separate the visualization of these new series. To differentiate between production\
    \ and consumption, you use the `linestyle` attribute instead.\n\nThe legend is\
    \ a bit more cumbersome to compose, as you have to consider two dimensions at\
    \ the same time. In this example, you hardcode the first dimension (the market\
    \ variable you are considering, either production or consumption), while you concatenate\
    \ the legend item with the sorted results from `unique(:product)` for the other\
    \ dimension. Finally, you reshape it as a row vector, as this is the format expected\
    \ by the `label` attribute.\n\n## Chapter 9 Working With Data\n\n### 9.4.4 Saving\n\
    \nTo save the currently displayed figure, you call `savefig(fileName)`, where\
    \ the extension given to `fileName` determines the format in which to save the\
    \ figure. Some supported formats are `.png` (standard raster image), `.pdf`, and\
    \ `.svg` (both vector formats):\n\n```\nsavefig(\"timber_markets.svg\")\n```\n\
    \n```\nsavefig(\"timber_market.pdf\")\nsavefig(\"timber_market.png\")\n```\n\n\
    ## CHAPTER 10 Mathematical Libraries\n\nThis chapter includes a discussion of\
    \ the following third-party packages:\n\n| Package Name | URL | Version |\n|---|---|---|\n\
    | JuMP.jl | <https://github.com/JuliaOpt/JuMP.jl> | v0.19.2 |\n| GLPK.jl | <https://github.com/JuliaOpt/GLPK.jl>\
    \ | v0.10.0 |\n| Ipopt.jl | <https://github.com/JuliaOpt/Ipopt.jl> | v0.5.4 |\n\
    | SymPy.jl | <https://github.com/JuliaPy/SymPy.jl> | v1.0.5 |\n| LsqFit.jl | <https://github.com/JuliaNLSolvers/LsqFit.jl>\
    \ | v0.8.1 |\n\nWhile Julia is a complete, general-purpose programming language,\
    \ it is undeniable that the focus of its community is currently concentrated on\
    \ mathematical and computational questions. You already saw the large array of\
    \ libraries for processing numerical data and how implications on computational\
    \ performances have shaped decisions from the very beginning of Julia's development.\n\
    \nThis chapter lists some of the most mature libraries for mathematical analyses.\
    \ Some of them, like JuMP for numerical optimization, are often themselves the\
    \ primary reason to start using Julia.\n\n© Antonello Lobianco 2019\nA. Lobianco,\
    \ *Julia Quick Syntax Reference*, <https://doi.org/10.1007/978-1-4842-5190-4_10>\n\
    \nThe list is partial and focused on relatively general tasks. A good starting\
    \ point to look for specific packages is <https://pkg.julialang.org/docs/> or\
    \ <https://juliaobserver.com/categories/Mathematics>.\n\n### 10.1 JuMP, an Optimization\
    \ Framework\n\nJuMP (<https://github.com/JuliaOpt/JuMP.jl>) is an \"Algebraic\
    \ Modeling Language\" (AML) for mathematical optimization problems, similar to\
    \ GAMS (<https://www.gams.com/>), AMPL (<https://ampl.com/>) or Pyomo (<http://www.pyomo.org/>).\n\
    \nOptimization problems are problems that find the \"optimal\" quantities of decision\
    \ variables in the context of an objective function and the constraints between\
    \ the variables. Constraints arise everywhere in the real world, be it with business\
    \ decisions (e.g., \"How much should we produce of X?\"), engineering settings\
    \ (e.g., \"At which angle should we design a flap for maximum efficiency?\"),\
    \ or personal choices (e.g., \"A small flat in the city or a large house far in\
    \ the countryside?\").\n\nThese kinds of problems can be mathematically formulated\
    \ in terms of a function to maximize (or minimize) subject to other functions\
    \ acting as constraints.\n\nSoftware \"tools\" have been created to solve these\
    \ problems. They typically require you to formulate the optimization problem in\
    \ a matrix format and, for non-linear problems, to provide some additional information\
    \ about the problem in terms of first and second derivatives to help find the\
    \ numerical optimal solution. Solver-based approaches in the MATLAB optimization\
    \ toolbox or R's `optim` function are two well known examples.\n\nAMLs take a\
    \ different approach in the sense that they decouple the formulation of the problem\
    \ to the specific algorithm used to solve it. The problem can now be coded algebraically,\
    \ using the same mathematical notation that is used to describe it.\n\nCritically,\
    \ variables can be indexed across any dimension using the concept of \"sets,\"\
    \ thus allowing you to code equations like `Demand[year,time,region,product] =\
    \ Supply[year,time,region,product]`. Tools that automatically provide the derivatives\
    \ are included.\n\nOnce they are formulated, the problems can be solved by any\
    \ \"solver engine\" supported by the AML software and suited for that specific\
    \ problem class.\n\nCommercial AMLs do have a drawback, however—they each use\
    \ their own specific language. Being language-specific, they lag behind \"real,\"\
    \ general purpose, programming languages in many characteristics (data handling,\
    \ availability of developer tools, language constructs, etc.). Interfacing them\
    \ with other parts, not linked to optimization, in a larger model could be difficult.\n\
    \nJuMP is instead part of the \"third generation\" of optimization tools (the\
    \ first one being the solver engines themselves and the second one being the commercial,\
    \ language-specific AMLs) that are AML embedded as a software library in a general\
    \ purpose programming language.\n\nJuMP offers the same simplicity of modeling\
    \ and solver-independency of language-specific AMLs while offering the benefits\
    \ of a much more practical modeling environment. If it's combined with free solver\
    \ engines (e.g., GLPK for Mixed Integer Problems and IPOPT for Non Linear problems),\
    \ it is a complete open-source solution.\n\nIn this section, you learn how to\
    \ use JuMP by implementing two problems, one with only linear functions and one\
    \ where the objective is non-linear. The general settings of the problems will\
    \ be the same: you choose the solver more suited to the specific problem, you\
    \ load the Julia package for the solver-specific interface, you create the problem\
    \ \"object,\" and you add to it its characteristic elements, like variables, objective\
    \ functions, and constraints. At this point, you can \"solve\" the problem and\
    \ retrieve its solutions.\n\nThe examples serve also to highlight the power of\
    \ Julia macros. Using them, JuMP implements its own language, while still remaining\
    \ Julia.\n\n#### 10.1.1 The Transport Problem: A Linear Problem\n\n##### The Problem\n\
    \nThis is the transposition in JuMP of the basic transport model used in the GAMS\
    \ tutorial.\n\nGiven a single product, *p* plants and *m* markets, the problem\
    \ consists of defining the best routes between *p* and *m* to minimize transport\
    \ costs while observing the capacity limits ( *ap*) of each plant and satisfying\
    \ each market's demand *bm*:\n\n*min* Σ *c* * x* (for all p, m)\n\nSubject to:\n\
    Σ *x* ≤ *a* (for all p, m, p)\nΣ *x* ≥ *b* (for all p, m, m)\n\nwhere *cp,m* are\
    \ the unitary transport costs between p and m and *xp,m* are the transported quantities\
    \ (to be chosen). The original formulation is from \"Dantzig G. B. (1963), *Linear\
    \ Programming and Extensions, Chapter 3.3*, Princeton University Press\" while\
    \ its GAMS implementation can be found in \"Rosenthal, R. E. (1988) *GAMS: A User's\
    \ Guide, Chapter 2: A GAMS Tutorial*, The Scientific Press,\" or at <https://www.gams.com/mccarl/trnsport.gms>.\n\
    \nTo facilitate comparison, I leave the equivalent GAMS code of each operation\
    \ in the comments.\n\n##### Importing the Libraries\n\nYou first need to import\
    \ the JuMP package. You then need the package implementing the specific interface\
    \ with the desired solver engine. In this case, we will deal with a linear problem,\
    \ so you will use the *GNU Linear Programming Kit* (GLPK) library and install\
