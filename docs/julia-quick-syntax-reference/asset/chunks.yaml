    **CHAPTER 4**


    **Custom Types**


    Chapt[er 2, “](#index_split_000.html#p31)Data Types and Structures,” discussed
    built-in types, including containers. In this chapter, we move to study how to
    create user-defined types.


    *Type versus Structure*


    Let’s clarify these two terms in the Julia language context.


    A *type* of an object, in plain English, refers to the set of characteristics
    that describe the object. For example, an object of type *sheet* can be described
    with its dimensions, its weight, its size, or its colour.


    All values in Julia are true objects belonging to a given type (they are individual
    “instances” of the given type).


    Julia types include so-called *primitive types* made of a fixed amount of bits
    (like all numerical types such as Int64, Float64, and Char) and *composite types*
    or *structures*, where the object’s characteristics are described using multiple
    fields and a variable number of bits.


    Both *structures* and *primitive types* can be user-defined and are hierarchically
    organized. *Structures* roughly correspond to what are known as *classes* in other
    languages.


    © Antonello Lobianco 2019


    A. Lobianco, *Julia Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_4](#index_split_000.html#p70)


    ChAptEr 4 Custom typEs


    Two operators are particularly important when working with types:


    • The :: operator is used to constrain an object of being


    of a given type. For example, a::B means “a must be of


    type B”.


    • The <: operator has a similar meaning, but it’s a bit


    more relaxed in the sense that the object can be of any


    subtypes of the given type. For example, A<:B means


    “A must be a subtype of B”, that is, B is the “parent” type


    and A is its “child” type.


    The primary reason to use these operators is to confirm that the


    program works the way it is expected. In some cases, providing this extra information
    can also improve performance.


    **4.1 Primitive Type Definition**


    A user-defined primitive type is defined with the keyword primitive type and its
    name and the number of bits it requires:


    primitive type [name] [bits] end


    For example:


    primitive type My10KBBuffer 81920 end


    A (current) limitation of Julia is that the number of bits must be a multiple
    of eight below 8388608.


    Optionally, a parent type can be specified as follows:


    primitive type [name] <: [supertype] [bits] end


    ChAptEr 4 Custom typEs


    Note that the internal representation of two user-defined types with the same
    number of bits is exactly the same. The only thing that would change is their
    names, but that’s an important difference: it’s the way that functions act when
    objects of these types are passed as arguments that changes, i.e. it’s the use
    of named types across the program that distinguishes them, rather than their implementation.


    **4.2 Structure Definition**


    To define instead a structure, you use the keyword mutable struct, give the structure
    a name, specify the fields, and close the definition with the end keyword:


    mutable struct MyOwnType


    JULIA


    field1


    field2::String


    field3::Int64


    end


    Note that while you can optionally define each individual field to be of a given
    type (e.g., field3::Int64), you can’t define fields to be subtypes of a given
    type (e.g., field3<:Number). In order to do that, you can use templates in the
    structure definition:


    mutable struct MyOwnType{T<:Number}


    JULIA


    field1


    field2::String


    field3::T


    end


    Using templates, the definition of the structure is dynamically created the first
    time an object whose field3 is of type T is constructed.


    ChAptEr 4 Custom typEs


    The type with whom you annotate the individual fields can be either a primitive
    one (like in the previous example) or a reference to another structure (see later
    for an example).


    Note also that with Julia, unlike the other high-level languages (e.g., Python),
    you can’t add or remove fields from a structure after you define it. If you need
    this functionality, you must use dictionaries instead, but be aware that you will
    trade this flexibility for worse performance.


    Conversely, to gain performance (but again sacrificing flexibility), you can omit
    the mutable keyword in front of struct. That way, once an object of that type
    has been created, its fields can no longer be changed (i.e., structures are immutable
    by default).


    Note that mutable objects—as arrays—also remain mutable in an


    immutable structure.


    **4.3 Object Initialization and Usage**


    After you define your custom type (primitive or structure), you can initialize
    as many objects as you wish from that type:


