- fmt: "# A Recursive Function\n\n```julia\nfunction fib(n)\n    if n == 0 return\
    \ 0\n    elseif n == 1 return 1\n    else\n        return fib(n-1) + fib(n-2)\n\
    \    end\nend\n```\n\nWithin the Julia community, it is considered good programming\
    \ practice for the call to a function to follow these rules:\n\n- To contain all\
    \ the elements that the function needs for its logic (i.e., no read access to\
    \ other variables, except constant globals).\n- That the function doesn't change\
    \ any other part of the program that is not within the parameters (i.e., it doesn't\
    \ produce any \"side effects\" other than eventually modifying its arguments).\n\
    \nFollowing these rules will help you achieve code that is fast, reliable (the\
    \ output of each function depends uniquely on the set of its inputs), and easy\
    \ to read and debug.\n\n## 3.4.1 Arguments\n\nFunction arguments are normally\
    \ specified by position (*positional arguments*). However, if a semicolon (`;`)\
    \ is used in the parameter list of the function definition, the arguments listed\
    \ after that semicolon must be specified by name (*keyword arguments*).\n\nThe\
    \ function call must respect this distinction, calling positional arguments by\
    \ position and keyword arguments by name. In other words, it's not possible to\
    \ call positional arguments by name or keyword arguments by position.\n\nThe last\
    \ arguments (whether positional or keyword) can be specified together with a default\
    \ value. For example:\n\n- Definition: `myfunction(a,b=1;c=2) = (a+b+c)` (definition\
    \ with two positional arguments and one keyword argument)\n- Function call: `myfunction(1,c=3)`\
    \ (calling `(1+1+3)`) Note that `b` is not provided in the call, and hence the\
    \ default value is used.\n\nYou can optionally restrict the types of argument\
    \ the function should accept by annotating the parameter with the type:\n\n```julia\n\
    myfunction(a::Int64,b::Int64=1;c::Int64=2) = (a+b+c)\n```\n\nThe reason to specify\
    \ parameter types is not so much to obtain speed gains. Julia will try to resolve\
    \ the possible parameter types and return values, and only in rare cases will\
    \ it be unable to uniquely determine the return type as a function of the input\
    \ types. In these cases (type-unstable), specifying the parameter types may help\
    \ solve type instability.\n\nThe most important reason to limit the parameter\
    \ type is to catch bugs early on, when the function is accidentally called with\
    \ a parameter type it was not designed to work with. In such cases, if the function\
    \ was annotated with the allowed parameter type, Julia will return to the user\
    \ a useful error message instead of silently trying to use that parameter.\n\n\
    However, a common case is when you want the function to process single values\
    \ (scalars) or vectors of a given parameter. You have two options then:\n\n- You\
    \ can write the function to treat the scalar and rely then on the dotted notation\
    \ to broadcast the function at call time (discussed more later).\n- Alternatively,\
    \ you may want to directly deal with this in the function definition. In such\
    \ cases, you can declare the parameter as being either a scalar type `T` or a\
    \ vector `T` using a union. For example: `function f(par::Union{Float64, Vector{Float64}})\
    \ [...] end`. You can then implement the logic you want by checking the parameter\
    \ type using `typeof`.\n\nFinally, functions in Julia may also accept a variable\
    \ number of arguments. The splat operator (i.e., the ellipsis `...`) can specify\
    \ a variable number of arguments in the parameter declaration within the function\
    \ definition and can \"splice\" a list or an array in the parameters within the\
    \ function call:\n\n```julia\nvalues = [1,2,3]\n\nfunction additionalAverage(init,\
    \ args...)\n    #The parameter that uses the ellipsis must be the last one\n \
    \   s = 0\n    for arg in args\n        s += arg\n    end\n    return init + s/length(args)\n\
    end\n\na = additionalAverage(10,1,2,3) # 12.0\na = additionalAverage(10, values\
    \ ...) # 12.0\n```\n\n## 3.4.2 Return Value\n\nProviding a return value using\
    \ the `return` keyword is optional. By default, functions return the last computed\
    \ value.\n\nOften, `return` is used to immediately terminate a function, for example,\
    \ upon the occurrence of certain conditions. Note that the return value can also\
    \ be a tuple (returning multiple values at once):\n\n```julia\nmyfunction(a,b)\
    \ = a*2,b+2\n\nx,y = myfunction(1,2)\n```\n\n## 3.4.3 Multiple-Dispatch (aka Polymorphism)\n\
    \nWhen similar logic should be applied to different kinds of objects (i.e., different\
    \ types), you can write functions that share the same name but have different\
    \ types or different numbers of parameters (and different implementation). This\
    \ highly simplifies the Application Programming Interface (API) of your application,\
    \ as only one name has to be remembered.\n\nWhen calling such functions, Julia\
    \ will pick up the correct one depending on the parameters in the call, selecting\
    \ by default the stricter version.\n\nThese different versions are called *methods*\
    \ in Julia and, if the function is type-safe, dispatch is implemented at compile\
    \ time and is very fast.\n\nYou can list all the methods of a given function by\
    \ using `methods(myfunction)`.\n\nThe multiple-dispatch polymorphism is a generalization\
    \ of object-oriented runtime polymorphism, where the same function name performs\
    \ different tasks, depending on which is the object's class. The polymorphism\
    \ in traditional object-oriented languages is applied only to a single element,\
    \ whereas in Julia it applies to all the function arguments (it remains true however\
    \ that object-oriented languages have multiple-parameters polymorphism at compile-time).\n\
    \nI'll go more in depth into multiple-dispatch when dealing with type inheritance\
    \ in Chapter [4.](#index_split_000.html#p70)\n\n## 3.4.4 Templates (Type Parameterization)\n\
    \nFunctions can be specified regarding which types they work with. You do this\
    \ using *templates*:\n\n```julia\nmyfunction(x::T, y::T2, z::T2) where {T <: Number,\
    \ T2} = x + y + z\n```\n\nThis function first defines two types, `T` (a subset\
    \ of `Number`) and `T2`, and then specifies which of these two types each parameter\
    \ must be.\n\nYou can call it with `(1,2,3)` or `(1,2.5,3.5)` as a parameter,\
    \ but not with `(1,2,3.5)` as the definition of `myfunction` requires that the\
    \ second and third parameter must be the same type (whatever that is).\n\n## 3.4.5\
    \ Functions as Objects\n\nFunctions themselves are objects and can be assigned\
    \ to new variables, returned, or nested. Take this example:\n\n```julia\nf(x)\
    \ = 2x # define a function f inline\n\na = f(2) # call f and assign the return\
    \ value to a. àìs a value\n\na = f # bind f to a new variable name. àìs now a\
    \ function\n\na(5) # call again the (same) function\n```\n\n## 3.4.6 Call by Reference/Call\
    \ by Value\n\nJulia functions are called using a convention—sometimes known as\
    \ *call-by-sharing* in other languages—that is somehow in between the traditional\
    \ *call by reference* (where just a memory pointer to the original variable is\
    \ passed to the function) and *call by value* (where a copy of the variable is\
    \ passed, and the function works on this copy).\n\nIn Julia, functions work on\
    \ new local variables, known only inside the function itself. Assigning the variable\
    \ to another object will not influence the original variable. But if the object\
    \ bound with the variable is mutable (e.g., an array), the *mutation* of this\
    \ object will apply to the original variable as well:\n\n```julia\nfunction f(x,y)\n\
    \    x = 10\n    y[1] = 10\nend\n\nx = 1\ny = [1,1]\nf(x,y) # x will not change,\
    \ but y will now be [10,1]\n```\n\n(See also the \"Memory and Copy Issues\" section\
    \ at the end of Chapter [2](#index_split_000.html#p31).) Functions that change\
    \ their arguments have their name, by convention, followed by an `!`. For example,\
    \ `myfunction!(ref_par, other_pars)`. The first parameter is, still by convention,\
    \ the one that will be modified.\n\n## 3.4.7 Anonymous Functions (aka \"Lambda\"\
    \ Functions)\n\nSometimes you don't need to name a function (e.g., when the function\
    \ is one of the arguments being passed to higher-order functions, like the `map`\
    \ function). To define anonymous (nameless) functions, you can use the `->` syntax,\
    \ as follows:\n\n```julia\nx -> x^2 + 2x - 1\n```\n\nThis defines a nameless function\
    \ that takes an argument, `x`, and produces `x^2 + 2x - 1`. Multiple arguments\
    \ can be provided using tuples, as follows:\n\n```julia\n(x,y,z) -> x + y + z\n\
    ```\n\nYou can still assign an anonymous function to a variable this way:\n\n\
    ```julia\nf = (x,y) -> x+y\n```\n\nDo not confuse the single arrow `->`, which\
    \ is used to define anonymous functions, with the double arrow `=>`, which is\
    \ used to define a pair (e.g., in a dictionary).\n\n## 3.4.8 Broadcasting Functions\n\
    \nYou'll often have a function designed to work with scalars, but you want to\
    \ apply it repetitively to values within a container, like the elements of an\
    \ array. Instead of writing `for` loops, you can rely on a native functionality\
    \ of Julia, which is to *broadcast* the function over the elements you wish.\n\
    \nTake, for example, the following function:\n\n```julia\nf1(a::Int64,b::Int64)\
    \ = a*b\n```\n\nIt expects as input two scalars. For example:\n\n```julia\nf1(2,3)\n\
    ```\n\nBut what if `a` and `b` are vectors (say `a=[2,3]` and `b=[3,4]`)? You\
    \ can't directly call the function `f1([2,3],[3,4])`. The solution is to use the\
    \ function `broadcast()`, which takes the original function as its first argument\
    \ followed by the original function's arguments:\n\n```julia\nbroadcast(f1,[2,3],[3,4])\n\
    ```\n\nThe output is a vector that holds the result of the original function applied\
    \ first to `(a=2,b=3)` and then to `(a=3,b=4)`.\n\nA handy shortcut to broadcast\
    \ is to use the dot notation, i.e., the original function name followed by a dot:\
    \ `f1.([2,3],[3,4])`.\n\nSometimes the original function natively takes some parameters\
    \ as a vector, and you want to limit the broadcast to the scalar parameters. In\
    \ such cases, you can use the `Ref()` function to protect the parameters that\
    \ you don't want to be broadcast:\n\n```julia\nf2(a::Int64,b::Int64,c::Array{Int64,1},d::Array{Int64,1})\
    \ = a*b+sum(c)-sum(d)\n\nf2(1,2,[1,2,3],[0,0,1]) # normal call without broadcast\n\
    f2.([1,1,1],[2,2,2],Ref([1,2,3]),Ref([0,0,1])) # broadcast over the first two\
    \ arguments only\n```\n\n## 3.5 Do Blocks\n\nWe finish the chapter by analyzing\
    \ do blocks. Do blocks allow developers to define \"anonymous\" functions that\
    \ are passed as arguments to outer functions.\n\nFor example, you write `f1(f2,x,y)\
    \ = f2(x+1,x+2)+y`. To use this `f1` function, you first need another function\
    \ to act as `f2` (the inner function).\n\nYou could define it as `f2(g,z) = g*z`\
    \ and then call `f1` as `f1(f2,2,8)`.\n\nEvery time the first argument is a function,\
    \ this can be written *a posteriori* with a do block. You can hence obtain the\
    \ same result using the do block:\n\n```julia\nf1(2,8) do i,j\n    i*j\nend\n\
    ```\n\nThis defines `i` and `j` as local variables that are made available to\
    \ the do block. Their values are determined in the `f1` function (in this case,\
    \ `i=2+1` and `j=2+2`). The result of the block computation is then made available\
    \ as the output of the function acting as the first parameter of `f1`. Again,\
    \ what you do with this value is specified by the definition of the `f1` function\
    \ (in this case, the value `8` is added to it to make `20`, the returned value).\n\
    \nAnother typical use of do blocks is within input/output operations, as described\
    \ in Chapter [5](#index_split_000.html#p80).\n\n## 3.6 Exiting Julia\n\nTo exit\
    \ a running Julia session, press `Ctrl+D` (or use `Ctrl+C` to throw an `InterruptException`\
    \ when possible, regaining control of the Julia prompt without closing the process).\n\
    \nTo exit the script programmatically use `exit(exit_code)` where the default\
    \ exit code of zeros indicates, by convention, a normal program termination.\n\
    \nFinally, sometimes you'll want to be able to define something your code should\
    \ run whenever the Julia process exits. This is exactly the role of the `atexit(f)`\
    \ function. It allows you to define a zero-argument function `f()` to be called\
    \ upon exit.\n\nYou can use it, for example, to start a new \"clean Julia session\"\
    \ when a given function is invoked. As an example, type the following function\
    \ in your global or local `startup.jl` file:\n\n```julia\nfunction workspace()\n\
    \    atexit() do\n        run(`$(Base.julia_cmd())`)\n    end\n    exit()\nend\n\
    ```\n\nNow, whenever the `workspace()` function is invoked, the current Julia\
    \ process will be closed and a new one will be started (Note that `workspace`\
    \ was the name of a function in previous Julia versions that cleaned up the Workspace;\
    \ it's no longer available. This script replicates its functionality, albeit at\
    \ the cost of forcing a restart of the whole Julia process.).\n\n# Chapter 4:\
    \ Custom Types\n\nChapter [2, \"](#index_split_000.html#p31)Data Types and Structures,\"\
    \ discussed built-in types, including containers. In this chapter, we move to\
    \ study how to create user-defined types.\n\n*Type versus Structure*\n\nLet's\
    \ clarify these two terms in the Julia language context.\n\nA *type* of an object,\
    \ in plain English, refers to the set of characteristics that describe the object.\
    \ For example, an object of type *sheet* can be described with its dimensions,\
    \ its weight, its size, or its colour.\n\nAll values in Julia are true objects\
    \ belonging to a given type (they are individual \"instances\" of the given type).\n\
    \nJulia types include so-called *primitive types* made of a fixed amount of bits\
    \ (like all numerical types such as `Int64`, `Float64`, and `Char`) and *composite\
    \ types* or *structures*, where the object's characteristics are described using\
    \ multiple fields and a variable number of bits.\n\nBoth *structures* and *primitive\
    \ types* can be user-defined and are hierarchically organized. *Structures* roughly\
    \ correspond to what are known as *classes* in other languages.\n\nTwo operators\
    \ are particularly important when working with types:\n\n- The `::` operator is\
    \ used to constrain an object of being of a given type. For example, `a::B` means\
    \ \"a must be of type B\".\n- The `<:` operator has a similar meaning, but it's\
    \ a bit more relaxed in the sense that the object can be of any subtypes of the\
    \ given type. For example, `A<:B` means \"A must be a subtype of B\", that is,\
    \ B is the \"parent\" type and A is its \"child\" type.\n\nThe primary reason\
    \ to use these operators is to confirm that the program works the way it is expected.\
    \ In some cases, providing this extra information can also improve performance.\n\
    \n## 4.1 Primitive Type Definition\n\nA user-defined primitive type is defined\
    \ with the keyword `primitive type` and its name and the number of bits it requires:\n\
    \n```\nprimitive type [name] [bits] end\n```\n\nFor example:\n\n```julia\nprimitive\
    \ type My10KBBuffer 81920 end\n```\n\nA (current) limitation of Julia is that\
    \ the number of bits must be a multiple of eight below 8388608.\n\nOptionally,\
    \ a parent type can be specified as follows:\n\n```\nprimitive type [name] <:\
    \ [supertype] [bits] end\n```\n\nNote that the internal representation of two\
    \ user-defined types with the same number of bits is exactly the same. The only\
    \ thing that would change is their names, but that's an important difference:\
    \ it's the way that functions act when objects of these types are passed as arguments\
    \ that changes, i.e. it's the use of named types across the program that distinguishes\
    \ them, rather than their implementation.\n\n## 4.2 Structure Definition\n\nTo\
    \ define instead a structure, you use the keyword `mutable struct`, give the structure\
    \ a name, specify the fields, and close the definition with the `end` keyword:\n\
    \n```julia\nmutable struct MyOwnType\n    field1\n    field2::String\n    field3::Int64\n\
    end\n```\n\nNote that while you can optionally define each individual field to\
    \ be of a given type (e.g., `field3::Int64`), you can't define fields to be subtypes\
    \ of a given type (e.g., `field3<:Number`). In order to do that, you can use templates\
    \ in the structure definition:\n\n```julia\nmutable struct MyOwnType{T<:Number}\n\
    \    field1\n    field2::String\n    field3::T\nend\n```\n\nUsing templates, the\
    \ definition of the structure is dynamically created the first time an object\
    \ whose `field3` is of type `T` is constructed.\n\nThe type with whom you annotate\
    \ the individual fields can be either a primitive one (like in the previous example)\
    \ or a reference to another structure (see later for an example).\n\nNote also\
    \ that with Julia, unlike the other high-level languages (e.g., Python), you can't\
    \ add or remove fields from a structure after you define it. If you need this\
    \ functionality, you must use dictionaries instead, but be aware that you will\
    \ trade this flexibility for worse performance.\n\nConversely, to gain performance\
    \ (but again sacrificing flexibility), you can omit the `mutable` keyword in front\
    \ of `struct`. That way, once an object of that type has been created, its fields\
    \ can no longer be changed (i.e., structures are immutable by default).\n\nNote\
    \ that mutable objects—as arrays—also remain mutable in an immutable structure.\n\
    \n## 4.3 Object Initialization and Usage\n\nAfter you define your custom type\
    \ (primitive or structure), you can initialize as many objects as you wish from\
    \ that type:\n\n```julia\nmyObject = MyOwnType(\"something\",\"something\",10)\n\
    a = myObject.field3 # 10\nmyObject.field3 = 20 # only if myObject is a mutable\
    \ struct\n```\n\nNote that you have to initialize the object with the values in\
    \ the same order as was specified in the structure definition. You can't initialize\
    \ objects by name (rather, consider named tuples for that):\n\n```julia\nMyOwnType(field3\
    \ = 10, field1 = \"something\", field2 = \"something\") # Error!\n```\n\nTo access\
    \ object fields or change their value, you use, like in most other languages,\
    \ the `object.field` syntax.\n\n*Functions and Structures*\n\nNote that functions\
    \ that deal with objects are not defined or declared within the type definition,\
    \ i.e. they are not associated with one specific type.\n\nThis implies that instead\
    \ of calling an object method, such as `myobj.func(x,y)`, in Julia you would pass\
    \ the object as a parameter, such as `func(myobj,x,y)`, no matter whether it's\
    \ as a first, second, or further argument.\n\n## 4.4 Abstract Types and Inheritance\n\
    \nYou can create abstract types using the keyword `abstract type`. Abstract types\
    \ are not allowed to hold any field, and objects cannot be instantiated from them.\
    \ Rather, concrete types with fields can be defined as subtypes of them and objects\
    \ instantiate from them. An issue (se[e https://github.](https://github.com/JuliaLang/julia/issues/4935)[com/JuliaLang/julia/issues/4935)\
    \ t](https://github.com/JuliaLang/julia/issues/4935)o allow abstract classes to\
    \ actually hold fields is currently open and may be implemented in the next major\
    \ release of Julia.\n\nYou can create a whole hierarchy of abstract types, although\
    \ multiple-inheritance (when a type is a subtype of multiple types) is not currently\
    \ supported:\n\n```julia\nabstract type MyOwnGenericAbstractType end\nabstract\
    \ type MyOwnAbstractType1 <: MyOwnGenericAbstractType end\nabstract type MyOwnAbstractType2\
    \ <: MyOwnGenericAbstractType end\nmutable struct AConcreteType1 <: MyOwnAbstractType1\n\
    \    f1::Int64\n    f2::Int64\nend\nmutable struct AConcreteType2 <: MyOwnAbstractType1\n\
    \    f1::Float64\nend\nmutable struct AConcreteType3 <: MyOwnAbstractType2\n \
    \   f1::String\nend\n```\n\nYou can't define subtypes of concrete types, only\
    \ of abstract ones.\n\nWhy would you need inheritance if abstract types cannot\
    \ have fields? It's not to save the time of defining common fields across multiple\
    \ types at once (you can use *composition* for that, discussed later). Rather,\
    \ it is again in the *usage* of types across the program that the definition of\
    \ their hierarchical structure becomes useful.\n\nConsider the following objects:\n\
    \n```julia\no1 = AConcreteType1(2,10)\no2 = AConcreteType2(1.5)\no3 = AConcreteType3(\"\
    aa\")\n```\n\nBy the fact they are all subtypes of `MyOwnGenericAbstractType`,\
    \ you can define a function that provides a default implementation for them:\n\
    \n```julia\nfunction foo(a :: MyOwnGenericAbstractType)\n    println(\"Default\
    \ implementation: $(a.f1)\")\nend\n\nfoo(o1) # Default implementation: 2\nfoo(o2)\
    \ # Default implementation: 1.5\nfoo(o3) # Default implementation: aa\n```\n\n\
    You can then decide to provide a function to offer a more specialized implementation\
    \ for all objects whose type is a subtype of `MyOwnAbstractType1`:\n\n```julia\n\
    function foo(a :: MyOwnAbstractType1)\n    println(\"A more specialised implementation:\
    \ $(a.f1*4)\")\nend\n\nfoo(o1) # A more specialised implementation: 8\nfoo(o2)\
    \ # A more specialised implementation: 6.0\nfoo(o3) # Default implementation:\
    \ aa\n```\n\nThis is possible, thanks to the *multiple dispatch* mechanism discussed\
    \ in Chapter [3](#index_split_000.html#p55). When multiple *methods* of a function\
    \ are available to dispatch a function call, Julia will choose the stricter one,\
    \ i.e., the one defined over the exact parameter's types or their more immediate\
    \ *supertypes* (parent types):\n\n```julia\nfunction foo(a :: AConcreteType1)\n\
    \    println(\"A even more specialised implementation: $(a.f1 + a.f2)\")\nend\n\
    \nfoo(o1) # An even more specialized implementation: 12\nfoo(o2) # A more specialized\
    \ implementation: 6.0\nfoo(o3) # Default implementation: aa\n```\n\n### 4.4.1\
    \ Implementation of the Object-Oriented Paradigm in Julia\n\nJulia allows both\
    \ inheritance and composition models, although with different levels of support.\n\
    \n*Inheritance* is what you just saw, when a hierarchical structure of types is\
    \ obtained declaring one type as a subtype of another. You also saw the limits\
    \ of using inheritance in Julia, when only the behavior (and not the structure)\
    \ can be inherited.\n\nSo, how do you implement an object-oriented model in Julia?\
    \ Well, the preference in the Julia community is to use composition over inheritance.\n\
    \n*Composition* is when you declare one field of a given type as being an object\
    \ of another composite type. Through this (referenced) object, you then gain access\
    \ to the fields of the other type.\n\nConsider the following example, where you\
    \ first define a generic `Person` structure and then two more specific `Student`\
    \ and `Employee` structures:\n\n```julia\nstruct Shoes\n    shoesType::String\n\
    \    colour::String\nend\n\nstruct Person\n    myname::String\n    age::Int64\n\
    end\n\nstruct Student\n    p::Person\n    school::String\n    shoes::Shoes\nend\n\
    \nstruct Employee\n    p::Person\n    monthlyIncomes::Float64\n    company::String\n\
    \    shoes::Shoes\nend\n```\n\nInstead of using inheritance declaring `Student`\
    \ and `Employee` as subtypes of `Person`, you use composition to assign a field\
    \ `p` of type `Person` to both of them. It is thanks to this field that you do\
    \ not need to repeat the fields that are common to both.\n\nTypes must be defined\
    \ before they can be used to reference objects. Hence, the `Shoes` definition\
    \ must come before the `Students` and `Employee` definitions.\n\nYou can then\
    \ create instances of the specialized type, either by creating the referenced\
    \ object first, or doing that inline in the constructor of the specialized type:\n\
    \n```julia\ngymShoes = Shoes(\"gym\",\"white\")\nproShoes = Shoes(\"classical\"\
    ,\"brown\")\n\nMarc = Student(Person(\"Marc\",15),\"Divine School\",gymShoes)\n\
    MrBrown = Employee(Person(\"Brown\",45),3200.0,\"ABC Corporation Inc.\", proShoes)\n\
    ```\n\nFinally, you can use multiple dispatch to provide tailored implementation\
    \ for the specialized types and access referenced objects and/or general fields\
    \ through a chained use of the dot (`.`) operator:\n\n```julia\nfunction printMyActivity(self::Student)\n\
    \    println(\"Hi! I am $(self.p.myname), I study at $(self.school) school, and\
    \ I wear $(self.shoes.colour) shoes\")\nend\n\nfunction printMyActivity(self::Employee)\n\
    \    println(\"Good day. My name is $(self.p.myname), I work at $(self.company)\
    \ company and I wear $(self.shoes.colour) shoes\")\nend\n\nprintMyActivity(Marc)\
    \ # Hi! I am Marc, ...\nprintMyActivity(MrBrown) # Good day. My name is MrBrown,\
    \ ...\n```\n\nWhile using inheritance wisely can in practice suffice for many\
    \ modeling design situations you may encounter, it is still true that the Julia\
    \ core language misses some expressiveness in the sense that you cannot directly\
    \ consider and/or distinguish between different concepts of relations between\
    \ objects, like specialization (e.g., `Person→Student`), composition (e.g., `Person→Arm`),\
    \ and weak relation (e.g., `Person→Shoes`).\n\nTo address this lack, several third-party\
    \ packages (not discussed in this book) have been released that improve Julia\
    \ flexibility in this area, like the `SimpleTr[aits](https://github.com/mauro3/SimpleTraits.jl)`\
    \ package to imitate multiple inheritance or `OOPMacro.jl` to automatically copy\
    \ field declaration from a parent to a child type.\n\n## 4.5 Some Useful Functions\
    \ Related to Types\n\nTo complete the discussion concerning user-defined types,\
    \ you may find the following type-related functions useful:\n\n- `supertype(MyType)`:\
    \ Returns the parent types of a type\n- `subtypes(MyType)`: Lists all children\
    \ of a type\n- `fieldnames(MyType)`: Queries all the fields of a structure\n-\
    \ `isa(obj,MyType)`: Checks if `obj` is of type `MyType`\n- `typeof(obj)`: Returns\
    \ the type of `obj`\n- `eltype(obj)`: Returns the inner type of a collection,\
    \ like the inner elements of an array\n\n# Chapter 5: Input/Output\n\nThis chapter\
    \ includes discussion of the following third-party packages:\n\n**Package Name**\
    \ | **URL** | **Version**\n--- | --- | ---\n`CSV.jl` | [https://github.com/JuliaData/CSV.jl](https://github.com/JuliaData/CSV.jl)\
    \ | v0.5.11\n`HTTP.jl` | [https://github.com/JuliaWeb/HTTP.jl](https://github.com/JuliaWeb/HTTP.jl)\
    \ | v0.8.4\n`XLSX.jl` | [https://github.com/felipenoris/XLSX.jl](https://github.com/felipenoris/XLSX.jl)\
    \ | v0.5.4\n`JSON2.jl` | [https://github.com/quinnj/JSON2.jl](https://github.com/quinnj/JSON2.jl)\
    \ | v0.3.1\n\nInput/Output in Julia is implemented by first choosing the appropriate\
    \ `IOStream` object—a file, the user terminal, or a network object—and then applying\
    \ the desired function over that stream. The general idea is to open the stream,\
    \ perform the required operations, and then close the stream.\n\nConcerning the\
    \ user's terminal, Julia provides interaction with it through the built-in `stdin`\
    \ and `stdout` (and eventually `stderr`) `IO` streams. These are already opened\
    \ and are the default streams for input and output operations.\n\nConcerning web\
    \ resources, you currently still need to use a third-party package. We will consider\
    \ `HTTP.jl` (se[e https://github.com/JuliaWeb/](https://github.com/JuliaWeb/HTTP.jl)[HTTP.jl)](https://github.com/JuliaWeb/HTTP.jl)\
    \ in this chapter.\n\n## 5.1 Reading (Input)\n\n### 5.1.1 Reading from the Terminal\n\
    \n- `aString = readline()`: Read whatever the user types into the terminal until\
    \ pressing `Enter`.\n- `anInteger = parse(Int64, readline())`: Read a number entered\
    \ by the user in the terminal.\n\nLet's note that you will rarely want this. Julia\
    \ is interactive and you can run portions of code, or change the variables directly\
    \ from the terminal or the editor that is being used.\n\nStill, you can create\
    \ a Julia script (like in the following example) and run it (with either `julia\
    \ myScript.jl` or with `include(\"myScript.jl\")` from within the Julia prompt).\
    \ This will mimic the classic \"scripts\" behavior, where the user runs a script\
    \ without having full control over it, but only entering the user input that is\
    \ requested by the script:\n\n```julia\nprintln(\"Welcome to a Julia script\\\
    n\\n\")\n\nfunction getUserInput(T=String,msg=\"\")\n    print(\"$msg \")\n  \
    \  if T == String\n        return readline()\n    else\n        try\n        \
    \    return parse(T,readline())\n        catch\n            println(\"Sorry, I\
    \ could not interpret your answer. Please try again\")\n            getUserInput(T,msg)\n\
    \        end\n    end\nend\n\nsentence = getUserInput(String,\"Which sentence\
    \ do you want to be repeated?\");\nn = getUserInput(Int64,\"How many times do\
    \ you want it to be repeated?\");\n[println(sentence) for i in 1:n]\nprintln(\"\
    Done!\")\n```\n\nNote that in this code snippet, function uses runtime exceptions\
    \ to be sure that the user's response is compatible with the type you want. You'll\
    \ learn more about runtime exceptions in Chapter [8.](#index_split_001.html#p125)\n\
    \n### 5.1.2 Reading from a File\n\nFile reading (and, you will see, writing) is\
    \ similar in Julia to other languages.\n\nYou open the file, specify the modality\
    \ (`r`, which stands for \"reading\"), bind the file to an object, operate on\
    \ the object, and `close()` it when you are done.\n\nA better alternative is to\
    \ encapsulate the file operations in a do block that closes the file automatically\
    \ when the block ends.\n\n- Reading a whole file in a single operation:\n\n```julia\n\
    open(\"afile.txt\", \"r\") do f # \"r\" for reading\n    filecontent = read(f,String)\
    \ # Note that it can be used only once. If used a second time, without reopening\
    \ the file, read() would return an empty string\nend\n```"
