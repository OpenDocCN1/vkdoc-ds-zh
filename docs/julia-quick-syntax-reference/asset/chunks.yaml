- fmt: "# OR\n\n`rowAverages(rows) = @cxx rowAverages(rows)`\n\n`rows_avgs = collect(rowAverages(rows_cpp))`\n\
    \n## Chapter 7 Interfacing Julia with Other Languages\n\nThe conversion from Julia\
    \ data to C++ data (to be used as arguments of the C++ function) is done using\
    \ the familiar `convert(T, source)` function, but where `T` is given by the expression\
    \ returned by `cxxt\"[Cpp type]\"`.\n\nThe converted data can then be used in\
    \ the C++ function call, with the note that if the direct call form of `icxx\"\
    ` is used, this has to be interpolated using the dollar `$` operator.\n\nFinally,\
    \ `collect` is used to copy data from the C++ structures returned by the C++ function\
    \ to a Julia structure (you can avoid copying by using pointers).\n\n### 7.2.3\
    \ Load a C++ Library\n\nThe third way to use C++ code is to load a C++ library\
    \ and then call the functions defined in that library directly. The advantage\
    \ to this approach is that the library doesn’t need to be aware that it will be\
    \ used in Julia (i.e., no special Julia headers or libraries are required at the\
    \ compile time of the C++ library), as the wrap is done entirely in Julia. That\
    \ means preexisting libraries can be reused.\n\nLet’s reuse the last example,\
    \ but this time you will compile it in a shared library.\n\n`mycpplib.cpp`:\n\n\
    ```cpp\n#include <vector>\n#include \"mycpplib.h\"\nusing namespace std;\n\nvector<double>\
    \ rowAverages (vector< vector<double> > rows) {\n    // Compute average of each\
    \ row.\n    vector<double> averages;\n    for (int r = 0; r < rows.size(); r++)\
    \ {\n        double rsum = 0.0;\n        double ncols = rows[r].size();\n    \
    \    for (int c = 0; c < rows[r].size(); c++) {\n            rsum += rows[r][c];\n\
    \        }\n        averages.push_back(rsum/ncols);\n    }\n    return averages;\n\
    }\n```\n\n`mycpplib.h`:\n\n```cpp\n#include <vector>\nstd::vector<double> rowAverages\
    \ (std::vector< std::vector<double> > rows);\n```\n\nYou can then compile the\
    \ shared library with `g++`, a C++ compiler:\n\n`g++ -shared -fPIC -o libmycpplib.so\
    \ mycpplib.cpp`\n\nYou are now ready to use it in Julia:\n\n```julia\nusing Cxx\n\
    using Libdl\n\nconst path_to_lib = pwd()\naddHeaderDir(path_to_lib, kind=C_System)\n\
    cxxinclude(\"mycpplib.h\")\nLibdl.dlopen(joinpath(path_to_lib, \"libmycpplib.so\"\
    ), Libdl.RTLD_GLOBAL)\n\nrows_julia = [[1.5,2.0,2.5],[4,5.5,6,6.5,8]]\nrows_cpp\
    \ = convert(cxxt\"std::vector< std::vector< double > >\", rows_julia)\nrows_avgs\
    \ = collect(icxx\"rowAverages($rows_cpp);\")\n```\n\nThe only new steps here are\
    \ as follows:\n\n- You need to explicitly load the standard lib `Libdl`\n- You\
    \ need to add the C++ headers\n- You need to open the shared library\n\nYou are\
    \ now able to use the functions defined in the library as if you embedded the\
    \ C++ code in the Julia script.\n\n## 7.3 Julia ⇄ Python\n\nThe “standard” way\
    \ to call Python code in Julia is to use the `PyCall` (https://github.com/JuliaPy/PyCall.jl)\
    \ package. Some of its nice features include the following:\n\n- It can automatically\
    \ download and install a local copy of Python, private to Julia, in order to avoid\
    \ messing with version dependency from the “main” Python installation and provide\
    \ a consistent environment within Linux, Windows, and MacOS.\n- It provides automatic\
    \ conversion between Julia and Python types.\n- It is very simple to use.\n\n\
    Concerning the first point, `PyCall` by default installs the “private” Python\
    \ environment in Windows and MacOS while it will use the system default Python\
    \ environment in Linux.\n\nYou can override this behavior with (from the Julia\
    \ prompt)\n\n`ENV[\"PYTHON\"]=\"blank or /path/to/python\"; using Pkg; Pkg.build(\"\
    PyCall\");`\n\nwhere, if the environmental variable is empty, `PyCall` will install\
    \ the “private” version of Python.\n\nGiven the vast number of Python libraries,\
    \ it is no wonder that `PyCall` is one of the most common Julia packages.\n\n\
    ### 7.3.1 Embed Python Code in a Julia Program"
