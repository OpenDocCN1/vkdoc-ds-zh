- fmt: "# Type Stability in Julia\n\nA function is said to be type-stable when its\
    \ return type depends only on the types of the input, not on their values. While\
    \ type-unstable functions have their return type compiled as `Any`, and only at\
    \ runtime are they converted to a specific type, type-stable functions can be\
    \ optimized by the compiler, as it is able to compile specialized versions for\
    \ all the possible types the function can be called with. Further, type stability\
    \ is essential in retaining the capacity of the compiler to infer the types of\
    \ the various objects across the various chained calls.\n\nIt is important to\
    \ note that type stability is *not* the problem that parameters aren’t annotated\
    \ with a specific type. Often the compiler will still be able to list, at compile\
    \ time, all the possible types of the parameters for that function, and still\
    \ produce performant code, even without explicit type annotation.\n\n## Example\
    \ of a Type-Unstable Function\n\nLet’s look at an example of a type-unstable function:\n\
    \n```julia\nfunction fUnstable(s::AbstractString, n)\n    # This returns the type\
    \ that is given in parameter `s` as a text string:\n    T = getfield(Base, Symbol(s))\n\
    \    x = one(T)\n    for i in 1:n\n        x = x + x\n    end\n    return x\n\
    end\n```\n\nThe problem here is that the returned value depends on the specific\
    \ text entered as input, that is, on the *value* of the `s` parameter. While this\
    \ may seem like an extreme case, type-unstable functions often arise when processing\
    \ user data or reading from some inputs.\n\n## Checking Type Stability with `@code_warntype`\n\
    \nType stability of a function can be checked with the `@code_warntype myfunct()`\
    \ macro.\n\nIf you run `@code_warntype fUnstable(\"Float64\", 100000)` in a terminal,\
    \ you would obtain a lengthy output, but the important bit is the first line that\
    \ would read as `Body::Any` (displayed in red in the Julia REPL). It is this information\
    \ that tells you that the function is type-unstable.\n\n## Example of a Type-Stable\
    \ Function\n\nOne way to remove type instability in this example is to fix the\
    \ `x` variable to `Float64`:\n\n```julia\nfunction fStable(s::AbstractString,\
    \ n)\n    T = getfield(Base, Symbol(s))\n    x = one(Float64)\n    for i in 1:n\n\
    \        x = x + x\n    end\n    return x\nend\n```\n\nIf you run `@code_warntype\
    \ fStable(\"Float64\", 100000)`, you receive in the first line of the output a\
    \ `Body::Float64` (displayed in a reassuring blue), which confirms the type stability\
    \ of the function.\n\n## Benchmarking: Performance Gain from Type Stability\n\n\
    You can benchmark the two functions. Improvements due to type stability are huge:\n\
    \n```julia\n@benchmark fUnstable(\"Float64\", 100000)  # median time: 1.299 ms\n\
    @benchmark fStable(\"Float64\", 100000)    # median time: 111.461 μs\n```\n\n\
    ## Strategy for Functions That Cannot Be Made Type-Stable\n\nIf there are functions\
    \ that really cannot be made type-stable, a strategy could be to break the function\
    \ into multiple definitions, where hopefully the computational-intensive part\
    \ can be made type-stable.\n\n---\n\n## 8.1.4 Other Tips to Improve Performance\n\
    \n### Avoid Using Global Variables and Run Performance-Critical Code Within Functions\n\
    \nGlobal variables (variables that are defined outside any function) can change\
    \ their type at any time. Instead of using a global variable inside a function,\
    \ pass the variable as a function parameter. If this is not possible or practical,\
    \ try at least to declare the global variable as `const` (as to fix its type)\
    \ or annotate its type at the point of usage in the function.\n\n### Annotate\
    \ the Type of Data Structures\n\nAs an exception to the rule that annotation in\
    \ Julia is generally useless for performance, to annotate the type of the inner\
    \ elements of a data container with a concrete type can help with performance.\
    \ Given that primitive types have fixed memory size, an array of them (e.g., `Array{Float64}`)\
    \ can be stored in memory contiguously, in a highly efficient way. Conversely,\
    \ containers of `Any` elements, or even any abstract type, are stored as pointers\
    \ to the actual memory that ends up being sparsely stored and hence relatively\
    \ slow to be accessed.\n\n### Annotate the Fields of Composite Types\n\nAs a further\
    \ exception to the annotation-is-not-needed rule, leaving the field of a structure\
    \ unannotated (or annotated with an abstract type) will leave type-unstable all\
    \ the functions that use that structure. If you want to keep the flexibility,\
    \ use parametric structures instead.\n\nFor example:\n\n```julia\nstruct MyType2\n\
    \    a::Float64\nend\n\n# ..or..\nstruct MyType3{T}\n    a::T\nend\n```"
