    return a[n]


    end


    You can access its functions in Python with:


    >>>> jl.include("juliaScript.jl")


    PYTHON


    >>>> jl.helloWorld() *# Prints `Hello World!``*


    >>>> a = jl.sumMyArgs([1,2,3],[4,5,6]) *# Returns àrray([5, 7, 9],* *dtype=int64)``*


    >>>> b = jl.getNElement(1) *# Returns `0`, the "first" element* *for Julia*


    As with calling Python from Julia, you can pass to the functions and retrieve
    complex data types without worrying too much about the conversion.


