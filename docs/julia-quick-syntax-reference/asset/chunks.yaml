    With the keyword local x you specify that the variable x must be


    treated as a new local variable, independent of the homonymous


    global one.


    Abusing global variables makes the code more difficult to read, may lead to unintended
    results, and is often the cause of computational bottleneck. use them sparingly!


    **3.2 Repeated Iteration: for and while**


    **Loops, List Comprehension, Maps**


    The for and while constructs are very flexible. First, the condition can be expressed
    in many ways: for i = 1:2, for i in anArray, while i < 3 …


    Second, multiple conditions can be specified in the same loop. Consider this example:


    for i=1:2,j=2:5


    JULIA


    println("i: $i, j: $j")


    end


    In this case, a higher-level loop starts over the range 1:2, and then for each
    element, a nested loop over 2:5 is executed.


    break and continue are supported and work as expected—break


    immediately aborts the loop sequence, while continue immediately


    passes to the next iteration.


    Julia supports other constructs for repeated iteration, namely list comprehension
    and maps.


    ChApTer 3 CoNTrol FloW ANd FuNCTIoNs


    List comprehension is essentially a very concise way to write a for loop:


    [myfunction(i) for i in [1,2,3]]


    [x + 2y for x in [10,20,30], y in [1,2,3]]


    For example, you could use list comprehension to populate a


    dictionary from one or more arrays:


    [mydict[i]=value for (i, value) in enumerate(mylist)]


    [students[name] = sex for (name,sex) in zip(names,sexes)]


    You can write complex expressions with list comprehension, such as


    [println("i: $i - j: $j") for i in 1:5, j in 2:5 if i > j], but at this point
    perhaps it’s best to write the loop explicitly.


    map applies a function to a list of arguments. The same example of populating
    a dictionary can also be written (a bit less efficiently) using map: map((n,s)
    -> students[n] = s, names, sexes)


    When mapping a function with a single parameter, the parameter can be omitted,
    as follows:


    a = map(f, [1,2,3]) is equal to a = map(x->f(x), [1,2,3])


    **3.3 Conditional Statements: if Blocks,**


    **Ternary Operator**


    Conditional statements can be written with the typical if/elseif/else construct:


    i = 5


    JULIA


    if i == 1


    println("i is 1")


    ChApTer 3 CoNTrol FloW ANd FuNCTIoNs


    elseif i == 2


    println("i is 2")


    else


    println("is in neither 1 or 2")


    end


    Multiple conditions can be considered using the logical operators: *and* (&&),
    *or* (||), and *not* (!) (not to be confused with the bitwise operators, & and
    |).


    Note that when the result of the conditional statement can be inferred before
    the conclusion of the expression evaluation, the remaining parts are not evaluated
    (they are “short-circuited”). Typical cases are when the first condition of an
    && operator is false or the conditions of the || operator are true. In such cases,
    it is useless to evaluate the second condition.


    In the same way that list comprehension is a concise way to write


    for loops, the ternary operator is a concise way to write conditional statements.


    The syntax is as follows:


    a ? b : c


    This means “if a is true, then execute expression b; otherwise, execute expression
    c ”. Be sure there are spaces around the ? and : operators. As with list comprehension,
    it’s important not to abuse the ternary operator in order to write complex conditional
    logic.


    **3.4 Functions**


    Julia’s functions are very flexible. They can be defined inline as f(x,y) = 2x+y,
    or with their own block introduced using the function keyword:


    function f(x)


    JULIA


    x+2


    end


    ChApTer 3 CoNTrol FloW ANd FuNCTIoNs


    A common third way to define functions it is to create an anonymous function and
    assign it to a nameplace (we discuss this a bit later).


    After a function has been *defined*, you can call it to execute it. Note that,
    as with most high-level languages, there isn’t a separate step for *declaring*
    the function in Julia.


    Functions can even be nested, in the sense that the function definition can be
    embedded within another function definition, or can be recursive, in the sense
    that there is a call to itself inside the function definition:'
  trans: "\n# 重新绑定 a：\n\n`julia` `a = 5` # 5\n\n`julia` `b` # [[[1, 20], 30], 40]\n\
