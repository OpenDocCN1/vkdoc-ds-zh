- fmt: "# Rebinds a:\n\n`julia` `a = 5` # 5\n\n`julia` `b` # [[[1, 20], 30], 40]\n\
    \n`julia` `c` # [[[1, 20], 30], 4]\n\n`julia` `d` # [[[1, 2], 3], 4]\n\n# Chapter\
    \ 2 Data types and Structures\n\nYou can check if two objects have the same values\
    \ with `==` and if two objects are actually the same with `===` (keep in mind\
    \ that immutable objects are checked at the bit level and mutable objects are\
    \ checked for their memory address.):\n\n- Given `a = [1, 2]; b = [1, 2]; a ==\
    \ b` and `a === a` are true, but `a === b` is false.\n- Given `a = (1, 2); b =\
    \ (1, 2); all a == b`, `a === a` and `a === b` are true.\n\n## 2.8 Various Notes\
    \ on Data Types\n\nTo convert (“cast”) an object into a different type, use `convertedObj\
    \ = convert(T,x)`. When conversion is not possible, e.g., when you’re trying to\
    \ convert a `6.4 Float64` into an `Int64` value, an error will be thrown (`InexactError`\
    \ in this case).\n\nThe `const` keyword, when applied to a variable (e.g., `const\
    \ x = 5`), indicates that the identifier cannot be used to bind objects of a different\
    \ type. The referenced object can still mutate or the identifier rebound to another\
    \ object of the same type (but in this later case a warning is issued).\n\nOnly\
    \ global variables can be declared `const`.\n\nYou can “broadcast” a function\
    \ to work over a collection (instead of a scalar) using the dot (`.`) operator.\n\
    \nFor example, to broadcast `parse` to work over an array, you would use: `myNewList\
    \ = parse.(Float64,[\"1.1\",\"1.2\"])`\n\n(See more information about broadcasting\
    \ in Chapter [3](#index_split_000.html#p55).) 38\n\nChapter 2 Data types and Structures\n\
    \n### 2.8.1 Random Numbers\n\nIt is easy to obtain pseudo-numbers in Julia:\n\
    - Random float in [0,1]: `rand()`\n- Random integer in [a,b]: `rand(a:b)`\n- Random\
    \ float in [a,b] with precision to the second digit: `rand(a:0.01:b)`\n- Random\
    \ float in [a,b]: `rand(Uniform(a,b))` (requires the `Distributions` package)\n\
    - Random float in [a,b] using a particular distribution (`Normal`, `Poisson`,…):\
    \ `rand(DistributionName([distribution parameters]))`\n\nYou can obtain an array\
    \ or a matrix of random numbers by simply specifying the requested size to `rand()`.\
    \ For example, `rand(2,3)` or `rand(Uniform(a,b),2,3)` for a 2x3 matrix.\n\nYou\
    \ can “fix” the seed of the pseudo-random number generator with `import Random:seed!;\
    \ seed!(1234)`. Doing so, you are still dealing with (pseudo) random numbers,\
    \ but the sequence that’s generated will be the same every time you run the Julia\
    \ script, i.e., generating reproducible output. If you then ever need to revert\
    \ to irreproducible randomness, you can use `seed!()` without arguments.\n\n###\
    \ 2.8.2 Missing, Nothing, and NaN\n\nJulia supports different concepts of *missingness:*\n\
    - `nothing` (type `Nothing`): This is the value returned by code blocks and functions\
    \ that do not return anything. It is a single instance of the singleton type `Nothing`,\
    \ and is closer to C-style NULL (sometimes it is referred to as the “software\
    \ engineer’s null”). Most operations with `nothing` values will result in a run-type\
    \ error. In certain context, it is printed as `#NULL`.\n- `missing` (type `Missing`):\
    \ Represents a missing value in a statistical sense. There should be a value but\
    \ you don’t know what it is (so it is sometimes referred to as the “data scientist’s\
    \ null”). Most operations with `missing` values will propagate (silently). Containers\
    \ can handle `missing` values efficiently when they are declared of type `Union{T,Missing}`.\
    \ The `Missings.jl` package ([https://github.com/JuliaData/Missings.jl](https://github.com/JuliaData/Missings.jl))\
    \ provides additional methods to handle missing elements.\n- `NaN` (type `Float64`):\
    \ Represents when an operation results in a Not-a-Number value (e.g., `0/0`).\
    \ It is similar to `missing` in that it propagates silently rather than resulting\
    \ in a run-type error. Similarly, Julia also offers `Inf` (e.g., `1/0`) and `-Inf`\
    \ (e.g., `-1/0`).\n\n# Chapter 3 Control Flow and Functions\n\nNow that you’ve\
    \ been introduced to the main types and containers available in Julia, it is time\
    \ to put them to work.\n\n## 3.1 Code Block Structure and Variable Scope\n\nAll\
    \ the typical flow-control constructs (`for`, `while`, `if/else`, and `do`) are\
    \ supported. The syntax typically takes this form:\n\n```\n<keyword> <condition>\n\
    ... block content...\nend\n```\n\nFor example:\n\n```\nfor i in 1:5\n    println(i)\n\
    end\n```\n\nNote that parentheses around the condition are not necessary, and\
    \ the block ends with the keyword `end`.\n\n© Antonello Lobianco 2019\nA. Lobianco,\
    \ *Julia Quick Syntax Reference*, [https://doi.org/10.1007/978-1-4842-5190-4_3](#index_split_000.html#p55)\n\
    \nChapter 3 Control Flow and Functions\n\n### Variable Scope\n\nNote that within\
    \ a block the visibility of a variable changes, and Julia is somehow more restrictive\
    \ than most other languages in this regard.\n\nWhen you define a variable (in\
    \ the REPL, Atom, or IJulia Notebook, for example), you do so in the global scope.\n\
    \nMost blocks (`for`, `while`, but notably not `if`) and functions define new\
    \ local scopes that inherit from the surrounding scope.\n\nGlobal variables are\
    \ inherited only for reading, not for writing. The following snippet will result\
    \ in an `UndefVarError`: code not defined error.\n\n```\na = 4\nwhile a > 2\n\
    \    a -= 1\nend\n```\n\nTo assign to a global variable, you need an explicit\
    \ `global`:\n\n```\na = 5\nwhile a > 2\n    global a\n    println(\"a: $a\")\n\
    \    b = a\n    while b > 2\n        println(\"b: $b\")\n        b -= 1\n    end\n\
    \    a -= 1\nend\n```\n\nChapter 3 Control Flow and Functions\n\nNote that assignment\
    \ to `b` is still possible, as `b` is *not* a global variable, but is a local\
    \ variable defined in the first `while` block and then inherited in the second\
    \ one.\n\nWith the keyword `local x` you specify that the variable `x` must be\
    \ treated as a new local variable, independent of the homonymous global one.\n\
    \nAbusing global variables makes the code more difficult to read, may lead to\
    \ unintended results, and is often the cause of computational bottleneck. Use\
    \ them sparingly!\n\n## 3.2 Repeated Iteration: for and while Loops, List Comprehension,\
    \ Maps\n\nThe `for` and `while` constructs are very flexible. First, the condition\
    \ can be expressed in many ways: `for i = 1:2`, `for i in anArray`, `while i <\
    \ 3` …\n\nSecond, multiple conditions can be specified in the same loop. Consider\
    \ this example:\n\n```\nfor i=1:2,j=2:5\n    println(\"i: $i, j: $j\")\nend\n\
    ```\n\nIn this case, a higher-level loop starts over the range `1:2`, and then\
    \ for each element, a nested loop over `2:5` is executed.\n\n`break` and `continue`\
    \ are supported and work as expected—`break` immediately aborts the loop sequence,\
    \ while `continue` immediately passes to the next iteration.\n\nJulia supports\
    \ other constructs for repeated iteration, namely list comprehension and maps.\n\
    \nChapter 3 Control Flow and Functions\n\nList comprehension is essentially a\
    \ very concise way to write a `for` loop:\n\n```\n[myfunction(i) for i in [1,2,3]]\n\
    [x + 2y for x in [10,20,30], y in [1,2,3]]\n```\n\nFor example, you could use\
    \ list comprehension to populate a dictionary from one or more arrays:\n\n```\n\
    [mydict[i]=value for (i, value) in enumerate(mylist)]\n[students[name] = sex for\
    \ (name,sex) in zip(names,sexes)]\n```\n\nYou can write complex expressions with\
    \ list comprehension, such as `[println(\"i: $i - j: $j\") for i in 1:5, j in\
    \ 2:5 if i > j]`, but at this point perhaps it’s best to write the loop explicitly.\n\
    \n`map` applies a function to a list of arguments. The same example of populating\
    \ a dictionary can also be written (a bit less efficiently) using `map`: `map((n,s)\
    \ -> students[n] = s, names, sexes)`\n\nWhen mapping a function with a single\
    \ parameter, the parameter can be omitted, as follows: `a = map(f, [1,2,3])` is\
    \ equal to `a = map(x->f(x), [1,2,3])`\n\n## 3.3 Conditional Statements: if Blocks,\
    \ Ternary Operator\n\nConditional statements can be written with the typical `if/elseif/else`\
    \ construct:\n\n```\ni = 5\nif i == 1\n    println(\"i is 1\")\nelseif i == 2\n\
    \    println(\"i is 2\")\nelse\n    println(\"is in neither 1 or 2\")\nend\n```\n\
    \nChapter 3 Control Flow and Functions\n\nMultiple conditions can be considered\
    \ using the logical operators: *and* (`&&`), *or* (`||`), and *not* (`!`) (not\
    \ to be confused with the bitwise operators, `&` and `|`).\n\nNote that when the\
    \ result of the conditional statement can be inferred before the conclusion of\
    \ the expression evaluation, the remaining parts are not evaluated (they are “short-circuited”).\
    \ Typical cases are when the first condition of an `&&` operator is false or the\
    \ conditions of the `||` operator are true. In such cases, it is useless to evaluate\
    \ the second condition.\n\nIn the same way that list comprehension is a concise\
    \ way to write `for` loops, the ternary operator is a concise way to write conditional\
    \ statements.\n\nThe syntax is as follows:\n\n```\na ? b : c\n```\n\nThis means\
    \ “if `a` is true, then execute expression `b`; otherwise, execute expression\
    \ `c`”. Be sure there are spaces around the `?` and `:` operators. As with list\
    \ comprehension, it’s important not to abuse the ternary operator in order to\
    \ write complex conditional logic.\n\n## 3.4 Functions\n\nJulia’s functions are\
    \ very flexible. They can be defined inline as `f(x,y) = 2x+y`, or with their\
    \ own block introduced using the `function` keyword:\n\n```\nfunction f(x)\n \
    \   x+2\nend\n```\n\nChapter 3 Control Flow and Functions\n\nA common third way\
    \ to define functions is to create an anonymous function and assign it to a nameplace\
    \ (we discuss this a bit later).\n\nAfter a function has been *defined*, you can\
    \ call it to execute it. Note that, as with most high-level languages, there isn’t\
    \ a separate step for *declaring* the function in Julia.\n\nFunctions can even\
    \ be nested, in the sense that the function definition can be embedded within\
    \ another function definition, or can be recursive, in the sense that there is\
    \ a call to itself inside the function definition."
