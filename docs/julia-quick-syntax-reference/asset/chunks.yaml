    will try to resolve the possible parameter types and return values, and only in
    rare cases will it be unable to uniquely determine the return type as a function
    of the input types. In these cases (type-unstable), specifying the parameter types
    may help solve type instability.


    The most important reason to limit the parameter type is to catch bugs early on,
    when the function is accidentally called with a parameter type it was not designed
    to work with. In such cases, if the function was annotated with the allowed parameter
    type, Julia will return to the user a useful error message instead of silently
    trying to use that parameter.


    However, a common case is when you want the function to process


    single values (scalars) or vectors of a given parameter. You have two options
    then:


    • You can write the function to treat the scalar and rely


    then on the dotted notation to broadcast the function at


    call time (discussed more later).


    • Alternatively, you may want to directly deal with this


    in the function definition. In such cases, you can


    declare the parameter as being either a scalar type T


    or a vector T using a union. For example: function


    f(par::Union{Float64, Vector{Float64}}) [...]


    end. You can then implement the logic you want by


    checking the parameter type using typeof.


