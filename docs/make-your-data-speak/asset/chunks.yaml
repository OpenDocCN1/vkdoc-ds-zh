- fmt: '#### Conditional Formatting with Icons


    For conditional formatting of the `Margin` column, we will use colored icons according
    to the traffic light rule:


    1. Red color – for values less than 10%

    2. Yellow color – for values from 10% to 20%

    3. Green color – for values greater than 20%


    To do this, select the `Margin` column and select `Icon Sets` ➤ `More Rules…`
    on the main menu tab under the `Conditional Formatting` button.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbv_HTML.png)


    A page depicts conditional formatting with icon sets enabled.


    In the window that opens, we set our rules. Specify the desired value in the `Display
    each icon according to these rules` section, and select `Number` in the `Type`
    drop-down list.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbw_HTML.png)


    A page depicts the new formatting rule with the format of all cells based on their
    values enabled for icon sets.


    After all these actions, we will remove the fill for the headers and totals. And
    we will get a harmoniously designed table in calmer colors.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbx_HTML.jpg)


    A table lists the names of managers, revenue, revenue exec, profit, profit exec,
    margin, and several orders.


    Since this is a pivot table, you can connect slicers to it to filter data.


    ### 6.4.4 Typical Errors


    With conditional formatting, it is important not to overdo it, otherwise it will
    start to ripple in the eyes. For example, this happens when both the value and
    the background of the cell are colored. You need to know the limit, and it’s like
    this: **one column is one way of formatting.**


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figby_HTML.png)


    The two table lists the manager names with revenue execution in decreasing manner
    with color fill and without color fill. A cross mark and tick on the extreme top
    and right left.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbz_HTML.png)


    Two tables. 1. The lists of managers and the actual revenue values are exposed.
    A cross mark is exhibited on the top left corner. 2. The lists of managers and
    revenues are exposed. A tick mark is exhibited on the top right corner.


    To choose the correct formatting method, think about the types of data analysis.
    If you need to compare the values and show what is more and what is less, this
    is a rating. It is displayed in the form of horizontal columns. And deviations
    in percentages are highlighted according to the principle of a traffic light.


    A separate love of novice designers is a gradient. I use it extremely rarely for
    two reasons.


    - **For logical reasons.** We set specific threshold values for indicators: `good`
    – in the green zone, `bad` – in the red. We assign yellow color to intermediate
    permissible deviations, and do not smear them in a gradient.

    - **For aesthetic reasons.** The gradient between red and green gives a dirty
    shade. And together with yellow, it becomes either dirty or too pale.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figca_HTML.png)


    The two tables list the manager names with margins in decreasing manner with color
    fill and without color fill. A cross mark and tick on the extreme top and right
    left.


    An exception for gradient fill can be the `heat map` technique. The following
    example shows how managers are busy working with clients by month. The situation
    is ambiguous: on the one hand, it is clear who has a lot of work and who has little;
    on the other hand, the shades begin to ripple in the eyes.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcb_HTML.png)


    A representative table exposes the workload of managers from January to December.
    The total range is exhibited on the right side. Baker has the maximum workload
    (4,856).


    In such a situation, it is worth considering which zones to focus on: negative
    or positive. There is no need to go to the customer with questions about the color
    design: it is better to prepare and show possible options.


    #### Option 1. Positive


    The most saturated fill is used for the maximum value – it is immediately clear
    that the peak of sales was in May at the manager Baker. Similarly, peaks or literally
    voids in sales are noticeable. And it is obvious whose contribution to the overall
    result is invisible.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcc_HTML.png)


    The Colored excel sheet contains the workload of managers by month, it has 11
    names of managers on the left side in a column. On the right side, it has months
    from January to December, and Total in a row. The maximum workload is managed
    by Baker 4856, the minimum workload is managed by Wilson 884.


    #### Option 2. Negative


    The situation is reversed here: the brightest red color is at the minimum value,
    and the maximum is highlighted in white. But with this approach, almost the entire
    table is lit red, even the leaders in terms of sales. Not the most successful
    visualization, because the accents were lost again.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcd_HTML.png)


    A representative table exhibits the workload of managers from January to December.
    The negative option is used in the table. The minimum value is exposed in the
    bright red color.


    #### Option 3. Interactive


    Analysts often place all sorts of table combinations on several sheets. And they
    call it a dashboard, although, with such a presentation, its idea is lost: you
    need a separate instruction on where to look and where to start.


    Even if the customer insists on such a table, I offer him an option in the ideology
    of an interactive dashboard. And I definitely show him how to use it.


    For example, the chart shows that in August we had a peak in sales. Whose merit
    is this? We choose August in a slicer and see that the leader in revenue this
    month is manager Williams, and Jones brought the least money to the company.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figce_HTML.png)


    A line graph with a bar graph and a bar graph depicts the dynamic of profit and
    orders, and revenue by managers.


    We look at Williams’ personal statistics by selecting his surname on the slicer.
    We see that he is the best for the year. During the year, manager Williams brought
    125 million dollars in revenue, and the company’s profit from his work averaged
    two million dollars per month.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcf_HTML.png)


    A line graph with a bar graph and a bar graph depicts the dynamic of profit and
    orders, and revenue by managers.


    I often come across managers who don’t really need visualization and tables are
    quite enough. This is especially true for people with a financial background:
    one table will tell them more than a dozen charts. This group of managers will
    especially appreciate the use of these rules, because they save a lot of time
    on independent data analysis.


    ### 6.4.5 Summary


    Sooner or later, any analyst has to display such a number of indicators on the
    chart that it becomes unreadable. A good solution for such cases is conditional
    formatting of table fields. It exists in all BI-systems and the principle of operation
    in them is the same as in Excel.


    Five rules for placing visual accents


    1. Instead of target, actual, and deviation indicators, use only actual and deviation.
    Take away what doesn’t tell you anything new.

    2. Design the actual in the form of colored bars, and for deviations use green,
    yellow, and red colors. It can be a font color or an icon with a traffic light
    circle.

    3. If you work with pivot tables, add calculated fields to calculate deviations.
    They can also be used in other data samples.

    4. Use only one formatting technique per column: data bars, font color, traffic
    light icons, or cell fill.

    5. Make sure that the formatting highlights the peak values, and not just paints
    the table in all the colors of the rainbow.'
