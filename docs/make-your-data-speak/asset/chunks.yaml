- fmt: '### 1.1.2 How to Simplify the Process of Copying Cells


    *“`Ctrl`” is used for Windows. For MacBook, you should use “`cmd`” instead.*


    If you select cells, press `Ctrl+C` (copy), put the cursor in the right place
    and press `Ctrl+V` (paste), it will take a long time. There are a couple of ways
    to speed up this process.


    **Solution 1**. Select the cells, bring the cursor to the border of the selected
    block and press `Ctrl` – a “`+`” appears near the cursor. Hold down the `Ctrl`
    key and drag the copy of the data to the desired location with the mouse.


    **Solution 2**. Select the desired cells and double-click on the lower right corner
    of the selected block: the cells will be filled below.


    The result will be the same, but I prefer the second method – it’s faster.


    ### 1.1.3 Summary


    Analysis of the original cross-table showed that it’s not suitable for creating
    an interactive dashboard.


    We have identified five categories of data and transformed the table.


    1. Distributed five categories of data in five columns

    2. Deleted rows with subtotals

    3. Filled in the rows with the corresponding data


    As a result of these steps, we received a flat table suitable for “machine” processing
    and ready to create pivot tables – the basis for an interactive dashboard.


    **Important!** I’m not encouraging you to move values from columns to rows manually.
    In our real projects, we have tens of thousands of rows and even millions. It’s
    important to me that you feel the logic of a flat table in our training example
    “at your fingertips” and could explain to a technical specialist how to properly
    unload data from the database.


    **Download the source table**


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figbb_HTML.png)


    A photo of a bar code.


    ## 1.2 Preparing the Basis for the Dashboard


    The basis of an interactive dashboard in MSs Excel is pivot tables. In this part,
    you will learn how to create such tables, update data in them, and prepare subsets
    of data for future visual elements.


    ### 1.2.1 Creating a Pivot Table


    To create a pivot table, there is no need to select an entire flat table – just
    put the cursor on any cell and select the “Pivot Table” button on the “Insert”
    tab.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figj_HTML.gif)


    An excel sheet depicts the division, expense item, month, target, and actual.
    It is overlapped by the pivot table range menu. Insert pivot table option is enabled.


    In the appeared dialog window, make sure that the entire required range of data
    is included. The pivot table must be placed on a new sheet (this is the default
    option, so you can just click “OK”).


    On the new sheet, you will have a panel on the right (default view):


    - filters

    - columns

    - rows

    - values


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figk_HTML.png)


    A screenshot of the new file in an excel sheet. Pivot table fields are on the
    right side.


    **How It Works**


    Numerical data falls into the “Values” (check the “Target” and “Actual” boxes).


    Data categories fall into rows (check the box “Month”).


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figl_HTML.jpg)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual with pivot table fields for the enabled option of the month, target,
    and actual.


    If we add another field with divisions, their names will fall into the rows. They
    can be moved to columns by dragging and dropping.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figm_HTML.png)


    An excel sheet depicts 2 columns namely row label and column label with subcolumns
    sum of target and sum for actual for months January through June with pivot table
    fields for enabled options of division, month, target, and actual.


    But for building a dashboard, we don’t need it – first we make separate simple
    tables for each graph. If something went wrong, there is a “Clear” button on the
    “PivotTable Analyse” tab – use it and repeat.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Fign_HTML.jpg)


    An excel sheet depicts the row and column labels with pivot table fields for enabled
    options of division, month, target, and actual. Clear all option is selected.'
