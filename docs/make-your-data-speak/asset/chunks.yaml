  trans: '

    ### 5.1.2 生活技巧：从 PowerPoint 导入现成主题


    当公司已有企业风格演示文稿模板时，这部分内容非常实用。这些模板可用于 Excel 中的交互式仪表板。


    我将以商业智能研究所的演示文稿为例，展示如何操作：该演示文稿已具备公司规定的颜色和经批准的字体。按照同样的方法，您也可以使用所在组织的仪表板设计。


    ![](img/537732_1_En_5_Figd_HTML.png)


    PowerPoint 窗口中显示的是商业智能研究所的演示文稿。它采用了公司批准的字体和精心挑选的颜色。屏幕设置为浅色主题。


    与图表模板类似，PowerPoint 的企业主题可以保存到您的电脑中，然后在 Excel 中使用。


    **第 1 步。** 打开演示文稿，进入`设计`菜单选项卡，展开`主题`部分的下拉列表，选择`保存当前主题`选项。


    ![](img/537732_1_En_5_Fige_HTML.png)


    截图展示了设计菜单选项卡，其中主题部分显示了不同的字体和主题，左角有保存和浏览选项。


    在打开的对话框中，指定文件名，选择保存主题的文件夹，然后点击`保存`。


    **第 2 步。** 在 Excel 工作簿中，打开仪表板新版本所在的工作表，进入`页面布局`菜单选项卡，点击`主题`，然后在主题图标列表下方找到`浏览主题...`按钮。


    在打开的`选择主题或主题文档`窗口中，进入包含所需文件的文件夹，选中该文件并点击`打开`。


    完成！PowerPoint 中的主题会自动应用到整个 Excel 工作簿。您可以通过查看可用的颜色来验证：它们必须与演示文稿中的调色板匹配。


    ![](img/537732_1_En_5_Figf_HTML.png)


    窗口屏幕使用了公司字体 Montserrat。其中包含按部门和项目划分的费用图表，以及附带部门和项目列表的薪资基金分析，此外上方还有调色板。


    企业字体 Montserrat 比标准字体更宽，因此`按部门划分的费用`图表上的标签文字会倾斜排列。我增大了图表尺寸，使它们重新变为水平。如果这对您没有帮助，您可能需要将标签字体缩小到
    11 号。


    这里我们再次遇到了 Excel 的一个缺陷：除 KPI 卡片外，仪表板上的所有元素字体都已更改。KPI 卡片的字体需要手动修改。


    与 Excel 中的内置颜色主题一样，新样式不会自动应用于从模板创建的图表。


    当某个视觉元素脱离整体风格时，我会感到有些困扰，因此每当颜色变化时，我都会保存并使用新模板。就像我们在第 3.5 部分中使用`更改图表类型`选项所做的那样。之后，我们就能看到新的默认主题效果。


    ![](img/537732_1_En_5_Figg_HTML.png)


    窗口屏幕显示了图表和线条中的新主题。它展示了关于付款动态以及按部门和项目划分的费用图表。不同的颜色用于区分图表的柱形。


    ### 5.1.3 对照清单检查与改进点


    为了使新主题与企业形象保持一致，我们根据上一部分的清单来检查设计。同时，我们还会补充一些需要处理的要点。


    | 1 | 调色板包含对比鲜明的颜色集，有`交通灯`的色调 | ![](img/537732_1_En_5_Figan_HTML.gif) 勾选标记。 |
    在这方面，主题完全符合要求 |

    | 2 | KPI 卡片背景与文字不冲突 | ![](img/537732_1_En_5_Figao_HTML.gif) 勾选标记。 | 浅色背景上的黑色字体易于阅读
    |

    | 3 | 图表柱形之间不相互融合 | ![](img/537732_1_En_5_Figap_HTML.gif) 叉号标记。 | 在新背景上失去了对比度
    |

    | 4 | 数据标签清晰可见 | ![](img/537732_1_En_5_Figaq_HTML.gif) 叉号标记。 | 在新背景上难以区分 |

    | 5 | 服务元素背景柔和 | ![](img/537732_1_En_5_Figar_HTML.gif) 勾选标记。 | 与企业形象调色板一致 |

    | 6 | 图表底衬不显眼 | ![](img/537732_1_En_5_Figas_HTML.gif) 勾选标记。 | 浅色不会分散注意力 |

    | 7 | 数据和坐标轴的字体与颜色一致 | ![](img/537732_1_En_5_Figat_HTML.gif) 勾选标记。 | 现在使用的是 Montserrat
    字体 |

    | 8 | 仪表板背景为企业风格 | ![](img/537732_1_En_5_Figau_HTML.gif) 叉号标记。 | 图表之间和切片器上存在白色斑点
    |

    | 9 | KPI 卡片及其上的指示器保持醒目 | ![](img/537732_1_En_5_Figav_HTML.gif) 叉号标记。 | 未从整体背景中突出
    |

    | 10 | 所有标签的字体均符合企业规范 | ![](img/537732_1_En_5_Figaw_HTML.gif) 叉号标记。 | 未对所有元素自动更改
    |


    ### 5.1.4 总结


    有多种方法可以设计企业风格的仪表板。我们回顾了那些能帮助您快速完成此任务的方法：从零开始在 Excel 中创建主题，以及从 PowerPoint 演示文稿中导入主题。


    在 Excel 中为新主题应用仪表板后，务必了解需要改进和修正的内容。这正是我们案例中需要完善的地方。


    - 恢复图表柱形与图形线条之间的对比度。

    - 为数据标签挑选新颜色，使其在图表浅黄色背景上清晰可见。

    - 整理仪表板的新背景，消除其上的白色斑点。

    - 使 KPI 卡片及其上的指示器更加醒目，避免与背景融合。

    - 将卡片中的字体更改为企业规范中批准的字体，因为它没有自动更改。


    **下载企业风格主题**


    ![](img/537732_1_En_5_Figax_HTML.gif) 条形码照片。


    ## 5.2 根据清单调整主题


    许多人抱怨：你学会了创建仪表板，但老板仍然要求提供演示文稿。我们不得不设法应付，但结果往往不尽如人意。


    有些人插入单个图表，但格式在幻灯片上就会走样。有些人添加截图，然后花费数小时调整位置，以求一切整齐划一。而如果数据更新了，又得手动重做所有工作...


    这一部分就是为了让您不把时间和精力浪费在将仪表板转换为幻灯片上。我们将使其能够替代任何演示文稿，而且它还将是交互式的。


    为了达到这样的效果，我们需要纠正由于使用企业风格主题而出现的缺陷。一些元素“褪色”了，变得难以区分；另一些则失去了必要的对比度。在这一部分，我们将修正所有与我们的清单不符的地方，同时消除新出现的缺陷，使仪表板完全符合企业形象。

    '
- fmt: '### 5.2.1 White Spots on the Dashboard Background


    The background in the presentation template is not white, but pale yellow, close
    to the “paper” shade. It was applied to diagrams, but the fill of cells on the
    sheet remained white. Because of this, the space between the diagrams looks like
    unpainted stripes.


    To fix this, select all the cells of the sheet by clicking the triangle in the
    upper left corner of the table, above row 1. On the `Home` menu tab, under the
    `Fill color` button, select a pale yellow color (by default, it is the first in
    the palette).


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figh_HTML.png)


    A window screen displays the background color presentation. It has a color palette
    with a choice of white. The triangle in the sheet''s upper-left corner is chosen
    to pick every cell (denoted by an arrow).


    ### 5.2.2 Brightness for KPI Cards


    Due to the new color theme, the cards with key indicators were lost in the general
    background and became almost invisible. To fix this, we will change their background
    and color, and also check the corporate font again.


    - The background of the cards – let’s take a contrasting blue.

    - Font of inscriptions – `Montserrat SemiBold`.

    - The color of the inscriptions is white.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figi_HTML.png)


    A PowerPoint window screen displays the brightness change for cards. `Montserrat
    Semibold` is chosen as the inscription''s typeface with a contrasting color at
    the background and white is chosen for the inscription.


    **Tip!**


    *Make sure that the font of all inscriptions has changed to “branded.” Excel can
    show a new font in the font selection field, but when selecting the text, it turns
    out that the font has remained “standard.”*


    ### 5.2.3 New Font for All Elements


    The font change must be checked on all elements of the dashboard. You should start
    this check with the title. If the font remains standard, change it to `Montserrat`
    and select bold. Also make sure that the font of chart titles and data labels
    has changed.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figj_HTML.png)


    An Excel sheet displays the new font for all elements. Under wage fund analysis,
    there are three components. `Montserrat` is underlined in the font tab, and size
    `20` is chosen. The chart title and data labels are changed.


    ### 5.2.4 More Contrast on Charts


    In the diagrams, the saturated yellow and brick colors are distinguishable, but
    it’s still worth adding contrast. This is especially noticeable on the chart,
    where a thin yellow line merges with the background. The color for the “Target”
    category on the graph and diagrams will be replaced with blue, which was used
    in the cards.


    Each chart can be configured manually. But it’s faster to do it using a template.
    After completing the two visualizations, save the bar chart as a template and
    use it for the item “Expenses by items” – just as we did in Part 3.5.


    Remember that Excel sorts the columns of a bar chart in reverse order by default.
    Change the sorting according to the instructions in Part 3.4.


    Don’t forget to set a new font color for the data labels. Here we act according
    to the already familiar rule: choose a shade a shade darker than the color of
    the corresponding column and line.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figk_HTML.png)


    An example window displays the contrast on charts. It features two charts and
    a curve analysis. The target category is replaced with contrast colors and alternative
    colors for the data labels on the graphs and charts.


    ### 5.2.5 Adapting Slicers


    The background color of the slicers remained white – now they are out of the corporate
    identity. To change this, select any slicer and go to the `Slicer` menu tab (in
    older versions of Excel, this is the `Options` tab). In the section `Slicer Styles`,
    right-click the first style in the list and select the `Edit` button.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figl_HTML.png)


    An Excel sheet displays the background color of the slicers. In this screen''s
    slicer menu, the first slicer style in the list is highlighted and the `modify`
    option is chosen.


    In the window that opens, select the `Whole Slicer` and click the `Format` button.
    In the new window, on the `Fill` tab, we set a pale yellow background color.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figm_HTML.png)


    A screenshot illustrates the format slicer element which includes the font, border,
    fill-with-fill effect, and more colors.


    The changed style is automatically applied to the rest of the slicers. We have
    removed these service elements from the white background and brought them into
    line with the corporate identity.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Fign_HTML.png)


    A set of three example slicers (titled: divisions, expense item and month). It
    is displayed below with their corresponding listings in the line of corporate
    identity.


    ### 5.2.6 Finishing Touches and Presentation Mode


    The last touch remained – the company’s logo on the dashboard. There is a special
    place for it in the upper left corner of the screen, above the slicers. I use
    the logo from the same PowerPoint presentation, but you can also upload a separate
    image.


    This completes the creation of an interactive dashboard in the corporate style.
    If you have saved the “standard” version, now you can compare how much the result
    has changed.


    To enhance the effect, it remains to prepare a “Presenter Mode,” especially if
    you will show the dashboard on a large screen.


    PowerPoint has a slideshow mode, and many BI systems also have a full-screen demo
    mode. There is no such function in Excel, but as always, we will assemble it from
    improvised means:


    - On the `View` tab, uncheck the box next to the `Formula Bar` item.

    - We do the same in the `Headings` checkbox to remove row numbers and column letters,
    which means to increase the scale of the dashboard by another 5–10%.

    - Double-click the title of any of the menu items or on the `Collapse ribbon`
    arrow to hide the ribbon.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figo_HTML.png)


    A window screen displays the presentation mode. The checkbox adjacent to the formula
    bar is unchecked on the `View` tab. The collapse ribbon option is marked with
    an arrow in the right top corner of the screen.


    Such a dashboard no longer needs to be inserted with a screenshot into the presentation:
    now it is itself a beautiful interactive presentation.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figp_HTML.png)


    A window displays the BI institute of business intelligence page with graphs and
    charts on wage fund analysis. It displays the dashboard with a new interactive
    presentation.


    ### 5.2.7 Summary


    In order for the dashboard to match the brand book, it is not enough to apply
    a “corporate” theme to it. New colors can reduce contrast, new fonts can distort
    the layout.


    For a professional result, check your work according to the checklist items from
    Part 4.5. And do not forget about the elements of corporate identity.


    - The background color is correctly distributed throughout the panel: there are
    no white spots between the diagrams.

    - The standard font of titles and inscriptions (including in cards) has changed
    to “corporate.”

    - The size of the new font is optimal for the dashboard: the inscriptions are
    arranged horizontally and are easy to read.

    - There is enough contrast between the elements of the diagrams that need to be
    compared, and they do not merge.

    - KPI cards were not lost on the general background because of the theme used:
    they are clearly visible.

    - The background of the interactive slicers is also decorated in the right colors:
    there are no white spots left on it.

    - The dashboard has all the necessary elements of corporate style, such as a logo.'
  raw: '### 5.2.1 White Spots on the Dashboard Background


    The background in the presentation template is not white, but pale yellow, close
    to the “paper” shade. It was applied to diagrams, but the fill of cells on the
    sheet remained white. Because of this, the space between the diagrams looks like
    unpainted stripes.


    To fix this, select all the cells of the sheet by clicking the triangle in the
    upper left corner of the table, above row 1\. On the Home menu tab, under the
    Fill color button, select a pale yellow color (by default, it is the first in
    the palette).


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figh_HTML.png)


    A window screen displays the background color presentation. It has a color palette
    with a choice of white. The triangle in the sheet''s upper-left corner is chosen
    to pick every cell (denoted by an arrow).


    ### 5.2.2 Brightness for KPI Cards


    Due to the new color theme, the cards with key indicators were lost in the general
    background and became almost invisible. To fix this, we will change their background
    and color, and also check the corporate font again.


    *   The background of the cards – let’s take a contrasting blue.


    *   Font of inscriptions – Montserrat SemiBold.


    *   The color of the inscriptions is white.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figi_HTML.png)


    A PowerPoint window screen displays the brightness change for cads. Montserrat
    semibold is chosen as the inscription''s typeface with a contrasting color at
    the background and white is chosen for the inscription.


    ***Tip!***


    *Make sure that the font of all inscriptions has changed to “branded.” Excel can
    show a new font in the font selection field, but when selecting the text, it turns
    out that the font has remained “standard.”*


    ### 5.2.3 New Font for All Elements


    The font change must be checked on all elements of the dashboard. You should start
    this check with the title. If the font remains standard, change it to Montserrat
    and select bold. Also make sure that the font of chart titles and data labels
    has changed.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figj_HTML.png)


    An Excel sheet displays the new font for all elements. Under wage fund analysis,
    there are three components. Montserrat is underlined in the font tab, and size
    20 is chosen. The chart title and data labels are changed.


    ### 5.2.4 More Contrast on Charts


    In the diagrams, the saturated yellow and brick colors are distinguishable, but
    it’s still worth adding contrast. This is especially noticeable on the chart,
    where a thin yellow line merges with the background. The color for the “Target”
    category on the graph and diagrams will be replaced with blue, which was used
    in the cards.


    Each chart can be configured manually. But it’s faster to do it using a template.
    After completing the two visualizations, save the bar chart as a template and
    use it for the item “Expenses by items” – just as we did in Part 3.5.


    Remember that Excel sorts the columns of a bar chart in reverse order by default.
    Change the sorting according to the instructions in Part 3.4.


    Don’t forget to set a new font color for the data labels. Here we act according
    to the already familiar rule: choose a shade a shade darker than the color of
    the corresponding column and line.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figk_HTML.png)


    An example window displays the contrast on charts. It features two charts and
    a curve analysis. The target category is replaced with contrast colors and alternative
    colors for the data labels on the graphs and charts.


    ### 5.2.5 Adapting Slicers


    The background color of the slicers remained white – now they are out of the corporate
    identity. To change this, select any slicer and go to the “Slicer” menu tab (in
    older versions of Excel, this is the “Options” tab). In the section “Slicer Styles,”
    right-click the first style in the list and select the “Edit” button.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figl_HTML.png)


    An Excel sheet displays the background color of the slicers. In this screen''s
    slicer menu, the first slicer style in the list is highlighted and the modify
    option is chosen.


    In the window that opens, select the “Whole Slicer” and click the “Format” button.
    In the new window, on the “Fill” tab, we set a pale yellow background color.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figm_HTML.png)


    A screenshot illustrates the format slicer element which includes the font, border,
    fill-with-fill effect, and more colors.


    The changed style is automatically applied to the rest of the slicers. We have
    removed these service elements from the white background and brought them into
    line with the corporate identity.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Fign_HTML.png)


    A set of three example slicers (titled: divisions, expense item and month). It
    is displayed below with their corresponding listings in the line of corporate
    identity.


    ### 5.2.6 Finishing Touches and Presentation Mode


    The last touch remained – the company’s logo on the dashboard. There is a special
    place for it in the upper left corner of the screen, above the slicers. I use
    the logo from the same PowerPoint presentation, but you can also upload a separate
    image.


    This completes the creation of an interactive dashboard in the corporate style.
    If you have saved the “standard” version, now you can compare how much the result
    has changed.


    To enhance the effect, it remains to prepare a “Presenter Mode,” especially if
    you will show the dashboard on a large screen.


    PowerPoint has a slideshow mode, and many BI systems also have a full-screen demo
    mode. There is no such function in Excel, but as always, we will assemble it from
    improvised means:


    *   On the “View” tab, uncheck the box next to the “Formula Bar” item.


    *   We do the same in the “Headings” checkbox to remove row numbers and column
    letters, which means to increase the scale of the dashboard by another 5–10%.


    *   Double-click the title of any of the menu items or on the “Collapse ribbon”
    arrow to hide the ribbon.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figo_HTML.png)


    A window screen displays the presentation mode. The checkbox adjacent to the formula
    bar is unchecked on the view tab. The collapse ribbon option is marked with an
    arrow in the right top corner of the screen.


    Such a dashboard no longer needs to be inserted with a screenshot into the presentation:
    now it is itself a beautiful interactive presentation.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figp_HTML.png)


    A window displays the B I institute of business intelligence page with graphs
    and charts on wage fund analysis. It displays the dashboard with a new interactive
    presentation.


    ### 5.2.7 Summary


    In order for the dashboard to match the brand book, it is not enough to apply
    a “corporate” theme to it. New colors can reduce contrast, new fonts can distort
    the layout.


    For a professional result, check your work according to the checklist items from
    Part 4.5\. And do not forget about the elements of corporate identity.


    *   The background color is correctly distributed throughout the panel: there
    are no white spots between the diagrams.


    *   The standard font of titles and inscriptions (including in cards) has changed
