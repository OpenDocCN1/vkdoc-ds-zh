- fmt: '# 3.4 Designing Bar Charts


    Data labels, format and bit depth, removal of the axis and gridlines on the diagram,
    legend, extra buttons, name – all this is relevant for setting up any visual element,
    not just for the graph.


    But in the charts on our dashboard, there is an element that is not on the graph
    – these are columns. Formally, “Expenses by divisions” and “Expenses by items”
    are different types of visualization:


    - With vertical columns – column chart

    - With horizontal columns – a bar chart


    Both can be called bar charts. They have the same setup principles, except for
    one nuance.


    To make it easier to perceive and compare information, we will adjust the distance
    between the columns and set their sorting so that the best and worst indicators
    are visible immediately.


    In this part, I will illustrate the actions on already configured diagrams so
    that unnecessary elements do not distract your attention. You will add these settings
    later, using a special checklist at the end of the part.


    ## 3.4.1 Distance Between Columns


    By default, an emptiness has formed between the columns with the target and the
    actual. We also need these indicators to look like a single element for each division.
    To do this, “glue” the columns.


    By clicking the mouse, select any row of columns ➤ open the context menu ➤ select
    the item “Format Data Series …”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figam_HTML.jpg)


    A snippet consists of a bar graph under a box depicting the data on the values
    based on expenses by divisions. `Format Data Series` is selected from the dialog
    box.


    In the panel that opens on the right, in the “Series Options” section, we configure
    the values:


    - “Series overlap” – 0%

    - “Gap width” – 50%


    Now the columns with target and actual values for each division look like single
    elements, and this helps to focus on the difference between them.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figan_HTML.jpg)


    A snippet consists of a bar graph depicting data based on expenses by divisions
    on the left and a chart of format data series on right with the series options.


    ## 3.4.2 Sorting Columns in Descending Order


    It is always easier to perceive ordered values. So that the user’s eyes do not
    rush between columns of different heights, but consistently go from larger to
    smaller, we will set up sorting.


    *The order of columns in the chart depends on the sequence of rows in the pivot
    table. The dynamics chart is built according to the name of the month – they were
    immediately ordered correctly. And in the samples for the other two visual elements,
    you need to adjust this sorting in the “Actual” field from a larger number to
    a smaller one.*


    There are two ways to sort columns on a column chart.


    **Solution 1: on the diagram.** We select a column in the diagram “Expenses by
    division.” Since we want to compare divisions primarily by actual results, we
    select “Actual” columns. Right-click on the context menu and select “Sort” ➤ “Sort
    Largest to Smallest” in it.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figao_HTML.jpg)


    A snippet with a bar graph is displayed under a box depicting data on expenses
    by divisions along with a dialog box for sorting elements from largest to smallest.


    **Solution 2: in the pivot table.** On the “Draft” sheet, put the cursor in the
    cell of the “Expenses by division” sample. Right-click on the context menu, select
    “Sort” ➤ “Sort Largest to Smallest.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figap_HTML.jpg)


    A snippet depicts two columns namely row labels and the target with contained
    data along with the grand total and a dialog box to sort elements from largest
    to smallest.


    The order of the chart columns on the “Dashboard” sheet will change automatically
    and will take a logical form for human perception.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaq_HTML.jpg)


    A bar graph depicts the data on expenses with the values of target and actual
    for the production workers, company management, commercial employees, and logistics
    and services.


    *Tip!*


    *I sort data, adjust the format and bit depth of the numbers immediately after
    creating the pivot table. This helps not to come back to this later when designing
    the diagram.*


    ## 3.4.3 Sorting Columns on a Bar Chart


    With a bar chart, everything is not so simple: Excel builds data categories in
    reverse order by default.


    Even if you set the table to sort “In descending order,” as we did with the column
    chart, the categories will line up exactly the opposite on the chart.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figar_HTML.jpg)


    A horizontal bar graph depicts the data on target and actual expenses by the items
    namely civil contracts, vacation reserve, extra-budgetary funds, bonus, and salary.


    To fix this, you need to set up reverse sorting in the data sample – “Sort smallest
    to Largest.” Then (oh what a miracle!) on the bar chart, they will rise in descending
    order. I will not dwell on the reasons for such a construction, just accept it
    – Excel is such an Excel…


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figas_HTML.jpg)


    A snippet of three columns namely row label, target, and actual is given with
    the data values of different labels. In the last row, the grand total is given.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figat_HTML.gif)


    A horizontal bar graph depicts the values of the target and actual expenses by
    items namely salary, bonus, extra-budgetary funds, vacation reserved, and civil
    contracts.


    The same thing happens with the order of the “Target” and “Actual” columns. In
    the diagram, both in the legend and in the columns, the “Target” comes first.
    And only in the bar chart, the “Actual” comes first. Let’s fix this by adjusting
    the axis format.


    Select the categories on the Y-axis with the right mouse button and select “Axis
    Format” in the context menu.


    In the panel that appears, in the “Format Axis…” section, specify the following:


    - In the “Horizontal axis crosses” group, select “At maximum category.”

    - In the “Display units” group, check the “Categories in reverse order.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figau_HTML.png)


    A snippet named `Format axis` with axis options and text options is displayed
    in which under text option, `Automatically select based on data` radio button
    is selected from axis options.


    These parameters will automatically arrange the rows according to the sequence
    of fields in the sample and we will not have to do anything extra.


    I recommend that you always choose the second method to configure the bar chart.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figav_HTML.jpg)


    A horizontal bar graph depicts the data on target and actual expense by items
    namely salary, bonus, extra-budgetary funds, vacation reserve, and civil contracts.


    ## 3.4.4 Chart Design Checklist


    Let’s work out the design peculiarities on the “Expenses by division” chart: configure
    this visual element with a short checklist.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaw_HTML.jpg)


    A bar graph depicts the data on the target and actual expense by divisions namely
    production workers, company management, commercial employees, and logistics and
    service.


    1.  Add labels of data, select 12 pt font for them.

    2.  Change the bit depth of the numbers to thousand or million, so that there
    are 3–4 characters left in the labels.

    3.  Remove the scale and gridlines.

    4.  Color the data labels in the color of the row (a tone darker), do not add
    a background for the labels.

    5.  Hide the buttons of the pivot table fields.

    6.  Place the legend on top (sometimes on the left).

    7.  Remove automatic labels from the legend.

    8.  Add the title of the chart, select 16 pt font for it.

    9.  Reduce the gap width between the chart columns by up to 50%.

    10.  Adjust the sorting of columns from larger to smaller.'
  raw: '## 3.4 Designing Bar Charts


    Data labels, format and bit depth, removal of the axis and gridlines on the diagram,
    legend, extra buttons, name – all this is relevant for setting up any visual element,
    not just for the graph.


    But in the charts on our dashboard, there is an element that is not on the graph
    – these are columns. Formally, “Expenses by divisions” and “Expenses by items”
    are different types of visualization


    *   With vertical columns – column chart


    *   With horizontal columns – a bar chart


    Both can be called bar charts. They have the same setup principles, except for
    one nuance.


    To make it easier to perceive and compare information, we will adjust the distance
    between the columns and set their sorting so that the best and worst indicators
    are visible immediately.


    In this part, I will illustrate the actions on already configured diagrams so
    that unnecessary elements do not distract your attention. You will add these settings
    later, using a special checklist at the end of the part.


    ### 3.4.1 Distance Between Columns


    By default, an emptiness has formed between the columns with the target and the
    actual. We also need these indicators to look like a single element for each division.
    To do this, “glue” the columns.


    By clicking the mouse, select any row of columns ➤ open the context menu ➤ select
    the item “Format Data Series …”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figam_HTML.jpg)


    A snippet consists of a bar graph under a box depicting the data on the values
    based on expenses by divisions. Format Data Series is selected from the dialog
    box.


    In the panel that opens on the right, in the “Series Options” section, we configure
    the values:


    *   “Series overlap” – 0%


    *   “Gap width” – 50%


    Now the columns with target and actual values for each division look like single
    elements, and this helps to focus on the difference between them.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figan_HTML.jpg)


    A snippet consists of a bar graph depicting data based on expenses by divisions
    on the left and a chart of format data series on right with the series options.


    ### 3.4.2 Sorting Columns in Descending Order


    It is always easier to perceive ordered values. So that the user’s eyes do not
    rush between columns of different heights, but consistently go from larger to
    smaller, we will set up sorting.


