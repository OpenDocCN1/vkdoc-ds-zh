    1.  Selected contrasting colors for “Target” and “Actual” parameters, so that
    they are not associated with deviation colors. I chose blue and brown.


    2.  Chose the lightest shade of the palette - light brown – for cards and slicers.


    3.  Changed the headlines color from black to dark brown so that they do not attract
    attention.


    4.  Selected a harmonious shade of brown for heading dividers.


    5.  Reset the data labels a shade darker than that of the columns and lines.


    The result is a dashboard in a calmer color scheme with an emphasis on data made
    through the contrast of “Target” and “Actual.”


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaq_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    ### 4.4.4 Working with Fonts: Important Points


    If you want to “play with fonts” like a real designer, you can also do this in
    “Page Layout” tab in “Themes” section: there are more than 25 options in the drop-down
    list.


    It may seem that fonts present no difficulty. However, they affect both the appearance
    and the overall perception of the dashboard.


    Please note: the font changes automatically on all elements of the dashboard,
    except the labels and indicators in KPI cards. Microsoft failed to get even these
    small things right. You will have to change the font in the cards manually. These
    small things distinguish professional performance from amateur work.


    Fonts for inscriptions and titles can be different. It is important that the caption
    should have the “cleanest” font, without serifs and other decorations.


    Another important rule is to use the same font size for data labels and inscriptions
    on all charts and graphs. If we chose 12 for a graph with expenditure dynamics,
    it should remain the same for all visual elements.


    ***Tip!***


    *Avoid fonts with bold lettering, serifs, high letter density, or small letter
    spacing. The font should not attract too much attention. It is better to choose
    traditional Arial, Calibri, or Tahoma.*


    By and large, if you are not satisfied with the fonts already on the dashboard,
    I recommend going straight to the theme selection in the same menu.'
  trans: '

    # 4.4 在 Excel 中处理颜色与字体


    在开发仪表盘的草稿版本时，我们使用了标准的 Excel 主题。它有其优点：无需花费太多时间，而且蓝色和橙色之间能形成良好的对比。


    缺点也同样存在：这种仪表盘看起来不够原创，更谈不上高级。我们将它作为草稿版本，并继续进行高级设计。我们的任务是创建一个在视觉上不同于标准 Excel 风格的仪表盘。


    让我们首先研究一下程序提供的工具。它们之间有何不同？我们又该如何选择合适的工具？


    用于设置“最终”参数的工具：


    -   **调色板** – 这些是能相互很好搭配的颜色集合（按 MS Office 创作者的说法）。

    -   **字体** – 任何选择都会更改仪表盘上所有元素的字体。

    -   **主题** – 每个主题都包含一组“和谐”的颜色以及一组字体。


    所有这些都可以在 `页面布局` 菜单选项卡的 `主题` 部分中找到。


    ![](img/537732_1_En_4_Figak_HTML.png)


    截图展示了在页面布局下，选中主题、颜色、字体和效果选项时的 Excel 文件。


    ## 4.4.1 如何处理调色板


    这个选项适用于你对仪表盘上的字体和字号感到满意，但仍需避免使用标准颜色设计的情况。


    单击 `颜色` 按钮可以查看所有可用选项 – 下拉列表中有超过 20 种组合。将鼠标悬停在调色板上，就能看到每种组合在仪表盘上的效果。


    ![](img/537732_1_En_4_Figal_HTML.png)


    截图展示了一个颜色对话框，列出了 Office 下的选项，并包含一系列不同的颜色样式。


    ## 4.4.2 不成功的相似调色板


    在这些选项中，有许多是单色、缺乏对比的组合。它们无法突出数据，会使仪表盘变成一块单色画布，我不建议使用它们。以下是几种此类调色板。


    ![](img/537732_1_En_4_Figam_HTML.png)


    截图展示了蓝色暖色、绿色、黄色、红紫色等几种调色板，颜色样式各不相同。


    另一个缺点是缺少用于可视化偏差的颜色集合。我们使用红色来聚焦负面指标，使用绿色来聚焦正面指标，而黄色有助于标记接近临界值的数值。Excel 中缺乏对比度的调色板通常只包含其中一两种颜色。


    这就是使用 `红色和紫色` 调色板时仪表盘的效果。


    ![](img/537732_1_En_4_Figan_HTML.jpg)


    截图展示了工资基金分析，包含三个图表（付款动态、各部门费用、各项费用），以及部门、月份和费用项目字段，采用浅色主题。


    在这种颜色搭配中，没有任何东西能吸引眼球：没有视觉重点。即使是 `目标` 和 `实际` 之间也没有区别，尽管它们之间应该形成清晰的对比。任何图表的目的都是为了简化比较并使其可视化。


    ## 4.4.3 合适的调色板


    Excel 中也存在好的调色板。通过引入一些小的改进，完全有可能设计出像样的仪表盘。以下是一些示例。


    ![](img/537732_1_En_4_Figao_HTML.png)


    截图展示了一个表格，包含四列：Median、Marquee、Slipstream 和 Aspect，以及不同的调色板。


    这些调色板已经更加均衡，并且包含一套颜色来聚焦偏差，提供了多种组合以达到所需的对比度。


    在选择调色板时，你不必选择 Excel 能自动为所有元素上色的选项。所有元素都可以修改：你可以更改卡片、切片器、图表柱形和线条的颜色。选择所需元素，然后使用功能区主选项卡中的
    `填充颜色` 按钮或右键菜单中的相应选项。


    举例来说，我将重点介绍 `Aspect` 调色板。它存在以下几个缺点，如下所列：


    -   背景卡片颜色，虽然不鲜艳，但仍与文本冲突。

    -   目标和实际指标之间的对比度不足，这些类别的数据标签几乎不可见。

    -   `实际` 柱形是红色的，这会被视为偏差和负面指标。


    ![](img/537732_1_En_4_Figap_HTML.jpg)


    截图展示了工资基金分析，包含三个图表（付款动态、各部门费用、各项费用），以及部门、月份和费用项目字段，采用深色主题。


    让我们尝试编辑原始版本，绕开它的这些缺点。以下是我所做的操作。


    1. 为 `目标` 和 `实际` 参数选择了对比色，使它们不与偏差颜色关联。我选择了蓝色和棕色。

    2. 为卡片和切片器选择了调色板中最浅的色调 - 浅棕色。

    3. 将标题颜色从黑色改为深棕色，使其不引人注目。

    4. 为标题分隔线选择了一种和谐的棕色色调。

    5. 将数据标签重置为比柱形和线条稍暗的色调。


    结果是一个配色更柔和的仪表盘，通过 `目标` 和 `实际` 之间的对比来突出数据。


    ![](img/537732_1_En_4_Figaq_HTML.jpg)


    截图展示了工资基金分析，包含三个图表（付款动态、各部门费用、各项费用），以及部门、月份和费用项目字段，采用深色主题。


    ## 4.4.4 处理字体：要点


    如果你想像真正的设计师一样“玩弄字体”，你也可以在 `页面布局` 选项卡的 `主题` 部分进行设置：下拉列表中有超过 25 个选项。


    字体似乎没什么难度。然而，它们既影响仪表盘的外观，也影响其整体观感。


    请注意：字体会在仪表盘的所有元素上自动更改，但 KPI 卡片中的标签和指标除外。微软连这些细节都没处理好。你将需要手动更改卡片中的字体。正是这些细微之处，区分了专业作品与业余之作。


    说明文字和标题的字体可以不同。重要的是，说明文字应使用“最干净”的字体，不带衬线和其他装饰。


    另一个重要规则是，在所有图表和图形中，数据标签和说明文字应使用相同的字体大小。如果我们在一个关于支出动态的图表中选择了 12 号字体，那么它应该对所有视觉元素保持一致。


    **提示！**


    *避免使用粗体、带衬线、高密度或小字间距的字体。字体不应吸引过多注意力。最好选择传统的 Arial、Calibri 或 Tahoma。*


    总的来说，如果你对仪表盘上已有的字体不满意，我建议直接转到同一菜单中的主题选择。

    '
- fmt: '### 4.4.5 Working with Themes


    These are design options that have preset colors and fonts. Any theme can be modified
    and worked on. Let me demonstrate how we can choose a less time-consuming option.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figar_HTML.png)


    A drop-down option under the themes. Various themes of office are listed in that
    option. Browse for themes and save the current themes options available.


    When choosing a theme, pay attention to the font of the inscriptions: in some
    Excel options, this parameter can negate all the advantages of your dashboard.
    Here is what will happen if you apply `Main Event` theme.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figas_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    I will be blunt: everything is just awful. An absolutely useless pattern, senseless
    and merciless. I hope someone at Microsoft starts hiccupping every time I see
    these options. Both the colors and the font are useless. I will try to pull myself
    together and analyze this miracle of Excel design with as little emotion as possible.


    **Technical Fault Analysis**


    - The bold font of the card headings distracts attention from the data.

    - Category labels on the histogram do not fit horizontally – they are lost due
    to the same bold font.

    - For the same reason, it is the legend that strikes the eye.

    - Black color on pink cards and – even more so – on dark red slicers – makes them
    hard to read.

    - Red color is associated with negative indicators: it feels like the company
    is `in the red`.


    To refine the theme, you can change individual colors or use a different palette.
    You can also change the font for all the elements on the dashboard. We will not
    do this with the theme `Main Event`: it will take too much time to correct its
    faults.


    **Tip!**


    *When choosing a theme, give preference to contrasting options: shades of the
    same color make information difficult to read and never give emphasis to the data
    needed.*


    **Changing colors of the elements in the theme.** Select an item and choose a
    new color in the context menu or in the main tab of the ribbon using `Fill color`
    button.


    **Changing color combination in the theme.** Select a different palette in `Page
    Layout` tab in `Colors` drop-down list. The new color combination will be automatically
    applied to all the elements on the dashboard. The font of the theme will remain
    the same.


    **Changing the theme font.** In the same menu in `Page Layout` tab, select the
    option required from the drop-down list under `Fonts` button.


    **Please note that some themes have different fonts `embedded` for text labels
    and numbers.** Their outlines are usually similar, but the thickness and density
    of the characters may vary so that the numbers remain visible and do not get lost.


    These options are included in `Badge` and `Parcel` theme.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figat_HTML.png)


    A table has two columns titled `text font-corbal` and `numbers font-gill sans
    M T` with different size alphabets and natural numbers.


    **Adapting Template Diagram to New Theme**


    By default settings, the color theme selected (as well as the palette) does not
    affect the diagram created from a template. `Expenditure by Items` chart can serve
    as an example.


    To repaint it properly, we will repeat the steps for working with the template
    from Part 3.5.


    1.  Save the customized `Expenditure by Departments` chart as a template without
    changing the path to `Save` directory.

    2.  Select `Expenditure by Items` visualization, choose `Change chart type` in
    the context menu and specify the option required in the `Templates` folder.

    3.  The template will turn a diagram into a histogram. To fix this fault, repeat
    the `Change chart type` procedure and choose the chart required from the menu.

    4.  Adjust the sorting on the bar chart so that `Target` and `Actual` stand in
    the correct order both in the columns and in the legend.


    ### 4.4.6 Summary


    In this part, we temporarily moved away from working with the dashboard to get
    acquainted with the tools Excel offers for the `final` design.


    - To select colors and fonts for the dashboard, use `Themes` section in the `Page
    Layout` menu tab.

    - If you are satisfied with the fonts on the dashboard, but still want to move
    away from the standard color design, test different palettes in `Colors` button.

    - Make sure that the palette selected has red, green, and yellow colors to accentuate
    deviations.

    - If you need to change not only the color combination but the font as well, use
    the themes in `Font` button in the same menu section.

    - Make sure that there are contrasting colors in the theme selected: they will
    help draw attention to the data.

    - If necessary, change palettes and theme colors for individual elements or the
    entire report.


    ## 4.5 Improving Standard Excel Themes


    In matters of design, there is no correct opinion, and it is often the client
    who has the final say. That is why my team always offers the customer several
    options of dashboard design: a minimalist version against a white background,
    contrasting dark, and a middle color.


    In this part, I will show how to create quick design options in Excel based on
    standard themes. We will work with the styles that customers choose most often
    – minimalist light colors and the middle color with bright accents.


    ### 4.5.1 Example 1: Primary Colors Should Be Contrasting


    Let us take theme `Facet` as an example. We have already considered the palette
    by the same name, but the theme looks completely different. The default design
    here is different shades of green.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figau_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a light color theme.


    #### Why the Theme Is Suitable


    The default result may not seem appropriate. However, if we look at the set of
    colors available and analyze the fonts, we will see that the theme can be refined.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figav_HTML.jpg)


    A screenshot depicts a theme with different color palettes in dark, light, and
    fade colors.


    - There are colors to accentuate deviations. Green, red and yellow have good saturation
    and will be visible against the background of the other colors.

    - You can choose contrasting colors for `Target` and `Actual` indicators – blue
    and brown, for example.

    - The palette available allows you to choose appropriate shades for the remaining
    dashboard elements.

    - The font of the theme is sans-serif, the lettering is normal. All the numbers
    are of the same size – they are easy to read.


    #### Analyzing Faults


    Firstly, there is no contrast in this combination of green colors: the columns
    of the target and the actual merge into one blurry shape.


    Secondly, the green color is associated with a positive result. The client might
    therefore miss the net excess of actual expenditure over the planned figures.


    Thirdly, the color brightness in the cards and slicers is close to the fill brightness
    of `Target` columns. We need to dim the background of service elements, which
    will accentuate data visualization.'
