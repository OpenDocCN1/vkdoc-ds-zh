    \ dashboard versions more suitable for the user."
  raw: '#### Fixing the Problem


    We will select light shades of green and yellow for cards and slicers so that
    they do not attract attention.


    We will assign a dim dark gray color to the titles so that they fit better into
    the new range.


    We will select a contrasting shade for “Target” columns and lines so that they
    differ from other elements. Here the shade is yellow.


    We will leave the default color green for “Actual” columns and lines.


    We will set data labels to colors a shade darker than those of the corresponding
    columns to make them more visible.


    The result is a completely different dashboard made from the same color theme
    “Facet.”


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaw_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a light color theme.


    ### 4.5.2 Example 2: Less Brightness for Service Elements


    Let us consider another option from Excel – the “Badge” theme. It provides a good
    palette, but it has default excess of yellow, and the saturated color of the slicers
    distracts attention from the data.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figax_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    #### Why the Theme Is Suitable


    The palette shows the choice of colors we need to complete the design.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figay_HTML.jpg)


    A screenshot depicts a theme with different color palettes in dark, light, and
    fade colors.


    *   There are colors to accentuate positive and negative indicators: green, red,
    and yellow.


    *   There are two options for the primary colors. The first option is “golden”
    for “Target” and olive for “Actual.” The second one is blue green for “Target”
    and purple for “Actual.” Each combination will have the right contrast.


    *   The theme has a good font – there are no serifs or decorations on the letters,
    the numbers are even and easy to read.


    #### Analyzing Faults


    You can find a few minor flaws in this theme, but I suggest we focus on its greatest
    fault. A large amount of yellow on all the elements distracts attention from the
    data – you need to try hard to locate necessary information on the dashboard.


    #### Fixing the Problem


    *   Change the color of the cards and slicers to remove the yellow saturation.
    I made them less bright, setting a universal light gray shade.


    *   Choose a different color for dividers under the chart titles from the theme
    palette. I chose light purple.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaz_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    If we change the colors for the indicators to blue-green and purple and invert
    the colors on the cards, we will have a completely different dashboard.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figba_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a light color theme.


    I mentioned that I recommend using a light background and bright dark font on
    the cards. The option with a rich fill, however, looks more original and some
    clients might like it better.


    Demand creates supply. Sometimes clients ask for “gold on black with a decorative
    pattern,” because they have never witnessed other examples of “expensive” design.
    This is also why we offer a choice of several design options.


    Working with the dashboard daily, the client understands that a black font against
    a light background is more convenient to read.


    ### 4.5.3 Example 3: The Background of the Dashboard Does Not Have to Be White


    Let us look at another option from Excel, “Parcel” theme. There is a lot of yellowness
    here too, but even in its default version “Target” and “Actual” contrast well.
    You can leave it as it is, or you can spend another half hour and exceed the customer’s
    expectations.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figbb_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    #### Why the Theme Is Suitable


    At first glance, the palette may seem too pale due to its neutral pastel shades.
    You can still create an original and functional dashboard style using these shades.
    The palette offers interesting shades – brick, olive, and gold – in place of the
    classic “traffic light” (green, yellow, and red).


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figbc_HTML.jpg)


    A screenshot depicts a theme with different color palettes in dark, light, and
    fade colors.


    #### Analyzing Faults


    The theme itself has no obvious drawbacks, but working with it, you can arrive
    at colors that are too pale or that merge with each other. If you do not trust
    your intuition to choose competent color combinations, do not take risks.


    Here, for example, the theme was an unfortunate choice for the dashboard, and
    everything turned yellow again. This is what we will fix.


    #### Fixing the Problem


    We decided to move away from the standard Excel layout – now we need to remember
    that a white background is only but an option. You can use any color as long as
    it is not too bright.


    To change the background color, I select all the cells by clicking on the triangle
    in the upper left corner of the Excel sheet, just above the row numbers. I choose
    the lightest shade of gray for the fill. The fill of the chart area will remain
    white.


    I choose light blue instead of yellow for the slicers, and this immediately makes
    our dashboard calmer. I assign dark blue to the card background to make the cards
    more visible.


    I will set the contrast between the columns and lines “Target” and “Actual” in
    other colors – brick and olive, respectively.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figbd_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    Note


    I removed the lines under the titles, which created clear boundaries between semantic
    blocks. Now this function is performed by a white background of diagrams, which
    means that additional lines are no longer needed, it is not necessary to overload
    the interface with them.


    ### 4.5.4 Summary


    We figured out how to make a quick dashboard design in different styles and offer
    a choice to the customer. We also received several new options from the usual
    design in blue and orange colors.


    *   We changed the colors in “Facet” theme and changed the merging green dashboard
    into bright green and yellow.


    *   We created two variants with “Badge” theme in different colors: calm gray
    with an emphasis on data and blue green with purple.


    *   We changed the workspace color in the “Parcel” theme and chose rich olive
    and muted brick for the main indicators.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figbe_HTML.png)


    A screenshot depicts 4 pages of wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in various color themes.


    Experiment with improving the standard themes. Do not hesitate to show the results
    to the customer: ask them to choose something and explain their choice. This will
    help make the upcoming dashboard versions more suitable for the user.'
  trans: "\n### 解决问题\n\n我们将为卡片和切片器选择浅绿色和浅黄色的色调，以免它们过于引人注目。\n\n我们将为标题指定一种暗灰色，使其能更好地融入新的配色范围。\n\
    \n我们将为`Target`（目标）列和线选择一种对比色，使其与其他元素区分开来。此处选择的对比色是黄色。\n\n我们将为`Actual`（实际）列和线保留默认的绿色。\n\
    \n我们将把数据标签的颜色设置为比对应列稍暗的色调，以便让它们更清晰可见。\n\n最终结果是，使用相同的色彩主题`Facet`，打造出了一个风格迥异的仪表板。\n\
    \n![](img/537732_1_En_4_Figaw_HTML.jpg)\n\n该截图展示了工资基金分析，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，整体采用浅色主题。\n\
    \n### 示例 2：降低服务元素的亮度\n\n让我们来看 Excel 中的另一个选项——`Badge`主题。它虽然提供了不错的调色板，但默认情况下黄色过多，并且切片器过于饱和的颜色会分散对数据的注意力。\n\
    \n![](img/537732_1_En_4_Figax_HTML.jpg)\n\n该截图展示了工资基金分析，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，整体采用深色主题。\n\
    \n#### 为何该主题适用\n\n此调色板提供了我们完成设计所需的色彩选择。\n\n![](img/537732_1_En_4_Figay_HTML.jpg)\n\
    \n该截图展示了一个包含深色、浅色和褪色多种调色板的主题。\n\n-   它有强调正面和负面指标的色彩：绿色、红色和黄色。\n-   主色有两种选择。第一种方案是`golden`（金色）用于`Target`，橄榄绿用于`Actual`。第二种方案是蓝绿色用于`Target`，紫色用于`Actual`。每种组合都具有恰当的反差。\n\
    -   主题的字体很好——字母没有衬线或装饰，数字均匀且易于阅读。\n\n#### 分析缺陷\n\n你可以在该主题中找到一些小瑕疵，但我建议我们重点关注其最大的缺陷。所有元素上大量的黄色分散了对数据的注意力——你需要在仪表板上费力地寻找所需信息。\n\
    \n#### 解决问题\n\n-   更改卡片和切片器的颜色以消除黄色的饱和度。我降低了它们的亮度，设置了一种通用的浅灰色调。\n-   从主题调色板中为图表标题下方的分隔线选择另一种颜色。我选择了浅紫色。\n\
    \n![](img/537732_1_En_4_Figaz_HTML.jpg)\n\n该截图展示了工资基金分析，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，整体采用深色主题。\n\
    \n如果我们把指标的颜色改为蓝绿色和紫色，并反转卡片上的颜色，我们将得到一个风格完全不同的仪表板。\n\n![](img/537732_1_En_4_Figba_HTML.jpg)\n\
    \n该截图展示了工资基金分析，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，整体采用浅色主题。\n\n我提到过，我建议在卡片上使用浅色背景和亮深色字体。然而，采用高饱和度填充的选项看起来更独特，有些客户可能更喜欢。\n\
    \n需求创造供给。有时客户会要求“*带有装饰图案的金色背景配黑色文字*”，因为他们从未见过其他“*高级*”设计的例子。这也是为什么我们提供多个设计方案供选择的原因。\n\
    \n随着每天使用仪表板，客户会逐渐明白，浅色背景上的黑色文字读起来更方便。\n\n### 示例 3：仪表板的背景不一定是白色\n\n让我们看看 Excel\
    \ 的另一个选项——`Parcel`主题。这里也有大量的黄色，但即使在默认版本中，`Target`和`Actual`的对比度也很好。你可以保持原样，也可以再花半小时，超越客户的预期。\n\
    \n![](img/537732_1_En_4_Figbb_HTML.jpg)\n\n该截图展示了工资基金分析，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，整体采用深色主题。\n\
    \n#### 为何该主题适用\n\n乍一看，由于其中性的柔和色调，这个调色板可能显得过于苍白。但你仍然可以使用这些色调创建出既原创又功能完备的仪表板风格。该调色板提供了有趣的色调——砖红色、橄榄绿和金色——取代了经典的“交通灯”色（绿、黄、红）。\n\
    \n![](img/537732_1_En_4_Figbc_HTML.jpg)\n\n该截图展示了一个包含深色、浅色和褪色多种调色板的主题。\n\n####\
    \ 分析缺陷\n\n该主题本身没有明显的缺点，但在使用过程中，你可能会得到过于苍白或彼此融合的颜色。如果你不信任自己的直觉去选择合理的色彩组合，那就不要冒险。\n\
    \n例如，这里该主题对于仪表板来说就不太合适，结果一切都是黄色的。这正是我们需要修复的问题。\n\n#### 解决问题\n\n我们决定摆脱标准的 Excel\
    \ 布局——现在需要记住，白色背景只是一种选择。只要不是太亮，你可以使用任何颜色。\n\n为了改变背景颜色，我通过点击 Excel 工作表左上角、行号上方的三角形来选中所有单元格。我选择最浅的灰色作为填充色。图表区域的填充色将保持白色。\n\
    \n我为切片器选择了浅蓝色而非黄色，这立即使得我们的仪表板更加沉稳。我指定深蓝色作为卡片背景，使卡片更醒目。\n\n我将设置`Target`和`Actual`的列和线使用其他颜色进行对比——分别使用砖红色和橄榄绿。\n\
    \n![](img/537732_1_En_4_Figbd_HTML.jpg)\n\n该截图展示了工资基金分析，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，整体采用深色主题。\n\
    \n> **注意**  \n> 我移除了标题下方的线条，这些线条之前创建了语义块之间的清晰边界。现在这个功能由图表的白色背景来承担，这意味着不再需要额外的线条，不必用它们来使界面过载。\n\
    \n### 总结\n\n我们弄清楚了如何以不同风格快速设计仪表板并向客户提供选择。同时，我们也从常见的蓝橙配色方案中衍生出了几种新的选项。\n\n-   我们在`Facet`主题中修改了颜色，将原本混为一体的绿色仪表板改成了亮绿色和黄色。\n\
    -   我们使用`Badge`主题创建了两种不同颜色的变体：平静的灰色（强调数据）以及蓝绿色配紫色。\n-   我们在`Parcel`主题中更改了工作区颜色，并为主要指标选择了浓郁的橄榄绿和柔和的砖红色。\n\
    \n![](img/537732_1_En_4_Figbe_HTML.png)\n\n该截图展示了工资基金分析的 4 个页面，包含 3 个图表（付款动态、按部门划分的费用及费用项目），以及部门、月份和费用项目字段，采用了多种色彩主题。\n\
    \n尝试改进标准主题。不要犹豫，向客户展示你的成果：请他们做出选择并解释原因。这将有助于使未来的仪表板版本更适合用户。\n"
- fmt: '### 4.5.5 Color Theme Adaptation Checklist


    *I suggest the following checklist to select colors on your own. The rules apply
    both to* `Excel` *and other data visualization tools.*


    1. The main colors of the palette are contrasting. There are shades of green,
    red, and yellow. Or at least two of these colors.

    2. The background of the KPI cards does not conflict with the text. Choose a black
    or dark gray font against a pale background. Sometimes a white font and rich background
    – blue, for instance – will look good too.

    3. Chart columns do not merge with each other. Choose contrasting pairs, for example,
    blue and orange. Or make one accent: bright "Actual" and gray "Target."

    4. The data labels are clearly visible. Their color should be a shade lighter
    or darker than the column or line of the graph – do not let the values get lost.

    5. The background of service elements, for example, slicers, is dimmed. Gray is
    universal. Or the lightest shade of the main theme color.

    6. Additional graphic elements (backgrounds for diagrams, titles, dividing lines)
    are paler – they should not attract too much attention.

    7. The main text in the diagrams (data labels, axes) should be uniform. The only
    exceptions are titles and cards.


    # 5. Corporate Identity


    We figured out how to offer the customer design options that differ from the standard
    one. But large companies already have an approved corporate style, and the dashboard
    must match it.


    It is not difficult to change the fonts and color of the diagrams – this will
    already bring 80% of the desired result. But the professional and the amateur
    are just distinguished by the remaining 20% of the details.


    In this part of the book, you will learn the fine-tuning of dashboard elements.
    Thanks to them, some customers do not even realize that this is an ordinary `Excel`,
    and not an expensive BI system. The business customer will appreciate such work
    much higher.


    ## 5.1 Creating a Theme in Accordance with the Brand Book


    Many companies have templates of corporate-style reports. Most often these are
    traditional presentations that already contain the right set of colors, fonts,
    and other elements, for example, a logo. But sometimes there is a corporate style,
    but there are no documents from which it can be taken yet.


    In this part, we will work with both options. First, we will learn how to create
    our own theme in `Excel` for the dashboard design. And then we use a ready-made
    template of the theme from the presentation in `PowerPoint`.


    ### 5.1.1 How to Create a Theme from Scratch


    Of course, you can manually change the color of each element on the dashboard
    and set the desired font in each of them. But it will take a long time. I will
    show you how to save this time and create a "corporate" theme in `Excel` as quickly
    as possible.


    I will demonstrate the process using the example of the brand book of the Institute
    of Business Intelligence. Here are the elements of corporate style from which
    we will form a new theme:


    - Color for light background: light yellow `#FFFCEB`

    - Color for dark background: dark brown `#1F1A1A`

    - Brand Colors: yellow `#F8C845`, brick `#CB5033`, blue `#2C4A94`, green `#008864`

    - Font: `Montserrat`


    Let’s set up these colors in `Excel`, add the desired font and save the entire
    set as a new theme.


    **Step 1.** On the "Page Layout" tab in the upper-left corner, select the "Colors"
    drop-down menu and click the "Customize Colors..." item in it. The window "Creating
    New Theme Colors" will open – in it we will build our palette.


    **Step 2.** By clicking the triangle in each line, we open the menu and select
    "More Colors..." in it. A new window opens in which we set the code of the desired
    color. Thus, we specify the colors for the dark and light background, and set
    the rest in the "Accent" lines.


    ![A screenshot illustrates how to create a theme color from scratch. It includes
    the standard and custom colors with color codes, o k, and cancel options for selecting
    the colors.](images/537732_1_En_5_Chapter/537732_1_En_5_Figa_HTML.png)


    **Step 3.** When all the colors are configured, in the "Create New Theme Colors"
    window, we give a name to our theme and click "Save."


    **Step 4.** Go to the font settings. On the menu tab "Page Layout," select "Fonts"
    ➤ "Customize Fonts...." Enter the name of the `Montserrat` font, specify the name
    of our new theme in the following line and click "Save."


    ![A screenshot illustrates how to create the new theme fonts. It includes the
    heading font, body font, and the sample with save and cancel options.](images/537732_1_En_5_Chapter/537732_1_En_5_Figb_HTML.jpg)


    **Step 5.** When the colors and fonts are configured, we save the new theme. To
    do this, on the "Page Layout" tab, click "Themes" and select "Save Current Theme...."


    ![A screenshot illustrates the page layout with different themes, effects, and
    headings. It includes the page margin, orientation, size, and print area.](images/537732_1_En_5_Chapter/537732_1_En_5_Figc_HTML.png)


    Done! A new section with custom themes has appeared in the list of available themes,
    where our "branded" one is located.'
