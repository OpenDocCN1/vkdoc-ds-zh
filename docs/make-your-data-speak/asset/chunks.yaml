- fmt: '### 3.3.2 What to Do with Automatic Labels


    The default location of the legend is not the only problem. It also has automatic
    field titles with the captions “Sum of Target” and “Sum of Actual.” They need
    to be changed to a simple and understandable “Target” and “Actual,” respectively.


    There is no “Disable sum of field” button in the chart settings itself, so we
    will change the names of these fields in the original selections on the “Draft”
    sheet. There are several ways to do this.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaa_HTML.jpg)


    A snippet of an excel sheet with three columns namely row labels, the sum of the
    target, and the sum of the actual includes data on drafts with various options.


    **Solution 1.** We put the cursor in the cell with the name of the field and remove
    the unnecessary inscription “Sum of.” If we have several samples, it won’t take
    much time.


    **Solution 2.** Double-click on the name of the field in the sample – the dialog
    box “Value Field Settings” opens. In the “Custom name” section, delete the extra
    words. In the same way, you need to edit the name of each field.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figab_HTML.jpg)


    A snippet consists of a box of value field setting along with the source name,
    a custom name with the option of sum selected, and the actual data given on left.


    When editing the field name, leave a space at the beginning or at the end to avoid
    an error:


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figac_HTML.png)


    A snippet of a pop-up of an error from Microsoft Excel reads pivot table field
    name already exists. The OK button is at the bottom.


    For visualization, this space does not play a role, but for the program there
    will be a difference with the name of the field in the pivot table.


    **Solution 3, recommended.** The text “Sum of” can also be removed using autocorrect
    – this is the fastest option.


    Being on the “Draft” sheet, on the “Home” tab in the “Editing” section, we find
    the “Find & Select” button. Select “Replace” from the drop-down list.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figad_HTML.png)


    A snippet consists of an excel sheet with 3 columns with data namely the row label,
    the sum of the target, and the sum of the actual. Find and Replace drop-down menu
    option is present on the right.


    A dialog box appears – it can also be called with the keyboard shortcut `Ctrl
    + H` (or `cmd + H`). On the “Replace” tab, we have two fields. In the first one,
    enter the words “Sum of,” and leave the second one empty and click “Replace all.”
    A window will appear with a message about the execution of the command and the
    number of changes made.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figae_HTML.jpg)


    A snippet consists of three columns namely row labels, target, and the actual
    from January to March with Find and Replace dialog box and a pop-up to confirm
    10 replacements.


    After that, the names of the fields in the legend will be updated automatically
    and become more understandable.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaf_HTML.png)


    A line graph with fluctuating curves illustrates the data on the values of the
    target and actual with the points denoting the exact data from January to June.


    ### 3.3.3 How to Delete Field Buttons


    We built a chart based on a pivot table, so Excel automatically added several
    buttons: on the chart, these are “Target,” “Actual,” “Values,” and “Month.” They
    don’t perform any useful functions on our dashboard. You can only click the “Month”
    button and open the filter, but it is more convenient to use a slicer for this.
    The buttons take away almost half of the working area of the diagram, so we will
    remove them.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figag_HTML.png)


    A line graph under a box with two fluctuating curves and points with the exact
    data depicts the data on the values of the target and actual from January to June.


    **Solution 1.** Warning: this method does not work in all versions of Excel. Select
    the button on the diagram and open the context menu with the right mouse button.
    Select “Hide All Field Buttons On Chart.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figah_HTML.jpg)


    A snippet with the columns of the sum of the target and the sum of the actual
    is given with the data and a dialog box with the option Hide All Field Buttons
    on Chart is selected.


    ***Tip!***


    *Never select the “Remove field” option, otherwise the program will delete the
    original field with the data in the pivot table.*


    **Solution 2.** Select the chart and on the menu tab “Pivot Chart Analyse” (in
    older versions of Excel this is the “Analyze” tab) you will see “Field buttons”
    on the right. In the drop-down menu under this button, check the “Hide all” item.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figai_HTML.jpg)


    A snippet consists of elements namely pivot chart analysis, design, and format
    in which Hide All option is ticked under the Field Buttons menu.


    That’s it – unnecessary elements are removed, and there is twice as much space
    for the graph itself!


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaj_HTML.png)


    A line graph with two fluctuating curves illustrates the value of the target and
    the actual with several points denoting the exact data from January to June.


    ### 3.3.4 Two Ways to Add a Chart Name


    In order for the user to immediately understand what the diagram shows, you need
    to add a meaningful title to it. If we were doing a visualization for a slide,
    then we would try to formulate a conclusion in the title right away. But we have
    a dynamic dashboard, and the content of the chart depends on filters. Therefore,
    we will briefly indicate the keywords in the title.


    **Solution 1.** On the “Design” tab, click on the “Add Chart Element” button on
    the left. In the drop-down list, select “Chart Title” ➤ “Above Chart.” A field
    will appear on the chart in which you need to enter the name of our schedule –
    “Payments dynamics.”


    **Solution 2.** Click on the cross to the right of the selected chart and tick
    the box “Chart Title” – as in the first method, a header field will appear.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figak_HTML.png)


    A line graph with two fluctuating curves illustrates the value of the target and
    the actual with several points denoting the exact data from January to June. Add
    Chart Element menu is selected.


    Placing the title in the center with an overlay would help to increase the working
    area of the graph. But this option is only suitable for static slides if the line
    or column does not overlap the title. On the dynamic dashboard, we select the
    option “Above the chart” so that such an overlap does not occur when changing
    or filtering data.


    It remains to set the font size for the chart title: it should be larger than
    the labels and legend: from 14 to 18, depending on the free space. To do this,
    select the block with the title and set the desired value on the main menu tab
    in the Font section – I chose size 16.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figal_HTML.png)


    A line graph with two fluctuating curves illustrates the value of the target and
    the actual with several points denoting the exact data from January to June.


    ### 3.3.5 Summary


    The diagram should have a minimum of text – only what helps the user to easily
    read and understand the information. To solve this problem, we have performed
    several actions:


    *   We have set up the location of the legend above the diagram so that the content
    of the graph is immediately clear.

    *   Removed the “automatic” labels from the legend by changing the names of the
    fields in the pivot table.

    *   The useless field buttons inherited from the pivot table were removed from
    the chart area.

    *   Gave the graph a clear title and placed it on top.

    *   Increased the font size for the chart title to 16.'
