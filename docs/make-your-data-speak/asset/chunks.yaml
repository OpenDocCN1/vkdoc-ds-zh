  trans: '

    ### 4.5.5 色彩主题适配检查清单


    *我建议遵循以下清单自行选择颜色。这些规则既适用于* `Excel` *，也适用于其他数据可视化工具。*


    1.  色板的主色调具有对比性。可以使用绿色、红色和黄色的渐变色调，或者至少包含其中两种颜色。

    2.  KPI 卡片的背景不与文字冲突。在浅色背景上选择黑色或深灰色字体。有时，白色字体搭配深色背景（例如蓝色）效果也不错。

    3.  图表中的柱状图彼此不重叠。选择对比色对，例如蓝色和橙色。或者只突出一个重点：用明亮的“实际值”和灰色的“目标值”。

    4.  数据标签清晰可见。其颜色应比图表的柱形或折线稍浅或稍深——不要让数值难以辨认。

    5.  辅助元素（例如切片器）的背景应暗淡。灰色是通用选择，或者使用主色调中最浅的颜色。

    6.  附加图形元素（如图表背景、标题、分隔线）颜色应更淡——它们不应吸引过多注意力。

    7.  图表中的主要文字（如数据标签、坐标轴）应保持统一。标题和卡片除外。


    # 5. 企业形象


    我们已经了解了如何向客户提供不同于标准版的设计方案。但大型公司通常已有批准的企业风格，仪表板必须与之匹配。


    更改图表的字体和颜色并不困难——这已经能带来 80%的预期效果。但专业人士与业余爱好者的区别恰恰在于剩下的 20%的细节。


    在本章中，您将学习仪表板元素的微调。得益于这些细节，有些客户甚至没有意识到这只是一个普通的 `Excel`，而不是昂贵的 BI 系统。商业客户会对此类工作给予更高的评价。


    ## 5.1 根据品牌手册创建主题


    许多公司都有企业风格报告的模板。最常见的是传统的演示文稿，其中已包含正确的颜色、字体和其他元素（例如徽标）。但有时，公司有企业风格，却还没有可以提取这些元素的文档。


    在本部分，我们将处理这两种情况。首先，我们将学习如何在 `Excel` 中为仪表板设计创建自己的主题。然后，我们使用来自 `PowerPoint` 演示文稿的现成主题模板。


    ### 5.1.1 如何从头创建主题


    当然，您可以手动更改仪表板上每个元素的颜色，并为每个元素设置所需的字体。但这会花费很长时间。我将向您展示如何节省时间，并尽可能快速地在 `Excel` 中创建一个“企业”主题。


    我将以商业智能研究所的品牌手册为例来演示这一过程。以下是构成新主题的企业风格元素：


    -   浅色背景颜色：浅黄色 `#FFFCEB`

    -   深色背景颜色：深棕色 `#1F1A1A`

    -   品牌颜色：黄色 `#F8C845`，砖红色 `#CB5033`，蓝色 `#2C4A94`，绿色 `#008864`

    -   字体：`Montserrat`


    让我们在 `Excel` 中设置这些颜色，添加所需的字体，并将整个集合保存为一个新主题。


    **第 1 步。** 在左上角的“页面布局”选项卡中，选择“颜色”下拉菜单，并点击其中的“自定义颜色...”项。将打开“新建主题颜色”窗口——我们将在此窗口中构建调色板。


    **第 2 步。** 点击每一行中的三角形，打开菜单并选择其中的“其他颜色...”。将打开一个新窗口，我们在此设置所需颜色的代码。这样，我们指定了深色和浅色背景的颜色，并在“强调文字颜色”行中设置其余颜色。


    ![屏幕截图展示了如何从头创建主题颜色。它包含了标准色和自定义色及其颜色代码，以及用于选择颜色的“确定”和“取消”选项。](img/537732_1_En_5_Figa_HTML.png)


    **第 3 步。** 所有颜色配置完成后，在“新建主题颜色”窗口中，为我们的主题命名，然后点击“保存”。


    **第 4 步。** 进入字体设置。在“页面布局”菜单选项卡中，选择“字体” ➤ “自定义字体...”。输入 `Montserrat` 字体的名称，在下一行指定我们新主题的名称，然后点击“保存”。


    ![屏幕截图展示了如何创建新的主题字体。它包括标题字体、正文字体，以及带有“保存”和“取消”选项的示例。](img/537732_1_En_5_Figb_HTML.jpg)


    **第 5 步。** 颜色和字体配置完成后，保存新主题。为此，在“页面布局”选项卡上，点击“主题”，然后选择“保存当前主题...”。


    ![屏幕截图展示了包含不同主题、效果和标题的页面布局。它还包括页边距、纸张方向、纸张大小和打印区域。](img/537732_1_En_5_Figc_HTML.png)


    完成！在可用主题列表中，出现了一个新的“自定义主题”部分，其中包含我们的“品牌”主题。

    '
- fmt: '### 5.1.2 Life Hack: Importing a Ready-made Theme from PowerPoint


    This part is useful for cases when the company already has templates of corporate-style
    presentations. They can be used for an interactive dashboard in Excel.


    I will show you how to do this using the example of the presentation of the Institute
    of Business Intelligence: it already has the right set of colors and approved
    fonts of the company. According to the same scheme, you can use the dashboard
    design of your organization.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figd_HTML.png)


    A presentation from the Institute of Business Intelligence is visible in a PowerPoint
    window. It features the company''s approved fonts and appropriately chosen colors.
    The screen is set to a light theme.


    A corporate theme from PowerPoint, by analogy with a diagram template, can be
    saved on your computer and then used in Excel.


    **Step 1.** Open the presentation, open the `Design` menu tab, open the drop-down
    list in the `Themes` section and select the `Save current theme` option.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Fige_HTML.png)


    A screenshot illustrates the design menu tab in which the themes section is displayed
    with different fonts and themes, with saving and browse options in the left corner.


    In the dialog box that opens, specify the name of the file, select the folder
    to save the theme and click `Save`.


    **Step 2.** In an Excel workbook, on a sheet with a new version of our dashboard,
    go to the `Page Layout` menu tab, click `Themes` and after the list with icons
    of topics, we find the `Browse for Theme...` button.


    In the window that opens, `Choose Theme or Themed Document`, go to the folder
    with the desired file, select it and click `Open`.


    Done! The theme from PowerPoint was automatically applied to the entire Excel
    workbook. You can check this by looking at the available colors: they must match
    the palette in the presentation.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figf_HTML.png)


    A window screen uses the company''s font, Montserrat. It includes graphs of expenses
    by division and item, as well as pay fund analysis with lists of divisions and
    items on the side, in addition to the color palette above.


    The Montserrat corporate font is wider than the standard one, so the inscriptions
    on the `Expenses by divisions` diagram are located at an angle. I just increased
    the size of the chart so that they become horizontal again. If this didn’t help
    you, you will have to reduce the font of the inscriptions to 11.


    Here again we encounter a flaw in Excel: the font has changed on all elements
    of the dashboard, except for the KPI cards. It will have to be changed manually.


    As with the built-in color themes in Excel, the new style is not automatically
    applied to a chart created from a template.


    It annoys me a little when one visual element gets out of the general row, so
    I save and use a new template every time the color changes. Just like we did in
    Part 3.5, using the `Change chart type` option. After that, we see what the new
    default theme will look like.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figg_HTML.png)


    A window screen displays a new theme in charts and lines. It displays graphical
    charts on payment dynamics and expenses by divisions and items. Different colors
    are used to differentiate the chart columns.


    ### 5.1.3 Verification on the Checklist and Points for Improvement


    To bring the new theme in line with the corporate identity, let’s check the design
    according to the checklist from the last part. And at the same time, we will add
    a few more points that we will have to work on.


    | 1 | The palette contains a contrasting set of colors, there are shades for the
    `traffic light` | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figan_HTML.gif)
    A tick mark. | With this, the theme is in full order |

    | 2 | The background of the KPI cards does not conflict with the text | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figao_HTML.gif)
    A tick mark. | Black font on a light background is easy to read |

    | 3 | Chart columns do not merge with each other | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figap_HTML.gif)
    A cross mark. | Lost contrast on new backgrounds |

    | 4 | Data labels are clearly visible | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figaq_HTML.gif)
    A cross mark. | Poorly distinguishable on a new background |

    | 5 | Background of service elements is muted | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figar_HTML.gif)
    A tick mark. | Corresponds to the palette of corporate identity |

    | 6 | The underlays of the diagrams are not conspicuous | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figas_HTML.gif)
    A tick mark. | Pale color does not distract attention |

    | 7 | Font and color of data and axes are the same | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figat_HTML.gif)
    A tick mark. | Now here is the Montserrat font |

    | 8 | Dashboard background in corporate style | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figau_HTML.gif)
    A cross mark. | There are white spots between the diagrams and on the slicers
    |

    | 9 | KPI cards and indicators on them remained noticeable | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figav_HTML.gif)
    A cross mark. | Do not stand out from the general background |

    | 10 | The font of all inscriptions corresponds to the corporate | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figaw_HTML.gif)
    A cross mark. | Not changed automatically for all elements |


    ### 5.1.4 Summary


    There are different ways to design a dashboard in a corporate style. We have reviewed
    the ones that will help you do this quickly: creating a theme in Excel from scratch
    and importing a theme from a PowerPoint presentation.


    After applying the new theme to the dashboard in Excel, it is important to understand
    what needs to be improved and corrected. That’s what needs to be finalized in
    our case.


    - Restore contrast between chart columns and graph lines.

    - Pick new colors for the data labels so that they are clearly visible against
    the pale yellow background of the charts.

    - Tidy up the new background of the dashboard so that there are no white spots
    on it.

    - Make KPI cards and indicators on them more noticeable so that they do not merge
    with the background.

    - Change the font in the cards to that approved in corporate style, because it
    has not changed automatically.


    **Download the theme in the corporate style**


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figax_HTML.gif) A photo of a bar
    code.


    ## 5.2 Adapting the Theme According to the Checklist


    Many complain: you learn to create dashboards, but bosses still require presentations.
    We have to get out of it, and it doesn’t always work out fine.


    Someone inserts individual diagrams, and the format falls off on the slide. Someone
    adds screenshots and moves them for hours so that everything is smooth. And if
    the data has been updated, everything has to be redone manually...


    This part is so that you don’t waste time and effort on turning a dashboard into
    slides. We will make it so that it will replace any presentation, only it will
    also be interactive.


    To get such a result, we need to correct the shortcomings that appeared due to
    the use of the theme in the corporate style. Some elements “faded” and became
    difficult to distinguish, others lost the necessary contrast. In this part, we
    will correct everything that did not fit with our checklist, as well as get rid
    of new shortcomings and bring the dashboard into full compliance with the corporate
    identity.'
  raw: '### 5.1.2 Life Hack: Importing a Ready-made Theme from PowerPoint


    This part is useful for cases when the company already has templates of corporate-style
    presentations. They can be used for an interactive dashboard in Excel.


    I will show you how to do this using the example of the presentation of the Institute
    of Business Intelligence: it already has the right set of colors and approved
    fonts of the company. According to the same scheme, you can use the dashboard
    design of your organization.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figd_HTML.png)


    A presentation from the Institute of Business Intelligence is visible in a PowerPoint
    window. It features the company''s approved fonts and appropriately chosen colors.
    The screen is set to a light theme.


    A corporate theme from PowerPoint, by analogy with a diagram template, can be
    saved on your computer and then used in Excel.


    **Step 1.** Open the presentation, open the “Design” menu tab, open the drop-down
    list in the “Themes” section and select the “Save current theme” option.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Fige_HTML.png)


    A screenshot illustrates the design menu tab in which the themes section is displayed
    with different fonts and themes, with saving and browse options in the left corner.


    In the dialog box that opens, specify the name of the file, select the folder
    to save the theme and click “Save.”


    **Step 2.** In an Excel workbook, on a sheet with a new version of our dashboard,
    go to the “Page Layout” menu tab, click “Themes” and after the list with icons
    of topics, we find the “Browse for Theme…” button.


    In the window that opens, “Choose Theme or Themed Document,” go to the folder
    with the desired file, select it and click “Open.”


    Done! The theme from PowerPoint was automatically applied to the entire Excel
    workbook. You can check this by looking at the available colors: they must match
    the palette in the presentation.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figf_HTML.png)


    A window screen uses the company''s font, Montserrat. It includes graphs of expenses
    by division and item, as well as pay fund analysis with lists of divisions and
    items on the side, in addition to the color palette above.


    The Montserrat corporate font is wider than the standard one, so the inscriptions
    on the “Expenses by divisions” diagram are located at an angle. I just increased
    the size of the chart so that they become horizontal again. If this didn’t help
    you, you will have to reduce the font of the inscriptions to 11.


    Here again we encounter a flaw in Excel: the font has changed on all elements
    of the dashboard, except for the KPI cards. It will have to be changed manually.


    As with the built-in color themes in Excel, the new style is not automatically
    applied to a chart created from a template.


    It annoys me a little when one visual element gets out of the general row, so
    I save and use a new template every time the color changes. Just like we did in
    Part 3.5, using the “Change chart type” option. After that, we see what the new
    default theme will look like.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figg_HTML.png)


    A window screen displays a new theme in charts and lines. It displays graphical
