  trans: '

    ### 3.3.2 如何处理自动标签


    图例的默认位置并非唯一的问题。图表中还存在带有“Target 求和项”和“Actual 求和项”标题的自动字段标签。需要将它们分别更改为简单易懂的“Target”和“Actual”。


    图表设置中本身没有“禁用字段求和”按钮，因此我们将在“草稿”工作表的原始选择中更改这些字段的名称。有几种方法可以实现。


    ![](img/537732_1_En_3_Figaa_HTML.jpg)


    一个 Excel 表格片段，包含三列，分别是行标签、Target 求和项和 Actual 求和项，其中包含关于不同选项的草稿数据。


    **解决方案 1.** 将光标放在字段名称的单元格中，删除多余的“求和项”字样。如果我们有多个样本，这不会花费太多时间。


    **解决方案 2.** 双击样本中的字段名称 – 将打开“值字段设置”对话框。在“自定义名称”部分，删除多余的词语。同样地，你需要编辑每个字段的名称。


    ![](img/537732_1_En_3_Figab_HTML.jpg)


    一个片段包含值字段设置对话框，以及源名称、选择了求和的选项的自定义名称，以及左侧给出的实际数据。


    编辑字段名称时，在开头或末尾留一个空格以避免错误：


    ![](img/537732_1_En_3_Figac_HTML.png)


    Microsoft Excel 错误弹窗的片段，显示数据透视表字段名称已存在。底部是“确定”按钮。


    对于可视化来说，这个空格不起作用，但对程序而言，这将与数据透视表中的字段名称有所区别。


    **解决方案 3，推荐使用。** 也可以使用自动更正功能删除文本“求和项” – 这是最快的选项。


    在“草稿”工作表中，找到“开始”选项卡“编辑”部分中的“查找和选择”按钮。从下拉列表中选择“替换”。


    ![](img/537732_1_En_3_Figad_HTML.png)


    一个片段包含一个 Excel 表格，有三列数据，分别是行标签、Target 求和项和 Actual 求和项。右侧提供了“查找和替换”下拉菜单选项。


    将出现一个对话框 – 也可以使用键盘快捷键 `Ctrl + H`（或 `cmd + H`）调出。在“替换”选项卡上，有两个字段。在第一个字段中输入“求和项”，第二个字段留空，然后单击“全部替换”。将出现一个窗口，显示命令已执行以及所做的更改次数。


    ![](img/537732_1_En_3_Figae_HTML.jpg)


    一个片段包含三列，分别是行标签、Target 和 Actual（一月至三月），以及“查找和替换”对话框和一个确认 10 次替换的弹出窗口。


    之后，图例中的字段名称将自动更新，变得更加易于理解。


    ![](img/537732_1_En_3_Figaf_HTML.png)


    一个带有波动曲线的折线图，展示了 Target 和 Actual 的值数据，并用点表示一月至六月的具体数值。


    ### 3.3.3 如何删除字段按钮


    我们是基于数据透视表构建的图表，因此 Excel 会自动添加几个按钮：在图表上，这些是“Target”、“Actual”、“值”和“Month”。它们在我们的仪表板上没有任何有用的功能。你只能点击“Month”按钮打开筛选器，但使用切片器更方便。这些按钮占用了图表近一半的工作区域，因此我们将删除它们。


    ![](img/537732_1_En_3_Figag_HTML.png)


    一个带有波动曲线和精确数据点的折线图，描绘了一月至六月 Target 和 Actual 的值数据。


    **解决方案 1.** 警告：此方法不适用于所有版本的 Excel。选择图表上的按钮，并用鼠标右键打开上下文菜单。选择“隐藏图表上的所有字段按钮”。


    ![](img/537732_1_En_3_Figah_HTML.jpg)


    一个片段显示 Target 求和项和 Actual 求和项的列及其数据，并选中了包含“隐藏图表上的所有字段按钮”选项的对话框。


    ***提示！***


    *切勿选择“删除字段”选项，否则程序将删除数据透视表中包含数据的原始字段。*


    **解决方案 2.** 选择图表，在菜单选项卡“数据透视图分析”（在较旧版本的 Excel 中，这是“分析”选项卡）的右侧，你会看到“字段按钮”。在此按钮下的下拉菜单中，勾选“全部隐藏”项。


    ![](img/537732_1_En_3_Figai_HTML.jpg)


    一个片段包含元素“数据透视图分析”、“设计”和“格式”，其中在“字段按钮”菜单下勾选了“全部隐藏”选项。


    就这样 – 不必要的元素被移除了，图表本身的空间增加了一倍！


    ![](img/537732_1_En_3_Figaj_HTML.png)


    一个带有两条波动曲线的折线图，展示了 Target 和 Actual 的值，并用几个点标出从一月到六月的精确数据。


    ### 3.3.4 添加图表名称的两种方法


    为了让用户立刻理解图表显示的内容，你需要为其添加一个有意义的标题。如果我们是针对幻灯片进行可视化设计，那么我们会尝试直接在标题中得出结论。但我们的仪表板是动态的，图表的内容取决于筛选器。因此，我们将在标题中简要地指出关键词。


    **解决方案 1.** 在“设计”选项卡上，点击左侧的“添加图表元素”按钮。在下拉列表中选择“图表标题” ➤ “图表上方”。图表上将出现一个字段，你需要在其中输入我们的图表名称
    – “支付动态”。


    **解决方案 2.** 点击所选图表右侧的加号，勾选“图表标题”框 – 与第一种方法一样，将出现一个标题字段。


    ![](img/537732_1_En_3_Figak_HTML.png)


    一个带有两条波动曲线的折线图，展示了 Target 和 Actual 的值，并用几个点标出从一月到六月的精确数据。已选择“添加图表元素”菜单。


    将标题居中并置于图表顶部有助于增加图表的工作区域。但此选项仅适用于静态幻灯片，如果线条或柱形不与标题重叠的话。在动态仪表板上，我们选择“图表上方”选项，这样在更改或筛选数据时就不会发生重叠。


    还需要设置图表标题的字体大小：它应该比标签和图例更大：根据可用空间，从 14 到 18 磅不等。为此，选择标题块，然后在主菜单选项卡的“字体”部分设置所需的值
    – 我选择了大小 16。


    ![](img/537732_1_En_3_Figal_HTML.png)


    一个带有两条波动曲线的折线图，展示了 Target 和 Actual 的值，并用几个点标出从一月到六月的精确数据。


    ### 3.3.5 总结


    图表中的文本应尽可能少——只保留那些能帮助用户轻松阅读和理解信息的内容。为了解决这个问题，我们执行了几个操作：


    *   我们将图例放置在图表上方，以便图表内容一目了然。

    *   通过更改数据透视表中的字段名称，移除了图例中的“自动”标签。

    *   从图表区域移除了从数据透视表继承的无用字段按钮。

    *   为图表添加了清晰的标题，并将其放置在顶部。

    *   将图表标题的字体大小增加到 16。

