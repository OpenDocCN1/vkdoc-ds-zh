  trans: '

    ### 4.1.2 应用单元格样式


    现在，我们需要为标题设置一种与普通文本单元格视觉上不同的样式。


    在“开始”菜单选项卡中找到“单元格样式”部分（在较旧版本的 Excel 中为“样式”），然后从下拉菜单中选择“标题 2”。此选项将为包含标题的单元格的下边框添加浅蓝色轮廓线。


    ![](img/537732_1_En_4_Figc_HTML.jpg)


    一张屏幕截图显示了一个包含工资基金分析图表的 Excel 文件。图中绘制了两条波动曲线，峰值出现在四月，达到最大实际值。


    这条轮廓线将在视觉上区分仪表板上的各个语义块。它还会略微强调仪表板上元素的对称性和精确性。


    Excel 中新标题的默认字体大小为 13 磅——我们将其设置为 16。然后，我们将通过图表右侧的绿色十字（“图表标题”项）或“设计”选项卡（“添加图表元素”按钮）来禁用图表块中的重复标准标题。


    ![](img/537732_1_En_4_Figd_HTML.png)


    一月到六月间的付款动态折线图。图中绘制了两条波动曲线，峰值出现在四月，实际值最大为 1875。


    ### 4.1.3 将格式复制到相邻单元格


    我们将在另外几个单元格中使用相同的格式。将光标放在带有图表标题的单元格中 ➤ 单击“开始”菜单选项卡中的“格式刷”按钮 ➤ 用鼠标选中标题之后到图表末尾的单元格。


    ![](img/537732_1_En_4_Fige_HTML.png)


    一月到六月间的付款动态折线图。图中绘制了两条波动曲线，峰值出现在四月，实际值最大为 1875。


    如果一切正确，所有这些单元格的下边框上会出现相同的浅蓝色轮廓线。这条线带来了美观效果，同时也为仪表板上的所有元素设定了边界，并在视觉上区分了各个语义块。


    现在关闭图表的轮廓线——这将使我们的成品摆脱典型的 Excel 功能特征，并为报告增添额外的通透感。为此，你需要：


    -   选中包含图表的块。

    -   单击“格式”菜单选项卡中的“形状轮廓”。

    -   在下拉列表中选择“无轮廓”。


    ![](img/537732_1_En_4_Figf_HTML.png)


    一张屏幕截图显示了一个包含工资基金分析图表的 Excel 文件。图中绘制了两条波动曲线，峰值出现在四月，实际值最大为 1875。


    去掉轮廓线后，我们现在有了更多自由空间。将图例稍微抬高一点，并扩展图表的区域。这将使人们的注意力集中在数据上。


    ***提示！***


    *将标题左对齐而不是居中对齐。这有助于避免仪表板上留下空白空间。你将能够在不堆积仪表板元素的情况下将图例抬高。*


    在这一阶段，新标题下方已有足够的线条来创建清晰的仪表板结构。它们也与 Excel 网格绑定，在后续的可视化工作中不会发生偏移。图表标题的外观就是这样。


    ![](img/537732_1_En_4_Figg_HTML.jpg)


    一张屏幕截图展示了付款动态、部门支出和项目支出三张图表。每个图表分别有实际值和目标值 8161 和 7820，执行率为 104%。


    ### 4.1.4 总结


    我们通过在单元格中设计图表标题，启动了仪表板的新设计版本。它们将整个面板划分为语义块，并为其设定了清晰的结构。


    我们在每个图表左上角上方的单元格中添加了标题。


    我们将它们左对齐，以避免留下空白空间。


    我们为带有标题的单元格选择了“标题 2”样式。


    1.  我们将字体大小增加到 16，以定义语义块。

    2.  我们禁用了图表内部的标准名称。

    3.  我们将样式复制到标题右侧的单元格。

    4.  我们禁用了图表轮廓并扩展了绘图区域。


    ## 4.2 在单元格之上创建新卡片


    现在图表标题位于单元格内，这一点并不显眼。这简化了对齐并增加了图表的工作区域。但也有一些副作用。


    下方图表之间的距离等于单元格的宽度，这个宽度本身相当大。要缩短这个距离，你必须减小 J 列的宽度。这将影响包含实际指标值的卡片：该值将不再适合列宽，并会显示为多个`###`字符。


    ![](img/537732_1_En_4_Figh_HTML.jpg)


    一张屏幕截图展示了付款动态、部门支出和项目支出三张图表。每个图表的实际值显示为哈希值，目标值为 7820，执行率为 104%。


    合并单元格似乎是一个可行的解决方案。然而，如果卡片“存在于”单元格内部，这个问题总会发生。


    例如，我想添加另一张显示平均月薪的卡片。那么我将不得不压缩并移动其他卡片，这反过来又会影响整个图表的对齐。


    ![](img/537732_1_En_4_Figi_HTML.jpg)


    三张图表：付款动态、部门支出和项目支出。每个图表分别有实际值和目标值 8161 美元和 7820 美元，执行率为 104%，平均工资为 86 美元。


    在创建仪表板并与客户商议时，你可能需要反复添加和删除卡片及图表。为了避免破坏对齐，我们将把卡片从网格单元格的边界中“解放”出来。我们将创建新的独立元素。'
- fmt: '### 4.2.1 How to Add a Card Using a Shape and Text Box


    Modern business intelligence systems have widgets for cards. You add an indicator,
    and there appears a stylized rectangle with a title and final value. There are
    no ready-made objects of this kind in Excel, and we will assemble one using makeshift
    tools – rectangles and text boxes.


    It may seem ridiculous, but this life hack will be helpful in Excel as much as
    in other programs. It comes especially handy when the dashboard has a non-standard
    layout, and several indicators need to be grouped under one heading. Let us take
    a closer look at the steps of the process.


    **Step 1.** Click the “Shapes” button in “Insert” tab in “Illustrations” section
    ➤ select “Rectangle” shape in the drop-down menu. If you have a large screen,
    “Shapes” button will immediately appear on the ribbon.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figj_HTML.jpg)


    A snapshot of an Excel sheet. `Insert` tab is selected. Under it, an illustration
    option is selected. The shape is selected in the drop-down. A rectangle shape
    is selected.


    **Step 2.** Place a rectangle on top of the first KPI card. It can be set to any
    size by pulling the edges of the shape itself. This will not affect the width
    of the columns in the table.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figk_HTML.jpg)


    A screenshot depicts an excel file, which has the text wage fund analysis with
    a target value of 7820 thousand dollars with a light background color.


    **Step 3.** Select the rectangle and type in the title of the card: “Target, $K”.
    Let’s set the font size (12) and center alignment.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figl_HTML.png)


    A screenshot depicts an excel file that lists the options under home with the
    text wage fund analysis target value of 7820 thousand dollars in the Calibri font
    and size 12.


    **Step 4.** Click an empty cell to de-select the rectangle. Click the “Text box”
    button in “Insert” tab in “Text” section and place the item appearing into the
    rectangle. This is the element where we will add our indicator.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figm_HTML.png)


    A screenshot depicts an excel file that lists the options under home with the
    text wage fund analysis target value of 7820 thousand dollars and a small dialog
    box.


    To add an indicator to the card, we need to create a new cell in the pivot table
    sample.


    ### 4.2.2 Totals for Cards in Separate Cells


    We wrote out formulas in the draft dashboard to display the card indicators in
    a convenient format and avoid using too many characters. You need to configure
    this format too, with account for its specifics.


    The formula cannot be specified in the formula bar for “Rectangle” and “Label”
    elements. If we try and do this, we will see an error message.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Fign_HTML.jpg)


    A screenshot depicts an excel file with the text wage fund analysis target, thousand
    dollars, and a small dialog box with 7820206, 02 and a highlighted OK button.


    To add a numeric indicator to a new card type, we need to create cells with formulas
    under “Key indicators” sample in “Draft” sheet.


    **Step 1.** Select an empty cell under the first column of the sample and enter
    the following values into the formula bar: `= A43/1000`, `A43` being the address
    of the cell with the plan indicator where you need to reduce the number of characters.


    **Step 2.** Set formatting for the new cell as before. This reduces the bit depth
    and leaves an integer without decimals.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figo_HTML.png)


    A screenshot depicts an excel file, which has the sum of the target, actual, and
    execution in columns A, B, and C with 7820, 8161, and 104% values, respectively.


    **Step 3.** On the sheet with the new version of the dashboard, select “Text box”
    element added to the card and specify a link to the new cell with the desired
    indicator in the formula bar. Adjust the font size, color, and position of the
    indicator in the middle and in the center.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figp_HTML.png)


    A screenshot depicts an excel file that lists the options under home with the
    text wage fund analysis target value, target, thousand dollars 7820 in the Calibri
    font and size 18.


    In the same way, prepare the cells with formulas for the other two cards in advance:


    *   Set the formula for “Actual” indicator and then reduce the bit depth by removing
    decimal points.


    *   In the formula itself, write the division of the actual indicator by the targeted
    value for “Execution” card. Convert the result into percent in “Home” tab in “Number”
    section.


    **Step 4.** Align the card elements relative to each other. Hold down `Shift`
    key and select “Text box” element with the mouse, then select “Rectangle” element.
    Select “Align” ➤ “Align Center” in “Shape Format” menu tab.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figq_HTML.jpg)


    A screenshot depicts an excel file, which has the text wage fund analysis with
    target, active, and execution. It lists the options under align with the selected
    align center.


    **Step 5.** Combine the elements of the card. Select “Text box” first, then select
    “Rectangle.” Use one of the following grouping methods:


    1.  Select “Align” ➤ “Snap to shape” on “Shape Format” tab.


    2.  Select “Group” ➤ “Group” in the context menu.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figr_HTML.jpg)


    A screenshot depicts an excel file that has the graph of wage fund analysis with
    the target value and it lists the options under the group.


    After completing all the steps, we have a grouped “Card” element with the targeted
    indicator.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figs_HTML.jpg)


    An illustration depicts the text wage fund analysis and a small dialog box with
    the target, thousand dollars 7820.


    ### 4.2.3 Card Replication


    Our dashboard should have three cards with key indicators: “Target,” “Actual,”
    and “Execution.” We will use the familiar life hack with replication to avoid
    setting every card separately.


    To do this, I select “Target” card, hold down `Ctrl` (or `cmd`) key on the keyboard,
    and move the copy of the element to the desired place with the mouse. We will
    turn this copy into a card with the actual indicator.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figt_HTML.jpg)


    An illustration depicts the text wage fund analysis, target, thousand dollars
    7820, and a small dialog box on the right with the target, thousand dollars 7820.


    We will title the new card “Actual, $K” and change the link to the actual calculated
    indicator on the “Draft” sheet.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figu_HTML.jpg)


    A screenshot depicts an excel file with the text wage fund analysis, target, thousand
    dollars 7820, and a small dialog box on the right with the target, thousand dollars
    8161.


    At this point, the font of the formatted label goes back to default black. It
    may seem that you have done something wrong. Not to worry – this is yet another
    Excel “bug.” Take a deep breath and readjust the font manually: increase the font
    size and change the color to white.'
