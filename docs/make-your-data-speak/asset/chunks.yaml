- fmt: "### 1.3.1 How a Pivot Table Report Works\n\nAll the possibilities for further\
    \ configuration are on the right pane `PivotTable Fields`. At the top, by default,\
    \ there is a list of all available fields, that is, columns from a flat table.\
    \ The following is a section for configuration, consisting of four areas:\n\n\
    - `Values`\n- `Rows`\n- `Columns`\n- `Filters`\n\nThe display of the pane can\
    \ be changed by clicking the `gear` and selecting the option `Fields Section and\
    \ Areas Section Side-By-Side` – so a long list of fields will be visible.\n\n\
    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figy_HTML.gif) A page depicts the\
    \ pivot table fields with division, expense item, month, target, and actual. \
    \ \n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figz_HTML.gif) A page depicts\
    \ the pivot table field overlapped by the field section and area section stacked\
    \ under the settings menu.\n\nTo add a field to the sample, check the box next\
    \ to its name in the list of fields or drag the mouse from there to the desired\
    \ area: `Filters`, `Columns`, `Rows`, or `Values`. You can also delete a field\
    \ from the sample: remove the check mark next to its name or drag the mouse from\
    \ a specific area to the list of fields.\n\nThe pivot table automatically aggregates\
    \ data in columns, that is, combines them by some attribute. If all the data in\
    \ the selected field has a numeric format, Excel will assign the summation by\
    \ default. If there is at least one text or empty cell in them, then the number\
    \ of cells will be counted instead of the sum.\n\nOther calculation methods can\
    \ be used in the sample cells: average, minimum, fraction, etc. There are several\
    \ ways to change the calculation method.\n\n**Solution 1.** Right-click on any\
    \ cell of the required field in the pivot table and select another aggregation\
    \ method.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaa_HTML.png) An\
    \ excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. It is overlapped by right click option for the first value in the\
    \ second column.\n\n**Solution 2.** Select the desired type of aggregation via\
    \ the menu: `PivotTable Analyse` ➤ `Active field` ➤ `Field Settings` ➤ `Summarise\
    \ Values By` tab in the window that opens.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figab_HTML.jpg)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. It is overlapped by the value field settings with the sum of target\
    \ options enabled.\n\nWhen the sample is created and configured, we make a blank\
    \ for the visual element based on it.\n\n#### Preparing the First Sample\n\nStart\
    \ with a sample for visualizing the dynamics of payments. On the sheet with the\
    \ pivot table in the `PivotTable Fields` pane, tick the required fields: `Month`,\
    \ `Actual`, and `Target`. That’s all – the first sample is ready.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figac_HTML.png)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. It is overlapped by pivot table fields with enabled options of the\
    \ month, target, and actual.\n\nBeing in any cell of the created sample, go to\
    \ the `Insert` tab, click the `Insert line or area chart` button and select the\
    \ `Line with Markers` representation.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figad_HTML.png)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. It is overlapped by the sum of target, actual waveforms.\n\n**Tip!**\
    \  \n*If in the process of creating a sample something went wrong, you can always\
    \ return to the original state by clicking the `Clear Pivot table` button on the\
    \ `PivotTable Analyse` tab.*\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figae_HTML.png)\
    \ A screenshot of the menu bar in the excel sheet. Pivot table analyses are selected.\
    \ Clear all option is enabled.\n\nIn order not to get confused, give the names\
    \ for the samples.\n\n**Method 1.** Go to the `PivotTable Analyse` menu, click\
    \ the `Options` button on the left, in the window that opens, enter the name of\
    \ the table: `Payments dynamics`.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaf_HTML.png)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. It is overlapped by the graph of the sum of the actual and target.\
    \ The pivot table analysis option is enabled.\n\n**Method 2.** Right-click on\
    \ the first cell in the row with headers and select `PivotTable Options...` from\
    \ the context menu. In the opened dialog box in the `PivotTable Name` field, enter\
    \ a name that will display the essence of the data of this sample. In further\
    \ work, you will always know which sample you are working with. This dialog box\
    \ can also be called from the menu tab `PivotTable Analyse` ➤ `Options`.\n\n###\
    \ 1.3.2 Replicating Data from a Pivot Table\n\nWe need a separate pivot table\
    \ report for each chart. But to do this, you do not need to return to a sheet\
    \ with a flat table and make a new pivot table. It is enough to copy the existing\
    \ sample and paste it below on the empty rows of the same sheet. This is what\
    \ I call replication.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figag_HTML.jpg)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual with their values and total.\n\n**Tip!**  \n*Make sure that you have\
    \ selected and copied all the cells: otherwise you will not get a pivot table,\
    \ but just a range of cells unsuitable for further work. This often happens when\
    \ users forget to highlight totals or columns that did not fit into the visible\
    \ area of the screen.*\n\nTo turn the copied sample into a new one, do the following:\n\
    \n- Put the cursor on any cell of the copied sample.\n- On the `PivotTable Fields`\
    \ pane, uncheck the `Month` field.\n- In the same place, we tick the `Division`\
    \ field.\n\nAs a result, we get a sample for the blank of the visual element `Expenses\
    \ by divisions`. Adding a blank to the sheet: on the `Insert` tab, click `Insert\
    \ column or bar chart` and select the `Clustered column` representation.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figah_HTML.png)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. A bar graph of the sum of target and actual values is plotted.\n\n\
    In the same way, we repeat the process of replicating the sample to visualize\
    \ `Expenses by items`:\n\n- We transfer a copy of the second finished sample to\
    \ new rows, then put the cursor on any of its cells.\n- Remove the check mark\
    \ from the `Division` field on the `PivotTable Fields` pane.\n- Add a check mark\
    \ from the `Expense item` field.\n\nThe sample is ready, it remains to edit it.\
    \ On the `Insert` tab, click `Insert column or bar chart` and select the `Clustered\
    \ Bar` representation.\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figai_HTML.png)\
    \ An excel sheet depicts three columns namely row labels, sum of target, and sum\
    \ of actual. It is overlapped by the insert chart option with the enabled option\
    \ of the clustered bar.\n\n#### ERROR “A PIVOT TABLE REPORT CANNOT OVERLAP ANOTHER\
    \ PIVOT TABLE REPORT.” WHAT TO DO?\n\n![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaj_HTML.png)\
    \ A page depicts Microsoft excel with a warning message of a pivot table report\
    \ cannot overlap another pivot table report.\n\nThe error appears if new categories\
    \ have appeared when updating the data, and they are missing rows, because the\
    \ next selection is placed there.\n\n**Solution:** Add the required number of\
    \ empty rows (preferably with a margin) after sample with an error and update\
    \ the data again.\n\n**Tip!** When placing samples under each other, leave empty\
    \ rows between them so that when adding data, there is enough space to automatically\
    \ extend downwards. Or place them horizontally with an indentation of 1–2 columns."
  raw: '### 1.3.1 How a Pivot Table Report Works


    All the possibilities for further configuration are on the right pane “PivotTable
    Fields.” At the top, by default, there is a list of all available fields, that
    is, columns from a flat table. The following is a section for configuration, consisting
    of four areas:


    *   Values


    *   Rows


    *   Columns


    *   Filters


    The display of the pane can be changed by clicking the “gear” and selecting the
    option “Fields Section and Areas Section Side-By-Side” – so a long list of fields
    will be visible.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figy_HTML.gif)A page depicts the
    pivot table fields with division, expense item, month, target, and actual. ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figz_HTML.gif)A
    page depicts the pivot table field overlapped by the field section and area section
    stacked under the settings menu.


    To add a field to the sample, check the box next to its name in the list of fields
    or drag the mouse from there to the desired area: “Filters,” “Columns,” “Rows,”
    or “Values.” You can also delete a field from the sample: remove the check mark
    next to its name or drag the mouse from a specific area to the list of fields.


    The pivot table automatically aggregates data in columns, that is, combines them
    by some attribute. If all the data in the selected field has a numeric format,
    Excel will assign the summation by default. If there is at least one text or empty
    cell in them, then the number of cells will be counted instead of the sum.


    Other calculation methods can be used in the sample cells: average, minimum, fraction,
    etc. There are several ways to change the calculation method.


    **Solution 1.** Right-click on any cell of the required field in the pivot table
    and select another aggregation method.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaa_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by right click option for the first value in the second
    column.


    **Solution 2.** Select the desired type of aggregation via the menu: “PivotTable
    Analyse” ➤ “Active field” ➤ “Field Settings” ➤ “Summarise Values By” tab in the
    window that opens.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figab_HTML.jpg)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by the value field settings with the sum of target
    options enabled.


    When the sample is created and configured, we make a blank for the visual element
    based on it.


    #### Preparing the First Sample


    Start with a sample for visualizing the dynamics of payments. On the sheet with
    the pivot table in the “PivotTable Fields” pane, tick the required fields: “Month,”
    “Actual,” and “Target.” That’s all – the first sample is ready.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figac_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by pivot table fields with enabled options of the
    month, target, and actual.


    Being in any cell of the created sample, go to the “Insert” tab, click the “Insert
    line or area chart” button and select the “Line with Markers” representation.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figad_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by the sum of target, actual waveforms.


    ***Tip!***


    *If in the process of creating a sample something went wrong, you can always return
    to the original state by clicking the “Clear Pivot table” button on the “PivotTable
    Analyse” tab.*


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figae_HTML.png)


    A screenshot of the menu bar in the excel sheet. Pivot table analyses are selected.
    Clear all option is enabled.


    In order not to get confused, give the names for the samples.


    **Method 1**. Go to the “PivotTable Analyse” menu, click the “Options” button
    on the left, in the window that opens, enter the name of the table: “Payments
    dynamics.”


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaf_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by the graph of the sum of the actual and target.
    The pivot table analysis option is enabled.


    **Method 2.** Right-click on the first cell in the row with headers and select
    “PivotTable Options…” from the context menu.


    In the opened dialog box in the “PivotTable Name” field, enter a name that will
    display the essence of the data of this sample. In further work, you will always
    know which sample you are working with.


    This dialog box can also be called from the menu tab “PivotTable Analyse” ➤ “Options.”


    ### 1.3.2 Replicating Data from a Pivot Table


    We need a separate pivot table report for each chart. But to do this, you do not
    need to return to a sheet with a flat table and make a new pivot table. It is
    enough to copy the existing sample and paste it below on the empty rows of the
    same sheet. This is what I call replication.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figag_HTML.jpg)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual with their values and total.


    *Tip!*


    *Make sure that you have selected and copied all the cells: otherwise you will
    not get a pivot table, but just a range of cells unsuitable for further work.
    This often happens when users forget to highlight totals or columns that did not
    fit into the visible area of the screen.*


    To turn the copied sample into a new one, do the following:


    *   Put the cursor on any cell of the copied sample.


    *   On the “PivotTable Fields” pane, uncheck the “Month” field.


    *   In the same place, we tick the “Division” field.


    As a result, we get a sample for the blank of the visual element “Expenses by
    divisions.” Adding a blank to the sheet: on the “Insert” tab, click “Insert column
    or bar chart” and select the “Clustered column” representation.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figah_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. A bar graph of the sum of target and actual values is plotted.


    In the same way, we repeat the process of replicating the sample to visualize
    “Expenses by items”:


    *   We transfer a copy of the second finished sample to new rows, then put the
    cursor on any of its cells.


    *   Remove the check mark from the “Division” field on the “PivotTable Fields”
    pane.


    *   Add a check mark from the “Expense item” field.


    The sample is ready, it remains to edit it. On the “Insert” tab, click “Insert
    column or bar chart” and select the “Clustered Bar” representation.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figai_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by the insert chart option with the enabled option
    of the clustered bar.


    ERROR “A PIVOT TABLE REPORT CANNOT OVERLAP ANOTHER PIVOT TABLE REPORT.” WHAT TO
    DO?


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaj_HTML.png)


    A page depicts Microsoft excel with a warning message of a pivot table report
    cannot overlap another pivot table report.


    The error appears if new categories have appeared when updating the data, and
    they are missing rows, because the next selection is placed there.


    **Solution:** Add the required number of empty rows (preferably with a margin)
    after sample with an error and update the data again.


    Tip! When placing samples under each other, leave empty rows between them so that
    when adding data, there is enough space to automatically extend downwards. Or
    place them horizontally with an indentation of 1–2 columns.'
  trans: "\n### 1.3.1 数据透视表报告的工作原理\n\n所有进一步配置的可能性都位于右侧窗格“`PivotTable Fields`”中。顶部默认显示所有可用字段的列表，即来自平面表的列。下方是一个由四个区域组成的配置区：\n\
    \n- `Values`\n- `Rows`\n- `Columns`\n- `Filters`\n\n通过点击`齿轮`图标并选择选项`Fields Section\
    \ and Areas Section Side-By-Side`，可以更改窗格的显示方式——这样长字段列表将可见。\n\n![](img/537732_1_En_1_Figy_HTML.gif)\
    \ 一页展示了包含部门、费用项目、月份、目标和实际值的数据透视表字段。  \n![](img/537732_1_En_1_Figz_HTML.gif) 一页展示了数据透视表字段，其上覆盖了设置菜单下的字段区域和区域部分堆叠视图。\n\
    \n要将字段添加到样本中，请勾选字段列表中其名称旁的复选框，或将鼠标从那里拖到所需区域：`Filters`、`Columns`、`Rows`或`Values`。您也可以从样本中删除字段：取消勾选其名称旁的复选框，或将鼠标从特定区域拖回字段列表。\n\
    \n数据透视表会自动聚合列中的数据，即根据某个属性进行组合。如果所选字段中的所有数据均为数字格式，Excel 将默认使用求和。如果其中至少包含一个文本或空单元格，则将计算单元格数量而非总和。\n\
    \n样本单元格中可使用其他计算方法：平均值、最小值、分数等。更改计算方法有几种方式。\n\n**解决方案 1.** 右键点击数据透视表中所需字段的任意单元格，选择其他聚合方法。\n\
    \n![](img/537732_1_En_1_Figaa_HTML.png) 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。第二列第一个单元格上覆盖了右键点击选项。\n\
    \n**解决方案 2.** 通过菜单选择所需的聚合类型：`PivotTable Analyse` ➤ `Active field` ➤ `Field Settings`\
    \ ➤ 在打开的窗口中选择`Summarise Values By`选项卡。\n\n![](img/537732_1_En_1_Figab_HTML.jpg)\
    \ 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。其上覆盖了已启用目标总和选项的“值字段设置”对话框。\n\n当样本创建并配置完成后，我们基于它制作可视化元素的空白模板。\n\
    \n#### 准备第一个样本\n\n从可视化支付动态的样本开始。在数据透视表所在工作表的`PivotTable Fields`窗格中，勾选所需字段：`Month`、`Actual`和`Target`。就是这样——第一个样本就准备好了。\n\
    \n![](img/537732_1_En_1_Figac_HTML.png) 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。其上覆盖了已启用月份、目标和实际选项的数据透视表字段。\n\
    \n在已创建样本的任意单元格中，转到`Insert`选项卡，点击`Insert line or area chart`按钮，选择`带数据标记的折线图`表现形式。\n\
    \n![](img/537732_1_En_1_Figad_HTML.png) 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。其上覆盖了目标与实际总和的波形图。\n\
    \n**提示！**  \n*如果在创建样本过程中出现问题，您始终可以通过点击`PivotTable Analyse`选项卡上的`Clear Pivot Table`按钮恢复到原始状态。*\n\
    \n![](img/537732_1_En_1_Figae_HTML.png) 一个 Excel 菜单栏截图。已选中“数据透视表分析”。启用了“全部清除”选项。\n\
    \n为了避免混淆，请为样本命名。\n\n**方法 1.** 转到`PivotTable Analyse`菜单，点击左侧的`Options`按钮，在打开的窗口中输入表格名称：`Payments\
    \ dynamics`。\n\n![](img/537732_1_En_1_Figaf_HTML.png) 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。其上覆盖了实际与目标总和的图表。已启用数据透视表分析选项。\n\
    \n**方法 2.** 右键点击表头行的第一个单元格，从上下文菜单中选择`PivotTable Options...`。在打开的对话框中的`PivotTable\
    \ Name`字段中，输入能体现该样本数据本质的名称。在后续工作中，您将始终知道您正在处理哪个样本。此对话框也可以通过菜单选项卡`PivotTable Analyse`\
    \ ➤ `Options`调用。\n\n### 1.3.2 从数据透视表复制数据\n\n每个图表都需要单独的数据透视表报告。但要做到这一点，您无需返回平面表所在的工作表并创建新的数据透视表。只需复制现有样本并将其粘贴到同一工作表下方的空行中即可。我称之为复制。\n\
    \n![](img/537732_1_En_1_Figag_HTML.jpg) 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和及其值和总计。\n\
    \n**提示！**  \n*请确保您已选中并复制了所有单元格：否则您将得不到数据透视表，而只是一个不适合后续工作的单元格区域。当用户忘记选中总计或未放入屏幕可视区域的列时，这种情况经常发生。*\n\
    \n要将复制的样本转换为新样本，请执行以下操作：\n\n- 将光标放在复制样本的任意单元格上。\n- 在`PivotTable Fields`窗格中，取消勾选`Month`字段。\n\
    - 在同一位置，勾选`Division`字段。\n\n结果，我们得到了可视化元素`按部门支出`的空白模板。将空白模板添加到工作表：在`Insert`选项卡上，点击`Insert\
    \ column or bar chart`并选择`簇状柱形图`表现形式。\n\n![](img/537732_1_En_1_Figah_HTML.png)\
    \ 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。绘制了目标与实际总和的柱状图。\n\n同样地，我们重复复制样本的过程以可视化`按项目支出`：\n\
    \n- 将第二个已完成的样本副本转移到新行，然后将光标放在其任意单元格上。\n- 在`PivotTable Fields`窗格中取消勾选`Division`字段。\n\
    - 勾选`Expense item`字段。\n\n样本已准备好，只需进行编辑。在`Insert`选项卡上，点击`Insert column or bar chart`并选择`簇状条形图`表现形式。\n\
    \n![](img/537732_1_En_1_Figai_HTML.png) 一个 Excel 表格显示了三个列：行标签、目标总和和实际总和。其上覆盖了插入图表选项并启用了簇状条形图选项。\n\
    \n#### 错误：“数据透视表报告不能重叠另一个数据透视表报告。”该怎么办？\n\n![](img/537732_1_En_1_Figaj_HTML.png)\
    \ 一页显示了带有警告消息的 Microsoft Excel：数据透视表报告不能重叠另一个数据透视表报告。\n\n如果更新数据时出现了新类别，而它们缺少行（因为下一个选择被放置在那里），则会出现该错误。\n\
    \n**解决方案：** 在有错误的样本之后添加所需数量的空行（最好留有余量），然后再次更新数据。\n\n**提示！** 将样本上下放置时，在它们之间留出空行，以便在添加数据时有足够的空间自动向下扩展。或者将它们水平放置，间隔\
    \ 1-2 列。\n"
- fmt: '### 1.3.3 Summary


    All visual elements on the interactive dashboard are based on data samples from
    the pivot table. One element is one sample. Replication helps to save time on
    creating new samples: if a new one should differ from an already created one only
    in categories, it is not necessary to create it from scratch.


    1. Select the table (make sure that all cells are selected, otherwise the selection
    will not work).

    2. For replication, copy and paste a new sample on a sheet with a pivot table.

    3. Select the fields required for the new sample in the `PivotTable Fields` pane.
    Give the new sample a name.

    4. Standing on any cell of the sample, select and add a blank for the diagram:
    you will design it later.

    5. Do the same with other samples and blanks of visual elements.


    Leave a distance between the samples to avoid them overlapping with each other
    after updating the data. Determine in advance how best to place the samples: down
    or to the right.


    ## 1.4 Setting Up the Interactive


    The key difference between a dashboard and a slide is the ability to filter data.
    Thanks to this, on one screen we can go from the company’s totals to each division
    and drill down into the cost items for each month. It would take dozens of slides.


    The interactivity of the dashboard can be adjusted using filters or slices. Filters
    are familiar to many, but they have their drawbacks that make interactions with
    a dashboard uncomfortable. Let’s consider both tools to adjust to the preferences
    of any customer.


    ### 1.4.1 Good Old Filters


    The `Filters` block is provided in the fields of the pivot table. We can move
    a data category there, for example, a division, and we will get a row with a filter
    above the table.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figak_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by pivot table fields with enabled options of the
    month, target and actual values, and a bar graph.


    I don’t like standard filters for several reasons.


    - It’s not immediately clear how many items are in the list: maybe four, maybe
    40. You need to expand the list to select an item.

    - To select several elements, you need to click a separate check mark.

    - For each sample, you need to add your own filters, even if they have already
    been configured for another sample.

    - They take up extra space on the sheet.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figal_HTML.jpg)


    A page depicts the division under the categories of commercial employees, logistics
    and service, and production workers. The button OK is enabled.


    Many still add a lot of filters and tick off long lists. Although back in 2010,
    a modern alternative appeared – slicers. Largely thanks to them, the dashboard
    gets an intuitive interface.


    ### 1.4.2 Magic Slicers


    How to create a slicer:


    - Put the cursor on a cell inside the pivot table.

    - On the `Insert` tab, click `Slicer`.

    - Check the box with the desired data category.

    - We get an interactive slicer.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figam_HTML.png)


    An excel sheet with 3 columns namely row labels, sum of target, and sum of actual.
    The division is categorized into commercial employees, logistics and service,
    production workers, and company management.


    If such a window appears instead of a list of fields, it means that you missed
    step 1 – you need to put the cursor inside the pivot table so that the cell is
    highlighted. Otherwise, Excel tells you: `No connections found.`


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figan_HTML.jpg)


    A page depicts the existing connections with connections enabled as all connections.


    Click the slicer button – and the table together with the graph is dynamically
    filtered by the selected division.


    If you want to select several divisions, then select them with the `Ctrl` (or
    `cmd` key) pressed. And if this is inconvenient for you, then you can switch to
    the mode of selecting several objects and select them in turn.


    To reset the filter, click the familiar button at the top right.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figao_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by division with commercial employees and production
    workers.


    ### 1.4.3 Connect Slicers to Reports


    By default, the created slicer filters only the sample based on which it was created.
    To influence other samples, we will set up interaction.


    **Solution 1. Using the Button on the Menu Ribbon**


    On the `Slice` tab, select the `Report Connections` button. If you don’t see such
    a tab, then your cursor is on some cell, put it on a slice.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figap_HTML.png)


    A menu bar in an excel sheet. It depicts the slicer menu with report connections
    tab enabled.


    **Solution 2. Using the Context Menu**


    Right-click on the slicer and select `Reports Connections…` from the context menu.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaq_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by the right-click options divisions and report connections.


    I have no preferences, I use both methods according to the situation. As a result,
    the `Reports Connections (Division)` window opens, where we tick all the other
    tables.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figar_HTML.jpg)


    A page depicts the report connections with checkboxes for payment dynamics, pivot
    table 2, and pivot table 4 with sheet 2. The last 2 are enabled.


    Now the `Division` slicer interacts with all the samples and blanks that are on
    the sheet.


    You can add multiple slicers at once if you put a few ticks next to the column
    names in the `Insert Slicers` window.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figas_HTML.jpg)


    A menu bar insert slicers has checkboxes namely division, expense item, month,
    target, and actual with the first 3 options enabled. The button OK is highlighted.


    For each slicer, you need to configure interaction with existing samples. The
    slicer may not affect all visual elements, but only a part of them, depending
    on the scenario of the dashboard.


    ***Tip!***


    *Don’t create slicers for fields that contain data about actual values – use them
    for fields with categories.*


    Now the `Division` slicer interacts with all the pivot tables that are on the
    sheet.


    The `Report Connections` button can be found not only through the `Slicer` tab
    but also in the context menu of the slicer that appears upon a right-click mouse
    operation.


    You can add multiple slicers at once if in the window `Insert Slicer` put a few
    ticks next to the column names.'
  raw: '### 1.3.3 Summary


    All visual elements on the interactive dashboard are based on data samples from
    the pivot table. One element is one sample. Replication helps to save time on
    creating new samples: if a new one should differ from an already created one only
    in categories, it is not necessary to create it from scratch.


    1.  Select the table (make sure that all cells are selected, otherwise the selection
    will not work).


    2.  For replication, copy and paste a new sample on a sheet with a pivot table.


    3.  Select the fields required for the new sample in the “PivotTable Fields” pane.
    Give the new sample a name.


    4.  Standing on any cell of the sample, select and add a blank for the diagram:
    you will design it later.


    5.  Do the same with other samples and blanks of visual elements.


    Leave a distance between the samples to avoid them overlapping with each other
    after updating the data. Determine in advance how best to place the samples: down
    or to the right.


    ## 1.4 Setting Up the Interactive


    The key difference between a dashboard and a slide is the ability to filter data.
    Thanks to this, on one screen we can go from the company’s totals to each division
    and drill down into the cost items for each month. It would take dozens of slides.


    The interactivity of the dashboard can be adjusted using filters or slices. Filters
    are familiar to many, but they have their drawbacks that make interactions with
    a dashboard uncomfortable. Let’s consider both tools to adjust to the preferences
    of any customer.


    ### 1.4.1 Good Old Filters


    The “Filters” block is provided in the fields of the pivot table. We can move
    a data category there, for example, a division, and we will get a row with a filter
    above the table.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figak_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by pivot table fields with enabled options of the
    month, target and actual values, and a bar graph.


    I don’t like standard filters for several reasons.


    *   It’s not immediately clear how many items are in the list: maybe four, maybe
    40\. You need to expand the list to select an item.


    *   To select several elements, you need to click a separate check mark.


    *   For each sample, you need to add your own filters, even if they have already
    been configured for another sample.


    *   They take up extra space on the sheet.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figal_HTML.jpg)


    A page depicts the division under the categories of commercial employees, logistics
    and service, and production workers. The button OK is enabled.


    Many still add a lot of filters and tick off long lists. Although back in 2010,
    a modern alternative appeared – slicers. Largely thanks to them, the dashboard
    gets an intuitive interface.


    ### 1.4.2 Magic Slicers


    How to create a slicer:


    *   Put the cursor on a cell inside the pivot table.


    *   On the “Insert” tab, click “Slicer”.


    *   Check the box with the desired data category.


    *   We get an interactive slicer.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figam_HTML.png)


    An excel sheet with 3 columns namely row labels, sum of target, and sum of actual.
    The division is categorized into commercial employees, logistics and service,
    production workers, and company management.


    If such a window appears instead of a list of fields, it means that you missed
    step 1 – you need to put the cursor inside the pivot table so that the cell is
    highlighted. Otherwise, Excel tells you: “No connections found.”


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figan_HTML.jpg)


    A page depicts the existing connections with connections enabled as all connections.


    Click the slicer button – and the table together with the graph is dynamically
    filtered by the selected division.


    If you want to select several divisions, then select them with the Ctrl (or cmd
    key) pressed. And if this is inconvenient for you, then you can switch to the
    mode of selecting several objects and select them in turn.


    To reset the filter, click the familiar button at the top right.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figao_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by division with commercial employees and production
    workers.


    ### 1.4.3 Connect Slicers to Reports


    By default, the created slicer filters only the sample based on which it was created.
    To influence other samples, we will set up interaction.


    **Solution 1\. Using the Button on the Menu Ribbon**


    On the “Slice” tab, select the “Report Connections” button. If you don’t see such
    a tab, then your cursor is on some cell, put it on a slice.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figap_HTML.png)


    A menu bar in an excel sheet. It depicts the slicer menu with report connections
    tab enabled.


    **Solution 2\. Using the Context Menu**


    Right-click on the slicer and select “Reports Connections…” from the context menu.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaq_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by the right-click options divisions and report connections.


    I have no preferences, I use both methods according to the situation. As a result,
    the “Reports Connections (Division)” window opens, where we tick all the other
    tables.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figar_HTML.jpg)


    A page depicts the report connections with checkboxes for payment dynamics, pivot
    table 2, and pivot table 4 with sheet 2\. Tha last 2 are enabled.


    Now the “Division” slicer interacts with all the samples and blanks that are on
    the sheet.


    You can add multiple slicers at once if you put a few ticks next to the column
    names in the “Insert Slicers” window.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figas_HTML.jpg)


    A menu bar insert slicers has checkboxes namely division, expense item, month,
    target, and actual with the first 3 options enabled. The button OK is highlighted.


    For each slicer, you need to configure interaction with existing samples. The
    slicer may not affect all visual elements, but only a part of them, depending
    on the scenario of the dashboard.


    ***Tip!***


    *Don’t create slicers for fields that contain data about actual values – use them
    for fields with categories.*


    Now the “Division” slicer interacts with all the pivot tables that are on the
    sheet.


    The “Report Connections” button can be found not only through the “Slicer” tab
    but also in the context menu of the slicer that appears upon a right-click mouse
    operation.


    You can add multiple slicers at once if in the window “Insert Slicer” put a few
    ticks next to the column names.'
  trans: '

    ### 1.3.3 总结


    交互式仪表盘上的所有可视化元素都基于数据透视表中的数据样本。每个元素就是一个样本。复制有助于节省创建新样本的时间：如果新样本与已创建的样本仅在类别上有所不同，则无需从头创建。


    1.  选中表格（确保选中所有单元格，否则选择将不起作用）。

    2.  要进行复制，请将新样本复制并粘贴到包含数据透视表的工作表上。

    3.  在`数据透视表字段`窗格中，选择新样本所需的字段。为新样本命名。

    4.  选中样本中的任意一个单元格，选择并添加一个图表占位符：你将在之后设计它。

    5.  对其他样本和可视化元素的占位符重复相同操作。


    在样本之间留出距离，以避免在数据更新后它们相互重叠。提前确定如何最好地放置样本：向下排列还是向右排列。


    ## 1.4 设置交互功能


    仪表盘与幻灯片的关键区别在于其数据筛选能力。得益于此，我们可以在一个屏幕上从公司总览深入到每个部门，并逐月钻取成本项目。这需要数十张幻灯片才能实现。


    仪表盘的交互性可以通过筛选器或切片器来调整。筛选器为许多人所熟悉，但它们存在一些缺点，使得与仪表盘的交互不够便捷。让我们来研究一下这两种工具，以适应任何客户的需求。


    ### 1.4.1 经典筛选器


    `筛选器`块位于数据透视表的字段区域。我们可以将一个数据类别（例如部门）拖入其中，表格上方就会出现一个包含筛选器的行。


    ![](img/537732_1_En_1_Figak_HTML.png)


    一张 Excel 工作表，显示了三个列：行标签、目标总和以及实际总和。它被数据透视表字段覆盖，其中启用了月份、目标和实际值选项，以及一个柱状图。


    我不喜欢标准筛选器，原因如下。


    -   无法立即看出列表中有多少项：可能是四项，也可能是四十项。你需要展开列表才能选择一项。

    -   要选择多个元素，需要单独勾选复选框。

    -   每个样本都需要添加自己的筛选器，即使已经为另一个样本配置过。

    -   它们会占用工作表上额外的空间。


    ![](img/537732_1_En_1_Figal_HTML.jpg)


    一页图片显示了下拉菜单中的部门分类：商业员工、物流与服务、生产工人。同时，“确定”按钮处于启用状态。


    许多人仍然会添加大量筛选器并勾选长长的列表。尽管早在 2010 年，就出现了一个现代替代方案 —— 切片器。主要归功于它们，仪表盘才拥有了直观的界面。


    ### 1.4.2 神奇的切片器


    如何创建切片器：


    -   将光标放在数据透视表内的一个单元格上。

    -   在`插入`选项卡中，单击`切片器`。

    -   勾选所需数据类别旁的复选框。

    -   我们就得到了一个交互式切片器。


    ![](img/537732_1_En_1_Figam_HTML.png)


    一张 Excel 工作表，包含三列：行标签、目标总和和实际总和。部门被分类为：商业员工、物流与服务、生产工人、公司管理层。


    如果出现这样的窗口而不是字段列表，则说明你跳过了步骤 1 —— 需要将光标放在数据透视表内，使单元格被高亮显示。否则，Excel 会提示：`未找到连接。`


    ![](img/537732_1_En_1_Figan_HTML.jpg)


    一页图片显示了现有连接，其中“连接”选项已开启，状态为“所有连接”。


    单击切片器按钮 —— 表格和图表将根据所选部门动态筛选。


    如果你想选择多个部门，请按住`Ctrl`（或`cmd`键）进行选择。如果你觉得这样不方便，可以切换到多选模式，然后依次选择。


    要重置筛选器，请单击右上角的常用按钮。


    ![](img/537732_1_En_1_Figao_HTML.png)


    一张 Excel 工作表，显示了三个列：行标签、目标总和以及实际总和。它被部门筛选器覆盖，其中选中了商业员工和生产工人。


    ### 1.4.3 将切片器连接到报表


    默认情况下，创建的切片器仅筛选它所基于的样本。要影响其他样本，我们需要设置交互。


    **解决方案 1：使用菜单栏上的按钮**


    在`切片器`选项卡上，选择`报表连接`按钮。如果你看不到该选项卡，说明你的光标在某个单元格上，请将其放置在切片器上。


    ![](img/537732_1_En_1_Figap_HTML.png)


    Excel 工作表中的一个菜单栏。它显示了切片器菜单，其中“报表连接”选项卡已启用。


    **解决方案 2：使用右键菜单**


    右键单击切片器，然后从上下文菜单中选择`报表连接...`。


    ![](img/537732_1_En_1_Figaq_HTML.png)


    一张 Excel 工作表，显示了三个列：行标签、目标总和和实际总和。它被右键菜单覆盖，菜单中包含“部门”和“报表连接”选项。


    我没有偏好，根据情况两种方法都会使用。最终，会打开`报表连接（部门）`窗口，我们在其中勾选所有其他表格。


    ![](img/537732_1_En_1_Figar_HTML.jpg)


    一页图片显示了报表连接，包含“付款动态”、“数据透视表 2”和“数据透视表 4（工作表 2）”的复选框。最后两项已启用。


    现在，`部门`切片器与工作表上的所有样本和占位符进行交互。


    如果在`插入切片器`窗口中，在列名旁边勾选多个复选框，就可以一次添加多个切片器。


    ![](img/537732_1_En_1_Figas_HTML.jpg)


    一个菜单栏“插入切片器”，包含复选框：部门、费用项目、月份、目标和实际，前三个选项已启用。“确定”按钮被高亮显示。


    对于每个切片器，都需要配置其与现有样本的交互。根据仪表盘的场景，切片器可能不会影响所有可视化元素，而只影响其中一部分。


    ***提示！***


    *不要为包含实际值数据的字段创建切片器 —— 请将它们用于包含类别的字段。*


    现在，`部门`切片器与工作表上的所有数据透视表进行交互。


    `报表连接`按钮不仅可以通过`切片器`选项卡找到，还可以在右键单击切片器时出现的上下文菜单中找到。


    如果在`插入切片器`窗口中，在列名旁边勾选多个复选框，就可以一次添加多个切片器。

