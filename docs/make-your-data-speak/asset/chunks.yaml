  trans: '

    ### 2.3 对齐仪表板并添加标题


    由于卡片尺寸发生了变化，布局中的图表被拉伸，其上的一些数据超出了屏幕范围。但让用户能一眼看到所有信息对我们来说非常重要。


    ![](img/537732_1_En_2_Figq_HTML.jpg)


    一张示意图展示了一个折线图和两个柱状图，分别是月度目标、费用项目以及管理层与员工的划分。


    为了让所有内容都适应一个屏幕，你需要更改图形和图表的大小。为此，选中一个包含图表的模块，然后通过移动其边框线条来调整大小。


    对其他可视化元素也执行相同操作。如果你需要将图表模块沿水平或垂直方向精确移动，请选中它，然后按住 `Shift` 键，用鼠标进行拖动。


    ![](img/537732_1_En_2_Figr_HTML.jpg)


    一张示意图展示了块大小缩小的过程。它包含一个折线图和两个柱状图，分别是部门、费用项目和月份。


    删除卡片与可视化元素之间多余的行。现在，让我们为工作表添加仪表板标题。


    *   我们需要在 KPI 卡片上方留出三个空行：如果行数不够，请添加。

    *   在第二个空行中，位于第一张卡片上方的单元格（在我们的例子中是 `D2`）中，写入仪表板标题“工资基金分析”。

    *   将标题的字体大小设置为 20 磅：与卡片中的数值指标相同。


    在此阶段完成仪表板的工作，只需移除仪表板工作表上的网格线即可。只需单击鼠标一次：在“视图”菜单选项卡中，取消选中“网格线”参数。


    ![](img/537732_1_En_2_Figs_HTML.png)


    一张示意图展示了收入基金调查。它包含一个折线图和两个柱状图，分别是部门、费用项目和月度目标。


    这就是我们的仪表板在完成所有组装操作后的样子。


    ![](img/537732_1_En_2_Figt_HTML.jpg)


    一张示意图展示了电子表格的工具栏。它表示选中了“视图”选项和一个未选中的“网格线”选项。


    ### 2.3.1 总结


    实践表明，任何粗心大意不仅会降低你工作的价值，甚至会降低数据的可信度。一个设计良好的仪表板价值更高。因此，关注元素的正确排列及其对齐非常重要。


    为此，我们做了以下工作：


    *   更改了图表的大小，以使所有内容适应一个屏幕

    *   对齐了可视化元素的位置

    *   在卡片上方的空行中添加了仪表板标题

    *   移除了 Excel 工作表中的网格线


    # 3. 图表的剖析


    我们很快就构建了一个仪表板。它看起来像一个交互式分析应用程序，而不像 Excel 中通常那样只是一组图表和筛选器。许多人认为这已经很好了，但我们只是刚刚起步。


    本书的这一部分是关于微调图表元素的，其给人的第一印象是“漂亮且清晰”。你不必成为设计师也能让你的作品看起来专业且昂贵。你只需遵循一些规则，我将为你介绍这些规则。


    这些规则适用于任何工具，无论是 Excel、PowerPoint、Power BI、Tableau 还是其他软件。这些工具中的图表元素名称可能不同，但配置原则是相同的。你在普通
    MS Excel 中学到的东西，将能够熟练地应用到高级程序中。


    ## 3.1 分析现成的设计样式


    Excel 提供了一整套模板来自定义图表的外观。让我们弄清楚它们适用于什么情况，又不适用于什么情况。


    要查看建议的选项，请选中任意图表并打开菜单中出现的“设计”选项卡。标准模板列表可以在“图表样式”部分以及“快速布局”按钮下的下拉菜单中看到。


    ![](img/537732_1_En_3_Figa_HTML.png)


    一张示意图展示了不同的选项，如文件、开始、插入、页面布局、公式、数据、审阅、视图、帮助、数据透视图分析、设计和格式。菜单栏中的“设计”和菜单按钮“快速布局”已被选中。


    ### 3.1.1 如何选择快速布局


    Excel 为我们的“付款动态”图表提供了 12 种模板选项。它们的不同之处在于某些元素的存在与否，以及它们的不同位置。


    ![](img/537732_1_En_3_Figb_HTML.png)


    十二个模板，其节点由顶点连接，描绘了带有必要数据元素集的付款动态图表，其中第二个布局被选中。


    在这些选项中，“布局 2”或多或少适合我们，因为它拥有必要的数据和元素集：


    *   图表标题。

    *   正确定位的图例（位于图表上方）。

    *   数据标签。

    *   仅保留水平轴（不需要垂直轴，因为已有数据标签）。

    *   没有网格线，以免干扰信息感知。


    其余的快速布局不适用于我们的任务：它们要么缺少必要的元素，要么包含太多不必要的元素。因此，当时间紧迫时，可以采用这种布局进行进一步的改进。


    我们不会使用这个选项，而是自行微调图表，以便你理解这个过程是如何运作的。但首先，让我们看看 Excel 在“图表样式”部分提供了哪些模板。

