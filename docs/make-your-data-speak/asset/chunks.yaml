- fmt: '### Inappropriate Funnel


    Many people believe that the funnel diagram is a symbol of an advanced CRM system,
    great sales analytics. Therefore, when they find it in MS Excel or Power BI, they
    try to use it at every opportunity. It often turns out to be out of place, and
    without explanations, it is impossible to understand what the author wanted to
    convey to us.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figh_HTML.png)


    A funnel chart exposes the number of customers in Chicago, Houston, Boston, Seattle,
    Los Angeles, New York, and Miami. Chicago has the highest number of customers
    (14,855). A cross mark is exhibited on the top left corner.


    Here, with the help of a funnel, they tried to compare branches by the number
    of customers. But from the outside it looks like this:


    - 4024 clients have moved from Houston to the Boston branch.

    - Of these, 2447 customers moved to a branch in Seattle.

    - And so the customers moved through the cities until they ran out. :)


    Of course, the author wanted to show something else: which branch has more customers.
    That is, a quantitative comparison on a scale is a rating. To do this, you do
    not need to shift the columns to the middle: we build them from zero on a regular
    bar chart.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figi_HTML.png)


    A bar chart exposes the number of clients by various branches. Chicago has the
    highest number of clients (14,855) and Miami has the least number (322). A tick
    mark is exhibited on the top right corner.


    “But in the funnel, the values just go from more to less!” the students say. “What’s
    wrong with the rating?” I’ll explain. The funnel is not needed to compare indicators.


    The funnel diagram is a special case of dynamics. And it is needed solely to visualize
    a step-by-step process in which at each stage there is a dropout.


    For example, it can be used to show how the number of clients changed from the
    first call of the manager to the conclusion of the contract. You see that after
    the presentation, few customers reach the demo version, but then there is a high
    conversion into a proposal and a contract.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figj_HTML.jpg)


    An illustration of a sales funnel depicts the call, presentation, demo version,
    proposal, and contract. The call has the highest value of 50 and the contract
    has the lowest of 7.


    ### Not All Pies Are Equally Useful


    Pie charts are used most often for other purposes. Let’s take a look at this visualization
    of the project portfolio.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figk_HTML.png)


    A bar graph depicts the project portfolio structure with percent. Done has the
    highest percentage of 26. Commissioning has the lowest percentage of 11. A cross
    mark is on the extreme left top.


    Everything seems to be done properly. A pie chart is selected for the structure,
    there are only five sectors on it, there are data labels, and categories titles
    fit horizontally. But no matter who I show it to, everyone doesn’t like it: someone
    suggests taking the labels outside the circle, someone says that you need to change
    the colors… But the problem is different.


    The purpose of the diagram is to show a state by project stages at the moment.
    Here we do not sort the stages from more to less, they follow each other: first
    planning, then design, then development, and so on. In fact, this is a chronological
    sequence, only not by calendar periods, but by stages of the project.


    This is not a structure, but a dynamic – we always display it from left to right
    along the horizontal axis. You can immediately see that 50 projects have been
    completed, 20 are on commissioning, 40 are at the development stage, and so on.
    Data labels with percentages, which are common for a pie chart, are not needed
    here and only confuse.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figl_HTML.jpg)


    A bar graph depicts the projects by stages in Phases. Done has the highest value
    of 50. Commissioning has the lowest value of 20. A tick mark is on the extreme
    right top.


    Once again, I will draw attention to the horizontal timeline. It may seem to some
    that a bar chart will work better, especially with longer labels.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figm_HTML.jpg)


    A bar graph depicts the projects by stages in Phases. Done has the highest value
    of 50. Commissioning has the lowest value of 20. A cross mark is on the extreme
    left top.


    This will be, if not fatal, but a mistake. By default, the eye perceives horizontal
    columns as a ranked list, and we need an emphasis on dynamics.


    There is another example of inappropriate use of pie in which there was an attempt
    to show which age groups our customer base consists of.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Fign_HTML.png)


    A pie chart of customer segmentation by age. From 20 to 29 age group has the highest
    percentage of 23. A cross mark is on the extreme left top.


    The sectors are sorted exactly as needed on the pie chart – from larger to smaller.
    But segments are age distribution intervals. That is, again we are dealing with
    a horizontal scale from minimum to maximum.


    The most obvious option is to show the size of the segments in columns. They no
    longer need to be colored, as it was with the sectors, and there is no need for
    a legend either: the age intervals are signed on the X-axis.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figo_HTML.png)


    A bar graph of customer segmentation by age. From 20 to 29 age group has the highest
    percentage of 23. A tick is on the extreme right top.


    You may wonder why correcting all the errors leads to charts with horizontal or
    vertical columns. But this is really the most functional way of visualization.


    Any kind of diagram should be chosen consciously. First, we determine what the
    data is in terms of meaning and what kind of data analysis it is. And only then
    we choose the appropriate diagram. This is not a creative, but an exclusively
    logical process.


    There are several variants of relevant diagrams for each type of analysis. The
    instructions in the following sections of this chapter will teach you how to choose
    correctly in each case. You can master the skill of data visualization without
    being a designer.


    ### 6.1.3 Summary


    **5 Types of Data Analysis**


    1. Rating – for quantitative comparison of indicators

    2. Dynamics – to understand changes over time

    3. Structure – for the analysis of the composition of the whole, a fraction of
    100%

    4. Relationships – to evaluate quantitative and logical relationships between
    several parameters

    5. Distribution – for segmentation on an interval or constant scale


    In 90% of cases, only three of them are used in corporate reporting: rating, dynamics,
    and structure.


    To avoid mistakes, you must first determine the type of data analysis, and then
    select the appropriate chart.


    ## 6.2 How to Choose Charts


    There are suitable and inappropriate diagrams for each type of analysis. For example,
    it is not a good idea to display the monthly dynamics on a circular one – we draw
    a line for the dynamics although you could also see bar charts on the timeline.
    Then the question arises: which option is better?


    First of all, it depends on the amount of data: five columns is one thing, and
    15 is different. I will tell you about the recommended rules, but they cannot
    be considered a strict algorithm. You will constantly encounter exceptions to
    the rules, because the choice of a diagram depends on other nuances. For example,
    it depends on the length of the category labels and the space allocated to the
    diagram on the screen.


    Additionally, the choice of the chart depends on how many data series you want
    to put on it: just actual indicators or their comparison with the plan, last year,
    industry benchmark. In this part, we’ll start with a simple one: how to choose
    charts for ranking, dynamics, and structure with a single row of data.'
