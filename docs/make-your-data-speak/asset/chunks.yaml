    \nA screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,\
    \ expenses by divisions, and items, along with division, month, and expense item\
    \ fields, in a dark color theme.\n\n#### Why the Theme Is Suitable\n\nAt first\
    \ glance, the palette may seem too pale due to its neutral pastel shades. You\
    \ can still create an original and functional dashboard style using these shades.\
    \ The palette offers interesting shades – brick, olive, and gold – in place of\
    \ the classic `traffic light` (green, yellow, and red).\n\n![](images/537732_1_En_4_Chapter/537732_1_En_4_Figbc_HTML.jpg)\n\
    \nA screenshot depicts a theme with different color palettes in dark, light, and\
    \ fade colors.\n\n#### Analyzing Faults\n\nThe theme itself has no obvious drawbacks,\
    \ but working with it, you can arrive at colors that are too pale or that merge\
    \ with each other. If you do not trust your intuition to choose competent color\
    \ combinations, do not take risks.\n\nHere, for example, the theme was an unfortunate\
    \ choice for the dashboard, and everything turned yellow again. This is what we\
    \ will fix.\n\n#### Fixing the Problem\n\nWe decided to move away from the standard\
    \ Excel layout – now we need to remember that a white background is only but an\
    \ option. You can use any color as long as it is not too bright.\n\nTo change\
    \ the background color, I select all the cells by clicking on the triangle in\
    \ the upper left corner of the Excel sheet, just above the row numbers. I choose\
    \ the lightest shade of gray for the fill. The fill of the chart area will remain\
    \ white.\n\nI choose light blue instead of yellow for the slicers, and this immediately\
    \ makes our dashboard calmer. I assign dark blue to the card background to make\
    \ the cards more visible.\n\nI will set the contrast between the columns and lines\
