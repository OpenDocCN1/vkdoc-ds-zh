- fmt: '# 4.4 Working with Colors and Fonts in Excel


    When developing a draft version of the dashboard, we used the standard Excel theme.
    It has its advantages: it does not take much time, and blue and orange colors
    contrast well with each other.


    There are disadvantages as well: this dashboard will not look original, much less
    expensive. We accepted it as a draft version and went on to advanced design. Our
    task is to create a dashboard visually different from the standard Excel style.


    Let us first study the tools offered by the program. What makes them different
    and how can we choose the right one?


    Tools for setting the “final” parameters:


    - Palettes – these are sets of colors that combine with each other well (in the
    words of MS Office creators).

    - Fonts – any selection will change the font on all elements of the dashboard.

    - Themes – each theme includes a set of “harmonious” colors as well as a set of
    fonts.


    All of them can be found in `Page Layout` menu tab in `Themes` section.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figak_HTML.png)


    A screenshot depicts an excel file that lists the options under the page layout
    with the selected options of themes, colors, fonts, and effects.


    ## 4.4.1 How to Work with Palettes


    This option is suitable if you are satisfied with the fonts and font sizes on
    the dashboard, but we still need to avoid the standard color design.


    You can view all the options available by clicking the `Colors` button – there
    are more than 20 combinations in the drop-down list. You can see how each of them
    looks on your dashboard by hovering over the palette.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figal_HTML.png)


    A screenshot depicts a dialog box of colors that lists the options under office
    with a list of different color patterns.


    ## 4.4.2 Unsuccessful Similar Palettes


    Among these options are many monochrome, non-contrasting combinations. They do
    not focus on the data and turn the dashboard into a monochrome canvas, and I would
    not recommend using them. Here are several palettes of this kind.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figam_HTML.png)


    A screenshot depicts several palettes of Blue warm, green, yellow, and red-violet,
    with different color patterns.


    Another disadvantage is that there is no set of colors for visualizing deviations.
    We use red to focus on negative indicators and green to focus on positive ones,
    while yellow helps to mark values close to critical. Non-contrasting Excel palettes
    have one or two of these colors.


    This is what a dashboard will look like if you use `Red and Purple` palette.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figan_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a light color theme.


    Nothing catches the eye in this color combination: there are no visual accents.
    Even `Target` and `Actual` are not different from each other, although there should
    be a clear contrast made between them. The purpose of any diagram is to simplify
    the comparison making it visual.


    ## 4.4.3 Suitable Palettes


    There are good palettes in Excel, too. It is quite possible to develop a decent
    design by introducing minor improvements. The following are some examples.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figao_HTML.png)


    A screenshot depicts a table, which has four columns of the Median, Marquee, Slipstream,
    and Aspect, with different color palettes.


    They are already more balanced, and there is a set of colors to focus on deviations
    with several combinations for the desired contrast.


    You do not have to choose the option in which Excel can color all the elements
    when choosing a palette. They can all be modified: you can change the color of
    the cards, slicers, columns, and lines of the graph. Select the desired element
    and use `Fill color` button in the main tab of the ribbon or in the context menu.


    To draw an example, I will focus on `Aspect` palette. It has several disadvantages
    as listed in the following:


    - The background card color, although not bright, still conflicts with the text.

    - There is not enough contrast between the indicators of the target and the actual,
    and the data labels for these categories are barely visible.

    - `Actual` columns are red, which is perceived as a deviation and negative indicator.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figap_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    Let us try and edit the original version, working around its faults. This is what
    I did.


    1. Selected contrasting colors for `Target` and `Actual` parameters, so that they
    are not associated with deviation colors. I chose blue and brown.

    2. Chose the lightest shade of the palette - light brown – for cards and slicers.

    3. Changed the headlines color from black to dark brown so that they do not attract
    attention.

    4. Selected a harmonious shade of brown for heading dividers.

    5. Reset the data labels a shade darker than that of the columns and lines.


    The result is a dashboard in a calmer color scheme with an emphasis on data made
    through the contrast of `Target` and `Actual`.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaq_HTML.jpg)


    A screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,
    expenses by divisions, and items, along with division, month, and expense item
    fields, in a dark color theme.


    ## 4.4.4 Working with Fonts: Important Points


    If you want to “play with fonts” like a real designer, you can also do this in
    `Page Layout` tab in `Themes` section: there are more than 25 options in the drop-down
    list.


    It may seem that fonts present no difficulty. However, they affect both the appearance
    and the overall perception of the dashboard.


    Please note: the font changes automatically on all elements of the dashboard,
    except the labels and indicators in KPI cards. Microsoft failed to get even these
    small things right. You will have to change the font in the cards manually. These
    small things distinguish professional performance from amateur work.


    Fonts for inscriptions and titles can be different. It is important that the caption
    should have the “cleanest” font, without serifs and other decorations.


    Another important rule is to use the same font size for data labels and inscriptions
    on all charts and graphs. If we chose 12 for a graph with expenditure dynamics,
    it should remain the same for all visual elements.


    **Tip!**


    *Avoid fonts with bold lettering, serifs, high letter density, or small letter
    spacing. The font should not attract too much attention. It is better to choose
    traditional Arial, Calibri, or Tahoma.*


    By and large, if you are not satisfied with the fonts already on the dashboard,
    I recommend going straight to the theme selection in the same menu.'
