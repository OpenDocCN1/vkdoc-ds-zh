- fmt: '# 6.5 Funnel, Waterfall, and Magic Pillow


    In Part 6.3, I describe life hacks for displaying multiple data series on charts,
    as well as how to build a non-standard bullet chart based on regular columnar
    charts. But there are also advanced charts that can be built in Excel.


    The most popular of the non-standard ones are the funnel and waterfall diagrams.
    Salespeople and marketers dream of visualizing a funnel, and financiers dream
    of factor analysis on a waterfall diagram.


    For a long time, many people believed that it was impossible to build them in
    Excel. Someone used additional add-ins, for example, Think-cell, to make such
    a diagram in PowerPoint. Someone thought that only a BI system was needed for
    this, otherwise there was no way. And there are two nuances here:


    - Both the funnel and the waterfall are in the new versions of Excel, but it is
    impossible to build them on pivot tables.

    - Both diagrams can be made in older versions with the help of “pillows” – auxiliary
    transparent rows.


    ## 6.5.1 Funnel = Structure + Dynamics


    Initially, the sales process was visualized using a funnel, divided into stages.
    There are a lot of calls and cold contacts at the entrance, some of them go into
    meetings, presentations, and so on before signing the contract.


    On the one hand, it is a sequential process, that is, dynamics. And on the other
    – the analysis of changes in the structure: we look at what proportion is eliminated
    at each stage. A Funnel diagram is suitable for combining these two types of data
    analysis.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcg_HTML.jpg)


    An illustration depicts the sales funnel with the call, presentation, demo version,
    business proposal, and contract.


    In HR, the same approach is used to visualize the recruitment process. It is important
    as well that the funnel is constantly replenished with new candidates. And it
    is also known that at each subsequent stage, there will be a dropout. Here is
    an example of a diagram built in Power BI – I like it that you can immediately
    display the conversion of each stage.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figch_HTML.jpg)


    An illustration of recruiting process funnel with awareness, consideration, selection,
    interest, application, and hire.


    ### How to Build a Funnel in Excel 2019 and Above


    Starting from version 2019, this chart is already available in the standard Excel
    set. I was pleasantly surprised by its default view: minimum side clearance, contrasting
    labels. Everything is fine, but Excel refuses to build it on pivot tables. But
    this chart can be made interactive with the possibility of filtering by slicer.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figci_HTML.jpg)


    A table depicts the stage funnel, manager Mary is enabled, and sales process funnel.


    It turns out that the slicer filters the pivot table on the left, and the cells
    on the right refer to it. So we outwitted Excel and built a clickable funnel.


    #### Life Hack for Older Versions


    Not everyone has Excel 2019 or Office 365, so I’ll show you how to build such
    a chart in any old version. This can be done using an additional column in the
    table and a bar chart.


    In fact, the funnel is a bar chart, only aligned in the center. Excel does not
    allow you to adjust such alignment, and this is exactly what the auxiliary calculation
    column – the so-called “pillow” will help. In it, we will indicate how much the
    data column needs to be moved away from the category axis so that the diagram
    takes the form of a funnel. In the future, we will make this pillow invisible.


    **Step 1.** We add a new column with the name “Pillow” to the table. In each row
    of this column, you need to set values using a formula. In the first row with
    the largest number, this value is zero, because this column of the chart does
    not need to be moved anywhere.


    For each subsequent stage, in the “Pillow” column, we set the formula: divide
    the difference in the values of the funnel at the previous and current stages
    by 2 and add the value of the pillow from the previous stage.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcj_HTML.jpg)


    A table depicts this stage with funnel and pillow values for each stage.


    In our case, the formula looks like this: `=(E2-E3)/2+F2`, where `E` is a column
    with numbers, `F` is a column with pillow values, and `2` and `3` are row numbers
    with the necessary data.


    You cannot add the previous value every time, but always subtract from the first,
    the largest (I have this number of calls). To do this, to maintain cell `E2` (we
    put a `$` sign in front of the letter and digit or just press `F4`).


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figck_HTML.jpg)


    A table depicts this stage with funnel and pillow values for each stage.


    **Step 2.** Now there are three columns in our table. We select them and insert
    a stacked bar chart from the menu ribbon. What Excel will build at this stage
    does not look like a funnel at all yet.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcl_HTML.jpg)


    A bar graph depicts the sales process with a funnel and pillow value. The call
    has the highest value of 40 for the funnel.


    The fact is that the pillow should go first and move the funnel to the center.
    To do just that, we call the “Select Data…” menu and in the “Select Data Source”
    window that opens, we change the order of the columns: we lower the “Funnel” row
    down by clicking the arrow button.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcm_HTML.png)


    A page depicts the select data source with chart data range, funnel, and pillow
    option enabled with the horizontal axis labels.


    The second step, I hope you have already learned. It is necessary to check the
    “Categories in reverse order” on the axis for the hundredth time. Then it will
    become more like a prototype of the desired diagram.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcn_HTML.jpg)


    A bar graph depicts the sales process with a funnel and pillow value. The call
    has the highest value of 40 for the funnel.


    **Step 3.** In order for the diagram to take the shape of a funnel, now we need
    to make the “Pillow” row invisible, that is, simply remove the color fill. All
    that remains is to set up the funnel according to the checklist from Part 3.4:


    - Adding data labels

    - Removing the axis with the values

    - Removing the gridlines

    - Setting a gap width of 10% for the data series

    - Removing the legend

    - Increasing the font size of inscriptions and data labels to 12


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figco_HTML.png)


    An illustration of the sales process funnel with the call, presentation, demo
    version, proposal, and contract.'
