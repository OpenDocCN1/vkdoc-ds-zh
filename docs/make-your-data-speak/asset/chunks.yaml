  trans: '

    ### “目标”卡片


    在仪表板工作表中，我们开始创建第一个 KPI 卡片。将光标放在单元格中，我们添加一个指向“草稿”工作表上通用目标指标的链接。为此，请输入 `= Draft!A56`，其中
    `A56` 是包含示例的工作表上的单元格地址。这样，我们就能在仪表板工作表上获得所需的值。


    ![](img/537732_1_En_2_Figf_HTML.jpg)


    一个 Excel 表格片段，包含四列（1、2、3）和七行（A、B、C、D、E、F、G）。在第 C 行中显示了一些数值。


    **如果链接显示错误，请禁用 `GETPIVOTDATA` 函数**


    最初，单元格链接可能如下所示：


    `=GETPIVOTDATA("Sum of Target";Draft!$A$56)`。在这种情况下，您需要禁用 `GETPIVOTDATA` 函数。


    这个函数很有用：它可以从数据透视表中提取必要的数据，以便在其他表格或计算中使用。但在创建仪表板时，它会成为一个麻烦。


    在示例中的任意单元格中，转到“数据透视表分析”选项卡 ➤ “数据透视表” ➤ “选项” ➤ 取消勾选“生成 GetPivotData”。


    ![](img/537732_1_En_2_Figg_HTML.png)


    一个片段展示了已点击的文件工具图标。它打开了选项工具并勾选了“生成并获取数据透视数据”。


    这样，您将获得数据透视表单元格的链接，而无需使用 `GETPIVOTDATA`，而是以通常的方式，采用指向单元格 `A1`、`B2` 或 `C4` 的链接形式。


    请注意，如果在禁用该函数之前已经创建了指向数据透视表的链接，那么在禁用之后，这些链接将保持其原始形式。


    **提示！**


    *如果卡片中的数字包含大量字符，请更改其位数。例如，将其转换为千或百万。这样，指标将变得更紧凑且易于理解。*


    我们为指标命名并设置其位数为“目标, $K”。单元格中的初始数据除以 1000。剩下的只是设置数字格式。我们在“开始”选项卡的“数字”部分中执行此操作：


    *   点击“千位分隔样式”图标（看起来像逗号）将使用千位分隔符格式化数字。

    *   点击“减少小数位数”旁边的图标（带右箭头的 000）将显示更少的小数位数。


    ![](img/537732_1_En_2_Figh_HTML.jpg)


    一张以千美元为单位的“目标支出”截图，显示了图表的一个单一数值 7820。


    **不要仅仅为了一个单一数值而构建图表！**


    ![](img/537732_1_En_2_Figi_HTML.jpg)


    一张以千美元为单位的“目标支出”片段，显示了图表的一个单一数值 7820。


    这种可视化方式并没有增加信息量，反而分散了对数字的注意力，并以刻度、线条和柱状图的形式形成了信息噪音。没有东西可以与该单个柱状图进行比较，因此它毫无意义——请将
    KPI 呈现在卡片中。


    为了聚焦于指标值，我们将字体增大到 20 磅。


    ![](img/537732_1_En_2_Figj_HTML.jpg)


    一个片段展示了“开始”工具图标及其选项，即剪切、复制和格式刷，并选择了 20 作为字号。


    填充色有助于将注意力集中到卡片上：将其添加到包含数字和指标名称的单元格中。不要选择深色或明亮的颜色，否则数值可能会在背景色中难以辨认。


    ![](img/537732_1_En_2_Figk_HTML.jpg)


    一个片段展示了电子表格的工具栏和“开始”工具图标及其选项，以及写在列中的数字值。


    要选择卡片大小，请拉伸包含数值的列。在这种情况下，数字的对齐方式可能会被打乱。要修复此问题，我们将在“开始”选项卡上设置单元格格式：在“数字”部分，点击带箭头的矩形打开对话框窗口。在打开的“单元格格式”窗口中，您必须：


    *   在“数字”部分选择“数字”类别。

    *   确保小数位数为零。

    *   确保在“使用千位分隔符 (，)”字段中有一个勾选标记。

    *   点击“确定”。


    ![](img/537732_1_En_2_Figl_HTML.jpg)


    一个仪表板展示了已点击的“数字”栏，打开了“类别”选项，勾选了“使用千位分隔符”框，并给出了一些负数。


    就这样——带有目标指标的卡片就准备好了。


    **“实际”和“执行”卡片：创建与配置。**


    然后，我们只需复制已创建的卡片：复制，后退两列，留出间隙，然后粘贴。更改复制卡片中的单元格链接（现在需要实际指标，而不是目标指标）。与第一张卡片一样，这里也需要将指标除以
    1000：确保公式中保留了这一点。


    ![](img/537732_1_En_2_Figm_HTML.jpg)


    一个电子表格工具栏的摘录。包含两个千美元目标值，并且已点击文件工具图标。


    我们将新卡片的标题更改为“实际, $K”。如果数据不匹配并以 `"#######"` 的形式显示在单元格中，这没什么大不了的。要查看实际值，只需拉伸列宽即可。剩下的只是将获得的数据调整到所需的位数。


    ![](img/537732_1_En_2_Fign_HTML.jpg)


    一个片段展示了电子表格的上部区域。它包含三个用于在列宽中输入数值的数字值。


    第二张卡片“实际, $K”已创建。由于我们复制了一张已配置好的卡片，因此无需重复所有配置步骤。


    要创建第三张“执行”卡片，请复制已创建的卡片之一，并将其粘贴到距离相邻卡片两列的位置。要计算此卡片中的值，只需插入一个公式，将“实际, $K”卡片中的值除以“目标,
    $K”卡片中的值。


    ![](img/537732_1_En_2_Figo_HTML.jpg)


    一个片段展示了仪表板的上部区域。它包含三个数值。第三列的值是一个插入用于计算的公式。


    结果值以百分比显示；为此，请在“开始”选项卡的“数字”部分中点击“百分比样式”按钮。我们使创建的卡片在视觉上具有相同的大小——然后它们就准备好了。


    ![](img/537732_1_En_2_Figp_HTML.jpg)


    一个片段展示了电子表格的工具栏。它展示了三个结果值，即目标千美元、实际千美元和执行百分比。


    **提示！**


    *不要过度使用 KPI 卡片的数量。如果客户要求在其上显示 7–10 个指标，请解释这会使数字难以感知，并会导致仪表板过载。我建议添加不超过六张卡片。*


    ### 总结


    KPI 卡片是用户在仪表板上首先看到的内容。不需要图表和鲜艳的颜色，所有注意力都应集中在重要的数字指标上。我们通过几个步骤创建了这些元素。


    *   在包含数据透视表的工作表上，我们创建了一个包含目标和实际值通用指标的示例。

    *   在包含图表模板（“仪表板”）的工作表上，设计了第一张卡片：它引用了另一工作表上包含目标指标的单元格。我们为卡片调整了位数并赋予了清晰的标题。

    *   我们设计了第一张卡片的外观：增大了数字指标的字体，并添加了浅蓝色填充以将注意力集中在 KPI 上。

    *   通过复制已创建的卡片，创建了两张新卡片：“实际”和“执行”。在这种情况下，您无需重复所有配置步骤，但需要更改“执行”卡片的指标公式。

    '
- fmt: '### 2.3 Align the Dashboard and Add a Header


    Due to the change in the size of the cards, the diagrams on the layout stretched,
    and some of the data on them went off the screen. But it is important for us that
    the user sees all the information at once.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figq_HTML.jpg)


    A snippet illustrates a line graph and two bar graphs, namely monthly targets,
    expense items, and the division of management and employees.


    To fit everything on one screen, you need to change the sizes of graphs and charts.
    To do this, select a block with a diagram and adjust the size by moving the lines
    of its borders.


    We do the same with the rest of the visual elements. If you need to move the block
    with the diagram exactly horizontally or vertically, select it and, holding down
    the `Shift` key, move it with the mouse.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figr_HTML.jpg)


    A snippet illustrates the process of the reduction of the block size. It consists
    of a line graph and two bar graphs namely division, expense item, and month.


    Remove the extra row between the cards and the visual elements. Now let’s add
    the dashboard title to the sheet.


    *   We need three empty rows above the KPI cards: add if there are not enough
    of them.

    *   In the second empty row, in the cell above the first card (in our case it’s
    `D2`), write the title of the dashboard “Wage fund analysis.”

    *   Set the font size of the title to 20 points: the same as the numerical indicators
    in the cards.


    To complete the work on the dashboard at this stage, it remains only to remove
    the grid on the dashboard sheet. To do this, just one mouse click is needed: on
    the “View” menu tab, uncheck the “Gridlines” parameter.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figs_HTML.png)


    A snippet illustrates the revenue fund survey. It consists of a line graph and
    two bar graphs namely division, expense item, and monthly targets.


    This is what our dashboard looks like after all the assembly operations.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figt_HTML.jpg)


    A snippet illustrates the toolbar of the spreadsheet. It represents selecting
    the "view" option and an unchecked "guideline" option.


    ### 2.3.1 Summary


    Practice shows that any carelessness reduces not only the value of your work but
    even the credibility of the data. A well-designed dashboard costs more. Therefore,
    it is important to pay attention to the proper arrangement of elements and their
    alignment.


    Here’s what we did for this:


    *   We changed the size of the charts to fit everything on one screen

    *   Aligned the location of visual elements

    *   Added the dashboard title to the empty lines above the cards

    *   Removed the gridlines from the Excel sheet


    # 3. Anatomy of Diagrams


    We built a dashboard pretty quickly. And it looks like an interactive analytical
    application, not just a set of charts and filters, as it usually turns out in
    Excel. It seems to many that it is already good, but we are only at the beginning
    of the journey.


    This part of the book is about fine-tuning the elements of the diagram, from which
    the first impression is “beautiful and clear.” You don’t have to be a designer
    to make your work look professional and expensive. You just need to follow a number
    of rules, which I will tell you about.


    These rules are relevant for any tool, be it Excel, PowerPoint, Power BI, Tableau,
    or some other software. The names of the chart elements in them may differ, but
    the principles of configuration are the same. What you will learn to do in an
    ordinary MS Excel you will be able to apply competently in advanced programs.


    ## 3.1 Analyzing Ready-made Design Styles


    Excel offers a whole set of templates to customize the appearance of charts. Let’s
    figure out what they are convenient for, and what they are not suitable for.


    To view the suggested options, select any diagram and open the “Design” tab that
    appears in the menu. The list of standard templates can be seen in the “Chart
    Styles” section and in the drop-down menu under the “Quick Layout” button.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figa_HTML.png)


    A snippet illustrates different options like file, home, insert, page layout,
    formulas, data, review, view, help, pivot chart analyze, design, and format. The
    menubar Design and menu button Quick Layout are selected.


    ### 3.1.1 How to Choose a Quick Layout


    Excel offers 12 template options for our “Payments dynamics” chart. They differ
    in the presence or absence of some elements, as well as their different location.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figb_HTML.png)


    Twelve templates with nodes joined by vertices depict the payment dynamics chart
    with the necessary set of data elements out of which the second layout is selected.


    Of these options, “Layout 2” is more or less suitable for us, because it has the
    necessary set of data and elements:


    *   Chart title.

    *   Correctly positioned legend (above the chart).

    *   Data labels.

    *   Horizontal axis only (vertical is not needed because there are data labels).

    *   There are no gridlines so as not to create barriers to the perception of information.


    The rest of the quick layouts are not suitable for our tasks: they either do not
    have the necessary elements, or there are a lot of unnecessary ones. Therefore,
    when there is no time, such a layout can be taken for further improvement.


    We will not use this option, but we will fine-tune the diagram ourselves so that
    you understand how this process works. But first let’s see what templates Excel
    offers in the “Chart Styles” section.'
  raw: '## 2.3 Align the Dashboard and Add a Header


    Due to the change in the size of the cards, the diagrams on the layout stretched,
    and some of the data on them went off the screen. But it is important for us that
    the user sees all the information at once.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figq_HTML.jpg)


    A snippet illustrates a line graph and two bar graphs, namely monthly targets,
    expense items, and the division of management and employees.


    To fit everything on one screen, you need to change the sizes of graphs and charts.
    To do this, select a block with a diagram and adjust the size by moving the lines
    of its borders.


    We do the same with the rest of the visual elements. If you need to move the block
    with the diagram exactly horizontally or vertically, select it and, holding down
    the Shift key, move it with the mouse.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figr_HTML.jpg)


    A snippet illustrates the process of the reduction of the block size. It consists
    of a line graph and two bar graphs namely division, expense item, and month.


    Remove the extra row between the cards and the visual elements. Now let’s add
    the dashboard title to the sheet.


    *   We need three empty rows above the KPI cards: add if there are not enough
    of them.


    *   In the second empty row, in the cell above the first card (in our case it’s
    D2), write the title of the dashboard “Wage fund analysis.”


    *   Set the font size of the title to 20 points: the same as the numerical indicators
    in the cards.


    To complete the work on the dashboard at this stage, it remains only to remove
    the grid on the dashboard sheet. To do this, just one mouse click is needed: on
    the “View” menu tab, uncheck the “Gridlines” parameter.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figs_HTML.png)


