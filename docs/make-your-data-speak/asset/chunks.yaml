- fmt: '### How to Build a Waterfall Chart in Old Versions of Excel


    If you have Excel 2013 or still 2010, you can also build the same beautiful waterfall
    using a “pillow.” I will say even more – you will have more freedom of action.
    For example, you can make a horizontal waterfall based on a bar chart and accommodate
    long category names.


    **Step 1.** In the table, we create the `Minus` and `Plus` columns. In the first
    one, we will transfer indicators with negative values from the `Sum` column (without
    a minus sign!), and in the second – with positive ones. In the `Sum` we leave
    only our initial indicator – the size of the gross profit. Based on the resulting
    table, we will build a diagram.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcw_HTML.png)


    A representative table exhibits the lists of items (including gross profit, net
    profit, and rent), sum values, minus values, and plus values. 5,109,518 is the
    sum value of gross profit.


    **Step 2.** Now we will fill the empty column `Sum` – for this we will need formulas.
    First, fill in the second cell of the column, under the gross profit indicator.


    Enter the formula: mark the previous cell of this column ➤ subtract the value
    from the `Minus` in the active row ➤ add the previous cell of the `Plus` column.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcx_HTML.png)


    A cropped screenshot exposes a table that represents the lists of items, sum values,
    minus values, and plus values. A formula is exhibited in the second cell of the
    column, under the gross profit indicator.


    In my case, the formula will look like this: `=C3-D4+E3`. After that, it will
    only be necessary to stretch the formula for the entire `Sum` column. If you have
    calculated everything correctly, then the last two values (income tax and net
    profit) will be the same for you. As a result, we get this table.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcy_HTML.png)


    A representative table exhibits the lists of items (including gross profit, net
    profit, and rent), sum values, minus values, and plus values. Gross profit has
    the highest sum value (5,109,518).


    **Step 3.** Select the table and insert a stacked bar chart. We get the base for
    the future “waterfall.” Then we make the `sum` row transparent, but the first
    and last recumbent columns in this row should become totals. We select each one
    separately and paint it gray.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcz_HTML.png)


    A waterfall chart exposes the ranges of net profit, income tax, other expenses
    and income, rent, payable and receivable percentages, management expenses, and
    gross profit. The bars represent the minus and plus values.


    Next – setting up the design according to the checklist from Part 3.4. We get
    a horizontal waterfall chart, which has no analogs even in new versions of Excel.
    It solves the problem of long category names, because of which the inscriptions
    on the waterfall are cut off or rotated.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figda_HTML.png)


    A horizontal waterfall chart exhibits the cash flow. It exposes the values of
    gross profit: 5,110, net profit: 2,007, rent: 96, receivable percentage: 174,
    and income tax: 344.


    According to this principle, you can also create a vertical waterfall chart, taking
    as a basis a column stacked chart instead of a bar chart. If you try, it will
    look identical to the sample.


    There are many more nuances of factor analysis visualization. For example, adding
    columns with subtotals or “cumulative” recalculation from the beginning of the
    year with filtering through pivot tables. We can devote a couple more chapters
    to this, but my goal is to give you a general understanding of the idea, the principle
    of operation, without going deep into technical details.


    I also share this approach, so I stopped at two popular charts. Although there
    are handymen who build more complex flowcharts and connection graphs. But this
    requires more serious preparation of data, calculation formulas, and even macros.
    Of the new unusual ones in Excel, there is also a sunburst chart, but it doesn’t
    make any sense, so I didn’t consider it.


    I also didn’t tell you about the nuances of building scatter plots and bubble
    charts, because they are not used on management dashboards. On static presentation
    slides, you can still adjust the size and format of labels. But with dynamic data
    filtering, column-based shapes remain the most reliable. And then the tricks begin:
    then make the row transparent, then make a white font on a white background.


    I think this is a useful workout for the brain. When this becomes a habit, you
    make the necessary visualization in ten minutes, while others spend hours trying
    to verbally explain their idea and coordinate layouts. This is the freedom of
    action and flexibility of work in the new digital world.


    ### 6.5.3 Summary


    In new versions of Excel, advanced charts appear that display combinations of
    types of analysis for specific business cases. They don’t work on pivot tables,
    but this is easily solved by putting links to neighboring cells.


    Knowing the anatomy of diagrams, you can build them on the basis of ordinary columns
    and even get more freedom of action at the same time. The main trick is an auxiliary
    transparent row.


    **Funnel = dynamics + structure**


    1. Add a new column to the table and calculate the pillow values in it according
    to the specified formula.

    2. Build a bar chart with accumulation and put the `Pillow` row first.

    3. Remove the color fill from this row so that it becomes transparent.

    4. Design the chart according to the checklist.


    **Waterfall = dynamics + rating**


    1. Add additional columns with negative and positive values to the table.

    2. Fill in the main column with new pillow values according to the given formula.

    3. Build a stacked column chart. Make the row with the pillow transparent, only
    return the color to the first and last columns – these are “bridge supports.”

    4. For deviation factors, set the colors according to the traffic light rule.

    5. Design the appearance of the chart according to the checklist.'
