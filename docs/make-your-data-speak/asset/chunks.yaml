    There are three tools for placing accents:


    *   Font size


    *   Bold


    *   Capital letters


    It is quite enough to choose one of them, rather than use them all at once. Otherwise,
    you will get an explicit overkill, as in this example.


    The design of the columns raises no less questions. First of all, they are very
    thin: that’s also why all the attention goes to the title. Secondly, the gradient
    on them looks superfluous decoration – there is no practical sense in it.


    Also, this style template does not provide data labels, and the user does not
    see the exact numeric values. The grid helps a little to correlate the length
    of the columns with the labels on the X-axis, but its vertical lines seem to divide
    these columns into parts and violate their “integrity.”


    ### 3.1.3 What Should Be the Business Graphics: Recommended Samples


    The diagrams look different in the proposed templates and styles, but none of
    the options is suitable for our purposes. In the following parts, we will customize
    the desired style ourselves and create a minimalistic diagram template for solving
    business problems.


    The graph will have the necessary minimum: title, legend, and data labels. We
    will disable the auxiliary elements that Excel offers by default in order to focus
    on the main data.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figh_HTML.png)


    A line graph of two fluctuating curves with points depicts the exact data on the
    sum of the target and the sum of actual payment dynamics, respectively, from January
    to June.


    We will also put the bar charts in order. We will leave the necessary minimum,
    but we will remove the gap between the columns on the chart so that the target
    and actual indicators of each division look like a single block.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figi_HTML.jpg)


    A bar graph depicts data of the sum of the target and the sum of actual values
    of commercial employees, logistics and service, production workers, and company
    management. The sum of actual value for production workers is the highest.


    Let’s also deal with the design features of the bar chart “Expenses by items,”
    we will build the correct sorting of columns on it: Excel has its own surprises
    here.


    ### 3.1.4 Summary


    By default, Excel builds “rough” versions of charts, and offers a set of layouts
    and styles for their design. We checked some of them to see if these options are
    suitable for us.


    *   We examined the proposed express layouts on the “Design” tab: the required
    data set contained only one of them.


    *   We made sure that this single express layout also needs additional settings.


    *   We tested several standard chart styles, noted the pros and cons of each.


    According to the results of such a test, it became clear that none of the proposed
    standard options would suit us without improvement. Therefore, we will continue
    to delve deeper into the anatomy of diagrams and add fine-tuning ourselves.'
  trans: '

    ### 3.1.2 模板样式存在什么问题


    在每种建议的样式中，某些设置已经完成：图表的背景、图例的位置、字体大小、线条或柱形的视觉设计。


    ![](img/537732_1_En_3_Figc_HTML.png)


    一个片段展示了包含某些数据的十三种视觉设计或样式选项，其中第十二种设计被选中。


    让我们看看几个建议的选项，并找出它们为何不适合我们，以及设计中应避免哪些错误。


    **以数据为重点的模板。** 作为第一个例子，我们考虑一种带有明亮大圆点的样式变体。


    ![](img/537732_1_En_3_Figd_HTML.png)


    一张折线图展示了波动曲线，曲线上的圆点标示了从一月到六月目标总和与实际总和的数据。


    圆点将注意力吸引到数据上，这使图表显得独特。但该模板仍有缺陷。


    灰色渐变背景使图表顶部变亮，底部变暗。对于商务图表，这种装饰没有实际意义。此外，白色数据标签在此背景下完全看不清。


    网格也存在问题。线条从顶部几乎不可见，越靠近底部变得越粗——这给图表增加了“重量感”。而且，网格在此处并未发挥其功能。如果没有标签，它有助于将数据点与 Y
    轴上的数值对应起来。但这里有标签，却没有 Y 轴。


    **深色背景上的模板。** 为了全面了解可用的样式，我们不仅限于“付款动态”图表的模板——我们还将考虑一个按部门划分的费用图表选项。


    ![](img/537732_1_En_3_Fige_HTML.jpg)


    一张深色背景的柱状图展示了商业员工、物流与服务、生产工人以及公司管理层的目标总和与实际总和。生产工人的实际总和最高。


    深色背景上的样式模板以其“霓虹”般的、仿佛发光的柱形吸引眼球。但对于我们这里的实际使用来说，它并不合适。


    首先，这里没有数据标签——我们看不到具体的数值。其次，网格线越靠近底部越“模糊”——这使得难以将小柱形与 Y 轴上的数值对应起来。第三，不清楚柱形为何需要“发光”。毕竟，我们的目标是清晰地传达业务信息，而不是在仪表盘上模拟舞池。


    **带垂直标签的模板。** 在建议的样式中，也有不带彩色背景的选项。我们来看其中一个。


    ![](img/537732_1_En_3_Figf_HTML.jpg)


    一张柱状图展示了商业员工、物流与服务、生产工人以及公司管理层的目标总和与实际总和的数据。生产工人的实际总和最高。


    这种样式看起来不错，但它也有太多缺点，不适合用在仪表盘上。


    垂直数据标签很糟糕。为了阅读它们，用户不得不歪着头，这绝对无助于舒适地查看报告。


    柱形非常细，它们之间的间距非常大。这没有给我们带来任何优势，只是在图表上形成了大量空白区域。


    另一个问题是类别标签全部使用大写字母。这不仅是因为它们占用更多空间并造成不必要的强调。整句的大写字母会给人“喊叫”的感觉，因此被认为是品味不佳的表现。


    缩写或短名称中使用大写字母是正常的，关键在于不要过度使用强调。接下来的图表样式模板中就有这样的例子。


    **柱形带渐变的模板。** 为了完整呈现，我们再来看一个条形图标准样式的变体。


    ![](img/537732_1_En_3_Figg_HTML.jpg)


    一张水平条形图展示了假期储备金、工资、预算外资金、民事合同和奖金的实际支出总和与目标总和的数据。


    首先引人注目的是图表的标题。我不会批评大写字母——它们有时是合适的。但是。在这里它是最显眼的元素，分散了对数据的注意力。


    有三种工具可以放置强调重点：


    *   字体大小

    *   加粗

    *   大写字母


    选择其中一种就足够了，而不是同时全部使用。否则，就会像这个例子一样，明显过度。


    柱形的设计也引发了不少问题。首先，它们非常细：这也是为什么所有注意力都集中到了标题上。其次，柱形上的渐变看起来是多余的装饰——没有实际意义。


    此外，这种样式模板不提供数据标签，用户看不到精确的数值。网格线稍微有助于将柱形的长度与 X 轴上的标签对应起来，但它的垂直线似乎将这些柱形分割成几部分，破坏了它们的“完整性”。


    ### 3.1.3 商业图表应是什么样的：推荐示例


    在提供的模板和样式中，图表看起来各不相同，但没有一个选项适合我们的目的。在接下来的部分中，我们将自行定制所需的样式，并创建一个用于解决业务问题的极简图表模板。


    图表将包含必要的最小元素：标题、图例和数据标签。我们将禁用 Excel 默认提供的辅助元素，以便专注于主要数据。


    ![](img/537732_1_En_3_Figh_HTML.png)


    一张带有数据点的两条波动曲线折线图，分别描绘了从一月到六月目标总和与实际付款动态的精确数据。


    我们也将整理一下柱状图。我们会保留必要的最小元素，但会移除图表中柱形之间的间隙，从而使每个部门的目标和实际指标看起来像一个整体。


    ![](img/537732_1_En_3_Figi_HTML.jpg)


    一张柱状图描绘了商业员工、物流与服务、生产工人以及公司管理层的目标总和与实际总和的数据。生产工人的实际总和最高。


    我们还要处理“按项目分类的费用”条形图的设计特点，并对其进行正确的柱形排序：Excel 在这方面有它自己的“惊喜”。


    ### 3.1.4 总结


    默认情况下，Excel 生成的是图表的“粗略”版本，并提供一组布局和样式用于设计。我们检查了其中一些选项，看看它们是否适合我们。


    *   我们检查了“设计”选项卡中提供的快速布局：所需的数据集仅包含其中之一。

    *   我们确认了这唯一的快速布局也需要额外设置。

    *   我们测试了几种标准图表样式，并记录了每种样式的优缺点。


    根据此测试的结果，很明显，不经改进，所提议的任何一个标准选项都不适合我们。因此，我们将继续深入探究图表的内部结构，并自行进行微调。'
- fmt: '## 3.2 Setting Up Data Labels


    According to our graph, it is already approximately clear how the planned and
    actual payments have changed over time. It can be seen that there was a slight
    increase in expenses in April. Or that the actual line slightly exceeds the target.


    But it is impossible to discern the exact value here. For example, how much did
    the company spend in May? This requires data labels. At the same time, it is important
    to make them visual: it happens that the labels seem to be there, but it is very
    difficult to see these small numbers against the background of other elements.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figj_HTML.jpg)


    A line graph has two fluctuating curves with points representing the exact data
    of the sum of the target and the sum of the actual values from January to June.


    ### 3.2.1 How to Add Data Labels


    First of all, we will add the data values to the graph. There are three ways to
    do this.


    **Solution 1.** Select the block with the graph and click “Add chart element”
    on the “Design” menu tab. From the drop-down list, select the sub-item “Data labels”
    and specify exactly where you want to place them.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figk_HTML.jpg)


    A snippet consists of a line graph depicting the data of the target and actual
    in thousand dollars getting prepared by several selected data labels and designs.


    **Solution 2.** Select the block with the graph and click on the icon on the right
    in the form of a green cross. In the “Chart Elements” menu that appears, check
    the “Data Labels” box and select their location at the top.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figl_HTML.png)


    A snippet consists of a line graph with fluctuating curves depicting the data
    on the target and actual values in thousand dollars along with the execution percent
    of 104 and a selected data label and design.


    **Solution 3.** Select the graph line by clicking on it and open the context menu
    with the right mouse button. Select “Add Data Labels” ➤ “Add Data Labels.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figm_HTML.jpg)


    A snippet illustrates the line graph with fluctuating curves depicting the data
    from January to June on the sum of the target and the sum of the actual values
    along with right-click option.


    All these methods lead to the same result, but I use the second one, where data
    labels are added by clicking on the “+” icon to the right of the chart.


    ### 3.2.2 Labels Format: Getting Rid of Long Numbers


    Data labels have appeared. But there are nine figures in each number: it is difficult
    to perceive this, so the number of figures in the numbers should be reduced.


    First, let’s change the bit depth of the Y axis from units to thousands.


    1.  Select the values on the Y axis with a mouse click.

    2.  Right-click the context menu and select “Format Axis …”

    3.  In the panel that opens on the right near the “Display units” field, select
    “Thousands” from the drop-down list.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Fign_HTML.jpg)


    A snippet consists of a line graph with the execution of 104% depicting the data
    for January and February with the values in thousands along with a Format Axis
    menu on right with formatting options.


    We set the bit depth of the axis, but the same nine figures remained in the labels.
    To fix this, we will also change the format of the data labels.


    1.  Select a series of data on the graph with one click on any number. To select
    one number, you need to click on it twice.

    2.  Open the context menu with the right mouse button and select “Format Data
    Labels…”

    3.  In the panel that opens on the right, in the “Number” section, set the “Number”
    category.

    4.  In the “Decimal places” field, specify “0” and tick the checkbox next to “Use
    1000 Separator (,).”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figo_HTML.jpg)


    A snippet depicts a line graph with the values in thousands with the execution
    of 104% with the Format Data Labels menu showing the level and text options on
    the right side.


    The selected data series has acquired the desired form – the numbers are well
    readable, they are easy to perceive.


    **HOW TO FORMAT LABELS THROUGH DATA IN A TABLE**


    Go to the “Draft” sheet and select the desired data range. On the “Home” menu
    tab in the “Number” section, format the type of numbers using the “Format with
    thousand separators” buttons (the `''` icon) and “Decrease decimal” (`000` with
    an arrow).


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figp_HTML.png)


    A snippet consists of three columns named `row label`, the `sum of the target`,
    and the `sum of actual` data on an excel sheet with several options.


    After these actions, all data labels on the chart are displayed in the desired
    format.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figq_HTML.png)


    A line graph with two lines depicting values on the sum of the target and the
    sum of actual respectively with the values 200 to 2000 thousands of the months
    January to June.


    ### 3.2.3 Size and Color for Data Labels


    By default, Excel has set size 9 for the font of data labels. To make it easier
    to read and perceive them, we will increase it to 12.


    Select the block with the diagram and specify the desired size on the “Home” tab
    in the “Font” section. Automatically, the font will increase on several elements
    at once: in data labels, in axis labels, and in the legend. All these changes
    completely suit us.


    > **Tip!**

    > *Some clients ask to add a background for data labels because they are “so used
    to it.” But for modern styles, this technique is already outdated, so I do not
    recommend using it.*


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figr_HTML.png)


    A line graph with two fluctuating curves depicts values on the sum of the target
    and the sum of the actual with points from January to June. The maximum sum of
    the actual value is 1875 in April.


    But there is another problem: there are two rows of data on our graph, and their
    labels overlap each other. Excel does not have a button that would eliminate such
    a disadvantage, but we can compensate for this by adjusting the data labels to
    the color of the row.


    To do this, I select all the labels of one row by clicking the mouse and on the
    “Home” tab in the “Font” section, I set the desired color with the “Font Color”
    button. I recommend choosing a tone darker than the graph line. This way the user
    will immediately understand which line on the chart each label belongs to.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figs_HTML.png)


    A snippet consists of a line graph of wage fund analysis on the values of targets
    and actuals in thousands along with the execution of 104% with a column of division
    and expense item.


    > **Tip!**

    > *For the X-axis title and labels, it is better to leave the default color or
    choose a neutral one (for example, dark gray) – these elements should not distract
    from the main information.*'
