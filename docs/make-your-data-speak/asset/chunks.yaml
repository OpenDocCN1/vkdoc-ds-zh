    is this? We choose August in a slicer and see that the leader in revenue this
    month is manager Williams, and Jones brought the least money to the company.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figce_HTML.png)


    A line graph with a bar graph and a bar graph depicts the dynamic of profit and
    orders, and revenue by managers.


    We look at Williams’ personal statistics by selecting his surname on the slicer.
    We see that he is the best for the year. During the year, manager Williams brought
    125 million dollars in revenue, and the company’s profit from his work averaged
    two million dollars per month.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcf_HTML.png)


    A line graph with a bar graph and a bar graph depicts the dynamic of profit and
    orders, and revenue by managers.


    I often come across managers who don’t really need visualization and tables are
    quite enough. This is especially true for people with a financial background:
    one table will tell them more than a dozen charts. This group of managers will
    especially appreciate the use of these rules, because they save a lot of time
    on independent data analysis.


    ### 6.4.5 Summary


    Sooner or later, any analyst has to display such a number of indicators on the
    chart that it becomes unreadable. A good solution for such cases is conditional
    formatting of table fields. It exists in all BI-systems and the principle of operation
    in them is the same as in Excel.


    Five rules for placing visual accents


    1.  Instead of target, actual, and deviation indicators, use only actual and deviation.
    Take away what doesn’t tell you anything new.


    2.  Design the actual in the form of colored bars, and for deviations use green,
    yellow, and red colors. It can be a font color or an icon with a traffic light
    circle.


    3.  If you work with pivot tables, add calculated fields to calculate deviations.
    They can also be used in other data samples.


    4.  Use only one formatting technique per column: data bars, font color, traffic
    light icons, or cell fill.


    5.  Make sure that the formatting highlights the peak values, and not just paints
    the table in all the colors of the rainbow.'
  trans: '

    #### 使用图标进行条件格式设置


    对于 `Margin` 列的条件格式设置，我们将根据交通灯规则使用彩色图标：


    1. 红色 – 表示值小于 10%

    2. 黄色 – 表示值在 10% 到 20% 之间

    3. 绿色 – 表示值大于 20%


    为此，请选中 `Margin` 列，然后选择主菜单标签页中 `条件格式` 按钮下的 `图标集` ➤ `其他规则...`。


    ![](img/537732_1_En_6_Figbv_HTML.png)


    页面展示了启用图标集的条件格式。


    在打开的窗口中，我们设置规则。在 `根据这些规则设置每个图标` 部分指定所需的值，并在 `类型` 下拉列表中选择 `数字`。


    ![](img/537732_1_En_6_Figbw_HTML.png)


    页面展示了新的格式规则，其中所有单元格的格式已根据图标集的值启用。


    完成所有这些操作后，我们将删除表头和总计行的填充。这样我们将得到一个使用更柔和色调、设计协调的表格。


    ![](img/537732_1_En_6_Figbx_HTML.jpg)


    一个表格列出了经理姓名、收入、收入执行情况、利润、利润执行情况、利润率以及几个订单。


    由于这是一个数据透视表，你可以连接切片器来筛选数据。


    ### 6.4.4 典型错误


    使用条件格式时切勿过度，否则会让眼睛感到眼花缭乱。例如，同时为单元格值及其背景着色时就会发生这种情况。你需要适可而止，原则是：**一列只使用一种格式化方式。**


    ![](img/537732_1_En_6_Figby_HTML.png)


    两个表格按递减方式列出了带有颜色填充和无颜色填充的经理姓名及收入执行情况。左上方和右上方分别有一个叉号和勾号。


    ![](img/537732_1_En_6_Figbz_HTML.png)


    两个表格。1. 列出了经理姓名和实际收入值。左上角显示一个叉号。2. 列出了经理姓名和收入。右上角显示一个勾号。


    要选择正确的格式化方法，请思考数据分析的类型。如果需要比较数值并显示孰高孰低，这属于评级。它应以水平柱状图的形式显示。而百分比偏差则按交通灯的原则突出显示。


    新手设计师的一个特别偏好是渐变。我极少数情况下才使用它，原因有二。


    -   **从逻辑角度考虑。** 我们为指标设置特定的阈值：`好` – 在绿色区域，`差` – 在红色区域。我们将黄色分配给中间允许的偏差，而不是用渐变模糊处理。

    -   **从美学角度考虑。** 红色和绿色之间的渐变会产生一种脏兮兮的色调。再加上黄色，要么变得脏乱，要么变得过淡。


    ![](img/537732_1_En_6_Figca_HTML.png)


    两个表格按递减方式列出了带有颜色填充和无颜色填充的经理姓名及利润率。左上方和右上方分别有一个叉号和勾号。


    `热力图`技术可以是渐变填充的一个例外。下面的示例展示了各经理按月与客户的忙闲程度。情况比较模糊：一方面，可以看出谁工作多，谁工作少；另一方面，色调开始让人眼感到缭乱。


    ![](img/537732_1_En_6_Figcb_HTML.png)


    一个代表性表格展示了经理们从一月到十二月的工作量。右侧显示了总范围。Baker 的工作量最大（4,856）。


    在这种情况下，需要思考应该关注哪个区域：是正向还是负向。没有必要就颜色设计去咨询客户：最好是自己准备好并展示所有可能的选项。


    #### 选项 1. 正向


    最饱和的填充用于最大值 —— 可以立即看出五月份经理 Baker 的销售业绩达到峰值。同样，销售中的峰值或实际空白点也很明显。并且可以明显看出谁对整体结果的贡献微不足道。


    ![](img/537732_1_En_6_Figcc_HTML.png)


    彩色 Excel 表格包含各经理每月的工作量，左侧一列有 11 位经理的姓名。右侧是从一月到十二月的月份以及总计行。最大工作量由 Baker 担任，为 4856；最小工作量由
    Wilson 担任，为 884。


    #### 选项 2. 负向


    这里的情况正好相反：最亮红色用于最小值，而最大值用白色突出显示。但采用这种方法，整个表格几乎都被红色点亮，即使是销售领先者也是如此。这不是最成功的可视化方式，因为重点再次丢失了。


    ![](img/537732_1_En_6_Figcd_HTML.png)


    一个代表性表格展示了经理们从一月到十二月的工作量。表格中使用了负向选项。最小值以亮红色显示。


    #### 选项 3. 交互式


    分析师们经常会将各种表格组合放在多个工作表中。他们称之为仪表板，然而，采用这种呈现方式，其理念就丢失了：需要一份单独的说明来解释应该看哪里以及从哪里开始。


    即使客户坚持使用这样的表格，我也会向他提供一个基于交互式仪表板理念的选项。并且我一定会向他演示如何使用它。


    例如，图表显示我们在八月份达到了销售高峰。这是谁的功劳？我们在切片器中选择八月，可以看到这个月的收入领先者是经理 Williams，而 Jones 为公司带来的收入最少。


    ![](img/537732_1_En_6_Figce_HTML.png)


    包含折线图和柱状图的一个图表展示了利润、订单及按经理划分的收入动态。


    我们通过在切片器中选择 Williams 的姓氏来查看他的个人统计信息。我们发现他是全年的最佳员工。在这一年中，经理 Williams 带来了 1.25 亿美元的收入，公司从他的工作中获得的利润平均每月为两百万美元。


    ![](img/537732_1_En_6_Figcf_HTML.png)


    包含折线图和柱状图的一个图表展示了利润、订单及按经理划分的收入动态。


    我经常遇到一些并不真正需要可视化、表格就够用的经理。这对于有财务背景的人来说尤其如此：一个表格能告诉他们的信息比十几个图表还要多。这类经理将会特别欣赏这些规则的使用，因为它们在独立数据分析上节省了大量时间。


    ### 6.4.5 总结


    任何分析师迟早都会遇到需要在图表上显示大量指标以至于图表变得难以辨认的情况。对于这种情况，一个很好的解决方案就是对表格字段进行条件格式设置。这在所有 BI
    系统中都存在，且其工作原理与 Excel 相同。


    放置视觉重点的五条规则


    1.  不要使用目标、实际和偏差指标，只使用实际值和偏差值。去掉那些不能给你带来新信息的东西。

    2.  用彩色条形图设计实际值，对于偏差则使用绿色、黄色和红色。可以是字体颜色或带有交通灯圆圈的图标。

    3.  如果使用数据透视表，添加计算字段来计算偏差。它们也可以用于其他数据样本中。

    4.  每列只使用一种格式化技术：数据条、字体颜色、交通灯图标或单元格填充。

    5.  确保格式化突出显示的峰值，而不是简单地将表格涂上彩虹的所有颜色。

