  trans: '

    ## 2.1 根据布局组装仪表板


    你可以从创建草图开始，即未来仪表板的轮廓。任何图形编辑器、`Microsoft PowerPoint` 程序，甚至一张纸都足以完成此操作——草图可以手绘示意。根据这份文档，我们将创建一个布局。


    我们的仪表板结构可以表示如下：


    1.  仪表板标题

    2.  关键绩效指标（KPI）卡片

    3.  工作区域

    4.  左侧的切片器面板


    需要将草图转换为实际的布局，这将是我们工作的起点。这里需要更精确——布局应包含所有可视化图表、切片器和辅助元素。


    在中间部分（KPI 卡片下方），我们将两个区块合并为一个，以便能够追踪更长时期内的费用动态。


    ![](img/537732_1_En_2_Figa_HTML.png)


    仪表板显示三个组成部分：目标、实际和执行情况。此外，它还包含三个侧边区块：切片器部门、切片器费用项目和切片器月份，以及三个中间区块：月度成本动态、部门和费用项目。


    现在我们有了布局和可视化元素的半成品。我们将它们组装起来，使其结构符合所创建的布局。


    ![](img/537732_1_En_2_Figb_HTML.png)


    仪表板由三个图表组成，分别对应月份、部门和费用项目。它包含三个侧边区块（即部门、月份和费用项目）位于一侧，以及另一侧的一些计算区域。


    我们在 Excel 文件的一个单独工作表中进行此操作——我们将其命名为“`Dashboard`”。


    当前存放数据透视表半成品的工作表将被重命名为“`Draft`”。我们将在此处存储和准备最终仪表板所需的所有数据。


    首先，我们将所有切片器转移到“`Dashboard`”工作表。为此，在“`Draft`”工作表上选择第一个切片器，然后按住键盘上的 `Ctrl`（或 `cmd`）键，用鼠标选择其余切片器。我们剪切掉整个切片器组。


    ***提示！***


    *不要在“`Draft`”工作表中留下可视化元素的副本，以免日后混淆。将工作所需的所有内容转移到“`Dashboard`”工作表，将“`Draft`”工作表留给数据准备和计算。*


    转到“`Dashboard`”工作表并粘贴剪切的内容。我们将切片器放在左侧，按照布局排列，在顶部留出五行空间用于放置仪表板标题和 KPI 卡片。


    ![](img/537732_1_En_2_Figc_HTML.png)


    一个 Excel 工作表的片段，包含三个垂直元素：部门、费用项目和月份。


    然后，我们将准备好的图表从“`Draft`”工作表转移到“`Dashboard`”工作表：方法与处理切片器时相同。我们按照布局将图表放置在工作表上：


    -   屏幕顶部是整个宽度的动态图。

    -   左下角是部门的簇状柱形图。

    -   右下角是费用项目的簇状条形图。


    我们现在已经有了类似仪表板的东西。在这种情况下，“`Draft`”工作表上仅保留了来自数据透视表的样本。


    ![](img/537732_1_En_2_Figd_HTML.jpg)


    一个片段展示了一个折线图和两个条形图，即月份、部门和费用项目，以及三个侧边区块，即部门、费用项目和月份。


    ### 2.1.1 总结


    通过创建草图和布局开始制作仪表板。为此，可以使用任何可视化编辑器，也可以手绘草图。


    1.  确定仪表板上需要哪些可视化图表。

    2.  按照“从总体到具体”的原则将它们排列在布局上。

    3.  确保最重要的数据不会在其他数据的背景中“丢失”。


    对于大多数初学者来说，根据布局进行组装更快、更容易。首先，因为我们提前准备了可视化元素的半成品。其次，因为我们可以立即看到工作的可视化成果。


    可视化图表还不是最终版本。但与切片器的交互已经可以筛选图表，我们可以看到交互式仪表板将如何工作。


    ## 2.2 创建 KPI 卡片


    在仪表板顶部，我们为汇总数据留出了空间。这里无需构建图表，只需足够大地显示数值及其标题即可。我将此类对象称为 KPI 卡片。我们需要创建三张这样的卡片：


    -   目标

    -   实际

    -   执行情况


    为此，您还需要来自数据透视表的数据样本。可以按照与我们为可视化元素制作半成品相同的方式来复制它们。此处不使用已创建的样本，因为 KPI 卡片可能需要进行额外的计算或转换。


    ### 2.2.1 为卡片抽样数据


    为了复制，在“`Draft`”工作表上复制任意一个样本，将其粘贴到稍下方，然后在“`PivotTable Fields`”窗格中，取消选中带有“费用项目”分类的字段名称旁边的复选框。您也可以从“行”区域中移除此字段。


    这样，我们就获得了一个基于数据透视表的样本，其中包含目标和实际的关键指标数据。


    ![](img/537732_1_En_2_Fige_HTML.jpg)


    一个 Excel 工作表的片段，显示了数据透视表字段窗格以及三个未选中的复选框（即部门、费用项目和月份），以及两个选中的复选框（即目标和实际）。

    '
- fmt: '### The "Target" Card


    On the Dashboard sheet, we start creating the first KPI card. Putting the cursor
    in the cell, we add a link to the general indicator of the target on the "Draft"
    sheet. To do this, enter `= Draft!A56`, where `A56` is the address of the cell
    on the sheet with samples. We get the required value already on the Dashboard
    sheet.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figf_HTML.jpg)


    A snippet of an excel sheet with four columns, 1, 2, 3, and seven rows, A, B,
    C, D, E, F, and G. In the C row, it shows some values.


    **IF THE LINK LOOKS WRONG, DISABLE THE `GETPIVOTDATA` FUNCTION**


    Initially, the cell link may look like this:


    `=GETPIVOTDATA("Sum of Target";Draft!$A$56)`. In this case, you need to disable
    the `GETPIVOTDATA` function.


    This function is useful: it extracts the necessary data from the pivot table to
    use it in other tables or calculations. But when creating a dashboard, it becomes
    a headache.


    Being in any cell of the sample, go to the tab "Pivot table Analyse" ➤ "Pivot
    table" ➤ "Options" ➤ uncheck "Generate GetPivotData."


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figg_HTML.png)


    A snippet illustrates the file tool icon clicked. It opens the options tool and
    checks "generate and get pivot data."


    So you will get cells'' links of the pivot table not using `GETPIVOTDATA`, but
    in the usual way, in the form of links to cells `A1`, `B2`, or `C4`.


    Note that if the links to the pivot table were created before disabling the function,
    they remain in their original form after disabling.


    **Tip!**


    *If the number in the card consists of a large number of characters, change its
    bit depth. For example, convert into thousands or millions. This way the indicator
    will become more compact and easy to understand.*


    We give a name to the indicator and set its bit depth "Target, $K". The initial
    data in the cell is divided by 1000. It remains only to set the type of number.
    We do this on the "Home" tab in the "Number" section:


    *   Clicking on the "Comma style" icon (looks like a comma) will format number
    with a thousand.

    *   Clicking on the icon next to "Decrease decimal" (000 with the right arrow)
    will show fewer decimal places.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figh_HTML.jpg)


    A screenshot of target expenses in thousands of dollars represents a single value
    of 7820 for the graph.


    **DON''T BUILD A CHART FOR THE SAKE OF A SINGLE NUMBER!**


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figi_HTML.jpg)


    A snippet of target expenses in thousands of dollars represents a single value
    of 7820 for the graph.


    Such visualization does not add informativeness, but distracts attention from
    the number and forms information noise in the form of a scale, lines, and columns.
    There is nothing to compare one column with, so there is no point in it – present
    the KPIs in the cards.


    To focus on the value of the indicator, we will increase its font to 20 pt.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figj_HTML.jpg)


    A snippet illustrates the home tool icon with its options, namely cut, copy, and
    format painter, and it selected 20 as the font size.


    The fill will help to focus attention on the card: add it to the cell with the
    number and the name of the indicator. Do not choose dark or bright colors, otherwise
    the values may be lost on their background.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figk_HTML.jpg)


    A snippet illustrates the toolbar of a spreadsheet and the Home tool icon with
    its option and a numeral value written in a column.


    To select the card size, stretch the column with the value. In this case, the
    alignment of the number may be disrupted. To fix this, we will set the cell format
    on the "Home" tab: in the "Number" section, open the dialog window by clicking
    on the rectangle with an arrow. In the "Cell Format" window that opens, you must:


    *   Select the "Number" category in the "Number" section.

    *   Make sure that the number of decimal places is zero.

    *   Make sure that there is a check mark in the "Use 1000 Separator (,)" field.

    *   Click OK.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figl_HTML.jpg)


    A dashboard illustrates the "number" bar clicked and the option "category" opens
    and a checked "use 1000 separator" box and some negative numbers are given.


    That''s all – the card with the target indicator is ready.


    **"Actual" and "Execution" cards: creation and configuration.**


    Then we simply replicate the created card: copy, step back two columns, leaving
    a gap, and paste. We change the link to the cell in the copied card (instead of
    the target indicator, we now need the actual one). As in the first card, here
    you need to divide the indicator by 1000: make sure that this remains in the formula.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figm_HTML.jpg)


    An excerpt of a spreadsheet''s toolbar. Two values of the target thousand dollars
    are included, and the file tool icon has been clicked.


    We change the title of the new card to "Actual, $K". It''s not a big deal if the
    data doesn''t fit and is displayed in the cell as `"#######"`. To see the actual
    value, just stretch the column width. It remains only to bring the received data
    to the desired bit depth.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Fign_HTML.jpg)


    A snippet illustrates the upper section of the spreadsheet. It consists of three
    numerical values for writing the values in the column width.


    The second card "Actual, $K" has been created. Since we copied an already configured
    card, we didn''t have to repeat all the configuration steps.


    To create a third "Execution" card, copy one of the created ones and paste it
    also at a distance of two columns from the neighboring one. To calculate the value
    in this card, it is enough to insert a formula dividing the value from the "Actual,
    $K" card by the value from the "Target, $K" card.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figo_HTML.jpg)


    A snippet illustrates the upper section of a dashboard. It contains three numeral
    values. The third column value is a formula inserted to calculate.


    The resulting value is displayed as a percentage; to do this on the "Home" tab
    in the "Number" section, click the "Percent style" button. We give the created
    cards visually the same size – and they are ready.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figp_HTML.jpg)


    A snippet illustrates the toolbar of a spreadsheet. It represents the three resulting
    values, namely target thousands of dollars, actual thousands of dollars, and execution.


    **Tip!**


    *Don''t overdo it with the number of KPI cards. If the customer asks to display
    7–10 indicators on them, explain that this will make the numbers difficult to
    perceive and will lead to an overload of the dashboard. I recommend adding no
    more than six cards.*


    ### Summary


    KPI cards are the first thing the user sees on the dashboard. There is no need
    for diagrams and bright color, all attention should be focused on an important
    numerical indicator. We created these elements in a few steps.


    *   On a sheet with pivot tables, we formed a sample with general indicators of
    the target and the actual values.

    *   On a sheet with blanks of diagrams ("Dashboard"), the first card was designed:
    it referred to a cell with a target indicator on another sheet. We adjusted the
    bit depth for the card and gave it a clear title.

    *   We designed the appearance of the first card: we increased the font of the
    numerical indicator and added a light blue fill to focus attention on the KPI.

    *   By replicating an already-created card, two new cards, "Actual" and "Execution,"
    were created. In this case, you will not have to repeat all the configuration
    steps, but you need to change the formula for the indicator of the "Execution"
    card.'
