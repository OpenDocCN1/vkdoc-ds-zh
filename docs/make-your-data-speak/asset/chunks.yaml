- fmt: '### 1.4.4 Samples and Slicers in Five Steps


    Work with samples can be optimized to make the creation of visual elements easier.
    To do this, first we fully configure the basic sample, and then we replicate it
    and get an almost ready-made new one.


    **Step 1.** Create on a new sheet the first sample with the fields of the pivot
    table “Month,” “Target,” and “Actual.”


    **Step 2.** Open the parameters of the pivot table on the tab “PivotTable Analyse”
    ➤ “Options” or using the context menu (right-click).


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figat_HTML.png)


    An excel sheet depicts three columns namely row labels, sum of target, and sum
    of actual. It is overlapped by division and pivot table options.


    **Step 3.** In the settings window that opens, uncheck the “Auto-fit column widths
    on update” option. If this is not done, the width of the columns will have to
    be adjusted again each time the slicer is used.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figau_HTML.png)


    A page with a menu of pivot table options. The pivot table name is payments dynamics.
    For the empty cells shown, preserve cell formatting on the update is enabled.


    **Step 4.** Add the desired slicers from the base sample. On the “Insert” tab,
    click “Slicer” and tick the required fields in the window that appears.


    To select several categories on a slicer, click on the “Multi Select” button near
    its title and remove the selection from unnecessary positions. Another option
    is to press `Ctrl` (or `cmd`) on the keyboard and select the desired positions
    with the mouse.


    **Step 5.** It remains to replicate the basic customized sample and add all the
    necessary blanks of visual elements.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figav_HTML.png)


    A screenshot of an excel sheet consists of a line graph with month-wise higher
    actuals than targets from January to June peaking in April, a vertical bar graph
    with the highest actuals and targets in production workers among 4 types, and
    a horizontal bar graph with the highest in salary among 5 types. Tables contain
    data of the same.


    The “PivotTable Fields” pane can always be hidden, and if necessary, called up
    again: right-click on any cell of the pivot table and then use the “Show Field
    List” button.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaw_HTML.png)


    An excel sheet with a context menu over 2 tables. The show field list option is
    selected. Calibri 11 is the selected font style and size.


    ### 1.4.5 Summary


    Slicers are the core of dashboard interactivity. They work like buttons, and clicking
    on each one updates all the data on the screen. Convenient, understandable, easy
    for analysis.


    1.  Add and configure a basic sample on the sheet with pivot table: select the
    required fields at the pane on the right.


    2.  Turn off the «Auto-fit column widths on update» option, otherwise you will
    have to set the column width every time after using the slicer.


    3.  Add a slicer from the sample (“Insert” ➤ “Slicer”) and tick the necessary
    fields in the settings panel that opens.


    4.  To “deactivate” some categories on a slicer, select it, hold down `Ctrl` (or
    `cmd`) and click on unnecessary positions.


    5.  Replicate the customized sample and add blanks for visual elements.


    Setting up a basic data sample before replication will greatly reduce the time
    to create slicers and blanks for visual elements.


    ### 1.4.6 Quick Tricks for Excel


    *“Ctrl” is used for Windows. For MacBook, you should use “cmd” instead.*


    | **“Smart” table** What happens if you convert a regular list to a table (`CTRL+T`):
    • The table header is automatically frozen. • The autofilter is turned on. • The
    dimensions of the table will adjust to the data. • All formulas will be automatically
    filled down for the entire column. |

    | :--- |

    | ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figax_HTML.jpg) A representation
    of an icon of a tabular grid with a paint brush. Format as table drop-down option
    is the text below. |

    | **Quick copy down** If you need to copy the formula to the end of the column,
    it is better not to do it manually by holding out a black cross: just double-click
    on it with the left mouse button. |

    | ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figay_HTML.jpg) A representation
    of an icon of a quick copy-down setting. The first cell in the column is selected.
    A black cross is on the bottom right corner, and a downward arrow is below. |

    | **Filling in empty cells** To fill empty cells with values from the preceding
    cells • Select the entire range. • `F5` ➤ Special… ➤ Blanks. • Click on the “=”
    sign, then on the up arrow to create a link to the previous cell. • Enter the
    resulting formula in all cells by pressing `CTRL+Enter`. |

    | ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figaz_HTML.jpg) A representation
    of a column. A is filled in the first 3 cells, B is filled in the next 2 cells,
    and C is filled in the next 3 cells. |

    | **Adding a series to the chart** ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figba_HTML.jpg)
    A table with columns for January and February and 3 rows, A B C, D E F, and G
    H I, and a vertical double bar chart. The selected column, February in the table
    is represented as a dashed bar in the bar chart. Just copy the range of cells
    and paste it into the chart with the right mouse button or using the keyboard
    shortcut `CTRL+C` and `CTRL+V`. |


    # 2. Dashboard Assembling


    The result obtained on previous steps is only a preparatory stage. Work on the
    dashboard begins with the creation of its layout, which takes into account the
    requirements for the presentation of information as well as the location of visual
    elements and interactive slicers.


    We have finished the data preparation, then we will work with the so-called dashboard
    draft. We will prepare a layout, place information blocks with visual elements
    on it, and assemble an interactive version.'
