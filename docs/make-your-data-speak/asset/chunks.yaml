  trans: '

    ### 4.2.1 如何使用形状和文本框添加卡片


    现代商业智能系统都带有卡片小部件。你只需添加一个指标，就会出现一个带有标题和最终值的样式化矩形。Excel 中没有现成的此类对象，我们将使用临时工具——矩形和文本框——来组装一个。


    这看起来可能有点可笑，但这个技巧在 Excel 和其他程序中都会很有用。当仪表板布局非标准，并且需要将几个指标归入一个标题下时，它尤其方便。让我们仔细看看这个过程的步骤。


    **第 1 步。** 点击“插入”选项卡中“插图”区域的“形状”按钮 ➤ 在下拉菜单中选择“矩形”形状。如果你的屏幕较大，“形状”按钮会直接显示在功能区内。


    ![](img/537732_1_En_4_Figj_HTML.jpg)


    一张 Excel 表格的快照。已选中`插入`选项卡。其下选中了插图选项。在下拉菜单中选中了形状。选中了一个矩形形状。


    **第 2 步。** 在第一个 KPI 卡片上方放置一个矩形。可以通过拉动形状的边缘来将其设置为任意大小。这不会影响表格中列的宽度。


    ![](img/537732_1_En_4_Figk_HTML.jpg)


    一张截图展示了一个 Excel 文件，其中包含文本“工资基金分析”，目标值为 7820 千美元，背景色为浅色。


    **第 3 步。** 选中矩形，输入卡片标题：“目标（$K）”。设置字体大小（12）和居中对齐。


    ![](img/537732_1_En_4_Figl_HTML.png)


    一张截图展示了一个 Excel 文件，其中列出了“开始”选项卡下的选项，包含文本“工资基金分析”，目标值为 7820 千美元，字体为 Calibri，字号
    12。


    **第 4 步。** 点击一个空白单元格以取消选中矩形。点击“插入”选项卡中“文本”区域的“文本框”按钮，将出现的项目放入矩形内。这个元素将用于添加我们的指标。


    ![](img/537732_1_En_4_Figm_HTML.png)


    一张截图展示了一个 Excel 文件，其中列出了“开始”选项卡下的选项，包含文本“工资基金分析”，目标值为 7820 千美元，以及一个小对话框。


    要向卡片添加指标，我们需要在数据透视表样本中创建一个新单元格。


    ### 4.2.2 卡片合计值放在独立单元格中


    我们在草稿仪表板中编写了公式，以便用便捷的格式显示卡片指标，并避免使用过多字符。你也需要根据其特殊性来配置这种格式。


    “矩形”和“标签”元素的公式栏中不能指定公式。如果尝试这样做，将会看到一条错误消息。


    ![](img/537732_1_En_4_Fign_HTML.jpg)


    一张截图展示了一个 Excel 文件，其中包含文本“工资基金分析”，目标（千美元），以及一个小对话框，显示 7820206.02 和一个高亮的“确定”按钮。


    要向新的卡片类型添加数字指标，我们需要在“草稿”工作表的“关键指标”样本下创建带有公式的单元格。


    **第 1 步。** 选中样本第一列下的一个空白单元格，并在公式栏中输入以下值：`= A43/1000`，其中`A43`是包含计划指标的单元格地址，你需要减少其字符数。


    **第 2 步。** 像之前一样设置新单元格的格式。这会降低位深度，并保留整数，不含小数。


    ![](img/537732_1_En_4_Figo_HTML.png)


    一张截图展示了一个 Excel 文件，其中 A、B、C 列分别含有目标值、实际值和执行率的合计，数值分别为 7820、8161 和 104%。


    **第 3 步。** 在新版仪表板所在的工作表上，选中添加到卡片中的“文本框”元素，并在公式栏中指定一个指向包含所需指标的新单元格的链接。调整字体大小、颜色，并将指标位置设为居中对齐。


    ![](img/537732_1_En_4_Figp_HTML.png)


    一张截图展示了一个 Excel 文件，其中列出了“开始”选项卡下的选项，包含文本“工资基金分析”，目标值，目标（千美元）7820，字体为 Calibri，字号
    18。


    用同样的方法，提前为另外两个卡片准备好带公式的单元格：


    *   为“实际”指标设置公式，然后通过删除小数点来降低位深度。


    *   在公式内部，为“执行率”卡片编写实际指标除以目标指标的计算公式。在“开始”选项卡的“数字”区域将结果转换为百分比格式。


    **第 4 步。** 将卡片的各个元素相对对齐。按住`Shift`键，先用鼠标选中“文本框”元素，再选中“矩形”元素。在“形状格式”菜单选项卡中选择“对齐”
    ➤ “水平居中”。


    ![](img/537732_1_En_4_Figq_HTML.jpg)


    一张截图展示了一个 Excel 文件，其中包含文本“工资基金分析”，以及目标、实际、执行率。其下列出了“对齐”选项，并选中了“水平居中”。


    **第 5 步。** 组合卡片元素。先选中“文本框”，再选中“矩形”。使用以下任一种组合方式：


    1.  在“形状格式”选项卡上选择“对齐” ➤ “吸附到形状”。


    2.  在右键菜单中选择“组合” ➤ “组合”。


    ![](img/537732_1_En_4_Figr_HTML.jpg)


    一张截图展示了一个 Excel 文件，其中包含工资基金分析的图表并显示目标值，其下列出了“组合”选项。


    完成所有步骤后，我们就得到了一个组合好的“卡片”元素，其中包含目标指标。


    ![](img/537732_1_En_4_Figs_HTML.jpg)


    一张插图展示了文本“工资基金分析”和一个小对话框，内容为目标（千美元）7820。


    ### 4.2.3 复制卡片


    我们的仪表板应该有三个关键指标卡片：“目标”、“实际”和“执行率”。为了避免逐一设置每张卡片，我们将使用熟悉的复制技巧。


    为此，我选中“目标”卡片，按住键盘上的 `Ctrl` (或 `cmd`) 键，然后用鼠标将元素的副本移动到所需位置。我们将把这个副本变成包含实际指标的卡片。


    ![](img/537732_1_En_4_Figt_HTML.jpg)


    一张插图展示了文本“工资基金分析”，目标（千美元）7820，以及右边一个小对话框，内容为目标（千美元）7820。


    我们将新卡片命名为“实际（$K）”，并更改指向“草稿”工作表中实际计算指标的链接。


    ![](img/537732_1_En_4_Figu_HTML.jpg)


    一张截图展示了一个 Excel 文件，其中包含文本“工资基金分析”，目标（千美元）7820，以及右边一个小对话框，内容为目标（千美元）8161。


    此时，格式化标签的字体恢复为默认的黑色。这可能会让你觉得做错了什么。别担心——这只是 Excel 的又一个“小毛病”。深呼吸，手动重新调整字体：增大字号并将颜色改为白色。

    '
- fmt: '### 4.2.4 How to Fix the Background Style


    The main thing on the KPI cards are indicators – they are the first to meet the
    eye, after all. Here, however, the bright and “heavy” fill steals the limelight.
    We will need to change the style of the element to make the indicators contrasting
    and visible.


    **Tip!**


    *Don’t fall for originality, keep the style minimalist – a dark font against a
    light background (unless the dashboard design calls for something different).*


    Open the drop-down menu with shape styles in “Shape Format” tab (“Format” in older
    versions of Excel).


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figv_HTML.jpg)


    A screenshot depicts an excel file that lists the options under shape format with
    different theme styles, presets, and other theme files.


    None of the options given suits our corporate dashboard design. We need to give
    up ready-made solutions and create something of our own. We will go to the “Shape
    Format” menu tab and set the following parameters:


    *   Shape fill: the lightest blue

    *   Shape outline: no contour

    *   Text fill: black


    Now we have the minimalist style needed.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figw_HTML.jpg)


    A screenshot depicts an excel file with the text wage fund analysis, target, thousand
    dollars 7820, and a small dialog box on the right with the target, thousand dollars
    8161.


    We repeat the same steps for “Actual” card and then replicate the element configured
    for “Execution” card, having set the formula and formatting on the “Draft” sheet
    in the “Key Indicators” sample.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figx_HTML.jpg)


    An illustration depicts three rectangular boxes with the target, actual values
    of 7820 and 8161 thousand dollars, respectively, with 104% execution.


    In this example, we choose a pale fill and remove the contour. You can do the
    opposite: remove the fill and leave a colored outline. If you do, choose the line
    color a shade brighter and increase the thickness to 2 pixels.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figy_HTML.jpg)


    An illustration depicts three rectangular boxes with the target, actual values
    of 7820 and 8161 thousand dollars, respectively, with 104% execution.


    We have created cards that are not linked to the Excel grid. You can change their
    size to your liking: this will not deform the remaining elements on the dashboard.


    ### 4.2.5 Alignment of New Cards


    When the cards are removed from the Excel cell level, you can quickly align them
    on the dashboard. It is much easier now that you no longer have to adjust the
    elements by eye.


    **Step 1.** Alignment along diagram borders. First, align “Target” card along
    the left border of “Expenditure Dynamics” graph. Select both elements and click
    “Align to the left” in “Format Shape” tab under “Align” button.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figz_HTML.png)


    A snapshot of an Excel sheet. It has a graph of the wage fund analysis with the
    target and actual values. Under shape format, select align option. In that, select
    align left.


    The third card “Execution” needs to be aligned along the right border of “Expenditure
    Dynamics” graph. We will also select both elements and click “Align to the right”
    in the same menu item.


    **Step 2.** Vertical alignment. It is quite simple as well: we select all the
    cards and in the same menu, select alignment along the upper corner, in the middle
    or along the lower corner – whichever is most suitable.


    **Step 3.** Horizontal alignment. To make the cards equidistant, select all of
    them and click “Distribute horizontally” in the menu.


    We have set up the perfect location of the cards on the dashboard in three simple
    steps. The cards are now aligned both relative to each other and the other elements.


    ### 4.2.6 Summary


    KPI cards that are “independent” of the Excel grid give more opportunities for
    design. Firstly, their size does not distort the proportions of other visual elements.
    Secondly, they can easily be moved around the dashboard.


    This is what we did to “free” the cards from the grid to make our work more convenient:


    1.  Created cells with formulas for calculating indicators in the desired format
    under the data sample with KPIs.

    2.  Added “Rectangle” shape to the upper part of the dashboard and added the card
    title to it.

    3.  Added “Text box” element to the rectangle and placed a link to the new sample
    cell in it.

    4.  Grouped the parts of the card, uniting “Rectangle” and “Text box” into one
    element.

    5.  Copied this element and changed the cell link for the title. We also corrected
    the displaced formatting manually.

    6.  Changed the default card style by choosing a dark font against light background.

    7.  Aligned the cards on the dashboard in three steps.


    ## 4.3 Designing Interactive Slicers


    Removing excess elements is primary to dashboard design. We have already practiced
    this with charts and KPI cards. The workspace looks much “cleaner,” while the
    content is immediately visible.


    The slicers look overloaded against the background. We will get rid of excessive
    contours and set up correct operation for the interactive report.'
