- fmt: '### 6.5.2 Waterfall = Dynamics + Rating


    The waterfall chart is also known as a flying breaks chart or Mario kart due to
    the apparent suspension of columns (bricks) in midair. Often in finance, it will
    be referred to as a bridge.


    Most often, this visual element is used for factor analysis. The diagram consists
    of columns: the first and last show the initial and final values, and the intermediate
    ones show the factors that influenced the result. Clarity is given by the different
    colors of the intermediate columns: green – where the indicator has grown; red
    – where it has decreased.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcp_HTML.png)


    A waterfall chart exposes the cash flow. It exhibits the values of gross profit:
    5,109,518, management expenses: minus 854,377, receivable percentage: 174,220,
    and payable percentage: minus 942,045.


    This example is based on financial data about how the net profit was formed. We
    see that management expenses were deducted from the gross profit, interest was
    added to the receipt, and interest was deducted for payment. Then they added 2.8
    million other income and received a peak cash flow: 4.1 million of it was written
    off to other expenses, and 340 thousand taxes were paid from the remaining small
    base. After that, the resulting gray column of two million net profit remained.


    To get such a visualization, we also combine two basic types of analysis:


    * Dynamics in order to display the changes in the indicator from the starting
    point to the end point by stages

    * Rating to quantify the factors that influenced the result positively or negatively


    The financier will understand this information in the table. But for a manager,
    an entrepreneur who is not immersed in the details of calculations, such visualization
    allows one to immediately see why the company has losses, and what influenced
    the increase in profits.


    The color coding can be inverted in the case of cost analysis. Here we see that
    the planned labor costs were 55 million, and in fact amounted to 70.5 million.
    The main savings came out due to the shift of deadlines, the withdrawal of facilities,
    and a little due to the reduction of administrative and managerial staff. And
    the overspending came out due to the revision of rates, turnover, and bonuses.
    We brought the most significant factors to the diagram, but there were also small
    ones that saved five million dollars in total.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcq_HTML.png)


    A waterfall chart exposes the factors of changes in the wage fund. Total wage
    fund: 55,000 and actual wage fund: 70,500 (the highest value).


    I will tell you how to build a diagram in newer versions of the program (spoiler
    is easy), as well as how to use a life hack with a “pillow” in versions before
    2016.


    #### How to Build a Waterfall Chart in Excel 2016 and Above


    In Excel, this chart has appeared since 2016, but it is rarely used. Largely because
    of the construction logic: it is not intuitive, and it cannot be formatted according
    to the pattern of the columns and graphs we are familiar with.


    Let’s look at the financial example about the profit change. The initial data
    should be written to the table so that the expenses go with a minus sign. It is
    by this criterion that Excel will determine the direction of the column: positive
    values – up, negative values – down.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcr_HTML.png)


    A representative table exhibits the lists of items (including rent, income tax,
    and net profit) and the sum values. Gross profit has the highest sum value (5,109,518).


    **Step 1.** On the ribbon we find an icon with a waterfall chart. Click and get
    a strange shape. At this step, many are finally disappointed in the new Excel
    and go to collect a waterfall of rectangles in PowerPoint.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcs_HTML.png)


    A screenshot exhibits a waterfall chart in the center of the page. The bars in
    the chart represent the increased, decreased, and total values of the items.


    At first, it is still clear: the blue column of gross profit, management expenses
    are deducted from it… But instead of green growth columns, they are blue again,
    and at the end the net profit is hanging in the air. Yes, and in the legend there
    is still some incomprehensible gray “Result.”


    **Step 2.** The fact is that “Total” is the sign of the column that will be built
    from zero. To “land” a net profit, you need to guess first, click this segment
    once, and then the second time so that it lights up. Do not confuse it with a
    quick double click: press the left button once, release, press again. After that,
    right-click the context menu and select “Set as Total”. We do the same for the
    initial column.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figct_HTML.png)


    A cropped screenshot exhibits a waterfall chart in the center of the page. Set
    as the total is the selected option from the context menu. The increased, decreased,
    and total values are represented by different colors.


    **Step 3.** The “bridge pillars” have turned neutral gray, but the revenues have
    remained blue, and I want to make them green. And then the non-obvious nuances
    begin again. Of course, I can select each column in turn and put the desired shade
    of green and red on it. But Excel provides the ability to customize the color
    for the entire category at once.


    To do this, click the legend once, then again – on the “Fill” element and select
    the green color for it. This function works stably only in versions 2019+, in
    older versions it turns the background of the legend green.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcu_HTML.png)


    A cropped screenshot exhibits a waterfall chart in the center of the page. The
    fill drop-down menu exposes a color palette. The increased, decreased, and total
    values are represented by different colors.


    **Step 4.** Design the diagram according to the checklist from Part 3.4: we remove
    the extra Y axis, gridlines, legend. In order for the category labels to fit horizontally,
    you will have to reduce the font and stretch the diagram in width. If there is
    not enough space for the text, Excel will force it to rotate and place it at an
    angle. So if you have long names of deviation factors, they still won’t fit, there’s
    nothing you can do about it.


    **Step 5.** Finishing touches. I am pleased that the gap width of the columns
    is 50% by default. But it is for the waterfall diagram that it is necessary to
    strengthen the visual metaphor and make the “steps” almost adjacent to each other.
    To do this, we reduce the gap to 10%.


    The location of the data labels is not accidental: for the positive categories
    they are above the colored columns, and for the negative ones they are below it.
    I will not change this, I will only adjust the bit depth, remove the decimal places
    and slightly increase the font size. Now the chart is ready!


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figcv_HTML.png)


    A waterfall chart exhibits the cash flow. It exposes the values of gross profit:
    5,109,518, net profit: 2,006,783, rent: 96,488, receivable percentage: 174,220,
    and income tax: minus 343,976.


    Just like a funnel, a waterfall chart is not built on pivot tables in Excel. To
    deceive it, again make links to neighboring cells.'
