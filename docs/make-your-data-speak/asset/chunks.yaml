  trans: '

    ### 六个扇区——饼图的最大限度


    接下来关于饼图的所有论述同样适用于环形图。两者都展示整体，并且这种形式对二者都施加了一些限制。其中之一就是允许的扇区数量，不应超过六个扇区。


    ![](img/537732_1_En_6_Figac_HTML.png)


    饼图和环形图展示了分销渠道的百分比。`Online`：29%。`retail`：31%（最高），`broker`：21%，`agent`：6%（最低），以及`other`：13%。


    否则，圆形的扇区会变得太小，很难理解它们之间的差异。此外，你将无法在扇区内放置标签。将标签放到图表外部是一个坏主意：这会使用户感到困惑并造成元素堆积。


    如果你的整体数据包含 7 到 10 个扇区，最好选择矩形树图进行可视化。


    ![](img/537732_1_En_6_Figad_HTML.png)


    矩形树图展示了各分支的利润百分比。`Chicago`：38%（最高），`Houston`：22%，`Boston`：11%，`Seattle`：9%，`Miami`：8%，`New
    York`：7%，以及`Austin`：6%（最低）。


    ### 标签过长？放弃饼图


    即使扇区数量不多，类别标题也可能无法容纳。这也是替换图表的原因。矩形树图的尺寸更大，因此更容易将未能放入圆形或环形图扇区中的标题放置其中。


    ![](img/537732_1_En_6_Figae_HTML.png)


    饼图和矩形树图展示了服务利润的百分比。`Air Cargo` 的百分比最高（20%）。饼图和矩形树图的右上角分别显示了一个叉号和一个对勾。


    ### 饼图设计技巧


    饼图有很多缺点，但有时它却是最佳的可视化选择。饼图上感知和数据分析的便利性很大程度上取决于其设计。


    -   将第一个扇区放置在圆形的顶部，类似于表盘上的`12:00`位置。按从大到小的顺序排列扇区。


    ![](img/537732_1_En_6_Figaf_HTML.png)


    两个饼图展示了销售来源的百分比。1. 左上角显示一个叉号。2. 右上角显示一个对勾。网站的百分比最低（10%）。


    -   不要在饼图上使用图例：不要强迫用户的眼睛从扇区移动到图例中的名称，并匹配这些元素的颜色。将标签放置在扇区内部。


    ![](img/537732_1_En_6_Figag_HTML.png)


    两个饼图展示了销售来源的百分比。`Marketplaces` 的百分比最高（40%）。1. 左上角显示一个叉号。2. 右上角显示一个对勾。


    -   最好将较小元素的标签放在图表外部。确保它们的数量不要太多，否则标签会相互重叠。


    ![](img/537732_1_En_6_Figah_HTML.png)


    两个饼图展示了成本结构的百分比。`Rent` 的百分比最高（22%）。1. 左上角显示一个叉号。2. 右上角显示一个对勾。


    -   永远不要。永远不要使用 3D 图表。出于某种原因，这种情况在饼图中最为常见——有些人觉得它们更美观，有些人觉得它们更专业。但 3D 效果扭曲了对数据的感知。这个例子清楚地展示了
    29%的“立体”近端扇区看起来比 31%的扇区更大。


    ![](img/537732_1_En_6_Figai_HTML.png)


    一个 3D 饼图和一个饼图展示了销售渠道的百分比。`Retail` 的百分比最高（31%）。1. 左上角显示一个叉号。2. 右上角显示一个对勾。


    ### 简要结论：如何展示整体构成


    -   如果结构中不超过六个独立部分，饼图或环形图是可行的。


    -   如果标签放不进圆形的扇区，请使用矩形树图。


    -   不要在饼图上使用图例。


    -   如果结构中有 6 到 10 个独立部分，矩形树图是合适的。


    -   如果标签放不进矩形树图的扇区，作为极端情况，使用条形图。


    ![](img/537732_1_En_6_Figaj_HTML.jpg)


    一张图展示了饼图和矩形树图的结构范围。6 是饼图的范围，10 是矩形树图的范围。


    ### 6.2.4 总结


    即使是在三种流行的数据分析类型中，如果你不知道选择图表的规则，也可能感到困惑。使用一个简单的方案。


    -   对于排名：柱状图或条形图

    -   对于趋势：折线图、柱状图或面积图

    -   对于结构：饼图（环形图）或矩形树图


    ![](img/537732_1_En_6_Figak_HTML.jpg)


    一个框架展示了排名（在条形图中）、趋势（在条形图和折线图中）和结构（在环形图和矩形树图中）的范围。`Rating`：10，`dynamics`：12，以及`structure`：6
    和 10。


    ## 6.3 多数据系列的生活技巧


    在最后一部分，我们处理了仅显示实际值的单一数据系列。但在实际报告中，你经常需要处理多个数据行，比较排名、趋势或结构方面的实际指标与目标指标。


    在“`Wage fund analysis`”仪表盘上，我们根据目标和实际值比较了部门和费用项目。为了可视化这些排名，我们使用了柱状图和条形图，尽管对于此类数据，水平和垂直柱状图在两种情况下都适用。对于
    4-5 个类别，它仍然具有可视性。


    对于趋势，我们构建了线性图，尽管只有六个数据点。这可能看起来与前面描述的规则相矛盾。但仪表盘上的数据会随着新月份的加入而更新，总有一天会达到 12 个。此外，一开始对我来说，向你展示不同的图表（而不仅仅是柱状图）很重要。


    ![](img/537732_1_En_6_Figal_HTML.png)


    3 张图表。一张折线图展示了实际与目标支付趋势。垂直和水平的双柱状图分别展示了按部门和项目划分的费用（实际与目标）。


    以上所有内容都可以通过组合系列更紧凑地表示。


    -   对于月度趋势 – 使用带有折线和柱状图的组合图。

    -   对于部门排名 – 使用带有标记的图表，这些标记替代了目标值的柱状图。

    -   对于按项目排名 – 使用带有组合柱状图的图表：实际值位于目标值的背景之上，就像一个进度条在向它靠近。


    我必须马上说明，这不是标准的可视化做法：Excel 的效果不如在`Power BI`中那么美观和直观。而且无论如何，我们的主要重点已经放在了实际值上，而目标值则是背景。在某些情况下这可能不错，但在某些情况下可能不太好。


    ![](img/537732_1_En_6_Figam_HTML.png)


    3 张图表。一张组合图展示了实际与目标支付趋势。垂直和水平的重叠条形图分别展示了按部门和项目划分的费用。


    让我们弄清楚你可以使用哪些技巧来构建这些可视化图表，以及它们各自的优缺点。

    '
- fmt: '### 6.3.1 Combined Graph for Dynamics


    All the preceding new visualizations have a common idea: the target is a mark
    that the actual crosses. To adjust this on the chart, select the line with the
    target and select “Change Series Chart Type…” in the context menu. If you don’t
    have such an item, it means that you clicked on the chart area, and not on the
    series itself (line or column).


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figan_HTML.jpg)


    A screenshot exhibits a list of options in the context menu. The `Change Chart
    Type` is the selected option.


    In the window that opens, we can select a separate chart type for each data series.
    In our case, for the “Actual” series, we select a `Clustered Column Chart`.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figao_HTML.png)


    A `Change Chart Type` dialog box exposes a list of charts. The `Combo` is the
    selected chart type. The `Custom Combination` is exposed in the center. The chart
    type and axis options are exposed at the bottom.


    That’s the whole trick. The advantage of the column is that the data labels can
    be placed in the center, and they will not overlap on the target, as it was before.


    It remains to adapt the diagram according to the checklist from Part 3.4. First,
    we reduce the `Gap Width` from 150% to 50%. Then we increase the thickness of
    the “Target” line to 3 points so that it does not get lost against the background
    of large columns.


    In this example, it was possible to leave the lines, everything is quite clear.
    But often you need to show three series: the target, the actual, and the actual
    of last year. And here such a technique helps out well. Just keep an eye on the
    accents: last year should not distract attention from the current one.


    If you need to show more indicators for the dynamics, according to the rule, we
    choose a line graph. But when you need to see both the profit values for this
    year, and the target, and the values of last year, a combination of column chart
    and lines is better suited.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figap_HTML.png)


    A line and bar graph depict the profit dynamics with the target, actual, and Previous
    year. A cross mark and right at the extreme left and right top.


    Sometimes it is necessary to place data of different scales on the chart. For
    example, revenue in thousands of dollars and a small average check in dollars.
    It will not be possible to simply reflect such data on the diagram: the line of
    the average check will “stick” to the X-axis. To prevent this from happening,
    the trend line along the middle check should be placed on the auxiliary axis.


    For clarity, I colored the axes in the color of the lines so that it was clear
    which one refers to what. Just labels will not help here: they will become a poorly
    readable set of numbers mixed up. So the result will be better, although it will
    not be perfect.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaq_HTML.png)


    A pair of line graphs depict the dynamics of revenue and AV check. Both have a
    fluctuating trend. And a `Format Data Series` option on the right side.


    To strengthen the emphasis, we use a different technique – different figures for
    data of different order. We will display the revenue as a column, as a volume,
    total index, and we will leave the average check as a line, but as a calculated
    one.


    Customize the visual representation according to the checklist – add labels, remove
    axes. But a problem arises here: the line of the middle check sticks to the X-axis
    again, although the series is built along the auxiliary axis. This is another
    feature of Excel, because of which we cannot simply remove the scale from the
    chart. But we can hide it: we will make the axes invisible by repainting them
    in the background color – we have it white. They are still there, but they no
    longer distract attention from the data.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figar_HTML.png)


    A vertical bar chart and a combinational chart (bar and line) expose the ranges
    of dynamics. The bar indicates the revenue and the line indicates the average
    check. 1. A cross mark is exposed on the top left corner. 2. A tick is exposed
    on the top right corner.


    We need all these complexities and life hacks only to build such charts in Excel.
    In specialized software products, such as Power BI, such sophistication is not
    required.


    ### 6.3.2 Bullet Chart for the Target-Actual Rating


    The `Bullet` chart is used to display target–actual values. The visual idea is
    that the strip with the actual value kind of shoots, flies out of the barrel with
    a target. The example on the left looks more like such a gun, and on the right
    is already a minimalistic version, where the target is a line, a bar that the
    actual reaches. Plus, conditional formatting is used here: if the goal is not
    achieved, then red, if completed, then green.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figas_HTML.png)


    A pair of bar graphs of expenses by items with actual and target values. The salary
    has the highest value of 3.96 million. A tick and double tick at the extreme left
    and right top.


    Both options are correct, but I recommend the second one. There is more space
    for the actual column on it, and the target is compactly displayed with a dash.
    But these are examples of a ready-made `Bullet Chart` built in Power BI. In Excel,
    we will have to conjure, and the result will not be 100% consistent with the standard.


    #### Horizontal Bullet Chart with a combination of Series


    To build a horizontal bullet chart, we first need to change the parameter for
    the “Target” data series and set the `Series Overlap` to 100%. All data labels
    are mixed up and therefore we delete them from the “Target” column.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figat_HTML.png)


    A screenshot exposes an overlapping bar chart that represents the ranges of actual
    and target expenses by items. `Format Data Point` (on the right side) exhibits
    a set of series setting options.


    Then we switch the “Actual” to the auxiliary axis and set 0% for the `Series Overlap`,
    and 125% for the `Gap Width`. After setting the bit depth of the axis for the
    auxiliary series, we remove it from the diagram.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figau_HTML.png)


    A screenshot exposes an overlapping bar chart that represents the ranges of actual
    and target expenses by items. The `Secondary Axis` is the selected plot series
    setting.


    Then select the data series “Target.” We change its color to neutral gray so that
    the emphasis remains only on the actual, and set the following settings for it:
    the `Series Overlap` is 0%, and the `Gap Width` is 25%.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figav_HTML.png)


    A screenshot exposes an overlapping bar chart that represents the ranges of actual
    and target expenses by items. The `Primary Axis` is the selected plot series setting.


    All settings of the bullet chart are completed, and it looks almost like a standard
    from Power BI. Similarly, you can set up a vertical bullet chart, if you need
    it for work.'
