- fmt: '### 3.2.4 The Axis and Grid Are No Longer Needed


    We’ve labeled all the data points right on the graph, so we won’t need the scale
    on the left anymore. And since it does not perform any functions, we will delete
    it in order to clog up the review with unnecessary graphic elements. It is from
    such trifles that a “pleasant to the eye” visualization is formed.


    **Solution 1.** Select the values of the Y axis on the graph, open the context
    menu with the right mouse button ➤ the “Delete” item.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figt_HTML.png)


    A snippet consists of a line graph of wage fund analysis on the values of targets
    and actuals in thousands with the execution of 104% with a column of division
    and expense item.


    **Solution 2.** Select the diagram and click on the green cross that appears on
    the right. In the “Axes” section, uncheck the box next to the “Primary vertical”
    item.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figu_HTML.png)


    A line graph depicts data with the values on the sum of targets and actuals with
    points denoting the exact data for the months from January to June with chart
    elements.


    By the same principle, we will remove the horizontal grid lines on the diagram.
    They are needed to compare points on the graph with the scale. But if there is
    no scale, then these lines do not perform useful functions.


    ***Tip!***


    *Sometimes they object to me: it looks empty without lines, let’s add at least
    a background fill of the diagram. My answer is no. We work with minimalistic business
    graphics, and let’s maintain this style to the end. When we finish the dashboard,
    you will make sure that decorations in the form of lines or backgrounds are not
    needed.*


    To delete the grid lines in the diagram, click on any of them, make sure that
    the entire grid is selected, and click “Delete.” Alternatively, use the “+” icon
    to the right of the highlighted chart and uncheck the “Gridlines” item in the
    drop-down menu.


    Now there is almost no excess left on the chart.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figv_HTML.png)


    A set of two line graphs labeled before and after with fluctuating curves depicts
    the value of the data on the sum of the target and the sum of the actual from
    January to June.


    ### 3.2.5 Summary


    The task of labels on the dashboard is to facilitate the perception of data and
    make visualizations understandable. The default settings do not help this, so
    we brought the labels to the desired form ourselves.


    *   Added data labels to the “Chart Elements” menu.

    *   Set the decimal places number of the labels to zero on the “Data Labels format”
    panel.

    *   The decimal places were removed so that it was easy to perceive numbers.

    *   Increased the font of data labels, X-axis labels, and legends.

    *   We removed the Y axis along with the values on it: we already have data labels.

    *   Removed the grid lines on the diagram to avoid “information noise.”


    ## 3.3 Working with the Text: Remove the Superfluous, Add the Necessary


    In the last part, we simplified the perception of numbers on the diagram. Now
    let’s deal with words and titles so that they convey the meaning of visual elements
    as quickly and clearly as possible.


    To do this, we will work with the legend and remove everything from the graph
    that does not help data analysis.


    ### 3.3.1 Where and How to Place the Legend


    By default, Excel has positioned the legend to the right of the chart. But the
    person starts reading from the left. That is, first he will see the graph and
    only then, having stumbled upon the legend, he will understand what his lines
    mean. So, we will have to go back to the graph again.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figw_HTML.png)


    A diagram consists of a line graph with fluctuating curves and the points with
    an eye and circle depicting data from January to June with exact data. Text is
    provided in a foreign language.


    That’s why the legend should be visible immediately. To do this, it should be
    placed above the diagram or to the left of it. That is, in the direction of reading:
    from top to bottom and from left to right. There are several ways to configure
    the correct location.


    **Solution 1, Through the Context Menu**


    *   We highlight the legend on the graph.

    *   Open the context menu with the right mouse button and select the item “Format
    Legend…”

    *   On the panel that opens, in the “Legend Position” section, select the “Top”
    item.

    *   Check the box “Show the legend without overlapping the chart.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figx_HTML.jpg)


    A snippet illustrates a format legend chart and a line graph with a column in
    which the Format Legend menu is selected with an excel page of columns T to X.


    **Solution 2, in the “Chart Elements” Menu**


    *   We highlight the legend on the graph.

    *   By clicking on the icon with a green cross to the right of the chart, we open
    the “Chart Elements” menu.

    *   In the drop-down list next to the “Legend” field, select the “Top” item.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figy_HTML.jpg)


    A snippet depicts the Chart Elements menu on the right with the option top selected
    from the Legend. At the left is the data from the line graph for June.


    This arrangement of the legend takes into account the peculiarities of human perception
    and saves space on the dashboard.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figz_HTML.png)


    A line graph with two fluctuating curves illustrates the data on the values of
    the sum of the target and the sum of the actual with the points with exact values
    from January to June.'
