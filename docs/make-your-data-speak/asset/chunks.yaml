    requirements for the presentation of information as well as the location of visual
    elements and interactive slicers.


    We have finished the data preparation, then we will work with the so-called dashboard
    draft. We will prepare a layout, place information blocks with visual elements
    on it, and assemble an interactive version.'
  trans: '

    ### 1.4.4 五步搞定数据样本与切片器


    对样本进行操作可以通过优化来简化可视化元素的创建。为此，我们首先对基础样本进行完整配置，然后复制它，即可获得一个几乎已经完成的新的样本。


    **步骤 1.** 在新工作表中创建第一个包含数据透视表字段“月份”、“目标”和“实际”的样本。


    **步骤 2.** 在“数据透视表分析”选项卡 ➤ “选项”中，或通过右键快捷菜单打开数据透视表参数。


    ![](img/537732_1_En_1_Figat_HTML.png)


    一个 Excel 工作表，显示三列，分别为行标签、目标总和与实际总和。该表被“分段”和“数据透视表选项”覆盖。


    **步骤 3.** 在打开的设置窗口中，取消勾选“更新时自动调整列宽”选项。如果不这样做，每次使用切片器后都需要重新调整列宽。


    ![](img/537732_1_En_1_Figau_HTML.png)


    数据透视表选项菜单页面。数据透视表名称为“付款动态”。针对显示的空单元格，已启用“更新时保留单元格格式”。


    **步骤 4.** 从基础样本中添加所需的切片器。在“插入”选项卡上，单击“切片器”，并在弹出的窗口中勾选所需字段。


    要在切片器上选择多个类别，请单击其标题附近的“多选”按钮，并取消选中不需要的位置。另一种方法是按住键盘上的 `Ctrl`（或 `cmd`）键，然后用鼠标选择所需位置。


    **步骤 5.** 剩下的工作是复制已自定义的基础样本，并添加所有必要的可视化元素占位符。


    ![](img/537732_1_En_1_Figav_HTML.png)


    Excel 工作表截图，包含一个折线图（显示 1 月至 6 月每月实际值均高于目标值，4 月达到峰值）、一个垂直条形图（在 4 种类型中，“生产工人”的实际值和目标值最高）和一个水平条形图（在
    5 种类型中，“薪资”最高）。表格包含相同的数据。


    “数据透视表字段”窗格可以随时隐藏，需要时再次调出：右键单击数据透视表的任意单元格，然后使用“显示字段列表”按钮。


    ![](img/537732_1_En_1_Figaw_HTML.png)


    Excel 工作表，带有位于 2 个表格之上的右键菜单。已选择“显示字段列表”选项。所选字体样式和大小为 Calibri 11。


    ### 1.4.5 总结


    切片器是仪表盘交互的核心。它们像按钮一样工作，点击每个按钮都会更新屏幕上的所有数据。方便、易懂、易于分析。


    1.  在工作表上添加并配置包含数据透视表的基础样本：在右侧窗格中选择所需字段。

    2.  关闭“更新时自动调整列宽”选项，否则每次使用切片器后都需要设置列宽。

    3.  从样本中添加切片器（“插入” ➤ “切片器”），并在打开的设置面板中勾选必要字段。

    4.  要“停用”切片器上的某些类别，请选中该切片器，按住 `Ctrl`（或 `cmd`）键，然后单击不需要的位置。

    5.  复制自定义样本，并添加可视化元素的占位符。


    在复制之前设置好基础数据样本，将大大减少创建切片器和可视化元素占位符的时间。


    ### 1.4.6 Excel 快捷技巧


    *“Ctrl”适用于 Windows。MacBook 应使用“cmd”。*


    | **“智能”表格** 如果将常规列表转换为表格 (`CTRL+T`)，会发生什么： • 表格标题将自动冻结。 • 自动筛选功能会开启。 • 表格的尺寸将自动适应数据。
    • 所有公式将自动向下填充至整列。 |

    | :--- |

    | ![](img/537732_1_En_1_Figax_HTML.jpg) 一个带有画刷的表格网格图标的表示。下方文本是“套用表格格式”下拉选项。 |

    | **快速向下复制** 如果需要将公式复制到列底，最好不要手动拖拽黑色十字：只需用鼠标左键双击它即可。 |

    | ![](img/537732_1_En_1_Figay_HTML.jpg) 一个快速向下复制设置图标的表示。列中的第一个单元格已被选中。右下角有一个黑色十字，下方有一个向下箭头。
    |

    | **填充空单元格** 要用前一个单元格的值填充空单元格 • 选中整个区域。 • 按 `F5` ➤ 定位条件... ➤ 空值。 • 单击“=”号，然后单击上箭头键，创建对前一个单元格的引用。
    • 按 `CTRL+Enter` 键，将生成的公式输入到所有单元格中。 |

    | ![](img/537732_1_En_1_Figaz_HTML.jpg) 一个列的表示。前 3 个单元格填充了 A，接下来的 2 个单元格填充了 B，再接下来的
    3 个单元格填充了 C。 |

    | **向图表添加系列** ![](img/537732_1_En_1_Figba_HTML.jpg) 一个表格，包含“一月”和“二月”两列以及 3 行（A
    B C、D E F、G H I），以及一个垂直双柱形图。表格中选中的“二月”列在柱形图中以虚线柱体表示。只需复制单元格区域，然后使用鼠标右键或键盘快捷键 `CTRL+C`
    和 `CTRL+V` 将其粘贴到图表中。 |


    # 2. 仪表盘组装


    之前步骤获得的结果仅仅是准备阶段。仪表盘的工作始于创建其布局，布局需考虑信息呈现的要求，以及可视化元素和交互式切片器的位置。


    我们已经完成了数据准备，接下来我们将处理所谓的仪表盘草稿。我们将准备一个布局，在上面放置包含可视化元素的信息块，并组装一个交互式版本。

    '
- fmt: '## 2.1 Assembling Dashboard According to the Layout


    You can start by creating a sketch, that is, an outline of the future dashboard.
    Any graphic editor, `Microsoft PowerPoint` program, or even a sheet of paper is
    enough for this – a sketch can be schematically drawn by hand. Based on this document,
    we will create a layout.


    The structure of our dashboard can be represented as follows:


    1. Dashboard title

    2. Key performance indicators (KPI) cards

    3. Working area

    4. Slicers panel on the left


    The sketch needs to be turned into a real layout, which will become our starting
    point. There will be more precision here – the layout should contain all visualizations,
    slicers, and auxiliary elements.


    In the middle part (under the KPI cards), we combined two blocks into one so that
    we could track the dynamics of expenses over a longer period.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figa_HTML.png)


    A dashboard displays three components: objective, actual, and execution. Additionally,
    it contains three side blocks: slicer division, slicer expense item, and slicer
    months, as well as three middle blocks: cost dynamic by months, division, and
    expense items.


    Now we have a layout and blanks for visual elements. We assemble them so that
    the structure corresponds to the created layout.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figb_HTML.png)


    A dashboard consists of three graphs for a month, division, and expense item.
    It contains three side blocks namely division, month, and expense items on one
    side and some calculations on another side.


    We do this on a separate sheet of our Excel file – let’s call it “`Dashboard`.”


    The sheet where the blanks from the pivot table are now located will be renamed
    to “`Draft`.” Here we will store and prepare all the necessary data for the final
    dashboard.


    First, we will transfer all the slicers to the “`Dashboard`” sheet. To do this,
    select the first slice on the “`Draft`” sheet and, pressing `Ctrl` (or `cmd`)
    on the keyboard, select the rest with the mouse. We cut out the entire group of
    slicers.


    ***Tip!***


    *Don’t leave copies of visual elements on the “`Draft`” sheet, so as not to get
    confused in them in the future. Transfer everything you need for work to the “`Dashboard`”
    sheet, and leave the “`Draft`” for data preparation and calculations.*


    Go to the “`Dashboard`” sheet and insert the cut. We place the slicers on the
    left according to the layout, leaving five lines on top for the title of the dashboard
    and KPI cards.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figc_HTML.png)


    A snippet of an excel sheet with three vertical elements: division, expense item,
    and month.


    Then we transfer the prepared diagrams from the “`Draft`” sheet to the “`Dashboard`”
    one: the same way as we did it with slicers. We place the diagrams on the sheet
    in accordance with the layout:


    - On top of the entire width of the screen is a graph of dynamics.

    - At the bottom left is a clustered column chart for divisions.

    - At the bottom right is a clustered bar chart for expenditure items.


    We already have something similar to a dashboard. In this case, only the samples
    from the pivot table remain on the “`Draft`” sheet.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Figd_HTML.jpg)


    A snippet demonstrates one line graph and two bar graphs, namely month, division,
    and expense item, and three side blocks, namely division, expense item, and month.


    ### 2.1.1 Summary


    Start working on the dashboard by creating a sketch and layout. Use any visual
    editor for this or make a sketch by hand.


    1. Determine which visualizations are needed on the dashboard.

    2. Arrange them on the layout according to the principle “from general to specific.”

    3. Make sure that the most important data is not “lost” against the background
    of the rest.


    Assembly according to the layout is faster and easier for most beginners. Firstly,
    because we made the blanks for the visual elements in advance. Secondly, because
    here we get a visual result of the work done.


    Visualizations are not final yet. But the interaction with the slicers already
    filters the charts, and we see how the interactive dashboard will work.


    ## 2.2 Creating KPI Cards


    At the top of the dashboard, we left space for the totals. There is no need to
    build diagrams here, it is enough to display the number and its title large enough.
    I call such an object a KPI card. We need to create three such cards:


    - Target

    - Actual

    - Execution


    To do this, you will also need data samples from the pivot table. They can be
    replicated in the same way as we have already done for blanks of visual elements.
    Already created samples are not used here, since additional calculations or transformations
    may be required for KPI cards.


    ### 2.2.1 Sampling Data for Cards


    To replicate, copy any sample on the “`Draft`” sheet, paste it a little lower
    and on the “`PivotTable Fields`” pane, uncheck the box next to the name of the
    field with the “Expense item” category. You can also remove this field from the
    “Rows” area.


    So we get a sample on a pivot table with data on key indicators with a target
    and an actual.


    ![](images/537732_1_En_2_Chapter/537732_1_En_2_Fige_HTML.jpg)


    A snippet of an excel sheet with the pivot table fields pane and three uncheck
    boxes, namely division, expense item, and month, as well as two checkboxes, namely
    target and actual.'
