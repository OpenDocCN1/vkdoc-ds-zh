    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaa_HTML.jpg)


    A screenshot depicts an excel file, which has 3 graphs of payment dynamics, expenses
    by divisions, and items with actual and target values and execution.


    Excel offers a variety of different styles for interactive slicers, but no options
    without a contour. Let us approach this in a different way.


    **Step 1.** Select any slicer with the mouse and right-click on the light blue
    style in “Slicer” menu tab (“Options” in older versions of Excel). Select “Duplicate”
    in the context menu.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figab_HTML.jpg)


    A screenshot depicts an excel file that lists the options under the slicer with
    the selected duplicate option. It has a graph of wage fund analysis with target
    and actual values.


    **Step 2.** Select “Whole Slicer” in “Modify Slicer Style” dialog box and click
    “Format” button.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figac_HTML.png)


    A screenshot depicts the modified slicer-style window that lists the options under
    the slicer-style light 12 with the slicer element, preview, and the selected format
    and OK buttons.


    **Step 3.** A new window “Slicer Element Format” will open to configure the parameters:
    select “None” on “Border” tab and click “OK.”


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figad_HTML.png)


    A screenshot depicts the format slicer element window that lists the options under
    the border with the line style, color, presets, and border options.


    Repeat “OK” in the first window “Modify Slicer Style.”


    **Step 4.** A new contour-free option for slicer styles appears in the drop-down
    menu. To use this option, select all the slicers by holding down Ctrl (or cmd)
    key and click the option.


    Now our dashboard is completely free of excessive lines and visual barriers. We
    also have extra workspace: you can stretch the slicer over several months and
    get rid of yet another unnecessary element, the scroll bar.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figae_HTML.jpg)


    A screenshot depicts an excel file, which has 3 graphs of payment dynamics, expenses
    by divisions, and items with actual, target, and execution.


    Working with slicers and empty diagrams: avoiding mistakes.


    Each interactive slicer on Excel dashboard filters all charts by default – including
    the chart created on their basis. This looks like an error to the user.


    Clicking on month, for example, we only see blurry dots in the section instead
    of “Expenditure Dynamics” graph.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaf_HTML.jpg)


    A screenshot depicts three graphs of payment dynamics, expenses by divisions,
    items with actual and target values in thousand dollars, and execution.


    The same happens when choosing a specific division or expense item: the diagram
    associated with the slicer used does not explain whether it is good or bad relative
    to the other categories.


    If you apply several filters at the same time, you might have a completely “empty”
    dashboard, which will confuse the user.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figag_HTML.jpg)


    A screenshot depicts the payment dynamics, expenses by divisions, and items with
    actual and target values in thousand dollars, and execution in %.


    ### 4.3.2 Solving the Problem


    To preserve the necessary information when filtering, we will disable slicers
    on the charts linked to them. I call this “Disconnecting slicers from themselves.”
    We add this setting at the last stages of dashboard development.


    We will need a window with a list of reports connected to the slicer. It can be
    requested in two ways:


    1.  Select a slicer ➤ open the context menu clicking the right mouse button ➤
    select “Report connections.”


    2.  Select a slicer ➤ go to “Slicer” menu tab (“Options” in older versions of
    Excel”) ➤ select “Report connections” button.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figah_HTML.png)


    A screenshot depicts an excel file that lists the options under the slicer with
    the selected button of report connections.


    We will see the slicer we are setting up in parentheses in the title of the opening
    window: this is why we gave names to pivot tables in Part 1.3\. We now need to
    uncheck the box next to the data sample bearing the same name.


    For example, if we are setting up a slicer by divisions, we need to uncheck the
    box next to “Divisions” field. “Expenditure by Division” chart will not be filtered
    when using this slicer.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figai_HTML.jpg)


    A screenshot depicts the report connection that lists the options under division
    with the commercial employees, logistics and service, production workers, and
    company management.


    We should perform similar actions with all other slicers: the “by-month” filter
    should be disabled from “Months” sample, and the filter by expense should be disabled
    from “Expense Items” sample.


    This setting will not allow filters to affect data sets with the same name: you
    can use any slicer, and all visual elements will remain in their places and will
    not cause confusion to the user.


    Here are some conclusions we can draw applying several filters at the same time:


    *   The salary of the company management in April took 88% of the planned value
    of $153,000 – this is what we can see on the cards.


    *   “ Expenditure Dynamics” graph shows how the salary target and actual values
    for the company management change from month to month.


    *   We can compare the total salary of the company management in April with the
    indicators of other divisions in the diagram “Expenditure by Divisions.” The salary
    is lower than that of production and commercial employees, and higher than that
    of employees in logistics and service departments.


    *   “Expenditure by Items” chart shows that most of company expenses on management
    were paid in bonuses: salaries in the division took second place in April.


    There are no more empty blocks on the dashboard: the correct slicer configuration
    makes each diagram as informative as possible.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaj_HTML.jpg)


    A screenshot depicts three graphs of payment dynamics, expenses by divisions,
    and items with highlighted company management, salary, and April.


    ### 4.3.3 Summary


    We customized the appearance and functionality of the interactive slicers at the
    final stages of dashboard development. This is a quick summary of what we did.


    To disable the contour of the slicers, we


    *   Chose a suitable light blue slicer style


    *   Changed it by removing the borders in the settings


    *   Applied a new style to all the slicers


    To connect slicers to data samples, we


    *   Selected “Report Connections” function in the menu


    *   Disabled the effect of each slicer on the chart linked to it


    *   Tested the operation of the configured slices on the dashboard'
