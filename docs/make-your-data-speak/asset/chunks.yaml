- fmt: '## 1.1 What’s Wrong with the Initial Data


    A common problem: employees make reports in a way that is convenient for them
    without thinking about how others will work with this data later. We get tables
    that are difficult to understand: with auxiliary calculation columns, comments,
    and color highlights. Sometimes it is a ready-made report from the Enterprise
    Resource Planning accounting system, which then “grows” with notes and groupings.


    It is convenient for the author of such a table to work with it: to enter data
    into a new column, drag down the formula, check the calculation results on the
    next sheet. But the problem is not even that it is not obvious to everyone else
    – such data cannot be loaded into the pivot tables which are the basis for a dashboard
    we make.


    Let’s look at not the worst example – a table with data on staff costs.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figa_HTML.png)


    A table lists the staff costs for January to June and totals with target and actual
    values in Rupees. The highest actual total cost is 3823016 for production workers.


    * In the rows of the table, there are expense items and divisions, as well as
    subtotals for them. They are highlighted in color, but technically inside column
    A, these categories are indistinguishable.

    * To the right in the columns, there are the months in the merged cells, and below
    them is the Target/Actual grouping. That is, we have a two-level “table header.”


    It is really convenient to enter data into such a matrix structure. Especially
    if you need to add a number to a cell and forget about it. But we are thinking
    a few steps ahead: how to set up a report template that will be automatically
    updated when new data is added.


    **Solution:** The original matrix table needs to be transformed into the so-called
    “flat” format.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figb_HTML.png)


    A table lists the staff costs for January to April and totals with target and
    actual values. The rows from production workers, which has the highest actual
    cost 887568, through extra-budgetary funds are highlighted.


    | “Human-readable” format | “Machine-readable” format |

    | --- | --- |

    | Five categories of data in columns and rows:<br>    • In the columns – month,
    target, and actual values<br>    • In the rows – the division name and the cost
    item | Each category is in a separate column:<br>1. Division name<br>2. Staff
    costs items<br>3. Month<br>4. Target values<br>5. Actual values |


    If you enter data manually, it will add routine work: for each row with a numeric
    indicator, you need to repeat the categories (division, article, month). And the
    compact matrix will turn into hundreds and thousands of rows.


    The good news is that if you download the initial data from the database, then
    any information system allows you to do it in the same “flat format.”


    ### 1.1.1 How to Convert Data to a Flat Table


    A flat table with initial data should contain


    * A row of headings with category names

    * Five columns by number of categories

    * Non-repeating data in rows


    Rows shouldn’t have empty cells: division, expense item, and month should be specified
    for each row.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figc_HTML.png)


    A table lists the staff cost in January with division, expense item, month, target,
    and actual. Production workers'' salary is the highest at 493547 in the target.


    There are several ways to convert the initial data into a flat table: by manually
    copying data into the desired cells and by using macros or Power Pivot techniques.


    Let’s start with manual data copying: this method will take a little time, but
    for a new user, it’s easier than the others.


    **Tip!**


    *If you are a beginner in Excel, then before starting work, make a copy of the
    worksheet with data so that you can always clarify the original information.*


    **Step 1**. Column A in the initial table contains two categories of data: “Division”
    and “Expense item.” In a flat table, they should be in different columns. Here’s
    how to separate them.


    a) Add a new column to the left of column A. Method 1, the simplest: select column
    A, open the context menu with the right mouse button, select “Insert.” Method
    2: put the cursor on any cell in column A, in the menu on the “Home” tab, select
    the “Insert...” button in the “Cells” section and the “Insert Sheet Columns” button
    in the submenu.


    b) Drag the values of cells that contain the names of divisions into a new column.
    To do this, select the cells, bring the cursor to the border of this block and
    move it to a new location.


    c) Fill down empty values in the new column with the names of divisions for the
    rows in which the expense items remain.


    d) Give to columns A and B the correct names in the row above the data: “Division”
    and “Expense item,” respectively. In the same row, we will specify the headers
    of the remaining columns.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figd_HTML.jpg)


    An excel sheet with a total value of 1427671. Production workers and commercial
    employees are highlighted as row headers.


    **Step 2.** Then you need to delete the rows that contain totals and subtotals
    by divisions from the table. Otherwise, the data will be summed several times,
    and we will get an incorrect result.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Fige_HTML.gif)


    An excel sheet depicts the production workers, commercial employees, logistics
    and service, and company management. A page with delete option is overlapped.


    **Step 3**. The next step is to add a column which will contain data about months.


    a) Insert a new column to the left of column C with expense items.


    b) Copy the name of the month to the first empty cell of the new column.


    c) Select this cell and drag it down by the lower right corner of the frame –
    the column will automatically be filled with months in their order (the same will
    happen with a date or a sequence of numbers).


    d) Changing this sequence, because first we need to collect data for January.
    In the lower right corner of the selected block, click the “Autofill Options”
    menu icon that appears and select “Copy cells.”


    After completing these steps, we received a flat table in columns A–E for the
    necessary categories with data for January.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figf_HTML.png)


    A table lists the staff cost in January with division, expense item, month, target,
    and actual values. Production workers'' salary is the highest at 493547 in the
    target. 24 data is listed.


    **Step 4.** Move the target and actual data for February to columns D and E below
    the January values. Drag down the value “February” opposite these cells in column
    C.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figg_HTML.gif)


    An excel sheet depicts the company management with bonuses, civil contracts, vacation
    reserve, and extra-budgetary funds with their values for January and February.


    **Step 5.** Repeat step №4 with the data for the remaining months. The names of
    all the months are moved to column C, the planned indicators – in column D, and
    the actual ones – in column E.


    **Step 6.** The contents of columns A and B are duplicated as follows by copying
    or dragging down, thus filling in empty cells.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figh_HTML.jpg)


    An excel sheet depicts the company management with bonuses, civil contracts, vacation
    reserve, and extra-budgetary funds for January and February.


    That’s all, it remains to clear the sheet with a flat table: remove unnecessary
    rows with subtotals and top rows until the category headers.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figi_HTML.png)


    A table depicts the staff cost in January with division, expense item, month,
    target, and actual values. Production workers'' salary is the highest at 493547
    in the target. 28 data is listed.'
