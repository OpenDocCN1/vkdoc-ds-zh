- fmt: '### 6.2.1 Charts for Rating


    To visualize a quantitative comparison, we use a figure called a column, which
    can have a horizontal or vertical orientation.


    But in MS Office, these are two separate charts: the vertical one is called a
    column chart, and the horizontal one is called a bar chart. Both are suitable
    for a rating with a single row of data, but are not always interchangeable. Let’s
    figure out in which cases it is not necessary to use everyone’s favorite column
    chart.


    #### Choose by the Number of Categories


    When there are many columns on the column chart, the category labels do not fit
    horizontally, and it is difficult to determine which column the data label belongs
    to at an angle.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figp_HTML.png)


    A bar graph of revenue by customers. S and P Global have the highest value at
    85 million dollars and Ecolab has the lowest value at 6 million dollars. A cross
    mark is on the extreme left top.


    To solve this problem, the diagram needs to be “flipped,” and then the category
    labels can be easily read horizontally from left to right. As a rule, if you have
    up to ten columns, the labels are placed on the vertical bar chart, and over ten
    – on the horizontal.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figq_HTML.png)


    A bar graph of revenue by customers. S and P Global have the highest value at
    85 million dollars and Ecolab has the lowest value at 6 million dollars. A tick
    mark is on the extreme right top.


    I remind you that ten categories are an approximate guide, you need to take into
    account other nuances.


    #### Consider the Length of the Labels


    In this example, there are only eight types of services, but they have very long
    names that are again at an angle.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figr_HTML.jpg)


    A bar graph of revenue for services. Ocean has the highest point of 315 9 million
    dollars and Container ships have the lowest value of 0 2 million dollars. A cross
    mark is on the extreme left top.


    Here again, a bar chart will help out although I recommend choosing abbreviated
    names for long types of services or cost items. The space should be used for visualization,
    not redundant text.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figs_HTML.jpg)


    A bar graph of revenue for services. Ocean has the highest point of 315 9 million
    dollars and Container ships have the lowest value of 0 2 million dollars. A tick
    mark is on the extreme right top.


    #### Estimate the Available Space on the Screen


    Revenue from seven branches on the column chart will be visible if there is space
    for it at least half the width of the dashboard or slide screen. But here we have
    about a quarter, and the labels again do not fit. And there is no such problem
    for a bar chart – it performs its function well.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figt_HTML.png)


    A set of 2 bar charts expose the levels of revenue by branches. Chicago: 400 million
    dollars (the highest range). Cross and tick marks are exhibited on the top corners
    of the vertical and horizontal bar charts respectively.


    **BRIEF CONCLUSIONS: WHEN THE COLUMN CHART DOES NOT FIT**


    *   If you need to compare more than ten objects


    *   If the category captions don’t fit horizontally


    *   If there is not enough space on the dashboard for a column chart


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figu_HTML.jpg)


    A representation exhibits the quantitative comparison of horizontal and vertical
    orientations. Number 10 is the represented rated level.


    ### 6.2.2 Charts for Dynamics


    To show how one indicator has changed over time, a line graph or a column chart
    is better suited. In some cases, you can also use a graph with areas – I will
    not focus on it yet.


    Let’s figure out when to choose a chart with vertical columns, and when a line
    graph. The criterion is still the same – the number of data points; only here
    it increases to 12.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figv_HTML.png)


    A line graph and a bar graph expose the ranges of profit dynamics from January
    to December. August has the highest profit dynamics (14 million dollars). Tick
    marks are exhibited on the top right corners of the graphs.


    12 periods will be visible both on the chart and on the column chart, because
    the names of the months are shortened. But if the months of the next year also
    appear on the dashboard, there will be an overload.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figw_HTML.png)


    A bar chart exposes the ranges of profit dynamics in 2019 and 2020. June 2019
    and August 2019 have the highest profit dynamics (9 million dollars). A cross
    mark is exhibited on the top left corner.


    In this case, the chart will better focus attention on the trend line and get
    rid of unnecessary visual “noise.”


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figx_HTML.png)


    A line chart exposes the ranges of profit dynamics in 2019 and 2020. June 2019
    and August 2019 have the highest profit dynamics (9 million dollars). A cross
    mark is exhibited in the top right corner.


    #### Less Than Six Periods


    The reverse situation is when we have only a few data points, for example, four
    quarters of the year. In my lectures, I show two diagrams side by side: I warn
    that the data is the same, and I ask which one is the best at first glance. Most
    choose columns.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figy_HTML.png)


    A line chart and a bar chart exhibit the revenue dynamics in 4 quarters. Quarter
    4 has the highest revenue dynamics (70 million dollars). Cross and tick marks
    are exposed on the top corners of the line and bar charts respectively.


    I agree with them: the line graph looks disconnected from the scale and somehow
    empty. Smooth lines between points are also confusing, because growth or fall
    are rarely so uniform. There is not enough data for a convincing trend line, there
    is no trust in it. And on the column chart, the emphasis is more on the amount
    for the quarter, but at the same time, the chronological order is preserved.


    #### A Common Mistake with the Direction of the Scale


    Sometimes mini-charts with dynamics are added on dashboards right under the KPI
    cards (or even instead of them), for example, for several years. And often bar
    charts are used for this.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figz_HTML.png)


    A set of 4 horizontal bar charts exhibits the revenue, profit, margin, and sales
    dynamics for 2019, 2020, and 2021\. A cross mark is exposed in the top left corner.


    Don’t make such a mistake! We have the timeline strictly on the X-axis, that is,
    horizontally. So, for such mini-charts, we choose mini column charts.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaa_HTML.png)


    A set of 4 vertical bar charts exhibits the revenue, profit, margin, and sales
    dynamics for 2019, 2020, and 2021\. A tick mark is exposed in the top right corner.


    **BRIEF CONCLUSIONS: VERTICAL COLUMNS OR LINES?**


    *   If there are less than six periods, choose a column chart.


    *   If there are a maximum of 12 periods, both are suitable.


    *   If there are more than 12 periods, only a line chart.


    *   A bar chart has no place in displaying dynamics.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figab_HTML.jpg)


    A representation exhibits the range of dynamics in the bar chart (left) and the
    line chart (right). 12 is the range of the dynamics.


    ### 6.2.3 Diagrams for the Structure


    To show which parts make up something whole, most often use a pie chart or its
    kind – a doughnut chart. There is no difference between them, so the choice is
    yours. But there is another way to display the structure – this is a treemap chart.


    Both the pie chart and the trimap are divided into sectors – the same shares of
    the whole. In sectors, you can show, for example, the share of revenue in each
    city. Or to see the full structure of the company’s expenses, if different items
    of expenses will be located in the sectors. Let’s figure out when to divide a
    circle into parts, and when to divide a rectangle.'
