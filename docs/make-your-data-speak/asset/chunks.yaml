- fmt: '# Story 1: How George from the Ministry Made a Summary Report


    George heads the development department in one of the ministries. Usually he does
    not write reports – subordinates do. But sometimes he has to answer for the quality
    of the data and their presentation himself.


    It was in this situation that George found himself when he had to prepare a report
    on the status of the implementation of a target program for a deputy minister.
    To do this, it was necessary to collect data from subordinate organizations and
    demonstrate in an understandable way the situation as a whole.


    ## Problem: There Is Data, There Is No Clarity


    At first glance, it was not difficult – the program consisted of a list of projects,
    activities, milestones with deadlines, and planned results. But it was necessary
    to take into account a nuance: projects can have different sources of funding
    and one project can relate to several targeted programs.


    All subordinate organizations sent Excel reports on their projects. Some of them
    added columns with event statuses, others colored rows by status, third ones wrote
    about the reasons for deviations in the comments to the cell.


    Each organization’s report showed that everything was supposedly under control,
    but the overall progress of the program remained unclear. The task of George was
    to show:


    - What projects are not being implemented, lagging behind the planned deadlines

    - Where is the problem in financing, where are the sources changing

    - Which of the responsible persons is not coping

    - Which projects were agreed to be postponed


    The desired report did not require a beautiful presentation: a table with reliable
    data would be enough. But there was a lot of data, and it was not easy to collect
    them into one whole. A concise summary report was required to provide details
    on each project.


    George already knew that this is called a dashboard – he took one of my courses.
    He even roughly imagined how such a dashboard should look like. But he had absolutely
    no idea how to fit all the necessary information into it and structure the data.
    And it was impossible to entrust the task to someone else, because he had to answer
    personally to the deputy minister.


    ## How to Show Everything at Once?


    After suffering in attempts to reduce heterogeneous tables into a single array,
    George came to me for a consultation. He looked, frankly, not the best way:


    *I didn’t sleep for two days. There are 4 days until the meeting with the Deputy
    Minister, and my report is not ready yet. Help me to make a form for collecting
    data from departments. Everyone sends a report, as it suits him, I’ve been trying
    to put them together all night, but nothing comes out!*


    *I don’t even need beauty on the dashboard. The main thing is that the data converge
    with each other and can be filtered according to the characteristics of projects.*


    We discussed what conclusions he wants to convey, what counter-questions may arise,
    what filters are needed to show the details. As a result, we drew a sketch of
    the dashboard and compiled a list of fields for a flat table. We took ten lines
    from the old report and converted it to a new format. We tested it and realized
    that we need to add a couple more features to the data collection form.


    As a result, George received a template and gave the task to his subordinates
    to fill out on time clearly according to the specified form. He even managed to
    analyze and propose to the deputy minister a new scheme for managing the target
    program. And when, on the last day, two departments sent “the most recent correct
    data,” he just loaded them into a template – nothing had to be redone.


    ### Can’t Delegate? You’ll Have to Learn How to Work with Data


    Managers, and even more so top managers, do not collect and process data every
    day. For them, analytics is not a profession or a hobby, but a regular necessity.
    Especially when the data is confidential or requires personal attention. It is
    impossible to simply entrust this to a subordinate, because you need to draw conclusions
    yourself.


    That’s why I started this book with the part about data preparation. You don’t
    have to keep all the Excel functions in mind. When such a task arises, you will
    open this visual guide, remember the principle of operation, and find which button
    to press. And while others will confer for a week and agree on the format of data
    presentation, prepare a dashboard in a couple of hours and find insights for strategic
    decisions.


    ## Story 2: How Analyst Michael Brought the Director the “Aircraft Control Panel”


    When we met, Michael had been working for an energy sales company for six years.
    He said that the management appreciates his technical skills, but... understands
    very little of everything he does. Mike even liked it: the fact that no one else
    will be able to do such a job is not bad for self-esteem.


    ### An Hour and a Half to Explain the Report


    He prepared weekly reports for the commercial director. The director complained
    that he did not understand anything, asked millions of questions on “translation
    from analytical language to human” and hinted that it would be nice to learn how
    to make beautiful presentations.


    “What is more important to you??” Michael was angry. “I spent three days on these
    calculations, I give you a full calculation, and do you need pictures?!”


    “Mike, well, we’ve been sitting on this for an hour and a half,” the director
    complained. “And so every week. There shouldn’t be such a thing that every table
    has to be explained for so long, do you understand?”


    Usually everyone left with their own opinion. The director says that Michael is
    boring, and Mike says that the director is stupid.


    ### “Make It Clear and Come Back Tomorrow”


    The last straw was the factor analysis for the past quarter. There doesn’t seem
