    | 1 | The palette contains a contrasting set of colors, there are shades for the
    “traffic light” | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figan_HTML.gif)A
    tick mark. | With this, the theme is in full order |

    | 2 | The background of the KPI cards does not conflict with the text | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figao_HTML.gif)A
    tick mark. | Black font on a light background is easy to read |

    | 3 | Chart columns do not merge with each other | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figap_HTML.gif)A
    cross mark. | Lost contrast on new backgrounds |

    | 4 | Data labels are clearly visible | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figaq_HTML.gif)A
    cross mark. | Poorly distinguishable on a new background |

    | 5 | Background of service elements is muted | ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figar_HTML.gif)A
