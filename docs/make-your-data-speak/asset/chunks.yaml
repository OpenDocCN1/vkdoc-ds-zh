    \ is also why we offer a choice of several design options.\n\nWorking with the\
    \ dashboard daily, the client understands that a black font against a light background\
    \ is more convenient to read.\n\n### Example 3: The Background of the Dashboard\
    \ Does Not Have to Be White\n\nLet us look at another option from Excel, `Parcel`\
    \ theme. There is a lot of yellowness here too, but even in its default version\
    \ `Target` and `Actual` contrast well. You can leave it as it is, or you can spend\
