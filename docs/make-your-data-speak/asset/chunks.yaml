    # 故事 1：部里的乔治是如何制作总结报告的


    乔治是某部委的开发部门主管。通常他不写报告——那是下属的事。但有时他必须亲自为数据质量及其呈现方式负责。


    乔治就遇到了这种情况：他需要为一位副部长准备一份关于目标计划执行情况的报告。为此，必须从下属机构收集数据，并以一种易于理解的方式展示整体状况。


    ## 问题：数据有，清晰度无


    乍一看，这并不难——该计划由一系列项目、活动、带有截止日期的里程碑以及预期成果组成。但必须考虑到一个细微之处：项目可能有不同的资金来源，并且一个项目可能涉及多个目标计划。


    所有下属机构都发送了关于其项目的 Excel 报告。有些机构添加了事件状态的列，有些按状态对行进行了颜色标记，还有一些在单元格的注释中写明了偏差原因。


    每个机构的报告都显示一切似乎尽在掌控，但整个计划的总体进展仍然不明确。乔治的任务是展示：


    -   哪些项目没有实施，落后于计划期限

    -   哪里存在资金问题，哪些资金来源正在发生变化

    -   哪些负责人无法胜任

    -   哪些项目已被同意推迟


    理想的报告并不需要精美的呈现：一个包含可靠数据的表格就足够了。但数据量很大，而且将它们整合成一个整体并不容易。需要一份简洁的总结报告，以提供每个项目的详细信息。


    乔治已经知道这被称为仪表盘——他上过我的一门课程。他甚至大致想象得出这样的仪表盘应该是什么样子。但他完全不知道如何将所有必要的信息纳入其中并结构化数据。而且也不可能将这项任务交给别人，因为他必须亲自向副部长汇报。


    ## 如何一次性展示所有内容？


    在痛苦地尝试将各种不同的表格合并成一个单一数组后，乔治来找我咨询。坦白说，他看起来状态糟透了：


    *我两天没睡觉了。离见副部长还有 4 天，我的报告还没准备好。帮我想个办法，从各部门收集数据。每个人都随心所欲地发报告，我花了一整晚想整合它们，但什么都搞不定！*


    *我甚至不需要仪表盘多好看。主要是数据之间能相互对应，并且可以根据项目特征进行筛选。*


    我们讨论了他想传达哪些结论，可能会出现哪些反问问题，需要哪些筛选条件来展示细节。最后，我们草拟了一个仪表盘的草图，并整理了一个平面表格的字段列表。我们从旧报告中取了十行数据，转换成新格式。进行测试后，我们意识到需要在数据收集表格中再增加几个功能。


    最终，乔治拿到了一份模板，并明确要求下属准时按规定格式填写。他甚至成功进行了分析，并向副部长提出了一个管理目标计划的新方案。而当最后一天有两个部门发送了“最新最准确的数据”时，他只是将其加载到模板中——无需重做任何事。


    ### 无法授权？那就得学会处理数据


    管理者，尤其是高层管理者，并不每天都收集和处理数据。对他们来说，分析不是职业或爱好，而是一种常规需求。尤其是在数据保密或需要亲自关注的情况下。这件事不能简单地交给下属，因为你需要自己得出结论。


    这就是为什么我在这本书的开头就讲了数据准备的部分。你不需要记住所有的 Excel 函数。当遇到这样的任务时，你可以打开这本可视化指南，回想操作原理，并找到要按哪个按钮。而当别人花一周时间商量并敲定数据呈现格式时，你可以在几小时内准备好一个仪表盘，并为战略决策找到洞察。


    ## 故事 2：分析师迈克尔如何给总监带去“飞机控制面板”


    我们相遇时，迈克尔已经在一家能源销售公司工作了六年。他说管理层很欣赏他的技术能力，但……对他所做的一切几乎一无所知。迈克甚至喜欢这一点：没有人能胜任他这份工作，这对自尊心来说不错。


    ### 花一个半小时解释报告


    他每周为商务总监准备报告。总监抱怨说他什么都看不懂，问了无数个关于“从分析语言翻译成人话”的问题，并暗示最好学学如何制作漂亮的演示文稿。


    “什么对您更重要？？”迈克尔很生气。“我花了三天做这些计算，给您完整的数据，您还需要图片？！”


    “迈克，你看，我们为这个已经坐了一个半小时了，”总监抱怨道。“而且每周都这样。不能让每张表格都需要花这么长时间解释，你明白吗？”


    通常，他们都是各持己见。总监说迈克尔太无聊，迈克则说总监太笨。


    ### “做清楚点，明天再来”


    最后一根稻草是过去一个季度的因素分析。似乎没什么可指责迈克的——他夜以继日地工作，才按时完成。他疲惫不堪地来开会，但还是做到了。


    需要考虑几十个因素，并得出关于什么影响了公司财务结果的结论。这里有生产供应量、释放能量数量的变化动态、天气因素，还有许许多多其他东西。


    为了让商务总监满意，这次米哈伊尔决定不局限于数字，于是除了图表，他还添加了因果关系的文字解释。


    和往常一样，他把结果放到了 Excel 里。结果变成了一个巨大的矩阵：表格、图表、图形、用于重新计算的按钮。这看起来完全像专业飞行员的飞机控制面板。


    迈克觉得商务总监可能搞不明白。这意味着他又得花一个半小时去解释。但已经没有时间去做“美化”了。会议大致是这样的：


    “你看，这次我按您的要求做了个仪表盘，带可视化效果的！”

    “迈克，明天我得把这个拿给 CEO 看。我该怎么跟他说？他会问问题，而我这里什么都不懂。把它做清楚点，明天早上再来。这是你现在最重要的目标，我明天要看到结果。”

    '
- fmt: '# Beautiful Is More Expensive


    There was no miracle in the morning, the boss still had to delve into all the
    details. After sitting together for another two hours, they made a short version
    in the form of a presentation, but it was still impossible to do without large
    tables. However they learned that the skill of business visualization can be obtained.
    Then the director sent Michael to my training, where we met.


    Analysts often say that all this visualization is only decoration. If we have
    reliable metrics, then we can draw conclusions even from the table. This is true
    for the one who collected and calculated this data himself. But for a manager
    who sees them for the first time, it is important to switch quickly, understand
    where the problems are, and draw conclusions. And proper visualization accelerates
    the process of perception, helps to solve this problem.


    Like Michael, many analysts are so keen on calculations that there is no time
    left for design. But this is necessary for business, because it helps to quickly
    understand the essence and make decisions. And business appreciates it very much.


    To simplify this task for techies, I wrote a book in the form of clear instructions
    with clear checklists. There is no need to break your head and spend long hours
    on creative searches. Following the best practices, each analyst will be able
    to make his dashboard look like a designer worked on it.


    # Story 3\. How HR Irene Struggled with Digital Illiteracy


    Irene is HR director of a construction company. The head office is located in
    one of the Manhattan business centers and branches operate in the regions. Irene
    came to me with something like this problem: everyone has digitized processes
    in production and sales, dashboards with analytics are set up, and in her directorate
    “no one needs anything.”


    HR specialists are located in regional offices with salaries “not above average,”
    and their motivation is the same. They don’t know how to work with data, and they
    don’t want to learn.


    ## Not All Employees Are Equally Useful


    Subordinates really did not have much interest in work, nor digital literacy.
    The reports were made without diligence, not for understanding how to increase
    labor productivity or optimize the budget fund.


    Moreover, mistakes were constantly made in the reports. Then they delete a row
    that seems unnecessary, then they rename the column or add something from themselves.
    For example, one day in the report card, one person entered the number of employees
    as “7 in the morning.” Of course, this broke not only the numeric format of the
    cell, but also a bunch of formulas and calculations related to it.


    ## “I Didn’t Know You Could Do This in Excel”


    We decided to gather all employees in New York and conduct full-time training
    on working with data. At the training, I saw their faded eyes and unwillingness
    to change something in their work. But many really just didn’t understand what
    the management wanted from them, why they filled out new tables from month to
    month.


    When everyone saw that their reports were becoming part of the dashboard for the
    board of directors, the perception changed. Employees began to show interest and
    offer ideas on what other metrics to add, what conclusions can be drawn from them.


    Of course, questions began to arise where to get the data. Part is in ERP, but
    they are unloaded badly. Part of it is assembled manually, but each branch does
    it in its own format. I have shown how these tasks can be solved on Excel pivot
    tables.


    As a result, the training participants were divided into two groups. Some, more
    advanced, started setting up report templates. And others (of which there were
    more) finally understood how to keep records correctly so that their colleagues
    could continue to do analytics.


    “I didn’t know that you could do this in Excel,” said an HR specialist from Pittsfield.
    “I saw similar reports from salesmen, but I thought it was worth millions. And
    now I can make a beautiful report for the head myself, and also have time to write
    an explanatory note with conclusions to it.”


    # Digital Talent Pool


    A month after the training, I asked Irene how things were going with digitalization.
    She answered honestly, that many, after leaving their region, found themselves
    caught in the routine. But, on the other hand, an active group of six people appeared,
    who systematize reports in their branches and develop new standards.


    Now they are not sending her a mountain of tables, but all ready conclusions and
    suggestions, comments on deviations. And for this, they receive an additional
    bonus. By the end of the quarter, they plan to replicate the reporting system
    to other, more passive branches.


    Some of the employees did not want to grow, and someone no longer became a performer,
    but a reliable adviser for their manager. Irene formed a team of like-minded people
    around her and gave them motivation for career growth.


    Of course, this book is not enough to implement the digital transformation of
    the company. It’s not about strategy or artificial intelligence. But if the majority
    of office employees read it and apply simple rules in their work, then the overall
    corporate culture will grow seriously. And there will no longer be a gap between
    advanced managers in Manhattan and “mere mortals” in branches.


    If visualization and dashboards are already the standard of work for you, then
    share this book with your colleagues. And then they will start speaking the same
    language with you faster, and team efficiency will increase.


    ## Conclusion


    These three stories are united by one common situation. The customer has an image
    of the result, the dashboard itself, but he does not know how to clearly set the
    task. The performer, the owner of the data is waiting for a clear statement and
    does not guess what solutions to offer. Because he does not know how it happens
    differently, from which side to approach the analytical task.


    Managers, analysts, middle managers – many people face difficulties in correctly
    submitting data. I wrote this book so that you can get rid of them as easily and
    quickly as possible with the help of techniques and practices approved by dozens
    of my clients and thousands of students.


    Approaches to working with data and visualization rules are the same for Excel
    and for any BI system. I am giving instructions for Excel, because it remains
    the most common program for working with reports that any analyst and manager
    has to deal with.


    Don’t be surprised that the book starts with practice, and theory goes at the
    end. Everyone has heard the theory one way or another, but stumbled on its application.
    Therefore, I will take you through the end-to-end case of creating a dashboard
    – from raw data to advanced design. To do this, I supplemented the book with QR
    codes and links to video tutorials. They describe the work in even more detail,
    and the book will be at your fingertips as a synopsis with illustrations.


    You will see that all this is not so difficult, sometimes even fascinating, feel
    your freedom of action and be able to go beyond my checklists by studying the
    visualization rules in the last part. And also continue to learn useful life hacks.


    Remember that you should not draw a diagram just because you know how to do it!
    It is important to convey the meaning of the data and make the right decision.


    Have a good reading and practice at the computer!


    # About the Author


    # About the Technical Reviewer


    # 1. Data Preparation


    Reports in the usual tables prepared manually are not suitable for building dashboards.
    The information in them is arranged conveniently and understandable for human
    perception, but isn’t suitable for machine processing. Therefore, dealing with
    data is the first step before developing a dashboard.


    In this part of the book, I will tell you what to pay attention to when analyzing
    the initial data and show you how to prepare them properly, so that the interactive
    dashboard is automatically updated.'
