  trans: '

    ### 5.3.4 设置图表


    **图表的背景。** 当前背景仍为浅色主题，我们需要使其与整个仪表板的颜色保持一致。为此，选中绘图区，在主菜单选项卡中点击“填充”颜色，选择最深的棕色——即我们用于仪表板背景的同一颜色。


    **图表中的线条。** 现在有一个新任务——在这样的背景下，蓝色线条图形显得暗淡。让我们将其颜色改为绿色。为此，选中绘图区，通过鼠标右键打开菜单。这里你需要同时使用两个按钮：“填充”和“轮廓”。


    ![](img/537732_1_En_5_Figx_HTML.png)


    屏幕截图展示了图表设置和背景修改。绘图区下拉选项被选中，并显示了填充和轮廓按钮。同时选择了更改图表类型按钮以配置图表。


    **图表上的数据标签。** 我们在功能区菜单中为数据标签选择颜色。通常我会让它们与线条或柱形的颜色一致，但在深色背景上，这种设置可读性会变差。因此，对于“目标”和“实际”标签，我选择比对应图表线条浅几个色阶的颜色。红色不难处理——合适的颜色就在可用调色板中。


    ![](img/537732_1_En_5_Figy_HTML.png)


    一张 Excel 工作表展示了图表上数据标签的修改。折线图被选中。从“开始”菜单中访问调色板，并选择了比相应图表线条更浅的颜色。


    但对于绿色系，调色板中的现有颜色不合适——太“荧光”了。因此，我们将为这条线的标签手动选择颜色。以下是我的做法。


    *   选中“目标”线条的数据标签。

    *   为标签选择基础绿色（与线条颜色相同）。

    *   在菜单中再次点击“字体颜色” ➤ “其他颜色”。

    *   在打开的窗口中，选择一个比线条更浅的色调。


    ![](img/537732_1_En_5_Figz_HTML.png)


    屏幕截图展示了从自定义颜色中选择“其他颜色”选项，其中包含颜色代码以及“确定”和“取消”选项。


    **坐标轴和图例中文字的颜色。** 更改图表背景后，类别标签“变淡了”，难以辨认。图例中的参数名称也是如此。为了修正这一点，我们将类别名称和图例标题的字体颜色改为最浅的棕色。


    ### 5.3.5 通过模板应用图表


    该图表已完全定制并适配仪表板的深色主题。我们将其用作模板，以便在其他图表中无需重复所有步骤。


    ![](img/537732_1_En_5_Figaa_HTML.png)


    屏幕截图展示了如何通过填充和轮廓选项在仪表板中使用模板，以节省创建仪表板的时间。


    1.  选中图表，在右键菜单中选择“另存为模板”。

    2.  将模板保存到建议的文件夹中（不要更改路径），并赋予其一个清晰的名称。

    3.  选中“各部门支出”图表，在右键菜单或“设计”选项卡中选择“更改图表类型”选项。

    4.  在打开的窗口中，进入“模板”文件夹，选择已定制的深色图表模板。

    5.  再次使用“更改图表类型”选项，在菜单中选择柱形图。


    并非所有设置都能自动达到预期效果。如果 X 轴标签倾斜放置，请减小字号——它们应保持水平。


    此外，“目标”列上的绿色变成了黄色。我们将其恢复：用鼠标选中任一列（所有“目标”列应被高亮），然后选择绿色填充。


    对第三个图表“各项目支出”重复使用模板的步骤。最终图表应如下所示：


    ![](img/537732_1_En_5_Figab_HTML.png)


    窗口屏幕显示了模板修改工作后的输出页面。它包含一个关于付款动态的折线图，以及两个关于各部门和各项目支出的柱形图。'
- fmt: '### 5.3.6 Setting Up Slicers in a Dark Theme


    Interactive slicers remained the only unformed element on the dashboard. There
    is no suitable one among the ready-made styles for them, so we will configure
    them ourselves.


    Let’s take the style with red buttons from the `Dark` section as a basis – we
    will bring it to the desired result. In the list of styles, it is called `Rose`.


    To change it, select any slice on the dashboard. On the menu tab `Slicer` (or
    `Options`), right-click the desired style ➤ `Duplicate`.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figac_HTML.png)


    A screenshot illustrates the different slicer styles to modify the slicer style.
    It also includes the preview, format, and clear options.


    In the window that opens, in the section `Slice Element` – about ten items. Most
    of them are needed to customize the appearance of the slicer buttons in different
    states: when selecting, when hovering the mouse, and so on.


    In order for everything to work as it should, we will have to configure each of
    these items separately. We will do this according to the same scheme: select the
    desired item, click the `Format` button, and add the necessary settings in a new
    window.


    **Whole slicer.** On the `Border` tab, select the `No` option. On the `Fill` tab,
    select the darkest shade of brown – the same one that we used for the dashboard
    background. Click `OK`.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figad_HTML.png)


    A screenshot illustrates the format slicer element option to fill the background
    of the dashboard including pattern color and style.


    **Header.** This is the second item in the list of slice elements. On the `Font`
    tab, set `Montserrat (Main text)`, and also adjust the color. Here we will set
    the lightest shade of brown – the same one that we chose for other headers.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figae_HTML.png)


    A screenshot illustrates the slicer font modification by changing the color, style,
    size, and effect.


    **Selected Item with Data.** Here we configure the type of active buttons, that
    is, pressed for filtering. By default, the `Fill` tab has a color that will suit
    us – we leave it unchanged.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figaf_HTML.png)


    A screenshot illustrates how to modify the pattern style and color of the slicer
    by filling the color option.


    **Selected Item with no Data.** These are the pressed buttons, under which there
    is no data. We are satisfied with the default settings – we leave it as it is.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figah_HTML.png)


    A screenshot illustrates how different colors are used to fill the font pattern
    of the dashboard.


    **Unselected Item with Data.** This is the color setting of inactive buttons when
    using a slicer. By default, when filtering, they will turn gray: we will change
    the color of this fill to brown – we will choose from the shades between the darkest
    and the lightest.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figai_HTML.png)


    A screenshot illustrates how the default color can be changed while choosing a
    color between the darkest and the lightest.


    **Unselected Item with no Data.** Here we take the light brown color of the fill.
    It will be applied to inactive buttons with no data under them.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figaj_HTML.png)


    A snapshot illustrates that different colors are added to the unselected data
    to highlight the data.


    In the section `Slicer Element`, we have four items left. All of them are needed
    to adjust the appearance of the buttons when hovering the mouse.


    - Hovered Selected Item with Data

    - Hovered Selected Item with no Data

    - Hovered Unselected Item with Data

    - Hovered Unselected Item with no Data


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figak_HTML.png)


    A snapshot illustrates the different color-added slicer elements to adjust the
    appearance of the dashboard.


    For these remaining items, we will set the same settings:


    - On the `Fill` tab, we will select a shade a tone lighter than the dashboard
    background.

    - On the `Font` tab, we will set the light brown color and the Montserrat font.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figal_HTML.png)


    A snapshot illustrates the font style and size, underline and effect, and theme
    color to modify the dashboard.


    All elements are configured. In the `Modify slicer style` window, click `OK`.
    The resulting style is applied to the rest of the slicers on our dashboard.


    The dashboard `Wage fund analysis` in the dark theme of corporate identity is
    ready!


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figam_HTML.png)


    A window screen displays B I institute of business and intelligence page in a
    dark theme. The wage fund analysis is highlighted with charts and line plots.
    The slicers on the left side of the screen are more apparent.


    ### 5.3.7 Summary


    To create a professional dashboard in a dark theme, I had to pay special attention
    to the contrast of the elements. Somewhere we added it, and somewhere, on the
    contrary, we removed it.


    - The headers of the dashboard and charts were made light so that they were clearly
    visible on a dark background.

    - The lines under the headers were reduced in brightness and selected a shade
    a tone lighter than the background of the dashboard.

    - The blue cards did not fit into the new design – we also made them a tone lighter
    than the background of the dashboard.

    - We changed the excessively bright background of the graph: for this we used
    the same fill as for the dashboard background.

    - On the new background, the blue line of the graph faded: we changed its color
    to green.

    - We have selected new colors for data labels. Green from the palette did not
    fit, so we picked it up manually.

    - Category captions have been made light so that they are visible on a new dark
    background.


    A separate story is the slicers: I had to tinker with them, adjust the color of
    the buttons for each state. I admit, I don’t remember all these combinations by
    heart myself. This once again showed that Excel can do anything. The one who knows
    its capabilities gets a lot of freedom of action. And it can do its job much faster.


    # 6. Data Visualization Rules


    We are done with the practice – now let’s move on to the theoretical part. Usually
    people do the opposite, but I use this approach on purpose. Firstly, so as not
    to limit you to theory right away. Secondly, because there are exceptions in every
    visualization rule – I will also show their examples in this part.


    These rules are relevant not only for Excel. They will help out when working in
    any BI platform if you want to accurately and quickly convey the essence of the
    data to the user.


    The information in this part is a clear base for beginners, which will help accurately
    display the meaning of the data and increase the value of analytical work for
    any customer.'
