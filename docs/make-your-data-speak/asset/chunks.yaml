    The theme that we took in PowerPoint already contains colors in the palette for
    both light and dark options. Therefore, we use a new fill – the darkest shade
    of brown. And let’s check what turned out well and what needs to be fixed.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figq_HTML.png)


    A window screen displays the B I institute of business and intelligence page in
    a dark theme. In this case, the dark-font logo and titles are rendered invisible.
    The colors of the columns, lines, and data labels blend.


    *   The logo became indistinguishable on a dark background.


    *   The black font of the titles has also become invisible.


    *   Blue KPI cards do not fit into the new design.


    *   The background of the diagrams remained light – this does not correspond to
    the dark theme.


    *   The design of the slicers also does not correspond to the dark theme of the
    dashboard.


    And these are not all the disadvantages. The colors of the columns and lines,
    as well as the data labels and the font color of the inscriptions remained the
    same as in the light theme. But we are making a dark dashboard: as soon as we
    change the background of the diagrams, they will also be lost.


    ### 5.3.1 Dashboard Title and Logo


    I called the sheet with a copy of the light branded dashboard “The dashboard Dark”:
    I will carry out the transformation on it.


    The first thing that attracts attention is the “faded” logo. Because of the new
    background, it became indistinguishable. We will take an option from a dark theme
    in a PowerPoint presentation. Just as we did in the last chapter.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figr_HTML.jpg)


    A screenshot displays a dashboard header and the website logo of B I institute
    of business and intelligence with a dark theme. The chosen logo is seen here (faded
    and indistinguishable due to the dark background).


    We also immediately see that the title “Wage fund analysis” has been lost on a
    dark background. Select the cell with the dashboard header and select white on
    the main menu tab under the Font Color button.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figs_HTML.png)


    An Excel sheet displays the B I institute of business and intelligence website
    logo, slicers, and a dashboard title with a dark theme presentation. A light color
    shade from the color palette is chosen for the dashboard text.


    No operations with checking the font or changing its size are required here: we
    make a dark version on the dashboard with the “branded” font already configured.


    ### 5.3.2 Chart Titles


    They have also lost their visibility on a dark background, which means that we
    are changing the font color of these elements as well. So that they do not “take
    away” the brightness from the title of the dashboard, we will choose the lightest
    shade of brown from the palette (90% lighter than the background).


    **The line under the titles.** This element also remained light, and this also
    needs to be changed: in the dark version, semantic blocks should also be clearly
    separated from each other. First we will adjust the width of this line.


    *   Select the cell with the chart title.


    *   On the “Home” menu tab, click the “Borders” button.


    *   In the drop-down menu, select “Line style” ➤ the widest line.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figt_HTML.png)


    An Excel sheet depicts the changes in line under titles on a corporate page with
    a dark theme. The cell containing the chart title is chosen and the borders option
    is selected from the home menu to obtain the line style.


    Next, in the same menu, click “Line color”: from the suggested options, you need
    to choose a shade a tone lighter than our background.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figu_HTML.png)


    A screen displays the home menu options. A lighter color than the background is
    chosen from the color palette after selecting the line color from the home menu
    to draw attention to the text.


    Do not be afraid of the “pencil” that has appeared: it draws exclusively straight
    lines. We can only use it to paint over the line under the chart heading. You
    can exit the drawing mode using the Esc key.


    We set the same formatting for the titles of the other charts. You can repeat
    the preceding points for each, or you can select a formatted cell and use the
    “Format Painter” button to repeat this format for other titles.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figv_HTML.png)


    An Excel sheet displays a corporate page in a dark theme. The first dashboard
    title is distinguished by varying fonts, while the other two are obscured by the
    background''s darkness.


    ### 5.3.3 New Color for Cards


    They catch the eye first of all – the saturated blue color does not harmonize
    with the new theme of our dashboard. If I recommended using a light gray or blue
    color of the cards for a white background, then here, according to this principle,
    I will take a shade of branded brown, only 25% lighter. It will turn out that
    the cards are “pressed” into the background.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figw_HTML.png)


    An Excel sheet displays new colors for cards. The color scheme is set in the home
    menu and the branded brown shade is chosen for the cards.'
  trans: '

    ## 5.3 创建深色主题仪表板


    深色风格在演示文稿和仪表板中看起来都更具原创性和高级感。但要达到这种效果，你需要付出更多努力：检查所有元素，确保它们清晰可见且对比度足够。在某些地方需要增加对比度，而在另一些地方则需要减少。


    有些细微之处无法用清单罗列——它们需要经验和观察力。这就是为什么我推荐使用浅色主题，客观上来说，浅色主题更容易处理。


    如果你必须让你的作品符合特定的企业形象，那么这部分内容就是为你准备的。如果不是，你可以结束练习，继续学习可视化规则。


    我建议从浅色主题的副本开始创建深色主题的仪表板。复制包含“品牌化”版本的工作表，并给它一个明确的名字。这样你就能同时保留浅色和深色两种符合企业风格的仪表板。


    我们在 PowerPoint 中采用的调色板已经包含了浅色和深色两种选项的颜色。因此，我们使用一种新的填充色——最深的棕色。然后我们来检查一下效果如何，以及哪些地方需要修正。


    ![](img/537732_1_En_5_Figq_HTML.png)


    一个窗口屏幕显示深色主题下的 B I 商业与智能学院页面。在这种情况下，深色字体的标志和标题变得不可见。柱状、折线和数据标签的颜色融为一体。


    *   标志在深色背景上变得难以区分。

    *   标题的黑色字体也变得不可见。

    *   蓝色的 KPI 卡片与新的设计不协调。

    *   图表的背景仍然是浅色的——这与深色主题不符。

    *   切片器的设计也不符合仪表板的深色主题。


    而这些还不是全部的缺点。柱状和折线的颜色，以及数据标签和文字字体的颜色，仍与浅色主题中的相同。但我们在制作深色仪表板：一旦我们更改了图表的背景，它们也会丢失。


    ### 5.3.1 仪表板标题和标志


    我将复制了浅色品牌仪表板的工作表命名为“仪表板 _Dark”：我将在此工作表上进行转换。


    首先引人注意的是“褪色”的标志。由于新的背景，它变得难以区分。我们将从 PowerPoint 演示文稿中选取一个深色主题的选项。就像我们在上一章中所做的那样。


    ![](img/537732_1_En_5_Figr_HTML.jpg)


    一张截图显示深色主题下仪表板的标题和 B I 商业与智能学院的网站标志。这里可以看到选中的标志（由于深色背景而显得褪色且难以区分）。


    我们同时也立即看到，标题“工资基金分析”在深色背景上消失了。选中包含仪表板标题的单元格，然后在主菜单选项卡的`字体颜色`按钮下选择白色。


    ![](img/537732_1_En_5_Figs_HTML.png)


    一个 Excel 工作表显示深色主题演示文稿中的 B I 商业与智能学院网站标志、切片器和仪表板标题。为仪表板文本从调色板中选择了一种浅色。


    这里不需要进行任何检查字体或更改其大小的操作：我们在仪表板上使用已配置好的“品牌”字体制作深色版本。


    ### 5.3.2 图表标题


    它们在深色背景上也失去了可见性，这意味着我们也要更改这些元素的字体颜色。为了使它们不“抢走”仪表板标题的亮度，我们将从调色板中选择最浅的棕色（比背景浅 90%）。


    **标题下方的线条。** 这个元素也仍然是浅色的，这也需要更改：在深色版本中，语义块也应该清晰地相互分隔。首先，我们将调整这条线的宽度。


    *   选中包含图表标题的单元格。

    *   在“开始”菜单选项卡上，点击“边框”按钮。

    *   在下拉菜单中，选择“线型” ➤ 最宽的线。


    ![](img/537732_1_En_5_Figt_HTML.png)


    一个 Excel 工作表展示了深色主题企业页面上标题下方线条的更改。包含图表标题的单元格被选中，并从“开始”菜单中选择了“边框”选项以获取线型。


    接下来，在同一菜单中，点击“线条颜色”：从建议的选项中，你需要选择一种比我们的背景色调稍亮的颜色。


    ![](img/537732_1_En_5_Figu_HTML.png)


    屏幕显示“开始”菜单选项。从“开始”菜单中选择“线条颜色”后，从调色板中选择一种比背景更亮的颜色以吸引对文本的注意。


    不要害怕出现的“铅笔”：它只会画直线。我们只能用它来描画图表标题下方的线条。你可以使用`Esc`键退出绘图模式。


    我们对其他图表的标题设置相同的格式。你可以为每个标题重复前面的步骤，或者你可以选中一个已设置格式的单元格，并使用“格式刷”按钮将此格式复制到其他标题。


    ![](img/537732_1_En_5_Figv_HTML.png)


    一个 Excel 工作表显示深色主题下的企业页面。第一个仪表板标题通过不同的字体得以区分，而另外两个则被深色背景所掩盖。


    ### 5.3.3 卡片的新颜色


    它们首先会吸引眼球——饱和的蓝色与我们仪表板的新主题不协调。如果我之前推荐对白色背景使用浅灰色或浅蓝色卡片，那么在这里，根据同样的原则，我将采用品牌棕色中仅比背景亮
    25% 的色调。这样卡片看起来就像是“内嵌”在背景之中。


    ![](img/537732_1_En_5_Figw_HTML.png)


    一个 Excel 工作表显示了卡片的新颜色。在“开始”菜单中设置配色方案，并为卡片选择了品牌棕色调。

    '
- fmt: '### 5.3.4 Setting Up a Graph


    **The background of the graph.** It still remains in the light theme, and we need
    to bring it in line with the color of the entire dashboard. To do this, select
    the plot area and on the main menu tab, click “Fill” color to select the darkest
    shade of brown – the same one that we used for the dashboard background.


    **A line on the graph.** Now a new task – against such a background, the blue
    line graphics faded. Let’s change its color to green. To do this, select the plotting
    area and open the menu with the right mouse button. Here you need to use both
    buttons: “Fill” and “Outline.”


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figx_HTML.png)


    A screen depicts the graph setup and background modification. The plot area dropdown
    option is selected with fill and outline buttons. The change chart type button
    is selected to configure the graph.


    **Data labels on the graph.** We select the color for the data labels already
    in the menu ribbon. Usually I make them in the color of lines or columns, but
    on a dark background, this option will read poorly. Therefore, for both the “Target”
    and “Actual” labels, I choose a shade several tones lighter than the corresponding
    graph lines. It’s not difficult with red – the right color is in the available
    palette.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figy_HTML.png)


    An Excel sheet displays the modification of data labels on the graph. The line
    graph is chosen. The color palette is accessed from the home menu and a lighter
    color than the appropriate graph lines is selected.


    But for green shades in the layout of colors will not work – too “neon.” Therefore,
    we will choose the color for the labels for this line ourselves. That’s how I
    do it.


    *   I select data labels for the “Target” line.

    *   I choose the base green color for the labels (the same as on the line).

    *   I click “Font color” again in the menu ➤ “More colors.”

    *   In the window that opens, I choose a shade lighter than the line.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figz_HTML.png)


    A screenshot illustrates the more color option from the custom color to choose
    from with the color codes with the o k, and cancel options.


    **The color of the inscriptions on the axis and in the legend.** After changing
    the background of the diagrams, the category labels “faded,” became difficult
    to distinguish. And along with them – the names of the parameters in the legends.
    To correct this, we will change the font color to the lightest shade of brown
    for both category names and captions in the legend.


    ### 5.3.5 Charts by Template


    The graph is fully customized and adapted for the dark theme of the dashboard.
    We use it as a template so as not to repeat all the steps in the rest of the diagrams.


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figaa_HTML.png)


    A screenshot illustrates how the templates are used in the dashboard by fill color
    and outline options to save time to create the dashboard.


    1.  Select the graph and select “Save as template” in the context menu.

    2.  Save the template in the suggested folder (do not change it), giving it a
    clear name.

    3.  Select the “Expenses by divisions” chart and select the “Change chart type”
    option in the context menu or on the “Designer” tab.

    4.  In the window that opens, in the Templates folder, select the customized dark
    template with a graph.

    5.  Again, use the “Change chart type” option and select the histogram in the
    menu.


    Not everything turns out as it should automatically. If the X-axis labels are
    placed at an angle, reduce the font size – they should only be horizontal.


    Also on the “Target” columns, the green color has changed to yellow. We return
    what we need: select any column with the mouse (all the “Target” columns should
    be highlighted) and select the green fill.


    Repeat the steps using the template for the third diagram “Expenses by items.”
    This is how the diagrams should look like in the end:


    ![](images/537732_1_En_5_Chapter/537732_1_En_5_Figab_HTML.png)


    A window screen displays the output page after the template modifies the work
    using charts. It includes line plots on payment dynamics and two bar charts on
    expenses by division and items.'
