- fmt: '### 4.1.2 Applying Cell Style


    We now need a style for the header that will be visually different from a usual
    text cell.


    Find “Cell Styles” section (“Styles” in older versions of Excel) in “Home” menu
    tab and select “Header 2” from the drop-down menu. This option will add a light
    blue outline to the lower border of the cell with the header.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figc_HTML.jpg)


    A screenshot depicts an excel file with a graph of wage fund analysis. It plots
    two fluctuating curves, and the peak is obtained in April with a maximum actual
    value.


    This outline will visually separate semantic blocks on the dashboard from each
    other. It will also make a slight emphasis on the symmetry and accuracy of the
    elements on the dashboard.


    Excel default font size for new headers is 13 points – we will set it to 16. We
    will then disable the duplicate standard title from the diagram block using the
    green cross to the right of the diagram (“Chart title” item) or in “Design” tab
    (“Add Chart Element” button).


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figd_HTML.png)


    A line graph of payment dynamics between January and June. It plots two fluctuating
    curves, and the peak is obtained in April with a maximum actual value of 1875.


    ### 4.1.3 Copying Formatting to Adjacent Cells


    We will use the same format for several more cells. Put the cursor in the cell
    with the chart title ➤ click the “Format painter” button in “Home” menu tab ➤
    select the cells after the header to the end of the graph with the mouse.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Fige_HTML.png)


    A line graph of payment dynamics between January and June. It plots two fluctuating
    curves, and the peak is obtained in April with a maximum actual value of 1875.


    If everything is correct, the same light blue outline will appear on the lower
    border of all these cells. The line gives an aesthetic effect, as well as sets
    boundaries for all elements on the dashboard and visually separates semantic blocks
    from each other.


    Now turn off the outline of the diagrams – this will save our product from typified
    Excel features and give extra airiness to the report. To do this, you need to:


    - Select the block with the chart.

    - Click “Shape Outline” in “Format” menu tab.

    - Select “No Outline” in the drop-down list.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figf_HTML.png)


    A screenshot depicts an excel file with a graph of wage fund analysis. It plots
    two fluctuating curves, and the peak is obtained in April with a maximum actual
    value of 1875.


    Without the contour, we now have more free space. Raise the legend a little higher
    and expand the area of the diagram. This will draw attention to the data.


    ***Tip!***


    *Align the titles to the left rather than the center. This will help avoid leaving
    an empty space on the dashboard. You will be able to raise the legend higher without
    piling up elements on the dashboard.*


    At this stage, there are enough lines under the new headers to create a clear
    dashboard structure. They are also tied to the Excel grid and will not be displaced
    in further visualization work. This is what the chart titles will look like.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figg_HTML.jpg)


    A screenshot depicts three graphs of payment dynamics, expenses by divisions,
    and expenses by items. Each plot has actual and target values of 8161 and 7820,
    respectively, with 104% execution.


    ### 4.1.4 Summary


    We started a new design version of the dashboard by designing chart titles in
    cells. They divided the whole of the panel into semantic blocks and set a clear
    structure for it.


    We added headers to the cells above the upper left corner of each chart.


    We aligned them to the left to avoid leaving an empty space.


    We chose “Header 2” style for cells with headers.


    1. We increased the font size to 16 to define semantic blocks.

    2. We disabled standard names inside the charts.

    3. We copied the style for the cells to the right of the headers.

    4. We disabled the diagram contours and expanded the plotting areas.


    ## 4.2 Creating New Cards on Top of the Cells


    The chart titles are now in the cells, which is not immediately noticeable. This
    simplifies the alignment and increases the working area of the diagrams. There
    are side effects, too.


    The distance between the lower diagrams equals the width of the cell, which is
    sizeable by itself. To shorten this distance, you will have to reduce the width
    of column J. This will affect the card with the actual indicator: the value will
    no longer fit the column and will be displayed as several `###` characters.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figh_HTML.jpg)


    A screenshot depicts three graphs of payment dynamics, expenses by divisions,
    and expenses by items. Each plot has the actual and target values of hashes and
    7820 with 104% execution.


    Combining cells seems to be a workable solution to the problem. Still, this will
    always come up if the cards “live” inside the cells.


    For example, I want to add another card with average monthly salary. I will then
    have to compress and move the other cards, which in turn will affect the overall
    diagram alignment.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figi_HTML.jpg)


    Three graphs of payment dynamics, expenses by divisions, and items. Each plot
    has actual and target values of 8161 and 7820 dollars, respectively, with 104%
    execution and an average wage of 86 dollars.


    When creating a dashboard and negotiating it with the customer, you may have to
    add and remove cards and diagrams repeatedly. To avoid ruining the alignment,
    we will “free” the cards from their grid cell bounds. We will create new independent
    elements.'
