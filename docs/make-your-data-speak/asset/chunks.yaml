    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figz_HTML.png)


    A set of 4 horizontal bar charts exhibits the revenue, profit, margin, and sales
    dynamics for 2019, 2020, and 2021\. A cross mark is exposed in the top left corner.


    Don’t make such a mistake! We have the timeline strictly on the X-axis, that is,
    horizontally. So, for such mini-charts, we choose mini column charts.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaa_HTML.png)


    A set of 4 vertical bar charts exhibits the revenue, profit, margin, and sales
    dynamics for 2019, 2020, and 2021\. A tick mark is exposed in the top right corner.


    BRIEF CONCLUSIONS: VERTICAL COLUMNS OR LINES?


    *   If there are less than six periods, choose a column chart.


    *   If there are a maximum of 12 periods, both are suitable.


    *   If there are more than 12 periods, only a line chart.


    *   A bar chart has no place in displaying dynamics.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figab_HTML.jpg)


    A representation exhibits the range of dynamics in the bar chart (left) and the
    line chart (right). 12 is the range of the dynamics.


    ### 6.2.3 Diagrams for the Structure


    To show which parts make up something whole, most often use a pie chart or its
    kind – a doughnut chart. There is no difference between them, so the choice is
    yours. But there is another way to display the structure – this is a treemap chart.


    Both the pie chart and the trimap are divided into sectors – the same shares of
    the whole. In sectors, you can show, for example, the share of revenue in each
    city. Or to see the full structure of the company’s expenses, if different items
    of expenses will be located in the sectors. Let’s figure out when to divide a
    circle into parts, and when to divide a rectangle.'
  trans: '

    ### 6.2.1 用于评分的图表


    为了直观地进行定量比较，我们使用一种称为“柱形”的图形，它可以是水平方向或垂直方向的。


    但在微软 Office 中，这是两种不同的图表：垂直方向称为柱形图，水平方向称为条形图。两者都适用于单行数据的评分，但并非总是可以互换。让我们弄清楚在哪些情况下不必使用大家最喜欢的柱形图。


    #### 按类别数量选择


    当柱形图上的柱子很多时，类别标签在水平方向上会放不下，并且倾斜的角度下很难判断数据标签属于哪根柱子。


    ![](img/537732_1_En_6_Figp_HTML.png)


    按客户划分收入的条形图。S&P Global 的价值最高，为 8500 万美元，Ecolab 的价值最低，为 600 万美元。左上角有一个叉号标记。


    为了解决这个问题，需要将图表“翻转”过来，这样类别标签就可以从左到右水平地轻松阅读。通常，如果你有不超过十个类别，标签放在垂直柱形图上；超过十个，则放在水平条形图上。


    ![](img/537732_1_En_6_Figq_HTML.png)


    按客户划分收入的条形图。S&P Global 的价值最高，为 8500 万美元，Ecolab 的价值最低，为 600 万美元。右上角有一个对勾标记。


    我提醒一下，十个类别只是一个大致参考，你还需要考虑其他细微差别。


    #### 考虑标签长度


    在这个例子中，只有八种服务类型，但它们的名称非常长，而且再次以倾斜角度显示。


    ![](img/537732_1_En_6_Figr_HTML.jpg)


    按服务划分收入的条形图。Ocean 的最高点为 31590 万美元，Container ships 的最低值为 20 万美元。左上角有一个叉号标记。


    在这种情况下，条形图仍然能解决问题，不过我建议对于长的服务类型或成本项目选择缩写名称。空间应该用于可视化，而不是冗余文本。


    ![](img/537732_1_En_6_Figs_HTML.jpg)


    按服务划分收入的条形图。Ocean 的最高点为 31590 万美元，Container ships 的最低值为 20 万美元。右上角有一个对勾标记。


    #### 评估屏幕上的可用空间


    如果仪表盘或幻灯片屏幕至少有半个宽度可用于显示，则七个分支的收入在柱形图上将是可见的。但这里我们只有大约四分之一的宽度，所以标签再次放不下。而对于条形图来说就没有这个问题——它很好地发挥了其功能。


    ![](img/537732_1_En_6_Figt_HTML.png)


    一组两个条形图展示了各分支的收入水平。芝加哥：4 亿美元（最高范围）。垂直和水平条形图的顶角分别有叉号和对勾标记。


    **简要结论：什么时候不适合使用柱形图**


    *   如果需要比较超过十个对象

    *   如果类别标题在水平方向上放不下

    *   如果仪表盘上没有足够的空间放置柱形图


    ![](img/537732_1_En_6_Figu_HTML.jpg)


    此图展示了水平和垂直方向的定量比较。数字 10 代表评分的等级水平。


    ### 6.2.2 用于动态趋势的图表


    为了展示某个指标随时间的变化，折线图或柱形图更为合适。在某些情况下，你也可以使用面积图——我暂时不重点讨论它。


    让我们弄清楚何时选择垂直柱形图，何时选择折线图。标准仍然是数据点的数量；只是这里的上限增加到了 12。


    ![](img/537732_1_En_6_Figv_HTML.png)


    折线图和柱形图展示了一月至十二月的利润动态范围。八月利润动态最高（1400 万美元）。图表右上角有对勾标记。


    12 个时段在折线图和柱形图上都能清晰显示，因为月份名称被缩短了。但如果仪表盘上还出现了下一年的月份，就会显得过载。


    ![](img/537732_1_En_6_Figw_HTML.png)


    柱形图展示了 2019 年和 2020 年的利润动态范围。2019 年 6 月和 2019 年 8 月利润动态最高（900 万美元）。左上角有一个叉号标记。


    在这种情况下，折线图能更好地将注意力集中在趋势线上，并消除不必要的视觉“噪音”。


    ![](img/537732_1_En_6_Figx_HTML.png)


    折线图展示了 2019 年和 2020 年的利润动态范围。2019 年 6 月和 2019 年 8 月利润动态最高（900 万美元）。右上角有一个叉号标记。


    #### 少于六个时段


    相反的情况是，我们只有很少的数据点，例如一年中的四个季度。在我的讲座中，我会并排展示两个图表：我提醒听众数据是相同的，并询问第一印象哪个更好。大多数人选择柱形图。


    ![](img/537732_1_En_6_Figy_HTML.png)


    折线图和柱形图展示了 4 个季度的收入动态。第四季度收入动态最高（7000 万美元）。折线图和柱形图的顶角分别有叉号和对勾标记。


    我同意他们的看法：折线图看起来与刻度脱节，并且有些空旷。点之间的平滑曲线也容易令人困惑，因为增长或下降很少如此均匀。没有足够的数据来形成令人信服的趋势线，人们对其缺乏信任。而柱形图则更侧重于每个季度的总额，同时保留了时间顺序。


    #### 关于刻度方向的常见错误


    有时仪表盘上会在关键绩效指标（KPI）卡片正下方（甚至代替它们）添加动态迷你图，例如，显示几年的数据。并且经常使用条形图来实现。


    ![](img/537732_1_En_6_Figz_HTML.png)


    一组四个水平条形图展示了 2019、2020 和 2021 年的收入、利润、利润率和销售动态。左上角有一个叉号标记。


    不要犯这样的错误！我们的时间轴严格位于 X 轴上，也就是水平方向。因此，对于此类迷你图，我们应该选择迷你柱形图。


    ![](img/537732_1_En_6_Figaa_HTML.png)


    一组四个垂直柱形图展示了 2019、2020 和 2021 年的收入、利润、利润率和销售动态。右上角有一个对勾标记。


    **简要结论：垂直柱形图还是折线图？**


    *   如果少于六个时段，选择柱形图。

    *   如果最多有 12 个时段，两者都适用。

    *   如果超过 12 个时段，只选折线图。

    *   条形图不适合显示动态趋势。


    ![](img/537732_1_En_6_Figab_HTML.jpg)


    此图展示了条形图（左）和折线图（右）的动态范围。12 是动态范围。


    ### 6.2.3 用于结构的图表


    为了展示某个整体由哪些部分组成，最常使用饼图或其变体——环形图。两者之间没有区别，因此选择权在你手中。但还有一种显示结构的方法——即树状图。


    饼图和树状图都被划分成扇区——即整体的各个相同部分。在扇区中，你可以展示，例如，每个城市在收入中所占的份额。或者，如果不同的费用项目位于扇区中，则可以查看公司费用的完整结构。让我们弄清楚何时将圆划分成几部分，何时将矩形划分成几部分。

    '
- fmt: '### Six sectors – Maximum for a Pie Chart


    Everything that will be said later about the pie chart is also relevant for the
    doughnut chart. Both of them display the whole, and the form imposes some restrictions
    on both. One of them is the allowed number of sectors. There should be no more
    than six sectors.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figac_HTML.png)


    A pie chart and a doughnut chart expose the percentages of distribution channels.
    `Online`: 29 percent. `retail`: 31 percent (the highest), `broker`: 21 percent,
    `agent`: 6 percent (the least), and `other`: 13 percent.


    Otherwise, the sectors of the circle will become too small and it will be difficult
    to understand what the difference is between them. In addition, you will not be
    able to place labels in them. Taking them outside the diagram is a bad idea: this
    will confuse the user and create a pile of elements.


    If there are from 7 to 10 sectors in your whole, it is better to choose a trimap
    diagram for visualization.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figad_HTML.png)


    A treemap chart exhibits the percentages of profit by branches. `Chicago`: 38
    percent (the highest), `Houston`: 22 percent, `Boston`: 11 percent, `Seattle`:
    9 percent, `Miami`: 8 percent, `New York`: 7 percent, and `Austin`: 6 percent
    (the least).


    ### Long Labels? Give Up the Pie Chart


    Category titles may not fit even with a small number of sectors. And this is also
    the reason for replacing the diagram. Treemap is larger in size, and therefore
    it is easier to place titles in its sectors that did not fit into a circle or
    doughnut.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figae_HTML.png)


    A pie chart and a treemap chart expose the percentages of profit on services.
    `Air Cargo` has the highest percentage (20 percent). A cross mark and a tick mark
    are exhibited on the top corners of the pie chart and treemap chart, respectively.


    ### Tips for Designing Pie Charts


    Pie charts have a lot of drawbacks, but sometimes this is the best visualization
    option. The convenience of perception and data analysis on a pie chart largely
    depends on its design.


    - Place the first sector so that it starts at the top of the circle, similar to
    the `12:00` point on the dial. Sort the sectors from larger to smaller.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaf_HTML.png)


    Two pie charts expose the percentages of the source of sales. 1. A cross mark
    is exposed on the top left corner. 2. A tick mark is exposed on the top right
    corner. The website has the least percentage (10 percent).


    - Do not use a legend on a pie chart: do not force the user to run his eyes from
    the sectors to their names in the legend and match the colors of these elements.
    Place the labels inside the sectors.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figag_HTML.png)


    Two pie charts expose the percentages of the source of sales. `Marketplaces` have
    the highest percentage (40 percent). 1. A cross mark is exhibited on the top left
    corner. 2. A tick mark is exposed on the top right corner.


    - It is better to put the labels of small elements outside the chart. Make sure
    that there are not too many of them, otherwise the labels will overlap each other.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figah_HTML.png)


    Two pie charts expose the percentages of the cost structure. `Rent` has the highest
    percentage (22 percent). 1. A cross mark is exhibited on the top left corner.
    2. A tick mark is exhibited on the top right corner.


    - Never. NEVER use 3D charts. For some reason, this is done most often with pie
    charts – to someone they seem more beautiful, to someone – more solid. But the
    3D distorts the perception of data. The example clearly shows how the near “volume”
    sector of 29% looks larger than the sector of 31%.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figai_HTML.png)


    A 3D pie chart and a pie chart expose the percentages of the sales channels. `Retail`
    has the highest percentage (31 percent). 1. A cross mark is exhibited on the top
    left corner. 2. A tick mark is exhibited on the top right corner.


    ### BRIEF CONCLUSIONS: HOW TO SHOW THE COMPOSITION OF THE WHOLE


    - If there are no more than six individual parts in the structure, a pie chart
    or doughnut chart will do.


    - If the labels do not fit into the sectors of the circle, take a treemap chart.


    - Don’t use a legend on a pie chart.


    - If there are from 6 to 10 individual parts in the structure, the treemap chart
    is suitable.


    - If the labels do not fit into the treemap sectors, use a bar chart as an extreme
    case.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaj_HTML.jpg)


    A representation exhibits the ranges of the structure in the pie chart and the
    treemap chart. 6 is the range of a pie chart and 10 is the range of a treemap
    chart.


    ### 6.2.4 Summary


    Even in three popular types of data analysis, you can get confused if you don’t
    know the rules for choosing charts. Use a simple scheme.


    - For rating: column or bar chart


    - For dynamics: a line graph, a column chart, or an area chart


    - For the structure: pie (doughnut) or treemap chart


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figak_HTML.jpg)


    A framework exhibits the ranges of the rating (in bar charts), dynamics (in bar
    and line charts), and structure (in doughnut and treemap charts). `Rating`: 10,
    `dynamics`: 12, and `structure`: 6 and 10.


    ## 6.3 Life Hacks for Multiple Data Series


    In the last part, we worked with one data series that showed only the actual value.
    But in real reports, you often have to deal with several rows, compare actual
    and targeted indicators in terms of rating, dynamics, or structure.


    On the `Wage fund analysis` dashboard, we compared departments and expense items
    according to target and actual. To visualize these ratings, a column chart and
    a bar chart were used, although horizontal and vertical columns would be suitable
    for both cases on such data. For 4–5 categories, it will still be visual.


    For dynamics, we built a linear chart, even though there were only six points.
    It may seem that this contradicts the rules described previously. But the data
    on the dashboard will be updated with new months, and one day there will be 12
    of them. Besides, for the beginning, it was important for me to show you different
    charts, not just columns.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figal_HTML.png)


    3 charts. A line chart exhibits the actual and target payment dynamics. Vertical
    and horizontal double bar charts expose the expenses (actual and target) by divisions
    and items respectively.


    All of the preceding can be represented more compactly by combining series.


    - For monthly dynamics – a combined chart with a line and columns.


    - For the rating of divisions – a chart with markers that replace columns with
    targeted values.


    - For the ranking by items, there is a chart with combined columns: the actual
    is here against the background of the target, as if a progress bar is striving
    for it.


    I must say right away that this is not a reference visualization: Excel does not
    turn out as beautifully and visually as it could be in `Power BI`, for example.
    And anyway, our main focus has become on the actual, and the target is the background.
    Somewhere it may be good, and somewhere it may not be very good.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figam_HTML.png)


    3 charts. A combinational chart exposes the actual and target payment dynamics.
    Vertical and horizontal overlapping bar charts expose the expenses by divisions
    and items, respectively.


    Let’s figure out what tricks you can use to build these visualizations, as well
    as what pros and cons they have.'
