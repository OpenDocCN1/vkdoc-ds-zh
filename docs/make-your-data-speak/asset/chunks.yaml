    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figas_HTML.jpg)A snippet of three
    columns namely row label, target, and actual is given with the data values of
    different labels. In the last row, the grand total is given.![](images/537732_1_En_3_Chapter/537732_1_En_3_Figat_HTML.gif)A
    horizontal bar graph depicts the values of the target and actual expenses by items
    namely salary, bonus, extra-budgetary funds, vacation reserved, and civil contracts.


    The same thing happens with the order of the “Target” and “Actual” columns. In
    the diagram, both in the legend and in the columns, the “Target” comes first.
    And only in the bar chart, the “Actual” comes first. Let’s fix this by adjusting
    the axis format.


    Select the categories on the Y-axis with the right mouse button and select “Axis
