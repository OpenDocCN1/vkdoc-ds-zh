  trans: '

    #### 带虚线的垂直子弹图


    第二种标准子弹图也可以在 Excel 中创建。


    **第一步。** 选择组合图来更改图表类型，然后为目标值选择“带标记的折线图”类型。


    ![](img/537732_1_En_6_Figaw_HTML.png)


    截图展示了更改图表类型的对话框，其中显示了一系列图表。组合图是选中的图表类型。一个上下文菜单展示了柱形图、条形图、折线图和面积图的设置选项。


    **第二步。** 设置数据系列 `Target`：在 `Line` 部分，将值设置为 `No line`；在 `Marker` 部分的 `Marker Options`
    子部分，选择 `Built-in` 类型，类型为最大虚线，并将大小设置为 45。


    ![](img/537732_1_En_6_Figax_HTML.png)


    截图展示了一个重叠条形图，按部门表示实际支出和目标支出。右侧显示了“设置数据系列格式”面板。`Built-in` 是选中的标记选项。


    **第三步。** 由于实际值与标记重叠，需要为该系列传输数据标签，并选择位置 `居中`。


    ![](img/537732_1_En_6_Figay_HTML.png)


    截图展示了一个重叠条形图，按部门表示实际支出和目标支出。右侧显示了“设置数据标签格式”面板。居中（The center）是选中的标签位置。


    但最终效果并不完美：对于较小的数值，物流和服务部门的数据标签仍然没有足够的空间。


    遗憾的是，这种子弹图只能在 Excel 中为垂直柱形图创建，而无法用于水平条形图。因为标记是图表的属性，而图表只能显示动态变化。动态变化只能存在于水平时间轴上。在这里，Excel
    的创建者出人意料地做了正确的决定，甚至没有提供创建垂直图表的机会。


    ### 复杂结构的图表


    在公司报告中，结构很少采用复杂的形式。但一旦出现这种情况，十份报告中有八份会以令人费解且错误的方式传达信息。这尤其适用于以下两种情况：


    - 需要同时按两个参数显示结构时

    - 需要将结构与其他分析类型结合展示时


    我将展示最常见的一个错误，并为这类问题提供替代的解决方案。


    #### 错误：双数据系列的环形图


    传统的结构图表，即饼图和三维饼图，只能显示一个数据系列。虽然环形图可以显示两个系列，有些人也乐于使用这种技巧。


    ![](img/537732_1_En_6_Figaz_HTML.jpg)


    一个环形结构图展示了按公司服务划分的收入结构，包含目标值和实际值。其中，Tankers 的实际值占比最高，达到 63%。


    但这仍然是一种不成功的可视化方式，它会扭曲数据。仔细观察橙色扇区：实际值的 23% 看起来比目标值的 24% 还要大。这在逻辑上可以解释为，表示实际值的环半径更大，因此较小的比例占据了比目标值环上更大的空间。但问题在于，这需要解释。而好的可视化应该遵循“一看就懂”的原则。


    在这种情况下，作为一种折中方案，我们可以考虑使用归一化的条形图。这里将两个环展开成两条等长的直线。虽然扇区之间相互错位，但 24% 显然比 23% 更大。而且，我们确实可以看到实际收入结构相对于目标收入结构的整体变化。


    ![](img/537732_1_En_6_Figba_HTML.png)


    两条水平条形图展示了按公司服务划分的收入结构，包含实际值和目标值。Tankers 的实际值占比最高，达到 63%。最右侧顶部有一个勾选标记。


    我要提醒您注意图表设计清单的重要性！每个项目单独看起来可能无关紧要，但它们汇总起来会产生截然不同的印象。比较一下，如果我们只是简单地更改图表类型，结果就会像下面这样。


    ![](img/537732_1_En_6_Figbb_HTML.png)


    一个堆叠条形图展示了按公司服务划分的目标和实际收入结构。Tankers 的实际值范围贡献了最高的百分比（62.9%）。左上角有一个叉号标记。


    以下是我们在最终版本中完善的关键点。


    -   数据标签以百分比形式显示。条形图没有这种显示参数，因此需要在源数据中重新计算（稍后您将学习如何在数据透视表中执行此操作）。

    -   我们通过减少侧边间隙，并移除刻度和网格线，使条形变得更宽、更直观。


    这种图表也有其缺点。例如，数据标签只能放置在扇区内部，但在小扇区中，它们会相互重叠并变得难以阅读。和环形图一样，它最多也只能清晰显示六个扇区。然而，这种可视化至少有助于观察条形长度上的差异。

    '
- fmt: '# Complex Trimap


    Trimap can show the structure not only for one data series but also for two categories.
    More precisely, on two levels, for example, to group the types of services according
    to the activities of a logistics company. I’ll tell you how to build such a diagram
    with fractions.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbc_HTML.png)


    A rectangular model with several segments depicts the structure of the services.
    U S A shipping has the highest percentage of 75.


    **Step 1.** To begin with, we will make a sample for the pivot table adding fields
    with areas of activity, types of services, and sales volume. By default, the pivot
    table is built in a hierarchical form and it is impossible to build a trimap without
    additional data preparation.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbd_HTML.png)


    A screenshot exhibits the row labels and actual profit in the excel sheet. A list
    of pivot table fields is exposed on the right side. Business line and service
    are the selected row options.


    **Step 2.** To expand the data in the pivot table in the desired form, you need
    to select the `Report Layout` item on the `Design` tab to begin with, and first
    the `Show in Tabular Form` sub-item, and then the `Repeat All Item Labels` sub-item.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbe_HTML.png)


    A screenshot exposes the drop-down list of the report layout option. `Show in
    tabular form` and `repeat all item labels` are the selected settings.


    After that, disable the display of totals by clicking the `Subtotals` sub-item
    `Do Not Show Subtotals`.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbf_HTML.png)


    A screenshot with file menu and subtotals option enabled. `Do not show subtotals`
    are selected.


    **Step 3.** The data is presented in absolute values and we need to convert it
    into percentages. To do this, go to any cell of the `Sales` column, in the right-click
    menu, select `Value Field Settings...`. Or double-click the column header. In
    the window that opens, on the `Show Values As` tab, select the formula `% of Grand
    Total` in the drop-down menu.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbg_HTML.png)


    A `Value Field Settings` dialog box exhibits the source name, custom name, base
    field, and base item options. The actual profit is the source name. `Show values
    as` option is the selected summarize values by.


    **Step 4.** Since it is impossible to build a treemap chart from a pivot table
    in Excel, we create a duplicate of its table by putting links to the cells of
    the pivot table. Do not forget to set the percentage data type for the column
    in the duplicate table (by default, the link will transmit a decimal numeric format).


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbh_HTML.png)


    A screenshot of a cropped excel sheet exhibits the business line, service, and
    actual profit. The business line includes equipment monitoring and international
    shipment. `100.00%` is the grand total value.


    **Step 5.** We create a new treemap chart based on the duplicate table and configure
    the data labels by ticking the category name and value items, as well as selecting
    the `New Line` separator type.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbi_HTML.png)


    A rectangular box with separations depicts the service structure. U S A shipping
    has the highest percentage of 75. Format data labels with label options category
    name, value is enabled.


    We have reviewed the techniques of how to make non-standard visualization from
    simple diagrams. To be honest, I think it’s more like crutches than life hacks:
    adjust auxiliary axes, hide the scale in the background color, disable lines from
    the graph, and put links from the pivot table to neighboring cells.


    If you often do this in Excel or PowerPoint, then maybe it’s time for you to switch
    to Power BI. There, these visualizations have already been enhanced, and there
    are many more useful diagrams and functions for working with data.


    On the other hand, with understanding the anatomy of diagrams at this level, you
    will have more freedom of action in advanced BI systems.


    ### 6.3.4 Summary


    Usually, an actual is compared with a target or other indicator on a dashboard.
    To keep the visualization clear, we use non-standard diagrams. In modern BI systems,
    these are ready-made widgets, but in Excel you have to use tricks to get a similar
    result.


    **Rating:** We combine two columns according to the bullet chart principle*, as
    if the actual “breaks through” the boundary of the target.*


    * Based on a bar chart – by constructing a series of actuals along the auxiliary
    axis, adjusting the gap width.

    * *Based on a* column chart – by displaying a series of the target in the form
    of a linear graph with markers. And then we remove the line and adjust the marker
    in the form of a large strip.


    **Dynamics**


    * Combine a line and a column to avoid piling up points in one place.

    * Use the auxiliary axis if the values are of different order (one in hundreds
    and the other in thousands). Only the scale cannot be deleted, you will have to
    mask it in the background color.


    ***Structure***


    * To compare the structure of the target and the actual, we use a 100% stacked
    bar chart. It will be visual within six categories.

    * The Treemap chart is suitable for two categories. It will show the overall structure
    by top-level categories, as well as the structure of subcategories within.


    ## 6.4 How to Show Everything at Once


    Data visualization projects usually start with a nice neat layout. But the result
    most often looks quite different. Once the customer sees the product, new requirements
    and ideas appear.


    – And let’s add to the diagram not only the target but also the actual value of
    last year?


    – It is not enough to compare with last year (a pandemic, a crisis or a new disaster).
    We also need the previous year.


    – Add percentage deviations to the graph. No, in absolute values. Hmm, and let’s
    have both in percentages and in absolute values!


    This list can be continued for a long time, and every new item makes managers
    and analysts’ eyes twitch. Of course, it turns out to be terrible.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbj_HTML.png)


    A bar graph depicts the effectiveness of the company''s managers. It plots 5 fluctuating
    trends for target and actual revenue, revenue execution, margin, and profit execution.


    Sometimes such a problem arises because we forget what kind of analysis we use:
    somewhere we change the type of diagram, somewhere we divide it into two. But
    sometimes you really need to compare several indicators at once.


    Of course, the last word always remains with the customer. In my company’s projects,
    sometimes you also have to compromise, which I will not show in the portfolio
    as a best practices example.'
  raw: '#### Complex Trimap


    Trimap can show the structure not only for one data series but also for two categories.
    More precisely, on two levels, for example, to group the types of services according
    to the activities of a logistics company. I’ll tell you how to build such a diagram
    with fractions.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbc_HTML.png)


    A rectangular model with several segments depicts the structure of the services.
    U S A shipping has the highest percentage of 75.


    **Step 1.** To begin with, we will make a sample for the pivot table adding fields
    with areas of activity, types of services, and sales volume. By default, the pivot
    table is built in a hierarchical form and it is impossible to build a trimap without
    additional data preparation.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbd_HTML.png)


    A screenshot exhibits the row labels and actual profit in the excel sheet. A list
    of pivot table fields is exposed on the right side. Business line and service
    are the selected row options.


    **Step 2.** To expand the data in the pivot table in the desired form, you need
    to select the “Report Layout” item on the “Design” tab to begin with, and first
    the “Show in Tabular Form” sub-item, and then the “Repeat All Item Labels” sub-item.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbe_HTML.png)


    A screenshot exposes the drop-down list of the report layout option. Show in tabular
    form and repeat all item labels are the selected settings.


    After that, disable the display of totals by clicking the “Subtotals” sub-item
    “Do Not Show Subtotals."


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbf_HTML.png)


    A screenshot with file menu and subtotals option enabled. Do not show subtotals
    are selected.


    **Step 3.** The data is presented in absolute values and we need to convert it
    into percentages. To do this, go to any cell of the “Sales” column, in the right-click
    menu, select “Value Field Settings….” Or double-click the column header. In the
    window that opens, on the “Show Values As” tab, select the formula “% of Grand
    Total” in the drop-down menu.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbg_HTML.png)


    A value field settings dialog box exhibits the source name, custom name, base
    field, and base item options. The actual profit is the source name. Show values
    as option is the selected summarize values by.


    **Step 4.** Since it is impossible to build a treemap chart from a pivot table
    in Excel, we create a duplicate of its table by putting links to the cells of
    the pivot table. Do not forget to set the percentage data type for the column
    in the duplicate table (by default, the link will transmit a decimal numeric format).


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbh_HTML.png)


    A screenshot of a cropped excel sheet exhibits the business line, service, and
    actual profit. The business line includes equipment monitoring and international
    shipment.100.00 percent is the grand total value.


    **Step 5.** We create a new treemap chart based on the duplicate table and configure
    the data labels by ticking the category name and value items, as well as selecting
    the “New Line” separator type.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbi_HTML.png)


    A rectangular box with separations depicts the service structure. U S A shipping
    has the highest percentage of 75\. Format data labels with label options category
    name, value is enabled.


    We have reviewed the techniques of how to make non-standard visualization from
    simple diagrams. To be honest, I think it’s more like crutches than life hacks:
    adjust auxiliary axes, hide the scale in the background color, disable lines from
    the graph, and put links from the pivot table to neighboring cells.


    If you often do this in Excel or PowerPoint, then maybe it’s time for you to switch
    to Power BI. There, these visualizations have already been enhanced, and there
    are many more useful diagrams and functions for working with data.


    On the other hand, with understanding the anatomy of diagrams at this level, you
    will have more freedom of action in advanced BI systems.


    ### 6.3.4 Summary


    Usually, an actual is compared with a target or other indicator on a dashboard.
    To keep the visualization clear, we use non-standard diagrams. In modern BI systems,
    these are ready-made widgets, but in Excel you have to use tricks to get a similar
    result.


    Rating: We combine two columns according to the bullet chart principle*, as if
    the actual “breaks through” the boundary of the target.*


    *   Based on a bar chart – by constructing a series of actuals along the auxiliary
    axis, adjusting the gap width.


    *   *Based on a* column chart – by displaying a series of the target in the form
    of a linear graph with markers. And then we remove the line and adjust the marker
    in the form of a large strip.


    Dynamics


    *   Combine a line and a column to avoid piling up points in one place.


    *   Use the auxiliary axis if the values are of different order (one in hundreds
    and the other in thousands). Only the scale cannot be deleted, you will have to
    mask it in the background color.


    ***Structure***


    *   To compare the structure of the target and the actual, we use a 100% stacked
    bar chart. It will be visual within six categories.


    *   The Treemap chart is suitable for two categories. It will show the overall
    structure by top-level categories, as well as the structure of subcategories within.


    ## 6.4 How to Show Everything at Once


    Data visualization projects usually start with a nice neat layout. But the result
    most often looks quite different. Once the customer sees the product, new requirements
    and ideas appear.


    – And let’s add to the diagram not only the target but also the actual value of
    last year?


    – It is not enough to compare with last year (a pandemic, a crisis or a new disaster).
    We also need the previous year.


    – Add percentage deviations to the graph. No, in absolute values. Hmm, and let’s
    have both in percentages and in absolute values!


    This list can be continued for a long time, and every new item makes managers
    and analysts’ eyes twitch. Of course, it turns out to be terrible.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbj_HTML.png)


    A bar graph depicts the effectiveness of the company''s managers. It plots 5 fluctuating
    trends for target and actual revenue, revenue execution, margin, and profit execution.


    Sometimes such a problem arises because we forget what kind of analysis we use:
    somewhere we change the type of diagram, somewhere we divide it into two. But
    sometimes you really need to compare several indicators at once.


    Of course, the last word always remains with the customer. In my company’s projects,
    sometimes you also have to compromise, which I will not show in the portfolio
    as a best practices example.'
  trans: '

    # 复合树形图


    树形图不仅可以展示单个数据系列的结构，还可以展示两个类别的结构。更准确地说，可以在两个层级上，例如，根据一家物流公司的活动对其服务类型进行分组。我将向您介绍如何构建这种带有分数的图表。


    ![](img/537732_1_En_6_Figbc_HTML.png)


    一个包含多个分段的矩形模型描绘了服务的结构。美国航运占比最高，达到 75。


    **第 1 步。** 首先，我们将为数据透视表创建一个样本，添加包含业务领域、服务类型和销售额的字段。默认情况下，数据透视表是以分层形式构建的，如果不进行额外的数据准备，就无法构建树形图。


    ![](img/537732_1_En_6_Figbd_HTML.png)


    一张截图显示了 Excel 表格中的行标签和实际利润。右侧显示了数据透视表字段列表。“业务线”和“服务”是选定的行选项。


    **第 2 步。** 要以所需的形式展开数据透视表中的数据，首先需要在“设计”选项卡上选择“报表布局”项，然后依次选择“以表格形式显示”子项和“重复所有项目标签”子项。


    ![](img/537732_1_En_6_Figbe_HTML.png)


    一张截图展示了“报表布局”选项的下拉列表。“以表格形式显示”和“重复所有项目标签”是选中的设置。


    之后，通过单击“分类汇总”子项下的“不显示分类汇总”来禁用总计的显示。


    ![](img/537732_1_En_6_Figbf_HTML.png)


    一张显示了文件菜单并启用了分类汇总选项的截图。“不显示分类汇总”已被选中。


    **第 3 步。** 数据以绝对值形式呈现，我们需要将其转换为百分比。为此，请转到“销售额”列的任意单元格，在右键菜单中，选择“值字段设置...”。或者双击列标题。在打开的窗口中，在“值显示方式”选项卡上，从下拉菜单中选择“%
    的汇总”公式。


    ![](img/537732_1_En_6_Figbg_HTML.png)


    一个“值字段设置”对话框显示了源名称、自定义名称、基本字段和基本项选项。“实际利润”是源名称。“值显示方式”选项是选定的“值汇总方式”。


    **第 4 步。** 由于无法在 Excel 中直接从数据透视表创建树状图，我们将通过放置指向数据透视表单元格的链接来创建其表格的副本。不要忘记为副本表格中的列设置百分比数据类型（默认情况下，链接将传递十进制数字格式）。


    ![](img/537732_1_En_6_Figbh_HTML.png)


    一个裁剪过的 Excel 表格截图显示了业务线、服务和实际利润。业务线包括设备监控和国际运输。“100.00%”是总计值。


    **第 5 步。** 我们基于副本表格创建一个新的树状图，并通过勾选类别名称和值项以及选择“换行”分隔符类型来配置数据标签。


    ![](img/537732_1_En_6_Figbi_HTML.png)


    一个带有分隔的矩形框描绘了服务结构。美国航运占比最高，达到 75。格式数据标签中的标签选项“类别名称”和“值”已启用。


    我们已经回顾了如何从简单图表创建非标准可视化的技巧。老实说，我认为这与其说是技巧，不如说更像是拐杖：调整辅助轴、将刻度隐藏到背景色中、从图表中禁用线条、以及将数据透视表的链接放置到相邻单元格中。


    如果您经常在 Excel 或 PowerPoint 中这样做，那么也许是时候转向 Power BI 了。那里，这些可视化已经得到增强，并且有更多有用的图表和功能来处理数据。


    另一方面，在理解了这个层次的图表结构之后，您将在高级 BI 系统中拥有更多的操作自由度。


    ### 6.3.4 总结


    通常，在仪表板上会将实际值与目标值或其他指标进行比较。为了保持可视化的清晰性，我们使用非标准图表。在现代 BI 系统中，这些是现成的小组件，但在 Excel
    中，您必须使用一些技巧才能获得类似的结果。


    **评级：** 我们根据子弹图的原则将两列合并*，就像实际值“突破”了目标的边界一样。*


    * 基于条形图 – 通过沿着辅助轴构建实际值系列，并调整间隙宽度。

    * 基于**柱形图** – 通过以带有标记的线性图形形式显示目标系列。然后我们移除线条并将标记调整为大条带的形式。


    **动态**


    * 将折线图和柱形图结合起来，避免数据点堆积在一处。

    * 如果数值量级不同（一个在数百，另一个在数千），则使用辅助轴。只是不能删除刻度，您需要将其隐藏在背景色中。


    ***结构***


    * 为了比较目标值和实际值的结构，我们使用 100% 堆叠条形图。这在六个类别以内时可视性较好。

    * 树状图适用于两个类别。它将显示按顶层类别划分的整体结构，以及顶层类别内部的子类别结构。


    ## 6.4 如何一次性展示所有信息


    数据可视化项目通常从一个漂亮整洁的布局开始。但最终结果往往大相径庭。一旦客户看到产品，新的需求和想法就会出现。


    – 我们能不能在图表中不仅加入目标值，还加入去年的实际值？


    – 与去年比较还不够（疫情、危机或新的灾难）。我们还需要前年的数据。


    – 在图表中添加百分比偏差。不，用绝对值。嗯，要不百分比和绝对值都加上！


    这份清单可以一直列下去，每一项新内容都让经理和分析师们眼皮直跳。当然，最终结果会变得很糟糕。


    ![](img/537732_1_En_6_Figbj_HTML.png)


    一张柱形图描绘了公司经理的效能。它绘制了目标收入、实际收入、收入完成率、利润率和利润完成率的 5 条波动趋势线。


    有时出现这样的问题是因为我们忘记了自己在使用哪种分析：有时我们改变了图表类型，有时我们将图表一分为二。但有时，您确实需要一次性比较多个指标。


    当然，最终决定权始终在客户手中。在我公司的项目中，有时你也必须做出妥协，这些我不会作为最佳实践案例放在作品集中展示。

    '
- fmt: '### 6.4.1 When a Table Is the Only Option


    Even in Power BI and Tableau, there is no chart that will visually display four
    rows of data in the context of several categories. Three indicators is the limit
    for a single chart: you can use the combined charts that I showed in the previous
    part, or a two-level treemap chart for categories with subcategories.


    For a larger amount of data, there is only one working option – tables. Many people
    don’t like this option, but at least it will allow you to read the values. And
    it’s better than an overloaded diagram.


    **Tip!**


    *To make the table visual and easy to understand, it is important not to overdo
    it with colorful design and to place visual accents correctly.*


    Many are content with the standard formatting of pivot tables. But my approach
    here is the same as with the diagram: there is a draft for calculations, and there
    is a final version that is on a sheet with a dashboard.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbk_HTML.png)


    A representative table exhibits the lists of managers, actual revenues, target
    actual values, actual profits, target profits, margin percentages, and the number
    of orders. A cross mark is exposed on the top left corner.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbl_HTML.png)


    A representative table exhibits the lists of managers, revenues (in dollars and
    percentages), profits (in dollars and percentages), margin percentages, and the
    number of orders. A tick mark is exposed on the top right corner.


    **Note**


    In the designed version, I have removed the targeted indicators. And instead of
    them, I added percentage deviations with color coding according to the principle
    of traffic lights. There is no need to calculate the difference between the target
    and the actual in your mind – we have a visual emphasis on the target and a visual
    indicator of deviation from the target.


    Let’s look at the steps of how to get such a result using the additional options
    of pivot tables.


    ### 6.4.2 How to Add a Calculated Field


    In my example, it will be calculations for the target execution for revenue, profit,
    and margin.


    We add columns to the pivot table on the tab `PivotTable Analyse`: section `Calculations`
    ➤ button `Fields, Items & Sets` ➤ item `Calculated Field…`.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbm_HTML.png)


    A screen depicts the pivot table analysis with fields, items, and sets selected
    with calculated fields.


    In the `Insert Calculated Field` window that opens, we give a clear name to the
    new field and set the formula for calculations. If the formula needs data from
    existing fields of the pivot table, select them from the `Fields` block by name.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbn_HTML.jpg)


    A screen depicts the insert calculated field with name and formula. Fields are
    selected with the target revenue.


    You also need to change the bit depth of the actual indicators by millions – so
    the numbers will become shorter and it will be easier to perceive them. To do
    this, we create calculated columns in the same way, only in the formula we divide
    the value from the `Actual` column by 1,000,000.


    As a result, three new indicators appeared in the fields list (revenue, profit,
    and margin), as well as two fields with revenue and profit converted into millions.
    Someone will say that it is easier and faster to divide a fact into a plan in
    a neighboring cell, and he will be right. But the advantage of the calculated
    field is that it can be used in other selections of the pivot table. This approach
    will save time in the future, and in general it is considered good form.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbo_HTML.png)


    A screen depicts the pivot table fields with enabled options for revenue execution,
    profit execution, margin, revenue, and profit S M.


    We removed the target from the table and added calculated fields. But it’s still
    just a table with no visual accents. To arrange them, we use conditional formatting.


    In Excel, this functionality is very extensive and has a bunch of customized formats.
    But we will not choose its formatting styles – there will be a primitive like
    red filling of cells with green values or other visual ugliness. We will set the
    necessary settings ourselves.


    ### 6.4.3 Rules for Formatting Cells


    Before formatting the table, we will determine its rules in advance. To do this,
    we need to determine the formatting methods (where to add histograms, where to
    add icons, and where to change the font color), as well as set the values at which
    the color will change.


    1.  For clarity, we will add histograms to the numerical indicators of revenue,
    profit, and the number of orders – the length of the columns in the cells will
    make the comparison visual.


    2.  Columns with percentages are formatted using the font color. For the column
    with the target execution, we use the following rule: if the target is completed,
    the color is green, if not, red.


    3.  The values in the `Margin` column are marked with icons with traffic light
    windows. Negative indicators will be highlighted in red, average ones in yellow,
    and positive ones in green.


    #### Conditional Formatting Using Histograms


    For columns with actual values, histograms are usually added to visually show
    the rating.


    Select the column and, on the `Home` tab, under the `Conditional formatting` button,
    select the `Histograms` item, and then specify its type. For the column `Revenue,
    $M.`, we will add a blue histogram.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbp_HTML.png)


    A screen depicts the conditional formatting option enabled with data bars and
    solid fill.


    The color of the added histogram is saturated by default, but it is better to
    use less bright shades for formatting tables. They can be changed after setting
    up all the conditions.


    To do this, on the `Home` tab, under the `Conditional Formatting` button, select
    the `Manage Rules…` item. The `Conditional Formatting Rules Manager` window that
    opens already shows the rules that are applied to the pivot table.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbq_HTML.png)


    A screen depicts the conditional formatting rules manager. Show formatting rules
    for this pivot table are enabled with the data bar.


    We choose the necessary one from the rules: you can just double-click it or click
    `Edit Rule…`. In the window that opens, in the `Color` section, set a lighter
    shade of blue by moving the slider up. Click `OK`.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbr_HTML.png)


    A page depicts the edit formatting rule with an enabled colors option. RGB color
    model is selected.


    Similarly, we change the color for other histograms. Select the `Revenue execution`
    column and on the main menu tab, under the `Conditional Formatting` button, select
    `Highlight Cells Rules` ➤ `Greater Than…`.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbs_HTML.png)


    A page depicts the conditional formatting enabled with highlighted cell rules
    greater than the option.


    In the window that opens, specify the value in the first field of the section
    `Format cells that are GREATER THAN` – 100%. In the second field, select `Customised
    format`. In the additional window `Format Cells` that opens, we set the green
    color on the `Font` tab.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbt_HTML.jpg)


    A page depicts the greater than an option with format cells that are greater than
    for customized format.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbu_HTML.png)


    A page depicts the format cells with a font option enabled with a strike-through
    effect and the color is selected.


    Now we will set the second rule for the same column – for cases when the target
    is not achieved. Repeat the previous steps, only in the menu `Conditional formatting`,
    select the item `Less Than…`, and in the `Customised Format…` set the red color.'
