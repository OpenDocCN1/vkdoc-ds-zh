- fmt: '### 1.2.2 How to Update Data Correctly


    The point of a business dashboard is to set up a beautiful output report form
    once, and then only upload new data. The charts should update automatically. But
    this is not so easy to do in Excel.


    In the previous step, we got a pivot table in which we see the `Actual` values
    for staff costs by month from January to May. Now let’s do a test: add a row to
    the original flat table, in which we specify June (you can simply copy the last
    row of the table and change the month).


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figo_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual with
    their values.


    Then go back to the pivot table and so far we don’t see June. It seems logical
    that you need to click the “Refresh all” button on the “Data” tab. But even this
    does not give results.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figp_HTML.png)


    An excel sheet depicts the row and column labels. Refresh all options under the
    data menu is enabled.


    Many skip this step, and then suffer a lot by adding new data to the pivot table.
    Let’s figure out how to set up this process.


    **Solution 1\. Change the Range**


    When creating a pivot table, Excel highlighted a fixed range of cells with a dotted
    line. If you change the value inside it, this data will be updated in the report.
    But our new line with June is outside this range. To add it, go to the menu tab
    “PivotTable Analyse” and click “Data Source.”


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figq_HTML.png)


    An excel sheet depicts the row label with the sum of the target and the sum of
    the actual with the change data source enabled under the pivot table analysis
    menu.


    In the dialog box that opens, you need to change the range of cells: to do this,
    click on the up arrow button and select the cells for analysis on a flat table
    sheet with the mouse. After that, the data in the pivot table will change.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figr_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual.
    It is overlapped by changing the pivot table data source.


    This solution works correctly, but it’s the most inconvenient. With any addition
    of new rows, you’ll need to change the range manually. And when there is a lot
    of data in a flat table, it is easy to make a mistake and not capture some columns
    or rows.


    **Solution 2\. Select the Entire Columns**


    I’ve observed how many Excel users have “automated” data updates. When building
    the pivot table, they highlighted not the table with data, but all the columns,
    including the empty rows below. That is, they took the maximum range of rows until
    the very end of the sheet.


    With this method, new rows are added to the pivot table by clicking the “Update
    All.” But the downside is that in each table there will be a row “(empty).”


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figs_HTML.png)


    An excel sheet depicts the row labels, sum of target, and sum of actual with their
    corresponding values.


    Of course, an empty value can be hidden using filters. It’s not that difficult,
    but in real corporate reports, this “(empty)” constantly pops up on the chart
    or in the filter and annoys bosses.


    In general, this way of configuring the pivot table update is not optimal, it
    requires additional actions to hide empty values.


    **Solution 3\. Format as a Table**


    Before inserting a pivot table, let’s transform the original flat table into a
    so-called “smart table.”


    To do this, select the cell or the range of the table then on the “Home” tab,
    click the “Format as a table” and select any format from recommended. Formatting
    in this case is not just a template for formatting cells on a sheet but storing
    this range as a separate object inside Excel.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figt_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual with
    the format as a table option enabled.


    Then, in the window that appears, be sure to check that the “My table has headers”
    is checked, and click OK.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figu_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual with
    an overlap of creating a table page as my table has headers.


    A smart table always has a filter in the column headers. Additionally, the tab
    “Table Design” is available for it, where you can set the name of the table (by
    default it is “Table 1”) and immediately create a pivot table based on it by clicking
    on the “Pivot Table” button.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figv_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual.
    Staff costs and summarisation of pivot tables are enabled.


    When creating a pivot table, not a range of cells will be specified, but the name
    of the smart table.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figw_HTML.png)


    A page depicts the pivot table from the table or range as staff costs and new
    worksheet option enabled,


    ***Tip!***


    *Make it a rule to always give a name to the table: so you’ll always know what
    data you are working with. For example, our smart table can be given a name -
    “Wage Fund.”*


    In the future, when adding data to the initial table, Excel will automatically
    expand the range of the smart table and you’ll not be required to do any additional
    actions, but only click on the “Refresh” button on the “Data” tab. And no empty
    rows.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figx_HTML.png)


    An excel sheet with 3 columns, row labels, sum of target, and some of actual.
    Refresh all option is selected under the data option.


    ### 1.2.3 Summary


    At the stage of creating pivot tables, it’s important to remember that they’ll
    have to be updated – this is the only way the data on the dashboard will remain
    relevant. But this doesn’t happen in Excel on its own.


    A life hack that will save you effort – format the prepared flat table as “smart.”


    *   The smart table can be given a name. This is convenient, because when further
    creating pivot tables, it will always be clear what data they contain.


    *   This approach saves time. When changing a flat table, you don’t have to do
    additional manipulations: to update the pivot table, clicking the “Refresh All”
    button will be enough.


    ## 1.3 Preparing Data Samples for Visualization


    At the heart of each visual element on the dashboard is a separate pivot table
    report. In general, by the term “report” I understand a complex data representation
    consisting of several tables and diagrams. Therefore, I will call individual pivot
    tables data samples.


    For the dashboard “Wage fund analysis,” we need three samples:


    1.  The payments dynamics


    2.  Expenses by division


    3.  Expenses by item


    Let’s create them on the prepared data and select the appropriate charts and graphs
    for every case. We will not consider the issue of choosing correct visual elements
    yet – we will consider this topic in detail later.'
  raw: '### 1.2.2 How to Update Data Correctly


    The point of a business dashboard is to set up a beautiful output report form
    once, and then only upload new data. The charts should update automatically. But
    this is not so easy to do in Excel.


    In the previous step, we got a pivot table in which we see the Actual values for
    staff costs by month from January to May. Now let’s do a test: add a row to the
    original flat table, in which we specify June (you can simply copy the last row
    of the table and change the month).


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figo_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual with
    their values.


    Then go back to the pivot table and so far we don’t see June. It seems logical
    that you need to click the “Refresh all” button on the “Data” tab. But even this
    does not give results.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figp_HTML.png)


    An excel sheet depicts the row and column labels. Refresh all options under the
    data menu is enabled.


    Many skip this step, and then suffer a lot by adding new data to the pivot table.
    Let’s figure out how to set up this process.


    **Solution 1\. Change the Range**


    When creating a pivot table, Excel highlighted a fixed range of cells with a dotted
    line. If you change the value inside it, this data will be updated in the report.
    But our new line with June is outside this range. To add it, go to the menu tab
    “PivotTable Analyse” and click “Data Source.”


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figq_HTML.png)


    An excel sheet depicts the row label with the sum of the target and the sum of
    the actual with the change data source enabled under the pivot table analysis
    menu.


    In the dialog box that opens, you need to change the range of cells: to do this,
    click on the up arrow button and select the cells for analysis on a flat table
    sheet with the mouse. After that, the data in the pivot table will change.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figr_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual.
    It is overlapped by changing the pivot table data source.


    This solution works correctly, but it’s the most inconvenient. With any addition
    of new rows, you’ll need to change the range manually. And when there is a lot
    of data in a flat table, it is easy to make a mistake and not capture some columns
    or rows.


    **Solution 2\. Select the Entire Columns**


    I’ve observed how many Excel users have “automated” data updates. When building
    the pivot table, they highlighted not the table with data, but all the columns,
    including the empty rows below. That is, they took the maximum range of rows until
    the very end of the sheet.


    With this method, new rows are added to the pivot table by clicking the “Update
    All.” But the downside is that in each table there will be a row “(empty).”


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figs_HTML.png)


    An excel sheet depicts the row labels, sum of target, and sum of actual with their
    corresponding values.


    Of course, an empty value can be hidden using filters. It’s not that difficult,
    but in real corporate reports, this “(empty)” constantly pops up on the chart
    or in the filter and annoys bosses.


    In general, this way of configuring the pivot table update is not optimal, it
    requires additional actions to hide empty values.


    **Solution 3\. Format as a Table**


    Before inserting a pivot table, let’s transform the original flat table into a
    so-called “smart table.”


    To do this, select the cell or the range of the table then on the “Home” tab,
    click the “Format as a table” and select any format from recommended. Formatting
    in this case is not just a template for formatting cells on a sheet but storing
    this range as a separate object inside Excel.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figt_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual with
    the format as a table option enabled.


    Then, in the window that appears, be sure to check that the “My table has headers”
    is checked, and click OK.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figu_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual with
    an overlap of creating a table page as my table has headers.


    A smart table always has a filter in the column headers. Additionally, the tab
    “Table Design” is available for it, where you can set the name of the table (by
    default it is “Table 1”) and immediately create a pivot table based on it by clicking
    on the “Pivot Table” button.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figv_HTML.png)


    An excel sheet depicts the division, expense item, month, target, and actual.
    Staff costs and summarisation of pivot tables are enabled.


    When creating a pivot table, not a range of cells will be specified, but the name
    of the smart table.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figw_HTML.png)


    A page depicts the pivot table from the table or range as staff costs and new
    worksheet option enabled,


    ***Tip!***


    *Make it a rule to always give a name to the table: so you’ll always know what
    data you are working with. For example, our smart table can be given a name -
    “Wage Fund.”*


    In the future, when adding data to the initial table, Excel will automatically
    expand the range of the smart table and you’ll not be required to do any additional
    actions, but only click on the “Refresh” button on the “Data” tab. And no empty
    rows.


    ![](images/537732_1_En_1_Chapter/537732_1_En_1_Figx_HTML.png)


    An excel sheet with 3 columns, row labels, sum of target, and some of actual.
    Refresh all option is selected under the data option.


    ### 1.2.3 Summary


    At the stage of creating pivot tables, it’s important to remember that they’ll
