- fmt: '### 3.5 Setting Up the Chart Template


    Working on each diagram is monotonous – not everyone likes it and it takes time.
    This process can also be optimized if you once set up a diagram and save it as
    a template, which will be useful for other work.


    We will make a template from the `Expenses by division` chart, which we have already
    set up according to our checklist.


    #### 3.5.1 How to Save a Template


    Everything is simple here: right-click on the block with the diagram `Expenses
    by division` and select `Save as Template…` in the context menu. You can select
    both the entire diagram and only the plot area – only the length of the context
    menu will differ, but the necessary item is available in both cases.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figax_HTML.jpg)


    **Tip!**

    *Never change the path to the folder to save. `Excel` automatically loads custom
    templates only from it.*


    Do not forget to give the templates clear names when saving, so that you can easily
    find the desired diagram in the list later. Our template is saved with the name
    `Chart1`.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figay_HTML.png)


    #### 3.5.2 A New Chart Using a Template


    To apply a ready-made template to another (not configured) diagram, do the following:


    - Select the entire diagram or the plot area on it.

    - In the context menu (right-click), select `Change chart type`.


    A window opens with a menu on the left – go to the `Templates` folder and select
    our saved template `Chart1`.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaz_HTML.png)


    All the settings of our template are automatically applied to the selected diagram:
    the location and color of the labels, the bit depth of the numbers, and everything
    else. It remains to change the name to `Expenses by items`.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figba_HTML.jpg)


    #### 3.5.3 Adapting the Template to the Diagram


    We need to visualize expenses by items in the form of a bar chart with horizontal
    columns. But when using the template, the appearance of the visual element has
    also changed – the columns have become vertical. Let’s fix this by re-selecting
    the chart type.


    Select the entire diagram or only the plot area.


    1. Open the context menu and select `Change Chart Type`.

    2. In the window that opens, select the `Bar` chart type.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figbb_HTML.png)


    After completing these steps, the `Expenses by items` chart takes the desired
    form in accordance with the layout.


    It remains to change the sorting and the order of columns in the bar chart. That’s
    it – we’ve put together a full-fledged draft of the dashboard!


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figbc_HTML.jpg)


    #### 3.5.4 Summary


    The design of each visual element takes time. And since there are several of these
    elements on any dashboard, it will take a lot of time. Using a template will help
    simplify and speed up the process.


    - After setting up the diagram, we save it as a template without changing the
    path to the folder.

    - Select a new draft chart and use the `Change chart type` option to apply the
    saved template to it.

    - Adapt the template by re-changing the type of visual element to the one that
    is needed in the new diagram.


    ### 4. Final Design


    We now have a dashboard in a minimalist style, which follows all the rules of
    data visualization. It is still designed in standard `Excel`, while customers
    usually prefer a variety of designs.


    To create a new style, we will go beyond traditional chart settings and use a
    couple of life hacks. The standard dashboard will then look like a designer model.


    I will keep working in the minimalist style chosen. It is still actual: in the
    context of information overload, it is vital to remove everything superfluous
    and preserve only significant shapes, numbers, and text labels. Information design
    is not ornamentation.


    The techniques we use are also suitable for other data visualization tools, Russian
    BI systems included. The only difference is configuration. It is here that we
    employ original life hacks to work in `MS Excel`.


    #### 4.1 Aligning the Headers to the Grid of Cells


    It is not always possible to align all dashboard elements by eye. If you look
    closely, you will spot inaccuracies in my example, which is very difficult for
    a beginner: fitting pixel to pixel requires both effort and time.


    Standard chart titles present a similar problem. You cannot change the size of
    this block: if the header is long, it will take two lines. It will then move the
    legend down and break the symmetry between the neighboring diagrams.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figa_HTML.jpg)


    **Tip!**

    *I recommend making a copy of `Dashboard` sheet for all further actions. This
    way you will save the draft version and see the difference between a standard
    dashboard in `Excel` and a professional one.*


    ##### 4.1.1 Adding Headers to the Cells


    Working with the new dashboard, we will first create and arrange headers in the
    cells and then disable the standard titles on the diagrams.


    Move the top graph slightly lower to clear the header row. Enter the graph title
    `Payments Dynamics` in the cell above the left corner of the graph.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figb_HTML.png)'
  raw: '## 3.5 Setting Up the Chart Template


    Working on each diagram is monotonous – not everyone likes it and it takes time.
    This process can also be optimized if you once set up a diagram and save it as
    a template, which will be useful for other work.


    We will make a template from the “Expenses by division” chart, which we have already
    set up according to our checklist.


    ### 3.5.1 How to Save a Template


    Everything is simple here: right-click on the block with the diagram “Expenses
    by division” and select “Save as Template…” in the context menu. You can select
    both the entire diagram and only the plot area – only the length of the context
    menu will differ, but the necessary item is available in both cases.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figax_HTML.jpg)


    A snippet consists of a bar graph depicting data on the values of expenses for
    different divisions along with a dialog box and the option Save as Template is
    selected.


    ***Tip!***


    *Never change the path to the folder to save. Excel automatically loads custom
    templates only from it.*


    Do not forget to give the templates clear names when saving, so that you can easily
    find the desired diagram in the list later. Our template is saved with the name
    “Chart1.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figay_HTML.png)


    A dialog box of Microsoft excel named Save Chart Template with elements roaming,
    Microsoft, templates, and a chart is given with the file name Chart 1 to be saved
    in the drive Sys of C colon.


    ### 3.5.2 A New Chart Using a Template


    To apply a ready-made template to another (not configured) diagram, do the following:


    *   Select the entire diagram or the plot area on it.


    *   In the context menu (right-click), select “Change chart type.”


    A window opens with a menu on the left – go to the “Templates” folder and select
    our saved template “Chart1.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figaz_HTML.png)


    A snippet consists of a menu All Charts in which the option Templates is selected.
    On the right, a chart labeled Chart 1 with a bar graph under My Template is provided.


    All the settings of our template are automatically applied to the selected diagram:
    the location and color of the labels, the bit depth of the numbers, and everything
    else. It remains to change the name to “Expenses by items.”


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figba_HTML.jpg)


    A bar graph illustrates the data on the target and actual expenses by divisions
    namely production workers, company management, commercial employees, and logistics
    and service.


    ### 3.5.3 Adapting the Template to the Diagram


    We need to visualize expenses by items in the form of a bar chart with horizontal
    columns. But when using the template, the appearance of the visual element has
    also changed – the columns have become vertical. Let’s fix this by re-selecting
    the chart type.


    Select the entire diagram or only the plot area.


    1.  Open the context menu and select “Change Chart Type.”


    2.  In the window that opens, select the “Bar” chart type.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figbb_HTML.png)


    A snippet consists of a menu All Charts with different elements and different
    layouts of horizontal bar graphs in which the option Bar is selected. A data-contained
    bar graph is shown on the right.


    After completing these steps, the “Expenses by items” chart takes the desired
    form in accordance with the layout.


    It remains to change the sorting and the order of columns in the bar chart. That’s
    it – we’ve put together a full-fledged draft of the dashboard!


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figbc_HTML.jpg)


    A snippet consists of data based on wage fund analysis with a line graph, bar
    graph, horizontal bar graph, and a bar with target and actual values and 104%
    of execution.


    ### 3.5.4 Summary


    The design of each visual element takes time. And since there are several of these
    elements on any dashboard, it will take a lot of time. Using a template will help
    simplify and speed up the process.


    *   After setting up the diagram, we save it as a template without changing the
    path to the folder.


    *   Select a new “draft” chart and use the “Change chart type” option to apply
    the saved template to it.


    Adapt the template by re-changing the type of visual element to the one that is
    needed in the new diagram.


    # 4. Final Design


    We now have a dashboard in a minimalist style, which follows all the rules of
    data visualization. It is still designed in standard Excel, while customers usually
    prefer a variety of designs.


    To create a new style, we will go beyond traditional chart settings and use a
    couple of life hacks. The standard dashboard will then look like a designer model.


    I will keep working in the minimalist style chosen. It is still actual: in the
    context of information overload, it is vital to remove everything superfluous
    and preserve only but significant shapes, numbers, and text labels. Information
    design is not ornamentation.


    The techniques we use are also suitable for other data visualization tools, Russian
    BI systems included. The only difference is configuration. It is here that we
    employ original life hacks to work in MS Excel.


    ## 4.1 Aligning the Headers to the Grid of Cells


    It is not always possible to align all dashboard elements by eye. If you look
    closely, you will spot inaccuracies in my example, which is very difficult for
    a beginner: fitting “pixel to pixel” requires both effort and time.


    Standard chart titles present a similar problem. You cannot change the size of
    this block: if the header is long, it will take two lines. It will then move the
    legend down and break the symmetry between the neighboring diagrams.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figa_HTML.jpg)


    Two bar graphs of the expenses by division and staff costs by cost items. Production
    workers and salaries have high values of 3823 and 4187 for actual and target,
    respectively.


    To avoid disharmony, I recommend placing headers in cells rather than in standard
    “Chart Title” elements. They will still be in Excel even if the grid lines are
    disabled, which solves the alignment problem.


    ***Tip!***


    *I recommend making a copy of “Dashboard” sheet for all further actions. This
    way you will save the draft version and see the difference between a standard
    dashboard in Excel and a professional one.*


    ### 4.1.1 Adding a Headers to the Cells


    Working with the new dashboard, we will first create and arrange headers in the
    cells and then disable the standard titles on the diagrams.


    Move the top graph slightly lower to clear the header row. Enter the graph title
    “Payments Dynamics” in the cell above the left corner of the graph.


    ![](images/537732_1_En_4_Chapter/537732_1_En_4_Figb_HTML.png)


    A line graph of payment dynamics between January and June. It plots two fluctuating
    curves and the peak is obtained in April with a maximum actual value of 1875.'
  trans: '

    ### 3.5 设置图表模板


    处理每个图表都是件单调乏味的事——不是每个人都喜欢，而且很耗时。如果你设置好一个图表并将其保存为模板，供其他工作使用，这个过程也可以得到优化。


    我们将使用已经按照清单设置好的`按部门支出`图表来制作一个模板。


    #### 3.5.1 如何保存模板


    这里很简单：右键点击`按部门支出`图表所在的区块，在上下文菜单中选择`另存为模板...`。你可以选择整个图表，也可以只选择绘图区——区别仅在于上下文菜单的长度，但所需选项在两种情况下都可用。


    ![](img/537732_1_En_3_Figax_HTML.jpg)


    **提示！**

    *不要更改保存模板的文件夹路径。`Excel`只会自动从该文件夹加载自定义模板。*


    保存时，别忘了为模板起个清晰的名字，以便日后在列表中轻松找到所需的图表。我们的模板以`Chart1`的名称保存。


    ![](img/537732_1_En_3_Figay_HTML.png)


    #### 3.5.2 使用模板创建新图表


    要将现成的模板应用于另一个（未设置的）图表，请执行以下操作：


    - 选中整个图表或其中的绘图区。

    - 在上下文菜单（右键单击）中，选择`更改图表类型`。


    此时会打开一个窗口，左侧有一个菜单——进入`模板`文件夹，选择我们保存的模板`Chart1`。


    ![](img/537732_1_En_3_Figaz_HTML.png)


    我们模板的所有设置都会自动应用于所选图表：标签的位置和颜色、数字的位数以及其他所有内容。剩下的就是将名称改为`按项目支出`。


    ![](img/537732_1_En_3_Figba_HTML.jpg)


    #### 3.5.3 根据图表调整模板


    我们需要以带有水平条的条形图形式来可视化按项目支出的数据。但在使用模板时，可视化元素的样式也发生了变化——条形变成了垂直方向。让我们通过重新选择图表类型来解决这个问题。


    选中整个图表或仅选中绘图区。


    1. 打开上下文菜单，选择`更改图表类型`。

    2. 在打开的窗口中，选择`条形图`图表类型。


    ![](img/537732_1_En_3_Figbb_HTML.png)


    完成这些步骤后，`按项目支出`图表就根据布局呈现出了所需的样式。


    剩下的就是更改条形图中的排序和列的顺序。好了——我们已经拼凑出了一个完整的仪表盘草稿！


    ![](img/537732_1_En_3_Figbc_HTML.jpg)


    #### 3.5.4 小结


    设计每个可视化元素都需要时间。由于任何仪表盘上都有多个这样的元素，因此会花费大量时间。使用模板有助于简化和加快这一过程。


    - 设置好图表后，将其保存为模板，不要更改文件夹路径。

    - 选择一个新的草图图表，并使用`更改图表类型`选项将保存的模板应用于该图表。

    - 通过将可视化元素的类型重新更改为新图表所需的类型来调整模板。


    ### 4. 最终设计


    我们现在有一个极简风格的仪表盘，它遵循了数据可视化的所有规则。它仍采用标准的`Excel`样式设计，而客户通常更喜欢多样化的设计。


    为了创造新样式，我们将超越传统的图表设置，使用一些小技巧。这样，标准的仪表盘看起来就会像设计师的作品一样。


    我将继续采用所选的极简风格。它仍然很实用：在信息过载的背景下，删除所有多余内容，只保留重要的形状、数字和文本标签至关重要。信息设计不是装饰。


    我们使用的技巧也适用于其他数据可视化工具，包括国产的 BI 系统。唯一的区别在于配置方式。正是在这里，我们运用独创的小技巧来操作`MS Excel`。


    #### 4.1 将标题与单元格网格对齐


    凭眼睛对齐仪表盘的所有元素并不总是可行的。如果仔细观察，你会发现我的示例中存在不精确之处，这对初学者来说非常困难：像素级对齐既费力又耗时。


    标准的图表标题也存在类似问题。你无法更改此区块的大小：如果标题很长，它会占据两行，进而将图例下移，破坏相邻图表之间的对称性。


    ![](img/537732_1_En_4_Figa_HTML.jpg)


    **提示！**

    *我建议为所有后续操作复制一个`Dashboard`工作表的副本。这样既能保留草稿版本，又能看出标准`Excel`仪表盘与专业仪表盘之间的差异。*


    ##### 4.1.1 在单元格中添加标题


    处理新的仪表盘时，我们首先在单元格中创建并排列好标题，然后禁用图表上的标准标题。


    将顶部图表稍微向下移动，以便为标题行腾出空间。在图表的左上角单元格中输入图表标题`付款动态`。


    ![](img/537732_1_En_4_Figb_HTML.png)

