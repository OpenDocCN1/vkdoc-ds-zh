  trans: '

    ### 5.3.6 在深色主题中设置切片器


    交互式切片器是仪表板上唯一尚未成型的元素。现成的样式中没有合适的，因此我们将自行配置。


    我们以 `深色` 部分中带有红色按钮的样式为基础——将其调整至所需效果。在样式列表中，它被称为 `玫瑰色`。


    要修改它，请在仪表板上选择任意一个切片。在菜单选项卡 `切片器`（或 `选项`）上，右键单击所需的样式 ➤ `复制`。


    ![](img/537732_1_En_5_Figac_HTML.png)


    此截图展示了用于修改切片器样式的不同切片器样式。它还包含了预览、格式和清除选项。


    在打开的窗口中，`切片元素` 部分下有大约十个项目。其中大部分用于自定义切片器按钮在不同状态下的外观：选中时、鼠标悬停时等。


    为了确保一切按预期工作，我们必须分别配置这些项目中的每一项。我们将按照相同的方案进行操作：选择所需的项目，单击 `格式` 按钮，然后在新窗口中添加必要的设置。


    **整个切片器。** 在 `边框` 选项卡中，选择 `无` 选项。在 `填充` 选项卡中，选择最深的棕色阴影——与我们用于仪表板背景的颜色相同。单击 `确定`。


    ![](img/537732_1_En_5_Figad_HTML.png)


    此截图展示了格式切片元素选项，用于填充仪表板的背景，包括图案颜色和样式。


    **标题。** 这是切片元素列表中的第二项。在 `字体` 选项卡中，设置 `Montserrat (正文)`，并调整颜色。此处我们将设置最浅的棕色阴影——与我们为其他标题选择的颜色相同。


    ![](img/537732_1_En_5_Figae_HTML.png)


    此截图展示了通过更改颜色、样式、大小和效果来修改切片器字体。


    **已选中有数据的项。** 此处我们配置活动按钮的类型，即已按下用于筛选的按钮。默认情况下，`填充` 选项卡中有一个适合我们的颜色——我们保持不变。


    ![](img/537732_1_En_5_Figaf_HTML.png)


    此截图展示了如何通过填充颜色选项修改切片器的图案样式和颜色。


    **已选中无数据的项。** 这些是已按下但下方没有数据的按钮。我们对默认设置感到满意——保持原样。


    ![](img/537732_1_En_5_Figah_HTML.png)


    此截图展示了如何使用不同颜色填充仪表板的字体图案。


    **未选中有数据的项。** 这是使用切片器时非活动按钮的颜色设置。默认情况下，筛选时它们会变为灰色：我们将此填充颜色更改为棕色——我们将选择介于最深和最浅之间的阴影。


    ![](img/537732_1_En_5_Figai_HTML.png)


    此截图展示了在深浅色之间选择颜色时，如何更改默认颜色。


    **未选中无数据的项。** 此处我们使用浅棕色填充。它将应用于下方没有数据的非活动按钮。


    ![](img/537732_1_En_5_Figaj_HTML.png)


    此快照展示了为未选中的数据添加不同颜色以突出显示数据。


    在 `切片元素` 部分中，我们还剩下四个项目。所有这些项目都用于调整按钮在鼠标悬停时的外观。


    - 悬停时已选中有数据的项

    - 悬停时已选中无数据的项

    - 悬停时未选中有数据的项

    - 悬停时未选中无数据的项


    ![](img/537732_1_En_5_Figak_HTML.png)


    此快照展示了添加了不同颜色的切片元素，用于调整仪表板的外观。


    对于这些剩余的项目，我们将设置相同的设置：


    - 在 `填充` 选项卡中，我们将选择一种比仪表板背景浅一个色调的颜色。

    - 在 `字体` 选项卡中，我们将设置浅棕色和 Montserrat 字体。


    ![](img/537732_1_En_5_Figal_HTML.png)


    此快照展示了用于修改仪表板的字体样式和大小、下划线和效果以及主题颜色。


    所有元素都已配置完毕。在 `修改切片器样式` 窗口中，单击 `确定`。生成的样式将应用于我们仪表板上的其余切片器。


    深色企业形象主题的仪表板 `工资基金分析` 已准备就绪！


    ![](img/537732_1_En_5_Figam_HTML.png)


    一个窗口屏幕显示了深色主题下的 B I 商业与信息研究所页面。工资基金分析通过图表和折线图突出显示。屏幕左侧的切片器更为明显。


    ### 5.3.7 总结


    为了创建深色主题下的专业仪表板，我必须特别注意元素的对比度。有些地方我们增加了对比度，而有些地方则相反，我们减少了对比度。


    - 仪表板和图表的标题设置为浅色，以便在深色背景上清晰可见。

    - 标题下方的线条降低了亮度，并选择了一种比仪表板背景浅一个色调的颜色。

    - 蓝色卡片不适合新设计——我们也将其设置为比仪表板背景浅一个色调。

    - 我们更改了图表过于明亮的背景：为此我们使用了与仪表板背景相同的填充。

    - 在新的背景上，图表的蓝色线条变淡了：我们将其颜色改为绿色。

    - 我们为数据标签选择了新的颜色。调色板中的绿色不合适，因此我们手动选取了它。

    - 类别标题已设置为浅色，以便在新的深色背景上可见。


    切片器则是另一回事：我不得不费一番功夫，为每个状态调整按钮颜色。我承认，我自己也记不住所有这些组合。这再次表明，Excel 无所不能。了解其功能的人会获得很大的行动自由，并且可以更快地完成工作。


    # 6. 数据可视化规则


    实践部分已结束——现在我们进入理论部分。通常人们会反着来，但我有意采用这种方法。首先，是为了不立即用理论限制你。其次，是因为每个可视化规则都有例外——我将在本部分中也展示它们的例子。


    这些规则不仅适用于 Excel。在任何 BI 平台中工作时，如果你想准确快速地向用户传达数据的本质，它们都会派上用场。


    本部分的信息是为初学者提供的清晰基础，有助于准确展示数据的含义，并为任何客户的分析工作增加价值。

    '
- fmt: '# 6.1 Types of Data Analysis


    Some employees somehow miraculously manage to make simple and understandable presentations
    that the management likes. And others suffer; they redo it five times, but the
    boss still remains dissatisfied. And even if they hire a designer, it doesn’t
    get any easier.


    I will share my personal experience. At the beginning of my professional career,
    I was engaged in the commercialization of scientific projects, looking for investors.
    And there was a strict format of investment presentations: on ten slides, it is
    necessary to state the essence of the project, show market analysis, financial
    model. I somehow managed to clearly visualize it by myself.


    Later, when I had to make the first dashboard, I hired a designer to “make it
    beautiful.” It turned out bright, original, but unclear. Then I read the book
    “Say it with charts” by Gene Zelazny and realized that I followed the rules of
    visualization intuitively. But I couldn’t clearly explain to other people why
    it was necessary to build such a diagram.


    Over time, with experience, this technique appeared. With its help, I established
    communication with customers, began to ask them the right questions, understood
    what they wanted to see, and what decisions to make. And then I could clearly
    set the task for my analysts and developers in order to get the desired result
    the first time.


    What should the diagram show? What conclusion should it lead to? It depends on
    the type of data analysis, that is, what your data is in meaning.


    ## 6.1.1 Basic Types of Analysis


    | **Rating** Quantitative comparison based on the principle of “more-less": who
    is in the first place, who is in the top 5 and by what margin, and who is how
    far behind. Visualization: columns, horizontal and vertical | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figa_HTML.gif)
    A circle with 4 horizontal bars of different sizes is placed inside it. |

    | **Dynamics** Changes in indicators over time: revenue growth or decline, the
    number of staff by month, and so on. Visualization: usually lines on the timeline
    | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figb_HTML.gif) An illustration
    depicts the waveform inside the circle filled with color. |

    | **Structure** Analysis of the composition of the whole, where the emphasis is
    not on quantity, but on fractions of 100%. Helps to understand which segments
    and categories contribute to the achievement of the indicator. Visualization:
    figures divided into sectors | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figc_HTML.gif)
    An illustration depicts the circle with lines at the center. |

    | **Distribution** The distribution of a quantity on a quantitative scale, constant
    or interval. For example, segmentation of customers by age or check amount. Visualization:
    scatterplots, histograms | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figd_HTML.gif)
    An illustration depicts a circle with a cluster of dots in the center. |

    | **Relationships** Displays dependencies between indicators, as well as logical
    relationships between categories. For example, how financial flows move in the
    holding. Visualization: graphs and other complex diagrams | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Fige_HTML.gif)
    An illustration depicts the circle with several dots and their interconnections
    at the center. |


    The last two types of analysis, distribution, and relationships, are rarely used
    in management reporting. They belong in statistical analysis, where you need to
    look for correlations and build complex graphs. To present a report at a meeting,
    you need simple and understandable visualizations that accurately convey the meaning
    of the data.


    There are more complex types of analysis (factor analysis, cohort analysis) –
    combinations of several basic ones. There are advanced visualizations for them:
    some can also be built in Excel, while others will already require full-fledged
    BI systems. But first we need to deal with the database and avoid mistakes at
    this level.


    ## 6.1.2 Typical Errors


    Someone will say that the following examples are some kind of childish mistakes.
    But on projects in large corporations, I regularly see how adult people make them
    in their reports. Because “it is accepted” and “we are already used to it.” Or
    because once the director liked such a schedule, and now everyone is building
    it about and without.


    ### Pseudo Dynamics


    Here we look at the profit chart for managers. But what conclusion can be drawn
    from this line? It seems as if it depicts periods of growth and decline. Williams
    had a peak, then Wilson had a decline, then Johnson had a peak again, and then
    a smooth decline.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figf_HTML.jpg)


    A line chart exposes the ranges of profit of managers. Williams: 28, Johnson:
    27, Brown: 22, Davies: 18, Clark: 17, Wilson: 13, Taylor: 12, Baker: 11, Smith:
    7, and Jones: 6. A cross mark is exhibited on the top left corner.


    If you need to compare the profit by employees, then first of all it is important
    to see who is in first place, in the top three, the top five, and by what margin
    from the rest. The same is true for laggards.


    But sorting managers alphabetically does not help to understand who is in what
    place. And the line of the graph is torn off from the surnames: first we see the
    maximum value, and then we look with our eyes to whom it refers.


    On the X-axis, we sort categories only for dynamics and statistical charts. In
    other cases, we order the values from larger to smaller along the Y axis.


    The line graph is used to track the change in the indicator over time, but not
    to compare categories on the X-axis with each other.


    To compare employees by the amount of profit earned, a column chart is perfect.
    It is immediately clear: there are two leaders, there is manager Brown in third
    place, and after him – two are competing for fourth at once. The second half of
    the department is lagging behind.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figg_HTML.png)


    A bar chart exposes the levels of profits of 10 managers. Williams is in the first
    place (28 thousand dollars) and Jones is in the last place (6 thousand dollars).
    A tick mark is exhibited on the top right corner.


    It is clear that there is not enough data for serious conclusions about labor
    productivity. You need to compare the fact with the plan, the volume of the customer
    base, and other indicators. But the fact itself on such a column chart is shown
    as clearly as possible.'
  raw: '## 6.1 Types of Data Analysis


    Some employees somehow miraculously manage to make simple and understandable presentations
    that the management likes. And others suffer; they redo it five times, but the
    boss still remains dissatisfied. And even if they hire a designer, it doesn’t
    get any easier.


    I will share my personal experience. At the beginning of my professional career,
    I was engaged in the commercialization of scientific projects, looking for investors.
    And there was a strict format of investment presentations: on ten slides, it is
    necessary to state the essence of the project, show market analysis, financial
    model. I somehow managed to clearly visualize it by myself.


    Later, when I had to make the first dashboard, I hired a designer to “make it
    beautiful.” It turned out bright, original, but unclear. Then I read the book
    “Say it with charts” by Gene Zelazny and realized that I followed the rules of
    visualization intuitively. But I couldn’t clearly explain to other people why
    it was necessary to build such a diagram.


    Over time, with experience, this technique appeared. With its help, I established
    communication with customers, began to ask them the right questions, understood
    what they wanted to see, and what decisions to make. And then I could clearly
    set the task for my analysts and developers in order to get the desired result
    the first time.


    What should the diagram show? What conclusion should it lead to? It depends on
    the type of data analysis, that is, what your data is in meaning.


    ### 6.1.1 Basic Types of Analysis


    | **Rating**Quantitative comparison based on the principle of “more-less": who
    is in the first place, who is in the top 5 and by what margin, and who is how
    far behind.Visualization: columns, horizontal and vertical | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figa_HTML.gif)A
    circle with 4 horizontal bars of different sizes is placed inside it. |

    | **Dynamics**Changes in indicators over time: revenue growth or decline, the
    number of staff by month, and so on.Visualization: usually lines on the timeline
    | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figb_HTML.gif)An illustration
    depicts the waveform inside the circle filled with color. |

    | StructureAnalysis of the composition of the whole, where the emphasis is not
    on quantity, but on fractions of 100%. Helps to understand which segments and
    categories contribute to the achievement of the indicator.Visualization: figures
    divided into sectors | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figc_HTML.gif)An
    illustration depicts the circle with lines at the center. |

    | **Distribution**The distribution of a quantity on a quantitative scale, constant
    or interval. For example, segmentation of customers by age or check amount.Visualization:
    scatterplots, histograms | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figd_HTML.gif)An
    illustration depicts a circle with a cluster of dots in the center. |

    | **Relationships**Displays dependencies between indicators, as well as logical
    relationships between categories. For example, how financial flows move in the
    holding.Visualization: graphs and other complex diagrams | ![](images/537732_1_En_6_Chapter/537732_1_En_6_Fige_HTML.gif)An
    illustration depicts the circle with several dots and their interconnections at
    the center. |


    The last two types of analysis, distribution, and relationships, are rarely used
    in management reporting. They belong in statistical analysis, where you need to
    look for correlations and build complex graphs. To present a report at a meeting,
    you need simple and understandable visualizations that accurately convey the meaning
    of the data.


    There are more complex types of analysis (factor analysis, cohort analysis) –
    combinations of several basic ones. There are advanced visualizations for them:
    some can also be built in Excel, while others will already require full-fledged
    BI systems. But first we need to deal with the database and avoid mistakes at
    this level.


    ### 6.1.2 Typical Errors


    Someone will say that the following examples are some kind of childish mistakes.
    But on projects in large corporations, I regularly see how adult people make them
    in their reports. Because “it is accepted” and “we are already used to it.” Or
    because once the director liked such a schedule, and now everyone is building
    it about and without.


    #### Pseudo Dynamics


    Here we look at the profit chart for managers. But what conclusion can be drawn
    from this line? It seems as if it depicts periods of growth and decline. Williams
    had a peak, then Wilson had a decline, then Johnson had a peak again, and then
    a smooth decline.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figf_HTML.jpg)


    A line chart exposes the ranges of profit of managers. Williams: 28, Johnson:
    27, Brown: 22, Davies: 18, Clark: 17, Wilson: 13, Taylor: 12, Baker: 11, Smith:
    7, and Jones: 6\. A cross mark is exhibited on the top left corner.


    If you need to compare the profit by employees, then first of all it is important
    to see who is in first place, in the top three, the top five, and by what margin
    from the rest. The same is true for laggards.


    But sorting managers alphabetically does not help to understand who is in what
    place. And the line of the graph is torn off from the surnames: first we see the
    maximum value, and then we look with our eyes to whom it refers.


    On the X-axis, we sort categories only for dynamics and statistical charts. In
    other cases, we order the values from larger to smaller along the Y axis.


    The line graph is used to track the change in the indicator over time, but not
    to compare categories on the X-axis with each other.


    To compare employees by the amount of profit earned, a column chart is perfect.
    It is immediately clear: there are two leaders, there is manager Brown in third
    place, and after him – two are competing for fourth at once. The second half of
    the department is lagging behind.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figg_HTML.png)


    A bar chart exposes the levels of profits of 10 managers. Williams is in the first
    place (28 thousand dollars) and Jones is in the last place (6 thousand dollars).
    A tick mark is exhibited on the top right corner.


    It is clear that there is not enough data for serious conclusions about labor
    productivity. You need to compare the fact with the plan, the volume of the customer
    base, and other indicators. But the fact itself on such a column chart is shown
    as clearly as possible.'
  trans: '

    # 6.1 数据分析的类型


    有些员工不知怎地就能奇迹般地做出管理层喜欢的、简单易懂的演示文稿。而另一些人则备受煎熬；他们反复修改五次，老板却仍然不满意。即便请来设计师，情况也未见好转。


    我将分享我个人的经验。在我职业生涯初期，我致力于科研项目的商业化，寻找投资人。当时，投资演示文稿有着严格的格式要求：必须在十页幻灯片内阐明项目本质、展示市场分析和财务模型。我不知何故自己就能将其清晰可视化。


    后来，当我需要制作第一个仪表盘时，我请了一位设计师来“把它做漂亮”。结果做出来色彩鲜艳、创意十足，但内容却不清晰。随后，我阅读了吉恩·泽拉兹尼的《用图表说话》一书，才意识到我一直在凭直觉遵循可视化规则。但我无法向其他人清楚地解释，为什么一定要构建那样的图表。


    随着时间的推移，通过积累经验，我摸索出了这套方法。借助它，我与客户建立了有效沟通，开始向他们提出正确的问题，理解他们想看到什么，以及要做出哪些决策。这样一来，我就能清晰地为分析师和开发人员设定任务，以便第一次就获得期望的结果。


    图表应该展示什么？它应该引导出什么结论？这取决于数据分析的类型，也就是你的数据在含义上属于哪一类。


    ## 6.1.1 分析的基本类型


    | **排名** 基于“多-少”原则的定量比较：谁排名第一，谁位列前五，领先幅度是多少，谁又落后了多少。可视化：柱状图（横向和纵向） | ![](img/537732_1_En_6_Figa_HTML.gif)
    一个圆圈内放置了四个大小不一的水平条。 |

    | **动态** 指标随时间的变化：收入的增长或下降、月度员工数量等。可视化：通常是时间轴上的折线 | ![](img/537732_1_En_6_Figb_HTML.gif)
    一个插图展示了圆圈内填充颜色的波形。 |

    | **结构** 对整体构成的分析，重点不在于数量，而在于各部分占总体的百分比（100%）。有助于理解哪些细分市场和类别对实现指标有贡献。可视化：被分割成扇区的图形
    | ![](img/537732_1_En_6_Figc_HTML.gif) 一个插图展示了中心有线条的圆圈。 |

    | **分布** 某个数值在定量尺度（恒定或区间）上的分布情况。例如，按年龄或消费金额对客户进行细分。可视化：散点图、直方图 | ![](img/537732_1_En_6_Figd_HTML.gif)
    一个插图展示了中心有一团点的圆圈。 |

    | **关系** 展示指标之间的依赖关系，以及类别之间的逻辑关联。例如，控股公司内部的资金流如何运作。可视化：图表及其他复杂图形 | ![](img/537732_1_En_6_Fige_HTML.gif)
    一个插图展示了中心有几个点及其相互连接的圆圈。 |


    最后两种分析类型，即分布和关系，在管理报告中很少使用。它们属于统计分析范畴，需要寻找相关性并构建复杂图表。要在会议上做报告，你需要的是简单易懂的可视化图表，能准确传达数据的含义。


    还有更复杂的分析类型（如因子分析、同期群分析），它们是几种基本分析类型的组合。针对这些分析，存在高级的可视化方法：有些可以在 Excel 中实现，而另一些则需要完整的
    BI 系统。但首先我们需要处理好基础数据，避免在这个层面犯错。


    ## 6.1.2 典型错误


    有人可能会说，下面的例子是些小儿科的错误。但在大型企业的项目中，我经常看到成年人会在他们的报告中犯这些错误。原因是“大家都这么做”或者“我们已经习惯了”。又或者是因为某次总监喜欢了这种图表，于是现在每个人都不分场合地用它。


    ### 伪动态


    这里我们看的是经理们的利润图表。但能从这个折线图中得出什么结论呢？它似乎描绘了增长和下降的时期。Williams 出现峰值，然后 Wilson 下降，接着
    Johnson 再次达到峰值，然后平稳下降。


    ![](img/537732_1_En_6_Figf_HTML.jpg)


    一张折线图展示了经理们的利润范围。Williams：28，Johnson：27，Brown：22，Davies：18，Clark：17，Wilson：13，Taylor：12，Baker：11，Smith：7，Jones：6。左上角标有一个叉号标记。


    如果需要比较员工之间的利润，那么首先要看的是谁是第一，谁在前三、前五，以及领先其余人的幅度。对于落后者也同样如此。


    但按字母顺序排序经理姓名，并不能帮助我们理解谁排在第几位。而且折线图与姓氏的对应关系是割裂的：我们先看到最大值，然后再用眼睛去找它对应的是谁。


    在 X 轴上，我们只应在动态图和统计图中对类别进行排序。在其他情况下，我们应沿 Y 轴将数值从大到小排列。


    折线图用于追踪指标随时间的变化，而不是用于比较 X 轴上的各个类别。


    要比较员工所获利润的多少，柱状图是完美的选择。上面一目了然：有两位领先者，Brown 经理排在第三位，他之后有两人并列第四。部门的后半部分则处于落后。


    ![](img/537732_1_En_6_Figg_HTML.png)


    一张条形图展示了 10 位经理的利润水平。Williams 位居第一（2.8 万美元），Jones 垫底（6 千美元）。右上角标有一个勾号标记。


    显然，仅凭这些数据还不足以对劳动生产率做出严肃的结论。你需要将实际情况与计划、客户群规模以及其他指标进行比较。但单就这个事实本身而言，在这样一张柱状图上已经展示得尽可能清晰了。

