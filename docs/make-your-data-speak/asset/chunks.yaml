    # 3.4 设计条形图


    数据标签、数字格式与位数、坐标轴与网格线的去除、图例、额外按钮、名称——所有这些对于设置任何视觉元素都是相关的，而不仅仅是针对图表。


    但在我们仪表板的图表中，有一个图形上没有的元素——那就是柱子。严格来说，“按部门支出”和“按项目支出”是不同类型的可视化：


    - 垂直柱子——柱形图

    - 水平柱子——条形图


    两者都可以称为条形图。它们具有相同的设置原则，唯有一点细微差别。


    为了方便信息的感知和比较，我们将调整柱子之间的距离，并设置其排序，以便最佳和最差的指标能够一目了然。


    在这一部分中，我将在已配置好的图表上演示操作，以免无关元素分散你的注意力。稍后，你将使用本部分末尾的特殊检查清单来添加这些设置。


    ## 3.4.1 柱子之间的距离


    默认情况下，目标值与实际值的柱子之间会形成空白区域。我们需要这些指标看起来像是每个部门的一个整体元素。为此，需要“粘合”这些柱子。


    通过鼠标点击，选择任意一行柱子 ➤ 打开上下文菜单 ➤ 选择“设置数据系列格式”项。


    ![](img/537732_1_En_3_Figam_HTML.jpg)


    一个片段包含一个条形图，位于一个显示按部门划分的数值数据的方框下方。从对话框中选择“设置数据系列格式”。


    在右侧打开的窗格中，在“系列选项”部分，我们配置以下值：


    - “系列重叠” – 0%

    - “间隙宽度” – 50%


    现在，每个部门的目标值和实际值的柱子看起来像一个整体元素，这有助于聚焦于它们之间的差异。


    ![](img/537732_1_En_3_Figan_HTML.jpg)


    一个片段包含一个显示按部门划分的数据的条形图（左侧），以及一个包含系列选项的“设置数据系列格式”图表（右侧）。


    ## 3.4.2 对柱子进行降序排序


    对有序数值的感知总是更容易。为了不让用户的眼睛在不同高度的柱子之间来回跳跃，而是能从大到小有序地浏览，我们需要设置排序。


    *图表中柱子的顺序取决于数据透视表中行的顺序。动态图表是根据月份名称构建的——它们已经自动正确排序。而在其他两个视觉元素的样本中，需要在“实际值”字段中调整排序，使其从大到小排列。*


    有两种方法可以对柱形图中的柱子进行排序。


    **方法 1：在图表上。** 我们在“按部门支出”图表中选择一个柱子。由于我们主要根据实际结果来比较部门，因此选择“实际值”柱子。右键单击，在上下文菜单中选择“排序”➤“降序排序”。


    ![](img/537732_1_En_3_Figao_HTML.jpg)


    一个包含条形图的片段显示在一个显示按部门划分的支出数据的方框下方，旁边是一个用于从大到小排序元素的对话框。


    **方法 2：在数据透视表中。** 在“草稿”工作表中，将光标放在“按部门支出”样本的单元格中。右键单击上下文菜单，选择“排序”➤“降序排序”。


    ![](img/537732_1_En_3_Figap_HTML.jpg)


    一个片段展示了两个列，即行标签和目标值（包含数据及总计），以及一个用于从大到小排序元素的对话框。


    “仪表板”工作表中的图表柱子顺序将自动更改，并呈现出符合人类感知逻辑的形态。


    ![](img/537732_1_En_3_Figaq_HTML.jpg)


    一个条形图显示了生产工人、公司管理层、商业雇员以及物流与服务人员的目标值和实际值的支出数据。


    *提示！*


    *在创建数据透视表后，我会立即对数据进行排序，并调整数字的格式和位数。这有助于避免在后期设计图表时再回头处理这些设置。*


    ## 3.4.3 条形图的柱子排序


    对于条形图来说，情况并不那么简单：Excel 默认以逆序构建数据类别。


    即使您像我们对柱形图所做的那样，将表格设置为“降序排序”，类别在图表上的排列顺序也可能完全相反。


    ![](img/537732_1_En_3_Figar_HTML.jpg)


    一个水平条形图显示了按项目（即民事合同、假期储备、预算外资金、奖金和工资）划分的目标值和实际值支出数据。


    要解决这个问题，需要在数据样本中设置反向排序——“升序排序”。然后（哇，真是奇迹！）在条形图上，它们将按降序排列。我不会深究这种构建方式的原因，只需接受它——Excel
    就是这样……


    ![](img/537732_1_En_3_Figas_HTML.jpg)


    给出了一个包含三列（行标签、目标值、实际值）的片段，其中包含不同标签的数据值。最后一行是总计。


    ![](img/537732_1_En_3_Figat_HTML.gif)


    一个水平条形图显示了按项目（即工资、奖金、预算外资金、假期储备和民事合同）划分的目标值和实际值支出数据。


    “目标值”和“实际值”柱子的顺序也存在同样的问题。在图表中，无论是在图例中还是在柱子上，“目标值”都排在首位。但只有在条形图中，“实际值”才排在前面。让我们通过调整坐标轴格式来解决这个问题。


    用右键选择 Y 轴上的类别，然后在上下文菜单中选择“设置坐标轴格式”。


    在出现的窗格中，在“设置坐标轴格式…”部分，指定以下内容：


    - 在“水平坐标轴交叉”组中，选择“最大分类”。

    - 在“显示单位”组中，勾选“逆序类别”。


    ![](img/537732_1_En_3_Figau_HTML.png)


    显示了一个名为“设置坐标轴格式”的片段，其中包含坐标轴选项和文本选项。在文本选项下，从坐标轴选项中选中了“根据数据自动选择”单选按钮。


    这些参数将根据样本中的字段顺序自动排列行，我们无需再做额外操作。


    我建议您始终选择第二种方法来配置条形图。


    ![](img/537732_1_En_3_Figav_HTML.jpg)


    一个水平条形图显示了按项目（即工资、奖金、预算外资金、假期储备和民事合同）划分的目标值和实际值支出数据。


    ## 3.4.4 图表设计检查清单


    让我们在“按部门支出”图表上演练一下设计特性：使用一个简短的检查清单来配置这个视觉元素。


    ![](img/537732_1_En_3_Figaw_HTML.jpg)


    一个条形图显示了按部门（即生产工人、公司管理层、商业雇员以及物流与服务人员）划分的目标值和实际值支出数据。


    1.  添加数据标签，为其设置 12 磅字体。

    2.  将数字的位数更改为千或百万，使标签中只保留 3-4 个字符。

    3.  移除刻度和网格线。

    4.  将数据标签的颜色设置为该数据系列的颜色（更深一级），不要为标签添加背景。

    5.  隐藏数据透视表字段按钮。

    6.  将图例放置在顶部（有时放在左侧）。

    7.  移除图例中的自动标签。

    8.  添加图表标题，为其设置 16 磅字体。

    9.  将图表柱子之间的间隙宽度减少到 50%。

    10. 将柱子从大到小调整排序。

