    \ differ from other elements. Here the shade is yellow.\n\nWe will leave the default\
    \ color green for `Actual` columns and lines.\n\nWe will set data labels to colors\
    \ a shade darker than those of the corresponding columns to make them more visible.\n\
    \nThe result is a completely different dashboard made from the same color theme\
    \ `Facet`.\n\n![](images/537732_1_En_4_Chapter/537732_1_En_4_Figaw_HTML.jpg)\n\
    \nA screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,\
    \ expenses by divisions, and items, along with division, month, and expense item\
