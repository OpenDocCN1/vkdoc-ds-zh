    These three stories are united by one common situation. The customer has an image
    of the result, the dashboard itself, but he does not know how to clearly set the
    task. The performer, the owner of the data is waiting for a clear statement and
    does not guess what solutions to offer. Because he does not know how it happens
    differently, from which side to approach the analytical task.


    Managers, analysts, middle managers – many people face difficulties in correctly
    submitting data. I wrote this book so that you can get rid of them as easily and
    quickly as possible with the help of techniques and practices approved by dozens
    of my clients and thousands of students.


    Approaches to working with data and visualization rules are the same for Excel
    and for any BI system. I am giving instructions for Excel, because it remains
    the most common program for working with reports that any analyst and manager
    has to deal with.


    Don’t be surprised that the book starts with practice, and theory goes at the
    end. Everyone has heard the theory one way or another, but stumbled on its application.
    Therefore, I will take you through the end-to-end case of creating a dashboard
    – from raw data to advanced design. To do this, I supplemented the book with QR
    codes and links to video tutorials. They describe the work in even more detail,
    and the book will be at your fingertips as a synopsis with illustrations.


    You will see that all this is not so difficult, sometimes even fascinating, feel
    your freedom of action and be able to go beyond my checklists by studying the
    visualization rules in the last part. And also continue to learn useful life hacks.


    Remember that you should not draw a diagram just because you know how to do it!
    It is important to convey the meaning of the data and make the right decision.


    Have a good reading and practice at the computer!


    About the Author About the Technical Reviewer


    # 1. Data Preparation


    Reports in the usual tables prepared manually are not suitable for building dashboards.
    The information in them is arranged conveniently and understandable for human
    perception, but isn’t suitable for machine processing. Therefore, dealing with
    data is the first step before developing a dashboard.


    In this part of the book, I will tell you what to pay attention to when analyzing
    the initial data and show you how to prepare them properly, so that the interactive
    dashboard is automatically updated.'
