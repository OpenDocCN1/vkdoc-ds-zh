    \nA screenshot depicts the wage fund analysis with 3 graphs of payment dynamics,\
    \ expenses by divisions, and items, along with division, month, and expense item\
    \ fields, in a dark color theme.\n\n> **Note**  \n> I removed the lines under\
    \ the titles, which created clear boundaries between semantic blocks. Now this\
    \ function is performed by a white background of diagrams, which means that additional\
    \ lines are no longer needed, it is not necessary to overload the interface with\
    \ them.\n\n### Summary\n\nWe figured out how to make a quick dashboard design\
    \ in different styles and offer a choice to the customer. We also received several\
    \ new options from the usual design in blue and orange colors.\n\n- We changed\
    \ the colors in `Facet` theme and changed the merging green dashboard into bright\
    \ green and yellow.\n- We created two variants with `Badge` theme in different\
    \ colors: calm gray with an emphasis on data and blue green with purple.\n- We\
    \ changed the workspace color in the `Parcel` theme and chose rich olive and muted\
    \ brick for the main indicators.\n\n![](images/537732_1_En_4_Chapter/537732_1_En_4_Figbe_HTML.png)\n\
    \nA screenshot depicts 4 pages of wage fund analysis with 3 graphs of payment\
