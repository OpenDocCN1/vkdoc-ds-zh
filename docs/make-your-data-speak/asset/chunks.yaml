  trans: '

    ### 6.3.1 动态组合图


    前面所有的新可视化效果都有一个共同思路：目标是一个被实际值穿越的标记。要在图表上进行相应调整，请选中带有目标值的线条，然后在右键菜单中选择“更改系列图表类型…”。如果没有这个选项，说明你点击的是图表区域，而非系列本身（折线或柱形）。


    ![](img/537732_1_En_6_Figan_HTML.jpg)


    截图显示了右键菜单中的一系列选项。其中选中的是`更改图表类型`。


    在打开的窗口中，我们可以为每个数据系列选择单独的图表类型。在我们的案例中，为“实际值”系列选择了`簇状柱形图`。


    ![](img/537732_1_En_6_Figao_HTML.png)


    `更改图表类型`对话框展示了一系列图表。选中了`组合图`作为图表类型。中间展示了`自定义组合`。底部展示了图表类型和坐标轴选项。


    这就是全部技巧。柱形图的好处是数据标签可以放置在中心位置，并且不会像之前那样与目标值重叠。


    剩下的事情就是根据第 3.4 部分的清单来调整图表。首先，我们将`间隙宽度`从 150%缩小到 50%。然后，将“目标值”线条的粗细增加到 3 磅，这样它就不会在粗大的柱形背景下显得模糊不清。


    在这个例子中，保留折线也是可以的，一切都很清晰。但通常需要展示三个系列：目标值、实际值和去年的实际值。在这种情况下，这种技巧就非常有帮助。只需注意主次分明：去年的数据不应分散对今年数据的注意力。


    如果需要展示更多动态指标，根据规则，我们会选择折线图。但当你需要同时查看今年的利润值、目标值和去年的数值时，柱形图和折线图的组合就更合适了。


    ![](img/537732_1_En_6_Figap_HTML.png)


    一个由折线和柱形构成的图表展示了利润动态，包含目标值、实际值和去年值。在图表最左端和最右端顶部有一个叉形标记。


    有时需要在图表上放置不同量级的数据。例如，以千美元计的收入和以美元计的小额平均客单价。简单地在图表上反映此类数据是行不通的：平均客单价的折线会“贴”到 X
    轴上。为了避免这种情况，应该将平均客单价的趋势线放在次要纵坐标轴上。


    为了清晰起见，我将坐标轴涂成了与线条相同的颜色，以便清楚每条线对应哪个轴。仅靠标签无法解决问题：标签会变成一堆难以阅读且混杂在一起的数字。这样做效果会更好，虽然并非完美。


    ![](img/537732_1_En_6_Figaq_HTML.png)


    一对折线图展示了收入和平均客单价的动态趋势。两者都呈现波动趋势。右侧显示了`设置数据系列格式`选项。


    为了强化重点，我们使用另一种技巧——对不同量级的数据使用不同的图形。我们将收入显示为柱形图，代表一个总量、总指标，而将平均客单价保留为折线图，但将其视为一个计算指标。


    根据清单自定义视觉呈现——添加标签，移除坐标轴。但这里出现了一个问题：即使系列是建立在次要坐标轴上的，平均客单价的折线还是会再次贴到 X 轴上。这是 Excel
    的另一个特性，导致我们不能简单地从图表中移除刻度。但我们可以隐藏它：通过将坐标轴重新着色为背景色（这里是白色）使其不可见。坐标轴仍然存在，但不再分散对数据的注意力。


    ![](img/537732_1_En_6_Figar_HTML.png)


    一个垂直柱形图和一个组合图（柱形+折线）展示了动态范围。柱形表示收入，折线表示平均客单价。1. 左上角有一个叉形标记。2. 右上角有一个勾选标记。


    我们之所以需要所有这些复杂操作和技巧，只是为了在 Excel 中构建此类图表。在 Power BI 等专业软件产品中，则无需如此复杂。


    ### 6.3.2 用于目标-实际值评分的子弹图


    `子弹图`用于显示目标-实际值。其视觉创意是：带有实际值的条带仿佛射出、飞离标有目标的枪管。左侧的示例看起来更像那种枪，而右侧的则是极简版本，其中的目标是一条线，一个由实际值触及的条。此外，这里还使用了条件格式：如果未达到目标，则显示红色；如果完成目标，则显示绿色。


    ![](img/537732_1_En_6_Figas_HTML.png)


    一对按项目显示支出并带有实际值和目标值的柱形图。薪金支出最高，为 396 万。在最左端和最右端顶部各有一个勾选标记和双勾选标记。


    两种方案都正确，但我推荐第二种。它为实际值柱形留出了更多空间，并且目标值紧凑地显示为一条短划线。但这些是在 Power BI 中构建的现成`子弹图`示例。在
    Excel 中，我们需要动一番脑筋，并且结果不会 100%符合标准。


    #### 系列组合实现的水平子弹图


    要构建水平子弹图，我们首先需要更改“目标值”数据系列的参数，并将`系列重叠`设置为 100%。所有数据标签都混在一起了，因此我们从“目标值”柱形中删除它们。


    ![](img/537732_1_En_6_Figat_HTML.png)


    截图展示了一个重叠柱形图，表示按项目划分的实际支出和目标支出范围。`设置数据点格式`（右侧）显示了一系列系列设置选项。


    接着，我们将“实际值”系列切换到次要纵坐标轴，并将其`系列重叠`设置为 0%，`间隙宽度`设置为 125%。设置好次要系列的坐标轴进位基准后，将其从图表中移除。


    ![](img/537732_1_En_6_Figau_HTML.png)


    截图展示了一个重叠柱形图，表示按项目划分的实际支出和目标支出范围。`次要纵坐标轴`是选中的绘图系列设置。


    然后，选中数据系列“目标值”。将其颜色改为中性灰色，以便重点只保留在实际值上，并为其设置以下参数：`系列重叠`为 0%，`间隙宽度`为 25%。


    ![](img/537732_1_En_6_Figav_HTML.png)


    截图展示了一个重叠柱形图，表示按项目划分的实际支出和目标支出范围。`主要纵坐标轴`是选中的绘图系列设置。


    至此，子弹图的所有设置已完成，它看起来几乎与 Power BI 中的标准图表一样。如果需要，你也可以用同样的方法设置垂直子弹图。

    '
- fmt: '#### Vertical Bullet Chart with a Dash


    The second type of the standard bullet chart can also be built in Excel.


    **Step 1.** Change the chart type by selecting the combined one, and then select
    the “Line with Markers” type for the target.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaw_HTML.png)


    A screenshot exposes a change chart-type dialog box exhibiting a list of charts.
    The combo is the selected chart type. A context menu exposes the column, bar,
    line, and area setting options.


    **Step 2.** Set up a data series `Target`: in the `Line` section, set the value
    `No line`, and in the `Marker` section in the `Marker Options` subsection, select
    the `Built-in` type, the type is the largest dash and set the size 45.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figax_HTML.png)


    A screenshot exhibits an overlapping bar chart that represents the actual and
    target expenses by division. The format data series setting is exposed on the
    right side. Built-in is the selected marker option.


    **Step 3.** Due to the overlap of the actual values with the marker, it is necessary
    to transfer the data labels for this series and select the position `In the center`.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figay_HTML.png)


    A screenshot exhibits an overlapping bar chart that represents the actual and
    target expenses by division. The format data labels setting is exposed on the
    right side. The center is the selected label position.


    But everything turned out imperfectly: for small values, Logistics and Service
    still does not have enough space for data labels.


    Unfortunately, this type of bullet chart can be built in Excel only for vertical,
    but not for horizontal columns. Because a marker is an attribute of a graph, and
    a graph can only display dynamics. And the dynamics can only be on a horizontal
    timeline. Here, oddly enough, the creators of Excel did the right thing and did
    not even give the opportunity to build vertical graphs.


    ### Diagrams for a Complex Structure


    In corporate reporting, the structure rarely takes any complex forms. But when
    this happens, about eight out of ten reports convey this information both incomprehensibly
    and incorrectly. In particular, this applies to two cases:


    - When you need to show the structure by two parameters at once

    - When the structure needs to be presented in combination with another type of
    analysis


    I will show you which error I encounter most often, and offer alternative solutions
    to such problems.


    #### Error: Doughnut Chart for Two Data Series


    Traditional charts for the structure, pie chart and trimap, can display only one
    data series. Although two series can be displayed on the doughnut chart, and some
    are happy with such a life hack.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figaz_HTML.jpg)


    A donut structure depicts the revenue structure by company services with target
    and actual value. Tankers have the highest percentage of 63 for the actual value.


    But this is still an unsuccessful visualization, it distorts the data. Look closely
    at the orange sector: the actual 23% looks more than the target of 24%. This can
    be logically explained by the fact that the radius of the ring with the actuals
    is larger, and therefore a smaller fraction takes up more space than on the ring
    with the target. But the problem is that it has to be explained. And proper visualization
    should work on the principle of “saw and understood.”


    As a compromise in such a situation, we can consider a normalized bar chart. Here
    two rings unfolded in a line of the same length. Although the sectors are shifted
    relative to each other, but 24% is clearly more than 23%. And indeed, we can see
    a general change in the actual revenue structure relative to the targeted one.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figba_HTML.png)


    2 horizontal bars depict the revenue structure by company services with actual
    and target values. Tankers have the highest percentage of 63 in actual value.
    A tick is on the extreme right top.


    I draw your attention to the importance of the chart design checklist! Each item
    individually may seem insignificant, but in total, they create a completely different
    impression. Compare, if we just took and changed the type of diagram, then that
    would be what happened.


    ![](images/537732_1_En_6_Chapter/537732_1_En_6_Figbb_HTML.png)


    A stacked bar chart exposes the target and actual revenue structures by company
    services. The actual range of tankers contributes the highest percentage (62.9
    percent). A cross mark is exposed on the top left corner.


    Here are the key points that we have finalized.


    - Data labels were displayed as a percentage. There is no such display parameter
    for a bar chart, so you need to recalculate them in the source data (later you
    will learn how to do this in the pivot table).

    - We made the stripes wide and visual by reducing the side gap, as well as by
    removing the scale and gridlines.


    Such a diagram also has its drawbacks. For example, data labels can only be placed
    inside sectors here, but in small sectors they will overlap each other and become
    unreadable. Just like the doughnut chart, it will be visible within six sectors.
    However, this visualization at least helps to see the difference in the length
    of the columns.'
