- fmt: '### 3.1.2 What Is Wrong with Template Styles


    In each of the suggested styles, certain settings have already been done: the
    background of the diagram, the location of the legend, font sizes, visual design
    of lines or columns.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figc_HTML.png)


    A snippet illustrates thirteen options of visual designs or styles containing
    some data out of which the twelfth design is selected.


    Let’s look at several suggested options and figure out why they don’t suit us
    and what mistakes in the design should be avoided.


    **A template with an emphasis on data.** As a first example, let’s consider a
    variant of the style with bright large balls.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figd_HTML.png)


    A line graph has fluctuating curves with the balls pointing to the data on lines
    depicting the sum of the target and the sum of the actual values from January
    to June.


    The balls draw attention to the data, and this makes the graph original. But the
    template still has drawbacks.


    A background gray gradient brightens the top of the graph and darkens the bottom.
    For business graphics, such decorations have no practical meaning. In addition,
    white data labels are completely lost against this background.


    There are also questions about the grid. The lines from the almost imperceptible
    ones at the top become wider closer to the base – this adds “gravity” to the graph.
    And in general, the grid does not perform its functions here. If there are no
    labels, it helps to correlate data points with values on the Y axis. But there
    are labels here, but there is no Y axis.


    **Template on a dark background.** To get a complete picture of the available
    styles, we will not limit ourselves to templates for the “Payments dynamics” chart
    – we will consider an option for a chart with expenses by division.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Fige_HTML.jpg)


    A bar graph with dark background illustrates the sum of the target and the sum
    of the actual commercial employees, logistics and service, production workers,
    and company management. The sum of actual value for production workers is the
    highest.


    The style template on a dark background attracts attention with its “neon,” as
    if glowing columns. But for practical use in our case, it is not suitable.


    Firstly, there are no data labels here – we don’t see specific numeric values.
    Secondly, the gridlines “blur” closer to the base – this makes it difficult to
    correlate small columns with values on the Y axis. And thirdly, it is unclear
    why the columns need to “glow.” After all, our goal is to clearly convey business
    information, and not to simulate a dance floor on a dashboard.


    **Template with vertical labels.** Among the suggested styles, there are also
    options without a colored background. Consider one of them.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figf_HTML.jpg)


    A bar graph illustrates the data on the sum of the target and sum of the actual
    values of commercial employees, logistics and service, production workers, and
    company management. The sum of actual value for production workers is the highest.


    This style looks good, but it also has too many disadvantages to use on a dashboard.


    Vertical data labels are terrible. To read them, the user will have to tilt his
    head, and this definitely does not help the comfortable perception of the report.


    The columns are very thin and the distance between them is very wide. This does
    not give us any advantages, it only forms a lot of empty space on the diagram.


    A separate story is the captions of categories in capital letters. And it’s not
    just that they take up more space and create unnecessary emphasis. It’s just that
    whole phrases in upper case create a feeling of “screaming,” and therefore are
    considered a sign of bad taste.


    Capital letters in abbreviations or short names are normal, the main thing is
    not to overdo it with accents. Just such an example will be in the following chart
    style template.


    **A template with a gradient on the columns.** To complete the picture, let’s
    also consider a variant of the standard style for a bar chart.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figg_HTML.jpg)


    A horizontal bar graph illustrates the data on the values of the sum of the target
    and actual expenses on vacation reserve, salary, extra budget funds, civil contracts,
    and bonus.


    The first thing that catches the eye is the title of the diagram. I will not criticize
    the capital letters – they could be appropriate. But. Here it is the most noticeable
    element, and it distracts attention from the data.


    There are three tools for placing accents:


    *   Font size

    *   Bold

    *   Capital letters


    It is quite enough to choose one of them, rather than use them all at once. Otherwise,
    you will get an explicit overkill, as in this example.


    The design of the columns raises no less questions. First of all, they are very
    thin: that’s also why all the attention goes to the title. Secondly, the gradient
    on them looks superfluous decoration – there is no practical sense in it.


    Also, this style template does not provide data labels, and the user does not
    see the exact numeric values. The grid helps a little to correlate the length
    of the columns with the labels on the X-axis, but its vertical lines seem to divide
    these columns into parts and violate their “integrity.”


    ### 3.1.3 What Should Be the Business Graphics: Recommended Samples


    The diagrams look different in the proposed templates and styles, but none of
    the options is suitable for our purposes. In the following parts, we will customize
    the desired style ourselves and create a minimalistic diagram template for solving
    business problems.


    The graph will have the necessary minimum: title, legend, and data labels. We
    will disable the auxiliary elements that Excel offers by default in order to focus
    on the main data.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figh_HTML.png)


    A line graph of two fluctuating curves with points depicts the exact data on the
    sum of the target and the sum of actual payment dynamics, respectively, from January
    to June.


    We will also put the bar charts in order. We will leave the necessary minimum,
    but we will remove the gap between the columns on the chart so that the target
    and actual indicators of each division look like a single block.


    ![](images/537732_1_En_3_Chapter/537732_1_En_3_Figi_HTML.jpg)


    A bar graph depicts data of the sum of the target and the sum of actual values
    of commercial employees, logistics and service, production workers, and company
    management. The sum of actual value for production workers is the highest.


    Let’s also deal with the design features of the bar chart “Expenses by items,”
    we will build the correct sorting of columns on it: Excel has its own surprises
    here.


    ### 3.1.4 Summary


    By default, Excel builds “rough” versions of charts, and offers a set of layouts
    and styles for their design. We checked some of them to see if these options are
    suitable for us.


    *   We examined the proposed express layouts on the “Design” tab: the required
    data set contained only one of them.

    *   We made sure that this single express layout also needs additional settings.

    *   We tested several standard chart styles, noted the pros and cons of each.


    According to the results of such a test, it became clear that none of the proposed
    standard options would suit us without improvement. Therefore, we will continue
    to delve deeper into the anatomy of diagrams and add fine-tuning ourselves.'
