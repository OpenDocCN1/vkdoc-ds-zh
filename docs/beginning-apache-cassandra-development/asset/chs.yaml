  ## 关于作者


  ![A978-1-4842-0142-8_BookFrontmatter_Fig1_HTML.jpg](img/A978-1-4842-0142-8_BookFrontmatter_Fig1_HTML.jpg)
  维韦克·米什拉是一位技术爱好者、作者、演讲者和大数据架构师。他是开源项目 Kundera 的主要贡献者，并为 Apache Cassandra 做出了贡献。


  目前，他在 Impetus Infotech Pvt Ltd 担任首席软件工程师。他专注于使用机器学习算法进行实时数据质量管理和虚拟化，及其在解决业务问题中的应用。


  ## 关于技术审校


  ![A978-1-4842-0142-8_BookFrontmatter_Fig2_HTML.jpg](img/A978-1-4842-0142-8_BookFrontmatter_Fig2_HTML.jpg)
  布莱恩·奥尼尔是一位技术领导者，也是大数据领域的公认权威。他领导并贡献于涉及分布式存储、实时计算和分析的开源项目。他于 2013 年荣获 InfoWorld 技术领导力奖，并被评为
  2012-2014 年度 Datastax Cassandra MVP。他撰写了关于 Cassandra 的 Dzone 参考卡片，并最近出版了一本关于分布式处理的书籍，书名为《Storm
  蓝图：分布式实时计算模式》。他拥有人工智能和数据管理方面的专利，毕业于布朗大学。


  目前，布莱恩担任 Health Market Science (HMS) 的首席技术官，负责开发一个专注于医疗保健领域分析和数据管理的大数据平台。该平台由 Storm
  和 Cassandra 驱动，可对数千个不同的数据源（包括医疗索赔和社交媒体）进行实时数据管理和分析。


  ## 引言


  大数据近年来一直是热门话题。随着解决非结构化和半结构化数据问题的可能性出现，越来越多的组织正逐渐转向大数据驱动的解决方案。这本质上为组织提供了一种“超越关系型数据库”的思考方式。本书将在学习过程中引导您了解许多此类用例。


  在过去 4-5 年中，已经开发了许多 NoSQL 数据库。近期研究表明，目前已有超过 150 种不同的 NoSQL 数据库。这引发了一个问题：为什么选择采用某个特定的数据库？例如，它是否可扩展、是否处于活跃开发中、最重要的是，是否得到社区和组织的认可？正是基于这些问题，Apache
  Cassandra 脱颖而出，说明它为何是目前最流行的 NoSQL 数据库之一。


  Apache Cassandra 是一种列式分布式数据库，它在我们从传统关系型数据库在性能和可扩展性方面遇到限制的点上，将数据库应用程序开发向前推进。限制传统关系型数据库的一些因素包括：需要预定义模式、扩展至数百个数据节点的能力，以及数据管理和监控所涉及的工作量。我们将讨论这些限制以及如何利用
  Apache Cassandra 来解决它们。


  《Apache Cassandra 开发入门》将向您介绍 Apache Cassandra，包括上述问题的答案，并对其功能集提供详细的概述和解释。


  从 Cassandra 基础开始，本书将引导您学习以下主题及更多内容：


  - 数据建模

  - 集群部署、日志记录和监控

  - 性能调优

  - 通过 MapReduce 进行批处理

  - Hive 和 Pig 集成

  - 处理基于图的解决方案

  - Cassandra 及相关实用工具的开源工具


  本书面向数据库管理员、大数据开发人员、学生、大数据解决方案架构师以及计划使用或已在使用 Apache Cassandra 的技术决策者。




  本书涉及的许多特性与概念均通过实操式指南进行讲解，清晰演示具体实现方法。除了这些分步指导外，示例源代码也可从本书的 Apress 产品页面（`www.apress.com/9781484201435`）下载获取。


