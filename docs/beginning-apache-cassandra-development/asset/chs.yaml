  ### 本章小结


  以下是本章讨论内容的总结：


  *   配置并运行基于 Hive 的查询，以类似 SQL 的方式集成并运行 MapReduce 作业。

  *   如果读者精通基于脚本的编程，并熟悉编写脚本，那么使用 Pig 会非常方便。

  *   使用 Sqoop 将数据从 HDFS/MySQL 迁移到 Cassandra，反之亦然。


