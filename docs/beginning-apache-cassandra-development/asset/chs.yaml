- "# Rexster REST API\n\n我们也可以使用 REST API 来查询 Titan 图数据库！例如，要获取所有顶点的列表，我们只需发送一个如下所示的请求：\n\
  \n`localhost:8182/graphs/$graph_name/vertices`\n\n例如，我们可以获取 Twitter “图” 中所有顶点的列表，如图\
  \ 7-17 所示。\n\n![A978-1-4842-0142-8_7_Fig17_HTML.jpg](img/A978-1-4842-0142-8_7_Fig17_HTML.jpg)\n\
  \n图 7-17.\n\n使用 REST API 返回所有顶点的列表\n\n我们还可以通过其 ID 查询特定的顶点（参见图 7-18）。\n\n![A978-1-4842-0142-8_7_Fig18_HTML.jpg](img/A978-1-4842-0142-8_7_Fig18_HTML.jpg)\n\
  \n图 7-18.\n\n使用 ID 256 获取一个顶点\n\n所有支持的 REST 方法的完整列表可以在 [`https://github.com/tinkerpop/rexster/wiki/Basic-REST-API`](https://github.com/tinkerpop/rexster/wiki/Basic-REST-API)\
  \ 找到。\n\n## 使用 Cassandra 的 Titan\n\n在本节中，我们将讨论使用 Cassandra 作为存储选项的 Titan 实现。本节将介绍如何使用\
  \ Titan Java API 与 Cassandra，并执行诸如读写图等用例。\n\n### Titan Java API\n\nTitan 是 Blueprints\
  \ 图接口的一个实现。Titan 提供了基于 Java 和 Groovy 的实现来访问 Titan。Titan Java API 的设置相当简单。在后端存储方面，它依赖其他数据库，因此要开始使用\
  \ Titan，我们只需添加：\n\n```\n<dependency>\n    <groupId>com.thinkaurelius.titan</groupId>\n\
  \    <artifactId>titan-all</artifactId>\n    <version>0.4.4</version>\n</dependency>\n\
  ```\n\n在撰写本书时，最新的 Titan 版本是 0.5.0。对于 Cassandra，Titan 依赖于 Netflix 的 Astyanax Thrift\
  \ 客户端。最新版本的 TitanGraph API 支持 Astyanax 1.56.37 版本。请注意，如果在项目中因其他 Cassandra 相关实现而使用了不同版本的\
  \ Astyanax Thrift，可能会遇到依赖性问题。这意味着在 Astyanax Thrift 客户端支持下，对 CQL 的支持也会非常有限。特定于 CQL3\
  \ 的功能（例如，集合）可能无法与此版本的 Astyanax 正常工作。\n\n当 Cassandra 在远程机器上跨多个节点运行时，我们可以使用逗号分隔的 IP\
  \ 地址列表来配置这些远程节点与 Titan 的连接。\n\n### 用于后端存储的 Cassandra\n\n如上所述，Cassandra 可以作为 Titan\
  \ 的存储后端使用。在本节中，我们将配置 Titan 存储选项，包括使用 Cassandra，并打开一个图实例。在接下来的“用例”部分，我们将通过一些简单的练习，演示如何使用\
  \ Titan 与 Cassandra，例如对图进行写入和读取操作。\n\n首先，我们需要为 Titan 配置一些存储选项：\n\n```\nimport org.apache.commons.configuration.BaseConfiguration;\n\
  import org.apache.commons.configuration.Configuration;\nimport com.thinkaurelius.titan.core.TitanFactory;\n\
  import com.thinkaurelius.titan.core.TitanGraph;\nimport com.thinkaurelius.titan.core.TitanKey;\n\
  \nConfiguration conf = new BaseConfiguration();\nconf.setProperty(\"storage.backend\"\
  , \"cassandrathrift\");\nconf.setProperty(\"storage.hostname\", \"localhost\");\n\
  conf.setProperty(\"storage.port\", \"9160\");\nconf.setProperty(\"storage.keyspace\"\
  , \"twitter\");\n```\n\n表 7-1 概述并描述了我们在上一步中使用的配置属性。\n\n接下来，我们需要使用 `TitanFactory`\
  \ 打开一个图实例：\n\n表 7-1.\n\nTitan 配置属性\n\n| Property | Value | Description |\n| ---\
  \ | --- | --- |\n| `storage.backend` | `cassandrathrift` | 使用 Cassandra 作为后端存储 |\n\
  | `storage.hostname` | `localhost` | Thrift `listen_address`，根据您的 Cassandra 服务器设置进行更改。\
  \ |\n| `storage.port` | `9160` | Thrift rp |\n| `storage.keyspace` | `Twitter` |\
  \ 用于 Titan 图存储的 Cassandra keyspace |\n\n```\nTitanGraph graph = TitanFactory.open(conf);\n\
  ```\n\n接下来，让我们通过几个用例来进一步探索用于 Cassandra 的 Titan Java API，例如数据读取、写入和批处理。\n\n### 用例\n\
  \n在本节中，我们将讨论图数据的遍历、读取、写入和批处理。我们首先讨论一个顶点和连接边数量庞大的场景，这种情况在大数据中非常常见。\n\n#### 向图写入数据\n\
  \n在实例化一个图实例之后，让我们探讨如何将顶点和入射边写入到图中。我们将讨论同样的 Twitter 示例，并为用户、其推文和关注者构建一个基于图的实现。\n\n\
  图 7-19 展示了一个我们将使用 TitanGraph API 实现的问题的表示形式。\n\n让我们向图中添加一个顶点：\n\n![A978-1-4842-0142-8_7_Fig19_HTML.jpg](img/A978-1-4842-0142-8_7_Fig19_HTML.jpg)\n\
  \n图 7-19.\n\n用户 vivek 正在关注 apress_team，并在 Twitter 上发布关于其 Cassandra 书籍的推文\n\n```\n\
  Vertex vivs = graph.addVertex(null);\nvivs.setProperty(\"fname\", \"vivek\");\n\
  vivs.setProperty(\"lname\", \"mishra\");\nvivs.setProperty(\"twitter_tag\", \"mevivs\"\
  );\n```\n\n这里，`Vertex` 是引用的 Blueprints 中的 API。以下是上述代码片段的导入语句：\n\n```\nimport com.tinkerpop.blueprints.Direction;\n\
  import com.tinkerpop.blueprints.Vertex;\n```\n\n您可以将顶点视为 Java POJO，将其属性视为字段变量。\n\
  \n让我们为推文创建另一个顶点，并在用户和推文顶点之间定义一条边：\n\n```\nVertex tweet = graph.addVertex(null);\n\
  tweet.setProperty(\"body\", \"Working on Cassandra book for apress\");\ntweet.setProperty(\"\
  tweeted_at\", \"2014-09-21\");\ngraph.addEdge(null, vivs, tweet, \"has_tweeted\"\
  ); // 用户 vivs 有推文\n```\n\n我们还可以添加另一个顶点并建立 `\"following\"` 关系：\n\n```\nVertex apress\
  \ = graph.addVertex(null);\napress.setProperty(\"fname\", \"apress\");\napress.setProperty(\"\
  twitter_tag\", \"apress_team\");\ngraph.addEdge(null, vivs, apress, \"following\"\
  ); // Vivs 正在关注 apress 团队\n```\n\n最后提交事务：\n\n```\ngraph.commit();\n```\n\n#### 从图读取数据\n\
  \n让我们进一步探索如何从 Titan 图中读取顶点和属性：\n\n从图中读取数据也非常容易，我们可以检索特定图的所有顶点，甚至可以检索特定的顶点：\n\n```\n\
  Iterable<Vertex> vertices = graph.getVertices();\nIterator<Vertex> iter = vertices.iterator();\n\
  ```\n\n我们可以像这样遍历每个顶点并检索入射边：\n\n```\nwhile(iter.hasNext())\n{\n    Vertex v = iter.next();\n\
  \    Iterable<Edge> keys = v.getEdges(Direction.BOTH);\n    ...\n}\n```\n\n每条边都有\
  \ IN 和 OUT 顶点，我们可以通过边检索这些顶点：\n\n```\nfor(Edge key : keys)\n{\n    System.out.print(key.getVertex(Direction.IN).toString());\
  \ // 将在控制台打印 vivs\n    System.out.print(\"=>\");\n    System.out.print(key.getLabel());\n\
  \    System.out.print(\"=>\");\n    System.out.println(key.getVertex(Direction.OUT).toString());\
  \ // 将打印 tweets 或 apress\n}\n```\n\n上述对 Titan 图的读写操作提供了一个关于如何使用 Titan 与 Cassandra\
  \ 的简单方法。\n\nCassandra 的核心在于大规模数据处理和分析。在使用 Cassandra 处理基于图的数据模型时也不例外。那么，如何使用 Titan\
  \ 图数据库进行数据批处理呢？Titan 确实支持批量数据处理，在下一个示例中，我们将探讨如何使用 Titan Java API 执行批量加载。\n\n\n\n\
  ### 批量加载\n\nTitan 通过 `BatchGraph` API 支持批量加载，可将其视为 `TitanGraph` 的封装器，并带有可配置的参数来定义批量大小和顶点\
  \ ID 类型。我们可以按如下方式创建 `BatchGraph` 实例：\n\n`BatchGraph bGraph = new BatchGraph<TITAN\
  \ GRAPH INSTANCE>,<VERTEX ID TYPE>,<BATCH SIZE>);`\n\n使用批量加载 API，我们可以通过一次数据库调用推送一批记录。这样图数据的加载速度总是更快。\n\
  \n让我们通过一个 Java 示例程序来探索 Titan 中的批量加载。在此示例中，我们将从一个 `.csv` 文件中读取数据。\n\n图 7-20 展示了用户\
  \ A 关注用户 B 这种格式的数据。每个用户都有 `fname`、`lname` 和 `twitter_tag` 作为顶点的属性，其中边的标签是 following，并包含一个属性值为\
  \ Cassandra。请注意，您可以在本书源代码的 `src/main/resources` 文件夹下找到示例 `.csv` 文件。\n\n![A978-1-4842-0142-8_7_Fig20_HTML.jpg](img/A978-1-4842-0142-8_7_Fig20_HTML.jpg)\n\
  \n图 7-20. 显示用户与粉丝关系的表格\n\n按照以下步骤完成示例程序：\n\n首先，常见步骤是为 Cassandra 配置一个图：\n\n```\nimport\
  \ org.apache.commons.configuration.BaseConfiguration;\nimport org.apache.commons.configuration.Configuration;\n\
  import com.thinkaurelius.titan.core.TitanFactory;\nimport com.thinkaurelius.titan.core.TitanGraph;\n\
  import com.thinkaurelius.titan.core.TitanKey;\n\nConfiguration conf = new BaseConfiguration();\n\
  conf.setProperty(\"storage.backend\", \"cassandrathrift\");\nconf.setProperty(\"\
  storage.hostname\", \"localhost\");\nconf.setProperty(\"storage.port\", \"9160\"\
  );\nconf.setProperty(\"storage.keyspace\", \"batchprocess\");\nconf.setProperty(\"\
  storage.batch-loading\", \"true\");\n```\n\n我们使用 `FileReader` 来加载示例 `.csv` 文件：\n\
  \n```\nFile file = new File(\"src/main/resources/bulk_load.csv\");\nBufferedReader\
  \ reader = new BufferedReader(new FileReader(file));\n```\n\n接下来，创建一个图的实例，并用 `BatchGraph`\
  \ 封装它：\n\n```\nTitanGraph graph = TitanFactory.open(conf);\nBatchGraph bgraph =\
  \ new BatchGraph(graph, VertexIDType.STRING, 1000);\n```\n\n这里的 1000 是批量大小，顶点 ID\
  \ 是字符串类型。\n\n现在，让我们将每个顶点属性定义为顶点键，将每个边的属性定义为标签键：\n\n```\n// 为每个属性准备顶点键\nKeyMaker\
  \ maker = graph.makeKey(\"twitter_tag\");\nmaker.dataType(String.class);\nmaker.make();\n\
  \ngraph.makeKey(\"fname\").dataType(String.class).make();\ngraph.makeKey(\"lname\"\
  ).dataType(String.class).make();\n\n// 将边属性准备为标签\nLabelMaker labelMaker = graph.makeLabel(\"\
  contentType\");\nlabelMaker.make();\n\ngraph.makeLabel(\"following\").make();\n\
  ```\n\n这里 `TitanKey` 和 `LabelKey` 是 Titan Java API 提供的类，用于准备顶点键和边键。\n\n现在，让我们逐行从文件读取并提取顶点和边的属性：\n\
  \n```\nwhile (reader.ready())\n{\n    String line = reader.readLine();\n    StringTokenizer\
  \ tokenizer = new StringTokenizer(line, \",\");\n    while (tokenizer.hasMoreTokens())\n\
  \    {\n        // System.out.println(tokenizer.nextToken());\n        // twitter_tag,fname,lname,twitter_tag,fname,lname,edgeName,edgeProperty\n\
  \        final String in_twitter_tag = tokenizer.nextToken();\n        final String\
  \ in_fname = tokenizer.nextToken();\n        final String in_lname = tokenizer.nextToken();\n\
  \        final String out_twitter_tag = tokenizer.nextToken();\n        final String\
  \ out_fname = tokenizer.nextToken();\n        final String out_lname = tokenizer.nextToken();\n\
  \        final String edgeName = tokenizer.nextToken();\n        final String edgeProperty\
  \ = tokenizer.nextToken();\n        ...\n    }\n}\n```\n\n现在，在最外层的 `while` 循环（参见步骤\
  \ 5）中创建入顶点和出顶点，并如下所示分配边：\n\n```\n// 入顶点\nVertex in = bgraph.addVertex(Math.random()\
  \ + \"\");\nin.setProperty(\"twitter_tag\", in_twitter_tag);\nin.setProperty(\"\
  fname\", in_fname);\nin.setProperty(\"lname\", in_lname);\n\n// 出顶点\nVertex out\
  \ = bgraph.addVertex(Math.random() + \"\");\nout.setProperty(\"twitter_tag\", out_twitter_tag);\n\
  out.setProperty(\"fname\", out_fname);\nout.setProperty(\"lname\", out_lname);\n\
  \n// 分配边\nbgraph.addEdge(null, in, out, edgeName);\n```\n\n最后，在成功读取 `.csv` 文件中的所有记录并填充\
  \ `BatchGraph` 后，我们可以调用 `commit`：\n\n```\nbgraph.commit();\n```\n\n这里的批量大小是在图上调用\
  \ `commit` 之前要加载的顶点和边的数量。我们需要注意的一件事是，将批量大小设置为一个适中的值，以避免在处理具有数百万或数十亿条边的大型图时出现堆大小问题。\n\
  \n### 超级节点问题\n\n在现实世界中，基于大数据的图可能非常庞大，并且可能存在一组具有极多关联边的顶点。在图论中，这样的顶点被称为超级节点。由于存在如此多的复杂路径，图中的随机遍历可能会将我们引向这些超级节点，这将对系统性能产生严重影响。\n\
  \n图 7-21 展示了我的领英社交图，其中标记出的顶点可被称为超级节点。\n\n![A978-1-4842-0142-8_7_Fig21_HTML.jpg](img/A978-1-4842-0142-8_7_Fig21_HTML.jpg)\n\
  \n图 7-21. Vivek 的领英图\n\n例如，如果我需要遍历特定群组（比如 graphDB）的所有连接，那么没有索引的此类遍历将导致性能问题。通过按标签对关联边建立索引，此类查询会快得多。\n\
  \n例如，如果我们想找到 Vivek 所有已加入“graphDB”群组的朋友，进行随机遍历需要搜索 Vivek 的每一个连接，然后扫描他每个朋友加入的群组。想象一下，Vivek\
  \ 在领英上有大量的连接。可以想见，在这种情况下，随机遍历寻找所需结果将是一场噩梦。但是，使用标签索引查询，它会快得多：\n\n```\ng.query().has(\"\
  friends of\", EQUAL, \"vivek\").has(\"group\", EQUAL, \"graphDB\").vertices();\n\
  ```\n\n此查询是一个标签索引查询，它使用“friends of”搜索 Vivek 的所有朋友，然后使用索引边“group”在剩余子集中搜索 graphDB。\n\
  \n我们将在本章下一节中进一步探讨这一点。\n\n\n\n"
- "# 更快的深度遍历\n\n深度遍历是指在图的层级结构中到达第 n 层。以我在前文提到的领英社交图为例，可以通过查询我的联系人来寻找共同的群组兴趣。根据数据量和关联边的数量，通过顶点查询逐个迭代顶点可能并非良策。Titan\
  \ 支持多顶点查询，可以将多个顶点查询合并为一个单一的查询发送给图数据库。这样一来，数据检索速度会快得多，因为只需访问服务器一次。\n\n接下来，我们将通过印度神话史诗《罗摩衍那》来探索如何在\
  \ Titan 中使用多顶点查询实现更快的深度遍历。在这个例子中，我们将尝试查找叶子节点级别的“父子”关系。图 7-22 展示了罗摩及其祖先的家谱。\n\n![A978-1-4842-0142-8_7_Fig22_HTML.jpg](img/A978-1-4842-0142-8_7_Fig22_HTML.jpg)\n\
  \n图 7-22. 罗摩衍那家族图\n\n在每个层级查找“父子”关系的一种方法是像这样逐层迭代：\n\n```java\nprivate static void\
  \ iterateToLeaf(Vertex dasratha)\n{\n    System.out.println(\"Finding sons for::\"\
  \ + dasratha.getProperty(\"fname\"));\n    Iterable<Vertex> immediateSons = dasratha.getVertices(Direction.IN,\
  \ \"son of\");\n    Iterator<Vertex> iter = immediateSons.iterator();\n    // one\
  \ way is\n    while (iter.hasNext())\n    {\n        Vertex v = iter.next();\n \
  \       // recursive call\n        iterateToLeaf(v);\n    }\n}\n```\n\n在上面的代码片段中，我们需要传入根顶点对象，即\
  \ `dasaratha`，然后递归调用会遍历每一层的每个顶点。对于较小的图，这可能有效；但对于大型数据和大数据图来说，这不是一个可行的解决方案。这正是多顶点查询大显身手且性能卓越的地方。\n\
  \n让我们通过几个代码片段来了解如何使用 Titan 执行多顶点查询。你可以在随附的源代码中找到完整的 `GraphTraversalRunner.java`\
  \ 示例。\n\n首先，添加 `dasaratha` 作为根顶点：\n\n```java\nVertex das = add(\"fname\", \"dasaratha\"\
  , graph);\n```\n\n```java\nprivate static Vertex add(final String propertyName,\
  \ final String value, TitanGraph graph)\n{\n    Vertex vertex = graph.addVertex(null);\n\
  \    vertex.setProperty(propertyName, value);\n    return vertex;\n}\n```\n\n接着，添加\
  \ dasaratha 的儿子：\n\n```java\n// add dasratha's son.\nVertex ram = addSon(\"fname\"\
  , \"ram\", graph, das);\nVertex laxman = addSon(\"fname\", \"laxman\", graph, das);\n\
  Vertex bharat = addSon(\"fname\", \"bharat\", graph, das);\nVertex shatrugna = addSon(\"\
  fname\", \"shatrugna\", graph, das);\n```\n\n```java\nprivate static Vertex addSon(String\
  \ propertyName, String value, TitanGraph graph, Vertex father)\n{\n    Vertex son\
  \ = add(propertyName, value, graph);\n    graph.addEdge(null, son, father, \"son\
  \ of\");\n    return son;\n}\n```\n\n对 `ram`、`laxman`、`bharat` 和 `shatrugna` 重复步骤\
  \ 2：\n\n```java\n// ram's son\naddSon(\"fname\", \"luv\", graph, ram);\naddSon(\"\
  fname\", \"kush\", graph, ram);\n// bharat's son\naddSon(\"fname\", \"Daksha\",\
  \ graph, bharat);\naddSon(\"fname\", \"Pushkala\", graph, bharat);\n// laxman's\
  \ son\naddSon(\"fname\", \"Angada\", graph, laxman);\naddSon(\"fname\", \"Chanderkedu\"\
  , graph, laxman);\n// Shatrugna’s son\naddSon(\"fname\", \"Shatrugadi\", graph,\
  \ shatrugna);\naddSon(\"fname\", \"Subahu\", graph, shatrugna);\n```\n\n最后，存储完整的层级结构：\n\
  \n```java\ngraph.commit();\n```\n\n现在，要使用多顶点支持来获取所有具有 `Direction.IN`（表示入边）且标签为 “son\
  \ of” 的顶点，我们需要执行以下查询：\n\n```java\n// prepare multi vertex query\nTitanMultiVertexQuery\
  \ mq = graph.multiQuery();\nmq.direction(Direction.IN).labels(\"son of\");\nmq.addVertex((TitanVertex)\
  \ das); // add root\nmq.addVertex((TitanVertex) ram);\nmq.addVertex((TitanVertex)\
  \ bharat);\nmq.addVertex((TitanVertex) laxman);\nmq.addVertex((TitanVertex) shatrugna);\n\
  // execute multi vertex query\nMap<TitanVertex, Iterable<TitanVertex>> dfsResult\
  \ = mq.vertices();\n// iterate through result and print\nfor (TitanVertex key :\
  \ dfsResult.keySet())\n{\n    System.out.println(\"Finding son of\" + key.getProperty(\"\
  fname\"));\n    Iterable<TitanVertex> sons = dfsResult.get(key);\n    Iterator<TitanVertex>\
  \ sonIter = sons.iterator();\n    while (sonIter.hasNext())\n    {\n        System.out.println(sonIter.next().getProperty(\"\
  fname\"));\n    }\n}\n```\n\n通过这种方式，我们可以在 Titan 中实现更快的深度遍历。\n\n我们已经介绍了 Titan 图数据库支持的大部分重要特性。本章分享的示例代码片段应能使读者学会将\
  \ Titan 与 Cassandra 结合使用，例如构建社交图、网络图或运行类图查询。至于图数据库的未来，下一章将讨论关于图数据库领域活跃开发的一份报告。\n\
  \n至此，我们结束了关于图数据库以及如何将 Titan 与 Cassandra 集成的讨论。有关更多详细信息和受支持的特性集，你可以参考 [`https://github.com/thinkaurelius/titan/wiki`](https://github.com/thinkaurelius/titan/wiki)。\n\
  \n## 总结\n\n总而言之，本章涵盖的主题包括：\n\n*   图简介\n*   理解 TinkerPop 和 Blueprints\n*   Titan\
  \ 数据库生态系统\n*   Titan 与 Cassandra 的集成\n\n下一章将介绍 Cassandra 的性能调优和压缩技术。\n\n"
- '# 8. Cassandra 性能调优


  随着存储硬件在容量方面变得更便宜、更高效，组织能够为其 TB 级的数据选择更便宜、维护成本更低的存储方案。显然，成本效益一直是技术选择背后的重要因素。大数据量的存储和检索是需求，但经济实惠的解决方案不应以牺牲性能为代价。数据，无论大小，除非可以有效地使用并进行分析，否则都是无益的。


  通过真实世界大数据相关用例所证明的机遇，许多组织和初创公司正在围绕大数据探索商业构想。对于面向在线受众的公司来说，实时数据非常受欢迎。如今的应用程序每秒需要处理和分析数
  GB 的数据，这清楚地表明性能是现代基于大数据的应用程序的重要组成部分。


  在本章中，我们将讨论：


  *   关键性能指标

  *   Cassandra 缓存配置

  *   讨论布隆过滤器和垃圾回收

  *   Cassandra 压力测试

  *   Yahoo Cloud Serving Benchmark（雅虎云服务基准测试）


  ## 理解关键性能指标


  本节将讨论几个关键性能指标（KPI），包括：


  *   CPU 和内存消耗

  *   高读写吞吐量和延迟

  *   逻辑读取和物理读取


  性能不一致或性能下降是应用程序需要进行性能调优的主要问题。这就是前端应用程序和后端数据库需要从性能角度进行调优的地方。


  首先，让我们初步了解几个 KPI，这些指标将指导我们如何配置 Cassandra 以提升性能。



  ### CPU 和内存利用率


  从性能角度来看，CPU 和内存利用率非常重要。`JConsole`、`JProfile` 和 `YourKit` 等工具可通过监控 CPU 和内存占用来追踪应用程序的性能。值得一提的是，许多
  Cassandra 服务进程会占用堆外内存；因此，在为同一节点上本地运行的应用程序调整堆配置时，我们需要确保不会发生内存不足或泄漏，以免导致应用不稳定。堆大小配置过低会触发频繁的垃圾回收活动。虽无法完全避免垃圾回收周期，但我们可以对其进行调优以获得更好的响应时间。例如，保留较大的年轻代空间可以容纳更多存活对象，但会导致较长的
  GC（垃圾回收）周期。通常情况下，对年轻代对象进行的垃圾回收活动速度较快，对响应时间的影响几乎可以忽略不计。但 Full GC 是一种“停止一切”的事件，会严重影响应用程序的性能。我们需要确保为
  Eden 区以及后续内存池中的临时区和永久区分配适当的内存。建议保留较小的永久代空间。


  ### 高读写吞吐量与延迟


  大数据处理的讨论核心在于“实践出真知”。应用程序必须能够快速执行数据摄入和读取，无论数据量大小如何。读/写延迟是性能监控和调优的另一个重要方面。现代应用程序要求以最小延迟实现实时或近实时数据处理。因此，在采用技术和数据库时，我们必须牢记这一点，以避免此类性能开销。


  ### 逻辑读取与物理读取


  逻辑读取指的是从数据缓存中读取行，而物理读取则涉及磁盘访问。较高的逻辑读取往往意味着较大的内存占用，同样，频繁的物理读取会引入读取延迟，并可能造成性能开销。因此，在两者之间取得平衡至关重要。Cassandra
  提供了行缓存和键缓存，以及 memtable，以减少物理读取。我们将在本章中详细讨论这些内容。


  接下来，让我们讨论各种 Cassandra 特有的配置。在本章的后续部分，我们还将介绍前端应用程序的性能监控和调优。


  ## Cassandra 配置


  Cassandra 提供了多种配置，可针对高读写负载进行调整。让我们从缓存配置开始，逐一进行探讨。


  ### 数据缓存


  数据缓存将频繁访问的行保存在内存中，以避免服务器端的磁盘访问。在 n 层架构中，数据缓存也可以在客户端实现（例如 `Ehcache`）。数据缓存的概念并不新鲜，传统的关系数据库管理系统（RDBMS）中也有应用。数据缓存在读取操作中非常有用，建议对频繁获取的数据采用数据库级别的缓存。Cassandra
  同时提供了键缓存和行缓存。图 8-1 展示了在从 Cassandra 数据库读取数据时，这些缓存是如何工作的流程图。


  ![A978-1-4842-0142-8_8_Fig1_HTML.jpg](img/A978-1-4842-0142-8_8_Fig1_HTML.jpg)


  图 8-1. 收到读取请求后缓存如何与 Cassandra 服务器协同工作


  行缓存和键缓存有助于检索最常用的行。保持适度的行缓存大小和较多的键缓存数量可以带来更好的性能和更低的延迟。接下来让我们讨论这些与 Cassandra 相关的缓存配置。


  #### 缓存目录


  默认的缓存位置是 `/var/lib/cassandra/saved_caches`。我们也可以在 `cassandra.yaml` 中修改它：


  `saved_caches_directory: /var/lib/cassandra/saved_caches`


  #### 键缓存


  使用键缓存时，对实际行键的引用将缓存在内存中，每个列族独立缓存。对于高负载的、基于读取的应用程序，建议设置较大的键缓存，当然这需要在 JVM 设置允许的范围内。表
  8-1 描述了可以在 `cassandra.yaml` 中配置的各种键缓存参数。


  表 8-1. 键缓存配置


  | 名称 | 描述 |

  | --- | --- |

  | `key_cache_size_in_mb` | 键缓存大小，以兆字节为单位。默认情况下，它为堆的 5% 或 100MB（取两者中较小值）。设置为 0 可以禁用。
  |

  | `key_cache_save_period` | 将键缓存保存到已配置缓存目录的时间间隔。默认为 4 小时。 |

  | `key_cache_keys_to_save` | 要保存的键数量，默认情况下禁用，但建议设置为一个较高的值。 |


  从 2.0 版本开始，键缓存已移至堆外，这显著减少了键序列化所花费的时间。我们将在本章后面讨论堆外与堆内的问题。如前所述，内存利用率是性能的关键指标之一，在配置行缓存时，我们必须避免
  Full GC 活动，无论键缓存现在是否已移至堆外。


  #### `populate_io_cache_on_flush`


  默认情况下，此参数处于禁用状态，设置为 false。在 Cassandra 1.2.x 之前，它在节点级别受支持，但现在可以在列族级别启用。此标志的目的是在 memtable
  刷新和压缩期间，在列族级别启用/禁用页面缓存。如果设置为 true，它将把特定列族的数据缓存保留在内存中。正如 第 1 章 所讨论的，memtable 会以 sstable
  的形式将数据持续刷新到磁盘。如果此参数设置为 true，Cassandra 会为该列族的所有行保留一个页面缓存。请注意，页面缓存仅在刷新和压缩期间刷新，以便节点上该列族的数据保持最新。用户需要确保数据大小能很好地适应节点的内存。我们可以在创建表或修改现有表时启用它：


  ```

  create table tweets(tweet_id text primary key,body text) with caching=''rows_only''
  and bloom_filter_fp_chance=0.004 and populate_io_cache_on_flush=''true'';  // 创建表


  alter table user with populate_io_cache_on_flush=''true''; // 修改表

  ```


  建议对频繁查询且能很好地适应内存的列族将此参数设置为 true，以获得更好的读取吞吐量。图 8-2 显示了用户创建的、此属性设置为 true 的表（见标记行）。


  ![A978-1-4842-0142-8_8_Fig2_HTML.jpg](img/A978-1-4842-0142-8_8_Fig2_HTML.jpg)


  图 8-2. 启用了填充 I/O 操作缓存的用户表（设置为 true）




  ### 行缓存


  启用行级缓存后，整行数据都会存于缓存中。与键级缓存相比，行缓存需要大量空间。从 Cassandra 1.2 开始，行缓存可移至堆外，但行的反序列化仍会临时在堆内进行。表
  8-2 展示了几种行缓存配置及其说明。


  **表 8-2.** 行缓存配置


  | 名称 | 说明 |

  | --- | --- |

  | `row_cache_size_in_mb` | 默认禁用，设置为 0。 |

  | `row_cache_save_period` | 默认禁用行缓存，启用可改善冷启动性能，但缓存可能代价高昂且消耗大量内存。 |

  | `row_cache_keys_to_save` | 默认禁用。要保存的行缓存键数。 |


  行缓存非常有用，能显著减少对频繁访问行的磁盘读取。但它也占用大量空间。如果应用程序需要频繁获取整行数据而非选定列，建议启用行缓存。


  要为特定列族启用缓存，可以在创建列族时进行如下设置：


  ```

  create table user(user_id text primary key,fname text) with caching=''keys_only'';

  ```


  ```

  create table tweets(tweet_id text primary key,body text) with caching=''rows_only'';

  ```


  在上述脚本中，对 `user` 列族启用了键级缓存，而对 `tweets` 表启用了行级缓存。建议在应用程序需要读取整行而非选定列时启用行缓存。显然，若采用选定列的方式，启用行缓存反而会产生负面影响，并且会浪费内存空间，因为行会被无谓地保留在内存中。


  以下代码片段展示了如何在 `Cassandra.yaml` 文件中配置这些缓存参数：


  ```

  # 要缓存的键大小为 50 MB。

  key_cache_size_in_mb: 50


  # 键在缓存中保留 5 分钟或 3600 秒。

  key_cache_save_period: 3600


  # 在键缓存中保存 100 个键。

  key_cache_keys_to_save: 100


  # 在缓存中保留 100 MB 的行数据。

  row_cache_size_in_mb: 100


  # 行在缓存中保留 5 分钟或 3600 秒。

  row_cache_save_period: 3600


  # 从行缓存中保存 100 个键。

  row_cache_keys_to_save: 100


  # 缓存保存目录。

  saved_caches_directory: /var/lib/cassandra/saved_caches

  ```


  ### 布隆过滤器


  布隆过滤器是一种用于判断元素是否存在于集合中的数据结构。它由 Burton Bloom 于 1970 年提出，用于判断元素存在于集合中的概率。启用布隆过滤器后，它会返回元素“肯定不在集合中”或“可能在集合中”。误报（FP）指元素实际不存在但过滤器认为可能存在；漏报指元素实际存在但过滤器认为肯定不存在。


  Cassandra 中的每个表都包含一个布隆过滤器。它利用误报率值来检查 SSTable 中一行内可能存在的列，但漏报是绝对不可能的。这里的漏报意味着行中的列实际存在，但布隆过滤器却返回否定结果。


  将布隆过滤器的误报率设置得更高意味着消耗更少内存，并确保永远不会出现漏报（例如，对不存在的键不会产生磁盘 I/O）。布隆过滤器误报率的范围是 0.000744
  到 1.0。将误报率设置得较高会导致在 SSTable 中找到列的可能性增加，但对于否定情况不会产生磁盘读取。


  你可以在创建列族时设置布隆过滤器，也可以像这样更新列族：


  ```

  create table tweets(tweet_id text primary key,body text) with caching=''rows_only''
  and bloom_filter_fp_chance=0.004;

  ```


  ```

  alter table user with bloom_filter_fp_chance=0.004;

  ```


  ### 堆外 vs. 堆内


  堆外内存分配是直接从操作系统分配内存，而堆内内存对象则由 JVM 本身管理。Cassandra 也会在堆外内存中加载行缓存和键缓存，这意味着这些对象在非 Java
  堆上进行序列化。这样反序列化会快得多。


  建议保持适中的堆大小，因为堆仅从系统内存中分配内存。根据经验，最好不要超过 6 GB（如果系统内存大于 6 GB）。你可以通过 Java 运行时获取 `maxMemory`：


  ```

  Runtime rTime = Runtime.getRuntime();

  long maxSize = rTime.maxMemory();

  ```


  如果系统内存小于 2 GB，建议保留 50% 作为堆内存。


  Cassandra 要求安装 Java Native Access (JNA) 库以支持堆外缓存。


  要启用 JNA 库，你需要从 [`https://github.com/twall/jna`](https://github.com/twall/jna) 下载
  `JNA.jar` 并将其放置在 classpath 中。就这么简单！


  我们还可以在 `cassandra.yaml` 中设置堆外内存分配器：


  ```

  memory_allocator: NativeAllocator

  可选的值为 NativeAllocator, JEMallocAllocator。

  ```


  要安装 `JEMallocAllocator`，你需要下载并安装 jemalloc 库。jemalloc 的源码可在 GitHub 上获取（[`https://github.com/jemalloc/jemalloc`](https://github.com/jemalloc/jemalloc)）。


  #### 安装和配置 jemalloc


  安装 jemalloc 的步骤如下：


  首先从 github 克隆并下载源码：


  ```

  git clone https://github.com/jemalloc/jemalloc.git

  ```


  切换目录到 `jemalloc` 并运行 `configure`：


  ```

  cd jemalloc

  ./configure

  ```


  接下来，通过运行以下命令进行安装：


  ```

  make

  make install

  ```


  成功安装 `jemalloc` 后，我们需要在 `cassandra-env.sh` 中为 Cassandra 配置已安装的库：


  ```

  export JEMALLOC_HOME= jemalloc/

  export LD_LIBRARY_PATH=<JEMALLOC_HOME>/lib/

  JVM_OPTS="$JVM_OPTS -Djava.library.path=<JEMALLOC_HOME>/lib/"

  ```


  #### 垃圾回收


  Cassandra 会执行显式垃圾回收，可以通过监控服务器日志中的 `GCInspector` 类获取更多信息。你也可以选择使用 `XX:+DisableExplicitGC`
  禁用显式垃圾回收，但建议仅用于实验目的。或者，配置 `gcInterval` 设置也是一个选项（`sun.rmi.dgc.server.gcInterval`
  和 `sun.rmi.dgc.client.gcInterval`）。它表示 Java 运行时 RMI（远程方法调用）为回收未使用和软引用对象而调用垃圾回收的最大时间间隔（以毫秒为单位）。默认设置为
  1 小时。


  我们可以在 `$CASSANDRA_HOME/conf` 文件夹中的 `cassandra-env.sh` 文件中调整垃圾回收设置。部分选项如下：


  ```

  # GC 日志选项 -- 取消注释以启用

  JVM_OPTS="$JVM_OPTS -XX:+PrintGCDetails"

  JVM_OPTS="$JVM_OPTS -XX:+PrintGCDateStamps"

  JVM_OPTS="$JVM_OPTS -XX:+PrintHeapAtGC"

  JVM_OPTS="$JVM_OPTS -XX:+PrintTenuringDistribution"

  JVM_OPTS="$JVM_OPTS -XX:+PrintGCApplicationStoppedTime"

  JVM_OPTS="$JVM_OPTS -XX:+PrintPromotionFailure"

  JVM_OPTS="$JVM_OPTS -XX:PrintFLSStatistics=1"

  JVM_OPTS="$JVM_OPTS -Xloggc:/var/log/cassandra/gc-`date +%s`.log"

  # 如果你使用 JDK 6u34 7u2 或更高版本，可以启用 GC 日志轮转

  # 如果启用了轮转，不要在日志名称中嵌入日期。

  JVM_OPTS="$JVM_OPTS -Xloggc:/var/log/cassandra/gc.log"

  JVM_OPTS="$JVM_OPTS -XX:+UseGCLogFileRotation"

  JVM_OPTS="$JVM_OPTS -XX:NumberOfGCLogFiles=10"

  JVM_OPTS="$JVM_OPTS -XX:GCLogFileSize=10M"

  ```




