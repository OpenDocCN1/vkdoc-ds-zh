  \n图 1-11. 配置安全组设置\n\n修改安全组以启用 `9160`、`7000` 和 `7199` 端口，如图 1-11 所示。\n\n![A978-1-4842-0142-8_1_Fig10_HTML.jpg](img/A978-1-4842-0142-8_1_Fig10_HTML.jpg)\n\
