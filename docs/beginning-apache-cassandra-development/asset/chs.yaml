  和 [`www.datastax.com/documentation/getting_started/doc/developer/devcenter/usingDevCenter.html`](http://www.datastax.com/documentation/getting_started/doc/developer/devcenter/usingDevCenter.html)，可供参考。这些都是商业产品，因此部分功能可能仅在企业版中提供。社区版可免费下载，但仅限有限用途。有关许可模式的更多详细信息，请访问
  [`www.datastax.com/download/dse-vs-dsc`](http://www.datastax.com/download/dse-vs-dsc)
  和 [`www.datastax.com/developer-license-terms`](http://www.datastax.com/developer-license-terms)。


  ### 总结


  在本章中，我们讨论了可用于 Cassandra 监控和数据操作的各种工具。本章还涵盖了数据备份和恢复的基础知识，以及管理集群中的节点。下一章将讨论各种 Cassandra
  实用程序以及使用 YCSB 进行基准测试。


  '
- "# 10. Cassandra 实用程序\n\n到目前为止，本书已经涵盖了 Cassandra 的几乎所有方面，包括数据建模、图数据库、批处理分析、性能调优以及分析各种开源和商业工具。随着本书接近尾声，另一个值得讨论的领域是各种内置实用程序，它们对于数据库管理、压力测试或执行数据迁移或批量加载非常有用。\n\
  \n其中一些主题已在本书中讨论过。例如，第 8 章 描述了基于命令行的压力测试工具，第 1 章 描述了用于令牌分配的令牌生成器，以及第 3、4 和 5 章中描述的几个\
  \ `nodetool` 选项。\n\n在本章中，我们将专门讨论更多 Cassandra 实用程序，包括：\n\n*   nodetool 实用程序\n*  \
  \ sstable2json 和 json2sstable\n*   Cassandra 批量加载（使用 CQL3 集合）\n\n\n\n### Cassandra\
  \ nodetool 工具\n\nCassandra 提供了许多操作，例如令牌分配、环管理、模式管理、节点管理与监控等。Cassandra 的 `nodetool`\
  \ 工具是一个命令行界面，它通过简单的命令封装了所有这些操作。在本节中，我们将详细探讨其中一些命令。\n\n`nodetool` 工具是 Cassandra 发行版内置的（位于\
  \ `$CASSANDRA_HOME/bin` 文件夹中）。\n\n在介绍命令之前，我们先打印一下 `nodetool` 的版本：\n\n```\nvivek@vivek-Vostro-3560:∼/software/apache-cassandra-2.0.4/bin$./nodetool\
  \ version\n```\n\n```\nReleaseVersion: 2.0.4\n```\n\n上述命令的输出显示 `nodetool` 的发布版本为\
  \ 2.0.4。\n\n要打印此工具的所有可用命令，只需运行以下命令：\n\n```\nvivek@vivek-Vostro-3560:∼/software/apache-cassandra-2.0.4/bin$./nodetool\n\
  ```\n\n让我们从 Cassandra 环管理开始讨论 `nodetool` 工具命令。\n\n#### 环管理\n\nCassandra 环由多个数据节点组成。从环管理的角度来看，两个重要的操作是：\n\
  \n- 检查环状态\n- 退役一个死节点\n\n##### 检查环状态\n\n在第 1 章的“单机配置多节点”部分，我们讨论了如何在本机启动一个 Cassandra\
  \ 集群。有关在单机上启动 Cassandra 集群的信息，请参考第 1 章。一旦集群启动，我们可以像这样打印 Cassandra 集群环的信息：\n\n```\n\
  vivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool ring\n```\n\
  \n运行上述命令会在控制台打印以下输出：\n\n```\nDatacenter: datacenter1\n==========\nAddress      Rack\
  \      Status  State    Load         Owns           Token\n127.0.0.4    rack1  \
  \   Up      Normal   77.55 KB     66.67%         -3074457345618258604\n127.0.0.1\
  \    rack1     Up      Normal   35.79 KB     66.67%         -9223372036854775808\n\
  127.0.0.2    rack1     Up      Normal   45.05 KB     33.33%         -3074457345618258603\n\
  127.0.0.3    rack1     Up      Normal   61.28 KB     33.33%          3074457345618258602\n\
  ```\n\n在这里，`ring` 命令打印每个节点的状态以及每个 Cassandra 节点分配的令牌。输出显示了数据节点的 IP 地址、状态和机架信息：\n\n\
  - `Address` 列显示节点的 URL 或 IP 地址。\n- `Rack` 列包含机架信息。\n- 如果节点是活动的并且是集群环的一部分，其状态为 `Up`；否则为\
  \ `Down`。\n- `State` 的可能的值为 `Normal`、`Leaving`、`Joining` 和 `Moving`。\n  - 如果数据节点是集群环的一部分，它将显示为\
  \ `Normal` 状态。\n  - 如果一个节点正在退役，它将处于 `Leaving` 的中间状态。\n  - 如果节点已被移动到另一个令牌值，状态将为 `Moving`。\n\
  \  - `Load` 列显示每个节点当前的数据负载。从管理角度来看，此信息很重要，因为负载和所有权（`Owns` 列）信息可以显示环是否处于平衡状态。\n \
  \ - `Token` 列显示分配的令牌，这是一个令牌范围。\n\n要获取关于 Cassandra 集群的更多信息，如当前状态、负载和分配的令牌，我们可以运行\
  \ `status` 命令：\n\n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool\
  \ status\n```\n\n运行此命令会打印出如下输出所示的数据：\n\n```\nDatacenter: datacenter1\n=======================\n\
  Status=Up(U)/Down(D)\n|/ State=Normal(N)/Leaving(L)/Joining(J)/Moving(M)\nStatus/\
  \  Address    Load      Tokens  Owns         Host ID                           \
  \    Rack\nState                                 (effective)\nUN       127.0.0.1\
  \  59.82 KB  129     166.7%       718d384e-c8c2-4355-bf9b-1bfa60be2d99  Rack1\n\
  UN       127.0.0.2  66.54 KB  256     166.7%       cb9da211-6948-4c21-b5f5-5ee660cd9355\
  \  Rack1\nUN       127.0.0.3  50.31 KB  256      66.7%       74ee5df6-d990-4deb-9144-501c349308d6\
  \  Rack1\n```\n\n上面的输出与本节中的第一个输出示例类似。唯一的区别是 `Tokens` 和 `Host ID` 字段。这里的 `Tokens`\
  \ 列显示为每个节点设置的令牌数量，而 `Host ID` 是数据节点的网络 ID。这是一个由 Cassandra 为每个节点分配的 UUID 值。\n\n这就是我们监控集群环状态及其信息的方式。在下一节中，我们将讨论如何退役一个活动的数据节点。\n\
  \n\n\n##### 节点退役\n\n我们也可以使用 `nodetool` 工具来退役一个节点。在本练习中，我们将通过命令行来退役一个节点，然后通过检查集群环状态来验证它是否已退役。\n\
  \n假设所有三个节点都已启动并运行（参见上一节中显示的输出），让我们使用 `cql` 命令行界面创建一个键空间 `twitter_keyspace` 和表 `twitter`：\n\
  \n```sql\ncqlsh> create keyspace twitter_keyspace with replication = {'class':'SimpleStrategy',\
  \ 'replication_factor':3};\ncqlsh> use twitter_keyspace;\ncqlsh:twitter_keyspace>\
  \ create table twitter(tweeted_at text, screen_name text, body text, PRIMARY KEY\
  \ (tweeted_at,screen_name));\n```\n\n让我们使用以下命令将数据加载到 `twitter` 表中：\n\n```sql\ncqlsh:twitter_keyspace>\
  \ copy twitter(tweeted_at,screen_name,body) from '/home/vivek/tweets_pipe' WITH\
  \ DELIMITER = '|';\n10020 rows imported in 12.457 seconds.\n```\n\n这里的 `/home/vivek/tweets_pipe`\
  \ 是一个本地文件，其中所有列值都使用 “|” 作为字段分隔符。你可以从本书的下载文件中找到这个文件，也可以使用以下数据和格式创建示例：\n\n```\n2014-08-02|mevivs|Working\
  \ on Cassandra book\n2014-08-04|chris_nelson|Cassandra book review in progress\n\
  ```\n\n现在，让我们使用 `nodetool` 工具的命令来尝试退役 IP 地址为 `127.0.0.1` 的节点：\n\n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node1$\
  \ bin/nodetool decommission\n```\n\n请注意，我们只能退役一个活跃的节点。退役节点会隐式启动数据流式传输到另一个节点。我们可以使用以下命令监控退役过程：\n\
  \n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool\
  \ netstats\n```\n\n它会显示以下输出：\n\n```\nMode: LEAVING\nNot sending any streams.\nRead\
  \ Repair Statistics:\nAttempted: 0\nMismatch (Blocking): 0\nMismatch (Background):\
  \ 0\nPool Name                    Active   Pending      Completed\nCommands    \
  \                    n/a         0          20048\nResponses                   \
  \    n/a         0           4806\n```\n\n输出意味着该节点仍在处理中，并处于 `LEAVING` 状态。这里的 `Attempted`\
  \ 表示读修复的尝试次数。`Mismatch (Blocking)` 和 `Mismatch (Background)` 分别指自服务器重启以来，因阻塞查询和后台服务器重启而执行的读修复次数。这里的\
  \ `Commands` 保存了读/写操作数量的信息，而 `Responses` 保存了客户端读/写请求所收到响应数量的信息。\n\n在此期间，如果我们检查集群状态，它会显示如下命令后的输出：\n\
  \n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool\
  \ status\nDatacenter: datacenter1\n=======================\nStatus=Up(U)/Down(D)\n\
  |/ State=Normal(N)/Leaving(L)/Joining(J)/Moving(M)\nStatus/  Address    Load   \
  \   Tokens  Owns         Host ID                               Rack\nState     \
  \                            (effective)\nUL       127.0.0.1  59.82 KB  129    \
  \ 166.7%       718d384e-c8c2-4355-bf9b-1bfa60be2d99  Rack1\nUN       127.0.0.2 \
  \ 66.54 KB  256     166.7%       cb9da211-6948-4c21-b5f5-5ee660cd9355  Rack1\nUN\
  \       127.0.0.3  50.31 KB  256     66.7%        74ee5df6-d990-4deb-9144-501c349308d6\
  \  Rack1\n```\n\n一旦节点退役完成，你可以使用以下命令进行验证，输出将如下所示：\n\n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node1$\
  \ bin/nodetool netstats\nMode: DECOMMISSIONED\nNot sending any streams.\nRead Repair\
  \ Statistics:\nAttempted: 0\nMismatch (Blocking): 0\nMismatch (Background): 0\n\
  Pool Name                    Active   Pending      Completed\nCommands         \
  \               n/a         0          20048\nResponses                       n/a\
  \         0           4808\n```\n\n在这里你可以看到模式现在是 `DECOMMISSIONED`。\n\n一旦节点退役，我们可以使用命令进行验证。\n\
  \n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool\
  \ status\nDatacenter: datacenter1\n=======================\nStatus=Up(U)/Down(D)\n\
  |/ State=Normal(N)/Leaving(L)/Joining(J)/Moving(M)\nStatus/  Address    Load   \
  \   Tokens  Owns         Host ID                               Rack\nState     \
  \                            (effective)\nUN       127.0.0.2  66.54 KB  256    \
  \ 100%         cb9da211-6948-4c21-b5f5-5ee660cd9355  Rack1\nUN       127.0.0.3 \
  \ 50.31 KB  256     100%         74ee5df6-d990-4deb-9144-501c349308d6  Rack1\n```\n\
  \n#### 架构管理\n\n架构管理意味着分析键空间和表、执行修复、重建或清理数据，以及进行各种其他活动。使用 `nodetool` 工具，这些操作可以通过简单的命令形式实现。使用它们，我们可以轻松管理架构级别的操作。让我们通过简单的示例来讨论一些比较重要的操作。\n\
  \n##### cfstats\n\n使用该命令，我们可以收集关于键空间及其表的统计信息。这对于监控读/写延迟、压缩和内存表相关信息非常有用。\n\n我们可以像这样收集某个键空间的信息：\n\
  \n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool\
  \ cfstats twitter_keyspace\n```\n\n这里的 `twitter_keyspace` 是键空间名称。\n\n我们也可以收集多个键空间的统计信息：\n\
  \n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool\
  \ cfstats keyspace1 keyspace2\n```\n\n这里的 `keyspace1` 和 `keyspace2` 就是这些键空间。\n\n\
  此外，我们可以捕获特定表的统计信息：\n\n```bash\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$\
  \ bin/nodetool cfstats twitter_keyspace.twiiter\n```\n\n这里，`twitter_keyspace` 是键空间，`twitter`\
  \ 是表。\n\n以下是对 `twitter` 表运行 `cfstats` 命令的输出：\n\n```\nKeyspace: twitter_keyspace\n\
  Read Count: 0\nRead Latency: NaN ms.\nWrite Count: 1\nWrite Latency: 1.314 ms.\n\
  Pending Tasks: 0\nTable: twitter\nSSTable count: 0\nSpace used (live), bytes: 0\n\
  Space used (total), bytes: 0\nSSTable Compression Ratio: 0.0\nNumber of keys (estimate):\
  \ 0\nMemtable cell count: 3\nMemtable data size, bytes: 590\nMemtable switch count:\
  \ 0\nLocal read count: 0\nLocal read latency: NaN ms\nLocal write count: 1\nLocal\
  \ write latency: 1.314 ms\nPending tasks: 0\nBloom filter false positives: 0\nBloom\
  \ filter false ratio: 0.00000\nBloom filter space used, bytes: 0\nCompacted partition\
  \ minimum bytes: 0\nCompacted partition maximum bytes: 0\nCompacted partition mean\
  \ bytes: 0\nAverage live cells per slice (last five minutes): 0.0\nAverage tombstones\
  \ per slice (last five minutes): 0.0\n```\n\n\n\n##### cfhistogram\n\n`cfhistogram`命令提供关于读写延迟（微秒）以及读写期间涉及的\
  \ SSTable 数量的统计信息。以下命令显示了`twitter_keyspace`键空间中`twitter`表的列族直方图输出：\n\n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$\
  \ bin/nodetool cfhistograms twitter_keyspace twiiter\n```\n\n```\ntwitter_keyspace/twiiter\
  \ histograms\n\nOffset      SSTables     Write     Read Latency    Partition  Cell\
  \ Count\nLatency                   size\n(micros)  (micros)        (bytes)\n1  \
  \                0            0             0            0           0\n2      \
  \            0            0             0            0           0\n3          \
  \      234            0             0            0           0\n4              \
  \    0            0             0            0           0\n5                  0\
  \            0             0            0           0\n6                  0    \
  \        0             0            0           0\n7                  0        \
  \    0             0            0           0\n8                  0            0\
  \             0            0           0\n10                 0            0    \
  \         0            0           0\n12                 0            0        \
  \     0            0           0\n14                 0            0            \
  \ 0            0           0\n17                 0            0             0  \
  \          0           0\n20                 0            0             0      \
  \      0           0\n24                 0            0             0          \
  \  0           0\n29                 0          127            86            0 \
  \          0\n35                 0          149             0            0     \
  \      0\n42                 0            0             0            0         \
  \  0\n50                 0            0             0            0           0\n\
  60                 0            0             0            0           0\n```\n\n\
  这里，输出表的第三行显示，为了服务 234 个读取请求，总共执行了 3 次 SSTable 查找。`SSTables`列中的值表示读取请求的数量。此外，偏移量为\
  \ 29 的行表示，86 个读取请求和 127 个写入请求的读取延迟在 24 到 29 微秒之间，而 149 个写入请求的写入延迟在 29 到 35 微秒之间。\n\
  \n当我们需要分析表在高读写负载下的性能时，这个功能非常有用。\n\n##### cleanup\n\n我们可以运行`cleanup`命令来清理与数据节点无关或不属于该节点的键空间和分区键。\n\
  \n通常，我们在向集群添加新节点后执行此命令以删除数据。每当新节点加入环时，使用`cleanup`命令可以移除与集群无关的过时数据。此外，当节点在从集群环中退役或移除后重新变为活动状态时，我们也会执行此命令。我们可以这样运行该命令：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$bin/nodetool cleanup\
  \ twitter_keyspace twiiter\n```\n\n这里，我们对`twitter_keyspace`键空间的`twitter`表执行清理。请注意，如果未指定键空间，它将清理所有可用的键空间。此外，我们可以通过提供表名列表来清理键空间中的多个表：\n\
  \n```\nnodetool cleanup  <keyspace><table1><table2>\n```\n\n##### clearsnapshot\n\
  \n快照目录通常用于备份和恢复过程。当键空间的快照目录不再需要时，我们可以使用`clearsnapshot`命令清除它们：\n\n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$\
  \ bin/nodetool clearsnapshot twitter_keyspace\n```\n\n运行上述命令将删除`twitter_keyspace`键空间的所有快照目录。我们还可以使用`-f`选项删除特定的快照目录，如下所示：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool clearsnapshot\
  \ twitter_keyspace –f 1412341689\n```\n\n通常，清除快照是备份过程的一部分，定期备份和删除快照目录会被安排为后台的`cron`作业。`cron`作业是一种基于时间的调度器，可以作为备份过程的组件进行设置。\n\
  \n注意\n\n有关数据备份和恢复的更多信息，请参考第 9 章中的“数据备份和恢复”一节。\n\n##### flush\n\nmemtable 是一个数据行缓存，可以用于查找特定的行键和数据。memtable\
  \ 的隐式刷新由 Cassandra 根据`cassandra.yaml`中定义的 memtable 阈值和吞吐量配置自动处理。使用`nodetool flush`命令，我们可以显式地刷新特定数据节点上的数据。显式刷新的原因包括：\n\
  \n*   节点空间不足，需要在服务器端释放一些空间。\n*   正在进行数据备份，可能需要使用 SSTable 加载器在另一个节点上恢复数据。\n*   需要将数据刷新到磁盘，以减少节点重启期间的提交日志重放。\n\
  \n使用`nodetool flush`命令显式地将 memtable 刷新到磁盘，如下所示：\n\n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$\
  \ bin/nodetool flush twitter_keyspace twitter\n```\n\n运行上述命令将显式地将数据从 memtable 刷新并写入到`twitter_keyspace`键空间和`twitter`表的磁盘中。\n\
  \n##### repair\n\n通常，在以下情况下需要修复集群节点：\n\n*   一个或多个节点处于恢复模式。\n*   其中一个 Cassandra 节点未参与读取操作。\n\
  *   正在添加节点，并且需要手动更新该节点上的数据。\n\n理想情况下，建议定期执行修复，以保持集群的一致性和平衡状态。\n\n我们可以按如下方式运行`repair`命令：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool repair\
  \ –dc DC1\n```\n\n运行上述命令将在数据中心`DC1`的多个节点上触发修复过程。请注意，修复是一个内存密集型过程，需要执行磁盘 I/O 以在副本节点之间复制快照。我们也可以使用`–pr`选项并行执行修复过程，该选项会启动跨副本节点的修复过程，从而减少停机时间。我们还可以将修复过程限制为仅针对本地数据中心的节点，如下所示：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool repair\
  \ –local\n```\n\n##### rebuild\n\n当我们在 Cassandra 集群中添加新的数据中心并需要将数据从一个数据中心复制到新添加的数据中心时，执行`rebuild`命令。执行此命令的方式如下：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool rebuild\
  \ - - DC2\n```\n\n这里，`DC2`是一个新的数据中心。请确保包含新添加的数据中心，否则命令将成功执行，但不会发生数据复制。\n\n\n\n####\
  \ `rebuild_index`\n\n在第 2 章中，我们讨论过，在模式变更期间（最常见的是在 Thrift 和 CQL3 交换期间），模式与二级索引很可能会损坏。我们可以使用`rebuild_index`命令重建这些索引：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool rebuild_index\
  \ twitter_keyspace twitter\n```\n\n运行上述命令会对`twitter_keyspace`键空间中`twitter`表的所有索引进行完整的重建。我们也可以按照如下方式重建特定索引：\n\
  \n```\nvivek@vivek-Vostro-3560:∼/software/local-cluster/node4$ bin/nodetool rebuild_index\
  \ twitter_keyspace twitter  screenname_idx\n```\n\n这里`screenname_idx`是列`screen_name`上的索引。\n\
  \n重建索引不会删除索引，而是会使用该节点上的现有数据对其进行重建。`nodetool`工具还提供了许多其他命令选项。这里主要介绍了从数据管理备份角度来看最重要的几个。在接下来的章节中，我们还将讨论`refresh`、`repair`和`sstablescrub`命令。\n\
  \n### JSON 化数据\n\n自诞生以来，Cassandra 发行版就附带了一些工具，用于将 JSON 格式数据导入 SSTable，以及将 SSTable\
  \ 数据导出为 JSON 文件。这些工具最初是为调试目的而构建的，但当我们需要在节点间迁移数据时，它们也非常有用。\n\nCassandra 发行版附带的两个工具是`sstabl2json`和`json2sstable`。我们可以在`$CASSANDRA_HOME/bin`文件夹中找到它们。下面让我们来探索一下这两个工具！\n\
  \n### 使用`sstable2json`将数据导出到 JSON 文件\n\n使用`sstabl2json`命令，我们可以将磁盘上的 SSTable 数据导出为\
  \ JSON 文件。让我们通过以下练习来探索它：\n\n首先，使用 CQL shell 创建模式并填充数据。我们将创建一个键空间`twitterkeyspace`和一个表`user`：\n\
  \n```\ncreate keyspace twitterkeyspace with replication = {'class':'SimpleStrategy','replication_factor':3};\n\
  ```\n\n```\nuse twitterkeyspace;\n```\n\n```\ncreate table user(user_id timeuuid\
  \ primary key, fname text, lname text);\n```\n\n让我们插入几条记录：\n\n```\ninsert into user(user_id,fname,lname)\
  \ values(now(),'vivek','mishra');\ninsert into user(user_id,fname,lname) values(now(),'Melissa','Maldonado');\n\
  insert into user(user_id,fname,lname) values(now(),'Chris','Nelson');\ninsert into\
  \ user(user_id,fname,lname) values(now(),'Brian','Neill');\n```\n\n查询所有数据：\n\n```\n\
  select * from user;\n```\n\n输出结果如下：\n\n```\nuser_id                            \
  \  | fname   | lname\n--------------------------------------+---------+-----------\n\
  849d5820-50e3-11e4-abc1-3f484de45426 |   Brian |     Neill\n74ac3a80-50e3-11e4-abc1-3f484de45426\
  \ | Melissa | Maldonado\n7c34a260-50e3-11e4-abc1-3f484de45426 |   Chris |    Nelson\n\
  f7d1f2c0-50e2-11e4-abc1-3f484de45426 |   vivek |    mishra\n```\n\n接下来，使用`nodetool\
  \ flush`将这些数据刷写到 SSTable 中：\n\n```\n$CASSANDRA_HOME/bin/nodetool flush\n```\n\n\
  最后，使用`sstable2json`将数据导出到 JSON 文件：\n\n```\n$CASSANDRA_HOME/bin/sstable2json /var/lib/cassandra/data/twitterkeyspace/user/twitterkeyspace-user-jb-1-Data.db\
  \ > output.json\n```\n\n这里`twitterkeyspace-user-jb-1-Data.db`是`data`目录下的一个`.db`数据文件（本例中位于`/var/lib/Cassandra`下）。上述命令将创建一个\
  \ JSON 文件，其中的数据如图 10-1 所示。\n\n![A978-1-4842-0142-8_10_Fig1_HTML.jpg](img/A978-1-4842-0142-8_10_Fig1_HTML.jpg)\n\
  \n图 10-1 输出文件`output.json`中的数据\n\n我们还可以分别使用`-k`和`-x`选项来包含和排除特定行。使用`-k`选项时，键必须采用十六进制格式。由于`user`表的主键是`timeuuid`类型，因此我们首先使用`timeuuidAsBlob`函数获取十六进制格式的键值，如下所示：\n\
  \n```\nselect timeuuidAsBlob(user_id), fname from user;\n```\n\n输出结果如下：\n\n```\n\
  timeuuidAsBlob(user_id)                 | fname\n-----------------------------------------+---------\n\
  0x849d582050e311e4abc13f484de45426      |   Brian\n0x74ac3a8050e311e4abc13f484de45426\
  \      | Melissa\n0x7c34a26050e311e4abc13f484de45426      |   Chris\n0xf7d1f2c050e211e4abc13f484de45426\
  \      |   vivek\n(4 rows)\n```\n\n这里`timeuuidAsBlob(user_id)`是以十六进制格式表示的`user_id`键。现在，我们可以使用`-k`选项获取`fname`为`brian`和`vivek`的行：\n\
  \n```\n$CASSANDRA_HOME/bin/sstable2json /var/lib/cassandra/data/twitterkeyspace/user/twitterkeyspace-user-jb-1-Data.db\
  \ -k 849d582050e311e4abc13f484de45426 f7d1f2c050e211e4abc13f484de45426\n```\n\n\
  输出结果为：\n\n```\n[\n{\"key\": \"849d582050e311e4abc13f484de45426\",\"columns\": [[\"\
  \",\"\",1412989884066000], [\"fname\",\"Brian\",1412989884066000], [\"lname\",\"\
  Neill\",1412989884066000]]},\n{\"key\": \"f7d1f2c050e211e4abc13f484de45426\",\"\
  columns\": [[\"\",\"\",1412989647852000], [\"fname\",\"vivek\",1412989647852000],\
  \ [\"lname\",\"mishra\",1412989647852000]]}\n]\n```\n\n`849d582050e311e4abc13f484de45426`和`f7d1f2c050e211e4abc13f484de45426`分别是`brian`和`vivek`的用户\
  \ ID。\n\n类似地，我们可以使用`-x`选项排除特定键：\n\n```\n$CASSANDRA_HOME/bin/sstable2json /var/lib/cassandra/data/twitterkeyspace/user/twitterkeyspace-user-jb-1-Data.db\
  \ -x 849d582050e311e4abc13f484de45426 f7d1f2c050e211e4abc13f484de45426\n```\n\n\
  输出结果为：\n\n```\n[\n{\"key\": \"74ac3a8050e311e4abc13f484de45426\",\"columns\": [[\"\
  \",\"\",1412989857319000], [\"fname\",\"Melissa\",1412989857319000], [\"lname\"\
  ,\"Maldonado\",1412989857319000]]},\n{\"key\": \"7c34a26050e311e4abc13f484de45426\"\
  ,\"columns\": [[\"\",\"\",1412989869958000], [\"fname\",\"Chris\",1412989869958000],\
  \ [\"lname\",\"Nelson\",1412989869958000]]}\n]\n```\n\n\n\n### 使用 `json2sstable`\
  \ 导入 JSON 数据\n\n同样地，我们可以通过几个简单的步骤，使用 `json2sstable` 将 JSON 数据重新导入到 sstable 中：\n\n\
  首先，通过 cql shell 在键空间 `twitterkeyspace` 下创建一张表 `dumpuser`：\n\n```\nuse twitterkeyspace;\n\
  create table dumpuser(user_id timeuuid primary key, fname text,lname text);\n```\n\
  \n接着，使用 `json2sstable` 将 `output.json` 中的数据导入到 `dumpuser` 表中：\n\n```\n$CASSANDRA_HOME/bin/json2sstable\
  \ -K twitterkeyspace -c dumpuser output.json /var/lib/cassandra/data/twitterkeyspace/dumpuser/twitterkeyspace-dumpuser-jb-1-Data.db\n\
  Importing 4 keys...\n4 keys imported successfully.\n```\n\n然后，使用 `nodetool refresh`\
  \ 命令刷新新加载的 sstable：\n\n```\n$CASSANDRA_HOME/bin/nodetool refresh twitterkeyspace\
  \ dumpuser\n```\n\n`nodetool refresh` 可在不重启节点的情况下使数据可用。\n\n现在，我们可以通过 cql shell 对表\
  \ `dumpuser` 运行 `select` 命令来验证加载的数据：\n\n```\ncqlsh:twitterkeyspace> select * from\
  \ dumpuser;\n\nuser_id                              | fname   | lname\n--------------------------------------+---------+-----------\n\
  849d5820-50e3-11e4-abc1-3f484de45426 |   Brian |     Neill\n74ac3a80-50e3-11e4-abc1-3f484de45426\
  \ | Melissa | Maldonado\n7c34a260-50e3-11e4-abc1-3f484de45426 |   Chris |    Nelson\n\
  f7d1f2c0-50e2-11e4-abc1-3f484de45426 |   vivek |    mishra\n\n(4 rows)\n```\n\n\
  这里有一个建议：避免对同一张表多次使用 `json2sstable` 加载数据到 sstable，因为这可能导致 sstable 处于损坏状态。你可以在 `server.log`（位于\
  \ `log` 目录下）中检查以下错误：\n\n```\nCaused by: org.apache.cassandra.io.compress.CorruptBlockException:\
  \ (/var/lib/cassandra/data/twitterkeyspace/dumpuser/twitterkeyspace-dumpuser-jb-1-Data.db):\
  \ corruption detected, chunk at 0 of length 210.\nat org.apache.cassandra.io.compress.CompressedRandomAccessReader.decompressChunk\n\
  (CompressedRandomAccessReader.java:122)\nat org.apache.cassandra.io.compress.CompressedRandomAccessReader.reBuffer\n\
  (CompressedRandomAccessReader.java:87)\n... 26 more\n```\n\n尝试使用 cql shell 从损坏的表中（此处为\
  \ `dumpuser` 表）获取数据会产生以下输出：\n\n```\ncqlsh:twitterkeyspace> select * from dumpuser;\n\
  Request did not complete within rpc_timeout.\n```\n\n在这种情况下，清理并移除损坏的数据是我们唯一的选择。\n\
  \nCassandra 发行版附带了 `sstablescrub` 工具，我们将在以下步骤中使用它：\n\n```\n$CASSANDRA_HOME/bin/sstablescrub\
  \ twitterkeyspace dumpuser\n```\n\n运行上述命令将产生以下输出：\n\n```\nPre-scrub sstables snapshotted\
  \ into snapshot pre-scrub-1412993550669\nScrubbing SSTableReader(path='/var/lib/cassandra/data/twitterkeyspace/dumpuser/twitterkeyspace-dumpuser-jb-1-Data.db')\
  \ (218 bytes)\nError scrubbing SSTableReader(path='/var/lib/cassandra/data/twitterkeyspace/dumpuser/\n\
  twitterkeyspace-dumpuser-jb-1-Data.db'): null\n```\n\n作为预处理步骤，在运行 `repair` 命令之前最好先进行备份。首先为备份创建一个快照目录。如上述输出所示，清理\
  \ `.db` 文件时发生了错误；因此，我们需要手动删除 `/twitterkeyspace-dumpuser-jb-1-Data.db`，并从快照目录中恢复其余数据。关于如何从快照目录恢复数据，请参考第\
  \ 9 章的“数据备份与恢复”部分。此外，我们还需要运行 `nodetool repair` 命令来恢复表：\n\n```\n$CASSANDRA_HOME/bin/nodetool\
  \ repair twitterkeyspace dumpuser\n```\n\n至此，我们了解了如何将 JSON 数据导入到 sstable 中以及如何将数据导出为\
  \ JSON 文件，同时也了解了如何处理损坏的 sstable。\n\n目前，社区正在讨论是否要弃用或替换这些工具。你可以参考 [`https://issues.apache.org/jira/browse/CASSANDRA-7464`](https://issues.apache.org/jira/browse/CASSANDRA-7464)\
  \ 了解更多详情。\n\n\n\n### Cassandra 批量加载\n\n在“节点退役”一节中，我们看到使用 `COPY` 命令可以将数据从 `.csv`\
  \ 文件复制到表中。在 CQL3 出现之前，Cassandra 的早期版本附带了一个名为 `sstableloader` 的工具，可用于直接将 `.db` 文件加载到\
  \ SSTable 中。我们只需要使用 `SSTableWriter` API 编写一个实现来生成 `.db` 文件。可以从 [`www.datastax.com/wp-content/uploads/2011/08/DataImportExample.java`](http://www.datastax.com/wp-content/uploads/2011/08/DataImportExample.java)\
  \ 下载一个基于 Thrift 的实现。然而，自 CQL3 起，CQL3 二进制协议将成为未来 Cassandra 开发的活动协议，并且请注意，对 Thrift\
  \ 的支持已停止。\n\n这里我分享一个兼容 CQL3 的实现，用于为 CQL3 表生成 `.db` 文件。这是上述共享 URL 中实现的扩展版本。\n\n在本示例中，我们将创建一个包含集合类型列的表。让我们开始吧！\n\
  \n首先，我们需要创建键空间和表：\n\n```cql\ncreate keyspace \"Cql3Demo\" with replication = { 'class'\
  \ : 'SimpleStrategy', 'replication_factor':3};\nuse \"Cql3Demo\";\ncreate table\
  \ \"Users\"(user_id uuid PRIMARY KEY,firstname text,lastname text, password text,email\
  \ text, age int, addresses set<text>);\n```\n\n创建一个包含用户 ID、名字、姓氏、密码、电子邮件地址和年龄的 `CSVInput.csv`\
  \ 文件，内容如下：\n\n```\n5bd8c586-ae44-11e0-97b8-0026b0ea8cd0,vivek,mishra,4Jc2s,22,vivek.mishra@nomail.com\n\
  4bd8cb58-ae44-12e0-a2b8-0026b0ed9cd1,apress,bigdata,s!a0ml,12,bigdata@nomail.com\n\
  1ce7cb58-ae44-12e0-a2b8-0026b0ad21ab,Brian,Neil,s)3B3,12,brian.neil@nomail.com\n\
  ```\n\n现在，让我们看一下实现。这是一个基于 Maven 的项目，需要在 `pom.xml` 中添加以下依赖：\n\n```xml\n<dependency>\n\
  \    <groupId>org.apache.cassandra</groupId>\n    <artifactId>cassandra-all</artifactId>\n\
  \    <version>2.0.4</version>\n</dependency>\n<dependency>\n    <groupId>org.apache.cassandra</groupId>\n\
  \    <artifactId>cassandra-clientutil</artifactId>\n    <version>2.0.4</version>\n\
  </dependency>\n```\n\n现在，让我们看一下 Java 实现：\n\n```java\nif (args.length == 0) {\n \
  \   filename = \"CSVInput.csv\";\n} else {\n    filename = args[0];\n}\n\nBufferedReader\
  \ reader = new BufferedReader(new FileReader(filename));\nString keyspace = \"Cql3Demo\"\
  ;\nString columnFamily = \"Users\";\n\n// create cassandra type structure default\
  \ is data/KEYSPACE/users\nFile directory = new File(\"data\");\nif (!directory.exists())\
  \ {\n    directory.mkdir();\n}\ndirectory = new File(directory.getPath() + \"/\"\
  \ + keyspace);\nif (!directory.exists())\n    directory.mkdir();\ndirectory = new\
  \ File(directory.getPath() + \"/\" + columnFamily);\nif (!directory.exists())\n\
  \    directory.mkdir();\n```\n\n上述代码片段显示，程序将文件名作为输入参数。如果未提供，则使用默认文件（`CSVInput.csv`）。它还会在根文件夹中创建一个数据文件夹（见图\
  \ 10-2）。\n\n接下来，我们需要实例化 `SSTableSimpleUnsortedWriter`：\n\n![A978-1-4842-0142-8_10_Fig2_HTML.jpg](img/A978-1-4842-0142-8_10_Fig2_HTML.jpg)\n\
  \n图 10-2 创建了包含 `.db` 文件的数据文件夹\n\n```java\nSSTableSimpleUnsortedWriter usersWriter\
  \ = new SSTableSimpleUnsortedWriter(directory, new Murmur3Partitioner(),\n    keyspace,\
  \ \"Users\", AsciiType.instance, null, 64, new CompressionParameters(\n    org.apache.cassandra.io.compress.SnappyCompressor.create(Collections.<String,\
  \ String> emptyMap())));\n```\n\n现在，我们需要解析 `CSVInput.csv` 文件中的每条记录：\n\n```java\n\
  static class CsvEntry {\n    UUID key;\n    String firstname;\n    String lastname;\n\
  \    String password;\n    int age;\n    String email;\n\n    boolean parse(String\
  \ line, int lineNumber) {\n        // Ghetto csv parsing\n        String[] columns\
  \ = line.split(\",\");\n        if (columns.length != 6) {\n```\n\n\n```java\nSystem.out.println(String.format(\"\
  Invalid input '%s' at line %d of %s\", line, lineNumber, filename));\nreturn false;\n\
  }\ntry\n{\nkey = UUID.fromString(columns[0].trim());\nfirstname = columns[1].trim();\n\
  lastname = columns[2].trim();\npassword = columns[3].trim();\nage = Integer.parseInt(columns[4].trim());\n\
  email = columns[5].trim();\nreturn true;\n}\ncatch (NumberFormatException e)\n{\n\
  System.out.println(String.format(\"Invalid number in input '%s' at line %d of %s\"\
  , line, lineNumber, filename));\nreturn false;\n}\n}\n}\n```\n\n上述代码段解析并设置每个单元格的值（`firstname`、`lastname`\
  \ 等），并从文件中逐行读取，如下所示：\n\n```java\nCsvEntry entry = new CsvEntry();\nwhile ((line\
  \ = reader.readLine()) != null)\n{\nif (entry.parse(line, lineNumber))\n{\n...\n\
  }\n}\n```\n\n解析完成后，让我们为每个列值准备一个复合类型。由于我们为**主键**、**名字**、**姓氏**和**年龄**定义了 `uuid`、`int`\
  \ 和 `text` 数据类型，我们需要按如下方式定义它们：\n\n```java\nByteBuffer uuid = UUIDType.instance.decompose(entry.key);\n\
  usersWriter.newRow(uuid);\nList types = newArrayList();\ntypes.add(UTF8Type.instance);\n\
  CompositeType compositeType = CompositeType.getInstance(types);\nList numericTypes\
  \ = newArrayList();\nnumericTypes.add(IntegerType.instance);\nCompositeType numericType\
  \ = CompositeType.getInstance(numericTypes);\n```\n\n接下来，让我们赋值：\n\n```java\nlong\
  \ timestamp = System.currentTimeMillis() * 1000;\nusersWriter.addColumn(compositeType.decompose(\"\
  firstname\"), compositeType.decompose(bytes(entry.firstname)), timestamp);\nusersWriter.addColumn(compositeType.decompose(\"\
  lastname\"), compositeType.decompose(bytes(entry.lastname)), timestamp);\nusersWriter.addColumn(compositeType.decompose(\"\
  password\"), compositeType.decompose(bytes(entry.password)), timestamp);\nusersWriter.addColumn(compositeType.decompose(\"\
  age\"), numericType.decompose(bytes(entry.age)), timestamp);\nusersWriter.addColumn(compositeType.decompose(\"\
  email\"), compositeType.decompose(bytes(entry.email)), timestamp);\n```\n\n现在，为了赋值\
  \ `addresses` 集合，我们需要构造并以 `Set` 数据类型赋值：\n\n```java\nSetType<String> addressType\
  \ = newSetType<String>(UTF8Type.instance);\n// 列名\nByteBuffer byteBuffer1 = compositeType.decompose(\"\
  addresses\");\n// 集合值\nByteBuffer byteBuffer2 = compositeType.decompose(\"noida\"\
  );\n```\n\n我们需要创建一个字节缓冲区实例并添加一个列：\n\n```java\nByteBuffer bb = ByteBuffer.allocate(byteBuffer2.capacity()+byteBuffer1.capacity());\n\
  bb.put(byteBuffer1);\nbb.put(byteBuffer2);\nbb.flip();\nusersWriter.addColumn(bb,addressType.decompose(new\
  \ HashSet<String>()),timestamp);\n```\n\n接下来，我们可以保存它：\n\n```java\nusersWriter.close();\n\
  ```\n\n上述命令会在 `data/Cql3Demo/Users` 文件夹下生成文件。\n\n现在，我们需要使用 `sstableloader` 加载生成的\
  \ `.db` 文件：\n\n```bash\n$CASSANDRA_HOME/bin/sstableloader -d localhost data/Cql3Demo/Users/\n\
  ```\n\n我们可以通过使用 CQL 外壳（参见图 10-3）执行 `select` 命令来验证输出。\n\n```sql\nselect * from \"\
  Users\";\n```\n\n我们还可以修改 `Users` 表，并添加一个数据类型为 `map` 的列：\n\n![A978-1-4842-0142-8_10_Fig3_HTML.jpg](img/A978-1-4842-0142-8_10_Fig3_HTML.jpg)\n\
  \n**图 10-3.** 包含三行数据的 Users 表\n\n```sql\nalter table \"Users\" add mapCol map<text,text>;\n\
  ```\n\n我们只需要为 map 添加类型，并像这样将 map 作为一列添加到前面的实现中：\n\n```java\n// map 列名\nbyteBuffer1\
  \ = compositeType.decompose(\"mapcol\");\n// map 列键\nbyteBuffer2 = compositeType.decompose(\"\
  noida\");\nbb = ByteBuffer.allocate(byteBuffer2.capacity()+byteBuffer1.capacity());\n\
  bb.put(byteBuffer1);\nbb.put(byteBuffer2);\nbb.flip();\n// map 值\nusersWriter.addColumn(bb,compositeType.decompose(bytes(\"\
  vivek\")),timestamp);\n```\n\n![A978-1-4842-0142-8_10_Fig4_HTML.jpg](img/A978-1-4842-0142-8_10_Fig4_HTML.jpg)\n\
  \n**图 10-4.** Users 表中包含 map 列的输出\n\n在 `Users` 上执行 `select` 查询将产生图 10-4 所示的输出。\n\
  \n这就是我们如何以 sstable 格式将 `.db` 文件直接批量加载到磁盘上的方法。\n\n### 总结\n\n简要总结一下，在本章中，我们讨论了 `nodetool`\
  \ 工具的用法以及用于环和架构管理的各种操作。我们还讨论了如何以 JSON 格式导入和导出数据。最后，我们讨论了批量加载 CQL3 格式数据（包括集合）的方法。\n\
  \n在下一章（也是最后一章）中，我们将总结我们的讨论，并讨论 Cassandra 版本升级以及各大论坛中其他热门话题。\n\n"
- "# 11. 升级 Cassandra 与故障排除\n\n到目前为止，本书讨论的主题包括配置、批量分析、数据建模技术、性能调优以及各种实用工具。还有一个重要主题尚未讨论：Cassandra\
  \ 版本升级。在过去的一年半中，Cassandra 发展迅速并发布了多个版本。近期版本中引入的一些更改存在向后兼容性问题，这使得 Cassandra 版本升级成为一个需要解决的重要主题。在撰写本文时，最新的版本是\
  \ 2.1，其中包含了一些我们尚未在其他地方讨论的重要新特性。\n\n我们在本书的不同地方讨论过各种故障排除技巧。在本章中，我们将总结几个关键的技巧，以解决您可能遇到的一些问题。\n\
  \n本章的主题包括：\n\n- Cassandra 2.1 版本概述\n- Cassandra 版本升级\n- 故障排除技巧\n- Cassandra 的未来之路\n\
  \n让我们从讨论最新发布的 Cassandra 2.1 引入的新特性开始。\n\n### Cassandra 2.1\n\n最新发布的 Cassandra 2.1\
  \ 引入了几个重要特性以及许多与性能相关的修复。在本节中，我们将讨论 Cassandra 2.1 支持的三个重要特性：\n\n- 用户定义类型\n- 冻结类型\n\
  - 集合属性上的索引\n\n> **注意：** 有关 Cassandra 2.1 新功能的完整概述，请参阅以下文档页面：[www.datastax.com/documentation/cassandra/2.1/cassandra/features2.html](http://www.datastax.com/documentation/cassandra/2.1/cassandra/features2.html)。\n\
  \n#### 用户定义类型\n\n用户定义类型允许您将多个信息字段组合到单个表中。例如，您可以使用 CQL3 外壳像这样拥有一个包含来自多个字段信息的单一字段：\n\
  \n```sql\ncreate type if not exists twitter_keyspace.user_metadata(fname,lname)\n\
  ```\n\n这里 `user_metadata` 是一个用户定义类型，它是多个列的包装器。使用用户定义类型，我们可以通过将多个表减少到更少的表来简化数据建模模式。\n\
  \n#### 冻结类型\n\n使用 `frozen` 关键字，我们可以按如下方式定义一个特定的用户定义类型：\n\n```sql\nCREATE TABLE twitter_keyspace.users\
  \ (\nuser_id timeuuid PRIMARY KEY,\nname frozen <user_metadata>,\n);\n```\n\n这里，`name`\
  \ 是键空间 `twitter_keyspace` 中 `users` 表的 `user_metadata` 的冻结类型。对于使用 `frozen` 关键字定义的列字段，Cassandra\
  \ 会将多个组件序列化为单一值。例如，对于 `user_metadata`，`fname` 和 `lname` 将被序列化为一个单一值。一旦用户定义数据类型被\
  \ `frozen` 关键字冻结，我们就无法更新该用户定义类型的组件了。\n\n\n#### 集合属性上的索引\n\n在第 2 章中，我们讨论了数据建模概念以及集合的使用。同样在第\
  \ 2 章的“二级索引”部分，我们提到 Cassandra 不支持对集合属性创建索引。从 Cassandra 2.1 开始，我们现在可以像这样对 Cassandra\
  \ 集合属性创建索引：\n\n```\ncreate table users(user_id text PRIMARY KEY,fullname text,email\
  \ text,password text, followers map<text, text>);\n```\n\n```\ninsert into users(user_id,email,password,fullname,followers)\
  \ values ('imvivek','imvivek@xxx.com','password','vivekm',{'mkundera':'milan kundera','guest':\
  \ 'guestuser'});\n```\n\n```\ncreate index followers_idx on users(followers);\n\
  ```\n\n这里，`users`是一个表，`followers`是一个映射，其键为`user_id`，值为`name`。`create index`命令将启用对`followers`映射值（例如，全名）的索引。我们也可以像这样启用对`followers`映射键（例如，`user_id`）的索引：\n\
  \n```\ncreate index followers_idx_keys on users(KEYS(followers));\n```\n\n我们可以像这样使用索引从`followers`中获取记录：\n\
  \n```\nSELECT email, followers FROM users  WHERE followers CONTAINS 'milan kundera';\n\
  ```\n\n该命令将返回所有全名为\"milan kundera\"的关注者。\n\n另一个值得讨论的变化是，Cassandra 2.1 不支持早于 Cassandra\
  \ 2.x 版本的 sstable 格式，这引出了一个重要问题：如何处理版本升级！在下一节中，我们将讨论如何使用 Cassandra 处理版本升级。\n\n###\
  \ 升级 Cassandra 版本\n\n在过去一年半中，Cassandra 经历了多个版本的快速发布，包括 1.2.x、2.0.x 和 2.1.x。多版本并行开发的原因是为了维护、优先修复\
  \ bug 以及推出 2.0 版本。2.0 版本带来了许多新特性集，我们在第 2 章中讨论过这些特性。\n\n使用 Cassandra 作为数据库的应用程序也需要升级到其最新版本。理想情况下，这应该是一个平稳的过程，但主版本的变化带来了\
  \ sstable 格式的变更，并引入了版本限制。\n\n自去年夏天以来的发布数量如图 11-1 所示，该图展示了自 2013 年 8 月以来的许多 Cassandra\
  \ 发布版本，并且表明 Cassandra 方面需要并行开发以进行维护和特性发布。维护版本也可以称为小版本，例如关键 bug 修复，而主版本则主要侧重于新特性支持和性能修复。\n\
  \n![A978-1-4842-0142-8_11_Fig1_HTML.jpg](img/A978-1-4842-0142-8_11_Fig1_HTML.jpg)\n\
  \n图 11-1. 自 2013 年 8 月以来的 Cassandra 发布图表\n\n#### 向后兼容性\n\n如果一个 Cassandra 版本能够与先前版本的输入和数据模型正常工作，那么它就是向后兼容的。理想情况下，每个未来版本都应该是向后兼容的，以避免管理上的故障排除。然而，随着新特性支持和性能增强的快速发布，Cassandra\
  \ 的存储架构已经发生了重大变化。理解不同 Cassandra 版本之间的兼容性问题以及在某些情况下为了避免问题而必须遵循的顺序是极其重要的。\n\n通常，Cassandra\
  \ 要求你按顺序迁移主版本和小版本。这种顺序升级的原因是每个版本都会让你了解兼容性问题及其版本升级过程。例如，Cassandra 2.0 版本与早于 1.2.9\
  \ 的版本不兼容。类似地，从 Cassandra 1.2.x 版本升级到 2.1 需要先滚动重启到版本 2.0.7，然后再升级到版本 2.1。如果不进行滚动重启，你应该会在\
  \ Cassandra 服务器日志中看到以下错误：\n\n```\njava.lang.RuntimeException: Can't open incompatible\
  \ SSTable! Current version jb, found file: /var/lib/cassandra/data/system/schema_columnfamilies/system-schema_columnfamilies-ib-5\n\
  \    at org.apache.cassandra.db.ColumnFamilyStore.createColumnFamilyStore(ColumnFamilyStore.java:410)\n\
  \    at org.apache.cassandra.db.ColumnFamilyStore.createColumnFamilyStore(ColumnFamilyStore.java:387)\n\
  \    at org.apache.cassandra.db.Keyspace.initCf(Keyspace.java:309)\n    at org.apache.cassandra.db.Keyspace.<init>(Keyspace.java:266)\n\
  \    at org.apache.cassandra.db.Keyspace.open(Keyspace.java:110)\n    at org.apache.cassandra.db.Keyspace.open(Keyspace.java:88)\n\
  \    at org.apache.cassandra.db.SystemKeyspace.checkHealth(SystemKeyspace.java:499)\n\
  \    at org.apache.cassandra.service.CassandraDaemon.setup(CassandraDaemon.java:228)\n\
  ```\n\n因此，建议遵循发行说明来妥善解决与版本升级相关的问题。如上所述，为了解决此类版本升级问题，我们需要执行滚动重启。滚动重启不会关闭整个集群并对每个节点执行版本升级，而是以零停机时间的方式在节点上执行升级。节点一次一个地升级和重启，这样仍然可以保证数据的可用性。例如，这意味着一个运行\
  \ Cassandra 1.1.x 版本的节点，需要先升级到 Cassandra 1.2.9 版本，然后按照前面提到的进行版本 2.0 升级：即顺序为 1.1.x\
  \ -> 1.2.9 -> 2.0.7，最后到 2.1。\n\n2.0 版本中的一些配置变更包括：\n\n*   `index_interval` 属性已移至表级别，不再在\
  \ `cassandra.yaml` 中可用。\n*   虚拟节点（例如 `num_tokens`）在 2.0 及更高版本中默认启用，而在早期版本中则被禁用。\n\
  *   对于 2.0 及更高版本，必须安装 Java 7 版本。\n\n既然我们已经讨论了向后兼容性，接下来我们看看如何对 Cassandra 节点执行版本升级。\n\
  \n#### 通过滚动重启执行升级\n\n使用上一节中提到的场景，让我们逐步了解执行顺序升级的步骤：\n\n在开始滚动升级之前，我们应该处理好上述变更，并备份属于先前\
  \ Cassandra 版本的所有配置和数据。对于数据备份，我们可以像这样创建快照：\n\n```\nvivek@vivek-Vostro-3560:∼$CASSANDRA_HOME$\
  \ bin/nodetool -h localhost snapshot twitter_keyspace\n```\n\n在上述命令中，请将 `$CASSANDRA_HOME$`\
  \ 替换为当前安装的 Cassandra 版本（例如 `$apache-cassandra-1.1.6$`）。\n\n在上述命令中，我们为键空间 `twitter_keyspace`\
  \ 创建了一个快照。\n\n在下载下一个版本（此处为 1.2.9）之前，请确保从正在运行的 Cassandra 集群中移除所有死节点。然后运行以下命令：\n\n\
  ```\nnodetool upgradesstables\n```\n\n这将把现有的 sstable（版本为 1.1.x）升级为与 1.2.9 兼容的格式。\n\
  \n然后，按顺序遵循上述步骤从 1.2.9 升级到 2.0.7，最后，执行相同的操作从版本 2.0.7 升级到 2.1。\n\n对于多节点 Cassandra\
  \ 集群，我们需要在所有节点上执行相同的步骤。如果任何节点上的版本升级失败，我们可以尝试从其他节点复制模式，并从其他活动节点复制数据。\n\n### Cassandra\
  \ 故障排除\n\n故障排除是诊断和修复问题的过程。在本节中，我们将对几个常见问题进行故障排除——例如打开文件过多和内存不足——你可能会遇到这些问题并需要解决它们。\n\
  \n\n\n"
- '# 打开文件过多


  如果你遇到类似这样的错误：


  ```

  java.net.SocketException: Too many open files

  at java.net.Socket.createImpl(Socket.java:447)

  at java.net.Socket.getImpl(Socket.java:510)

  at java.net.Socket.setSoLinger(Socket.java:984)

  ```


  这意味着你已经达到了允许打开的最大文件数限制。默认值是 1024。在使用 Cassandra 时，非常有可能超过这个限制。我们可以通过修改 `/etc/security/limits.conf`
  文件来提高这个限制，示例如下：


  ```

  root soft nofile 65535

  ```


  这里的 `65535` 是允许打开的文件描述符数量。这样做应该能解决问题。此外，我们还可以通过监控正在运行的 Java 进程来监视文件描述符的数量，以验证是否属于内存泄漏的情况！


  使用 `lsof` 命令，我们可以列出所有打开的文件。例如，我们可以按如下方式列出某个进程 ID（PID）的所有打开文件：


  ```

  lsof –p 13241

  COMMAND    PID      USER    FD     TYPE    DEVICE    SIZE/OFF    NODE NAME

  init       13241    root    cwd    DIR     225,0         4096    1 /

  init       13241    root    rtd    DIR     225,0         4096    1 /

  ```


  '
- '# 栈大小限制


  栈大小限制了我们在 Java 虚拟机（JVM）中可以拥有的线程数量。如果你看到类似下面的错误：


  ```

  The stack size specified is too small, Specify at least 228k

  Error: Could not create the Java Virtual Machine.

  Error: A fatal exception has occurred. Program will exit.

  ```


  这意味着栈大小设置得太小了。默认分配的值为 180K，按照 Cassandra 的建议，我们可以通过修改 `Cassandra-env.sh` 文件（位于 `conf`
  文件夹下）将其设置为 228K，示例如下：


  ```

  JVM_OPTS="$JVM_OPTS –Xss228k"

  ```


  '
- '# 内存溢出错误


  随着 Cassandra 处理的海量数据，有时节点可能会因为“内存溢出”错误而崩溃。如果你遇到这种情况，请首先检查行缓存和 memtable 的大小，并确认它们的值是否设置得过大。这里的“过大”仅意味着它们无法很好地适应可用内存。如果这些值远低于可用内存限制，那么我们应该检查堆转储以及服务器和应用程序日志，以获取有关错误的更多信息。从
  Cassandra 1.2.9 开始，许多后台进程已从堆内处理迁移到堆外处理，以避免垃圾回收活动。因此，你可能会遇到堆外或堆内内存不足的情况。有关堆外和堆内的更多讨论，请参考第
  8 章中的“CPU 和内存利用率”以及“堆外 vs. 堆内”部分。此外，如果应用程序正在读取类似整行或大列的数据，你也可以检查客户端代码。


  '
- '# 垃圾回收活动过多


  如果垃圾回收（GC）耗时超过几秒钟，请检查 `system.log` 文件中是否有类似以下的消息：


  ```

  INFO [ScheduledTasks:1] 2014-01-29 02:41:16,579 GCInspector.java (line 116) GC for
  ConcurrentMarkSweep: 341 ms for 1 collections, 8001582816 used; max is 8126464000

  INFO [ScheduledTasks:1] 2014-01-29 02:41:29,135 GCInspector.java (line 116) GC for
  ConcurrentMarkSweep: 350 ms for 1 collections, 8027555576 used; max is 8126464000

  ```


  长时间的垃圾回收暂停可能会造成“停止世界”场景，使数据节点冻结一段时间。在这种情况下，JVM 中未使用的部分很可能会被换出。建议使用以下命令来禁用交换：


  ```

  swapoff –all

  ```


  在 Linux 终端上运行此命令将禁用所有设备的交换。


  这些是你可能会遇到的几个常见问题及其解决方案。接下来，让我们讨论一下 Cassandra 的未来发展之路。


  ### Cassandra 的未来之路


  Apache Cassandra 仍在积极开发中，一个极其活跃的社区保持着发展的势头。我们已经讨论了可用于 Apache Cassandra 开发的多种工具和
  API。图 11-2 显示了撰写本书时即将推出的 Cassandra 版本图表（取自 [`https://issues.apache.org/jira/browse/CASSANDRA/fixforversion/12324945/?selectedTab=com.atlassian.jira.jira-projects-plugin:version-summary-panel`](https://issues.apache.org/jira/browse/CASSANDRA/fixforversion/12324945/?selectedTab=com.atlassian.jira.jira-projects-plugin:version-summary-panel)）。


  ![A978-1-4842-0142-8_11_Fig2_HTML.jpg](img/A978-1-4842-0142-8_11_Fig2_HTML.jpg)


  *图 11-2. 即将推出的 Cassandra 版本（截至 2014 年 11 月）*


  毫无疑问，Cassandra 已被广泛接受为首选列式数据库，用于构建可扩展的大数据应用程序。eBay、Netflix 和 Facebook 等公司正在将 Cassandra
  用于多种用途。这些组织的开发人员一直在定期贡献并推出他们基于 Cassandra 的工具，这对未来来说是个好兆头。


  此外，几乎所有语言选项中都有高级客户端可用。表 11-1 列出了流行的 Cassandra 高级客户端 API 表格。


  *表 11-1. Cassandra 高级客户端*


  | 语言 | 客户端 |

  | --- | --- |

  | Java | DataStax Java 驱动、Astyanax、Hector、Kundera |

  | Python | DataStax Python 驱动、pycassa |

  | .NET | DataStax C# 驱动、CqlSharp |

  | C++ | libcql |

  | Scala | scqla |

  | Perl | perlcassa |

  | PHP | Cassandra PDO 驱动、phpcasa |


  凭借多种语言的 API、活跃的社区以及计划中的版本发布，Cassandra 无疑拥有长远的发展前景。在即将到来的 Cassandra 版本中，预计会推出一系列全新且有趣的功能。再次强调，Cassandra
  是一种流行的 NoSQL 数据库，非常适合处理大数据；其生态系统中拥有丰富的客户端 API；持续多年的活跃开发仍在继续；并且像 Netflix、eBay 和 Facebook
  这样的公司正在使用和推广它。随着这一领域众多新的商业工具和产品的涌现，它是一款值得学习和使用的数据库！


  ### 总结


  至此，我们本章及本书的内容就结束了。从第 1 章到第 11 章，我们通过示例练习的形式讨论了 Cassandra 的不同特性及其实现。在本章中，我们探讨了升级到新版本
  Cassandra 的流程，以及如何应对近期众多版本带来的复杂性。我们还考虑了几个常见且重要的问题，你很可能在某个时候需要解决这些问题，并且我们展望了 Cassandra
  的未来之路。


  本书前面涵盖的关键主题包括批量分析和可用工具（第 5 章和第 6 章）、基于 Cassandra 的图实现（第 7 章）、性能调优及各种性能相关的注意事项（第
  8 章）。


  通过本书，我力求在示例菜谱和理论知识之间保持平衡。希望你喜欢本书，并学有所获。谢谢！

  '
