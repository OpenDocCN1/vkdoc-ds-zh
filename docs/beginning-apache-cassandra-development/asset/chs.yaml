  \n**图 4-23.** 尝试在未登录时使用`AllowAllAuthenticator`创建用户\n\n`alter keyspace system_auth\
  \ with replication = {'class':'SimpleStrategy','replication_factor':3};`\n\n通过本指南，我们得出结论：我们可以修改`system_auth`键空间，但不能使用`AllowAllAuthenticator`（禁用身份验证）创建用户。在\
  \ Cassandra 服务器上使用默认用户凭证进行身份验证时，必须将一致性级别配置为`QUORUM`。\n\n接下来，我们讨论 SSL 加密以及在启用加密时连接`cqlsh`和\
  \ Thrift 客户端的话题。\n\n\n\n"
- "# 准备服务器证书\n\n近年来，社交媒体和基于互联网的应用程序使得全球范围内的数据访问和共享成为可能。SSL 协议用于通过互联网安全地发送加密数据。\n\n\
  对于基于 SSL 的客户端-服务器或节点间通信，我们需要准备服务器证书。一个文件包含服务器密钥，而另一个文件则包含所有客户端或节点的可信 SSL 证书。\n\n\
  在开始新的操作指南之前，让我们先讨论一些可能出现的错误及解决方案。配置并启动 Cassandra 服务器后，如果收到如下错误，则需要将已安装的 Java 版本配置为支持\
  \ Java 加密扩展(JCE)。\n\n`Cannot support TLS_RSA_WITH_AES_256_CBC_SHA with currently\
  \ installed providers`\n\n从以下地址下载 JCE 包：\n\n[`http://www.oracle.com/technetwork/java/javase/downloads/jce-6-download-429243.html`](http://www.oracle.com/technetwork/java/javase/downloads/jce-6-download-429243.html)\
  \ (Java 6)\n\n[`http://www.oracle.com/technetwork/java/javase/downloads/jce-7-download-432124.html`](http://www.oracle.com/technetwork/java/javase/downloads/jce-7-download-432124.html)\
  \ (Java 7)\n\n然后将`local_policy.jar`和`US_export_policy.jar`复制到`$JAVA_HOME/jre/lib/security`文件夹下。\n\
  \n既然必要的配置已经完成，下面我们通过一个简单的练习来探索如何准备服务器证书。\n\n首先，使用`keytool`为服务器生成一个密钥库：\n\n`keytool\
  \ -genkey -alias servernode -keystore /home/impadmin/keys/server/server.jks -storepass\
  \ server -keypass server`\n\n这里，`/home/impadmin/keys/server`是存放密钥库文件的文件夹路径。你可以根据实际情况更改。图\
  \ 4-24 显示了生成密钥库时需要输入的基本信息。\n\n从密钥库文件中导出公钥部分：\n\n![A978-1-4842-0142-8_4_Fig24_HTML.jpg](img/A978-1-4842-0142-8_4_Fig24_HTML.jpg)\n\
  \n图 4-24. 生成密钥库时提供的输入信息\n\n`keytool -export -alias servernode -file /home/impadmin/keys/publickey.cer\
  \ -keystore /home/impadmin/keys/server.jks -storepass server`\n\n图 4-25 显示了`publickey.cer`已存储在`/home/impadmin/keys`文件夹中。\n\
  \n将`publickey.cer`作为可信证书导入到服务器的信任库中：\n\n![A978-1-4842-0142-8_4_Fig25_HTML.jpg](img/A978-1-4842-0142-8_4_Fig25_HTML.jpg)\n\
  \n图 4-25. 存储的带有完整路径的公钥证书\n\n`keytool -import -v -trustcacerts -alias client -file\
  \ /home/impadmin/keys/publickey.cer -keystore /home/impadmin/keys/.truststore -storepass\
  \ client`\n\n图 4-26 显示证书已成功添加。\n\n![A978-1-4842-0142-8_4_Fig26_HTML.jpg](img/A978-1-4842-0142-8_4_Fig26_HTML.jpg)\n\
  \n图 4-26. 客户端的证书已成功添加到服务器的信任库中\n\n至此，我们已经准备好了服务器证书。在接下来的几个操作指南中，我们将使用信任库来通过受信任的证书访问服务器。对于节点间通信，我们需要在每个节点上重复上述操作，并将每个节点的公钥证书复制到其他节点的信任库中。\n\
  \n图 4-27 以图形方式展示了客户端证书准备以及导入到信任库的过程。\n\n![A978-1-4842-0142-8_4_Fig27_HTML.jpg](img/A978-1-4842-0142-8_4_Fig27_HTML.jpg)\n\
  \n图 4-27. 为服务器准备和共享客户端公钥证书的流程\n\n在 Cassandra 节点之间准备和共享证书的流程与此相同，每个节点都必须导出其公钥证书并与\
  \ Cassandra 集群中的所有其他节点共享。\n\n证书准备过程完成后，需要启用并连接已启用 SSL 加密的命令行客户端。下一节将讨论这个过程。\n\n\
  ### 使用 SSL 加密进行连接\n\n前一节讨论了连接启用了 SSL 的`cqlsh`。下面我们来探索如何连接启用了 SSL 加密的`cassandra-cli`命令行客户端。\n\
  \n#### 通过 Cassandra-cli 连接\n\n让我们为 Cassandra 启用加密的客户端到节点通信，并以 Thrift 方式（使用`cassandra-cli`）连接服务器。\n\
  \n首先，我们需要为客户端到节点加密配置服务器。\n\n```\n// 启用服务器\nenabled: true\n// 密钥库路径\nkeystore: /home/impadmin/keys/server.jks\n\
  // 密钥库密码\nkeystore_password: server\n```\n\n以下内容显示了在`cassandra.yaml`中配置密钥库和信任库路径所需进行的配置更改：\n\
  \n```\n# 启用或禁用客户端/服务器加密。\nclient_encryption_options:\n  enabled: false\n  keystore:\
  \ /home/impadmin/keys/server.jks\n  keystore_password: server\n  # require_client_auth:\
  \ false\n  # 如果 require_client_auth 为 true，则设置信任库和信任库密码\n  truststore: /home/impadmin/keys/.truststore\n\
  \  truststore_password: client\n  # 下面的选项为更高级的默认配置：\n  protocol: TLS\n  algorithm:\
  \ SunX509\n  store_type: JKS\n  cipher_suites: [TLS ECDHE RSA WITH AES 256 CBC SHA,\
  \ TLS DHE RSA WITH AES 128 CBC SHA, TLS ECDH ECDSA WITH AES 128 CBC SHA, TLS DHE\
  \ RSA WITH AES 256 CBC SHA,\n  SSL DHE RSA WITH 3DES EDE CBC SHA, TLS ECDH RSA WITH\
  \ AES 256 CBC SHA, SSL RSA WITH RC4 128 SHA, TLS ECDH ECDSA WITH 3DES EDE CBC SHA,\
  \ TLS ECDHE RSA WITH RC4 128 SHA,\n  TLS ECDH ECDSA WITH RC4 128 SHA, TLS ECDHE\
  \ ECDSA WITH RC4 128 SHA, TLS ECDHE RSA WITH AES 128 CBC SHA, TLS ECDHE ECDSA WITH\
  \ 3DES EDE CBC SHA,\n  TLS ECDH RSA WITH RC4 128 SHA, TLS EMPTY RENEGOTIATION INFO\
  \ SCSV, TLS ECDH RSA WITH 3DES EDE CBC SHA, TLS ECDH RSA WITH AES 128 CBC SHA,\n\
  \  TLS ECDHE ECDSA WITH AES 256 CBC SHA, TLS ECDHE ECDSA WITH AES 128 CBC SHA, TLS\
  \ DHE DSS WITH AES 256 CBC SHA, TLS RSA WITH AES 128 CBC SHA,\n  TLS ECDH ECDSA\
  \ WITH AES 256 CBC SHA, TLS RSA WITH AES 256 CBC SHA, TLS ECDHE RSA WITH 3DES EDE\
  \ CBC SHA, SSL RSA WITH RC4 128 MD5, TLS DHE DSS WITH AES 128 CBC SHA,\n  SSI DHF\
  \ DSS WTTH 3DFS FDF CRC SHA. SSI RSA WTTH 3DFS FDF CRC SHA1]\n```\n\n这里的`cipher_suites`配置包含了所有有效的协议，建议在使用此应用程序进行配置时保持原样。\n\
  \n您可以启用`require_client_auth`并将其设置为`true`以进行客户端证书认证。\n\n启动 Cassandra 服务器并连接`cassandra-cli`：\n\
  \n```\n$CASSANDRA_HOME/bin/cassandra-cli -h 127.0.0.1 -p 9160 -ts\n/home/impadmin/keys/.truststore\
  \ -tf org.apache.cassandra.cli.transport.SSLTransportFactory -tspw client\n```\n\
  \n这里，`-ts`、`-tf`和`-tspw`分别代表信任库、传输工厂和信任库密码。\n\n通过 SSL 加密，我们可以使用传输工厂和信任库配置连接到 Thrift\
  \ 客户端。接下来，我们将连接启用了 SSL 加密的`cqlsh`。\n\n#### 通过 cqlsh 连接\n\n要连接已启用加密的`cqlsh`，我们需要在`home`目录下创建`.cqlshrc`文件。此外，我们可以在`require_client_auth=false`的情况下连接`cqlsh`。在本操作指南中，我们将连接并配置`cqlsh`。\n\
  \n在`home`目录下创建用于 SSL 特定配置的`.cqlshrc`文件。\n\n```\nfactory = cqlshlib.ssl.ssl_transport_factory\n\
  // 信任库文件路径\ncertfile = /home/impadmin/source/keys/.truststore\n```\n\n图 4-28 显示了`.cqlshrc`文件中的配置更改。\n\
  \n就是这样！让我们运行`cqlsh`连接到 Cassandra 服务器：\n\n![A978-1-4842-0142-8_4_Fig28_HTML.jpg](img/A978-1-4842-0142-8_4_Fig28_HTML.jpg)\n\
  \n图 4-28. `.cqlshrc`配置更改\n\n```\nSSL_CERTFILE=/home/impadmin/source/keys/publickey.cer\n\
  SSL_VALIDATE=$CASSANDRA_HOME/bin/cqlsh -3 -t cqlshlib.ssl.ssl_transport_factory\n\
  ```\n\n\n\n#### 通过 Cassandra Thrift 客户端连接\n\n以下代码片段展示了如何通过基于 Java 的 Cassandra Thrift\
  \ 客户端与安全服务器建立连接：\n\n```\nTSSLTransportFactory.TSSLTransportParameters params =\n\
  new TSSLTransportFactory.TSSLTransportParameters();\nparams.setTrustStore(\"path\
  \ to .truststore\", \"trustore password\");\ntransport = TSSLTransportFactory.getClientSocket(\"\
  localhost\", 7001, 10000, params);\nTProtocol protocol = new TBinaryProtocol(transport);\n\
  Cassandra.Client client = new Cassandra.Client(protocol);\n```\n\n这里的 `7011` 是 SSL\
  \ 端口，其余步骤与 `Cassandra-cli` 方式类似。使用配置了 SSL 的传输参数（例如：配置信任库路径、密码和 SSL 传输工厂）来打开客户端套接字。\n\
  \n这样，我们就可以通过命令行客户端和基于 Java 的 Thrift 客户端连接到 Cassandra 服务器。\n\n### 总结\n\n本章讨论的主题概括如下：\n\
  \n- 通过超级用户和非超级用户管理用户角色与权限\n- 为客户端-服务器通信和节点间通信准备 SSL 加密证书\n- 通过多种客户端连接到安全的 Cassandra\
  \ 服务器\n\n至此，我们完成了关于 Cassandra 数据安全与用户管理的讨论。\n\n下一章将转向大数据分析，讨论如何使用 Hadoop 的 MapReduce\
  \ 算法进行批处理，以及如何通过 Cassandra 文件系统作为输入和输出来运行 MapReduce 程序！\n\n"
- "# 5. 使用 Cassandra 的 MapReduce\n\n那么，在讨论了数据建模、安全性和用户角色权限管理之后，下一步是什么？借助 Cassandra\
  \ 查询语言（CQL），我们确实可以通过主键和二级索引管理基本的基于查询的分析，并尽可能保持数据模型的非规范化。但是，我们仍然可以对海量数据进行分析，例如类似连接（join）的操作，或者在计算特定字段后将数据持久化到\
  \ Cassandra 中，比如统计特定用户账户在给定日期范围内的推文数量。这显然属于大数据分析，更具体地说是批处理分析的范畴。\n\n在本章中，我们将：\n\n\
  - 介绍 MapReduce\n- 探索 Hadoop\n- 讨论 HDFS 和 MapReduce\n- 描述 Cassandra 与 MapReduce 的集成\n\
  \n### 批处理与 MapReduce\n\n任何形式的数据，无论结构化还是非结构化，如果不经过处理都将毫无意义。到目前为止，我们已经讨论了在 Cassandra\
  \ 中管理和建模数据量的各种方法。\n\n那么，如何处理这些归档的海量数据集的分析呢？大数据分析可以分为两大类：\n\n- 批处理\n- 流处理\n\n通俗地说，批处理就是执行一个或多个作业。这些作业被编程为需要最少的人为干预。所需的输入/输出参数和资源都预先配置在作业中。批处理机制的历史可以追溯到打孔卡和大型机计算时代。\n\
  \n以卫星频道应用存档多年的日志为例。每年年底（或者每半年），供应商希望了解特定年龄段的用户在黄金时段观看了哪些特定节目。由于数据量巨大且完全非结构化，我们无法将其流式传输并放入内存中进行此类计算。这些数据之间通常关联性不大，要批量处理它们，需要预先定义好并行处理的步骤。\n\
  \n对于大数据而言，批处理作业可以分为三个简单步骤：\n\n- 提取（extract），\n- 转换（transform），\n- 以及加载（load）\n\n\
  这个过程通常被称为 ETL。市面上有各种 ETL 工具，例如 Ab Initio、CloverETL、Pentaho 和 Informatica，可用于数据仓库和分析。\n\
  \nETL 系统的另一个方面是分析。想象一下，一个系统需要执行大数据分析，其中数据输入点来自不同应用，系统需要生成一个汇总聚合报表。这时，数据将从各种输入渠道提取出来，在进行计算和转换后，再加载到数据库中。图\
  \ 5-1 展示了一个基于 ETL 的分析示例，需要从社交媒体渠道、金融应用和服务器日志中提取数据。转换/计算在引擎端完成，最终输出加载到数据库中。\n\n![A978-1-4842-0142-8_5_Fig1_HTML.jpg](img/A978-1-4842-0142-8_5_Fig1_HTML.jpg)\n\
  \n图 5-1. 基于 ETL 的分析\n\n2008 年，谷歌的研究项目发表了一篇题为“MapReduce：大型集群上的简化数据处理”的论文，引入了 MapReduce\
  \ 范式，尽管该范式自 2003 年以来就已在使用。（你可以在 [`http://static.googleusercontent.com/media/research.google.com/en//archive/mapreduce-osdi04.pdf`](http://static.googleusercontent.com/media/research.google.com/en//archive/mapreduce-osdi04.pdf)\
  \ 下载这份白皮书。）MapReduce 算法是一种分布式并行编程模型，由 `map` 和 `reduce` 函数组成，是针对需要对异构形式的海量数据进行分析的业务问题的一种解决方案。自谷歌论文发表以来，已经构建了多种\
  \ MapReduce 实现。其中一种流行且开源的是 Apache Hadoop。\n\n### Apache Hadoop\n\nApache Hadoop\
  \ 是一个流行的开源库，用于大规模数据集的分布式计算。它是一个大规模批处理基础设施，主要旨在处理分布在数百个节点上的数据的批处理分析。\n\n在 MapReduce\
  \ 作业中，数据集被分割成若干块，使得每个块都可以作为一个 `map` 任务以协同定位的方式独立处理，然后框架对输出进行排序并提供给 reduce 任务。Hadoop\
  \ 框架自动管理任务调度和数据分发。\n\n显然，如此庞大的数据无法在单个节点上管理，必须分布在多个节点上。这里明显可见两个问题：\n\n- 数据分布\n- 协同定位的数据处理\n\
  \n#### HDFS\n\nHadoop 的数据分布由 Hadoop 分布式文件系统（HDFS）管理。HDFS 是 Apache Hadoop 项目的子模块之一。它专门设计用于在廉价硬件上构建可扩展的系统。HDFS\
  \ 基于主/从架构，其中称为 `NameNode` 的单个进程在主节点上运行，并管理集群节点间关于数据文件和复制的所有信息。\n\n有关 HDFS 架构的更多信息，请参考\
  \ [`http://hadoop.apache.org/docs/r1.2.1/hdfs_design.html`](http://hadoop.apache.org/docs/r1.2.1/hdfs_design.html)\
  \ 。\n\n\n\n#### MapReduce\n\n`MapReduce`的实现也解决了另一个问题：它是一个用于在多个节点上并行处理大量数据的框架。\n\n\
  `MapReduce`过程中执行的三个主要任务是：\n\n- 拆分与映射\n- 混洗与排序\n- 归约与输出\n\n提交作业后，输入数据被分块，并作为并行映射任务分配给每个映射器。每个映射器生成一个不同的键值对作为输出，该输出经混洗后按键排序，然后作为输入提供给每个归约器。每个在数据节点上运行的映射器和归约器仅对本地数据进行操作（数据本地性）。另一个附加优势是，该框架完全解耦，并且映射器、归约器、文件格式和记录读取都可以自定义实现。\n\
  \n让我们通过一个著名的单词计数问题来简化理解。这里，程序需要输出输入文件中每个单词出现的次数（见图 5-2）。\n\n![A978-1-4842-0142-8_5_Fig2_HTML.jpg](img/A978-1-4842-0142-8_5_Fig2_HTML.jpg)\n\
  \n图 5-2. `MapReduce` 如何使用单词计数工作\n\n图 5-2 是一个针对 Word 文件中三行给定文本进行单词计数的 `MapReduce`\
  \ 程序的图形化表示。\n\n```\nWelcome to the Cassandra world   Apress book Cassandra made\
  \ easy   Cassandra 2.0.8 out now   \n```\n\n这里，每个映射任务在数据所在的本地数据节点上运行。然后，数据由 Hadoop\
  \ `MapReduce` 框架隐式混洗并排序，最终传递给归约任务，归约过程后将结果输出到一个文件中。\n\n为了更底层地理解，你也可以参考图 5-3 中的伪代码表示。\n\
  \n![A978-1-4842-0142-8_5_Fig3_HTML.jpg](img/A978-1-4842-0142-8_5_Fig3_HTML.jpg)\n\
  \n图 5-3. 单词计数 `MapReduce` 算法\n\n### 将推文读取并存储到 HDFS\n\n由于我们在本书中一直使用基于 Twitter 的示例，让我们再次为\
  \ HDFS/MapReduce 示例使用实时推文。从 HDFS 开始的原因是让我们先熟悉如何在默认的 HDFS 上运行 `MapReduce`，然后再解释如何将其在外部文件系统（例如\
  \ Cassandra 文件系统）上执行。在本节中，我们将讨论如何设置并获取关于“apress”的推文。在我们的示例中，我们将流式获取一些关于“Apress 出版物”的推文，并将其存储到\
  \ HDFS 上。此配方的目的是设置和配置 Hadoop 进程，并为下一节“Cassandra `MapReduce` 集成”中的配方打下基础。\n\n####\
  \ 读取推文\n\n首先，让我们构建一个基于 Maven 的示例 Java 项目，以演示如何从 Twitter 读取推文。（有关使用 Maven 的更多详细信息，你也可以参考\
  \ [`http://maven.apache.org/plugins/maven-site-plugin/usage.html`](http://maven.apache.org/plugins/maven-site-plugin/usage.html)。）\n\
  \n首先，让我们生成一个 Maven 项目：\n\n```\nmvn archetype:create –DgroupId=com.apress –DartifactId=twitterExample\
  \ –Dversion=1.0 –Dpackaging=jar\n```\n\n让我们在 `pom.xml` 中添加一个 `twitter4j` 依赖（见图 5-4）：\n\
  \n```\n<!-- Twitter 4j dependency -->\n<dependency>\n  <groupId>org.twitter4j</groupId>\n\
  \  <artifactId>twitter4j-core</artifactId>\n  <version>[3.0,)</version>\n</dependency>\n\
  ```\n\n为消费者和访问凭据配置 `twitter4j.properties`（位于 `src/main/resources` 下）：\n\n```\n#twitter4j.properties\n\
  # 下面给出的密钥已被加密。在运行 DefaultTwitterService 之前，请根据你的设置更改它们。\noauth.consumerSecret=8xxxxxxcxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\
  oauth.accessToken=3ccxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\noauth.accessTokenSecret=hxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\
  oauth.consumerKey=oxxxxxxxxxxxxxxxxxxxxx\n```\n\n让我们使用 Twitter API 创建一个连接，如下所示：\n\
  \n```\ntwitter = new TwitterFactory().getInstance();\n```\n\n> 注意：具体实现请参考 `com.apress.chapter5.mapreduce.twittercount.hdfs.ConnectionHandler`。\n\
  \n接下来，将 `apress` 配置为搜索词并获取推文：\n\n```\nQuery query = new Query(\"apress\");\nQueryResult\
  \ result = connection.search(query);\n```\n\n让我们将这些推文存储到本地文件夹中：\n\n```\nfinal String\
  \ filePath = \"tweets\"; // 你可以根据你的配置更改此路径\nFile file = new File(filePath);\nFileOutputStream\
  \ fos = null;\ntry\n{\n  fos = new FileOutputStream(file);\n}\ncatch (FileNotFoundException\
  \ e)\n{\n  // 记录错误\n}\n// 在本地文件系统上读取和写入推文\ndo\n{\n  List<Status> statuses = result.getTweets();\n\
  \  for (Status status : statuses)\n  {\n    StringBuilder sb = new StringBuilder();\n\
  \    sb.append(status.getUser().getCreatedAt());\n    sb.append(\"\\001\");\n  \
  \  if (status.getUser() != null)\n    {\n      sb.append(status.getUser().getName());\n\
  \      sb.append(\"\\001\");\n    }\n    sb.append(status.getText());\n    sb.append(\"\
  \\n\");\n    try\n    {\n      fos.write(sb.toString().getBytes());\n    }\n   \
  \ catch (IOException e)\n    {\n      // 记录错误\n    }\n    count++;\n  }\n} while\
  \ ((query = result.nextQuery()) != null);\n```\n\n运行后会将一个推文文件存储在当前目录中。\n\n本章所使用的所有示例的源代码均可在本书的下载资源中找到。上述代码片段的完整源代码位于\
  \ `com.apress.chapter5.mapreduce.twittercount.hdfs.DefaultTwitterService`。\n\n\n\
  \n```markdown\n#### 将推文存储到 HDFS\n\n接下来，将推文存储到 HDFS 中。您还需要安装并配置 Hadoop。本示例将使用 Hadoop\
