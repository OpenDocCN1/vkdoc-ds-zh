  ### 数据分区


  分区模式在节点间的数据分布中起着重要作用。Cassandra 提供了三种数据分区策略：


  -   选择随机分区器将使用 MD5 哈希算法在节点间分布数据。随机分区器会在集群中均匀分布数据。数据分布依赖于分配的`initial_token`值或`num_tokens`将行分配到每个节点。MD5
  哈希值为 16 字节，用于表示十六进制数字。每个节点被分配一个由令牌值表示的数据范围。当接收到读/写请求时，如果选择了随机分区器作为分区策略，会为每个行键生成哈希值，并将其分配给负责处理该读/写请求的节点。这就是随机分区下数据分布的方式。

  -   默认分区器。与`RandomPartitioner`类似，但使用 Murmur 哈希函数计算令牌值。Murmur3 哈希表示 32 位或 128 位的值，在
  Cassandra 中，它使用 128 位的值作为令牌。MD5 和 Murmur3 哈希的另一个区别在于，后者是非加密哈希，而 MD5 是加密哈希函数（例如，单向哈希）。

  -   推荐用于顺序数据访问。使用此分区器时，数据会根据行键值在集群中的节点间分布。数据分布不均匀的频率较高，并且可能在特定范围内频繁写入时导致性能热点。


  #### 更换分区器


  在进行数据建模时，应提前决定分区策略。不允许在集群已经接收数据时更换分区器，否则 Cassandra 会抛出类似以下的错误：


  ```

  ERROR 23:34:10,630 Cannot open \var\lib\cassandra\data\system\schema_keyspaces\system-schema_keyspaces-jb-1;
  partitioner org.apache.cassandra.dht.Murmur3Partitioner does not match system partitioner
  org.apache.cassandra.dht.RandomPartitioner.

  ```


  请注意，从 Cassandra 1.2 开始，默认的分区器是`Murmur3Partitioner`，因此如果升级，你需要修改它以匹配旧的分区器。


  #### 数据共置


  每个行键的列会本地存储在该节点上。根据复制因子和策略，数据会在节点间进行复制。这确保了 Cassandra 的数据本地性和高可用性。


  下面我们来讨论 Cassandra 中读写操作的工作原理。


  ##### Cassandra 写入


  在点对点架构中，集群中的每个节点都有资格接收读/写请求。作为客户端和数据节点（负责处理写请求的节点）之间代理或委派者的节点称为协调节点。收到写请求后，列会首先写入提交日志，然后写入分配给该节点上的内存表。根据提供的一致性级别，会向客户端发送确认。


  基于`memtable_total_space_in_mb`，数据会以 SSTable 的形式刷新到磁盘。当超过该限制时，最大的内存表会被刷新到磁盘。图 3-12
  展示了 Cassandra 插入和更新的图示。


  ![A978-1-4842-0142-8_3_Fig12_HTML.jpg](img/A978-1-4842-0142-8_3_Fig12_HTML.jpg)

  图 3-12. a) 左侧图片，为 id 1 插入`fname`；b) 右侧图片，为 person id 1 更新，添加列`lname`


  在图 3-12a 和 3-12b 中，列`fname`和`lname`存储在连续的写入列请求中。每个内存表是一个列族的内存表示。而提交日志会按相同顺序保留数据。为
  Person 列族插入一条记录会持续将其添加到对应的内存表中。例如，为行键 1 添加另一列`age`并更新`fname`，会修改数据结构，如图 3-13 所示。


  ![A978-1-4842-0142-8_3_Fig13_HTML.jpg](img/A978-1-4842-0142-8_3_Fig13_HTML.jpg)

  图 3-13. a) 左侧图片显示添加了值为 32 的`age`列；b) 右侧图片显示将 person id 1 的行中的`fname`列值更新为 vivs


  图 3-13a 和 3-13b 分别展示了插入`age`列和修改`fname`列的情况。请注意，Cassandra 提供更快的写入吞吐量，因为没有更新操作，只有插入操作。但是，基于时间戳，具有最新时间戳的行将作为输出返回。这里的时间戳由
  Cassandra 内部管理。压缩过程将通过删除过期或墓碑行来管理空间释放。在 2.x 版本中，Cassandra 提供了比较并设置（CAS）支持。我们将在后面的“比较并设置”部分讨论这一点。




  ### Cassandra 读取操作


  协调节点的选择以及将读取请求分配给数据节点的过程与写入请求类似。Cassandra 会为特定行键返回具有最新时间戳的列。Cassandra 在内部执行以下步骤来返回列名和值：


  -   首先搜索 `memtable` 缓存中的值

  -   使用布隆过滤器的行键扫描 `sstables` 以查找列

  -   根据最新时间戳对符合条件的 `sstables` 进行排序

  -   合并并返回具有最新时间戳值的列


  我们将在第 8 章中详细讨论布隆过滤器。


  图 3-14 展示了读取操作如何与 Cassandra 存储架构协同工作。


  ![A978-1-4842-0142-8_3_Fig14_HTML.jpg](img/A978-1-4842-0142-8_3_Fig14_HTML.jpg)


  **图 3-14.** Cassandra 的读取机制


  ### Cassandra 2.0 的新特性


  Cassandra 2.0 及后续版本带来了许多新功能，并在 CQL3 方面进行了大量性能增强。Cassandra 2.0 引入了对与索引和组合列相关的若干关键能力的支持，包括：


  -   比较并设置 (CAS)

  -   组合列上的二级索引

  -   条件 DDL


  > **注意：** 在本书付印前，Cassandra 2.1 已发布。有关 2.1 版中若干重要新功能的信息，请参阅第 1 章。


  ### 比较并设置


  通过最终一致性和复制支持，事务数据可以保持一致性且高可用。但在某些情况下，应用程序可能需要在多个线程之间独立访问数据，例如，应用程序需要生成唯一的 OTP（一次性密码）并希望避免竞态条件。从
  2.x 版本开始支持比较并设置 (CAS)。


  > **注意：** Cassandra 中的 CAS 支持基于 Paxos 算法。更多详细信息，请参考 [`http://en.wikipedia.org/wiki/Paxos_(computer_science)`](http://en.wikipedia.org/wiki/Paxos_(computer_science))。


  #### 算法


  比较并设置操作需要从副本节点读取最新值，充当协调器的节点称为领导者。领导者将协调副本节点执行以下任务：


  1.  准备令牌和承诺

  2.  向副本发出读取请求并接收带有最新令牌的输出

  3.  提议更新后的值并获得接受

  4.  向每个副本发出提交请求并接收确认


  #### 使用 CAS


  每个 CAS 操作都需要多次数据库往返；因此，建议仅在有限需求下使用此类操作，以避免性能开销。


  让我们用同样的 Twitter 示例来使用 CAS。


  首先，创建一个键空间 `twitter` 和列族 `users`：


  ```

  create keyspace twitter with replication={''class'':''SimpleStrategy'',''replication_factor'':
  1 };

  ```


  ```

  use twitter;

  ```


  ```

  create table users(user_id text primary key,followers set<text>, tweet_date timestamp,
  tweet_body text, first_name text);

  ```


  让我们使用 `if not exists` 命令为行键 `imvivek` 插入一条记录：


  ```

  insert into users(user_id,tweet_date,tweet_body,first_name) values(''imvivek'',''2013-12-31'',''good
  bye 2013'',''vivek'')  if not exists;

  ```


  让我们将 `first_name` 改为 `vivek_update` 后重新运行相同的命令：


  ```

  insert into users(user_id,tweet_date,tweet_body,first_name) values(''imvivek'',''2013-12-31'',''good
  bye 2013'',''vivek_update'')  if not exists;

  ```


  在图 3-15 中，由于在执行步骤 2 的命令之前表是空的且不存在任何记录，因此操作成功应用，但在步骤 3 中失败了。


