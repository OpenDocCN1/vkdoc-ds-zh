  \ 1-14 显示了两个正在运行的 EC2 实例的环状态。\n\n![A978-1-4842-0142-8_1_Fig13_HTML.jpg](img/A978-1-4842-0142-8_1_Fig13_HTML.jpg)\n\
  \n图 1-13. 如何获取节点的 inet 地址\n\n将这两个实例中的任意一个创建为种子节点，并将存储端口、`jmx_port` 和 `rpc_port`\
  \ 分别保持为 `7000`、`7199` 和 `9160`。\n\n让我们将 `listen_address` 和 `rpc_address` 保留为空值（默认值为节点的\
