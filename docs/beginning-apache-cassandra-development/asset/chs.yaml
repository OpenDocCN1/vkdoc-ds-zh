  '
- "# 7. 基于 Cassandra 的 Titan 图数据库\n\n到目前为止，我们已经讨论了 Cassandra 中的数据建模，以及使用 Hadoop 及相关技术构建大型数据分析平台。当业务需求要求不同对象之间相互关联时，一种解决方案是在多个对象之间进行引用（连接）查询。当我们必须处理众多此类关系，或者数据量变得非常庞大时，一切看似美好但问题也随之而来。\n\
  \nLinkedIn、Twitter 和 Facebook 是常见的例子，注册用户之间的关系可以被描述为社交图谱。另一个例子可能是构建信用历史并对一组客户进行贷款授信的风险分析。当然，通过使用多表和连接理论，我们可以实现一个解决方案，但这显然不具备可扩展性和高性能。这就是使用图数据库的想法发挥作用的地方。\n\
  \n在本章中，我们将讨论：\n\n*   图概念简介\n*   图框架与图数据库\n*   Titan 图数据库的安装与配置\n*   图的使用案例\n\n###\
  \ 图简介\n\n图论可以追溯到 1736 年。图是一种由顶点/节点和边组成的数据结构。一个图可以有零条或多条边。没有边的图也称为空图。\n\n顶点是一个图节点，它通过边与其他图节点/顶点相连接。每条边是一条弧线或线段，连接多个顶点。\n\
  \n在计算机科学中，图可以按多种方式进行分类。其中一些常见的分类包括：\n\n*   简单图与非简单图\n*   有向图与无向图\n*   有环图与无环图\n\n\
  #### 简单图与非简单图\n\n顾名思义，简单图是一种在两个顶点之间最多只有一条边的基图。它是一种没有自环但包含多个节点的图（见图 7-1a）。另一方面，具有自环和多条边的图是非简单图（见图\
  \ 7-1b）。这里，自环是指连接到自身顶点的一条边。在相同节点之间具有多条边的图也称为多重图或并行图。图 7-1c 所示的是一个多重图，并且是一个自环图。它在顶点\
  \ A 上包含一个自环，并且在顶点 A 和 B 之间有多条边。\n\n![A978-1-4842-0142-8_7_Fig1_HTML.jpg](img/A978-1-4842-0142-8_7_Fig1_HTML.jpg)\n\
  \n图 7-1. a) 左侧为简单图；b) 中间为非简单图；c) 右侧为带自环的多重图\n\n#### 有向图与无向图\n\n具有多个节点和有向边的图称为有向图（见图\
  \ 7-2a）。无向图是边没有方向的图（见图 7-2b）。\n\n![A978-1-4842-0142-8_7_Fig2_HTML.jpg](img/A978-1-4842-0142-8_7_Fig2_HTML.jpg)\n\
  \n图 7-2. a) 左侧为带有有向边的有向图；b) 无向图\n\n#### 有环图与无环图\n\n如果一条路径包含至少一条边，并且起点和终点是同一个顶点，则称该图包含一个环，而无环图则不包含任何环。此类图可以是有向的或无向的。图\
  \ 7-3 展示了有环图和无环图的图形表示。\n\n![A978-1-4842-0142-8_7_Fig3_HTML.jpg](img/A978-1-4842-0142-8_7_Fig3_HTML.jpg)\n\
  \n图 7-3. a) 虚线显示了一个图中的环；b) 无环图\n\n图 7-3a 表示一个有环图，环的边由连接顶点 B、C 和 D 的虚线表示。\n\n以上是一些基本的图类型。可能想到的下一个问题是：是否有专门用于处理图相关问题的开源工具、框架或数据库？\n\
  \n### 图的开源软件\n\n开源软件是免费的，易于提交错误，并且可以根据我们的需求请求功能修改，最重要的是成本效益高。近年来，在 IT 行业中使用开源软件变得流行起来，更多的组织倾向于选择开源解决方案。在采用开源解决方案之前，需要考虑的几个因素是：\n\
  \n*   应成熟稳定\n*   应处于活跃开发中，并且必须有社区支持\n*   必须有实际生产系统来验证其行业用途\n\n我们之前提出了一个问题：是否存在用于解决图相关问题的工具、框架或数据库。那么，让我们来探索和寻找答案！\n\
  \n#### 图框架：TinkerPop\n\n图框架用于图数据建模和可视化。在本节中，我们将讨论 TinkerPop（ [www.tinkerpop.com/](http://www.tinkerpop.com/)\
  \ ）及其功能集。TinkerPop Blueprints 被许多 NoSQL 数据库（包括 Titan）用作规范。Blueprints 提供了一套用于图数据建模的接口和实现，将在本节稍后部分讨论。\n\
  \nTinkerPop 是一个开源图计算框架，包含多个组件、框架和命令行工具，用于处理图数据建模和可视化。在本节中，我们将逐一讨论它们。\n\n\n\n#####\
  \ Pipes\n\n`Pipes`是一个数据流框架，支持从输入到输出的数据拆分、合并、过滤和转换。计算以内存高效、惰性求值的方式执行。\n\n可以将`Pipes`视为由边连接的顶点，通常包含用于提取、转换和数据计算的函数。\n\
  \n##### Gremlin\n\n`Gremlin`是一种图遍历语言，用于图查询、分析和操作。`Gremlin`发行版内置了对 Java 和 Groovy\
  \ 的 API 支持。我们将在本章后面的“命令行工具和客户端”部分详细讨论`Titan`相关的`Gremlin`。\n\n##### Frames\n\n`Frames`将`Blueprints`图的元素暴露为\
  \ Java 对象。使用`Frames`时，无需以顶点和边的方式编写软件，而是以领域对象及其相互关系的方式来编写。\n\n##### Rexster\n\n`Rexster`是一个多功能的图服务器，它通过多种机制（主要侧重于\
  \ REST）暴露任何`Blueprints`图。它通过`REST API`和`RexPro`协议暴露图服务器。`RexPro`是`Rexster`的二进制协议，可用于将`Gremlin`脚本发送到远程的`Rexster`实例。脚本在服务器端处理，结果经过序列化后返回给调用客户端。它还提供了基于浏览器的界面工具，即`Dog\
  \ House`和`Rexster`控制台（将在`Titan`生态系统中讨论）。\n\n##### Furnace\n\n`Furnace`是一个属性图算法包。它提供了标准图分析算法的实现，这些算法可以以有意义的方式应用于属性图。`Furnace`提供了针对不同图计算场景（如单机图和分布式图）优化的不同图算法实现。\n\
  \n注意\n\n单机图涉及单个节点上的图数据，而分布式图的数据分布在多个节点上。\n\n##### Blueprints\n\n`Blueprints`，顾名思义，是一个具有已提供实现的属性图模型接口。实现了`Blueprints`接口的数据库会自动支持启用了`Blueprints`的应用程序。\n\
  \n可以将`Blueprints`视为图数据库的`JDBC`（Java 数据库连接）或`JPA`（Java 持久化 API）API。大多数图数据库都实现了`Blueprints`。图\
  \ 7-4 展示了如何将`Blueprints`与前面提到的`TinkerPop`组件关联起来的可视化表示。\n\n![A978-1-4842-0142-8_7_Fig4_HTML.jpg](img/A978-1-4842-0142-8_7_Fig4_HTML.jpg)\n\
  \n图 7-4. `TinkerPop Blueprints`实现\n\n至此，我们已经介绍了`TinkerPop`框架、其组件以及其他与图相关的概念。接下来的问题是，是否存在可以视为图数据库的基于图的解决方案。在下一节中，我们将回答这些问题。\n\
  \n#### 图作为数据库\n\n与传统的关系型数据库管理系统（RDBMS）相比，NoSQL 数据库更少关注模式，而更多关注数据的非规范化形式。然而，图数据库提供了通过边定义节点之间关系的灵活性，这就是为什么用\
  \ RDBMS 概念来理解它们很容易的原因。使用 RDBMS 构建类似图的查询当然是可能的，但如前所述，其用途非常有限。对于非图数据库，运行基于图的遍历查询或构建图结构的能力不受支持，并且构建起来可能很繁琐。由于固有的图数据结构支持，图数据库将比传统\
  \ RDBMS 更具优势。\n\nRDBMS 与图数据库之间的一些区别包括：\n\n- 使用图数据库无需索引查找，因为节点或顶点知道它们所连接的属性（例如边），而在\
  \ RDBMS 中我们需要依赖索引机制。\n- 通过边互连的两个顶点在属性上可能不同，并且可能动态演变，但 RDBMS 强制使用固定的模式集。\n- 在图数据库中，两个顶点之间的关系存储在记录级别，而在\
  \ RDBMS 中，它是在表级别定义的。\n\n我们需要记住的一点是，当前的应用程序开发时代是针对特定需求使用特定技术，这非常适合于构建多语言或混合解决方案。这意味着，如果您的需求最适合通过运行类似图的查询来满足，并且您的需求本身更适合基于图的快速模型，那么答案很简单：使用图数据库。图数据库使用节点和边及其属性来构建和存储图结构中的数据。图数据库中的每个元素都有一个指向相邻节点的引用，这意味着不需要索引查找。图\
  \ 7-4 展示了一个图数据库的示例，它将 Twitter 用户存储为节点，将他们的粉丝存储为边。每个节点包含`fname`、`id`、`lname`和`role`作为属性，而每条边都有一个属性来表示用户成为相邻节点（即用户）粉丝的日期。\n\
  \n![A978-1-4842-0142-8_7_Fig5_HTML.jpg](img/A978-1-4842-0142-8_7_Fig5_HTML.jpg)\n\
  \n图 7-5. 一个存储 Twitter 用户、其属性和粉丝的图数据库\n\n图 7-5 展示了用户`mevivs`、`chris_n`、`apress_team`和`melissa_m`的\
  \ Twitter 连接和粉丝图。这里，顶点`apress_team`被顶点`mevivs`和`melissa_m`关注。另一方面，`chris_n`和`apress_team`之间存在传递关系/遍历：`chris_n`关注`mevivs`，`mevivs`关注`apress_team`，并且`apress_team`关注`chris_n`。在“Gremlin\
  \ Shell”和“用例”部分，我们将引用同一个 Twitter 示例，在示例练习中探索命令行工具和 Java API。在考虑此类传递性图查询时，值得讨论的一点是，图数据库处理此类查询的方式与\
  \ SQL 查询不同。使用 SQL 处理此类传递性查询并不直接，需要执行复杂的连接、并集或交集操作。但使用图数据库处理此类传递性查询要容易得多，只需根据边的属性，跟随边进行传入和传出的数据查询即可。“用例”部分将讨论这些图遍历。\n\
  \n让我们来谈谈可用的图数据库。一些流行的图数据库包括：\n\n- Neo4J\n- OrientDB\n- Objectivity 的 InfiniteGraph\n\
  - Titan\n\n由于本章的目的是详细讨论 Cassandra 和 Titan 图数据库，我们将仅讨论这里提到的其他数据库提供的重要特性。\n\n#####\
  \ Neo4J\n\nNeo4J（[`www.neo4j.org/`](http://www.neo4j.org/)）是一个采用 GPU（通用公共使用）许可证的开源数据库。它由\
  \ Neo Technology Inc.开发。它以由有向边连接的节点形式存储数据。提供的一些重要特性包括：\n\n- 可扩展且高可用的数据\n- 完全的 ACID\
  \ 事务支持\n- 基于 REST 的访问\n- 支持 Cypher 和 Gremlin 图查询语言\n\n##### OrientDB\n\nOrientDB（[`www.orientechnologies.com/orientdb/`](http://www.orientechnologies.com/orientdb/)）是一个采用\
  \ Apache 2 许可证的 NoSQL 图数据库。它由 Orient Technologies 的 Luca Garulli 管理和开发。OrientDB\
  \ 提供的一些重要特性包括：\n\n- 基于 REST 的访问\n- 完全的 ACID 事务支持\n- 类似 SQL 的查询支持接口\n\n##### InfiniteGraph\n\
  \nInfiniteGraph（[`www.infinitegraph.com/`](http://www.infinitegraph.com/)）是一个由 Objectivity\
  \ Inc.构建的企业级分布式图数据库。InfiniteGraph 支持的一些重要特性包括：\n\n- 支持并发和一致性\n- 完全的 ACID 事务支持\n\
  - 一个可视化工具\n\n\n\n##### Titan\n\nTitan（`thinkaurelius.github.io/titan/`）是一个遵循 Apache\
  \ 许可的可扩展图数据库，旨在以节点和边的形式存储大量数据。它支持 Cassandra 作为后端存储。其一些重要特性包括：\n\n*   通过 Lucene/ES\
  \ 支持全文搜索和地理空间查询\n*   支持 ACID 事务\n*   最终一致性和中间一致性\n*   支持多种数据库，适用于多语言图应用\n*   支持\
  \ Gremlin 和 Cypher 查询语言\n\nTitan 及其各个组件将在后续章节中讨论。\n\n### Titan 图数据库\n\nTitan 是一个事务性图数据库，允许数千个并发用户实时执行复杂的图遍历查询。它还通过\
  \ Hadoop 集成提供了对图数据分析、报表和 ETL 的支持。Titan 内置了对 Elasticsearch 和 Lucene 的支持，用于地理空间查询和全文搜索，并且原生支持\
  \ Blueprint TinkerPop 图栈。\n\n图 7-6 展示了 Titan 生态系统的图形表示。\n\n![A978-1-4842-0142-8_7_Fig6_HTML.jpg](img/A978-1-4842-0142-8_7_Fig6_HTML.jpg)\n\
  \n图 7-6. Titan 生态系统\n\n#### 基本概念\n\n本节将介绍一些对理解 Titan 图数据库至关重要的基本概念。\n\n##### 以顶点为中心的索引\n\
  \n以顶点为中心的索引是针对特定顶点的。大多数引用或非引用顶点之间的遍历都是通过边或边属性进行的。为这些属性或边标签建立索引可以避免性能开销。此类索引也可称为本地索引。以顶点为中心的索引的目的是根据边的属性和标签对顶点的相邻边进行排序和索引。\n\
  \nTitan 还支持 Elasticsearch，它可以以独立模式或嵌入模式与 Titan 一起运行。借助 Elasticsearch，还可以执行全文搜索、地理空间查询和数值范围查询。Elasticsearch\
  \ 也允许我们查询未索引的属性。\n\n##### 边压缩\n\n通过边压缩，Titan 可以存储压缩的元数据并保持较低的内存占用。它还可以将所有边标签和属性存储在同一数据块中，以实现更快的检索。\n\
  \n##### 图分区\n\n这是底层数据库最为关键的地方。在 Cassandra 中，我们知道特定行的数据将存储在一个 Cassandra 节点上。Titan\
  \ 通过理解按顶点 ID 排序的键，可以有效地在 Cassandra 节点之间分区和分布图数据。顶点 ID 是一个 64 位的唯一值。\n\n默认情况下，Titan\
  \ 采用随机分区策略将顶点随机分配给节点。随机分区效率高，能保持集群平衡，但在采用多个后端存储选项来存储图的情况下，会导致性能问题，并需要跨数据库实例进行通信。使用\
  \ Titan，我们还可以配置显式分区。通过显式分区，我们可以控制并将遍历过的子图存储在同一个节点上。\n\n我们可以按如下方式在 Titan 中启用显式分区：\n\
  \n```\ncluster.partition = true\ncluster.max-partitions = 16\nids.flush = false\n\
  ```\n\n其中`cluster.max-partitions`是每个集群的最大分区数。此外，我们还需要禁用刷新 ID。\n\n当使用 Cassandra 作为存储后端选项时，必须使用`ByteOrderedPartitioner`进行配置。\n\
  \nTitan 将顶点及其相邻边和属性存储为一个集合。这种机制称为数据共置。通过这种机制，连接到一个顶点的边及其属性将被存储在一起。每一行将包含一个顶点 ID\
  \ 作为键，相邻边和属性作为单元格。这种数据表示格式在所有支持的数据库中都是通用的。\n\n图 7-7 和 7-8 展示了 Titan 的数据布局和边存储机制。（这些图片来自\
  \ Titan 维基页面：[`https://github.com/thinkaurelius/titan/wiki/Titan-Data-Model`](https://github.com/thinkaurelius/titan/wiki/Titan-Data-Model)，并在\
  \ Apache 许可证 2.0 版本下重复使用，许可证地址：[`www.apache.org/licenses/LICENSE-2.0`](http://www.apache.org/licenses/LICENSE-2.0)。）\n\
  \n![A978-1-4842-0142-8_7_Fig8_HTML.jpg](img/A978-1-4842-0142-8_7_Fig8_HTML.jpg)\n\
  \n图 7-8. Titan 的边存储机制\n\n![A978-1-4842-0142-8_7_Fig7_HTML.jpg](img/A978-1-4842-0142-8_7_Fig7_HTML.jpg)\n\
  \n图 7-7. Titan 的数据布局机制\n\n底层数据存储将每个顶点及其相邻边和属性存储为单行。这些行将按顶点 ID 排序，单元格将按属性和边键排序。动态单元格可以在运行时添加。数据共置非常重要，因此将顶点及其相邻边存储为单行有助于实现高可用性。\n\
  \n##### 后端存储\n\nTitan 的存储架构是完全解耦的，支持多种 NoSQL 数据库，包括：\n\n*   Cassandra\n*   HBase\n\
  *   BerkeleyDB\n*   Persistit\n\n支持多种 NoSQL 数据存储允许根据应用需求选择合适的数据库。换句话说，您可以根据特定需求选择特定技术。基于\
  \ CAP 定理，我们可以选择任何一个支持的数据库。\n\n使用 Titan，我们可以通过`storage.backend`选项动态配置后端存储。本章将介绍如何将它与\
  \ Cassandra 一起使用。\n\n##### 事务处理\n\nTitan 是一个事务性图数据库，因此每个读/写操作都在事务边界内进行。\n\n以下代码片段展示了\
  \ Titan 如何将顶点`mevivs`包裹在事务边界内并提交它：\n\n```\nTitanGraph g = TitanFactory.open(\"/home/vivek/Titan\"\
  );\nVertex mevivs = g.addVertex(null); //隐式包裹在事务内\nmevivs.setProperty(\"fname\"\
  , \"vivek\");\ng.commit(); //提交事务\n```\n\n在数据量非常大且采用多语言架构的情况下，可能会发生永久性或临时性故障。临时故障包括网络故障、节点无响应等场景。在这种情况下，我们可以像这样配置\
  \ Titan 的重试延迟属性：\n\n```\nConfiguration conf = new BaseConfiguration();\nconf.setProperty(\"\
  storage.attempt-wait \", 250); // 时间单位为毫秒\n```\n\n此类临时故障可以通过重试来处理，但永久性故障（例如硬件故障）需要用户显式处理`TitanException`：\n\
  \n```\ntry {\n    TitanGraph g = TitanFactory.open(\"/home/vivek/Titan\");\n   \
  \ Vertex mevivs = g.addVertex(null); //隐式包裹在事务内\n    mevivs.setProperty(\"fname\"\
  , \"vivek\");\n    g.commit(); //提交事务\n} catch (TitanException e) {\n    //配置显式重试或快速失败场景。\n\
  }\n```\n\n以上是 Titan 的基本概念和架构。接下来，我们将介绍 Titan 图数据库的安装与配置。\n\n#### 安装与配置\n\n我们可以从\
  \ [`https://github.com/thinkaurelius/titan/wiki/Downloads`](https://github.com/thinkaurelius/titan/wiki/Downloads)\
  \ 下载最新的 Titan 发行版。在撰写本文时，最新版本为 0.5.0。下载发行版后，将其解压到本地文件夹。在本章中，我们将在多处引用`TITAN_HOME`变量。我们可以按如下方式设置它：\n\
  \n```\nexport TITAN_HOME=/home/vivek/software/titan\n```\n\n#### 命令行工具和客户端\n\n完成安装和配置后，首先想到的问题是：是否有任何命令行客户端？就像\
  \ Cassandra 有 CQL Shell 一样，Titan 是否提供用于服务器端脚本编写和快速分析的选项？本节我们将探讨两个命令行选项：Gremlin Shell\
  \ 和 Rexster。\n\n\n\n#### Gremlin Shell\n\nTitan 支持通过 Gremlin Shell，使用 Gremlin 查询语言对图进行遍历和变更。它是一种函数式语言。每一步都会输出一个对象，通过\
  \ `.`（点号），我们可以调用其关联的函数。例如：\n\n```\ngremlin> conf = new BaseConfiguration() // 步骤\
  \ 1\n==>org.apache.commons.configuration.BaseConfiguration@2d3c117a\ngremlin> conf.setProperty(\"\
  storage.backend\", \"cassandrathrift\") // 步骤 2\n```\n\n这里 `conf` 是在步骤 1 中创建的 `Configuration`\
  \ 对象，其函数在步骤 2 中被调用。\n\n让我们通过一个练习来讨论 Gremlin。在本方法中，我们将使用相同的 Twitter 示例，其中用户的推文将被视为图的顶点，用户与其推文及关注者之间的关系则作为边。在此示例中，我们将使用\
  \ Cassandra 作为后端存储选项。你可以选择运行独立的 Cassandra 服务器；否则，默认情况下它会启动并连接到一个内嵌的服务器。\n\n接下来，我们需要初始化一个配置对象并设置一些\
  \ Cassandra 特有的属性：\n\n![A978-1-4842-0142-8_7_Fig9_HTML.jpg](img/A978-1-4842-0142-8_7_Fig9_HTML.jpg)\n\
  \n图 7-9. 连接到 Gremlin Shell\n\n首先，我们需要如图 7-9 所示连接到 Gremlin。\n\n```\ngremlin> conf\
  \ = new BaseConfiguration()\n==>org.apache.commons.configuration.BaseConfiguration@2d3c117a\n\
  gremlin> conf.setProperty(\"storage.backend\", \"cassandrathrift\")\n==>null\ngremlin>\
  \ conf.setProperty(\"storage.hostname\", \"localhost\")\n==>null\ngremlin> conf.setProperty(\"\
  storage.port\", \"9160\")\n==>null\ngremlin> conf.setProperty(\"storage.keyspace\"\
  , \"twitter\")\n==>null\n```\n\n接下来，获取一个 Titan 图对象：\n\n```\ngremlin> graph = TitanFactory.open(conf)\n\
  ==>titangraph[cassandrathrift:localhost]\n```\n\n让我们创建一些顶点键和边标签：\n\n```\ngremlin>\
  \ graph.makeKey(\"fname\").dataType(String.class).indexed(Vertex.class).make()\n\
  ==>fname\ngremlin> graph.makeKey(\"lname\").dataType(String.class).indexed(Vertex.class).make()\n\
  ==>lname\ngremlin> graph.makeKey(\"twitter_tag\").dataType(String.class).indexed(Vertex.class).make()\n\
  ==>twitter_tag\ngremlin> graph.makeKey(\"tweeted_at\").dataType(String.class).indexed(Vertex.class).make()\n\
  ==>tweeted_at\ngremlin> graph.makeLabel(\"has_tweeted\").make()\n==>has_tweeted\n\
  gremlin> tweet.setProperty(\"body\", \"Working on Cassandra book for apress\")\n\
  ==>null\ngremlin> tweet.setProperty(\"tweeted_at\", \"2014-09-21\")\n==>null\n```\n\
  \n这里 `fname`、`lname` 和 `twitter_tag` 是顶点键，标签 `has_tweeted` 将在下一步中用于边。\n\n让我们为用户和推文创建顶点：\n\
  \n```\ngremlin> vivs = graph.addVertex(null)\n==>v[4]\ngremlin> vivs.setProperty(\"\
  fname\", \"vivek\")\n==>null\ngremlin> vivs.setProperty(\"lname\", \"mishra\")\n\
  ==>null\ngremlin> vivs.setProperty(\"twitter_tag\", \"mevivs\")\n==>null\ngremlin>\
  \ graph.V(\"fname\",\"vivek\")\n==>v[4]\ngremlin> tweet = graph.addVertex(null)\n\
  ==>v[8]\n```\n\n接下来，在这两个顶点之间添加一条边：\n\n```\ngremlin> graph.addEdge(null, vivs, tweet,\
  \ \"has_tweeted\")\n==>e[2V-4-1E][4-has_tweeted->8]\n```\n\n让我们添加 `apress_team`\
  \ 作为用户，并建立和定义“vivek 关注了 apress_team”的关系边：\n\n```\ngremlin> apress = graph.addVertex(null)\n\
  ==>v[12]\ngremlin> apress.setProperty(\"fname\", \"apress\")\n==>null\ngremlin>\
  \ apress.setProperty(\"twitter_tag\", \"apress_team\")\n==>null\ngremlin> graph.addEdge(null,\
  \ vivs, apress, \"following\")\n==>e[3r-4-22][4-following->12]\n```\n\n我们可以通过键来查找顶点，如下所示：\n\
  \n```\ngremlin> vivek = graph.V('fname','vivek').next()\n==>v[4]\ngremlin> vivek.map()\n\
  ==>twitter_tag=mevivs\n==>lname=mishra\n==>fname=vivek\n```\n\n我们也可以从顶点 `vivek`\
  \ 获取所有具有 `has` 关系的出边：\n\n```\ngremlin> outVertex = vivek.out('has').next()\n==>v[8]\n\
  gremlin> outVertex.map()\n==>body=Working on Cassandra book for apress\n==>tweeted_at=2014-09-21\n\
  ```\n\n上述方法演示了如何使用 Gremlin 查询语言填充和遍历一个 Twitter 图应用。\n\n让我们讨论一下 Rexster REST API、Dog\
  \ House 和 Titan 服务器。\n\n#### Rexster：服务器、REST API 和 Dog House\n\n正如 TinkerPop 部分所讨论的，使用\
  \ REST API 和 Web 控制台，我们可以可视化和管理任何 Titan 图。在之前的方法中，我们讨论了下载并在本地机器上搭建 Titan 发行版。要启动\
  \ Titan 服务器、内嵌的 Elasticsearch 和 Cassandra，我们需要运行：\n\n`TITAN_HOME/bin/titan.sh`\n\
  \n接下来，要连接 REST API 和 Dog House，我们需要执行：\n\n`TITAN_HOME/bin/rexster-console.sh`\n\n\
  这将启动 Elasticsearch 并在端口 9300 上连接到 Elasticsearch 传输层，并使 Rexster 在端口 8184 上运行。REST\
  \ API 和 Dog House 控制台将在 `localhost:8182` 端口上启动（见图 7-10）。\n\n![A978-1-4842-0142-8_7_Fig10_HTML.jpg](img/A978-1-4842-0142-8_7_Fig10_HTML.jpg)\n\
  \n图 7-10. 启动 Rexster 服务器\n\n##### Rexster Dog House\n\n图 7-11 显示了 Dog House 控制台，其中包含仪表盘选项卡、浏览边和顶点的选项，以及内建的\
  \ Gremlin 命令行 Shell。\n\n![A978-1-4842-0142-8_7_Fig11_HTML.jpg](img/A978-1-4842-0142-8_7_Fig11_HTML.jpg)\n\
  \n图 7-11. Rexster Dog House Web 控制台\n\n内建的 Gremlin 命令行客户端允许你运行图的变更和遍历查询（本章前面已讨论过）。\n\
  \n让我们使用 Gremlin 查询语言探索存储在 Gremlin 方法中的图。我们可以使用“浏览顶点”（Browse Vertices）选项来分析顶点，如图\
  \ 7-12 所示。\n\n![A978-1-4842-0142-8_7_Fig12_HTML.jpg](img/A978-1-4842-0142-8_7_Fig12_HTML.jpg)\n\
  \n图 7-12. 浏览图顶点\n\n我们还可以进一步钻取特定顶点的属性（见图 7-13）。该图显示了顶点“vivek”的属性以及入边和出边。它有两个出边：“has”和“following”，分别指向推文顶点和\
  \ `apress_team` 顶点。\n\n![A978-1-4842-0142-8_7_Fig13_HTML.jpg](img/A978-1-4842-0142-8_7_Fig13_HTML.jpg)\n\
  \n图 7-13. 探索顶点“vivek”的属性与关系\n\n同样地，我们也可以探索边及其属性（见图 7-14 和图 7-15）。\n\n![A978-1-4842-0142-8_7_Fig15_HTML.jpg](img/A978-1-4842-0142-8_7_Fig15_HTML.jpg)\n\
  \n图 7-15. 探索标签为“has”的边\n\n![A978-1-4842-0142-8_7_Fig14_HTML.jpg](img/A978-1-4842-0142-8_7_Fig14_HTML.jpg)\n\
  \n图 7-14. 探索标签为“has”和“following”的边\n\n图 7-15 显示了边“has”的属性以及其连接的入边和出边顶点。顶点 `mevivs`\
  \ 和 `tweet` 通过边“has”连接，用通俗的话说就是“Vivek 发了一条推文！”\n\n我们还可以通过点击搜索图标来可视化图，这将呈现如图 7-16\
  \ 所示的可视化效果。\n\n![A978-1-4842-0142-8_7_Fig16_HTML.jpg](img/A978-1-4842-0142-8_7_Fig16_HTML.jpg)\n\
  \n图 7-16. 顶点和边的可视化\n\n该图展示了三个顶点和两条边的图形化表示。\n\n\n\n#### Rexster REST API\n\n我们也可以使用\
  \ REST API 查询 Titan 图数据库！例如，要获取所有顶点的列表，我们只需发起如下请求：\n\n`localhost:8182/graphs/$graph_name/vertices`\n\
  \n例如，我们可以获取 Twitter “图”的所有顶点列表，如图 7-17 所示。\n\n![A978-1-4842-0142-8_7_Fig17_HTML.jpg](img/A978-1-4842-0142-8_7_Fig17_HTML.jpg)\n\
  \n**图 7-17.** 使用 REST API 返回所有顶点列表\n\n我们还可以通过其 ID 查询特定顶点（见图 7-18）。\n\n![A978-1-4842-0142-8_7_Fig18_HTML.jpg](img/A978-1-4842-0142-8_7_Fig18_HTML.jpg)\n\
  \n**图 7-18.** 使用 ID 256 获取一个顶点\n\n所有支持的 REST 方法的完整列表可在 [`https://github.com/tinkerpop/rexster/wiki/Basic-REST-API`](https://github.com/tinkerpop/rexster/wiki/Basic-REST-API)\
  \ 找到。\n\n### Titan 与 Cassandra\n\n在本节中，我们将讨论使用 Cassandra 作为存储选项的 Titan 实现。本节将介绍如何使用\
  \ Titan Java API 及 Cassandra，并执行读写图等用例。\n\n#### Titan Java API\n\nTitan 是 Blueprints\
  \ 图接口的一种实现。Titan 提供了基于 Java 和 Groovy 的实现来访问 Titan。\n\nTitan Java API 的设置相当简单。对于后端存储，它依赖于其他数据库，因此要开始使用\
  \ Titan，我们只需添加：\n\n```\n<dependency>\n  <groupId>com.thinkaurelius.titan</groupId>\n\
  \  <artifactId>titan-all</artifactId>\n  <version>0.4.4</version>\n</dependency>\n\
  ```\n\n撰写本文时最新的 Titan 版本是 0.5.0。对于 Cassandra，Titan 依赖于 Netflix 的 Astyanax Thrift\
  \ 客户端。`TitanGraph` API 的最新版本支持 Astyanax 1.56.37 版本。请注意，如果项目中因其他 Cassandra 相关实现而使用了不同版本的\
  \ Astyanax Thrift，则可能会出现依赖问题。这意味着使用 Astyanax Thrift 客户端时，对 CQL 的支持也会非常有限。CQL3 特有的功能（例如集合）可能无法与此版本的\
  \ Astyanax 正常工作。\n\n当 Cassandra 在远程多节点机器上运行时，我们可以通过逗号分隔的 IP 地址列表，在 Titan 中配置这些远程节点。\n\
  \n#### Cassandra 作为后端存储\n\n如上所述，Cassandra 可以用作 Titan 的存储后端。在本节中，我们将配置 Titan 的存储选项（包括使用\
  \ Cassandra），并打开一个图实例。在接下来的“用例”部分，我们将通过一些简单练习，演示如何使用 Titan 与 Cassandra，例如对图进行读写操作。\n\
  \n首先，我们需要为 Titan 配置一些存储选项：\n\n```\nimport org.apache.commons.configuration.BaseConfiguration;\n\
  import org.apache.commons.configuration.Configuration;\nimport com.thinkaurelius.titan.core.TitanFactory;\n\
  import com.thinkaurelius.titan.core.TitanGraph;\nimport com.thinkaurelius.titan.core.TitanKey;\n\
  \nConfiguration conf = new BaseConfiguration();\nconf.setProperty(\"storage.backend\"\
  , \"cassandrathrift\");\nconf.setProperty(\"storage.hostname\", \"localhost\");\n\
  conf.setProperty(\"storage.port\", \"9160\");\nconf.setProperty(\"storage.keyspace\"\
  , \"twitter\");\n```\n\n表 7-1 概述并描述了我们在上一步中使用的配置属性。\n\n接下来，我们需要使用 `TitanFactory`\
  \ 打开一个图实例：\n\n**表 7-1.** Titan 配置属性\n\n| 属性 | 值 | 描述 |\n| --- | --- | --- |\n| `storage.backend`\
  \ | `cassandrathrift` | 使用 Cassandra 作为后端存储 |\n| `storage.hostname` | `localhost`\
  \ | Thrift 的 `listen_address`，根据你的 Cassandra 服务器设置修改。 |\n| `storage.port` | `9160`\
  \ | Thrift RPC 端口 |\n| `storage.keyspace` | `Twitter` | 用于 Titan 图存储的 Cassandra\
  \ 键空间 |\n\n```\nTitanGraph graph = TitanFactory.open(conf);\n```\n\n让我们通过一些用例（如读取、写入和批处理数据）进一步探索\
  \ Titan Java API 与 Cassandra 的结合使用。\n\n#### 用例\n\n在本节中，我们将讨论图的遍历、读取、写入和批处理。首先讨论一个顶点和连接边数量庞大的场景，这在处理大数据时非常常见。\n\
  \n##### 向图写入数据\n\n实例化一个图实例后，让我们探索如何将顶点及其关联边写入图中。我们将使用相同的 Twitter 示例，为用户、其推文及其关注者构建一个基于图的实现。\n\
  \n图 7-19 展示了一个我们将使用 `TitanGraph` API 实现的问题的表示。\n\n让我们向图中添加一个顶点：\n\n![A978-1-4842-0142-8_7_Fig19_HTML.jpg](img/A978-1-4842-0142-8_7_Fig19_HTML.jpg)\n\
  \n**图 7-19.** 用户 vivek 关注了 apress_team，并在 Twitter 上发布了关于其 Cassandra 书籍的推文\n\n```\n\
  Vertex vivs = graph.addVertex(null);\nvivs.setProperty(\"fname\", \"vivek\");\n\
  vivs.setProperty(\"lname\", \"mishra\");\nvivs.setProperty(\"twitter_tag\", \"mevivs\"\
  );\n```\n\n此处，`Vertex` 是一个来自 Blueprints 的 API。以下为上述代码片段的导入语句：\n\n```\nimport com.tinkerpop.blueprints.Direction;\n\
  import com.tinkerpop.blueprints.Vertex;\n```\n\n你可以将顶点视为 Java POJO，将其属性视为字段变量。\n\
  \n让我们为推文创建另一个顶点，并在用户和推文顶点之间定义一条边：\n\n```\nVertex tweet = graph.addVertex(null);\n\
  tweet.setProperty(\"body\", \"Working on Cassandra book for apress\");\ntweet.setProperty(\"\
  tweeted_at\", \"2014-09-21\");\ngraph.addEdge(null, vivs, tweet, \"has_tweeted\"\
  ); // 用户 vivs 拥有推文\n```\n\n我们还可以添加另一个顶点，并建立一个 `\"following\"` 关系：\n\n```\nVertex\
  \ apress = graph.addVertex(null);\napress.setProperty(\"fname\", \"apress\");\n\
  apress.setProperty(\"twitter_tag\", \"apress_team\");\ngraph.addEdge(null, vivs,\
  \ apress, \"following\"); // Vivs 正在关注 apress 团队\n```\n\n最后提交事务：\n\n```\ngraph.commit();\n\
  ```\n\n##### 从图读取数据\n\n让我们探索如何从 Titan 图读取顶点和属性：\n\n从图读取数据也非常简单，我们可以检索特定图的所有顶点，甚至特定的顶点：\n\
  \n```\nIterable<Vertex> vertices = graph.getVertices();\nIterator<Vertex> iter =\
  \ vertices.iterator();\n```\n\n我们可以像这样遍历每个顶点并检索关联的边：\n\n```\nwhile(iter.hasNext())\n\
  {\n    Vertex v = iter.next();\n    Iterable<Edge> keys = v.getEdges(Direction.BOTH);\n\
  \    ...\n}\n```\n\n每条边都有 IN 和 OUT 顶点，我们可以通过边来检索这些顶点：\n\n```\nfor(Edge key : keys)\n\
  {\n    System.out.print(key.getVertex(Direction.IN).toString()); // 将在控制台打印 vivs\n\
  \    System.out.print(\"=>\");\n    System.out.print(key.getLabel());\n    System.out.print(\"\
  =>\");\n    System.out.println(key.getVertex(Direction.OUT).toString()); // 将打印\
  \ tweets 或 apress\n}\n```\n\n上述对 Titan 图的读写操作为如何使用 Titan 与 Cassandra 提供了一个简单的范例。\n\
  \nCassandra 的核心在于大规模数据处理和分析。在使用基于 Cassandra 的图模型时，这一点也不例外。那么，使用 Titan 图数据库进行数据批处理呢？Titan\
  \ 确实支持批量数据处理，在下一个示例中，我们将探索如何使用 Titan Java API 进行批量加载。\n\n\n\n##### 批量加载\n\nTitan\
  \ 支持使用 `BatchGraph` API 进行批量加载，该 API 可视为 `TitanGraph` 的封装器，通过可配置参数来定义批量大小和顶点 ID\
  \ 类型。我们可以按如下方式创建 `BatchGraph` 实例：\n\n`BatchGraph bGraph = new BatchGraph<TITAN GRAPH\
  \ INSTANCE>,<VERTEX ID TYPE>,<BATCH SIZE>);`\n\n使用批量加载 API，我们只需单次数据库调用即可推送一批记录。这样，图数据的加载速度将始终更快。\n\
  \n接下来，我们通过一个 Java 示例来深入探讨 Titan 中的批量加载。在本例中，我们将从一个 `.csv` 文件中读取数据。\n\n图 7-20 展示了“用户\
  \ A 关注用户 B”格式的数据。每个用户都有 `fname`、`lname` 和 `twitter_tag` 作为顶点属性，边的标签为“following”，并包含一个属性值“Cassandra”。请注意，你可以在本书源代码的\
  \ `src/main/resources` 文件夹下找到示例 `.csv` 文件。\n\n![A978-1-4842-0142-8_7_Fig20_HTML.jpg](img/A978-1-4842-0142-8_7_Fig20_HTML.jpg)\n\
  \n图 7-20. 显示用户与关注者关系的表格\n\n按照以下步骤完成示例：\n\n首先，通用步骤是为 Cassandra 配置一个图：\n\n```\nimport\
  \ org.apache.commons.configuration.BaseConfiguration;\nimport org.apache.commons.configuration.Configuration;\n\
  import com.thinkaurelius.titan.core.TitanFactory;\nimport com.thinkaurelius.titan.core.TitanGraph;\n\
  import com.thinkaurelius.titan.core.TitanKey;\n\nConfiguration conf = new BaseConfiguration();\n\
  conf.setProperty(\"storage.backend\", \"cassandrathrift\");\nconf.setProperty(\"\
  storage.hostname\", \"localhost\");\nconf.setProperty(\"storage.port\", \"9160\"\
  );\nconf.setProperty(\"storage.keyspace\", \"batchprocess\");\nconf.setProperty(\"\
  storage.batch-loading\", \"true\");\n```\n\n让我们使用 `FileReader` 加载示例 `.csv` 文件：\n\
  \n```\nFile file = new File(\"src/main/resources/bulk_load.csv\");\nBufferedReader\
  \ reader = new BufferedReader(new FileReader(file));\n```\n\n接下来，创建一个图实例，并用 `BatchGraph`\
  \ 进行封装：\n\n```\nTitanGraph graph = TitanFactory.open(conf);\nBatchGraph bgraph =\
  \ new BatchGraph(graph, VertexIDType.STRING, 1000);\n```\n\n这里的 1000 是批量大小，顶点 ID\
  \ 为字符串类型。\n\n现在，让我们将每个顶点属性定义为顶点键，将每条边的属性定义为标签键：\n\n```\n// 为每个属性准备顶点键\nKeyMaker\
  \ maker = graph.makeKey(\"twitter_tag\");\nmaker.dataType(String.class);\nmaker.make();\n\
  graph.makeKey(\"fname\").dataType(String.class).make();\ngraph.makeKey(\"lname\"\
  ).dataType(String.class).make();\n\n// 将边属性准备为标签\nLabelMaker labelMaker = graph.makeLabel(\"\
  contentType\");\nlabelMaker.make();\ngraph.makeLabel(\"following\").make();\n```\n\
  \n这里 `TitanKey` 和 `LabelKey` 是 Titan Java API 提供的类，用于准备顶点和边的键。\n\n现在，让我们从文件中逐行读取，并提取顶点和边属性：\n\
  \n```\nwhile (reader.ready())\n{\n    String line = reader.readLine();\n    StringTokenizer\
  \ tokenizer = new StringTokenizer(line, \",\");\n    while (tokenizer.hasMoreTokens())\n\
  \    {\n        // System.out.println(tokenizer.nextToken());\n        // twitter_tag,fname,lname,twitter_tag,fname,lname,edgeName,edgeProperty\n\
  \        final String in_twitter_tag = tokenizer.nextToken();\n        final String\
  \ in_fname = tokenizer.nextToken();\n        final String in_lname = tokenizer.nextToken();\n\
  \        final String out_twitter_tag = tokenizer.nextToken();\n        final String\
  \ out_fname = tokenizer.nextToken();\n        final String out_lname = tokenizer.nextToken();\n\
  \        final String edgeName = tokenizer.nextToken();\n        final String edgeProperty\
  \ = tokenizer.nextToken();\n        ...\n    }\n}\n```\n\n现在，在外部 `while` 循环（参见步骤\
  \ 5）中创建入顶点和出顶点，并按如下方式分配边：\n\n```\n//入顶点\nVertex in = bgraph.addVertex(Math.random()\
  \ + \"\");\nin.setProperty(\"twitter_tag\", in_twitter_tag);\nin.setProperty(\"\
  fname\", in_fname);\nin.setProperty(\"lname\", in_lname);\n\n//出顶点\nVertex out =\
  \ bgraph.addVertex(Math.random() + \"\");\nout.setProperty(\"twitter_tag\", out_twitter_tag);\n\
  out.setProperty(\"fname\", out_fname);\nout.setProperty(\"lname\", out_lname);\n\
  \n//分配边\nbgraph.addEdge(null, in, out, edgeName);\n```\n\n最后，在成功从 `.csv` 文件读取所有记录并填充\
  \ `BatchGraph` 后，我们可以调用 `commit`：\n\n```\nbgraph.commit();\n```\n\n这里的批量大小是指在图上调用\
  \ commit 之前要加载的顶点和边的数量。我们需要留意的是，设置一个适中的批量大小，以避免在处理拥有数百万或数十亿条边的大型图时出现堆空间问题。\n\n#####\
  \ 超级节点问题\n\n在现实世界中，基于大数据的图可能非常庞大，并且可能存在一组具有极高关联边数的顶点。在图论中，这样的顶点被称为超级节点。由于存在如此多的复杂路径，对图的随机遍历可能会导致我们遇到此类超级节点，从而严重影响系统性能。\n\
  \n图 7-21 展示了我（Vivek）的 LinkedIn 社交图谱，其中标记的顶点可被称为超级节点。\n\n![A978-1-4842-0142-8_7_Fig21_HTML.jpg](img/A978-1-4842-0142-8_7_Fig21_HTML.jpg)\n\
  \n图 7-21. Vivek 的 LinkedIn 图谱\n\n例如，如果我需要遍历某个特定群组（例如 graphDB）的所有连接，那么不带索引的此类遍历会导致性能问题。通过按标签对关联边进行索引，此类查找将快得多。\n\
  \n例如，如果我们想查找 Vivek 所有加入了“graphDB”群组的朋友，进行随机遍历将需要搜索 Vivek 的每一个连接，然后扫描他每个朋友所加入的群组。想象一下\
  \ Vivek 在 LinkedIn 上拥有大量连接。可以预见，在这种情况下，随机遍历要找到期望结果简直是一场噩梦。但是，使用标签索引查询，速度将快得多：\n\n\
  ```\ng.query().has(\"friends of\", EQUAL, \"vivek\").has(\"group\", EQUAL, \"graphDB\"\
  ).vertices();\n```\n\n此查询是一个标签索引查询，它使用“friends of”标签搜索 Vivek 的所有朋友，然后使用“group”索引边搜索剩余子集中属于\
  \ graphDB 群组的人。\n\n我们将在本章的下一节进一步探讨这一点。\n\n\n\n#### 更快的深度遍历\n\n深度遍历意味着访问图中层级结构的第\
  \ `n` 层。以我之前 LinkedIn 社交图谱的例子为例，我可以查询我的联系人以寻找共同的群组兴趣。根据数据量和关联边的数量，通过顶点查询逐个迭代每个顶点可能不是一个好主意。Titan\
  \ 支持多顶点查询，可以将多个顶点查询合并为一个组合查询发送给图数据库。这样一来，数据检索速度会快得多，因为我们只需访问服务器一次。\n\n让我们通过一个名为《罗摩衍那》的印度神话史诗，来探索如何使用\
  \ Titan 中的多顶点查询实现更快的深度遍历。在这个例子中，我们将尝试在叶节点级别查找`父子`关系。图 7-22 展示了罗摩及其祖先的家谱。\n\n![A978-1-4842-0142-8_7_Fig22_HTML.jpg](img/A978-1-4842-0142-8_7_Fig22_HTML.jpg)\n\
  \n图 7-22. 罗摩衍那家庭图谱\n\n在每一层查找`父子`关系的一种方法是像这样逐层遍历：\n\n```\nprivate static void iterateToLeaf(Vertex\
  \ dasratha)\n{\n    System.out.println(\"Finding sons for::\" + dasratha.getProperty(\"\
  fname\"));\n    Iterable<Vertex> immediateSons = dasratha.getVertices(Direction.IN,\
  \ \"son of\");\n    Iterator<Vertex> iter = immediateSons.iterator();\n    // one\
  \ way is\n    while (iter.hasNext())\n    {\n        Vertex v = iter.next();\n \
  \       // recursive call\n        iterateToLeaf(v);\n    }\n}\n```\n\n在上述代码片段中，我们需要用根顶点对象（即\
  \ `dasaratha`）进行调用，然后递归调用将遍历每一层的每个顶点。对于较小的图这可能可行，但对于大数据和大数据图来说，这不是一个可行的解决方案。这时，多顶点查询就变得非常有用且高效。\n\
  \n接下来，我们将通过几个代码片段来了解如何使用 Titan 执行多顶点查询。你可以在随附的源代码中找到完整的 `GraphTraversalRunner.java`\
  \ 示例。\n\n首先，将 `dasaratha` 添加为根顶点：\n\n```\nVertex das = add(\"fname\", \"dasaratha\"\
  , graph);\n\nprivate static Vertex add(final String propertyName, final String value,\
  \ TitanGraph graph)\n{\n    Vertex vertex = graph.addVertex(null);\n    vertex.setProperty(propertyName,\
  \ value);\n    return vertex;\n}\n```\n\n接下来，添加达萨拉塔（dasaratha）的儿子：\n\n```\n// add\
  \ dasratha's son.\nVertex ram = addSon(\"fname\", \"ram\", graph, das);\nVertex\
  \ laxman = addSon(\"fname\", \"laxman\", graph, das);\nVertex bharat = addSon(\"\
  fname\", \"bharat\", graph, das);\nVertex shatrugna = addSon(\"fname\", \"shatrugna\"\
  , graph, das);\n\nprivate static Vertex addSon(String propertyName, String value,\
  \ TitanGraph graph, Vertex father)\n{\n    Vertex son = add(propertyName, value,\
  \ graph);\n    graph.addEdge(null, son, father, \"son of\");\n    return son;\n\
  }\n```\n\n为 `ram`、`laxman`、`bharat` 和 `shatrugna` 重复步骤 2：\n\n```\n// ram's son\n\
  addSon(\"fname\", \"luv\", graph, ram);\naddSon(\"fname\", \"kush\", graph, ram);\n\
  // bharat's son\naddSon(\"fname\", \"Daksha\", graph, bharat);\naddSon(\"fname\"\
  , \"Pushkala\", graph, bharat);\n// laxman's son\naddSon(\"fname\", \"Angada\",\
  \ graph, laxman);\naddSon(\"fname\", \"Chanderkedu\", graph, laxman);\n// Shatrugna's\
  \ son\naddSon(\"fname\", \"Shatrugadi\", graph, shatrugna);\naddSon(\"fname\", \"\
  Subahu\", graph, shatrugna);\n```\n\n最后存储完整的层级结构：\n\n```\ngraph.commit();\n```\n\
  \n现在，为了利用多顶点支持，获取所有具有 `Direction.IN`（表示入边）且标签为 `son of` 的顶点，我们需要执行以下查询：\n\n```\n\
  //prepare multi vertex query\nTitanMultiVertexQuery mq = graph.multiQuery();\nmq.direction(Direction.IN).labels(\"\
  son of\");\nmq.addVertex((TitanVertex) das);// add root\nmq.addVertex((TitanVertex)\
  \ ram);\nmq.addVertex((TitanVertex) bharat);\nmq.addVertex((TitanVertex) laxman);\n\
  mq.addVertex((TitanVertex) shatrugna);\n//execute multi vertex query\nMap<TitanVertex,\
  \ Iterable<TitanVertex>> dfsResult = mq.vertices();\n//iterate through result and\
  \ print\nfor (TitanVertex key : dfsResult.keySet())\n{\n    System.out.println(\"\
  Finding son of\" + key.getProperty(\"fname\"));\n    Iterable<TitanVertex> sons\
  \ = dfsResult.get(key);\n    Iterator<TitanVertex> sonIter = sons.iterator();\n\
  \    while (sonIter.hasNext())\n    {\n        System.out.println(sonIter.next().getProperty(\"\
  fname\"));\n    }\n}\n```\n\n通过这种方式，我们可以使用 Titan 实现更快的深度遍历。\n\n我们已经介绍了 Titan 图数据库支持的大部分重要特性。本章分享的示例代码片段应能让读者使用\
  \ Titan 与 Cassandra 配合，例如构建社交图谱、网络图谱或运行类似图的查询。就图数据库的未来而言，下一章将讨论一份关于图数据库领域正在进行的积极开发的报告。\n\
  \n至此，我们结束了对图数据库以及 Titan 如何与 Cassandra 集成的讨论。有关更多详细信息和所支持的特性集，请参阅 [`https://github.com/thinkaurelius/titan/wiki`](https://github.com/thinkaurelius/titan/wiki)。\n\
  \n### 总结\n\n总结一下，本章涵盖的主题包括：\n\n- 图简介\n- 理解 TinkerPop 和 Blueprints\n- Titan 数据库生态系统\n\
  - Titan 与 Cassandra\n\n下一章将介绍 Cassandra 可用的性能调优和压缩技术。\n\n"
- "# 8. Cassandra 性能调优\n\n随着存储硬件在容量方面变得更便宜、更高效，组织能够为其数 TB 的数据选择更便宜、维护成本更低的存储方案。显然，成本效益一直是技术选型背后的重要因素。大数据的存储和检索是需求，但经济的解决方案不应以牺牲性能为代价。数据，无论大小，如果不能有效使用并应用分析，就毫无价值。\n\
  \n从实际的大数据相关用例中获得的经验证明，许多组织和初创公司正在围绕大数据探索商业想法。对于面向在线受众的公司来说，实时数据流需求巨大。如今的应用程序每秒钟需要处理和分析数\
  \ GB 的数据，这清楚地表明性能是现代大数据应用的重要组成部分。\n\n在本章中，我们将讨论\n\n- 关键性能指标\n- Cassandra 缓存配置\n\
  - 讨论布隆过滤器和垃圾回收\n- Cassandra 压力测试\n- Yahoo Cloud Serving Benchmark（YCSB）基准测试\n\n\
  ### 理解关键性能指标\n\n本节将讨论几个关键性能指标（KPI），包括：\n\n- CPU 和内存消耗\n- 高读写吞吐量和延迟\n- 逻辑读取和物理读取\n\
  \n性能不一致或性能下降是应用程序需要进行性能调优的主要问题。这时需要从前端应用程序和后端数据库的性能角度进行调优。\n\n首先，让我们初步了解几个 KPI，这些指标将指导我们如何配置\
  \ Cassandra 以提升性能。\n\n\n\n#### CPU 与内存利用率\n\n从性能角度来看，CPU 和内存利用率非常重要。有许多工具（如 `JConsole`、`JProfile`\
  \ 和 `YourKit`）可通过监控 CPU 和内存占用情况来监测应用性能。值得一提的是，许多 Cassandra 服务器进程会占用堆外内存；因此，在为本地运行在同一台机器上的应用调优堆配置时，我们需要确保不发生内存不足或泄漏，从而避免应用不稳定。堆空间配置过小会触发频繁的垃圾回收活动。完全避免垃圾回收周期是不可能的，但我们可以对其进行调优以获得更好的响应时间。例如，将年轻代设置得较大可以容纳更多活跃对象，但会导致较长的\
  \ GC（垃圾回收）周期。通常，针对年轻代对象的垃圾回收活动速度较快，对响应时间的开销几乎可以忽略不计。但 Full GC 是一种“停止所有事件”的操作，会严重影响应用的性能。我们需要确保为\
  \ Eden 空间以及内存池中的后续临时空间和永久空间分配适当的内存。建议设置较小的永久代空间。\n\n#### 高读写吞吐量与延迟\n\n讨论大数据处理，关键就在于“言行一致”。应用必须能够以更快的速度进行数据摄入和读取，无论数据量大小如何。读写延迟是性能监控和调优的另一个重要方面。现代应用要求以最小延迟实现实时或近实时数据处理。因此，在采用技术和数据库时，我们必须牢记这一点，以避免此类性能开销。\n\
  \n#### 逻辑读取与物理读取\n\n逻辑读取是指从数据缓存中读取行，而物理读取则涉及磁盘访问。逻辑读取次数偏高往往意味着较大的内存占用；同样，频繁的物理读取会引入读取延迟，并可能导致性能开销。因此，在两者之间取得平衡至关重要。Cassandra\
  \ 提供了行缓存和键缓存，以及 `memtables` 来减少物理读取。我们将在本章中详细讨论这些内容。\n\n接下来，让我们讨论各种 Cassandra 特有的配置。在本章后半部分，我们还将涵盖前端应用的性能监控和调优。\n\
  \n### Cassandra 配置\n\nCassandra 提供了多种配置，可用于针对高读写负载进行调整。让我们从缓存配置开始，逐一探索它们。\n\n####\
  \ 数据缓存\n\n数据缓存将频繁访问的行保存在内存中，以避免在服务器端进行磁盘访问。在 N 层架构中，数据缓存也可以在客户端实现（例如 `Ehcache`）。数据缓存的概念并不新鲜，传统的关系型数据库管理系统（RDBMS）也具备此功能。数据缓存对读取操作非常有用，建议对频繁获取的数据采用数据库级别的缓存。Cassandra\
  \ 同时提供了键缓存和行缓存。图 8-1 展示了在从 Cassandra 数据库读取数据时，这些缓存如何工作的流程图。\n\n![A978-1-4842-0142-8_8_Fig1_HTML.jpg](img/A978-1-4842-0142-8_8_Fig1_HTML.jpg)\n\
  \n图 8-1.  \nCassandra 服务器在收到读取请求时缓存的工作方式\n\n行缓存和键缓存有助于检索最常使用的行。保持适中大小的行缓存和较多的键缓存可以获得更好的性能和更低的延迟。让我们来讨论这些与\
  \ Cassandra 相关的缓存配置。\n\n##### 缓存目录\n\n默认的缓存位置是 `/var/lib/cassandra/saved_caches`。我们也可以在\
  \ `cassandra.yaml` 中修改它：\n\n`saved_caches_directory: /var/lib/cassandra/saved_caches`\n\
  \n##### 键缓存\n\n使用键缓存，实际行键的引用将被缓存在内存中，每个列族对应一个缓存。对于高负载的、基于读取的应用，建议设置较大的键缓存——当然要在\
  \ JVM 设置允许的范围内。可以在 `cassandra.yaml` 中配置的各种键缓存配置如下表 8-1 所示。\n\n表 8-1.  \n键缓存配置\n\n\
  | 名称 | 描述 |\n| --- | --- |\n| `key_cache_size_in_mb` | 键缓存大小，以兆字节为单位。默认值为堆的 5% 或\
  \ 100MB（取两者中较小值）。可以将其设置为 0 来禁用。 |\n| `key_cache_save_period` | 将键缓存保存到配置的缓存目录的时间周期。默认值为\
  \ 4 小时。 |\n| `key_cache_keys_to_save` | 要保存的键数量，默认是禁用的，但建议将其设置为一个较大的值。 |\n\n从 2.0\
  \ 版本开始，键缓存已移至堆外，这显著减少了键序列化所花费的时间。我们将在本章后面讨论堆外与堆内。如前所述，内存利用率是性能的关键指标之一，在配置行缓存时，我们必须避免\
  \ Full GC 活动，无论键缓存现在是否已移至堆外。\n\n#### `populate_io_cache_on_flush`\n\n默认情况下，该参数是禁用的，设置为\
  \ `false`。在 Cassandra 1.2.x 之前，它仅在节点级别支持，但现在可以在列族级别启用。此标志的目的是在 `memtable` 刷新和压缩期间启用/禁用列族的页面缓存。如果设置为\
  \ `true`，它将把特定列族的数据缓存保留在内存中。如第 1 章所述，`memtables` 会持续将数据以 `sstables` 的形式刷新到磁盘。如果此参数设置为\
  \ `true`，Cassandra 会为该列族的所有行保留页面缓存。请注意，页面缓存仅在刷新和压缩时更新，以保持该节点上相应列族的数据为最新。用户需要确保数据大小能够很好地适应节点内存。我们可以在创建表或修改现有表时启用它：\n\
  \n```\ncreate table tweets(tweet_id text primary key,body text) with caching='rows_only'\
  \ and bloom_filter_fp_chance=0.004 and populate_io_cache_on_flush='true';  // 创建表\n\
  \nalter table user with populate_io_cache_on_flush='true'; // 修改表\n```\n\n建议对于频繁查询且能够很好地适应内存以获得更好读取吞吐量的列族，将此参数保持为\
  \ `true`。图 8-2 显示了用户创建的表，该属性已设置为 `true`（见标记行）。\n\n![A978-1-4842-0142-8_8_Fig2_HTML.jpg](img/A978-1-4842-0142-8_8_Fig2_HTML.jpg)\n\
  \n图 8-2.  \n启用了 `populate_io_cache_on_flush` 并设置为 `true` 的用户表\n\n\n\n#### 行缓存\n\n\
  启用行级缓存后，整行数据都可在缓存中获取。与键级缓存相比，行缓存需要占用大量空间。从 Cassandra 1.2 开始，行缓存可以移至堆外，但行的反序列化仍会临时在堆内进行。表\
  \ 8-2 展示了若干行缓存配置及其说明。\n\n**表 8-2.** 行缓存配置\n\n| 名称 | 说明 |\n| --- | --- |\n| `row_cache_size_in_mb`\
  \ | 默认禁用，设为 0。 |\n| `row_cache_save_period` | 默认禁用行缓存，启用它可改善冷启动性能，但缓存可能代价高昂且耗费大量内存。\
  \ |\n| `row_cache_keys_to_save` | 默认禁用。要保存的行缓存键的数量。 |\n\n对于频繁访问的行，行缓存非常有用，能显著减少磁盘读取。但它也消耗大量空间。如果应用程序的需求是经常获取完整行而非选择列，则建议启用行缓存。\n\
  \n要为特定列族启用缓存，可以在创建列族时进行如下设置：\n\n```\ncreate table user(user_id text primary key,fname\
  \ text) with caching='keys_only';\ncreate table tweets(tweet_id text primary key,body\
  \ text) with caching='rows_only';\n```\n\n在上述脚本中，`user` 列族启用了键缓存，而 `tweets` 表启用了行缓存。建议在应用程序需要读取整行而不是选定列时启用行缓存。显然，如果采用选定列的方式，启用行缓存会产生负面影响，并且会因为无故将行保留在内存中而浪费内存空间。\n\
  \n以下代码片段展示了如何在 `Cassandra.yaml` 文件中配置这些缓存参数：\n\n```\n# 缓存中保存的键大小为 50 MB。\nkey_cache_size_in_mb:\
  \ 50\n# 键在缓存中保留的时间为 5 分钟或 3600 秒\nkey_cache_save_period: 3600\n# 在键缓存中保存 100 个键\n\
  key_cache_keys_to_save: 100\n# 在缓存中保留 100 MB 的行\nrow_cache_size_in_mb: 100\n# 行在缓存中保留的时间为\
  \ 5 分钟或 3600 秒。\nrow_cache_save_period: 3600\n# 要从行缓存中保存的键数量为 100。\nrow_cache_keys_to_save:\
  \ 100\n# 保存缓存的目录。\nsaved_caches_directory: /var/lib/cassandra/saved_caches\n```\n\
  \n#### 布隆过滤器\n\n布隆过滤器是一种数据结构，用于判断某个元素是否存在于集合中。它由 Burton Bloom 于 1970 年提出，用于找出元素是否存在某个集合中的概率。启用布隆过滤器后，它能返回元素“绝对不在集合中”或“可能存在于集合中”。误报（FP）意味着元素实际不在集合中，但可能显示为存在；漏报则意味着元素实际存在，但被判断为绝对不在集合中。\n\
  \nCassandra 中的每个表都包含一个布隆过滤器。通过设置误报概率值，它检查 SSTable 中某行可能存在的列，但漏报是绝对不可能的。这里的漏报意味着行的列确实存在，但布隆过滤器返回了不存在的结论。\n\
  \n将布隆过滤器的误报概率设置得更高意味着更少的内存消耗，并确保不会发生漏报（例如，对不存在的键不会进行磁盘 I/O）。布隆过滤器误报概率的范围是 0.000744\
  \ 到 1.0。将误报概率设置得更高的结果是，在 SSTable 中找到某列的可能性存在，但对于否定场景不会进行磁盘读取。\n\n你可以在创建列族时设置布隆过滤器，或者像这样更新列族：\n\
  \n```\ncreate table tweets(tweet_id text primary key,body text) with caching='rows_only'\
  \ and bloom_filter_fp_chance=0.004;\nalter table user with bloom_filter_fp_chance=0.004;\n\
  ```\n\n#### 堆外内存 vs. 堆内内存\n\n堆外内存是指直接从操作系统分配内存，而堆内内存对象则由 JVM 自身管理。Cassandra 也将行缓存和键缓存加载到堆外内存中，这意味着这些对象在非\
  \ Java 堆上进行序列化。这样，反序列化速度会快得多。\n\n建议将堆大小保持适中，因为堆仅从系统内存中分配内存。经验表明，最好将其保持在 6 GB 以下（如果系统内存大于\
  \ 6 GB）。你可以通过 Java 运行时获取 `maxMemory`：\n\n```\nRuntime rTime = Runtime.getRuntime();\n\
  long maxSize = rTime.maxMemory();\n```\n\n如果系统内存小于 2 GB，建议保留系统内存的 50%。\n\nCassandra\
  \ 需要安装 Java Native Access (JNA) 库来实现缓存的堆外内存分配。\n\n要启用 JNA 库，你需要从 [`https://github.com/twall/jna`](https://github.com/twall/jna)\
  \ 下载 `JNA.jar` 并将其设置在类路径中。仅此而已！\n\n我们还可以在 `cassandra.yaml` 中设置堆外内存分配器：\n\n```\n\
  memory_allocator: NativeAllocator\n可能的值为 NativeAllocator, JEMallocAllocator。\n```\n\
  \n要安装 JEMallocAllocator，你需要下载并安装 jemalloc 库。jemalloc 的源代码可在 GitHub 上获取（[`https://github.com/jemalloc/jemalloc`](https://github.com/jemalloc/jemalloc)）。\n\
  \n##### 安装和配置 jemalloc\n\n安装 jemalloc 的步骤如下：\n\n首先，从 GitHub 克隆并下载源代码：\n\n```\ngit\
  \ clone https://github.com/jemalloc/jemalloc.git\n```\n\n将目录更改为 `jemalloc` 并运行 `configure`：\n\
  \n```\ncd jemalloc\n./configure\n```\n\n接着，通过运行以下命令进行安装：\n\n```\nmake\nmake install\n\
  ```\n\n成功安装 `jemalloc` 后，我们需要在 `cassandra-env.sh` 中为 Cassandra 配置已安装的库：\n\n```\n\
  export JEMALLOC_HOME= jemalloc/\nexport LD_LIBRARY_PATH=<JEMALLOC_HOME>/lib/\nJVM_OPTS=\"\
  $JVM_OPTS -Djava.library.path=<JEMALLOC_HOME>/lib/\"\n```\n\n##### 垃圾回收\n\nCassandra\
  \ 会执行显式垃圾回收，可以通过监控服务器日志中的 `GCInspector` 类获取更多信息。你也可以选择使用 `XX:+DisableExplicitGC`\
  \ 禁用显式垃圾回收，但建议仅出于实验目的进行此操作。或者，配置 `gcInterval` 设置也是一种选择（`sun.rmi.dgc.server.gcInterval`\
  \ 和 `sun.rmi.dgc.client.gcInterval`）。它表示 Java 运行时 RMI（远程方法调用）对未使用和软引用调用垃圾回收的最大间隔（以毫秒为单位）。默认设置为\
  \ 1 小时。\n\n我们可以在 `$CASSANDRA_HOME/conf` 文件夹中的 `cassandra-env.sh` 中调整垃圾回收设置。部分选项如下：\n\
  \n```\n# GC 日志记录选项 -- 取消注释以启用\nJVM_OPTS=\"$JVM_OPTS -XX:+PrintGCDetails\"\nJVM_OPTS=\"\
  $JVM_OPTS -XX:+PrintGCDateStamps\"\nJVM_OPTS=\"$JVM_OPTS -XX:+PrintHeapAtGC\"\n\
  JVM_OPTS=\"$JVM_OPTS -XX:+PrintTenuringDistribution\"\nJVM_OPTS=\"$JVM_OPTS -XX:+PrintGCApplicationStoppedTime\"\
  \nJVM_OPTS=\"$JVM_OPTS -XX:+PrintPromotionFailure\"\nJVM_OPTS=\"$JVM_OPTS -XX:PrintFLSStatistics=1\"\
  \nJVM_OPTS=\"$JVM_OPTS -Xloggc:/var/log/cassandra/gc-`date +%s`.log\"\n# 如果你使用 JDK\
  \ 6u34 7u2 或更高版本，可以启用 GC 日志轮转\n# 如果启用了轮转，不要在日志名称中包含日期。\nJVM_OPTS=\"$JVM_OPTS -Xloggc:/var/log/cassandra/gc.log\"\
  \nJVM_OPTS=\"$JVM_OPTS -XX:+UseGCLogFileRotation\"\nJVM_OPTS=\"$JVM_OPTS -XX:NumberOfGCLogFiles=10\"\
  \nJVM_OPTS=\"$JVM_OPTS -XX:GCLogFileSize=10M\"\n```\n\n\n\n#### 提示移交\n\n当写入一行数据时，如果一个或多个副本节点宕机或不可用，此功能会非常有用。在这种情况下，协调节点会在\
  \ `system.hints` 表中保留一份数据副本，直到副本节点恢复运行。通常这是一个很好的特性，但如果多个节点发生此类故障，则会增加协调节点的堆大小。`system.hints`\
  \ 表保存了副本节点的 IP 地址以及需要在副本节点恢复时重放的实际数据。在引导过程中，系统表会被加载到内存中，因此故障数量越多，意味着协调节点内存中的数据量越大。这种情况还可能导致数据丢失（直到修复为止）。默认情况下，此功能是启用的。禁用它可能会使堆大小相对较小，并减少垃圾回收活动。但为了确保写入的持久性，建议保持启用状态。默认情况下，协调节点会将数据在\
  \ `system.hints` 表中保留 3 小时，即 `Cassandra.yaml` 文件中 `max_hint_window_in_ms` 配置项的默认值。如果副本节点在此配置的时间窗口内未能恢复，它将被视为死节点，稍后当它恢复时，需要运行修复并从其他节点复制数据。\n\
  \n#### 堆大小配置\n\n通常，对于应用程序，建议将堆大小保持在 4–8 GB 范围内；但如果内存小于 4 GB，我们仍应将其中的一半（约 2 GB）用于\
  \ I/O 操作。你可以在 `cassandra-env.sh`（查找 `JVM_OPTS`）中修改 JVM 设置以配置堆大小。\n\n```\nJVM_OPTS=\"\
  $JVM_OPTS $JVM_EXTRA_OPTS\" -Xms1G  -Xmx1G  -XX:+HeapDumpOnOutOfMemoryError  -XX:+UseParNewGC\
  \  -XX:+UseConcMarkSweepGC\n```\n\n### Cassandra 压力测试\n\nCassandra 压测是一个基于 Java\
  \ 的工具，用于测试服务器在高读写负载下的性能。在二进制发行版中，它位于 `$CASSANDRA_HOME/tools/bin` 目录下。压力测试最常用的选项是：\n\
  \n- 仅写入\n- 仅读取\n- 搜索范围切片\n\n该压力测试工具旨在监控数据库在高读取、高写入以及通过非主键列进行读取时的性能。用户可以使用各种可用参数，根据自身需求通过此工具实验和分析\
  \ Cassandra 的能力。要搜索此工具的所有可用选项，可以使用帮助选项：\n\n```\n$CASSANDRA_HOME/tools/bin/cassandra-stress\
  \ -h\n```\n\n#### 写入模式\n\n让我们从默认模式开始，即写入模式，我们将使用此工具对 Cassandra 服务器进行压力测试。使用这种模式，我们将创建一个预定义列大小和总写入操作数的列族。\n\
  \n让我们从一条简单的命令开始，执行仅写入模式：\n\n```\n$CASSANDRA_HOME/tools/bin/cassandra-stress\n```\n\
  \n此命令的输出将类似于图 8-3。\n\n![A978-1-4842-0142-8_8_Fig3_HTML.jpg](img/A978-1-4842-0142-8_8_Fig3_HTML.jpg)\n\
  \n**图 8-3.** 在默认写入模式下运行压力工具的输出\n\n从图 8-3 所示的输出中需要监控的几个关键点包括：\n\n-   `total_op_rate`：操作总数。\n\
  -   `interval_op_rate`：该时间间隔内执行的操作数。\n-   `interval_key_rate`：该时间间隔内写入的行数。\n-  \
  \ `latency median`：该时间间隔内每次操作的平均写入延迟。\n-   `total_operation_time`：运行期间花费的总秒数。\n\n\
  这里默认的主机和端口分别是 `localhost` 和 `9160`。默认情况下，要插入的记录数量为一百万。\n\n你也可以按如下方式覆盖默认主机、端口和记录数量：\n\
  \n```\n$CASSANDRA_HOME/tools/bin/cassandra-stress -n <记录数> -d <主机> -p <端口>\n```\n\
  \n运行此压力测试所需的总时间约为 50 秒。\n\n让我们快速连接到 CQL3 以验证已存储的行。该压力测试将创建一个名为 `\"Keyspace1\"` 的默认键空间和一个名为\
  \ `\"Standard1\"` 的表。要获取插入行总数的计数，我们可以运行以下命令：\n\n```\nuse \"Keyspace1\" ;\n```\n\n\
  ```\nselect count(*) from \"Standard1\" limit 10000000;\n```\n\n图 8-4 显示了结果。\n\n\
  ![A978-1-4842-0142-8_8_Fig4_HTML.jpg](img/A978-1-4842-0142-8_8_Fig4_HTML.jpg)\n\n\
  **图 8-4.** 查找通过压力工具创建的 `Standard1` 列族中记录总数的 CQL 查询\n\n读者可以使用 `describe` 命令来描述默认的列及其数据类型。这里默认的列数为\
  \ 5，并且所有列的类型都是 `blob`。\n\n与其他默认值类似，也可以覆盖列数、大小、族类型、线程数和随机行键生成。让我们通过分别使用 20 和 30 个线程运行\
  \ `insert` 来检查示例输出。\n\n**使用 20 个线程**\n\n```\n$CASSANDRA_HOME/tools/bin/cassandra-stress\
  \ -d localhost -p 9160 -o insert -t 20 -r -S 50 -U UTF8Type -y Standard\n```\n\n\
  ```\n中间 80% 值的平均值：\ninterval_op_rate          : 16657\ninterval_key_rate       \
  \  : 16657\n延迟中位数                : 2.8\n延迟 95% 分位数            : 11.5\n延迟 99.9% 分位数\
  \          : 646.7\n总操作时间                : 00:01:01\n结束\n```\n\n图 8-5 显示了使用 20 个线程时的\
  \ CPU 使用率、堆和其他资源利用率的 JConsole 概览图。\n\n![A978-1-4842-0142-8_8_Fig5_HTML.jpg](img/A978-1-4842-0142-8_8_Fig5_HTML.jpg)\n\
  \n**图 8-5.** 使用 20 个线程的 JConsole 图表\n\n**使用 30 个线程**\n\n```\n$CASSANDRA_HOME/tools/bin/cassandra-stress\
  \ -d localhost -p 9160 -o insert -t 30 -r -S 50 -U UTF8Type -y Standard\n```\n\n\
  ```\n中间 80% 值的平均值：\ninterval_op_rate          : 18467\ninterval_key_rate       \
  \  : 18467\n延迟中位数                : 0.5\n延迟 95% 分位数            : 2.8\n延迟 99.9% 分位数\
  \          : 122.8\n总操作时间                : 00:01:04\n```\n\n图 8-6 显示了使用 30 个线程时的\
  \ CPU 使用率、堆和其他资源利用率的 JConsole 概览图。\n\n![A978-1-4842-0142-8_8_Fig6_HTML.jpg](img/A978-1-4842-0142-8_8_Fig6_HTML.jpg)\n\
  \n**图 8-6.** 使用 30 个线程的 JConsole 图表\n\n使用不同数量的线程，可以清楚地看到参数在资源利用率和性能方面可能有所不同。建议使用压力测试根据应用程序的服务等级协议来监控系统的极限。\n\
  \n#### 读取模式\n\n使用读取模式，我们来测试 Cassandra 服务器用于繁重的仅读取操作。在这里，我们将对 Cassandra 服务器执行压力测试，以监控其在不同参数下的性能。\n\
  \n启动读取压力测试的最简单命令是：\n\n```\n$CASSANDRA_HOME/tools/bin/cassandra-stress -o read\n\
  ```\n\n图 8-7 显示了结果。\n\n![A978-1-4842-0142-8_8_Fig7_HTML.jpg](img/A978-1-4842-0142-8_8_Fig7_HTML.jpg)\n\
  \n**图 8-7.** 在高读取操作下运行压力工具的输出\n\n运行读取压力测试所需的总时间略高于写入压力测试。由于我们已经尝试调整了其他参数（如写入模式下的列大小、列数和线程数）的压力测试，这里我们将留给读者作为练习，尝试使用读取模式提供的可用选项。\n\
  \n\n\n#### 监控\n\n要监控压力测试的进度，您可以使用 `jmxterm` 或 `JConsole` 来监控内存使用和线程。图 8-8 展示的是前一次读取模式运行时在\
  \ `JConsole` 中捕获到的图像。\n\n![A978-1-4842-0142-8_8_Fig8_HTML.jpg](img/A978-1-4842-0142-8_8_Fig8_HTML.jpg)\n\
  \n**图 8-8.**\n读取模式运行期间，在 `JConsole` 中捕获到的图像\n\n关于如何配置 `JConsole` 并将其连接到 Cassandra\
  \ 的更多细节，请参考第 1 章。\n\n对于第三方工具，DataStax 的 OpsCenter 提供了关于运行中 Cassandra 集群的详细信息。关于\
  \ DataStax OpsCenter 使用的更多细节，请参考 [`www.datastax.com/what-we-offer/products-services/datastax-opscenter`](http://www.datastax.com/what-we-offer/products-services/datastax-opscenter)。\n\
  \n#### 压缩策略\n\n在进行 Cassandra 压力测试期间，我们观察到 Cassandra 的写入速度极快。背后的原因是没有更新操作，所有列都会直接刷新到\
  \ `sstables` 中。这意味着在某些时候，会存在多个版本的列值，它们可能以多个 `sstables` 的形式存在。同样，物理删除也不会实时发生，但这些行会立即被逻辑删除。这种行被称为墓碑行或过时行。移除这些列并释放服务器端空间的过程称为压缩。\n\
  \n压缩总是在后台以异步模式运行。Cassandra 提供了两种压缩策略：\n\n- 大小分级压缩策略\n- 层级压缩策略\n\n##### 大小分级压缩策略\
  \ (STCS)\n\n大小分级压缩策略 (STCS) 是默认的压缩策略。基于配置 `min_compaction_threshold`（默认为 4），大小相似的\
  \ `sstables` 会被合并并压缩到一个表中。显然，对于写入量大而读取/更新操作不多的场景，这是首选策略。尽管特定行键的所有数据都会位于同一数据节点上，但它们仍然可能分散在多个\
  \ `sstables` 中。使用这种压缩策略，很可能在压缩过程完成之前，对相同列进行冗余压缩。对于同一行键频繁更新的场景，STCS 作为压缩策略可能会出现问题。\n\
  \n##### 层级压缩策略 (LCS)\n\n层级压缩策略 (LCS) 的实现深受 Google LevelDB 的启发 ([`http://code.google.com/p/leveldb`](http://code.google.com/p/leveldb))。LCS\
  \ 的目的是避免对行键的列进行冗余压缩。使用 LCS，每层 `sstables` 都不会重叠，从而保证了读取时数据的一致性。每提升一级，压缩过程就会进行，并将前一层的\
  \ `sstables` 添加进来。这里需要足够的空间来将最大的一层保留在内存中。LCS 比 STCS 执行更多的 I/O 操作。\n\n您可以在创建表时这样定义层级压缩策略：\n\
  \n```\ncreate table tweets(tweet_id text primary key,body text) with caching='rows_only'\
  \ and compaction\n='LeveledCompactionStrategy' and populate_io_cache_on_flush='true';\
  \  // 创建表\n```\n\n如果读取比例与较高的写入比例相当，或者预期会有频繁的更新，则建议使用 LCS。\n\n### Yahoo 云服务基准测试\n\
  \nYahoo 云服务基准测试 (YCSB) 项目是评估各种云数据存储和键值数据存储的行业标准，它通过并行执行多种工作负载来进行评估。该项目由雅虎研究实验室于\
  \ 2010 年发布，托管在 [`https://github.com/brianfrankcooper/YCSB`](https://github.com/brianfrankcooper/YCSB)。\n\
  \nYCSB 是完全解耦且可扩展的，可以轻松添加任何新数据库的特定客户端。\n\n配置和运行 YCSB 相当简单。在本节中，我们将讨论如何为 Cassandra\
  \ 配置 YCSB 框架。\n\n首先，您可以从源代码构建 JAR 包，或者从以下链接下载压缩包：\n\n[`https://github.com/downloads/brianfrankcooper/YCSB/ycsb-0.1.4.tar.gz`](https://github.com/downloads/brianfrankcooper/YCSB/ycsb-0.1.4.tar.gz)\n\
  \n解压压缩包并切换目录：\n\n`cd ycsb-0.1.4`\n\n默认情况下，YCSB 会将数据插入到 `usertable` 键空间下的 `data`\
  \ 表中。因此，请在 `Cassandra-cli` 中运行以下命令来创建数据定义：\n\n```\ncreate keyspace usertable;\n\
  use usertable;\ncreate column family data;\n```\n\n接下来，创建一个包含以下属性的属性文件（例如 `Cassandra-ycsb.properties`）：\n\
  \n```\nhosts=localhost\nport=9160\nfieldcount=4\nthreads=9\nrecordcount=1000\noperationcount=1000\n\
  workload=com.yahoo.ycsb.workloads.CoreWorkload\nreadallfields=true\nreadproportion=0.5\n\
  updateproportion=0.5\nscanproportion=0\ninsertproportion=0\n```\n\n这里，`hosts` 和\
  \ `port` 是 Cassandra Thrift 主机和 `rpc_port` 设置。`fieldcount` 是每行要存储的字段总数。`threads`\
  \ 决定了并行执行的数量。同时，`readproportion` 和 `updateproportion` 可在测试期间进行调整。例如，对于仅大量写入的场景，您可以将\
  \ `insertproportion` 设置为 1.0，其余设置为 0.0！类似地，对于大量读取的场景，可以将 `readproportion` 设置为 1.0。\n\
  \n最后，运行此命令：\n\n`bin/ycsb load cassandra-10 -P /home/vivek/source/book_source/ycsb/casssandra-ycsb.properties\
  \ -threads 10`\n\n运行上述命令的输出会相当庞大。图 8-9 展示了从性能角度来看比较有趣的部分。\n\n![A978-1-4842-0142-8_8_Fig9_HTML.jpg](img/A978-1-4842-0142-8_8_Fig9_HTML.jpg)\n\
  \n**图 8-9.**\n使用 YCSB Cassandra 项目运行负载的输出\n\n在图 8-9 中，关键点是平均吞吐量和延迟。在此次运行中，每秒有 4291\
  \ 次操作，总计 1000 次操作的延迟为 1545 微秒。\n\nYCSB 提供了一种从客户端角度评估数据库的绝佳方式。您可以快速分析多个客户端针对 Cassandra\
  \ 的性能。或者，您也可以用它来比较多个数据存储之间的性能。该框架是完全解耦的，这使得为新的数据存储添加客户端，或为同一数据存储添加多个客户端变得相当容易。\n\
  \n回到通过 YCSB 进行读取操作分析，我们可以这样运行：\n\n`bin/ycsb run cassandra-10 -P /home/vivek/source/book_source/ycsb/casssandra-ycsb.properties\
  \ -threads 10`\n\nYCSB 有两种模式：加载模式和运行模式。使用加载模式时，它会将数据存储到后端，并测量吞吐量和延迟。而在运行模式下，我们可以针对大量读取或读/更新比例进行调整（参见\
  \ `Cassandra-ycsb.properties`）。\n\nYCSB 提供了两种分布类型：齐夫分布和均匀分布。连续均匀分布指的是每个间隔内每个列的数据对称分布。而齐夫分布基于幂律分布，其中负载和吞吐量成反比。关于齐夫分布的更多细节，请参考\
  \ [`http://en.wikipedia.org/wiki/Zipf's_law`](http://en.wikipedia.org/wiki/Zipf's_law)。\n\
  \n### 总结\n\n在本章结束时，这里有一些关键的性能检查点，用于判断应用程序的吞吐量是否随时间持续下降：\n\n- 监控 GC 并检查 Cassandra\
  \ 服务器日志中的 `GCInspector` 类。\n- 如果数据节点空间不足，请添加新节点。我们将在下一章进一步讨论这一点。\n- 监控 `bloom_filter_fp_chance`\
  \ 和缓存配置。\n\n在下一章中，我们将详细介绍更多的 Cassandra 管理和监控内容。\n\n\n\n"
- '# 9. Cassandra：管理与监控


  数据库管理意味着管理一系列活动，例如确保数据库可用性、安全管理、性能调优和备份。然而，“管理”的具体细节已经发生了显著变化。


  在 NoSQL 世界发展之前，数据库管理员（DBA）被认为是团队中最关键的成员之一。但随着 NoSQL 的普及，管理工作的投入以及对专职数据库管理员团队的需求已大幅减少。在第
  1 章中，我们讨论了从关系型数据库管理系统（RDBMS）向 NoSQL 世界的转变。让我们重新回顾一下其中几个关键差异：


  -   无连接（No joins）

  -   无关系型模式（No relational schema）

  -   无静态模式（No static schema）


  这意味着，至少从应用设计角度来看，管理工作确实减少了，开发人员和 DBA 之间“谁搞崩了服务器”的争吵可能很快就会消失。


  但这并不意味着完全不需要数据库管理。NoSQL 代表“不仅是 SQL”（Not only SQL），而不是“非 SQL”（No SQL）。我们可能需要在应用建模上投入更少的精力，但核心问题如安全性、性能调优等，仍然需要处理。对于传统的关系型数据库管理系统（RDBMS），我们可能将应用逻辑嵌入到数据库层面，而对于
  NoSQL，目前通常不需要这样做，或者至少不常需要。然而，随着 NoSQL 世界的发展和成熟，将需要更多的管理工作来管理那些比添加索引和创建表更重要、更复杂的事物。


  本章将涵盖以下主题：


  -   向 Cassandra 集群添加新节点

  -   替换节点

  -   数据库备份与恢复

  -   监控工具


  ### DBA 技能


  随着数据库世界的变化，理解管理员所需的技能集很重要。为了进行正确且有效的数据库管理，需要具备以下基本技能：


  -   能够基于提供的逻辑蓝图设计和建模数据库。

  -   熟练掌握数据库备份和恢复流程的管理。

  -   能够管理数据完整性及其高可用性。

  -   确保数据安全的技能。数据库管理员负责管理不同环境（如测试环境、预发布环境和生产环境）中的数据安全层。


  ### 向 Cassandra 集群添加节点


  在第 1 章中，我们讨论了在单台机器上配置一个三节点的 Cassandra 集群。在本节中，我们将首先启动一个包含两个节点的 Cassandra 集群，然后添加另一个节点。


  首先，对于 `RandomPartitioner`，让我们使用令牌生成器工具为所有三个节点生成初始令牌（tokens）。该工具可以在 `$CASSANDRA_HOME/tools/bin`
  目录下找到。


  ```

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ tools/bin/token-generator

  RandomPartitioner

  令牌生成器交互模式

  --------------------------------

  有多少个数据中心将参与此 Cassandra 集群？ 1

  数据中心 #1 中有多少个节点？ 3

  数据中心 #1：

  节点 #1:                                                0

  节点 #2:   56713727820156410577229101238628035242

  节点 #3:  113427455640312821154458202477256070484

  ```


  这里 `software/local-cluster/node1` 代表 `$CASSANDRA_HOME`。如果您选择使用 `Murmur3Partitioner`，可以通过执行以下命令来生成令牌值：


  ```

  python -c ''print [str(((2**64 / 3) * i) - 2**63) for i in range(3)]''

  ```


  它将输出：


  ```

  [''-9223372036854775808'', ''-3074457345618258603'', ''3074457345618258602'']

  ```


  下一步是配置三个节点以建立集群。关于如何设置的详细说明，请参考第 1 章中的“在单台机器上配置多节点”部分。简而言之，我们需要在相应的 `cassandra.yaml`
  中修改 `listen_address`、`rpc_port`、`jmx_port`、数据目录、提交日志目录和 `native_protocol` 等配置。


  让我们启动这两个节点并检查环（ring）状态：


  ```

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node2$ bin/nodetool -h 127.0.0.2
  -p 7200 ring

  数据中心: datacenter1

  ==========

  地址      机架       状态   状态   负载         拥有      令牌

  -3074457345618258603

  127.0.0.1  rack1       Up     Normal  36.06 KB     100.00%    -9223372036854775808

  127.0.0.2  rack1       Up     Normal  45.06 KB     100.00%    -3074457345618258603

  ```


  您可以看到这两个节点都已启动并运行。


  让我们启动第三个节点并检查环状态：


  ```

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool ring

  数据中心: datacenter1

  ==========

  地址      机架       状态   状态   负载         拥有      令牌

  3074457345618258602

  127.0.0.1  rack1       Up     Normal  36.06 KB     66.67%     -9223372036854775808

  127.0.0.2  rack1       Up     Normal  45.06 KB     66.67%     -3074457345618258603

  127.0.0.3  rack1       Up     Normal  43.7 KB      66.67%     3074457345618258602

  ```


  所有三个节点都已启动并运行。至此，我们完成了在运行的 Cassandra 集群上添加节点的示例练习。借助 Cassandra 的环拓扑和对等（peer-to-peer）架构，让一个节点即时加入变得非常简单。此外，除了生成初始令牌值，我们也可以使用虚拟节点（virtual
  nodes）进行设置。


  在 Cassandra 1.2 版本发布之前，我们需要使用令牌生成器工具为每个数据节点手动分配一个令牌范围，但现在借助虚拟节点，我们可以为每个节点分配多个令牌范围。使用
  `num_tokens` 属性，我们可以为每个数据节点分配多个虚拟节点，这意味着每个节点持有大量更小的数据范围。当我们需要替换或重建一个死节点时，这非常方便。


  死节点是指一个节点变得无法响应与其他节点的八卦（gossip）/内部通信。这种故障可能由网络或硬件故障引起。每个节点都可以是分布在 Cassandra 集群上的数据的主节点或副本节点。当一个死节点准备重新加入
  Cassandra 环时，它必须从副本节点流式传输所有数据。如果没有虚拟节点，连续的令牌分配会引入大量开销，因为数据需要从多个主节点和副本节点流式传输。而使用虚拟节点，分配给每个节点的令牌数量更多，意味着数据分布更小、更异构，这意味着相同数量的数据可以从多个节点同时流式传输进来！显然，这将快得多。


  让我们通过一个示例练习来探索如何用新节点替换死节点。




  '
- '# 替换故障节点


  集群中有时会出现少量故障节点。也就是说，它们无法响应 gossip 协议，需要用新节点进行替换。在正在运行的 Cassandra 集群中替换故障节点很简单。我们通过一个延续上一节的示例练习来探讨。


  首先，让我们关闭节点 2 并检查环状态：


  ```

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool ring


  Datacenter: datacenter1

  =======================

  Address    Rack        Status State   Load         Owns        Token

  3074457345618258602

  127.0.0.1  rack1       Up     Normal  50.44 KB     66.67%      -9223372036854775808

  127.0.0.2  rack1       Down   Normal  54.82 KB     66.67%      -3074457345618258603

  127.0.0.3  rack1       Up     Normal  71.09 KB     66.67%      3074457345618258602

  ```


  你可以看到节点 2（`127.0.0.2`）已宕机，状态显示为 `Down`。


  让我们配置一个新节点，并为其分配一个令牌值，该值将 `127.0.0.2` 的令牌减一（即 `-3074457345618258604`）。然而，在启动新节点之前，让我们运行一些命令来修复并移除故障节点：


  ```

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool rebuild

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool removenode
  fd733376-0cf0-49af-bd0b-79ab526350f8

  ```


  这里，`fd733376-0cf0-49af-bd0b-79ab526350f8` 是节点 2 的主机 ID。你可以通过运行 `nodetool status`
  命令获取每个节点的主机 ID。


  最后，启动上一步中配置好的新节点，并检查环状态：


  ```

  vivek@vivek-Vostro-3560:∼/software/local-cluster/node1$ bin/nodetool status


  Datacenter: datacenter1

  =======================

  Status=Up/Down

  |/ State=Normal/Leaving/Joining/Moving

  --  Address    Load       Tokens  Owns (effective)  Host ID                               Rack

  UN  127.0.0.4  78.66 KB   256     66.7%             cdcecd4b-ac26-4763-99c4-9f757c2d8074  rack1

  UN  127.0.0.1  50.44 KB   1       66.7%             8718be22-ed20-43ca-95c1-701864bb1e20  rack1

  UN  127.0.0.3  71.09 KB   1       66.7%             0039bf7e-4e9c-4028-b3b6-1d027aedc690  rack1

  ```


  在这里，你可以看到节点 4（`127.0.0.4`）已启动并加入了集群环。


  你一定在想节点 2（`127.0.0.2`）发生了什么！一旦你让节点 2 启动并运行，它会自动替换替代节点（即节点 4）。每当节点 2 启动并加入环时，它会从节点
  4 那里收回所有权。查看节点 2 的服务器日志以获取更多信息（参见图 9-1）。


  ![A978-1-4842-0142-8_9_Fig1_HTML.jpg](img/A978-1-4842-0142-8_9_Fig1_HTML.jpg)


  图 9-1. 从替代节点（即 `127.0.0.4`）收回所有权


  ### 数据备份与恢复


  数据库备份意味着定期在安全位置保存一份副本。如果发生自然灾害或硬件丢失，可以使用备份来恢复数据库。由于数据库的可扩展性和性能不应以数据丢失为代价，Cassandra
  也提供了对备份和恢复的支持。


  使用 Cassandra 备份数据可以通过创建快照来实现。Cassandra 提供了一种使用 `nodetool` 实用程序收集数据快照的机制。我们已经在当前章节和前一章节中讨论过这个实用程序（第
  10 章将详细介绍 `nodetool` 和其他 Cassandra 相关实用程序）。当集群启动并运行时，可以对整个键空间进行快照。但只有通过关闭集群节点才能进行恢复。


  ### 使用 `nodetool snapshot` 和 `sstableloader`


  发出 `snapshot` 命令会将所有 memtable 数据刷新并复制到磁盘，然后准备与已刷新的 sstable 的硬链接。


  让我们通过一个示例练习来讨论。


  首先，让我们准备模式并填充一些数据：


  ```

  create keyspace sample_backup with replication = { ''class'':''SimpleStrategy'',''replication_factor'':2};  //
  创建键空间

  use sample_backup ; // 设置键空间


  // 创建表

  create table twitter(hashtag timeuuid primary key, account_name text, tweets set<text>);


  // 插入记录

  insert into twitter(hashtag,account_name,tweets) values(now(),''apress_pub'',{''New
  book on Cassandra is out''});

  insert into twitter(hashtag,account_name,tweets) values(now(),''thenews'',{''Obama
  meeting with European allies on Ukraine http://t.co/l8P8bPcbom from #APress'',''Bergdahl
  uproar halts plan for return celebration http://t.co/BhF6kMy5pW from #APress''});

  ```


  使用 `select` 命令验证记录是否已成功持久化：


  ```

  select * from twitter;


  hashtag                              | account_name | tweets

  --------------------------------------+--------------+--------------------------------------------------------------------------------------------------------------------------------------------------

  12da45f0-2702-11e4-861b-9d03f52e8a2b |   apress_pub | {''New book on Cassandra is
  out''}

  74dc73e0-2702-11e4-861b-9d03f52e8a2b |      thenews | {''Bergdahl uproar halts plan
  for return celebration http://t.co/BhF6kMy5pW from #APress'', ''Obama meeting with
  European allies on Ukraine http://t.co/l8P8bPcbom from #APress''}


  (2 rows)

  ```


  要创建快照，我们需要使用 `nodetool` 实用程序：


  ```

  nodetool -h localhost -p 7199 snapshot twitter

  Requested creating snapshot for: twitter

  Snapshot directory: 1408816064473

  ```


  输出显示，在本地节点上运行 `nodetool snapshot` 已创建一个快照 `1408816064473`，位于 `$CASSANDRA_DATA_DIR/twitter/users`
  文件夹下。这里 `$CASSANDRA_DATA_DIR` 是在 `Cassandra.yaml` 文件中为 `data_file_directories` 属性定义的值（参见图
  9-2）。


  为了删除一些数据以便我们稍后恢复，让我们先清空 `users` 表：


  ![A978-1-4842-0142-8_9_Fig2_HTML.jpg](img/A978-1-4842-0142-8_9_Fig2_HTML.jpg)


  图 9-2. 数据目录下的快照目录 `1408816064473`


  ```

  truncate users;

  ```


  通过步骤 4，我们已清空了数据，现在让我们尝试调用数据恢复。Cassandra 有多种启动恢复的方法。首先，让我们探索使用 `sstableloader` 实用程序进行恢复。首先，我们需要将
  `Snapshot` 目录中的所有 `.db` 文件复制到一个与数据库模式（即 keyspace/tablename）同步的文件夹中。在我们的例子中，它应该是
  `twitter` 下的 `users` 文件夹（`/home/vivek/twitter/users`）。接下来，让我们执行恢复实用程序：


  ```

  $CASSANDRA_HOME/bin/sstableloader -d localhost  /home/vivek/twitter/users

  ```


  这里 `/home/vivek/twitter/users` 是包含所有备份的 `.db` 文件的本地文件夹。值得一提的是，这些快照数据也可以用于使用 Hadoop
  MapReduce 作业进行批量分析。你可以使用 `org.apache.cassandra.db.OnDiskAtom` 和 `org.apache.cassandra.io.sstable.SSTableIdentityIterator`
  插入自定义的记录读取器实现。运行上述命令后，你将在控制台上看到以下输出：


  ```

  Established connection to initial hosts

  Opening sstables and calculating sections to stream

  Streaming relevant part of /home/vivek/vivek/twitter/users/twitter-users-jb-1-Data.db
  to [/127.0.0.1, /127.0.0.2, /127.0.0.3]

  progress: [/127.0.0.2 1/1 (100%)] [/127.0.0.3 1/1 (100%)] [total: 100% - 0MB/s (avg:
  0MB/s)]

  ```


  完成后，我们可以通过运行 `select` 命令来验证数据是否已恢复：


  ```

  select * from twitter.users;


  user_id | age | name

  ---------+-----+-------

  ckbrown |  32 | chris

  mevivs |  34 |

  ```




  #### 使用 nodetool refresh


  另一种恢复数据的方法是使用 `nodetool refresh` 工具。与 `sstableloader` 方法的不同之处在于，你需要手动将 `.db` 文件复制到
  Cassandra 数据目录中。图 9-3 展示了已复制 sstable 的结构。


  ![A978-1-4842-0142-8_9_Fig3_HTML.jpg](img/A978-1-4842-0142-8_9_Fig3_HTML.jpg)


  图 9-3. Cassandra 数据目录中已复制的 sstable


  然后运行 `nodetool refresh` 命令：


  ```

  vivek@vivek-Vostro-3560:∼$ $CASSANDRA_HOME/bin/nodetool refresh twitter users

  ```


  这里传递给 `nodetool refresh` 命令的参数是 keyspace（键空间）后跟表名。这将刷新数据，可以通过运行 `select` 命令来验证。


  #### 使用 clearsnapshot


  出于备份目的定期拍摄快照会占用大量磁盘空间；因此，也需要不时地清理过时的快照。我们可以通过如下方式使用 `nodetool clearsnapshot` 命令定期清理快照目录：


  ```

  vivek@vivek-Vostro-3560:∼$ $CASSANDRA_HOME/bin/nodetool -h localhost -p 7199 clearsnapshot

  ```


  上述命令将清理所有 keyspace 中的快照目录。我们也可以像这样清理一个或多个 keyspace 的快照目录：


  ```

  /home/vivek/software/local-cluster/node1/bin/nodetool -h localhost -p 7199 clearsnapshot
  twitter anotherkeyspace

  ```


  这里，`twitter` 和 `anotherkeyspace` 是被选中的要清理快照目录的 keyspace。


  在本节中，我们了解了如何使用各种工具执行数据库备份和恢复过程。接下来，我们将讨论各种监控工具。


  ### Cassandra 监控工具


  系统监控是分析和收集系统状态的过程。尽管 Cassandra 是分布式且具有容错性的，但它也取决于如何用于构建应用程序。必须定期关注的一些关键问题包括：


  -   性能

  -   数据访问

  -   监控节点状态


  有许多监控工具可用于分析数据和 Cassandra 的特性。其中一些流行的工具有：


  -   Helenos

  -   JConsole

  -   nodetool

  -   DataStax DevCenter 和 OpsCenter


  我们已经在第 1 章中讨论过如何使用 JConsole 进行监控和日志记录（请参阅“通过 JConsole 管理日志”部分）。第 10 章将更详细地介绍各种 Cassandra
  工具，包括 `nodetool`。它主要用于 Cassandra 监控，并包含其他操作，其中一些我们在本章前面已经使用过，例如 `removenode` 和 `refresh`。


  在本节中，我们将讨论用于常规监控的 Helenos 以及 DataStax DevCenter 和 OpsCenter。


