  \\n\");\n    try\n    {\n      fos.write(sb.toString().getBytes());\n    }\n   \
  \ catch (IOException e)\n    {\n      // 记录错误\n    }\n    count++;\n  }\n  while\
  \ ((query = result.nextQuery()) != null);\n}\n```\n\n运行这段代码将在当前目录下存储一个推文文件。\n\n\
  本章中所有示例的源代码均可通过本书的下载资源获取。上述代码片段的完整源代码位于 `com.apress.chapter5.mapreduce.twittercount.hdfs.DefaultTwitterService`。\n\
  \n\n\n#### 将推文存储到 HDFS\n\n接下来，将推文存储到 HDFS。你还需要安装并配置好 Hadoop。本示例将使用 Hadoop 单节点设置，这也是我们首先要做的。\n\
  \n设置的基本步骤如下：\n\n- 下载 Hadoop tarball 发行版：\n  [`https://archive.apache.org/dist/hadoop/core/hadoop-1.1.1/hadoop-1.1.1-bin.tar.gz`](https://archive.apache.org/dist/hadoop/core/hadoop-1.1.1/hadoop-1.1.1-bin.tar.gz)\n\
  - 将 tarball 解压到本地文件夹，并运行以下命令：\n  `$HADOOP_HOME/bin/hadoop namenode –format`\n  其中，`$HADOOP_HOME`\
  \ 是包含已解压 Hadoop 二进制文件的目录。\n- 修改 `$HADOOP_HOME/conf/core-site.xml` 以设置默认文件系统：\n \
  \ ```\n  <configuration>\n  <property>\n  <name>fs.defaultFS</name>\n  <value>hdfs://localhost:9000</value>\n\
  \  </property>\n  </configuration>\n  ```\n- 修改 `$HADOOP_HOME/conf/hdfs-site.xml`\
  \ 以设置副本数：\n  ```\n  <configuration>\n  <property>\n  <name>dfs.replication</name>\n\
  \  <value>1</value>\n  </property>\n  </configuration>\n  ```\n- 通过运行以下命令启动 Hadoop\
  \ 进程：\n  `$HADOOP_HOME/bin/start-all.sh`\n\n现在完成以下步骤来复制推文文件：\n\n在将本地文件复制到 HDFS 之前，我们先确认五个进程是否都已运行。图\
  \ 5-4 中以下划线的形式显示了这些进程。将推文文件复制到 HDFS：\n\n![A978-1-4842-0142-8_5_Fig4_HTML.jpg](img/A978-1-4842-0142-8_5_Fig4_HTML.jpg)\n\
  \n**图 5-4.** 在本地机器上运行的五个 Hadoop 进程（已加下划线）\n\n```\n// 在 HDFS 上创建 /apress/tweetdata\
  \ 目录\n$HADOOP_HOME/bin/hadoop fs -mkdir /apress/tweetdata\n$HADOOP_HOME/bin/hadoop\
  \ fs -put $DIR/tweets /apress/tweetdata\n```\n\n此时，推文存储在 HDFS 目录：`/apress/tweetdata`\
  \ 下。\n\n数据复制完成后，可以通过 Web 管理界面（`localhost:50070`），点击“浏览文件系统”进行验证，如图 5-5 所示。你可以在 Hadoop\
  \ Web 界面控制台中看到数据已可用。\n\n![A978-1-4842-0142-8_5_Fig5_HTML.jpg](img/A978-1-4842-0142-8_5_Fig5_HTML.jpg)\n\
  \n**图 5-5.** Hadoop Web 管理控制台\n\n或者，你也可以运行以下命令来验证已存储的推文文件：\n\n`$HADOOP_HOME/bin/hadoop\
  \ fs –lsr /apress/tweetdata`\n\n本示例练习中，我们先将实时 Twitter 数据流存储到本地文件系统。对于实时推文流，你可能希望使用\
  \ Flume 或 Scribe 将实时 Twitter 数据流存储到 HDFS。请参考 [`https://cwiki.apache.org/FLUME/`](https://cwiki.apache.org/FLUME/)\
  \ 或 [`https://github.com/facebook/scribe`](https://github.com/facebook/scribe)。\n\
  \n关于安装和设置的更多信息，请参考 [`http://hadoop.apache.org/docs/stable/single_node_setup.html`](http://hadoop.apache.org/docs/stable/single_node_setup.html)。\n\
  \n本示例中，我们讨论了如何将实时推文存储在 HDFS 中。下一节，我们将探讨如何编写一个 MapReduce 程序，将特定用户和日期的推文计数存储到 Cassandra\
  \ 列族中。\n\n## Cassandra MapReduce 集成\n\n在本节中，我们将从 HDFS 读取推文（见上一节），并讨论一个 MapReduce\
  \ 程序来执行推文计算。最后，缩减后的输出将存储在 Cassandra 的 `tweetcount` 列族中。我们将通过两个方案讨论 Cassandra 上的\
  \ MapReduce，分别是：\n\n- 从 HDFS 读取推文，并将推文计数存储到 Cassandra。\n- 从 Cassandra 读取推文，并将推文计数存储到\
  \ Cassandra。\n\n在本示例中，我们将使用 Thrift 协议来创建 Cassandra 模式。作为 Cassandra 的开源 API，MapReduce\
  \ 集成可通过 Thrift 协议实现。示例练习将以 CQL3 方式演示 MapReduce 与 Cassandra 的集成。\n\n### 从 HDFS 读取推文并将计数结果存储到\
  \ Cassandra\n\n在本节中，我们将从之前存储在 HDFS 目录 `/apress/tweetdata`（见上一节）的推文文件中读取数据，并将每个用户和每个日期的推文计数存储到\
  \ Cassandra。Cassandra 对 Thrift 和 CQL3 都提供了 MapReduce 支持。我们将从 Thrift 协议开始，探讨这两种协议。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n### Thrift 方式\n\n我们沿用相同的\
  \ Twitter 示例，其中用户及其推文应存储在本地，并按`tweet_date`排序。\n\n首先，我们需要准备数据定义。让我们使用 Cassandra-cli\
  \ 创建一个列族`tweetcount`：\n\n```\n// 创建键空间。\nCreate keyspace tweet_keyspace;\nuse tweet_keyspace;\n\
  \n// 创建列族 tweetcount。\ncreate column family tweetcount with comparator='UTF8Type'\
  \ and key_validation_class = 'UTF8Type' and column_metadata=[{column_name:'count',\
  \ validation_class:'Int32Type'}];\n```\n\n让我们创建一个 MapReduce 作业。我们需要创建一个 Hadoop 配置实例，并配置\
  \ NameNode 的主机和端口：\n\n```\nConfiguration conf = new Configuration();\nconf.set(\"\
  fs.default.name\",\"hdfs://localhost:9000\");   // 根据你的 Hadoop 配置修改此项。\nconf.set(\"\
  mapred.child.java.opts\", \"-Xms1024m -Xmx2g -XX:+UseSerialGC\");\nconf.set(\"mapred.job.map.memory.mb\"\
  , \"4096\");\nconf.set(\"mapred.job.reduce.memory.mb\", \"2048\");\nconf.set(\"\
  mapreduce.map.ulimit\",\"1048576\");\nconf.set(\"mapred.job.reduce.physical.mb\"\
  , \"2048\");\nconf.set(\"mapred.job.map.physical.mb\", \"2048\");\n```\n\n> **注意**\
  \  \n> 如果你在远程机器上运行，可能需要更改`fs.default.name`。\n\n现在，让我们为映射器和归约器配置 MapReduce 作业：\n\n\
  ```\n//映射器配置\njob.setMapperClass(TweetTokenizer.class);\njob.setMapOutputKeyClass(Text.class);\n\
  job.setMapOutputValueClass(IntWritable.class);\n\n// 归约器配置\njob.setReducerClass(TweetAggregator.class);\n\
  job.setOutputKeyClass(ByteBuffer.class);\njob.setOutputValueClass(List.class);\n\
  job.setOutputFormatClass(ColumnFamilyOutputFormat.class);\n```\n\n接下来，我们需要提供用于输出映射的\
  \ Cassandra 特定配置：\n\n```\nConfigHelper.setOutputRpcPort(job.getConfiguration(),\
  \ \"9160\");\nConfigHelper.setOutputInitialAddress(job.getConfiguration(), \"localhost\"\
  );\nConfigHelper.setOutputPartitioner(job.getConfiguration(), \"Murmur3Partitioner\"\
  );\nConfigHelper.setOutputColumnFamily(job.getConfiguration(), KEYSPACE_NAME, COLUMN_FAMILY);\n\
  ```\n\n> **注意**  \n> 如果你不是在本地主机上运行，也可以更改 rpc 端口和初始地址。\n\n最后，我们需要提供输入和输出路径：\n\n```\n\
  FileInputFormat.addInputPath(job, new Path(otherArgs[0]));\njob.setOutputFormatClass(ColumnFamilyOutputFormat.class);\n\
  ```\n\n这里的 `otherArgs[0]` 是 HDFS 推文文件的输入路径（例如，`/apress/tweetdata`）。\n\n让我们看一下映射器：\n\
  \n```\npublic class TweetMapper\n{\n  public static class TweetTokenizer extends\
  \ Mapper<LongWritable, Text, Text, IntWritable>\n  {\n    private final static IntWritable\
  \ one = new IntWritable(1);\n    /* (non-Javadoc)\n     * @see org.apache.hadoop.mapreduce.Mapper#map(KEYIN,\
  \ VALUEIN, org.apache.hadoop.mapreduce.       Mapper.Context)\n     */\n    public\
  \ void map(LongWritable key, Text value, Context context)\n      throws IOException,\
  \ InterruptedException\n    {\n      // 分割成令牌，并将日期和计数作为键传递。\n      String[] values\
  \ = StringUtils.split(value.toString(), \"\\001\");\n      if(values.length >=2\
  \ && values.length <=3)\n      {\n        context.write(new Text(values[0]), one);\
  \  // 按日期计数。\n        context.write(new Text(values[1]), one);  // 按用户计数。\n    \
  \  }\n    }\n  }\n}\n```\n\n现在，让我们看一下归约器：\n\n```\npublic static class TweetAggregator\
  \ extends  org.apache.hadoop.mapreduce.Reducer<Text, IntWritable, ByteBuffer, List<Mutation>>\n\
  {\n  public void reduce(Text word, Iterable<IntWritable> values, Context context)\
  \ throws IOException,\n    InterruptedException\n  {\n    int sum = 0;\n    for\
  \ (IntWritable val : values)\n      sum += val.get();\n    context.write(ByteBufferUtil.bytes(word.toString()),\
  \ Collections.singletonList(getMutation(word, sum)));\n  }\n\n  private static Mutation\
  \ getMutation(Text word, int sum)\n  {\n    Column c = new Column();\n    c.setName(ByteBufferUtil.bytes(\"\
  count\"));\n    c.setValue(ByteBufferUtil.bytes(sum));\n    c.setTimestamp(System.currentTimeMillis());\n\
  \    Mutation m = new Mutation();\n    m.setColumn_or_supercolumn(new ColumnOrSuperColumn());\n\
  \    m.column_or_supercolumn.setColumn(c);\n    return m;\n  }\n}\n```\n\n此 MapReduce\
  \ 作业的完整源代码可以在本书的下载资源中找到。可执行类是 `TwitterHDFSJob`（位于 `com.apress.chapter5.mapreduce.twittercount.hdfs`\
  \ 包中）。你还可以参考 `README.txt` 文件（位于 `src/main/resources` 下），以获取有关设置数据库和运行此 MapReduce\
  \ 作业的进一步说明。\n\n成功执行作业后，列族中的输出将如下所示：\n\n```\n[default@tweet_keyspace] list tweetcount;\n\
  Using default limit of 100\nUsing default cell limit of 100\n-------------------\n\
  RowKey: Mon May 11 06:16:04 IST 2009\n=> (name=count, value=334, timestamp=1407569960904)\n\
  -------------------\nRowKey: Hazem Saleh\n=> (name=count, value=334, timestamp=1407569960798)\n\
  -------------------\nRowKey: cessprin\n=> (name=count, value=334, timestamp=1407569960990)\n\
  -------------------\nRowKey: Thu Feb 23 00:24:16 IST 2012\n=> (name=count, value=334,\
  \ timestamp=1407569960966)\n-------------------\nRowKey: Hunter Scott\n=> (name=count,\
  \ value=334, timestamp=1407569960803)\n22 Rows Returned.\n```\n\n存储的 tweetcount\
  \ 的示例输出总共包含 22 行。行键可以是推文日期或用户名，并包含一个名为 count 及其值的列。\n\n\n\n\n### CQL3 方式\n\n在前几章中，我们讨论了\
  \ CQL3 与 Thrift 之间的差异及互操作性问题。Cassandra 为 MapReduce 提供了支持 CQL 兼容的输入输出格式类。请注意，这些实现仍基于\
  \ Thrift，而非原生 CQL3 驱动程序。在本示例中，我们将使用它在 CQL3 列族中写入输出数据。我们知道通过 CQL3 创建的列族在 Thrift 中不可见，因此接下来我们将探讨如何在\
  \ CQL3 表/列族上运行 MapReduce。使用 CQL3 运行前面的 MapReduce 程序只需很少的改动。我们需要以 CQL3 格式定义表，并修改\
  \ Hadoop 作业配置，使其指向基于 CQL3 的输出格式。下面我们来逐一说明这些改动：\n\n首先，你需要创建 `tweetcount` 表：\n\n```\n\
  create table tweetcount_cql (key text primary key, count int);\n```\n\n在 Hadoop\
  \ 作业层级所需的修改如下：\n\n```\n// 设置更新 CQL 和行键\njob.getConfiguration().set(\"row_key\",\
  \ \"key\");\nString query = \"UPDATE \" + KEYSPACE_NAME + \".\" + COLUMN_FAMILY\
  \ + \" SET count = ? \";\nCqlConfigHelper.setOutputCql(job.getConfiguration(), query);\n\
  // 设置 CQL 输出格式类\njob.setOutputFormatClass(CqlOutputFormat.class);\n```\n\n基于 CQL3\
  \ 的聚合器如下：\n\n```\npublic static class TweetCQLAggregator extends org.apache.hadoop.mapreduce.Reducer<Text,\
  \ IntWritable, Map<String,ByteBuffer>, List<ByteBuffer>>\n{\n  private static Map<String,ByteBuffer>\
  \ keys = new HashMap<>();\n  /* (非 Javadoc)\n  * @see org.apache.hadoop.mapreduce.Reducer#reduce(KEYIN,\
  \ java.lang.Iterable,org.apache.hadoop.mapreduce.Reducer.Context)\n  */\n  public\
  \ void reduce(Text word, Iterable<IntWritable> values, Context context) throws IOException,\
  \ InterruptedException\n  {\n    int sum = 0;\n    for (IntWritable val : values)\n\
  \      sum += val.get();\n    System.out.println(\"writing\");\n    keys.put(\"\
  key\", ByteBufferUtil.bytes(word.toString()));\n    context.write(keys, getBindVariables(word,\
  \ sum));\n  }\n  private List<ByteBuffer> getBindVariables(Text word, int sum)\n\
  \  {\n    List<ByteBuffer> variables = new ArrayList<ByteBuffer>();\n    variables.add(Int32Type.instance.decompose(sum));\n\
  \    return variables;\n  }\n}\n```\n\n最后，运行 HDFS 作业（参见 `TwitterHDFSCQLJob`，源代码后附输出）后，我们可以使用\
  \ `cqlsh` 客户端查看输出：\n\n```\nselect * from tweetcount_cql;\n key                 \
  \        | count\n-----------------------------+-------\n Mon May 11 06:16:04 IST\
  \ 2009 |   334\n Hazem Saleh                 |   334\n cessprin                \
  \    |   334\n Thu Feb 23 00:24:16 IST 2012|   334\n Hunter Scott              \
  \  |   334\n Tue Sep 29 22:01:16 IST 2009|   334\n Elena Vielva Gómez          |\
  \   334\n Sun Dec 18 20:13:39 IST 2011|   334\n Alejandro || Serras        |   334\n\
  \ Tue Jul 06 18:01:47 IST 2010|   334\n Wed Mar 07 05:11:11 IST 2012|   334\n Wed\
  \ Nov 07 14:04:18 IST 2012|   334\n Oseias Moraes               |   334\n Adeesh\
  \ Fulay                |   334\n Sat Nov 05 21:29:20 IST 2011|   334\n Sun Jul 24\
  \ 21:44:17 IST 2011|   334\n Manthita.                   |   334\n ebooksdealofdaybot\
  \          |   334\n Wed Apr 23 19:19:49 IST 2014|   334\n The News Selector   \
  \        |  6680\n Louise Corrigan             |   334\n Mon Mar 03 01:19:17 IST\
  \ 2014|  6680\n22 行返回。\n```\n\n完整源代码可通过本书的下载资源获取，其中涉及的类包括：\n\n- `com.apress.chapter5.mapreduce.twittercount.hdfs.TwitterHDFSCQLJob`\n\
  - `com.apress.chapter5.mapreduce.twittercount.hdfs.TweetAggregator`\n\n下一节我们将讨论如何将\
  \ Cassandra 用作 MapReduce 的输入和输出格式。\n\n### Cassandra 输入与输出\n\n现在我们来讨论如何运行一个 MapReduce\
  \ 作业，其中输入从 Cassandra 获取，输出也存储到 Cassandra 中。\n\n到目前为止，我们已经看到 MapReduce 作业可以在默认的 HDFS\
  \ 以及像 Cassandra 这样的外部文件系统上执行。你可能会疑惑应该采用哪种文件系统以及为什么？这完全取决于具体用例。例如，如果一个应用程序已经基于各种\
  \ Cassandra 特性构建，那么最好将其 MapReduce 批处理分析也实现在 Cassandra 中。也可能存在这样的情况：HDFS 已被用于存储原始数据，用户可能不希望迁移，但仍希望运行一些\
  \ MapReduce 作业并将输出存储到 Cassandra 中。同样，用户可能希望从 HDFS 及其生态系统（Hive、Pig 等）迁移到单一的数据库解决方案（即\
  \ Cassandra）。我们必须记住的一个重大区别是，HDFS 是一个分布式文件系统，而 Cassandra 是一个分布式数据库。Cassandra 具备容错性且没有单点故障，而\
  \ HDFS 则不然。另一个关键区别是，Hadoop 采用主从架构，而 Cassandra 采用对等架构。由于基于 Cassandra 构建的解决方案具有可扩展性，并利用了\
  \ Cassandra 的特定功能（如二级索引、复合列等），我们可能仍然需要使用 MapReduce 在 Cassandra 上执行批处理分析。在本教程中，我们将讨论同一个推文计数示例，但将\
  \ Cassandra 同时用作输入和输出格式。\n\n该程序将用户名作为输入参数（默认用户值为），并计算该用户的推文数量。\n\n首先我们需要准备数据定义。让我们创建一个键空间\
  \ `tweet_` 以及列族和。其中 `tweetstore` 将存储原始推文，而特定用户的计数将通过 `cqlsh` 存储在 `tweetcount` 列族中。\n\
  \n```\n// 创建键空间。\ncreate keyspace tweet_keyspace with replication={'class': 'SimpleStrategy',\
  \ 'replication_factor:3};\nuse tweet_keyspace;\n// 创建输入列族。\ncreate table tweetstore(tweet_id\
  \ timeuuid PRIMARY KEY, user text, tweeted_at timestamp, body text);\n// 通过 Cassandra-cli（Thrift\
  \ 方式）更新列族以启用 user 上的索引。\ncreate column family tweetstore with column_metadata=[{column_name:'user',\
  \ validation_class:'UTF8Type', index_type: KEYS},{column_name:'body', validation_class:\
  \ 'UTF8Type'}, {column_name:'tweeted_at',validation_class: 'DateType'}]\n// 通过 Cassandra-cli\
  \ 创建输出列族。\ncreate column family tweetcount with comparator='UTF8Type' and key_validation_class\
  \ = 'UTF8Type' and column_metadata=[{column_name:'count', validation_class:'Int32Type'}];\n\
  ```\n\n接下来，我们使用客户端在 `tweetstore` 中填充一些行：\n\n```\nuse tweet_keyspace;\n// 复制命令\n\
  copy tweetstore from STDIN;\n```\n\n以下是从 STDIN 复制的控制台输出：\n\n```\ncqlsh:tweet_keyspace>\
  \ copy tweetstore from STDIN;\n[使用 \\. 单独一行结束输入]\n[copy]  now(),bama meeting with\
  \ European allies on Ukraine http://t.co/1Ik3qBOPxC from #APress #tns, 2013-10-20,mevivs\n\
  [copy] now(),nergdahl uproar halts plan for return celebration http://t.co/bywaBAoWTP\
  \ from #APress #tns,2012-09-22,Chrisk\n[copy] now(),booksdealofdaybot^A[Apress]?Android\
  \ Apps Security?http://t.co/5XLSObkk9f,2014-03-24,mevivs\n[copy] \\.\n6 分 35.900\
  \ 秒内导入了 3 行。\n```\n\n让我们使用以下映射器和规约器配置创建一个 MapReduce 作业：\n\n```\nConfiguration conf\
  \ = new Configuration();\nString[] otherArgs = new GenericOptionsParser(conf, args).getRemainingArgs();\n\
  Job job = new Job(conf, \"tweet count\");\njob.setJarByClass(TwitterCassandraJob.class);\n\
  // 映射器配置。\njob.setMapperClass(TweetMapper.class);\njob.setMapOutputKeyClass(Text.class);\n\
  job.setMapOutputValueClass(IntWritable.class);\njob.setInputFormatClass(ColumnFamilyInputFormat.class);\n\
  // 规约器配置\njob.setReducerClass(TweetAggregator.class);\n```\n\n\n\n`job.setOutputKeyClass(ByteBuffer.class);`\n\
  \n`job.setOutputValueClass(List.class);`\n\n`job.setOutputFormatClass(ColumnFamilyOutputFormat.class);`\n\
  \n接下来，我们需要为输入列族和格式配置 MapReduce 作业：\n\n```\n// Cassandra input column family configuration\n\
  ConfigHelper.setInputRpcPort(job.getConfiguration(), \"9160\");\nConfigHelper.setInputInitialAddress(job.getConfiguration(),\
  \ \"localhost\");\nConfigHelper.setInputPartitioner(job.getConfiguration(), \"Murmur3Partitioner\"\
  );\nConfigHelper.setInputColumnFamily(job.getConfiguration(), KEYSPACE_NAME, INPUT_COLUMN_FAMILY);\n\
  job.setInputFormatClass(ColumnFamilyInputFormat.class);\n```\n\n由于我们需要获取特定索引列（`user`）的记录，我们将使用\
  \ Thrift Slice API 配合`mapper`类配置 MapReduce 作业，以进行过滤流式处理。\n\n```\n// Create a slice\
  \ predicate\nSlicePredicate slicePredicate = new SlicePredicate();\nslicePredicate.setSlice_range(new\
  \ SliceRange(ByteBufferUtil.EMPTY_BYTE_BUFFER, ByteBufferUtil.EMPTY_BYTE_BUFFER,\
  \ false, Integer.MAX_VALUE));\n\n// Prepare index expression.\nIndexExpression ixpr\
  \ = new IndexExpression();\nixpr.setColumn_name(ByteBufferUtil.bytes(COLUMN_NAME));\n\
  ixpr.setOp(IndexOperator.EQ);\nixpr.setValue(ByteBufferUtil.bytes(otherArgs.length\
  \ > 0 && !StringUtils.isBlank(otherArgs[0])? otherArgs[0]: \"mevivs\"));\n\nList<IndexExpression>\
  \ ixpressions = new ArrayList<IndexExpression>();\nixpressions.add(ixpr);\nConfigHelper.setInputRange(job.getConfiguration(),\
  \ ixpressions);\nConfigHelper.setInputSlicePredicate(job.getConfiguration(), slicePredicate);\n\
  ```\n\n接下来，我们需要为输出列族和格式配置 MapReduce 作业：\n\n```\n// Cassandra output family configuration.\n\
  ConfigHelper.setOutputRpcPort(job.getConfiguration(), \"9160\");\nConfigHelper.setOutputInitialAddress(job.getConfiguration(),\
  \ \"localhost\");\nConfigHelper.setOutputPartitioner(job.getConfiguration(), \"\
  Murmur3Partitioner\");\nConfigHelper.setOutputColumnFamily(job.getConfiguration(),\
  \ KEYSPACE_NAME, OUTPUT_COLUMN_FAMILY);\njob.setOutputFormatClass(ColumnFamilyOutputFormat.class);\n\
  ```\n\n让我们看看`mapper()`：\n\n```\npublic class TweetMapper extends Mapper<ByteBuffer,\
  \ SortedMap<ByteBuffer, Column>, Text, IntWritable>\n{\n    static final String\
  \ COLUMN_NAME = TwitterCassandraJob.COLUMN_NAME;\n    private final static IntWritable\
  \ one = new IntWritable(1);\n\n    /* (non-Javadoc)\n     * @see org.apache.hadoop.mapreduce.Mapper#map(KEYIN,\
  \ VALUEIN, org.apache.hadoop.mapreduce.Mapper.Context)\n     */\n    public void\
  \ map(ByteBuffer key, SortedMap<ByteBuffer, Column> columns, Context context) throws\
  \ IOException, InterruptedException\n    {\n        Column column = columns.get(ByteBufferUtil.bytes(COLUMN_NAME));\n\
  \        String value = ByteBufferUtil.string(column.value());\n        context.write(new\
  \ Text(value), one);\n    }\n}\n```\n\n它简单地读取特定列（例如，来自流式列的`user`），并为每个列值写入计数。我们将使用相同的`reducer()`执行归约操作。\n\
  \n该 MapReduce 作业的完整源代码可在本书的下载资源中找到。可执行类是`TwitterCassandraJob`（位于`com.apress.chapter5.mapreduce.twittercount.cassandra`包中）。你也可以参考`README.txt`和`db.txt`文件（位于`src/main/resources`下）以获取进一步说明。\n\
  \n成功执行作业后，列族中的输出如图 [5-6] 所示。\n\n![A978-1-4842-0142-8_5_Fig6_HTML.jpg](img/A978-1-4842-0142-8_5_Fig6_HTML.jpg)\n\
  \n图 5-6. 特定于用户`mevivs`的计数存储在`tweetcount`中\n\n本配方的完整源代码可在本书下载资源的`com.apress.chapter5.mapreduce.twittercount.cassandra`文件夹中找到。\n\
  \n## Stream 或实时分析\n\n批处理框架非常适合一次性写入、随处读取的范式。但对于数据集的持续更新，任何正在进行的 Hadoop 作业都不会获取这些数据更新，需要重新运行。\n\
  \n实时分析需要处理和分析进入系统的大量数据。诸如股票市场交易和动态预测分析等应用需要在数据进入系统时实时提供分析结果。\n\n在过去一年左右，构建此类实时分析应用引起了极大兴趣。因此，出现了许多新框架，例如\
  \ Storm、Samza 和 Kafka。我们将在后续章节讨论它们的集成。\n\n## 总结\n\n如前所述，本章中分享的所有代码片段均以完整源代码形式随本书下载资源提供。下载资源中还包含`db.txt`和`README.txt`，用于指导如何配置和运行这些\
  \ Java 程序以及这些示例中使用的 Cassandra 数据定义。\n\n在本章中，我们讨论了 HDFS 和 MapReduce 及其与 Cassandra\
  \ 的集成。运行 MapReduce 是大型数据分析的一种解决方案。然而，为了满足更复杂的分析需求，可能需要使用内置 API 来自动构建和执行此类 MapReduce\
  \ 程序。其中两个最流行的工具是 Hive 和 Pig。下一章将讨论 Hive 和 Pig 的使用及其与 Cassandra 的集成。\n\n"
- '# 6. 数据迁移与分析


  在上一章中，我们讨论了通过 Hadoop MapReduce 对 Cassandra 运行批处理分析的好处和要求。我们可以轻松利用 Hadoop MapReduce
  的可插拔架构来实现 MapReduce，甚至使用自定义实现。接下来讨论几个已发布的使用案例：


  *   NetApp 收集并分析系统诊断相关数据，以提高客户端部署系统的质量。

  *   一家领先的健康保险提供商每天收集和处理数百万份索赔。数据摄入量约为每天 1 TB。

  *   Nokia 收集并分析各种移动电话的相关数据。预计处理的数据量约为 600 TB，包含结构化和非结构化数据。

  *   Etsy 是一个手工艺品在线市场，需要分析数十亿条日志以进行行为定向和构建基于搜索的推荐。


  存储大量数据是一个重大问题，而使用 Cassandra 我们可以实现更快速的摄入。那么如何分析这些大型数据集呢？CQL3 作为一个类似 SQL 的接口非常有用，但为了并行批量处理和分析，我们需要实现类似
  MapReduce 的算法。前几章介绍了实现 MapReduce 基础知识及使用 Java 实现。但在某些情况下，我们更倾向于现成的、易于集成的解决方案！


  本章将讨论：


  *   Apache Pig 设置与基础

  *   将 Pig 与 Cassandra 集成

  *   将数据导入 Cassandra

  *   Apache Hive 设置与基础

  *   Hive 外部表和内部表

  *   将 Hive 与 Cassandra 配合使用

  *   Sqoop 介绍

  *   Sqoop 与 Cassandra 配合使用




  '
- "# 数据迁移与分析\n\n数据迁移是在多个存储系统之间传输数据的过程。在大数据场景下，数据迁移的关键点在于为提升可扩展性与性能，从一种存储系统（例如关系型数据库）升级到另一种存储系统（例如\
  \ Cassandra）。随着近年来许多 NoSQL 数据库的出现，数据迁移已成为评估与实现首选数据库解决方案的重要流程。\n\n如上述用例所述，对结构化或非结构化数据进行分析是另一个问题。探索新的业务领域，并处理因已知限制而曾被认为无用的数据，是大数据分析的几个重要因素。\n\
  \n数据科学是当今一个新兴领域，涉及从原始数据中过滤和提取信息的研究。它是人工智能和竞争情报不可或缺的一部分，而数据挖掘和分析则是与数据科学相关的其他实践。\n\
  \n数据挖掘的过程是利用各种人工智能和自然语言处理相关技术，在研究大数据集后提取并定义一种模式。风险分析、行为定向和预测是部分需要数据挖掘和模式分析的大数据用例。\n\
  \n前端实现与后端实现之间的争论已持续多年。程序员和数据库架构师对此话题各有见解。拥有 Java 或其他技术经验的人可以轻松编写此类`MapReduce`实现。同样，精通数据库的开发者总是倾向于在数据库端实现此类算法。让我们尝试设想一下，`MapReduce`作业在后端程序员与应用程序员眼中会有何不同。\n\
  \n图 6-1 展示了在业务层（通过编程方式）按日期统计推文数量，并将输出结果存储到数据库的`MapReduce`作业执行过程。此处`MapReduce`算法的实现在应用层。此类实现可以采用\
  \ Java 或任何其他语言。\n\n![A978-1-4842-0142-8_6_Fig1_HTML.jpg](img/A978-1-4842-0142-8_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 描述在业务层实现推文分析标准流程的图示\n\n同一用例的另一种实现方式是后端程序员或数据科学家倾向于在数据库端编写`MapReduce`脚本或函数，如图\
  \ 6-2 所示。\n\n![A978-1-4842-0142-8_6_Fig2_HTML.jpg](img/A978-1-4842-0142-8_6_Fig2_HTML.jpg)\n\
  \n图 6-2. 描述在数据库层实现推文分析的图示\n\n几乎对所有事情都开发此类`MapReduce`程序，不仅难以维护，而且耗时。这时，使用类似 SQL 的语言或编写简单的脚本就会非常有用。数据库管理员或科学家可能更倾向于基于数据库的方法（图\
  \ 6-2）以实现快速开发。由此我们可以得出结论，此类工具确实有需求空间。例如，这些工具在实现需要对大量数据集进行提取并存储输出的定期任务时非常方便。\n\n\
  这就引出了一个问题：是否有现成可用的工具或开源库？像 Apache Hive、Apache Pig 和 Sqoop 这样的工具恰好满足了这类需求。在详细探讨每种工具之前，我们先对它们进行简要介绍。\n\
  \nApache Pig 允许终端程序员以脚本形式编写`MapReduce`实现。Apache Pig 简单地将这种 Pig 脚本转换为兼容 Hadoop 的`MapReduce`实现。Apache\
  \ Pig 提供了函数和数据类型支持，便于轻松、可复用地快速编写基于 Pig 的`MapReduce`实现。那些构建数据管道或 ETL 类解决方案的人更喜欢使用\
  \ Pig，因为它是过程性的而非声明性的。由于它并非声明性语言，你可以在工作流的任何节点创建检查点并插入自定义代码。\n\nApache Hive 使用户能够使用类似\
  \ SQL 的查询语言来管理和分析大数据集。SQL 在业界广受欢迎并得到广泛应用。通过提供类似查询的接口，即 Hive 查询语言（Hive QL），它使程序员能够快速采用\
  \ Hadoop 和 HBase 大数据平台。通常它用于基于 SQL 的即席分析。使用 Hive QL，我们可以像操作 SQL 一样执行各种 DDL 和 DML\
  \ 操作。数据定义语言（DDL）用于执行创建和修改表等任务，数据操作语言（DML）用于插入和删除记录等操作。DDL 和 DML 的语义与 SQL 类似。关于 DDL\
  \ 的更多信息，可以参考 [`https://cwiki.apache.org/confluence/display/Hive/GettingStarted#GettingStarted-DDLOperations`](https://cwiki.apache.org/confluence/display/Hive/GettingStarted#GettingStarted-DDLOperations)。Hive\
  \ 的数据分区和外部表支持为用户带来了额外优势，使其能够使用 Hive 在外部文件系统上声明和分析数据。我们将在本章后面部分讨论这一点。\n\nSqoop 意为\
  \ SQL 到 Hadoop。基于关系型数据库构建的解决方案不具备可扩展性，用户期望迁移到基于大数据的解决方案上。首要任务是迁移现有的生产数据到另一个数据库或文件系统。这时\
  \ Apache Sqoop 就派上了大用场，可以帮助轻松地将数据从一个数据库迁移到另一个数据库。\n\n现在，让我们详细探索这些工具中的每一个。先从 Apache\
  \ Pig 开始。\n\n## Apache Pig\n\nApache Pig 是一个平台，它提供了一种名为 Pig Latin 的简单脚本语言，以抽象的方式构建`MapReduce`程序。它最初是作为雅虎研究相关项目的一部分开发的，但后来在\
  \ 2007 年转入了 Apache 孵化器。之所以命名为 Pig（猪），是因为它可以摄入/读取几乎任何格式的数据。\n\n### 安装与设置\n\n有两种方式可以设置\
  \ Apache Pig 发行版。可以手动下载 tarball，或者在 Linux 机器上设置第三方二进制发行版（`.deb` 或 `.rpm`）。\n\n对于\
  \ Windows，需要下载并使用 `cygwin` 设置一个类 Linux 环境。`Cygwin` 是 Windows 上的一个类 Unix 环境和命令行接口。`Cygwin`\
  \ 提供了基于 Windows 的应用程序、数据和其他系统资源与类 Unix 环境中的应用程序、软件工具和数据之间的原生集成。更多详情，可以参考 [`http://en.wikipedia.org/wiki/Cygwin`](http://en.wikipedia.org/wiki/Cygwin)。你可以从\
  \ [`www.cygwin.com/install.html`](http://www.cygwin.com/install.html) 下载并设置 `cygwin`。\n\
  \n在本章中，我们将使用 tarball 发行版进行设置和其他配置。要在本地机器上进行设置，请遵循以下步骤：\n\n首先创建一个文件夹：\n\n```\nmkdir\
  \ pig-dist\ncd pig-dist\n```\n\n然后，下载 tarball 发行版：\n\n```\nwget http://mirrors.ibiblio.org/apache/pig/pig-0.12.1/pig-0.12.1.tar.gz\n\
  ```\n\n注意：在撰写本章时，最新的 tarball 版本是 0.12.1。你可以根据最新版本相应地更改。\n\n使用以下命令解压下载的 tarball：\n\
  \n```\ntar -xvf pig-0.12.1.tar.gz\n```\n\n在步骤 3 之后，`pig-dist` 文件夹将在 `pig-0.12.1`\
  \ 文件夹中包含解压后的发行版，如图 6-3 所示。\n\n![A978-1-4842-0142-8_6_Fig3_HTML.jpg](img/A978-1-4842-0142-8_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 本地文件夹中解压后的 tarball 发行版\n\n\n好的，请看下方根据您的要求和格式提供的翻译：\n\n\n### 理解 Pig\n\n\
  图 6-4 展示了 Pig 的架构以及 Apache Pig 的各种组件。它描述了 Pig 脚本是如何被编译并转换为 MapReduce 作业的。通过 Pig\
  \ 的架构，编写的 Pig 脚本会被编译成 MapReduce 程序，并由 Hadoop 作业管理器作为 MapReduce 作业提交。Grunt 命令 shell\
  \ 是用于运行 Pig 脚本的命令行界面，而 Pig API 可用于构建自定义实现。\n\n![A978-1-4842-0142-8_6_Fig4_HTML.jpg](img/A978-1-4842-0142-8_6_Fig4_HTML.jpg)\n\
  \n图 6-4. Apache Pig 组件与 MapReduce 作业转换\n\n在开始示例之前，我们先讨论这两种模式，然后讨论一些重要的 Pig 命令和数据类型，这些将在本章后续的练习中使用。\n\
  \n#### Pig 执行模式\n\nApache Pig 提供两种执行模式：\n- 本地模式\n- MapReduce 模式\n\n##### 本地模式\n\n\
  Pig 有一个交互式 shell，我们可以以本地模式启动 Pig 的执行，这需要运行以下命令（见图 6-5）：\n\n`pig –x local`\n\n![A978-1-4842-0142-8_6_Fig5_HTML.jpg](img/A978-1-4842-0142-8_6_Fig5_HTML.jpg)\n\
  \n图 6-5. 以本地模式启动 Pig\n\n##### MapReduce 模式\n\n在 MapReduce 模式下运行 Pig 需要 Hadoop 进程已启动并正在运行。（您可以参考第\
  \ 5 章中的“从 HDFS 读取推文并将计数结果存储到 Cassandra”部分。）要以 MapReduce 模式运行 Pig，我们需要运行：\n\n`$ pig`\n\
  \n连接后，我们还可以像下面这样使用 Grunt shell 浏览 HDFS 目录：\n\n```\ngrunt> cd hdfs:///\ngrunt> ls\n\
  hdfs://0.0.0.0/tweets  <dir>\nhdfs://0.0.0.0/usr     <dir>\n```\n\n完成此设置和配置后，我们现在可以探索\
  \ Pig 提供的其他配置和功能集了。让我们从数据类型开始。\n\n#### 数据类型\n\nPig 支持的数据类型可以分为简单数据类型和复杂数据类型。\n\n\
  ##### 简单数据类型\n\n简单数据类型，如 String、int 等，是大多数数据库普遍提供且最常使用的类型。表 6-1 展示了 Pig 支持的所有简单数据类型。\n\
  \n表 6-1. Pig 支持的简单数据类型\n\n| 数据类型      | 描述                                   |\n\
  |------------|--------------------------------------|\n| charArray  | UTF-8 编码的字符串（例如，Cassandra）\
  \       |\n| ByteArray  | 字节数组 (blob)                        |\n| Double     | 64\
  \ 位精度格式（例如，11.9）              |\n| Float      | 32 位精度格式（例如，10.2f）             |\n\
  | Int        | 32 位有符号整数（例如，100）              |\n| Long       | 64 位有符号整数（例如，50L）\
  \              |\n\n##### 复杂数据类型\n\n复杂数据类型，例如保存键值对的 map，更倾向于某种预定义的数据结构格式。表 6-2 展示了\
  \ Pig 支持的所有三种复杂数据类型。\n\n表 6-2. Pig 支持的复杂数据类型\n\n| 数据类型 | 描述                    \
  \                                                                              \
  \                                                                              \
  \                                                |\n|------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
  | Tuples | 元组是一个有序的数据集。可以将元组视为具有多个字段的行，这些字段可以是任何类型，并且可能有数据也可能没有数据。元组用 `()` 括起来。例如，`(Vivek,Apress,6)`\
  \ 表示一个包含作者姓名、出版社和章节号的元组。                                                       \
  \                  |\n| Bags  | 包是元组的集合。一个包可以包含重复的元组，并且每个元组的字段数量及其数据类型可能不同。例如，这是一个包含多个元组的包：`{(Vivek,Apress,6),(Chris,Apress,Reviewer,6),(Melissa,Apress,Coordinator,6),(Brian,Apress,Tech\
  \ reviewer)}` |\n| Map   | 映射是键值对的集合。每个键值对由 `#` 分隔。例如，`[name#vivek,email#vivek.mishra@nomail.com]`\
  \ 是一个包含两个键值对的映射。第一个元素的键是 `name`，值是 `vivek`；第二个元素的键是 `email`，值是 `vivek.mishra@nomail.com`。\
  \                    |\n\n#### Pig 函数\n\nPig 带有几个内置函数。用户也可以实现自定义的用户自定义函数（UDF）。Pig\
  \ 的内置函数可以进一步分类为：\n- 求值函数\n- 数学函数\n- 字符串函数\n- 存储函数\n- 包/元组函数\n\n在本节中，让我们看一些最常用的 Pig\
  \ 函数。\n\n##### PigStorage\n\n以 UTF-8 格式加载数据的默认函数。`PigStorage` 的示例将在接下来的两节中给出。\n\n\
  ##### LOAD\n\n`LOAD` 函数从文件系统加载数据。默认情况下，它与 `PigStorage` 函数结合使用，如下所示：\n\n在本地文件系统的一个文件夹中（本例中为\
  \ `/home/vivek`）创建一个示例 `tweets.txt` 文件。该文件将包含以下格式的数据：\n\n`apress_team|technology|A\
  \ whole bunch of new technology books about to come. Watch this space!`\n\n运行以下命令，使用\
  \ `PigStorage` 通过 Grunt shell 加载推文文件：\n\n`pipe_input = LOAD '/home/vivek/input/tweets.txt'\
  \ USING PigStorage('|');`\n\n要转储 `pipe_input` 的输出（如图 6-6 所示），请运行以下命令：\n\n`dump pipe_input;`\n\
  \n![A978-1-4842-0142-8_6_Fig6_HTML.jpg](img/A978-1-4842-0142-8_6_Fig6_HTML.jpg)\n\
  \n图 6-6. MapReduce 程序的输出\n\n##### STORE\n\n此函数用于将中间或计算后的 Pig 脚本结果加载/输出到文件系统中的输出结果中。在以下示例中，我们读取包含由\
  \ `'|'` 分隔的字段的 `tweets.txt`，并将其存储为包含由 `','` 分隔的字段的文件（见图 6-7）。\n\n```\npipe_input\
  \ = LOAD '/home/vivek/input/tweets.txt' USING PigStorage('|') as (screen_name:chararray,category:chararray,body:chararray);\n\
  csv_output = STORE input into '/home/vivek/output/tweets.csv' USING PigStorage(',');\n\
  ```\n\n上述命令的输出如图 6-7 所示。\n\n![A978-1-4842-0142-8_6_Fig7_HTML.jpg](img/A978-1-4842-0142-8_6_Fig7_HTML.jpg)\n\
  \n图 6-7. 读取推文并存储到 csv 文件后的输出\n\n运行上述命令后，将在 `/home/vivek/output` 文件夹中写入一个新文件 (`part-m-00000`)，该文件将包含逗号分隔的值，如下所示：\n\
  \n`apress_team,technology,A whole bunch of new technology books about to come. Watch\
  \ this space!`\n\n此类文件是由 Pig 脚本执行的 MapReduce 作业生成的输出文件。有关 MapReduce 的更多详细信息，请参考前一章。\n\
  \n请注意，这里我们使用了默认的存储函数 `PigStorage()`，但读者可以创建自己的 UDF 并使用它们进行存储/加载。例如，在 Cassandra 的情况下，为了将数据加载到\
  \ Cassandra 文件系统，将使用 `CSVStorage` 和 `CassandraStorage` 函数。我们将在接下来的练习中讨论 Cassandra\
  \ 的 Pig 特定函数。\n\n##### FILTER\n\n`FILTER` 用于根据提供的条件选择行/元组。让我们描述一下 `pipe_input`，并根据\
  \ `screen_name` 的值为 `apress_team` 进行过滤：\n\n```\ndescribe pipe_input;\nfilter_by_name\
  \ = FILTER pipe_input BY screen_name matches 'apress_team';\n```\n\n运行此命令将过滤 `pipe_input`\
  \ 中 `screen_name` 值为 `apress_team` 的实例（见图 6-8）。\n\n![A978-1-4842-0142-8_6_Fig8_HTML.jpg](img/A978-1-4842-0142-8_6_Fig8_HTML.jpg)\n\
  \n图 6-8. FILTER 命令的输出\n\n##### FOREACH\n\n使用此函数可以遍历结果包，并将其转换为输出或中间结果（见图 6-9）。\n\n\
  ```\nsimilar_result = FOREACH pipe_input GENERATE(*);\nresult_with_screen_name_only\
  \ = FOREACH pipe_input GENERATE screen_name;\ndump result_with_screen_name_only;\n\
  ```\n\n![A978-1-4842-0142-8_6_Fig9_HTML.jpg](img/A978-1-4842-0142-8_6_Fig9_HTML.jpg)\n\
  \n图 6-9. 运行 FOREACH 生成中间结果\n\n\n\n##### TOTUPLE\n\n`TOTUPLE` 是一个用于生成元组的函数。例如，我们可以使用\
  \ `TOTUPLE` 生成包含列名和值的元组，如图 6-10 所示。\n\n```\nscreen_tuple = FOREACH pipe_input GENERATE\
  \ TOTUPLE('screen_name',screen_name);\n```\n\n![A978-1-4842-0142-8_6_Fig10_HTML.jpg](img/A978-1-4842-0142-8_6_Fig10_HTML.jpg)\n\
  \n图 6-10. 展示了生成的元组，其中 screen_name 为 apress_team\n\n前面，我们讨论了一些基本的 Pig Latin 命令。接下来，让我们通过更多示例练习来探索\
  \ Apache Pig。本章所有练习将引用包含关于 apress 推文的 tweets 文件。您可以从附件文件夹（`datafiles`）下载示例推文文件。该文件包含推文数据、屏幕名称（screen\
  \ name）以及推文正文，字段之间以 `'\\001'` 分隔（见图 6-11）。\n\n![A978-1-4842-0142-8_6_Fig11_HTML.jpg](img/A978-1-4842-0142-8_6_Fig11_HTML.jpg)\n\
  \n图 6-11. 以 `'\\001'` 分隔的示例推文文件\n\n### 统计推文数量\n\n在本示例中，我们将演示如何使用交互式 Grunt shell\
  \ 运行各种 Pig 命令。对于中等复杂度的 Pig 脚本，我们也可能需要编写并直接以 Pig 脚本形式运行。运行 Pig 脚本的命令如下：\n\n`Pig –x\
  \ local myscript.pig`\n\n此处 `myscript.pig` 是一个编译好的 Pig 脚本。我们也可以按如下方式以嵌入模式执行此类脚本：\n\
  \n```\n// 编译为 .class 文件\njavac –cp pig.jar MyScript.java\n// 以嵌入模式作为 Java 程序运行 Pig\
  \ 脚本\njava –cp:pig.jar:. MyScript\n```\n\n在本练习中，我们将探索如何使用 Apache Pig 运行 MapReduce\
  \ 程序，以实现推文总数统计以及特定 `screen_name` 的推文计数。\n\n首先，使用 `PigStorage` 加载推文：\n\n```\ntweets\
  \ = LOAD '/home/vivek/tweets' USING PigStorage('\\ua001') as (date:chararray,screen_name:chararray,body:chararray);\n\
  ```\n\n接下来，筛选出屏幕名称为 `The News Selector` 的推文：\n\n```\nname = FILTER tweets by screen_name\
  \ matches 'The News Selector';\n```\n\n使用 `GROUP` 命令对 `name` 的所有字段进行分组：\n\n```\n\
  namegroup = group name ALL;\n```\n\n要为 `namegroup` 统计推文数量，可运行带有 `COUNT` 函数的 `FOREACH`\
  \ 命令：\n\n```\ntweetCount = FOREACH namegroup generate  COUNT(name);\ndump tweetCount;\n\
  ```\n\n图 6-12 展示了将 `tweetCount` 转储到控制台的输出结果。屏幕名称 `The News Selector` 的推文数量为 6680。\n\
  \n要将输出结果存储到文件中，我们可以使用 `CSVExcelStorage` 函数。为此，需要先在 Pig 注册表中注册该函数：\n\n![A978-1-4842-0142-8_6_Fig12_HTML.jpg](img/A978-1-4842-0142-8_6_Fig12_HTML.jpg)\n\
  \n图 6-12. 在控制台转储 tweetCount 的输出结果\n\n```\nregister '$PIG_HOME/contrib/piggybank/java/piggybank.jar'\
  \ ;\ndefine CSVExcelStorage org.apache.pig.piggybank.storage.CSVExcelStorage();\n\
  ```\n\n在 Grunt shell 中运行这些命令后，该函数将被注册并可供使用。\n\n继续同样的练习，我们也可以按如下方式存储推文总数：\n\n```\n\
  totalGroup = group tweets ALL;\ntotalCount = foreach totalGroup generate COUNT(tweets);\n\
  store totalCount into 'totalcount' using CSVExcelStorage(',','YES_MULTILINE');\n\
  ```\n\n在 `PIG_HOME` 目录下将创建一个名为 `tweetcount` 的文件夹，其中包含一个名为 `part-r-00000` 的文件，该文件存储了推文总数。\n\
  \n到目前为止，我们已探索了在本地文件系统上使用 Pig 运行 MapReduce 作业。现在，让我们尝试在 Cassandra 文件系统上运行 Pig MapReduce\
  \ 脚本。\n\n值得注意的是，我们可以创建复杂的 Pig 脚本，这些脚本可能最终会运行多个 MapReduce 作业。这类 Pig 脚本的一个问题是按顺序运行这些作业，从而失去了并行编程的优势。此外，您一定也注意到了在运行\
  \ Pig 脚本过程中生成的中间输出，例如加载的推文数据。\n\n### Pig 与 Cassandra 结合使用\n\nCassandra 与 Pig 的集成相当简单。如前所述，要将\
  \ Pig Latin 脚本转换为 Cassandra 上的 MapReduce 作业，需要特定于 Cassandra 的存储函数和连接设置。默认情况下，Apache\
  \ Cassandra 在其包 `org.apache.cassandra.hadoop.pig` 下提供了内建函数支持，用于与 Pig 集成。\n\n在本节中，我们将使用基于\
  \ CQL 的存储函数进行练习。读者也可以使用 `CassandraStorage` 来运行相同的练习，该函数主要针对以非 CQL 方式创建的列族。有关 CQL\
  \ 与 Thrift 的更多详细信息，请参考第 1 章。\n\n第一步是为 Pig 配置 Cassandra 专用设置：\n\n```\n# cassandra\
  \ 守护进程主机，\nexport PIG_INITIAL_ADDRESS=localhost\n/# thrift rpc 端口\nexport PIG_RPC_PORT=9160\n\
  #配置的分区器\nexport PIG_PARTITIONER=org.apache.cassandra.dht.Murmur3Partitioner\n#将\
  \ thrift 库添加到 Pig 的类路径。\nexport PIG_CLASSPATH=/home/vivek/software/apache-cassandra-2.0.4/lib/libthrift-0.9.1.jar\n\
  ```\n\n#### 数据导入\n\n在本节中，我们将创建一个 Cassandra 表来存储推文，并使用 Apache Pig 将推文加载到 Cassandra\
  \ 中。\n\n首先，在 Cassandra 中创建一个键空间（keyspace）和表，如下所示：\n\n```\ncreate keyspace twitter\
  \ with replication = {'class':'SimpleStrategy','replication_factor':1};\nuse twitter;\n\
  create table twitterdata(screen_name text primary key, tweetdate text, body text);\n\
  ```\n\n以本地模式启动 Pig 并加载推文：\n\n```\ntweets = LOAD '/home/vivek/tweets' USING PigStorage('\\\
  ua001') as (date:chararray,screen_name:chararray,body:chararray);\n```\n\n您可能需要根据您的设置更改目录路径。\n\
  \n注册 `apache-cassandra-2.0.4.jar`：\n\n```\nregister '$CASSANDRA_HOME/lib/apache-cassandra-2.0.4.jar';\n\
  define CqlStorage org.apache.cassandra.hadoop.pig.CqlStorage();\n```\n\n使用 `TOTUPLE`\
  \ 生成一个元组：\n\n```\ndata_to = FOREACH tweets GENERATE TOTUPLE(TOTUPLE('screen_name',screen_name)),TOTUPLE(TOTUPLE('tweetdate',date),\
  \ body);\n```\n\n最后，使用 `CqlStorage` 函数将生成的元组存储到 Cassandra 中：\n\n```\nSTORE data_to\
  \ INTO 'cql://twitter/twitterdata?output_query=update twitterdata set tweetdate\
  \ %3D%3F,body %3D%3F' USING CqlStorage();\n```\n\n最后，连接到 cql shell 并验证加载的数据（见图 6-13）：\n\
  \n```\nSelect * from twitterdata;\n```\n\n![A978-1-4842-0142-8_6_Fig13_HTML.jpg](img/A978-1-4842-0142-8_6_Fig13_HTML.jpg)\n\
  \n图 6-13. 控制台展示了持久化到 twitterdata 表中的数据输出结果\n\n您一定已经注意到推文总数是 10,020，但 Cassandra 中的\
  \ `twitterdata` 表却填充了 11 行。原因是同一个屏幕名称对应多条推文，而该列被定义为 `twitterdata` 表的主键。\n\n在现实世界中，数据文件中完全可能存在非唯一字段，用户可能希望\
  \ Cassandra 处理唯一键的部分。我们可以通过定义一个隐式主键（类型为 `timeuuid`）并在原始数据文件外部填充它来解决此问题。在下一个练习中，我们将尝试通过引入唯一主键来解决这个问题。\n\
  \n\n\n#### 使用 timeuuid 加载数据\n\nPig Latin 本身不直接支持 Cassandra 数据类型，例如 `timeuuid` 和\
  \ `uuid`。但有一个名为 Pygmalion (`https://github.com/jeromatron/pygmalion`) 的开源项目，它提供了许多用于\
  \ Cassandra 的 Pig 工具。\n\n你可以通过 `git clone` 或下载压缩包 (`https://github.com/jeromatron/pygmalion/archive/master.zip`)\
  \ 并在本地环境中构建它。或者，你可以在本书下载文件的 `jars` 文件夹中找到 `pygmalion-1.1.0-SNAPSHOT.jar`。\n\n首先，在\
  \ Cassandra 中创建键空间和表，步骤如下：\n\n`create keyspace twitter with replication = {'class':'SimpleStrategy','replication_factor':1};`\n\
  \n`use twitter;`\n\n`create table twitterdata(id timeuuid primary key, screen_name\
  \ text, tweetDate text, body text);`\n\n使用 `PigStorage` 加载推文：\n\n`tweets = LOAD\
  \ '/home/vivek/tweets' USING PigStorage('\\ua001') as`\n\n`(date:chararray,screen_name:chararray,body:chararray);`\n\
  \n向 Pig 注册中心注册 jar 包：\n\n`register /home/vivek/Documents/apress_book/Apress/uuid-3.2.jar;`\n\
  \n`register /home/vivek/Documents/apress_book/Apress/hector-core-0.7.0-28.jar;`\n\
  \n`register /home/vivek/Documents/apress_book/Apress/pygmalion-1.1.0-SNAPSHOT.jar;`\n\
  \n定义 Pig 函数：\n\n`define FromCassandraBag org.pygmalion.udf.FromCassandraBag();`\n\
  \n`define ToCassandraBag org.pygmalion.udf.ToCassandraBag();`\n\n`define CqlStorage\
  \ org.apache.cassandra.hadoop.pig.CqlStorage();`\n\n`define GenerateBinTimeUUID\
  \ org.pygmalion.udf.uuid.GenerateBinTimeUUID();`\n\n使用 `GenerateBinTimeUUID` 函数生成一个包含\
  \ `timeuuid` 值标识符的元组，并从实际的推文文件中获取其他元组：\n\n`data_to = FOREACH tweets GENERATE TOTUPLE(TOTUPLE('id',GenerateBinTimeUUID())),TOTUPLE(TOTUPLE('tweetdate',date),\
  \ body);`\n\n最后，将此数据加载到 Cassandra 中：\n\n`STORE data_to INTO 'cql://twitter/twitterdata?output_query=update\
  \ twitterdata set tweetdate %3D%3F,body %3D%3F' USING CqlStorage();`\n\n现在，你可以查询\
  \ `twitterdata` 列族中已插入的数据：\n\n`Select * from twitterdata;`\n\n`Select count(*) from\
  \ twitterdata;`\n\n到目前为止，我们已经探讨了使用 Apache Pig 将数据加载到 Cassandra 并对其运行 MapReduce 程序的多种方式。对于开发者而言，Apache\
  \ Pig 非常有用，可以快速编写 Pig Latin 脚本以执行 MapReduce 程序，而无需编写冗长的原生 MapReduce 程序。\n\n在下一节中，我们将探讨如何以更常用的\
  \ SQL 方式在 Cassandra 上运行 MapReduce 分析。\n\n## Apache Hive\n\nApache Hive 是一个为存储在 HDFS\
  \ 上的海量数据提供数据分析支持的平台。Hive 提供了多种特性，如内置的 UDTF（用户自定义表函数）、UDAF（用户自定义聚合函数）、对压缩数据的分析，以及最重要的\
  \ Hive 查询语言（Hive QL）。我们将在后续章节中讨论这些函数。\n\n最初，Hive 是作为 Facebook 研究计划的一部分而开发的，后来成为\
  \ Apache 的顶级项目（TLP）。\n\n在本节中，我们将讨论 Hive 的安装、其执行模式以及与 Cassandra 的集成。\n\n### 安装与配置\n\
  \n为了在 MapReduce 模式下安装 Hive，我们需要对 Hadoop 安装进行一些配置。请注意，关于 MapReduce 和 Hadoop 的更多详细信息，可以参考第\
  \ 5 章。\n\n确保 Hadoop 中的 `JAVA_HOME` 已正确配置。你可以通过修改 `$HADOOP_HOME/conf/hadoop-env.sh`\
  \ 并添加 `JAVA_HOME` 指向 `jdk` 安装目录来进行配置：\n\n`export JAVA_HOME=/usr/lib/jvm/java-7-oracle`\n\
  \n通过运行以下命令启动 Hadoop 安装：\n\n`$HADOOP_HOME/bin/start-all.sh`\n\n请确保名称节点已正确格式化。更多详细信息请参考第\
  \ 5 章。如果你遇到类似如下错误：\n\n`connect to host localhost port 22: Connection refused`\n\n\
  你需要在你的机器上安装一个 SSH 服务器。对于 Ubuntu 系统，你可以通过运行 `sudo apt-get install openssh-server`\
  \ 进行安装。\n\n![A978-1-4842-0142-8_6_Fig14_HTML.jpg](img/A978-1-4842-0142-8_6_Fig14_HTML.jpg)\n\
  \n图 6-14。\n\n显示所有 Hadoop 进程正在运行。之后，请验证所有 Hadoop 进程是否都已正常运行（图 6-14）。\n\n接下来，你需要安装并运行\
  \ Hive：\n\n首先，从 `http://apache.mirrors.tds.net/hive/` 下载最新的 jar 包。将 tarball 解压到一个本地文件夹，并将该文件夹设置为\
  \ `HIVE_HOME`。在 `$HIVE_HOME/bin/hive.sh` 文件中设置 `HADOOP_HOME`。当 Hive 的此配置完成后，我们可以通过运行\
  \ `$HIVE_HOME/bin/hive.sh` 来启动 Hive 客户端。\n\n### 理解 UDF、UDAF 和 UDTF\n\nHive 自带内置的用户自定义函数（UDF）、用户自定义聚合函数（UDAF）和用户自定义表函数（UDTF）。我们可以通过\
  \ Hive 客户端获取可用函数的列表并对其进行描述：\n\n`SHOW FUNCTIONS;`\n\n`DESCRIBE FUNCTION <函数名称>;`\n\
  \n`DESCRIBE FUNCTION EXTENDED <函数名称>;`\n\nHive 内置的 UDF 包括 `round()`、`pow()` 和 `rand()`\
  \ 等函数。此外，还有如 `mapkeys` 和 `map_values` 的内置集合函数，分别返回键和值的无序列表。有关 UDF 的更多信息，请参阅 `https://cwiki.apache.org/confluence/display/Hive/LanguageManual+UDF#LanguageManualUDF-Built-inFunctions`。\n\
  \nHive 支持的常用内置 UDAF 包括 `count`、`min`、`max` 和 `percentile` 等函数。有关支持的聚合函数的详细列表，你也可以参考\
  \ `https://cwiki.apache.org/confluence/display/Hive/LanguageManual+UDF#LanguageManualUDF-Built-inAggregateFunctions(UDAF)`。\n\
  \n此外，还有一些在表级别对多行数据进行操作的表生成 UDTF。例如，`explode` 函数会为每个数组元素生成一行。更多详细信息和用法，请访问 `https://cwiki.apache.org/confluence/display/Hive/LanguageManual+UDF#LanguageManualUDF-Built-inTable-GeneratingFunctions(UDTF)`。\n\
  \n### Hive 表\n\nHive 提供了创建两种类型表的机制：\n\n*   Hive 管理表\n*   Hive 外部表\n\n对于 Hive 管理表，Hive\
  \ 负责管理表的元数据和实际数据。删除此类表也会导致数据被删除。而对于外部表，其不受 Hive 管理，任何删除表的操作都不会导致数据被删除。我们将在接下来的练习中进一步探讨这些表类型。\n\
  \n\n\n### 本地文件系统数据加载\n\n在本节中，我们将进一步讨论 Hive 的 DDL/DML 操作。在第一个练习中，我们将在 Hive 中创建一个简单的模式，并从本地文件系统加载数据。\n\
  \n首先，我们创建一个数据库：\n\n```sql\ncreate database employee_store;\n```\n\n接下来，按如下方式创建一个表：\n\
  \n```sql\nuse employee_store;\n```\n\n```sql\ncreate table employee(person_id string,\
  \ fname string) row format delimited fields terminated by ',';\n```\n\n在这里，通过一个表\
  \ DDL 操作，我们定义了字段由 `','` 分隔。\n\n我们可以按如下方式从本地文件系统加载数据：\n\n```sql\nload data local\
  \ inpath '/home/vivek/Documents/apress_book/Apress/datafiles/person_store' overwrite\
  \ into table employee ;\n```\n\n最后，我们可以查看已插入的数据（见图 6-15）：\n\n```sql\nselect * from\
  \ employee;\n```\n\n![A978-1-4842-0142-8_6_Fig15_HTML.jpg](img/A978-1-4842-0142-8_6_Fig15_HTML.jpg)\n\
  \n图 6-15. 从员工表中获取的行\n\n我们来讨论一下基于 Hive、Hadoop 和 Cassandra 的架构会是什么样子。图 6-16 中的图像描绘了\
  \ Hive 驱动的 MapReduce 作业如何在 Cassandra 数据节点上运行。在这里，每个 Hive 查询都将被转换为一个 MapReduce 作业并提交给\
  \ Hadoop，而 Hadoop 又会依赖名称节点和元数据来识别 Cassandra 数据节点，以便在这些数据节点上本地运行相应的映射和归约任务。\n\n![A978-1-4842-0142-8_6_Fig16_HTML.jpg](img/A978-1-4842-0142-8_6_Fig16_HTML.jpg)\n\
  \n图 6-16. 该图描绘了在 Cassandra 数据节点上运行 Hive MapReduce 的架构表示\n\n值得一提的是，在 HDFS 上运行 Hive\
  \ MapReduce 作业与图 6-17 所示相同，只是数据块属于 HDFS，而非 Cassandra 节点。\n\n### HDFS 数据加载\n\n我们还可以使用\
  \ `load data` 命令从 HDFS 加载数据到 Hive 托管表中。让我们通过一个简单的练习来探索这一部分：\n\n我们使用 `put` 命令将推文文件放到\
  \ HDFS 上：\n\n```bash\nbin/hadoop fs -put /home/vivek/Documents/apress_book/Apress/datafiles/person_store\
  \ /usr/vivek/employee_store/infile\n```\n\n我们可以使用 `load` 命令直接将数据加载到 HDFS 目录，如下所示：\n\
  \n```sql\nload data inpath  '/usr/vivek/employee_store/infile' overwrite into table\
  \ employee ;\n```\n\n这里的区别在于使用的是 `load data inpath` 而不是 `load data local inpath`，这使得可以将文件路径映射到\
  \ HDFS 目录（例如，`/usr/vivek/employee_store/infile`）。\n\n最后，我们可以查看已插入的数据（见图 6-17）：\n\
  \n```sql\nselect * from employee;\n```\n\n我们还可以使用条件查询，例如根据姓名获取员工信息（见图 6-18）：\n\n\
  ![A978-1-4842-0142-8_6_Fig17_HTML.jpg](img/A978-1-4842-0142-8_6_Fig17_HTML.jpg)\n\
  \n图 6-17. 通过 Hive shell 从员工表中获取行\n\n```sql\nselect * from employee where fname =\
  \ 'vivek';\n```\n\n![A978-1-4842-0142-8_6_Fig18_HTML.jpg](img/A978-1-4842-0142-8_6_Fig18_HTML.jpg)\n\
  \n图 6-18. 获取 fname 为 vivek 的行\n\n运行此类查询时，除非条件列不是分区键，否则它们会被转换为 MapReduce 作业。对分区键的查询可以直接从数据节点获取数据，并且由于数据已经按分区键进行了分区，因此不需要\
  \ MapReduce 进程。我们可以在创建表时定义分区键，如下所示：\n\n```sql\nCREATE TABLE employee (\n  fname\
  \  String,\n  lname  String,\n  emailId   String,\n  salary      FLOAT,\n)\nPARTITIONED\
  \ BY (location STRING, joining_year INT, joining_month INT, joining_day INT) ;\n\
  ```\n\n任何涉及分区键所有部分的条件查询都将快速定位数据文件夹，因为数据会根据所定义的分区键自动排列到不同的文件夹中。\n\n### Hive 外部表\n\
  \n我们还可以在 HDFS 目录上创建 Hive 外部表。如果不需要由 Hive 管理，建议创建外部表。\n\n让我们重新审视同一个推文示例，用于外部表的练习。\n\
  \n我们使用 `put` 命令将推文文件放到 HDFS 上（见图 6-19）：\n\n```bash\nbin/hadoop fs -put /home/vivek/Documents/apress_book/Apress/datafiles/person_store\
  \ /usr/vivek/employee_store/infile\n```\n\n然后，我们可以在 Hive 中基于 HDFS 位置创建一个外部表：\n\n\
  ![A978-1-4842-0142-8_6_Fig19_HTML.jpg](img/A978-1-4842-0142-8_6_Fig19_HTML.jpg)\n\
  \n图 6-19. 包含员工记录的 Hive 目录\n\n```sql\ncreate external table employee_ext(person_id\
  \ string, fname string) row format delimited fields terminated by ',' location 'hdfs://localhost:9000/usr/vivek/employee_store';\n\
  ```\n\n这里的 `hdfs://localhost:9000` 是 `fs.default.name` 属性的值。\n\n我们可以查看已插入的数据（见图\
  \ 6-20）：\n\n```sql\nselect * from employee_ext;\n```\n\n![A978-1-4842-0142-8_6_Fig20_HTML.jpg](img/A978-1-4842-0142-8_6_Fig20_HTML.jpg)\n\
  \n图 6-20. 从 employee_ext 外部表中获取记录\n\n\n\n### Hive 与 Cassandra 的结合\n\n借助外部表支持，可以通过使用\
  \ Cassandra 特有的 `storageHandler` 实现，来利用 Hive 对 Cassandra 进行数据分析。DataStax ([`www.datastax.com`](http://www.datastax.com/))\
  \ 提供了诸如 DataStax Enterprise (DSE) 等商业产品，这些产品实现了与 Hive 等工具的无缝集成。在本章稍后的“Apache Sqoop”部分，我们将深入探讨\
  \ DSE 的相关功能。\n\n在本节中，我们将讨论开源 Apache Cassandra 与 Hive 的集成。一个可用的开源实现是 Cassandra 特有的存储处理器，可在\
  \ [`https://github.com/tuplejump/cash`](https://github.com/tuplejump/cash) 找到。你可以通过\
  \ `git clone` 或下载 zip 源码包并在本地构建以获取 jar 包。或者，你可以在 `jars` 文件夹中找到这些 jar 包作为源码附件。\n\n\
  在我们的示例中，我们将先在 Cassandra 中创建一个表，然后在 Hive 中创建外部表，以探索通过 Cassandra 和 Hive 插入的数据。\n\n\
  首先，我们创建一个 `twitter` 键空间和 `twitterdata` 表：\n\n```\ncreate keyspace twitter with replication={'class':'SimpleStrategy','replication_factor':2};\n\
  ```\n\n```\nuse twitter;\n```\n\n```\ncreate table twitterdata(tweet_id timeuuid\
  \ primary key, body text, tweeted_by text);\n```\n\n让我们使用 `insert` 命令插入几条记录：\n\n\
  ```\ninsert into twitterdata(tweet_id,body,tweeted_by) values(now(),'my first tweet','@mevivs');\n\
  ```\n\n```\ninsert into twitterdata(tweet_id,body,tweeted_by) values(now(),'Cassandra\
  \ book:beginning cassandra development','@apress_team');\n```\n\n```\ninsert into\
  \ twitterdata(tweet_id,body,tweeted_by) values(now(),'Technical review position\
  \ available for #Parse and #Phonegap related @Apress titles: paid','@apress_team');\n\
  ```\n\n```\ninsert into twitterdata(tweet_id,body,tweeted_by) values(now(),'Android\
  \ Apps Security http://t.co/5XLSObkk9f','@jhassel');\n```\n\n现在，通过配置 Cassandra 存储处理器、Thrift\
  \ 和 Cassandra 特有的 jar 包，连接到 Hive shell：\n\n```\n/home/vivek/software/hive-0.9.0/bin/hive\
  \ --auxpath /home/vivek/source/cash/cassandra-handler/target/hive-cassandra-1.2.9.jar:/home/vivek/.m2/repository/org/apache/cassandra/cassandra-all/1.2.9/cassandra-all-1.2.9.jar:/home/vivek/software/apache-cassandra-2.0.4/lib/libthrift-0.9.1.jar:/home/vivek/.m2/repository/org/apache/cassandra/cassandra-thrift/1.2.9/cassandra-thrift-1.2.9.jar\n\
  ```\n\n成功连接到 Hive shell 后，我们可以按如下方式创建外部表：\n\n```\nCREATE EXTERNAL TABLE twitter.twitterdata(tweet_id\
  \ string, body string, tweeted_by string) STORED BY 'org.apache.hadoop.hive.cassandra.cql.CqlStorageHandler'\
  \ WITH SERDEPROPERTIES (\"cql.primarykey\" = \"message_id, author\", \"comment\"\
  =\"check\", \"read_repair_chance\" = \"0.2\", \"dclocal_read_repair_chance\" = \"\
  0.14\", \"gc_grace_seconds\" = \"989898\", \"bloom_filter_fp_chance\" = \"0.2\"\
  , \"compaction\" = \"{'class' : 'LeveledCompactionStrategy'}\", \"replicate_on_write\"\
  \ = \"false\", \"caching\" = \"all\");\n```\n\n请注意，Cassandra 存储处理器项目目前尚不支持 Hive\
  \ 管理的 Cassandra 表。尝试像这样创建一个 Hive 管理表：\n\n```\nCREATE TABLE twitter.twitterdata_hive(tweet_id\
  \ string, body string, tweeted_by string) STORED BY 'org.apache.hadoop.hive.cassandra.cql.CqlStorageHandler'\
  \ WITH SERDEPROPERTIES (\"cql.primarykey\" = \"message_id, author\", \"comment\"\
  =\"check\", \"read_repair_chance\" = \"0.2\", \"dclocal_read_repair_chance\" = \"\
  0.14\", \"gc_grace_seconds\" = \"989898\", \"bloom_filter_fp_chance\" = \"0.2\"\
  , \"compaction\" = \"{'class' : 'LeveledCompactionStrategy'}\", \"replicate_on_write\"\
  \ = \"false\", \"caching\" = \"all\");\n```\n\n将会导致如图 6-21 所示的错误。\n\n![A978-1-4842-0142-8_6_Fig21_HTML.jpg](img/A978-1-4842-0142-8_6_Fig21_HTML.jpg)\n\
  \n图 6-21.\n\n展示了在 Hive 中为 Cassandra 创建内部表时出现的错误\n\n到目前为止，我们已经探索了通过 Hive 和 Pig 对\
  \ Cassandra 执行 MapReduce 算法的多种方式。数据分析的另一个重要方面是数据迁移，即为了可扩展性和性能，需要将现有的关系型数据库管理系统（RDBMS）数据迁移到\
  \ Cassandra。\n\n在下一节中，我们将深入探讨数据迁移的相关内容。\n\n## 数据迁移\n\n使用传统 RDBMS 构建的传统应用程序，如果希望借助\
  \ NoSQL 数据库实现可扩展性和性能，可能需要将数据从 RDBMS 迁移到 Cassandra。例如，金融应用程序希望迁移交易日志，以及那些将活动日志存储在\
  \ RDBMS 中的热门网站现在希望将这些日志迁移到 Cassandra。\n\n### 传统方式\n\n这是从 MySQL 等 RDBMS 以 CSV 格式文件导出数据并加载到\
  \ Cassandra 中最简单的方法。让我们通过一个示例练习来更详细地讨论这一点。\n\n首先，在 MySQL 中创建一个数据库和表：\n\n```\ncreate\
  \ schema twitter;\n```\n\n```\ncreate table twitterdata(id varchar(20) primary key,screen_name\
  \ varchar(20),body varchar(30));\n```\n\n插入一些示例推文：\n\n```\ninsert into twitterdata('1','mevivs','my\
  \ first tweet');\n```\n\n```\ninsert into twitterdata values('2','jhassel','my first\
  \ tweet');\n```\n\n```\ninsert into twitterdata values('3','rfernando','my first\
  \ tweet');\n```\n\n让我们从 `twitterdata` 表中导出数据：\n\n```\nselect * from twitterdata\
  \ INTO OUTFILE '/tmp/mysql_output.csv' Fields TERMINATED BY ',' ENCLOSED BY '\"\
  ' LINES TERMINATED BY '\\n';\n```\n\n接下来，在 Cassandra 中创建一个表和键空间：\n\n```\ncreate\
  \ table ntwitterdata(id text primary key, screen_name text, bodt text);\n```\n\n\
  最后，我们可以在 cql shell 中使用 `copy` 命令从 csv 文件复制 `twitterdata`：\n\n```\ncopy twitterdata\
  \ from '/tmp/mysql_output.csv';\n```\n\n这样，我们就可以通过传统方式执行数据迁移。不幸的是，这种方式是本地化的。\n\n\
  这看起来很简单，但迁移包含多个表的完整模式（schema）呢？提供模式名称是否就足以建立隧道并迁移数据？Apache Sqoop（SQL 到 Hadoop）就是这些问题的答案。\n\
  \n### Apache Sqoop\n\nApache Sqoop 是一个用于将数据从关系数据库传输到 NoSQL 数据库（如 Cassandra）或分布式文件系统（如\
  \ Hadoop）的工具。Sqoop 自 2012 年起成为 Apache 的顶级项目（TLP）。当我们需要在 RDBMS 和 NoSQL（例如 Cassandra、Hadoop）之间建立数据迁移隧道时，Sqoop\
  \ 非常有用。\n\n在本节中，我们将使用 DataStax 的 DSE 来演示 Sqoop 与 Cassandra 的集成。关于 DSE 设置和配置的更多详细信息，请参考以下链接：\n\
  \n[`http://www.datastax.com/docs/datastax_enterprise3.1/reference/start_stop_dse`](http://www.datastax.com/docs/datastax_enterprise3.1/reference/start_stop_dse)\n\
  \n[`http://www.datastax.com/docs/datastax_enterprise3.0/install/install_rpm_pkg`](http://www.datastax.com/docs/datastax_enterprise3.0/install/install_rpm_pkg)\n\
  \n你也可以下载并解压 tarball 到本地文件夹。\n\n\n\n### 使用 Cassandra 的 Sqoop\n\n作为一个练习示例，我们将使用之前用过的相同\
  \ tweets 文件，并最终利用 DSE 的 Sqoop 支持，将数据从 MySQL 迁移到 Cassandra。\n\n首先，让我们连接到 MySQL 客户端：\n\
  \n`mysql -u root -p –local-infile`\n\n接下来，我们将创建一个键空间 `twitter` 和表 `twitterdata`：\n\
  \n```sql\ncreate keyspace twitter with replication={'class':'SimpleStrategy','replication_factor':2};\n\
  use twitter;\ncreate table twitterdata(tweetdate varchar(50),screen_name varchar(50),body\
  \ varchar(300), id int NOT NULL AUTO_INCREMENT, PRIMARY KEY(id));\n```\n\n让我们将 tweets\
  \ 数据加载到 `twitterdata` 表中（见图 6-22）：\n\n```sql\nLOAD DATA LOCAL INFILE '/home/vivek/tweets'\
  \ INTO TABLE twitterdata FIELDS TERMINATED BY 0x01 LINES TERMINATED BY '\\n';\n\
  ```\n\n接下来，启动带有 Hadoop 的 DSE Cassandra：\n\n![A978-1-4842-0142-8_6_Fig22_HTML.jpg](img/A978-1-4842-0142-8_6_Fig22_HTML.jpg)\
  \  \n\n**图 6-22.** 从本地文件系统将文件加载到 Hive 表中\n\n`bin/dse cassandra -t`\n\n之后，按如下方式运行\
  \ `sqoop import`：\n\n`bin/dse sqoop import --connect jdbc:mysql://localhost/twitter\
  \ --username root -P --table twitterdata --cassandra-keyspace twitter --cassandra-column-family\
  \ twitterdata --cassandra-row-key id --cassandra-thrift-host localhost –cassandra-create-schema`\n\
  \n成功导入后，让我们通过 `cassandra-cli` 探索 `twitterdata` 列族（见图 6-23）：\n\n`$DSE_HOME/bin/cassandra-cli`\n\
  \n你可以通过 `cqlsh` 探索 `twitterdata` 表（见图 6-24）：\n\n![A978-1-4842-0142-8_6_Fig23_HTML.jpg](img/A978-1-4842-0142-8_6_Fig23_HTML.jpg)\
  \  \n\n**图 6-23.** 探索 `cassandra-cli` 中已加载的数据\n\n`$DSE_HOME/bin/cqlsh`\n\n![A978-1-4842-0142-8_6_Fig24_HTML.jpg](img/A978-1-4842-0142-8_6_Fig24_HTML.jpg)\
  \  \n\n**图 6-24.** 描述 `twitterdata` 表\n\n由此，我们得出结论，Sqoop 可以很方便地与 Cassandra 配合使用，用于数据迁移。\n\
  \n下一章将讨论图数据库。\n\n## 本章小结\n\n以下是本章讨论主题的总结：\n\n-   配置并运行基于 Hive 的查询，以类 SQL 的方式集成和运行\
  \ MapReduce 作业。\n-   如果读者精通脚本编程并熟悉编写脚本，Pig 会非常有用。\n-   使用 Sqoop 将数据从 HDFS/MySQL\
  \ 迁移到 Cassandra，反之亦然。\n\n下一章将展开新的范式——基于图的数据库的讨论。该章将讨论为什么、如何以及何时使用图数据库，最重要的是，如何结合\
  \ Cassandra 使用。\n\n"
- "# 7. 结合 Cassandra 的 Titan 图数据库\n\n到目前为止，我们已经讨论了 Cassandra 中的数据建模，以及使用 Hadoop 和相关技术构建大型数据分析平台。当业务需求要求各种对象之间存在互联性时，答案是在多个对象之间进行引用（连接）查询。一切看起来很美好，直到我们不得不处理许多此类关系，或者数据量变得非常庞大。\n\
  \nLinkedIn、Twitter 和 Facebook 都是典型的例子，其中注册用户之间的关系可以描述为一个社交图谱。另一个例子可能是构建信用历史，并对向一组客户发放贷款进行风险分析。当然，使用多个表和连接理论，我们可以实现一个解决方案，但它显然不具备可扩展性和高性能。这正是使用图数据库的想法大显身手的地方。\n\
  \n在本章中，我们将讨论：\n\n-   图概念简介\n-   图框架与数据库\n-   Titan 图数据库的安装与设置\n-   图用例\n\n## 图简介\n\
  \n图论可以追溯到 1736 年。图是一种由顶点/节点和边组成的数据结构。一个图可以有零条或多条边。没有边的图也称为空图。\n\n顶点是一个图节点，它通过边连接到其他图节点/顶点。每条边是一条弧或线段，用于连接多个顶点。\n\
  \n在计算机科学中，图可以按多种方式进行分类。其中一些流行的分类包括：\n\n-   简单图与非简单图\n-   有向图与无向图\n-   有环图与无环图\n\n\
  ### 简单图与非简单图\n\n简单图，顾名思义，是一种基本的图，其任意两个顶点之间最多只有一条边。它是一个没有自环但有多节点的图（见图 7-1a）。另一方面，有自环和多条边的图是非简单图（见图\
  \ 7-1b）。这里，自环是一条连接到顶点自身的边。在同两个节点之间有多条边的图也称为多重图或并行图。图 7-1c 所示的图既是一个多重图也是一个自环图。它在顶点\
  \ A 上包含一个自环，并且在顶点 A 和 B 之间有多条边。\n\n![A978-1-4842-0142-8_7_Fig1_HTML.jpg](img/A978-1-4842-0142-8_7_Fig1_HTML.jpg)\
  \  \n\n**图 7-1.** a) 左侧为简单图；b) 中间为非简单图；c) 带自环的多重图\n\n### 有向图与无向图\n\n具有多个节点和有向边的图是有向图（见图\
  \ 7-2a）。无向图是边没有方向的图（见图 7-2b）。\n\n![A978-1-4842-0142-8_7_Fig2_HTML.jpg](img/A978-1-4842-0142-8_7_Fig2_HTML.jpg)\
  \  \n\n**图 7-2.** a) 左侧为有向图，带有有向边；b) 无向图\n\n### 有环图与无环图\n\n如果一个图沿着一条路径（至少包含一条边）遍历，并且起点和终点在同一个顶点上，则称该图包含一个环，而非环或无环图则不包含任何环。此类图可以是有向的或无向的。图\
  \ 7-3 展示了有环图和无环图的图形表示。\n\n![A978-1-4842-0142-8_7_Fig3_HTML.jpg](img/A978-1-4842-0142-8_7_Fig3_HTML.jpg)\
  \  \n\n**图 7-3.** a) 虚线显示了图中的一个环；b) 无环图\n\n图 7-3a 表示一个有环图，其中的环由连接顶点 B、C 和 D 的虚线表示。\n\
  \n这些是几种基本的图类型。接下来可能会想到的问题是，是否有专门为处理图相关问题而构建的开源工具、框架或数据库？\n\n## 用于图的开源软件\n\n开源软件是免费的，易于提交错误报告并根据我们的需求请求功能修改，最重要的是成本效益高。近年来，在\
  \ IT 行业使用开源软件变得流行起来，越来越多的组织倾向于使用开源解决方案。在采用开源解决方案之前需要考虑的几个因素是：\n\n-   应该成熟稳定\n- \
  \  应该处于积极开发中，并且必须有社区支持\n-   必须有生产环境中的系统来验证行业应用\n\n我们之前问过是否有解决图相关问题的工具、框架或数据库。那么，让我们来探索一下吧！\n\
  \n### 图框架：TinkerPop\n\n图框架用于图数据建模和可视化。在本节中，我们将讨论 TinkerPop（[`www.tinkerpop.com/`](http://www.tinkerpop.com/)）及其功能集。许多\
  \ NoSQL 数据库（包括 Titan）都将 TinkerPop Blueprints 用作规范。Blueprints 为图数据建模提供了一套接口和实现，稍后将在本节中进行讨论。\n\
  \nTinkerPop 是一个开源图计算框架，拥有多个组件、框架和命令行工具，用于处理图数据建模和可视化。在本节中，我们将逐一讨论它们。\n\n\n\n"
- '# Pipes


  `Pipes` 是一个数据流框架，能够实现从输入到输出的数据拆分、合并、过滤和转换。计算以节省内存的惰性方式进行评估。


  将 `Pipes` 视为由边连接的顶点，通常具有用于数据提取、转换和计算的函数。


  '
- '# Gremlin


  `Gremlin` 是一种图遍历语言，用于图查询、分析和操作。`Gremlin` 发行版内置了对 Java 和 Groovy 的 API 支持。我们将在本章后面的“命令行工具和客户端”部分详细讨论与
  Titan 相关的 `Gremlin`。


  '
- '# Frames


  `Frames` 将 `Blueprints` 图的元素暴露为 Java 对象。通过 `Frames`，软件不再以顶点和边的方式来编写，而是以领域对象及其相互关系的方式来编写。


  '
- '# Rexster


  `Rexster` 是一个多功能的图服务器，它通过多种机制（主要侧重于 REST）暴露任何 `Blueprints` 图。它通过 REST API 和 `RexPro`
  协议暴露图服务器。`RexPro` 是 `Rexster` 的一种二进制协议，可用于将 `Gremlin` 脚本发送到远程的 `Rexster` 实例。脚本在服务器上处理，结果被序列化并返回给调用客户端。它还提供了基于浏览器的界面工具，称为
  Dog House 和 `Rexster` 控制台（后者将在 Titan 生态系统中讨论）。


  '
- '# Furnace


  `Furnace` 是一个属性图算法包。它提供了标准图分析算法的实现，这些算法可以以有意义的方式应用于属性图。`Furnace` 提供了针对不同图计算场景（如单机图和分布式图）而优化的不同图算法实现。


  > **注意：** 单机图涉及单个节点上的图数据，而分布式图则将数据分布在多个节点上。


  '
- "# Blueprints\n\n正如其名，`Blueprints` 是一个属性图模型接口，并提供了相应的实现。实现了 `Blueprints` 接口的数据库会自动支持启用\
  \ `Blueprints` 的应用。\n\n可以将 `Blueprints` 视为图数据库的 JDBC（Java 数据库连接）或 JPA（Java 持久化 API）\
  \ API。大多数图数据库都实现了 `Blueprints`。图 7-4 展示了如何将 `Blueprints` 与前面提到的 TinkerPop 组件结合起来的可视化表示。\n\
  \n![A978-1-4842-0142-8_7_Fig4_HTML.jpg](img/A978-1-4842-0142-8_7_Fig4_HTML.jpg)\n\
  \n**图 7-4.** TinkerPop Blueprints 实现\n\n至此，我们已经涵盖了 TinkerPop 框架及其组件，以及其他与图相关的概念。下一个问题是，是否存在可以被视为图数据库的基于图的解决方案。在下一节中，我们将回答这些问题。\n\
  \n## 图即数据库\n\n与传统的 RDBMS 相比，NoSQL 数据库更少关注模式，更多关注非规范化的数据形式。但图数据库提供了通过边定义节点之间关系的灵活性，这就是为什么可以很容易地根据\
  \ RDBMS 概念来理解它们。使用 RDBMS 构建类似图的查询当然是可能的，但如前所述，其用途非常有限。对于非图数据库，运行基于图的查询以进行遍历或构建图结构的能力不受支持，并且构建起来可能很繁琐。由于固有的图数据结构支持，图数据库将比传统的\
  \ RDBMS 更具优势。\n\nRDBMS 和图数据库之间的一些区别如下：\n\n*   图数据库无需索引查找，因为节点或顶点知道它们所连接的属性（例如边），而\
  \ RDBMS 则需要依赖索引机制。\n*   通过边相互连接的两个顶点可能在属性上有所不同，并且可以动态演变，但 RDBMS 强加了一套固定的模式。\n* \
  \  在图数据库中，两个顶点之间的关系存储在记录级别，而在 RDBMS 中，它是在表级别定义的。\n\n我们需要记住一件事，当前的应用开发时代是为特定需求使用特定技术的时代，这非常适合构建多语言或混合解决方案。这意味着，当你的需求最适合通过运行类似图的查询来满足，并且你的要求倾向于更快的基于图的模型时，答案很简单：使用图数据库。图数据库使用节点和边及其属性来构建数据并将其存储在图结构中。图数据库中的每个元素都有一个对相邻节点的引用，这意味着不需要索引查找。图\
  \ 7-4 展示了一个图数据库的示例，它将 Twitter 用户存储为节点，将其关注者存储为边。每个节点包含 `fname`、`id`、`lname` 和 `role`\
  \ 作为属性，而每条边都有一个属性来表示用户成为其相邻节点（即用户）关注者的日期。\n\n![A978-1-4842-0142-8_7_Fig5_HTML.jpg](img/A978-1-4842-0142-8_7_Fig5_HTML.jpg)\n\
  \n**图 7-5.** 存储 Twitter 用户、其属性和关注者的图数据库\n\n图 7-5 展示了用户 `mevivs`、`chris_n`、`apress_team`\
  \ 和 `melissa_m` 的 Twitter 连接和关注者图。这里，顶点 `apress_team` 被顶点 `mevivs` 和 `melissa_m`\
  \ 关注。另一方面，在 `chris_n` 和 `apress_team` 之间存在一个传递关系/遍历，`chris_n` 关注了 `mevivs`，`mevivs`\
  \ 关注了 `apress_team`，而 `apress_team` 又关注了 `chris_n`。在“Gremlin Shell”和“用例”部分，我们将引用相同的\
  \ Twitter 示例来探索示例练习中的命令行工具和 Java API。在考虑此类传递性图查询时，值得讨论的一点是图数据库处理此类查询的方式与 SQL 查询不同。使用\
  \ SQL 处理此类传递性查询并不直接，需要执行复杂的连接、并集或交集。但是，使用图数据库处理此类传递性查询要容易得多，只需要根据边的属性跟踪边以进行传入和传出的数据查询即可。“用例”部分将讨论这些图遍历。\n\
  \n让我们来谈谈可用的图数据库。一些流行的图数据库包括：\n\n*   Neo4J\n*   OrientDB\n*   Objectivity 的 InfiniteGraph\n\
  *   Titan\n\n由于本章的目的是详细讨论 Cassandra 和 Titan 图数据库，因此我们只讨论此处提到的其他数据库提供的重要功能。\n\n###\
  \ Neo4J\n\nNeo4J ([www.neo4j.org/](http://www.neo4j.org/)) 是一个基于 GPU（通用公共许可证）许可的开源数据库。它由\
  \ Neo Technology Inc. 开发。它以节点的形式存储数据，节点通过有向边连接。它提供的一些重要功能包括：\n\n*   可扩展且高可用的数据\n\
  *   完全的 ACID 事务支持\n*   基于 REST 的访问\n*   支持 `Cypher` 和 `Gremlin` 图查询语言\n\n### OrientDB\n\
  \nOrientDB ([www.orientechnologies.com/orientdb/](http://www.orientechnologies.com/orientdb/))\
  \ 是一个基于 Apache 2 许可的 NoSQL 图数据库。它由 Orient Technologies 的 Luca Garulli 管理和开发。OrientDB\
  \ 提供的一些重要功能包括：\n\n*   基于 REST 的访问\n*   完全的 ACID 事务支持\n*   用于查询支持的类似 SQL 的接口\n\n\
  ### InfiniteGraph\n\nInfiniteGraph ([www.infinitegraph.com/](http://www.infinitegraph.com/))\
  \ 是由 Objectivity Inc. 构建的企业级分布式图数据库。InfiniteGraph 支持的一些重要功能包括：\n\n*   支持并发性和一致性\n\
  *   完全的 ACID 事务支持\n*   可视化工具\n\n\n\n#### Titan\n\n`Titan`（`thinkaurelius.github.io/titan/`）是一个基于\
  \ Apache 许可的可扩展图数据库，用于以节点和边的形式存储大量数据。它支持 `Cassandra` 作为后端存储。其一些重要特性包括：\n\n- 通过 `Lucene`/`ES`\
  \ 支持全文搜索和地理空间查询\n- 支持 `ACID`\n- 最终一致性和中间一致性\n- 支持多种数据库，适用于多语言图应用\n- 支持 `Gremlin`\
  \ 和 `Cypher`\n\n`Titan` 及其各个组件将在后续章节中讨论。\n\n## Titan 图数据库\n\n`Titan` 是一个事务性图数据库，允许数千名并发用户实时执行复杂的图遍历查询。它还通过\
  \ `Hadoop` 集成提供了图数据分析、报表和 `ETL` 支持。它内建了对 `Elasticsearch` 和 `Lucene` 的支持，用于地理空间查询和全文搜索。它还原生支持\
  \ `Blueprint` `TinkerPop` 图栈。\n\n图 7-6 展示了 `Titan` 生态系统的图形化表示。\n\n![A978-1-4842-0142-8_7_Fig6_HTML.jpg](img/A978-1-4842-0142-8_7_Fig6_HTML.jpg)\n\
  \n图 7-6. Titan 生态系统\n\n### 基本概念\n\n在本节中，我们将介绍一些对理解 `Titan` 图数据库至关重要的基本概念。\n\n####\
  \ 以顶点为中心的索引\n\n以顶点为中心的索引特定于某个顶点。大多数对引用或非引用顶点的遍历都是通过边及其属性进行的。对这些属性或边标签进行索引可以避免性能开销。这类索引也可称为局部索引。以顶点为中心的索引的目的是根据边的属性和标签对顶点的邻接边进行排序和索引。\n\
  \n`Titan` 还支持 `Elasticsearch`，它可以以独立模式或内嵌模式与 `Titan` 一起运行。使用 `Elasticsearch` 还可以执行全文搜索、地理空间查询和数值范围查询。`Elasticsearch`\
  \ 也允许我们对未索引的属性进行查询。\n\n#### 边压缩\n\n通过边压缩，`Titan` 可以存储压缩后的元数据并保持较低的内存占用。它还可以将所有边的标签和属性存储在同一数据块中，以实现更快的检索。\n\
  \n#### 图分区\n\n这是底层数据库最为关键的地方。在 `Cassandra` 中，我们知道某一行数据会存储在单个 `Cassandra` 节点上。`Titan`\
  \ 理解，通过按顶点 ID 排序键，它可以有效地对图数据进行分区并分布到 `Cassandra` 节点上。顶点 ID 是一个 64 位的唯一值。\n\n默认情况下，`Titan`\
  \ 采用随机分区策略，将顶点随机分配给节点。随机分区效率高，且能使集群保持平衡，但如果采用多种后端存储来存储图，则会导致性能问题，并需要在实例之间进行跨数据库通信。使用\
  \ `Titan`，我们还可以配置显式分区。通过显式分区，我们可以控制并将遍历的子图存储在同一节点上。\n\n我们可以按如下方式在 `Titan` 中启用显式分区：\n\
  \n```\ncluster.partition = true\ncluster.max-partitions = 16\nids.flush = false\n\
  ```\n\n这里`cluster.max-partitions`是每个集群的最大分区数。同时，我们还需要禁用刷新 ID。\n\n当使用 `Cassandra`\
  \ 作为存储后端选项时，必须使用 `ByteOrderedPartitioner` 进行配置。\n\n`Titan` 将顶点及其邻接边和属性存储为一个集合。这种机制称为“数据并置”。通过这种机制，连接到某个顶点的边及其属性将被存储在一起。每一行将包含一个顶点\
  \ ID 作为键，邻接边和属性作为单元格。这种数据表示格式在所有支持的数据库中都是通用的。\n\n图 7-7 和 7-8 展示了 `Titan` 的数据布局和边存储机制。（图片来源于\
  \ `https://github.com/thinkaurelius/titan/wiki/Titan-Data-Model` 上的 `Titan` 维基页面，并依据\
  \ Apache 许可证 2.0 版本重复使用，许可证地址为 `http://www.apache.org/licenses/LICENSE-2.0`。）\n\n\
  ![A978-1-4842-0142-8_7_Fig8_HTML.jpg](img/A978-1-4842-0142-8_7_Fig8_HTML.jpg)\n\n\
  图 7-8. Titan 的边存储机制\n\n![A978-1-4842-0142-8_7_Fig7_HTML.jpg](img/A978-1-4842-0142-8_7_Fig7_HTML.jpg)\n\
  \n图 7-7. Titan 的数据布局机制\n\n底层数据存储会将每个顶点及其邻接边和属性存储为单行数据。此外，这些行将按顶点 ID 排序，单元格将按属性和边键排序。动态单元格可以在运行时添加。数据并置非常重要，这就是为什么将顶点和邻接边存储为单行有助于实现高可用性。\n\
  \n#### 后端存储\n\n`Titan` 的存储架构是完全解耦的，支持多种 NoSQL 数据库，包括：\n\n- `Cassandra`\n- `HBase`\n\
  - `BerkeleyDB`\n- `Persistit`\n\n支持多种 NoSQL 数据存储允许根据应用需求选择合适的技术。换句话说，您可以根据特定需求选择特定的技术。基于\
  \ CAP 定理，我们可以选择任何一种支持的数据库。\n\n使用 `Titan`，我们可以通过 `storage.backend` 选项动态配置后端存储。本章中的示例将介绍如何结合\
  \ `Cassandra` 使用此选项。\n\n#### 事务处理\n\n`Titan` 是一个事务性图数据库，因此每个读/写操作都将在事务边界内发生。\n\n\
  以下代码片段展示了 `Titan` 如何将顶点 `mevivs` 包裹在事务边界内并提交它：\n\n```\nTitanGraph g = TitanFactory.open(\"\
  /home/vivek/Titan\");\nVertex mevivs = g.addVertex(null); //隐式包裹在事务中\nmevivs.setProperty(\"\
  fname\", \"vivek\");\ng.commit(); //提交事务\n```\n\n在处理非常大量数据和多语言场景时，可能会发生永久性或临时性故障。这里的临时性故障包括网络故障、节点无响应等类似情况。在这种情况下，我们可以像这样配置\
  \ `Titan` 的重试延迟属性：\n\n```\nConfiguration conf = new BaseConfiguration();\nconf.setProperty(\"\
  storage.attempt-wait\", 250); // 时间单位为毫秒\n```\n\n此类临时性故障可以通过重试来处理，但永久性故障（例如硬件故障）则需要用户显式处理\
  \ `TitanException`：\n\n```\ntry\n{\n    TitanGraph g = TitanFactory.open(\"/home/vivek/Titan\"\
  );\n    Vertex mevivs = g.addVertex(null); //隐式包裹在事务中\n    mevivs.setProperty(\"\
  fname\", \"vivek\");\n    g.commit(); //提交事务\n} catch (TitanException e) {\n   \
  \ //配置显式重试或快速失败场景。\n}\n```\n\n以上是 `Titan` 的基本概念及其架构。接下来，我们将介绍 `Titan` 图数据库的搭建和安装。\n\
  \n### 安装与搭建\n\n我们可以从 `https://github.com/thinkaurelius/titan/wiki/Downloads` 下载最新的\
  \ `Titan` 发行版。写作时的最新版本是 0.5.0。下载发行版后，将其解压到本地文件夹。在本章中，我们将在多处引用 `TITAN_HOME` 变量。我们可以按如下方式设置它：\n\
  \n```\nexport TITAN_HOME=/home/vivek/software/titan\n```\n\n### 命令行工具与客户端\n\n完成搭建和安装后，首先想到的问题是：是否有任何命令行客户端？就像\
  \ `Cassandra` 有 `CQL` `shell` 一样，`Titan` 是否也提供了用于服务端脚本编写和快速分析的选项？本节将探讨 `Gremlin`\
  \ `shell` 和 `Rexster` 这两个命令行选项。\n\n\n\n"
- '# Gremlin Shell


  Titan 支持通过 Gremlin Shell 使用 Gremlin 查询语言进行图遍历和变更操作。这是一种函数式语言，每一步都会输出一个对象，通过 `.`（点号）我们可以调用该对象的相关函数。例如：


  ```

  gremlin> conf = new BaseConfiguration() // 第一步

  ==>org.apache.commons.configuration.BaseConfiguration@2d3c117a

  gremlin> conf.setProperty("storage.backend", "cassandrathrift") // 第二步

  ```


  这里 `conf` 是第一步中创建的 `Configuration` 对象，它的函数在第二步中被调用。


  接下来，我们通过一个练习来讨论 Gremlin。在本教程中，我们将沿用之前的 Twitter 示例，其中用户的推文将作为图的顶点，用户与其推文及关注者之间的关系将作为边。在本例中，我们将使用
  Cassandra 作为后端存储选项。你可以选择运行一个独立的 Cassandra 服务器；否则，默认情况下，它会启动并连接到一个内嵌的 Cassandra 实例。


  接下来，我们需要初始化一个配置对象，并设置一些 Cassandra 特有的属性：


  ![A978-1-4842-0142-8_7_Fig9_HTML.jpg](img/A978-1-4842-0142-8_7_Fig9_HTML.jpg)


  **图 7-9.** 连接到 Gremlin Shell


  首先，我们需要像图 7-9 那样连接到 Gremlin。


  ```

  gremlin> conf = new BaseConfiguration()

  ==>org.apache.commons.configuration.BaseConfiguration@2d3c117a

  gremlin> conf.setProperty("storage.backend", "cassandrathrift")

  ==>null

  gremlin> conf.setProperty("storage.hostname", "localhost")

  ==>null

  gremlin> conf.setProperty("storage.port", "9160")

  ==>null

  gremlin> conf.setProperty("storage.keyspace", "twitter")

  ==>null

  ```


  接着，获取一个 Titan 图对象：


  ```

  gremlin> graph = TitanFactory.open(conf)

  ==>titangraph[cassandrathrift:localhost]

  ```


  让我们创建一些顶点键和边标签：


  ```

  gremlin> graph.makeKey("fname").

  dataType(String.class).indexed(Vertex.class).make()

  ==>fname

  gremlin> graph.makeKey("lname").

  dataType(String.class).indexed(Vertex.class).make()

  ==>lname

  gremlin> graph.makeKey("twitter_tag").

  dataType(String.class).indexed(Vertex.class).make()

  ==>twitter_tag

  gremlin> graph.makeKey("tweeted_at").

  dataType(String.class).indexed(Vertex.class).make()

  ==>tweeted_at

  gremlin> graph.makeLabel("has_tweeted").make()

  ==>has_tweeted

  gremlin> tweet.setProperty("body", "Working on Cassandra book for apress")

  ==>null

  gremlin> tweet.setProperty("tweeted_at", "2014-09-21")

  ==>null

  ```


  这里 `fname`、`lname` 和 `twitter_tag` 是顶点键，而标签 `has_tweeted` 将在下一步中用于边。


  让我们为用户和推文创建顶点：


  ```

  gremlin> vivs = graph.addVertex(null)

  ==>v[4]

  gremlin> vivs.setProperty("fname", "vivek")

  ==>null

  gremlin> vivs.setProperty("lname", "mishra")

  ==>null

  gremlin> vivs.setProperty("twitter_tag", "mevivs")

  ==>null

  gremlin> graph.V("fname","vivek")

  ==>v[4]

  gremlin> tweet = graph.addVertex(null)

  ==>v[8]

  ```


  接下来，在这两个顶点之间添加一条边：


  ```

  gremlin> graph.addEdge(null, vivs, tweet, "has_tweeted")

  ==>e[2V-4-1E][4-has_tweeted->8]

  ```


  让我们添加 `apress_team` 作为用户，并建立和定义“vivek 关注 apress_team”的关系边：


  ```

  gremlin> apress = graph.addVertex(null)

  ==>v[12]

  gremlin> apress.setProperty("fname", "apress")

  ==>null

  gremlin> apress.setProperty("twitter_tag", "apress_team")

  ==>null

  gremlin> graph.addEdge(null, vivs, apress, "following")

  ==>e[3r-4-22][4-following->12]

  ```


  我们可以通过顶点的键来查找它，如下所示：


  ```

  gremlin> vivek = graph.V(''fname'',''vivek'').next()

  ==>v[4]

  gremlin> vivek.map()

  ==>twitter_tag=mevivs

  ==>lname=mishra

  ==>fname=vivek

  ```


  我们还可以从顶点 `vivek` 中获取所有具有 `has` 关系的外向边：


  ```

  gremlin> outVertex = vivek.out(''has'').next()

  ==>v[8]

  gremlin> outVertex.map()

  ==>body=Working on Cassandra book for apress

  ==>tweeted_at=2014-09-21

  ```


  上述教程演示了如何使用 Gremlin 查询语言填充和遍历 Twitter 图应用。


