  \ 0 和 1。我们可以通过修改每个节点上的 `Cassandra.yaml` 文件来分配 `initial_token` 值。\n\n## 总结\n\n本章是介绍性的，涵盖了所有通用概念和\
  \ Cassandra 特定的配置。对于应用程序开发人员来说，理解副本、数据分布的本质以及最重要的是在 Cassandra 中进行设置是非常关键的。现在我们已经准备好迎接下一个挑战：用\
  \ Cassandra 处理大数据！在下一章中，我们将讨论 Cassandra 的存储机制和数据建模。通过数据建模和理解 Cassandra 的存储架构，将有助于我们对数据集进行建模、分析并探索\
  \ Cassandra 可用的最佳方法。\n\n\n\n"
- "# 2. Cassandra 数据建模\n\n在上一章中，我们讨论了 Cassandra 的配置、安装和集群搭建。本章将带你了解：\n\n-   数据建模概念\n\
  -   Cassandra 集合支持\n-   `CQL` 与基于 Thrift 的架构对比\n-   管理数据类型\n-   计数器列\n\n准备好以理论与实践并重的方式学习吧。\n\
  \n## 数据建模简介\n\n数据建模是一种定义读写需求、并构建逻辑结构和对象模型的机制。Cassandra 是一个 NoSQL 数据库，它推崇“先读后写”的模式，而非关系型模型。“先读后写”或“为读而设计”的方法是指：首先分析你的数据读取需求，然后以相同的方式存储数据。想象一下管理\
  \ PB 或 ZB 级别的数据量，由于数据体量巨大，我们无法承受在内存中进行计算（例如连接操作）。因此，更好的做法是将数据集准备好，以便进行检索或大规模数据分析。用户无需预先了解所有的列，但应避免存储扁平化的列，而是倾向于在读取时进行计算（例如聚合、连接等）。\n\
  \nCassandra 是一个面向列族的数据库。列族，顾名思义，就是“列的家族”。Cassandra 中的每一行可以包含一个或多个列。列是数据的最小单元，包含名称、值和时间戳（见图\
  \ 2-1）。\n\n![A978-1-4842-0142-8_2_Fig1_HTML.jpg](img/A978-1-4842-0142-8_2_Fig1_HTML.jpg)\n\
  图 2-1. Cassandra 列定义\n\n默认情况下，Cassandra 发行版附带了 `cqlsh` 和 `Cassandra-cli` 命令行客户端用于操作。`Cassandra-cli`\
  \ 和 `cqlsh`（`.sh` 和 `.bat` 文件）位于 `bin` 文件夹下。在 Linux、Windows 或 Mac 上运行这些命令行客户端相当容易。在\
  \ Linux 和 Mac 机器上运行 shell 文件只需执行 `cql.sh`。但是，在 Windows 上运行 `cqlsh` 则需要先安装 Python。\n\
  \n要在 Windows 上安装 `cqlsh`，请遵循以下步骤：\n\n首先，从 `https://www.python.org/ftp/python/2.7.6/python-2.7.6.msi`\
  \ 下载 Python。  \n将 `python.exe` 添加到系统环境变量的 `PATH` 中。  \n运行位于 `$CASSANDRA_HOME/pylib`\
  \ 目录下的 `setup.py`：\n\n```\npython setup.py install\n```\n\n运行位于 `bin` 目录下的 `cqlsh`（见图\
  \ 2-2）：\n\n```\npython cqlsh\n```\n\n![A978-1-4842-0142-8_2_Fig2_HTML.jpg](img/A978-1-4842-0142-8_2_Fig2_HTML.jpg)\n\
  图 2-2. 成功连接到 cql shell\n\n#### 数据类型\n\n在 CQL 演进之前，Cassandra 中的数据类型是以比较器和验证器的形式定义的。列或行键值被称为验证器，而列名则被称为比较器。可用的数据类型如图\
  \ 2-3 所示。\n\n![A978-1-4842-0142-8_2_Fig3_HTML.jpg](img/A978-1-4842-0142-8_2_Fig3_HTML.jpg)\n\
  图 2-3. Cassandra 支持的数据类型\n\n## 动态列\n\n自诞生以来，Cassandra 就被定位为一个无模式、面向列族的分布式数据库。在一个列族中，每一行的列数都可以不同。列的声明可以在运行时动态添加。\n\
  \n本章的各个练习中，我们将使用两个命令行客户端：`Cassandra-cli`（Thrift）和 `cqlsh`（`CQL3`）。\n\n### 通过 Thrift\
  \ 实现动态列\n\n让我们讨论一个简单的 Twitter 用例。在这个例子中，我们将探索通过 Thrift 建模和存储动态列的方法。\n\n首先，创建一个键空间\
  \ `twitter` 和列族 `users`：\n\n```cql\ncreate keyspace twitter with strategy_options={replication_factor:1}\
  \ and placement_strategy='org.apache.cassandra.locator.SimpleStrategy';\nuse twitter;\n\
  create column family users with key_validation_class='UTF8Type' and comparator='UTF8Type'\
  \ and default_validation_class='UTF8Type';\n```\n\n在这里，定义列族时，我们没有为其定义任何列。列将在运行时根据每一行的键值动态添加。\n\
  \n为行键值 `'imvivek'` 在 `users` 列族中存储一些列：\n\n```cql\nset users['imvivek']['apress']='apress\
  \ author';\nset users['imvivek']['team_marketing']='apress marketing';\nset users['imvivek']['guest']='guest\
  \ user';\nset users['imvivek']['ritaf']='rita fernando';\n```\n\n这里，我们为 `imvivek`\
  \ 用户添加了关注者作为动态列。\n\n接下来，将 `'imvivek'` 和 `'team_marketing'` 添加为 `'ritaf'` 的关注者：\n\
  \n```cql\nset users['ritaf']['imvivek']='vivek mishra';\nset users['team_marketing']['imvivek']='vivek\
  \ mishra';\n```\n\n要查看 `users` 列族中的行列表（见图 2-4），请使用以下命令：\n\n```cql\nlist users;\n\
  ```\n\n![A978-1-4842-0142-8_2_Fig4_HTML.jpg](img/A978-1-4842-0142-8_2_Fig4_HTML.jpg)\n\
  图 2-4. 选择 users 的输出结果\n\n在图 2-4 中，我们可以看到存储在第三步中的每个行键对应的列名及其值。\n\n我们也可以删除单个键的列。例如，要删除行键\
  \ `'imvivek'` 下的列 `'apress'`：\n\n```cql\ndel users['imvivek']['apress'];\n```\n\n\
  图 2-5 显示了执行第五步后 `imvivek` 的列数。\n\n![A978-1-4842-0142-8_2_Fig5_HTML.jpg](img/A978-1-4842-0142-8_2_Fig5_HTML.jpg)\n\
  图 2-5. 删除后 imvivek 的列数\n\n这里列名是关注者的 `twitter_id`，而他们的全名是列值。这就是我们如何以 Thrift 方式管理模式并操作动态列的方法。我们将在第\
  \ 3 章讨论 `CQL3` 的动态列支持。\n\n\n\n### 通过 cqlsh 利用映射支持实现动态列\n\n在本节中，我们将讨论如何利用映射支持来实现同样的\
  \ Twitter 使用场景。Cassandra 中的集合支持仅适用于 CQL3 二进制协议。\n\n首先，我们来创建一个键空间`twitter`和列族`users`：\n\
  \n```\ncreate keyspace twitter with replication = {'class':'SimpleStrategy','replication_factor':3};\n\
  ```\n\n```\nuse twitter;\n```\n\n```\ncreate table users(twitter_id text primary\
  \ key,followers map<text,text>);\n```\n\n为行键值`'imvivek'`在`users`列族中存储一些列：\n\n```\n\
  insert into users(twitter_id,followers) values('imvivek',{'guestuser':'guest','ritaf':'rita\
  \ fernando','team_marketing':'apress marketing'});\n```\n\n这里，我们将关注者作为动态列，以映射属性的形式添加到用户`'imvivek'`中。\n\
  \n现在，为`'ritaf'`添加`'imvivek'`和`'team_marketing'`作为其关注者：\n\n```\ninsert into users(twitter_id,followers)\
  \ values('ritaf',{'imvivek':'vivek mishra'});\n```\n\n```\ninsert into users(twitter_id,followers)\
  \ values('team_marketing',{'imvivek':'vivek mishra'});\n```\n\n要查看`users`列族中的行列表（见图\
  \ 2-6），请使用以下命令：\n\n```\nselect * from users;\n```\n\n要为`'ritaf'`添加`'team_marketing'`作为关注者，反之亦然（见图\
  \ 2-7），我们可以简单地将它作为元素添加到`users`列族中：\n\n![A978-1-4842-0142-8_2_Fig6_HTML.jpg](img/A978-1-4842-0142-8_2_Fig6_HTML.jpg)\n\
  \n图 2-6. 包含用户关注者的映射\n\n```\nupdate users set followers = followers + {'team_marketing':'apress\
  \ marketing'} where twitter_id='ritaf';\n```\n\n```\nupdate users set followers\
  \ = followers + {'ritaf':'rita fernando'} where twitter_id='apress_marketing';\n\
  ```\n\n如果数据库中没有对应的行键，使用`update`命令可以像插入操作一样工作。例如：\n\n![A978-1-4842-0142-8_2_Fig7_HTML.jpg](img/A978-1-4842-0142-8_2_Fig7_HTML.jpg)\n\
  \n图 2-7. 更新后每个用户的关注者映射\n\n```\nupdate users set followers = followers + {'ritaf':'rita\
  \ fernando'} where twitter_id='jhassell'; // 更新操作等同于插入\n```\n\n图 2-8 显示`ritaf`已被添加为`jhassell`的关注者。\n\
  \n要从映射中删除一个元素，请执行以下命令：\n\n![A978-1-4842-0142-8_2_Fig8_HTML.jpg](img/A978-1-4842-0142-8_2_Fig8_HTML.jpg)\n\
  \n图 2-8. 针对不存在的行键（如`twitter_id`），`update`操作会像插入一样工作，用于更新关注者映射\n\n```\ndelete followers['guestuser']\
  \ from users where twitter_id='imvivek';\n```\n\n可以看到，删除后`imvivek`的关注者列表减少到了四个（见图\
  \ 2-9）。\n\n![A978-1-4842-0142-8_2_Fig9_HTML.jpg](img/A978-1-4842-0142-8_2_Fig9_HTML.jpg)\n\
  \n图 2-9. 删除`guestuser`作为`imvivek`的关注者之后\n\n由此可见，我们可以通过集合支持，以键值对的形式添加动态列。\n\n###\
  \ 通过 cqlsh 利用集合支持实现动态列\n\n考虑一个场景：用户只想存储关注者 ID 的集合（而非全名）。Cassandra 提供了集合支持，用于保存此类元素的列表或集合。下面我们来讨论如何使用集合支持来实现。\n\
  \n首先，创建一个键空间`twitter`和列族`users`：\n\n```\ncreate keyspace twitter with replication\
  \ = {'class':'SimpleStrategy','replication_factor':3};\n```\n\n```\nuse twitter;\n\
  ```\n\n```\ncreate table users(twitter_id text primary key,followers set<text>);\n\
  ```\n\n为行键值`'imvivek'`在`users`列族中存储一些列：\n\n```\ninsert into users(twitter_id,followers)\
  \ values('imvivek', {'guestuser','ritaf','team_marketing'});\n```\n\n这里，我们将关注者作为动态列，以集合属性的形式添加到用户`'imvivek'`中。\n\
  \n接下来添加以下关注关系：\n- 为`'ritaf'`添加`'imvivek'`和`'team_marketing'`作为其关注者\n- 为`'jhassell'`添加`'ritaf'`作为其关注者\n\
  \n```\ninsert into users(twitter_id,followers) values('ritaf', {'imvivek','jhassell','team_marketing'});\n\
  ```\n\n```\ninsert into users(twitter_id,followers) values('jhassell', {'ritaf'});\n\
  ```\n\n要查看`users`列族中的行列表（见图 2-10），请使用以下命令：\n\n```\nselect * from users;\n```\n\n\
  我们可以按如下方式更新集合以删除元素。图 2-10 展示了结果：\n\n![A978-1-4842-0142-8_2_Fig10_HTML.jpg](img/A978-1-4842-0142-8_2_Fig10_HTML.jpg)\n\
  \n图 2-10. 已添加`ritaf`、`jhassell`和`imvivek`的关注者\n\n```\nupdate users set followers\
  \ = followers - {'guestuser'} where twitter_id = 'imvivek';\n```\n\n![A978-1-4842-0142-8_2_Fig11_HTML.jpg](img/A978-1-4842-0142-8_2_Fig11_HTML.jpg)\n\
  \n图 2-11. 移除`imvivek`的`guestuser`关注者后更新后的关注者集合\n\n集合支持是在 Cassandra 中实现动态列添加的一个良好替代方案。复合键是由多个表字段组合而成，其中第一部分称为分区键，复合键的其余部分称为集群键。第\
  \ 3 章将讨论如何使用复合列实现动态列。\n\n\n\n### 二级索引\n\n在分布式集群中，列族的数据会根据复制因子和分区方案分布到多个节点上。然而，给定行键值的数据始终会位于同一节点。利用主索引（例如行键），我们总能检索到一行数据。但如果使用非行键值进行检索呢？\n\
  \nCassandra 支持为列值添加索引，即所谓的二级索引。第 3 章将详细介绍索引，现在我们先通过一个简单的二级索引示例来初步了解。\n\n让我们以之前的\
  \ Twitter 示例为例，探讨如何利用并启用二级索引功能。\n\n首先，创建 `twitter` 键空间和列族 `users`。\n\n```\ncreate\
  \ keyspace twitter with replication = {'class' : 'SimpleStrategy' , 'replication_factor'\
  \ : 3};\n```\n\n```\nuse twitter;\n```\n\n```\ncreate table users(user_id text PRIMARY\
  \ KEY,fullname text,email text,password text, followers map<text, text>);\n```\n\
  \n插入一个包含电子邮件和密码的用户：\n\n```\ninsert into users(user_id,email,password,fullname,followers)\
  \ values ('imvivek','imvivek@xxx.com','password','vivekm',{'mkundera':'milan kundera','guest':\
  \ 'guestuser'});\n```\n\n在继续之前，值得讨论一下哪些列应该被索引。\n\n任何使用二级索引的读取请求实际上都会广播到集群中的所有节点。Cassandra\
  \ 会在每个节点本地维护一个用于二级索引的隐藏列族，通过扫描该列族来利用二级索引检索行。\n\n在进行数据建模时，我们应该为那些能在海量数据集中返回大量数据的列值创建二级索引。为小数据集的唯一值创建索引反而会增加开销，这不是良好的数据建模实践。`fullname`\
  \ 列是一个适合创建索引的候选。\n\n现在为 `fullname` 创建二级索引：\n\n```\ncreate index fullname_idx on\
  \ users(fullname);\n```\n\n索引创建成功后，我们可以通过 `fullname` 来获取记录。图 2-12 展示了结果。\n\n让我们添加一个\
  \ `age` 列并为其创建索引：\n\n![A978-1-4842-0142-8_2_Fig12_HTML.jpg](img/A978-1-4842-0142-8_2_Fig12_HTML.jpg)\n\
  \n图 2-12. 根据 `fullname` 值 `vivekm` 搜索用户记录\n\n```\nalter table users add age text;\n\
  ```\n\n```\ncreate index age_idx on users(age);\n```\n\n```\nupdate users set age='32'\
  \ where user_id='imvivek';\n```\n\n```\ninsert into users(user_id,email,password,fullname,followers,age)\
  \ values ('mkundera','mkundera@outlook.com','password','milan kundera',{'imvivek':'vivekm','guest':\
  \ 'guestuser'},'51');\n```\n\n图 2-13 展示了结果。\n\n让我们将 `age` 的数据类型改为 `int`：\n\n![A978-1-4842-0142-8_2_Fig13_HTML.jpg](img/A978-1-4842-0142-8_2_Fig13_HTML.jpg)\n\
  \n图 2-13. 选择所有年龄为 `51` 的用户\n\n```\nalter table users alter age type int;\n```\n\n\
  这将导致如下错误：\n\n```\nTSocket read 0 bytes (via cqlsh)\n```\n\n要更改已索引列的数据类型，我们需要重建它们：\n\
  \n```\ndrop index age_idx;\n```\n\n```\nalter table users alter age type int;\n\
  ```\n\n但请注意，在此类情况下，可能会导致数据集处于不兼容状态（见图 2-14）。\n\n![A978-1-4842-0142-8_2_Fig14_HTML.jpg](img/A978-1-4842-0142-8_2_Fig14_HTML.jpg)\n\
  \n图 2-14. 将数据类型从字符串改为 `int` 时出错\n\n错误信息如下：\n\n```\nFailed to decode value '51' (for\
  \ column 'age') as int: unpack requires a string argument of length 4\n```\n\n```\n\
  Failed to decode value '32' (for column 'age') as int: unpack requires a string\
  \ argument of length 4\n```\n\n因此，建议仅在索引列无数据时更改其数据类型。\n\nCassandra 2.0 不支持对集合创建索引。图\
  \ 2-15 展示了尝试为 `follower` 创建索引时会发生的情况。不过，在本书面世前，2.1 版本已发布并增加了此功能。请参阅第 11 章中的\"对集合属性进行索引\"\
  一节。\n\n![A978-1-4842-0142-8_2_Fig15_HTML.jpg](img/A978-1-4842-0142-8_2_Fig15_HTML.jpg)\n\
  \n图 2-15. Cassandra 2.0 不支持对集合创建索引\n\n注意\n\n不允许更新聚类键和索引的数据类型。\n\n## CQL3 与 Thrift\
  \ 的互操作性\n\n在 CQL 出现之前，Thrift 是在 Cassandra 上开发应用程序的唯一方式。CQL3 与 Thrift 的互操作性问题经常在\
  \ Cassandra 社区中被讨论。\n\n让我们通过一个简单的例子来探讨一些问题：\n\n首先，使用 CQL3 创建一个键空间和列族。\n\n```\ncreate\
  \ keyspace cql3usage with replication = {'class' : 'SimpleStrategy' , 'replication_factor'\
  \ : 3};\n```\n\n```\nuse cql3usage;\n```\n\n```\ncreate table user(user_id text\
  \ PRIMARY KEY, first_name text, last_name text, emailid text);\n```\n\n插入一条记录：\n\
  \n```\ninsert into user(user_id,first_name,last_name,emailid) values('@mevivs','vivek','mishra','vivek.mishra@xxx.com');\n\
  ```\n\n现在，连接 Cassandra-cli（Thrift 方式），并更新 `user` 列族，为 `last_name` 和 `first_name`\
  \ 创建索引：\n\n```\nupdate column family user with key_validation_class='UTF8Type' and\
  \ column_metadata=[{column_name:last_name, validation_class:'UTF8Type', index_type:KEYS},{column_name:first_name,\
  \ validation_class:'UTF8Type', index_type:KEYS}];\n```\n\n注意\n\n第 3 章将详细介绍索引。\n\n\
  现在用 CQL3 探查 `user` 列族，结果见图 2-16。\n\n```\ndescribe table user;\n```\n\n![A978-1-4842-0142-8_2_Fig16_HTML.jpg](img/A978-1-4842-0142-8_2_Fig16_HTML.jpg)\n\
  \n图 2-16. 描述 user 表\n\n元数据已被更改，通过 Thrift 修改的列（`first_name` 和 `last_name`）在 CQL3\
  \ 中不再可用！别担心！数据并未丢失，因为 CQL3 和 Thrift 共享相同的存储引擎，我们只需重建它们即可恢复这些元数据。\n\n让我们重建 `first_name`\
  \ 和 `last_name`：\n\n```\nalter table user add first_name text;\n```\n\n```\nalter\
  \ table user add last_name text;\n```\n\n问题在于 CQL3 的稀疏表。CQL3 拥有不同的元数据（CQL3Metadata），这些元数据并未添加到\
  \ Thrift 的 CFMetaData 中。请勿混合使用 CQL3 和 Thrift 执行 DDL/DML 操作，否则会导致两者之一的元数据陷入不一致状态。\n\
  \n对于无法承受丢失 Thrift 动态列支持损失的开发者，仍然倾向于通过 Thrift 执行插入操作，但通过 CQL3 读取数据。建议在新应用程序开发中，针对\
  \ Cassandra 使用 CQL3。然而，已有资料表明，在 Cassandra 1.x.x 版本中，基于 Thrift 的修改操作（如批处理）仍然比 CQL3\
  \ 更快。此问题计划在 Cassandra 2.0.0 版本（`https://issues.apache.org/jira/browse/CASSANDRA-4693`）中解决。\n\
  \n## 更改数据类型\n\n在 Cassandra 中，更改数据类型有两种方式：Thrift 和 CQL3。\n\n\n\n### Thrift 方式\n\n\
  我们来进一步讨论一下遗留 Thrift API 的数据类型：\n\n让我们创建一个最小定义的列族，例如：\n\n```\ncreate keyspace twitter\
  \ with strategy_options={replication_factor:1} and placement_strategy='org.apache.cassandra.locator.SimpleStrategy';\n\
  ```\n\n```\nuse twitter;\n```\n\n```\ncreate column family default;\n```\n\n`comparator`\
  \ 和 `validator` 的默认数据类型是 `BytesType`。\n\n让我们描述一下 keyspace，并查看一下默认的列族（见图 2-17）：\n\
  \n```\ndescribe twitter;\n```\n\n让我们尝试在列族中存储一些数据：\n\n![A978-1-4842-0142-8_2_Fig17_HTML.jpg](img/A978-1-4842-0142-8_2_Fig17_HTML.jpg)\n\
  \n**图 2-17.** twitter keyspace 的结构\n\n```\nset default[1]['type']='bytes';\n```\n\
  \n`提示错误`\n\n图 2-18 显示了这将产生一个错误。\n\n![A978-1-4842-0142-8_2_Fig18_HTML.jpg](img/A978-1-4842-0142-8_2_Fig18_HTML.jpg)\n\
  \n**图 2-18.** 尝试存储字符串值但列值是字节类型时出现的错误\n\n由于 `comparator` 和 `validator` 被设置为默认数据类型（例如\
  \ `BytesType`），cassandra-cli 无法解析和存储此类请求。\n\n为了使第三步生效，我们需要使用 `assume` 函数来提供一些提示：\n\
  \n```\nassume default keys as UTF8Type;\n```\n\n```\nassume default comparator as\
  \ UTF8Type;\n```\n\n```\nassume default validator as UTF8Type;\n```\n\n现在让我们尝试将\
  \ comparator 从 `BytesType` 更改为 `UTF8Type`：\n\n```\nupdate column family default\
  \ with comparator='UTF8Type';\n```\n\n`提示错误`\n\n这会产生一个错误，因为不允许更改 comparator 类型（见图\
  \ 2-19）。\n\n虽然不允许更改 comparator 类型，但我们始终可以按照以下方式更改列和键验证类的数据类型：\n\n![A978-1-4842-0142-8_2_Fig19_HTML.jpg](img/A978-1-4842-0142-8_2_Fig19_HTML.jpg)\n\
  \n**图 2-19.** 不允许更改 comparator 类型\n\n```\nupdate column family default with key_validation_class=UTF8Type\
  \ and default_validation_class = UTF8Type;\n```\n\n行中的列按列名排序，这正是 comparator 发挥关键作用的地方。基于\
  \ comparator 类型（即 `UTF8Type`、`Int32Type` 等），列可以按排序方式存储。\n\n### CQL3 方式\n\nCassandra\
  \ CQL3 是当前的主要驱动因素。大多数高级 API 都支持并围绕它进行进一步开发。\n\n让我们讨论一下在 CQL3 方式下处理数据类型的一些技巧。我们将使用以\
  \ Thrift 方式创建的默认列族进行探索（参见上一节）。\n\n让我们尝试从默认列族中获取行（见图 2-20）：\n\n```\nSelect * from\
  \ default;\n```\n\n让我们发出 `assume` 命令，并尝试以可读格式从默认列族中获取行：\n\n![A978-1-4842-0142-8_2_Fig20_HTML.jpg](img/A978-1-4842-0142-8_2_Fig20_HTML.jpg)\n\
  \n**图 2-20.** 使用 cql shell 检索值\n\n```\nassume default(column1) values are text;\n\
  ```\n\n```\nassume default(value) values are text;\n```\n\n```\nassume default(key)\
  \ values are text;\n```\n\n```\nselect * from default;\n```\n\n图 2-21 显示了结果。\n\n\
  `typeAsBlob` 或 `blobAsType` 函数也可用于在运行 CQL3 查询时对数据进行编组：\n\n![A978-1-4842-0142-8_2_Fig21_HTML.jpg](img/A978-1-4842-0142-8_2_Fig21_HTML.jpg)\n\
  \n**图 2-21.** 应用 assume 函数后的检索结果\n\n```\nselect blobAsText(key),blobAsText(type),blobAsText(value)\
  \ from default;\n```\n\n我们可以按如下方式更改验证器的数据类型：\n\n```\nalter table default alter value\
  \ type text;\n```\n\n```\nalter table default alter key type text;\n```\n\n**注意**\n\
  \n`assume` 命令在 Cassandra 1.2.X 版本之后将不可用。作为替代，我们可以使用 `typeAsBlob`（例如 `textAsBlob`）CQL3\
  \ 函数。\n\n## 计数器列\n\n分布式计数器是跨多个节点分区的列的增量值。计数器列可用于为基于 Cassandra 的应用程序提供计数和聚合分析（例如，页面点击次数、活跃用户数等）。\n\
  \n在 Cassandra 中，计数器是一个 64 位有符号整数。对计数器的写入操作需要从副本节点读取（这取决于一致性级别，默认是 `ONE`）。在读取计数器列值时，读取必须是一致的。\n\
  \n### 带 replicate_on_write 和不带的计数器列\n\n`replicate_on_write` 的默认值为 `true`。如果设置为 `false`，它将只在一个副本节点上进行复制（无论复制因子是多少）。这有助于避免在处理写入请求时进行先读后写。但任何后续的读取可能不一致，并且还可能导致数据丢失（单个副本节点故障！）。\n\
  \n### 实践计数器列\n\n在第 1 章中，我们讨论了在单台机器上设置多个集群。首先，让我们在单台机器上启动一个包含三个节点的集群。（请参考第 1 章中的“在单台机器上配置多个节点”部分。）在本示例中，我们将讨论使用计数器列的注意事项。\n\
  \n让我们创建一个 keyspace `counterkeyspace`：\n\n```\ncreate keyspace counterkeyspace with\
  \ replication = {'class' : 'SimpleStrategy', 'replication_factor' : 2 }\n```\n\n\
  创建一个 `replicate_on_write` 设置为 `false` 的列族 `counternoreptable`：\n\n```\ncreate table\
  \ counternoreptable(id text PRIMARY KEY, pagecount counter) with replicate_on_write='false';\n\
  ```\n\n将 `pagecount` 增加 2，如下所示：\n\n```\nupdate counternoreptable set pagecount=pagecount+2\
  \ where id = '1';\n```\n\n按如下方式从列族中选择：\n\n```\nselect * from counternoreptable;\n\
  ```\n\n如图 2-22 所示，结果为零行。是否为零行可能取决于数据写入了哪个节点。\n\n让我们为 `pagecount` 再更新一些值并验证结果：\n\n\
  ![A978-1-4842-0142-8_2_Fig22_HTML.jpg](img/A978-1-4842-0142-8_2_Fig22_HTML.jpg)\n\
  \n**图 2-22.** 从计数器表中获取不一致的结果\n\n```\nupdate counternoreptable set pagecount=pagecount+12\
  \ where id = '1';\n```\n\n```\nselect * from counternoreptable;\n```\n\n图 2-23 显示了此命令的结果。\n\
  \n![A978-1-4842-0142-8_2_Fig23_HTML.jpg](img/A978-1-4842-0142-8_2_Fig23_HTML.jpg)\n\
  \n**图 2-23.** 递增计数器列值后从计数器表检索\n\n```\nupdate counternoreptable set pagecount=pagecount-2\
  \ where id = '1';\n```\n\n```\nselect * from counternoreptable;\n```\n\n这条命令的结果不同（见图\
  \ 2-24）。\n\n![A978-1-4842-0142-8_2_Fig24_HTML.jpg](img/A978-1-4842-0142-8_2_Fig24_HTML.jpg)\n\
  \n**图 2-24.** 没有复制时计数器列的不一致结果\n\n您可以看到当 `replicate_on_write` 为 `false` 时，读取结果不一致。由此可以得出结论，禁用此类参数可能会避免每次写入请求时的先读后写，但后续的读取请求可能导致数据不一致。此外，如果没有复制，如果包含更新的计数器值的单个副本节点宕机或损坏，我们可能会遭受数据丢失。尝试将上述示例中的\
  \ `replicate_on_write` 设置为 `true`，并观察结果是否一致且准确！\n\n**注意**\n\n您可以参考 [`https://issues.apache.org/jira/browse/CASSANDRA-1072`](https://issues.apache.org/jira/browse/CASSANDRA-1072)\
  \ 了解更多关于计数器列的信息。\n\n\n\n## 数据建模技巧\n\nCassandra 是一种面向列的数据库，与传统的 RDBMS 截然不同。虽然我们不需要预先定义模式，但在进行数据建模之前，最好先充分理解需求和数据库，包括：\n\
  \n- Cassandra 的写入速度相对较快，但读取速度并不快。在数据建模之前，始终牢记对我们希望如何执行读取操作进行预分析，这一点非常重要。\n- 数据应尽可能多地反范式化。\n\
  - 选择正确的分区策略，以避免因分区策略更新而重新构建/填充数据。\n- 在建模表/列族时，优先使用代理键和复合键（而非超级列）。\n\n## 小结\n\n总结本章迄今为止讨论的几点内容：\n\
  \n- 不要在 DDL 和 DML 操作中混用 Thrift 和 CQL3，尽管读取操作可能没问题。\n- 避免更改数据类型。\n- 利用 Cassandra\
  \ 的集合支持来动态添加列。\n\n在第 3 章中，我们将继续讨论，探索索引、复合列以及 Cassandra 2.0 中引入的最新特性，例如“比较并设置 (Compare\
  \ and Set)”。\n\n"
- "# 3. 索引与复合列\n\n在前面的章节中，我们讨论了大数据问题、Cassandra 数据建模概念以及各种模式管理技术。虽然你应该避免过度规范化数据形式，但在数据库应用中，你仍然需要围绕列（而非主键）来建模读取需求。\n\
  \n本章将涵盖以下主题：\n\n- 索引概念\n- 数据分区\n- Cassandra 读写机制\n- 二级索引\n- 复合列\n- Cassandra 2.0\
  \ 的新特性\n\n## 索引\n\n数据库中的索引是一种用于更快检索表中数据集的数据结构。索引可以建立在单个或多个列上。\n\n索引化是创建和管理称为“索引”的数据结构以快速检索数据的过程。每个索引由索引字段值和指向物理记录的引用组成。在某些情况下，引用可以是实际的记录行本身。我们将在聚集索引部分讨论这些情况。\n\
  \n物理上，数据以数据结构的形式存储在数据块上（例如 Cassandra 中的 `sstable`）。这些数据块是无序的，并分布在多个节点上。如果没有主键或索引，访问数据记录将需要在多个节点上进行线性搜索。我们来讨论索引数据结构的格式。\n\
  \n索引按排序顺序存储在 B 树（平衡树）结构中，其中索引是分支节点下的叶节点。图 3-1 展示了数据存储方式：多级叶节点（0，1）按排序顺序索引，而数据则无序排列。这里每个叶节点都是一个包含多个键的\
  \ B 树节点。根据插入、更新、删除操作，每个 B 树节点的键数量会不断变化，但始终保持排序顺序。\n\n![A978-1-4842-0142-8_3_Fig1_HTML.jpg](img/A978-1-4842-0142-8_3_Fig1_HTML.jpg)\n\
  \n图 3-1. B 树索引及多级叶节点的数据结构\n\n让我们进一步简化。在图 3-2 中，包含年龄和行键的表是叶节点，另一个是物理表。\n\n![A978-1-4842-0142-8_3_Fig2_HTML.jpg](img/A978-1-4842-0142-8_3_Fig2_HTML.jpg)\n\
  \n图 3-2. 物理表与作为叶节点的索引表\n\n这允许使用二分搜索更快地检索记录。由于 B 树为加快搜索速度而对数据进行了排序，这会对插入、更新和删除操作带来一些开销，并需要重新排列索引。对于大量读写操作来说，B\
  \ 树是首选的数据结构，这就是它在分布式数据库中被广泛使用的原因。\n\n### 聚集索引与非聚集索引\n\n独立于物理行进行维护、并且不管理行排序的索引称为非聚集索引（见图\
  \ 3-1）。另一方面，聚集索引会按照索引字段的排序顺序存储实际的行。由于聚集索引会存储和管理物理行的顺序，因此每个表只能有一个聚集索引。\n\n一个重要的问题是，在哪些场景下我们应该使用聚集索引，哪些场景下使用非聚集索引。例如，一个部门可以有多个员工（多对一关系），并且经常需要按部门读取员工详细信息。在这里，部门是聚集索引的合适候选者。所有包含员工详细信息的行都将按部门存储和排序，以实现更快的检索。而员工姓名则是非聚集索引的完美候选，因此我们可以在一个表中拥有多个非聚集索引，但每个表始终只有一个聚集索引。\n\
  \n### 索引分布\n\n在分布式数据库中，数据会跨多个节点分布和复制。检索一个数据集需要从多个节点获取行。为非行键列选择索引也要求该索引分布在多个节点上，例如分片。长时间的查询可以利用这种基于分片的索引来快速检索数据集。\n\
  \n由于采用点对点架构，Cassandra 集群中的每个节点都持有相同的配置。数据复制、最终一致性和分区模式是数据分布的两个重要方面。\n\n有关复制因子、策略类以及读/写一致性的更多详细信息，请参考第\
  \ 1 章。\n\n### Cassandra 中的索引\n\n在 Cassandra 节点上，数据是按行本地存储的。行分布在多个节点上，但特定行键的所有列都将存储在本地的一个节点上。Cassandra\
  \ 默认提供基于行键的主索引，以便按行键进行更快的检索。\n\n\n\n### 二级索引\n\n基于列值的索引被称为二级索引。这些索引存储在实际数据所在的节点本地。这使得\
  \ Cassandra 能够基于索引更快地检索数据。二级索引存储在一个隐藏的列族中，并由节点自身进行内部管理。\n\n让我们通过一个简单的练习来进一步了解二级索引。\n\
  \n首先，创建一个键空间 `twitter` 和列族 `users`。\n\n```\ncreate keyspace twitter with replication\
  \ = { 'class':'SimpleStrategy' , 'replication_factor':3};\nuse twitter;\n```\n\n\
  ```\ncreate column family users with key_validation_class='UTF8Type' and comparator='UTF8Type'\
  \ and default_validation_class='UTF8Type';\n```\n\n```\ncreate table users (user_id\
  \ uuid primary key, first_name text, twitter_handle text);\n```\n\n使用 `create index`\
  \ 语法在 `first_name` 上创建索引（见图 3-3）。\n\n```\ncreate index fname_idx on users(first_name);\n\
  ```\n\n描述表 `users`：\n\n```\ndescribe table users;\n```\n\n图 3-3 显示了在 `first_name`\
  \ 上创建索引后的 `users` 模式。\n\n在 `users` 列族中插入几行数据。\n\n![A978-1-4842-0142-8_3_Fig3_HTML.jpg](img/A978-1-4842-0142-8_3_Fig3_HTML.jpg)\n\
  \n**图 3-3.** 在 `first_name` 上创建了索引的 Users 表\n\n```\ninsert into users(user_id,first_name,twitter_handle)\
  \ values(now(),'apress','#apress_team');\ninsert into users(user_id,first_name,twitter_handle)\
  \ values(now(),'jonathan','#jhassell');\ninsert into users(user_id,first_name,twitter_handle)\
  \ values(now(),'vivek','#mevivs');\ninsert into users(user_id,first_name,twitter_handle)\
  \ values(now(),'vivek','#vivekab');\n```\n\n尝试使用索引列 `first_name` 查找记录（见图 3-4）。\n\
  \n```\nselect * from users where first_name='vivek';\n```\n\n图 3-4 展示了查询 first name\
  \ 为 `vivek` 的用户的结果。\n\n![A978-1-4842-0142-8_3_Fig4_HTML.jpg](img/A978-1-4842-0142-8_3_Fig4_HTML.jpg)\n\
  \n**图 3-4.** 通过 `first_name` 查询用户\n\n通过索引列 `first_name` 查询值为 `'vivek'` 的数据（图 3-4）返回了两行数据。这两行数据可能位于同一个节点上，也可能位于不同的节点上。\n\
  \n这里值得指出的一点是，索引也会与数据行一起存储在本地，这确保了数据的位置亲和性。\n\n另一方面，如果我们尝试使用非索引列 `twitter_handle`\
  \ 来获取行：\n\n```\nselect * from users where twitter_handle='#imvivek';\n```\n\n会导致以下错误：\n\
  \n```\nBad Request: No indexed columns present in by-columns clause with Equal operator\n\
  ```\n\n让我们尝试另一种类型的例子：\n\n添加另一个列 `age`：\n\n```\nalter table users add age int;\n\
  ```\n\n为 `age` 更新几行数据：\n\n```\nupdate users set age = 21 where user_id = 498d9f00-d47f-11e3-be07-79e7dcea6dd7;\n\
  update users set age = 51 where user_id = 498b06f0-d47f-11e3-be07-79e7dcea6dd7;\n\
  ```\n\n在 `age` 列上创建索引：\n\n```\ncreate index age_idx on users(age);\n```\n\n现在，尝试获取年龄为\
  \ 21 的用户的 `user_id`：\n\n```\nselect user_id from users where age = 21;\n```\n\n\
  ```\n user_id\n--------------------------------------\n 498d9f00-d47f-11e3-be07-79e7dcea6dd7\n\
  \n(1 rows)\n```\n\n接下来，尝试获取年龄大于 21 的用户：\n\n```\nselect user_id from users where\
  \ age >= 21;\n```\n\n这会得到与前一个例子相同的错误：\n\n```\nBad Request: No indexed columns present\
  \ in by-columns clause with Equal operator\n```\n\n二级索引仅允许用户使用 `=` 运算符，通过索引列来检索记录。但实时应用程序仍然希望对非行键列执行范围查询。\n\
  \n通常建议对具有低基数的列进行索引，因为从集群中不同节点检索数据的概率非常高。而高基数的列在高数据负载和大型 Cassandra 集群下可能会导致性能开销。在数据量不大的情况下，对唯一列进行索引应该没问题。此外，你可以开启跟踪来监控对二级索引的查询。通常，跟踪可用于调查\
  \ CQL3 查询。你可以按如下方式开启/关闭跟踪：\n\n```\nTRACING ON;\nTRACING OFF;\n```\n\n从 1.2 版本开始，Cassandra\
  \ 提供了复合列支持。利用复合列支持，可以对复合列执行范围扫描。\n\n让我们在下一节中更深入地探讨复合列。\n\n\n\n## 复合列\n\n将更细的行分布在集群中的多个节点上，并辅以二级索引支持，效果良好。然而，应用程序可能仍需要对获取的行应用排序顺序。在客户端处理海量数据实现此类排序机制显然并不可取。应用程序应依赖数据库来提供此类支持。\n\
  \n从 1.1 版本开始，Cassandra 通过复合列提供了对排序宽行的支持。排序宽行意味着用更多的列来取代细窄行，从而允许以协同定位的方式存储更多数据。\n\
  \n让我们用同样的 Twitter 例子来探讨，在这个例子中，用户及其推文需要本地存储并按顺序排序。\n\n首先，我们创建一个键空间 `twitter` 和列族\
  \ `users`：\n\n```\ncreate keyspace twitter with replication = {'class':'SimpleStrategy','replication_factor':1};\n\
  ```\n\n```\nuse twitter;\n```\n\n```\ncreate table users(user_id text,followers\
  \ set<text>, tweet_date timestamp, tweet_body text, first_name text, PRIMARY KEY(user_id,tweet_date,\
  \ first_name));\n```\n\n这里，`users` 表包含一个由 `user_id`、`tweet_date` 和 `first_name`\
  \ 组成的复合主键。\n\n让我们为 user_id 为 `'imvivek'` 的用户在 `users` 列族中存储一些列：\n\n```\n// 为 'imvivek'\
  \ 插入记录\ninsert into users(user_id,tweet_date,tweet_body,first_name) values('imvivek','2013-12-31','good\
  \ bye 2013','vivek');\ninsert into users(user_id,tweet_date,tweet_body,first_name)\
  \ values('imvivek','2014-01-01','welcome 2014','vivek');\ninsert into users(user_id,tweet_date,tweet_body,first_name)\
  \ values('imvivek','2014-01-04','Working on Cassandra book on weekend','vivek');\n\
  ```\n\n让我们为 user_id 为 `'jhassell'` 的用户在 `users` 列族中存储一些列：\n\n```\n// 为 'jhassell'\
  \ 插入记录\ninsert into users(user_id,tweet_date,tweet_body,first_name) values('jhassell','2013-12-21','2013\
  \ bye bye','jonathan');\ninsert into users(user_id,tweet_date,tweet_body,first_name)\
  \ values('jhassell','2014-01-01','2014! another exciting year','jonathan');\ninsert\
  \ into users(user_id,tweet_date,tweet_body,first_name) values('jhassell','2014-03-25','Cassandra\
  \ book, rolling out!','jonathan');\n```\n\n让我们尝试按 `tweet_date` 降序获取行（见图 3-5）。\n\n\
  ```\nselect * from users where user_id='imvivek' order by tweet_date DESC;\n```\n\
  \n图 3-5 的输出显示了 user_id 为 `imvivek` 的行按 `tweet_date` 排序的结果。\n\n我们还可以如下查询 `users`\
  \ 表，获取多个 user_id 并按 `tweet_date` 排序的行（见图 3-6）：\n\n![A978-1-4842-0142-8_3_Fig5_HTML.jpg](img/A978-1-4842-0142-8_3_Fig5_HTML.jpg)\n\
  \n*图 3-5. 按推文日期排序的 user_id 为 imvivek 的用户*\n\n```\nselect * from users where user_id\
  \ in('imvivek','jhassell') order by tweet_date DESC;\n```\n\n图 3-6 显示了用户 `imvivek`\
  \ 和 `jhassell` 的行按 `tweet_date` 排序的结果。\n\n让我们更新一些 `followers` 的行，并探究其内部数据结构的大致形态：\n\
  \n![A978-1-4842-0142-8_3_Fig6_HTML.jpg](img/A978-1-4842-0142-8_3_Fig6_HTML.jpg)\n\
  \n*图 3-6. 此处我们使用 in 子句检索 user_id 为 imvivek 和 jhassell 的行*\n\n```\nupdate users set\
  \ followers = {'jhassell'} where user_id='imvivek' and tweet_date = '2013-12-31'\
  \ and first_name = 'vivek';\nupdate users set followers = {'jhassell'} where user_id='imvivek'\
  \ and tweet_date = '2014-01-01' and first_name = 'vivek';\n```\n\n在这里，`user_id`\
  \ 将是分区键，其余的列 `tweet_date` 和 `first_name` 将成为聚类键的一部分。让我们借助图 3-7 来查看存储的数据。\n\n![A978-1-4842-0142-8_3_Fig7_HTML.jpg](img/A978-1-4842-0142-8_3_Fig7_HTML.jpg)\n\
  \n*图 3-7. 复合列，以 imvivek 作为分区键，其余部分作为聚类键*\n\n在对 Cassandra 进行数据建模时，一个值得提及的重要点是：对聚类键的排序仅在分区键出现在\
  \ `EQ`/`IN` 子句中时才有效。因此，在定义表结构时，务必确保需要排序的列是聚类列的一部分。你还可以在创建表时指定聚类顺序，如下所示：\n\n```\n\
  create table users(user_id text,followers set<text>, tweet_date timestamp, tweet_body\
  \ text, first_name text, PRIMARY KEY(user_id,tweet_date, first_name)) with clustering\
  \ order by (tweet_date DESC);\n```\n\n这将确保聚类数据按 `tweet_date` 降序排列。\n\n### 允许过滤\n\
  \n正如“二级索引”部分所述，二级索引的一个限制是只允许对索引列使用 `EQ` 运算符。如果某些非行键列被定义为聚类列，我们可以在这些列上执行范围查询。下面的查询可以工作，因为\
  \ `tweet_date` 是剩余聚类键的一部分。\n\n默认情况下，Cassandra 会限制此类查询的执行，并通过要求用户显式使用 `ALLOW FILTERING`\
  \ 子句来智能地告知用户此类查询的性能开销。\n\n用户可以通过在 `select` 查询中显式添加 `ALLOW FILTERING` 子句来运行此类查询，例如：\n\
  \n```\nselect * from users where tweet_date>='2013-12-31' allow filtering;\n```\n\
  \n图 3-8 显示了启用 `allow filtering` 后，按 `tweet_date` 选择用户的结果输出。\n\n![A978-1-4842-0142-8_3_Fig8_HTML.jpg](img/A978-1-4842-0142-8_3_Fig8_HTML.jpg)\n\
  \n*图 3-8. 启用过滤选项后，获取推文日期大于等于 2013 年 12 月 31 日的行*\n\n当海量数据分布在一个大型集群中时，如果分区键没有与 `EQ`/`IN`\
  \ 子句一起出现，运行此类查询可能会降低应用程序的性能。建议用户在执行此类查询前先分析数据，而不是针对特定分区键执行范围查询。\n\n\n\n### 过期列\n\
  \n我们还可以为 Cassandra 表中的每一列设置 TTL（生存时间）值。一旦超过设定的 TTL，该列将被逻辑删除并标记为过时。不过，内存只在压缩时才会被释放。\n\
  \n例如，在银行系统中，每个请求都会生成一个 OTP（一次性密码），并且会在一定时间后过期。对于此类场景，我们可以临时创建一个带有 TTL 值的列。\n\n在\
  \ Cassandra 2.x 之前，只能通过插入和更新操作来设置 TTL 值。现在，在 2.x 版本中，我们还可以为每个列族/表设置默认的 TTL 值。为了存储\
  \ TTL 和过期时间，列族需要额外的八个字节。\n\n让我们通过一个简单的练习来探索 TTL。\n\n首先，创建一个键空间 `demo` 和列族 `TTLSample`。\n\
  \n```\ncreate keyspace demo with replication = {'class':'SimpleStrategy','replication_factor':1};\n\
  ```\n\n```\nuse demo;\n```\n\n```\ncreate table \"TTLsample\"(user_id text PRIMARY\
  \ KEY, OTP text, name text);\n```\n\n让我们在 `TTLsample` 表中插入一条记录，并将 TTL 值设置为 16 秒。\n\
  \n```\ninsert into \"TTLsample\"(user_id,OTP,name) values('imvivek','12121','vivek')\
  \ using TTL 16;\n```\n\n运行上述查询后，`TTLsample` 表中将存储一行数据，每一列的 TTL 值均设置为 16 秒。\n\n让我们尝试在\
  \ 16 秒前后获取该行数据。\n\n```\nselect * from \"TTLsample\";\n```\n\n图 3-9 显示了 16 秒前后的输出结果。\n\
  \n你也可以通过 `insert` 或 `update` 操作为每一列设置 TTL 值。\n\n![A978-1-4842-0142-8_3_Fig9_HTML.jpg](img/A978-1-4842-0142-8_3_Fig9_HTML.jpg)\n\
  \n图 3-9. 生存时间过期前后的输出结果\n\n```\ninsert into \"TTLsample\"(user_id,name) values('imvivek','vivek');\n\
  ```\n\n```\ninsert into \"TTLsample\"(user_id,OTP) values('imvivek','12121') using\
  \ TTL 16;\n```\n\n图 3-10 显示了 `otp` 列在 TTL 过期前后的输出。\n\n也可以在 TTL 过期之前重置 TTL 值。\n\n\
  ![A978-1-4842-0142-8_3_Fig10_HTML.jpg](img/A978-1-4842-0142-8_3_Fig10_HTML.jpg)\n\
  \n图 3-10. OTP 列 TTL 过期前后的对比\n\n```\ninsert into \"TTLsample\"(user_id,OTP) values('imvivek','12121')\
  \ using TTL 160;\n// 160 秒后 OTP 过期\n```\n\n```\ninsert into \"TTLsample\"(user_id,OTP)\
  \ values('imvivek','12121') using TTL 16;\n// 将过期时间重置为 16 秒\n```\n\n### 默认 TTL\n\
  \n在 Cassandra 2.x 中，还可以为每个列族设置默认 TTL：\n\n```\nalter table \"TTLsample\" with default_time_to_live=10;\n\
  ```\n\n图 3-11 显示了默认 TTL 值设置为 10 秒的情形。\n\n![A978-1-4842-0142-8_3_Fig11_HTML.jpg](img/A978-1-4842-0142-8_3_Fig11_HTML.jpg)\n\
  \n图 3-11. 输出显示默认 TTL 设置为 10 秒\n\n### 数据分区\n\n分区模式在跨节点数据分布中起着重要作用。Cassandra 提供了三种数据分区策略：\n\
  \n*   选择 `RandomPartitioner` 将使用 MD5 哈希算法在节点间分布数据。随机分区器会均匀地分布集群中的数据。数据分布依赖于为每个节点分配的\
  \ `initial_token` 值或 `num_tokens`。MD5 哈希值为 16 字节，用于表示十六进制数字。每个节点被分配一个由 token 值表示的数据范围。当收到读写请求，且随机分区器被选为分区策略时，会为每个行键生成哈希值，并将其分配给负责处理该读写请求的节点。这就是数据通过随机分区进行分布的方式。\n\
  *   默认分区器。与 `RandomPartitioner` 类似，但使用 Murmur Hash 函数来计算 token 值。Murmur3 哈希表示一个\
  \ 32 位或 128 位的值，在 Cassandra 中它使用 128 位的值作为 token。MD5 和 Murmur3 哈希的另一个区别在于，后者是非加密哈希，而\
  \ MD5 是加密哈希函数（例如，单向哈希）。\n*   推荐用于顺序数据访问。使用此分区器，数据会根据行键值在集群中的节点间分布。数据分布不均匀的频率很高，并且在特定范围内频繁写入时可能导致性能热点。\n\
  \n#### 更改分区器\n\n在进行数据建模时，提前决定分区策略。不允许在集群已经开始接收数据后更改分区器，否则 Cassandra 会抛出类似以下的错误：\n\
  \n```\nERROR 23:34:10,630 Cannot open \\var\\lib\\cassandra\\data\\system\\schema_keyspaces\\\
  system-schema_keyspaces-jb-1; partitioner org.apache.cassandra.dht.Murmur3Partitioner\
  \ does not match system partitioner org.apache.cassandra.dht.RandomPartitioner.\n\
  ```\n\n请注意，从 Cassandra 1.2 开始，默认分区器是 `Murmur3Partitioner`，因此如果升级，你需要编辑它以匹配旧分区器。\n\
  \n#### 数据本地化\n\n每个行键的列将本地存储在该节点上。根据复制因子和策略，数据将在节点间进行复制。这就是 Cassandra 确保数据本地性和高可用性的方式。\n\
  \n让我们讨论一下 Cassandra 中读写的工作方式。\n\n##### Cassandra 写入\n\n在点对点架构中，集群中的每个节点都有资格接收读写请求。作为客户端和数据节点（负责处理写请求的节点）之间代理或委托者的节点称为协调节点。收到写请求后，列首先会被写入提交日志，然后写入指定节点上的\
  \ memtable。根据提供的**一致性级别**，会向客户端发送确认信息。\n\n数据将根据 `memtable_total_space_in_mb` 以 sstable\
  \ 的形式刷新到磁盘。超过该限制时，最大的 memtable 将被刷新到磁盘。图 3-12 显示了 Cassandra 插入和更新的图像表示。\n\n![A978-1-4842-0142-8_3_Fig12_HTML.jpg](img/A978-1-4842-0142-8_3_Fig12_HTML.jpg)\n\
  \n图 3-12. a) 左侧图像，为 id 1 插入名字；b) 右侧图像，为 person id 1 更新添加姓氏列\n\n在图 3-12a 和 3-12b\
  \ 中，`fname` 和 `lname` 列是通过连续的写入列请求存储的。每个 memtable 是列族的内存表示。而提交日志会按相同顺序保留数据。为 Person\
  \ 列族插入一条记录，会将其不断添加到相应的 memtable 中。例如，为行键 1 添加另一个 `age` 列并更新 `fname`，会修改数据结构，如图 3-13\
  \ 所示。\n\n![A978-1-4842-0142-8_3_Fig13_HTML.jpg](img/A978-1-4842-0142-8_3_Fig13_HTML.jpg)\n\
  \n图 3-13. a) 左侧图像显示添加值为 32 的 `age` 列；b) 右侧图像显示更新 person id 1 的行，将 `fname` 列的值改为\
  \ vivs\n\n图 3-13a 和 3-13b 分别描述了 `age` 列的插入和 `fname` 的修改。请注意，Cassandra 提供更快的写入吞吐量，因为它没有更新操作，只有插入操作。但是，基于时间戳，具有最新时间戳的行将作为输出返回。这里的时间戳由\
  \ Cassandra 内部管理。压缩过程将通过删除过时或墓碑行来管理释放空间。在 2.x 版本中，Cassandra 提供了比较并设置（CAS）支持。我们将在后面的“比较并设置”部分讨论这一点。\n\
  \n\n\n### Cassandra 读取操作\n\n协调节点选择以及将读取请求分配给数据节点的过程与写入请求类似。Cassandra 会返回特定行键中带有最新时间戳的列。Cassandra\
  \ 内部执行以下步骤来返回列名和值：\n\n1.  首先在 `memtable` 中搜索缓存的值\n2.  使用 `bloom filter` 行键扫描 `sstables`\
  \ 以查找列\n3.  按最新时间戳对符合条件的 `sstables` 进行排序\n4.  合并并返回具有最新时间戳值的列\n\n我们将在第 8 章中详细讨论`bloom\
  \ filter`。\n\n图 3-14 展示了读取操作如何与 Cassandra 存储架构协同工作。\n\n![A978-1-4842-0142-8_3_Fig14_HTML.jpg](img/A978-1-4842-0142-8_3_Fig14_HTML.jpg)\n\
  \n图 3-14. 使用 Cassandra 的读取机制\n\n### Cassandra 2.0 的新特性\n\nCassandra 2.0 及后续版本带来了许多新功能，并在\
  \ CQL3 方面进行了大量性能增强。Cassandra 2.0 引入了对与索引和复合列相关的几个关键功能的支持，包括：\n\n-   比较并设置（CAS）\n\
  -   复合列的二级索引\n-   条件 DDL\n\n> **注意**  \n> 在本书付印之前，Cassandra 2.1 已经发布。请参阅第 1 章以了解\
  \ 2.1 版本中若干重要新功能的信息。\n\n#### 比较并设置\n\n凭借最终一致性和复制支持，事务数据可以保持一致且高度可用。但在少数情况下，应用程序可能需要在多个线程之间独立访问数据，例如应用程序需要生成唯一的\
  \ OTP（一次性密码）并希望避免竞态条件。自 2.x 版本起，对比较并设置（CAS）的支持已经启用。\n\n> **注意**  \n> Cassandra 中的\
  \ CAS 支持基于 paxos 算法。你可以参考 [`http://en.wikipedia.org/wiki/Paxos_(computer_science`](http://en.wikipedia.org/wiki/Paxos_(computer_science)\
  \ `)` 了解更多详情。\n\n##### 算法\n\n比较并设置操作需要从副本节点读取最新值，而充当协调者的节点称为领导者。领导者将协调副本节点，使它们执行以下任务：\n\
  \n1.  准备令牌并作出承诺\n2.  向副本发出读取请求，并接收带有最新令牌的输出\n3.  提议更新的值并获得接受\n4.  向每个副本发出提交命令并接收确认\n\
  \n#### 使用 CAS\n\n每个 CAS 操作都需要多次数据库往返；因此，建议仅在有限的需求下使用此类操作，以避免性能开销。\n\n让我们以同一个 Twitter\
  \ 示例来使用 CAS。\n\n首先，创建一个键空间 `twitter` 和列族 `users`：\n\n```\ncreate keyspace twitter\
  \ with replication={'class':'SimpleStrategy','replication_factor': 1 };\nuse twitter;\n\
  create table users(user_id text primary key,followers set<text>, tweet_date timestamp,\
  \ tweet_body text, first_name text);\n```\n\n让我们使用 `if not exists` 命令为行键 `'imvivek'`\
  \ 插入一条记录：\n\n```\ninsert into users(user_id,tweet_date,tweet_body,first_name) values('imvivek','2013-12-31','good\
  \ bye 2013','vivek')  if not exists;\n```\n\n让我们重新运行相同的命令，并将 `first_name` 设为 `'vivek_update'`：\n\
  \n```\ninsert into users(user_id,tweet_date,tweet_body,first_name) values('imvivek','2013-12-31','good\
  \ bye 2013','vivek_update')  if not exists;\n```\n\n在图 3-15 中，由于在执行步骤 2 的命令之前表是空的，并且不存在任何记录，因此命令被成功应用，但在步骤\
  \ 3 时同样的命令失败了。\n\n让我们尝试使用 CAS 来更新用户，为名为 `\"vivek\"` 的用户添加关注者：\n\n![A978-1-4842-0142-8_3_Fig15_HTML.jpg](img/A978-1-4842-0142-8_3_Fig15_HTML.jpg)\n\
  \n图 3-15. 如果不存在则插入行键为 `imvivek` 的行的 CAS 操作\n\n```\nupdate users set followers =\
  \ {'apress'} where user_id='imvivek' if first_name='vivek';\nselect * from users;\n\
  ```\n\n图 3-16 显示了 CAS 更新操作后检索记录的结果。\n\n![A978-1-4842-0142-8_3_Fig16_HTML.jpg](img/A978-1-4842-0142-8_3_Fig16_HTML.jpg)\n\
  \n图 3-16. 使用 CAS 操作成功更新后的行\n\n### 复合列的二级索引\n\n从 Cassandra 2.x 版本开始，Cassandra 允许在聚类键上创建二级索引，这使得用户可以使用\
  \ EQ 运算符运行查询。在 2.x 之前，只有在 `where` 子句中提供了前一个聚类键部分时，才可以在 `where` 子句中包含剩余的聚类键。\n\n\
  让我们使用在“复合列”部分中讨论的同一个 Twitter 示例。\n\n首先，创建一个键空间 `twitter` 和列族 `users`：\n\n```\ncreate\
  \ keyspace twitter with replication = {'class':'SimpleStrategy','replication_factor':1};\n\
  use twitter;\ncreate table users(user_id text,followers set<text>, tweet_date timestamp,\
  \ tweet_body text, first_name text, PRIMARY KEY(user_id,tweet_date, first_name));\n\
  ```\n\n让我们为 user_id `'imvivek'` 在 `users` 列族中存储一些列：\n\n```\n// 为 'imvivek' 插入记录\n\
  insert into users(user_id,tweet_date,tweet_body,first_name) values('imvivek','2013-12-31','good\
  \ bye 2013','vivek');\ninsert into users(user_id,tweet_date,tweet_body,first_name)\
  \ values('imvivek','2014-01-01','welcome 2014','vivek');\ninsert into users(user_id,tweet_date,tweet_body,first_name)\
  \ values('imvivek','2014-01-04','Working on Cassandra book on weekend','Vivs');\n\
  ```\n\n在 `first_name` 上添加索引，并检索名为 `vivek` 的记录：\n\n```\ncreate index on user(first_name);\n\
  select * from users where first_name = 'vivek';\n```\n\n图 3-17 显示了在启用二级索引后，通过聚类列\
  \ `first_name` 获取数据的结果。\n\n![A978-1-4842-0142-8_3_Fig17_HTML.jpg](img/A978-1-4842-0142-8_3_Fig17_HTML.jpg)\n\
  \n图 3-17. 在聚类列 `first_name` 上启用二级索引后获取记录\n\n### 条件 DDL\n\n从 Cassandra 2.x 开始，现在可以对键空间、表和索引执行条件\
  \ DDL 操作。条件 DDL 允许用户验证所查询的键空间、列族或索引是否存在。让我们看几个例子来了解其工作方式。\n\n**键空间**\n\n-   如果键空间\
  \ `twitter` 不存在，则创建它：\n\n```\ncreate keyspace if not exists twitter with replication\
  \ = {'class':'SimpleStrategy', 'replication_factor': 3};\n```\n\n-   如果键空间 `twitter`\
  \ 存在，则删除它：\n\n```\ndrop keyspace if exists twitter;\n```\n\n**表**\n\n-   如果表 `users`\
  \ 不存在，则创建它：\n\n```\ncreate table if not exists users(user_id text,followers set<text>,\
  \ tweet_date timestamp, tweet_body text, first_name text, PRIMARY KEY(user_id,tweet_date,\
  \ first_name));\n```\n\n-   如果表 `users` 存在，则删除它：\n\n```\ndrop table if exists users;\n\
  ```\n\n**索引**\n\n-   如果 `users` 表上列 `first_name` 的索引不存在，则创建它：\n\n```\ncreate index\
  \ if not exists users_first_name_idx on users(first_name);\n```\n\n-   如果索引 `users_first_name_idx`\
  \ 存在，则删除它：\n\n```\ndrop index if exists users_first_name_idx;\n```\n\n## 总结\n\n\
  在本章中，我们讨论了数据建模和索引概念及其在 Cassandra 中的使用。总而言之，有几点值得重申：\n\n-   索引存储在数据节点本地。\n-   对列值的更新即是对索引的更新，这是一个原子操作。\n\
  -   避免在高基数列值上使用二级索引。\n-   过多的索引会严重影响写入性能，应予以避免。相反，应尝试对数据模型进行反范式化，或使用复合列。\n\n有了数据模型，在设计使用\
  \ Cassandra 的应用程序时，自然而然会想到的下一个问题是数据安全性。第 4 章将讨论数据加密/解密以及 Cassandra 提供的安全选项。\n\n\n\
  \n"
- "# Cassandra 数据安全\n\n数据库安全意味着保护敏感数据和数据库应用程序免受未经授权的访问。数据的可扩展性和高可用性固然重要，但数据安全也同样关键！例如，金融及其他公共行业需要可扩展、高可用且安全的数据库。也就是说，许多类型的组织，尤其是金融和政府机构，都将安全性置于优先地位。\n\
  \n从 Cassandra 1.2.2 版本开始，我们可以通过两种方式保护 Cassandra 中的数据：访问控制和加密。Cassandra 支持授权和身份验证功能。\n\
  \n本章将涵盖以下主题：\n\n-   Cassandra 的 `system` 和 `system_auth` 键空间\n-   管理用户权限\n-   节点间与客户端-服务器\
  \ SSL 加密\n\n## 身份验证与授权\n\n身份验证是指对试图访问数据存储的用户进行控制。在确保与数据库连接安全的同时，必须验证用户身份。身份验证有三种基本类型：\n\
  \n-   使用内部身份验证时，通常数据存储会通过凭据（如用户 ID 和密码）管理用户登录。\n-   外部身份验证，例如 Kerberos，是一种使用票据系统验证客户端身份的网络协议。\n\
  -   客户端-服务器加密。客户端到服务器或节点到节点的加密是数据在集群中传输的另一种方式。使用加密时，必须将客户端或节点的公共信任证书安装到另一个节点上。\n\
  \n身份验证过程仅限于用户验证和识别。\n\n处理用户访问控制被称为授权。数据库授权意味着管理用户对模式、表和列的角色与权限。\n\nCassandra 的内部身份验证是一种\
  \ SSL 加密机制，我们将通过实践示例来了解它。\n\n### `system` 和 `system_auth` 键空间\n\n`system` 键空间包含有关可用列族、列和集群的信息。`system_auth`\
  \ 键空间主要包含身份验证信息、用户凭据和权限。我们将在后续的示例中讨论它们。`system` 键空间下的表/列族包括：\n\n-   `schema_keyspace`\n\
  -   `schema_columns`\n-   `schema_columnfamilies`\n-   `local`\n-   `peers`\n\n\
  图 4-1 显示了 `system` 键空间的层次结构，其中根节点是 `system` 键空间，下级节点是列族，每个表代表使用这些列族定义的列。\n\n![A978-1-4842-0142-8_4_Fig1_HTML.jpg](img/A978-1-4842-0142-8_4_Fig1_HTML.jpg)\n\
  \n图 4-1. 系统键空间及其底层列族和对应列\n\n在我们开始使用 `system` 和 `system_auth` 键空间管理身份验证和授权之前，让我们先探索一下\
  \ `system` 键空间是否可修改！\n\n#### `system` 键空间不可修改\n\n在我们深入讨论授权和身份验证之前，让我们先操作一下 `system`\
  \ 键空间，以验证外部用户是否可以修改它。由于它是由 Cassandra 存储架构内部管理的键空间，外部用户不可能更新/修改 `system` 键空间。下一个简单的练习旨在尝试这些否定场景以进行验证。在设计模式时，通常无需对\
  \ Cassandra 进行此类调整，但既然我们在讨论安全性，那就来看看 `system` 键空间的安全程度如何！\n\n默认情况下，提供对 `system`\
  \ 键空间的读取访问权限。让我们通过一些练习尝试访问它。\n\n`system` 键空间配置了 `LocalStrategy` 作为复制选项。\n\n-   首先，尝试创建一个复制策略为\
  \ `LocalStrategy` 的键空间：\n\n```\ncreate keyspace system_test with replication = {\
  \ 'class':'localstrategy','replication_factor':3};\n```\n\n```\ncreate keyspace\
  \ system_test with replication = { 'class':'LocalStrategy'};\n```\n\n图 4-2 显示我们无法使用\
  \ `LocalStrategy` 创建另一个键空间。\n\n-   现在，尝试修改/删除 `system` 键空间：\n\n![A978-1-4842-0142-8_4_Fig2_HTML.jpg](img/A978-1-4842-0142-8_4_Fig2_HTML.jpg)\n\
  \n图 4-2. `LocalStrategy` 不供公共使用\n\n```\nalter keyspace system with replication =\
  \ { 'class' : 'LocalStrategy'};\nalter keyspace system with replication = { 'class'\
  \ : 'SimpleStrategy', 'replication_factor':3};\n```\n\n图 4-3 显示无法更改 `system` 键空间的策略。\n\
  \n![A978-1-4842-0142-8_4_Fig3_HTML.jpg](img/A978-1-4842-0142-8_4_Fig3_HTML.jpg)\n\
  \n图 4-3. 无法更改 `system` 键空间的策略类\n\n这意味着我们也无法修改 `system` 键空间。\n\n-   接下来，尝试删除 `system`\
  \ 键空间：\n\n```\ndrop keyspace system;\n```\n\n图 4-4 显示我们同样无法删除 `system` 键空间！\n\n\
  ![A978-1-4842-0142-8_4_Fig4_HTML.jpg](img/A978-1-4842-0142-8_4_Fig4_HTML.jpg)\n\n\
  图 4-4. 删除 `system` 键空间是不允许的\n\n通过这些示例，我们可以得出结论：修改 `system` 键空间是不允许的；但是，我们可以修改 `system`\
  \ 键空间下列族中存在的数据。\n\n\n\n## 启用身份验证后访问 system_auth 密钥空间\n\nCassandra 的二进制发行版附带两种身份验证器：`PasswordAuthenticator`\
  \ 和 `AllowAllAuthenticator`。启用 `PasswordAuthenticator` 后，Cassandra 会通过用户名和哈希密码来验证用户。这些用户凭据存储在\
  \ `system_auth.credentials` 表中。\n\n在本教程中，我们将讨论如何使用 `PasswordAuthenticator` 管理用户凭据并访问\
  \ `system_auth` 密钥空间。启用身份验证后，在连接到 Cassandra 服务器时需要提供用户名和密码。Cassandra 会将用户名和哈希密码存储在该密钥空间的\
  \ `credentials` 表中。\n\n开始之前，我们需要在 `cassandra.yaml` 中启用身份验证，操作如下：\n\n```\nauthenticator:\
  \ org.apache.cassandra.auth.PasswordAuthenticator\n```\n\n现在身份验证已启用，您可以完成以下步骤：\n\
  \n首先，让我们尝试不提供用户名/密码，直接连接服务器并创建一个密钥空间：\n\n```\ncreate keyspace system_temp with replication\
  \ = { 'class' : 'SimpleStrategy', 'replication_factor' : 3 };\n```\n\n执行上述命令将会产生如图\
  \ 4-5 所示的错误。\n\n现在，使用用户名和密码进行连接并创建密钥空间：\n\n![A978-1-4842-0142-8_4_Fig5_HTML.jpg](img/A978-1-4842-0142-8_4_Fig5_HTML.jpg)\n\
  \n**图 4-5.** 连接失败，因为在尝试创建密钥空间之前我们没有进行身份验证\n\n```\n// 使用用户名和密码连接。\n$CASSANDRA_HOME/bin/cqlsh\
  \ -3 -u cassandra -p cassandra\n\n// 创建密钥空间。\ncreate keyspace system_temp with replication\
  \ = { 'class' : 'SimpleStrategy', 'replication_factor' : 3 };\n```\n\n图 4-6 显示连接成功。\n\
  \n接下来，我们创建一个超级用户和一个非超级用户：\n\n![A978-1-4842-0142-8_4_Fig6_HTML.jpg](img/A978-1-4842-0142-8_4_Fig6_HTML.jpg)\n\
  \n**图 4-6.** 使用用户凭据成功连接后\n\n```\ncreate user normaluser with password 'normal';\n\
  create user 'superuser' with password 'superuser' superuser;\n```\n\n这将把用户信息存储在\
  \ `users` 表中，如图 4-7 所示。\n\n![A978-1-4842-0142-8_4_Fig7_HTML.jpg](img/A978-1-4842-0142-8_4_Fig7_HTML.jpg)\n\
  \n**图 4-7.** 已注册用户列表\n\n此外，您可以查看 `credentials` 表中的密码及其他信息。\n\n至此，我们得出结论：我们可以使用身份验证创建和管理用户凭据。\n\
  \n在上述教程中，我们成功创建了一个超级用户和一个非超级用户。下一个教程将讨论为这两类用户管理并访问不同列族上的用户凭据。\n\n## 管理用户权限\n\nCassandra\
  \ 提供了管理已验证用户权限和凭据的机制。在本教程中，我们将进一步探讨如何管理/访问用户权限。`cassandra.yaml` 中配置的默认授权器是 `AllowAllAuthorizer`。\n\
  \n首先，我们尝试使用 `normaluser` 进行身份验证并管理其权限：\n\n```\n// 使用 cqlsh 连接。\n$CASSANDRA_HOME/bin/cqlsh\
  \ -3 -u normaluser -p normal\n\n// 列出用户权限。\nlist all permissions of normaluser;\n\
  list all permissions of cassandra;\n\n// 向 normaluser 授予权限。\ngrant select on all\
  \ keyspaces to normaluser;\n```\n\n这将会产生如图 4-8 所示的授权错误。因此，我们需要在 `cassandra.yaml`\
  \ 中启用授权器。\n\n现在，让我们尝试使用 `normaluser` 创建一个密钥空间：\n\n![A978-1-4842-0142-8_4_Fig9_HTML.jpg](img/A978-1-4842-0142-8_4_Fig9_HTML.jpg)\n\
  \n**图 4-9.** 在 `cassandra.yaml` 中启用 `CassandraAuthorizer`\n\n让我们在 `cassandra.yaml`\
  \ 中启用授权器配置并重启服务器。图 4-9 展示了如何在 `cassandra.yaml` 中启用。\n\n![A978-1-4842-0142-8_4_Fig8_HTML.jpg](img/A978-1-4842-0142-8_4_Fig8_HTML.jpg)\n\
  \n**图 4-8.** 不允许使用 `AllowAllAuthorizer` 管理权限\n\n```\ncreate keyspace testkeyspace\
  \ with replication = { 'class' : 'SimpleStrategy', 'replication_factor' : 3};\n\
  ```\n\n我们再次遇到错误（见图 4-10），因为 `normaluser` 没有被授予创建权限。\n\n![A978-1-4842-0142-8_4_Fig10_HTML.jpg](img/A978-1-4842-0142-8_4_Fig10_HTML.jpg)\n\
  \n**图 4-10.** 错误：`normaluser` 没有创建密钥空间的权限\n\n此外，`normaluser` 不能将权限授予自身。只有 `superuser`\
  \ 才能做到！\n\n因此，让我们使用 `superuser` 登录：\n\n```\n$CASSANDRA_HOME/bin/cqlsh -3 -u superuser\
  \ -p superuser\n```\n\n现在，创建一个密钥空间并向 `normaluser` 授予权限：\n\n```\n// 创建密钥空间。\ncreate\
  \ keyspace testkeyspace with replication = { 'class' : 'SimpleStrategy' , 'replication_factor'\
  \ : 3};\n\n// 将 'testkeyspace' 的所有权限授予 normaluser。\ngrant all on keyspace testkeyspace\
  \ to normaluser;\n```\n\n向 `normaluser` 授予权限后，服务器会将其权限存储在 `system_auth` 密钥空间下的 `permissions`\
  \ 表中。\n\n让我们查看 `normaluser` 的所有已授予权限（见图 4-11）：\n\n```\n// 列出所有权限。\nlist all permissions\
  \ of normaluser;\n```\n\n让我们创建 `anotherkeyspace` 并在其下创建一个名为 `privileges` 的表：\n\n\
  ![A978-1-4842-0142-8_4_Fig11_HTML.jpg](img/A978-1-4842-0142-8_4_Fig11_HTML.jpg)\n\
  \n**图 4-11.** 当前 `normaluser` 的权限\n\n```\n// 创建密钥空间。\ncreate keyspace anotherkeyspace\
  \ with replication = { 'class' : 'SimpleStrategy' , 'replication_factor' : 3};\n\
  \n// 创建表。\ncreate table privileges (user_id text PRIMARY KEY, read_write boolean);\n\
  ```\n\n让我们将 `privileges` 表的所有权限授予 `normaluser`：\n\n```\ngrant all on table anotherkeyspace.privileges\
  \ to normaluser;\n```\n\n现在，我们再次列出 `normaluser` 的所有权限（见图 4-12）：\n\n```\n// 列出所有权限。\n\
  list all permissions of normaluser;\n```\n\n接下来，让我们将所有密钥空间的所有权限授予 `superuser`：\n\
  \n![A978-1-4842-0142-8_4_Fig12_HTML.jpg](img/A978-1-4842-0142-8_4_Fig12_HTML.jpg)\n\
  \n**图 4-12.** `normaluser` 的新权限列表\n\n```\ngrant select on all keyspaces to 'superuser';\n\
  ```\n\n现在，将 `privileges` 表的 `select` 权限授予 `superuser`：\n\n```\ngrant select on anotherkeyspace.privileges\
  \ to 'superuser';\n```\n\n让我们查看 `privileges` 表上授予的所有权限（见图 4-13）：\n\n```\nlist all\
  \ permissions on privileges;\n```\n\n我们还可以使用指定符显示特定资源的权限（见图 4-14）。\n\n![A978-1-4842-0142-8_4_Fig13_HTML.jpg](img/A978-1-4842-0142-8_4_Fig13_HTML.jpg)\n\
  \n**图 4-13.**\n\n\n\n## 权限及父级资源的权限\n\n`list all permissions on privileges NORECURSIVE;`\n\
  \n让我们使用 `normaluser` 登录，并尝试查看 `privileges` 表上赋予的所有权限。\n\n![A978-1-4842-0142-8_4_Fig14_HTML.jpg](img/A978-1-4842-0142-8_4_Fig14_HTML.jpg)\n\
  \n图 4-14. 在 `privileges` 表上赋予所有用户的权限列表\n\n`list all permissions on anotherkeyspace.privileges;`\n\
  \n我们再次收到“未授权”错误（见图 4-15）。`normaluser` 已被授予 `privileges` 表上的所有权限，但它无法查看所有用户的权限。不过，`normaluser`\
  \ 可以执行前面提到的其他允许的操作。\n\n我们再尝试让 `normaluser` 删除自身和 `superuser`（见图 4-16）。\n\n![A978-1-4842-0142-8_4_Fig15_HTML.jpg](img/A978-1-4842-0142-8_4_Fig15_HTML.jpg)\n\
  \n图 4-15. 未授予 `normaluser` 对 `anotherkeyspace` 的权限\n\n`drop user normaluser;`\n\
  `drop user 'superuser';`\n\n结果如图 4-16 所示，表明 `normaluser` 无法删除、撤销或查看其他用户的权限。但 `superuser`\
  \ 可以！\n\n因此，我们使用 `superuser` 登录，并尝试撤销赋予特定用户（此处为 `normaluser`）的权限，操作如下：\n\n![A978-1-4842-0142-8_4_Fig16_HTML.jpg](img/A978-1-4842-0142-8_4_Fig16_HTML.jpg)\n\
  \n图 4-16. 非超级用户不允许删除用户\n\n`revoke all permissions on privileges from normaluser;`\n\
  `list all permissions on privileges;`\n\n图 4-17 显示操作成功。\n\n![A978-1-4842-0142-8_4_Fig17_HTML.jpg](img/A978-1-4842-0142-8_4_Fig17_HTML.jpg)\n\
  \n图 4-17. 超级用户在 `privileges` 表上的权限\n\n通过这一系列步骤，我们得出结论：\n\n- 非超级用户无法管理、访问或查看其他用户的权限。\n\
  - 权限可以在键空间及特定表/列族上授予。\n- 超级用户可以管理或访问其他用户的权限。\n\n## 使用 `AllowAllAuthorizer` 访问 `system_auth`\n\
  \n默认情况下，Cassandra 的认证功能是禁用的，并在 `cassandra.yaml` 配置文件中配置了 `AllowAllAuthenticator`\
  \ 作为认证器。在前面章节中，我们探讨了使用 `PasswordAuthenticator` 的各种授权技术。本节我们将探讨使用 `AllowAllAuthorizer`\
  \ 管理用户权限是否可行。本方案旨在让你了解 `AllowAllAuthorizer` 的局限性，纯属实验性质。\n\n如上所述，`system_auth` 键空间包含用户凭据和权限详情。在本方案中，我们将尝试在无认证情况下访问\
  \ `system_auth` 键空间并管理用户凭据。\n\n首先，我们描述一下 `system_auth` 键空间（见图 4-18）。\n\n```\n//\
  \ 描述键空间。\ndescribe keyspace system_auth;\n```\n\n让我们探索 `users` 表，如图 4-19 所示。\n\n\
  ![A978-1-4842-0142-8_4_Fig19_HTML.jpg](img/A978-1-4842-0142-8_4_Fig19_HTML.jpg)\n\
  \n图 4-19. `users` 表中的默认用户\n\n首先，尝试删除 `users` 表中的所有数据（见图 4-20）：\n\n![A978-1-4842-0142-8_4_Fig18_HTML.jpg](img/A978-1-4842-0142-8_4_Fig18_HTML.jpg)\n\
  \n图 4-18. 描述的 `system_auth` 键空间\n\n`truncate users;`\n\n我们成功截断了 `users` 表，但接下来看看能否删除它。\n\
  \n![A978-1-4842-0142-8_4_Fig20_HTML.jpg](img/A978-1-4842-0142-8_4_Fig20_HTML.jpg)\n\
  \n图 4-20. 截断后的 `users` 表\n\n`drop table users;`\n\n图 4-21 显示我们无法执行此操作，因为这是一个系统表，Cassandra\
  \ 对外部用户进行了限制。\n\n接下来，重启 Cassandra 服务器以验证 `users` 表是否为空（见图 4-22）：\n\n![A978-1-4842-0142-8_4_Fig21_HTML.jpg](img/A978-1-4842-0142-8_4_Fig21_HTML.jpg)\n\
  \n图 4-21. 不允许删除 `users` 表\n\n`select * from users;`\n\n![A978-1-4842-0142-8_4_Fig22_HTML.jpg](img/A978-1-4842-0142-8_4_Fig22_HTML.jpg)\n\
  \n图 4-22. 默认用户 `cassandra` 已预填充\n\n启用 `AllowAllAuthorizer` 后对 `system_auth` 键空间所做的更改将被\
  \ Cassandra 忽略。因此，第 3 步中的更改将不会生效，Cassandra 将填充如图第 2 步所示的默认设置。\n\n让我们尝试创建一个用户：\n\n\
  `create user normaluser with password 'normal';`\n`create user normaluser;`\n\n\
  如图 4-23 所示，Cassandra 不允许在启用 `AllowAllAuthenticator` 的情况下创建用户。然而，正如我们之前所见，使用 `PasswordAuthenticator`\
  \ 则可以。\n\n我们可以按如下方式更改 `system_auth` 键空间的复制策略：\n\n![A978-1-4842-0142-8_4_Fig23_HTML.jpg](img/A978-1-4842-0142-8_4_Fig23_HTML.jpg)\n\
  \n图 4-23. 未登录时尝试使用 `AllowAllAuthenticator` 创建用户\n\n`alter keyspace system_auth with\
  \ replication = {'class':'SimpleStrategy','replication_factor':3};`\n\n通过本方案，我们得出结论：我们可以更改\
  \ `system_auth` 键空间，但无法在启用 `AllowAllAuthenticator`（认证禁用）的情况下创建用户。当使用默认用户凭据认证 Cassandra\
  \ 服务器时，必须将一致性级别配置为 `QUORUM`。\n\n接下来我们将讨论 SSL 加密以及在启用加密的情况下连接 `cqlsh` 和 Thrift 客户端。\n\
  \n\n\n## 准备服务器证书\n\n近年来，社交媒体和基于互联网的应用使全球范围内的数据访问和共享成为可能。SSL 协议用于通过互联网以安全通信的方式发送加密数据。\n\
  \n对于通过 SSL 进行的客户端-服务器或节点间通信，我们需要准备服务器证书。一个文件包含服务器密钥，而另一个文件包含所有客户端或节点的可信 SSL 证书。\n\
  \n在开始新的教程之前，我们预先讨论一些可能的错误及解决方案。在配置并启动 Cassandra 服务器后，如果收到类似以下的错误，我们需要使用 Java 加密扩展（JCE）来配置已安装的\
  \ Java 版本。\n\n`Cannot support TLS_RSA_WITH_AES_256_CBC_SHA with currently installed\
  \ providers`\n\n从以下地址下载 JCE 包：\n\n[`http://www.oracle.com/technetwork/java/javase/downloads/jce-6-download-429243.html`](http://www.oracle.com/technetwork/java/javase/downloads/jce-6-download-429243.html)\
  \ (Java 6)\n\n[`http://www.oracle.com/technetwork/java/javase/downloads/jce-7-download-432124.html`](http://www.oracle.com/technetwork/java/javase/downloads/jce-7-download-432124.html)\
  \ (Java 7)\n\n然后将 `local_policy.jar` 和 `US_export_policy.jar` 复制到 `$JAVA_HOME/jre/lib/security`\
  \ 文件夹下。\n\n必要的配置已完成，现在让我们通过一个简单的练习来探索如何准备服务器证书。\n\n首先，使用 `keytool` 为服务器生成一个密钥库：\n\
  \n`keytool -genkey -alias servernode -keystore /home/impadmin/keys/server/server.jks\
  \ -storepass server -keypass server`\n\n这里，`/home/impadmin/keys/server` 是包含密钥库文件的文件夹路径。你可以根据实际情况修改。图\
  \ 4-24 显示了生成密钥库时需要输入的基本信息。\n\n从密钥库文件中导出公钥部分：\n\n![A978-1-4842-0142-8_4_Fig24_HTML.jpg](img/A978-1-4842-0142-8_4_Fig24_HTML.jpg)\n\
  \n图 4-24. 生成密钥库时提供的输入信息\n\n`keytool -export -alias servernode -file /home/impadmin/keys/publickey.cer\
  \ -keystore /home/impadmin/keys/server.jks -storepass server`\n\n图 4-25 显示了 `publickey.cer`\
  \ 存储在 `/home/impadmin/keys` 文件夹中。\n\n将 `publickey.cer` 作为受信任的证书导入到服务器的文件中：\n\n![A978-1-4842-0142-8_4_Fig25_HTML.jpg](img/A978-1-4842-0142-8_4_Fig25_HTML.jpg)\n\
  \n图 4-25. 存储的带有完整路径的公钥证书\n\n`keytool -import -v -trustcacerts -alias client -file\
  \ /home/impadmin/keys/publickey.cer -keystore /home/impadmin/keys/.truststore -storepass\
  \ client`\n\n图 4-26 显示证书已成功添加。\n\n![A978-1-4842-0142-8_4_Fig26_HTML.jpg](img/A978-1-4842-0142-8_4_Fig26_HTML.jpg)\n\
  \n图 4-26. 客户端证书成功添加到服务器的信任库中\n\n至此，我们已经准备好了服务器证书。在接下来的几个教程中，我们将使用信任库通过受信任的证书访问服务器。对于节点间通信，我们需要在每个节点上重复上述步骤，并将每个节点的公钥证书复制到每个节点的信任库中。\n\
  \n图 4-27 以图形方式展示了客户端证书准备以及导入信任库的过程。\n\n![A978-1-4842-0142-8_4_Fig27_HTML.jpg](img/A978-1-4842-0142-8_4_Fig27_HTML.jpg)\n\
  \n图 4-27. 准备并与服务器共享客户端公钥证书的流程\n\n在 Cassandra 节点间准备和共享证书的过程相同，每个节点都需要将其公钥证书导出并共享给\
  \ Cassandra 集群中的所有其他节点。\n\n证书准备过程完成后，你需要启用并连接启用 SSL 加密的命令行客户端。下一节将讨论此过程。\n\n## 通过\
  \ SSL 加密进行连接\n\n上一节讨论了在启用 SSL 的情况下通过 `cqlsh` 进行连接。现在让我们探索如何通过启用 SSL 加密的 `cassandra-cli`\
  \ 命令行客户端进行连接。\n\n### 通过 Cassandra-cli 连接\n\n让我们启用 Cassandra 以实现加密的客户端到节点加密，并通过 Thrift\
  \ 方式（使用 `cassandra-cli`）连接到服务器。\n\n首先，我们需要为客户端到节点加密配置服务器。\n\n```\n// 启用服务器\nenabled:\
  \ true\n// 密钥库路径\nkeystore: /home/impadmin/keys/server.jks\n// 密钥库密码\nkeystore_password:\
  \ server\n```\n\n以下显示了 `cassandra.yaml` 中需要进行的配置更改，以配置密钥库和信任库路径：\n\n```\n# 启用或禁用客户端/服务器加密。\n\
  client_encryption_options:\n  enabled: false\n  keystore: /home/impadmin/keys/server.jks\n\
  \  keystore_password: server\n# require_client_auth: false\n# 如果 require_client_auth\
  \ 为 true，则设置信任库和信任库密码\n  truststore: /home/impadmin/keys/.truststore\n  truststore_password:\
  \ client\n# 更多高级默认设置如下：\n  protocol: TLS\n  algorithm: SunX509\n  store_type: JKS\n\
  \  cipher_suites: [TLS ECDHE RSA WITH AES 256 CBC SHA, TLS DHE RSA WITH AES 128\
  \ CBC SHA, TLS ECDH ECDSA WITH AES 128 CBC SHA, TLS DHE RSA WITH AES 256 CBC SHA,\n\
  SSL DHE RSA WITH 3DES EDE CBC SHA, TLS ECDH RSA WITH AES 256 CBC SHA, SSL RSA WITH\
  \ RC4 128 SHA, TLS ECDH ECDSA WITH 3DES EDE CBC SHA, TLS ECDHE RSA WITH RC4 128\
  \ SHA,\nTLS ECDH ECDSA WITH RC4 128 SHA, TLS ECDHE ECDSA WITH RC4 128 SHA, TLS ECDHE\
  \ RSA WITH AES 128 CBC SHA, TLS ECDHE ECDSA WITH 3DES EDE CBC SHA,\nTLS ECDH RSA\
  \ WITH RC4 128 SHA, TLS EMPTY RENEGOTIATION INFO SCSV, TLS ECDH RSA WITH 3DES EDE\
  \ CBC SHA, TLS ECDH RSA WITH AES 128 CBC SHA,\nTLS ECDHE ECDSA WITH AES 256 CBC\
  \ SHA, TLS ECDHE ECDSA WITH AES 128 CBC SHA, TLS DHE DSS WITH AES 256 CBC SHA, TLS\
  \ RSA WITH AES 128 CBC SHA,\nTLS ECDH ECDSA WITH AES 256 CBC SHA, TLS RSA WITH AES\
  \ 256 CBC SHA, TLS ECDHE RSA WITH 3DES EDE CBC SHA, SSL RSA WITH RC4 128 MD5, TLS\
  \ DHE DSS WITH AES 128 CBC SHA,\nSSI DHF DSS WTTH 3DFS FDF CRC SHA. SSI RSA WTTH\
  \ 3DFS FDF CRC SHA1]\n```\n\n这里，`cipher_suites` 配置包含所有有效的协议，建议在使用此应用程序进行配置时保持原样。\n\
  \n你可以将 `require_client_auth` 设置为 `true` 以启用客户端证书认证。\n\n启动 Cassandra 服务器并连接 `cassandra-cli`：\n\
  \n`$CASSANDRA_HOME/bin/cassandra-cli -h 127.0.0.1 -p 9160 -ts /home/impadmin/keys/.truststore\
  \ -tf org.apache.cassandra.cli.transport.SSLTransportFactory -tspw client`\n\n这里，`-ts`、`-tf`\
  \ 和 `-tspw` 分别代表信任库、传输工厂和信任库密码。\n\n通过使用传输工厂和信任库配置，以及 SSL 加密，我们可以连接到 Thrift 客户端。接下来，我们将使用启用\
  \ SSL 加密的 `cqlsh` 进行连接。\n\n### 通过 cqlsh 连接\n\n要连接启用加密的 `cqlsh`，我们需要在 `home` 目录下创建\
  \ `.cqlshrc` 文件。此外，我们也可以在 `require_client_auth=false` 的情况下连接 `cqlsh`。在本教程中，我们连接并配置\
  \ `cqlsh`。\n\n让我们在 `home` 目录下创建针对 SSL 配置的 `.cqlshrc` 文件。\n\n```\nfactory = cqlshlib.ssl.ssl_transport_factory\n\
  // 信任库文件路径\ncertfile = /home/impadmin/source/keys/.truststore\n```\n\n图 4-28 显示了\
  \ `.cqlshrc` 文件中的配置更改。\n\n就这样！让我们运行 `cqlsh` 来连接 Cassandra 服务器：\n\n![A978-1-4842-0142-8_4_Fig28_HTML.jpg](img/A978-1-4842-0142-8_4_Fig28_HTML.jpg)\n\
  \n图 4-28. `.cqlshrc` 配置更改\n\n`SSL_CERTFILE=/home/impadmin/source/keys/publickey.cer\
  \ SSL_VALIDATE=$CASSANDRA_HOME/bin/cqlsh -3 -t cqlshlib.ssl.ssl_transport_factory`\n\
  \n\n\n### 通过 Cassandra Thrift 客户端连接\n\n以下代码片段展示了如何通过基于 Java 的 Cassandra Thrift 客户端，连接到启用了安全机制的服务器：\n\
  \n```\nTSSLTransportFactory.TSSLTransportParameters params =\nnew TSSLTransportFactory.TSSLTransportParameters();\n\
  params.setTrustStore(\"信任库路径\", \"信任库密码\");\ntransport = TSSLTransportFactory.getClientSocket(\"\
  localhost\", 7001, 10000, params);\nTProtocol protocol = new TBinaryProtocol(transport);\n\
  Cassandra.Client client = new Cassandra.Client(protocol);\n```\n\n这里的 `7011` 是 SSL\
  \ 端口。其余部分与 Cassandra-cli 连接方式类似。使用基于 SSL 配置的传输参数（例如，配置信任库路径、密码和 SSL 传输工厂）打开客户端套接字。\n\
  \n以上就是我们如何通过命令行客户端和基于 Java 的 Thrift 客户端连接到 Cassandra 服务器的方法。\n\n## 总结\n\n总而言之，本章讨论的主题如下：\n\
  \n- 通过超级用户和非超级用户管理用户角色和权限\n- 为客户端-服务器通信和节点间通信准备 SSL 加密证书\n- 通过各种客户端连接到安全的 Cassandra\
  \ 服务器。\n\n至此，我们结束了关于 Cassandra 数据安全与用户管理的讨论。\n\n下一章将更深入地探讨大数据分析，我们将讨论如何使用 Hadoop\
  \ 的 MapReduce 算法进行批处理，以及如何将 Cassandra 文件系统同时用作输入和输出来在 Cassandra 上运行 MapReduce 程序！\n\
  \n"
- "# 5. 基于 Cassandra 的 MapReduce\n\n那么，在讨论了数据建模、安全性和用户角色权限管理之后，下一步是什么？借助 Cassandra\
  \ 查询语言（CQL），我们确实可以通过主键和二级索引来管理基本的基于查询的分析，并尽可能地保持数据模型的非规范化。但是，我们仍然可以对非常大的数据块执行分析（类似于连接操作），或者在统计特定字段（例如，统计特定用户账户在给定日期范围内的推文数量）后将数据持久化到\
  \ Cassandra 中。显然，这属于大数据分析，更具体地说是批处理分析。\n\n在本章中，我们将：\n\n- 介绍 MapReduce\n- 探索 Hadoop\n\
  - 讨论 HDFS 和 MapReduce\n- 描述 Cassandra 与 MapReduce 的集成\n\n## 批处理与 MapReduce\n\n任何形式的数据，无论是结构化的还是非结构化的，如果不经过处理都将毫无意义。到目前为止，我们已经讨论了管理和建模\
  \ Cassandra 中数据量的各种方法。\n\n那么，对这些归档的大型数据集进行分析又如何呢？大数据分析可以分为两大类：\n\n- 批处理\n- 流处理\n\
  \n通俗地说，批处理就是执行一个或多个作业。这些作业被预先编程，以尽量减少人工干预。所需的输入/输出参数和资源是预先配置好的。批处理机制的历史可以追溯到穿孔卡片和大型机计算时代。\n\
  \n我们以一个卫星频道应用为例，它多年来一直在归档日志。每年年底（或每半年），提供商都想知道，在黄金时段，特定年龄范围内的多少用户观看了特定节目。由于数据量巨大且完全是非结构化的，我们无法将其流式传输并放入内存来执行此类计算。这些数据在很大程度上可能互不相关，要对其进行批量处理，就需要预定义的步骤来进行并行处理。\n\
  \n对于大数据而言，批处理作业可以分为三个简单的步骤：\n\n- 提取，\n- 转换，\n- 和加载\n\n这个过程通常被称为 ETL。有各种 ETL 工具可用于数据仓库和分析，例如\
  \ Ab initio、CloverETL、Pentaho 和 Informatica。\n\nETL 系统的另一个方面是分析。想象一下，一个系统需要执行大数据分析，其中数据输入点来自不同的应用程序，并且系统需要生成一份整合的汇总报告。这就是数据从各种输入渠道提取出来，经过计算和转换，然后加载到数据库中的过程。图\
  \ 5-1 展示了一个示例，其中基于 ETL 的分析需要从社交媒体渠道、金融应用程序和服务器日志中提取数据。转换/计算在引擎端完成，最终输出被加载到数据库上。\n\
  \n![A978-1-4842-0142-8_5_Fig1_HTML.jpg](img/A978-1-4842-0142-8_5_Fig1_HTML.jpg)\n\
  \n图 5-1. 基于 ETL 的分析\n\n2008 年，Google 研究项目发表了一篇论文《MapReduce: Simplified Data Processing\
  \ on Large Clusters》，介绍了 MapReduce 范式，尽管它自 2003 年起就已被使用。（你可以从 [`http://static.googleusercontent.com/media/research.google.com/en//archive/mapreduce-osdi04.pdf`](http://static.googleusercontent.com/media/research.google.com/en//archive/mapreduce-osdi04.pdf)\
  \ 下载这份白皮书。）MapReduce 算法是一种分布式并行编程模型，由映射和归约函数组成，是解决需要对异构形式的海量数据进行分析的业务问题的一种方案。自 Google\
  \ 论文发表以来，已经构建了多种 MapReduce 实现。其中一种流行且开源的实现是 Apache Hadoop。\n\n## Apache Hadoop\n\
  \nApache Hadoop 是一个流行的开源库，用于大规模数据集的分布式计算。它是一个大规模的批处理基础设施，主要用于对分布在数百个节点上的数据进行批处理分析。\n\
  \n通过 MapReduce 作业，数据集被分成多个块，这样每个块都可以作为映射任务以协同方式进行独立处理，然后框架对输出进行排序并提供给归约任务。Hadoop\
  \ 框架自动管理任务调度和数据分发。\n\n显然，如此大量的数据无法在单个节点上管理，必须分布在多个节点上。这里明显有两个问题：\n\n- 数据分发\n- 协同数据处理\n\
  \n### HDFS\n\nHadoop 的数据分发由 Hadoop 分布式文件系统（HDFS）管理。HDFS 是 Apache Hadoop 项目的子模块之一。它专门设计用于在廉价的硬件上构建可扩展的系统。HDFS\
  \ 基于主/从架构，其中称为 NameNode 的单个进程在主节点上运行，并管理关于数据文件和跨节点集群复制的所有信息。\n\n有关 HDFS 架构的更多信息，请参考\
  \ [`http://hadoop.apache.org/docs/r1.2.1/hdfs_design.html`](http://hadoop.apache.org/docs/r1.2.1/hdfs_design.html)。\n\
  \n\n\n### MapReduce\n\n`MapReduce`的实现也解决了另一个问题：它是一个跨多个节点对大量数据进行并行处理的框架。\n\n`MapReduce`过程中执行的三个主要任务是：\n\
  \n- `Split`与`map`\n- `Shuffle`与`sort`\n- `Reduce`与`output`\n\n提交作业后，输入数据被分割成块，并作为并行的`map`任务分配给每个`mapper`。每个`mapper`生成一个独特的键值对作为输出，这些键值对会按键进行混洗和排序，然后作为输入提供给每个`reducer`。在数据节点上运行的每个`mapper`和`reducer`只操作本地数据（数据本地性）。另一个附加优势是，该框架完全解耦，并且可以对`mapper`、`reducer`、文件格式和记录读取进行自定义实现。\n\
  \n让我们借助一个著名的单词计数问题来简化理解。在这里，程序需要输出输入文件中每个单词出现的次数（见图 5-2）。\n\n![A978-1-4842-0142-8_5_Fig2_HTML.jpg](img/A978-1-4842-0142-8_5_Fig2_HTML.jpg)\n\
  \n图 5-2. MapReduce 在单词计数中的工作原理\n\n图 5-2 是对 Word 文件中给出的三行内容进行单词计数的 `MapReduce` 程序的图形表示。\n\
  \nWelcome to the Cassandra world Apress book Cassandra made easy Cassandra 2.0.8\
  \ out now\n\n在这里，每个`map`任务在数据所在的节点上本地运行。然后，数据由 Hadoop `MapReduce` 框架隐式地进行混洗和排序，最后交给`reduce`任务，经过归约过程后将结果输出到一个文件中。\n\
  \n为了在更底层理解它，您也可以参考图 5-3 中的伪代码表示。\n\n![A978-1-4842-0142-8_5_Fig3_HTML.jpg](img/A978-1-4842-0142-8_5_Fig3_HTML.jpg)\n\
  \n图 5-3. 单词计数 MapReduce 算法\n\n### 将推文读取并存储到 HDFS 中\n\n由于我们在本书中一直沿用基于 Twitter 的示例，那么让我们再次使用实时推文来演示\
  \ HDFS/MapReduce 的示例。从 HDFS 开始的原因是先熟悉在默认 HDFS 上运行 MapReduce，之后再解释如何在外部文件系统（例如 Cassandra\
  \ 文件系统）上执行它。在本节中，我们将讨论如何设置并抓取关于“apress”的推文。在我们的示例中，我们将流式读取一些关于“Apress 出版物”的推文，并将它们存储在\
  \ HDFS 上。此操作指南的目的是设置和配置 Hadoop 进程，并为“Cassandra MapReduce 集成”部分的下一个操作指南奠定基础。\n\n\
  #### 读取推文\n\n首先，让我们构建一个基于 Maven 的示例 Java 项目，以演示从 Twitter 读取推文。（关于使用 Maven 的更多细节，您也可以参考\
