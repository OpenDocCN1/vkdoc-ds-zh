  **图 2-18.** 存储字符串值时出错，但列值类型为 bytes


  由于 `comparator` 和 `validator` 被设置为默认数据类型（即 `BytesType`），`Cassandra-cli` 无法解析和存储此类请求。


  为了让第三步能够工作，我们需要使用 `assume` 函数来提供一些提示：


  ```

