  ### 压缩策略


  在 Cassandra 压力测试期间，我们观察到 Cassandra 的写入速度极快。其背后的原因是没有更新操作，所有列都被直接刷新到 SSTable 中。这意味着在某个时刻，可能会出现多个版本的列值，它们可能以多个
  SSTable 的形式存在。类似地，物理删除不会实时发生，但逻辑删除会立即执行。这样的行被称为墓碑行或过时行。在服务器端移除这些列并释放空间的过程称为压缩。


  压缩始终以后台异步模式运行。Cassandra 提供了两种类型的压缩策略：


  - 大小分层压缩策略

  - 分层压缩策略


  #### 大小分层压缩策略 (STCS)


  大小分层压缩策略 (STCS) 是默认的压缩策略。根据配置的 `min_compaction_threshold`（默认为 4），大小相似的 SSTable 将被合并并压缩到一个单一的表中。显然，对于写入量大而读取/更新少的场景，这是首选策略。尽管特定行键的所有数据将位于同一个数据节点上，但它们仍可能分散在多个
  SSTable 中。使用这种压缩策略，在压缩过程完成之前，极有可能对相同的列进行冗余压缩。对于频繁更新相同行键的情况，STCS 作为压缩策略可能会带来问题。


  #### 分层压缩策略 (LCS)


  分层压缩策略 (LCS) 的实现很大程度上借鉴了 Google 的 LevelDB（[`http://code.google.com/p/leveldb`](http://code.google.com/p/leveldb)）。LCS
  的目的是避免对行键的列进行冗余压缩。使用 LCS，每一层的 SSTable 永远不会重叠，并且保证了读取时不会丢失数据。每提升一层，压缩过程就会进行，并不断加入前几层的
  SSTable。这里需要有足够的空间来将最大的一层保留在内存中。与 STCS 相比，LCS 执行更多的 I/O 操作。


  你可以在创建表时定义分层压缩策略，如下所示：


  ```

  create table tweets(tweet_id text primary key,body text) with caching=''rows_only''
  and compaction

  =''LeveledCompactionStrategy'' and populate_io_cache_on_flush=''true'';  // 创建表

  ```


  如果读取比例与较高的写入比例相似，或者预期会有频繁更新，则建议使用 LCS。


  ## Yahoo 云服务基准测试


  Yahoo 云服务基准测试 (YCSB) 项目是评估各种云数据存储和键值数据存储的行业标准，它使用各种工作负载进行并行执行。该项目由 Yahoo 研究实验室于
  2010 年发布，托管在 [`https://github.com/brianfrankcooper/YCSB`](https://github.com/brianfrankcooper/YCSB)。


  YCSB 是完全解耦且可扩展的，可以添加任何新的特定于数据存储的客户端。


  配置和运行 YCSB 相当容易。在本节中，我们将讨论如何使用 Cassandra 配置 YCSB 框架。


  首先，你可以从源代码构建 jar 包，或者从以下位置下载 tarball：


  [`https://github.com/downloads/brianfrankcooper/YCSB/ycsb-0.1.4.tar.gz`](https://github.com/downloads/brianfrankcooper/YCSB/ycsb-0.1.4.tar.gz)


  解压 tarball 并更改目录：


  ```

  cd ycsb-0.1.4

  ```


  默认情况下，YCSB 会将数据插入到 `usertable` 键空间和名为 `data` 的表中。因此，在 `Cassandra-cli` 中运行以下命令来创建数据定义：


  ```

  create keyspace usertable;

  use usertable;

  create column family data;

  ```


  接下来，创建一个包含以下属性的属性文件（例如 `Cassandra-ycsb.properties`）：


  ```

  hosts=localhost

  port=9160

  fieldcount=4

  threads=9

  recordcount=1000

  operationcount=1000

  workload=com.yahoo.ycsb.workloads.CoreWorkload

  readallfields=true

  readproportion=0.5

  updateproportion=0.5

  scanproportion=0

  insertproportion=0

  ```


  这里，`hosts` 和 `port` 是 Cassandra Thrift 主机和 rpc_port 设置。`fieldcount` 是每行要存储的字段总数。`threads`
  决定了并行执行的数量。此外，`readproportion` 和 `updateproportion` 可以在测试期间进行调整。例如，对于仅需要大量写入的场景，你可以将
  `insertproportion` 设置为 1.0，其余设置为 0.0！类似地，对于高读取场景，可以将 `readproportion` 设置为 1.0。


  最后，运行以下命令：


  ```

  bin/ycsb load cassandra-10 -P /home/vivek/source/book_source/ycsb/casssandra-ycsb.properties
  -threads 10

  ```


  运行上述命令的输出将相当庞大。图 8-9 展示了从性能角度来看有趣的方面。


  ![A978-1-4842-0142-8_8_Fig9_HTML.jpg](img/A978-1-4842-0142-8_8_Fig9_HTML.jpg)


  图 8-9.


  使用 YCSB Cassandra 项目运行负载的输出


  在图 8-9 中，关键点是平均吞吐量和延迟。对于这次运行，每秒有 4291 次操作，在总共 1000 次操作中，延迟为 1545 微秒。


  YCSB 提供了一种从客户端角度评估数据库的好方法。你可以快速分析多个客户端针对 Cassandra 的性能。或者，你也可以用它来比较多个数据存储之间的性能。该框架是完全解耦的，这使得为新的数据存储添加客户端或为同一数据存储添加多个客户端变得相当容易。


  回到通过 YCSB 进行读取操作分析，我们可以这样运行：


  ```

  bin/ycsb run cassandra-10 -P /home/vivek/source/book_source/ycsb/casssandra-ycsb.properties
  -threads 10

  ```


  YCSB 有两种运行模式：`load` 和 `run`。使用 `load` 模式，它将数据存储到后端，并测量吞吐量和延迟。而使用 `run` 模式，我们可以将其调整为高读取或读取/更新比例（请参见
  `Cassandra-ycsb.properties`）。


  YCSB 附带两种分布类型：齐夫分布和均匀分布。连续均匀分布指的是每个区间内每列数据的对称分布。而齐夫分布基于幂律分布，其中负载和吞吐量成反比。关于齐夫分布的更多详细信息，请参考
  [`http://en.wikipedia.org/wiki/Zipf''s_law`](http://en.wikipedia.org/wiki/Zipf''s_law)。


  ## 总结


  在本章即将结束之际，这里有一些关键的性能检查点，当应用程序的吞吐量随时间持续下降时，可以进行这些检查：


  - 监控 GC 并检查 Cassandra 服务器日志中的 `GCInspector` 类。

  - 如果数据节点空间不足，请添加新节点。我们将在下一章进一步讨论这一点。

  - 监控 `bloom_filter_fp_chance` 和缓存配置。


  在下一章中，我们将进一步介绍 Cassandra 的管理和监控。



