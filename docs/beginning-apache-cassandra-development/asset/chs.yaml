  \ 。\n\n### 理解 Cassandra 配置\n\n主要的 Cassandra 配置文件是 `Cassandra.yaml`，它位于 `$CASSSANDRA_HOME/conf`\
  \ 文件夹中。大约有 100 个属性。表 1-1 包含了其中的一部分属性，这些属性对 Cassandra 初学者很有帮助，值得一提。\n\n表 1-1. 重要的\
  \ Cassandra 服务器属性\n\n\n\n| 属性 | 默认值 | 描述 |\n| --- | --- | --- |\n| `cluster_name`\
  \ | `\"Test cluster\"` | 用于限制节点仅加入一个逻辑集群。 |\n| `num_tokens` | 禁用，未指定 | 如果未指定，默认值为\
  \ 1。例如，若要在引导节点时启用虚拟节点支持，需设置 `num_tokens` 参数。推荐值为 256。 |\n| `initial_token` | 无 |\
  \ 为节点分配数据范围。在引导节点时，建议分配一个值。如果未指定，将由 Cassandra 随机分配一个令牌。对于随机分区方案，计算 `initial_token`\
  \ 的方式为：`i * (2**127 / N)` ，其中 `i = 0 .. N-1`。`N` 代表节点数量。 |\n| `hinted_handoff_enabled`\
  \ | True | 当一致性级别为 ANY 时，如果副本节点宕机，对应的写入请求将以提示（hint）的形式存储在协调节点的 `system.hints` 列族中。一旦副本节点开始接受写入请求，将用于重放变更对象。\
  \ |\n| `max_hint_window_in_ms` | 3 小时 | 死节点等待新提示写入协调节点的最长等待时间。提示窗口过期后，将不再存储新的提示。如果未指定，默认值为\
  \ 1 小时。此属性用于在协调节点上写入提示。如果某个特定副本节点的 gossip 协议端点宕机时间超过指定的最长等待时间，`StorageProxy` 服务将无法在协调节点上写入新提示。\
  \ |\n| `hinted_handoff_throttle_in_kb` | 1024 | 提示数据流的速率（kb/秒/线程）。 |\n| `max_hints_delivery_threads`\
  \ | 2 | 允许发送数据提示的最大线程数。在跨数据中心写入提示时很有用。 |\n| `populate_io_cache_on_flush` | False\
  \ | 如果节点上的完整数据可以放入内存，则设置为 true。自 Cassandra 1.2.2 起，也可以在每个列族上设置此参数。[`issues.apache.org/jira/browse/CASSANDRA-4694`](https://issues.apache.org/jira/browse/CASSANDRA-4694)。\
  \ |\n| `authenticator` | `AllowAllAuthenticator` | `IAuthenticator` 接口的实现。默认情况下，Cassandra\
  \ 提供 `AllowAllAuthenticator` 和 `PasswordAuthenticator` 作为内部身份验证实现。`PasswordAuthenticator`\
  \ 会根据存储在 `system_auth` 键空间中 `credentials` 和 `users` 列族中的数据验证用户名和密码。（Cassandra 的安全性将在第\
  \ 10 章中详细讨论。） |\n| `Authorizer` | `AllowAllAuthorizer` | `IAuthorizer` 接口的实现。该实现管理用户对键空间、列族、索引等的权限。在服务器启动时启用\
  \ `CassandraAuthorizer` 将在 `system_auth` 键空间中创建一个 `permissions` 表，用于存储用户权限。（Cassandra\
  \ 的安全性将在第 10 章中详细讨论。） |\n| `permissions_validity_in_ms` | 默认值为 2000。如果 authorizer\
  \ 属性为 `AllowAllAuthorizer` 则禁用 | 默认权限缓存的有效期。 |\n| `Partitioner` | `Murmur3Partitioner`\
  \ | 集群中节点间的行分布基于所选的分区器决定。可用值为 `RandomPartitioner`、`ByteOrderedPartitioner`、`Murmur3Partitioner`\
  \ 和 `OrderPreservingPartitioner`（已弃用）。 |\n| `data_file_directories` | `/var/lib/cassandra/data`\
  \ | 节点的物理数据位置。 |\n| `commitlog_directory` | `/var/lib/cassandra/commitlog` | 节点提交日志文件的物理位置。\
  \ |\n| `disk_failure_policy` | Stop | 可用值为 `stop`、`best_effort` 和 `ignore`。Stop\
  \ 将关闭与节点的所有通信（JMX 除外）。`best_effort` 仍会响应来自可用 sstable 的读取请求。 |\n| `key_cache_size_in_mb`\
  \ | 空，表示 100MB 或可用堆大小的 5%，取较小值 | 设置为零可禁用。 |\n| `saved_caches_directory` | `/var/lib/cassandra/saved_caches`\
  \ | 节点上已保存缓存的物理位置。 |\n| `key_cache_save_period` | 14400 | 键缓存保存持续时间（以秒为单位），保存在 `saved_caches_directory`\
  \ 下。 |\n| `key_cache_keys_to_save` | 已禁用。 | 默认情况下禁用。所有行键都将被缓存。 |\n| `row_cache_size_in_mb`\
  \ | 0（已禁用） | 内存中的行缓存大小。 |\n| `row_cache_save_period` | 0（已禁用） | 行缓存保存持续时间（以秒为单位），保存在\
  \ `saved_caches_directory` 下。 |\n| `row_cache_keys_to_save` | 已禁用。 | 默认情况下禁用。所有行键都将被缓存。\
  \ |\n| `row_cache_provider` | `SerializingCacheProvider` | 可用值为 `SerializingCacheProvider`\
  \ 和 `ConcurrentLinkedHashCacheProvider`。如果工作负载不是密集更新，建议使用 `SerializingCacheProvider`，因为它使用本地内存（而非\
  \ JVM）进行缓存。 |\n| `commitlog_sync` | Periodic | 可用值为 `periodic` 和 `batch`。在 batch\
  \ 同步模式下，直到写入与磁盘同步后才会确认写入操作。请参考 `commitlog_sync_batch_window_in_ms` 属性。 |\n| `commitlog_sync_batch_window_in_ms`\
  \ | 50 | 如果 `commitlog_sync` 为 batch 模式，Cassandra 仅在提交日志同步窗口过期且数据已通过 fsync 写入磁盘后才会确认写入操作。\
  \ |\n| `commitlog_sync_period_in_ms` | 10000 | 如果 `commitlog_sync` 为 periodic 模式。提交日志将在此时间间隔后通过\
  \ fsync 写入磁盘。 |\n| `commitlog_segment_size_in_mb` | 32 | 提交日志段大小。达到此限制后，Cassandra\
  \ 会将内存表（memtable）以 sstable 的形式刷新到磁盘。对于 32 位 JVM，应保持最小值，以避免耗尽地址空间并减少提交日志刷新。 |\n|\
  \ `seed_provider` | `SimpleSeedProvider` | `SeedProvider` 接口的实现。`SimpleSeedProvider`\
  \ 是默认实现，接受逗号分隔的地址列表。`-seeds` 参数的默认值为 `127.0.0.1`。如果多节点部署，请将其更改为多个节点地址。 |\n| `concurrent_reads`\
  \ | 32 | 如果工作负载数据无法放入内存，则需要从磁盘获取数据。设置此参数以执行并发读取的数量。 |\n| `concurrent_writes` | 32\
  \ | 通常写入速度比读取快。因此，与 `concurrent_reads` 相比，可以将此参数设置得更高。 |\n| `memtable_total_space_in_mb`\
  \ | JVM 堆的三分之一（已禁用） | 为内存表分配的总空间。一旦超过指定大小，Cassandra 将首先将最大的内存表刷新到磁盘。 |\n| `commitlog_total_space_in_mb`\
  \ | 32（32 位 JVM），1024（64 位 JVM） | 为提交日志段分配的总空间。达到指定限制后，Cassandra 会通过首先移除最旧的提交日志来刷新内存表以回收空间。\
  \ |\n| `storage_port` | 7000 | 节点间内部通信的 TCP 端口。 |\n| `ssl_storage_port` | 7001 |\
  \ 在启用 `client_encryption_options` 时使用。 |\n| `listen_address` | `Localhost` | 用于绑定并与其它\
  \ Cassandra 节点通信的地址。 |\n| `broadcast_address` | 已禁用（与 `listen_address` 相同） | 供其它\
  \ Cassandra 节点使用的广播地址。 |\n| `internode_authenticator` | `AllowAllInternodeAuthenticator`\
  \ | 用于节点间通信的 `IinternodeAuthenticator` 接口实现。 |\n| `start_native_transport` | False\
  \ | 客户端的 CQL 原生传输。 |\n| `native_transport_port` | 9042 | 用于连接客户端的 CQL 原生传输端口。 |\n\
  | `rpc_address` | Localhost | Thrift RPC 地址，供客户端连接。 |\n| `rpc_port` | 9160 | 供客户端通信的\
  \ Thrift RPC 端口。 |\n| `rpc_min_threads` | 16 | Thrift RPC 的最小线程数。 |\n| `rpc_max_threads`\
  \ | 2147483647（最大 32 位有符号整数） | Thrift RPC 的最大线程数。 |\n| `rpc_recv_buff_size_in_bytes`\
  \ | 已禁用 | 如果要设置 Thrift RPC 接收套接字缓冲区大小限制，请启用。 |\n| `rpc_send_buff_size_in_bytes`\
  \ | 已禁用 | 如果要设置 Thrift RPC 发送套接字缓冲区大小限制，请启用。 |\n| `incremental_backups` | False\
  \ | 如果启用，Cassandra 会将刷新后的 sstable 硬链接到 `data_file_directories/keyspace/backup` 目录下的备份目录。\
  \ |\n| `snapshot_before_compaction` | False | 如果启用，将在每次压缩前在 `data_file_directories/keyspace/snapshots`\
  \ 目录下创建快照。 |\n| `auto_snapshot` | True | 如果禁用，在对键空间执行 DML 操作（`truncate`、`drop`）时将不会创建快照。\
  \ |\n| `concurrent_compactors` | 等于处理器数量 | 等于 `cassandra.available_processors`（如果已定义），否则等于可用处理器数量。\
  \ |\n| `multithreaded_compaction` | False | 如果启用，将为每个处理器使用单线程进行压缩。 |\n| `compaction_throughput_mb_per_sec`\
  \ | 16 | 数据压缩流量（兆字节/秒）。更高的压缩吞吐量可确保更少的 sstable 和更多的磁盘空间。 |\n| `endpoint_snitch` |\
  \ `SimpleSnitch` | 一个非常重要的配置。Snitch 也可以称为信息提供者。用于将请求路由到集群中的副本节点。可用值为 `SimpleSnitch`、`PropertyFileSnitch`、`RackInferringSnitch`、`Ec2Snitch`\
  \ 和 `Ec2MultiRegionSnitch`。（我将在后续章节中介绍 snitch 配置。） |\n| `request_scheduler` | `NoScheduler`\
  \ | 客户端请求调度器。默认情况下不进行调度，但我们可以将其配置为 `RoundRobinScheduler` 或自定义实现。它将客户端 DML 请求排队，并在成功处理请求后最终释放。\
  \ |\n| `server_encryption_options` | None | 用于启用节点间通信的加密。可用值为 `all`、`none`、`dc`\
  \ 和 `rack`。 |\n| `client_encryption_options` | `false`（未启用） | 用于启用客户端/服务器通信。如果启用，必须指定\
  \ `ssl_storage_port`。因为它将用于客户端/服务器通信。 |\n| `internode_compression` | All | 用于压缩节点间通信的流量。可用值为：`all`、`dc`\
  \ 和 `none`。 |\n| `inter_dc_tcp_nodelay` | True | 设置为 `false` 将减少 TCP 协议上的拥塞，但会增加延迟。\
  \ |\n\n\n```markdown\n\n#### 提交日志归档\n\n要启用 Cassandra 的自动提交日志归档和恢复功能（自 1.1.1 版本起支持），需使用`commitlog_archiving.properties`文件。该文件配置了`archive_command`和`restore_command`属性。提交日志归档也称为预写日志（WAL）归档，用于时间点恢复。\n\
  \nCassandra 的实现类似于 PostgreSQL。PostgreSQL 是一种面向对象的关系数据库管理系统（OORDBMS），它提供`wal_level`设置，其中`minimum`为最低级别，其次是`archive`和`hot_standby`级别，以允许在恢复期间执行查询。有关\
  \ PostgreSQL 的更多详细信息，请参阅[`http://www.postgresql.org/`](http://www.postgresql.org/)。\n\
  \n##### archive_command\n\n启用`archive_command`以使用如下命令进行隐式提交日志归档：\n\n`archive_command=\
  \ /bin/ln %path /home/backup/%name`\n\n这里，`%path`是最后一个活动提交日志段的完全限定路径，`%name`是提交日志的名称。上述\
  \ shell 命令将为提交日志段（`%path`）创建一个硬链接。如果行突变大小超过`commitlog_segment_size_in_mb`，Cassandra\
  \ 会使用此`archive`命令将该段归档到`/home/backup/`目录下。其中`%path`是最新旧段的名称，`%name`是提交日志文件名。\n\n\
  ##### restore_command\n\n在启动 Cassandra 时，如果将`commitlog_archiving.properties`中的`restore_directories`留空，Cassandra\
  \ 将使用`restore_command`重放这些日志文件：\n\n`restore_command=cp -f %from %to`\n\n这里，`%from`是`restore_directories`指定的值，`%to`是`commitlog_directory`下的下一个提交日志段文件。\n\
  \n这种连续提交日志的一个优点是数据的高可用性，也称为热备份。\n\n### 配置复制和数据中心\n\n近年来，对大数据异构系统的需求已经演变。此类系统中的组件本质上是多样化的，可以由不同的数据集组成。考虑到数据量的大小、位置和数量，这些系统很可能需要与位于不同物理位置的数据中心互连。\n\
  \n数据中心是一个硬件系统（例如商品服务器），由多个机架组成。一个机架可能包含一个或多个节点（参见图 1-8）。\n\n![A978-1-4842-0142-8_1_Fig8_HTML.jpg](img/A978-1-4842-0142-8_1_Fig8_HTML.jpg)\n\
  \n图 1-8. 描绘 Cassandra 数据中心的图像\n\n维护多个数据中心的原因可以是高可用性、备用节点和数据恢复。\n\n在高可用性场景下，任何传入请求都必须以最低延迟得到服务。数据复制是一种在多个节点上保留相同数据冗余副本的机制。\n\
  \n如上所述，数据中心由多个机架组成，每个机架包含多个节点。为了实现高可用性和节点故障转移，数据复制策略至关重要。例如：\n\n*   本地读取（高可用性）\n\
  *   故障转移（节点故障）\n\n考虑到这些因素，我们应将数据复制到同一数据中心但不同机架的多个节点上。这将避免同一机架中节点的读写失败（例如在网络连接问题、电源故障等情况下）。\n\
  \n复制意味着在多个数据节点上保留数据的冗余副本，以实现高可用性和一致性。在使用 Cassandra 创建键空间时，我们可以配置复制因子和复制策略类。\n\n\
  在创建模式（而非键空间）时，我们可以像这样配置复制：\n\n```\nCREATE KEYSPACE apress WITH replication = {'class':\
  \ 'SimpleStrategy', 'replication_factor' : 3};\n```\n\n```\n// cql3 script\ncreate\
  \ keyspace apress with placement_strategy='org.apache.cassandra.locator.SimpleStrategy'\
  \ and strategy_options ={replication_factor:1};\n```\n\n```\n// using cassandra-cli\
  \ thrift\n```\n\n> **注意：** 通过 CQL3 和 `cassandra-cli` 进行模式创建和管理将在第 2 章中讨论。\n\n这里，`SimpleStrategy`是复制策略，其中`replication_factor`为\
  \ 3。像这样使用`SimpleStrategy`，每条数据行将在顺时针方向上的 3 个副本节点上同步或异步复制（取决于写入一致性级别）。\n\nCassandra\
  \ 支持的不同策略类有：\n\n*   `SimpleStrategy`\n*   `LocalStrategy`\n*   `NetworkTopologyStrategy`\n\
  \n#### LocalStrategy\n\n`LocalStrategy`用于内部目的，并用于`system`和`system_auth`键空间。`System`和`system_auth`是内部键空间，由\
  \ Cassandra 的存储架构隐式处理，用于管理授权和身份验证。这些键空间还保存有关用户定义的键空间和列族的元数据。在下一章中，我们将详细讨论它们。在 Cassandra\
  \ 中，尝试使用`LocalStrategy`作为策略类创建键空间是不允许的，并且会给出类似“`LocalStrategy`仅用于 Cassandra 内部目的”的错误。\n\
  \n#### NetworkTopologyStrategy\n\n如果多个副本节点需要放置在不同的数据中心，则首选`NetworkTopologyStrategy`。我们可以使用此策略创建键空间，如下所示：\n\
  \n```\nCREATE KEYSPACE apress WITH replication = {'class': 'NetworkTopologyStrategy',\
  \ 'dc1' : 2, 'dc2' : 3};\n```\n\n这里，`dc1`和`dc2`是数据中心名称，复制因子分别为 2 和 3。数据中心名称源自配置的`snitch`属性。\n\
  \n#### SimpleStrategy\n\n建议在单个数据中心内的多个机架上使用多个节点时采用此策略。\n\n```\nCREATE KEYSPACE apress\
  \ WITH replication = {'class': 'SimpleStrategy', 'replication_factor' : 3};\n```\n\
  \n这里，复制因子为 3 意味着将数据复制到 3 个节点上，而策略类`SimpleStrategy`意味着这些 Cassandra 节点位于同一个数据中心内。\n\
  \n### Cassandra 多节点配置\n\n在本节中，我们将讨论在单台机器上以及通过 Amazon EC2 实例进行的多节点 Cassandra 配置。选择\
  \ AWS EC2 实例的原因包括在云上设置 Cassandra 集群，以及在本地机器上配置 Cassandra 集群以模拟物理机柜。基于 AWS 的配置将帮助用户了解\
  \ AWS 和 Cassandra。\n\n```\n\n\n#### 在单机上配置多个节点\n\n在单机上配置多个节点更像是一种实验，因为在生产应用中，你通常会在多个\
  \ Cassandra 节点上配置集群。在单机或多机上搭建多节点集群的过程是相似的，这正是我们将在本示例练习中介绍的内容。在此示例中，我们将在一台机器上配置 3\
  \ 个节点（`127.0.0.2-4`）。\n\n我们需要将主机名映射到 IP 地址。在 Windows 和 Linux 操作系统中，这些配置位于 `etc/hosts`（Windows）或\
  \ `/etc/hosts`（Linux）文件中。修改配置文件，添加上面提到的 3 个节点配置，如下所示：\n\n```\n127.0.0.1   127.0.0.2\n\
  127.0.0.1   127.0.0.3\n127.0.0.1   127.0.0.4\n```\n\n对于 Mac OS，我们需要创建如下别名：\n\n```\n\
  sudo ifconfig lo0 alias 127.0.0.2 up\nsudo ifconfig lo0 alias 127.0.0.3 up\nsudo\
  \ ifconfig lo0 alias 127.0.0.4 up\n```\n\n将下载的 Cassandra tarball 安装包解压到 3 个不同的文件夹中（每个节点一个）。为每个节点分配相同的\
  \ `cluster_name`，如下所示：\n\n```\n# 集群的名称。这主要用于防止一个逻辑集群中的机器加入另一个集群。\ncluster_name:\
  \ 'Test Cluster'\n```\n\n我们应让集群中每个节点持有相同的种子节点（seeds）。这些种子节点仅用于在集群节点间启动 gossip 协议。在\
  \ `cassandra.yaml` 中配置种子节点，如下所示：\n\n```\nseed_provider:\n    # 被视为联系点的主机地址。\n  \
  \  # Cassandra 节点使用此主机列表来相互查找并学习环的拓扑。\n    # 如果你正在运行多个节点，则必须更改此项！\n    - class_name:\
  \ org.apache.cassandra.locator.SimpleSeedProvider\n      parameters:\n         \
  \ # seeds 实际上是一个以逗号分隔的地址列表。\n          # 例如: \"<ip1>,<ip2>,<ip3>\"\n          -\
  \ seeds: \"127.0.0.2\"\n```\n\n在每个 `cassandra.yaml` 文件中，将 `listen_address` 和 `rpc_address`\
  \ 配置更改为 `127.0.0.2`、`127.0.0.3` 和 `127.0.0.4` IP 地址。由于所有 3 个节点都运行在同一台机器上，请分别将 `rpc_address`\
  \ 更改为 `9160`、`9161` 和 `9162`。\n\n这里我们可以选择每个节点使用一个 token 或每个节点使用多个 token。Cassandra\
  \ 1.2 引入了 **虚拟节点** 功能，允许为节点分配一个 token 范围。我们将在下一章讨论虚拟节点。将 `initial_token` 改为 `empty`，并将\
  \ `num_tokens` 保留为 2（建议为 256）。\n\n下一步是为每个节点分配不同的 `JMX_PORT`（例如 `8081`、`8082` 和 `8083`）。\n\
  \n在 Linux 系统中，修改 `$CASSANDRA_HOME/conf/cassandra.env.sh` 文件，如下所示：\n\n```\n# 指定 Cassandra\
  \ 用于\n# JMX 连接的默认端口。\nJMX_PORT=\"7199\"\n```\n\n在 Windows 系统中，修改 `$CASSANDRA_HOME/bin/cassandra.bat`\
  \ 文件，如下所示：\n\n```\nREM ***** JAVA options *****\nset JAVA_OPTS=-ea^\n    -javaagent:\"\
