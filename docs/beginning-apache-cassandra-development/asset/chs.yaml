  #### Hive 与 Cassandra 的集成


  借助外部表支持，通过使用 Cassandra 专用的 `storageHandler` 实现，可以在 Hive 中对 Cassandra 进行数据分析。DataStax
  ([www.datastax.com](http://www.datastax.com/)) 提供诸如 DataStax Enterprise (DSE) 等商业产品，这些产品能够与
  Hive 等工具实现无缝集成。我们将在本章稍后的“Apache Sqoop”部分中，进一步探讨 DSE 提供的功能。


  在本节中，我们将讨论开源 Apache Cassandra 与 Hive 的集成。一个开源的实现方案是 Cassandra 专用的存储处理器，可在 [`github.com/tuplejump/cash`](https://github.com/tuplejump/cash)
  获取。你可以通过 `git clone` 或下载 zip 源码包并在本地构建以生成 jars 包。或者，你也可以在 `jars` 文件夹中找到作为源码附件的这些
  jars 包。


  在我们的示例中，我们将在 Cassandra 中创建一个表，并在 Hive 上创建外部表，以探索通过 Cassandra 和 Hive 插入的数据。


  首先，我们创建一个 `twitter` 键空间和 `twitterdata` 表：


  ```

  create keyspace twitter with replication={''class'':''SimpleStrategy'',''replication_factor'':2};

  ```


  ```

  use twitter;

  ```


  ```

  create table twitterdata(tweet_id timeuuid primary key, body text, tweeted_by text);

  ```


  让我们使用 `insert` 命令插入几条记录：


  ```

  insert into twitterdata(tweet_id,body,tweeted_by) values(now(),''my first tweet'',''@mevivs'');

  ```


  ```

  insert into twitterdata(tweet_id,body,tweeted_by) values(now(),''Cassandra book:beginning
  cassandra development'',''@apress_team'');

  ```


  ```

  insert into twitterdata(tweet_id,body,tweeted_by) values(now(),''Technical review
  position available for #Parse and #Phonegap related @Apress titles: paid'',''@apress_team'');

  ```


  ```

  insert into twitterdata(tweet_id,body,tweeted_by) values(now(),''Android Apps Security
  http://t.co/5XLSObkk9f'',''@jhassel'');

  ```


  接下来，我们通过配置 Cassandra 存储处理器、Thrift 以及 Cassandra 专用的 jars 包来连接到 Hive shell：


  ```

  /home/vivek/software/hive-0.9.0/bin/hive --auxpath /home/vivek/source/cash/cassandra-handler/target/hive-cassandra-1.2.9.jar:/home/vivek/.m2/repository/org/apache/cassandra/cassandra-all/1.2.9/cassandra-all-1.2.9.jar:/home/vivek/software/apache-cassandra-2.0.4/lib/libthrift-0.9.1.jar:/home/vivek/.m2/repository/org/apache/cassandra/cassandra-thrift/1.2.9/cassandra-thrift-1.2.9.jar

  ```


  成功连接到 Hive shell 后，我们可以按如下方式创建外部表：


  ```

  CREATE EXTERNAL TABLE twitter.twitterdata(tweet_id string, body string, tweeted_by
  string) STORED BY ''org.apache.hadoop.hive.cassandra.cql.CqlStorageHandler'' WITH
  SERDEPROPERTIES ("cql.primarykey" = "message_id, author", "comment"="check", "read_repair_chance"
  = "0.2", "dclocal_read_repair_chance" = "0.14", "gc_grace_seconds" = "989898", "bloom_filter_fp_chance"
  = "0.2", "compaction" = "{''class'' : ''LeveledCompactionStrategy''}", "replicate_on_write"
  = "false", "caching" = "all");

  ```


  请注意，Cassandra 存储处理器项目目前尚不支持 Hive 管理的 Cassandra 表。尝试以下方式创建一个 Hive 管理的表：


  ```

  CREATE TABLE twitter.twitterdata_hive(tweet_id string, body string, tweeted_by string)
  STORED BY ''org.apache.hadoop.hive.cassandra.cql.CqlStorageHandler'' WITH SERDEPROPERTIES
  ("cql.primarykey" = "message_id, author", "comment"="check", "read_repair_chance"
  = "0.2", "dclocal_read_repair_chance" = "0.14", "gc_grace_seconds" = "989898", "bloom_filter_fp_chance"
  = "0.2", "compaction" = "{''class'' : ''LeveledCompactionStrategy''}", "replicate_on_write"
  = "false", "caching" = "all");

  ```


