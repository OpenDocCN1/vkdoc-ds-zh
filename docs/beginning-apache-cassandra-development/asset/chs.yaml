  ### 组合列上的二级索引


  从 Cassandra 2.x 开始，Cassandra 允许在聚类键上创建二级索引，这使得用户可以使用 EQ 运算符运行查询。在 2.x 之前，只有当 `where`
  子句中存在前一个聚类键部分时，才能在 `where` 子句中包含剩余的聚类键。


  让我们使用在“组合列”部分讨论过的同一个 Twitter 示例。


  首先，创建一个键空间 `twitter` 和列族 `users`：


  ```

  create keyspace twitter with replication = {''class'':''SimpleStrategy'',''replication_factor'':1};

  ```


  ```

  use twitter;

  ```


  ```

  create table users(user_id text,followers set<text>, tweet_date timestamp, tweet_body
  text, first_name text, PRIMARY KEY(user_id,tweet_date, first_name));

  ```


  让我们为 `user_id` 为 `imvivek` 的 `users` 列族存储几列数据：


  ```

  // 为 ''imvivek'' 插入记录

  insert into users(user_id,tweet_date,tweet_body,first_name) values(''imvivek'',''2013-12-31'',''good
  bye 2013'',''vivek'');

  insert into users(user_id,tweet_date,tweet_body,first_name) values(''imvivek'',''2014-01-01'',''welcome
  2014'',''vivek'');

