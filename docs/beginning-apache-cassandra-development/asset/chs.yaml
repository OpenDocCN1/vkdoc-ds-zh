  \ 下。\n\n数据复制完成后，您可以通过 Web 管理界面（`localhost:50070`）点击“浏览文件系统”进行验证，如图 5-5 所示。您将看到数据已通过\
  \ Hadoop Web UI 控制台可用。\n\n![A978-1-4842-0142-8_5_Fig5_HTML.jpg](img/A978-1-4842-0142-8_5_Fig5_HTML.jpg)\n\
  \n图 5-5. Hadoop Web UI 管理控制台\n\n或者，您也可以运行以下命令来验证存储的推文文件：\n`$HADOOP_HOME/bin/hadoop\
  \ fs –lsr /apress/tweetdata`\n\n仅在此示例练习中，我们先将直播推文流存储到本地文件系统。对于实时推文流，您可能希望使用 Flume\
  \ 或 Scribe 将直播推文流直接存储到 HDFS 中。请参考 [`https://cwiki.apache.org/FLUME/`](https://cwiki.apache.org/FLUME/)\
  \ 或 [`https://github.com/facebook/scribe`](https://github.com/facebook/scribe)。\n\
  \n有关安装和设置的更多信息，请参考 [`http://hadoop.apache.org/docs/stable/single_node_setup.html`](http://hadoop.apache.org/docs/stable/single_node_setup.html)。\n\
  \n在本示例中，我们讨论了如何将直播推文存储到 HDFS。在下一节中，我们将探讨如何编写一个 MapReduce 程序，将特定用户和日期的推文计数存储到 Cassandra\
  \ 列族中。\n\n### Cassandra MapReduce 集成\n\n在本节中，我们将从 HDFS 读取推文（参见上文），并讨论一个 MapReduce\
  \ 程序来执行推文统计。最终，归约后的输出将存储在 Cassandra 的 `tweetcount` 列族中。我们将通过两个案例来讨论基于 Cassandra\
  \ 的 MapReduce 集成：\n\n*   从 HDFS 读取推文，并将推文计数存储到 Cassandra 中。\n*   从 Cassandra 读取推文，并将推文计数存储到\
  \ Cassandra 中。\n\n在本示例中，我们将使用 Thrift 协议来创建 Cassandra 模式。作为一个开源 API，MapReduce 集成可通过\
  \ Thrift 协议使用。示例练习将演示如何在 CQL3 方式下实现与 Cassandra 的 MapReduce 集成。\n\n#### 从 HDFS 读取推文并将计数结果存储到\
  \ Cassandra\n\n在本节中，我们将读取之前存储在 HDFS 目录 `/apress/tweetdata` 中的推文文件（参见上一节），并将每个用户和每天的推文计数存储到\
  \ Cassandra 中。Cassandra 为 Thrift 和 CQL3 都提供了 MapReduce 支持。我们将从 Thrift 开始，探讨这两种协议。\n\
  ```\n\n\n\n#### Thrift 方法\n\n我们仍使用相同的 Twitter 示例进行探索，其中用户及其推文应存储在本地，并按 `tweet_date`\
  \ 排序。\n\n首先，需要准备数据定义。让我们使用 Cassandra-cli 创建一个列族 `tweetcount`：\n\n```sql\n// 创建 keyspace。\n\
  Create keyspace tweet_keyspace;\nuse tweet_keyspace;\n\n// 创建列族 tweetcount。\ncreate\
  \ column family tweetcount with comparator='UTF8Type' and key_validation_class =\
  \ 'UTF8Type' and column_metadata=[{column_name:'count', validation_class:'Int32Type'}];\n\
  ```\n\n接下来创建一个 MapReduce 作业。我们需要创建一个 Hadoop 配置实例，并配置 NameNode 主机和端口：\n\n```java\n\
  Configuration conf = new Configuration();\nconf.set(\"fs.default.name\",\"hdfs://localhost:9000\"\
  );   // 请根据您的 Hadoop 配置修改此项。\nconf.set(\"mapred.child.java.opts\", \"-Xms1024m -Xmx2g\
  \ -XX:+UseSerialGC\");\nconf.set(\"mapred.job.map.memory.mb\", \"4096\");\nconf.set(\"\
  mapred.job.reduce.memory.mb\", \"2048\");\nconf.set(\"mapreduce.map.ulimit\",\"\
  1048576\");\nconf.set(\"mapred.job.reduce.physical.mb\", \"2048\");\nconf.set(\"\
  mapred.job.map.physical.mb\", \"2048\");\n```\n\n> **注意：** 如果您在远程机器上运行，可能需要修改 `fs.default.name`。\n\
  \n现在，让我们为 Mapper 和 Reducer 配置 MapReduce 作业：\n\n```java\n//Mapper 配置\njob.setMapperClass(TweetTokenizer.class);\n\
  job.setMapOutputKeyClass(Text.class);\njob.setMapOutputValueClass(IntWritable.class);\n\
  \n// Reducer 配置\njob.setReducerClass(TweetAggregator.class);\njob.setOutputKeyClass(ByteBuffer.class);\n\
  job.setOutputValueClass(List.class);\njob.setOutputFormatClass(ColumnFamilyOutputFormat.class);\n\
  ```\n\n接着，我们需要为输出映射提供 Cassandra 特定的配置：\n\n```java\nConfigHelper.setOutputRpcPort(job.getConfiguration(),\
  \ \"9160\");\nConfigHelper.setOutputInitialAddress(job.getConfiguration(), \"localhost\"\
  );\nConfigHelper.setOutputPartitioner(job.getConfiguration(), \"Murmur3Partitioner\"\
  );\nConfigHelper.setOutputColumnFamily(job.getConfiguration(), KEYSPACE_NAME, COLUMN_FAMILY);\n\
  ```\n\n> **注意：** 如果您不是在 localhost 上运行，也可以修改 rpc 端口和初始地址。\n\n最后，我们需要提供输入和输出路径：\n\n\
  ```java\nFileInputFormat.addInputPath(job, new Path(otherArgs[0]));\njob.setOutputFormatClass(ColumnFamilyOutputFormat.class);\n\
  ```\n\n这里的 `otherArgs[0]` 是 HDFS 推文文件的输入路径（例如 `/apress/tweetdata`）。\n\n让我们看一下 Mapper：\n\
  \n```java\npublic class TweetMapper\n{\n  public static class TweetTokenizer extends\
  \ Mapper<LongWritable, Text, Text, IntWritable>\n  {\n    private final static IntWritable\
  \ one = new IntWritable(1);\n    /* (non-Javadoc)\n     * @see org.apache.hadoop.mapreduce.Mapper#map(KEYIN,\
  \ VALUEIN, org.apache.hadoop.mapreduce.       Mapper.Context)\n     */\n    public\
  \ void map(LongWritable key, Text value, Context context)\n      throws IOException,\
  \ InterruptedException\n    {\n      // 分割成 token，并将日期和计数作为键传递。\n      String[]\
  \ values = StringUtils.split(value.toString(), \"\\001\");\n      if(values.length\
  \ >=2 && values.length <=3)\n      {\n        context.write(new Text(values[0]),\
  \ one);  // 按日期计数。\n        context.write(new Text(values[1]), one);  // 按用户计数。\n\
  \      }\n    }\n  }\n}\n```\n\n现在，让我们看一下 Reducer：\n\n```java\npublic static class\
  \ TweetAggregator extends  org.apache.hadoop.mapreduce.Reducer<Text, IntWritable,\
  \ ByteBuffer, List<Mutation>>\n{\n  public void reduce(Text word, Iterable<IntWritable>\
  \ values, Context context) throws IOException,\n    InterruptedException\n  {\n\
  \    int sum = 0;\n    for (IntWritable val : values)\n      sum += val.get();\n\
  \    context.write(ByteBufferUtil.bytes(word.toString()), Collections.singletonList(getMutation(word,\
  \ sum)));\n  }\n\n  private static Mutation getMutation(Text word, int sum)\n  {\n\
  \    Column c = new Column();\n    c.setName(ByteBufferUtil.bytes(\"count\"));\n\
  \    c.setValue(ByteBufferUtil.bytes(sum));\n    c.setTimestamp(System.currentTimeMillis());\n\
  \    Mutation m = new Mutation();\n    m.setColumn_or_supercolumn(new ColumnOrSuperColumn());\n\
  \    m.column_or_supercolumn.setColumn(c);\n    return m;\n  }\n}\n```\n\n此 MapReduce\
  \ 作业的完整源代码可在本书的下载文件中找到。可执行类是 `TwitterHDFSJob`（位于 `com.apress.chapter5.mapreduce.twittercount.hdfs`\
  \ 包中）。您也可以参考 `README.txt` 文件（位于 `src/main/resources` 下），以获取有关设置数据库和运行此 MapReduce\
  \ 作业的更多说明。\n\n成功执行作业后，列族中的输出将如下所示：\n\n```sql\n[default@tweet_keyspace] list tweetcount;\n\
  Using default limit of 100\nUsing default cell limit of 100\n-------------------\n\
  RowKey: Mon May 11 06:16:04 IST 2009\n=> (name=count, value=334, timestamp=1407569960904)\n\
  -------------------\nRowKey: Hazem Saleh\n=> (name=count, value=334, timestamp=1407569960798)\n\
  -------------------\nRowKey: cessprin\n=> (name=count, value=334, timestamp=1407569960990)\n\
  -------------------\nRowKey: Thu Feb 23 00:24:16 IST 2012\n=> (name=count, value=334,\
  \ timestamp=1407569960966)\n-------------------\nRowKey: Hunter Scott\n=> (name=count,\
  \ value=334, timestamp=1407569960803)\n22 Rows Returned.\n```\n\n存储的 `tweetcount`\
  \ 的示例输出共包含 22 行。行键是推文日期或用户名，并包含一个名为 `count` 的列及其值。\n\n\n\n#### CQL3 方式\n\n在前面的章节中，我们讨论了\
  \ CQL3 与 Thrift 之间的差异及互操作性问题。Cassandra 为 MapReduce 提供了对 CQL 兼容的输入和输出格式类的支持。请注意，这些实现仍然基于\
  \ Thrift，而非原生的 CQL3 驱动程序。在本示例中，我们将使用 `CqlOutputFormat` 来写入 CQL3 列族。我们知道通过 CQL3 创建的列族在\
  \ Thrift 中是不可见的，因此让我们探讨如何对 CQL3 表/列族运行 MapReduce。使用 CQL3 运行前述 MapReduce 程序所需的更改很小。我们需要以\
  \ CQL3 格式定义表，并修改 Hadoop 作业配置以指向基于 CQL3 的输出格式。下面我们来讨论这些更改：\n\n首先，你需要创建表 `tweetcount`：\n\
  \n```\ncreate table tweetcount_cql (key text primary key, count int);\n```\n\n在\
  \ Hadoop 作业级别需要进行的更改如下：\n\n```\n// 设置更新 CQL 和行键\njob.getConfiguration().set(\"row_key\"\
  , \"key\");\n\nString query = \"UPDATE \" + KEYSPACE_NAME + \".\" + COLUMN_FAMILY\
  \ + \" SET count = ? \";\nCqlConfigHelper.setOutputCql(job.getConfiguration(), query);\n\
  \n// 设置 CQL 输出格式类\njob.setOutputFormatClass(CqlOutputFormat.class);\n```\n\n基于 CQL3\
  \ 的聚合器如下：\n\n```\npublic static class TweetCQLAggregator extends org.apache.hadoop.mapreduce.Reducer<Text,\
  \ IntWritable, Map<String,ByteBuffer>, List<ByteBuffer>>\n{\n    private static\
  \ Map<String,ByteBuffer> keys = new HashMap<>();\n\n    /* (non-Javadoc)\n     *\
  \ @see org.apache.hadoop.mapreduce.Reducer#reduce(KEYIN, java.lang.Iterable,org.apache.hadoop.mapreduce.Reducer.Context)\n\
  \     */\n    public void reduce(Text word, Iterable<IntWritable> values, Context\
  \ context) throws IOException,\n        InterruptedException\n    {\n        int\
  \ sum = 0;\n        for (IntWritable val : values)\n            sum += val.get();\n\
  \        System.out.println(\"writing\");\n        keys.put(\"key\", ByteBufferUtil.bytes(word.toString()));\n\
  \        context.write(keys, getBindVariables(word, sum));\n    }\n\n    private\
  \ List<ByteBuffer> getBindVariables(Text word, int sum)\n    {\n        List<ByteBuffer>\
  \ variables = new ArrayList<ByteBuffer>();\n        variables.add(Int32Type.instance.decompose(sum));\n\
  \        return variables;\n    }\n}\n```\n\n最后，在运行 HDFS 作业（参见 `TwitterHDFSCQLJob`，输出后的源代码参考）后，我们可以使用\
  \ `cqlsh` 客户端查看输出：\n\n```\nselect * from tweetcount_cql;\n```\n\n```\n key     \
  \                     | count\n------------------------------+-------\n Mon May\
  \ 11 06:16:04 IST 2009 |   334\n Hazem Saleh                  |   334\n cessprin\
  \                     |   334\n Thu Feb 23 00:24:16 IST 2012 |   334\n Hunter Scott\
  \                 |   334\n Tue Sep 29 22:01:16 IST 2009 |   334\n Elena Vielva\
  \ Gómez           |   334\n Sun Dec 18 20:13:39 IST 2011 |   334\n Alejandro ||\
  \ Serras          |   334\n Tue Jul 06 18:01:47 IST 2010 |   334\n Wed Mar 07 05:11:11\
  \ IST 2012 |   334\n Wed Nov 07 14:04:18 IST 2012 |   334\n Oseias Moraes      \
  \          |   334\n Adeesh Fulay                 |   334\n Sat Nov 05 21:29:20\
  \ IST 2011 |   334\n Sun Jul 24 21:44:17 IST 2011 |   334\n Manthita.          \
  \          |   334\n ebooksdealofdaybot           |   334\n Wed Apr 23 19:19:49\
  \ IST 2014 |   334\n The News Selector            |  6680\n Louise Corrigan    \
  \          |   334\n Mon Mar 03 01:19:17 IST 2014 |  6680\n22 Rows Returned.\n```\n\
