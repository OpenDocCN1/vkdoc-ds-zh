  服务器版运行在 Web 服务器上，可以通过 Web 浏览器远程访问。RStudio 桌面版适用于 Microsoft Windows、macOS 和 Linux。有关
  RStudio 及其支持的更多信息，请参阅 RStudio 网站：[`www.rstudio.com/products/RStudio/#Desktop`](http://www.rstudio.com/products/RStudio/#Desktop)。


