  ### 4.3.3 众数


  众数是数据集中出现次数最多的数据点。例如，在我们关于工人年龄的数据集中，57 出现的次数最多（即三次）。因此，57 是工人年龄数据集的众数。这揭示了数据中的重复模式。


  R 语言中没有内置函数可以直接计算众数。因此，我们编写了一个函数并计算了众数，如图 4-12 所示。我们使用了之前相同的数据集（即`WorkAge`）。


  ![A978-1-4842-2514-1_4_Fig12_HTML.jpg](img/A978-1-4842-2514-1_4_Fig12_HTML.jpg)


  **图 4-12.** 使用 R 语言创建的函数计算众数


  在上述函数中，`unique()` 从数据集中创建一组唯一值。在 `WorkAge` 示例中，唯一值分别为：18、20、50、55、56、57、58、47、36、54、37、49、51
  和 22。`match()` 函数将数据集中的值与得到的唯一值集合进行匹配，并提供每个唯一值在原始数据集中的位置。`tabulate()` 函数返回每个唯一值在数据集中出现的次数。`which.max()`
  函数返回唯一值集合中重复次数最多的数值的位置。


  ### 4.3.4 极差


  极差是一个简单但重要的统计参数。它描述了按升序或降序排列的数据集端点之间的距离（即数据集中最大值与最小值之间的差值）。这提供了衡量数据集整体离散程度的指标。


  R 语言命令 `range(dataset)` 可返回最小值和最大值（见图 4-13），示例仍沿用之前的数据集（即`WorkAge`）。


  ![A978-1-4842-2514-1_4_Fig13_HTML.jpg](img/A978-1-4842-2514-1_4_Fig13_HTML.jpg)


  **图 4-13.** 如何使用 R 语言计算极差


  最大值与最小值之间的差值即为极差。




  ### 4.3.5 分位数


  “分位数”也称为“百分位数”。分位数将按升序或降序排列的数据集划分为相等的部分。**“中位数”** 本质上就是将按升序或降序排列的数据划分为两个元素数量相等的集合的那个数据点。因此，它也被称为第
  50 个百分位数。另一方面，**“四分位数”** 将按升序排列的数据集划分为四个数据元素数量相等的集合。第一个四分位数（也称为 `Q1` 或第 25 个百分位数）将拥有其下方的
  25% 的数据元素和其上方的 75% 的数据元素。第二个四分位数（也称为 `Q2` 或第 50 个百分位数或中位数）将拥有其下方的 50% 的数据元素和其上方的
  50% 的数据元素。第三个四分位数（也称为 `Q3` 或第 75 个百分位数）拥有其下方的 75% 的数据元素和其上方的 25% 的数据元素。**“分位数”**
  是一个通用词，而 **“四分位数”** 特指某个特定的百分位数。例如，`Q1` 就是第 25 个百分位数。第四个四分位数本质上就是第 100 个百分位数。


  分位数、四分位数或百分位数提供了均值无法提供给我们的信息。换句话说，分位数、四分位数或百分位数除了均值之外，还为我们提供了关于数据集的额外信息。


