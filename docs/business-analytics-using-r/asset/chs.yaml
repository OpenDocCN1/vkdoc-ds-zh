  |

  | | 最近邻 | 简单且无需参数假设。在大型训练集上表现良好。 | 查找最近邻需要时间。当预测变量数量较多时，性能会下降。 |

  | | 随机森林 | 在小型和大型数据集上均表现良好。能够平衡偏差和方差，提供更好的性能。比其他高级模型（如非线性支持向量机）更容易构建。 | 如果某个变量是包含多个类别的分类变量，随机森林会偏向于具有多个类别的该变量。
  |


