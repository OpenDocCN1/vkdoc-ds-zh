  \n## 3.2 在 R 中使用控制结构\n\n与其他编程语言类似，R 支持控制结构，允许你控制执行的流程。控制结构使程序能够按照某种“逻辑”执行。然而，很多时候这些控制结构会拖慢系统速度。相反，在数据处理时（我们将在本章后面讨论）会使用其他内置函数。一些常用的控制结构如下：\n\
  \n*   `if` 和 `else`：测试一个条件\n*   `while`：当条件为真时执行循环\n*   `for`：循环固定次数\n*   `repeat`：无限循环执行（必须跳出循环才能退出）\n\
  *   `next`：跳过循环迭代的选项\n*   `break`：中断循环的执行\n\n### 3.2.1 if-else\n\n`if-else` 结构是任何编程语言（包括\
  \ R）中最常用的函数。此结构允许你测试一个为真或假的条件。例如，假设你正在分析一个数据集，并且需要根据一个条件（比如，一个人的年龄是否大于 65）绘制 x 对\
  \ y 的图形。在这种情况下，你可以使用 `if-else` 语句。`if-else` 的常见结构如下：\n\n```\nif (condition) {\n\
  \    ## 执行某些操作\n} else {\n    ## 不执行操作\n}\n```\n\n你可以拥有多个 `if-else` 语句。更多信息，请查阅\
  \ R 帮助页面。以下是 R 中 `if-else` 函数的演示：\n\n![A978-1-4842-2514-1_3_Figg_HTML.jpg](img/A978-1-4842-2514-1_3_Figg_HTML.jpg)\n\
  \n### 3.2.2 for 循环\n\n`for` 循环与其他编程结构类似。在数据分析过程中，`for` 循环主要用于访问数组或列表。例如，如果你要访问数组中的特定元素并执行数据操作，可以使用\
  \ `for` 循环。以下是 `for` 循环使用的一个示例：\n\n![A978-1-4842-2514-1_3_Figh_HTML.jpg](img/A978-1-4842-2514-1_3_Figh_HTML.jpg)\n\
  \n有时，`seq_along()` 函数会与 `for` 循环结合使用。`seq_along()` 函数会根据对象的长度生成一个整数。以下示例使用 `seq_along()`\
  \ 打印 `x` 的每个元素：\n\n![A978-1-4842-2514-1_3_Figi_HTML.jpg](img/A978-1-4842-2514-1_3_Figi_HTML.jpg)\n\
  \n### 3.2.3 while 循环\n\nR 的 `while` 循环包含一个条件和一个循环体。如果条件为真，控制权进入循环体。循环会持续执行直到条件为假；条件失败后循环退出。示例如下：\n\
  \n![A978-1-4842-2514-1_3_Figj_HTML.jpg](img/A978-1-4842-2514-1_3_Figj_HTML.jpg)\n\
  \n`repeat()` 和 `next()` 在统计或数据分析中不常用，但它们有其自身的应用场景。如果你有兴趣了解更多，可以查阅 R 帮助页面。\n\n###\
  \ 3.2.4 循环函数\n\n尽管 `for` 和 `while` 循环是很有用的编程工具，但使用花括号和结构化函数有时会显得繁琐，尤其是在处理大型数据集时。因此，R\
  \ 提供了某些以紧凑形式实现循环的函数，使数据分析更简单有效。R 支持以下函数，我们将从数据分析的角度来看待它们：\n\n*   `apply()`：对一个数组的一部分评估一个函数，并将结果返回到一个数组中\n\
  *   `lapply()`：在列表上循环，并对每个元素进行评估，或对每个元素应用该函数\n*   `sapply()`：`lapply()` 的一个用户友好型应用，返回一个向量、矩阵或数组\n\
  *   `tapply()`：通常用于数据集的一个子集\n\n这些函数用于操作和切片矩阵、数组、列表或数据框中的数据。这些函数按行或按列遍历整个数据集，并避免了循环结构。例如，可以调用这些函数执行以下操作：\n\
  \n*   计算某行或某列的均值、总和或执行任何其他操作\n*   转换或执行子集操作\n\n`apply()` 函数形式更简单，其代码可以非常少（实际上，可以是一行），同时有助于执行高效的操作。其他更复杂的形式包括\
  \ `lapply()`、`sapply()`、`vapply()`、`mapply()`、`rapply()` 和 `tapply()`。使用这些函数取决于数据的结构以及你需要帮助分析的结果格式。\n\
  \n为了理解循环函数的工作原理，你将查看 Cars 数据集，它是 R 库的一部分。该数据集包含汽车的速度和停止所需的距离。这些数据记录于 20 世纪 20 年代。这个数据框有两个变量：`speed`\
  \ 和 `dist`。两者都是数值型，总共包含 50 个观测值。\n\n\n\n#### 3.2.4.1 `apply()`\n\n使用`apply()`函数，可以对矩阵、数据框或列表的每一行或每一列执行操作，而无需编写循环。以下示例展示了如何使用`apply()`查找汽车数据的平均速度和平均距离：\n\
  \n![A978-1-4842-2514-1_3_Figk_HTML.jpg](img/A978-1-4842-2514-1_3_Figk_HTML.jpg)\n\
  \n`apply()`函数用于对`array[]`评估函数，通常用于对行或列的操作：\n\n```\n> str(apply)\nfunction (X, MARGIN,\
  \ FUN, ...)\n>\n```\n\n`apply()`函数接受以下参数：\n\n*   `X`：数组\n*   `MARGIN`：指示行或列的整数向量\n\
  *   `FUN`：要应用的函数名称\n\n在前面的示例中，我们计算了每行和每列的平均值。但函数可以是任何东西；它可以是`SUM`、平均值或您自己的函数。其概念是它循环遍历整个数组并以相同格式提供结果。此函数消除了所有繁琐的循环，并在一行中得出结果。\n\
  \n以下示例计算每行和每列的`quantile`度量：\n\n![A978-1-4842-2514-1_3_Figl_HTML.jpg](img/A978-1-4842-2514-1_3_Figl_HTML.jpg)\n\
  \n#### 3.2.4.2 `lapply()`\n\n`lapply()`函数将结果输出为列表。`lapply()`可以应用于列表、数据框或向量。输出始终是一个列表，其元素数量与传递给`lapply()`的对象相同：\n\
  \n```\n> str(lapply)\nfunction (X, FUN, ...)\n>\n```\n\n它接受以下参数：\n\n*   `X`：数据集\n\
  *   `FUN`：函数\n\n以下示例演示了针对相同 Cars 数据集的`lapply()`函数。Cars 数据集是一个包含两个变量`dist`和`speed`的数据框；两者都是数值型。要查找`speed`和`dist`的平均值，您可以使用`lapply()`，输出是一个`list`：\n\
  \n```\n>\n> str(cars)\n'data.frame':   50 obs. of  2 variables:\n$ speed: num  4\
  \ 4 7 7 8 9 10 10 10 11 ...\n$ dist : num  2 10 4 22 16 10 18 26 34 17 ...\n> lap\
  \ <- lapply(cars, mean)\n> lap\n$speed\n[1] 15.4\n$dist\n[1] 42.98\n> str(lap)\n\
  List of 2\n$ speed: num 15.4\n$ dist : num 43\n>\n```\n\n#### 3.2.4.3 `sapply()`\n\
  \n`sapply()`和`lapply()`之间的主要区别在于输出结果。`sapply()`的结果可以是向量或矩阵，而`lapply()`的结果是列表。根据您正在进行的数据分析类型以及您需要的结果格式，您可以使用适当的函数。随着我们在后续章节中解决许多分析问题，您将看到在不同时间使用不同函数。以下示例演示了针对相同\
  \ Cars 数据集示例使用`sapply()`：\n\n```\n> sap <- sapply(cars, mean)\n> sap\nspeed  dist\n\
  15.40 42.98\n> str(sap)\nNamed num [1:2] 15.4 43\n- attr(*, \"names\")= chr [1:2]\
  \ \"speed\" \"dist\"\n```\n\n#### 3.2.4.4 `tapply()`\n\n`tapply()`用于向量的子集。函数`tapply()`与其他`apply()`函数类似，不同之处在于它应用于数据集的子集：\n\
  \n*   `...`包含要传递给`FUN`的其他参数\n*   `simplify`：`TRUE`或`FALSE`，用于简化结果\n\n*   `X`：向量\n\
  *   `INDEX`：因子或因子列表（或强制转换为因子）\n*   `FUN`：要应用的函数\n\n```\n> str(tapply)\nfunction\
  \ (X, INDEX, FUN = NULL, ..., simplify = TRUE)\n```\n\n为了演示`tapply()`的功能，让我们考虑 Mtcars\
  \ 数据集。该数据集提取自 1974 年的《Motor Trend》杂志。数据包括 32 辆汽车（1973–1974 年车型）的燃油消耗细节以及 10 个汽车设计和性能方面。表\
  \ 3-1 显示了数据集参数。\n\n**表 3-1.** Mtcars 数据集\n\n| [, 1] | `mpg` | 每加仑英里数 |\n| --- |\
  \ --- | --- |\n| [, 2] | `cyl` | 气缸数 |\n| [, 3] | `disp` | 排量（立方英寸） |\n| [, 4] |\
  \ `hp` | 毛马力 |\n| [, 5] | `drat` | 后桥速比 |\n| [, 6] | `wt` | 重量（磅/1000） |\n| [, 7]\
  \ | `qsec` | 四分之一英里时间 |\n| [, 8] | `vs` | V/S |\n| [, 9] | `am` | 变速箱（0 = 自动，1 =\
  \ 手动） |\n| [,10] | `gear` | 前进档位数 |\n| [,11] | `carb` | 化油器数量 |\n\n数据来源：Henderson\
