  方差是描述离散程度的另一种方式。简单来说，它是标准差的平方，如图 4-18 所示。方差提供了与均值偏离的平方的离散程度。与标准差相比，它是表示离散程度的另一种方式。如前所述，从数学上讲，方差是标准差的平方。我们继续使用本章前面用过的
  WorkAge 数据集。


