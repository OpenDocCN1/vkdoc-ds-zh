  ### 4.3.2 中位数


  中位数通过将数值按升序或降序排列来找出中间值。在许多情况下，中位数可能比均值更具代表性。它能够清晰地将数据集从中分成两个相等的部分，即 50%的数值低于中位数，50%的数值高于中位数。示例如下：


  - 某组织内工人的年龄，用于了解该组织的活力。

  - 某组织内员工的生产力。

  - 某组织内具备特定技能员工的薪资水平。


  我们以某组织 20 名工人的年龄为例：18、20、50、55、56、57、58、47、36、57、56、55、54、37、58、49、51、54、22 和 57。仅仅通过审视这些数字，你就能发现该组织中年长工人多于年轻工人，如果组织退休年龄是
  60 岁，那么几年后可能会出现知识流失的问题。接下来，我们比较该数据集的中位数和均值。下图显示 50%的工人年龄在 54 岁以上，即将面临退休（即如果以 60
  岁为退休年龄，他们距退休仅有 6 年），这预示着可能出现严重的知识流失。然而，如果使用均值 47.35，则情况显得更为乐观（即距退休约有 12.65 年）。但如果我们查看原始数据，情况并非如此：20
  名员工中有 13 人年龄已达 50 岁或更高，这对组织而言值得关注。图 4-10 展示了一个使用 R 语言计算中位数的实例。


