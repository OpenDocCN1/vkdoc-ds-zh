  \n您可以使用相同的方法对其他变量重复此操作，或使用前几节讨论的任何`apply()`方法。\n\n## 5.5 探索和可视化数据\n\n拥有干净的数据集后，下一步是探索性数据分析。这是探索数据、理解数据类型、检查数据集结构和组成的过程。此外，您还需要了解单个变量的分布以及两个或多个变量之间的关系。这种探索性分析严重依赖于图表和表格的表示。通过可视化分析传达的信息易于理解且能快速吸收。因此，使用数据可视化探索数据是整体业务分析过程中最重要的部分。\n\
  \n图 5-2 总结了前几节描述的数据收集和数据预处理步骤，这些步骤位于数据探索和数据可视化阶段之前。\n\n![A978-1-4842-2514-1_5_Fig2_HTML.gif](img/A978-1-4842-2514-1_5_Fig2_HTML.gif)\n\
  \n**图 5-2.** 数据可视化之前的工作流\n\n探索性分析的目标如下：\n\n* 确定数据集的分布和其他统计量\n* 确定数据集是否需要归一化\n* 确定数据集是否能回答您试图解决的业务问题\n\
  * 提出解决业务问题的蓝图\n\n以下各节描述了进行良好数据分析所需的表格和图形。\n\n### 5.5.1 表格\n\n查看数据最简单、最常用的工具是表格。表格包含行和列。原始数据显示为观测行和变量列。表格适用于较小的样本集，因此如果记录很多，可能难以显示整个数据集。通过以表格形式呈现数据，您可以深入了解数据，包括数据类型、变量名称以及数据的结构方式。然而，仅通过查看表格无法识别变量之间的关系。在\
  \ R 中，我们可以使用`View()`命令以表格格式查看数据，如图 5-3 所示。\n\n![A978-1-4842-2514-1_5_Fig3_HTML.jpg](img/A978-1-4842-2514-1_5_Fig3_HTML.jpg)\n\
  \n**图 5-3.** `View()`的输出\n\n### 5.5.2 汇总表\n\n我们已经在第 4 章中讨论了统计量及其重要性。描述性统计提供了理解数据的常用方法。这些统计量可以表示为汇总表。汇总表显示每列的观测数以及每列的描述性统计量。常用统计量如下：\n\
  \n* **最小值：** 最小值\n* **最大值：** 最大值\n* **均值：** 平均值\n* **中位数：** 中点的值\n* **总和：** 组中所有观测的总和\n\
  * **标准差：** 变量相对于均值偏离的标准化度量\n* **第一四分位数：** 数据集最小值与中位数之间的数\n* **第三四分位数：** 数据集中位数与最大值之间的数\n\
  \n以下输出是我们的股票价格数据集的描述性统计量。\n\n![A978-1-4842-2514-1_5_Figg_HTML.jpg](img/A978-1-4842-2514-1_5_Figg_HTML.jpg)\n\
  \n一些工具，如 Microsoft Excel 数据透视表和 Tableau，支持三维数据分析。这超出了本书的范围。\n\n### 5.5.3 图形\n\n\
  图形以视觉方式表示数据，提供更多关于数据的细节，使您能够识别数据中的异常值、每个列变量的数据分布、提供数据的统计描述，并呈现两个或多个变量之间的关系。第 4 章讨论了几种用于探索数据的可视化图形。图形类型包括条形图、直方图、箱线图和散点图。此外，同时查看多个变量的图形可以提供更多数据洞察。\n\
  \n**单变量分析**一次分析一个变量。这是分析数据的最简单形式。您分析单个变量，汇总数据，并找出数据中的模式。您可以使用多种可视化图形进行单变量数据分析，包括条形图、饼图、箱线图和直方图。所有这些图都已在上一章中讨论过。\n\
  \n**直方图**表示数据的频率分布。直方图类似于条形图，但将数字分组为范围。此外，直方图允许您显示连续数据的频率分布。这有助于分析分布（例如，正态或高斯分布）、数据中的任何异常值以及偏度。图\
  \ 5-4 以直方图形式描述了股票价格数据集的第一个变量。\n\n![A978-1-4842-2514-1_5_Fig4_HTML.gif](img/A978-1-4842-2514-1_5_Fig4_HTML.gif)\n\
  \n**图 5-4.** 直方图和密度函数\n\n#### 5.5.3.1 箱线图\n\n箱线图（或须状图）也是对数据的图形化描述。箱线图由 John W. Tukey\
  \ 创建，基于五数概括显示数据集的分布：最小值、最大值、中位数、第一四分位数和第三四分位数。图 5-5 解释了如何解读箱线图及其组成部分。\n\n![A978-1-4842-2514-1_5_Fig5_HTML.gif](img/A978-1-4842-2514-1_5_Fig5_HTML.gif)\n\
  \n**图 5-5.** 箱线图\n\n中央矩形跨越第一四分位数和第三四分位数（四分位距，即 IQR）。矩形内部的线表示中位数。矩形上方和下方的线（也称为须）表示数据集的最大值和最小值。\n\
  \n正常数据集没有异常高的最大值或异常低的最小值。异常值通常位于两条须线之外。Tukey 为异常值提供了以下定义：\n\n* **异常值：** 高于第三四分位数\
  \ 2/3 IQR 或低于第一四分位数 2/3 IQR\n* **疑似异常值：** 高于第三四分位数 1.5 IQR 或低于第一四分位数 1.5 IQR\n\n\
  如果数据服从正态分布，则 IQR = 1.35σ，其中σ是总体标准差。\n\n您可以在箱线图中绘制多个变量，并并排比较每个变量的数据。图 5-6 展示了一个示例。\n\
  \n![A978-1-4842-2514-1_5_Fig6_HTML.gif](img/A978-1-4842-2514-1_5_Fig6_HTML.gif)\n\
  \n**图 5-6.** 并排箱线图\n\n**带凹口的箱线图**看起来像带有凹口的箱线图，如图 5-7 所示。如果两个箱子的凹口不重叠，则表明“强有力的证据”表明它们的中位数不同（Chambers\
  \ 等人，1983，第 62 页）。\n\n![A978-1-4842-2514-1_5_Fig7_HTML.gif](img/A978-1-4842-2514-1_5_Fig7_HTML.gif)\n\
  \n**图 5-7.** 带凹口的箱线图\n\n\n\n双变量数据分析用于比较数据中两个变量之间的关系。双变量分析的主要目的是解释两个变量的相关性，进行比较，并根据其他变量的值推测可能存在的因果关系，以及自变量与因变量之间的关系。如果对每个观测值涉及多个变量，则应用多变量分析。\n\
  \n#### 5.5.3.2 散点图\n\n双变量分析中最常用的数据可视化工具是散点图。散点图可用于识别两个连续变量之间的关系。散点图上的每个数据点都是一个单独的观测值。所有观测值都可以绘制在一张图表上。\n\
  \n图 5-8 展示了各公司员工数量与收入（以百万美元计）的散点图。如图所示，这两个变量之间存在着近乎线性的强相关性。然而，没有进一步的统计分析，就无法得出任何因果推论。\n\
  \n![A978-1-4842-2514-1_5_Fig8_HTML.gif](img/A978-1-4842-2514-1_5_Fig8_HTML.gif)\n\
  \n图 5-8. 员工数量与收入（以百万美元计）的散点图\n\n不幸的是，散点图并不总是有助于发现模式或关系。如果数据点过多，散点图提供的信息就会非常有限。例如，图\
  \ 5-9 没有表明随机自行车用户与注册自行车用户之间是否存在任何相关性。\n\n![A978-1-4842-2514-1_5_Fig9_HTML.gif](img/A978-1-4842-2514-1_5_Fig9_HTML.gif)\n\
  \n图 5-9. 注册用户 vs. 随机用户\n\n### 5.5.4 散点图矩阵\n\n散点图矩阵图将成对的散点图绘制在一起，以寻找数据集中的模式和关系。散点图矩阵图两两选取变量，并将数据集中所有选定变量绘制成单一图形，以便您全面了解数据集，并理解变量对之间的模式和关系。R\
  \ 语言中的`pairs()`命令应绘制一个散点矩阵图。\n\n您可以先使用`read.table()`函数从文件中读取数据，然后使用`pairs()`函数绘制图形：\n\
  \n```\n> hou<-read.table(header=TRUE,sep=\"\\t\",\"housing.data\")\n```\n\n在此示例中，变量位于对角线上，从左上到右下（见图\
  \ 5-10）。每个变量都与其他变量进行相互绘图。例如，位于 `CRM` 右侧且 `ZN` 上方的图表示以 `ZN` 为 x 轴、`CRM` 为 y 轴的图。类似地，`Age`\
  \ 与 `CRM` 的图（以 `Age` 为 x 轴、`CRM` 为 y 轴）将是 `CRM` 向下第六个图，也是 `AGE` 向左第六个图。在此特定示例中，我们未看到任何变量对之间存在强相关性。\n\
  \n![A978-1-4842-2514-1_5_Fig10a_HTML.jpg](img/A978-1-4842-2514-1_5_Fig10a_HTML.jpg)![A978-1-4842-2514-1_5_Fig10b_HTML.jpg](img/A978-1-4842-2514-1_5_Fig10b_HTML.jpg)\n\
  \n图 5-10. 散点图矩阵图\n\n#### 5.5.4.1 格子图\n\n格子图是一种数据可视化框架，允许您检查多个变量之间的关系。以下示例展示了波士顿住房数据集中各变量的关系。格子图可以由任何类型的图形组件（如直方图或条形图）生成。格子图基于对一个或多个变量进行分区，并与其他变量一起进行分析。对于分类变量，图形基于该变量的不同水平；而对于数值变量，数据子集则基于该变量的区间。\n\
  \n在波士顿住房数据集中，房屋价值是基于其房龄作为税收的一个子集来分析的。可以对其他变量执行类似的分析。简单散点图的问题在于过度绘制，这使得难以解释数据中的结构。格子图创建不同的深度和区间以使解释更清晰。在此示例中，格子图在不同区间内创建\
  \ `MEDV` 税收：`MEDV` 值从左到右增加，如图 5-11 所示，较高的税收集中在较低的房龄组中，反之亦然。\n\n![A978-1-4842-2514-1_5_Fig11_HTML.gif](img/A978-1-4842-2514-1_5_Fig11_HTML.gif)\n\
  \n图 5-11. 格子图\n\n![A978-1-4842-2514-1_5_Figh_HTML.jpg](img/A978-1-4842-2514-1_5_Figh_HTML.jpg)\n\
  \n#### 5.5.4.2 相关性图\n\n两个变量之间的相关性可以通过相关性图进行计算和绘制，如图 5-12 所示。成对的相关性可以绘制在相关性矩阵图中，以描述两个变量的相关性：\n\
