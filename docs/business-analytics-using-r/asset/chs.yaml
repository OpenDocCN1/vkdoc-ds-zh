  FALSE  TRUE\n11425    95\n```\n\n`complete.cases()`函数返回一个逻辑向量，指示哪些观测是完整的（`TRUE`或`FALSE`）。以下示例展示了如何使用`complete.cases()`函数识别数据集中的缺失值（`NA`）：\n\
