  ## 9.6 总结


  在本章中，您看到了多元线性关系的示例。当您的响应变量是连续的且呈正态分布，并具有多个预测变量时，您可以使用多元线性回归。如果响应变量可以取离散值，则使用逻辑回归。


  您还简要了解了**显著交互作用**，即当结果因某个预测变量基于另一个预测变量的值而受到影响时发生。您学习了**多重共线性**，即两个或多个预测变量可能高度相关，或以不同方式表示同一方面。您看到了多重共线性的影响以及如何在多元线性回归模型或方程的背景下处理它们。


  然后，您探索了我们从某个实体获取的数据以及各个变量之间的相关性。您可以看到所涉及的所有三个变量（响应变量以及预测变量）之间存在高度相关性。通过在 R 中使用这些数据，您可以得出多元线性回归模型，然后验证它是一个具有显著预测变量的良好模型。


  您学习了各种技术来验证回归的假设是否得到满足。不同的方法可能导致不同的解释，因此您在这方面必须谨慎行事。


  在进一步探索多重共线性时，您看到诸如`vif()`之类的函数使您能够了解多重共线性的存在。您简要了解了在多元线性回归背景下处理多重共线性。多重共线性不会降低模型用于预测的价值。通过**阿卡伊克信息准则（AIC）**的示例，您学会了比较各种模型，并且最佳模型通常具有最低的
  AIC 值。


  接着，您探索了两种得出最佳拟合多元线性回归模型的替代方法：**逐步多元线性回归**和**多元线性回归的全子集法**。您通过使用多元线性回归方程对模型进行了描述。


  此外，您探索了如何使用频率分布为`gaussian`且`link = "identity"`的`glm()`函数生成与通过`lm()`函数生成的相同模型，因为我们在连续响应变量的情况下需要正态性。


  接着，您了解了如何使用预测变量的值来预测响应变量的值。


  最后，您探索了如何将数据集拆分为两个子集：训练数据和测试数据。您可以使用训练数据生成模型，通过使用基于训练数据生成的模型上的`predict()`函数来验证测试数据的响应变量。


