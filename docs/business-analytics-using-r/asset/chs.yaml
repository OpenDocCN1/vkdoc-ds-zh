  ### 6.2.3 朴素贝叶斯分类器的优点与局限性


  朴素贝叶斯分类器是所有分类器中最简单的一种。它计算效率高，并且在独立性假设成立时能提供最佳性能。拥有的记录越多，朴素贝叶斯的性能就越好。


  朴素贝叶斯分类器的主要问题在于分类模型依赖于后验概率，当某个预测类别在训练数据中不存在时，模型会假设其概率为零。如果这个属性值很重要，这可能会成为大问题。零值会导致计算出的条件概率值可能产生错误的预测。当使用计算机进行上述计算时，有时可能导致浮点错误。因此，最好通过添加概率算法来进行计算。具有最高对数概率的类别仍然是最重要的类别。如果某个特定类别在某个特定类别中没有出现，其条件概率等于
  0。那么乘积就会变成 0。如果我们使用第二个方程，log(0) 是无穷大。为了避免这个问题，我们使用加一平滑或拉普拉斯平滑，即对每个计数加 1。对于数值属性，假设其服从正态分布。然而，如果我们知道该属性不是正态分布，而可能遵循其他分布，则可以使用不同的程序来计算估计值——例如，核密度估计不假设任何特定的分布。另一种可能的方法是对数据进行离散化。


  尽管在现实世界中条件独立性并不成立，但朴素贝叶斯往往表现良好。


  ## 6.3 决策树




  '
- '# 决策树


  决策树通过树形结构构建分类模型。决策树结构由根节点、分支和叶节点组成。叶节点保存类别标签，每个分支表示决策树测试的结果，内部节点表示决策点。


  图 6-1 展示了贷款审批模型的决策树。每个内部节点代表对一个属性的测试。在此示例中，决策节点是`Purchase Frequency`（购买频率），它有两个分支：`High`（高）和`Low`（低）。如果`Purchase
  Frequency`为`High`，则下一个决策节点是`Age`（年龄）；如果`Purchase Frequency`为`Low`，则下一个决策节点是`Credit
  Rating`（信用评级）。叶节点代表分类决策：`Yes`（是）或`No`（否）。这种结构称为树形结构，树中最顶层的决策节点称为根节点。使用决策树的优点在于它既能处理数值型数据，也能处理分类型数据。


  ![A978-1-4842-2514-1_6_Fig1_HTML.gif](img/A978-1-4842-2514-1_6_Fig1_HTML.gif)


  图 6-1. 决策树示例


  决策树具有多项优点。它不需要任何领域知识，学习和分类所涉及的步骤简单快速，并且模型易于理解。这种机器学习算法基于分治规则生成决策树。设 `x1`、`x2` 和
  `x3` 为自变量；`Y` 表示因变量，属于分类变量。`X` 变量可以是连续型、二值型或序数型。决策树使用递归分割算法来构建树。第一步是选择其中一个变量 `xi`
  作为根节点进行分割。根据变量的类型和取值，分割可以分为两部分或三部分。然后，通过选择下一个变量对每个部分再次进行分割。分割过程持续进行，直到达到决策类别。选定根节点变量后，创建顶层树，算法通过对每个子节点进行分割来递归执行。我们将最终的叶子称为同质的，或尽可能纯净。纯净意味着最终节点只包含一个类别；然而，这并非总能实现。此处的挑战在于选择要分割的节点，以及当存在大量待分割变量时，知道何时停止树的分割或对树进行剪枝。


  ### 6.3.1 递归分区决策树算法


  构建决策树的基本策略是一种递归的分治方法。包含以下步骤：


  1.  树从训练集的一个单一节点开始。

  2.  基于信息增益或熵度量来选择节点属性或决策属性。

  3.  为测试属性的每个已知值创建一个分支。

  4.  此过程持续进行，直到所有属性都被考虑用于决策。


  当出现以下情况时，树停止生长：


  -   所有样本都属于同一类别。

  -   样本中没有更多属性可供进一步分区。

  -   属性分支没有对应的样本。


  ### 6.3.2 信息增益


  为了选择决策树节点和属性来分割树，我们度量该属性提供的信息。这种度量被称为分割优劣的度量。具有最高信息增益的属性被选为要进行分割的节点的测试属性。该属性最小化了在递归分区节点中对样本进行分类所需的信息。这种分割方法最小化了分类一个对象所需的测试次数，并保证了生成一棵简单的树。许多算法使用熵来计算样本的同质性。


  设 `N` 是一个由 `n` 个数据样本组成的集合。设 `k` 是类别属性，具有 `m` 个不同的类别标签 `C[i]`（其中 `i = 1, 2, 3, …
  m`）。


  基尼不纯度指数定义如下：


  ![$$ \mathrm{G}\left(\mathrm{N}\right)=1\hbox{-} {\displaystyle \sum_{\mathrm{K}=1}^{\mathrm{m}}{\left({\mathrm{p}}_{\mathrm{k}}\right)}²}
  $$](img/A978-1-4842-2514-1_6_Chapter_TeX2GIF_Equc.gif)


  其中 `p[k]` 是集合 `N` 中属于类别 `k` 的观测值的比例。当所有观测值都属于同一类别时，`G(N) = 0`；当所有类别均匀分布时，`G(N) =
  (m – 1) / m`。图 6-2 显示，当 `p[k] = 0.5` 时，不纯度度量达到最高。


  ![A978-1-4842-2514-1_6_Fig2_HTML.gif](img/A978-1-4842-2514-1_6_Fig2_HTML.gif)


  图 6-2. 基尼指数


  第二个不纯度度量是熵度量。对于包含 `n` 个样本且具有 `m` 个不同类别 `C[i]`（其中 `i = 1, … m`）的类别，在样本空间 `N` 和类别
  `C[i]` 中，对样本进行分类所需的期望信息表示如下：


  ![$$ \mathrm{I}\left(\mathrm{I}\Big({\mathrm{n}}_1,{\mathrm{n}}_2,{\mathrm{n}}_3,\dots
  {\mathrm{n}}_{\mathrm{m}}\right)=\hbox{-} {\displaystyle \sum_{\mathrm{K}=1}^{\mathrm{n}}{\mathrm{p}}_{\mathrm{k}}\kern0.5em
  { \log}_2\left({\mathrm{p}}_{\mathrm{k}}\right)} $$](img/A978-1-4842-2514-1_6_Chapter_TeX2GIF_Equ1.gif)


  其中 `p[k]` 是任意一个样本属于类别 `C[i]` 的概率。


  该度量的取值范围在 `0`（最纯净——所有观测值属于同一类别）和 `log2`（所有类别均匀分布）之间。对于两类情况，当 `p[k] = 0.5` 时，熵度量达到最大值。


  ![A978-1-4842-2514-1_6_Fig3_HTML.gif](img/A978-1-4842-2514-1_6_Fig3_HTML.gif)


  图 6-3. 不纯度


  设 `X` 为具有 `n` 个不同记录 `A = {a[1], a[2], a[3], … a[n]}` 的属性。`X` 属性可以被划分成子集 `{S[1],
  S[2], … S[v]}`，其中 `S[k]` 包含 `A` 的 `a[j]` 值。树是从基于每个属性提供的信息增益而选出的一个属性作为根节点开始生长的。子集对应于从这个节点生长出的分支，而该节点是
  `S` 的一个子集。属性 `A` 的熵或期望信息由下式给出：


  ![$$ \mathrm{E}\left(\mathrm{A}\right)={\displaystyle \sum_{\mathrm{J}=1}^{\mathrm{n}}\frac{\mathrm{S}{1}_{\mathrm{j}}+\mathrm{S}{2}_{\mathrm{j}}+\mathrm{S}{3}_{\mathrm{j}}+\dots
  ..{\mathrm{S}\mathrm{m}}_{\mathrm{j}}}{\mathrm{S}}}=\mathrm{I}\left(\mathrm{S}{1}_{\mathrm{j}},\mathrm{S}{2}_{\mathrm{j}},\dots
  {\mathrm{S}\mathrm{m}}_{\mathrm{j}}\right) $$](img/A978-1-4842-2514-1_6_Chapter_TeX2GIF_Equ2.gif)


  子集分区的纯度取决于熵值的大小。熵值越小，纯度越高。每个分支的信息增益基于 `X` 属性计算如下：


  ![$$ \mathrm{Gain}\kern0.5em \left(\mathrm{A}\right)\kern0.5em =\kern0.5em \mathrm{I}\kern0.5em
  \left({\mathrm{s}}_1,\kern0.5em {\mathrm{s}}_2,\kern0.5em {\mathrm{s}}_3,\kern0.5em
  \dots \kern0.5em {\mathrm{s}}_{\mathrm{m}}\right)\kern0.5em \hbox{--} \kern0.5em
  \mathrm{E}\left(\mathrm{A}\right) $$](img/A978-1-4842-2514-1_6_Chapter_TeX2GIF_Equ3.gif)


  `Gain (A)` 是 `X` 的每个属性熵之间的差值。它是由各个属性引起的熵的期望减少量。具有最高信息增益的属性被选为给定集合 `S` 的根节点，并根据样本分区为每个属性创建分支。


