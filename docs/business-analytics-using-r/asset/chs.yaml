- '# 6. 监督机器学习——分类


  分类和预测是用于发现数据模式的两项重要数据分析方法。分类预测的是分类类别（或离散值），而回归和其他模型预测的是连续值函数。然而，逻辑回归（`Logistic Regression`）也能处理分类类别。例如，可以构建一个分类模型来预测信用卡申请审批流程的结果（批准或拒绝），或确定保险索赔的结果。研究人员和机器学习专家已经开发了许多分类算法。大多数分类算法都是内存密集型的。最近的研究开发了并行和分布式处理架构，例如`Hadoop`，它能够处理大量数据。


  本章重点介绍基本的分类技术。它解释了一些分类方法，包括朴素贝叶斯（`naïve Bayes`）、决策树和其他算法。它还提供了使用可用的`R`包来执行分类任务的示例。


  ## 6.1 什么是分类？什么是预测？


  想象你正在申请抵押贷款。你填写了一份冗长的申请表，包含所有个人详细信息，包括收入、年龄、学历、房产位置、房产估值等等。你焦急地等待银行关于你的贷款申请是否获批的决定。结果要么是“是”，要么是“否”。银行如何决定？银行会审查你申请表上提供的各种参数，然后——根据以往收到的类似申请以及银行与这些客户打交道的经验——银行决定是批准还是拒绝贷款。


  现在想象你必须决定是否在市场上推出一个新产品。你必须做出“推出”或“不推出”的决定。这取决于各种参数。你的决定将基于你过去推出产品的类似经验，以及众多市场参数。


  接下来，想象你想预测客户对你企业提供的产品和服务的观点。这些观点可以是正面的也可以是负面的，并且可以根据众多参数以及你的客户对类似产品和服务的过往经验进行预测。


  最后，想象机场当局必须根据一系列参数，决定某个航空公司在某个登机口的特定航班是否准时或延误。这个决定基于之前的航班详情和许多其他参数。


  分类是一个两步过程。在第一步中，通过分析数据库和定义类变量（`class variable`）的属性集来构建模型。分类问题是一个监督机器学习问题。训练数据是数据库的一个样本，并且类属性（`class
  attribute`）是已知的。在分类问题中，类别变量`Y`的值由一组输入变量`{x1, x2, x3, …}`决定。在分类中，我们想要预测的变量通常被称为类变量（`class
  variable`）`C`，它可以在集合`{c1, c2, c3, …}`中取不同的值。观察到的或测量到的变量`X1, X2, … Xn`是属性（`attributes`）或输入变量（`input
  variables`），也称为解释变量（`explanatory variables`）。在分类中，我们想要确定类变量与输入或解释变量之间的关系。通常，模型表示分类规则或数学公式。一旦这些规则由学习模型创建，该模型就可以用于预测未来数据中未知的类。


  存在多种类型的分类器模型：基于决策边界的、基于概率论的以及基于判别分析的。我们从基于概率方法的分类器开始讨论。然后，我们将研究决策树和判别分类器。


  ### 6.2 概率模型用于分类


  概率分类器（`Probabilistic classifiers`），特别是朴素贝叶斯分类器（`naïve Bayes classifier`），是机器学习社区中最流行的分类器。朴素贝叶斯分类器是一个基于贝叶斯定理的简单概率分类器，贝叶斯定理是自然语言处理和视觉处理中最流行的定理。它是最基本的分类技术之一，具有例如电子邮件垃圾邮件检测、电子邮件分类和情感分析等应用。尽管朴素贝叶斯（`naïve
  Bayes`）是一种简单的技术，但它在许多复杂的现实世界问题中表现出色。


  概率分类的研究基于在独立性假设下近似联合分布，然后将该概率分解为条件概率的乘积。事件`A`在给定事件`B`下的条件概率——记为`P(A|B)`——表示在事件`B`也发生的情况下，事件`A`发生的可能性。




  '
- '# 朴素贝叶斯分类器


  在分类问题中，贝叶斯定理提供了一个公式，用于计算在给定记录属性集的情况下，该记录属于某个类别的概率。假设有 `m` 个类别 `C[1]`、`C2`、`C3`、……、`Cm`，并且已知各类别的概率
  `P(C1)`、`P(C2)`、……、`P(Cm)`。如果知道每个类别中属性 `x1`、`x2`、`x3`、…… 出现的概率，那么通过使用贝叶斯定理，可以计算出该记录属于类别
  `Ci` 的概率：


  ![$$ \mathrm{P}\left(\mathrm{Ci}\Big|{\mathrm{X}}_1,{\mathrm{X}}_2,{\mathrm{X}}_3,\dots
  {\mathrm{X}}_{\mathrm{p}}\right)=\frac{\mathrm{P}\left({\mathrm{X}}_1,{\mathrm{X}}_2,{\mathrm{X}}_3,\dots
  {\mathrm{X}}_{\mathrm{p}}\Big|{\mathrm{C}}_{\mathrm{i}}\right)\mathrm{P}\left({\mathrm{C}}_{\mathrm{i}}\right)}{\mathrm{P}\left({\mathrm{X}}_1,{\mathrm{X}}_2,\dots
  {\mathrm{X}}_{\mathrm{p}}\Big|{\mathrm{C}}_1\right)+\mathrm{P}\left({\mathrm{X}}_1,{\mathrm{X}}_2,\dots
  {\mathrm{X}}_{\mathrm{p}}\Big|{\mathrm{C}}_2\right)\dots \dots \mathrm{P}\left({\mathrm{X}}_1,{\mathrm{X}}_2,..{\mathrm{X}}_{\mathrm{p}}\Big|{\mathrm{C}}_{\mathrm{m}}\right)}
  $$](img/A978-1-4842-2514-1_6_Chapter_TeX2GIF_Equa.gif)


  `P(Ci)` 是在没有任何其他属性的情况下，属于类别 `Ci` 的先验概率。`P(C[i]|X[i])` 是 `X[i]` 属于类别 `C[i]` 的后验概率。为了使用贝叶斯定理对一条记录进行分类，你需要计算它属于每个类别
  `Ci` 的可能性。然后，根据使用上述公式计算出的最高概率得分进行分类。


  对于具有多个属性的数据集，计算 `P(X|Ci)` 的计算成本极高。因此，我们做了一个朴素假设，即假定给定样本的类别标签后，每条记录相互独立。假设每个类别内的预测属性相互独立是合理的，因此我们可以简化方程：


  ![$$ \mathrm{P}\left(\mathrm{X}\Big|\mathrm{Ci}\right)\kern0.5em =\kern0.5em {\varPi}_{k=1}^n\kern0.5em
  P\left( Xk\Big| Ci\right) $$](img/A978-1-4842-2514-1_6_Chapter_TeX2GIF_Equb.gif)


  假设每个数据样本由一个 n 维向量表示，`X = {x[1], x[2], … xn}`，样本来自 `n` 个类别值属性 `A[1], A[2], … A[n]`，具有
  `m` 个类别 `C1, C2, … Cm`，则 `P(X[k]|C[i]) = n/N`，其中 `n` 是类别 `C[i]` 中属性 `A[k]` 取值为 `Xk`
  的训练样本数，`N` 是属于类别 `C[i]` 的训练样本总数。


  ### 6.2.1 示例


  我们来看一个例子，了解如何使用贝叶斯分类器预测类别标签。表 6-1 给出了银行信用卡审批过程的训练数据元组集。


  **表 6-1. 样本训练集**


  | ID | 购买频率 | 信用评级 | 年龄 | 类别标签：是 = 批准，否 = 拒绝 |

  | --- | --- | --- | --- | --- |

  |  | 中等 | 良好 | < 35 | 否 |

  |  | 中等 | 优秀 | < 35 | 否 |

  |  | 高 | 一般 | 35–40 | 是 |

  |  | 高 | 一般 | > 40 | 是 |

  |  | 低 | 优秀 | > 40 | 是 |

  |  | 低 | 良好 | > 40 | 否 |

  |  | 低 | 优秀 | 35–40 | 是 |

  |  | 中等 | 一般 | < 35 | 否 |

  |  | 低 | 一般 | < 35 | 否 |

  |  | 中等 | 优秀 | > 40 | 否 |

  |  | 高 | 一般 | < 35 | 是 |

  |  | 中等 | 优秀 | 35–40 | 否 |

  |  | 中等 | 一般 | 35–40 | 是 |

  |  | 高 | 良好 | < 35 | 否 |


  该训练集中的数据样本包含属性：年龄、购买频率和信用评级。类别标签属性有两个不同的类别：批准或拒绝。设 `C1` 对应批准类别，`C2` 对应拒绝类别。使用朴素贝叶斯分类器，我们要对一个未知标签的样本
  `X` 进行分类：


  `X = (年龄 > 40, 购买频率 = 中等, 信用评级 = 优秀)`


  要对一条记录进行分类，首先通过计算训练记录中 `P(Ci|X1, X2, … Xp)` 来计算该记录属于每个类别的概率。然后根据概率最高的类别进行分类。


  在这个例子中，有两个类别。我们需要计算 `P(Xi|Ci)P(Ci)`。`P(Ci)` 是每个类别的先验概率：


  - `P(申请审批 = 是) = 6/14 = 0.428`

  - `P(申请审批 = 否) = 8/14 = 0.571`


  让我们计算 `P(X|C[i])`，其中 `i = 1, 2, …` 条件概率：


  - `P(年龄 > 40 | 审批 = 是) = 2/6 = 0.333`

  - `P(年龄 > 40 | 审批 = 否) = 2/8 = 0.25`

  - `P(购买频率 = 中等 | 审批 = 是) = 1/6 = 0.167`

  - `P(购买频率 = 中等 | 审批 = 否) = 5/8 = 0.625`

  - `P(信用评级 = 优秀 | 审批 = 是) = 2/6 = 0.333`

  - `P(信用评级 = 优秀 | 审批 = 否) = 3/8 = 0.375`


  使用这些概率，可以得到以下结果：


  - `P(X | 审批 = 是) = 0.333 × 0.167 × 0.333 = 0.0185`

  - `P(X | 审批 = 否) = 0.25 × 0.625 × 0.375 = 0.0586`

  - `P(X | 审批 = 是) × P(审批 = 是) = 0.29 × 0.428 = 0.0079`

  - `P(X | 审批 = 否) × P(审批 = 否) = 0.586 × 0.571 = 0.03346`


  朴素贝叶斯分类器预测给定的样本集 `X` 的审批结果为“否”。


  ### 6.2.2 使用 R 语言实现朴素贝叶斯分类器


  我们尝试使用 R 语言构建模型。我们将使用相同的示例。数据样本集包含属性：年龄、购买频率和信用评级。类别标签属性有两个不同的类别：批准或拒绝。目标是预测新样本的类别标签，其中年龄
  > 40，购买频率 = 中等，信用评级 = 优秀。


  第一步是从文件中读取数据：


