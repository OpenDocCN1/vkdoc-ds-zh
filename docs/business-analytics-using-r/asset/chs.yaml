  在图 8-9 中，由于点以随机方式分布在近乎水平的直线周围，这向我们保证了常数方差（或方差齐性）的假设成立。


  ##### 8.4.4.5.3 使用 `library(car)` 中的 `crPlots(model name)` 函数


  我们可以使用`crPlots(mod_simp_reg)`命令来理解模型所代表关系的线性关系。非线性关系要求我们重新探索模型。图 8-10 中的图表显示，我们如上创建的模型（即`mod_simp_reg`）是线性的。


