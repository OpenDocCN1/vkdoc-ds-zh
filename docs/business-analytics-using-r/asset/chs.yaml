  标准化残差 vs. 杠杆图显示，大多数标准化残差分布在零线附近。


  ## 独立性检验


  现在，我们需要验证残差的独立性（即误差的独立性，或不存在自相关）。然而，在本例中，由于我们已知每条数据记录属于不同的员工，且是在特定时间点采集的，并且不同员工数据之间不存在依赖关系，因此我们可以安全地假设残差和误差是独立的。不过，从学术兴趣的角度，您可以运行
  `Durbin-Watson` 检验来判断是否存在自相关（即误差不独立）。在 R 中执行此操作的命令及相应输出如下：


  ![A978-1-4842-2514-1_9_Figk_HTML.jpg](img/A978-1-4842-2514-1_9_Figk_HTML.jpg)


  由于 `p-value` < 0.05，`Durbin-Watson` 检验拒绝了不存在自相关的原假设。因此，`Durbin-Watson` 检验支持存在自相关（即误差不独立）的备择假设。然而，如前所述，我们知道所使用的数据并不缺乏独立性。因此，我们可以忽略
  `Durbin-Watson` 检验的结果。


  如您所见，回归模型假设的所有检验均通过。


  ## 多重共线性


  ### 9.1.5 多重共线性


  多重共线性是多元线性回归方法中可能遇到的另一个问题。假设您同时将“出生日期”和“年龄”作为预测变量。您知道两者在某种程度上是等价的，换句话说，其中一个与另一个高度相关。如果两个预测变量彼此高度相关，那么在多元线性回归方程中同时考虑这两个预测变量是没有意义的。我们通常会从多元线性回归模型或方程中消除其中一个预测变量，因为多重共线性会对模型产生不良影响。


  在 R 中，可以轻松地使用 `vif(model name)` 函数检测多重共线性。`VIF` 代表方差膨胀因子（variance inflation factor）。通常，要使多重共线性检验通过，`VIF`
  值应大于 5。以下是计算 `VIF` 的检验结果：


  ![A978-1-4842-2514-1_9_Figl_HTML.jpg](img/A978-1-4842-2514-1_9_Figl_HTML.jpg)


  因此，我们可以假设不存在显著的多重共线性。然而，我们无法排除中等程度的多重共线性。


  多重共线性通常会影响其中一个系数的显著性，使其变得不显著。但在本例中，我们并未看到这种影响。相反，我们发现两个预测变量的系数都是显著的。此外，存在多重共线性并不会使模型无法用于预测。因此，即使根据某些统计学派的观点（认为
  `VIF` 值大于 4 时存在多重共线性），我们仍可以使用上述模型进行预测。


  以下展示了如何使用该模型根据“工作年限”和“技能等级”的新数据来预测“年薪”。




  ![A978-1-4842-2514-1_9_Figm_HTML.jpg](img/A978-1-4842-2514-1_9_Figm_HTML.jpg)


