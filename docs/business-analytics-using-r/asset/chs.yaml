- '# 本章小结


  在本章中，您了解到如果响应变量是分类或离散变量（可以是名义变量、有序变量或二元变量），则应使用一种不同的回归方法，称为逻辑回归。如果您有一个只有两个值的因变量，例如“是”或“否”，则应使用二项式逻辑回归。如果因变量取值超过两个分类值，则应使用多项逻辑回归。




