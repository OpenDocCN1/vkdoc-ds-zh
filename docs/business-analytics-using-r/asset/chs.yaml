  \n使用 `as.numeric()` 函数，变量 `Stock1`、`Stock2`、`Stock3` 等已转换为数值型数据类型。在这里，我们将 `as.numeric()`\
  \ 嵌套在 `as.character()` 中。如果你将因子直接转换为数值，R 可能不会给出实际值。因此，首先将值转换为字符，然后再转换为数值。类似地，还有其他函数可用于识别和执行将一种数据类型转换为另一种类型的任务：\n\
  \n```r\nis.numeric(), is.character(), is.vector(), is.matrix(), is.data.frame()\n\
  ```\n\n用于识别数据类型，而\n\n```r\nas.numeric(), as.character(), as.vector(), as.matrix(),\
  \ as.data.frame()\n```\n\n用于将一种数据类型转换为另一种数据类型。\n\n最后，让我们识别缺失值、垃圾字符和空值，然后清理数据集。\n\
