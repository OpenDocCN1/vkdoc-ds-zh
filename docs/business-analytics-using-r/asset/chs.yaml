  ## 9.5 交叉验证


  像 k 折交叉验证这样的交叉验证方法用于验证生成的模型。当数据有限，并且需要将数据拆分为较小的测试集（例如 20%的数据）和相对较大的训练集（例如 80%的数据）时，这将非常有用，因为训练集和测试集中的数据可能划分得使两者都无法很好地代表整个数据集，从而使模型验证相对困难或不可行。


  像 k 折交叉验证这样的交叉验证方法可以消除这个问题。在这里，我们实际上将数据集划分为 k 折，并使用 k-1 个集作为训练数据，剩下的 1 个集作为测试数据，并重复此过程
  k 次。每个 k 折都包含从整个数据集中随机抽取的几乎相同数量的数据点（具体取决于 k 值）。在我们的案例中，由于总共有 48 条记录，每折包含 4 或 5 条记录。一折中的元素不会在另一折中重复出现。针对每一折，模型都会进行验证，模型预测的值（Predicted）和交叉验证预测的值会作为输出列出，同时还会显示实际值与交叉验证预测值（cvpred）之间的差异，即
  CV 残差。利用预测值与 cvpred 之间的差异，我们可以计算出线性回归模型拟合的均方根误差。在处理海量数据时，这种交叉验证方法也很有用，因为通过轮换，每个数据点既用于训练也用于测试，并且在任何一折中都不会再次考虑同一个数据点。


  让我们以我们之前使用的多元线性回归为例。让我们使用 k 折验证来验证这个模型。在我们的示例中，我们将使用 K = 10。这样做是为了方便，这样每次训练集中有 90%的数据，测试集中有另外
  10%的数据。这样一来，曾经在训练集中的数据，会在另一次轮换中移动到测试集中。因此，实际上通过轮换，我们可以确保所有数据点都用于模型生成和测试。对于此交叉验证，我们将使用`library(DAAG)`，并使用`cv.lm(dataset,
  formula for the model, m=number of folds)`或`CVlm(dataset, formula for the model,
  m=number of folds)`函数。这里的`m`就是我们决定的折数（即 K）。我们的示例运行此操作的结果如下各图所示。


