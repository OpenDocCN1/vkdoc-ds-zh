  ## 从树中提取分类规则


  决策树提供了易于理解的分类规则。遍历每个树叶节点即可获得一条分类规则。对于前面的示例，最佳剪枝后的树给出了以下规则：


  - **规则 1：** 如果信用评级为 Excellent，年龄>35，购买频率为 High，则贷款批准 = Yes

  - **规则 2：** 如果年龄<35，信用评级 = OK，购买频率为 Low，则贷款批准 = No

  - **规则 3：** 如果信用评级为 OK 或 Fair，购买频率为 High，则贷款批准 = Yes

  - **规则 4：** 如果信用评级为 Excellent、OK 或 Fair，购买频率为 Low 或 Medium，且年龄>35，则贷款批准 = No


