  \n\n\n### 3.2.5 在 R 语言中编写自定义函数\n\n与其他编程语言一样，你也可以在 R 中编写自己的函数。在程序需要重复执行一系列任务时，会编写函数；在代码需要与他人或公众共享时，也会编写函数；当编程语言命令中尚未定义相关函数时，同样需要编写函数。函数通过创建代码的抽象层来降低编程复杂性，使用时只需指定一组参数。在\
