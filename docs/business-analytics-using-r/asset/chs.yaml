  另一种直观确认正态性假设的方法是使用 `qqPlot(model name, simulate = TRUE, envelope = 0.95)`。使用的 R
  命令如下：


  ![A978-1-4842-2514-1_9_Figj_HTML.jpg](img/A978-1-4842-2514-1_9_Figj_HTML.jpg)


