  `Product_Sales = 0.0500779 + 0.0984054 * Sales_Effort`


  系数估计值旁边的值是估计值的标准误差。这指明了估计值的不确定性。然后是标准误差的 "t" 值。它指明了系数估计值相对于不确定性的大小。下一个值是绝对 t 值大于指定值的概率，该概率由随机误差引起。理想情况下，"Pr"
  或概率值（通常称为 "p 值"）应非常小（例如 0.001、0.005、0.01 或 0.05），以使响应变量与自变量之间的关系具有显著性。p 值也称为显著性值。由于此处
  `Sales_Effort` 系数的误差概率非常小（即几乎接近 0）（即 <2e-16），我们拒绝该参数对模型无显著影响的原假设，并接受该参数对模型有显著影响的对立假设。因此，我们得出结论，响应变量
  `Product_Sales` 与自变量 `Sales_Effort` 之间存在显著关系。每个参数 p 值旁边的星号 (*) 数量指明了显著性水平。请参考图 8-4
  中模型摘要给出的"显著性代码"。


  下一部分展示了与整体模型质量相关的统计量。其中包括：


  - 此处指定的自由度就是数据行数减去系数个数。在我们的例子中，是 21 - 2 = 19。这是残差自由度。理想情况下，自由度数量应远大于系数数量，以避免数据对模型的过拟合。我们在其中一章中讨论过数据对模型的过拟合和欠拟合问题。我们暂时记住，过拟合是不好的。通常，根据经验法则，每个变量有
  30 行数据对于训练样本来说是好的。此外，如果数据行数少于自变量个数，我们无法使用普通最小二乘法。


  - 残差标准误差显示的是残差的平方和除以摘要中指定的自由度（在我们的例子中是 19）。该值是 0.1086，非常低，符合我们的要求。


  - 此处显示的多元 R 方值就是相关系数的平方（即 R）。多元 R 方也称为决定系数。然而，调整后的 R 方值是 R 方经过调整以避免过拟合后的值。在此，我们再次更依赖调整后的
  R 方值而非多元 R 方。调整后的 R 方值为 0.9987，非常高，表明响应变量 `Product_Sales` 与自变量 `Sales_Effort` 之间存在极好的关系。


  - 最后，F 统计量基于 F 检验。与系数的情况一样，我们也希望 p 值非常小（例如 0.001、0.005、0.01、0.05），以使模型具有显著性。正如您在例子中看到的，它小于
  0.001（即 <2.2e-16）。因此，该模型是显著的。在当前示例中，只有一个自变量，因此此 p 值与该自变量的 p 值相同。


  如上所述，响应变量 `Product_Sales` 与自变量 `Sales_Effort` 之间似乎存在极好的关联。


  ### 8.4.4 检验回归假设


  在接受该模型可用之前，必须验证回归假设对于拟合模型是否成立。


  #### 8.4.4.1 线性检验


  为了检验线性，我们将残差与自变量的相应值进行绘图。图 8-5 展示了这一点。


  ![A978-1-4842-2514-1_8_Fig5_HTML.gif](img/A978-1-4842-2514-1_8_Fig5_HTML.gif)


  **图 8-5.** 用于检验线性的残差与拟合值图


  为了使模型通过线性检验，残差的分布不应有任何模式，并且它们应随机分布在 0.0 残差线周围。也就是说，残差将围绕响应变量值的平均值随机变化。在我们的例子中，正如我们所见，残差的分布没有模式。因此，它通过了线性条件。


  #### 8.4.4.2 回归线周围误差独立性的检验


  当数据在同一时间段内收集时，不需要进行此检验。在我们的例子中，数据是在相同的两周时间段内收集的，因此不需要进行此检验。此检验主要用于检查自相关性，自相关性是在不同时间段收集数据时引入的。此外，如前面的图（在线性检验中使用的图）所示，残差是随机分布在响应变量平均值周围的。如果我们需要检验自相关性，可以使用德宾-沃森检验，如图
  8-6 所示。


  ![A978-1-4842-2514-1_8_Fig6_HTML.jpg](img/A978-1-4842-2514-1_8_Fig6_HTML.jpg)


  **图 8-6.** R 中用于检验自相关性的德宾-沃森检验




  在 Durbin-Watson 检验中，零假设（即`H[0]`）为不存在自相关，备择假设（即`H[1]`）为存在自相关。若`p-value` < 0.05，则拒绝零假设，即认为存在自相关。在上述情况下，`p-value`大于
  0.05，这意味着没有证据拒绝“不存在自相关”的零假设。因此，关于回归线误差独立性的检验通过。或者，你可以使用`library(car)`中的`durbinWatsonTest()`函数进行此检验。


  #### 8.4.4.3 正态性检验


  根据该检验，残差应服从正态分布。为了验证这一点，我们将查看正态 Q-Q 图（使用`plot(model name)`命令创建）：


  图 8-7 显示，在上述正态 Q-Q 图中，残差点几乎落在直线上。这表明残差服从正态分布。因此，残差的正态性检验通过。


  ![A978-1-4842-2514-1_8_Fig7_HTML.gif](img/A978-1-4842-2514-1_8_Fig7_HTML.gif)


  图 8-7。使用正态 Q-Q 图检验“正态性”假设


  #### 8.4.4.4 响应变量分布的方差齐性


  我们可以使用与检验线性关系时相同的残差图。从该图（如上文线性关系检验部分所示）可以看出，对于自变量的不同取值水平，残差的变异没有显著差异。因此，我们认为该检验通过。


  #### 8.4.4.5 验证回归模型需满足假设的其他方法


  除了前面提到的方法之外，还有许多其他方法可以验证回归模型是否满足回归假设。


  ##### 8.4.4.5.1 使用 `gvlma` 库


  另一个验证回归模型是否满足回归假设的简便方法是使用`library(gvlma)`，它可以验证回归模型的相关假设，并评估其他相关方面，如偏度、峰度、链接函数和异方差性。


  图 8-8 展示了如何使用该库以及 R 的输出结果。


  ![A978-1-4842-2514-1_8_Fig8_HTML.jpg](img/A978-1-4842-2514-1_8_Fig8_HTML.jpg)


  图 8-8。使用 `gvlma()` 函数验证模型假设


  在图 8-8 中，我们给出了 R 中`gvlma()`函数对模型的输出结果。`Global Stat`行清楚地表明，与该回归模型相关的假设是可接受的。这里，我们需要检查`p-value`是否大于
  0.05。如果`p-value`大于 0.05，我们可以安全地得出结论，如上所示，假设已得到验证。如果`p-value`小于 0.05，则需要重新审视回归模型。


  ##### 8.4.4.5.2 使用尺度-位置图


  尺度-位置图是使用`plot(regression model name)`命令生成的图形之一。在我们的例子中，该命令是`plot(mod_simp_reg)`。图
