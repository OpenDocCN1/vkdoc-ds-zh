  #### 4.6.4.2 二项分布


  二项分布通常用于衡量成功或失败的场景。在板球比赛中，比赛开始时抛硬币是决定哪一方先击球（或防守）的重要环节。抛硬币并猜“正面”，如果结果是“正面”，你就赢得了掷币；反之，如果结果是“反面”，你就输掉了掷币。


  作为某组织的销售主管，你提交了十五份标书的应答文件。每份标书都有五个竞标者。你可能会成功赢得其中一部分或全部，也可能一无所获。由于每份标书有五个竞标者，且每份标书只能由一家公司赢得，因此赢得标书的概率是
  0.2（即 1/5）。你想赢得的标书数超过十五份中的四份。你可以使用 R 语言通过二项分布来求出赢得四份或更少标书的概率（见图 4-36）。


  ![A978-1-4842-2514-1_4_Fig36_HTML.jpg](img/A978-1-4842-2514-1_4_Fig36_HTML.jpg)


  图 4-36. 在 R 中解决的二项分布问题示例


  请注意，`pbinom()` 函数使用了二项分布的累积概率分布函数，因为我们想知道赢得四份或更多标书的概率。如您所见，赢得四份或更少标书的概率是 83.58%。赢得超过四份标书的概率为（100
  – 83.58）= 16.42%。


  #### 4.6.4.3 泊松分布


  泊松分布描述了在时间区间内发生的独立事件。呼叫中心的来电到达、银行大厅顾客的到达，或者机场/公交总站乘客的到达，均服从泊松分布。


  我们以某银行特定分行顾客到达数量为例。假设平均每小时有 20 名顾客到达。我们可以使用 R 语言，借助泊松分布求出每小时到达该分行的顾客数达到 26 人或以上的概率（见图
  4-37）。


  ![A978-1-4842-2514-1_4_Fig37_HTML.jpg](img/A978-1-4842-2514-1_4_Fig37_HTML.jpg)


  图 4-37. 在 R 中解决的泊松分布问题示例


