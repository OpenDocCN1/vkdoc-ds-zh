  #### 5.7.5.3 ROC 图


  接收者操作特征（ROC）图类似于提升图。它是以 `y` 轴为真正例率，`x` 轴为假正例率绘制而成的图。


  ROC 曲线是表示分类器性能的另一种方式。近年来，由于简单的分类准确率并不是衡量分类器性能的良好指标，ROC 已成为机器学习社区中的一种常用方法（Provost
  和 Fawcett，1997；Provost 等人，1998）。ROC 曲线绘制的是真正例率（敏感度）与假正例率（特异度）的函数关系，如图 5-18 所示。


  ![A978-1-4842-2514-1_5_Fig18_HTML.gif](img/A978-1-4842-2514-1_5_Fig18_HTML.gif)


  **图 5-18. ROC 图**


  对于一个良好的分类器模型，敏感度率应该较高，而假正例率应该较低，如图 5-18 所示。除了仅查看混淆矩阵外，ROC 曲线的曲线下面积（AUC）为分类器性能提供了一个简单的图形表示。在示例中，我们为三个不同的模型绘制了
  ROC 曲线，其中第一条线（绿色）的 AUC 最高。对于每个分类器，拟合 ROC 曲线，并在其整个操作范围内将结果与每个分类器模型进行比较。AUC 值小于 0.5
  可能表明模型表现不佳，需要关注。通常，AUC 应介于 0.5 和 1.0 之间。当两个类别的分离非常完美且分布没有重叠时，ROC 曲线下的面积达到 1，理想情况下这是任何机器学习模型的目标。


  研究表明，具有两个类别的算法最适合 ROC 方法。神经网络是合适分类器的一个例子，而决策树分类器则不太适合。


