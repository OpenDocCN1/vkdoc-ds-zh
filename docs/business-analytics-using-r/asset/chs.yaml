  如果我们在预测变量之间发现显著的多重共线性，那么构建模型的一种方法是舍弃其中一个预测变量，然后使用另一个变量继续建模。类似地，你也可以尝试放弃另一个预测变量，用第一个预测变量来构建模型。在两个模型都构建完成后，检查哪个模型在统计上更显著。比较模型的一种方法是计算
