  从本讨论中可以看出，四分位数和各种分位数除了提供均值或中位数（尽管中位数本质上就是第二个四分位数）所提供的信息之外，还提供了关于数据分布的额外信息。


  ### 4.3.6 标准差


  度量的平均值和中位数描绘了数据集或分布的中心。另一方面，标准差则说明了数据集或数据值的分散程度。


  标准差的手动计算如下：


  1. 首先计算数据集或分布的平均值

  2. 然后计算每个值与平均值的距离（这被称为偏差）

  3. 然后将上述计算出的距离进行平方

  4. 然后将平方后的距离求和

  5. 然后将上述得到的平方距离之和除以数值个数减 1，以调整自由度


  第 3 步中的平方运算是必要的，因为数据集中的负数和正数在我们计算或得出平均值时会相互补偿或抵消彼此的影响，而平方可以帮助我们理解数据的真实分散程度。


  让我们以图 4-16 中显示的工人年龄示例来计算标准差。


  ![A978-1-4842-2514-1_4_Fig16_HTML.gif](img/A978-1-4842-2514-1_4_Fig16_HTML.gif)


  图 4-16. 使用 WorkAge 数据集手动计算标准差


  在 R 语言中，可以通过一个简单的命令轻松完成此计算：`sd(dataset)`。图 4-17A 展示了使用 R 查找标准差的示例。


  ![A978-1-4842-2514-1_4_Fig17a_HTML.jpg](img/A978-1-4842-2514-1_4_Fig17a_HTML.jpg)


  图 4-17A. 使用 R 计算标准差


  通常，根据正态曲线（一个包含大量项目的数据集通常被认为具有正态分布或正态曲线）的规则：


  *   +/- 1 个标准差表示 68% 的数据落在此范围内

  *   +/- 2 个标准差表示 95% 的数据落在此范围内

  *   +/- 3 个标准差表示 99.7% 的数据落在此范围内。


  总的来说，大约 99.7% 的数据将落在 +/- 3 个标准差的范围内。


  正如图 4-17B 所示，在正态分布数据的情况下（数据点数量通常大于 30，越多越好），观察到大约 68% 的数据落在距离分布中心（即均值）正负一个标准差的范围内。类似地，大约
  95%（或如图 4-17B 所示的约 95.2%）的数据值落在距离中心正负两个标准差的范围内。大约 99.7% 的数据值落在距离中心正负三个标准差的范围内。这里显示的曲线通常被称为
  **“钟形曲线”** 或 **“正态分布曲线”**。例如，一个国家所有公司的利润或亏损围绕中心值（即利润或亏损的均值）呈正态分布。


  ![A978-1-4842-2514-1_4_Fig17b_HTML.jpg](img/A978-1-4842-2514-1_4_Fig17b_HTML.jpg)


  图 4-17B. 显示不同标准差范围内数据覆盖率的钟形曲线


  标准差越高，与均值的离散程度越高——也就是说，它表明数据点之间差异显著，并显示了数据的异质性。标准差越低，与均值的离散程度越低——也就是说，它表明数据点之间差异较小，并显示了数据的同质性。


  然而，标准差与均值、中位数、四分位数和百分位数等其他因素一起，为我们提供了关于数据的大量信息，或者更有效地解释了数据。


