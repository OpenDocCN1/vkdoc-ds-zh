  ## 4.6 概率


  概率及相关分布的概念对于商业分析的重要性不亚于纯统计学领域。商业分析中使用的一些重要概念，如贝叶斯理论和决策树等，都基于概率的概念。


  如你所知，简单来说，概率就是事件发生的可能性。在某些情况下，我们可能掌握与事件相关的一些先验信息；在其他情况下，事件可能是随机的——也就是说，我们可能事先不知道结果。描述概率的一种流行方式是抛硬币或掷骰子的例子。硬币有两面，当抛出时，出现正面或反面的概率是
  1/2，因为在任何一次抛掷中，要么出现正面，要么出现反面。你可以通过多次抛掷硬币来验证这一点，并观察到出现正面或反面的概率大约为 50%（即 1/2）。类似地，掷骰子掷出任何特定数字的概率是
  1/6，这也可以通过多次掷骰子来验证。


  如果一个事件不可能发生，其概率为 0。然而，如果一个事件必然发生，其概率为 1。但事件的概率总是在 0 和 1 之间，并且取决于其发生的可能性或与其发生相关的不确定性。


  任意两个或多个事件可以彼此独立地发生。同样，任意两个或多个事件也可以互斥地发生。


  **示例 1：** 你能同时前往两个方向相反的目的地吗？如果你向西旅行，就不能同时向东旅行。


  **示例 2：** 如果我们在一个客户账户中盈利，就不能在同一账户中亏损。


  示例 1 和 2 属于当另一个事件发生时，会排除特定事件发生的事件类型；它们被称为互斥事件。


  **示例 3：** 一个人“抛硬币”和“下雨”可以同时发生，但两者互不影响对方的结果。


  **示例 4：** 一家公司可能盈利，同时面临法律问题。一个事件（盈利）不会对另一个事件（有法律问题）产生影响。


  示例 3 和 4 属于不相互影响结果的事件类型；它们被称为相互独立事件。这些也是互不排斥事件的例子，因为两个结果可以同时发生。


  ### 4.6.1 互斥事件的概率


  两个互斥事件（例如 `X` 和 `Y`）同时发生的概率为 0，因为根据定义，它们不会同时发生：`P(X and Y) = P(X ∩ Y) = 0`。


  `n` 个互斥事件（例如 `A1`、`A2`……`AN`）同时发生的概率为 0，因为根据定义，所有这些事件不会同时发生：`P(A1 and A2 and……AN)
  = P(A1 ∩ A2 ∩…. ∩ AN) = 0`。


  然而，两个互斥事件中的一个（例如 `X` 或 `Y`）发生的概率等于每个事件发生概率之和：`P(X or Y) = P(X U Y) = P(X) + P(Y)`。


  ### 4.6.2 相互独立事件的概率


  两个相互独立事件同时发生的概率为 `P(X and Y) = P(X) * P(Y)`。


  ### 4.6.3 互不排斥事件的概率


  互不排斥事件是指那些并非互斥的事件。


  两个互不排斥事件（即每个事件发生概率之和减去这两个事件同时（或换句话说，一起）发生的概率）的概率为 `P(X or Y) = P(X U Y) = P(X) +
  P(Y) – P(X ∩ Y)`。


  `n` 个互不排斥事件的概率为 `P(A1 or A2 or …….. or AN) = P(A1 U A2 U………U AN) = P(A1) + P(A2)
  +……+ P(AN) – P(A1 ∩ A2 ∩ A3 ∩ …….. ∩ AN)`。




  ### 4.6.4 概率分布


  随机变量在分析中十分重要。概率分布描述了随机变量取值的分布情况。一些重要的概率分布包括：


  - 正态分布

  - 二项分布

  - 泊松分布

  - 均匀分布

  - 卡方分布

  - 指数分布


  我们不会逐一讨论上述所有分布。可能存在的分布类型还有很多，包括 F 分布、超几何分布、联合分布与边缘概率分布以及条件分布等。本章我们将只讨论正态分布、二项分布和泊松分布。关于这些分布以及其他相关分布的更多内容，我们将在后续章节中进行探讨。


  #### 4.6.4.1 正态分布


  大量数据被认为服从正态分布，因为该分布通常以均值为中心。在现实生活中，许多情况下都能观察到正态分布。由于其形状呈钟形，正态分布也被称为“钟形曲线”。正态分布的性质中，通常约有
  68%的值落在均值±1 个标准差内，95%的值落在均值±2 个标准差内，99.7%的值落在均值±3 个标准差内，这些性质在大多数分析技术中被广泛使用，因此也是标准正态曲线的性质。标准正态曲线的均值为
  0，标准差为 1。`Z-score`（Z 分数）用于对回归分析中的特征值进行归一化，其基础正是标准正态分布的概念。正态分布也可用于其他分布的情况，因为在大样本量下，随机样本均值的分布通常为正态分布。


  正态分布应用的一个重要例子是统计过程控制，该技术被大多数行业用于理解并控制过程绩效。另一个重要例子是员工绩效的分布，通过它可以识别出少数高绩效和低绩效员工，而大多数员工的绩效则围绕平均值水平。


  假设某组织有 150 名员工，员工的平均绩效评分为 3 分，最低分为 1 分，最高分为 5 分，标准差为 1.5。使用 R 计算获得 4 分及以上分数的员工百分比，如图
  4-35 所示。


