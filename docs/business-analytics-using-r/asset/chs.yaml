  \n#### 3.2.4.6 `split()`\n\n在数据分析中，有时您可能需要将数据集拆分为组。这可以通过使用`split()`函数方便地完成。此函数将数据集划分为由参数定义的组。`unsplit()`函数反转`split()`的结果。\n\
