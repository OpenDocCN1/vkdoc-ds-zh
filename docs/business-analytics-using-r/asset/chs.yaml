  mathrm{p}}{\\mathrm{W}}_{\\mathrm{ijm}}}} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equc.gif)\n\
  \n变量 `f` 对 `i` 和 `j` 之间不相似性的贡献根据其类型计算：\n\n1.  如果 `m` 是二元或名义变量，\n\n    ![$$ \\mathrm{d}\\\
  left(\\mathrm{I},\\mathrm{j}\\right)\\kern0.5em =\\kern0.5em \\frac{\\mathrm{b}\\\
  kern0.5em +}{\\mathrm{a}\\kern0.5em +\\kern0.5em \\mathrm{b}\\kern0.5em +\\kern0.5em\
  \ \\mathrm{c}} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equd.gif)\n\n    如果\
  \ `x[im] = x[jm]`；否则，\n\n    ![$$ \\mathrm{d}\\left(\\mathrm{I},\\mathrm{j}\\right)\\\
  kern0.5em =\\kern0.5em \\frac{\\mathrm{b}\\kern0.5em +}{\\mathrm{a}\\kern0.5em +\\\
  kern0.5em \\mathrm{b}\\kern0.5em +\\kern0.5em \\mathrm{c}} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Eque.gif)\n\
  \n2.  如果 `m` 是基于区间的：\n\n    ![$$ \\mathrm{d}\\begin{array}{c}\\hfill \\mathrm{m}\\\
  hfill \\\\ {}\\hfill \\left(\\mathrm{ij}\\right)\\hfill \\end{array}\\frac{\\left|{\\\
  mathrm{x}}_{\\mathrm{im}}\\hbox{-} {\\mathrm{X}}_{\\mathrm{jm}}\\right|}{ \\max\
  \ \\left({\\mathrm{x}}_{\\mathrm{hm}}\\right)\\hbox{-} \\min \\left({\\mathrm{x}}_{\\\
