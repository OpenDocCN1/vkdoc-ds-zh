  ## 4.7 本章小结


  - 您已经了解到，仅仅依赖单一的描述性统计量可能会很危险。事实上，要对任何事物获得全面的了解，可能需要使用多种统计函数来理解上下文或情况。

  - 您还理解了描述性分析中各种感兴趣的统计参数（均值、中位数、分位数、四分位数、百分位数、标准差、方差和众数）。您了解了如何使用 R 语言计算这些参数。您也知道通过一个简单的命令如`summary(dataset)`，就可以使用
  R 语言获得其中大部分参数。

  - 您探索了如何使用 R 语言以图形方式绘制数据。您也理解了图形表示如何向用户提供比描述性统计更多的信息。您了解了如何使用 R 语言创建直方图、条形图和箱线图。

  - 您学习了 R 语言中一种重要的数据结构（即数据框）。您了解了如何从这些数据框包含的数据中获取汇总信息。

  - 您探索了散点图如何展示数据框中各个特征之间的关系，从而帮助我们以图形方式轻松地更好地理解这些关系。

  - 您探索了商业分析的另一个重要方面——概率，它影响着商业分析中使用的许多技术（贝叶斯技术、决策树等）。

  - 您学习了重要的概率分布及其含义。您还看了一些概率分布的例子，以及如何使用 R 语言通过一些流行的分布（如正态分布、二项分布和泊松分布）来解决商业问题。


