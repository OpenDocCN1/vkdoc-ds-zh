  \ = No` 的优势为 `(0.05 / (1 – 0.05)) × 91.97 = 4.8376`。这对应于 `Attrition = No` 的概率为 `4.8376\
  \ / (1 + 4.8376) = 0.8286`，即约 82.86%。在其他所有变量保持不变的情况下，与 `Compensation = High` 相比，当\
  \ `Compensation = Low` 时，发生 `Attrition = Yes` 的优势是不发生任何 `Attrition` 的 `exp(2.7090)\
  \ = 15.02` 倍。`Work_Envir = Low` 和 `Compensation = Low` 都会增加 `Attrition = Yes` 的可能性。\n\
  \n然而，另外两个变量 `Work_Challenging = Yes` 和 `Tech_Exper = Low` 的系数带负号，意味着它们降低了 `Attrition\
  \ = Yes` 的可能性。在其他所有变量保持不变的情况下，与 `Work_Challenging = No` 相比，系数值为 –3.4632 的 `Work_Challenging\
  \ = Yes` 将 `Attrition = Yes` 的可能性降低了 `exp(–3.4632) = 0.0313`。同理，在其他所有变量保持不变的情况下，与\
  \ `Tech_Exper = High` 相比，系数值为 –3.8547 的 `Tech_Exper = Low` 将 `Attrition = Yes` 的可能性降低了\
  \ `exp(–3.8547) = 0.0211`。\n\n由此可见，对 `Attrition` 的主要影响主要来自 `Work_Envir` 和 `Compensation`。\n\
  \n### 10.1.3 模型拟合验证\n\n验证模型拟合对我们来说很重要。这可以通过计算伪 R 平方值来实现。该值使用公式 `1 – (model$deviance\
  \ / model$null.dev)` 计算，告诉我们模型解释偏差的程度。以下代码展示了如何使用 R 计算该值：\n\n![A978-1-4842-2514-1_10_Figi_HTML.jpg](img/A978-1-4842-2514-1_10_Figi_HTML.jpg)\n\
  \n该计算结果表明模型解释了 63.65% 的偏差。你也可以使用 `library(pscl)` 和 `pR2(model_name)` 来计算伪 R 平方值。\n\
  \n另一种验证模型拟合的方法是使用卡方方法计算 p 值，如下所示：\n\n```\np-value <- pchisq[(model_deviance_diff),(df_data\
  \ – df_model),lower.tail=F]\n```\n\n此处，`df_data` 可通过 `nrow(data_set) – 1` 计算，在我们的案例中为\
  \ `nrow(attrition_data) – 1`；`df_model` 可通过 `model$df.residual` 计算；`model_deviance_diff`\
  \ 可计算为 `model$null.dev – model$deviance`。相关计算如下所示：\n\n![A978-1-4842-2514-1_10_Figj_HTML.jpg](img/A978-1-4842-2514-1_10_Figj_HTML.jpg)\n\
  \n由于 p 值非常小，偏差的减少不能被认为是偶然发生的。由于 p 值显著，该模型拟合良好。\n\n### 10.1.4 一般注意事项\n\n在生成逻辑模型时，可能会抛出以下警告信息：\n\
  \n![A978-1-4842-2514-1_10_Figk_HTML.jpg](img/A978-1-4842-2514-1_10_Figk_HTML.jpg)\n\
  \n这可能是由于数据或部分数据完美预测了响应变量。这被称为分离或准分离问题。\n\n以下是关于逻辑回归模型的一些一般注意事项：\n\n-   当零偏差小于残差偏差时，我们会遇到问题。\n\
  -   当收敛需要大量费雪评分迭代时，我们会遇到问题。\n-   当系数数值较大且标准误差显著较大时，我们会遇到问题。\n\n在这些情况下，我们可能需要重新审视模型，再次检查每个系数。\n\
  \n### 10.1.5 多重共线性\n\n我们在第 9 章中讨论了多重共线性。在 R 中，使用 `vif(model name)` 函数可以轻松发现多重共线性。VIF\
  \ 代表方差膨胀因子。通常，通过多重共线性检验的经验法则是 VIF 值应大于 5。以下检验展示了 VIF 的计算：\n\n![A978-1-4842-2514-1_10_Figl_HTML.jpg](img/A978-1-4842-2514-1_10_Figl_HTML.jpg)\n\
  \n如您所见，我们的模型不存在多重共线性问题。\n\n### 10.1.6 离散度\n\n对于某些回归模型（包括逻辑回归模型），离散度（因变量的方差）高于值 1（如二项族逻辑回归离散度参数摘要中所述取值为\
  \ 1）是一个潜在问题。这被称为过度离散。当因变量的观测方差大于使用二项分布（即 1）所预期的方差时，就会发生过度离散。这会导致显著性检验的可靠性问题，因为其可能会对标准误差产生不利影响。\n\
  \n可以使用 R 轻松判断模型是否存在过度离散问题，如下所示：\n\n![A978-1-4842-2514-1_10_Figm_HTML.jpg](img/A978-1-4842-2514-1_10_Figm_HTML.jpg)\n\
  \n我们生成的模型 `attri_logit_model_2` 不存在过度离散问题。如果逻辑回归模型确实存在过度离散问题，则需要在 `glm()` 函数中使用准二项分布（quasibinomial\
  \ distribution）来代替二项分布（binomial distribution）。\n\n### 10.1.7 逻辑回归结论\n\n针对我们的数据，我们创建了一个良好的逻辑回归模型，并已验证了其显著性和拟合优度。该模型不存在多重共线性或过度离散问题。\n\
  \n> **注意**  \n> 在大多数情况下，在 `glm()` 函数中使用 `family=binomial(link=\"probit\")` 与使用 `family=binomial(link=\"\
  logit\")` 效果相似。对于 `logit`，你可以直接在 `glm()` 中使用 `family=binomial()` 而无需指定 `link=\"\
  logit\"`，因为两者产生的结果相同。\n\n## 10.2 训练和测试模型\n\n我们也可以使用数据集的单独子集来训练模型（即创建模型）和测试模型。理想情况下，这些数据集应是随机生成的。通常，将数据集的\
  \ 75% 到 80% 用于训练模型，另外的 25% 到 20% 用于测试模型。\n\n让我们使用之前使用的相同数据集来执行此操作。我们需要运行 `install.packages(\"\
  caret\")` 并使用 `library(caret)`。以下是使用 R 将数据集分为两个子集（训练数据集和测试数据集）的方法：\n\n![A978-1-4842-2514-1_10_Fign_HTML.jpg](img/A978-1-4842-2514-1_10_Fign_HTML.jpg)\n\
  \n整个数据集被随机拆分为两个子集（`Training_Data` 和 `Test_Data`）。现在，`Training_Data` 中有 43 条记录，`Test_Data`\
  \ 中有 9 条记录。\n\n我们现在使用机器学习概念训练我们的 `Training_Data` 以生成一个模型：\n\n![A978-1-4842-2514-1_10_Figo_HTML.jpg](img/A978-1-4842-2514-1_10_Figo_HTML.jpg)\n\
  \n\n\n如你所见，生成的模型（`train_logit_model`）经过 18 次费希尔评分迭代后收敛，其中`Tech_ExperLow`的系数和标准误极大。因此，该模型可能用处不大。出于这个原因，我们无法继续使用训练模型基于`Test_Data`中的记录来预测`Attrition`。但是，如果我们能成功构建一个训练模型，就可以按以下步骤进行进一步分析：\n\
  \n1. 使用训练数据生成的模型预测测试数据的响应变量，并将预测数据存储在测试数据集中。\n2. 将响应变量的预测值与测试数据集中响应变量的实际值进行比较。\n\
  3. 生成混淆矩阵，以理解真正例（`TP`）、真反例（`TN`）、假正例（`FP`）和假反例（`FN`）。\n   - 真正例是实际为正类（1）且被预测为正类（1）的样本。\n\
  \   - 真反例是实际为负类（0）且被预测为负类（0）的样本。\n   - 假正例是被预测为正类（1）但实际为负类（0）的样本。\n   - 假反例是被预测为负类（0）但实际为正类（1）的样本。\n\
  4. 检查准确率、特异性和敏感度：\n   - 准确率 = （`TP` + `TN`） / 总观测数\n   - 特异性 = 真负类率 = `TN` / （`FP`\
  \ + `TN`）\n   - 敏感度 = 召回率 = 真正类率 = `TP` / （`FN` + `TP`）\n   - 此外，还可以考虑精确率 = `TP`\
  \ / （`FP` + `TP`）和 F1 分数 = `2TP` / （`2TP` + `FP` + `FN`）。\n\n通常期望获得较高的准确率、较高的敏感度和较高的特异性。检查这些数值是否符合预测的目标。如果预测结果会影响人员的安全或健康，我们必须确保最高的准确率。在这种情况下，每个预测值都应谨慎确定，并在必要时通过其他方法进一步验证。\n\
  \n## 预测响应变量\n\n最初拟合的模型（`attri_logit_model_2`）不仅解释了响应变量与自变量之间的关系，还提供了一种根据新自变量的值预测响应变量值的机制。具体操作如下所示：\n\
  \n![A978-1-4842-2514-1_10_Figp_HTML.jpg](img/A978-1-4842-2514-1_10_Figp_HTML.jpg)\n\
  \n如果预测返回的概率 > 0.5，我们将`Attrition`的值取为`Yes`；如果预测返回的概率不大于 0.5，则取为`No`。如上述代码所示，该值远低于\
  \ 0.5，因此我们可以安全地假设`Attrition = No`。\n\n上述预测是通过使用函数 `predict(model name, newdata=dataframe_name,\
  \ type=\"response\")` 来确定的，其中 `model name` 是根据输入数据得到的模型名称，`newdata` 包含需要预测响应变量的自变量数据，`type=\"\
  response\"` 是为了确保输出结果不是 `logit(y)`。\n\n## 验证逻辑回归模型的替代方法\n\n正如我们所说，我们无法使用训练数据生成一个有效的模型，因此也无法使用测试数据对其进行验证。但是，我们使用完整的数据集（`attrition_data`）生成了一个模型（`attri_logit_model_2`）并对其进行了验证。另一种验证此类模型的方法如下：\n\
  \n1. 我们使用生成的模型，通过在生成模型所用的完整数据集上执行 `predicted_value <- predict(model, type=\"response\"\
  )` 来预测因变量值（logit）：\n\n![A978-1-4842-2514-1_10_Figq_HTML.jpg](img/A978-1-4842-2514-1_10_Figq_HTML.jpg)\n\
  \n2. 然后生成一个混淆矩阵：\n\n![A978-1-4842-2514-1_10_Figr_HTML.jpg](img/A978-1-4842-2514-1_10_Figr_HTML.jpg)\n\
  \n从混淆矩阵中可以清晰地看到，该模型生成了非常高的真正例和真反例。\n\n3. 现在我们使用`ROCR`包及其中的`prediction()`函数，如下所示：`prediction_object\
  \ <-prediction(predicted_value, dataset$dependent_variable)`。这样，我们就创建了一个`prediction_object`：\n\
  \n![A978-1-4842-2514-1_10_Figs_HTML.jpg](img/A978-1-4842-2514-1_10_Figs_HTML.jpg)\n\
  \n4. 使用`ROCR`包中的`performance()`函数对`prediction_object`进行操作，我们得到 TPR = `TP` / (`FN`\
  \ + `TP`) = `TP` / (所有正类) 和 FPR = `FP` / (`FP` + `TN`) = `FP` / (所有负类)，然后将 TPR 对\
  \ FPR 作图，得到接收者操作特性 (ROC) 曲线。这通过 `plot(performance(prediction_object, measure = \"\
  tpr\", x.measure = \"fpr\")` 实现。或者，我们可以使用 `plot(performance(prediction_object, measure\
  \ = \"sens\", x.measure = \"spec\")` 生成敏感度/特异性图，或使用 `plot(performance(prediction_object,\
  \ measure = \"prec\", x.measure = \"rec\")` 生成精确率/召回率图。此处展示了用于生成 ROC 曲线的第一个 R 命令，以及生成的曲线（见图\
  \ 10-1）：\n\n![A978-1-4842-2514-1_10_Fig1a_HTML.jpg](img/A978-1-4842-2514-1_10_Fig1a_HTML.jpg)![A978-1-4842-2514-1_10_Fig1b_HTML.gif](img/A978-1-4842-2514-1_10_Fig1b_HTML.gif)\n\
  \n图 10-1. 生成的 ROC 曲线\n\n该 ROC 曲线清晰地表明，该模型几乎没有产生假正例，并产生了很高的真正例。因此，我们可以得出结论，生成的模型是一个好模型。\n\
  \n## 多项逻辑回归\n\n多项逻辑回归用于水平数超过两个的分类或离散因变量。自变量可以是分类变量或连续变量。然而，生成和评估这些模型的方法并不直接且较为繁琐。这些需要对底层数学和统计学有深入的理解。因此，我们不在本书中介绍这部分内容。\n\
  \n但是，对于水平数超过两个且无序的因变量，可以使用 `mlogit` 包中的 `mlogit()` 函数或 `nnet` 包中的 `multinom()` 函数来生成多项逻辑回归。\n\
  \n对于水平数超过两个且有序的因变量，可以使用 `rms` 包中的 `lrm()` 函数来生成多项逻辑回归。\n\n## 正则化\n\n正则化是一个复杂的主题，我们在此不作详细讨论。然而，我们会对这个概念进行介绍，因为它是统计学中一个重要的方面，你需要结合统计模型来理解它。\n\
  \n正则化是通常用于避免过拟合的方法。当我们不断向模型添加参数以提高其准确性和拟合度时，在某些时候，使用该模型的预测能力反而会下降。由于引入了过多参数，我们是在对数据进行过拟合，从而失去了泛化的价值，而泛化本可使模型在预测中更有用。\n\
  \n通过使用向前选择、向后剔除和子集选择法等模型拟合方法，我们试图避免过拟合，从而使模型更具普遍性，在预测未来值时更有用。这将确保在关联测试数据时，偏差和方差都较小。\n\
  \n当数据集中的参数数量多于数据观测数量，且最小二乘法无法发挥作用（因为它会导致拟合同一数据的模型众多，而非单一的唯一模型）时，正则化也非常有用。在这种情况下，正则化使我们能够找到一个合理的解决方案。\n\
  \n\n\n"
- '# 收缩方法


  收缩方法是最常用的正则化方法。它们通过在回归模型中添加一个惩罚项来实现正则化。我们通过向损失函数中添加一个正则化范数的倍数（`λ`，也称为收缩参数）来对其进行惩罚，例如线性回归权重向量的
  Lasso 或 Ridge（也称为收缩惩罚）。我们可以使用交叉验证来获得最佳的倍数（`λ` 值）。模型越复杂，惩罚力度越大。我们使用 `L[1]` 正则化器（Lasso）或
  `L[2]` 正则化器（Ridge）。正则化会缩小系数估计值以降低方差。


  Ridge 回归会缩小参数估计值，但不会将其缩减至 0，而 Lasso 回归会将某些参数的估计值缩小至 0。对于 Ridge，拟合度会随着 `λ` 值的增加而增加，同时方差值也会增加。这可能导致参数估计值大幅增加，即使训练数据发生微小变化也是如此，并且随着参数数量的增加而加剧。Lasso
  创建的模型更简单，因此更易于预测。


  '
- '# 对人员流失数据应用正则化


  让我们在剔除 `Yrs_Exp` 的数据集 `attrition_data` 上探讨正则化的概念。我们不将 `Yrs_Exp` 纳入考虑，因为我们知道它并不显著。


  我们使用 `glmnet` 包中的 `glmnet()` 函数来确定正则化模型。我们使用 `glmnet` 包中的 `cv.glmnet()` 函数来确定最佳的
  lambda 值。对 Lasso 使用 `alpha=1`，对 Ridge 使用 `alpha=0`。我们使用 `family="binomial"` 和 `type="class"`，因为我们的响应变量是二元的，并且根据要求，我们是在逻辑回归的背景下使用正则化。


  `glmnet()` 函数要求输入为矩阵形式，响应变量为数值型向量。它通过惩罚最大似然法来拟合广义线性模型。正则化路径是在正则化参数 lambda 的一系列网格值上为
  Lasso 或弹性网络惩罚计算得出的。


  ## 函数格式


  该函数在 `glmnet` R 包中定义的通用格式如下：


  ```

  glmnet(x, y, family=c("gaussian",

  "binomial", "poisson", "multinomial", "cox", "mgaussian"),


  weights, offset=NULL, alpha = 1,

  nlambda = 100,


  lambda.min.ratio =

  ifelse(nobs<nvars,0.01,0.0001), lambda=NULL,


  standardize = TRUE, intercept=TRUE,

  thresh = 1e–07, dfmax = nvars + 1,


  pmax = min(dfmax × 2+20, nvars),

  exclude, penalty.factor = rep(1, nvars),


  lower.limits=–Inf, upper.limits=Inf,

  maxit=100000,


  type.gaussian=ifelse(nvars<500,

  "covariance", "naive"),


  type.logistic=c("Newton",

  "modified.Newton"),


  standardize.response=FALSE,

  type.multinomial=c("ungrouped", "grouped"))

  ```


  像往常一样，我们不会使用所有参数。为简单起见，我们将只使用绝对必要的参数。每个参数的详细信息，请查阅 `glmnet` 包指南。


  ## 准备输入


  我们将首先准备所需的输入。我们需要模型以矩阵格式作为 `glmnet()` 函数的输入。我们还需要将响应变量作为一个向量：


  ![A978-1-4842-2514-1_10_Figt_HTML.jpg](img/A978-1-4842-2514-1_10_Figt_HTML.jpg)


  解释摘要的内容超出了本书的范围，但我们将展示如何主要使用图形来进行正则化。为此，我们使用 `plot()` 函数。由于我们使用的是二元数据和逻辑回归，我们使用
  `xvar="dev"`（其中 `dev` 代表偏差）和 `label = TRUE` 来在图中识别作为 `plot()` 函数输入的参数：


  ![A978-1-4842-2514-1_10_Fig2a_HTML.jpg](img/A978-1-4842-2514-1_10_Fig2a_HTML.jpg)![A978-1-4842-2514-1_10_Fig2b_HTML.gif](img/A978-1-4842-2514-1_10_Fig2b_HTML.gif)


  **图 10-2.** 显示每个变量的偏差：两个有 + 系数，两个有 – 系数


  使用 `print()` 函数输出的 `glmnet_fit` 结果如下所示：


  ![A978-1-4842-2514-1_10_Figv_HTML.jpg](img/A978-1-4842-2514-1_10_Figv_HTML.jpg)


  ![A978-1-4842-2514-1_10_Figu_HTML.jpg](img/A978-1-4842-2514-1_10_Figu_HTML.jpg)


  这主要显示了自由度（非零系数的数量）、模型解释的零偏差百分比以及 lambda 值。如您所见，lambda 值持续减小。随着 lambda 值减小，模型解释的偏差百分比增加，显著的非零系数数量也随之增加。尽管我们为函数提供了
  `nlambda = 100`（这是默认值），但仅显示了 68 个 lambda 值。这是因为算法确保在发现模型解释的偏差百分比没有进一步显著变化时，在最佳时机停止。


  '
- '# 在特定 Lambda 值处进行预测


  现在，我们将在 lambda = 0.05 处预测类别标签。这里 `type = "class"` 指的是响应类型：


  ![A978-1-4842-2514-1_10_Figw_HTML.jpg](img/A978-1-4842-2514-1_10_Figw_HTML.jpg)


  如您所见，所有四个值都被准确预测，因为它们与我们数据集的前四行匹配。


  '
- '# 正则化模型的交叉验证


  现在，我们将通过使用 `glmnet` 包中的 `cv.glmnet()` 函数对正则化模型进行交叉验证。该函数对 `glmnet` 执行 k 折交叉验证，生成一个图，并返回
  lambda 的最小值。它还返回一个标准误范围内的 lambda 值。该函数默认执行 10 折交叉验证。如果需要，我们可以更改 k 折数。这里我们使用 `type.measure
  = "class"`，因为我们使用二元数据和逻辑回归。这里，`class` 给出的是误分类错误：


  ![A978-1-4842-2514-1_10_Figx_HTML.jpg](img/A978-1-4842-2514-1_10_Figx_HTML.jpg)


