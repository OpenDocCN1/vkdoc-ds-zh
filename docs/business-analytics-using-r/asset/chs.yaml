  ## 7.6 关联规则


  另一种重要的无监督机器学习概念是关联规则分析，也称为亲和性分析或购物篮分析（MBA）。这种分析通常用于发现“什么商品与什么商品搭配”，并且主要用于研究客户交易数据库。关联规则提供了一种简单的分析方式，表明当某个事件发生时，另一个事件会以一定的概率发生。发现海量交易数据库记录之间的关系，有助于更好地进行营销、库存管理、产品促销、推出新产品以及其他业务决策过程。关联规则通过使用简单的
  if-then 规则结构来表明关系，这些规则是根据数据计算得出的，本质上是概率性的。


  典型的例子是零售营销。如果零售部门想找出哪些商品经常被一起购买，可以使用关联规则分析。这有助于商店管理库存、提供促销活动和推出新产品。这种购物篮分析还有助于零售商提前规划销售，并知道哪些商品应该降价促销。例如，这种分析可以表明购买手机的客户是否也会购买屏幕保护膜或手机壳，或者客户是否会一起购买牛奶和面包（见图
  7-9）。然后这些商店可以推广手机壳，或者为购买牛奶的顾客提供促销价格的新鲜面包。这些优惠可能会鼓励顾客以优惠价格购买新产品。


  ![A978-1-4842-2514-1_7_Fig9_HTML.gif](img/A978-1-4842-2514-1_7_Fig9_HTML.gif)


  **图 7-9.** 购物篮分析


  有几种算法可以生成 if-then 关联规则，但经典的算法是 Agrawal 和 Srikant（1993 年）提出的 Apriori 算法。该算法很简单。它首先从仅包含一个商品的频繁项集（一个商品项集）开始生成，然后生成包含两个经常一起购买的商品的项集（两个商品项集），接着继续生成包含三个经常一起购买的商品的项集（三个商品项集），以此类推，直到生成所有频繁项集。一旦生成了所有频繁项集的列表，就可以找出数据库中有多少个这样的频繁项集。例如，有多少个两个商品项集，有多少个三个商品项集，等等。通常，生成`n`个商品项集会用到频繁的`n-1`个商品项集，并且需要对数据库进行一次完整的扫描。因此，即使对于包含许多不同商品的大型数据库，Apriori
  算法也更快。关键思想是从仅包含一个商品的频繁项集（一个商品项集）开始生成，然后递归地生成两个商品项集，接着是三个商品项集，以此类推，直到我们生成了所有尺寸的频繁项集。


  ### 7.6.1 选择规则


  一旦生成了规则，目标是找到那些表明商品之间强关联的规则，并表明集合中前项（前一个商品）和后项（下一个商品）之间的依赖关系。使用三种度量指标：支持度、置信度和提升度。


  #### 7.6.1.1 支持度和置信度


  项集`I`定义为商店中所有商品的集合，`I = { i[1], i[2], i[3],….i[m] }`，来自所有交易数据库`T`。每个`t[i]`是一个商品集合`t`，使得`t
  ε I`。为每个交易`t[i]`分配一个交易 ID。


  支持度简单来说就是同时包含前项和后项项集的交易数量。它表示为数据库中总记录数的百分比。


  `B --> A`，（B 跟随 A），其中`A`和`B`是项集。例如：


  `{牛奶, 果酱} ➤ {巧克力}`


  支持度（S）是同时包含`A`和`B`（前项和后项）的交易比例。


  例如，数据集中两个商品项集`{面包, 果酱}`的支持度是 5 条记录，总共 10 条记录，即`(5/10) = 50%`。你可以定义一个支持度数值，并在分析中忽略其他项集。如果支持度非常低，则不值得进一步检查。


  置信度（`A --> B`）是`A & B`（即前项和后项一起）的支持度与`A`的支持度之比。它表示为同时包含`A`和`B`的交易数量与包含`A`的交易数量之比：


  ![$$ conf\left( A\to B\right)=\frac{\frac{numTrans\left( A\cup B\right)}{\left|
  D\right|}}{\frac{numTrans(A)}{\left| D\right|}}=\frac{p\left( A\hat{\mkern6mu} B\right)}{p(A)}=
  p\left( B\Big| A\right) $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equj.gif)


  置信度值高表明存在强关联规则。但是，当`B`独立于`A`——即`p(B) = p(B | A)`——并且`p(B)`很高时，我们就会得到一个具有高置信度的规则。例如，如果`p(“买果酱”)
  = 85%`并且独立于“买面包”，那么规则`“买面包” ⇒ “买果酱”`的置信度将为 85%。如果几乎所有顾客都买面包，并且几乎所有顾客都买果酱，那么无论这两个商品之间是否存在关联，置信度水平都会很高。


  #### 7.6.1.2 提升度


  尽管支持度和置信度是显示关联规则强度的良好度量指标，但有时它们可能具有欺骗性。例如，如果前项或后项具有高支持度，即使两者独立，我们也可能得到高置信度。一个更好的度量指标是将关联规则的强度与假设后项商品在交易中发生与前项商品出现无关的情况下的置信度进行比较。


  ![$$ lift\left( A\to B\right)=\frac{conf\left( A\to B\right)}{p(B)}=\frac{\frac{p\left(
  A\hat{\mkern6mu} B\right)}{p(A)}}{p(B)}=\frac{p\left( A\hat{\mkern6mu} B\right)}{p(A)
  p(B)} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equk.gif)


  换句话说，


  `提升度(A --> B) = 支持度(A & B) / [支持度(A) x 支持度(B)]`


  下面的示例（图 7-10）展示了三种值，即支持度、置信度和提升度。对于以下的项集，我们计算支持度、置信度和提升度比率：


  - 交易 1: 衬衫, 裤子, 领带, 腰带

  - 交易 2: 衬衫, 腰带, 领带, 鞋子

  - 交易 3: 袜子, 领带, 衬衫, 夹克

  - 交易 4: 裤子, 领带, 腰带, 西装外套

  - 交易 5: 裤子, 领带, 帽子, 毛衣


  让我们使用定义计算上述示例的支持度、置信度和提升度。对于 `A --> B`：


  - `支持度(A & B) = 频次(A & B) / N`（其中`N`是数据库中的总交易数）

  - `置信度(A --> B) = 支持度(A & B) / 支持度(A) = 频次(A & B) / 频次(A)`

  - `提升度(A --> B) = 支持度(A & B) / [支持度(A) x 支持度(B)]`


  ![A978-1-4842-2514-1_7_Fig10_HTML.gif](img/A978-1-4842-2514-1_7_Fig10_HTML.gif)


  **图 7-10.** 关联规则示例


  请注意，关联规则并不一定表示两个商品之间的因果关系或相关性。`A --> B`并不意味着`B`导致`A`，或者说没有因果关系，并且`A --> B`可以不同于`B
  --> A`，这与相关性不同。


