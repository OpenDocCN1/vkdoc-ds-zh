  ![A978-1-4842-2514-1_5_Fig14_HTML.jpg](img/A978-1-4842-2514-1_5_Fig14_HTML.jpg)


  **图 5-14.** 监督式机器学习


  在此示例中，分类器模型基于训练数据集开发。该数据集有一组文档（数据），这些文档已在人工和专家监督下被手动分类并标记到不同类别中。这被称为训练数据集。分类算法（模型）基于已经具有类别标签的训练数据集进行学习。一旦学习完成，该模型即可用于对标签未知的文档（新数据）进行分类。常见的分类监督式学习算法包括支持向量机、朴素贝叶斯、k-最近邻和决策树。


  #### 非监督式机器学习


  在非监督式机器学习中，没有用于学习的训练数据。因此，没有要预测的目标变量。关联规则和聚类是非监督式学习的例子。在非监督式学习中，所有数据集观察结果都投入学习，结果可能是不同聚类或两个变量之间的关联。由于没有要自行识别的结果类别，因此需要进一步分析来正确理解模型的结果。


