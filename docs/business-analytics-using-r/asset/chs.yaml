- '# Hadoop 框架与生态系统


  Apache Hadoop YARN 是一种用于资源调配、管理以及作业调度/监控活动的工具。


  Apache Pig 能够分析海量数据。该平台使用一种简单的脚本语言，允许用户创建自己的程序，以补充 Pig 预定义函数的功能。Pig 的编译器会生成一系列 MapReduce
  程序。因此，这消除了编写冗长繁琐的 MapReduce 程序的需求。Pig 还具备执行并行处理的能力。


  Apache Mahout 提供了用于编写可扩展机器学习算法和应用程序的环境与编程能力。如今，Mahout 包含了 Samsara，一个向量数学实验环境。


  Apache Hive 通过提供 SQL 能力，实现了对数据的读取、写入和管理。


  Apache HBase 是 Hadoop 的分布式数据库，具有高可扩展性和巨大的存储能力。它提供对数据的实时访问。HBase 是 Hadoop 的一个 NoSQL
  数据库。


  Apache Storm 能够以 Hadoop MapReduce 处理批处理的方式，实现数据流的分布式实时处理。Storm 是一个计算引擎，能够执行持续计算、实时分析、在线机器学习以及许多其他相关功能，例如分布式
  RPC。


  Apache Oozie 实现了有效的工作流调度，以管理 Apache Hadoop 作业。它与 Apache Hadoop 生态系统中的其他工具集成得非常好。


  除了这些工具之外，NoSQL（最初指“不仅仅是 SQL”）数据库，例如 Cassandra、ArangoDB、MarkLogic、OrientDB、Apache
  Giraph、MongoDB 和 Dynamo，也都极大地支持或补充了大数据生态系统。这些 NoSQL 数据库能够有效地存储和分析多维的、结构化或非结构化的海量数据。这极大地推动了整合来自不同来源的数据以进行分析的工作。


  目前，Apache Spark 的使用势头正盛。Apache Spark 是一个用于大数据处理的快速通用引擎，内置了流处理、SQL、机器学习和图处理模块。Apache
  Spark 是近年来一个有趣的发展成果，它提供了一个极其快速的数据处理和分析引擎。它允许为用 R、Java、Python 或 Scala 编写的应用程序提供简单的接口。Apache
  Spark 拥有一系列库，例如 MLib（机器学习）、Spark Streaming、Spark SQL 和 GraphX。它既可以独立模式运行，也可以在 Hadoop
  上运行。同样，它可以访问各种数据源，从 HBase 到 Cassandra，再到 HDFS。许多用户和组织都对这个工具表现出兴趣并开始使用它，导致它在短时间内变得非常流行。这个工具为大数据用户和组织带来了巨大的希望。


  诸如 Microsoft Business Intelligence 和 Tableau 等工具提供了仪表盘和数据可视化功能。这些工具使组织能够从数据中学习，并利用这些学习成果来制定战略或改进其运营或流程的方式。


  以下是使用 Hadoop 进行大数据处理的一些优势：


  -   在任何廉价通用硬件上实现简单的并行架构

  -   内置的容错系统，以及应用级别的故障检测和高可用性

  -   无需中断即可动态修改集群

  -   轻松向集群添加或从集群移除机器

  -   基于 Java，平台无关


  Microsoft Azure、Amazon 和 Cloudera 是提供用于有效大数据分析的云设施和服务的一些主要供应商。


  ## 11.2 大数据分析的未来趋势


  大数据的应用以及使用大数据分析的领域正在逐年增加。本节介绍了一些未来几年将加速发展的趋势。


  ### 11.2.1 社交媒体的增长


  在短时间内，社交媒体产生了极其大量的数据，并且这一趋势几乎呈指数级增长。这些与全球各地人们相关的数据，让组织了解到了迄今未知的事实和数字。这促使这些组织以不同的方式思考并制定不同的战略。


  ### 11.2.2 数据湖的创建


  组织正从各种来源获取数据。但他们往往不知道数据的价值。他们甚至不看数据提供的价值就直接将其倾倒入数据湖。一旦数据进入数据湖，组织便会寻找模式，或者让数据“自我发现”。这种态度对于未来发展具有巨大价值。


  ### 11.2.3 业务用户手中的可视化工具


  在竞争日益激烈的背景下，数据分析师分析数据到向业务部门呈现数据之间的延迟已不再被接受。企业需要快速采取行动，以有效利用从数据中获得的知识。诸如 Microsoft
  Business Intelligence、Tableau 和 SAS Visual Analytics 等工具为业务用户提供了巨大的实用价值。更多的可视化有助于业务用户快速理解模式和趋势，并做出有效、及时的决策。工具的能力正趋向于动态化，以描绘这些可视化图表或仪表盘所展现的数据中额外的方面。


  ### 11.2.4 规范性分析


  数据分析不再仅仅专注于理解数据中隐藏的模式或价值。未来的趋势是基于过去和当前情况，规定应采取的行动，而无需人工干预。这在医疗保健和航空航天等领域将具有巨大价值。


  ### 11.2.5 物联网


  物联网是未来的驱动力。它有能力从各种来源获取数据，例如家用电器、工业机器、气象设备、自动驾驶汽车的传感器，甚至人体。这有可能产生海量数据，这些数据可以被分析并用于为潜在的未来和当前问题提供主动解决方案。这也可能导致重大的创新和改进。


  ### 11.2.6 人工智能


  神经网络可以驱动人工智能——特别是，让海量数据无需任何人工干预、特定编程或特定模型的需求即可自我学习。深度学习就是这样一种正在推动大数据领域发展的领域。这可能会揭示许多我们尚未意识到的“是什么”。我们可能无法理解其中一些的“为什么”，但它们的“是什么”可能非常有用。因此，我们可能会逐渐摆脱总是寻找因果关系的视角。机器学习领域被开发和使用的速度，极大地推动了这一领域的重视。此外，自然语言处理（NLP）和属性图（PG）也可能推动新的应用程序设计和开发，将这些技术的能力交到组织和用户手中。


  ### 11.2.7 全量数据处理


  借助现有的基础设施和当前可用的工具支持水平（尤其是在云端），大多数情况下可以分析完整的数据集，而不是抽取数据样本进行分析。这避免了抽样的缺点。使用海量数据引导我们朝着正确的方向前进，即使这些数据可能不完整或不完美。我们不必总是寻找完美的数据。


  ### 11.2.8 纵向与横向应用




  '
- '# 分析趋势


  分析领域正朝着整合特定行业（如医疗保健、银行和汽车）的垂直应用方向发展。另一方面，横向应用则跨越多个行业领域，包括消费者购买行为、交易监控（用于预防欺诈和洗钱），以及了解客户为何离开特定品牌或组织。


  ### 11.2.9 实时分析


  各类组织都渴望了解自身面临的机遇。他们希望实时掌握正在发生的事情——例如，某个特定的人在购买什么，或者计划购买什么——并适时利用这一机会，提供最佳的解决方案、折扣，或交叉销售相关产品或服务。组织不再满足于延迟的数据分析，因为那样会因未能实时了解情况而错失商机。


  ### 11.2.10 让分析工具触达业务用户


  人们一直观察到，数据分析师将分析结果提交给业务用户之前存在延迟。由于这种时间上的损失，即使分析结果很出色，也可能毫无用处，无法帮助组织制定有效的策略。相反，让工具对业务用户更有用、更可直接使用，使他们能够及时做出决策，这将使业务用户处于有利地位。整个世界正朝着在很大程度上实现这一目标的方向发展。


  ### 11.2.11 解决方案在不同工具间的迁移


  工具多样化意味着为一种工具提供的解决方案不容易迁移到其他系统。这主要是因为使用了不同的编程语言和环境。业界正致力于使来自一种工具的解决方案能够轻松地在其他工具上实现或迁移。预测模型标记语言（PMML）方面的努力已经在朝这个方向发展。数据挖掘小组（DMG）也正在这方面开展工作。


  ### 11.2.12 云，云，无处不在的云


  云中的数据和分析工具都为大数据分析提供了显著推动。越来越多的组织和机构正在使用云设施进行数据存储和分析。组织正从私有云转向公有云或混合云进行数据存储和分析。这为组织带来了成本效益、可扩展性和高可用性。当然，安全性可能是一个问题，目前正在大力提升云的安全性。


  ### 11.2.13 数据库内分析


  数据库内分析通过在一定程度上解决治理问题，提高了安全性并减少了隐私担忧。组织在必要时可以省去数据分析的中间环节，例如数据仓库。对治理和安全问题更加关注的组织将为数据库内分析提供重要的推动力。许多供应商组织已经在这方面崭露头角。


  ### 11.2.14 内存分析


  内存分析的价值在于能够同时、在内存中驱动事务处理和分析处理。这对于那些需要根据分析结果立即进行干预的领域可能非常有帮助。一些组织已经采用了具有混合事务/分析处理（HTAP）的系统。然而，仅仅为了使用
  HTAP 而使用它可能用处不大，即使数据变化速率较慢，并且你仍然需要从各种不同系统中引入数据来进行有效分析。这反而可能造成过度设计，导致组织成本增加。


  ### 11.2.15 机器学习自主服务


  越来越多的组织，如果找不到可靠且经验丰富、能有效提供帮助的数据科学家，可能会转向机器学习自主服务（例如微软 Azure 机器学习工作室、亚马逊机器学习或 Google
  Prediction API）。


  ### 11.2.16 保障安全与合规性


  消费者和组织对信息安全与合规性要求的认识都在提高。这促使人们大力加强数据分析环境的安全性。这一趋势将持续下去，使工具和系统更加安全。不同国家的多样化要求可能会对数据的使用和保护方式施加某些限制。对于使用数据进行分析的组织来说，合规性很可能是一项挑战。


  ### 11.2.17 医疗保健


  医疗保健领域的大数据可用于预测流行病、预防疾病，以及改善基于价值的医疗保健和生活质量。各种现代设备（如智能手机、Fitbit 产品和计步器）会产生大量数据，例如，它们可以测量你每天走了多远或消耗了多少卡路里。这些数据可用于制定饮食计划或开药。其他非结构化数据——例如医疗设备日志、医生笔记、化验结果、X
  光报告以及临床和实验室数据——其规模可能足以进行分析，以改善患者护理，从而提高效率。可用于大数据分析生成和处理的其他数据还包括：索赔数据、电子健康/医疗记录数据（EHR
  或 EMR）、制药研发数据、临床试验数据、基因组数据、患者行为和情感数据，以及医疗设备数据。


