  mathrm{x}}_{\\mathrm{m}}\\right)} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equg.gif)\n\
  \n### 7.2.4 两个簇之间的距离\n\n可以使用多种度量来找到两个簇之间的距离。最常用的度量是单链接、全链接、质心和平均链接。假设簇 `C` 包含 `m`\
  \ 条记录 `C[1]`, `C[2]`, `C[3]` … `C[m]`，簇 `B` 包含 `n` 条记录 `B[1]`, `B[2]`, `B[3]` …\
  \ `B[m]`。以下指标被广泛用于找到 `C` 和 `B` 簇之间的距离。\n\n#### 7.2.4.1 单链接（最小距离）\n\n`C[i]` 和 `B[j]`\
  \ 中两对记录之间的最短距离数学表示如下：\n\n`Min(distance(C[i], B[j]))`，其中 `i = 1, 2, 3, 4 … m`；`j\
  \ = 1, 2, 3 … n`\n\n图 7-2 展示了单链接方法。\n\n\n\n![A978-1-4842-2514-1_7_Fig2_HTML.jpg](img/A978-1-4842-2514-1_7_Fig2_HTML.jpg)\n\
  \n图 7-2. 单连接\n\n#### 7.2.4.2 全连接（最大距离）\n\n两个簇之间的距离定义为从一个簇中各取一个点后，它们之间的最远距离（见图 7-3）。两个簇\
  \ `Ci` 和 `B[j]` 中，各自记录之间的最远距离在数学上表示为：\n\n`Max (distance (Ci, B[j]))`，其中 `I = 1,\
  \ 2, … m`；`j = 1, 2, 3 … n`\n\n![A978-1-4842-2514-1_7_Fig3_HTML.jpg](img/A978-1-4842-2514-1_7_Fig3_HTML.jpg)\n\
  \n图 7-3. 全连接\n\n#### 7.2.4.3 平均连接（平均距离）\n\n该度量指标表示一个簇中每个点与另一个簇中每个点之间距离的平均值（见图 7-4）。一个簇中的记录与另一个簇中的记录之间的平均距离按如下公式计算：\n\
  \n`Average (distance(Ci, Bj))`，其中 `I =1, 2, 3 … m`；`j = 1, 2, 3 … n`\n\n![A978-1-4842-2514-1_7_Fig4_HTML.gif](img/A978-1-4842-2514-1_7_Fig4_HTML.gif)\n\
  \n图 7-4. 平均连接\n\n#### 7.2.4.4 质心距离\n\n质心是对该簇中所有记录求平均后得到的度量值。例如，在簇 `C` 中，质心 `![$$\
  \ \\overline{\\mathrm{X}}\\mathrm{a} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_IEq1.gif)`\
  \ = `![$$ \\left(\\frac{1}{\\mathrm{m}}{\\displaystyle \\sum_{\\mathrm{i}=1}^{\\\
  mathrm{m}}{\\mathrm{X}}_{1\\mathrm{i}}\\dots \\dots \\dots \\dots \\frac{1}{\\mathrm{m}}{\\\
  displaystyle \\sum_{\\mathrm{i}=1}^{\\mathrm{m}}{\\mathrm{X}}_{\\mathrm{pi}}\\dots\
  \ \\dots \\dots \\dots }}\\right) $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equh.gif)`\n\
  \n两个簇 `C` 和 `B` 之间的质心距离为 `![$$ \\left|\\overline{\\mathrm{X}}\\mathrm{a}\\hbox{--}\
  \ \\overline{\\mathrm{X}}\\mathrm{b}\\right| $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_IEq2.gif)`\n\
  \n## 7.3 层次聚类\n\n层次聚类具有从顶层到底层预定的顺序。例如，组织结构图或计算机硬盘上的所有文件和文件夹，都是以层级结构组织的。\n\n层次聚类的起始阶段，将单个数据集中的每个对象视为一个独立的簇。然后，在每次迭代中，基于距离和相似性准则，一个簇会与距离最近的簇合并（凝聚），直到所有数据形成一个簇。层次凝聚聚类算法如下：\n\
  \n1.  从 `n` 个簇开始。数据集中的每条记录自身可以是一个簇。\n2.  将两个最接近的案例观测值合并为一个簇。接近程度由相似性度量决定。\n3.  重复步骤\
  \ 2，直到形成一个单一的簇。每一步中，将具有最小距离度量的两个簇合并，直到所有记录和簇被组合成一个单独的簇。这样就创建了一个簇的层次结构。\n\n### 7.3.1\
  \ 树状图\n\n树状图展示了簇是如何在层级结构中合并的。树状图是一种树状结构，它总结了聚类过程并以图形方式展示了层级关系。相似的记录由连线连接，其垂直线的长度反映了两个记录之间的距离度量。图\
  \ 7-5 展示了一个树状图的示例。\n\n![A978-1-4842-2514-1_7_Fig5_HTML.gif](img/A978-1-4842-2514-1_7_Fig5_HTML.gif)\n\
  \n图 7-5. 树状图展示了簇如何在层级结构中合并\n\n### 7.3.2 层次聚类的局限性\n\n层次聚类易于理解和解释。它不需要用户指定要形成的簇的数量。然而，它存在以下局限性：\n\
  \n*   对于非常大的数据集，计算和存储 `n × n` 矩阵可能成本高昂且速度缓慢。\n*   它对异常值和缺失数据敏感。\n*   稳定性较低。对数据重新排序或删除少量记录可能导致不同的聚类结果。\n\
  *   当度量指标从一个度量值更改为另一个时，结果可能会发生变化。\n\n## 7.4 非层次聚类\n\n\n\n"
- '# 非层次聚类


  在非层次聚类中，需要预先指定聚类数量 `k[i]`，然后将每个案例分配到其中一个簇中，以使簇内的离散度最小化。其目标是将样本划分为若干预先确定的 `k` 个簇，使得这些簇在所用指标上尽可能同质。该算法旨在将
  `n` 个对象划分到 `k` 个最近的均值簇中。最终结果是产生 `k` 个具有明显区别的不同簇。这同样是一种无监督的机器学习、数值型和迭代方法。每个簇中至少包含一个项目。此
  K 均值聚类的目标是最小化总簇内方差，即误差平方函数：


  ![$$ \mathrm{E}={\displaystyle \sum_{\mathrm{I}=1}^{\mathrm{n}}{\displaystyle \sum_{\mathrm{I}=1}^{\mathrm{k}}\left|\right({\mathrm{x}}_{\mathrm{i}}\hbox{-}
  {\mathrm{m}}_{\mathrm{j}}{\left)\right|}²}} $$](img/A978-1-4842-2514-1_7_Chapter_TeX2GIF_Equi.gif)


  其中，`x` 是表示给定对象 `[i]` 的空间点，`m[i]` 是簇 `C` 的均值。当记录之间彼此分离良好时，该算法效果显著。


  ### 7.4.1 K 均值算法


  用于聚类的 K 均值算法步骤如下：


  1.  选择 `k`。可以是 1、2、3 或任意值。

  2.  随机选择 `k` 个点作为簇质心。

  3.  基于欧几里得度量，开始将对象分配到其最近的簇。

  4.  计算每个簇中所有对象的质心。

  5.  检查数据点与其所属簇质心的距离。如果最近，则保持不变。如果不是，则将其移动到下一个最近的簇。

  6.  重复上述步骤，直到覆盖所有数据点，且没有数据点从一个簇移动到另一个簇（簇稳定）。


  以下示例演示了 K 均值算法。


  ![A978-1-4842-2514-1_7_Figc_HTML.jpg](img/A978-1-4842-2514-1_7_Figc_HTML.jpg)


  ![A978-1-4842-2514-1_7_Figb_HTML.jpg](img/A978-1-4842-2514-1_7_Figb_HTML.jpg)


  第 3 次和第 4 次迭代之间没有变化，因此算法在此阶段停止。通过使用聚类，识别出了两个群体：15–28 和 35–65。初始随机选择的簇质心会影响输出簇，因此算法会以不同的初始条件多次运行，以便公平地了解簇应有的形态。


  ### 7.4.2 K 均值聚类的局限性


  K 均值是一种简单、相对容易且高效的方法。但是，您需要在开始时指定 `k`。不同的 `k` 值会改变结果和簇的形成。一种实用方法是比较具有不同 `k` 值的多次运行的结果，并根据预定义标准选择最佳的一个。较大的
  `k` 值可能会减少误差，但可能导致过拟合。


  选择初始 `k` 值受外部因素驱动，例如先验知识、实际约束或需求。如果我们不受这些因素影响，则随机选择；您可以尝试几个不同的值并比较生成的簇。在许多情况下，没有此类先验信息或知识可用，您可以使用不同的
  `k` 值运行算法，然后比较结果以减少生成不良簇。在比较不同 `k` 值的簇时，目标是确保距离总和随着 `k` 值的增加而减小。


