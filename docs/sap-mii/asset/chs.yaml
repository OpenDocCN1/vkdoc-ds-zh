  \n图 7-62. 具有各种图表类型的 i5SPC 图表示例\n\n##### i5SPC 图表：UI 中 i5SPC 图表的渲染选项\n\n在 HTML 页面中包含\
  \ i5SPC 图表的代码如下：\n\n```javascript\nvar i5SPCChart = new com.sap.xmii.chart.hchart.i5Chart(\"\
  Default/Saptaparna/i5SPCChart\", \"Default/Saptaparna/TagQuery\");\ni5SPCChart.setChartWidth(\"\
  400px\");\ni5SPCChart.setChartHeight(\"400px\");\ni5SPCChart.draw(\"SPCchartDiv\"\
  );\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n##### i5SPC\
  \ 图表特性\n\n以下是 `i5SPC` 图表的一些特性：\n\n- **控制限与规格限**：规格限是由用户/客户设置的公差值，适用于单个单元。控制限是控制图上的水平线，代表过程的边界。\n\
  - **控制限**：控制限指示过程的行为以及过程是否受控。上控制限（`UCL`）和下控制限（`LCL`）是根据查询中可用数据通过统计计算得出的。`UCL` 和\
  \ `LCL` 通过计算为稳定过程所收集的过程数据的均值、标准差和极差来设定。参见图 7-63。\n\n![A421506_1_En_7_Fig63_HTML.jpg](img/A421506_1_En_7_Fig63_HTML.jpg)\n\
  \n图 7-63. `i5SPC` 图表的控制限与规格限\n\n- **规格限**：规格限决定过程能力与西格玛值。可以为每个图表定义上规格限（`USL`）和下规格限（`LSL`）。控制限是基于历史数据计算得出的限值或平均值。\n\
  \n    1. **子组**：SPC 图表的一个重要方面是将数据收集组织成子组。每个子组必须处于受控状态。数据点要么是子组测量值的平均值，要么是绘制在标签和值列上的单个测量值。\n\
  \    2. **警告限**：控制图上的警告限是位于控制限之内的限值。可以定义上警告限和下警告限。当使用警告限时，控制限被称为行动限。默认情况下，警告限设置为\
  \ `2-西格玛`。使用警告限的优点是，它们比 `3-西格玛` 行动限能更快地发出过程变化的信号。当三个数据点中有两个位于图表中心线的 `2-西格玛` 和 `3-西格玛`\
  \ 之间时，考虑 `WECO` 规则。在控制图中：\n        - 如果均值位于警告限内，则不采取行动。\n        - 如果均值位于警告限和行动限之间，则再取一个样本。\n\
  \        - 如果均值位于行动限之外，则采取行动。\n\n        1. **内限**：内限设置在距离中心线 `+/- 1` 西格玛的位置。您可以设置上图表和下图表的内限。\n\
  \n#### i5ValueHelp\n\n`i5ValueHelp` 提供了从任何表中过滤正确输入数据的功能。如果在任何表中使用了值帮助，当用户在值帮助的文本字段中开始输入单词或单词的一部分时，表格会立即被过滤并返回任何匹配项。要使用值帮助，查询模板是必需的。\n\
  \n在 `i5ValueHelp` 配置中，可以配置四个属性：\n\n- 常规\n- 搜索结果\n- 搜索条件\n- 模板安全性\n\n## 动画对象\n\n\
  动画对象是用于诸如数字驾驶舱或仪表盘、标签生成、专用 `UI` 和报告组件等应用的自定义用户界面（`UI`）控件，您无需使用小程序或其他控件即可使用它们。\n\n\
  这些对象是在 `SAP MII Workbench` 中创建的，并基于可缩放矢量图形（`SVG`），这是一种用于表示矢量图形的基于 `XML` 的格式。\n\n\
  `SVG` 文件和动画对象通过 `SAP MII Workbench` 中“业务逻辑事务”下的“`SVG 渲染器`”和“`动画渲染器`”操作转换为图像文件。\n\
  \n### 配置动画对象\n\n请按照以下步骤创建动画对象：\n\n1. 可以使用 `SAP MII Workbench` 中的 `文件 ➤ 新建 ➤ 动画对象`\
  \ 菜单选项创建动画对象。\n2. 创建动画对象后，用于配置它的各种选项将出现在 Workbench 的左下面板中，如图 7-64 所示。\n\n![A421506_1_En_7_Fig64_HTML.jpg](img/A421506_1_En_7_Fig64_HTML.jpg)\n\
  \n图 7-64. 配置选项和一个动画对象示例\n\n### 选择 SVG 文档\n\n您可以选择一个 `SVG` 文档，它提供了用于渲染图像的动画对象定义。参见图\
  \ 7-65。\n\n![A421506_1_En_7_Fig65_HTML.jpg](img/A421506_1_En_7_Fig65_HTML.jpg)\n\
  \n图 7-65. 支持 `SAP MII` 的各种类型的动画对象\n\n### 动画对象的属性\n\n您可以查看动画对象的所有公共属性的列表。公共属性是动画对象的对象属性，可以从\
  \ `BLS` 事务中访问和操作，如图 7-66 所示。\n\n![A421506_1_En_7_Fig66_HTML.jpg](img/A421506_1_En_7_Fig66_HTML.jpg)\n\
  \n图 7-66. 动画对象的公共属性\n\n从公共属性配置中，用户可以创建或更新任何公共属性。除此之外，用户还可以在同一动画对象的计算属性下定义一些条件或计算。如果用户愿意，他们可以查看对象底层的\
  \ `XML`。用户还可以操作对象的内部和外部属性来控制动画，完成后，用户可以预览最终的动画对象。\n\n### 用于动画对象的操作块\n\n在 `MII Workbench`\
  \ 中，`MII` 提供了一组操作块，用于在网页上将动画对象渲染为图像：\n\n![A421506_1_En_7_Fig67_HTML.jpg](img/A421506_1_En_7_Fig67_HTML.jpg)\n\
  \n图 7-67. 在 `SAP MII` 中处理动画对象的操作块\n\n- **SVG 渲染器**：用于获取 `SVG` 文档并生成图像，该图像以支持的图像格式表示渲染后的图形。\n\
  - **动画渲染器**：用于生成带有应用于图像的动画的 `SVG` 文档。\n- **图像合成器**：用于合并两个生成的图像。\n- **图像创建器**：用于创建具有指定属性的图像。\n\
  - **图像缩放器**：用于将图像缩放到特定的高度和宽度。\n\n图 7-68 显示了在网页上查看动画对象所需的代码示例。\n\n![A421506_1_En_7_Fig68_HTML.jpg](img/A421506_1_En_7_Fig68_HTML.jpg)\n\
  \n图 7-68. 在网页中查看动画对象的代码示例\n\n\n\n## SAP UI5\n\n在 SAP MII（14.0 及以上版本）中，最佳实践是使用 SAP\
  \ UI5 前端技术。它也可以在早期版本中使用，但必须将完整的 UI5 库单独加载到 Workbench 中。SAP UI5（SAP 用户界面库用于 HTML\
  \ 5）是一个库集合，开发者可用其构建在浏览器中运行的桌面和移动应用程序。\n\nSAP UI5 提供丰富的互联网应用程序，因为它基于跨浏览器的 JavaScript\
  \ 库。SAP UI5 是一个轻量级编程模型，由标准和扩展控件组成。此外，您可以创建新的自定义控件或扩展现有控件。\n\n`i5Charts`、`i5Grids`\
  \ 和 `i5SPC` 图表使用 SAP UI5 的库以图形方式表示从数据源获取的数据。SAP MII 环境中的 SAP UI5 应用程序可以遵循 MVC（模型-视图-控制器）模式进行开发。参见图\
  \ 7-69。\n\n![A421506_1_En_7_Fig69_HTML.jpg](img/A421506_1_En_7_Fig69_HTML.jpg)\n\
  \n*图 7-69. SAP UI5 执行模型*\n\n**注意**：模型-视图-控制器（MVC）是一种架构模式，它将应用程序分为三个主要的逻辑组件：模型、视图和控制器。每个组件都旨在处理应用程序的特定开发方面。MVC\
  \ 是最常用的行业标准 Web 开发框架之一，用于创建可扩展和可伸缩的项目。\n\nMVC 包含三个概念。视图可以使用不同的语言来定义，例如 JavaScript\
  \ 或 HTML。控制器绑定视图以及视图中使用的模型。\n\n视图可以使用 XML 与 HTML、混合或独立方式来定义：\n* XML：`sap.ui.core.mvc.xmlview`\n\
  * JavaScript：`sap.ui.core.mvc.JSView`\n* JSON：`sap.ui.core.mvc.JSONView`\n* HTML：`sap.ui.core.mvc.HTMLView`\n\
  \n控制器绑定到一个视图。它们也可以与多个视图一起使用。\n\n在模型部分，数据绑定可以在视图中使用。参见图 7-70。\n\n![A421506_1_En_7_Fig70_HTML.jpg](img/A421506_1_En_7_Fig70_HTML.jpg)\n\
  \n*图 7-70. SAP UI5 数据绑定*\n\nSAP UI5 应用程序可以使用不同的视图来开发：\n* JS 视图\n* XML 视图\n* JSON\
  \ 视图\n* HTML 视图\n\nXML 视图是新引入的，主要用于类似 Fiori 的前端（使用 SAP UI5），并且可以部署在 Fiori Launchpad\
  \ 中。SAP Fiori 是 SAP 软件和应用程序的一种新用户体验（UX）。它提供了一组用于常规业务功能的应用程序，例如工作审批、财务应用、计算应用和各种自助服务应用。SAP\
  \ Fiori 支持多种设备应用程序，允许用户在桌面/笔记本电脑上启动一个进程，并在智能手机或平板电脑上继续该进程。SAP 基于 UI5 用户界面开发了 Fiori\
  \ 应用。\n\nSAP UI5（SAP 用户界面用于 HTML 5）是一个库集合，开发者可用其构建在浏览器中运行的桌面和移动应用程序。使用 SAP 的 SAP\
  \ UI5 JavaScript 工具包，开发者可以使用 HTML5 Web 开发标准构建 SAP Web 应用程序。\n\nSAP UI5 支持所有主流 Web\
  \ 浏览器及其最新版本，如 IE、Mozilla Firefox、Google Chrome 和 Safari。\n\n### SAP UI5 数据绑定\n\n\
  数据绑定由 UI5 控件用于保存应用程序数据。它允许您在对应用程序数据进行更改时自动更改控件。当使用双向数据绑定时，每当绑定控件的值发生变化时，应用程序数据就会更新。\n\
  \n#### 数据绑定模型类型\n\nSAP UI5 支持三种模型实现类型：\n* JSON 模型：支持 JavaScript 对象表示法格式的数据。支持双向数据绑定。\n\
  * XML 模型：支持 XML 数据。支持双向数据绑定。\n* OData 模型：创建 OData 请求并相应地处理响应。仅支持符合 OData 的数据。支持实验性的双向数据绑定。\n\
  \n## SSCE\n\nSAP MII 推出了自助服务组合仪表板（Self-Service Composition Dashboard），它集成在 SAP MII\
  \ 包中。使用 SSCE，您可以通过拖放 UI 组件并绑定相应的数据来轻松开发前端屏幕。此外，在后端，UI 代码会自动生成，并且可以在任何地方根据需要进行修改以生成所需输出。\n\
  \n它根据需求创建、设计、配置和显示完整的仪表板。它是一个基于角色的应用程序。要访问 SSCE 组件，必须为用户分配 `XMII_SSCE_ALL` 角色。主要\
  \ SSCE 特性和功能如下：\n\n* **仪表板创建**：使用任何 SAP MII 内容（查询模板、显示模板、MDO/KPI 对象和资源文件）、UI 元素和来自工厂信息目录的标签，可以创建仪表板。\n\
  * **所选对象的配置**：来自工厂信息目录（PIC）的选定标签可以放置在图像上。可以根据所选标签的所需条件配置颜色、图形和图标。当标签在 SSCE 上移动到空单元格时，会显示标签趋势（折线图）。\n\
  * **灵活的布局**：使用 SSCE 的不同布局，显示来自任何查询模板的数据和用户特定的 UI 控件。\n* **灵活的仪表板**：保存创建的仪表板以供以后使用，并且如果需要，可以轻松修改。\n\
  * **自定义**：通过将保存的内容添加到导航树来自定义创建的仪表板。\n* **仪表板预览**：预览创建的仪表板，可以使用静态或实时图像。\n* **安全性**：通过分配角色来保护您的仪表板。\n\
  \n三个主要组件是“设计”、“预览”和“源代码”。图 7-71 展示了设计仪表板。\n\n* **设计**：主要用于使用标准布局创建仪表板，同时选择相应的内容，例如：\n\
  \  * **MII 内容**：显示模板、查询模板、MDO/KPI 对象和资源文件是该部分的预定义对象。参见图 7-72。\n  ![A421506_1_En_7_Fig72_HTML.jpg](img/A421506_1_En_7_Fig72_HTML.jpg)\n\
  \  *图 7-72. SSCE MII 内容菜单*\n  * **UI 元素**：SSCE 提供通过添加 UI 元素（例如标签、文本输入字段、按钮、图像和下拉框）来创建更具交互性的页面的功能。这些元素可以直接拖放到设计仪表板中。参见图\
  \ 7-73。\n    * ✓ 在布局背景中创建一个参考网格，第一个 UI 元素始终放置在网格的左上角单元格。后续元素放置在网格的指针位置。\n    * ✓\
  \ 一旦选择了 UI 元素，右侧窗格中会出现“属性”选项卡，显示与该 UI 元素关联的所有属性，如图 7-74 所示。\n    ![A421506_1_En_7_Fig74_HTML.jpg](img/A421506_1_En_7_Fig74_HTML.jpg)\n\
  \    *图 7-74. SSCE 中的 UI 元素属性*\n    ![A421506_1_En_7_Fig73_HTML.jpg](img/A421506_1_En_7_Fig73_HTML.jpg)\n\
  \    *图 7-73. SSCE UI 元素菜单* 可以配置 UI 元素的属性，如 ID、文本值、可见性、事件处理程序等。\n    * ✓ 添加事件处理程序后，会在“源代码”选项卡的自定义代码区域中创建一个\
  \ JavaScript 方法。可以在“预览”选项卡中看到 UI 元素及其配置。参见图 7-75。\n    ![A421506_1_En_7_Fig75_HTML.jpg](img/A421506_1_En_7_Fig75_HTML.jpg)\n\
  \    *图 7-75. 设置 UI 元素的事件* 一旦单击“源代码”选项卡，就会显示事件处理程序的自动生成代码，如图 7-76 所示。\n    ![A421506_1_En_7_Fig76_HTML.jpg](img/A421506_1_En_7_Fig76_HTML.jpg)\n\
  \    *图 7-76.*\n\n\n\n### SSCE 中的事件处理程序自动生成代码\n\n-   **工厂信息目录**：来自工厂信息目录的标签可以移动到空单元格、图像或标签趋势图上。它可以重新定位到所需位置。在实时和设计模式下，可以在趋势和当前视图中查看选定的标签。对标签的更改/配置会在预览模式下自动捕获。\n\
  \n![A421506_1_En_7_Fig71_HTML.jpg](img/A421506_1_En_7_Fig71_HTML.jpg)\n\n*图 7-71.\
  \ SSCE 设计仪表板*\n\n自定义的仪表板布局可以通过 `Open Dashboard` 命令进行搜索和打开。此外，您创建的内容可以在 `Preview`\
  \ 选项卡中进行配置和预览。\n\n仪表板的合并、取消合并和删除也是可行的。还可以根据需要查看仪表板的实时模式。也可以创建指向仪表板的导航链接。安全性是一个额外的优势。\n\
  \nUI 仪表板可以在 `Preview` 选项卡中查看，如图 7-77 所示。\n\n![A421506_1_En_7_Fig77_HTML.jpg](img/A421506_1_En_7_Fig77_HTML.jpg)\n\
  \n*图 7-77. SSCE 中的预览窗口*\n\n`Source Code` 选项卡可用于查看为所创建仪表板生成的 HTML 源代码。可以通过 SAP MII\
  \ Workbench 将外部代码附加到现有源代码中，并附带额外的 CSS 或 JavaScript。JavaScript 会添加到生成源代码中标记为供用户输入脚本的区域。\n\
  \n当选择 `Edit` 时，整个源代码区域会分成两部分，如图 7-78 所示。\n\n-   左侧部分代表生成的 HTML 源代码，不可编辑。\n-   右侧部分代表可编辑的挂钩点。此部分进一步分为两个区域：自定义代码和脚本助手。\n\
  \n![A421506_1_En_7_Fig78_HTML.jpg](img/A421506_1_En_7_Fig78_HTML.jpg)\n\n*图 7-78.\
  \ SSCE 中的源代码编辑器*\n\n在 `Custom Code` 区域，您可以添加必须在运行时可用的代码。您可以使用生成代码区域中创建的任何对象或可用的\
  \ API，通过 `Add Include(s)` 在运行时修改对象的行为。\n\n在 `Script Assistant` 中，您可以通过提供可用的选项（包括小程序及其方法、查询类型和查询方法）来进一步改进脚本语法，以绑定到小程序。以下配置可用（参见图\
  \ 7-79）：\n\n-   **Applet/SAP UI5**：列出小程序名称以及 SAP UI5 对象。\n\n![A421506_1_En_7_Fig79_HTML.jpg](img/A421506_1_En_7_Fig79_HTML.jpg)\n\
  \n*图 7-79. SSCE 中可用的 UI5 小程序*\n\n-   **Applet/SAP UI5 Methods**：列出基础小程序名称以及 SAP\
  \ UI5 对象方法。参见图 7-80。\n\n![A421506_1_En_7_Fig80_HTML.jpg](img/A421506_1_En_7_Fig80_HTML.jpg)\n\
  \n*图 7-80. SSCE 中可用的 UI5 方法*\n\n-   **Query Type**：列出与所选小程序的 Applet 方法相关联的任何查询类型。参见图\
  \ 7-81。\n\n![A421506_1_En_7_Fig81_HTML.jpg](img/A421506_1_En_7_Fig81_HTML.jpg)\n\
  \n*图 7-81. SSCE 中可用的查询类型*\n\n-   **Object Methods**：列出适用于所选小程序/SAP UI5 对象的对象方法名称。参见图\
  \ 7-82。\n\n![A421506_1_En_7_Fig82_HTML.jpg](img/A421506_1_En_7_Fig82_HTML.jpg)\n\
  \n*图 7-82. SSCE 中可用的对象方法*\n\n-   **Include Document Object Reference**：如果选中此复选框，系统会将文档对象作为前缀添加到小程序名称前，以引用网页上的小程序或控件。建议使用前缀。例如，选中复选框时，会添加一个文档前缀引用（参见图\
  \ 7-83）。\n\n![A421506_1_En_7_Fig83_HTML.jpg](img/A421506_1_En_7_Fig83_HTML.jpg)\n\
  \n*图 7-83. 在 SSCE 中包含文档引用*\n\n如果未选中此复选框，则不会创建文档前缀引用，如图 7-84 所示。\n\n![A421506_1_En_7_Fig84_HTML.jpg](img/A421506_1_En_7_Fig84_HTML.jpg)\n\
  \n*图 7-84. 在 SSCE 中排除文档引用*\n\n## 关键绩效指标 (KPI)\n\n关键绩效指标 (KPI) 是监控关键运营领域并让企业了解该领域或组织绩效如何的数字指数衡量指标。KPI\
  \ 对于绩效评估至关重要。KPI 通常针对特定业务场景进行配置，并让相关管理层了解这些领域是表现良好、需要监控还是需要立即关注和改进。\n\nKPI 可以在 SAP\
  \ MII 中创建和配置，也可以使用内置的 KPI 监控屏幕进行监控。\n\n### KPI 框架\n\nKPI 框架是 SAP MII 的内置功能，允许您定义\
  \ KPI 并创建用于计算和监控的逻辑。该框架还允许您创建自定义 UI 并从 SAP MII 使用 KPI 数据。它可以使用数据连接器从任何车间系统或历史数据库中获取\
  \ KPI 计算所需的数据。也可以为 KPI 计算创建自定义逻辑。\n\n以下是 KPI 框架的主要步骤：\n\n-   KPI 定义\n-   数据获取\n\
  -   数据消费\n\n### KPI 定义\n\nKPI 定义是创建和配置 KPI 的地方。创建 KPI 需要分配 `XMII_DEVELOPER` 角色。\n\
  \n### KPI 的类型\n\nSAP MII 有两种类型的 KPI：\n\n-   **基础 KPI**：不依赖于任何其他 KPI\n-   **复合 KPI**：依赖于其他不同的\
  \ KPI 来获取数据\n\n\n\n#### 基础 KPI\n\n`基础 KPI` 是独立、自给自足的绩效指标，无需借助外部系统即可自行收集和计算数值。这些基础\
  \ KPI 可以成为其他 KPI 的一部分，用于收集所需数据。\n\n要配置基础 KPI，请遵循以下步骤：\n\n1. 打开 SAP MII 菜单，选择 `工作台`\
  \ ➤ `启动工作台`。\n2. 打开 `对象` 选项卡。\n3. 右键单击 `项目` 文件夹。\n4. 选择 `新建文件` ➤ `基础 KPI`，如图 7-85\
  \ 所示。\n\n![A421506_1_En_7_Fig85_HTML.jpg](img/A421506_1_En_7_Fig85_HTML.jpg)\n\n\
  图 7-85. 选择 `基础 KPI`\n\n5. 页面左下角有指向不同配置页面的链接。参见图 7-86。\n\n![A421506_1_En_7_Fig86_HTML.jpg](img/A421506_1_En_7_Fig86_HTML.jpg)\n\
  \n图 7-86. `基础 KPI` 的模板类别\n\n`常规` 页面包含 KPI 的标题信息。此页面中可用的字段如图 7-87 所示。\n- `描述`：指定\
  \ KPI 的描述。\n- `数据类型`：此字段指定所生成 KPI 值的数据类型。可用的类型为 `integer`、`double`、`float` 和 `long`。\n\
  - `度量单位`：指定 KPI 的度量单位。\n- `模式`：这是一个只读字段，用于指定 KPI 的类型（`基础/复合型`）。\n- `类型`：有三种可用类型：\n\
  \  - `正向`：KPI 值越高表示性能越好。如图 7-88 所示，当类型选择为`正向`时，绿色定义为 `+10` 到 `最大` KPI 值，黄色定义为 `+5`\
  \ 到 `+10` KPI 值，红色定义为 `0` 到 `+5` KPI 值。\n\n![A421506_1_En_7_Fig88_HTML.jpg](img/A421506_1_En_7_Fig88_HTML.jpg)\n\
  \n图 7-88. `正向`类型 `基础 KPI` 示例\n\n  - `负向`：与正向指标相反。红色范围为 `-10` 到 `最大负值` KPI 值，黄色范围为\
  \ `-5` 到 `-10` KPI 值，绿色范围为 `0` 到 `-5` KPI 值。参见图 7-89。\n\n![A421506_1_En_7_Fig89_HTML.jpg](img/A421506_1_En_7_Fig89_HTML.jpg)\n\
  \n图 7-89. `负向`类型 `基础 KPI` 示例\n\n  - `双向`：意味着它应该处于一个既有上限也有下限的特定范围内。对于此类型，在图 7-90\
  \ 中，红色范围为 `+20` 到 `最大` 以及 `0` 到 `+5` KPI 值，黄色范围为 `+15` 到 `+20` 以及 `+5` 到 `+10` KPI\
  \ 值，绿色范围为 `+10` 到 `+15` KPI 值。\n\n![A421506_1_En_7_Fig90_HTML.jpg](img/A421506_1_En_7_Fig90_HTML.jpg)\n\
  \n图 7-90. `双向`类型 `基础 KPI` 示例\n\n- `范围`：取决于类型。对于正向 KPI，绿色在顶部，其次是黄色和红色。对于负向 KPI 则相反。\n\
  - `聚合逻辑`：此字段指定查询 KPI 时用于值聚合的逻辑。可用选项有：\n  - `最小值`：返回检索结果的最小值。\n  - `最大值`：返回检索结果的最大值。\n\
  \  - `平均值`：返回检索结果的平均值。\n  - `总和`：返回检索结果所有值的总和。\n  - `范围`：返回最大值与最小值之间的差值。\n\n![A421506_1_En_7_Fig87_HTML.jpg](img/A421506_1_En_7_Fig87_HTML.jpg)\n\
  \n图 7-87. `基础 KPI` 中的常规界面\n\n`数据提供者` 页面配置 KPI 的数据源（参见图 7-91）。它可以是一个查询模板、一个事务或另一个\
  \ KPI。点击 `加载` 按钮并选择所需对象。然后点击 `确定` 按钮。图 7-92 展示了加载过程。\n\n![A421506_1_En_7_Fig92_HTML.jpg](img/A421506_1_En_7_Fig92_HTML.jpg)\n\
  \n图 7-92. 在 `数据提供者` 中加载对象\n\n![A421506_1_En_7_Fig91_HTML.jpg](img/A421506_1_En_7_Fig91_HTML.jpg)\n\
  \n图 7-91. `基础 KPI` 中的数据提供者\n\n`维度` 是 KPI 的属性，来自 `数据提供者` 的列数据可以映射到这些属性上。`维度` 和 `时间戳`\
  \ 是两个标准的可用属性。通过 `数据提供者` 可能还可以获得其他属性。在 `维度` 页面上配置这些属性，如图 7-93 所示。\n\n![A421506_1_En_7_Fig93_HTML.jpg](img/A421506_1_En_7_Fig93_HTML.jpg)\n\
  \n图 7-93. 基础 KPI 中的维度界面\n\n`生命周期` 配置用于调度 KPI 在给定时间收集数据。为此，需要配置一个调度器。没有调度器，KPI 无法存储数据。点击\
  \ `创建新` 按钮并提供必填信息。选中 `已启用` 复选框。为调度器选择运行的时间模式。为调度器选择模式——`追加`、`插入`、`更新` 或 `删除`。点击\
  \ `全部部署` 按钮来部署调度器。它将自行创建调度器并开始运行。\n\n为 KPI 分配角色，以确保只有授权用户才能使用该 KPI。然后保存并部署 KPI。\n\
  \n\n\n#### 复合 KPI\n\n复合 KPI 是根据其每个依赖 KPI 或系统的值计算得出的。复合 KPI 可以依赖于基础 KPI、复合 KPI 或两者。它们可以配置为从多个数据源收集数据，例如事务、查询模板或其他\
  \ KPI。\n\n##### 配置复合 KPI\n\n请按照以下步骤配置复合 KPI：\n\n1.  打开 SAP MII 菜单，选择 **工作台（Workbench）**\
  \ ➤ **启动工作台（Launch Workbench）**。\n2.  打开 **对象（Object）** 选项卡。\n3.  右键单击 **项目（Project）**\
  \ 文件夹。\n4.  选择 **新建文件（New File）** ➤ **复合 KPI（Composite KPI）**，如图 [7-94] 所示。\n\n\
  \    ![A421506_1_En_7_Fig94_HTML.jpg](img/A421506_1_En_7_Fig94_HTML.jpg)\n\n   \
  \ 图 7-94. 选择复合 KPI\n5.  在页面左下角有指向不同配置页面的链接。\n6.  **常规（General）** 页面包含 KPI 的标头信息。此页面上的可用字段包括：\n\
  \    *   **描述（Description）**：指定 KPI 的描述。\n    *   **数据类型（Data Type）**：指定生成的 KPI\
  \ 值的数据类型。可用类型为整数`integer`、双精度`double`、浮点`float`和长整型`long`。\n    *   **计量单位（Unit\
  \ of Measure）**：指定 KPI 的计量单位。\n    *   **模式（Mode）**：此只读字段指定 KPI 的类型（基础/复合）。\n  \
  \  *   **类型（Type）**：三种可用的类型是：\n        *   **正向（Positive）**\n        *   **负向（Negative）**\n\
  \        *   **双向（Bidirectional）**：类型为“正向”的 KPI 意味着值越高表示性能越好。“负向”类型则相反。“双向”类型意味着它应处于具有上限和下限的特定范围内。\n\
  \    *   **范围（Range）**：取决于类型。对于正向 KPI，绿色位于顶部，其次是黄色和红色。对于负向 KPI，顺序相反。\n    *   **聚合逻辑（Aggregation\
  \ Logic）**：此字段指定在查询 KPI 时用于聚合值的逻辑。可用选项包括：\n        *   **最小值（Min）**：返回检索结果中的最小值。\n\
  \        *   **最大值（Max）**：返回检索结果中的最大值。\n        *   **平均值（Avg）**：返回检索结果的平均值。\n \
  \       *   **总和（Sum）**：返回检索结果所有值的总和。\n        *   **范围（Range）**：返回最大值和最小值之间的差值。\n\
  7.  在 **数据提供者（Data Provider）** 页面上，有一个名为 **KPI 数据提供者（KPI Data Provider）** 的附加区域（见图\
  \ [7-95]）。此字段允许您添加复合 KPI 所依赖的 KPI。要添加依赖 KPI，请单击 **加载（Load）** 按钮，然后从弹出框中选择 KPI。点击\
  \ **确定（OK）**。\n\n    ![A421506_1_En_7_Fig95_HTML.jpg](img/A421506_1_En_7_Fig95_HTML.jpg)\n\
  \n    图 7-95. 复合 KPI 中的数据提供者屏幕\n8.  如果复合 KPI 的值来自外部系统，则需要在此选择 **数据提供者（Data Provider）**。\n\
  9.  复合 KPI 的 **维度（Dimension）** 页面与基础 KPI 的非常相似，直到您尝试将多个 KPI 的值映射到复合 KPI。要设置复合 KPI\
  \ 的值，请单击 **编辑表达式（Edit Expression）** 按钮。选择编辑表达式，然后点击 **确定（OK）**。\n10. **生命周期（Lifecycle）**\
  \ 配置可调度 KPI 在给定时间收集数据。为此，需要配置一个调度器。没有调度器，KPI 就无法存储数据。点击 **新建（Create New）** 按钮并添加必填信息。选中\
  \ **已启用（Enabled）** 复选框。为调度器选择一个运行的时间模式。选择调度器的模式：**追加（Append）**、**插入（Insert）**、**更新（Update）**\
  \ 或 **删除（Delete）**。点击 **全部部署（Deploy All）** 按钮以部署调度器。它将创建调度器并开始运行。\n11. 为 KPI 分配角色，以确保只有授权用户才能使用该\
  \ KPI。\n12. 保存并部署 KPI。\n\n### 数据消费与监控\n\n在制造业中，必须测量各种参数以从多个角度监控性能。这些参数称为关键绩效指标（KPI）。您还必须定期监控用于计算\
  \ KPI 的数据以及最终的 KPI 结果。这些都是关键的行业要求，因为 ISO 认证和质量许可取决于 KPI 结果。SAP MII 具有内置功能，可使用标准\
  \ KPI 公式计算 KPI，并且如果需要，可以创建一定程度的自定义 KPI 公式。本节介绍如何配置和使用 KPI，如何使用 KPI 查询查询数据，以及如何可视化这些数据。\n\
  \n#### KPI 查询\n\n`KPI Query` 是一种新型查询模板，允许您查询 KPI 数据。\n\n请按照以下步骤配置 KPI 查询：\n\n1.\
  \  启动 **工作台（Workbench）**。\n2.  转到 **目录（Catalog）** 选项卡。\n3.  右键单击任意项目，然后选择 **新建（New）**\
  \ ➤ **KPI 查询（KPI Query）**。见图 [7-96]。\n\n    ![A421506_1_En_7_Fig96_HTML.jpg](img/A421506_1_En_7_Fig96_HTML.jpg)\n\
  \n    图 7-96. 选择 KPI 查询\n4.  **KPI 查询（KPI Query）** 屏幕在屏幕左下角有不同的配置页面。这些页面是：\n   \
  \ *   **数据源（Data Source）**\n    *   **常规（General）**\n    *   **日期范围（Date Range）**\n\
  \    *   **选择查询（Select Query）**\n    *   **删除查询（Delete Query）**\n    *   **插入查询（Insert\
  \ Query）**\n    *   **参数（Parameters）**\n        *   **转换（Transformation）**\n   \
  \     *   **安全（Security）**\n5.  在 **常规（General）** 页面上，指定一个数据服务器和一个连接器。SAP MII 提供了一个名为\
  \ `KPIConnector` 的默认数据服务器。该数据服务器可用于查询在该服务器上创建的 KPI 值。\n6.  可以根据使用服务器的需求启用或禁用此数据服务器，并可以在\
  \ SAP MII 管理菜单中进行维护。\n7.  点击 **加载（Load）** 按钮，然后从弹出框中选择要查询的 KPI。点击 **确定（OK）**。\n\
  8.  从下拉列表中选择模式。可用的模式选项包括：\n    *   **属性列表（Attribute List）**：显示所有 KPI 维度的列表。\n  \
  \  *   **删除（Delete）**：删除选定 KPI 的数据。\n    *   **信息（Info）**：显示所有 KPI 元数据的列表。\n   \
  \ *   **插入（Insert）**：将数据插入 KPI。\n    *   **KPI 列表（KPI List）**：显示在选定数据服务器上创建和配置的\
  \ KPI 列表。\n    *   **模式列表（Mode List）**：显示 KPI 查询可以运行的不同模式。\n    *   **选择（Select）**：从选定的\
  \ KPI 检索数据。\n9.  打开 **维度（Dimensions）** 页面，并从可用维度中选择一个维度。选择 **添加（Add）**。见图 [7-97]。\n\
  \n    ![A421506_1_En_7_Fig97_HTML.jpg](img/A421506_1_En_7_Fig97_HTML.jpg)\n\n  \
  \  图 7-97. 在 KPI 中定义维度\n10. 也可以从 **维度（Dimensions）** 页面配置过滤器表达式。\n11. **维度（Dimension）**\
  \ 屏幕中的 **粒度（Granularity）** 决定了查询 KPI 时数据的表示方式。可用的粒度类型包括：\n    *   **小时（Hour）**：数据将根据聚合逻辑按小时聚合。\n\
  \    *   **天（Day）**：数据将根据聚合逻辑按天聚合。\n    *   **月（Month）**：数据将根据聚合逻辑按月聚合。\n    * \
  \  **无（None）**：聚合逻辑将应用于整个数据集。\n    *   **原始（Raw）**：将显示所有可用的 KPI 数据。\n    *   **周（Week）**：数据将根据聚合逻辑按周聚合。\n\
  12. 使用合适的名称保存查询。\n13. 创建一个显示模板。\n14. 将显示模板添加到 KPI 查询的可视化页面。\n15. 执行 KPI 查询。\n\n\
  #### KPI 监控页面\n\n您刚刚创建的 KPI 需要被监控。SAP MII 提供了创建个性化仪表板的功能，以便使用显示模板或 **KPI 监控（KPI\
  \ Monitor）** 屏幕进行监控。见图 [7-98]。\n\n![A421506_1_En_7_Fig98_HTML.jpg](img/A421506_1_En_7_Fig98_HTML.jpg)\n\
  \n图 7-98. KPI 监控屏幕\n\n通过选择 **KPI 与警报（KPI & Alert）** 类别，从 SAP MII 管理菜单打开 **KPI 监控（KPI\
  \ Monitor）** 页面。点击 **创建（Create）** 按钮，然后选择 **创建搜索模板（Create Search Template）**，并输入名称、描述和持续时间。添加要监控的\
  \ KPI，然后点击 **确定（OK）**。如果需要，进一步配置 KPI 的维度。\n\n\n\n### 在 KPI 中使用警报\n\n可以为 KPI 配置警报，每当\
  \ KPI 值超过特定限制时触发警报。单个 KPI 可配置多个警报。\n\n按照以下步骤创建和配置警报：\n\n1. 选择工作台的`对象`选项卡。\n2. 右键点击任意项目文件夹，然后选择`新建文件\
  \ ➤` 警报。参见图 7-99。\n\n   ![A421506_1_En_7_Fig99_HTML.jpg](img/A421506_1_En_7_Fig99_HTML.jpg)\n\
  \n   图 7-99. 选择警报对象\n\n3. 添加简短文本和详细文本。参见图 7-100。\n\n   ![A421506_1_En_7_Fig100_HTML.jpg](img/A421506_1_En_7_Fig100_HTML.jpg)\n\
  \n   图 7-100. 为警报对象添加简短文本和详细文本\n\n4. 为警报设置过期时间（小时），超过该时间后警报将自动过期。\n5. 输入警报严重级别。\n\
  6. 添加后续操作，例如警报触发后需要执行的步骤。\n7. 添加完成警报可能需要的任何容器属性。\n8. 选择一个交付事务，该事务将在警报触发时执行，以通知相关用户。参见图\
  \ 7-101。\n\n   ![A421506_1_En_7_Fig101_HTML.jpg](img/A421506_1_En_7_Fig101_HTML.jpg)\n\
  \n   图 7-101. 交付事务配置\n\n9. 添加角色。参见图 7-102。\n\n   ![A421506_1_En_7_Fig102_HTML.jpg](img/A421506_1_En_7_Fig102_HTML.jpg)\n\
  \n   图 7-102. 可用安全角色\n\n10. 用适当的名称保存您的警报。\n11. 打开需要触发该警报的对应 KPI，并选中`启用警报`复选框。参见图\
  \ 7-103。\n\n    ![A421506_1_En_7_Fig103_HTML.jpg](img/A421506_1_En_7_Fig103_HTML.jpg)\n\
  \n    图 7-103. 在 KPI 中启用警报\n\n12. 点击`警报名称`区域的`加载`按钮，选择特定警报。点击`确定`。\n13. 从列表中选择该警报，点击`添加`按钮将警报添加到对象列表中。\n\
  14. 保存并运行。\n\n## 工厂信息目录（PIC）\n\n每个制造行业在其车间系统中都存有数据，这些数据以无组织的方式存储，且缺乏业务一致性。工厂信息目录（`PIC`）是\
  \ SAP MII 中提供的一个框架，用于以有序的方式维护和定义这些数据的关系。\n\n在车间，许多系统为不同的数据点（如温度、压力等）存储或捕获数据，这些数据以扁平结构存储，与其他数据集或关联的业务对象没有关系。业务方面的痛点在于，他们拥有所有数据，但缺乏与之相关的业务上下文。因此，业务人员难以搜索特定数据并进行分析或使用。\n\
  \n### PIC 的优势\n\n工厂信息目录（`PIC`）具有以下优势：\n\n* `PIC`提供了框架，用于创建来自不同车间系统的数据点或标签的分层、特定于工厂的目录。\n\
  * `PIC`从 ERP 系统为这一层级结构提供业务上下文。\n* 通过`PIC`，车间资产可以根据 SAP ERP 系统中定义的业务规则进行逻辑分组。\n*\
  \ 可以为对象和数据点或标签采用对业务友好的命名约定，使其易于被业务用户和开发人员使用。\n\n`PIC`位于车间系统和企业系统之间（参见图 7-104）。它从车间系统获取数据，从\
  \ ERP 系统获取业务上下文，并将这些组合成层级格式以提高可用性。\n\n![A421506_1_En_7_Fig104_HTML.jpg](img/A421506_1_En_7_Fig104_HTML.jpg)\n\
  \n图 7-104. PIC 在中间件解决方案中的位置\n\n`PIC`层级结构包含两类对象：\n\n* **组**：这些是包含逻辑标签的逻辑分组。\n* **标签**：这些是车间系统的数据点。\n\
  \n## 在 SAP MII 中创建 PIC 层级结构\n\n在 SAP MII 中创建`PIC`层级结构涉及多个步骤，以下各节将按顺序介绍所有这些步骤。\n\n\
  ### 创建属性集\n\n属性集是属性的集合，允许您将这些属性的特定值添加到与之关联的`PIC`对象中。可以通过 SAP MII 的`属性集管理`屏幕，选择菜单选项`目录服务\
  \ ➤ 属性集`来添加、更新和删除该属性集中的属性。参见图 7-105。\n\n![A421506_1_En_7_Fig105_HTML.jpg](img/A421506_1_En_7_Fig105_HTML.jpg)\n\
  \n图 7-105. 目录服务中的属性集屏幕\n\nSAP MII 包含以`SAP_`开头的预定义属性集。这些属性集包含一些标准属性，且无法更新或删除。\n\n\
  `使用情况`选项卡（参见图 7-106）列出了所选属性集映射到的`PIC`对象。一旦编辑并保存属性集，系统会显示该属性集映射到的`PIC`对象列表，并询问是否推送更改。如果推送更改，这些更改将反映在`PIC`层级结构中。即使不推送更改，也可以从`工厂信息维护`屏幕的`PIC`层级结构中拉取这些更改。\n\
  \n![A421506_1_En_7_Fig106_HTML.jpg](img/A421506_1_En_7_Fig106_HTML.jpg)\n\n图 7-106.\
  \ 属性集中的使用情况选项卡\n\n如果属性集正在工厂信息目录中使用，则无法删除。\n\n未选择更新的节点会标识为`不同步`状态，可以从`PIC`屏幕检查其同步状态，如图\
  \ 7-107 所示。\n\n![A421506_1_En_7_Fig107_HTML.jpg](img/A421506_1_En_7_Fig107_HTML.jpg)\n\
  \n图 7-107. PIC 中的同步状态\n\n### 创建类别\n\n类别定义了`PIC`对象的类型。一旦将类别添加到`PIC`对象，与该类别关联的属性集也会被添加到该`PIC`对象。可以从`类别管理`屏幕创建、编辑或删除类别，该屏幕可通过\
  \ SAP MII 菜单路径`目录服务 ➤ 类别`进入。\n\nSAP MII 包含以`SAP_`开头的预定义类别，用于功能有效属性的属性集。这些类别无法删除或关联到属性集，也无法移除，但可以进行编辑。对类别的任何更改都可以根据用户选择推送到`PIC`层级结构（类似于属性集）。参见图\
  \ 7-108。\n\n1. 在`属性集`选项卡中，您可以在添加新类别或编辑现有类别时，向类别添加属性。参见图 7-109。\n\n   ![A421506_1_En_7_Fig109_HTML.jpg](img/A421506_1_En_7_Fig109_HTML.jpg)\n\
  \n   图 7-109. 类别屏幕：属性集\n\n2. 在`本地化`选项卡中，可以指定不同的语言，并且根据用户区域设置，类别描述可以随之更改。参见图 7-110。\n\
  \n   ![A421506_1_En_7_Fig110_HTML.jpg](img/A421506_1_En_7_Fig110_HTML.jpg)\n\n \
  \  图 7-110. 类别本地化屏幕\n\n3. `使用情况`选项卡显示了已保存类别在系统中的使用情况。参见图 7-111。\n\n   ![A421506_1_En_7_Fig111_HTML.jpg](img/A421506_1_En_7_Fig111_HTML.jpg)\n\
  \n   图 7-111. 类别使用情况屏幕\n\n![A421506_1_En_7_Fig108_HTML.jpg](img/A421506_1_En_7_Fig108_HTML.jpg)\n\
  \n图 7-108. 通用类别屏幕\n\n如果类别正在工厂信息目录中使用，则无法删除。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本准确地翻译成中文。\n\
  \n\n### 创建更改列表并将其标记为默认\n\n在 SAP MII 菜单的 `Catalog Services` 组下，有以下两个界面：\n\n- `Plant\
  \ Information Maintenance`（工厂信息维护）：在此处维护工厂资产层级结构，并将 PIC 对象映射到实际的车间对象。所有更改均在此处完成、审批并应用。之后，更改将移至\
  \ PIC。\n- `Plant Information Catalog`（工厂信息目录）：这是一个只读界面，用于查看已在 `Plant Information\
  \ Maintenance` 界面中创建并审批的 PIC 层级结构。\n\n特定用户可以创建多个更改列表，并且这些列表可以同时保持打开状态。其中只有一个可以是当前更改列表。对\
  \ PIC 层级结构的更改会在当前更改列表中进行维护，直到这些更改被审批并应用到 PIC 为止。一旦对 PIC 层级结构的所有更改完成，更改列表将提交审批。授权的用户组可以批准或拒绝更改列表。如果批准，请选择\
  \ `Approved State ➤ Apply Changes`。如果拒绝，更改将重新分配给用户进行重置（更改将被还原，更改列表将关闭）。图 7-112 显示了更改列表的生命周期。\n\
  \n![A421506_1_En_7_Fig112_HTML.jpg](img/A421506_1_En_7_Fig112_HTML.jpg)\n\n图 7-112.\
  \ 更改列表的生命周期\n\n`Catalog Services ➤ Change List` 界面提供了处理更改列表的不同功能，包括 `Create`（创建）、`View`（查看）、`Set\
  \ as Current`（设为当前）、`Reset`（重置）、`Submit for Approval`（提交审批）和 `Delete`（删除）。还有一个 `Display\
  \ Details`（显示详细信息）按钮，可以在弹出窗口中获取对该特定更改列表所做的更改列表。\n\n弹出窗口有五个选项卡：\n\n- `New`（新建）：包含新建对象的更改。\n\
  - `Edit`（编辑）：包含编辑后对象的更改。\n- `Log`（日志）：显示更改列表已通过的阶段列表。\n- `Delete`（删除）：包含已删除对象的列表。\n\
  - `Notes to Approver`（给审批者的备注）：审批者应了解的所有额外信息都提及于此。\n\n图 7-113 显示了一个状态为 `open`（打开）的已创建更改列表。\n\
  \n![A421506_1_En_7_Fig113_HTML.jpg](img/A421506_1_En_7_Fig113_HTML.jpg)\n\n图 7-113.\
  \ 现有的更改列表\n\n如果用户创建了多个更改列表，并希望将其中一个指定为当前更改列表，他们必须选择该更改列表，然后单击 `Set as Current`（设为当前）按钮进行标记。当前标记的更改列表将出现在\
  \ `Waiting for Approval`（等待审批）列表的顶部。\n\n![A421506_1_En_7_Fig114_HTML.jpg](img/A421506_1_En_7_Fig114_HTML.jpg)\n\
  \n图 7-114. 将更改列表设置为当前列表\n\n选择一个更改列表并单击 `Display Details`（显示详细信息）将显示该特定更改列表的详细信息。见图\
  \ 7-115。\n\n![A421506_1_En_7_Fig115_HTML.jpg](img/A421506_1_En_7_Fig115_HTML.jpg)\n\
  \n图 7-115. 显示更改列表的详细信息\n\n当您单击 `Display Details`（显示详细信息）时，将弹出一个包含新更改列表详细信息的窗口。用户可以在此界面上单击\
  \ `Submit`（提交）或 `Reset`（重置）以进行下一步操作。见图 7-116。\n\n![A421506_1_En_7_Fig116_HTML.jpg](img/A421506_1_En_7_Fig116_HTML.jpg)\n\
  \n图 7-116. 更改列表详细信息界面\n\n用户可以添加备注给审批者，如图 7-117 所示。\n\n![A421506_1_En_7_Fig117_HTML.jpg](img/A421506_1_En_7_Fig117_HTML.jpg)\n\
  \n图 7-117. 给审批者的备注功能\n\n更改列表在审批通过且更改已应用，或者被拒绝并重置后即关闭。\n\n### 在工厂信息维护中创建 PIC 层级结构\n\
  \n通过从 SAP MII 菜单中选择 `Catalog Services ➤ Plant Information Maintenance` 打开 `Plant\
  \ Information Maintenance`（工厂信息维护）。界面分为两部分——左侧是 `Plant Information Sources`（工厂信息源），右侧是\
  \ `Plant Information Catalog`（工厂信息目录）。见图 7-118。\n\n![A421506_1_En_7_Fig118_HTML.jpg](img/A421506_1_En_7_Fig118_HTML.jpg)\n\
  \n图 7-118. 工厂信息维护界面\n\n在界面的右侧，可以创建 PIC 层级结构。如前所述，PIC 层级结构可以有两种对象类型：`Tag`（标记），它是代表测量点的叶节点；以及\
  \ `Group`（组），它是按逻辑分组的标记容器。见图 7-119。\n\n![A421506_1_En_7_Fig119_HTML.jpg](img/A421506_1_En_7_Fig119_HTML.jpg)\n\
  \n图 7-119. 工厂信息目录层级结构\n\nPIC 层级结构有一个名为 `Root`（根）的默认节点，所有创建的对象都位于此 `Root` 节点（组）下。`Plant\
  \ Information Catalog`（工厂信息目录）界面顶部有以下按钮：\n\n- `New`（新建）：此处提供创建组或标记的选项（见图 7-120）。选择所需选项后，它将在弹出窗口中要求您提供\
  \ `Name`（名称）、`Description`（描述）和 `Category`（类别）。当您单击 `OK`（确定）时，它将在选定节点下创建该对象。可以在任何组下创建新的组或标记，但不能在任何标记下创建对象。\n\
  \n  ![A421506_1_En_7_Fig120_HTML.jpg](img/A421506_1_En_7_Fig120_HTML.jpg)\n\n  图\
  \ 7-120. 选择一个新的 PIC\n\n`New Group`（新建组）界面出现，如图 7-121 所示。\n\n![A421506_1_En_7_Fig121_HTML.jpg](img/A421506_1_En_7_Fig121_HTML.jpg)\n\
  \n图 7-121. 创建新的组 PIC\n\n创建对象后，界面下方有五个选项卡，包含该特定对象的详细信息：\n\n- `General`（常规）：指定常规属性，如名称、描述、命名空间和类别。\n\
  - `Property Set`（属性集）：指定可以分配值的关联属性集。\n- `Custom Property`（自定义属性）：指定添加到此对象的自定义属性及其对应值。\n\
  - `Log`（日志）：指定对该特定对象执行的活动列表。\n- `Translate`（翻译）：为所选对象指定依赖于语言的描述文本。\n- `Edit`（编辑）：点击此按钮后，所有编辑功能如\
  \ `Edit`（编辑）、`Cut`（剪切）、`Copy`（复制）、`Paste`（粘贴）和 `Delete`（删除）都将可用（见图 7-122）。\n\n \
  \ ![A421506_1_En_7_Fig122_HTML.jpg](img/A421506_1_En_7_Fig122_HTML.jpg)\n\n  图 7-122.\
  \ 编辑 PIC\n- `Save`（保存）：当点击 `Edit`（编辑）按钮时，此按钮将启用。允许您保存对对象所做的更改。\n- `Cancel`（取消）：当点击\
  \ `Edit`（编辑）按钮时，此按钮将启用。允许您放弃在点击 `Edit`（编辑）按钮后所做的所有更改。\n- `Export`（导出）：点击此按钮，它将把选定节点及其所有子对象的完整层级结构导出为\
  \ XML 格式。\n- `Import`（导入）：点击此按钮，它将导入 XML 格式文件中包含的整个层级结构及其所有子节点。\n\n\n\n### 添加组和标签\n\
  \n现在我们来看屏幕的左侧，即“车间信息源”（`Plant Information Sources`）部分。该部分包含 `PCo Data Server` 选项卡，其中列出了通过\
  \ SAP MII 的 PCo 连接器连接到 SAP MII 的所有车间系统。你可以选择所需的数据服务器，搜索并映射或添加合适的标签。请参见图 7-123。\n\
  \n![A421506_1_En_7_Fig123_HTML.jpg](img/A421506_1_En_7_Fig123_HTML.jpg)\n\n图 7-123.\
  \ 从 PCo 数据服务器将已添加的 PCo 标签添加到 PIC\n\n有两种方式可以将车间标签映射/添加到 PIC 层级结构中。可以通过点击 `Add to\
  \ Plant Information` 按钮，将它们添加到层级结构中的某个组下。另一种方式是在层级结构中创建一个标签，然后使用 `Map Tag` 按钮，将其映射到车间标签列表中的某个标签。该部分的\
  \ `Usage` 按钮会弹出一个窗口，显示映射到该车间标签的 PIC 标签。\n\n一旦 PIC 层级结构中的某个标签被映射到车间标签，所有属性都可以映射到车间标签的元数据。在这种情况下，属性值无法手动分配。值将从车间获取并存储。`Refresh`\
  \ 按钮可用于重新从车间获取标签值。请参见图 7-124。\n\n![A421506_1_En_7_Fig124_HTML.jpg](img/A421506_1_En_7_Fig124_HTML.jpg)\n\
  \n图 7-124. 添加从 PIC 创建的 PCo 标签并将其映射到 PIC\n\n同一时间只能有一个用户操作一个对象。如果某个用户正在操作某个对象，该对象将被该用户的姓名锁定（显示在\
  \ PIC 层级结构的 `Operations` 列中），其他用户无法编辑。\n\n### 添加业务上下文\n\n要添加业务上下文，需要获取 ERP 系统数据。SAP\
  \ MII 有五个可配置的资源适配器用于此目的。这些适配器允许你将所有五个资源汇聚到一点，并从中获取数据。\n\n你可以在资源适配器中按照以下步骤配置 ERP\
  \ 系统：\n\n1.  登录到 SAP NetWeaver Administrator。\n2.  导航到 `Configuration` ➤ `Infrastructure`\
  \ ➤ `Application Resources`。\n3.  搜索 `Plant Information Catalog`。将显示所有五个适配器的列表。\n\
  4.  转到 `Properties` 选项卡。\n5.  输入必填字段：`Name`、`Type`、`Value` 和 `Description`。\n6.\
  \  点击 `Save`。\n\n配置完成后，可以从“车间信息源”（`Plant Information Sources`）部分中的 `ERP Resources`\
  \ 选项卡将 ERP 对象映射到 PIC 对象。\n\n### 审批变更列表\n\n层级结构现已就绪，需要获得批准。除非层级结构的变更得到授权人员的批准，否则它不会从“车间信息维护”（`Plant\
  \ Information Maintenance`）部分移至 PIC。用户的 UME 配置文件应分配有 `SAP_XMII_Approver` 角色，才有权批准或拒绝\
  \ PIC 层级结构的变更。使用菜单路径 `Catalog Services` ➤ `Approval List` 将显示提交审批的变更列表，并附带显示该变更列表详细信息、批准或拒绝的选项。请参见图\
  \ 7-125。\n\n![A421506_1_En_7_Fig125_HTML.jpg](img/A421506_1_En_7_Fig125_HTML.jpg)\n\
  \n图 7-125. 提交变更列表以供审批\n\n### 对变更列表应用更改\n\n一旦变更列表获得批准，它会再次出现在同一列表中，状态为“已批准”（approved），并等待更改被应用。对于状态为“已批准”的变更列表，`Apply\
  \ Changes` 按钮将变为可用。点击 `Apply Changes` 后，该变更列表中对象上的锁定将被释放，并在“车间信息目录”（`Plant Information\
  \ Catalog`）屏幕中反映更改。请参见图 7-126。\n\n![A421506_1_En_7_Fig126_HTML.jpg](img/A421506_1_En_7_Fig126_HTML.jpg)\n\
  \n图 7-126. 审批列表屏幕\n\n### 使用 PIC 层级结构\n\n在查询模板中，有 `Catalog` 查询。这是专门用于使用 PIC 层级结构的。创建\
  \ PIC 时，PIC 标签会映射到 PCo 数据服务器的标签或车间标签。PIC 保存的是映射关系，而不是数据。当查询 PIC 标签时，会实时从车间或 PCo\
  \ 数据服务器获取实时数据。\n\n但 ERP 对象映射的工作方式不同。映射完成后，所有业务上下文都会立即保存到本地 SAP MII 系统中的相应属性中。\n\n\
  按照以下步骤创建和配置 `Catalog` 查询：\n\n1.  启动工作台（Workbench）。\n2.  转到 `Catalog` 选项卡。\n3.  右键单击任意文件夹，然后选择\
  \ `New` ➤ `Catalog Query`，如图 7-127 所示。\n\n    ![A421506_1_En_7_Fig127_HTML.jpg](img/A421506_1_En_7_Fig127_HTML.jpg)\n\
  \n    图 7-127. 选择目录查询（Catalog query）\n\n    图 7-128 中显示的 `Template Categories` 选项可用于配置\
  \ `Catalog` 查询。\n\n    ![A421506_1_En_7_Fig128_HTML.jpg](img/A421506_1_En_7_Fig128_HTML.jpg)\n\
  \n    图 7-128. 在目录查询中配置模板类别\n\n4.  在 `Data Source` 屏幕中，选择源数据服务器和查询模式（见图 7-129）。可用模式如下：\n\
  \n    ![A421506_1_En_7_Fig129_HTML.jpg](img/A421506_1_En_7_Fig129_HTML.jpg)\n\n\
  \    图 7-129. 目录查询中的可用模式\n\n    *   `ModeList`：显示模式列表。\n    *   `GroupList`：显示 PIC\
  \ 层级结构中所有可用的组列表。\n    *   `TagList`：显示 PIC 层级结构中所有可用的标签列表。\n    *   `Current`：显示标签和属性值的当前值。\n\
  \    *   `History`：显示标签和属性值的插值历史值。\n    *   `HistoryEvents`：显示标签和属性值的历史值。\n    *\
  \   `Statistics`：根据车间记录显示统计数据。\n    *   `RetrieveProprties`：显示属性值。\n\n5.  在“车间信息目录查询详情”（`Plant\
  \ Information Catalog Query Details`）屏幕中，导航到 PIC 树中所选数据服务器的 PIC 层级结构。请参见图 7-130。\n\
  \n    ![A421506_1_En_7_Fig130_HTML.jpg](img/A421506_1_En_7_Fig130_HTML.jpg)\n\n\
  \    图 7-130. 配置层级结构目录查询\n\n6.  通过拖放或使用可用按钮，将标签对象移动到“已选标签”（selected tags）区域。\n7.\
  \  从已选标签列表中选择 `Tag`，并选择相应的属性。\n8.  在 `Extended` 选项卡中，选择用于映射的目录服务器和 PCo 服务器。\n9.\
  \  为所有 PCo 服务器选择元数据。\n10. `Retrieve Properties Details` 屏幕与“车间信息目录查询详情”（`Plant Information\
  \ Catalog Query Details`）屏幕非常相似，用于 `Retrieve Properties` 模式。此屏幕上有一个选项可以选择组和标签。\n\
  \n目录查询也可以在 illuminator 服务中使用，如下所示：\n\n```\n://:/XMII/Illuminator?QueryTemplate=&content-type=text/xml&Group=\n\
  ```\n\n## PIC Web 服务\n\nPIC 提供了四个 Web 服务。所有对 PIC 的操作都可以使用其中任何一个 Web 服务来完成。\n\n这些\
  \ Web 服务如下：\n\n*   目录服务（Catalog Service）\n*   目录管理服务（Catalog Admin Service）\n* \
  \  变更列表服务（Change List Service）\n*   属性集服务（Property Set Service）\n\n### 目录服务\n\n\
  使用 `Catalog Service`，你可以执行所有可通过“车间信息目录屏幕”（`Plant Information Catalog Screen`）执行的操作，并将其作为服务内的方法。此\
  \ Web 服务的 WSDL URL 是：\n\n```\n://:/PlantInformationCatalogService/PlantInformationCatalogServiceBean?wsdl&mode=ws-policy\n\
  ```\n\n可用的方法包括：\n\n*   `BrowseGroups`\n*   `BrowseTags`\n*   `FetchAllCustomProperties`\n\
  *   `GetTagDetails`\n*   `GetGroupDetails`\n*   `GetCategories`\n*   `GetObjectProperties`\n\
  *   `GetPropertyValue`\n*   `SearchGroups`\n*   `SearchTags`\n\n\n\n### 目录管理服务\n\
  \n使用 `目录管理服务`，您可以在服务中以方法的形式执行所有可通过 `植物信息维护` 屏幕执行的操作。该 Web 服务的 WSDL URL 为：\n\n```\n\
  ://:/PlantInformationMaintenanceService/PlantInformationMaintenanceServiceBean?wsdl&mode=ws-policy\n\
  ```\n\n可用的方法包括：\n\n*   `AddProperties`（添加属性）\n*   `BrowseGroups`（浏览群组）\n*   `BrowseTags`（浏览标签）\n\
  *   `CreateGroup`（创建群组）\n*   `CreateTag`（创建标签）\n*   `DeleteGroup`（删除群组）\n*   `DeleteTag`（删除标签）\n\
  *   `DeleteProperties`（删除属性）\n*   `GetGroupDetails`（获取群组详情）\n*   `GetTagDetails`（获取标签详情）\n\
  *   `GetPropertyValue`（获取属性值）\n*   `MaintainGroup`（维护群组）\n*   `MaintainTag`（维护标签）\n\
  *   `SearchGroups`（搜索群组）\n*   `SearchTags`（搜索标签）\n\n### 变更列表服务\n\n使用 `变更列表服务`，您可以在服务中以方法的形式执行所有可通过\
  \ `变更列表` 屏幕执行的操作。该 Web 服务的 WSDL URL 为：\n\n```\n://:/ChangeListServices/ChangeListServicesBean?wsdl&mode=ws-policy\n\
  ```\n\n可用的方法包括：\n\n*   `CreateChangeList`（创建变更列表）\n*   `SearchChangeLists`（搜索变更列表）\n\
  *   `ManageChangeListStatus`（管理变更列表状态）\n*   `ResetObjects`（重置对象）\n*   `ApplyChanges`（应用变更）\n\
  \n### 属性集服务\n\n使用 `属性集服务`，您可以在服务中以方法的形式执行所有可通过 `属性集` 屏幕执行的操作。该 Web 服务的 WSDL URL\
  \ 为：\n\n```\n://:/PropertySetServices/PropertySetServicesBean?wsdl&mode=ws-policy\n\
  ```\n\n可用的方法包括：\n\n*   `AddProperties`（添加属性）\n*   `DeleteProperties`（删除属性）\n*  \
  \ `CreatePropertySet`（创建属性集）\n*   `EditPropertySet`（编辑属性集）\n*   `DeletePropertySet`（删除属性集）\n\
  *   `SearchPropertySets`（搜索属性集）\n\n## 什么是 SAP 工厂连接性（PCo）？\n\nSAP 工厂连接性（PCo）是一个框架，包含一组服务和**管理工具**，可在控制系统、控制设备、文件、历史数据库、TCP\
  \ 套接字和 SAP 之间提供双向通信路径。它基于 Microsoft.Net 开发。\n\n### 为何选择 PCo？\n\n在任何制造业中，都有大量机器和设备持续产生海量过程数据。确保这些数据得到正确分析并实时执行，对于保障平稳运行、在出现偏差时快速决策至关重要。\n\
  \n借助 SAP MII 和 PCo，即使底层系统提供不同类型的连接协议，也能轻松实现与制造自动化系统的实时集成。为了驱动实时智能，PCo 充当连接适配器，而\
  \ SAP MII 则提供业务逻辑来管理数据并整合业务规则。\n\n### PCo 的历史\n\nPCo 是第二代 SAP 制造连接器技术。它取代了最初由 Lighthammer\
  \ Corp. 开发、SAP 于 2005 年 7 月收购 Lighthammer 后纳入的 xMII UDS（通用数据服务器）产品。\n\nPCo 的初始版本\
  \ 2.0 于 2008 年 12 月发布。该版本仅支持基于实时事件的通知，并提供了以下代理和目标端。\n\n代理：\n\n*   `OPC DA 代理`：支持\
  \ OPC DA 2.05a 和 3.0 规范\n*   `OPC A&E 代理`\n*   `OPC UA 代理`：支持订阅 OPC UA 变量数据、变更事件以及\
  \ OPC UA v1.0 build 224 [及更高] 版本\n*   `套接字代理`：支持接收流和面向连接的套接字消息\n\n目标端：\n\n*   `MII\
  \ 目标端`：支持向 MII 11.5、12.0 和 12.1 发送通知消息\n*   `RFC 目标端`：用于启用 EWM 与套接字代理之间的双向通信，并且仅用于\
  \ EWM 场景中的套接字代理\n*   不提供通用的 RFC 使用方式\n\n### 将 PCo 与自动化系统集成\n\nPCo 提供以下连接器作为源系统：\n\
  \n*   OPC 数据访问（OPC DA）\n*   OPC 历史数据访问（OPC HDA）\n*   OPC 报警与事件（OPC A&E）\n*   OPC\
  \ 统一架构（OPC UA）\n*   对象链接与嵌入数据库（OLEDB）\n*   开放数据库连接（ODBC）\n*   iHistorian\n*   OSISoft\
  \ PI\n*   TCP/IP 套接字\n*   文件监视器\n\n它通过标签查询、PCo 查询和来自 SAP MII 的 SQL 查询提供一种查询机制，并按需从底层系统检索数据。\n\
  \nPCo 还提供通知机制。可以订阅源系统的一个或多个标签，以便在标签值发生变化或满足特定条件时，向目标系统接收 PCo 通知。\n\nPCo 可以向以下目标系统发送通知：\n\
  \n*   SAP MII\n*   SAP ME（制造执行系统）\n*   SAP HANA 数据库\n*   SQL Server\n*   业务企业系统（SAP\
  \ ERP/EWM）\n\nPCo 可以将未经处理的标签信息发送到目标系统。但为了使其更有意义，SAP MII 被用作中间件，便于开发逻辑，将相应的机器或过程参数附加到从\
  \ PCo 接收的数据，并将其整合到实际目标系统以供进一步处理。\n\n### 机器数据连接\n\nPCo 与 SAP MII 一起直接连接到自动化控制系统。首先，需要在\
  \ PCo 中配置一个指向自动化控制系统的源系统。PCo 可以通过 OPC 服务器连接到 SCADA 或工厂历史数据库，或通过连接器直接连接到源系统。机器的某些参数值表示机器停机时间，通常称为标签。这些标签可在工厂数据历史数据库中找到。OPC\
  \ 模拟器通常用作自动化系统模拟器。\n\n作为 Microsoft Windows 的可执行程序，建议将 PCo 和源系统安装在同一台 Windows 服务器上，以避免复杂的防火墙和\
  \ DCOM 安全配置。\n\n### 什么是 OPC？\n\nOPC 代表 OLE for Process Control（用于过程控制的 OLE）。OPC\
  \ 是一种软件接口标准，允许 Windows 程序与工业硬件设备（例如 PLC 设备）进行通信。\n\nOPC 以客户端/服务器配对的方式实现，其中 OPC 服务器是一个软件程序，用于将\
  \ PLC 使用的硬件通信协议转换为 OPC。见图 7-131。\n\n![A421506_1_En_7_Fig131_HTML.gif](img/A421506_1_En_7_Fig131_HTML.gif)\n\
  \n图 7-131. 数据流图及 OPC 的定位\n\n协议和 OPC 客户端软件是任何需要连接到硬件（例如 PCo）的程序。OPC 客户端使用 OPC 服务器从硬件获取数据或向硬件发送命令。\n\
  \nOPC 是一种开放标准，可降低制造商的成本并为用户提供更多选择。硬件制造商只需为其设备提供一个单一的 OPC 服务器，即可与任何 OPC 客户端进行通信。软件供应商只需在其产品中包含\
  \ OPC 客户端功能，即可与成千上万的硬件设备即时兼容。用户可以根据需要选择任何 OPC 客户端软件，并放心它能够与其支持 OPC 的硬件无缝通信，反之亦然。\n\
  \n\n\n### 在 PCo 管理控制台中进行配置\n\n请按照以下步骤进行源系统配置：\n\n1. 打开 `PCo` 管理控制台。\n2. 点击 `新建源系统`\
  \ 图标。\n3. 从下拉菜单中选择 `源系统类型`（假设为 `OPC DA 源系统`）。根据源系统连接器类型选择 `源系统类型`。\n4. 指定源系统的名称。\n\
  5. 指定源系统的描述。\n6. 点击 `确定`。源系统即创建完成。\n7. 选择新创建的源系统。右侧窗格中会显示相应的连接详细信息。\n8. 选择源系统的服务器详细信息。见图\
  \ 7-132。\n\n   ![A421506_1_En_7_Fig132_HTML.jpg](img/A421506_1_En_7_Fig132_HTML.jpg)\n\
  \   图 7-132. 在 `PCo` 中进行源系统配置\n\n9. 添加服务器名称。如果源系统和 `PCo` 安装在同一台服务器上，则服务器名称可设为 `localhost`。否则，需要填写源系统服务器的主机名或\
  \ IP 地址。\n10. `PCo` 现在将自动检测该特定主机上可用的 `OPC DA` 服务器。见图 7-133。\n\n    ![A421506_1_En_7_Fig133_HTML.jpg](img/A421506_1_En_7_Fig133_HTML.jpg)\n\
  \    图 7-133. 在 `PCo` 中选 `OPC` 服务器\n\n11. 还可以在 `OPC` 代理配置的 `设置`、`别名` 和 `可靠连接` 选项卡中选择某些其他属性。见图\
  \ 7-134。\n\n    ![A421506_1_En_7_Fig134_HTML.jpg](img/A421506_1_En_7_Fig134_HTML.jpg)\n\
  \    图 7-134. 在 `PCo` 中的 `OPC DA` 设置\n\n最大重试次数和重试间隔可以在 `可靠连接` 窗口中设置，如图 7-135 所示。\n\
  \n![A421506_1_En_7_Fig135_HTML.jpg](img/A421506_1_En_7_Fig135_HTML.jpg)\n图 7-135.\
  \ 在 `PCo` 中的 `OPC` 连接保留配置\n\n### PCo 代理配置\n\n下一步是配置代理、目标系统以及用于捕获实时数据的通知。您可以使用流程智能来处理数据。\n\
  \n1. 从 `PCo` 菜单中，点击代理实例下的新建图标。\n2. 选择需要配置代理的源系统。\n3. 指定名称。\n4. 输入描述。代理即创建完成。\n5.\
  \ 选择通用参数，如日志级别（`error`、`fatal`、`information` 或 `warning`）。\n6. 如有需要，指定服务模式和身份验证。\n\
  7. 指定通知消息队列和调度设置，以启用对从 `PCo` 发送的通知消息进行排队。\n8. 创建一个新代理。见图 7-136。\n\n   ![A421506_1_En_7_Fig136_HTML.jpg](img/A421506_1_En_7_Fig136_HTML.jpg)\n\
  \   图 7-136. 在 `PCo` 中创建代理\n\n创建新代理后，需要进行多项特定于代理的配置。请参见图 7-137 至图 7-142。\n\n![A421506_1_En_7_Fig142_HTML.jpg](img/A421506_1_En_7_Fig142_HTML.jpg)\n\
  图 7-142. 代理的通知处理配置\n\n![A421506_1_En_7_Fig141_HTML.jpg](img/A421506_1_En_7_Fig141_HTML.jpg)\n\
  图 7-141. 代理的订阅项配置\n\n![A421506_1_En_7_Fig140_HTML.jpg](img/A421506_1_En_7_Fig140_HTML.jpg)\n\
  图 7-140. 代理的标签查询配置\n\n![A421506_1_En_7_Fig139_HTML.jpg](img/A421506_1_En_7_Fig139_HTML.jpg)\n\
  图 7-139. 在 `PCo` 中为代理配置服务器类型和端口\n\n![A421506_1_En_7_Fig138_HTML.jpg](img/A421506_1_En_7_Fig138_HTML.jpg)\n\
  图 7-138. `PCo` 中的代理日志\n\n![A421506_1_En_7_Fig137_HTML.jpg](img/A421506_1_En_7_Fig137_HTML.jpg)\n\
  图 7-137. 在 `PCo` 中配置已创建代理的主机\n\n`日志` 选项卡显示读取标签和触发通知时的所有信息和错误日志。见图 7-138。`服务器` 选项卡用于配置代理的端口和服务器类型，如图\
  \ 7-139 所示。`标签查询` 选项卡用于配置标签查询，这有助于缓存来自数据源的数据，如图 7-140 所示。`订阅项` 选项卡用于添加需要为该特定代理组合在一起的所有标签，如图\
  \ 7-141 所示。\n\n9. 如果应用程序需要启用通知场景，则必须在 `订阅项` 选项卡中指定需要监控值并触发通知的相应标签。`通知处理` 选项卡用于配置自动\
  \ `消息` 排队方法和调度规则以处理通知，如图 7-142 所示。\n\n### 目标系统配置\n\n仅当存在通知场景，并且 `PCo` 需要针对标签值的特定变化向目标系统发送通知消息时，才需要配置目标系统。\n\
  \n当基于临时需求从 `SAP MII` 查询标签值时，不需要目标系统。\n\n可以在 `PCo` 中配置不同类型的目标系统来发送通知消息，其中之一是 `SAP\
  \ MII`。\n\n当 `SAP MII` 接收到来自 `PCo` 的通知消息后，它会通过业务逻辑处理这些消息以添加上下文背景，因为 `PCo` 无法添加所有业务上下文。`PCo`\
  \ 消息仅包含标签信息。\n\n\n\n### 通知处理事件配置\n\n当自动化系统中的某个标签值因机器物理参数变化而改变时，必须触发相应的操作。如果该标签记录在历史数据库中，则会触发一个工厂维护通知。\n\
  \n对于 OPC DA 源系统，源系统本身会根据 `PCo` 中指定的条件进行评估，以向 `PCo` 发送信号来触发通知。\n\n对于任何其他源系统，`PCo`\
  \ 会根据标签值更新速率或源系统设置配置中的事件间隔，持续评估触发条件来触发通知。\n\n1.  选择之前创建的代理。\n2.  点击 `Create Notification`\
  \ 图标。参见图 7-143。\n\n   ![A421506_1_En_7_Fig143_HTML.jpg](img/A421506_1_En_7_Fig143_HTML.jpg)\n\
  \n   图 7-143. 代理实例的通知\n\n3.  指定名称。\n4.  指定描述。\n5.  点击 `OK`。即会创建一个通知。将通知添加到代理实例名称后，所有通知的名称、状态和详细信息都会显示在代理实例名称下，如图\
  \ 7-144 所示。\n\n   ![A421506_1_En_7_Fig144_HTML.jpg](img/A421506_1_En_7_Fig144_HTML.jpg)\n\
  \n   图 7-144. 创建的通知及状态\n\n6.  在 `Notification` 选项卡中指定触发条件。使用已订阅的标签指定任何条件，如图 7-145\
  \ 所示。\n\n   ![A421506_1_En_7_Fig145_HTML.jpg](img/A421506_1_En_7_Fig145_HTML.jpg)\n\
  \n   图 7-145. 通知的触发表达式\n\n7.  在 `Output` 选项卡中定义消息格式，如图 7-146 所示。\n\n   ![A421506_1_En_7_Fig146_HTML.jpg](img/A421506_1_En_7_Fig146_HTML.jpg)\n\
  \n   图 7-146. 定义通知的输出结构\n\n8.  在 `Message Delivery` 选项卡中指定消息传递条件，如图 7-147 所示。\n\n\
  \   ![A421506_1_En_7_Fig147_HTML.jpg](img/A421506_1_En_7_Fig147_HTML.jpg)\n\n  \
  \ 图 7-147. 消息传递时间配置\n\n9.  在 `Destination` 选项卡中指定目标系统。此处提及针对 `PCo` 通知处理要执行的 `BLS`，如图\
  \ 7-148 所示。\n\n   ![A421506_1_En_7_Fig148_HTML.jpg](img/A421506_1_En_7_Fig148_HTML.jpg)\n\
  \n   图 7-148. 为 `PCo` 通知配置目标\n\n### 使用 SAP PCo 将 Excel 与 SAP MII 集成\n\n`SAP MII`\
  \ 可以通过 `SAP PCo` 读取 Excel 文件。使用 `SAP MII` 集成 `PCo` 来读取 Excel 文件（`.xlsx`）已变得很普遍。\n\
  \n```\n测试环境：\nSAP MII 版本：12.2 SP6 Patch 15\nSAP PCO：PCo 2.1.5.1\n安装包：Microsoft Access\
  \ DB Engine X32-bit\n连接器类型：OLEDB\n```\n\n作为前提条件，`PCo` 和 `Microsoft Access DB Engine`\
  \ 应安装在同一台服务器上。\n\n**注意：** `SAP MII` 版本和 `PCo` 版本是独立的，如果存在所需的提供程序，则应可配置。通过 `PCo`\
  \ 将 Excel 文件（`.xlsx`）读取到 `MII` 需要使用 SAP 推荐的提供程序，即“Microsoft Office 12.0 Access Database\
  \ Engine OLE DB Provider”。\n\n要读取 Excel 文件，您需要在 `PCo Management Console` 和 `SAP\
  \ MII` 连接详细信息中设置一些配置。有关详细步骤，请参阅此博客文章：[`blogs.sap.com/2015/10/26/procedure-to-integrate-pco-with-sap-mii-to-read-excelxlsx-files/`](https://blogs.sap.com/2015/10/26/procedure-to-integrate-pco-with-sap-mii-to-read-excelxlsx-files/)。\n\
  \n### 从 MII 菜单页面管理通知\n\n现在，您可以直接从 `SAP MII` 菜单选项中管理 `SAP 15.0` 中的 `SAP PCo` 通知。您无需登录工厂管理控制台即可创建、配置和管理\
  \ `PCo` 通知。参见图 7-149。\n\n![A421506_1_En_7_Fig149_HTML.jpg](img/A421506_1_En_7_Fig149_HTML.jpg)\n\
  \n图 7-149. 从 `SAP MII` 菜单页面进行 `PCo` 通知管理\n\n在 `SAP MII` 中直接管理通知的好处如下：\n\n- 用户可以在同一屏幕集中管理和维护多个\
  \ `PCo` 安装。\n- 用户可以直接在 `SAP MII` 中修改、暂停和恢复通知。\n- 利用 `SAP MII PIC` 中可用的业务上下文进行增强。\n\
  - 即使在代理实例运行时也可进行修改，而通过工厂管理控制台则无法实现这一点。\n\n如下所示，当选中 `Notification Management under\
  \ Plant Connectivity Integration` 选项时，将打开 `Plant Connectivity Management` 屏幕，并且其中进一步提供以下窗口选项卡：\n\
  \n- `Manage Notifications by SAP Plant Connectivity`\n- `Manage Notification by\
  \ PIC`\n- `Browse Notifications`\n\n#### 按 SAP Plant Connectivity 管理通知屏幕\n\n一旦您选择了\
  \ `Manage Notifications by SAP Plant Connectivity`，将看到如图 7-150 所示的屏幕。\n\n![A421506_1_En_7_Fig150_HTML.jpg](img/A421506_1_En_7_Fig150_HTML.jpg)\n\
  \n图 7-150. 从 `SAP MII` 菜单页面按 Plant Connectivity 管理通知\n\n选择 `PCo` 服务器后，所有通知将显示在列表中，并包含描述和其他详细信息，如图\
  \ 7-151 所示。\n\n![A421506_1_En_7_Fig151_HTML.jpg](img/A421506_1_En_7_Fig151_HTML.jpg)\n\
  \n图 7-151. 来自管理通知的通知列表\n\n`PCo Servers` 列表包含在该 `SAP MII` 服务器中配置的对应 `PCo` 数据服务器所配置的所有通知。用户可以查看、监控并根据所选\
  \ `PCo` 数据服务器的名称（按创建日期、`Modified On` 日期、`Modified by` 以及数据服务器的状态（`running`、`stopped`\
  \ 或 `pending`））进行分析。\n\n选择一个数据服务器后，将显示已配置的通知。如果没有可用的通知，则不显示任何数据。右下角有一个按钮，用于直接在 `SAP\
  \ MII` 中针对该数据服务器创建通知，如图 7-152 所示。\n\n![A421506_1_En_7_Fig152_HTML.jpg](img/A421506_1_En_7_Fig152_HTML.jpg)\n\
  \n图 7-152. `Create Notification` 按钮\n\n### 按 PIC 管理通知屏幕\n\n在此屏幕上，您可以查看 `Plant Information\
  \ Catalog` 层次结构并管理针对标签的通知。如果需要，您还可以创建新通知。参见图 7-153。\n\n![A421506_1_En_7_Fig153_HTML.jpg](img/A421506_1_En_7_Fig153_HTML.jpg)\n\
  \n图 7-153. `Manage Notification By PIC` 屏幕\n\n### 浏览通知屏幕\n\n在此屏幕上，可以使用筛选选项监控与 `PCo`\
  \ 数据服务器关联的所有通知的状态和版本控制，如图 7-154 所示。\n\n![A421506_1_En_7_Fig154_HTML.jpg](img/A421506_1_En_7_Fig154_HTML.jpg)\n\
  \n图 7-154. 从管理通知浏览通知\n\n对于选定的通知，您可以执行以下操作：\n\n- 查看通知\n- 将通知详细信息以 `XML` 格式导入到 `SAP\
  \ MII` 系统\n- 以 `XML` 格式导出通知\n- 激活\n- 暂停\n- 恢复\n\n\n\n## 查询与会话管理 (JRA)\n\n会话是指在单个连接期间，两个通信端点之间进行的一系列交互。SAP\
  \ 在 MII 中引入了一些新功能，使用户能够逻辑地查询 SQL 数据库。这确保用户可以在会话中进行查询，同时使用`commit`和`rollback`进行适当的事务处理。其限制是`IDBC`和`DataSource`类型的数据服务器可以使用此功能。以下是\
  \ SAP MII 事务中包含的用于在会话中调用这些特定数据库的操作块。见图 7-155。\n\n![A421506_1_En_7_Fig155_HTML.jpg](img/A421506_1_En_7_Fig155_HTML.jpg)\n\
  \n图 7-155. SAP MII 中的 SQL 会话支持\n\n### SQL 事务开始\n\n此操作主要用于为逻辑数据库事务启动会话。执行时，数据服务器会连接到连接池。此操作块包含服务器详情和连接超时等输入项。见图\
  \ 7-156。\n\n![A421506_1_En_7_Fig156_HTML.jpg](img/A421506_1_En_7_Fig156_HTML.jpg)\n\
  \n图 7-156. SQL 事务开始操作块及其配置\n\n### SQL 事务提交\n\n此操作块对数据库事务执行提交操作。该操作提交从事务开始后，SAP MII\
  \ SQL 查询模板所做的所有操作。主要输入参数是用于提交的 SQL 事务操作块名称。提交事务意味着使事务内 SQL 语句所做的更改永久生效。见图 7-157。\n\
  \n![A421506_1_En_7_Fig157_HTML.jpg](img/A421506_1_En_7_Fig157_HTML.jpg)\n\n图 7-157.\
  \ SQL 事务提交操作块及其配置\n\n### SQL 事务回滚\n\n此操作回滚一个事务。提供此选项用于选择要回滚的事务，以撤销在事务开始后 MII SQL\
  \ 查询模板在 SAP MII 事务中所做的所有更改。主要输入是 SQL 事务开始操作块的名称。回滚会将事务状态恢复到上一次执行提交操作时的状态。见图 7-158。\n\
  \n![A421506_1_En_7_Fig158_HTML.jpg](img/A421506_1_En_7_Fig158_HTML.jpg)\n\n图 7-158.\
  \ SQL 事务回滚操作块及其配置\n\n### SQL 事务结束\n\n此操作结束当前的数据库逻辑事务。此处的输入同样是 SQL 事务开始操作块的名称。这会断开在\
  \ SQL 事务开始操作块中配置的数据服务器连接。在流程完成时结束事务以断开服务器连接始终是最佳实践。见图 7-159。\n\n![A421506_1_En_7_Fig159_HTML.jpg](img/A421506_1_En_7_Fig159_HTML.jpg)\n\
  \n图 7-159. SQL 事务结束操作块及其配置\n\n除了在 SAP MII SQL 查询事务中使用会话外，SAP 还通过 SAP MII 在会话中维护对\
  \ SAP ECC（SAP ERP 中央组件）的调用。这对于 SAP JCo (SAP Java 连接器) 和 SAP JRA (Java 资源适配器) 连接都是这样实现的。\n\
  \n## 使用 SAP JRA (Java 资源适配器)\n\nJava 资源适配器 (JRA) 允许与 SAP ERP 系统进行同步和异步通信。在 SAP MII\
  \ 中，它用于与 SAP ERP 的两种通信类型。本节仅介绍通过操作块进行的同步通信。\n\n要使用 JRA，用户需要在 NetWeaver 管理员 (NWA)\
  \ 中配置 JCA 连接工厂。\n\n请按照以下步骤配置 JRA 适配器：\n\n1. 登录 NetWeaver 管理员页面 (`http://<server>:<port>/nwa`)。\n\
  2. 选择 配置管理 ➤ 基础设施 ➤ 应用程序资源。\n3. 选择 JCA 资源。\n4. 从资源列表中选择 `SAPJavaResourceAdapter15`。\n\
  5. 在 资源详情 部分，选择 依赖的 JCA 连接工厂 选项卡。\n6. 选择 复制并添加新的 JCA 连接工厂 来定义 JRA 连接。见图 7-160。\n\
  \n![A421506_1_En_7_Fig160_HTML.jpg](img/A421506_1_En_7_Fig160_HTML.jpg)\n\n图 7-160.\
  \ JCA 连接工厂配置创建\n\n7. 为 JNDI (Java 命名和目录接口) 名称输入一个相关的资源名称（见图 7-161）：\n\n![A421506_1_En_7_Fig161_HTML.jpg](img/A421506_1_En_7_Fig161_HTML.jpg)\n\
  \n图 7-161. JRA 工厂的 JNDI 配置\n\n   - `NonGlobal`：特定于 SAP ERP 的连接。此设置不会纳入分布式（Java 事务\
  \ API 或 JTA）事务。\n   - `Shareable`：这是默认的 JRA 操作，因为它是可共享的，即使应用程序想要获取多个连接，也只会创建一个物理连接。\n\
  \   - `Unsharable`：应用程序的每个连接都将使用连接池中独立的物理连接。\n\n8. 转到 配置属性 选项卡。\n9. 输入以下 JRA 通信配置的值（见图\
  \ 7-162）：\n\n![A421506_1_En_7_Fig162_HTML.jpg](img/A421506_1_En_7_Fig162_HTML.jpg)\n\
  \n图 7-162. JCA 适配器属性配置\n\n   - `SAPClient`：SAP ERP 客户端编号\n   - `UserName`：SAP ERP\
  \ 客户端用户名\n   - `Password`：用于连接客户端的 SAP ERP 密码\n   - `Language`：输入用户的登录语言\n   - `ServerName`：在您网络上解析的\
  \ SAP ERP 服务器 URL（完全限定域名）\n   - `PortNumber`：您正在连接的 ERP 定义的系统编号\n\n10. 立即保存配置。\n\
  \n现在，JRA 适配器已配置并保存，JRA 操作块即可用于 SAP MII 中的开发。\n\n对于 SAP JRA，SAP MII 中不同的操作块描述如下：\n\
  \n- **SAP JRA 启动会话**：此操作用于使用 SAP Java 资源适配器在 SAP MII 和 SAP ERP 中央组件 (SAP ECC) 之间打开一个会话。用户必须从\
  \ JRA 连接器名称列表中选择已配置的 JCA 工厂连接，如图 7-163 所示。\n\n![A421506_1_En_7_Fig163_HTML.jpg](img/A421506_1_En_7_Fig163_HTML.jpg)\n\
  \n图 7-163. 启动会话操作块的 JRA 工厂连接器列表\n\n- **SAP JRA 函数调用**：这是调用 RFC 的操作。它与 SAP JCo 函数操作块（稍后解释）不同，因为\
  \ JRA 更安全，并且遵循用户特定的加密算法。见图 7-164。\n\n![A421506_1_En_7_Fig164_HTML.jpg](img/A421506_1_En_7_Fig164_HTML.jpg)\n\
  \n图 7-164. JRA 函数操作块配置\n\n- **JRA 会话操作**：提供 SAP JRA 启动会话操作块名称。（JRA 函数块中的其他配置选项具有相同功能，将在稍后的\
  \ JCo 函数操作块部分解释）。\n\n- **SAP JRA 提交**：此操作在使用 SAP Java 资源适配器 (SAP JRA) 的 SAP MII\
  \ 和 SAP ERP 中央组件 (SAP ECC) 之间的会话期间执行提交功能。见图 7-165。\n\n![A421506_1_En_7_Fig165_HTML.jpg](img/A421506_1_En_7_Fig165_HTML.jpg)\n\
  \n图 7-165. JRA 提交操作块及其配置\n\n- **SAP JRA 回滚**：此操作用于在使用 SAP Java 资源适配器 (SAP JRA) 的\
  \ SAP MII 和 SAP ERP 中央组件 (SAP ECC) 之间的会话期间回滚函数调用。见图 7-166。\n\n![A421506_1_En_7_Fig166_HTML.jpg](img/A421506_1_En_7_Fig166_HTML.jpg)\n\
  \n图 7-166. JRA 回滚操作块及其配置\n\n- **SAP JRA 结束会话**：此操作用于使用 SAP Java 资源适配器 (SAP JRA)\
  \ 关闭 SAP MII 和 SAP ERP 中央组件 (SAP ECC) 之间的会话。见图 7-167。\n\n![A421506_1_En_7_Fig167_HTML.jpg](img/A421506_1_En_7_Fig167_HTML.jpg)\n\
  \n图 7-167. JRA 结束会话操作及其配置\n\n\n\n## 使用 SAP JCo（SAP Java 连接器）\n\n`SAP JCo` 操作块使用\
  \ SAP Java 连接器（`SAP JCo`）调用业务应用程序编程接口（BAPI）。它们还控制 `SAP MII` 与 `SAP ERP 中央组件`（`SAP\
  \ ECC`）之间的会话。\n\n其组件描述如下：\n\n- `SAP JCo 接口`：此操作从 ERP 服务器创建一个到 SAP Java 连接器（`JCo`）接口的连接，并创建一个远程函数调用（`RFC`）请求。`SAP\
  \ JCo 接口`操作用于向 ERP 系统发送 XML 消息以及从 ERP 系统接收 XML 消息。这不需要会话处理。参见图 7-168。\n\n![A421506_1_En_7_Fig168_HTML.jpg](img/A421506_1_En_7_Fig168_HTML.jpg)\n\
  \n图 7-168. JCo 接口操作块及其配置\n\n- `SAP JCo 启动会话`：此操作在 `SAP MII` 与 `SAP ERP 中央组件`（`SAP\
  \ ECC`）之间打开一个会话。参见图 7-169。\n\n![A421506_1_En_7_Fig169_HTML.jpg](img/A421506_1_En_7_Fig169_HTML.jpg)\n\
  \n图 7-169. JCo 启动会话操作块及其配置\n\n- `SAP JCo 结束会话`：此操作关闭 `SAP MII` 与 `SAP ERP 中央组件`（`SAP\
  \ ECC`）之间的一个会话。参见图 7-170。\n\n![A421506_1_En_7_Fig170_HTML.jpg](img/A421506_1_En_7_Fig170_HTML.jpg)\n\
  \n图 7-170. `SAP JCo 结束会话`操作块及其配置。此操作使用与`启动会话`操作块相同的名称进行配置，并按下图所示方式放置在引用中，以终止 `JCo`\
  \ 会话。\n\n- `SAP JCo 函数`：此操作在 `SAP MII` 与 `SAP ERP 中央组件`（`SAP ECC`）之间的会话期间执行一个函数。参见图\
  \ 7-171。\n\n![A421506_1_En_7_Fig171_HTML.jpg](img/A421506_1_En_7_Fig171_HTML.jpg)\n\
  \n图 7-171. `SAP JCo` 函数操作块及其配置\n\n以下是一些常用于配置 `JCo` 函数的选项：\n\n可用的 RFC 类型如下：\n- 尽力而为（sRFC\
  \ 或 0）\n- 仅执行一次（tRFC 或 1）\n- 顺序仅执行一次（qRFC 或 2）\n- `队列名称`：用于顺序 BAPI/RFC 处理的 tRFC\
  \ 队列名称。\n- `RFC 名称`：要调用的 BAPI/RFC 的名称。\n- `搜索模式`：用于按名称搜索 BAPI/RFC。可与星号（*）通配符一起使用进行模糊搜索。\n\
  - `保留天数`：异步重试调用 `SAP ECC` 的天数。仅适用于异步处理类型。\n- `最大重试次数`：重试调用 `SAP ECC` 的最大次数。仅适用于异步处理类型。\n\
  - `重试间隔`：`SAP ECC` 通信重试之间的时间间隔（以秒为单位）。\n- `处理类型`：用于与 `SAP ECC` 通信的以下策略之一：\n  1.\
  \ 同步处理：BAPI/RFC 仅执行一次，即使失败也只执行一次。\n  2. 出错时异步处理：BAPI/RFC 执行一次。事务等待初始调用成功或失败，然后继续。如果与\
  \ `SAP ECC` 的通信中断，则会在后台重试。\n  3. 异步处理：BAPI/RFC 始终在后台执行。事务继续执行，无需等待响应。\n\n- `SAP\
  \ JCo 提交`：此操作在 `SAP MII` 与 `SAP ERP 中央组件`（`SAP ECC`）之间的会话期间执行提交功能。参见图 7-172。\n\n\
  ![A421506_1_En_7_Fig172_HTML.jpg](img/A421506_1_En_7_Fig172_HTML.jpg)\n\n图 7-172.\
  \ `SAP JCo` 提交操作块及其配置。此操作需要在 `JCo` 提交操作块中引用 `JCo 启动会话`操作块的名称，以提交该函数。\n\n- `SAP JCo\
  \ 回滚`：此操作用于在 `SAP MII` 与 `SAP ERP 中央组件`（`SAP ECC`）之间的会话期间回滚一个函数。参见图 7-173。\n\n![A421506_1_En_7_Fig173_HTML.jpg](img/A421506_1_En_7_Fig173_HTML.jpg)\n\
  \n图 7-173. `SAP JCo 回滚`操作块及其配置。此操作需要在 `JCo 提交`操作块中引用 `JCo 启动会话`操作块的名称，以提交该函数。\n\n\
  - `SAP JCo 执行队列`：此操作用于执行排队的远程函数调用（`qRFC`）处理。假设一个带有 RFC 的 `SAP JCo 函数`操作可以被配置。其值为“顺序仅执行一次”，并指定了队列名称。然后，可以向事务添加\
  \ `SAP JCo 执行队列`操作，以便在目标 `SAP` 服务器上运行该队列。每当需要任何排队的远程函数调用（RFC）时，此操作块会与 `SAP JCo 函数`操作块一起使用。为实现此目的，需要将\
  \ `SAP JCo 函数`操作块的 RFC 类型配置为“顺序仅执行一次”，并指定队列名称，如图 7-174 所示。\n\n![A421506_1_En_7_Fig174_HTML.jpg](img/A421506_1_En_7_Fig174_HTML.jpg)\n\
  \n图 7-174. `SAP JCo 执行队列`操作块及其配置。系统会检查是否存在现有的数据缓冲区条目。如果存在条目，系统会为 `qRFC` 创建一个新的数据缓冲区条目，并将其添加到作业中。\n\
  \n## SAP MII 15.X 中的新操作块\n\n`SAP MII` 的新版本中引入了许多新的操作块。新操作块描述如下：\n\n- `SQL 事务执行批处理`：此操作块用于执行批处理，如图\
  \ 7-175 所示。\n\n![A421506_1_En_7_Fig175_HTML.jpg](img/A421506_1_En_7_Fig175_HTML.jpg)\n\
  \n图 7-175. `SQL 事务执行批处理`操作块及其配置\n\n- `SQL 事务清除批处理`：此操作块清除队列中的批处理，如图 7-176 所示。\n\n\
  ![A421506_1_En_7_Fig176_HTML.jpg](img/A421506_1_En_7_Fig176_HTML.jpg)\n\n图 7-176.\
  \ `SQL 事务清除批处理`操作块及其配置\n\n- `JSON 到 XML 转换器`：此 XML 功能块将 JSON 结构转换为 XML 结构，如图 7-177\
  \ 所示。\n\n![A421506_1_En_7_Fig177_HTML.jpg](img/A421506_1_En_7_Fig177_HTML.jpg)\n\
  \n图 7-177. SAP `JSON 到 XML 转换器`操作块及其配置。当在 JSON 输入中提供一个输入 JSON 结构，并保存并执行后，会生成一个 XML\
  \ 版本作为该操作块的输出。`大尺寸 JSON`复选框是一个布尔标志，选中时取值为 1，未选中时取值为 0。如果选中，则可以提供较大的 JSON 输入；否则将不接受。\n\
  \n- `ADS 打印`：ADS 打印允许您从 `SAP MII` 生成带条形码/二维码的 PDF 格式文件。这可以直接用于将结果打印到真实打印机、保存到文件系统或提供给\
  \ Web 浏览器，如图 7-178 所示。\n\n![A421506_1_En_7_Fig178_HTML.jpg](img/A421506_1_En_7_Fig178_HTML.jpg)\n\
  \n图 7-178. `ADS 打印`操作块及其配置\n\n请参阅 [`http://www.sap.com/documents/2016/09/864b7d45-8a7c-0010-82c7-eda71af511fa.html`](http://www.sap.com/documents/2016/09/864b7d45-8a7c-0010-82c7-eda71af511fa.html)。\n\
  \n"
- '# 总结


  本章介绍了与 `MDO`、可视化服务、`UI5` 和 `SSCE`、KPI 和警报、`PIC`、`PCo`、查询和 `JRA` 的会话处理以及 `SAP MII`
  中引入的新操作块相关的一般概念。


  下一章将讨论使用 `SAP MII` 时应遵循的最佳实践以及常见问题解答，这将帮助您更深入地理解 `SAP MII`。





  '
- '# 8\. 最佳实践与常见问题解答


  在每个编程和技术平台中，产品所有者都有一套推荐的方法。同样，SAP MII 也有需要遵循的注意事项。SAP MII 是一个平台，因此 SAP 提供了一些建议。应遵循此处解释的最佳实践，以获得最佳性能并确保解决方案的有效性。


  ## 最佳实践


  建议您遵循以下章节中解释的最佳方法。


  ### 项目处理


  从 SAP MII 中项目创建的角度来看，始终建议最好使用 NWDI（NetWeaver 开发基础架构）来实现适当的版本控制机制，为整个开发组件使用中央存储库功能，并实现零代码覆盖风险。如果使用
  NWDI，则会创建一个共享项目，并且必须在该项目中进行代码的签入和签出。如果您创建一个本地项目并将其存储在本地服务器上，那么任何有权访问该服务器的人都可以访问该代码。由于多个开发人员可以编辑和保存代码，因此代码被覆盖的可能性很大。代码更改的最新实例将被保存。


  ### 项目文件夹结构


  创建项目时，建议您使用特定的、易于理解的结构。例如，在“项目”下的“目录”选项卡中，应有单独的文件夹来定义项目的不同功能，例如报告名称。在每个功能下，应为不同的对象类型（如查询模板和
  BLS）设置单独的文件夹。在“对象”和“Web”选项卡中需要遵循完全相同的结构，但将查询模板和 BLS 替换为 MDO、KPI 对象等，以及 Web 文件 HTML
  (`.irpt`)、JavaScript 等。


  ### 命名约定


  作为最佳实践的一部分，还应遵循某些命名约定。以下是一些示例：


  *   调度器：`<项目名称>_<功能>_<工厂（如果有）>`

  *   数据服务器：`DS_<项目名称>_<服务器名称>`

  *   凭据存储：`<项目名称>_<连接名称>`

  *   BLS：`BLS_<功能>`

  *   查询：`SQL_<功能>`、`[MDOQry/KPIQry/AlertQry]_<功能>`、`PCO_<功能>`、`XCT_<BLS 名称>` 等。

  *   显示模板：`LineChrt_<功能>`、`iGrd_<功能>` 等。

  *   对象：`MDOObj_<表名称>`、`KPIObj_<KPI 名称>`


  请注意，如果客户根据公司政策有一些预定义的命名约定，则应优先考虑这些约定。


  ### 开发


  在开发期间，请遵循以下建议来编写干净的代码并获得更好、更有效的性能：


  *   只有 BLS 中使用的输入和输出属性才应声明为事务变量。BLS 中临时使用的所有其他变量应声明为局部变量。

  *   始终使用`异常启用器`和`捕捉`操作块来捕获逻辑中的任何异常。

  *   避免在一个重复器下使用另一个重复器。尽可能避免逻辑中的循环。相反，使用 XSLT 以获得良好的性能。

  *   使用 XPath 和 XQueries 避免循环。

  *   开发最终确定后（即迁移前），移除所有跟踪器和日志记录器；否则，性能将非常差，有时由于日志记录过多可能导致内存崩溃问题。

  *   尽可能避免写入文件和加载器操作块，因为它们在执行时会消耗大量内存。

  *   避免使用终止操作块。

  *   调试完成后，必须移除断点和监视点；否则，BLS 的执行将停在这些断点处。

  *   如果任何 BLS 以调试模式执行，请使用“调试关闭”按钮将其关闭。不要直接点击交叉（X）按钮关闭。即使 BLS 已关闭，每当 BLS 执行时，缓存内存也会继续缓存调试日志，并可能导致
  Java 堆空间错误。

  *   避免再次将大的输入存储在局部变量中，即使它已从源端传入，因为一旦值进入 BLS，它将一直存在直到 BLS 执行结束。

  *   如果可以通 MII 输出 XML 操作块实现相同的效果，请避免创建本地 XML 结构作为局部变量并在其中附加值。

  *   如果适合逻辑，请尝试尽可能多地使用异步事务调用。同步事务调用会保持主 BLS 的执行，直到被调用的 BLS 执行完成，从而对性能产生不利影响。

  *   为所有操作块使用有意义的命名约定，并采用驼峰式命名。如果可能，请提供操作块描述。

  *   避免从调度器调用 BLS，如果该 BLS 中存在同步事务调用。这会保持调度器实例的执行，并使调度器长时间处于运行状态。在这种情况下，尝试使用包装器 BLS，它将异步调用主
  BLS，并将包装器 BLS 放入调度器中。调度器实例将不会排队等待下一次执行，因为它是异步工作的。

  *   不要在操作块中硬编码用户名和密码。尝试使用凭据别名并在操作块中引用它们。类似地，这也适用于连接别名。

  *   避免在操作块配置中硬编码，并尽可能地动态使用它。

  *   如果不需要，不要在 SQL 查询中使用 `select *`。尝试在查询时定义特定列。

  *   不要在 UI 中使用硬编码的超时。尝试使用逻辑处理超时。

  *   不要在 UI 中使用的 URL 中硬编码用户名和密码。

  *   不要在 BLS 和 UI 中重复任何逻辑部分。在 UI 中，尝试在多个位置调用该功能。

  *   建议在使用 JCO、JRA 进行 ECC 调用以及类似地用于查询模板时使用会话。这有助于提交和回滚调用。

  *   建议对 UI 使用 MVC 模型，这有助于保持代码整洁，并易于其他开发人员理解。

  *   尝试在 Web 选项卡中为不同的用户区域设置使用单独的属性文件。

  *   尝试开发一个实用程序文件，其中包含不同模块的通用功能代码，以便在其他对象开发设置中重用。

  *   在注释部分说明 UI 前端编码中使用的代码和功能。这将有助于其他开发人员以后理解代码。


  ## 常见问题解答


  以下是一些 SAP MII 专业人士和从业者常问的问题：




  1. 什么是 SAP MII ？`SAP MII` 是一个由 Lighthammer 使用 `Java` 开发、后被 `SAP` 收购的平台。`SAP MII`
  可以作为具有实时集成和高端智能能力的中间件运行。`SAP MII` 非常先进，利用 `IOT` 可以实现众多创新。


  2. 如何安装 `SAP MII`？ `SAP MII` 可以安装在 `NetWeaver` 或 `SAP HANA` Web 应用服务器之上。


  3. `SAP MII` 有哪些可用版本？ `SAP MII` 由 `SAP` 以 `SAP xMII 11.5` 版本推出。其后，依次发布了 `SAP MII
  12.0`、`SAP MII 12.1`、`SAP MII 12.2`、`SAP MII 14.0` 和 `SAP MII 15.0`。最新版本是 `SAP MII
  15.1`。


  4. `SAP MII` 是否支持 `SAP HANA`？ 是的，从 `SAP MII 15.1` 版本开始，可以使用 `OData` 服务将 `MII` 数据暴露到
  `HANA` 中。


  5. `SAP MII` 的基础组件是什么？ `SAP MII` 是使用 `Java Swing` 开发的，并且 `SAP MII` 支持使用 `XML` 进行所有内部处理和操作。


  6. 使用 `SAP MII` 可以实现哪些类型的集成？ `SAP MII` 可以连接 `SAP ERP`、任何类型的数据库、支持任何类型 `REST` 服务（如
  `HTTP Post`、`Web service`、`JMS` 等）的系统，以及任何支持 `UDC connector` 的车间层系统。


  7. `SAP MII` 具备哪些智能功能？ `SAP MII` 可以使用各种图表展示丰富且高端的报表，并且也可以使用 `SAP MII` 开发用户交互界面。


  8. 使用 `SAP MII` 可以开发哪些类型的应用？ 基于 `SAP MII` 的应用始终是基于 Web 的应用，因为 `SAP MII` 运行在 `Web
  Application Server` 上。


  9. `SAP MII` 提供实时数据吗？ 是的，`SAP MII` 完全能够提供接近实时的数据。然而，由于基于 `SAP MII` 开发的应用是基于 Web
  的，因此很难期望在基于 `SAP MII` 的应用中获得精确的实时数据，因为数据流依赖于网络速度。


  10. 基于 `SAP MII` 的应用的灵活性如何？ 从集成角度来看，`SAP MII` 可以双向连接并从大多数系统获取数据。从 UI 角度来看，`SAP MII`
  现在使用 `SAP UI5` 进行用户界面开发。`SAP UI5` 与浏览器无关，这有助于应用程序在任何类型的窗口或任何移动浏览器上运行，无论操作系统是什么。


  11. `SAP MII` 支持哪些操作系统服务器？ `SAP MII` 可以在 `Windows`、`Linux` 和 `SAP PCo` 上运行，`SAP
  PCo` 是 `SAP MII` 中可自由分发的组件之一。它也是与车间层集成的重要工具，但仅支持 `Windows Server`，因为 `SAP PCo` 是使用
  `Microsoft .NET` 技术开发的。


  12. `MDO` 与数据库有何不同？ `MDO` 代表 `Manufacturing Data Object`。它是 `SAP MII` 应用的内部数据库或缓存。数据可以存储在
  `MDO` 中并在本地查询以更快地获取数据，而不是直接查询数据库。`MDO` 有两种类型——`persistent`（持久化）和 `on-demand`（按需）。它们在数据存储方式上有所不同。


  13. `SAP MII` 是如何与 `HANA` 集成的？ 可以使用 `SAP MII Smart Data Adapter (SDI)` 从 `SAP HANA`
  中获取来自工厂或制造系统的数据。通过使用该适配器，来自 `PCo` 的数据、`SAP MII` 中的查询将在 `SAP HANA` 的虚拟表中可用，并且这些表可用于
  `SAP HANA` 中的各种分析和计算视图。


  14. 什么是共享内存？ 它是一种持久性内存，可用于存储有限的值，并可在开发逻辑时作为持久性变量在事务中使用。用户可以通过 `SAP MII` 菜单页面访问共享内存。更改共享内存中的值无需修改代码。


  15. 什么是自定义动作块？ 自定义动作块是在 `Java` 平台上开发的定制代码，用于处理 `SAP MII` 中未作为标准功能提供的特定功能。使用用于自定义动作块的标准
  `SDK`，可以创建包含具有特殊处理功能的 `Java` 代码的 `.JAR` 文件，然后将其上传并在 `SAP MII` 工作台中以动作块的形式使用。


  16. 是否可以访问 `Excel` 文件？ 是的，可以通过两种方式实现。如果 `Excel` 文件名是固定的，即使其内容定期刷新，也可以通过 `PCo`、文件系统连接器和
  `SAP MII` 中的 `OLEDB` 连接器来集成该文件。另一种方法是通过 `Java` 开发一个自定义动作块进行集成。


  17. `SAP MII` 事务是否可以远程调用？ 是的，可以使用 runner 服务调用 `SAP MII Transaction`。Runner 服务是一种
  `illuminator` 服务，可以使用以下 URL 格式从外部调用 `MII` 事务：`http://<server>:<port>/XMII/Runner/Transaction=<folder>/<TransactionName>&<InputParamName1>=<value1>&<InputParamNameN>=<valueN>&OutputParameter=<OutputParamName>&Content-Type=<content-type>&isBinary=<true|false>&XacuteLoginName=
  <username>&XacuteLoginPassword=<password>`


  18. 是否可以将 `SAP MII Transaction` 暴露为 `REST` 服务？ 是的，在 `SAP MII` 中可以将任何 `SAP Transaction`
  暴露为 `SOAP web service`。`MII` 事务可以使用以下 URL 转换为 `WSDL`：`http://<server>:<port>/XMII/WSDLGen/<projectName>/<folderName>/<transactionname>`
  要将 `SAP MII` 事务作为 `Web Service` 运行，请使用以下 URL：`http://<server>:<port>/XMII/SOAPRunner/<projectName>/<folderName><transactionname>`


  19. `SAP MII` 支持同步和异步调用吗？ 是的，它同时支持同步和异步调用。在一个 `SAP MII Transaction` 内部，可以根据需求调用其他事务。事务可以以异步和同步两种方式调用。在同步调用中，父事务调用子事务并等待子事务执行完成。根据执行结果，父事务完成逻辑并关闭会话。在异步调用中，父事务触发子事务，然后父事务完成其全部逻辑并关闭会话。它不等待被触发的子事务完成，因此子事务始终独立执行。


  20. 共享属性的默认内存和活动内存有什么区别？ `SAP MII` 中的共享属性同时具有默认内存和活动内存。默认内存拥有默认值，而活动内存拥有活动值。活动值可以从工作台的
  `Tools` 选项卡或 `SAP MII` 管理页面的 `Data Servers` 部分进行检查。在事务执行时，值总是从活动内存中获取。最初为任何变量创建默认内存时，相同的值会在第一次立即自动复制到活动内存中。


  21. 迭代器和重复器有什么区别？ `SAP MII Transaction` 为我们提供了多种用于逻辑赋值的作用块。用于循环的主要有两个作用块——迭代器和重复器。迭代器用于遍历列表，因为其输入源是一个列表。重复器用于遍历
  `XML` 节点。


  22. 什么是计划事务？ 计划事务是指能够按照定义的调度计划执行为所需逻辑设计的 `MII Transaction` 的事务。它们可以根据需要随时启用或禁用。


  23. 是否存在可以直接维护工厂层次结构的平台？ 是的，从 `SAP MII` 15+ 版本开始，`SAP MII` 提供了 `PIC (Plant Information
  Catalog)`。使用该功能，可以在 `SAP MII` 中定义工厂层次结构以及相关的标签和详细信息。


  24. `PCo` 如何在 `SAP MII` 中使用？ `SAP Plant Connectivity (PCo)` 是一个软件组件，用于实现车间层和 `SAP
  MII` 之间的数据交换。在 `PCo` 中，可以定义车间层标签，以直接从机器获取实时时间序列数据；它也可以维护历史数据。从 `PCo` 交换数据有两种方式：一种是推送方法，即创建包含标签组的代理，并定义特定条件，当条件满足时触发通知到
  `SAP MII` 中指定的 `BLS`。第二种是拉取机制，即通过从 `SAP MII` 使用 `PCo` 连接器执行 `PCo` 查询来直接从标签获取数据。


  25. `SAP MII` 是否有支持其他 `SAP` 制造产品？ 是的，它支持 `SAP` 制造产品——`SAP ME` 和 `SAP OEE`，通过它们的集成组件
  `MEINT` 和 `OEEINT`。由于这两个产品都是在 `SAP MII` 之上开发的，因此也可以借助标准解决方案通过 `SAP MII` 进行自定义逻辑挂接（活动钩子）和自定义仪表盘（`ME`
  的 `POD` 和 `OEE` 的操作员仪表盘）的开发。因此，总结来说，`SAP MII` 与这两个制造产品紧密耦合。


  26. 什么是启动（Bootstrapping）？ 要启动 UI 中的任何应用程序，必须首先加载并初始化它。这个加载和初始化的过程被称为启动。


  27. `SAP UI5` 开发支持哪些数据模型？ `SAP UI5` 支持 `XML` 模型、`JSON` 模型、`OData` 模型和 `JS` 模型视图。


  28. 基于 Applet 的 UI 编码（`.irpt`）和 `UI5` 编码有什么区别？ 在基于 Applet 的 UI 编码中，要加载任何类型的显示模板（如图表、网格等），需要首先加载
  `Java JRE`，这在执行期间会消耗大量时间，并可能导致缓存问题。有时 `JRE` 版本也会给 applet 版本带来问题。`UI5` 是一种独立于 `Java`
  的编码方式，用于所有 UI 组件（如 `HTML5`），因为它遵循 `MVC` 模型。这意味着 `UI5` 的处理时间比 `.irpt` 文件快得多，并且在 `UI5`
  中没有缓存问题。


  29. `i5` 显示模板和普通显示模板有什么区别？ `SAP MII` 引入了基于 `UI5` 的新显示模板，并命名为 `i5` 模板，而现有的模板是基于 Applet
  的模板。


  30. 什么是 `IRPT` 页面？ `IRPT` 页面，也称为 `SAP MII` 报表，是一种使用 `SAP MII` 的 `.irpt` 文件扩展名（而非标准的
  `.html` 文件扩展名）的网页。`IRPT` 页面通过服务器端处理促进网页的动态生成。Web 服务器将 `.irpt` 页面发送给一个名为 `ReportServlet`
  的专用 servlet 进行处理。`IRPT` 使用一些特殊功能，例如会话变量和在网页中动态插入内容。这使得它不同于 `HTML`。


  31. `SAP MII` 中是否有用于跟踪和记录活动的功能？ 可以在 `SAP MII` 中通过 `NWA` 日志进行日志记录，需要在 `NetWeaver`
  中进行一些配置，然后即可启动此跟踪过程。`Event Logger` 动作块也可以在日志中从 `SAP MII Transaction` 跟踪自定义消息。


  32. 什么是 illuminator 服务？ `Illuminator` 服务是 `SAP MII` 的支柱。使用此 Web 服务，可以调用、修改和更新任何
  `SAP MII` 标准组件。除此之外，`SAP MII` 的组件，如查询模板、显示模板和 UI 组件，可以直接调用来访问它们。这是处理存储在内部表中的 `SAP`
  标准数据的唯一途径。


  33. 如何使用 illuminator 服务？ `Illuminator` 服务包含两个主要参数——一个是服务（service），另一个是模式（mode）。有多个可用的服务，包括
  `admin`、`systemInfo`、`scheduler`、`BLS` 管理器服务等。每种服务也有多种可用模式。其编写方式如下：`http://<server>:<port>/XMII/Illuminator?service=<service
  name>&mode=<mode name>&content-type=text/xml`



  '
- '# 总结


  在本章中，你学习了在 SAP MII 中应遵循的最佳实践。与此同时，还提供了常见问题解答。这些内容有助于你更好地掌握 SAP MII。


  现在，你已经准备好使用 SAP MII 了。你对制造业有了了解，也知道了制造业的历史与类型。你了解了 SAP MII 是如何进入制造业的，以及它如何随着版本更新而日益发展。这将帮助你理解
  SAP MII 升级项目中的变更与需求。你学习了 SAP MII 为何重要以及其适用场景，因此现在能够关联业务需求，并轻松理解可能的业务场景。随着你熟悉了 SAP
  MII 的基础知识、组件，以及如何在 SAP MII IDE 中开发技术对象，你应该有信心在其中开展工作。


  与此同时，你还详细了解了各种制造领域及其需求，以及 SAP MII 和其他 SAP 制造产品如何满足这些需求。最后，但同样重要的是，你也了解了使用 SAP MII
  的各种集成场景以及 SAP MII 的新功能。因此，作为本书的总结，你将能完美地引导自己理解和探索 SAP MII。此外，如需获取有关 SAP MII 的更多知识，你可以访问
  SCN（SAP 社区网络），网址为 [`www.sap.com/community/topic/manufacturing-integration-and-intelligence.html`](https://www.sap.com/community/topic/manufacturing-integration-and-intelligence.html)，在此你可以阅读各种博客、文档和讨论。




