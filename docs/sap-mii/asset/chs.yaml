  \ SCN 社区和制造业专业人士。\n\n——萨普塔帕娜·慕克吉（达斯）\n\n## 前言\n\n\n\n管理思想家彼得·德鲁克（Peter Drucker）常被引用的一句话是：“如果你无法衡量它，就无法改进它。”虽然这句话的含义广为人知，但在制造车间现场进行衡量会带来一些固有的困难。其中首要的是工厂不同的成熟度水平以及需要连接起来的异构系统环境。寻找一个单一工具来无缝连接这些系统并提供可视化是一项困难且成本高昂的任务。这正是`SAP\
  \ Manufacturing Integration & Intelligence`（`SAP MII`）在制造业中产生最大影响的地方，它不仅提供了无缝的连接、集成和可视化，还将可操作的情报直接呈现在最终用户面前。`SAP\
  \ MII`是衡量和可视化的强大推动者，是制造车间现场持续改进的基石。作为一个工具集，`SAP MII`在制造业中拥有广泛的实施场景覆盖。`SAP MII`的最新版本还带来了预交付的内容，如`SAP\
  \ OEE`（整体设备效率）和`EMA`（能源监控与分析），这些内容降低了`MII`实施的总拥有成本（TCO）。\n\n自从 SAP 收购 Lighthammer\
  \ 软件公司（即今天的`SAP MII`（制造集成与智能））以来，已经过去十多年了。我有幸几乎从`SAP MII`在 SAP 诞生之初就与之结缘。从那时起，`SAP\
  \ MII`就获得了大量的客户采用，并在制造车间现场创造了许多成功案例。\n\n尽管`SAP MII`已经取得了长足的进步，但当我与全球各地的客户交流时，我仍然看到执行他们的项目需要更多的`MII`顾问。一方面，这表明对顾问的需求大于供应；另一方面，这也说明了需要更多易于获取的培训和资源。虽然已有一些关于`MII`的书籍和培训，但由顾问根据其实际实施经验编写更多的书籍，始终能为这一主题增值，并在培训中更深入地解释概念。这正是我看到的本书为\
  \ SAP 制造社区带来的价值。\n\n最后但并非最不重要的一点是，我们都知道写书需要额外的热情和辛勤工作，我非常感谢 Suman 和 Saptaparna 在繁忙的咨询工作之余，投入时间记录他们在`MII`实施中的客户经验。我相信，本书将通过介绍在车间现场使用`MII`的更多维度，丰富\
  \ SAP 制造社区。我也感谢 Suman 和 Saptaparna 对 SAP 制造业的热情以及他们为 SAP 顾问社区撰写本书的奉献精神。祝他们未来一切顺利。\n\
  \nSumanta Chakraborty  \n2017 年 3 月\n\n## 引言\n\n制造业是一个庞大而复杂的行业，它使用自动化来快速高效地处理流程，并与其他智能系统准确集成。大多数情况下，管理层与生产单位之间存在差距，这使得管理人员无法了解车间现场发生的实时情况。这会导致行业关键绩效指标（KPI）出现巨大偏差。此外，车间现场操作员在不同机器读数期间，需要手动维护数据。`SAP\
  \ MII`填补了这些空白，并为制造业提供了智能化和多系统的无缝集成。\n\n本书解释了什么是`SAP MII`，以及它如何成为制造业中的一个必要平台。它还向跨职能领域的业务所有者解释了`SAP\
  \ MII`的可用性和灵活性。同时，它将帮助`SAP MII`的技术和功能实践者理解产品的各种隐藏特性及其最佳实践。它将帮助初学者通过提供的常见问题解答（FAQ）快速参考，更好地掌握`MII`。\n\
  \n## 目标读者\n\n本书适用于各个级别的 SAP 制造专业人士，从管理及设计基础设施的业务流程所有者、生产工程师和架构师，到功能和技术的顾问与实践者。\n\
  \n\n\n## 本书结构\n\n本书共分为八个章节：\n\n第 1 章阐释了制造业的概念以及制造业领域发生的革命。本章还介绍了制造过程中涉及的不同流程，以及如何在任何制造过程中弥合制造利益相关者与生产单元之间的差距。本章解释了什么是\
  \ `SAP MII`，以及它通过自身产品架构、安装概念和系统配置特性所能实现的功能。\n\n第 2 章从功能、技术和业务角度，阐述了制造业面临的关键挑战以及为何应使用\
  \ `SAP MII`。本章还说明了何时优先选用 `MII` 而非 `SAP BI/BW`，反之亦然。此外，本章还介绍了 `PI`，包括其优缺点，以及何时最适合使用\
  \ `MII` 或 `PI`，或两者并用。\n\n第 3 章介绍了 `SAP MII` 的基础知识、与其各项配置相关的步骤、其开发组件，以及开始使用 `SAP\
  \ MII` 所需的初步基础知识和其他基本特性。\n\n第 4 章阐释了离散制造过程中不同制造领域（如汽车、航空与航天国防、发电和采矿）的基本功能。本章探讨了倾向于自动化的可能场景，并解释了如何利用\
  \ `SAP MII` 来满足自动化的需求和实现要求。\n\n第 5 章阐释了流程制造过程中不同制造领域（如制药、消费品包装以及石油和天然气制造业）的基本功能，以及这些行业倾向于自动化的可能场景。本章解释了\
  \ `SAP MII` 如何能够针对所有这些问题提供精确的解决方案。\n\n第 6 章介绍了通过 `SAP MII` 可实现的不同集成方式及其各自的配置步骤。本章还介绍了\
  \ `SAP MII` 查询模板、事务以及新开发人员需要了解的不同操作块的基础知识。本章进一步阐述了 `SAP MII` 与其他 SAP 制造产品集成模块（即\
  \ `MEINT` 和 `OEEINT`）集成的概念。\n\n第 7 章介绍了 `SAP MII` 的新特性，例如与 `MDO`、可视化服务、`UI5` 和 `SSCE`、`KPI`\
  \ 和警报、`PIC`、`PCo`、查询会话处理和 `JRA` 相关的一般概念，以及在 `SAP MII` 中引入的新操作块。\n\n第 8 章介绍了 `SAP\
  \ MII` 的最佳实践、建议和常见问题解答。\n\n## 致谢\n\n一直以来，我们都怀揣着一个愿景，希望凭借我们共同掌握的这项技术，在职业生涯中携手做出一些与众不同的事情。当这份写书计划提上日程时，我们心想：“就是它了！”\
  \ 我们非常高兴能够成功启动并完成这个项目，尤其是考虑到我们个人生活中最近经历了一些非常艰难的时期。\n\n没有我们日常生活中许多重要人士的帮助和支持，我们不可能写成这本书。\n\
