  ### CPG 行业对 SAP MII 的需求


  消费品包装商品（CPG）行业需要跨不同系统的分析报表和智能集成。由于 CPG 制造涉及多个传感器、感应设备和可编程逻辑控制器（PLC）。制造速度非常快，所有分析都必须基于实时数据完成，因此智能集成是
  CPG 行业的主要需求。该领域还涉及多个监控与数据采集系统（SCADA）和历史数据库，因此系统必须与这些系统集成以获取历史数据。所涉及机器的停机时间是该行业的另一个关键风险因素，因为它可能给公司造成巨大损失。质量采购也是该行业的一个重要需求。由于现代
  CPG 行业涉及自动化，与计划和物料管理模块的集成对于缩短生产周期、提高生产速率从而加快交货速度也至关重要。分析报表在生产绩效监控中起着重要作用。整体设备效率（OEE）报告是帮助行业维持
  ISO 标准的关键报告之一。除此之外，还需要废物管理、返工管理和质量通知管理方面的关键质量报告。物料分配、订单状态和产品移动报告有助于工作人员了解物料或最终产品的流动情况，作为供应链监控的一部分。除了分析报表外，状态报告也很重要。这些包括机器状态报告、生产线状态报告、资源可用性报告、生产计分板、信息亭（KIOSK）视图等。这些报告提供了现场当前状况和生产率的概览。


  ### 基于 SAP MII 的解决方案


  SAP MII 可以满足 CPG 制造的所有需求。CPG 的主要解决方案是智能集成和智能报表。SAP MII 两者都能提供。从集成角度来看，SAP MII 可以通过
  `SAP PCo`、`UDC` 和 `OPC` 连接器直接连接到 PLC、传感器、SCADA 和历史数据库，以获取实时和历史数据。SAP MII 可以提供所有状态报告，如机器状态、生产线状态、可用性报告等。SAP
  MII 可以与 `SAP ECC` 集成，提供实时订单状态报告和物料管理报告，因为这些都是 ERP 计划的一部分。SAP MII 在图表库方面具有极大的灵活性，可以轻松提供客户所需的图表。由于
  OEE 报告是 CPG 行业重要且关键的需求之一，可以通过两种方式处理——要么使用 SAP MII，通过自定义逻辑在 SAP MII 中计算所有 OEE 衍生数据，要么使用
  SAP 的新产品 `SAP OEE`。如上一章所述，PM（生产管理）和 QM（质量管理）级别的集成也易于通过 SAP MII 实现。


  ## 制药制造


  制药行业涉及生产有助于生物体康复过程的产品。它生产用于治疗疾病的药物。所有上市的药物必须符合世界卫生组织（WHO）、美国食品药品监督管理局（FDA）或英国药品和健康产品管理局（MHRA）制定的规则。


  制药行业可分为几个分支，例如救命药物，包括片剂、胶囊、糖浆和其他注射剂；生命支持设备，如心脏起搏器、助听器和支架 ICU 设备；光学部件，如眼镜、镜片、滴眼液等；以及医疗器械，如血糖测量套件、RNA、DNA
  和蛋白质分析套件等。每个分支的制造工艺各不相同，通常是公司机密，并依赖于研究和专利。


  我们以隐形眼镜制造为例进行讨论。镜片制造涉及两个工艺——模具制造以及抛光和精加工。模具制造工艺是一种较老的工艺，先用塑料制成模具，然后注入液态凝胶材料以形成镜片。抛光和精加工技术是一种更现代化的隐形眼镜制作工艺。制造镜片的凝胶被固化成圆柱形棒状，称为等离子棒。然后将这些棒切割成小片，并对两面进行抛光。接下来将详细解释这两种工艺。




  ### 成型工艺


  在模具制造过程中，模具由塑料制成；将塑料原料装入机器并熔化。之后，用这种液化塑料为一片镜片制造两个模具。一个称为前曲面模具，另一个称为基弧模具。这两个模具都必须按照美国食品药品监督管理局（FDA）批准的度数预测来制造。前曲面模具和基弧模具被固定在一起，两者之间的间隙填充有镜片制造凝胶。这些填充了凝胶的模具会经历若干子工序，例如振动和紫外线检查，以确保没有气泡。还有其他几个子工序用于测试成型镜片的质量和真实性，这些工序均属于组织的质量方针范畴。


  ### 精加工工艺


  进一步的步骤是将模具脱模，以得到最终产品，即实际的镜片。镜片会涂覆多种化学成分，如氮、碳、氧等，为最终消费者的眼睛提供额外保护。在此之后，镜片会再次经过多项质量检查。


  ### 现代化集成工艺中的镜片制造


  在抛光与精加工镜片制造工艺中，一旦等离子体胶棒准备就绪并被切割成小片，每一小片就会被放入自动抛光机中。在这些机器中，等离子体凝胶片被抛光，最终镜片得以制造完成。镜片的目标度数被输入抛光机，以便机器仅将镜片抛到所需水平。


  ### 质量控制


  在镜片制造过程中，涉及多个关键属性和参数，需要定期检查。关键参数基于镜片度数。在模具制造过程中，关键属性和参数分两个阶段进行测量。第一阶段测量的是预测度数、预测中心厚度、预测直径和预测半径等关键参数。这些是在塑料模具中测量的。此阶段称为“预测”，因为根据模具可以预测出所有这些结果以得到实际测量值。第二阶段测量的是实际度数、实际柱面、实际透氧性、实际中心厚度、实际镀膜厚度、实际直径、实际轴位、真空测试等关键属性。这些是在脱模后的实际制造镜片上测量的。见图
  5-3。


  ![A421506_1_En_5_Fig3_HTML.jpg](img/A421506_1_En_5_Fig3_HTML.jpg)


  图 5-3. 镜片制造流程


  ### 制药行业对 SAP MII 的需求


  制药行业的主要需求场景涉及集成和报告。在集成需求方面，SAP ECC 与机器的集成最为重要。质量控制通过一系列机器测试和人工目视检查来完成。对于目视检查，需要填写并维护纸质表格，但要完好地保存所有纸质记录非常困难。制药行业的一个关键需求是追踪从原材料接收到产品过期的全过程，因为这直接关系到人的生命。大多数公司甚至在产品过期后，出于法律原因仍会将完整记录保存数年，以便任何人在任何时候想要检查特定产品的记录时，都能进行回溯。


  从报告角度来看，产品手册是最关键的报告需求之一。它包含产品的完整记录，例如使用的成分及其百分比、原材料的过期日期、原材料来源、批次号、患者 ID、患者批准机构及日期、药品生产时间、生产条件和参数、参数的实际结果、质量检验记录、储存参数详情、分配批次详情等。这些详细信息都带有精确的时间戳和审计信息。


  由于安全与保障是该行业的另一个主要关注点，资源可用性、资源的流程认证、合规性验证以及机器可用性也是重要的所需报告。如上所述，制药行业需要处理海量数据，并且需要长期保存数据，因此，配备适当的归档和备份方案的稳健数据持久化机制至关重要。


  ### SAP MII 解决方案


  如果考虑制药行业的集成需求，SAP MII 可以提供最佳解决方案。SAP MII 具备用于连接 SAP ECC 的标准连接器，并可使用推送和拉取方法直接从 ECC
  获取数据。主数据和计划数据可以从 ECC 推送到 MII，MII 可以存储这些数据并提供丰富的分析。SAP MII 可以使用标准的 PCo 连接器直接与车间机器集成。因此，使用
  SAP MII 可以实时直接获取机器数据。由于目视检查是一个重要需求，SAP MII 可以直接与 CSV 和 Excel 文件集成以读取和存储数据。SAP MII
  可以为最终用户提供用于检查表的自定义屏幕，以便他们直接将检查报告记录到 SAP MII 屏幕中。


  制药行业中常见的自定义报告包括：良率报告、实际数量与计划数量对比报告、延迟与准时排程报告、机器概览报告、趋势报告、生产率报告、针对各工艺质量参数和属性的偏差报告、历史报告、捕获设备在选定期间内不同状态的机器状态报告，以及审计报告（何人、何时、何事、何因、何地）。通过使用
  SAP MII 从各个集成系统收集所有相关数据，可以轻松创建这些报告。同样，SAP MII 可以构建产品报告，以提供每个制造产品的完整可视性，并提供报告的电子副本，这比纸质打印件更容易存储。


  处理高数据量是制药行业的另一项重要需求，使用 SAP MII 有多种方法可以实现该需求。由于 SAP MII 现在可以托管在 SAP HANA 上，这可以成为满足此需求的一个绝佳解决方案。SAP
  MII 可以利用 SAP HANA 的内存处理能力，并将数据存储在 HANA 数据库中。这将加快处理速度。除此之外，SAP MII 可以采用传统方式将数据存储在任何关系数据库中，并生成所有必需的报告。


  另一种方法是使用 BI。在这种情况下，SAP MII 可以作为集成器，将数据移动到 BI 数据池。SAP MII 还能够进行统计计算，例如均值、平均数和标准差，这些是关键工艺参数和关键质量属性。由于其连接到任何遗留系统和任何
  SAP 系统的灵活性，SAP MII 使得在合理时间范围内呈现近乎实时的数据变得非常容易。


