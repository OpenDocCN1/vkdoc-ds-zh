- "# SAP MII（制造集成与智能）的发展历史\n\n`SAP MII` 源自`Lighthammer`软件公司开发的`Lighthammer CMS`（协同制造套件）。`Lighthammer`软件的开发始于\
  \ 1998 年，产品代号为“晨间咖啡”（Morning Coffee）。其初衷是让制造人员每天早晨都能访问运营信息，以便为每日生产会议做好准备。\n\n`SAP\
  \ AG`于 2005 年收购了`Lighthammer`，并将产品更名为`SAP xMII`，其中“x”代表`xApp`。随后，该产品被重新命名为`SAP MII`（`SAP\
  \ 制造集成与智能`）。`SAP xMII`的初始版本为 11.5，运行在微软互联网信息服务（Microsoft Internet Information Server）上。后来，他们将其迁移至`SAP\
  \ NetWeaver 7`。`SAP MII`正是原始愿景（`SAP xMII`）的延续与演进，其范围不仅扩展到可视化和分析，还包括将车间内的多个制造系统相互集成，并与企业其他系统进行集成。\n\
  \n`SAP MII`在持续扩展，许多新功能被添加以增强`SAP MII`的先前版本。\n\n图 1-1 展示了 2005 年至 2009 年间功能的演进历程。\n\
  \n![A421506_1_En_1_Fig1_HTML.jpg](img/A421506_1_En_1_Fig1_HTML.jpg)\n\n图 1-1. `SAP\
  \ MII` 11.5 至 12.1\n\n图 1-2 展示了 2010 年至 2015 年间的进步。\n\n![A421506_1_En_1_Fig2_HTML.jpg](img/A421506_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2. `SAP MII` 12.2 至 15.1\n\n## SAP MII 概览\n\n`SAP MII` 是一个灵活的**平台**，其基本设计可进行定制以适应客户需求。它提供了强大的集成能力和高质量的智能分析。`SAP\
  \ MII` 能够实现车间系统与企业系统之间近乎实时的数据集成。`SAP MII` 还提供了一个**模型驱动**的开发环境，这意味着它不遵循传统的逐行编码风格，而是一种**拖放式**的层级设计开发模式。\n\
  \n`SAP MII` 可以使用 `Business Logic` 服务开发多种逻辑。同时，借助可视化引擎，它可以通过用户界面提供卓越的智能体验。`SAP MII`\
  \ 内置了连接性和内容，用于连接 `SAP` 业务套件，如 `ERP`、`SAP SCM` 和 `SAP PLM`。`SAP MII` 可以将数据持久化存储在\
  \ `MDO` 中，这样客户就无需为数据存储设置额外的数据库，从而降低了成本和维护费用。目前，`SAP MII` 拥有标准的告警和 `KPI` 生成机制。\n\n\
  `SAP MII` 使用 `XML` 和 `Java` 适配器等网络标准作为集成组件，以连接 `ERP` 和其他相关业务组件。`SAP MII` 可以同时与多个来源和不同的数据连接器进行集成，并提供基于网页的分析仪表盘。目前，`SAP\
  \ MII` 可以连接到 `HANA`，并利用 `HANA` 的内存数据库进行设计。\n\n简而言之，`SAP MII` 可以根据以下几点进行阐述：\n\n-\
  \ `SAP MII` 能够集成所有可用的制造系统以及信息系统，为企业用户提供一个通用的交互平台。\n- `SAP MII` 通过支持制造员工通过 `PDA`（个人数字助理）、智能手机和其他数字设备监控关键应用，成功推动了无线应用领域的革命。\n\
  - `XML` 是 `SAP MII` 作为结构语言的支柱，它能够处理车间制造系统与 `ERP`、`CRM` 等业务应用之间的不同集成问题。它还利用 `SOAP`（简单对象访问协议）等标准，协助将车间与供应链优化进行集成。\n\
  - `SAP MII` 有助于实现制造的实时监控，从而使供应链规划更加顺畅，并做出更佳的决策。\n- `SAP MII` 可以重用现有的遗留系统，为企业内的最终用户解锁数据。它为用户提供了一个友好的环境，使其能够在单个浏览器界面中建立来自多个系统的不同数据形式之间的联系。\n\
  - `SAP MII` 软件无需在客户端进行管理，并且在 `SAP MII` 实施过程中，也无需维护复杂的数据仓库或数据模型。\n- `SAP MII` 允许为计算机集成制造、`IIoT`、机器对机器通信能力以及实时智能设计智能解决方案。\n\
  - `SAP MII` 能够通过传递实时通知和对车间任何活动的确认等信息，提高员工生产力。这有助于员工对所接收到的信息立即采取行动。\n- `SAP MII`\
  \ 还能从**大数据**制造分析中提供企业级的洞察。\n- 使用 `SAP MII`，可以定义制造指标和 `KPI`，并在全球各站点部署相同的标准化计算。\n\n\
  \n\n### SAP MII 架构\n\n在 `SAP MII` 中，**集成**与**智能**是设计自动化制造解决方案时需要考虑的关键因素。因此，若从更细致的层面审视\
  \ `SAP MII` 的构建，它可分为几个层级。从集成方面来看，`SAP MII` 可以使用 `SAP PCo` 或 `OPC` 连接器连接到任何车间系统；从管理方面来看，`SAP\
  \ MII` 可以通过 Java 连接器连接到 `ERP`。从智能方面来看，可以利用 `SAP MII` 丰富的可视化服务开发各类仪表盘、报告、分析及其他指标，以获取实时可见性。请参见图\
  \ 1-3。\n\n![A421506_1_En_1_Fig3_HTML.jpg](img/A421506_1_En_1_Fig3_HTML.jpg)\n\n\
  图 1-3. SAP MII 架构视图\n\n以下要点解释了这些 `SAP MII` 架构概念：\n\n- `SAP MII` 是一个开放平台，可集成用于制造运营的不同系统，无论其用途如何。\n\
  - `SAP MII` 使用先进的 Web 服务器技术，从多个数据源提取数据，并在服务器端进行聚合。它将数据源转换为业务上下文，进行个性化处理后，将结果交付给最终用户。\n\
  - `SAP MII` 使用 `SAP Java 连接器` 和 Web 服务等标准协议，无缝连接到 `ERP` 系统。\n- `SAP MII` 提供特定于各种标准制造车间系统的多种数据连接器。\n\
  - `SAP MII` 支持与 `ERP` 和车间系统之间以同步和异步模式进行双向数据访问。\n- `SAP MII` 独立于浏览器，具有可扩展性和可伸缩性。\n\
  - 数据功能可通过 `HTTP`、`SMTP` 和 `FTP` 等标准传输方式访问。\n\n开始安装 `SAP MII` 时，可能会产生一个重要问题：如何部署该解决方案？根据客户的需求和预算，`SAP\
  \ MII` 可以通过三种方式安装：本地安装、区域安装或全局安装。\n\n- **本地安装**：`SAP MII` 安装在制造工厂现场。每个工厂站点对应一个 `SAP\
  \ MII` 系统。所有这些系统都连接到全局 `ERP`。请参见图 1-4。\n\n    ![A421506_1_En_1_Fig4_HTML.jpg](img/A421506_1_En_1_Fig4_HTML.jpg)\n\
  \n    图 1-4. SAP MII 本地服务器拓扑\n\n- **区域安装**：每个区域有一个 `SAP MII` 服务器，一个区域可包含多个制造工厂。区域\
  \ `SAP MII` 可以连接到全局 `ERP`。这是最常用的架构。请参见图 1-5。\n\n    ![A421506_1_En_1_Fig5_HTML.jpg](img/A421506_1_En_1_Fig5_HTML.jpg)\n\
  \n    图 1-5. SAP MII 区域服务器拓扑\n\n- **全局安装**：全局仅部署一个 `SAP MII`，位于总部或数据中心。它由所有制造工厂共享。请参见图\
  \ 1-6。\n\n    ![A421506_1_En_1_Fig6_HTML.jpg](img/A421506_1_En_1_Fig6_HTML.jpg)\n\
  \n    图 1-6. SAP MII 全局服务器拓扑\n\n## SAP MII 系统概览\n\n为了说明 `SAP MII` 平台概览及其相关配置，以下各节将详细介绍各个开发领域。\n\
  \n### SAP MII 安装\n\n`SAP MII` 通常安装在应用服务器上的 `SAP NetWeaver` 平台，但最新版本（从 `SAP MII 15.0`\
  \ 开始）可以安装在 `SAP HANA` 平台上。`SAP MII` 安装的先决条件包括 `NetWeaver` 版本和相应的 `Java J2EE` 引擎版本。从\
  \ `SAP MII` 版本 `12.0` 开始，所有版本都具有固定的 `NetWeaver` 版本。此处我们以最新版本 `SAP MII 15.1` 为例说明其设置。\n\
  \n`SAP MII 15.1` 可以安装在 `SAP NetWeaver 7.4` 或 `SAP NetWeaver 7.5 Java 应用服务器` 上。\n\
  \n要运行 `SAP MII 15.1`，客户端机器需要 `JRE 1.6` 或更高版本。`SAP MII` 不完全支持 `JRE 1.7.8` 及以上版本，有时会导致崩溃。\n\
  \n要安装 `SAP MII 15.1`，请登录 `SAP Service Marketplace`（[`http://service.sap.com`](http://service.sap.com)）。在软件下载支持包中选择\
  \ `SAP MII` 选项，然后选择 `15.1` 版本。接着下载对应版本的 `SAP MII sca` 组件文件和 `SAP MII admin sca`\
  \ 组件文件。按照 `SAP` 安装指南完成安装（[`https://help.sap.com/viewer/p/SAP_MANUFACTURING_INTEGRATION_AND_INTELLIGENCE`](https://help.sap.com/viewer/p/SAP_MANUFACTURING_INTEGRATION_AND_INTELLIGENCE)）。\n\
  \n关于服务器硬件规模，`SAP` 在 `SAP Marketplace` 中提供了一个名为 `Quick Sizer` 的即时工具（`service.sap.com/sizing`）。\n\
  \n### SAP MII 的系统配置\n\n`SAP MII` 根据需求有不同的基本配置。下面将进一步说明。\n\n#### 安全性\n\n与其他任何工具一样，安全性是\
  \ `SAP MII` 的一个主要且重要的组成部分。由于 `SAP MII` 是一个平台，并且可以开发客户特定的解决方案，因此 `SAP MII` 必须在解决方案内部提供安全保障。\n\
  \n### 用户管理\n\n`SAP MII` 拥有多种安全流程。其中最重要的部分之一是用户管理或用户管理。\n\n用户管理由 `SAP NetWeaver J2EE\
  \ Web.AS 用户管理引擎 (UME)` 处理。以下是 `SAP MII` 系统访问的基本角色。\n\n- `xMII 只读`：授予对 `SAP MII`\
  \ 系统和工作台具有只读访问权限的用户角色。\n- `xMII 用户`：授予对 `SAP MII` 系统及使用 `SAP MII` 开发的解决方案具有基本访问权限的用户角色。拥有此权限的用户不能执行任何类型的配置。\n\
  - `xMII 开发者`：授予使用 `SAP MII 工作台` 开发复合应用程序的开发人员角色。开发者可以执行开发所需的某些配置，例如调度作业配置。\n- `xMII\
  \ 管理员`：授予系统管理员角色。此角色拥有所有 `SAP MII` 系统和 `NetWeaver` 的配置能力。\n- `xMII 超级管理员`：授予对 `SAP\
  \ MII` 及其在 `NetWeaver` 和用户管理中的相关配置具有完全访问权限的角色。\n\n\n\n#### UME 的架构\n\n如图 1-7 所示，UME\
  \ 架构中包含三个主要层级。最底层包括带有各自持久化适配器的数据源。用户数据存储在多个数据源中，因此最底层仅专用于用户数据存储。第二层是持久化管理器。它帮助持久化适配器创建、读取、写入和搜索与用户管理相关的数据。最顶层被称为应用程序编程接口\
  \ (API)。所有与从数据源写入或读取数据相关的配置都通过持久化管理器完成，以确保信息安全，并确保不会泄露给使用 API 的应用程序。这些应用程序可以确定用户管理数据具体存储位置的详细信息。\n\
  \n![A421506_1_En_1_Fig7_HTML.jpg](img/A421506_1_En_1_Fig7_HTML.jpg)\n\n图 1-7. UME\
  \ 的架构\n\n在 SAP MII 中，可以创建项目特定的多层角色。通过使用此功能，可以限制所有用户对解决方案的访问，以便管理员用户能够按权限执行某些配置。除此之外，还可以在\
  \ UME 中创建项目或应用程序特定的角色，以分配在工作台上开发对象的安全权限。\n\n除了创建角色之外，还有必要在 NetWeaver 中创建用户，以便访问\
  \ SAP MII。如果客户已为其他应用程序在 NetWeaver 中维护用户，则这些相同的用户可以在 SAP MII 中重用，因为 SAP MII 也是基于\
  \ NetWeaver 的。\n\n有两种访问用户管理或用户管理的方法：\n\n1.  在浏览器中键入以下 URL：`https://<server>:<port>/useradmin`\n\
  2.  从 MII 菜单中，转到“安全服务” ➤ “用户管理”。参见图 1-8。\n\n    ![A421506_1_En_1_Fig8_HTML.jpg](img/A421506_1_En_1_Fig8_HTML.jpg)\n\
  \n    图 1-8. 用户管理的菜单选项\n\n在“用户管理”中，可以创建新用户、复制或修改现有用户配置文件以及删除现有用户。\n\n从“用户管理”屏幕，也可以对角色和组创建执行与用户创建相同的操作。参见图\
  \ 1-9。\n\n![A421506_1_En_1_Fig9_HTML.jpg](img/A421506_1_En_1_Fig9_HTML.jpg)\n\n\
  图 1-9. NetWeaver 中的用户管理\n\n以下是 SAP MII 用于识别授权操作的标准后缀：\n\n*   `_R`：允许读取访问\n*   `_RW`：允许读取和写入访问\n\
  *   `_RWD`：允许读取、写入和删除访问\n*   `_deploy`：强制立即部署\n*   `_transport`：允许传输访问\n*   `_all`：允许读取、写入、删除和传输访问\n\
  \n## 数据访问\n\nSAP MII 数据访问用于将 SAP MII 角色分配给 SAP MII 数据服务器。需要分配 `Admin` 和 `Data Access\
  \ Security Editor` 这两个系统安全服务，才能在数据访问上执行特定功能。\n\n要配置数据访问，请从 `Available Servers` 列表中选择一个服务器，然后单击\
  \ `Edit`。从 `Available Roles` 列表中，选择一个角色，并使用 `Add All`、`Add`、`Remove` 和 `Remove All`\
  \ 按钮将其添加到分配给服务器列表的角色中，或从中移除。要选择多个角色，请按住 `Ctrl` 键，然后单击相应的角色。然后单击 `Save`。参见图 1-10。\n\
  \n![A421506_1_En_1_Fig10_HTML.jpg](img/A421506_1_En_1_Fig10_HTML.jpg)\n\n图 1-10.\
  \ 数据访问屏幕\n\n## 加密配置\n\n加密配置使用加密算法对保存在 SAP Manufacturing Integration and Intelligence\
  \ 中的数据服务器、调度和凭据进行编码。参见图 1-11。\n\n![A421506_1_En_1_Fig11_HTML.jpg](img/A421506_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11. SAP MII 加密配置屏幕\n\n可用的加密算法由 SAP NetWeaver 实例决定，可能包括以下内容：\n\n*   TripleDES，提供最强的数据加密。这是默认设置。它基于数据加密标准\
  \ (DES)，数据会被加密三次。\n*   DES 提供第二强的数据加密。\n*   Base64 提供最弱的数据加密。当没有其他加密方法可用时，系统使用 Base64\
  \ 编码。\n\n## 凭据存储\n\n您可以使用 `Credential Stores` 屏幕为用户名和密码添加别名，该别名可以被修改或删除（参见图 1-12）。这些别名在\
  \ SAP Manufacturing Integration and Intelligence 工作台操作中使用，而不是在操作配置中输入用户名和密码。所有需要用户名和密码进行配置的对象都提供带有密码加密的凭据存储。然后，可以使用别名的凭据来配置：\n\
  \n![A421506_1_En_1_Fig12_HTML.jpg](img/A421506_1_En_1_Fig12_HTML.jpg)\n\n图 1-12.\
  \ SAP MII 凭据别名配置\n\n*   SAP 服务器\n*   BLS 操作\n\n## Illuminator 服务\n\nIlluminator\
  \ 服务是 SAP MII 中数据服务的支柱。SAP MII illuminator 服务基本上是一组提供 SAP MII 某些核心功能的 HTTP 服务。您可以通过\
  \ XML 消息交换从外部调用这些服务。\n\n每个 illuminator 服务都有一个服务名称和一个或多个模式，即服务操作。在执行时，您必须同时指定服务名称、模式以及输入参数（如果有的话）。这些服务可以独立调用，也可以通过使用\
  \ AJAX 或 BLS 从网页调用。以下是这些服务的三个主要用途：\n\n*   作为从 MII 内部表获取数据的唯一方式\n*   从性能角度看，在代码中使用此功能的最佳方式之一\n\
  *   易于直接从 IRPT 或 JS 使用\n\n以下是 illuminator 服务的语法：\n\n`http://<server>:<port>/XMII/Illuminator?service=<service\
  \ name>&mode=<mode name>&content-type=text/xml`\n\n以下是 MII 12.0 及更高版本中可用的服务列表：\n\
  \n*   Admin：用于检索 SAP MII 服务器的管理和安全信息。\n*   Scheduler：用于根据程序逻辑，无需任何用户干预即可自动从 MII\
  \ BLS 或网页控制计划作业。\n*   SystemInfo：用于获取 SAP MII 的系统相关信息。\n\n以下是 MII 12.1 及更高版本中提供的更多服务：\n\
  \n*   Indexing：包含检查索引内容和监控索引器的方法。索引器会重建索引信息。它将遍历数据库中的所有文件并重新为其建立索引。仅当索引因某种原因不同步时才应使用此功能。\n\
  *   Monitoring：用于检索登录、文件使用、服务器使用等信息。您可以从此处确定系统负载、运行中的事务、查询等。\n*   BLSManager：用于检索\
  \ BLS 的信息，如 BLS 的运行时间、最长运行时间、日志、输出、统计信息等。您可以执行终止事务、删除事务、清除事务缓存等活动。\n*   Transport：用于将配置或项目从一个系统传输到另一个系统。\n\
  *   DataServer：用于执行数据服务器的基本功能，例如启用、禁用、删除、导出和导入。\n\n在最新版本的 SAP MII 中，包含了几项新服务：\n\n\
  *   Alert：提供列表、查看、删除等基本功能。\n*   oData：SAP MII 中新增，现在支持与 SAP HANA 的集成。SAP MII 可以托管在\
  \ SAP HANA 上。\n\n请参考作者撰写的 SCN 博客：[`https://blogs.sap.com/2013/01/02/illuminator-services-of-sap-mii/`](https://blogs.sap.com/2013/01/02/illuminator-services-of-sap-mii/)\n\
  \n\n\n"
- "# SAP MII 管理配置\n\n若要开发 SAP MII 解决方案，具有管理员角色的开发者需要进行某些配置才能继续。SAP MII 管理菜单页面中有多个需要配置的部分。本章节将说明最重要的部分。这些配置是强制性的，并且在开始\
  \ SAP MII 项目之前必须掌握相应的知识。\n\n要访问 SAP MII 菜单页面，请通过浏览器访问以下 URL：\n\n`https://<主机>:<端口>/XMII/Menu.jsp`\n\
  \n## 系统管理菜单选项\n\nSAP MII 菜单包含系统管理选项。此菜单允许您配置系统级设置。这些系统管理活动需要管理员和其它管理安全服务权限。这些权限必须分配给用户角色，才能访问和管理系统管理菜单中可用的管理任务。此菜单包含如图\
  \ 1-13 所示的配置项。\n\n![A421506_1_En_1_Fig13_HTML.jpg](img/A421506_1_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13. SAP MII 系统配置菜单选项\n\n### 系统属性屏幕\n\n系统属性屏幕用于配置 SAP MII 的通用管理配置，如图 1-14 所示。\n\
  \n![A421506_1_En_1_Fig14_HTML.jpg](img/A421506_1_En_1_Fig14_HTML.jpg)\n\n图 1-14.\
  \ SAP MII 系统属性配置屏幕\n\n### 系统作业屏幕\n\n系统作业是按固定时间间隔在后台运行的任务，用于执行 SAP MII 服务器和内容的内部维护。请参见图\
  \ 1-15。\n\n![A421506_1_En_1_Fig15_HTML.jpg](img/A421506_1_En_1_Fig15_HTML.jpg)\n\
  \n图 1-15. SAP MII 内部系统作业详情\n\nSAP MII 服务器上运行的默认系统作业（如图 1-16 高亮所示）如下：\n\n![A421506_1_En_1_Fig16_HTML.jpg](img/A421506_1_En_1_Fig16_HTML.jpg)\n\
  \n图 1-16. SAP MII 中的重要系统作业\n\n*   **会话记录器**：每 30 分钟运行一次，根据活跃的唯一用户数记录系统使用情况。\n* \
  \  **安全对象引用清理器**：每 7 天运行一次，删除相应数据库表中的无效系统和性能角色、自定义属性角色以及用户。\n*   **临时文件清理器**：每小时运行一次，清理临时文件表。\n\
  \n### 事务管理器屏幕\n\n事务管理器屏幕监控系统中正在执行的 BLS 事务（见图 1-17）。\n\n![A421506_1_En_1_Fig17_HTML.jpg](img/A421506_1_En_1_Fig17_HTML.jpg)\n\
  \n图 1-17. SAP MII 事务管理器屏幕\n\n### 日志查看器屏幕\n\n日志查看器屏幕（见图 1-18）显示 SAP NetWeaver 日志查看器。系统日志可以通过\
  \ SAP NetWeaver 管理员控制台 (NWA) 查看。可通过 `NWA_READONLY` 角色，利用 `https://<主机>:<端口>/nwa`\
  \ 链接进行查看。此外，`NWA_SUPERADMIN` 允许用户对 NetWeaver 界面和 MII 所需的配置拥有完全查看权限和控制权，以及访问受管系统中数据的权限。只读角色（`NWA_READONLY`）不允许用户对受管系统进行更改。另一个角色（`NWA_SUPERADMIN`）则允许完全控制。您可以查看过去\
  \ 24 小时的日志。跟踪级别默认为错误，可通过导航至 SAP NetWeaver 管理员控制台 ➤ 系统管理 ➤ 配置 ➤ 日志配置进行修改。\n\n![A421506_1_En_1_Fig18_HTML.jpg](img/A421506_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18. SAP MII 日志查看器\n\n跟踪级别可设置为以下任一选项：\n\n*   **全部**：记录所有消息：调试、路径、信息、警告、错误和严重。\n\
  *   **调试**：用于调试目的，包含详尽的底层信息。\n*   **路径**：用于跟踪 MII BLS 的执行流程，例如，可用于跟踪进入和离开方法、循环和分支操作时的路径。\n\
  *   **信息**：用于显示已执行的提示性文本。\n*   **警告**：即使出现问题或存在需要开发者/操作员关注的异常，应用程序也能完成任务。\n*   **错误**：应用程序可以从错误中恢复，但由于错误而无法完成所需任务，需要修正。\n\
  *   **严重**：应用程序无法从错误中恢复，这种严重情况会导致应用程序致命终止。\n*   **无**：不记录任何消息。\n\n\n\n### 调度程序菜单\n\
  \n`Scheduler`菜单提供了用户调度的所有作业的相关信息。任何业务逻辑（BLS）事务、查询和 MDO 都可以通过`Scheduler`定期执行。还可以查看正在运行、等待或停止的作业的状态。\n\
  \n需要为用户分配`Scheduler Security`服务，才能启用对`Scheduler`屏幕的访问，如图 1-19 所示。\n\n![A421506_1_En_1_Fig19_HTML.jpg](img/A421506_1_En_1_Fig19_HTML.jpg)\n\
  \n图 1-19. SAP MII 调度程序配置\n\n调度程序有三个选项卡：\n\n- `Transaction Scheduler`（事务调度程序）\n-\
  \ `History`（历史记录）\n- `Execution Schedule`（执行计划）\n\n#### 事务调度程序（Transaction Scheduler）\n\
  \n此选项卡上的元素说明如下：\n\n- **Name（名称）**：已调度作业的名称。\n- **Description（描述）**：作业的详细信息及其预期功能。\n\
  - **Enabled（已启用）**：一个复选框选项，勾选后，作业将根据 cron 模式定期运行。如果未勾选此复选框，则作业不会被调度。\n- **Transaction,\
  \ Query, or MDO (Manufacturing Data Object)（事务、查询或 MDO）**：指示将被调度运行的 BLS 事务、数据查询或\
  \ MDO 查询。\n- **Run As Username（运行身份用户名）**：指示用于运行作业的用户凭证。\n- **Run As Password（运行身份密码）**：表示上述用户的密码。\n\
  - **Parameters（参数）**：指示所选事务的输入参数（如果有）。用户在将事务作为计划作业运行时，理想情况下应输入要使用的输入参数的值。\n- **Pattern（模式）**：指示一个\
  \ cron 模式，该模式决定了要运行作业的计划。可以手动创建 cron 模式，或通过使用`Build Pattern`屏幕创建。点击`Build Pattern`按钮可调用`Build\
  \ Pattern`屏幕，它能帮助轻松创建 cron 模式。\n\n`Scheduler Service`每 500 毫秒检查一次是否有准备就绪的作业，然后执行这些作业。使用`Scheduler`可以定期执行任何业务逻辑事务、查询或\
  \ MDO，以执行各种活动，例如通过数据查询从制造车间系统提取数据、执行 Web 服务或 RFC、计算并更新 KPI。\n\n`Scheduler`屏幕还会显示有关计划作业的以下信息。\n\
  \n- **Status（状态）**：表示作业的状态。取值可以是`Stopped`、`Pending`和`Running`。\n  - `Stopped`：表示作业当前已停止。未启用的任务具有此状态。\n\
  \  - `Pending`：表示作业已调度，正在等待下一次运行。\n  - `Running`：表示计划作业当前正在运行。\n- **Name（名称）**：表示在`Scheduler`中设置的作业名称。\n\
  - **Next Run Time（下次运行时间）**：指示此计划作业下一次运行的时间。\n- **File（文件）**：表示已调度运行的业务逻辑事务、查询或\
  \ MDO 的完整路径。\n- **Description（描述）**：说明在`Scheduler`中设置的作业。\n\n#### 历史记录（History）\n\
  \n`Scheduler`还允许管理员或任何具有足够授权权限的用户查看`Job Execution History`屏幕，如图 1-20 所示。\n\n![A421506_1_En_1_Fig20_HTML.jpg](img/A421506_1_En_1_Fig20_HTML.jpg)\n\
  \n图 1-20. 调度程序执行历史记录屏幕\n\n此屏幕显示计划作业先前执行尝试的详细信息，包括状态、持续时间和详细信息。\n\n#### 执行计划（Execution\
  \ Schedule）\n\n最后，`Execution Schedule`功能会显示该作业接下来 20 次计划运行的时间表，如图 1-21 所示。\n\n![A421506_1_En_1_Fig21_HTML.jpg](img/A421506_1_En_1_Fig21_HTML.jpg)\n\
  \n图 1-21. 调度程序执行计划\n\n### 活动会话屏幕（Active Sessions Screen）\n\n如果用户被分配了管理角色，则可以通过`Active\
  \ Sessions`屏幕查看已登录到 SAP MII 服务器的用户列表。除了用户登录名之外，此屏幕还提供用户的全名、电子邮件地址、首次登录的日期和时间、系统上次访问的日期和时间以及会话何时过期。参见图\
  \ 1-22。\n\n![A421506_1_En_1_Fig22_HTML.jpg](img/A421506_1_En_1_Fig22_HTML.jpg)\n\
  \n图 1-22. SAP MII 活动会话屏幕\n\n### 自定义属性屏幕（Custom Attributes Screen）\n\n`Custom Attributes`屏幕用于管理自定义属性，以存储应用程序使用的配置或业务数据。参见图\
  \ 1-23。\n\n![A421506_1_En_1_Fig23_HTML.jpg](img/A421506_1_En_1_Fig23_HTML.jpg)\n\
  \n图 1-23. SAP MII 自定义属性配置\n\n### 自定义属性映射屏幕（Custom Attribute Mapping Screen）\n\n\
  `Custom Attribute Mapping`屏幕用于将自定义属性分配给现有用户或用户角色，以用作会话变量。参见图 1-24。\n\n![A421506_1_En_1_Fig24_HTML.jpg](img/A421506_1_En_1_Fig24_HTML.jpg)\n\
  \n图 1-24. SAP MII 自定义属性映射配置\n\n\n\n### 配置界面\n\n配置界面用于以 ZIP 压缩包的形式将配置备份导入系统或从系统导出。图\
  \ 1-25 中显示的配置均可导出和导入。\n\n![A421506_1_En_1_Fig25_HTML.jpg](img/A421506_1_En_1_Fig25_HTML.jpg)\n\
  \n图 1-25. SAP MII 配置及其导出和导入功能\n\n配置界面提供将系统配置备份为 ZIP 文件（`xmiibackup.zip`）并保存到本地系统上用户指定位置的功能，以及从类似的备份存档中恢复系统配置的功能。这在将配置从一个\
  \ SAP MII 安装环境传输到另一个环境时（例如，从开发环境传输到生产环境）非常有用。\n\n您需要将配置管理安全服务分配给用户，才能访问配置界面。根据界面上勾选的选项，相应的配置会被导出到一个\
  \ XML 文件中。当点击“导出”按钮时，对应的文件会被包含在 `xmiibackup.zip` 存档中。在导入的情况下，您需要从本地文件系统中浏览包含先前导出的配置备份存档文件，然后点击“导入”将配置存档文件导入到\
  \ SAP MII 中。\n\n以下说明的配置类型可在 SAP MII 中导出或导入：\n\n- **系统属性**：系统属性备份在 `SystemProperties.xml`\
  \ 文件中。\n- **模拟器实例**：每个实例都作为单独的 XML 文件备份，命名为 `<SimulatorServerName>.xml`，存放在存档中名为\
  \ `Simulator_files` 的文件夹内。默认的模拟器实例会备份为 `DefaultSimulator.xml`。\n- **计划任务**：每个计划任务都作为单独的\
  \ XML 文件备份，命名为 `<ScheduleName>.xml`，存放在存档中名为 `Scheduler_Jobs` 的文件夹内。\n- **消息监听器**：在消息服务中创建的消息监听器配置备份在\
  \ `MessageServers.xml` 文件中。\n- **消息监听器规则**：在消息服务中创建的消息监听器处理规则备份在 `MessageProcessRules.xml`\
  \ 文件中。\n- **数据服务器权限**：在安全服务中配置的数据服务器安全权限备份在 `ServerPermissions.xml` 文件中。\n- **消息监听器清理规则**：在消息服务中创建的清理规则备份在\
  \ `MessageCleanupRules.xml` 文件中。\n- **数据服务器**：在数据服务中配置的数据服务器备份在 `Servers.xml` 文件中。\n\
  - **本地化**：本地化设置会作为单独的 XML 文件备份，命名为 `<Language>.xml`，存放在存档中名为 `Localization` 的文件夹中。\n\
  - **链接对象**：在可视化服务中配置的导航链接对象备份在 `ContentMap.xml` 文件中。\n- **时间段**：在数据服务中配置的时间段备份在\
  \ `TimePeriods.xml` 文件中。\n- **导航**：每个关联了导航配置文件的角色或用户，都会作为相应的 XML 文件存储，命名为 `<Role>.xml`\
  \ 或 `<User>.xml`，存放在公共 `Profiles` 文件夹下对应的 `ROLE` 或 `USER` 文件夹中。\n- **时间段计划**：在数据服务中配置的时间段计划备份在\
  \ `Schedules.xml` 文件中。\n- **全局设置**：在 SAP MII 安装中定义的全局属性备份在 `Globals.xml` 文件中。\n\
  - **单位转换**：单位转换配置备份在 `UnitConversions.xml` 文件中。\n- **自定义属性**：在系统管理中配置的自定义属性备份在 `CustomAttributes.xml`\
  \ 文件中。\n\n### 项目菜单\n\nSAP MII 中的项目菜单允许 SAP MII 管理员（以及任何拥有项目管理安全服务的用户）备份和恢复 SAP MII\
  \ 项目。这在将开发内容从一个 SAP MII 安装环境传输到另一个环境时（例如，从开发环境传输到生产环境）非常有用。参见图 1-26。\n\n![A421506_1_En_1_Fig26_HTML.jpg](img/A421506_1_En_1_Fig26_HTML.jpg)\n\
  \n图 1-26. SAP MII 项目配置及其导出和导入功能\n\n项目界面列出了各种项目及其详细信息，例如名称、描述、是否为系统项目、创建时间和创建者，以及将其删除或导出为压缩\
  \ ZIP 文件的选项。\n\n从 SAP MII 导出的项目包含与 SAP MII Workbench 中定义的相同文件夹结构内的项目文件，以及一个 `ExportManifest.xml`\
  \ 文件，该文件包含有关导出项目的必要元数据。将项目导入 SAP MII 时，不必包含 `ExportManifest.xml` 文件。也可以从外部创建项目结构并将其导入\
  \ SAP MII。但是请注意，如果将具有相同项目名称的项目导入 SAP MII，则现有项目将被覆盖，无论它是否是系统项目或隐藏项目。\n\nSAP MII 中的系统项目由\
  \ SAP 提供，供 SAP MII 系统内部使用。这些项目无法删除，例如 `Default` 和 `QualityPortal`。\n\n### 本地化\n\n\
  本地化功能为 SAP MII 平台提供不同的语言支持（参见图 1-27）。\n\n![A421506_1_En_1_Fig27_HTML.jpg](img/A421506_1_En_1_Fig27_HTML.jpg)\n\
  \n图 1-27. SAP MII 本地化配置\n\n本地化可以通过两种方法设置（参见图 1-28）：\n\n![A421506_1_En_1_Fig28_HTML.jpg](img/A421506_1_En_1_Fig28_HTML.jpg)\n\
  \n图 1-28. SAP MII 网页本地化\n\n- **网页本地化**：任何 HTML 页面都可以根据区域语言进行本地化。HTML 页面需要保存为 `.irpt`\
  \ 文件。此文件扩展名标识这些文件是需要系统在运行时将其作为 HTML 返回给浏览器之前进行处理的网页。在此过程中，系统会根据用户的语言将本地化键替换为其翻译。为此，开发人员需要在\
  \ `#` 标签内为特定语言定义本地化键及其值，例如 `{##KeyName}`。在运行时，该值决定显示的语言。\n- **项目本地化**：此功能可用于完全本地化项目。本地化字符串用于事务处理和\
  \ `.irpt` 页面。项目本地化的优先顺序是：用户语言，然后是系统语言，最后是英语 (EN)。如果未找到本地化值，则默认返回键。此外，通过 SAP MII\
  \ Workbench 的 `meta-inf` 选项卡，您可以在 `Bundles` 文件夹下为客户特定的本地语言创建新的 `.properties` 文件。使用此文件，您可以为指定的语言添加\
  \ `名称=值` 对。\n\n"
- '# 总结


  本章引导您了解了制造的概念。进一步解释了制造过程中涉及的不同流程，以及如何在制造过程中弥合车间与管理层之间的差距。您还了解了 SAP MII 的演变历史、SAP
  MII 是什么，以及它通过其产品架构、安装概念和系统配置功能可以做什么。在下一章中，您将了解制造业面临的关键挑战，以及为何应从功能、技术和业务角度使用 SAP
  MII。


  '
- '# 2. 为何在制造业中使用 SAP MII


  本章解释了为何应在制造业中使用 SAP MII。它说明了制造业面临的挑战，以及 SAP MII 在克服这些挑战中所扮演的角色。




  ## 为何使用 SAP MII？


  上一章解释了 SAP MII 是什么。当今制造业面临的最大问题之一便是：为何要使用 SAP MII？使用 SAP MII 的益处需要从多个角度考量，例如其功能特性、技术优势以及商业效益，这样才能证明其使用价值。SAP
  MII 是一个强大的集成平台，这意味着它可以作为不同第三方或遗留系统之间的中间件。不仅如此，SAP MII 还具备智能分析能力，因为它可用于开发各种智能实时分析和监控报告，并利用
  3D 图形实现高端可视化。近期，SAP MII 还引入了另一个“I”要素，即“创新”（*innovation*）。SAP MII 的这一隐性特性通过连接 IIoT（工业物联网）智能移动设备，助您实现创新。


  **注意**


  术语 `innovation`（创新）指的是为现有方法引入新思路，或用更优的解决方案改进现有方法。新方案可能对用户更友好，或采用新设备、新技术以获得更好的结果。例如，智能手机是对传统手机的一次创新，其灵感源于市场对更灵活沟通方式的需求。


  `IIoT` 指的是物联网技术。构成 `IIoT` 的不同技术包括：大数据技术、机器学习机制、方法控制以及传感器数据监控。一台机器如何与另一台机器通信，也称为
  `M2M`（机器对机器）通信。使用 `IIoT` 的另一个因素是它能与移动设备集成，这样用户即使不在现场，也能连接到接近实时的数据。


  ## 制造业的关键挑战与解决方案


  制造业面临着诸多挑战，包括生产成本上升、产品质量下降、合格劳动力难寻、市场竞争激烈等等。所有这些挑战都是相互关联的。例如，低效的人力往往会增加制造成本，并对产品质量产生不利影响。从长远来看，该企业将落后于人。为了更轻松、快速、高效地克服这些问题，公司需要一个强大的解决方案。以下章节将详细阐述制造业面临的挑战及其应对方案。


  ### 竞争激烈的市场与更低的制造成本


  制造业是一个复杂但却是任何国家经济命脉的行业。如今，制造业面临着激烈的竞争。一家制造企业的竞争力可以根据质量、创新、效率、客户满意度、员工满意度等多个相互依赖的因素来评估。此外，这些职能部门之间沟通的速度也影响着企业的竞争力。决定制造业竞争力的因素有很多。要更有效地应对这一挑战，您必须识别出能以最低成本和高品质进行管理的核心竞争力。如今，创新也被视为一个能带来更优性能的因素，从而有助于降低制造成本。


  SAP MII 以最低成本为制造企业提供了所有这些功能。在服务器层面，它具有以下特点：


  -   内部数据库及低维护成本

  -   能够使用连接器与 ERP 系统集成，从车间获取近乎实时的数据

  -   多个流程无需人工成本

  -   流程自动化，以避免人为错误


  **注意**


  `ERP` 代表企业资源计划。这是企业的规划和管理套件，有助于管理生产和产品的规划活动。这包括制造成本、交付、提货单、物料管理、运输管理、支付管理、库存管理、销售管理等。它通过利用强大的
  `RDBMS`（关系型数据库管理系统）实时控制各个业务流程，帮助您从仓库到生产管理、从计划到生产管理获得业务的集成视图。


  `shopfloor`（车间）是工厂或工作坊中操作人员工作的区域；该术语用于将工厂的生产部分与行政部分区分开来。


  ### 对精益供应链策略的偏好


  如今，制造业更偏好精益供应链策略。这种方法以最少浪费的方式，将产品快速交付给最终客户。精益供应链有助于在快速预测客户需求的同时，以极高的效率轻松交付产品，从而为客户提供更好的解决方案。这最终有助于实现卓越的财务业绩。由于
  SAP MII 是一个灵活的平台，因此可以根据需要开发客户特定的解决方案。此外，SAP MII 可以连接到车间系统和 ERP 解决方案，并能实现流程自动化，因此可以在
  SAP MII 中设计出缩短生产周期的解决方案。SAP MII 还可以与质量模块集成，并实时监控生产。它可以更有效地检查生产浪费，从而缩短决策时间。


  **注意**


  `supply chain`（供应链）是企业资源规划的组成部分之一，它清晰地显示了库存从供应商到最终客户的流动情况。它提供了从原材料到最终产品，再到最终交付给客户的透明视图和更好的控制。


  `Lean supply chain`（精益供应链）鼓励仅生产所需的数量，并考虑何时何地需要产品。这有助于减少不必要的生产，因为不必要的生产会导致浪费并推高成本。根据最终消费者的需求，可以用更少的资源生产更多产品，或者用更多的资源精确生产所需数量。只有针对每个产品进行单独处理，消除流程中不必要且被视为浪费的环节，这才能成功。因此，精益方法不仅关注消除流程中的浪费，还考虑价值流的提升。


  ### 分散的制造工厂系统


  制造工厂涉及多个自动化系统、机器、工厂、总部，以及不同制造相关部门的安全系统。在一个更大的制造系统中，生产工厂分散在多个地点、区域或地理位置是很常见的。这些不同的单元相互隔离，彼此之间的沟通不畅。通常，ERP
  是在总部或区域办公室集中实施的，而不是在每个工厂。由于 ERP 系统与这些单元没有直接连接，从不同站点和单元获取信息可能非常耗时。而且，由于这些信息是手动处理的，发生人为错误的可能性很高。如果在本地、区域或全球范围内将
  ERP 与 MII 连接起来，管理层将始终能够获取近乎实时的数据。由于流程通过 SAP MII 实现了自动化，数据将始终保持准确。与此同时，MII 保证数据可靠交付，因此，如果任何工厂或单元断开连接，MII
  在重新连接时可以立即将排队的全部数据推送到 ERP，而不会丢失任何数据。




  ### 生产问题的业务与财务影响


  在制造工厂中，生产问题或偏差的业务与财务影响非常难以手动监控或控制。例如，假设出现这样一种场景：需要生产 100 个零件作为最终产品，但由于生产线故障，20 个报废，最终仅生产了
  80 个，这仍被视为良好生产。但若 80 个报废，仅 20 个合格，则说明生产线或机器需要更换或纠正，因为报废数量超过了合格产品数量。`SAP MII` 可以连接到
  `ERP`，从 `MII` 和 `ERP` 两端监控并触发工厂维护通知。这些通知能够及时告知维护主管此类业务损失，以便他们迅速更换或修复机器或生产线。


  通过让高产线、低浪费的机器持续产出合格产品，也可以遏制财务损失。`MII` 还可以连接到 `ERP` 的质量模块，这样无论最终生产出的合格产品数量是多少，`MII`
  都能与之衔接。`SAP MII` 还具备工厂维护计划监控功能。管理层和监管团队可以利用这一功能，借助在 `MII` 中开发的记分卡报告，了解生产线为何以及何时经历了计划停机、非计划停机、计划停止、故障等状态。这些问题可能由人工失误、物料短缺、偏离生产计划、设备过度使用、物流不当以及不可避免的事故导致。


  ### 生产缺乏控制与监控机制


  很多时候，制造业企业因为无法控制和监控正在运行的生产线而面临问题。假设出现这样一种情况：他们需要跟踪生产过程中大型烤箱使用的温度控制器，当其超过特定阈值时，手动记录这一事件的确切时间。如果依赖人工干预，这些信息就可能出错。


  另一种可能发生的情况是，锅炉或储罐阀门需要关闭，因为它已超出容量限制。但同样，由于缺乏恰当的机制，锅炉或储罐会溢出甚至爆裂。此类工厂事故甚至可能导致人员伤亡。`SAP
  MII` 提供了一个万无一失的解决方案来避免此类事故。它会持续检查阈值并设置警报，自动跟踪生产过程中实时出现的此类问题。`SAP MII` 还可以触发邮件通知主管，让他们了解此类事件。如果车间机器与
  `SAP MII` 连接，那么当 `MII` 检测到机器发生故障或异常时，它可以停止该机器。


  **注意**


  温度控制器无需人工干预即可控制温度。这个智能工具从热传感器（如电阻温度检测器或热电偶）获取输入，并持续将该信息与设定点（即安全的目标温度）进行比较。它会向控制元件（例如控制温度的阀门）提供输出。


  ### 缺乏达成生产目标所需的决策流程


  生产人员往往缺乏达成生产目标所需的决策支持信息。这些目标由各个工厂不同的关键绩效指标（KPI）来定义和衡量。由于车间与 `ERP` 之间没有直接连接，生产操作员甚至有时是主管，可能会利用这种脱节，手动停止机器或篡改数据，以达到生产目标，从而忽略实际读数。


  通过使用 `SAP MII` 自动化车间涉及的机器并连接到 `ERP`，可以避免这些人为偏差。一旦 `SAP MII` 直接连接到车间机器和 `ERP`，它便可以利用来自车间和
  `ERP` 的实时数据，展示有价值的整体设备效率（OEE）报告和自定义报告，例如机器报告、停机分析报告、良率概览报告等。`SAP MII` 能够非常高效地完全自动化此类场景。


  **注意**


  OEE 代表整体设备效率。它是 ISO 的衡量指标之一，并被纳入最佳实践解决方案中，用于识别真正有效的计划生产时间百分比。良好生产规范（GMP）建议工厂在只生产合格零件时，实际上应实现零停机。因此，如果
  OEE 达到 100%，则被认为是理想的生产状态。如果随着时间的推移达到了非常优异的 OEE 结果，它将成为同一环境下其他设备的基准，或成为其他生产设备的行业标准。同样，它也可以用作基准来检测生产设备随时间推移在消除浪费方面的进展。


  ### 主数据副本导致的质量和合规性问题


  如果 `ERP` 没有直接连接到车间，将主数据传输到车间的唯一方法是从 `ERP` 下载并导出到`Excel`中。在这种情况下，数据传输过程中会浪费大量时间，因为这依赖人工，且容易出错。数据被篡改的可能性也很高。为填补这一空白，`MII`
  可以直接连接到 `ERP` 系统，并在数据从 `ERP` 推送时自动加载主数据。


  ## SAP MII 的功能层面


  `SAP MII` 不仅是一个集成的，也是一个智能的一站式解决方案。它建立起车间与业务流程及运营之间的直接连接。这确保了企业系统与工厂之间的集成近乎实时，并将集成后的数据显示给用户。


  当您考虑将 `SAP MII` 作为集成和智能化的解决方案时，请考虑以下功能方面。


  ### SAP MII 产品的可用性


  目前，`SAP MII` 易于获取，是 SAP 实验室最值得信赖的解决方案之一，如今它与其他一些制造产品一起作为制造套件的一部分提供。`SAP MII` 需要许可，但如果工厂已经购买了制造套件的许可，则它将自动包含
  `SAP MII`。




  ### 集成优势


  SAP MII 拥有许多默认连接器，这使得它能非常轻松地连接到 Level 4、Level 3、Level 2 或 Level 1 的任何系统。SAP MII
  可以填补 Level 3 和 Level 4 之间的空白；如果某个工厂没有 MES，那么 MII 也可以被部署在 Level 3。此外，MII 通过使用 SAP
  PCo 或 OPC 连接器，还可以连接到 Level 2 和 Level 1。见图 2-1。


  ![A421506_1_En_2_Fig1_HTML.jpg](img/A421506_1_En_2_Fig1_HTML.jpg)


  图 2-1. SAP MII 在工业层级模型中的位置 注


  产品生命周期管理（PLM）是一种通过在以人为中心的扩展型企业环境中集成业务数据，来管理任何流程或系统中涉及产品的理念。


  制造执行系统（MES）是一种在制造业中用于监控并记录从原材料到成品转化过程的计算机化系统。它将车间发生的实时情况展示给参与决策的授权人员。该系统记录输入、输出、机器的任何严重故障或错误、操作员活动以及其他支持服务。


  监控与数据采集系统（SCADA）是一种与应用软件集成以控制制造过程的软件。在现代制造业中，自动化系统主要与 SCADA 协同工作。它从传感器和 PLC 设备收集数据，并根据获取的实时数据对所有设备提供精细控制。


  历史数据库可以从多个变量中的复杂系统提取数据，以描绘出制造环境的完整图景。Wonderware 历史数据库通过使用传统关系型数据库管理系统（RDBMS）处理并存储高速数据，能够存储大量的工厂历史数据。它提供了一个安全、高性能的数据库来整合不同的数据源，并提供快速检索技术，以理解不断增长的工业数据。


  分布式控制系统（DCS）指的是生产工厂工业流程的控制系统，在该系统中，控制器分布在工厂的流程控制点上。中央控制室也设有集中控制。DCS 主要遵循分布式层次化控制理念来控制工厂自动化中的流程。


  可编程逻辑控制器（PLC）是一种固态工业计算机控制系统，可以持续监测设备的输入状态，并为自动化流程或机器做出逻辑决策。PLC 是工业继电器的良好替代品，并提供比继电器更多的功能。由于
  PLC 是模块化的，它可以安装在任何环境中来定义逻辑，并且能够抵御高温、粉尘、严寒或高湿度等任何恶劣的制造环境。而继电器则无法在这些环境下正常运行。PLC 由一个
  16 位或 32 位微处理器组成，可连接到 CPU。任何类型的可执行控制逻辑都可以在 CPU 中设计，并通过常规运行传输到 PLC。


  实验室信息管理系统（LIMS）或实验室信息系统（LIS）会考虑实验室操作中涉及的所有实验室仪器和设备。该系统通过集成仪器或设备，并自动管理样本读数的相关信息，使实验室能够根据定义的工作流程实现完全自动化。这种自动化提高了性能，并缩短了满足客户需求所需的时间。


  SAP MII 拥有多种标准连接器以实现无缝集成，具体说明如下：


  -   **聚合连接器**：在创建聚合查询时使用。它能将多个数据集合并为一个。这是 SAP 提供的默认连接器。

  -   **ECC 连接器**：可以使用 SAP Java 连接器（SAP JCo）和 SAP Java 资源适配器（SAP JRA）连接到 SAP ECC。

  -   **数据库连接器 (IDBC)**：可用于任何在 SAP NetWeaver 中定义的 JDBC（Java 数据库连接）-（Oracle、SQL 或任何数据库）或
  ODBC（开放数据库连接）数据源。

  -   **PCO 连接器**：用于支持 SAP PCo 的查询能力。这是 SAP 提供的默认连接器。

  -   **Xml 连接器**：此连接器允许连接并查询任何返回 XML 格式的数据源，系统默认包含。

  -   **报警套件连接器**：此连接器主要用于报警机制的数据源，使您能够连接到 Wonderware Alarm Advisor 软件。

  -   **MDO 连接器**：此连接器专门用于 MDO 查询，且只能有一个活动的 MDO 连接器。这是 SAP 提供的默认连接器。

  -   **开放式连接器**：开放式连接器用于浏览关系数据库中的历史数据。用户可以通过浏览标签名称和描述，并使用时间段来创建标签查询，而无需编写 SQL 查询。

  -   **通用数据连接器 (OLEDB)**：当数据源本身不支持远程数据访问时，通用数据连接器（UDC）可实现远程数据访问。UDC 通过 TCP/IP 套接字与远程通用数据服务器（UDS）通信。OLEDB
  连接器是一种允许访问 OLE DB 数据源的 UDC。

  -   **Xacute 连接器**：此连接器用于通过 Xacute 查询连接到事务。这是 SAP 提供的默认连接器。

  -   **KPI 连接器**：此连接器用于 KPI 查询。默认情况下，只允许一个活动的 KPI 连接器。这是 SAP 提供的默认连接器。

  -   **OLAP 连接器**：此连接器允许连接并查询支持 XML for Analysis (XMLA) 规范的多维数据源。它通常用于集成 BI 查询。

  -   **虚拟连接器**：此连接器有助于在不直接连接到数据源服务器的情况下，虚拟地查询和连接到其他 SAP MII 实例。这是 SAP 提供的默认连接器。

  -   **IP21 和 IP21OLEDB 连接器**：IP21 连接器将 SAP 制造集成与智能（SAP MII）连接到 AspenTech InfoPlus.21
  (IP21) 数据源。

  -   **HANA SDA 连接器**：此连接器允许 SAP MII 连接到 HANA Studio。


  **注**：SAP Java 连接器简称为 SAP JCo。它可以利用 Java 开发与 SAP 兼容的组件和应用程序。SAP JCo 与 SAP ECC 的通信是双向的（即支持入站和出站调用）。入站调用时，Java
  调用 ABAP，出站调用则相反。


  SAP JRA 是 SAP Java 资源适配器。它是一个用于连接 SAP 系统的 Java 企业版连接器。它允许您将 AS ABAP 与远程 Java 应用服务器（如
  AS JAVA）集成，从而简化了不同可分发 SAP Java 应用程序与 AS ABAP（ABAP 应用服务器）之间的通信。


  Java 数据库连接，即 JDBC，充当 Java 的 API，并定义了客户端访问数据库的协议。它是 Java 版平台的一部分，归甲骨文公司所有。它基于关系数据库规则，并提供查询和更新数据库中数据的函数和方法。


  ODBC 代表开放数据库连接，是另一个用于查询数据库的 API，但它是一个开源标准应用程序。通过使用 ODBC，您可以访问不同的数据库，如 Access DB、Excel、DB2、Dbase
  和 Text。除了 ODBC 软件之外，每个数据库还需要一个 Microsoft ODBC 连接器，才能使用 ODBC 软件进行连接和访问数据。




