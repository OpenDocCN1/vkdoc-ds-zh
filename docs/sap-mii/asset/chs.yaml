- "# 7. SAP MII 的新特性\n\n随着技术的进步，SAP MII 通过新的补丁和升级版本不断发展。它始于 SAP MII 11.5 版本，最新版本是\
  \ 15.1。\n\n本章解释了 SAP MII 中可用的新特性。本章涵盖的 SAP MII 功能如下：\n\n*   MDO\n*   可视化服务\n*  \
  \ UI5 和 SSCE\n*   KPI 和警报\n*   PIC\n*   PCo\n*   查询和 JRA 中的会话处理\n*   SAP 15.X 中的新操作块\n\
  \n## 什么是 MDO？\n\nMDO 是制造数据对象，可以将从不同数据源接收、配置并与 SAP MII 集成的数据存储在 SAP MII 后端应用程序数据库中。它用于定义数据对象模型的结构并持久化数据。此功能在\
  \ SAP MII 12.2 版本中添加，并在后续版本中得到了进一步增强。\n\n当需要引用一组不频繁更新的数据时，最好使用 MDO 作为存储。尽管 SAP MII\
  \ 可以与外部存储系统集成，但很多时候，由于外部数据库服务器崩溃、连接问题和安全访问问题，SAP MII 将无法从外部数据库获取数据。除此之外，外部数据库需要额外的成本和维护。它们需要额外的专家资源来处理。SAP\
  \ 设计 MDO 的方式是，如果 SAP MII 使用了 MDO，则其将被存储在后台应用程序中。MDO 存储将发生在标准数据库中；否则，如果 SAP MII 安装在\
  \ HANA 平台上，则 MDO 存储将发生在 HANA 数据库中。HANA 内存处理速度更快，因此如果 MDO 存储在 HANA 数据库中，其数据处理速度也会更快。将数据保存在\
  \ MDO 中无需额外成本，并且具有 SAP MII 专业知识的开发人员也可以处理 MDO 及其设计。\n\n## MDO 如何工作\n\n顾名思义，MDO 是制造数据对象的实例。开发人员可以在\
  \ Workbench 的“对象”选项卡中创建 MDO，就像创建任何其他对象类型一样。\n\n一旦在 MII Workbench 中创建了 MDO 对象，就会在\
  \ SAP MII 数据库中创建一个数据对象。对象创建涉及创建一个具有列定义的表。这个新创建的数据对象指向一个特定于该 MDO 的新建数据库表。对该 MDO 执行的任何数据操作都将相应地存储在该数据库表中。\n\
  \nSAP MII 提供了三种类型的 MDO：\n\n*   持久 MDO\n*   按需 MDO\n*   连接 MDO\n\n### 持久 MDO\n\n\
  这些就像物理数据库表。在内部，SAP MII 会为任何持久 MDO 创建一个数据表，该表位于安装 SAP MII 的同一数据库中，并使用相同的底层应用程序数据库模式。持久\
  \ MDO 可以保留存储在 MDO 中的数据，直到手动删除。\n\n### 按需 MDO\n\n按需 MDO 不会创建物理数据表。没有选项可以将数据存储在数据库中。数据是按需填充的。当查询按需\
  \ MDO 的数据时，数据提供程序在后台运行以在运行时提供数据集，并且数据在运行时期间存在。一旦 MDO 执行完毕，数据实例将无法检索。\n\n### 连接 MDO\n\
  \n这些是两个或多个持久 MDO 的连接，以获取多个 MDO 表的组合视图。连接 MDO 支持 MDO 之间的 INNER JOIN 和 LEFT OUTER\
  \ JOIN。\n\n## 创建 MDO\n\n以下章节描述了如何在 SAP MII 中创建 MDO 类型。\n\n### 创建持久 MDO\n\n按照以下步骤创建持久\
  \ MDO：\n\n1.  打开 SAP MII Workbench。\n2.  打开“对象”选项卡。\n3.  右键单击需要创建 MDO 对象的文件夹。\n\
  4.  选择 `新建文件 > 持久 MDO`，如图 7-1 所示。\n\n    ![A421506_1_En_7_Fig1_HTML.jpg](img/A421506_1_En_7_Fig1_HTML.jpg)\n\
  \n    图 7-1。创建持久 MDO\n5.  MDO 的可用屏幕列表可以在页面左下角的 `模板类别` 选项卡下找到（见图 7-2）。可用的配置如下：\n\n\
  \    ![A421506_1_En_7_Fig2_HTML.jpg](img/A421506_1_En_7_Fig2_HTML.jpg)\n\n    图\
  \ 7-2。MDO 数据提供程序界面\n    *   数据提供程序\n    *   属性\n    *   特性\n    *   生命周期\n    *\
  \   可视化\n    *   安全性\n\n#### 数据提供程序\n\n`数据提供程序` 是数据将要存储到 MDO 中的对象。此配置为 MDO 提供初始数据。这是一个可选配置。\n\
  \n1.  要定义 `数据提供程序`，请单击 `加载` 按钮，如图 7-3 所示。\n\n    ![A421506_1_En_7_Fig3_HTML.jpg](img/A421506_1_En_7_Fig3_HTML.jpg)\n\
  \n    图 7-3。定义数据提供程序\n2.  从可用的树结构中选择对象（`BLS` 或 `查询模板`），如图 7-4 所示。\n\n    ![A421506_1_En_7_Fig4_HTML.jpg](img/A421506_1_En_7_Fig4_HTML.jpg)\n\
  \n    图 7-4。加载对象\n3.  点击 `确定` 以确认 `数据提供程序` 的对象，然后从左侧模板面板中选择 `属性` 配置。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，完成以下翻译工作。\n\
  \n\n#### 属性\n\n该配置定义了数据模型的数据结构和设计。属性是必填项。\n\n1.  当您选择“属性”配置时，将显示如图 7-5 所示的界面。\n\n\
  \   ![A421506_1_En_7_Fig5_HTML.jpg](img/A421506_1_En_7_Fig5_HTML.jpg)\n\n   图 7-5.\n\
  \n   `MDO 属性配置` 界面中的 `列名称` 会根据 `数据提供者` 列出所有列。所需的列可以拖放到 `属性` 列表下。如果最初没有指定 `数据提供者`，则必须通过单击\
  \ `新建` 按钮并分配属性的属性来定义属性。`源映射类型` 单选按钮指定您是希望按名称还是按位置映射属性。您可以修改属性值。两种不同类型的属性如下：\n  \
  \ * `源名称`：对于`数据属性`类型，源名称将`MDO`属性名称链接到`数据提供者`属性名称，并且必须与`数据提供者`属性名称完全匹配。\n   * `源位置`：当使用`数据提供者`时，可以提供源位置，并且该属性将获取`数据提供者`在数据集中返回的输出。\n\
  \   * `自定义属性`：只要在不引用`数据提供者`（源名称和位置）的情况下创建任何新属性，此功能就会绑定到该属性。\n   * `键`：如果选中此复选框，该属性的行为类似于`MDO`表结构的主键。\n\
  \   * `允许空默认值`：如果选中此项，则该列将允许将空默认值插入`MDO`表；否则，必须为该列插入一个值。\n   * `数据属性`（直接映射到`数据提供者`的列）\n\
  \   * `自定义属性`（未映射到`数据提供者`的列，由开发人员新建）\n\n可以为该列定义一个默认值，这样，如果没有向`MDO`表传递任何值，它可以采用针对该属性列定义的默认值。\n\
  \n#### 生命周期\n\n`生命周期`可用于定义数据在`MDO`中持久保留的时长。这仅适用于持久化`MDO`。仅当选择了`数据提供者`时，此项才可见。参见图\
  \ 7-6。\n\n![A421506_1_En_7_Fig6_HTML.jpg](img/A421506_1_En_7_Fig6_HTML.jpg)\n\n\
  图 7-6.\n\n`MDO 生命周期` 配置\n\n可以根据定义的模式调度任何`任务`。您需要提供一个凭证别名以便从调度程序执行它。以下类型的模式可用：\n\n\
  * `替换`：当执行`MDO 数据提供者`时，持久化数据会被删除并替换为结果数据集。\n* `更新`：当执行`MDO 数据提供者`时，持久化数据会根据`MDO`的键属性，用结果数据集进行更新。\n\
  * `删除`：当执行`MDO 数据提供者`时，存储在`MDO`中的持久化数据将被完全删除。\n* `输入`：可以为运行时执行提供`数据提供者事务性`或`查询输入`参数的默认值。\n\
  * `执行后`：这在以`替换`、`更新`、`删除`模式执行`MDO`后，定义了在流程中作为依赖逻辑一部分被视为必要的任何事务。\n* `删除查询`：这定义了用于删除`MDO`数据的`查询`模板。仅当选择了`删除`模式时，此选项卡才启用。\n\
  \n#### 安全性\n\n此配置为要执行的`MDO`对象定义了`读取者`和`写入者`角色部分。\n\n1.  可以从可用角色下拉列表中，将`读取者`和`写入者`角色添加为`NetWeaver`中可用的角色，如图\
  \ 7-7 所示。\n\n   ![A421506_1_En_7_Fig7_HTML.jpg](img/A421506_1_En_7_Fig7_HTML.jpg)\n\
  \n   图 7-7.\n\n   `MDO 安全性` 配置\n\n现在，持久化`MDO`已创建并执行。\n\n### 创建按需 MDO\n\n按需模式`MDO`指的是当向对象发出查询请求时，从定义的`数据提供者`中检索出的数据。这些数据可以是所有对象数据，也可以是`数据提供者`内容的过滤子集，具体取决于您的报告需求。它不会持久化数据，因此此处不能使用`INSERT/UPDATE/DELETE\
  \ MDO`查询。创建步骤与持久化`MDO`相同。\n\n### 创建连接 MDO\n\n请按照以下步骤连接两个或多个`MDO`：\n\n1.  打开 `SAP\
  \ MII 工作台`。\n2.  打开 `对象` 选项卡。\n3.  右键单击需要创建`MDO`对象的文件夹。\n4.  选择 `新建文件` ➤ `连接 MDO`，如图\
  \ 7-8 所示。\n\n   ![A421506_1_En_7_Fig8_HTML.jpg](img/A421506_1_En_7_Fig8_HTML.jpg)\n\
  \n   图 7-8.\n\n   创建`连接 MDO`\n\n5.  当您选择连接`MDO`时，将显示如图 7-9 所示的界面。\n\n   ![A421506_1_En_7_Fig9_HTML.jpg](img/A421506_1_En_7_Fig9_HTML.jpg)\n\
  \n   图 7-9.\n\n   选择要连接的`MDO`对象\n\n可以进行以下配置：\n\n* `数据源`\n* `属性`\n* `布局`\n* `可视化`\n\
  * `安全性`\n\n#### 数据源\n\n`数据源`提供了用于选择要应用于连接的服务器和`MDO`对象的配置。可用的服务器选项列出了在`MII`服务器上配置的`MDO`连接器，其中只需选择一个`MDO`连接器。\n\
  \n可用对象选项使您可以浏览服务器上所有可用的项目`MDO`。您可以从可用列表中加载来自多个项目的多个`MDO`。\n\n\n\n#### 属性\n\n您可以从各自可用的\
  \ MDO 对象中选择属性。对于 `INNER` 或 `LEFT OUTER INNER` 连接，至少需要定义一条条件（参见图 7-10）。此外，还可以借助过滤器表达式来指定\
  \ `WHERE` 子句。以下选项可用：\n\n- **已选对象**：列出上一步为 `JOIN` 操作选择的所有 MDO。\n- **可用属性**：列出在“已选对象”列表中选中的\
  \ MDO 的属性。\n- **已选属性**：为 `JOIN` 操作选择并添加的所有属性都将列在该部分的表格下。\n- **显示名称**：您可以根据需要更改列的\
  \ `JOIN` 输出名称。\n\n![A421506_1_En_7_Fig10_HTML.jpg](img/A421506_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10. 连接的 MDO 属性配置界面\n\n图 7-11 展示了如何选择连接类型。\n\n![A421506_1_En_7_Fig11_HTML.jpg](img/A421506_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11. 已连接 MDO 注释中可用的连接\n\n`INNER` 连接与 `JOIN` 相同。它们也被称为 `EQUIJOIN`。SQL `INNER`\
  \ 连接返回 `table1` 和 `table2` 相交且满足 `INNER` 连接条件的记录。参见图 7-12。\n\n![A421506_1_En_7_Fig12_HTML.jpg](img/A421506_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12. `INNER` 连接示例\n\n`LEFT OUTER` 连接：`LEFT OUTER` 连接返回 `ON` 条件中指定的左侧表中的所有行，以及另一个表中连接字段相等（即满足连接条件）的那些行。参见图\
  \ 7-13。\n\n![A421506_1_En_7_Fig13_HTML.jpg](img/A421506_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13. `LEFT OUTER` 连接示例\n\n1. 需要在 MDO 之间至少定义一条条件，才能将连接应用于可用的运算符，如图 7-14 所示。\n\
  \n    ![A421506_1_En_7_Fig14_HTML.jpg](img/A421506_1_En_7_Fig14_HTML.jpg)\n\n  \
  \  图 7-14. 已连接 MDO 中的可用条件\n\n2. 此外，您还可以筛选为连接输出选择的属性，如图 7-15 所示。\n\n    ![A421506_1_En_7_Fig15_HTML.jpg](img/A421506_1_En_7_Fig15_HTML.jpg)\n\
  \n    图 7-15. 已连接 MDO 中的过滤器表达式\n\n#### 布局\n\n显示 MDO 对象之间连接的图形视图。此界面反映在“属性”选项卡上所做的任何更改。\n\
  \n#### 安全性\n\n与持久性和按需 MDO 相同。\n\n#### MDO 的限制\n\n尽管 MDO 是免费的，但它们有一些限制。以下是 MDO 的一些限制：\n\
  \n- 不建议用于处理海量数据。\n- 不建议用于频繁处理高数据量访问的场景。\n- 不建议在单次执行调用中查询大量数据。\n\n在 MII 中创建的 MDO\
  \ 表的详细信息会使用唯一标识号（例如 `MDO3567`）存储在后台标准表中，而不是使用用户在创建 MDO 时提供的名称。这使得通过 Illuminator\
  \ 服务从后台 MII 标准表中识别特定的 MDO 变得非常困难。SAP 可能会在下一个版本中更改 MDO 的设计，以便在动态获取不同详细信息时更容易调用 MDO。\n\
  \n## 可视化服务\n\n数据可视化是一种视觉传达（描述性统计）的实践，涉及数据的研究和可视化表示。数据可视化服务以交互方式可视化数据。它们从数据分析开始，以最终设计和开发的产品结束。最终产品可以是交互式报告、仪表盘、交互式演示应用程序（移动端或\
  \ Web 端）等。\n\n与许多其他平台一样，SAP MII 允许用户创建可用于各种应用程序的仪表盘对象和网页。SAP MII 可视化服务分为两部分：\n\n\
  - 动态页面生成器\n- 动画对象\n\n### 动态页面生成器\n\n这会创建一个基于 SAP MII 的 HTML 页面内容或图表 Servlet URL。可以通过选择合适的显示模板、查询模板以及与尺寸和其他配置相关的各种其他属性来实现。\n\
  \n请按照以下步骤创建显示模板：\n\n1. 在 SAP MII 管理菜单中，选择 **内容开发** ➤ **工作台**。将显示 SAP MII 工作台界面。执行以下任一操作：\n\
  2. 选择 **文件** ➤ **新建** 以显示您可以创建的模板类型。\n\n有些显示模板是基于小程序的，还有一些是新增的基于 UI5 的模板。参见图 7-16。\n\
  \n![A421506_1_En_7_Fig16_HTML.jpg](img/A421506_1_En_7_Fig16_HTML.jpg)\n\n图 7-16.\
  \ SAP MII 中的显示模板列表\n\n可用的不同显示模板如下：\n\n- `iGrid`\n- `iTicker`\n- `iChart`\n- `iSPC\
  \ Chart`\n- `iBrowser`\n- `iCommand`\n- `iCalendar`\n- `i5Chart`\n- `i5Grid`\n-\
  \ `i5SPC Chart`\n- `i5ValueHelp`\n\n除了这些显示模板之外，**动画对象** 选项也可用，并且可以使用它来更改 SVG 图像（动画对象将在本章后面介绍）。以下部分介绍了一些常用的显示模板。\n\
  \n#### iGrid\n\n可以使用网格显示模板通过 SAP MII 连接器查看数据。您可以定义颜色上下文相关的高亮显示，以基于数据值或范围来突出显示数据元素。网格可用于向用户呈现单选或多选列表框。以下是可以在\
  \ SAP MII 工作台中配置的 `iGrid` 属性（参见图 7-17）：\n\n![A421506_1_En_7_Fig17_HTML.jpg](img/A421506_1_En_7_Fig17_HTML.jpg)\n\
  \n图 7-17. `iGrid` 配置\n\n- 网格区域\n- 布局\n- 表头\n- UI 行为\n- 行标题\n- 颜色上下文\n- 上下文菜单行为\n\
  - 刷新页面\n- 安全性\n\n#### iTicker\n\n启用一个滚动的股票行情条，可以显示从任何 SAP MII 连接器返回的数据。`iTicker`\
  \ 使用小程序的高度和宽度标签自动调整小程序窗口的大小。行情文本会自动垂直居中。数据值可以在行情条中以不同颜色高亮显示。\n\n可配置的 `iTicker` 属性包括以下内容（参见图\
  \ 7-18）：\n\n![A421506_1_En_7_Fig18_HTML.jpg](img/A421506_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18. `iTicker` 配置\n\n- [行情区域](http://help.sap.com/saphelp_mii122sp01/helpdata/en/44/da4751c6880ec1e10000000a422035/content.htm)\n\
  - [数据映射](http://help.sap.com/saphelp_mii122sp01/helpdata/en/44/da4805c6880ec1e10000000a422035/content.htm)\n\
  - [颜色上下文](http://help.sap.com/saphelp_mii122sp01/helpdata/en/44/da48a4c6880ec1e10000000a422035/content.htm)\n\
  - [刷新页面](http://help.sap.com/saphelp_mii122sp01/helpdata/en/44/b3fdb64c7914e6e10000000a114e5d/content.htm)\n\
  - [安全性](http://help.sap.com/saphelp_mii122sp01/helpdata/en/46/7f9f3fb7402d8ae10000000a11466f/content.htm)\n\
  \n#### iChart\n\n处理并显示数据集，每个数据集最多支持 32 个标签和数千个观测值，并以多种图表类型呈现。SAP MII 使用 `iChart`\
  \ 小程序，该小程序支持 `SelectionEvent` 小程序参数，并允许将 JavaScript 函数链接到图例中的项目。\n\n`iChart` 属性可以在\
  \ SAP MII 工作台的以下界面上进行配置（参见图 7-19）：\n\n![A421506_1_En_7_Fig19_HTML.jpg](img/A421506_1_En_7_Fig19_HTML.jpg)\n\
  \n图 7-19. `iChart` 配置\n\n- 图表区域\n- 标题\n- 数据映射\n- 图例\n- X 轴\n- Y 轴\n- 服务器缩放\n- 数据系列详情\n\
  - 上下文菜单行为\n- 刷新页面\n- 安全性\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵守您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n#### iSPC 图表\n\n以多种统计过程控制（SPC）图表格式处理和显示每个标签包含数千个观测值的数据集。每个 SPC 图表都包含以下内容（见图\
  \ 7-20）：\n\n![A421506_1_En_7_Fig20_HTML.jpg](img/A421506_1_En_7_Fig20_HTML.jpg)\n\
  \n图 7-20. iSPC 图表配置\n\n-   一组适合分析类型的汇总统计信息\n-   原始数据视图和完整的统计计算结果视图\n-   SPC 规则违反情况，可逐点向下钻取\n\
  -   每个点的附加属性信息\n-   协作式点记录功能\n\n图 7-20 显示了在与应用程序的 SPC 图表交互时可以显示的数据的不同视图或多维度。当用户单击\
  \ SPC 图表中的数据点时，屏幕会更新以显示该点的特定信息。如果从链接到 SPC 图表的数据查询中返回了任何维度的附加数据，这些数据将作为视图的附加上下文进行显示。\n\
  \n以下是 SAP MII 工作台中的 iSPC 图表可配置属性：\n\n-   图表区域\n-   格式设置\n-   标题\n-   数据映射\n-   参数\n\
  -   图例\n-   X 轴\n-   Y 轴\n-   上方图表规格限\n-   上方图表轴\n-   上方图表 WECO 文本\n-   上方图表区域\n\
  -   上方图表控制限\n-   下方图表轴\n-   下方图表 WECO 文本\n-   下方图表规格限\n-   下方图表区域\n-   下方图表控制限\n\
  -   警报\n-   限值文本\n-   上下文菜单行为\n-   上下文菜单安全性\n-   刷新页面\n-   安全性\n\n#### iBrowser\n\
  \n使用`iBrowser`，您可以将来自多种来源的数据映射到 SAP MII 树、列表或下拉列表视图，这些视图提供选择、向下钻取和其他功能。\n\n当创建查询以映射到浏览器时，适用以下规则：\n\
  \n-   当查询返回单列时，浏览器配置为列表框或下拉列表框。\n-   当返回两列且选中了“数据链接模式”时，第二列显示项目的数据链接值，并且该列被隐藏。浏览器配置为列表框或下拉列表框。\n\
  -   当返回两列且未选中“数据链接模式”复选框时，浏览器配置为树。查询必须返回第一列中的项目名称以及第二列中其父项的名称。\n-   当返回三列或更多列时，浏览器配置为树。查询必须返回第一列中的项目名称以及第二列中其父项的名称。\n\
  -   当返回四列且选中了“数据链接模式”复选框时，系统假定第一列包含项目，第二列包含父节点，第三列包含项目的数据链接值，第四列包含父节点的数据链接值。\n-\
  \   当浏览器配置为树时，可以通过按住`Ctrl`并单击节点，或在树获得焦点时按空格键来取消选中所选节点。\n\n以下是 SAP MII 工作台中可配置的`iBrowser`属性（见图\
  \ 7-21）：\n\n![A421506_1_En_7_Fig21_HTML.jpg](img/A421506_1_En_7_Fig21_HTML.jpg)\n\
  \n图 7-21. iBrowser 配置\n\n-   常规\n-   数据映射\n-   安全性\n\n#### iCommand\n\n`iCommand`允许执行\
  \ SQL 命令查询而无需执行 HTTP POST。因为它可以持有数据集，所以可以将数据查询模板加载到屏幕上的隐藏对象中，并且该数据可以在 DHTML、HTML\
  \ 表格、其他小程序等中使用。`iCommand`不一定需要定义显示元素，并且小程序不需要预先执行模板查询请求。这使得它比网格更高效。\n\nSAP MII 通过`iCommand`小程序支持电子签名和审计日志记录。此功能使最终用户能够实现符合\
  \ 21 CFR Part 11 的解决方案。在`iCommand`小程序显示模板中对此功能有特殊设置。见图 7-22。\n\n![A421506_1_En_7_Fig22_HTML.jpg](img/A421506_1_En_7_Fig22_HTML.jpg)\n\
  \n图 7-22. iCommand 配置\n\n以下配置可用：\n\n-   常规\n-   安全性\n\n#### iCalendar\n\n小程序中可以包含一个日历，并将其链接到其他小程序或网页表单元素。SAP\
  \ MII 仅支持公历。建议将小程序尺寸设置为宽 200 像素，高 188 像素。见图 7-23。\n\n![A421506_1_En_7_Fig23_HTML.jpg](img/A421506_1_En_7_Fig23_HTML.jpg)\n\
  \n图 7-23. iCalendar 配置\n\n以下配置选项可用：\n\n-   常规\n-   安全性\n\n\n\n#### i5Grid\n\n在最新版本的\
  \ SAP MII（从 MII 14.0 SP04 开始）中，除了基于小程序的显示模板外，还添加了一些基于 UI5 的显示模板。通过网页或基于浏览器的脚本，可以使用\
  \ JavaScript 动态控制 `i5Grid` 或类似显示模板的行为和外观，包括方法和事件。这些网格主要用于加载来自查询的数据，其执行速度比小程序更快。见图\
