- '# SAP MII 技术文档


  `PCo`是 SAP MII 的自由分发组件。它是一个基于 `.Net` 的应用程序，可以与车间层和 SPC 系统集成。`PCo` 还可以托管自定义设计的 Web
  服务。SAP MII 有一个默认的连接器用于连接 SAP PCo。SAP Plant Connectivity 被称为 SAP PCo。


  制造数据对象（MDO）可用于定义对象模型和数据结构，并可持久化数据。


  Aspen InfoPlus.21 是一种高度灵活的过程历史记录系统，可参与从单一流程到跨多个地点的企业级全球部署。这种灵活性最终减少了通常发生的标签消耗，从而更好地管理所涉及的元数据。


  工厂信息目录（PIC）包含经批准后从工作版本创建的标签和组层次结构。创建层次结构是为了通过以通用方式与标签数据服务器接口，为标签及其数据提供业务上下文。


  SAP HANA 具有内置的数据库内存，所有数据都存储在 RAM 中。由于数据始终驻留在内存中，数据处理速度更快。这是处理实时分析和应用的最佳推荐方法。它使用基于行和基于列的技术，可以在短时间内处理海量实时数据。


  ## 基础设施优势


  MII 可以安装在 SAP NetWeaver 之上，并且易于部署。基于 SAP MII 开发的解决方案比其他中间件工具更灵活。MII 可以与 NWDI、CTS+
  和 SAP Solution Manager 集成，并且可以轻松跟踪所有更改。由于 SAP MII 部署因其简单性而不耗时，因此部署 SAP MII 解决方案只需极少的停机时间。


  ## 智能优势


  SAP MII 可以通过仪表板、记分卡和丰富的分析工具提供车间层的性能管理。SAP MII 也是一个强大的报告平台，可以在企业数据仓库和 BI 中提供企业报告、即席查询/报告和高级分析。它可以在车间层执行从高管层到工厂层再到产线层的报告。使用
  SAP MII 还可以进行 SPC/SQC（六西格玛）分析。


  ## 创新优势


  SAP MII 可以提供与 IIOT 的兼容性，包括移动和平板设备，如 iPhone、iPad 等。这类创新使 SAP MII 解决方案用户友好且高效。SAP
  MII 可以与 Google Maps 集成，并通过 SMS 和电子邮件等平台进行通信。


  ## 跨工厂级设备的灵活性


  由于 SAP MII 配备了 Open、UDC 和 PCo 连接器，它可以更灵活地连接到 SCADA、DCS、PLC（IFIX）、Wonderware 等系统，因为大多数车间层系统都使用标准
  OPC 连接器。作为 SAP MII 的自由分发组件，SAP PCo 内置了 OPC 连接器，因此可以直接连接。


  注意


  SAP Manufacturing Execution 被称为 SAP ME。SAP ME 是 SAP 用于离散制造的 MES 产品之一。该解决方案帮助制造商以自动化和精细化的方式在每个操作级别管理车间层的生产。它还可以使用
  SAP MII 连接到 ERP 以及车间层。SAP ME 使用名为 SAPMEINT 的集成组件来连接其他系统。


  ## 易于与其他 SAP 制造产品配合使用


  由于 SAP ECC 是 SAP 的企业解决方案，同样，SAP OEE 和 SAP ME 是由 SAP 作为 MES 解决方案开发和维护的，因此将 SAP MII
  连接到这三个产品非常高效、易于配置，并且在连接和集成方面非常可靠。SAP OEE 和 SAP ME 等制造产品也建立在 SAP MII 平台之上。


  ## 符合行业标准的集成


  ISA-95 是集成企业和控制系统的国际标准。B2MML 是业务到制造标记语言。它实际上用于实现 ISA-95 标准的数据模型，并且是使用万维网联盟的 XML
  Schema 语言（XSD）编写的 XML 模式的超集。SAP MII 可以按照 B2MML 与 ISA-95 标准集成。


  ## 统计与其他数学分析


  SAP MII 可以进行数学和特定客户的统计计算。最大值、均值、平均值、标准差等标准函数在 SAP MII 包中默认可用。SAP MII 可以通过逻辑和可视化提供
  SPC/SQC 分析。


  ## 预测分析能力


  可以开发 SAP MII 的解决方案，这些解决方案能够根据某些参数提供机器何时应停止工作的预测性警报。SAP MII 可以分析所有历史值并创建预测性警报，以确定机器何时会停机。


