  \n**图 7-35.** i5Grid 颜色上下文示例\n\n##### i5Grid 输出\n\n可以使用网页或基于浏览器的脚本动态控制 SAP 制造集成与智能（SAP\
  \ MII）中 `i5Chart` 的行为和外观。脚本可以实现以下功能：\n\n- 更改 `i5Chart` 属性\n- 调用 `i5Chart` 方法\n-\
  \ 使用 `i5Chart` 事件（例如用户选择）来链接 `i5Chart`，用于钻取或数据关联应用\n\n图 7-37 显示了最终的输出示例。在 HTML 页面中包含\
  \ `i5Chart` 的代码如下：\n\n![A421506_1_En_7_Fig37_HTML.jpg](img/A421506_1_En_7_Fig37_HTML.jpg)\n\
  \n**图 7-37.** 包含所有功能的 i5Grid 最终输出示例\n\n```\nvar i5Grid = new com.sap.xmii.grid.init.i5Grid(\"\
  Default/Saptaparna/i5Grid_Exercise\", \"Default/Saptaparna/MDO_ReadSVKs\");\ni5Grid.setGridWidth(\"\
  1240px\");\ni5Grid.setGridHeight(\"500px\");\ni5Chart.draw(\"GridDiv\");\n```\n\n\
  ##### i5Grid 功能\n\n`i5Grid` 具有以下功能：\n\n- **应用程序工具栏**：位于每个网格的右上角，默认包含一些图标。\n  - **数据**：可以从网格中导出数据，支持\
  \ HTML、CSV 和 XML 三种格式。\n  - **当前值**：显示查询中所有标签的当前值。这些值会以 HTML 格式在新的窗口中显示，适用于支持标签、PCo\
  \ 和目录模式的查询。\n  - **统计信息**：显示查询中所有标签的统计值。这些值会以 HTML 格式在新的窗口中显示。\n  - **刷新率**：网格刷新的频率（以秒为单位）。\n\
  \  - **自动刷新**：按照指定的频率自动刷新网格。\n  - **打印**：打印网格预览。\n  - **帮助**：提供当前使用的 SAP MII 标准应用程序帮助文档。\n\
  - **时间条**：用于配置时间条的显示或隐藏功能。网格区域会为所有基于查询的数据显示一个时间条。网格会根据选定的日期时间范围相应地刷新。时间条上的箭头可以全屏、四分之一屏或按当前数据显示图表。可以在模板中或使用日期/时间选择器配置日期范围、开始日期和结束日期。主要属性包括滑块、选择器、持续时间和日期/时间选择器。这些新功能增强了可视化的多样性。\n\
  \n有多种脚本方法可以从 SAP MII i5Grid 返回信息，例如 `getGridObject()`、`doPrint()`、`update(Boolean\
  \ ReloadData)` 等。\n\n\n\n#### i5Chart\n\n在 MII 14.0 SP04 版本中引入了一个名为`i5Chart`的新 MII\
  \ HTML5 显示模板。`i5Chart`使用基于 HTML5 的 SAP UI5 技术来渲染图表。它提供了多种可配置的图表来显示和分析数据，是 SAP MII\
  \ 最重要和最强大的可视化组件之一。`i5Chart`的显示模板支持`SelectionEvent`参数，并允许将 JavaScript 函数链接到图表中的项目。支持多种`i5Chart`类型，例如：折线图、柱状图、分组柱状图、饼图、堆叠柱状图、散点图、仪表图、水平柱状图、水平分组柱状图、气泡图、圆环图和自定义图表。见图\
  \ 7-38。\n\n-   **i5Chart 图表区域**：图表区域选项卡用于配置图表类型、颜色、字体、通用图表参数以及元素在图表中显示时的行为。见图 7-39。\n\
  \n    ![A421506_1_En_7_Fig39_HTML.jpg](img/A421506_1_En_7_Fig39_HTML.jpg)\n\n  \
  \  图 7-39. 带有可用图表类型的 i5Chart 图表区域配置\n\n-   **i5Chart 标题**：设置`i5Chart`的标题、颜色、字体和其他属性。见图\
  \ 7-40。\n\n    ![A421506_1_En_7_Fig40_HTML.jpg](img/A421506_1_En_7_Fig40_HTML.jpg)\n\
  \n    图 7-40. i5Chart 标题配置\n\n-   **i5Chart 数据映射**：数据映射选项卡将查询返回的列映射到`i5Chart`对象的各种元素。见图\
  \ 7-41。\n\n    ![A421506_1_En_7_Fig41_HTML.jpg](img/A421506_1_En_7_Fig41_HTML.jpg)\n\
  \n    图 7-41. i5Chart 数据映射配置\n\n-   **i5Chart X 轴**：X 轴选项卡配置与 X 轴（水平轴）相关联的参数。见图\
