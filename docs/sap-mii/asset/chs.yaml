  \n图 7-38. i5Chart 的图形化表示\n\n##### i5Chart 输出\n\n在 SAP MII 中，使用 JavaScript 编写的网页或基于浏览器的脚本可以动态控制`i5Chart`的行为和外观。脚本可用于：\n\
  \n-   更改`i5Chart`属性\n-   调用`i5Chart`方法\n-   使用`i5Chart`事件（例如用户选择）将`i5Chart`链接到下钻或数据关联应用\n\
  \n图 7-46 展示了`i5Chart`的最终输出。以下是将`i5Chart`包含在 HTML 页面中的代码：\n\n![A421506_1_En_7_Fig46_HTML.jpg](img/A421506_1_En_7_Fig46_HTML.jpg)\n\
  \n图 7-46. i5Chart 最终输出\n\n```javascript\nvar i5Chart = new com.sap.xmii.chart.hchart.i5Chart(\"\
  Default/Chart/CHA_I5Chart\", \"Default/Query/MDOQuery_GetData);\ni5Chart.setChartWidth(\"\
  400px\");\ni5Chart.setChartHeight(\"400px\");\ni5Chart.draw(\"chartDiv\");\n```\n\
  \n##### i5Chart 特性\n\n`i5Chart`具有以下特性：\n\n-   **访问工具栏**：位于每个图表的右上角，默认包含一些图标。\n \
  \   -   **数据**：数据可以从网格以 HTML、CSV 和 XML 三种格式导出。\n    -   **当前值**：显示查询中所有标签的当前值。对于支持标签、PCo\
  \ 和编录模式的查询，这些值会在新窗口中以 HTML 格式显示。\n    -   **统计信息**：显示查询中所有标签的统计值。这些值会在新窗口中以 HTML\
  \ 格式显示。\n    -   **刷新率**：网格刷新的频率（以秒为单位）。\n    -   **自动刷新**：按指定的频率刷新网格。\n    -  \
  \ **打印**：打印网格预览。\n    -   **光泽效果**：以光泽效果显示图表，可在图表区域部分启用或禁用。\n-   **时间条**：显示时间条可隐藏/取消隐藏时间条。图表区域会为所有包含时间数据的查询显示一个时间条。网格会根据选定的日期时间范围进行刷新。时间条上的箭头可以以全屏、四分之一屏或针对当前数据显示图表。日期范围、开始日期和结束日期可以在模板中或使用日期/时间选择器进行配置。主要属性包括滑块、选择器、持续时间和日期/时间选择器。这些新功能增加了可视化的灵活性。\n\
  \n有各种脚本方法可以从 SAP MII `i5Chart`返回信息，包括`getChartObject()`、`Refresh()`、`update(Boolean)`等。\n\
  \n```\nJavaDocs Source:\nhttps://:/XMII/JSDOC/i5ChartAllClasses.html.\n```\n\n\n\
  \n#### i5SPC 图表\n\n该图表以多种统计过程控制（SPC）图表格式显示每个标签具有多个观测值的数据集。每个 SPC 图表包括：\n\n-   多种\
  \ i5SPC 图表类型，例如 `XBAR`、`XBAR-MR`、`XBAR-RANGE`、`XBAR-SDEV`、`INDIVIDUALS`、`INDIVIDUALS-MR`、`MR`、`EWMA`、`EWMA-RANGE`、`EWMA-SDEV`、`MEDIAN`、`MEDIAN-RANGE`、`HISTOGRAM`、`INDIVIDUALS-SHORT-RUN`、`INDIVIDUALS-MR-SHORT-RUN`、`XBAR-RANGE-SHORT-RUN`、`MR-SHORT-RUN`、`P`、`NP`、`C`、`U`\
  \ 等，用于不同类型的过程控制和统计质量分析。\n-   数据点高亮和抑制功能，方便用户进行临时分析\n-   自动计算的标准统计与质量指标\n-   图表中的可视化警报，用于显示违反\
  \ SPC 规则的情况，并为每个数据点添加注释文本\n\ni5SPC 图表的配置选项与 iSPC 图表的选项非常相似。主要区别在于 i5SPC 专用于 UI5\
