- '# SAP MII 的技术优势


  由于在车间层执行、ERP 系统和其他遗留系统方面的灵活性，以及 SAP MII 中简单的开发方法和标准化的编码技术，使其成为一个强大的制造解决方案开发平台。以下是您可以从
  SAP MII 中利用的技术优势。


  ## 简单的编码标准


  与其他需要手动编写并记忆要使用的函数和关键字来编写代码的技术不同，SAP MII 以拖放工具的形式提供了非常简单和标准的编码标准。它是一个易于使用的软件应用程序平台，用于通过
  XML 操作、转换和分发工厂和生产信息。使用 SAP MII，您只需拖放所需的动作块，无需担心记忆编码函数、表达式和运算符，因为它们默认内置于动作块中。开发人员唯一需要考虑的是如何使用
  SAP MII 的内置功能来处理业务案例背后的逻辑。


  ## XML 语言的灵活性


  SAP MII 让开发人员能够以结构化的方式强健且高效地存储和使用 XML（可扩展标记语言）。由于 MII 是一个基于 Web 的应用程序，XML 用于在 Internet
  和应用程序之间传输和提供数据。开发人员可以使用 XML 数据文件通过应用不同的样式表来生成动态内容。XML 提供了对数据内容的简单解析。事实上，它可以表示任何类型的数据结构，包括数据库和其他业务信息。XML
  非常易于处理和转换，因为它始终是一个结构化的数据集。`XSLT` 是转换 XML 的 XML 技术之一，并且与 SAP MII 进一步兼容。因此，使用 XML
  为您提供了根据客户需求移动和转换数据的灵活性。


  ## 高端高级业务逻辑服务


  SAP MII 使开发人员能够对真实世界的业务规则进行编码，这些规则可以决定如何根据业务需求创建、显示、存储、操作和更改数据。简而言之，SAP MII 可以使用其标准逻辑服务处理任何类型的客户特定逻辑。业务逻辑定义了业务环境中从一个业务对象到另一个业务对象的逻辑流动，以便它们相互交互。业务对象进行通信的路径和方法应在业务逻辑服务中定义，通常称为
  `BLS`。


  `BLS` 基本定义了数据应如何转换或计算的过程或步骤，以及将其路由到其他系统的方法。SAP MII 提供了许多可以在 `BLS` 中使用的动作块，用于定义从数据输入输出、Web
  输入输出、转换、数据计算、电子邮件通信到流程流控制等业务流程操作。




  ### 符合国际集成标准


  制造业遵循特定的生产标准。根据当前工业自动化水平，`ISA-95` 是制造业中使用最广泛的标准之一。`ISA-95` 通常遵循 `B2MML` 结构，以便与其他系统交互。`SAP
  MII` 可与 `ISA-95` 标准集成，并能通过最少（简单）的编码来处理 `B2MML` 重构，同时还能接收 `B2MML` 并按照 `ISA-95` 标准生成
  `B2MML`。


  ### 集成 UI5 的自助式组合环境


  自助式组合环境（`SSCE`）经过扩展，可集成 UI 元素，并允许最终用户在仪表板中创建自己的前端视图。通过从名为 UI 元素的选择面板中添加合适的 UI 控件，即可创建仪表板。为了将
  UI 元素与后端数据集成，可以从 `MII` 内容窗格中选择同一个 `MII` 实例的查询模板。同样，也可以选择显示模板，并通过配置可视化参数进行添加。对于 UI
  控件，可以在“属性”选项卡中通过下拉选择来选取不同的事件，包括选择、按下等。还可以根据仪表板设计需求选择适当的布局。


  `SSCE` 在后端创建代码，这些代码可以在“源代码”选项卡中查看和修改。修改只能在特定区域内进行。生成的代码不遵循 `MVC` 模式，而是在后端生成一个 HTML
  文件。这是一项附加功能，只需通过拖放操作，就能以最小的工作量在几分钟内创建仪表板。


  ### 易于配置且灵活的解决方案


  `SAP MII` 为开发者提供了非常友好的前端界面。`SAP MII` 足够灵活，可以定制任何特定客户的解决方案，并且在需要时还能进行扩展。`SAP MII`
  拥有非常强大的照明服务；也就是说，可以使用它创建一套完整的即插即用型解决方案。`SAP MII` 提供了调度器、连接器和消息服务等功能，用于将任务配置为 `BLS`
  或查询，并能轻松连接到 `SCADA`、`ERP` 等其他系统并进行配置。


  ### 与遗留系统通信的灵活性


  `SAP MII` 可以通过 `UDS` 或 `PCo` 连接器轻松连接到 `SCADA`/`HMI`、`DCS`、`MES`、工厂历史数据库、自定义数据库、实验室和维护系统以及
  `SPC`/`SQC` 系统等遗留系统。它能够近乎实时地精确获取数据。


  注意


  统计过程控制称为 `SPC`，统计质量控制称为 `SQC`。这两种控制都使用统计工具。虽然 `SQC` 更侧重于分析制造业流程中产生的变异，而 `SPC` 则侧重于通过预测生产过程中的问题并进行控制，从而最大限度地减少生产过程中的浪费。因此，`SPC`
  是 `SQC` 的一种形式，用于检查导致低质量生产的缺陷，而 `SQC` 则完全致力于通过检查每个样本来检查产品质量。这些样品经过检验和可接受性测试，最终才能将产品推向市场。


  ### 与工厂级设备通信的灵活性


  即使工厂环境中不存在遗留系统，只要像 `PLC` 这样的机器与 `UDC`/`PCo` 连接器兼容，就可以通过标签识别，将数据提取到 `SAP MII` 平台。


  ### 与共享网络中文件的连接兼容性


  可以轻松地将 `PCo` 配置为连接到与 SharePoint 链接的任何文件，这些文件存储在共享驱动器中，通过 Microsoft OLEDB 连接器即可将数据获取到
  `SAP MII` 平台。使用 `OLEDB` 连接器，`SAP MII` 可以从任何文件系统中获取数据。


  注意


  `OLE DB`（对象链接与嵌入，数据库，有时写作 `OLEDB` 或 `OLE-DB`），是由 [微软](https://en.wikipedia.org/wiki/Microsoft#Microsoft)
  设计的 [API](https://en.wikipedia.org/wiki/Application_programming_interface#Application%20programming%20interface)，它允许你以统一的方式从各种来源访问数据。


  ### 向 NetWeaver 堆栈暴露服务


  默认情况下，`MII` 服务通过 NetWeaver 作为服务向企业的所有元素公开。所有这些服务都可以被其他 NetWeaver 组件（如 `PI`、门户等）用于数据交换、高级报告和可视化。


  ### 高端可视化能力


  `SAP MII` 支持与水晶报表集成，以便多个报表工具可以访问这些报表。`MII` 可以与企业门户集成以获得更好的可视化效果，并直接与 `ERP` 用户集成以访问这些报表。`SAP
  MII` 拥有一个轻量级门户，用于托管由 `SAP MI` 开发的专业可视化服务。`SAP` 最近引入了 `SSCE`，用于使用 `SAP UI5` 创建和托管特殊的可视化内容。


  ### 支持 Web 服务的能力


  Web 服务可以通过使用 `XML`、`SOAP`、`WSDL` 和 `UDDI` 将企业连接在一起。Web 服务允许应用程序相互通信，而无需担心硬件、操作系统和编程语言。Web
  服务也可以根据用户需求进行定制。`SAP MII` 可以直接连接到其他 Web 服务，以非常安全的方式从其他系统访问数据，因为 `MII` 支持多种加密方法。同样，如果任何第三方系统没有标准的
  Web 服务来调用其数据，`MII` 可以将其 `BLS` 事务作为 Web 服务暴露出来，以便第三方系统可以使用它，以更安全的方式将数据传递给 `MII`。`MII`
  还支持大多数 `REST` 和 `SOAP` 服务来接收和传递数据。


  注意


  简单对象访问协议（`SOAP`）是一种通用的消息传递协议，它与操作系统无关。它可以在所有操作系统中运行，例如 Windows、Linux 等。`SOAP` 通过
  `HTTP` 进行通信，其基础语言是 `XML`。


  Web 服务描述语言（`WSDL`）的接口基于一种由 `XML` 定义的语言。`XML` 用于定义 Web 服务应提供的具有各种功能的方法。业务用户可以轻松地调用这些服务。


  统一描述、发现和集成（`UDDI`）是一个基于 `XML` 的注册中心。它帮助开发者在互联网上发布商业服务。`WSDL` 是其背后的语言。


  ### 提供语言支持的灵活性


  `SAP MII` 通过简单的配置和最少的编码，消除了终端用户使用应用程序的语言障碍。它通过网页本地化和项目本地化功能提供语言支持灵活性。对于任何需要跨地域设计并使用不同相应语言的业务需求，都可以通过
  HTML 或 `SAP UI5`，以用户定义的语言来维护网页前端应用程序。这提供了一个全球标准化但适应特定区域及当地语言的最终应用程序。


  ### 支持带有图形表示的分析


  `SAP MII` 具有使用 `iSPCC` 图表小程序生成图形的功能，这些小程序可用于创建静态图像引用。`SAP MII` 是唯一能够支持 `SPC`/`SQC`
  图表的中间件。`SPC` 图表可以启用标签告警点以及不同告警的自定义级别和注释。`MII` 可以为在 `MII` 中设计的报告显示动画对象或矢量图像。




  ### 简易调试技巧


  在调试方面，SAP MII 提供了断点、监视点、操作成功/失败/未执行项的颜色编码、在断点处修改值的能力，以及灵活地复制粘贴以在另一个编辑器中分析来自不同操作的输出。


  **注意**：断点是在代码调试过程中强制程序停止或暂停的操作。它有助于开发者在检查程序中每一步代码使用时，确认编码是否正确。


  监视点是一种断点，可以放置在待调试的特定表达式上。每当该表达式中某个变量的值发生变化时，程序就会在应用的监视点处停止执行流。此外，值的变化可能涉及多个变量。它可以使用诸如
  `a * b` 之类的运算符，其中 `a` 和 `b` 是具有一定值的变量，`*` 是两个变量之间的运算符。这有时也称为数据断点。


  ### 警报与 KPI 框架


  SAP MII 内置了标准的警报和 KPI 机制。此功能在多个方面为开发者和客户提供帮助。它减少了为 SAP MII 服务器上托管的每个解决方案创建警报机制所需的工作量，并且易于配置。现在可以创建警报阈值并处理某些警报。除此之外，还可以为识别出的任何警报设置确认。也可以查询这些警报。在最新版本中，可以使用
  OData 服务在 HANA 中暴露 KPI 和警报查询。它还可以利用 HANA 的分析引擎提供丰富的分析和预测分析。


  ### 内部数据存储能力


  SAP MII 默认提供 NetWeaver 堆栈数据库，称为 MDO（制造数据对象）。MDO 是 SAP MII 的内部数据存储，客户可以在其中存储小量数据。随着
  SAP 现在将 HANA 与 MII 集成，未来可能在 MDO 中存储大量数据。


  **注意**：SAP NetWeaver 是 SAP 的一个技术平台，可以承载大多数 SAP 业务套件产品。可以在其名为 NetWeaver WEBAS（Web
  应用服务器）的 Web 应用服务器上运行这些产品。


  ## 从业务角度看 SAP MII


  SAP MII 的可扩展性、灵活性、低维护成本以及多层安全特性，使其成为制造业自动化中最受青睐且最合适的平台。以下章节将解释为何 SAP MII 最适合此类业务需求。


  ### 服务器搭建与安装成本更低


  SAP MII 需要托管在 NetWeaver 上，最新版本可以托管在 SAP HANA 上。如果您的客户已经拥有 NetWeaver，则只需安装 SAP MII。SAP
  MII 无需为其自身标准组件单独安装数据库，因为它使用的是 NetWeaver 或 HANA 的应用数据库。补丁升级是免费的，并且易于安装，适用于 SAP MII。总体安装、设置和维护成本低于任何其他中间件工具。


  ### 业务风险低


  由于 SAP MII 具有良好的兼容性，并能轻松与其他 SAP ERP 模块集成，因此通过 SAP 解决方案实现的标准化，为所有参与集成过程的组织带来了可靠性和安心感。过时软件和自定义集成的风险与成本已不再是这些组织需要担忧的问题。


  ### 提供跨应用的大规模可扩展性


  SAP MII 提供了灵活性，可以根据需要扩展、集成、组合、捆绑和分层许多应用的不同功能。SAP MII 的可视化和用户界面开发功能可以为最终用户提供广泛、灵活、可扩展的界面。凭借集成功能，SAP
  MII 可以连接到多种车间系统。SAP MII 具有足够的灵活性，可以应用于大规模制造系统、快速制造系统和小规模制造系统。


  ### 提升效率


  无论车间层和 ERP 层可用的不同系统或软件的供应商是谁，SAP MII 都可以连接到其中任何一个。因此，在任何场景中实施它都能使过程非常高效和可靠。供应商可以利用
  SAP MII 支持的所有车间系统的双向集成，并支持车间层面的本土解决方案。


  ### 总体拥有成本低


  SAP MII 可以在全球、区域和本地层面实施。由于这种灵活性，基于客户需求和预算，SAP MII 可以在相应环境中实施，并且仍将以同样高效的方式运行。


  ### 可定制性


  由于 SAP MII 是一个平台，可以根据客户需求创建客户特定的解决方案，并生成客户特定的报告和前端应用程序。


  ### 项目团队规模更小


  由于 SAP MII 易用的代码标准、强大的逻辑增强能力以及应用的灵活性和可扩展性，与任何其他中间件或报表工具相比，可以用更小的开发团队和项目团队来处理。


  ### NetWeaver 中的统一用户维护


  SAP MII 基于 NetWeaver 构建，因此无需单独进行用户维护。单一用户角色即可访问 SAP MII 开发平台。


  ### 满足客户需求的多层安全


  SAP MII 可以为任何解决方案提供多层安全保护。第一层安全是通过项目特定角色实现的，这些角色可以通过 NetWeaver 用户管理进行控制。除此之外，还可以设置强大的加密逻辑，以保持整个配置和数据的加密状态。SAP
  MII 拥有自定义属性，可以将用户界面限制给特定用户或用户组。对于 ECC 集成，可以为 Java 资源连接器设置客户特定的加密。另一种在 SAP MII 中保护解决方案的方法是在从
  MII 发送信息时使用编码和解码。


  ### 更好的人力资源利用


  由于 SAP MII 提供分步处理，并能在任何步骤或过程中进行控制，从而直接连接 ERP 或车间系统，因此减少了人力资源的需求，同一人员可以参与到更多流程中。可以将精力引导到提高人力利用效率上。


  ### 消息的可靠传递


  制造业最关键的風險之一就是生产数据丢失。为防止这种情况，制造企业一直在寻找即使在连接中断/中断时也能保证数据传递的解决方案。使用 SAP MII 可以开发一个高度可扩展的解决方案，实现可靠的传递。


  ### 提供本地生存能力


  在实际制造行业中，可能会发生车间运行正常但与 ERP 的连接中断的情况。这种情况下，车间需要停机，这将给公司造成经济损失。此时，如果 SAP MII 作为中间件运行，SAP
  MII 可以将数据缓冲在内部队列或内部数据库中，即使 ERP 连接中断，也能保持车间自动化持续运行。当连接重新建立后，MII 可以按照 FIFO 方法将数据推送到
  ERP。


  **注意**：FIFO 代表先进先出，意思是先进入的产品先出去。


  ### 制造员工单一用户界面


  SAP MII 提倡单一用户登录功能。当用户登录到 SAP MII 系统时，无需再单独登录 ECC 或车间系统。SAP MII 在后端维护一个通用用户，以便 SAP
  MII 可以连接到 SAP ECC 来调度或确认 ECC 中的订单。




  '
- '# BI/BW 与 MII 和 PI 的区别


  如前所述，制造业的主要需求是拥有一个优秀的中件产品，能够集成从车间层到 ERP 系统的各种系统。另一个需求是拥有一个出色的报告解决方案，以便轻松满足制造系统庞大的报告需求。


  SAP 有一款名为 `SAP PI` 的中件产品，用于将 ERP 与车间层集成；还有一款名为 `SAP BI` 的报告产品，用于提供可配置的、功能强大的报告功能。而
  `SAP MII` 可以同时满足这两种需求。有时，很难确定使用哪种产品最佳。接下来的部分将说明何时以及为何使用每种特定产品。


  ## 什么是 SAP BI/BW？


  `BI`（商业智能）是一种基于原始数据系列提供智能分析的应用程序。`BI` 可以为业务用户提供灵活、可配置的报告，并帮助您做出更明智的业务决策。`BI` 能够处理海量历史数据，并利用其高容量数据处理引擎进行分析。`BI`
  还有另一个称为业务数据仓库（`BW`）的组件，它负责持久化所有历史数据，并帮助 `BI` 基于这些数据进行深入分析。


  ## 何时应使用 BI/BW？


  -   `BI` 用于跨职能报告，而 `MII` 则与制造领域相关。

  -   `SAP BI` 具有连接到 `SAP` 系统的原生连接器，但在涉及车间层时，由于其特殊的数据模型，难以提取数据。`SAP MII` 通过其专为主要车间系统和历史数据库设计的提取技术（并遵循
  `ISA 95` 标准），克服了这些问题。

  -   与 `SAP MII` 不同，`SAP BI/BW` 无法轻松复制 SPC/SQC 图表，这使得它在特定于制造的能力方面不太适用。

  -   `SAP BI/BW` 无法在运行时提供工厂级的增值指标数据，例如设备可用性、停机时间、良率、周期时间和能源分析。它也无法像 `SAP MII` 那样轻松地直接与生产过程（如生产过账和从车间层的货物移动）集成。因此，`SAP
  MII` 还减少了在 `SAP` 中手动输入数值时可能发生的人力冗余。

  -   `BI` 是为处理海量数据而建模和设计的，而 `MII` 无法一次性处理海量数据。要让 `MII` 处理海量数据，需要以批次方式进行调度。

  -   `BI` 可以处理 Excel 文件（ `.xls` 、 `.xlsx` 和 `.xlsm` ）以提取数据，而 `MII` 则不能。`MII` 需要自定义
  Java 代码才能从 Excel 文件中提取数据。如果文件名固定，`SAP MII` 可以通过 `PCo` 连接器处理 Excel 文件。

  -   与 `SAP MII` 生成相同数据量报告所需的时间相比，`BI` 能够更快地生成包含海量数据的报告。未来，如果 `HANA` 与 `SAP MII`
  的集成成熟，这一执行时间限制将不再成为问题。

  -   `SAP BI` 是标准报告工具，因此报告和模板可以根据客户标准轻松定制，无需额外编码。由于 `SAP MII` 是一个平台，此类可定制模板需要从头开发，才能为客户提供类似功能。


  ## 什么是 SAP PI？


  `SAP PI` 使您能够通过 A2A 和 B2B 连接器框架集成后端系统和应用程序。它通过业务流程引擎支持有状态和长时间运行的业务逻辑。


  它只能提供从 ERP 到其他多个遗留系统的集成。它遵循点对点或点对多点的集成模式。它无法灵活地与用户界面集成。


  ## 何时使用 SAP PI？


  -   当企业采用面向服务的架构，并且发现流程集成是必要的时候。

  -   当需要一个存储库来存储客户环境中企业服务和业务流程所涉及的服务、数据类型或元数据时。

  -   当需要通过 `UDDI`、Web 服务互操作性配置文件、寻址、安全性、可靠消息传递和协调来支持额外的 Web 服务标准时。

  -   当需要在业务应用程序之间建立高数据量和关键场景的集成时。


  ## 什么是 SAP MII？


  正如第 1 章所述，`SAP MII` 是一个灵活、强大的制造平台，用于开发从第 4 级（ERP）到第 0 级（车间机器）的集成解决方案。它包括高端可视化和一个独立于浏览器的用户界面。


  ## 何时使用 MII？


  -   您需要分析和整理来自不同数据源的数据集。

  -   您需要跨制造站点的全球运营访问权限。

  -   您需要具有向下钻取功能的智能应用程序，以查看跨不同数据点的数据集在极细粒度上的分析结果。

  -   您需要将车间或工厂机器连接到 ERP，以使用标准的 `SAP` 连接器实现实时数据可用性。

  -   工厂人员需要能够执行报告职责（标准、移动和临时报告）以及基本的执行职责。

  -   工厂运营、生产和管理用户需要可标准化、定制化或兼容移动端的报告，用于分析和监控制造业涉及的不同 KPI。


  ## BI、PI 还是 MII：该用哪个


  当客户可以选择使用 `BI`、`PI` 或 `MII` 时，这可能会是一个艰难的决定。本节就制造业中哪个更优提供一些视角。本节将对 `BI`、`PI` 和 `SAP
  MII` 进行比较。


  -   为了将消息和信息从车间层传输到 ERP，`SAP PI` 需要部署在本地工厂。但 `SAP MII` 可以部署在本地、区域甚至全球总部。`SAP MII`
  比 `SAP PI` 更灵活。

  -   `SAP PI` 以其数据路由设计和保证送达而闻名。您也可以轻松地在 `SAP MII` 中开发类似的设计。

  -   由于 `SAP PI` 在车间层连接器方面存在局限性，可能会导致消息处理上的不一致性。`SAP MII` 具有标准的 OPC 兼容车间层连接器和用于工厂连接的
  `SAP PCo`，这意味着 `SAP MII` 中的消息处理更快、更一致。

  -   不同的制造车间可能有所不同，而且根据每个工厂使用的生产线也可能存在差异。为了使用 `PI` 处理类似的数据，需要在车间层进行定制，以使数据符合 `PI`
  的结构。在 `SAP MII` 中，XML 是解决方案的骨干，这意味着数据结构的变化对 `SAP MII` 影响不大。

  -   `SAP MII` 可以轻松处理 `SAP PI` 拥有的所有功能。`SAP MII` 相比 `SAP PI` 还多了一些可视化和数据处理方面的特性。如果客户的数据量非常大，并且需要一个能将海量数据从一个系统传输到另一个系统的解决方案，那么最好使用
  `BI`。如果客户需要处理常规数据量的集成和智能分析，建议使用 `SAP MII`，因为它可以提供集成、智能分析以及高端可视化和许多其他制造方面的优势。


  '
- '# 总结


  本章讨论了制造业面临的关键挑战，并从功能、技术和业务角度阐述了为何应该使用 `SAP MII`。您了解了何时更倾向于使用 `MII` 而非 `SAP BI/BW`，以及反之亦然的情况。本章还解释了什么是
  `PI`，包括其优缺点，并讨论了何时应选择 `MII` 而非 `PI`。


  在下一章中，您将了解 `SAP MII` 的一些基本构建功能，包括 `BLS`、查询模板、可视化和常用的操作块。




  '
- "# 3. SAP MII 基础\n\n在深入从技术角度探讨 SAP MII 并将其与功能需求关联之前，专业人员应清楚了解其基本的概念性整体配置以及智能开发 IDE\
  \ 及其功能。本章将介绍 SAP MII 的基础知识、各类配置的相关步骤、开发组件及其他基本特性。\n\n要处理 SAP MII 的技术部分，需要了解的重要特性包括：\n\
  \n-   `数据服务（Data Services）`，负责配置与其他系统的所有连接。\n-   `消息服务（Message Services）`，处理通过 SAP\
  \ MII 进出系统的消息流。\n-   开发组件，包括逻辑服务、查询模板、MDO、可视化以及其他 Web 开发组件。\n\n## 数据服务\n\n`数据服务`通过为特定供应商的工厂系统协议提供连接器，并使用标准协议连接关系数据库，从而实现制造车间的连接。SAP\
  \ MII 安装自带数据连接器，能够连接到任何制造车间系统。它还提供了不同类型的可配置数据查询（可通过 SAP MII Workbench 配置），用于从数据源检索或写入数据。这些数据查询可通过\
  \ HTTP 调用或基于 Web 界面的 Java 小程序进行访问。\n\n`数据服务`的可用菜单选项如下：\n\n-   `数据服务器`\n-   `连接状态`\n\
  -   `连接`\n-   `模拟器服务`\n-   `共享内存`\n-   `时间段`\n-   `时间段计划`\n-   `数据缓冲区`\n\n其中一些特性将在以下章节中介绍。\n\
  \n### 数据服务器\n\n`数据服务器`用于配置查询模板，以从不同来源查询数据。您可以在 SAP MII Workbench 中浏览这些数据。请参见图 3-1。\n\
  \n![A421506_1_En_3_Fig1_HTML.jpg](img/A421506_1_En_3_Fig1_HTML.jpg)\n\n图 3-1. SAP\
  \ MII 中数据服务器的位置\n\n常见的服务器配置参数包括：\n\n-   `名称`：所提供服务器的名称。必须唯一。\n-   `连接器`：可用的连接器包括：`Aggregate`、`AlarmSuite`、`DataSource`、`IDBC`、`IP21`、`IP21OLEDB`、`InSQL`、`OLAP`、`OLEDB`、`Open`、`Simulator`、`通用数据连接器（UDC）`、`虚拟服务器`、`VirtualAlarm`、`VirtualIDBC`、`VirtualOLAP`、`VirtualTAG`、`VirtualXML`、`VirtualXacute`、`XML`\
  \ 和 `Xacute`。\n-   `连接器类型`：由数据源类确定的连接类型。可能的连接器类型有 `AGG`（聚合）、`ALARM`、`MDO`、`OLP`（OLAP）、`PCo`、`SQL`、`TAG`、`XCT`、`XML`\
  \ 和 `KPIConnector`。\n-   `已启用`：用于激活服务器的指示器。您可以勾选或取消勾选以分别启用或禁用服务器激活。如果启用了数据服务器并对其参数进行了更改，服务器将重新加载，更新后的设置将立即生效。\n\
  -   `允许动态查询`：用于支持具有 `动态查询` 角色的用户进行动态查询的指示器。当取消选择时，该数据服务器不支持动态查询。\n\n### 创建连接器\n\n\
  请遵循以下一般配置步骤来创建连接器：\n\n1.  从左侧菜单中，选择 `数据服务` ➤ `数据服务器`，如图 3-2 所示。\n\n    ![A421506_1_En_3_Fig2_HTML.jpg](img/A421506_1_En_3_Fig2_HTML.jpg)\n\
  \n    图 3-2. SAP MII 数据服务器配置\n\n2.  在下一个窗口中，选择 `创建`，如图 3-3 所示。\n\n    ![A421506_1_En_3_Fig3_HTML.jpg](img/A421506_1_En_3_Fig3_HTML.jpg)\n\
  \n    图 3-3. `数据服务器` 配置中的 `创建` 按钮\n\n3.  为便于后续识别，为其提供一个合适的服务器名称（必填）和描述（可选）。从下拉菜单中选择适当的连接器类型，如图\
  \ 3-4 所示。\n\n    ![A421506_1_En_3_Fig4_HTML.jpg](img/A421506_1_En_3_Fig4_HTML.jpg)\n\
  \n    图 3-4. 数据服务器配置\n\n4.  根据您的要求，按照要创建的数据服务器类型执行后续步骤。\n\n5.  您还可以使用图 3-5 所示的按钮删除、复制和编辑选定的连接器。\n\
  \n    ![A421506_1_En_3_Fig5_HTML.jpg](img/A421506_1_En_3_Fig5_HTML.jpg)\n\n    图\
  \ 3-5. SAP MII 数据服务器配置中的其他按钮\n\n6.  从列表中选择数据服务器后，将显示连接器的详细信息，并且 `使用情况` 标签页会显示使用该连接器的\
  \ SAP MII Workbench 对象名称。请参见图 3-6。\n\n    ![A421506_1_En_3_Fig6_HTML.jpg](img/A421506_1_En_3_Fig6_HTML.jpg)\n\
  \n    图 3-6. 数据服务器中的使用情况检查\n\n7.  `状态` 标签页显示连接器的状态为 `运行中`、`已停止` 或 `错误`，如图 3-7 所示。\n\
  \n    ![A421506_1_En_3_Fig7_HTML.jpg](img/A421506_1_En_3_Fig7_HTML.jpg)\n\n    图\
  \ 3-7. 数据服务器中的状态检查\n\n#### MDO 连接器\n\n用于针对制造数据对象（`MDO`）执行查询的连接器。\n\n从一般配置步骤的第二步开始，选择连接器为\
  \ `MDOConnector`。创建完成后，它将显示在 `设置` 标签页中，如图 3-8 所示。\n\n![A421506_1_En_3_Fig8_HTML.jpg](img/A421506_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8. 配置 MDO 连接器\n\n`连接` 标签页显示以下设置，如图 3-9 所示：\n\n-   `数据前缀`：定义在处理日期或时间数据库列时使用的前缀。\n\
  -   `日期后缀`：定义在处理日期或时间数据库列时使用的后缀。\n-   `保留天数`：用于数据缓冲。执行尝试在从数据缓冲区移除之前保留的天数。\n-   `最大重试次数`：用于数据缓冲。系统在停止前重试执行尝试的次数。\n\
  -   `重试间隔`：用于数据缓冲。系统在重试执行尝试之前等待的毫秒数。\n\n![A421506_1_En_3_Fig9_HTML.jpg](img/A421506_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9. MDO 连接器连接创建\n\n\n\n### IDBC (SQL/Oracle) 连接器\n\n`IDBC 连接器` 提供了与任何数据库的直接连接，以便对其表数据创建\
  \ SQL 查询。数据库的示例包括 Microsoft SQL Server、Oracle 数据库、MaxDB、DB2 等。\n\n在创建新的 IDBC 数据服务器配置时，至少需要更改用于身份验证的属性\
  \ `UserName`、`Password` 和 `ServerURL`。\n\nSAP MII 中包含的 JDBC 驱动程序如下：\n\n*   **Oracle**：必须使用\
  \ Oracle 7.3.4 或更高版本（`oracle.jdbc.driver.OracleDriver`）。\n*   **SQL Server**：必须使用\
  \ SQL Server 6.X、7.X 或 2000（`com.inet.tds.TdsDriver`）。\n*   **ODBC**\n\n从常规配置的步骤\
  \ 2 开始，选择 `MDOConnector` 作为连接器。创建完成后，它将在“设置”选项卡中显示，如图 3-10 所示。\n\n![A421506_1_En_3_Fig10_HTML.jpg](img/A421506_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10. IDBC 连接器设置\n\n在“连接”选项卡中，界面如图 3-11 所示。\n\n![A421506_1_En_3_Fig11_HTML.jpg](img/A421506_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11. IDBC 连接配置\n\n以下是适用于 IDBC 连接器的一些其他重要连接配置选项：\n\n*   **池大小（Pool Size）**：连接池是任何数据库连接创建的线程总数，以允许相应数量的并行数据库命中。池大小表示\
  \ MII 可以同时打开的并行连接数。默认池大小为 1。\n*   **最大池大小（Pool Max）**：用户可以设置最大池大小，数据库服务器据此允许用户创建池连接。用户可以使用为数据库连接池大小定义的相同值。通过在\
  \ MII 中定义此值，它也可以同时打开最多此数量的连接。默认值为 100。\n*   **等待时间（Wait Time）**：定义当连接池已满时，连接的最大等待时间。\n\
  \n有关数据服务器的更多信息，请参考由 Suman Mukherjee 编写的以下 SCN 博客：`https://blogs.sap.com/2014/02/24/data-connection-details-for-data-server-configuration/`\
  \ 和 `https://blogs.sap.com/2013/03/13/importance-of-pool-size-configuration-of-data-server-in-sap-mii/`。\n\
  \n#### PCo 连接器\n\n工厂连接（PCo）连接器允许 SAP 制造集成与智能（SAP MII）支持 PCo 的查询功能。参见图 3-12。\n\n\
  ![A421506_1_En_3_Fig12_HTML.jpg](img/A421506_1_En_3_Fig12_HTML.jpg)\n\n图 3-12. PCo\
  \ 连接器配置\n\n创建 PCo 连接时，可以采用以下选项之一：\n\n*   手动输入 PCo 管理服务的 URL。\n*   从系统景观目录（SLD）中检索已注册的\
  \ PCo 实例。\n\n要配置如图 3-12 所示的 PCo 连接器属性，有两个选项可用：\n\n*   **选项 1**：使用 CTC 模板完成功能单元 SLD\
  \ 的初始设置。这是 SAP NetWeaver SLD 客户端配置的标准过程。在 SLD 中注册 PCo 管理服务。之后，按照以下说明操作。\n*   **选项\
  \ 2**：如果 PCo 管理 Web 服务接口需要身份验证，系统会提示用户输入用户名和密码。之后，按照以下说明操作。\n\n要创建 PCo 数据服务器，您需要转到\
  \ MII 菜单 ➤ 数据服务 ➤ 数据服务器。您可以选择连接器类型为 `PCoConnector`，然后单击“创建”按钮。您需要为服务器提供一个唯一的名称。\n\
  \n在下一页，系统将询问 PCo 实例的 URL。您需要提供 URL，例如 `http://<主机>:<端口>/PCoManagement`。（`Host` 是安装\
  \ PCo 的系统名称，`Port` 是在 PCo 管理控制台中配置的默认端口 `50050`）。\n\n![A421506_1_En_3_Fig13_HTML.jpg](img/A421506_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13. PCo 连接配置\n\n最后，您需要提供用户名和密码。\n\n#### UDC (OLEDB) 连接器\n\n通用数据连接器（UDC）是一个框架，允许通过您开发的专有服务器应用程序访问\
  \ SAP 制造集成与智能（SAP MII）服务。OLEDB 连接器是一种 UDC，允许访问 OLE DB 数据源。OLEDB 连接器使用 PCo 服务器提供对符合\
  \ Microsoft 标准的数据源的 OLEDB 访问。可以通过选择 `OLEDBConnector` 作为连接器来使用 OLEDB 数据服务器创建标签查询。创建完成后，它将在“设置”选项卡中可用，如图\
  \ 3-14 所示。\n\n![A421506_1_En_3_Fig14_HTML.jpg](img/A421506_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14. OLEDB 连接器设置选项卡\n\n在“连接”选项卡中，您将看到如图 3-15 所示的设置。\n\n![A421506_1_En_3_Fig15_HTML.jpg](img/A421506_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15. OLEDB 连接配置\n\n此外，请选择“可写（Writable）”复选框。如果选中该复选框，连接器将支持写入 OLEDB 代理。如果未选中可写复选框，您将无法写入代理，这意味着\
  \ `CurrentWrite` 和 `HistoryWrite` 查询将失败。\n\n#### XML 连接器\n\nXML 连接器可用于连接到符合 XML\
  \ 标准的数据源，以检索 SAP MII XML 格式的数据。SAP MII 中提供了一个名为 `XMLConnector` 的默认 XML 数据服务器，但也可以配置额外的\
  \ XML 数据服务器实例。参见图 3-16。\n\n![A421506_1_En_3_Fig16_HTML.jpg](img/A421506_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16. XML 连接器设置\n\n在 XML 数据服务器配置中，只能编辑“描述”属性。使用 XML 数据服务器，可以在 SAP MII 中创建 XML\
  \ 查询，以从 SAP MII 服务器中的 URL 或文件路径检索 XML 数据集。\n\n#### Xacute 连接器\n\n这是一个内部系统连接器，用于执行业务逻辑事务，这些事务是使用\
  \ SAP xMII Workbench 创建的数据查询，称为 Xacute 查询。随 SAP MII 标准安装提供了一个名为 `XacuteConnector`\
  \ 的默认 Xacute 数据服务器配置。可以使用 `XacuteConnector` 数据服务器创建 Xacute 查询。参见图 3-17。\n\n![A421506_1_En_3_Fig17_HTML.jpg](img/A421506_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17. Xacute 连接器设置屏幕\n\n从 Xacute 连接器的“连接”选项卡中，您可以看到 `Auto.Bind`（参见图 3-18）。该功能默认始终对此连接器启用。此功能使标准\
  \ SAP MII 照明器服务参数的值（例如 `IllumLoginName`、`IllumLoginRole` 等）能够从会话登录中自动绑定。\n\n![A421506_1_En_3_Fig18_HTML.jpg](img/A421506_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18. Xacute 连接配置\n\n\n\n### 连接\n\n连接用于创建和配置与其他系统的连接。用户名和密码别名在`Credential Stores`界面中定义，在连接配置过程中需要进一步分配这些别名。除此之外，还需要配置连接的具体细节，如服务器、端口、主机等。连接和凭据别名可在\
  \ SAP MII 操作块（如`JCo`、`JRA`、`Send Mail`等）中进一步使用，而无需再次提供每个配置细节。\n\n维护这些别名的其中一个主要好处是，如果连接细节发生更改，这些更改可以直接纳入配置中，而无需修改\
  \ SAP MII 代码库。在生产环境中，反复更改代码是高风险、高成本且耗时的，因为这涉及大量的测试、文档编写和审批流程。请参见图 3-19。\n\n![A421506_1_En_3_Fig19_HTML.jpg](img/A421506_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19. SAP MII 连接配置\n\n以下几种连接类型是可能的：\n\n*   `BC` (SAP 业务连接器)\n*   `WAS` (SAP\
  \ NetWeaver 应用服务器)\n*   `JCO` (SAP Java 连接器)\n*   `FTP` (文件传输协议)\n*   `MAIL` (电子邮件)\n\
  *   `JMS` (Java 消息服务)\n*   `EJB` (企业 JavaBeans)\n\n### 连接状态\n\n`连接状态`界面显示您已启用的数据库服务器的状态。该界面仅显示具有连接池的`IDBC`服务器信息。大多数基于标签的服务器，如通用数据服务器（`UDS`），不会响应状态检查。请参见图\
  \ 3-20。\n\n![A421506_1_En_3_Fig20_HTML.jpg](img/A421506_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20. SAP MII 连接状态界面\n\n当服务器可用连接数为零，或者出现配置、网络或通信问题导致 SAP MII 无法连接到服务器时，状态会相应地更新。\n\
  \n### 共享内存\n\n共享内存是 SAP MII 中变量处理的强大概念之一。它用于存储带有某些属性的值，这些值可在以后保留。值可以被修改和删除。共享属性被认为是临时数据存储属性之一。共享属性在一个项目的所有事务中存储该值。它们类似于特定项目的全局数据占位符。\n\
  \n共享属性由两部分组成：默认内存和活动内存。变量创建时所有值都存储在默认内存中。同时，相同的值会被复制到活动内存中。活动内存总是优先于默认内存，因为默认内存仅用于使变量拥有一个默认值。所有业务逻辑只从活动内存中接受数据，并且技术人员和管理员用户可以根据需要在复制默认值后对其进行更改。您必须在\
  \ SAP MII 工作台中手动更改共享属性的默认值。共享属性可以在 SAP MII 工作台的`Meta-inf`选项卡的`SharedProperties.mem`文件中定义。\n\
  \n![A421506_1_En_3_Fig21_HTML.jpg](img/A421506_1_En_3_Fig21_HTML.jpg)\n\n图 3-21.\
  \ 默认共享内存配置\n\n活动内存值可以通过在 SAP MII 工作台中转到工具 ➤ 共享内存来更改，如图 3-22 所示。\n\n![A421506_1_En_3_Fig22_HTML.jpg](img/A421506_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22. 共享内存活动内存配置\n\n活动内存值也可以通过转到 SAP MII `Menu.jsp`页面的数据服务 ➤ 共享内存来更改。\n\n##\
  \ 消息服务功能\n\n`消息服务`功能将企业系统与 SAP MII 集成。它可以在 SAP MII 中用于通过`HTTP POST`以异步 RFC、ALE/IDoc\
  \ 或 XML 消息的形式接收企业数据。企业系统也可以发送数据。可以在 SAP MII 中配置消息监听器来接收这些数据。然后，处理规则使用特定的业务逻辑或消息来处理数据。MII\
  \ 通过消息服务接收的消息存储在 SAP MI 数据库中，或者简单地分配到一个类别。MII 可以通过数据服务将这些消息发送到外部系统，或者通过 BLS 中的 Web\
  \ 服务调用从外部系统编译这些消息。数据缓冲也通过`消息监听器`完成。\n\nSAP MII 菜单页面上的消息服务具有如图 3-23 所示的功能。这些功能将在以下各节中更详细地讨论。\n\
  \n![A421506_1_En_3_Fig23_HTML.jpg](img/A421506_1_En_3_Fig23_HTML.jpg)\n\n图 3-23.\
  \ SAP MII 中的消息服务菜单\n\n### 消息监听器\n\n消息监听器用于异步接收来自企业系统的 Web 服务、RFC（同步和异步）或 IDOC 消息。\n\
  \n要配置 RFC/IDOC（`SAPJCo`）消息监听器，请点击消息监听器界面中的更新按钮。选中的监听器将根据 NetWeaver 中的配置进行更新。SAP\
  \ MII 消息监听器有三种类型：`IDOC 监听器`（10 个）、`RFC 监听器`（10 个）和`SRFC 监听器`（10 个）。请参见图 3-24。\n\n\
  ![A421506_1_En_3_Fig24_HTML.jpg](img/A421506_1_En_3_Fig24_HTML.jpg)\n\n图 3-24. SAP\
  \ MII 中的消息监听器配置\n\n要完成 IDOC 或 RFC 的消息监听器配置，需要在 NetWeaver 中进行配置。以下必需属性应由 NetWeaver\
  \ 服务器管理员设置：\n\n*   `ProgramID`：唯一 ID，与 SAP ERP 中维护的 ID 相同。\n*   `MaxReaderThreadCount`：SAP\
  \ ERP 中允许的最大线程数。\n*   `UserName`：用于登录 SAP ERP 配置文件的用户名。\n*   `Password`：用于连接 SAP\
  \ ERP 配置文件的用户密码。\n*   `ServerName`：在 SAP ERP 中创建配置文件时使用的服务器 URL。\n*   `PortNumber`：在\
  \ SAP ERP 中创建配置文件时使用的端口号。\n*   `SAPClient`：在 SAP ERP 中创建配置文件时使用的客户端编号。\n\n以下探测器服务用于消息监听器：\n\
  \n```\nhttp://<服务器>:<端口>/XMII/Illuminator?service=WSMessageListener&mode=WSMessageListenerServer&NAME=<唯一消息名称>\n\
  ```\n\n指定通用属性部分的唯一名称。取消选中启用复选框允许用户定义消息监听器配置，但不会激活其使用。\n\n任何消息监听器配置都可以根据需要启用或禁用。状态属性显示监听器的当前状态。当配置新监听器时，默认状态始终为已停止。此外，现有监听器可以在任何时间点启动或停止。已停止的消息监听器无法从发送方系统接收消息。\n\
  \n### 消息处理规则\n\n消息处理规则用于确定用户希望如何处理传入的远程函数调用（RFC）、IDoc 和 Web 服务消息。消息根据其类型进行处理。消息服务中的处理规则被定义为在\
  \ SAP MII 从外部发送方系统接收到消息时自动处理消息。请参见图 3-25。\n\n![A421506_1_En_3_Fig25_HTML.jpg](img/A421506_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25. 消息处理规则界面\n\n处理类型决定消息的处理方式。\n\n*   **基于事务的规则**：消息立即传递给一个事务。一个业务逻辑事务被指定为处理规则。\n\
  *   **基于类别的规则**：仅将消息分配到一个类别，不进行自动处理。也就是说，当消息监听器接收到特定消息时，它会被缓冲到数据库中，并搜索相应的处理规则。类别用于将消息进行逻辑分组，以便进行临时处理。\n\
  \n\n### 消息清理规则\n\n此项配置用于根据各种条件删除缓冲消息。“消息清理”屏幕显示消息清理规则列表，您可以在其中运行、启用、禁用消息清理规则，并根据需要删除它们。参见图\
  \ 3-26。\n\n![A421506_1_En_3_Fig26_HTML.jpg](img/A421506_1_En_3_Fig26_HTML.jpg)\n\
  \n**图 3-26.** 消息清理规则配置屏幕\n\n### 消息监控功能\n\n消息监控功能使您能够搜索消息监听服务接收到的消息，查看消息详情，重新处理消息，以及根据需要从数据库中删除消息。参见图\
  \ 3-27。\n\n![A421506_1_En_3_Fig27_HTML.jpg](img/A421506_1_En_3_Fig27_HTML.jpg)\n\
  \n**图 3-27.** SAP MII 中的消息监控器\n\n## 消息服务：服务质量\n\n此功能可用于为工厂系统、SAP ERP 和 PI 中的客户端提供服务质量。消息可以通过两种方式处理。\n\
  \n### 仅一次（EO）\n\n仅一次处理模式确保每条消息仅被处理一次。对于 RFC 和 IDoc，具有相同事务 ID 的消息会被消息处理拒绝，然后该消息作为重复消息存储在\
  \ MII 系统中。\n\n对于 HTTP 消息，使用 `messageUID` 来确定消息 ID 是否重复。`messageUID` 可以在 URL 中传递，也可以使用\
  \ XPATH 创建。支持 EO 的完整 URL 如下所示：\n\n```\nhttp://<server>:<port>/XMII/Illuminator?service=WSMessageListener&mode=WSMessageListenerServer&NAME=<UniqueMessageName>&MESSAGEUID=<UniqueMessageUID>\n\
  ```\n\n### 按序仅一次（EOIO）\n\n按序仅一次处理模式在队列中按顺序仅处理一次消息。SAP MII 根据客户端或发送方系统发送消息的顺序来处理消息。\n\
  \n序列号与消息一起发送到 SAP MII。要以 EOIO 格式处理消息，必须支持 EO，即必须存在 `messageUID`。\n\n包含序列号和消息编号的完整\
  \ URL 是：\n\n```\nhttp://<server>:<port>/XMII/Illuminator?service=WSMessageListener&mode=WSMessageListenerServer&NAME=<UniqueMessageName>&MESSAGEUID=<UniqueMessageUID>&SEQUENCENAME=<SequenceName>&MESSAGENUMBER=<MessageNumber>\n\
  ```\n\n## 内容开发\n\n内容开发是 SAP MII 的主要功能，开发人员可借此开发 SAP MII 解决方案。菜单的此部分包含 SAP MII 的\
  \ IDE。本节将讨论此菜单的以下组件：\n\n- NWDI 配置\n- 工作台\n- 工具与存档\n- 自助服务组合环境\n\n### NWDI 配置\n\n\
  在“内容开发” ➤ “NWDI 配置”菜单中，指定 NWDI 中用于 SAP MII 开发对象的开发轨道名称。所有工作台项目都在同一开发轨道下，作为特定软件组件版本（SWCV）的开发组件（DC）创建。\n\
  \n开发轨道和 SWCV 在 NWDI 的 DTR 中创建，如图 3-28 所示。\n\n![A421506_1_En_3_Fig28_HTML.jpg](img/A421506_1_En_3_Fig28_HTML.jpg)\n\
  \n**图 3-28.** NWDI 配置说明\n\nNWDI 的 DTR 在数据库中对源文件提供版本化存储。作为 NWDI 的一部分，DTR 作为 AS Java\
  \ 上的服务运行。它无缝集成到所有开发流程中：作为开发人员，您可以使用 SAP NetWeaver Developer Studio 访问它，组件构建服务（CBS）直接从\
  \ DTR 检索源文件。DTR 中的对象主要在变更管理服务（CMS）中直接管理。\n\n为了能够开发自己的应用程序，开发人员需要在系统景观目录（SLD）中创建自己的软件组件（SC）。开发人员必须在开始开发软件之前完成此操作。软件组件是应用程序的标准交付单元。配置向导会在安装后创建一个默认\
  \ SC。如果需要不同的 SC，或者配置向导未执行此步骤，则系统管理员或质量经理会创建软件组件（SC）。\n\n在开发工作中，开发人员会向此 SC 添加新的开发组件。\n\
  \n开发组件（DC）是用于构建软件组件的可重用模块。DC 是一个命名容器，用于存放任意对象，例如 Java 源文件、JSP、字典定义、部署描述符等。这些包含的对象对其他组件不能直接可见，即\
  \ DC 作为一个黑盒运行。如果开发人员希望其中某些对象对外部可见，则必须显式定义“公共部分”。公共部分具有名称和用途，并包含一个名为实体的对象列表。\n\n\
  ### SAP MII 工作台\n\nSAP MII 工作台是一个用于开发和管理 SAP MII 开发对象的 IDE（集成开发环境）。\n\n在工作台中，可以在其各自的区域开发多个与\
  \ MII 相关的对象。您可以在工作台中开发以下对象：\n\n- BLS（业务逻辑服务）\n- 查询模板\n- 显示模板\n- MDO 对象\n- 网页\n\n\
  SAP MII 工作台包含几个区域。让我们浏览一下以便更好地理解。图 3-29 显示了完整的 SAP MII 工作台，并带有标注其诸多功能。\n\n![A421506_1_En_3_Fig29_HTML.jpg](img/A421506_1_En_3_Fig29_HTML.jpg)\n\
  \n**图 3-29.** SAP MII 工作台\n\n在 IDE 的顶部，有一个菜单栏，可让您在整个 IDE 中导航。除了该菜单外，“工具”下还有一些标准功能，例如全局变量声明和活动共享内存处理。\n\
  \n就在菜单栏下方，还有另一个工具栏。它帮助您创建新对象和模板，以及保存这些组件。除此之外，您还可以在开发过程中执行已开发的内容以进行完整性检查或单元测试。\n\
  \n在该工具栏下方，左侧有一个包含四个选项卡的区域。这实际上是开发组件的占位符。它显示开发组件的层次结构。\n\n第一个选项卡称为“目录”，可以在此保存业务逻辑、查询模板和显示模板信息。\n\
  \n第二个选项卡是“对象”，开发人员可以在其中为 MDO、KPI 和警报创建自己的对象。开发人员可以在此区域根据开发组件定义他们的对象模型和规范。\n\n第三个选项卡是“Web”。这是存储\
  \ Web 编码的地方，例如 HTML、IRPT、UI5、HTML5、JavaScript 和 CSS。除了 UI 组件外，txt、image、pdf 和 XML\
  \ 文件也可以存储在 Web 选项卡上。\n\n最后一个选项卡称为“元信息”。这是保存关键配置的地方，例如共享内存、项目特定的共享内存、角色等。换句话说，它存储项目的元数据。\n\
  \n在 SAP MII 服务器的左上侧，您会看到所有四个选项卡。在该服务器下方，基于某些预定义的层级维护着一个层次结构。在开始开发之前，需要在服务器下创建一个项目。此项目是唯一的占位符或逻辑容器，称为开发组件（DC），用于整个解决方案的开发元素。在\
  \ SAP MII 中，可以创建两种类型的项目——本地项目和共享项目。\n\n本地项目在本地创建和存储。不支持版本控制。\n\n如果 NWDI 连接到 SAP\
  \ MII，则可以创建共享项目。基本上，当在工作台中创建项目时，它将为已在 NetWeaver 中为特定 SAP MII 创建的软件组件创建一个 DC（开发组件）。\n\
  \n左下部分用于特定于对象的配置。仅当选择某些对象时，它才会填充。\n\n整个右侧部分用于解决方案建模。\n\n\n\n### 业务逻辑服务 (BLS)\n\n\
  业务逻辑服务在 `SAP MII` 中通常被称为 `BLS`，是一个用于定义、设计和开发制造逻辑的 IDE（集成开发环境）。一个 `BLS` 由多种操作块、网络服务、调度器、数据连接器、逻辑编辑器等组成。\n\
  \n`BLS` 事务类似于图形化建模且可执行的 `MII` 事务，并以 XML 格式存储在 `SAP MII` 中。内部的 `MII` 内容在运行时由 `BLS`\
  \ 引擎执行。参见图 3-30。\n\n![A421506_1_En_3_Fig30_HTML.jpg](img/A421506_1_En_3_Fig30_HTML.jpg)\n\
  \n图 3-30。SAP MII 中的业务逻辑服务\n\n这些功能共同提供了定义和运行与客户特定应用相关的业务逻辑所需的所有必要工具。`SAP MII 业务逻辑服务`\
  \ 广泛的功能意味着它可以应用于各种应用，包括：\n\n- 关键绩效指标（`KPI`）处理\n- 警报和事件生成\n- 数据抽取/转换/加载（`ETL`）\n\
  - 应用到应用的集成，包括双向 ERP 集成\n- 报告、图形和仪表板图像的动态内容交付\n- 对来自多个来源的数据进行复杂操作和转换\n- 关联和合并来自多个来源的数据\n\
  - 运营工作流\n- 自动化或手动数据采集\n- 生产执行：跟踪、路由和监控\n\n### 查询模板\n\n这是 `SAP MII` 中主要的数据查询组件。`SAP\
  \ MII 工作台` 提供了一些用于创建和管理数据查询的模板。通过配置这些模板，可以对在数据服务器部分配置的数据源进行检索、插入、删除和更新操作。查询模板可以在\
  \ `MII` 事务中使用；也可以直接从网页调用查询。\n\n以下是 `SAP MII` 支持的查询模板列表：\n\n- `AggregateQuery`\n\
  - `AlarmQuery`\n- `OLAPQuery`\n- `PCoQuery`\n- `MDOQuery`\n- `SQLQuery`\n- `TagQuery`\n\
  - `XacuteQuery`\n- `XMLQuery`\n- `CatalogQuery`\n- `KPIQuery`\n\n其中，最常用的查询是 `SQL\
  \ Query`、`MDO Query`、`PCo Query` 和 `Tag Query`，用于从除 `MDO` 之外的不同外部源系统中获取数据。`Xacute\
  \ Query` 和 `XML Query` 是用于内部查询的最常用选项。`Xacute Query` 用于在网页上调用事务。`XML Query` 用于处理来自事务的\
  \ XML 相关调用和 illuminator 服务调用。参见图 3-31。\n\n![A421506_1_En_3_Fig31_HTML.jpg](img/A421506_1_En_3_Fig31_HTML.jpg)\n\
  \n图 3-31。SAP MII 查询模板\n\n### MDO 对象\n\n制造数据对象（`MDO`）是 `SAP MII` 中新增的一层。它是 `SAP MII`\
  \ 中为数据采集引入的一个创新概念。`MDO` 在 `MII` 中充当永久或临时数据存储的角色。`MDO` 可以将任何数据对象放入其命名空间中。它主要使用 `SAP\
  \ MII` 标准数据库，即 `NetWeaver` 数据库来存储数据，因此在某种程度上，对于小规模项目来说，它是自定义数据库的一个良好替代品。当项目从一个系统迁移到另一个系统时，`MDO`\
  \ 具有保持相同结构和命名空间的灵活性。除了对象维护之外，`MDO` 还具有数据查询能力，可以从任何数据源层（从工厂到 ERP）检索、存储、更新和删除数据。参见图\
  \ 3-32。\n\n![A421506_1_En_3_Fig32_HTML.jpg](img/A421506_1_En_3_Fig32_HTML.jpg)\n\
  \n图 3-32。SAP MII MDO（制造数据对象）对象创建界面\n\n`SAP MII` 中有三种类型的 `MDO`。它们是：\n\n- `Persistent`（持久化）：用于永久存储和持久化数据。\n\
  - `On-Demand`（按需）：它是一种虚拟表，存在于执行实例期间。\n- `Joined`（联接）：这是两个持久化 `MDO` 的联接。\n\n## 可视化服务\n\
  \n可视化是指展示一组数据，以便能够以用户友好的方式轻松分析和研究数据点。通过各种报告、仪表板、交互式演示应用（移动端或网页端等），数据的呈现非常具有交互性和智能性。\n\
  \n与许多其他平台一样，`SAP MII` 允许用户创建可用于各种应用的仪表板对象和网页。\n\n对于 `SAP MII`，可视化服务分为 `动态页面生成器`\
  \ 和 `网页` 服务。\n\n### 动态页面生成器\n\n这用于创建基于 `SAP MII` 的 HTML 页面内容或图表 Servlet URL。这可以通过选择合适的显示模板和查询模板以及各种与尺寸和其他配置相关的属性来实现。\n\
  \n它包含了 `SAP MII` 中可用的各种显示模板组件，例如 `ichart`、`igrid`、`ispc` 等。对于新的 `UI5`，`SAP MII`\
  \ 中也提供了相应的显示模板，例如 `i5grid`、`i5chart` 等。\n\n### 网页\n\n该服务用于为各种客户特定的仪表板创建丰富、灵活、用户友好的用户界面。`SAP\
  \ MII` 中的网页生成支持多种 UI 技术，如 `IRPT`、`HTML`、`HTML5`、`UI5` 等，并支持多种脚本语言，如 `JavaScript`、`CSS`\
  \ 等。参见图 3-33。\n\n![A421506_1_En_3_Fig33_HTML.jpg](img/A421506_1_En_3_Fig33_HTML.jpg)\n\
  \n图 3-33。通过网页服务实现的 SAP MII 可视化\n\n## 动画图形\n\n动画对象是用于诸如数字驾驶舱或仪表板、标签生成、专用 UI 和报告组件等应用的定制化用户界面（UI）微件，您无需使用\
  \ applet 或其他控件即可使用它们。\n\n这些对象在 `SAP MII 工作台` 中创建，基于可缩放矢量图形（`SVG`），这是一种用于表示矢量图形的基于\
  \ XML 的格式。参见图 3-34。\n\n![A421506_1_En_3_Fig34_HTML.jpg](img/A421506_1_En_3_Fig34_HTML.jpg)\n\
  \n图 3-34。在 SAP MII 中使用动画图形的示例\n\n`SVG` 文件和动画对象使用 `SAP MII 工作台` 中 `业务逻辑事务` 下的 `SVG\
  \ 渲染器` 和 `动画渲染器` 操作转换为图像文件。\n\n\n\n### 自助式组合环境\n\n`SAP MII 自助式组合环境`是一款基于`SAP UI5`的工具，允许用户通过拖放`MII`对象来创建仪表盘。业务用户和技术用户均可使用。\n\
  \n`SSCE`在`SAP MII`中拥有强大的拖放环境，可使用任意`SAP MII`内容（`查询模板`、`显示模板`、`MDO`/`KPI`对象及资源文件）、`UI`元素以及来自`工厂信息目录`（`PIC`）的标签来创建仪表盘。来自`PIC`的已配置标签可放置在图像上。用户能够配置条件特定的颜色、图形和图标。此外，还可以使用`SSCE`的不同布局来创建显示画面。\n\
  \n创建的仪表盘提供`保存`选项以供后续使用。通过将已保存的内容添加到导航树中，还可以对仪表盘进行自定义。`SSCE`的重要组成部分之一是能够通过分配角色来保护仪表盘的安全。\n\
  \n`SAP MII 自助式组合环境`分为以下组件：\n\n- **我的仪表盘选项卡**：一个单一屏幕，用户可在其中找到所有仪表盘和导航链接。参见图 3-35。\n\
  \  ![A421506_1_En_3_Fig35_HTML.jpg](img/A421506_1_En_3_Fig35_HTML.jpg)\n  图 3-35.\
  \ `SSCE`中的“我的仪表盘”\n\n- **设计仪表盘选项卡**：登录用户可设计/创建仪表盘的屏幕，如图 3-36 所示。\n  ![A421506_1_En_3_Fig36_HTML.jpg](img/A421506_1_En_3_Fig36_HTML.jpg)\n\
  \  图 3-36. “设计仪表盘”界面及左侧工具栏\n\n- **左侧工具栏**：包含可触发`自助式组合环境`中所有操作的图标。参见图 3-36。\n\n-\
  \ **右侧窗格栏**：包含多个选项卡。第一个是`MII`对象，可集成任意`SAP MII`内容（如布局中的查询或显示模板）以创建仪表盘。第二个是`UI`元素，包含所有可用的\
  \ UI 设计控件，如`按钮`、`下拉菜单`、`文本框`、`单选按钮`、`复选框`等。您需要将其拖放到布局中以设计自己的仪表盘。同样，`PIC`和`剪贴板`用于嵌入`PIC`层级并引用仪表盘设计中使用的剪贴板内容。参见图\
  \ 3-37。\n  ![A421506_1_En_3_Fig37_HTML.jpg](img/A421506_1_En_3_Fig37_HTML.jpg)\n\
  \  图 3-37. “设计仪表盘”右侧菜单\n\n- **布局工具栏**：位于布局上方的工具栏包含一些操作，可在仪表盘中嵌入任意`MII`元素并需要更改基本配置时执行。参见图\
  \ 3-38。\n  ![A421506_1_En_3_Fig38_HTML.jpg](img/A421506_1_En_3_Fig38_HTML.jpg)\n\
  \  图 3-38. “设计仪表盘”中的布局栏\n\n"
- '# 总结


  在本章中，您详细了解了`SAP MII`的基本构建功能，包括其开发配置。在接下来的章节中，您将阅读到制造行业的功能概念及其相关领域。


  首先，下一章将讨论离散制造行业、该行业对`SAP MII`的需求，以及`SAP MII`如何为该行业提供解决方案。


