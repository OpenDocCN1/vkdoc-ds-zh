  trans: '

    # 主题与格式窗格


    主题本质上就是你通过 Power BI 格式窗格手动定义的格式集合。因此，你需要了解格式窗格是什么以及如何使用它来格式化仪表板对象。不过，我不会在本书中详细解释格式窗格的复杂性，关于如何手动格式化仪表板的完整细节，请参考我的另一本书
    *Pro Power BI Desktop*。


    尽管如此，仍有必要回顾一下格式窗格的核心元素，以及格式设置在通用层面的工作原理。


    本质上，格式化是一个由三个层次组成的层级结构：


    *   **视觉对象**（表格或图表——也可以是页面）。

    *   **元素**：这是你想要格式化的视觉对象的某个方面。它对应于 Power BI Desktop 中格式窗格的可展开部分（也称之为选项卡或卡片）。例如，图表的
    X 轴部分就是一个元素。

    *   **属性**（通常称为特性）：这是你定义的具体设置。例如，字体颜色。


    你可以在图 1-1 中（以堆积柱形图视觉对象为例）看到这一点，其中“数据标签”元素已展开，显示了可以为数据标签设置的所有可用属性。


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig1_HTML.jpg](img/511180_1_En_1_Fig1_HTML.jpg)


    图 1-1 格式窗格


    在创建主题文件时，牢记这个层级结构非常重要，因为整个 JSON 结构正是基于这种嵌套方式构建的——这将在第 3 章中进一步说明。


    # 编写 JSON 文件


    由于除了最简单的主题文件外，你都需要编写或修改实际的 JSON 文件，因此你需要选择一个工具来进行修改。由于 JSON 是一种基于文本的格式，有大量的工具可供选择。你可以完全自行选择一款称手的工具。我使用过的工具有：


    *   Notepad

    *   Notepad++

    *   Visual Studio

    *   Visual Studio Code

    *   在线 JSON 编辑器


    可用的工具多达几十种，选择哪款应用完全取决于你。我唯一的建议是，找到一款你用起来舒服、并且能平衡易用性和你所需强大功能的工具。最重要的是，它必须能够保存或导出文本文件。实际上，因为你可能会反复测试和修改你的选择，你选择的工具需要具备多级撤销和重做功能，以及强大的查找和替换能力。


    在为 Power BI 编写主题文件时，一个能够以易读格式显示 JSON 的工具是必不可少的。这是因为 Power BI Desktop 使用的 JSON
    结构可能非常复杂，因此能够看到文本的嵌套层级及其结构方式会大有帮助。不过，我不想讲得太超前，相关内容将在本书后面部分再提及。


    如果你还没决定好，我建议下载 Notepad++。这是一款免费的文本编辑器，能够以非常易读的格式显示 JSON。


    # 应用主题


    在探讨如何创建你自己的主题之前，最好先提醒你一下主题能够产生的深远影响。希望这能激励你学习更多知识，并鼓励你创建自己的主题文件。


    例如，以图 1-2 所示的一个非常简单的仪表板为例。（这是示例文件中的 `SampleDashboard.pbix` 文件）。


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig2_HTML.jpg](img/511180_1_En_1_Fig2_HTML.jpg)


    图 1-2 一个未格式化的仪表板


    这个仪表板完全是“普通样式”。也就是说，完全没有应用任何格式。试想一下，如果这个仪表板是一个 15 页的报告，而你需要让它不仅看起来赏心悦目，还要符合公司标准。在最坏的情况下，这可能需要耗费数小时。


    然而，你很幸运地拥有一个定义了所有公司标准的主题 JSON 文件。应用它，你只需要这么做：


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig3_HTML.jpg](img/511180_1_En_1_Fig3_HTML.jpg)


    图 1-3 主题文件导入成功


    1. 单击“视图”以激活“视图”功能区。

    2. 单击“主题”弹出菜单。

    3. 单击“浏览主题”。

    4. 导航到示例文件并选择主题文件（本例中为 `BaseTheme.json`）。

    5. 单击“打开”。几秒钟后，您将看到图 1-3 中的对话框。

    6. 单击“关闭”。


    就是这样！你的仪表板（每个页面上的每个对象）现在已瞬间完成格式化。结果如图 1-4 所示。


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig4_HTML.jpg](img/511180_1_En_1_Fig4_HTML.jpg)


    图 1-4 应用主题文件后的仪表板


    现在，你可以根据需要添加任何最终的格式设置，以在单个元素级别覆盖主题（毕竟，主题是节省时间的工具，而非束缚）。最终结果几乎是确定无疑的：你节省了大量添加视觉呈现细节的时间，并确保了你的仪表板符合统一的外观和风格。


    **注意**


    你在此示例中应用的主题文件，其目的并非展示仪表板设计的精妙之处，也非基于前沿的设计原则。相反，它的设计目的只是为了说明使用主题文件重新格式化整个仪表板是多么快速和简单。


    # 结论


    在本章中，你已经了解了主题究竟是什么以及它们可以有多么强大。现在，是时候继续前进，开始创建你自己的主题了。首先，我们将从使用 Power BI Desktop
    为你编写 JSON 开始——你将在下一章中发现这一点。

    '
- fmt: '# 2. Create and Customize a Theme in Power BI Desktop


    If you do not come from an IT background (or have never used JSON files before),
    and the thought of hand-crafting complex text structures fills you with dread,
    then now is the time to relax and breathe deeply, because it is ridiculously easy
    to define a simple yet powerful Power BI theme file *without writing or modifying
    a single line of code*.


    This is because Power BI Desktop allows you to specify (in a few clicks) a core
    subset of formatting attributes that will apply to your entire dashboard. Not
    only that, but once you have defined these attributes, Power BI Desktop will write
    the JSON theme file for you so that you can use it in other dashboards – or share
    with colleagues. All this is done using the *Customize current theme* option of
    the Themes button in the View menu.


    While this approach does not let you craft every precise formatting attribute
    of each individual type of visual, it does allow you to create a standard presentation
    style in a few minutes at most – and you can subsequently take this theme as a
    basis for further development. What is more, the resulting theme file is an excellent
    introduction to how JSON themes function in Power BI.


    Be aware, nonetheless, that creating themes using the Power BI Desktop interface
    does *not* allow you to attain the sophisticated levels of presentation that you
    can deliver using “hand-crafted” JSON. So it is best to consider the techniques
    that you will discover in this chapter both as a practical introduction to the
    subject of themes and also as an extremely fast way of developing simple style
    principles that can be applied to entire dashboards.


    To provide a little structure to the process, this “interactive theme generation”
    directly inside Power BI Desktop breaks down the theme elements that you can alter
    into the following five categories:


    * *Name and colors*: Where you can give your theme a name and specify the color
    palette and key colors to use in a dashboard

    * *Text*: Where you can define core text attributes such as font, size, and color
    for various elements in a dashboard

    * *Visuals*: Where you can specify key common attributes of all visuals

    * *Page*: Where you can set basic attributes of the dashboard pages

    * *Filter pane*: That allows you to specify the way that the filter pane appears


    You do not have to specify every option that Power BI Desktop makes available
    in the Customize current theme dialogs. You can change a couple of options – or
    reset everything that is available (and all steps in between).


    ## Creating a Simple Theme


    To get you started, let’s create a very simple JSON theme file that alters a few
    of the colors in the color palette that Power BI Desktop uses for color selection.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig1_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    The Themes popup


    1. Activate the View menu.

    2. Click the popup for the Themes. You will see something like the options shown
    in Figure [2-1](#511180_1_En_2_Chapter.xhtml#Fig1).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig2_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    The Customize theme dialog


    1. Click Customize current theme. The dialog shown in Figure [2-2](#511180_1_En_2_Chapter.xhtml#Fig2)
    will appear.

    2. Select different colors for the first few Theme colors in the dialog (these
    correspond to the colors in the standard Power BI color palette, from left to
    right starting at the third column). It is worth noting that you cannot alter
    the first two (monochrome) colors in the color palette.

    3. Click Apply. The selected colors will be applied to the current dashboard.

    4. Click View ➤ Themes ➤ Save current theme. The Save As dialog will appear.

    5. Browse to a suitable directory and enter a name for the theme file. This file
    *must* have the extension `.json`.

    6. Click Save.


    That is it! You now have a fully functioning JSON theme file that you can apply
    to other dashboards. You can see the effect of the theme simply by displaying
    the Color popup for any element in a dashboard where this theme file has been
    applied. You will see that the top row of the available colors has changed to
    display the colors that you selected in step 4 earlier (well, for all but the
    first two colors which will always remain white and black).


    The choices that you just made are, fortunately, not set in stone. So you can
    alter the theme settings at any time by repeating the process that you just applied
    and selecting any of the available options and resaving the theme file.


    Note


    When you resave a theme file, Power BI Desktop does **not** remember the name
    that you last used and will default to `Theme.json`. Remember to select the previous
    file name before clicking Save if you want to update the existing file. You will,
    of course, have to confirm that you wish to overwrite the existing file.'
