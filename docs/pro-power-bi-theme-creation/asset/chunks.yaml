- fmt: '# Shape Map


    The final map type that you can pre-format is the shape map. The styling attributes
    of this map are largely different to those for the two previous maps that you
    have just seen. It introduces two new keywords: `shape` and `zoom`.


    The keyword that specifies the formatting attributes of a shape map is `shapeMap`.


    Table [10-10](#511180_1_En_10_Chapter.xhtml#Tab10) outlines the JSON keyword that
    you can use in shape map formatting and its corresponding section in the Power
    BI Desktop format pane.


    **Table 10-10** Shape Map Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `dataPoint` | Data colors |

    | `shape` | Shape |

    | `zoom` | Zoom |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    You can find the JSON code for this in the sample file `Attributes_ShapeMap.json`.


    The following code snippet provides the JSON code used to pre-format a shape map:


    ```

    "shapeMap":

    {"*":

    {

    "general": [{... code not shown ...}]

    "dataPoint": [{

    "defaultCategoryColor": { "solid": { "color": "#12239E"}},

    "showAllDataPoints": true

    }],

    "shape": [{

    "type": "uk.countries.topo",

    "projectionEnum": "mercator"

    }],

    "zoom": [{

    "autoZoom": true,

    "selectionZoom": true,

    "manualZoom": true

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    Map controls elements are described in Table [10-4](#511180_1_En_10_Chapter.xhtml#Tab4).


    The `projection` keyword in the JSON that is used in the shape section needs one
    of the attributes shown in Table [10-11](#511180_1_En_10_Chapter.xhtml#Tab11).


    **Table 10-11** Projection Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `orthographic` | Orthographic |

    | `mercator` | Mercator |

    | `equirectangular` | Equirectangular |


    The `map` keyword in the JSON that is used in the shape section needs one of the
    attributes shown in Table [10-12](#511180_1_En_10_Chapter.xhtml#Tab12).


    **Table 10-12** Legend Position Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `australia.states.topo` | Australia:states |

    | `austria.states.topo` | Austria:states |

    | `brazil.states.topo` | Brazil:states |

    | `canada.provinces.topo` | Canada:provinces |

    | `france.regions.topo` | France:regions |

    | `germany.states.topo` | Germany:states |

    | `ireland.counties.topo` | Ireland:counties |

    | `italy.regions.topo` | Italy:regions |

    | `mexico.states.topo` | Mexico:states |

    | `netherlands.provinces.topo` | Netherlands:provinces |

    | `uk.countries.topo` | Uk:countries |

    | `usa.states.topo` | usa:states |


    The `zoom` keyword that describes the zoom section uses the keywords shown in
    Table [10-13](#511180_1_En_10_Chapter.xhtml#Tab13).


    **Table 10-13** Keyword Mapping for the Zoom Section


    | Element | Keyword |

    | --- | --- |

    | Auto zoom | `autoZoom` |

    | Selection zoom | `selectionZoom` |

    | Manual zoom | `manualZoom` |


    ## Conclusion


    In this short chapter, you saw how to create the JSON for the map, filled map,
    and shape map visuals. They use fairly simple JSON (assuming that you are used
    to theme file creation) but nonetheless allow you to define the essential aspects
    of map visual formatting.


    # 11. Miscellaneous Visual Styles


    There is a group of visual types that are not text based, charts, or maps. I have
    gathered this collection of visuals together in a single chapter to explain the
    JSON they use in a theme file. These visuals are:


    *   Gauge

    *   Python visual

    *   R script visual

    *   Key influencers visual

    *   Decomposition tree visual

    *   KPI


    Each of the visuals discussed in this chapter has a separate JSON file in the
    samples folder that contains the code that you can use to define your own theme
    files.


    Admittedly, this collection of visuals is somewhat eclectic as they have little
    in common. Let’s take a look at them.


    ## Gauge


    The appearance of a Power BI gauge visual can be standardized using a theme file.
    The keyword that specifies the formatting attributes of a gauge is `gauge`.


    Table [11-1](#511180_1_En_11_Chapter.xhtml#Tab1) outlines the JSON keywords that
    you can use in gauge formatting and the section that corresponds to each keyword
    in the Power BI Desktop format pane.


    **Table 11-1** Gauge Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `datapoint` | Data colors |

    | `labels` | Data labels |

    | `target` | Target |

    | `calloutValue` | Callout value |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet provides the JSON code used to pre-format a gauge:


    ```

    "gauge":

    {"*":

    {

    "general":  [{"responsive": true }],

    "dataPoint":  [{

    "fill": {"solid": {"color": "#E34B20"}},

    "target": {"solid": {"color": "#E2EB00"}}

    }],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#615E55"}},

    "labelDisplayUnits": 0,

    "labelPrecision": 0,

    "fontSize": 8,

    "fontFamily": "Arial"

    }],

    "target": [{

    "show": true,

    "color": {"solid": {"color": "#E34B20"}},

    "labelDisplayUnits": 0,

    "labelPrecision": 0,

    "fontSize": 8

    "fontFamily": "Arial",

    }],

    "calloutValue": [{

    "show": true,

    "color": {"solid": {"color": "#F5F4F0"}},

    "labelDisplayUnits": 0,

    "labelPrecision": 0

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `dataPoint` keyword that describes the data colors section uses the keywords
    shown in Table [11-2](#511180_1_En_11_Chapter.xhtml#Tab2).


    **Table 11-2** Keyword Mapping for the Data Colors Section


    | Element | Keyword |

    | --- | --- |

    | Fill | `fill` |

    | Target | `target` |


    The `labels` keyword that describes the data labels section uses the keywords
    shown in Table [11-3](#511180_1_En_11_Chapter.xhtml#Tab3).


    **Table 11-3** Keyword Mapping for the Data Labels Section


    | Element | Keyword |

    | --- | --- |

    | Data labels | `show` |

    | Color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |


    The `target` keyword that describes the target section uses the keywords shown
    in Table [11-4](#511180_1_En_11_Chapter.xhtml#Tab4).


    **Table 11-4** Keyword Mapping for the Target Section


    | Element | Keyword |

    | --- | --- |

    | Target | `show` |

    | color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |


    The `calloutValue` keyword that describes the callout value section uses the keywords
    shown in Table [11-5](#511180_1_En_11_Chapter.xhtml#Tab5).


    **Table 11-5** Keyword Mapping for the Callout Value Section


    | Element | Keyword |

    | --- | --- |

    | Callout value | `show` |

    | Color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |


    Label and target display unit elements are described in Table [7-11](#511180_1_En_7_Chapter.xhtml#Tab11).


    You can find the JSON code for this in the sample file `Attributes_Gauge.json`.'
