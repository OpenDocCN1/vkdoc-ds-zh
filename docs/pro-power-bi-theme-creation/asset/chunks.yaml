- fmt: '# Scatter Chart


    The keyword that specifies the formatting attributes of a scatter chart is `scatterChart`.


    Table [8-8](#511180_1_En_8_Chapter.xhtml#Tab8) outlines the JSON keywords that
    you can use in scatter chart formatting and the section that corresponds to each
    keyword in the Power BI Desktop format pane.


    **Table 8-8** Scatter Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X Axis |

    | `valueAxis` | Y Axis |

    | `bubbles` | Shapes |

    | `categoryLabels` | Category labels |

    | `colorBorder` | Color border |

    | `plotArea` | Plot area |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following is the JSON that describes the formatting of a scatter chart:


    ```

    "scatterChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "axisScale": "Linear",

    "start": null,

    "end": null,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "concatenateLabels": true,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": true,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid",

    "treatNullsAsZero": true

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelPrecision": 0,

    "labelDisplayUnits": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid",

    "treatNullsAsZero": true

    }],

    "bubbles": [{

    "bubbleSize": 15,

    "markerShape": "square",

    "customizeSeries": true

    }],

    "categoryLabels": [{

    "show": true,

    "fontColor": { "solid": { "color": "#000000"}},

    "fontSize": 11,

    "fontFamily": "Arial",

    "enableBackground": true,

    "backgroundColor": { "solid": { "color": "#949494"}},

    "backgroundTransparency": 25

    }],

    "colorBorder": [{

    "show": true

    }],

    "plotArea": [{... code not shown ...}],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    Legend keywords are given in Table [7-2](#511180_1_En_7_Chapter.xhtml#Tab2).


    The `categoryAxis` keyword that describes the X axis section uses the keywords
    shown in Table [8-9](#511180_1_En_8_Chapter.xhtml#Tab9).


    **Table 8-9** Keyword Mapping for the X Axis


    | Element | Keyword |

    | --- | --- |

    | X axis | `show` |

    | Scale type | `axisScale` |

    | Start | `start` |

    | End | `end` |

    | Color | `labelColor` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Title | `showAxisTitle` |

    | Gridlines | `gridLineShow` |

    | (Gridline) Color | `gridLineColor` |

    | Stroke width | `gridLineThickness` |

    | Line style | `gridlineStyle` |

    | Show blank values | `treatNullsAsZero` |


    The `valueAxis` keyword that describes the Y axis section uses the keywords shown
    in Table [8-10](#511180_1_En_8_Chapter.xhtml#Tab10).


    **Table 8-10** Keyword Mapping for the Y Axis


    | Element | Keyword |

    | --- | --- |

    | Y axis | `show` |

    | Position | `position` |

    | Scale type | `axisScale` |

    | Start | `start` |

    | End | `end` |

    | Color | `labelColor` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Title | `showAxisTitle` |

    | Style | `axisStyle` |

    | Title color | `color` |

    | Axis title | `titleText` |

    | Title text size | `titleFontSize` |

    | (Title) Font family | `titleFontFamily` |

    | Gridlines | `gridLineShow` |

    | (Gridline) Color | `gridLineColor` |

    | Stroke width | `gridLineThickness` |

    | Line style | `gridlineStyle` |

    | Show blank values | `treatNullsAsZero` |


    Zoom keywords are given in Table [7-5](#511180_1_En_7_Chapter.xhtml#Tab5).


    Labels keywords are given in Table [7-6](#511180_1_En_7_Chapter.xhtml#Tab6).


    The `bubbles` keyword that describes the shapes section uses the keywords shown
    in Table [8-11](#511180_1_En_8_Chapter.xhtml#Tab11).


    **Table 8-11** Keyword Mapping for the Shapes


    | Element | Keyword |

    | --- | --- |

    | Shapes | `show` |

    | Size | `bubbleSize` |

    | Marker shape | `markerShape` |


    The `markerShape` keyword in the JSON that defines the marker shape in the shapes
    section needs one of the attributes shown in Table [8-12](#511180_1_En_8_Chapter.xhtml#Tab12).


    **Table 8-12** Marker Shape Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Circle` | • (circle) |

    | `Square` | ■ (square) |

    | `Diamond` | ◆ (diamond) |

    | `Triangle` | (triangle) |


    Plot area keywords are given in Table [7-8](#511180_1_En_7_Chapter.xhtml#Tab8).


    The color border section only contains the `show` keyword.


    You can find the JSON code for this in the sample file `Attributes_ScatterChart.json`.


    # Conclusion


    This chapter introduced to you six chart types: 100% stacked bar chart, 100% stacked
    column chart, stacked area chart, line and stacked column chart, line and clustered
    column chart, and scatter chart.


    They are all built on chart styles (and JSON code) that you saw in the previous
    chapter and extend your knowledge to enable you to create theme files that can
    define chart formatting for all the classic data-driven chart types.


    To conclude your tour of JSON formatting for charts, the next chapter will explore
    the remaining Power BI chart types that you can add to your theme files.


    # 9. Other Chart Visual Styles


    To complete your tour of theme file chart formatting, you need to examine the
    JSON for a final set of chart types. These are


    - Pie

    - Donut

    - Treemap

    - Waterfall

    - Funnel

    - Ribbon chart


    All of these are less complex than some of the charts that you have seen so far
    – considerably less so in some cases. Nevertheless, there are some new keywords
    that you will discover in this chapter that are specific to the JSON that describes
    the formatting of these chart types.


    All the chart types discussed in this chapter have a separate JSON file in the
    samples folder that is available for download. Each file is self-contained and
    can be used to format the relevant chart type.'
