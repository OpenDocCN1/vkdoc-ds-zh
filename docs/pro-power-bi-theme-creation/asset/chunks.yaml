    | --- | --- |

    | Y axis (Y axis column) | `show` |

    | (Y axis column) | `position` |

    | Scale type (Y axis column) | `axisScale` |

    | Start (Y axis column) | `start` |

    | End (Y axis column) | `end` |

    | Color (Y axis column) | `labelColor` |

