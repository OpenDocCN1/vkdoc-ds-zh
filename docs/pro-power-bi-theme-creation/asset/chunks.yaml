- fmt: '# Style Hierarchy


    The first thing to remember is that you can define presentation elements at four
    possible levels. These are:


    - Element level

    - Text class

    - Generic visual style

    - Specific visual style


    There is a strict hierarchy in this approach. That is, any specification set at
    the element level will remain valid until overwritten by a text class. Text classes
    can be further refined by defining settings for a generic visual style which,
    in turn, can be redefined as part of a specific visual style.


    This cascading style approach is possible because the style hierarchy progresses
    from the wide-ranging to the highly restrictive. If you remember from Chapter
    [2](#511180_1_En_2_Chapter.xhtml), defining a first-level element covers a range
    of visual attributes. In Chapter [3](#511180_1_En_3_Chapter.xhtml), you saw that
    text classes are more focused – and this continues right down to the detailed
    definition of one aspect of a specific visual.


    However, you need to be aware that the hierarchy is not always complete. By this
    I mean that not everything can be set at the element level (there are many aspects
    of visual formatting that are not covered by the element options). Equally, text
    classes do not cover all aspects of formatting – and there is some overlap between
    these two levels.


    As with all facets of theme file creation, this is best appreciated with an example.


    Take, for instance, the totals that you can format in a table. These can be defined
    (in whole or in part) at three of the four levels described earlier. Table 13-1
    describes this.


    **Table 13-1** Column Header Formatting


    | Level                | Definition          |

    |----------------------|---------------------|

    | Text class           | Label               |

    | Generic visual style | Total               |

    | Specific visual style | tableEx             |


    The `textClasses` section lets you specify a `label` element. This covers (among
    other things) totals in tables and matrices. If you specify a font size and color
    here, it will set (among other things) the color of the totals used in tables
    and matrices.


    You can then choose to set a few more specific elements (such as the font color
    and size) at the level of generic definitions in a theme file. This is done using
    the `total` keyword and the relevant elements. This will set totals wherever this
    keyword is used in visuals, which means the table and matrix visuals, and will
    override anything (including, in this example, the font size and color) set using
    text classes. It will *not*, however, override any other elements that are set
    using the `label` text class.


    Finally, you can set formatting that applies only to table visuals. You saw this
    in Chapter [6](#511180_1_En_6_Chapter.xhtml). Any specifics here will override
    the generic formatting for totals – but *only in tables, not in matrices*.


    Figure 13-1 shows this more visually.


    ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig1_HTML.png](images/511180_1_En_13_Chapter/511180_1_En_13_Fig1_HTML.png)


    **Figure 13-1** Style hierarchy


    You can see in Figure 13-1 that the colors are set three times:


    - `FFFF00` (yellow) at the text class level

    - `F5F4F0` (orange) at the generic level for totals of tables and matrices

    - `6B007B` (purple) for table totals


    You will also note that the font size is set three times:


    - 9 point at the text class level

    - 10 point at the generic level for totals of tables and matrices

    - 12 point (black) for table totals


    Totals for tables and matrices are set by the `label` text class. This also sets
    the font face and size for totals in tables and matrices as well as for other
    elements (the full list is also available in Chapter [2](#511180_1_En_2_Chapter.xhtml)).


    Totals for tables and matrices are then *overridden* – as well as having other
    aspects of their presentation defined – as part of the generic style definition
    (remember this is nested inside an asterisk object and not a specific visual object).


    Finally, totals for tables (but not matrices) are defined as you saw explained
    in Chapter [6](#511180_1_En_6_Chapter.xhtml). This takes place at the deepest,
    most detailed level.


    You may well be asking what this means in practice. So let’s take a look at the
    effects produced by applying progressively more detailed formatting that you can
    see in the JSON theme file `CascadingText.json`.


    To begin with, here is the JSON that only applies a text class – `label` in this
    instance. This class sets the formatting for the totals in tables and matrices,
    as you can see in Figure 13-2, where the totals are yellow and 9 point.


    ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig2_HTML.jpg](images/511180_1_En_13_Chapter/511180_1_En_13_Fig2_HTML.jpg)


    **Figure 13-2** Applying a text class


    In Figure 13-3, the JSON is augmented by adding a generic style for `total`. This
    has the effect of overriding the font attributes that are set by the text class.
    You can see this in Figure 13-4 where the totals are orange and 10 point.


    ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig3_HTML.jpg](images/511180_1_En_13_Chapter/511180_1_En_13_Fig3_HTML.jpg)


    **Figure 13-3** Applying a generic style


    It is worth noting, however, that any other attributes set by the text class are
    not affected by the generic style definition.


    Finally, we can apply the full JSON that was shown previously in Figure 13-1.
    This overrides the formatting of totals – but only for *tables*, and *not for
    matrices*. You can see this in Figure 13-4 where the totals are purple and 12
    point for the *table only*.


    ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig4_HTML.jpg](images/511180_1_En_13_Chapter/511180_1_En_13_Fig4_HTML.jpg)


    **Figure 13-4** Applying a specific style


    Defining a structured theme file that mixes formatting at multiple levels can
    be a considerable investment in time and effort. However, the up-front investment
    certainly makes theme updates much easier and considerably faster. This is because
    you can often reset a swathe of attributes for multiple visuals with a single
    change at the level of generic formatting – while leaving highly specific formatting
    of certain visuals as is. This can also ensure a high level of presentational
    conformity in your dashboards.


    Should you decide to adopt this way of creating theme files, I have a few suggestions
    that you may find useful in practice:


    - Concentrate on the generic level of theme definition – and even disregard text
    classes altogether. This approach lets you define standardized attributes in a
    clear way that is easy to understand and review.

    - Only apply attributes at one level unless you are deliberately adding an override
    at a lower level for a specific visual. In other words, avoid duplication.

    - Only apply the elements that you really need to define globally at the generic
    level. There is no point in setting everything you can and then overriding most
    of it at the level of specific visuals.

    - When defining generic formatting, there is often little point in setting every
    attribute for an element. Here again, only apply the attributes that you need
    to set globally.'
