- fmt: '# Clustered Column Chart


    The JSON that specifies clustered column chart formatting is very similar to the
    code that you saw earlier for a stacked column chart – except for the initial
    keyword for the JSON object, of course. This is `clusteredColumnChart`.


    The key differences are:


    - It does *not* contain a `totals` section.

    - The `labelOrientation` keyword has been added to the `labels` section.


    Table 7-18 outlines the JSON keywords that you can use in stacked bar chart formatting
    and the section that corresponds to each keyword in the Power BI Desktop format
    pane.


    **Table 7-18** Clustered Column Chart Keywords

    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X Axis |

    | `valueAxis` | Y Axis |

    | `zoom` | Zoom slider |

    | `labels` | Data labels |

    | `plotArea` | Plot area |

    | `title` | Title |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet provides the JSON code used to pre-format a clustered
    column chart:


    ```

    "clusteredColumnChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "concatenateLabels": true,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelPrecision": 0,

    "labelDisplayUnits": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowUnitOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "zoom: [{... code not shown ...}],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#ffffff"}},

    "labelDisplayUnits": 1,

    "labelPrecision": 2,

    "labelOrientation": 1,

    "labelPosition": "InsideEnd",

    "labelOverflow": true,

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 0

    }],

    "plotArea": [{... code not shown ...}],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `labelOrientation` keyword in the JSON that sets label orientation (in the
    `labels` section) needs one of the attributes shown in Table 7-19 to be supplied.


    **Table 7-19** Label Display Units Options

    | Value | Formatting Popup Option |

    | --- | --- |

    | `vertical` | 0 |

    | `horizontal` | 1 |


    **Note:** The clustered column chart uses `0` and `1` instead of `horizontal`
    and `vertical` as keywords – unlike the stacked column chart. Also, these are
    numeric values and so must not be enclosed in double quotes.


    It is worth noting that the JSON for a clustered column chart also has options
    (as for clustered bar chart) to choose the category and value axis style.


    The JSON code for a clustered column chart is available in the sample file `Attributes_ClusteredColumnChart.json`.


    Legend keywords are given in Table 7-2.


    Categories keywords are given in Table 7-3.


    Values keywords are given in Table 7-4.


    Zoom keywords are given in Table 7-5. For a column chart, the `showOnValueAxis`
    refers to the Y axis.


    Labels keywords are given in Table 7-6.


    Totals keywords are given in Table 7-7.


    Plot area keywords are given in Table 7-8.


    Tooltip keywords are given in Table 6-5.


    Legend position options are described in Table 7-9.


    Category axis position options are described in Table 7-10.


    Value axis display units options are described in Table 7-11.


    Value axis style options are described in Table 7-16.


    Value axis gridline style options are described in Table 7-13.


    Label position options are described in Table 7-12.


    # Line Chart


    Although they look very different to bar and column charts, the formatting aspects
    of line charts are really quite similar to all the chart types that you have seen
    so far in this chapter.


    The key differences that you will find in the JSON for a line chart – as compared
    to bar and column charts – are:


    - The line chart contains JSON to describe a secondary axis.

    - The legend contains a few additional elements.

    - There are slight differences in the X (category) axis.

    - The minimum category width still uses the keyword `preferredCategoryWidth`.

    - The maximum size still uses the keyword `maxMarginFactor`.

    - There is an additional element to describe line styles – introduced by the `lineStyles`
    keyword.

    - The `labels` section contains a `labelPosition` element – but the values are
    different to those you have seen for other charts.


    The keyword that specifies the formatting attributes of a line chart is `lineChart`.


    Table 7-20 outlines the JSON keywords that you can use in line chart formatting
    and the section that corresponds to each keyword in the Power BI Desktop format
    pane.


    **Table 7-20** Line Chart Keywords

    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X Axis |

    | `valueAxis` | Y Axis |

    | `zoom` | Zoom slider |

    | `labels` | Data labels |

    | `lineStyles` | Shapes |

    | `plotArea` | Plot area |

    | `title` | Title |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The JSON code to describe the formatting attributes of a line chart is in the
    sample file `Attributes_LineChart.json`. The code snippet is given as follows.
    It is, be warned, a fairly long piece of JSON.'
