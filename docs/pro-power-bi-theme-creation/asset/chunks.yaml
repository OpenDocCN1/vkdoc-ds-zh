    然而，创建和修改 JSON 主题文件的技巧和科学始终在于：找到哪个 JSON 关键字映射到哪个 Power BI 格式属性，以及可以使用哪些值来定义此属性应如何作为标准被定义。


    现在你已经了解了许多核心元素，是时候继续查看不同的视觉对象组了，从卡片和表格视觉对象类型开始。下一章将介绍这些内容。

