- fmt: '# 7. Classic Chart Visual Styles


    Charts are a set of visuals that share many common formatting elements. So it
    makes sense, I feel, to look at them together. This will help your understanding
    of the shared aspects of these charts and also makes it easier to comprehend the
    more complex JSON that is used in some of the more advanced charts.


    The charts that I want to look at in this chapter are:


    - Stacked bar chart

    - Stacked column chart

    - Clustered bar chart

    - Clustered column chart

    - Line chart

    - Area chart


    This is quite a collection of visuals to learn about. Fortunately, however, the
    clear majority of their attributes are common to most (if not all) of these chart
    types. This means that once you have learned the basic ways that formatting attributes
    are applied to the initial charts, you can apply the same code and the same knowledge
    to most of them. The added advantage of these core similarities is that it allows
    us to focus only on the differences between chart types in the JSON snippets that
    you will examine later in this chapter.


    Each chart type discussed in this chapter has a separate JSON file in the samples
    folder that contains the code that you can use to customize your own theme files.


    ## Stacked Bar Chart


    The first point of note is that although the Power BI Desktop interface calls
    this a stacked bar chart (if you hover the pointer over the first icon in the
    Visualizations pane, this is what the popup calls it) in the theme file, it is
    called a `barChart`. This means that the keyword to remember is `barChart` as
    this is the keyword that introduces the JSON object that specifies stacked bar
    chart formatting.


    Table 7-1 outlines the JSON keywords that you can use in stacked bar chart formatting
    and the section that corresponds to each keyword in the Power BI Desktop format
    pane.


    **Table 7-1** Stacked Bar Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | Y Axis |

    | `valueAxis` | X Axis |

    | `zoom` | Zoom slider |

    | `labels` | Data labels |

    | `totals` | Total labels |

    | `plotArea` | Plot area |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The sample file `Attributes_StackedBarChart.json` contains the complete specification
    of stacked bar chart JSON formatting. You can see the formatting attributes that
    are specific to this type of chart in the following code snippet:


    ```json

    "barChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{

    "show": true,

    "position": "Top",

    "showTitle": true,

    "titleText": "Add a legend title",

    "legendColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8

    }],

    "categoryAxis": [{

    "show": true,

    "position": "Left",

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "axisScale": "Linear",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelDisplayUnits": 0,

    "labelPrecision": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "zoom":[{

    "show":true,

    "showOnValueAxis" : false,

    "showLabels":true,

    "showTooltip":true

    }],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#ffffff"}},

    "labelDisplayUnits": 1,

    "labelPrecision": 2,

    "labelPosition": "InsideEnd",

    "labelOverflow": true,

    "fontSize": 7,

    "fontFamily": "Arial",

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 0

    }],

    "totals": [{

    "show": true,

    "color": {"solid": {"color": "#FFFFFF"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 2,

    "fontSize": 8,

    "fontFamily": "Arial",

    "enableBackground": true,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 10,

    "showPositiveAndNegative": true

    }],

    "plotArea": [{

    "transparency": 0,

    "scaling": "Fill"

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    This is quite a lot of JSON code, but it does conform to the structure that you
    saw in the previous two chapters. In any case, I have made the JSON follow the
    ordering of elements in the Power BI Desktop formatting pane to allow for easier
    correlation between the JSON specification and what you see in Power BI Desktop.


    There are a few comments that I need to make here:


    - The vertical (Y) axis in this chart is the category axis (so the horizontal
    (X) axis is the value axis) in the JSON.'
