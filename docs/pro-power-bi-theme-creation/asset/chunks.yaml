    | Background color | `backgroundColor` |

    | Transparency | `transparency` |


    The `bubbles` keyword that describes the bubbles section uses the keywords shown
    in Table 10-3.


    **Table 10-3** Keyword Mapping for the Bubbles Section


    | Element | Keyword |

    | --- | --- |

    | Size | `bubbleSize` |


