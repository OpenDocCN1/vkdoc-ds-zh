  trans: '

    # 饼图


    饼图无疑是一种较为简单的图表——因此，它对应着一个同样简洁的 JSON 主题文件。


    指定饼图格式属性的关键字是 `pieChart`。


    表 9-1 概述了可用于饼图格式的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的部分。


    | 关键字 | 格式部分 |

    | --- | --- |

    | `general` | 常规 |

    | `legend` | 图例 |

    | `labels` | 详细标签 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    你可以在示例文件 `Attributes_PieChart.json` 中找到相应的 JSON 代码。


    以下代码片段提供了用于预格式化饼图的 JSON 代码：


    ```

    "pieChart":

    {"*":

    {

    "general": [{... 代码未显示 ...}]

    "legend": [{... 代码未显示 ...}],

    "labels": [{

    "show": true,

    "labelStyle": "All detail labels",

    "color": {"solid": {"color": "#000000"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 1,

    "percentageLabelPrecision": 1,

    "fontSize": 8,

    "fontFamily": "Arial",

    "position": "preferInside",

    "overflow": true,

    "background": "off"

    }],

    "title": [{... 代码未显示 ...}],

    "background": [{... 代码未显示 ...}],

    "lockAspect": [{... 代码未显示 ...}],

    "border": [{... 代码未显示 ...}],

    "dropShadow": [{... 代码未显示 ...}],

    "visualTooltip": [{... 代码未显示 ...}],

    "visualHeader": [{... 代码未显示 ...}]

    }

    }

    ```


    图例关键字见表 7-2。


    描述详细标签部分的 `labels` 关键字使用了表 9-2 中所示的关键字。


    | 元素 | 关键字 |

    | --- | --- |

    | 详细标签 | `show` |

    | 标签样式 | `labelStyle` |

    | 颜色 | `color` |

    | 显示单位 | `labelDisplayUnits` |

    | 值小数位数 | `labelPrecision` |

    | % 小数位数 | `percentageLabelPrecision` |

    | 文本大小 | `fontSize` |

    | 字体系列 | `fontFamily` |

    | 标签位置 | `position` |

    | 溢出文本 | `overflow` |

    | 背景 | `background` |


    在饼图或环形图中定义标签样式的 JSON 中的 `labelStyle` 关键字需要表 9-3 中所示的属性之一。


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `Category` | 类别 |

    | `DataValue` | 数据值 |

    | `Percent of total` | 占总数的百分比 |

    | `Category, data value` | 类别，数据值 |

    | `Category, percent of total` | 类别，占总数的百分比 |

    | `Data value, percent of total` | 数据值，占总数的百分比 |

    | `All detail labels` | 所有详细标签 |


    **注意：** 与主题文件中的常见做法略有不同的是，用于指定标签样式选项的值包含空格和标点符号。


    在饼图或环形图中定义标签位置的 JSON 中的 `position` 关键字需要表 9-4 中所示的属性之一。


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `outside` | 外部 |

    | `inside` | 内部 |

    | `preferOutside` | 首选外部 |

    | `preferInside` | 首选内部 |


    **注意：** 有趣的是，用于指定标签位置选项的值必须采用驼峰式大小写。


    在饼图或环形图中（在标签部分中）定义背景的 JSON 中的 `background` 关键字需要表 9-5 中所示的属性之一。


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `on` | 开 |

    | `off` | 关 |


    图例位置选项见表 7-9。


    标签显示单位选项见表 7-11。


    # 环形图


    就格式化而言，环形图与饼图几乎完全相同。然而，它有一个额外的功能。这就是你可以在下面给出的 JSON 中看到的 `slices` 关键字定义的 `inner
    radius`（内半径）。


    指定散点图格式属性的关键字是 `donutChart`。


    表 9-6 概述了可用于环形图格式的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的部分。


    | 关键字 | 格式部分 |

    | --- | --- |

    | `general` | 常规 |

    | `legend` | 图例 |

    | `slices` | 形状 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    以下代码片段提供了用于预格式化环形图的 JSON 代码：


    ```

    "donutChart":

    {"*":

    {

    "general": [{... 代码未显示 ...}]

    "legend": [{... 代码未显示 ...}],

    "labels": [{

    "show": true,

    "labelStyle": "All detail labels",

    "color": {"solid": {"color": "#000000"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 1,

    "fontFamily": "Arial",

    "fontSize": 8,

    "position": "preferInside"

    }],

    "slices": [{

    "innerRadiusRatio": 20

    }],

    "title": [{... 代码未显示 ...}],

    "background": [{... 代码未显示 ...}],

    "lockAspect": [{... 代码未显示 ...}],

    "border": [{... 代码未显示 ...}],

    "dropShadow": [{... 代码未显示 ...}],

    "visualTooltip": [{... 代码未显示 ...}],

    "visualHeader": [{... 代码未显示 ...}]

    }

    }

    ```


    图例关键字见表 7-2。


    用于形状部分的 `slices` 关键字使用了表 9-7 中所示的关键字。


    | 元素 | 关键字 |

    | --- | --- |

    | 内半径 | `innerRadiusRatio` |


    图例关键字见表 7-2。


    图例位置选项见表 7-9。


    标签显示单位选项见表 7-11。


    你可以在文件 `Attributes_Donut.json` 中找到环形图 JSON 格式的完整定义。

    '
- fmt: '## Treemap


    As one of the simpler visuals (in terms of presentation attributes, at least),
    a treemap only contains three elements apart from those shared by all visuals.
    These are:


    - Legend

    - Data labels

    - Category labels


    Of these, the latter two are the ones that contain elements specific to the treemap.


    The keyword that specifies the formatting attributes of a scatter chart is `treemap`.


    Table 9-8 outlines the JSON keywords that you can use in treemap chart formatting.


    **Table 9-8** Treemap Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `labels` | Data labels |

    | `categoryLabels` | Category labels |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    You can see this in the following code snippet that is taken from the sample file
    `Attributes_Treemap.json`:


    ```

    "treemap":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#000000"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 1,

    "fontFamily": "Arial",

    "fontSize": 10

    }],

    "categoryLabels": [{

    "show": true,

    "color": {"solid": {"color": "#ffffff"}},

    "fontFamily": "Arial",

    "fontSize": 9

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    Legend keywords are given in Table 7-2.


    The `labels` keyword that describes the data labels section uses the keywords
    shown in Table 9-9.


    **Table 9-9** Element Keyword Mapping for the Data Labels Section


    | Element | Keyword |

    | --- | --- |

    | Data labels | `show` |

    | Color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Text size | `fontFamily` |

    | Font family | `fontSize` |


    The `categoryLabels` keyword that describes the category labels section uses the
    keywords shown in Table 9-10.


    **Table 9-10** Element Keyword Mapping for the Category Labels Section


    | Element | Keyword |

    | --- | --- |

    | Category labels | `show` |

    | Color | `color` |

    | Text size | `fontFamily` |

    | Font family | `fontSize` |


    Label display units options are described in Table 7-11.


    ## Waterfall Chart


    One chart that has a couple of interesting new formatting elements is the waterfall
    chart. Specifically, it contains the sentiment colors section that you need to
    be able to configure.


    The keyword that specifies the formatting attributes of a scatter chart is `waterfallChart`.


    Table 9-11 outlines the JSON keywords that you can use in a waterfall chart and
    the section that corresponds to each keyword in the Power BI Desktop format pane.


    **Table 9-11** Waterfall Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X axis |

    | `valueAxis` | Y axis |

    | `labels` | Data labels |

    | `plotArea` | Plot area |

    | `sentimentColors` | Sentiment colors |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet provides the JSON code used to pre-format a waterfall
    chart:


    ```

    "waterfallChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelDisplayUnits": 1000,

    "labelPrecision": 2,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "labels": [{

    "show": true,

