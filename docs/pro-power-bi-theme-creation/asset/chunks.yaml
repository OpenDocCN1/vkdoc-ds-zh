    ## Conclusion


    In this chapter, you have seen how to prepare JSON themes to apply standard formatting
    to six core chart types – stacked bar chart, stacked column chart, clustered bar
    chart, clustered column chart, line chart, and area chart.


    You have seen that they share many common features, which leads to a largely shared
    base of JSON code for format definitions.


    The next step is to look in depth at half a dozen chart formatting specifications
    that are a little more complex – but that build on the JSON definitions that you
    have seen in this chapter.


    # 8. Complex Chart Visual Styles


    The six chart types that you will be looking at in this chapter are only slightly
    more complex than the charts that you saw in the previous chapter. However, they
    are often more detailed (in most cases, anyway) than the charts that you saw previously.
    Fortunately, any added complexity is compensated by the fact that the JSON that
    you will see here is always built on – and derived from – the JSON that you discovered
    in the previous chapter.


    The chart types whose formatting can be preset using JSON themes that you will
    look at in this chapter are


    * 100% stacked bar chart

    * 100% stacked column chart

    * Stacked area chart

    * Line and stacked column chart

    * Line and clustered column chart

    * Scatter chart


    As ever, each chart type has a separate JSON file in the samples folder that contains
    the code that you can use in your own theme files.'
