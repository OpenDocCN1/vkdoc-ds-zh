- fmt: '# Putting It All Together


    Theme creation is essentially a practical matter. So a concrete example of a couple
    of theme files should help you better understand the difference between a “standard”
    theme file (where everything is defined individually) and a cascading theme file.


    If you look in the downloadable JSON files, you will find:


    - `FullTheme.json`: This file contains the complete formatting definition for
    all visuals. Only page and filter pane definitions are set at the generic level.

    - `CascadingTheme.json`: This is an example of how you can define a series of
    generic elements followed by highly specific custom formatting for certain visuals.

    - `FullThemeWithClasses.json`: This file contains the complete formatting definition
    for all visuals. Only page and filter pane definitions are set at the generic
    level. However, colors and text classes are also added to the file.


    I am not going to display the JSON for all three here as together they contain
    several thousand lines of JSON. However, I do suggest that you take a look in
    order to understand the different approaches. They may well also be useful to
    you as a basis for adapting your own theme files.


    # Applying Cascading Palette Colors


    So far in this book, whenever colors have been applied, you have seen a “hard-coded”
    hexadecimal value. While this is certainly the easiest way to set colors, doing
    this can make it laborious to change colors in an entire theme file. This is particularly
    true if you have created a complete set of JSON that specifies every possible
    object. Indeed, this approach can lead to hours of copy/replace work to reset
    colors. This is usually followed by hours of testing dozens of visual types once
    the themes have been applied.


    Fortunately, colors can also cascade through a theme file. This makes modifying
    color settings much easier in practice.


    Setting up cascading color settings works like this:


    - **First**, set the color palette by defining the eight variable colors as you
    would normally. This means that you have a choice of 60 colors to choose from
    (ten columns by six rows in the color palette). Not only do you have a range of
    colors that you can use, but they are variations on ten core colors – which means
    that color choices are usually more harmonious.

    - **Second**, refer to these colors **not by their hexadecimal references** but
    by **their position in the palette**.


    It is the second part that is new, and here is how it works.


    Wherever you would normally use a color reference like this:


    ```

    {"solid": {"color": "#999999"}}

    ```


    To ensure cascading color references, you would use JSON like this instead:


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent": -0.5}}}}}

    ```


    As this piece of JSON is somewhat unintelligible at first sight, take a look at
    its structure.


    The hexadecimal reference is the only part that changes – it becomes:


    ```

    {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent": -0.5}}}

    ```


    The three keywords used here are explained in Table [13-2](#511180_1_En_13_Chapter.xhtml#Tab2).


    **Table 13-2** Palette Color Cascade References


    | Keyword | Definition |

    | --- | --- |

    | `ThemeDataColor` | Indicates that the palette will be used |

    | `ColorId` | Defines the column to use in the palette |

    | `Percent` | Applies a percentage intensity to the selected color |


    The nested structure looks like that shown as follows:


    ```

    {"solid":

    {"color":

    {"expr":

    {"ThemeDataColor":

    {"ColorId": 5, "Percent": -0.25}

    }

    }

    }

    }

    ```


    The two main things that need a little explanation are:


    - `ColorId`

    - `Percent`


    The `ColorId` is a numeric value that represents the column in the palette. It
    is zero based and applies from left to right. This means that the columns are
    numbered 0 to 9 for all 10 columns of colors.


    So, interestingly, the JSON keyword `ThemeDataColor` 0 corresponds to the first
    column in the color palette (defined as white), `ThemeDataColor` 1 corresponds
    to the second column in the color palette (defined as black), `ThemeDataColor`
    2 corresponds to the third column in the color palette (which the palette popup,
    confusingly, describes as Theme color 1), and so on. This is something that you
    end up getting used to.


    Equally, in the color palette, the *shades* of each palette color are defined
    as (from top to bottom):


    - 60 percent lighter

    - 40 percent lighter

    - 20 percent lighter

    - 25 percent darker

    - 50 percent darker


    These are represented by the figure for the JSON `Percent` keyword. However (and
    also somewhat confusingly), the lighter shades of the palette are set as positive
    figures, and the darker shades are set as negative figures.


    This mapping is described in Figure [13-5](#511180_1_En_13_Chapter.xhtml#Fig5).


    ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig5_HTML.jpg](images/511180_1_En_13_Chapter/511180_1_En_13_Fig5_HTML.jpg)


    **Figure 13-5** Palette correspondence to theme data colors


    Selecting a color from one of the rows in the color palette requires you to set
    a percentage figure corresponding to the required shade. As you can see, the lighter
    shades are set as positive values, and the darker shades as negative values.'
