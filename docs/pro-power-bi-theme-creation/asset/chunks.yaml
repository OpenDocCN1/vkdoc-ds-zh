    {"*":

    {

    "general": [{... 代码未显示 ...}]

    "legend": [{

    "show": true,

    "position": "Top",

    "showTitle": true,

    "titleText": "添加图例标题",

    "legendColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8

    }],

    "categoryAxis": [{

    "show": true,

    "position": "Left",

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "添加轴标题",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "axisScale": "Linear",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelDisplayUnits": 0,

    "labelPrecision": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "添加轴标题",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "zoom":[{

    "show":true,

    "showOnValueAxis" : false,

    "showLabels":true,

    "showTooltip":true

    }],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#ffffff"}},

    "labelDisplayUnits": 1,

