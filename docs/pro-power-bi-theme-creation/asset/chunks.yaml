    | 缩放按钮 | `showZoomButtons` |


    描述地图样式部分的 `mapStyles` 关键字使用了表 10-5 中所示的关键字。


    **表 10-5** 地图样式部分关键字映射


    | 元素 | 关键字 |

    | --- | --- |

