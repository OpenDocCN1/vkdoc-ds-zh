    Data Bar Scaling Type Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | topNode | Top node |

    | parentNode | Parent node |

    | levelMaximum | Level maximum |


    Conditional formatting is, again, not possible to define in the JSON theme file.


