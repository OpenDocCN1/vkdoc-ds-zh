    "innerPadding": 15,

    "concatenateLabels": true,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "添加轴标题",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelPrecision": 0,

    "labelDisplayUnits": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "添加轴标题",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "zoom: [{... 代码未显示 ...}],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#FFFFFF"}},

    "labelDisplayUnits": 1,

    "labelPrecision": 2,

    "labelPosition": "InsideEnd",

    "labelOverflow": true,

    "labelOrientation": "vertical",

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 0

    }] ,

    "totals": [{... 代码未显示 ...}],

    "plotArea": [{... 代码未显示 ...}],

    "title": [{... 代码未显示 ...}],

    "background": [{... 代码未显示 ...}],

    "lockAspect": [{... 代码未显示 ...}],

    "border": [{... 代码未显示 ...}],

    "dropShadow": [{... 代码未显示 ...}],

    "visualTooltip": [{... 代码未显示 ...}],

    "visualHeader": [{... 代码未显示 ...}]

    }

    }

    ```


    幸运的是，用于 X 轴、Y 轴和标签部分的堆积柱形图关键字，与用于堆积条形图的关键字基本一致——因此此处不再赘述，而是建议你参考上一节。


    JSON 中用于设置标签方向的 `labelOrientation` 关键字（在 `labels` 部分）需要提供表 7-15 中所示的属性之一。


    **表 7-15** 标签显示单位选项


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `Vertical` | 垂直 |

    | `Horizontal` | 水平 |


    JSON 中用于值轴的 `axisStyle` 关键字需要提供表 7-16 中所示的属性之一。


    **表 7-16** 分类轴和值轴样式选项


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `ShowTitleOnly` | 仅显示标题 |

    | `ShowUnitOnly` | 仅显示单位 |

    | `ShowBoth` | 同时显示 |


    图例关键字见表 7-2。


    分类轴关键字见表 7-3。


    值轴关键字见表 7-4。


    缩放关键字见表 7-5。对于柱形图，`showOnValueAxis` 指的是 Y 轴。


    标签关键字见表 7-6。


    总计关键字见表 7-7。


    绘图区关键字见表 7-8。


    工具提示关键字见表 6-5。


    图例位置选项见 7-9 中的描述。


    分类轴位置选项见 7-10 中的描述。


    值轴显示单位选项见 7-11 中的描述。


    值轴样式选项见 7-16 中的描述。


    值轴网格线样式选项见 7-13 中的描述。


    标签位置选项见 7-12 中的描述。

