- fmt: '## Slicer


    As you might expect, you can also format slicers in a theme file.


    The keyword that specifies the formatting attributes of a slicer is `slicer`.


    Table [12-9](#511180_1_En_12_Chapter.xhtml#Tab9) outlines the JSON keywords that
    you can use in slicer formatting.


    **Table 12-9**

    **Slicer Keywords**


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `slicerHeader` | Slicer header |

    | `numericInputStyle` | Numeric inputs |

    | `slider` | Slider |

    | `selection` | Selection controls |

    | `header` | Header |

    | `date` | Date |

    | `items` | Items |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    You need to remember that not all slicer section definition elements will be visible
    at once in Power BI Desktop, as they depend on the type of slicer that you have
    defined. You can, nonetheless, specify all the available options in the theme
    file using the appropriate keyword.


    The following code snippet shows the JSON used to format a slicer:


    ```json

    "slicer":

    {"*":

    {

    "general":  [{

    "outlineColor": {"solid": {"color": "#909090"}},

    "outlineWeight": 1,

    "orientation": "Horizontal",

    "responsive": false

    }],

    "selection": [{

    "show": true,

    "singleSelect": true,

    "strictSingleSelect": false,

    "selectAllCheckboxEnabled": false

    }],

    "header":   [{

    "show": false,

    "text": "Slicer Text",

    "fontColor": {"solid": {"color": "#ffffff"}},

    "background": {"solid": {"color": "#7A8C97"}},

    "outline": "None",

    "textSize": 9,

    "fontFamily": "Arial"

    }],

    "numericInputStyle":[{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "backgroundColor": {"solid": {"color": "#B7B7B7"}},

    "fontSize": 9,

    "fontFamily": "Arial"

    }],

    "slider":   [{

    "color": {"solid": { "color": "#F5F4F0"} }

    }],

    "items":    [{

    "fontColor": {"solid": {"color": "#F5F4F0"}},

    "backgroundColor": {"solid": {"color": "#B7B7B7"}},

    "outline": "None",

    "textSize": 8,

    "fontFamily": "Arial"

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `general` keyword that describes the selection controls section uses the keywords
    shown in Table [12-10](#511180_1_En_12_Chapter.xhtml#Tab10).


    **Table 12-10**

    **Keyword Mapping for the General Section**


    | Element | Keyword |

    | --- | --- |

    | Outline color | `outlineColor` |

    | Outline weight | `outlineWeight` |

    | Orientation | `orientation` |

    | Responsive | `responsive` |


    The `selection` keyword that describes the selection controls section uses the
    keywords shown in Table [12-11](#511180_1_En_12_Chapter.xhtml#Tab11).


    **Table 12-11**

    **Keyword Mapping for the Selection Controls Section**


    | Element | Keyword |

    | --- | --- |

    | Selection controls | `show` |

    | Single select | `singleSelect` |

    | Multi-select with CTRL | `strictSingleSelect` |

    | Show "Select all" option | `selectAllCheckboxEnabled` |


    The `header` keyword that describes the header section uses the keywords shown
    in Table [12-12](#511180_1_En_12_Chapter.xhtml#Tab12).


    **Table 12-12**

    **Keyword Mapping for the Slicer Header Section**


    | Element | Keyword |

    | --- | --- |

    | Slicer header | `show` |

    | Title text | `text` |

    | Font color | `fontColor` |

    | Background | `background` |

    | Outline | `outline` |

    | Text size | `textSize` |

    | Font family | `fontFamily` |


    The `numericInputStyle` keyword that describes the numeric inputs section uses
    the keywords shown in Table [12-13](#511180_1_En_12_Chapter.xhtml#Tab13).


    **Table 12-13**

    **Keyword Mapping for the Numeric Inputs Section**


    | Element | Keyword |

    | --- | --- |

    | Font color | `fontColor` |

    | Background | `backgroundColor` |

    | Text size | `textSize` |

    | Font family | `fontFamily` |


    The `slider` keyword that describes the slider section uses the keywords shown
    in Table [12-14](#511180_1_En_12_Chapter.xhtml#Tab14).


    **Table 12-14**

    **Element Keyword Mapping for the Slider Section**


    | Element | Keyword |

    | --- | --- |

    | Slider | `show` |

    | Color | `color` |


    The `items` keyword that describes the items section uses the keywords shown in
    Table [12-15](#511180_1_En_12_Chapter.xhtml#Tab15).


    **Table 12-15**

    **Keyword Mapping for the Items Section**


    | Element | Keyword |

    | --- | --- |

    | Font color | `fontColor` |

    | Background | `backgroundColor` |

    | Outline | `outline` |

    | Text size | `textSize` |

    | Font family | `fontFamily` |


    You can find the JSON code for this in the sample file `Attributes_Slicer.json`.


    The header and items outline options are given in Table [6-10](#511180_1_En_6_Chapter.xhtml#Tab10).


    The orientation options are given in Table [7-15](#511180_1_En_7_Chapter.xhtml#Tab15).'
