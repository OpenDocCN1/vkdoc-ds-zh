    # 7. 经典图表可视化样式


    图表是一组共享许多通用格式元素的视觉对象。因此，我认为将它们放在一起讲解是合理的。这有助于你理解这些图表的共通之处，也能让你更容易理解某些高级图表中使用的更复杂的
    JSON 结构。


    本章将讲解的图表包括：


    - 堆积条形图

    - 堆积柱形图

    - 簇状条形图

    - 簇状柱形图

    - 折线图

    - 面积图


    需要学习的视觉对象着实不少。幸运的是，这些图表类型的大部分属性（若非全部）都是通用的。这意味着，一旦你掌握了格式属性应用于基础图表的基本方法，你就可以将相同的代码和知识应用于大部分图表中。这种核心相似性的另一个好处是，它使我们能够在本章后面要查看的
    JSON 代码片段中，只关注不同图表类型之间的差异。


    本章讨论的每种图表类型都在 `samples` 文件夹中有一个单独的 JSON 文件，其中包含可用于自定义主题文件的代码。


    ## 堆积条形图


    首先需要注意的是，尽管 Power BI Desktop 界面称之为堆积条形图（如果鼠标悬停在“可视化”窗格中的第一个图标上，弹出窗口会显示此名称），但在主题文件中，它被称为
    `barChart`。这意味着你需要记住的关键字是 `barChart`，因为这是引入用于指定堆积条形图格式的 JSON 对象的关键字。


    表 7-1 概述了堆积条形图格式中可用的 JSON 关键字，以及 Power BI Desktop 格式窗格中与每个关键字对应的部分。


    **表 7-1** 堆积条形图关键字


    | 关键字 | 格式部分 |

    | --- | --- |

    | `general` | 常规 |

    | `legend` | 图例 |

    | `categoryAxis` | Y 轴 |

    | `valueAxis` | X 轴 |

    | `zoom` | 缩放滑块 |

    | `labels` | 数据标签 |

    | `totals` | 总计标签 |

    | `plotArea` | 绘图区 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    示例文件 `Attributes_StackedBarChart.json` 包含了堆积条形图 JSON 格式的完整规范。你可以在以下代码片段中看到此图表类型特有的格式属性：


    ```json

