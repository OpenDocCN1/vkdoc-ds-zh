    \ | `wordWrap` |\n\n描述值部分的 `values` 关键字使用表 6-14 中所示的关键字。\n\n**表 6-14**  \n**值的关键字映射**\n\
    \n| 元素 | 关键字 |\n| --- | --- |\n| 字体颜色 | `fontColorPrimary` |\n| 背景颜色 | `backColorPrimary`\
    \ |\n| 交替字体颜色 | `fontColorSecondary` |\n| 交替背景颜色 | `backColorSecondary` |\n| 轮廓\
    \ | `outline` |\n| URL 图标 | `urlIcon` |\n| 自动换行 | `wordWrap` |\n| 字体系列 | `fontFamily`\
    \ |\n| 文本大小 | `fontSize` |\n\n描述总计部分的 `total` 关键字使用表 6-15 中所示的关键字。\n\n**表 6-15**\
    \  \n**总计的关键字映射**\n\n| 元素 | 关键字 |\n| --- | --- |\n| 总计 | `totals` |\n| 标签 | `label`\
    \ |\n| 字体颜色 | `fontColor` |\n| 背景颜色 | `backColor` |\n| 轮廓 | `outline` |\n| 字体系列\
    \ | `fontFamily` |\n| 文本大小 | `fontSize` |\n\nJSON 中用于整体表格演示样式的 `stylePreset` 关键字需要表\
    \ 6-16 中显示的属性之一。\n\n**表 6-16**  \n**表格样式选项**\n\n| 值 | 格式弹出选项 |\n| --- | --- |\n\
    | `Default` | 默认 |\n| `None` | 无 |\n| `Minimal` | 极简 |\n| `BoldHeader` | 粗体标头\
    \ |\n| `AlternatingRows` | 交替行 |\n| `ContrastAlternatingRows` | 对比交替行 |\n| `FlashyRows`\
    \ | 鲜明行 |\n| `BoldHeaderFlashyRows` | 粗体标头鲜明行 |\n| `Sparse` | 稀疏 |\n| `Condensed`\
    \ | 紧凑 |\n\n工具提示选项在表 6-5 中进行了描述。\n\n描述 `columnHeaders` 和 `values` 部分的 `outline`\
    \ 关键字使用上一节表 6-10 中所示的关键字。\n\n以下元素*无法*通过 JSON 主题进行配置：\n\n- 字段格式化\n- 条件格式\n"
- fmt: '# Matrix


    As you might expect, the JSON that defines the formatting for a matrix is largely
    similar to – indeed is built on and extends – the JSON for table formatting.


    The elements that are the same as those found in the JSON for a table are:


    - `Style`

    - `Grid`


    Other elements (values and column headers, for instance) are slightly different.
    If you look at the complete JSON for these elements you can compare and contrast
    the two code snippets. The subtotals and totals elements are sufficiently different
    to be worth looking at in detail.


    The keyword that introduces matrix formatting attributes is `pivotTable`.


    The keywords that are used when formatting a matrix are given in Table 6-17 along
    with the section that corresponds to each keyword in the Power BI Desktop format
    pane.


    **Table 6-17** Matrix Keywords


    | Keyword | Formatting Popup Option |

    | --- | --- |

    | `general` | General |

    | `stylePreset` | Style |

    | `grid` | Grid |

    | `columnHeaders` | Column headers |

    | `rowHeaders` | Row headers |

    | `values` | Values |

    | `subTotals` | Subtotals |

    | `total` | Total |

    | `title` | Title |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualTooltip` | Tooltip |

    | `visualHeader` | Visual header |


    The following code snippet shows how you can format a matrix in a JSON file. A
    full piece of JSON that contains all the elements that you can preset is in the
    sample files as `Attributes_Matrix.json`.


    ```

    "pivotTable":

    {"*" :

    {

    "general": [{... code not shown ...}]

    "stylePreset":  [{"name": "ContrastAlternatingRows"}],

    "grid":  [{

    "gridVertical": false,

    "gridVerticalColor": {"solid": {"color": "#E8E8E8"}},

    "gridVerticalWeight": 1,

    "gridHorizontal": false,

    "gridHorizontalColor": {"solid": {"color": "#E8E8E8"}},

    "gridHorizontalWeight": 1,

    "rowPadding": 1,

    "outlineColor": {"solid": {"color": "#ffffff"}},

    "outlineWeight": 1,

    "textSize": 10,

    "imageHeight": 60

    }],

    "columnHeaders": [{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "backColor": {"solid": {"color": "#12239E"}},

    "outline": "TopBottom",

    "autoSizeColumnWidth": true,

    "fontFace": "Arial",

    "fontSize": 8,

    "alignment": "Left",

    "titleAlignment": "Center",

    "wordWrap": true

    }],

    "rowHeaders": [{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "backColor": {"solid": {"color": "#118DFF"}},

    "outline": "TopBottom",

    "stepped": true,

    "steppedLayoutIndentation": 14,

    "urlIcon": true,

    "wordWrap": true,

    "fontFamily": "Arial",

    "fontSize": 8,

    "titleAlignment": "Center",

    "showExpandCollapseButtons": true,

    "expandCollapseButtonsColor": {"solid": {"color": "#ffffff"}},

    "expandCollapseButtonsSize": 12

    }],

    "values": [{

    "fontColorPrimary": {"solid": {"color": "#3D4E57"}},

    "backColorPrimary": {"solid": {"color": "#F5F4F0"}},

    "fontColorSecondary": {"solid": {"color": "#3D4E57"}},

    "backColorSecondary": {"solid": {"color": "#E3DFD4"}},

    "bandedRowHeaders": true,

    "valuesOnRow": false,

    "outline": "Frame",

    "urlIcon": true,

    "wordWrap": true,

    "fontFamily": "Arial",

    "fontSize": 8

    }],

    "subTotals": [{

    "rowSubTotals": true,

    "rowSubtotalsLabel": "Total",

    "columnSubTotals": true,

    "columnSubtotalsLabel": "Total",

    "fontColor": {"solid": {"color": "#FFFFFF"}},

    "fontFace": "Arial",

    "backColor": {"solid": {"color": "#B7B7B7"}},

    "fontSize": 8,

    "applyToHeaders": false,

    "rowSubTotalPosition": "Bottom",

    "perRowLevel": false,

    "perColumnLevel": false

    }],

    "total": [{

    "totals": true,

    "fontColor": {"solid": {"color": "#3D4E57"}},

    "fontFamily": "Arial",

    "backColor": {"solid": {"color": "#D1CAB8"}},

    "applyToHeaders": true,

    "fontSize": 11

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    Matrix grid section keywords are shown in Table 6-12.


    Matrix column header elements are almost identical to those shown in Table 6-13
    – with the addition of the additional element keyword mapping given in Table 6-18.


    **Table 6-18** Keyword Mapping for Column Headers


    | Element | Keyword |

    | --- | --- |

    | Title alignment | `titleAlignment` |


    The `rowHeaders` keyword that describes the row header section uses the keywords
    shown in Table 6-19.


    **Table 6-19** Element Keyword Mapping for the Row Header Section


    | Element | Keyword |

    | --- | --- |

    | Font color | `fontColor` |

    | Background color | `backColor` |

    | Outline | `outline` |

    | Stepped layout | `stepped` |

    | Stepped layout indentation | `steppedLayoutIndentation` |

    | URL icon | `urlIcon` |

    | Word wrap | `wordWrap` |

    | Font family | `fontFamily` |

    | Font size | `fontSize` |

    | Alignment | `titleAlignment` |

    | +/– icons | `showExpandCollapseButtons` |

    | Icon color | `expandCollapseButtonsColor` |

    | Icon size | `expandCollapseButtonsSize` |


    The `subTotals` keyword that describes the subtotals section uses the keywords
    shown in Table 6-20.


    **Table 6-20** Keyword Mapping for Subtotals


    | Element | Keyword |

    | --- | --- |

    | Row subtotals | `rowSubTotals` |

    | Row subtotals label | `rowSubtotalsLabel` |

    | Column subtotals | `columnSubTotals` |

    | Column subtotals label | `columnSubtotalsLabel` |

    | Font color | `fontColor` |

    | Font family | `fontFace` |

    | Background color | `backColor` |

    | Text size | `fontSize` |

    | Apply to labels | `applyToHeaders` |

    | Row subtotal position | `rowSubTotalPosition` |

    | Per row level | `perRowLevel` |

    | Per column level | `perColumnLevel` |


    Tooltip options are described in Table 6-5.


    Matrix values elements are almost identical to those shown in Table 6-14 – with
    the addition of the additional element keyword mapping given in Table 6-21.


    **Table 6-21** Keyword Mapping for Matrix Values


    | Element | Keyword |

    | --- | --- |

    | Banded row style | `bandedRowHeaders` |

    | Show on rows | `valuesOnRow` |


    The `rowSubTotalPosition` keyword in the JSON section for the subtotals requires
    one of the attributes shown in Table 6-22.


    **Table 6-22** Subtotal Position Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Top` | Top |

    | `Bottom` | Bottom |


    ## Conclusion


    This chapter has taken you deeper into the definition of visual formatting using
    theme files. Specifically, you saw the complete details of how to pre-format card,
    multi-row card, table, and matrix visuals. You saw how they all share many common
    elements as well as how similar visual types can share formatting approaches.
    So whether you are formatting a card or a matrix, the underlying principles are
    the same.


    The next step is to look at charts. As you will see, many chart types also share
    common elements. However, given the sheer number of chart types that are available
    in Power BI, I will be spreading this subject over three chapters. The core chart
    types are the subject of the next chapter.'
