- fmt: "# Common Visual Elements\n\nThere are a series of elements that are common\
    \ to most – if not all – visuals in Power BI dashboards. These elements are:\n\
    - Background\n- Title\n- Border\n- Shadow\n- Tooltip\n- Visual header\n- Lock\
    \ aspect\n\nYou are probably used to setting these – time and time again, if the\
    \ truth be told – using the Power BI formatting pane.\n\nThese format elements\
    \ are defined by the following JSON theme keywords:\n\n- `background`: Sets all\
    \ the attributes in the Background card of the Format Pane for a visual as well\
    \ as setting the background for the page\n- `title`: Sets all the attributes in\
    \ the Title card of the Format Pane for a visual\n- `border`: Sets all the attributes\
    \ in the Border card of the Format Pane for a visual\n- `shadow`: Sets all the\
    \ attributes in the Shadow card of the Format Pane for a visual\n- `visualTooltip`:\
    \ Sets all the attributes in the Tooltip card of the Format Pane for a visual\n\
    - `visualHeader`: Sets all the attributes in the Visual header card of the Format\
    \ Pane for a visual\n- `lockAspect`: Sets all the attributes in the Lock aspect\
    \ card of the Format Pane for a visual\n\nSo the time has come to define these\
    \ common elements using JSON in a theme. As is the case with most of the approaches\
    \ to formatting Power BI dashboards in this book, it is best to take a look at\
    \ the JSON code first and explain how it works once you have seen the code. So\
    \ here is a code snippet (with new elements in boldface) that adds some core visual\
    \ default formatting to elements that are common to most visuals.\n\nThis code\
    \ snippet hides some of the JSON that you have seen previously to save space on\
    \ the page. The complete code is in the file `ColorAndTextClassesWithCoreVisualDefaults.json`.\n\
    \nIn this code snippet, you can see that the keywords in italics correspond to\
    \ sections in the Power BI formatting pane:\n\n- The `title` keyword corresponds\
    \ to the Title section.\n- The `lockAspect` keyword corresponds to the Lock aspect\
    \ section.\n- The `border` keyword corresponds to the Border section.\n- The `dropShadow`\
    \ keyword corresponds to the Shadow section.\n- The `visualHeader` keyword corresponds\
    \ to the Visual header section.\n\n```json\n{\n  \"name\": \"Common elements\"\
    ,\n  \"dataColors\": [\"#12239E\", \"#118DFF\", \"#00FF29\", \"#6B007B\", \"#FFB000\"\
    , \"#F5F4F0\", \"#FFFF00\", \"#FF001E\"],\n  --- Code not shown for color and\
    \ text classes ---\n  \"visualStyles\":\n  {\"*\":\n  {\"*\":\n  {\n    \"title\"\
    : [{\n      \"show\": true,\n      \"text\": \"Visual Title\",\n      \"fontColor\"\
    : {\"solid\": {\"color\": \"#ffffff\"}},\n      \"background\": {\"solid\": {\"\
    color\": \"#12239E\"}},\n      \"alignment\": \"Center\",\n      \"fontSize\"\
    : 8,\n      \"fontFamily\": \"Arial\"\n    }],\n    \"lockAspect\": [{\n     \
    \ \"show\": false\n    }],\n    \"border\":   [{\n      \"show\": true,\n    \
    \  \"color\": {\"solid\": {\"color\": \"#F5F4F0\"}}\n    }],\n    \"dropShadow\"\
    :   [{\n      \"show\": true,\n      \"color\": {\"solid\": {\"color\": \"#E8E8E8\"\
    }},\n      \"position\":\"Outer\",\n      \"preset\":\"TopLeft\"\n    }],\n  \
    \  \"visualHeader\": [{\n      \"show\": true,\n      \"background\": {\"solid\"\
    : {\"color\": \"#ffffff\"}},\n      \"border\": {\"solid\": {\"color\": \"#F5F4F0\"\
    }},\n      \"transparency\": 10,\n      \"foreground\": {\"solid\": {\"color\"\
    : \"#000000\"}},\n      \"showVisualInformationButton\": false,\n      \"showVisualWarningButton\"\
    : false,\n      \"showVisualErrorButton\": false,\n      \"showDrillRoleSelector\"\
    : true,\n      \"showDrillToggleButton\": false,\n      \"showDrillUpButton\"\
    : false,\n      \"showDrillDownLevelButton\": false,\n      \"showDrillDownExpandButton\"\
    : false,\n      \"showPinButton\": false,\n      \"showFocusModeButton\": false,\n\
    \      \"showFilterRestatementButton\": false,\n      \"showSeeDataLayoutToggleButton\"\
    : false,\n      \"showOptionsMenu\": false,\n      \"showTooltipButton\": true\n\
    \    }]\n  }\n  }\n  }\n}\n```\n\nNow for some explanations concerning this particular\
    \ piece of JSON:\n\n- Each JSON attribute corresponds to an element in a specific\
    \ section of the format pane in Power BI Desktop.\n- The core method of defining\
    \ key/value pairs is still respected. However, as you can see, each of these value\
    \ settings is defined as an *array* that contains one or more objects. That is,\
    \ each definition starts with a square bracket and a curly bracket and ends with\
    \ a curly bracket followed by a square bracket.\n- Some objects contain further\
    \ nested objects – that is, inner sets of elements in curly brackets, sometimes\
    \ up to three objects deep.\n- There is something else that is new in this JSON\
    \ code. You are referring to selections made using popup menus in Power BI Desktop\
    \ to format elements such as:\n  - Title alignment\n  - Shadow position\n  - Shadow\
    \ preset\n- You need to be warned that the *exact spelling of each JSON keyword\
    \ is required* – and this must always be enclosed in double quotes. Of course,\
    \ if you don’t want to guess the definition, then you can look them up in the\
    \ chapter that describes the visual that you want to format.\n- The good news\
    \ about these definitions is that they do not cause the JSON file load to fail\
    \ if you misspell one of them. All that will happen is that the actual attribute\
    \ will not be formatted and will remain as the default format once the JSON theme\
    \ file has been loaded.\n- You can see that whereas Power BI Desktop has a button\
    \ to switch elements on or off (such as titles or shadows), the corresponding\
    \ JSON translates as:\n\n```json\n\"show\": true\n```\n\nor\n\n```json\n\"show\"\
    : false\n```\n\n![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig1_HTML.jpg](images/511180_1_En_4_Chapter/511180_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1 Anonymous elements\n\n- You need to be aware that JSON displays Boolean\
    \ values (i.e., true or false):\n  - Without quotes\n  - In lowercase\n- It is\
    \ important to respect the capitalization for the words `true` and `false` as\
    \ JSON themes are case-sensitive. You must *not* place them in double quotes either,\
    \ as they are keywords, not values.\n- Finally, the actual element definitions\
    \ (`background`, `title`, etc.) are, themselves, nested inside two “anonymous”\
    \ elements – as shown in Figure [4-1](#511180_1_En_4_Chapter.xhtml#Fig1).\n\n\
    When defining generic elements (i.e., formatting not strictly attributed to a\
    \ specific type of visual), they *have* to be nested at this lower level. The\
    \ asterisks mean that the formatting is generic – not tied to a specific object.\
    \ This does admittedly make tracking the nesting levels (and all the pairs of\
    \ curly brackets) a little more complex. However, it is something that you get\
    \ used to the more that you work with JSON theme files.\n\n## JSON Attribute Definition\n\
    \nIf you take a closer look at the JSON, you will notice that it is really quite\
    \ easy to understand, as each keyword/value pair for each section’s formatting\
    \ options is reasonably straightforward. What the JSON is doing is setting each\
    \ attribute individually for each section. Moreover, the JSON follows the principles\
    \ that you saw previously:\n\n- On or off is indicated using `\"show\": true`\
    \ or `\"show\": false`.\n- Sizes are simple, unquoted numbers.\n- Popup selections\
    \ are in quotes – and virtually identical to the actual choice in any popup menus.\n\
    - Colors are hexadecimal values in double quotes (preceded by a hash/pound symbol).\n\
    \nThis means that understanding the JSON that is used comes easily to a Power\
    \ BI Desktop user who has already spent time formatting charts in dashboards.\
    \ Just to reinforce an important point, the JSON that you see here is only a subset\
    \ of the formatting options that are available for most of these keywords. In\
    \ Chapters [5](#511180_1_En_5_Chapter.xhtml) through [9](#511180_1_En_9_Chapter.xhtml),\
    \ you will see the full details of all currently available chart formatting options\
    \ for each chart type."
  raw: "## Common Visual Elements\n\nThere are a series of elements that are common\
