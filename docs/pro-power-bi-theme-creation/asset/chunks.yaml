    "foregroundColor": { "solid": { "color": "#222224" } },

    "titleSize": 10,

    "headerSize": 11,

    "checkboxAndApplyColor": { "solid": { "color": "#1023F2" } }

    }],

    "filterCard": [

    { "$id": "已应用", "foregroundColor": { "solid": { "color": "#F4820F" } }, "textSize":
    10 },

    { "$id": "可用", "backgroundColor": { "solid": { "color": "#E5E3E3" } }, "textSize":
    10, "transparency": 0 }

    ]

    }

    },

    "page": {

    "*": {

    "background": [{ "color": { "solid": { "color": "#FAF5F5" } }, "transparency":
    100 }],

    "outspace": [{ "color": { "solid": { "color": "#FBF8F8" } } }]

    }

    }

