    Each of the three map types discussed in this chapter has a separate JSON file
    in the samples folder that contains the code that you can use to define your own
    theme files. So, let’s move on with the journey!


    The presentation aspects of a Power BI map that you can format (apart from the
    standard elements that are common to nearly all visuals) are:


    - Legend

    - Data colors

    - Category

    - Bubbles

    - Map controls

    - Map styles

    - Heat map


    The keyword that specifies the formatting attributes of a map is `map`.


    Table 10-1 outlines the JSON keyword that you can use in map formatting and its
    corresponding section in the Power BI Desktop format pane.


    **Table 10-1** Map Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `dataPoint` | Data colors |

    | `categoryLabels` | Category |

    | `bubbles` | Bubbles |

    | `mapControls` | Map controls |

    | `mapStyles` | Map styles |

    | `Title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    You can find the JSON code for this in the sample file `Attributes_Map.json`.


    The following code snippet provides the JSON code used to pre-format a map. As
    maps are a new concept, I have preferred to show virtually all the JSON code:


    ```

    "map":{"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "categoryLabels": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

