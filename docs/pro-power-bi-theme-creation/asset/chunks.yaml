    As well as the elements in the new line styles and secondary Y axis sections,
    line charts have an option that you have not seen in chart visuals so far. This
    is the axis type (in the category axis). In fact, the legend and category axis
    sections are sufficiently different to merit specific review.


    The `*legend*` keyword that describes the legend section uses the keywords shown
    in Table [7-21](#511180_1_En_7_Chapter.xhtml#Tab21).


    **Table 7-21** Keyword Mapping for Legend


    | Element | Keyword |

    | --- | --- |

    | Legend | `show` |

    | Position | `position` |

    | Title | `showTitle` |

    | Legend name | `titleText` |

    | Color | `legendColor` |

    | Font family | `fontFamily` |

    | Text size | `fontSize` |

    | Style | `legendMarkerRendering` |

    | Match line color | `matchLineColor` |

    | Circle default icon | `defaultToCircle` |


    The `*categoryAxis*` keyword that describes the X axis section uses the keywords
    shown in Table [7-22](#511180_1_En_7_Chapter.xhtml#Tab22).


    **Table 7-22** Keyword Mapping for the X Axis


    | Element | Keyword |

    | --- | --- |

    | X axis | `show` |

    | Axis type | `axisType` |

    | Color | `color` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Minimum category width | `preferredCategoryWidth` |

    | Maximum size | `maxMarginFactor` |

    | Title | `showAxisTitle` |

    | Style | `axisStyle` |

    | Title color | `titleColor` |

    | Axis title | `titleText` |

    | Title text size | `titleFontSize` |

    | (Title) Font family | `titleFontFamily` |


    As always, the value that you use in the JSON theme must match – exactly – one
    of the expected values, or the default value will remain active. Equally, remember
    that the values are case-sensitive.


    The `*valueAxis*` options are identical to those shown in Table [7-3](#511180_1_En_7_Chapter.xhtml#Tab3),
    with the addition of the `*position*` element.


