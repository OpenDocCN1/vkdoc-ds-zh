- fmt: '# Hints on Writing JSON Theme Files


    JSON theme files can be very dense, can appear cryptic, and can, when you load
    them, produce the dreaded "Theme file import error" dialog that is shown in Figure
    4-3.


    ![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig3_HTML.jpg](images/511180_1_En_4_Chapter/511180_1_En_4_Fig3_HTML.jpg)


    **Figure 4-3** Theme file import error


    So what can you do to minimize errors when creating theme files?


    One of your first actions should be to use your preferred search engine and look
    for "JSON syntax checker." There are many online resources that allow you to test
    the structural validity of your JSON. This is particularly useful for checking
    that the JSON is "well formed" – which means that there are no superfluous (or
    missing) commas, braces or square brackets, and so on. Some of the tools that
    allow you to write JSON also incorporate syntax checkers or can add them.


    Another key step is to write JSON using a tool that either formats the JSON intelligibly
    or at the very least allows you to appreciate the structure. By this I mean that
    being able to appreciate, visually, the levels of nesting and see how pairs of
    braces match up is key to making your life easier when crafting theme files.


    Nothing except loading (or attempting to load) a theme file into Power BI Desktop
    will test if the actual JSON structure and principal keywords have been typed
    in correctly, unfortunately. At this level, trial and error seem to be the only
    way to test that a theme file does what you want it to do.


    ## Conclusion


    This chapter took you further into the detail of what constitutes a Power BI theme
    file. You saw how the JSON in a theme can be built up step by step to define as
    many – or as few – formatting elements that you want.


    While the true potential of JSON themes for Power BI is to define the exact specifications
    of how each and every visual type will be formatted – down to the most minute
    level of specific detail – it is not always necessary to push the envelope this
    far.


    Consequently, in this chapter, you saw that JSON themes can be created at a higher,
    more generic level in order to format a range of dashboard elements without having
    to describe each element in detail.


    Now that you have seen the basics of theme files in action, it is time to move
    on to an in-depth examination of the precise formatting of every single aspect
    of Power BI dashboards using JSON. As you might expect, this is a large subject
    that involves a considerable amount of detail. Consequently, I have broken down
    the subject matter into eight separate chapters to facilitate understanding. We
    will start with formatting Power BI dashboard objects.


    # Object Visual Styles


    From this point onward in this book, you will be delving into the deepest recesses
    of JSON theme files. This has the potential to be overwhelming, so I intend to
    proceed progressively to show you how JSON formatting is largely a process of
    building up the required knowledge step by step. Moreover, as Power BI themes
    contain many repetitive pieces of code, you will learn to discern the core elements
    that are used over and over again in many (if not most) visuals from the code
    that is specific to each visual. The art is to learn to appreciate not only how
    JSON is used to define visual formatting but also to build on acquired knowledge
    and principles to use as a springboard to discover new areas where themes can
    be applied.


    In this chapter, you will see how to write the JSON theme code to define – completely,
    in the most minute details – the following visuals:


    - Textbox

    - Image

    - Shape


    These visuals have the advantage of being less complex than some of the other
    available visuals, which makes them ideal as the subject of an introduction to
    more complex and detailed JSON formatting. Moreover, they are not bound to data,
    which makes them simpler to format – and so to predefine using theme files. An
    added positive point is that many of their formatting attributes are common to
    many of the visuals that are available in Power BI. This means that you can learn
    some of the essential formatting keywords and approaches through the medium of
    these visuals and then apply the formatting techniques that you have discovered
    to a whole range of other visuals as you progress through this book.


    Each of the three visual types discussed in this chapter has a separate JSON file
    in the samples folder that contains the code that you can use to define your own
    theme files. So, let''s move on with the journey!'
