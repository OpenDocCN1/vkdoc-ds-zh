  trans: '

    # 主题文件定义的属性


    此特定主题文件定义了两组格式属性（`dataColor` 和 `background`），并包含一个用于描述该文件的附加元素（`name`）（毕竟，满是代码的文件不一定容易区分）。文件中的每个元素都由一个称为“名称/值对”的结构定义。它由一个用双引号括起来的格式元素名称（或关键字）组成，其后跟一个冒号，冒号后是该关键字所描述的值。所描述的值范围可以从极其简单（数字或单词）到更复杂的
    JSON 结构——正如你在此主题文件中看到的数组那样。


    定义的两组格式属性是：


    * `dataColors`：调色板

    * `background`：页面背景颜色


    首先要注意的是，每个格式元素（或关键字）都用双引号括起来，后跟一个冒号，最后是相应格式信息的定义。这种方法也称为名称/值配对（即使值本身可能相当复杂）。


    其次，关键字中不能有空格。


    第三点要注意的是，在 Power BI Desktop 的格式窗格中看到的格式术语，与主题文件中赋予该元素的关键字之间通常存在对应关系。然而，这种对应关系可能有些近似，并不总是精确的。事实上，有时
    Power BI 的演进已经使得 JSON 中使用的关键字与 Power BI Desktop 中显示的格式元素完全分离。因此，随着本书的深入，我将解释 JSON
    中使用的关键字与 Power BI Desktop 中使用的术语之间的确切对应关系。


    第四点要注意的是，每个关键字/定义对（或者如果你愿意，也可以称作名称/值对）都以逗号结尾，最后一个除外。


    第五个重要点是，任何非纯数字的值都必须用双引号括起来。


    最后一点是，关键字总是以小写字符开头——并且其拼写和大小写要求非常严格。换句话说，你必须精确地按照 Power BI 期望的方式拼写 JSON 关键字——否则
    JSON 属性将不会被应用。这意味着使用正确的关键字是基础。主题文件在很多方面都非常刻板，就关键字而言，它们完全没有通融余地。


    # JSON 数组


    定义 JSON 文件中 `dataColors` 部分的值有多个。这是因为 Power BI 调色板包含十个元素。前两个是固定不变的（白色和黑色），而其他八个可以由用户定义。


    这八个元素（最多——你可以选择设置更少的元素，其余的保留为默认值）在主题文件中被设置为一个数组。这意味着元素列表是：


    * 用方括号括起来

    * 用逗号分隔——最后一个元素后没有逗号


    元素本身可以是全数字或全文本——这取决于数组包含的信息种类。


    ## JSON 呈现方式


    JSON 代码的显示方式可以有无限多种。你刚才看到的代码也可以像这样显示：


    ```

    {

    "name": "Intro Theme",

    "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
    "#FFFF00", "#FF001E"],

    "background": "#FFFFFF"

    }

    ```


    或者像这样（这只是其中一种方式）：


    ```

    {"name": "Intro Theme", "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B",
    "#FFB000", "#F5F4F0", "#FFFF00", "#FF001E"], "background": "#FFFFFF"}

    ```


    虽然更紧凑的 JSON 代码可能占用页面更少的空间，但我更喜欢通过包含大量的换行、缩进和空白来使代码尽可能易读。这更容易理解主题文件与“格式”窗格中可见的格式元素之间的关联——以及
    JSON 文件所映射到的内容。


    那么，你在这个小主题文件中创建了什么呢？很简单，你定义了基础调色板，每次你想在 Power BI 仪表板中应用颜色时，该调色板都会出现。你可以在图 3-2
    中看到这一点，其中主题文件 `dataColors` 数组中的十六进制颜色定义定义了调色板元素。


    ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig2_HTML.jpg](img/511180_1_En_3_Fig2_HTML.jpg)


    **图 3-2** 映射主题文件中的调色板


    # JSON 主题文件中的颜色


    `dataColors` 元素属性中的代码——每个都以井号/哈希符号开头——是对应于特定颜色的十六进制值。如果你有网页设计背景，这可能是你的第二天性。如果没有，那么你需要找到一种方法，来精确找出与你希望在
    Power BI 中使用的每种颜色相对应的十六进制值。


    幸运的是，有成百上千的网站提供关于颜色使用的指导和工具。因此，在你最常用的搜索引擎中搜索“十六进制颜色”几分钟，应该就能找到一些有用的资源。


    同样值得注意的是，Power BI Desktop 的颜色弹出窗口会显示你分配给仪表板元素的颜色的十六进制引用。只需将指针悬停在颜色选择器中选中的颜色上，即可查看其十六进制值。


    **注意：** 始终将十六进制颜色值用双引号括起来，并在其前面加上井号/哈希符号（`#`）。

    '
- fmt: '# Generic Colors (Color Classes)


    Now that you have seen an elementary JSON theme file, it is time to extend this
    by adding some further generic formatting elements. These will add the sentiment
    colors and advanced colors that were added interactively using the `Customize
    current theme` function in the previous chapter, as well as another element –
    `tableAccent` – that cannot be added using the Power BI Desktop interface.


    You can find this file as `StructuralColors.JSON` in the sample files directory.
    The code that has been added to the starter file you saw earlier is in boldface.


    ```

    {

    "name": "Structural Colors",

    "dataColors": ["#171796", "#E34B20", "#F4B7A6", "#465437", "#E2EB00", "#615E55",
    "#00AC98", "#73268c"],

    "good": "#1AAB40",

    "neutral": "#D9B300",

    "bad": "#D64554",

    "maximum": "#118DFF",

    "center": "#D9B300",

    "minimum": "#DEEFFF",

    "null": "#FF7F48",

    "background": "#FFFFFF",

    "firstLevelElements": "#949494",

    "secondLevelElements": "#949494",

    "thirdLevelElements": "#D5D5D5",

    "fourthLevelElements": "#B7B7B7",

    "secondaryBackground": "#E8E8E8",

    "tableAccent": "#118DFF"

    }

    ```


    As you can see, this file extends the principles that were begun with the simple
    file `IntroTheme.json`. That is:


    * The entire file contents are enclosed in a pair of curly braces.

    * Each definition is a name/value pair.

    * All definitions end with a comma except the last one.


    The name/value pairs for all the color definitions (except the color palette)
    are simple:


    * The name of the color attribute (the keyword) on the left

    * The hexadecimal color reference to apply the chosen color on the right after
    a colon


    As most of these color elements were explained in the previous chapter, I will
    not repeat their definition here. The only new one is:


    * `tableAccent`: This element overrides the table and matrix grid outline color.


    It is worth noting that you can (with a simple JSON file like this one, at least)
    enter these elements in *any order*. The comma separation is the key point to
    remember – and apply rigorously. In other words, every attribute definition except
    the last one must end with a comma.


    Interestingly, you can see that longer (and more complex) keywords are in *camelCase*
    – that is, they begin with a lowercase character, but each word inside the longer
    keyword is capitalized.


    **Note**


    If you intend to create an "edgy" dark theme (with black or dark background elements),
    then be sure to also set the values for other structural colors and the primary
    text class colors to light colors – or many elements will be unreadable.


    If you now apply this theme to a dashboard (one of your own or the sample dashboard
    `SampleDashboard.pbix` from the sample files), you will see how much formatting
    has been provided by a few lines of JSON code.


    To make this clearer, take a look at Figure [3-3](#511180_1_En_3_Chapter.xhtml#Fig3),
    where you can see how *some* of the colors that are defined in the JSON theme
    are applied in a Power BI Desktop dashboard.


    ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig3_HTML.png](images/511180_1_En_3_Chapter/511180_1_En_3_Fig3_HTML.png)


    **Figure 3-3** High-level color customization


    If you wish to experiment, you can modify some of the hexadecimal color references
    and reapply the theme to appreciate the ease with which a range of changes can
    be made when you use a theme file.


    ## Generic Text Attributes (Text Classes)


    In the previous chapter, you used Power BI Desktop to create a theme file that
    created four text formats. These (`label`, `callout`, `title`, and `header`) were
    used across a range of visuals to define core text formatting. However useful,
    these are only some of the generic text settings that you can define using a theme
    file. There are another eight that you can add manually to a theme file to add
    a greater range of standardized text formatting to your dashboards. This can avoid
    you having to format manually in Power BI a whole range of text attributes, visual
    by visual.


    Let''s take a look at a JSON theme file that has added generic text classes to
    the color palette and generic colors that you have seen thus far in this chapter.
    This file is named `ColorsAndTextClasses.json` and is available with the sample
    files. The added JSON code is in boldface in the code snippet shown as follows:


    ```

    {

    "name": "Colors and Text Classes",

    "dataColors": ["#171796", "#E34B20", "#F4B7A6", "#465437", "#E2EB00", "#615E55",
    "#00AC98", "#73268c"],

    "background": "#FFFFFF",

    "good": "#1AAB40",

    "neutral": "#D9B300",

    "bad": "#D64554",

    "maximum": "#118DFF",

    "center": "#D9B300",

    "minimum": "#DEEFFF",

    "null": "#FF7F48",

    "firstLevelElements": "#949494",

    "secondLevelElements": "#949494",

    "thirdLevelElements": "#D5D5D5",

    "fourthLevelElements": "#B7B7B7",

    "secondaryBackground": "#E8E8E8",

    "tableAccent": "#118DFF",

    "textClasses": {

    "label": {

    "fontSize": 9,

    "fontFace": "Arial",

    "color": "#949494"

    },

    "callout": {

    "fontSize": 18,

    "fontFace": "Arial",

    "color": "#808080"

    },

    "title": {

    "fontSize": 12,

    "fontFace": "Arial",

    "color": "#949494"

    },

    "header": {

    "fontSize": 12,

    "fontFace": "Arial",

    "color": "#808080"

    },

    "largeTitle": {

    "fontSize": 14,

    "fontFace": "Arial",

    "color": "#808080"

    },

    "largeLabel": {

    "fontSize": 12,

    "fontFace": "Arial",

    "color": "#808080"

    },

    "smallLabel": {

    "fontSize": 8,

    "fontFace": "Arial",

    "color": "#949494"

    },

    "semiboldLabel": {

    "fontSize": 8,

    "fontFace": "Arial",

    "color": "#808080"

    },

    "boldLabel": {

    "fontSize": 8,

    "fontFace": "Arial",

    "color": "#808080"

    },

    "lightLabel": {

    "fontSize": 8,

    "fontFace": "Arial",

    "color": "#949494"

    },

    "largeLightLabel": {

    "fontSize": 8,

    "fontFace": "Arial",

    "color": "#949494"

    },

    "smallLightLabel": {

    "fontSize": 8,

    "fontFace": "Arial",

    "color": "#949494"

    }

    }

    }

    ```


    So what are you looking at exactly? Essentially, this is a set of keywords that
    are used across a range of visuals to define text formatting. Four of them were
