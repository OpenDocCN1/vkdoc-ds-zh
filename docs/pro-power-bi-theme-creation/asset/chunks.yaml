    # 簇状条形图


    指定簇状条形图格式的 JSON 与您之前看到的堆积条形图代码几乎完全相同——当然，除了 JSON 对象的初始关键字。唯一的主要区别在于它不包含 `totals`
    部分。


    指定簇状条形图格式属性的关键字是 `clusteredBarChart`。


    表 7-17 概述了可在簇状条形图格式中使用的 JSON 关键字，以及 Power BI Desktop“格式”窗格中每个关键字对应的部分。


    **表 7-17** 簇状条形图关键字


    | 关键字 | 格式部分 |

    | --- | --- |

    | `general` | 常规 |

    | `legend` | 图例 |

    | `categoryAxis` | Y 轴 |

    | `valueAxis` | X 轴 |

    | `zoom` | 缩放滑块 |

    | `labels` | 数据标签 |

    | `plotArea` | 绘图区域 |

    | `title` | 标题 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    指定簇状条形图格式的 JSON 代码可在示例文件 `Attributes_ClusteredBarChart.json` 中找到。


    为求完整，以下是定义簇状条形图格式的 JSON 代码：


    ```

    "clusteredBarChart":

    {"*" :

