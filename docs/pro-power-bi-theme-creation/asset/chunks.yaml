    首先值得注意的是，您可以为 `icon`、`fill` 和 `text` 设置属性，以反映以下四种按钮状态的不同设置：


    - 默认

    - 悬停

    - 按下

    - 禁用


    引入了一个新概念——按钮状态——这会影响主题文件 JSON 中的对象嵌套。实际上，在操作按钮的每个主要元素内部都应用了一层额外的嵌套。


    每种状态都使用 JSON 中定义按钮状态的 `$id` 关键字来定义。对于 JSON 中指定了 `$id` 关键字的两个部分（`text` 和 `icon`），您需要使用表
    12-2 中显示的值之一。这样做的结果是，JSON 中会有*四个*几乎相同的子部分来描述文本和图标的格式设置——每个按钮状态对应一个。


    **表 12-2** 按钮状态选项


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `default` | 默认状态 |

    | `hover` | 悬停时 |

    | `selected` | 按下时 |

    | `disabled` | 已禁用 |


    描述按钮文本区域的 `text` 关键字使用表 12-3 中显示的关键字。


    **表 12-3** 按钮文本区域的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 按钮文本 | `show` |

    | 按钮文本 | `text` |

    | 字体颜色 | `fontColor` |

    | 内边距 | `padding` |

    | 垂直对齐 | `verticalAlignment` |

    | 水平对齐 | `horizontalAlignment` |

    | 文本大小 | `fontSize` |

    | 字体 | `fontFamily` |


    描述图标区域的 `icon` 关键字使用表 12-4 中显示的关键字。


    **表 12-4** 图标区域的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 图标 | `show` |

    | 形状 | `shapeType` |

    | 内边距 | `padding` |

    | 垂直对齐 | `verticalAlignment` |

    | 水平对齐 | `horizontalAlignment` |

    | 线条颜色 | `lineColor` |

    | 透明度 | `lineTransparency` |

    | 粗细 | `lineWeight` |


    描述轮廓区域的 `outline` 关键字使用表 12-5 中显示的关键字。


    **表 12-5** 轮廓区域的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 轮廓 | `show` |

    | 轮廓颜色 | `lineColor` |

    | 透明度 | `transparency` |

    | 轮廓粗细 | `weight` |

    | 圆角 | `roundEdge` |


    描述填充区域的 `fill` 关键字使用表 12-6 中显示的关键字。


    **表 12-6** 填充区域的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 填充 | `show` |

    | 填充颜色 | `fillColor` |

    | 透明度 | `transparency` |


    表 12-7 显示了图标的垂直对齐属性。


    **表 12-7** 垂直对齐选项


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `top` | 顶部 |

    | `middle` | 居中 |

    | `bottom` | 底部 |


    表 12-8 显示了图标的水平对齐属性。


    **表 12-8** 水平对齐选项


    | 值 | 格式弹出选项 |

    | --- | --- |

    | `left` | 左对齐 |

    | `center` | 居中对齐 |

    | `right` | 右对齐 |


    您可以在示例文件 `Attributes_ActionButton.json` 中找到操作按钮的 JSON 代码。

