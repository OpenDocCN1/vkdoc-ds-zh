    | 100% 渐变停止点 | `Color100` |


    地图样式部分中的 `mapTheme` 关键字需要使用表 10-7 中所示的属性之一。


    **表 10-7** 地图样式选项


    | 值 | 格式设置弹出选项 |

    | --- | --- |

