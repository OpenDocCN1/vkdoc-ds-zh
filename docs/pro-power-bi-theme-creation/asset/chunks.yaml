- fmt: '## KPI


    The final piece of JSON code that you will see in this chapter is for the KPI
    visual. It is introduced by the `kpi` keyword in a theme file.


    Table [11-25](#511180_1_En_11_Chapter.xhtml#Tab25) outlines the JSON keywords
    that you can use when formatting decomposition tree visuals and the section that
    corresponds to each keyword in the Power BI Desktop format pane.


    Table 11-25


    KPI Visual Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `indicator` | Indicator |

    | `trendline` | Trend axis |

    | `goals` | Goals |

    | `status` | Color coding |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The code to format a KPI is as follows:


    ```json

    "kpi":

    {"*" :

    {

    "general":  [{"responsive": true }],

    "indicator":    [{

    "indicatorDisplayUnits": 0,

    "indicatorPrecision": 2,

    "fontSize": 9,

    "fontColor": {"solid": {"color": "#F5F4F0"}},

    "fontFamily": "Arial",

    "horizontalAlignment": "left",

    "verticalAlignment": "top",

    "showIcon": true,

    "iconSize": 15

    }],

    "trendline":   [{

    "show": true,

    "transparency": 30

    }],

    "goals": [{

    "showGoal": true,

    "goalText": "Target",

    "showDistance": true,

    "goalFontColor": {"solid": {"color": "#000000"}},

    "goalFontFamily": "Arial",

    "fontSize": 9,

    "showDistance": true,

    "distanceLabel": "Value",

    "labelPrecision": 2,

    "distanceFontFamily": "Arial",

    "distanceFontColor": {"solid": {"color": "#FFFFFF"}},

    "titleFontSize": 13,

    "direction": "Low is good"

    }] ,

    "status": [{

    "direction": "Positive",

    "goodColor": {"solid": {"color": "#F5F4F0"}},

    "neutralColor": {"solid": {"color": "#949494"}},

    "badColor": {"solid": {"color": "#FF001E"}}

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `indicator` keyword that describes the indicator section uses the keywords
    shown in Table [11-26](#511180_1_En_11_Chapter.xhtml#Tab26).


    Table 11-26


    Keyword Mapping for the Indicator Section


    | Element | Keyword |

    | --- | --- |

    | Display units | `indicatorDisplayUnits` |

    | Value decimal places | `indicatorPrecision` |

    | Text size | `fontSize` |

    | Font color | `fontColor` |

    | Font family | `fontFamily` |

    | Horizontal alignment | `horizontalAlignment` |

    | Vertical alignment | `verticalAlignment` |

    | Show icon | `showIcon` |

    | Icon size | `iconSize` |


    The `trendline` keyword that describes the trend axis section uses the keywords
    shown in Table [11-27](#511180_1_En_11_Chapter.xhtml#Tab27).


    Table 11-27


    Keyword Mapping for the Trend Axis Section


    | Element | Keyword |

    | --- | --- |

    | Trend axis | `show` |

    | Transparency | `transparency` |


    The `goals` keyword that describes the goals section uses the keywords shown in
    Table [11-28](#511180_1_En_11_Chapter.xhtml#Tab28).


    Table 11-28


    Element Keyword Mapping for the Goals Section


    | Element | Keyword |

    | --- | --- |

    | Goal | `showGoal` |

    | Label | `goalText` |

    | Font color | `goalFontColor` |

    | Font family | `goalFontFamily` |

    | Text size | `fontSize` |

    | Distance | `showDistance` |

    | Label | `distanceLabel` |

    | Value decimal places | `labelPrecision` |

    | (Distance) Font color | `distanceFontColor` |

    | (Distance) Font family | `distanceFontFamily` |

    | (Distance) Text size | `titleFontSize` |

    | Distance direction | `direction` |


    The `status` keyword that describes the color coding section uses the keywords
    shown in Table [11-29](#511180_1_En_11_Chapter.xhtml#Tab29).


    Table 11-29


    Keyword Mapping for the Color Coding Section


    | Element | Keyword |

    | --- | --- |

    | Direction | `direction` |

    | Good color | `goodColor` |

    | Neutral color | `neutralColor` |

    | Bad color | `badColor` |


    The `distanceLabel` keyword in the JSON for the goal needs one of the attributes
    shown in Table [11-30](#511180_1_En_11_Chapter.xhtml#Tab30).


    Table 11-30


    Distance Label Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Value` | Value |

    | `Percent` | Percent |

    | `Value, percent` | Value, percent |


    The `direction` keyword in the JSON for the goal needs one of the attributes shown
    in Table [11-31](#511180_1_En_11_Chapter.xhtml#Tab31).


    Table 11-31


    Goal Direction Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `High is good` | Increasing is positive |

    | `Low is good` | Decreasing is positive |


    The `direction` keyword in the JSON for the color coding (status) needs one of
    the attributes shown in Table [11-32](#511180_1_En_11_Chapter.xhtml#Tab32).


    Table 11-32


    Color Coding Direction Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Positive` | High is good |

    | `Negative` | Low is good |


    You can find the full JSON code to format a KPI in the sample file `Kpi.json`.


    ## Conclusion


    In this chapter, you saw how to define formatting in JSON for the gauge, Python
    visual, R script visual, key influencers visual, decomposition tree, and KPI.


    You can now move on to the final set of visual formatting attributes – those used
    to define actual dashboards themselves and visuals that are not used for data
    presentation. This is the subject of the following chapter, which is the last
    of the chapters that covers detailed formatting of visuals.


    # 12. Dashboard Styling


    In this chapter, you will finish your tour of the various objects that you can
    format using theme files. This involves looking at a final couple of visuals and
    two elements that are not technically visuals at all. These four are:


    - Action button

    - Slicer

    - Page

    - Filter pane


    Sample files that contain the complete JSON code for these elements are available
    to download from the Apress site.


    To conclude the chapter, I also want to describe not only how you can annotate
    theme files but also how you can actually discover the keywords that Power BI
    uses for JSON mapping. This will enable you to keep up with changes and developments
    in Power BI and update your JSON files as the product evolves and new formatting
    possibilities are added.'
