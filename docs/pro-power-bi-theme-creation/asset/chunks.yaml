    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    地图控件元素在表 10-4 中进行了说明。


    在形状部分使用的 JSON 中的 `projection` 关键字需要表 10-11 中显示的属性之一。


    **表 10-11** 投影选项


