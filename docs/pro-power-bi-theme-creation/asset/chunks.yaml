    ## 结论


    在这短短的一章中，您了解了如何为地图、着色地图和形状地图视觉对象创建 JSON。它们使用了相当简单的 JSON（假设您熟悉主题文件创建），但依然允许您定义地图视觉对象格式化的基本方面。


    # 11. 其他视觉样式


    有一类视觉对象既不是基于文本的，也不是图表或地图。我将这些视觉对象集中到一章中，以解释它们在主题文件中使用的 JSON。这些视觉对象包括：


    *   仪表

    *   Python 视觉对象

    *   R 脚本视觉对象

    *   关键影响因素视觉对象

    *   分解树视觉对象

    *   KPI


    本章讨论的每个视觉对象在示例文件夹中都有一个单独的 JSON 文件，其中包含可用于定义您自己的主题文件的代码。


    不可否认，这些视觉对象的集合有些混杂，因为它们几乎没有共同点。让我们来看看它们。


    ## 仪表


    可以使用主题文件标准化 Power BI 仪表视觉对象的外观。指定仪表格式化属性的关键字是 `gauge`。


    表 11-1 概述了可在仪表格式化中使用的 JSON 关键字及其在 Power BI Desktop 格式窗格中的对应部分。


    **表 11-1** 仪表关键字


    | 关键字 | 格式设置部分 |

    | --- | --- |

    | `general` | 常规 |

    | `datapoint` | 数据颜色 |

    | `labels` | 数据标签 |

    | `target` | 目标 |

    | `calloutValue` | 标注值 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标题 |


    以下代码片段提供了用于预格式化仪表的 JSON 代码：


    ```

    "gauge":

    {"*":

    {

    "general":  [{"responsive": true }],

    "dataPoint":  [{

    "fill": {"solid": {"color": "#E34B20"}},

    "target": {"solid": {"color": "#E2EB00"}}

    }],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#615E55"}},

    "labelDisplayUnits": 0,

    "labelPrecision": 0,

    "fontSize": 8,

    "fontFamily": "Arial"

    }],

    "target": [{

    "show": true,

    "color": {"solid": {"color": "#E34B20"}},

    "labelDisplayUnits": 0,

    "labelPrecision": 0,

    "fontSize": 8

    "fontFamily": "Arial",

    }],

    "calloutValue": [{

    "show": true,

    "color": {"solid": {"color": "#F5F4F0"}},

    "labelDisplayUnits": 0,

    "labelPrecision": 0

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    描述数据颜色部分的 `dataPoint` 关键字使用表 11-2 中所示的关键字。


    **表 11-2** 数据颜色部分的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 填充 | `fill` |

    | 目标 | `target` |


    描述数据标签部分的 `labels` 关键字使用表 11-3 中所示的关键字。


    **表 11-3** 数据标签部分的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 数据标签 | `show` |

    | 颜色 | `color` |

    | 显示单位 | `labelDisplayUnits` |

    | 值小数位数 | `labelPrecision` |

    | 文本大小 | `fontSize` |

    | 字体系列 | `fontFamily` |


    描述目标部分的 `target` 关键字使用表 11-4 中所示的关键字。


    **表 11-4** 目标部分的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 目标 | `show` |

    | 颜色 | `color` |

    | 显示单位 | `labelDisplayUnits` |

    | 值小数位数 | `labelPrecision` |

    | 文本大小 | `fontSize` |

    | 字体系列 | `fontFamily` |


    描述标注值部分的 `calloutValue` 关键字使用表 11-5 中所示的关键字。


    **表 11-5** 标注值部分的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 标注值 | `show` |

    | 颜色 | `color` |

    | 显示单位 | `labelDisplayUnits` |

    | 值小数位数 | `labelPrecision` |


    标签和目标显示单位元素在表 7-11 中进行了描述。


    您可以在示例文件 `Attributes_Gauge.json` 中找到其 JSON 代码。

