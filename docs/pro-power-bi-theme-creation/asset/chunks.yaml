    | Value | Formatting Popup Option |

    | --- | --- |

    | default | Default |

    | round | Round |


    The *defaultAction* keyword in the JSON for the tree needs one of the attributes
    shown in Table [11-23](#511180_1_En_11_Chapter.xhtml#Tab23).


    Table 11-23


    Default Action Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | toggle | Collapse |

    | click | Default |


    The *dataBarScalingType* keyword in the JSON for the data bars needs one of the
    attributes shown in Table [11-24](#511180_1_En_11_Chapter.xhtml#Tab24).


