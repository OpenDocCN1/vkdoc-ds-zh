- fmt: '# Themes and the Format Pane


    A theme is nothing more than the definition of the formatting that you would otherwise
    apply manually using the Power BI format pane. It follows that you need to know
    what the format pane is and how it is used to format dashboard objects. I will
    not be explaining the intricacies of the Format Pane in this book, however, and
    refer you to my book *Pro Power BI Desktop* for full details on how to format
    dashboards manually.


    Nonetheless, it is worth reminding yourself of the core elements in the Format
    Pane and how formatting works at a generic level.


    Essentially, formatting is a hierarchy of three elements:


    * *Visual* (a table or chart – although this could be the page as well).

    * *Element*: This is the aspect of a visual that you want to format. This corresponds
    to the expandable sections of the formatting pane in Power BI Desktop (they are
    also called tabs or cards). The X axis section for a chart is an example of this.

    * *Property* (often referred to as an attribute): This is the specific setting
    you define. This could be the font color, for instance.


    You can see this (for a stacked bar chart visual) in Figure [1-1](#511180_1_En_1_Chapter.xhtml#Fig1),
    where the Data labels element is expanded to show all the available properties
    that you can set for data labels.


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig1_HTML.jpg](images/511180_1_En_1_Chapter/511180_1_En_1_Fig1_HTML.jpg)


    Figure 1-1 The Format Pane


    It is important to bear this hierarchy in mind when creating theme files, as the
    entire JSON structure is predicated on this nested approach – as will be explained
    further in Chapter [3](#511180_1_En_3_Chapter.xhtml).


    # Writing JSON Files


    As you will have to write or adapt actual JSON files for all but the simplest
    theme files, you will need to choose a tool to carry out your modifications. As
    JSON is a text-based format, there is a plethora of tools that are available to
    do this. It is entirely up to you to select a tool that you are happy with. A
    few that I have used are


    * Notepad

    * Notepad++

    * Visual Studio

    * Visual Studio Code

    * An online JSON editor


    There are literally dozens of tools available, and the choice of an application
    to use is entirely up to you. My only advice is to find something that you are
    comfortable with and that provides you with the balance of usability and power
    that you require. Above all, it must be able to save or export text files. As,
    in practice, you are likely to test and revise your choices over and over again,
    the tool that you choose needs to have multiple levels of undo and redo as well
    as having a powerful search and replace capability.


    A tool that displays JSON in an easy-to-read format is a must when writing theme
    files for Power BI. This is because the JSON structure used by Power BI Desktop
    can get intricate, and consequently it helps considerably to be able to see the
    nested levels of text and how they are structured. However, I don’t want to get
    too far ahead, yet, so will come back to this later in the book.


    If you have not yet made up your mind, I suggest downloading Notepad++. This is
    a free text editor that can display JSON in a very readable format.


    # Applying Themes


    Before looking at how you create your own themes, it is probably best that I remind
    you of the far-reaching effects that themes can deliver. Hopefully, this will
    incentivize you to want to learn more and encourage you how to create your own
    theme files.


    Take, for instance, a very simple dashboard like the one shown in Figure [1-2](#511180_1_En_1_Chapter.xhtml#Fig2).
    (This is the file `SampleDashboard.pbix` from the sample files.)


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig2_HTML.jpg](images/511180_1_En_1_Chapter/511180_1_En_1_Fig2_HTML.jpg)


    Figure 1-2 An unformatted dashboard


    This dashboard is strictly “plain vanilla.” That is, no formatting has been applied
    at all. Imagine that this dashboard were a 15-page report and that you have to
    make it not only presentable but also mapping to a corporate standard. This could
    take hours in a worst-case scenario.


    However, you are fortunate enough to have a theme JSON file available that defines
    all the corporate standards. To apply it, all you have to do is


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig3_HTML.jpg](images/511180_1_En_1_Chapter/511180_1_En_1_Fig3_HTML.jpg)


    Figure 1-3 Successful theme file import


    1. Click View to activate the View ribbon.

    2. Click the Themes popup.

    3. Click Browse for themes.

    4. Navigate to the sample files and select the theme file (`BaseTheme.json` in
    this example).

    5. Click Open. After a few seconds, you will see the dialog in Figure [1-3](#511180_1_En_1_Chapter.xhtml#Fig3).

    6. Click Close.


    That is it! Your dashboard (every object on every page) is now formatted, instantly.
    The result is shown in Figure [1-4](#511180_1_En_1_Chapter.xhtml#Fig4).


    ![../images/511180_1_En_1_Chapter/511180_1_En_1_Fig4_HTML.jpg](images/511180_1_En_1_Chapter/511180_1_En_1_Fig4_HTML.jpg)


    Figure 1-4 A dashboard after applying a theme file


    You can now add any final formatting that you require to override the theme at
    the level of individual elements (a theme, after all, is a time-saver – not a
    straitjacket). The end result is almost certainly that you have saved a vast amount
    of time adding presentational touches and have ensured that your dashboard conforms
    to a standard look and feel.


    **Note**


    The theme file that you applied in this example is not designed to show off subtleties
    of dashboard design – nor is it based on cutting-edge design principles. It is,
    however, designed to illustrate how quick and easy it is to reformat an entire
    dashboard using a theme file.


    # Conclusion


    In this chapter, you have seen what themes are all about and exactly how powerful
    they can be. It is time, now, to move on to creating your own themes. Initially,
    we will begin by using Power BI Desktop to write the JSON for you – as you will
    discover in the next chapter.'
