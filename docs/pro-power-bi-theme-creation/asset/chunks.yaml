    **Note**: As you will see in subsequent chapters, this setting corresponds to
    the `title` element in a JSON theme.


    The Customize theme/Text/Cards and KPIs tab looks like Figure [2-7](#511180_1_En_2_Chapter.xhtml#Fig7).


