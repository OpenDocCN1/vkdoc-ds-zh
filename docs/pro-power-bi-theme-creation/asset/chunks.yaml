  trans: '

    请注意，此图*并非*每个文本类应用范围的完整呈现，但它确实勾勒出了文本类的工作方式。


    JSON 结构也需要一些解释，因为这是你第一次在主题文件中遇到嵌套对象（即，花括号内包含另一组花括号）。


    如你所见，其核心原则依然是键/值对——也就是一个关键字和一个定义。然而，这次的*定义*稍微复杂一些，因为它并非关键字后冒号后面的单个元素，而是一个完整的对象。


    你可以在图 3-5 中看到这种示意。


    ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig5_HTML.jpg](img/511180_1_En_3_Fig5_HTML.jpg)


    **图 3-5**


    嵌套的 JSON 对象


    需要注意的要点是：


    *   这次，每个定义都是一个独立的、嵌套的对象，以*花括号*开始和结束。

    *   每个对象内部都包含一系列键/值对，这些键/值对之间用*逗号分隔*（并且在最后一个键/值对之后没有逗号）。

    *   构成文本定义的键/值对，与更简单的键/值对一样，在“外层”级别与其他键/值对之间用*逗号分隔*。

    *   *数字不应包含在双引号内*。由于 Power BI 始终期望字体以磅（points）为单位定义，因此你只需指定字体大小的数字即可（无需指定“pt”或类似内容）。

    *   你引用的任何*字体*的*拼写必须与 Windows 期望的完全一致*，并且当然必须存在于托管 Power BI 仪表板的系统中。


    ## JSON 数据类型


    任何值（名称/值对中冒号后面的部分）都必须是可识别的 JSON 数据类型。


    JSON 可用的数据类型集是有限的：


    *   数字（Number）

    *   字符串（String）

    *   布尔值（Boolean）

    *   对象（Objects）

    *   数组（Array）

    *   空值（Null）


    *数字*可以是整数、浮点数或小数。它们*不应*包含在引号内。


    *字符串*（或文本或字符）可以是任何文本，并且*必须*包含在双引号内。


    *布尔值*简单地表示 true 或 false，并且必须用小写的 *true* 或 *false* 表示（例如，不能使用 yes/no 或 0/1）。


    JSON 元素可以是一个嵌套对象——它本身包含更多元素，例如键/值对。


    *数组*是一系列元素（字符串、数字、对象，甚至其他数组）。


    当你想定义一个完全空的值时，应将其定义为 *null*（小写，不带引号）。


    ## 结论


    本章带你踏上了创建和修改自定义 JSON 主题文件的旅程。你了解了如何在主题文件中以 JSON 形式添加颜色定义和通用文本属性。


    希望从本章开头简短文件到最终完整主题文件的演进过程，能让你相信构建 JSON 主题文件不必复杂或困难。由于主题文件的结构基于清晰的逻辑，稍加练习你就能转向更高级的格式定义。像本章中看到的那些具有默认视觉样式的简单主题，随后可以通过为各种类型的视觉效果添加标准元素的规范来进行扩展。这将是下一章的主题。


    # 4. 默认视觉样式


    定义核心 Power BI 仪表板格式化的下一步是配置一组高级呈现元素，这些元素可以覆盖仪表板视觉效果的大部分格式要求。这将确保仪表板的大部分（尽管可能并非全部）基本格式化工作仅通过应用一个
    JSON 主题文件即可完成。这是所谓的 80/20 规则的一个实际应用——80% 的格式化工作可以通用地进行，剩下的部分则手动格式化。


    在实践中，定义少量适用于一系列视觉效果的“默认”样式元素，往往比精确指定大约 30 个单独视觉效果的规范要有效得多。这是可能的，因为 Power BI 已经确保，视觉效果中与其他视觉效果共有的任何方面（例如，边框或背景），无论你正在调整的是*哪个*视觉效果，在
    Power BI Desktop 的格式窗格中都使用*相同*的格式化方法——并且这种共性也扩展到了 JSON 主题文件中。


    实际上，这种方法意味着你可以在主题文件中*仅一次*指定一个格式元素，然后它就会应用于*任何*支持该元素的视觉效果。例如，你可能希望为所有视觉效果定义边框和标题，然后为图表指定少量通用元素（如
    X 轴和 Y 轴定义），以及为表格指定核心元素，例如总计和值的格式。此外，你甚至不需要指定 Power BI 中某个视觉效果可用的全部格式化选项。也就是说，如果你只想定义需要标题（而不定义标题的任何其他特性），则可以将规范限定于这一个属性。


    所有这一切都可以通过手动制作的主题文件实现，在该文件中你定义视觉特性，*而无需指定*格式化必须应用于哪种视觉效果类型。JSON 格式将——即时且自动地——应用于*任何*包含你定义的属性的视觉效果。这种方法有三大优点：


    *   它简化了主题准备，因为你只需定义一次元素（而不是为每种特定视觉效果类型单独定义）。

    *   你可以根据需要，将格式化的定义设置为*详细或高级*，然后在 Power BI Desktop 中调整单个格式选项以增加完整性。

    *   你可以“以防万一”添加默认格式化。这是因为你添加的任何不被某种视觉效果类型*使用*的格式化（例如定义某种图表类型的某些详细元素）都不会阻止其他格式在被*另一种*图表类型支持的地方应用。


    此外，如果你愿意，之后可以在单个视觉效果层面上覆盖或扩展这些通用属性。这些技术将在第 5 章到第 12 章中介绍。


    在本章中，我们将逐步了解如何：


    *   定义大多数视觉效果类型共有的视觉元素

    *   定义大多数图表类型共有的元素

    *   定义表格元素


    创建默认视觉样式意味着理解 Power BI 中每个单独元素的 JSON 格式化。显然，这可能需要全面理解 JSON 主题文件创建的复杂性。因此，本章你将学习的是*原则*，即如何选择
    JSON 格式化代码的核心方面，以便在更抽象的层面上应用它们，从而使 JSON 能够塑造多个视觉效果的外观——*而无需逐个定义它们*。对每个单独视觉效果所有细节的深入了解将在本书后续部分进行。

