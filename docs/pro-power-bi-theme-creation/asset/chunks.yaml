  raw: '## Name and Color Settings


    A customized theme can define much more than simply the color palette. So, now
    that the basics have been explained, it is time to review all the customizable
    options that are available using the Power BI Desktop theme interface. These are
    all available in the dialog that you saw in Figure [2-2](#511180_1_En_2_Chapter.xhtml#Fig2).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig3_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    The Customize theme/Advanced tab


    *   *Name*: This field that appears at the top of the Customize theme/Name and
    colors tab (although it is not visible in Figure [2-2](#511180_1_En_2_Chapter.xhtml#Fig2))
    allows you to add a text description inside the actual JSON file. This can be
    useful for tracking the evolution of your definition of themes – or simply reminding
    you what a particular theme is used for.


    *   *Sentiment colors*: These are used in KPI and waterfall charts to indicate
    positive, negative, or neutral results.


    *   *Divergent colors*: These are used in conditional formatting to show when
    data falls inside a range.


    *   *Advanced* (colors): The advanced options allow you to set a series of six
    colors that will be applied to a wide range of Power BI dashboard elements. You
    can see the Customize theme/Advanced tab in Figure [2-3](#511180_1_En_2_Chapter.xhtml#Fig3).


    As the names of each of these color elements are somewhat abstract, here is the
    full list of the elements that each color setting will modify:


    *   *First-level elements*: (Labels background color (when outside data points),
    trend line color, textbox default color, table and matrix values and totals font
    colors, data bars axis color, card data labels, gauge callout value color, KPI
    goal color, KPI text color, slicer item color (when in focus mode), slicer dropdown
    item font color, slicer numeric input font color, slicer header font color, scatter
    chart ratio line color, line chart forecast line color, map leader line color,
    filter pane and card text color)


    *   *Second-level elements*: “Light” secondary text classes, label colors, legend
    label color, axis label color, table and matrix header font color, gauge target
    and target leader line color, KPI trend axis color, slicer slider color, slicer
    item font color, slicer outline color, line chart hover color, multi-row card
    title color, ribbon chart stroke color, shape map border color, button text font
    color, button icon line color, button outline color


    *   *Third-level elements*: Axis gridline color, table and matrix grid color,
    slicer header background color (when in focus mode), multi-row card outline color,
    shape fill color, gauge arc background color, applied filter card background color,
    disabled button outline color


    *   *Fourth-level elements*: Legend dimmed color, card category label color, multi-row
    card category labels color, multi-row card bar color, funnel chart conversion
    rate stroke color, disabled button text font color, disabled button icon line
    color


    *   *Background elements*: Labels background color (when inside data points),
    slicer dropdown items background color, donut chart stroke color, treemap stroke
    color, combo chart background color, button fill color, filter pane and available
    filter card background color


    *   *Secondary background elements*: Table and matrix grid outline color, shape
    map default color, ribbon chart ribbon fill color (when match series option is
    turned off), when background is not set to FFFFFF, the disabled button fill color,
    and the disabled button outline color


    To give you some idea of how these formats are applied, take a look at Figure
    [2-4](#511180_1_En_2_Chapter.xhtml#Fig4). Please note that this dashboard is not
    a complete reference – it just aims to show you how the principle of general color
    settings works.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig4_HTML.png](images/511180_1_En_2_Chapter/511180_1_En_2_Fig4_HTML.png)


    Figure 2-4


    Anatomy of high-level color customization


    ## Text Settings


    As you might expect, there is also a set of text formats that you can define as
    part of a custom theme. Again, to make defining the elements easier, they are
    subset into a number (four in this case) of distinct elements. These subelements
    are


    *   *General*: Formats table and matrix column headers, matrix row headers, table
    and matrix grid, table and matrix values


    *   *Title*: Formats category axis title, value axis title, multi-row card title,
    slicer header


    *   *Cards and KPIs*: Formats card data labels, KPI indicators


    *   *Tab headers*: Formats key influencers headers


    Each of the tables corresponding to one of these subelements allows you to set
    the


    *   Font


    *   Font size


    *   Font color


    Let’s look at each of these subelements individually.


    The Customize theme/Text/General tab looks like Figure [2-5](#511180_1_En_2_Chapter.xhtml#Fig5).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig5_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    The Customize theme/Text/General tab


    Note


    As you will see in subsequent chapters, this setting corresponds to the *label*
    element in JSON.


    The Customize theme/Text/Title tab looks like Figure [2-6](#511180_1_En_2_Chapter.xhtml#Fig6).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig6_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    The Customize theme/Text/Title tab


    Note


    As you will see in subsequent chapters, this setting corresponds to the *title*
    element in a JSON theme.


    The Customize theme/Text/Cards and KPIs tab looks like Figure [2-7](#511180_1_En_2_Chapter.xhtml#Fig7).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig7_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    The Customize theme/Text/Cards and KPIs tab


    Note


    As you will see in subsequent chapters, this setting corresponds to the *callout*
    element in JSON.


    The Customize theme/Text/Tab headers tab looks like Figure [2-8](#511180_1_En_2_Chapter.xhtml#Fig8).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig8_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    The Customize theme/Text/Tab headers tab


    Note


    As you will see in subsequent chapters, this setting corresponds to the *header*
    element in JSON.


    To give you some idea of how these text formats are applied, take a look at Figure
    [2-9](#511180_1_En_2_Chapter.xhtml#Fig9). Please note that this drawing is not
    a complete reference – once again, the idea is simply to show you how the principle
    of general color settings works.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig9_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig9_HTML.jpg)


    Figure 2-9


    Anatomy of high-level text customization


    Note


    You can see from this image that the colors defined in the name and colors section
    override colors set in the text section.'
  trans: '

    # 名称和颜色设置


    自定义主题所能定义的内容远不止调色板。因此，在解释了基础知识之后，现在是时候回顾一下使用 Power BI Desktop 主题界面时所有可用的自定义选项了。这些选项都出现在图
    2-2 所示的对话框中。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig3_HTML.jpg](img/511180_1_En_2_Fig3_HTML.jpg)


    图 2-3 “自定义主题/高级”选项卡


    - **名称**：此字段位于“自定义主题/名称和颜色”选项卡的顶部（尽管在图 2-2 中不可见），允许您在 JSON 文件内部添加文本描述。这对于跟踪主题定义的演变，或简单地提醒您某个特定主题的用途非常有用。


    - **情绪颜色**：这些颜色用于 KPI 和瀑布图，以指示正面、负面或中性结果。


    - **发散颜色**：这些颜色用于条件格式，以显示数据何时落在一个范围内。


    - **高级**（颜色）：高级选项允许您设置一系列六种颜色，这些颜色将应用于广泛的 Power BI 仪表板元素。您可以在图 2-3 中看到“自定义主题/高级”选项卡。


    由于这些颜色元素的名称有些抽象，以下是每个颜色设置将修改的元素的完整列表：


    - **一级元素**：（数据点外部标签背景色、趋势线颜色、文本框默认颜色、表和矩阵值及总计字体颜色、数据条轴线颜色、卡片数据标签、仪表标注值颜色、KPI 目标颜色、KPI
    文本颜色、切片器项目颜色（焦点模式时）、切片器下拉项字体颜色、切片器数字输入字体颜色、切片器标题字体颜色、散点图比率线颜色、折线图预测线颜色、地图引导线颜色、筛选器窗格和卡片文本颜色）


    - **二级元素**：“浅色”次要文本类、标签颜色、图例标签颜色、坐标轴标签颜色、表和矩阵标题字体颜色、仪表目标和目标引导线颜色、KPI 趋势轴颜色、切片器滑块颜色、切片器项目字体颜色、切片器轮廓颜色、折线图悬停颜色、多行卡片标题颜色、带状图表描边颜色、形状地图边框颜色、按钮文本字体颜色、按钮图标线条颜色、按钮轮廓颜色


    - **三级元素**：坐标轴网格线颜色、表和矩阵网格颜色、切片器标题背景色（焦点模式时）、多行卡片轮廓颜色、形状填充颜色、仪表弧背景颜色、已应用筛选器卡片背景颜色、禁用按钮轮廓颜色


    - **四级元素**：图例暗色、卡片类别标签颜色、多行卡片类别标签颜色、多行卡片条形颜色、漏斗图转换比描边颜色、禁用按钮文本字体颜色、禁用按钮图标线条颜色


    - **背景元素**：（数据点内部标签背景色、切片器下拉项背景颜色、环形图描边颜色、矩形树图描边颜色、组合图背景颜色、按钮填充颜色、筛选器窗格和可用筛选器卡片背景颜色）


    - **次要背景元素**：表和矩阵网格轮廓颜色、形状地图默认颜色、带状图表丝带填充颜色（当“匹配系列”选项关闭时）、当背景未设置为 `FFFFFF` 时，禁用按钮填充颜色和禁用按钮轮廓颜色


    为了让您了解这些格式是如何应用的，请看图 2-4。请注意，此仪表板并非完整参考——它仅旨在向您展示通用颜色设置原则的工作原理。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig4_HTML.png](img/511180_1_En_2_Fig4_HTML.png)


    图 2-4 高级颜色自定义结构分解


    ## 文本设置


    正如您可能期望的那样，还有一组文本格式可以定义为自定义主题的一部分。同样，为了使定义元素更容易，它们被细分为若干（此处为四个）不同的元素。这些子元素是：


    - **常规**：格式化表和矩阵列标题、矩阵行标题、表和矩阵网格、表和矩阵值


    - **标题**：格式化类别轴标题、数值轴标题、多行卡片标题、切片器标题


    - **卡片和 KPI**：格式化卡片数据标签、KPI 指示器


    - **选项卡标题**：格式化关键影响因素标题


    与这些子元素之一对应的每个表格都允许您设置：


    - 字体

    - 字号

    - 字体颜色


    让我们逐一查看这些子元素。


    “自定义主题/文本/常规”选项卡如图 2-5 所示。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig5_HTML.jpg](img/511180_1_En_2_Fig5_HTML.jpg)


    图 2-5 “自定义主题/文本/常规”选项卡


    **注意**：正如您将在后续章节中看到的，此设置对应于 JSON 中的 `label` 元素。


    “自定义主题/文本/标题”选项卡如图 2-6 所示。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig6_HTML.jpg](img/511180_1_En_2_Fig6_HTML.jpg)


    图 2-6 “自定义主题/文本/标题”选项卡


    **注意**：正如您将在后续章节中看到的，此设置对应于 JSON 主题中的 `title` 元素。


    “自定义主题/文本/卡片和 KPI”选项卡如图 2-7 所示。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig7_HTML.jpg](img/511180_1_En_2_Fig7_HTML.jpg)


    图 2-7 “自定义主题/文本/卡片和 KPI”选项卡


    **注意**：正如您将在后续章节中看到的，此设置对应于 JSON 中的 `callout` 元素。


    “自定义主题/文本/选项卡标题”选项卡如图 2-8 所示。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig8_HTML.jpg](img/511180_1_En_2_Fig8_HTML.jpg)


    图 2-8 “自定义主题/文本/选项卡标题”选项卡


    **注意**：正如您将在后续章节中看到的，此设置对应于 JSON 中的 `header` 元素。


    为了让您了解这些文本格式是如何应用的，请看图 2-9。请注意，此图示并非完整参考——同样，其目的仅仅是向您展示通用颜色设置原则的工作原理。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig9_HTML.jpg](img/511180_1_En_2_Fig9_HTML.jpg)


    图 2-9 高级文本自定义结构分解


    **注意**：您可以从图中看到，在名称和颜色部分定义的颜色会覆盖在文本部分设置的颜色。

