- fmt: '# Decomposition Tree Visual


    The penultimate visual that we will look at in this chapter is the decomposition
    tree visual. Once again, the formatting attributes that you can set in the theme
    file are intrinsically specific to this visual type.


    The keyword that specifies the formatting attributes of a decomposition tree visual
    is `decompositionTreeVisual`.


    Table [11-13](#511180_1_En_11_Chapter.xhtml#Tab13) outlines the JSON keywords
    that you can use when formatting decomposition tree visuals and the section that
    corresponds to each keyword in the Power BI Desktop format pane.


    **Table 11-13** Decomposition Tree Visual Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `analysis` | Analysis |

    | `tree` | Tree |

    | `dataBars` | Data bars |

    | `categoryLabels` | Category labels |

    | `dataLabels` | Data labels |

    | `levelHeader` | Tree |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet provides the JSON code used to pre-format a decomposition
    tree visual:


    ```

    "decompositionTreeVisual":

    {"*":

    {

    "general":  [{"responsive": true }],

    "analysis": [{

    "aiEnabled": true,

    "aiMode": "relative"

    }],

    "tree": [{

    "density": "sparse",

    "accentColor": { "solid": { "color": "#F5F4F0"}},

    "connectorDefaultColor": { "solid": { "color": "#118DFF"}},

    "connectorType": "round",

    "defaultClickAction": "toggle",

    "responsiveLayout": true,

    "barsPerLevel": 10

    }],

    "dataBars": [{

    "positiveBarColor": { "solid": { "color": "#12239E"}},

    "negativeBarColor": { "solid": { "color": "#DD001E"}},

    "dataBarBackgroundColor": { "solid": { "color": "#118DFF"}},

    "dataBarWidthPercent": 100,

    "dataBarScalingType": "topNode",

    "axisStart": null,

    "axisEnd": null

    }],

    "categoryLabels": [{

    "categoryLabelFontFamily": "Arial",

    "categoryLabelFontSize": 12,

    "categoryLabelFontColor": { "solid": { "color": "#808080"}}

    }],

    "dataLabels": [{

    "dataLabelFontFamily": "Arial",

    "dataLabelFontSize": 14,

    "dataLabelFontColor": { "solid": { "color": "#808080"}},

    "dataLabelDisplayUnits": 1000,

    "dataLabelPrecision": 1

    }],

    "levelHeader": [{

    "levelHeaderBackgroundColor": { "solid": { "color": "#000000"}},

    "levelTitleFontFamily": "Arial",

    "levelTitleFontSize": 20,

    "levelTitleFontColor": { "solid": { "color": "#808080"}},

    "showSubtitles": false,

    "levelSubtitleFontColor": { "solid": { "color": "#FFFFFF"}},

    "levelSubtitleFontFamily": "Arial",

    "levelSubtitleFontSize": 18

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `analysis` keyword that describes the analysis section uses the keywords shown
    in Table [11-14](#511180_1_En_11_Chapter.xhtml#Tab14).


    **Table 11-14** Keyword Mapping for the Analysis Section


    | Element | Keyword |

    | --- | --- |

    | Enable AI splits | `aiEnabled` |

    | Analysis type | `aiMode` |


    The `tree` keyword that describes the tree section uses the keywords shown in
    Table [11-15](#511180_1_En_11_Chapter.xhtml#Tab15).


    **Table 11-15** Keyword Mapping for the Tree Section


    | Element | Keyword |

    | --- | --- |

    | Density | `density` |

    | Primary color | `accentColor` |

    | Deselected connectors | `connectorDefaultColor` |

    | Connector shape | `connectorType` |

    | Default action | `defaultClickAction` |

    | Responsive | `responsiveLayout` |

    | Max bars shown | `barsPerLevel` |


    The `dataBars` keyword that describes the data bars section uses the keywords
    shown in Table [11-16](#511180_1_En_11_Chapter.xhtml#Tab16).


    **Table 11-16** Element Keyword Mapping for the Data Bars Section


    | Element | Keyword |

    | --- | --- |

    | Positive bar | `positiveBarColor` |

    | Negative bar | `negativeBarColor` |

    | Bar background | `dataBarBackgroundColor` |

    | Size | `dataBarWidthPercent` |

    | Scale to | `dataBarScalingType` |

    | Start | `axisStart` |

    | End | `axisEnd` |


    The `categoryLabels` keyword that describes the category labels section uses the
    keywords shown in Table [11-17](#511180_1_En_11_Chapter.xhtml#Tab17).


    **Table 11-17** Element Keyword Mapping for the Category Labels Section


    | Element | Keyword |

    | --- | --- |

    | Font family | `categoryLabelFontFamily` |

    | Text size | `categoryLabelFontSize` |

    | Text color | `categoryLabelFontColor` |


    The `dataLabels` keyword that describes the data labels section uses the keywords
    shown in Table [11-18](#511180_1_En_11_Chapter.xhtml#Tab18).


    **Table 11-18** Keyword Mapping for the Data Labels Section


    | Element | Keyword |

    | --- | --- |

    | Font family | `dataLabelFontFamily` |

    | Text size | `dataLabelFontSize` |

    | Text color | `dataLabelFontColor` |

    | Display units | `dataLabelDisplayUnits` |

    | Value decimal places | `dataLabelPrecision` |


    The `levelHeader` keyword that describes the level header section uses the keywords
    shown in Table [11-19](#511180_1_En_11_Chapter.xhtml#Tab19).


    **Table 11-19** Keyword Mapping for the Level Header Section


    | Element | Keyword |

    | --- | --- |

    | Background color | `levelHeaderBackgroundColor` |

    | Title font family | `levelTitleFontFamily` |

    | Title font size | `levelTitleFontSize` |

    | Title color | `levelTitleFontColor` |

    | Show subtitles | `showSubtitles` |

    | Subtitle font family | `levelSubtitleFontColor` |

    | Subtitle font size | `levelSubtitleFontFamily` |

    | Subtitle color | `levelSubtitleFontSize` |


    The `aiMode` keyword in the analysis section needs one of the attributes shown
    in Table [11-20](#511180_1_En_11_Chapter.xhtml#Tab20).


    **Table 11-20** AI Mode Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `absolute` | Absolute |

    | `relative` | Relative |


    The `density` keyword in the JSON for the tree needs one of the attributes shown
    in Table [11-21](#511180_1_En_11_Chapter.xhtml#Tab21).


    **Table 11-21** Density Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `dense` | Dense |

    | `default` | Default |

    | `sparse` | Sparse |


    The `connectorType` keyword in the JSON for the tree needs one of the attributes
    shown in Table [11-22](#511180_1_En_11_Chapter.xhtml#Tab22).


    **Table 11-22** Connector Type Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `default` | Default |

    | `round` | Round |


    The `defaultAction` keyword in the JSON for the tree needs one of the attributes
    shown in Table [11-23](#511180_1_En_11_Chapter.xhtml#Tab23).


    **Table 11-23** Default Action Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `toggle` | Collapse |

    | `click` | Default |


    The `dataBarScalingType` keyword in the JSON for the data bars needs one of the
    attributes shown in Table [11-24](#511180_1_En_11_Chapter.xhtml#Tab24).


    **Table 11-24** Data Bar Scaling Type Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `topNode` | Top node |

    | `parentNode` | Parent node |

    | `levelMaximum` | Level maximum |


    Conditional formatting is, again, not possible to define in the JSON theme file.


    Data label display units options are shown in Table [7-11](#511180_1_En_7_Chapter.xhtml#Tab11).


    You can find the JSON code for this in the sample file `Attributes_DecompositionTree.json`.'
