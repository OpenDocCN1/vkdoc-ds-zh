    # 筛选窗格


    令人惊讶的是——毕竟它并非可视化对象——但你也可以像在 Power BI Desktop 中交互式设置格式一样，在主题文件中设置筛选窗格的格式。


    没有单个关键词用于引入筛选窗格的格式属性。这是因为筛选窗格的格式是在**通用格式**级别设置的。你首次在第 4 章中遇到了这个概念。实际上，如果需要快速回顾通用格式的概念，建议参考第
    4 章。


    筛选窗格的格式在此级别使用两个关键词定义。它们是：


    * `outspacePane`

    * `filterCard`


    表 12-16 概述了可在筛选窗格格式中使用的 JSON 关键词。


    **表 12-16** 切片器关键词


    | 关键词 | 格式部分 |

    | --- | --- |

    | `outspacePane` | 筛选窗格 |

    | `filterCard` | 筛选卡片 |


    ```

