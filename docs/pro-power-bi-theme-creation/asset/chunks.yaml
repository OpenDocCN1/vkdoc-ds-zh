- fmt: '# Pie Chart


    This is certainly one of the simpler charts – and consequently maps to a correspondingly
    simple JSON theme file.


    The keyword that specifies the formatting attributes of a pie chart is`pieChart`.


    Table 9-1 outlines the JSON keywords that you can use in pie chart formatting
    and the section that corresponds to each keyword in the Power BI Desktop format
    pane.


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `labels` | Detail labels |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    You can find the JSON code for this in the sample file`Attributes_PieChart.json`.


    The following code snippet provides the JSON code used to pre-format a pie chart:


    ```

    "pieChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "labels": [{

    "show": true,

    "labelStyle": "All detail labels",

    "color": {"solid": {"color": "#000000"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 1,

    "percentageLabelPrecision": 1,

    "fontSize": 8,

    "fontFamily": "Arial",

    "position": "preferInside",

    "overflow": true,

    "background": "off"

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    Legend keywords are given in Table 7-2.


    The`labels`keyword that describes the detail labels section uses the keywords
    shown in Table 9-2.


    | Element | Keyword |

    | --- | --- |

    | Detail labels | `show` |

    | Label style | `labelStyle` |

    | Color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | % decimal places | `percentageLabelPrecision` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Label position | `position` |

    | Overflow text | `overflow` |

    | Background | `background` |


    The`labelStyle`keyword in the JSON that defines label style in a pie or a donut
    chart needs one of the attributes shown in Table 9-3.


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Category` | Category |

    | `DataValue` | Data value |

    | `Percent of total` | Percent of total |

    | `Category, data value` | Category, data value |

    | `Category, percent of total` | Category, percent of total |

    | `Data value, percent of total` | Data value, percent of total |

    | `All detail labels` | All detail labels |


    **Note:** Taking an approach that is slightly unusual in theme files, the values
    used to specify label style options contain spaces and punctuation.


    The`position`keyword in the JSON that defines label position in a pie or a donut
    chart needs one of the attributes shown in Table 9-4.


    | Value | Formatting Popup Option |

    | --- | --- |

    | `outside` | Outside |

    | `inside` | Inside |

    | `preferOutside` | Prefer outside |

    | `preferInside` | Prefer inside |


    **Note:** Interestingly, the values used to specify label position options have
    to be in camel case.


    The`background`keyword in the JSON that defines the background in a pie or a donut
    chart (in the labels section) needs one of the attributes shown in Table 9-5.


    | Value | Formatting Popup Option |

    | --- | --- |

    | `on` | On |

    | `off` | Off |


    Legend position options are described in Table 7-9.


    Label display units options are described in Table 7-11.


    # Donut Chart


    The donut chart is virtually identical to the pie chart as far as formatting is
    concerned. It has one additional feature, however. This is the`inner radius`(defined
    by the`slices`keyword) that you can see in the JSON that is given in the following.


    The keyword that specifies the formatting attributes of a scatter chart is`donutChart`.


    Table 9-6 outlines the JSON keywords that you can use in donut chart formatting
    and the section that corresponds to each keyword in the Power BI Desktop format
    pane.


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `slices` | Shapes |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet provides the JSON code used to pre-format a donut chart:


    ```

    "donutChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "labels": [{

    "show": true,

    "labelStyle": "All detail labels",

    "color": {"solid": {"color": "#000000"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 1,

    "fontFamily": "Arial",

    "fontSize": 8,

    "position": "preferInside"

    }],

    "slices": [{

    "innerRadiusRatio": 20

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    Legend keywords are given in Table 7-2.


    The`slices`keyword that is used in the shapes section uses the keywords shown
    in Table 9-7.


    | Element | Keyword |

    | --- | --- |

    | Inner radius | `innerRadiusRatio` |


    Legend keywords are given in Table 7-2.


    Legend position options are described in Table 7-9.


    Label display units options are described in Table 7-11.


    You can find the complete definition of a donut chart JSON formatting in the file`Attributes_Donut.json`.'
