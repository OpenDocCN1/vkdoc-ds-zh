    Please note that this figure is *not* a complete representation of the application
    of each of the text classes. It does, however, outline how text classes work.


    The JSON structure also needs some explanation, as this is the first time that
    you have encountered nested objects (i.e., sets of curly braces inside curly braces)
    in a theme file.


    As you can see, the core principle is still that of a key/value pair – that is,
    a keyword and a definition. However, the definition is a little more complex this
    time, as it is not merely a single element after the colon that follows the keyword
    but an entire object.


    You can see this schematically in Figure [3-5](#511180_1_En_3_Chapter.xhtml#Fig5).


    ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig5_HTML.jpg](images/511180_1_En_3_Chapter/511180_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Nested JSON objects


    The points to note are


    *   This time, each definition is a separate, nested object that begins and ends
    with *curly braces*.


    *   Inside each object are a series of key/value pairs that are *comma separated*
    (and without a comma after the final key/value pair).


    *   The key/value pair that makes up a text definition is, as is the case for
    simpler key/value pairs, *comma separated from other key/value pairs* at the “outer”
    level.


    *   *Numbers are not enclosed in double quotes*. As Power BI always expects that
    fonts will be defined in points, you do not need to specify anything other than
    the font size number (no need for “pt” or anything like that).


    *   Any *fonts* that you reference must be *spelled exactly as Windows expects*
    them and must, of course, exist in the system that is hosting the Power BI dashboard.


    JSON DATA TYPES


    Any values (the part after the colon in a name/value pair) must be a recognizable
    JSON data type.


    JSON has a limited available set of data types:


    *   Number


    *   String


    *   Boolean


    *   Objects


    *   Array


    *   Null


    *Numbers* can be integers, floating point, or decimals. They should *not* be enclosed
    in quotes.


    *Strings* (or text or characters) can be any text and *must* be enclosed in double
    quotes.


    *Boolean* simply means true or false – and have to be represented by the lowercase
    words *true* or *false* (not yes/no or 0/1, for instance).


    A JSON element can be a nested object – that itself contains further elements
    such as key/value pairs.


    *Arrays* are a series of elements (strings, numbers, objects, or even other arrays).


    When you want to define a completely empty value, it is defined as *null* (in
    lowercase – without quotes).


    ## Conclusion


    This chapter started you on the path to creating and modifying your own custom
    JSON theme files. You saw how to add color definition and generic text attributes
    as JSON in a theme file.


    Hopefully, the progression from the short file that this chapter began with to
    the final complete theme file has convinced you that crafting JSON theme files
    need not be complex or difficult. As the structure of a theme file is based on
    a clear logic, a little practice should enable you to move on to more advanced
    formatting definitions. Simple themes with default visual styles like those you
    saw in this chapter can subsequently be extended through adding specifications
    for standard elements across a range of types of visuals. This is the subject
    of the next chapter.


    # 4. Default Visual Styles


    The next step in defining core Power BI dashboard formatting is to configure a
    set of high-level presentation elements that can cover the majority of the formatting
    requirements of dashboard visuals. This will ensure that much (although possibly
    not all) of the essential formatting of a dashboard is carried out simply through
    applying a JSON theme file. This is a practical application of the so-called 80/20
    rule – where 80% of the formatting work can be done generically, leaving the rest
    to be formatted manually.


    In practice, it can often be extremely effective to define a handful of “default”
    stylistic elements that apply to a range of visuals rather than defining the exact
    specification for 30 or so separate visuals. This is made possible by the fact
    that Power BI has ensured that any aspect of a visual that is common to other
    visuals (think borders or backgrounds, for instance) uses the *same* formatting
    approach in Power BI Desktop format pane *whatever the visual* that you are tweaking
    – and this commonality is extended to the JSON theme files.


    What this approach means, practically, is that you can specify a format element
    *once only* in a theme file and nonetheless see it applied to *any visual* that
    supports it. For instance, you may want to define borders and titles for all visuals
    and then specify a handful of common elements (such as X and Y axis definitions)
    for charts as well as core table elements such as formatting totals and values.
    Moreover, you do not even have to specify the entire gamut of formatting that
    is available for a visual in Power BI. That is, if you only want to define that
    a title is required (without defining any other characteristics of the title),
    then you can limit the specification to this single attribute.


    All of this is possible through a hand-crafted theme file where you define visual
    characteristics *without* specifying which visual type the formatting must apply
    to. The JSON format will be applied – instantly and automatically – to *any visual*
    that contains the attributes that you define. There are three great things about
    this approach:


    *   It simplifies theme preparation, as you only define an element *once* (as
    opposed to defining it individually for each type of specific visual).


    *   You can make the definition of the formatting as *detailed or high level*
    as you wish and then tweak individual format options in Power BI Desktop to add
    completeness.


    *   You can add default formatting “in case.” This is because any formatting that
    you add that is *not* used by a visual type (such as defining certain detailed
    elements of a certain chart type) will not prevent other formats being applied
    where they *are* supported by a different chart type.


    What is more, you can subsequently overwrite or extend these common attributes
    at the level of each individual visual if you so wish. These techniques are described
    in Chapters [5](#511180_1_En_5_Chapter.xhtml) through [12](#511180_1_En_12_Chapter.xhtml).


    In this chapter, we will, progressively, see how to


    *   Define visual elements common to most types of visual


    *   Define elements common to most chart types


    *   Define table elements


    Creating default visual styles means understanding the JSON formatting of each
    individual element in Power BI. Clearly, this can require a full understanding
    of the intricacies of JSON theme file creation. So, what you will be learning
    in this chapter is the *principle* of how to select core aspects of JSON formatting
    code in order to apply them at a more abstract level so that the JSON can shape
    the presentation of multiple visuals – *without having to define each one individually*.
    The in-depth appreciation of all the details specific to each individual visual
    will come later in the book.



    ---


    Please note that this figure is *not* a complete representation of the application
    of each of the text classes. It does, however, outline how text classes work.


    The JSON structure also needs some explanation, as this is the first time that
    you have encountered nested objects (i.e., sets of curly braces inside curly braces)
    in a theme file.


    As you can see, the core principle is still that of a key/value pair – that is,
    a keyword and a definition. However, the definition is a little more complex this
    time, as it is not merely a single element after the colon that follows the keyword
    but an entire object.


    You can see this schematically in Figure [3-5](#511180_1_En_3_Chapter.xhtml#Fig5).


    ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig5_HTML.jpg](images/511180_1_En_3_Chapter/511180_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Nested JSON objects


    The points to note are


    *   This time, each definition is a separate, nested object that begins and ends
    with curly braces.


    *   Inside each object are a series of key/value pairs that are comma separated
    (and without a comma after the final key/value pair).


    *   The key/value pair that makes up a text definition is, as is the case for
    simpler key/value pairs, comma separated from other key/value pairs at the “outer”
    level.


    *   Numbers are not enclosed in double quotes. As Power BI always expects that
    fonts will be defined in points, you do not need to specify anything other than
    the font size number (no need for “pt” or anything like that).


    *   Any fonts that you reference must be spelled exactly as Windows expects them
    and must, of course, exist in the system that is hosting the Power BI dashboard.


    ## JSON Data Types


    Any values (the part after the colon in a name/value pair) must be a recognizable
    JSON data type.


    JSON has a limited available set of data types:


    *   Number


    *   String


    *   Boolean


    *   Objects


    *   Array


    *   Null


    Numbers can be integers, floating point, or decimals. They should not be enclosed
    in quotes.


    Strings (or text or characters) can be any text and must be enclosed in double
    quotes.


    Boolean simply means true or false – and have to be represented by the lowercase
    words true or false (not yes/no or 0/1, for instance).


    A JSON element can be a nested object – that itself contains further elements
    such as key/value pairs.


    Arrays are a series of elements (strings, numbers, objects, or even other arrays).


    When you want to define a completely empty value, it is defined as null (in lowercase
    – without quotes).


    ## Conclusion


    This chapter started you on the path to creating and modifying your own custom
    JSON theme files. You saw how to add color definition and generic text attributes
    as JSON in a theme file.


    Hopefully, the progression from the short file that this chapter began with to
    the final complete theme file has convinced you that crafting JSON theme files
    need not be complex or difficult. As the structure of a theme file is based on
    a clear logic, a little practice should enable you to move on to more advanced
    formatting definitions. Simple themes with default visual styles like those you
    saw in this chapter can subsequently be extended through adding specifications
    for standard elements across a range of types of visuals. This is the subject
    of the next chapter.


    # 4. Default Visual Styles


    The next step in defining core Power BI dashboard formatting is to configure a
    set of high-level presentation elements that can cover the majority of the formatting
    requirements of dashboard visuals. This will ensure that much (although possibly
    not all) of the essential formatting of a dashboard is carried out simply through
    applying a JSON theme file. This is a practical application of the so-called 80/20
    rule – where 80% of the formatting work can be done generically, leaving the rest
    to be formatted manually.


    In practice, it can often be extremely effective to define a handful of “default”
    stylistic elements that apply to a range of visuals rather than defining the exact
    specification for 30 or so separate visuals. This is made possible by the fact
    that Power BI has ensured that any aspect of a visual that is common to other
    visuals (think borders or backgrounds, for instance) uses the same formatting
    approach in Power BI Desktop format pane whatever the visual that you are tweaking
    – and this commonality is extended to the JSON theme files.


    What this approach means, practically, is that you can specify a format element
    once only in a theme file and nonetheless see it applied to any visual that supports
    it. For instance, you may want to define borders and titles for all visuals and
    then specify a handful of common elements (such as X and Y axis definitions) for
    charts as well as core table elements such as formatting totals and values. Moreover,
    you do not even have to specify the entire gamut of formatting that is available
    for a visual in Power BI. That is, if you only want to define that a title is
    required (without defining any other characteristics of the title), then you can
    limit the specification to this single attribute.


    All of this is possible through a hand-crafted theme file where you define visual
    characteristics without specifying which visual type the formatting must apply
    to. The JSON format will be applied – instantly and automatically – to any visual
    that contains the attributes that you define. There are three great things about
    this approach:


    *   It simplifies theme preparation, as you only define an element once (as opposed
    to defining it individually for each type of specific visual).


    *   You can make the definition of the formatting as detailed or high level as
    you wish and then tweak individual format options in Power BI Desktop to add completeness.


    *   You can add default formatting “in case.” This is because any formatting that
    you add that is not used by a visual type (such as defining certain detailed elements
    of a certain chart type) will not prevent other formats being applied where they
    are supported by a different chart type.


    What is more, you can subsequently overwrite or extend these common attributes
    at the level of each individual visual if you so wish. These techniques are described
    in Chapters [5](#511180_1_En_5_Chapter.xhtml) through [12](#511180_1_En_12_Chapter.xhtml).


    In this chapter, we will, progressively, see how to


    *   Define visual elements common to most types of visual


    *   Define elements common to most chart types


    *   Define table elements


