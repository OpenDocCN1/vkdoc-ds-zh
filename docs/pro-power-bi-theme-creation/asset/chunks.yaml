    在深入探究技术产品那晦涩深奥的细节时，人们很容易忘记一本书的主要目标。幸运的是，我的好友兼前同事，技术审阅人娜塔莉·杰恩·赫格，不辞辛劳地帮助我始终聚焦于本书的目标。她还分享了她在企业中运用
    Power BI Desktop 的丰富经验，她的评论和建议给了我巨大的帮助。


    最后，我最深的感激之情必须献给为本书付出最多的两个人。他们是我的妻子和儿子，他们总是鼓励我坚持不懈，并给予了我所能期望的一切支持和鼓励。能拥有他们俩，我无比幸运。


    关于作者 关于技术审阅人


    # 1. Power BI 主题简介


    在创建引人注目、赋能用户的仪表板方面，Power BI 已风靡全球。它凭借其易用性、广泛的连接选项以及多样化的可视化效果，在分析领域占据了主导地位。


    然而，格式化（以及重新格式化）仪表板可视化效果可能既耗时又重复——同样，标准化多个仪表板的呈现方式，为一套报表创建统一的外观和风格也是如此。大多数用户更愿意将时间花在分析和交付有意义的见解上，而不是为图表和表格应用颜色和字体选择。


    这正是 Power BI *主题*的创建和应用发挥作用之处。主题是对仪表板部分或全部格式的标准化定义。其范围可以从定义调色板和一系列字体选择，到每个可视化效果的详细规范。应用主题可以让你*即时*格式化仪表板中几乎每一个可视化效果。更重要的是，你随后对主题所做的任何更改，只需点击几下即可重新应用，以更新仪表板的呈现方式。主题可以创建一次，然后应用于几十个甚至数百个
    Power BI 仪表板，从而确保整个部门甚至整个组织内呈现风格的一致性和严格的标准化。


    主题可以像你要求的那样简单或详细。它们可以指定标准化的字体、文本颜色和字号，或者设定每种可视化效果类型格式化时的最细微细节。事实上，主题被设计为在多个层级上工作——从通用元素开始，然后逐步深入到仪表板中每个元素呈现方式的严格定义。这为你定义如何标准化
    Power BI 仪表板提供了多种选择。


    ## 主题基础


    从技术上讲，主题是 JSON 文件。也就是说，它们使用 JSON（JavaScript 对象表示法）格式来存储仪表板对象如何格式化的定义。但如果你以前从未使用过，甚至从未听说过
    JSON，也不必担心，因为我将在本书中解释你需要了解的所有内容。目前只需记住一点：主题之于 Power BI，就像外部样式表（非常类似于 Microsoft
    Word 使用的样式表）。使用外部文件定义格式的优势在于，你可以简单地将主题作为小的文本文件发送给同事，他们只需点击几下即可将其应用到自己的任何 Power
    BI 仪表板中。主题也可以集成到 Power BI 模板中，从而进一步加快仪表板的创建过程。


    主题应用于 Power BI Desktop 文件。加载后，它们就成为 Power BI Desktop `.pbix` 文件的一个不可分割的组成部分。当然，当你发布仪表板时，这些格式也会随之带入
    Power BI 服务。此外，你可以通过几次点击在不同的主题文件之间切换，以尝试不同的格式化方法或应用完全不同的外观和风格。同样幸运的是，应用主题文件并非一成不变，因为你随时可以切换到基于另一个主题的
    Power BI 呈现风格。因此，你可以自由地尝试不同的风格，直到找到适合你正在创建的特定仪表板的外观和感觉。


    一个主题允许你预设 Power BI 格式窗格中定义的几乎所有内容。因此，它可以包含以下内容的格式定义：


    *   调色板

    *   页面

    *   插入的对象（文本框、形状、按钮和图像）

    *   内置可视化效果（表格、图表、地图和其他可视化效果）


    你甚至可以将主题应用于 Power BI Desktop 的“筛选器”窗格。原理很简单：如果你可以在 Power BI Desktop 的格式窗格中更改呈现方式，那么你就可以使用主题文件来定义该格式。


    仪表板主题的可移植性意味着现在有大量不同的主题可供免费使用，以增强 Power BI 仪表板的呈现效果。你甚至可能体验过一些主题，这些主题作为 Power
    BI Desktop 的组成部分提供，或通过 Web 共享。


    在阅读本书并学习如何创建这些主题后，你也能开发出可供分享的主题——与朋友、同事，甚至全世界分享。


    ## 主题剖析


    从一开始就理解主题在两个不同层面运作是很重要的。首先，主题可以被定义为以“通用”方式运作。也就是说，你可以定义一组高级规范来设定仪表板及其包含的可视化效果的核心方面，而无需深入细节。通过这种方式，你可以快速轻松地定义：


    *   颜色

    *   标准字体属性

    *   所有可视化效果的共享元素

    *   特定于某些可视化效果类型的特定元素


    你将在第 3 章中了解如何创建“通用”主题。


    然后，在更细节的层面（一旦你对主题的工作方式有了透彻的理解），你可以指定*每种可视化效果的每个元素的精确格式*，从而完全控制仪表板中每个元素的外观。从第 5
    章到第 12 章的主题是在单个可视化效果层面所需的 JSON 的深入定义。


    然而，不要以为你必须在两种不同的方法之间做出选择。事实是，一个主题 JSON 文件可以“混合搭配”这两种方法，这样你既可以定义一组整体的风格原则，*同时*也可以添加针对你希望在仪表板中如何显示某些可视化效果的高度具体定义。原则始终是，除非在主题文件中找到了更详细的定义，否则将应用更通用层级的格式。

