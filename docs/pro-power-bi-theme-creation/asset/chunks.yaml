    }

    ```


    In practice, of course, a complete JSON theme file could contain the specification
    of dozens of visuals. However, I wanted to show you how the code for a visual
    fits into the overall structure of a theme file, as well as showing you the precise
    code that you can adjust to define the presentation of a specific visual. You
    can, of course, take the code for the textbox object and add it to any existing
    theme file – or replace the definition of the textbox, in whole or in part, by
    this code in an existing theme file.


    So, what are you looking at here?


    The first thing to note is that all visuals are defined as part of the `visualStyles`
    object. That is, the keyword `visualStyles` is followed by a colon and a pair
    of curly braces that contain further objects.


    The second point is that all visual definitions are contained inside a second
    object – currently defined as an asterisk. This is nothing more than an empty
    object reserved for future use. So the actual visual definition is nested inside
    two outer objects.


    The third point is that the definition of a visual is also an object – as you
    can see, it is contained inside curly braces. In the case of the textbox visual,
    the keyword that introduces the object is `textbox`. This is highlighted in boldface
    in the preceding JSON code. The nested keywords inside the `textbox` object that
    introduce the actual formatting for an element in a textbox are highlighted in
    italics to draw your attention to how the structure is defined.


    The final important point is that the JSON for a specific visual consists of mapping
    the Power BI Desktop formatting pane section elements to the JSON keyword that
    you have to use to specify the section element to format in the theme file.


    Table 5-1 describes the JSON keyword that corresponds to each section in the Power
    BI Desktop format pane.


    **Table 5-1** Textbox Formatting Elements


    | Keyword | Formatting Section |

    | --- | --- |

    | `General` | General |

    | `Title` | Title |

    | `Background` | Background |

    | `lockAspect` | Lock aspect |

    | `Border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    You can see that a textbox actually contains no element that is specific to a
    textbox. All seven key/value pairs actually describe elements that are found in
    most visuals. The reason the JSON for a textbox describes nothing other than these
    seven elements is because the text inside a textbox is essentially formatted specifically
    for each textbox that you create.


    To begin the detailed explanation of items that can be formatted, the starting
    point is the on/off switch in the formatting pane. This is common to many elements
    and is always represented by the following JSON:


    ```json

    "show": true

    ```


    or (to switch it off)


    ```json

    "show": false

    ```


    Other elements are, necessarily, more specific. Let’s look at these in turn.


    The `title` keyword that describes the title section uses the keywords shown in
    Table 5-2.


    **Table 5-2** Keyword Mapping for Titles


    | Element | Keyword |

    | --- | --- |

    | Title | `show` |

    | Title text | `text` |

    | Word wrap | `titleWrap` |

    | Font color | `fontColor` |

    | Background color | `background` |

    | Alignment | `alignment` |

    | Font size | `fontSize` |

    | Font family | `fontFamily` |


    The `background` keyword that describes the background section uses the keywords
    shown in Table 5-3.


    **Table 5-3** Keyword Mapping for Background


    | Element | Keyword |

    | --- | --- |

    | Color | `Color` |

    | Transparency | `transparency` |


    The `lockAspect` keyword that describes the lock aspect section uses the keywords
    shown in Table 5-4.


    **Table 5-4** Keyword Mapping for Lock Aspect


    | Element | Keyword |

    | --- | --- |

    | Lock aspect | `show` |


    The `border` keyword that describes the border section uses the keywords shown
    in Table 5-5.


    **Table 5-5** Keyword Mapping for Border


    | Element | Keyword |

    | --- | --- |

    | Border | `show` |

    | Transparency | `transparency` |


    The `shadow` keyword that describes the shadow section uses the keywords shown
    in Table 5-6.


    **Table 5-6** Keyword Mapping for Shadow


    | Element | Keyword |

    | --- | --- |

    | Shadow | `show` |

    | Color | `color` |

    | Shadow position | `position` |

    | Preset | `Preset` |


    The `visualHeader` keyword that describes the visual header section uses the keywords
    shown in Table 5-7.


    **Table 5-7** Keyword Mapping for the Visual Header


    | Element | Keyword |

    | --- | --- |

    | Background | `Background` |

    | Border | `Border` |

    | Transparency | `Transparency` |

    | Icon color | `Foreground` |

    | Visual information icon | `showVisualInformationButton` |

    | Visual warning icon | `showVisualWarningButton` |

    | Visual error icon | `showVisualErrorButton` |

    | Drill on dropdown | `showDrillRoleSelector` |

    | Drill down icon | `showDrillToggleButton` |

