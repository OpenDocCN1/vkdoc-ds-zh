- fmt: '# 6. Card and Table Visual Styles


    To extend your knowledge of JSON formatting, it is time to move on to a few of
    the core data-driven visuals. A useful set to look at is


    * Card

    * Multi-row card

    * Table

    * Matrix


    I am handling this group of visuals in a specific order, as I prefer to start
    with the simplest and move on to progressively more complex visuals in the course
    of the chapter. This should also help you to understand how to build up your knowledge
    as JSON themes are defined using repeated – or largely similar – elements.


    Each of the four visuals discussed in this chapter has a separate JSON file in
    the samples folder that contains the code that you can use to define your own
    theme files.


    ## Card


    One of the simplest visuals (which means mercifully simple JSON in the theme file)
    is the card visual. The keyword that introduces card formatting attributes is
    `card`.


    Table 6-1 describes the JSON keyword that corresponds to each formatting section
    in Power BI Desktop.


    **Table 6-1** Card Formatting Elements


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `labels` | Data label |

    | `categoryLabels` | Category label |

    | `wordwrap` | Wordwrap |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualTooltip` | Tooltip |

    | `visualHeader` | Visual header |


    The following code snippet gives you the core elements used to specify standard
    card formatting. The sample file `Attributes_Card.json` contains all the elements
    that can be set for a card in a theme file.


    ```json

    "card":

    {"*":

    {

    "general": [{... code not shown ...}]

    "labels":   [{

    "color": {"solid": {"color": "#12239E"}},

    "labelDisplayUnits": 1000,

    "labelPrecision": 2,

    "fontSize": 36,

    "fontFamily": "Arial",

    "preserveWhitespace": false

    }],

    "categoryLabels":  [{

    "show": true,

    "color": {"solid": {"color": "#12239E"}},

    "fontSize": 24,

    "fontFamily": "Arial"

    }],

    "wordwrap": [{

    "show": true

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip":[{

    "show": true,

    "titleFontColor":{"solid":{"color":"#E8E8E8"}},

    "valueFontColor":{"solid":{"color":"#FFFFFF"}},

    "fontSize": 11,

    "fontFamily": "Arial Black",

    "background":{"solid":{"color":"#938888"}},

    "transparency": 30

    }],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `labels` keyword that describes the data label section uses the keywords shown
    in Table 6-2.


    **Table 6-2** Keyword Mapping for Data Labels


    | Element | Keyword |

    | --- | --- |

    | Color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Source spacing | `preserveWhitespace` |


    The `categoryLabels` keyword that describes the category labels section uses the
    keywords shown in Table 6-3.


    **Table 6-3** Keyword Mapping for Category Labels


    | Element | Keyword |

    | --- | --- |

    | Category labels | `show` |

    | Color | `color` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |


    The `wordWrap` keyword that describes the word wrap section uses the keywords
    shown in Table 6-4.


    **Table 6-4** Keyword Mapping for Word Wrap


    | Element | Keyword |

    | --- | --- |

    | Word wrap | `show` |


    The `visualTooltip` keyword that describes the tooltip section uses the keywords
    shown in Table 6-5.


    **Table 6-5** Keyword Mapping for Tooltips


    | Element | Keyword |

    | --- | --- |

    | Tooltip | `show` |

    | Label color | `titleFontColor` |

    | Value color | `valueFontColor` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Background color | `background` |

    | Transparency | `transparency` |


    ## Multi-row Card


    Multi-row cards are in many ways an extension of the card theme, but are nonetheless
    sufficiently different to require a set of separate formatting elements.


    The keyword that specifies multi-row card formatting attributes is `multiRowCard`.


    Table 6-6 outlines the JSON keywords that you can use in multi-row card formatting.


    **Table 6-6** Multi-row Card Formatting Elements


    | Keyword | Formatting Section |

    | --- | --- |

    | `General` | General |

    | `dataLabels` | Data labels |

    | `categoryLabels` | Category labels |

    | `cardTitle` | Card title |

    | `Card` | Card |

    | `Title` | Title |

    | `Background` | Background |

    | `lockAspect` | Lock aspect |

    | `Border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The complete JSON required to format a multi-row card can be found in the sample
    file `Attributes_MultiRowCard.json`. You can see the elements that are specific
    to this visual type in the following code snippet:


    ```json

    "multiRowCard":

    {"*":

    {

    "general": [{... code not shown ...}]

    "dataLabels": [{

    "color": {"solid": {"color": "#12239E"}},

    "fontSize": 10,

    "fontFamily": "Arial"

    }],

    "categoryLabels":   [{

    "show": true,

    "color": {"solid": {"color": "#12239E"}},

    "fontSize": 20,

    "fontFamily": "Arial"

    }],

    "cardTitle":    [{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "fontSize": 16,

    "fontFamily": "Arial"

    }],

    "card":   [{

    "outline": "BottomOnly",

    "outlineColor": {"solid": {"color": "#12239E"}},

    "outlineWeight": 3,

    "barShow": true,

    "barColor": {"solid": {"color": "#12239E"}},

    "barWeight": 5,

    "cardPadding": 15,

    "cardBackground": {"solid": {"color": "#F5F4F0"}}

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The `dataLabels` keyword that describes the data labels section uses the keywords
    shown in Table 6-7.


    **Table 6-7** Keyword Mapping for Data Labels


    | Element | Keyword |

    | --- | --- |

    | Color | `color` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |


    The category labels section for a multi-row card can be found in Table 6-3.


    The `cardTitle` keyword that describes the card title section uses the keywords
    shown in Table 6-8.


    **Table 6-8** Keyword Mapping for Card Titles


    | Element | Keyword |

    | --- | --- |

    | Color | `fontcolor` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |


    The `card` keyword that describes the card section uses the keywords shown in
    Table 6-9.


    **Table 6-9** Keyword Mapping for Card Elements


    | Element | Keyword |

    | --- | --- |

    | Outline | `outline` |

    | Outline color | `outlineColor` |

    | Outline weight | `outlineWeight` |

    | Show bar | `barShow` |

    | Bar color | `barColor` |

    | Bar thickness | `barWeight` |

    | Padding | `cardPadding` |

    | Background | `cardBackground` |


    The `outline` keyword in the JSON that is used in the card section needs one of
    the attributes shown in Table 6-10.


    **Table 6-10** Card Outline Style Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `None` | None |

    | `BottomOnly` | Bottom only |

    | `TopOnly` | Top only |

    | `LeftOnly` | Left only |

    | `RightOnly` | Right only |

    | `TopBottom` | Top + bottom |

    | `LeftRight` | Left + right |

    | `Frame` | Frame |


    **Note** Once again, the spelling of the formatting has to be exactly as given
    in the preceding tables. If you add spaces or do not respect the capitalization,
    then the table style will not be applied. The default value will be applied instead.'
