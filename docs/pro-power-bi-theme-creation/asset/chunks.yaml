    Exactly which JSON corresponds to what formatted element is the subject of the
    remainder of this book.


    You may well be wondering what the outcome of all the effort that went in to creating
    a customized theme is. So, Figure [2-20](#511180_1_En_2_Chapter.xhtml#Fig20) shows
    a dashboard page once the theme file PBIDesktopCustomizedTheme.json has been applied
    (using View ➤ Themes ➤ Browse for themes, if you remember from Chapter [1](#511180_1_En_1_Chapter.xhtml)).
    Absolutely no other specific formatting has been applied – that is, all the formatting
    has been sourced from the JSON file and applied across all the visuals that have
    been added as well as to the underlying page and the Filter pane.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig20_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig20_HTML.jpg)


    Figure 2-20


    A Power BI dashboard with a customized theme applied


    When creating your own JSON theme using the Power BI Desktop interface, you need
    to be aware that


    *   Power BI Desktop *only* creates the JSON for any elements that you modify.
    It will not create a theme file that defines all the elements that are capable
    of being set using the Customize current theme dialog. That is, the JSON output
    will not include any settings that you have *not* modified in the various dialogs.
    This makes for simpler, more concise theme files.


    *   Any theme file can now be applied to an existing or blank Power BI Desktop
    file simply by selecting View ➤ Themes ➤ Browse for themes – and navigating to
    the JSON file that you saved previously.


    *   A theme file will only apply formatting if an element has *not* already been
    formatted using the Format pane in Power BI Desktop. You will have to click Revert
    to default for each card name in each visual where you wish to remove any previously
    applied custom formatting.


    ## Conclusion


    In this chapter, you learned how to create and modify a JSON theme for Power BI
    entirely interactively using Power BI Desktop. Indeed, despite not being a completely
    granular definition of your formatting requirements, this approach might be all
    you ever need to define a perfectly usable theme file for your organization or
    individual requirements.


    However, there is much, much more that can be done to create finely tuned themes
    that cover absolutely all the formatting possibilities that are present in Power
    BI. So, now that your appetite is whetted, it is time to move on to some progressively
    more detailed examples.'
  trans: '

    # 关于主题文件


    你已经创建了一个 JSON 格式的自定义主题文件。但这具体是什么样的呢？嗯，示例文件 `PBIDesktopCustomizedTheme.json` 可供参考。你可以在图
    2-19 中看到它的样子。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig19_HTML.jpg](img/511180_1_En_2_Fig19_HTML.jpg)


    *图 2-19：由 Power BI Desktop 创建的 JSON 文件*


    我相信你会同意，Power BI Desktop 生成的 JSON 非常难看且难以阅读。不过，有一些方法可以让 JSON 看起来更美观、更易读。


    为了让生成的主题文件中的 JSON 更易于阅读，我建议你使用搜索引擎，搜索类似“JSON 美化”的内容。你会找到许多网站，只需点击几下，就能将这样的 JSON
    转化为一个更美观的版本。


    几秒钟后，生成的 JSON 看起来就会像下面代码片段中展示的那样：


    ```

