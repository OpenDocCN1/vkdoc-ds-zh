  trans: "\n# 常见视觉元素\n\nPower BI 仪表板中的大多数（甚至所有）视觉对象都包含一系列通用元素。这些元素包括：\n- 背景\n- 标题\n\
    - 边框\n- 阴影\n- 工具提示\n- 视觉对象标头\n- 锁定纵横比\n\n你可能已经习惯使用 Power BI 格式设置窗格反复设置这些元素——说实话，确实如此。\n\
    \n这些格式元素由以下 JSON 主题关键字定义：\n\n- `background`：设置视觉对象格式窗格“背景”卡片中的所有属性，并为页面设置背景\n\
    - `title`：设置视觉对象格式窗格“标题”卡片中的所有属性\n- `border`：设置视觉对象格式窗格“边框”卡片中的所有属性\n- `shadow`：设置视觉对象格式窗格“阴影”卡片中的所有属性\n\
    - `visualTooltip`：设置视觉对象格式窗格“工具提示”卡片中的所有属性\n- `visualHeader`：设置视觉对象格式窗格“视觉对象标头”卡片中的所有属性\n\
    - `lockAspect`：设置视觉对象格式窗格“锁定纵横比”卡片中的所有属性\n\n因此，现在是时候使用 JSON 在主题中定义这些通用元素了。与本书中大多数格式化\
    \ Power BI 仪表板的方法一样，最好的做法是先查看 JSON 代码，然后在看到代码后解释其工作原理。以下是一个代码片段（新元素以**粗体**显示），它为大多数视觉对象通用的元素添加了一些核心视觉对象默认格式。\n\
    \n为了节省页面空间，此代码片段隐藏了之前看到的部分 JSON。完整代码位于文件 `ColorAndTextClassesWithCoreVisualDefaults.json`\
    \ 中。\n\n在此代码片段中，你可以看到斜体关键字对应于 Power BI 格式设置窗格中的各部分：\n\n- `title` 关键字对应“标题”部分。\n\
    - `lockAspect` 关键字对应“锁定纵横比”部分。\n- `border` 关键字对应“边框”部分。\n- `dropShadow` 关键字对应“阴影”部分。\n\
    - `visualHeader` 关键字对应“视觉对象标头”部分。\n\n```json\n{\n  \"name\": \"Common elements\"\
    ,\n  \"dataColors\": [\"#12239E\", \"#118DFF\", \"#00FF29\", \"#6B007B\", \"#FFB000\"\
    , \"#F5F4F0\", \"#FFFF00\", \"#FF001E\"],\n  --- 颜色和文本类代码未显示 ---\n  \"visualStyles\"\
    :\n  {\"*\":\n  {\"*\":\n  {\n    \"title\": [{\n      \"show\": true,\n     \
    \ \"text\": \"Visual Title\",\n      \"fontColor\": {\"solid\": {\"color\": \"\
    #ffffff\"}},\n      \"background\": {\"solid\": {\"color\": \"#12239E\"}},\n \
    \     \"alignment\": \"Center\",\n      \"fontSize\": 8,\n      \"fontFamily\"\
    : \"Arial\"\n    }],\n    \"lockAspect\": [{\n      \"show\": false\n    }],\n\
    \    \"border\":   [{\n      \"show\": true,\n      \"color\": {\"solid\": {\"\
    color\": \"#F5F4F0\"}}\n    }],\n    \"dropShadow\":   [{\n      \"show\": true,\n\
    \      \"color\": {\"solid\": {\"color\": \"#E8E8E8\"}},\n      \"position\":\"\
    Outer\",\n      \"preset\":\"TopLeft\"\n    }],\n    \"visualHeader\": [{\n  \
    \    \"show\": true,\n      \"background\": {\"solid\": {\"color\": \"#ffffff\"\
    }},\n      \"border\": {\"solid\": {\"color\": \"#F5F4F0\"}},\n      \"transparency\"\
    : 10,\n      \"foreground\": {\"solid\": {\"color\": \"#000000\"}},\n      \"\
    showVisualInformationButton\": false,\n      \"showVisualWarningButton\": false,\n\
    \      \"showVisualErrorButton\": false,\n      \"showDrillRoleSelector\": true,\n\
    \      \"showDrillToggleButton\": false,\n      \"showDrillUpButton\": false,\n\
    \      \"showDrillDownLevelButton\": false,\n      \"showDrillDownExpandButton\"\
    : false,\n      \"showPinButton\": false,\n      \"showFocusModeButton\": false,\n\
    \      \"showFilterRestatementButton\": false,\n      \"showSeeDataLayoutToggleButton\"\
    : false,\n      \"showOptionsMenu\": false,\n      \"showTooltipButton\": true\n\
    \    }]\n  }\n  }\n  }\n}\n```\n\n现在来对这段特定的 JSON 做一些解释：\n\n- 每个 JSON 属性对应于 Power\
    \ BI Desktop 中格式设置窗格特定部分中的一个元素。\n- 定义键/值对的核心方法仍然有效。但是，正如你所见，每个值设置都被定义为一个包含一个或多个对象的*数组*。也就是说，每个定义都以方括号和花括号开头，并以花括号后跟方括号结束。\n\
    - 某些对象包含进一步嵌套的对象——即花括号内的内部元素集，有时嵌套深度达三层。\n- 这段 JSON 代码中还有一些新的内容。你正在引用通过 Power\
    \ BI Desktop 中的弹出菜单所做的选择来格式化元素，例如：\n  - 标题对齐方式\n  - 阴影位置\n  - 阴影预设\n- 你需要知道，*每个\
    \ JSON 关键字的拼写都必须准确无误*——并且必须始终用双引号括起来。当然，如果你不想猜测定义，可以查阅描述你想要格式化的视觉对象的章节。\n- 关于这些定义的好消息是，拼错某一个并不会导致\
    \ JSON 文件加载失败。唯一可能发生的是，该实际属性将不会被格式化，并且在 JSON 主题文件加载后保持默认格式。\n- 你可以看到，虽然 Power\
    \ BI Desktop 有打开或关闭元素的按钮（例如标题或阴影），但相应的 JSON 会翻译为：\n\n```json\n\"show\": true\n\
    ```\n\n或\n\n```json\n\"show\": false\n```\n\n![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig1_HTML.jpg](img/511180_1_En_4_Fig1_HTML.jpg)\n\
    \n图 4-1 匿名元素\n\n- 你需要注意，JSON 显示布尔值（即 true 或 false）：\n  - 不带引号\n  - 小写\n- 注意 `true`\
    \ 和 `false` 的大小写很重要，因为 JSON 主题是区分大小写的。*也不*要用双引号将它们括起来，因为它们是关键字，而不是值。\n- 最后，实际元素定义（`background`、`title`\
    \ 等）本身嵌套在两个“匿名”元素内——如图 4-1 所示。\n\n在定义通用元素（即不严格归属于特定类型视觉对象的格式设置）时，它们*必须*嵌套在此较低层级。星号表示格式设置是通用的——不绑定到特定对象。诚然，这使得跟踪嵌套层级（以及所有花括号对）稍微复杂一些。但是，随着你更多地使用\
    \ JSON 主题文件，这会变得习以为常。\n\n## JSON 属性定义\n\n如果你更仔细地查看 JSON，你会注意到它其实非常容易理解，因为每个部分的格式化选项的每个键/值对都相当直截了当。JSON\
    \ 所做的是为每个部分单独设置每个属性。此外，JSON 遵循你之前看到的准则：\n\n- 开或关使用 `\"show\": true` 或 `\"show\"\
    : false` 表示。\n- 大小是简单的、不带引号的数字。\n- 弹出菜单中的选择项用引号括起来——并且与任何弹出菜单中的实际选项几乎完全相同。\n-\
    \ 颜色是双引号中的十六进制值（前面带有井号/哈希符号）。\n\n这意味着，对于已经花时间在仪表板中格式化图表的 Power BI Desktop 用户来说，理解所使用的\
    \ JSON 是件容易的事。为了强调一个重要的点，你在这里看到的 JSON 只是这些关键字中大多数可用的格式化选项的一个子集。在第 5 章到第 9 章中，你将看到每种图表类型当前所有可用图表格式化选项的完整详细信息。\n"
- fmt: '# JSON Keywords


    The fact that theme files use keywords inevitably means that you need to know
    the exact terms that are required in a JSON theme file if you are going to set
    formatting attributes that:


    - Map to a section in the formatting pane of Power BI Desktop

    - Specify an attribute

    - Are chosen from a popup menu in Power BI Desktop


    The general rules for guessing the definition in JSON of a selectable element
    in Power BI Desktop are:

    - Hover the pointer over an icon (such as the alignment icons) and use the popup
    text as the definition

    - Use the popup menu text (for the shadow position, for instance) but with all
    spaces removed and with initial capitals


    However, to save you guessing at keywords, they are all described in later chapters
    of this book.


    # The JSON Hierarchy in Theme Files


    JSON lends itself to hierarchical structures – and so is based on the approach
    that you can see outlined in Figure [4-2](#511180_1_En_4_Chapter.xhtml#Fig2).


    ![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig2_HTML.jpg](images/511180_1_En_4_Chapter/511180_1_En_4_Fig2_HTML.jpg)


    *Figure 4-2 – The JSON hierarchy in theme files*


    > **Note:** The style name is always an asterisk. If you are defining generic
    attributes (as is the case in this chapter), then the second asterisk replaces
    the visual name that you can see in later, more specific, theme files.


    # Elements Common to Most Chart Types


    Now that you have seen how to define the formatting for shared (or common) elements,
    we can move on to the next level of "generic" formatting. This involves setting
    *some* of the formatting parameters of chart visuals.


    There are several aspects of chart formatting that are shared by multiple charts.
    For instance, stacked bar charts, stacked column charts, clustered bar charts,
    clustered column charts, line charts, area charts, stacked area charts, line and
    clustered column charts, and line and stacked column charts all contain the following
    elements:


    - The category (X) axis

    - The values (Y) axis

    - Data labels

    - Plot area

    - Legend


    Indeed, certain of these elements are also common to a few other chart types such
    as ribbon charts, waterfall charts, and scatter charts (even if these chart types
    only contain some of the formatting options in the preceding list). There are
    even charts such as funnel charts, pie charts, and donut charts that use at least
    one of the formatting elements listed earlier.


    To save you the effort of having to define these similar or identical aspects
    of chart formatting to each individual chart type, you can specify *standard formatting*
    that will be applied to a chart element *if it exists*. This means that if you
    have created a chart that does not have one of these elements (say a donut chart
    that does not have category and values axes but *does* have a legend) but have
    nonetheless set these attributes in a theme file, then the definitions of any
    nonrelevant formatting elements are simply *not applied* to the chart in question.
    What is more, you do *not have to define every format option* that exists in an
    expanded tab of the Format Pane. That is, you can only decide to set one or two
    formatting options for the legend out of all the available options, if you so
    wish. In other words, you can predefine as many aspects of chart formatting as
    you want without worrying about actually having to use them. Power BI Desktop
    does not care about whether a JSON format is used – only if it is syntactically
    accurate. This means that you can define as much (or as little) generic formatting
    as you like as long as the JSON is correct.


    Here, then, is an extract from a JSON theme file that applies some (but not all)
    of the formatting to a series of shared chart elements. You can find the complete
    code in the file `ColorAndTextClassesWithCoreVisualDefaultsAndKeyChartTypes.json`.


    The JSON to define a set of standard chart formats could look like this:


    ```json

    {

    "name": "Common chart elements",

