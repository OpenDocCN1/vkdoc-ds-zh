  raw: '## Python Visual


    Python visuals are somewhat exceptional among the standard Power BI visuals inasmuch
    as *only* the standard visual elements (background, lock aspect, border, shadow,
    and the visual header) can be modified. This is because all other formatting is
    defined in the Python code that creates the visual.


    The keyword that specifies the formatting attributes of a Python visual is *pythonVisual*.


    Table [11-6](#511180_1_En_11_Chapter.xhtml#Tab6) outlines the JSON keywords that
    you can use when formatting Python visuals and the section that corresponds to
    each keyword in the Power BI Desktop format pane.


    Table 11-6


    Python Visual Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | general | General |

    | title | Title |

    | background | Background |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    You can find the JSON code for this in the sample file Attributes_Python.json.


    The following code snippet provides the JSON code used to pre-format a Python
    visual. I realize that you have seen it before, but wanted to make the point that
    common visual elements can be specified for this visual in the theme file even
    if nothing else can.


    ```

    "pythonVisual":

    {"*":

    {

    "general":  [{"responsive": true }],

    "title":    [{

    "show": true,

    "text": "Gauge Title",

    "fontColor": {"solid": {"color": "#ffffff"}},

    "background": {"solid": {"color": "#12239E"}},

    "alignment": "Center",

    "fontSize": 10,

    "fontFamily": "Arial"

    }],

    "background":   [{

    "show": true,

    "color": {"solid": {"color": "#F5F4F0"}}

    }],

    "lockAspect": [{

    "show": false

    }],

    "border":   [{

    "show": true,

    "color": {"solid": {"color": "#F5F4F0"}}

    }],

    "visualHeader":    [{

    "show": true,

    "background": {"solid": {"color": "#ffffff"}},

    "border": {"solid": {"color": "#F5F4F0"}},

    "transparency": 10,

    "foreground": {"solid": {"color": "#F5F4F0"}},

    "showVisualInformationButton": false,

    "showVisualWarningButton": false,

    "showVisualErrorButton": false,

    "showDrillRoleSelector": true,

    "showDrillToggleButton": false,

    "showDrillUpButton": false,

    "showDrillDownLevelButton": false,

    "showDrillDownExpandButton": false,

    "showPinButton": false,

    "showFocusModeButton": false,

    "showFilterRestatementButton": false,

    "showSeeDataLayoutToggleButton": false,

    "showOptionsMenu": false,

    "showTooltipButton": true

    }]

    }

    }

    ```


    ## R Script Visual


    The R visual is virtually identical to the Python visual in what can be formatted.
    In other words, only the standard visual elements (background, lock aspect, border,
    shadow, and the visual header) can be modified. All other formatting is defined
    in the R code that creates the visual.


    The keyword that specifies the formatting attributes of an R visual is *scriptVisual*.


    Table [11-7](#511180_1_En_11_Chapter.xhtml#Tab7) outlines the JSON keywords that
    you can use when formatting R visuals and the section that corresponds to each
    keyword in the Power BI Desktop format pane.


    Table 11-7


    R Visual Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | general | General |

    | title | Title |

    | background | Background |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    You can find the JSON code for this in the sample file Attributes_R.json.


    The following code snippet provides the JSON code used to pre-format an R visual:


    ```

    "scriptVisual":

    {"*":

    {

    "general":  [{"responsive": true }],

    "plotArea": [{... code not shown ...}],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    ## Key Influencers Visual


    The key influencers visual allows you to set three theme options that are entirely
    specific to this visual type. They are


    *   Analysis


    *   Analysis visual colors


    *   Drill visual colors


    The keyword that specifies the formatting attributes of a key influencers visual
    is *keyDriversVisual*.


    Table [11-8](#511180_1_En_11_Chapter.xhtml#Tab8) outlines the JSON keywords that
    you can use when formatting key influencers visuals and the section that corresponds
    to each keyword in the Power BI Desktop format pane.


    Table 11-8


    Key Influencers Visual Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | general | General |

    | keyDrivers | Analysis |

    | keyInfluencersVisual | Analysis visual colors |

    | keyDriversDrillVisual | Drill visual colors |

    | title | Title |

    | background | Background |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    The following code snippet provides the JSON code used to pre-format a key influencers
    visual:


    ```

    "keyDriversVisual":

    {"*":

    {

    "general":  [{"responsive": true }],

    "keyDrivers": [{

    "allowKeyDrivers": true,

    "allowProfiles": true,

    "allowKeyDriversCounting": true,

    "countType": "relative"

    }],

    "keyInfluencersVisual": [{

    "primaryColor": {"solid": {"color": "#615E55"}},

    "primaryFontColor": {"solid": {"color": "#00AC98"}},

    "secondaryColor": {"solid": {"color": "#73268c"}},

    "secondaryFontColor": {"solid": {"color": "#465437"}},

    "canvasColor": {"solid": {"color": "#465437"}},

    "fontColor": {"solid": {"color": "#FFFFFF"}}

    }],

    "keyDriversDrillVisual": [{

    "defaultColor": {"solid": {"color": "#465437"}},

    "referenceLineColor": {"solid": {"color": "#00AC98"}}

