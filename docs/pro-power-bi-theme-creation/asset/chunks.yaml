- fmt: '# Action Button


    Action buttons can be formatted just like any other visual in a theme file.


    The keyword that specifies the formatting attributes of an action button is `actionButton`.


    Table [12-1](#511180_1_En_12_Chapter.xhtml#Tab1) outlines the JSON keywords that
    you can use in action button formatting.


    **Table 12-1** Action Button Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `text` | Button text |

    | `icon` | Icon |

    | `outline` | Outline |

    | `fill` | Fill |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet gives the JSON theme for action button formatting.
    It is surprisingly long, as several elements can be formatted differently according
    to the button state. This effectively multiplies certain subsections of the code.


    ```

    "actionButton":

    {"*":

    {

    "text": [{

    "show": true},

    {

    "$id": "default",

    "text": "Button Text",

    "fontColor": {"solid": {"color": "#808080"}},

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "fontSize": 10,

    "fontFamily": "Arial"

    },

    {

    "$id": "hover",

    "text": "Hover button Text",

    "fontColor": {"solid": {"color": "#808080"}},

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "fontSize": 10,

    "fontFamily": "Arial"

    },

    {

    "$id": "selected",

    "text": "Press button Text",

    "fontColor": {"solid": {"color": "#808080"}},

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "fontSize": 10,

    "fontFamily": "Arial"

    },

    {

    "$id": "disabled",

    "text": "Disabled button Text",

    "fontColor": {"solid": {"color": "#808080"}},

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "fontSize": 10,

    "fontFamily": "Arial"

    }],

    "icon": [{

    "show": true

    },

    {

    "$id": "default",

    "shapeType": "help",

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "lineTransparency": 10,

    "lineWeight": 2

    },

    {

    "$id": "hover",

    "shapeType": "help",

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "lineTransparency": 10,

    "lineWeight": 2

    },

    {

    "$id": "selected",

    "shapeType": "help",

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "lineTransparency": 10,

    "lineWeight": 2

    },

    {

    "$id": "disabled",

    "shapeType": "help",

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "lineTransparency": 10,

    "lineWeight": 2

    }],

    "outline": [{

    "show": true

    },

    {

    "$id": "default",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "transparency": 10,

    "weight": 2,

    "roundEdge": 3

    },

    {

    "$id": "hover",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "transparency": 5,

    "weight": 2,

    "roundEdge": 3

    },

    {

    "$id": "selected",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "transparency": 15,

    "weight": 2,

    "roundEdge": 3

    },

    {

    "$id": "disabled",

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "transparency": 20,

    "weight": 2,

    "roundEdge": 3

    }],

    "fill":

    [{

    "show":true

    },

    {

    "$id": "default",

    "transparency": 0,

    "fillColor": {"solid":{"color":"#949494"}}

    },

    {

    "$id": "hover",

    "transparency": 0,

    "fillColor": {"solid":{"color":"#949494"}}

    },                                                   {

    "$id": "selected",

    "transparency": 0,

    "fillColor": {"solid":{"color":"#111111"}}

    },                                                   {

    "$id": "disabled",

    "transparency": 0,

    "fillColor": {"solid":{"color":"#111111"}}

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    It is worth noting to begin with that you can set the attributes for `icon`, `fill`,
    and `text` to reflect different settings for the four following button states:


    - Default

    - Hover

    - Press

    - Disabled


    The fact that a new concept is introduced – button state – has an impact on the
    object nesting in the theme file JSON. In effect, an added level of nesting is
    applied inside each main element of the action button.


    Each of these states is defined using the `$id` keyword in the JSON that defines
    the button state. For the two sections in the JSON that specifies an `$id` keyword
    (`text` and `icon`), you need one of the values shown in Table [12-2](#511180_1_En_12_Chapter.xhtml#Tab2).
    The outcome of this is that you have *four* nearly identical subsections in the
    JSON that describe text and icon formatting – one for each button state.


    **Table 12-2** Button State Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `default` | Default state |

    | `hover` | On hover |

    | `selected` | On press |

    | `disabled` | Disabled |


    The `text` keyword that describes the button text section uses the keywords shown
    in Table [12-3](#511180_1_En_12_Chapter.xhtml#Tab3).


    **Table 12-3** Keyword Mapping for the Button Text Section


    | Element | Keyword |

    | --- | --- |

    | Button text | `show` |

    | Button text | `text` |

    | Font color | `fontColor` |

    | Padding | `padding` |

    | Vertical alignment | `verticalAlignment` |

    | Horizontal alignment | `horizontalAlignment` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |


    The `icon` keyword that describes the icon section uses the keywords shown in
    Table [12-4](#511180_1_En_12_Chapter.xhtml#Tab4).


    **Table 12-4** Keyword Mapping for the Icon Section


    | Element | Keyword |

    | --- | --- |

    | Icon | `show` |

    | Shape | `shapeType` |

    | Padding | `padding` |

    | Vertical alignment | `verticalAlignment` |

    | Horizontal alignment | `horizontalAlignment` |

    | Line color | `lineColor` |

    | Transparency | `lineTransparency` |

    | Weight | `lineWeight` |


    The `outline` keyword that describes the outline section uses the keywords shown
    in Table [12-5](#511180_1_En_12_Chapter.xhtml#Tab5).


    **Table 12-5** Keyword Mapping for the Outline Section


    | Element | Keyword |

    | --- | --- |

    | Outline | `show` |

    | Outline color | `lineColor` |

    | Transparency | `transparency` |

    | Outline weight | `weight` |

    | Round edges | `roundEdge` |


    The `fill` keyword that describes the fill section uses the keywords shown in
    Table [12-6](#511180_1_En_12_Chapter.xhtml#Tab6).


    **Table 12-6** Keyword Mapping for the Fill Section


    | Element | Keyword |

    | --- | --- |

    | Fill | `show` |

    | Fill color | `fillColor` |

    | Transparency | `transparency` |


    Table [12-7](#511180_1_En_12_Chapter.xhtml#Tab7) shows the vertical alignment
    attributes for icons.


    **Table 12-7** Vertical Alignment Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `top` | Top |

    | `middle` | Middle |

    | `bottom` | Bottom |


    Table [12-8](#511180_1_En_12_Chapter.xhtml#Tab8) shows the horizontal alignment
    attributes for icons.


    **Table 12-8** Horizontal Alignment Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `left` | Left |

    | `center` | Center |

    | `right` | Right |


    You can find the JSON code for action buttons in the sample file `Attributes_ActionButton.json`.'
