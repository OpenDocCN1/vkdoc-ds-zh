    | `Left` | 左 |

    | `TopRight` | 右上 |

    | `Top` | 顶部 |

    | `TopLeft` | 左上 |

    | `Custom` | 自定义 |


    由于在 JSON 中定义的许多详细值在多个视觉对象中以相同的方式使用，并且在同一个视觉对象内部也以相同的方式使用，因此我不会在讨论每个视觉对象时一遍又一遍地详尽解释每一个值。


    > **注意**：在主题文件中输入与特定格式设置选项相对应的值时，使用 Power BI 所期望的、并且在参考表中给出的精确拼写和大小写是**非常重要的**。


    ## Image


    接下来我建议查看的视觉对象是图像。这是因为图像视觉对象除了你在文本框视觉对象中看到的标准元素之外，只包含一个额外元素。实际上，这个选项仅在 Power BI
    中的另外少数几个元素中存在——即你可以应用的缩放。这是通过`imageScaling`关键字定义的。


    图像格式（如下面的 JSON 片段所示）由`image`关键字引入。


    表 5-11 描述了在 Power BI Desktop 中，就图像而言，与每个格式设置部分相对应的 JSON 关键字。


    **表 5-11** 图像格式设置元素


    | 关键字 | 格式设置部分 |

    | --- | --- |

    | `general` | 常规 |

    | `imageScaling` | 缩放 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    以下是你可以用来格式化图像的 JSON 代码。你可以在示例文件（`Attributes_Image.json`）中找到此文件。同样，新的或关键的关键字以斜体突出显示。请注意，从现在开始，我将仅展示正在讨论的视觉对象特有的
    JSON。封装特定 JSON 代码的通用代码将不会显示——即使它在相应的示例文件中。


    ```json

    "image":

    {"*":

    {

    "general": [{... code not shown ...}]

    "imageScaling": [{

    "imageScalingType": "Fit"

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    在`imageScaling`部分中使用的 JSON 中的`imageScalingType`关键字需要表 5-12 中显示的属性之一。


    **表 5-12** 标签位置选项


    | 值 | 格式设置弹出选项 |

    | --- | --- |

    | `Normal` | 正常 |

    | `Fit` | 适应 |

    | `Fill` | 填充 |


    ## Shape


    接下来（并结束本章）要查看的视觉对象是形状视觉对象。指定形状格式的关键字是`basicShape`。此视觉对象的格式使用以下三个关键字定义：


    *   `line`

    *   `fill`

    *   `rotation`


    因此，你需要了解如何在主题文件中使用 JSON 配置这些格式设置元素。


    表 5-13 描述了在 Power BI Desktop 中与每个格式设置部分相对应的 JSON 关键字。


    **表 5-13** 形状格式设置元素


    | 关键字 | 格式设置部分 |

    | --- | --- |

    | `general` | 常规 |

    | `line` | 线条 |

    | `fill` | 填充 |

    | `rotation` | 旋转 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    因此，对于形状元素，代码应类似于以下 JSON 片段（此代码可在示例文件`Attributes_Shape.json`中找到）：


    ```json

    "basicShape":

    {"*" :

    {

    "general": [{... code not shown ...}]

    "line":   [{

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "transparency": 0,

    "weight": 1,

    "roundedge": 0

    }],

    "fill":   [{

    "show": true,

    "fillColor": {"solid": {"color": "#FFFFFF"}},

    "transparency": 0

    }],

    "rotation":    [{

    "angle": 0

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    描述线条部分的`line`关键字使用表 5-14 中所示的关键字。


    **表 5-14** 线条元素的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 线条颜色 | `lineColor` |

    | 透明度 | `transparency` |

    | 粗细 | `weight` |

    | 圆角 | `roundedge` |


    描述填充部分的`fill`关键字使用表 5-15 中所示的关键字。


    **表 5-15** 填充元素的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 填充 | `show` |

    | 填充颜色 | `fillColor` |

    | 透明度 | `transparency` |


    描述旋转部分的`rotation`关键字使用表 5-16 中所示的关键字。


    **表 5-16** 旋转的关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 旋转 | `rotation` |


    ## 结论


    本章介绍了如何使用 Power BI 中的 JSON 主题文件来准备和标准化视觉对象的深入格式设置。具体来说，你了解了 Power BI 中的三个关键视觉对象（文本框、形状和图像）以及如何对它们进行格式化。


    每个视觉对象都由一个 JSON 关键字定义，该关键字又包含任何格式属性（对应于该视觉对象的 Power BI Desktop 格式设置窗格的各个部分）。


    某些属性很简单，只需定义一个值；其他属性则是嵌套对象和/或数组。


    然而，创建和修改 JSON 主题文件的技巧和科学始终在于：找到哪个 JSON 关键字映射到哪个 Power BI 格式属性，以及可以使用哪些值来定义此属性应如何作为标准被定义。


    现在你已经了解了许多核心元素，是时候继续查看不同的视觉对象组了，从卡片和表格视觉对象类型开始。下一章将介绍这些内容。'
  raw: 'Something that you really need to understand is that a theme file will require,
    for some attributes, that you specify an element that corresponds to a selection
    in a popup list in Power BI Desktop. An example is the alignment of titles that
    is used in visual titles as well as column headers and certain other attributes.
    If you look at the preceding JSON, you can see the following line of code for
    the title:


    ```

    "alignment": "Center"

    ```


    As you have probably guessed, this corresponds to selecting the icon that indicates
    *center* in the Power BI Desktop formatting pane.


    When setting key/value pairs like this, all you need to know is *exactly* what
    value you can use in the JSON. In some cases, these values are a direct match
    to the values in the popup that is used in Power BI Desktop. Unfortunately, this
    is not always the case. So I will always provide the keyword mapping in the course
    of the remaining chapters.


    The *alignment* keyword that is used in the title section needs one of the attributes
    shown in Table [5-8](#511180_1_En_5_Chapter.xhtml#Tab8).


    Table 5-8


    Title Alignment Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | Auto | Auto |

    | Left | Left |

    | Center | Center |

    | Right | Right |


    The *position* keyword that is used in the drop shadow section needs one of the
    attributes shown in Table [5-9](#511180_1_En_5_Chapter.xhtml#Tab9).


    Table 5-9


    Shadow Position Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | Outer | Outside |

    | Inner | Inside |


    The *preset* keyword that is used in the drop shadow section needs one of the
    attributes shown in Table [5-10](#511180_1_En_5_Chapter.xhtml#Tab10).


    Table 5-10


    Shadow Preset Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | BottomRight | Bottom Right |

    | Bottom | Bottom |

    | BottomLeft | Bottom Left |

    | Center | Center |

    | Left | Left |

    | TopRight | Top Right |

    | Top | Top |

    | TopLeft | Top Left |

    | Custom | Custom |


    As so many of the detailed values that are defined in the JSON are used identically
    across multiple visuals and the same way inside the same visual, I will not explain
    each one exhaustively over and over again when each visual is discussed.


    Note


    It is *really important* when entering a value in the theme file that corresponds
    to a specific formatting option that you use *exactly the spelling and capitalization*
    that is expected by Power BI – and given in the reference table.


    ## Image


    The next visual that I suggest looking at is the image. This is because the image
    visual only contains one element over and above the standard elements that you
    saw for the textbox visual. Indeed, this option is only found in a couple of other
    elements in Power BI – and that is the *scaling* that you can apply. This is defined
    using the *imageScaling* keyword.


    Image formatting (as you can see in the JSON snippet below) is introduced by the
    *image* keyword.


    Table [5-11](#511180_1_En_5_Chapter.xhtml#Tab11) describes the JSON keyword that
    corresponds to each formatting section in Power BI Desktop as far as images are
    concerned.


    Table 5-11


    Image Formatting Elements


    | Keyword | Formatting Section |

    | --- | --- |

    | general | General |

    | imageScaling | Scaling |

    | title | Title |

    | background | Background |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    Here, then, is the JSON code that you can use to format an image. You can find
    this file in the sample files – it is Attributes_Image.json. Once again, the new
    – or essential – keywords are highlighted in italics. Please note that from now
    on I will only be showing the JSON that is specific to the visual under discussion.
    The common code that encapsulates the specific JSON code will not be displayed
    – even if it is in the corresponding sample file.


    ```

    "image":

    {"*":

    {

    "general": [{... code not shown ...}]

    "imageScaling": [{

    "imageScalingType": "Fit"

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The *imageScalingType* keyword in the JSON that is used in the imageScaling section
    needs one of the attributes shown in Table [5-12](#511180_1_En_5_Chapter.xhtml#Tab12).


    Table 5-12


    Label Position Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | Normal | Normal |

    | Fit | Fit |

    | Fill | Fill |


    ## Shape


    To move on (and to conclude the chapter), the next visual to look at is the shape
    visual. The keyword that specifies shape formatting is *basicShape*. The format
    of this visual is defined using three keywords:


    *   line


    *   fill


    *   rotation


    It follows that you need to see how these formatting elements can be configured
    using JSON in a theme file.


    Table [5-13](#511180_1_En_5_Chapter.xhtml#Tab13) describes the JSON keyword that
    corresponds to each formatting section in Power BI Desktop.


    Table 5-13


    Shape Formatting Elements


    | Keyword | Formatting Section |

    | --- | --- |

    | general | General |

    | line | Line |

    | fill | Fill |

    | rotation | Rotation |

    | title | Title |

    | background | Background |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    So, for the shape element, the code would look like the following piece of JSON
    (this code can be found in the sample file Attributes_Shape.json):


    ```

    "basicShape":

    {"*" :

    {

    "general": [{... code not shown ...}]

    "line":   [{

    "lineColor": {"solid": {"color": "#F5F4F0"}},

    "transparency": 0,

    "weight": 1,

    "roundedge": 0

    }],

    "fill":   [{

    "show": true,

    "fillColor": {"solid": {"color": "#FFFFFF"}},

    "transparency": 0

    }],

    "rotation":    [{

    "angle": 0

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The *line* keyword that describes the line section uses the keywords shown in
    Table [5-14](#511180_1_En_5_Chapter.xhtml#Tab14).


    Table 5-14


    Keyword Mapping for Line Elements


    | Element | Keyword |

    | --- | --- |

    | Line color | lineColor |

    | Transparency | transparency |

    | Weight | weight |

    | Round edges | roundedge |


    The *fill* keyword that describes the fill section uses the keywords shown in
    Table [5-15](#511180_1_En_5_Chapter.xhtml#Tab15).


    Table 5-15


    Keyword Mapping for Fill Elements


    | Element | Keyword |

    | --- | --- |

    | Fill | show |

    | Fill color | fillColor |

    | Transparency | transparency |


    The *rotation* keyword that describes the rotation section uses the keywords shown
    in Table [5-16](#511180_1_En_5_Chapter.xhtml#Tab16).


    Table 5-16


    Keyword Mapping for Rotation


    | Element | Keyword |

    | --- | --- |

    | Rotation | rotation |


    ## Conclusion


    This chapter introduced you to how you can prepare and standardize the in-depth
    formatting of visuals using JSON theme files in Power BI. Specifically, you saw
    three of the key visuals in Power BI (textbox, shape, and image) and how to format
    them.


    Each visual is defined by a JSON keyword that, in turn, contains any of the format
    attributes (corresponding to the sections of the Power BI Desktop formatting pane
    for this visual).


    Some attributes are simple and only require a value to be defined; others are
    nested objects and/or arrays.


    However, the art and science of creating and modifying JSON theme files will always
    be to find which JSON keyword maps to which Power BI formatting attribute and
    which values you can use to define how this attribute is to be defined as standard.


    Now that you have seen a number of core elements, it is time to move on to looking
    at different groups of visuals, beginning with card and table visual types. These
    are covered in the next chapter.'
