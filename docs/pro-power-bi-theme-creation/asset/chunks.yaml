    ## 地图


    本章讨论的三种地图类型在示例文件夹中各自拥有独立的 JSON 文件，其中包含可用于定义自定义主题文件的代码。那么，让我们继续这段旅程吧！


    在 Power BI 地图中，您可以设置其外观（除了几乎所有视觉对象都通用的标准元素之外），具体包括：


    - 图例

    - 数据颜色

    - 类别

    - 气泡

    - 地图控件

    - 地图样式

    - 热力图


    指定地图格式化属性的关键字是 `map`。


    表 10-1 概述了您在地图格式化中可使用的 JSON 关键字及其在 Power BI Desktop 格式窗格中对应的部分。


    **表 10-1** 地图图表关键字


    | 关键字 | 格式设置部分 |

    | --- | --- |

    | `general` | 常规 |

    | `legend` | 图例 |

    | `dataPoint` | 数据颜色 |

    | `categoryLabels` | 类别 |

    | `bubbles` | 气泡 |

    | `mapControls` | 地图控件 |

    | `mapStyles` | 地图样式 |

    | `Title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    您可以在示例文件 `Attributes_Map.json` 中找到对应的 JSON 代码。


    以下代码片段提供了用于预格式化地图的 JSON 代码。由于地图是一个新概念，我倾向于展示几乎所有的 JSON 代码：


    ```

    "map":{"*":

    {

    "general": [{... 此处代码未显示 ...}]

    "legend": [{... 此处代码未显示 ...}],

    "categoryLabels": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 10,

    "fontFamily": "Arial",

    "enableBackground": true,

    "backgroundColor": {"solid": {"color": "#ffffff"}},

    "transparency": 30

    }],

    "bubbles": [{

    "bubbleSize": 15

    }],

    "mapControls": [{

    "autoZoom": true,

    "showZoomButtons": true

    }],

    "mapStyles": [{

    "mapTheme": "grayscale",

    "showLabels": true

    }],

    "heatMap":  [{

    "show": true,

    "filterRadius": 8,

    "transparency": 10,

    "unit": "meters",

    "color": {"solid": {"color": "#F5F4F0"}},

    "color50": {"solid": {"color": "#949494"}},

    "color100": {"solid": {"color": "#D5D5D5"}}

    }],

    "title": [{... 此处代码未显示 ...}],

    "background": [{... 此处代码未显示 ...}],

    "lockAspect": [{... 此处代码未显示 ...}],

    "border": [{... 此处代码未显示 ...}],

    "dropShadow": [{... 此处代码未显示 ...}],

    "visualHeader": [{... 此处代码未显示 ...}]

    }

    }

    ```


    图例关键字见表 7-2。


    描述类别部分的 `categoryLabels` 关键字使用了表 10-2 中所示的关键字。


    **表 10-2** 类别标签部分关键字映射


    | 元素 | 关键字 |

    | --- | --- |

    | 类别标签 | `show` |

    | 颜色 | `color` |

