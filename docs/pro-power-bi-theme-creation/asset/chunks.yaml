    ## Line and Clustered Column Chart


    The other combined chart type option is the line and clustered column chart. The
    JSON code for this visual is very similar to the code for the line and stacked
    column chart.


    The keyword that specifies the formatting attributes of a line and clustered column
    chart is `lineClusteredColumnComboChart`.


    Table [8-7](#511180_1_En_8_Chapter.xhtml#Tab7) outlines the JSON keywords that
    you can use in line and clustered column chart formatting and the section that
    corresponds to each keyword in the Power BI Desktop format pane.


    Table 8-7


    Line and Clustered Column Chart Keywords


