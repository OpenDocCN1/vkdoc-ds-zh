    | Element | Keyword |

    | --- | --- |

    | Theme | `mapTheme` |

    | Show labels | `showLabels` |


    The `heatMap` keyword that describes the heat map section uses the keywords shown
    in Table 10-6.


    **Table 10-6** Keyword Mapping for the Heat Map Section


    | Element | Keyword |

    | --- | --- |

    | Heat map | `show` |

    | Radius | `filterRadius` |

    | Transparency | `transparency` |

    | unit | `units` |

    | 0% gradient stop | `color` |

    | 50% gradient stop | `Color50` |

    | 100% gradient stop | `Color100` |


    The `mapTheme` keyword in the map styles section requires one of the attributes
    shown in Table 10-7.


    **Table 10-7** Map Styles Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `aerial` | Aerial |

    | `dark` | Dark |

    | `light` | Light |

    | `grayscale` | Grayscale |

    | `road` | Road |


    The `unit` keyword for heat maps (in the heat map section) needs one of the attributes
    shown in Table 10-8.


    **Table 10-8** Units Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `pixels` | Pixels |

    | `meters` | Meters |


    Legend position options are described in Table 7-9.


