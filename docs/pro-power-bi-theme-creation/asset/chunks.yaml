  raw: '## Stacked Column Chart


    The next chart to look at is the stacked column chart. The JSON is largely identical
    to the code you saw earlier, which makes the point that Power BI charts share
    similar structural approaches.


    The keyword that specifies stacked column chart formatting attributes is *columnChart*.


    Table [7-14](#511180_1_En_7_Chapter.xhtml#Tab14) outlines the JSON keywords that
    you can use in stacked bar chart formatting and the section that corresponds to
    each keyword in the Power BI Desktop format pane.


    Table 7-14


    Stacked Bar Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | General | General |

    | legend | Legend |

    | categoryAxis | X Axis |

    | valueAxis | Y Axis |

    | zoom | Zoom slider |

    | labels | Data labels |

    | totals | Total labels |

    | plotArea | Plot area |

    | title | Title |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    The fundamental differences with the JSON for the stacked bar chart that you saw
    previously are


    *   The *categoryAxis* has the *concatenateLabels* keyword added – and the *position*
    keyword removed.


    *   The *valueAxis* has the *position* keyword added – and the *axisScale* keyword
    removed.


    *   Labels has labelOrientation added.


    *   There are now also options to choose the category and value axis style that
    are available for this chart type.


    *   The vertical (Y) axis in this chart is the value axis (so the horizontal (X)
    axis is the category axis) in the JSON.


    The complete definition is available in the file Attributes_StackedColumnChart.json
    in the sample files. The JSON code is


    ```

    "columnChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "concatenateLabels": true,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelPrecision": 0,

    "labelDisplayUnits": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "zoom: [{... code not shown ...}],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#FFFFFF"}},

    "labelDisplayUnits": 1,

    "labelPrecision": 2,

    "labelPosition": "InsideEnd",

    "labelOverflow": true,

    "labelOrientation": "vertical",

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 0

    }] ,

    "totals": [{... code not shown ...}],

    "plotArea": [{... code not shown ...}],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The stacked column chart keywords for the X Axis, Y axis, and labels sections
    are, fortunately, largely identical to those used for stacked bars – so I will
    not repeat them here, but prefer to refer you to the previous section instead.


    The *labelOrientation* keyword in the JSON that sets label orientation (in the
    labels section) needs one of the attributes shown in Table [7-15](#511180_1_En_7_Chapter.xhtml#Tab15)
    to be supplied.


    Table 7-15


    Label Display Units Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | Vertical | Vertical |

    | Horizontal | Horizontal |


    The *axisStyle* keyword in the JSON for the value axis needs one of the attributes
    shown in Table [7-16](#511180_1_En_7_Chapter.xhtml#Tab16).


    Table 7-16


    Category and Value Axis Style Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | ShowTitleOnly | Show title only |

    | ShowUnitOnly | Show unit only |

    | ShowBoth | Show both |


    Legend keywords are given in Table [7-2](#511180_1_En_7_Chapter.xhtml#Tab2).


    Categories keywords are given in Table [7-3](#511180_1_En_7_Chapter.xhtml#Tab3).


    Values keywords are given in Table [7-4](#511180_1_En_7_Chapter.xhtml#Tab4).


    Zoom keywords are given in Table [7-5](#511180_1_En_7_Chapter.xhtml#Tab5). For
    a column chart, the showOnValueAxis refers to the Y axis.


    Labels keywords are given in Table [7-6](#511180_1_En_7_Chapter.xhtml#Tab6).


    Totals keywords are given in Table [7-7](#511180_1_En_7_Chapter.xhtml#Tab7).


    Plot area keywords are given in Table [7-8](#511180_1_En_7_Chapter.xhtml#Tab8).


    Tooltip keywords are given in Table [6-5](#511180_1_En_6_Chapter.xhtml#Tab5).


    Legend position options are described in Table [7-9](#511180_1_En_7_Chapter.xhtml#Tab9).


    Category axis position options are described in Table [7-10](#511180_1_En_7_Chapter.xhtml#Tab10).


    Value axis display units options are described in Table [7-11](#511180_1_En_7_Chapter.xhtml#Tab11).


    Value axis style options are described in Table [7-16](#511180_1_En_7_Chapter.xhtml#Tab16).


    Value axis gridline style options are described in Table [7-13](#511180_1_En_7_Chapter.xhtml#Tab13).


    Label position options are described in Table [7-12](#511180_1_En_7_Chapter.xhtml#Tab12).'
