  trans: '

    # 2. 在 Power BI Desktop 中创建并自定义主题


    如果你并非 IT 背景出身（或者以前从未使用过 JSON 文件），并且一想到要手工编写复杂的文本结构就感到恐惧，那么现在可以放松并深呼吸了，因为定义一个简单而强大的
    Power BI 主题文件异常容易——**无需编写或修改一行代码**。


    这是因为 Power BI Desktop 允许你（通过几次点击）指定一组核心格式属性，这些属性将应用于整个仪表板。不仅如此，一旦你定义了这些属性，Power
    BI Desktop 会自动为你生成 JSON 主题文件，以便你将其用于其他仪表板或与同事共享。所有这些操作都是通过“视图”菜单中“主题”按钮的*自定义当前主题*选项完成的。


    虽然这种方法无法让你精确设计每种可视化类型的每一个格式属性，但它能让你在最多几分钟内创建出一种标准的演示风格——随后你可以以此主题为基础进行进一步开发。更重要的是，由此生成的主题文件是了解
    JSON 主题如何在 Power BI 中运作的绝佳入门材料。


    但请注意，通过 Power BI Desktop 界面创建主题*无法*达到使用“手工编写”的 JSON 所能实现的精细演示级别。因此，最好将你在本章中学到的技巧既视为对主题主题的实用入门，也视为一种极快的方法，用于开发可应用于整个仪表板的简单样式原则。


    为了给这个过程提供一些结构，这种直接在 Power BI Desktop 中进行的“交互式主题生成”将你可以更改的主题元素分为以下五个类别：


    *   *名称和颜色*：在此处你可以为主题命名，并指定仪表板中使用的调色板和主要颜色。

    *   *文本*：在此处你可以为仪表板中的各种元素定义核心文本属性，例如字体、字号和颜色。

    *   *视觉对象*：在此处你可以指定所有视觉对象的关键公共属性。

    *   *页面*：在此处你可以设置仪表板页面的基本属性。

    *   *筛选器窗格*：允许你指定筛选器窗格的显示方式。


    你不必指定 Power BI Desktop 在“自定义当前主题”对话框中提供的每个选项。你可以更改几个选项，或者重置所有可用选项（以及介于两者之间的任何步骤）。


    ## 创建简单主题


    作为入门，让我们创建一个非常简单的 JSON 主题文件，该文件会更改 Power BI Desktop 用于颜色选择的调色板中的几种颜色。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig1_HTML.jpg](img/511180_1_En_2_Fig1_HTML.jpg)


    图 2-1


    “主题”弹出窗口


    1. 激活“视图”菜单。

    2. 点击“主题”的弹出按钮。你将看到类似于图 2-1 所示的选项。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig2_HTML.jpg](img/511180_1_En_2_Fig2_HTML.jpg)


    图 2-2


    “自定义主题”对话框


    1. 点击“自定义当前主题”。将出现如图 2-2 所示的对话框。

    2. 在该对话框中，为前几个“主题颜色”选择不同的颜色（这些颜色对应于标准 Power BI 调色板中的颜色，从第三列开始从左到右排列）。值得注意的是，你无法更改调色板中的前两种（单色）颜色。

    3. 点击“应用”。所选颜色将应用到当前仪表板。

    4. 点击“视图”➤“主题”➤“保存当前主题”。将出现“另存为”对话框。

    5. 浏览到合适的目录，并为主题文件输入一个名称。此文件*必须*具有 `.json` 扩展名。

    6. 点击“保存”。


    就这样！现在你拥有一个功能完善的 JSON 主题文件，可以将其应用于其他仪表板。只需在应用了此主题文件的仪表板中，显示任意元素的“颜色”弹出窗口，即可看到主题的效果。你会看到可用颜色的第一行已更改为你在前面步骤
    4 中选择的颜色（嗯，前两种颜色除外，它们将始终为白色和黑色）。


    幸运的是，你刚才所做的选择并非一成不变。因此，你可以随时通过重复刚才的过程、选择任何可用选项并重新保存主题文件来更改主题设置。


    注意


    当你重新保存主题文件时，Power BI Desktop **不会**记住你上次使用的名称，并且默认会使用 `Theme.json`。如果你想更新现有文件，请记得在点击“保存”之前选择之前的文件名。当然，你需要确认希望覆盖现有文件。

    '
- fmt: '# Name and Color Settings


    A customized theme can define much more than simply the color palette. So, now
    that the basics have been explained, it is time to review all the customizable
    options that are available using the Power BI Desktop theme interface. These are
    all available in the dialog that you saw in Figure [2-2](#511180_1_En_2_Chapter.xhtml#Fig2).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig3_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig3_HTML.jpg)


    Figure 2-3 The Customize theme/Advanced tab


    - **Name**: This field that appears at the top of the Customize theme/Name and
    colors tab (although it is not visible in Figure [2-2](#511180_1_En_2_Chapter.xhtml#Fig2))
    allows you to add a text description inside the actual JSON file. This can be
    useful for tracking the evolution of your definition of themes – or simply reminding
    you what a particular theme is used for.


    - **Sentiment colors**: These are used in KPI and waterfall charts to indicate
    positive, negative, or neutral results.


    - **Divergent colors**: These are used in conditional formatting to show when
    data falls inside a range.


    - **Advanced** (colors): The advanced options allow you to set a series of six
    colors that will be applied to a wide range of Power BI dashboard elements. You
    can see the Customize theme/Advanced tab in Figure [2-3](#511180_1_En_2_Chapter.xhtml#Fig3).


    As the names of each of these color elements are somewhat abstract, here is the
    full list of the elements that each color setting will modify:


    - **First-level elements**: (Labels background color (when outside data points),
    trend line color, textbox default color, table and matrix values and totals font
    colors, data bars axis color, card data labels, gauge callout value color, KPI
    goal color, KPI text color, slicer item color (when in focus mode), slicer dropdown
    item font color, slicer numeric input font color, slicer header font color, scatter
    chart ratio line color, line chart forecast line color, map leader line color,
    filter pane and card text color)


    - **Second-level elements**: “Light” secondary text classes, label colors, legend
    label color, axis label color, table and matrix header font color, gauge target
    and target leader line color, KPI trend axis color, slicer slider color, slicer
    item font color, slicer outline color, line chart hover color, multi-row card
    title color, ribbon chart stroke color, shape map border color, button text font
    color, button icon line color, button outline color


    - **Third-level elements**: Axis gridline color, table and matrix grid color,
    slicer header background color (when in focus mode), multi-row card outline color,
    shape fill color, gauge arc background color, applied filter card background color,
    disabled button outline color


    - **Fourth-level elements**: Legend dimmed color, card category label color, multi-row
    card category labels color, multi-row card bar color, funnel chart conversion
    rate stroke color, disabled button text font color, disabled button icon line
    color


    - **Background elements**: Labels background color (when inside data points),
    slicer dropdown items background color, donut chart stroke color, treemap stroke
    color, combo chart background color, button fill color, filter pane and available
    filter card background color


    - **Secondary background elements**: Table and matrix grid outline color, shape
    map default color, ribbon chart ribbon fill color (when match series option is
    turned off), when background is not set to `FFFFFF`, the disabled button fill
    color, and the disabled button outline color


    To give you some idea of how these formats are applied, take a look at Figure
    [2-4](#511180_1_En_2_Chapter.xhtml#Fig4). Please note that this dashboard is not
    a complete reference – it just aims to show you how the principle of general color
    settings works.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig4_HTML.png](images/511180_1_En_2_Chapter/511180_1_En_2_Fig4_HTML.png)


    Figure 2-4 Anatomy of high-level color customization


    ## Text Settings


    As you might expect, there is also a set of text formats that you can define as
    part of a custom theme. Again, to make defining the elements easier, they are
    subset into a number (four in this case) of distinct elements. These subelements
    are:


    - **General**: Formats table and matrix column headers, matrix row headers, table
    and matrix grid, table and matrix values


    - **Title**: Formats category axis title, value axis title, multi-row card title,
    slicer header


    - **Cards and KPIs**: Formats card data labels, KPI indicators


    - **Tab headers**: Formats key influencers headers


    Each of the tables corresponding to one of these subelements allows you to set
    the:


    - Font

    - Font size

    - Font color


