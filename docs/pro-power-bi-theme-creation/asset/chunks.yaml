- fmt: '# Line and Stacked Column Chart


    One of the two combined chart type options is the line and stacked column chart.
    As far as the JSON theme code is concerned, it is a mixture of the column chart
    and the line chart.


    The keyword that specifies the formatting attributes of a line and stacked column
    chart is `lineStackedColumnComboChart`.


    The essential differences as far as the JSON is concerned are in the value axis
    – where the multiple series are differentiated.


    Table [8-4](#511180_1_En_8_Chapter.xhtml#Tab4) outlines the JSON keywords that
    you can use in line and stacked column chart formatting and the section that corresponds
    to each keyword in the Power BI Desktop format pane.


    **Table 8-4** Line and Stacked Column Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X Axis |

    | `valueAxis` | Y Axis |

    | `zoom` | Zoom slider |

    | `labels` | Data labels |

    | `lineStyles` | Shapes |

    | `plotArea` | Plot area |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualTooltip` | Tooltip |

    | `visualHeader` | Visual header |


    The following is the JSON that describes the formatting for a line and stacked
    column chart. It is one of the longest JSON descriptions for any visual.


    ```

    "lineStackedColumnComboChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{

    "show": true,

    "position": "Top",

    "showTitle": true,

    "titleText": "Add a legend title",

    "legendColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8,

    "legendMarkerRendering":"markerOnly"

    }],

    "categoryAxis": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 25,

    "innerPadding": 15,

    "concatenateLabels": true,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "start": null,

    "end": null,

    "labelColor": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "labelPrecision": 0,

    "labelDisplayUnits": 0,

    "showAxisTitle": true,

    "axisStyle": "ShowTitleOnly",

    "color": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "gridLineShow": false,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid",

    "secShow": true,

    "alignZeros": true,

    "secPosition": "Right",

    "secStart": null,

    "secEnd": null,

    "secAxisScale": "Linear",

    "secLabelColor": {"solid": {"color": "#949494"}},

    "secFontSize": 8,

    "secFontFamily": "Arial",

    "secLabelDisplayUnits": 0,

    "secLabelPrecision": 0,

    "secShowAxisTitle": true,

    "secTitleText": "Add an Axis Title",

    "secAxisStyle": "ShowTitleOnly",

    "secTitleColor": {"solid": {"color": "#949494"}},

    "secTitleText": "Add an Axis Title",

    "secTitleFontSize": 8,

    "secTitleFontFamily": "Arial"

    }],

    "zoom[{... code not shown ...}],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#ffffff"}},

    "labelDisplayUnits": 1,

    "labelPrecision": 2,

    "labelOrientation": 1,

    "labelPosition": "InsideEnd",

    "labelOverflow": true,

    "labelOrientation": "Vertical",

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 0

    }],

    "lineStyles": [{

    "strokeWidth": 1,

    "strokeLineJoin": "Bevel",

    "lineStyle": "Solid",

    "showMarker": true,

    "markerShape": "longDash",

    "markerSize": 3,

    "markerColor":  {"solid": {"color": "#949494"}},

    "stepped": true,

    "showSeries": false

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


