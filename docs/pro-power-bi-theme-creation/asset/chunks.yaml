- fmt: '# 100% Stacked Bar Chart


    As you move on to looking at variations on a theme of bar and column charts, you
    will see that there are more similarities than differences in the JSON. In fact,
    the formatting for a hundred percent stacked bar chart is almost completely identical
    to the code that you use for a stacked bar chart.


    The only differences compared to the JSON for a stacked bar chart are:


    * The keyword that specifies the formatting attributes of a hundred percent stacked
    bar chart. In this case, it is `hundredPercentStackedBarChart`.

    * The absence of a `totals` section.

    * The value axis no longer has an `axisScale` element.


    Table [8-1](#511180_1_En_8_Chapter.xhtml#Tab1) outlines the JSON keywords that
    you can use in stacked bar chart formatting and the section that corresponds to
    each keyword in the Power BI Desktop format pane.


    **Table 8-1** Stacked Bar Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X Axis |

    | `valueAxis` | Y Axis |

    | `zoom` | Zoom slider |

    | `labels` | Data labels |

    | `plotArea` | Plot area |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualTooltip` | Tooltip |

    | `visualHeader` | Visual header |


    The JSON code for a hundred percent stacked bar chart is available as the sample
    file `Attributes_HundredPercentStackedBarChart.json`.


    The following code snippet provides the JSON code used to pre-format a hundred
    percent stacked bar chart:


    ```json

    "hundredPercentStackedBarChart":

