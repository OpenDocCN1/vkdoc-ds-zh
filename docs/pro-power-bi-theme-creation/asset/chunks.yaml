  trans: '

    # 操作按钮


    操作按钮的格式设置方式与主题文件中的其他视觉元素完全相同。


    指定操作按钮格式属性的关键字是 `actionButton`。


    表 12-1 概述了可用于操作按钮格式设置的 JSON 关键字。


    **表 12-1** 操作按钮关键字


    | 关键字 | 格式设置区域 |

    | --- | --- |

    | `general` | 常规 |

    | `text` | 按钮文本 |

    | `icon` | 图标 |

    | `outline` | 轮廓 |

    | `fill` | 填充 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉标头 |


    以下代码片段给出了操作按钮格式设置的 JSON 主题。它的长度惊人，因为多个元素可以根据按钮状态进行不同的格式设置。这实际上会倍增代码中的某些子部分。


    ```

    "actionButton":

    {"*":

    {

    "text": [{

    "show": true},

    {

    "$id": "default",

    "text": "Button Text",

    "fontColor": {"solid": {"color": "#808080"}},

    "padding": 3,

    "verticalAlignment": "middle",

    "horizontalAlignment": "center",

    "fontSize": 10,

    "fontFamily": "Arial"

    },

    {

    "$id": "hover",

    "text": "Hover button Text",

