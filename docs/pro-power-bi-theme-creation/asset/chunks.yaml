- fmt: '# Filter Pane


    It may seem surprising – after all, it is not a visual – but you can also format
    the filter pane in a theme file just as you can format it interactively in Power
    BI Desktop.


    There is no single keyword that introduces the formatting attributes of a filter
    pane. This is because the filter pane formatting is set at the level of generic
    formatting. You first met this concept in Chapter [4](#511180_1_En_4_Chapter.xhtml).
    Indeed, it could be a good idea to refer back to Chapter [4](#511180_1_En_4_Chapter.xhtml)
    for a quick refresher on the concept of generic formatting should you need to.


    Filter pane formatting is defined using two keywords at this level. They are:


    * `outspacePane`

    * `filterCard`


    Table [12-16](#511180_1_En_12_Chapter.xhtml#Tab16) outlines the JSON keywords
    that you can use in filter pane formatting.


    **Table 12-16** Slicer Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `outspacePane` | Filter pane |

    | `filterCard` | Filter card |


    ```

    "visualStyles":

    {"*":

    {"*":

    {

    "outspacePane": [{

    "backgroundColor": {"solid": {"color": "#999999"}},

    "transparency": 30,

    "foregroundColor": {"solid": {"color": "#374649"}},

    "titleSize": 18,

    "headerSize": 12,

    "fontFamily": "Arial",

    "border": true,

    "borderColor": {"solid": {"color": "#909090"}},

    "width": 190,

    "checkboxAndApplyColor": {"solid": {"color": "#374649"}},

    "searchTextSize": 11,

    "inputBoxColor": {"solid": {"color": "#ffffff"}}

    }],

    "filterCard": [{

    "$id": "Applied",

    "backgroundColor": {"solid": {"color": "#171796"}},

    "transparency": 0,

    "border": true,

    "borderColor": {"solid": {"color": "#909090"}},

    "foregroundColor": {"solid": {"color": "#ffffff"}},

    "textSize": 10,

    "fontFamily": "Arial",

    "inputBoxColor": {"solid": {"color": "#C8C8C8"}}

    },

    {

    "$id": "Available",

    "backgroundColor": {"solid": {"color": "#171796"}},

    "transparency": 40,

    "border": true,

    "borderColor": {"solid": {"color": "#909090"}},

    "foregroundColor": {"solid": {"color": "#ffffff"}},

    "textSize": 9,

    "fontFamily": "Arial",

    "inputBoxColor": {"solid": {"color": "#777777"}}

    }]

    }

    }

    }

    }

    ```


    The `outspacePane` keyword that describes the filter pane section uses the keywords
    shown in Table [12-17](#511180_1_En_12_Chapter.xhtml#Tab17).


    **Table 12-17** Keyword Mapping for the Filter Pane Section


    | Element | Keyword |

    | --- | --- |

    | Background color | `backgroundColor` |

    | Transparency | `transparency` |

    | Font and icon color | `foregroundColor` |

    | Title text size | `titleSize` |

    | Header text size | `headerSize` |

    | Font family | `fontFamily` |

    | Border | `border` |

    | Border color | `borderColor` |

    | Width | `width` |

    | Checkbox and apply color | `checkboxAndApplyColor` |

    | Search size text | `searchTextSize` |

    | Input box color | `inputBoxColor` |


    Before looking at these elements and keywords, it is worth noting that there are
    two types of filter card:


    * Applied

    * Not applied


    These represent, respectively, cards where filters have or have not been applied.


    The two filter card states are introduced using the `$id` keyword. This means
    that JSON code is duplicated for each filter state – as was the case for action
    button states, as you saw earlier in this chapter.


    The `$id` keyword in the JSON that defines the type of a filter card uses the
    keywords shown in Table [12-18](#511180_1_En_12_Chapter.xhtml#Tab18).


    **Table 12-18** Button State Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Applied` | Applied |

    | `Available` | Available |


    The `filterCard` keyword that describes the filter card section uses the keywords
    shown in Table [12-19](#511180_1_En_12_Chapter.xhtml#Tab19).


    **Table 12-19** Keyword Mapping for the Filter Card Section


    | Element | Keyword |

    | --- | --- |

    | Background color | `backgroundColor` |

    | Transparency | `transparency` |

    | Border | `border` |

    | Border color | `borderColor` |

    | Font and icon color | `foregroundColor` |

    | Text size | `textSize` |

    | Font family | `fontFamily` |

    | Input box color | `inputBoxColor` |


    You can find the JSON code for this in the sample file `Attributes_FilterCard.json`.


    # Page Formatting


    The page background can also be formatted using a theme file. Rather like the
    format pane, this is considered (as far as the theme file goes) as a generic rather
    than a specific formatting element and so appears as part of the generic visual
    style in the file.


    Table [12-20](#511180_1_En_12_Chapter.xhtml#Tab20) outlines the JSON keywords
    that you can use for page formatting and the section that corresponds to each
    keyword in the Power BI Desktop format pane.


    **Table 12-20** Page Formatting Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `background` | Page background |

    | `displayArea` | Page alignment |

    | `outspace` | Wallpaper |


    The code for page formatting is found in the sample file `Attributes_Page.json`.
    You can see the complete code (to explain the position of page formatting in the
    file structure) in the following code snippet:


    ```

    {

    "name": "Page formatting",

    "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
    "#FFFF00", "#FF001E"],

    "visualStyles":

    {

    "*":

    {"*":

    {

    "page":

    {"*":

    {

    "background":

    [{

    "color": {"solid": {"color": "#F5F4F0"}},

    "transparency": 0

    }],

    "displayArea":

    [{

    "verticalAlignment": "Middle"

    }],

    "outspace":

    [{

    "color": {"solid": {"color": "#F5F4F0"}}

    "transparency": 20

    }]

    }

    }

    }

    }

    }

    }

    ```


    The `background` keyword that describes the page background section uses the keywords
    shown in Table [12-21](#511180_1_En_12_Chapter.xhtml#Tab21).


    **Table 12-21** Keyword Mapping for Page Background


    | Element | Keyword |

    | --- | --- |

    | Color | `color` |

    | Transparency | `transparency` |


    The `displayArea` keyword that describes the page alignment section uses the keywords
    shown in Table [12-22](#511180_1_En_12_Chapter.xhtml#Tab22).


    **Table 12-22** Keyword Mapping for Page Alignment


    | Element | Keyword |

    | --- | --- |

    | Vertical alignment | `verticalAlignment` |


    The `outspace` keyword that describes the wallpaper section uses the keywords
    shown in Table [12-23](#511180_1_En_12_Chapter.xhtml#Tab23).


    **Table 12-23** Keyword Mapping for Wallpaper


    | Element | Keyword |

    | --- | --- |

    | Color | `color` |

    | Transparency | `transparency` |


    The `verticalAlignment` keyword in the JSON for setting the page alignment needs
    one of the attributes shown in Table [12-24](#511180_1_En_12_Chapter.xhtml#Tab24).


    **Table 12-24** Legend Position Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | `Top` | Top |

    | `Middle` | Middle |'
