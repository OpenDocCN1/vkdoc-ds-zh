- fmt: '# 3. High-Level Theme Definition


    It is time, now, to roll up your sleeves and prepare to delve deep into the engine
    of Power BI themes. From now on, you will be working directly in JSON to create
    and modify the elements of the theme file that will control the appearance of
    your Power BI dashboards.


    To start on your journey into Power BI themes, this chapter will take a look at
    the highest level of theme definitions. This involves creating generic theme settings
    that can apply across the board to attributes that are common to multiple visuals
    – or, indeed, to nearly every object in a dashboard. This could mean, for instance,
    setting the text attributes for column headers or axis titles – whatever the specific
    visual type.


    There are three main advantages to this approach:


    - *Firstly*, it is comparatively easy.

    - *Secondly*, it applies to multiple elements – so you do not need to repeat the
    specification in the theme file multiple times (once for each visual type).

    - *Finally*, as this approach only sets default formatting for aspects of a dashboard,
    you can tweak and complete the formatting of individual visuals just as you are
    used to doing using the formatting pane to set the final presentation.


    What is more, setting these high-level elements may be all that you need to do
    to set the overall presentation of a series of dashboards. You are looking at
    a trade-off between in-depth (and potentially time-consuming) preparation of JSON
    files and delivering a quick fix that solves 80–90% of the requirements. In these
    circumstances, setting a high-level, more generic format can often be a perfectly
    valid solution. Of course, once the high-level styles have been applied, you can
    subsequently tweak the JSON formatting of any visuals that need further preparation
    and standardization – as you will discover in later chapters.


    These higher-level theme definitions cover setting:


    - Palette colors

    - Generic colors

    - Generic text attributes


    Power BI calls these kinds of themes “generic classes.” They are well worth learning,
    as not only are they a great introduction to how themes work in Power BI, but
    they are also something that you can use in your day-to-day work with Power BI.


    ## What Is JSON?


    Let’s start, however, with a (very) short sideways glance at some JSON basics.
    After all, you may never have met this format before. If you already know JSON,
    then feel free to skip the sections in this book that cover JSON. If this is not
    the case, then I advise you to spend the time to get a basic grasp of what JSON
    is and how it works as it is so fundamental to theme definition in Power BI.


    In the previous chapter, we referred to JSON copiously, without ever explaining
    what it was or why it is used by Power BI. JSON stands for JavaScript Object Notation.
    It is a lightweight data-interchange format that is solidly reliable for data
    exchange between systems, yet comprehensible (enough, at least) for mere humans
    to understand. It can be extensively structured and yet remain sufficiently pliable
    to store complex information. In the case of Power BI themes, this means the definition
    of how Power BI dashboard elements are formatted. Interestingly, when used to
    define Power BI theme files, it is irrelevant that the J in JSON stands for JavaScript,
    as in this context JSON is simply a way of defining dashboard presentation styles.
    So it is really the words *Object* and *Notation* that are the key terms to remember
    as in the context of Power BI, as JSON *describes the formatting* (notation) of
    *dashboard visuals* (objects).


    JSON is a large subject, so this book will only introduce the aspects of JSON
    that are required to create theme files. Also, I intend to do this progressively,
    and only describe the JSON that is needed as it is required, rather than explain
    it all in one fell swoop. Indeed, I will be using a series of boxes to explain
    the necessary JSON concepts – beginning with this, first one, as follows.


    **JSON BASICS**


    JSON is based on the concept of *name/value pairs*. That is, it defines a name
    and what describes the name (its value).


    JSON uses a *colon* to separate a name from its associated value.


    JSON is based around the concept of objects – and, at the highest level, the entire
    theme is an object.


    Objects can contain other (nested) objects.


    All *objects* are enclosed by curly brackets (or braces if you prefer) `{}`.


    JSON uses *commas* to separate lists of elements.


    JSON can contain *arrays*. These are lists of elements enclosed in square brackets
    `[]`.


    JSON insists that you enter texts and numbers in different ways.


    ## Palette Colors


    You are now about to create your first Power BI theme file. It will be extremely
    simple. Indeed, it is probably easier to load the sample file `PaletteColors.json`
    from the directory containing the sample files and modify it rather than to try
    and recreate the entire file by hand from scratch. To be practical, this is a
    technique that I advise you to use whenever possible when creating theme files
    – begin with something that works and adjust and/or extend it to suit your new
    requirements.


    Figure 3-1 shows the sample file `PaletteColors.json`.


    ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig1_HTML.jpg](images/511180_1_En_3_Chapter/511180_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** The JSON to set the color palette


    The theme file contains three core JSON structures:


    - Curly braces that enclose the entire *JSON object*.

    - Name/value pairs (`name`, `dataColors`, and `background` are the *names* – the
    text following the colon in each case is the *value*).

    - An *array* (the list of comma-separated hexadecimal colors inside square brackets).
    Here, the entire array is the value for the name/value pair.


    As this is your first encounter with a theme file, I prefer to explain everything
    that it contains, as this will help you to understand how the JSON works.


    ### The JSON Object


    The entire JSON “object” (as it is called) must start and end with opening and
    closing curly braces. There should, ideally, be *no text at all* either before
    or after the initial opening and final closing curly braces – though if you do
    add extra lines, it will not matter as long as there is no added text at all.


    There may be further nested sets of curly braces that define other objects contained
    inside the top-level pair of braces. Indeed, as you examine more complex JSON
    theme files, you will see examples of this.'
