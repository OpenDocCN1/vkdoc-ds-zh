    Now that you have built a JSON theme file that can instantly format much (if not
    most) of a Power BI dashboard, it is worth reminding yourself of what you have
    created.


    The file is nothing but JSON; however, it can be subdivided into three main areas:


    *   Colors


    *   Text (textClasses)


    *   Visuals (visualStyles)


    This file contains elements that are *cumulative* – in the sense that it applies
    many different areas of formatting at once.


    There is a *hierarchy of styles*. That is, you can apply an initial “top-level”
    style (for instance, by defining the title element of the textClasses) – and then
    you can also specify that the titles of charts are formatted differently. These
    subtleties are explained in the final chapter.


    As I mentioned earlier, when defining formatting, you are *not obliged to define
    every aspect of a formatted element*. In other words, not all “sections” are compulsory,
    and you can choose which parts of a visual (or a set of visuals that share this
    common element) you want to format using the theme file.


    The order of the elements in the theme file is not important. So you could place
    the visualStyles element above the textClasses element. What really matters, however,
    is


    *   Ensuring that the JSON is syntactically correct.


    *   Checking that the keywords that define a stylistic element are those expected
    by Power BI.


    *   Any text elements (such as font names or choices from popups in Power BI Desktop)
    contain the values that Power BI expects.


    What is more, you can, of course, take the complete “generic” theme file (GenericBaseFormatting.json)
    and adjust it to use the colors and other settings that you prefer. You can also
    extend it to add further high-level formatting attributes. You will learn the
    complete extent of detailed JSON formatting in the next eight chapters.'
