    *   *Tooltip*: The colors of the popup tooltip elements


    Each of these elements corresponds very closely to the standard cards (also called
    elements or sections) that you are used to dealing with when formatting visuals
    in the format pane of Power BI Desktop. They show the same attributes that you
    have probably tweaked many times, but presented slightly differently.


    Let’s take a detailed look at the way that these settings can be customized by
    looking at the four tabs in the Visuals section of the Customize theme dialog.


    The Customize theme/Visuals/Background tab looks like Figure [2-10](#511180_1_En_2_Chapter.xhtml#Fig10).
    This tab lets you set the color of the background for all visuals as well as the
    level of transparency.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig10_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig10_HTML.jpg)


    Figure 2-10


    The Customize theme/Visuals/Background tab


    The Customize theme/Visuals/Border tab looks like Figure [2-11](#511180_1_En_2_Chapter.xhtml#Fig11).
    As you might expect, this tab lets you specify whether a border is required, and
    if it is, what color the border should be. You can also define the border as having
    rounded corners by setting a radius figure.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig11_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig11_HTML.jpg)


    Figure 2-11


    The Customize theme/Visuals/Border tab


    The Customize theme/Visuals/Header tab (shown in Figure [2-12](#511180_1_En_2_Chapter.xhtml#Fig12))
    allows you to set the essential attributes of all visual headers. Specifically,
    you can define


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig12_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig12_HTML.jpg)


    Figure 2-12


    The Customize theme/Visuals/Header tab


    *   The header background color


    *   The header border color


    *   The header transparency


    *   The color of the icons in the header


    The Customize theme/Visuals/Tooltip tab enables you to define the background,
    label, and value font colors for all popup tooltips.


    It looks like Figure [2-13](#511180_1_En_2_Chapter.xhtml#Fig13).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig13_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig13_HTML.jpg)


    Figure 2-13


    The Customize theme/Visuals/Tooltip tab


    ## Page Settings


    There are two settings that you can modify as far as defining the page formatting
    when creating a JSON theme file with Power BI Desktop is concerned. These are


    *   The wallpaper (the area outside the page itself)


    *   The page background (the color of the page underneath any visuals)


    These settings are accessed using the Customize theme/Page dialog.


    The Customize theme/Page/Wallpaper tab looks like Figure [2-14](#511180_1_En_2_Chapter.xhtml#Fig14).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig14_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig14_HTML.jpg)


    Figure 2-14


    The Customize theme/Page/Wallpaper tab


    As you can see in Figure [2-15](#511180_1_En_2_Chapter.xhtml#Fig15) the Customize
    theme/Page/Page background tab, you can also set the color and transparency of
    the page background.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig15_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig15_HTML.jpg)


    Figure 2-15


    The Customize theme/Page/Page background tab


    ## Filter Pane Settings


    The final aspect of customized themes that you can define concerns the filter
    pane. Fairly logically, this is broken down into three areas:


    *   The filter pane itself


    *   Available filter cards


    *   Applied filter cards


    The first pane that you can use is the Customize theme/Filter pane/Filter pane
    tab. This contains options to define


    *   Background color


    *   Transparency


    *   Font and icon color


    *   Title font size


    *   Header font size


    *   Checkbox and Apply color


    You can see this in Figure [2-16](#511180_1_En_2_Chapter.xhtml#Fig16).


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig16_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig16_HTML.jpg)


    Figure 2-16


    The Customize theme/Filter pane/Filter pane tab


    The second pane (shown in Figure [2-17](#511180_1_En_2_Chapter.xhtml#Fig17)) that
    you can use is the Customize theme/Filter pane/Available filter cards tab. This
    contains options to define (for the filter cards inside the filter pane)


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig17_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig17_HTML.jpg)


    Figure 2-17


    The Customize theme/Filter pane/Available filter cards tab


    *   Background color


    *   Transparency


    *   Font and icon color


    *   Font size


    The final pane in this dialog that you can use is the Customize theme/Filter pane/Applied
    filter cards tab. This sets the formatting for any active filters in the filter
    pane. This pane, which you can see in Figure [2-18](#511180_1_En_2_Chapter.xhtml#Fig18),
    contains options to define filter cards when a filter is set. They are


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig18_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig18_HTML.jpg)


    Figure 2-18


    The Customize theme/Filter pane/Applied filter cards tab


    *   Background color


    *   Transparency


    *   Font and icon color


    *   Font size


    Note


    Once you have set all the options that you want, remember to click the Apply button
    and then select View ➤ Themes ➤ Save current theme to save the JSON file that
    contains your settings.


    ## Overall Comments on Interactive Theme File Creation


    Now that you have seen how to create a theme file using Power BI Desktop, it is
    a good idea to push back and consider what you have achieved.


    *   You defined a high-level theme file without writing any code.


    *   You did this completely interactively.


    In practice, there is one major takeaway that is worth remembering as far as this
    process is concerned:


    *   The theme file that you create using Power BI Desktop is less complete – and
    *considerably less granular* – than JSON files that you craft yourself. You can,
    however, extend this file using the techniques that you will learn in the remaining
    chapters of this book.'
  trans: '

    # 视觉设置


    Power BI 中的所有视觉对象都包含一组核心元素，你可以全局定义其格式。这确保了你在仪表板中创建的所有内置视觉对象具有标准的外观和风格。你可以定义的元素包括：


    - `Background`：视觉对象的背景色和透明度

    - `Border`：视觉对象的边框属性

    - `Header`：视觉对象标头（包括其可见性）

    - `Tooltip`：弹出式工具提示元素的颜色


    这些元素中的每一个都与你在 Power BI Desktop 的格式窗格中格式化视觉对象时习惯使用的标准卡片（也称为元素或部分）非常对应。它们显示了你可能调整过多次的相同属性，但呈现方式略有不同。


    让我们通过查看 `Customize theme` 对话框的 `Visuals` 部分中的四个选项卡，详细了解这些设置的自定义方式。


    `Customize theme/Visuals/Background` 选项卡如图 2-10 所示。此选项卡允许你设置所有视觉对象的背景色以及透明度级别。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig10_HTML.jpg](img/511180_1_En_2_Fig10_HTML.jpg)


    图 2-10 `Customize theme/Visuals/Background` 选项卡


    `Customize theme/Visuals/Border` 选项卡如图 2-11 所示。如你所料，此选项卡允许你指定是否需要边框，如果需要，应使用何种颜色。你还可以通过设置半径数值来定义圆角边框。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig11_HTML.jpg](img/511180_1_En_2_Fig11_HTML.jpg)


    图 2-11 `Customize theme/Visuals/Border` 选项卡


    `Customize theme/Visuals/Header` 选项卡（如图 2-12 所示）允许你设置所有视觉对象标头的基本属性。具体来说，你可以定义：


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig12_HTML.jpg](img/511180_1_En_2_Fig12_HTML.jpg)


    图 2-12 `Customize theme/Visuals/Header` 选项卡


    - 标头背景色

    - 标头边框颜色

    - 标头透明度

    - 标头中图标的颜色


    `Customize theme/Visuals/Tooltip` 选项卡使你可以定义所有弹出式工具提示的背景、标签和数值字体颜色。如图 2-13 所示。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig13_HTML.jpg](img/511180_1_En_2_Fig13_HTML.jpg)


    图 2-13 `Customize theme/Visuals/Tooltip` 选项卡


    ## 页面设置


    在使用 Power BI Desktop 创建 JSON 主题文件时，有两个关于页面格式的设置你可以进行修改。它们是：


    - 墙纸（页面本身以外的区域）

    - 页面背景（任何视觉对象下方页面的颜色）


    可以通过 `Customize theme/Page` 对话框访问这些设置。


    `Customize theme/Page/Wallpaper` 选项卡如图 2-14 所示。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig14_HTML.jpg](img/511180_1_En_2_Fig14_HTML.jpg)


    图 2-14 `Customize theme/Page/Wallpaper` 选项卡


    如图 2-15 `Customize theme/Page/Page background` 选项卡所示，你还可以设置页面背景的颜色和透明度。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig15_HTML.jpg](img/511180_1_En_2_Fig15_HTML.jpg)


    图 2-15 `Customize theme/Page/Page background` 选项卡


    ## 筛选器窗格设置


    你可以定义的自定义主题的最后一个方面涉及筛选器窗格。相当合乎逻辑地，它分为三个区域：


    - 筛选器窗格本身

    - 可用的筛选器卡片

    - 已应用的筛选器卡片


    你可以使用的第一个窗格是 `Customize theme/Filter pane/Filter pane` 选项卡。它包含以下可定义的选项：


    - 背景色

    - 透明度

    - 字体和图标颜色

    - 标题字号

    - 标头字号

    - 复选框和应用颜色


    你可以在图 2-16 中看到这一点。


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig16_HTML.jpg](img/511180_1_En_2_Fig16_HTML.jpg)


    图 2-16 `Customize theme/Filter pane/Filter pane` 选项卡


    你可以使用的第二个窗格（如图 2-17 所示）是 `Customize theme/Filter pane/Available filter cards`
    选项卡。它包含以下可定义选项（针对筛选器窗格内的筛选器卡片）：


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig17_HTML.jpg](img/511180_1_En_2_Fig17_HTML.jpg)


    图 2-17 `Customize theme/Filter pane/Available filter cards` 选项卡


    - 背景色

    - 透明度

    - 字体和图标颜色

    - 字号


    此对话框中你可以使用的最后一个窗格是 `Customize theme/Filter pane/Applied filter cards` 选项卡。此选项卡设置筛选器窗格中任何活动筛选器的格式。此窗格（你可以在图
    2-18 中看到）包含在设置筛选器时定义筛选器卡片的选项。它们是：


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig18_HTML.jpg](img/511180_1_En_2_Fig18_HTML.jpg)


    图 2-18 `Customize theme/Filter pane/Applied filter cards` 选项卡


    - 背景色

    - 透明度

    - 字体和图标颜色

    - 字号


    > **注意**：设置完所有想要的选项后，请记得单击 `Apply` 按钮，然后选择 `View` ➤ `Themes` ➤ `Save current theme`
    来保存包含你设置的 JSON 文件。


    ## 关于交互式主题文件创建的总体评价


    现在你已经了解了如何使用 Power BI Desktop 创建主题文件，后退一步思考你所取得的成就是一个好主意。


    - 你无需编写任何代码就定义了一个高级主题文件。

    - 你完全以交互方式完成了此操作。


    实际上，就这个过程而言，有一个重要的收获值得记住：


    - 你使用 Power BI Desktop 创建的主题文件完整性较低——并且*粒度差得多*——远不如你自己编写的 JSON 文件。不过，你可以使用将在本书剩余章节中学到的技术来扩展此文件。

    '
- fmt: '# About the Theme File


    So you have created a customized theme file in JSON format. But what does this
    actually look like? Well, an example file is available as the sample file `PBIDesktopCustomizedTheme.json`.
    You can see what it looks like in Figure 2-19.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig19_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig19_HTML.jpg)


    *Figure 2-19: A JSON file as created by Power BI Desktop*


    I am sure you will agree that the JSON created by Power BI Desktop is very ugly
    and hard to read. However, there are ways of making the JSON look much prettier
    and more readable.


    To make the JSON from a generated theme file easier to read, I simply suggest
    that you use a search engine and look for something along the lines of “JSON prettify.”
    You should find numerous sites that can take JSON like this and output a much
    more attractive version in a couple of clicks.


    In a few seconds, the resulting JSON can look something like that shown in the
    following code snippet:


    ```

    {

    "name": "Initial Customized Theme",

    "textClasses": {

    "label": { "color": "#666563", "fontFace": "Arial", "fontSize": 9 },

    "callout": { "color": "#5E5C5B", "fontFace": "Arial", "fontSize": 30 },

    "title": { "color": "#B8B6B4", "fontFace": "Arial", "fontSize": 11 },

    "header": { "color": "#CAC5C1", "fontFace": "''Arial Black''", "fontSize": 10
    }

    },

    "dataColors": ["#063764", "#ADB6F6", "#E6364E", "#7A3F00", "#E044A7", "#6BC24D",
    "#B1D900", "#44CCD6"],

    "foreground": "#060606",

    "foregroundNeutralSecondary": "#353534",

    "backgroundLight": "#918F8D",

    "foregroundNeutralTertiary": "#D9D6D2",

    "backgroundNeutral": "#F8EFE7",

    "bad": "#E4081F",

    "neutral": "#2BD900",

    "good": "#191CAB",

    "minimum": "#DEFDFF",

    "center": "#04D900",

    "maximum": "#2C10FF",

    "visualStyles": {

    "*": {

    "*": {

    "background": [{ "color": { "solid": { "color": "#EBE5E5" } } }],

    "border": [{ "show": true }],

    "visualHeader": [{

    "background": { "solid": { "color": "#CEC9C9" } },

    "foreground": { "solid": { "color": "#F3EFEC" } },

    "border": { "solid": { "color": "#0E0E0E" } }

    }],

    "visualTooltip": [{

    "titleFontColor": { "solid": { "color": "#2D2C2C" } },

    "valueFontColor": { "solid": { "color": "#FFFFFF" } },

    "background": { "solid": { "color": "#A29F9F" } }

    }],

    "outspacePane": [{

    "backgroundColor": { "solid": { "color": "#EE1111" } },

    "foregroundColor": { "solid": { "color": "#222224" } },

    "titleSize": 10,

    "headerSize": 11,

    "checkboxAndApplyColor": { "solid": { "color": "#1023F2" } }

    }],

    "filterCard": [

    { "$id": "Applied", "foregroundColor": { "solid": { "color": "#F4820F" } }, "textSize":
    10 },

    { "$id": "Available", "backgroundColor": { "solid": { "color": "#E5E3E3" } },
    "textSize": 10, "transparency": 0 }

    ]

    }

    },

    "page": {

    "*": {

    "background": [{ "color": { "solid": { "color": "#FAF5F5" } }, "transparency":
    100 }],

    "outspace": [{ "color": { "solid": { "color": "#FBF8F8" } } }]

    }

    }

    }

    }

    ```


    This file is available as the sample file `PBIDesktopCustomizedTheme_Prettified.json`.


    I realize that many readers’ eyes will be glazing over at the sight of a piece
    of code like this. However, trust me (and continue reading) and you will soon
    not only be understanding JSON like this but actually creating your own. The key
    takeaways at this stage are that the various elements that you set (colors, text
    definitions, etc.) are all in the JSON file, along with the actual definitions.
    Exactly which JSON corresponds to what formatted element is the subject of the
    remainder of this book.


    You may well be wondering what the outcome of all the effort that went in to creating
    a customized theme is. So, Figure 2-20 shows a dashboard page once the theme file
    `PBIDesktopCustomizedTheme.json` has been applied (using **View ➤ Themes ➤ Browse
    for themes**, if you remember from Chapter 1). Absolutely no other specific formatting
    has been applied – that is, all the formatting has been sourced from the JSON
    file and applied across all the visuals that have been added as well as to the
    underlying page and the Filter pane.


    ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig20_HTML.jpg](images/511180_1_En_2_Chapter/511180_1_En_2_Fig20_HTML.jpg)


    *Figure 2-20: A Power BI dashboard with a customized theme applied*


    When creating your own JSON theme using the Power BI Desktop interface, you need
    to be aware that:


    - Power BI Desktop *only* creates the JSON for any elements that you modify. It
    will not create a theme file that defines all the elements that are capable of
    being set using the **Customize current theme** dialog. That is, the JSON output
    will not include any settings that you have *not* modified in the various dialogs.
    This makes for simpler, more concise theme files.

    - Any theme file can now be applied to an existing or blank Power BI Desktop file
    simply by selecting **View ➤ Themes ➤ Browse for themes** – and navigating to
    the JSON file that you saved previously.

    - A theme file will only apply formatting if an element has *not* already been
    formatted using the **Format** pane in Power BI Desktop. You will have to click
    **Revert to default** for each card name in each visual where you wish to remove
    any previously applied custom formatting.


    # Conclusion


    In this chapter, you learned how to create and modify a JSON theme for Power BI
    entirely interactively using Power BI Desktop. Indeed, despite not being a completely
    granular definition of your formatting requirements, this approach might be all
    you ever need to define a perfectly usable theme file for your organization or
    individual requirements.


    However, there is much, much more that can be done to create finely tuned themes
    that cover absolutely all the formatting possibilities that are present in Power
    BI. So, now that your appetite is whetted, it is time to move on to some progressively
    more detailed examples.'
