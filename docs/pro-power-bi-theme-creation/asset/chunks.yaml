  trans: '

    # 整合所有元素


    主题创建本质上是一个实践性问题。因此，通过几个具体的主题文件示例，能帮助你更好地理解“标准”主题文件（其中所有内容都是单独定义的）与级联主题文件之间的区别。


    如果你查看可下载的 JSON 文件，会找到：


    - `FullTheme.json`：此文件包含所有视觉元素的完整格式定义。只有页面和筛选器窗格定义是在通用级别设置的。

    - `CascadingTheme.json`：这是一个示例，展示了如何先定义一系列通用元素，然后再为某些视觉元素定义高度具体的自定义格式。

    - `FullThemeWithClasses.json`：此文件包含所有视觉元素的完整格式定义。只有页面和筛选器窗格定义是在通用级别设置的。此外，文件中还添加了颜色和文本类。


    我在此不会展示所有三个文件的 JSON 内容，因为它们合起来有几千行 JSON 代码。不过，我建议你查看一下，以便理解不同的方法。它们也很可能对你来说是一个很好的基础，可以用来改编你自己的主题文件。


    # 应用级联调色板颜色


    到目前为止，在本书中，每当应用颜色时，你看到的都是“硬编码”的十六进制值。虽然这绝对是设置颜色的最简单方法，但这样做可能会使更改整个主题文件中的颜色变得非常费力。如果你已经创建了一组定义了所有可能对象的完整
    JSON，尤其如此。实际上，这种方法可能会导致你花费数小时进行复制/替换工作来重置颜色。之后，通常还需要花费数小时来测试应用了主题后的数十种视觉类型。


    幸运的是，颜色也可以在主题文件中进行级联。这使得在实践中修改颜色设置变得更加容易。


    设置级联颜色设置的工作原理如下：


    - **首先**，按照常规方式，通过定义八个可变颜色来设置调色板。这意味着你可以从 60 种颜色中进行选择（调色板中的十列乘以六行）。你不仅拥有一系列可用的颜色，而且它们还是基于十种核心颜色的变体——这意味着颜色选择通常更加和谐。

    - **其次**，在引用这些颜色时，**不要使用它们的十六进制引用**，而是使用**它们在调色板中的位置**。


    第二部分是新的，其工作原理如下。


    通常，你可能会像这样使用颜色引用：


    ```

    {"solid": {"color": "#999999"}}

    ```


    为了确保颜色引用能够级联，你应该使用如下所示的 JSON：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent": -0.5}}}}}

    ```


    由于这段 JSON 乍看起来有些难以理解，让我们来看看它的结构。


    只有十六进制引用部分发生了变化——它变成了：


    ```

    {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent": -0.5}}}

    ```


    这里使用的三个关键词在表 13-2 中进行了解释。


    **表 13-2** 调色板颜色级联引用


    | 关键词 | 定义 |

    | --- | --- |

    | `ThemeDataColor` | 指示将使用调色板 |

    | `ColorId` | 定义要使用的调色板列 |

    | `Percent` | 对所选颜色应用百分比强度 |


    嵌套结构如下所示：


    ```

    {"solid":

    {"color":

    {"expr":

    {"ThemeDataColor":

    {"ColorId": 5, "Percent": -0.25}

    }

    }

    }

    }

    ```


    需要稍加解释的两个主要内容是：


    - `ColorId`

    - `Percent`


    `ColorId` 是一个数值，代表调色板中的列。它是从零开始计数的，并且从左到右应用。这意味着所有 10 列颜色的编号为 0 到 9。


    因此，有趣的是，JSON 关键词 `ThemeDataColor` 0 对应调色板中的第一列（定义为白色），`ThemeDataColor` 1 对应调色板中的第二列（定义为黑色），`ThemeDataColor`
    2 对应调色板中的第三列（令人困惑的是，调色板弹出窗口将其描述为主题颜色 1），依此类推。这是一个你需要慢慢习惯的事情。


    同样，在调色板中，每种调色板颜色的*深浅*定义为（从上到下）：


    - 亮 60%

    - 亮 40%

    - 亮 20%

    - 暗 25%

    - 暗 50%


    这些由 JSON 关键词 `Percent` 的数值表示。然而（同样有点令人困惑的是），调色板中较浅的色调设置为正数，而较深的色调设置为负数。


    此映射关系如图 13-5 所示。


    ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig5_HTML.jpg](img/511180_1_En_13_Fig5_HTML.jpg)


    **图 13-5** 调色板与主题数据颜色的对应关系


    要从调色板的某一行中选择颜色，你需要设置一个与所需深浅对应的百分比数值。如你所见，较浅的色调设置为正值，较深的色调设置为负值。

    '
- fmt: '作为示例，要应用调色板中倒数第二列的第二行，百分比数值将为`0.6`，如下代码片段所示：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 8, "Percent": 0.6}}}}}

    ```


    要应用第七列（即你能设置的第五列）的底行，百分比数值将为 `-0.5`，如下代码片段所示：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 6, "Percent": -0.5}}}}}

    ```


    需要强调的是，较浅的色调为正数，较深的色调为负数。


    如果你想要应用调色板顶行显示的基本颜色，则只需将百分比数值设为 `0`，如下所示：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 6, "Percent": 0}}}}}

    ```


    基于调色板的颜色可以在以下几个可能的关键词之后应用：


    - `Color`

    - `Background`

    - `Title font color`

    - `Background font color`

    - `Value font color`

    - 实际上，在 JSON 主题文件中设置颜色的任何地方都可以


    然而，级联颜色引用 *不能* 应用于简单的颜色定义，例如文本类和基本颜色（`firstLevelElements` 等）。


    有趣的是，在实际的 JSON 中，你可以定义初始主题颜色的 *任意百分比变体*，而不必局限于调色板使用的百分比。因此，例如，你可以像这样定义主题颜色的变体：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 5, "Percent": -0.37}}}}}

    ```


    这为你基于原始调色板提供了广泛的潜在色调范围。


    作为级联颜色的示例，请查看以下 JSON 代码。该代码可以在文件 `CascadingColors.json` 中找到。


    ```

    {

    "name": "Cascading Colors",

    "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
    "#FFFF00", "#FF001E"],

    "visualStyles":

    {"*":

    {"*":

    {

    "total":

    [{

    "totals": true,

    "label": "TOTAL",

    "fontColor": {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent":
    -0.5}}}}},

    "fontFamily": "Arial",

    "fontSize": 10

    }]

    }

    },

    "tableEx":

    {"*":

    {

    "total":

    [{

    "totals": true,

    "label": "TOTAL",

    "fontColor": {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 8, "Percent":
    0.6}}}}},

    "backColor": {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent":
    0.35}}}}},

    "outline": "Frame",

    "fontFamily": "Arial",

    "fontSize": 12

    }]

    }

    }

    }

    }

    ```


    在这个 JSON 中：


    - 通用总计字体颜色的字体颜色设置为比调色板最后一列（最右侧）深 50%。这对应于调色板的底行。

    - 表格总计字体颜色的字体颜色设置为比调色板最后一列（最右侧）的初始颜色亮 60%。这对应于调色板的第二行。

    - 表格总计背景颜色的字体颜色设置为比调色板倒数第二列的初始颜色亮 35%。这是一个自定义色调，无法在调色板中直接获得。


    一旦你在主题文件中以这种方式设置了颜色，更改整个主题的颜色就会变得异常简单。你只需修改八个调色板颜色初始定义中的颜色——主题中的所有颜色都会更新，以反映新的核心颜色选择。


    ## 结论


    在本章中，你学习了如何通过定义级联样式元素和颜色应用来加速仪表板格式化。你学习了如何使用更高级别、更通用的样式定义来定义视觉格式化，然后使用针对特定视觉元素的定制定义来完成（甚至覆盖）这些定义。你还了解了如何使用样式层次结构应用属性定义。


    然后，你学习了如何创建级联颜色定义，使你可以将颜色选择关联回调色板。这使你能够避免硬编码颜色选择，并为你的主题文件带来新的灵活性。


    至此，你已完成了 Power BI 主题的探索。希望你享受阅读本书的过程，并且它能在你创建 Power BI 仪表板时帮助你节省时间。'
  raw: 'As an example, to apply the second row of the color palette in the penultimate
    column, the percentage figure will be 0.6, as in the following code snippet:


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 8, "Percent": 0.6}}}}}

    ```


    To apply the bottom row of the seventh column (and the fifth that you can set),
    the percentage figure will be -0.5, as in the following code snippet:


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 6, "Percent": -0.5}}}}}

    ```


    To stress the point, the lighter shades are positive figures, and darker shades
    are negative figures.


    If you want to apply the basic color that appears in the top row of the color
    palette, then simply set the percentage figure to 0 – like this:


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 6, "Percent": 0}}}}}

    ```


    Colors based on the color palette can be applied after several possible keywords:


    *   Color


    *   Background


    *   Title font color


    *   Background font color


    *   Value font color


    *   Indeed, anywhere a color is set in the JSON theme file


    However, cascading color references *cannot* be applied to the simple color definitions
    such as text classes and elementary colors (*firstLevelElements*, etc.).


    Interestingly, in the actual JSON, you can define *any percentage variant* of
    the initial theme color that you like and do not have to stick to the percentages
    used by the color palette. So you could, for instance, define a variant of a theme
    color like this:


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 5, "Percent": -0.37}}}}}

    ```


    This allows you a wide range of potential shades based on the original palette.


    As an example of cascading colors, take a look at the following JSON code. This
    can be found in the file CascadingColors.json.


    ```

    {

    "name": "Cascading Colors",

    "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
    "#FFFF00", "#FF001E"],

    "visualStyles":

    {"*":

    {"*":

    {

    "total":

    [{

    "totals": true,

    "label": "TOTAL",

    "fontColor": {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent":
    -0.5}}}}},

    "fontFamily": "Arial",

    "fontSize": 10

    }]

    }

    },

    "tableEx":

    {"*":

    {

    "total":

    [{

    "totals": true,

    "label": "TOTAL",

    "fontColor": {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 8, "Percent":
    0.6}}}}},

    "backColor": {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 9, "Percent":
    0.35}}}}},

    "outline": "Frame",

    "fontFamily": "Arial",

    "fontSize": 12

    }]

    }

    }

    }

    }

    ```


    In this JSON


    *   The font color for the generic total font color is set to 50 percent darker
    than the final (rightmost) column in the color palette. This corresponds to the
    bottom row in the palette.


    *   The font color for the table total font color is set to 60 percent lighter
    than the final (rightmost) column initial color in the color palette. This corresponds
    to the second row in the palette.


    *   The font color for the table total background color is set to 35 percent lighter
    than the penultimate column’s initial color in the color palette. This is a custom
    shade that is not directly available in the palette.


    Once you have set up colors in this way in a theme file, it becomes ridiculously
    easy to change the colors throughout the theme. All you have to do is to modify
    the colors in the initial definition of the eight palette colors – and all the
    colors in the theme are updated to reflect the new choice of core colors.


    ## Conclusion


    You have learned in this chapter how to accelerate dashboard formatting by defining
    cascading style elements and color application. You learned how to define visual
    formatting using a mixture of high-level, more generally applicable stylistic
    definitions and then complete (or even override) these with tailored definitions
    for specific visuals. You also saw how attribute definition can be applied using
    a hierarchy of styles.


    Then you saw how to create cascading color definitions that enable you to refer
    your color choices back to the color palette. This enables you to avoid hard-coding
    color choices and bring a new flexibility to your theme files.


    With this you have finished your tour of Power BI themes. I hope that you have
    enjoyed this book and that it will help you save time when creating Power BI dashboards.'
  trans: '好的，这是根据您的要求和提供的示例格式，翻译后的中文文档。



    作为示例，要应用调色板中倒数第二列的第二行，百分比数值将为`0.6`，如下代码片段所示：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 8, "Percent": 0.6}}}}}

    ```


    要应用第七列（即你能设置的第五列）的底行，百分比数值将为 `-0.5`，如下代码片段所示：


    ```

    {"solid": {"color": {"expr":{"ThemeDataColor":{"ColorId": 6, "Percent": -0.5}}}}}

    ```


    需要强调的是，较浅的色调为正数，较深的色调为负数。


