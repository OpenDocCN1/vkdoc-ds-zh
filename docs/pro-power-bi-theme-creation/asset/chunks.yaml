    描述滑块部分的 `slider` 关键字使用了表 12-14 中所示的关键字。


    **表 12-14**

    **滑块部分的元素关键字映射**


    | 元素 | 关键字 |

    | --- | --- |

    | 滑块 | `show` |

    | 颜色 | `color` |


    描述项部分的 `items` 关键字使用了表 12-15 中所示的关键字。


    **表 12-15**

