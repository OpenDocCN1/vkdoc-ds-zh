    | --- | --- |

    | X axis | `show` |

    | Color | `color` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Minimum category width | `preferredCategoryWidth` |

    | Maximum size | `maxMarginFactor` |

    | Concatenate labels | `concatenateLabels` |

    | Title | `showAxisTitle` |

    | Style | `axisStyle` |

    | Title color | `titleColor` |

    | Axis title | `titleText` |

    | Title text size | `titleFontSize` |

    | (Axis) Font family | `titleFontFamily` |


    Zoom keywords are given in Table [7-5](#511180_1_En_7_Chapter.xhtml#Tab5).


    The `labels` keyword that describes the data labels section uses the keywords
    shown in Table [9-25](#511180_1_En_9_Chapter.xhtml#Tab25).


    **Table 9-25** Element Keyword Mapping for the Data Labels Section


    | Element | Keyword |

    | --- | --- |

    | Data labels | `show` |

    | Color | `color` |

    | Display units | `labelDisplayUnits` |

    | Value decimal places | `labelPrecision` |

    | Orientation | `labelOrientation` |

    | Position | `labelPosition` |

    | Overflow text | `labelOverflow` |

    | Text size | `fontSize` |

    | Font family | `fontFamily` |

    | Show background | `enableBackground` |

    | Background color | `backgroundColor` |

    | Transparency | `backgroundTransparency` |


    Plot area keywords are given in Table [7-8](#511180_1_En_7_Chapter.xhtml#Tab8).


    The `ribbonChart` keyword that describes the ribbons section uses the keywords
    shown in Table [9-26](#511180_1_En_9_Chapter.xhtml#Tab26).


    **Table 9-26** Element Keyword Mapping for the Ribbons Section


    | Element | Keyword |

    | --- | --- |

    | Ribbons | `Show` |

    | Spacing | `seriesGapRatio` |

    | Match series color | `colorBands` |

    | Transparency | `bandsTransparency` |

    | Border | `showBorder` |


    Categories keywords are given in Table [7-3](#511180_1_En_7_Chapter.xhtml#Tab3).


    Labels keywords are given in Table [7-6](#511180_1_En_7_Chapter.xhtml#Tab6).


    Plot area keywords are given in Table [7-8](#511180_1_En_7_Chapter.xhtml#Tab8).


    You can find the JSON code for this in the sample file `Attributes_RibbonChart.json`.


    # Conclusion


    This chapter introduced you to the JSON code that you need to format the six remaining
    chart types. You saw the specifics of preparing the JSON for pie, donut, treemap,
    waterfall, funnel, and ribbon charts.


    Now that the three-chapter tour of chart types is finished, it is time to move
    on to another completely different category of visuals in Power BI – maps. These
    are the subject of the next chapter.


    # 10. Maps


    This chapter looks at a completely different type of visual to those covered in
    the preceding three chapters. Here, we will look at how maps can be pre-formatted
    using theme files. Here, you will see how to prepare the JSON to define the presentation
    of the following visual types:


    *   Map

    *   Filled map

    *   Shape map


    Each of the map types discussed in this chapter has a separate JSON file in the
    samples folder that contains the code that you can use to define your own theme
    files.'
