  raw: '## JSON Keywords


    The fact that theme files use keywords inevitably means that you need to know
    the exact terms that are required in a JSON theme file if you are going to set
    formatting attributes that


    *   Map to a section in the formatting pane of Power BI Desktop


    *   Specify an attribute


    *   Are chosen from a popup menu in Power BI Desktop


    The general rules for guessing the definition in JSON of a selectable element
    in Power BI Desktop are


    *   Hover the pointer over an icon (such as the alignment icons) and use the popup
    text as the definition


    *   Use the popup menu text (for the shadow position, for instance) but with all
    spaces removed and with initial capitals


    However, to save you guessing at keywords, they are all described in later chapters
    of this book.


    ## The JSON Hierarchy in Theme Files


    JSON lends itself to hierarchical structures – and so is based on the approach
    that you can see outlined in Figure [4-2](#511180_1_En_4_Chapter.xhtml#Fig2).


    ![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig2_HTML.jpg](images/511180_1_En_4_Chapter/511180_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    The JSON hierarchy in theme files


    Note


    The style name is always an asterisk. If you are defining generic attributes (as
    is the case in this chapter), then the second asterisk replaces the visual name
    that you can see in later, more specific, theme files.


    ## Elements Common to Most Chart Types


    Now that you have seen how to define the formatting for shared (or common) elements,
    we can move on to the next level of “generic” formatting. This involves setting
    *some* of the formatting parameters of chart visuals.


    There are several aspects of chart formatting that are shared by multiple charts.
    For instance, stacked bar charts, stacked column charts, clustered bar charts,
    clustered column charts, line charts, area charts, stacked area charts, line and
    clustered column charts, and line and stacked column charts all contain the following
    elements:


    *   The category (X) axis


    *   The values (Y) axis


    *   Data labels


    *   Plot area


    *   Legend


    Indeed, certain of these elements are also common to a few other chart types such
    as ribbon charts, waterfall charts, and scatter charts (even if these chart types
    only contain some of the formatting options in the preceding list). There are
    even charts such as funnel charts, pie charts, and donut charts that use at least
    one of the formatting elements listed earlier.


    To save you the effort of having to define these similar or identical aspects
    of chart formatting to each individual chart type, you can specify *standard formatting*
    that will be applied to a chart element *if it exists*. This means that if you
    have created a chart that does not have one of these elements (say a donut chart
    that does not have category and values axes but *does* have a legend) but have
    nonetheless set these attributes in a theme file, then the definitions of any
    nonrelevant formatting elements are simply *not applied* to the chart in question.
    What is more, you do *not have to define every format option* that exists in an
    expanded tab of the Format Pane. That is, you can only decide to set one or two
    formatting options for the legend out of all the available options, if you so
    wish. In other words, you can predefine as many aspects of chart formatting as
    you want without worrying about actually having to use them. Power BI Desktop
    does not care about whether a JSON format is used – only if it is syntactically
    accurate. This means that you can define as much (or as little) generic formatting
    as you like as long as the JSON is correct.


    Here, then, is an extract from a JSON theme file that applies some (but not all)
    of the formatting to a series of shared chart elements. You can find the complete
    code in the file ColorAndTextClassesWithCoreVisualDefaultsAndKeyChartTypes.json.


    The JSON to define a set of standard chart formats could look like this:


    ```

    {

    "name": "Common chart elements",

    "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
    "#FFFF00", "#FF001E"],

    "visualStyles":

    {"*":

    {"*":

    {

    "title": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "dropShadow":   [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "axisScale": "Linear",

    "position": "left",

    "labelColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8,

    "showAxisTitle": true,

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "titleColor": {"solid": {"color": "#949494"}},

    "gridLineShow": true,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "axisScale": "Linear",

    "labelColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8,

    "showAxisTitle": true,

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "titleColor": {"solid": {"color": "#949494"}},

    "gridLineShow": true,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid",

    "axisStyle": "ShowTitleOnly"

    }],

    "labels": [{

    "show": true,

    "labelPosition": "InsideEnd",

    "color": {"solid": {"color": "#ffffff"}},

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#E8E8E8"}},

    "backgroundTransparency": 0

    }],

    "plotArea": [{

    "transparency": 0

    }],

    "legend": [{

    "show": true,

    "position": "Bottom",

    "showTitle": true,

    "titleText": "Add a legend title",

    "legendColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8

    }]

    }

    }

    }

    }

    ```


    In this JSON snippet – once again – the keywords correspond to sections of the
    Format Pane in Power BI Desktop. The sections that are referred to here are common
    to bar, column, line, and area charts.


    *   The *category (X) axis* is defined by the keyword *categoryAxis*.


    *   The *values (Y) axis* is defined by the keyword *valueAxis*.


    *   *Data labels* are defined by the keyword *labels*.


    *   The *plot area* is defined by the keyword *plotArea*.


    *   The *legend* is defined by the keyword *legend*.'
  trans: '

    # JSON 关键字


    主题文件使用关键字这一事实，必然意味着如果你要设置满足以下条件的格式属性，就需要知道 JSON 主题文件中所需的准确术语：


    -   映射到 Power BI Desktop 格式化窗格中的某个部分

    -   指定一个属性

    -   从 Power BI Desktop 的弹出菜单中进行选择


    在 Power BI Desktop 中猜测可选择元素的 JSON 定义的一般规则是：

    -   将指针悬停在图标（例如对齐图标）上，并使用弹出文本作为定义

    -   使用弹出菜单文本（例如，用于阴影位置），但移除所有空格并保留首字母大写


    然而，为了省去你猜测关键字的麻烦，它们都将在本书后面的章节中描述。


    # 主题文件中的 JSON 层级结构


    JSON 本身适合层级结构——因此它基于你在图 4-2 中看到的概要方法。


    ![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig2_HTML.jpg](img/511180_1_En_4_Fig2_HTML.jpg)


    *图 4-2 – 主题文件中的 JSON 层级结构*


    > **注意：** 样式名称始终是星号。如果你正在定义通用属性（如本章所示），那么第二个星号会替换你将在后面更具体的主题文件中看到的视觉对象名称。


    # 大多数图表类型共有的元素


    既然你已经了解了如何定义共享（或通用）元素的格式，我们就可以进入下一层级的“通用”格式设置。这涉及到设置图表视觉对象的*部分*格式参数。


    图表的格式设置有几个方面是多种图表共享的。例如，堆积条形图、堆积柱形图、簇状条形图、簇状柱形图、折线图、面积图、堆积面积图、折线图和簇状柱形图以及折线图和堆积柱形图都包含以下元素：


    -   类别（X）轴

    -   数值（Y）轴

    -   数据标签

    -   绘图区

    -   图例


    事实上，其中某些元素也常见于其他几种图表类型，例如功能区图、瀑布图和散点图（即使这些图表类型仅包含前面列表中的部分格式选项）。甚至还有漏斗图、饼图和环形图等图表，它们至少使用了前面列出的一个格式元素。


    为了省去你为每种图表类型分别定义这些相似或相同的图表格式属性的麻烦，你可以指定*标准格式*，该格式将应用于图表元素*（如果存在的话）*。这意味着，如果你创建了一个不包含这些元素之一的图表（例如没有类别和数值轴但*确实*有图例的环形图），但仍在其主题文件中设置了这些属性，那么任何不相关的格式元素定义将*不会应用于*该图表。更重要的是，你*不必定义*格式窗格展开选项卡中存在的*每个格式选项*。也就是说，如果你愿意，你可以仅从所有可用选项中为图例设置一两个格式选项。换句话说，你可以根据需要预定义任意多的图表格式方面，而不必担心是否实际使用它们。Power
    BI Desktop 不关心 JSON 格式是否被使用——只关心其语法是否准确。这意味着，只要 JSON 语法正确，你可以定义任意多（或少）的通用格式。


    下面是一个 JSON 主题文件的摘录，它对一系列共享的图表元素应用了部分（而非全部）格式。你可以在文件 `ColorAndTextClassesWithCoreVisualDefaultsAndKeyChartTypes.json`
    中找到完整的代码。


    用于定义一组标准图表格式的 JSON 可能如下所示：


    ```json

    {

    "name": "Common chart elements",

    "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
    "#FFFF00", "#FF001E"],

    "visualStyles":

    {"*":

    {"*":

    {

    "title": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "dropShadow":   [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "axisScale": "Linear",

    "position": "left",

    "labelColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8,

    "showAxisTitle": true,

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "titleColor": {"solid": {"color": "#949494"}},

    "gridLineShow": true,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid"

    }],

    "valueAxis": [{

    "show": true,

    "position": "Left",

    "axisScale": "Linear",

    "labelColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8,

    "showAxisTitle": true,

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial",

    "titleColor": {"solid": {"color": "#949494"}},

    "gridLineShow": true,

    "gridLineColor":  {"solid": {"color": "#949494"}},

    "gridLineThickness": 1,

    "gridlineStyle": "Solid",

    "axisStyle": "ShowTitleOnly"

    }],

    "labels": [{

    "show": true,

    "labelPosition": "InsideEnd",

    "color": {"solid": {"color": "#ffffff"}},

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#E8E8E8"}},

    "backgroundTransparency": 0

    }],

    "plotArea": [{

    "transparency": 0

    }],

    "legend": [{

    "show": true,

    "position": "Bottom",

    "showTitle": true,

    "titleText": "Add a legend title",

    "legendColor": {"solid": {"color": "#949494"}},

    "fontFamily": "Arial",

    "fontSize": 8

    }]

    }

    }

    }

    }

    ```


    在这个 JSON 片段中——再次提醒——这些关键字对应于 Power BI Desktop 中格式窗格的部分。这里引用的部分对于条形图、柱形图、折线图和面积图是通用的。


    - *类别（X）轴*由关键字 `categoryAxis` 定义。

    - *数值（Y）轴*由关键字 `valueAxis` 定义。

    - *数据标签*由关键字 `labels` 定义。

    - *绘图区*由关键字 `plotArea` 定义。

    - *图例*由关键字 `legend` 定义。

    '
- fmt: '## 扩展特定图表类型的通用格式


    前面的 JSON 片段展示了如何为五种图表元素定义核心格式。然而，有些情况下，你可能希望添加一些仅适用于少数几种图表类型（甚至单一图表类型）的元素。幸运的是，这只需对
    JSON 代码进行简单扩展即可。


    例如，假设你想在主题文件中添加以下两个元素：


    *   折线图、面积图、堆叠面积图、折线图与簇状柱形图、以及折线图与堆叠柱形图中使用的线条和连接格式

    *   圆环图中使用的中心半径百分比


    你可以通过以下代码片段来扩展前面的 JSON（并确保在 JSON 文件中用逗号分隔这两段代码）。完整的 JSON 主题文件可在示例文件中找到，名为`ColorAndTextClassesWithCoreVisualDefaultsAndKeyChartTypesExtended.json`。添加到先前片段中的代码如下：


    ```

    "lineStyles": [{

    "ShadedArea": true,

    "strokeWidth": 1,

    "lineStyle": "Solid",

    "showMarker": true,

    "markerShape": "Triangle",

    "markerSize": 2,

    "markerColor": {"solid": {"color": "#949494"}}

    }],

    "slices": [{

    "innerRadiusRatio": 20

    }]

    ```


    此 JSON 将仅应用于那些在 Power BI Desktop 中实际包含以下格式部分的图表：


    *   **形状**（对于折线图和面积图，在 JSON 中用`lineStyles`关键字表示）

    *   **形状/内部半径**（对于圆环图，用`slices`关键字表示）


    正如你所见，Power BI Desktop 格式部分与相应 JSON 关键字之间的关联并非总是完全直观。然而，一旦理解了这些映射关系，创建和修改 JSON
    主题文件就变得相当直接了。


    ## 表格元素


    当然，并非 Power BI 中的所有视觉对象都是图表。有些核心视觉对象与图表截然不同，例如表、矩阵和卡片，你可能在仪表板中经常使用它们。幸运的是，你也可以快速轻松地定义这些视觉对象的核心格式。


    以下代码片段为以下表格（和矩阵）元素添加了格式规范：


    *   网格

    *   列标题

    *   值

    *   总计


    幸运的是，JSON 关键字与 Power BI Desktop 格式窗格中针对表和矩阵的节标题非常对应。此外，格式元素是简单的键/值对，与 Power BI
    Desktop 中的实际格式属性紧密映射，因此这里无需额外解释。


    ```

    "style":  [{"styleType": "Minimal"}],

    "grid":    [{

    "gridVertical": false,

    "gridVerticalColor": {"solid": {"color": "#171796"}},

    "gridVerticalWeight": 1,

    "gridHorizontal": false,

    "gridHorizontalColor": {"solid": {"color": "#171796"}},

    "gridHorizontalWeight": 1,

    "textSize": 8,

    "rowPadding": 1,

    "outlineColor": {"solid": {"color": "#ffffff"}},

    "outlineWeight": 1

    }],

    "columnHeaders": [{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "backColor": {"solid": {"color": "#E34B20"}},

    "outline": "Frame",

    "alignment": "Left",

    "wordWrap": true

    }],

    "values": [{

    "fontColorPrimary": {"solid": {"color": "#3D4E57"}},

    "backColorPrimary": {"solid": {"color": "#F5F4F0"}},

    "fontColorSecondary": {"solid": {"color": "#3D4E57"}},

    "backColorSecondary": {"solid": {"color": "#E3DFD4"}},

    "outline": "Frame",

    "alignment": "Left",

    "wordWrap": true

    }],

    "total": [{

    "totals": true,

    "fontColor": {"solid": {"color": "#000000"}},

    "backColor": {"solid": {"color": "#D1CAB8"}},

    "outline": "Frame"

    }]

    ```


    再次说明，并非所有在 Power BI Desktop 中可用于总计、值、列标题和网格的格式选项都已通过 JSON 主题文件应用。同样地，任何未在 JSON
    文件中设置的格式元素都将保留为应用此主题的 Power BI Desktop 文件中的默认值。


    此 JSON 代码可在示例文件`ColorsAndTextClassesWithVisualDefaults.json`中找到。


    ## 最后的说明


    如果你将本章中探讨的所有 JSON 片段添加到一个主题文件中，完整的 JSON 主题文件将包含以下高级格式定义：


    *   调色板

    *   全局颜色应用

    *   标准字体规范

    *   核心图表元素

    *   核心表格元素


    一个包含所有这些元素并组装成可用主题的文件可在示例数据目录中找到，名为`GenericBaseFormatting.json`。


    你可以查看整个文件，内容如下。我意识到这是一段庞大的代码（大约 230 行），但值得全面了解你创建的所有内容以及它们是如何组合成一个连贯主题的：'
  raw: '## Extending Generic Formatting for Specific Chart Types


    The previous JSON snippet showed how to define core formatting for five chart
    elements. There could be cases, however, where you want to add a few elements
    that only apply to a select few types of chart – or even a single chart type.
    Fortunately, this is a simple extension to the JSON code.


    Suppose, for instance, that you want to add the following two elements to the
    theme file:


    *   The line and join formatting found in line charts, area charts, stacked area
    charts, line and clustered column charts, and line and stacked column charts


    *   The central radius percentage used in donut charts


    You can do this by extending the previous JSON with the following code snippet
    (and ensuring that there is a comma separating the two pieces of code in the JSON
    file). The complete JSON theme file can be found with the sample files. It is
    called ColorAndTextClassesWithCoreVisualDefaultsAndKeyChartTypesExtended.json.
    The code that is added to the snippet that you saw previously is


    ```

    "lineStyles": [{

    "ShadedArea": true,

    "strokeWidth": 1,

    "lineStyle": "Solid",

    "showMarker": true,

    "markerShape": "Triangle",

    "markerSize": 2,

    "markerColor": {"solid": {"color": "#949494"}}

    }],

    "slices": [{

    "innerRadiusRatio": 20

    }]

    ```


    This JSON will only be applied to charts that actually contain the following formatting
    sections in Power BI Desktop:


    *   *Shapes* (represented by the lineStyles keyword in JSON for line and area
    charts)


    *   *Shapes/Inner radius* (represented by the slices keyword for donut charts)


    As you are starting to see, the correlation between the Power BI Desktop formatting
    section and the corresponding JSON keywords is not always completely intuitive.
    However, once the mappings are understood, creating and modifying JSON theme files
    becomes fairly straightforward.


    ## Table Elements


    Not all visuals in Power BI, of course, are charts. There are core visuals that
    are very unlike charts that you probably rely on in your dashboards such as tables,
    matrices, and cards. Fortunately, it is also possible to define the core formatting
    of these types of visuals quickly and easily.


    The following code snippet adds the formatting specification for the following
    table (and matrix) elements:


    *   Grid


    *   Column headers


    *   Values


    *   Total


    Fortunately, the JSON keywords correspond very closely to the section headers
    in the Power BI Desktop format pane for tables and matrices. Also, the format
    elements are simple key/value pairs that map closely to the actual format attributes
    in Power BI Desktop, so little additional explanation is necessary here.


    ```

    "style":  [{"styleType": "Minimal"}],

    "grid":    [{

    "gridVertical": false,

    "gridVerticalColor": {"solid": {"color": "#171796"}},

    "gridVerticalWeight": 1,

    "gridHorizontal": false,

    "gridHorizontalColor": {"solid": {"color": "#171796"}},

    "gridHorizontalWeight": 1,

    "textSize": 8,

    "rowPadding": 1,

    "outlineColor": {"solid": {"color": "#ffffff"}},

    "outlineWeight": 1

    }],

    "columnHeaders": [{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "backColor": {"solid": {"color": "#E34B20"}},

    "outline": "Frame",

    "alignment": "Left",

    "wordWrap": true

    }],

    "values": [{

