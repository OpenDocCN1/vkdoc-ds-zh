- fmt: '## Adding Notes to Theme Files


    Unfortunately, the JSON used in theme files does not support adding comments as
    you can with most programming languages. So you cannot use `//` or `/* … */` or
    `- -` to introduce comments in or after JSON code as you can in certain programming
    languages.


    While this can certainly be a limitation, there is a workaround that you might
    find useful. This is to invent your own keywords and use them to introduce your
    comments to annotate the file. You can see an example of this in the following
    code snippet, where a couple of notes are added at the top of the visual styles
    formatting section of the theme file:


    ```

    "visualStyles":

    {

    "myNotesForOneSubject" : "Currently you can add notes like this",

    "Notes" : "It apparently has to be here in the structure",

    ```


    Another trick is to add notes at the start of the formatting for a specific visual
    – like this:


    ```

    "textbox":

    {"*" :

    {

    "myTextboxNotes" : "Currently you can add notes like this",

    "title":    [{ ... CODE OMITTED ... }]

    ```


    You need to be aware that this is unsupported, and although it works for the moment,
    it might cease to work in the future. Also, I advise you to invent keywords that
    are highly unlikely to be used one day by Power BI. This way, you minimize the
    risk of causing failures as the product evolves.


    Another idea that can be useful when you create multiple theme files is to use
    the name field to add header information to a theme file. You can see an example
    of this in the following code snippet:


    ```

    "name": "Generic Base Formatting add lots of comments to explain why this is used,
    when it was created etc"

    ```


    However, you cannot add line or carriage returns inside the comment itself. And
    I prefer to avoid single or double quotes as well. Nonetheless, adding comments
    at the top of a theme file can be particularly useful if your collection of theme
    files starts to grow, as it enables you to track the files much more easily than
    through reading the JSON when trying to remember what the specifics of a theme
    are.


    ## Analyze the Contents of Power BI Desktop Files


    As Power BI evolves, new features will, inevitably, be added, and this means additional
    formatting possibilities. So you might need to discover new keywords and/or their
    attributes.


    The way to do this is to:


    1. Create a Power BI Desktop file containing the visual whose JSON formatting
    you want to extend.


    2. Manually format the attributes that are new (this means that they will appear
    in the Power BI Desktop file – default formatting does not).


    3. Save the Power BI Desktop file.


    4. Unzip the Power BI Desktop file to a folder.


    5. Open the folder where you unzipped the Power BI Desktop file.


    6. Open the folder named `Report`.


    7. Open the file named `Layout` with a text editor.


    You will see a – largely incomprehensible – text that, in fact, contains the JSON
    formatting for the elements that you formatted in step 2. The trick now is to
    find what you formatted and consequently the keyword that Power BI uses for the
    theme file. You need to be warned that this can take practice and patience!


    You can see an example of the report contents in Figure [12-1](#511180_1_En_12_Chapter.xhtml#Fig1).
    Note that the `outspacePane` keyword is highlighted so you can see how its properties
    appear in the underlying Power BI Desktop file.


    ![../images/511180_1_En_12_Chapter/511180_1_En_12_Fig1_HTML.jpg](images/511180_1_En_12_Chapter/511180_1_En_12_Fig1_HTML.jpg)


    Figure 12-1


    Partial contents of a `.PBIX` file


    ## Conclusion


    This concludes your overview of the various objects that can be formatted using
    a JSON theme file in Power BI. In this chapter, you saw how to format action buttons,
    slicers, the page itself, and the filter pane using the same approaches that you
    have applied in previous chapters.


    I have now only one final process to explain – how to create cascading styles
    in theme files. You will learn about this in the next – and final – chapter.


    # 13. Cascading Styles


    In this book, you have seen that you can define visual appearance using JSON styles
    at several levels. The final part of the learning curve is to appreciate how styles
    can cascade from a high-level definition down through progressively finer specifications.
    Appreciating this will allow you to save time when creating theme files as you
    are, in effect, able to define many presentation attributes once – rather than
    have to define all the subtleties of every visual.


    These “cascading styles” happen in two separate ways:


    - Text definitions cascade down through generic style definitions to specific
    visual formatting definitions.


    - Colors cascade down from the color palette settings to be used wherever a color
    can be applied in a theme file.'
  raw: '## Adding Notes to Theme Files


    Unfortunately, the JSON used in theme files does not support adding comments as
    you can with most programming languages. So you cannot use // or /* …*/ or - -
    to introduce comments in or after JSON code as you can in certain programming
    languages.


    While this can certainly be a limitation, there is a workaround that you might
    find useful. This is to invent your own keywords and use them to introduce your
    comments to annotate the file. You can see an example of this in the following
    code snippet, where a couple of notes are added at the top of the visual styles
    formatting section of the theme file:


    ```

    "visualStyles":

    {

    "myNotesForOneSubject" : "Currently you can add notes like this",

    "Notes" : "It apparently has to be here in the structure",

    ```


    Another trick is to add notes at the start of the formatting for a specific visual
    – like this:


    ```

    "textbox":

    {"*" :

    {

    "myTextboxNotes" : "Currently you can add notes like this",

    "title":    [{ ... CODE OMITTED ... }]

    ```


    You need to be aware that this is unsupported, and although it works for the moment,
    it might cease to work in the future. Also, I advise you to invent keywords that
    are highly unlikely to be used one day by Power BI. This way, you minimize the
    risk of causing failures as the product evolves.


    Another idea that can be useful when you create multiple theme files is to use
    the name field to add header information to a theme file. You can see an example
    of this in the following code snippet:


    ```

    "name": "Generic Base Formatting add lots of comments to explain why this is used,
    when it was created etc"

    ```


    However, you cannot add line or carriage returns inside the comment itself. And
    I prefer to avoid single or double quotes as well. Nonetheless, adding comments
    at the top of a theme file can be particularly useful if your collection of theme
    files starts to grow, as it enables you to track the files much more easily than
    through reading the JSON when trying to remember what the specifics of a theme
    are.


    ## Analyze the Contents of Power BI Desktop Files


    As Power BI evolves, new features will, inevitably, be added, and this means additional
    formatting possibilities. So you might need to discover new keywords and/or their
    attributes.


