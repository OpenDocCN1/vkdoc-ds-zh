- fmt: '# Ribbon Chart


    To conclude not only the chapter but also the review of chart type formatting
    in theme files, you need to look at the ribbon chart. This chart type is very
    similar to a line chart – at least as far as the JSON is concerned. The principal
    difference is the addition of the `ribbonChart` keyword that introduces the section
    on the specifics of ribbon chart formatting. Confusingly, this is the same keyword
    that is used to define the actual ribbon chart object in the JSON.


    Table [9-23](#511180_1_En_9_Chapter.xhtml#Tab23) outlines the JSON keyword that
    you can use in ribbon chart formatting and the section that corresponds to each
    keyword in the Power BI Desktop format pane.


    **Table 9-23** Ribbon Chart Keywords


    | Keyword | Formatting Section |

    | --- | --- |

    | `general` | General |

    | `legend` | Legend |

    | `categoryAxis` | X axis |

    | `zoom` | Zoom slider |

    | `labels` | Data labels |

    | `plotArea` | Plot area |

    | `ribbonChart` | Ribbons |

    | `title` | Title |

    | `background` | Background |

    | `lockAspect` | Lock aspect |

    | `border` | Border |

    | `dropShadow` | Shadow |

    | `visualHeader` | Visual header |


    The following code snippet provides the JSON code used to pre-format a ribbon
    chart:


    ```json

    "ribbonChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

    "categoryAxis": [{

    "show": true,

    "color": {"solid": {"color": "#949494"}},

    "fontSize": 8,

    "fontFamily": "Arial",

    "preferredCategoryWidth": 20,

    "maxMarginFactor": 30,

    "concatenateLabels": true,

    "showAxisTitle": true,

    "axisStyle": "showTitleOnly",

    "titleColor": {"solid": {"color": "#949494"}},

    "titleText": "Add an Axis Title",

    "titleFontSize": 8,

    "titleFontFamily": "Arial"

    }],

    "labels": [{

    "show": true,

    "color": {"solid": {"color": "#ffffff"}},

    "labelDisplayUnits": 1,

    "labelPrecision": 2,

    "labelPosition": "InsideEnd",

    "labelOverflow": true,

    "labelOrientation": "vertical",

    "fontFamily": "Arial",

    "fontSize": 7,

    "enableBackground": false,

    "backgroundColor": {"solid": {"color": "#949494"}},

    "backgroundTransparency": 0

    }],

    "plotArea": [{... code not shown ...}],

    "ribbonChart": [{

    "seriesGapRatio": 5,

    "colorBands": true,

    "bandsTransparency": 50,

    "showBorder": true

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]        }

    }

    ```


    Legend keywords are given in Table [7-2](#511180_1_En_7_Chapter.xhtml#Tab2).


    The `categoryAxis` keyword that describes the X axis section uses the keywords
    shown in Table [9-24](#511180_1_En_9_Chapter.xhtml#Tab24).


    **Table 9-24** Element Keyword Mapping for the X Axis Section


