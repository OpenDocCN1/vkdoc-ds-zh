  raw: 'When delving into the arcane depths of technical products, it is all too easy
    to lose sight of the main objectives of a book. Fortunately, my good friend and
    former colleague Natalie Jayne Heger, the technical reviewer, has worked unstintingly
    to help me retain focus on the objectives of this book. She has also shared her
    considerable experience of Power BI Desktop in the enterprise and has helped me
    immensely with her comments and suggestions.


    Finally, my deepest gratitude has to be reserved for the two people who have given
    the most to this book. They are my wife and son, who have always encouraged me
    to persevere while providing all the support and encouragement that anyone could
    want. I am very lucky to have both of them.


    About the Author About the Technical Reviewer


    # 1. Introduction to Power BI Themes


    Power BI has taken the world by storm when it comes to creating attention-grabbing
    dashboards that empower users. It has come to dominate the analytics arena with
    its ease of use, wide range of connectivity options, and the variety of available
    visuals.


    However, formatting (and reformatting) dashboard visuals can prove time-consuming
    and repetitive – as can standardizing the presentation of multiple dashboards
    to create a unified look and feel for a suite of reports. Most users would rather
    spend their time analyzing and delivering meaningful insights as opposed to applying
    colors and font choices to charts and tables.


    This is where the creation and application of Power BI *themes* comes in. A theme
    is a standardized definition of some – or all – of the formatting of a dashboard.
    This can range from defining a color palette and a selection of font choices to
    the detailed specification of each and every visual. Applying a theme allows you
    to format virtually every visual in a dashboard *instantly*. What is more, any
    changes that you subsequently make to a theme can be reapplied in a few clicks
    to update your dashboard’s presentation. Themes can be created once, then applied
    to dozens or even hundreds of Power BI dashboards to guarantee a coherent and
    rigorously standardized presentation style across a department or even an entire
    organization.


    Themes can be as simple – or as detailed – as you require. They can specify standardized
    fonts, text colors, and font sizes or set the tiniest details of how each individual
    type of visual is formatted. Indeed, themes are designed to work at multiple levels
    – starting with general elements and then progressing deeper and deeper into tightly
    specified definitions of the presentation of each element in a dashboard. This
    gives you a range of options when it comes to defining how you standardize Power
    BI dashboards.


    ## Theme Basics


    Themes are, technically, JSON files. That is, they use the JSON (JavaScript Object
    Notation) format to store the definition of how dashboard objects are formatted.
    But don’t worry if you have never used – or even heard of – JSON before now, as
    I will be explaining all you need to know about it during the course of this book.
    The only thing to retain for the moment is that themes are like external stylesheets
    for Power BI (very like the stylesheets that are used by Microsoft Word, for instance).
    The advantage of defining formats with external files is that you can simply send
    your colleagues themes as small text-based files that they can then apply in a
    few clicks to any of their own Power BI dashboards. Themes can also be integrated
    into Power BI templates to accelerate even further the dashboard creation process.


    Themes are applied to Power BI Desktop files. Once loaded, they become an integral
    part of the Power BI Desktop .pbix file. The formatting is then, of course, carried
    over into the Power BI service when you publish the dashboard. Moreover, you can
    switch between different theme files in a few clicks to try out different formatting
    approaches or apply a completely different look and feel. Equally fortunately,
    there is nothing definitive about applying a theme file, as you can switch to
    another Power BI presentation style based on a different theme at any time. So
    you are free to experiment with different styles until you find the look and feel
    that suits the particular dashboard that you are creating.


    A theme allows you to preset virtually anything that is defined in the Power BI
    formatting pane. Consequently, it can contain formatting definitions for


    *   The color palette


    *   The page


    *   Inserted objects (text boxes, shapes, buttons, and images)


    *   Built-in visuals (tables, charts, maps, and other visuals)


    You can even apply a theme to the Power BI Desktop Filter pane. The principle
    is simple: if you can alter presentation in the formatting pane of Power BI Desktop,
    then you can define the format using a theme file.


    The portable nature of dashboard themes means that there are now a wide range
    of different themes that are freely available to enhance the presentation of Power
    BI dashboards. You may even have experimented with some of the themes that are
    available as an integral part of Power BI Desktop or shared through the Web.


    After reading this book and learning how these themes are created, you, too, will
    be able to develop themes that you can share – with friends, colleagues, or even
    the world.


    ## Anatomy of a Theme


    It is important to understand from the start that themes operate at two distinct
    levels. Firstly, themes can be defined to operate in a “generic” way. That is,
    you can define a set of high-level specifications to set core aspects of a dashboard
    and the visuals it contains without going into low levels of detail. This way
    you can quickly and easily define


    *   Colors


    *   Standard font attributes


    *   Shared elements for all visuals


    *   Certain elements specific to certain types of visuals


    You will discover how to create “generic” themes in Chapter [3](#511180_1_En_3_Chapter.xhtml).


    Then, at a more detailed level (and once you have acquired a thorough understanding
    of how themes work), you can specify the *exact formatting for each and every
    element of each visual* to give you total control of the appearance of each element
    in a dashboard. An in-depth definition of the JSON that is required at the level
    of individual visuals is the subject of Chapters [5](#511180_1_En_5_Chapter.xhtml)
    through [12](#511180_1_En_12_Chapter.xhtml).


    However, don’t get the idea that you have to choose between two different approaches.
    The truth is that a theme JSON file can “mix and match” the two approaches so
    that you can both define a set of overall style principles *and* then add highly
    specific definitions of the way that you want certain visuals to be displayed
    in a dashboard. The principle will always be that a more generic level of formatting
    applies unless a more detailed definition is found in the theme file.'
