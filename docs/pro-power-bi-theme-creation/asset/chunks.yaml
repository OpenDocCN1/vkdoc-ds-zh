    *   Background\n\n*   Title\n\n*   Border\n\n*   Shadow\n\n*   Tooltip\n\n*  \
    \ Visual header\n\n*   Lock aspect\n\nYou are probably used to setting these –\
    \ time and time again, if the truth be told – using the Power BI formatting pane.\n\
    \nThese format elements are defined by the following JSON theme keywords:\n\n\
    *   *background*: Sets all the attributes in the Background card of the Format\
    \ Pane for a visual as well as setting the background for the page\n\n*   *title*:\
    \ Sets all the attributes in the Title card of the Format Pane for a visual\n\n\
