  raw: '## Table


    As one of the most widely used visuals in Power BI dashboards, you will doubtless
    need to know the details (and intricacies) of how to format tables using JSON
    theme files.


    To begin the overview, the essential keyword for defining table formatting attributes
    is *tableEx*.


    The table elements that you can format using a theme file (over and above the
    standard visual elements) are


    *   Style


    *   Grid


    *   Column headers


    *   Values


    *   Total


    *   Tooltip


    These elements are shown in boldface in the following code snippet.


    Table [6-11](#511180_1_En_6_Chapter.xhtml#Tab11) outlines the JSON keywords that
    you can use in table visual formatting and the section that corresponds to each
    keyword in the Power BI Desktop format pane.


    Table 6-11


    Table Keywords


    | Keyword | Formatting Popup Option |

    | --- | --- |

    | general | General |

    | stylePreset | Style |

    | grid | Grid |

    | columnHeaders | Column headers |

    | values | Values |

    | total | Total |

    | visualTooltip | Tooltip |

    | title | Title |

    | lockAspect | Lock aspect |

    | border | Border |

    | dropShadow | Shadow |

    | visualHeader | Visual header |


    A complete theme file (which also contains the formatting for standard aspects
    such as background, title, lock aspect, border, shadow, and the visual header)
    is available in the sample data files as Attributes_Table.json.


    As you can see in the following, this is a somewhat longer piece of JSON. After
    all, it has to define a larger set of stylistic options. However, it follows the
    standards that you have seen so far in smaller JSON snippets and consequently
    should be comprehensible. The trick, I find, is to consider it section by section,
    rather than trying to take it all in at once.


    The following code snippet provides the JSON code used to pre-format a table:


    ```

    "tableEx":

    {"*":

    {

    "general": [{... code not shown ...}]

    "stylePreset":  [{"name": "ContrastAlternatingRows"}],

    "grid":    [{

    "gridVertical": false,

    "gridVerticalColor": {"solid": {"color": "#F5F4F0"}},

    "gridVerticalWeight": 1,

    "gridHorizontal": false,

    "gridHorizontalColor": {"solid": {"color": "#F5F4F0"}},

    "gridHorizontalWeight": 1,

    "rowPadding": 1,

    "outlineColor": {"solid": {"color": "#ffffff"}},

    "outlineWeight": 1,

    "textSize": 10,

    "imageHeight": 60

    }],

    "columnHeaders": [{

    "fontColor": {"solid": {"color": "#ffffff"}},

    "backColor": {"solid": {"color": "#118Dff"}},

    "outline": "TopBottom",

    "autoSizeColumnWidth": true,

    "fontFace": "Arial",

    "fontSize": 8,

    "alignment": "Left",

    "wordWrap": true

    }],

    "values": [{

    "fontColorPrimary": {"solid": {"color": "#949494"}},

    "backColorPrimary": {"solid": {"color": "#E8E8E8"}},

    "fontColorSecondary": {"solid": {"color": "#808080"}},

    "backColorSecondary": {"solid": {"color": "#D5D5D5"}},

    "outline": "Frame",

    "urlIcon": true,

    "wordWrap": true,

    "fontFamily": "Arial",

    "fontSize": 8

    }],

    "total":    [{

    "totals": true,

    "label": "TOTAL",

    "fontColor": {"solid": {"color": "#000000"}},

    "backColor": {"solid": {"color": "#118DFF"}},

    "outline": "Frame",

    "fontFamily": "Arial",

    "fontSize": 10

    }],

    "title": [{... code not shown ...}],

    "background": [{... code not shown ...}],

    "lockAspect": [{... code not shown ...}],

    "border": [{... code not shown ...}],

    "dropShadow": [{... code not shown ...}],

    "visualTooltip": [{... code not shown ...}],

    "visualHeader": [{... code not shown ...}]

    }

    }

    ```


    The *grid* keyword that describes the grid section uses the keywords shown in
    Table [6-12](#511180_1_En_6_Chapter.xhtml#Tab12).


    Table 6-12


    Keyword Mapping for the Grid


    | Element | Keyword |

    | --- | --- |

    | Vertical grid | gridVertical |

    | Vertical grid color | gridVerticalColor |

    | Vertical grid thickness | gridVerticalWeight |

    | Horizontal grid | gridHorizontal |

    | Horizontal grid color | gridHorizontalColor |

    | Horizontal grid thickness | gridHorizontalWeight |

    | Row padding | rowPadding |

    | Outline color | outlineColor |

    | Outline weight | outlineWeight |

    | Text size | textSize |

    | Image height | imageHeight |


    The *columnHeaders* keyword that describes the column headers section uses the
    keywords shown in Table [6-13](#511180_1_En_6_Chapter.xhtml#Tab13).


    Table 6-13


    Keyword Mapping for Column Headers


    | Element | Keyword |

    | --- | --- |

    | Font color | fontColor |

    | Background color | backColor |

    | Outline | outline |

    | Auto-size column width | autoSizeColumnWidth |

    | Font family | fontFace |

    | Text size | fontSize |

    | Alignment | alignment |

    | Word wrap | wordWrap |


    The *values* keyword that describes the values section uses the keywords shown
    in Table [6-14](#511180_1_En_6_Chapter.xhtml#Tab14).


    Table 6-14


    Keyword Mapping for Values


    | Element | Keyword |

    | --- | --- |

    | Font color | fontColorPrimary |

    | Background color | backColorPrimary |

    | Alternate font color | fontColorSecondary |

    | Alternate background color | backColorSecondary |

    | Outline | outline |

    | URL icon | urlIcon |

    | Word wrap | wordWrap |

    | Font family | fontFamily |

    | Text size | fontSize |


    The *total* keyword that describes the total section uses the keywords shown in
    Table [6-15](#511180_1_En_6_Chapter.xhtml#Tab15).


    Table 6-15


    Keyword Mapping for Totals


    | Element | Keyword |

    | --- | --- |

    | Totals | totals |

    | Label | label |

    | Font color | fontColor |

    | Background color | backColor |

    | Outline | outline |

    | Font family | fontFamily |

    | Text size | fontSize |


    The *stylePreset* keyword in the JSON that is used in the overall table presentation
    style needs one of the attributes shown in Table [6-16](#511180_1_En_6_Chapter.xhtml#Tab16).


    Table 6-16


    Table Style Options


    | Value | Formatting Popup Option |

    | --- | --- |

    | Default | Default |

    | None | None |

    | Minimal | Minimal |

    | BoldHeader | Bold header |

    | AlternatingRows | Alternating rows |

    | ContrastAlternatingRows | Contrast alternating rows |

    | FlashyRows | Flashy rows |

    | BoldHeaderFlashyRows | Bold header flashy rows |

    | Sparse | Sparse |

    | Condensed | Condensed |


    Tooltip options are described in Table [6-5](#511180_1_En_6_Chapter.xhtml#Tab5).


    The *outline* keyword that describes both the columnHeaders and values sections
    uses the keywords shown in Table [6-10](#511180_1_En_6_Chapter.xhtml#Tab10) in
    the previous section.


    The following elements are *not* apparently configurable using JSON themes:


    *   Field formatting


    *   Conditional formatting'
  trans: "\n# 表格\n\n作为 Power BI 仪表板中最常用的视觉对象之一，你无疑需要了解如何使用 JSON 主题文件来格式化表格的细节（以及复杂性）。\n\
    \n首先，定义表格格式属性的关键关键字是 `tableEx`。\n\n你可以使用主题文件进行格式化（超出标准视觉元素范围）的表格元素有：\n\n- 样式\n\
    - 网格\n- 列标题\n- 值\n- 总计\n- 工具提示\n\n这些元素在以下代码片段中以粗体显示。\n\n表 6-11 概述了可用于表格视觉对象格式化的\
    \ JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的部分。\n\n**表 6-11**  \n**表格关键字**\n\n\
    | 关键字 | 格式弹出选项 |\n| --- | --- |\n| `general` | 常规 |\n| `stylePreset` | 样式 |\n\
    | `grid` | 网格 |\n| `columnHeaders` | 列标题 |\n| `values` | 值 |\n| `total` | 总计 |\n\
    | `visualTooltip` | 工具提示 |\n| `title` | 标题 |\n| `lockAspect` | 锁定纵横比 |\n| `border`\
    \ | 边框 |\n| `dropShadow` | 阴影 |\n| `visualHeader` | 视觉对象标头 |\n\n一个完整的主题文件（其中还包含标准方面的格式化设置，例如背景、标题、锁定纵横比、边框、阴影和视觉对象标头）可在示例数据文件中找到，文件名为\
    \ `Attributes_Table.json`。\n\n如下所示，这是一段较长的 JSON 代码。毕竟，它必须定义更多的样式选项。但是，它遵循了你迄今在较小\
    \ JSON 片段中看到的标准，因此应该是可以理解的。我发现，诀窍在于逐节考虑，而不是试图一次性全部理解。\n\n以下代码片段提供了用于预格式化表格的 JSON\
    \ 代码：\n\n```\n\"tableEx\":\n{\"*\":\n{\n\"general\": [{... code not shown ...}]\n\
    \"stylePreset\":  [{\"name\": \"ContrastAlternatingRows\"}],\n\"grid\":    [{\n\
    \"gridVertical\": false,\n\"gridVerticalColor\": {\"solid\": {\"color\": \"#F5F4F0\"\
    }},\n\"gridVerticalWeight\": 1,\n\"gridHorizontal\": false,\n\"gridHorizontalColor\"\
    : {\"solid\": {\"color\": \"#F5F4F0\"}},\n\"gridHorizontalWeight\": 1,\n\"rowPadding\"\
    : 1,\n\"outlineColor\": {\"solid\": {\"color\": \"#ffffff\"}},\n\"outlineWeight\"\
    : 1,\n\"textSize\": 10,\n\"imageHeight\": 60\n}],\n\"columnHeaders\": [{\n\"fontColor\"\
    : {\"solid\": {\"color\": \"#ffffff\"}},\n\"backColor\": {\"solid\": {\"color\"\
    : \"#118Dff\"}},\n\"outline\": \"TopBottom\",\n\"autoSizeColumnWidth\": true,\n\
    \"fontFace\": \"Arial\",\n\"fontSize\": 8,\n\"alignment\": \"Left\",\n\"wordWrap\"\
    : true\n}],\n\"values\": [{\n\"fontColorPrimary\": {\"solid\": {\"color\": \"\
    #949494\"}},\n\"backColorPrimary\": {\"solid\": {\"color\": \"#E8E8E8\"}},\n\"\
    fontColorSecondary\": {\"solid\": {\"color\": \"#808080\"}},\n\"backColorSecondary\"\
    : {\"solid\": {\"color\": \"#D5D5D5\"}},\n\"outline\": \"Frame\",\n\"urlIcon\"\
    : true,\n\"wordWrap\": true,\n\"fontFamily\": \"Arial\",\n\"fontSize\": 8\n}],\n\
    \"total\":    [{\n\"totals\": true,\n\"label\": \"TOTAL\",\n\"fontColor\": {\"\
    solid\": {\"color\": \"#000000\"}},\n\"backColor\": {\"solid\": {\"color\": \"\
    #118DFF\"}},\n\"outline\": \"Frame\",\n\"fontFamily\": \"Arial\",\n\"fontSize\"\
    : 10\n}],\n\"title\": [{... code not shown ...}],\n\"background\": [{... code\
    \ not shown ...}],\n\"lockAspect\": [{... code not shown ...}],\n\"border\": [{...\
    \ code not shown ...}],\n\"dropShadow\": [{... code not shown ...}],\n\"visualTooltip\"\
    : [{... code not shown ...}],\n\"visualHeader\": [{... code not shown ...}]\n\
    }\n}\n```\n\n描述网格部分的 `grid` 关键字使用表 6-12 中所示的关键字。\n\n**表 6-12**  \n**网格的关键字映射**\n\
    \n| 元素 | 关键字 |\n| --- | --- |\n| 垂直网格 | `gridVertical` |\n| 垂直网格颜色 | `gridVerticalColor`\
    \ |\n| 垂直网格粗细 | `gridVerticalWeight` |\n| 水平网格 | `gridHorizontal` |\n| 水平网格颜色\
    \ | `gridHorizontalColor` |\n| 水平网格粗细 | `gridHorizontalWeight` |\n| 行内边距 | `rowPadding`\
    \ |\n| 轮廓颜色 | `outlineColor` |\n| 轮廓粗细 | `outlineWeight` |\n| 文本大小 | `textSize`\
    \ |\n| 图像高度 | `imageHeight` |\n\n描述列标题部分的 `columnHeaders` 关键字使用表 6-13 中所示的关键字。\n\
    \n**表 6-13**  \n**列标题的关键字映射**\n\n| 元素 | 关键字 |\n| --- | --- |\n| 字体颜色 | `fontColor`\
    \ |\n| 背景颜色 | `backColor` |\n| 轮廓 | `outline` |\n| 自动调整列宽 | `autoSizeColumnWidth`\
