    \ the Tooltip card of the Format Pane for a visual\n\n*   *visualHeader*: Sets\
    \ all the attributes in the Visual header card of the Format Pane for a visual\n\
    \n*   *lockAspect*: Sets all the attributes in the Lock aspect card of the Format\
    \ Pane for a visual\n\nSo the time has come to define these common elements using\
    \ JSON in a theme. As is the case with most of the approaches to formatting Power\
    \ BI dashboards in this book, it is best to take a look at the JSON code first\
    \ and explain how it works once you have seen the code. So here is a code snippet\
    \ (with new elements in boldface) that adds some core visual default formatting\
    \ to elements that are common to most visuals.\n\nThis code snippet hides some\
    \ of the JSON that you have seen previously to save space on the page. The complete\
    \ code is in the file ColorAndTextClassesWithCoreVisualDefaults.json.\n\nIn this\
    \ code snippet, you can see that the keywords in italics correspond to sections\
    \ in the Power BI formatting pane:\n\n*   The *title* keyword corresponds to the\
    \ Title section.\n\n*   The *lockAspect* keyword corresponds to the Lock aspect\
    \ section.\n\n*   The *border* keyword corresponds to the Border section.\n\n\
    *   The *dropShadow* keyword corresponds to the Shadow section.\n\n*   The *visualHeader*\
    \ keyword corresponds to the Visual header section.\n\n```\n{\n\"name\": \"Common\
    \ elements\",\n\"dataColors\": [\"#12239E\", \"#118DFF\", \"#00FF29\", \"#6B007B\"\
    , \"#FFB000\", \"#F5F4F0\", \"#FFFF00\", \"#FF001E\"],\n--- Code not shown for\
    \ color and text classes ---\n\"visualStyles\":\n{\"*\":\n{\"*\":\n{\n\"title\"\
    : [{\n\"show\": true,\n\"text\": \"Visual Title\",\n\"fontColor\": {\"solid\"\
    : {\"color\": \"#ffffff\"}},\n\"background\": {\"solid\": {\"color\": \"#12239E\"\
    }},\n\"alignment\": \"Center\",\n\"fontSize\": 8,\n\"fontFamily\": \"Arial\"\n\
    }],\n\"lockAspect\": [{\n\"show\": false\n}],\n\"border\":   [{\n\"show\": true,\n\
    \"color\": {\"solid\": {\"color\": \"#F5F4F0\"}}\n}],\n\"dropShadow\":   [{\n\"\
    show\": true,\n\"color\": {\"solid\": {\"color\": \"#E8E8E8\"}},\n\"position\"\
    :\"Outer\",\n\"preset\":\"TopLeft\"\n}],\n\"visualHeader\": [{\n\"show\": true,\n\
    \"background\": {\"solid\": {\"color\": \"#ffffff\"}},\n\"border\": {\"solid\"\
    : {\"color\": \"#F5F4F0\"}},\n\"transparency\": 10,\n\"foreground\": {\"solid\"\
    : {\"color\": \"#000000\"}},\n\"showVisualInformationButton\": false,\n\"showVisualWarningButton\"\
    : false,\n\"showVisualErrorButton\": false,\n\"showDrillRoleSelector\": true,\n\
    \"showDrillToggleButton\": false,\n\"showDrillUpButton\": false,\n\"showDrillDownLevelButton\"\
    : false,\n\"showDrillDownExpandButton\": false,\n\"showPinButton\": false,\n\"\
    showFocusModeButton\": false,\n\"showFilterRestatementButton\": false,\n\"showSeeDataLayoutToggleButton\"\
    : false,\n\"showOptionsMenu\": false,\n\"showTooltipButton\": true\n}]\n}\n}\n\
    }\n}\n```\n\nNow for some explanations concerning this particular piece of JSON\n\
    \n*   Each JSON attribute corresponds to an element in a specific section of the\
    \ format pane in Power BI Desktop.\n\n*   The core method of defining key/value\
    \ pairs is still respected. However, as you can see, each of these value settings\
    \ is defined as an *array* that contains one or more objects. That is, each definition\
    \ starts with a square bracket and a curly bracket and ends with a curly bracket\
    \ followed by a square bracket.\n\n*   Some objects contain further nested objects\
    \ – that is, inner sets of elements in curly brackets, sometimes up to three objects\
    \ deep.\n\n*   There is something else that is new in this JSON code. You are\
    \ referring to selections made using popup menus in Power BI Desktop to format\
    \ elements such as\n    *   Title alignment\n\n*   Shadow position\n\n*   Shadow\
    \ preset\n\n*   You need to be warned that the *exact spelling of each JSON keyword\
    \ is required* – and this must always be enclosed in double quotes. Of course,\
    \ if you don’t want to guess the definition, then you can look them up in the\
    \ chapter that describes the visual that you want to format.\n\n*   The good news\
    \ about these definitions is that they do not cause the JSON file load to fail\
    \ if you misspell one of them. All that will happen is that the actual attribute\
    \ will not be formatted and will remain as the default format once the JSON theme\
    \ file has been loaded.\n\n*   You can see that whereas Power BI Desktop has a\
    \ button to switch elements on or off (such as titles or shadows), the corresponding\
    \ JSON translates as\n\n```\n\"show\": true\n```\n\nor\n\n![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig1_HTML.jpg](images/511180_1_En_4_Chapter/511180_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nAnonymous elements\n\n*   You need to be aware that JSON displays\
    \ Boolean values (i.e., true or false):\n    *   Without quotes\n\n*   In lowercase\n\
    \n*   It is important to respect the capitalization for the words true and false\
