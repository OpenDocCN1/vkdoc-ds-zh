    ## 本章小结


    在本章中，你学习了如何准备 JSON 主题，以对六种核心图表类型应用标准格式：堆叠条形图、堆叠柱形图、簇状条形图、簇状柱形图、折线图和面积图。


    你已看到它们共享许多共同特征，这导致了格式定义的 JSON 代码库在很大程度上得以共享。


    下一步是深入学习六种更复杂一些的图表格式规范——但它们都建立在你本章所学的 JSON 定义之上。


    # 8. 复杂图表视觉样式


    你将在本章学习的六种图表类型仅比上一章中的图表稍微复杂一些。然而，它们通常（大多数情况下）比之前看到的图表更详细。幸运的是，任何增加的复杂性都通过以下事实得到了补偿：你在这里看到的
    JSON 总是基于并衍生自你在前一章中发现的 JSON。


    可以使用 JSON 主题预设格式，本章中你将学习的图表类型有：


    * 100% 堆叠条形图

    * 100% 堆叠柱形图

    * 堆叠面积图

    * 折线和堆叠柱形图

    * 折线和簇状柱形图

    * 散点图


    与以往一样，每种图表类型在样本文件夹中都有一个单独的 JSON 文件，其中包含可在你自己的主题文件中使用的代码。

