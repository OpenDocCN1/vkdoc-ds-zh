    # 散点图


    指定散点图格式属性的关键字是 `scatterChart`。


    表 8-8 概述了可在散点图格式中使用的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的分区。


    **表 8-8** 散点图关键字


    | 关键字 | 格式分区 |

    | --- | --- |

    | `general` | 常规 |

    | `legend` | 图例 |

    | `categoryAxis` | X 轴 |

    | `valueAxis` | Y 轴 |

    | `bubbles` | 形状 |

    | `categoryLabels` | 类别标签 |

    | `colorBorder` | 颜色边框 |

    | `plotArea` | 绘图区 |

    | `title` | 标题 |

    | `background` | 背景 |

    | `lockAspect` | 锁定纵横比 |

    | `border` | 边框 |

    | `dropShadow` | 阴影 |

    | `visualHeader` | 视觉对象标头 |


    以下 JSON 描述了散点图的格式：


    ```

    "scatterChart":

    {"*":

    {

    "general": [{... code not shown ...}]

    "legend": [{... code not shown ...}],

