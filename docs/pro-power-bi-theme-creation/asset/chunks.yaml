    "scaling": "Fill"

    }],

    "title": [{... 代码未显示 ...}],

    "background": [{... 代码未显示 ...}],

    "lockAspect": [{... 代码未显示 ...}],

    "border": [{... 代码未显示 ...}],

    "dropShadow": [{... 代码未显示 ...}],

    "visualTooltip": [{... 代码未显示 ...}],

    "visualHeader": [{... 代码未显示 ...}]

    }

    }

    ```


    这里有很多 JSON 代码，但它确实符合你在前两章中看到的结构。无论如何，我已经让 JSON 遵循了 Power BI Desktop 格式窗格中的元素顺序，以便于在
    JSON 规范与你 Power BI Desktop 中看到的内容之间建立关联。


    这里有几个要点需要说明：


    - 在此图表中，垂直（Y）轴是分类轴（因此水平（X）轴是数值轴），这在 JSON 中有体现。

