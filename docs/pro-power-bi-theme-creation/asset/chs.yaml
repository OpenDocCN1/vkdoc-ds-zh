  ## 结论


  在本章中，你了解了如何为仪表、Python 可视化对象、R 脚本可视化对象、关键影响因素可视化对象、分解树和 KPI 定义 JSON 格式。


  现在，你可以继续学习最后一系列可视化格式属性——那些用于定义实际仪表板本身以及不用于数据展示的可视化对象的属性。这是下一章的主题，也是详细讲解可视化对象格式化的最后一章。


