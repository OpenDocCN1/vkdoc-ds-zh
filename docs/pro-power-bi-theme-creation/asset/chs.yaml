  现在你已经构建了一个 JSON 主题文件，它可以立即格式化 Power BI 仪表板的大部分内容。值得回顾一下你创建的内容。


  该文件本质上只是 JSON，但它可以细分为三个主要区域：


  *   颜色 (`Colors`)

  *   文本 (`textClasses`)

  *   视觉元素 (`visualStyles`)


  此文件包含**累积性**的元素 —— 即它可以一次性应用于多个不同的格式区域。


  存在一个**样式层级结构**。也就是说，你可以应用一个初始的“顶层”样式（例如，通过定义 `textClasses` 中的 `title` 元素），然后还可以指定图表的标题采用不同的格式。这些细微差别将在最后一章中解释。


  正如我之前提到的，在定义格式时，你**不必定义格式化元素的每一个方面**。换句话说，并非所有“部分”都是必须的，你可以选择使用主题文件格式化视觉对象的哪些部分（或共享此公共元素的视觉对象集合）。


  主题文件中元素的顺序并不重要。因此，你可以将 `visualStyles` 元素放在 `textClasses` 元素之上。然而，真正重要的是：


  *   确保 JSON 语法正确。

  *   检查定义样式元素的关键字是否为 Power BI 所期望的。

  *   任何文本元素（例如字体名称或 Power BI Desktop 弹出窗口中的选择）都包含 Power BI 期望的值。


  此外，你当然可以获取完整的“通用”主题文件（`GenericBaseFormatting.json`）并对其进行调整，以使用你偏好的颜色和其他设置。你还可以扩展它，添加更多高级格式化属性。在接下来的八章中，你将学习详细的
  JSON 格式化的完整范围。




  '
- '# JSON 主题文件编写提示


  JSON 主题文件可能非常密集、看起来晦涩难懂，并且在加载时可能弹出如图 4-3 所示的可怕“主题文件导入错误”对话框。


  ![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig3_HTML.jpg](img/511180_1_En_4_Fig3_HTML.jpg)


  **图 4-3** 主题文件导入错误


  那么，在创建主题文件时，如何最大限度地减少错误呢？


  首要操作之一应该是使用你偏好的搜索引擎，查找“JSON 语法检查器”。有很多在线资源允许你测试 JSON 的结构有效性。这对于检查 JSON 是否“格式良好”特别有用——这意味着没有多余（或缺失）的逗号、花括号或方括号等等。一些允许你编写
  JSON 的工具也内置了语法检查器，或者可以添加它们。


  另一个关键步骤是使用既能智能格式化 JSON，又能让你理解其结构的工具来编写 JSON。我的意思是，能够直观地理解嵌套层级，并看到成对的花括号是如何匹配的，对于在编写主题文件时简化工作是至关重要的。


  不幸的是，除了将主题文件加载（或尝试加载）到 Power BI Desktop 之外，没有任何方法可以测试实际的 JSON 结构和主要关键字是否已正确输入。在这个层面上，反复尝试似乎是测试主题文件是否按预期工作的唯一方法。


  ## 结论


  本章进一步深入探讨了构成 Power BI 主题文件的细节。你了解了如何逐步构建主题中的 JSON，以定义你想要的多（或少）的格式元素。


  虽然 Power BI 的 JSON 主题的真正潜力在于精确定义每种可视化类型的格式规范——直至最细微的具体细节——但并非总是需要将这种能力发挥到极致。


  因此，在本章中，你了解到可以在更高、更通用的层面上创建 JSON 主题，以便格式化一系列仪表板元素，而无需详细描述每个元素。


  既然你已经了解了主题文件的基本运作方式，现在是时候深入探究如何使用 JSON 精确格式化 Power BI 仪表板的方方面面了。正如你所料，这是一个涉及大量细节的大课题。因此，我将这一主题分解为八个独立的章节以方便理解。我们将从格式化
  Power BI 仪表板对象开始。


  '
- '# 对象视觉样式


  从本书的这一点开始，你将深入探索 JSON 主题文件的最深层。这可能会令人不知所措，因此我打算循序渐进地展示 JSON 格式化在很大程度上是一个逐步构建所需知识的过程。此外，由于
  Power BI 主题包含许多重复的代码片段，你将学会从每个可视化特有的代码中，辨别出在许多（如果不是大多数）可视化中反复使用的核心元素。这门艺术不仅在于学会理解
  JSON 如何被用于定义视觉格式，还在于利用已获得的知识和原则作为跳板，去发现可以应用主题的新领域。


  在本章中，你将看到如何编写 JSON 主题代码，以完全、极其细致地定义以下可视化对象：


  - 文本框

  - 图片

  - 形状


  这些可视化对象的优势在于比某些其他可用的可视化对象更简单，这使它们成为介绍更复杂和详细的 JSON 格式化的理想主题。此外，它们不依赖于数据，这使得格式化——以及使用主题文件进行预定义——更加简单。另一个加分点是，它们的许多格式化属性与
  Power BI 中可用的许多可视化对象通用。这意味着你可以通过这些可视化对象学习一些基本的格式化关键字和方法，然后在阅读本书的过程中，将你发现的格式化技巧应用于一系列其他可视化对象。


  本章讨论的三种可视化类型在示例文件夹中各自有一个独立的 JSON 文件，其中包含可用于定义你自己的主题文件的代码。那么，让我们继续这段旅程吧！




  '
- '# 文本框


  要开始深入探索详细的 JSON 格式设置，文本框可视化对象是一个不错的起点。因为这类可视化对象本质上包含了几乎所有可视化对象共有的元素集。这些元素（按其在 Power
  BI Desktop 格式窗格中出现的顺序排列）包括：


  *   常规

  *   标题

  *   背景

  *   锁定纵横比

  *   边框

  *   阴影

  *   视觉对象标头


  你可以在示例文件 `Attributes_Textbox.json` 中找到用于格式化文本框的 JSON 代码。它是一个完整的、独立的主题文件，可以用作 Power
  BI 主题。然而，它只会格式化调色板、仪表板背景和前景色，当然，以及你添加到仪表板中的任何文本框。


  以下代码片段提供了用于预格式化文本框的 JSON 代码：


  ```json

  {

  "name": "文本框属性",

  "dataColors": ["#171796", "#E34B20", "#D1CAB8", "#465437", "#E2EB00", "#615E55",
  "#00AC98", "#73268c"],

  "background": "#FFFFFF",

  "foreground": "#949494",

  "visualStyles":

  {

  "textbox": {

  "*" :

  {

  "general": [{"responsive": true}]

  "title":    [{

  "show": false,

  "text": "形状标题",

  "titleWrap": false,

  "fontColor": {"solid": {"color": "#ffffff"}},

  "background": {"solid": {"color": "#171796"}},

  "alignment": "居中",

  "fontSize": 8,

  "fontFamily": "Arial"

  }],

  "background":   [{

  "color": {"solid": {"color": "#F5F4F0"}},

  "transparency": 0

  }],

  "lockAspect": [{

  "show": false

  }],

  "border": [{

  "show": true,

  "color": {"solid": {"color": "#F5F4F0"}}

  }],

  "dropShadow":   [{

  "show": true,

  "color": {"solid": {"color": "#D7CACA"}},

  "position":"内部",

  "preset":"顶部",

  "shadowSpread": 15,

  "shadowBlur": 20,

  "angle": 50,

  "shadowDistance": 15,

  "transparency": 80

  }],

  "visualHeader":    [{

  "show": true,

  "background": {"solid": {"color": "#ffffff"}},

  "border": {"solid": {"color": "#171796"}},

  "foreground": {"solid": {"color": "#171796"}},

  "showVisualInformationButton": false,

  "showVisualWarningButton": false,

  "showVisualErrorButton": false,

  "showDrillRoleSelector": true,

  "showDrillToggleButton": false,

  "showDrillUpButton": false,

  "showDrillDownLevelButton": false,

  "showDrillDownExpandButton": false,

  "showPinButton": false,

  "showFocusModeButton": false,

  "showFilterRestatementButton": false,

