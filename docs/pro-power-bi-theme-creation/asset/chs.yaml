  ## KPI


  本章中你将要看到的最后一段 JSON 代码是针对 KPI 可视化对象的。它通过主题文件中的 `kpi` 关键字引入。


  表格 11-25 概述了在格式化分解树可视化对象时可以使用的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的部分。


  表 11-25


  KPI 可视化对象关键字


  | 关键字 | 格式部分 |

  | --- | --- |

  | `general` | 常规 |

  | `indicator` | 指标 |

  | `trendline` | 趋势轴 |

