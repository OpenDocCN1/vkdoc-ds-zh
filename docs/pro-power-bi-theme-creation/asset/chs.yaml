- '# 分解树视觉对象


  本章我们将介绍倒数第二个视觉对象——分解树视觉对象。同样，你可以在主题文件中设置的格式化属性本质上专用于此视觉类型。


  指定分解树视觉对象格式化属性的关键字是 `decompositionTreeVisual`。


  表 11-13 列出了格式化分解树视觉对象时可使用的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式化窗格中对应的部分。


  **表 11-13** 分解树视觉对象关键字


