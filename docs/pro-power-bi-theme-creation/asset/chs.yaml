  首先值得注意的是，您可以为 `icon`、`fill` 和 `text` 设置属性，以反映以下四种按钮状态的不同设置：


  - 默认

  - 悬停

  - 按下

  - 禁用


  引入了一个新概念——按钮状态——这会影响主题文件 JSON 中的对象嵌套。实际上，在操作按钮的每个主要元素内部都应用了一层额外的嵌套。


  每种状态都使用 JSON 中定义按钮状态的 `$id` 关键字来定义。对于 JSON 中指定了 `$id` 关键字的两个部分（`text` 和 `icon`），您需要使用表
  12-2 中显示的值之一。这样做的结果是，JSON 中会有*四个*几乎相同的子部分来描述文本和图标的格式设置——每个按钮状态对应一个。


