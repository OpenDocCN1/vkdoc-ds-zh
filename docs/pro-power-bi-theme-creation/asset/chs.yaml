- '# 环形图


  就格式化而言，环形图与饼图几乎完全相同。然而，它有一个额外的功能。这就是你可以在下面给出的 JSON 中看到的 `slices` 关键字定义的 `inner radius`（内半径）。


  指定散点图格式属性的关键字是 `donutChart`。


  表 9-6 概述了可用于环形图格式的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的部分。


  | 关键字 | 格式部分 |

  | --- | --- |

  | `general` | 常规 |

  | `legend` | 图例 |

