- '# 10. 地图


  本章将探讨一种与前几章所介绍内容完全不同的视觉对象类型。在这里，我们将研究如何使用主题文件预格式化地图。你将了解如何准备 JSON 来定义以下视觉对象类型的呈现：


  *   地图

