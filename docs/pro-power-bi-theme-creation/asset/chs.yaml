  ## 切片器


  正如你所料，切片器的格式也可以在主题文件中进行设置。


  指定切片器格式属性的关键字是 `slicer`。


  表 12-9 概述了可在切片器格式设置中使用的 JSON 关键字。


  **表 12-9**

  **切片器关键字**


  | 关键字 | 格式设置部分 |

  | --- | --- |

  | `general` | 常规 |

  | `slicerHeader` | 切片器标头 |

