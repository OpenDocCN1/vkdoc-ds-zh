  "fontSize": 8,

  "fontFace": "Arial",

  "color": "#949494"

  },

  "largeLightLabel": {

  "fontSize": 8,

  "fontFace": "Arial",

  "color": "#949494"

  },

  "smallLightLabel": {

  "fontSize": 8,

  "fontFace": "Arial",

  "color": "#949494"

  }

  }

  }

  ```


  那么，您到底看到的是什么？本质上，这是一组用于一系列可视化对象以定义文本格式的关键字。其中四个已在上一章中解释过，因为它们可以使用 Power BI Desktop
  以交互方式创建。它们是 `label`（标签）、`callout`（标注）、`title`（标题）和 `header`（页眉）——因此我不再重复它们所应用的文本元素。


  然而，其他的则需要一些解释。以下列表定义了每个 JSON 关键字设置哪个仪表板元素：


  * `largeTitle`（大标题）：可视化标题

  * `largeLabel`（大标签）：多行卡片数据标签

  * `smallLabel`（小标签）：参考线标签、切片器日期范围标签、切片器数字输入文本样式、切片器搜索框、关键影响因素影响者文本

  * `semiboldLabel`（半粗体标签）：关键影响因素概要文本

  * `boldLabel`（粗体标签）：矩阵小计、矩阵总计、表格合计

  * `lightLabel`（细体标签）：图例文本、按钮文本、类别轴标签、漏斗图、图表数据标签、漏斗图转化率标签、仪表目标值、散点图类别标签、切片器项目

  * `largeLightLabel`（大号细体标签）：卡片类别标签、仪表标签、多行卡片类别标签

  * `smallLightLabel`（小号细体标签）：数据标签、值轴标签


  为了使 JSON 主题文件中的元素与其在 Power BI 仪表板中的应用之间的关联更易于理解，请查看图 3-4，其中展示了 JSON 主题中定义的一些文本规范是如何应用于
  Power BI 仪表板的。


  ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig4_HTML.png](img/511180_1_En_3_Fig4_HTML.png)


  **图 3-4** 高级文本自定义




  请注意，此图*并非*每个文本类应用范围的完整呈现，但它确实勾勒出了文本类的工作方式。


  JSON 结构也需要一些解释，因为这是你第一次在主题文件中遇到嵌套对象（即，花括号内包含另一组花括号）。


  如你所见，其核心原则依然是键/值对——也就是一个关键字和一个定义。然而，这次的*定义*稍微复杂一些，因为它并非关键字后冒号后面的单个元素，而是一个完整的对象。


  你可以在图 3-5 中看到这种示意。


  ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig5_HTML.jpg](img/511180_1_En_3_Fig5_HTML.jpg)


  **图 3-5**


  嵌套的 JSON 对象


  需要注意的要点是：


  *   这次，每个定义都是一个独立的、嵌套的对象，以*花括号*开始和结束。

  *   每个对象内部都包含一系列键/值对，这些键/值对之间用*逗号分隔*（并且在最后一个键/值对之后没有逗号）。

  *   构成文本定义的键/值对，与更简单的键/值对一样，在“外层”级别与其他键/值对之间用*逗号分隔*。

  *   *数字不应包含在双引号内*。由于 Power BI 始终期望字体以磅（points）为单位定义，因此你只需指定字体大小的数字即可（无需指定“pt”或类似内容）。

  *   你引用的任何*字体*的*拼写必须与 Windows 期望的完全一致*，并且当然必须存在于托管 Power BI 仪表板的系统中。


  ## JSON 数据类型


  任何值（名称/值对中冒号后面的部分）都必须是可识别的 JSON 数据类型。


  JSON 可用的数据类型集是有限的：


  *   数字（Number）

  *   字符串（String）

  *   布尔值（Boolean）

  *   对象（Objects）

  *   数组（Array）

  *   空值（Null）


  *数字*可以是整数、浮点数或小数。它们*不应*包含在引号内。


  *字符串*（或文本或字符）可以是任何文本，并且*必须*包含在双引号内。


  *布尔值*简单地表示 true 或 false，并且必须用小写的 *true* 或 *false* 表示（例如，不能使用 yes/no 或 0/1）。


  JSON 元素可以是一个嵌套对象——它本身包含更多元素，例如键/值对。


  *数组*是一系列元素（字符串、数字、对象，甚至其他数组）。


  当你想定义一个完全空的值时，应将其定义为 *null*（小写，不带引号）。


  ## 结论


  本章带你踏上了创建和修改自定义 JSON 主题文件的旅程。你了解了如何在主题文件中以 JSON 形式添加颜色定义和通用文本属性。


  希望从本章开头简短文件到最终完整主题文件的演进过程，能让你相信构建 JSON 主题文件不必复杂或困难。由于主题文件的结构基于清晰的逻辑，稍加练习你就能转向更高级的格式定义。像本章中看到的那些具有默认视觉样式的简单主题，随后可以通过为各种类型的视觉效果添加标准元素的规范来进行扩展。这将是下一章的主题。


  '
- '# 4. 默认视觉样式


  定义核心 Power BI 仪表板格式化的下一步是配置一组高级呈现元素，这些元素可以覆盖仪表板视觉效果的大部分格式要求。这将确保仪表板的大部分（尽管可能并非全部）基本格式化工作仅通过应用一个
  JSON 主题文件即可完成。这是所谓的 80/20 规则的一个实际应用——80% 的格式化工作可以通用地进行，剩下的部分则手动格式化。


  在实践中，定义少量适用于一系列视觉效果的“默认”样式元素，往往比精确指定大约 30 个单独视觉效果的规范要有效得多。这是可能的，因为 Power BI 已经确保，视觉效果中与其他视觉效果共有的任何方面（例如，边框或背景），无论你正在调整的是*哪个*视觉效果，在
  Power BI Desktop 的格式窗格中都使用*相同*的格式化方法——并且这种共性也扩展到了 JSON 主题文件中。


  实际上，这种方法意味着你可以在主题文件中*仅一次*指定一个格式元素，然后它就会应用于*任何*支持该元素的视觉效果。例如，你可能希望为所有视觉效果定义边框和标题，然后为图表指定少量通用元素（如
  X 轴和 Y 轴定义），以及为表格指定核心元素，例如总计和值的格式。此外，你甚至不需要指定 Power BI 中某个视觉效果可用的全部格式化选项。也就是说，如果你只想定义需要标题（而不定义标题的任何其他特性），则可以将规范限定于这一个属性。


  所有这一切都可以通过手动制作的主题文件实现，在该文件中你定义视觉特性，*而无需指定*格式化必须应用于哪种视觉效果类型。JSON 格式将——即时且自动地——应用于*任何*包含你定义的属性的视觉效果。这种方法有三大优点：


  *   它简化了主题准备，因为你只需定义一次元素（而不是为每种特定视觉效果类型单独定义）。

  *   你可以根据需要，将格式化的定义设置为*详细或高级*，然后在 Power BI Desktop 中调整单个格式选项以增加完整性。

  *   你可以“以防万一”添加默认格式化。这是因为你添加的任何不被某种视觉效果类型*使用*的格式化（例如定义某种图表类型的某些详细元素）都不会阻止其他格式在被*另一种*图表类型支持的地方应用。


  此外，如果你愿意，之后可以在单个视觉效果层面上覆盖或扩展这些通用属性。这些技术将在第 5 章到第 12 章中介绍。


  在本章中，我们将逐步了解如何：


  *   定义大多数视觉效果类型共有的视觉元素

  *   定义大多数图表类型共有的元素

  *   定义表格元素


  创建默认视觉样式意味着理解 Power BI 中每个单独元素的 JSON 格式化。显然，这可能需要全面理解 JSON 主题文件创建的复杂性。因此，本章你将学习的是*原则*，即如何选择
  JSON 格式化代码的核心方面，以便在更抽象的层面上应用它们，从而使 JSON 能够塑造多个视觉效果的外观——*而无需逐个定义它们*。对每个单独视觉效果所有细节的深入了解将在本书后续部分进行。




  '
- "# 常见视觉元素\n\nPower BI 仪表板中的大多数（甚至所有）视觉对象都包含一系列通用元素。这些元素包括：\n- 背景\n- 标题\n- 边框\n-\
  \ 阴影\n- 工具提示\n- 视觉对象标头\n- 锁定纵横比\n\n你可能已经习惯使用 Power BI 格式设置窗格反复设置这些元素——说实话，确实如此。\n\
  \n这些格式元素由以下 JSON 主题关键字定义：\n\n- `background`：设置视觉对象格式窗格“背景”卡片中的所有属性，并为页面设置背景\n- `title`：设置视觉对象格式窗格“标题”卡片中的所有属性\n\
  - `border`：设置视觉对象格式窗格“边框”卡片中的所有属性\n- `shadow`：设置视觉对象格式窗格“阴影”卡片中的所有属性\n- `visualTooltip`：设置视觉对象格式窗格“工具提示”卡片中的所有属性\n\
  - `visualHeader`：设置视觉对象格式窗格“视觉对象标头”卡片中的所有属性\n- `lockAspect`：设置视觉对象格式窗格“锁定纵横比”卡片中的所有属性\n\
  \n因此，现在是时候使用 JSON 在主题中定义这些通用元素了。与本书中大多数格式化 Power BI 仪表板的方法一样，最好的做法是先查看 JSON 代码，然后在看到代码后解释其工作原理。以下是一个代码片段（新元素以**粗体**显示），它为大多数视觉对象通用的元素添加了一些核心视觉对象默认格式。\n\
  \n为了节省页面空间，此代码片段隐藏了之前看到的部分 JSON。完整代码位于文件 `ColorAndTextClassesWithCoreVisualDefaults.json`\
  \ 中。\n\n在此代码片段中，你可以看到斜体关键字对应于 Power BI 格式设置窗格中的各部分：\n\n- `title` 关键字对应“标题”部分。\n\
  - `lockAspect` 关键字对应“锁定纵横比”部分。\n- `border` 关键字对应“边框”部分。\n- `dropShadow` 关键字对应“阴影”部分。\n\
  - `visualHeader` 关键字对应“视觉对象标头”部分。\n\n```json\n{\n  \"name\": \"Common elements\"\
  ,\n  \"dataColors\": [\"#12239E\", \"#118DFF\", \"#00FF29\", \"#6B007B\", \"#FFB000\"\
  , \"#F5F4F0\", \"#FFFF00\", \"#FF001E\"],\n  --- 颜色和文本类代码未显示 ---\n  \"visualStyles\"\
  :\n  {\"*\":\n  {\"*\":\n  {\n    \"title\": [{\n      \"show\": true,\n      \"\
  text\": \"Visual Title\",\n      \"fontColor\": {\"solid\": {\"color\": \"#ffffff\"\
  }},\n      \"background\": {\"solid\": {\"color\": \"#12239E\"}},\n      \"alignment\"\
  : \"Center\",\n      \"fontSize\": 8,\n      \"fontFamily\": \"Arial\"\n    }],\n\
  \    \"lockAspect\": [{\n      \"show\": false\n    }],\n    \"border\":   [{\n\
  \      \"show\": true,\n      \"color\": {\"solid\": {\"color\": \"#F5F4F0\"}}\n\
  \    }],\n    \"dropShadow\":   [{\n      \"show\": true,\n      \"color\": {\"\
  solid\": {\"color\": \"#E8E8E8\"}},\n      \"position\":\"Outer\",\n      \"preset\"\
  :\"TopLeft\"\n    }],\n    \"visualHeader\": [{\n      \"show\": true,\n      \"\
  background\": {\"solid\": {\"color\": \"#ffffff\"}},\n      \"border\": {\"solid\"\
  : {\"color\": \"#F5F4F0\"}},\n      \"transparency\": 10,\n      \"foreground\"\
  : {\"solid\": {\"color\": \"#000000\"}},\n      \"showVisualInformationButton\"\
  : false,\n      \"showVisualWarningButton\": false,\n      \"showVisualErrorButton\"\
  : false,\n      \"showDrillRoleSelector\": true,\n      \"showDrillToggleButton\"\
  : false,\n      \"showDrillUpButton\": false,\n      \"showDrillDownLevelButton\"\
  : false,\n      \"showDrillDownExpandButton\": false,\n      \"showPinButton\":\
  \ false,\n      \"showFocusModeButton\": false,\n      \"showFilterRestatementButton\"\
  : false,\n      \"showSeeDataLayoutToggleButton\": false,\n      \"showOptionsMenu\"\
  : false,\n      \"showTooltipButton\": true\n    }]\n  }\n  }\n  }\n}\n```\n\n现在来对这段特定的\
  \ JSON 做一些解释：\n\n- 每个 JSON 属性对应于 Power BI Desktop 中格式设置窗格特定部分中的一个元素。\n- 定义键/值对的核心方法仍然有效。但是，正如你所见，每个值设置都被定义为一个包含一个或多个对象的*数组*。也就是说，每个定义都以方括号和花括号开头，并以花括号后跟方括号结束。\n\
  - 某些对象包含进一步嵌套的对象——即花括号内的内部元素集，有时嵌套深度达三层。\n- 这段 JSON 代码中还有一些新的内容。你正在引用通过 Power BI\
  \ Desktop 中的弹出菜单所做的选择来格式化元素，例如：\n  - 标题对齐方式\n  - 阴影位置\n  - 阴影预设\n- 你需要知道，*每个 JSON\
  \ 关键字的拼写都必须准确无误*——并且必须始终用双引号括起来。当然，如果你不想猜测定义，可以查阅描述你想要格式化的视觉对象的章节。\n- 关于这些定义的好消息是，拼错某一个并不会导致\
  \ JSON 文件加载失败。唯一可能发生的是，该实际属性将不会被格式化，并且在 JSON 主题文件加载后保持默认格式。\n- 你可以看到，虽然 Power BI\
  \ Desktop 有打开或关闭元素的按钮（例如标题或阴影），但相应的 JSON 会翻译为：\n\n```json\n\"show\": true\n```\n\
  \n或\n\n```json\n\"show\": false\n```\n\n![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig1_HTML.jpg](img/511180_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1 匿名元素\n\n- 你需要注意，JSON 显示布尔值（即 true 或 false）：\n  - 不带引号\n  - 小写\n- 注意 `true`\
  \ 和 `false` 的大小写很重要，因为 JSON 主题是区分大小写的。*也不*要用双引号将它们括起来，因为它们是关键字，而不是值。\n- 最后，实际元素定义（`background`、`title`\
  \ 等）本身嵌套在两个“匿名”元素内——如图 4-1 所示。\n\n在定义通用元素（即不严格归属于特定类型视觉对象的格式设置）时，它们*必须*嵌套在此较低层级。星号表示格式设置是通用的——不绑定到特定对象。诚然，这使得跟踪嵌套层级（以及所有花括号对）稍微复杂一些。但是，随着你更多地使用\
  \ JSON 主题文件，这会变得习以为常。\n\n## JSON 属性定义\n\n如果你更仔细地查看 JSON，你会注意到它其实非常容易理解，因为每个部分的格式化选项的每个键/值对都相当直截了当。JSON\
  \ 所做的是为每个部分单独设置每个属性。此外，JSON 遵循你之前看到的准则：\n\n- 开或关使用 `\"show\": true` 或 `\"show\"\
  : false` 表示。\n- 大小是简单的、不带引号的数字。\n- 弹出菜单中的选择项用引号括起来——并且与任何弹出菜单中的实际选项几乎完全相同。\n- 颜色是双引号中的十六进制值（前面带有井号/哈希符号）。\n\
  \n这意味着，对于已经花时间在仪表板中格式化图表的 Power BI Desktop 用户来说，理解所使用的 JSON 是件容易的事。为了强调一个重要的点，你在这里看到的\
  \ JSON 只是这些关键字中大多数可用的格式化选项的一个子集。在第 5 章到第 9 章中，你将看到每种图表类型当前所有可用图表格式化选项的完整详细信息。\n\n\
  \n\n"
- '# JSON 关键字


  主题文件使用关键字这一事实，必然意味着如果你要设置满足以下条件的格式属性，就需要知道 JSON 主题文件中所需的准确术语：


  -   映射到 Power BI Desktop 格式化窗格中的某个部分

  -   指定一个属性

  -   从 Power BI Desktop 的弹出菜单中进行选择


  在 Power BI Desktop 中猜测可选择元素的 JSON 定义的一般规则是：

  -   将指针悬停在图标（例如对齐图标）上，并使用弹出文本作为定义

  -   使用弹出菜单文本（例如，用于阴影位置），但移除所有空格并保留首字母大写


  然而，为了省去你猜测关键字的麻烦，它们都将在本书后面的章节中描述。


  '
- '# 主题文件中的 JSON 层级结构


  JSON 本身适合层级结构——因此它基于你在图 4-2 中看到的概要方法。


  ![../images/511180_1_En_4_Chapter/511180_1_En_4_Fig2_HTML.jpg](img/511180_1_En_4_Fig2_HTML.jpg)


  *图 4-2 – 主题文件中的 JSON 层级结构*


  > **注意：** 样式名称始终是星号。如果你正在定义通用属性（如本章所示），那么第二个星号会替换你将在后面更具体的主题文件中看到的视觉对象名称。


  '
- '# 大多数图表类型共有的元素


  既然你已经了解了如何定义共享（或通用）元素的格式，我们就可以进入下一层级的“通用”格式设置。这涉及到设置图表视觉对象的*部分*格式参数。


  图表的格式设置有几个方面是多种图表共享的。例如，堆积条形图、堆积柱形图、簇状条形图、簇状柱形图、折线图、面积图、堆积面积图、折线图和簇状柱形图以及折线图和堆积柱形图都包含以下元素：


  -   类别（X）轴

  -   数值（Y）轴

  -   数据标签

  -   绘图区

  -   图例


  事实上，其中某些元素也常见于其他几种图表类型，例如功能区图、瀑布图和散点图（即使这些图表类型仅包含前面列表中的部分格式选项）。甚至还有漏斗图、饼图和环形图等图表，它们至少使用了前面列出的一个格式元素。


  为了省去你为每种图表类型分别定义这些相似或相同的图表格式属性的麻烦，你可以指定*标准格式*，该格式将应用于图表元素*（如果存在的话）*。这意味着，如果你创建了一个不包含这些元素之一的图表（例如没有类别和数值轴但*确实*有图例的环形图），但仍在其主题文件中设置了这些属性，那么任何不相关的格式元素定义将*不会应用于*该图表。更重要的是，你*不必定义*格式窗格展开选项卡中存在的*每个格式选项*。也就是说，如果你愿意，你可以仅从所有可用选项中为图例设置一两个格式选项。换句话说，你可以根据需要预定义任意多的图表格式方面，而不必担心是否实际使用它们。Power
  BI Desktop 不关心 JSON 格式是否被使用——只关心其语法是否准确。这意味着，只要 JSON 语法正确，你可以定义任意多（或少）的通用格式。


  下面是一个 JSON 主题文件的摘录，它对一系列共享的图表元素应用了部分（而非全部）格式。你可以在文件 `ColorAndTextClassesWithCoreVisualDefaultsAndKeyChartTypes.json`
  中找到完整的代码。


  用于定义一组标准图表格式的 JSON 可能如下所示：


  ```json

  {

  "name": "Common chart elements",

  "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
