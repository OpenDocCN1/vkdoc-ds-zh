  在饼图或环形图中（在标签部分中）定义背景的 JSON 中的 `background` 关键字需要表 9-5 中所示的属性之一。


  | 值 | 格式弹出选项 |

  | --- | --- |

  | `on` | 开 |

  | `off` | 关 |


