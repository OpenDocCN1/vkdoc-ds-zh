  \ | 列标题 |\n| `values` | 值 |\n| `total` | 总计 |\n| `visualTooltip` | 工具提示 |\n| `title`\
  \ | 标题 |\n| `lockAspect` | 锁定纵横比 |\n| `border` | 边框 |\n| `dropShadow` | 阴影 |\n|\
  \ `visualHeader` | 视觉对象标头 |\n\n一个完整的主题文件（其中还包含标准方面的格式化设置，例如背景、标题、锁定纵横比、边框、阴影和视觉对象标头）可在示例数据文件中找到，文件名为\
  \ `Attributes_Table.json`。\n\n如下所示，这是一段较长的 JSON 代码。毕竟，它必须定义更多的样式选项。但是，它遵循了你迄今在较小\
