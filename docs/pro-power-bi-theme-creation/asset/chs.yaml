  "outspace": [{ "color": { "solid": { "color": "#FBF8F8" } } }]

  }

  }

  }

  }

  ```


  该文件作为示例文件 `PBIDesktopCustomizedTheme_Prettified.json` 提供。


  我知道很多读者看到这样的代码时会感到眼花缭乱。不过，请相信我（并继续阅读），你很快不仅能理解这样的 JSON，还能自己创建它。在这个阶段，关键要点是，你所设置的各种元素（颜色、文本定义等）都存在于
  JSON 文件中，连同实际的定义。究竟哪个 JSON 对应哪个格式化元素，则是本书剩余部分要讲述的内容。


  你可能很想知道创建自定义主题的所有努力会带来什么结果。那么，图 2-20 展示了一个仪表板页面，其中已应用了主题文件 `PBIDesktopCustomizedTheme.json`（如果你还记得第
  1 章的内容，操作是依次选择**视图 ➤ 主题 ➤ 浏览主题**）。绝对没有应用其他特定的格式——也就是说，所有格式都源自 JSON 文件，并应用于所有已添加的视觉对象，以及底层页面和筛选器窗格。


  ![../images/511180_1_En_2_Chapter/511180_1_En_2_Fig20_HTML.jpg](img/511180_1_En_2_Fig20_HTML.jpg)


  *图 2-20：应用了自定义主题的 Power BI 仪表板*


  当使用 Power BI Desktop 界面创建自己的 JSON 主题时，你需要注意以下几点：


  - Power BI Desktop *仅*为你修改的任何元素创建 JSON。它不会创建一个定义所有可通过**自定义当前主题**对话框设置的元素的主题文件。也就是说，JSON
  输出将不会包含你在各个对话框中*未*修改的任何设置。这使得主题文件更简单、更简洁。

  - 现在，任何主题文件都可以应用于现有或空白的 Power BI Desktop 文件，只需依次选择**视图 ➤ 主题 ➤ 浏览主题**，然后导航到你之前保存的
  JSON 文件即可。

  - 如果某个元素*尚未*使用 Power BI Desktop 中的**格式**窗格进行格式化，主题文件才会应用格式。对于你想要移除之前应用的自定义格式的每个视觉对象中的每个卡片名称，你需要单击**恢复默认设置**。


  '
- '# 结论


  在本章中，你学习了如何完全以交互方式使用 Power BI Desktop 创建和修改 Power BI 的 JSON 主题。事实上，尽管这不是对格式需求的完全精细定义，但这种方法可能就是你为组织或个人需求定义一个完全可用的主题文件所需的一切。


  然而，还有更多的方法可以创建精细调整的主题，这些主题可以涵盖 Power BI 中存在的所有格式化可能性。因此，既然你已经胃口大开，是时候继续学习一些逐步深入的示例了。



  好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。



  '
- '# 3. 高级主题定义


  现在，是时候卷起袖子，准备深入探索 Power BI 主题的引擎了。从现在开始，你将直接在 JSON 中创建和修改主题文件的元素，这些元素将控制 Power BI
  仪表板的外观。


  为了开启你的 Power BI 主题之旅，本章将探讨最高层级的主题定义。这包括创建通用的主题设置，这些设置可以全局应用于多个视觉对象共同的属性，或者实际上，应用于仪表板中几乎每个对象。例如，这可能意味着设置列标题或轴标题的文本属性，而无论具体的视觉对象类型是什么。


  这种方法有三个主要优点：


  -   *首先*，它相对容易。

  -   *其次*，它适用于多个元素——因此你无需在主题文件中重复指定多次（每个视觉对象类型一次）。

  -   *最后*，由于这种方法仅设置仪表板各方面的默认格式，你可以像以前使用格式窗格设置最终展示一样，对单个视觉对象的格式进行微调和完善。


  更重要的是，设置这些高级元素可能就是你为一系列仪表板设置整体展示效果所需要做的全部工作。你需要在深入（且可能耗时）准备 JSON 文件和提供一个能解决 80-90%
  需求的快速方案之间进行权衡。在这种情况下，设置一个高级的、更通用的格式通常是一个完全有效的解决方案。当然，一旦应用了高级样式，你可以随后调整任何需要进一步准备和标准化的视觉对象的
  JSON 格式——正如你将在后续章节中发现的那样。


  这些更高级别的主题定义涵盖设置：


  -   调色板颜色

  -   通用颜色

  -   通用文本属性


  Power BI 将这些主题称为“通用类”。它们非常值得学习，因为它们不仅是介绍 Power BI 主题工作原理的绝佳途径，而且你还可以在日常使用 Power
  BI 的工作中应用它们。


  ## 什么是 JSON？


  不过，让我们先（非常）简短地了解一下一些 JSON 基础知识。毕竟，你可能以前从未接触过这种格式。如果你已经了解 JSON，可以随意跳过本书中关于 JSON 的章节。如果不是这种情况，我建议你花些时间掌握
  JSON 是什么以及它是如何工作的基本概念，因为它对于 Power BI 中的主题定义至关重要。


  在上一章中，我们大量提到了 JSON，但从未解释过它是什么，或者 Power BI 为什么使用它。JSON 是 JavaScript Object Notation
  的缩写。它是一种轻量级的数据交换格式，对于系统间的数据交换非常可靠，同时又易于人类理解（至少在一定程度上）。它可以被广泛地结构化，同时仍然保持足够的灵活性来存储复杂信息。对于
  Power BI 主题而言，这意味着定义了 Power BI 仪表板元素的格式化方式。有趣的是，当用于定义 Power BI 主题文件时，JSON 中的 J 代表
  JavaScript 这一点并不重要，因为在此上下文中，JSON 仅仅是一种定义仪表板展示样式的方式。因此，在 Power BI 的上下文中，真正需要记住的关键词是
  *Object*（对象）和 *Notation*（表示法），因为 JSON *描述了仪表板视觉对象*（对象）*的格式*（表示法）。


  JSON 是一个庞大的主题，因此本书只会介绍创建主题文件所需的 JSON 知识。同时，我打算循序渐进地进行，只在需要时才描述所需的 JSON 知识，而不是一口气全部解释清楚。事实上，我将使用一系列文本框来解释必要的
  JSON 概念——从这第一个开始，如下所示。


  **JSON 基础知识**


  JSON 基于 *名称/值对* 的概念。也就是说，它定义了一个名称以及描述该名称的内容（它的值）。


  JSON 使用 *冒号* 将名称与其关联的值分隔开。


  JSON 基于对象的概念——在最高层级，整个主题本身就是一个对象。


  对象可以包含其他（嵌套的）对象。


  所有 *对象* 都用花括号（如果你喜欢的话，也可以叫大括号）`{}` 括起来。


  JSON 使用 *逗号* 来分隔元素列表。


  JSON 可以包含 *数组*。这些是用方括号 `[]` 括起来的元素列表。


  JSON 规定文本和数字的输入方式不同。


  ## 调色板颜色


  现在，你将创建你的第一个 Power BI 主题文件。它将非常简单。事实上，从包含示例文件的目录中加载示例文件 `PaletteColors.json` 并对其进行修改，比尝试从头开始手动重新创建整个文件要容易得多。实际上，这是我在创建主题文件时建议你尽可能使用的一种技巧——从能用的东西开始，然后调整和/或扩展它以适合你的新需求。


  图 3-1 显示了示例文件 `PaletteColors.json`。


  ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig1_HTML.jpg](img/511180_1_En_3_Fig1_HTML.jpg)


  **图 3-1** 设置调色板的 JSON


  该主题文件包含三个核心的 JSON 结构：


  -   花括号，用于括起整个 *JSON 对象*。

  -   名称/值对（`name`、`dataColors` 和 `background` 是*名称*——每种情况下冒号后面的文本是*值*）。

  -   一个 *数组*（方括号内以逗号分隔的十六进制颜色列表）。这里，整个数组就是该名称/值对的值。


  由于这是你第一次接触主题文件，我更愿意解释它所包含的一切，因为这将帮助你理解 JSON 是如何工作的。


  ### JSON 对象


  整个 JSON “对象”（如此称呼）必须以左花括号开始，并以右花括号结束。理想情况下，在起始的左花括号之前和结束的右花括号之后*不应存在任何文本*——不过，只要你没有添加任何额外的文本，添加额外的空行是没问题的。


  在顶层花括号对内部，可能还有更多嵌套的花括号对，用于定义其他对象。实际上，当你检查更复杂的 JSON 主题文件时，你会看到这样的例子。




  '
- '# 主题文件定义的属性


  此特定主题文件定义了两组格式属性（`dataColor` 和 `background`），并包含一个用于描述该文件的附加元素（`name`）（毕竟，满是代码的文件不一定容易区分）。文件中的每个元素都由一个称为“名称/值对”的结构定义。它由一个用双引号括起来的格式元素名称（或关键字）组成，其后跟一个冒号，冒号后是该关键字所描述的值。所描述的值范围可以从极其简单（数字或单词）到更复杂的
  JSON 结构——正如你在此主题文件中看到的数组那样。


  定义的两组格式属性是：


  * `dataColors`：调色板

  * `background`：页面背景颜色


  首先要注意的是，每个格式元素（或关键字）都用双引号括起来，后跟一个冒号，最后是相应格式信息的定义。这种方法也称为名称/值配对（即使值本身可能相当复杂）。


  其次，关键字中不能有空格。


  第三点要注意的是，在 Power BI Desktop 的格式窗格中看到的格式术语，与主题文件中赋予该元素的关键字之间通常存在对应关系。然而，这种对应关系可能有些近似，并不总是精确的。事实上，有时
  Power BI 的演进已经使得 JSON 中使用的关键字与 Power BI Desktop 中显示的格式元素完全分离。因此，随着本书的深入，我将解释 JSON
  中使用的关键字与 Power BI Desktop 中使用的术语之间的确切对应关系。


  第四点要注意的是，每个关键字/定义对（或者如果你愿意，也可以称作名称/值对）都以逗号结尾，最后一个除外。


  第五个重要点是，任何非纯数字的值都必须用双引号括起来。


  最后一点是，关键字总是以小写字符开头——并且其拼写和大小写要求非常严格。换句话说，你必须精确地按照 Power BI 期望的方式拼写 JSON 关键字——否则
  JSON 属性将不会被应用。这意味着使用正确的关键字是基础。主题文件在很多方面都非常刻板，就关键字而言，它们完全没有通融余地。


  '
- '# JSON 数组


  定义 JSON 文件中 `dataColors` 部分的值有多个。这是因为 Power BI 调色板包含十个元素。前两个是固定不变的（白色和黑色），而其他八个可以由用户定义。


  这八个元素（最多——你可以选择设置更少的元素，其余的保留为默认值）在主题文件中被设置为一个数组。这意味着元素列表是：


  * 用方括号括起来

  * 用逗号分隔——最后一个元素后没有逗号


  元素本身可以是全数字或全文本——这取决于数组包含的信息种类。


  ## JSON 呈现方式


  JSON 代码的显示方式可以有无限多种。你刚才看到的代码也可以像这样显示：


  ```

  {

  "name": "Intro Theme",

  "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B", "#FFB000", "#F5F4F0",
  "#FFFF00", "#FF001E"],

  "background": "#FFFFFF"

  }

  ```


  或者像这样（这只是其中一种方式）：


  ```

  {"name": "Intro Theme", "dataColors": ["#12239E", "#118DFF", "#00FF29", "#6B007B",
  "#FFB000", "#F5F4F0", "#FFFF00", "#FF001E"], "background": "#FFFFFF"}

  ```


  虽然更紧凑的 JSON 代码可能占用页面更少的空间，但我更喜欢通过包含大量的换行、缩进和空白来使代码尽可能易读。这更容易理解主题文件与“格式”窗格中可见的格式元素之间的关联——以及
  JSON 文件所映射到的内容。


  那么，你在这个小主题文件中创建了什么呢？很简单，你定义了基础调色板，每次你想在 Power BI 仪表板中应用颜色时，该调色板都会出现。你可以在图 3-2 中看到这一点，其中主题文件
  `dataColors` 数组中的十六进制颜色定义定义了调色板元素。


  ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig2_HTML.jpg](img/511180_1_En_3_Fig2_HTML.jpg)


  **图 3-2** 映射主题文件中的调色板


  '
- '# JSON 主题文件中的颜色


  `dataColors` 元素属性中的代码——每个都以井号/哈希符号开头——是对应于特定颜色的十六进制值。如果你有网页设计背景，这可能是你的第二天性。如果没有，那么你需要找到一种方法，来精确找出与你希望在
  Power BI 中使用的每种颜色相对应的十六进制值。


  幸运的是，有成百上千的网站提供关于颜色使用的指导和工具。因此，在你最常用的搜索引擎中搜索“十六进制颜色”几分钟，应该就能找到一些有用的资源。


  同样值得注意的是，Power BI Desktop 的颜色弹出窗口会显示你分配给仪表板元素的颜色的十六进制引用。只需将指针悬停在颜色选择器中选中的颜色上，即可查看其十六进制值。


  **注意：** 始终将十六进制颜色值用双引号括起来，并在其前面加上井号/哈希符号（`#`）。




  '
- '# 通用颜色（颜色类）


  在看过一个基础的 JSON 主题文件后，现在该通过添加一些进一步的通用格式化元素来扩展它了。这些元素将添加上一章中使用 `Customize current theme`（自定义当前主题）功能以交互方式添加的情感色和高级颜色，以及另一个无法通过
  Power BI Desktop 界面添加的元素——`tableAccent`（表格强调色）。


  您可以在示例文件目录中找到此文件，名为 `StructuralColors.JSON`。添加到您之前看到的初始文件中的代码以粗体显示。


  ```

  {

  "name": "Structural Colors",

  "dataColors": ["#171796", "#E34B20", "#F4B7A6", "#465437", "#E2EB00", "#615E55",
  "#00AC98", "#73268c"],

  "good": "#1AAB40",

  "neutral": "#D9B300",

  "bad": "#D64554",

  "maximum": "#118DFF",

  "center": "#D9B300",

  "minimum": "#DEEFFF",

  "null": "#FF7F48",

  "background": "#FFFFFF",

  "firstLevelElements": "#949494",

  "secondLevelElements": "#949494",

  "thirdLevelElements": "#D5D5D5",

  "fourthLevelElements": "#B7B7B7",

  "secondaryBackground": "#E8E8E8",

  "tableAccent": "#118DFF"

  }

  ```


  如您所见，此文件扩展了简单文件 `IntroTheme.json` 所遵循的原则。即：


  * 整个文件内容包含在一对花括号内。

  * 每个定义都是一个名称/值对。

  * 除最后一个定义外，所有定义均以逗号结尾。


  所有颜色定义（调色板除外）的名称/值对都很简单：


  * 左侧是颜色属性的名称（关键字）

  * 冒号后的右侧是用于应用所选颜色的十六进制颜色参考


  由于上一章已解释了大部分这些颜色元素，此处不再重复其定义。唯一新增的是：


  * `tableAccent`（表格强调色）：此元素覆盖表格和矩阵网格轮廓颜色。


  值得注意的是，您可以*按任意顺序*输入这些元素（至少对于像这样的简单 JSON 文件而言）。逗号分隔是需要记住并严格应用的关键点。换句话说，除最后一个属性定义外，每个属性定义都必须以逗号结尾。


  有趣的是，您可以看到较长（且更复杂）的关键字采用*驼峰式大小写*——即它们以小写字符开头，但较长关键字中的每个单词首字母大写。


  **注意**


  如果您打算创建一个“前卫的”深色主题（包含黑色或深色背景元素），那么请务必也将其他结构颜色和主要文本类颜色的值设置为浅色——否则许多元素将无法阅读。


  如果您现在将此主题应用于仪表板（您自己的仪表板或来自示例文件的示例仪表板 `SampleDashboard.pbix`），您将看到几行 JSON 代码提供了多少格式。


  为了让这一点更清晰，请查看图 3-3，其中展示了 JSON 主题中定义的*一些*颜色是如何应用于 Power BI Desktop 仪表板的。


  ![../images/511180_1_En_3_Chapter/511180_1_En_3_Fig3_HTML.png](img/511180_1_En_3_Fig3_HTML.png)


  **图 3-3** 高级颜色自定义


  如果您想进行实验，可以修改一些十六进制颜色参考并重新应用主题，以体会使用主题文件时进行一系列更改是多么容易。


  ## 通用文本属性（文本类）


  在上一章中，您使用 Power BI Desktop 创建了一个定义了四种文本格式的主题文件。这些格式（`label`（标签）、`callout`（标注）、`title`（标题）和
  `header`（页眉））被用于一系列可视化对象来定义核心文本格式。无论多么有用，这些只是您可以使用主题文件定义的部分通用文本设置。您还可以手动向主题文件添加另外八种设置，以便为仪表板添加更广泛的标准化文本格式。这可以避免您在
  Power BI 中逐个可视化对象地手动格式化一系列文本属性。


