- "# 表格\n\n作为 Power BI 仪表板中最常用的视觉对象之一，你无疑需要了解如何使用 JSON 主题文件来格式化表格的细节（以及复杂性）。\n\n首先，定义表格格式属性的关键关键字是\
  \ `tableEx`。\n\n你可以使用主题文件进行格式化（超出标准视觉元素范围）的表格元素有：\n\n- 样式\n- 网格\n- 列标题\n- 值\n- 总计\n\
  - 工具提示\n\n这些元素在以下代码片段中以粗体显示。\n\n表 6-11 概述了可用于表格视觉对象格式化的 JSON 关键字，以及每个关键字在 Power\
