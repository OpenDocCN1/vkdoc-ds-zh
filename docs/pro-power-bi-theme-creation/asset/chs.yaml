  ## 向主题文件添加注释


  不幸的是，主题文件中使用的 JSON 并不像大多数编程语言那样支持添加注释。因此，你不能像在某些编程语言中那样，使用 `//` 或 `/* … */` 或 `-
  -` 在 JSON 代码中或代码后引入注释。


  虽然这无疑是一种限制，但有一种变通方法可能会对你有用。那就是创建你自己的关键字，并用它们来引入注释，为文件添加注解。你可以在下面的代码片段中看到一个示例，其中在主题文件的可视化样式格式化部分顶部添加了几条注释：


  ```

  "visualStyles":

  {

  "myNotesForOneSubject" : "Currently you can add notes like this",

  "Notes" : "It apparently has to be here in the structure",

  ```


  另一个技巧是在特定可视化对象的格式设置开头添加注释，如下所示：


  ```

  "textbox":

  {"*" :

  {

  "myTextboxNotes" : "Currently you can add notes like this",

  "title":    [{ ... CODE OMITTED ... }]

  ```


  你需要知道，这种方法是不受官方支持的，虽然目前它有效，但将来可能会失效。此外，我建议你创造一些极不可能被 Power BI 未来版本使用到的关键字。这样，就能最大程度地降低因产品演变而引发故障的风险。


  当你创建多个主题文件时，另一个有用的想法是利用 `name` 字段为主题文件添加标题信息。你可以在下面的代码片段中看到示例：


  ```

  "name": "Generic Base Formatting add lots of comments to explain why this is used,
  when it was created etc"

  ```


  但是，你无法在注释内部添加换行符或回车符。而且，我也建议避免使用单引号或双引号。尽管如此，如果你的主题文件集合开始增多，在主题文件顶部添加注释会特别有用，因为与通过阅读
  JSON 来尝试回忆某个主题的具体细节相比，它能让你更容易地追踪这些文件。


  ## 分析 Power BI Desktop 文件的内容


  随着 Power BI 的发展，新功能将不可避免地增加，这也意味着会有新的格式设置可能性。因此，你可能需要发现新的关键字和/或它们的属性。


  具体操作步骤如下：


  1.  创建一个 Power BI Desktop 文件，其中包含你想要扩展其 JSON 格式设置的可视化对象。


  2.  手动设置新增属性的格式（这意味着它们会出现在 Power BI Desktop 文件中 – 默认格式不会出现）。


  3.  保存 Power BI Desktop 文件。


  4.  将 Power BI Desktop 文件解压到一个文件夹中。


  5.  打开你解压 Power BI Desktop 文件的文件夹。


  6.  打开名为 `Report` 的文件夹。


  7.  使用文本编辑器打开名为 `Layout` 的文件。


  你会看到一段——很大程度上难以理解的——文本，它实际上包含了你在第 2 步中设置了格式的元素对应的 JSON 格式设置。现在的技巧是找到你设置过格式的内容，从而找到
  Power BI 用于主题文件的关键字。需要提醒你的是，这可能需要练习和耐心！


  你可以在图 12-1 中看到报告内容的示例。请注意，`outspacePane` 关键字已被高亮显示，这样你就能看到它的属性在底层 Power BI Desktop
  文件中的呈现方式。


  ![../images/511180_1_En_12_Chapter/511180_1_En_12_Fig1_HTML.jpg](img/511180_1_En_12_Fig1_HTML.jpg)


  图 12-1

  一个 `.PBIX` 文件的部分内容


  ## 结论


  至此，你已概览了可以在 Power BI 中使用 JSON 主题文件进行格式设置的各种对象。在本章中，你学习了如何使用与前几章相同的方法来设置操作按钮、切片器、页面本身和筛选器窗格的格式。


  我现在只剩下最后一个流程要解释——如何在主题文件中创建级联样式。你将在下一章（即最后一章）中学习到这一点。


  '
- '# 13. 级联样式


  在本书中，你已经看到可以在多个层级使用 JSON 样式来定义可视化外观。学习曲线的最后一部分是理解样式如何从高级定义向下级联到逐渐精细的规格。理解这一点将让你在创建主题文件时节省时间，因为你实际上能够一次定义多个呈现属性——而不必为每个可视化对象定义所有细微之处。


  这些“级联样式”通过两种不同的方式实现：


  - 文本定义从通用样式定义向下级联到特定的可视化格式定义。


  - 颜色从调色板设置向下级联，可用于主题文件中任何可以应用颜色的地方。




  '
- '# 样式层级


  首先要记住的是，你可以在四个可能的层级上定义呈现元素。这四个层级分别是：


  - 元素级别

  - 文本类

  - 通用视觉样式

  - 特定视觉样式


  这种方法存在严格的层级关系。也就是说，在元素级别设定的任何规范将一直有效，直到被文本类覆盖。文本类可以通过定义通用视觉样式的设置来进一步细化，而通用视觉样式又可以被重新定义为特定视觉样式的一部分。


  这种级联样式方法之所以可行，是因为样式层级从广泛范围逐步过渡到高度限制性。如果你还记得第 2 章的内容，定义一级元素会涵盖一系列视觉属性。在第 3 章中，你看到文本类更加聚焦——这种趋势一直延续到对某个特定视觉的某一方面的详细定义。


  然而，你需要知道层级关系并不总是完整的。我的意思是，并非所有内容都能在元素级别进行设置（许多视觉格式化的方面并未被元素选项所涵盖）。同样，文本类也不能涵盖格式化的所有方面——并且这两个层级之间存在一些重叠。


  与创建主题文件的所有方面一样，通过一个示例来理解是最好的方式。


  例如，以你可以在表格中格式化的合计为例。这些合计可以在前面提到的四个层级中的三个层级（全部或部分）进行定义。表 13-1 对此进行了说明。


  **表 13-1** 列标题格式化


  | 层级                | 定义              |

  |----------------------|-------------------|

  | 文本类               | Label             |

  | 通用视觉样式         | Total             |

  | 特定视觉样式         | tableEx           |


  `textClasses` 部分允许你指定一个 `label` 元素。这涵盖了（除其他外）表格和矩阵中的合计。如果你在此处指定了字号和颜色，它将设置（除其他外）表格和矩阵中使用的合计的颜色。


  然后，你可以选择在主题文件的通用定义层级设置一些更具体的元素（例如字体颜色和大小）。这是通过使用 `total` 关键字和相关元素完成的。这将在视觉对象中使用此关键字的地方设置合计，这意味着在表格和矩阵视觉对象中，并将覆盖使用文本类设置的任何内容（在此示例中，包括字号和颜色）。但是，它*不会*覆盖使用
  `label` 文本类设置的任何其他元素。


  最后，你可以设置仅适用于表格视觉对象的格式化。你在第 6 章中已经看到过这一点。此处的任何具体设置都将覆盖合计的通用格式化——但*仅在表格中，而非矩阵中*。


  图 13-1 更直观地展示了这一点。


  ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig1_HTML.png](img/511180_1_En_13_Fig1_HTML.png)


  **图 13-1** 样式层级


  你可以在图 13-1 中看到颜色被设置了三次：


  - `FFFF00`（黄色）在文本类层级

  - `F5F4F0`（橙色）在表格和矩阵合计的通用层级

  - `6B007B`（紫色）用于表格合计


  你还会注意到字号也被设置了三次：


  - 9 磅在文本类层级

  - 10 磅在表格和矩阵合计的通用层级

  - 12 磅（黑色）用于表格合计


  表格和矩阵的合计由 `label` 文本类设置。这还设置了表格和矩阵中合计的字体和大小，以及其他元素（完整列表也可在第 2 章中找到）。


  然后，表格和矩阵的合计被*覆盖*——并且它们呈现的其他方面也被定义——作为通用样式定义的一部分（请记住，这是嵌套在星号对象内部，而不是特定的视觉对象内部）。


  最后，表格（而非矩阵）的合计按照你在第 6 章中看到的解释进行定义。这发生在最深、最详细的层级。


  你可能会问，这在实际中意味着什么。那么，让我们来看看通过逐步应用更详细的格式化所产生的效果，你可以在 JSON 主题文件 `CascadingText.json`
  中看到这些效果。


  首先，这是一个仅应用文本类（本例中为 `label`）的 JSON。该类设置了表格和矩阵中合计的格式化，如图 13-2 所示，其中合计为黄色，9 磅。


  ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig2_HTML.jpg](img/511180_1_En_13_Fig2_HTML.jpg)


  **图 13-2** 应用文本类


  在图 13-3 中，通过为 `total` 添加一个通用样式，对该 JSON 进行了扩充。这具有覆盖文本类所设置字体属性的效果。你可以在图 13-4 中看到这一点，其中合计为橙色，10
  磅。


  ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig3_HTML.jpg](img/511180_1_En_13_Fig3_HTML.jpg)


  **图 13-3** 应用通用样式


  然而，值得注意的是，文本类设置的任何其他属性不受通用样式定义的影响。


  最后，我们可以应用之前在图 13-1 中显示的完整 JSON。这覆盖了合计的格式化——但仅适用于*表格*，*而不适用于矩阵*。你可以在图 13-4 中看到这一点，其中合计为紫色，12
  磅，*仅限表格*。


  ![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig4_HTML.jpg](img/511180_1_En_13_Fig4_HTML.jpg)


  **图 13-4** 应用特定样式


  定义一个在多个层级混合格式化的结构化主题文件可能需要投入大量的时间和精力。然而，前期的投入无疑会使主题更新更加容易和快捷得多。这是因为你通常可以通过在通用格式化层级进行单一更改，就能重置多个视觉对象的一大堆属性——同时保留某些视觉对象的高度特定格式化。这还可以确保你的仪表板具有高度的呈现一致性。


  如果你决定采用这种创建主题文件的方法，我有一些建议，你可能在实践中会觉得有用：


  - 专注于主题定义的通用层级——甚至可以完全忽略文本类。这种方法允许你以清晰、易于理解和审查的方式定义标准化属性。

  - 除非你特意为某个特定视觉对象在较低层级添加覆盖，否则只在一个层级应用属性。换句话说，避免重复。

  - 只应用你真正需要在全局上定义的元素到通用层级。没有必要设置所有能设置的内容，然后在特定视觉对象层级覆盖大部分。

  - 在定义通用格式化时，通常没有必要为一个元素设置每一个属性。同样，只应用你需要在全局上设置的属性即可。




  '
- '# 整合所有元素


  主题创建本质上是一个实践性问题。因此，通过几个具体的主题文件示例，能帮助你更好地理解“标准”主题文件（其中所有内容都是单独定义的）与级联主题文件之间的区别。


  如果你查看可下载的 JSON 文件，会找到：


  - `FullTheme.json`：此文件包含所有视觉元素的完整格式定义。只有页面和筛选器窗格定义是在通用级别设置的。

  - `CascadingTheme.json`：这是一个示例，展示了如何先定义一系列通用元素，然后再为某些视觉元素定义高度具体的自定义格式。

  - `FullThemeWithClasses.json`：此文件包含所有视觉元素的完整格式定义。只有页面和筛选器窗格定义是在通用级别设置的。此外，文件中还添加了颜色和文本类。


  我在此不会展示所有三个文件的 JSON 内容，因为它们合起来有几千行 JSON 代码。不过，我建议你查看一下，以便理解不同的方法。它们也很可能对你来说是一个很好的基础，可以用来改编你自己的主题文件。


  '
- "# 应用级联调色板颜色\n\n到目前为止，在本书中，每当应用颜色时，你看到的都是“硬编码”的十六进制值。虽然这绝对是设置颜色的最简单方法，但这样做可能会使更改整个主题文件中的颜色变得非常费力。如果你已经创建了一组定义了所有可能对象的完整\
  \ JSON，尤其如此。实际上，这种方法可能会导致你花费数小时进行复制/替换工作来重置颜色。之后，通常还需要花费数小时来测试应用了主题后的数十种视觉类型。\n\n\
  幸运的是，颜色也可以在主题文件中进行级联。这使得在实践中修改颜色设置变得更加容易。\n\n设置级联颜色设置的工作原理如下：\n\n- **首先**，按照常规方式，通过定义八个可变颜色来设置调色板。这意味着你可以从\
  \ 60 种颜色中进行选择（调色板中的十列乘以六行）。你不仅拥有一系列可用的颜色，而且它们还是基于十种核心颜色的变体——这意味着颜色选择通常更加和谐。\n- **其次**，在引用这些颜色时，**不要使用它们的十六进制引用**，而是使用**它们在调色板中的位置**。\n\
  \n第二部分是新的，其工作原理如下。\n\n通常，你可能会像这样使用颜色引用：\n\n```\n{\"solid\": {\"color\": \"#999999\"\
  }}\n```\n\n为了确保颜色引用能够级联，你应该使用如下所示的 JSON：\n\n```\n{\"solid\": {\"color\": {\"expr\"\
  :{\"ThemeDataColor\":{\"ColorId\": 9, \"Percent\": -0.5}}}}}\n```\n\n由于这段 JSON 乍看起来有些难以理解，让我们来看看它的结构。\n\
  \n只有十六进制引用部分发生了变化——它变成了：\n\n```\n{\"expr\":{\"ThemeDataColor\":{\"ColorId\": 9,\
  \ \"Percent\": -0.5}}}\n```\n\n这里使用的三个关键词在表 13-2 中进行了解释。\n\n**表 13-2** 调色板颜色级联引用\n\
  \n| 关键词 | 定义 |\n| --- | --- |\n| `ThemeDataColor` | 指示将使用调色板 |\n| `ColorId` | 定义要使用的调色板列\
  \ |\n| `Percent` | 对所选颜色应用百分比强度 |\n\n嵌套结构如下所示：\n\n```\n{\"solid\":\n{\"color\":\n\
  {\"expr\":\n{\"ThemeDataColor\":\n{\"ColorId\": 5, \"Percent\": -0.25}\n}\n}\n}\n\
  }\n```\n\n需要稍加解释的两个主要内容是：\n\n- `ColorId`\n- `Percent`\n\n`ColorId` 是一个数值，代表调色板中的列。它是从零开始计数的，并且从左到右应用。这意味着所有\
  \ 10 列颜色的编号为 0 到 9。\n\n因此，有趣的是，JSON 关键词 `ThemeDataColor` 0 对应调色板中的第一列（定义为白色），`ThemeDataColor`\
  \ 1 对应调色板中的第二列（定义为黑色），`ThemeDataColor` 2 对应调色板中的第三列（令人困惑的是，调色板弹出窗口将其描述为主题颜色 1），依此类推。这是一个你需要慢慢习惯的事情。\n\
  \n同样，在调色板中，每种调色板颜色的*深浅*定义为（从上到下）：\n\n- 亮 60%\n- 亮 40%\n- 亮 20%\n- 暗 25%\n- 暗 50%\n\
  \n这些由 JSON 关键词 `Percent` 的数值表示。然而（同样有点令人困惑的是），调色板中较浅的色调设置为正数，而较深的色调设置为负数。\n\n此映射关系如图\
  \ 13-5 所示。\n\n![../images/511180_1_En_13_Chapter/511180_1_En_13_Fig5_HTML.jpg](img/511180_1_En_13_Fig5_HTML.jpg)\n\
  \n**图 13-5** 调色板与主题数据颜色的对应关系\n\n要从调色板的某一行中选择颜色，你需要设置一个与所需深浅对应的百分比数值。如你所见，较浅的色调设置为正值，较深的色调设置为负值。\n\
  \n\n好的，这是根据您的要求和提供的示例格式，翻译后的中文文档。\n\n\n作为示例，要应用调色板中倒数第二列的第二行，百分比数值将为`0.6`，如下代码片段所示：\n\
  \n```\n{\"solid\": {\"color\": {\"expr\":{\"ThemeDataColor\":{\"ColorId\": 8, \"\
  Percent\": 0.6}}}}}\n```\n\n要应用第七列（即你能设置的第五列）的底行，百分比数值将为 `-0.5`，如下代码片段所示：\n\n```\n\
  {\"solid\": {\"color\": {\"expr\":{\"ThemeDataColor\":{\"ColorId\": 6, \"Percent\"\
  : -0.5}}}}}\n```\n\n需要强调的是，较浅的色调为正数，较深的色调为负数。\n\n如果你想要应用调色板顶行显示的基本颜色，则只需将百分比数值设为\
  \ `0`，如下所示：\n\n```\n{\"solid\": {\"color\": {\"expr\":{\"ThemeDataColor\":{\"ColorId\"\
  : 6, \"Percent\": 0}}}}}\n```\n\n基于调色板的颜色可以在以下几个可能的关键词之后应用：\n\n- `Color`\n- `Background`\n\
  - `Title font color`\n- `Background font color`\n- `Value font color`\n- 实际上，在 JSON\
  \ 主题文件中设置颜色的任何地方都可以\n\n然而，级联颜色引用 *不能* 应用于简单的颜色定义，例如文本类和基本颜色（`firstLevelElements`\
  \ 等）。\n\n有趣的是，在实际的 JSON 中，你可以定义初始主题颜色的 *任意百分比变体*，而不必局限于调色板使用的百分比。因此，例如，你可以像这样定义主题颜色的变体：\n\
  \n```\n{\"solid\": {\"color\": {\"expr\":{\"ThemeDataColor\":{\"ColorId\": 5, \"\
  Percent\": -0.37}}}}}\n```\n\n这为你基于原始调色板提供了广泛的潜在色调范围。\n\n作为级联颜色的示例，请查看以下 JSON 代码。该代码可以在文件\
  \ `CascadingColors.json` 中找到。\n\n```\n{\n\"name\": \"Cascading Colors\",\n\"dataColors\"\
  : [\"#12239E\", \"#118DFF\", \"#00FF29\", \"#6B007B\", \"#FFB000\", \"#F5F4F0\"\
  , \"#FFFF00\", \"#FF001E\"],\n\"visualStyles\":\n{\"*\":\n{\"*\":\n{\n\"total\"\
  :\n[{\n\"totals\": true,\n\"label\": \"TOTAL\",\n\"fontColor\": {\"solid\": {\"\
  color\": {\"expr\":{\"ThemeDataColor\":{\"ColorId\": 9, \"Percent\": -0.5}}}}},\n\
  \"fontFamily\": \"Arial\",\n\"fontSize\": 10\n}]\n}\n},\n\"tableEx\":\n{\"*\":\n\
  {\n\"total\":\n[{\n\"totals\": true,\n\"label\": \"TOTAL\",\n\"fontColor\": {\"\
  solid\": {\"color\": {\"expr\":{\"ThemeDataColor\":{\"ColorId\": 8, \"Percent\"\
  : 0.6}}}}},\n\"backColor\": {\"solid\": {\"color\": {\"expr\":{\"ThemeDataColor\"\
  :{\"ColorId\": 9, \"Percent\": 0.35}}}}},\n\"outline\": \"Frame\",\n\"fontFamily\"\
  : \"Arial\",\n\"fontSize\": 12\n}]\n}\n}\n}\n}\n```\n\n在这个 JSON 中：\n\n- 通用总计字体颜色的字体颜色设置为比调色板最后一列（最右侧）深\
  \ 50%。这对应于调色板的底行。\n- 表格总计字体颜色的字体颜色设置为比调色板最后一列（最右侧）的初始颜色亮 60%。这对应于调色板的第二行。\n- 表格总计背景颜色的字体颜色设置为比调色板倒数第二列的初始颜色亮\
  \ 35%。这是一个自定义色调，无法在调色板中直接获得。\n\n一旦你在主题文件中以这种方式设置了颜色，更改整个主题的颜色就会变得异常简单。你只需修改八个调色板颜色初始定义中的颜色——主题中的所有颜色都会更新，以反映新的核心颜色选择。\n\
  \n## 结论\n\n在本章中，你学习了如何通过定义级联样式元素和颜色应用来加速仪表板格式化。你学习了如何使用更高级别、更通用的样式定义来定义视觉格式化，然后使用针对特定视觉元素的定制定义来完成（甚至覆盖）这些定义。你还了解了如何使用样式层次结构应用属性定义。\n\
  \n然后，你学习了如何创建级联颜色定义，使你可以将颜色选择关联回调色板。这使你能够避免硬编码颜色选择，并为你的主题文件带来新的灵活性。\n\n至此，你已完成了\
  \ Power BI 主题的探索。希望你享受阅读本书的过程，并且它能在你创建 Power BI 仪表板时帮助你节省时间。\n\n\n\n索引 A, B\n\n\
