  这里有很多 JSON 代码，但它确实符合你在前两章中看到的结构。无论如何，我已经让 JSON 遵循了 Power BI Desktop 格式窗格中的元素顺序，以便于在
  JSON 规范与你 Power BI Desktop 中看到的内容之间建立关联。


  这里有几个要点需要说明：


  - 在此图表中，垂直（Y）轴是分类轴（因此水平（X）轴是数值轴），这在 JSON 中有体现。




  *   使用 JSON 定义中通过`start`和`end`关键字设置的值轴起始值和结束值，可以设置为特定数值，而非`null`值。只需输入所需值（作为数字，不包含逗号分隔符等任何格式）。如果你希望将该值留空，则必须使用`null`关键字，否则
  JSON 主题文件将无法加载。


  *   你不能指定哪种颜色应用于哪个数据点，因为这特定于你创建的每个不同可视化中的数据。


  *   仅当数据已添加到 Power BI Desktop 的“图例”字段中时，你才能在 Power BI Desktop 的格式窗格中看到“图例”卡片。不过，无论图例是否存在，你都可以添加用于格式化图例的
  JSON，因为只有当图例在可视化中使用时，格式化才会被应用。


  *   使用`axisStyle`关键字设置的轴样式仅限于在堆积条形图（和柱状图）中显示标题。


