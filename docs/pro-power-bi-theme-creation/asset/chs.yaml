- '# 引言


  作为 Power BI 用户，您习惯于呈现引人注目的分析仪表板。然而，在一组仪表板中对数十甚至数百个视觉对象进行格式设置和重新格式设置，可能是一项耗时且不必要的重复性任务。当您需要为一系列报表创建统一的外观和风格，或在
  Power BI 中标准化企业级分析套件时，这项工作需要极大的专注力和耐心。


  本书旨在帮助您最大限度地减少在仪表板视觉对象的格式设置和微调上花费的时间和精力。本书展示了如何在前期投入少量时间，就能在交付分析时节省数百小时的工作。这一切都通过定义一个主题文件来实现，该文件可以一劳永逸地指定
  Power BI Desktop 中内置的每个视觉对象的呈现方式。


  应用主题文件可以让您的仪表板立即呈现您设计的外观和风格。不仅如此，您之后对主题所做的任何更改，只需点击几下即可重新应用，从而更新呈现效果以匹配最新定义。这不仅节省了时间，还让您从手动格式设置的繁琐工作中解放出来。这意味着您现在可以专注于交付引人入胜且能够激励用户的强大分析和数据探索之旅。


  赢回这些浪费的时间只需前期少量投入。您需要学习 Power BI Desktop 中的格式窗格如何映射到主题文件中的 JSON 元素。然后，您将了解主题文件是如何结构化的，以定义视觉对象的格式。如果您不熟悉
  JSON，本书还会向您介绍创建强大主题文件所需理解的 JSON 核心元素。


  如果您愿意，可以从头到尾阅读本书，因为它是按照循序渐进的自我教程方式设计的。然而，由于 Power BI Desktop 主题可以在多个复杂度级别上应用（需要逐步提升的技能），本书按章节（或章节组）划分，对应于主题生成的不同级别和方法。如下所示：


  第 1 章概述了主题文件如何加速仪表板制作。


  第 2 章解释了如何直接在 Power BI Desktop 内部创建主题文件。这可以作为主题在实践中工作原理的基础介绍，以及如何无需编写一行 JSON 代码就能开发出可用的
  JSON 文件。


  第 3 章展示了如何使用主题类直接在 JSON 中创建高级主题文件，以简化主题文件的创建。这可以避免主题开发人员深入研究应用视觉格式所需的所有复杂细节，同时快速轻松地生成有效的主题。


  第 4 章描述了通用主题定义所需的技术。这些主题文件可以设置多个视觉对象的通用属性。这种方法可以帮助主题创建者在相对较短的时间内创建出简单而强大的主题文件。


  第 5 章至第 12 章是一个完整的参考手册，解释了 Power BI Desktop 中当前所有可用视觉对象的每一个属性。这些章节详细解释了如何在 JSON
  文件中格式化每个标准视觉对象。每个选项和选择都经过解释，以便您可以精细到最细微的级别来调整仪表板的呈现。


  第 13 章通过引入级联样式定义的概念来扩展您的知识。这允许您指定适用于选定格式级别的格式属性。这种方法可以大大简化主题文件的维护。


  本书附带了数十个主题文件，以帮助您学习 Power BI 中的主题并创建自己的主题文件。其中一些文件涵盖了仪表板格式化的特定方面，一些适用于单个视觉对象，以便您可以深入研究特定对象的复杂性，还有一些是包含数千行
  JSON 代码的完整且详细的报表主题文件。


  本书还附带了一个小的示例数据集，您可以从 [`http://www.apress.com/9781484270677`](http://www.apress.com/9781484270677)
  下载并使用它来创建视觉对象。由于重点在于形式而非分析，我倾向于使用极其简单的数据结构，以便读者可以专注于格式设置而非数据本身。


  不可避免的是，并非所有关于仪表板样式的问题都能得到解答，也并非所有问题都能在一本书中得到解决。我衷心希望我已经回答了您将面临的许多关键的 Power BI 样式表问题，并提供了解决您可能遇到的大多数预格式化挑战的方法。祝您在使用
  Power BI Desktop 格式化见解时好运。我真诚地希望您能像我编写本书时一样，从主题中获得乐趣。


  ——亚当·阿斯平


