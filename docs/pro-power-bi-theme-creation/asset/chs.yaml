- '# 矩阵


  不出所料，定义矩阵格式的 JSON 与表格格式的 JSON 在很大程度上相似——实际上是基于后者构建并进行了扩展。


  与表格 JSON 中相同的元素有：


  - `Style`

  - `Grid`


  其他元素（例如值和列标题）则略有不同。如果你查看这些元素的完整 JSON，可以对比这两个代码片段。小计和总计元素的差异足够大，值得详细研究。


