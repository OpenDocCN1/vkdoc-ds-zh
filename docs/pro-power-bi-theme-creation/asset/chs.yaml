- '# 12. 仪表板样式


  在本章中，你将结束对可以使用主题文件格式化的各种对象的探索。这将涉及查看最后两个可视化对象以及两个严格来说并非可视化对象的元素。这四个元素是：


  - 操作按钮

  - 切片器

  - 页面

  - 筛选器窗格


  包含这些元素完整 JSON 代码的示例文件可以从 Apress 网站下载。


  为了总结本章，我不仅想描述如何注释主题文件，还想描述如何实际发现 Power BI 用于 JSON 映射的关键字。这将使你能够跟上 Power BI 的变化和发展，并随着产品的演进和新的格式化功能的增加来更新你的
  JSON 文件。




