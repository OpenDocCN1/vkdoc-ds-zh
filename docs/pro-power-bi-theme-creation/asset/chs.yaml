- '# 百分比堆积柱形图


  当你继续研究柱形图和条形图的不同变体时，会发现它们在 JSON 格式上的相似性远多于差异性。实际上，百分比堆积柱形图的格式与堆积柱形图的代码几乎完全一致。


  与堆积柱形图 JSON 相比，仅存在以下差异：


  *   用于指定百分比堆积柱形图格式化属性的关键字为 `hundredPercentStackedBarChart`。

  *   缺少 `totals`（总计）部分。

