- '# 结论


  本章向您介绍了六种图表类型：100% 堆叠条形图、100% 堆叠柱形图、堆叠面积图、折线图和堆叠柱形图、折线图和簇状柱形图以及散点图。


  它们都基于您在上一章中看到的图表样式（和 JSON 代码）构建，并扩展了您的知识，使您能够创建可定义所有经典数据驱动图表类型的图表格式的主题文件。


  为了结束图表 JSON 格式的探讨，下一章将探讨可添加到主题文件中的其余 Power BI 图表类型。


  '
- '# 9. 其他图表视觉样式


  要完成主题文件图表格式的完整学习，您需要检查最后一组图表类型的 JSON。这些图表包括：


  -   饼图

  -   环形图

  -   树状图

  -   瀑布图

  -   漏斗图

  -   功能区图


  所有这些图表都比您目前看到的一些图表简单——在某些情况下要简单得多。尽管如此，在本章中您会发现一些新的关键字，这些关键字特定于描述这些图表类型格式的 JSON。


  本章讨论的所有图表类型在可供下载的示例文件夹中都有一个单独的 JSON 文件。每个文件都是独立的，可用于格式化相关的图表类型。




  '
- '# 饼图


  饼图无疑是一种较为简单的图表——因此，它对应着一个同样简洁的 JSON 主题文件。


  指定饼图格式属性的关键字是 `pieChart`。


  表 9-1 概述了可用于饼图格式的 JSON 关键字，以及每个关键字在 Power BI Desktop 格式窗格中对应的部分。


  | 关键字 | 格式部分 |

  | --- | --- |

  | `general` | 常规 |

  | `legend` | 图例 |

  | `labels` | 详细标签 |

  | `title` | 标题 |

  | `background` | 背景 |

  | `lockAspect` | 锁定纵横比 |

  | `border` | 边框 |

  | `dropShadow` | 阴影 |

  | `visualHeader` | 视觉对象标头 |


  你可以在示例文件 `Attributes_PieChart.json` 中找到相应的 JSON 代码。


  以下代码片段提供了用于预格式化饼图的 JSON 代码：


  ```

  "pieChart":

  {"*":

  {

  "general": [{... 代码未显示 ...}]

  "legend": [{... 代码未显示 ...}],

  "labels": [{

  "show": true,

  "labelStyle": "All detail labels",

  "color": {"solid": {"color": "#000000"}},

  "labelDisplayUnits": 1000,

  "labelPrecision": 1,

  "percentageLabelPrecision": 1,

  "fontSize": 8,

  "fontFamily": "Arial",

  "position": "preferInside",

  "overflow": true,

  "background": "off"

  }],

  "title": [{... 代码未显示 ...}],

  "background": [{... 代码未显示 ...}],

  "lockAspect": [{... 代码未显示 ...}],

  "border": [{... 代码未显示 ...}],

  "dropShadow": [{... 代码未显示 ...}],

  "visualTooltip": [{... 代码未显示 ...}],

  "visualHeader": [{... 代码未显示 ...}]

  }

  }

  ```


  图例关键字见表 7-2。


  描述详细标签部分的 `labels` 关键字使用了表 9-2 中所示的关键字。


  | 元素 | 关键字 |

  | --- | --- |

  | 详细标签 | `show` |

  | 标签样式 | `labelStyle` |

  | 颜色 | `color` |

  | 显示单位 | `labelDisplayUnits` |

  | 值小数位数 | `labelPrecision` |

  | % 小数位数 | `percentageLabelPrecision` |

  | 文本大小 | `fontSize` |

  | 字体系列 | `fontFamily` |

  | 标签位置 | `position` |

