  尽管捕获几乎所有关键协议信息并不困难，但用于分析踪迹的软件中并未包含 IO 属性的高级指标。


  ## 软件踪迹采集


  在准确性方面，软件踪迹采集器可能不如硬件设备。特别是对于时间精度要求达到纳秒或更低的应用程序，软件可能无法很好地工作。例如，与 SAS/SATA 协议相关的磁盘特性调试可能适用于总线分析仪，因为它可能涉及磁盘驱动器的
  SoC 时钟问题。然而，对于磁盘驱动器的 IO 性能，其操作通常处于毫秒级别（精度），这通常在普通服务器或工作站中现代处理器和操作系统的能力范围之内。


  有许多可用的 IO 工具[45, 35]：


  - **Linux/Unix**：`Dtrace`[46]、`LTTng`、`BCC`^(³⁹)、`iostat`、`dstat`、`tracefs`^(⁴⁰)、`iotop`、`hdparm`、`ionice`、`Ctrace`^(⁴¹)、`iogrind`、`POSIX
  Test Suite`、`ioprofile`、`SystemTap`、`IOR`、`PCP`和`swtrace`

  - **Windows**：`Xperf`^(⁴²)、`TraceWPP`/`TraceView`/`Tracelog`/`Logman`^(⁴³)、`Vtrace`、`Oracle
  trace collector`、`Bus analyzer module`^(⁴⁴)和`PatchWrx`^(⁴⁵)


  然而，并非所有这些工具都能提供事件细节。事实上，像`iostat`和`iotop`这样的通用监控工具无法提供基于单个 IO 的详细信息。


  这些工具可分为两类：静态工具和动态工具。静态工具将程序的二进制映像视为一个永不修改的黑盒。而动态工具则依赖于二进制级别的修改，以便于从应用程序中收集统计数据。例如，所有
  Windows 工具以及`iotop`/`iostat`/`dstat`/`hdparm`/`ionice`/`iogrind`/`ioprofile`都是静态工具，而`SystemTap`、`Dtrace`和`LTTng`是动态工具。特别是，`Dtrace`和`LTTng`使用一种称为探测（probing）的机制，能够选择性地激活嵌入在软件各抽象层中的检测例程，从而不仅可以从应用程序，还可以从其执行所涉及的各种库和内核例程中获取与性能相关的统计数据。


  ### Blktrace


  `Blktrace`是一个静态工具，自 Linux 内核版本 2.617-rc1 起已嵌入其中。该工具轻量且易于使用。它仅考虑操作系统/文件系统缓存之后的设备访问。当
  IO 进入块 IO 层（请求队列）时，每个 CPU 的中继通道会发出事件，然后`blktrace`从这些通道捕获事件。更多细节可参见附录 B。




  ### Dtrace、SystemTap 与 LTTng


  如前所述，动态追踪工具将追踪代码嵌入正在运行的用户程序或内核中，无需重新编译或重启。由于任何处理器指令都可能被修补，因此它几乎可以访问任何位置所需的任何信息。接下来我将讨论几种动态追踪工具。


  `DTrace` [47] 起源于 Solaris。^(⁴⁶) 其开发始于 1999 年，并成为 Solaris 10 版本的一部分。如今，`DTrace` 已作为
  OpenSolaris 的一部分开源，但由于许可证不兼容，尚未合并到 Linux 内核中。存在一些缺乏适当支持的移植版本。B. Gregg 开发了一个基于 `DTrace`
  的工具包以简化使用。^(⁴⁷) 但其根本限制已得到解决。一些尝试催生了另一个名为 `DProbes` 的 `DTrace` 克隆，但似乎并不成功。


  因此，三大 Linux 厂商——Red Hat、Hitachi 和 IBM——为 Linux 提出了另一个动态追踪系统，名为 `SystemTap`。^(⁴⁸)
  `SystemTap` 是迄今为止最强大的追踪器之一。然而，它必须为每个运行的脚本生成一个原生模块，这会导致巨大的性能开销。`Ktap`^(⁴⁹) 被进一步开发，通过内部使用
  Lua 和 LuaJIT 来减少开销。另一个类似的实现是 `sysdig`，^(⁵⁰) 它无需脚本。


  `LTTng`^(⁵¹) 也是一个广泛使用的 Linux 开源追踪框架。在 2.0 版本之前，它使用静态追踪并需要重新编译内核；目前它利用 Linux 内核中的
  `ftrace` 和 `kprobe` 子系统。它使用户能够理解多个系统组件（如 Linux 内核）之间的交互，无论是使用现有的还是用户定义的检测点、C/C++
  应用程序、Java 应用程序、Python 应用程序，或任何其他使用 `LTTng` 记录器的用户空间应用程序。由于它优化了事件收集，性能可能优于其他追踪器。它还支持多种事件类型，包括
  `USDT`（用户级静态定义追踪）。


  当识别整体系统性能而不仅仅是存储 IO 时，这些工具将发挥重要作用。在第 9 章中，您将以 Ceph 为例，从整体系统视角找出性能瓶颈。


  ## 追踪仓库


  主要用于研究目的，网上有一些真实/合成的追踪数据可供下载。以下是一些示例：


  - SNIA 位于 [`http://iotta.snia.org`](http://iotta.snia.org)。它提供块 IO 追踪（例如，虚拟桌面基础设施和
  Microsoft 生产服务器上的块追踪）、NFS 追踪、系统调用追踪等。

  - Sandia 国家实验室位于 [`www.cs.sandia.gov/Scalable_IO/SNL_Trace_Data/`](http://www.cs.sandia.gov/Scalable_IO/SNL_Trace_Data/)。`S3d`
  I/O 内核追踪数据是在 Redstorm 的 6400 个客户端上运行期间收集的。

  - 洛斯阿拉莫斯国家实验室位于 [`http://institute.lanl.gov/data/`](http://institute.lanl.gov/data/)。一些追踪数据，如
  MPI/HPC，已被分类。

  - Google 位于 [`https://github.com/google/cluster-data`](https://github.com/google/cluster-data)。它提供
  Google 计算单元上的集群工作负载追踪。

  - Facebook 位于 [`https://github.com/SWIMProjectUCB/SWIM/wiki/Workloads-repository`](https://github.com/SWIMProjectUCB/SWIM/wiki/Workloads-repository)。作为加州大学伯克利分校
  AMP 实验室 SWIM 项目的一部分，发布了来自 Facebook Hadoop 追踪的多个 1 小时片段。

  - 达特茅斯大学位于 [`www.cs.dartmouth.edu/dfk/nils/workload.html`](http://www.cs.dartmouth.edu/dfk/nils/workload.html)。它提供来自并行文件系统（例如，Intel
  的 CFS、Thinking Machines SFS）的一些追踪数据。^(⁵²)

  - 哈佛大学位于 [`www.eecs.harvard.edu/sos/traces.html`](http://www.eecs.harvard.edu/sos/traces.html)。它提供一些
  NFS 追踪数据。

  - 马萨诸塞大学阿默斯特分校位于 [`http://traces.cs.umass.edu/index.php/Main/Traces`](http://traces.cs.umass.edu/index.php/Main/Traces)。存档了
  OLTP 和搜索引擎追踪数据。

  - 希伯来大学位于 [`www.cs.huji.ac.il/labs/parallel/workload/index.html`](http://www.cs.huji.ac.il/labs/parallel/workload/index.html)。收集了多个并行工作负载。

  - OpenCloud 位于 [`http://ftp.pdl.cmu.edu/pub/datasets/hla`](http://ftp.pdl.cmu.edu/pub/datasets/hla)。这些追踪数据来自
  CMU 并行数据实验室管理的 Hadoop 集群。它们提供了对用于科学工作负载的集群在 20 个月期间内工作负载的非常详细的洞察，包括时间戳、槽位计数等。


  连同分析工具的源代码，我还在 GitHub 上提供了追踪样本数据。


  本章讨论了用于追踪收集的硬件和软件工具。请注意，前者通常比后者提供更高的精度和更多的信息，尽管它们更昂贵。然而，在许多场景中，精度仅需达到毫秒级别。因此，纯软件工具在工业界和学术界都得到了广泛应用。请注意，存在各种用于不同目的的工具。为了识别整体系统性能，您应使用多种工具或一些集成工具集。


