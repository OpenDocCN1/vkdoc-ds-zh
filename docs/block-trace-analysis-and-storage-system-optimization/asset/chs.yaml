  \ | 53.86006 | 1016 | 1016 | R | 0.112894 | 80876032 | 512 |\n| 53.86014 | 53.87545\
  \ | 1017 | 1017 | R | 0.083455 | 80881664 | 1024 |\n\n对于图 7-5 中显示的频繁写入更新，您可以看到 94.2%的访问块（可能重复）仅被写入一次，5.8%的块至少被访问两次，而`<0.1%`的块被写入三次。这意味着重写率非常低。因此，您需要确定是大型请求还是小型请求被重写最多。被多次写入的块所占百分比不断下降，这意味着热块的比例很小。\n\
  \n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig5_HTML.jpg](img/468166_1_En_7_Fig5_HTML.jpg)\n\
