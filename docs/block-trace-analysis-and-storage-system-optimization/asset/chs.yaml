  \ 1%（1/35=2.9%的重写块）。总写入命令占总命令的 30%，更新命令占 1.5%。请注意，定时写入更新率与频繁写入更新率密切相关；换句话说，`sum(hit*(update\
  \ freq-1))/total blocks = updated blocks/total write blocks`。\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig6_HTML.jpg](img/468166_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** RAID 追踪 1 的定时更新\n\n通过进一步考虑图 7-7 中的写入栈距离，您可以看到命中率很低，没有必要使用内联写入缓存来长时间保存这些写入数据。基于\
