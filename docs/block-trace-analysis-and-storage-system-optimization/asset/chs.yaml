  ## 瓶颈识别


  Ceph 是一个相当复杂的系统，其性能由硬件和软件共同决定 [41]。从硬件角度来看，CPU、内存、磁盘和网络是四个主要组成部分。表 9-8 和 9-9 提供了一些总体观点。从软件方面来看，影响因素更多，例如文件系统、Linux
  操作系统设置、内存分配器等。此外，Ceph 系统配置提供了数百个参数，其中许多参数会影响整体性能。因此，通常很难识别整个系统的性能瓶颈。


  **表 9-9** 磁盘的影响


  | 变量 | 选项 | 备注 |

  | --- | --- | --- |

  | 驱动器类型 | HDD、SSD、NVM 等 | 需考虑价格与性能之间的平衡；通常 SSD 用作缓存和日志；不平衡的结构可能导致性能损失；一个故障驱动器可能影响整个存储池的性能（`ceph
  osd perf`）。 |

  | 驱动器数量 | 每台服务器的驱动器数，每个 OSD 的驱动器数 | 更多驱动器可提高每台服务器的吞吐量，但会降低每个 OSD 的吞吐量；每个盘片/驱动器对应一个
  OSD。 |

  | 驱动器控制器 | SAS/ SATA/ PCIe HBA 等 | 更多/更好的 HBA 可提高吞吐量。硬件 RAID 可能提高 IOPS。每 6-8 个 SAS
  驱动器配备一个 HBA 时性能最佳，但使用 SAS 扩展器让一个 HBA 控制 24 个（或更多）驱动器成本更低。为实现最大吞吐量，可使用更多 HBA 和更少的扩展器；当不需要全驱动器吞吐量时，可应用
  SAS 扩展器以最小化成本。 |

  | RAID 控制器 | 启用/禁用；缓存 | Red Hat、Supermicro 和 Seagate 的最新测试也表明，带有板载回写缓存的优质 RAID 控制器可以加速面向
  IOPS 的写入性能。虽然 Ceph 不使用 RAID（因为它同时支持简单复制和纠删码），但合适的 RAID 控制器缓存仍可通过板载缓存提高写入性能。 |

  | 驱动器缓存 | 启用或禁用写入缓存 | 缓存对小写入性能有重大影响 |


