  上述讨论的所有（近）序列信息为磁盘驱动器的预取策略设计提供了良好的参考。例如，在设计序列检测算法时，间隙是一个重要参数。在设计热数据识别算法时，对于这些近序列流，命中频率的定义可能需要稍作调整。例如，可以将某个区域内发生的
  LBA 命中计为一个热区域，以便执行后读操作。这些观察结果还表明，交错流的数量不大，一个较小的队列可能就足以检测到序列（例如，`N≥16`，与非缓存情况相比，`N=50`
  可以将序列检测率提高约 5%）。




  ### 写入更新


  对于频繁的写入更新，86% 的访问块（可能重复）仅被写入一次。被多次写入的块所占比例逐渐降低，这意味着只有一小部分热块被重写。如果所有重写数据都放置到新位置，写入放大率大约为
  116.3%。


  对于定时写入更新，总写入块占全部访问块（读取和写入）的 80%，而更新块（至少写入两次）仅占 6.8%。总写入命令占总命令的 59%，更新命令占 22.5%。写入命令的平均大小约为
  586 个块，更新命令的重叠块平均大小为 73.3。


  在查看堆叠写入更新之前，请先检查堆叠距离。你会发现，与小尺寸请求相比，大尺寸请求（因为命中大小远小于平均大小）完全命中的概率较低。实际上，部分命中（仅部分块相同）和完全命中（两个请求相同）的平均重叠大小分别为
  139.4 和 55.1 个块。通过使用表 8-4 和 8-7 中的数据，你可以得出结论：对于大尺寸请求，部分命中更可能发生。


  **表 8-7** 逻辑堆叠距离 (LSD) 统计


  | | `LSD≤1000` | `LSD≤2000` | `LSD≤4000` | 总体 |

  | --- | --- | --- | --- | --- |

  | 部分命中, 完全命中 | 2.8%, 14.9% | 3.5%, 17.6% | 4.4%, 19.9% | 7.5%, 27.3% |


  通过参考图 8-12（命中频率与 LBA 和大小关系图），分别考虑完全命中和部分命中，可以进一步验证。这证实了大尺寸请求以部分命中为主，而小尺寸请求以完全命中为主。中等大小（64-1023
  个块）请求的命中次数要少得多。


  ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig12_HTML.png](img/468166_1_En_8_Fig12_HTML.png)


  **图 8-12** 写入更新 LBA 和大小分布


  现在让我们检查堆叠写入更新比率。基于写入 IOPS，距离 4000 大约相当于 10 分钟。在此期间，你可以看到命令的完全写入命中率为 72.9%，部分写入命中率为
  58.7%。根据缓存大小和结构的知识，你可以估算命中率。由于堆叠距离通常长于 DRAM 缓存长度，因此磁盘上的更新无法避免。因此，在介质上设置一个“缓存/缓冲”位置是必要的，因此更大容量的
  SSD 缓存对于性能提升是必要的。


  图 8-13 中的第三个图显示，对于部分/完全命中，超过 65% 的重叠请求大小发生在总时间的前 1% 内，这进一步证实了大容量 SSD 缓存的必要性。由于传统磁盘驱动器没有提供如此大的缓存，通过混合驱动器（SSD+HDD）或在系统更高级别（例如阵列控制器或聚合控制器）实现此缓存可能是有益的。对于
  SMR 驱动器，一种便捷的方法是允许常规区域与叠瓦式区域共存，以支持随机写入访问。^(⁷²) 在 [5, 4] 中，这也被称为随机访问区域 (RAZ)。


  ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig13_HTML.png](img/468166_1_En_8_Fig13_HTML.png)


  **图 8-13** 频繁、定时和堆叠写入更新（从上到下）


  ### 写后读 (ROW)


  `ROW` 比率主要用于检查“一次写入多次读取 (WORM)”是否可能。你会发现总的 `ROW` 比率仅为 35.4% 左右，这意味着写入的数据不太可能被多次读取（即比率远大于
  1）。你可以进一步检查命中是否仅针对小尺寸请求。图 8-14 和 8-15 显示，在大多数情况下，写入的数据不太可能被立即读回，其原因与前面章节解释的类似。


