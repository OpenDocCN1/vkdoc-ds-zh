  \ 1655.8 12.61 4.23 |\n\n\n\n### 读密集型追踪\n\n此追踪中的请求 LBA 分布接近顺序访问，如图 7-1 所示。对于读请求，存在两个区域。一个与当前写入区域相同，另一个则接近之前的写入区域（即回放）。读请求的大小多为\
