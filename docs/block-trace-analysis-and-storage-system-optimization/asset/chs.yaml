  \ IO 模式可以按顺序访问。\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig3_HTML.jpg](img/468166_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n来自 Hadoop 节点的 LBA 分布\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig2_HTML.jpg](img/468166_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n来自 Ceph 节点的 LBA 分布\n\n#### 大小分布\n\n通常，驱动器（无论是 HDD 还是 SSD）更倾向于顺序访问，因此顺序访问的吞吐量远高于随机访问，尤其是对于\
  \ HDD。请求大小也很重要，尤其是在磁盘队列较短时，这一点将在第 4 章的图 4-2 和图 4-3 中清晰说明。\n\n图 2-4 绘制了请求频率和 CDF（累积分布函数）与请求大小的关系。对于写请求的分布，您可以看到在此案例中大小为\
  \ 1024 块的请求占比接近 50%，这通常意味着 IO 模式以大尺寸请求为主。请注意，由于操作系统/文件系统和磁盘驱动器的限制，最大请求大小通常为 1024\
  \ 块，因此即使用户请求 1MB 大小的文件，它也会在内部被分成两个 IO 请求（假设每块 512 字节）。\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig4_HTML.jpg](img/468166_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n来自 Hadoop 节点的大小分布\n\n如果您还需要了解相对于 LBA 范围的大小分布，可以绘制如图 2-5 所示的图表，从中您可以结合大小信息了解更多关于热区间的信息。由于您知道\
  \ HDD 中不同位置（例如内圈、中圈、外圈）的传输速度不同，LBA 可以结合请求大小信息大致指示相对速度。\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig5_HTML.jpg](img/468166_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\nLBA 与大小分布的组合图\n\n### 读/写分布\n\n读和写访问在驱动器上可能具有不同的性能。对于 HDD，差异可能很小。然而，对于消费级\
  \ SSD，差距可能很大。此外，读和写访问可能相互依赖。例如，当一次新的写入刚刚完成时，数据可能仍在缓存中。随后的读取可能直接从缓存访问数据，而不是进行介质操作。因此，分布时间的可视化可以直观地展示这种依赖关系。您可以将数据绘制在单个图中或两个单独的图中，如图\
  \ 2-3 所示。\n\n表 2-4\n\n指标计算所需字段\n\n|   | 到达时间 | 完成时间 | LBA | 请求大小 | 操作模式 |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| LBA 分布 | 是 (或) | 是 (或) | 是 |   |   |\n| 大小分布\
  \ |   |   |   | 是 |   |\n| IOPS | 是 | 是 (或) |   |   |   |\n| 吞吐量 | 是 | 是 (或) | \
  \  | 是 |   |\n| 队列长度/深度 | 是 (或) | 是 (或) |   |   |   |\n| 忙/闲时间 | 是 | 是 |   |   |\
  \   |\n| 读/写分布 | 是 (或) | 是 (或) |   |   | 是 |\n| 到达间隔时间分布 | 是 |   |   |   |   |\n\
  | 完成间隔时间分布 |   | 是 |   |   |   |\n\n### 到达间隔时间与完成间隔时间\n\n到达间隔时间定义为两个顺序到达请求之间的时间间隔：`δt[i]\
  \ = D[i] − D[i−1]`。类似地，完成间隔时间定义为 `δt¯[i] = C¯[i] − C¯[i−1]`，其中 `C¯[i]` 是基于完成时间序列重新排序后的\
  \ `C[i]`。`δt[i]` 是工作负载突发性 [38] 的直接指标，与预期的请求平均完成时间相关。当平均 `δt[i]` 远小于 `δt¯[i]` 时，通常意味着系统处于高负载工作状态，可能超出了存储设备的能力。从某种意义上说，这两个指标与\
  \ IOPS 密切相关。\n\n\n\n### IOPS 与吞吐量\n\nIOPS 通常定义为每单位时间 ∆*t* 秒内的 IO 数量 ∆*n*，例如 `IOPS\
  \ = Δn / Δt`。单位时间由用户预设，通常为 1 秒。类似地，吞吐量是每单位时间内的请求大小 ∆*S*，因此 `TP = Δs / Δt`。请注意，它们在某种意义上是在给定单位时间/时间窗口内的平均值。对于不同的\
  \ ∆*t*，IOPS 和吞吐量可能具有不同的值。通常，较大的 ∆*t* 会得到更平滑的曲线。图 2-6 展示了一个从 Ceph 集群的 HDD 节点收集数据的示例。你可以看到，在\
  \ ∆*t*=1 秒的图中，IOPS 范围从 60 到 160，而当 ∆*t*=6 秒时，范围是 80–120。特别是，当工作负载包含许多突发时，不同 ∆*t*\
  \ 下的最大和最小 IOPS 值可能会有很大差异。\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig6_HTML.png](img/468166_1_En_2_Fig6_HTML.png)\n\
  \n**图 2-6** 不同时间窗口下的平均 IOPS 与吞吐量\n\n这两个指标随时间变化的曲线可用于直观地观察工作负载的突发情况。但是，请谨慎选择 ∆*t*。过大的\
  \ ∆*t* 可能会使曲线平滑，但会消除 IO 突发。一个实用的选择与平均到达间隔时间有关，因此 ∆*t* 可以是平均到达间隔时间的几倍，但不宜过大。\n\n\
  或者，你可以固定 ∆*n*。例如，你可以设置 ∆*n*=20，并让 ∆*t* 变化。\n\n一种更复杂的设置是让 ∆*t* 和 ∆*n* 都变化。例如，将 ∆*n*≤\
  \ 10 且 ∆*t* = 1 秒作为约束条件。如果在 ∆*t* = 1 秒内，∆*n* 在此范围内，则计算平均值。否则，如果 ∆*n >* 10，则选择一个使得\
  \ ∆*n* = 10 的时间窗口，然后计算平均值。\n\n绘制曲线时的另一个琐碎问题是时间点，即平均值发生在 ∆*t* 的开始、中间还是结束。例如，如果你选择\
  \ ∆*t* 的结束点，你可能会得到以下公式：\n\n- `IO(t[j])` = 基于 `D[i]` 计算的范围内的 IO 总数，即 `IO(D[i])`，其中\
  \ `D[i]` 位于区间 `[t[j−1] t[j]]` 内\n- `R(t[j])` = `IO(D[i])` 的请求大小总和\n- `t[j]` 处的平均\
  \ IOPS = `IO(t[j−1])/Δt`\n- `t[j]` 处的平均请求大小 = `R(t[j−1])/IO(t[j−1])`\n- `t[j]` 处的平均吞吐量\
  \ = `R(t[j−1])/Δt`\n\n你也可以在此处应用移动平均技术；两个连续的“平均”指标之间存在重叠。\n\n### 响应时间\n\n响应时间通常由等待（或排队）时间\
  \ `T[w]` 和访问（或服务）时间 `T[a]` 组成，即 `T[res] = T[a] + T[w]`。服务时间是服务过程中花费的时间，例如磁盘访问时间。排队时间是请求在发送到实际执行之前在队列中等待所花费的时间。当从外部总线（IO\
  \ 驱动程序）收集跟踪时，例如 SATA/SAS，`r[i]` 的响应时间通过 `C[i] − D[i]` 计算。\n\n### 队列长度/深度\n\nHDD\
  \ 中至少有两个队列。一个与 IO 驱动程序一起存在，受操作系统和文件系统的影响，因此操作系统和/或文件系统可能会根据某些调度程序更改发送到磁盘驱动器的 IO\
  \ 顺序。其长度通常最多为某个值。仅从外部收集的跟踪只能反映 IO 驱动程序中的队列长度。你可以根据请求的到达时间或完成时间来估计队列深度。它们可能略有差异。让我们按顺序将一个队列的\
  \ D 和 C 表示为 `D[i]` 和 `C[i]`。\n\n- 命令到达前的 IO 驱动程序队列深度 (`Q[d1]`)\n    - `D[i]` 之前的队列深度（瞬时队列深度\
  \ `Q(D[i])`）= 满足 C 时间 `>= D[i]` 且 D 时间 `< D[i]` 的请求数量\n- 命令完成后的 IO 驱动程序队列深度 (`Q[d2]`)\n\
  \    - `C[i]` 之后的队列深度（瞬时队列深度 `Q(C[i])`）= 满足 C 时间 `>= C[i]` 且 D 时间 `< C[i]` 的请求数量\n\
  - 平均队列深度\n    - 非空闲期间估计的平均队列深度：`Σi/2 ∗ (D[i] − C[i]))/Σi`\n    - 时间间隔内的有效平均队列深度：以\
  \ `Δt` 秒为间隔进行采样\n\n图 2-7 展示了 `Q[d1]` 和 `Q[d2]` 的示意图，其中带箭头的蓝色标记按时间顺序显示了 IO 请求。它还展示了这些请求的几个\
  \ `Q[d1]` 和 `Q[d2]` 值。表 2-5 进一步给出了一个示例，说明如何基于 `Q[d1]` 计算队列深度。图 2-8 显示了从 Hadoop 节点估计的队列深度。看起来平均队列深度相当高，这意味着工作负载很高。但是，放大图表以检查队列之间的间隔。在此示例中，x\
  \ 轴的比例是 100 而不是 12000，以显示更多信息。\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig8_HTML.jpg](img/468166_1_En_2_Fig8_HTML.jpg)\n\
  \n**图 2-8** 使用来自 Hadoop 节点的到达和完成时间计算的队列深度\n\n**表 2-5** 估计的队列深度和空闲时间\n\n| 到达时间 |\
  \ 完成时间 | 队列深度 | 空闲时间 |\n| --- | --- | --- | --- |\n| 0.00007 | 0.00036 | 0 | - |\n\
  | 0.01130 | 0.01157 | 0 | 1.09E–02 |\n| 0.01134 | 0.01288 | 1 | 0 |\n| 0.02622 |\
  \ 0.02751 | 0 | 1.33E–02 |\n| 0.02679 | 0.02772 | 1 | 0 |\n| 0.03668 | 0.03950 |\
  \ 0 | 8.96E–03 |\n| 0.03962 | 0.04477 | 0 | 1.17E–04 |\n| 0.03965 | 15.07994 | 1\
  \ | 0 |\n| 0.04454 | 0.04639 | 2 | 0 |\n| 0.04486 | 0.04651 | 2 | 0 |\n| 0.05500\
  \ | 0.05526 | 1 | 0 |\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig7_HTML.jpg](img/468166_1_En_2_Fig7_HTML.jpg)\n\
  \n**图 2-7** 队列长度示意图\n\n另一个是用于机械部件实际执行的 HDD 内部队列。这里应用了一些调度算法，例如 SCAN 和 RPO（旋转定位优化），以尝试最小化给定的操作时间。可以使用供应商特殊命令（VSC）来收集内部队列信息。RPO\
  \ 试图最小化队列中请求的寻道时间和旋转延迟的总和。理论上，更长的队列意味着调度程序有更多事件可供选择，并且可以进一步减少总操作时间（对于纯随机访问）。然而，在实践中，当队列长度达到一定水平时，性能不会增加，如图\
  \ 4-2 和 4-3 所示。如果没有 VSC，我们可能只能使用外部 IO 队列状态来近似内部队列状态。这在某种意义上是合理的，因为 HDD 一次只能处理一个请求。^(³³)\
  \ 然而，对于 SSD，由于并行处理，情况要复杂得多。\n\n\n\n## 忙/闲时间\n\n当磁盘正在进行 IO 操作（包括前台和后台活动）时，磁盘处于忙碌状态；否则，它处于空闲模式。当你打算为磁盘设计一些后台操作（如碎片整理、地址重映射、扇区扫描等）时，这两个指标非常有用。由于其中一些操作需要超过一百毫秒才能完成，因此会估算忙或闲时间，以显示后台操作是否会影响性能。\n\
  \n然而，如果没有 VSC 来提取驱动器内部跟踪日志，你可能无法直接获得忙/闲时间。因此，在内部跟踪不可用时，我们只能从外部跟踪近似估算时间。基本思路是比较队列中请求的完成时间与新请求的到达时间。如果完成时间晚于新到达时间，则意味着驱动器在该到达时刻仍处于忙碌状态。否则，它被计为空闲时间（尽管磁盘驱动器内部可能有一些后台活动；但你可以假设用户/外部请求的优先级高于后台活动）。换句话说，空闲时间的计算与队列深度密切相关，因此只有当队列深度为零时，才可能存在空闲间隔。\n\
  \n让我们考虑表 2-3 中的跟踪数据。第一个请求的完成时间 `0.027506s` 晚于第二个请求的到达时间 `0.026790s`，因此磁盘在 `0.026790s`\
  \ 时处于忙碌状态。然而，第二个请求的完成时间 `0.027719s` 早于第三个请求的到达时间 `0.036680s`，你可以估算出驱动器的空闲时间为 `0.036680\
  \ – 0.027719 = 0.009s`。表 2-5 显示了结果。\n\n图 2-9 与图 2-8 具有相同的数据集。尽管图 2-8 中的队列深度很高，你仍然可以观察到磁盘的许多空闲间隔。\n\
  \n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig9_HTML.jpg](img/468166_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n\n从 Hadoop 节点估算的空闲时间\n\n## 高级指标\n\n来自真实世界的工作负载通常很复杂。即使对于那些声称是顺序工作负载（例如\
  \ Hadoop HDFS 写入或 Ceph Bluestore 写入）的情况，块级别的实际 IO 模式也是顺序与随机、读取与写入的混合。高级指标旨在提供对这些跟踪数据的深入洞察。\n\
  \n### 顺序与随机\n\n在某些工程师看来，工作负载的顺序性和随机性有些主观，因为当工作负载混合时，很难明确说明它是更偏向顺序还是随机。此外，在不同情况下，对“顺序感”的认知也不同。例如，一些请求之间间隙非常小，也可能被视为（接近）顺序。\n\
  \n在我看来，可以在不同场景下对其进行量化，例如调度器算法、队列长度等。这意味着当所有条件固定时，该属性是客观的。例如，考虑一个在较小 LBA 范围内写入请求的突发工作负载。其中一些请求在\
  \ LBA 上是连续的，尽管它们并非按顺序到达。如果应用 FIFO 调度策略，则该工作负载是随机的，因为磁盘必须为每个请求寻道到不同位置。当应用简单的 SCAN\
  \ 或 RPO 调度算法时，如果队列足够长，请求将被重新排序，其中一些将变为顺序。假设有 `N` 个请求。因此最多有 `N−1` 次寻道（严格定义下，如果在 LBA\
  \ 方面存在寻道，则该请求被视为随机请求）。设随机访问次数为 `N[r]`，顺序访问次数为 `N[s]`，那么对于固定场景下的给定工作负载，你可以获得随机与顺序的比率。\n\
  \n#### 顺序流与近顺序流\n\n该指标直接指示工作负载的顺序程度。通常，当一个命令跟在另一个类似命令之后，且该命令请求的块 LBA 恰好位于新命令之前时，该命令是顺序的。因此，顺序读取跟随读取命令，顺序写入跟随写入命令；但该定义存在一些细微差别。*（严格）顺序流*意味着当前命令和先前命令属于同一类型（读/写），并且新命令的起始\
  \ LBA 紧跟在先前命令之后。*近顺序流*意味着必须存在一个较早的相同类型（读或写）命令，其 LBA 范围位于新命令起始位置之前且靠近它。对于顺序流，多个流可能相互交错。存在用户设置来影响这些细微差别，使我们能够描述顺序命令情况的变化。\n\
  \n**排队顺序流：** 在按时间排序的请求流中，有些请求彼此相邻（可能在时间窗口内），使得 `last LBA(r[i]) + 1 = first_LBA(r[j])`，其中\
  \ `i < j`，`D[j] – D[i] < δt`，且 `δt > 0` 是一个老化时间。\n\n这样，由于交错顺序流的存在，`j ≥ i + 1` 是可能的。然而在实践中，需要一个队列长度为\
  \ `N` 的命令队列来识别顺序，而不是仅检查其中恰好相邻的请求。一旦新请求进入队列，它会搜索队列以检查顺序匹配。如果找到匹配项，则将其合并到队列中；否则，它会向队列添加一个新条目。如果队列已满，它会使用替换规则（例如\
  \ FIFO 或 LRU）移除条目。\n\n通常，`N` 越大，在每个流中检测到的顺序请求数量（`M[2]`）就越多，而顺序流的数量（`M[1]`）就越少。关键在于找到一个足够大的\
  \ `N`，使得检测到的顺序流数量保持稳定。\n\n**带约束的排队顺序流：** 在实践中，一个大块请求 `S`（例如 `S ≥ 1024`）也被计为顺序请求。因此，考虑流\
  \ `i` 的另一种方法是确定流 `S[i]` 的总大小以及 `M[2]`，因此如果 `S[i] ≥ S` 且 `M[2] ≥ M`，则 `i` 被视为顺序流，其中\
  \ `S` 和 `M` 是阈值。\n\n**排队近顺序流：** 最后，LBA 请求之间可能存在小间隙，使得在按时间排序的请求流中，某些请求在时间窗口内彼此接近。一旦新请求被认为与先前请求接近顺序，该流的最后一个\
  \ LBA 将更新为新请求的最后一个 LBA（为简单起见，间隙被填充），因此 `last LBA(r[i]) + 1 ≤ first LBA(r[j])` 且\
  \ `last LBA(r[i]) + δd ≥ first LBA(r[j])`，其中 `i < j` 且 `0 < D[j] – D[i] < δt`。`δd\
  \ > 0` 是一个以块为单位的小整数，例如 64。需要一个命令队列来检测交错流，并且大小约束也适用于近顺序流。参见图 2-10。\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig10_HTML.jpg](img/468166_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\n近顺序流示例\n\n\n\n让我们来看表 2-6 中的示例。假设这些请求在一个 *t* 秒的时间窗口内到达。通过比较 FIFO 顺序中前一个请求的最后一个\
  \ LBA 和当前请求的第一个 LBA，可以明显看出所有请求都是随机的。在这种情况下，有七次寻道，且 `N[r] = 8`，`N[s] = 0`。从这个意义上说，工作负载是随机的，因为没有顺序流。然而，如果你借助队列按\
  \ LBA 对请求重新排序，使得请求顺序为 `< 263158(7)4 >`，那么根据（严格）顺序流，你将得到 `N[r] = 3` 和 `N[s] = 4`。请注意，在重新排序过程中，请求编号\
  \ 7 被请求编号 8 吸收了。因此，对于（严格）顺序流，`M[2] = 2`（`< 2631 >` 和 `< 58(7) >`）。在 `S = 1024` 和\
  \ `M[2] = 2` 这两个约束条件下，你得到（`< 58(7) >` 和 `< 4 >`）。流 `< 2631 >` 因大小不足而被移除。\n\n当考虑\
  \ `Δd = 64` 和 `512` 的近顺序流时，在严格顺序流下，你分别得到 `M[2] = 3`（`< 2631 >`、`< 58(7) >` 和 `<\
  \ 4 >`）和 `1`（`< 263158(7)4 >`）。\n\n**表 2-6** LBA 序列与随机性示例\n\n| 顺序 | 第一个 LBA | 最后一个\
  \ LBA | 顺序 | 第一个 LBA | 最后一个 LBA |\n| --- | --- | --- | --- | --- | --- |\n| 1 |\
  \ 128 | 135 | 5 | 256 | 511 |\n| 2 | 0 | 7 | 6 | 8 | 63 |\n| 3 | 64 | 127 | 7 |\
  \ 640 | 647 |\n| 4 | 1536 | 2047 | 8 | 512 | 1279 |\n\n从这个示例中，可以得到以下变量：\n\n*   `N[s1]`：具有顺序访问的请求数量\n\
  *   `N[s2]`：具有近顺序访问和 LBA 间隙的请求数量\n*   `N[r]`：剩余请求的数量\n\n这些变量与下一节中定义的逻辑寻道有很强的关联。\n\
  \n在实际应用中，实际的间隙大小 `Δd` 通常由系统性能容限决定。通常，它最多为几个磁道大小。例如，如果可接受的容限是 5ms，那么基于 10K RPM 磁盘模型（磁道/磁头切换时间为\
  \ 1ms，平均磁道大小为 1.5MB），`Δd` 最多可达 1536 个块。对于随机访问，平均旋转延迟为 3ms。假设新请求有 50% 的概率在同一磁道，50%\
  \ 的概率在下一磁道（实际概率与 `Δd` 相关）。那么你还有 `5 - (3 + 1) * 50% = 3ms` 用于进一步旋转，这大约是半个磁道大小，即 1536\
  \ 个块。^(³⁴)\n\n**顺序比率：** 由于对顺序性的看法不同，顺序比率的定义也有所不同。下面列出几个示例。\n\n*   DEF1：使用 `S` 和\
  \ `M[2]` 阈值检测到的顺序命令总和 / 总命令数\n*   DEF2：（使用 `S` 和 `M[2]` 阈值检测到的顺序命令总和 - 总顺序流数）/ 总命令数\n\
  *   DEF3：使用 `S` 和 `M[2]` 阈值检测到的顺序命令的请求大小总和 / 所有命令的总请求大小\n*   DEF4：（使用 `S` 和 `M[2]`\
  \ 阈值检测到的顺序命令的请求大小总和 - 顺序流中第一个命令的大小总和）/ 所有命令的总请求大小\n\n如果移除大小约束 `S`，你将得到另外四个定义。\n\n\
  #### 空间局部性与逻辑寻道距离\n\n局部性，作为变量在短到中等范围内与自身相关性的特例，可以可视化为一个二维概率曲面 `p(s, d)`，它显示了距离 `s`\
  \ 字节的地址首次被引用恰好发生在 `d` 个周期内的概率。通常有两种类型的局部性：空间局部性和时间局部性。对于空间局部性，如果距离 `s = |x[i] -\
  \ x[j]|` 很小，这意味着在引用地址 `x[i]` 后不久，你将发现对相邻地址 `x[j]` 的引用。时间局部性将在下一小节讨论。\n\n请注意，大多数跟踪中只提供了\
  \ LBA，而不是物理块地址（PBA）。因为不同的 HDD 可能具有不完全相同的数据布局（例如蛇形布局），不同 HDD 之间相同的 LBA 布局可能导致不同的\
  \ PBA。然而，如果它们的数据布局相似，差异通常非常小。因此，分析逻辑距离也是有意义的。\n\n下面我将讨论两种距离，分别指示空间局部性和时间局部性 [35]。\n\
  \n##### 逻辑寻道距离\n\n该指标是空间局部性的一个指示器。它定义了“连续”设备接收的 IO 之间的逻辑块/LBA 距离。\n\n*   非排队下一个：最简单的情况，计算两个完全连续的\
  \ IO 之间的距离。\n*   非排队最近：绝对最近距离 = `min(||last_LBA(r[j-1]) - first_LBA(r[j])||, ||last_LBA(r[j])\
  \ - first_LBA(r[j+1])||)`，其中 `r[j]` 是当前 IO。最近距离是绝对最近距离的有符号值，其中 `||·||` 表示绝对值。\n\
  *   排队下一个：模拟一个具有特定规则的队列，使得绝对最近距离 = `min(||last_LBA(r[i]) - first_LBA(r[j])||)`，`i\
  \ = 1, ..., n[i] ≤ N`，其中 `n[i] ≤ N` 是当前队列长度，`r[i]` 是队列中的 IO。\n*   排队最近：模拟一个队列，使得绝对最近距离\
  \ = `min(||last_LBA(r[i]) - first_LBA(r[j])||[i=1,...,ni], ||last_LBA(r[j]) - first_LBA(r[j]+1)||)`。\n\
  \n一般来说，`||排队最近|| ≤ ||非排队最近|| ≤ ||非排队下一个||`。对于距离，你可以进一步定义三个值：均值、中位数、众数。众数表示出现最频繁的数字，众数\
  \ = 0 的计数器越大，表示顺序性越好。\n\n### 时间局部性与逻辑栈距离\n\n时间局部性意味着相同的地址在 `d` 步之后被再次引用。流行度是一个与时间局部性密切相关的术语。\n\
  \n#### 逻辑栈距离\n\n如果 `r[i]` 中的某个 LBA 在一段时间后被另一个请求 `r[j]` 再次引用，则这两个请求之间的命令距离被定义为（简化后的）逻辑栈距离，这是一个重要的时间局部性指标。以写请求为例。如果距离足够小（例如，小于\
  \ HDD 的 DRAM 缓存队列大小），则可能在 DRAM 缓存中命中；否则，写操作需要更新磁盘。如果某个距离范围内的写操作频率很高，则意味着更新频率很高。\n\
  \n与 [35] 中的情况不同，我们更感兴趣的是考虑缓存的排队栈距离。因此，让我们也研究一下读/写依赖关系。具体细节将在本章后面讨论。\n\n##### 突发性与自相似性\n\
  \nI/O 请求几乎从不单独出现，而是倾向于成组到达，因为如果存在没有请求到达的长间隔，那么就会存在请求到达数量远超平均份额的间隔。它们通常与队列深度、请求到达率和到达间隔时间相关。这种现象通常被称为长程依赖性，并且通常被解释为（随机）自相似性，因为这是唯一能避免非平稳性的解释。自相似性现象描述了对象的某个属性在空间和/或时间尺度上缩放时如何保持不变。换句话说，除了长程依赖性属性外，尺度不变性属性在任何不同的时间尺度上都成立，就像分形形状一样。\n\
  \n\n\n### 统计属性可视化与评估\n\n除了前几节提到的统计属性外，感兴趣属性的边缘概率分布和联合概率分布还有其他几个属性，这些属性可能对系统行为的定量分析产生强烈影响\
  \ [35]：\n\n- **正态性：** 一个概率分布可以用正态分布精确近似。尽管现实中完美的正态分布很少见，但它常被用作参考模型。\n- **非平稳性：**\
  \ 在平稳过程中，输出（作业大小、到达间隔时间）会变化，但产生这些输出的随机过程不会变化。\n- **长尾性与幂律：** 概率分布中远离均值或中位数的某些区域，例如概率分布尾部的极端值，被赋予了相对较高的概率，遵循次指数或多项式定律，这与正态分布族的情况相反，后者的尾部呈指数衰减。\n\
  - **重尾性：** 分布的长尾呈多项式衰减，并且满足自相似性。\n- **周期行为与季节性变化：** 它们是非平稳工作负载的迹象，必须单独处理。\n- **自相关、互相关与短程依赖性：**\
  \ 自相关也称为序列相关或短期/短程记忆，其中短时间尺度上的自相关显著；长程依赖性也称为长期记忆，其中长时间尺度上的自相关显著。\n\n这些属性可以通过图形绘制进行可视化。经验累积分布函数（EDF）和互补经验累积分布函数（CEDF）常用于观察样本分布。特别地，对数-对数\
  \ EDF 和对数-对数 CEDF 图通常分别用于比较样本概率分布的主体和尾部。类似地，Q-Q 图（第一个数据集的**分位数**与第二个数据集的**分位数**的对比图）可用于评估经验概率分布与另一个参考概率分布（无论是理论分布还是经验分布）之间的可能差异，尤其是在尾部。\n\
  \n质量-计数差异图和洛伦兹曲线可用于寻找幂律属性的证据。质量-计数差异图将“质量”概率分布（由质量单位属于小于预定义 `x` 的项目的概率给出）与“计数”概率分布（由\
  \ CDF 给出）进行对比，以显示这两个概率分布之间可能存在的差异。洛伦兹曲线是说明“计数”分布与“质量”分布之间关系的另一种方式；它通过配对对应相同值的百分位数生成（即曲线上的点\
  \ (`p[c]`, `p[m]`) 满足 `p_m = F_m(x) = F_m(F_c^{-1}(p_c))`，其中 `F_m(·)` 和 `F_c(·)`\
  \ 分别是“质量”分布和“计数”分布的累积分布函数，`F_c^{-1}(·)` 是 `F_c(·)` 的反函数）。\n\n运行序列图和自相关图用于研究短程和长程依赖性以及周期模式和趋势。运行序列图按时间序列显示观测数据；它通过根据数据出现的时间顺序绘制感兴趣（单变量）属性的值来构建；该图对于发现位置和尺度的变化、定位异常值以及总体上了解观测数据的趋势特别有用。自相关图（也称为相关图）是样本自相关函数（ACF）的图，即随时间滞后增加时的样本自相关；它用于检查同一属性观测序列的随机性。如果是随机的，这些自相关在任何时间滞后间隔下都应接近\
  \ 0；反之，如果不是随机的，则一个或多个自相关将显著不同于 0。\n\n一些假设检验技术可用于对这些属性进行定量评估，例如 F 检验、T 检验、K-S（Kolmogorov-Smirnov）检验、Mann-Whitney\
  \ U 检验和 H 检验。这些检验可以比较两个经验分布函数/样本之间的差异。皮尔逊 `r` 和斯皮尔曼 `ρ` 相关系数分别用于发现感兴趣属性之间的线性相关和一般相关。两个系数的范围都在\
  \ [–1, +1] 之间，其中 +1 表示强正相关，–1 表示强负相关，0 表示无显著相关。更多细节将在第 9 章中描述。\n\n### 读/写依赖关系\n\n\
  依赖关系通常分为四类 [39]：\n\n- 写后读（ROW），或读后写（RAW），或真依赖\n- 写后写（WOW），或写后写（WAW），或写更新，或输出依赖\n\
  - 读后写（WOR），或读后写（WAR），或反依赖\n- 读后读（ROR），或读缓存命中，或输入依赖\n\n在特定的时间窗口内，ROR 和 ROW 与缓存替换算法和读命中性能直接相关，而\
  \ WOR 和 WOW 与缓存更新策略相关。两个操作之间存在 ROW 关系取决于以下情况：如果第一个操作写入了一个块，该块随后被另一个操作读取，并且该块上没有中间操作。WOW\
  \ 和 WOR 的定义类似。ROR 是检查读缓存效率的一个非常常见的属性。ROW 可以检查所谓的“一次写入多次读取（WORM）”是否可能，这对于 SMR 来说是一个重要的价值（越高越好）。\n\
  \n\n\n#### 写更新（写入时写入）\n\n较高的`WOW`比率通常意味着较高的块更新比率。因此，当存在副本块时，如果`WOW`比率在短时间内相当高，出于\
  \ IO 性能考虑，更新其中一个副本并使其余副本失效可能比更新所有副本更好。通过比较`ROW`和`WOW`，你可以推断出块被更新与被读取的可能性。`SMR`通常期望较少的写更新，从而产生较小的写放大。如果对写更新采用异地更新策略，则可以期待更好的空间效率。\n\
  \n为了更清晰地了解`WOW`，我在下面定义了三种不同类型的更新比率。它们的不同用途如表 2-7 所示。\n\n**表 2-7** 写更新比率对比\n\n| |\
  \ 频繁型 | 定时/有序型 | 堆叠型 |\n| --- | --- | --- | --- |\n| 总更新块/命令 | 是 | 是 | 是 |\n| 时序问题\
  \ | 否 | 是 | 否 |\n| 更新频率 | 是 | 否 | 否 |\n| 内存堆栈 | 否 | 否 | 是 |\n\n**频繁更新比率：** 在一段时间内，记录每个`LBA`的更新频率。任何写命中都会被计数。如果其频率大于\
  \ 1，则表明该`LBA`在观察期内被重写。因此，你可以提供一个 x 轴与 y 轴的曲线图，其中：\n\n- x 是最大更新频率（≤1 表示未重写；否则表示已重写）\n\
  - y 是更新块的比例（在指定频率值下更新的块数 / 写命令的总更新块数）或其累积分布函数（`CDF`）。\n\n这个过程可以快速、粗略地分析在传统`PMR`驱动器的工作负载中`LBA`是如何被更新的。然而，它可能无法反映`SMR`驱动器的实际比率。事实上，由于`SMR`的间接映射和日志特性，它遗漏了实际的写更新；例如，采用异地更新的重写操作对于`SMR`驱动器来说实际上是“新”写入。\n\
  \n**定时/有序更新比率：** 在一段时间内，记录更新写请求的总块数（无论是否重复）。更新是指在观察期内重写先前已写入块的操作。你可以提供一个曲线图，其中 x\
  \ = 时间或命令 ID，y = 更新块的总大小或更新块的比例（在频率 x 下更新的块数 / 命令的总块数），因此感知结果是总块中被更新的百分比。请注意，[4,\
  \ 40]中给出了与频繁更新比率和定时/有序更新比率类似的定义。\n\n**堆叠更新比率：** 在一段时间内，记录每个写命令的更新频率（部分命中或完全命中）。一旦发生重写，它就被计为一条新命令（更新频率始终≤1）。你可以提供一个曲线图，其中\
  \ x = 逻辑堆栈距离，y = 更新写命令的比例（更新写命令数 / 总命令数），或者 x = 逻辑堆栈距离，y = 更新写大小的比例（更新写大小 / 总命令大小）。它显示了实际的更新大小/命令，并说明了在`SSD`/`DRAM`缓存中进行更新是否必要。请注意，堆栈距离也可以用时间间隔来代替。\n\
  \n#### 读更新（写入时读取）\n\n此指标用于检查“一次写入多次读取（`WORM`）”是否可能。通常，`ROW`比率越高，工作负载的`WORM`特性越好。\n\
  \n**频繁`ROW`比率：** 在一段时间内，记录每个`LBA`在写命令之后的读命中频率。然后你可以绘制一个曲线图，其中 x = 最大命中次数或频率（<1 表示未更新，否则表示已更新），y\
  \ = 命中的块或命令的比例（在频率 x 下更新的块数 / `HDD`总块数）。\n\n**定时`ROW`比率：** 在一段时间内，记录自上次写入以来每个读命令的命中块。你可以提供一个曲线图，其中\
  \ x = 时间或命令 ID，y = 读命中命令的块或命令的比例（命中读命令的块数 / 总命令块数）。\n\n**堆叠`ROW`比率：** 在一段时间内，记录自上次写入以来每个读命令的命中频率（部分命中或完全命中）。你可以提供一个曲线图，其中\
  \ x = 逻辑堆栈距离，y = 读命中命令的比例（命中读命令数 / 总读命令数）或 y = 读命中命令的块比例。\n\n除了此处介绍的内容之外，其他特性，如自相似性（针对突发\
  \ IO）和节点间的工作负载依赖性（即任务如何在节点间分布）[35, 39]，也是值得进一步研究的有趣指标。为简洁起见，我在此仅针对性地介绍工作负载指标，省略了这些分析。\n\
  \n### 优先级相关指标\n\n请求在执行时具有优先级。通常，前台活动的优先级高于后台活动。在某些情况下，例如`RAID5`/`6`和`EC`操作中的同步，这些被标记为同步的请求可能由于超时策略而具有更高的优先级。\n\
  \n其他指标可能与集群、多线程、网络等相关[41]。例如，网络因素（I/O 带宽分布、信道利用率、指令、数据包大小、数据包的源或目标、页面引用模式、各种形式的延迟如传输时间和排队延迟等）也会影响最终设备的性能。\n\
  \n\n\n"
- "# 建模问题\n\n评估系统设计通常有两种常规方法。一种是直接使用追踪到的工作负载来驱动模拟。另一种是根据追踪记录构建模型，并利用该模型进行分析或模拟。尽管基于数值追踪的方法很直接，但工作负载模型相比追踪记录可能具有一些优势，例如可通过受控修改进行调整、可重复性、平稳性、泛化能力、避免噪声、增强理解、增加特性、提高效率等。因此，通过数学模型来理解这些指标至关重要。在上一节中，我指出假设检验是基于统计模型的一些假设。表\
  \ 2-8 和 2-9 列出了一些关于基础指标和高级指标建模问题的常识性细节。更多详情请参考 [35]。\n\n**表 2-9** 高级指标的数学模型\n\n\
  | 指标 | 建模问题 |\n| --- | --- |\n| **局部性** | 常用分布：Zipf 分布（独立引用模型）。其他模型：LRU 栈模型、马尔可夫模型、分形模型\
  \ |\n| **空间局部性** | 最简单的方法是通过统计引用流中的唯一子串数量。正式度量方式为工作集的大小。 |\n| **时间局部性** | 最简单的度量是通过一个“针孔”观察引用流，或使用\
  \ LRU 栈的模拟。 |\n| **读/写依赖性** | 模型：状态机、马尔可夫链、聚类 |\n| **优先级相关指标** | 完全由操作系统/文件系统规则决定。可基于马尔可夫链构建模型，并考虑\
  \ |\n| **突发性与自相似性** | 自协方差和协方差矩阵常用于描述自相似性。 |\n\n**表 2-8** 基础指标的数学模型\n\n| 指标 | 建模问题\
  \ |\n| --- | --- |\n| **吞吐量** | 常用分布：帕累托分布 |\n| **排队时间** | 常用分布：指数分布、爱尔朗分布 |\n|\
  \ **服务时间** | 常用分布：指数分布、爱尔朗分布 |\n| **响应时间** | 常用分布：指数分布、爱尔朗分布 |\n| **磁盘寻道时间** | 可通过分段函数进行数据拟合来建模\
  \ |\n| **读写比** | 无明显分布，取决于读/写依赖性 |\n| **请求大小分布** | 常用分布：对数分布、截断正态分布、帕累托分布、指数分布、幂律分布、对数均匀分布\
  \ |\n| **LBA 范围/随机性** | 参见空间局部性 |\n| **到达间隔时间** | 常用分布：泊松分布、指数分布、对数正态分布 |\n\n生成分析模型的一般步骤如下：\n\
  \n-   首先，确定公式：表征级别和工作负载基本组件。\n-   其次，在工作负载执行期间收集待建模的参数。\n-   第三，使用某种统计分布（例如，对数分布、截断正态分布、帕累托分布、指数分布、幂律分布、对数均匀分布）和随机模型（例如，马尔可夫模型）对测量数据进行统计分析，包括采样过程和静态/动态分析。\n\
  \n一个使用马尔可夫链的示例如下所述步骤。\n\n1.  假设工作负载近似周期性地具有 *s* 个状态，将一个周期内每个数据存储单元的 IO 追踪建模为特定的马尔可夫链。否则，所有相应的马尔可夫链参数都应是时变的。\n\
  \n2.  给定一个历史工作负载追踪 *L*，表示为 *D × T* 矩阵：\n\n```\nX = [[x_{1,1}, x_{1,2}, ..., x_{1,T}],\n\
  \     [x_{2,1}, x_{2,2}, ..., x_{2,T}],\n     [..., ..., ..., ...],\n     [x_{D,1},\
  \ x_{D,2}, ..., x_{D,T}]]\n```\n\n其中 *D* 是数据存储单元的总数，*T* 是时间间隔的总数。`x[d,t]` 是任意选定数据单元\
  \ `d` 在时间 `t` 的 IO 强度。`x[d,t] ∈ {1, 2, 3, ..., s}`。\n\n3.  每个马尔可夫链可以用其 `s` 乘 `s`\
  \ 的状态转移概率矩阵表示：\n\n```\nP = [[p_{1,1}, p_{1,2}, ..., p_{1,T}],\n     [p_{2,1}, p_{2,2},\
  \ ..., p_{2,T}],\n     [..., ..., ..., ...],\n     [p_{s,1}, p_{s,2}, ..., p_{s,s}]]\n\
  ```\n\n其中 `p[i,j]` 是在当前 IO 强度状态为 `i` 的条件下，数据单元 IO 强度状态在下一个时间间隔变为 `j` 的概率，且 `i, j\
  \ ∈ {1, 2, 3, ..., s}`。\n\n4.  为了简化分层存储系统中的数据分配，您还需要根据数千个数据单元的动态 IO 强度将其分类为十几个数据簇，例如使用\
  \ K-means 算法，该算法利用状态转移概率矩阵以及每个数据单元在每个状态 `s` 的驻留时间。通过结合簇的初始状态 `S`，您可以获得整个周期内所有簇的预测\
  \ IO 强度，表示为以下 `N × T` 矩阵：\n\n```\nS = [[s_{1,1}, s_{1,2}, ..., s_{1,T}],\n     [s_{2,1},\
  \ s_{2,2}, ..., s_{2,T}],\n     [..., ..., ..., ...],\n     [s_{N,1}, s_{N,2}, ...,\
  \ s_{N,T}]]\n```\n\n其中 `s[l,t]` 是第 `l` 个数据簇在第 `t` 个时间间隔的 IO 强度。\n\n请参考 [7, 8] 了解模拟方法与建模方法之间的区别。对于更复杂的情况，您可以使用所谓的多级过程模型。并且，在这些情况下，必须考虑相关性。\n\
  \n\n\n"
- '# 典型应用


  在本节中，你将了解一些典型应用的若干跟踪指标，以便快速概览。表 2-10 列出了一些典型应用，其中仅提供了块大小、读写百分比以及随机/顺序百分比的粗略值。主导因素
  `IOPS` 或 `MBPS`（吞吐量）实际上表明了工作负载是以随机请求为主还是以顺序请求为主。


  **表 2-10** 典型应用 IO 工作负载概况


  | 应用 | 大小（字节） | 读/写 | 随机/顺序 | 主导因素 |

  | --- | --- | --- | --- | --- |

  | Web 文件服务器 | 4KB, 8KB, 64KB | 95%/5% | 75%/25% | IOPS |

  | 数据库在线事务处理 (OLTP) | 8KB | 70%/30% | 100%/0% | IOPS |

  | Exchange 邮件 | 4KB | 67%/33% | 100%/0% | IOPS |

  | 操作系统驱动器 | 8KB | 70%/30% | 100%/0% | IOPS |

  | 决策支持系统 (DSS) | 1MB | 100%/0% | 100%/0% | IOPS |

  | 文件服务器 | 8KB | 90%/10% | 75%/25% | IOPS |

  | 视频点播 | 512KB | 100%/0% | 100%/0% | IOPS |

  | Web 服务器日志记录 | 8KB | 0%/100% | 0%/100% | MBPS |

  | SQL 服务器日志记录 | 64KB | 0%/100% | 0%/100% | MBPS |

  | 操作系统分页 | 64KB | 90%/10% | 0%/100% | MBPS |

  | 媒体流 | 64KB | 98%/2% | 0%/100% | MBPS |


  IO 工作负载特性通常与应用本身相关。许多访问模式，例如读写比例和处理写入的方式，因具体应用而异。然而，大多数特性仅随环境（运行条件）而变化。与环境相关的特性包括空闲间隔长度、请求到达率、工作负载随机性与顺序性、读写性能、磁盘服务时间和请求响应时间、请求大小等。更重要的是，存在一些在整个
  IO 工作负载中跨应用和环境保持一致的特性。这里特别指出的是工作负载的突发性（即长程依赖性）。特别是块级工作负载，请求到达间隔时间和请求寻道距离，通常是长程依赖的。作为时间序列中时间局部性的一种度量，长程依赖性会产生多种后果，尤其是在预测整个系统和特定资源饱和度方面。因此，在设计新的存储系统以及
  IO 路径各层的资源管理策略时，必须考虑突发性。因此，由于各种应用之间存在巨大差异，不存在适用于所有工作负载的通用良好配置 [42]。


  对于文件系统性能，保持文件系统块大小接近工作负载的 I/O 大小可以显著提高系统效率 [43]。


  Web 流量正在快速增长。一些研究人员认为，在过去 10 年中，Web 服务器工作负载特性并未发生显著变化 [44]。这些特性包括一次性引用行为、重尾文件大小分布、非泊松聚合请求流、高度集中的引用、每个文档的泊松请求流以及远程请求的主导地位。


  数据库通常具有显著的跨事务局部性，这表明实际工作负载中的事务通常是相互依赖的。另一个观察结果是，大量使用顺序访问使得可以应用预取策略。顺序性是长时间运行查询（例如连接操作）检查大量记录的结果。


  OLTP（在线事务处理）工作负载的特点是内存占用大，关键工作集小，并且从微架构优化中获益较少。此外，OLTP 工作负载中的索引搜索需要不同的缓存设计。


  让我们进一步详细研究两个工作负载。^(³⁵) 表 2-11 显示了这两个跟踪的指标值。你可以看到它们的属性差异很大。有时，在简单的合成跟踪生成器中仅使用两三个主要指标，尽管应用的实际跟踪要复杂得多。


  **表 2-11** 两种典型工作负载的基本指标


  | 跟踪 | 持续时间（秒） | 流量（GB） | 总请求数（*×*10⁶） | 平均读/写大小（KB） | 读/写流量比 | 随机读（*×*10⁶） | 随机写（*×*10⁶）
  |

  | --- | --- | --- | --- | --- | --- | --- | --- |

  | OLTP | 43712 | 18.491 | 5.335 | 3.466 | 0.1820 | 0.955 | 2.99 |

  | 搜索引擎 | 3151.3 | 16.369 | 1.055 | 15.509 | 8762.9 | 0.994 | 2.08e-4 |


  ## 文件和对象级别的跟踪


  另外两种类型的跟踪通常与块级跟踪共享许多共同属性。然而，在某些场景下，它们具有独特的特征。表 2-12 给出了一些文件级跟踪的指标，这些指标与块级跟踪的指标不同。


  **表 2-12** 文件级跟踪的一些指标


  | 指标 | 说明 |

  | --- | --- |

  | **文件类型** | 文件系统以多种方式之一被使用：作为持久数据的长期存储，作为存放因过大而无法放入主内存的数据的仓库，作为可执行文件的存储位置，以及用于存储系统使用日志以进行记账和监控。元数据与用户数据的比率是一个重要指标。
  |

  | **文件年龄** | 年龄定义为自上次引用以来的时间。 |

  | **文件访问持续时间** | 从打开到关闭的时间。 |

  | **用户行为模型** | 用户生成构成工作负载的引用。 |

  | **进程和状态模型** | 包含多个方面，例如进程在其生命周期内如何发出文件服务请求；访问依赖的条件激活表；以及不同操作（如 `open`、`close`、`write`、`read`、`seek`
  等）的比率。它可以被建模为一个封闭的马尔可夫链。 |

  | **引用模型** | 请求如何在系统中的文件之间分布。 |


  如前所述，基于不同的抽象级别，需要考虑的指标可能不同。例如，在系统级别，我们通常考虑表 2-13 中列出的属性，其中大部分属性可能存在于文件或对象级别。


  **表 2-13** 系统级别的工作负载


  | 系统视图中的工作负载 | 负载到达模式 | 数据访问模式 | 计算模式 |

  | --- | --- | --- | --- |

  | MapReduce | 作业序列的到达时间 | HDFS 输入和输出路径，输入、混洗和输出存储的数据大小 | 输入数据大小、混洗数据大小、输出数据大小、作业持续时间、映射任务时间、归约任务时间
  |

  | 企业网络存储 | 应用实例或用户会话的到达时间序列 | 读/写、顺序/随机、单次/重复访问、文件大小、文件类型 | 不适用 |


  在本章中，我介绍了一些用于存储系统性能评估和设计的跟踪指标。给出了一些典型应用，以便对这些指标有一个快速印象。事实上，由于某些应用之间存在巨大差异，通常不存在通用的系统设计。我将在后续章节中讨论更多细节。


