  \ 合成轨迹\n\n利用所有这些参数，你实际上可以编写自己的合成轨迹生成器。因此，它提供了更大的灵活性，可以更改你感兴趣的任何参数，例如磁盘大小、`BSU`、模拟时间，甚至\
  \ SPC-1C 的配置，如`ASU`、每个`BSU`的 IOPS、分布模式等。例如，你可以将`ASU`与`BSU`分离，以观察不同应用（数据存储、用户存储和日志/顺序写入）而非混合工作负载的影响，并更改分布（例如，到达间隔时间、请求大小等）以满足更具体的要求。此外，你可以将生成器作为合成生成器组件集成到其他工具包中，例如`Disksim`\
  \ [54] 和`IOMeter`。图 5-1、5-2 和 5-3 展示了由总线分析器捕获的真实轨迹与基于 MATLAB 的工具（见附录 A）生成的合成轨迹之间的对比。\n\
  \n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig3_HTML.jpg](img/468166_1_En_5_Fig3_HTML.jpg)\n\
  \n**图 5-3** SPC-1C 轨迹时间分布\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig2_HTML.jpg](img/468166_1_En_5_Fig2_HTML.jpg)\n\
  \n**图 5-2** SPC-1C 空间分布\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig1_HTML.jpg](img/468166_1_En_5_Fig1_HTML.jpg)\n\
  \n**图 5-1** 到达间隔时间直方图\n\n从图 5-1 中，你可以看到到达间隔时间近似于指数分布。如你所知，工作负载由来自三个`ASU`的八种不同类型的\
  \ IO 流混合而成。在图 5-2 的空间分布中，可以看到一些高强度流。通常，生成的随机读/写 IO 流与真实工作负载一致，但在轻负载下，顺序 IO 流并不十分接近。一个可能的原因是，真实工作负载并非由与随机游走模型完全相同的参数生成。事实上，很难使时间分布完全对齐。然而，图\
  \ 5-3 中的结果是相当可接受的。\n\n\n\n## PCMark\n\n`PCMark Vantage` [55] 是一款广泛使用的基准测试工具，其功能不仅限于磁盘性能。它可以提供八个类别的应用级追踪，如表\
  \ 5-8 所示，其中每个特定追踪被分解为写入和读取命令的数量。图 5-4 进一步以`LBA`随时间变化的图表形式展示了这些追踪。^(⁶⁷)\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig4_HTML.jpg](img/468166_1_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4** `PCMark`中的八个应用程序\n\n**表 5-8** `PCMark`中的八个应用程序\n\n| 序号 | 八个应用 | 总命令数\
  \ | 写入 | 读取 |\n| --- | --- | --- | --- | --- |\n| 1 | Windows Defender | 6755 |\
  \ 300 | 6455 |\n| 2 | 游戏 | 11040 | 62 | 10978 |\n| 3 | 导入图片 | 2806 | 4 | 2802 |\n\
  | 4 | Vista 启动 | 7418 | 1327 | 6091 |\n| 5 | 视频编辑 | 8204 | 3711 | 4493 |\n| 6 |\
  \ Windows Media Center | 5011 | 3309 | 1702 |\n| 7 | 添加音乐 | 3336 | 1506 | 1830 |\n\
  | 8 | 应用加载 | 11155 | 2660 | 8495 |\n\n现在，你可以将此追踪作为读取缓存性能分析的示例。一些早期研究表明，驱动器之间常见的区别在于读取缓存命中率，并伴有合理的前读和/或后读数据。为便于表述，我将预取操作定义为同时包含前读和后读请求，如图\
  \ 5-5 所示。一种常见情况是，如果追踪具有很强的局部性，某些后续读取请求会因预取数据而命中缓存中的数据。通常使用三种类型的预取访问：始终预取（`PA`）、未命中时预取（`PoM`）、命中时预取（`PoH`）。\n\
  \n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig5_HTML.jpg](img/468166_1_En_5_Fig5_HTML.jpg)\n\
  \n**图 5-5** 缓存预取\n\n如前所述，对于近顺序流，请求之间允许存在间隙。这个间隙可能成为预取数据中的一个“空洞”，这对整体性能有害。如图 5-6\
  \ 所示，存在三种类型的空洞：\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig6_HTML.jpg](img/468166_1_En_5_Fig6_HTML.jpg)\n\
  \n**图 5-6** 空洞类型\n\n*   **后空洞：** 传入命令的第一个`LBA`与缓存中排队命令的最后一个`LBA`之间的距离（`> 0`）在某个阈值之内。\n\
  *   **前空洞：** 传入命令的最后一个`LBA`与缓存中排队命令的第一个`LBA`之间的距离在某个阈值之内。\n*   **前后空洞：** 同时存在后空洞和前空洞。\n\
  \n为了正式定义空洞，考虑以下两种情况：\n\n*   **恒定：** 如果缓存中两个邻近区域之间的范围小于恒定值`Hs`个块，则该范围被视为一个空洞。\n*\
  \   **自适应：** 空洞大小与`DRAM`和`SSD`缓存相关（很可能随总/剩余缓存大小单调递增）。\n\n![$$ {H}_S=\\Big\\{{\\\
  displaystyle \\begin{array}{cc}\\underset{\\_}{H_S},&amp; \\left\\lfloor {a}_T{S}_T+{a}_R{S}_R\\\
  right\\rfloor &lt;\\underset{\\_}{H_S}\\\\ {}{\\overline{H}}_S,&amp; \\left\\lfloor\
  \ {a}_T{S}_T+{a}_R{S}_R\\right\\rfloor &gt;{\\overline{H}}_S\\\\ {}\\left\\lfloor\
  \ {a}_T{S}_T+{a}_R{S}_R\\right\\rfloor, &amp; Otherwise\\end{array}} $$](img/468166_1_En_5_Chapter_TeX_IEq1.png)\n\
  \n其中`S[T]`和`S[R]`分别是总缓存大小和剩余缓存大小，`a[T]`和`a[R]`是`S[T]`和`S[R]`的系数。一个针对 64MB `DRAM`缓存的示例如下定义：\n\
  \n![$$ {H}_S=\\Big\\{{\\displaystyle \\begin{array}{cc}16,&amp; \\left\\lfloor {a}_T{S}_T+{a}_R{S}_R\\\
  right\\rfloor &lt;\\underset{\\_}{H_S}\\\\ {}256,&amp; \\left\\lfloor {a}_T{S}_T+{a}_R{S}_R\\\
  right\\rfloor &gt;{\\overline{H}}_S\\\\ {}\\left\\lfloor {a}_T{S}_T+{a}_R{S}_R\\\
  right\\rfloor, &amp; Otherwise\\end{array}} $$](img/468166_1_En_5_Chapter_TeX_IEq2.png)\n\
  \n其中 ![$$ {a}_T=\\frac{1}{2^{13}},{a}_R=\\frac{15}{2^{13}} $$](img/468166_1_En_5_Chapter_TeX_IEq3.png)。实际的\
  \ ![$$ \\underset{\\_}{H_s} $$](img/468166_1_En_5_Chapter_TeX_IEq4.png) 和 ![$$ {\\\
  overline{H}}_s $$](img/468166_1_En_5_Chapter_TeX_IEq5.png) 由追踪决定，例如时间窗口内请求的中位数大小。更具体地说，需要考虑空洞是否位于同一磁道/柱面内。\n\
  \n应实现一个后台任务来监控缓存中的`LBA`区域以及这些区域上的命中密度。该进程还负责查找具有一定命中密度的数据区域中的间隙，并生成自诱导读取命令，用主存储器中的数据填充这些空洞。\n\
  \n为了将缓存算法与追踪属性联系起来，使用以下假设：\n\n*   如果某个时间范围内两个特定范围的区域具有足够高的相关性，那么它们之间的间隙很可能被访问。\n\
  *   预取不应过多影响整体性能，因此从额外缓存命中率中获得的收益应大于预取带来的额外成本。\n*   待填充空洞大小的上限由多种因素决定，例如总/剩余缓存大小、工作负载大小、缓存类型、访问时间等。\n\
  \n现在我们有一些问题需要回答。\n\n*   空洞填充策略能带来什么好处？关键在于获取增加的缓存命中率（采用空洞填充时的命中率与未采用空洞填充时的命中率对比）。\n\
  *   空洞填充策略会带来什么额外成本？关键在于找出为填充空洞生成了多少自诱导命令。必须考虑用户工作负载的时间。\n*   由于空洞填充与预取策略之间存在相似性，是否有可能将空洞填充合并到预取策略中（集成）？关键在于找出两种策略之间重叠的缓存命中；如果重叠率很高，预取可能将空洞填充作为其一部分。\n\
  *   何时何地应用这两种策略（或集成策略）才能平衡收益与成本？关键在于减少额外的机械访问成本和缓存污染。\n\n\n\n\n## 工作负载属性\n\n首先，我们来看思考时间和完成时间，分别如图\
  \ 5-7 和图 5-8 所示。可以看到不同应用在这两项指标分布上的巨大差异。表 5-9 进一步给出了平均值、标准差以及 `IOPS` 的值。图 5-9 和表\
