  \ | 0.128 | 0.930 | 0.590 | 0.027 | 0.593 | 0.000 | 0.390 | 0.637 |\n\n接下来，我们考虑预取策略的增益与损失。先定义以下术语：\n\
  \n*   **预取：** 包括后读和前读。后读是指在最后一个 LBA 上附加额外大小；前读是指在第一个 LBA 上附加额外大小。例如，假设原始命令是读取 LBA\
  \ 10-20，前读大小为 8，则扩展后的命令是读取 LBA 2-20。\n*   **增益：** 获得的额外缓存命中数（`b`2）= 取指长度 x 下的缓存命中率（`b`3）-\
  \ 无预取时的缓存命中率（`b`0）\n*   **损失：** 预取命令发生次数 / 总读取命令数（`b`1）\n*   **增益-损失比** `b` = `b`[2]`/b`[1]：该值越高越好\n\
  \n针对此案例，除了队列深度和时间间隔外，我们还需要考虑顺序流的数量以及每个流的长度。其过程与前一案例类似。表 5-13 展示了结果。可以看出，应用 5 在后读方面效果最显著；而应用\
  \ 6 效果则不太显著。在短队列深度下，`b` 通常小于 1。当预取大小非常小（< 64）时，`b` 非常小（<< 1）。当队列长度和孔洞长度较长时，预取策略通常是有用的。根据\
  \ `b` 的值，可以认为该策略对应用 6 基本无效，对应用 5 的后读效果最显著，对应用 2、4、7 和 8 可能有用。\n\n**表 5-13 预取策略的增益-损失分析**\n\
