  65% 和 85%，这更能合理地指示读操作的序列比率高于写操作。随着 `S` 的增加，近顺序读/写命令的比率略有下降，这与序列比率的情况类似。请注意，距离通常大于
  8 个块；当 `δd` ≥ 16 时，增量显著。


  ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig11_HTML.png](img/468166_1_En_8_Fig11_HTML.png)


