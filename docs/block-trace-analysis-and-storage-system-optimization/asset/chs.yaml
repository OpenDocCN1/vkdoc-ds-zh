- "# 案例研究：基准测试工具\n\n基准测试工具有助于为具有特定需求的存储系统提供一些“标准”性能指标。本章展示了如何识别基准测试结果的访问模式。第一个工具是来自存储性能委员会（SPC）的`SPC-1C`。在捕获模式后，我开发了一个合成仿真器来匹配真实轨迹。第二个工具是来自\
  \ FutureMark 的`PCMark`。我阐述了如何使用盈亏分析来提高缓存算法效率。\n\n存储性能基准测试通过运行一系列标准测试和试验，借助一个工具或一组程序（无论是否支持特定硬件设备），来评估存储系统的相对性能。以下是一些常用于主动轨迹收集的基准测试工具：\n\
  \n-   **合成轨迹**。\n    -   用户可以指定队列深度、请求大小、传输速率、顺序等测试场景。这对于确定边界情况行为很有帮助。\n    -  \
  \ 示例：`IOMeter`、`VDBench`、`fio`、`IOzone`、`iorate`、`sqlio`、`diskspd`^(⁵⁶)\n\n-   **基于应用的轨迹**。\n\
  \    -   用户可以选择具有预定义工作负载模式的特定应用程序。这对于说明真实世界案例很有帮助。\n    -   示例：`SysMark`、^(⁵⁷) `PCMark`、`SPC`（存储性能委员会，例如`SPC-1`、`SPC-2`）、`TPC`（事务处理性能委员会，例如`TPC-A/B/C/D/H/W`）、^(⁵⁸)\
  \ `SPEC`（标准性能评估公司，例如`HPC/SFS/JVM/SDM`）、^(⁵⁹) `Jetstress`、^(⁶⁰) `COSbench`^(⁶¹)\n\
  \n-   **真实轨迹**。\n    -   用户可以直接输入真实世界的轨迹。当用户尝试在不同系统中测试类似应用程序时，这非常有用。\n    -   示例：`AnandTech\
  \ Storage Bench`^(⁶²)\n\n表 5-1 对一些常用工具进行了简单比较，其中操作系统列中的字母 W、L 和 U 分别表示 Windows、Linux\
  \ 和 Unix。\n\n**表 5-1** 一些常见基准测试工具的比较\n\n| | 块 | 文件 | Posix | 操作系统 | 单机/客户端 | 开源\
  \ | 最新版本 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| `Iometer` | 是 |\
  \ - | - | WLU | 单机/客户端 | 是 | 1.1.0/2014 |\n| `IOzone` | 是 | 是 | 是 | WLU | 单机 | 是\
  \ | 2006 |\n| `Bonnie++` | 是 | | | LU | 单机 | 是 (GPL2) | 1.0.1 |\n| `dbench` | 是\
  \ | 是 | 是 | LU | 单机/客户端 | 是 (GNU) | 2008 |\n| `Filebench` | 是 | 是 | 是 | LU | 单机\
  \ | 是 | 2011 |\n\n对于大规模系统，传统工具可能不够用（例如，缺乏测量指标）或不够方便（例如，没有集成用户界面）。因此，提出了一些专用工具，例如用于大数据基准测试的`HiBench`、^(⁶³)\
  \ `Berkely BDB`、^(⁶⁴) `BigDataBench`^(⁶⁵) 和 `BigBench`^(⁶⁶)，特别是针对 Hadoop/Spark 系统。\n\
  \n通用的基准测试流程如表 5-2 [52]所示。请注意，还存在其他分类方法。例如，三种类型分别命名为：底层系统操作中的微基准测试（例如，在现代集群上评估`HDFS`操作）、高级功能中的功能/组件基准测试（例如，`Terasort`、基本\
  \ SQL）、应用级基准测试（例如，针对给定应用场景的整体系统性能）。更多详情，请参考[41, 35]。\n\n**表 5-2** 通用基准测试的五个步骤\n\n\
  | 步骤 | 备注 |\n| --- | --- |\n| 选择合适的配置。 | 选择正确的基准测试类型，例如宏基准测试（对整个系统进行全面测试）、微基准测试（通过少量操作检查局部变更）或基于轨迹的基准测试。\
  \ |\n| 选择正确的环境。 | 一致的硬件和软件设置，以及一些因素，例如缓存状态、硬盘分区恒角速度、文件系统老化、非必要进程等。 |\n| 运行基准测试。\
  \ | 为可重复性进行相同运行，为准确性进行多轮运行（具有较小的标准差或较高的置信水平），为稳态提供足够的运行时间，通过合适的脚本自动运行。 |\n| 呈现结果。\
  \ | 具有较小置信区间且接近正态分布的统计结果。 |\n| 验证结果。 | 重现/确认结果，或与其他类似结果进行比较。 |\n\n## SPC-1C\n\n\
  存储性能委员会（SPC）提供了多个不同级别的基准测试工具。`SPC-1C` [53] 被设计为与供应商/平台无关，适用于广泛的存储组件产品，例如磁盘驱动器、主机总线适配器（HBA）、智能机箱以及诸如逻辑卷管理器之类的存储软件。\n\
  \n\n\n## 工作负载属性\n\n与工作负载强度相关的两个重要概念是`BSU`（业务扩展单元）和`ASU`（应用存储单元）。每个`BSU`由三个`ASU`组成：`ASU1`用于数据存储，权重为\
  \ 45%；`ASU2`用于用户存储，权重为 45%；`ASU3`用于日志，权重为 10%。这总共对应每个`ASU`五个 IOPS。\n\n访问模式有三种类型：随机（均匀分布）、顺序和（随机游走访问）模式。详细信息见表\
  \ 5-3，并在表 5-4 中进一步总结。表 5-5 表明，小尺寸请求（8 和 16 个块）占比超过 85%。随机游走是马尔可夫链的一个重要模型。表 5-6 展示了该模型的主要特征。\n\
