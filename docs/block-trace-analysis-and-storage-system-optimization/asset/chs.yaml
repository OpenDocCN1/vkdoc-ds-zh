  \n**图 6-10**  \n多轮重复下的读取响应时间模式\n\n## SMR\n\n本节将讨论 SMR [4, 5] 的主要特性以及这些特性与特定工作负载之间的相互作用。业界通常有两种处理\
  \ SMR 的方法：\n\n* 驱动器管理所有数据访问，数据管理复杂，类似于 SSD 的 FTL（闪存转换层），因此元数据管理、GC（垃圾回收）、预留空间、性能变化等都在驱动器内部进行。但是，主机端无需更改，因此该驱动器可作为普通驱动器使用。目前，市场上所有主要的\
  \ SMR 驱动器都属于这一类。\n\n* 主机通过类似闪存文件系统的 SMR 专用文件系统来管理大多数与数据相关的访问。数据管理很复杂，但可以利用成熟的、顺序写入的文件系统。几个例子包括\
  \ SFS [58]、HiSMRfs [59] 和 Shingledfs [5]。虽然混合驱动器-主机管理也是可能的，但非常罕见。\n\nSMR 驱动器考虑了许多特定的设计问题，例如数据布局管理（布局、数据放置、碎片整理、GC、指向\
  \ band 的指针）、混合区域（在同一磁盘中组合叠瓦式和非叠瓦式部分）、SMR 算法以及针对特定应用的结构等。表 6-5 列出了 SMR 的一些主要预期工作负载特性，以便那些具有设计指标的应用能够在\
  \ SMR 驱动器上完美运行。\n\n**表 6-5**  \nSMR 特性与工作负载指标对比\n\n| SMR 特性 | SMR 预期 | 工作负载指标 |\
  \ SMR 影响 |\n| --- | --- | --- | --- |\n| 顺序写入 | 适用于大尺寸顺序写入请求 | 平均写入请求大小和分布、寻道距离（LBA）、顺序流和近顺序流\
  \ | 尺寸越大越好；寻道距离越小，顺序性越强；流越多，顺序性越强 |\n| 一次写入多次读取 | 适用于较少更新和较多读取 | 读/写比率、读时写（ROW）命中率、写更新比率\
  \ | 读/写比率（ROW 比率）越高越好；写更新比率越小越好 |\n| 垃圾回收（GC） | 较小的写放大和较少的 GC | 设备利用率、设备空闲时间分布、队列长度、IOPS、吞吐量、频繁/定时/堆叠的写更新比率（WUR）、写时写（WOW）命中分布和比率\
  \ | 长时间且频繁的空闲时间用于 GC；低写更新比率表明需要的 GC 较少 |\n| 顺序读取到随机写入 | 由于间接映射（例如，随机物理地址中的顺序 LBA\
  \ 读取请求）导致的读取性能影响较小 | 读时写（ROW）命中/大小分布和比率 | 小（大）读取与小（大）写入的比率越高越好 |\n| 原地或非原地更新 | 频繁和最近的更新需要随机访问区域（RAZ）/SSD/大容量\
  \ DRAM 缓冲区来保存写入数据 | 堆叠写更新比率 | 在较短堆叠中比率越高，就越需要原地更新缓冲区 |\n\n脚注 1\n\n\n\n"
- "# 7. 案例研究：RAID\n\nRAID 是当今世界应用最广泛的数据保护策略之一 [23, 60, 61, 62, 63]。与单磁盘访问相比，它具有独特的特性，例如文件同步、恢复等。因此，它产生了一些与其他方式不同的独特\
  \ IO 模式。本章基于两个应用场景中的 RAID 5 示例进行分析。两个跟踪记录之间观察到了巨大差异。本章还分析了这些工作负载是否适用于 SMR 驱动器。此外，还提供了一些建议以提升系统性能。\n\
  \nRAID 的概念于 1987 年被引入，旨在利用商用硬盘的潜力。Patterson 等人 [64] 于 1988 年正式确立了 RAID 分类法。RAID\
  \ 通过将一组低容量磁盘暴露为一个虚拟的单个大型昂贵磁盘（SLED），克服了商用磁盘的容量限制。\n\nRAID 技术通常需要通过数据条带将数据分布到多个磁盘上。条带代表阵列中最小的保护单元，因此条带内任何丢失的数据都可以仅使用该条带内幸存的数据进行恢复。早期，由于客户端通过串行访问通道连接到\
  \ RAID，因此并未明确支持多客户端的并行访问。然而，随着许多先进排队调度程序的发展，为了充分利用多磁盘的优势，并行性现在已广泛应用于 RAID 系统中。\n\
  \nRAID 系统中存在一些常见的性能问题 [20, 62, 63]，例如小写问题、同步问题、降级（恢复和重建）期间的性能损失等。\n\n小写问题存在于许多关键应用中，例如在线事务处理（OLTP）系统。这些应用通常包含许多读-修改-写（RMW）访问。这给\
  \ RAID 系统带来了一些问题。首先，在条带化阵列中进行写入操作，需要在写入新数据和新校验块之前，同时读取数据块和校验块，并计算新的校验块，这比单磁盘访问多出四倍的访问次数。其次，这些小访问仅更改特定条带内的几个块，但在更新期间，整个条带的校验盘不可用。这通过减少可能的并行性，极大地降低了阵列的性能。\n\
  \n同步问题源于数据完整性要求；只有当条带阵列中的所有驱动器都完成操作时，系统才会返回完成信号。由于某些磁盘可能比其他磁盘更早完成访问，因此较快的磁盘必须等待较慢的磁盘。在某些情况下，例如非关键应用、受保护的\
  \ DRAM 等，此要求可能会放宽。在恢复期间，由于后台恢复访问，前台用户请求可能会受到很大影响 [65]。\n\n类似的问题也适用于使用纠删码（EC）的磁盘阵列。并且在某些情况下，由于\
  \ EC 比传统 RAID 的复杂性更高，问题可能更为关键。\n\n## 工作负载分析\n\n你将研究来自两个不同供应商、应用于视频监控场景的两个 RAID 5\
  \ 示例。将首先给出系统设置，然后分析两个不同的跟踪记录：读密集型案例和写密集型案例。\n\n### 系统设置\n\n在第一个示例中，有 10 个 7200RPM\
  \ 的 HDD，每个容量为 4TB。该系统施加了 24 个写入流和 6 个读取流。第二个示例有 36 个类似的 HDD，带有 90 个视频通道。跟踪记录的长度分别为\
  \ 620 秒和 110 秒。一些基本指标列于表 7-1 和 7-2 中。\n\n**表 7-2** RAID 跟踪记录 2：写密集型\n\n| 指标 | 总计\
  \ | 读取 | 写入 |\n| --- | --- | --- | --- |\n| `Cmd` 数量 | 21449 | 8535 | 12914 |\n\
  | 总块大小 | 2528514 | 357824 | 2170690 |\n| 平均块大小 | 210.012 | 41.924 | 168.088 |\n\
  | 平均 IOPS | 193.152 | 76.859 | 116.293 |\n| 平均吞吐量 (MBps) | 11.118 | 1.573 | 9.545\
