  ### 启用写入缓存与禁用写入缓存


  写入缓存是 HDD 的一项重要功能。许多研究表明，由于回写策略，启用写入缓存 (`WCE`) 的性能可以比禁用写入缓存 (`WCD`) 显著提高，特别是对于某些小尺寸随机写入工作负载。然而，数据可靠性问题（例如，电源故障导致
  DRAM 写入缓存中的脏数据丢失）导致大多数数据中心禁用此功能。


  这里我们比较四个跟踪记录（148-21、148-22、149-21 和 149-22），因为节点 148 和 149 始终使用不同的写入缓存设置，并且在批次 ID
  21 和 22 之间设置发生了变化（参见表 8-2）。你可以看到，如表 8-8 所示，写入 IOPS、吞吐量和平均大小没有本质区别。同时，大写入请求（例如，1024
  个块）的比率几乎保持不变。然而，你可以观察到，对于读取和写入，`WCD` 的（近）顺序比率略小于 `WCE`（绝对值相差 1%）。这些因素表明，即使本地文件系统可能对其做出响应，HDFS
  也不会根据 HDD 的写入缓存设置改变其行为。然而，由于工作负载远未达到驱动器的极限能力，这种响应并不显著。


  **表 8-8** WCD 与 WCE 的基本 IO 指标


  | 平均值 | IOPS | 吞吐量 KBPS | 大小（块） |

  | --- | --- | --- | --- |

  | | 21 | 22 | 21 | 22 | 21 | 22 |

  | 148 | 6.3 | 7.0 | 1846.6 | 2064.4 | 586.0 | 589.5 |

  | 149 | 6.6 | 6.8 | 1782.2 | 1881.9 | 541.8 | 556.6 |


  在繁重的工作负载情况下，一些交错的顺序流将被视为“随机”而非顺序，导致随机写入比率增加，这对整体磁盘性能有害。因此，可能需要应用一些非易失性内存或 DRAM 保护技术来启用写入缓存，这对于繁重的工作负载来说是必要的。此外，对于数据中心中瓶颈不在
  HDD（至少在正常负载下）的绿色环境，`WCE` 的另一个好处是由于减少了 HDD 的机械访问而节省能源。



  ### 系统级视角


  在本节中，我将简要分析上一节中观察到的块级随机 I/O 如何有助于更好地分析 Hadoop 集群的 I/O 模式。首先，让我们看一下从 HDFS 日志中收集的工作负载特征，如表
  8-9 所示。回顾前面提到的系统级分析；我捕获了数据生成和删除速率、作业创建速率及其特征等，而底层 I/O 对我们来说是模糊的。可以说，这正是高级框架应有的行为方式——完全或大部分与底层硬件设备隔离。然而，那些必须维护完整运维栈的人必须了解整个系统，而不仅仅是用户级框架。下面，我将从三个方面分析随机性：Hadoop
  框架、MapReduce 策略和 HDFS 机制^(⁷³)。


  **表 8-9** 从 HDFS 日志收集的基本信息


  | 名称 | 持续时间 | 总 I/O 请求数 | 平均 I/O 大小(MB) |

  | --- | --- | --- | --- |

  | | 平均 | 最大 | 最小 | 总计 | 读取 | 写入 | |

  | `wdc-x1` | 68 天 | 0.627 | 5.476 | 0.125 | 60.96 | 3.14 | 99.75 | |

  | `wdc-x2` | 98 天 | 0.396 | 5.661 | 0.107 | 47.83 | 3.09 | 93.2 | |

  | 读写比 | IOPS 10⁵ | 吞吐量 (MB/S) |

  | 平均 | 最大 | 最小 | 总计 | 读取 | 写入 | 总计 | 读取 | 写入 |

  | 0.0348 | 0.125 | 0.0054 | 0.726 | 0.536 | 0.19 | 18.48 | 0.632 | 17.85 |

  | 0.0383 | 0.33 | 0.007 | 0.458 | 0.325 | 0.133 | 12.11 | 0.442 | 11.67 |


  请注意，Hadoop 框架内的所有守护进程在一天中都会记录其运行时的日志。根据配置，这些日志可以写入 HDFS 或本地文件系统。如果日志写入本地文件系统，它们会产生一些对
  HDD 的随机 I/O。位于 Hadoop 核心框架之上的其他框架守护进程可能会在设备级别产生更多随机 I/O。HBase 也有来自其区域服务器的类似日志需要写入。HBase
  是为实时数据处理而创建的，它会生成小型 MapReduce 作业，这些作业可能访问少量数据，从而在 HDFS 实例中引起随机读取 I/O。像 Hive 和其他位于
  Hadoop 之上的 KV 存储这样的框架，具有类似的日志记录结构，可能会在设备级别导致随机 I/O 放大。


  基于 Java 的（Apache）MapReduce 在 MapReduce 作业期间必须将临时中间文件写入磁盘，其中一些文件具有重复的进程 ID（PID），而另一些则具有单一或极少使用的
  PID。这些中间文件可以转储到 HDFS 中的位置（如果可能，HDFS 会尝试序列化 I/O）或本地文件系统，后者将是一个随机 I/O 事件。这可以通过调整参数`mapreduce.task.tmp.dir`进行配置。


  在查阅 Hadoop XML 配置文件后，我注意到一件事：所有 HDFS 和 MapReduce 工作负载的临时/中间空间都被配置为将其输出数据存储到 HDFS
  数据驱动器。由于 Hadoop 框架是用 Java 编写的，它必须应对 Java 虚拟机（JVM）的特性，这意味着内存地址在不同 JVM 之间没有意义。因此，当一个
  MapReduce 任务将数据传递给另一个 MapReduce 任务时，它首先将数据写入一个临时文件，供另一个 JVM 任务读取。此外，当启动一个 MapReduce
  作业时，它必须将配置参数和可执行 jar 文件发送给`TaskTracker`，以便它们能够正确地生成 map 和 reduce 任务。这些数据也被存储到配置的本地临时空间中。


  将这种 I/O 与集群每天运行近 5500 个 MapReduce 作业（其中许多是小型任务计数作业，因为用户执行了 20%的 HBase 分析）这一观察结果结合起来，这些
  HDD 上产生的随机 I/O 量变得非常大。然而，这种 I/O 是可以缓解的，并且并非完全导致块级跟踪中观察到的高水平随机 I/O 的原因。HDFS 本身也对这些跟踪中观察到的随机
  I/O 量有所贡献。


  从如图 8-16 所示的系统日志中，您可以看到系统每天创建和删除的数据块数量相当高。每次 HDFS 向文件系统提交一个数据块时，它还会创建一个元数据文件。这个元数据文件的大小与提交到本地文件系统的
  HDFS 数据块大小成正比，因此一个 128MB 的数据块将对应创建一个约 1.2MB 的元数据文件，而较小的数据块将对应较小的元数据文件。因此，对于所观察的工作负载，由于
  HDFS 上每天生成数万个新数据块，会产生大量的小型随机 I/O。然而，与 MapReduce 框架中可配置临时文件存储位置的随机 I/O 不同，这些 HDFS
  元数据文件的存储位置不是一个可配置的属性，因此不能委托给另一类存储或存储位置。在考虑较新的 HDD 技术时，其中随机 I/O（尤其是随机写入）会极大地影响性能，理解像这样的工作负载特征至关重要。如果没有对工作负载进行设备级分析，这些特征就不会被如此清晰地识别出来。


  ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig16_HTML.jpg](img/468166_1_En_8_Fig16_HTML.jpg)


  **图 8-16** 来自 HDFS 日志的基本曲线




  ## 进一步讨论


  在本章中，我通过考虑一些特定指标，展示了 Hadoop 集群的块级工作负载特征。所呈现的分析技术可帮助他人在其生产环境中理解 Hadoop 的性能与驱动特性。通过
  `blktrace` 收集的日志，我对这些日志进行了全面分析，识别出了一些具有意外行为的新工作负载模式。我指出，虽然顺序和近顺序请求占据了 IO 工作负载的大部分，但在
  Hadoop 工作负载中仍存在不可忽视的随机 IO 请求。此外，驱动器上的写更新比率并不高，这表明如果采用异地写入策略，可能会产生较小的写放大效应。同时还需注意，ROW
  比率很小，这意味着 WORM 通常不适用于该集群的工作负载。所有这些发现都表明，空间局部性相对较高，而时间局部性低于预期，这说明 Hadoop 通常是适用于 SMR
  驱动器的应用。然而，Hadoop 和驱动器两端都需要进一步改进。


  从批判性角度审视 Hadoop 系统的配置，可以对观察到的部分（而非全部）随机 IO 进行微调并最小化。导致这种随机 IO 的因素包括几种类型的框架日志记录、MapReduce
  和 HBase 工作负载生成的中间文件，以及 HDFS 数据块的元数据文件。可以降低 Hadoop 守护进程日志文件的详细程度以减少生成的数据量，并且这些日志文件以及临时的
  MapReduce 输出可以写入一个不会影响 HDFS 数据块 IO 操作的存储位置。这些位置可以是 HDFS 本身（而非本地存储），这将尝试使 IO 更加顺序化，也可以是另一个更适合随机块
  IO 的物理/逻辑块设备（同时保持数据本地性）。图 8-16 展示了从 HDFS 日志中推导出的一些基本曲线。


  然而，观察到的随机 IO 的最后一部分是 HDFS 写入/更新机制的结果，并且不易缓解，因为它目前必须与已提交的 HDFS 数据块一起驻留在 HDFS 数据驱动器上。由数据块元数据引起的小型
  IO 必须由一个容量块存储设备来处理，该设备要么能够理解如何将这些小型随机 IO 转换为更大的顺序访问模式，要么就是一个专门为处理随机 IO 而设计的设备。如果没有设备级的视角，这种开销可能会被误认为是系统中其他地方的问题，而不是
  HDD 设备级的问题，而其中一些问题在获得正确洞察后是非常容易纠正的。例如，对于随机读取访问的场景，大容量 DRAM 缓冲区将非常有用；而对于随机写入访问，非易失性存储器（例如
  NAND 和传统区域）则很有帮助。


  因此，有必要研究 HDFS 与本地文件系统的集成，同时考虑设备属性，例如采用全局视角的设计，以避免对 HDFS 中顺序写入的本地元数据产生“误解”。并且，元数据和“非关键”的中间/临时数据应被分配到合适的磁盘位置。因此，HDFS
  可以承担 DataNode 中文件/块访问的责任，这可能会使驱动器操作更高效。设备中的元数据位置也应精心设计。


  此外，考虑到 Java 的机制，驱动级缓存和系统级缓存可以统一起来，这样一些临时数据可能被统一的缓存/缓冲区吸收，而无需进行磁盘机械访问。由于当前 HDFS 的缓存设计简单且
  JVM 与驱动器之间缺乏直接接口，这种统一可能很困难。然而，驱动器制造商提供这种面向应用的通信接口是可能的。


  此外，某种智能机制可能有助于驱动器理解访问的性质（例如，随机或顺序、访问依赖性），从而使驱动器能够立即切换到最优算法/行为以获得更好的性能。一种在主机和驱动器之间进行交互的应用级提示方案，或者驱动器内部的自学习算法，可能会有所帮助。


  总之，对内部 Hadoop 集群的设备级分析为理解 Hadoop 如何与底层文件系统交互以及如何处理其低级 IO 提供了新的见解。这些新见解激励我继续研究大数据框架的工作负载特征和应用调优如何能够在我们所处的当前数据驱动环境中帮助提升存储设备的性能。这项研究也大致适用于
  Spark（一种内存型 MapReduce 系统）。例如，详细的工作负载分析可以为 Spark 系统的 SCM 应用提供一些见解，这将有助于设计出成本高效的混合
  SCM-DRAM 结构。


