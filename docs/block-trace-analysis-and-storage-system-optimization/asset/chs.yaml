  ### 大小与 LBA 分布


  总体请求 LBA 分布如图 8-6a 所示。图 8-6b 进一步展示了大小分布曲线，从中可以看出最小请求为 8 个块，而最大大小为 1024 个块。对于写入请求，8
  块和 1024 块请求的总比例接近 90%。大尺寸写入请求（>=1024 块）的比例大于 55%，因此写入请求更具顺序性。对于读取，大小 <=256 的请求比例约为
  50%，并且大小分布更加多样化。因此，读取请求通常比写入请求更随机。LBA 与大小分布图进一步证实了这一观察结果。事实上，对于写入，您可以看到大多数大尺寸请求密集地分布在少数几个范围内；中等尺寸的请求非常少，而对于读取，大小分布则更加多样化。


