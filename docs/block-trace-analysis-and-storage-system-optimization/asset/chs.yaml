  因此，可以看到，在没有大小约束的情况下，“顺序”读/写的总比率分别超过 82% 和 74%（`N=256`）（检测到的顺序读/写命令数 / 总写/读命令数）。在施加大小约束（`S
  = 1024`）后，该比率分别降至 76% 和 65.5%，这更能合理地指示序列比率。


  随着 `S` 的增加，顺序读/写命令的比率略有下降，如图 8-10 所示。这表明写操作的顺序性相当强，因为顺序流通常很大，所以当 `S` 从 1024 变为 4096
  和 8196 时，写操作的比率分别从 82% 降至 62% 和 58%。


