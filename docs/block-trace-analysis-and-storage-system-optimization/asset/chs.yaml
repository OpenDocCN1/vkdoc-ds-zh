  | --- | --- | --- |

  | CPU | 核心数、速度、架构、指令集等 | 常见建议是每个 OSD 至少有一个（虚拟）核心。更快的 CPU 核心通常有助于性能提升，尽管 CPU 架构也很重要（例如，Intel
  与 ARM、内部架构/版本），以及实际的每 GB 性能、每美元性能等。关闭节能模式有帮助。 |

  | 内存 | 每台服务器的 RAM，每个 OSD 的 RAM 等 | 常见建议是每 1TB OSD 至少 1GB 内存，每个 OSD 最好有 2GB。实际值取决于工作负载。
  |

  | BIOS | HT 模式、节能、NUMA 等 | HT 影响虚拟核心数（启用）。需权衡节能带来的低功耗与分配的计算资源减少。 |

  | 网络交换机/NIC | 带宽和延迟；以太网、光纤、InfiniBand 等 | 更高的带宽在一定程度上带来更高的吞吐量；更低的延迟有利于更多小 IO。对于高质量网络，尝试设置
  `ms crc data = false` 和 `ms crc header = false`。对于少于 20 个机械盘或 2 个 SSD 的集群，考虑升级到
  25GbE 或 40GbE。 |


  从这个意义上说，您应该监控系统的所有必要组件，以便得出结论。以图 9-5 中的 Ceph 软件栈为例。您可以将相应的系统监控工具 ^(⁷⁴) 部署到感兴趣的栈点以收集数据，从而捕获所有可能的软件故障、错误、性能下降等位置，以及所有潜在的软件性能调优点。事实上，Ceph
  有一些内置的监控工具，例如 `LTTng`。


  ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig5_HTML.jpg](img/468166_1_En_9_Fig5_HTML.jpg)


  **图 9-5** Ceph 软件栈


  已经开发了用于 Ceph 部署、监控和管理的专用工具，例如 `CeTune`（Intel）、^(⁷⁵) `VSM`（Intel）、^(⁷⁶) `OpenATTIC`^(⁷⁷)
  和 `InkScope`。^(⁷⁸)


  借助一些集成工具，例如 `SaltStack`，^(⁷⁹) 您可以设计自己的全能工具。图 9-6 展示了一种可能的设计，旨在集成 Ceph 系统的配置、部署、基准测试和测量分析功能。它可以使用“胶水”编程语言
  `Python` 以及一些 `Bash` 脚本来开发。


  ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig6_HTML.jpg](img/468166_1_En_9_Fig6_HTML.jpg)


  **图 9-6** Ceph 性能工具的功能


  如图 9-6 的整体结构所示，该工具集成了一些组件，例如用于 Ceph 管理的 `SaltStack`、用于性能数据收集和存储的 `InfluxDB`^(⁸⁰)
  与 `Telegraf`^(⁸¹)，以及用于数据可视化的 `Grafana`。^(⁸²) 所有这些工具都是开源的，并采用免费许可证（`InfluxDB`/`Telegraf`
  采用 MIT 许可证，`Grafana`/`salt-stack` 采用 Apache v2 许可证）。


  `SaltStack` 平台或 `Salt` 是一个用 `Python` 编写的开源配置管理软件和远程执行引擎。它本质上具有服务器-客户端结构。您可以使用 `Salt`
  来管理 Ceph 节点并分发执行命令。`InfluxDB` 是一个从头开始构建的时间序列数据库，用于处理高写入和查询负载。`Telegraf` 由 `Go`^(⁸³)
  开发，是一个指标收集守护进程，可以从广泛的输入中收集指标，并将其写入广泛的输出组中。它采用插件驱动的方式进行数据收集和输出，便于扩展。它是一个编译好的独立二进制文件，可以在任何系统上执行，无需外部依赖；不需要
  `npm`/`pip`/`gem` 或其他包管理工具。一旦 `Telegraf` 守护进程运行，数据将自动保存到 `influxDB`。`Grafana` 提供了一种强大而精致的方式来创建、探索和共享仪表板和信息，与您的团队和世界分享。数据库设置完成后，您可以配置
  `Grafana` 的数据源，从这些 `influxDB` 中获取数据。


  使用此工具，您可以轻松获取所有必要信息。请查看文件存储 IO 模式部分提供的示例。从表 9-2 中，您可以清楚地观察到某些驱动器的 IO 带宽已被耗尽。然而，同时
  CPU、内存和网络的使用率都低于 50%。因此，您可以得出结论：驱动器是性能瓶颈。


