  \ | 35 | 30M |   |\n| 900K | - | - | 900K | 42 | 36.9M |   |\n| 1024K | N.A. | -\
  \ | 1000K | 36 | 36M |   |\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig5_HTML.jpg](img/468166_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\n1024K 请求轨迹详情\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig4_HTML.jpg](img/468166_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n512K 请求轨迹详情\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig3_HTML.jpg](img/468166_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n1K 请求轨迹详情\n\n从转折点，您还可以推测缓存簇/段的大小。例如，SSHD 在 WCD 期间写入的簇大小约为 64K，而 CMR A\
  \ 约为 256KB。SSHD 在 WCE 时最多使用 60MB DRAM 空间作为写入缓存，而在 WCD 时仅使用约 8MB，包含约 100 个段。\n\n\n\
  \n### 访问隔离\n\n在前一章中，您已经了解到 SPC-1C 有大量的本地访问。这一特性使得某些数据可以被缓存到 DRAM 或 SSD 中，并在之后被快速访问成为可能。那么第二个问题是：“实际上有多少访问是直接指向\
  \ DRAM 或 SSD 的？”这通常是一项困难的任务。然而，由于 DRAM、SSD 和 HDD 的访问时间差异显著，您可以粗略地将可能的命令隔离到不同的位置。基本思路是观察不同访问的行为，然后应用数据分类和模式识别方法来发现访问模式，并进行重复的随机读取测试，最终找到转折点。虽然流程与之前的案例类似，但在本例中，您需要更改发送到\
  \ SSHD 的请求数量：\n\n1. 向 SSHD 发送 100/200/256/257 等数量的 8K 请求，每个数量重复 20-100 次，并根据访问模式调整要发送的命令数量。\n\
  \n2. 假设转折点为 `X`。向 SSHD 发送 `X` 个大小为 16K、32K、……、1024K 的随机读取命令，并根据转折点找出簇大小。\n\n为了验证重复次数是否足够高，请检查响应时间的稳定状态。图\
  \ 6-6 提供了一个运行了 100 轮的示例。您可以看到，从第三轮开始，响应时间的平均值和标准差几乎保持不变。因此，在这种情况下，重复 10 次应该就足够了。\n\
  \n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig6_HTML.jpg](img/468166_1_En_6_Fig6_HTML.jpg)\n\
  \n**图 6-6**  \n响应时间的稳定状态\n\n图 6-7 展示了一个案例，其中向 SSHD 发送了 100 个 8KB 大小的随机读取请求，重复了 20\
  \ 次。在第一轮中，所有读取都指向介质。经过几轮后，读取请求变得“热”起来，并最终全部缓存在 DRAM 中。缓慢增加请求数量，以检查 DRAM 读取缓存能够容纳多少个请求。\n\
  \n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig7_HTML.jpg](img/468166_1_En_6_Fig7_HTML.jpg)\n\
  \n**图 6-7**  \n100 个 8K 随机读取，重复 20 次\n\n图 6-8 展示了 250 个请求重复执行的结果。您可以看到 DRAM 缓存完全可以容纳至少\
  \ 250 个段。然而，当您将其略微增加到 257 时，降级写入（destage）就开始了。当进一步增加到 260 时，DRAM 到 SSD 的降级写入会以相对较高的速度明显发生，如图\
  \ 6-9 所示。降级写入具有一定的自适应步骤，因此当数据的命中次数（访问频率）增加时，降级写入变得更加频繁。\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig9_HTML.jpg](img/468166_1_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9**  \n260 个 8K 随机读取，重复 100 次\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig8_HTML.jpg](img/468166_1_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8**  \n250 个 8K 随机读取，重复 100 次\n\n因此，您可能会猜测 256 可能是最大的读取段数量，因为只要不超过这个最大段数，就不会发生降级写入。请注意，您可以通过不同的时间间隔和大小来发现降级写入模式。\n\
  \n这里我留下一个关于设备上请求访问识别的问题。请看图 6-10，其中向 SSHD 发送了 260 个 8KB 读取请求，重复了 100 次。由于数量超过了 DRAM\
  \ 的容量，一些请求将指向 SSD。图中显示了第 1、3、14、20 和 50 次运行的响应时间。您可以看到，第一次运行时所有请求都指向了磁盘。从第二轮开始，一些请求指向了\
  \ DRAM，一些指向了介质。在第 20 轮中，指向 DRAM、SSD 和介质的访问都存在。然而，在大约 50 轮时，大多数请求都指向了 DRAM 和 SSD。事实上，您可以看到这些读取请求的响应时间存在明显的差距。基本上，您可以认为那些低于\
  \ 0.1ms 的是 DRAM 访问，而高于 0.2ms 的大部分来自 SSD。现在，您可以获得 SSD 和 DRAM 响应时间的统计值（在估算意义上），如表\
  \ 6-4 所示。\n\n**表 6-4**  \n响应时间统计（基于第 40-90 轮）\n\n| 260 | 平均值 | CCT | qCCT | TtoD\
  \ |\n| --- | --- | --- | --- | --- |\n| 总体 | 均值 | 0.227 | 0.227 | 0.212 |\n|   |\
  \ 标准差 | 0.096 | 0.096 | 0.096 |\n| SSD | 均值 | 0.279 | 0.279 | 0.264 |\n|   | 标准差\
  \ | 0.031 | 0.031 | 0.032 |\n| DRAM | 均值 | 0.063 | 0.063 | 0.048 |\n|   | 标准差 |\
