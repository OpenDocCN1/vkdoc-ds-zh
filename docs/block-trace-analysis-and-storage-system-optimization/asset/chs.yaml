  \ 频繁的小空闲时间；短队列长度<br>5.8%的频繁 WUR 中，更新块（至少写入两次）仅占全部访问块的 1%和写入块的 2.9%，因此写入更新率非常小，写入放大率为\
  \ 103%（考虑到追踪持续时间短） |\n| 顺序读取到随机写入 | ROW 比率为 1.2，因此读取比率非常小，写入的数据不太可能被立即读回 |\n| 原地或非原地更新\
  \ | 更新率非常小；无需应用大容量 SSD/DRAM/AZR 缓存来提升性能（缓存中的写入更新） |\n\n\n\n### 写密集型负载\n\n该负载来自视频监控应用，在读写比、`LBA`分布、大小分布、写更新比等多个方面与之前的负载存在显著差异。因此，对于不同场景下的不同供应商，即使采用相同的存储结构，实际工作负载也可能大相径庭。\n\
  \n图 7-9 展示了`LBA`分布，其中仅有一个跨越 30GB 的主区域，用于对接近`LBA`起始位置的读写操作（因为该负载是在`RAID`几乎为空时收集的）。如果进一步观察`LBA`与时间的关系图，可以发现写请求比读请求更具顺序性。图\
  \ 7-10 表明，写和读具有相似的大小分布，以 8 块请求为主，且 8-128 块分布的形态接近。此外，大小分布范围远大于之前的负载。\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig10_HTML.jpg](img/468166_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10  \n`RAID`负载 2 的大小分布\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig9_HTML.jpg](img/468166_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9  \n`RAID`负载 2 的`LBA`分布\n\n由于这是写密集型负载，我们应更关注写更新。图 7-11 展示了写请求的堆栈距离。这证实了定时写更新，即较小的重叠大小（可能由于数据块附带了元数据块）。从图\
  \ 7-12 可以看出，基于`IOPS`，堆栈距离 250 大约相当于 2.1 秒。在此期间，在总体 52%的写命令命中中，接近 60%为全写命中，60%为部分写命中。这意味着某些部分在持续更新。因此，磁盘或系统可能需要一个随机访问区域或`NVM`来处理这一小部分更新数据。\n\
  \n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig12_HTML.jpg](img/468166_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12  \n`RAID`负载 2 的堆栈更新\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig11_HTML.jpg](img/468166_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11  \n`RAID`负载 2 的写堆栈距离\n\n总之，数十个混合流导致了一种非完全顺序的`IO`模式，这表明需要一个带有长队列的合适流检测算法。特殊的元数据和奇偶校验结构导致了相对较高的`LBA`更新大小和较大的更新命令比例，这意味着可能需要大容量的`DRAM`/`NVM`/`RAZ`缓存来避免频繁更新。此外，可以得出结论，在之前读密集型的负载中，写缓存的影响非常有限。注意频繁的小空闲但低效的空闲间隔，这表明可能需要调整`GC`策略以适应这种情况。\n\
  \n对`SMR`驱动器的影响总结于表 7-5。本质上，由于相对较高的更新比例，对正常写访问的影响不容忽视。高更新命令比例可能导致相对较高的碎片整理需求。监控系统的元数据管理方案和/或`SMR`驱动器可能需要进行更改。由于有效的空闲间隔微乎其微，驱动器可能没有足够的空闲时间用于受`GC`策略约束的后台`GC`。\n\
  \n表 7-5  \n负载 2 相对于`SMR`的主要特征\n\n| `SMR`特征 | Hadoop 观察结果 |\n| --- | --- |\n| 顺序写入\
  \ | 大尺寸写请求（>=128 块）：35% 模式比例：当`Q=1`（`Q=128`）时，写操作为 18%（27%） 顺序命令比例（`M>=2`）：在`QL=1`时为写\
  \ 35%，在`Q=256`时为 60% |\n| 一次写入多次读取 | `R/W`：命令比 1:1.5；块比 1:6.1 高堆叠`ROW`比例 总写入块占全部访问块的\
  \ 85.9% |\n| 垃圾回收（`GC`） | 更新块（至少写入两次）占写入块的 13.4%，因此写更新比例和写放大率相对较高，为 115.5%（考虑到负载持续时间较短）\
  \ 更新命令比例>50%，重叠较小，可能由于附带的元数据 主机端频繁但小尺寸的空闲时间不利于后台`GC` |\n| 原地更新或异地更新 | 更新比例相对较高，因此有必要应用大容量`SSD`/`DRAM`/`AZR`缓存来提升性能（在缓存中进行写更新）\
  \ |\n\n此负载比之前的负载繁忙得多。总有效空闲时间（`空闲间隔 > 0.1 秒`）为 14.40 秒，总空闲时间为 98.6 秒。总有效空闲频率（`空闲间隔\
  \ > 0.1 秒`）仅为 33 次，而总空闲频率为 6244 次。现在的问题是，（有效）空闲时间是否足以进行后台活动。由于视频监控工作负载以及数据/元数据结构的相对一致性，每个`SMR`数据区域的垃圾比例相似。假设区域大小为\
  \ 1GB，每磁道 3MB。此负载的总写入工作负载约为 1GB。那么，是否有可能在有效空闲时间内将 1GB 数据迁移到新位置？分析如下：\n\n- 完成顺序读取\
  \ 1GB 和顺序写入 887MB（假设垃圾比例为 13.4%）对于 7200RPM 的磁盘大约需要 5.3 秒。\n- `GC`的平均有效空闲时间为`14.4/33\
  \ − 0.1 = 0.34`秒。假设`R/W`的定位时间为 6ms。`（0.34 − 0.006 * 2）`秒可以在`GC`区域内处理多达 64.4MB 的数据。^(⁶⁹)\
  \ 总共 33 个空闲间隔可以处理约 2GB 数据，大于 1GB。\n- 此外，旧视频数据会定期被新数据替换，这通常不会显著改变垃圾比例。\n\n理想情况下，空闲时间似乎足以处理`GC`活动，前提是：\n\
  \n- 有效空闲时间应被充分利用，并且`GC`大小动态调整。\n- 空闲时间算法在较低的空闲检测阈值下运行良好，例如从 100ms 降至 50ms，以增加`GC`活动。\n\
  - 其他后台活动不会占用太多时间。\n\n然而，在现实中，可能需要大得多的空闲时间。特别是，碎片整理可能会显著增加写放大比例。\n\n脚注 1\n\n\n\n"
- '# 8. 案例研究：Hadoop


  Hadoop 是全球最流行的分布式大数据平台之一。除了计算能力，其存储子系统的性能也是影响整体表现的关键因素。特别是，MapReduce 过程中存在大量的中间文件交换。本章通过考虑一些特定指标，展示了
  Hadoop 集群的块级工作负载特征。所呈现的分析技术可以帮助您理解 Hadoop 在生产环境中的性能和驱动特性。此外，本章还探讨了 SMR 驱动器是否适用于
  Hadoop 工作负载。


  大型系统的用户必须应对爆炸式增长的数据生成，这些数据通常来自多种不同的来源和格式。从这些通常是非结构化的海量数据中观察和提取潜在价值，给数据存储、管理和处理带来了巨大挑战，同时也带来了机遇。从数据存储的角度来看，预计容量（字节）将大幅增长，尽管
  SSD 和 NVM 也广泛用于对时间敏感的场景（性能工作负载），但在可预见的未来，HDD 仍将提供大部分容量工作负载。必须充分理解 HDD 与这些容量工作负载的交互方式，以便优化这些设备的算法。


  从数据管理和处理的角度来看，大数据已成为一种流行技术，而 Hadoop 则成为领先的解决方案。开源 Hadoop 源自谷歌的 GFS 和 MapReduce 框架，因其高可用性、可扩展性和良好的规模经济性而广受欢迎。在许多案例中，Hadoop
  在批处理 MapReduce 任务上的性能已得到验证 [66, 67]，尽管在 Hadoop 框架体系内的其他应用仍在探索之中。


  为了最好地理解 Hadoop 的性能，一种常见的方法是工作负载分析 [66, 67, 68, 69, 70]。可以在不同的抽象级别收集和查看工作负载。参考文献
  [37, 35] 提出了三种分类：功能级、系统级和物理级（参见第 2 章的图 2-1）。然而，该领域的大多数工作负载分析研究都是从系统视角进行的。


  Kavulya 等人 [71] 分析了来自 Yahoo! M45 集群的 10 个月 MapReduce 日志，应用学习技术从历史数据预测作业完成时间，并识别出其数据集中的潜在性能问题。Abda
  等人 [72] 分析了来自 Yahoo! 两个大型 Hadoop 集群的六个月跟踪数据，描述了工作负载的文件流行度、时间局部性和到达模式，而 Ren 等人 [66]
  则对淘宝电子商务生产环境中 2000 多个节点的 MapReduce 工作负载进行了分析。Wang 等人 [67] 评估了 Hadoop 作业调度器，量化了共享存储对
  Hadoop 系统性能的影响，并据此综合了真实的云工作负载。Shafer 等人 [70] 调查了性能瓶颈的根本原因，以评估 Hadoop 中通过不同工作负载在可移植性和性能之间的权衡。Ren
  等人 [73] 分析了三个不同的 Hadoop 集群，以探索应用模式和用户行为中的新问题，并理解与 IO 和负载均衡相关的关键性能挑战。此外，还有许多其他值得注意的例子
  [69, 68, 37]。


  虽然主要侧重于系统层面，但一些工作提供了功能视图 [69, 70, 73]，讨论了来自历史 Web 日志的平均流量。还提出了一些模拟器和合成工作负载生成器，例如
  Ankus [66]、MRPerf [74] 及其增强版 [67]。


  然而，据我所知，目前还没有针对 Hadoop 系统在块级别的直接分析工作。块级分析是及时的，并且现在更有价值，因为设备制造商面临着开发/改进产品以满足容量或性能需求的压力，例如新兴的混合或叠瓦式磁记录（SMR）驱动器
  [5, 40, 4]。当考虑数据密度远高于传统驱动器的 SMR 驱动器（以及即将到来的能量/热辅助磁记录（EAMR/HAMR）驱动器）时，由于它们与传统驱动器具有显著不同的特性，这种分析是必不可少的。例如，SMR
  驱动器引入了叠瓦式磁道等特性，这使得设备更倾向于顺序写入而非随机写入，同时还引入了间接块地址映射、垃圾回收等机制，这些都改变了这些设备与用户工作负载的交互方式。设备层面的一个大问题是：块级
  Hadoop 工作负载是否适用于 SMR 驱动器。


  在本章中，我将在块设备级别分析 Hadoop 工作负载，并回答这个重大问题。借助 `blktrace`，我清晰地展示了 Hadoop 在存储设备中的行为 [75,
  76]。主要贡献体现在以下几个方面：


  -   定义了一些新的块级工作负载指标，例如堆叠写入更新、堆叠 ROW 和排队寻道距离，以满足磁盘特性的特定要求

  -   识别了一个大型组织内部 Hadoop 集群的一些特征，并将其与其他已发表的 Hadoop 集群的发现进行关联，指出异同点

  -   提供了一些关于从驱动器层面支持来提升 Hadoop 性能的建议

  -   分析了 SMR 驱动器在 Hadoop 工作负载中的适用性


  本章将首先介绍 SMR 驱动器、Hadoop 集群以及跟踪收集过程的整体背景。然后，将介绍基于这些指标的分析结果。




  ## Hadoop 集群


  从用户视角到系统/框架层面的分析，已有大量针对不同层级的工作负载研究。这些分析大多仅能捕捉系统的某些特征。Harter 等人更进一步，从系统视角获取追踪数据，并应用简单模拟器来提供工作负载的物理视图[77]。然而，将系统的物理视图完全交由模拟处理，可能会遗漏对理解工作负载至关重要的细节。因此，在考虑性能时，分析真实工作负载通常更为合理。


  Hadoop 集群的工作流程是将来自全球制造工厂的大型非结构化数据集导入`HDFS`。数据导入后，经过处理，再通过`MapReduce`应用组织成更结构化的数据。最后，这些数据被提供给`HBase`，用于对先前非结构化数据进行实时分析。部分结构化数据会保留在`HDFS`上（或移至其他存储位置），而非结构化数据则每日删除，为接收新的制造数据做准备。


  该 Hadoop 集群用于存储制造信息，例如公司每年产生的 2 亿台设备的数据。以第一阶段制造（洁净室组装）为例，在组装驱动器组件时，每个驱动器的每个构建步骤都会由各种传感器捕获数据。从制造角度来看，每季度生产
  5000 万至 6000 万台设备会产生 PB 级的信息，这些信息必须在组织内收集、存储并分发，以满足不同需求。一些用户场景包括查询特定型号、汇总某批次的质量、计算某型号的平均介质密度等。


  `PIG`/`Hive`被间接用于`MapReduce`，实际上`PIG`/`Hive`会将类似 SQL 的代码转换为 Java 代码来运行`MapReduce`。然后，`MapReduce`执行类似
  SQL 的语句来处理原始测试数据，为产品工程研发和故障分析生成下钻数据和仪表盘。不过，该集群主要用于分析：`MapReduce`用例约占 80%，此外还有部分`Hbase`在线搜索用例（约
  20%）。


