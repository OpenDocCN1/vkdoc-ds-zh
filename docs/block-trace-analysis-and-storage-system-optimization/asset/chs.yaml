- '# 跟踪收集


  跟踪质量是分析的基本要求之一。低质量的跟踪可能导致复杂且错误的跟踪分析结论。跟踪质量存在两个主要问题。一个是时间漂移，即实际事件到达时间早于收集到的到达时间。另一个是事件丢失，例如工具无法捕获所有必需的事件。因此，应使用适当的工具来保证跟踪的正确性。本章将介绍软件工具和硬件设备。




  '
- '# 采集技术


  目前已提出多种技术来监控和捕获系统或组件的踪迹。通常有以下四种技术：


  - **基于硬件的监控**需要对测试平台硬件进行改造，以便在程序执行时创建所有指令和/或数据地址的记录。

  - **基于软件的追踪**可以在一定程度上实现与硬件类似的目标，但并非修改系统硬件，而是修改或插入软件。

  - **基于模拟的追踪**在宿主机与待评估操作系统之间构建一个抽象层，例如`QEMU`^(³⁶)和`SimOS`^(³⁷)。该抽象层仅模拟足以让操作系统正常运行所需的组件。虽然该系统为采集依赖于操作系统的踪迹提供了灵活的接口，但所捕获踪迹的准确性有时存疑。由于执行了模拟，程序的执行会受到干扰。

  - **基于微码的追踪**利用微码修改来捕获踪迹信息，引入的开销极小，例如`PALcode`（特权架构库代码）^(³⁸)。


  然而，由于复杂度过高且准确性存疑，第三和第四种技术并不常用。因此，本章仅讨论基于硬件和基于软件的技术。


  ## 硬件踪迹采集


  我们将硬件方法定义为使用特定硬件设备/系统来捕获目标存储设备之外的输入输出（IO）的踪迹采集方法，尽管可能仍需要一些软件来管理这些踪迹[38, 45]。有多种类型的硬件可用于采集块级踪迹。最常见的设备之一是总线分析仪，但其应用范围并不局限于磁盘驱动器的块级输入输出，还可用于网络流量、DDR/CPU
  缓存/停顿/延迟/吞吐量等。一些产品能够捕获相当准确的踪迹，例如来自 Viavi solutions 的`Xgig 6G SAS/SATA 分析仪`、来自 SerialTek
  的`BusXpert Micro II 系列 SAS/SATA 分析仪`、来自 TI 的`Trace and analyzer`、来自 LeCroy 的`协议分析仪`、来自
  Arium 的`Eumulator XL-100`以及来自 Green Hills Software 的`SuperTrace Probe`。


  总线分析仪通常为用户提供多种通信接口。以图 3-1 中的设备为例，它们提供 USB、以太网、SCSI 等接口。这些设备通常通过多种机制实现可靠且准确的连接，具有比基于软件的工具更高的分辨率（例如时间精度和捕获频率），并能捕获更多信息。


