  trans: '

    # Hadoop 集群


    从用户视角到系统/框架层面的分析，已有大量针对不同层级的工作负载研究。这些分析大多仅能捕捉系统的某些特征。Harter 等人更进一步，从系统视角获取追踪数据，并应用简单模拟器来提供工作负载的物理视图[77]。然而，将系统的物理视图完全交由模拟处理，可能会遗漏对理解工作负载至关重要的细节。因此，在考虑性能时，分析真实工作负载通常更为合理。


    Hadoop 集群的工作流程是将来自全球制造工厂的大型非结构化数据集导入`HDFS`。数据导入后，经过处理，再通过`MapReduce`应用组织成更结构化的数据。最后，这些数据被提供给`HBase`，用于对先前非结构化数据进行实时分析。部分结构化数据会保留在`HDFS`上（或移至其他存储位置），而非结构化数据则每日删除，为接收新的制造数据做准备。


    该 Hadoop 集群用于存储制造信息，例如公司每年产生的 2 亿台设备的数据。以第一阶段制造（洁净室组装）为例，在组装驱动器组件时，每个驱动器的每个构建步骤都会由各种传感器捕获数据。从制造角度来看，每季度生产
    5000 万至 6000 万台设备会产生 PB 级的信息，这些信息必须在组织内收集、存储并分发，以满足不同需求。一些用户场景包括查询特定型号、汇总某批次的质量、计算某型号的平均介质密度等。


    `PIG`/`Hive`被间接用于`MapReduce`，实际上`PIG`/`Hive`会将类似 SQL 的代码转换为 Java 代码来运行`MapReduce`。然后，`MapReduce`执行类似
    SQL 的语句来处理原始测试数据，为产品工程研发和故障分析生成下钻数据和仪表盘。不过，该集群主要用于分析：`MapReduce`用例约占 80%，此外还有部分`Hbase`在线搜索用例（约
    20%）。


    WD 集群配置如表 8-1 所示。通用数据流如图 8-1 所示，其中`HDFS`具有原生的可配置日志结构，而`datanode`需要借助`blktrace`。客户端从`namenode`获取元数据信息的读取请求，随后`namenode`向设备发送块操作指令。因此，客户端从`datanodes`获取相应数据。写入请求会同时更改`datanodes`中的数据以及`namenodes`中的元数据。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig1_HTML.jpg](img/468166_1_En_8_Fig1_HTML.jpg)


    图 8-1


    Hadoop 系统中的数据流


    表 8-1


    WD-HDP1 集群配置


    | WD-HDP1：100 台服务器 |

    | --- |

    | CPU | Intel Xeon E3-1240v2，4 核 |

    | 内存 | 32 GB DDR3 |

    | 操作系统硬盘 | WDC WD3000BLFS 10kRPM 300GB |

    | Hadoop 硬盘 | WDC WD2000FYYX 7.2kRPM 2-4TB |

    | Hadoop 版本 | 1.2.x |


    数据收集结构如图 8-2 所示。任务跟踪器运行在本地文件系统之上。作业最终会转换为对每个`datanode`中本地设备的块级访问。工具`blktrace`实际上是从本地设备的块
    IO 层收集数据（详见附录 B）。我在四个`datanode`上反复运行`blktrace`（有时结合`iostat`和/或`iotop`），这些节点具有不同的文件系统和写入缓存设置，共进行了数十批次的测试。其中两个节点使用`XFS`作为本地文件系统，另外两个使用`EXT4`。每次运行持续数小时到数天不等。我收集了数百
    GB 的追踪数据（100 多个片段），代表了从 2014 年 5 月到 2015 年 1 月总计 1500 多小时的集群运行时间^(⁷⁰)。我通过开关写入缓存来收集不同情况下的数据。根据
    Ganglia 的网络输入/输出指标，除少数片段外，这四个节点的工作负载相对稳定。特别地，本书重点关注 2015 年 1 月收集的、批次 ID 为 16 至
    25 的追踪数据。这些均为持续一天的追踪数据，其设置如表 8-2 所示。


    表 8-2


    文件系统与写入缓存设置


    | 节点 ID | 文件系统 | 写入缓存 |

    | --- | --- | --- |

    | 147 | XFS | 16:21 禁用；22:25 启用 |

    | 148 | EXT4 | 16:21 禁用；22:25 启用 |

    | 149 | EXT4 | 16:21 启用；22:25 禁用 |

    | 150 | XFS | 16:21 启用；22:25 禁用 |


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig2_HTML.jpg](img/468166_1_En_8_Fig2_HTML.jpg)


    图 8-2


    使用 Ganglia 和 Blktrace 进行追踪数据收集


    ## 工作负载指标评估


    在本节中，我将讨论从 Hadoop 集群内部分节点样本中观察到的磁盘活动情况。然后，我将解释这些观察结果与上一节讨论的指标之间的关系。最后，我将总结从系统层面得出的观察结果，并就如何解决根据我的记录观察可能出现的性能问题提出建议。


    ### 块级分析


    存在一些用于解析和分析原始块追踪数据的工具。例如，`seekwatcher` [78] 可根据`blktrace`运行结果生成图表，帮助可视化 IO 模式和性能。`Iowatcher`
    [79] 可将`blktrace`运行结果绘制成图表。然而，这些工具无法捕获第 2 章中定义的高级指标。因此，你可以应用之前介绍的基于 Matlab 的工具来获取这些高级属性。

    '
- fmt: '### General View


    Figure [8-3](#468166_1_En_8_Chapter.xhtml#Fig3) shows some average values of request
    size, IOPS, and throughput. From the figure, you can observe that the write size
    and IOPS are more related to file system type, as the difference between EXT4
    and XFS is obvious. However, the read size and IOPS seem to be more related to
    batch, as different batches may have different read sizes. Note that the overall
    throughput is similar for each batch, which means the workload to each node is
    nearly even.^([^(71)](#fn71)) By removing the maximum and minimum values, you
    can look at the average value and standard derivatives in Figure [8-4](#468166_1_En_8_Chapter.xhtml#Fig4).
    The size pattern for write for different file system types is clearly illustrated.
    Figure [8-5](#468166_1_En_8_Chapter.xhtml#Fig5) further shows that the write requests’
    major size range is [1–127] blocks and 1024 blocks. The sum of ratios in the two
    ranges is almost equal to 1, which leads to the near symmetric curve around 0.475.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig5_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Write request size distribution in different range


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig4_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig4_HTML.png)


    Figure 8-4


    Average size and IOPS


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig3_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Average values of workloads for different file systems


    In order to get more insight views into the trace, let’s choose a typical piece
    of a trace (Node 148 and batch 21) with its basic IO properties close to the average
    value described earlier. Table [8-4](#468166_1_En_8_Chapter.xhtml#Tab4) gives
    the basic information about the workload. Next, I discuss this trace deeply in
    several aspects, which are summarized in Table [8-3](#468166_1_En_8_Chapter.xhtml#Tab3).


    Table 8-4


    Basic Statistics of Trace 148-21 (EXT4-WCD)


    | | Combined | Read | Write |

    | --- | --- | --- | --- |

    | Number of blocks | 917942 | 373424 | 544518 |

    | Average size (block) | 435.7 | 216.5 | 586.0 |

    | Read IOPS (r/s) | 4.322 |

    | Write IOPS (w/s) | 6.302 |

    | Blocks read per second | 935.802 |

    | Blocks written per second | 3693.157 |


    Table 8-3


    Summary of Observations and Implications


    | SMR characteristics | Hadoop observation |

    | --- | --- |

    | **Write once read many** | 40% read and 60% writeRelatively low write update
    ratio35.4% stacked ROW ratio |

    | **Sequential read to random write** | Relatively small random write ratioROW
    ratio ~60% and small size, so insignificant impact |

    | **Out-of-place update** | Stacked WOW: 70% within first 10 minutesUsefulness
    of large-size SSD/DRAM/AZR cache to performance improvement (write update in cache)
    |

    | **Sequential write** | Large size write requests (`S >=`1024 blocks) > 64%Mode
    ratio: write 65% and read 70%Sequential ratio (`S >=`1024): write 74% (66%) and
    read 82% (7%);Near sequential ratio (`S >=`1024): write 87% (65%) and read 95%
    (85%) |

    | **Garbage collection (GC)** | Frequent small idle time and large idle time periodicallyLow
    device utilizationRelatively short queue lengthRelatively low write update ratio116.3%
    frequented WOW small write amplification8.5% write update cmds small rewritten
    ratioThe dominant partial WOW hits are mainly large-size requests, while full
    hits at small-size requests |


    ### Size and LBA Distribution


    The overall request LBA distribution is shown in Figure [8-6a](#468166_1_En_8_Chapter.xhtml#Fig6).
    Figure [8-6b](#468166_1_En_8_Chapter.xhtml#Fig6) further illustrates the size
    distribution curve, from which you can see that minimum requests are 8 blocks
    while the maximum size is 1024 blocks. For write requests, the total ratio of
    8-block and 1024-block requests is almost 90%. The ratio of large size write requests
    (>=1024 blocks) is greater than 55%, so write requests are more sequential. For
    reads, the ratio of requests with size <=256 is around 50%, and the size distribution
    is more various. Thus, the read request is generally more random than the write
    requests. The LBA vs. size distribution figures further confirm this observation.
    In fact, for writes, you can see that most large size requests lie intensively
    in few ranges; middle size requests are very few, while for reads, the size distribution
    is more diverse.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig6_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    LBA and size distribution


    These findings provide a different view from the “common sense” of sequential
    access for Hadoop system [70]. It is true that sequential reads and writes are
    generated at the HDFS level for large-size files (the settings for chunk size
    is 128MB), so large-size files are split into 128MB blocks and then stored into
    the HDFS, and the minimum access unit is therefore 128MB generally. However, when
    these accesses interact with local file systems such as EXT4 and XFS, the situation
    becomes much more complex.


    ### IOPS and Throughput


    The average value of these two metrics depends on the statistical time window/interval.
    As an example, burstiness is very commonly observed in this trace, which leads
    to relatively rigid curves and high maximum IOPS for small time intervals, and
    a relatively smooth curve with low maximum IOPS for a large time interval. The
    IOPS for reads are generally higher than that of writes; however, the throughput
    of reads is generally lower than that of writes. In comparing the 600-second interval
    average with the 6-second interval average shown in Figure [8-7](#468166_1_En_8_Chapter.xhtml#Fig7),
    the average value has a large difference. Note that the read IOPS in the 6-second
    interval figure are higher than 400, which is not an “error.” The reason is due
    to the near sequential behavior described earlier. To verify the tool, I compared
    the parsed curve with the one collected by `iostat` and `iotop`, and obtained
    a consistent result.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig7_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig7_HTML.png)


    Figure 8-7


    IOPS and throughput


    ### Utilization and Queue Depth


    Both device workload (average 15%) and CPU workload (average 20%) are low. The
    average queue depth of the HDD (average value `<`0.3) further shows the low device
    utilization of this workload. As the overall workload is generally low, and the
    “periodic” bottom-peak curve is illustrative, the system therefore can exploit
    idle time to get the most potential benefits (such as garbage collection and defragmentation
    for space efficiency, or even block reorganization) for performance improvements.
    However, most idle time is not long enough for large background jobs. How to fully
    utilize these idle times is an interesting topic for future exploration.'
