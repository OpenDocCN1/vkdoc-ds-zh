    You may also analyze the relationship between post-read and sequential stream
    by counting 1) the stream numbers (`c`) and the ratio `c`[1] = `c`/total read
    numbers; 2) each streams hit frequency `c`[2]; 3) the cache hit as `b`[2] (only
    consider post read, redefine `b`[2]). This test can help to check if the infinity
    sequence read takes effect, such as only when the sequence length is long enough,
    the cache enters into infinity mode. In infinity mode, post-read is automatic.
    However, if it is not in infinity mode, you still need to consider the benefit
    of the post-read, after detecting a two-command sequential stream, like the possibility
    of three or more commands attached to the stream.


    You can further find the relation between prefetch and hole filling by defining:


    *   **Gain:** The additional cache hit obtained (`d`[2]) = the cache hit ratio
    at fetch length x and hole length y (`d`[3]) - the cache hit ratio without prefetch
    and hole filling (`d`[0])

    *   **Loss:** The additional commands occurs / the total read command (`d`[1])

    *   **Gain-loss-ratio** `d` = `d`[2]`/d`[1]: The higher, the better


    Two comparison methods are conducted here:


    *   Two queues, one for prefetch (`Q`[1]) and other for hole filling (`Q`[2]),
    both under LRU. Consider the overlapped hit ratio, i.e., if a command hits in
    `Q`[1], it also hits in `Q`[2] and vice versa.

    *   Two queues, one for prefetch (`Q`[1]) and other for hole filling + prefetch
    (`Q`[3]); both under LRU. Consider the additional hit ratio of `Q`[3] over `Q`[1].


    Define `x`[0] as the hit number without prefetch and hole filling policies, `x`¯[1]
    = `x`[1] + `x`[0] as the hit with prefetch, `x`¯[2] = `x`[2] + `x`[0] as the hit
    due to hole filling, and `x`¯[3] as the hit due to combined prefetch and hole
    filling. Now if `x`[0] is much larger than `x`[1] and `x`[2], it shows that there
    is not much difference between prefetch and hole filling; otherwise, check the
    difference between `x`[1] and `x`[2]. If `x`[1] is much larger than `x`[2], it
    shows that the benefit of fetch is much larger than hole filling; otherwise, it
    is reasonable to do hole filling instead of prefetch. If `x`[3] − `x`[0] is much
    larger than `x`[1], it indicates that the hole filling gained benefits from refetch;
    otherwise, prefetch is not beneficial.'
