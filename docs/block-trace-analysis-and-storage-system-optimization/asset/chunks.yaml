    Next, let’s consider the gain and loss for the prefetch policy. Let’s define the
    terms:


    *   **Prefetch:** Includes post-read and pre-read. Post-read means an additional
    size is attached to the last LBA; pre-read means an additional size is attached
    to the first LBA. For example, assume that the original command is to read LBA
    10-20 and the pre-read size is 8. Then the extended command is to read LBA 2-20.

    *   **Gain:** The additional cache hit obtained (`b`2) = the cache hit ratio at
    fetch length x (`b`3) - the cache hit ratio without prefetch (`b`0)

    *   **Loss:** The prefetch commands occurs / the total read command (`b`1)

    *   **Gain-loss-ratio** `b` = `b`[2]`/b`[1]: The higher, the better


