    # 6. Case Study: Modern Disks


    Modern disks implement many different features, such as media-based cache (e.g.,
    using a portion of disk space to log some random write accesses), DRAM protection
    (e.g., using a small-size NVM to temporarily store some data in DRAM cache during
    a power loss such that write-cache can be always enabled), hybrid structure (e.g.,
    migrating hot data to high-speed devices and cold data to low-speed devices so
    that the overall access time is reduced), etc. A hybrid disk (e.g., SSHD), one
    of the hybrid structures, has advantages in some scenarios where data hotness
    is significant. Some emerging and future techniques like SMR, HAMR, and BPR favor
    sequential access in order to diminish garbage collection, reduce energy consumption,
    and/or improve the device life. This chapter shows how trace analysis can help
    to identify these mechanisms via workload property analysis using two examples:
    SSHD and SMR drives.


    ## SSHD


    In this section, let’s explore the mystery behind SSHD’s performance enhancement
    in SPC-1C [53] under WCD: SSD/DRAM cache and the self-learning algorithm [56,
    57, 16]. I collected data from the XGIG bus analyzer and monitored the response
    from LeCroy Scope, with a workload generated by the SPC-1C tool. Some techniques,
    such as pattern recognition, curve fitting, and queue theory, are applied for
    analysis.


    From Figure [6-1](#468166_1_En_6_Chapter.xhtml#Fig1), you can see that the IOPS
    jumps to two times the traditional HDDs for WCD, so the IOPS of SSHD is around
    570, while the traditional HDDs (two models: one is Savvio from Seagate, and the
    other is Sirius from WD) can only reach around 200 IOPS when the response time
    is less than or equal to 30ms. The task here is to find the reasons for the performance
    improvement of hybrid structure via trace analysis. The basic idea is to compare
    several drives with a certain level of similarity: to inject the same workloads
    to the similar drives, isolate the similarity, and compare the differences. For
    example, similar CMR models are selected in Table [6-1](#468166_1_En_6_Chapter.xhtml#Tab1).


    **Table 6-1** Similar Models Chosen for Comparison


    | | SSHD | CMR A | CMR B | CMR C |

    | --- | --- | --- | --- | --- |

    | Capacity (GB) | 600 | 900 | 600 | 900 |

    | RPM | 10.5K | 10.5K | 10K | 10.5K |

    | Bytes per sector | 512, 520, 524, 528 | 512 | 512 | 512 |

    | Discs | 2 | 3 | 2 | 3 |

    | Average latency (ms) | 2.9 | 2.9 | 3 | 2.9 |

    | DRAM cache | 128MB | 64MB | 32MB | 64MB |

    | NAND | 16GB eMLC | None | None | None |

    | Interface | 6Gbps SAS | 6Gb/s SAS | 6Gb/s SAS | 6Gb/s SAS |


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig1_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig1_HTML.jpg)


    **Figure 6-1** SSHD performance comparison with traditional HDDs


    You know from the previous chapter that the write (random) access dominates the
    IO requests in SPC-1C, which means the write cache actually plays an important
    role. However, write cache is supposed to be disabled for WCD. Is it true for
    this SSHD? To verify it, you can do a simple test by injecting random write requests
    to SSHD and calculating the CCT/qCCT/TtoD time. If write cache is actually disabled,
    all requests will be written to media directly, which cost roughly 10ms response
    time. However, from the trace, you can observe that there are many requests with
    response times of less than 1ms at the beginning. Therefore, write cache actually
    is active even for the WCD setting. This benefits from the technique of NAND-backed
    DRAM cache protection, so part of cached data can be written to NAND just after
    system power loses.


    Now let’s start some analysis for two essential problems: the cache size and access
    isolation.'
