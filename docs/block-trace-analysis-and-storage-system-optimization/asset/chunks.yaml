  trans: '

    # 8. 案例研究：Hadoop


    Hadoop 是全球最流行的分布式大数据平台之一。除了计算能力，其存储子系统的性能也是影响整体表现的关键因素。特别是，MapReduce 过程中存在大量的中间文件交换。本章通过考虑一些特定指标，展示了
    Hadoop 集群的块级工作负载特征。所呈现的分析技术可以帮助您理解 Hadoop 在生产环境中的性能和驱动特性。此外，本章还探讨了 SMR 驱动器是否适用于
    Hadoop 工作负载。


    大型系统的用户必须应对爆炸式增长的数据生成，这些数据通常来自多种不同的来源和格式。从这些通常是非结构化的海量数据中观察和提取潜在价值，给数据存储、管理和处理带来了巨大挑战，同时也带来了机遇。从数据存储的角度来看，预计容量（字节）将大幅增长，尽管
    SSD 和 NVM 也广泛用于对时间敏感的场景（性能工作负载），但在可预见的未来，HDD 仍将提供大部分容量工作负载。必须充分理解 HDD 与这些容量工作负载的交互方式，以便优化这些设备的算法。


    从数据管理和处理的角度来看，大数据已成为一种流行技术，而 Hadoop 则成为领先的解决方案。开源 Hadoop 源自谷歌的 GFS 和 MapReduce
    框架，因其高可用性、可扩展性和良好的规模经济性而广受欢迎。在许多案例中，Hadoop 在批处理 MapReduce 任务上的性能已得到验证 [66, 67]，尽管在
    Hadoop 框架体系内的其他应用仍在探索之中。


    为了最好地理解 Hadoop 的性能，一种常见的方法是工作负载分析 [66, 67, 68, 69, 70]。可以在不同的抽象级别收集和查看工作负载。参考文献
    [37, 35] 提出了三种分类：功能级、系统级和物理级（参见第 2 章的图 2-1）。然而，该领域的大多数工作负载分析研究都是从系统视角进行的。


    Kavulya 等人 [71] 分析了来自 Yahoo! M45 集群的 10 个月 MapReduce 日志，应用学习技术从历史数据预测作业完成时间，并识别出其数据集中的潜在性能问题。Abda
    等人 [72] 分析了来自 Yahoo! 两个大型 Hadoop 集群的六个月跟踪数据，描述了工作负载的文件流行度、时间局部性和到达模式，而 Ren 等人
    [66] 则对淘宝电子商务生产环境中 2000 多个节点的 MapReduce 工作负载进行了分析。Wang 等人 [67] 评估了 Hadoop 作业调度器，量化了共享存储对
    Hadoop 系统性能的影响，并据此综合了真实的云工作负载。Shafer 等人 [70] 调查了性能瓶颈的根本原因，以评估 Hadoop 中通过不同工作负载在可移植性和性能之间的权衡。Ren
    等人 [73] 分析了三个不同的 Hadoop 集群，以探索应用模式和用户行为中的新问题，并理解与 IO 和负载均衡相关的关键性能挑战。此外，还有许多其他值得注意的例子
    [69, 68, 37]。


    虽然主要侧重于系统层面，但一些工作提供了功能视图 [69, 70, 73]，讨论了来自历史 Web 日志的平均流量。还提出了一些模拟器和合成工作负载生成器，例如
    Ankus [66]、MRPerf [74] 及其增强版 [67]。


    然而，据我所知，目前还没有针对 Hadoop 系统在块级别的直接分析工作。块级分析是及时的，并且现在更有价值，因为设备制造商面临着开发/改进产品以满足容量或性能需求的压力，例如新兴的混合或叠瓦式磁记录（SMR）驱动器
    [5, 40, 4]。当考虑数据密度远高于传统驱动器的 SMR 驱动器（以及即将到来的能量/热辅助磁记录（EAMR/HAMR）驱动器）时，由于它们与传统驱动器具有显著不同的特性，这种分析是必不可少的。例如，SMR
    驱动器引入了叠瓦式磁道等特性，这使得设备更倾向于顺序写入而非随机写入，同时还引入了间接块地址映射、垃圾回收等机制，这些都改变了这些设备与用户工作负载的交互方式。设备层面的一个大问题是：块级
    Hadoop 工作负载是否适用于 SMR 驱动器。


    在本章中，我将在块设备级别分析 Hadoop 工作负载，并回答这个重大问题。借助 `blktrace`，我清晰地展示了 Hadoop 在存储设备中的行为 [75,
    76]。主要贡献体现在以下几个方面：


    -   定义了一些新的块级工作负载指标，例如堆叠写入更新、堆叠 ROW 和排队寻道距离，以满足磁盘特性的特定要求

    -   识别了一个大型组织内部 Hadoop 集群的一些特征，并将其与其他已发表的 Hadoop 集群的发现进行关联，指出异同点

    -   提供了一些关于从驱动器层面支持来提升 Hadoop 性能的建议

    -   分析了 SMR 驱动器在 Hadoop 工作负载中的适用性


    本章将首先介绍 SMR 驱动器、Hadoop 集群以及跟踪收集过程的整体背景。然后，将介绍基于这些指标的分析结果。

    '
- fmt: '# Hadoop Cluster


    Numerous workload studies have been conducted at various levels, from the user
    perspective to system/framework-level analysis. Most of these types of analysis
    only capture certain characteristics of the system. Harter et al. go as far as
    to take traces at a system view and apply a simple simulator to provide a physical
    view of the workload [77]. However, leaving the physical view of a system to simulation
    can miss details that may be critical to understanding a workload. Therefore,
    it is generally more reasonable to analyze the real workloads when considering
    performance.


    The workflow of a Hadoop cluster is to import large and unstructured datasets
    from global manufacturing facilities into the `HDFS`. Once imported, the data
    is crunched and then organized into more structured data via `MapReduce` applications.
    Finally, this data is given to `HBase` for real-time analysis of the once previously
    unstructured data. While some of this structured data is kept on the `HDFS` (or
    moved to another storage location), the unstructured data is deleted daily in
    preparation to receive new manufacturing data.


    The Hadoop cluster is used to store the manufacturing information, such as the
    data from 200 million devices per year created by the company. For example, in
    phase I manufacturing (clean room assembly), while drive components are assembled,
    data is captured by various sensors at each construction step for every drive.
    From a manufacturing point of view, creating 50-60 million devices a quarter creates
    petabytes of information that must be collected, stored, and disseminated in the
    organization for different needs. Some user scenarios include the query to the
    particular models, the summarization of quality of one batch, the average media
    density of one model, etc.


    `PIG`/`Hive` is used for `MapReduce` indirectly, actually `PIG`/`Hive` converts
    SQL-like code to Java code to run `MapReduce`. `MapReduce` then does SQL-like
    statements to process raw test data to generate drill-downs and dashboards for
    product engineering R&D and failure analysis (FA). However, the cluster is mainly
    for analytics: `MapReduce` use cases (~80%) and also some `Hbase` online search
    use cases (~20%).


    The WD cluster configuration is shown in Table [8-1](#468166_1_En_8_Chapter.xhtml#Tab1).
    A general data flow is shown in Figure [8-1](#468166_1_En_8_Chapter.xhtml#Fig1),
    where `HDFS` has native configurable logging structure, while `datanode` needs
    the aid of `blktrace`. The read requests from client-obtained metadata information
    from the `namenode` and then `namenode` sends block ops to devices. Thus the client
    gets the corresponding data from `datanotes`. The write requests will change both
    data in `datanodes` and the metadata in `namenodes`.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig1_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Data flow in Hadoop system


    Table 8-1


    WD-HDP1 Cluster Configuration


    | WD-HDP1: 100 Servers |

    | --- |

    | CPU | Intel Xeon E3-1240v2, 4 Core |

    | RAM | 32 GB DDR3 |

    | OS HDD | WDC WD3000BLFS 10kRPM 300GB |

    | Hadoop HDD | WDC WD2000FYYX 7.2kRPM 2-4TB |

    | Hadoop Version | 1.2.x |


    The data collection structure is illustrated in Figure [8-2](#468166_1_En_8_Chapter.xhtml#Fig2).
    The task tracker runs above the local file system (FS). The jobs will finally
    convert into the block-level accesses to the local devices in each `datanode`.
    The tool `blktrace` actually collects the data in the block IO layer from the
    local devices (see Appendix B for details). I ran `blktrace` (sometimes together
    with `iostat` and/or `iotop`) repeatedly on four `datanodes` with different file
    systems and write cache settings in tens of batches, where two nodes used `XFS`
    and another two used `EXT4` as local file systems, with each run lasting for few
    hours to few days. I collected hundreds of GB of traces (100+ pieces) representing
    total 1500+ hours of cluster operation from May 2014 to January 2015.^([^(70)](#fn70))
    I switched the write cache on or off to collect data from different situations.
    The workload to these four nodes was relatively stable based on Ganglia’s network
    in/out metrics except for a few pieces. In particular, I focus on the trace collected
    in January 2015 with batch ID from 16 to 25 in this book. They are all one-day
    duration traces with the settings as show in Table [8-2](#468166_1_En_8_Chapter.xhtml#Tab2).


    Table 8-2


    File System and Write Cache Settings


    | Node ID | FS | Write cache |

    | --- | --- | --- |

    | 147 | XFS | 16:21 disabled; 22:25 enabled |

    | 148 | EXT4 | 16:21 disabled; 22:25 enabled |

    | 149 | EXT4 | 16:21 enabled; 22:25 disabled |

    | 150 | XFS | 16:21 enabled; 22:25 disabled |


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig2_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Trace collection using Ganglia and Blktrace


    ## Workload Metrics Evaluation


    In this section, I discuss my observations of disk activity from a sample of nodes
    within the Hadoop cluster. I then explain how these observations relate to metrics
    discussed in the previous section. Finally, I conclude with observations from
    a system level and suggestions for addressing performance issues which could arise
    from my recorded observations.


    ### Block-Level Analysis


    There exist some tools to parse and analyze raw block traces. For example, `seekwatcher`
    [78] generates graphs from `blktrace` runs to help visualize IO patterns and performance.
    `Iowatcher` [79] graphs the results of a `blktrace` run. However, those tools
    cannot capture the advanced metrics defined in Chapter [2](#468166_1_En_2_Chapter.xhtml).
    Thus you can apply the Matlab-based tool introduced before for these advanced
    properties.'
