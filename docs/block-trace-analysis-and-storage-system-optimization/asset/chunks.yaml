    \ first, as shown in Figures [5-7](#468166_1_En_5_Chapter.xhtml#Fig7) and [5-8](#468166_1_En_5_Chapter.xhtml#Fig8),\
    \ respectively. You can see the large difference for their distributions of various\
    \ applications. Table [5-9](#468166_1_En_5_Chapter.xhtml#Tab9) further gives the\
    \ mean and standard derivative values together with `IOPS`. Figure [5-9](#468166_1_En_5_Chapter.xhtml#Fig9)\
    \ and Table [5-10](#468166_1_En_5_Chapter.xhtml#Tab10) provide the size distribution.\
    \ You may also find the relation between the size and completion time.\n\n**Table\
    \ 5-10** PCMark: Size Distribution (Blocks)\n\n| App | Mean -all | std. | Mean\
    \ -read | std. | Mean -write | std. |\n| --- | --- | --- | --- | --- | --- | ---\
    \ |\n| 1 | 98.67 | 87.55 | 102.78 | 87.4 | 10.22 | 7.3 |\n| 2 | 86.92 | 56.39\
