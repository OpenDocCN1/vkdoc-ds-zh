- fmt: "# 1. Introduction\n\nThe chapter provides the background of data storage systems\
    \ and general trace analysis. I will show that wide applications of block storage\
    \ devices motivate the intensive study of various block-level workload properties.\
    \ I will also list the objectives and contributions of this book in this chapter.\n\
    \n## Basics of Storage\n\nIn this information-rich world, data storage devices\
    \ and systems are fundamental for information preservation. There are so many\
    \ different types of storage devices available in the market, such as magnetic\
    \ tape, optical disc drive, hard disk drive (`HDD`), solid state drive (`SSD`),\
    \ flash memory, etc. Historically, there were even more types, like twister memory\
    \ and drum memory. To narrow the focus, I will cover the modern computer storage/memory\
    \ devices only. They can be generally divided into two categories [1].\n\n- Volatile\n\
    \    - The commonly used, such as `DRAM` (dynamic `RAM`), `SRAM` (static `RAM`),\
    \ etc.\n    - Those under development: `T-RAM` (thyristor `RAM`), `Z-RAM` (zero-capacitor),\
    \ etc.\n- Non-volatile\n    - `ROM` (read-only memory), such as `EPROM` (Erasable\
    \ Programmable `ROM`), `EEPROM` (Electrically `E-PROM`), `MROM` (Mask `ROM`),\
    \ etc.\n    - `NVRAM`, such as flash memory, `PCM` (phase change memory), `ReRAM`/`RRAM`\
    \ (resistive `RAM`), `MRAM` (magnetoresistive `RAM`), `FeRAM` (ferroelectric `RAM`),\
    \ etc.\n    - Mechanical devices like `HDD`, magnetic tape, optical disc drives\n\
    \nWhen selecting a storage device or system, many factors must be considered carefully,\
    \ such as price, performance, capacity, power efficiency, reliability, data integrity,\
    \ durability, form factor, operating temperature, connection types, and so on,\
    \ depending on the application scenarios. However, the performance of the devices\
    \ is the major topic of this book.\n\n## Storage Devices\n\nIn this section, I\
    \ discuss several types of non-volatile storage devices, as some volatile devices\
    \ like `RAM`, will be used inside those non-volatile devices as cache.\n\n###\
    \ HDD\n\n`HDD` was first introduced by IBM in 1956. Soon it became the dominant\
    \ secondary storage device for general purpose computers. Even now, it is still\
    \ the mainstream storage device, in particular for data centers. Despite the fact\
    \ that disk drives are commodity products today, a disk drive is an extremely\
    \ complex electromechanical system encompassing decades of finely honed research\
    \ and development on an immense multitude of diverse disciplines, although the\
    \ main components of the modern `HDD` have remained basically the same for the\
    \ past 30 years. Figure [1-1](#468166_1_En_1_Chapter.xhtml#Fig1)^([¹](#fn1)) shows\
    \ the components as assembled, and Figure [1-2](#468166_1_En_1_Chapter.xhtml#Fig2)\
    \ illustrates the basic electronics blocks.\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig2_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2 Basic `HDD` electronics blocks\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig1_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1 Basic components of a `HDD`\n\nIn particular, the servo is one of\
    \ the most precise mechanical systems in the world. The disk head that reads and\
    \ writes data to the medium is only few nanometers above the disc media; this\
    \ is similar to a Boing 737 plane flying a few meters above the ground. The `HSA`\
    \ (head stack assembly) is moved by applying a current to the wires wound around\
    \ a loop at its back end. This coil forms an electromagnet. The amount of current\
    \ used is calculated by servo electronics. By varying the current, very precise\
    \ acceleration and deceleration can be programmed, increasing IO performance and\
    \ servo head positioning accuracy.\n\n`HDD` can be divided into two categories:\
    \ consumer and enterprise. Consumer `HDD`s are mostly used in desktop and mobile\
    \ devices like a notebook. Consumer electronics `HDD`s are often embedded into\
    \ digital video recorders, smart TVs, and automotive vehicles. Enterprise `HDD`s\
    \ usually have higher reliability than consumer `HDD`s, with higher quality requirements\
    \ for the media and head.\n\nDisk drives have different spinning speeds (rotation\
    \ per minute, `RPM`). For example, desktop `HDD`s are usually in 3.5-inch form\
    \ with 7200 `RPM`, while mobile `HDD`s are in 2.5-inch form with 5400 `RPM`. Each\
    \ disc surface is divided into different concentric zones. Inner zones (`ID`)\
    \ have less physical space and contain less sectors than outer zones (`OD`). As\
    \ the spinning speed is the same, the data transfer speed of `OD` is generally\
    \ faster than that in `ID`. For a typical 3.5-inch desktop `HDD`, the sequential\
    \ read speed in `OD` could be 1.5 to 2 times than that in `ID`.\n\nFor a typical\
    \ `HDD`, the following formula calculates average access time (*T*[*a*]) [2, 3]:\n\
    \n*T*[*a*] *= T*[*s*] *+ T*[*l*] *+ T*[*t*] *+ T*[*o*] (1.1)\n\nwhere\n\n- Seek\
    \ time as *T*[*s*]: Time required to move the heads a desired distance. Typically\
    \ specified at 1/3 the radius of the platter. The settle time is generally included\
    \ in this part.\n- Rotational latency as *T*[*l*]: Amount of time the drive must\
    \ wait before data is under the read/write head.\n- Transfer time as *T*[*t*]:\
    \ Amount of time required to transfer data to or from the host.\n- Controller\
    \ overhead as *T*[*o*]: How long it takes the drive to decode a command from the\
    \ host.\n\nNote that the read head is usually different from the write head, and\
    \ the internal firmware process for reads and writes is also different. So there\
    \ will be a slight variance for read and write seek times. Usually, write access\
    \ costs more because of the longer setting time of a write, which is caused by\
    \ `PES` (position error signal) requirement, which means write access requires\
    \ a stronger condition on `PES` than read access. By design, faster `RPM` drives\
    \ have faster average access times than slower `RPM` drives due to shorter latency\
    \ and seek times.\n\nThe response time (*T*[*res*]) is a different concept from\
    \ the access time. In fact, since the conventional disk drive can only process\
    \ one request at one time, some incoming requests have to wait in a queue. For\
    \ example, some write requests may be buffered in `DRAM` write cache first and\
    \ must wait for the previous request to be completed. Note that although there\
    \ are many arms and heads per drive, the arms must move together since there is\
    \ only one `VCM` to drive them in general. Thus,\n\n*T*[*res*] = *T*[*a*] + *T*[*w*]\
    \ (1.2)\n\nwhere *T*[*w*] is the waiting or queueing time just after the request\
    \ enters the queue and before it is actually executed.\n\nOwning to the influence\
    \ of the command queue, cache has large impact on the performance of both read\
    \ and write. Thus, a large portion of `DRAM` inside `HDD` is used for cache. Read\
    \ cache and write cache commonly share the same space, so that part of write cache\
    \ segments may be converted into read cache segments when necessary. However,\
    \ some `HDD`s may have dedicated read or write cache for different purposes. In\
    \ Chapter [4](#468166_1_En_4_Chapter.xhtml), I will show more details.\n\nConventional\
    \ magnetic recording (`CMR`) is a relative concept. The longitudinal magnetic\
    \ recording (`LMR`) `HDD` was a conventional concept to perpendicular magnetic\
    \ recording (`PMR`) `HDD` in early 2000s. Nowadays, `PMR` is the dominant structure\
    \ and is still in evolution. For example, `SMR` (shingled magnetic recording)\
    \ is a new type of `PMR` already available in the market, while `HAMR` (heat-assistant\
    \ magnetic recording) and `MAMR` (microwave-assistant magnetic recording) are\
    \ emerging."
  raw: "# 1. Introduction\n\nThe chapter provides the background of data storage systems\
    \ and general trace analysis. I will show that wide applications of block storage\
    \ devices motivate the intensive study of various block-level workload properties.\
    \ I will also list the objectives and contributions of this book in this chapter.\n\
    \n## Basics of Storage\n\nIn this information-rich world, data storage devices\
    \ and systems are fundamental for information preservation. There are so many\
    \ different types of storage devices available in the market, such as magnetic\
    \ tape, optical disc drive, hard disk drive (HDD), solid state drive (SSD), flash\
    \ memory, etc. Historically, there were even more types, like twister memory and\
    \ drum memory. To narrow the focus, I will cover the modern computer storage/memory\
    \ devices only. They can be generally divided into two categories [1].\n\n*  \
    \ Volatile\n    *   The commonly used, such as DRAM (dynamic RAM), SRAM (static\
    \ RAM), etc.\n\n    *   Those under development: T-RAM (thyristor RAM), Z-RAM\
    \ (zero-capacitor), etc.\n\n*   Non-volatile\n    *   ROM (read-only memory),\
    \ such as EPROM (Erasable Programmable ROM), EEPROM (Electrically E-PROM), MROM\
    \ (Mask ROM), etc.\n\n    *   NVRAM, such as flash memory, PCM (phase change memory),\
    \ ReRAM/RRAM (resistive RAM), MRAM (magnetoresistive RAM), FeRAM (ferroelectric\
    \ RAM), etc.\n\n    *   Mechanical devices like HDD, magnetic tape, optical disc\
    \ drives\n\nWhen selecting a storage device or system, many factors must be considered\
    \ carefully, such as price, performance, capacity, power efficiency, reliability,\
    \ data integrity, durability, form factor, operating temperature, connection types,\
    \ and so on, depending on the application scenarios. However, the performance\
    \ of the devices is the major topic of this book.\n\n## Storage Devices\n\nIn\
    \ this section, I discuss several types of non-volatile storage devices, as some\
    \ volatile devices like RAM, will be used inside those non-volatile devices as\
    \ cache.\n\n### HDD\n\nHDD was first introduced by IBM in 1956\\. Soon it became\
    \ the dominant secondary storage device for general purpose computers. Even now,\
    \ it is still the mainstream storage device, in particular for data centers. Despite\
    \ the fact that disk drives are commodity products today, a disk drive is an extremely\
    \ complex electromechanical system encompassing decades of finely honed research\
    \ and development on an immense multitude of diverse disciplines, although the\
    \ main components of the modern HDD have remained basically the same for the past\
    \ 30 years. Figure [1-1](#468166_1_En_1_Chapter.xhtml#Fig1)^([¹](#fn1)) shows\
    \ the components as assembled, and Figure [1-2](#468166_1_En_1_Chapter.xhtml#Fig2)\
    \ illustrates the basic electronics blocks.\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig2_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nBasic HDD electronics blocks\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig1_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1\n\nBasic components of a HDD\n\nIn particular, the servo is one of\
    \ the most precise mechanical systems in the world. The disk head that reads and\
    \ writes data to the medium is only few nanometers above the disc media; this\
    \ is similar to a Boing 737 plane flying a few meters above the ground. The HSA\
    \ (head stack assembly) is moved by applying a current to the wires wound around\
    \ a loop at its back end. This coil forms an electromagnet. The amount of current\
    \ used is calculated by servo electronics. By varying the current, very precise\
    \ acceleration and deceleration can be programmed, increasing IO performance and\
    \ servo head positioning accuracy.\n\nHDD can be divided into two categories:\
    \ consumer and enterprise. Consumer HDDs are mostly used in desktop and mobile\
    \ devices like a notebook. Consumer electronics HDDs are often embedded into digital\
    \ video recorders, smart TVs, and automotive vehicles. Enterprise HDDs usually\
    \ have higher reliability than consumer HDDs, with higher quality requirements\
    \ for the media and head.\n\nDisk drives have different spinning speeds (rotation\
    \ per minute, RPM). For example, desktop HDDs are usually in 3.5-inch form with\
    \ 7200 RPM, while mobile HDDs are in 2.5-inch form with 5400 RPM. Each disc surface\
    \ is divided into different concentric zones. Inner zones (ID) have less physical\
    \ space and contain less sectors than outer zones (OD). As the spinning speed\
    \ is the same, the data transfer speed of OD is generally faster than that in\
    \ ID. For a typical 3.5-inch desktop HDD, the sequential read speed in OD could\
    \ be 1.5 to 2 times than that in ID.\n\nFor a typical HDD, the following formula\
    \ calculates average access time (*T*[*a*]) [2, 3]:\n\n*T*[*a*] *= T*[*s*] *+\
    \ T*[*l*] *+ T*[*t*] *+ T*[*o*](1.1)\n\nwhere\n\n*   Seek time as *T*[*s*]: Time\
    \ required to move the heads a desired distance. Typically specified at 1/3 the\
    \ radius of the platter. The settle time is generally included in this part.\n\
    \n*   Rotational latency as *T*[*l*]: Amount of time the drive must wait before\
    \ data is under the read/write head.\n\n*   Transfer time as T[*t*]: Amount of\
    \ time required to transfer data to or from the host.\n\n*   Controller overhead\
    \ as *T*[*o*]: How long it takes the drive to decode a command from the host.\n\
    \nNote that the read head is usually different from the write head, and the internal\
    \ firmware process for reads and writes is also different. So there will be a\
    \ slight variance for read and write seek times. Usually, write access costs more\
    \ because of the longer setting time of a write, which is caused by PES (position\
    \ error signal) requirement, which means write access requires a stronger condition\
    \ on PES than read access. By design, faster RPM drives have faster average access\
    \ times than slower RPM drives due to shorter latency and seek times.\n\nThe response\
    \ time (*T*[*res*]) is a different concept from the access time. In fact, since\
    \ the conventional disk drive can only process one request at one time, some incoming\
    \ requests have to wait in a queue. For example, some write requests may be buffered\
    \ in DRAM write cache first and must wait for the previous request to be completed.\
    \ Note that although there are many arms and heads per drive, the arms must move\
    \ together since there is only one VCM to drive them in general. Thus,\n\n*T*[*res*]\
    \ = *T*[*a*] + *T*[*w*](1.2)\n\nwhere *T*[*w*] is the waiting or queueing time\
    \ just after the request enters the queue and before it is actually executed.\n\
    \nOwning to the influence of the command queue, cache has large impact on the\
    \ performance of both read and write. Thus, a large portion of DRAM inside HDD\
    \ is used for cache. Read cache and write cache commonly share the same space,\
    \ so that part of write cache segments may be converted into read cache segments\
    \ when necessary. However, some HDDs may have dedicated read or write cache for\
    \ different purposes. In Chapter [4](#468166_1_En_4_Chapter.xhtml), I will show\
    \ more details.\n\nConventional magnetic recording (CMR) is a relative concept.\
    \ The longitudinal magnetic recording (LMR) HDD was a conventional concept to\
    \ perpendicular magnetic recording (PMR) HDD in early 2000s. Nowadays, PMR is\
    \ the dominant structure and is still in evolution. For example, SMR (shingled\
    \ magnetic recording) is a new type of PMR already available in the market, while\
    \ HAMR (heat-assistant magnetic recording) and MAMR (microwave-assistant magnetic\
    \ recording) are emerging."
  trans: "\n# 1. 引言\n\n本章将介绍数据存储系统及通用踪迹分析的背景知识。我将说明块存储设备的广泛应用如何推动了对各种块级工作负载特性的深入研究。同时，本章还将列出本书的研究目标与贡献。\n\
    \n## 存储基础\n\n在这个信息丰富的世界中，数据存储设备和系统是信息保存的基础。市场上有多种不同类型的存储设备，例如磁带、光盘驱动器、硬盘驱动器（`HDD`）、固态驱动器（`SSD`）、闪存等。历史上甚至还有更多类型，如双绞线存储器和磁鼓存储器。为聚焦主题，本书仅涵盖现代计算机存储/内存设备。它们大致可分为两类\
    \ [1]。\n\n- 易失性\n    - 常用类型：如 `DRAM`（动态 `RAM`）、`SRAM`（静态 `RAM`）等。\n    - 研发中类型：`T-RAM`（晶闸管\
    \ `RAM`）、`Z-RAM`（零电容 `RAM`）等。\n- 非易失性\n    - `ROM`（只读存储器），如 `EPROM`（可擦除可编程 `ROM`）、`EEPROM`（电可擦除\
    \ `PROM`）、`MROM`（掩模 `ROM`）等。\n    - `NVRAM`，如闪存、`PCM`（相变存储器）、`ReRAM`/`RRAM`（阻变式\
    \ `RAM`）、`MRAM`（磁阻式 `RAM`）、`FeRAM`（铁电式 `RAM`）等。\n    - 机械设备，如 `HDD`、磁带、光盘驱动器\n\
    \n在选择存储设备或系统时，需根据应用场景仔细考量诸多因素，例如价格、性能、容量、能效、可靠性、数据完整性、耐用性、外形尺寸、工作温度、连接类型等。然而，设备性能是本书的主要探讨主题。\n\
    \n## 存储设备\n\n本节将讨论几种非易失性存储设备，因为某些易失性设备（如 `RAM`）会作为缓存用于这些非易失性设备内部。\n\n### HDD\n\
    \n`HDD` 于 1956 年由 IBM 首次推出，很快便成为通用计算机的主流辅助存储设备。时至今日，它仍是主流存储设备，尤其在数据中心领域。尽管磁盘驱动器如今已是大众化产品，但它实际上是一种极其复杂的机电系统，凝聚了数十年来在众多不同学科领域精雕细琢的研究与开发成果——尽管现代\
    \ `HDD` 的主要组件在过去 30 年间基本保持不变。图 1-1^(¹) 展示了组装后的组件，图 1-2 则展示了基本电子模块。\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig2_HTML.jpg](img/468166_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2 基本 `HDD` 电子模块\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig1_HTML.jpg](img/468166_1_En_1_Fig1_HTML.jpg)\n\
    \n图 1-1 `HDD` 的基本组件\n\n特别值得一提的是，伺服系统是世界上最精密的机械系统之一。用于读写介质的磁盘磁头距离盘片表面仅几纳米，这相当于一架波音\
    \ 737 飞机在离地几米的高度飞行。`HSA`（磁头堆栈组件）通过向其后端环绕的线圈施加电流来移动，该线圈构成一个电磁铁。伺服电子系统计算所需的电流量。通过改变电流，可以精确编程控制加速和减速，从而提高\
    \ IO 性能及伺服磁头定位精度。\n\n`HDD` 可分为消费级和企业级两类。消费级 `HDD` 主要用于台式机和笔记本电脑等移动设备。消费电子类 `HDD`\
    \ 常嵌入数字录像机、智能电视和汽车中。企业级 `HDD` 通常比消费级 `HDD` 具有更高的可靠性，对介质和磁头的质量要求也更高。\n\n磁盘驱动器具有不同的转速（每分钟转数，`RPM`）。例如，台式机\
    \ `HDD` 通常为 3.5 英寸规格，转速 7200 `RPM`；而移动 `HDD` 为 2.5 英寸规格，转速 5400 `RPM`。每个盘片表面被划分为不同的同心区域。内圈区域（`ID`）物理空间较小，包含的扇区少于外圈区域（`OD`）。由于转速相同，`OD`\
    \ 的数据传输速度通常快于 `ID`。对于典型的 3.5 英寸台式机 `HDD`，`OD` 的顺序读取速度可能是 `ID` 的 1.5 到 2 倍。\n\n\
    对于典型的 `HDD`，平均访问时间（*T*[*a*]）由以下公式计算 [2, 3]：\n\n*T*[*a*] *= T*[*s*] *+ T*[*l*]\
    \ *+ T*[*t*] *+ T*[*o*] (1.1)\n\n其中\n\n- 寻道时间 *T*[*s*]：将磁头移动到所需距离所需的时间。通常指定为盘片半径的\
    \ 1/3。稳定时间通常包含在此部分中。\n- 旋转延迟 *T*[*l*]：驱动器必须等待数据到达读/写磁头下方的时间量。\n- 传输时间 *T*[*t*]：向主机传输数据或从主机接收数据所需的时间量。\n\
    - 控制器开销 *T*[*o*]：驱动器解码主机命令所需的时间。\n\n请注意，读取磁头通常与写入磁头不同，且内部固件对读取和写入的处理流程也不同。因此，读取和写入的寻道时间会略有差异。通常，写入访问耗时更长，因为写入需要更长的稳定时间，这是由\
    \ `PES`（位置误差信号）要求导致的——这意味着写入访问对 `PES` 的要求比读取访问更严格。根据设计，由于延迟和寻道时间更短，转速更高的驱动器通常具有更快的平均访问时间。\n\
    \n响应时间（*T*[*res*]）是与访问时间不同的概念。实际上，由于传统磁盘驱动器一次只能处理一个请求，一些传入的请求必须在队列中等待。例如，某些写入请求可能首先被缓冲在\
    \ `DRAM` 写入缓存中，并必须等待前一个请求完成。请注意，尽管每个驱动器有多个磁臂和磁头，但由于通常只有一个 `VCM`（音圈电机）驱动它们，磁臂必须一起移动。因此，\n\
    \n*T*[*res*] = *T*[*a*] + *T*[*w*] (1.2)\n\n其中 *T*[*w*] 是请求进入队列后、实际执行前的等待或排队时间。\n\
    \n由于命令队列的影响，缓存对读写性能均有很大影响。因此，`HDD` 内部的大部分 `DRAM` 被用作缓存。读取缓存和写入缓存通常共享同一空间，因此必要时部分写入缓存段可转换为读取缓存段。然而，某些\
    \ `HDD` 可能针对不同用途设有专用的读取或写入缓存。在第 4 章中，我将展示更多细节。\n\n传统磁记录（`CMR`）是一个相对概念。在 21 世纪初，纵向磁记录（`LMR`）`HDD`\
    \ 相对于垂直磁记录（`PMR`）`HDD` 而言是传统概念。如今，`PMR` 是主流结构，且仍在演进中。例如，`SMR`（叠瓦式磁记录）是市场上已有的一种新型\
    \ `PMR`，而 `HAMR`（热辅助磁记录）和 `MAMR`（微波辅助磁记录）正在兴起。\n"
- fmt: '### SMR HDD


    SMR is the emergent technique being deployed to increase areal density in HDDs
    without drastic changes to the HDD mechanics [4, 5, 6, 7, 8]. Due to its shingled
    nature, SMR tends to favor large sequential writes over random ones. In this background
    section, I will give a general introduction to SMR characteristics.


    The most significant feature of a SMR drive is its sequential write properties
    due to the shingled tracks. As shown in Figure [1-3](#468166_1_En_1_Chapter.xhtml#Fig3),
    all physical sectors are written sequentially in a particular direction radially
    and are only rewritten after a wrap-around. Rewriting a previously written LBA
    will cause the previous write to be marked invalid and the LBA will be written
    to the next sequential physical sector.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig3_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig3_HTML.jpg)


    Figure 1-3 Schematic of SMR


    Due to this log-structure-like sequential write feature (which is beneficial for
    write performance), the conventional LBA-to-PBA mapping (direct/static mapping)
    may not work well since any change in a block results in a read-modify-write access
    to all its consecutive blocks in the same zone, which can cause performance penalties.
    Therefore, indirect/dynamic mapping is usually applied. When an update happens,
    instead of an in-place rewrite, an out-of-place “new” write will be carried out,
    which leads to write implications; in other words, the data in the previous place
    becomes garbage and the new write claims additional space. In order to reuse those
    garbage blocks, a garbage collection (GC) procedure must be implemented.


    Another concern of the out-of-place update is the potential harm to the sequential
    read performance. If some LBA-continuous requests are written into several different
    physical zones, the later LBA-continuous read request in the same LBA range cannot
    gain the actual benefit of the “logically sequential” read. The corresponding
    data management scheme can be implemented in three levels: drive, middleware,
    or host side. Although a few academic works have introduced in-place updates via
    a special data layout design, the out-of-place policy remains the main approach.


    In general, a SMR drive expects the workload to be read/write sequentially, with
    infrequent updates to the data. In addition, since garbage data will generally
    occur at some points (unless data is never deleted or modified), idle time should
    be sufficiently long as to allow GC to run periodically without impacting external/user
    IO performance. Hence, the write-once-read-many (WORM) workload (archival) is
    a natural extension to the characteristics of SMR drives. Few other recent suggestions
    on SMR optimizations are available in [9], e.g., hybrid strategy, parallel access
    and large form factor.


    ### Other HDDs


    The PMR technique reached its theoretical limitation of areal density for conventional
    design (1TB/in²) in recent years. The limiting factor is the onset of the super-paramagnetic
    limit as researchers strive towards smaller grained recording media. This levies
    a tradeoff between the signal-to-noise ratio (SNR) and the thermal stability of
    small grain media and the writability of a narrow track head, which restricts
    the ability to continue to scale CMR technology to higher areal densities [10].


    Several promising technology alternatives have been explored to increase the areal
    density beyond the limit, such as two-dimensional magnetic recording (TDMR), heat-assisted
    magnetic recording, microwave-assisted magnetic recording [10], and bit-patterned
    magnetic recording (BPMR). Table [1-1](#468166_1_En_1_Chapter.xhtml#Tab1) provides
    a brief category and Figure [1-5](#468166_1_En_1_Chapter.xhtml#Fig5) shows the
    trends of these techniques.


    Table 1-1 New Techniques to Increase Areal Density


    | Approaches | Reduce grain size and make grains harder to switch | Reduce bit
    width and/or length | Increase areal density/size, add heads and disks |

    | --- | --- | --- | --- |

    | Solutions | HAMR, MARM | SMR, HAMR, T-DMR | Helium drive, advanced mechanical
    designs, form factor optimization |


    In BPMR technology, each recording bit is stored in a fabricated magnetic island
    of around 10 nm. It has been proposed as a means for extending the super-paramagnetic
    limit of current granular media as illustrated in Figure [1-4](#468166_1_En_1_Chapter.xhtml#Fig4)
    (a). The recording physics in BPMR are fundamentally different from conventional
    PMR, as the write and read scheme must be totally reestablished. A major shortcoming
    is the write synchronization requirement in which the write field must be timed
    to coincide with the locations of patterned islands. The total switching field
    distribution in the writing process, including various interference fields, must
    be less than the product of the bit length and the head field gradient to attain
    a high areal density up to 5 TB/in² theoretically.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig4_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig4_HTML.jpg)


    Figure 1-4 Future options of HDD [10]


    HAMR and MAMR are two implementations of energy-assisted magnetic recording (EAMR).
    HAMR is proposed to overcome head writability issues. The core components of proposed
    HARM and MAMR technologies are a laser and a spin torque-driven microwave oscillator,
    respectively. In HAMR, the media have to be stable at much smaller grain sizes
    yet be writable at suitably elevated temperatures. The integration of HAMR and
    BPMR enables an extension of both technologies, with projected areal density up
    to about 100 Tb/in² based on the thermal stability of known magnetic materials
    [10]. Both WDC and Seagate announced their roadmap for EAMR. Seagate claimed that
    its HAMR-based HDDs will be due in late 2018,^([²](#fn2)) while WDC declared that
    its MAMR will store 40TB on a hard drive by 2025.^([³](#fn3))


    TDMR still uses a relatively conventional perpendicular medium and head, while
    combining shingled write recording (SWR) and/or 2D read back and signal processing
    to promise particularly large gains. Recording with energy assist on BPM or 2D
    signal processing will enable the areal density beyond around 5 Tb/in². However,
    there is no clear problem-free solution so far.


    Note that for HAMR/MAMR HDDs, the sequential access properties may be similar
    to SMR/TDMR. As the heater start-up/cool-down requires time, sequential access
    to reduce the status change is preferred.


    One of other recent techniques to increase single device’s capacity is the volumetric
    density scaling, such as adding more disc platters into one Helium-filled drive
    (less turbulence, thinner disks, and higher capacity) and designing a large form
    factor enclosure [9]. To further increase the capacity of single drives, some
    interesting designs have been suggested. For example, the dual-spindle design
    can access two disk clusters with two arms [11]. In this direction, more arms
    and disks are also possible, such as six arms and six disk spindles. Magnetic
    disk libraries and cartridge designs make the disk media exchangeable, similar
    to optical disks.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig5_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig5_HTML.jpg)


    Figure 1-5 Predicated density of future techniques [10]'
  raw: '#### SMR HDD


    SMR is the emergent technique being deployed to increase areal density in HDDs
    without drastic changes to the HDD mechanics [4, 5, 6, 7, 8]. Due to its shingled
    nature, SMR tends to favor large sequential writes over random ones. In this background
    section, I will give a general introduction to SMR characteristics.


    The most significant feature of a SMR drive is its sequential write properties
    due to the shingled tracks. As shown in Figure [1-3](#468166_1_En_1_Chapter.xhtml#Fig3),
    all physical sectors are written sequentially in a particular direction radially
    and are only rewritten after a wrap-around. Rewriting a previously written LBA
    will cause the previous write to be marked invalid and the LBA will be written
    to the next sequential physical sector.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig3_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Schematic of SMR


    Due to this log-structure-like sequential write feature (which is beneficial for
    write performance), the conventional LBA-to-PBA mapping (direct/static mapping)
    may not work well since any change in a block results in a read-modify-write access
    to all its consecutive blocks in the same zone, which can cause performance penalties.
    Therefore, indirect/dynamic mapping is usually applied. When an update happens,
    instead of an in-place rewrite, an out-of-place “new” write will be carried out,
    which leads to write implications; in other words, the data in the previous place
    becomes garbage and the new write claims additional space. In order to reuse those
    garbage blocks, a garbage collection (GC) procedure must be implemented.


    Another concern of the out-of-place update is the potential harm to the sequential
    read performance. If some LBA-continuous requests are written into several different
    physical zones, the later LBA-continuous read request in the same LBA range cannot
    gain the actual benefit of the “logically sequential” read. The corresponding
    data management scheme can be implemented in three levels: drive, middleware,
    or host side. Although a few academic works have introduced in-place updates via
    a special data layout design, the out-of-place policy remains the main approach.


    In general, a SMR drive expects the workload to be read/write sequentially, with
    infrequent updates to the data. In addition, since garbage data will generally
    occur at some points (unless data is never deleted or modified), idle time should
    be sufficiently long as to allow GC to run periodically without impacting external/user
    IO performance. Hence, the write-once-read-many (WORM) workload (archival) is
    a natural extension to the characteristics of SMR drives. Few other recent suggestions
    on SMR optimizations are available in [9], e.g., hybrid strategy, parallel access
    and large form factor.


    #### Other HDDs


    The PMR technique reached its theoretical limitation of areal density for conventional
    design (1TB/in²) in recent years. The limiting factor is the onset of the super-paramagnetic
    limit as researchers strive towards smaller grained recording media. This levies
    a tradeoff between the signal-to-noise ratio (SNR) and the thermal stability of
    small grain media and the writability of a narrow track head, which restricts
    the ability to continue to scale CMR technology to higher areal densities [10].


    Several promising technology alternatives have been explored to increase the areal
    density beyond the limit, such as two-dimensional magnetic recording (TDMR) ,
    heat-assisted magnetic recording, microwave-assisted magnetic recording [10],
    and bit-patterned magnetic recording (BPMR). Table [1-1](#468166_1_En_1_Chapter.xhtml#Tab1)
    provides a brief category and Figure [1-5](#468166_1_En_1_Chapter.xhtml#Fig5)
    shows the trends of these techniques.


    Table 1-1


    New Techniques to Increase Areal Density


    | Approaches | Reduce grain size and make  grains harder to switch | Reduce bit
    width and/or length | Increase areal density/size, add heads and disks |

    | --- | --- | --- | --- |

    | Solutions | HAMR, MARM | SMR, HAMR, T-DMR | Helium drive, advanced mechanical
    designs, form factor optimization |


    In BPMR technology, each recording bit is stored in a fabricated magnetic island
    of around 10 nm. It has been proposed as a means for extending the super-paramagnetic
    limit of current granular media as illustrated in Figure [1-4](#468166_1_En_1_Chapter.xhtml#Fig4)
    (a). The recording physics in BPMR are fundamentally different from conventional
    PMR, as the write and read scheme must be totally reestablished. A major shortcoming
    is the write synchronization requirement in which the write field must be timed
    to coincide with the locations of patterned islands. The total switching field
    distribution in the writing process, including various interference fields, must
    be less than the product of the bit length and the head field gradient to attain
    a high areal density up to 5 TB/in² theoretically.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig4_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Future options of HDD[10]


    HAMR and MAMR are two implementations of energy-assisted magnetic recording (EAMR).
    HAMR is proposed to overcome head writability issues. The core components of proposed
    HARM and MAMR technologies are a laser and a spin torque-driven microwave oscillator,
    respectively. In HAMR, the media have to be stable at much smaller grain sizes
    yet be writable at suitably elevated temperatures. The integration of HAMR and
    BPMR enables an extension of both technologies, with projected areal density up
    to about 100 Tb/in² based on the thermal stability of known magnetic materials
    [10]. Both WDC and Seagate announced their roadmap for EAMR. Seagate claimed that
    its HAMR-based HDDs will be due in late 2018,^([²](#fn2)) while WDC declared that
    its MAMR will store 40TB on a hard drive by 2025.^([³](#fn3))


    TDMR still uses a relatively conventional perpendicular medium and head, while
    combining shingled write recording (SWR) and/or 2D read back and signal processing
    to promise particularly large gains. Recording with energy assist on BPM or 2D
    signal processing will enable the areal density beyond around 5 Tb/in². However,
    there is no clear problem-free solution so far.


    Note that for HAMR/MAMR HDDs, the sequential access properties may be similar
    to SMR/TDMR. As the heater start-up/cool-down requires time, sequential access
    to reduce the status change is preferred.


    One of other recent techniques to increase single device’s capacity is the volumetric
    density scaling, such as adding more disc platters into one Helium-filled drive
    (less turbulence, thinner disks, and higher capacity) and designing a large form
    factor enclosure [9]. To further increase the capacity of single drives, some
    interesting designs have been suggested. For example, the dual-spindle design
    can access two disk clusters with two arms [11]. In this direction, more arms
    and disks are also possible, such as six arms and six disk spindles. Magnetic
    disk libraries and cartridge designs make the disk media exchangeable, similar
    to optical disks.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig5_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    Predicated density of future techniques[10]'
  trans: '

    ### SMR 硬盘


    SMR 是一种新兴技术，旨在无需对硬盘机械结构进行重大改动的情况下，提高硬盘的面密度 [4, 5, 6, 7, 8]。由于其叠瓦式特性，SMR 倾向于支持大型顺序写入而非随机写入。在本背景部分，我将对
    SMR 的特性进行一般性介绍。


    SMR 硬盘最显著的特征是其因叠瓦式磁道而产生的顺序写入特性。如图 1-3 所示，所有物理扇区都沿径向特定方向顺序写入，并且只有在环绕一圈后才能被重写。重写一个先前已写入的
    LBA 会导致先前的写入被标记为无效，并且该 LBA 将被写入下一个连续的物理扇区。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig3_HTML.jpg](img/468166_1_En_1_Fig3_HTML.jpg)


    图 1-3 SMR 示意图


    由于这种类似日志结构的顺序写入特性（有利于写入性能），传统的 LBA 到 PBA 映射（直接/静态映射）可能效果不佳，因为对某个块的任何更改都会导致对其同一区域中所有连续块进行读取-修改-写入操作，这可能会造成性能损失。因此，通常采用间接/动态映射。当发生更新时，不会进行原地重写，而是执行一次异地“新”写入，这会导致写入影响；换句话说，先前位置的数据变成垃圾，而新写入会占用额外的空间。为了重用这些垃圾块，必须实施垃圾回收（GC）程序。


    异地更新的另一个担忧是对顺序读取性能的潜在损害。如果某些 LBA 连续的请求被写入几个不同的物理区域，那么后续在同一 LBA 范围内的 LBA 连续读取请求就无法真正受益于“逻辑顺序”读取。相应的数据管理方案可以在三个层面实施：驱动器端、中间件端或主机端。尽管少数学术研究通过特殊的数据布局设计引入了原地更新，但异地策略仍然是主要方法。


    通常，SMR 硬盘期望工作负载是顺序读写，并且对数据的更新不频繁。此外，由于垃圾数据通常会在某些时刻出现（除非数据从未被删除或修改），空闲时间应足够长，以便
    GC 能够定期运行，而不会影响外部/用户 IO 性能。因此，一次写入多次读取（WORM）工作负载（归档）是 SMR 硬盘特性的自然延伸。文献 [9] 中还提供了一些近期关于
    SMR 优化的其他建议，例如混合策略、并行访问和大尺寸规格。


    ### 其他硬盘


    近年来，PMR 技术已达到了传统设计的理论面密度极限（1TB/in²）。限制因素是超顺磁极限的出现，因为研究人员致力于更小颗粒的记录介质。这需要在信噪比（SNR）与小颗粒介质的热稳定性以及窄磁道磁头的可写性之间进行权衡，从而限制了将
    CMR 技术扩展到更高面密度的能力 [10]。


    为了突破极限提高面密度，人们探索了几种有前景的替代技术，例如二维磁记录（TDMR）、热辅助磁记录、微波辅助磁记录 [10] 和位图案磁记录（BPMR）。表
    1-1 提供了简要分类，图 1-5 显示了这些技术的趋势。


    表 1-1 提高面密度的新技术


    | 方法 | 减小晶粒尺寸并使晶粒更难翻转 | 减小位宽和/或位长 | 提高面密度/尺寸，增加磁头和盘片 |

    | --- | --- | --- | --- |

    | 解决方案 | HAMR, MAMR | SMR, HAMR, TDMR | 氦气硬盘，先进机械设计，外形尺寸优化 |


    在 BPMR 技术中，每个记录位都存储在一个约 10 nm 的制造磁性岛中。如图 1-4 (a) 所示，它被提议作为扩展当前颗粒介质超顺磁极限的一种手段。BPMR
    的记录物理原理与传统的 PMR 有根本不同，因为写入和读取方案必须完全重建。一个主要缺点是写入同步要求，即写入场必须定时与图案化岛的位置重合。写入过程中的总翻转场分布（包括各种干扰场）必须小于位长与磁头场梯度的乘积，才能在理论上达到高达
    5 TB/in² 的高面密度。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig4_HTML.jpg](img/468166_1_En_1_Fig4_HTML.jpg)


    图 1-4 硬盘的未来选择 [10]


    HAMR 和 MAMR 是能量辅助磁记录（EAMR）的两种实现方式。HAMR 被提出来克服磁头可写性问题。所提出的 HAMR 和 MAMR 技术的核心组件分别是激光器和自旋扭矩驱动的微波振荡器。在
    HAMR 中，介质必须在更小的晶粒尺寸下保持稳定，同时在适当升高的温度下可写。HAMR 和 BPMR 的集成使得这两种技术得以扩展，根据已知磁性材料的热稳定性，预计面密度可达约
    100 Tb/in² [10]。WDC 和 Seagate 都宣布了他们的 EAMR 路线图。Seagate 声称其基于 HAMR 的硬盘将于 2018 年底推出，^(²)
    而 WDC 则宣称其 MAMR 技术将在 2025 年前在单个硬盘上存储 40TB 数据。^(³)


    TDMR 仍然使用相对传统的垂直介质和磁头，同时结合叠瓦式写入记录（SWR）和/或二维回读及信号处理，以期获得特别大的增益。在 BPM 上使用能量辅助记录或二维信号处理将使面密度超过约
    5 Tb/in²。然而，到目前为止，还没有明确的无问题解决方案。


    请注意，对于 HAMR/MAMR 硬盘，其顺序访问特性可能与 SMR/TDMR 类似。由于加热器启动/冷却需要时间，因此首选顺序访问以减少状态变化。


    近期提高单个设备容量的其他技术之一是体积密度缩放，例如在一个氦气填充硬盘中添加更多盘片（更少的湍流、更薄的盘片和更高的容量），以及设计大尺寸规格的外壳 [9]。为了进一步提高单个硬盘的容量，人们提出了一些有趣的设计。例如，双主轴设计可以用两个磁臂访问两个磁盘簇
    [11]。在这个方向上，更多的磁臂和盘片也是可能的，例如六个磁臂和六个磁盘主轴。磁盘库和盒式磁带设计使磁盘介质可更换，类似于光盘。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig5_HTML.jpg](img/468166_1_En_1_Fig5_HTML.jpg)


    图 1-5 未来技术的预测密度 [10]

    '
- fmt: "### SSD\n\nA solid-state drive/disk (`SSD`) is a solid-state storage device\
    \ to store data persistently that utilizes integrated circuit assemblies as memory\
    \ [12]. Electronic interfaces compatible with traditional HDDs, such as `SAS`\
    \ and `SATA`, are primarily used in `SSD` technology. Recently, `PCIe`, `SATA\
    \ express`, and `M.2` have become more popular due to increased bandwidth requirements.\n\
    \nThe internal memory chip of a `SSD` can be `NOR-flash`, `NAND-flash`, or some\
    \ other emerging `NVM` (non-volatile memory). Most SSDs have started to use `3D\
    \ TLC` (tri-layer ceil) `NAND`-based flash memory as of 2017.\n\n`SSD` is changing\
    \ the storage industry. While the maximum areal storage density for HDDs is only\
    \ 1.5 Tbit/in, the maximum for flash memory used in SSDs is 2.8 Tbit/in in laboratory\
    \ demonstrations as of 2016. And `SSD`’s overall areal density increasing ratio\
    \ of flash memory is over 40% per year, which is larger than 10-20% of HDD. And\
    \ the price decreasing ratio of `SSD` ($ per GB) is dropping faster than that\
    \ of HDD.\n\nTable [1-2](#468166_1_En_1_Chapter.xhtml#Tab2) gives a comparison\
    \ of `SSD` and `HDD`, where the `SSD` mainly refers to `NAND`-based devices, while\
    \ `HDD` is conventional `PMR` devices.^([⁴](#fn4))\n\n**Table 1-2**  \nComparison\
    \ of HDD and SSD"
  raw: '### SSD


    A solid-state drive/disk (SSD) is a solid-state storage device to store data persistently
    that utilizes integrated circuit assemblies as memory [12]. Electronic interfaces
    compatible with traditional HDDs, such as SAS and SATA, are primarily used in
    SSD technology. Recently, PCIe, SATA express, and M.2 have become more popular
    due to increased bandwidth requirements.


    The internal memory chip of a SSD can be NOR-flash, NAND-flash, or some other
    emerging NVM (non-volatile memory). Most SSDs have started to use 3D TLC (tri-layer
    ceil) NAND-based flash memory as of 2017.


    SSD is changing the storage industry. While the maximum areal storage density
    for HDDs is only 1.5 Tbit/in, the maximum for flash memory used in SSDs is 2.8
    Tbit/in in laboratory demonstrations as of 2016\. And SSD’s overall areal density
    increasing ratio of flash memory is over 40% per year, which is larger than 10-20%
    of HDD. And the price decreasing ratio of SSD ($ per GB) is dropping faster than
    that of HDD.


    Table [1-2](#468166_1_En_1_Chapter.xhtml#Tab2) gives a comparison of SSD and HDD,
    where the SSD mainly refers to NAND-based devices, while HDD is conventional PMR
    devices.^([⁴](#fn4))


    Table 1-2


    Comparison of HDD and SSD'
  trans: "\n### 固态硬盘\n\n固态硬盘/磁盘（`SSD`）是一种利用集成电路组件作为存储器、实现数据持久化存储的固态存储设备[12]。传统上与机械硬盘兼容的电子接口（如`SAS`和`SATA`）主要应用于`SSD`技术。近年来，由于带宽需求增加，`PCIe`、`SATA\
    \ express`和`M.2`接口变得更为普及。\n\n`SSD`的内部存储芯片可采用`NOR 闪存`、`NAND 闪存`或其他新兴的`NVM`（非易失性存储器）。截至\
    \ 2017 年，大多数固态硬盘已开始采用基于`3D TLC`（三层单元）`NAND`的闪存。\n\n`SSD`正在改变存储行业。虽然机械硬盘的最大面密度仅为\
    \ 1.5 Tbit/英寸，但截至 2016 年，实验室演示中`SSD`所用闪存的最大面密度已达 2.8 Tbit/英寸。此外，`SSD`闪存的面密度年增长率超过\
    \ 40%，远高于机械硬盘的 10-20%。同时，`SSD`的价格下降速度（每 GB 成本）也快于机械硬盘。\n\n表 1-2 对`SSD`与`HDD`进行了对比，其中`SSD`主要指基于`NAND`闪存的设备，而`HDD`则为传统`PMR`设备。^(⁴)\n\
    \n**表 1-2**  \nHDD 与 SSD 对比\n"
- fmt: '| Attribute | SSD | HDD |

    | --- | --- | --- |

    | Start-up time | Almost no delay because there is no requirement to prepare mechanical
    components (some `μ`s to ms). Usually a few ms to switch from an automatic power-saving
    mode. | Up to several seconds for disk spin-up. Up to few hundred million seconds
    to wake up from idle mode. |

    | Random access time | Typically less than 0.1 ms. Not a big performance bottleneck
    usually. | Typically from 2.5 (high-end server/enterprise drives) to 12 ms (laptop/mobile
    drives) mainly owing to seek time and rotational latency. |

    | Read latency time | Usually low due to the direct data access from any location.
    For applications constrained by the HDD’s positioning time, SSD has no issue in
    faster boot and application launch times (see Amdahl’s Law). A clean Windows OS
    may spend less than 6 seconds to boot up. | Generally much larger than SSDs. The
    time is different for each seek due to different data locations on the media and
    the current read head position.^([⁵](#fn5)) A clean Windows OS may spend more
    than 1 minute to boot up. |

    | Data transfer rate | Relatively consistent IO speed for relatively sequential
    IO. Performance is reduced when the portion of random smaller blocks is large.
    Typical value ranges from around 300MB/s to 2500MB/s for consumer products (commonly
    speed around 500MB/s at 2017). Up to multi-gigabyte per second for enterprise
    class. | Heavily depends on RPM, which usually ranges from 3,600 to 15,000 (although
    20,000 RPM also exists). Typical transfer speed at about 200 MBps for 3.5-inch
    drive at 7200 RPM. Some high-end drives can be faster, up to 300 MBps. TPI and
    SPT are also influential factors. |

    | Read performance | Generally independent on the data location in SSD. In few
    cases, sequential access may be affected by fragmentation. | Random seek is expensive.
    Fragmented files lead to the location of the data in different areas of the platter;
    therefore, response times are increased by multiple seeks of fragments. |

    | Write performance | Write amplification may occur.^([⁶](#fn6)) Wear leveling
    techniques are implemented to get this effect. However, the drive may unavoidably
    degrade at an observable rate due to SSD’s nature. | CMR has no issue with write
    amplification. However, SMR may have an issue due to the out-of-place-update.
    GC is also required. |

    | Impacts of file system fragmentation | Relatively limited benefit to reading
    data sequentially, making fragmentation not significant for SSDs. Defragmentation
    would cause wear with additional writes.^([⁷](#fn7)) | Many file systems get fragmented
    over time if frequently updated. Optimum performance maintenance requires periodic
    defragmentation, although this may not be a problem for modern file systems due
    to node design and background garbage collection. |

    | Noise (acoustic) and vibration | SSDs are basically silent without moving parts.
    Sometimes, the high voltage generator (for erasing blocks) may produce pitch noise.
    Generally insensitive to vibration. | The moving parts (e.g., heads, actuator,
    and spindle motor) make characteristic sounds of whirring and clicking. Noise
    levels differ widely among models, and may be large.^([⁸](#fn8)) Mobile disks
    are relatively quiet due to better mechanical design. Generally sensitive to vibration.^([⁹](#fn9))
    |

    | Data tiering | Hot data may move from slow devices to fast devices. It usually
    works with HDDs, although in some implementations, fast and slow SSDs are mixed.
    | HDDs are usually used as a slow tier in a hybrid system. Some striped disk arrays
    may provide comparable sequential access performance to SSDs. |

    | Weight and size | Essentially small and lightweight due to the internal structure.
    They usually have the same form factors (e.g., 2.5-inch) as HDDs, but thinner,
    with plastic enclosures. The M.2 (Next Generation Form Factor) format makes them
    even smaller. | HDDs are usually heavier than SSDs, since their enclosures are
    made of metal in general. 2.5-inch drives typically weigh around 200 grams while
    3.5-inch drives weigh over 600 grams (depending on the enclosure materials, motors,
    disc magnets/number, etc.). Some slim designs for mobile could be less than 6mm
    thin. |

    | Reliability and lifetime | NO mechanical failure. However, the limited number
    of write cycles for each block may lead to data loss.^([^(10)](#fn10)) A controller
    failure can lead to an unusable SSD. Reliability differs quite considerably depending
    on different manufacturers, procedures, and models.^([^(11)](#fn11)) | Potential
    mechanical failures from the resulting wear and tear. The storage medium itself
    (magnetic platter) does not essentially degrade from R/W accesses.^([^(12)](#fn12))
    |

    | Cost per capacity^([^(13)](#fn13)) | Consumer-class SSD’s NAND chip pricing
    has dropped rapidly: US$0.60 per GB in April, 2013, US$0.45, $0.37 and $0.24 per
    GB in April 2014, February 2015, and September 2016, respectively. The speed has
    slowed down since late 2016. Prices may change after 3D NAND becomes common.^([^(14)](#fn14))
    | Consumer HDDs cost about US$0.032 and $0.042 per GB for 3.5-inch and 2.5-inch
    drives in May 2017. The price for enterprise HDDs is generally more than 1.5 times
    over that for consumers. Relatively stable prices in 2017 may be broken after
    MAMR/HAMR release. |

    | Storage capacity | Sizes up to 60TB by Seagate were available as of 2016. 120
    to 512GB models were more common and less expensive. | HDDs of up to 10TB and
    12TB were available in 2015 and 2016, respectively. |

    | Read/write performance symmetry | Write speeds of less costly SSDs are typically
    significantly lower than their read speeds. (usually `≤`1/3). Similar read and
    write speeds are expected in high-end SSDs. | Most HDDs have slightly longer/worse
    seek time for writing than for reading due to the longer settle time. |

    | Free block availability and TRIM command | Write performance is significantly
    influenced by the availability of free, programmable blocks. The TRIM command
    can reclaim the old data blocks no longer in use; however, fewer free blocks cause
    performance downgrade even with TRIM. | CMR HDDs do not gain benefits from TRIM
    because they are not affected by free blocks. However, SMR performance is also
    restricted by the available of free zones. TRIM is required for dirty zones sometimes.
    |

    | Power consumption | High performance flash-based SSDs generally require 1/2
    to 1/3 of the power of HDDs. Emerging technologies like PCM/RRAM are more energy-efficient.^([^(15)](#fn15))
    | 2.5-inch drives consume 2 to 5 watts typically, while some highest-performance
    3.5-inch drives may use around 12 watts on average, and up to about 20 watts.
    Some special designs for green data centers send the disk to idle/sleep when necessary.
    1.8-inch format lower-power HDDs may use as little as 0.35 watts in idle mode.^([^(16)](#fn16))
    |'
