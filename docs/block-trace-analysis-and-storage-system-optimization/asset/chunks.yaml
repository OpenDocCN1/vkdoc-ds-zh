    # 4. Trace Analysis


    Trace analysis provides insights into workload properties and IO patterns, which
    are essential for storage system tuning and optimizing. This chapter discusses
    how the workload interacts with system components, algorithms, structures, and
    applications.


    ## Interactions with Components


    As discussed in Chapter [1](#468166_1_En_1_Chapter.xhtml), different storage devices
    may have large different properties. In addition, their internal structures and
    algorithms also have significant impacts on the final performance. For example,
    write cache of HDDs can gain benefits from data locality:


    - Write cache hits can avoid some disk mechanical writes; instead, the dirty blocks
    in DRAM cache are overwritten. It is a benefit of temporal locality.

    - Larger cache space means longer write queue: physically contiguous dirty blocks
    can be grouped into a single IO operation. It is a benefit of spatial locality.

    - An advanced replacement policy efficiently places cold data onto a disk while
    keeping the hot data in cache via exploring both spatial and temporal locality.

    - The cache can temporarily absorb the write burst and distribute the write load
    evenly over time to minimize the impact to concurrent IOs.


    For HDD with MBC, write cache can provide log access for write burst, and thus
    give a better arrangement for grouped I/O access. In this section, I mainly discuss
    the HDD and SSD factors that influence the performance.'
