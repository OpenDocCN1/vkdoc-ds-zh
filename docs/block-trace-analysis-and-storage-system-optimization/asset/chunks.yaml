  trans: '

    ### 工作负载属性


    与工作负载强度相关的两个重要概念是`BSU`（业务扩展单元）和`ASU`（应用存储单元）。每个`BSU`由三个`ASU`组成：`ASU1`用于数据存储，权重为
    45%；`ASU2`用于用户存储，权重为 45%；`ASU3`用于日志，权重为 10%。这总共对应每个`ASU`五个 IOPS。


    访问模式有三种类型：随机（均匀分布）、顺序和（随机游走访问）模式。详细信息见表 5-3，并在表 5-4 中进一步总结。表 5-5 表明，小尺寸请求（8 和
    16 个块）占比超过 85%。随机游走是马尔可夫链的一个重要模型。表 5-6 展示了该模型的主要特征。


    **表 5-6** SPC-1C 随机游走模式


    | ASU | 1-1 | 1-2 | 1-3 | 1-4 | 2-1 | 2-2 | 2-3 | 3-1 | 总和 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | **读** | 0 | 0.1405 | 0 | 0.105 | 0 | 0.021 | 0 | 0 | 0.2665 |

    | **写** | 0 | 0.1405 | 0 | 0.105 | 0 | 0.049 | 0 | 0 | 0.2945 |


    **表 5-5** 尺寸分布


    | 尺寸分布 | 概率 | 尺寸分布 | 概率 |

    | --- | --- | --- | --- |

    | 8 | 0.7684 | 64 | 0.03088 |

    | 16 | 0.09264 | 128 | 0.03088 |

    | 32 | 0.0772 | | |


    **表 5-4** SPC-1C 工作负载比例


    | 工作负载比例 | ASU1 | ASU2 | ASU3 |

    | --- | --- | --- | --- |

    | ASU i/总计 | 0.596 | 0.123 | 0.281 |

    | ASU i 中随机读 | 0.02936 | 0.0439 | 0 |

    | ASU i 中顺序读 | 0.11745 | 0.28455 | 0 |

    | ASU i 中模式读 | 0.41191 | 0.17073 | 0 |

    | ASU i 中随机写 | 0.02936 | 0.10244 | 0 |

    | ASU i 中顺序写 | 0 | 0 | 1 |

    | ASU i 中模式写 | 0.41191 | 0.39837 | 0 |


    **表 5-3** SPC-1C 工作负载分解


    | ASU | 1-1 | 1-2 | 1-3 | 1-4 | 2-1 | 2-2 | 2-3 | 3-1 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 强度 | 0.035 | 0.281 | 0.07 | 0.21 | 0.018 | 0.07 | 0.035 | 0.281 |

    | 读/写 | 0.5 | 0.5 | 1 | 0.5 | 0.3 | 0.3 | 1 | 0 |

    | 随机 | 1 | 0 | 0 | 0 | 1 | 0 | 0 | 0 |

    | 模式 | 0 | 1 | 0 | 1 | 0 | 1 | 0 | 0 |

    | 顺序 | 0 | 0 | 1 | 0 | 0 | 0 | 1 | 1 |

    | 比例 | 1-1 | 1-2 | 1-3 | 1-4 | 2-1 | 2-2 | 2-3 | 3-1 |

    | 随机读 | 0.0175 | 0 | 0 | 0 | 0.0054 | 0 | 0 | 0 |

    | 顺序读 | 0 | 0 | 0.07 | 0 | 0 | 0 | 0.035 | 0 |

    | 模式读 | 0 | 0.1405 | 0 | 0.105 | 0 | 0.021 | 0 | 0 |

    | 随机写 | 0.0175 | 0 | 0 | 0 | 0.0126 | 0 | 0 | 0 |

    | 顺序写 | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0.281 |

    | 模式写 | 0 | 0.1405 | 0 | 0.105 | 0 | 0.049 | 0 | 0 |


    从表 5-7 中还可以发现，写访问和模式访问占主导地位，这显示了自相似性和写缓存在基准测试中的重要性。


    **表 5-7** 基本 IO 模式分布


    | 读/写 | 比例 | 模式 | 比例 |

    | --- | --- | --- | --- |

    | 读 | 0.3944 | 随机 | 0.053 |

    | 写 | 0.6056 | 顺序 | 0.386 |

    | | | 模式 | 0.561 |


    ### 合成轨迹


    利用所有这些参数，你实际上可以编写自己的合成轨迹生成器。因此，它提供了更大的灵活性，可以更改你感兴趣的任何参数，例如磁盘大小、`BSU`、模拟时间，甚至 SPC-1C
    的配置，如`ASU`、每个`BSU`的 IOPS、分布模式等。例如，你可以将`ASU`与`BSU`分离，以观察不同应用（数据存储、用户存储和日志/顺序写入）而非混合工作负载的影响，并更改分布（例如，到达间隔时间、请求大小等）以满足更具体的要求。此外，你可以将生成器作为合成生成器组件集成到其他工具包中，例如`Disksim`
    [54] 和`IOMeter`。图 5-1、5-2 和 5-3 展示了由总线分析器捕获的真实轨迹与基于 MATLAB 的工具（见附录 A）生成的合成轨迹之间的对比。


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig3_HTML.jpg](img/468166_1_En_5_Fig3_HTML.jpg)


    **图 5-3** SPC-1C 轨迹时间分布


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig2_HTML.jpg](img/468166_1_En_5_Fig2_HTML.jpg)


    **图 5-2** SPC-1C 空间分布


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig1_HTML.jpg](img/468166_1_En_5_Fig1_HTML.jpg)


    **图 5-1** 到达间隔时间直方图


    从图 5-1 中，你可以看到到达间隔时间近似于指数分布。如你所知，工作负载由来自三个`ASU`的八种不同类型的 IO 流混合而成。在图 5-2 的空间分布中，可以看到一些高强度流。通常，生成的随机读/写
    IO 流与真实工作负载一致，但在轻负载下，顺序 IO 流并不十分接近。一个可能的原因是，真实工作负载并非由与随机游走模型完全相同的参数生成。事实上，很难使时间分布完全对齐。然而，图
    5-3 中的结果是相当可接受的。

