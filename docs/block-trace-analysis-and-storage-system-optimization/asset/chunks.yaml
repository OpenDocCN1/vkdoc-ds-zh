- fmt: "# Interactions with Applications\n\nAs discussed in Chapter [2](#468166_1_En_2_Chapter.xhtml),\
    \ the metrics of different applications may have large differences [35]. Table\
    \ [4-3](#468166_1_En_4_Chapter.xhtml#Tab3) provides a simple comparison of typical\
    \ requirements among some common applications.^([^(55)](#fn55)) Due to the significant\
    \ variation of requirements from one to another, it imposes different demands\
    \ on the storage systems. Chapter [8](#468166_1_En_8_Chapter.xhtml) will illustrate\
    \ the IO pattern of a Hadoop system with `HDFS` for big data applications, while\
    \ Chapter [9](#468166_1_En_9_Chapter.xhtml) will discuss one of the most popular\
    \ distributed storage systems, `Ceph`.\n\n**Table 4-3** Typical Requirements for\
    \ Some Applications\n\n| | HPC data storage | Cloud Storage | HDFS/Mixed | Archive/Backup\
    \ | HPC check pointing data | Database |\n| --- | --- | --- | --- | --- | ---\
    \ | --- |\n| Attribute | Near term data storage: Seq., high-TP WORM operations\
    \ | Traditionally batch IO seq. read/write | Traditionally batch IO seq. read/write\
    \ | Write once, read infrequently | Checkpoint operations: Bursty, high-TP operations\
    \ | Transactional: Small IO read, modify write |\n| Latency | Similar demands\
    \ of cloud storage. Generally Ethernet, sometimes IB. | Between 10 and 100ms |\
    \ Between 10 and 100ms | High latency expected (¿=10s); Amazon glacier at 3-5\
    \ hours | 1-2 ms; up to 45us for >1kb data transfers | Faster the better, 0-10ms\
    \ but can be 90ms before issues |\n| IOPS/Tput | Many different offerings. Vendor-specific\
    \ storage specs vary. | 100s to 10k IOPS depending on size of instance | Disk\
    \ perf. dependent, little observable overhead to impede HW perf. | LTO4 tape is\
    \ 120MB/s with 22s latency | 10K+ IOPS per 4U unit System performance usually;\
    \ | Usually 1K-30K IOPS, up to 1-10M+ level; implementation is platform-specific;\
    \ |\n| Other | Usually for scientific data analysis, not super computer checkpoint\
    \ storage. | High availability (4/5 of 9); high data durability (9/11 of 9) |\
    \ In-place data analysis capability | High data durability is expected with infrequent\
    \ data access | Communicates over dedicated IB 84.8TB per shelf | Supports ACID\
    \ semantics |\n\nFootnotes [1](#468166_1_En_4_Chapter.xhtml#Fn1_source) [2](#468166_1_En_4_Chapter.xhtml#Fn2_source)\
    \ [3](#468166_1_En_4_Chapter.xhtml#Fn3_source)\n\n# Case Study: Benchmarking Tools\n\
    \nBenchmark tools are useful to provide some “standard” performance indexes for\
    \ storage systems with specific requirements. This chapter shows how to identify\
    \ the access pattern of benchmark results. The first tool is `SPC-1C` from the\
    \ Storage Performance Council (SPC). After capturing the pattern, I developed\
    \ a synthetic emulator to match the real traces. The second tool is `PCMark` from\
    \ FutureMark. I illustrate how to use gain-loss analysis to improve cache algorithm\
    \ efficiency.\n\nStorage performance benchmarks assess the relative performance\
    \ of storage systems by running a number of standards tests and trails, via a\
    \ tool or a set of programs with or without specific hardware equipment supported.\
    \ Below are some benchmark tools that are often used for active trace collection:\n\
    \n- **Synthetic trace**.\n  - The user can specify test scenarios for queue depth,\
    \ request size, transfer rate, sequence, etc. It is good to determine corner case\
    \ behavior.\n  - Examples: `IOMeter`, `VDBench`, `fio`, `IOzone`, `iorate`, `sqlio`,\
    \ `diskspd`^([^(56)](#fn56))\n\n- **Application-based trace**.\n  - The user can\
    \ choose specific applications with predefined workload patterns. It is good to\
    \ illustrate real world cases.\n  - Examples: `SysMark`,^([^(57)](#fn57)) `PCMark`,\
    \ `SPC` (Storage Performance Council, e.g., `SPC-1`, `SPC-2`), `TPC` (Transaction\
    \ Processing Council, e.g., `TPC-A/B/C/D/H/W`),^([^(58)](#fn58)) `SPEC` (Standard\
    \ Performance Evaluation Corporation, e.g., `HPC/SFS/JVM/SDM`),^([^(59)](#fn59))\
    \ `Jetstress`,^([^(60)](#fn60)) `COSbench`^([^(61)](#fn61))\n\n- **Real trace**.\n\
    \  - The user can input the real-world trace directly. It is useful when the user\
    \ attempts to test similar applications in different systems.\n  - Example: `AnandTech\
    \ Storage Bench`^([^(62)](#fn62))\n\nTable [5-1](#468166_1_En_5_Chapter.xhtml#Tab1)\
    \ gives a simple comparison of some commonly used tools, where the letters W,\
    \ L, and U in the OS column indicate Windows, Linux, and Unix, respectively.\n\
    \n**Table 5-1** A Comparison of Some Common Benchmark Tools\n\n| | Block | File\
    \ | Posix | OS | S/C | Open | Latest |\n| --- | --- | --- | --- | --- | --- |\
    \ --- | --- |\n| `Iometer` | Y | - | - | WLU | S/C | Y | 1.1.0/2014 |\n| `IOzone`\
    \ | Y | Y | Y | WLU | S | Y | 2006 |\n| `Bonnie++` | Y | | | LU | S | Y (GPL2)\
    \ | 1.0.1 |\n| `dbench` | Y | Y | Y | LU | S/C | Y (GNU) | 2008 |\n| `Filebench`\
    \ | Y | Y | Y | LU | S | Y | 2011 |\n\nFor large-scale systems, the traditional\
    \ tools may be insufficient (e.g., lack of measurement metrics) or inconvenient\
    \ (e.g., no integrated user interface) enough. Therefore, some dedicated tools\
    \ are proposed, such as `HiBench`,^([^(63)](#fn63)) `Berkely BDB`,^([^(64)](#fn64))\
    \ `BigDataBench`,^([^(65)](#fn65)) and `BigBench`^([^(66)](#fn66)) for big data\
    \ benchmarks, in particular, the Hadoop/Spark systems.\n\nA general benchmark\
    \ procedure is shown in Table [5-2](#468166_1_En_5_Chapter.xhtml#Tab2) [52]. Note\
    \ that there exist other classification methods. For example, three types are\
    \ named as micro-benchmark in lower-level system operation (e.g., evaluating `HDFS`\
    \ operations on modern cluster), functional/components benchmarks in high-level\
    \ functions (e.g., `Terasort`, basic SQL), application-level benchmarks (e.g.,\
    \ overall system performance for a given application scenario). For more details,\
    \ refer to [41, 35].\n\n**Table 5-2** Five Steps for General Benchmarks\n\n| Steps\
    \ | Remarks |\n| --- | --- |\n| Choose the proper configuration. | Select the\
    \ proper type of benchmark, such as macro-benchmark (overall test for the full\
    \ system), micro-benchmark (few operations to check partial changes), or trace-based.\
    \ |\n| Choose the correct environment. | Consistent hardware and software settings,\
    \ and some factors, such as cache status, HDD zoned constant angular velocity,\
    \ file system aging, nonessential processes, etc. |\n| Run the benchmark. | Identical\
    \ run for repeatability, multiple rounds for accuracy with small standard deviations\
    \ or high confidence level, sufficient running time for steady state, automatic\
    \ run via suitable scripts. |\n| Present the results. | Statistical results with\
    \ small confidence-interval and near normal distribution |\n| Validate the results.\
    \ | Reproduce/confirm the results or compare with other similar ones. |\n\n##\
    \ SPC-1C\n\nThe Storage Performance Council (SPC) provides several benchmarking\
    \ tools under different levels. `SPC-1C` [53] is designed to be vendor/platform\
    \ independent and is applicable for a wide range of storage component products,\
    \ such as disk drives, host bus adapters (HBAs), intelligent enclosures, and storage\
    \ software such as logical volume managers."
