  trans: '

    # 性能一致性验证


    性能一致性是企业存储系统的一项基本要求，它保证了在相同条件下性能的可重复性。有多种方法可以对此进行检查。表 9-3 对此进行了总结。


    表 9-3


    三种方法的比较


    | 指标 | 优点 | 缺点 |

    | --- | --- | --- |

    | 假设检验 | 全局视角，信息相对完整；严格意义上的一致性。 | 难以满足 |

    | 仅平均值 | 简单且相对容易满足 | 仅关注平均值，信息有限，视角片面 |

    | 范围容差 | 工程师的实践视角；易于检查。 | 视角片面；通常依赖于实验。 |


    第一种是假设检验方法，实际上可用于检验两个或多个样本在统计意义上是否具有相同的均值（和方差）、中位数或分布。一个简单的流程如下：


    1.  检查所有轮次的测试是否都处于稳态。

    2.  将每轮测试的稳态数据作为一个样本向量，进行整体一致性检验或两两（配对）检验。

    3.  根据不同的需求/假设，选择合适的假设检验方法。


    一些常见的假设检验方法应用于不同场景：


    -   **F 检验：** 要求每个样本向量服从正态分布；如果最终的 `p-value` 小于预设的显著性水平（默认为 0.05），则拒绝这些样本具有相同均值的假设。

    -   **H 检验：** 要求每个样本向量服从连续分布（条件较弱）；如果最终的 `p-value` 小于预设的显著性水平（默认为 0.05），则拒绝这些样本具有相同中位数的假设。

    -   **T 检验：** 仅适用于配对独立检验；如果最终的 `p-value` 小于预设的显著性水平（默认为 0.05），则拒绝这些样本具有相同分布的假设。


    这种方法实际上给出了一个相对严格意义上的结果。然而，在大多数情况下，你可能允许存在一些差异。


    第二种方法使用简化的统计方法，仅关注平均值而不考虑整体趋势，通常仅用于粗略估计：


    1.  获取每次测试（可能处于稳态）中关注指标的平均值。

    2.  用所有轮次的平均值构成一个样本向量。

    3.  检验该向量是否服从具有可接受方差的正态分布（或其他实验性分布，如均匀分布）。


    第三种是范围容差方法，它检查性能是否处于我们实验上可以容忍/允许的某个区域内：


    1.  检查每次运行的值是否在该次运行均值或预期实验值的某个范围内。有两种情况：一种要求所有数据点（如延迟）都在范围内，另一种仅要求几乎所有数据点（如吞吐量）都在范围内。

    2.  检查每次运行的平均值是否在所有运行均值的某个范围内。


    这种方法通常需要专家设定合适的阈值，以构建一个合理的范围。


    让我们看一个例子，该例子在相同环境下进行了七轮测试，如表 9-4 所示。每轮测试包含三次随机读取和三次顺序写入访问。由于 `F-test` 要求正态性，你首先对每轮测试进行正态性检验。在某些情况下，如果无法捕获足够的数据，你可以简单地将其标记为无效。在此示例中，你可以看到，对于名为
    `rand_6` 的测试，七轮中只有两轮通过了正态性检验，并且这两轮可能具有相同的均值。总体而言，结果表明性能并非严格一致。


    表 9-4


    假设检验方法示例


    | 值 | `rand_6` | `rand_4` | `rand_2` | `write_5` | `write_3` | `write_1` |

    | --- | --- | --- | --- | --- | --- | --- |

    | 正态 | 2 | 3 | 2 | 6 | 0 | 2 |

    | 非正态 | 5 | 3 | 5 | 1 | 7 | 5 |

    | 无效 | 0 | 1 | 0 | 0 | 0 | 0 |

    | `F-value` | 3.114 | 60.405 | 3.261 | 24.002 | 24.002 | 57.901 |

    | `P-value` | 0.079 | 0 | 0.073 | 0 | –1 | 0 |

    | 结果 | 1 | 0 | 1 | 0 | –1 | 0 |


    如果你改用仅平均值和范围容差方法，你可能会在宽松的意义上得到另一种观察结果，如表 9-5 和 9-6 所示。表 9-5 显示了每轮测试的平均吞吐量（以 MBPS
    为单位），以及总体均值和标准差。表 9-6 显示了每轮测试与总体平均值之间的差异比率。你可以看到大多数比率都在 10% 以内。如果客户允许 20% 的范围，你可以说系统满足性能一致性要求。请注意，每轮测试的曲线也应在“连续”意义上满足某些范围要求。图
    9-4 展示了六项测试的一个示例。表 9-7 给出了落在均值 ± 20% 或 ± 10% 范围内的数值总数占比。如果设定 20% 的范围，你可以看到只有名为
    `write_5` 的测试不满足要求。


    表 9-7


    给定均值范围内数值的比率


    | 比率 | `rand_6` | `rand_4` | `rand_2` | `write_5` | `write_3` | `write_1` |

    | --- | --- | --- | --- | --- | --- | --- |

    | ± 0.2 | 0.91 | 1 | 0.99 | 0.44 | 1 | 0.9 |

    | ± 0.1 | 0.73 | 0.99 | 0.89 | 0.2 | 0.91 | 0.6 |


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig4_HTML.jpg](img/468166_1_En_9_Fig4_HTML.jpg)


    图 9-4


    一轮测试中六项测试的带宽


    表 9-6


    通过范围容差方法进行比较


    | 差异比率 | `rand_6` | `rand_4` | `rand_2` | `write_5` | `write_3` | `write_1` |

    | --- | --- | --- | --- | --- | --- | --- |

    | R0 | –0.160 | 0.043 | 0.146 | –0.137 | 0.006 | 0.033 |

    | R1 | –0.129 | 0.014 | 0.028 | –0.090 | 0.016 | –0.016 |

    | R2 | 0.007 | 0.046 | 0.069 | 0.045 | 0.054 | 0.127 |

    | R3 | 0.122 | –0.005 | 0.087 | 0.056 | –0.023 | 0.004 |

    | R4 | 0.102 | –0.023 | –0.006 | 0.077 | –0.043 | –0.081 |

    | R5 | 0.115 | –0.043 | –0.151 | 0.098 | 0.045 | 0.076 |

    | R6 | –0.058 | –0.032 | –0.173 | –0.048 | –0.054 | –0.143 |

    | 最大值 | 0.122 | 0.046 | 0.146 | 0.098 | 0.054 | 0.127 |

    | 最小值 | –0.129 | –0.043 | –0.173 | –0.137 | –0.054 | –0.143 |


    表 9-5


    Rados Bench 带宽汇总


    | 均值 | `rand_6` | `rand_4` | `rand_2` | `write_5` | `write_3` | `write_1` |

    | --- | --- | --- | --- | --- | --- | --- |

    | R0 | 679.72 | 1642.15 | 1613.56 | 327.86 | 1261.88 | 405.87 |

    | R1 | 704.20 | 1596.64 | 1446.77 | 345.57 | 1275.05 | 386.54 |

    | R2 | 814.66 | 1646.67 | 1503.92 | 397.04 | 1322.19 | 442.87 |

    | R3 | 907.08 | 1566.22 | 1529.88 | 401.05 | 1225.51 | 394.28 |

    | R4 | 891.53 | 1539.09 | 1399.01 | 409.12 | 1200.37 | 360.88 |

    | R5 | 902.05 | 1507.67 | 1194.60 | 416.98 | 1310.67 | 422.73 |

