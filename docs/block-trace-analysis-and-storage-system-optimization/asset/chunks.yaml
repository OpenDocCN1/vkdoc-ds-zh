    \ `Q[d1]` 和 `Q[d2]` 值。表 2-5 进一步给出了一个示例，说明如何基于 `Q[d1]` 计算队列深度。图 2-8 显示了从 Hadoop\
    \ 节点估计的队列深度。看起来平均队列深度相当高，这意味着工作负载很高。但是，放大图表以检查队列之间的间隔。在此示例中，x 轴的比例是 100 而不是 12000，以显示更多信息。\n\
    \n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig8_HTML.jpg](img/468166_1_En_2_Fig8_HTML.jpg)\n\
    \n**图 2-8** 使用来自 Hadoop 节点的到达和完成时间计算的队列深度\n\n**表 2-5** 估计的队列深度和空闲时间\n\n| 到达时间\
    \ | 完成时间 | 队列深度 | 空闲时间 |\n| --- | --- | --- | --- |\n| 0.00007 | 0.00036 | 0 |\
    \ - |\n| 0.01130 | 0.01157 | 0 | 1.09E–02 |\n| 0.01134 | 0.01288 | 1 | 0 |\n|\
    \ 0.02622 | 0.02751 | 0 | 1.33E–02 |\n| 0.02679 | 0.02772 | 1 | 0 |\n| 0.03668\
    \ | 0.03950 | 0 | 8.96E–03 |\n| 0.03962 | 0.04477 | 0 | 1.17E–04 |\n| 0.03965\
    \ | 15.07994 | 1 | 0 |\n| 0.04454 | 0.04639 | 2 | 0 |\n| 0.04486 | 0.04651 | 2\
    \ | 0 |\n| 0.05500 | 0.05526 | 1 | 0 |\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig7_HTML.jpg](img/468166_1_En_2_Fig7_HTML.jpg)\n\
    \n**图 2-7** 队列长度示意图\n\n另一个是用于机械部件实际执行的 HDD 内部队列。这里应用了一些调度算法，例如 SCAN 和 RPO（旋转定位优化），以尝试最小化给定的操作时间。可以使用供应商特殊命令（VSC）来收集内部队列信息。RPO\
    \ 试图最小化队列中请求的寻道时间和旋转延迟的总和。理论上，更长的队列意味着调度程序有更多事件可供选择，并且可以进一步减少总操作时间（对于纯随机访问）。然而，在实践中，当队列长度达到一定水平时，性能不会增加，如图\
    \ 4-2 和 4-3 所示。如果没有 VSC，我们可能只能使用外部 IO 队列状态来近似内部队列状态。这在某种意义上是合理的，因为 HDD 一次只能处理一个请求。^(³³)\
    \ 然而，对于 SSD，由于并行处理，情况要复杂得多。\n"
- fmt: '# Busy/Idle Time


    When a disk is under an IO operation (including both foreground and background
    activities), the disk is busy; otherwise, it is in idle mode. These two metrics
    are useful when you intend to design some background operations for disks, such
    as defragmentation, address remapping, sector scanning, etc. As some of these
    operations require over hundred milliseconds to complete, the estimated busy or
    idle time will be estimated to show whether the performance will be affected by
    background operations.


    However, without VSC to extract the drive internal trace log, you may not get
    the busy/idle time directly. Thus we may only approximate the time from the external
    trace when the internal trace is unavailable. The basic idea is to compare the
    completion time of requests in the queue with the new requests’ arrival time.
    If the completion time is later than the new arrival time, it means the drive
    is still busy at this arrival time. Otherwise, it is counted as idle time (although
    there may be some background activities inside disk drives; but you can assume
    that the user/external requests have higher priority than background activities).
    In other words, the calculation of idle time is heavily related to the queue depth,
    so only when queue depth is zero is there a chance to exist an idle interval.


    Let’s consider the trace in Table [2-3](#468166_1_En_2_Chapter.xhtml#Tab3). The
    completion time `0.027506s` of the first request is later than the arrival time
    of `0.026790s` of the second request, so the disk is busy at `0.026790s`. However,
    the completion time `0.027719s` of the second request is earlier than the arrival
    time `0.036680s` of the third request, you may estimate that the drive have the
    idle time of `0.036680 – 0.027719 = 0.009s`. Table [2-5](#468166_1_En_2_Chapter.xhtml#Tab5)
    shows the result.


    Figure [2-9](#468166_1_En_2_Chapter.xhtml#Fig9) has the same data set as Figure
    [2-8](#468166_1_En_2_Chapter.xhtml#Fig8). Although the queue depth is high in
    Figure [2-8](#468166_1_En_2_Chapter.xhtml#Fig8), you can still observe many idle
    intervals for the disk.


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig9_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig9_HTML.jpg)


    Figure 2-9


    Estimated idle time from a Hadoop node


    # Advanced Metrics


    The workload from the real world is usually complex. Even for those claimed as
    sequential workloads, such as a Hadoop HDFS write or Ceph Bluestore write, the
    actual IO pattern in the block level is mixed with sequence and randomness, as
    well as read and write. The advanced metrics attempt to provide insights into
    these traces.


    ## Sequence vs. Randomness


    The sequence and randomness of a workload are somehow subjective in some engineers’
    view, as it is not easy to clearly state whether a workload is more sequential
    or random when it is mixed. In addition, the “feeling” of sequence is also different
    in different cases. For example, some requests with very small gaps among them
    may be also considered as (near) sequential.


    In my view, it may be quantified under different scenarios, such as the scheduler
    algorithm, queue length, etc. That means this property is objective when all the
    conditions are fixed. For example, consider a burst workload of write requests
    within a small LBA range. Some of the requests are actually continuous in LBA,
    although they do not arrive in order. If a FIFO scheduling policy is applied,
    this workload is random, as the disk has to seek to different locations for each
    request. When a simple SCAN or RPO scheduling algorithm is applied, the requests
    will be reordered and some will become sequential, if there is a long enough queue.
    Assume that there are `N` requests. So there are up to `N−1` seeks (in a strict
    definition, a request is considered as a random one, if there is a seek in term
    of LBA). Let the random access number as `N[r]` and sequential access as `N[s]`,
    so you can obtain a ratio of randomness vs. sequence for a given workload under
    a fixed scenario.


    ### Sequential and Near Sequential Streams


    This metric directly indicates the sequence degree of the workload. In general,
    a command is sequential when it comes after a similar command whose requested
    block LBAs just prior to this new command. Hence, sequential reads follow read
    commands and sequential writes follow write commands; but there are some subtleties
    to this definition. *(Strictly) sequential stream* means that the current and
    previous commands are of the same type (r/w) and the new command’s starting LBA
    immediately follows the previous one. *Near sequential stream* means that there
    must be an earlier command of the same type (read or write) whose LBA range comes
    before and near the start of this new command. For a sequential stream, multiple
    streams may interleave with each other. There are user settings to affect these
    subtleties, allowing us to describe the variations of sequential command situations.


    **Queued sequence stream:** In a time-order request stream, some are adjacent
    to each other (possible within a time window), such that `last LBA(r[i]) + 1 =
    first_LBA(r[j])`, where `i < j`, `D[j] – D[i] < δt` and `δt > 0` is an aging time.


    In this way, `j ≥ i + 1` is possible because of interleaved sequence streams.
    However in practice, a command queue with queue length `N` is required to identify
    the sequence, instead of only checking the exactly adjacent requests wherein.
    Once a new request enters the queue, it searches the queue to check the sequence
    match. If a match is found, it’s merged into the queue; otherwise, it adds a new
    entry to the queue. If the queue is full, it removes the entry using a replacement
    rule (e.g., FIFO or LRU).


    Generally, the larger `N`, the larger number of sequence requests detected (`M[2]`)
    in each stream, and the smaller number of sequence streams (`M[1]`). The key is
    to find a large enough `N` such that the number of sequence streams detected is
    stable.


    **Queued sequence stream with constraint:** In practice, a large block request
    `S` (e.g., `S ≥ 1024`) is also counted as a sequential request. Hence an alternative
    method in considering the stream `i` is to determine the total size of a stream
    `S[i]` together with `M[2]`, so if `S[i] ≥ S` and `M[2] ≥ M`, then `i` is considered
    a sequence stream, where `S` and `M` are thresholds.


    **Queued near-sequence stream:** Finally, it is possible that a small gap between
    LBA requests exists such that in a time-ordered request stream, some requests
    are near to each other within a time window. Once a new request is considered
    near-sequential to the previous one, the stream’s last LBA is updated as the new
    request’s last LBA (hole is filled for simplicity), so `last LBA(r[i]) + 1 ≤ first
    LBA(r[j])` and `last LBA(r[i]) + δd ≥ first LBA(r[j])`, where `i < j` and `0 <
    D[j] – D[i] < δt`. `δd > 0` is a small integer in blocks, such as 64. A command
    queue is required to detect the interleaved streams and the size constraints are
    also applicable to near-sequence streams. See Figure [2-10](#468166_1_En_2_Chapter.xhtml#Fig10).


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig10_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig10_HTML.jpg)


    Figure 2-10


    An example of near sequence stream'
