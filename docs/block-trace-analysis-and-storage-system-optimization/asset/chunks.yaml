- fmt: '### Cache Size


    We begin with the question of “how much DRAM is used as write cache during WCD?”
    First, let’s make sure that the test is repeatable (or the result is consistent).
    In order to verify this, perform the following procedure.


    1.  Connect SSHD to the XGIG bus analyzer and power off/on SSHD.

    2.  Send 100 random write 8K requests to SSHD using IOMeter or another tool, and
    repeat the same requests 10 times.

    3.  Repeat Steps 1-2 for 4 times with the same requests.

    4.  Compare and find the access pattern for the XGIG traces via a trace analyzer
    tool.

    5.  Repeat Steps 1-4 with the request number changed to 200 and 400.

    6.  Do the same test on a different SSHD with the same IO pattern.


    In Step 4, a similar access pattern (LBA vs. CCT) should be observed. Note that
    you are checking DRAM write cache in this case, so only a random write request
    is used. For a full cache check, you may also try random read, mixed read/write,
    and mixed random/sequential patterns. If a similar pattern is observed, you may
    conclude that the result is consistent and useful to identify some inside information.
    Otherwise, you shall find out the reasons. One is that the SSD/DRAM cache is not
    cleaned before a new test. Therefore, you need some cache flush commands or disk
    initialization commands to force it empty. Also note that:


    *   R/W DRAM cache may share the same space.

    *   The SSD mapping table may share the same space with R/W DRAM cache (a good
    case: SSD mapping table uses a dedicated DRAM space).

    *   The SSD reboot self-learning procedure may take DRAM space.


    Second, implement the following procedure to make sure each test starts with a
    clean cache:


    1.  Power off/on SSHD (make sure the DRAM write cache is cleared).

    2.  Send 1000 random 8K write requests to SSHD with queue depth=1 using IOMeter.

    3.  Repeat Steps 1-2 for 10 times each with different request sizes, such as 16K,
    32K, 64K, 128K, ..., 2048K.


    Once you capture the traces, some post-processes shall be made:


    1.  Count the write DRAM hit number at the first portion of the total accesses
    for each run by isolating DRAM accesses from others (DRAM CCT/qCCT is generally
    much smaller than others).

    2.  Choose the maximum number of each count.

    3.  Calculate the hit numbers and the corresponding actual cache size.

    4.  Find the turning point, which provides a hint of the cluster size.

    5.  Refine the turning point by narrowing the region. For example, if the turning
    point is within [256K-512K], then some more points, such as 300K, 400K, and 500K,
    may be used.


    Note that this model of SSHD has read-cache only SSD so that DRAM access will
    not be mixed with SSD write access, which simplifies the analysis in Figures [6-2](#468166_1_En_6_Chapter.xhtml#Fig2)-[6-5](#468166_1_En_6_Chapter.xhtml#Fig5).
    Figure [6-2](#468166_1_En_6_Chapter.xhtml#Fig2) shows the traces from IOMeter
    random write tests (request size from 1K to 1M). Assume that the write cache is
    empty.^([^(68)](#fn68)) Then the first portion of each run could be the DRAM write
    cache hit.


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig2_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    IOmeter traces for SSHD


    Zoom into the system to find out the hit. Figures [6-3](#468166_1_En_6_Chapter.xhtml#Fig3),
    [6-4](#468166_1_En_6_Chapter.xhtml#Fig4), and [6-5](#468166_1_En_6_Chapter.xhtml#Fig5)
    give three examples where the request sizes are 1KB, 512KB, and 1MB, respectively.
    In Figures [6-3](#468166_1_En_6_Chapter.xhtml#Fig3) and [6-4](#468166_1_En_6_Chapter.xhtml#Fig4),
    you can observe obvious write cache hits, and the total hit number for 1KB is
    much larger than that of 512KB due to limited cache size. However, when the size
    is increased to 1MB, no obvious write cache is observed, or it means that one
    threshold between 512K and 1M is set as the turning point for different size requests.
    This also indicates that large size requests will go directly to the media. With
    the same steps, you can actually get the required values for WCD and WCE, as shown
    in Tables [6-2](#468166_1_En_6_Chapter.xhtml#Tab2) and [6-3](#468166_1_En_6_Chapter.xhtml#Tab3).


    Table 6-3


    Two Cases Under WCD of SSHD


    | SSHD (WCD) | test1 |   | test2 |   |

    | --- | --- | --- | --- | --- |

    | size | Counted number | Size | Counted number | Size |

    | --- | --- | --- | --- | --- |

    | 1K | 98 | 0.1M | 101 | 101K |

    | 4k | 100 | 0.4M | 100 | 400K |

    | 16K | 99 | 1.5K | 100 | 1600K |

    | 64K | 101 | 6.3K | 101 | 6464K |

    | 128K | 54 | 6.75M | 54 | 6.75M |

    | 256K | 26 | 6.5M | 26 | 6.5M |

    | 512K | 12 | 6.0M | 13 | 6.5M |

    | 520K | - | - | 12 | 6.1M |


    Table 6-2


    Comparison Under WCE


    | SSHD | CMR A |

    | --- | --- |

    | Size | Counted number | Size | Size | Counted number | Size |   |

    | --- | --- | --- | --- | --- | --- | --- |

    | 1K | 98 | 0.1M | 1K | 98 | 0.1M |   |

    | 4k | 98 | 0.4M | 4k | 98 | 0.4M |   |

    | 16K | 97 | 1.5M | 16K | 99 | 1.5M |   |

    | 64K | 102 | 6.4M | 64K | 102 | 6.4M | 2 |

    | 128K | 103 | 12.9M | 128K | 104 | 12.9M |   |

    | 256K | 111 | 27.8M | 256K | 110 | 27.8M |   |

    | 512K | 115 | 57.5M | 512K | 66 | 33M |   |

    | 520K | - | - | 880K | 35 | 30M |   |

    | 900K | - | - | 900K | 42 | 36.9M |   |

    | 1024K | N.A. | - | 1000K | 36 | 36M |   |


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig5_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    1024K request trace details


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig4_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    512K request trace details


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig3_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    1K request trace details


    From the turning point, you may also guess the cache cluster/segment size. For
    example, SSHD’s cluster size is around 64K for write during WCD, and CMR A is
    around 256KB. SSHD uses up to 60MB DRAM space as write cache when WCE, while only
    around 8MB is used for WCD with some 100 segments.'
