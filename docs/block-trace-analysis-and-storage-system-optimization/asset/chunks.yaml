  raw: '## Performance Consistency Verification


    Performance consistency is a basic requirement for enterprise storage systems
    and it guarantees the performance repeatability at the same conditions. There
    are several approaches to check it. Table [9-3](#468166_1_En_9_Chapter.xhtml#Tab3)
    gives a summary.


    Table 9-3


    Comparison of Three Approaches


    | Metrics | Pro | Con |

    | --- | --- | --- |

    | Hypothesis | Full view with relatively full information; consistency in a relatively
    strict sense. | Hardly satisfied |

    | Average only | Simple and relatively easily satisfied | Partial view with limited
    information on average only |

    | Range tolerance | Engineer’s view in practice; easy to check. | Partial view;
    usually experiment dependent. |


    The first one is the hypothesis approach, which actually can be used to test whether
    two or more samples have the same mean (and variance), median, or distribution
    in statistical sense. A simple procedure is as follows:


    1.  Check if all rounds of tests have steady state.


    2.  Use the steady state of each round as a sample vector for an overall consistency
    test or one-two-one (paired) test.


    3.  Select a proper hypothesis test for different requirements/assumptions.


    Some common hypothesis tests are used in different scenarios:


    *   **F-test:** Requires each sample vector is normal distribution; if the final
    p-value is smaller than predefined significant level (0.05 by default), you reject
    the hypothesis that these samples have the same mean.


    *   **H-test:** Requires each sample vector is continuous distribution (weaker
    condition); if the final p-value is smaller than predefined significant level
    (0.05 by default), you reject the hypothesis that these samples have the same
    median.


    *   **T-test:** Applicable for paired independent tests only; if the final p-value
    is smaller than predefined significant level (0.05 by default), you reject the
    hypothesis that these samples have the same distribution.


    This approach actually gives the result in a relatively strict sense. However,
    you may allow some differences in most cases.


    The second one uses a simplified statistical method, which only concerns the average
    value without the overall trend, and is usually for rough estimation only:


    1.  Get the average values of interested metrics of each test (possibly in steady
    state).


    2.  Form a sample vector with the average values from all rounds.


    3.  Test if it follows a normal distribution (or other experimental distribution,
    such as uniform) with an acceptable variance.


    The third one is the range tolerance approach, which checks if the performance
    is within a certain region that we can tolerant/allow experimentally:


    1.  Check if each run’s value is within a certain range of this run’s mean or
    expected experimental value. There are two cases: one is required for all data
    points, such as latency, and the other is only required for almost all points,
    such as throughput.


    2.  Check if the average value of each run is within a certain range of the mean
    of all runs.


    This approach usually needs the experts to set up the proper thresholds in order
    to construct a reasonable range.


    Let’s take a look at an example with seven rounds of tests in the same environments
    in Table [9-4](#468166_1_En_9_Chapter.xhtml#Tab4). Each round contains three random
    read and three sequential write accesses. Since an F-test requires normality,
    you begin with the normal test on each round. In some cases, if you cannot not
    capture enough data, you may simply mark it as invalid. In this example, you can
    see only two rounds out of seven pass the normal test for the test named rand
    6, and the two rounds likely have the same mean. Overall, the results indicate
    that the performance is not strictly consistent.


    Table 9-4


    An Example of the Hypothesis Approach


    | Value | rand_6 | rand_4 | rand_2 | write_5 | write_3 | write_1 |

    | --- | --- | --- | --- | --- | --- | --- |

    | Normal | 2 | 3 | 2 | 6 | 0 | 2 |

    | Non-normal | 5 | 3 | 5 | 1 | 7 | 5 |

    | Invalid | 0 | 1 | 0 | 0 | 0 | 0 |

    | F-value | 3.114 | 60.405 | 3.261 | 24.002 | 24.002 | 57.901 |

    | P-value | 0.079 | 0 | 0.073 | 0 | –1 | 0 |

    | Result | 1 | 0 | 1 | 0 | –1 | 0 |


    If you switch to average-only and range tolerance approaches, you may have another
    observation in a relaxed sense, shown in Tables [9-5](#468166_1_En_9_Chapter.xhtml#Tab5)
    and [9-6](#468166_1_En_9_Chapter.xhtml#Tab6). Table [9-5](#468166_1_En_9_Chapter.xhtml#Tab5)
    shows the average throughput in MBPS for each round, as well as the overall mean
    and standard derivation. Table [9-6](#468166_1_En_9_Chapter.xhtml#Tab6) shows
    the difference ratio between each round and the overall average. You can see most
    ratios are within 10%. If the customers can allow a 20% range, you may say that
    the system satisfies the performance consistency requirement. Note that curve
    of each round shall also satisfy some range requirements in a “continuous” sense.
    Figure [9-4](#468166_1_En_9_Chapter.xhtml#Fig4) shows one example of six tests.
    Table [9-7](#468166_1_En_9_Chapter.xhtml#Tab7) gives the ratio that the total
    number of values fall into the range of *±* 20% or *±* 10% of the mean. If a 20%
    range is set, you can see that only the test named write 5 doesn’t satisfy the
    requirements.


    Table 9-7


    Ratio of Values within a Given Range Around Mean


    | Ratio | rand_6 | rand_4 | rand_2 | write_5 | write_3 | write_1 |

    | --- | --- | --- | --- | --- | --- | --- |

    | ± 0.2 | 0.91 | 1 | 0.99 | 0.44 | 1 | 0.9 |

    | ± 0.1 | 0.73 | 0.99 | 0.89 | 0.2 | 0.91 | 0.6 |


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig4_HTML.jpg](images/468166_1_En_9_Chapter/468166_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Bandwidth from six tests in one round


    Table 9-6


    Comparison via Range Tolerance Approach


    | Diff Ratio | rand_6 | rand_4 | rand_2 | write_5 | write_3 | write_1 |

    | --- | --- | --- | --- | --- | --- | --- |

    | R0 | –0.160 | 0.043 | 0.146 | –0.137 | 0.006 | 0.033 |

    | R1 | –0.129 | 0.014 | 0.028 | –0.090 | 0.016 | –0.016 |

    | R2 | 0.007 | 0.046 | 0.069 | 0.045 | 0.054 | 0.127 |

    | R3 | 0.122 | –0.005 | 0.087 | 0.056 | –0.023 | 0.004 |

    | R4 | 0.102 | –0.023 | –0.006 | 0.077 | –0.043 | –0.081 |

    | R5 | 0.115 | –0.043 | –0.151 | 0.098 | 0.045 | 0.076 |

