  trans: '

    # 7. 案例研究：RAID


    RAID 是当今世界应用最广泛的数据保护策略之一 [23, 60, 61, 62, 63]。与单磁盘访问相比，它具有独特的特性，例如文件同步、恢复等。因此，它产生了一些与其他方式不同的独特
    IO 模式。本章基于两个应用场景中的 RAID 5 示例进行分析。两个跟踪记录之间观察到了巨大差异。本章还分析了这些工作负载是否适用于 SMR 驱动器。此外，还提供了一些建议以提升系统性能。


    RAID 的概念于 1987 年被引入，旨在利用商用硬盘的潜力。Patterson 等人 [64] 于 1988 年正式确立了 RAID 分类法。RAID
    通过将一组低容量磁盘暴露为一个虚拟的单个大型昂贵磁盘（SLED），克服了商用磁盘的容量限制。


    RAID 技术通常需要通过数据条带将数据分布到多个磁盘上。条带代表阵列中最小的保护单元，因此条带内任何丢失的数据都可以仅使用该条带内幸存的数据进行恢复。早期，由于客户端通过串行访问通道连接到
    RAID，因此并未明确支持多客户端的并行访问。然而，随着许多先进排队调度程序的发展，为了充分利用多磁盘的优势，并行性现在已广泛应用于 RAID 系统中。


    RAID 系统中存在一些常见的性能问题 [20, 62, 63]，例如小写问题、同步问题、降级（恢复和重建）期间的性能损失等。


    小写问题存在于许多关键应用中，例如在线事务处理（OLTP）系统。这些应用通常包含许多读-修改-写（RMW）访问。这给 RAID 系统带来了一些问题。首先，在条带化阵列中进行写入操作，需要在写入新数据和新校验块之前，同时读取数据块和校验块，并计算新的校验块，这比单磁盘访问多出四倍的访问次数。其次，这些小访问仅更改特定条带内的几个块，但在更新期间，整个条带的校验盘不可用。这通过减少可能的并行性，极大地降低了阵列的性能。


    同步问题源于数据完整性要求；只有当条带阵列中的所有驱动器都完成操作时，系统才会返回完成信号。由于某些磁盘可能比其他磁盘更早完成访问，因此较快的磁盘必须等待较慢的磁盘。在某些情况下，例如非关键应用、受保护的
    DRAM 等，此要求可能会放宽。在恢复期间，由于后台恢复访问，前台用户请求可能会受到很大影响 [65]。


    类似的问题也适用于使用纠删码（EC）的磁盘阵列。并且在某些情况下，由于 EC 比传统 RAID 的复杂性更高，问题可能更为关键。


    ## 工作负载分析


    你将研究来自两个不同供应商、应用于视频监控场景的两个 RAID 5 示例。将首先给出系统设置，然后分析两个不同的跟踪记录：读密集型案例和写密集型案例。


    ### 系统设置


    在第一个示例中，有 10 个 7200RPM 的 HDD，每个容量为 4TB。该系统施加了 24 个写入流和 6 个读取流。第二个示例有 36 个类似的 HDD，带有
    90 个视频通道。跟踪记录的长度分别为 620 秒和 110 秒。一些基本指标列于表 7-1 和 7-2 中。


    **表 7-2** RAID 跟踪记录 2：写密集型


    | 指标 | 总计 | 读取 | 写入 |

    | --- | --- | --- | --- |

    | `Cmd` 数量 | 21449 | 8535 | 12914 |

    | 总块大小 | 2528514 | 357824 | 2170690 |

    | 平均块大小 | 210.012 | 41.924 | 168.088 |

    | 平均 IOPS | 193.152 | 76.859 | 116.293 |

    | 平均吞吐量 (MBps) | 11.118 | 1.573 | 9.545 |


    **表 7-1** RAID 跟踪记录 1：读密集型


    |  | 总计 | 读取 | 写入 |

    | --- | --- | --- | --- |

    | 命令数量 | 7821 | 5493 (70.2%) | 2328 (29.8%) |

    | 块数量 | 5284520 | 3231312 (61.1%) | 2053208 (38.9%) |

    | 平均大小 (块) | 675.7 | 588.3 | 882 |

    | `r/s` `w/s` `rsec/s` `wsec/s` `rkB/s` `wkB/s` `IOPS` `TP(MBPS)` |

    | 8.86 3.75 5211.8 3311.6 2605.9 1655.8 12.61 4.23 |

    '
- fmt: '### Read-Dominated Trace


    The LBA distribution of requests are near sequential in this trace, as shown in
    Figure [7-1](#468166_1_En_7_Chapter.xhtml#Fig1). For reads, there are two regions.
    One is the same to the current write region, and the other is close to the previous
    write region (i.e., playback). The sizes of the read requests are mostly 512 or
    1024 blocks. However, the ratio of 1024 blocks of read is less than that of write,
    which is displayed in Figure [7-2](#468166_1_En_7_Chapter.xhtml#Fig2).


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig2_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig2_HTML.jpg)


    **Figure 7-2** Size distribution of RAID trace 1


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig1_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig1_HTML.jpg)


    **Figure 7-1** LBA distribution of RAID Trace 1


    In general, this trace has large portion of idle time, which accumulates 83.4%
    of total time. The average summation of idle time is almost evenly distributed
    over time but the large idle intervals not, as shown in Figure [7-3](#468166_1_En_7_Chapter.xhtml#Fig3).
    The intervals `>200ms` and `>500ms` count 8% and 1.7%, respectively, but occupy
    71.6% and 34% of total idle time, respectively. In fact, 65% (94%) of idle frequency
    is less than 10ms (1s), and 2% (70%) of idle time is less than 10ms (1s), as illustrated
    in Figure [7-4](#468166_1_En_7_Chapter.xhtml#Fig4). So we can conclude that the
    total idle time is long enough for small-IO-based background activities, but the
    individual long idle intervals may be not sufficient, which means GC access shall
    be completed in small steps.


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig4_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig4_HTML.jpg)


    **Figure 7-4** Idle time CDF of RAID trace 1


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig3_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig3_HTML.jpg)


    **Figure 7-3** Idle time distribution of RAID trace 1


    Besides the large idle time, note that there are some abnormally large response
    times for some requests (`> 200ms`). As you know, even for the worst case, the
    access time of a 1024-block request should not excess 60ms. Thus, the waiting
    time is too long for the two cases listed in Table [7-3](#468166_1_En_7_Chapter.xhtml#Tab3):
    1) the `CMD 529` is continuous to `530` but the write access costs over 430ms;
    2) `CMD 1015` is close to `1024` but it costs 390ms. This may be caused by 1)
    background disk activities such as log writes, metadata updates, zone switches,
    etc; or 2) RAID synchronization events. A possible solution is to evenly distribute
    tasks and actively provide idle time for background tasks.


    **Table 7-3** A Segment of RAID Trace 1


    | Start(sec) | End | ID | End | Cmd | ICT(ms) | LBA | Length |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 27.51865 | 27.53302 | 529 | 529 | W | 0.109105 | 1.21e+08 | 1024 |

    | 27.5331 | 27.96851 | 530 | 530 | W | 0.078425 | 1.21e+08 | 512 |

    | 27.9686 | 27.98473 | 531 | 531 | R | 0.086485 | 80135168 | 1024 |

    | 27.98483 | 27.987 | 532 | 532 | R | 0.10257 | 80351232 | 512 |

    | ... |   |   |   |   |   |   |   |

    | 52.73206 | 52.7429 | 1014 | 1014 | R | 0.466475 | 80690688 | 512 |

    | 53.46918 | 53.85766 | 1015 | 1015 | R | 726.2745 | 80875520 | 512 |

    | 53.85778 | 53.86006 | 1016 | 1016 | R | 0.112894 | 80876032 | 512 |

    | 53.86014 | 53.87545 | 1017 | 1017 | R | 0.083455 | 80881664 | 1024 |


    For the frequented write update shown in Figure [7-5](#468166_1_En_7_Chapter.xhtml#Fig5),
    you can see that 94.2% of the accessed blocks (maybe repeated) are only written
    once and 5.8% of the blocks are at least accessed twice and `<0.1%` of the blocks
    are written three times. This means a very low rewritten ratio. Thus you need
    to identify if large size requests or small size requests are rewritten most.
    The fact that decreasing percentage of written blocks are written multiple times
    means a tiny portion of hot blocks.


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig5_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig5_HTML.jpg)


    **Figure 7-5** Frequented update of RAID trace 1


    For the timed write update shown in Figure [7-6](#468166_1_En_7_Chapter.xhtml#Fig6),
    the total write blocks occurs 35% of total access blocks (read and write) and
    the updated blocks (at least write twice) are only 1% (1/35=2.9% rewritten blocks).
    Total write commands are 30% of the total commands and the update commands are
    1.5%. Note that the timed write update ratio is closely related to the frequented
    write update ratio; in other words, `sum(hit*(update freq-1))/total blocks = updated
    blocks/total write blocks`.


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig6_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig6_HTML.jpg)


    **Figure 7-6** Timed update of RAID trace 1


    By further considering the write stack distance in Figure [7-7](#468166_1_En_7_Chapter.xhtml#Fig7),
    you can see that the hit ratio is low and it is not necessary to have an inline
    write cache to hold these write data for a long time. Based on IOPS, to reach
    stack distance 100, it costs roughly 26.6 seconds. In this period, only 10% full
    write hit and 20% partial write hit of the overall 5% hit are observed. The updated
    size is around 43MB on average. Thus it is not worthy of compensating such a small
    hit. Note that the write hit distributes over the write range. A full hit is only
    for 512-block requests while a partial hit is for 1024-block requests in this
    trace. See Figure [7-8](#468166_1_En_7_Chapter.xhtml#Fig8) for details.


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig8_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig8_HTML.jpg)


    **Figure 7-8** Write hit distribution of RAID trace 1


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig7_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig7_HTML.jpg)


    **Figure 7-7** Stack update of RAID trace 1


    When you take SMR drive into consideration, as discussed in Chapter [6](#468166_1_En_6_Chapter.xhtml),
    you have the main characteristics summarized in Table [7-4](#468166_1_En_7_Chapter.xhtml#Tab4).
    You may understand this table together with the SMR properties introduced in Chapter
    [6](#468166_1_En_6_Chapter.xhtml). Although it is a read-dominated trace, it has
    no WORM property.


    **Table 7-4** Main Characteristics of Trace 1 for SMR


    | SMR characteristic | Observation |

    | --- | --- |

    | Sequential write | Large size write requests (`>=512` blocks) > 99.9%<br>Mode
    ratio: 50% for read & write (`Q=1`)<br>Sequential cmd ratio (`M>=2` & `S>=1024`):
    write 85% & read 90% (`Q>=50`) |

    | Write-once-read-many | `R/W`: cmd 70:30; blks 61:39<br>Stacked ROW ratio: <
    1%<br>Total write blocks occurs 2.9% of total access blocks |

    | Garbage collection (GC) | Frequent small idle time; short queue length 5.8%
    frequented WUR the updated blocks (at least write twice) are only 1% of total
    access blocks and 2.9% write blocks, so very small write update ratio and write
    amplification 103% (considering the short trace duration) |

    | Sequential read to random write | ROW ratio is 1.2, so it’s a very small read
    ratio, thus the written data is rarely likely to be immediately read back |

    | In-place or out-of-place update | Very small update ratio; not necessary to
    apply large-size SSD/DRAM/AZR cache for performance improvement (write update
    in cache) |'
