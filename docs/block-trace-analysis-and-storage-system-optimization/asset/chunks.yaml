  trans: '

    ### 总体视图


    图 8-3 展示了请求大小、IOPS 和吞吐量的一些平均值。从图中可以观察到，写入大小和 IOPS 与文件系统类型的关系更为密切，因为 EXT4 和 XFS
    之间的差异很明显。然而，读取大小和 IOPS 似乎与批次的关系更大，因为不同的批次可能有不同的读取大小。请注意，每个批次的总体吞吐量相似，这意味着每个节点的工作负载几乎均衡。^(⁷¹)
    通过去除最大值和最小值，您可以查看图 8-4 中的平均值和标准差。图中清晰地展示了不同文件系统类型的写入大小模式。图 8-5 进一步显示，写入请求的主要大小范围是
    [1–127] 个块和 1024 个块。这两个范围的比例之和几乎等于 1，这导致了在 0.475 附近近乎对称的曲线。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig5_HTML.jpg](img/468166_1_En_8_Fig5_HTML.jpg)


    图 8-5

    不同范围内的写入请求大小分布


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig4_HTML.png](img/468166_1_En_8_Fig4_HTML.png)


    图 8-4

    平均大小和 IOPS


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig3_HTML.jpg](img/468166_1_En_8_Fig3_HTML.jpg)


    图 8-3

    不同文件系统工作负载的平均值


    为了更深入地了解该跟踪记录，让我们选择一个典型的跟踪片段（节点 148 和批次 21），其基本 IO 属性接近前面描述的平均值。表 8-4 给出了该工作负载的基本信息。接下来，我将从几个方面深入讨论这个跟踪记录，这些方面总结在表
    8-3 中。


    表 8-4

    跟踪记录 148-21 (EXT4-WCD) 的基本统计信息


    | | 总计 | 读取 | 写入 |

    | --- | --- | --- | --- |

    | 块数量 | 917942 | 373424 | 544518 |

    | 平均大小（块） | 435.7 | 216.5 | 586.0 |

    | 读取 IOPS (r/s) | 4.322 |

    | 写入 IOPS (w/s) | 6.302 |

    | 每秒读取块数 | 935.802 |

    | 每秒写入块数 | 3693.157 |


    表 8-3

    观察结果与启示总结


    | SMR 特性 | Hadoop 观察结果 |

    | --- | --- |

    | **一次写入多次读取** | 40% 读取和 60% 写入<br>相对较低的写入更新比率<br>35.4% 的堆叠 ROW 比率 |

    | **顺序读取到随机写入** | 相对较小的随机写入比率<br>ROW 比率约 60% 且大小较小，因此影响不大 |

    | **异地更新** | 堆叠 WOW：70% 发生在前 10 分钟内<br>大容量 SSD/DRAM/AZR 缓存对性能提升的有用性（缓存中的写入更新）
    |

    | **顺序写入** | 大尺寸写入请求（`S >=`1024 块）> 64%<br>模式比率：写入 65% 和读取 70%<br>顺序比率（`S >=`1024）：写入
    74%（66%）和读取 82%（7%）<br>近顺序比率（`S >=`1024）：写入 87%（65%）和读取 95%（85%） |

    | **垃圾回收 (GC)** | 频繁的短空闲时间和周期性的长空闲时间<br>低设备利用率<br>相对较短的队列长度<br>相对较低的写入更新比率<br>116.3%
    频繁的 WOW 小写入放大<br>8.5% 写入更新命令的小重写比率<br>主要的局部 WOW 命中主要是大尺寸请求，而完全命中则是小尺寸请求 |


    ### 大小与 LBA 分布


    总体请求 LBA 分布如图 8-6a 所示。图 8-6b 进一步展示了大小分布曲线，从中可以看出最小请求为 8 个块，而最大大小为 1024 个块。对于写入请求，8
    块和 1024 块请求的总比例接近 90%。大尺寸写入请求（>=1024 块）的比例大于 55%，因此写入请求更具顺序性。对于读取，大小 <=256 的请求比例约为
    50%，并且大小分布更加多样化。因此，读取请求通常比写入请求更随机。LBA 与大小分布图进一步证实了这一观察结果。事实上，对于写入，您可以看到大多数大尺寸请求密集地分布在少数几个范围内；中等尺寸的请求非常少，而对于读取，大小分布则更加多样化。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig6_HTML.jpg](img/468166_1_En_8_Fig6_HTML.jpg)


    图 8-6

    LBA 和大小分布


    这些发现为 Hadoop 系统的“常识性”顺序访问提供了不同的视角 [70]。诚然，在 HDFS 级别，对于大尺寸文件（块大小的设置为 128MB）会生成顺序读取和写入，因此大尺寸文件被分割成
    128MB 的块，然后存储到 HDFS 中，最小访问单元通常为 128MB。然而，当这些访问与本地文件系统（如 EXT4 和 XFS）交互时，情况变得复杂得多。


    ### IOPS 与吞吐量


    这两个指标的平均值取决于统计时间窗口/间隔。例如，在此跟踪记录中非常常见突发性，这导致小时间间隔内出现相对陡峭的曲线和较高的最大 IOPS，而大时间间隔内则出现相对平滑的曲线和较低的最大
    IOPS。读取的 IOPS 通常高于写入；然而，读取的吞吐量通常低于写入。比较图 8-7 中显示的 600 秒间隔平均值与 6 秒间隔平均值，平均值存在很大差异。请注意，6
    秒间隔图中的读取 IOPS 高于 400，这并非“错误”。原因是前面描述的近顺序行为。为了验证该工具，我将解析后的曲线与通过 `iostat` 和 `iotop`
    收集的曲线进行了比较，并得到了一致的结果。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig7_HTML.png](img/468166_1_En_8_Fig7_HTML.png)


    图 8-7

    IOPS 和吞吐量


    ### 利用率与队列深度


    设备工作负载（平均 15%）和 CPU 工作负载（平均 20%）都很低。HDD 的平均队列深度（平均值 `<`0.3）进一步表明此工作负载的设备利用率较低。由于总体工作负载通常较低，并且“周期性”的谷底-峰值曲线具有说明性，因此系统可以利用空闲时间来获得最大的潜在收益（例如，为提高空间效率而进行的垃圾回收和碎片整理，甚至块重组）以提升性能。然而，大多数空闲时间不足以执行大型后台任务。如何充分利用这些空闲时间是未来探索的一个有趣课题。

    '
- fmt: '#### Request Sequence


    Let’s now look at the IO sequential pattern for both read and write requests.
    Some relevant concepts were introduced in Chapter [2](#468166_1_En_2_Chapter.xhtml).


    For queued next seek distance, observe that the value of the mode (most frequent
    value) is equal to 0, and the mode ratio at `N=64` (`N=1`) for read and write
    is 70.2% (61.6%) and 65.4% (61.3%), respectively. This implies a highly sequential
    workload (where higher is better). The mean absolute value drops quickly with
    queue length, which implies that there are many interleaved sequence streams.
    Therefore, the queue length used for sequence detection in a disk drive should
    be reasonably large to see better performance from the device.


    Figure [8-8](#468166_1_En_8_Chapter.xhtml#Fig8) illustrates sequence streams with
    different `N`, starting from 2 (and doubling to 256). The specific values for
    `N=1` and `N=128` are given in Table [8-5](#468166_1_En_8_Chapter.xhtml#Tab5)
    (“w/” and “w/o” denote the cases with or without size constraints). You can see
    that the streams with only two requests dominate, while the streams with larger
    request numbers are relatively few. When a size constraint is enforced (`S = 1024`
    blocks), the dominate `N` for read is moved to the value ≥3.


    **Table 8-5** Sequence Stream and Command Detection


    | `M` 2 ≥ 2 | Total streams | Total commands |

    | --- | --- | --- |

    | `N=1` | w/o | w/ | w/o | w/ |

    | **Read** | 52827 | 19987 | 282911 | 210081 |

    | **Write** | 25633 | 12412 | 359668 | 324007 |

    | `N=128` | w/o | w/ | w/o | w/ |

    | **Read** | 43682 | 3579 | 308149 | 217373 |

    | **Write** | 27303 | 9209 | 393962 | 354384 |


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig8_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig8_HTML.png)


    **Figure 8-8** Sequence stream with different `N`


    However, for the write the value of `N` is still 2. This shift indicates the request
    size of reads in sequential streams is generally smaller than that of writes.
    This is further confirmed by the average request size shown in Table [8-6](#468166_1_En_8_Chapter.xhtml#Tab6),
    so the size of sequence stream/commands of writes is much larger than that of
    reads. Therefore, the difference for read/write between size-constraint (`S =
    1024` blocks) and non-size-constraint requests is shown to be significant. It
    is noted with increased queue length `N`, the total stream number is generally
    decreased while the average stream size is increased and average command size
    is decreased.


    **Table 8-6** Average Size of Sequence Stream and Command


    | Op (`N`) | Avg. cmd size w/o (blocks) | Avg. cmd size w/ (blocks) | Avg. stream
    size w/ (blocks) |

    | --- | --- | --- | --- |

    | Read (1) | 259.5 | 308.9 | 3247.3 |

    | Write (1) | 952.0 | 910.3 | 24851.7 |

    | Read (128) | 245.4 | 307.9 | 18700.5 |

    | Write (128) | 797.7 | 882.2 | 31685.2 |


    The total sequence stream detected is illustrated in Figure [8-9](#468166_1_En_8_Chapter.xhtml#Fig9).
    This figure shows that the write request is much more sequential than read (considering
    the ratio). Note that for this figure, “combined” is not a simple sum of “read”
    and “write;” it is detected in the FIFO rule with all commands. The value displayed
    in Table [8-5](#468166_1_En_8_Chapter.xhtml#Tab5) is consistent to the mode counter
    of queued next seek distance. In fact, you can easily calculate that the frequency
    of mode is the total command number of streams minus the total number of streams.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig9_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig9_HTML.png)


    **Figure 8-9** Sequence ratio with `S=1024`


    Therefore, you can see that total ratio of “sequential” read/write is over 82%
    and 74% (`N=256`), respectively (detected read/write sequential commands/total
    write/read commands), without size constraints. The ratio is reduced to 76% and
    65.5%, respectively, with the size constraint (`S =1024`), which is more reasonable
    to indicate the sequence ratio.


    With increased `S`, the ratio of sequential read/write commands drops slightly,
    as shown in Figure [8-10](#468166_1_En_8_Chapter.xhtml#Fig10). It shows that the
    sequence of write is rather strong, as the sequence streams are generally large,
    so the ratio of writes is reduced from 82% to 62% and 58% when `S` is changed
    from 1024 to 4096 and 8196, respectively.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig10_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig10_HTML.png)


    **Figure 8-10** Sequence ratio with `S=4096` and `8192`


    As shown in Figure [8-11](#468166_1_En_8_Chapter.xhtml#Fig11), near-sequential
    for read is very strong. The total ratio for writes and reads is over 87% and
    95%, respectively (detected write or read sequential commands/total write or read
    commands), without considering size constraint. It reduces to 65% and 85%, respectively,
    with the size constraint, which is more reasonable to indicate the sequence ratio
    of reads is higher than that of writes. With increased `S`, the ratio of near-sequential
    read/write commands slightly drops, similar to that of sequence ratio. Note that
    the distance is generally larger than 8 blocks; when `δd` ≥ 16, the increment
    is significant.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig11_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig11_HTML.png)


    **Figure 8-11** Near sequence ratio with `S=1024`


    All the (near) sequence information discussed above provides a good reference
    for pre-fetch policy design for disk drives. For example, when considering a sequence
    detection algorithm, the gap is an important parameter. When designing a hot data
    identification algorithm, the definition of hit frequency may be changed slightly
    for these near sequence streams. For instance, the LBA hit within a certain region
    can be counted as a hot area to take post-read action. The observations also tell
    that the interleaved stream number is not large and a small queue may be good
    enough to detect the sequence (e.g., `N≥16`, compared with non-cache, `N=50` can
    increase around 5% sequence).'
  raw: '#### Request Sequence


    Let’s now look at the IO sequential pattern for both read and write requests.
    Some relevant concepts were introduced in Chapter [2](#468166_1_En_2_Chapter.xhtml).


    For queued next seek distance, observe that the value of the mode (most frequent
    value) is equal to 0, and the mode ratio at N=64 (N=1) for read and write is 70.2%
    (61.6%) and 65.4% (61.3%), respectively. This implies a highly sequential workload
    (where higher is better). The mean absolute value drops quickly with queue length,
    which implies that there are many interleaved sequence streams. Therefore, the
    queue length used for sequence detection in a disk drive should be reasonably
    large to see better performance from the device.


    Figure [8-8](#468166_1_En_8_Chapter.xhtml#Fig8) illustrates sequence streams with
    different N, starting from 2 (and doubling to 256). The specific values for N=1
    and N=128 are given in Table [8-5](#468166_1_En_8_Chapter.xhtml#Tab5) (“w/” and
    “w/o” denote the cases with or without size constraints). You can see that the
    streams with only two requests dominate, while the streams with larger request
    numbers are relatively few. When a size constraint is enforced (*S* = 1024 blocks),
    the dominate N for read is moved to the value ≥3.


    Table 8-5


    Sequence Stream and Command Detection


    | *M* 2 ≥ 2 | Total streams | Total commands |

    | --- | --- | --- |

    | N=1 | w/o | w/ | w/o | w/ |

    | **Read** | 52827 | 19987 | 282911 | 210081 |

    | **Write** | 25633 | 12412 | 359668 | 324007 |

    | N=128 | w/o | w/ | w/o | w/ |

    | **Read** | 43682 | 3579 | 308149 | 217373 |

    | **Write** | 27303 | 9209 | 393962 | 354384 |


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig8_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig8_HTML.png)


    Figure 8-8


    Sequence stream with different N


    However, for the write the value of N is still 2\. This shift indicates the request
    size of reads in sequential streams is generally smaller than that of writes.
    This is further confirmed by the average request size shown in Table [8-6](#468166_1_En_8_Chapter.xhtml#Tab6),
    so the size of sequence stream/commands of writes is much larger than that of
    reads. Therefore, the difference for read/write between size-constraint (*S* =
    1024 blocks) and non-size-constraint requests is shown to be significant. It is
    noted with increased queue length N, the total stream number is generally decreased
    while the average stream size is increased and average command size is decreased.


    Table 8-6


    Average Size of Sequence Stream and Command


    | Op (N) | Avg. cmd size w/o (blocks) | Avg. cmd size w/ (blocks) | Avg. stream
    size w/ (blocks) |

    | --- | --- | --- | --- |

    | Read (1) | 259.5 | 308.9 | 3247.3 |

    | Write (1) | 952.0 | 910.3 | 24851.7 |

    | Read (128) | 245.4 | 307.9 | 18700.5 |

    | Write (128) | 797.7 | 882.2 | 31685.2 |


    The total sequence stream detected is illustrated in Figure [8-9](#468166_1_En_8_Chapter.xhtml#Fig9).
    This figure shows that the write request is much more sequential than read (considering
    the ratio). Note that for this figure, “combined” is not a simple sum of “read”
    and “write;” it is detected in the FIFO rule with all commands. The value displayed
    in Table [8-5](#468166_1_En_8_Chapter.xhtml#Tab5) is consistent to the mode counter
    of queued next seek distance. In fact, you can easily calculate that the frequency
    of mode is the total command number of streams minus the total number of streams.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig9_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig9_HTML.png)


    Figure 8-9


    Sequence ratio with S=1024


    Therefore, you can see that total ratio of “sequential” read/write is over 82%
    and 74% (N=256), respectively (detected read/write sequential commands/total write/read
    commands), without size constraints. The ratio is reduced to 76% and 65.5%, respectively,
    with the size constraint (*S* =1024), which is more reasonable to indicate the
    sequence ratio.


    With increased *S*, the ratio of sequential read/write commands drops slightly,
    as shown in Figure [8-10](#468166_1_En_8_Chapter.xhtml#Fig10). It shows that the
    sequence of write is rather strong, as the sequence streams are generally large,
    so the ratio of writes is reduced from 82% to 62% and 58% when *S* is changed
    from 1024 to 4096 and 8196, respectively.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig10_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig10_HTML.png)


    Figure 8-10


    Sequence ratio with with S=4096 and 8192


    As shown in Figure [8-11](#468166_1_En_8_Chapter.xhtml#Fig11), near-sequential
    for read is very strong. The total ratio for writes and reads is over 87% and
    95%, respectively (detected write or read sequential commands/total write or read
    commands), without considering size constraint. It reduces to 65% and 85%, respectively,
    with the size constraint, which is more reasonable to indicate the sequence ratio
    of reads is higher than that of writes. With increased *S*, the ratio of near-sequential
    read/write commands slightly drops, similar to that of sequence ratio. Note that
    the distance is generally larger than 8 blocks; when *δd* ≥ 16, the increment
    is significant.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig11_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig11_HTML.png)


    Figure 8-11


    Near sequence ratio with S=1024


    All the (near) sequence information discussed above provides a good reference
    for pre-fetch policy design for disk drives. For example, when considering a sequence
    detection algorithm, the gap is an important parameter. When designing a hot data
    identification algorithm, the definition of hit frequency may be changed slightly
    for these near sequence streams. For instance, the LBA hit within a certain region
    can be counted as a hot area to take post-read action. The observations also tell
    that the interleaved stream number is not large and a small queue may be good
    enough to detect the sequence (e.g., N≥16, compared with non-cache, N=50 can increase
    around 5% sequence).'
  trans: '

    #### 请求序列


    现在，我们来考察读写请求的 IO 顺序模式。第 2 章介绍了一些相关概念。


    对于排队的下一个寻道距离，可以观察到众数（最频繁出现的值）等于 0，并且在 `N=64`（`N=1`）时，读和写的众数比率分别为 70.2%（61.6%）和
    65.4%（61.3%）。这表明工作负载具有高度顺序性（数值越高越好）。平均绝对值随着队列长度增加而迅速下降，这意味着存在许多交错的序列流。因此，磁盘驱动器中用于序列检测的队列长度应设置得足够大，才能观察到设备更好的性能。


    图 8-8 展示了不同 `N` 值下的序列流，从 2 开始（并翻倍至 256）。`N=1` 和 `N=128` 的具体数值见表 8-5（“w/”和“w/o”分别表示有和没有大小约束的情况）。可以看出，仅包含两个请求的流占主导地位，而请求数量较多的流则相对较少。当施加大小约束（`S
    = 1024` 个块）时，读操作的主导 `N` 值变为 ≥3。


    **表 8-5** 序列流与命令检测


    | `M` 2 ≥ 2 | 总流数 | 总命令数 |

    | --- | --- | --- |

    | `N=1` | w/o | w/ | w/o | w/ |

    | **读** | 52827 | 19987 | 282911 | 210081 |

    | **写** | 25633 | 12412 | 359668 | 324007 |

    | `N=128` | w/o | w/ | w/o | w/ |

    | **读** | 43682 | 3579 | 308149 | 217373 |

    | **写** | 27303 | 9209 | 393962 | 354384 |


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig8_HTML.png](img/468166_1_En_8_Fig8_HTML.png)


    **图 8-8** 不同 `N` 值下的序列流


    然而，对于写操作，`N` 的值仍然是 2。这种变化表明，在顺序流中，读请求的大小通常小于写请求。表 8-6 中显示的平均请求大小进一步证实了这一点，因此写操作的序列流/命令的大小远大于读操作。因此，读/写操作在有大小约束（`S
    = 1024` 个块）和无大小约束请求之间的差异是显著的。值得注意的是，随着队列长度 `N` 的增加，总流数通常会减少，而平均流大小会增加，平均命令大小则会减少。


    **表 8-6** 序列流与命令的平均大小


    | 操作 (`N`) | 无约束平均命令大小 (块) | 有约束平均命令大小 (块) | 有约束平均流大小 (块) |

    | --- | --- | --- | --- |

    | 读 (1) | 259.5 | 308.9 | 3247.3 |

    | 写 (1) | 952.0 | 910.3 | 24851.7 |

    | 读 (128) | 245.4 | 307.9 | 18700.5 |

    | 写 (128) | 797.7 | 882.2 | 31685.2 |


    检测到的总序列流如图 8-9 所示。该图显示，写请求的顺序性远高于读请求（考虑比率）。请注意，对于此图，“combined”并非“read”和“write”的简单相加；它是根据
    FIFO 规则对所有命令进行检测得到的。表 8-5 中显示的值与排队下一个寻道距离的众数计数器一致。事实上，你可以很容易地计算出，众数的频率等于流的总命令数减去总流数。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig9_HTML.png](img/468166_1_En_8_Fig9_HTML.png)


    **图 8-9** `S=1024` 时的序列比率


    因此，可以看到，在没有大小约束的情况下，“顺序”读/写的总比率分别超过 82% 和 74%（`N=256`）（检测到的顺序读/写命令数 / 总写/读命令数）。在施加大小约束（`S
    = 1024`）后，该比率分别降至 76% 和 65.5%，这更能合理地指示序列比率。


    随着 `S` 的增加，顺序读/写命令的比率略有下降，如图 8-10 所示。这表明写操作的顺序性相当强，因为顺序流通常很大，所以当 `S` 从 1024 变为
    4096 和 8196 时，写操作的比率分别从 82% 降至 62% 和 58%。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig10_HTML.png](img/468166_1_En_8_Fig10_HTML.png)


    **图 8-10** `S=4096` 和 `8192` 时的序列比率


    如图 8-11 所示，读操作的近顺序性非常强。在不考虑大小约束的情况下，写和读的总比率分别超过 87% 和 95%（检测到的顺序写或读命令数 / 总写或读命令数）。在施加大小约束后，该比率分别降至
    65% 和 85%，这更能合理地指示读操作的序列比率高于写操作。随着 `S` 的增加，近顺序读/写命令的比率略有下降，这与序列比率的情况类似。请注意，距离通常大于
    8 个块；当 `δd` ≥ 16 时，增量显著。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig11_HTML.png](img/468166_1_En_8_Fig11_HTML.png)


    **图 8-11** `S=1024` 时的近序列比率


    上述讨论的所有（近）序列信息为磁盘驱动器的预取策略设计提供了良好的参考。例如，在设计序列检测算法时，间隙是一个重要参数。在设计热数据识别算法时，对于这些近序列流，命中频率的定义可能需要稍作调整。例如，可以将某个区域内发生的
    LBA 命中计为一个热区域，以便执行后读操作。这些观察结果还表明，交错流的数量不大，一个较小的队列可能就足以检测到序列（例如，`N≥16`，与非缓存情况相比，`N=50`
    可以将序列检测率提高约 5%）。

    '
- fmt: '### Write Update


    For frequent write updates, 86% of accessed blocks (maybe repeated) are only written
    once. A decreasing percentage of written blocks are written multiple times, which
    means only a small portion of hot blocks are rewritten. Write amplification is
    roughly 116.3% if all rewritten data is put into a new place.


    For a timed write update, total write blocks occur 80% of total access blocks
    (read and write), and the updated blocks (at least write twice) are only 6.8%.
    Total write commands are 59% of the total commands and the update commands are
    22.5%. The average size of write commands is around 586 blocks and the average
    size of overlapped blocks of update commands is 73.3.


    Before you look at the stacked write update, check the stacked distance first.
    You will find that small requests have a high probability to be full hits as opposed
    to large sized request (since the hit size is much smaller than the average size).
    In fact, the average overlapped sizes for partial hits (only a part of blocks
    are the same) and full hits (two requests are the same) are 139.4 and 55.1 blocks,
    respectively. You can conclude that a partial hit is more likely to happen for
    large size requests by using the numbers in Tables [8-4](#468166_1_En_8_Chapter.xhtml#Tab4)
    and [8-7](#468166_1_En_8_Chapter.xhtml#Tab7).


    **Table 8-7** Statistics for Logical Stack Distance (LSD)


    | | `LSD≤1000` | `LSD≤2000` | `LSD≤4000` | Overall |

    | --- | --- | --- | --- | --- |

    | Partial, Full | 2.8%, 14.9% | 3.5%, 17.6% | 4.4%, 19.9% | 7.5%, 27.3% |


    A further check can be obtained by considering the full and partial hits separately
    by referring to Figure [8-12](#468166_1_En_8_Chapter.xhtml#Fig12) for the hit
    frequency vs. LBA and size. This confirms the dominant partial hit at large size,
    while full hit at small size. The hits of the requests with medium-size (64-1023
    blocks) are much less.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig12_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig12_HTML.png)


    **Figure 8-12** Write update LBA and size distribution


    Now let’s check stacked write update ratio. Based on write IOPS, distance 4000
    is roughly 10 minutes. In this period, you can see 72.9% full write hit and 58.7%
    partial write hit of commands. With the knowledge of cache size and structure,
    you can estimate the hit ratio. As the stack distance is generally longer than
    DRAM cache length, updates on disk cannot be avoided. Therefore, a “caching/buffering”
    location on the media is necessary, so a larger-size SSD cache is necessary for
    performance improvement.


    The third plot in Figure [8-13](#468166_1_En_8_Chapter.xhtml#Fig13) shows that
    over 65% of the overlapped request size happens in the first 1% of overall time
    for partial/full hits, which further confirms the necessity of large SSD cache.
    As conventional disk drives have not provided such a big cache, it may be beneficial
    to implement this cache via a hybrid drive (SSD+HDD) or at a higher level in the
    system, such as array controllers or aggregate controllers. For SMR drive, a convenient
    way is to allow conventional zones accompanying with shingled zones for random
    write access.^([^(72)](#fn72)) It is also called random access zone (RAZ) in [5,
    4].


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig13_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig13_HTML.png)


    **Figure 8-13** Frequented, timed, and stacked write update (from top to bottom)


    ### Read on Write (ROW)


    `ROW` ratio is mainly used to check if “write once read many (WORM)” is possible.
    You will find that the total `ROW` ratio is around 35.4% only, which implied that
    the written data is less likely to be read multiple times (i.e., a ratio much
    larger than 1). You can further check if the hit is only for small size requests.
    Figures [8-14](#468166_1_En_8_Chapter.xhtml#Fig14) and [8-15](#468166_1_En_8_Chapter.xhtml#Fig15)
    show that the written data is less likely to be immediately read back for most
    cases for similar reasons as explained in previous chapters.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig15_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig15_HTML.png)


    **Figure 8-15** ROW hit and size distribution


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig14_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig14_HTML.jpg)


    **Figure 8-14** ROW ratio


    ### Write Cache Enabled vs. Disabled


    Write cache is an important feature of HDDs. Many studies show that the performance
    of `WCE` (write cache enabled) can be increased significantly over `WCD` (write
    cache disabled) due to write-back policy, in particular for some small-size random
    write workloads. However, the data reliability concern (e.g., power loss leads
    to dirty data loss in DRAM write cache) results in most data centers disabling
    this feature.


    Here we compare four traces (148-21, 148-22, 149-21, and 149-22) as nodes 148
    and 149 always use different write cache setting and there is a setting change
    between batch ID 21 and 22 (see Table [8-2](#468166_1_En_8_Chapter.xhtml#Tab2)).
    You can see that there is no essential difference among write IOPS, throughput,
    and average size as shown in Table [8-8](#468166_1_En_8_Chapter.xhtml#Tab8). Meanwhile,
    the ratio of large write requests (e.g., 1024 blocks) almost remains the same.
    Nevertheless, you can observe that the (near) sequence ratio of `WCD` is slightly
    smaller than that of `WCE` for both reads and writes (1% of absolute value). These
    factors show that the HDFS does not change its behavior according to HDD’s write
    cache settings, even though the local file system may respond to it. However,
    as the workload is far away from the drive’s boundary capability, the response
    is not significant.


    **Table 8-8** Basic IO metrics for WCD vs. WCE


    | Average | IOPS | Throughput KBPS | Size blocks |

    | --- | --- | --- | --- |

    | | 21 | 22 | 21 | 22 | 21 | 22 |

    | 148 | 6.3 | 7.0 | 1846.6 | 2064.4 | 586.0 | 589.5 |

    | 149 | 6.6 | 6.8 | 1782.2 | 1881.9 | 541.8 | 556.6 |


    In the heavy workload cases, some interleaved sequential streams will be considered
    as “random” rather than sequential, causing an increased ratio of random writes,
    which is harmful to the overall disk performance. Therefore, some non-volatile
    memory or DRAM protection technologies may be applied in order to enable write
    cache, which becomes necessary for heavy workloads. Additionally, for green environments
    in data centers where the bottleneck is not the HDDs (at least under normal workloads),
    another benefit to `WCE` is energy savings due to less mechanical accesses to
    the HDDs.'
