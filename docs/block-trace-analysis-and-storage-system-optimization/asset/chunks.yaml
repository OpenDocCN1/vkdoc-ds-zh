  trans: '

    # PCMark


    `PCMark Vantage` [55] 是一款广泛使用的基准测试工具，其功能不仅限于磁盘性能。它可以提供八个类别的应用级追踪，如表 5-8 所示，其中每个特定追踪被分解为写入和读取命令的数量。图
    5-4 进一步以`LBA`随时间变化的图表形式展示了这些追踪。^(⁶⁷)


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig4_HTML.jpg](img/468166_1_En_5_Fig4_HTML.jpg)


    **图 5-4** `PCMark`中的八个应用程序


    **表 5-8** `PCMark`中的八个应用程序


    | 序号 | 八个应用 | 总命令数 | 写入 | 读取 |

    | --- | --- | --- | --- | --- |

    | 1 | Windows Defender | 6755 | 300 | 6455 |

    | 2 | 游戏 | 11040 | 62 | 10978 |

    | 3 | 导入图片 | 2806 | 4 | 2802 |

    | 4 | Vista 启动 | 7418 | 1327 | 6091 |

    | 5 | 视频编辑 | 8204 | 3711 | 4493 |

    | 6 | Windows Media Center | 5011 | 3309 | 1702 |

    | 7 | 添加音乐 | 3336 | 1506 | 1830 |

    | 8 | 应用加载 | 11155 | 2660 | 8495 |


    现在，你可以将此追踪作为读取缓存性能分析的示例。一些早期研究表明，驱动器之间常见的区别在于读取缓存命中率，并伴有合理的前读和/或后读数据。为便于表述，我将预取操作定义为同时包含前读和后读请求，如图
    5-5 所示。一种常见情况是，如果追踪具有很强的局部性，某些后续读取请求会因预取数据而命中缓存中的数据。通常使用三种类型的预取访问：始终预取（`PA`）、未命中时预取（`PoM`）、命中时预取（`PoH`）。


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig5_HTML.jpg](img/468166_1_En_5_Fig5_HTML.jpg)


    **图 5-5** 缓存预取


    如前所述，对于近顺序流，请求之间允许存在间隙。这个间隙可能成为预取数据中的一个“空洞”，这对整体性能有害。如图 5-6 所示，存在三种类型的空洞：


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig6_HTML.jpg](img/468166_1_En_5_Fig6_HTML.jpg)


    **图 5-6** 空洞类型


    *   **后空洞：** 传入命令的第一个`LBA`与缓存中排队命令的最后一个`LBA`之间的距离（`> 0`）在某个阈值之内。

    *   **前空洞：** 传入命令的最后一个`LBA`与缓存中排队命令的第一个`LBA`之间的距离在某个阈值之内。

    *   **前后空洞：** 同时存在后空洞和前空洞。


    为了正式定义空洞，考虑以下两种情况：


    *   **恒定：** 如果缓存中两个邻近区域之间的范围小于恒定值`Hs`个块，则该范围被视为一个空洞。

    *   **自适应：** 空洞大小与`DRAM`和`SSD`缓存相关（很可能随总/剩余缓存大小单调递增）。


    ![$$ {H}_S=\Big\{{\displaystyle \begin{array}{cc}\underset{\_}{H_S},&amp; \left\lfloor
    {a}_T{S}_T+{a}_R{S}_R\right\rfloor &lt;\underset{\_}{H_S}\\ {}{\overline{H}}_S,&amp;
    \left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor &gt;{\overline{H}}_S\\ {}\left\lfloor
    {a}_T{S}_T+{a}_R{S}_R\right\rfloor, &amp; Otherwise\end{array}} $$](img/468166_1_En_5_Chapter_TeX_IEq1.png)


    其中`S[T]`和`S[R]`分别是总缓存大小和剩余缓存大小，`a[T]`和`a[R]`是`S[T]`和`S[R]`的系数。一个针对 64MB `DRAM`缓存的示例如下定义：


    ![$$ {H}_S=\Big\{{\displaystyle \begin{array}{cc}16,&amp; \left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor
    &lt;\underset{\_}{H_S}\\ {}256,&amp; \left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor
    &gt;{\overline{H}}_S\\ {}\left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor, &amp;
    Otherwise\end{array}} $$](img/468166_1_En_5_Chapter_TeX_IEq2.png)


    其中 ![$$ {a}_T=\frac{1}{2^{13}},{a}_R=\frac{15}{2^{13}} $$](img/468166_1_En_5_Chapter_TeX_IEq3.png)。实际的
    ![$$ \underset{\_}{H_s} $$](img/468166_1_En_5_Chapter_TeX_IEq4.png) 和 ![$$ {\overline{H}}_s
    $$](img/468166_1_En_5_Chapter_TeX_IEq5.png) 由追踪决定，例如时间窗口内请求的中位数大小。更具体地说，需要考虑空洞是否位于同一磁道/柱面内。


    应实现一个后台任务来监控缓存中的`LBA`区域以及这些区域上的命中密度。该进程还负责查找具有一定命中密度的数据区域中的间隙，并生成自诱导读取命令，用主存储器中的数据填充这些空洞。


    为了将缓存算法与追踪属性联系起来，使用以下假设：


    *   如果某个时间范围内两个特定范围的区域具有足够高的相关性，那么它们之间的间隙很可能被访问。

    *   预取不应过多影响整体性能，因此从额外缓存命中率中获得的收益应大于预取带来的额外成本。

    *   待填充空洞大小的上限由多种因素决定，例如总/剩余缓存大小、工作负载大小、缓存类型、访问时间等。


    现在我们有一些问题需要回答。


    *   空洞填充策略能带来什么好处？关键在于获取增加的缓存命中率（采用空洞填充时的命中率与未采用空洞填充时的命中率对比）。

    *   空洞填充策略会带来什么额外成本？关键在于找出为填充空洞生成了多少自诱导命令。必须考虑用户工作负载的时间。

    *   由于空洞填充与预取策略之间存在相似性，是否有可能将空洞填充合并到预取策略中（集成）？关键在于找出两种策略之间重叠的缓存命中；如果重叠率很高，预取可能将空洞填充作为其一部分。

    *   何时何地应用这两种策略（或集成策略）才能平衡收益与成本？关键在于减少额外的机械访问成本和缓存污染。


