    | Level | Steps | Consequence |

    | --- | --- | --- |

    | Data plane, Control plane | Abstract (decouple/standardization, pooling/virtualization),
    automation (policy-driven) | Faster, more efficient simpler |


    SDS also leads to some other concepts, such as a software-defined data center
    (SDDC). Based on the report by IDC and IBM,^([^(26)](#fn26)) a SDDC is a loosely
    coupled set of software components that seek to virtualized and federate datacenter-wide
    hardware resources such as compute, storage, and network resources. The objective
    for a SDDC is to make the data center available in the form of an integrated service.
    Note that an implementation of SDS and SDDC may not be able to leave the support
    of another software defined concept, such as software-defined networking (SDN)
    , which provides a fundamental change to the network infrastructure.


    ### Implementation


    I focus on some most recent software implementations for large scale systems with
    distributed storage components in this section.'
  trans: '

    ## 微服务器与以太网硬盘


    微服务器是一种基于片上系统（SoC）架构的服务器级计算机。其目标是将大部分服务器主板功能集成到单个微芯片上，但 DRAM、启动闪存和电源电路除外。以太网硬盘是其多种形态之一。


    2013 年 10 月，希捷科技推出了其 Kinetic 开放存储平台，声称该技术将使应用程序能够直接与存储设备通信，并消除传统的存储服务器层。该公司于 2014
    年底出货了首批近线 Kinetic 硬盘。Kinetic 硬盘被描述为一个具有双以太网端口、支持对象存储基本`put`、`get`和`delete`语义（而非块存储的读写结构）的键值服务器。客户端通过
    Kinetic API 访问硬盘，该 API 提供键值访问、第三方对象访问以及集群、硬盘和安全管理的功能。


    东芝于 2015 年 5 月推出的 KVDrive 采用了希捷开源的键值 API，而非另起炉灶。`Ceph`或`Gluster`可以直接在东芝的 KVDrive
    上运行。


    西部数据/HGST 基于其开放以太网架构的融合微服务器支持任何 Linux 实现。理论上，任何网络操作系统都可以直接在此类微服务器中运行。`Ceph`和`OpenStack
    对象存储`系统已与红帽服务器一起进行了演示。例如，在 2016 年初，西部数据展示了一个拥有 504 个硬盘和 4PB 存储容量的大规模`Ceph`分布式存储系统。^(²¹)


    ## 软件定义存储


    软件定义存储是一个仍在演进中的新兴概念。不同组织对其有多种定义，例如：


    - **TechTarget**：^(²²) SDS 是一种数据存储方法，其中控制存储相关任务的程序与物理存储硬件分离（这强调存储相关服务而非存储硬件）。


    - **Webopedia**：^(²³) SDS 是由智能软件而非存储硬件本身管理和自动化的存储基础设施。通过这种方式，SDS 环境中池化的存储基础设施资源（可在广泛的服务器硬件组件上提供诸如去重、复制、精简配置、快照以及其他备份和恢复功能）可以自动且高效地用于匹配企业的应用需求。


    - **维基百科**：^(²⁴) SDS 是一种计算机数据存储软件，用于管理与硬件无关的、基于策略的数据存储供应和管理。软件定义存储的定义通常包含一种存储虚拟化形式，以将存储硬件与管理存储基础设施的软件分离。支持软件定义存储环境的软件还可以为功能选项（如去重、复制、精简配置、快照和备份）提供策略管理。


    - **VMware**：^(²⁵) SDS 是存储服务（如快照、克隆、远程复制、去重、缓存、分层、加密、归档、合规、搜索、智能逻辑）的动态组合，这些服务以应用边界为对齐，并由策略驱动。


    尽管存在这些不同观点，但仍有一些共同因素和特征，总结于表 1-4 和图 1-9 中。表 1-4 实际上展示了 SDS 的三个步骤。首先，硬件应与软件解耦，例如将逻辑存储服务与能力从底层物理存储系统中抽象出来。其次，存储资源被虚拟化，例如跨多个实现进行池化。第三，创建自动化机制，通过基于服务级别协议（取代技术细节）的策略驱动存储供应来实现。典型的
    SDS 产品包括`GlusterFS`、`Ceph`和`VMware Virtual SAN`。图 1-9 进一步从五个方面给出了特征：数据组织、扩展、持久化数据存储、存储服务和交付模型。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig9_HTML.png](img/468166_1_En_1_Fig9_HTML.png)


    **图 1-9** SDS 的总体特征


    **表 1-4** SDS 的共同特征


    | 层级 | 步骤 | 结果 |

    | --- | --- | --- |

    | 数据平面，控制平面 | 抽象（解耦/标准化，池化/虚拟化），自动化（策略驱动） | 更快、更高效、更简单 |


    SDS 也引出了其他一些概念，例如软件定义数据中心（SDDC）。根据 IDC 和 IBM 的报告，^(²⁶) SDDC 是一个松散耦合的软件组件集合，旨在虚拟化和联合数据中心范围内的硬件资源，如计算、存储和网络资源。SDDC
    的目标是使数据中心以集成服务的形式可用。请注意，SDS 和 SDDC 的实现可能无法脱离另一个软件定义概念（如软件定义网络（SDN））的支持，后者为网络基础设施带来了根本性变革。


    ### 实现


    在本节中，我将重点介绍一些用于具有分布式存储组件的大规模系统的最新软件实现。

    '
- fmt: '### Hadoop


    Apache Hadoop，一个源自 Google 的开源 MapReduce 实现，提供了一个用于分布式存储和处理大数据集的软件框架。它由基于商用硬件构建的计算机集群组成。Hadoop
    中的所有模块都是在硬件故障频繁发生且应由框架自动处理这一基本假设下设计的。


    基础 Apache Hadoop 框架由以下四个主要模块组成：


    - **Hadoop Common** 包含其他 Hadoop 模块所需的基本库和实用程序。

    - **Hadoop 分布式文件系统（HDFS）** 是一个用 Java 编写的分布式文件系统，它将数据存储在商用机器上，在集群中提供非常高的总带宽。

    - **Hadoop YARN** 是一个资源管理平台，负责管理集群中的计算资源，并用于调度用户应用程序。

    - **Hadoop MapReduce** 作为 MapReduce 编程模型的实现，处理大规模数据。


    HDFS 将大文件（通常在千兆字节到兆兆字节范围内）存储在多个机器上。它通过复制机制实现可靠性，例如跨多个主机复制数据，因此理论上不需要主机上的 RAID
    存储（某些 RAID 配置仍然有用，如 RAID 0）。数据存储在三个节点上，默认复制值为 3。数据节点可以相互通信以重新平衡数据、移动副本并保持数据的高复制率。HDFS
    不完全符合 POSIX 标准，因为 POSIX 文件系统的要求与 Hadoop 应用程序的目标不同。不完全合规的权衡是提高了数据吞吐量的性能，并支持诸如 `Append`
    之类的非 POSIX 操作。尽管 HDFS 是默认的分布式文件系统，但它可以被其他文件系统替代，例如 FTP 文件系统、Ceph、Amazon S3、Windows
    Azure 存储 Blob（WASB）等。


    如今，Hadoop 是一个拥有数十个不同组件的大型生态系统。图 1-10 展示了一个简化且正在积极扩展的 Hadoop 生态系统。2014 年，一个名为 Spark
    的内存数据处理引擎被发布，以加速 MapReduce 处理。这两个项目共享许多通用组件。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig10_HTML.png](images/468166_1_En_1_Chapter/468166_1_En_1_Fig10_HTML.png)


    图 1-10 Hadoop 生态系统


    ### OpenStack


    OpenStack 是一个用于云计算的开源免费软件平台，主要作为基础设施即服务（IaaS）部署。它由相互关联的组件组成，这些组件控制数据中心内多样化的、多供应商的计算、存储和网络资源硬件池。因此，这些组件基本上可以分为计算、存储、网络和接口几类。例如，`Nova`
    是云计算结构控制器，作为 IaaS 系统的主要组件。`Neutron` 是用于管理网络和 IP 地址的组件。图 1-11 展示了整体架构 [32]。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig11_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig11_HTML.jpg)


    图 1-11 OpenStack 架构 [32]


    OpenStack 包含名为 `Cinder` 的块存储组件和名为 `Swift` 的对象存储组件。`Cinder` 系统管理块设备到服务器的创建、挂载和卸载。块存储卷完全集成到
    `Nova` 和 Horizon 仪表板中，允许云用户管理自己的存储需求。块存储适用于本地服务器存储和存储平台（例如 Ceph、GlusterFS、GPFS
    等）中对性能敏感的场景。`Swift` 是一个可扩展的冗余存储系统。


    ### Ceph


    Ceph 是一个开源免费的分布式存储平台，为对象级、块级和文件级存储提供统一接口 [33, 34]。Ceph 最初由 Sage Weil 为其博士论文创建。2012
    年，Weil 创立了 Inktank Storage，为 Ceph 提供专业服务和支持。


    Ceph 应用复制和纠删码来实现容错，使用商用硬件且无需特定硬件支持。因此，该系统具有自愈和自管理能力，旨在最大限度地减少管理时间和其他成本。图 1-12
    展示了一个通用架构。可靠的自主分布式对象存储（RADOS）为统一存储提供了基础。Ceph 分布式对象存储的软件库为客户端应用程序提供了对 RADOS 系统的直接访问。Ceph
    的 RADOS 块设备（RBD）自动在集群中条带化和复制数据，并与基于内核的虚拟机（KVM）集成。Ceph 文件系统（CephFS）运行在 `LIBRADOS`/`RADOS`
    之上，提供对象存储和块设备接口。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig12_HTML.png](images/468166_1_En_1_Chapter/468166_1_En_1_Fig12_HTML.png)


    图 1-12 Ceph 架构'
  raw: '#### Hadoop


    Apache Hadoop,^([^(27)](#fn27)) an open-source implementation of MapReduce originating
    at Google, provides a software framework used for distributed storage and processing
    of big data sets. It consists of computer clusters built from commodity hardware.
    All the modules in Hadoop are designed under a fundamental assumption that hardware
    failures commonly occur and should be automatically handled by the framework.


    The base Apache Hadoop framework is composed of the following four major modules:


    *   Hadoop Common has the fundamental libraries and utilities required by other
    Hadoop modules.


    *   Hadoop Distributed File System (HDFS) is a distributed file-system written
    in Java that stores data on commodity machines, providing very high aggregate
    bandwidth across the cluster.


    *   Hadoop YARN is a resource-management platform responsible for managing computing
    resources in clusters and using them for scheduling of users’ applications.


    *   Hadoop MapReduce processes large scale data, as an implementation of the MapReduce
    programming model.


    HDFS stores large files (typically in the range of gigabytes to terabytes) across
    multiple machines. It achieves reliability by a replication mechanism, such as
    replicating the data across multiple hosts, and hence theoretically does not require
    RAID storage on hosts (some RAID configurations are still useful, like RAID 0).
    Data is stored on three nodes with the default replication value, 3\. Data nodes
    can communicate with each other to rebalance data, to move copies around, and
    to keep the replication of data high. HDFS is not fully POSIX-compliant because
    the requirements for a POSIX file-system differ from the target goals for a Hadoop
    application. The trade-off of not-full compliance is increased performance for
    data throughput and support for non-POSIX operations such as Append. Although
    HDFS is the default distributed file system, it can be replaced by other file
    systems, such as FTP file systems, Ceph, Amazon S3, Windows Azure storage blobs
    (WASB), and others.


    Nowadays, Hadoop is a large ecosystem with tens of different components. Figure
    [1-10](#468166_1_En_1_Chapter.xhtml#Fig10)^([^(28)](#fn28)) shows a simplified
    Hadoop ecosystem with an active expansion. In 2014, an in-memory data processing
    engine named Spark^([^(29)](#fn29)) was released to speed the MapReduce processing.
    These two projects share many common components.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig10_HTML.png](images/468166_1_En_1_Chapter/468166_1_En_1_Fig10_HTML.png)


    Figure 1-10


    Hadoop ecosystem


    #### OpenStack


    OpenStack^([^(30)](#fn30)) is an open-source and free software platform for cloud
    computing, mostly deployed as an infrastructure-as-a-service (IaaS). It consists
    of interrelated components that control diverse, multi-vendor hardware pools of
    computing, storage, and networking resources throughout a data center. Therefore,
    the components can be basically divided into the categories of compute, storage,
    networking, and interface. For example, Nova is the cloud computing fabric controller
    as the main component of an IaaS system. Neutron is the component for managing
    networks and IP addresses. Figure [1-11](#468166_1_En_1_Chapter.xhtml#Fig11) shows
    the overall architecture [32].


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig11_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    Openstack architecture [32]


    OpenStack contains the block storage component called Cinder and an Object storage
    component called Swift. The Cinder system manages the creation, attaching, and
    detaching of the block devices to servers. Block storage volumes are fully integrated
    into Nova and the Horizon Dashboard, allowing cloud users to manage their own
    storage needs. Block storage is appropriate for performance-sensitive scenarios
    in both local server storage and storage platforms (e.g., Ceph, GlusterFS, GPFS,
    etc.). Swift is a scalable redundant storage system .


    #### Ceph


    Ceph,^([^(31)](#fn31)) an open-sourced and free distributed storage platform,
    provides a unified interfaces for object-, block-, and file-level storage [33,
    34]. Ceph was initially created by Sage Weil for his doctoral dissertation. In
    2012, Inktank Storage was founded by Weil for professional services and to support
    for Ceph.


    Ceph applies replicates and erasure code to make it fault-tolerant, using commodity
    hardware and requiring no specific hardware support. As a consequence, the system
    is both self-healing and self-managing, aiming to minimize administration time
    and other costs. A general architecture is illustrated in Figure [1-12](#468166_1_En_1_Chapter.xhtml#Fig12).
    The reliable autonomic distributed object store (RADOS) provides the foundation
    for unified storage. The software libraries of Ceph’s distributed object storage
    provide client applications with direct access RADOS system. Ceph’s RADOS Block
    Device (RBD) automatically stripes and replicates the data across the cluster
    and integrates with kernel-based virtual machines (KVMs). The Ceph file system
    (CephFS) runs on top of LIBRADOS/RADOS that provides object storage and block
    device interfaces.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig12_HTML.png](images/468166_1_En_1_Chapter/468166_1_En_1_Fig12_HTML.png)


    Figure 1-12


    Ceph architecture'
