    to the dynamic specifications. In particular, IO performance is among the most
    important metrics.


    Table 1-5


    Common Metrics for Storage Devices


    | Metrics | Unit |

    | --- | --- |

    | Capacity | GB |

    | Areal density (TPI, SPT) | GB/inch |

    | Volumetric density | TB/liter |

    | Write/read endurance | Times/years |

    | Data retention time | Years |

    | Speed (latency of IO access time; rand.) | Million seconds |

    | Speed (bandwidth of IO access; seq.) | MB/second |

    | Power consumption | Watts |

    | Reliability (MTBF) | Hours |

    | Power on/off transit time | Seconds |

    | Shock and vibration | G-force |

    | Temperature resistance | *°*C |

    | Radiation resistance | Rad |


    Performance evaluation is an essential element of experimental computer science.
    It can be used to tune system parameters, to assess capacity requirements when
    assembling systems for production use, to compare the values of some different
    designs, and then provide guidance for the new development. As pointed out in
    [35], the three main factors that affect the performance of a computer system
    are


    *   The system’s design


    *   The system’s implementation


    *   The system’s workload


    These three factors influence and interact with each other. It is common for a
    system to perform well for one workload, but not for another. For a given storage
    system, its hardware design is usually fixed. However, it may provide some tuning
    parameters. If the parameters are also fixed in one scenario, the performance
    is usually “predictable” for a particular application. By running enough experiments,
    it is possible to obtain some patterns for the parameters related to the application’s
    general workload properties. Then you may further tune the parameters. Sometimes,
    due to design limitations, the range of tuning parameters may be too narrow. Then
    you must redesign the system.


