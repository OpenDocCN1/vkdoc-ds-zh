  trans: '

    ### 缓存大小


    我们首先探讨“WCD 期间有多少 DRAM 被用作写入缓存？”这个问题。首先，确保测试是可重复的（或结果是一致的）。为了验证这一点，请执行以下步骤。


    1.  将 SSHD 连接到 XGIG 总线分析仪，然后关闭/打开 SSHD 电源。

    2.  使用 IOMeter 或其他工具向 SSHD 发送 100 个随机的 8K 写入请求，并重复相同的请求 10 次。

    3.  使用相同的请求，重复步骤 1-2 共 4 次。

    4.  通过轨迹分析工具比较并找出 XGIG 轨迹的访问模式。

    5.  将请求数量改为 200 和 400，重复步骤 1-4。

    6.  在另一块具有相同 IO 模式的 SSHD 上进行相同的测试。


    在步骤 4 中，应观察到相似的访问模式（LBA 与 CCT）。请注意，此处检查的是 DRAM 写入缓存，因此仅使用随机写入请求。要进行完整的缓存检查，您也可以尝试随机读取、混合读写以及混合随机/顺序模式。如果观察到相似的模式，则可以得出结论：结果是一致的，并且有助于识别一些内部信息。否则，您需要找出原因。原因之一是
    SSD/DRAM 缓存在新测试前未被清理。因此，您需要使用一些缓存刷新命令或磁盘初始化命令来强制清空缓存。另请注意：


    *   读/写 DRAM 缓存可能共享同一空间。

    *   SSD 映射表可能与读/写 DRAM 缓存共享同一空间（理想情况：SSD 映射表使用专用的 DRAM 空间）。

    *   SSD 重启自学习过程可能会占用 DRAM 空间。


    其次，执行以下步骤以确保每次测试都从干净的缓存开始：


    1.  关闭/打开 SSHD 电源（确保 DRAM 写入缓存已清除）。

    2.  使用 IOMeter，以队列深度=1 向 SSHD 发送 1000 个随机的 8K 写入请求。

    3.  使用不同的请求大小（如 16K、32K、64K、128K、...、2048K）重复步骤 1-2 各 10 次。


    捕获轨迹后，需要进行一些后处理：


    1.  通过将 DRAM 访问与其他访问区分开来（DRAM CCT/qCCT 通常远小于其他访问），统计每次运行中总访问量初始部分的 DRAM 写入命中次数。

    2.  选择每次计数的最大值。

    3.  计算命中次数及对应的实际缓存大小。

    4.  找到转折点，该点可提示簇大小。

    5.  通过缩小范围来细化转折点。例如，如果转折点在[256K-512K]范围内，则可以使用更多点，如 300K、400K 和 500K。


    请注意，此型号的 SSHD 仅具有只读缓存 SSD，因此 DRAM 访问不会与 SSD 写入访问混合，这简化了图 6-2 至 6-5 中的分析。图 6-2
    显示了来自 IOMeter 随机写入测试（请求大小从 1K 到 1M）的轨迹。假设写入缓存为空。^(⁶⁸) 那么每次运行的初始部分可能是 DRAM 写入缓存命中。


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig2_HTML.jpg](img/468166_1_En_6_Fig2_HTML.jpg)


    图 6-2


    SSHD 的 IOMeter 轨迹


    放大系统以找出命中点。图 6-3、6-4 和 6-5 给出了三个示例，其请求大小分别为 1KB、512KB 和 1MB。在图 6-3 和 6-4 中，您可以观察到明显的写入缓存命中，并且由于缓存大小有限，1KB
    的总命中次数远大于 512KB。然而，当大小增加到 1MB 时，未观察到明显的写入缓存，这意味着在 512K 和 1M 之间设置了一个阈值，作为不同大小请求的转折点。这也表明大尺寸请求将直接发送到介质。通过相同的步骤，您实际上可以获得
    WCD 和 WCE 所需的数值，如表 6-2 和 6-3 所示。


    表 6-3


    SSHD 在 WCD 下的两种情况


    | SSHD (WCD) | test1 |   | test2 |   |

    | --- | --- | --- | --- | --- |

    | 大小 | 计数次数 | 大小 | 计数次数 | 大小 |

    | --- | --- | --- | --- | --- |

    | 1K | 98 | 0.1M | 101 | 101K |

    | 4k | 100 | 0.4M | 100 | 400K |

