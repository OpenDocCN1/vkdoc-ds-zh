  trans: "\n# 工作负载属性\n\n首先，我们来看思考时间和完成时间，分别如图 5-7 和图 5-8 所示。可以看到不同应用在这两项指标分布上的巨大差异。表\
    \ 5-9 进一步给出了平均值、标准差以及 `IOPS` 的值。图 5-9 和表 5-10 提供了大小分布情况。你还可以发现大小与完成时间之间的关系。\n\n\
    **表 5-10** PCMark：大小分布（块）\n\n| 应用 | 平均值-全部 | 标准差 | 平均值-读取 | 标准差 | 平均值-写入 | 标准差\
