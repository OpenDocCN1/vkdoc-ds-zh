    # 9. 案例研究：Ceph


    Ceph 是一个开源分布式存储平台，为对象、块和文件级别的存储提供统一接口 [33, 80, 34, 81]。本章介绍基于 WD WASP/EPIC 微服务器的
    Ceph 集群的块级工作负载特征。所呈现的分析技术可以帮助您理解 Ceph 在生产环境中的性能和驱动器特征。此外，我还将确定 SMR、混合磁盘和 SSD 驱动器是否适用于
    Ceph 工作负载。


    Ceph 的基本架构在第 1 章中已有描述。Ceph 的核心 RADOS 是一个完全分布式、可靠且自主的对象存储，它使用 CRUSH（可扩展哈希下的受控复制）算法。Ceph
    的构建块被称为 OSD（对象存储守护进程）。OSD 负责在本地文件系统（例如 EXT4 和 XFS）上存储对象，并协作复制数据、检测和恢复故障，或在 OSD
    加入或离开集群时迁移数据。Ceph 的设计源于一个前提：故障在大规模存储系统中很常见。基于此，Ceph 旨在通过利用 OSD 的智能来保证可靠性和可扩展性。每个
    OSD 使用一个日志来加速写操作，方法是将小写入合并，并在日志满时异步刷新到后端文件系统。该日志可以是一个不同的文件，也可以位于另一个设备或分区中 [82,
    83, 84]。


    这些测试基于一个“独特”的平台。生产环境使用的是所谓的微服务器结构，而非传统工作站。在该系统中，每个微服务器拥有独立的操作系统和一个硬盘驱动器。这几乎是 IO
    设备的最小粒度，本质上满足了 Ceph 之父 Sage Weil 的原始设计要求 [80, 33]。实际上，这种架构将故障域最小化到单个磁盘单元，而不是像多磁盘架构那样，一个服务器中的多个磁盘同时变得不可访问。存储集群通过机架顶部的以太网交换机连接微服务器来实现横向扩展。


    一个包含 12 个节点（命名为 `sm1-wasp1` 到 `sm1-wasp12`）的基于微服务器的集群如图 9-1 所示。三个虚拟机（VM）作为客户端生成
    IO 请求（命名为 `Cag-blaster-ixgbe-02` 到 `Cag-blasterixgbe-04`）。所有测试均在 Ceph Jewel 版本中完成。在这种基于微服务器的
    filestore 配置中，每个节点/驱动器被划分为四个分区。`/dev/sda1` 安装操作系统（Ubuntu），`/dev/sda3` 被保留。`/dev/sda2`
    用于元数据，`/dev/sda4` 用于用户数据。


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig1_HTML.png](img/468166_1_En_9_Fig1_HTML.png)


    图 9-1


    Ceph 集群拓扑


    ## Filestore IO 模式


    三个虚拟机作为客户端，向一个复制池（名为 `rep1`，副本数为 1）发送基准测试写入请求，持续 250 秒，并使用 `blktrace` 收集跟踪数据 310
    秒，因此每个客户端执行 `rados bench -p rep1 250 write`，每个节点执行 `blktrace /dev/sdax -w 310`。由于
    `blktrace` 的限制（它无法收集同一驱动器中的单个分区），`sda2`/`sda4` 和整个 `sda` 的跟踪数据是分开收集的。还使用了一个总线分析器来验证跟踪数据。


    12 个节点的共同属性列于表 9-1 中。您可以观察到基本属性大体相似。其中一个 IO 模式曲线如图 9-2 和 9-3 所示，其中三行分别代表 `sda2`、`sda4`
    和 `sda`。请注意，所有 wasp 节点都启用了写缓存。命令 `"ceph tell osd.* bench 41943040 4194304"` 给出了大约
    100MBPS（缓存后）。因此，这意味着三个客户端（每个 32 个线程）几乎完全占用了磁盘带宽。原因将在后面解释。


    您还可以看到，不同节点的 IO 模式可能仍然存在差异；例如，某些节点的读写比率较高，而其他节点则较低，并且空闲时间分布也有所不同。根据读写比率，我们可以将
    IO 模式大致分为两类：一类是读主导，另一类是写主导。当读主导时，读的平均大小会变小。


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig3_HTML.png](img/468166_1_En_9_Fig3_HTML.png)


    图 9-3


    不同分区中的 IO 模式：吞吐量和 IOPS


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig2_HTML.png](img/468166_1_En_9_Fig2_HTML.png)


    图 9-2


    不同分区中的 IO 模式：LBA 和大小分布


    表 9-1


    Ceph 节点的共同属性


    | 属性 | 元数据 | 数据 |

    | --- | --- | --- |

    | 读写 | 混合读写 | 无读请求 |

    | 大小 | 相对较小的请求（8 块请求占主导）；写入大小变化很大；读写比率变化很大。 | 1024 块请求占主导，其次是小块 |

    | 顺序性 | 模式 = 8（非常小）；在较小范围内相对随机。近顺序比率远高于严格顺序比率（50% 的请求存在小间隙） | 模式 = 0；高顺序比率。近顺序比率更高（5%
    的写入请求存在小间隙） |

    | 写入更新 | 高更新比率（>50% 的写入请求被更新） | 低更新比率（更新块 <1%，更多是部分更新） |

    | 写入堆栈距离 | 达到高命中率所需的距离相对较小；平均重叠大小较小（8 块）；写缓存是必要的。 | 达到高命中率所需的距离相对较大；平均重叠大小较小；写缓存是不必要的。
    |


    表 9-2 显示了不同场景下不同节点的总空闲时间。基本上，空闲时间分布不均，这意味着每个节点的工作负载实际上是不均衡的。换句话说，某些节点非常繁忙，例如“3-8”（3
    个客户端，8 个线程）情况下的 `wasp12`，而某些节点则非常“懒惰”，例如“3-8”情况下的 `wasp8`。这部分是由于负责 PG（放置组）分配的
    CRUSH 算法所致。尽管合理数量的客户端和线程可能会缓解不均衡分布，但可能无法从根本上解决这个问题。因此，应实施一些改进策略，例如异步、主动反馈、可调整
    PG 等。


