    length, besides the queue depth and the time interval. The procedure is similar
    to the previous case. Table [5-13](#468166_1_En_5_Chapter.xhtml#Tab13) shows the
    result. You can see that App 5 is most significant for post-read; while App 6
    is less significant. `b` is generally smaller than 1 for short queue depth. When
    prefetch size is very small (< 64), `b` is very small (<< 1). When the queue length
    and hole length is long, a prefetch policy is generally useful. Based on the value
    of `b`, you may say that this policy is generally useless for App 6, most significant
