    你还可以通过统计以下指标来分析后读与顺序流之间的关系：1) 流数量（`c`）及比率 `c`[1] = `c`/总读取数；2) 每个流的命中频率 `c`[2]；3)
    缓存命中数 `b`[2]（仅考虑后读，重新定义 `b`[2]）。此测试有助于检查无限序列读取是否生效，例如，仅当序列长度足够长时，缓存才进入无限模式。在无限模式下，后读是自动进行的。然而，如果未处于无限模式，在检测到两个命令的顺序流后，仍需考虑后读的收益，例如该流可能附加三个或更多命令。


    你可以通过定义以下指标进一步探究预取与孔洞填充之间的关系：


    *   **增益：** 获得的额外缓存命中数（`d`[2]）= 取指长度 x 且孔洞长度 y 下的缓存命中率（`d`[3]）- 无预取和孔洞填充时的缓存命中率（`d`[0]）

    *   **损失：** 额外命令发生次数 / 总读取命令数（`d`[1]）

    *   **增益-损失比** `d` = `d`[2]`/d`[1]：该值越高越好


    这里采用两种比较方法：


    *   两个队列，一个用于预取（`Q`[1]），另一个用于孔洞填充（`Q`[2]），均采用 LRU 算法。考虑重叠命中率，即如果一个命令在 `Q`[1] 中命中，则也在
    `Q`[2] 中命中，反之亦然。

    *   两个队列，一个用于预取（`Q`[1]），另一个用于孔洞填充 + 预取（`Q`[3]），均采用 LRU 算法。考虑 `Q`[3] 相对于 `Q`[1]
    的额外命中率。


    定义 `x`[0] 为无预取和孔洞填充策略时的命中数，`x`¯[1] = `x`[1] + `x`[0] 为采用预取时的命中数，`x`¯[2] = `x`[2]
    + `x`[0] 为采用孔洞填充时的命中数，`x`¯[3] 为同时采用预取和孔洞填充时的命中数。如果 `x`[0] 远大于 `x`[1] 和 `x`[2]，则表明预取和孔洞填充之间差异不大；否则，检查
    `x`[1] 和 `x`[2] 之间的差异。如果 `x`[1] 远大于 `x`[2]，则表明取指的收益远大于孔洞填充；否则，进行孔洞填充比预取更合理。如果
    `x`[3] − `x`[0] 远大于 `x`[1]，则表明孔洞填充从重取中获益；否则，预取并无益处。

