    ## 基本指标


    基本指标通常简单且易于观察。但这并不意味着它们包含的信息少于高级指标。在某些情况下，基本指标足以解释工作负载特性。


    ### LBA 分布


    通过 LBA 分布随时间变化的曲线，您可以轻松观察到 IO 访问的随机性/顺序性。图 2-2 给出了两个仅写请求的 LBA 分布示例。左侧图显示从 LBA
    6.7 ∗ 10⁸ 到 6.8 ∗ 10⁸ 的顺序访问。右侧图混合了顺序和随机写访问。图 2-3 显示 IO 模式结合了随机读访问和混合写访问。很明显，写访问比读访问更具顺序性，因为写访问包含多个顺序流。请注意，有时两个连续请求之间可能存在微小间隙，尽管从图表上看可能呈现顺序性。然而，在大多数情况下，这些近乎顺序的
    IO 模式可以按顺序访问。


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig3_HTML.jpg](img/468166_1_En_2_Fig3_HTML.jpg)


    图 2-3


    来自 Hadoop 节点的 LBA 分布


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig2_HTML.jpg](img/468166_1_En_2_Fig2_HTML.jpg)


    图 2-2


    来自 Ceph 节点的 LBA 分布


    #### 大小分布


    通常，驱动器（无论是 HDD 还是 SSD）更倾向于顺序访问，因此顺序访问的吞吐量远高于随机访问，尤其是对于 HDD。请求大小也很重要，尤其是在磁盘队列较短时，这一点将在第
    4 章的图 4-2 和图 4-3 中清晰说明。


    图 2-4 绘制了请求频率和 CDF（累积分布函数）与请求大小的关系。对于写请求的分布，您可以看到在此案例中大小为 1024 块的请求占比接近 50%，这通常意味着
    IO 模式以大尺寸请求为主。请注意，由于操作系统/文件系统和磁盘驱动器的限制，最大请求大小通常为 1024 块，因此即使用户请求 1MB 大小的文件，它也会在内部被分成两个
    IO 请求（假设每块 512 字节）。


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig4_HTML.jpg](img/468166_1_En_2_Fig4_HTML.jpg)


    图 2-4


    来自 Hadoop 节点的大小分布


    如果您还需要了解相对于 LBA 范围的大小分布，可以绘制如图 2-5 所示的图表，从中您可以结合大小信息了解更多关于热区间的信息。由于您知道 HDD 中不同位置（例如内圈、中圈、外圈）的传输速度不同，LBA
    可以结合请求大小信息大致指示相对速度。


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig5_HTML.jpg](img/468166_1_En_2_Fig5_HTML.jpg)


    图 2-5


    LBA 与大小分布的组合图


    ### 读/写分布


    读和写访问在驱动器上可能具有不同的性能。对于 HDD，差异可能很小。然而，对于消费级 SSD，差距可能很大。此外，读和写访问可能相互依赖。例如，当一次新的写入刚刚完成时，数据可能仍在缓存中。随后的读取可能直接从缓存访问数据，而不是进行介质操作。因此，分布时间的可视化可以直观地展示这种依赖关系。您可以将数据绘制在单个图中或两个单独的图中，如图
    2-3 所示。


    表 2-4


    指标计算所需字段


    |   | 到达时间 | 完成时间 | LBA | 请求大小 | 操作模式 |

    | --- | --- | --- | --- | --- | --- |

    | LBA 分布 | 是 (或) | 是 (或) | 是 |   |   |

    | 大小分布 |   |   |   | 是 |   |

    | IOPS | 是 | 是 (或) |   |   |   |

    | 吞吐量 | 是 | 是 (或) |   | 是 |   |

    | 队列长度/深度 | 是 (或) | 是 (或) |   |   |   |

    | 忙/闲时间 | 是 | 是 |   |   |   |

    | 读/写分布 | 是 (或) | 是 (或) |   |   | 是 |

    | 到达间隔时间分布 | 是 |   |   |   |   |

    | 完成间隔时间分布 |   | 是 |   |   |   |


    ### 到达间隔时间与完成间隔时间


    到达间隔时间定义为两个顺序到达请求之间的时间间隔：`δt[i] = D[i] − D[i−1]`。类似地，完成间隔时间定义为 `δt¯[i] = C¯[i]
    − C¯[i−1]`，其中 `C¯[i]` 是基于完成时间序列重新排序后的 `C[i]`。`δt[i]` 是工作负载突发性 [38] 的直接指标，与预期的请求平均完成时间相关。当平均
    `δt[i]` 远小于 `δt¯[i]` 时，通常意味着系统处于高负载工作状态，可能超出了存储设备的能力。从某种意义上说，这两个指标与 IOPS 密切相关。

