    Note that the meaning of “block” in HDD and SSD is different. However, the definition
    of one sector as one block in HDD is used here. In addition, there are some different
    formats for sectors, such as 512, 512e, 4k, 4kn, etc. Without particular comments,
    assume that one sector is equal to 512 bytes for representation simplicity.


    A block-level trace usually contains some common fields, like arrival time, completion
    time, LBA (first or last LBA), request size, operational mode (read or write,
    sync or async), etc. Some other fields, like bus time and merge time, depend on
    the trace collection tools. Table [2-3](#468166_1_En_2_Chapter.xhtml#Tab3) gives
    an example of trace. For the *i*^(*th*) request, r[*i*], denotes its arrival and
    completion action time as D[*i*] and C[*i*]. Usually, we arrange all *N* requests
    in sequence of D[*i*], *i.e.* (r[1],*. . .* , r[*i*], . . . ,r[*n*]).


