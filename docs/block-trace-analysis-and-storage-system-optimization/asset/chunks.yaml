- fmt: '# Bottleneck Identification


    Ceph is a rather complex system whose performance is decided by both hardware
    and software [41]. From the hardware point of view, CPU, memory, disk, and network
    are the four major components. Tables [9-8](#468166_1_En_9_Chapter.xhtml#Tab8)
    and [9-9](#468166_1_En_9_Chapter.xhtml#Tab9) give some general views. From the
    software aspect, there are even more factors, such as the file system, Linux OS
    settings, memory allocator, and more. In addition, the Ceph system configuration
    provides hundreds of parameters, and many of them affect the overall performance.
    Therefore, it is generally difficult to identify the performance bottleneck of
    the overall system.


    **Table 9-9** Impact of Disk


    | Variables | Options | Remarks |

    | --- | --- | --- |

    | Drive type | HDD, SSD, NVM, etc. | Balance between price and performance shall
    be considered; usually SSD acts as cache and journal; unbalanced structure may
    lead to performance loss; one bad drive can affect the overall pool performance
    (`ceph osd perf`). |

    | Drive number | Drive per server, drive per OSD | More drives increase throughput
    per server but decrease throughput per OSD; one OSD per platter/drive. |

    | Drive controller | SAS/ SATA/ PCIe HBA, etc. | More/better HBAs increase throughput.
    HW RAID may increase IOPS. The best performance is achieved when you have one
    HBA for every 6-8 SAS drives, but it is cheaper to use a SAS expander to let one
    HBA control 24 (or more) drives. More HBAs and fewer expanders are used to achieve
    maximum throughput, or SAS expanders can be applied to minimize cost when full
    drive throughput is not needed. |

    | RAID controller | Enable/ disable; cache | More recent testing with Red Hat,
    Supermicro, and Seagate also showed that a good RAID controller with onboard write-back
    cache can accelerate IOPS-oriented write performance. While Ceph does not use
    RAID (since it supports both simple replication and EC), the right RAID controller
    cache can still improve write performance via the onboard cache. |

    | Drive cache | Enable or disable write cache | Cache has large impact on small
    write performance |


    **Table 9-8** Impact of CPU, Memory, and Network


    | Variables | Options | Remarks |

    | --- | --- | --- |

    | CPU | Core number, speed, structure, instruct set, etc. | A common recommendation
    is at least one (virtual) core per OSD. Faster CPU cores usually help in performance
    improvement, although the CPU structure also matters (e.g., Intel vs. ARM, internal
    architecture/versions) the real perf/GB, perf/$, and so on. Turning off energy-saving
    mode helps. |

    | Memory | RAM per server, RAM per OSD, etc. | A common recommendation is at least
    1GB per 1TB OSD, and better 2GB per OSD. The actual value is workload-dependent.
    |

    | BIOS | HT mode, energy-saving, NUMA, etc. | HT affects the virtual core number
    (enable). Consider the tradeoff of energy-savings for low power but less computational
    resource allocated. |

    | Network switch/NIC | Bandwidth and latency; Ethernet, Fiber, Infiniband, etc.
    | Higher bandwidth for higher throughput to an extent; lower latency for more
    small IO. Try `ms crc data = false` and `ms crc header = false` for high-quality
    networks. For cluster with less than 20 spinners or 2 SSDs, consider upgrading
    to a 25GbE or 40GbE. |


    In this sense, you shall monitor all necessary components of the system in order
    to make a conclusion. Take the Ceph software stack as an example in Figure [9-5](#468166_1_En_9_Chapter.xhtml#Fig5).
    You may deploy the corresponding system monitoring tools ^([^(74)](#fn74)) into
    interested stack points to collect data so that you can capture all possible places
    for SW failures, errors, performance degrades, etc. plus all potential SW performance
    tuning points. In fact, Ceph has some built-in monitoring tools such as `LTTng`.


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig5_HTML.jpg](images/468166_1_En_9_Chapter/468166_1_En_9_Fig5_HTML.jpg)


    **Figure 9-5** Ceph software stack


    Dedicated tools for Ceph deployment, monitoring, and management have been developed,
    such as `CeTune` (Intel),^([^(75)](#fn75)) `VSM` (Intel),^([^(76)](#fn76)) `OpenATTIC`,^([^(77)](#fn77))
    and `InkScope`.^([^(78)](#fn78))


    With the aid of some integrated tools, such as `SaltStack`,^([^(79)](#fn79)) you
    may design your own all-in-one tool. Figure [9-6](#468166_1_En_9_Chapter.xhtml#Fig6)
    shows one possible design, which intends to integrate the functionalities of configuration,
    deployment, benchmarking, and measurement analysis of Ceph systems. It can be
    developed by using the “glue” programming language `Python`, together with some
    `Bash` scripts.


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig6_HTML.jpg](images/468166_1_En_9_Chapter/468166_1_En_9_Fig6_HTML.jpg)


    **Figure 9-6** Functionalities of a Ceph performance tool


    As shown in the overall structure of Figure [9-6](#468166_1_En_9_Chapter.xhtml#Fig6),
    there are some components integrated into this tool, such as `SaltStack` for Ceph
    management, `InfluxDB`^([^(80)](#fn80)) with `Telegraf`^([^(81)](#fn81)) for performance
    data collection and storage, and `Grafana`^([^(82)](#fn82)) for data visualization.
    All these tools are open source and under the free license (`InfluxDB`/`Telegraf`
    under MIT, `Grafana`/`salt-stack` under Apache v2).


    `SaltStack` platform or `Salt` is an open-source configuration management software
    and remote execution engine in `Python`. It essentially has a server-client structure.
    You can use `Salt` to manage the Ceph nodes and distribute executing commands.
    `InfluxDB` is a time series database built from scratch to handle high write and
    query loads. `Telegraf`, developed by `Go`,^([^(83)](#fn83)) is a metric collection
    daemon that can gather metrics from a wide array of inputs and write them into
    a wide group of outputs. It is plugin-driven for both the collection and output
    of data for easy extension. It is a compiled and standalone binary that can be
    executed on any system without external dependencies; no `npm`/`pip`/`gem` or
    other package management tools required. Once `Telegraf` daemon is running, the
    data will be automatically saved to `influxDB`. `Grafana` provides a powerful
    and exquisite way to create, explore, and share dashboards and information with
    your team and the world. After the DBs are set up, you can configure `Grafana`''s
    data sources from these `influxDB`.


    With this tool, you can easily obtain all necessary information. Take a look at
    the example provided in the section on the filesstore IO pattern. From Table [9-2](#468166_1_En_9_Chapter.xhtml#Tab2),
    you can clearly observe that some drives are drained of IO bandwidth. However,
    the CPU, memory and network usages are all lower than 50% at the same time. Therefore,
    you can make a conclusion that the drives are the performance bottleneck.


