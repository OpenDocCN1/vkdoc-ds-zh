- fmt: 'Let’s look at an example in Table [2-6](#468166_1_En_2_Chapter.xhtml#Tab6).
    Assume that these requests arrive in a *t-*seconds time window. It is obvious
    that all requests are random by comparing the last LBA of the pervious request
    and first LBA of the current request in terms of FIFO. In this case, there are
    seven times of seeks and `N[r] = 8` and `N[s] = 0`. In this sense, the workload
    is random because there is no sequential stream. However, if you reorder the requests
    with the aid of queue in term of LBA, so the request order `< 263158(7)4 >`, you
    have `N[r] = 3` and `N[s] = 4`, in terms of (strict) sequential streams. Note
    that the request number 7 is absorbed by the request number 8 during the reordering.
    So `M[2] = 2` (`< 2631 >` and `< 58(7) >`) for (strictly) sequential stream. With
    two constraints, `S = 1024` and `M[2] = 2`, you have (`< 58(7) >` and `< 4 >`).
    The stream of `< 2631 >` is removed due to small size.


    When considering a near sequential stream with `Δd = 64` and `512`, you have `M[2]
    = 3` (`< 2631 >`, `< 58(7) >`, and `< 4 >`) and `1` (`< 263158(7)4 >`), respectively,
    under strictly sequential stream.


    **Table 2-6** An Example of LBA Sequence and Randomness


    | Order | First LBA | Last LBA | Order | First LBA | Last LBA |

    | --- | --- | --- | --- | --- | --- |

    | 1 | 128 | 135 | 5 | 256 | 511 |

    | 2 | 0 | 7 | 6 | 8 | 63 |

    | 3 | 64 | 127 | 7 | 640 | 647 |

    | 4 | 1536 | 2047 | 8 | 512 | 1279 |


    From this example, here are the following variables:


    *   `N[s1]`: The number of requests with sequential access

    *   `N[s2]`: The number of requests with near sequential access and LBA gap

    *   `N[r]`: The number of the remaining requests


    These variables have strong connection with the logical seek defined in the next
    section.


    The practical gap size `Δd` in a real application is usually determined by the
    system performance tolerance. Usually, it is up to few track sizes. For example,
    if an acceptable tolerance is 5ms, then `Δd` can be up to 1536 blocks based on
    disk model of 10K RPM drive with track/head switch time at 1ms and average track
    size at 1.5MB. For random access, the average rotational latency is 3ms. Assume
    a 50% chance of the new request in the same track and 50% chance in next track
    (the actual probability is coupled with `Δd`). Then you have `5 - (3 + 1) * 50%
    = 3ms` for further rotation, which is about half a track size, so 1536 blocks.^([^(34)](#fn34))


    **Sequential ratio:** Due to the different views on the sequence, the definition
    of sequential ratio is also varied. Below, few examples are listed.


    *   DEF1: The summation of sequential commands detected with `S` and `M[2]` thresholds
    / total commands

    *   DEF2: (The summation of sequential commands detected with `S` and `M[2]` thresholds
    - total sequential streams) / total commands

    *   DEF3: The summation of the request size of sequential commands detected with
    `S` and `M[2]` thresholds / total request size of all commands

    *   DEF4: (The summation of the request size of sequential commands detected with
    `S` and `M[2]` thresholds - the summation of the size of the first command in
    sequential streams) / total request size of all commands


    If you remove size constraint `S`, you get another four definitions.


    ### Spatial Locality and Logical Seek Distance


    Locality, as a special case of correlation of a variable with itself over short
    to medium ranges, can be visualized as a 2D probability surface `p(s, d)`, showing
    the probability that the first time an address `s` bytes away will be referenced
    in exactly `d` cycles. There are generally two types of locality: spatial locality
    and temporal locality. For spatial locality, if the distance `s = |x[i] - x[j]|`
    is small, it implies that not long after referencing address `x[i]` you will discover
    a reference to the adjacent address `x[j]`. Temporal locality will be discussed
    in the next subsection.


    Note that only LBAs are provided in most traces, not the physical block address
    (PBA). Because different HDDs may not have exactly same data layouts (such as
    serpentine), identical LBA layouts between different HDDs can result in different
    PBAs. However, the difference is usually very small if their data layout is similar.
    Therefore, analyzing logical distance is also meaningful.


    Below I discuss two distances to indicate spatial and temporal localities, respectively
    [35].


    #### Logical Seek Distance


    This metric is an indicator for spatial locality. It defines the logical block/LBA
    distance between “consecutively” device-received IOs.


    *   Non-queued next: The simplest case, which calculate the distance between two
    exactly consecutive IOs.

    *   Non-queued closest: The absolute closest distance = `min(||last_LBA(r[j-1])
    - first_LBA(r[j])||, ||last_LBA(r[j]) - first_LBA(r[j+1])||)`, where `r[j]` is
    the current IO. The closest distance is the signed value of the absolute close
    distance, where `||·||` indicates the absolute value.

    *   Queued next: Simulates a queue with certain rules such that the absolute closest
    distance = `min(||last_LBA(r[i]) - first_LBA(r[j])||)`, `i = 1, ..., n[i] ≤ N`,
    where `n[i] ≤ N` is the current queue length, and `r[i]` is the IO in the queue.

    *   Queued closest: Simulates a queue such that the absolute closest distance
    = `min(||last_LBA(r[i]) - first_LBA(r[j])||[i=1,...,ni], ||last_LBA(r[j]) - first_LBA(r[j]+1)||)`.


    In general, `||Queued closest|| ≤ ||Non-queued closest|| ≤ ||Non-queued next||`.
    For the distance, you can further define three values: mean, median, mode. Mode
    indicates the most frequent number such that the larger the counter for mode =
    0, the better the sequence.


    ### Temporal Locality and Logical Stack Distance


    Temporal locality means that the same address is referenced again after `d` steps.
    Popularity is a terminus that is closely related to temporal locality.


    #### Logical Stack Distance


    If an LBA in `r[i]` is referred to again after some time by another request `r[j]`,
    the command distance between the two requests is defined as (simplified) the logical
    stack distance, an important temporal locality index. Let’s take write requests
    as an example. If the distance is small enough (e.g., smaller than the HDD’s DRAM
    cache queue size), it might be a hit in the DRAM cache; otherwise, a disk update
    is required for the write. If the frequency of the write for a certain range of
    distance is high, it means the update frequency is high.


    Unlike the case in [35], we are more interested in queued stack distance with
    consideration of cache. Therefore, let’s also look into read/write dependency.
    The details will be discussed in later in this chapter.


    #### Burstiness and Self-Similarity


    I/O requests almost never occur singly but tend to arrive in groups because, if
    there were long intervals without arrival, there were intervals that had far more
    arrivals than their even share. They are generally related to queue depth and
    request arrival rate and inter-arrival time. This phenomenon is often called long-range
    dependence and is typically explained as (stochastic) self-similarity because
    that is the only explanation that avoids non-stationarity. The phenomenon of self-similarity
    describes how a property of an object is preserved while scaling in space and/or
    in time. In other words, in addition to the long-range dependence property, the
    scale invariance property holds at any different time scale, like in a fractal
    shape.'
