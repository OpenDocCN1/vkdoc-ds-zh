  trans: '

    ### 统计属性可视化与评估


    除了前几节提到的统计属性外，感兴趣属性的边缘概率分布和联合概率分布还有其他几个属性，这些属性可能对系统行为的定量分析产生强烈影响 [35]：


    - **正态性：** 一个概率分布可以用正态分布精确近似。尽管现实中完美的正态分布很少见，但它常被用作参考模型。

    - **非平稳性：** 在平稳过程中，输出（作业大小、到达间隔时间）会变化，但产生这些输出的随机过程不会变化。

    - **长尾性与幂律：** 概率分布中远离均值或中位数的某些区域，例如概率分布尾部的极端值，被赋予了相对较高的概率，遵循次指数或多项式定律，这与正态分布族的情况相反，后者的尾部呈指数衰减。

    - **重尾性：** 分布的长尾呈多项式衰减，并且满足自相似性。

    - **周期行为与季节性变化：** 它们是非平稳工作负载的迹象，必须单独处理。

    - **自相关、互相关与短程依赖性：** 自相关也称为序列相关或短期/短程记忆，其中短时间尺度上的自相关显著；长程依赖性也称为长期记忆，其中长时间尺度上的自相关显著。


    这些属性可以通过图形绘制进行可视化。经验累积分布函数（EDF）和互补经验累积分布函数（CEDF）常用于观察样本分布。特别地，对数-对数 EDF 和对数-对数
    CEDF 图通常分别用于比较样本概率分布的主体和尾部。类似地，Q-Q 图（第一个数据集的**分位数**与第二个数据集的**分位数**的对比图）可用于评估经验概率分布与另一个参考概率分布（无论是理论分布还是经验分布）之间的可能差异，尤其是在尾部。


    质量-计数差异图和洛伦兹曲线可用于寻找幂律属性的证据。质量-计数差异图将“质量”概率分布（由质量单位属于小于预定义 `x` 的项目的概率给出）与“计数”概率分布（由
    CDF 给出）进行对比，以显示这两个概率分布之间可能存在的差异。洛伦兹曲线是说明“计数”分布与“质量”分布之间关系的另一种方式；它通过配对对应相同值的百分位数生成（即曲线上的点
    (`p[c]`, `p[m]`) 满足 `p_m = F_m(x) = F_m(F_c^{-1}(p_c))`，其中 `F_m(·)` 和 `F_c(·)`
    分别是“质量”分布和“计数”分布的累积分布函数，`F_c^{-1}(·)` 是 `F_c(·)` 的反函数）。


    运行序列图和自相关图用于研究短程和长程依赖性以及周期模式和趋势。运行序列图按时间序列显示观测数据；它通过根据数据出现的时间顺序绘制感兴趣（单变量）属性的值来构建；该图对于发现位置和尺度的变化、定位异常值以及总体上了解观测数据的趋势特别有用。自相关图（也称为相关图）是样本自相关函数（ACF）的图，即随时间滞后增加时的样本自相关；它用于检查同一属性观测序列的随机性。如果是随机的，这些自相关在任何时间滞后间隔下都应接近
    0；反之，如果不是随机的，则一个或多个自相关将显著不同于 0。


    一些假设检验技术可用于对这些属性进行定量评估，例如 F 检验、T 检验、K-S（Kolmogorov-Smirnov）检验、Mann-Whitney U 检验和
    H 检验。这些检验可以比较两个经验分布函数/样本之间的差异。皮尔逊 `r` 和斯皮尔曼 `ρ` 相关系数分别用于发现感兴趣属性之间的线性相关和一般相关。两个系数的范围都在
    [–1, +1] 之间，其中 +1 表示强正相关，–1 表示强负相关，0 表示无显著相关。更多细节将在第 9 章中描述。


    ### 读/写依赖关系


    依赖关系通常分为四类 [39]：


    - 写后读（ROW），或读后写（RAW），或真依赖

    - 写后写（WOW），或写后写（WAW），或写更新，或输出依赖

    - 读后写（WOR），或读后写（WAR），或反依赖

    - 读后读（ROR），或读缓存命中，或输入依赖


    在特定的时间窗口内，ROR 和 ROW 与缓存替换算法和读命中性能直接相关，而 WOR 和 WOW 与缓存更新策略相关。两个操作之间存在 ROW 关系取决于以下情况：如果第一个操作写入了一个块，该块随后被另一个操作读取，并且该块上没有中间操作。WOW
    和 WOR 的定义类似。ROR 是检查读缓存效率的一个非常常见的属性。ROW 可以检查所谓的“一次写入多次读取（WORM）”是否可能，这对于 SMR 来说是一个重要的价值（越高越好）。

    '
- fmt: '#### Write Update (Write on Write)


    A high `WOW` ratio generally means high block update ratio. Therefore, when replicate
    blocks exist, it might be better to update one of the copies and invalidate the
    remainder rather than update all the copies, if the `WOW` ratio is quite high
    within a short time window, for IO performance consideration. By comparing `ROW`
    and `WOW`, you can conclude the likelihood of blocks getting updated vs. being
    read or not. `SMR` generally expects less write update, resulting in smaller write
    amplification. If an out-of-place policy is applied for write updates, you can
    expect better spatial efficiency.


    In order to have a better view on `WOW`, I define three different types of update
    ratios below. Their different purposes are shown in Table [2-7](#468166_1_En_2_Chapter.xhtml#Tab7).


    **Table 2-7** Comparison of Write Update Ratios


    | | Frequented | Timed/ordered | Stacked |

    | --- | --- | --- | --- |

    | Total updated blocks/commands | Yes | Yes | Yes |

    | Timing issue | No | Yes | No |

    | Update frequency | Yes | No | No |

    | Memory stack | No | No | Yes |


    **Frequented update ratio:** During a time period, record the update frequency
    of each `LBA`. Any write hit is counted. If its frequency is larger than 1, the
    `LBA` is rewritten in the observation period. You can therefore provide a curve
    of x-axis vs. y-axis, where:


    - x is the maximum update frequency (≤1 no rewritten; otherwise rewritten)

    - y is the percentage of blocks updated (updated blocks at a specified-frequency
    value / total updated blocks of write commands) or its cumulated distribution
    function (`CDF`).


    This process gives a quick, coarse grain analysis of how `LBAs` are updated in
    a workload of conventional `PMR` drives. However, it may not reflect the actual
    ratio for `SMR` drives. In fact, due to the indirect mapping and log nature of
    `SMR`, it misses the actual write update; for example, a rewrite with an out-of-place
    update actually is "new" write to `SMR` drives.


    **Timed/ordered update ratio:** During a time period, record the total blocks
    of updated write request (repeated or not). An update is an operation to rewrite
    a block that was previously written during the observation period. You can provide
    a curve of x = time or command IDs vs. y = total size of updated blocks or percentage
    of blocks updated (updated blocks at frequency x / total blocks of commands),
    so the percept is the percentage of total blocks that were updated. Note that
    a similar definition to frequented update ratio and timed/ordered update ratio
    are given in [4, 40].


    **Stacked update ratio:** During a time period, record the update frequency of
    each write command (partial or full hit). Once a rewrite happens, it is counted
    as a new command (update frequency is always ≤1). You can provide a curve of x
    = logical stack distance vs. y = percentage of updated write commands (updated
    write commands/total commands), or a curve of x = logical stack distance vs. y
    = percentage of updated write size (updated write size/total commands). It shows
    the actual update size/commands and tells if an update in `SSD`/`DRAM` cache is
    necessary. Note that the stack distance can be also replaced by time interval.


    #### Read on Write (ROW)


    This metric is used to check if "write once read many (`WORM`)" is possible. In
    general, the higher the `ROW` ratio, the better the `WORM` property of the workload.


    **Frequented `ROW` ratio:** During a time period record the read hit frequency
    of each `LBA` after a write command. You can then plot a curve of x = maximum
    hit numbers or frequency (<1 not updated, otherwise updated) vs. y = percentage
    of blocks or commands hit (updated blocks at frequency x / total number of `HDD`
    blocks).


    **Timed `ROW` ratio:** During a time period, record the hit blocks of each read
    command since last write. You can provide a curve of x = time or command ID vs.
    y = percentage of blocks or commands of read hit commands (blocks of hit read
    commands/blocks of total commands).


    **Stacked `ROW` ratio:** During a time period, record the hit frequency of each
    read command (partial or full hit) since last write. You can provide a curve of
    x = logical stack distance vs. y = percentage of read hit command (hit read commands/total
    read commands) or y = percentage of blocks of read hit command.


    Beyond the material presented here, other qualities, such as self-similarity (for
    burst IO) and workload dependence among nodes (i.e. how the tasks are distributed
    among nodes) [35, 39], are interesting metrics to be studied further. In the spirit
    of brevity, I include a targeted presentation of workload metrics, omitting these
    analyses.


    ### Priority-Related Metrics


    Requests have priority during execution. Usually, the foreground activities have
    higher priority than background activities. In some cases, such as synchronization
    in `RAID5`/`6` and `EC` operations, these marked as synchronized requests may
    have higher priority due to time-out policies.


    Other metrics may be related to cluster, multi-threads, network and so on [41].
    For example, the network factors (I/O bandwidth distribution, channel utilization,
    instructions, packet sizes, source or destination of packets, page reference pattern,
    various forms of delay like transfer time and queuing delays, etc.) will also
    influence the final device performance.'
  raw: '#### Write Update (Write on Write)


    A high WOW ratio generally means high block update ratio. Therefore, when replicate
    blocks exist, it might be better to update one of the copies and invalidate the
    remainder rather update all the copies, if the WOW ratio is quite high within
    a short time window, for IO performance consideration. By comparing ROW and WOW,
    you can conclude the likelihood of blocks getting updated vs. being read or not.
    SMR generally expects less write update, resulting in smaller write amplification.
    If an out-of-place policy is applied for write updates, you can expect better
    spatial efficiency.


    In order to have a better view on WOW, I define three different types of update
    ratios below. Their different purposes are shown in Table [2-7](#468166_1_En_2_Chapter.xhtml#Tab7)
    .


    Table 2-7


    Comparison of Write Update Ratios


    |   | Frequented | Timed/ordered | Stacked |

    | --- | --- | --- | --- |

    | Total updated blocks/commands | Yes | Yes | Yes |

    | Timing issue | No | Yes | No |

    | Update frequency | Yes | No | No |

    | Memory stack | No | No | Yes |


    **Frequented update ratio:** During a time period, record the update frequency
    of each LBA. Any write hit is counted. If its frequency is larger than 1, the
    LBA is rewritten in the observation period. You can therefore provide a curve
    of x-axis vs. y-axis, where


    *   x is the maximum update frequency (≤1 no rewritten; otherwise rewritten)


    *   y is the percentage of blocks updated (updated blocks at a specified-frequency
    value / total updated blocks of write commands) or its cumulated distribution
    function (CDF).


    This process gives a quick, coarse grain analysis of how LBAs are updated in a
    workload of conventional PMR drives. However, it may not reflect the actual ratio
    for SMR drives. In fact, due to the indirect mapping and log nature of SMR, it
    misses the actual write update; for example, a rewrite with an out-of-place update
    actually is “new” write to SMR drives.


    **Timed/ordered update ratio:** During a time period, record the total blocks
    of updated write request (repeated or not). An update is an operation to rewrite
    a block that was previously written during the observation period. You can provide
    a curve of x = time or command IDs vs. y = total size of updated blocks or percentage
    of blocks updated (updated blocks at frequency x / total blocks of commands),
    so the percept is the percentage of total blocks that were updated. Note that
    a similar definition to frequented update ratio and timed/ordered update ratio
    are given in [4, 40].


    **Stacked update ratio:** During a time period, record the update frequency of
    each write command (partial or full hit). Once a rewrite happens, it is counted
    as a new command (update frequency is always ≤1). You can provide a curve of x
    = logical stack distance vs. y = percentage of updated write commands (updated
    write commands/total commands), or a curve of x = logical stack distance vs. y
    = percentage of updated write size (updated write size/total commands). It shows
    the actual update size/commands and tells if an update in SSD/DRAM cache is necessary.
    Note that the stack distance can be also replaced by time interval.


    #### Read on Write (ROW)


    This metric is used to check if “write once read many (WORM)” is possible. In
    general, the higher the ROW ratio, the better the WORM property of the workload.


    **Frequented ROW ratio:** During a time period record the read hit frequency of
    each LBA after a write command. You can then plot a curve of x = maximum hit numbers
    or frequency (*<*1 not updated, otherwise updated) vs. y = percentage of blocks
    or commands hit (updated blocks at frequency x / total number of HDD blocks).


    **Timed ROW ratio:** During a time period, record the hit blocks of each read
    command since last write. You can provide a curve of x = time or command ID vs.
    y = percentage of blocks or commands of read hit commands (blocks of hit read
    commands/blocks of total commands).


    **Stacked ROW ratio:** During a time period, record the hit frequency of each
    read command (partial or full hit) since last write. You can provide a curve of
    x = logical stack distance vs. y = percentage of read hit command (hit read commands/total
    read commands) or y = percentage of blocks of read hit command.


    Beyond the material presented here, other qualities, such as self-similarity (for
    burst IO) and workload dependence among of nodes (i.e. how the tasks are distributed
    among nodes) [35, 39], are interesting metrics to be studied further. In the spirit
    of brevity, I include a targeted presentation of workload metrics, omitting these
    analyses .


    ### Priority-Related Metrics


    Requests have priority during execution. Usually, the foreground activities have
    higher priority than background activities. In some cases, such as synchronization
    in RAID5/6 and EC operations, these marked as synchronized requests may have higher
    priority due to time-out policies.


    Other metrics may be related to cluster, multi-threads, network and so on [41].
    For example, the network factors (I/O bandwidth distribution, channel utilization,
    instructions, packet sizes, source or destination of packets, page reference pattern,
    various forms of delay like transfer time and queuing delays, etc.) will also
    influence the final device performance.'
  trans: '

    #### 写更新（写入时写入）


    较高的`WOW`比率通常意味着较高的块更新比率。因此，当存在副本块时，如果`WOW`比率在短时间内相当高，出于 IO 性能考虑，更新其中一个副本并使其余副本失效可能比更新所有副本更好。通过比较`ROW`和`WOW`，你可以推断出块被更新与被读取的可能性。`SMR`通常期望较少的写更新，从而产生较小的写放大。如果对写更新采用异地更新策略，则可以期待更好的空间效率。


    为了更清晰地了解`WOW`，我在下面定义了三种不同类型的更新比率。它们的不同用途如表 2-7 所示。


    **表 2-7** 写更新比率对比


    | | 频繁型 | 定时/有序型 | 堆叠型 |

    | --- | --- | --- | --- |

    | 总更新块/命令 | 是 | 是 | 是 |

    | 时序问题 | 否 | 是 | 否 |

    | 更新频率 | 是 | 否 | 否 |

    | 内存堆栈 | 否 | 否 | 是 |


    **频繁更新比率：** 在一段时间内，记录每个`LBA`的更新频率。任何写命中都会被计数。如果其频率大于 1，则表明该`LBA`在观察期内被重写。因此，你可以提供一个
    x 轴与 y 轴的曲线图，其中：


    - x 是最大更新频率（≤1 表示未重写；否则表示已重写）

    - y 是更新块的比例（在指定频率值下更新的块数 / 写命令的总更新块数）或其累积分布函数（`CDF`）。


    这个过程可以快速、粗略地分析在传统`PMR`驱动器的工作负载中`LBA`是如何被更新的。然而，它可能无法反映`SMR`驱动器的实际比率。事实上，由于`SMR`的间接映射和日志特性，它遗漏了实际的写更新；例如，采用异地更新的重写操作对于`SMR`驱动器来说实际上是“新”写入。


    **定时/有序更新比率：** 在一段时间内，记录更新写请求的总块数（无论是否重复）。更新是指在观察期内重写先前已写入块的操作。你可以提供一个曲线图，其中 x
    = 时间或命令 ID，y = 更新块的总大小或更新块的比例（在频率 x 下更新的块数 / 命令的总块数），因此感知结果是总块中被更新的百分比。请注意，[4,
    40]中给出了与频繁更新比率和定时/有序更新比率类似的定义。


    **堆叠更新比率：** 在一段时间内，记录每个写命令的更新频率（部分命中或完全命中）。一旦发生重写，它就被计为一条新命令（更新频率始终≤1）。你可以提供一个曲线图，其中
    x = 逻辑堆栈距离，y = 更新写命令的比例（更新写命令数 / 总命令数），或者 x = 逻辑堆栈距离，y = 更新写大小的比例（更新写大小 / 总命令大小）。它显示了实际的更新大小/命令，并说明了在`SSD`/`DRAM`缓存中进行更新是否必要。请注意，堆栈距离也可以用时间间隔来代替。


    #### 读更新（写入时读取）


    此指标用于检查“一次写入多次读取（`WORM`）”是否可能。通常，`ROW`比率越高，工作负载的`WORM`特性越好。


    **频繁`ROW`比率：** 在一段时间内，记录每个`LBA`在写命令之后的读命中频率。然后你可以绘制一个曲线图，其中 x = 最大命中次数或频率（<1 表示未更新，否则表示已更新），y
    = 命中的块或命令的比例（在频率 x 下更新的块数 / `HDD`总块数）。


    **定时`ROW`比率：** 在一段时间内，记录自上次写入以来每个读命令的命中块。你可以提供一个曲线图，其中 x = 时间或命令 ID，y = 读命中命令的块或命令的比例（命中读命令的块数
    / 总命令块数）。


    **堆叠`ROW`比率：** 在一段时间内，记录自上次写入以来每个读命令的命中频率（部分命中或完全命中）。你可以提供一个曲线图，其中 x = 逻辑堆栈距离，y
    = 读命中命令的比例（命中读命令数 / 总读命令数）或 y = 读命中命令的块比例。


    除了此处介绍的内容之外，其他特性，如自相似性（针对突发 IO）和节点间的工作负载依赖性（即任务如何在节点间分布）[35, 39]，也是值得进一步研究的有趣指标。为简洁起见，我在此仅针对性地介绍工作负载指标，省略了这些分析。


    ### 优先级相关指标


    请求在执行时具有优先级。通常，前台活动的优先级高于后台活动。在某些情况下，例如`RAID5`/`6`和`EC`操作中的同步，这些被标记为同步的请求可能由于超时策略而具有更高的优先级。


    其他指标可能与集群、多线程、网络等相关[41]。例如，网络因素（I/O 带宽分布、信道利用率、指令、数据包大小、数据包的源或目标、页面引用模式、各种形式的延迟如传输时间和排队延迟等）也会影响最终设备的性能。

    '
- fmt: "# Modeling Issues\n\nThere are two regular approaches to evaluating a system\
    \ design. One employs the traced workload directly to drive a simulation. The\
    \ other builds a model from the trace and uses the model for either analysis or\
    \ simulation. Although the numerical trace-based approach is straightforward,\
    \ the workload models may have some advantages over traces, such as adjustment\
    \ with controlled modification, repetitions, stationarity, generalization, avoiding\
    \ noise, increased understanding, added features, efficiency, etc. Therefore,\
    \ it is important to understand the metrics via mathematical models. In the previous\
    \ section, I pointed out that the hypothesis tests are based on some assumptions\
    \ of statistical models. Tables [2-8](#468166_1_En_2_Chapter.xhtml#Tab8) and [2-9](#468166_1_En_2_Chapter.xhtml#Tab9)\
    \ list few common sense details on the modeling issues of some basic and advanced\
    \ metrics. For more details, refer to [35].\n\n**Table 2-9** Mathematical Models\
    \ for Advanced Metrics\n\n| Metrics | Modeling issues |\n| --- | --- |\n| **Locality**\
    \ | Commonly used distributions: Zipf distribution (Independent Reference Model).\
    \ Other models: LRU stack model, Markovian models, fractal model |\n| **Spatial\
    \ locality** | The simplest way is by counting unique substrings of the reference\
    \ stream. Formally measured by the size of the working set. |\n| **Temporal locality**\
    \ | The simplest measure is to look at the reference stream through a pinhole\
    \ or using a simulation of an LRU stack. |\n| **Read/write dependency** | Models:\
    \ State machine, Markov chain, clustering |\n| **Priority-related metrics** |\
    \ They are completely determined by the OS/FS rules. A model can be built based\
    \ on Markov chain with |\n| **Burstiness and self-similarity** | Auto-covariance\
    \ and covariance matrices are often used to describe self-similarity. |\n\n**Table\
    \ 2-8** Mathematical Models for Basic Metrics\n\n| Metrics | Modeling issues |\n\
    | --- | --- |\n| **Throughput** | Commonly used distributions: Pareto distribution\
    \ |\n| **Queuing time** | Commonly used distributions: exponential distribution,\
    \ Erlang distribution |\n| **Service time** | Commonly used distributions: exponential\
    \ distribution, Erlang distribution |\n| **Response time** | Commonly used distributions:\
    \ exponential distribution, Erlang distribution |\n| **Disk seek time** | May\
    \ be modeled by data fitting using a piecewise function |\n| **Read to write ratio**\
    \ | No obvious distribution, depends on read/write dependency |\n| **Request size\
    \ distribution** | Commonly used distributions: logarithmic distribution, trunked-normal\
    \ distribution, Pareto distributions, exponential distribution, power-law distribution,\
    \ log-uniform |\n| **LBA range/randomness** | See spatial locality |\n| **Inter-arrival\
    \ time** | Commonly used distributions: Poisson distribution, exponential distribution,\
    \ lognormal distribution |\n\nA general procedure to generate an analytical model\
    \ is as follows:\n\n- First, decide the formulation: the characterization level\
    \ and the workload basic component.\n- Second, collect the parameters of the workload\
    \ to be modeled while it is executed.\n- Third, statistically analyze the measured\
    \ data with some statistical distribution (e.g., logarithmic distribution, trunked-normal\
    \ distribution, Pareto distributions, exponential distribution, power-law distribution,\
    \ log-uniform distribution) and stochastic model (e.g., Markov models), including\
    \ the sampling procedure and static/dynamic analysis.\n\nAn example using Markov\
    \ chain can be stated in the following steps.\n\n1. Assuming the workload is approximately\
    \ periodic with *s* states, model the IO trace of each data storage unit in one\
    \ cycle as a specific Markov chain. Otherwise, all the corresponding Markov chain\
    \ parameters should be time-varying.\n\n2. Given a historic workload trace *L*,\
    \ represented as a *D × T* matrix:\n\n```\nX = [[x_{1,1}, x_{1,2}, ..., x_{1,T}],\n\
    \     [x_{2,1}, x_{2,2}, ..., x_{2,T}],\n     [..., ..., ..., ...],\n     [x_{D,1},\
    \ x_{D,2}, ..., x_{D,T}]]\n```\n\nwhere *D* is the total number of data storage\
    \ units and *T* is the total number of time intervals. `x[d,t]` is the IO intensity\
    \ for any chosen data unit `d` at time `t`. `x[d,t] ∈ {1, 2, 3, ..., s}`.\n\n\
    3. Each Markov chain can be represented by its `s` by `s` state transition probability\
    \ matrix:\n\n```\nP = [[p_{1,1}, p_{1,2}, ..., p_{1,T}],\n     [p_{2,1}, p_{2,2},\
    \ ..., p_{2,T}],\n     [..., ..., ..., ...],\n     [p_{s,1}, p_{s,2}, ..., p_{s,s}]]\n\
    ```\n\nwhere `p[i,j]` is the probability of the data unit IO intensity state change\
    \ to `j` at next time interval under the condition that its current IO intensity\
    \ state is `i`, and `i, j ∈ {1, 2, 3, ..., s}`.\n\n4. To simplify data allocation\
    \ in the tiered storage system, you also need to classify the thousands of data\
    \ units into a dozen of data clusters according to their dynamic IO intensities,\
    \ such as a K-means algorithm using the state transition probability matrices\
    \ as well as the residual time for each state `s` of every data units. By combining\
    \ the initial state of the cluster `S`, you can obtain the predicted IO intensity\
    \ of all the clusters in a whole period, represented as the following `N × T`\
    \ matrix:\n\n```\nS = [[s_{1,1}, s_{1,2}, ..., s_{1,T}],\n     [s_{2,1}, s_{2,2},\
    \ ..., s_{2,T}],\n     [..., ..., ..., ...],\n     [s_{N,1}, s_{N,2}, ..., s_{N,T}]]\n\
    ```\n\nwhere `s[l,t]` is the IO intensity of the `l`-th data cluster at the `t`-th\
    \ time interval.\n\nRefer to [7, 8] to see the difference between simulation and\
    \ modeling approaches. For more complex cases, you may use the so-called multiple-level\
    \ process models. And, in these cases, the correlation must be considered."
  raw: '## Modeling Issues


    There are two regular approaches to evaluating a system design. One employs the
    traced workload directly to drive a simulation. The other builds a model from
    the trace and uses the model for either analysis or simulation. Although the numerical
    trace-based approach is straightforward, the workload models may have some advantages
    over traces, such as adjustment with controlled modification, repetitions, stationarity,
    generalization, avoiding noise, increased understanding, added features, efficiency,
    etc. Therefore, it is important to understand the metrics via mathematical models.
    In the previous section, I pointed out that the hypothesis tests are based on
    some assumptions of statistical models. Tables [2-8](#468166_1_En_2_Chapter.xhtml#Tab8)
    and [2-9](#468166_1_En_2_Chapter.xhtml#Tab9) list few common sense details on
    the modeling issues of some basic and advanced metrics. For more details, refer
    to [35].


    Table 2-9


    Mathematical Models for Advanced Metrics


    | Metrics | Modeling issues |

    | --- | --- |

    | **Locality** | Commonly used distributions: Zipf distribution (Independent Reference
    Model).Other models: LRU stack model, Markovian models, fractal model |

    | **Spatial locality** | The simplest way is by counting unique substrings of
    the reference stream. Formally measured by the size of the working set. |

    | **Temporal locality** | The simplest measure is to look at the reference stream
    through a pinhole or using a simulation of an LRU stack. |

    | **Read/write dependency** | Models: State machine, Markov chain, clustering
    |

    | **Priority-related metrics** | They are completely determined by the OS/FS rules.
    A model can be built based on Markov chain with |

    | **Burstiness and self-similarity** | Auto-covariance and covariance matrices
    are often used to describe self-similarity. |


    Table 2-8


    Mathematical Models for Basic Metrics


    | Metrics | Modeling issues |

    | --- | --- |

    | **Throughput** | Commonly used distributions: Pareto distribution |

    | **Queuing time** | Commonly used distributions: exponential distribution, Erlang
    distribution |

    | **Service time** | Commonly used distributions: exponential distribution, Erlang
    distribution |

    | **Response time** | Commonly used distributions: exponential distribution, Erlang
    distribution |

    | **Disk seek time** | May be modeled by data fitting using a piecewise function
    |

    | **Read to write ratio** | No obvious distribution, depends on read/write dependency
    |

    | **Request size distribution** | Commonly used distributions: logarithmic distribution,
    trunked-normal distribution, Pareto distributions, exponential distribution, power-law
    distribution, log-uniform |

    | **LBA range/randomness** | See spatial locality |

    | **Inter-arrival time** | Commonly used distributions: Poisson distribution,
    exponential distribution, lognormal distribution |


    A general procedure to generate an analytical model is as follows:


    *   First, decide the formulation: the characterization level and the workload
    basic component.


    *   Second, collect the parameters of the workload to be modeled while it is executed.


    *   Third, statistically analyze the measured data with some statistical distribution
    (e.g., logarithmic distribution, trunked-normal distribution, Pareto distributions,
    exponential distribution, power-law distribution, log-uniform distribution) and
    stochastic model (e.g., Markov models), including the sampling procedure and static/dynamic
    analysis.


    An example using Markov chain can be stated in the following steps.


    1.  Assuming the workload is approximately periodic with *s* states, model the
    IO trace of each data storage unit in one cycle as a specific Markov chain. Otherwise,
    all the corresponding Markov chain parameters should be time-varying.


    2.  Given a historic workload trace *L*, represented as a *D × T* matrix:![$$
    X=\left[\begin{array}{cccc}{x}_{1,1}&amp; {x}_{1,2}&amp; \dots &amp; {x}_{1,T}\\
    {}{x}_{2,1}&amp; {x}_{2,2}&amp; \dots &amp; {x}_{2,T}\\ {}\cdots &amp; \cdots
    &amp; \cdots &amp; \cdots \\ {}{x}_{D,1}&amp; {x}_{D,2}&amp; \cdots &amp; {x}_{D,T}\end{array}\right]
    $$](images/468166_1_En_2_Chapter/468166_1_En_2_Chapter_TeX_IEq5.png)


    where *D* is the total number of data storage units and *T* is the total number
    of time intervals. *x*[*d,t*] is the IO intensity for any chosen data unit d at
    time t. *x*[*d,t*] ∈ *{*1*,* 2*,* 3*, ..., s}*.


    1.  Each Markov chain can be represented by its s by s state transition probability
    matrix: ![$$ P=\left[\begin{array}{cccc}{p}_{1,1}&amp; {p}_{1,2}&amp; \dots &amp;
    {p}_{1,T}\\ {}{p}_{2,1}&amp; {p}_{2,2}&amp; \dots &amp; {p}_{2,T}\\ {}\cdots &amp;
    \cdots &amp; \cdots &amp; \cdots \\ {}{p}_{s,1}&amp; {p}_{s,2}&amp; \cdots &amp;
    {p}_{s,s}\end{array}\right] $$](images/468166_1_En_2_Chapter/468166_1_En_2_Chapter_TeX_IEq6.png)


    where *p*[*i,j*] is the probability of the data unit IO intensity state change
    to *j* at next time interval under the condition that its current IO intensity
    state is *i*, and *i*, *j* ∈ *{*1*,* 2*,* 3*, ..., s}*


    1.  To simplify data allocation in the tiered storage system, you also need to
    classify the thousands of data units into a dozen of data clusters according to
    their dynamic IO intensities, such as a K-means algorithm using the state transition
    probability matrices as well as the residual time for each state *s* of every
    data units. By combining the initial state of the cluster S, you can obtain the
    predicted IO intensity of all the clusters in a whole period, represented as the
    following *N × T* matrix: ![$$ S=\left[\begin{array}{cccc}{s}_{1,1}&amp; {s}_{1,2}&amp;
    \dots &amp; {s}_{1,T}\\ {}{s}_{2,1}&amp; {s}_{2,2}&amp; \dots &amp; {s}_{2,T}\\
    {}\cdots &amp; \cdots &amp; \cdots &amp; \cdots \\ {}{s}_{N,1}&amp; {s}_{N,2}&amp;
    \cdots &amp; {s}_{N,T}\end{array}\right] $$](images/468166_1_En_2_Chapter/468166_1_En_2_Chapter_TeX_IEq7.png),
    where *s*[*l,t*] is the IO intensity of the *l*^(*th*) data cluster at the *t*^(*th*)
    time interval.


    Refer to [7, 8] to see the difference between simulation and modeling approaches.
    For more complex cases, you may use the so-called multiple-level process models.
    And, in these cases, the correlation must be considered.'
  trans: "\n# 建模问题\n\n评估系统设计通常有两种常规方法。一种是直接使用追踪到的工作负载来驱动模拟。另一种是根据追踪记录构建模型，并利用该模型进行分析或模拟。尽管基于数值追踪的方法很直接，但工作负载模型相比追踪记录可能具有一些优势，例如可通过受控修改进行调整、可重复性、平稳性、泛化能力、避免噪声、增强理解、增加特性、提高效率等。因此，通过数学模型来理解这些指标至关重要。在上一节中，我指出假设检验是基于统计模型的一些假设。表\
    \ 2-8 和 2-9 列出了一些关于基础指标和高级指标建模问题的常识性细节。更多详情请参考 [35]。\n\n**表 2-9** 高级指标的数学模型\n\n\
    | 指标 | 建模问题 |\n| --- | --- |\n| **局部性** | 常用分布：Zipf 分布（独立引用模型）。其他模型：LRU 栈模型、马尔可夫模型、分形模型\
    \ |\n| **空间局部性** | 最简单的方法是通过统计引用流中的唯一子串数量。正式度量方式为工作集的大小。 |\n| **时间局部性** | 最简单的度量是通过一个“针孔”观察引用流，或使用\
    \ LRU 栈的模拟。 |\n| **读/写依赖性** | 模型：状态机、马尔可夫链、聚类 |\n| **优先级相关指标** | 完全由操作系统/文件系统规则决定。可基于马尔可夫链构建模型，并考虑\
    \ |\n| **突发性与自相似性** | 自协方差和协方差矩阵常用于描述自相似性。 |\n\n**表 2-8** 基础指标的数学模型\n\n| 指标 |\
    \ 建模问题 |\n| --- | --- |\n| **吞吐量** | 常用分布：帕累托分布 |\n| **排队时间** | 常用分布：指数分布、爱尔朗分布\
    \ |\n| **服务时间** | 常用分布：指数分布、爱尔朗分布 |\n| **响应时间** | 常用分布：指数分布、爱尔朗分布 |\n| **磁盘寻道时间**\
    \ | 可通过分段函数进行数据拟合来建模 |\n| **读写比** | 无明显分布，取决于读/写依赖性 |\n| **请求大小分布** | 常用分布：对数分布、截断正态分布、帕累托分布、指数分布、幂律分布、对数均匀分布\
    \ |\n| **LBA 范围/随机性** | 参见空间局部性 |\n| **到达间隔时间** | 常用分布：泊松分布、指数分布、对数正态分布 |\n\n\
    生成分析模型的一般步骤如下：\n\n-   首先，确定公式：表征级别和工作负载基本组件。\n-   其次，在工作负载执行期间收集待建模的参数。\n-   第三，使用某种统计分布（例如，对数分布、截断正态分布、帕累托分布、指数分布、幂律分布、对数均匀分布）和随机模型（例如，马尔可夫模型）对测量数据进行统计分析，包括采样过程和静态/动态分析。\n\
    \n一个使用马尔可夫链的示例如下所述步骤。\n\n1.  假设工作负载近似周期性地具有 *s* 个状态，将一个周期内每个数据存储单元的 IO 追踪建模为特定的马尔可夫链。否则，所有相应的马尔可夫链参数都应是时变的。\n\
    \n2.  给定一个历史工作负载追踪 *L*，表示为 *D × T* 矩阵：\n\n```\nX = [[x_{1,1}, x_{1,2}, ..., x_{1,T}],\n\
    \     [x_{2,1}, x_{2,2}, ..., x_{2,T}],\n     [..., ..., ..., ...],\n     [x_{D,1},\
    \ x_{D,2}, ..., x_{D,T}]]\n```\n\n其中 *D* 是数据存储单元的总数，*T* 是时间间隔的总数。`x[d,t]` 是任意选定数据单元\
    \ `d` 在时间 `t` 的 IO 强度。`x[d,t] ∈ {1, 2, 3, ..., s}`。\n\n3.  每个马尔可夫链可以用其 `s` 乘 `s`\
    \ 的状态转移概率矩阵表示：\n\n```\nP = [[p_{1,1}, p_{1,2}, ..., p_{1,T}],\n     [p_{2,1},\
    \ p_{2,2}, ..., p_{2,T}],\n     [..., ..., ..., ...],\n     [p_{s,1}, p_{s,2},\
    \ ..., p_{s,s}]]\n```\n\n其中 `p[i,j]` 是在当前 IO 强度状态为 `i` 的条件下，数据单元 IO 强度状态在下一个时间间隔变为\
    \ `j` 的概率，且 `i, j ∈ {1, 2, 3, ..., s}`。\n\n4.  为了简化分层存储系统中的数据分配，您还需要根据数千个数据单元的动态\
    \ IO 强度将其分类为十几个数据簇，例如使用 K-means 算法，该算法利用状态转移概率矩阵以及每个数据单元在每个状态 `s` 的驻留时间。通过结合簇的初始状态\
    \ `S`，您可以获得整个周期内所有簇的预测 IO 强度，表示为以下 `N × T` 矩阵：\n\n```\nS = [[s_{1,1}, s_{1,2},\
    \ ..., s_{1,T}],\n     [s_{2,1}, s_{2,2}, ..., s_{2,T}],\n     [..., ..., ...,\
    \ ...],\n     [s_{N,1}, s_{N,2}, ..., s_{N,T}]]\n```\n\n其中 `s[l,t]` 是第 `l` 个数据簇在第\
    \ `t` 个时间间隔的 IO 强度。\n\n请参考 [7, 8] 了解模拟方法与建模方法之间的区别。对于更复杂的情况，您可以使用所谓的多级过程模型。并且，在这些情况下，必须考虑相关性。\n"
- fmt: '# Typical Applications


    In this section, you will take a look at several trace metrics of some typical
    applications in order to get a quick view. Table [2-10](#468166_1_En_2_Chapter.xhtml#Tab10)
    lists some typical applications, where only block size, read/write percentage,
    and random/sequential percentage are provided with some rough values. The dominant
    factors, `IOPS` or `MBPS` (throughput), actually show that whether the workload
    is random request dominant or sequential request dominant.


    **Table 2-10** Typical Application IO Workload Profiles


    | Application | Size (Byte) | R/W | Rand./seq. | Dominant |

    | --- | --- | --- | --- | --- |

    | Web file server | 4KB, 8KB, 64KB | 95%/5% | 75%/25% | IOPS |

    | Database online transaction processing (OLTP) | 8KB | 70%/30% | 100%/0% | IOPS
    |

    | Exchange email | 4KB | 67%/33% | 100%/0% | IOPS |

    | OS drive | 8KB | 70%/30% | 100%/0% | IOPS |

    | Decision support systems (DSS) | 1MB | 100%/0% | 100%/0% | IOPS |

    | File server | 8KB | 90%/10% | 75%/25% | IOPS |

    | Video on demand | 512KB | 100%/0% | 100%/0% | IOPS |

    | Web server logging | 8KB | 0%/100% | 0%/100% | MBPS |

    | SQL server logging | 64KB | 0%/100% | 0%/100% | MBPS |

    | OS paging | 64KB | 90%/10% | 0%/100% | MBPS |

    | Media streaming | 64KB | 98%/2% | 0%/100% | MBPS |


    IO workload characteristics are generally application-dependent nature. Many access
    patterns, such as read/write proportions and handling of writes differ by particular
    applications. Nevertheless, the majority of characteristics vary only by environments
    (operating conditions). Environment-dependent characteristics include the length
    of idle intervals, request arrival rate, workload randomness and sequentially,
    read and write performance, disk service time and response time of request, request
    size, etc. More importantly, there are characteristics of the overall IO workload
    that do remain consistent through applications and environments. A particular
    note here is workload burstiness (i.e. long-range dependence). The block-level
    workloads, in particular, request inter-arrival times and request seek distances,
    are long-range–dependent in general. As a measure of temporal locality in a time
    series, long-range dependence has a variety of consequences specifically with
    regards to predict overall system and particular resource saturation. Consequently,
    burstiness shall be taken into consideration when designing new storage systems,
    and resource management policies at various layers of the IO path. As a result,
    there is no universally good configuration for all workloads due to large difference
    in various applications [42].


    For file system performance, keeping the file system block size close to the workloads
    I/O size can increase the efficiency of the system significantly [43].


    Web traffic volume is increasing rapidly. Some researchers argue that there have
    been no dramatic changes in web server workload characteristics in the last 10
    years [44]. They consist of one-time referencing behaviors, heavy-tailed file
    size distributions, non-Poisson aggregate request streams, high concentration
    of references, Poisson per-document request streams, and the dominance of remote
    requests.


    A database usually has a significant inter-transaction locality, showing that
    real workloads transactions are generally dependent of each other. Another observation
    is that significant use of sequential accesses allows a prefetch policy to be
    applied. Sequentiality is a consequence of long-running queries that examine a
    large number of records, such as a join operation.


    OLTP (online transaction processing) workloads are characterized by a large memory
    footprint, joined with a small critical working set, and by their reduced benefit
    from micro-architectural optimizations. In addition, index searching in OLTP workloads
    require a different cache design.


    Let’s further look into two workloads with more details.^([^(35)](#fn35)) Table
    [2-11](#468166_1_En_2_Chapter.xhtml#Tab11) show the metrics values of the two
    traces. You can see that their properties have large differences. Sometimes, only
    two or three major metrics are used in the simple synthetic trace generators,
    although the applications’ actual trace is much more complex.


    **Table 2-11** Basic Metrics for Two Typical Workloads


    | Trace | Duration(s) | Traffic (G-B) | Total requests (*×*10⁶) | Avg. R/W size
    (KB) | R/W traffic ratio | Random read (*×*10⁶) | Random write (*×*10⁶) |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | OLTP | 43712 | 18.491 | 5.335 | 3.466 | 0.1820 | 0.955 | 2.99 |

    | Search engine | 3151.3 | 16.369 | 1.055 | 15.509 | 8762.9 | 0.994 | 2.08e-4
    |


    ## Traces in File- and Object-Levels


    The other two types of traces generally share many common properties with block-level
    traces. However, they have their unique features in some scenarios. Table [2-12](#468166_1_En_2_Chapter.xhtml#Tab12)
    gives some metrics of file-level traces, which are different from those of block-level
    traces.


    **Table 2-12** Some Metrics for File-Level Traces


    | Metrics | Explanation |

    | --- | --- |

    | **File types** | A file system is utilized in one of several ways: as a long
    term storage for persistent data, as a repository for data too large to fit in
    the main memory, as the site of storage for executables, and for storing logs
    of system usage for accounting and monitoring. The metadata to user data ratio
    is an important index |

    | **File age** | The age is defined as the time from its last reference. |

    | **File access duration** | The time from open to close |

    | **User behavior model** | Users generate the references that constitute the
    workload. |

    | **Process and state model** | Several aspects are included, such as how a process
    makes file service requests during its existence; the conditional activation table
    for access dependency; and the ratio of different operations, such as `open`,
    `close`, `write`, `read`, `seek`, etc. It may be molded as a closed Markov chain.
    |

    | **Reference model** | How the requests are distributed among the files in the
    system |


    As mentioned, the metrics to be considered may be different based on different
    abstract levels. For example, in the system level, we usually consider the attributes
    listed in Table [2-13](#468166_1_En_2_Chapter.xhtml#Tab13), where most of them
    could be in file or object-levels.


    **Table 2-13** Workload in System Level


    | Workload in systems views | Load arrival pattern | Data access pattern | Computation
    pattern |

    | --- | --- | --- | --- |

    | MapReduce | The time arrival of sequence of jobs | HDFS input and output paths,
    the data size for the input, shuffle, and output storage | Input data size, shuffle
    data size, output data size, job duration, map task time, reduce task time |

    | Enterprise network storage | The time arrival sequence of application instances
    or user sessions | Read/write, sequential/random, single/repeated access, file
    sizes, file types | N.A. |


    In this chapter, I presented some trace metrics for performance evaluation and
    design of storage systems. Some typical applications were given to provide a quick
    impression on these metrics. In fact, due to the large difference of some applications,
    there is no one-for-all system design in general. I will discuss more details
    in the later chapters.


    Footnotes [1](#468166_1_En_2_Chapter.xhtml#Fn1_source) [2](#468166_1_En_2_Chapter.xhtml#Fn2_source)
    [3](#468166_1_En_2_Chapter.xhtml#Fn3_source)


    # Trace Collection


    Trace quality is one of the essential requirements for analysis. Low quality traces
    may lead to complex, wrong conclusions for trace analysis. There are two main
    issues in trace quality. One is timing drift, which is when the actual event arrival
    time is earlier than the collected arrival time. The other is a missing event,
    such as when the tool cannot capture all the required events. Thus, proper tools
    shall be applied to guarantee the correctness of the traces. Both software tools
    and hardware devices are introduced in this chapter.'
