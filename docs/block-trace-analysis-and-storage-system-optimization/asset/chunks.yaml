- fmt: "### Write-Dominated Trace\n\nThis trace from a video surveillance application\
    \ shows a large difference from the previous one in many aspects, such as the\
    \ read/write ratio, `LBA` distribution, size distribution, write update ratio,\
    \ etc. Therefore, for different venders under different scenarios, the actual\
    \ workloads may differ from each other significantly, even using the same storage\
    \ structure.\n\nFigure [7-9](#468166_1_En_7_Chapter.xhtml#Fig9) shows the `LBA`\
    \ distribution where only one main region spanning 30GB is applied to both read\
    \ and write close to the starting position of `LBA` (as the trace was collected\
    \ when the `RAID` is nearly empty). If you further consider the figure of `LBA`\
    \ vs. Time, you can see that the write requests are more sequential than the read\
    \ ones. Figure [7-10](#468166_1_En_7_Chapter.xhtml#Fig10) illustrates that write\
    \ and read have similar size distribution, dominated 8-block requests, and close\
    \ shape of 8-128 blocks distribution. Also, the size distribution range is much\
    \ larger than the previous trace.\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig10_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig10_HTML.jpg)\n\
    \nFigure 7-10  \nSize distribution of `RAID` trace 2\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig9_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig9_HTML.jpg)\n\
    \nFigure 7-9  \n`LBA` distribution of `RAID` trace 2\n\nAs it is write dominated,\
    \ let’s focus more on the write update. Figure [7-11](#468166_1_En_7_Chapter.xhtml#Fig11)\
    \ shows the stacked distance for write requests. This confirms the timed write\
    \ update, which is the small overlap size (possibly due to metadata block attached\
    \ to data blocks). From Figure [7-12](#468166_1_En_7_Chapter.xhtml#Fig12), the\
    \ stack distance 250 is roughly 2.1 seconds based on `IOPS`. In this period, it’s\
    \ near 60% full write hit and 60% partial write hit of the overall 52% write command\
    \ hit. This means that some portions kept updating. Therefore, the disk or system\
    \ may require a random access zone or `NVM` for this small portion of updated\
    \ data.\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig12_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig12_HTML.jpg)\n\
    \nFigure 7-12  \nStack update of `RAID` trace 2\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig11_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig11_HTML.jpg)\n\
    \nFigure 7-11  \nWrite stack distance of `RAID` trace 2\n\nIn sum, tens of mixed\
    \ streams lead to a not-very-sequential `IO` pattern, which indicates that a proper\
    \ stream-detection algorithm with long queue is required. Special metadata and\
    \ parity structure lead to a relatively high `LBA` update size and large update\
    \ command ratio, which implies that a large size `DRAM`/`NVM`/`RAZ` cache may\
    \ be necessary to avoid the frequent updates. Also, you can conclude that the\
    \ impact of write cache is very limited in the previous read-dominated trace.\
    \ Note the frequent small idles but less effective idle intervals, which indicates\
    \ that `GC` policy may be adjusted to fit this situation.\n\nThe impact to `SMR`\
    \ drives is summarized in Table [7-5](#468166_1_En_7_Chapter.xhtml#Tab5). Essentially,\
    \ the impact for normal write access is not trivial due to the relatively large\
    \ update ratio. The high updated command ratio may cause relative high defragmentation.\
    \ The metadata management scheme of the surveillance system and/or the `SMR` drives\
    \ may require changes. The drive may not have enough idle time for the background\
    \ `GC` subject to `GC` policy, as the useful effective idle intervals are marginal.\n\
    \nTable 7-5  \nMain Characteristics of Trace 2 wrt `SMR`\n\n| `SMR` characteristics\
    \ | Hadoop observation |\n| --- | --- |\n| Sequential write | Large size write\
    \ requests (>=128 blocks): 35% Mode ratio: 18% (27%) for write when `Q=1` (`Q=128`)\
    \ Sequential cmd ratio (`M>=2`): write 35% at `QL=1` & 60% at `Q=256` |\n| Write-once-read-many\
    \ | `R/W`: cmd 1:1.5; blks 1:6.1 High stacked `ROW` ratio Total write blocks occurs\
    \ 85.9% of total access blocks |\n| Garbage collection (`GC`) | Updated blocks\
    \ (at least write twice) are 13.4% of write blocks, so a relatively high write\
    \ update ratio and write amplification 115.5% (considering the short trace duration)\
    \ Updated command ratio >50% with small overlap possibly due to the metadata attached\
    \ Frequent but small-size idle time in host side difficult for background `GC`\
    \ |\n| In-place or out-of-place update | Relatively high update ratio, so it’s\
    \ necessary to apply large-size `SSD`/`DRAM`/`AZR` cache for performance improvement\
    \ (write update in cache) |\n\nThis trace is much busier than the previous one.\
    \ The total effective idle time (`idle interval > 0.1s`) is 14.40 seconds and\
    \ total idle time 98.6 seconds. The total effective idle frequency (`idle interval\
    \ > 0.1s`) is 33 only while the total idle frequency is 6244. Now the question\
    \ is whether the (effective) idle time is enough for background activities. Due\
    \ to the relatively consistent workload of video surveillance and data/metadata\
    \ structure, the garbage ratio of each `SMR` data zone is similar. Suppose a 1GB\
    \ for zone size and 3MB per track. The total write workload of this trace is about\
    \ 1GB. So is it possible to move 1GB to new place in the effective idle times?\
    \ Here is the analysis:\n\n- Completion of a sequential 1GB read and a sequential\
    \ 887MB write (assume 13.4% garbage ratio) requires around 5.3 seconds for 7200RPM.\n\
    - The average useful idle time for `GC` is `14.4/33 − 0.1 = 0.34` second. Suppose\
    \ the positioning time is 6ms for `R/W`. (`0.34 − 0.006 * 2`) second can handle\
    \ up to 64.4MB data in `GC` zone.^([^(69)](#fn69)) A total of 33 idle intervals\
    \ can handle around 2GB data, which is larger than 1GB.\n- Additionally, the old\
    \ video data is replaced by new data periodically, which will not change the garbage\
    \ ratio much in general.\n\nIdeally, the idle time seems large enough to handle\
    \ `GC` activities, given that\n\n- The effective idle time should be fully used\
    \ and the `GC` size is adjusted dynamically.\n- The idle time algorithm works\
    \ quite well with a lower idle detection threshold, such as from 100ms to 50ms\
    \ to increase the `GC` activities.\n- The other background activities may not\
    \ take much time.\n\nHowever, in reality, you may require much large idle time.\
    \ In particular, defragmentation may significantly increase the write amplification\
    \ ratio.\n\nFootnotes [1](#468166_1_En_7_Chapter.xhtml#Fn1_source)"
  raw: '### Write-Dominated Trace


    This trace from a video surveillance application shows a large difference from
    the previous one in many aspects, such as the read/write ratio, LBA distribution,
    size distribution, write update ratio, etc. Therefore, for different venders under
    different scenarios, the actual workloads may differ from each other significantly,
    even using the same storage structure.


    Figure [7-9](#468166_1_En_7_Chapter.xhtml#Fig9) shows the LBA distribution where
    only one main region spanning 30GB is applied to both read and write close to
    the starting position of LBA (as the trace was collected when the RAID is nearly
    empty). If you further consider the figure of LBA vs. Time, you can see that the
    write requests are more sequential than the read ones. Figure [7-10](#468166_1_En_7_Chapter.xhtml#Fig10)
    illustrates that write and read have similar size distribution, dominated 8-block
    requests, and close shape of 8-128 blocks distribution. Also, the size distribution
    range is much larger than the previous trace.


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig10_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig10_HTML.jpg)


    Figure 7-10


    Size distribution of RAID trace 2


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig9_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig9_HTML.jpg)


    Figure 7-9


    LBA distribution of RAID trace 2


    As it is write dominated, let’s focus more on the write update. Figure [7-11](#468166_1_En_7_Chapter.xhtml#Fig11)
    shows the stacked distance for write requests. This confirms the timed write update,
    which is the small overlap size (possibly due to metadata block attached to data
    blocks). From Figure [7-12](#468166_1_En_7_Chapter.xhtml#Fig12), the stack distance
    250 is roughly 2.1 seconds based on IOPS. In this period, it’s near 60% full write
    hit and 60% partial write hit of the overall 52% write command hit. This means
    that some portions kept updating. Therefore, the disk or system may require a
    random access zone or NVM for this small portion of updated data.


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig12_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig12_HTML.jpg)


    Figure 7-12


    Stack update of RAID trace 2


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig11_HTML.jpg](images/468166_1_En_7_Chapter/468166_1_En_7_Fig11_HTML.jpg)


    Figure 7-11


    Write stack distance of RAID trace 2


    In sum, tens of mixed streams lead to a not-very-sequential IO pattern, which
    indicates that a proper stream-detection algorithm with long queue is required.
    Special metadata and parity structure lead to a relatively high LBA update size
    and large update command ratio, which implies that a large size DRAM/NVM/RAZ cache
    may be necessary to avoid the frequent updates. Also, you can conclude that the
    impact of write cache is very limited in the previous read-dominated trace. Note
    the frequent small idles but less effective idle intervals, which indicates that
    GC policy may be adjusted to fit this situation.


    The impact to SMR drives is summarized in Table [7-5](#468166_1_En_7_Chapter.xhtml#Tab5).
    Essentially, the impact for normal write access is not trivial due to the relatively
    large update ratio. The high updated command ratio may cause relative high defragmentation.
    The metadata management scheme of the surveillance system and/or the SMR drives
    may require changes. The drive may not have enough idle time for the background
    GC subject to GC policy, as the useful effective idle intervals are marginal.


    Table 7-5


    Main Characteristics of Trace 2 wrt SMR


    | SMR characteristics | Hadoop observation |

    | --- | --- |

    | Sequential write | Large size write requests ( >=128 blocks): 35%Mode ratio:
    18% (27%) for write when Q=1(Q=128)Sequential cmd ratio(M>=2): write 35% at QL=1
    & 60% at Q=256 |

    | Write-once-read-many | R/W: cmd 1:1.5; blks 1:6.1High stacked ROW ratioTotal
    write blocks occurs  85.9% of total access blocks |

    | Garbage collection (GC) | Updated blocks (at least write twice) are 13.4% of
    write blocks, so a relatively high write update ratio and write amplification
    115.5% (considering the short trace duration)Updated command ratio >50% with small
    overlap possibly due to the metadata attachedFrequent but small-size idle time
    in host side difficult for background GC |

    | In-place or out-of-place update | Relatively high update ratio, so it’s necessary
    to apply large-size SSD/DRAM/AZR cache for performance improvement (write update
    in cache) |


    This trace is much busier than the previous one. The total effective idle time
    (idle interval*>*0.1s) is 14.40 seconds and total idle time 98.6 seconds. The
    total effective idle frequency (idle interval*>*0.1s) is 33 only while the total
    idle frequency is 6244\. Now the question is whether the (effective) idle time
    is enough for background activities. Due to the relatively consistent workload
    of video surveillance and data/metadata structure, the garbage ratio of each SMR
    data zone is similar. Suppose a 1GB for zone size and 3MB per track. The total
    write workload of this trace is about 1GB. So is it possible to move 1GB to new
    place in the effective idle times? Here is the analysis:


    *   Completion of a sequential 1GB read and a sequential 887MB write (assume13.4%
    garbage ratio) requires around 5.3 seconds for 7200RPM.


    *   The average useful idle time for GC is 14.4/33−0.1=0.34 second. Suppose the
    positioning time is 6ms for R/W. (0.34−0.006*2) second can handle up to 64.4MB
    data in GC zone.^([^(69)](#fn69)) A total of 33 idle intervals can handle around
    2GB data, which is larger than 1GB.


    *   Additionally, the old video data is replaced by new data periodically, which
    will not change the garbage ratio much in general.


    Ideally, the idle time seems large enough to handle GC activities, given that


    *   The effective idle time should be fully used and the GC size is adjusted dynamically.


    *   The idle time algorithm works quite well with a lower idle detection threshold,
    such as from 100ms to 50ms to increase the GC activities.


    *   The other background activities may not take much time.


    However, in reality, you may require much large idle time. In particular, defragmentation
    may significantly increase the write amplification ratio.


    Footnotes [1](#468166_1_En_7_Chapter.xhtml#Fn1_source)'
  trans: "\n### 写密集型负载\n\n该负载来自视频监控应用，在读写比、`LBA`分布、大小分布、写更新比等多个方面与之前的负载存在显著差异。因此，对于不同场景下的不同供应商，即使采用相同的存储结构，实际工作负载也可能大相径庭。\n\
    \n图 7-9 展示了`LBA`分布，其中仅有一个跨越 30GB 的主区域，用于对接近`LBA`起始位置的读写操作（因为该负载是在`RAID`几乎为空时收集的）。如果进一步观察`LBA`与时间的关系图，可以发现写请求比读请求更具顺序性。图\
    \ 7-10 表明，写和读具有相似的大小分布，以 8 块请求为主，且 8-128 块分布的形态接近。此外，大小分布范围远大于之前的负载。\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig10_HTML.jpg](img/468166_1_En_7_Fig10_HTML.jpg)\n\
    \n图 7-10  \n`RAID`负载 2 的大小分布\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig9_HTML.jpg](img/468166_1_En_7_Fig9_HTML.jpg)\n\
    \n图 7-9  \n`RAID`负载 2 的`LBA`分布\n\n由于这是写密集型负载，我们应更关注写更新。图 7-11 展示了写请求的堆栈距离。这证实了定时写更新，即较小的重叠大小（可能由于数据块附带了元数据块）。从图\
    \ 7-12 可以看出，基于`IOPS`，堆栈距离 250 大约相当于 2.1 秒。在此期间，在总体 52%的写命令命中中，接近 60%为全写命中，60%为部分写命中。这意味着某些部分在持续更新。因此，磁盘或系统可能需要一个随机访问区域或`NVM`来处理这一小部分更新数据。\n\
    \n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig12_HTML.jpg](img/468166_1_En_7_Fig12_HTML.jpg)\n\
    \n图 7-12  \n`RAID`负载 2 的堆栈更新\n\n![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig11_HTML.jpg](img/468166_1_En_7_Fig11_HTML.jpg)\n\
    \n图 7-11  \n`RAID`负载 2 的写堆栈距离\n\n总之，数十个混合流导致了一种非完全顺序的`IO`模式，这表明需要一个带有长队列的合适流检测算法。特殊的元数据和奇偶校验结构导致了相对较高的`LBA`更新大小和较大的更新命令比例，这意味着可能需要大容量的`DRAM`/`NVM`/`RAZ`缓存来避免频繁更新。此外，可以得出结论，在之前读密集型的负载中，写缓存的影响非常有限。注意频繁的小空闲但低效的空闲间隔，这表明可能需要调整`GC`策略以适应这种情况。\n\
    \n对`SMR`驱动器的影响总结于表 7-5。本质上，由于相对较高的更新比例，对正常写访问的影响不容忽视。高更新命令比例可能导致相对较高的碎片整理需求。监控系统的元数据管理方案和/或`SMR`驱动器可能需要进行更改。由于有效的空闲间隔微乎其微，驱动器可能没有足够的空闲时间用于受`GC`策略约束的后台`GC`。\n\
    \n表 7-5  \n负载 2 相对于`SMR`的主要特征\n\n| `SMR`特征 | Hadoop 观察结果 |\n| --- | --- |\n| 顺序写入\
    \ | 大尺寸写请求（>=128 块）：35% 模式比例：当`Q=1`（`Q=128`）时，写操作为 18%（27%） 顺序命令比例（`M>=2`）：在`QL=1`时为写\
    \ 35%，在`Q=256`时为 60% |\n| 一次写入多次读取 | `R/W`：命令比 1:1.5；块比 1:6.1 高堆叠`ROW`比例 总写入块占全部访问块的\
    \ 85.9% |\n| 垃圾回收（`GC`） | 更新块（至少写入两次）占写入块的 13.4%，因此写更新比例和写放大率相对较高，为 115.5%（考虑到负载持续时间较短）\
    \ 更新命令比例>50%，重叠较小，可能由于附带的元数据 主机端频繁但小尺寸的空闲时间不利于后台`GC` |\n| 原地更新或异地更新 | 更新比例相对较高，因此有必要应用大容量`SSD`/`DRAM`/`AZR`缓存来提升性能（在缓存中进行写更新）\
    \ |\n\n此负载比之前的负载繁忙得多。总有效空闲时间（`空闲间隔 > 0.1 秒`）为 14.40 秒，总空闲时间为 98.6 秒。总有效空闲频率（`空闲间隔\
    \ > 0.1 秒`）仅为 33 次，而总空闲频率为 6244 次。现在的问题是，（有效）空闲时间是否足以进行后台活动。由于视频监控工作负载以及数据/元数据结构的相对一致性，每个`SMR`数据区域的垃圾比例相似。假设区域大小为\
    \ 1GB，每磁道 3MB。此负载的总写入工作负载约为 1GB。那么，是否有可能在有效空闲时间内将 1GB 数据迁移到新位置？分析如下：\n\n- 完成顺序读取\
    \ 1GB 和顺序写入 887MB（假设垃圾比例为 13.4%）对于 7200RPM 的磁盘大约需要 5.3 秒。\n- `GC`的平均有效空闲时间为`14.4/33\
    \ − 0.1 = 0.34`秒。假设`R/W`的定位时间为 6ms。`（0.34 − 0.006 * 2）`秒可以在`GC`区域内处理多达 64.4MB\
    \ 的数据。^(⁶⁹) 总共 33 个空闲间隔可以处理约 2GB 数据，大于 1GB。\n- 此外，旧视频数据会定期被新数据替换，这通常不会显著改变垃圾比例。\n\
    \n理想情况下，空闲时间似乎足以处理`GC`活动，前提是：\n\n- 有效空闲时间应被充分利用，并且`GC`大小动态调整。\n- 空闲时间算法在较低的空闲检测阈值下运行良好，例如从\
    \ 100ms 降至 50ms，以增加`GC`活动。\n- 其他后台活动不会占用太多时间。\n\n然而，在现实中，可能需要大得多的空闲时间。特别是，碎片整理可能会显著增加写放大比例。\n\
    \n脚注 1\n"
- fmt: '# 8. Case Study: Hadoop


    Hadoop is one of the most popular distributed big data platforms in the world.
    Besides computing power, its storage subsystem capability is also a key factor
    in its overall performance. In particular, there are many intermediate file exchanges
    for MapReduce. This chapter presents the block-level workload characteristics
    of a Hadoop cluster by considering some specific metrics. The analysis techniques
    presented can help you understand the performance and drive characteristics of
    Hadoop in production environments. In addition, this chapter also identifies whether
    SMR drives are suitable for the Hadoop workload.


    Users of large systems must deal with explosive data generation, often from a
    multitude of different sources and formats. The observation and extraction of
    potential value contained in this large, generally unstructured data lead to great
    challenges, but also opportunities in data storage, management, and processing.
    From a data storage perspective, huge capacity (byte) growth is expected, with
    HDDs supplying most capacity workloads for the foreseeable future, although SSDs
    and NVMs are also widely used in time-sensitive scenarios (performance workload).
    The interaction of HDDs with these capacity workloads must be well understood
    so that these devices algorithms.


    From data management and processing, big data arises as a trendy technology, while
    Hadoop emerges as a leading solution. Originating from Google’s GFS and MapReduce
    framework, the open-source Hadoop has gained much popularity due to its availability,
    scalability, and good economy of scale. Hadoop’s performance has been illustrated
    for batch MapReduce tasks in many cases [66, 67], though more exploration is ongoing
    for other applications within Hadoop’s umbrella of frameworks.


    To best understand Hadoop’s performance, a common approach is workload analysis
    [66, 67, 68, 69, 70]. The workload can be collected and viewed in different abstract
    levels. The references [37, 35] suggest three classifications: functional, system,
    and physical (see Figure [2-1](#468166_1_En_2_Chapter.xhtml#Fig1) in Chapter [2](#468166_1_En_2_Chapter.xhtml)).
    However, most workload analysis works in this area are studied with a system view.


    Kavulya et al. [71] analyzed 10 months of MapReduce logs from the Yahoo! M45 cluster,
    applied learning techniques to predict job completion times from historical data,
    and identified potential performance problems in their dataset. Abda et al. [72]
    analyzed six-month traces from two large Hadoop clusters at Yahoo! and characterized
    the file popularity, temporal locality, and arrival patterns of the workloads,
    while Ren et al. [66] provided MapReduce workload analysis of 2000+ nodes in Taobao’s
    e-commerce production environment. Wang et al. [67] evaluated Hadoop job schedulers
    and quantified the impact of shared storage on Hadoop system performance, and
    therefore synthesize realistic cloud workloads. Shafer et al. [70] investigated
    the root causes of performance bottlenecks in order to evaluate trade-offs between
    portability and performance in Hadoop via different workloads. Ren et al. [73]
    analyzed three different Hadoop clusters to explore new issues in application
    patterns and user behavior and to understand key performance challenges related
    to IO and load balance. And many other notable examples exist as well [69, 68,
    37].


    While predominately system-focused, some works provide a functional view [69,
    70, 73] where average traffic volume from historical web logs are discussed. Some
    simulators and synthetic workload generators are also suggested, such as Ankus
    [66], MRPerf [74], and its enhancement [67].


    However, to my best knowledge, there is no direct analysis work for a Hadoop system
    at the block level. A block-level analysis is timely and more valuable now that
    device manufacturers are pressured to develop/improve products to meet capacity
    or performance demands, such as emerging hybrid or shingled magnetic recording
    (SMR) drives [5, 40, 4]. When considering the SMR drives (and the coming energy/heat
    assistant magnetic recording (EAMR/HAMR) drives) which have much higher data density
    than conventional drives, such an analysis is indispensable, due to their distinguished
    features from the conventional drives. For example, SMR drives introduce characteristics
    such as shingled tracks, which make the device more amenable to sequential writes
    over random, as well as indirect block address mapping, garbage collection, and
    more, which all modify how these devices interact with user workloads. A big question
    at the device level is if the block-level Hadoop workload is suitable in SMR drives.


    In this chapter, I analyze Hadoop workloads at a block device level and answer
    this big question. Aided by `blktrace`, I provide a clear view of Hadoop’s behavior
    in storage devices [75, 76]. The main contribution lies in the following aspects:


    - Defining some new block-level workload metrics, such as stacked write update,
    stacked ROW, and queued seek distance to fulfill particular requirement of disk
    features

    - Identifying some characteristics of a big organization’s internal Hadoop cluster,
    and relating them to findings of other published Hadoop clusters with similarity
    and difference

    - Providing some suggestions on Hadoop performance bolstered from drive-level
    support

    - Providing analysis for the applicability of SMR drives in Hadoop workloads


    This chapter will first cover the overall background of SMR drives and the Hadoop
    cluster and trace collection procedure. Then it will cover the analysis results
    based on these metrics.'
