    \ | 20.48 | 49.35 |\n| 5 | 60.77 | 63.68 | 59.18 | 25.42 | 62.69 | 90.43 |\n|\
    \ 6 | 173.36 | 115.82 | 255.16 | 13.43 | 131.29 | 122.52 |\n| 7 | 43.01 | 61.43\
    \ | 60.39 | 70.63 | 21.89 | 38.54 |\n| 8 | 36.23 | 37.58 | 41.31 | 37.47 | 20.04\
    \ | 33.11 |\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig9_HTML.jpg](img/468166_1_En_5_Fig9_HTML.jpg)\n\
    \n**图 5-9** PCMark：大小分布\n\n**表 5-9** PCMark：思考/完成时间（毫秒）和 IOPS\n\n| 应用 | IOPS |\
    \ 思考时间平均值 | 标准差 | 完成时间平均值（块） | 标准差 |\n| --- | --- | --- | --- | --- | --- |\n\
    | 1 | 120.57 | 8.29 | 46.04 | 3.43 | 5.49 |\n| 2 | 189.29 | 5.28 | 9.20 | 10.24\
    \ | 47.4 |\n| 3 | 48.70 | 20.54 | 21.25 | 1.99 | 3.44 |\n| 4 | 311.30 | 3.21 |\
    \ 8.25 | 3.59 | 5.84 |\n| 5 | 122.47 | 8.17 | 16.68 | 0.76 | 2.64 |\n| 6 | 59.56\
    \ | 16.79 | 22.58 | 1.2 | 3.22 |\n| 7 | 145.65 | 6.87 | 14.87 | 2.78 | 5.86 |\n\
    | 8 | 204.29 | 4.90 | 16.37 | 16.41 | 29.87 |\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig8_HTML.jpg](img/468166_1_En_5_Fig8_HTML.jpg)\n\
    \n**图 5-8** PCMark：完成时间\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig7_HTML.jpg](img/468166_1_En_5_Fig7_HTML.jpg)\n\
    \n**图 5-7** PCMark：思考时间分布\n\n基于顺序流，通常可以观察到一些明显的序列。导入图片的序列最多，而应用加载的序列较少。除了应用加载（混合流）之外，队列深度为\
    \ 10 足以检测到大多数流。应用加载具有相对更多的混合顺序流。另请注意，对于只读情况，大多数流只有两个命令。在应用 2、3 和 4 中，平均流长度比其他应用更长，这为无限读取模式提供了更多机会。\n\
    \n## 得失分析\n\n采用预取策略时，收益来自于缓存策略（例如，空洞填充、预取）带来的命中率提升，而损失则来自于缓存策略导致的额外磁盘访问（例如，附加在用户命令前后的预读/后读；以及自引发的非附加命令）。\n\
    \n有两种方法可用于分析得失。一种简单的方法仅考虑频率，因此它统计命中频率和额外磁盘访问频率的次数。自引发命令的成本通常小于非附加命令。如果命中率的提升是由于自引发命令引起的，则收益较大；否则收益较小。这种方法可以提供粗略的估计。另一种方法是所谓的混合仿真与建模方法；它使用仿真来获取命中率和额外命令频率，同时使用分析模型来获取平均响应时间，这种方法相对复杂且是定量的。我们只考虑第一种方法。\n\
    \n让我们定量地定义得失：\n\n*   **收益：** 获得的额外缓存命中（`a[2]`）= 空洞长度为 x 时的缓存命中率（`a[3]`）- 无空洞填充时的缓存命中率（`a[0]`）\n\
    *   **损失：** 额外自引发命令的发生次数 / 总读取命令数（`a[1]`）\n*   **得失比** `a` **=** `a[2]` **/**\
    \ `a[1]` **：** 该值越高，越有利于评估 `a`，但有几个基本考虑因素：\n    *   **缓存中的队列深度**（`Q[d]`）：这对 LRU\
    \ 算法有显著影响。通过观察最大的 `a` 与 `Q[d]` 的关系，你将看到最优的 `Q[d]`。不同应用的 `Q[d]` 可能不同。\n    *  \
    \ **命令之间的时间间隔**（`d[T]`）：只有当间隔大于某个值时，系统才有机会处理自引发命令，例如找出不同 `d[T]` 下的比值 `a`。\n  \
    \  *   **每个空洞的命中频率：** 当使用关联方法选择要填充的空洞时，命中频率必须大于 1。如果命中频率通常大于 1，则此方法有意义；否则，它毫无意义。\n\
    \n让我们开始验证自引发的空洞填充策略是否有利。请执行以下步骤：\n\n1.  检查所有读取命令（写入命令也会填充缓存）的 `a[1]`、`a[2]` 和\
    \ `a`。\n2.  如果 `a[1]` 远大于 `a[2]`（例如，`a < 0.2`），则空洞填充不经济；然后检查 `a[2]` 是否太小而不值得。否则，空洞填充是有用的；并根据工作负载检查选择性的自引发命令。\n\
    3.  如果两个命令之间的时间间隔足够大（例如，`> 15ms`），则自引发命令可能不会消耗额外资源。如果是这样，任何增加的缓存命中率都是有益的。重复步骤\
    \ 1-2。\n\n表 5-11 提供了结果，其中 `Q[d]` = 队列深度，`f[s]` = 填充空洞大小。可以看出，应用 2 的空洞填充效果最显著，而应用\
    \ 6 的效果最不显著。空洞填充通常适用于应用 2、3、5 和 8。如果只考虑思考时间大于 `10ms` 的命令，则会得到表 5-12 中列出的结果。可以看出，总体趋势与无时间间隔约束的情况相似。对于\
    \ `f[s] = 128`，应用 5 的空洞填充效果最显著；对于 `f[s] = 256`，应用 3 的效果最显著；而应用 6 的效果较不显著。总之，对于短队列深度，`a`\
    \ 通常小于 1。当空洞大小非常小时，`a` 非常小（`<< 1`）。当队列长度和空洞大小都较小时，空洞填充策略通常无用。基于 `a` 的值，可以说该策略对于应用\
    \ 6 通常无用，而对于应用 2、5 和 8 可能有用。在与预取策略进行比较后，应得出进一步的结论。\n\n**表 5-12** 空洞填充的得失分析（受限）\n"
