    # 2. Trace Characteristics


    Trace is usually classified as three levels: block level, file level, and object
    level. They share many common metrics, although each has its own unique properties.
    In this chapter, I will discuss block-level trace metrics in detail since the
    block-level trace provides more fundamental information on storage systems than
    other two levels. For simplicity of representation, I divide the metrics into
    two categories: the basic ones and the advanced ones. The meanings and performance
    impacts of these metrics are explained in detail.


    ## Workload Properties


    Workload can be collected and viewed in different abstract levels. Usually, there
    are three different levels, as show in Figure [2-1](#468166_1_En_2_Chapter.xhtml#Fig1)
    [37]. The functional view indicates the users’ behaviors, which aim to facilitate
    comparison between, say, a relational database system and a MapReduce system that
    serves the equivalent functional aims of some enterprise data warehouse management
    workload. It enables a large range of equivalent systems to be compared. It lacks
    tracing capabilities for large-scale, data-centric systems. The system view captures
    workload behavior at the highest level of abstraction that we can trace in large-scale
    data-centric systems currently. For example, this translates to the jobs steam
    and job characteristics in MapReduce. For enterprise network storage, this is
    the data accesses stream at the application, session, file, and directory levels.
    The physical view describes a workload in terms of hardware component behaviors,
    such as the CPU, memory, disk, and network activities during workload execution.
    It depends on hardware, software, or even configuration changes.


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig1_HTML.png](images/468166_1_En_2_Chapter/468166_1_En_2_Fig1_HTML.png)


    Figure 2-1


    Typical workload abstraction level


    The basic workload metrics are generally explicit and easily observed directly
    or calculated with very simple formulations. Some examples are listed in Table
    [2-1](#468166_1_En_2_Chapter.xhtml#Tab1). However, the advanced ones are implicit
    and formulated in relatively complex forms/rules. See Table [2-2](#468166_1_En_2_Chapter.xhtml#Tab2)
    for few advanced metrics. More details will be described in the next two sections
    of this chapter.


