    ### 系统优化


    轨迹分析的主要目的之一，是在不同层面（例如，组件与系统、用户态与内核态与硬件等）识别系统性能瓶颈，进而优化整个系统 [36]。


    以一个简单的 IO 栈为例（图 1-13）。^(³²) 软件应用生成的访问模式必须遍历 IO 栈，才能从用户空间到达存储设备并返回。这一过程表明，IO 在
    IO 栈中上下传递时，会受到文件系统和各种驱动程序的影响，例如将小的 IO 数据传输合并为更少但更大的 IO 数据传输，将大的顺序 IO 数据传输拆分为多个并发的随机
    IO 数据传输，以及在使用更快的文件系统缓存的同时，将 IO 提交延迟到 SSD。


