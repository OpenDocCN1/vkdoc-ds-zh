    saving, they may not be worthwhile. However, for NVM, these techniques can reduce
    the cost and improve the storage efficiency.


    *   **Timing**: HDD usually caps at 300 IOPS, while some NVM devices may be 100
    to 10000 times faster. The cache scheduler therefore has large difference.


    There are many testing and benchmarking tools with different measurement conditions.
    People may be confused by the results from these different tools. SNIA developed
    standard testing tools called SSSI Reference Test Platform (RTP) and the Performance
    Test Specification (PTS).^([^(54)](#fn54))


    ## Interactions with Algorithms


    The algorithms and policies utilized in the hybrid storage systems actually determine
    the performance of the overall storage system when the hardware is fixed. In this
    section, the most important algorithms, such as data allocation, hot data identification,
    data migration, and scheduling algorithm, are surveyed. For easy of representation,
    I list some main factors considered in these algorithms in Tables [4-1](#468166_1_En_4_Chapter.xhtml#Tab1)
    and [4-2](#468166_1_En_4_Chapter.xhtml#Tab2), where access frequency and interval
    are the most important two factors in hot data identification and data migration
    algorithms.


    Table 4-2


    Other Performance Factors


    | Items | Description |

    | --- | --- |

    | Data size | Generally, only hot data with small size is required to move to
    a higher tier. The small degree depends on the read/write speed rate of SSD and
    HDD, and the migration speed between them, etc. |

    | Cache total/remaining sizeDevice total/remaining bandwidth | The cache size
    decides how much hot data can be stored in the cache. Hence it decides the threshold
    of hot degree.The bandwidth decides if the migration is proper at current time.
    An approximated function may be built to predict the remaining bandwidth with
    respect to R/W ratio, IO intensity, etc. |

    | R/W ratio | Since the R/W access time and pattern are different, this ratio
    gives different performance (e.g., the write amplification). |

    | R/W granularity and IO intensity | The value represents the data amount ratio
    relating to an R/W IO to a fixed size data block. Average R/W granularity is the
    average ratio of all the IOs in a predefined time interval. Commonly, the larger
    the value, the more important the data is to users. |

    | Data correlation | One data may be related to another, so the IO operations
    in a data block have some characteristics in a predefined period of time, and
    another may have similar properties, hence they are associated. This value can
    be used for IO predication. |

    | IO range/amount/distribution | IO distribution represents the statistical accessing
    information, such as the accessing address range and the accessing frequency in
    a given accessing period. |

    | Grain size | The minimum size for each page/block to be replaced/migrated |

    | Tier contrast/compensation (device value) | It values the difference between
    two different storage tiers/caches for direct data migration, including device
    status, accessing speed, etc. |

    | Others | Data loss/error, etc. |


    Table 4-1


    Two Most Important Factors


    | Items | Description | Typical Algorithms |

    | --- | --- | --- |

    | Access frequency (R/W) (F),Access interval (T) | The access time within a given
    time period. Due to the different performance in R/W, we may also consider them
    separately.Some argue that the least recently used data may have higher probability
    to be re-accessed in the near future; some deny it; now an acceptable tradeoff
    is that it depends on IO pattern/workload. | LFU (least frequently used)[48],
    GDSF (Greedy-Dual Size Frequency) [49]LRU (least recently used), MRU (most recently
    used), LFUDA (LFU with dynamic aging) [48], LRU-K(least recently used k)[50],
    GDS [51] |


    ## Interactions with Structure


    The fundamental structure of the storage device or system also has a large impact
    on the system performance. For example, RAID- and EC-based systems have the functionality
    of data protection. However, it increases the internal IO burden to the disks
    due to the additional parity data. In particular, during the system recovery from
    a critical disk failure, the internal workload eats large portion of disk bandwidth,
    and therefore the overall system performance to the external users is significantly
    downgraded. Chapter [7](#468166_1_En_7_Chapter.xhtml) will analyze the impact
    of RAID structure to the IO pattern.


    For a hybrid storage system, although it has the potential to improve the performance
    of hot data, the internal data migration may also occupy some additional resources.
    Improper IO scheduler and data migration algorithms will definitely lower the
    overall performance. In addition, the so-called cache structure and tiering structure
    may have large difference in data allocation and IO scheduling, which leads to
    performance diversity under different scenarios. Chapter [6](#468166_1_En_6_Chapter.xhtml)
    will use a small-scale hybrid device as an example. Furthermore, the inter-connection
    structure, such as bus and bridge, could also be the performance bottleneck in
    some cases.'
