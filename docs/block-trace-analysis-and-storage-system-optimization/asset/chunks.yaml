    ## Basic Metrics


    Basic metrics are usually simple and easy for observation. But this does not mean
    they contain less information than advanced metrics. In some cases, basic metrics
    are good enough to interpret the workload properties.


    ### LBA Distribution


    From the curve of LBA distribution vs. time, you can easily observe the randomness/sequence
    of IO access. Figure [2-2](#468166_1_En_2_Chapter.xhtml#Fig2) gives two examples
    of the write-only requests’ LBA distribution. The left plot shows a sequential
    access from LBA 6.7 ∗ 10⁸ to 6.8 ∗ 10⁸. The right plot mixes with sequential and
    random write accesses. Figure [2-3](#468166_1_En_2_Chapter.xhtml#Fig3) shows that
    the IO pattern is combined with random read accesses and mixed write accesses.
    It’s clear that write access is more sequential than read access, as the write
    access contains several sequential streams. Note that there may exist a small
    gap between two continuous requests sometimes, although it may look sequential
    visually from the plot. However, these near sequential IO patterns can be accessed
    sequentially in most cases.


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig3_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    LBA distribution from a Hadoop node


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig2_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    LBA distribution from a Ceph node


    #### Size Distribution


    In general, the drive (whatever HDD or SSD) is in favor of sequential access,
    so the sequential access has much higher throughput than the random access, in
    particular for HDD. And the request size also matters especially when the disk
    queue is short, which will be clearly illustrated in Chapter [4](#468166_1_En_4_Chapter.xhtml)
    in Figures [4-2](#468166_1_En_4_Chapter.xhtml#Fig2) and [4-3](#468166_1_En_4_Chapter.xhtml#Fig3).


    Figure [2-4](#468166_1_En_2_Chapter.xhtml#Fig4) plots the request frequency and
    CDF (cumulative density function) vs. request size. For the distribution of write
    requests, you can see that the percentage of the requests with size 1024 blocks
    are almost 50% in this case, which usually means the IO pattern is dominated by
    large size requests. Note that due to OS/FS and disk drive limitation, the maximum
    request size is usually 1024 blocks, so even if the user requests a 1MB size file,
    it will be divided into two IO requests internally (assume 512 bytes per block).


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig4_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Size distribution from a Hadoop node


    If you further need to know the size distribution with respect to (wrt) LBA range,
    you may have plots like Figure [2-5](#468166_1_En_2_Chapter.xhtml#Fig5), from
    which you can learn more about the hot range with size information. Since you
    know that the transfer speed of different location in a HDD (e.g., ID vs. MD vs.
    OD) is different, the LBA can roughly tell the relative speed with the request
    size information.


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig5_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Combined LBA and size distribution


    ### Read/Write Distribution


    Read and write accesses may have different performance in drives. For HDD, the
    difference may be slight. However, for SSD, the gap could be large for the consumer
    class. In addition, read and write access may have dependencies on each other.
    For example, when a new write is just completed, the data may be still in the
    cache. An immediate read may access the data from the cache directly, instead
    of a media operation. Thus the visualization of distribution time can provide
    an intuitive view on the dependency. You can plot the data in a single figure
    or in two separate figures, as in Figure [2-3](#468166_1_En_2_Chapter.xhtml#Fig3).


