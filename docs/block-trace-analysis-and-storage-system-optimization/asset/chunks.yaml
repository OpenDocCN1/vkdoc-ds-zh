    underlying storage devices are actually block devices, and the techniques applied
    to block-level analysis can be also used for file-level and object-level analysis
    .


    ### Trace Collection and Analysis


    Workload trace can be collected using both software and hardware tools, actively
    or passively. The inherited logging mechanism of some systems, which usually runs
