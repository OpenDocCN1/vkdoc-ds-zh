- fmt: "### IOPS and Throughput\n\nIOPS is usually defined as the IO number ∆*n* per\
    \ unit time ∆*t* seconds, such as `IOPS = Δn / Δt`. The unit time is preset by\
    \ users, at perhaps 1 second. Similarly, throughput is the request size ∆*S* per\
    \ unit time, so `TP = Δs / Δt`. Note that they are in a sense average values within\
    \ a given unit time/time-window. For different ∆*t*, IOPS and throughput may have\
    \ different values. Usually, a larger ∆*t* leads to a smoother curve. Figure [2-6](#468166_1_En_2_Chapter.xhtml#Fig6)\
    \ shows an example with data collected from a HDD node of a Ceph cluster. You\
    \ can see that the IOPS ranges from 60 to 160 in the figure of ∆*t*=1 second,\
    \ while it is 80–120 when ∆*t*=6 seconds. In particular, when the workload contains\
    \ many bursts, the maximum and minimum IOPS values for different ∆*t* may vary\
    \ largely.\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig6_HTML.png](images/468166_1_En_2_Chapter/468166_1_En_2_Fig6_HTML.png)\n\
    \n**Figure 2-6** Average IOPS and throughput with different time window\n\nThe\
    \ curves of the two metrics vs. time can be used to observe the workload burst\
    \ visually. However, choose ∆*t* carefully. A too-large ∆*t* may smooth the curve\
    \ but remove the IO burst. A practical choice is related to the average inter-arrival\
    \ time, so ∆*t* may be a few times the average inter-arrival time, but not too\
    \ much.\n\nAlternatively, you can fix ∆*n*. For example, you may set ∆*n*=20,\
    \ and let ∆*t* be various.\n\nA complex setting is that you may let both ∆*t*\
    \ and ∆*n* various. For example, let ∆*n*≤ 10 and ∆*t* = 1 second as the constraint.\
    \ If within ∆*t* = 1 second, there are ∆*n* within the range, do the average.\
    \ Otherwise, if ∆*n >* 10, choose a time window that ∆*n* = 10, and then do the\
    \ average.\n\nAnother trivial issue when drawing the curve is the time, so the\
    \ average value happens at the beginning, middle, or end of ∆*t*. For example,\
    \ if you choose the end of ∆*t*, you may have the following formulations:\n\n\
    - `IO(t[j])` = the total number of IOs based on the range calculated by `D[i]`,\
    \ so `IO(D[i])`, where `D[i]` is within an interval `[t[j−1] t[j]]`\n- `R(t[j])`\
    \ = the summation of request size of `IO(D[i])`\n- Average IOPS at `t[j]` = `IO(t[j−1])/Δt`\n\
    - Average request size at `t[j]` = `R(t[j−1])/IO(t[j−1])`\n- Average throughput\
    \ at `t[j]` = `R(t[j−1])/Δt`\n\nYou can also apply moving average techniques here;\
    \ there is an overlap between two continuous \"average\" metrics.\n\n### Response\
    \ Time\n\nResponse time is generally combined by the waiting (or queuing) time\
    \ `T[w]` and access (or service) time `T[a]`, i.e., `T[res] = T[a] + T[w]`. The\
    \ service time is the time cost in service, such as disk access time. The queuing\
    \ time is the cost when the request waits in the queue before it is sent for actual\
    \ execution. When the trace is collected from the external bus (IO driver), such\
    \ as SATA/SAS, the response time of `r[i]` is calculated by `C[i] − D[i]`.\n\n\
    ### Queue Length/Depth\n\nThere are at least two queues in HDDs. One is along\
    \ with the IO driver, which is influenced by the OS and FS, so the OS and/or FS\
    \ may change the order of IOs to send to the disk drive based on some schedulers.\
    \ The length is usually up to a trace collected externally only reflects the length\
    \ in the IO driver. You can estimate the queue depth based on either arrival time\
    \ or complete time of requests. They may have slightly differences. Let's denote\
    \ one queue's D and C as `D[i]` and `C[i]` in sequence.\n\n- IO driver queue depth\
    \ just before command arrived (`Q[d1]`)\n    - The queue depth just before `D[i]`\
    \ (instant queue depth `Q(D[i])`) = the number of requests whose C time `>= D[i]`\
    \ and D time `< D[i]`\n- IO driver queue depth just after command completed (`Q[d2]`)\n\
    \    - The queue depth just after `C[i]` (instant queue depth `Q(C[i])`) = the\
    \ number of requests whose C time `>= C[i]` and D time `< C[i]`\n- Average queue\
    \ depth\n    - Estimated average queue depth during non-idle period: `Σ[i]((Q[d1]+Q[d2])/2\
    \ ∗ (D[i] − C[i]))/Σ[i](D[i] − C[i])`\n    - Effective average queue depth in\
    \ time interval: Sampling at `Δt` seconds\n\nFigure [2-7](#468166_1_En_2_Chapter.xhtml#Fig7)\
    \ gives an illustration of `Q[d1]` and `Q[d2]`, where blue signs with arrows show\
    \ the IO requests in time order. It also illustrates a few `Q[d1]` and `Q[d2]`\
    \ for these requests. Table [2-5](#468166_1_En_2_Chapter.xhtml#Tab5) further gives\
    \ an example to show how the queue depth is calculated based on `Q[d1]`. Figure\
    \ [2-8](#468166_1_En_2_Chapter.xhtml#Fig8) shows the estimated queue depth from\
    \ a Hadoop node. It looks like the average queue depth is quite high, which means\
    \ a high workload. However, zoom into the plot to check the intervals in-between\
    \ the queues. In this example, the scale of the x-axis is 100 instead of 12000\
    \ to show more information.\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig8_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig8_HTML.jpg)\n\
    \n**Figure 2-8** Queue depth using arrival and completed time from a Hadoop node\n\
    \n**Table 2-5** Estimated queue depth and idle time\n\n| Arrival time | Completion\
    \ time | Queue depth | Idle time |\n| --- | --- | --- | --- |\n| 0.00007 | 0.00036\
    \ | 0 | - |\n| 0.01130 | 0.01157 | 0 | 1.09E–02 |\n| 0.01134 | 0.01288 | 1 | 0\
    \ |\n| 0.02622 | 0.02751 | 0 | 1.33E–02 |\n| 0.02679 | 0.02772 | 1 | 0 |\n| 0.03668\
    \ | 0.03950 | 0 | 8.96E–03 |\n| 0.03962 | 0.04477 | 0 | 1.17E–04 |\n| 0.03965\
    \ | 15.07994 | 1 | 0 |\n| 0.04454 | 0.04639 | 2 | 0 |\n| 0.04486 | 0.04651 | 2\
    \ | 0 |\n| 0.05500 | 0.05526 | 1 | 0 |\n\n![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig7_HTML.jpg](images/468166_1_En_2_Chapter/468166_1_En_2_Fig7_HTML.jpg)\n\
    \n**Figure 2-7** Illustration of queue length\n\nThe other is the HDD internal\
    \ queue for actual execution with mechanical parts. Some scheduling algorithms,\
    \ such as SCAN and RPO (rotational positioning optimization), are applied here\
    \ to attempt to minimize a given operation time. Vender special commands (VSCs)\
    \ can be used to collect the internal queue information. RPO tries to minimize\
    \ the summation of seek time and rotational latency of requests in the queue.\
    \ Theoretically, a longer queue means the scheduler has more events to select,\
    \ and the overall operational time can be reduced further (for a pure random access).\
    \ However, in practice, when the queue length reaches a certain level, the performance\
    \ does not increase, which is illustrated in Figures [4-2](#468166_1_En_4_Chapter.xhtml#Fig2)\
    \ and [4-3](#468166_1_En_4_Chapter.xhtml#Fig3). Without VSC, we may only use the\
    \ external IO queue status to approximate the internal queue status. This is reasonable\
    \ in a sense because a HDD can only handle one request per time.^([^(33)](#fn33))\
    \ However, for SSD, the situation is much more complex due to parallel processing."
