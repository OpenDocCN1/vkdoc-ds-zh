    | 4 | 71.92 | 54.86 | 83.12 | 49.32 | 20.48 | 49.35 |\n| 5 | 60.77 | 63.68 | 59.18\
    \ | 25.42 | 62.69 | 90.43 |\n| 6 | 173.36 | 115.82 | 255.16 | 13.43 | 131.29 |\
    \ 122.52 |\n| 7 | 43.01 | 61.43 | 60.39 | 70.63 | 21.89 | 38.54 |\n| 8 | 36.23\
    \ | 37.58 | 41.31 | 37.47 | 20.04 | 33.11 |\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig9_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig9_HTML.jpg)\n\
    \n**Figure 5-9** PCMark: Size distribution\n\n**Table 5-9** PCMark: Think/Completion\
    \ Time (ms) and IOPS\n\n| App | IOPS | Think-time mean | Std. | Completion-time\
    \ mean (blk) | Std. |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 120.57 | 8.29\
    \ | 46.04 | 3.43 | 5.49 |\n| 2 | 189.29 | 5.28 | 9.20 | 10.24 | 47.4 |\n| 3 |\
    \ 48.70 | 20.54 | 21.25 | 1.99 | 3.44 |\n| 4 | 311.30 | 3.21 | 8.25 | 3.59 | 5.84\
    \ |\n| 5 | 122.47 | 8.17 | 16.68 | 0.76 | 2.64 |\n| 6 | 59.56 | 16.79 | 22.58\
    \ | 1.2 | 3.22 |\n| 7 | 145.65 | 6.87 | 14.87 | 2.78 | 5.86 |\n| 8 | 204.29 |\
    \ 4.90 | 16.37 | 16.41 | 29.87 |\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig8_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig8_HTML.jpg)\n\
    \n**Figure 5-8** PCMark: Completion time\n\n![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig7_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig7_HTML.jpg)\n\
    \n**Figure 5-7** PCMark: Think time distribution\n\nBased on a sequential stream,\
    \ you can observe some obvious sequences in general. Importing pictures has the\
    \ most sequence, while application loading has less sequence. Except for application\
    \ loading (mixed streams), queue length 10 is good enough to detect most streams.\
    \ Application loading has relatively more mixed sequential streams. Also note\
    \ that for read-only cases, most streams have only two commands. In Apps 2, 3,\
    \ and 4, the average stream length is longer than others, which provides more\
    \ chance for infinity read mode.\n\n## Gain-Loss Analysis\n\nWith the prefetch\
    \ policy, the gain is from the increased hit ratio due to the cache policy (e.g.,\
    \ hole filling, prefetch), while the loss is from the additional disk access (e.g.,\
    \ pre-/post read attached to the user commands; the self-induced non-attached\
    \ commands) due to the cache policy.\n\nTwo methods can be used to analyze the\
    \ gain and loss. One simple method considers frequency only, so it counts the\
    \ number of the hit frequency and additional disk access frequency. The self-induced\
    \ commands’ cost is generally smaller than non-attached commands. If the hit increases\
    \ due to self-induced commands, the gain is large; otherwise, it is small. This\
    \ method can provide a rough estimation. The other method is the so-called mixed\
    \ simulation and modeling approach; it uses simulation to get the hit ratio and\
    \ additional command frequency, while using the analytical model to obtain the\
    \ average response time, which is relative complex and quantitative. Let’s only\
    \ consider the first one.\n\nLet’s define gain and loss quantitatively:\n\n* \
    \  **Gain:** The additional cache hit obtained (`a[2]`) = the cache hit ratio\
    \ at hole length x (`a[3]`) - the cache hit ratio without hole filling (`a[0]`)\n\
    *   **Loss:** The additional self-induced commands occurrence / the total read\
    \ command (`a[1]`)\n*   **Gain-loss-ratio** `a` **=** `a[2]` **/** `a[1]` **:**\
    \ The higher, the better to estimate `a`, but there are a few basic considerations:\n\
    \    *   **The queue depth** (`Q[d]`) **in the cache:** which has significant\
    \ influence on the LRU algorithm. By observing the largest `a` vs. `Q[d]`, you\
    \ will see that the optimal `Q[d]`. `Q[d]` for different applications may be various.\n\
    \    *   **The time interval** (`d[T]`) **between commands:** Only if the interval\
    \ is larger than a certain value, the system has chance to handle self-induced\
    \ command, such as finding the ratio `a` for different `d[T]`.\n    *   **The\
    \ hit frequency of each hole:** When using a correlation method to select the\
    \ hole to fill, the hit frequency must be higher than 1. If the hit frequency\
    \ is generally larger than 1, then this method is meaningful; otherwise, it is\
    \ meaningless.\n\nLet’s start to verify whether a self-induced hole filling policy\
    \ is beneficial. Take the following steps:\n\n1.  Check `a[1]`, `a[2]`, and `a`\
    \ for all read commands (write commands also fill the cache).\n2.  If `a[1]` is\
    \ much larger than `a[2]` (e.g., `a < 0.2`), it is not economic for hole filling;\
    \ then check if `a[2]` is too small to be worthy. Otherwise, hole filling is useful;\
    \ and check the selective self-induced commands based on workload.\n3.  If the\
    \ time-interval between two commands is large enough (e.g., `> 15ms`), the self-induced\
    \ command may not cost additional resources. If so, any increased cache hit ratio\
    \ is beneficial. Repeat Steps 1-2.\n\nTable [5-11](#468166_1_En_5_Chapter.xhtml#Tab11)\
    \ provides the results where `Q[d]` = queue depth and `f[s]` = filling hole size.\
    \ You can see that App 2 is most significant for hole filling, while App 6 is\
    \ least significant. Hole filling is generally suitable for Apps 2, 3, 5, and\
    \ 8. If you only consider the commands with a think time larger than `10ms`, you\
    \ have the results listed in Table [5-12](#468166_1_En_5_Chapter.xhtml#Tab12).\
    \ You can see that the general trend is similar to the case without time-interval\
    \ constraints. App 5 is most significant for hole filling for `f[s] = 128` and\
    \ App 3 for `f[s] = 256`; while App 6 is less significant. In sum, `a` is generally\
    \ smaller than 1 for short queue depth. When hole size is very small, `a` is very\
    \ small (`<< 1`). When both queue length and hole size are short, hole filling\
    \ policy is generally useless. Based on the value of `a`, you can say that this\
    \ policy is generally useless for App 6 and may be useful for Apps 2, 5, and 8.\
    \ Further conclusion should be made after comparing with prefetch policy.\n\n\
    **Table 5-12** Gain-Loss Analysis for Hole Filling (Constrained)"
