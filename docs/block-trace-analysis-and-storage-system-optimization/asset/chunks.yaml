  trans: '

    让我们来看表 2-6 中的示例。假设这些请求在一个 *t* 秒的时间窗口内到达。通过比较 FIFO 顺序中前一个请求的最后一个 LBA 和当前请求的第一个
    LBA，可以明显看出所有请求都是随机的。在这种情况下，有七次寻道，且 `N[r] = 8`，`N[s] = 0`。从这个意义上说，工作负载是随机的，因为没有顺序流。然而，如果你借助队列按
    LBA 对请求重新排序，使得请求顺序为 `< 263158(7)4 >`，那么根据（严格）顺序流，你将得到 `N[r] = 3` 和 `N[s] = 4`。请注意，在重新排序过程中，请求编号
    7 被请求编号 8 吸收了。因此，对于（严格）顺序流，`M[2] = 2`（`< 2631 >` 和 `< 58(7) >`）。在 `S = 1024` 和
    `M[2] = 2` 这两个约束条件下，你得到（`< 58(7) >` 和 `< 4 >`）。流 `< 2631 >` 因大小不足而被移除。


    当考虑 `Δd = 64` 和 `512` 的近顺序流时，在严格顺序流下，你分别得到 `M[2] = 3`（`< 2631 >`、`< 58(7) >` 和
    `< 4 >`）和 `1`（`< 263158(7)4 >`）。


    **表 2-6** LBA 序列与随机性示例


    | 顺序 | 第一个 LBA | 最后一个 LBA | 顺序 | 第一个 LBA | 最后一个 LBA |

    | --- | --- | --- | --- | --- | --- |

    | 1 | 128 | 135 | 5 | 256 | 511 |

    | 2 | 0 | 7 | 6 | 8 | 63 |

    | 3 | 64 | 127 | 7 | 640 | 647 |

    | 4 | 1536 | 2047 | 8 | 512 | 1279 |


    从这个示例中，可以得到以下变量：


    *   `N[s1]`：具有顺序访问的请求数量

    *   `N[s2]`：具有近顺序访问和 LBA 间隙的请求数量

    *   `N[r]`：剩余请求的数量


    这些变量与下一节中定义的逻辑寻道有很强的关联。


    在实际应用中，实际的间隙大小 `Δd` 通常由系统性能容限决定。通常，它最多为几个磁道大小。例如，如果可接受的容限是 5ms，那么基于 10K RPM 磁盘模型（磁道/磁头切换时间为
    1ms，平均磁道大小为 1.5MB），`Δd` 最多可达 1536 个块。对于随机访问，平均旋转延迟为 3ms。假设新请求有 50% 的概率在同一磁道，50%
    的概率在下一磁道（实际概率与 `Δd` 相关）。那么你还有 `5 - (3 + 1) * 50% = 3ms` 用于进一步旋转，这大约是半个磁道大小，即 1536
    个块。^(³⁴)


    **顺序比率：** 由于对顺序性的看法不同，顺序比率的定义也有所不同。下面列出几个示例。


    *   DEF1：使用 `S` 和 `M[2]` 阈值检测到的顺序命令总和 / 总命令数

    *   DEF2：（使用 `S` 和 `M[2]` 阈值检测到的顺序命令总和 - 总顺序流数）/ 总命令数

    *   DEF3：使用 `S` 和 `M[2]` 阈值检测到的顺序命令的请求大小总和 / 所有命令的总请求大小

    *   DEF4：（使用 `S` 和 `M[2]` 阈值检测到的顺序命令的请求大小总和 - 顺序流中第一个命令的大小总和）/ 所有命令的总请求大小


    如果移除大小约束 `S`，你将得到另外四个定义。


    ### 空间局部性与逻辑寻道距离


    局部性，作为变量在短到中等范围内与自身相关性的特例，可以可视化为一个二维概率曲面 `p(s, d)`，它显示了距离 `s` 字节的地址首次被引用恰好发生在
    `d` 个周期内的概率。通常有两种类型的局部性：空间局部性和时间局部性。对于空间局部性，如果距离 `s = |x[i] - x[j]|` 很小，这意味着在引用地址
    `x[i]` 后不久，你将发现对相邻地址 `x[j]` 的引用。时间局部性将在下一小节讨论。


    请注意，大多数跟踪中只提供了 LBA，而不是物理块地址（PBA）。因为不同的 HDD 可能具有不完全相同的数据布局（例如蛇形布局），不同 HDD 之间相同的
    LBA 布局可能导致不同的 PBA。然而，如果它们的数据布局相似，差异通常非常小。因此，分析逻辑距离也是有意义的。


    下面我将讨论两种距离，分别指示空间局部性和时间局部性 [35]。


    #### 逻辑寻道距离


    该指标是空间局部性的一个指示器。它定义了“连续”设备接收的 IO 之间的逻辑块/LBA 距离。


    *   非排队下一个：最简单的情况，计算两个完全连续的 IO 之间的距离。

    *   非排队最近：绝对最近距离 = `min(||last_LBA(r[j-1]) - first_LBA(r[j])||, ||last_LBA(r[j])
    - first_LBA(r[j+1])||)`，其中 `r[j]` 是当前 IO。最近距离是绝对最近距离的有符号值，其中 `||·||` 表示绝对值。

    *   排队下一个：模拟一个具有特定规则的队列，使得绝对最近距离 = `min(||last_LBA(r[i]) - first_LBA(r[j])||)`，`i
    = 1, ..., n[i] ≤ N`，其中 `n[i] ≤ N` 是当前队列长度，`r[i]` 是队列中的 IO。

    *   排队最近：模拟一个队列，使得绝对最近距离 = `min(||last_LBA(r[i]) - first_LBA(r[j])||[i=1,...,ni],
    ||last_LBA(r[j]) - first_LBA(r[j]+1)||)`。


    一般来说，`||排队最近|| ≤ ||非排队最近|| ≤ ||非排队下一个||`。对于距离，你可以进一步定义三个值：均值、中位数、众数。众数表示出现最频繁的数字，众数
    = 0 的计数器越大，表示顺序性越好。


    ### 时间局部性与逻辑栈距离


    时间局部性意味着相同的地址在 `d` 步之后被再次引用。流行度是一个与时间局部性密切相关的术语。


    #### 逻辑栈距离


    如果 `r[i]` 中的某个 LBA 在一段时间后被另一个请求 `r[j]` 再次引用，则这两个请求之间的命令距离被定义为（简化后的）逻辑栈距离，这是一个重要的时间局部性指标。以写请求为例。如果距离足够小（例如，小于
    HDD 的 DRAM 缓存队列大小），则可能在 DRAM 缓存中命中；否则，写操作需要更新磁盘。如果某个距离范围内的写操作频率很高，则意味着更新频率很高。


    与 [35] 中的情况不同，我们更感兴趣的是考虑缓存的排队栈距离。因此，让我们也研究一下读/写依赖关系。具体细节将在本章后面讨论。


    #### 突发性与自相似性


    I/O 请求几乎从不单独出现，而是倾向于成组到达，因为如果存在没有请求到达的长间隔，那么就会存在请求到达数量远超平均份额的间隔。它们通常与队列深度、请求到达率和到达间隔时间相关。这种现象通常被称为长程依赖性，并且通常被解释为（随机）自相似性，因为这是唯一能避免非平稳性的解释。自相似性现象描述了对象的某个属性在空间和/或时间尺度上缩放时如何保持不变。换句话说，除了长程依赖性属性外，尺度不变性属性在任何不同的时间尺度上都成立，就像分形形状一样。

    '
- fmt: '### Statistical Properties Visualization and Evaluation


    Besides the statistical properties mentioned in previous sections, there are several
    other properties of both the marginal and the joint probability distributions
    of the interested attributes that may strong influence the quantitative analysis
    of the system behavior [35]:


    - **Normality:** A probability distribution can be accurately approximated by
    a normal distribution. Although perfect normal distribution is rare in reality,
    it is often used a reference model.

    - **Nonstationary:** In a stationary process, the outputs (job size, inter-arrival
    time) vary, but the stochastic process that produces them does not.

    - **Long-tailness and power-law:** Some regions far from the mean or the median
    of the probability distribution, like the extreme values in the tails of the probability
    distribution, are assigned relatively high probabilities following a sub-exponential
    or polynomial law, contrary to what happens to the family of normal distributions,
    where the tails fall exponentially.

    - **Heavy-tailness:** The long tails of the distribution fall polynomially and
    the self-similarity property holds.

    - **Cyclic behavior and seasonal variations:** They are an indication of a non-stationary
    workload and must be treated separately.

    - **Autocorrelation, cross-correlation, and short-range dependence:** Autocorrelation
    is also known as serial correlation or short-term/range memory, where the autocorrelation
    at short time scales is significant and long-range dependence is also known as
    long-term memory, where the autocorrelation at long time scales is significant.


    These properties can be possibly visualized via graphical plotting. The empirical
    cumulative distribution function (EDF) and the complementary EDF (CEDF) are often
    used to observe the sample distribution. In particular, the log-log EDF and log-log
    CEDF plots are usually applied to compare the body and the tails of the sample
    probability distribution, respectively. Similarly, the Q-Q plot (a plot of the
    quantiles of the first data set against the quantiles of the second data set)
    can be employed for evaluating possible differences, especially in the tails,
    between the empirical probability distribution and another reference probability
    distribution, either theoretical or empirical.


    The mass-count disparity plot and the Lorenz curve can be used to look for evidence
    of the power-law property. The mass-count disparity plot displays the “mass” probability
    distribution (given by the probability that a unit of mass belong to an item smaller
    than a predefined `x`) against the “count” probability distribution (given by
    the CDF) in order to show possible disparities between these two probability distributions.
    The Lorenz curve is an alternative way to illustrate the relationship between
    the “count” distribution and the “mass” distribution; it is generated by pairing
    percentiles that correspond to the same value (i.e. a point (`p[c]`, `p[m]`) in
    the curve is such that `p_m = F_m(x) = F_m(F_c^{-1}(p_c))` where `F_m(·)` and
    `F_c(·)` are the cumulative distribution functions of the “mass” and “count” distributions,
    respectively, and `F_c^{-1}(·)` is the inverse of `F_c(·)`.


    The run-sequence plot and the autocorrelation plot for investigating for the presence
    of both short-range and long-range dependence as long as for periodic patterns
    and trends. The run-sequence plot displays observed data in a time sequence; it
    is constructed by plotting values of the interested (univariate) attribute according
    to the temporal order as they appear; this plot is particularly useful for finding
    both shifts in location and scale, for locating outliers and, in general, for
    getting insights about the trend of observed data. The autocorrelation plot (also
    known as a correlogram) is a plot of the sample autocorrelation function (ACF),
    which is of the sample autocorrelation at increasing time lags; it is used for
    checking for randomness in a sequence of observations of the same attribute. If
    random, such autocorrelations should be near to 0 for any and all time-lag separations;
    conversely, if non-random, then one or more of the autocorrelations will be significantly
    different from 0.


    Some hypothesis-testing techniques can be used for quantitative evaluations of
    these properties, such as F-test, T-test, K-S (Kolmogorov-Smirnov) test, Mann-Whitney
    U-test, and H-test. These tests can compare the differences between two empirical
    distribution functions/samples. The Pearsons `r` and the Spearmans `ρ` correlation
    coefficients are utilized to discover linear and generic correlations, respectively,
    among the interested attributes. Both coefficients are within the range of [–1,+1],
    where +1 means a strong positive correlation, while –1 means a strong negative
    correlation. 0 means no significant correlation. More details will be described
    in Chapter [9](#468166_1_En_9_Chapter.xhtml).


    ### Read /Write Dependency


    Dependencies are generally classified into four categories [39]:


    - Read-on-write (ROW), or read after write (RAW), or true dependencies

    - Write-on-write (WOW) or write after write (WAW) or write update, or output dependencies

    - Write-on-read (WOR), or write after read (WAR ), or anti-dependencies

    - Read-on-read (ROR) or read cache hit, or input-dependencies


    Within a certain time window, ROR and ROW are directly related to the cache replacement
    algorithm and read hit performance, while WOR and WOW are related to the cache
    update policy. The existence of a ROW between two operations relies on the situation
    that if the first operation writes a block that is later read by the other operation
    and there is no intervening operation on the block. WOW and WOR are similarly
    defined. ROR is a very common property to check read cache efficiency. ROW can
    check if the so-called “write once read many (WORM)” is possible, which is an
    important value for SMR (the higher the better).'
