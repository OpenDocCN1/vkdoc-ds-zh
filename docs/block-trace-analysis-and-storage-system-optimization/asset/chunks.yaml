    | ![$$ \frac{\mathit{\max}}{\mathit{\min}} $$](images/468166_1_En_9_Chapter/468166_1_En_9_Chapter_TeX_IEq2.png)
    |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---
    | --- |

    | 3–8 | 52.48 | 17.77 | 55.34 | 44.65 | 114.21 | 9.1 | 48.49 | 21.13 | 0.7 | 40.43
