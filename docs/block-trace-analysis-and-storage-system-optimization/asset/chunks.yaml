    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig3_HTML.jpg](img/468166_1_En_6_Fig3_HTML.jpg)


    图 6-3


    1K 请求轨迹详情


    从转折点，您还可以推测缓存簇/段的大小。例如，SSHD 在 WCD 期间写入的簇大小约为 64K，而 CMR A 约为 256KB。SSHD 在 WCE 时最多使用
    60MB DRAM 空间作为写入缓存，而在 WCD 时仅使用约 8MB，包含约 100 个段。

