    # 2. 轨迹特征


    轨迹通常分为三个层级：块级、文件级和对象级。它们共享许多通用指标，尽管每个层级都有其独特的属性。在本章中，我将详细讨论块级轨迹指标，因为块级轨迹提供的存储系统基础信息比其他两个层级更多。为简化表述，我将这些指标分为两类：基础指标和高级指标。这些指标的含义及其对性能的影响将详细解释。


    ## 工作负载属性


    工作负载可以在不同的抽象层级进行收集和查看。通常，存在三个不同的层级，如图 2-1 [37] 所示。功能视图表示用户行为，旨在便于比较，例如，服务于某些企业数据仓库管理工作负载等效功能目标的关系数据库系统和
    MapReduce 系统。它使得大量等效系统之间能够进行比较。但它缺乏对大规模、以数据为中心的系统的追踪能力。系统视图在我们当前能够追踪的大规模数据密集型系统中，以最高抽象层级捕获工作负载行为。例如，在
    MapReduce 中，这转化为作业流和作业特征。对于企业网络存储，这指的是应用层、会话层、文件层和目录层的数据访问流。物理视图根据硬件组件行为来描述工作负载，例如工作负载执行期间的
    CPU、内存、磁盘和网络活动。它依赖于硬件、软件甚至配置的变更。


    ![../images/468166_1_En_2_Chapter/468166_1_En_2_Fig1_HTML.png](img/468166_1_En_2_Fig1_HTML.png)


    图 2-1


    典型的工作负载抽象层级


