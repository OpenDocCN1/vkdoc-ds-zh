  trans: '

    # 采集技术


    目前已提出多种技术来监控和捕获系统或组件的踪迹。通常有以下四种技术：


    - **基于硬件的监控**需要对测试平台硬件进行改造，以便在程序执行时创建所有指令和/或数据地址的记录。

    - **基于软件的追踪**可以在一定程度上实现与硬件类似的目标，但并非修改系统硬件，而是修改或插入软件。

    - **基于模拟的追踪**在宿主机与待评估操作系统之间构建一个抽象层，例如`QEMU`^(³⁶)和`SimOS`^(³⁷)。该抽象层仅模拟足以让操作系统正常运行所需的组件。虽然该系统为采集依赖于操作系统的踪迹提供了灵活的接口，但所捕获踪迹的准确性有时存疑。由于执行了模拟，程序的执行会受到干扰。

    - **基于微码的追踪**利用微码修改来捕获踪迹信息，引入的开销极小，例如`PALcode`（特权架构库代码）^(³⁸)。


    然而，由于复杂度过高且准确性存疑，第三和第四种技术并不常用。因此，本章仅讨论基于硬件和基于软件的技术。


    ## 硬件踪迹采集


    我们将硬件方法定义为使用特定硬件设备/系统来捕获目标存储设备之外的输入输出（IO）的踪迹采集方法，尽管可能仍需要一些软件来管理这些踪迹[38, 45]。有多种类型的硬件可用于采集块级踪迹。最常见的设备之一是总线分析仪，但其应用范围并不局限于磁盘驱动器的块级输入输出，还可用于网络流量、DDR/CPU
    缓存/停顿/延迟/吞吐量等。一些产品能够捕获相当准确的踪迹，例如来自 Viavi solutions 的`Xgig 6G SAS/SATA 分析仪`、来自
    SerialTek 的`BusXpert Micro II 系列 SAS/SATA 分析仪`、来自 TI 的`Trace and analyzer`、来自
    LeCroy 的`协议分析仪`、来自 Arium 的`Eumulator XL-100`以及来自 Green Hills Software 的`SuperTrace
    Probe`。


    总线分析仪通常为用户提供多种通信接口。以图 3-1 中的设备为例，它们提供 USB、以太网、SCSI 等接口。这些设备通常通过多种机制实现可靠且准确的连接，具有比基于软件的工具更高的分辨率（例如时间精度和捕获频率），并能捕获更多信息。


    ![../images/468166_1_En_3_Chapter/468166_1_En_3_Fig1_HTML.jpg](img/468166_1_En_3_Fig1_HTML.jpg)


    图 3-1


    来自 LeCroy、XGIG 和 SerialTek 的总线分析仪


    图 3-2 展示了`BusXpert`中 SAS IO 访问的示例，该工具提供了几乎所有与 SAS 协议相关的基本信息。用户可以从详细的日志中轻松追踪命令状态，例如响应时间、连接等。


    ![../images/468166_1_En_3_Chapter/468166_1_En_3_Fig2_HTML.jpg](img/468166_1_En_3_Fig2_HTML.jpg)


    图 3-2


    来自 BusXpert 的丰富协议信息


    图 3-3 提供了另一个 SATA 命令分析的示例。您可以看到主机在大约 5 秒后发出了`COMWAKE`命令。驱动器几乎立即确认了`COMWAKE`。在
    5.59 秒时，`SMART READ DATA`被传输到主机。


    ![../images/468166_1_En_3_Chapter/468166_1_En_3_Fig3_HTML.jpg](img/468166_1_En_3_Fig3_HTML.jpg)


    图 3-3


    SATA 命令分析


    尽管捕获几乎所有关键协议信息并不困难，但用于分析踪迹的软件中并未包含 IO 属性的高级指标。


    ## 软件踪迹采集


    在准确性方面，软件踪迹采集器可能不如硬件设备。特别是对于时间精度要求达到纳秒或更低的应用程序，软件可能无法很好地工作。例如，与 SAS/SATA 协议相关的磁盘特性调试可能适用于总线分析仪，因为它可能涉及磁盘驱动器的
    SoC 时钟问题。然而，对于磁盘驱动器的 IO 性能，其操作通常处于毫秒级别（精度），这通常在普通服务器或工作站中现代处理器和操作系统的能力范围之内。


    有许多可用的 IO 工具[45, 35]：


    - **Linux/Unix**：`Dtrace`[46]、`LTTng`、`BCC`^(³⁹)、`iostat`、`dstat`、`tracefs`^(⁴⁰)、`iotop`、`hdparm`、`ionice`、`Ctrace`^(⁴¹)、`iogrind`、`POSIX
    Test Suite`、`ioprofile`、`SystemTap`、`IOR`、`PCP`和`swtrace`

    - **Windows**：`Xperf`^(⁴²)、`TraceWPP`/`TraceView`/`Tracelog`/`Logman`^(⁴³)、`Vtrace`、`Oracle
    trace collector`、`Bus analyzer module`^(⁴⁴)和`PatchWrx`^(⁴⁵)


    然而，并非所有这些工具都能提供事件细节。事实上，像`iostat`和`iotop`这样的通用监控工具无法提供基于单个 IO 的详细信息。


    这些工具可分为两类：静态工具和动态工具。静态工具将程序的二进制映像视为一个永不修改的黑盒。而动态工具则依赖于二进制级别的修改，以便于从应用程序中收集统计数据。例如，所有
    Windows 工具以及`iotop`/`iostat`/`dstat`/`hdparm`/`ionice`/`iogrind`/`ioprofile`都是静态工具，而`SystemTap`、`Dtrace`和`LTTng`是动态工具。特别是，`Dtrace`和`LTTng`使用一种称为探测（probing）的机制，能够选择性地激活嵌入在软件各抽象层中的检测例程，从而不仅可以从应用程序，还可以从其执行所涉及的各种库和内核例程中获取与性能相关的统计数据。


    ### Blktrace


    `Blktrace`是一个静态工具，自 Linux 内核版本 2.617-rc1 起已嵌入其中。该工具轻量且易于使用。它仅考虑操作系统/文件系统缓存之后的设备访问。当
    IO 进入块 IO 层（请求队列）时，每个 CPU 的中继通道会发出事件，然后`blktrace`从这些通道捕获事件。更多细节可参见附录 B。

    '
- fmt: '### Dtrace, SystemTap, and LTTng


    As mentioned, dynamic tracing tools embed tracing code into working user programs
    or kernels, without the need of recompilation or reboot. Since any processor instruction
    may be patched, it can virtually access any information you need at any place.
    I will discuss several dynamic tracing tools next.


    `DTrace` [47] originated from Solaris.^([^(46)](#fn46)) Its development was begun
    in 1999, and it became part of the Solaris 10 release. Nowadays, `DTrace` is open-sourced
    as a part of OpenSolaris, although it has not merged into the Linux kernel due
    to license incompatibility. There exist several ports without proper support.
    A toolkit based on `DTrace` for simplification of use has been developed by B.
    Gregg.^([^(47)](#fn47)) But the essential limitation has been solved. A few attempts
    led to the development of another clone of `DTrace` called `DProbes`, but it seems
    to be unsuccessful.


    Therefore, three major Linux players, Red Hat, Hitachi and IBM, presented another
    dynamic tracing system for Linux called `SystemTap`.^([^(48)](#fn48)) `SystemTap`
    is one of the most powerful tracers so far. However, it has to generate a native
    module for each script it runs, which is a huge performance penalty. `Ktap`^([^(49)](#fn49))
    was further developed to reduce the overhead using Lua and LuaJIT internally.
    Another similar implementation is `sysdig`,^([^(50)](#fn50)) which is scriptless.


    `LTTng`^([^(51)](#fn51)) is also a widely used open source tracing framework for
    Linux. It used static tracing and required kernel recompilation until version
    2.0; it currently utilizes `ftrace` and `kprobe` subsystems in the Linux kernel.
    It makes the users understand the interactions among multiple system components,
    like the Linux kernel, using either existing or user-defined instrumentation points,
    C/C++ applications, Java applications, Python applications, or any other user
    space application with the `LTTng` logger. It may outperform other tracers because
    it has optimized event collection. It also supports numerous event types, including
    `USDT` (user-level statically defined tracing).


    When identifying the overall system performance instead of only storage IO, these
    tools will play a significant role. In Chapter [9](#468166_1_En_9_Chapter.xhtml),
    you will use Ceph as an example to find the performance bottleneck from an overall
    system view.


    ## Trace Warehouse


    Mainly for research purposes, there are some real/synthesis traces available online
    for download. The following are few examples:


    - SNIA at [`http://iotta.snia.org`](http://iotta.snia.org). It provides block
    IO trace (e.g., the block traces on a virtual desktop infrastructure and Microsoft
    Production Servers), NFS trace, system call trace, etc.

    - Sandia National Laboratories at [`www.cs.sandia.gov/Scalable_IO/SNL_Trace_Data/`](http://www.cs.sandia.gov/Scalable_IO/SNL_Trace_Data/).
    `S3d` I/O kernel trace data was collected during runs on 6400 clients of Redstorm.

    - Los Alamos National Laboratory at [`http://institute.lanl.gov/data/`](http://institute.lanl.gov/data/).
    Few traces, like MPI/HPC, are categorized.

    - Google at [`https://github.com/google/cluster-data`](https://github.com/google/cluster-data).
    It provides cluster workload trace on Google compute cells.

    - Facebook at [`https://github.com/SWIMProjectUCB/SWIM/wiki/Workloads-repository`](https://github.com/SWIMProjectUCB/SWIM/wiki/Workloads-repository).
    A number of 1-hour segments from Facebooks Hadoop traces were published as part
    of UC Berkeley AMP Labs SWIM project.

    - Dartmouth University at [`www.cs.dartmouth.edu/dfk/nils/workload.html`](http://www.cs.dartmouth.edu/dfk/nils/workload.html).
    It provides some traces from parallel file systems (e.g., Intel’s CFS, Thinking
    Machines SFS).^([^(52)](#fn52))

    - Harvard University at [`www.eecs.harvard.edu/sos/traces.html`](http://www.eecs.harvard.edu/sos/traces.html).
    It provides some NFS traces.

    - UMassAmherst at [`http://traces.cs.umass.edu/index.php/Main/Traces`](http://traces.cs.umass.edu/index.php/Main/Traces).
    OLTP and search engine traces are archived.

    - Hebrew University at [`www.cs.huji.ac.il/labs/parallel/workload/index.html`](http://www.cs.huji.ac.il/labs/parallel/workload/index.html).
    Multiple parallel workloads are collected.

    - OpenCloud at [`http://ftp.pdl.cmu.edu/pub/datasets/hla`](http://ftp.pdl.cmu.edu/pub/datasets/hla).
    These traces were taken from a Hadoop cluster managed by CMU’s Parallel Data Lab.
    They provide very detailed insights into the workload of a cluster used for scientific
    workloads during a 20-month period, including timestamps, slot counts, and more.


    Together with the source code for the analysis tool, I also provide trace sample
    data in GitHub.


    This chapter discussed both hardware and software tools for trace collection.
    Note that the former generally offer higher precision and more information than
    the latter, although they are more expensive. However, in many scenarios, the
    precision is only required at the millisecond level. Therefore, software-only
    tools are widely applied in both industries and academics. Note that there exist
    various tools for different purposes. In order to identify the overall system
    performance, you shall employ multiple tools or some integrated tool sets.


