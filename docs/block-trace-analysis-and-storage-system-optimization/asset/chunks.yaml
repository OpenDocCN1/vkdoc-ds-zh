- fmt: '# System Performance Evaluation


    Many metrics are used to indicate the specification of storage devices or systems,
    in both static and dynamic sense. Table [1-5](#468166_1_En_1_Chapter.xhtml#Tab5)
    gives a list of commonly used ones. When discussing performance, we usually refer
    to the dynamic specifications. In particular, IO performance is among the most
    important metrics.


    **Table 1-5** Common Metrics for Storage Devices


    | Metrics | Unit |

    | --- | --- |

    | Capacity | GB |

    | Areal density (TPI, SPT) | GB/inch |

    | Volumetric density | TB/liter |

    | Write/read endurance | Times/years |

    | Data retention time | Years |

    | Speed (latency of IO access time; rand.) | Million seconds |

    | Speed (bandwidth of IO access; seq.) | MB/second |

    | Power consumption | Watts |

    | Reliability (MTBF) | Hours |

    | Power on/off transit time | Seconds |

    | Shock and vibration | G-force |

    | Temperature resistance | *°*C |

    | Radiation resistance | Rad |


    Performance evaluation is an essential element of experimental computer science.
    It can be used to tune system parameters, to assess capacity requirements when
    assembling systems for production use, to compare the values of some different
    designs, and then provide guidance for the new development. As pointed out in
    [35], the three main factors that affect the performance of a computer system
    are:


    - The system’s design

    - The system’s implementation

    - The system’s workload


    These three factors influence and interact with each other. It is common for a
    system to perform well for one workload, but not for another. For a given storage
    system, its hardware design is usually fixed. However, it may provide some tuning
    parameters. If the parameters are also fixed in one scenario, the performance
    is usually “predictable” for a particular application. By running enough experiments,
    it is possible to obtain some patterns for the parameters related to the application’s
    general workload properties. Then you may further tune the parameters. Sometimes,
    due to design limitations, the range of tuning parameters may be too narrow. Then
    you must redesign the system.


    The most important three basic performance indexes are input/output operations
    per second (IOPS), throughput (TP), and response time (RT) [12].


    - **Throughput**, also named bandwidth, is related to the data transfer rate and
    is the amount of data transferred to or from the storage devices within a time
    unit. Throughput is often measured in KB/sec, MB/sec, or GB/sec. For disk drives,
    it usually refers to the sequential access performance.

    - **IOPS** means the IO operation transfer rate of the device or the number of
    transactions that can occur within a time unit. For disk drives, it usually refers
    to the random access performance.

    - **Response time**, also named latency, is the time cost between a host command
    sent to the storage device and returned to the host, so it’s the time cost of
    an IO request for the round trip. It is measured in milliseconds (ms) or microseconds
    (*μ*s) and is often cited as an average (AVE) or maximum (MAX) response time.
    In a HDD specification, the average seek time and switch time are usually provided.


    And the most important three access patterns are:


    - **Block size**, which is the data transfer length

    - **Read/write ratio**, which is the mix of read and write operations

    - **Random/sequential ratio**, which is the random or sequential nature of the
    data address requests


    In addition, when considering consumer/client or enterprise devices/systems, the
    focus may be different. For example, in some client use cases, IOPS and bandwidth
    may be more critical than response time for HDD/SSD devices, as long as the response
    times are not excessively slow, since the typical client users would not usually
    notice a single IO taking a long time (unless the OS or software application is
    waiting for a single specific response). While client SSD use cases may mostly
    be interested in average response times, the enterprise use cases are often more
    concerned with maximum response times and the frequency and distribution of those
    times [12].


    ## Performance vs. Workload


    Workload can be categorized in several ways. From the domain point of view, the
    workload can be imposed to the CPU, memory, bus, network, etc. The level of details
    required in workload characterization relies on the goal of the evaluation. It
    can be in the computer component level or in the system application level. In
    the sense of applications, workload may be extracted from database, email, web
    service, desktop, etc.


    An important difference among workload types is their rate [35], which makes the
    workload either static or dynamic. A static workload is one with a certain amount
    of work; when it is done, the job is completed. Usually, the job is several combinations
    of small sets of given applications. On the other hand, in a dynamic workload,
    work continues to arrive all the time; it is never done. It requires an identification
    of all possible jobs.


    From practical point of view, the workload is divided into three categories: file-level,
    object-level, and block-level. In this book, I focus on block-level because most
    underlying storage devices are actually block devices, and the techniques applied
    to block-level analysis can be also used for file-level and object-level analysis.


    ## Trace Collection and Analysis


    Workload trace can be collected using both software and hardware tools, actively
    or passively. The inherited logging mechanism of some systems, which usually runs
    as background activates, is one of passive trace sources. Actively, you may require
    specific hardware (e.g., a data collection card, bus analyzer, etc.) and software
    (e.g., `dtrace`, `iperf`, `blktrace`, etc.) to collect traces purposely. These
    traces may be at different precision and detail levels. Sometimes you may also
    require the aid of benchmark tools when the environments of real applications
    are not available or inconvenient to obtain. Chapter [5](#468166_1_En_5_Chapter.xhtml)
    will discuss this in detail.'
