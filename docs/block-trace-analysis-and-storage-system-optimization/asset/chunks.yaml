    \   |   |   |   | 2014 |\n| IOzone | Y | Y | Y | WLU | S | Y | 2006 |\n| Bonnie++\
    \ | Y |   |   | LU | S | Y (GPL2) | 1.0.1 |\n| dbench | Y | Y | Y | LU | S/C |\
    \ Y (GNU) | 2008 |\n| Filebench | Y | Y | Y | LU | S | Y | 2011 |\n\nFor large-scale\
    \ systems, the traditional tools may be insufficient (e.g., lack of measurement\
    \ metrics) or inconvenient (e.g., no integrated user interface) enough. Therefore,\
    \ some dedicated tools are proposed, such as HiBench,^([^(63)](#fn63)) Berkely\
    \ BDB,^([^(64)](#fn64)) BigDataBench,^([^(65)](#fn65)) and BigBench^([^(66)](#fn66))\
    \ for big data benchmarks, in particular, the Hadoop/Spark systems.\n\nA general\
    \ benchmark procedure is shown in Table [5-2](#468166_1_En_5_Chapter.xhtml#Tab2)\
    \ [52]. Note that there exist other classification methods. For example, three\
    \ types are named as micro-benchmark in lower-level system operation (e.g., evaluating\
    \ HDFS operations on modern cluster), functional/components benchmarks in high-level\
    \ functions (e.g., Terasort, basic SQL), application-level benchmarks (e.g., overall\
    \ system performance for a given application scenario). For more details, refer\
    \ to [41, 35].\n\nTable 5-2\n\nFive Steps for General Benchmarks\n\n| Steps |\
    \ Remarks |\n| --- | --- |\n| Choose the proper configuration. | Select the proper\
    \ type of benchmark, such as macro-benchmark (overall test for the full system),\
    \ micro-benchmark (few operations to check partial changes), or trace-based. |\n\
    | Choose the correct environment. | Consistent hardware and software settings,\
    \ and some factors, such as cache status, HDD zoned constant angular velocity,\
    \ file system aging, nonessential processes, etc. |\n| Run the benchmark. | Identical\
    \ run for repeatability, multiple rounds for accuracy with small standard deviations\
    \ or high confidence level, sufficient running time for steady state, automatic\
    \ run via suitable scripts. |\n| Present the results. | Statistical results with\
    \ small confidence-interval and near normal distribution |\n| Validate the results.\
    \ | Reproduce/confirm the results or compare with other similar ones. |\n\n##\
    \ SPC-1C\n\nThe Storage Performance Council (SPC) provides several benchmarking\
    \ tools under different levels. SPC-1C [53] is designed to be vendor/platform\
    \ independent and is applicable for a wide range of storage component products,\
    \ such as disk drives, host bus adapters (HBAs), intelligent enclosures, and storage\
    \ software such as logical volume managers."
  trans: "\n# 与应用程序的交互\n\n如第 2 章所述，不同应用程序的指标可能存在巨大差异[35]。表 4-3 对一些常见应用的典型需求进行了简单比较。^(⁵⁵)\
    \ 由于不同应用的需求差异显著，这对存储系统提出了不同的要求。第 8 章将阐述一个用于大数据应用的、采用`HDFS`的 Hadoop 系统的 IO 模式，而第\
    \ 9 章将讨论最流行的分布式存储系统之一`Ceph`。\n\n**表 4-3** 部分应用的典型需求\n\n| | 高性能计算数据存储 | 云存储 | HDFS/混合存储\
    \ | 归档/备份 | 高性能计算检查点数据 | 数据库 |\n| --- | --- | --- | --- | --- | --- | --- |\n\
    | 属性 | 近期数据存储：顺序、高吞吐量 WORM 操作 | 传统批处理 IO 顺序读/写 | 传统批处理 IO 顺序读/写 | 一次写入，极少读取 |\
    \ 检查点操作：突发性、高吞吐量操作 | 事务性：小 IO 读取、修改、写入 |\n| 延迟 | 与云存储需求相似。通常为以太网，有时为 IB。 | 10\
    \ 至 100 毫秒之间 | 10 至 100 毫秒之间 | 预期高延迟（>=10 秒）；Amazon Glacier 为 3-5 小时 | 1-2 毫秒；对于>1kb\
    \ 的数据传输可达 45 微秒 | 越快越好，0-10 毫秒，但在出现问题前可达 90 毫秒 |\n| IOPS/吞吐量 | 提供多种不同产品。供应商特定的存储规格各不相同。\
    \ | 根据实例大小，IOPS 从数百到 1 万不等 | 取决于磁盘性能，几乎没有明显的开销阻碍硬件性能 | LTO4 磁带为 120MB/s，延迟 22\
    \ 秒 | 通常每 4U 单元系统性能为 1 万+ IOPS； | 通常为 1K-30K IOPS，最高可达 1-1 千万+级别；实现方式因平台而异； |\n\
    | 其他 | 通常用于科学数据分析，而非超级计算机检查点存储。 | 高可用性（4/5 个 9）；高数据持久性（9/11 个 9） | 原地数据分析能力 |\
    \ 期望高数据持久性，但数据访问频率低 | 通过专用 IB 通信，每机架 84.8TB | 支持 ACID 语义 |\n\n脚注 1 2 3\n\n# 案例研究：基准测试工具\n\
    \n基准测试工具有助于为具有特定需求的存储系统提供一些“标准”性能指标。本章展示了如何识别基准测试结果的访问模式。第一个工具是来自存储性能委员会（SPC）的`SPC-1C`。在捕获模式后，我开发了一个合成仿真器来匹配真实轨迹。第二个工具是来自\
    \ FutureMark 的`PCMark`。我阐述了如何使用盈亏分析来提高缓存算法效率。\n\n存储性能基准测试通过运行一系列标准测试和试验，借助一个工具或一组程序（无论是否支持特定硬件设备），来评估存储系统的相对性能。以下是一些常用于主动轨迹收集的基准测试工具：\n\
    \n-   **合成轨迹**。\n    -   用户可以指定队列深度、请求大小、传输速率、顺序等测试场景。这对于确定边界情况行为很有帮助。\n    -\
    \   示例：`IOMeter`、`VDBench`、`fio`、`IOzone`、`iorate`、`sqlio`、`diskspd`^(⁵⁶)\n\n\
    -   **基于应用的轨迹**。\n    -   用户可以选择具有预定义工作负载模式的特定应用程序。这对于说明真实世界案例很有帮助。\n    -   示例：`SysMark`、^(⁵⁷)\
    \ `PCMark`、`SPC`（存储性能委员会，例如`SPC-1`、`SPC-2`）、`TPC`（事务处理性能委员会，例如`TPC-A/B/C/D/H/W`）、^(⁵⁸)\
    \ `SPEC`（标准性能评估公司，例如`HPC/SFS/JVM/SDM`）、^(⁵⁹) `Jetstress`、^(⁶⁰) `COSbench`^(⁶¹)\n\
    \n-   **真实轨迹**。\n    -   用户可以直接输入真实世界的轨迹。当用户尝试在不同系统中测试类似应用程序时，这非常有用。\n    -  \
    \ 示例：`AnandTech Storage Bench`^(⁶²)\n\n表 5-1 对一些常用工具进行了简单比较，其中操作系统列中的字母 W、L 和\
    \ U 分别表示 Windows、Linux 和 Unix。\n\n**表 5-1** 一些常见基准测试工具的比较\n\n| | 块 | 文件 | Posix\
    \ | 操作系统 | 单机/客户端 | 开源 | 最新版本 |\n| --- | --- | --- | --- | --- | --- | --- | ---\
    \ |\n| `Iometer` | 是 | - | - | WLU | 单机/客户端 | 是 | 1.1.0/2014 |\n| `IOzone` | 是\
    \ | 是 | 是 | WLU | 单机 | 是 | 2006 |\n| `Bonnie++` | 是 | | | LU | 单机 | 是 (GPL2) |\
    \ 1.0.1 |\n| `dbench` | 是 | 是 | 是 | LU | 单机/客户端 | 是 (GNU) | 2008 |\n| `Filebench`\
    \ | 是 | 是 | 是 | LU | 单机 | 是 | 2011 |\n\n对于大规模系统，传统工具可能不够用（例如，缺乏测量指标）或不够方便（例如，没有集成用户界面）。因此，提出了一些专用工具，例如用于大数据基准测试的`HiBench`、^(⁶³)\
    \ `Berkely BDB`、^(⁶⁴) `BigDataBench`^(⁶⁵) 和 `BigBench`^(⁶⁶)，特别是针对 Hadoop/Spark\
    \ 系统。\n\n通用的基准测试流程如表 5-2 [52]所示。请注意，还存在其他分类方法。例如，三种类型分别命名为：底层系统操作中的微基准测试（例如，在现代集群上评估`HDFS`操作）、高级功能中的功能/组件基准测试（例如，`Terasort`、基本\
    \ SQL）、应用级基准测试（例如，针对给定应用场景的整体系统性能）。更多详情，请参考[41, 35]。\n\n**表 5-2** 通用基准测试的五个步骤\n\
    \n| 步骤 | 备注 |\n| --- | --- |\n| 选择合适的配置。 | 选择正确的基准测试类型，例如宏基准测试（对整个系统进行全面测试）、微基准测试（通过少量操作检查局部变更）或基于轨迹的基准测试。\
    \ |\n| 选择正确的环境。 | 一致的硬件和软件设置，以及一些因素，例如缓存状态、硬盘分区恒角速度、文件系统老化、非必要进程等。 |\n| 运行基准测试。\
    \ | 为可重复性进行相同运行，为准确性进行多轮运行（具有较小的标准差或较高的置信水平），为稳态提供足够的运行时间，通过合适的脚本自动运行。 |\n| 呈现结果。\
    \ | 具有较小置信区间且接近正态分布的统计结果。 |\n| 验证结果。 | 重现/确认结果，或与其他类似结果进行比较。 |\n\n## SPC-1C\n\n\
    存储性能委员会（SPC）提供了多个不同级别的基准测试工具。`SPC-1C` [53] 被设计为与供应商/平台无关，适用于广泛的存储组件产品，例如磁盘驱动器、主机总线适配器（HBA）、智能机箱以及诸如逻辑卷管理器之类的存储软件。\n"
- fmt: '### Workload Properties


    Two important concepts related to the workload intensity are the `BSU` (business
    scaling unit) and `ASU` (application storage unit). Each `BSU` is composed of
    three `ASU`s: `ASU1` for a data store with a weight of 45%, `ASU2` for a user
    store with 45%, and `ASU3` for a log with 10%, which totally corresponds to five
    IOPS per `ASU`.


    There are three types of access patterns: random (uniform distribution), sequential,
    and (random walking access) pattern. The details can be found in Table [5-3](#468166_1_En_5_Chapter.xhtml#Tab3),
    which is further summarized in Table [5-4](#468166_1_En_5_Chapter.xhtml#Tab4).
    Table [5-5](#468166_1_En_5_Chapter.xhtml#Tab5) indicates that the small size requests
    (8 and 16 blocks) are over 85%. Random walk is an important model of Markovian
    Chain. Table [5-6](#468166_1_En_5_Chapter.xhtml#Tab6) shows the main characteristics
    of this model.


    **Table 5-6** SPC-1C Random Walk Pattern


    | ASU | 1-1 | 1-2 | 1-3 | 1-4 | 2-1 | 2-2 | 2-3 | 3-1 | Sum |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | **Read** | 0 | 0.1405 | 0 | 0.105 | 0 | 0.021 | 0 | 0 | 0.2665 |

    | **Write** | 0 | 0.1405 | 0 | 0.105 | 0 | 0.049 | 0 | 0 | 0.2945 |


    **Table 5-5** Size Distribution


    | Size distribution | Probability | Size distribution | Probability |

    | --- | --- | --- | --- |

    | 8 | 0.7684 | 64 | 0.03088 |

    | 16 | 0.09264 | 128 | 0.03088 |

    | 32 | 0.0772 | | |


    **Table 5-4** SPC-1C Workload Ratio


    | Workload ratio | ASU1 | ASU2 | ASU3 |

    | --- | --- | --- | --- |

    | ASU i/total | 0.596 | 0.123 | 0.281 |

    | Read rand. in ASU i | 0.02936 | 0.0439 | 0 |

    | Read seq. in ASU i | 0.11745 | 0.28455 | 0 |

    | Read pattern in ASU i | 0.41191 | 0.17073 | 0 |

    | Write rand. in ASU i | 0.02936 | 0.10244 | 0 |

    | Write seq. in ASU i | 0 | 0 | 1 |

    | Write pattern in ASU i | 0.41191 | 0.39837 | 0 |


    **Table 5-3** Decomposition of SPC-1C Workload


    | ASU | 1-1 | 1-2 | 1-3 | 1-4 | 2-1 | 2-2 | 2-3 | 3-1 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | Intensity | 0.035 | 0.281 | 0.07 | 0.21 | 0.018 | 0.07 | 0.035 | 0.281 |

    | R/W | 0.5 | 0.5 | 1 | 0.5 | 0.3 | 0.3 | 1 | 0 |

    | Random | 1 | 0 | 0 | 0 | 1 | 0 | 0 | 0 |

    | Pattern | 0 | 1 | 0 | 1 | 0 | 1 | 0 | 0 |

    | Seq. | 0 | 0 | 1 | 0 | 0 | 0 | 1 | 1 |

    | Ratio | 1-1 | 1-2 | 1-3 | 1-4 | 2-1 | 2-2 | 2-3 | 3-1 |

    | R rand. | 0.0175 | 0 | 0 | 0 | 0.0054 | 0 | 0 | 0 |

    | R seq. | 0 | 0 | 0.07 | 0 | 0 | 0 | 0.035 | 0 |

    | R pattern | 0 | 0.1405 | 0 | 0.105 | 0 | 0.021 | 0 | 0 |

    | W rand. | 0.0175 | 0 | 0 | 0 | 0.0126 | 0 | 0 | 0 |

    | W seq. | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0.281 |

    | W pattern | 0 | 0.1405 | 0 | 0.105 | 0 | 0.049 | 0 | 0 |


    You can also find from Table [5-7](#468166_1_En_5_Chapter.xhtml#Tab7) that the
    write accesses and pattern access are dominate, which shows the importance of
    self-similarity and write cache in the benchmarking test.


    **Table 5-7** Basic IO Pattern Distribution


    | R/W | Ratio | Mode | Ratio |

    | --- | --- | --- | --- |

    | Read | 0.3944 | Random | 0.053 |

    | Write | 0.6056 | Sequential | 0.386 |

    | | | Pattern | 0.561 |


    ### Synthetic Trace


    With all these parameters, you can actually write your own synthetic trace generator.
    Thus more flexibility is provided to change any parameters you are interested
    in, such as disk size, `BSU`, simulation times, even the configuration of SPC-1C,
    like `ASU`, IOPS per `BSU`, distribution patterns, etc. For example, you can separate
    `ASU` from `BSU` to see the influence of different applications (data store, user
    store, and log./seq. write) instead of mixed workload, and change the distribution
    (e.g., inter-arrival time, request size, etc.) to fit more specific requirements.
    In addition, you may integrate the generator to another toolkit, such as `Disksim`
    [54] and `IOMeter`, as a synthetic generator component. Figures [5-1](#468166_1_En_5_Chapter.xhtml#Fig1),
    [5-2](#468166_1_En_5_Chapter.xhtml#Fig2), and [5-3](#468166_1_En_5_Chapter.xhtml#Fig3)
    show the comparison of a real trace captured by bus analyzer and the synthetic
    trace generated by the MATLAB-based tool in Appendix A.


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig3_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig3_HTML.jpg)


    **Figure 5-3** SPC-1C trace temporal distribution


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig2_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig2_HTML.jpg)


    **Figure 5-2** SPC-1C spatial distribution


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig1_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig1_HTML.jpg)


    **Figure 5-1** Inter-arrival time histogram


    From Figure [5-1](#468166_1_En_5_Chapter.xhtml#Fig1), you can see that the inter-arrival
    time is approximately an exponential distribution. As you know, the workload is
    mixed by eight different types of IO streams from three `ASU`s. Some high intensity-streams
    are visible in this spatial distribution of Figure [5-2](#468166_1_En_5_Chapter.xhtml#Fig2).
    Generally, the generated random R/W IO streams are consistent with the real workload,
    but the sequential ones are not very close in a light workload. One possible reason
    is the real workload was not generated by the exact parameters as those in the
    random walking model. In fact, it is hard to align the temporal distribution well.
    However, the result in Figure [5-3](#468166_1_En_5_Chapter.xhtml#Fig3) is fairly
    acceptable.'
