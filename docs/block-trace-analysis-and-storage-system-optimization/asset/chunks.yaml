- fmt: '# PCMark


    `PCMark Vantage` [55] is a widely used benchmark tool that is not limited to disk
    performance. It can provide application-level traces in eight categories, as shown
    in Table [5-8](#468166_1_En_5_Chapter.xhtml#Tab8), where a particular trace is
    decomposed into the number of write and read commands. Figure [5-4](#468166_1_En_5_Chapter.xhtml#Fig4)
    further shows the traces in the plot of `LBA` vs time.^([^(67)](#fn67))


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig4_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4** Eight applications in `PCMark`


    **Table 5-8** Eight Applications in `PCMark`


    | Order | Eight Apps | Total CMD | Write | Read |

    | --- | --- | --- | --- | --- |

    | 1 | Windows Defender | 6755 | 300 | 6455 |

    | 2 | Gaming | 11040 | 62 | 10978 |

    | 3 | Importing Pictures | 2806 | 4 | 2802 |

    | 4 | Vista Startup | 7418 | 1327 | 6091 |

    | 5 | Video Editing | 8204 | 3711 | 4493 |

    | 6 | Windows Media Center | 5011 | 3309 | 1702 |

    | 7 | Adding Music | 3336 | 1506 | 1830 |

    | 8 | Application Loading | 11155 | 2660 | 8495 |


    Now you can use this trace as an example for the read cache performance analysis.
    Some early research shows that the common differentiator between drives is read
    cache hit rate, with reasonable pre- and/or post-read data. For easy of notation,
    I define a prefetch action as both a pre-read and post-read request, as shown
    in Figure [5-5](#468166_1_En_5_Chapter.xhtml#Fig5). A common case is that some
    later read requests hit the data in the cache due to prefetch data, if the trace
    has a strong locality. Three types of prefetch accesses are commonly used: prefetch
    always (`PA`), prefetch on a miss (`PoM`), prefetch on a hit (`PoH`).


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig5_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig5_HTML.jpg)


    **Figure 5-5** Cache prefetch


    As mentioned, a gap between requests is allowed for near sequential streams. This
    gap can be a “hole” in the prefetch data, which is harmful to the overall performance.
    As shown in Figure [5-6](#468166_1_En_5_Chapter.xhtml#Fig6), there are three types
    of holes:


    ![../images/468166_1_En_5_Chapter/468166_1_En_5_Fig6_HTML.jpg](images/468166_1_En_5_Chapter/468166_1_En_5_Fig6_HTML.jpg)


    **Figure 5-6** Hole types


    *   **Post hole:** The first `LBA` of the incoming command has a distance (`>
    0`) within a threshold to the last `LBA` of the queued commands in the cache.

    *   **Pre hole:** The last `LBA` of the incoming command has a distance within
    a threshold to the first `LBA` of the queued commands in the cache.

    *   **Pre and post hole:** Both post and pre holes exist.


    To formally define the hole, consider the following two cases:


    *   **Constant:** If the range between two close regions in the cache is less
    than the constant `Hs` blocks, this range is viewed as a hole.

    *   **Adaptive:** The hole size is related to `DRAM` and `SSD` cache (most likely
    monotone increasing to the total/remaining


    ![$$ {H}_S=\Big\{{\displaystyle \begin{array}{cc}\underset{\_}{H_S,}&amp; \left\lfloor
    {a}_T{S}_T+{a}_R{S}_R\right\rfloor &lt;\underset{\_}{H_S}\\ {}{\overline{H}}_S,&amp;
    \left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor &gt;{\overline{H}}_S\\ {}\left\lfloor
    {a}_T{S}_T+{a}_R{S}_R\right\rfloor, &amp; Otherwise\end{array}} $$](images/468166_1_En_5_Chapter/468166_1_En_5_Chapter_TeX_IEq1.png)


    where `S[T]` and `S[R]` are the total and remaining cache size, respectively,
    and `a[T]` and `a[R]` are coefficients for `S[T]` and `S[R]`. An example for 64MB
    of `DRAM` cache is defined as


    ![$$ {H}_S=\Big\{{\displaystyle \begin{array}{cc}16,&amp; \left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor
    &lt;\underset{\_}{H_S}\\ {}256,&amp; \left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor
    &gt;{\overline{H}}_S\\ {}\left\lfloor {a}_T{S}_T+{a}_R{S}_R\right\rfloor, &amp;
    Otherwise\end{array}} $$](images/468166_1_En_5_Chapter/468166_1_En_5_Chapter_TeX_IEq2.png)


    where ![$$ {a}_T=\frac{1}{2^{13}},{a}_R=\frac{15}{2^{13}} $$](images/468166_1_En_5_Chapter/468166_1_En_5_Chapter_TeX_IEq3.png).
    The actual ![$$ \underset{\_}{H_s} $$](images/468166_1_En_5_Chapter/468166_1_En_5_Chapter_TeX_IEq4.png)
    and ![$$ {\overline{H}}_s $$](images/468166_1_En_5_Chapter/468166_1_En_5_Chapter_TeX_IEq5.png)
    are decided by trace, such as the median size of requests within a time window.
    More specifically, consider if the hole is in the same track/cylinder.


    A background task shall be implemented to monitor the `LBA` regions in cache and
    the hit density on these regions. This process is also tasked to look for gaps
    in regions of data with some level of hit density and to generate self-induced
    read commands to fill in these holes with data from main store.


    To connect the cache algorithm to the trace properties, use the following hypothesis:


    *   If two regions of a certain range within a time-frame have a high enough correlation,
    the gap between them is likely to be accessed.

    *   The pre-fetch should not affect the overall performance much, so the benefits
    gained from the additional cache hit ratio should be larger than the additional
    cost due to pre-fetch.

    *   The up-bound of the hole size to be fetched is decided by multiple factors,
    such as the total/remaining cache size, workload size, cache type, access time,
    etc.


    Now we have some questions to answer.


    *   What is the benefit from a hole filling policy? The key is to get the increased
    cache hit ratio (hit ratio with hole filling v.s. hit ratio without hole filling).

    *   What is the additional cost from a hole filling policy? The key is to find
    how many self-induced commands are generated to fill the hole. The time of the
    user workload must be considered.

    *   Since the similarity exists between hole filling and the prefetch policy,
    is it possible to merge hole filling to prefetch policy (integration)? The key
    is to find the overlapped cache hit between two policies; if the overlap rate
    is high, prefetch may include hole filling as part of it.

    *   When and where to apply the two policies (or integrated policy) with balanced
    benefit and cost? The key is to reduce the additional mechanical access cost and
    cache pollution.'
