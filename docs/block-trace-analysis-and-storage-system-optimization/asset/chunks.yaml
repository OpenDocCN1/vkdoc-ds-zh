  trans: '

    ### 系统级视角


    在本节中，我将简要分析上一节中观察到的块级随机 I/O 如何有助于更好地分析 Hadoop 集群的 I/O 模式。首先，让我们看一下从 HDFS 日志中收集的工作负载特征，如表
    8-9 所示。回顾前面提到的系统级分析；我捕获了数据生成和删除速率、作业创建速率及其特征等，而底层 I/O 对我们来说是模糊的。可以说，这正是高级框架应有的行为方式——完全或大部分与底层硬件设备隔离。然而，那些必须维护完整运维栈的人必须了解整个系统，而不仅仅是用户级框架。下面，我将从三个方面分析随机性：Hadoop
    框架、MapReduce 策略和 HDFS 机制^(⁷³)。


    **表 8-9** 从 HDFS 日志收集的基本信息


    | 名称 | 持续时间 | 总 I/O 请求数 | 平均 I/O 大小(MB) |

    | --- | --- | --- | --- |

    | | 平均 | 最大 | 最小 | 总计 | 读取 | 写入 | |

    | `wdc-x1` | 68 天 | 0.627 | 5.476 | 0.125 | 60.96 | 3.14 | 99.75 | |

    | `wdc-x2` | 98 天 | 0.396 | 5.661 | 0.107 | 47.83 | 3.09 | 93.2 | |

    | 读写比 | IOPS 10⁵ | 吞吐量 (MB/S) |

    | 平均 | 最大 | 最小 | 总计 | 读取 | 写入 | 总计 | 读取 | 写入 |

    | 0.0348 | 0.125 | 0.0054 | 0.726 | 0.536 | 0.19 | 18.48 | 0.632 | 17.85 |

    | 0.0383 | 0.33 | 0.007 | 0.458 | 0.325 | 0.133 | 12.11 | 0.442 | 11.67 |


    请注意，Hadoop 框架内的所有守护进程在一天中都会记录其运行时的日志。根据配置，这些日志可以写入 HDFS 或本地文件系统。如果日志写入本地文件系统，它们会产生一些对
    HDD 的随机 I/O。位于 Hadoop 核心框架之上的其他框架守护进程可能会在设备级别产生更多随机 I/O。HBase 也有来自其区域服务器的类似日志需要写入。HBase
    是为实时数据处理而创建的，它会生成小型 MapReduce 作业，这些作业可能访问少量数据，从而在 HDFS 实例中引起随机读取 I/O。像 Hive 和其他位于
    Hadoop 之上的 KV 存储这样的框架，具有类似的日志记录结构，可能会在设备级别导致随机 I/O 放大。


    基于 Java 的（Apache）MapReduce 在 MapReduce 作业期间必须将临时中间文件写入磁盘，其中一些文件具有重复的进程 ID（PID），而另一些则具有单一或极少使用的
    PID。这些中间文件可以转储到 HDFS 中的位置（如果可能，HDFS 会尝试序列化 I/O）或本地文件系统，后者将是一个随机 I/O 事件。这可以通过调整参数`mapreduce.task.tmp.dir`进行配置。


    在查阅 Hadoop XML 配置文件后，我注意到一件事：所有 HDFS 和 MapReduce 工作负载的临时/中间空间都被配置为将其输出数据存储到 HDFS
    数据驱动器。由于 Hadoop 框架是用 Java 编写的，它必须应对 Java 虚拟机（JVM）的特性，这意味着内存地址在不同 JVM 之间没有意义。因此，当一个
    MapReduce 任务将数据传递给另一个 MapReduce 任务时，它首先将数据写入一个临时文件，供另一个 JVM 任务读取。此外，当启动一个 MapReduce
    作业时，它必须将配置参数和可执行 jar 文件发送给`TaskTracker`，以便它们能够正确地生成 map 和 reduce 任务。这些数据也被存储到配置的本地临时空间中。


    将这种 I/O 与集群每天运行近 5500 个 MapReduce 作业（其中许多是小型任务计数作业，因为用户执行了 20%的 HBase 分析）这一观察结果结合起来，这些
    HDD 上产生的随机 I/O 量变得非常大。然而，这种 I/O 是可以缓解的，并且并非完全导致块级跟踪中观察到的高水平随机 I/O 的原因。HDFS 本身也对这些跟踪中观察到的随机
    I/O 量有所贡献。


    从如图 8-16 所示的系统日志中，您可以看到系统每天创建和删除的数据块数量相当高。每次 HDFS 向文件系统提交一个数据块时，它还会创建一个元数据文件。这个元数据文件的大小与提交到本地文件系统的
    HDFS 数据块大小成正比，因此一个 128MB 的数据块将对应创建一个约 1.2MB 的元数据文件，而较小的数据块将对应较小的元数据文件。因此，对于所观察的工作负载，由于
    HDFS 上每天生成数万个新数据块，会产生大量的小型随机 I/O。然而，与 MapReduce 框架中可配置临时文件存储位置的随机 I/O 不同，这些 HDFS
    元数据文件的存储位置不是一个可配置的属性，因此不能委托给另一类存储或存储位置。在考虑较新的 HDD 技术时，其中随机 I/O（尤其是随机写入）会极大地影响性能，理解像这样的工作负载特征至关重要。如果没有对工作负载进行设备级分析，这些特征就不会被如此清晰地识别出来。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig16_HTML.jpg](img/468166_1_En_8_Fig16_HTML.jpg)


    **图 8-16** 来自 HDFS 日志的基本曲线

    '
- fmt: '# Some Further Discussions


    In this chapter, I presented the block-level workload characteristics of the Hadoop
    cluster by considering some specific metrics. The analysis techniques presented
    can help others understand the performance and drive characteristics of Hadoop
    in their production environments. Collected by `blktrace`, I conducted a comprehensive
    analysis of these logs which identified new workload patterns with some unexpected
    behaviors. I showed that, while sequential and near-sequential requests represent
    the majority of the IO workload, a non-trivial amount of random IO requests exist
    in the Hadoop workloads. Additionally, the write update ratio on drives is not
    very high, which indicates that a small write amplification can occur if an out-of-place
    write policy is applied. Also note that the ROW ratio is small, which means WORM
    does not generally hold for the cluster’s workload. All these findings imply a
    relatively high spatial locality and lower-than-expected temporal locality, which
    show that Hadoop is generally a suitable application for SMR drives. However,
    further improvements in both Hadoop and drive sides are required.


    Looking critically at the configuration of a Hadoop system, it is possible to
    fine-tune and minimize some, but not all, of the observed random IO. Factors that
    add to this random IO are several types of framework logging, intermediary files
    generated by MapReduce and HBase workloads, and metadata files of HDFS chunks.
    The verbosity of Hadoop daemon log files can be turned down to generate less data,
    and they along with temporary MapReduce output can be written to a storage location
    which will not impact HDFS chunk IO operations. Among these can be the HDFS itself
    (rather than local storage), which will attempt to make the IO more sequential,
    or on another physical/logical block device more suited to random block IO (while
    maintaining data locality). Some basic curves derived from HDFS logs are shown
    in Figure [8-16](#468166_1_En_8_Chapter.xhtml#Fig16).


    However, the final piece of the observed random IO is a consequence of HDFS write/update
    mechanism and cannot be easily mitigated because it currently must reside with
    the committed HDFS chunks on the HDFS data drives. The small IO caused by chunk
    metadata must then be serviced by a capacity block storage device which can either
    understand how to transform these small random IO into larger sequential access
    patterns, or a device that is simply designed to handle random IO. Without a device-level
    view, it is possible that this overhead would be dismissed as a problem elsewhere
    in the system rather than at the HDD device level, where some of these issues
    are very simple to correct, given the proper insight. For instance, a large DRAM
    buffer will be very useful for these scenarios with random read accesses, and
    non-volatile memory (e.g., NAND and conventional zone) for these random write
    accesses.


    Hence, it is reasonable to study an integration of HDFS and the local files systems
    with consideration of device properties, such as a design in a global view so
    that there is no “misunderstanding” of the local metadata to the sequential write
    in HDFS. And the metadata and the “non-critical” intermediate/temporary data are
    assigned to proper disk location. Therefore, HDFS could take the responsibility
    of file/block accesses in DataNode, which may make the drive operation more efficient.
    The metadata location in the device shall also be carefully designed.


    In addition, the drive-level cache and system-level cache may be unified with
    the consideration of the mechanism of Java, such that some temporary data may
    be absorbed by the unified cache/buffer instead of disk mechanical accesses. This
    unification could be difficult due to the current HDFS’s simple cache design and
    lack of direct interface between JVM and drives. However, it is possible for drive
    manufacturers to provide such an application-oriented interface for communication.


    Furthermore, a certain intelligence might be useful for the drive to understand
    the nature of the access (e.g., random or sequential, access dependency), such
    that the drive can immediately switch to the optimal algorithm/behavior for better
    performance. An application-level hinting scheme with interaction between host
    and drive or a self-learning algorithm inside drive can be helpful.


    In conclusion, the device level analysis of the in-house Hadoop cluster has provided
    new insights into how Hadoop interacts with the underlying file system and handles
    its lower-level IO. These new insights motivate me to continue studying how workload
    characteristics of big data frameworks and application tuning could help the performance
    of storage devices in the current data driven climate which we live in. This study
    is also applicable to Spark, an in-memory MapReduce system roughly. For example,
    a detailed workload analysis can provide some insights of the SCM application
    for Spark systems, which will benefit a cost-efficient design of hybrid SCM-DRAM
    structures.


    Footnotes [1](#468166_1_En_8_Chapter.xhtml#Fn1_source) [2](#468166_1_En_8_Chapter.xhtml#Fn2_source)
    [3](#468166_1_En_8_Chapter.xhtml#Fn3_source) [4](#468166_1_En_8_Chapter.xhtml#Fn4_source)'
