- fmt: "### Access Isolation\n\nYou saw in the previous chapter that SPC-1C has a\
    \ large portion of local accesses. This property brings the possibility that some\
    \ data can be cached into DRAM or SSD and be accessed quickly later. Then the\
    \ second question is “how many accesses are actually directed to DRAM or SSD?”\
    \ It is generally a difficult task. However, as the access times of DRAM, SSD,\
    \ and HDD are significantly different, you may isolate the possible commands in\
    \ different places roughly. The basic idea is to observe the behaviors of the\
    \ different accesses and then apply data classification and pattern recognition\
    \ methods to find the access pattern, and do repeated random read tests to finally\
    \ find the turning points. Although the procedure is similar to the previous case,\
    \ you need to change the number of requests to SSHD in this case:\n\n1. Send 100/200/256/257/etc.\
    \ pieces of 8K requests to SSHD, repeat 20-100 times for each number, and refine\
    \ the number of commands to be sent according to the access pattern.\n\n2. Suppose\
    \ the turn point is `X`. Send `X` random read commands with size 16K, 32K, ...,\
    \ and 1024K to SSHD and find the cluster size according to the turning point.\n\
    \nTo verify if the repeat number is high enough, check the steady states of response\
    \ time. Figure [6-6](#468166_1_En_6_Chapter.xhtml#Fig6) provides an example where\
    \ 100 rounds are run. You can see that since the third round, the average value\
    \ and standard derivatives of response times are almost constant. Thus 10 times\
    \ of repeats should be enough in this case.\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig6_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig6_HTML.jpg)\n\
    \n**Figure 6-6**  \nSteady state of response time\n\nFigure [6-7](#468166_1_En_6_Chapter.xhtml#Fig7)\
    \ shows a case where 100 random read requests with 8KB size were sent to SSHD\
    \ 20 times. In the first round, all reads went to media. After several rounds,\
    \ the read requests become hot and eventually all cached in DRAM. Slowly increase\
    \ the number of requests to check how many requests the DRAM read cache can hold.\n\
    \n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig7_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig7_HTML.jpg)\n\
    \n**Figure 6-7**  \n100 8K random reads, repeated 20 times\n\nFigure [6-8](#468166_1_En_6_Chapter.xhtml#Fig8)\
    \ illustrates the results for 250 requests repeatedly. You can see that DRAM cache\
    \ can fully hold at least 250 segments. However, when you slightly increase it\
    \ to 257, destage starts. When further increase to 260, DRAM destage to SSD happens\
    \ obviously at a relatively high speed, which is illustrated in Figure [6-9](#468166_1_En_6_Chapter.xhtml#Fig9).\
    \ The destage has a certain adaptive steps, so when the hit number (access frequency)\
    \ of the data is increased, destage becomes more frequent.\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig9_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig9_HTML.jpg)\n\
    \n**Figure 6-9**  \n260 8K random reads, repeated 100 times\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig8_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig8_HTML.jpg)\n\
    \n**Figure 6-8**  \n250 8K random reads, repeated 100 times\n\nThus, you may guess\
    \ that 256 could be the maximum read segment number, as no destage happens if\
    \ this maximum segment number is not exceeded. Note that you can find the destage\
    \ pattern via different time intervals and sizes.\n\nI leave an issue on request\
    \ access identification on devices here. Take a look at Figure [6-10](#468166_1_En_6_Chapter.xhtml#Fig10),\
    \ where repeated 260 8KB read requests were sent to SSHD 100 times. As the number\
    \ is over DRAM’s capacity, some requests will go to SSD. The response time of\
    \ the 1st, 3rd, 14th, 20th and 50th runs is shown. You can see that the very first\
    \ run all went to disk. Starting at the second round, some went to DRAM and some\
    \ to media. In the 20th round, the accesses to DRAM, SSD, and media all existed.\
    \ However, around 50 rounds, most requests went to DRAM and SSD. In fact, you\
    \ can see a clear gap of response time for these read requests. Basically, you\
    \ may say that those below 0.1ms are DRAM accesses, and those above 0.2ms are\
    \ most from SSD. Now you can get the statistical values for the response time\
    \ of SSD and DRAM in an estimated sense, as shown in Table [6-4](#468166_1_En_6_Chapter.xhtml#Tab4).\n\
    \n**Table 6-4**  \nStatistics on Response Time (Based on 40-90 Rounds)\n\n| 260\
    \ | Average | CCT | qCCT | TtoD |\n| --- | --- | --- | --- | --- |\n| Overall\
    \ | Mean | 0.227 | 0.227 | 0.212 |\n|   | Std. | 0.096 | 0.096 | 0.096 |\n| SSD\
    \ | Mean | 0.279 | 0.279 | 0.264 |\n|   | Std. | 0.031 | 0.031 | 0.032 |\n| DRAM\
    \ | Mean | 0.063 | 0.063 | 0.048 |\n|   | Std. | 0.001 | 0.001 | 0.001 |\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig10_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig10_HTML.jpg)\n\
    \n**Figure 6-10**  \nRead response time pattern over repeated rounds\n\n## SMR\n\
    \nThis section will discuss the main characteristics of SMR [4, 5] and the interaction\
    \ between these characteristics and particular workloads. The industry has two\
    \ approaches for SMR generally:\n\n* The drive manages all data accesses, and\
    \ data management is complicated similar to the FTL (flash translation layer)\
    \ of SSD, so the management of metadata, GC (garbage collection), over-provisioning,\
    \ variable performance, etc, is all inside the drive. However, there are no host-side\
    \ changes, so the drive is used as a normal one. Currently, all major SMR drives\
    \ available in the market fall in this category.\n\n* The host manages most data-related\
    \ accesses via a SMR-specific file system similar to flash file system. Data management\
    \ is complicated but can leverage mature file systems that write sequentially.\
    \ A few examples are SFS [58], HiSMRfs [59], and Shingledfs [5]. Although mixed\
    \ drive-host management is also possible, it is really rare.\n\nMany particular\
    \ design issues are considered for SMR drives, such as data layout management\
    \ (layout, data placement, defragmentation, GC, pointer to bands), mixed zones\
    \ (combine shingled and unshingled part in same disk), SMR algorithms, and structure\
    \ for specific applications, etc. Table [6-5](#468166_1_En_6_Chapter.xhtml#Tab5)\
    \ lists some main expected workload characteristics for SMR so that those applications\
    \ with designed metrics can work perfectly in SMR drives.\n\n**Table 6-5**  \n\
    SMR Characteristics vs. Workload Metrics\n\n| SMR char | SMR expectation | Workload\
    \ metrics | SMR impact |\n| --- | --- | --- | --- |\n| Sequential write | Good\
    \ for large size sequential write requests | Average write request size and distribution,\
    \ Seek distance (LBA), Sequential stream and near-sequential stream | The larger\
    \ size, the better; The smaller seek distance, the more sequential; The more streams,\
    \ the more sequential |\n| Write once read-many | Good for less updates and more\
    \ reads | Read/write ratio, Read on write (ROW) hit ratio, Write update ratio\
    \ | The higher read/write ratio (ROW ratio), the better; The smaller the write\
    \ update ratio, the better |\n| Garbage collection (GC) | Smaller write amplification\
    \ and less GC | Device utilization, device idle time distribution, queue length,\
    \ IOPS, throughput, Frequented/timed/stacked write update ratio (WUR), Write on\
    \ write (WOW) hit distribution and ratio | Long and frequent idle time for GC;\
    \ Low write update ratio indicates that less GC is required |\n| Sequential read\
    \ to random write | Less read performance impact due to indirect mapping, such\
    \ as sequential LBA read requests in random physical address | Read on write (ROW)\
    \ hit/size distribution and ratio | The higher the small (large) read to small\
    \ (large) write ratio, the better |\n| In-place or out-of-place update | Frequent\
    \ and recent updates need random access zone (RAZ)/SSD/large DRAM buffer to hold\
    \ write data | Stacked write update ratio | The higher ratio in shorter stack,\
    \ the more necessary to have an in-place update buffer |\n\nFootnotes [1](#468166_1_En_6_Chapter.xhtml#Fn1_source)"
  raw: '### Access Isolation


    You saw in the previous chapter that SPC-1C has a large portion of local accesses. This
    property brings the possibility that some data can be cached into DRAM or SSD
    and be accessed quickly later. Then the second question is “*how many accesses
    are actually directed to DRAM or SSD?*” It is generally a difficult task. However,
    as the access times of DRAM, SSD, and HDD are significantly different, you may
    isolate the possible commands in different places roughly. The basic idea is to
    observe the behaviors of the different accesses and then apply data classification
    and pattern recognition methods to find the access pattern, and do repeated random
    read tests to finally find the turning points. Although the procedure is similar
    to the previous case, you need to change the number of requests to SSHD in this
    case:


    1.  Send 100/200/256/257/etc. pieces of 8K requests to SSHD, repeat 20-100 times
    for each number, and refine the number of commands to be sent according to the
    access pattern.


    2.  Suppose the turn point is X. Send X random read commands with size 16K,32K,...,
    and 1024K to SSHD and find the cluster size according to the turning point.


    To verify if the repeat number is high enough, check the steady states of response
    time. Figure [6-6](#468166_1_En_6_Chapter.xhtml#Fig6) provides an example where
    100 rounds are run. You can see that since the third round, the average value
    and standard derivatives of response times are almost constant. Thus 10 times
    of repeats should be enough in this case.


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig6_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Steady state of response time


    Figure [6-7](#468166_1_En_6_Chapter.xhtml#Fig7) shows a case where 100 random
    read requests with 8KB size were sent to SSHD 20 times. In the first round, all
    reads went to media. After several rounds, the read requests become hot and eventually
    all cached in DRAM. Slowly increase the number of requests to check how many requests
    the DRAM read cache can hold.


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig7_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    100 8K random reads, repeated 20 times


    Figure [6-8](#468166_1_En_6_Chapter.xhtml#Fig8) illustrates the results for 250
    requests repeatedly. You can see that DRAM cache can fully hold at least 250 segments.
    However, when you slightly increase it to 257, destage starts. When further increase
    to 260, DRAM destage to SSD happens obviously at a relatively high speed, which
    is illustrated in Figure [6-9](#468166_1_En_6_Chapter.xhtml#Fig9). The destage
    has a certain adaptive steps, so when the hit number (access frequency) of the
    data is increased, destage becomes more frequent.


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig9_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    260 8K random reads, repeated 100 times


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig8_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    250 8K random reads, repeated 100 times


    Thus, you may guess that 256 could be the maximum read segment number, as no destage
    happens if this maximum segment number is not exceeded. Note that you can find
    the destage pattern via different time intervals and sizes.


    I leave an issue on request access identification on devices here. Take a look
    at Figure [6-10](#468166_1_En_6_Chapter.xhtml#Fig10), where repeated 260 8KB read
    requests were sent to SSHD 100 times. As the number is over DRAM’s capacity, some
    requests will go to SSD. The response time of the 1st, 3rd, 14th, 20th and 50th
    runs is shown. You can see that the very first run all went to disk. Starting
    at the second round, some went to DRAM and some to media. In the 20th round, the
    accesses to DRAM, SSD, and media all existed. However, around 50 rounds, most
    requests went to DRAM and SSD. In fact, you can see a clear gap of response time
    for these read requests. Basically, you may say that those below 0.1ms are DRAM
    accesses, and those above 0.2ms are most from SSD. Now you can get the statistical
    values for the response time of SSD and DRAM in an estimated sense, as shown in
    Table [6-4](#468166_1_En_6_Chapter.xhtml#Tab4).


    Table 6-4


    Statistics on Response Time (Based on 40-90 Rounds)


    | 260 | Average | CCT | qCCT | TtoD |

    | --- | --- | --- | --- | --- |

    | Overall | Mean | 0.227 | 0.227 | 0.212 |

    |   | Std. | 0.096 | 0.096 | 0.096 |

    | SSD | Mean | 0.279 | 0.279 | 0.264 |

    |   | Std. | 0.031 | 0.031 | 0.032 |

    | DRAM | Mean | 0.063 | 0.063 | 0.048 |

    |   | Std. | 0.001 | 0.001 | 0.001 |


    ![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig10_HTML.jpg](images/468166_1_En_6_Chapter/468166_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Read response time pattern over repeated rounds


    ## SMR


    This section will discuss the main characteristics of SMR [4, 5] and the interaction
    between these characteristics and particular workloads. The industry has two approaches
    for SMR generally:


    *   The drive manages all data accesses, and data management is complicated similar
    to the FTL (flash translation layer) of SSD, so the management of metadata, GC
    (garbage collection), over-provisioning, variable performance, etc, is all inside
    the drive. However, there are no host-side changes, so the drive is used as a
    normal one. Currently, all major SMR drives available in the market fall in this
    category.


    *   The host manages most data-related accesses via a SMR-specific file system
    similar to flash file system. Data management is complicated but can leverage
    mature file systems that write sequentially. A few examples are SFS [58], HiSMRfs
    [59], and Shingledfs [5]. Although mixed drive-host management is also possible,
    it is really rare.


    Many particular design issues are considered for SMR drives, such as data layout
    management (layout, data placement, defragmentation, GC, pointer to bands), mixed
    zones (combine shingled and unshingled part in same disk), SMR algorithms, and
    structure for specific applications, etc. Table [6-5](#468166_1_En_6_Chapter.xhtml#Tab5)
    lists some main expected workload characteristics for SMR so that those applications
    with designed metrics can work perfectly in SMR drives.


    Table 6-5


    SMR Characteristics vs. Workload Metrics


    | SMR char | SMR expectation | Workload metrics | SMR impact |

    | --- | --- | --- | --- |

    | Sequential write | Good for large size sequential write requests | Average write
    request size and distributionSeek distance (LBA)Sequential stream and near-sequential
    stream | The larger size, the betterThe smaller seek distance, the more sequentialThe
    more streams, the more sequential |

    | Write once read-many | Good for less updates and more reads | Read/write ratioRead
    on write (ROW) hit ratioWrite update ratio | The higher read/write ratio (ROW
    ratio), the betterThe smaller the write update ratio, the better |

    | Garbage collection (GC) | Smaller write amplification and less GC | Device utilization,
    device idle time distribution, queue lengthIOPS, throughputFrequented/timed/stacked
    write update ratio (WUR)Write on write (WOW) hit distribution and ratio | Long
    and frequent idle time for GCLow write update ratio indicates that less GC is
    required |

    | Sequential read to random write | Less read performance impact due to indirect
    mapping, such as sequential LBA read requests in random physical address | Read
    on write (ROW) hit/size distribution and ratio | The higher the small (large)
    read to small (large) write ratio, the better |

    | In-place or out-of-place update | Frequent and recent updates need random access
    zone (RAZ)/SSD/large DRAM buffer to hold write data | Stacked write update ratio
    | The higher ratio in shorter stack, the more necessary to have an in-place update
    buffer |


    Footnotes [1](#468166_1_En_6_Chapter.xhtml#Fn1_source)'
  trans: "\n### 访问隔离\n\n在前一章中，您已经了解到 SPC-1C 有大量的本地访问。这一特性使得某些数据可以被缓存到 DRAM 或 SSD 中，并在之后被快速访问成为可能。那么第二个问题是：“实际上有多少访问是直接指向\
    \ DRAM 或 SSD 的？”这通常是一项困难的任务。然而，由于 DRAM、SSD 和 HDD 的访问时间差异显著，您可以粗略地将可能的命令隔离到不同的位置。基本思路是观察不同访问的行为，然后应用数据分类和模式识别方法来发现访问模式，并进行重复的随机读取测试，最终找到转折点。虽然流程与之前的案例类似，但在本例中，您需要更改发送到\
    \ SSHD 的请求数量：\n\n1. 向 SSHD 发送 100/200/256/257 等数量的 8K 请求，每个数量重复 20-100 次，并根据访问模式调整要发送的命令数量。\n\
    \n2. 假设转折点为 `X`。向 SSHD 发送 `X` 个大小为 16K、32K、……、1024K 的随机读取命令，并根据转折点找出簇大小。\n\n为了验证重复次数是否足够高，请检查响应时间的稳定状态。图\
    \ 6-6 提供了一个运行了 100 轮的示例。您可以看到，从第三轮开始，响应时间的平均值和标准差几乎保持不变。因此，在这种情况下，重复 10 次应该就足够了。\n\
    \n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig6_HTML.jpg](img/468166_1_En_6_Fig6_HTML.jpg)\n\
    \n**图 6-6**  \n响应时间的稳定状态\n\n图 6-7 展示了一个案例，其中向 SSHD 发送了 100 个 8KB 大小的随机读取请求，重复了\
    \ 20 次。在第一轮中，所有读取都指向介质。经过几轮后，读取请求变得“热”起来，并最终全部缓存在 DRAM 中。缓慢增加请求数量，以检查 DRAM 读取缓存能够容纳多少个请求。\n\
    \n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig7_HTML.jpg](img/468166_1_En_6_Fig7_HTML.jpg)\n\
    \n**图 6-7**  \n100 个 8K 随机读取，重复 20 次\n\n图 6-8 展示了 250 个请求重复执行的结果。您可以看到 DRAM 缓存完全可以容纳至少\
    \ 250 个段。然而，当您将其略微增加到 257 时，降级写入（destage）就开始了。当进一步增加到 260 时，DRAM 到 SSD 的降级写入会以相对较高的速度明显发生，如图\
    \ 6-9 所示。降级写入具有一定的自适应步骤，因此当数据的命中次数（访问频率）增加时，降级写入变得更加频繁。\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig9_HTML.jpg](img/468166_1_En_6_Fig9_HTML.jpg)\n\
    \n**图 6-9**  \n260 个 8K 随机读取，重复 100 次\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig8_HTML.jpg](img/468166_1_En_6_Fig8_HTML.jpg)\n\
    \n**图 6-8**  \n250 个 8K 随机读取，重复 100 次\n\n因此，您可能会猜测 256 可能是最大的读取段数量，因为只要不超过这个最大段数，就不会发生降级写入。请注意，您可以通过不同的时间间隔和大小来发现降级写入模式。\n\
    \n这里我留下一个关于设备上请求访问识别的问题。请看图 6-10，其中向 SSHD 发送了 260 个 8KB 读取请求，重复了 100 次。由于数量超过了\
    \ DRAM 的容量，一些请求将指向 SSD。图中显示了第 1、3、14、20 和 50 次运行的响应时间。您可以看到，第一次运行时所有请求都指向了磁盘。从第二轮开始，一些请求指向了\
    \ DRAM，一些指向了介质。在第 20 轮中，指向 DRAM、SSD 和介质的访问都存在。然而，在大约 50 轮时，大多数请求都指向了 DRAM 和 SSD。事实上，您可以看到这些读取请求的响应时间存在明显的差距。基本上，您可以认为那些低于\
    \ 0.1ms 的是 DRAM 访问，而高于 0.2ms 的大部分来自 SSD。现在，您可以获得 SSD 和 DRAM 响应时间的统计值（在估算意义上），如表\
    \ 6-4 所示。\n\n**表 6-4**  \n响应时间统计（基于第 40-90 轮）\n\n| 260 | 平均值 | CCT | qCCT | TtoD\
    \ |\n| --- | --- | --- | --- | --- |\n| 总体 | 均值 | 0.227 | 0.227 | 0.212 |\n| \
    \  | 标准差 | 0.096 | 0.096 | 0.096 |\n| SSD | 均值 | 0.279 | 0.279 | 0.264 |\n|  \
    \ | 标准差 | 0.031 | 0.031 | 0.032 |\n| DRAM | 均值 | 0.063 | 0.063 | 0.048 |\n|  \
    \ | 标准差 | 0.001 | 0.001 | 0.001 |\n\n![../images/468166_1_En_6_Chapter/468166_1_En_6_Fig10_HTML.jpg](img/468166_1_En_6_Fig10_HTML.jpg)\n\
    \n**图 6-10**  \n多轮重复下的读取响应时间模式\n\n## SMR\n\n本节将讨论 SMR [4, 5] 的主要特性以及这些特性与特定工作负载之间的相互作用。业界通常有两种处理\
    \ SMR 的方法：\n\n* 驱动器管理所有数据访问，数据管理复杂，类似于 SSD 的 FTL（闪存转换层），因此元数据管理、GC（垃圾回收）、预留空间、性能变化等都在驱动器内部进行。但是，主机端无需更改，因此该驱动器可作为普通驱动器使用。目前，市场上所有主要的\
    \ SMR 驱动器都属于这一类。\n\n* 主机通过类似闪存文件系统的 SMR 专用文件系统来管理大多数与数据相关的访问。数据管理很复杂，但可以利用成熟的、顺序写入的文件系统。几个例子包括\
    \ SFS [58]、HiSMRfs [59] 和 Shingledfs [5]。虽然混合驱动器-主机管理也是可能的，但非常罕见。\n\nSMR 驱动器考虑了许多特定的设计问题，例如数据布局管理（布局、数据放置、碎片整理、GC、指向\
    \ band 的指针）、混合区域（在同一磁盘中组合叠瓦式和非叠瓦式部分）、SMR 算法以及针对特定应用的结构等。表 6-5 列出了 SMR 的一些主要预期工作负载特性，以便那些具有设计指标的应用能够在\
    \ SMR 驱动器上完美运行。\n\n**表 6-5**  \nSMR 特性与工作负载指标对比\n\n| SMR 特性 | SMR 预期 | 工作负载指标\
    \ | SMR 影响 |\n| --- | --- | --- | --- |\n| 顺序写入 | 适用于大尺寸顺序写入请求 | 平均写入请求大小和分布、寻道距离（LBA）、顺序流和近顺序流\
    \ | 尺寸越大越好；寻道距离越小，顺序性越强；流越多，顺序性越强 |\n| 一次写入多次读取 | 适用于较少更新和较多读取 | 读/写比率、读时写（ROW）命中率、写更新比率\
    \ | 读/写比率（ROW 比率）越高越好；写更新比率越小越好 |\n| 垃圾回收（GC） | 较小的写放大和较少的 GC | 设备利用率、设备空闲时间分布、队列长度、IOPS、吞吐量、频繁/定时/堆叠的写更新比率（WUR）、写时写（WOW）命中分布和比率\
    \ | 长时间且频繁的空闲时间用于 GC；低写更新比率表明需要的 GC 较少 |\n| 顺序读取到随机写入 | 由于间接映射（例如，随机物理地址中的顺序 LBA\
    \ 读取请求）导致的读取性能影响较小 | 读时写（ROW）命中/大小分布和比率 | 小（大）读取与小（大）写入的比率越高越好 |\n| 原地或非原地更新 |\
    \ 频繁和最近的更新需要随机访问区域（RAZ）/SSD/大容量 DRAM 缓冲区来保存写入数据 | 堆叠写更新比率 | 在较短堆叠中比率越高，就越需要原地更新缓冲区\
    \ |\n\n脚注 1\n"
- fmt: '# 7. Case Study: RAID


    RAID is one of the most widely applied data-protection strategies in the world
    [23, 60, 61, 62, 63]. It has unique features compared with single disk access,
    such as file synchronization, recovery, etc. Therefore, it leads to some unique
    IO patterns compared with others. This chapter analyzes two examples based on
    RAID 5 from two application scenarios. Large differences are observed between
    two traces. This chapter also analyzes whether the workloads are suitable for
    SMR drives. In addition, some suggestions are provided in order to improve system
    performance.


    The concept of a RAID was introduced to harness the potential of commodity hard
    drives in 1987. Patterson et al. [64] officially established the RAID taxonomy
    in 1988. RAID overcomes the capacity limitations of commodity disks by exposing
    an array of such low-capacity disks as a virtual single large expensive disks
    (SLED).


    RAID technology usually requires the distribution of data across a number of disks
    via the data stripes. A stripe represents the smallest unit of protection in an
    array, thus any lost data within a stripe can be recovered using only the surviving
    data within that stripe. In early days, since clients were connected to the RAID
    via a serial access channel, parallel access by multiple clients was not explicitly
    supported. However, with many advanced queuing schedulers developed, parallelism
    now is widely applied in RAID systems in order to fully utilize the advantage
    of multiple disks.


    There are some common performance issues within RAID systems [20, 62, 63], such
    as the small write problem, the synchronization problem, performance loss during
    downgrade (recovery and reconstruction), and more.


    The small write problem exists in many critical applications, such as online transaction
    processing (OLTP) systems. Those applications usually contain many read-modify-write
    (RMW) accesses. This leads to some issues for a RAID system. First, a write in
    a striped array requires reads of both data and parity blocks, and computation
    of a new parity, before the writing of both new data and new parity, which is
    four times more accesses than for a single disk. Second, these small accesses
    only alter a few blocks within a specific stripe, yet the parity disk for the
    entire stripe is unavailable during the update. This dramatically downgrades the
    performance of the array by reducing the possible parallelism.


    The synchronization problem is due to the data integrity requirements; only when
    all drives of one stripe array are completed, the system returns a completion
    signal. Since some disks may finish access earlier than others, the faster disks
    have to wait for the slow ones. This requirement may be relieved in some conditions,
    such as non-critical applications, protected DRAM, etc. During recovery, due to
    background recovery access, the foreground user requests may be largely impacted
    [65].


    Similar problems are also applicable to the disk arrays using erasure code (EC).
    And in some cases, the problem may be more critical due to the higher complexity
    of EC than that of traditional RAID.


    ## Workload Analysis


    You will study two RAID 5 examples from two different vendors under video surveillance
    applications. The system settings will be given first, followed by the analysis
    of two different traces: read-dominant and write-dominant cases.


    ### System Settings


    In the first example, there are 10 7200RPM HDDs each of 4TB. 24 write streams
    and 6 read streams are imposed to this system. The second example has 36 similar
    HDDs with 90 video channels. The trace length is 620 and 110 seconds, respectively.
    Some basic metrics are listed in Tables [7-1](#468166_1_En_7_Chapter.xhtml#Tab1)
    and [7-2](#468166_1_En_7_Chapter.xhtml#Tab2).


    **Table 7-2** RAID Trace 2: Write Dominated


    | Metrics | Combined | Read | Write |

    | --- | --- | --- | --- |

    | `Cmd` number | 21449 | 8535 | 12914 |

    | Total blk size | 2528514 | 357824 | 2170690 |

    | Average blk size | 210.012 | 41.924 | 168.088 |

    | Average IOPS | 193.152 | 76.859 | 116.293 |

    | Average TP (MBps) | 11.118 | 1.573 | 9.545 |


    **Table 7-1** RAID Trace 1: Read Dominated


    |  | Combined | Read | Write |

    | --- | --- | --- | --- |

    | Numbers of commands | 7821 | 5493 (70.2%) | 2328 (29.8%) |

    | Number of blocks | 5284520 | 3231312 (61.1%) | 2053208 (38.9%) |

    | Average size (block) | 675.7 | 588.3 | 882 |

    | `r/s` `w/s` `rsec/s` `wsec/s` `rkB/s` `wkB/s` `IOPS` `TP(MBPS)` |

    | 8.86 3.75 5211.8 3311.6 2605.9 1655.8 12.61 4.23 |'
