    # 3. Trace Collection


    Trace quality is one of the essential requirements for analysis. Low quality traces
    may lead to complex, wrong conclusions for trace analysis. There are two main
    issues in trace quality. One is timing drift, which is when the actual event arrival
    time is earlier than the collected arrival time. The other is a missing event,
    such as when the tool cannot capture all the required events. Thus, proper tools
    shall be applied to guarantee the correctness of the traces. Both software tools
    and hardware devices are introduced in this chapter.'
  trans: '

    # 典型应用


    在本节中，你将了解一些典型应用的若干跟踪指标，以便快速概览。表 2-10 列出了一些典型应用，其中仅提供了块大小、读写百分比以及随机/顺序百分比的粗略值。主导因素
    `IOPS` 或 `MBPS`（吞吐量）实际上表明了工作负载是以随机请求为主还是以顺序请求为主。


    **表 2-10** 典型应用 IO 工作负载概况


    | 应用 | 大小（字节） | 读/写 | 随机/顺序 | 主导因素 |

    | --- | --- | --- | --- | --- |

    | Web 文件服务器 | 4KB, 8KB, 64KB | 95%/5% | 75%/25% | IOPS |

    | 数据库在线事务处理 (OLTP) | 8KB | 70%/30% | 100%/0% | IOPS |

    | Exchange 邮件 | 4KB | 67%/33% | 100%/0% | IOPS |

    | 操作系统驱动器 | 8KB | 70%/30% | 100%/0% | IOPS |

    | 决策支持系统 (DSS) | 1MB | 100%/0% | 100%/0% | IOPS |

    | 文件服务器 | 8KB | 90%/10% | 75%/25% | IOPS |

    | 视频点播 | 512KB | 100%/0% | 100%/0% | IOPS |

    | Web 服务器日志记录 | 8KB | 0%/100% | 0%/100% | MBPS |

    | SQL 服务器日志记录 | 64KB | 0%/100% | 0%/100% | MBPS |

    | 操作系统分页 | 64KB | 90%/10% | 0%/100% | MBPS |

    | 媒体流 | 64KB | 98%/2% | 0%/100% | MBPS |


    IO 工作负载特性通常与应用本身相关。许多访问模式，例如读写比例和处理写入的方式，因具体应用而异。然而，大多数特性仅随环境（运行条件）而变化。与环境相关的特性包括空闲间隔长度、请求到达率、工作负载随机性与顺序性、读写性能、磁盘服务时间和请求响应时间、请求大小等。更重要的是，存在一些在整个
    IO 工作负载中跨应用和环境保持一致的特性。这里特别指出的是工作负载的突发性（即长程依赖性）。特别是块级工作负载，请求到达间隔时间和请求寻道距离，通常是长程依赖的。作为时间序列中时间局部性的一种度量，长程依赖性会产生多种后果，尤其是在预测整个系统和特定资源饱和度方面。因此，在设计新的存储系统以及
    IO 路径各层的资源管理策略时，必须考虑突发性。因此，由于各种应用之间存在巨大差异，不存在适用于所有工作负载的通用良好配置 [42]。


    对于文件系统性能，保持文件系统块大小接近工作负载的 I/O 大小可以显著提高系统效率 [43]。


    Web 流量正在快速增长。一些研究人员认为，在过去 10 年中，Web 服务器工作负载特性并未发生显著变化 [44]。这些特性包括一次性引用行为、重尾文件大小分布、非泊松聚合请求流、高度集中的引用、每个文档的泊松请求流以及远程请求的主导地位。


    数据库通常具有显著的跨事务局部性，这表明实际工作负载中的事务通常是相互依赖的。另一个观察结果是，大量使用顺序访问使得可以应用预取策略。顺序性是长时间运行查询（例如连接操作）检查大量记录的结果。


    OLTP（在线事务处理）工作负载的特点是内存占用大，关键工作集小，并且从微架构优化中获益较少。此外，OLTP 工作负载中的索引搜索需要不同的缓存设计。


    让我们进一步详细研究两个工作负载。^(³⁵) 表 2-11 显示了这两个跟踪的指标值。你可以看到它们的属性差异很大。有时，在简单的合成跟踪生成器中仅使用两三个主要指标，尽管应用的实际跟踪要复杂得多。


    **表 2-11** 两种典型工作负载的基本指标


    | 跟踪 | 持续时间（秒） | 流量（GB） | 总请求数（*×*10⁶） | 平均读/写大小（KB） | 读/写流量比 | 随机读（*×*10⁶） |
    随机写（*×*10⁶） |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | OLTP | 43712 | 18.491 | 5.335 | 3.466 | 0.1820 | 0.955 | 2.99 |

    | 搜索引擎 | 3151.3 | 16.369 | 1.055 | 15.509 | 8762.9 | 0.994 | 2.08e-4 |


    ## 文件和对象级别的跟踪


    另外两种类型的跟踪通常与块级跟踪共享许多共同属性。然而，在某些场景下，它们具有独特的特征。表 2-12 给出了一些文件级跟踪的指标，这些指标与块级跟踪的指标不同。


    **表 2-12** 文件级跟踪的一些指标


    | 指标 | 说明 |

    | --- | --- |

    | **文件类型** | 文件系统以多种方式之一被使用：作为持久数据的长期存储，作为存放因过大而无法放入主内存的数据的仓库，作为可执行文件的存储位置，以及用于存储系统使用日志以进行记账和监控。元数据与用户数据的比率是一个重要指标。
    |

    | **文件年龄** | 年龄定义为自上次引用以来的时间。 |

    | **文件访问持续时间** | 从打开到关闭的时间。 |

    | **用户行为模型** | 用户生成构成工作负载的引用。 |

    | **进程和状态模型** | 包含多个方面，例如进程在其生命周期内如何发出文件服务请求；访问依赖的条件激活表；以及不同操作（如 `open`、`close`、`write`、`read`、`seek`
    等）的比率。它可以被建模为一个封闭的马尔可夫链。 |

    | **引用模型** | 请求如何在系统中的文件之间分布。 |


    如前所述，基于不同的抽象级别，需要考虑的指标可能不同。例如，在系统级别，我们通常考虑表 2-13 中列出的属性，其中大部分属性可能存在于文件或对象级别。


    **表 2-13** 系统级别的工作负载


    | 系统视图中的工作负载 | 负载到达模式 | 数据访问模式 | 计算模式 |

    | --- | --- | --- | --- |

    | MapReduce | 作业序列的到达时间 | HDFS 输入和输出路径，输入、混洗和输出存储的数据大小 | 输入数据大小、混洗数据大小、输出数据大小、作业持续时间、映射任务时间、归约任务时间
    |

    | 企业网络存储 | 应用实例或用户会话的到达时间序列 | 读/写、顺序/随机、单次/重复访问、文件大小、文件类型 | 不适用 |


    在本章中，我介绍了一些用于存储系统性能评估和设计的跟踪指标。给出了一些典型应用，以便对这些指标有一个快速印象。事实上，由于某些应用之间存在巨大差异，通常不存在通用的系统设计。我将在后续章节中讨论更多细节。


    脚注 1 2 3


    # 跟踪收集


    跟踪质量是分析的基本要求之一。低质量的跟踪可能导致复杂且错误的跟踪分析结论。跟踪质量存在两个主要问题。一个是时间漂移，即实际事件到达时间早于收集到的到达时间。另一个是事件丢失，例如工具无法捕获所有必需的事件。因此，应使用适当的工具来保证跟踪的正确性。本章将介绍软件工具和硬件设备。

    '
- fmt: '# Collection Techniques


    Many techniques have been proposed to monitor and capture system or component
    traces. There are four techniques generally:


    - **Hardware-based monitoring** entails the modification of the testbed hardware
    so that as a program is executed, a record of all instructions and/or data addresses
    is created.

    - **Software-based tracing** can achieve similar goals as hardware to a certain
    degree, but instead of altering the system hardware, software is modified or inserted.

    - **Emulation-based tracing** constructs a layer between the host machine and
    the OS under evaluation, like `QEMU`^([^(36)](#fn36)) and `SimOS`.^([^(37)](#fn37))
    The layer only emulates enough components to allow the OS to run correctly. While
    this system provides a flexible interface to collect operating system-dependent
    traces, the accuracy of the captured trace is dubious sometimes. Since emulation
    is performed, execution will be perturbed.

    - **Microcode-based tracing** utilizes microcode modification to capture trace
    information, introducing minimal slowdown, like `PALcode` (Privileged Architecture
    Library code).^([^(38)](#fn38))


    However, the third and fourth techniques are not popular due to high complexity
    and dubious accuracy. Therefore, only hardware and software based techniques are
    discussed in this chapter.


    ## Hardware Trace Collection


    We refer the hardware method to the trace collection approach that uses a particular
    hardware device/system capturing the IOs other than the targeted storage devices,
    although some software may be still required to manage the traces [38, 45]. There
    are many types of hardware to collect the block-level trace. One of the most common
    devices is a bus analyzer, although it is not limited to block-level IOs for disk
    drives, such as network traffic, DDR/CPU caching/stall/latency/throughput/etc.
    Some products can capture rather accurate traces, such as the `Xgig 6G SAS/SATA
    analyzer` from Viavi solution, the `BusXpert Micro II Series SAS/SATA analyzer`
    from SerialTek, the `Trace and analyzer` from TI, the `protocol analyzer` from
    LeCroy, the `Eumulator XL-100` from Arium, and the `SuperTrace Probe` from Green
    Hills Software.


    The bus analyzers often provide multiple communication interfaces for users. Take
    the devices in Figure [3-1](#468166_1_En_3_Chapter.xhtml#Fig1) as an example.
    They provide USB, Ethernet, SCSI, etc. These devices usually achieve reliable
    and accurate linkups via multiple mechanisms, with higher resolution (e.g., time
    precision and capture frequency) and more information captured than software-based
    tools.


    ![../images/468166_1_En_3_Chapter/468166_1_En_3_Fig1_HTML.jpg](images/468166_1_En_3_Chapter/468166_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Bus analyzers from LeCropy, XGIG, and SerialTek


    Figure [3-2](#468166_1_En_3_Chapter.xhtml#Fig2) shows an example of SAS IO access
    in `BusXpert`, which provides almost all basic information related to SAS protocols.
    The users can easily trace the command status from the detailed logs, such as
    the response time, connections, etc.


    ![../images/468166_1_En_3_Chapter/468166_1_En_3_Fig2_HTML.jpg](images/468166_1_En_3_Chapter/468166_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Plentiful protocol information from BusXpert


    Figure [3-3](#468166_1_En_3_Chapter.xhtml#Fig3) provides another example of SATA
    command analysis. You can see that the host issued the command `COMWAKE` after
    around 5 seconds. The drive almost immediately acknowledged `COMWAKE`. At time
    5.59 seconds, `SMART READ DATA` was transferred to the host.


    ![../images/468166_1_En_3_Chapter/468166_1_En_3_Fig3_HTML.jpg](images/468166_1_En_3_Chapter/468166_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    SATA command analysis


    Although there is no difficulty in capturing almost all the essential protocol
    information, no advanced metrics of IO properties are included in the software
    used to analyze the trace.


    ## Software Trace Collection


    In term of accuracy, a software trace collector may be not as good as hardware
    devices. In particular, for these applications with time precision in nanoseconds
    or less, software may not work well. For example, a disk feature debug related
    to the SAS/SATA protocol may be applicable to the bus analyzer since it may involve
    the disk drive’s SoC clock issues. However, for disk drive IO performance, it
    is generally operated at the millisecond level (precision), which is generally
    within the capability of the modern processors and operating systems inside a
    common server or workstation.


    There are many IO tools available [45, 35]:


    - **Linux/Unix**: `Dtrace`[46], `LTTng`, `BCC`,^([^(39)](#fn39)) `iostat`, `dstat`,
    `tracefs`,^([^(40)](#fn40)) `iotop`, `hdparm`, `ionice`, `Ctrace`,^([^(41)](#fn41))
    `iogrind`, `POSIX Test Suite`, `ioprofile`, `SystemTap`, `IOR`, `PCP`, and `swtrace`

    - **Windows**: `Xperf`,^([^(42)](#fn42)) `TraceWPP`/`TraceView`/`Tracelog`/`Logman`,^([^(43)](#fn43))
    `Vtrace`, `Oracle trace collector`, `Bus analyzer module`,^([^(44)](#fn44)) and
    `PatchWrx`^([^(45)](#fn45))


    However, not all of these tools can provide event details. In fact, the general
    purpose monitoring tools, like `iostat` and `iotop`, cannot provide detailed information
    on a per-IO basis.


    These tools can be divided into two classes: static and dynamic. Static tools
    view the binary image of a program as a black box that is never modified. Dynamic
    tools instead rely on binary-level alterations to facilitate the gathering of
    statistical data from an application. For example, all the Windows tools and `iotop`/`iostat`/`dstat`/`hdparm`/`ionice`/`iogrind`/`ioprofile`
    are static tools, while `SystemTap`, `Dtrace`, and `LTTng` are dynamic tools.
    In particular, `Dtrace` and `LTTng` use a mechanism called probing that is able
    to selectively activate instrumentation routines that are embedded within software
    at all levels of abstraction, so that performance-related statistics can be obtained
    from not only an application but also the various libraries and kernel routines
    associated with its execution.


    ### Blktrace


    `Blktrace` is a static tool that has been embedded into the Linux kernel since
    version 2.617-rc1. This tool is lightweight and easy to use. It only considers
    device access after OS/FS cache. When IO enters to block an IO layer (request
    queue), the relay channel per CPU gets events emitted, and `blktrace` then captures
    the events from the channels. More details can be found in Appendix B.'
