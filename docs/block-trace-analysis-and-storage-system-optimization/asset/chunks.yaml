    ### Inter-Arrival and Inter-Completion Time


    Inter-arrival time is defined as the time interval between two sequentially arrived
    requests: `δt[i] = D[i] − D[i−1]`. Similarity, inter-completion time is defined
    as `δt¯[i] = C¯[i] − C¯[i−1]`, where `C¯[i]` is reordered `C[i]` based on a completion
    time sequence. `δt[i]` is a direct indictor of the workload burstiness [38], together
    with the supposed-to-be average completion time of requests. When the average
    `δt[i]` is much smaller than `δt¯[i]`, it usually means the system is under a
    stressed workload, which may be beyond the storage device’s capability. In a sense,
    these two indictors are closely related to IOPS.'
