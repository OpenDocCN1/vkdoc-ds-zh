    show that the written data is less likely to be immediately read back for most
    cases for similar reasons as explained in previous chapters.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig15_HTML.png](images/468166_1_En_8_Chapter/468166_1_En_8_Fig15_HTML.png)


    Figure 8-15


    ROW hit and size distribution


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig14_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig14_HTML.jpg)


    Figure 8-14


    ROW ratio


    #### Write Cache Enabled vs. Disabled


    Write cache is an important feature of HDDs. Many studies show that the performance
    of WCE (write cache enabled) can be increased significantly over WCD (write cache
    disabled) due to write-back policy, in particular for some small-size random write
    workloads. However, the data reliability concern (e.g., power loss leads to dirty
    data loss in DRAM write cache) results in most data centers disabling this feature.


    Here we compare four traces (148-21, 148-22, 149-21, and 149-22) as nodes 148
    and 149 always use different write cache setting and there is a setting change
    between batch ID 21 and 22 (see Table [8-2](#468166_1_En_8_Chapter.xhtml#Tab2)).
    You can see that there is no essential difference among write IOPS, throughput,
    and average size as shown in Table [8-8](#468166_1_En_8_Chapter.xhtml#Tab8). Meanwhile,
    the ratio of large write requests (e.g., 1024 blocks) almost remains the same.
    Nevertheless, you can observe that the (near) sequence ratio of WCD is slightly
    smaller than that of WCE for both reads and writes (1% of absolute value). These
    factors show that the HDFS does not change its behavior according to HDD’s write
    cache settings, even though the local file system may respond to it. However,
    as the workload is far away from the drive’s boundary capability, the response
    is not significant.


    Table 8-8


    Basic IO metrics for WCD vs. WCE


    | Average | IOPS | Throughput KBPS | Size blocks |

    | --- | --- | --- | --- |

    |   | 21 | 22 | 21 | 22 | 21 | 22 |

    | 148 | 6.3 | 7.0 | 1846.6 | 2064.4 | 586.0 | 589.5 |

    | 149 | 6.6 | 6.8 | 1782.2 | 1881.9 | 541.8 | 556.6 |


    In the heavy workload cases, some interleaved sequential streams will be considered
    as “random” rather than sequential, causing an increased ratio of random writes,
    which is harmful to the overall disk performance. Therefore, some non-volatile
    memory or DRAM protection technologies may be applied in order to enable write
    cache, which becomes necessary for heavy workloads. Additionally, for green environments
    in data centers where the bottleneck is not the HDDs (at least under normal workloads),
    another benefit to WCE is energy savings due to less mechanical accesses to the
    HDDs.'
  trans: '

    ### 写入更新


    对于频繁的写入更新，86% 的访问块（可能重复）仅被写入一次。被多次写入的块所占比例逐渐降低，这意味着只有一小部分热块被重写。如果所有重写数据都放置到新位置，写入放大率大约为
    116.3%。


    对于定时写入更新，总写入块占全部访问块（读取和写入）的 80%，而更新块（至少写入两次）仅占 6.8%。总写入命令占总命令的 59%，更新命令占 22.5%。写入命令的平均大小约为
    586 个块，更新命令的重叠块平均大小为 73.3。


    在查看堆叠写入更新之前，请先检查堆叠距离。你会发现，与小尺寸请求相比，大尺寸请求（因为命中大小远小于平均大小）完全命中的概率较低。实际上，部分命中（仅部分块相同）和完全命中（两个请求相同）的平均重叠大小分别为
    139.4 和 55.1 个块。通过使用表 8-4 和 8-7 中的数据，你可以得出结论：对于大尺寸请求，部分命中更可能发生。


    **表 8-7** 逻辑堆叠距离 (LSD) 统计


    | | `LSD≤1000` | `LSD≤2000` | `LSD≤4000` | 总体 |

    | --- | --- | --- | --- | --- |

    | 部分命中, 完全命中 | 2.8%, 14.9% | 3.5%, 17.6% | 4.4%, 19.9% | 7.5%, 27.3% |


    通过参考图 8-12（命中频率与 LBA 和大小关系图），分别考虑完全命中和部分命中，可以进一步验证。这证实了大尺寸请求以部分命中为主，而小尺寸请求以完全命中为主。中等大小（64-1023
    个块）请求的命中次数要少得多。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig12_HTML.png](img/468166_1_En_8_Fig12_HTML.png)


    **图 8-12** 写入更新 LBA 和大小分布


    现在让我们检查堆叠写入更新比率。基于写入 IOPS，距离 4000 大约相当于 10 分钟。在此期间，你可以看到命令的完全写入命中率为 72.9%，部分写入命中率为
    58.7%。根据缓存大小和结构的知识，你可以估算命中率。由于堆叠距离通常长于 DRAM 缓存长度，因此磁盘上的更新无法避免。因此，在介质上设置一个“缓存/缓冲”位置是必要的，因此更大容量的
    SSD 缓存对于性能提升是必要的。


    图 8-13 中的第三个图显示，对于部分/完全命中，超过 65% 的重叠请求大小发生在总时间的前 1% 内，这进一步证实了大容量 SSD 缓存的必要性。由于传统磁盘驱动器没有提供如此大的缓存，通过混合驱动器（SSD+HDD）或在系统更高级别（例如阵列控制器或聚合控制器）实现此缓存可能是有益的。对于
    SMR 驱动器，一种便捷的方法是允许常规区域与叠瓦式区域共存，以支持随机写入访问。^(⁷²) 在 [5, 4] 中，这也被称为随机访问区域 (RAZ)。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig13_HTML.png](img/468166_1_En_8_Fig13_HTML.png)


    **图 8-13** 频繁、定时和堆叠写入更新（从上到下）


    ### 写后读 (ROW)


    `ROW` 比率主要用于检查“一次写入多次读取 (WORM)”是否可能。你会发现总的 `ROW` 比率仅为 35.4% 左右，这意味着写入的数据不太可能被多次读取（即比率远大于
    1）。你可以进一步检查命中是否仅针对小尺寸请求。图 8-14 和 8-15 显示，在大多数情况下，写入的数据不太可能被立即读回，其原因与前面章节解释的类似。


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig15_HTML.png](img/468166_1_En_8_Fig15_HTML.png)


    **图 8-15** ROW 命中与大小分布


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig14_HTML.jpg](img/468166_1_En_8_Fig14_HTML.jpg)


    **图 8-14** ROW 比率


    ### 启用写入缓存与禁用写入缓存


    写入缓存是 HDD 的一项重要功能。许多研究表明，由于回写策略，启用写入缓存 (`WCE`) 的性能可以比禁用写入缓存 (`WCD`) 显著提高，特别是对于某些小尺寸随机写入工作负载。然而，数据可靠性问题（例如，电源故障导致
    DRAM 写入缓存中的脏数据丢失）导致大多数数据中心禁用此功能。


    这里我们比较四个跟踪记录（148-21、148-22、149-21 和 149-22），因为节点 148 和 149 始终使用不同的写入缓存设置，并且在批次
    ID 21 和 22 之间设置发生了变化（参见表 8-2）。你可以看到，如表 8-8 所示，写入 IOPS、吞吐量和平均大小没有本质区别。同时，大写入请求（例如，1024
    个块）的比率几乎保持不变。然而，你可以观察到，对于读取和写入，`WCD` 的（近）顺序比率略小于 `WCE`（绝对值相差 1%）。这些因素表明，即使本地文件系统可能对其做出响应，HDFS
    也不会根据 HDD 的写入缓存设置改变其行为。然而，由于工作负载远未达到驱动器的极限能力，这种响应并不显著。


    **表 8-8** WCD 与 WCE 的基本 IO 指标


    | 平均值 | IOPS | 吞吐量 KBPS | 大小（块） |

    | --- | --- | --- | --- |

    | | 21 | 22 | 21 | 22 | 21 | 22 |

    | 148 | 6.3 | 7.0 | 1846.6 | 2064.4 | 586.0 | 589.5 |

    | 149 | 6.6 | 6.8 | 1782.2 | 1881.9 | 541.8 | 556.6 |


    在繁重的工作负载情况下，一些交错的顺序流将被视为“随机”而非顺序，导致随机写入比率增加，这对整体磁盘性能有害。因此，可能需要应用一些非易失性内存或 DRAM
    保护技术来启用写入缓存，这对于繁重的工作负载来说是必要的。此外，对于数据中心中瓶颈不在 HDD（至少在正常负载下）的绿色环境，`WCE` 的另一个好处是由于减少了
    HDD 的机械访问而节省能源。'
- fmt: '### System-Level View


    In this section, I present a brief analysis of how the random IO, observed in
    the previous section, of the block level traces led to a better analysis of the
    Hadoop cluster’s IO patterns. First, let’s look at the workload characteristics
    collected from HDFS logs, as shown in Table [8-9](#468166_1_En_8_Chapter.xhtml#Tab9).
    Recall the system level analysis mentioned earlier; I captured data generation
    and deletion rates, job creation rates and characteristics, etc. with the low
    level IO obfuscated from us. Arguably, this is how a high-level framework should
    behave, fully or mostly insulated from the hardware devices below. However, those
    who have to maintain the full operational stack must be aware of the entire system,
    not just the user-level framework. Below, I analyze the randomness from three
    aspects: the Hadoop framework, the MapReduce policy, and HDFS mechanism.^([^(73)](#fn73))


    **Table 8-9** Basic Information Collected from HDFS Logs


    | Name | Duration | Total IO Requests | Average IO Size(MB) |

    | --- | --- | --- | --- |

    | | Ave | Max | Min | Total | Read | Write | |

    | `wdc-x1` | 68 d | 0.627 | 5.476 | 0.125 | 60.96 | 3.14 | 99.75 | |

    | `wdc-x2` | 98 d | 0.396 | 5.661 | 0.107 | 47.83 | 3.09 | 93.2 | |

    | R/W ratio | IOPS 10⁵ | Throughput (MB/S) |

    | Avg | Max | Min | Total | Read | Write | Total | Read | Write |

    | 0.0348 | 0.125 | 0.0054 | 0.726 | 0.536 | 0.19 | 18.48 | 0.632 | 17.85 |

    | 0.0383 | 0.33 | 0.007 | 0.458 | 0.325 | 0.133 | 12.11 | 0.442 | 11.67 |


    Notice that all daemons within the Hadoop framework write logs of their runtime
    throughout the course of the day. Depending on configuration, this can be written
    to the HDFS or to the local FS. If logs are written to the local FS, they account
    for some random IO to the HDD. Other daemons of frameworks which sit on top of
    Hadoop’s core framework can generate more random IOs at the device level. HBase
    has similar logs from its region servers which must be written. Created for real-time
    data processing, HBase will spawn small MapReduce jobs which access potentially
    small amounts of data, causing random read IOs in a HDFS instance. Frameworks
    like Hive and other KV stores, which sit on top of Hadoop, have similar logging
    structures which can potentially cause random IO amplification down at the device
    level.


    Java-based (Apache) MapReduce must write temporary intermediary files to disk
    during MapReduce jobs, some with repeating process IDs (PIDs) and others with
    single or minimal use PIDs. These intermediary files can either be dumped to locations
    in the HDFS (which attempts to serialize the IO if possible) or the local FS,
    which will be a random IO event. This is configurable via tuning the parameter
    `mapreduce.task.tmp.dir`.


    After consulting the Hadoop XML configuration files, one thing that I noticed
    was that the temporary/intermediary space for all HDFS and MapReduce workloads
    were configured to store their output data to the HDFS data drive. Because the
    Hadoop framework is written in Java, it must contend with the properties of the
    Java Virtual Machine (JVM), meaning that memory addresses have no meaning between
    JVMs. Hence, when a MapReduce task passes data to another MapReduce task, it first
    writes data to a temporary file for the other JVM task to read. Additionally,
    when a MapReduce job launches, it must send the configuration parameters and executable
    jar file to the `TaskTrackers` so that they can correctly spawn map and reduce
    tasks. This data too was being stored to that configured local temporary space.


    Couple this IO with the observation that the cluster runs close to 5500 MapReduce
    jobs per day, of which many are small task count jobs (due to the 20% HBase analysis
    performed by users), and the amount of random IO generated on these HDDs becomes
    very large. However, this IO is something that can be mitigated and was not completely
    responsible for the high level of random IO seen in the block-level traces. The
    HDFS itself also contributes to the amount of random IO seen in those traces.


    From the system logs as shown in Figure [8-16](#468166_1_En_8_Chapter.xhtml#Fig15),
    you can see that the number of chunks created and deleted daily is quite high
    for the system. Each time the HDFS commits a chunk of data to the filesystem,
    it also creates a metadata file. This metadata file is proportional to the size
    of the HDFS chunk committed to the localFS, so a 128MB chunk will have a corresponding
    ≈1.2MB metadata file created where smaller chunks will have smaller metadata files.
    Hence, for the observed workload, there is a lot of small random IO due to tens
    of thousands of new chunks being generated daily on the HDFS. However, unlike
    the observed random IO for the MapReduce framework, wherein the location to store
    the temporary files is configurable, the location where these HDFS metadata files
    are stored is not a configurable property, and therefore cannot be delegated to
    another class of storage or storage location. When considering newer HDD technologies,
    wherein random IO (especially random writes) can greatly impact performance, understanding
    workload characteristics like these are paramount. Without a device-level analysis
    of the workload, these characteristics would have not been so clearly identified.


    ![../images/468166_1_En_8_Chapter/468166_1_En_8_Fig16_HTML.jpg](images/468166_1_En_8_Chapter/468166_1_En_8_Fig16_HTML.jpg)


    **Figure 8-16** Basic curves from HDFS logs'
