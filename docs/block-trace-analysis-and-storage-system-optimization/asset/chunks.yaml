    CMD 1015 is close to 1024 but it costs 390ms. This may be caused by 1) background
    disk activities such as log writes, metadata updates, zone switches, etc; or 2)
    RAID synchronization events. A possible solution is to evenly distribute tasks
    and actively provide idle time for background tasks.


