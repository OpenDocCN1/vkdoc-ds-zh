  trans: '

    # 进一步讨论


    在本章中，我通过考虑一些特定指标，展示了 Hadoop 集群的块级工作负载特征。所呈现的分析技术可帮助他人在其生产环境中理解 Hadoop 的性能与驱动特性。通过
    `blktrace` 收集的日志，我对这些日志进行了全面分析，识别出了一些具有意外行为的新工作负载模式。我指出，虽然顺序和近顺序请求占据了 IO 工作负载的大部分，但在
    Hadoop 工作负载中仍存在不可忽视的随机 IO 请求。此外，驱动器上的写更新比率并不高，这表明如果采用异地写入策略，可能会产生较小的写放大效应。同时还需注意，ROW
    比率很小，这意味着 WORM 通常不适用于该集群的工作负载。所有这些发现都表明，空间局部性相对较高，而时间局部性低于预期，这说明 Hadoop 通常是适用于
    SMR 驱动器的应用。然而，Hadoop 和驱动器两端都需要进一步改进。


    从批判性角度审视 Hadoop 系统的配置，可以对观察到的部分（而非全部）随机 IO 进行微调并最小化。导致这种随机 IO 的因素包括几种类型的框架日志记录、MapReduce
    和 HBase 工作负载生成的中间文件，以及 HDFS 数据块的元数据文件。可以降低 Hadoop 守护进程日志文件的详细程度以减少生成的数据量，并且这些日志文件以及临时的
    MapReduce 输出可以写入一个不会影响 HDFS 数据块 IO 操作的存储位置。这些位置可以是 HDFS 本身（而非本地存储），这将尝试使 IO 更加顺序化，也可以是另一个更适合随机块
    IO 的物理/逻辑块设备（同时保持数据本地性）。图 8-16 展示了从 HDFS 日志中推导出的一些基本曲线。


    然而，观察到的随机 IO 的最后一部分是 HDFS 写入/更新机制的结果，并且不易缓解，因为它目前必须与已提交的 HDFS 数据块一起驻留在 HDFS 数据驱动器上。由数据块元数据引起的小型
    IO 必须由一个容量块存储设备来处理，该设备要么能够理解如何将这些小型随机 IO 转换为更大的顺序访问模式，要么就是一个专门为处理随机 IO 而设计的设备。如果没有设备级的视角，这种开销可能会被误认为是系统中其他地方的问题，而不是
    HDD 设备级的问题，而其中一些问题在获得正确洞察后是非常容易纠正的。例如，对于随机读取访问的场景，大容量 DRAM 缓冲区将非常有用；而对于随机写入访问，非易失性存储器（例如
    NAND 和传统区域）则很有帮助。


    因此，有必要研究 HDFS 与本地文件系统的集成，同时考虑设备属性，例如采用全局视角的设计，以避免对 HDFS 中顺序写入的本地元数据产生“误解”。并且，元数据和“非关键”的中间/临时数据应被分配到合适的磁盘位置。因此，HDFS
    可以承担 DataNode 中文件/块访问的责任，这可能会使驱动器操作更高效。设备中的元数据位置也应精心设计。


    此外，考虑到 Java 的机制，驱动级缓存和系统级缓存可以统一起来，这样一些临时数据可能被统一的缓存/缓冲区吸收，而无需进行磁盘机械访问。由于当前 HDFS
    的缓存设计简单且 JVM 与驱动器之间缺乏直接接口，这种统一可能很困难。然而，驱动器制造商提供这种面向应用的通信接口是可能的。


    此外，某种智能机制可能有助于驱动器理解访问的性质（例如，随机或顺序、访问依赖性），从而使驱动器能够立即切换到最优算法/行为以获得更好的性能。一种在主机和驱动器之间进行交互的应用级提示方案，或者驱动器内部的自学习算法，可能会有所帮助。


    总之，对内部 Hadoop 集群的设备级分析为理解 Hadoop 如何与底层文件系统交互以及如何处理其低级 IO 提供了新的见解。这些新见解激励我继续研究大数据框架的工作负载特征和应用调优如何能够在我们所处的当前数据驱动环境中帮助提升存储设备的性能。这项研究也大致适用于
    Spark（一种内存型 MapReduce 系统）。例如，详细的工作负载分析可以为 Spark 系统的 SCM 应用提供一些见解，这将有助于设计出成本高效的混合
    SCM-DRAM 结构。


    脚注 1 2 3 4

    '
- fmt: '# 9. Case Study: Ceph


    Ceph, an open-source distributed storage platform, provides a unified interface
    for object-, block-, and file-level storage [33, 80, 34, 81]. This chapter presents
    the block-level workload characteristics of a WD WASP/EPIC microserver-based Ceph
    cluster. The analysis techniques presented can help you to understand the performance
    and drive characteristics of Ceph in production environments. In addition, I also
    identify whether SMR, hybrid disk, and SSD drives are suitable for the Ceph workload.


    The basic architecture of Ceph was described in Chapter [1](#468166_1_En_1_Chapter.xhtml).
    Ceph’s core, RADOS, is a fully distributed, reliable, and autonomous object store
    using the CRUSH (Controlled Replication Under Scalable Hashing) algorithm. Ceph’s
    building blocks are called OSDs (object storage daemons). OSDs are responsible
    for storing objects on local file systems (e.g., EXT4 and XFS), and cooperating
    to replicate data, detect and recover from failures, or migrate data when OSDs
    join or leave the cluster. Ceph’s design originated in the premise that failures
    are common in large-scale storage systems. Along these lines, Ceph targets at
    guaranteeing reliability and scalability by leveraging the intelligence of the
    OSDs. Each OSD uses a journal to accelerate the write operations by coalescing
    small writes and flushing them asynchronously to the backing file system when
    the journal is full. The journal can be a different file or located in another
    device or partition [82, 83, 84].


    These tests are based on a “unique” platform. Instead of traditional workstations,
    the so-called microserver structure is used for the production environments. In
    the system, each microserver has an individual OS and an HDD. It is almost the
    minimum granularity for an IO device, which essentially satisfies the original
    design requirement of Sage Weil, the father of Ceph [80, 33]. In fact, this architecture
    minimizes the failure domain to a disk unit instead of many disks becoming inaccessible
    in one server with a multi-disk architecture. The storage cluster is scaled out
    by connection microservers by a top of the rack Ethernet switch.


    A microserver-based cluster with 12 nodes (named as `sm1-wasp1` to `sm1-wasp12`)
    is shown in Figure [9-1](#468166_1_En_9_Chapter.xhtml#Fig1). Three virtual machines
    (VMs) act as the clients to generate the IO requests (named as `Cag-blaster-ixgbe-02`
    to `Cag-blasterixgbe-04`). All the tests are done in the Ceph version Jewel. In
    this microserver-based configuration for filestore, each node/drive is divided
    into four partitions. `/dev/sda1` installs the operating system (Ubuntu) and `/dev/sda3`
    is reserved. `/dev/sda2` is used for metadata, and `/dev/sda4` is used for user
    data.


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig1_HTML.png](images/468166_1_En_9_Chapter/468166_1_En_9_Fig1_HTML.png)


    Figure 9-1


    Ceph cluster topology


    ## Filestore IO Pattern


    Three VMs are used as clients to send bench write requests to a replicate pool
    (named `rep1` with one replicate) for 250 seconds and `blktrace` to collect traces
    for 310 seconds, so `rados bench -p rep1 250 write` from each client and `blktrace
    /dev/sdax -w 310` from each node. Due to the limitation of `blktrace` (it’s unable
    to collect an individual partition in the same drive), the trace from `sda2`/`sda4`
    and the whole `sda` are collected separately. A bus analyzer is also used to verify
    the traces.


    The common properties of the 12 nodes are listed in Table [9-1](#468166_1_En_9_Chapter.xhtml#Tab1).
    You can observe that the basic properties are generally similar. One of the IO
    pattern curves is illustrated in Figures [9-2](#468166_1_En_9_Chapter.xhtml#Fig2)
    and [9-3](#468166_1_En_9_Chapter.xhtml#Fig3), where the three rows represent `sda2`,
    `sda4`, and `sda`, respectively. Note that all wasp nodes are write cache enabled.
    The command of `"ceph tell osd.* bench 41943040 4194304"` gives around 100MBPS
    (cached). Therefore, it means the three clients with 32 threads each have almost
    fully utilized the disk bandwidth. The reason will be explained later.


    You can also see that differences of IO patterns may still exist in different
    nodes; for example, the read/write ratio is high in some nodes while it is low
    in other nodes, and the idle time distribution varies. Based on read/write ratio,
    we can roughly divide the IO patterns into two classes: one is read dominated,
    and the other is write dominated. When read dominates, the average size of the
    read becomes smaller.


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig3_HTML.png](images/468166_1_En_9_Chapter/468166_1_En_9_Fig3_HTML.png)


    Figure 9-3


    IO pattern in different partitions: Throughput and IOPS


    ![../images/468166_1_En_9_Chapter/468166_1_En_9_Fig2_HTML.png](images/468166_1_En_9_Chapter/468166_1_En_9_Fig2_HTML.png)


    Figure 9-2


    IO pattern in different partitions: LBA and size distribution


    Table 9-1


    Common Properties for Ceph Nodes


    | Properties | Metadata | Data |

    | --- | --- | --- |

    | R/W | Mixed read and write | No read requests |

    | Size | Relatively small requests (8-block requests dominated); size of write
    varies largely; the R/W ratio varies largely. | 1024-block requests dominated,
    followed by small blocks |

    | Sequence | Mode =8 (very small); relatively more random over a small range.
    Much higher near sequential ratio than strict sequential ratio (small gaps exist
    for 50% requests) | Mode =0; high sequential ratio. Higher near sequential ratio
    (small gaps exist for 5% write requests) |

    | Write update | High update ratio (>50% write requests updated) | Low update
    ratio (updated blocks <1%, more partial) |

    | Write stack distance | Relatively small distance to achieve high percentage
    of hits; small average overlap size (8 blocks); necessary for write cache. | Relatively
    large distance to achieve high percentage of hits; small average overlap size;
    unnecessary for write cache. |


    Table [9-2](#468166_1_En_9_Chapter.xhtml#Tab2) shows the total idle time for different
    nodes at different scenarios. Basically, the idle time is unevenly distributed,
    which means that the workload to each node is actually uneven. In other words,
    some nodes are very busy, such as `wasp12` in the case of “3-8” (3 clients, 8
    threads), while some are very “lazy,” such as `wasp8` in the case of “3-8.” This
    is partially due to the CRUSH algorithm, which is in charge of PG (placement group)
    allocations. Although a reasonable number of clients and threads may alleviate
    the uneven distribution, it may not essentially solve this problem. Thus, some
    improvement policies, such as asynchronized, active feedback, adjustable PG, etc,
    shall be implemented.


    Table 9-2


    Total Idle Time in the First 240 Seconds


