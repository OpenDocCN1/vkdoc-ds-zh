  trans: '

    | 属性 | SSD | HDD |

    | --- | --- | --- |

    | 启动时间 | 几乎无延迟，因为无需准备机械部件（从几个`μ`s 到毫秒）。从自动省电模式切换通常只需几毫秒。 | 磁盘旋转启动最多需要几秒钟。从空闲模式唤醒最多需要几亿秒。
    |

    | 随机访问时间 | 通常小于 0.1 毫秒，通常不会成为重大性能瓶颈。 | 通常为 2.5 毫秒（高端服务器/企业级硬盘）到 12 毫秒（笔记本电脑/移动硬盘），主要受寻道时间和旋转延迟影响。
    |

    | 读取延迟时间 | 由于可从任意位置直接访问数据，通常较低。对于受限于 HDD 定位时间的应用，SSD 在更快的启动和应用加载时间方面没有问题（参见阿姆达尔定律）。干净的
    Windows 操作系统启动时间可能少于 6 秒。 | 通常远大于 SSD。由于数据在介质上的位置和当前读磁头位置不同，每次寻道的时间也不同。^(⁵) 干净的
    Windows 操作系统启动时间可能超过 1 分钟。 |

    | 数据传输速率 | 对于相对顺序的 IO，IO 速度相对稳定。当随机小块比例较大时，性能会下降。消费级产品的典型值范围约为 300MB/s 至 2500MB/s（2017
    年常见速度约为 500MB/s）。企业级产品可达每秒数 GB。 | 严重依赖于转速，通常在 3,600 至 15,000 RPM 之间（也存在 20,000
    RPM）。3.5 英寸 7200 RPM 硬盘的典型传输速度约为 200 MBps。一些高端硬盘可能更快，可达 300 MBps。TPI 和 SPI 也是影响因素。
    |

    | 读取性能 | 通常与 SSD 中的数据位置无关。在少数情况下，顺序访问可能受到碎片化的影响。 | 随机寻道代价高昂。碎片化文件会导致数据分布在盘片的不同区域；因此，对碎片的多次寻道会增加响应时间。
    |

    | 写入性能 | 可能发生写入放大。^(⁶) 采用磨损均衡技术来缓解此影响。然而，由于 SSD 的特性，驱动器可能会以可观察到的速度不可避免地降级。 | CMR
    没有写入放大的问题。然而，SMR 可能因异地更新而出现问题，也需要垃圾回收。 |

    | 文件系统碎片化的影响 | 顺序读取数据的收益相对有限，因此碎片化对 SSD 影响不大。碎片整理会因额外写入而造成磨损。^(⁷) | 如果频繁更新，许多文件系统会随时间产生碎片。需要定期进行碎片整理以维持最佳性能，不过由于节点设计和后台垃圾回收，现代文件系统可能不存在此问题。
    |

    | 噪音（声学）和振动 | SSD 基本无噪音，因为没有活动部件。有时，高压发生器（用于擦除块）可能会产生音调噪音。通常对振动不敏感。 | 活动部件（如磁头、执行器和主轴电机）会发出特有的嗡嗡声和咔嗒声。不同型号的噪音水平差异很大，可能较大。^(⁸)
    移动硬盘由于机械设计更优，相对安静。通常对振动敏感。^(⁹) |

    | 数据分层 | 热数据可能从慢速设备迁移到快速设备。通常与 HDD 配合使用，但在某些实现中，也会混合使用快速和慢速 SSD。 | HDD 通常在混合系统中用作慢速层。某些条带化磁盘阵列可能提供与
    SSD 相当的顺序访问性能。 |

    | 重量和尺寸 | 由于内部结构，通常小巧轻便。它们通常具有与 HDD 相同的形状因数（例如 2.5 英寸），但更薄，并采用塑料外壳。M.2（下一代外形规格）格式使其更小。
    | HDD 通常比 SSD 重，因为其外壳通常由金属制成。2.5 英寸硬盘通常重约 200 克，而 3.5 英寸硬盘重超过 600 克（取决于外壳材料、电机、磁盘磁铁/数量等）。某些用于移动设备的纤薄设计厚度可能小于
    6 毫米。 |

    | 可靠性和寿命 | 无机械故障。然而，每个块的有限写入周期可能导致数据丢失。^(¹⁰) 控制器故障可能导致 SSD 无法使用。不同制造商、工艺和型号的可靠性差异很大。^(¹¹)
    | 因磨损和撕裂可能导致潜在的机械故障。存储介质本身（磁盘盘片）基本上不会因读写访问而退化。^(¹²) |

    | 每容量成本^(¹³) | 消费级 SSD 的 NAND 芯片价格已迅速下降：2013 年 4 月为每 GB 0.60 美元，2014 年 4 月、2015
    年 2 月和 2016 年 9 月分别为每 GB 0.45 美元、0.37 美元和 0.24 美元。自 2016 年底以来，降价速度有所放缓。3D NAND
    普及后价格可能会变化。^(¹⁴) | 2017 年 5 月，消费级 3.5 英寸和 2.5 英寸硬盘每 GB 成本分别约为 0.032 美元和 0.042
    美元。企业级硬盘的价格通常是消费级的 1.5 倍以上。2017 年相对稳定的价格可能在 MAMR/HAMR 发布后被打破。 |

    | 存储容量 | 截至 2016 年，希捷已提供高达 60TB 的容量。120 至 512GB 的型号更为常见且价格较低。 | 2015 年和 2016 年分别提供了高达
    10TB 和 12TB 的 HDD。 |

    | 读写性能对称性 | 成本较低的 SSD 的写入速度通常显著低于读取速度（通常`≤`1/3）。高端 SSD 的读写速度预计相近。 | 由于较长的稳定时间，大多数
    HDD 的写入寻道时间略长/更差。 |

    | 空闲块可用性与 TRIM 命令 | 写入性能受空闲可编程块的可用性显著影响。TRIM 命令可以回收不再使用的旧数据块；然而，即使使用 TRIM，空闲块较少也会导致性能下降。
    | CMR HDD 不会从 TRIM 中受益，因为它们不受空闲块影响。然而，SMR 的性能也受空闲区域可用性的限制。脏区域有时需要 TRIM。 |

    | 功耗 | 基于闪存的高性能 SSD 通常需要 HDD 功耗的 1/2 到 1/3。新兴技术如 PCM/RRAM 更加节能。^(¹⁵) | 2.5 英寸硬盘通常消耗
    2 至 5 瓦，而一些最高性能的 3.5 英寸硬盘平均功耗约为 12 瓦，最高可达约 20 瓦。一些针对绿色数据中心设计的特殊硬盘会在必要时使磁盘进入空闲/睡眠状态。1.8
    英寸规格的低功耗 HDD 在空闲模式下功耗可能低至 0.35 瓦。^(¹⁶) |

    '
- fmt: "# 总结：NAND SSD 的 SWOT 分析\n\n- **优势**\n    - 一项成熟的技术，被工业界广泛采用\n    - 大容量/高密度，适用于\
    \ 3D 技术\n    - 与 NOR 相比，每个器件组只需要一个漏极接触点\n    - 每 GB 成本相对低于其他新兴 NVM 类型\n- **劣势**\n\
    \    - 非对称性能（写入速度慢于读取速度）\n    - 编程/擦除周期（基于块，不支持原地写入）\n    - 数据保持能力（随着闪存尺寸缩小，保持能力变差）\n\
    \    - 耐久性（与 HDD 和其他新兴 NVM 相比，写入周期有限）比 DRAM 慢 100-1000 倍\n    - 比 PCM 和 FeRAM\
    \ 慢 10-1000 倍\n    - 通常，容量越高，性能越低。\n- **机会**\n    - 扩展仅专注于密度；密度普遍高于磁性 HDD。\n \
    \   - 成本降低，在不久的将来将与 HDD 相当。\n    - 尽管复杂，但存在 3D 方案。\n    - 结合精细调整的磨损均衡算法，耐用性得到一定程度的提升。\n\
    \    - 在数据中心中作为主流选择替代 HDD（特别是全闪存阵列），尽管混合基础设施仍将存在数年。\n- **威胁**\n    - 与 NAND 配置相比，NOR\
    \ 架构中使用的额外连接提供了一些额外的灵活性。\n    - MRAM/ReRAM 的积极发展可能会动摇 NAND 闪存的主导地位。\n\n真正的问题是这两种技术的市场份额。如何衡量市场份额很重要。按金额计算与按比特计算会得到截然不同的答案。在金额方面，SSD\
    \ 将在不久的将来迅速超过 HDD 的支出，而按比特计算，HDD 仍将在未来几年占据主导地位。\n\n还有一些其他使用闪存的存储设备。闪存盘与 SSD 类似，但速度慢得多，通常用于移动应用。金士顿数字公司在\
    \ 2017 年初发布了容量为 1TB、采用 USB 3.0 接口（数据传输速度高达 240 MB/s 读取和 160 MB/s 写入）的驱动器，并在 2017\
    \ 年底发布了 2TB 驱动器（高达 300 MB/s 读取和 200 MB/s 写入），其速度与 HDD 相似。\n\n小型存储卡也广泛用于电子设备，例如智能手机、平板电脑、相机等。一些常见的格式包括\
    \ `CompactFlash`、`Memory Stick`、`SD/MicroSD/MiniSD` 和 `xD`。闪迪公司于 2016 年 9 月推出了容量高达\
    \ 1TB 的 `Extreme Pro` 系列 SD 产品，并于 2017 年 8 月推出了容量高达 400GB 的 `MicroSD`。\n\n## 混合硬盘\n\
    \n混合硬盘是一种逻辑或物理存储设备，它将快速存储介质（如 NAND/NOR 闪存 SSD）集成到慢速介质（如 HDD）中 [15]。混合硬盘中的快速设备既可以充当\
    \ HDD 上存储数据的缓存，也可以充当与 HDD 对等的层。通常，其目的是通过在更快的组件上保留最常用数据（热数据）的副本来提高整体性能。早在 2000\
    \ 年代中期，三星和希捷等一些硬盘制造商就提出了通过 SSD 在 HDD 内部提升性能的理论。2007 年，三星和希捷推出了第一款混合硬盘，分别采用了希捷\
    \ `Momentus PSD` 和三星 `SpinPoint MH80` 产品。\n\n通常有两种类型的混合磁盘。一种是双驱动器结构（分层结构），其中 SSD\
    \ 是快速层，HDD 是慢速层。通常，操作系统会将设备识别为两个子存储设备。西部数据 2013 年推出的 `Black2` 产品和 2015 年底推出的 `TarDisk`\
    \ 的 `TarDisk Pear` 是双驱动器设备的两个例子。另一种是集成结构（固态混合硬盘，SSHD），其中 SSD 充当缓存 [16]。用户或操作系统可能只看到一个存储设备，而无需进行特定操作。\n\
    \n混合磁盘驱动器可以在自优化（自学习）模式或主机优化模式下运行。在自优化操作模式下，SSHD 独立于主机操作系统工作，因此设备驱动器决定与 HDD 和 SSD\
    \ 之间的数据识别和迁移相关的所有操作。此模式使驱动器对主机系统而言，其外观和操作方式与传统的驱动器完全相同。典型的驱动器是希捷的 `Mobile` 和 `Laptop\
    \ SSHD`。主机优化模式也称为主机提示模式，因此主机通过 SATA 接口（自 SATA 3.2 版本起）决定 HDD 和 SSD 中的数据分配。此模式通常需要操作系统的软件/驱动程序支持。微软从\
    \ Windows 8.1 开始支持主机提示操作（8 版本有补丁可用），而针对 Linux 内核的补丁自 2014 年 10 月起已开发。西部数据的第一代\
    \ SSHD 属于此类。\n\n由于一些固有的局限性，混合磁盘驱动器的市场可能很狭窄：\n\n- 性能通常严重依赖于应用程序/工作负载。但驱动器可能不够智能，以至于受到其资源的限制。\n\
    - 由于关于工作负载的信息较少，块级优化并不比文件/对象级优化更好或更差。因此，不建议在驱动器级别优化工作负载。\n- 由于混合磁盘的配置相对静态，它不太适合数据中心基础设施的通用目的。\n\
    \n对于写入路径，一些高端 SSD 使用一些保持电容器来模拟 SCM（参见本章“存储设备”部分）与 DRAM 配合使用。这基本上解决了回写问题。对于读取路径，客户通常更倾向于自己管理不同的存储速度层。他们非常关心访问延迟的变化，而混合系统在这方面表现很差。在超大规模或公共云基础设施中，几乎没有采用基础设施管理的混合存储。混合结构的部署很多。它只是在更高的层次上进行管理，而不是在基础设施本身。表\
    \ [1-3](#468166_1_En_1_Chapter.xhtml#Tab3) 提供了更多细节。\n\n**表 1-3** 一些 NVM 的比较\n\n\
    | | STT-MRAM | PCMS 3D Xpoint | ReRAM | Flash NAND |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| 读取延迟 | < 10ns | < 100ns | < 10ns | 10–100us |\n| 写入延迟 | 5ns | >\
    \ 150ns | 50ns | > 100us |\n| 功耗 | 中等 | 中等 | 中等 | 高 |\n| 价格 (2016) | 200*−*3000*/*\
    \ Gb | *≤* 0*.*5/Gb | 100/Gb | *≤* 0*.*05/Gb |\n| 耐久性 (Nb 周期) | 10^(12) 至 无限 |\
    \ 10⁸*−*10⁹ | 10⁵−10^(10) | 10⁵*−*10⁶ |"
  raw: "In summary, here is a SWOT analysis for NAND SSD:\n\n*   Strength\n    * \
    \  A mature technology widely employed by industries\n\n*   Large scale/density,\
    \ applicable for 3D techniques\n\n*   A single drain contact per device group\
    \ is required compared with NOR.\n\n*   Relatively cheaper than other emerging\
    \ NVM types for dollar/GB\n\n*   Weakness\n    *   Asymmetric performance (slower\
    \ write than read)\n\n*   Program/erase cycle (block-based, no write-in-place)\n\
    \n*   Data retention (retention gets worse as flash scales down)\n\n*   Endurance\
    \ (limited write cycle compared with HDD and other emerging NVMs) 100-1000 slower\
    \ than DRAM\n\n*   10-1000 slower than PCM and FeRAM\n\n*   Usually, the higher\
    \ the capacity, the lower the performance.\n\n*   Opportunity\n    *   Scaling\
    \ focused solely on density; density is higher than magnetic HDD in general.\n\
    \n*   Decreased cost, which will be comparable with HDD in the near future\n\n\
    *   3D schemes exist despite of complexity\n\n*   Durability is improved to a\
    \ certain degree together with fine-tuned wearing leverage algorithms.\n\n*  \
    \ Replacement for HDD in data centers as a mainstream choice (in particular, an\
    \ all-flash array), although hybrid infrastructures will remain for some years.\n\
    \n*   Threat\n    *   The extra connections used in the NOR architecture provide\
    \ some additional flexibility when compared to NAND configuration.\n\n*   The\
    \ active development of MRAM/ReRAM may shake NAND flash’s dominate position.\n\
    \nThe real question is the market share of the two technologies. It is important\
    \ how you measure the market share. By money gets you a very different answer\
    \ than by bit. In the money arena, SSDs will rapidly overtake HDDs spend in the\
    \ very near future, while by bit, HDDs will still dominate for some years.\n\n\
    There are some other storage devices using flash memory. Flash thumb drives are\
    \ similar to SSD but with much lower speed and they are commonly used for mobile\
    \ applications. Kingston Digital released 1TB capacity drives with an USB 3.0\
    \ interface (data transfer speeds up to 240 MB/s read and 160 MB/s write) in early\
    \ 2017 and 2TB drives (up to 300 MB/s read and 200 MB/s write) in late 2017, which\
    \ is similar to HDD’s speed.\n\nSmall form size memory cards are also widely used\
    \ in electronic devices, such as smartphones, tablets, cameras, and so on. Some\
    \ common formats include CompactFlash, Memory Stick, SD/MicroSD/MiniSD, and xD.\
    \ SanDisk introduced up to 1TB size of Extreme Pro series SD products in September\
    \ 2016 and MicroSD up to 400GB in August 2017.\n\n### Hybrid Disk\n\nA hybrid\
    \ drive is a logical or physical storage device that integrate a fast storage\
    \ medium such as a NAND/NOR flash SSD into a slow medium such as a HDD [15]. The\
    \ fast device in a hybrid drive can act either as a cache for the data stored\
    \ on the HDD or as a tier peering to HDD. In generally, the purpose is to improve\
    \ the overall performance by keeping copies of the most frequently used data (hot\
    \ data) on the faster component. Back in the mid-2000s, some hard drive manufacturers\
    \ like Samsung and Seagate theorized the performance boost via SSD inside HDD.\
    \ In 2007, Samsung and Seagate introduced the first hybrid drives using the Seagate\
    \ Momentus PSD and Samsung SpinPoint MH80 products.\n\nThere are generally two\
    \ types of hybrid disks. One is of a dual-drive structure (the tiering structure)\
    \ where the SSD is the fast tier and HDD is the slow tier. Usually, the OS will\
    \ recognize the devices with two sub-storage devices. Western Digital’s Black2\
    \ products introduced in 2013 and TarDisk’s TarDisk Pear in late 2015 are two\
    \ examples of dual-drive devices. The other is an integrated structure (solid-state\
    \ hybrid drive, SSHD) where the SSD acts as cache [16]. Users or OSs may see one\
    \ storage device only without specific operations.\n\nThe hybrid disk drive can\
    \ operate in either self-optimized (self-learning) mode or host-optimized mode.\
    \ In the self-optimized mode of operation, the SSHD works independently from the\
    \ host OS, so device drives determine all actions related to data identification\
    \ and migration between the HDD and SSD. This mode lets the drive appear and operate\
    \ to a host system exactly like a traditional drive. A typical drive is Seagate’s\
    \ Mobile and Laptop SSHD. Host- optimized mode is also called host-hinted mode,\
    \ so the host makes the decision for the data allocations in HDD and SSD via SATA\
    \ interface (since SATA version 3.2). This mode usually requires software/driver\
    \ support from the OSs. Microsoft started to support the host-hinted operations\
    \ in Windows 8.1 (a patch for version 8 is available), while patches for the Linux\
    \ kernel have been developed since October 2014\\. Western Digital’s first generation\
    \ of SSHDs is in this category.\n\nThe market of hybrid disk drives may be narrow\
    \ due to some inherited limitations:\n\n*   The performance is heavily application/workload\
    \ dependent usually. But the drive may not be smart enough to be constrained by\
    \ its resource.\n\n*   Block level optimization is no better or worse than file/object\
    \ level optimization due to less information on the workload. Thus it is not recommended\
    \ to optimize the workload in the drive level.\n\n*   It is not well suited for\
    \ a data center infrastructure’s general purpose due to relatively static configurations\
    \ of hybrid disks.\n\nFor the write path, some hold-up capacitors are used to\
    \ simulate SCM (see the “Storage Devices” section of this chapter) with DRAM in\
    \ some high-end SSDs. This essentially solves the write back problem. For the\
    \ read path, customers generally prefer to manage different speed tiers of storage\
    \ by themselves. They are very concerned with the access latency variance, and\
    \ hybrid systems are very poor in this area. There is virtually no uptake of infrastructure-managed\
    \ hybrid storage in Hyperscale or public cloud infrastructure. There are lots\
    \ of deployments of hybrid structures. It is just managed at higher layers, not\
    \ in the infrastructure itself. Table [1-3](#468166_1_En_1_Chapter.xhtml#Tab3)\
    \ provides more details.\n\nTable 1-3\n\nComparison of Some NVMs\n\n|   | STT-MRAM\
    \ | PCMS 3D Xpoint | ReRAM | Flash NAND |\n| --- | --- | --- | --- | --- |\n|\
    \ Read latency | < 10ns | < 100ns | < 10ns | 10–100us |\n| Write latency | 5ns\
    \ | > 150ns | 50ns | > 100us |\n| Power consumption | Medium | Medium | Medium\
    \ | High |\n| Price (2016) | 200*−*3000*/* Gb | *≤* 0*.*5/Gb | 100/Gb | *≤* 0*.*05/Gb\
    \ |\n| Endurance(Nb cycles) | 10^(12)   to  unlimited | 10⁸*−*10⁹ | 10⁵−10^(10)\
    \ | 10⁵*−*10⁶ |"
  trans: "\n# 总结：NAND SSD 的 SWOT 分析\n\n- **优势**\n    - 一项成熟的技术，被工业界广泛采用\n    - 大容量/高密度，适用于\
    \ 3D 技术\n    - 与 NOR 相比，每个器件组只需要一个漏极接触点\n    - 每 GB 成本相对低于其他新兴 NVM 类型\n- **劣势**\n\
    \    - 非对称性能（写入速度慢于读取速度）\n    - 编程/擦除周期（基于块，不支持原地写入）\n    - 数据保持能力（随着闪存尺寸缩小，保持能力变差）\n\
    \    - 耐久性（与 HDD 和其他新兴 NVM 相比，写入周期有限）比 DRAM 慢 100-1000 倍\n    - 比 PCM 和 FeRAM\
    \ 慢 10-1000 倍\n    - 通常，容量越高，性能越低。\n- **机会**\n    - 扩展仅专注于密度；密度普遍高于磁性 HDD。\n \
    \   - 成本降低，在不久的将来将与 HDD 相当。\n    - 尽管复杂，但存在 3D 方案。\n    - 结合精细调整的磨损均衡算法，耐用性得到一定程度的提升。\n\
    \    - 在数据中心中作为主流选择替代 HDD（特别是全闪存阵列），尽管混合基础设施仍将存在数年。\n- **威胁**\n    - 与 NAND 配置相比，NOR\
    \ 架构中使用的额外连接提供了一些额外的灵活性。\n    - MRAM/ReRAM 的积极发展可能会动摇 NAND 闪存的主导地位。\n\n真正的问题是这两种技术的市场份额。如何衡量市场份额很重要。按金额计算与按比特计算会得到截然不同的答案。在金额方面，SSD\
    \ 将在不久的将来迅速超过 HDD 的支出，而按比特计算，HDD 仍将在未来几年占据主导地位。\n\n还有一些其他使用闪存的存储设备。闪存盘与 SSD 类似，但速度慢得多，通常用于移动应用。金士顿数字公司在\
    \ 2017 年初发布了容量为 1TB、采用 USB 3.0 接口（数据传输速度高达 240 MB/s 读取和 160 MB/s 写入）的驱动器，并在 2017\
    \ 年底发布了 2TB 驱动器（高达 300 MB/s 读取和 200 MB/s 写入），其速度与 HDD 相似。\n\n小型存储卡也广泛用于电子设备，例如智能手机、平板电脑、相机等。一些常见的格式包括\
    \ `CompactFlash`、`Memory Stick`、`SD/MicroSD/MiniSD` 和 `xD`。闪迪公司于 2016 年 9 月推出了容量高达\
    \ 1TB 的 `Extreme Pro` 系列 SD 产品，并于 2017 年 8 月推出了容量高达 400GB 的 `MicroSD`。\n\n## 混合硬盘\n\
    \n混合硬盘是一种逻辑或物理存储设备，它将快速存储介质（如 NAND/NOR 闪存 SSD）集成到慢速介质（如 HDD）中 [15]。混合硬盘中的快速设备既可以充当\
    \ HDD 上存储数据的缓存，也可以充当与 HDD 对等的层。通常，其目的是通过在更快的组件上保留最常用数据（热数据）的副本来提高整体性能。早在 2000\
    \ 年代中期，三星和希捷等一些硬盘制造商就提出了通过 SSD 在 HDD 内部提升性能的理论。2007 年，三星和希捷推出了第一款混合硬盘，分别采用了希捷\
    \ `Momentus PSD` 和三星 `SpinPoint MH80` 产品。\n\n通常有两种类型的混合磁盘。一种是双驱动器结构（分层结构），其中 SSD\
    \ 是快速层，HDD 是慢速层。通常，操作系统会将设备识别为两个子存储设备。西部数据 2013 年推出的 `Black2` 产品和 2015 年底推出的 `TarDisk`\
    \ 的 `TarDisk Pear` 是双驱动器设备的两个例子。另一种是集成结构（固态混合硬盘，SSHD），其中 SSD 充当缓存 [16]。用户或操作系统可能只看到一个存储设备，而无需进行特定操作。\n\
    \n混合磁盘驱动器可以在自优化（自学习）模式或主机优化模式下运行。在自优化操作模式下，SSHD 独立于主机操作系统工作，因此设备驱动器决定与 HDD 和 SSD\
    \ 之间的数据识别和迁移相关的所有操作。此模式使驱动器对主机系统而言，其外观和操作方式与传统的驱动器完全相同。典型的驱动器是希捷的 `Mobile` 和 `Laptop\
    \ SSHD`。主机优化模式也称为主机提示模式，因此主机通过 SATA 接口（自 SATA 3.2 版本起）决定 HDD 和 SSD 中的数据分配。此模式通常需要操作系统的软件/驱动程序支持。微软从\
    \ Windows 8.1 开始支持主机提示操作（8 版本有补丁可用），而针对 Linux 内核的补丁自 2014 年 10 月起已开发。西部数据的第一代\
    \ SSHD 属于此类。\n\n由于一些固有的局限性，混合磁盘驱动器的市场可能很狭窄：\n\n- 性能通常严重依赖于应用程序/工作负载。但驱动器可能不够智能，以至于受到其资源的限制。\n\
    - 由于关于工作负载的信息较少，块级优化并不比文件/对象级优化更好或更差。因此，不建议在驱动器级别优化工作负载。\n- 由于混合磁盘的配置相对静态，它不太适合数据中心基础设施的通用目的。\n\
    \n对于写入路径，一些高端 SSD 使用一些保持电容器来模拟 SCM（参见本章“存储设备”部分）与 DRAM 配合使用。这基本上解决了回写问题。对于读取路径，客户通常更倾向于自己管理不同的存储速度层。他们非常关心访问延迟的变化，而混合系统在这方面表现很差。在超大规模或公共云基础设施中，几乎没有采用基础设施管理的混合存储。混合结构的部署很多。它只是在更高的层次上进行管理，而不是在基础设施本身。表\
    \ 1-3 提供了更多细节。\n\n**表 1-3** 一些 NVM 的比较\n\n| | STT-MRAM | PCMS 3D Xpoint | ReRAM\
    \ | Flash NAND |\n| :--- | :--- | :--- | :--- | :--- |\n| 读取延迟 | < 10ns | < 100ns\
    \ | < 10ns | 10–100us |\n| 写入延迟 | 5ns | > 150ns | 50ns | > 100us |\n| 功耗 | 中等\
    \ | 中等 | 中等 | 高 |\n| 价格 (2016) | 200*−*3000*/* Gb | *≤* 0*.*5/Gb | 100/Gb | *≤*\
    \ 0*.*05/Gb |\n| 耐久性 (Nb 周期) | 10¹² 至 无限 | 10⁸*−*10⁹ | 10⁵−10¹⁰ | 10⁵*−*10⁶ |\n"
- fmt: "### Tape and Disc\n\nMagnetic tape was first used to record computer data\
    \ in 1951. It usually works with some specific tape drives only. Despite its slow\
    \ speed, it is still widely used for cold data archiving. `IBM` and `FujiFilm`\
    \ demonstrated a prototype `BaFe Tape` with 123 `Gb/in²` areal density and 220TB\
    \ cartridge capacity in 2015. `Sony` and `IBM` further increased this number to\
    \ 201 `Gb/in²` and 330TB into a tiny tape cartridge in 2017.^([^(17)](#fn17))\
    \ Instead of magnetic materials painted on the surface of conventional tape, `Sony`\
    \ used a “sputtering” method to coat the tape with a multilayer magnetic metal\
    \ film, which is thinner with narrower grains using vertical bits. Note that tape\
    \ and HDD share many similarities in the servo control, such as servo pattern\
    \ and nanometer precision.\n\nAn optical disc is a flat, usually circular disc\
    \ that encodes binary data (bits) in the form of pits. An early optical disc system\
    \ can be traced back to 1935. Since then, there have been four generations (a\
    \ CD of about 700MB in the first generation, a DVD of about 4.7GB in the second\
    \ generation, a standard Blu-ray disc of about 25GB in the third generation, and\
    \ a fourth generation disc with more than 1TB data).\n\nBoth magnetic tapes and\
    \ optical discs are usually accessed sequentially only. Some recent developments\
    \ use robot arms make the change of tape/disc automatically. It is expected that\
    \ tape and optical disc may still be active in the market for some years. In particular,\
    \ due to much lower price per GB than other media, the tape seems to have a large\
    \ potential market for extremely cold storage.\n\n### Emerging NVMs\n\nThere are\
    \ also many types of emerging NVMs on the way to mature or under an early stage\
    \ of development [17, 10]:\n\n- Phase-change memory (PCM), such as 3D X-point\n\
    - Magnetoresistive RAM (MRAM), such as STTRAM and Racetrack memory\n- Resistive\
    \ RAM (RRAM/ReRAM), such as Memristor, Conductive-bridging RAM (CBRAM), Oxy-ReRAM\n\
    - Ferroelectric RAM (FeRAM), such as FeFET\n- Others, such as conductive metal\
    \ oxide (CMOx), solid electrolyte, NRAM (nano RAM), ZRAM (zero-capacitor), quantum\
    \ dot RAM, carbon nanotubes, polymer printed memory, etc.\n\n`STT-MRAM` [18] (spin-transfer\
    \ torque MRAM), using electron spin-induced change in magnetic moment, can replace\
    \ low-density SRAM and DRAM, particularly for mobile and storage devices. Phase-change\
    \ memory (PCM), making thermally induced physical phase changes between amorphous\
    \ and crystalline states, has the ability to achieve a number of distinct intermediary\
    \ states, thereby having the ability to hold multiple bits in a single cell. `PCMS\
    \ 3D Xpoint`, announced by `Intel` and `Micron` in 2015, is based on changes in\
    \ the resistance of the bulk material faster and is more stable than traditional\
    \ PCM materials. `ReRAM/CBRAM` (conductive-bridging RAM) uses a metallic filament\
    \ formation in electrolyte to storage, and `FeRAM` uses a ferroelectric layer\
    \ instead of a dielectric layer to achieve nonvolatility [1]. Table [1-3](#468166_1_En_1_Chapter.xhtml#Tab3)\
    \ shows a simple comparison of them with NAND. A few of them could be in mass\
    \ production within the next few years [19], although it might be still early\
    \ to confirm which NVM technique is a winner in the competition, as they have\
    \ their advantages and disadvantages. For example, let’s use PCM as an example\
    \ for its SWOT analysis.\n\n- Strength\n    - Relatively mature (large-scale demos\
    \ and products) compared with other emerging NVMs\n    - Industry consensus on\
    \ materials, like `GeSbTe` or `GST`\n    - Large resistance contrast, which leads\
    \ to analog states for MLC\n    - Much longer endurance than NAND Flash\n    -\
    \ High scalability (still works at ultra-small F) and back-end-of-the-line compatibility\n\
    \    - Potential very high speed (depending on material and doping)\n- Weakness\n\
    \    - RESET step to high resistance requires melting − > power-hungry and thermal\
    \ crosstalk?\n    - To keep switching power down − > sub-lithographic feature\
    \ and high-current access device\n    - To fill a small feature − > atomic layer\
    \ deposition or chemical vapor deposition techniques − > difficult now to replace\
    \ `GST` with a better material\n    - MLC strongly impacted by relaxation of amorphous\
    \ phase − > resistance drift\n    - 10-year retention at elevated temperatures\
    \ (resistance drafts with time) can be an issue − > recrystallization\n    - Device\
    \ characteristics change over time due to elemental segregation − > device failure\n\
    \    - Variability in small features broadens resistance distributions\n- Opportunity\n\
    \    - An order of magnitude lead over `FeRAM`, `MRAM`, etc.\n    - NOR-replacement\
    \ products now shipping − > if yield-learning successful and MLC (3-4 bits per\
    \ cell successfully implemented in PCM technologies despite R-drift phenomenon\
    \ in 2016)\n    - Good for embedded NVM for SoC, Neuromorphic\n    - Drift-mitigation\
    \ and/or 3D access devices can offer high-density (i.e., low-cost), which means\
    \ the opportunity for NAND replacement. Finally S-type, and then M-type SCM may\
    \ follow.\n    - Projected to reach 1.5B USD with an impressive CAGR of almost\
    \ 84% by 2021\n- Threat\n    - Attained speed in practice is much slower than\
    \ the theoretical speed; slow NOR-like interfaces\n    - The current PCM SSD is\
    \ only several times faster than SLC SSD, which is far away from the projection.\n\
    \    - DRAM/SRAM replacement may be challenging due to fundamental endurance limitation.\n\
    \    - PCM as a DRAM segment accounted for the major shares and dominated the\
    \ market during 2016, which means a long way for S-SCM.\n    - A key challenge\
    \ is to reduce reset (write) current; contact dimension scaling will help, but\
    \ will slow progress.\n    - Engineering process\n\nNAND techniques are also under\
    \ active development, in particular, the 3D NAND. Compared with these emerging\
    \ NVMs, NAND is relatively mature, dense, and cheap. However, it could be much\
    \ slower than PCM and ReRAM. Meanwhile, its durance may be significantly lower\
    \ than PCM, MRAM, and FeRAM in general.\n\nBased on these NVMs, a special category\
    \ called SCM (storage class memory) is introduced to fill the IO gap between SSD\
    \ and DRAM (although it was initially for the gap between HDD and DRAM from IBM).\
    \ It is further divided into storage-type SCM and memory-type SCM, depending on\
    \ whether their speed is in magnitudes of microseconds or nanoseconds. Improved\
    \ flash with 3D techniques, PCM, MRAM, RRAM, and FeRAM are some major techniques\
    \ applied to SCM. This wide deployment of SCM to the computer/network systems\
    \ and IoT systems will reshape the current architectures. In the very near future,\
    \ we can see the impact of SCM to in-memory computing (e.g., application in cognitive\
    \ computing), hyper-converge infrastructure, hybrid storage/cloud infrastructure\
    \ (with remote direct memory access), etc. A brief outlook of these NVMs is illustrated\
    \ in Figure [1-6](#468166_1_En_1_Chapter.xhtml#Fig6), which is modified from the\
    \ IBM’s prediction.^([^(18)](#fn18)) In fact, the commercial version of `Optane\
    \ P4800X` using 3D PCM-like techniques by `Intel` released in Nov 2017 has 750GB\
    \ in capacity, 550K in IOPS, and 2.4/2.0 GB/ps in R/W throughput, while `Z-NAND`,\
    \ a variant of 3D NAND by `Samsung` released in Jan 2018, has 800GB in capacity,\
    \ 750K/150K in R/W IOPS, and 3.2 GB/ps in throughput.\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig6_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig6_HTML.jpg)\n\
    \nFigure 1-6\n\nCompetitive outlook among emerging NVMs\n\nAccording to Yole Development’s\
    \ recent estimation,^([^(19)](#fn19)) the emerging NVM market will reach USD 4.6\
    \ billion by 2021, exhibiting an impressive growth of +110% per year, although\
    \ the market size in 2015 was USD 53 million only. SCM will be the clear go-to\
    \ market for emerging NVM in 2021. `Marketsandmarkets`^([^(20)](#fn20)) also predicts\
    \ that the global non-volatile memory market is expected to reach USD 82.03 billion\
    \ by 2022, at a CAGR of 9.50% between 2017 and 2022."
  raw: "### Tape and Disc\n\nMagnetic tape was first used to record computer data\
    \ in 1951\\. It usually works with some specific tape drives only. Despite its\
    \ slow speed, it is still widely used for cold data archiving. IBM and FujiFilm\
    \ demonstrated a prototype BaFe Tape with 123 Gb/in² areal density and 220TB cartridge\
    \ capacity in 2015\\. Sony and IBM further increased this number to 201 Gb/in²\
    \ and 330TB into a tiny tape cartridge in 2017.^([^(17)](#fn17)) Instead of magnetic\
    \ materials painted on the surface of conventional tape, Sony used a “sputtering”\
    \ method to coat the tape with a multilayer magnetic metal film, which is thinner\
    \ with narrower grains using vertical bits. Note that tape and HDD share many\
    \ similarities in the servo control, such as servo pattern and nanometer precision.\n\
    \nAn optical disc is a flat, usually circular disc that encodes binary data (bits)\
    \ in the form of pits. An early optical disc system can be traced back to 1935\\\
    . Since then, there have been four generations (a CD of about 700MB in the first\
    \ generation, a DVD of about 4.7GB in the second generation, a standard Blu-ray\
    \ disc of about 25GB in the third generation, and a fourth generation disc with\
    \ more than 1TB data).\n\nBoth magnetic tapes and optical discs are usually accessed\
    \ sequentially only. Some recent developments use robot arms make the change of\
    \ tape/disc automatically. It is expected that tape and optical disc may still\
    \ be active in the market for some years. In particular, due to much lower price\
    \ per GB than other media, the tape seems to have a large potential market for\
    \ extremely cold storage.\n\n### Emerging NVMs\n\nThere are also many types of\
    \ emerging NVMs on the way to mature or under an early stage of development [17,\
    \ 10]:\n\n*   Phase-change memory (PCM), such as 3D X-point\n\n*   Magnetoresistive\
    \ RAM (MRAM), such as STTRAM and Racetrack memory\n\n*   Resistive RAM (RRAM/ReRAM),\
    \ such as Memristor, Conductive-bridging RAM (CBRAM), Oxy-ReRAM\n\n*   Ferroelectric\
    \ RAM (FeRAM), such as FeFET\n\n*   Others, such as conductive metal oxide (CMOx),\
    \ solid electrolyte, NRAM (nano RAM), ZRAM (zero-capacitor), quantum dot RAM,\
    \ carbon nanotubes, polymer printed memory, etc.\n\nSTT-MRAM [18] (spin-transfer\
    \ torque MRAM), using electron spin-induced change in magnetic moment, can replace\
    \ low-density SRAM and DRAM, particularly for mobile and storage devices. Phase-change\
    \ memory (PCM), making thermally induced physical phase changes between amorphous\
    \ and crystalline states, has the ability to achieve a number of distinct intermediary\
    \ states, thereby having the ability to hold multiple bits in a single cell. PCMS\
    \ 3D Xpoint, announced by Intel and Micron in 2015, is based on changes in the\
    \ resistance of the bulk material faster and is more stable than traditional PCM\
    \ materials. ReRAM/CBRAM (conductive-bridging RAM) uses a metallic filament formation\
    \ in electrolyte to storage, and FeRAM uses a ferroelectric layer instead of a\
    \ dielectric layer to achieve nonvolatility [1]. Table [1-3](#468166_1_En_1_Chapter.xhtml#Tab3)\
    \ shows a simple comparison of them with NAND. A few of them could be in mass\
    \ production within the next few years [19], although it might be still early\
    \ to confirm which NVM technique is a winner in the competition, as they have\
    \ their advantages and disadvantages. For example, let’s use PCM as an example\
    \ for its SWOT analysis.\n\n*   Strength\n    *   Relatively mature (large-scale\
    \ demos and products) compared with other emerging NVMs\n\n*   Industry consensus\
    \ on materials, like GeSbTe or GST\n\n*   Large resistance contrast, which leads\
    \ to analog states for MLC\n\n*   Much longer endurance than NAND Flash\n\n* \
    \  High scalability (still works at ultra-small F) and back-end-of-the-line compatibility\n\
    \n*   Potential very high speed (depending on material and doping)\n\n*   Weakness\n\
    \    *   RESET step to high resistance requires melting − > power-hungry and thermal\
    \ crosstalk?\n\n*   To keep switching power down − > sub-lithographic feature\
    \ and high-current access device\n\n*   To fill a small feature − > atomic layer\
    \ deposition or chemical vapor deposition techniques − > difficult now to replace\
    \ GST with a better material\n\n*   MLC strongly impacted by relaxation of amorphous\
    \ phase − > resistance drift\n\n*   10-year retention at elevated temperatures\
    \ (resistance drafts with time) can be an issue − > recrystallization\n\n*   Device\
    \ characteristics change over time due to elemental segregation − > device failure\n\
    \n*   Variability in small features broadens resistance distributions\n\n*   Opportunity\n\
    \    *   An order of magnitude lead over FeRAM, MRAM, etc.\n\n*   NOR-replacement\
    \ products now shipping − > if yield-learning successful and MLC (3-4 bits per\
    \ cell successfully implemented in PCM technologies despite R-drift phenomenon\
    \ in 2016)\n\n*   Good for embedded NVM for SoC, Neuromorphic\n\n*   Drift-mitigation\
    \ and/or 3D access devices can offer high-density (i.e., low-cost), which means\
    \ the opportunity for NAND replacement. Finally S-type, and then M-type SCM may\
    \ follow.\n\n*   Projected to reach 1.5B USD with an impressive CAGR of almost\
    \ 84% by 2021\n\n*   Threat\n    *   Attained speed in practice is much slower\
    \ than the theoretical speed; slow NOR-like interfaces\n\n*   The current PCM\
    \ SSD is only several times faster than SLC SSD, which is far away from the projection.\n\
    \n*   DRAM/SRAM replacement may be challenging due to fundamental endurance limitation.\n\
    \n*   PCM as a DRAM segment accounted for the major shares and dominated the market\
    \ during 2016, which means a long way for S-SCM.\n\n*   A key challenge is to\
    \ reduce reset (write) current; contact dimension scaling will help, but will\
    \ slow progress.\n\n*   Engineering process\n\nNAND techniques are also under\
    \ active development, in particular, the 3D NAND. Compared with these emerging\
    \ NVMs, NAND is relatively mature, dense, and cheap. However, it could be much\
    \ slower than PCM and ReRAM. Meanwhile, its durance may be significantly lower\
    \ than PCM, MRAM, and FeRAM in general.\n\nBased on these NVMs, a special category\
    \ called SCM (storage class memory) is introduced to fill the IO gap between SSD\
    \ and DRAM (although it was initially for the gap between HDD and DRAM from IBM).\
    \ It is further divided into storage-type SCM and memory-type SCM, depending on\
    \ whether their speed is in magnitudes of microseconds or nanoseconds. Improved\
    \ flash with 3D techniques, PCM, MRAM, RRAM, and FeRAM are some major techniques\
    \ applied to SCM. This wide deployment of SCM to the computer/network systems\
    \ and IoT systems will reshape the current architectures. In the very near future,\
    \ we can see the impact of SCM to in-memory computing (e.g., application in cognitive\
    \ computing), hyper-converge infrastructure, hybrid storage/cloud infrastructure\
    \ (with remote direct memory access), etc. A brief outlook of these NVMs is illustrated\
    \ in Figure [1-6](#468166_1_En_1_Chapter.xhtml#Fig6), which is modified from the\
    \ IBM’s prediction.^([^(18)](#fn18)) In fact, the commercial version of Optane\
    \ P4800X using 3D PCM-like techniques by Intel released in Nov 2017 has 750GB\
    \ in capacity, 550K in IOPS, and 2.4/2.0 GB/ps in R/W throughput, while Z-NAND,\
    \ a variant of 3D NAND by Samsung released in Jan 2018, has 800GB in capacity,\
    \ 750K/150K in R/W IOPS, and 3.2 GB/ps in throughput.\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig6_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig6_HTML.jpg)\n\
    \nFigure 1-6\n\nCompetitive outlook among emerging NVMs\n\nAccording to Yole Development’s\
    \ recent estimation,^([^(19)](#fn19)) the emerging NVM market will reach USD 4.6\
    \ billion by 2021, exhibiting an impressive growth of +110% per year, although\
    \ the market size in 2015 was USD 53 million only. SCM will be the clear go-to\
    \ market for emerging NVM in 2021. Marketsandmarkets^([^(20)](#fn20)) also predicts\
    \ that the global non-volatile memory market is expected to reach USD 82.03 billion\
    \ by 2022, at a CAGR of 9.50% between 2017 and 2022."
  trans: "\n### 磁带与光盘\n\n磁带于 1951 年首次用于记录计算机数据。它通常仅能与某些特定的磁带驱动器配合使用。尽管速度较慢，但它仍被广泛用于冷数据归档。`IBM`和`FujiFilm`在\
    \ 2015 年展示了一款原型`BaFe 磁带`，其面密度达到 123 `Gb/in²`，单盒容量为 220TB。`Sony`和`IBM`在 2017 年进一步将这一数字提升至\
    \ 201 `Gb/in²`，并在一个微型磁带盒中实现了 330TB 的容量。^(¹⁷) 与在传统磁带表面涂覆磁性材料不同，`Sony`采用“溅射”方法，在磁带上涂覆多层磁性金属薄膜，这种薄膜更薄，晶粒更窄，并采用垂直比特记录。请注意，磁带和硬盘驱动器在伺服控制方面有许多相似之处，例如伺服模式和纳米级精度。\n\
    \n光盘是一种扁平的、通常为圆形的盘片，以凹坑的形式编码二进制数据（比特）。早期的光盘系统可以追溯到 1935 年。此后，共经历了四代（第一代约 700MB\
    \ 的 CD，第二代约 4.7GB 的 DVD，第三代约 25GB 的标准蓝光光盘，以及第四代容量超过 1TB 的光盘）。\n\n磁带和光盘通常只能顺序访问。一些最新的发展利用机械臂来自动更换磁带或光盘。预计磁带和光盘在未来几年内仍将在市场上保持活跃。特别是，由于每\
    \ GB 价格远低于其他介质，磁带在极冷存储领域似乎拥有巨大的潜在市场。\n\n### 新兴非易失性存储器\n\n还有许多类型的新兴非易失性存储器正在走向成熟或处于早期开发阶段\
    \ [17, 10]：\n\n-   相变存储器（PCM），例如 3D X-point\n-   磁阻随机存取存储器（MRAM），例如 STTRAM 和赛道存储器\n\
    -   阻变式随机存取存储器（RRAM/ReRAM），例如忆阻器、导电桥接随机存取存储器（CBRAM）、Oxy-ReRAM\n-   铁电随机存取存储器（FeRAM），例如\
    \ FeFET\n-   其他类型，例如导电金属氧化物（CMOx）、固态电解质、NRAM（纳米随机存取存储器）、ZRAM（零电容随机存取存储器）、量子点随机存取存储器、碳纳米管、聚合物印刷存储器等。\n\
    \n`STT-MRAM` [18]（自旋转移矩 MRAM）利用电子自旋引起的磁矩变化，可以替代低密度的 SRAM 和 DRAM，尤其适用于移动和存储设备。相变存储器（PCM）通过在非晶态和晶态之间进行热诱导的物理相变，能够实现多个不同的中间状态，从而在单个单元中存储多个比特。`Intel`和`Micron`于\
    \ 2015 年发布的`PCMS 3D Xpoint`，基于体材料电阻的更快变化，且比传统 PCM 材料更稳定。`ReRAM/CBRAM`（导电桥接 RAM）利用电解质中金属细丝的形成来存储数据，而`FeRAM`则使用铁电层代替介电层来实现非易失性\
    \ [1]。表 1-3 展示了它们与 NAND 的简单比较。其中少数几种可能会在未来几年内实现量产 [19]，尽管现在断言哪种 NVM 技术能在竞争中胜出可能还为时过早，因为它们各有优缺点。例如，我们以\
    \ PCM 为例进行 SWOT 分析。\n\n-   优势\n    -   与其他新兴 NVM 相比，相对成熟（已有大规模演示和产品）\n    -  \
    \ 业界对材料（如`GeSbTe`或`GST`）已达成共识\n    -   电阻对比度大，可实现用于 MLC 的模拟状态\n    -   耐久性远高于\
    \ NAND 闪存\n    -   可扩展性高（在超小尺寸下仍能工作）且与后道工艺兼容\n    -   潜在的超高速度（取决于材料和掺杂）\n-   劣势\n\
    \    -   重置到高电阻状态需要熔化 -> 功耗高且存在热串扰？\n    -   为降低开关功耗 -> 需要亚光刻特征尺寸和高电流访问器件\n  \
    \  -   填充小特征尺寸 -> 需要原子层沉积或化学气相沉积技术 -> 目前难以用更好的材料替代`GST`\n    -   MLC 受非晶相弛豫影响严重\
    \ -> 电阻漂移\n    -   高温下 10 年数据保持（电阻随时间漂移）可能是个问题 -> 再结晶\n    -   由于元素偏析，器件特性随时间变化\
    \ -> 器件失效\n    -   小特征尺寸下的变异性会加宽电阻分布\n-   机会\n    -   领先于`FeRAM`、`MRAM`等一个数量级\n\
    \    -   替代 NOR 的产品现已出货 -> 如果良率学习成功且 MLC（尽管 2016 年存在 R 漂移现象，但在 PCM 技术中成功实现了每单元\
    \ 3-4 比特）\n    -   适用于 SoC、神经形态计算的嵌入式 NVM\n    -   漂移缓解和/或 3D 访问器件可提供高密度（即低成本），这意味着有机会替代\
    \ NAND。最终是 S 型，随后可能是 M 型 SCM。\n    -   预计到 2021 年将达到 15 亿美元，复合年增长率高达近 84%\n- \
    \  威胁\n    -   实际达到的速度远慢于理论速度；类似 NOR 的慢速接口\n    -   当前的 PCM SSD 仅比 SLC SSD 快几倍，远低于预期。\n\
    \    -   由于根本的耐久性限制，替代 DRAM/SRAM 可能具有挑战性。\n    -   PCM 作为 DRAM 细分市场在 2016 年占据了主要份额并主导了市场，这意味着\
    \ S-SCM 还有很长的路要走。\n    -   一个关键挑战是降低重置（写入）电流；接触尺寸缩放会有所帮助，但会减缓进展。\n    -   工程工艺\n\
    \nNAND 技术也在积极发展中，尤其是 3D NAND。与这些新兴 NVM 相比，NAND 相对成熟、密度高且便宜。然而，它可能比 PCM 和 ReRAM\
    \ 慢得多。同时，其耐久性通常可能显著低于 PCM、MRAM 和 FeRAM。\n\n基于这些 NVM，引入了一种称为 SCM（存储级内存）的特殊类别，以填补\
    \ SSD 和 DRAM 之间的 IO 差距（尽管最初是为了填补 IBM 提出的 HDD 和 DRAM 之间的差距）。根据其速度是微秒级还是纳秒级，它进一步分为存储型\
    \ SCM 和内存型 SCM。采用 3D 技术改进的闪存、PCM、MRAM、RRAM 和 FeRAM 是应用于 SCM 的一些主要技术。SCM 在计算机/网络系统和物联网系统中的广泛部署将重塑当前的架构。在不久的将来，我们将看到\
    \ SCM 对内存计算（例如，在认知计算中的应用）、超融合基础设施、混合存储/云基础设施（具有远程直接内存访问）等的影响。图 1-6 展示了这些 NVM 的简要展望，该图根据\
    \ IBM 的预测进行了修改。^(¹⁸) 事实上，`Intel`于 2017 年 11 月发布的采用类似 3D PCM 技术的商用版`Optane P4800X`，容量为\
    \ 750GB，IOPS 为 550K，读写吞吐量为 2.4/2.0 GB/ps；而`Samsung`于 2018 年 1 月发布的 3D NAND 变体`Z-NAND`，容量为\
    \ 800GB，读写 IOPS 为 750K/150K，吞吐量为 3.2 GB/ps。\n\n![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig6_HTML.jpg](img/468166_1_En_1_Fig6_HTML.jpg)\n\
    \n图 1-6\n\n新兴 NVM 的竞争前景\n\n根据 Yole Development 最近的估计，^(¹⁹) 新兴 NVM 市场到 2021 年将达到\
    \ 46 亿美元，年增长率高达+110%，尽管 2015 年的市场规模仅为 5300 万美元。到 2021 年，SCM 将成为新兴 NVM 明确的市场方向。`Marketsandmarkets`^(²⁰)\
    \ 也预测，全球非易失性存储器市场预计到 2022 年将达到 820.3 亿美元，2017 年至 2022 年间的复合年增长率为 9.50%。\n"
- fmt: '# Storage Systems


    This section discusses the system level storage infrastructure and implementation.
    `RAID` (redundant array of independent/inexpensive disks) and `EC` (erasure code)
    systems are mainly used for failure tolerance. Hybrid storage systems intend to
    achieve relatively high performance at low cost. Microserver and Ethernet drives
    have been employed in some object storage systems. Software-define systems separate
    the data flow and control flow. Some large-scale storage system implementations,
    like `Hadoop/Spark`, `OpenStack`, `Ceph`, are also introduced.


    ## Infrastructure: RAID and EC


    `RAID` as a data storage virtualization technology combines multiple physical
    drive components into a single logical unit or pool for the purposes of data redundancy,
    performance improvement, or both [20]. The Storage Networking Industry Association
    (SNIA) standardized `RAID` levels and their associated data formats from `RAID
    0` to `RAID 6`: “`RAID 0` consists of striping, without mirroring or parity. `RAID
    1` consists of data mirroring, without parity or striping. `RAID 2` consists of
    bit-level striping with dedicated Hammingcode parity. `RAID 3` consists of byte-level
    striping with dedicated parity. `RAID 4` consists of block-level striping with
    dedicated parity. `RAID 5` consists of block-level striping with distributed parity.
    `RAID 6` consists of block-level striping with double distributed parity.” `RAID
    2-4` are generally not for practical usage. `RAID` levels can be nested, as in
    hybrid `RAID`. For example, `RAID 10` and `50`, which is `RAID 1` and `5` based
    on `RAID 0`.


    `RAID` can be implemented by either hardware or software. Hardware `RAID` controllers
    are expensive and proprietary, and usually used in enterprise environments. Software-based
    implementations have gained more popularity recently. Some `RAID` software is
    provided by modern OSs and file systems, such as `Linux`, `ZFS`, `GPFS`, and `Btrfs`.
    Hardware-assisted `RAID` software implements `RAID` mechanisms in a standard drive
    controller chip with embedded proprietary firmware and drivers.


    Nowadays, `RAID` systems are widely used in SMEs. Even in some data centers, `RAID`
    is still used as a fundamental structure for data protection. However, `RAID`
    is limited by its data reliability level, so only up to two disk failures can
    be tolerated by `RAID 6`, which is not secure enough for some critical applications.
    Thus, the erasure coding scheme emerged as an alternative to `RAID`. In `EC`,
    data is broken into fragments that are expanded and encoded with a configurable
    number of redundant pieces and are stored across different locations, such as
    disks, storage nodes, or geographical locations. Theoretically, `EC` can tolerate
    any number of disk failures, although up to four are used in a group practically.
    `EC` may also encounter some performance issues, particularly when the system
    is operated in downgraded or recovery mode.


    ### Hybrid Systems


    Although all-flash arrays are gaining in popularity, hybrid structures remain
    the mainstream in data centers, due to the trade-offs between cost, reliability,
    and performance. In early days, the hybrid storage system contained a `HDD` as
    the fast tier and tape as the backup tier [21] [22]. Later, fast access speed
    `HDD`s (such as `15kRPM` and `10kRPM`) acted as the performance tier, and slow
    speed `HDD`s (such as `7200RPM` and `5400RPM`) acted as the capacity tier [23].
    With the development of non-volatile memory (`NVM`) technologies, such as `NAND
    Flash` [24], `PCM` [25], `STTMRAM` [18], and `RRAM` [19], the performance cost
    ratio of `NVM`s is increasing. Table [1-3](#468166_1_En_1_Chapter.xhtml#Tab3)
    lists the performance and price comparison of some well-known `NVM`s. These `NVM`s
    with fast accessing speed can be used as the performance tier [17] [26] or cache
    [27] [28] [29] [30] in a modern hybrid system. Nowadays, `SSD` is the first choice
    of performance tier, and the high capacity shingled magnetic recording (`SMR`)
    drive is used often as the back-up tier [31].


    When designing a hybrid storage system, the algorithms for the tier and cache
    storage architectures are slightly different, although the general framework is
    similar (see Figure [1-7](#468166_1_En_1_Chapter.xhtml#Fig7)). Fundamentally,
    tier storage architecture moves data to the fast storage area instead of copying
    the data in the cache storage architecture. But both have four important steps
    to accomplish. Firstly, data allocation policies are needed to control the data
    flow between different devices. Secondly, there should be an efficient address
    mapping mechanism between the `SSD` cache address and the main storage address.
    Thirdly, due to the size limitation of `SSD` cache compared with main storage
    `HDD`s, only the frequently and recently accessed data, which is called hot data,
    can be stored in the `SSD` cache/tier to improve the system efficiency. Therefore,
    a suitable hot data identification algorithm should be applied to identify the
    hot/cold data. When the hot data is detected, the data needs to be promoted when
    necessary. Thus a data migration algorithm is needed to control the hot/cold data
    flow to improve the future access efficiency. Lastly, a caching scheduling algorithm
    is employed for queuing behaviors, such as the queue size, synchronization, execution
    sequence.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig7_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    General algorithms for hybrid storage system


    **Data allocation:** Data allocation is conducted by the host or device controller
    to allocate the incoming data to the most suitable storage location, such as hot
    data to `SSD` or cold data to `HDD`. Besides the properties of the data, the status
    of the devices is also considered during the allocation process, such as the queue
    length, capacity usage, bandwidth, etc.


    **Address mapping:** Address mapping is required in a hybrid storage system because
    the capacities of the faster devices and slower devices are different. Due to
    the different address ranges, the accessing location of the incoming data needs
    to be translated to the actual address when the data is allocated to a different
    device. An address translation table is required to keep all these translation
    entries. If the address range is big, the memory consumption of the translation
    table is huge and the translation speed is reduced, which may affect the system
    performance.


    **Data migration (promotion/demotion):** The data promotion is to migrate the
    data from the slower devices to the faster devices, and the data demotion is to
    migrate the data from the faster devices to the slower devices. This is called
    data migration. The data migration is usually conducted when the data in slower
    devices is identified as hot data or the data in faster devices is identified
    as cold data. In some research, the data migration is also done to balance the
    `IOPS` between the faster devices and slower devices.


    **Hot data identification:** Hot data identification is important for the data
    migration to select the suitable data to promote and demote. It uses the properties
    of historical data to classify the incoming data as hot or cold. The classification
    is done by checking the accessing frequency and time of the data. Most frequently
    accessed and most recently accessed data are identified as hot data.


    The hybrid storage architectures can be roughly classified into four categories,
    which are shown in Figure [1-8](#468166_1_En_1_Chapter.xhtml#Fig8): (1) `SSD`s
    as a cache (caching method) of `HDD`s, (2) `SSD`s as a (high) tier (tiering method)
    to `HDD`s, (3) `SSD`s as the combination of tier and cache, and (4) `HDD`s with
    special purposes, such as `HDD`s utilized as the cache of `SSD`s. There are also
    some hybrid storage systems incorporating other types of `NVM`s into design consideration.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig8_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    The overall categories of the hybrid storage architectures'
  raw: '## Storage Systems


    This section discusses the system level storage infrastructure and implementation.
    RAID (redundant array of independent/inexpensive disks) and EC (erasure code)
    systems are mainly used for failure tolerance. Hybrid storage systems intend to
    achieve relatively high performance at low cost. Microserver and Ethernet drives
    have been employed in some object storage systems. Software-define systems separate
    the data flow and control flow. Some large-scale storage system implementations,
    like Hadoop/Spark, OpenStack, Ceph, are also introduced.


    ### Infrastructure: RAID and EC


    RAID as a data storage virtualization technology combines multiple physical drive
    components into a single logical unit or pool for the purposes of data redundancy,
    performance improvement, or both [20]. The Storage Networking Industry Association
    (SNIA) standardized RAID levels and their associated data formats from RAID 0
    to RAID 6: “RAID 0 consists of striping, without mirroring or parity. RAID 1 consists
    of data mirroring, without parity or striping. RAID 2 consists of bit-level striping
    with dedicated Hammingcode parity. RAID 3 consists of byte-level striping with
    dedicated parity. RAID 4 consists of block-level striping with dedicated parity.
    RAID 5 consists of block-level striping with distributed parity. RAID 6 consists
    of block-level striping with double distributed parity.” RAID 2-4 are generally
    not for practical usage. RAID levels can be nested, as in hybrid RAID. For example,
    RAID 10 and 50, which is RAID 1 and 5 based on RAID 0.


    RAID can be implemented by either hardware or software. Hardware RAID controllers
    are expensive and proprietary, and usually used in enterprise environments. Software-based
    implementations have gained more popularity recently. Some RAID software is provided
    by modern OSs and file systems, such as Linux, ZFS, GPFS, and Btrfs. Hardware-assisted
    RAID software implements RAID mechanisms in a standard drive controller chip with
    embedded proprietary firmware and drivers.


    Nowadays, RAID systems are widely used in SMEs. Even in some data centers, RAID
    is still used as a fundamental structure for data protection. However, RAID is
    limited by its data reliability level, so only up to two disk failures can be
    tolerated by RAID 6, which is not secure enough for some critical applications.
    Thus, the erasure coding scheme emerged as an alternative to RAID. In EC, data
    is broken into fragments that are expanded and encoded with a configurable number
    of redundant pieces and are stored across different locations, such as disks,
    storage nodes, or geographical locations. Theoretically, EC can tolerate any number
    of disk failures, although up to four are used in a group practically. EC may
    also encounter some performance issues, particularly when the system is operated
    in downgraded or recovery mode.


    #### Hybrid Systems


    Although all-flash arrays are gaining in popularity, hybrid structures remain
    the mainstream in data centers, due to the trade-offs between cost, reliability,
    and performance. In early days, the hybrid storage system contained a HDD as the
    fast tier and tape as the backup tier [21] [22]. Later, fast access speed HDDs
    (such as 15kRPM and 10kRPM) acted as the performance tier, and slow speed HDDs
    (such as 7200RPM and 5400RPM) acted as the capacity tier [23]. With the development
    of non-volatile memory (NVM) technologies, such as NAND Flash [24], PCM [25],
    STTMRAM [18], and RRAM [19], the performance cost ratio of NVMs is increasing.
    Table [1-3](#468166_1_En_1_Chapter.xhtml#Tab3) lists the performance and price
    comparison of some well-known NVMs. These NVMs with fast accessing speed can be
    used as the performance tier [17] [26] or cache [27] [28] [29] [30] in a modern
    hybrid system. Nowadays, SSD is the first choice of performance tier, and the
    high capacity shingled magnetic recording (SMR ) drive is used often as the back-up
    tier [31].


    When designing a hybrid storage system, the algorithms for the tier and cache
    storage architectures are slightly different, although the general framework is
    similar (see Figure [1-7](#468166_1_En_1_Chapter.xhtml#Fig7)). Fundamentally,
    tier storage architecture moves data to the fast storage area instead of copying
    the data in the cache storage architecture. But both have four important steps
    to accomplish. Firstly, data allocation policies are needed to control the data
    flow between different devices. Secondly, there should be an efficient address
    mapping mechanism between the SSD cache address and the main storage address.
    Thirdly, due to the size limitation of SSD cache compared with main storage HDDs,
    only the frequently and recently accessed data, which is called hot data, can
    be stored in the SSD cache/tier to improve the system efficiency. Therefore, a
    suitable hot data identification algorithm should be applied to identify the hot/cold
    data. When the hot data is detected, the data needs to be promoted when necessary.
    Thus a data migration algorithm is needed to control the hot/cold data flow to
    improve the future access efficiency. Lastly, a caching scheduling algorithm is
    employed for queuing behaviors, such as the queue size, synchronization, execution
    sequence.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig7_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    General algorithms for hybrid storage system


    **Data allocation:** Data allocation is conducted by the host or device controller
    to allocate the incoming data to the most suitable storage location, such as hot
    data to SSD or cold data to HDD. Besides the properties of the data, the status
    of the devices is also considered during the allocation process, such as the queue
    length, capacity usage, bandwidth, etc.


    **Address mapping:** Address mapping is required in a hybrid storage system because
    the capacities of the faster devices and slower devices are different. Due to
    the different address ranges, the accessing location of the incoming data needs
    to be translated to the actual address when the data is allocated to a different
    device. An address translation table is required to keep all these translation
    entries. If the address range is big, the memory consumption of the translation
    table is huge and the translation speed is reduced, which may affect the system
    performance.


    **Data migration (promotion/demotion):** The data promotion is to migrate the
    data from the slower devices to the faster devices, and the data demotion is to
    migrate the data from the faster devices to the slower devices. This is called
    data migration. The data migration is usually conducted when the data in slower
    devices is identified as hot data or the data in faster devices is identified
    as cold data. In some research, the data migration is also done to balance the
    IOPS between the faster devices and slower devices.


    **Hot data identification:** Hot data identification is important for the data
    migration to select the suitable data to promote and demote. It uses the properties
    of historical data to classify the incoming data as hot or cold. The classification
    is done by checking the accessing frequency and time of the data. Most frequently
    accessed and most recently accessed data are identified as hot data.


    The hybrid storage architectures can be roughly classified into four categories,
    which are shown in Figure [1-8](#468166_1_En_1_Chapter.xhtml#Fig8): (1) SSDs as
    a cache (caching method) of HDDs, (2) SSDs as a (high) tier (tiering method) to
    HDDs, (3) SSDs as the combination of tier and cache, and (4) HDDs with special
    purposes, such as HDDs utilized as the cache of SSDs. There are also some hybrid
    storage systems incorporating other types of NVMs into design consideration.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig8_HTML.jpg](images/468166_1_En_1_Chapter/468166_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    The overall categories of the hybrid storage architectures'
  trans: '

    # 存储系统


    本章讨论系统级存储基础设施与实现。`RAID`（独立/廉价磁盘冗余阵列）和`EC`（纠删码）系统主要用于容错。混合存储系统旨在以低成本实现相对较高的性能。微服务器和以太网驱动器已被应用于某些对象存储系统中。软件定义系统将数据流与控制流分离。此外，还介绍了一些大规模存储系统的实现，如`Hadoop/Spark`、`OpenStack`、`Ceph`。


    ## 基础设施：RAID 与 EC


    `RAID`作为一种数据存储虚拟化技术，将多个物理磁盘组件组合成一个逻辑单元或池，以实现数据冗余、性能提升或两者兼得[20]。存储网络行业协会（SNIA）对从`RAID
    0`到`RAID 6`的`RAID`级别及其相关数据格式进行了标准化：“`RAID 0`由条带化组成，无镜像或奇偶校验。`RAID 1`由数据镜像组成，无奇偶校验或条带化。`RAID
    2`由位级条带化与专用汉明码奇偶校验组成。`RAID 3`由字节级条带化与专用奇偶校验组成。`RAID 4`由块级条带化与专用奇偶校验组成。`RAID 5`由块级条带化与分布式奇偶校验组成。`RAID
    6`由块级条带化与双重分布式奇偶校验组成。”`RAID 2-4`通常不用于实际应用。`RAID`级别可以嵌套，例如混合`RAID`。例如，`RAID 10`和`RAID
    50`，它们分别是基于`RAID 0`的`RAID 1`和`RAID 5`。


    `RAID`可以通过硬件或软件实现。硬件`RAID`控制器价格昂贵且具有专有性，通常用于企业环境。基于软件的实现近年来越来越受欢迎。一些现代操作系统和文件系统（如`Linux`、`ZFS`、`GPFS`和`Btrfs`）提供了`RAID`软件。硬件辅助的`RAID`软件在标准磁盘控制器芯片中实现`RAID`机制，该芯片带有嵌入式专有固件和驱动程序。


    如今，`RAID`系统广泛应用于中小企业。即使在部分数据中心，`RAID`仍被用作数据保护的基础架构。然而，`RAID`受限于其数据可靠性级别，`RAID
    6`最多只能容忍两个磁盘故障，这对于某些关键应用来说不够安全。因此，纠删码方案作为`RAID`的替代方案应运而生。在`EC`中，数据被分割成片段，这些片段被扩展并使用可配置数量的冗余块进行编码，然后存储在不同的位置，如磁盘、存储节点或地理位置。理论上，`EC`可以容忍任意数量的磁盘故障，但在实际应用中，一个组内最多使用四个。`EC`也可能遇到一些性能问题，尤其是在系统以降级或恢复模式运行时。


    ### 混合系统


    尽管全闪存阵列越来越受欢迎，但由于成本、可靠性和性能之间的权衡，混合结构仍然是数据中心的主流。早期，混合存储系统包含作为快速层的`HDD`和作为备份层的磁带[21][22]。后来，快速访问速度的`HDD`（如`15kRPM`和`10kRPM`）充当性能层，而慢速`HDD`（如`7200RPM`和`5400RPM`）充当容量层[23]。随着非易失性存储器（`NVM`）技术（如`NAND
    Flash`[24]、`PCM`[25]、`STTMRAM`[18]和`RRAM`[19]）的发展，`NVM`的性能成本比正在提高。表 1-3 列出了一些知名`NVM`的性能和价格比较。这些具有快速访问速度的`NVM`可以在现代混合系统中用作性能层[17][26]或缓存[27][28][29][30]。如今，`SSD`是性能层的首选，而高容量叠瓦式磁记录（`SMR`）驱动器通常用作备份层[31]。


    在设计混合存储系统时，分层和缓存存储架构的算法略有不同，尽管总体框架相似（见图 1-7）。从根本上说，分层存储架构将数据移动到快速存储区域，而不是像缓存存储架构那样复制数据。但两者都需要完成四个重要步骤。首先，需要数据分配策略来控制不同设备之间的数据流。其次，`SSD`缓存地址与主存储地址之间应有高效的地址映射机制。第三，由于与主存储`HDD`相比，`SSD`缓存大小有限，只有频繁访问和最近访问的数据（称为热数据）才能存储在`SSD`缓存/层中，以提高系统效率。因此，应应用合适的热数据识别算法来识别热/冷数据。当检测到热数据时，需要在必要时提升该数据。因此，需要一种数据迁移算法来控制热/冷数据流，以提高未来的访问效率。最后，采用缓存调度算法来处理排队行为，例如队列大小、同步、执行顺序。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig7_HTML.jpg](img/468166_1_En_1_Fig7_HTML.jpg)


    图 1-7


    混合存储系统的通用算法


    **数据分配：** 数据分配由主机或设备控制器执行，将传入的数据分配到最合适的存储位置，例如热数据到`SSD`或冷数据到`HDD`。除了数据的属性外，分配过程中还会考虑设备的状态，例如队列长度、容量使用率、带宽等。


    **地址映射：** 混合存储系统需要地址映射，因为快速设备和慢速设备的容量不同。由于地址范围不同，当数据被分配到不同设备时，传入数据的访问位置需要转换为实际地址。需要一个地址转换表来保存所有这些转换条目。如果地址范围很大，转换表的内存消耗会很大，转换速度也会降低，这可能会影响系统性能。


    **数据迁移（提升/降级）：** 数据提升是将数据从慢速设备迁移到快速设备，数据降级是将数据从快速设备迁移到慢速设备。这称为数据迁移。数据迁移通常在慢速设备中的数据被识别为热数据或快速设备中的数据被识别为冷数据时进行。在一些研究中，数据迁移也用于平衡快速设备和慢速设备之间的`IOPS`。


    **热数据识别：** 热数据识别对于数据迁移选择合适的数据进行提升和降级非常重要。它利用历史数据的属性将传入数据分类为热数据或冷数据。分类通过检查数据的访问频率和时间来完成。最频繁访问和最近访问的数据被识别为热数据。


    混合存储架构大致可分为四类，如图 1-8 所示：(1) `SSD`作为`HDD`的缓存（缓存方法），(2) `SSD`作为`HDD`的（高）层（分层方法），(3)
    `SSD`作为层和缓存的组合，以及(4) 具有特殊用途的`HDD`，例如`HDD`用作`SSD`的缓存。还有一些混合存储系统将其他类型的`NVM`纳入设计考虑。


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig8_HTML.jpg](img/468166_1_En_1_Fig8_HTML.jpg)


    图 1-8


    混合存储架构的总体分类

    '
- fmt: '## Microservers and Ethernet Drives


    A microserver is a server-class computer which is usually based on a system on
    a chip (SoC) architecture. The goal is to integrate most of the server motherboard
    functions onto a single microchip, except DRAM, boot FLASH, and power circuits.
    Ethernet Drive is one of its various forms.


    In October 2013, Seagate Technology introduced its Kinetic Open Storage platform
    with claims that the technology would enable applications to talk directly to
    the storage device and eliminate the traditional storage server tier. The company
    shipped its first near-line Kinetic HDDs in late 2014. The Kinetic drive is described
    as a key-value server with dual Ethernet ports that support the basic `put`, `get`,
    and `delete` semantics of object storage, rather than read-write constructs of
    block storage. Clients access the drive through the Kinetic API that provides
    key-value access, third-party object access, and cluster, drive, and security
    management.


    Introduced in May 2015, Toshiba’s KVDrive uses the key-value API that Seagate
    open sourced rather than reinventing the wheel. `Ceph` or `Gluster` could run
    directly on Toshiba’s KVDrive.


    WDC/HGST’s converged microserver based on its Open Ethernet architecture supports
    any Linux implementation. Theoretically, any network operating system can run
    directly in such a microserver. `Ceph` and `OpenStack Object Storage` system have
    been demonstrated together with Red Hat server. For example, in early 2016, WDC
    demonstrated a large scale `Ceph` distributed storage system with 504 drives and
    4PB storage size.^([^(21)](#fn21))


    ## Software-Defined Storage


    Software-defined storage is an emerging concept that is still in evolution. There
    are many different definitions from different organizations, such as the following:


    - **TechTarget**:^([^(22)](#fn22)) SDS is an approach to data storage in which
    the programming that controls storage-related tasks is decoupled from the physical
    storage hardware (which places the emphasis on storage-related services rather
    than storage hardware).


    - **Webopedia**:^([^(23)](#fn23)) SDS is storage infrastructure that is managed
    and automated by intelligent software as opposed to the storage hardware itself.
    In this way, the pooled storage infrastructure resources in a SDS environment
    (which can provide functionality such as deduplication, replication, thin provisioning,
    snapshots, and other backup and restore capabilities across a wide range of server
    hardware components) can be automatically and efficiently used to match the application
    needs of an enterprise.


    - **Wikipedia**:^([^(24)](#fn24)) SDS is computer data storage software to manage
    policy-based provisioning and management of data storage independent of hardware.
    Software-defined storage definitions typically include a form of storage virtualization
    to separate the storage hardware from the software that manages the storage infrastructure.
    The software enabling a software-defined storage environment may also provide
    policy management for feature options such as deduplication, replication, thin
    provisioning, snapshots, and backup.


    - **VMware**:^([^(25)](#fn25)) SDS is the dynamic composition of storage services
    (such as snaps, clones, remote replication, deduplication, caching, tiering, encryption,
    archiving, compliance, searching, intelligent logics) aligned on application boundaries
    and driven by policy.


    Despite of these different views, there are some common factors and features,
    which are summarized in Table [1-4](#468166_1_En_1_Chapter.xhtml#Tab4) and Figure
    [1-9](#468166_1_En_1_Chapter.xhtml#Fig9). Table [1-4](#468166_1_En_1_Chapter.xhtml#Tab4)
    actually shows the three steps for SDS. First, the hardware should be decoupled
    from the software, such as the abstraction of logical storage services and capabilities
    from the underlying physical storage systems. Second, the storage resource is
    virtualized, such as pooling across multiple implementations. Third, automation
    mechanism is created with policy-driven storage provisioning with service-level
    agreements replacing technology details. Typical SDS products include `GlusterFS`,
    `Ceph`, and `VMware Virtual SAN`. Figure [1-9](#468166_1_En_1_Chapter.xhtml#Fig9)
    further gives the features in five aspects: data organization, scaling, persistent
    data store, storage service, and delivery model.


    ![../images/468166_1_En_1_Chapter/468166_1_En_1_Fig9_HTML.png](images/468166_1_En_1_Chapter/468166_1_En_1_Fig9_HTML.png)


    **Figure 1-9** The overall features of SDS


    **Table 1-4** Common Features of SDS


    | Level | Steps | Consequence |

    | --- | --- | --- |

    | Data plane, Control plane | Abstract (decouple/standardization, pooling/virtualization),
    automation (policy-driven) | Faster, more efficient simpler |


    SDS also leads to some other concepts, such as a software-defined data center
    (SDDC). Based on the report by IDC and IBM,^([^(26)](#fn26)) a SDDC is a loosely
    coupled set of software components that seek to virtualize and federate datacenter-wide
    hardware resources such as compute, storage, and network resources. The objective
    for a SDDC is to make the data center available in the form of an integrated service.
    Note that an implementation of SDS and SDDC may not be able to leave the support
    of another software defined concept, such as software-defined networking (SDN),
    which provides a fundamental change to the network infrastructure.


    ### Implementation


    I focus on some most recent software implementations for large scale systems with
    distributed storage components in this section.'
