  trans: '

    ### 读密集型追踪


    此追踪中的请求 LBA 分布接近顺序访问，如图 7-1 所示。对于读请求，存在两个区域。一个与当前写入区域相同，另一个则接近之前的写入区域（即回放）。读请求的大小多为
    512 或 1024 个块。然而，1024 个块的读请求比例低于写请求，如图 7-2 所示。


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig2_HTML.jpg](img/468166_1_En_7_Fig2_HTML.jpg)


    **图 7-2** RAID 追踪 1 的大小分布


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig1_HTML.jpg](img/468166_1_En_7_Fig1_HTML.jpg)


    **图 7-1** RAID 追踪 1 的 LBA 分布


    总体而言，此追踪包含大量空闲时间，占总时间的 83.4%。空闲时间的平均总和随时间大致均匀分布，但较长的空闲间隔并非如此，如图 7-3 所示。间隔`>200ms`和`>500ms`分别占
    8%和 1.7%，但分别占据了总空闲时间的 71.6%和 34%。实际上，65%（94%）的空闲频率小于 10ms（1s），而 2%（70%）的空闲时间小于
    10ms（1s），如图 7-4 所示。因此，我们可以得出结论：总空闲时间对于基于小 IO 的后台活动来说足够长，但单个长空闲间隔可能不足，这意味着 GC 访问必须以小步骤完成。


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig4_HTML.jpg](img/468166_1_En_7_Fig4_HTML.jpg)


    **图 7-4** RAID 追踪 1 的空闲时间 CDF


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig3_HTML.jpg](img/468166_1_En_7_Fig3_HTML.jpg)


    **图 7-3** RAID 追踪 1 的空闲时间分布


    除了大量的空闲时间外，请注意某些请求存在异常大的响应时间（`> 200ms`）。如您所知，即使在最坏情况下，一个 1024 块请求的访问时间也不应超过 60ms。因此，对于表
    7-3 中列出的两种情况，等待时间过长：1) `CMD 529`连续到`530`，但写访问耗时超过 430ms；2) `CMD 1015`接近`1024`，但耗时
    390ms。这可能是由以下原因造成的：1) 后台磁盘活动，如日志写入、元数据更新、区域切换等；或 2) RAID 同步事件。一种可能的解决方案是均匀分配任务，并主动为后台任务提供空闲时间。


    **表 7-3** RAID 追踪 1 的一个片段


    | 开始(秒) | 结束 | ID | 结束 | 命令 | ICT(毫秒) | LBA | 长度 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 27.51865 | 27.53302 | 529 | 529 | W | 0.109105 | 1.21e+08 | 1024 |

    | 27.5331 | 27.96851 | 530 | 530 | W | 0.078425 | 1.21e+08 | 512 |

    | 27.9686 | 27.98473 | 531 | 531 | R | 0.086485 | 80135168 | 1024 |

    | 27.98483 | 27.987 | 532 | 532 | R | 0.10257 | 80351232 | 512 |

    | ... |   |   |   |   |   |   |   |

    | 52.73206 | 52.7429 | 1014 | 1014 | R | 0.466475 | 80690688 | 512 |

    | 53.46918 | 53.85766 | 1015 | 1015 | R | 726.2745 | 80875520 | 512 |

    | 53.85778 | 53.86006 | 1016 | 1016 | R | 0.112894 | 80876032 | 512 |

    | 53.86014 | 53.87545 | 1017 | 1017 | R | 0.083455 | 80881664 | 1024 |


    对于图 7-5 中显示的频繁写入更新，您可以看到 94.2%的访问块（可能重复）仅被写入一次，5.8%的块至少被访问两次，而`<0.1%`的块被写入三次。这意味着重写率非常低。因此，您需要确定是大型请求还是小型请求被重写最多。被多次写入的块所占百分比不断下降，这意味着热块的比例很小。


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig5_HTML.jpg](img/468166_1_En_7_Fig5_HTML.jpg)


    **图 7-5** RAID 追踪 1 的频繁更新


    对于图 7-6 中显示的定时写入更新，总写入块占全部访问块（读和写）的 35%，而更新块（至少写入两次）仅占 1%（1/35=2.9%的重写块）。总写入命令占总命令的
    30%，更新命令占 1.5%。请注意，定时写入更新率与频繁写入更新率密切相关；换句话说，`sum(hit*(update freq-1))/total blocks
    = updated blocks/total write blocks`。


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig6_HTML.jpg](img/468166_1_En_7_Fig6_HTML.jpg)


    **图 7-6** RAID 追踪 1 的定时更新


    通过进一步考虑图 7-7 中的写入栈距离，您可以看到命中率很低，没有必要使用内联写入缓存来长时间保存这些写入数据。基于 IOPS，要达到栈距离 100，大约需要
    26.6 秒。在此期间，仅观察到 10%的完全写入命中率和 20%的部分写入命中率，而总体命中率仅为 5%。平均更新大小约为 43MB。因此，不值得为如此小的命中率进行补偿。请注意，写入命中分布在写入范围内。在此追踪中，完全命中仅针对
    512 块请求，而部分命中则针对 1024 块请求。详情见图 7-8。


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig8_HTML.jpg](img/468166_1_En_7_Fig8_HTML.jpg)


    **图 7-8** RAID 追踪 1 的写入命中分布


    ![../images/468166_1_En_7_Chapter/468166_1_En_7_Fig7_HTML.jpg](img/468166_1_En_7_Fig7_HTML.jpg)


    **图 7-7** RAID 追踪 1 的栈更新


    当您考虑 SMR 驱动器时，如第 6 章所述，您会得到表 7-4 中总结的主要特征。您可以结合第 6 章介绍的 SMR 属性来理解此表。尽管这是一个读密集型追踪，但它不具备
    WORM 属性。


    **表 7-4** 追踪 1 针对 SMR 的主要特征


    | SMR 特性 | 观察结果 |

    | --- | --- |

    | 顺序写入 | 大型写入请求（`>=512`个块）> 99.9%<br>模式比率：读写各占 50%（`Q=1`）<br>顺序命令比率（`M>=2` & `S>=1024`）：写入
    85% & 读取 90%（`Q>=50`） |

    | 一次写入多次读取 | `R/W`：命令 70:30；块 61:39<br>栈 ROW 比率：< 1%<br>总写入块占全部访问块的 2.9% |

    | 垃圾回收（GC） | 频繁的小空闲时间；短队列长度<br>5.8%的频繁 WUR 中，更新块（至少写入两次）仅占全部访问块的 1%和写入块的 2.9%，因此写入更新率非常小，写入放大率为
    103%（考虑到追踪持续时间短） |

    | 顺序读取到随机写入 | ROW 比率为 1.2，因此读取比率非常小，写入的数据不太可能被立即读回 |

    | 原地或非原地更新 | 更新率非常小；无需应用大容量 SSD/DRAM/AZR 缓存来提升性能（缓存中的写入更新） |

