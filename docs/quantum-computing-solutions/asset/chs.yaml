  \ + |y2-y1|\n```\n\n**提示**\n\nk-中位数与 k-means 的区别在于簇中心的选择方式。k-means 选择均值作为质心，而 k-中位数则选择簇内数据点的中位数。\n\
  \n让我们来看一下 k-中位数算法的代码实现。\n\n### 代码示例\n\n```\nimport numpy as nump\nfrom k_medians_utils\
  \ import *\nPREFIX = ''\nFILE = PREFIX + 'iris.data.txt'\n[xval, yval] = read(FILE)\n\
  [n, d] = nump.shape(xval)\nk = len(nump.unique(yval))\nmi = nump.min(xval, axis=0)\n\
