  ### 交通管理


  交通领域中的交通建模依赖于交通区域、出行表格、高速公路网络、车辆容量以及土地利用模型。土地利用模型包含趋势、土地利用与分区规划、活动区域以及地图。一个交通系统涵盖街道、高速公路、停车设施、出行时间以及限速要求。交通网络将具有交通流量和车辆容量。出行模式指明了使用方式、典型的起点到终点路径以及出行特征。沃德罗普第一原理基于网络和道路使用者平衡。所有使用中的路径的行程时间相等，且比未使用的路径少一辆车的时间。该原理有助于最小化单次出行的平均时间。还存在其他原理和算法来平衡道路使用者与网络交通流量。参见图
  14-3。


  ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig3_HTML.jpg](img/490826_1_En_14_Fig3_HTML.jpg)


  图 14-3


  出行规划


  出行是基于起点、终点、车辆和城市交通网络生成的。该网络包含车辆、骑行者、行人，他们在不同的时区和空间中持续移动。交通规划是一项持续的活动，街道网络基础设施也在不断更新。交通建模通过仿真和机器学习等技术完成。交通控制则利用历史数据、估算一段时间内的车辆数量，并管理整个网络中的交通流量。


