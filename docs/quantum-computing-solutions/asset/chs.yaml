  \ sigma ** 2))\n    cMat = nump.linalg.solve(nMat, mMat)\n    coeffs = nump.sum(cMat,\
  \ axis=1)\n    coeffs = data.shape[0]*coeffs/sum(coeffs)\n    return newData, coeffs\n\
  \ndef getUniqueRows(x):\n    y = nump.ascontiguousarray(x).view(nump.dtype((nump.void,\
