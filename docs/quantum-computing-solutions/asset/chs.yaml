  \ 2\n确定所有周期的最小公倍数\n结果为：     1, 35\n```\n\n\n## 格罗弗算法\n\n`Grover` 算法用于搜索数据库。该搜索算法可以在包含\
  \ `M` 条记录的数据库中，以 `O(√N)` 的时间和 `O(logN)` 的空间找到一条记录。该方法由洛夫·格罗弗于 1996 年发现。他发现，与其他量子算法相比，他的方法能提供二次加速。此外，`Grover`\
  \ 方法相比经典算法具有指数级的速度提升。\n\n`Grover` 算法用于对函数求逆。假设 `y = g(x)`。`Grover` 算法能够在给定输入 `y`\
  \ 时找到 `x`。在数据库中搜索 `y` 的值，类似于寻找 `x` 的匹配项。它在通过对可能解集进行穷举搜索来解决 NP 难题时非常流行。你可以使用 `Grover`\
  \ 算法，在 `√M` 步内，从包含 `M` 条记录的电话簿中搜索一个电话号码。\n\n`Grover` 算法包含以下步骤：\n\n1.  将系统初始化为初始状态。\n\
  2.  执行格罗弗迭代 `r(M)` 次。\n3.  测量振幅 `Ω`。\n4.  从 `Ωw`（结果）中找到 `w`。\n\n让我们来看看 `Grover`\
  \ 算法的 Python 实现。\n\n`Grover` 搜索算法通过计算平均振幅和 `Grover` 振幅来搜索一组数据中的目标值。该图表根据 `Grover`\
  \ 算法推导出的振幅绘制而成。图表展示了具有最高振幅的目标值。`ApplyOracleFunction` 方法接收输入 `x`，并返回 `x` 的十六进制摘要作为输出。`ApplyGrover’s`\
  \ 算法将目标、对象、`nvalue` 和轮次作为输入，并返回振幅作为输出。\n\n该算法的目标是在字符串对象组 `{'14', '5', '13', '7','9','11','97'}`\
  \ 中搜索 `9`。根据值 `1 / 集合长度 (9) 的平方根` ，从字典（字符串对象组）中搜索振幅。\n\n### 代码示例\n\n**Grovers_Algorithm.py**\n\
  \n```python\nimport matplotlib.pyplot as plot\nimport numpy as nump\nimport string\n\
  import hashlib\nfrom math import sqrt, pi\nfrom collections import OrderedDict\n\
  from statistics import mean\n\ndef RenderGraph(amplitude_value, n):\n    y_position\
  \ = nump.arange(n)\n    plot.bar(y_position, amplitude_value.values(), align=\"\
  center\", color=\"g\")\n    plot.xticks(y_position, amplitude_value.keys())\n  \
  \  plot.ylabel('Amplitude Value')\n    plot.title('Grovers Algorithm')\n    plot.show()\n\
  \ndef ApplyOracleFunction(xvalue):\n    return hashlib.sha256(bytes(xvalue, 'utf-8')).hexdigest()\n\
  \ndef ApplyGroverAlgorithm(target, objects, nvalue, rounds):\n    y_pos = nump.arange(nvalue)\n\
  \    amplitude = OrderedDict.fromkeys(objects, 1/sqrt(nvalue))\n    for i in range(0,\
  \ rounds, 2):\n        for k, v in amplitude.items():\n            if ApplyOracleFunction(k)\
  \ == target:\n                amplitude[k] = v * -1\n        average = mean(amplitude.values())\n\
  \        for k, v in amplitude.items():\n            if ApplyOracleFunction(k) ==\
  \ target:\n                amplitude[k] = (2 * average) + abs(v)\n             \
  \   continue\n            amplitude[k] = v-(2*(v-average))\n    return amplitude\n\
  \ntarget_algorithm = '9'\nobjects_grover = ('14', '5', '13', '7','9','11','97')\n\
  number = len(objects_grover)\namplitude_grover = OrderedDict.fromkeys(objects_grover,\
  \ 1/sqrt(number))\namplitude_grover[target_algorithm] = amplitude_grover[target_algorithm]\
  \ * -1\nprint(amplitude_grover)\naverage_grover = mean(amplitude_grover.values())\n\
  print(\"Mean is {}\".format(average_grover))\nfor k, v in amplitude_grover.items():\n\
  \    if k == target_algorithm:\n        amplitude_grover[k] = (2 * average_grover)\
  \ + abs(v)\n        continue\n    amplitude_grover[k] = v-(2*(v-average_grover))\n\
  print(amplitude_grover)\n\nneedle_value = \"2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881\"\
  \nhaystack_value = string.ascii_lowercase\nnum = len(haystack_value)\nnum_rounds\
  \ = int((pi / 4) * sqrt(num))\nprint(\"number of rounds are {}\".format(num_rounds))\n\
  RenderGraph(ApplyGroverAlgorithm(needle_value, haystack_value, num, num_rounds),\
  \ num)\n```\n\n### 执行命令\n\n```bash\npip3 install numpy\npython3 Grovers_Algorithm.py\n\
  ```\n\n### 输出\n\n```\nOrderedDict([('4', 0.3779644730092272), ('5', 0.3779644730092272),\
  \ ('3', -0.3779644730092272), ('7', 0.3779644730092272), ('9', 0.3779644730092272),\
  \ ('11', 0.3779644730092272), ('97', 0.3779644730092272)])\nMean is 0.26997462357801943\n\
  OrderedDict([('4', 0.16198477414681167), ('5', 0.16198477414681167), ('3', 0.9179137201652661),\
  \ ('7', 0.16198477414681167), ('9', 0.16198477414681167), ('11', 0.16198477414681167),\
  \ ('97', 0.16198477414681167)])\nnumber of rounds are 4\n```\n\n## 量子子程序\n\n量子计算机模拟器旨在模拟一个大小为\
  \ `n` 个量子比特的量子计算机。现在已有量子计算机模拟软件包，可用于编写量子计算相关的软件。这些软件包就像黑盒一样，抽象了量子算法的方法和技术。量子傅里叶变换、`QPhase`\
  \ 和矩阵求逆子程序都可在这些软件包中找到，以帮助解决现实世界中的复杂问题。\n\n这些软件包包括 `Project Q`、`IBM Quantum Experience`、`PennyLane`、`QuidPro`、`Liquid`\
  \ 等。可以使用这些软件包来模拟量子电路，进行分析和计算。\n\n这些应用程序是使用量子子程序包为量子和经典算法开发的。代码被编译，输入文件用于量子算法执行。量子电路使用子程序\
  \ API 包进行建模。量子电路包含一组控制门，并在模拟的量子电路上执行测量。\n\n量子算法的执行是在一组量子电路上进行的，这些电路代表并建模了现实世界的问题。对结果进行后处理以进行分析。\n\
  \n## 总结\n\n在本章中，我们探讨了量子电路、量子通信、量子噪声、量子纠错以及量子计算的局限性。详细讨论了 Deutsch–Jozsa 算法、Simon\
  \ 算法、Shor 算法和 Grover 算法等量子算法。还通过示例介绍了量子子程序和算法。\n\n"
- "# 5. 量子模拟器\n\n## 引言\n\n> *“未来量子计算最重要的应用很可能是对量子系统的计算机模拟，因为这是一个我们确知经典计算机通常无法有效模拟量子系统的领域。”*\n\
  > \n> ——戴维·多伊奇\n\n本章概述了量子模拟器。你将看到量子模拟器在现实世界中如何被使用。本章详细介绍了量子模拟器的代码示例，并讨论了量子语言和平台。\n\
  \n## 初始设置\n\n你需要安装 Python 3.5 来运行本章的代码示例。你可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载。\n\n\n\n## 量子语言\n\n肖尔质因数分解算法、格罗弗搜索算法和量子近似优化等量子算法被用于开发实际应用，并通过模拟量子计算机来借助这些应用解决现实问题。当模拟量子计算设备时，软件应用程序会使用量子语言编写，应用程序代码则通过模拟器执行。\n\
  \n量子语言是一种包含量子指令的典型编程语言（见图 5-1）。量子指令作用于量子电路中的量子门。量子电路在量子模拟器中建模。\n\n![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig1_HTML.jpg](img/490826_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n量子语言\n\n量子语言是一种类似 `C` 的语言，拥有数据类型和方法。这些数据类型和方法与经典计算机语言相似。此外，该语言还提供了量子数据类型和方法。\n\
  \n量子计算机在经典机器上进行模拟，因此量子模拟器具备在经典机器上执行任务的功能。该模拟器基于量子力学原理和量子计算机模型。尤里·马宁和理查德·费曼提出了一个假设：可以利用量子力学原理执行模拟。量子计算机基于离子阱方法和超导量子比特构建。\n\
  \n离子阱量子计算机基于悬浮在电磁场中的受限离子。每个离子中存储着量子比特。每个离子都具有包含量子比特的电子态。通过利用库仑力，离子的量化运动可用于转移量子信息。超导量子比特是量子计算机的基本单元。\n\
  \n量子计算机利用量子原理运行，并借助亚原子粒子状态来管理量子信息。叠加是一种量子状态，代表亚原子粒子的可能状态。绝热量子计算是量子计算机的另一种方法，基于绝热定理。这种数学方法用于执行量子计算任务。\n\
  \nIBM、谷歌、微软和 Rigetti 的量子模拟器都提供了编程 API、软件开发工具包和云服务。量子模拟器帮助程序员执行模拟和计算任务（见图 5-2）。\n\
  \n![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig2_HTML.jpg](img/490826_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n量子模拟器\n\n量子模拟器可以在经典计算机上执行。虽然已有商用量子计算机，但量子比特的数量是不同实现之间的区别所在。\n\n注意\n\n量子计算机不能违反丘奇-图灵论题。因此，可以实现基于图灵机的量子模拟器。\n\
  \n## 量子比特测量\n\n量子计算任务包含编码信息和量子测量子任务。编码基于用于解决现实问题的量子算法。处于不同状态（如叠加态）的量子比特需要在量子计算任务期间进行测量。\n\
  \n量子比特测量会产生一个输出，该输出是叠加态。玻恩规则指出，输出将是一个叠加态，且输出与该叠加态系数的平方成正比。重复采样是量子计算软件开发工具包的一个特性。采样直方图基于由结果计数得出的频率来创建。\n\
  \n## 量子指令集\n\n使用量子语言开发的软件程序通过量子编译器编译，以创建量子指令集（见图 5-3）。编译器以量子汇编语言生成代码。代码优化是编译器的一个特性。\n\
  \n![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig3_HTML.jpg](img/490826_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n量子指令集\n\n量子汇编语言有助于使用量子门和量子操作来建模量子电路。量子处理器有助于在量子计算机上执行指令集。量子计算需要无噪声和无错误。可靠量子比特和容错量子计算方法被用于量子计算。\n\
  \n注意\n\n量子指令集类似于经典计算机中存在的经典指令集。\n\n### 代码示例\n\n```\nimport cirq\nqbit = cirq.GridQubit(0,\
  \ 0)\nquantum_circuit = cirq.Circuit.from_ops(\ncirq.X(qbit)**0.5,\ncirq.measure(qbit,\
  \ key=\"m\")\n)\nprint(\"Quantum Circuit:\", quantum_circuit)\nquantum_simulator\
  \ = cirq.Simulator()\nresults = quantum_simulator.run(quantum_circuit, repetitions=20)\n\
  print(\"Results \",results)\n```\n\n### 执行命令\n\n```\npip3 install cirq\npython3\
  \ quantum_circuit.py\n```\n\n### 输出\n\n```\nQuantum Circuit: (0, 0): ───X⁰.5───M('m')───\n\
  Results  m=11000011010011101100\n```\n\n现在让我们来看看一个全栈通用量子计算机。全栈通用量子计算机基于经典计算机堆栈。\n\
  \n## 全栈通用量子模拟器\n\n量子模拟器基于费曼关于用量子系统模拟计算任务的猜想。塞斯·劳埃德提出了可用于全栈通用量子模拟器的量子原理。全栈通用量子模拟器基于量子计算模型的概念。量子设备用于构建量子计算机，它可以与经典计算机并行工作。量子处理器用于执行任何需要加速的计算任务。这种混合方法使用经典计算机和量子计算机来执行任务。见图\
  \ 5-4。\n\n![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig4_HTML.jpg](img/490826_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n全栈通用量子模拟器\n\n量子加速器和量子辅助优化是用于量子计算的最新技术。全栈量子模拟器基于量子计算层和组件。\n\n\n\n### 代码示例\n\
  \n```python\nimport cirq\nimport random\n\ndef rand2d(rows, cols):\n    return [[random.choice([+1,\
  \ -1]) for _ in range(cols)] for _ in range(rows)]\n\ndef random_instance(length):\n\
  \    h = rand2d(length, length)\n    jr = rand2d(length - 1, length)\n    jc = rand2d(length,\
  \ length - 1)\n    return (h, jr, jc)\n\ndef one_step(h, jr, jc, x_half_turns, h_half_turns,\
  \ j_half_turns):\n    length = len(h)\n    yield rot_x_layer(length, x_half_turns)\n\
  \    yield rot_z_layer(h, h_half_turns)\n    yield rot_11_layer(jr, jc, j_half_turns)\n\
  \ndef rot_x_layer(length, half_turns):\n    rot = cirq.XPowGate(exponent=half_turns)\n\
  \    for i in range(length):\n        for j in range(length):\n            yield\
  \ rot(cirq.GridQubit(i, j))\n\ndef rot_z_layer(h, half_turns):\n    gate = cirq.ZPowGate(exponent=half_turns)\n\
  \    for i, h_row in enumerate(h):\n        for j, h_ij in enumerate(h_row):\n \
  \           if h_ij == 1:\n                yield gate(cirq.GridQubit(i, j))\n\n\
  def rot_11_layer(jr, jc, half_turns):\n    gate = cirq.CZPowGate(exponent=half_turns)\n\
  \    for i, jr_row in enumerate(jr):\n        for j, jr_ij in enumerate(jr_row):\n\
  \            if jr_ij == -1:\n                yield cirq.X(cirq.GridQubit(i, j))\n\
  \                yield cirq.X(cirq.GridQubit(i + 1, j))\n            yield gate(cirq.GridQubit(i,\
  \ j),\n                       cirq.GridQubit(i + 1, j))\n            if jr_ij ==\
  \ -1:\n                yield cirq.X(cirq.GridQubit(i, j))\n                yield\
  \ cirq.X(cirq.GridQubit(i + 1, j))\n    for i, jc_row in enumerate(jc):\n      \
  \  for j, jc_ij in enumerate(jc_row):\n            if jc_ij == -1:\n           \
  \     yield cirq.X(cirq.GridQubit(i, j))\n                yield cirq.X(cirq.GridQubit(i,\
  \ j + 1))\n            yield gate(cirq.GridQubit(i, j),\n                      \
  \ cirq.GridQubit(i, j + 1))\n            if jc_ij == -1:\n                yield\
  \ cirq.X(cirq.GridQubit(i, j))\n                yield cirq.X(cirq.GridQubit(i, j\
  \ + 1))\n\nh, jr, jc = random_instance(3)\nlength = 3\nqubits = [cirq.GridQubit(i,\
  \ j) for i in range(length) for j in range(length)]\nsimulator = cirq.Simulator()\n\
  circuit = cirq.Circuit()\ncircuit.append(one_step(h, jr, jc, 0.1, 0.2, 0.3))\ncircuit.append(cirq.measure(*qubits,\
  \ key=\"x\"))\nresults = simulator.run(circuit, repetitions=100)\nprint(results.histogram(key='x'))\n\
  ```\n\n### 执行命令\n\n```bash\npip3 install cirq\npython3 simulator.py\n```\n\n###\
  \ 输出\n\n```\nCounter({0: 83, 8: 3, 32: 3, 4: 2, 256: 2, 1: 2, 128: 2, 16: 1, 64:\
  \ 1, 257: 1})\n```\n\n## 量子汇编编程\n\n量子计算机拥有量子处理器，这些处理器是物理芯片，可以包含一组量子比特。量子计算机有用于控制的电子单元以及用于管理内存和数据的组件。量子处理器可以基于门模型或退火方法。门模型量子处理单元具有量子电路和计算任务，这些任务通过量子门执行。量子退火用于退火量子处理单元。\n\
  \n量子解释器和编译器用于编译软件代码以生成汇编代码。量子汇编语言用于创建汇编代码，该代码包含可在量子模拟器或量子计算机上执行的量子指令集。参见图 5-5。\n\
  \n![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig5_HTML.jpg](img/490826_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n量子汇编语言\n\n量子物理原理用于创建量子计算机和模拟器。程序员可以借助软件开发工具包，使用量子编程语言开发应用程序。\n\n量子计算机架构基于不同的方法，例如绝热计算模型。量子电路是利用量子汇编中的量子门开发的。这些电路可以在量子模拟器上模拟，以执行量子汇编代码。代码中包含用于操作电路中量子门的指令集。\n\
  \n### 代码示例\n\n```python\nimport qiskit\n\nclass QASM_JobManager:\n    def __init__(self):\n\
  \        self.data = []\n\n    def createProgram(self,quantum,classical):\n    \
  \    qr = qiskit.QuantumRegister(quantum)\n        cr = qiskit.ClassicalRegister(classical)\n\
  \        program = qiskit.QuantumCircuit(qr, cr)\n        return qr,cr,program\n\
  \n    def measure(self,program,qr,cr):\n        program.measure(qr,cr)\n\n    def\
  \ getQASMBackend(self):\n        backend = qiskit.BasicAer.get_backend('qasm_simulator')\n\
  \        return backend\n\n    def executeProgramOnQASM(self,program,backend):\n\
  \        job = qiskit.execute( program, backend  )\n        return job\n\njobManager\
  \ = QASM_JobManager()\nquantumRegister,classicalRegister,program = jobManager.createProgram(1,1)\n\
  jobManager.measure(program,quantumRegister,classicalRegister)\nbackend = jobManager.getQASMBackend()\n\
  print(\"The device name:\",backend.name())\njob = jobManager.executeProgramOnQASM(program,backend)\n\
  print( job.result().get_counts() )\n```\n\n### 执行命令\n\n```bash\npip3 install qiskit\n\
  python3 quantum_assembly.py\n```\n\n### 输出\n\n```\nThe device name: qasm_simulator\n\
  {'0': 1024}\n```\n\n## 量子硬件平台\n\n量子硬件平台可由 Google、Rigetti、Microsoft 和 IBM 提供（参见图\
  \ 5-6）。它们实现量子计算模型来执行量子计算。用于构建量子计算机的方法包括：离子阱、光子学系统和超导量子比特。量子比特是当前的限制因素，也是这些平台之间的区别所在。\n\
  \n![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig6_HTML.jpg](img/490826_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n量子硬件\n\n量子随机存取存储器基于在量子设备上运行的主经典设备。这基于混合量子编程模型，你可以从像 Python 这样的典型编程语言开始，然后使用量子编程语言来处理量子计算任务。在\
  \ Microsoft 的实现中，C# 用于典型编程任务，而 Q# 用于量子计算。\n\n量子寄存器基于多量子比特系统。它类似于经典计算机寄存器。量子寄存器在量子设备中对量子比特进行操作，是一个由多个量子比特组成的系统。这相当于经典处理器寄存器。量子计算机操纵量子寄存器内的量子比特。它能够模拟量子比特的\
  \ 2^X 种组合。而经典寄存器只能处理经典比特的 x 种组合。\n\n### 商用量子计算机\n\n商用量子计算平台列举如下：\n\n*   Rigetti\n\
  *   Google\n*   IBM\n*   Microsoft\n\nRigetti 计算平台包含以下组件：\n\n*   Quil\n*   PyQuil\n\
  *   QUILC\n*   量子虚拟机 (QVM)\n\nGoogle 量子计算游乐场支持脚本编写，并具有以下特性：\n\n*   基于浏览器的 IDE\n\
  *   22 个量子比特的量子寄存器\n*   程序与编译\n*   程序中的嵌套逻辑\n*   量子门建模\n*   数学函数支持\n*   可视化模式\n\n\
  IBM 量子体验包含以下模块：\n\n*   量子电路编辑器\n*   量子电路可视化工具\n*   量子门支持\n*   量子寄存器\n*   Qiskit\
  \ Notebooks（基于 Jupyter）\n\nMicrosoft 量子开发工具包支持 Microsoft Q# 和 QDK。它包含一个模拟器和开源 AI，供开发者使用量子电路、门和模拟器创建程序。\n\
  \n## 总结\n\n在本章中，我们探讨了量子语言、量子比特测量、量子指令集、全栈通用量子模拟器、量子汇编编程以及量子硬件平台。本章还提供了关于量子汇编、量子电路和模拟器的代码示例。\n\
  \n"
- "# 6. 量子优化算法\n\n## 引言\n\n> “量子理论的数学框架已经通过了无数成功的检验，现在被普遍认为是对所有原子现象的一致且准确的描述。”\n>\n\
  > ——埃尔温·薛定谔\n\n本章概述了量子优化算法。你将了解量子优化如何在现实生活中应用。文中还提供了量子优化应用程序的代码示例。\n\n\n\n## 初始设置\n\
  \n你需要安装 `Python 3.5` 才能运行本章中的代码示例。你可以从 [`www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载它。\n\n## 近似优化算法\n\n在本节中，我们将介绍近似算法，例如半定规划和近似组合优化。\n\n近似组合优化有助于快速找到接近最优值的解。然而，该技术可能无法给出最佳解。该方法有助于为旅行商问题找到一条短路径。旅行商问题描述的是，一个推销员需要在\
  \ `M` 个城市之间旅行。推销员可以每个城市只访问一次，但需要回到起点。经典的解决方案是将第一个城市设为起点和终点。下一步是识别城市的所有可能排列 `(M-1)!`。需要检查每个排列的成本或目标。该问题的目标是识别成本最低的排列。见图\
  \ 6-1。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig1_HTML.jpg](img/490826_1_En_6_Fig1_HTML.jpg)\n\
  \n*图 6-1 – 近似组合优化*\n\n针对此问题，可以使用动态规划，将其分解为子问题。从第一个城市开始，对于所有其他城市，创建一个从新城市开始的子问题。这些子问题将形成递归，以识别销售人员最便宜的旅行路线。\n\
  \n近似优化算法通过计算最小生成树的成本来确定最优路线。最小生成树是城市连通路径的一个子集，它没有环路，且总边成本较低。\n\n现在让我们来看一下半定规划算法。\n\
  \n### 半定规划\n\n半定规划是优化中的一项重要技术。通用性是该方法背后的关键原理。优化问题中的变量矩阵被约束为半正定矩阵。“半定规划”这个术语来源于与半正定性相关的约束条件。\n\
  \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig2_HTML.jpg](img/490826_1_En_6_Fig2_HTML.jpg)\n\
  \n*图 6-2 – 半定规划*\n\n量子半定规划技术包含以下步骤：\n\n1.  应用预言函数进行违反约束的搜索。\n2.  生成一个密度矩阵。\n3. \
  \ 计算密度矩阵上酉算子的相位估计。\n    a.  估算 `Tr[e^(-密度矩阵)]`。\n    b.  检查输出是否为 `λ`。如果是，则返回值 `λ\
  \ -1e^^(-λ)`。\n4.  执行步骤 1，并测量第二个系统的密度矩阵。\n5.  如果输出是 `λ`，则接受它；否则，拒绝它。\n6.  不断迭代，直到这一步被接受。\n\
  \n```\n密度矩阵 = Σk k λ k | Ψk > < λ k'|\n```\n\n> **注意：** 密度矩阵表示量子系统的统计状态。在经典系统中，概率分布与其等价。\n\
  \n半定规划可以用数学方式表示。给定 `n` 个实数 `c1, cn ∈ R`，以及 `p × p` 厄米矩阵 `D : B1,..,...,...Bp`，目标是最大化\
  \ `Transpose (DX)`，满足 `Transpose(B i X) < c i X >= 0`。变量 `X` 被约束为半正定矩阵。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig3_HTML.jpg](img/490826_1_En_6_Fig3_HTML.jpg)\n\
  \n*图 6-3 – 量子退火：半定规划*\n\n通过半定规划方法解决的问题可以是无约束的，也可以是带有等式和不等式等约束条件的。量子半定规划算法的输入包括一个稀疏矩阵、量子态和量子算子。一个典型的稀疏矩阵每行最多有\
  \ `n` 个非零元素。\n\n量子退火是另一种半定规划技术。它与量子系统的行为相关。这有助于解决 NP 难优化问题。像旅行商这样的优化问题可以使用量子退火来解决。解是物理系统的基态，它基于哈密顿函数。哈密顿函数描述了物理系统的能量和运动。经典的等价算法是模拟退火、随机搜索和梯度下降算法。\n\
  \n> **注意：** 哈密顿算子与量子粒子的势能和动能之和相关。哈密顿算子是厄米的。厄米算子的特征值是实数，且特征函数是正交的。特征值显示了数据的分布或线性变换的特征向量。\n\
  \n半定规划与线性规划相关，是通过将向量替换为半正定矩阵来实现的。它基于线性规划和凸二次规划。半定规划通过使用块对角矩阵、对称矩阵和半定矩阵来推广线性规划。这些方法用于结构设计和基于控制理论的应用中。这些方法也用于化学工业，以确定如何最优地混合化学材料。\n\
  \n最大割问题是一个应用了半定规划的著名问题。最大割问题与在图中识别最大割有关。在一个给定的网络或图中，目标是根据顶点之间边的权重来识别一个顶点子集。最大割问题用于大规模集成电路应用。\n\
  \n该问题的输入是顶点数、边数和带边权重的邻接表。每条边都有起点和终点。目标是识别具有最高总边权重的割。\n\n现在让我们来看一个 `Python` 中的半定规划示例。\n\
  \n数学问题如下：\n\n最小化 `Transpose (CX)`\n\n满足 `Transpose(A i X) < b i X >= 0`。变量 `X` 被约束为半正定矩阵。\n\
  \n在以下 `Python` 代码中，`CMatrix` 是随机生成的。`A` 和 `b` 矩阵也是随机生成的。`CVXPy` 提供了一个用于解决凸优化问题的数学\
  \ API。针对生成的问题计算最优值。\n\n### 代码示例\n\n```python\nimport cvxpy as cvxp\nimport numpy\
  \ as nump\nn = 3\np = 3\nnump.random.seed(1)\nCMat = nump.random.randn(n, n)\nAMat\
  \ = []\nbMat = []\nfor i in range(p):\n    AMat.append(nump.random.randn(n, n))\n\
  \    bMat.append(nump.random.randn())\nXMat = cvxp.Variable((n,n), symmetric=True)\n\
  constraints = [XMat >> 0]\nconstraints += [\n    cvxp.trace(AMat[i]@XMat) == bMat[i]\
  \ for i in range(p)\n]\nproblem = cvxp.Problem(cvxp.Minimize(cvxp.trace(CMat@XMat)),\
  \ constraints)\nproblem.solve()\nprint(\"The optimal value of the problem is\",\
  \ problem.value)\nprint(\"A solution X is\")\nprint(XMat.value)\n```\n\n### 命令\n\
  \n```\npip3 install cvxpy\npip3 install nump\npython3 sdp_cvx.py\n```\n\n### 输出\n\
  \n```\nThe optimal value of the problem is 2.654351510231541\nA solution X is\n\
  [[ 1.60805795 -0.59770492 -0.69576152]\n [-0.59770492  0.22229041  0.24689363]\n\
  \ [-0.69576152  0.24689363  1.39679885]]\n```\n\n类似地，现实生活中的问题可以是最大化或最小化问题。它们可以像前面代码一样建模，并将约束条件建模为线性方程。\n\
  \n\n\n## QAOA\n\n量子近似优化算法与使用多项式时间方法识别优化问题的解有关（见图 6-4）。QAOA 解决的典型问题是 NP 困难问题。\n\n\
  QAOA 方法在量子虚拟机上执行。诸如最大割和图分割等问题均使用 QAOA 来解决。QAOA 方法包含以下步骤：\n\n1.  使用泡利算符对成本函数进行编码。\n\
  2.  使用量子计算框架和算法对问题进行建模。\n3.  使用采样计算基态解。\n\n**提示**\n\n泡利算符与角动量运算相关。角动量运算表示量子粒子在三个空间方向上的自旋。\n\
  \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig4_HTML.jpg](img/490826_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4 – 量子近似优化\n\n最大割问题可以使用 QAOA 方法解决，且与在图论中寻找最大割有关。基态使用哈密顿函数建模，并对状态进行测量。测量多体量子态，从而以更高的概率获得最大割解。在给定的网络或图中，目标是根据顶点之间的边的规模来识别顶点的子群。\n\
  \n让我们来看一个可以应用 QAOA 的现实问题（见图 6-5）。交通运输中的交通建模依赖于交通分区、出行表、公路网络、车辆容量和土地利用模型。土地利用模型包括趋势、土地利用和分区规划、活动区域以及地图。交通系统包含街道、公路、停车、速度、出行时间和限速。交通网络将包含交通量和车辆容量。出行模式识别了交通方式选择、典型的源到目的路径以及出行特征。沃德罗普第一原理基于网络和道路使用者平衡。所有被使用路径的出行时间相等，且比任何一条未被使用的路径的出行时间短一条车的通行时间。该原理有助于最小化一次出行的平均时间。还有其他原理和算法来平衡道路使用者和网络交通流。\n\
  \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig5_HTML.jpg](img/490826_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5 – 交通规划：因素\n\n### 交通规划：因素\n\n出行是基于起点、目的地、车辆和城市交通网络生成的。该网络在不同时区和空间中拥有不断移动的车辆、骑自行车的人和行人。交通规划是一项持续的活动，街道网络基础设施也在不断更新。交通建模使用诸如仿真和机器学习等技术完成。交通控制则利用历史数据，估计某个时间段内的车辆数量，并管理整个网络的交通流。\n\
  \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig6_HTML.jpg](img/490826_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6 – 交通规划：人工智能与机器学习\n\n最大流-最小割方法用于最大化交通网络中的交通流。该方法基于从起点到目的地的最大交通流，等同于将起点与目的地分开的最小割。此方法可应用于计算机网络数据包流。\n\
  \n通过网络的数据包流可以使用最大流-最小割方法进行建模。网络中的信息流经过节点到达目的地。目标是最大化能够流经一个计算机网络的数据包数量。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig7_HTML.jpg](img/490826_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7 – 数据包流：计算机网络\n\n类似地，此方法也可用于为学生分配宿舍，前提是每个学生都想住进自己选择的宿舍。目标是最大化获得宿舍的学生数量。\n\
  \n让我们看看如何在 Python 中使用 QAOA 解决最大割问题。以下示例使用了 Grove 框架和 PyQuil。\n\n### 代码示例\n\n```python\n\
  import numpy as nump\nfrom grove.pyqaoa.maxcut_qaoa import maxcut_qaoa\nimport pyquil.api\
  \ as pyquilapi\n\nqvm_session = pyquilapi.QVMConnection()\nconfiguration_ring =\
  \ [(0,1),(1,2),(2,3),(3,0)]\nsteps = 2\ninst = maxcut_qaoa(graph=configuration_ring,\
  \ steps=steps)\nbetas, gammas = inst.get_angles()\nt = nump.hstack((betas, gammas))\n\
  param_program = inst.get_parameterized_program()\nprogram = param_program(t)\nwave_function\
  \ = qvm_session.wavefunction(program)\nwave_function = wave_function.amplitudes\n\
  for state_index in range(inst.nstates):\n    print(inst.states[state_index], nump.conj(wave_function[state_index])*wave_function[state_index])\n\
  ```\n\n### 命令\n\n```bash\npip3 install nump\npip3 install grove\npip3 install pyquil\n\
  qvm  -S  （单独的终端窗口 1）\npython3 qaoa.py  （终端窗口 2）\n```\n\n### 输出\n\n```text\n0000\
  \ (5.030591151913648e-10+0j)\n0001 (7.986230289234977e-06+0j)\n0010 (7.986230289234498e-06+0j)\n\
  0011 (2.2019121467156433e-07+0j)\n0100 (7.98623028923483e-06+0j)\n0101 (0.49996761419335345+0j)\n\
  0110 (2.2019121467149302e-07+0j)\n0111 (7.98623028923475e-06+0j)\n1000 (7.98623028923475e-06+0j)\n\
  1001 (2.2019121467149302e-07+0j)\n1010 (0.49996761419335345+0j)\n1011 (7.98623028923483e-06+0j)\n\
  1100 (2.2019121467156433e-07+0j)\n1101 (7.986230289234498e-06+0j)\n1110 (7.986230289234977e-06+0j)\n\
  1111 (5.030591151913648e-10+0j)\n```\n\n`0101` 和 `1010` 的波函数振幅为 `0.499`。这些就是该配置中的最大割。图\
  \ 6-8 展示了 `0101` 配置。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig8_HTML.jpg](img/490826_1_En_6_Fig8_HTML.jpg)\n\
  \n图 6-8 – `0101` 配置\n\n图 6-9 展示了 `1010` 配置。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig9_HTML.jpg](img/490826_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9 – `1010` 配置\n\n类似地，交通网络和计算机网络也可以像之前代码中那样表示。约束条件可以通过交通限制和网络节点容量来添加。在这种情况下的目标是最大化流量并最小化割。\n\
  \n现在让我们来看组合优化算法。\n\n## 组合优化\n\n组合优化用于解决现实问题，例如旅行商问题和个人的饮食计算。优化算法使用可能的输入，并找出最大或最小的输出。假设\
  \ `c(x)` 是目标函数。如果目标是最大化 `c(x)`，并且建模的约束条件是 `d(x)` 和 `b(x)`，那么我们有以下条件：\n\n```text\n\
  d(x) < 0\nb(x) = 0\n```\n\n组合优化算法通过离散值找到使目标函数最大化的解。如果目标函数和约束条件是线性的，这种优化算法被称为*线性规划*。\n\
  \n经典优化算法在量子优化中有其对应方法。我们将在下一节中探讨量子半定规划方法。\n\n现在让我们来看基于量子半定规划的量子非确定性多项式算法。\n\n\n\n\
  ## 量子 NP (BQNP)\n\n有界误差量子多项式时间算法是可在量子计算机上运行的多项式时间级技术。计算纽结不变量和量子模拟算法都属于 BQNP 算法。\n\
  \nBQNP 算法的一个典型例子是肖尔算法。该算法基于素数乘积的因式分解。它能够在多项式时间内以有界误差执行。执行时间取决于肖尔算法的操作数量。\n\n肖尔算法以数学家彼得·肖尔的名字命名，是一种用于整数因式分解的量子算法。该量子算法于\
  \ 1994 年提出。它涉及这样一个问题：“给定一个整数 `K`，找出其质因数。”\n\n在量子计算机上，对整数 `K` 进行因式分解时，肖尔算法以多项式时间运行。其执行时间与\
  \ `log K` 成多项式关系。该算法的输入大小为 `log K`。确切地说，它的时间复杂度为 `O((log N)3)`。整数的因式分解问题可以使用 BQP\
  \ 算法在量子计算机上建模。该算法比经典算法快指数级。肖尔算法的效率等同于量子傅里叶变换算法的效率。\n\n## 总结\n\n在本章中，我们研究了与近似优化、半定规划、组合优化和量子非确定性多项式算法相关的技术。此外，我们还详细讨论了近似优化算法。\n\
  \n"
