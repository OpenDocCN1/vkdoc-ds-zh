  4.  计算量子干涉电路。\n5.  筛选干涉概率。\n6.  将高概率质心添加到字典中。\n7.  对数据点集计算上述三个步骤。\n\n对于 k 个簇，可以为量子\
  \ K-Means 技术建模 N 台量子机器。量子态由算法结果得到的质心组构成。可以通过将输入数据分解为不同的数据集，分配给每台量子机器执行算法，从而实现并行化。对量子态进行聚合，并用于迭代。\n\
  \n上一章讨论的鸢尾花数据集可以基于花瓣和花萼的宽度与高度，聚类成三个组（setosa、versicolor、virginica）。该技术试图识别簇内变异较小的簇组。另一个应用是根据人们的收入和支出将其划分为\
