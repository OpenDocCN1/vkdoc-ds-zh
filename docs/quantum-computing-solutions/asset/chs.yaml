  \ range(k):\na = nump.arange(n)\nidx = a[c == j]\nl = len(idx)\nif l:\nmedian[j,:]\
  \ = nump.median(xval[idx,:], axis=0)\nelse:\nmedian[j,:] = median[j,:] + (nump.random.rand(d)\
  \ * di)\nstop = nump.sum(nump.sum(nump.power(median - med_t,2), axis=0))\nif(stop\
  \ = imax):\nbreak\naccur = getAccuracy(c, yval, k)\nsilhou = getSilhouette(xval,\
  \ c, median)\nprint(accur, silhou)\n```\n\n**`k_medians_utils.py`**\n\n```\nimport\
