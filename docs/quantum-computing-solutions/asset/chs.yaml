- "# 10. 量子数据处理\n\n## 引言\n\n> *“量子注意力函数是量子机器学习的关键。”*\n> \n> ——Amit Ray\n\n本章涵盖了量子数据处理这一主题（见图\
  \ 10-1）。您将看到量子数据处理算法如何在日常生活中得以实现。文中提供了诸如 k-means、k-medians 和量子聚类等算法的代码示例。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig1_HTML.jpg](img/490826_1_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1\n\n数据处理\n\n## 初始设置\n\n您需要安装 Python 3.5 才能运行本章中的代码示例。您可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载它。\n\n\n\n## 经典 K-Means\n\n经典 K-Means 技术将输入数据划分为 k 个簇。这 k 个簇必须互不相同，且每个数据点仅属于一个簇。簇的选取基于质心与数据点之间**最小**的平方距离之和。参见图\
  \ 10-2。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig2_HTML.jpg](img/490826_1_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2\n\nK-Means\n\n伪算法的步骤如下所示：\n\n1.  初始化后，随机选取 k 个质心。\n2.  根据数据点与质心之间的最小距离，为每个数据点选择一个质心。\n\
  3.  基于每个簇中数据点的平均值，重新计算每个簇的质心。\n4.  重复前两个步骤。\n\n数据集的选择需要满足均值为 0、标准差为 1 的条件。此技术适用于初始选取的不同质心簇，计算基于\
  \ K-Means 算法。通过比较执行的迭代次数，来选取最佳解决方案。当簇质心的数量与数据集中的不同类型相关联时，便可采用此技术。当变量较多时，该技术的性能更优。该方法面临的挑战在于预测\
  \ k 值。\n\n**提示**\n\n在 K-Means 中，*k* 代表输入数据中的簇数量。\n\n我们来看一下 K-Means 算法的代码实现。\n\n\
  ### 代码示例\n\n```\nimport matplotlib.pyplot as plot\nimport seaborn as seasns; seasns.set()\n\
  import numpy as nump\nfrom sklearn.cluster import KMeans as skKMeans\nfrom sklearn.datasets.samples_generator\
  \ import make_blobs\nX, y_true = make_blobs(n_samples=250, centers=4,\ncluster_std=0.60,\
  \ random_state=0)\nplot.scatter(X[:, 0], X[:, 1], s=50);\nplot.show()\nkmeans_res\
  \ = skKMeans(n_clusters=4)\nkmeans_res.fit(X)\ny_val_kmeans = kmeans_res.predict(X)\n\
  plot.scatter(X[:, 0], X[:, 1], c=y_val_kmeans, s=50, cmap=\"viridis\")\ncenters\
  \ = kmeans_res.cluster_centers_\nplot.scatter(centers[:, 0], centers[:, 1], c=\"\
  grey\", s=200, alpha=0.5);\nplot.show()\n```\n\n### 命令\n\n```\npip3 install seaborn\n\
  pip3 install numpy\npython3 k-means.py\n```\n\n### 输出结果\n\n样本数据绘制并展示在图 10-3 的图表中。\n\
  \n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig3_HTML.jpg](img/490826_1_En_10_Fig3_HTML.jpg)\n\
