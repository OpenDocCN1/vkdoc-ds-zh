  \n图 10-4\n\nK-Means 结果\n\n现在，我们来看一下量子 K-Means 数据处理技术。\n\n## 量子 K-Means\n\n量子 K-Means\
  \ 技术（见图 10-5）是使用一个可包含训练向量的量子电路来应用的。训练向量是初始质心，并且在每一步之后都会重新计算质心。通过使用旋转后的训练向量可以改变电路。训练向量的数量根据簇的数量增加。伪算法步骤如下所示：\n\
  \n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig5_HTML.jpg](img/490826_1_En_10_Fig5_HTML.jpg)\n\
