  \n> **提示**\n> 量子并行性基于存储器寄存器中量子态的叠加。\n\n## 总结\n\n在本章中，我们研究了与量子人工智能算法相关的技术，例如量子概率、量子行走、量子搜索、量子深度学习和量子并行性。\n\
