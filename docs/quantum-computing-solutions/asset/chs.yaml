- "# 7. 量子算法\n\n## 引言\n\n> *“如果你不能对它编程，你就没有理解它。”*\n> \n> ——大卫·多伊奇\n\n本章为你概述量子算法。你将看到量子算法在现实世界中是如何实现的。本章还提供了量子算法的代码示例，例如量子最小二乘拟合和量子排序。\n\
  \n## 初始设置\n\n你需要安装 Python 3.5 来运行本章的代码示例。你可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载。\n\n## 量子最小二乘拟合\n\n在本节中，我们将研究一种名为*量子最小二乘拟合*的算法。\n\n量子信息论有助于高效地解决回归和预测问题。基于量子力学原理的量子算法增强了最小二乘拟合算法的效率。在量子状态层析成像中，量子状态被拟合到一组函数上。量子状态层析成像与量子状态的重构相关。在层析成像过程中，测量量子状态，并创建相同量子状态的系综。\n\
  \n> **提示**\n> \n> 量子状态层析成像是检查量子状态的方法。\n\n经典的最小二乘拟合适用连续函数。一个连续函数在每个区间内都是连续的。在每个区间内，值都是连续的。连续性有三个规则，如下所示：\n\
  \n- 函数需要在某点有定义。\n- 函数在某点需要有单侧极限。\n- 函数在某点的左极限或右极限需要等于该点的函数值。\n\n例如，`f(x) = x²` 是一个连续函数。连续函数的图形是连续的，没有跳跃和渐近线。*渐近线*是函数趋于无穷大的点。定义域包含一组函数有值的点。假设\
  \ `f(x)` 是 `y` 的一个线性函数。那么 `x = A^(-1)y`，其中 `A` 是一个方阵。`A` 的伪逆定义如下：\n\n`A^(+) = (A^(T)A)^(-1)\
  \ A^(T)`\n\n现在，我们来看看最小二乘拟合方法的量子对应形式。量子最小二乘拟合方法基于寻找一个简单的、连续的函数，该函数能够拟合 `M` 个（定义域）点的离散集合\
  \ `{x[j], y[j]}`。该函数可以是非线性的，但需要强制进行线性拟合。该函数用数学形式表示如下：\n\n`f(x, λ) = Σ [j=1]^(M)\
  \ fjλ[j]`\n\n其中 `λ[j]` 是一个分量，属于 `λ` 和 `f(x, λ)`。\n\n最小二乘拟合算法分为三个步骤。\n\n1. 使用量子算法求伪逆。\n\
  2. 使用算法评估拟合质量。\n3. 使用学习算法确定拟合参数 `λ`。\n\n适应度函数衡量解的质量。这是通过衡量解与最优解的接近程度来完成的。适应度得分通过使用适应度参数计算得出。欧几里得距离和曼哈顿距离方法用于计算适应度。欧几里得距离通过计算垂直距离平方和得出。两点\
  \ `(x[1], y[1])` 和 `(x[2], y[2])` 之间的欧几里得距离如下：\n\n`√ (x[1]-x[2])² + (y[1]-y[2])²`\n\
  \n> **提示**\n> \n> 曼哈顿距离定义为点与直线之间的最小距离。点 `(x[1], y[1])` 到直线 `cx + dy + e = 0` 的曼哈顿距离计算如下：`|cx[1]+dy[1]+e|\
  \ / max(|c|, |d|)`。\n\n该算法需要以下提到的输入：\n\n- 期望数据向量\n- 基矩阵\n- 权重向量\n- 拟合矩阵\n- 拟合矩阵的迹\n\
  \n现在，我们来详细了解算法中使用的一些术语。\n\n基矩阵的元素是线性无关的。它由线性无关的向量组合而成。假设我们有一个矩阵 `B`，定义如下：\n\n![矩阵\
  \ B](img/490826_1_En_7_Fig1_HTML.jpg)\n\n*图 7-1: 矩阵 B*\n\n矩阵 `B` 的列是线性无关的。移除冗余的列向量以找到矩阵的基。如果你尝试移除第一列，张成空间将移至\
  \ y 轴。矩阵 `W` 的基使用重要且关键的列定义如下：\n\n![矩阵 B 的基](img/490826_1_En_7_Fig2_HTML.jpg)\n\n\
  *图 7-2: 矩阵 B 的基*\n\n向量数据类型是固定大小的列表。数学向量是具有起点和方向的特定长度的线段。向量的例子包括功、力、加速度和速度。在二维空间中，向量的一个例子是\
  \ `b[1]i + b[2]j`。在三维空间中，向量表示为 `b[1]i + b[2]j + b[3]k`。n 维向量定义为 `b[0] + b[1]t[1]\
  \ + b[2]t[2] + ... + b[n]t[n]`。\n\n让我们看看矩阵迹的定义。矩阵的迹是从左上角到右下角的对角线元素之和。它等于矩阵特征值之和。\n\
  \n假设我们有一个矩阵 `B`，定义如下：\n\n![矩阵的迹](img/490826_1_En_7_Fig3_HTML.jpg)\n\n*图 7-3: 矩阵的迹*\n\
  \n该矩阵的迹定义为 `x[1] + y[2] + z[3]`。\n\n回到算法本身，该算法通过量子最小二乘拟合为数据提供了更好的拟合。图 7-4 展示了量子最小二乘拟合。经典的最小二乘拟合算法可能更接近于一条穿过数据的平均曲线。量子最小二乘拟合则试图最小化不同数据点之间的偏差。\n\
  \n现在让我们研究一下偏差的计算。*偏差*是真实值与预测数据均值之间的差异。产生偏差是因为假设线性函数是拟合函数。量子最小二乘拟合有助于降低偏差，如图 7-4\
  \ 所示。\n\n![量子最小二乘拟合](img/490826_1_En_7_Fig4_HTML.jpg)\n\n*图 7-4: 量子最小二乘拟合*\n\n\n\
  \n### 代码示例\n\n```python\nimport numpy as nump\nfrom scipy import linalg as lina\n\
  from scipy.linalg import lstsq\n\ndef get_least_squares_fit(data, basis_matrix,\
  \ weights=None, PSD=False, trace=None):\n    c_mat = basis_matrix\n    d_mat = nump.array(data)\n\
  \    if weights is not None:\n        w = nump.array(weights)\n        c_mat = w[:,\
  \ None] * c_mat\n        d_mat = w * d_mat\n    rho_fit_mat, _, _, _ = lstsq(c_mat.T,\
  \ d_mat)  # Fitting calculation\n    print(rho_fit_mat)\n    size = len(rho_fit_mat)\n\
  \    dim = int(nump.sqrt(size))\n    if dim * dim != size:\n        raise ValueError(\"\
  fitted vector needs to be a square matrix\")\n    rho_fit_mat = rho_fit_mat.reshape(dim,\
  \ dim, order=\"F\")\n    if PSD is True:\n        rho_fit_mat = convert_positive_semidefinite_matrix(rho_fit_mat)\n\
  \    if trace is not None:\n        rho_fit_mat *= trace / nump.trace(rho_fit_mat)\n\
  \    return rho_fit_mat\n\ndef convert_positive_semidefinite_matrix(mat, epsilon=0):\n\
  \    if epsilon < 0:\n        raise ValueError('epsilon needs to be positive')\n\
  \    dim = len(mat)\n    v, w = lina.eigh(mat)\n    for j in range(dim):\n     \
  \   if v[j] < epsilon:\n            tmp = v[j]\n            v[j] = 0.\n        \
  \    x = 0.\n            for k in range(j + 1, dim):\n                x += tmp /\
  \ (dim - (j + 1))\n                v[k] = v[k] + tmp / (dim - (j + 1))\n    matrix_psd\
  \ = nump.zeros([dim, dim], dtype=complex)\n    for j in range(dim):\n        matrix_psd\
  \ += v[j] * nump.outer(w[:, j], nump.conj(w[:, j]))\n    return matrix_psd\n\ndata\
  \ = [12, 21, 23.5, 24.5, 25, 33, 23, 15.5, 28, 19]\nu_matrix = nump.arange(0, 10)\n\
  basis_matrix = nump.array([u_matrix, nump.ones(10)])\nrho_fit_val = get_least_squares_fit(data,\
  \ basis_matrix)\n```\n\n### 命令\n\n```\npip3 install numpy\npip3 install scipy\n\
  python3 quantum_least_squares_fit.py\n```\n\n### 输出\n\n```\n[ 0.45757576 20.39090909]\n\
  ```\n\n解为 `v = 0.4575u + 20.39`。\n\n**提示：** 你可以修改之前用于经典方法和量子方法的代码，用于季节性销售数据预测：`v\
  \ = w[1]u + c`。\n\n## 量子排序\n\n排序算法按照指定顺序对一组元素进行排列。经典排序方法有不同类型：\n\n- 冒泡排序\n- 选择排序\n\
  - 归并排序\n- 插入排序\n- 快速排序\n- 堆排序\n\n冒泡排序、选择排序和堆排序通过将元素逐一移动到最终位置来操作。插入排序、快速排序等方法将元素放置在接近最终位置的临时位置上，如图\
  \ 7-5 所示。\n\n![经典排序方法](img/490826_1_En_7_Fig5_HTML.jpg)\n\n**图 7-5** 经典排序方法\n\n\
  在现实生活中，电话目录和字典分别是按姓名和字母顺序排序的例子。排序可分为两种不同的技术：\n\n- 原地排序\n- 非原地排序\n\n原地排序是指在组内移动元素，不占用额外内存或空间。非原地排序是指使用额外空间来排序元素。冒泡排序基于原地排序，而归并排序基于非原地排序。\n\
  \n让我们来看看 Python 中的快速排序算法。快速排序算法选取一组元素，将其按升序排列。程序的输入为 `4, 9, 18, 11, 3, 2, 0`。排序后的元素为\
  \ `0, 2, 3, 4, 9, 11, 18`。\n\n### 代码示例\n\n```python\ndef sort_quick_sort_method(group):\n\
  \    if len(group) <= 1:\n        return group\n    pivot_value = group[len(group)\
  \ // 2]\n    left_value = [x for x in group if x < pivot_value]\n    middle_value\
  \ = [x for x in group if x == pivot_value]\n    right_value = [x for x in group\
  \ if x > pivot_value]\n    return sort_quick_sort_method(left_value) + middle_value\
  \ + sort_quick_sort_method(right_value)\n\nprint(sort_quick_sort_method([4, 9, 18,\
  \ 11, 3, 2, 0]))\n```\n\n### 命令\n\n```\npython3 quick_sort_method.py\n```\n\n###\
  \ 输出\n\n```\n[0, 2, 3, 4, 9, 18, 11]\n```\n\n数据按升序排列。\n\n量子排序方法的性能可能为 `O(M log M)`，与经典排序方法类似。在空间受限的排序中，量子排序方法优于经典方法，如图\
  \ 7-6 所示。量子算法有助于使用量子比特对复杂问题进行建模；当空间受限时，这些方法非常适用。\n\n![量子排序](img/490826_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** 量子排序\n\n我们将探讨量子算法中排序效率优于经典算法的方法。量子排序方法使用量子算法对元素进行排序，只需 `0.526 log M\
  \ + O(M)` 步，而经典插入排序的效率为 `O(M log M)`。Ambainis 下界方法具有 `O(M)` 的效率，用于识别下界。该算法通过 Grover\
  \ 搜索算法找到最小值并在列表上迭代。此方法由 Christoph Durr 和 Peter Hoyer 发现。\n\nGrover 搜索算法可用于在电话目录中查找电话号码。电话目录包含人员、公司和企业的姓名。目录将存储在数据库中。当使用浏览器在线搜索时，基于输入的名称，必须在数据库中进行搜索。数据大多数情况下是未排序的。它可能基于某个标识符进行索引，以提高性能。输入可以是名字、中间名和姓氏。让我们看看一种改进的量子排序算法，它有助于加速这一过程。字典结构可以具有排序后的键（使用量子排序算法）以加快搜索速度。\n\
  \n上述量子算法的另一个版本经过以下步骤：\n\n1. 识别并存储组中的最小元素。\n2. 使用这些元素创建一个堆。\n3. 将 `k` 从 `1` 迭代到 `m`，从堆中找到最小值，并将该元素插入到位置\
  \ `k` 处的另一个堆中。\n\n该算法的效率为 `O(√M log(1/queries))`。\n\n量子纠缠发生在量子粒子相互作用并分离时。它们共享相同的量子力学状态。这些纠缠的粒子成对连接。量子系统中的量子粒子包括电子、原子、光子和分子。量子粒子的状态与位置、自旋、动量和偏振有关。这种远程连接粒子的现象挑战了相对论。当状态发生变化时，纠缠的伙伴会相互影响。这被用于量子密码学和基于量子隐形传态的应用中。\n\
  \n量子纠缠是量子粒子叠加态的一个独特属性。现在让我们看看叠加的定义。当量子系统可以处于多个状态（多于一个）时，就会发生叠加状态。叠加状态可以表示为波函数。在数学上，波函数是量子态与复数系数的线性组合。在纠缠的情况下，孪生粒子的波函数无法分离。数学上，量子系统的波函数不等于粒子波函数的乘积。\n\
  \n两个量子比特的纠缠状态可以表示为：\n\n`|E1> = (1/√2) (|00> ± |11>)`\n\n`|E2> = (1/√2) (|01> ± |10>)`\n\
  \n量子比特的状态可以是 `|00>`、`|11>`、`|01>` 和 `|10>`。\n\n回到使用量子算法进行排序，量子纠缠原理可用于对包含 `M` 个元素的数组进行排序。该原理基于量子纠缠的特性：如果我们识别出其中一个量子比特，就能知道另一个量子比特。该算法经过以下步骤：\n\
  \n1. 输入为一个包含 `M` 个元素的列表。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 2. 元素可以转换为二进制表示。\n\n### 3. 在每个元素的最高有效位上加 1。\n\n### 4. 基于纠缠特性创建两个集合。\n\n\
  ### 5. 将列表分成两个集合。\n\n### 6. 删除两个最高有效位。\n\n### 7. 从步骤 3 开始迭代，直到找到单个比特。应用一个量子单比特比较门。\n\
  \n现在，让我们来看看算法中提到的几个术语。一个数的二进制表示是该数在基数为 2 的计数系统中的表示。它使用数字 1 和 0 表示。零值在二进制形式中是 0，一值在二进制状态中相当于\
  \ 1，10 在二进制数系统中相当于 2。类似地，3、4 和其他数字通过在二进制系统的左右数位上加或减来表示。\n\n让我们看看最高有效位的定义。最高有效位是二进制形式中值最大的位。例如，二进制数`01000100`的最高有效位是\
  \ 0（即该数最左边的起始位）。\n\n现在，我们来看量子单比特比较器的定义。在经典计算中，XNOR 门是比较门。该门接收两个比特作为输入，如果比特相等则输出\
  \ 1。量子比较器会翻转目标中的量子比特。这个量子比特是基于量子输入寄存器选择的。比较器检查两个量子态，并选择值较大的那个。\n\n量子排序提高了从数据库中排序数据的效率，类似于\
  \ Grover 搜索算法。Grover 搜索有助于以`O(√M)`的阶数搜索大型数据存储，而经典搜索算法则需要`O(M)`。举例来说，在包含 100 万条记录的电话簿中搜索，需要\
  \ 1000 步。搜索市场规模约为 200 亿美元，许多像谷歌和 IBM 这样的大公司正专注于使用量子算法进行搜索优化。Grover 算法在挑战对称密码学方面潜力巨大。\n\
  \n现在让我们看一下对称密码算法。对称密码算法的一个例子是高级加密标准（AES）。AES 算法基于对称密钥和对称分组密码。AES 算法提供 128 位、192\
  \ 位和 256 位的密钥来加密和解密数据。密钥的对称性在于使用相同的密钥进行加密和解密。\n\n现在回到量子排序，我们来看看 Python 中的 Grover\
  \ 搜索算法。\n\n#### 代码\n\n```python\nimport numpy as nump\nimport string\nimport hashlib\n\
  from math import sqrt, pi\nfrom collections import OrderedDict\nfrom statistics\
  \ import mean\n\ndef GetOracleFunction(xvalue):\n    return hashlib.sha256(bytes(xvalue,\
  \ 'utf-8')).hexdigest()\n\ndef ExecuteGroverAlgorithm(target, objects, nvalue, rounds):\n\
  \    y_pos = nump.arange(nvalue)\n    amplitude = OrderedDict.fromkeys(objects,\
  \ 1/sqrt(nvalue))\n    for i in range(0, rounds, 2):\n        for k, v in amplitude.items():\n\
  \            if GetOracleFunction(k) == target:\n                amplitude[k] =\
  \ v * -1\n        average = mean(amplitude.values())\n        for k, v in amplitude.items():\n\
  \            if GetOracleFunction(k) == target:\n                amplitude[k] =\
  \ (2 * average) + abs(v)\n                continue\n            amplitude[k] = v-(2*(v-average))\n\
  \    return amplitude\n\ntarget_algorithm = '3'\nobjects_grover = ('4', '5', '3',\
  \ '7','9','11','97')\nnumber = len(objects_grover)\namplitude_grover = OrderedDict.fromkeys(objects_grover,\
  \ 1/sqrt(number))\namplitude_grover[target_algorithm] = amplitude_grover[target_algorithm]\
  \ * -1\naverage_grover = mean(amplitude_grover.values())\nprint(\"Mean is {}\".format(average_grover))\n\
  \nfor k, v in amplitude_grover.items():\n    if k == target_algorithm:\n       \
  \ amplitude_grover[k] = (2 * average_grover) + abs(v)\n        continue\n    amplitude_grover[k]\
  \ = v-(2*(v-average_grover))\n\nprint(amplitude_grover)\n\nneedle_value = \"2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881\"\
  \nhaystack_value = string.ascii_lowercase\nnum = len(haystack_value)\nnum_rounds\
  \ = int((pi / 4) * sqrt(num))\nprint(\"number of rounds are {}\".format(num_rounds))\n\
  \namplitude_grover = ExecuteGroverAlgorithm(needle_value, haystack_value, num, num_rounds)\n\
  print(amplitude_grover)\n```\n\n### 命令\n\n```\npip3 install numpy\npip3 install\
  \ hashlib\npython3 quantum_sort.py\n```\n\n### 输出\n\n```\nMean is 0.26997462357801943\
  \ OrderedDict([('4', 0.16198477414681167), ('5', 0.16198477414681167), ('3', 0.9179137201652661),\
  \ ('7', 0.16198477414681167), ('9', 0.16198477414681167), ('11', 0.16198477414681167),\
  \ ('97', 0.16198477414681167)])\nnumber of rounds are 4\nOrderedDict([('a', 0.11024279785874247),\
  \ ('b', 0.11024279785874247), ('c', 0.11024279785874247), ('d', 0.11024279785874247),\
  \ ('e', 0.11024279785874247), ('f', 0.11024279785874247), ('g', 0.11024279785874247),\
  \ ('h', 0.11024279785874247), ('i', 0.11024279785874247), ('j', 0.11024279785874247),\
  \ ('k', 0.11024279785874247), ('l', 0.11024279785874247), ('m', 0.11024279785874247),\
  \ ('n', 0.11024279785874247), ('o', 0.11024279785874247), ('p', 0.11024279785874247),\
  \ ('q', 0.11024279785874247), ('r', 0.11024279785874247), ('s', 0.11024279785874247),\
  \ ('t', 0.11024279785874247), ('u', 0.11024279785874247), ('v', 0.11024279785874247),\
  \ ('w', 0.11024279785874247), ('x', 0.8343639122151143), ('y',0.11024279785874247),\
  \ ('z', 0.11024279785874247)])\n```\n\n> **提示**  \n> Oracle 函数是一个黑盒，是算法的一部分。Oracle\
  \ 函数将作为另一个算法的输入。\n\n现在让我们看看量子本征求解器。\n\n## 量子本征求解器\n\n量子本征求解器有助于识别矩阵 `G` 的特征值。该求解器计算特定哈密顿量的最低特征值的上限。该方法在性能上优于迭代量子相位估计和量子相位估计技术。量子相位估计技术用于计算分子的基态能量。\n\
  \n> **提示**  \n> 哈密顿矩阵用于表示系统可能的能量。它代表了系统的不同状态。\n\n上下文中的系统可以存在于多个状态中，每个状态都有一个特定的能量值。特征值是系统的状态值，它们代表与系统状态相关的能量。\n\
  \n现在，让我们看看量子半定规划。\n\n## 量子半定规划\n\n量子半定规划与凸优化有关。凸优化基于线性函数和约束。约束是数学等式或不等式。量子半定规划在第\
  \ 6 章中通过代码示例进行了详细讨论。\n\n## 总结\n\n在本章中，我们研究了与量子算法相关的技术，例如量子最小二乘拟合和量子排序。详细讨论了量子本征求解器的概念。\n\
  \n"
- "# 8. 量子神经网络算法\n\n## 引言\n\n> *“受我们这个时代的科学和科幻小说的双重激励，我们这一代研究人员和工程师在成长过程中不断追问：如果这样会怎样？下一步是什么？我们继而投身于计算机视觉、人工智能、实时语音翻译、机器学习和量子计算等新兴学科。”*\
  \  \n> —伊丽莎白·贝尔\n\n本章将介绍量子神经网络这一主题。您将看到量子神经网络如何在现实生活中实现。本文提供了与量子人工神经网络（ANN）、量子联想记忆、量子点、量子生成对抗网络（GAN）和量子随机存取存储器相关的量子神经网络主题的代码示例。\n\
  \n## 初始设置\n\n您需要安装 Python 3.5 才能运行本章中的代码示例。您可以从[`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)下载它。\n\
  \n\n\n## 量子人工神经网络\n\n在本节中，我们将探讨量子人工神经网络。量子神经网络是经典神经网络在量子领域的对应物，其基础是量子力学原理。量子神经网络建立在量子信息处理与大脑量子效应之上。量子人工神经网络常用于模式分类算法。\n\
  \n> **提示**  \n> 模式分类是指针对给定输入值，在多个可能的分组中识别出正确归属类别的过程。\n\n让我们先来了解经典神经网络。\n\n## 经典神经网络\n\
  \n神经网络包含输入层、输出层和隐藏层。网络会根据输出层的使用方式对输入进行调整。神经网络的概念源于对人脑的模拟。自 20 世纪 40 年代以来，神经网络就已属于人工智能的一部分。其发展得益于反向传播方法——当输出的预期值与输入的结果不相等时，该方法有助于调整隐藏层。\n\
  \n例如，一个旨在识别板球的神经网络可能会出错，反而识别出网球。深度学习神经网络是多层的高级神经网络，它通过提取多种特征来识别上下文中的物体。\n\n深度学习神经网络就像一条传送带，将粗糙的铁棒逐渐加工成特定的零件。在深度学习的每个阶段，网络都具备识别和提取特征的能力。人工神经网络基于数学模型，由相互连接的“神经元”组成。神经元携带的信息与加权连接相对应。作为输入值的神经元信号通过神经连接传递，这些连接是带有权重的。深度学习神经网络能够利用适当的权重对输入数据进行学习、调整和归一化。\n\
  \n## 神经网络的量子类比\n\n在了解经典神经网络之后，我们现在可以探讨其在量子领域的对应物。经典人工神经网络具备并行处理大数据的能力，从而拥有强大的计算力。量子神经网络因基于量子力学原理的量子并行性，也能处理类似规模的大数据。一个包含\
  \ M 个量子比特的量子寄存器，拥有量子计算机可处理的多种不同配置。\n\n量子纠缠和量子叠加是测量量子比特状态的关键原理。一个量子神经网络由相互连接的输入神经元、隐藏神经元和输出神经元构成。霍普菲尔德模型就是量子神经网络的一个例子。霍普菲尔德模型于\
  \ 1982 年被引入人工神经网络领域。约翰·霍普菲尔德发现了神经网络中的对称键和量子自旋玻璃现象。\n\n> **提示**  \n> 霍普菲尔德网络可应用于图像处理与分析，以及医学图像分析与修复。\n\
  \n神经计算方法基于数据处理的非线性技术。量子计算方法具有进化特性，因为它基于量子力学的进化算子。哥本哈根诠释指出，在量子系统中，进化行为与非进化行为是相互融合的。模式召回并非进化算子，而是一个非幺正过程。费曼对量子力学的诠释采用了路径积分方法。伊丽莎白·贝尔曼和格策尔提出了一种量子神经网络的时序模型。见图\
  \ 8-1。\n\n![../images/490826_1_En_8_Chapter/490826_1_En_8_Fig1_HTML.jpg](img/490826_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1  \n量子神经网络\n\n量子神经网络在其模型中使用量子点分子和光学光子。QNN 的时序模型由虚拟神经元的数学方程构建。QNN 中虚拟神经元的数量由时间离散化参数决定。威奇塔州立大学创建了一个基于\
  \ QNN 空间模型的新模型，该空间模型使用量子点分子阵列。\n\n来自萨塞克斯大学的罗恩·克里斯利提出了一种不同的方法，该方法与依赖于狭缝位置的网络权重有关。一种基于神经计算的量子神经网络被用于现实生活中的模式识别。\n\
  \n### 代码示例\n\n```python\nimport pennylane as qnnL\nfrom pennylane import numpy as\
  \ numcal\nfrom pennylane.optimize import AdamOptimizer as AdamO\ntry:\n    device\
  \ = qnnL.device('strawberryfields.fock', wires=1, cutoff_dim=10)\nexcept:\n    print(\"\
  please install the package strawberryfields\")\ndef GetQNNLayer(varr):\n    \"\"\
  \" 量子神经网络的一层\n    \"\"\"\n    qnnL.Rotation(varr[0], wires=0)\n    qnnL.Squeezing(varr[1],\
  \ 0., wires=0)\n    qnnL.Rotation(varr[2], wires=0)\n    qnnL.Displacement(varr[3],\
  \ 0., wires=0)\n    qnnL.Kerr(varr[4], wires=0)\n@qnnL.qnode(device)\ndef GetQNN(vars,\
  \ xcoor=None):\n    \"\"\" 返回量子神经网络\n    \"\"\"\n    qnnL.Displacement(xcoor, 0.,\
  \ wires=0)\n    for var in vars:\n        GetQNNLayer(var)\n    return qnnL.expval.X(0)\n\
  def GetQNNSquareLoss(labelValues, predictionValues):\n    \"\"\" 获取平方损失函数\n    \"\
  \"\"\n    lossValue = 0\n    for label, prediction in zip(labelValues, predictionValues):\n\
  \        lossValue = lossValue + (label - prediction) ** 2\n    lossValue = lossValue\
  \ / len(labelValues)\n    return lossValue\ndef GetQNNCost(variables, featureValues,\
  \ labelValues):\n    \"\"\" 最小化成本函数\n    \"\"\"\n    predictions = [GetQNN(variables,\
  \ xcoor=x) for x in featureValues]\n    return GetQNNSquareLoss(labelValues, predictions)\n\
  sincurvevalues = numcal.loadtxt(\"sin_curve_values.txt\")\nxcoordinate= sincurvevalues[:,\
  \ 0]\nycoordinate = sincurvevalues[:, 1]\nnumcal.random.seed(0)\nlayer_recount =\
  \ 4\nvariable_initial = 0.05 * numcal.random.randn(layer_recount, 5)\noptimizer\
  \ = AdamO(0.01, beta1=0.9, beta2=0.999)\nvariable = variable_initial\nfor iteration\
  \ in range(500):\n    var_cost = optimizer.step(lambda v: GetQNNCost(v, xcoordinate,\
  \ ycoordinate), variable)\n    print(\"Iteration value: {:5d} | Cost is: {:0.7f}\
  \ \".format(iteration + 1, GetQNNCost(var_cost, xcoordinate, ycoordinate)))\n```\n\
  \n### 命令\n\n```bash\npip3 install numpy\npip3 install pennylane\npython3 qnn.py\n\
  ```\n\n### 输出\n\n```\nIteration value:     1 | Cost is: 0.2689702\nIteration value:\
  \     2 | Cost is: 0.2768397\nIteration value:     3 | Cost is: 0.2801266\nIteration\
  \ value:     4 | Cost is: 0.2819382\nIteration value:     5 | Cost is: 0.2830613\n\
  Iteration value:     6 | Cost is: 0.2837995\nIteration value:     7 | Cost is: 0.2842974\n\
  Iteration value:     8 | Cost is: 0.2846337\nIteration value:     9 | Cost is: 0.2848555\n\
  Iteration value:    10 | Cost is: 0.2849926\n...........................................\n\
  ...........................................\n...........................................\n\
  Iteration value:   494 | Cost is: 0.2406537\nIteration value:   495 | Cost is: 0.2406112\n\
  Iteration value:   496 | Cost is: 0.2405687\nIteration value:   497 | Cost is: 0.2405263\n\
  Iteration value:   498 | Cost is: 0.2404840\nIteration value:   499 | Cost is: 0.2404417\n\
  Iteration value:   500 | Cost is: 0.2403996\n```\n\n\n\n## 量子联想记忆\n\n量子联想记忆基于一种量子神经计算方法。记忆与回忆是模式联想过程的组成部分。模式在记忆步骤中被持久化存储。回忆步骤则由模式联想和模式补全组成。\n\
  \n记忆是一种量子算法，它使用 `m` 个量子比特创建量子态，以建模 `q` 个模式。该算法使用多项式数量的基本操作，这些操作涉及 1、2 和 3 个量子比特。算法使用受控非门和弗雷德金量子门进行数学运算。为了使用\
  \ `m` 个量子神经元建模 `q` 个模式，该算法按 `mq` 步的数量级执行。\n\n量子联想记忆中的回忆步骤基于格罗弗搜索算法。该搜索算法在包含 `m`\
  \ 个项目的数据库中，以 `√m` 时间量级找到目标项目。记忆和回忆算法被融合在一起，形成了量子联想记忆过程。\n\n量子联想记忆算法由丹·文图拉和托尼·马丁内斯创建。该算法与基于量子电路的计算机上的联想记忆模拟相关。在量子联想记忆中，量子比特处于叠加态。格罗弗算法可以通过量子联想记忆算法进行修改，以便根据搜索输入，通过记忆状态进行搜索。\n\
  \n量子联想记忆在神经网络领域应用广泛。这种记忆的存储容量与神经网络中神经元的数量呈指数关系。该记忆模型基于人脑的记忆方式，人脑中的处理过程就是基于神经网络的。\n\
  \n> **提示**\n> \n> 量子联想记忆算法基于一个多项式时间算法，该算法使用基于训练数据集的量子比特集来创建量子态。\n\n现在，让我们来看一个叫做*量子点*的概念。\n\
  \n## 量子点\n\n量子点是尺寸在纳米级别的粒子。这些粒子在受到光照时会发光。粒子发射光的波长可以通过量子点的大小、形状和材料来改变。尺寸为 2 到 3 纳米的量子点会产生蓝绿光谱区域。尺寸为\
  \ 5 到 6 纳米的量子点则发射与橙色、红色和红外光谱区域相关的光。量子点的大小与发射光的寿命相关。量子点越大，寿命越长。\n\n纳米粒子比量子点尺寸更大。纳米粒子的尺寸为\
  \ 8 到 100 纳米。量子点器件基于量子点构建。在量子点器件中，量子点通过隧穿效应与引线连接。计算稳态粒子的电流时，会使用多种一阶方法。泡利、林德布拉德、雷德菲尔德和冯·诺依曼所采用的方法被用于计算库仑阻塞效应。还有一些二阶方法，例如冯·诺依曼的\
  \ `-2vN` 方法，可用于分析协同隧穿、双粒子隧穿以及展宽效应。\n\n> **提示**\n> \n> 量子点有助于制造荧光和基于 FRET 的生物传感器。这些生物传感器用于识别生物分子，例如酸、酶、糖类、抗体和抗原。\n\
  \n现在，我们来看一下量子随机存取存储器的概念。\n\n## 量子随机存取存储器\n\n量子随机存取存储器基于 `m` 个量子比特，来创建包含 `2^m` 个不同存储单元的地址空间。该内存模型用于实现\
  \ `m` 个存储单元的叠加。与传统的量子 RAM 设计不同，该模型基于 `O(log 2^m)` 个开关。该模型有助于使用更低的功耗进行寻址。这是通过利用纠缠原理实现的。\n\
  \n`QRAM` 是量子计算机的基础。基于量子比特的地址寄存器和输出寄存器有助于管理 `QRAM` 中的内存。内存访问算法基于相干量子叠加。`QRAM` 用于量子搜索、碰撞识别、元素唯一性检测、信号的相干路由以及加密数据搜索。\n\
  \n让我们来看一下量子生成对抗网络算法。\n\n## 量子 GAN\n\n在经典机器学习中，生成对抗网络是一种工具。生成器用于生成数据的统计特征。它试图模仿当前的数据集。判别器则用于区分真实数据和伪造数据。生成器和判别器的学习过程会收敛。当生成器生成的统计特征使得判别器无法区分真实数据和生成数据时，收敛便发生了。见图\
  \ 8-2。\n\n![../images/490826_1_En_8_Chapter/490826_1_En_8_Fig2_HTML.jpg](img/490826_1_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** QGAN\n\n量子生成对抗网络（`QGANs`）是使用了量子处理器的生成对抗网络。塞斯·劳埃德和克里斯蒂安·韦德·布鲁克首先提出了这种对抗学习算法。该算法运行在具有包含量子比特的量子寄存器的量子计算机上。量子比特存在于\
  \ 0 和 1 两种状态。量子计算机在非常高维的向量空间中处理向量。这些向量承载着需要被处理的信息。\n\n让我们来看一个量子生成对抗网络的实现。该实现基于两个量子电路：一个生成器和一个判别器。\n\
  \n\n\n### 代码示例\n\n```python\nimport pennylane as qganPenny\nfrom pennylane import\
  \ numpy as numcal\nfrom pennylane.optimize import GradientDescentOptimizer as GDO\n\
  \ndevice = qganPenny.device('default.qubit', wires=3)\n\ndef GetQGANReal(phi, theta,\
  \ omega):\n    qganPenny.Rot(phi, theta, omega, wires=0)\n\ndef GetQGANGenerator(wireArray):\n\
  \    qganPenny.RX(wireArray[0], wires=0)\n    qganPenny.RX(wireArray[1], wires=1)\n\
  \    qganPenny.RY(wireArray[2], wires=0)\n    qganPenny.RY(wireArray[3], wires=1)\n\
  \    qganPenny.RZ(wireArray[4], wires=0)\n    qganPenny.RZ(wireArray[5], wires=1)\n\
  \    qganPenny.CNOT(wires=[0,1])\n    qganPenny.RX(wireArray[6], wires=0)\n    qganPenny.RY(wireArray[7],\
  \ wires=0)\n    qganPenny.RZ(wireArray[8], wires=0)\n\ndef GetQGANDiscriminator(wireArray):\n\
  \    qganPenny.RX(wireArray[0], wires=0)\n    qganPenny.RX(wireArray[1], wires=2)\n\
  \    qganPenny.RY(wireArray[2], wires=0)\n    qganPenny.RY(wireArray[3], wires=2)\n\
  \    qganPenny.RZ(wireArray[4], wires=0)\n    qganPenny.RZ(wireArray[5], wires=2)\n\
  \    qganPenny.CNOT(wires=[1,2])\n    qganPenny.RX(wireArray[6], wires=2)\n    qganPenny.RY(wireArray[7],\
  \ wires=2)\n    qganPenny.RZ(wireArray[8], wires=2)\n\n@qganPenny.qnode(device)\n\
  def GetQGANRealDiscCircuit(phi, theta, omega, discWeights):\n    GetQGANReal(phi,\
  \ theta, omega)\n    GetQGANDiscriminator(discWeights)\n    return qganPenny.expval.PauliZ(2)\n\
  \n@qganPenny.qnode(device)\ndef GetQGANDiscCircuit(genWeights, discWeights):\n \
  \   GetQGANGenerator(genWeights)\n    GetQGANDiscriminator(discWeights)\n    return\
  \ qganPenny.expval.PauliZ(2)\n\ndef GetQGANRealTrue(discWeights):\n    trueDiscriminatorOutput\
  \ = GetQGANRealDiscCircuit(phi, theta, omega, discWeights)\n    probabilityRealTrue\
  \ = (trueDiscriminatorOutput + 1) / 2\n    return probabilityRealTrue\n\ndef GetQGANFakeTrue(genWeights,\
  \ discWeights):\n    fakeDiscriminatorOutput = GetQGANDiscCircuit(genWeights, discWeights)\n\
  \    probabilityFakeTrue = (fakeDiscriminatorOutput + 1) / 2\n    return probabilityFakeTrue\n\
  \ndef GetQGANDiscriminatorCost(discWeights):\n    cost = GetQGANFakeTrue(genWeights,\
  \ discWeights) - GetQGANRealTrue(discWeights)\n    return cost\n\ndef GetQGANGeneratorCost(genWeights):\n\
  \    return -GetQGANFakeTrue(genWeights, discWeights)\n\nphi = numcal.pi / 6\ntheta\
  \ = numcal.pi / 2\nomega = numcal.pi / 7\nnumcal.random.seed(0)\nepsValue = 1e-2\n\
  genWeights = numcal.array([numcal.pi] + [0] * 8) + numcal.random.normal(scale=epsValue,\
  \ size=[9])\ndiscWeights = numcal.random.normal(size=[9])\ngdo = GDO(0.1)\n\nprint(\"\
  训练判别器 \")\nfor iteration in range(50):\n    discriminator_weights = gdo.step(GetQGANDiscriminatorCost,\
  \ discWeights)\n    discriminator_cost = GetQGANDiscriminatorCost(discriminator_weights)\n\
  \    if iteration % 5 == 0:\n        print(\"迭代 {}: 判别器成本 = {}\".format(iteration+1,\
  \ discriminator_cost))\n        print(\" 判别器 - 真实为真: \", GetQGANRealTrue(discWeights))\n\
  \        print(\"判别器 - 生成为真: \", GetQGANFakeTrue(genWeights, discWeights))\n\nprint(\"\
  训练生成器.\")\nfor iteration in range(200):\n    generator_weights = gdo.step(GetQGANGeneratorCost,\
  \ genWeights)\n    generator_cost = -GetQGANGeneratorCost(generator_weights)\n \
  \   if iteration % 5 == 0:\n        print(\"迭代次数 {}: 生成器成本 = {}\".format(iteration,\
  \ generator_cost))\n        print(\"判别器 - 真实为真: \", GetQGANRealTrue(discWeights))\n\
  \        print(\"判别器 - 生成为真: \", GetQGANFakeTrue(genWeights, discWeights))\n   \
  \     print(\"成本为: \", GetQGANDiscriminatorCost(discriminator_weights))\n```\n\n\
  ### 命令\n\n```bash\npip3 install numpy\npip3 install pennylane\npython3 qgan.py\n\
  ```\n\n### 输出\n\n```\nTraining the discriminator\nIteration num 1: discriminator\
  \ cost is = -0.10942017805789161\nIteration num 6: discriminator cost is = -0.10942017805789161\n\
  Iteration num 11: discriminator cost is = -0.10942017805789161\nIteration num 16:\
  \ discriminator cost is = -0.10942017805789161\nIteration num 21: discriminator\
