  ## 量子计算的未来


  量子处理单元上的量子比特数量正持续增长，并在过去十年中每年翻一番。诸如`IBM`等公司的目标，是扩大制造工艺以生产规模达`10,000`个量子比特的量子处理单元。`谷歌`、`IBM`、`微软`和`NASA`正在其研究和公司
  IT 基础设施中使用量子计算机。


  据 D-Wave 公司首席执行官 Vern Brownell 称：


  > `谷歌`已经创建了他们所谓的量子人工智能实验室，正在那里探索利用我们的计算机进行人工智能或学习应用。而`NASA`有一系列正在研究的问题，从寻找系外行星到解决物流问题等。我想在五年内，这项技术将在各行各业得到广泛应用。虽然量子计算领域的商业应用大多还只是理论上的期望，但专家一致认为量子计算在一个领域具有价值：优化。利用量子计算创建一个能够“思考”如何让商业运营更快、更智能、更便宜的程序，可能会彻底改变无数行业。


  量子人工智能与受生物大脑和量子力学启发的学习模型相关。这些模型基于对量子比特的数学运算，用于解决现实生活中的问题。分布式系统和基于并行架构的系统用于运行这些算法和模型。由于一个量子比特可以处理`0`和`1`等多种状态，因此可以用`n`个量子比特在短时间内解决巨大的问题。


  海森堡不确定性原理利用了关于粒子动量和位置的信息。任何计算位置的观测都会导致粒子动量出现误差。同样，任何动量的计算都会导致位置出现误差。量子人工智能算法基于量子比特的一组变换。计算过程不会测量系统状态，而测量正是导致信息误差的原因。单个量子算法无法找到
  NP 完全问题的所有解。上下文中问题的结构被用作解决 NP 完全问题的基础。


  量子人工智能无法帮助改变日常办公任务，如阅读、写作和数学计算。在读取大数据、撰写报告或执行数学计算时，量子计算机将派不上用场。企业中的顺序操作将需要经典计算机。未来，组织中的复杂算法将在量子计算机上执行。


  经典计算机和服务器将用于一系列包含手动和自动化操作的标准流程。这些操作可能与验证、检查、工作流、通信、通知、数据收集和数据存储有关。数据流和推送模型将需要标准计算机来收集数据并流式传输给各个订阅方。


  ### 面向量子计算的企业软件和服务


  在企业软件和服务领域，与化学、制药和制造相关的解决方案正在不断发展。药物发现以及研发缩减是制药领域应用量子技术和方法的关键领域。量子软件正在被开发用来解决现实生活中的优化问题。另一个应用领域是自动驾驶。网络安全/密码学是量子软件和解决方案正在发展的另一个领域。


  ### 量子机器学习


  量子机器学习（QML）是另一个正在发展新解决方案和产品的领域。


