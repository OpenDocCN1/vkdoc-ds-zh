  \ * (1 - probability[mask,i])\nprobability[~mask,i] = (1 - alpha) * probability[~mask,i]\n\
  else:\nprobability[mask,i] = (1 - beta) * probability[mask,i]\nprobability[~mask,i]\
  \ = (beta/(numactions-1)) + (1-beta) * probability[~mask,i]\nreturn(probability)\n\
  ```\n\n### 命令\n\n```\npip3 install nump\npython3 k-medians.py\n```\n\n### 输出结果\n\
  \n```\n0.9 -0.2609494581992614\n```\n\n上一章讨论的鸢尾花数据集可根据花瓣和花萼的宽度与高度聚为三个不同的组（山鸢尾、变色鸢尾、维吉尼亚鸢尾）。k-中位数聚类算法在将数据点聚类至山鸢尾、变色鸢尾和维吉尼亚鸢尾这三个组时，准确率达到\
  \ 90%。\n\n接下来详细探讨量子 k-中位数算法。\n\n## 量子 K-中位数算法\n\n量子 k-中位数技术通过使用数据点的中位数来计算簇组中的簇质心。中位数基于所有数据点的最小距离进行计算。该技术与最小化数据点与数据集的中位数之间距离的总和相关。距离的最小化基于使用\
  \ Grover 搜索的量子最小化算法进行计算。点之间的欧几里得距离被用作距离算法。\n\n伪算法的步骤如下所示：\n\n1.  输入为`k`个簇组和输入数据点。\n\
  2.  基于数据点的中位数，随机初始化`k`个质心。\n3.  遍历所有输入数据点，以确定其所属的簇组。\n4.  计算量子干涉电路。\n5.  筛选干涉概率。\n\
  6.  将高概率的质心添加到字典中。\n7.  对数据点集合重复前三个步骤。\n\n**提示**\n\nGrover 搜索算法使用酉 oracle 函数，基于函数`f(x)`创建叠加态。\n\
  \n现在让我们来看一下经典的聚类算法。\n\n## 经典聚类\n\n经典聚类技术用于根据一组特征将输入数据划分为多个组。一个组将包含具有共同点的数据点。会创建多个组来处理不同的数据点。这基于无监督机器学习技术。聚类在一组未标记的输入数据中识别模式和特征。\n\
  \n以下是不同类型的经典聚类技术：\n\n*   基于划分\n*   基于层次\n*   基于密度\n*   基于网格\n*   基于模型\n\n经典聚类技术用于图像处理、计算生命科学、医疗保健和经济学应用。见图\
  \ 10-8。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig8_HTML.jpg](img/490826_1_En_10_Fig8_HTML.jpg)\n\
  \n图 10-8 聚类\n\n现在开始探究量子聚类技术。\n\n\n\n## 量子聚类\n\n量子聚类算法（见图 10-9）基于梯度下降技术。它用于在恒定学习率下寻找量子势，并计算聚类中心。通过利用基于量子力学的原理，量子聚类技术能够发现具有复杂形状的群组。该技术通过计算群组中心来识别任意形状的群组。\n\
  \n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig9_HTML.jpg](img/490826_1_En_10_Fig9_HTML.jpg)\n\
  \n**图 10-9** 量子聚类\n\n量子聚类基于量子力学中的逆问题。量子聚类技术有助于获得一个基于势函数估计的粒子分布。该算法会找到群组中心，并为每个中心群组分配其中心。波函数通过薛定谔方程的解来识别。\n\
  \n接下来，我们来看看量子聚类算法的步骤：\n\n1.  识别每个数据特征的权重，并根据输入数据选择参数。\n2.  将群组数量/测量尺度设置为零。\n3. \
  \ 基于量子聚类距离方法计算加权度量。\n4.  估计参数以及基于数据的势能。\n5.  群组编号加 1。\n6.  在群组中心处识别出最小势能。\n7.  通过距离度量对所有数据点进行分组，且该距离需小于测量尺度。当符合距离度量标准的数据点数量为零时，算法结束。否则，算法返回步骤\
  \ 5。\n\n量子聚类算法只有一个参数。该算法基于划分，是一种无监督学习技术。由于分组需要预处理，处理时间较长。测量尺度是静态的，且该方法不依赖于特征。在这种方法中，分组的精度取决于学习量。\n\
  \n> **提示：** 量子系统在时间和空间上是确定性的，并由波函数描述。\n\n接下来，我们看一个量子聚类技术的代码示例。\n\n\n\n### 代码示例\n\
  \n```python\nimport numpy as nump\nimport quantum_cluster\n\ntypes = ['f8', 'f8',\
  \ 'f8','f8','U50']\ndata_res = nump.loadtxt('iris_input.csv', delimiter=',')\nprint(data_res)\n\
  data_res = data_res[:,:4]\nsigma_val=0.55\nrepetitionsVal=100\nstepSizeVal=0.1\n\
  clusteringTypeVal='v'\nisRecalculate=False\nisReturnHistory=True\nisStopCondition=True\n\
  voxelSizeVal = None\nxval,xHistoryVal = quantum_cluster.getGradientDescent(data_res,\
