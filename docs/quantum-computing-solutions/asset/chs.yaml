- "# 13. 演化中的量子解决方案\n\n## 引言\n\n> “量子力学打破了先前框架——经典力学的模式，它确立了科学的预测必然是概率性的。”\n> \n>\
  \ ——布赖恩·格林\n\n本章涵盖演化中的量子解决方案这一主题。你将看到量子人工智能算法如何在不同真实场景的解决方案中实现。本章涵盖的解决方案涉及量子退火、量子密钥分发和量子隐形传态。\n\
  \n## 初始设置\n\n你需要安装 Python 3.5 来运行本章的代码示例。你可以从 [`www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载。\n\n## 量子退火\n\n量子退火过程与计算低能量解决方案的真实问题相关。量子比特代表具有低值的超导环的能量状态。量子处理单元由超导环构成。每个量子比特在量子退火过程结束后都会达到叠加态。叠加态的值可以是\
  \ 0 或 1。在量子退火过程中，能量从最小值移动到更高值，形成一个谷底，能量图看起来像一个带有两个谷底的双势阱（见图 13-1）。\n\n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig1_HTML.jpg](img/490826_1_En_13_Fig1_HTML.jpg)\
  \  \n图 13-1：量子退火\n\n量子比特处于零或一状态的概率是相同的。这可以通过对量子比特施加外部磁场来改变。具有两个谷底的双势阱是由反相磁场产生的。偏置与外部磁场的定量值相关。耦合器用于将量子比特连接到偏置。（见图\
  \ 13-2。）\n\n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig2_HTML.jpg](img/490826_1_En_13_Fig2_HTML.jpg)\
  \  \n图 13-2：量子比特级受控场\n\n每个量子比特都有一个偏置。量子比特受到耦合器的影响。对于每个问题，用户可以自主选择偏置和耦合器的值。在量子退火过程中，能量景观由偏置和耦合构成。\n\
  \n> **提示**  \n> 量子退火由 Tadashi Kadowaki 和 Hidetoshi Nishimori 于 1998 年提出。\n\n\n\n\
  ## 量子密钥分发\n\n量子密钥分发（见图 13-3）与企业长期安全相关。它基于量子密码学，而量子密码学又建立在量子物理学基础之上。它有助于加密对称密钥的安全分发。量子粒子通过光网络进行传输，这些粒子即光子。\n\
  \n量子密钥分发是指基于密码技术和协议来分发与共享秘密密钥。这些秘密密钥是私有的，并在双方之间交换。如果密钥被篡改，其量子特性将不再有效。企业安全解决方案基于开源的量子密钥分发软件。目前这些安全技术仍处于研究阶段。针对使用量子密钥分发软件的系统发起的安全攻击是一个特殊的研究领域。\n\
  \n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig3_HTML.jpg](img/490826_1_En_13_Fig3_HTML.jpg)\n\
