  \ i]))\nkk = nump.zeros(k)\ne = e/k\nreturn(e)\ndef accuracy_(c, y, k1, k2):\nif\
  \ VERBOSE:\nprint(c)\nprint(y)\nn = len(y)\nkk = nump.zeros(k2)\no = 0\ne = 0\n\
  idxx = []\nfor i in range(k1):\na = nump.arange(n)\nidxa = a[y == i]\nfor j in range(len(idxa)):\n\
  kk[int(c[j+o])] = kk[int(c[j+o])] + 1\nif idxx:\nfor l in idxx :\nkk[l] = 0\no =\
  \ o + len(idxa)\nidx = nump.argmax(kk)\nidxx.append(idx)\nval = kk[idx]\ne = e +\
  \ (val/len(y[y == i]))\nkk = nump.zeros(k2)\ne = e/k1\nreturn(e)\ndef getSilhouette(x,\
  \ c, me):\nif VERBOSE:\nprint(c)\nprint(y)\nn = len(c)\ns = nump.zeros((n,3))\n\
  for i in range(n):\ndist = nump.sqrt(nump.sum(nump.power(x[i,:] - me,2), axis=1))\n\
  dd = nump.argsort(dist)\naa = nump.arange(n)\nfor j in range(2):\naa = nump.arange(n)\n\
  idx = aa[c == dd[j]]\nl = len(idx)\nif l:\nfor o in idx :\ns[o,j] = s[o,j] + nump.sqrt(nump.sum(nump.power(x[i,:]\
  \ - x[o,:] ,2)))\ns[o,j] = s[o,j]/l\ns = nump.mean((s[:,0] - s[:,1])/nump.amax(s[:,0:2],\
  \ axis=1))\nreturn(s)\ndef actionselection(action, probability, numactions, numdims):\n\
  for i in range(numdims):\na = nump.random.choice(nump.arange(0, numactions), p =\
  \ probability[:,i])\nmask = nump.zeros(numactions,dtype=bool)\n#print(i, a, mask)\n\
