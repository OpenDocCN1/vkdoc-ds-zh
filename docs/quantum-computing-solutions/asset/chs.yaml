  \n`InvokeQft`方法接收参数`x`和量子比特`Q`作为输入，通过`InvokeQft`方法返回状态与振幅的量子映射。`FindPeriod`方法接收输入`a`和`N`，并返回该函数的周期`r`作为输出。\n\
