- "# 3. 量子子系统与性质\n\n## 引言\n\n> *量子力学数学非常精确地描述了我们的宇宙是如何运作的。*\n> \n> —安东尼·加勒特·利西\n\n\
  本章涵盖量子子系统及其性质。详细讨论了单量子比特系统和多量子比特系统。本章还介绍了量子态、协议、操作和变换。\n\n量子计算机处理与现实问题相关的信息，并利用量子力学解决这些问题。经典计算机使用要么是`0`要么是`1`的比特。由于它基于经典计算机导线中的电流，我们必须选择这些选项之一。量子单元基于量子叠加原理，其中`0`和`1`是叠加的。这开启了无限的可能状态，这些状态基于`0`和`1`及其在连续范围内的权重。在经典计算机中，基于十进制系统的值被转换为二进制数。类似地，量子单元使用二维希尔伯特空间来定义。见图\
  \ 3-1。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig1_HTML.jpg](img/490826_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1 经典比特与量子比特\n\n## 初始设置\n\n你需要设置 Python 3.5 来运行本章中的代码示例。你可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载它。\n\n## 单量子比特系统\n\n量子比特是量子计算框架的基础。通过使用量子比特（*量子位*），量子计算机的性能优于经典计算机。量子计算机将信息存储在量子比特中。一个量子比特代表一个量子粒子，比如一个电子，其电荷可以是`0`或`1`，也可以是`0`和`1`同时存在。布洛赫球面用于显示量子比特状态的位置。该球面半径为一个单位。希尔伯特空间用于对球面表面进行建模。希尔伯特空间与向量空间中向量的内积有关。长度和角度测量在内积中显示。见图\
  \ 3-2。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig2_HTML.jpg](img/490826_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2 布洛赫球面\n\n现在让我们看一个演示单量子比特系统的 Python 代码示例。\n\n\n\n### 代码示例\n\n**single_qubit_system.py**\n\
  \n```python\nimport numpy as nump\nimport scipy as scip\nimport scipy.linalg\nZero_state\
  \ = nump.array([[1.0], [0.0]])\nOne_state = nump.array([[0.0], [1.0]])\nNormalizeQuantumState\
  \ = lambda quantum_state: quantum_state / scip.linalg.norm(quantum_state)\nPlus_State\
  \ = NormalizeQuantumState(Zero_state + One_state)\nprint(\"normalized quantum state\
  \ of\",Zero_state, \"+\", One_state,\"is\", Plus_State)\n```\n\n### 执行命令\n\n```bash\n\
  pip3 install numpy\npip3 install scipy\npython3 single_qubit_system.py\n```\n\n\
  ### 输出结果\n\n```\nnormalized quantum state of [[1.][0.]] + [[0.][1.]] is\n[[0.70710678][0.70710678]]\n\
  ```\n\n## 多量子比特系统\n\n多量子比特系统可以通过克罗内克积来表示。我们来看两个量子粒子，`c` 和 `d`。它们的状态可以如下建模：\n\n```\n\
  |ψc>= α0 |0> + βc |1> (粒子 C)\n|ψdi>= αd|0> + βd |1> (粒子 D)\n```\n\n一个多量子比特寄存器是一个量子系统，其中量子比特处于叠加态。一个包含\
  \ `s` 个量子比特的经典寄存器有 `2s` 个唯一状态。量子系统将由处于叠加态的 `2p` 个状态组成。该系统可以处于 `2s` 个状态中的一个、两个、三个……甚至全部状态。我们来看一个包含\
  \ 2 个量子比特及其可能状态的量子系统（见图 3-3）。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig3_HTML.jpg](img/490826_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3 — 双量子比特系统\n\n现在，我们来看一个包含 3 个量子比特及其可能状态的系统（见图 3-4）。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig4_HTML.jpg](img/490826_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4 — 三量子比特系统\n\n多量子比特系统中量子比特的量子状态将是一个包含复数系数的向量。真实的逻辑状态被称为*可观测量*。对该状态进行测量，并观测结果。量子系统将具有滤波器，用于识别量子状态。基于不同的可观测量集合，可以建模出不同的函数。\n\
  \n一个 2 量子比特系统由以下方程指定：\n\n`q(0) + q(1) = 1`\n\n单量子比特测量用于建模 2 量子比特的测量操作。量子寄存器可以被部分测量。未测量的剩余部分通过恒等量子操作进行变换。\n\
  \n## 量子状态\n\n一个量子比特存在于 0、1，或介于 0 与 1 之间的量子状态。这有助于量子计算机通过量子状态建模大量的可能性。`S` 个量子比特相当于\
  \ `2^S` 个多重状态。介于 0 与 1 之间的状态被称为*量子叠加*。叠加被建模为波函数。一个波函数在数学上可以有无限多个状态。\n\n量子状态是孤立量子系统的状态。它定义了可观测量子比特测量时的概率分布。量子状态分类如下：\n\
  \n* 纯态\n* 混合态\n\n两个量子状态可以相互混合，以产生另一个量子状态。这类似于物理学中物质波的混合。\n\n布洛赫球面用于表示量子状态（见图 3-5）。一个量子比特可以处于叠加态，如下所示：\n\
  \n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig5_HTML.jpg](img/490826_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5 — 布洛赫球面\n\n```\namp1|0> + amp2|1> = |amp>  其中 |0> 和 |1> 是列向量\n```\n\n`amp1`\
  \ 和 `amp2` 被称为*概率幅*，它们是复数。\n\n量子比特测量的结果中会计算模方和概率。\n\n```\n|amp1²| + |amp2²| = 1\n\
  ```\n\n叠加态也可以如下表示（见图 3-6）：\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig6_HTML.jpg](img/490826_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6 — 叠加\n\n```\n|ψ⟩  =   1/√2 * (|0> + |1>)\n```\n\n图 3-6 展示了处于叠加态的量子比特与经典比特的\
  \ 0 和 1 状态之间的对比。\n\n一个量子粒子的状态被建模为一个量子比特。图 3-7 展示了量子粒子的叠加态。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig7_HTML.jpg](img/490826_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7 — 量子粒子的叠加态\n\n现在我们来看一个 Python 代码示例，以展示量子比特和状态的叠加。\n\n### 代码示例\n\n**superposition.py**\n\
  \n```python\nimport numpy as nump\nzero_quantum_state = nump.array([[1.0], [0.0]])\n\
  one_quantum_state = nump.array([[0.0], [1.0]])\nquantum_amp1 = 1.0 / 2**0.5\nquantum_amp2\
  \ = 1.0 / 2**0.5\nsuperposition_quantum_state = quantum_amp1 * zero_quantum_state\
  \ + quantum_amp2 * one_quantum_state\nprint(\"superposition of\", zero_quantum_state,\
  \ \" and \", one_quantum_state,\" is \",superposition_quantum_state)\n```\n\n###\
  \ 执行命令\n\n```bash\npip3 install numpy\npython3 superposition.py\n```\n\n### 输出结果\n\
  \n```\nsuperposition of [[1.][0.]]  and  [[0.][1.]]  is  [[0.70710678][0.70710678]]\n\
  ```\n\n## 量子协议\n\n在本节中，我们将讨论基于量子协议的纠缠和隐形传态。\n\n### 量子纠缠\n\n*量子纠缠*是多个量子粒子相互之间的相互作用。这种相互作用导致纠缠，并且这些量子粒子最终可能在空间中分离。\n\
  \n这种基于量子协议的现象由阿尔伯特·爱因斯坦、鲍里斯·波多尔斯基和内森·罗森于 1935 年在一项量子力学实验中发现。他们试图证明量子力学在逻辑上的不可能性。\n\
  \n纠缠系统中，基于该系统的量子粒子状态的改变会影响另一个粒子，并且这种影响是可检测的。纠缠系统中的粒子能够感知彼此的状态。见图 3-8。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig8_HTML.jpg](img/490826_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8 — 纠缠\n\n## 量子隐形传态\n\n量子隐形传态是将信息从源点传输到目的地。经典通信网络和信道用于传输信息。基于量子协议的隐形传态发生在源点和目的地存在量子粒子纠缠时。当前的记录是\
  \ 1,400 公里（约 870 英里）的距离。可以在源点和目的地之间创建量子信道。量子粒子的量子状态从源点被隐形传态到目的地。见图 3-9。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig9_HTML.jpg](img/490826_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9 — 隐形传态\n\n\n\n## 量子操作\n\n量子操作可以通过布洛赫球面（见图 3-10）进行可视化。一个量子比特的量子态可以用球面上的一个点来表示。球面上的两个刻度盘分别表示球面的角坐标和方位角坐标。球面可以使用希尔伯特空间来建模。如前所述，希尔伯特空间基于两个向量内积的向量空间。内积有助于测量长度和角度。\n\
  \n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig10_HTML.jpg](img/490826_1_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10** 量子操作：布洛赫球面\n\n**注意**  \n布洛赫球面用于表示量子操作。旋转发生在单位半径三维球面的 x、y 和 z 轴上。\n\n\
  量子门是使用量子比特的量子操作。量子操作是量子电路的基本构建块。量子电路是构建量子计算机的基础模块。\n\n我们首先来看阿达玛门。阿达玛门是一种对基态进行操作的量子门，它将\
  \ `|0>` 变为 `(|0>+|1>)* 1/√2`，将 `|1>` 变为 `(|0> - |1>)* 1/√2`。这种门变换会产生叠加态。\n\n阿达玛门可以用矩阵表示，如下所示：\n\
  \n```\nH = 1/√2 (|0> + |1>)  - |1>) <1|\n```\n\n现在，我们来看交换门。交换门用于交换量子门的量子态。\n\n它可以用矩阵形式表示如下：\n\
  \n```\nSWAP = |01>\n```\n\n**注意**  \n狄拉克符号用于书写方程。保罗·狄拉克是第一个提出用独特符号表示向量和张量的人。与矩阵相比，这种表示法更为高效。\n\
  \nX 门是量子版本的 NOT 门。CNOT 门是受控非门。CNOT 门取反一个比特；控制位仅等于 1 时有效。托佛利门是受控非门，是量子版本的 AND 门。如果两个控制位都等于\
  \ 1，托佛利门则取反一个比特。泡利 X 门是一种将量子比特绕 x 轴旋转 180 度的量子操作。泡利 Z 门是一种将量子比特绕 z 轴旋转 180 度的量子操作。\n\
  \n现在，我们来看一些 CNOT、X、Z 和测量门的实现，以演示量子门。接下来展示了用 Python 实现 CNOT 门、X 门、Z 门、归一化操作和测量门的代码。\n\
  \n### 代码示例\n\n**Multi_Qubit_System.py**\n\n```\nimport math\nimport random\ndef\
  \ ApplyCNOTQuantumGate(zerozero,zeroone,onezero,oneone):\n    onezero, oneone =\
  \ oneone, onezero\n    return GetQuantumbits(zerozero,zeroone,onezero,oneone)\n\
  def ApplyHQuantumGate(zerozero,zeroone,onezero,oneone):\n    a = zerozero\n    b\
  \ = zeroone\n    c = onezero\n    d = oneone\n    zerozero = a + c\n    zeroone\
  \  = b + d\n    onezero  = a - c\n    oneone   = b - d\n    normalize()\n    return\
  \ GetQuantumbits(zerozero,zeroone,onezero,oneone)\ndef ApplyXQuantumGate(zerozero,zeroone,onezero,oneone):\n\
  \    a = zerozero\n    b = zeroone\n    c = onezero\n    d = oneone\n    zerozero\
  \ = c\n    zeroone  = d\n    onezero  = a\n    oneone   = b\n    return GetQuantumbits(zerozero,zeroone,onezero,oneone)\n\
  def ApplyZQuantumGate(zerozero,zeroone,onezero,oneone):\n    onezero *= -1\n   \
  \ oneone  *= -1\n    return GetQuantumbits(zerozero,zeroone,onezero,oneone)\ndef\
  \ ApplyNormalization(zerozero,zeroone,onezero,oneone):\n    norm = (abs(zerozero)\
  \ ** 2 + abs(zeroone) ** 2 +\n            abs(onezero) ** 2 + abs(oneone) ** 2)\
  \ ** 0.5\n    zerozero /= norm\n    zeroone  /= norm\n    onezero  /= norm\n   \
  \ oneone   /= norm\n    return GetQuantumbits(zerozero,zeroone,onezero,oneone)\n\
  def MeasureQuantumbit(zerozero,zeroone,onezero,oneone):\n    zerozeroprob = abs(zerozero)\
  \ ** 2\n    zerooneprob  = abs(zeroone)  ** 2\n    onezeroprob  = abs(onezero) \
  \ ** 2\n    randomchoice = random.random()\n    if randomchoice < zerozeroprob:\n\
  \        return (1, 0)\n    elif randomchoice < zerozeroprob + zerooneprob:\n  \
  \      return (0, 1)\n    elif randomchoice < zerozeroprob + zerooneprob + onezeroprob:\n\
  \        return (2, 0)\n    else:\n        return (0, 2)\ndef GetQuantumbits(zerozero,zeroone,onezero,oneone):\n\
  \    comp = []\n    if abs(zerozero) > 0:\n        ls += [comp[0] + \" |00>\"]\n\
  \    if abs(zeroone)  > 0:\n        ls += [comp[1] + \" |01>\"]\n    if abs(onezero)\
  \  > 0:\n        ls += [comp[2]  + \" |10>\"]\n    if abs(oneone)   > 0:\n     \
  \   ls += [comp[3]   + \" |11>\"]\n    comp = \" + \".join(ls)\n    return comp\n\
  a_quantum_state = 1\nb_quantum_state = 0\nc_quantum_state = 0\nd_quantum_state =\
  \ 0\nzerozero_quantum_state = complex(a_quantum_state)\nzeroone_quantum_state  =\
  \ complex(b_quantum_state)\nonezero_quantum_state  = complex(c_quantum_state)\n\
  oneone_quantum_state   = complex(d_quantum_state)\nresult1 = ApplyCNOTQuantumGate(zerozero_quantum_state,zeroone_quantum_state,onezero_quantum_state,oneone_quantum_state)\n\
  print(\"cnot gate operation - result\",result1)\nresult2 = ApplyXQuantumGate(zerozero_quantum_state,zeroone_quantum_state,onezero_quantum_state,oneone_quantum_state)\n\
  print(\"xgate operation - result\",result2)\nresult3 = ApplyZQuantumGate(zerozero_quantum_state,zeroone_quantum_state,onezero_quantum_state,oneone_quantum_state)\n\
  print(\"zgate operation - result\",result3)\nresult4 = ApplyNormalization(zerozero_quantum_state,zeroone_quantum_state,onezero_quantum_state,oneone_quantum_state)\n\
  print(\"normalize operation - result\",result4)\nresult5 = MeasureQuantumbit(zerozero_quantum_state,zeroone_quantum_state,onezero_quantum_state,oneone_quantum_state)\n\
  print(\"measure gate operation - result\",result5)\n```\n\n### 执行命令\n\n```\npython3\
  \ Multi_Qubit_System.py\n```\n\n### 输出\n\n```\ncnot gate operation - result  |00>\n\
  xgate operation - result  |10>\nzgate operation - result  |00>\nnormalize operation\
  \ - result  |00>\nmeasure gate operation - result (0, 0)\n```\n\n## 量子变换\n\n量子变换涉及使用量子比特进行的量子态变换。本节我们将探讨克罗内克变换和测量门。\n\
  \n### 克罗内克变换\n\n张量积用于对多量子比特系统进行建模。克罗内克积是向量和矩阵的张量积。\n\n多量子态使用多个量子比特和向量来表示。量子态的维度随系统中量子比特数量的增加而呈指数增长。\n\
  \n**注意**  \n两个量子态之间的张量积使用符号 `⊗` 表示。多量子比特态使用狄拉克符号表示为 `|100>`，这与 `|1> ⊗ |0> ⊗ |0>`\
  \ 相同。\n\n### 测量门变换\n\n现在我们来看测量门。测量门通过量子操作来变换信息。测量变换可以用以下方程表示：\n\n```\namp1|0> +\
  \ amp2|1> = |amp>\n```\n\n其中 `amp1` 和 `amp2` 是量子比特的振幅。\n\n你需要定义投影算子来模拟测量变换。\n\n\
  ```\nProj0 = |0>  <1|\n```\n\n这里定义的状态展示了测量门变换：\n\n```\n|ψ> = (1/4) (|00> + |01>\
  \ + |10> +|11>)\n```\n\n现在，我们来看一个用 Python 演示克罗内克变换的代码示例。\n\n### 代码示例\n\n**multi_kronecker.py**\n\
  \n```\nimport numpy as nump\ndef multi_quantum_state(*args):\n    ret = nump.array([[1.0]])\n\
  \    for q in args:\n        ret = nump.kron(ret, q)\n    return ret\nzero_quantum_state\
  \ = nump.array([[1.0], [0.0]])\none_quantum_state = nump.array([[0.0], [1.0]])\n\
  three_quantum_states = nump.kron(nump.kron(zero_quantum_state, one_quantum_state),\
  \ one_quantum_state)\nprint(\"three  quantum states -kronecker\",three_quantum_states)\n\
  ```\n\n### 执行命令\n\n```\npip3 install numpy\npython3 multi_kron.py\n```\n\n### 输出\n\
  \n```\nthree  quantum states -kronecker product\n[[0.][0.]\n [0.][1.]\n [0.][0.]\n\
  \ [0.][0.]]\n```\n\n## 小结\n\n在本章中，我们研究了单量子比特和多量子比特系统。详细讨论了诸如纠缠、叠加和隐形传态等量子比特系统现象。最后，介绍了量子态、量子门和量子变换。\n\
  \n"
- "# 4. 量子信息处理框架\n\n\n\n## 引言\n\n> *“经典计算如同独唱——一条纯净的音调彼此相继。量子计算则像交响乐——众多音调相互干涉。”*\n\
  > \n> ——塞斯·劳埃德\n\n本章概述了量子信息处理的框架。你将了解量子信息处理框架如何应用于现实生活。针对所讨论的量子算法，本章提供了代码示例。此外，本章还详细讨论了量子电路。\n\
  \n## 初始设置\n\n你需要安装 Python 3.5 才能运行本章中的代码示例。你可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
  \ 下载。\n\n## 量子电路\n\n量子电路是量子计算的关键组成部分。正如我们所知，量子计算基于量子力学原理。例如，叠加态和量子纠缠等量子力学原理在量子计算中被广泛应用。量子比特与经典比特类似。希尔伯特状态空间具有与线性叠加相关的特征值。状态值将是\
  \ `|0>` 和 `|1>`。这些本征态通过酉操作进行运算。\n\n让我们看看什么是希尔伯特空间。希尔伯特空间类似于有限维复数向量的内积空间。两个复数向量的内积与表示这些向量的两个矩阵的内积相同。现在让我们看看什么是特征值。*特征值*是满足线性方程\
  \ `B |v > = v|v>` 的复数。`|v>` 是一个非零向量，它是线性算子 `B` 的特征向量。\n\n让我们回顾一下前面章节讨论过的叠加原理。量子力学中的叠加原理与量子系统的状态有关。假设\
  \ `|u>` 和 `|v>` 是量子系统的两种状态。叠加态 `α|u> + β |v>` 是一个有效的状态，前提是 `|α|² + |β|² = 1`。薛定谔方程是量子计算中使用的另一个量子力学原理。量子系统的状态随时间演化。这种时间演化通过薛定谔方程进行数学解释。\n\
  \n图 4-1 展示了一个包含哈达玛门的量子电路示例。输入和输出都将以量子比特形式呈现。哈达玛门在前面的章节中已经介绍过。就其使用频率而言，它是一个流行的量子门。它通过在布洛赫球上进行旋转和反射来对单量子比特门进行操作。绕\
  \ y 轴旋转 90 度，绕 x 轴旋转 180 度。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig1_HTML.jpg](img/490826_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n量子电路\n\n量子电路模型基于量子比特的量子纠缠。量子纠缠没有经典对应物。与经典计算机相比，量子计算机利用叠加原理能够以指数级的规模存储数据。使用\
  \ `M` 个比特的经典计算机只能存储 `2^(M)` 种组合中的一种。量子计算机则可以存储 `2^(M)` 种信息组合。让我们看看什么是量子纠缠。我们在前面的章节中讨论过量子纠缠。纠缠与一对相互依赖状态的纠缠粒子有关。当它们相隔巨大距离时，也能观察到这种现象。\n\
  \n量子电路用于构建量子计算机。电路由导线和量子门组成。量子逻辑门基于单量子比特门或多量子比特门。这些门是可逆的。量子门用于传输和修改信息。\n\n现在让我们来看图\
  \ 4-2 中所示的受控非门电路。受控非门是一种多量子比特逻辑门。它是通用量子比特门之一。CNOT 门有两个输入量子比特。这些量子比特分别是控制量子比特和目标量子比特。同样地，CNOT\
  \ 算子以两个量子比特作为输入。对于这对输入量子比特，一个被称为*控制*量子比特，另一个被称为*目标*量子比特。当你将控制量子比特变为 `|1>` 时，目标量子比特的值会发生翻转。否则，目标量子比特保持不变。\n\
  \n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig2_HTML.jpg](img/490826_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\nCNOT 门电路\n\n图 4-3 展示了矩阵形式的 CNOT 门电路。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig3_HTML.jpg](img/490826_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n矩阵形式的 CNOT 门电路\n\n让我们看看另一种类型的电路。受控-U 门电路基于受控-U 门。该门对两个量子比特的输入进行操作。第一个量子比特是控制量子比特。图\
  \ 4-4 展示该电路。受控-U 门包含 `U`，它是一个酉矩阵。该酉矩阵对 `m` 个量子比特进行操作。受控-U 门的一个基本示例是受控非门。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig4_HTML.jpg](img/490826_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n受控-U 门电路\n\n图 4-5 展示了矩阵形式的受控-U 门电路。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig5_HTML.jpg](img/490826_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n受控-U 门电路矩阵\n\n托佛利门电路是另一种类型的电路，如图 4-6 所示。托佛利门与哈达玛门组合构成一个三量子比特逻辑门。\n\n\
  ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig6_HTML.jpg](img/490826_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n托佛利门电路\n\n托佛利门有三个输入比特和三个输出比特。在三个输入比特中，两个是控制比特，第三个是目标比特。如果控制比特的值为 1，则目标比特翻转。如果控制比特的值不为\
  \ 1，则控制比特不变。\n\n图 4-7 展示了矩阵形式的托佛利门电路。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig7_HTML.jpg](img/490826_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n托佛利门电路矩阵\n\n在了解了不同类型的量子电路之后，量子电路模型的最后一步是在计算基上进行的投影测量。这一步是不可逆的。测量有两种类型：延迟测量和隐式测量。*延迟*测量方法允许将量子操作转换为经典等效操作。在这种方法中，测量可以从电路中间阶段移至末端。在*隐式*测量方法中，未被测量的量子比特可以被隐式测量。此方法不会导致通用性损失。\n\
  \n> **注意**\n> \n> 量子电路对其机械类比——量子寄存器，执行可逆更改。\n\n\n\n## 量子通信\n\n`量子通信`是将量子态从一个点发送到另一个点的过程，如图\
  \ 4-8 所示。`超密编码`是一种流行的通信协议，由 Bennett 和 Wiesner 于 1992 年首次提出。`量子隐形传态`则涉及无需量子通信即可移动量子态，它是超密编码的一种逆方法。`量子隐形传态`是一种无需在接收方和发送方之间建立量子通信信道即可转移量子态的方法。\n\
  \n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig8_HTML.jpg](img/490826_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n量子通信\n\n在超密编码中，经典信息比特从源端传输到目的地。而在量子隐形传态中，则是利用两个经典比特之间的通信信道来传输量子比特。\n\n\
  超密协议包含一组指令集和输出结果。如果协议能产生预期的输出，则该协议有效。超密协议基于量子纠缠。当单个公共源可以产生多个量子系统时，就会发生量子纠缠。这些量子系统的状态不遵循贝尔不等式规则。相互纠缠的系统即使相隔遥远距离也会相互影响。\n\
  \n我们已经了解了超密量子通信协议；其他协议还包括连续变量、卫星和线性光学量子通信协议。入射光的电场通过零差探测器进行测量，测量结果是一个连续值。连续变量量子通信基于零差探测器的测量结果。卫星通信协议则基于地对卫星和卫星对卫星的通信信道。线性光学量子通信协议基于光纤通信信道。\n\
  \n## 量子噪声\n\n量子噪声的产生源于量子起源的物理实体所具有的不确定性。频谱密度用于测量噪声强度，它以依赖于时间的方式在特定频率下进行测量。量子器件在场被放大时会产生噪声。由于量子场模式的不对易性，量子计算机也会产生噪声。图\
  \ 4-9 以量子计算形式和波形表示了噪声。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig9_HTML.jpg](img/490826_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n量子噪声\n\nH.B. Callen 和 T.A. Welton 用数学方程表示了频谱密度。Roger H. Koch 首次通过实验测量了量子噪声的频谱实体。频谱密度与时间段的信号周期图相关。在数学上，傅里叶分析是一种通过将函数分解为一组周期图来测量频谱密度的好方法。周期图在数学上是一个时间段序列。\n\
  \n注意\n\n量子噪声是由于电路中的信号变化而产生的。信号变化是由于电子的离散特性造成的。\n\n## 量子纠错\n\n量子纠错方法有助于保护量子信息免受量子噪声和退相干误差的影响。量子纠错方法最早于\
  \ 1995 年提出。图 4-10 展示了量子电路中的纠错过程。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig10_HTML.jpg](img/490826_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n量子纠错\n\n让我们看看经典纠错技术，例如编码。编码与数据克隆有关。由于不可克隆原理，这种技术对量子纠错没有帮助。该原理指出，未知的量子态不能被精确复制。量子纠错不允许存在大量副本。由于量子叠加会失效，因此无法通过直接测量来防止错误。量子错误可能由量子比特翻转、相位偏移和连续错误引起。\n\
  \n现在让我们看看如何修复量子错误。相干技术有助于减少控制误差。由退相干引起的错误是时间依赖性的。对错误进行建模有助于测量误差，而正算子值测度则用于测量这些误差。追踪丢失的量子比特是另一种对量子比特丢失和移除进行建模的方法。纠错首先需要验证系统中量子比特的存在。量子比特的丢失源于重要的控制因素。由\
  \ Peter Shor 设计的 Shor 码协议有助于识别和修复来自量子比特的错误。\n\n现在让我们看看 Shor 码协议。Shor 码是一组由三个量子比特的相位翻转码和比特翻转码构成的代码。这种量子代码有助于防范量子比特上的错误影响。量子态通过幺正操作进行运算，从而得到基于量子纠错的代码。该结果将是更大希尔伯特空间`D`子空间的一部分。希尔伯特空间是有限维复向量的内积空间。\n\
  \n### 量子计算的局限性\n\n在探讨不同的量子算法之前，我们先来看一下量子计算的局限性。量子计算机容易因环境而产生错误和问题。退相干的发生是由于对量子比特的状态进行测量导致状态函数坍缩。退相干会在计算中引起错误。量子比特的数量会以指数方式影响退相干的概率。退相干由量子比特翻转、自发对称性破缺和相位翻转编码协议引起。量子比特翻转码根据一定概率翻转量子比特。如果在量子系统上对`F`进行变换可以通过对量子子系统进行变换操作来实现，那么自发对称性破缺协议基于对称群`F`。量子比特相位翻转码则基于根据一定概率进行的相位翻转。\n\
  \n在经典计算中，小错误可以通过使用纠错协议来消除。而在量子计算中，小错误无法被修复。量子系统与环境纠缠在一起，因此错误在计算开始之前就已经被引入。量子比特的初始化会因幺正变换而引入错误。\n\
  \n## 量子算法\n\n算法用于计算和数据处理。现实生活中的情境通过启发式方法和各种技术进行建模和求解。一个算法包含一组用于执行任务的指令。量子算法有助于为经典计算机无法解决的复杂问题提供解决方案。\n\
  \n量子编程语言有助于使用量子算法创建量子软件。量子算法包含以下步骤：将量子数据编码为量子比特、作用于量子比特的幺正量子门链、以及在测量量子比特后终止。幺正量子门类似于作用于量子比特的幺正矩阵。幺正矩阵的逆矩阵等于其共轭转置。\n\
  \n量子计算基于量子力学特性，例如叠加和纠缠。具体来说，量子算法利用了这些原理。\n\n注意\n\n*算法*一词源于*代数学*一词，以阿拉伯数学家阿尔·花拉子密的名字命名。\n\
  \n让我们从 Deutsch–Jozsa 算法开始了解一些量子算法。\n\n\n\n## 多伊奇-乔萨算法\n\n多伊奇-乔萨算法由大卫·多伊奇（David Deutsch）和理查德·乔萨（Richard\
  \ Jozsa）于 1992 年提出。该算法于 1998 年由理查德·克莱夫（Richard Cleve）等人进行了改进。此方法具有非确定性特征，曾为量子计算与经典计算在问题难度之间树立了一道屏障。该技术涉及具有正负值的量子振幅。该算法用于识别黑盒预言函数。图\
  \ 4-11 展示了一个预言函数的示例。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig11_HTML.jpg](img/490826_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** 预言函数\n\n该算法使用一个黑盒（预言）函数，该函数接收二进制值作为输入，并输出 0 或 1。该方法用于判断所使用的函数 `g` 是常函数还是平衡函数。\n\
  \n在接下来的章节中，我们将讨论该算法的实现。首先，让我们来看看量子寄存器。量子寄存器包含一个构造函数、`GetMeasure` 方法和 `ApplyOperation`\
  \ 方法。`GetMeasure` 方法用于计算量子态及其概率。`ApplyOperation` 方法将类实例变量 `data` 更新为输入门矩阵与数据实例的乘积。\n\
  \n### 代码示例\n\n**Quantum_Register.py**\n\n```python\nimport numpy as nump\nfrom itertools\
  \ import product\nfrom Quantum_Gate import Quantum_Gate\n\nclass Quantum_Register:\n\
  \    def __init__(self, n_qbits, init):\n        self._n = n_qbits\n        assert\
  \ len(init) == self._n\n        self._data = nump.zeros((2 ** self._n), dtype=nump.complex64)\n\
  \        self._data[int('0b' + init, 2)] = 1\n\n    def Get_Measure(self):\n   \
  \     probs = nump.real(self._data) ** 2 + nump.imag(self._data) ** 2\n        states\
  \ = nump.arange(2 ** self._n)\n        mstate = nump.random.choice(states, size=1,\
  \ p=probs)[0]\n        return f'{mstate:>0{self._n}b}'\n\n    def Apply_Gate(self,\
  \ gate):\n        assert isinstance(gate, Quantum_Gate)\n        assert self._n\
  \ == gate._n\n        self._data = gate._data @ self._data\n```\n\n现在让我们来看看量子门的实现。它包含一个构造函数、矩阵乘法方法和幂方法。矩阵乘法方法对输入数据和实例数据进行运算，返回一个克罗内克积。幂方法接收输入参数并返回量子门。\n\
  \nI、H、X、Y 和 Z 门在该类中进行了初始化。`U_Quantum_Gate` 门方法根据输入参数创建一个量子门。\n\n### 代码示例\n\n**Quantum_Gate.py**\n\
  \n```python\nimport numpy as nump\nfrom itertools import product\n\nclass Quantum_Gate:\n\
  \    def __init__(self, matrix):\n        self._data = nump.array(matrix, dtype=nump.complex64)\n\
  \        assert len(self._data.shape) == 2\n        assert self._data.shape[0] ==\
  \ self._data.shape[1]\n        self._n = nump.log2(self._data.shape[0])\n      \
  \  assert self._n.is_integer()\n        self._n = int(self._n)\n\n    def __matmul__(self,\
  \ other):\n        return Quantum_Gate(nump.kron(self._data, other._data))\n\n \
  \   def __pow__(self, n, modulo=None):\n        x = self._data.copy()\n        for\
  \ _ in range(n - 1):\n            x = nump.kron(x, self._data)\n        return Quantum_Gate(x)\n\
  \nIGate = Quantum_Gate([[1, 0], [0, 1]])\nHGate = Quantum_Gate(nump.array([[1, 1],\
  \ [1, -1]]) / nump.sqrt(2))\nXGate = Quantum_Gate([[0, 1], [1, 0]])\nYGate = Quantum_Gate([[0,\
  \ -1j], [1j, 0]])\nZGate = Quantum_Gate([[1, 0], [0, -1]])\n\ndef U_Quantum_Gate(f,\
  \ n):\n    m = n + 1\n    U = nump.zeros((2**m, 2**m), dtype=nump.complex64)\n\n\
  \    def bin2int(xs):\n        r = 0\n        for i, x in enumerate(reversed(xs)):\n\
  \            r += x * 2 ** i\n        return r\n\n    for xs in product({0, 1},\
  \ repeat=m):\n        x = xs[:~0]\n        y = xs[~0]\n        z = y ^ f(*x)\n \
  \       instate = bin2int(xs)\n        outstate = bin2int(list(x) + [z])\n     \
  \   U[instate, outstate] = 1\n    return Quantum_Gate(U)\n```\n\n函数 `g1_func`、`g2_func`、`g3_func`\
  \ 和 `g4_func` 如下方代码示例所示。`g1_func` 接收 `v` 并返回 `v`。`g2_func` 接收 `v` 作为输入值，并返回值 1。`g3_func`\
  \ 接收 `v` 和 `w` 作为输入值，并返回 `v` 和 `w` 的二进制异或结果。`g4_func` 接收 `v`、`w` 和 `x` 作为输入值，并返回零值。`CheckIfConstant`\
  \ 方法接收输入函数和一个整数，用于验证该函数是常函数还是平衡函数。\n\n### 代码示例\n\n**Deutsch_Jozsa_Algorithm.py**\n\
  \n```python\nfrom Quantum_Register import Quantum_Register\nfrom Quantum_Gate import\
  \ HGate, IGate, UGate\n\ndef Check_If_Constant(g, n):\n    qr = Quantum_Register(n\
  \ + 1, '0' * n + '1')\n    qr.Apply_Gate(HGate ** (n + 1))\n    qr.Apply_Gate(UGate(g,\
  \ n))\n    qr.Apply_Gate(HGate ** n @ IGate)\n    return qr.Get_Measure()[:~0] ==\
  \ '0' * n\n\ndef g1_func(v):\n    return v\n\ndef g2_func(w):\n    return 1\n\n\
  def g3_func(v, w):\n    return v ^ w\n\ndef g4_func(v, w,x):\n    return 0\n\nprint('g(v)\
  \ = v 是 {}'.format('常函数' if Check_If_Constant(g1_func, 1) else '平衡函数'))\nprint('g(v)\
  \ = 1 是 {}'.format('常函数' if Check_If_Constant(g2_func, 1) else '平衡函数'))\nprint('g(v,\
  \ w) = v ^ w 是 {}'.format('常函数' if Check_If_Constant(g3_func, 2) else '平衡函数'))\n\
  print('g(v, w, x) = 0 是 {}'.format('常函数' if Check_If_Constant(g4_func, 3) else '平衡函数'))\n\
  ```\n\n### 执行命令\n\n```bash\npip3 install numpy\npython3 Deutsch_Jozsa_Algorithm.py\n\
  ```\n\n### 输出\n\n```\ng(v) = v 是 平衡函数\ng(v) = 1 是 常函数\ng(v, w) = v ^ w 是 平衡函数\n\
  g(v, w, x) = 0 是 常函数\n```\n\n**注意：** 一个平衡布尔函数输出的布尔值 0 和 1 的数量相等。常函数的输出值是一个常数。\n\n\
  ## 西蒙算法\n\n现在让我们来看看西蒙量子算法。该算法有助于识别一个黑盒函数 `h(x)`，其中 `h(x) = h(y)` 且 `x = y ⊕ t`。请注意，`t\
  \ ∈ {0, 1}^n`，而 `⊕` 表示基于模 2 的按位加法。该算法的目标是通过使用 `h` 来找到 `t`。这个量子算法的性能在指数级上优于其经典对应算法。该算法启发了肖尔（Shor）提出了肖尔算法。\n\
  \n让我们来看看该算法的 Python 代码实现。\n\n`RetrieveOnetoOneMap` 方法将输入掩码作为参数，并返回输出，该输出是一个位图函数。`RetrieveValidTwoToOneMap`\
  \ 方法接收搜索掩码和随机种子作为输入参数。它返回的输出是一个二对一映射函数。\n\n\n\n### 代码示例\n\n**Simons_Algorithm.py**\n\
  \n```python\nfrom collections import defaultdict\nimport numpy as nump\nfrom mock\
  \ import patch\nfrom collections import defaultdict\nfrom operator import xor\n\
  from typing import Dict, Tuple, List\nimport numpy.random as rand\nfrom pyquil import\
  \ Program\nfrom pyquil.api import QuantumComputer\nfrom pyquil.gates import H, MEASURE\n\
  def RetrieveOnetoOneMap(mask: str) -> Dict[str, str]:\nn_bits = len(mask)\nform_string\
  \ = \"{0:0\" + str(n_bits) + \"b}\"\nbit_map_dct = {}\nfor idx in range(2**n_bits):\n\
  bit_string = form_string.format(idx)\nbit_map_dct[bit_string] = InvokeBitwiseXorOperation(bit_string,\
  \ mask)\nreturn bit_map_dct\ndef RetrieveValidTwotoOneMap(mask: str, random_seed:\
  \ int = None) -> Dict[str, str]:\nif random_seed is not None:\nrand.seed(random_seed)\n\
  bit_map = RetrieveOnetoOneMap(mask)\nn_samples = int(len(bit_map.keys()) / 2)\n\
  range_of_2to1_map = list(rand.choice(list(sorted(bit_map.keys())), replace=False,\
  \ size=n_samples))\nlist_of_bitstring_tuples = sorted([(k, v) for k, v in bit_map.items()],\
  \ key=lambda x: x[0])\nbit_map_dct = {}\nfor cnt in range(n_samples):\nbitstring_tup\
  \ = list_of_bitstring_tuples[cnt]\nval = range_of_2to1_map[cnt]\nbit_map_dct[bitstring_tup[0]]\
  \ = val\nbit_map_dct[bitstring_tup[1]] = val\nreturn bit_map_dct\n```\n\n`Simons_Algorithm`类用于查找满足一组值的黑盒函数。它有一个构造函数和以下方法：`RetrieveSimonCircuit`、`CalculateUnitaryOracleMatrix`、`RetrieveBitMaskRetrieveSampleIndependentBits`、`RetrieveInverseMaskEquation`、`AppendToDictofIndepBits`、`RetrieveMissingMsbVector`和`CheckValidMaskIfCorrect`。`RetrieveSimonCircuit`方法将量子比特作为输入，并返回输出，即量子电路。\n\
  \n`Simons_Algorithm`类的`CalculateUnitaryOracleMatrix`方法接受比特字符串的输入映射。输出将是一个稠密矩阵，该矩阵是字典中值的排列。`Simons_Algorithm`类的`RetrieveBitMask`方法接受量子计算机和比特字符串作为输入。输出是一个比特字符串映射。\n\
  \n`RetrieveSampleIndependentBits`方法接受量子计算机和比特字符串作为输入。独立比特向量会随着比特字符串更新。`RetrieveInverseMaskEquation`方法根据输入函数创建比特掩码。`AppendToDictofIndepBits`方法接受一个数组作为输入。此方法将独立向量添加到字典中。`RetrieveMissingMsbVector`方法在独立比特向量集合中搜索来源值。该方法通过添加单位向量来修改集合。`CheckValidMaskIfCorrect`方法验证给定的掩码是否正确。\n\
  \n现在来看看什么是独立向量。如果两个向量不为零且不平行，则它们线性无关。线性独立向量通常是非零向量。反过来也是如此。在独立向量之后，我们再看看什么是比特掩码。比特掩码有助于检索给定字节中的比特。\n\
  \n```python\nclass Simons_Algorithm(object):\ndef __init__(self):\nself.unitary_function_mapping\
  \ = None\nself.n_qubits = None\nself.n_ancillas = None\nself._qubits = None\nself.computational_qubits\
  \ = None\nself.ancillas = None\nself.simon_circuit = None\nself._dict_of_linearly_indep_bit_vectors\
  \ = {}\nself.search_mask = None\nself.bit_map = None\nself.classical_register =\
  \ None\ndef RetrieveSimonCircuit(self) -> Program:\nsimon_circuit = Program()\n\
