  \    if returnHistory:\n        xHistory = nump.zeros((n, x.shape[1], repetitions+1))\n\
  \        xHistory[:,:,0] = x[:n,:].copy()\n    if stopCondition:\n        prevX\
  \ = x[:n].copy()\n    for i in range(repetitions):\n        if ((i>0) and (i%10==0)):\n\
  \            if stopCondition:\n                if nump.all(nump.linalg.norm(x[:n]-prevX,\
