  raw: "### Grover’s Algorithm\n\nGrover’s algorithm is used for searching a database.\
    \ The search algorithm can find an entry in a database of M entries with O (√N)\
    \ time and O(logN) space. This method was found by Lov Grover in 1996\\. He found\
    \ that his method gave a quadratic speedup compared to other quantum algorithms.\
    \ In addition, Grover’s method gives exponential speed over the classical equivalents.\n\
    \nGrover’s algorithm inverts a function. Let’s say y = g(x). Grover’s algorithm\
    \ finds x when y is given as input. Searching for a value of y in the database\
    \ is similar to finding a match of x. It is popular when solving NP-hard problems\
    \ by using exhaustive search over a possible set of solutions. You can use Grover’s\
    \ algorithm to search for a phone number in a phone book of M entries in √ M steps.\n\
    \nGrover’s algorithm consists of the following steps:\n\n1.  Initialize the system\
    \ to the state.\n\n2.  Execute the Grover iteration r(M) ties.\n\n3.  Measure\
    \ the amplitude Ω.\n\n4.  From Ωw (result), find w.\n\nLet’s look at the implementation\
    \ of Grover’s algorithm in Python.\n\nGrover’s search algorithm searches the target\
    \ value of a group by computing the mean amplitude and Grover’s amplitude. The\
    \ plot of the graph is computed from the amplitudes derived from Grover’s algorithm.\
    \ The plot presents the target value with the highest amplitude. The ApplyOracleFunction\
    \ method takes input x and returns the output as the hex digest of x. ApplyGrover’s\
    \ algorithm takes as input the target, objects, nvalue, and rounds. The amplitude\
    \ is returned as the output.\n\nThe target of the algorithm is to search for 9\
    \ in the group of string objects {'14', '5', '13', '7','9','11','97'}. The amplitude\
    \ is searched from the dictionary (group of string objects) based on the value\
    \ 1/ square root of the length of the set (9).\n\n#### Code Sample\n\n**Grovers_Algorithm.py**\n\
    \n```\nimport matplotlib.pyplot as plot\nimport numpy as nump\nimport string\n\
    import hashlib\nfrom math import sqrt, pi\nfrom collections import OrderedDict\n\
    from statistics import mean\ndef RenderGraph(amplitude_value, n):\ny_position\
    \ = nump.arange(n)\nplot.bar(y_position, amplitude_value.values(), align=\"center\"\
    , color=\"g\")\nplot.xticks(y_position, amplitude_value.keys())\nplot.ylabel('Amplitude\
    \ Value')\nplot.title('Grovers Algorithm')\nplot.show()\ndef ApplyOracleFunction(xvalue):\n\
    return hashlib.sha256(bytes(xvalue, 'utf-8')).hexdigest()\ndef ApplyGroverAlgorithm(target,\
    \ objects, nvalue, rounds):\ny_pos = nump.arange(nvalue)\namplitude = OrderedDict.fromkeys(objects,\
    \ 1/sqrt(nvalue))\nfor i in range(0, rounds, 2):\nfor k, v in amplitude.items():\n\
    if ApplyOracleFunction(k) == target:\namplitude[k] = v * -1\naverage = mean(amplitude.values())\n\
    for k, v in amplitude.items():\nif ApplyOracleFunction(k) == target:\namplitude[k]\
    \ = (2 * average) + abs(v)\ncontinue\namplitude[k] = v-(2*(v-average))\nreturn\
    \ amplitude\ntarget_algorithm = '9'\nobjects_grover = ('14', '5', '13', '7','9','11','97')\n\
    number = len(objects_grover)\namplitude_grover = OrderedDict.fromkeys(objects_grover,\
    \ 1/sqrt(number))\namplitude_grover[target_algorithm] = amplitude_grover[target_algorithm]\
    \ * -1\nprint(amplitude_grover)\naverage_grover = mean(amplitude_grover.values())\n\
    print(\"Mean is {}\".format(average_grover))\nfor k, v in amplitude_grover.items():\n\
    if k == target_algorithm:\namplitude_grover[k] = (2 * average_grover) + abs(v)\n\
    continue\namplitude_grover[k] = v-(2*(v-average_grover))\nprint(amplitude_grover)\n\
    needle_value = \"2d711642b726b04401627ca9fbac32f5c8530fb1903cc4db02258717921a4881\"\
    \nhaystack_value = string.ascii_lowercase\nnum = len(haystack_value)\nnum_rounds\
    \ = int((pi / 4) * sqrt(num))\nprint(\"number of rounds are {}\".format(num_rounds))\n\
    RenderGraph(ApplyGroverAlgorithm(needle_value, haystack_value, num, num_rounds),\
    \ num)\n```\n\n#### Command for Execution\n\n```\npip3 install numpy\npython3\
    \ Grovers_Algorithm.py\n```\n\n#### Output\n\n```\nOrderedDict([('4', 0.3779644730092272),\
    \ ('5', 0.3779644730092272), ('3', -0.3779644730092272), ('7', 0.3779644730092272),\
    \ ('9', 0.3779644730092272), ('11', 0.3779644730092272), ('97', 0.3779644730092272)])\n\
