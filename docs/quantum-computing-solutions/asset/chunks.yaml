    to come up with a unique notation for representing vectors and tensors. This notation
    is efficient compared to matrices.


    An X gate is a quantum equivalent of a NOT gate. A CNOT gate is a controlled-NOT
    gate. A CNOT gate negates a bit; the control bit is equal to only 1\. A Toffoli
    gate is a controlled-NOT gate, which is a quantum equivalent of an AND gate. Toffoli
    negates a bit if both control bits are equal to only 1\. A Pauli X gate is a quantum
    operation that rotates a quantum bit over the x-axis with an angle of 180 degrees.
    A Pauli Z gate is a quantum operation that rotates a quantum bit over the z-axis
    with an angle of 180 degrees.


    Now let’s look at some CNOT, X, Z, and Measure gate implementations to demonstrate
    the quantum gates. The implementations of a CNOT gate, X gate, Z gate, normalize
    operation, and Measure gates in Python are shown next.


    ### Code Sample


    **Multi_Qubit_System.py**


