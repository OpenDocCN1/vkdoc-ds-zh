    \n我们先来看经典解法。对于`b < M`，计算最大公约数`gcd(b,M)`。该计算采用欧几里得方法执行，步骤如下：\n\n- 如果`gcd(b,M) !=\
    \ 1`，则存在`M`的非平凡因子，问题解决。\n- 如果`gcd(b,M) == 1`，则求`g(x) = ax mod M`的周期，以找到满足`g(x+r)\
