    The state is measured, and the result is observed. A quantum system will have
    filters, which are used to identify the quantum state. Different functions are
    modeled based on the different sets of observables.


    A 2 qubit system is specified using the following equation:


    q(0) + q(1) = 1


    Single quantum bit measurements are used to model 2 qubit measurement operations.
    A quantum register can be measured partially. The unmeasured leftover is transformed
    using the identity quantum operation.


    ## Quantum States


    A quantum bit exists in 0, 1, or a state between 0 and 1 quantum states. This
    helps a quantum computer to model a huge set of possibilities through the quantum
    state. S bits are equivalent to 2^S multiple states. The state between 0 and 1
    is referred to as *quantum superposition*. Superposition is modeled as a wave
    function. A wave function can have infinite states mathematically.


    A quantum state is the state of the isolated quantum system. It defines the probability
    distribution of the measured observable quantum bit. Quantum states are classified
    as follows:


    *   Pure


    *   Mixed


    Two quantum states can be mixed with one another to create another quantum state.
    This is similar to the mixing of matter waves in physics.


    A Bloch sphere is used to present the quantum states (see Figure [3-5](#490826_1_En_3_Chapter.xhtml#Fig5)).
    A quantum bit can be in a superposition state, as shown here:


    ![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig5_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Bloch sphere


    ```

    amp1|0> + amp2|1> = |amp>  where |0> and |1> are column vectors

    ```


    amp1 and amp2 are called *probability amplitudes* , which are complex numbers.


    The norm squares and probabilities are calculated as a result of the measurement
    of a quantum bit.


    ```

    |amp1^2| + |amp2^2| = 1

    ```


    A superposition state can also be represented as shown here (see Figure [3-6](#490826_1_En_3_Chapter.xhtml#Fig6)):


    ![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig6_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Superposition


    ```

    |ψ⟩  =   1/√2 * (|0> + |1>)

    ```


    Figure [3-6](#490826_1_En_3_Chapter.xhtml#Fig6) shows the quantum bits in superposition
    compared to the classical bits’ 0 and 1 states.


    A quantum particle’s state is modeled as a quantum bit. Figure [3-7](#490826_1_En_3_Chapter.xhtml#Fig7)
    shows the superposition state of the quantum particle.


    ![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig7_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Superposition state of quantum particle


    Now let’s look at a code sample in Python to demonstrate the superposition of
    the quantum bits and states.


    ### Code Sample


    **superposition.py**


    ```

    import numpy as nump

    zero_quantum_state = nump.array([[1.0], [0.0]])

    one_quantum_state = nump.array([[0.0], [1.0]])

    quantum_amp1 = 1.0 / 2**0.5

    quantum_amp2 = 1.0 / 2**0.5

    superposition_quantum_state = quantum_amp1 * zero_quantum_state + quantum_amp2
    * one_quantum_state

    print("superposition of", zero_quantum_state, " and ", one_quantum_state," is
    ",superposition_quantum_state)

    ```


    ### Command for Execution


    ```

    pip3 install numpy

    python3 superposition.py

    ```


    ### Output


    ```

    superposition of [[1.][0.]]  and  [[0.][1.]]  is  [[0.70710678][0.70710678]]

    ```


    ## Quantum Protocols


    In this section, we look at entanglement and teleportation, which are based on
    quantum protocols.


    ### Quantum Entanglement


    *Quantum entanglement* is the interaction of multiple quantum particles with each
    other. The interaction leads to entanglement, and the quantum particles might
    separate eventually in the space.


    This quantum protocol–based phenomenon was observed in 1935 by Albert Einstein,
    Boris Podolsky, and Nathen Rosen during a quantum mechanical experiment. They
    wanted to show the logical impossibility of quantum mechanics.


    A change in the quantum state of the entangled system–based particle impacts the
    other and is detectable. The particles in an entangled system are aware of each
    other. See Figure [3-8](#490826_1_En_3_Chapter.xhtml#Fig8).


    ![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig8_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    Entanglement


    ### Quantum Teleportation


    Quantum teleportation is the transfer of information from a source to a destination.
    Classical communication networks and channels are used to transfer information.
    The teleportation based on quantum protocols happens when there is an entanglement
    of quantum particles at the source and the destination. The current record is
    a distance of 1,400 kilometers (about 870 miles). Quantum channels can be created
    between the source and the destination. The quantum state of the quantum particles
    is teleported from the source to the destination. See Figure [3-9](#490826_1_En_3_Chapter.xhtml#Fig9).


    ![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig9_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Teleportation'
