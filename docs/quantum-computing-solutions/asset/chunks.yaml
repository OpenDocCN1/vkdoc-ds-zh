    \ 下载。\n"
- fmt: '# Quantum Languages


    Quantum algorithms such as Shor’s factoring, Grover’s search, and quantum approximate
    optimization are used to develop real-life applications, and quantum computers
    are simulated to solve real-life problems with the applications. When a quantum
    computing device is simulated, the software application is written in a quantum
    language, and the application code gets executed using the simulator.


    A quantum language is a typical programming language that has quantum instructions
    (see Figure [5-1](#490826_1_En_5_Chapter.xhtml#Fig1)). The quantum instructions
    operate on the quantum gates in a quantum circuit. The quantum circuit is modeled
    in the quantum simulator.


    ![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig1_HTML.jpg](images/490826_1_En_5_Chapter/490826_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Quantum languages


    A quantum language is a language, like `C`, that has data types and methods. These
    data types and methods are similar to a classical computer language. In addition,
    quantum data types and methods are provided in the language.


    Quantum computers are simulated on classical machines, so a quantum simulator
    has features to execute tasks on a classical machine. The simulator is based on
    the quantum mechanics principles and quantum computer model. Yuri Manin and Richard
    Feynman came up with a hypothesis that simulations can be executed based on the
    quantum mechanical principles. A quantum computer is based on the trapped ion
    approach and superconducting quantum bits.


    A trapped ion quantum computer is based on the confined ions suspended in electromagnetic
    fields. Quantum bits are stored in each ion. An ion has electronic states that
    have the quantum bits. The ion’s quantized motion is used to shift the quantum
    information by using the Coulomb force. A superconducting quantum bit is the fundamental
    unit of a quantum computer.


    Quantum computers operate using the quantum principles and use the subatomic particle
    state to manage the quantum information. Superposition is a quantum state that
    represents the subatomic particle probable state. Adiabatic quantum computation
    is another approach for a quantum computer that is based on the adiabatic theorem.
    This mathematical approach is used to execute quantum computing tasks.


    IBM, Google, Microsoft, and Rigetti quantum simulators have a programming API,
    software development kit, and cloud services. A quantum simulator helps programmers
    to execute simulations and computing tasks (see Figure [5-2](#490826_1_En_5_Chapter.xhtml#Fig2)).


    ![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig2_HTML.jpg](images/490826_1_En_5_Chapter/490826_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Quantum simulators


    Quantum simulators can be executed on a classical computer. Commercial quantum
    computers are available, but the number of quantum bits is the difference between
    the different implementations.


    Note


    A quantum computer cannot violate the Church-Turing thesis. Hence, it is possible
    to have a quantum simulator that is based on a Turing machine.


    ## Qubit Measurement


    Quantum computing tasks have encoding information and quantum measuring subtasks.
    The encoding is based on the quantum algorithm used to solve a real-life problem.
    Quantum bits that are in different states such as superposition need to be measured
    during the quantum computing tasks.


    Quantum bit measurement creates an output that is a superposition state. The Born
    rule states that the output will be a superposition state, and the output is proportional
    to the squared coefficient of the superposition state. Repetitive sampling is
    a feature of the software development kits in quantum computing. The sampling
    histograms are created based on the frequencies that are derived on the outcome
    counts.


    ## Quantum Instruction Sets


    The software programs that are developed with a quantum language are compiled
    using the quantum compiler to create a quantum instruction set (see Figure [5-3](#490826_1_En_5_Chapter.xhtml#Fig3)).
    The compiler creates the code in a quantum assembly language. Code optimization
    is a compiler feature.


    ![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig3_HTML.jpg](images/490826_1_En_5_Chapter/490826_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Quantum instruction set


    A quantum assembly language helps to model quantum circuits using the quantum
    gates and quantum operations. A quantum processor helps to execute the instruction
    sets on the quantum computer. The quantum computation needs to be noise free and
    error free. Reliable quantum bits and fault-tolerant quantum computing methods
    are used for quantum computation.


    Note


    A quantum instruction set is similar to the classical instruction sets that are
    present in classical computers.


    ### Code Sample


    ```

    import cirq

    qbit = cirq.GridQubit(0, 0)

    quantum_circuit = cirq.Circuit.from_ops(

    cirq.X(qbit)**0.5,

    cirq.measure(qbit, key="m")

    )

    print("Quantum Circuit:", quantum_circuit)

    quantum_simulator = cirq.Simulator()

    results = quantum_simulator.run(quantum_circuit, repetitions=20)

    print("Results ",results)

    ```


    ### Command for Execution


    ```

    pip3 install cirq

    python3 quantum_circuit.py

    ```


    ### Output


    ```

    Quantum Circuit: (0, 0): ───X^0.5───M(''m'')───

