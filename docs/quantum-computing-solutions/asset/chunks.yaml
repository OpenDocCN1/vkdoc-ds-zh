- fmt: '# Distribution Solutions


    Distribution planning and optimization problems consist of multi-depot logistics,
    delivery planning, vehicle routing, logistics integration, consolidation of transport
    vehicles, single-point and multipoint delivery drop-offs, and warehouse planning
    and returns. Classical techniques are used for distribution planning and vehicle
    routing. See Figure [12-6](#490826_1_En_12_Chapter.xhtml#Fig6).


    ![../images/490826_1_En_12_Chapter/490826_1_En_12_Fig6_HTML.jpg](images/490826_1_En_12_Chapter/490826_1_En_12_Fig6_HTML.jpg)


    Figure 12-6


    Distribution planning


    Distribution planning covers the schedule route process, planning of resources,
    vehicle routing and allocation of resources, reporting, what-if analysis, and
    reoptimization. The quantum algorithms help create transport schedules. These
    algorithms help in improving the efficiency and moving the enterprises away from
    silo planning methods.


    The following are the constraints in the distribution planning:


    * Variables are defined for tracking the cost of every schedule (direct, opportunity,
    total, reverse opportunity).

    * Cost-tracking variables are calculated for every queue (truck schedule).

    * The speed of the truck is assumed to calculate the time required to travel from
    the source to the destination.

    * The order delivery time is an important factor for choosing the schedule.

    * The opportunity cost is defined as the fraction of the direct cost. This is
    related to the underutilized capacity of the truck.

    * The reverse opportunity cost is a penalty when a truck is oversized.

    * For every schedule, the longest time taken for a run is the most important factor
    for optimization.

    * For every run, the truck picks the orders based on the capacity and will return
    to the source.

    * For optimization, the number of trucks is an important factor.


    For a given day, based on the booking information between multiple source points
    and multiple destinations, identify the optimal route for the delivery of goods.
    The solution is expected to define the following items as output:


    * All possible route combinations with associated cost

    * Optimal route based on cost (distance, time, minimum number of trucks)

    * Alternate options by accumulating delivery date


    The problem is purely exponential, meaning for every one-point increase of the
    source/destination, the combinations to be evaluated increase exponentially. For
    instance, with three source points, there exists eight distinct combinations to
    evaluate, and an increase in the source point by 1 doubles the distinct combinations
    to 16.


    While classical computers can solve the early stages, with increased source/destination
    points, it will gradually degrade in performance and end up breaking. Quantum
    computers, on the other hand, can leverage the property of quantum superposition
    to give a constant and better performance.


    In the vehicle routing optimization, the goal is to find the optimal routes for
    multiple vehicles visiting a set of locations. When there’s only one vehicle,
    it reduces to the traveling salesman problem. Optimal routes are the routes with
    the least total distance. However, if there are no other constraints, the optimal
    solution is to assign just one vehicle to visit all locations and find the shortest
    route for that vehicle.


    A better way to define optimal routes is to minimize the length of the longest
    single route among all vehicles. This is the right definition if the goal is to
    complete all deliveries as soon as possible. We can generalize the vehicle routing
    problem by adding constraints on the vehicles, including the following:


    * *Capacity constraints*: The vehicles need to pick up items at each location
    they visit but have a maximum carrying capacity.


    The goal of the distribution planning solution is to minimize the longest single
    route for distribution vehicles. Imagine a company that needs to visit its customers
    in a city made up of identical rectangular blocks.


    To solve this problem, you need to create a distance dimension, which computes
    the cumulative distance traveled by each vehicle along its route. You can then
    set a cost proportional to the maximum total distance along each route. Routing
    programs use dimensions to keep track of quantities that accumulate over a vehicle’s
    route. The distance matrix is calculated with source and destination pairs. Pickup
    point and delivery point input data is provided for the solution to work.


    The quantum annealing technique (see Figure [12-7](#490826_1_En_12_Chapter.xhtml#Fig7))
    is used for distribution planning problems. Data is passed to and from the program
    using JSON files. The quantum annealing process currently supports the optimal
    vehicle routing problems without time windows. Delivery locations are currently
    accepted as miles from the depot, which is assumed to be at the coordinates (0,0).


    The quantum annealing process is similar to simulated annealing. The thermal activation
    in the simulated annealing is replaced by the quantum tunneling. This technique
    is used for computing the minima and maxima for real-life problems such as distribution
    planning.


    ![../images/490826_1_En_12_Chapter/490826_1_En_12_Fig7_HTML.jpg](images/490826_1_En_12_Chapter/490826_1_En_12_Fig7_HTML.jpg)


    Figure 12-7


    Quantum annealing


    The coordinates are specified in the `data.json` file. The shortest route distance
    is the output. The truck’s information is in `trucks.json`. The pickup and delivery
    information is in `pickup_deliveries.json`.


    Tip


    The distribution solution is related to the delivery of goods from the manufacturer
    to the warehouse and from the warehouse to the store.


    Let’s look at the quantum annealing technique applied to distribution planning.'
