    The taxicab metric is as shown here:


    ```

    |x2-x1| + |y2-y1|

    ```


    **Tip**


    The difference between k-medians and k-means is in the choice of the center of
    the cluster. K-means selects the centroid, and k-medians chooses the average of
    cluster points.


