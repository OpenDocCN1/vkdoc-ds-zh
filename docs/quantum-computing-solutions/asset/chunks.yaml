    error correction in the quantum circuit.


    ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig10_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Quantum error correction


    Let’s look at classical error correction techniques such as coding. Coding is
    related to data cloning. This technique is not helpful for quantum error correction
    because of the no-cloning principle. The no-cloning principle states that a quantum
    state that is not known cannot be copied exactly. Quantum error correction does
    not allow a huge number of copies. Errors cannot be prevented by using direct
    measurement because quantum superposition fails. Quantum errors can happen due
    to quantum bit flip, phase shift, and continuous errors.


    Now let’s look at how to fix quantum errors. Coherent techniques help to bring
    down the control errors. The errors due to decoherence are time dependent. Modeling
    the errors helps to measure the errors, and positive operator–valued measures
    are used to measure the errors. Tracing the lost quantum bit is another way to
    model the quantum bit loss and removal. Correction is done by validating the presence
    of the quantum bit in the system first. Quantum bits are lost due to controls
    that are significant. The Shor code protocol designed by Peter Shor helps in identifying
    and fixing the errors from a quantum bit.


    Let’s now look at the Shor code protocol. The Shor code is a group of three quantum
    bit phase flip and bit flip codes. This quantum code helps to guard against the
    error impact on a quantum bit. Quantum states are operated by the unitary operation
    to result in a quantum error correction–based code. This result will be part of
    the subspace D of a bigger Hilbert space. A Hilbert space is an inner product
    of finite-dimensional complex vectors.


    ## Limitations of Quantum Computing


    Let’s look at the limitations of quantum computing before we look at different
    quantum algorithms. Quantum computers are prone to errors and problems due to
    the environment. Decoherence happens because of the collapse of the state function
    due to the measurement of state for a quantum bit. Decoherence causes the errors
    in the computation. The quantum bits count impacts the decoherence probability
    exponentially. Decoherence occurs because of the quantum bit flip, spontaneous
    symmetric breaking, and phase flip coding protocols. Quantum bit flip code flips
    the quantum bit based on a probability. The symmetric breaking protocol is based
    on a symmetry group F if an F transformation on the quantum system can be achieved
    by operating transformations on the quantum subsystems. Quantum bit phase flip
    code is based on the flip of the phase based on a probability.


    Small errors can be removed by using error correction protocols in classical computation.
    In quantum computation, small errors cannot be fixed. Quantum systems are entangled
    to the environment, and hence the error is induced before the computation begins.
    Initialization of the quantum bit induces the errors due to unitary transformations.


    ## Quantum Algorithms


    Algorithms are used in computation and data processing. The real-life situations
    are modeled and solved using heuristics and methods. An algorithm consists of
    a set of commands to execute a task. Quantum algorithms help in providing solutions
    to complex problems that cannot be solved by classical computers.


    Quantum programming languages help to create quantum software with quantum algorithms.
    A quantum algorithm consists of steps such as encoding the quantum data to quantum
    bits, a unitary quantum gates chain operating on the quantum bits, and terminating
    after measuring the quantum bits. A unitary quantum gate is similar to a unitary
    matrix that operates on the quantum bits. A unitary matrix inverse will be equal
    to its conjugate transpose.


    Quantum computing is based on quantum mechanical properties such as superposition
    and entanglement. Specifically, quantum algorithms use these principles.


    Note


    The word *algorithm* word originates from the word *algebra*. It is named after
    Arabian mathematician Al Khwarizmi.


    Let’s look at some quantum algorithms, starting with the Deutsch–Jozsa algorithm.'
