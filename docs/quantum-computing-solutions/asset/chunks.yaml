- fmt: "# Introduction\n\n> *“A classical computation is like a solo voice—one line\
    \ of pure tones succeeding each other. A quantum computation is like a symphony—many\
    \ lines of tones interfering with one another.”*\n> \n> —Seth Lloyd\n\nThis chapter\
    \ gives an overview of a quantum information processing framework. You will see\
    \ how a quantum information processing framework is applied in real life. Code\
    \ examples are presented for the quantum algorithms discussed. In addition, this\
    \ chapter discusses quantum circuits in detail.\n\n# Initial Setup\n\nYou need\
    \ to set up Python 3.5 to run the code samples in this chapter. You can download\
    \ it from [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/).\n\
    \n# Quantum Circuits\n\nA quantum circuit is a key part of quantum computing.\
    \ As we have seen, quantum computing is based on quantum mechanics principles.\
    \ For example, quantum mechanics principles such as superposition and quantum\
    \ entanglement are widely used in quantum computing. Quantum bits are the same\
    \ as the classical bits. The Hilbert state space has the eigenvalues related to\
    \ the linear superposition. The state values will be `|0>` and `|1>`. These eigen\
    \ states are operated on using unitary operations.\n\nLet’s look at what a Hilbert\
    \ space is. A Hilbert space is similar to an inner product space of finite-dimensional\
    \ complex vectors. The inner product of two complex vectors is the same as the\
    \ inner product of two matrices that represent the vectors. Now let’s see what\
    \ eigenvalues are. *Eigenvalues* are complex numbers that satisfy the linear equation\
    \ `B |v > = v|v>`. `|v>` is a nonzero vector, which is the eigenvector with linear\
    \ operator `B`.\n\nLet’s look at the superposition principle that was discussed\
    \ in earlier chapters. The superposition principle in quantum mechanics is related\
    \ to the states of the quantum system. Let’s say `|u>` and `|v>` are the two states\
    \ of the quantum system. Superposition `α|u> + β |v>` is a state that is valid\
    \ if `|α|² + |β|² = 1`. Schrodinger’s equation is another principle from quantum\
    \ mechanics that is used in quantum computing. The quantum system’s state evolves\
    \ with time. The time evolution is explained mathematically by Schrodinger’s equation.\n\
    \nFigure [4-1](#490826_1_En_4_Chapter.xhtml#Fig1) shows a sample quantum circuit\
    \ with Hadamard gates. The input and output will be in quantum bits. The Hadamard\
    \ gate was introduced in earlier chapters. It is a popular quantum gate in terms\
    \ of usage. It operates on the single quantum bit gates by rotation and reflection\
    \ on the Bloch sphere. The rotation of 90 degrees is around the y-axis, and the\
    \ x-axis rotation is 180 degrees.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig1_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nQuantum circuit\n\nThe quantum circuit model is based on the quantum\
    \ entanglement of quantum bits. Quantum entanglement has no classical equivalent.\
    \ The superposition principle is used in quantum computers to save data in exponential\
    \ size compared to classical computers. Classical computers using `M` bits can\
    \ save one out of the `2^(M)` combinations. Quantum computers can save `2^(M)`\
    \ combinations of information. Let’s see what quantum entanglement is. We discussed\
    \ quantum entanglement in the initial chapters. Entanglement is related to a pair\
    \ of entangled particles whose state is dependent on each other. This phenomenon\
    \ is observed when they are separated by huge distances.\n\nQuantum circuits are\
    \ used to create a quantum computer. The circuit consists of wires and quantum\
    \ gates. Quantum logic gates are based on either a quantum bit or multiple quantum\
    \ bit gates. These gates are reversible. Quantum gates are used to transmit and\
    \ modify the information.\n\nNow let’s look at the controlled-NOT gate circuit\
    \ shown in Figure [4-2](#490826_1_En_4_Chapter.xhtml#Fig2). A controlled-NOT gate\
    \ is a multiquantum bit logic gate. It is one of the universal quantum bit gates.\
    \ A CNOT gate has two input quantum bits. These quantum bits are the control quantum\
    \ bit and the target quantum bit. Similarly, the CNOT operator takes 2 qubits\
    \ as input. For the pair of input quantum bits, one is called a *controlled* quantum\
    \ bit and the other the *target* quantum bit. When you change the controlled quantum\
    \ bit to `|1>`, the target quantum bit’s value is flipped. Otherwise, the target\
    \ quantum bit remains the same.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig2_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2\n\nCNOT gate circuit\n\nFigure [4-3](#490826_1_En_4_Chapter.xhtml#Fig3)\
    \ shows a CNOT gate circuit in matrix form.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig3_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig3_HTML.jpg)\n\
    \nFigure 4-3\n\nCNOT gate circuit in matrix form\n\nLet’s look at another type\
    \ of circuit. A controlled-U gate circuit is based on a controlled-U gate. This\
    \ gate operates on the input of 2 qubits. The first quantum bit is a control quantum\
    \ bit. Figure [4-4](#490826_1_En_4_Chapter.xhtml#Fig4) shows the circuit. The\
    \ controlled-U gate has `U`, which is a unitary matrix. The unitary matrix operates\
    \ on a number `m` of quantum bits. The basic example of a controlled-U gate is\
    \ a controlled-NOT gate.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig4_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4\n\nControlled-U gate circuit\n\nFigure [4-5](#490826_1_En_4_Chapter.xhtml#Fig5)\
    \ shows the controlled-U gate circuit in matrix form.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig5_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5\n\nControlled-U gate circuit matrix\n\nA Toffoli gate circuit is\
    \ another type of circuit, as shown in Figure [4-6](#490826_1_En_4_Chapter.xhtml#Fig6).\
    \ A Toffoli gate combined with a Hadamard gate is a 3 qubit logic gate.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig6_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig6_HTML.jpg)\n\
    \nFigure 4-6\n\nToffoli gate circuit\n\nA Toffoli gate has an input of 3 bits\
    \ and an output of 3 bits. Out of the three input bits, two of them are control\
    \ bits, and the third bit is a target bit. If control bits have a value of 1,\
    \ the target bit is flipped. If the control bits do not have a value of 1, the\
    \ control bits are not changed.\n\nFigure [4-7](#490826_1_En_4_Chapter.xhtml#Fig7)\
    \ shows a Toffoli gate circuit in matrix form.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig7_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7\n\nToffoli gate circuit matrix\n\nAfter looking at the different\
    \ types of quantum circuits, the last step in the quantum circuit model is the\
    \ measurement projected on the computational scale. This step is not reversible.\
    \ There are two types of measurement: deferred and implicit. The *deferred* measurement\
    \ method allows changing the quantum operations to the classical equivalents.\
    \ In this method, a measurement can be sent from the middle stage to the end of\
    \ the circuit. In the *implicit* measurement method, quantum bits that are not\
    \ measured can be measured implicitly. In this method, generality loss does not\
    \ happen.\n\n> **Note**\n> \n> A quantum circuit has reversible changes to a mechanical\
    \ analog, which is a quantum register."
  raw: "## Introduction\n\n> *“A classical computation is like a solo voice—one line\
    \ of pure tones succeeding each other. A quantum computation is like a symphony—many\
    \ lines of tones interfering with one another.”*\n> \n> —Seth Lloyd\n\nThis chapter\
    \ gives an overview of a quantum information processing framework. You will see\
    \ how a quantum information processing framework is applied in real life. Code\
    \ examples are presented for the quantum algorithms discussed. In addition, this\
    \ chapter discusses quantum circuits in detail.\n\n## Initial Setup\n\nYou need\
    \ to set up Python 3.5 to run the code samples in this chapter. You can download\
    \ it from [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/).\n\
    \n## Quantum Circuits\n\nA quantum circuit is a key part of quantum computing.\
    \ As we have seen, quantum computing is based on quantum mechanics principles.\
    \ For example, quantum mechanics principles such as superposition and quantum\
    \ entanglement are widely used in quantum computing. Quantum bits are the same\
    \ as the classical bits. The Hilbert state space has the eigenvalues related to\
    \ the linear superposition. The state values will be |0> and |1>. These eigen\
    \ states are operated on using unitary operations.\n\nLet’s look at what a Hilbert\
    \ space is. A Hilbert space is similar to an inner product space of finite-dimensional\
    \ complex vectors. The inner product of two complex vectors is the same as the\
    \ inner product of two matrices that represent the vectors. Now let’s see what\
    \ eigenvalues are. *Eigenvalues* are complex numbers that satisfy the linear equation\
    \ B |v > = v|v>. |v> is a nonzero vector, which is the eigenvector with linear\
    \ operator B.\n\nLet’s look at the superposition principle that was discussed\
    \ in earlier chapters. The superposition principle in quantum mechanics is related\
    \ to the states of the quantum system. Let’s say |u> and |v> are the two states\
    \ of the quantum system. Superposition α|u> + β |v> is a state that is valid if\
    \ |α|² + |β|² = 1\\. Schrodinger’s equation is another principle from quantum\
    \ mechanics that is used in quantum computing. The quantum system’s state evolves\
    \ with time. The time evolution is explained mathematically by Schrodinger’s equation.\n\
    \nFigure [4-1](#490826_1_En_4_Chapter.xhtml#Fig1) shows a sample quantum circuit\
    \ with Hadamard gates. The input and output will be in quantum bits. The Hadamard\
    \ gate was introduced in earlier chapters. It is a popular quantum gate in terms\
    \ of usage. It operates on the single quantum bit gates by rotation and reflection\
    \ on the Bloch sphere. The rotation of 90 degrees is around the y-axis, and the\
    \ x-axis rotation is 180 degrees.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig1_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nQuantum circuit\n\nThe quantum circuit model is based on the quantum\
    \ entanglement of quantum bits. Quantum entanglement has no classical equivalent.\
    \ The superposition principle is used in quantum computers to save data in exponential\
    \ size compared to classical computers. Classical computers using M bits can save\
    \ one out of the 2^(**M**) combinations. Quantum computers can save 2^(**M**)\
    \ combinations of information. Let’s see what quantum entanglement is. We discussed\
    \ quantum entanglement in the initial chapters. Entanglement is related to a pair\
    \ of entangled particles whose state is dependent on each other. This phenomenon\
    \ is observed when they are separated by huge distances.\n\nQuantum circuits are\
    \ used to create a quantum computer. The circuit consists of wires and quantum\
    \ gates. Quantum logic gates are based on either a quantum bit or multiple quantum\
    \ bit gates. These gates are reversible. Quantum gates are used to transmit and\
    \ modify the information.\n\nNow let’s look at the controlled-NOT gate circuit\
    \ shown in Figure [4-2](#490826_1_En_4_Chapter.xhtml#Fig2). A controlled-NOT gate\
    \ is a multiquantum bit logic gate. It is one of the universal quantum bit gates.\
    \ A CNOT gate has two input quantum bits. These quantum bits are the control quantum\
    \ bit and the target quantum bit. Similarly, the CNOT operator takes 2 qubits\
    \ as input. For the pair of input quantum bits, one is called a *controlled* quantum\
    \ bit and the other the *target* quantum bit. When you change the controlled quantum\
    \ bit to |1>, the target quantum bit’s value is flipped. Otherwise, the target\
    \ quantum bit remains the same.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig2_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2\n\nCNOT gate circuit\n\nFigure [4-3](#490826_1_En_4_Chapter.xhtml#Fig3)\
    \ shows a CNOT gate circuit in matrix form.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig3_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig3_HTML.jpg)\n\
    \nFigure 4-3\n\nCNOT gate circuit in matrix form\n\nLet’s look at another type\
    \ of circuit. A controlled-U gate circuit is based on a controlled-U gate. This\
    \ gate operates on the input of 2 qubits. The first quantum bit is a control quantum\
    \ bit. Figure [4-4](#490826_1_En_4_Chapter.xhtml#Fig4) shows the circuit. The\
    \ controlled-U gate has U, which is a unitary matrix. The unitary matrix operates\
    \ on a number m of quantum bits. The basic example of a controlled-U gate is a\
    \ controlled-NOT gate.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig4_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4\n\nControlled-U gate circuit\n\nFigure [4-5](#490826_1_En_4_Chapter.xhtml#Fig5)\
    \ shows the controlled-U gate circuit in matrix form.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig5_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5\n\nControlled-U gate circuit matrix\n\nA Toffoli gate circuit is\
    \ another type of circuit, as shown in Figure [4-6](#490826_1_En_4_Chapter.xhtml#Fig6).\
    \ A Toffoli gate combined with a Hadamard gate is a 3 qubit logic gate.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig6_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig6_HTML.jpg)\n\
    \nFigure 4-6\n\nToffoli gate circuit\n\nA Toffoli gate has an input of 3 bits\
    \ and an output of 3 bits. Out of the three input bits, two of them are control\
    \ bits, and the third bit is a target bit. If control bits have a value of 1,\
    \ the target bit is flipped. If the control bits do not have a value of 1, the\
    \ control bits are not changed.\n\nFigure [4-7](#490826_1_En_4_Chapter.xhtml#Fig7)\
    \ shows a Toffoli gate circuit in matrix form.\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig7_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7\n\nToffoli gate circuit matrix\n\nAfter looking at the different\
    \ types of quantum circuits, the last step in the quantum circuit model is the\
    \ measurement projected on the computational scale. This step is not reversible.\
    \ There are two types of measurement: deferred and implicit. The *deferred* measurement\
    \ method allows changing the quantum operations to the classical equivalents.\
    \ In this method, a measurement can be sent from the middle stage to the end of\
    \ the circuit. In the *implicit* measurement method, quantum bits that are not\
    \ measured can be measured implicitly. In this method, generality loss does not\
    \ happen.\n\nNote\n\nA quantum circuit has reversible changes to a mechanical\
    \ analog, which is a quantum register."
  trans: "\n# 引言\n\n> *“经典计算如同独唱——一条纯净的音调彼此相继。量子计算则像交响乐——众多音调相互干涉。”*\n> \n> ——塞斯·劳埃德\n\
    \n本章概述了量子信息处理的框架。你将了解量子信息处理框架如何应用于现实生活。针对所讨论的量子算法，本章提供了代码示例。此外，本章还详细讨论了量子电路。\n\
    \n# 初始设置\n\n你需要安装 Python 3.5 才能运行本章中的代码示例。你可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
    \ 下载。\n\n# 量子电路\n\n量子电路是量子计算的关键组成部分。正如我们所知，量子计算基于量子力学原理。例如，叠加态和量子纠缠等量子力学原理在量子计算中被广泛应用。量子比特与经典比特类似。希尔伯特状态空间具有与线性叠加相关的特征值。状态值将是\
    \ `|0>` 和 `|1>`。这些本征态通过酉操作进行运算。\n\n让我们看看什么是希尔伯特空间。希尔伯特空间类似于有限维复数向量的内积空间。两个复数向量的内积与表示这些向量的两个矩阵的内积相同。现在让我们看看什么是特征值。*特征值*是满足线性方程\
    \ `B |v > = v|v>` 的复数。`|v>` 是一个非零向量，它是线性算子 `B` 的特征向量。\n\n让我们回顾一下前面章节讨论过的叠加原理。量子力学中的叠加原理与量子系统的状态有关。假设\
    \ `|u>` 和 `|v>` 是量子系统的两种状态。叠加态 `α|u> + β |v>` 是一个有效的状态，前提是 `|α|² + |β|² = 1`。薛定谔方程是量子计算中使用的另一个量子力学原理。量子系统的状态随时间演化。这种时间演化通过薛定谔方程进行数学解释。\n\
    \n图 4-1 展示了一个包含哈达玛门的量子电路示例。输入和输出都将以量子比特形式呈现。哈达玛门在前面的章节中已经介绍过。就其使用频率而言，它是一个流行的量子门。它通过在布洛赫球上进行旋转和反射来对单量子比特门进行操作。绕\
    \ y 轴旋转 90 度，绕 x 轴旋转 180 度。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig1_HTML.jpg](img/490826_1_En_4_Fig1_HTML.jpg)\n\
    \n图 4-1\n\n量子电路\n\n量子电路模型基于量子比特的量子纠缠。量子纠缠没有经典对应物。与经典计算机相比，量子计算机利用叠加原理能够以指数级的规模存储数据。使用\
    \ `M` 个比特的经典计算机只能存储 `2^(M)` 种组合中的一种。量子计算机则可以存储 `2^(M)` 种信息组合。让我们看看什么是量子纠缠。我们在前面的章节中讨论过量子纠缠。纠缠与一对相互依赖状态的纠缠粒子有关。当它们相隔巨大距离时，也能观察到这种现象。\n\
    \n量子电路用于构建量子计算机。电路由导线和量子门组成。量子逻辑门基于单量子比特门或多量子比特门。这些门是可逆的。量子门用于传输和修改信息。\n\n现在让我们来看图\
    \ 4-2 中所示的受控非门电路。受控非门是一种多量子比特逻辑门。它是通用量子比特门之一。CNOT 门有两个输入量子比特。这些量子比特分别是控制量子比特和目标量子比特。同样地，CNOT\
    \ 算子以两个量子比特作为输入。对于这对输入量子比特，一个被称为*控制*量子比特，另一个被称为*目标*量子比特。当你将控制量子比特变为 `|1>` 时，目标量子比特的值会发生翻转。否则，目标量子比特保持不变。\n\
    \n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig2_HTML.jpg](img/490826_1_En_4_Fig2_HTML.jpg)\n\
    \n图 4-2\n\nCNOT 门电路\n\n图 4-3 展示了矩阵形式的 CNOT 门电路。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig3_HTML.jpg](img/490826_1_En_4_Fig3_HTML.jpg)\n\
    \n图 4-3\n\n矩阵形式的 CNOT 门电路\n\n让我们看看另一种类型的电路。受控-U 门电路基于受控-U 门。该门对两个量子比特的输入进行操作。第一个量子比特是控制量子比特。图\
    \ 4-4 展示该电路。受控-U 门包含 `U`，它是一个酉矩阵。该酉矩阵对 `m` 个量子比特进行操作。受控-U 门的一个基本示例是受控非门。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig4_HTML.jpg](img/490826_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4\n\n受控-U 门电路\n\n图 4-5 展示了矩阵形式的受控-U 门电路。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig5_HTML.jpg](img/490826_1_En_4_Fig5_HTML.jpg)\n\
    \n图 4-5\n\n受控-U 门电路矩阵\n\n托佛利门电路是另一种类型的电路，如图 4-6 所示。托佛利门与哈达玛门组合构成一个三量子比特逻辑门。\n\n\
    ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig6_HTML.jpg](img/490826_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6\n\n托佛利门电路\n\n托佛利门有三个输入比特和三个输出比特。在三个输入比特中，两个是控制比特，第三个是目标比特。如果控制比特的值为 1，则目标比特翻转。如果控制比特的值不为\
    \ 1，则控制比特不变。\n\n图 4-7 展示了矩阵形式的托佛利门电路。\n\n![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig7_HTML.jpg](img/490826_1_En_4_Fig7_HTML.jpg)\n\
    \n图 4-7\n\n托佛利门电路矩阵\n\n在了解了不同类型的量子电路之后，量子电路模型的最后一步是在计算基上进行的投影测量。这一步是不可逆的。测量有两种类型：延迟测量和隐式测量。*延迟*测量方法允许将量子操作转换为经典等效操作。在这种方法中，测量可以从电路中间阶段移至末端。在*隐式*测量方法中，未被测量的量子比特可以被隐式测量。此方法不会导致通用性损失。\n\
    \n> **注意**\n> \n> 量子电路对其机械类比——量子寄存器，执行可逆更改。\n"
- fmt: '# Quantum Communication


    `Quantum communication` is the process of sending the quantum state from one point
    to another, as shown in Figure [4-8](#490826_1_En_4_Chapter.xhtml#Fig8). `Superdense
    coding` is a popular communication protocol that was first proposed in 1992 by
    Bennett and Wiesner. `Quantum teleportation` is related to the movement of quantum
    states without quantum communication. This is an inverse method to superdense
    coding. `Quantum teleportation` is a method for shifting the quantum states without
    the quantum communication channel between the receiver and the sender.


    ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig8_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig8_HTML.jpg)


    Figure 4-8


    Quantum communication


    In superdense coding, classical information bits are transferred from the source
    to the destination. In quantum teleportation, quantum bits are transferred by
    using the communication channel between two classical bits.


    The superdense protocol has an instruction set and the output results. The protocol
    is valid if it generates the expected output. The superdense protocol is based
    on quantum entanglement. Quantum entanglement occurs when a single common source
    can produce multiple quantum systems. The state of the quantum systems does not
    follow Bell inequality rules. The systems that are entangled impact each other
    even if they are separated by huge distances.


    We have looked at the superdense quantum communication protocol; the other protocols
    are the continuous variable, satellite, and linear optics quantum communication
    protocols. The electric field of the incident light is measured using a homodyne
    detector. The measurement results in a continuous value. Continuous variable quantum
    communication is based on the homodyne detector measurement outcome. The satellite
    communication protocol is based on ground-to-satellite and satellite-to-satellite
    communication channels. The linear optical quantum communication protocol is based
    on optical fiber–based communication channels.


    # Quantum Noise


    Quantum noise occurs because of uncertainty of a quantum origin–based physical
    entity. Spectral density is used to measure the noise intensity. This is measured
    at a specific frequency in a time-dependent manner. Quantum devices create noise
    when the field is amplified. Quantum computers also create noise because of the
    noncommutation of the modes of the quantum field. Figure [4-9](#490826_1_En_4_Chapter.xhtml#Fig9)
    represents the noise in quantum computing form and the wave form.


    ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig9_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    Quantum noise


    H.B.Callen and T.A.Welton represented the spectral density in mathematical equations.
    Roger H.Koch measured the spectral entities of the quantum noise experimentally
    first. Spectral density is related to the signal periodograms of time segments.
    Mathematically, Fourier analysis is a good method to measure spectral density
    by breaking down the function to a set of periodograms. A periodogram is a time
    period series in mathematics.


    Note


    Quantum noise happens because of signal changes in an electric circuit. The signal
    changes occur because of the electron’s discrete character.


    # Quantum Error Correction


    The quantum error correction method helps to shield the quantum information from
    quantum noise and decoherence errors. The quantum error correction method was
    first created in 1995. Figure [4-10](#490826_1_En_4_Chapter.xhtml#Fig10) shows
    error correction in the quantum circuit.


    ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig10_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Quantum error correction


    Let’s look at classical error correction techniques such as coding. Coding is
    related to data cloning. This technique is not helpful for quantum error correction
    because of the no-cloning principle. The no-cloning principle states that a quantum
    state that is not known cannot be copied exactly. Quantum error correction does
    not allow a huge number of copies. Errors cannot be prevented by using direct
    measurement because quantum superposition fails. Quantum errors can happen due
    to quantum bit flip, phase shift, and continuous errors.


    Now let’s look at how to fix quantum errors. Coherent techniques help to bring
    down the control errors. The errors due to decoherence are time dependent. Modeling
    the errors helps to measure the errors, and positive operator–valued measures
    are used to measure the errors. Tracing the lost quantum bit is another way to
    model the quantum bit loss and removal. Correction is done by validating the presence
    of the quantum bit in the system first. Quantum bits are lost due to controls
    that are significant. The Shor code protocol designed by Peter Shor helps in identifying
    and fixing the errors from a quantum bit.


    Let’s now look at the Shor code protocol. The Shor code is a group of three quantum
    bit phase flip and bit flip codes. This quantum code helps to guard against the
    error impact on a quantum bit. Quantum states are operated by the unitary operation
    to result in a quantum error correction–based code. This result will be part of
    the subspace `D` of a bigger Hilbert space. A Hilbert space is an inner product
    of finite-dimensional complex vectors.


    # Limitations of Quantum Computing


    Let’s look at the limitations of quantum computing before we look at different
    quantum algorithms. Quantum computers are prone to errors and problems due to
    the environment. Decoherence happens because of the collapse of the state function
    due to the measurement of state for a quantum bit. Decoherence causes the errors
    in the computation. The quantum bits count impacts the decoherence probability
    exponentially. Decoherence occurs because of the quantum bit flip, spontaneous
    symmetric breaking, and phase flip coding protocols. Quantum bit flip code flips
    the quantum bit based on a probability. The symmetric breaking protocol is based
    on a symmetry group `F` if an `F` transformation on the quantum system can be
    achieved by operating transformations on the quantum subsystems. Quantum bit phase
    flip code is based on the flip of the phase based on a probability.


    Small errors can be removed by using error correction protocols in classical computation.
    In quantum computation, small errors cannot be fixed. Quantum systems are entangled
    to the environment, and hence the error is induced before the computation begins.
    Initialization of the quantum bit induces the errors due to unitary transformations.


    # Quantum Algorithms


    Algorithms are used in computation and data processing. The real-life situations
    are modeled and solved using heuristics and methods. An algorithm consists of
    a set of commands to execute a task. Quantum algorithms help in providing solutions
    to complex problems that cannot be solved by classical computers.


    Quantum programming languages help to create quantum software with quantum algorithms.
    A quantum algorithm consists of steps such as encoding the quantum data to quantum
    bits, a unitary quantum gates chain operating on the quantum bits, and terminating
    after measuring the quantum bits. A unitary quantum gate is similar to a unitary
    matrix that operates on the quantum bits. A unitary matrix inverse will be equal
    to its conjugate transpose.


    Quantum computing is based on quantum mechanical properties such as superposition
    and entanglement. Specifically, quantum algorithms use these principles.


    Note


    The word *algorithm* word originates from the word *algebra*. It is named after
    Arabian mathematician Al Khwarizmi.


    Let’s look at some quantum algorithms, starting with the Deutsch–Jozsa algorithm.'
