    ```


    ## Quantum Assembly Programming


    Quantum computers have quantum processors that are physical chips that can have
    a set of quantum bits. A quantum computer has electronic units for control and
    components for managing memory and data. The quantum processors can be based on
    gate models or annealing approaches. The gate model quantum processing units have
    quantum circuits and computational tasks that are executed using quantum gates.
    Quantum annealing is used for annealing quantum processing units.


    Quantum interpreters and compilers are used to compile the software code to create
    assembly code. A quantum assembly language is used to create the assembly code
    that has the quantum instruction sets that can be executed on the quantum simulator
    or quantum computer. See Figure [5-5](#490826_1_En_5_Chapter.xhtml#Fig5).


    ![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig5_HTML.jpg](images/490826_1_En_5_Chapter/490826_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Quantum assembly language


    Quantum physical principles are used for creating quantum computers and simulators.
    Programmers are provided with software development kits to help them to develop
    applications using the quantum programming languages.


    Quantum computer architecture is based on different methods such as adiabatic
    computational models. Quantum circuits are developed using the quantum gates on
    the quantum assembly. These circuits can be simulated on the quantum simulator
    for executing the quantum assembly code. The code has the instruction sets to
    operate on the quantum gates in the circuit.


    ### Code Sample


    ```python

    import qiskit

    class QASM_JobManager:

    def __init__(self):

    self.data = []

    def createProgram(self,quantum,classical):

    qr = qiskit.QuantumRegister(quantum)

    cr = qiskit.ClassicalRegister(classical)

    program = qiskit.QuantumCircuit(qr, cr)

    return qr,cr,program

    def measure(self,program,qr,cr):

    program.measure(qr,cr)

    def getQASMBackend(self):

    backend = qiskit.BasicAer.get_backend(''qasm_simulator'')

    return backend

    def executeProgramOnQASM(self,program,backend):

    job = qiskit.execute( program, backend  )

    return job

    jobManager = QASM_JobManager()

    quantumRegister,classicalRegister,program = jobManager.createProgram(1,1)

    jobManager.measure(program,quantumRegister,classicalRegister)

    backend = jobManager.getQASMBackend()

    print("The device name:",backend.name())

    job = jobManager.executeProgramOnQASM(program,backend)

    print( job.result().get_counts() )

    ```


    ### Command for Execution


    ```bash

    pip3 install qiskit

    python3 quantum_assembly.py

    ```


    ### Output


    ```

    The device name: qasm_simulator

    {''0'': 1024}

    ```


    ## Quantum Hardware Platforms


    Quantum hardware platforms are available from Google, Rigetti, Microsoft, and
    IBM (see Figure [5-6](#490826_1_En_5_Chapter.xhtml#Fig6)). They implement quantum
    computational models to perform quantum computations. The approaches used for
    building the quantum computer are trapped ions, photonics systems, and superconducting
    quantum bits. Quantum bits are the current limitation and the differentiator between
    these platforms.


    ![../images/490826_1_En_5_Chapter/490826_1_En_5_Fig6_HTML.jpg](images/490826_1_En_5_Chapter/490826_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Quantum hardware


    Quantum random access memory is based on the master classical device operating
    on the quantum device. This is based on the hybrid quantum programming model where
    you can start with typical programming languages like Python and use quantum programming
    languages for quantum computational tasks. In Microsoft implementations, C# is
    used for typical programming tasks, and Q# is used for quantum computations.


    A quantum register is based on multiple quantum bit systems. It is similar to
    a classical computer register. A quantum register operates on quantum bits in
    a quantum device and is a system consisting of multiple qubits. This is equivalent
    to the classical processor register. Quantum computers manipulate qubits within
    a quantum register. It has the capability to model 2^X combinations of the quantum
    bits. A classical register can handle x combinations of the classical bits.


    ### Commercially Available Quantum Computers


    The commercial quantum computing platforms are listed here:


    *   Rigetti

    *   Google

    *   IBM

    *   Microsoft


    The Rigetti computing platform has the following components:


    *   Quil

    *   PyQuil

    *   QUILC

    *   Quantum virtual machine (QVM)


    The Google Quantum Computing Playground has support for scripting and the following
    features:


    *   Browser-based IDE

    *   Quantum registers of 22 qubits

    *   Programs and compilation

    *   Nested logic in programs

    *   Quantum gates modeling

    *   Math functions support

    *   Visualization modes


    The IBM Quantum Experience has the following modules:


    *   Quantum Circuit Composer

    *   Quantum Circuit Visualizer

    *   Quantum Gates Support

    *   Quantum Register

    *   Qiskit Notebooks (Jupyter based)


    The Microsoft Quantum Development Kit has support for Microsoft Q# and the QDK.
    It has a simulator and open source AI for developers to create programs using
    quantum circuits, gates, and simulators.


    ## Summary


    In this chapter, we looked at the quantum languages, qubit measurement, quantum
    instruction sets, full-stack universal quantum simulator, quantum assembly programming,
    and quantum hardware platforms. The chapter also presented code samples for quantum
    assembly, quantum circuits, and simulator.


