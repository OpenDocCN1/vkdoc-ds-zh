    矩阵的*迹*是方阵对角线上元素之和。它用`tr()`表示。例如，矩阵`A`的迹等于`tr(A)`。


    只有相同类型的矩阵才能相加，和是通过将矩阵的对应元素相加得到的。类似地，相同类型的矩阵可以进行减法，结果是通过对应元素相减得到的。

