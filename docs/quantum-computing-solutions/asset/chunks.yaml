    generator generates the statistics. At the same time, the discriminator cannot
    differentiate between the real and generated data. See Figure [8-2](#490826_1_En_8_Chapter.xhtml#Fig2).


    ![../images/490826_1_En_8_Chapter/490826_1_En_8_Fig2_HTML.jpg](images/490826_1_En_8_Chapter/490826_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    QGAN


    The quantum generative adversarial networks (QGANs) are generative adversarial
    networks using quantum processors. Seth Lloyd and Christian Weed Brook first devised
    the adversarial learning algorithm. This algorithm runs on a quantum computer
    that has a quantum register with qubits. Qubits exist in the 0 and 1 states. Quantum
    computers process vectors in very high-dimensional vector spaces. These vectors
    have information to be processed.


    Let’s look at an implementation of a quantum generative adversarial network. The
    implementation is based on two quantum circuits: the generator and the other discriminator.'
  trans: "\n# 量子联想记忆\n\n量子联想记忆基于一种量子神经计算方法。记忆与回忆是模式联想过程的组成部分。模式在记忆步骤中被持久化存储。回忆步骤则由模式联想和模式补全组成。\n\
    \n记忆是一种量子算法，它使用 `m` 个量子比特创建量子态，以建模 `q` 个模式。该算法使用多项式数量的基本操作，这些操作涉及 1、2 和 3 个量子比特。算法使用受控非门和弗雷德金量子门进行数学运算。为了使用\
    \ `m` 个量子神经元建模 `q` 个模式，该算法按 `mq` 步的数量级执行。\n\n量子联想记忆中的回忆步骤基于格罗弗搜索算法。该搜索算法在包含 `m`\
    \ 个项目的数据库中，以 `√m` 时间量级找到目标项目。记忆和回忆算法被融合在一起，形成了量子联想记忆过程。\n\n量子联想记忆算法由丹·文图拉和托尼·马丁内斯创建。该算法与基于量子电路的计算机上的联想记忆模拟相关。在量子联想记忆中，量子比特处于叠加态。格罗弗算法可以通过量子联想记忆算法进行修改，以便根据搜索输入，通过记忆状态进行搜索。\n\
    \n量子联想记忆在神经网络领域应用广泛。这种记忆的存储容量与神经网络中神经元的数量呈指数关系。该记忆模型基于人脑的记忆方式，人脑中的处理过程就是基于神经网络的。\n\
    \n> **提示**\n> \n> 量子联想记忆算法基于一个多项式时间算法，该算法使用基于训练数据集的量子比特集来创建量子态。\n\n现在，让我们来看一个叫做*量子点*的概念。\n\
    \n## 量子点\n\n量子点是尺寸在纳米级别的粒子。这些粒子在受到光照时会发光。粒子发射光的波长可以通过量子点的大小、形状和材料来改变。尺寸为 2 到 3\
    \ 纳米的量子点会产生蓝绿光谱区域。尺寸为 5 到 6 纳米的量子点则发射与橙色、红色和红外光谱区域相关的光。量子点的大小与发射光的寿命相关。量子点越大，寿命越长。\n\
    \n纳米粒子比量子点尺寸更大。纳米粒子的尺寸为 8 到 100 纳米。量子点器件基于量子点构建。在量子点器件中，量子点通过隧穿效应与引线连接。计算稳态粒子的电流时，会使用多种一阶方法。泡利、林德布拉德、雷德菲尔德和冯·诺依曼所采用的方法被用于计算库仑阻塞效应。还有一些二阶方法，例如冯·诺依曼的\
    \ `-2vN` 方法，可用于分析协同隧穿、双粒子隧穿以及展宽效应。\n\n> **提示**\n> \n> 量子点有助于制造荧光和基于 FRET 的生物传感器。这些生物传感器用于识别生物分子，例如酸、酶、糖类、抗体和抗原。\n\
    \n现在，我们来看一下量子随机存取存储器的概念。\n\n## 量子随机存取存储器\n\n量子随机存取存储器基于 `m` 个量子比特，来创建包含 `2^m`\
    \ 个不同存储单元的地址空间。该内存模型用于实现 `m` 个存储单元的叠加。与传统的量子 RAM 设计不同，该模型基于 `O(log 2^m)` 个开关。该模型有助于使用更低的功耗进行寻址。这是通过利用纠缠原理实现的。\n\
    \n`QRAM` 是量子计算机的基础。基于量子比特的地址寄存器和输出寄存器有助于管理 `QRAM` 中的内存。内存访问算法基于相干量子叠加。`QRAM` 用于量子搜索、碰撞识别、元素唯一性检测、信号的相干路由以及加密数据搜索。\n\
    \n让我们来看一下量子生成对抗网络算法。\n\n## 量子 GAN\n\n在经典机器学习中，生成对抗网络是一种工具。生成器用于生成数据的统计特征。它试图模仿当前的数据集。判别器则用于区分真实数据和伪造数据。生成器和判别器的学习过程会收敛。当生成器生成的统计特征使得判别器无法区分真实数据和生成数据时，收敛便发生了。见图\
    \ 8-2。\n\n![../images/490826_1_En_8_Chapter/490826_1_En_8_Fig2_HTML.jpg](img/490826_1_En_8_Fig2_HTML.jpg)\n\
    \n**图 8-2** QGAN\n\n量子生成对抗网络（`QGANs`）是使用了量子处理器的生成对抗网络。塞斯·劳埃德和克里斯蒂安·韦德·布鲁克首先提出了这种对抗学习算法。该算法运行在具有包含量子比特的量子寄存器的量子计算机上。量子比特存在于\
    \ 0 和 1 两种状态。量子计算机在非常高维的向量空间中处理向量。这些向量承载着需要被处理的信息。\n\n让我们来看一个量子生成对抗网络的实现。该实现基于两个量子电路：一个生成器和一个判别器。\n"
- fmt: "### Code Sample\n\n```python\nimport pennylane as qganPenny\nfrom pennylane\
    \ import numpy as numcal\nfrom pennylane.optimize import GradientDescentOptimizer\
    \ as GDO\n\ndevice = qganPenny.device('default.qubit', wires=3)\n\ndef GetQGANReal(phi,\
    \ theta, omega):\n    qganPenny.Rot(phi, theta, omega, wires=0)\n\ndef GetQGANGenerator(wireArray):\n\
    \    qganPenny.RX(wireArray[0], wires=0)\n    qganPenny.RX(wireArray[1], wires=1)\n\
    \    qganPenny.RY(wireArray[2], wires=0)\n    qganPenny.RY(wireArray[3], wires=1)\n\
    \    qganPenny.RZ(wireArray[4], wires=0)\n    qganPenny.RZ(wireArray[5], wires=1)\n\
    \    qganPenny.CNOT(wires=[0,1])\n    qganPenny.RX(wireArray[6], wires=0)\n  \
    \  qganPenny.RY(wireArray[7], wires=0)\n    qganPenny.RZ(wireArray[8], wires=0)\n\
    \ndef GetQGANDiscriminator(wireArray):\n    qganPenny.RX(wireArray[0], wires=0)\n\
    \    qganPenny.RX(wireArray[1], wires=2)\n    qganPenny.RY(wireArray[2], wires=0)\n\
    \    qganPenny.RY(wireArray[3], wires=2)\n    qganPenny.RZ(wireArray[4], wires=0)\n\
    \    qganPenny.RZ(wireArray[5], wires=2)\n    qganPenny.CNOT(wires=[1,2])\n  \
    \  qganPenny.RX(wireArray[6], wires=2)\n    qganPenny.RY(wireArray[7], wires=2)\n\
    \    qganPenny.RZ(wireArray[8], wires=2)\n\n@qganPenny.qnode(device)\ndef GetQGANRealDiscCircuit(phi,\
    \ theta, omega, discWeights):\n    GetQGANReal(phi, theta, omega)\n    GetQGANDiscriminator(discWeights)\n\
    \    return qganPenny.expval.PauliZ(2)\n\n@qganPenny.qnode(device)\ndef GetQGANDiscCircuit(genWeights,\
    \ discWeights):\n    GetQGANGenerator(genWeights)\n    GetQGANDiscriminator(discWeights)\n\
    \    return qganPenny.expval.PauliZ(2)\n\ndef GetQGANRealTrue(discWeights):\n\
    \    trueDiscriminatorOutput = GetQGANRealDiscCircuit(phi, theta, omega, discWeights)\n\
    \    probabilityRealTrue = (trueDiscriminatorOutput + 1) / 2\n    return probabilityRealTrue\n\
    \ndef GetQGANFakeTrue(genWeights, discWeights):\n    fakeDiscriminatorOutput =\
    \ GetQGANDiscCircuit(genWeights, discWeights)\n    probabilityFakeTrue = (fakeDiscriminatorOutput\
    \ + 1) / 2\n    return probabilityFakeTrue\n\ndef GetQGANDiscriminatorCost(discWeights):\n\
    \    cost = GetQGANFakeTrue(genWeights, discWeights) - GetQGANRealTrue(discWeights)\n\
    \    return cost\n\ndef GetQGANGeneratorCost(genWeights):\n    return -GetQGANFakeTrue(genWeights,\
    \ discWeights)\n\nphi = numcal.pi / 6\ntheta = numcal.pi / 2\nomega = numcal.pi\
    \ / 7\nnumcal.random.seed(0)\nepsValue = 1e-2\ngenWeights = numcal.array([numcal.pi]\
    \ + [0] * 8) + numcal.random.normal(scale=epsValue, size=[9])\ndiscWeights = numcal.random.normal(size=[9])\n\
    gdo = GDO(0.1)\n\nprint(\"Training the discriminator \")\nfor iteration in range(50):\n\
    \    discriminator_weights = gdo.step(GetQGANDiscriminatorCost, discWeights)\n\
    \    discriminator_cost = GetQGANDiscriminatorCost(discriminator_weights)\n  \
    \  if iteration % 5 == 0:\n        print(\"Iteration {}: discriminator cost =\
    \ {}\".format(iteration+1, discriminator_cost))\n        print(\" discriminator\
    \ - real true: \", GetQGANRealTrue(discWeights))\n        print(\"discriminator\
    \ - fake true: \", GetQGANFakeTrue(genWeights, discWeights))\n\nprint(\"Training\
    \ the generator.\")\nfor iteration in range(200):\n    generator_weights = gdo.step(GetQGANGeneratorCost,\
    \ genWeights)\n    generator_cost = -GetQGANGeneratorCost(generator_weights)\n\
    \    if iteration % 5 == 0:\n        print(\"Iteration num {}: generator cost\
    \ is = {}\".format(iteration, generator_cost))\n        print(\"discriminator\
    \ - real true: \", GetQGANRealTrue(discWeights))\n        print(\"discriminator\
    \ -  fake true: \", GetQGANFakeTrue(genWeights, discWeights))\n        print(\"\
    Cost is: \", GetQGANDiscriminatorCost(discriminator_weights))\n```\n\n### Command\n\
    \n```bash\npip3 install numpy\npip3 install pennylane\npython3 qgan.py\n```\n\n\
