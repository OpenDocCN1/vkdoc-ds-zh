    The iris data set that was discussed in the previous chapter can be clustered
    into three different groups (setosa, versicolor, virginica) based on the petal
    and sepal''s width and height. The k-medians clustering algorithm has an accuracy
    of 90 percent in clustering the data points to the setosa, versicolor, and virginica
    groups.


    Let''s look at quantum k-medians in detail.


    ## Quantum K-Medians


    The quantum k-medians technique is the computation of the cluster centroids in
    a cluster group by using the median of the data points. A median is computed based
    on the minimal distance from all the data points. The technique is related to
    minimizing the sum of the distance between a point and the median of the data
    set. The minimization of the distance is computed based on a quantum minimization
    algorithm using Grover''s search. The Euclidean distance between the points is
    used as the distance algorithm.


    The steps for the pseudo-algorithm are shown here:


    1.  The input is the `k` cluster groups and input data points.

    2.  Initialize the `k` centroids randomly based on the median of the data points.

    3.  All the input data points are iterated to identify the cluster group to them.

    4.  The quantum interference circuit is computed.

    5.  The interference probabilities are filtered.

    6.  The high probability centroids are added into the dictionary.

    7.  The previous three methods are computed for the set of data points.


    **Tip**


    Grover''s search algorithm uses a unitary oracle function to create a superposition
    state based on a function `f(x)`.


    Now let''s look at the classical clustering algorithm.


    ## Classical Clustering


    Classical clustering techniques are used to separate the input data into multiple
    groups based on a set of features. A group will have data points that have commonality.
    Multiple groups are created to handle different data points. This is based on
    unsupervised machine learning techniques. Clustering identifies patterns and features
    in a group of unlabeled input data.


    These are the different types of classical clustering techniques:


    *   Partition based

    *   Hierarchical

    *   Density based

    *   Grid based

    *   Model based


    The classical clustering technique is used in image processing, computational
    life sciences, healthcare, and economics applications. See Figure [10-8](#490826_1_En_10_Chapter.xhtml#Fig8).


