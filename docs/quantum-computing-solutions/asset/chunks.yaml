    \n# 第二部分 量子计算基础\n\n# 3. 量子子系统与性质\n\n## 引言\n\n> *量子力学数学非常精确地描述了我们的宇宙是如何运作的。*\n\
    > \n> —安东尼·加勒特·利西\n\n本章涵盖量子子系统及其性质。详细讨论了单量子比特系统和多量子比特系统。本章还介绍了量子态、协议、操作和变换。\n\n\
    量子计算机处理与现实问题相关的信息，并利用量子力学解决这些问题。经典计算机使用要么是`0`要么是`1`的比特。由于它基于经典计算机导线中的电流，我们必须选择这些选项之一。量子单元基于量子叠加原理，其中`0`和`1`是叠加的。这开启了无限的可能状态，这些状态基于`0`和`1`及其在连续范围内的权重。在经典计算机中，基于十进制系统的值被转换为二进制数。类似地，量子单元使用二维希尔伯特空间来定义。见图\
    \ 3-1。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig1_HTML.jpg](img/490826_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1 经典比特与量子比特\n\n## 初始设置\n\n你需要设置 Python 3.5 来运行本章中的代码示例。你可以从 [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
    \ 下载它。\n\n## 单量子比特系统\n\n量子比特是量子计算框架的基础。通过使用量子比特（*量子位*），量子计算机的性能优于经典计算机。量子计算机将信息存储在量子比特中。一个量子比特代表一个量子粒子，比如一个电子，其电荷可以是`0`或`1`，也可以是`0`和`1`同时存在。布洛赫球面用于显示量子比特状态的位置。该球面半径为一个单位。希尔伯特空间用于对球面表面进行建模。希尔伯特空间与向量空间中向量的内积有关。长度和角度测量在内积中显示。见图\
    \ 3-2。\n\n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig2_HTML.jpg](img/490826_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-2 布洛赫球面\n\n现在让我们看一个演示单量子比特系统的 Python 代码示例。\n"
