    classical sorting methods. In space-bounded sorting, quantum sorting methods are
    better than the classical ones, as shown in Figure [7-6](#490826_1_En_7_Chapter.xhtml#Fig6).
    Quantum algorithms help in modeling complex problems using quantum bits; when
