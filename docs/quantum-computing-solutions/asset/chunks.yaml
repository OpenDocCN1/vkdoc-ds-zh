  trans: '

    ### 密码学


    银行将热衷于保护其支付网关和解决方案，使其免受未来量子计算能力带来的安全威胁。需要使支付解决方案具备“抗量子”能力。此外，基于区块链的银行和金融解决方案也需要通过使用后量子密码算法来改进。


    抗量子账本是面向银行和金融服务的下一代解决方案。量子密码学基于量子密钥分发。量子密钥分发涉及将一个共享的短密钥扩展为无限的共享密钥流。这要求提高后量子密码算法的效率。


    金融公司需要开始投资于后量子密码学。如果基于区块链的解决方案未升级到后量子密码算法，它们将不具备抗量子能力。目前正在运行的密码系统包括 `DES`、`Triple
    DES`、`AES`、`RSA`、`Merkle hash-tree signatures`、`Merkle–Hellman knapsack encryption`、`Buchmann–Williams
    class-group encryption`、`ECDSA`、`HFEv-` 等（见图 1-12）。这些系统将在量子算法和计算能力面前失效。`Shor’s
    algorithm` 是一种量子算法，威胁着 `RSA`、`DSA` 和 `ECDSA` 密码算法。


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig12_HTML.jpg](img/490826_1_En_1_Fig12_HTML.jpg)


    图 1-12 — 密码学模型


    基于量子计算机的算法可以通过密钥大小的平方根因子来破解对称密钥密码算法。要找到 256 位哈希函数的原像，量子算法只需花费 `2¹²⁸` 时间。`Shor’s
    algorithm` 有助于大数的量子因子分解。这要求安全系统具备抗量子能力。椭圆曲线密码学已被证明可将破解过程提升 21%。该方法基于多项式乘法并添加随机噪声。


    量子算法优于经典算法，因为它们可以在更快的硬件上执行。量子算法也基于量子力学。理论上，量子力学方法已被证明比经典方法更快。量子力学涉及复杂的亚原子粒子相互作用。亚原子粒子可以是电子。电子可以同时存在于多个离散状态中，这被称为*叠加态*。


    海森堡不确定性原理指出，量子系统包含关于物体速度和位置的信息。任何对速度的测量都会影响位置，因为观察行为会改变状态。亚原子粒子可以处于纠缠态。当一个粒子发生变化时，即使它们彼此分离，也会影响另一个粒子。量子力学使用复数来捕捉电子状态的复杂性。


    `Grover’s algorithm` 可以解决电话簿搜索问题，其步数级别与电话簿号码数的平方根成正比（`O(√n)` 时间）。假设一个电话簿有 1 亿个电话号码。`Grover’s
    algorithm` 可以用 10,000 步找到一个号码。`Grover’s quantum algorithm` 使用基于量子力学的方法来加速搜索。


    ### 优化


    优化问题存在于我们日常生活的不同领域，例如金融、银行、医疗保健、物流和汽车行业。在财富管理中，投资组合选择基于寻找最佳资产以平衡风险与预期收益。投资组合选择是一个
    NP 难问题。NP 难问题对于当前计算机来说是一个难以快速求解但不是不可能的问题。量子退火是一种用于解决这些 NP 难问题的量子算法。


    在退火方法中，问题被编码成一个类似的物理问题。系统的最低能量状态与待解决问题的解相同。此系统在退火器中构建，并向最低能量状态演化。在现实中，退火器通过冷却过程达到最低能量。在量子退火中，隧道效应使系统迅速移动到最低点。见图
    1-13。


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig13_HTML.jpg](img/490826_1_En_1_Fig13_HTML.jpg)


    图 1-13 — 量子退火过程


    量子退火技术有助于寻找最优交易路径。大量交易订单被执行，这会影响到资产价格。在执行交易时需要考虑执行成本。算法需要为大额订单设定交易速率。这有助于平衡交易速度，最小化市场风险敞口，并最小化对市场的影响。


    另一个领域是优化套利机会。套利是利用不同资产价格的差异以较低风险获取利润。典型的例子通常涉及将欧元兑换成美元、美元兑换成日元、日元兑换回欧元。由于价格差异，这种交易可能会产生少量利润。这被称为*跨币种套利*。在不同市场的资产中寻找最优套利机会是一个
    NP 难问题。量子退火方法有助于找到成本最低的路径。


    信用评分是另一个可以使用量子退火解决的领域。个人的信用评分与个人的收入、年龄、财务历史、抵押品和当前负债相关。风险评估会考察客户档案中的各种因素。这是一个计算上具有挑战性的问题，属于
    NP 难问题。


    车辆路径问题是另一个可以使用量子退火解决的优化问题。Dantzig 和 Ramser 于 1959 年提出了车辆路径问题。优化的目标是为服务于客户订单的一组车辆确定最优路线。解决方案是确定从起点到终点交付订单所涉及的一组路线。客户订单所需的车辆数量也是一个优化目标。量子退火是一种用于在一组给定的候选函数中确定局部最小路径的优化技术。这是一种将具有许多局部最小值的函数离散化以确定函数可观测量的方法。量子退火过程不同于模拟退火，因为它基于量子隧道效应。粒子通过能量屏障从高能态隧穿到低能态。


    量子退火从一个系统不同状态的等权重叠加开始。含时薛定谔方程驱动系统随时间演化。随着时间增加，该系统会影响所有状态的振幅。最终，系统达到基态，即系统的瞬时哈密顿量。

