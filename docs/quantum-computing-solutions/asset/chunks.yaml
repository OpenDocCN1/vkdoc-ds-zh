    \ solutions in which different quantum techniques are applied. The distribution\
    \ planning solution was presented in detail with code samples.\n\n# 13. Evolving\
    \ Quantum Solutions\n\n## Introduction\n\n> “Quantum mechanics broke the mold\
    \ of the previous framework, classical mechanics, by establishing that the predictions\
    \ of science are necessarily probabilistic.”\n> \n> —Brian Greene\n\nThis chapter\
    \ covers the topic of evolving quantum solutions. You will see how quantum AI\
    \ algorithms are implemented in different real-life solutions. The solutions covered\
    \ in this chapter are related to quantum annealing, quantum key distribution,\
    \ and quantum teleportation.\n\n## Initial Setup\n\nYou need to set up Python\
    \ 3.5 to run the code samples in this chapter. You can download it from [https://www.python.org/downloads/release/python-350/](https://www.python.org/downloads/release/python-350/).\n\
    \n## Quantum Annealing\n\nThe quantum annealing process is related to computing\
    \ real-life problems with low-energy solutions. Quantum bits represent the energy\
    \ state of the superconducting loops that have low value. The quantum processing\
    \ unit consists of the superconducting loops. Every quantum bit reaches the superposition\
    \ state after the quantum annealing process is over. The superposition state value\
    \ can be 0 or 1. During the quantum annealing process, energy moves from the minimum\
    \ value to a higher value, creating a valley, and the energy diagram looks like\
    \ a double well with two valleys (see Figure 13-1).\n\n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig1_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig1_HTML.jpg)\
    \  \nFigure 13-1: Quantum annealing\n\nThe probability of the quantum bit having\
    \ a zero or one state is the same. This can be modified by creating the external\
    \ magnetic field to the quantum bit. The double well with two valleys is created\
    \ by the field in inverse form. The bias is related to the quantitative value\
    \ of the external magnetic field. A coupler is used to connect the quantum bit\
    \ to the bias. (See Figure 13-2.)\n\n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig2_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig2_HTML.jpg)\
    \  \nFigure 13-2: Qubit wise controlled field\n\nEvery quantum bit has a bias.\
    \ The quantum bits are impacted with couplers. Bias and coupler values can be\
    \ selected by the user for every problem. The energy landscape consists of the\
    \ biases and couplings in the quantum annealing process.\n\n> **Tip**  \n> Quantum\
    \ annealing was created by Tadashi Kadowaki and Hidetoshi Nishimori in 1998."
