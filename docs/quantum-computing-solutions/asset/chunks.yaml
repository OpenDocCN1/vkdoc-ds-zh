- fmt: "### Cybersecurity\n\nThere are new applications in the post-quantum security\
    \ area that operate on data at rest, in transit, in use, and in motion. These\
    \ solutions work on data access, business processes, multiparty authentication,\
    \ and multiparty authorization. These products are based on the algorithms and\
    \ techniques to tackle man-in-middle detection, quantum security encryption, phishing\
    \ resistance, biometric security, accountability, and segregation of duties. See\
    \ Figure [1-14](#490826_1_En_1_Chapter.xhtml#Fig14).\n\n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig14_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig14_HTML.jpg)\n\
    \n**Figure 1-14** Data in use/rest/transit/motion\n\nData at rest can be intercepted\
    \ and misused by an insider and an external hacker. Data in transit can be modified\
    \ by the hackers for misuse in the networks. Confidential business data and personally\
    \ identifiable information are the use cases for data in transit. Mission-critical\
    \ data cannot be secured by using role-based access and controls. Data governance\
    \ is needed in an enterprise to protect and secure the data.\n\nCybersecurity\
    \ solutions are related to encrypt, decrypt, sign, and verify customer transactions\
    \ and data. A hacker can intercept and steal the secured data. Secured data has\
    \ information related to the customer’s credit card numbers and Social Security\
    \ numbers. Using a quantum computer, the hacker has a higher computational power.\
    \ Quantum algorithms like `Shor’s` are proven to break the current cryptographic\
    \ systems. The post-quantum cryptographic designers are improving the efficiency\
    \ of the new encryption and decryption algorithms. Hybrid systems and high-speed\
    \ quantum-resistant algorithms are required to strengthen post-quantum cryptography\
    \ algorithms. `McEliece` public-key encryption, `NTRU` public-key encryption,\
    \ and lattice-based public key encryption systems are proven to be quantum-resistant.\n\
    \n## Summary\n\nIn this chapter, we looked at different solutions in cryptography,\
    \ optimization, and cybersecurity and how quantum computing is applied and solutions\
    \ are developed.\n\n# 2. Mathematics Behind Quantum Computing\n\n## Introduction\n\
    \n> *Mathematics is the language in which the gods speak to people.*\n> \n> —Plato\n\
    \nIn this chapter, we cover the mathematical concepts related to quantum computing.\
    \ We look at quantum operators, sets, vectors, matrices, and tensors.\n\n## Initial\
    \ Setup\n\nYou need to set up `Python 3.5` to run the code samples in this chapter.\
    \ You can download it from [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/).\n\
    \n## Quantum Operators\n\nBinary form numbers are used to model gates for a classical\
    \ computer. Quantum mechanical principles are used for modeling the quantum gates\
    \ and quantum operations for a quantum computer.\n\nTo start, let’s look at a\
    \ Hilbert space (say `H`). A Hilbert space is a vector space consisting of an\
    \ inner product of the vectors. These vectors are the unit vectors. They represent\
    \ the states of the system.\n\nFigure [2-1](#490826_1_En_2_Chapter.xhtml#Fig1)\
    \ defines the inner product of two vectors `z` and `u`. The vector is defined\
    \ on the Hilbert space, and `z^*` is a complex conjugate of `z`. An orthonormal\
    \ basis is defined on a Hilbert space. A two-spin quantum system is represented\
    \ by states that are two orthonormal basis. An orthonormal set of vectors `N`\
    \ in `H` has elements of space `N` where each element is a unit vector and any\
    \ two unique elements are orthogonal.\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig1_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig1_HTML.jpg)\n\
    \n**Figure 2-1** Inner product\n\nLet’s look at the Dirac notation to represent\
    \ the basis states of a quantum system; see Figure [2-2](#490826_1_En_2_Chapter.xhtml#Fig2).\
    \ The Dirac notation is better than vector-based Heisenberg notation that is used\
    \ in computer calculations.\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig2_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig2_HTML.jpg)\n\
    \n**Figure 2-2** Dirac notation\n\nNow, let’s look at Kronecker’s product; see\
    \ Figure [2-3](#490826_1_En_2_Chapter.xhtml#Fig3). Kronecker’s product is related\
    \ to the combination of quantum bits. This is used to calculate the product of\
    \ quantum bits in a multiquantum bit system.\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig3_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig3_HTML.jpg)\n\
    \n**Figure 2-3** Kronecker’s product\n\nLet’s look at the quantum gates used for\
    \ the quantum logic and circuit design. To start, let’s talk about digital circuits\
    \ and traditional digital gates. Digital circuits are classified as sequential\
    \ and combinational circuits. Sequential circuits are circuits that have the same\
    \ state of the system, and the input/output of the system is a function of time.\
    \ Combinational circuits are based on the circuit whose output depends on the\
    \ input only. `MUX`, `DEMUX`, encoder, and decoder are good examples of combinational\
    \ circuit-based applications.\n\nMemory registers are used for storing and processing\
    \ the data. The traditional digital gates used for these circuits are mentioned\
    \ here:\n\n*   **AND gate**: AND operation\n*   **OR gate**: OR operation\n* \
    \  **NOR gate**: Inverse of OR operation\n*   **NAND gate**: Inverse of AND operation\n\
    *   **XOR gate**: Exclusive-OR operation\n*   **XNOR gate**: Inverse of the exclusive-OR\
    \ operation\n*   **NOT gate**: INVERSION operation\n\nA classic computer is based\
    \ on the arithmetic logic unit (`ALU`) and the controller. The controller controls\
    \ the instruction flow and the execution of any instruction steps in the cycle.\
    \ An `ALU` is based on a digital circuit. The `ALU` is used to execute mathematical\
    \ and logic operations. The central processing unit has an `ALU` and a control\
    \ unit (`CU`). See Figure [2-4](#490826_1_En_2_Chapter.xhtml#Fig4).\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig4_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig4_HTML.jpg)\n\
    \n**Figure 2-4** Digital circuit\n\nA quantum computer will have a quantum processing\
    \ unit and quantum circuit for processing information. The quantum circuit has\
    \ a set of quantum gates. The quantum gates are used to modify quantum bits. Quantum\
    \ gates are used to show the evolution of the quantum states of the quantum bits\
    \ over time. The quantum state of the quantum bit changes at the output of the\
    \ quantum gate. Quantum Computers follow the principles of preserving norms and\
    \ reversibility. Preserving the norm specifies that the sum of normal squared\
    \ probability amplitudes should be equal to the state after the application of\
    \ the gate. The evolution of the quantum state, which is not measured, is related\
    \ to reversibility.\n\n> **Note**"
