  trans: "\n一个*量子处理单元*是一个量子芯片，相当于经典中央处理器。一个量子芯片由 QPU、控制单元和其他组件构成。芯片中的量子比特数量与数字电路的量子电路组件有关。\n\
    \n量子运算符基于运用量子力学原理的数学函数。它们作用于量子态，而量子态由向量和张量表示。请参见图 2-5。\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig5_HTML.jpg](img/490826_1_En_2_Fig5_HTML.jpg)\n\
    \n图 2-5\n\n量子运算符\n\n量子门可分为 Hadamard 门、相移门以及受控门和不受控门。举例来说，量子门可以是 `X`、`Y`、`Z`、`Rx`、`Ry`、`Rz`、`S`、`T`、`CNOT`、`Toffoli`、`Swap`\
    \ 和受控相移门。\n\n以下是量子门的完整列表：\n\n- Pauli 门\n  - `I`、`X`、`Y`、`Z`\n- Hadamard 门 `H`\n\
    - 相位门\n  - `PHASE(theta)`、`S`、`T`\n- 受控相位门\n  - `CZ`\n  - `CPhase00(alpha)`\n\
    \  - `CPhase01(alpha)`\n  - `CPhase10(alpha)`\n  - `CPhase(alpha)`\n- 笛卡尔旋转门\n\
    \  - `RX(theta)`\n  - `RY(theta)`\n  - `RZ(theta)`\n- 受控 X 门\n  - `CNOT`\n  -\
    \ `CCNOT`\n- 交换门\n  - `SWAP`\n  - `CSWAP`\n  - `ISWAP`\n  - `PSWAP(alpha)`\n\n\
    布洛赫球用于表示量子比特态以及该态经过量子门变换后的结果。旋转发生在三维空间中围绕 x 轴、y 轴和 z 轴。请参见图 2-6。\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig6_HTML.jpg](img/490826_1_En_2_Fig6_HTML.jpg)\n\
    \n图 2-6\n\n布洛赫球\n\n表 2-1 列出了布洛赫球上每个量子门及其相关的量子态变换。\n\n表 2-1\n\n量子门变换\n\n| 量子门 |\
    \ 量子态变换 |\n| --- | --- |\n| `X` | 在布洛赫球上绕 x 轴旋转 180 度 |\n| `Y` | 在布洛赫球上绕 y 轴旋转\
    \ 180 度 |\n| `Z` | 在布洛赫球上绕 z 轴旋转 180 度 |\n| `H` | `H` 门将 `X` 映射到 `Z`，将 `Z` 映射到\
    \ `X` |\n| `I` | 单位门 |\n| `S` | `S` 门将 `X` 映射到 `Y` |\n| `S`† | `S` 门的逆将 `X` 映射到\
    \ `-Y`，绕 z 轴旋转 -180 度 |\n| `T` | 绕 z 轴旋转 90 度 |\n| `T`† | 绕 z 轴旋转 -90 度 |\n| `Toffoli`\
    \ | 受控 CNOT 门 |\n| `Swap` | 交换量子比特的状态 |\n| `NOT` | 经典非运算 |\n| `CNOT` | 对目标量子比特执行\
    \ Pauli `X` 门操作，不改变控制量子比特 |\n| `Rx` | 绕 x 轴旋转 theta 度 |\n| `Ry` | 绕 y 轴旋转 theta\
    \ 度 |\n| `Rz` | 绕 z 轴旋转 theta 度 |\n| `X90` | 绕 x 轴旋转 -90 度 |\n| `Y90` | 绕 y 轴旋转\
    \ 90 度 |\n| `mX90` | 绕 x 轴旋转 -90 度 |\n| `mY90` | 绕 y 轴旋转 -90 度 |\n| `CZ` | Cphase\
    \ 门 |\n| `CRk` | 参数化的受控相移，角度为 `Pi/2k` 度 |\n| `CR` | 受控相移，角度为 theta 度 |\n\n现在让我们看一个\
    \ Python 代码示例，展示量子运算中的 Hadamard 门、Swap 门和 Identity 门。\n\n### 代码示例\n\n**`quantum_operations.py`**\n\
    \n```python\nimport numpy as nump\ndef multi_quantum_state(*args):\nret = nump.array([[1.0]])\n\
    for q in args:\nret = nump.kron(ret, q)\nreturn ret\nzero_quantum_state = nump.array([[1.0],\
    \ [0.0]])\none_quantum_state = nump.array([[0.0], [1.0]])\nHadmard_quantum_gate\
