- fmt: '## Best Practices


    The best practices presented in this section are specific to quantum computing
    frameworks. To start with, a quantum circuit is built by designing it for the
    specific issue or pain point at hand. The trials are conducted by executing them
    on different simulators on the server. The results are collated, and stats are
    gathered at the summary level. The trial results are visualized using software
    tools.


    A software framework related to quantum computing will have package imports, a
    variables initialization API, a gates modification SDK, a circuit visualizer,
    a trial simulator, and the results visualizer. As you know, quantum computation
    is based on quantum bits. Classical computation operates on bits. Quantum bits
    represent the quantum particle state values. The superimposition state is related
    to quantum bits having multiple values at the same time. Entanglement is the relation
    of two quantum bits and their values modification.


    Let’s look at the quantum computational frameworks.


    First, the `Strawberry Fields` framework is used to create programs related to
    graphs and networks. The framework has support for machine learning features and
    is used for real-life chemistry problems. Second, `Cirq`, which was developed
    by Google, is used to create quantum circuits and simulate real-life problems
    on those circuits. `Cirq` has features related to interoperable functions. Another
    framework, the `TensorFlow Quantum` framework, has features for machine learning.
    You can easily enhance current `TensorFlow` apps for quantum-based solutions.
    The `TensorFlow Quantum` framework uses hybrid quantum classical methods and techniques
    such as quantum convolutional neural networks. The Microsoft `Q#` language helps
    to create applications using the `F#` and `C#` libraries. Finally, `Qiskit`, which
    is an IBM-based framework, helps to create pipelines and quantum circuits for
    simulating real-life apps.


    Let’s look at best practices for creating quantum computing libraries.


    - The libraries need to expose APIs that focus on real-life apps using quantum
    computing models. The functions and methods are created for the algorithms and
    methods implemented from quantum computing techniques.

    - The libraries are designed based on important use cases first to ensure that
    the SDKs are simple and easy to use. Different components in the SDKs handle different
    use cases. Examples are created for the usage of each component.

    - Libraries need to be created for forward compatibility. The old SDKs are deprecated
    to avoid issues of compatibility. Shim operations and methods are given for deprecated
    methods.

    - Libraries need to have a goal and purpose for every method and operation.

    - Libraries can have classical deterministic methods as methods.

    - Libraries need to have methods and operations that are reusable.

    - The parameters of the methods and functions need to be selected based on the
    input and output parameters for an algorithm or a method.

    - Libraries need to have namespace names that help the developer to understand
    the usage of methods, operations, and types.


    ## Case Studies


    Intel, IBM, Microsoft, and Google have started research on quantum algorithms.
    Specifically, IBM, Intel, and Google are focusing on quantum computers. The quantum
    algorithms research areas include machine learning and artificial intelligence
    techniques and methods. Voice assistants, digital assistants, and chatbots can
    use quantum NLP algorithms to improve the efficiency and speed of input processing.
    Quantum computers can help in pharma drug design, material sciences, molecule
    modeling, and logistics optimization. The key areas where AI can be blended with
    quantum machine learning are supervised learning, support vector machines, and
    neural networks.


    Quantum algorithms and quantum computers will be used in complex real-life scenarios.
    Classical computers will be continued to be used in the areas of process automation,
    routine task execution, and simple algorithms. Quantum computers will be used
    in areas such as quantum simulation, optimization, quantum artificial intelligence,
    and quantum cryptography. They will be used across different verticals such as
    pharma, cybersecurity, finance, materials science, and telecom.


    Now let’s consider different applications where quantum computing is being applied.


    ### Applications


    These are the areas where apps are being developed:


    - Quantum machine learning

    - Computational chemistry

    - Financial portfolio optimization

    - Logistics and scheduling

    - Drug design

    - Cybersecurity

    - Quantum cryptography

    - Circuit, software, and system fault simulation


    Quantum computers can solve real-life problems in seconds compared to the hours
    that it would take a classical supercomputer. In the area of financial services,
    different portfolios can be simulated. In daily life, customers make financial
    investments, and the investment returns are not predictable. They might need some
    advice to get better returns. A quantum AI simulator is a working system based
    on quantum artificial intelligence. Quantum computers can help to simulate customer
    financial portfolios based on the risk strategy of the customer for predicting
    returns.'
