  trans: '

    ### 交通管理


    交通领域中的交通建模依赖于交通区域、出行表格、高速公路网络、车辆容量以及土地利用模型。土地利用模型包含趋势、土地利用与分区规划、活动区域以及地图。一个交通系统涵盖街道、高速公路、停车设施、出行时间以及限速要求。交通网络将具有交通流量和车辆容量。出行模式指明了使用方式、典型的起点到终点路径以及出行特征。沃德罗普第一原理基于网络和道路使用者平衡。所有使用中的路径的行程时间相等，且比未使用的路径少一辆车的时间。该原理有助于最小化单次出行的平均时间。还存在其他原理和算法来平衡道路使用者与网络交通流量。参见图
    14-3。


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig3_HTML.jpg](img/490826_1_En_14_Fig3_HTML.jpg)


    图 14-3


    出行规划


    出行是基于起点、终点、车辆和城市交通网络生成的。该网络包含车辆、骑行者、行人，他们在不同的时区和空间中持续移动。交通规划是一项持续的活动，街道网络基础设施也在不断更新。交通建模通过仿真和机器学习等技术完成。交通控制则利用历史数据、估算一段时间内的车辆数量，并管理整个网络中的交通流量。


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig4_HTML.jpg](img/490826_1_En_14_Fig4_HTML.jpg)


    图 14-4


    交通规划


    最大流-最小割方法被用于最大化交通网络中的车流量。这种方法基于从起点到终点的最大交通流量，等同于将起点与终点分离的最小割。该方法也可应用于计算机网络的数据包流量。


    通过网络的数据包流量可以使用最大流-最小割方法进行建模。网络中，信息流经各个节点到达目的地。目标是最大化能够流经计算机网络的数据包数量。类似地，这种方法也可以用于为大学生分配宿舍，前提是每个学生都希望住到自己选择的宿舍中。目标是最大化获得宿舍的学生人数。


    在其他垂直领域，量子算法和技术被用于预测分析。在医疗保健领域，量子退火方法有助于优化蛋白质折叠和药物发现中的非不良效应。其他领域包括药物设计和个性化医疗。在制造业中，量子计算技术可用于解决供应链优化问题。典型问题涉及分销、生产、采购和物流。在媒体行业，量子方法被应用于安排广告和优化收入。


    让我们来看一下在智慧城市中实现的量子算法和技术。


    ### 智慧城市


    智慧城市中的问题包括大数据处理，并需要实时分析与决策。一个城市包含汽车（自动驾驶和人工驾驶）、卡车、三轮车、公交车以及其他交通工具。交通信号灯位于城市的不同街道上。每条街道的交通历史数据可用于规划工作日和周末不同出行时间的行程。智慧城市交通管理和驾驶规划解决方案帮助市民规划行程。


    现在，让我们来看一下量子计算和算法的局限性。


    ### 量子计算的局限性


    量子计算硬件存在振动以及辐射、光和其他因素等外部交互的问题。退相干与在不同点测量状态并导致量子态坍缩有关。退相干的概率随着量子比特数量的增加呈指数级增长。相位误差由使用量子方法引入。经典方法可以通过使用纠错方法来导致小误差。测试是一个问题，因为无法创建未知状态的多个副本。量子计算方法需要叠加态，但可以实现一个现实模型，因为叠加需要降低系统熵。


    ## 量子计算新闻来源


    以下是有关量子计算的新闻来源：


    *   *IBM 研究博客*: [`https://www.ibm.com/blogs/research/category/quantcomp/`](https://www.ibm.com/blogs/research/category/quantcomp/)

    *   *微软量子*: [`https://cloudblogs.microsoft.com/quantum/`](https://cloudblogs.microsoft.com/quantum/)

    *   *滑铁卢研究所量子博客*: [`https://uwaterloo.ca/institute-for-quantum-computing/news`](https://uwaterloo.ca/institute-for-quantum-computing/news)

    *   *ACM SIGARCH*: [`https://www.sigarch.org/tag/quantum-computing/`](https://www.sigarch.org/tag/quantum-computing/)

    *   *量子比特报告*: [`https://qubitreport.com/`](https://qubitreport.com/)


    现在，让我们来看一下量子软件及其未来。

    '
- fmt: '## The Future of Quantumware


    The quantum bits on a quantum processing unit are increasing and have been doubling
    every year for the past ten years. The goal of different companies such as `IBM`
    is to scale the manufacturing process to create quantum processing units of size
    `10,000`. Quantum computers are being used by `Google`, `IBM`, `Microsoft`, and
    `NASA` in their research and company IT infrastructure.


    According to the CEO of the D-Wave company, Vern Brownell：


    > `Google` has created what they call the Quantum Artificial Intelligence Lab，
    where they’re exploring using our computer for AI applications or learning applications.
    And `NASA` has a whole set of problems that they’re investigating， ranging from
    doing things like looking for exoplanets to [solving] logistic problems and things
    like that. I’d say within five years， it’s going to be a technology that will
    be very much in use in all sorts of businesses. While business applications within
    quantum computing are mostly hopeful theories， there’s one area where experts
    agree quantum could be valuable： optimization. Using quantum computing to create
    a program that “thinks” through how to make business operations faster， smarter
    and cheaper could revolutionize countless industries.


    Quantum AI is related to learning models inspired by a biological brain and quantum
    mechanics. These models are based on mathematical operations on quantum bits that
    are used for solving real-life problems. Distributed systems and parallelized
    architecture–based systems are used for running these algorithms and models. As
    a quantum bit can handle multiple states such as `0` and `1`, huge problems can
    be solved in a short time with `n` qubits.


    Heisenberg’s uncertainty principle uses information about the particle’s momentum
    and location. Any observation for calculating the location will cause an error
    in the momentum of the particle. Similarly， any calculation of the momentum causes
    an error in the location. Quantum AI algorithms are based on the set of the transformation
    of quantum bits. The computation does not measure the state of the system that
    causes an error in the information. A single quantum algorithm cannot find all
    solutions to an NP-complete problem. The structure of the problem in the context
    is used as a basis for solving the NP-complete problem.


    Quantum AI cannot help to change routine office tasks such as reading， writing，
    and mathematical calculations. A quantum computer will not be useful when reading
    big data， writing reports， or performing mathematical calculations. The sequential
    operations in an enterprise will require a classical computer. Complex algorithms
    will be executed on the quantum computer in an organization going forward.


    Classical computers and servers will be used for a standard set of processes that
    have manual and automated operations. These operations might be related to validation，
    checking， workflow， communication， notification， data gathering， and data storage.
    Data streaming and a push model will require standard computers that gather data
    and stream them to various subscribed parties.


    ### Enterprise Software and Services for Quantum Computing


    In enterprise software and services， solutions related to chemical， pharma， and
    manufacturing are evolving. Drug discovery and the reduction of research and development
    are the key areas in pharma for applying quantum techniques and methods. Quantum
    software is being developed to solve real-life optimization problems. The other
    area of application is autonomous driving. Cybersecurity/cryptography is another
    area where quantum software and solutions are evolving.


    ### Quantum Machine Learning


    Quantum machine learning (QML) is another area where new solutions and products
    are evolving.


    ## Summary


    In this chapter， we looked at the next steps for quantum techniques to be used
    to create quantum solutions in real life.'
