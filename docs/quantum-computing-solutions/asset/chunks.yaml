  trans: "\n# 现实问题与解决方案\n\n量子解决方案涉及构建量子算法，以改进量子计算、人工智能、数据科学和机器学习领域的计算任务。与量子计算机的创新相比，量子解决方案的发展正在加速。在本章中，我们将探讨各种解决方案，例如优化问题、量子密码学和网络安全。本章将解释涉及\
    \ AI 算法的量子解决方案及其在不同领域的应用。本书的其他章节将提供代码示例，这些示例将基于现实问题，例如银行业的风险评估和欺诈检测。在制药领域，我们将探讨药物发现和蛋白质折叠解决方案。在制造业领域，将介绍供应链优化和采购解决方案。在公用事业行业，将详细解释能源分配和优化问题及其解决方案。在媒体和科技领域，将涵盖广告排期和收入优化解决方案。\n\
    \n量子机器学习正在应用的领域包括纳米粒子、材料发现、化学设计、药物设计、模式识别和分类。适用的用例包括创建可应用于太空技术、可穿戴技术、可再生能源、纳米技术、新药物和化学组合、遗传科学、生物识别、物联网设备和宇宙发现的新材料。\n\
    \n> **注意**  \n> 罗斯定律指出，量子计算机的计算能力每 12 个月翻一番，而摩尔定律的翻倍周期是 18 个月。\n\n> *“量子计算机有潜力解决那些让经典计算机计算时间超过宇宙年龄的问题。”*\
    \  \n> ——大卫·多伊奇，牛津大学教授\n\n巴克莱银行、高盛集团等金融机构正在研究量子计算在投资组合优化、资产定价、资本项目预算和数据安全等领域的潜在应用。在航空航天领域，空客公司正在探索其在通信和密码学方面的应用。\n\
    \n洛克希德·马丁公司正在研究如何验证和确认复杂系统。美国海军计划开发用于优化问题的算法，例如与水下自主机器人相关的数据存储和高能效数据检索。NASA 正在探索其在通信、分布式导航和系统诊断方面的应用。阿里巴巴、谷歌和\
    \ IBM 等科技公司正在致力于抗黑客密码学、软件调试和机器学习等应用。生命科学公司正在寻求量子计算在个性化医疗和药物发现中的应用。\n\n以下列表展示了来自不同领域的用例。这些用例证明，量子计算可以通过利用量子技术及其高性能处理特性来帮助人类生活。\n\
    \n- **经济与金融**（见图 1-3）\n  - 分析并模拟股票投资组合以辅助投资决策\n  - 更有效地进行实时欺诈检测和风险优化\n\n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig3_HTML.jpg](img/490826_1_En_1_Fig3_HTML.jpg)\n\
    *图 1-3 – 股票市场*\n\n- **医学**（见图 1-4）\n  - 医学科学的研究与开发（例如，分析通常规模庞大的 DNA 序列）\n  - 依赖于大量图像处理和分析的生物工程与远程医疗\n\
    \  - 更快、更准确地诊断癌症等危重疾病\n  - 大规模药物发现与生产\n\n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig4_HTML.jpg](img/490826_1_En_1_Fig4_HTML.jpg)\n\
    *图 1-4 – 医学科学*\n\n- **自然科学**（见图 1-5）\n  - 预测与时间序列分析\n  - 植物基因组分析\n  - 农业与种植应用\n\
    \n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig5_HTML.jpg](img/490826_1_En_1_Fig5_HTML.jpg)\n\
    *图 1-5 – 自然科学*\n\n- **信息技术**（见图 1-6）\n  - 大数据仓库的数据搜索与分析\n  - 对当前计算机而言过于复杂和耗时的软件测试与模拟\n\
    \n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig6_HTML.jpg](img/490826_1_En_1_Fig6_HTML.jpg)\n\
    *图 1-6 – 信息技术*\n\n- **管理优化**（见图 1-7）\n  - 供应链与采购（关于空间与成本效率、分销渠道、运输优化等方面的情景分析与决策）\n\
    \  - 资产与资源管理（用于节约成本和生命周期管理的概率建模）\n  - 普遍的分析能力，从而促成更具洞察力的决策过程\n\n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig7_HTML.jpg](img/490826_1_En_1_Fig7_HTML.jpg)\n\
    *图 1-7 – 优化*\n\n## 解决方案的优势\n\n量子解决方案的基础设施通常提供高度的自动化，并能显著提升性能和弹性。由量子计算框架驱动的平台通过持续学习和深度学习不断演进。在演进过程中，系统将成为一个自主且自给自足的平台。该平台将能够做出关键决策。\n\
    \n这种新的计算范式将改变软件的编写方式。该框架已从基础编程软件发展为模式和模型。这一范式将改变应用程序的部署和管理方式。这些解决方案基于以深度学习为基础的框架、量子计算平台以及一套新工具。这些量子解决方案框架将使组织能够创建、测试和部署新应用程序，而无需任何人工介入。开发周期将有助于利用深度学习和量子计算算法重建软件。\n\
    \n量子解决方案的基础设施需要具备高度可扩展性。量子解决方案平台需要高性能的计算能力，以便能够处理数据负载并保证服务保障和性能。当前的应用程序在毫秒级和每秒数百万次循环的级别上缺乏性能和相应的服务水平。高质量的量子解决方案将使用量子算法和量子\
    \ AI 技术构建。新的量子解决方案基础设施将利用 GPU 级别的计算能力与量子计算相结合。这种基础设施将利用开源软件和云来满足弹性的容量需求。\n\n>\
    \ **注意**  \n> 量子云由量子模拟器和处理应用程序组成。IBM、谷歌、Rigetti 和微软提供用于信息处理的量子云服务。\n\n量子解决方案基础设施将支持物联网。数据连接和实时洞察力是实时量子解决方案的重要因素。该解决方案基础设施将具备保护数据传输、数据摄取和数据处理的功能。数据将从各种数据源获取，以创建实时洞察。物联网解决方案的部署将包括所有连接的设备。政策和治理框架将成为量子解决方案的一部分。\n\
    \n量子解决方案基础设施需要是安全的。企业将拥有涉及基础设施网络安全的量子解决方案。需要对服务器进行监控，并且需要摄取、集成和存储安全数据以供分析。需要使用无监督学习来过滤安全和监控事件。威胁情报模型已经构建完成，并在服务器上部署了人员、地点和应用程序。通过事件仪表板可以预防威胁。\n"
- fmt: '# Automating Manual and Semi-manual Processes


    Quantum solutions involve the automation of business processes. Automation helps
    in enhancing the businesses and enterprises by changing the way they operate.
    Quantum solutions involve artificial intelligence, machine learning, robotic process
    automation, and business process automation methods. These show immediate benefits
    in enterprises. See Figure [1-8](#490826_1_En_1_Chapter.xhtml#Fig8).


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig8_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig8_HTML.jpg)

    *Figure 1-8: Process Automation*


    Handling big data is the biggest automation effort that quantum solutions can
    provide with their high-performant data processing capabilities. Human errors
    and problems arise when adding automation to the business processes. Predictive
    and prescriptive analytics are solutions that can add value to the enterprise
    business’s decision-making.


    The data comes from the different servers, applications, devices, and departments
    in a business organization. The data needs to be stored, cleaned, and analyzed
    for actionable decisions. Quantum solutions help in handling big data and creating
    dashboards and reports.


    # Reducing Costs and Improving Profits


    The effort and cost for deployment and manageability need to be balanced with
    the quality of the solution. Having fewer resources, minimizing the operational
    costs, and delivering high-quality solutions are the key goals for enterprise
    IT. Quantum solutions help cut down the infrastructure costs with exponential
    speedup in the algorithms compared to the classical algorithms. See Figure [1-9](#490826_1_En_1_Chapter.xhtml#Fig9).


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig9_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig9_HTML.jpg)

    *Figure 1-9: Triangle showing the IT challenges*


    Many enterprises have challenges related to resources dedicated to the maintenance
    of the applications (80 percent of them). The operating costs of the deployed
    solutions are twice the solution development or package software cost. The developer
    resource costs are more than the software servers’ cost by a ratio of 18:1. Banks
    are spending about a billion dollars per year to maintain their applications and
    solutions that are up and running 24 hours every day of the week. This amounts
    to the total cost of ownership and challenges for maintaining IT in a bank.


    The other challenges are related to legacy apps and products, outdated technology
    platforms, and not having skilled resources in the IT departments. Time to market
    is an important factor in every aspect of the business. Technology platforms do
    not have the capabilities to match the speed expected in terms of time to market.
    The volume and complexity of change or requirements do not match the resources
    available in the enterprise.


    Having effective solutions is important to handle this exponential increase in
    the cost of maintaining the deployed solutions. Quantum solutions solve this problem
    by cutting the resources required by offering an exponential speedup in the algorithms.


    The quantum solutions infrastructure will be highly performant, secure, available,
    and resilient, and it will be able to match the time to market needs. The people
    needed will require average skills but will be able to deploy these solutions
    easily and upgrade them for maintenance. Overall, enterprises will be able to
    handle their customer requirements quickly and develop products faster. See Figure
    [1-10](#490826_1_En_1_Chapter.xhtml#Fig10).


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig10_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig10_HTML.jpg)

    *Figure 1-10: Data management process*


    Quantum solution infrastructure will have data models, patterns, and algorithms
    to process data quickly. First, the data can be from various sources, and processing
    power helps in creating reports. Decision-making will be faster using the reports
    and dashboards. The total cost of ownership will go down for an enterprise.


    Second, this complexity is a significant limiting factor for executing product
    development at the speed necessary to respond to market needs. In the absence
    of careful planning, technology platforms will fail to anticipate the complexity
    of interactions. Managing volume and complexity falls to a highly skilled human
    workforce, the demand for which is already far outstripping supply.


    Without effective solutions, the cost of maintaining applications will, therefore,
    increase exponentially. Furthermore, increasing complexity means a greater risk
    of security loopholes, making organizations more vulnerable to threats.


    # Improving Efficiencies and Reducing the Defects


    The manageability of the solution infrastructure is the key for quantum solutions.
    There will be an impact to the cost and security of the solution infrastructure
    because of the complexity in handling and managing the applications. Visibility
    and monitoring of the applications deployed are achievable with threat intelligence
    models using deep learning. New deployments, upgrades, and releases can be handled
    with change and impact analysis. This analysis helps in identifying IT problems
    and maintaining the deployed applications without issues and errors. Defects cost
    100 times more to fix in the production stage compared to the design stage. See
    Figure [1-11](#490826_1_En_1_Chapter.xhtml#Fig11).


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig11_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig11_HTML.jpg)

    *Figure 1-11: Solution development process*


    # Solutions


    In this section, we look at different quantum solutions in the areas of cryptography,
    optimization, and cybersecurity.'
