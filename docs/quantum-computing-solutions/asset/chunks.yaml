    principle helps in minimizing the average time for a trip. There are other principles
    and algorithms to balance the road user and network traffic flow.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig5_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Transportation planning: factors


    ## Transportation Planning: Factors


    Trips are generated based on the source, destination, vehicle, and city transportation
    network. The network has vehicles, cyclists, and pedestrians in different time
    zones and space constantly moving. Transportation planning is a continuous activity,
    and the street network infrastructure keeps getting updated. Traffic modeling
    is done using techniques such as simulation and machine learning. Traffic control
    is done using the historical data, estimating the number of vehicles during a
    time period, and managing the flow of the traffic across the network.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig6_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Traffic planning: AI and machine learning


    The max flow–min cut approach is used to maximize the flow of the traffic in a
    transportation network. This approach is based on the maximum flow of traffic
    from source to destination and is the same as the minimum cut to separate the
    source from the destination. This approach can be applied to a computer network
    packet flow.


    Packet flow through a network can be modeled using the max flow–min cut approach.
    The network has the information flow through the nodes to reach the destination.
    The goal is to maximize the number of packets that can flow through a computer
    network.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig7_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Packet flow: computer network


    Similarly, this method can be used for assigning students a dorm based on the
    condition that every student wants to live in their own dorm of choice. The goal
    is to maximize the number of students who get dorms.


    Let’s look at how QAOA can be used for a max cut solution in Python. The Grove
    framework and PyQuil are used in the following example.


    ### Code Sample


    ```

    import numpy as nump

    from grove.pyqaoa.maxcut_qaoa import maxcut_qaoa

    import pyquil.api as pyquilapi

    qvm_session = pyquilapi.QVMConnection()

    configuration_ring = [(0,1),(1,2),(2,3),(3,0)]

    steps = 2

    inst = maxcut_qaoa(graph=configuration_ring, steps=steps)

    betas, gammas = inst.get_angles()

    t = nump.hstack((betas, gammas))

    param_program = inst.get_parameterized_program()

    program = param_program(t)

    wave_function = qvm_session.wavefunction(program)

    wave_function = wave_function.amplitudes

    for state_index in range(inst.nstates):

    print(inst.states[state_index], nump.conj(wave_function[state_index])*wave_function[state_index])

    ```


    ### Command


    ```

    pip3 install nump

    pip3 install grove

    pip3 install pyquil

    qvm  -S  (separate terminal window1)

    python3 qaoa.py  (terminal window2)

    ```


    ### Output


    ```

    0000 (5.030591151913648e-10+0j)

    0001 (7.986230289234977e-06+0j)

    0010 (7.986230289234498e-06+0j)

    0011 (2.2019121467156433e-07+0j)

    0100 (7.98623028923483e-06+0j)

    0101 (0.49996761419335345+0j)

    0110 (2.2019121467149302e-07+0j)

    0111 (7.98623028923475e-06+0j)

    1000 (7.98623028923475e-06+0j)

    1001 (2.2019121467149302e-07+0j)

    1010 (0.49996761419335345+0j)

    1011 (7.98623028923483e-06+0j)

    1100 (2.2019121467156433e-07+0j)

    1101 (7.986230289234498e-06+0j)

    1110 (7.986230289234977e-06+0j)

    1111 (5.030591151913648e-10+0j)

    ```


    0101 and 1010 have 0.499 wave function amplitudes. These are the max cuts in the
    configuration. Figure [6-8](#490826_1_En_6_Chapter.xhtml#Fig8) shows the 0101
    configuration.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig8_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    0101 configuration


    Figure [6-9](#490826_1_En_6_Chapter.xhtml#Fig9) shows the 1010 configuration.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig9_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    1010 configuration


    Similarly, the traffic network and computer network can be represented as shown
    in the previous code. The constraints can be added using the traffic limits and
    network node capacities. The objective in that case will be to maximize the flow
    and minimize the cut.


    Let’s now look at the combinatorial optimization algorithms.


    ## Combinatorial Optimization


    Combinatorial optimization is used to solve real-life problems such as the traveling
    salesman problem and diet calculations for a person. The optimization algorithm
    uses possible inputs and finds the maximum or minimum output. Let’s say c(x) is
    the goal function. If the goal is to maximize c(x) and the constraints modeled
    are d(x) and b(x), then we have the following:


    ```

    d(x) < 0

    b(x) =0

    ```


    Combinatorial optimization algorithms find the solution that maximizes the goal
    function with discrete values. The optimization algorithm is called *linear programming*
    if the goal function and the constraints are linear.


    Classic optimization algorithms have equivalents in quantum optimization. We’ll
    look at the quantum semidefinite programming methods in the next section.


    Now let’s look at quantum nondeterministic polynomial algorithms which are based
    on quantum semidefinite programming.'
  trans: "\n# QAOA\n\n量子近似优化算法与使用多项式时间方法识别优化问题的解有关（见图 6-4）。QAOA 解决的典型问题是 NP 困难问题。\n\
    \nQAOA 方法在量子虚拟机上执行。诸如最大割和图分割等问题均使用 QAOA 来解决。QAOA 方法包含以下步骤：\n\n1.  使用泡利算符对成本函数进行编码。\n\
    2.  使用量子计算框架和算法对问题进行建模。\n3.  使用采样计算基态解。\n\n**提示**\n\n泡利算符与角动量运算相关。角动量运算表示量子粒子在三个空间方向上的自旋。\n\
    \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig4_HTML.jpg](img/490826_1_En_6_Fig4_HTML.jpg)\n\
    \n图 6-4 – 量子近似优化\n\n最大割问题可以使用 QAOA 方法解决，且与在图论中寻找最大割有关。基态使用哈密顿函数建模，并对状态进行测量。测量多体量子态，从而以更高的概率获得最大割解。在给定的网络或图中，目标是根据顶点之间的边的规模来识别顶点的子群。\n\
    \n让我们来看一个可以应用 QAOA 的现实问题（见图 6-5）。交通运输中的交通建模依赖于交通分区、出行表、公路网络、车辆容量和土地利用模型。土地利用模型包括趋势、土地利用和分区规划、活动区域以及地图。交通系统包含街道、公路、停车、速度、出行时间和限速。交通网络将包含交通量和车辆容量。出行模式识别了交通方式选择、典型的源到目的路径以及出行特征。沃德罗普第一原理基于网络和道路使用者平衡。所有被使用路径的出行时间相等，且比任何一条未被使用的路径的出行时间短一条车的通行时间。该原理有助于最小化一次出行的平均时间。还有其他原理和算法来平衡道路使用者和网络交通流。\n\
    \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig5_HTML.jpg](img/490826_1_En_6_Fig5_HTML.jpg)\n\
    \n图 6-5 – 交通规划：因素\n\n## 交通规划：因素\n\n出行是基于起点、目的地、车辆和城市交通网络生成的。该网络在不同时区和空间中拥有不断移动的车辆、骑自行车的人和行人。交通规划是一项持续的活动，街道网络基础设施也在不断更新。交通建模使用诸如仿真和机器学习等技术完成。交通控制则利用历史数据，估计某个时间段内的车辆数量，并管理整个网络的交通流。\n\
    \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig6_HTML.jpg](img/490826_1_En_6_Fig6_HTML.jpg)\n\
    \n图 6-6 – 交通规划：人工智能与机器学习\n\n最大流-最小割方法用于最大化交通网络中的交通流。该方法基于从起点到目的地的最大交通流，等同于将起点与目的地分开的最小割。此方法可应用于计算机网络数据包流。\n\
    \n通过网络的数据包流可以使用最大流-最小割方法进行建模。网络中的信息流经过节点到达目的地。目标是最大化能够流经一个计算机网络的数据包数量。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig7_HTML.jpg](img/490826_1_En_6_Fig7_HTML.jpg)\n\
    \n图 6-7 – 数据包流：计算机网络\n\n类似地，此方法也可用于为学生分配宿舍，前提是每个学生都想住进自己选择的宿舍。目标是最大化获得宿舍的学生数量。\n\
    \n让我们看看如何在 Python 中使用 QAOA 解决最大割问题。以下示例使用了 Grove 框架和 PyQuil。\n\n### 代码示例\n\n```python\n\
    import numpy as nump\nfrom grove.pyqaoa.maxcut_qaoa import maxcut_qaoa\nimport\
    \ pyquil.api as pyquilapi\n\nqvm_session = pyquilapi.QVMConnection()\nconfiguration_ring\
    \ = [(0,1),(1,2),(2,3),(3,0)]\nsteps = 2\ninst = maxcut_qaoa(graph=configuration_ring,\
    \ steps=steps)\nbetas, gammas = inst.get_angles()\nt = nump.hstack((betas, gammas))\n\
    param_program = inst.get_parameterized_program()\nprogram = param_program(t)\n\
    wave_function = qvm_session.wavefunction(program)\nwave_function = wave_function.amplitudes\n\
    for state_index in range(inst.nstates):\n    print(inst.states[state_index], nump.conj(wave_function[state_index])*wave_function[state_index])\n\
    ```\n\n### 命令\n\n```bash\npip3 install nump\npip3 install grove\npip3 install\
    \ pyquil\nqvm  -S  （单独的终端窗口 1）\npython3 qaoa.py  （终端窗口 2）\n```\n\n### 输出\n\n```text\n\
    0000 (5.030591151913648e-10+0j)\n0001 (7.986230289234977e-06+0j)\n0010 (7.986230289234498e-06+0j)\n\
    0011 (2.2019121467156433e-07+0j)\n0100 (7.98623028923483e-06+0j)\n0101 (0.49996761419335345+0j)\n\
    0110 (2.2019121467149302e-07+0j)\n0111 (7.98623028923475e-06+0j)\n1000 (7.98623028923475e-06+0j)\n\
    1001 (2.2019121467149302e-07+0j)\n1010 (0.49996761419335345+0j)\n1011 (7.98623028923483e-06+0j)\n\
    1100 (2.2019121467156433e-07+0j)\n1101 (7.986230289234498e-06+0j)\n1110 (7.986230289234977e-06+0j)\n\
    1111 (5.030591151913648e-10+0j)\n```\n\n`0101` 和 `1010` 的波函数振幅为 `0.499`。这些就是该配置中的最大割。图\
    \ 6-8 展示了 `0101` 配置。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig8_HTML.jpg](img/490826_1_En_6_Fig8_HTML.jpg)\n\
    \n图 6-8 – `0101` 配置\n\n图 6-9 展示了 `1010` 配置。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig9_HTML.jpg](img/490826_1_En_6_Fig9_HTML.jpg)\n\
    \n图 6-9 – `1010` 配置\n\n类似地，交通网络和计算机网络也可以像之前代码中那样表示。约束条件可以通过交通限制和网络节点容量来添加。在这种情况下的目标是最大化流量并最小化割。\n\
    \n现在让我们来看组合优化算法。\n\n## 组合优化\n\n组合优化用于解决现实问题，例如旅行商问题和个人的饮食计算。优化算法使用可能的输入，并找出最大或最小的输出。假设\
    \ `c(x)` 是目标函数。如果目标是最大化 `c(x)`，并且建模的约束条件是 `d(x)` 和 `b(x)`，那么我们有以下条件：\n\n```text\n\
    d(x) < 0\nb(x) = 0\n```\n\n组合优化算法通过离散值找到使目标函数最大化的解。如果目标函数和约束条件是线性的，这种优化算法被称为*线性规划*。\n\
    \n经典优化算法在量子优化中有其对应方法。我们将在下一节中探讨量子半定规划方法。\n\n现在让我们来看基于量子半定规划的量子非确定性多项式算法。\n"
- fmt: "# Quantum NP (BQNP)\n\nBounded-error quantum polynomial time-based algorithms\
    \ are the polynomial time order techniques that can be run on quantum computers.\
    \ The computing knot invariants and quantum simulation algorithms are BQNP algorithms.\n\
    \nA good example for the BQNP algorithm is Shor’s algorithm. It is based on factoring\
    \ the product of prime numbers. The algorithm gets executed in polynomial time\
    \ with a bounded error. The execution time depends on the number of operations\
    \ in Shor’s algorithm.\n\nShor’s algorithm, named after mathematician Peter Shor,\
    \ is a quantum algorithm for integer factorization. The quantum algorithm was\
    \ formulated in 1994. It is related to the problem “Given an integer `K`, find\
    \ its prime factors.”\n\nOn a quantum computer, to factor an integer `K`, Shor’s\
    \ algorithm runs in polynomial time. The time taken for execution is polynomial\
    \ in `log K`. The size of the input for the algorithm is `log K`. To be exact,\
    \ it takes time in the order of `O((log N)3)`. The integer factorization problem\
    \ can be modeled on the quantum computer using the BQP algorithm. This algorithm\
    \ is exponentially faster than the classical equivalent. The efficiency of Shor’s\
    \ algorithm is equal to the efficiency of the quantum Fourier transform algorithm.\n\
    \n## Summary\n\nIn this chapter, we looked at the techniques related to the approximate\
    \ optimization, semidefinite programming, combinatorial optimization, and quantum\
    \ nondeterministic polynomial algorithms. In addition, we discussed approximate\
    \ optimization algorithms in detail.\n\n# Part III Quantum Solutions\n\n# 7. Quantum\
    \ Algorithms\n\n## Introduction\n\n> *“If you can’t program it, you haven’t understood\
    \ it.”*\n> \n> —David Deutsch\n\nThis chapter gives you an overview of quantum\
    \ algorithms. You will see how quantum algorithms are implemented in real life.\
    \ Code examples are presented for the quantum algorithms, such as quantum least\
    \ squares fitting and quantum sort.\n\n## Initial Setup\n\nYou need to set up\
    \ Python 3.5 to run the code samples in this chapter. You can download it from\
    \ [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/).\n\
    \n## Quantum Least Squares Fitting\n\nIn this section, we will look at the algorithm\
    \ called *quantum least squares fitting*.\n\nQuantum information theory helps\
    \ in solving regression and prediction problems efficiently. Quantum algorithms\
    \ that are based on the quantum mechanical principles enhance the efficiency of\
    \ the least squares fitting algorithm. In quantum state tomography, the quantum\
    \ states are fit to a group of functions. Quantum state tomography is related\
    \ to the reconstruction of quantum states. Quantum states are measured, and an\
    \ ensemble of the same quantum states is created during the process of tomography.\n\
    \n> **Tip**\n> \n> Quantum state tomography is the method of checking the quantum\
    \ state.\n\nA continuous function is used to find the classical least squares\
    \ fitting. A continuous function is continuous in every interval. In every interval,\
    \ the values are continuous. Continuity has three rules, as shown here:\n\n- The\
    \ function needs to be defined at a point.\n- It needs to have a limit on a side\
    \ at a point.\n- The limit from left or right side needs to be equal to the function\
    \ value at the point.\n\nAs an example, `f(x) = x²` is a continuous function.\
    \ The graph of the continuous function will be unbroken without any jumps and\
    \ asymptotes. An *asymptote* is the point where the function jumps to infinity.\
    \ A domain has a set of points that have values for a function. Let’s say that\
    \ `f(x)` is a linear function of `y`. Then `x = A^(-1)y`, where `A` is a square\
    \ matrix. The pseudo-inverse of `A` is defined as shown here:\n\n`A^(+) = (A^(T)A)^(-1)\
    \ A^(T)`\n\nNow, let’s look at the quantum equivalent of the least squares fitting\
    \ method. The quantum least squares fitting method is based on finding a simple\
    \ function that is continuous and fits the discrete set of `M` (domain) points\
    \ `{x[j], y[j]}`. The function can be nonlinear but needs to be forced for a linear\
    \ fit. The function is presented mathematically as shown here:\n\n`f(x, λ) = Σ\
    \ [j=1]^(M) f[j](x)λ[j]`\n\nwhere `λ[j]` is a component and belongs to `λ` and\
    \ `f(x, λ)`.\n\nThe least squares fitting algorithm does through three steps.\n\
    \n1. Find the pseudo-inverse using the quantum algorithm.\n2. Estimate the fitness\
    \ quality using the algorithm.\n3. Identify the fitness parameters `λ` using learning\
    \ algorithm.\n\nThe fitness function measures the quality of the solution. This\
    \ is done by measuring the closeness of the solution to the optimum solution.\
    \ The fitness score is calculated by using the fitness parameters. The Euclidean\
    \ distance and Manhattan distance methods are used to find fitness. The Euclidean\
    \ distance is calculated using the sum of the squares of the perpendicular distances.\
    \ The Euclidean distance for the two points `(x[1], y[1])` and `(x[2], y[2])`\
    \ is as follows:\n\n`√ (x[1]-x[2])^(2) + (y[1]-y[2])^(2)`\n\n> **Tip**\n> \n>\
    \ Manhattan distance is defined as the smallest distance between the point and\
    \ the line. The Manhattan distance between `(x[1], y[1])` and `cx + dy + e = 0`\
    \ is calculated as follows: `|cx[1]+dy[1]+e| / max(|c|, |d|)`.\n\nThe algorithm\
    \ takes the following inputs mentioned here:\n\n- Vector of expected data\n- Matrix,\
    \ which is the basis\n- Vector of weights\n- Fitted matrix\n- Trace of the fitted\
    \ matrix\n\nNow let’s look at some of the terms that were used in the algorithm\
    \ in detail.\n\nThe basis matrix has elements that are linearly independent. It\
    \ is a combination of linearly independent vectors. Let’s say we have a matrix\
    \ `B` defined as shown here:\n\n![Matrix B](images/490826_1_En_7_Chapter/490826_1_En_7_Fig1_HTML.jpg)\n\
    \n*Figure 7-1: Matrix B*\n\nThe columns of the matrix `B` are linearly independent.\
    \ The redundant column vectors are removed to find the basis of the matrix. If\
    \ you try to remove the first column, the span will move to the y-axis. The basis\
    \ of matrix `W` is as defined here using the important and pivotal columns:\n\n\
    ![Basis of Matrix B](images/490826_1_En_7_Chapter/490826_1_En_7_Fig2_HTML.jpg)\n\
    \n*Figure 7-2: Basis of Matrix B*\n\nVector data types are fixed-size lists. Mathematical\
    \ vectors are lines of specific length with a starting point and direction. Vector\
    \ examples are work, force, acceleration, and velocity. In two dimensions, the\
    \ example of a vector is `b[1]i + b[2]j`. In three dimensions, the vector is represented\
    \ as `b[1]i + b[2]j + b[3]k`. The n dimensional vector is defined as `b[0] + b[1]t[1]\
    \ + b[2]t[2] + ... + b[n]t[n]`.\n\nLet’s look at the trace of the matrix definition.\
    \ The trace of a matrix is the sum of the diagonal elements from the upper left\
    \ to the lower right. It is equal to the sum of the matrix’s eigenvalues.\n\n\
    Let’s say we have a matrix `B` defined as follows:\n\n![Trace of Matrix](images/490826_1_En_7_Chapter/490826_1_En_7_Fig3_HTML.jpg)\n\
    \n*Figure 7-3: Trace of Matrix*\n\nThe trace of the matrix is defined as `x[1]\
    \ + y[2] + z[3]`.\n\nComing back to the algorithm, the algorithm provides a better\
    \ fit for the data using quantum least squares fitting. Figure [7-4](#490826_1_En_7_Chapter.xhtml#Fig4)\
    \ demonstrates quantum least square fitting. The classical least square fitting\
    \ algorithm might be closer to an average curve that passes through the data.\
    \ Quantum least squares fitting tries to minimize the bias across different points.\n\
    \nLet’s look into the calculation of the bias now. *Bias* is the difference between\
    \ the real value and the mean value of the predicted data. The bias is because\
    \ it is assumed that the linear function is a fit. Quantum least squares fitting\
    \ helps to bring down the bias, as shown in Figure [7-4](#490826_1_En_7_Chapter.xhtml#Fig1).\n\
    \n![Quantum least square fitting](images/490826_1_En_7_Chapter/490826_1_En_7_Fig4_HTML.jpg)\n\
    \n*Figure 7-4: Quantum least square fitting*"
