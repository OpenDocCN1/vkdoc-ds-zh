    simon_circuit.defgate(oracle_name, self.unitary_function_mapping)

    simon_circuit.inst([H(i) for i in self.computational_qubits])

    simon_circuit.inst(tuple([oracle_name] + sorted(self._qubits, reverse=True)))

    simon_circuit.inst([H(i) for i in self.computational_qubits])

