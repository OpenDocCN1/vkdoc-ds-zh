    ## Classic K-Medians


    The k-medians technique (see Figure [10-7](#490826_1_En_10_Chapter.xhtml#Fig7))
    selects the centroid based on the median of the data set. K-means selects the
    centroid as the mean of the data points of the cluster. The distance calculation
    from the centroid to the data points in the cluster is based on the taxicab metric.
    The Euclidean distance between two points `(x1,y1)` and `(x2, y2)` is as follows:


    ![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig7_HTML.jpg](images/490826_1_En_10_Chapter/490826_1_En_10_Fig7_HTML.jpg)


