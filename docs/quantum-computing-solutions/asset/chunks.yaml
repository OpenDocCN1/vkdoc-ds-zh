- fmt: '### Cryptography


    Banks will be interested in protecting their payment gateways and solutions against
    security threats from future quantum computing capabilities. There is a need to
    make the payment solutions “quantum-resistant.” In addition, there is a need for
    blockchain-based banking and financial solutions to improve using post-quantum
    cryptographic algorithms.


    The Quantum Resistant Ledger is the next-generation solution for banking and financial
    services. Quantum cryptography is based on quantum key distribution. Quantum key
    distribution is related to the expansion of a short, shared key into an infinite
    shared stream. This demands improvement in the efficiency of post-quantum cryptographic
    algorithms.


    Financial firms need to start investing in post-quantum cryptography. Blockchain-based
    solutions will be not quantum-resistant if they are not upgraded to post-quantum
    cryptographic algorithms. Functioning cryptographic systems are `DES`, `Triple
    DES`, `AES`, `RSA`, `Merkle hash-tree signatures`, `Merkle–Hellman knapsack encryption`,
    `Buchmann–Williams class-group encryption`, `ECDSA`, `HFEv-`, and others (see
    Figure [1-12](#490826_1_En_1_Chapter.xhtml#Fig12)). They are going to fail with
    quantum algorithms and computing power. `Shor’s algorithm` is the quantum algorithm
    that threatens the `RSA`, `DSA`, and `ECDSA` cryptographic algorithms.


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig12_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig12_HTML.jpg)


    Figure 1-12 — Cryptography models


    A quantum computer–based algorithm can break the symmetric key cryptographic algorithm
    by a factor of the square root of the size of the key. To find an image of a 256-bit
    hash function, a quantum algorithm will take only `2^(128)` time. `Shor’s algorithm`
    helps in the quantum factorization of big numbers. This demands that the security
    systems be quantum-resistant. Elliptic curve cryptography has been shown to improve
    the cracking process by 21 percent. This method is based on multiplying polynomials
    and adding random noise.


    Quantum algorithms beat the classical equivalents because they can be executed
    on faster hardware. Quantum algorithms are also based on quantum mechanics. Theoretically,
    quantum mechanics methods have proven to be faster than classical methods. Quantum
    mechanics is related to the complex subatomic particle interaction. The subatomic
    particles can be electrons. Electrons can be present in multiple discrete states
    at the same time, which is called *superposition*.


    Heisenberg’s uncertainty principle states that a quantum system has information
    about an object’s velocity and position. Any measurement of velocity will have
    an impact on the position because the act of observing modifies the state. The
    subatomic particles can be in an entangled state. A change to one particle impacts
    another particle when they are separated from each other. Quantum mechanics captures
    the complexities of the state of electrons using complex numbers.


    `Grover’s algorithm` can solve a phone book search on the order of the square
    root of the number of phone book numbers (`O(√n)` time). Let’s say a phone book
    has 100 million phone numbers. `Grover’s algorithm` can find a number with 10,000
    steps. `Grover’s quantum algorithm` uses quantum mechanics–based methods to speed
    up the search.


    ### Optimization


    Optimization problems occur in our daily life in different domains such as finance,
    banking, healthcare, logistics, and automotive sectors. In wealth management,
    portfolio selection is based on finding the best assets to balance the risk with
    the expected gains. A portfolio selection is an NP-hard problem. An NP-hard problem
    is a difficult and not impossible problem for current computers to solve quickly.
    Quantum annealing is a quantum algorithm to find solutions for these NP-hard problems.


    In the annealing method, the problem is encoded to a similar physical problem.
    The lowest energy state of a system is the same as the solution to the problem
    at hand. This system is built in the annealer, and it evolves toward the lowest
    energy state. In real life, the annealer reaches the lowest energy through the
    cooling process. In quantum annealing, the tunneling events move the system to
    minima quickly. See Figure [1-13](#490826_1_En_1_Chapter.xhtml#Fig13).


    ![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig13_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig13_HTML.jpg)


    Figure 1-13 — Quantum annealing process


    Quantum annealing techniques help in finding optimal trading paths. A large set
    of trading orders gets executed, and this impacts the asset price. The execution
    costs need to be accounted for during the trading execution. Algorithms need to
    set the trading rate for big orders. This helps in balancing the speed of trading,
    minimizing the exposure to market risk, and minimizing the impact on the market.


    The other area is related to optimizing the arbitrage opportunities. Arbitrage
    is related to making a profit by taking advantage of the difference in asset prices
    with less risk. The example given is typically related to currency exchange from
    euros to dollars, dollars to yens, and yens to euros. This transaction might yield
    a small profit due to the differences in prices. This is called *cross-currency
    arbitrage*. This problem is NP-hard to find optimal arbitrage opportunities across
    the assets in different markets. The quantum annealer method helps in finding
    the path with the lowest cost.


    Credit scoring is another area that can be solved using quantum annealing. Credit
    scoring of an individual is related to the person’s income, age, financial history,
    collateral, and current liabilities. The risk assessment looks at various factors
    in the customer’s profile. This is a computationally challenging problem, which
    is an NP-hard problem.


    The vehicle routing problem is another optimization problem that can be solved
    using quantum annealing. Dantzig and Ramser proposed in 1959 the vehicle routing
    problem. The goal for the optimization is to identify the optimal routes for a
    set of vehicles serving customer orders. The solution is to identify the set of
    routes that are part of the order delivery from the source to the destination.
    The number of vehicles needed for customer orders is also an optimization goal.
    Quantum annealing is the optimization technique used to determine the local minima
    route over a given set of candidate functions. This is a method of discretizing
    a function with many local minima to determine the observables of the function.
    The quantum annealing process is different from simulated annealing, as it is
    based on the quantum tunneling process. The particles tunnel through energy barriers
    from a high state to a low state.


    Quantum annealing starts from a superposition of different states of a system
    that are weighted equally. The time-dependent Schrödinger equation drives the
    time evolution of the system. This system serves to affect the amplitude of all
    states as the time increases. Eventually, the ground state is reached to give
    the instantaneous Hamiltonian of the system.'
