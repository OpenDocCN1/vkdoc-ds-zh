    \ test data is used to identify the model’s performance. The validation data is\
    \ used to fine-tune the machine learning model.\n\nLoss and accuracy are measured\
    \ on the training and validation data sets. Overfitting of the model occurs when\
    \ the validation loss increases versus the training loss. The goal is to have\
    \ the validation accuracy high compared to the loss. Representative data sets\
    \ need to be chosen to avoid data source bias. Bias can be estimated based on\
    \ the statistical expected value and the real value from the data population.\
    \ The model error that is observed needs to be calculated based on a metric mean\
    \ squared error. The mean squared error needs to be minimized.\n\n## Classical\
    \ SVM\n\nA classical support vector machine is based on supervised machine learning\
    \ (SVM). SVM is trained using the data, and it is used to forecast whether the\
    \ input belongs to a specific class. The training data has the set of classes\
    \ that SVM forecasts. Support vectors are used in SVM to maximize the distance\
    \ between the set of classes. See Figure [9-6](#490826_1_En_9_Chapter.xhtml#Fig6).\n\
    \n![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig6_HTML.jpg](images/490826_1_En_9_Chapter/490826_1_En_9_Fig6_HTML.jpg)\n\
    \nFigure 9-6\n\nSupport vector machine\n\nThe quantum equivalent of SVM uses a\
    \ feature map to present the quantum circuit information. The kernel concept is\
    \ used in classification methods. A feature map modified the features. Features\
    \ are measurable attributes of the subject in context. Classification is about\
    \ finding the distance between the classes for the input information.\n\nThe quantum\
    \ support vector machine is based on a quantum processor for solutions. It is\
    \ based on supervised learning. Multiclass classifiers are built on quantum support\
    \ vector machines. A quantum processor has QRAM for handling quantum bits in the\
    \ memory.\n\nTip\n\nQRAM consists of three components such as the memory array,\
    \ input register, and output register. A memory array can be classical or quantum\
    \ based. The registers consist of quantum bits.\n\nLet’s look at quantum sparse\
    \ support vector machines in detail.\n\n## Quantum Sparse Support Vector Machines\n\
    \nThere are various techniques such as least squares for simulating quantum sparse\
    \ support vector machines. The Harrow–Hassidim–Lloyd (HHL) algorithm is used to\
    \ find a solution for a linear equation–based system to forecast using trained\
    \ quantum bits. This is a hybrid algorithm of the classical and quantum computing\
    \ techniques.\n\nRegularization is part of the sparse support vector machine technique.\
    \ It is related to the penalty imposed on parameter weights in the objective function.\
    \ A high-dimensional space consisting of features can be used to get accurate\
    \ predictions. The L2 Norm penalty is used as a regularization algorithm, and\
    \ L1 Norm is better than L2 Norm. The objective function in the support vector\
    \ machine uses Hinge Loss minimization with L1 Norm. See Figure [9-7](#490826_1_En_9_Chapter.xhtml#Fig7).\n\
    \n![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig7_HTML.jpg](images/490826_1_En_9_Chapter/490826_1_En_9_Fig7_HTML.jpg)\n\
    \nFigure 9-7\n\nQuantum support vector machine\n\nLinear programming is a form\
    \ of semidefinite programming (SDP), which uses sparse support vector machine\
    \ formulation. A quantum sparse support vector machine uses a quantum SDP solver.\
    \ The algorithm steps for solving SDP are shown here:\n\n1.  Parameters are created\
    \ in a dictionary.\n2.  The data set is created as an input object.\n3.  The algorithm\
    \ executes based on the input data set and parameters.\n4.  The result with success\
    \ ratio and details are printed.\n5.  The predicted labels are printed in the\
    \ output.\n\nTip\n\nA positive semidefinite matrix is a Hermitian matrix, which\
    \ has positive eigenvalues.\n\nReNomQ is a machine learning framework based on\
    \ quantum principles. Quantum circuits can be modeled using this framework. Quantum\
    \ computation can be performed using the software package. A quantum support vector\
    \ machine is modeled using an adiabatic quantum computation model.\n\nLet’s look\
    \ at an example for a quantum support vector machine.\n\n### Code Sample\n\n```\n\
    import renom_q.ml.quantum_svm\nquantum_svm = renom_q.ml.quantum_svm.QSVM()\nxval\
    \ = [[3, 4], [5, 6], [7, 9], [8, 6]]\nyval = [1, -1, 1, -1]\nquantum_svm.plot_graph(xval,\
    \ yval)\n```\n\n### Command\n\n```\npip3 install renorm_q\npython3 quantum_svm.py\n\
    ```\n\n### Output\n\nFigure [9-8](#490826_1_En_9_Chapter.xhtml#Fig8) shows the\
    \ output.\n\n![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig8_HTML.jpg](images/490826_1_En_9_Chapter/490826_1_En_9_Fig8_HTML.jpg)\n\
    \nFigure 9-8\n\nOutput\n\n## Summary\n\nIn this chapter, we looked at techniques\
    \ related to quantum classifier algorithms such as quantum classifiers, variational\
    \ quantum classification, quantum support vector machines, and quantum sparse\
