    现在，让我们来看看经典搜索算法。


    ## 经典搜索


    在经典搜索算法中，需要在一个由 `M` 个项目组成的给定集合中，识别出具有特定属性的项目。一个项目可能具备也可能不具备该指定属性。该搜索算法的复杂度与识别特定项目所需的查询次数成正比。这些项目通常存储在数据存储中，并在关系数据库中拆分为不同的实体。如果数据存储是
    NoSQL 类型的，它们则存储在不同的集合中。这些项目可以分别根据属性或值进行排序或筛选。


    让我们来看看量子搜索算法。


    ## 量子搜索


    量子计算机可用于执行搜索算法。叠加态有助于降低量子算法中的搜索复杂度。量子搜索算法的复杂度与 `√M` 次查询成正比。量子搜索使用波状振幅和干涉概念进行建模。参见图
    11-8。


    ![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig8_HTML.jpg](img/490826_1_En_11_Fig8_HTML.jpg)


    **图 11-8** – 量子搜索


    现在，我们来看看多元件天线阵列。在多元件天线阵列中，不同的相位可以在特定方向上产生辐射。阵列分析通过幺正变换进行，振幅的平方得到各个分量的概率。这些变换基于分量的旋转和反射。这个例子类似于量子搜索。量子搜索确定一系列能够找到解决现实问题方案的量子逻辑门。该算法与上下文特定时刻的振幅成正比。量子搜索算法广受欢迎，并解决了许多现实问题。


    > **提示：** 量子搜索算法基于包含 Hadamard 门和 CNOT 门的量子电路。


    接下来，让我们详细了解一下量子深度学习。


    ## 量子深度学习


    量子算法用于解决复杂的现实问题。深度学习是量子算法中常用的一种技术。基于玻尔兹曼机的量子计算框架有助于提供量子深度学习框架。该框架有助于机器学习的模型学习和训练过程。


    量子机器学习基于量子数据和混合量子经典模型。量子数据模型基于量子数据源，并使用量子计算机生成的数据。该模型基于叠加和纠缠原理。一个表示联合概率分布的 `2⁵³`
    个元素的希尔伯特空间可以使用量子计算机求解。量子 Tensor Flow 框架拥有创建机器学习模型的基础设施概念，这些模型可以使用量子数据模型和算法。量子数据模型可用于化学模拟、量子物质建模、量子控制、量子通信网络和量子计量学。


    混合量子经典模型用于数据泛化，并使用混合量子经典技术进行求解。量子神经网络就是基于参数化量子计算模型的技术之一。


    > **提示：** 量子深度学习用于分类领域的量子模式识别。


    量子机器学习应用于现实场景。例如，量子化学问题与优化高维且困难的目标函数相关。量子计算框架被应用于解决计算上具有挑战性的问题，例如变分量子本征求解器。


    变分量子本征求解器旨在识别某些算子的本征值。本征值识别是一个复杂且具有挑战性的问题。量子相位估计方法可用于计算给定本征向量的本征值。您可以优化一个变分电路，以降低用户定义哈密顿量的期望能量平方值。该哈密顿量可以表示为两个泡利算符之和。


    ### 代码示例


    ```

    import pennylane as quantumDeepL

    from pennylane import numpy as npython

    from pennylane.optimize import GradientDescentOptimizer as GDOpt

    dev = quantumDeepL.device(''default.qubit'', wires=2)

    def FindAnsatz():

    quantumDeepL.Rot(0.3, 1.8, 5.4, wires=1)

    quantumDeepL.RX(-0.5, wires=0)

    quantumDeepL.RY( 0.5, wires=1)

    quantumDeepL.CNOT(wires=[0, 1])

    @quantumDeepL.qnode(dev)

    def FindCircuitX():

    FindAnsatz()

    return quantumDeepL.expval(quantumDeepL.PauliX(1))

    @quantumDeepL.qnode(dev)

    def FindCircuitY():

    FindAnsatz()

    return quantumDeepL.expval(quantumDeepL.PauliY(1))

    def getCost(var):

    expX = FindCircuitX()

    expY = FindCircuitY()

    return (var[0] * expX + var[1] * expY) ** 2

    optimizer = GDOpt(0.5)

    variables = [0.3, 2.5]

    variables_gd = [variables]

    for i in range(20):

    variables = optimizer.step(getCost, variables)

    variables_gd.append(variables)

    print(''Cost - step {:5d}: {: .7f} | Variable values: [{: .5f},{: .5f}]''

    .format(i+1, getCost(variables), variables[0], variables[1]) )

    ```


