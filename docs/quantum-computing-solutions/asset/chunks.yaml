    \n## 初始设置\n\n您需要安装 Python 3.5 才能运行本章中的代码示例。您可以从[`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)下载它。\n"
- fmt: "# Quantum ANN\n\nIn this section, we will look at quantum artificial neural\
    \ networks. Quantum neural networks are the quantum equivalent of neural networks.\
    \ They are based on quantum mechanics principles. Quantum neural networks are\
    \ based on quantum information processing and brain quantum effects. Quantum artificial\
    \ neural networks are used for pattern classification algorithms.\n\n> **Tip**\
    \  \n> Pattern classification is related to identifying the right group for an\
    \ input value given the different possible groups.\n\nLet’s start looking at classical\
    \ neural networks.\n\n# Classical Neural Networks\n\nA neural network has layers\
    \ that are input, output, and hidden types. The network changes the input depending\
    \ on the usage of the output layer. The concept of neural networks is based on\
    \ the human brain. Neural networks have been part of AI since the 1940s. The reason\
    \ for the addition was the backpropagation method, which helps in changing the\
    \ hidden layers when the output’s expected value is not equal to the input’s outcome.\n\
    \nFor example, a neural network that is designed to identify cricket balls can\
    \ make a mistake and instead identify a tennis ball. Deep learning neural networks\
    \ are multilayer advanced neural networks. Deep learning neural networks retrieve\
    \ multiple features to identify the objects in context.\n\nA deep learning neural\
    \ network is like a conveyor belt that takes a crude iron rod and transforms it\
    \ to a specific designed part. Each stage in the deep learning neural network\
    \ has the capability to identify features and retrieve them. Artificial neural\
    \ networks are based on mathematical models. They consist of elements that are\
    \ interconnected that are referred to as `neurons`. The neurons have information\
    \ that is equal to the weighted linkage. The neuron signals that are the input\
    \ values pass through neural connections, and the connections are weighted. A\
    \ deep learning neural network has capacity to learn, modify, and normalize the\
    \ input data by using the appropriate weights.\n\n# Quantum Analogies to Neural\
    \ Networks\n\nAfter looking at the classical neural networks, we can now look\
    \ at the quantum equivalent of neural networks. Classical ANNs have computational\
    \ power because of their capability to process big data in parallel mode. Quantum\
    \ neural networks can handle similar big data because of quantum parallelism based\
    \ on the quantum mechanics principles. A quantum register that has M quantum bits\
    \ has different configurations that can be handled by the quantum computer.\n\n\
    Quantum entanglement and superposition are the key principles that help in measuring\
    \ the quantum bit states. A quantum neural network consists of input, hidden,\
    \ and output neurons that are connected. An example of a quantum neural network\
    \ is the Hopfield model. The Hopfield model became part of ANNs in 1982. John\
    \ Hopfield discovered the symmetrical bonds and quantum spin glasses in neural\
    \ networks.\n\n> **Tip**  \n> Hopfield networks are applied in image processing\
    \ and analysis, as well as medical image analysis and restoration.\n\nNeurocomputational\
    \ methods are based on the nonlinear techniques of data processing. Quantum computational\
    \ methods are evolutionary as they are based on the evolutionary operators of\
    \ quantum mechanics. Copenhagen interpretation states that evolutionary behavior\
    \ is blended with nonevolutionary behavior in quantum systems. A pattern recall\
    \ is not an evolutionary operator. It is a nonunitary process. Feynman interpretation\
    \ of quantum mechanics uses path integrals. Elizabeth Behrman and Goertzel proposed\
    \ a temporal model for a quantum neural network. See Figure [8-1](#490826_1_En_8_Chapter.xhtml#Fig1).\n\
    \n![../images/490826_1_En_8_Chapter/490826_1_En_8_Fig1_HTML.jpg](images/490826_1_En_8_Chapter/490826_1_En_8_Fig1_HTML.jpg)\n\
    \nFigure 8-1  \nQuantum neural network\n\nA quantum neural network uses a quantum\
    \ dot molecule and optical photons in the model. The temporal model of a QNN is\
    \ modeled by the mathematical equations of the virtual neurons. The number of\
    \ virtual neurons in a QNN is determined by the temporal discretization parameters.\
    \ A new model was created by Wichita State University that is based on the spatial\
    \ model of QNN. The spatial model uses the array of quantum dot molecules.\n\n\
    Ron Chrisley, who was based in the University of Sussex, has proposed a different\
    \ approach related to the network weights that are dependent on the position of\
    \ silts. A quantum neural network that is based on neurocomputing is used for\
    \ pattern recognition in real life.\n\n## Code Sample\n\n```python\nimport pennylane\
    \ as qnnL\nfrom pennylane import numpy as numcal\nfrom pennylane.optimize import\
    \ AdamOptimizer as AdamO\ntry:\n    device = qnnL.device('strawberryfields.fock',\
    \ wires=1, cutoff_dim=10)\nexcept:\n    print(\"please install the package strawberryfields\"\
    )\ndef GetQNNLayer(varr):\n    \"\"\" One layer of the quantum neural network\n\
    \    \"\"\"\n    qnnL.Rotation(varr[0], wires=0)\n    qnnL.Squeezing(varr[1],\
    \ 0., wires=0)\n    qnnL.Rotation(varr[2], wires=0)\n    qnnL.Displacement(varr[3],\
    \ 0., wires=0)\n    qnnL.Kerr(varr[4], wires=0)\n@qnnL.qnode(device)\ndef GetQNN(vars,\
    \ xcoor=None):\n    \"\"\" Returns The quantum neural network\n    \"\"\"\n  \
    \  qnnL.Displacement(xcoor, 0., wires=0)\n    for var in vars:\n        GetQNNLayer(var)\n\
    \    return qnnL.expval.X(0)\ndef GetQNNSquareLoss(labelValues, predictionValues):\n\
    \    \"\"\" Get the Square loss function\n    \"\"\"\n    lossValue = 0\n    for\
    \ label, prediction in zip(labelValues, predictionValues):\n        lossValue\
    \ = lossValue + (label - prediction) ** 2\n    lossValue = lossValue / len(labelValues)\n\
    \    return lossValue\ndef GetQNNCost(variables, featureValues, labelValues):\n\
    \    \"\"\" Minimizing Cost function\n    \"\"\"\n    predictions = [GetQNN(variables,\
    \ xcoor=x) for x in featureValues]\n    return GetQNNSquareLoss(labelValues, predictions)\n\
    sincurvevalues = numcal.loadtxt(\"sin_curve_values.txt\")\nxcoordinate= sincurvevalues[:,\
    \ 0]\nycoordinate = sincurvevalues[:, 1]\nnumcal.random.seed(0)\nlayer_recount\
    \ = 4\nvariable_initial = 0.05 * numcal.random.randn(layer_recount, 5)\noptimizer\
    \ = AdamO(0.01, beta1=0.9, beta2=0.999)\nvariable = variable_initial\nfor iteration\
    \ in range(500):\n    var_cost = optimizer.step(lambda v: GetQNNCost(v, xcoordinate,\
    \ ycoordinate), variable)\n    print(\"Iteration value: {:5d} | Cost is: {:0.7f}\
    \ \".format(iteration + 1, GetQNNCost(var_cost, xcoordinate, ycoordinate)))\n\
    ```\n\n## Command\n\n```bash\npip3 install numpy\npip3 install pennylane\npython3\
