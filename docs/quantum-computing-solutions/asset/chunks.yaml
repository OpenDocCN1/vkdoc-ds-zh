    Figure 6-1


    Approximate combinatorial optimization


    Dynamic programming can be used for this problem by breaking it down into subproblems.
    Start at the first city, and for all other cities, create a subproblem starting
    from the new city. These subproblems will create a recursion to identify the cheapest
    travel itinerary for the salesperson.


    The approximate optimization algorithm calculates the optimal itinerary by finding
    the cost of the minimum spanning tree. A minimum spanning tree is a subgroup of
    the connected path of the cities without having cycles and lesser total edge cost.


    Let’s now look at semidefinite programming algorithms.


    ## Semidefinite Programming


    Semidefinite programming is an important technique in optimization. The generality
    is the key principle behind this method. The variable matrix in the optimization
    problem is constrained to be positive semidefinite. The semidefinite programming
    term comes from the constraint related to the positive semidefiniteness.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig2_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Semidefinite programming


    The quantum semidefinite programming technique has the following steps:


    1.  Apply the oracle function for a search violating the constraint.


    2.  Generate a density matrix.


    3.  Calculate the phase estimation of the unitary operator on the density matrix.


    1.  Estimate Tr[e^(- density matrix)].


    2.  Check if the output is λ. If so, return the value λ -1e^^(-λ).


    3.  Execute step 1, and measure the density matrix of the second system.


    4.  If the output is λ, accept it; otherwise, reject it.


    5.  Keep iterating until this step is accepted.


    ```

    density matrix = Σk k λ k | Ψk > < λ k''|

    ```


    Note


    The density matrix represents the statistical state of the quantum system. In
    the classical system, probability distribution is the equivalent.


    Semidefinite programming can be presented mathematically. Given n real numbers
    and c1, cn ∈ R, and p × p Hermitian matrices D : B1,..,...,...Bp, the objective
    is to maximize Transpose (DX) such that Transpose(B i X) < c i X >= 0\. The variable
    X is constrained to be positive semidefinite.


    ![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig3_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Quantum annealing: semidefinite programming


    The problems solved by a semidefinite programming method can be with no constraints
    or with constraints such as equalities and inequalities. The input for the quantum
    semidefinite programming algorithm consists of a sparse matrix, quantum states,
    and quantum operators. A typical sparse matrix has at most n nonzero elements
    per row.


    Quantum annealing is another semidefinite programming technique. It is related
    to the quantum system’s behavior. This helps in solving NP-hard optimization problems.
    An optimization problem like the traveling salesman problem can be solved using
    quantum annealing. The solution is the ground state of the physical system, which
    is based on the Hamiltonian function. The Hamiltonian function describes the energy
    and motion of the physical system. The classical equivalent is the simulated annealing,
    random search, and gradient descent algorithms.


    Note


    The Hamiltonian operator is related to the potential and kinetic energy sum for
    the quantum particles. Hamiltonian is Hermitian. A Hermitian operator’s eigenvalues
    are real, and the eigenfunctions are orthogonal. The eigen value shows the spread
    of the data or characteristic vector of a transformation, which is linear.


    Semidefinite programming is related to using linear programming by replacing the
    vectors with positive semidefinite matrices. It is based on linear programming
    and convex quadratic programming. Semidefinite programming generalizes the linear
    programming by using the block diagonal, symmetric, and semidefinite matrices.
    These methods are used in structural design and control theory–based applications.
    The methods are also used in the chemical industry for identifying how to optimally
    mix chemical materials.


    The maximum cut problem is a well-known problem where semidefinite programming
    is applied. The maximum cut problem is related to identifying a maximum cut in
    a graph. In a given network or a graph, the goal is to identify a subgroup of
    vertices based on the size of the edges between the vertices. The maximum cut
    problem is used in large-scale integration applications.


    The input for the problem is the number of vertices, edges, and adjacency list
    with weights of the edges. Every edge has the origin and the destination. The
    goal is to identify the cut that has the highest total weight of the edges.


    Now let’s look at a semidefinite programming example in Python.


    The mathematical problem is as follows:


    minimize Transpose (CX)


    such that Transpose(A i X) < b i X >= 0\. Variable X is constrained to be positive
    semidefinite.


    In the following Python code, CMatrix is generated randomly. The A and b matrices
    are also generated randomly. CVXPy has a mathematical API to solve convex optimization
    problems. The optimum value is calculated for the generated problem.


    ### Code Sample


    ```

    import cvxpy as cvxp

    import numpy as nump

    n = 3

    p = 3

    nump.random.seed(1)

    CMat = nump.random.randn(n, n)

    AMat = []

    bMat = []

    for i in range(p):

    AMat.append(nump.random.randn(n, n))

    bMat.append(nump.random.randn())

    XMat = cvxp.Variable((n,n), symmetric=True)

    constraints = [XMat >> 0]

    constraints += [

    cvxp.trace(AMat[i]@XMat) == bMat[i] for i in range(p)

    ]

    problem = cvxp.Problem(cvxp.Minimize(cvxp.trace(CMat@XMat)), constraints)

    problem.solve()

    print("The optimal value of the problem is", problem.value)

    print("A solution X is")

    print(XMat.value)

    ```


    ### Command


    ```

    pip3 install cvxpy

    pip3 install nump

    python3 sdp_cvx.py

    ```


    ### Output


    The optimal value of the problem is 2.654351510231541


    A solution X is


    ```

    [[ 1.60805795 -0.59770492 -0.69576152]

    [-0.59770492  0.22229041  0.24689363]

    [-0.69576152  0.24689363  1.39679885]]

    ```


    Similarly, real-life problems can be either maximize or minimize problems. They
    can be modeled as in the previous code with constraints modeled as linear equations.'
  trans: "\n# 初始设置\n\n你需要安装 `Python 3.5` 才能运行本章中的代码示例。你可以从 [`www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
    \ 下载它。\n\n# 近似优化算法\n\n在本节中，我们将介绍近似算法，例如半定规划和近似组合优化。\n\n近似组合优化有助于快速找到接近最优值的解。然而，该技术可能无法给出最佳解。该方法有助于为旅行商问题找到一条短路径。旅行商问题描述的是，一个推销员需要在\
    \ `M` 个城市之间旅行。推销员可以每个城市只访问一次，但需要回到起点。经典的解决方案是将第一个城市设为起点和终点。下一步是识别城市的所有可能排列 `(M-1)!`。需要检查每个排列的成本或目标。该问题的目标是识别成本最低的排列。见图\
    \ 6-1。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig1_HTML.jpg](img/490826_1_En_6_Fig1_HTML.jpg)\n\
    \n*图 6-1 – 近似组合优化*\n\n针对此问题，可以使用动态规划，将其分解为子问题。从第一个城市开始，对于所有其他城市，创建一个从新城市开始的子问题。这些子问题将形成递归，以识别销售人员最便宜的旅行路线。\n\
    \n近似优化算法通过计算最小生成树的成本来确定最优路线。最小生成树是城市连通路径的一个子集，它没有环路，且总边成本较低。\n\n现在让我们来看一下半定规划算法。\n\
    \n## 半定规划\n\n半定规划是优化中的一项重要技术。通用性是该方法背后的关键原理。优化问题中的变量矩阵被约束为半正定矩阵。“半定规划”这个术语来源于与半正定性相关的约束条件。\n\
    \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig2_HTML.jpg](img/490826_1_En_6_Fig2_HTML.jpg)\n\
    \n*图 6-2 – 半定规划*\n\n量子半定规划技术包含以下步骤：\n\n1.  应用预言函数进行违反约束的搜索。\n2.  生成一个密度矩阵。\n3.\
    \  计算密度矩阵上酉算子的相位估计。\n    a.  估算 `Tr[e^(-密度矩阵)]`。\n    b.  检查输出是否为 `λ`。如果是，则返回值\
    \ `λ -1e^^(-λ)`。\n4.  执行步骤 1，并测量第二个系统的密度矩阵。\n5.  如果输出是 `λ`，则接受它；否则，拒绝它。\n6.  不断迭代，直到这一步被接受。\n\
    \n```\n密度矩阵 = Σk k λ k | Ψk > < λ k'|\n```\n\n> **注意：** 密度矩阵表示量子系统的统计状态。在经典系统中，概率分布与其等价。\n\
    \n半定规划可以用数学方式表示。给定 `n` 个实数 `c1, cn ∈ R`，以及 `p × p` 厄米矩阵 `D : B1,..,...,...Bp`，目标是最大化\
    \ `Transpose (DX)`，满足 `Transpose(B i X) < c i X >= 0`。变量 `X` 被约束为半正定矩阵。\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig3_HTML.jpg](img/490826_1_En_6_Fig3_HTML.jpg)\n\
    \n*图 6-3 – 量子退火：半定规划*\n\n通过半定规划方法解决的问题可以是无约束的，也可以是带有等式和不等式等约束条件的。量子半定规划算法的输入包括一个稀疏矩阵、量子态和量子算子。一个典型的稀疏矩阵每行最多有\
    \ `n` 个非零元素。\n\n量子退火是另一种半定规划技术。它与量子系统的行为相关。这有助于解决 NP 难优化问题。像旅行商这样的优化问题可以使用量子退火来解决。解是物理系统的基态，它基于哈密顿函数。哈密顿函数描述了物理系统的能量和运动。经典的等价算法是模拟退火、随机搜索和梯度下降算法。\n\
    \n> **注意：** 哈密顿算子与量子粒子的势能和动能之和相关。哈密顿算子是厄米的。厄米算子的特征值是实数，且特征函数是正交的。特征值显示了数据的分布或线性变换的特征向量。\n\
    \n半定规划与线性规划相关，是通过将向量替换为半正定矩阵来实现的。它基于线性规划和凸二次规划。半定规划通过使用块对角矩阵、对称矩阵和半定矩阵来推广线性规划。这些方法用于结构设计和基于控制理论的应用中。这些方法也用于化学工业，以确定如何最优地混合化学材料。\n\
    \n最大割问题是一个应用了半定规划的著名问题。最大割问题与在图中识别最大割有关。在一个给定的网络或图中，目标是根据顶点之间边的权重来识别一个顶点子集。最大割问题用于大规模集成电路应用。\n\
    \n该问题的输入是顶点数、边数和带边权重的邻接表。每条边都有起点和终点。目标是识别具有最高总边权重的割。\n\n现在让我们来看一个 `Python` 中的半定规划示例。\n\
    \n数学问题如下：\n\n最小化 `Transpose (CX)`\n\n满足 `Transpose(A i X) < b i X >= 0`。变量 `X`\
    \ 被约束为半正定矩阵。\n\n在以下 `Python` 代码中，`CMatrix` 是随机生成的。`A` 和 `b` 矩阵也是随机生成的。`CVXPy`\
    \ 提供了一个用于解决凸优化问题的数学 API。针对生成的问题计算最优值。\n\n### 代码示例\n\n```python\nimport cvxpy as\
    \ cvxp\nimport numpy as nump\nn = 3\np = 3\nnump.random.seed(1)\nCMat = nump.random.randn(n,\
    \ n)\nAMat = []\nbMat = []\nfor i in range(p):\n    AMat.append(nump.random.randn(n,\
    \ n))\n    bMat.append(nump.random.randn())\nXMat = cvxp.Variable((n,n), symmetric=True)\n\
    constraints = [XMat >> 0]\nconstraints += [\n    cvxp.trace(AMat[i]@XMat) == bMat[i]\
    \ for i in range(p)\n]\nproblem = cvxp.Problem(cvxp.Minimize(cvxp.trace(CMat@XMat)),\
    \ constraints)\nproblem.solve()\nprint(\"The optimal value of the problem is\"\
    , problem.value)\nprint(\"A solution X is\")\nprint(XMat.value)\n```\n\n### 命令\n\
    \n```\npip3 install cvxpy\npip3 install nump\npython3 sdp_cvx.py\n```\n\n### 输出\n\
    \n```\nThe optimal value of the problem is 2.654351510231541\nA solution X is\n\
    [[ 1.60805795 -0.59770492 -0.69576152]\n [-0.59770492  0.22229041  0.24689363]\n\
    \ [-0.69576152  0.24689363  1.39679885]]\n```\n\n类似地，现实生活中的问题可以是最大化或最小化问题。它们可以像前面代码一样建模，并将约束条件建模为线性方程。\n"
- fmt: "# QAOA\n\nQuantum approximate optimization (QAOA) algorithms are related to\
    \ identifying the solution to an optimization problem using polynomial time methods\
    \ (see Figure [6-4](#490826_1_En_6_Chapter.xhtml#Fig4)). Typical problems solved\
    \ by QAOA are NP-hard problems.\n\nQAOA methods are executed on a quantum virtual\
    \ machine. Problems such as max cut and graph partitioning are solved using QAOA.\
    \ The QAOA methods have the following steps:\n\n1.  Encode the cost function using\
    \ Pauli operators.\n2.  Model the problem using a quantum computing framework\
    \ and the algorithm.\n3.  Calculate the ground state solution using sampling.\n\
    \n**Tip**\n\nThe Pauli operator is related to angular momentum operations. An\
    \ angular momentum operation represents the spin of a quantum particle in three\
    \ spatial directions.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig4_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig4_HTML.jpg)\n\
    \nFigure 6-4 – Quantum approximate optimization\n\nThe maximum cut problem can\
    \ be solved using the QAOA method and is related to identifying a maximum cut\
    \ in a graph. The ground state is modeled using a Hamiltonian function, and the\
    \ state is measured. The multibody quantum state is measured, which yields a max\
    \ cut solution with higher probability. In a given network or a graph, the goal\
    \ is to identify a subgroup of vertices based on the size of the edges between\
    \ the vertices.\n\nLet’s look at a real-life problem where QAOA can be applied\
    \ (see Figure [6-5](#490826_1_En_6_Chapter.xhtml#Fig5)). Traffic modeling in transportation\
    \ depends on traffic zones, trip tables, highway networks, vehicle capacity, and\
    \ land-use models. Land-use models consist of trends, land use and zoning plans,\
    \ activity areas, and maps. A transportation system has streets, highways, parking,\
    \ speeds, travel times, and speed limits. A transportation network will have traffic\
    \ volumes and vehicle capacities. Travel patterns identify the mode use, typical\
    \ source to destination paths, and trip characteristics. Wardrop’s first principle\
    \ is based on network and road user balance. The journey times of all the paths\
    \ used are equal and less than the unused path by one vehicle. This principle\
    \ helps in minimizing the average time for a trip. There are other principles\
    \ and algorithms to balance the road user and network traffic flow.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig5_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig5_HTML.jpg)\n\
    \nFigure 6-5 – Transportation planning: factors\n\n## Transportation Planning:\
    \ Factors\n\nTrips are generated based on the source, destination, vehicle, and\
    \ city transportation network. The network has vehicles, cyclists, and pedestrians\
    \ in different time zones and space constantly moving. Transportation planning\
    \ is a continuous activity, and the street network infrastructure keeps getting\
    \ updated. Traffic modeling is done using techniques such as simulation and machine\
    \ learning. Traffic control is done using the historical data, estimating the\
    \ number of vehicles during a time period, and managing the flow of the traffic\
    \ across the network.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig6_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig6_HTML.jpg)\n\
    \nFigure 6-6 – Traffic planning: AI and machine learning\n\nThe max flow–min cut\
    \ approach is used to maximize the flow of the traffic in a transportation network.\
    \ This approach is based on the maximum flow of traffic from source to destination\
    \ and is the same as the minimum cut to separate the source from the destination.\
    \ This approach can be applied to a computer network packet flow.\n\nPacket flow\
    \ through a network can be modeled using the max flow–min cut approach. The network\
    \ has the information flow through the nodes to reach the destination. The goal\
    \ is to maximize the number of packets that can flow through a computer network.\n\
    \n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig7_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig7_HTML.jpg)\n\
    \nFigure 6-7 – Packet flow: computer network\n\nSimilarly, this method can be\
    \ used for assigning students a dorm based on the condition that every student\
    \ wants to live in their own dorm of choice. The goal is to maximize the number\
    \ of students who get dorms.\n\nLet’s look at how QAOA can be used for a max cut\
    \ solution in Python. The Grove framework and PyQuil are used in the following\
    \ example.\n\n### Code Sample\n\n```python\nimport numpy as nump\nfrom grove.pyqaoa.maxcut_qaoa\
    \ import maxcut_qaoa\nimport pyquil.api as pyquilapi\n\nqvm_session = pyquilapi.QVMConnection()\n\
    configuration_ring = [(0,1),(1,2),(2,3),(3,0)]\nsteps = 2\ninst = maxcut_qaoa(graph=configuration_ring,\
    \ steps=steps)\nbetas, gammas = inst.get_angles()\nt = nump.hstack((betas, gammas))\n\
    param_program = inst.get_parameterized_program()\nprogram = param_program(t)\n\
    wave_function = qvm_session.wavefunction(program)\nwave_function = wave_function.amplitudes\n\
    for state_index in range(inst.nstates):\n    print(inst.states[state_index], nump.conj(wave_function[state_index])*wave_function[state_index])\n\
    ```\n\n### Command\n\n```bash\npip3 install nump\npip3 install grove\npip3 install\
    \ pyquil\nqvm  -S  (separate terminal window1)\npython3 qaoa.py  (terminal window2)\n\
    ```\n\n### Output\n\n```text\n0000 (5.030591151913648e-10+0j)\n0001 (7.986230289234977e-06+0j)\n\
    0010 (7.986230289234498e-06+0j)\n0011 (2.2019121467156433e-07+0j)\n0100 (7.98623028923483e-06+0j)\n\
    0101 (0.49996761419335345+0j)\n0110 (2.2019121467149302e-07+0j)\n0111 (7.98623028923475e-06+0j)\n\
    1000 (7.98623028923475e-06+0j)\n1001 (2.2019121467149302e-07+0j)\n1010 (0.49996761419335345+0j)\n\
    1011 (7.98623028923483e-06+0j)\n1100 (2.2019121467156433e-07+0j)\n1101 (7.986230289234498e-06+0j)\n\
    1110 (7.986230289234977e-06+0j)\n1111 (5.030591151913648e-10+0j)\n```\n\n`0101`\
    \ and `1010` have `0.499` wave function amplitudes. These are the max cuts in\
    \ the configuration. Figure [6-8](#490826_1_En_6_Chapter.xhtml#Fig8) shows the\
    \ `0101` configuration.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig8_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig8_HTML.jpg)\n\
    \nFigure 6-8 – `0101` configuration\n\nFigure [6-9](#490826_1_En_6_Chapter.xhtml#Fig9)\
    \ shows the `1010` configuration.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig9_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig9_HTML.jpg)\n\
    \nFigure 6-9 – `1010` configuration\n\nSimilarly, the traffic network and computer\
    \ network can be represented as shown in the previous code. The constraints can\
    \ be added using the traffic limits and network node capacities. The objective\
    \ in that case will be to maximize the flow and minimize the cut.\n\nLet’s now\
    \ look at the combinatorial optimization algorithms.\n\n## Combinatorial Optimization\n\
    \nCombinatorial optimization is used to solve real-life problems such as the traveling\
    \ salesman problem and diet calculations for a person. The optimization algorithm\
    \ uses possible inputs and finds the maximum or minimum output. Let’s say `c(x)`\
    \ is the goal function. If the goal is to maximize `c(x)` and the constraints\
    \ modeled are `d(x)` and `b(x)`, then we have the following:\n\n```text\nd(x)\
    \ < 0\nb(x) = 0\n```\n\nCombinatorial optimization algorithms find the solution\
    \ that maximizes the goal function with discrete values. The optimization algorithm\
    \ is called *linear programming* if the goal function and the constraints are\
    \ linear.\n\nClassic optimization algorithms have equivalents in quantum optimization.\
    \ We’ll look at the quantum semidefinite programming methods in the next section.\n\
    \nNow let’s look at quantum nondeterministic polynomial algorithms which are based\
    \ on quantum semidefinite programming."
