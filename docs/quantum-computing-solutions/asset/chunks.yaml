    Now, let’s look at the classic search algorithm.


    ## Classic Search


    In a classic search algorithm, an item is identified as having a particular attribute
    in a given set of `M` items. An item may or may not have the specified attribute.
    The search algorithm has complexity proportional to the count of queries to identify
    the particular item. These items are typically stored in a data store and split
    into different entities in a relational database. If the data store is NoSQL,
    they are stored in different collections. The items can be sorted or filtered
    based on an attribute or value, respectively.


    Let’s look at the quantum search algorithm.


    ## Quantum Search


    Quantum computers can be used for search algorithms execution. The superposition
    state helps to reduce complexity of search in quantum algorithms. The quantum
    search algorithms are proportional to `√M` queries. Quantum search is modeled
    using wave-like amplitudes and interference concepts. See Figure [11-8](#490826_1_En_11_Chapter.xhtml#Fig8).


    ![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig8_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig8_HTML.jpg)


    **Figure 11-8** – Quantum search


    Let’s now look at multi-element antenna arrays. In a multi-element antenna array,
    different phases can create radiation in a specific direction. The array analysis
    is performed using unitary transformations, and the amplitudes square results
    in the probabilities of the individual components. The transformations are based
    on the rotation and reflection of the components. This example is similar to quantum
    search. Quantum search identifies a sequence of quantum logic gates that finds
    a solution to a real-life problem. The algorithm is proportional to the amplitude
    of the particular time in context. Quantum search algorithms are popular and solve
    many real-life problems.


    > **Tip:** The quantum search algorithm is based on a quantum circuit that has
    Hadamard and CNOT gates.


    Let’s look at quantum deep learning in detail.


    ## Quantum Deep Learning


    Quantum algorithms are used to solve complex real-life problems. Deep learning
    is a popular technique used in quantum algorithms. The quantum computation framework,
    based on the Boltzmann machine, helps to provide a quantum deep learning framework.
    The framework helps in the process of learning and training the machine learning
    models.


    Quantum machine learning is based on the quantum data and hybrid quantum classical
    models. The quantum data model is based on the quantum data source and uses the
    quantum computer–generated data. The model is based on the superposition and entanglement
    principles. A Hilbert space of `2^53` elements that represents joint probability
    distribution can be solved using a quantum computer. A Quantum Tensor Flow framework
    has the infrastructure concepts to create machine learning models that can use
    the quantum data models and algorithms. Quantum data models can be used in chemical
    simulation, quantum matter modeling, quantum control, quantum communication networks,
    and quantum metrology.


    Hybrid quantum classical models are used for data generalization and solved using
    hybrid quantum classical techniques. A quantum neural network is one of the techniques
    that is based on the parameterized quantum computational model.


    > **Tip:** Quantum deep learning is used in the area of quantum pattern recognition
    for classification.


    Quantum machine learning is applied in real-life scenarios. For instance, quantum
    chemistry problems are related to optimizing high-dimensional and difficult cost
    functions. The quantum computing framework is applied to solve computationally
    challenging problems with methods such as the variational quantum eigensolver.


    A variational quantum eigensolver is about identifying the eigenvalues of certain
    operators. Eigen value identification is a complex and challenging problem. The
    quantum phase estimation method can be applied to compute the eigenvalue of a
    given eigenvector. You can optimize a variational circuit in lowering the squared
    energy expectation of a user-defined Hamiltonian. The Hamiltonian can be expressed
    as a sum of two Pauli operators.


    ### Code Sample


    ```

    import pennylane as quantumDeepL

    from pennylane import numpy as npython

    from pennylane.optimize import GradientDescentOptimizer as GDOpt

    dev = quantumDeepL.device(''default.qubit'', wires=2)

    def FindAnsatz():

    quantumDeepL.Rot(0.3, 1.8, 5.4, wires=1)

    quantumDeepL.RX(-0.5, wires=0)

    quantumDeepL.RY( 0.5, wires=1)

    quantumDeepL.CNOT(wires=[0, 1])

    @quantumDeepL.qnode(dev)

    def FindCircuitX():

    FindAnsatz()

    return quantumDeepL.expval(quantumDeepL.PauliX(1))

    @quantumDeepL.qnode(dev)

    def FindCircuitY():

    FindAnsatz()

    return quantumDeepL.expval(quantumDeepL.PauliY(1))

    def getCost(var):

    expX = FindCircuitX()

    expY = FindCircuitY()

    return (var[0] * expX + var[1] * expY) ** 2

    optimizer = GDOpt(0.5)

    variables = [0.3, 2.5]

    variables_gd = [variables]

    for i in range(20):

    variables = optimizer.step(getCost, variables)

    variables_gd.append(variables)

    print(''Cost - step {:5d}: {: .7f} | Variable values: [{: .5f},{: .5f}]''

    .format(i+1, getCost(variables), variables[0], variables[1]) )

    ```


