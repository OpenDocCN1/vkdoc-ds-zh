- fmt: '## Quantum Clustering


    The quantum clustering algorithm (see Figure [10-9](#490826_1_En_10_Chapter.xhtml#Fig9))
    is based on the gradient descent technique. It is used to find the quantum potential
    at a constant learning rate and computing the cluster center. Using quantum mechanics–based
    principles, quantum clustering techniques find groups with complex shapes. The
    technique identifies the group of any shape by computing the group center.


    ![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig9_HTML.jpg](images/490826_1_En_10_Chapter/490826_1_En_10_Fig9_HTML.jpg)


    **Figure 10-9** Quantum clustering


    Quantum clustering is based on the inversion problem in quantum mechanics. The
    quantum clustering technique helps to get a particle distribution that is estimated
    based on the potential function. The algorithm finds the group center. For each
    group in the center, it assigns the center. The wave function is identified from
    the Schrodinger equation solution.


    Let’s look at the steps for the quantum clustering algorithm:


    1. The weights for each data feature are identified, and the parameters are selected
    based on the input data.

    2. The number of groups/measurement scale is set to zero.

    3. The weighted measures are calculated based on the quantum clustering distance
    method.

    4. The parameter and the potential energy based on the data are estimated.

    5. The group number is increased by 1.

    6. The minimum potential energy is identified at the group’s center.

    7. All the data points are grouped by the distance metric, and it needs to be
    less than the measurement scale. The algorithm ends when the number of data points
    is zero for the distance metric criterion. Otherwise, the algorithm goes back
    to step 5.


    The quantum clustering algorithm has a single parameter. The algorithm is partition
    based and is an unsupervised learning technique. The processing time is higher
    because of the preprocessing required for grouping. The measurement scale is static,
    and the method is not dependent on the features. In this method, the precision
    of the grouping is dependent on the amount of learning.


    > **Tip:** A quantum system is deterministic in time and space and described by
    a wave function.


    Let’s look at a code example for the quantum clustering technique.'
