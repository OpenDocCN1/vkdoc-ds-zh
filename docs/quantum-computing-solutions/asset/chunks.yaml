  trans: '

    # 量子密钥分发


    量子密钥分发（见图 13-3）与企业长期安全相关。它基于量子密码学，而量子密码学又建立在量子物理学基础之上。它有助于加密对称密钥的安全分发。量子粒子通过光网络进行传输，这些粒子即光子。


    量子密钥分发是指基于密码技术和协议来分发与共享秘密密钥。这些秘密密钥是私有的，并在双方之间交换。如果密钥被篡改，其量子特性将不再有效。企业安全解决方案基于开源的量子密钥分发软件。目前这些安全技术仍处于研究阶段。针对使用量子密钥分发软件的系统发起的安全攻击是一个特殊的研究领域。


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig3_HTML.jpg](img/490826_1_En_13_Fig3_HTML.jpg)


    图 13-3


    量子密码学


    研究中使用的量子密码技术基于完全混合和高速抵抗方法。以下方法，如 `McEliece`、`NTRU` 和基于格的加密，在应对使用量子方法的安全攻击方面仍处于研究阶段。量子方法基于哈希、编码、格和多元二次算法。见图
    13-4。


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig4_HTML.jpg](img/490826_1_En_13_Fig4_HTML.jpg)


    图 13-4


    量子密码技术


    量子密钥分发基于光纤或自由空间量子信道。该量子信道用于将光的量子态从源发送端传输到目标接收端。在这种情况下，量子信道并非安全。双方之间的量子通信链路通过身份验证来确保安全。量子密钥交换协议基于量子特性。


    新兴的量子互联网基于量子密码应用、量子密钥分发和安全标识。量子密钥分发利用了量子力学的力量。在基于量子密钥分发的通信中检测到的干扰很难被改变，这有助于保护信息安全。


    量子密钥分发方法基于离散变量和连续变量。例如，`Silberhorn` 和 `Grangier` 是量子密钥分发方法。`Frodo` 和 `Sike` 基于量子密钥交换。`Picnic`
    和 `Tesla` 使用签名方法。量子密码系统基于多元、椭圆、格、同源、哈希和混合签名。


    **提示**


    量子密钥分发基于光子（即数据比特）的密码数据交换。


    现在，让我们来看一下量子隐形传态技术。


    # 量子隐形传态


    量子隐形传态是将量子态从源位置传输到目标位置，且不改变其实际状态的过程。量子隐形传态基于量子物理学中的量子纠缠原理。纠缠涉及多个粒子具有互斥状态的情况。互斥意味着找到一个粒子的状态，用于计算下一个粒子的状态。两个量子纠缠的光子可以知晓对方光子的状态。见图
    13-5。


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig5_HTML.jpg](img/490826_1_En_13_Fig5_HTML.jpg)


    图 13-5


    量子纠缠


    每个光子可以具有以下四种不同的贝尔态：


    - `00 + 11`

    - `00 – 11`

    - `01 + 10`

    - `01 – 10`


    量子隐形传态过程始于在量子信道中纠缠一对光子。光子 `X` 由爱丽丝发送，光子 `Y` 发送给接收者鲍勃。当爱丽丝对 `X` 执行操作时，鲍勃可以看到 `Y`
    的状态变化。假设爱丽丝拥有量子态未知的光子 `Z`，她希望将此状态隐形传态到光子 `Y` 中。对光子 `X` 和 `Z` 进行贝尔测量。由于 `X` 和 `Y`
    是纠缠的，`Y` 的量子态可以转变为 `Z` 的量子态。鲍勃可以利用爱丽丝的贝尔测量结果完成隐形传态。爱丽丝通过经典通信信道发送贝尔测量结果，鲍勃据此知道如何将
    `Y` 变为 `Z` 的状态。见图 13-6。


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig6_HTML.jpg](img/490826_1_En_13_Fig6_HTML.jpg)


    图 13-6


    量子纠缠


    让我们来看另一种形式的量子纠缠。爱因斯坦-波多尔斯基-罗森（EPR）对由处于最大纠缠态的光子组成。爱丽丝拥有其中一个 EPR 光子，鲍勃拥有另一个。在量子隐形传态和量子纠缠中，粒子可以是任意类型的光子、原子和轻子。粒子可以具有两个自由度。粒子的量子态可以编码为量子比特。


    量子隐形传态过程基于不可克隆定理。不可克隆定理有助于确保不存在任何方法可以将未知量子态从一个系统复制到另一个系统。见图 13-7。


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig7_HTML.jpg](img/490826_1_En_13_Fig7_HTML.jpg)


    图 13-7


    量子纠缠


    **提示**


    量子隐形传态由陆朝阳、潘建伟及其同事于 2015 年发现。


    现在让我们开始探讨量子纠缠和量子隐形传态的实现。首先介绍布洛赫球面，它用于可视化量子比特向量。见图 13-8。


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig8_HTML.jpg](img/490826_1_En_13_Fig8_HTML.jpg)


    图 13-8


    布洛赫球面


    让我们通过代码来了解布洛赫球面。


    ## 代码示例


    ```

    from qiskit import Aer as qisAer

    from qiskit import QuantumCircuit as QC

    from qiskit import execute

    from matplotlib import pyplot as plot

    from qiskit.tools.visualization import plot_bloch_multivector as bloch_state_vector

    quantum_circuit = QC(1, 1)

    quantum_circuit.x(0)

    simulator = qisAer.get_backend(''statevector_simulator'')

    result = execute(quantum_circuit, backend=simulator).result()

    statevector = result.get_statevector()

    print(''\n statevector is '', statevector)

    bloch_state_vector(statevector)

    plot.savefig("images/statevector.png")

    plot.show()

    simulator = qisAer.get_backend(''unitary_simulator'')

    result = execute(quantum_circuit, backend=simulator).result()

    unitary_matrix = result.get_unitary()

    print(''\nunitary matrix is \n'', unitary_matrix)

    ```


    ## 命令


    ```

    pip3 install qiskit

    python3 BlochSphere.py

    ```


