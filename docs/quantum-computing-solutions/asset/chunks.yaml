    ```

    execute the qasm simulator...

    counts are : {''0100'': 230, ''0010'': 229, ''0101'': 296, ''0011'': 269}

    ```


    Figure [13-12](#490826_1_En_13_Chapter.xhtml#Fig12) shows quantum teleportation,
    and Figure [13-13](#490826_1_En_13_Chapter.xhtml#Fig13) shows the quantum teleportation
    results.


