- fmt: "### Grover’s Algorithm\n\n`Grover’s` algorithm is used for searching a database.\
    \ The search algorithm can find an entry in a database of `M` entries with `O(√N)`\
    \ time and `O(logN)` space. This method was found by Lov Grover in 1996. He found\
    \ that his method gave a quadratic speedup compared to other quantum algorithms.\
    \ In addition, `Grover’s` method gives exponential speed over the classical equivalents.\n\
    \n`Grover’s` algorithm inverts a function. Let’s say `y = g(x)`. `Grover’s` algorithm\
    \ finds `x` when `y` is given as input. Searching for a value of `y` in the database\
    \ is similar to finding a match of `x`. It is popular when solving NP-hard problems\
    \ by using exhaustive search over a possible set of solutions. You can use `Grover’s`\
    \ algorithm to search for a phone number in a phone book of `M` entries in `√M`\
    \ steps.\n\n`Grover’s` algorithm consists of the following steps:\n\n1.  Initialize\
    \ the system to the state.\n2.  Execute the Grover iteration `r(M)` times.\n3.\
    \  Measure the amplitude `Ω`.\n4.  From `Ωw` (result), find `w`.\n\nLet’s look\
    \ at the implementation of `Grover’s` algorithm in Python.\n\n`Grover’s` search\
    \ algorithm searches the target value of a group by computing the mean amplitude\
    \ and `Grover’s` amplitude. The plot of the graph is computed from the amplitudes\
    \ derived from `Grover’s` algorithm. The plot presents the target value with the\
    \ highest amplitude. The `ApplyOracleFunction` method takes input `x` and returns\
    \ the output as the hex digest of `x`. `ApplyGrover’s` algorithm takes as input\
    \ the target, objects, `nvalue`, and rounds. The amplitude is returned as the\
    \ output.\n\nThe target of the algorithm is to search for `9` in the group of\
    \ string objects `{'14', '5', '13', '7','9','11','97'}`. The amplitude is searched\
    \ from the dictionary (group of string objects) based on the value `1 / square\
    \ root of the length of the set (9)`.\n\n#### Code Sample\n\n**Grovers_Algorithm.py**\n\
    \n```python\nimport matplotlib.pyplot as plot\nimport numpy as nump\nimport string\n\
    import hashlib\nfrom math import sqrt, pi\nfrom collections import OrderedDict\n\
    from statistics import mean\n\ndef RenderGraph(amplitude_value, n):\n    y_position\
    \ = nump.arange(n)\n    plot.bar(y_position, amplitude_value.values(), align=\"\
    center\", color=\"g\")\n    plot.xticks(y_position, amplitude_value.keys())\n\
    \    plot.ylabel('Amplitude Value')\n    plot.title('Grovers Algorithm')\n   \
    \ plot.show()\n\ndef ApplyOracleFunction(xvalue):\n    return hashlib.sha256(bytes(xvalue,\
    \ 'utf-8')).hexdigest()\n\ndef ApplyGroverAlgorithm(target, objects, nvalue, rounds):\n\
    \    y_pos = nump.arange(nvalue)\n    amplitude = OrderedDict.fromkeys(objects,\
    \ 1/sqrt(nvalue))\n    for i in range(0, rounds, 2):\n        for k, v in amplitude.items():\n\
    \            if ApplyOracleFunction(k) == target:\n                amplitude[k]\
    \ = v * -1\n        average = mean(amplitude.values())\n        for k, v in amplitude.items():\n\
    \            if ApplyOracleFunction(k) == target:\n                amplitude[k]\
    \ = (2 * average) + abs(v)\n                continue\n            amplitude[k]\
    \ = v-(2*(v-average))\n    return amplitude\n\ntarget_algorithm = '9'\nobjects_grover\
