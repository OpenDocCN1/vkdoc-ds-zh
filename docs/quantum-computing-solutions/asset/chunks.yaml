    ## Vectors


    A *vector* is defined as an ordered set of n real numbers. Here’s an example:


    ```

    C = (c1,c2,c3,.....cn)

    C is an n-dimensional vector.

    ```


    Vectors addition is calculated by taking the corresponding dimensional elements
    and adding them. Similarly, subtraction of the vectors is calculated by subtracting
    the elements of each dimension.


    ```

    C = (c1,c2,c3,.....cn)

    D = (d1, d2, d3,... dn)

    C + D = (c1+d1, c2+d2,..., cn+dn)

    C - D = (c1-d1, c2-d2,..., cn-dn)

    ```


    Multiplication of vectors by scalars is done by multiplying the scalar to every
    dimensional element.


    ```

    E = sF = (sf1, sf2, .....,sfn)

    ```


    Now let’s look at a code sample in Python to show the vector operations such as
    dot product, scalar multiplication, sum, difference, product, and division.


    ### Code Sample


    **vector_operations.py**


    ```

    from numpy import array

    vector1 = array([1, 2, 3])

    vector2 = array([2, 3, 4])

    print("dot product of", vector1,", ",vector2,"is")

    product = vector1.dot(vector2)

    print(product)

    scalarval = 0.3

    scalarprod = scalarval*vector1

    print("scalar multiplied",scalarval,",",vector1,"is")

    print(scalarprod)

    print("sum of", vector1,", ",vector2,"is")

    sum = vector1 + vector2

    print(sum)

    print("difference of", vector1,", ",vector2,"is")

    diff = vector1 - vector2

    print(diff)

    print("product of", vector1,", ",vector2,"is")

    prod = vector1 * vector2

    print(prod)

    print("division of", vector1,", ",vector2,"is")

    dividedby = vector1 / vector2

    print(dividedby)

    ```


    ### Command for Execution


    ```

    pip3 install bumpy

    python3 vector_operations.py

    ```


    ### Output


    ```

    dot product of [1 2 3] ,  [2 3 4] is


    scalar multiplied 0.3 , [1 2 3] is

    [0.3 0.6 0.9]

    sum of [1 2 3] ,  [2 3 4] is

    [3 5 7]

    difference of [1 2 3] ,  [2 3 4] is

    [-1 -1 -1]

    product of [1 2 3] ,  [2 3 4] is

    [ 2  6 12]

    division of [1 2 3] ,  [2 3 4] is

    [0.5        0.66666667 0.75      ]

    ```


    ## Matrices


    A *matrix* is the rectangular configuration of the numbers in rows and columns.
    It is represented by open, (), or closed, [], brackets. The entries in the matrix
    are called *elements* of the matrix. The order of the matrix is defined as the
    number of rows and columns. For example, for `A = [1 2]`, `1×2` is the order of
    the matrix.


    A *row* matrix is one that has only one row and any number of columns. `A = [1,2,3]`
    is a row matrix. A *column* matrix is the one that has only one column and any
    number of rows.


    Figure [2-8](#490826_1_En_2_Chapter.xhtml#Fig8) shows a 2×2 matrix.


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig8_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    2×2 matrix


    Figure [2-9](#490826_1_En_2_Chapter.xhtml#Fig9) shows an example of the column
    matrix.


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig9_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig9_HTML.jpg)


    Figure 2-9


    Column matrix


    These are different types of matrices:


    *   Row matrix

    *   Column matrix

    *   Singleton matrix

    *   Null matrix

    *   Rectangular matrix

    *   Square matrix


    A *singleton* matrix is a matrix with only one element. For example, `A = [1]`
    is a singleton matrix. A *null* matrix is a matrix with all elements zero; for
    example, `A = [0 0]` is a zero or null matrix. A *rectangular* matrix is a matrix
    with the number of rows not equal to the number of columns. See Figure [2-10](#490826_1_En_2_Chapter.xhtml#Fig10).


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig10_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig10_HTML.jpg)


    Figure 2-10


    Rectangular matrix


    A *square* matrix is a matrix with the number of rows equal to the number of the
    columns. See Figure [2-11](#490826_1_En_2_Chapter.xhtml#Fig11).


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig11_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig11_HTML.jpg)


    Figure 2-11


    Square matrix


    A *diagonal* matrix is a square matrix with all elements outside the principal
    diagonal being zeros. See Figure [2-12](#490826_1_En_2_Chapter.xhtml#Fig12).


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig12_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig12_HTML.jpg)


    Figure 2-12


    Diagonal matrix


    An *identity* matrix is a square matrix whose elements of the principal diagonal
    are 1. See Figure [2-13](#490826_1_En_2_Chapter.xhtml#Fig13).


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig13_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig13_HTML.jpg)


    Figure 2-13


    Identity matrix


    A *scalar* matrix is a square matrix whose elements of the principal diagonal
    are equal, and all nondiagonal elements are zero. See Figure [2-14](#490826_1_En_2_Chapter.xhtml#Fig14).


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig14_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig14_HTML.jpg)


    Figure 2-14


    Scalar matrix


    A *triangular* matrix is a square matrix whose elements above or below the principal
    diagonal are equal to zero. The upper triangular matrix has elements below the
    principal diagonal equal to zero (see Figure [2-15](#490826_1_En_2_Chapter.xhtml#Fig15)),
    and the lower triangular matrix has elements above the principal diagonal equal
    to zero (see Figure [2-16](#490826_1_En_2_Chapter.xhtml#Fig16)).


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig16_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig16_HTML.jpg)


    Figure 2-16


    Lower triangular matrix


    ![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig15_HTML.jpg](images/490826_1_En_2_Chapter/490826_1_En_2_Fig15_HTML.jpg)


    Figure 2-15


    Upper triangular matrix


    The *trace* of a matrix is the sum of diagonal elements of a square matrix. It
    is represented by `tr()`. For example, matrix `A` has a trace equal to `tr(A)`.


    Adding matrices is possible for the same types, and the sum is obtained by adding
    the corresponding elements of the matrices. Similarly, subtraction can be done
    on the same type, and the result is obtained by subtracting the corresponding
    elements of the matrices.'
