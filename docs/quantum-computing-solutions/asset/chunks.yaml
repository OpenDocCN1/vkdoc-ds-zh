  raw: '### Deutsch–Jozsa Algorithm


    The Deutsch–Jozsa algorithm was designed by David Deutsch and Richard Jozsa in
    1992\. This algorithm was modified by Richard Cleve and others in 1998\. This
    method is nondeterministic and created a barrier between the quantum and classical
    toughness of the problem. This technique is about quantum amplitudes having positive
    and negative values. The algorithm identifies the black-box oracle function. Figure
    [4-11](#490826_1_En_4_Chapter.xhtml#Fig11) shows an example of an oracle function.


    ![../images/490826_1_En_4_Chapter/490826_1_En_4_Fig11_HTML.jpg](images/490826_1_En_4_Chapter/490826_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    Oracle function


    This algorithm uses a black-box (Oracle) function that takes as input the binary
    values and gives either 0 or 1 as output. The method finds whether the function
    g used is constant or balanced.


    In the next sections, we discuss the algorithm implementation. To start with,
    let’s look at the quantum register. The quantum register has a constructor and
    GetMeasure and ApplyOperation methods. The GetMeasure method computes the quantum
    states and probabilities. The ApplyOperation method updates the class instance
    variable data to the product of the input gate matrix and data instance.


    #### Code Sample


    **Quantum_Register.py**


    ```

    import numpy as nump

    from itertools import product

    from Quantum_Gate import Quantum_Gate

    class Quantum_Register:

    def __init__(self, n_qbits, init):

    self._n = n_qbits

    assert len(init) == self._n

    self._data = nump.zeros((2 ** self._n), dtype=nump.complex64)

    self._data[int(''0b'' + init, 2)] = 1

    def Get_Measure(self):

    probs = nump.real(self._data) ** 2 + nump.imag(self._data) ** 2

    states = nump.arange(2 ** self._n)

    mstate = nump.random.choice(states, size=1, p=probs)[0]

    return f''{mstate:>0{self._n}b}''

    def Apply_Gate(self, gate):

    assert isinstance(gate, Quantum_Gate)

    assert self._n == gate._n

    self._data = gate._data @ self._data

    ```


    Now let’s look at the quantum gate implementation. It has a constructor, matrix
    multiplication, and power methods. The matrix multiplication method operates on
    the input data and the instance data to return a Kronecker product. The power
    method takes the input to return the quantum gate.


    The I, H, X, Y, and Z gates are initialized in this class. The U_Quantum_Gate
    gate method creates a quantum gate based on the input parameters.


    #### Code Sample


    **Quantum_Gate.py**


    ```

    import numpy as nump

    from itertools import product

    class Quantum_Gate:

    def __init__(self, matrix):

    self._data = nump.array(matrix, dtype=nump.complex64)

    assert len(self._data.shape) == 2

    assert self._data.shape[0] == self._data.shape[1]

    self._n = nump.log2(self._data.shape[0])

    assert self._n.is_integer()

    self._n = int(self._n)

    def __matmul__(self, other):

    return Quantum_Gate(nump.kron(self._data, other._data))

    def __pow__(self, n, modulo=None):

    x = self._data.copy()

    for _ in range(n - 1):

    x = nump.kron(x, self._data)

    return Quantum_Gate(x)

    IGate = Quantum_Gate([[1, 0], [0, 1]])

    HGate = Quantum_Gate(nump.array([[1, 1], [1, -1]]) / nump.sqrt(2))

    XGate = Quantum_Gate([[0, 1], [1, 0]])

    YGate = Quantum_Gate([[0, -1j], [1j, 0]])

    ZGate = Quantum_Gate([[1, 0], [0, -1]])

    def U_Quantum_Gate(f, n):

    m = n + 1

    U = nump.zeros((2**m, 2**m), dtype=nump.complex64)

    def bin2int(xs):

    r = 0

    for i, x in enumerate(reversed(xs)):

    r += x * 2 ** i

    return r

    for xs in product({0, 1}, repeat=m):

    x = xs[:~0]

    y = xs[~0]

    z = y ^ f(*x)

    instate = bin2int(xs)

    outstate = bin2int(list(x) + [z])

    U[instate, outstate] = 1

    return Quantum_Gate(U)

    ```


    Functions g1_func, g2_func, g3_func, and g4_func are shown in the code sample.
    g1_func takes v and returns v. g2_func takes v as an input value and returns value
    1\. g3_func takes v and w as input values and returns the binary XOR of v and
    w. g4_func takes v, w, and x as input values and returns a zero value. The CheckIfConstant
    method takes the input function and an integer to validate whether the function
    is a constant or balanced function.


    #### Code Sample


    **Deutsch_Jozsa_Algorithm.py**


    ```

    from Quantum_Register import Quantum_Register

    from Quantum_Gate import HGate, IGate, UGate

    def Check_If_Constant(g, n):

    qr = Quantum_Register(n + 1, ''0'' * n + ''1'')

    qr.Apply_Gate(HGate ** (n + 1))

    qr.Apply_Gate(UGate(g, n))

    qr.Apply_Gate(HGate ** n @ IGate)

    return qr.Get_Measure()[:~0] == ''0'' * n

    def g1_func(v):

    return v

    def g2_func(w):

    return 1

    def g3_func(v, w):

    return v ^ w

    def g4_func(v, w,x):

    return 0

    print(''g(v) = v is {}''.format(''constant function'' if Check_If_Constant(g1_func,
    1) else ''balanced function''))

