    ## Quantum Sort


    A sorting algorithm orders the elements of a group in a specified order. Classical
    sorting methods come in different types.


    *   Bubble


    *   Selection


    *   Merge


    *   Insertion


    *   Quick


    *   Heap


    Bubble, selection, and heap methods operate by shifting the items one by one to
    their final position. Insertion, quick sort, and other methods place the elements
    in a temporary position that is near the final position, as shown in Figure [7-5](#490826_1_En_7_Chapter.xhtml#Fig5).


    ![../images/490826_1_En_7_Chapter/490826_1_En_7_Fig5_HTML.jpg](images/490826_1_En_7_Chapter/490826_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Classical sorting method


    In real life, telephone directories and dictionaries are examples where sorting
    is done by name and alphabetic order, respectively. Sorting can be classified
    into two different techniques.


    *   In-place sorting


    *   Not-in-place sorting


    In-place sorting is about shifting the items within the group and not using extra
    memory or space. Not-in-place sorting is about using extra space for ordering
    the elements. Bubble sort is based on in-place sorting, while merge sort is based
    on not-in-place sorting.


    Let’s look at the quick sort algorithm in Python. The quick sort algorithm picks
    the group of elements to sort them in ascending order. The input for the program
    is 4, 9, 18, 11, 3, 2, 0\. The sorted elements are 0, 2, 3, 4, 9, 11, 18.


