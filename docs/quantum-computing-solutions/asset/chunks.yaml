    \ `D` 是代表粒子运动的硬币算子，`M` 是希尔伯特空间 `GP` 的单位算子。该行走模型基于抛硬币的过程。该计算模型基于对硬币状态进行建模的量子态的叠加。阿达马算子是最常用的硬币算子。应用硬币算子后，再应用一个位移算子。叠加态由\
    \ `m=1` 和 `m=-1` 的叠加产生。掷硬币量子行走中的概率分布不是正态分布。这种量子行走的标准差不是 `√s`，而是与步数 `s` 成正比。假设量子粒子向右移动的概率为\
    \ 1。经过 `s` 步后，粒子位于 `m=s` 处。这种情况被称为*弹道情况*。假设量子粒子的运动具有单位速度。在弹道情况下，量子粒子的速度是自由粒子速度的一半。\n\
    \n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig4_HTML.jpg](img/490826_1_En_11_Fig4_HTML.jpg)\n\
