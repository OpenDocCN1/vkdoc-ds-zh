    \n## 总结\n\n在本章中，我们探讨了应用不同量子技术的量子解决方案。我们结合代码示例详细介绍了配送规划解决方案。\n\n# 13. 演化中的量子解决方案\n\
    \n## 引言\n\n> “量子力学打破了先前框架——经典力学的模式，它确立了科学的预测必然是概率性的。”\n> \n> ——布赖恩·格林\n\n本章涵盖演化中的量子解决方案这一主题。你将看到量子人工智能算法如何在不同真实场景的解决方案中实现。本章涵盖的解决方案涉及量子退火、量子密钥分发和量子隐形传态。\n\
    \n## 初始设置\n\n你需要安装 Python 3.5 来运行本章的代码示例。你可以从 [`www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/)\
    \ 下载。\n\n## 量子退火\n\n量子退火过程与计算低能量解决方案的真实问题相关。量子比特代表具有低值的超导环的能量状态。量子处理单元由超导环构成。每个量子比特在量子退火过程结束后都会达到叠加态。叠加态的值可以是\
    \ 0 或 1。在量子退火过程中，能量从最小值移动到更高值，形成一个谷底，能量图看起来像一个带有两个谷底的双势阱（见图 13-1）。\n\n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig1_HTML.jpg](img/490826_1_En_13_Fig1_HTML.jpg)\
    \  \n图 13-1：量子退火\n\n量子比特处于零或一状态的概率是相同的。这可以通过对量子比特施加外部磁场来改变。具有两个谷底的双势阱是由反相磁场产生的。偏置与外部磁场的定量值相关。耦合器用于将量子比特连接到偏置。（见图\
    \ 13-2。）\n\n![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig2_HTML.jpg](img/490826_1_En_13_Fig2_HTML.jpg)\
    \  \n图 13-2：量子比特级受控场\n\n每个量子比特都有一个偏置。量子比特受到耦合器的影响。对于每个问题，用户可以自主选择偏置和耦合器的值。在量子退火过程中，能量景观由偏置和耦合构成。\n\
    \n> **提示**  \n> 量子退火由 Tadashi Kadowaki 和 Hidetoshi Nishimori 于 1998 年提出。\n"
- fmt: '# Quantum Key Distribution


    Quantum key distribution (see Figure [13-3](#490826_1_En_13_Chapter.xhtml#Fig3))
    is related to long-term security in an enterprise. It is based on quantum cryptography,
    which is based on quantum physics. It helps in the secure distribution of encrypted
    symmetric keys. Quantum particles are sent across the optical network. These particles
    are photons.


    Quantum key distribution is the distribution and sharing of secret keys that are
    based on cryptographic techniques and protocols. The secret keys are private,
    and the keys are exchanged between the two parties. The quantum characteristics
    are not valid if the keys have been tampered with. The enterprise security solutions
    are based on open quantum key distribution software. These security techniques
    are in the research stage at this time. Security attacks on a system that use
    quantum key distribution software are a special research area.


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig3_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig3_HTML.jpg)


    Figure 13-3


    Quantum cryptography


    The quantum cryptographic techniques used in research are based on complete hybrid
    and high-speed resistant methods. The following methods such as `McEliece`, `NTRU`,
    and lattice-based encryption are still in the research stage for security attacks
    using quantum methods. Quantum methods are based on the hash, code, lattice, and
    multivariate quadratic algorithms. See Figure [13-4](#490826_1_En_13_Chapter.xhtml#Fig4).


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig4_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig4_HTML.jpg)


    Figure 13-4


    Quantum cryptographic techniques


    Quantum key distribution is based on a fiber or free-space quantum channel. The
    quantum channel is used to send the quantum state of light from the source transmitter
    to the destination receiver. In this case, the quantum channel is not secured.
    The quantum communication link between two parties is secured by authentication.
    The quantum key exchange protocol is based on quantum properties.


    The emerging quantum Internet is based on quantum cryptographic applications,
    quantum key distribution, and secure identification. The quantum key distribution
    uses the power of quantum mechanics. Interference detected as quantum key distribution–based
    communication is tough to change. This helps to secure the message.


    The quantum key distribution methods are based on discrete and continuous variables.
    For example, `Silberhorn` and `Grangier` are quantum key distribution methods.
    `Frodo` and `Sike` are based on quantum key exchange. Signature methods are used
    by `Picnic` and `Tesla`. The quantum cryptographic systems are based on multivariate,
    elliptic, lattice, isogenies, hash, and hybrid-based signatures.


    **Tip**


    Quantum key distribution is based on the cryptographic data exchange of photons,
    which are data bits.


    Now let’s look at the quantum teleportation technique.


    # Quantum Teleportation


    Quantum teleportation is the transfer of a quantum state from a source location
    to a destination location without changing the actual state. Quantum teleportation
    is based on the quantum entanglement principle of quantum physics. The entanglement
    is related to multiple particles having mutually exclusive states. Mutually exclusive
    means finding the state of a particle that is used for computing the state of
    the next particle. Two quantum entangled photons can know the state of the other
    photon. See Figure [13-5](#490826_1_En_13_Chapter.xhtml#Fig5).


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig5_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig5_HTML.jpg)


    Figure 13-5


    Quantum entanglement


    Each photon can have the four different Bell states mentioned here:


    - `00 + 11`

    - `00 – 11`

    - `01 + 10`

    - `01 – 10`


    The quantum teleportation process starts with the entanglement of a pair of photons
    in a quantum channel. Photon `X` is sent by Alice, and photon `Y` is sent to the
    receiver Bob. When Alice executes an operation on `X`, Bob can see the change
    in the state of `Y`. Let’s say Alice has photon `Z` whose quantum state is not
    known. Alice is interested in teleporting into photon `Y`. Bell measurement is
    made on photons `X` and `Z`. Because `X` and `Y` are entangled, `Y`’s quantum
    state can be turned into the quantum state of `Z`. Bob can finish teleportation
    using Alice’s Bell measurement. Alice sends the Bell measurement via the classical
    communication channel. Bob knows how to change `Y` into the state of `Z`. See
    Figure [13-6](#490826_1_En_13_Chapter.xhtml#Fig6).


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig6_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig6_HTML.jpg)


    Figure 13-6


    Quantum entanglement


    Let’s look at another form of quantum entanglement. The Einstein–Podolsky–Rosen
    (EPR) pair consists of photons that are in a maximal entangled state. Alice has
    one of the EPR photons, and Bob has the other photon. In quantum teleportation
    and quantum entanglement, the particles can be photons, atoms, and leptons of
    any kind. The particle can have two degrees of freedom. The quantum state of the
    particle can be encoded into the quantum bit.


    The quantum teleportation process is based on the no-cloning theorem. The no-cloning
    theorem helps to ensure that there is no method to cope for unknown quantum states
    from one system to another. See Figure [13-7](#490826_1_En_13_Chapter.xhtml#Fig7).


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig7_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig7_HTML.jpg)


    Figure 13-7


    Quantum entanglement


    **Tip**


    Quantum teleportation was discovered by Chaoyang Lu, Jian-Wei Pan, and colleagues
    in 2015.


    Now let’s start looking at the implementation of quantum entanglement and quantum
    teleportation. Let’s start with the Bloch sphere, which is used for the visualization
    of quantum bit vectors. See Figure [13-8](#490826_1_En_13_Chapter.xhtml#Fig8).


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig8_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig8_HTML.jpg)


    Figure 13-8


    Bloch sphere


    Let’s look at the Bloch sphere in code.


    ## Code Sample


    ```

    from qiskit import Aer as qisAer

    from qiskit import QuantumCircuit as QC

    from qiskit import execute

    from matplotlib import pyplot as plot

    from qiskit.tools.visualization import plot_bloch_multivector as bloch_state_vector

    quantum_circuit = QC(1, 1)

    quantum_circuit.x(0)

    simulator = qisAer.get_backend(''statevector_simulator'')

    result = execute(quantum_circuit, backend=simulator).result()

    statevector = result.get_statevector()

    print(''\n statevector is '', statevector)

    bloch_state_vector(statevector)

    plot.savefig("images/statevector.png")

    plot.show()

    simulator = qisAer.get_backend(''unitary_simulator'')

    result = execute(quantum_circuit, backend=simulator).result()

    unitary_matrix = result.get_unitary()

    print(''\nunitary matrix is \n'', unitary_matrix)

    ```


    ## Command


    ```

    pip3 install qiskit

    python3 BlochSphere.py

    ```


    ## Output


    ```

    statevector is  [0.+0.j 1.+0.j]

    unitary matrix is

    [[0.+0.j 1.+0.j]

    [1.+0.j 0.+0.j]]

    ```


    Figure [13-9](#490826_1_En_13_Chapter.xhtml#Fig9) shows the Bloch sphere plot.


    ![../images/490826_1_En_13_Chapter/490826_1_En_13_Fig9_HTML.jpg](images/490826_1_En_13_Chapter/490826_1_En_13_Fig9_HTML.jpg)


    Figure 13-9


    Bloch sphere plot


    Now let’s look at quantum entanglement.'
