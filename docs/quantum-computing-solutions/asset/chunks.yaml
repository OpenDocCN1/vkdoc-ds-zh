- fmt: '# Classifiers


    Patterns are identified by using machine learning algorithms in classical computing.
    Quantum machine learning techniques help to convert machine learning methods to
    algorithms. Algorithms are the basic units of quantum computing. New research
    is going on in the quantum computing area; specifically, quantum computing is
    evolving by adding data mining to it. Pattern identification can be done using
    quantum computing algorithms. Supervised learning methods operate on labeled input
    data sets and feature vectors. These methods help in identifying the labels for
    feature vectors. See Figure [9-1](#490826_1_En_9_Chapter.xhtml#Fig1).


    ![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig1_HTML.jpg](images/490826_1_En_9_Chapter/490826_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Linearly separable


    The data set, which is linearly separable, splits the input set by a plane, line,
    or hyperplane. The points of one set are in the first half-space, and the second
    set are in the other space.


    Quantum machine learning methods are based on supervised and unsupervised learning.
    Amplitude modification methods are used in the `k-nearest neighbor` and clustering
    quantum algorithms. Quantum matrix computations are used for quantum kernel methods.
    Quantum kernel methods support vector machines and Gaussian processes. Supervised
    quantum machine learning is the basis for variational quantum classifier methods.


    Let’s look at quantum classifiers in detail.


    # Quantum Classifiers


    Quantum classifiers consist of components such as an encoder and a processor (see
    Figure [9-2](#490826_1_En_9_Chapter.xhtml#Fig2)). The encoder modifies the data
    vector to a quantum state. A classical preprocessor changes the input data to
    a quantum circuit. The quantum circuit is initialized to a zero quantum state.
    The processor component retrieves the information from the encoded quantum state.
    The quantum state transformer changes the quantum circuit’s encoded quantum state
    to information retrieved by measurement and post-processing.


    ![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig2_HTML.jpg](images/490826_1_En_9_Chapter/490826_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    Quantum classifier


    We’re using the `QClassify` framework to demonstrate quantum classifiers. `QClassifiers`
    are variational quantum classifiers. This package has classes for classifier tasks.
    Classifier tasks are based on quantum gates. A quantum simulator on the cloud
    is used for simulating quantum gates on the quantum circuit.


    A quantum circuit has a single Hadamard gate and two single quantum bit measure
    gates. Measure gates operate on an ancilla and designated quantum bit. Quantum
    methods modify the data to encoded amplified data format. A `QClassifier` is used
    to build a concrete circuit. The `QClassify` object has the component information.
    This package is used for customization based on the context of the problem. Quantum
    binary classifiers are based on quantum kernel methods.


    **Tip**


    Kernels are mathematical functions used to calculate the distance between any
    two points on a graph or in a word.


    Let’s look at an example related to the binary classification of a set of two-dimensional
    points. This example is modeled as a quantum circuit of 2 quantum bits. The processor
    has multiple options such as `layer_xyz`, `measure_top`, and `prob_one`. Quantum
    bits can have 0 or 1 values or be in a superposition state of 0 and 1. The encoder
    options are also set. Classifiers are created with selected quantum bits and classifier
    options.


    An input vector has `[1,1]` matrix values. Parameters have 3.067 and 3.3311 values.
    The quantum circuit is created with `input_vector` and `parameters`. The program
    is the output of the quantum circuit.


    Let’s look at the code implementation of a quantum classifier.


    ## Code Sample


    ```

    import qclassify

    from qclassify.preprocessing import *

    from qclassify.encoding_circ import *

    from qclassify.qclassifier import QClassifier as QuantumClassifier

    from qclassify.proc_circ import *

    from qclassify.postprocessing import *

    encoding_opts={

    ''preprocessing'':id_func,

    ''encoding_circ'':x_product,

    }

    process_opts={

    ''proc_circ'':layer_xz,

    ''postprocessing'':{

    ''quantum'':measure_top,

    ''classical'':prob_one,

    }

    }

    quantum_bits = [0, 1]

    classify_opts = {

    ''encoder_options'':encoding_opts,

    ''proc_options'':process_opts,

    }

    qCircuit = QuantumClassifier(quantum_bits, classify_opts)

    circuit_values = [1, 1]

    params = [2.0672044712460114, 1.3311348339721203]

    quantum_circuit_prog = qCircuit.circuit(circuit_values, params)

    print(quantum_circuit_prog)

    ```


    ## Command


    ```

    pip3 install qclassify

    python3 quantum_classifier.py

    ```


    ## Output


    ```

    RX(1) 0

    RX(1) 1

    CZ 0 1

    RX(3.0672044712460114) 0

    RX(3.3311348339721203) 1

    DECLARE ro BIT[1]

    MEASURE 0 ro[0]

    ```


    Now, let’s look at the variational quantum classifier in detail.'
