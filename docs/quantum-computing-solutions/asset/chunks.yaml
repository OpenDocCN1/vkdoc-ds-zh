    ## Quantum Transformations


    Quantum transformations are related to the quantum state transformations using
    quantum bits. We look at the Kronecker transformation and measure gates in this
    section.


    ### Kronecker Transformation


    A tensor product is used to model a multiquantum bit system. A Kronecker product
    is a tensor product of vectors and matrices.


    A multiquantum state is represented using multiple quantum bits and vectors. The
    dimensionality of the quantum state increases exponentially with the number of
    quantum bits in the system.


    Note


    The tensor product between two quantum states is represented using the symbol
    ⊗. The multiquantum bit state is shown using Dirac notation as |100>, which is
    the same as |1> ⊗ |0> ⊗ |0>.


    ### Measure Gate Transformation


    Now we look at the Measure gate. A Measure gate transforms the information using
    quantum operations. Measurement transformation can be represented using the following
    equation:


    ```

    amp1|0> + amp2|1> = |amp>

    ```


    where amp1 and amp2 are amplitudes of the quantum bits.


    You need to define the projectors to simulate measurement transformation.


    ```

    Proj0 = |0>  <1|

    ```


    The state defined here shows the measure gate transformation:


    ```

    |ψ> = (1/4) (|00> + |01> + |10> +|11>)

    ```


    Now let’s look at a code sample in Python to demonstrate a Kronecker transformation
    in Python.


    ### Code Sample


    **multi_kronecker.py**


    ```

    import numpy as nump

    def multi_quantum_state(*args):

    ret = nump.array([[1.0]])

    for q in args:

    ret = nump.kron(ret, q)

    return ret

    zero_quantum_state = nump.array([[1.0], [0.0]])

    one_quantum_state = nump.array([[0.0], [1.0]])

    three_quantum_states = nump.kron(nump.kron(zero_quantum_state, one_quantum_state),
    one_quantum_state)

    print("three  quantum states -kronecker",three_quantum_states)

    ```


    ### Command for Execution


    ```

    pip3 install numpy

    python3 multi_kron.py

    ```


    ### Output


    ```

    three  quantum states -kronecker product

    [[0.][0.]

    [0.][1.]

    [0.][0.]

    [0.][0.]]

    ```


    ## Summary


    In this chapter, we looked at single and multiple quantum bit systems. Quantum
    bits system phenomena such as entanglement, superposition, and teleportation were
    discussed in detail. Finally, the quantum states, gates, and transformations were
    presented.


