    \n# About the Author\n# About the Technical Reviewer\n\n# Part I Introduction\n\
    \n# 1. Quantum Solutions Overview\n\n## Introduction\n\n> *Quantum computation\
    \ is...a distinctively new way of harnessing nature.... It will be the first technology\
    \ that allows useful tasks to be performed in collaboration between parallel universes.*\n\
    > \n> —David Deutsch\n\nThis chapter gives an overview of quantum solutions. You\
    \ will see how quantum computing can be applied in real life. The problem and\
    \ solutions are presented with the solution benefits. The solution benefits are\
    \ automation, cost reduction and profit improvements, efficiency improvement,\
    \ and defect reduction.\n\nThe solutions covered in this chapter are related to\
    \ cryptography, optimization, and cybersecurity.\n\nLet’s start by looking at\
    \ the history of quantum computing and key achievements so far.\n\nRichard Feynman\
    \ proposed quantum electrodynamics in 1965 (see Figure [1-1](#490826_1_En_1_Chapter.xhtml#Fig1)).\
    \ Quantum electrodynamics is related to the interaction of the electrons using\
    \ the electromagnetic force of the photon. He invented the particles named *antiparticles*.\
    \ Antiparticles are the particles that have charges opposite to the mirror particles.\n\
    \n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig1_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1 Quantum computing time graph\n\nHe came up with new concepts related\
    \ to quantum physical processes in 1980. He proposed that quantum states are represented\
    \ by binary numbers.\n\nDavid Deutsch came up with a concept called *universal\
    \ quantum computers* in 1985. A universal quantum computer is based on the two-state\
    \ system, which consists of a set of quantum gates. *Quantum gates* are a set\
    \ of basic operations.\n\nPeter Shor invented the quantum entanglement–based method\
    \ for prime number factorization in 1994. This method is used to identify the\
    \ prime factors of big numbers. The efficiency of the algorithm was much better\
    \ compared to the previous methods. This research helped in creating research\
    \ interest at other universities.\n\nThe trapped ion concept was first developed\
    \ by the National Institute of Standards and Technology (NIST) and the California\
    \ Institute of Technology in 1995. The concept is related to the ions that are\
    \ trapped, and the temperature is decreased to a quantum state. In 1996 Bell Laboratories\
    \ scientist Loy Grover developed Grover’s algorithm, which is related to searching\
    \ using quantum algorithms. A research team consisting of members from the University\
    \ of California, Massachusetts Institute of Technology (MIT), Harvard University,\
    \ and IBM invented a nuclear magnetic-resonance technology to modify quantum information\
    \ in a liquid state.\n\nDavid DiVincenzo proposed the basic characteristics for\
    \ real quantum computer technology. Before David DiVincenzo, while Seth Lloyd\
    \ was working in Los Alamos National Laboratory, he invented the molecular quantum\
    \ computer. His proposal was based on a chain molecule structure. This structure\
    \ has a pattern of little blocks, and it is repeating (see Figure [1-2](#490826_1_En_1_Chapter.xhtml#Fig2)).\n\
    \n![../images/490826_1_En_1_Chapter/490826_1_En_1_Fig2_HTML.jpg](images/490826_1_En_1_Chapter/490826_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2 Chain molecule structure\n\nThis proposal was the basis for the first\
    \ quantum computer concept. Seth Lloyd’s proposal was not created, but in 2000,\
    \ David DiVincenzo created a list of criteria for quantum computer technology.\
    \ The criteria are related to quantum computing and communication models.\n\n\
    - A quantum computer consists of well-characterized quantum bits, and it is a\
    \ scalable physical system.\n- It needs to have the capability to create a set\
    \ of quantum bits.\n- A quantum computer can set the initial state of the quantum\
    \ bits. This is similar to a reset button on a desktop computer.\n- A quantum\
    \ computer has long decoherence times.\n- Quantum computer has error correction\
    \ related to the data retention in memory.\n- A quantum computer is based on a\
    \ universal set of quantum gates. Quantum algorithms need to be executed on the\
    \ computers. These algorithms might involve the rotation of quantum bits on a\
    \ Bloch sphere and the entanglement of qubits.\n- It needs to have a measurement\
    \ feature related to the state of quantum bits.\n- A quantum computer needs to\
    \ have the capability to interchange the static and dynamic quantum bits.\n- Information\
    \ needs to be transferred along large distances. Quantum bits need to be transmitted\
    \ between the source and destination.\n- The information needs to be retained\
    \ in quantum bits after transmission.\n\nAfter DiVincenzo, Van Meter presented\
    \ his thesis for building a quantum computer. The technology evolved from Van\
    \ Meter’s thesis to a physical quantum computer. D-Wave came up with its own quantum\
    \ computer. The latest update is that IBM is building a 53 quantum bit quantum\
    \ computer. Google already has a 72 quantum bit quantum computer. The IBM Quantum\
    \ computer will be accessible through its IBM Bluemix cloud environment."
