    time for simulation and prediction, and different alternate paths. The method
    used in the simulation is quantum annealing. The model will have entities that
    are stocks and mutual funds. The model variables are the stock and mutual fund
    prices. The solution will be the strike prices and the assets to be chosen for
    the investment portfolio. The deployment will be done on the trading and wealth
    management firm''s infrastructure. The environment will include the servers that
    can handle the required memory, the computing processing power, and the disk space.
    The system sizing is done to handle the customer portfolios of an order of 10,000
    stocks and simulating them for more than 10 years. The continuous evaluation of
    the solution is done by executing the solution on the servers. The metrics are
    gathered for the solution including the portfolios selected and the expected returns
    based on the risk profile.


    The quantum AI simulation-based annealer will have a knowledge base, inference
    engine, data store, and explanation module. The knowledge base will be the historical
    data of stocks and mutual funds. The inference engine will have rules and the
    facts for trading and portfolio management. A data store is used for portfolio
    management. The explanation module helps in measuring the metrics based on the
    goals, risk strategy, and the initial portfolio selected.


    The sampling methods that are Monte Carlo based are used to value stocks and mutual
    funds in the finance world. The random shifts in the prices of the assets are
    simulated. The Monte Carlo methods find risk measures in trading and investment
    strategies. They help in finding path-dependent returns for a risk-based investment
    strategy. Estimation of the return and risk for a portfolio of stocks, mutual
    funds, options, and futures is done by using Monte Carlo quantum methods. The
    volatility helps in identifying the variation and can be computed by the logarithmic
    returns’ standard deviation.


    Quantum AI simulation goes through forward direction–based steps in time. The
    initial asset prices are taken from the user input or from the stock market websites.
    The quantum AI model consists of the asset price evolution. Stochastic processes
    or discretization methods are used for solving the problem. The asset prices might
    have correlations that are not expected due to random data generation. Quasi-random
    number generators help to replace the complete random number generators. Quasi-random
    numbers are based on a quasi-random sequence, which is of low discrepancy.


    Quantum Monte Carlo methods help in modeling the stock prices using stochastic
    Brownian motion. This model consists of fractional and large quantities of assets
    without transaction prices. Short-selling and dividend-less stocks are the assumptions
    in the model. The value at risk is the goal of the model. It is related to the
    expected loss of the customer portfolio.


    For example, the option price starts from the values between 11.4 and 11.2\. The
    exercise price for the option can be around 15\. The maturity of the option is
    around 1 year. The volatility of the stock price is expected at around 0.2 (20%).
    The simulations are computed for different volatility values between 0.15 and
    0.25\. The number of steps within a simulation is around 10,000.


    Monte Carlo simulations are based on Markov chains. They are related to quantum
    walks, and quantum walks are analogous to random walks. Quantum Monte Carlo methods
    are applied for stock pricing, risk-based investment strategies, return computations,
    portfolio return calculations, and impact of investment in assets.


    The quantum AI simulation helps in forecasting the outcome, which is indeterministic.
    A random walk with all the states in the data store can be evolved into a trading
    system with multiple stocks and mutual funds. A probabilistic average from the
    possible states is the goal of the simulation. The quantum algorithms based on
    Monte Carlo methods are computed m times to obtain m number of random combinations
    of the stocks and mutual funds in a customer portfolio.


    A quantum AI simulator can execute the simulation for more than 10,000 future
    scenarios. The scenarios will not have the following key factors:


    *   Market crashes


    *   Company-specific events


    *   Political surprises


    *   Unexpected interest hikes


    The simulation results are not accurate as these key factors might disrupt the
    stability of the trading markets with a downside of risk and an upside of potential.
    Quantum AI simulation can handle stocks, mutual funds, and options such as American,
    European, Asian, LookBack and Bermudan styles. The simulation model will have
    the following variables:


    *   Today’s stock price


    *   Exercise price


    *   Maturity in years


    *   Risk-free rate


    *   Volatility


    *   Number of simulations


    *   Number of steps


    The other parameters that influence the simulation are commodity prices, inflation,
    and other assets in the trading markets. Mathematically, the simulation will look
    as follows using the normal distribution:


    ```

    Stock_Price(t+1) = Stock_Price(t) *Pow(e, (drift+random_value))

    drift = average_stock_price - (variance/2)

    random_value = ( standard_deviation * normal_inverse)

    normal_inverse is the inverse of the normal distribution.

    ```


    The distribution can modeled with Q(x) as the frequency distribution or the density
    function r(x) (x is continuous).


    If there is a real-value function f(X) with the probability distribution for frequency
    Q(x), the expected value of f(X) is as follows:


    ```

    E(f(x)) = Σ f(x) Q(x) where Q(x) > 0 and Σ Q(x) = 1

    ```


    X is discrete.


    The f(X) mean value is (1/n) Σ f(xi), where i lies between 1 and N.


    The investment horizon is typically between 1 and 25 years in the simulation model.
    The asset’s downside and upside price are the inputs. The simulation models the
    risk-neutral paths of a portfolio with stocks, mutual funds, and options. Bumping
    is related to changing the sensitivity of the parameters in the model and executing
    the simulation.


    The complicated parts in the quantum AI simulator are knowledge base, inference
    engine, and explanation modules.


    The knowledge base is created by transferring and transforming the domain expertise
    from different sources to a semantic model. The domain consists of general principles,
    entities, and events that commonly occur. Entities in the domain might have relationships
    and underlying structure. The knowledge base captures the tasks that are performed
    by the operators at different function levels in the domain. The organization
    model has the function levels. The task model has the operator’s tasks in detail.
    The application model will have information related to the operator’s systems.
    Ontology is a key part of the knowledge base. Static ontology is related to domain
    entities and their relationships. Dynamic ontology is about the states of the
    entities and the transformation rules. Epistemic ontology is related to state
    transformation guidelines. Domain actions, predicates, procedures, object hierarchy,
    and finite-state tables are part of the model.


    A knowledge-based system can be one that predicts the weather, and it has knowledge
    in meteorology. It can forecast weather with good accuracy. Knowledge engineers
    who are meteorologists will add their knowledge in the form of facts and rules.
    Similarly, an Army strategist can come up with military strategies using the knowledge
    base of the defense. The knowledge base will have a standard set of strategies
    for attack and defense. See Figure [14-1](#490826_1_En_14_Chapter.xhtml#Fig1).


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig1_HTML.jpg](images/490826_1_En_14_Chapter/490826_1_En_14_Fig1_HTML.jpg)


    Figure 14-1


    Portfolio management


    The statistical models related to the trading and advisory knowledge base will
    evolve based on the historical data and the recent trends from the stock market.
    The market events, objects in the trading domain, observable patterns, trading
    strategies, and business policies are part of the trading system knowledge base.
    The knowledge base will have structural, strategic, and support knowledge types.
    The structural knowledge will have different abstraction levels in the trading
    domain. Strategic knowledge is related to methods and techniques to solve different
    problems in the trading world. Support knowledge is for contingencies and the
    causes of problems in the trading domain.


    The inference engine executes the rules in which the knowledge base has to identify
    the change in the states of the objects and the entity’s properties. The engine
    solves the problems based on the rules in the knowledge base. The inference engine
    helps in answering the questions that came up during the simulation.


    The explanation module has declarative rules for measuring the effectiveness of
    the solution. The explanation is related to evaluating the system results and
    identifying the cause by reasoning. The explanation and reasoning are based on
    different rule types such as causal, trigger, data, hypothesis, and screening
    rules. The quantum AI simulator identifies the scenarios to be executed based
    on a set of events. See Figure [14-2](#490826_1_En_14_Chapter.xhtml#Fig2).


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig2_HTML.jpg](images/490826_1_En_14_Chapter/490826_1_En_14_Fig2_HTML.jpg)


    Figure 14-2


    AI model development


    Moving on from banking, let’s look at other verticals such as healthcare. In healthcare,
    quantum AI can be used to analyze genetic DNA sequences. The size of the genomic
    sequences is big. Quantum AI can be used for image processing and analysis in
    bioengineering and telemedicine. Critical diseases such as cancer can be diagnosed
    by using these techniques. It also helps in drug discovery and research. These
    techniques provide better forecasting and time-series analysis.


    Quantum processing capabilities help in traffic management, sensor data analysis,
    supply chain planning, procurement decision-making, searching big data, transportation
    optimization, resource planning, and asset management. Like bits, quantum bits
    are the computational basis for the quantum computer.


    Now let’s look at traffic management.'
  trans: '

    # 金融投资组合管理


    客户在选择不同风险策略时拥有多种选项。


    *   *保护者*：极低风险

    *   *稳定者*：低风险

    *   *优化者*：低至中等风险

    *   *创造者*：中高风险

    *   *最大化者*：高风险


    模拟基于交易情境的数学模型。决策变量以及带有假设条件的模型会被明确指定。针对不同场景，提供了初始条件和备选方案。


    投资组合管理是指根据风险策略，选择最佳资产进行投资以获得更高回报。这是一个 NP 难题。NP 难题的复杂性和难度至少与最难的非确定性多项式时间问题相当。量子退火是用于解决此
    NP 难题的量子人工智能技术。退火是将玻璃降至最低能态的等效方法。这是模拟退火人工智能技术中使用的一种经典方法。难题的解将处于最低能态。当退火器收敛到最低能态时，就可以确定问题的最小值。


    研究发现，量子退火能够解决 NP 难题，并且它具有由玻尔兹曼分布定义的概率模型的估计平均值。量子退火利用量子现象来加速 NP 难题的求解。


    量子退火是一种寻找函数最小值和最大值的优化方法。它会提供一组候选函数来寻找最优的最小值和最大值。量子退火与量子隧穿过程有关。这是一个粒子从高能态穿过势垒到达低能态的过程。量子退火的初始条件是叠加态。系统基于含时薛定谔方程演化。这会影响时间增加时的系统状态振幅。系统的哈密顿量源自系统的基态。


    量子退火用于训练玻尔兹曼机和量子深度神经网络。用于寻找概率平均值的采样方法是基于马尔可夫链的蒙特卡洛算法。玻尔兹曼模型和方程是分子动力学理论的基础。最概然速率、平均速率和均方根速率使用玻尔兹曼分布进行计算。


    交易问题需要通过定义目标和业务场景来表征。解决问题的方法将是一种基于模拟退火的量子人工智能算法。部署将在交易和财富管理公司中进行。通过收集解决方案指标来进行持续评估。


    交易问题的特征包括股票价格、共同基金价格、模拟和预测时间以及不同的备选路径。模拟中使用的方法是量子退火。模型包含的实体是股票和共同基金。模型变量是股票和共同基金的价格。解决方案将是行权价格和要为投资组合选择的资产。部署将在交易和财富管理公司的基础设施上进行。环境将包括能够处理所需内存、计算处理能力和磁盘空间的服务器。系统规模调整是为了处理客户投资组合（数量级为一万只股票）并对其进行超过
    10 年的模拟。通过在服务器上执行解决方案来进行解决方案的持续评估。收集解决方案的指标，包括所选的投资组合以及基于风险状况的预期收益。


    基于量子人工智能模拟的退火器将包含一个知识库、推理引擎、数据存储和解释模块。知识库将是股票和共同基金的历史数据。推理引擎将包含交易和投资组合管理的规则和事实。数据存储用于投资组合管理。解释模块有助于根据目标、风险策略和所选初始投资组合来衡量指标。


    在金融世界中，基于蒙特卡洛的采样方法用于评估股票和共同基金的价值。模拟资产价格的随机波动。蒙特卡洛方法用于发现交易和投资策略中的风险度量。它们有助于为基于风险的投资策略寻找路径依赖的回报。使用蒙特卡洛量子方法估算股票、共同基金、期权和期货组合的收益和风险。波动率有助于识别变异，可以通过对数收益的标准差来计算。


    量子人工智能模拟会沿着时间向前推进的步骤进行。初始资产价格取自用户输入或股票市场网站。量子人工智能模型包含资产价格演变过程。使用随机过程或离散化方法来解决问题。由于随机数据生成，资产价格可能存在预期之外的相关性。准随机数生成器有助于替代完全随机数生成器。准随机数基于准随机序列，这种序列具有低差异的特性。


    量子蒙特卡洛方法有助于使用随机布朗运动来模拟股票价格。该模型包含大量没有交易价格的零散和大额资产。模型中的假设包括允许卖空和不支付股息的股票。模型的目标是风险价值。它与客户投资组合的预期损失相关。


    例如，期权价格从 11.4 到 11.2 之间的值开始。期权的行权价大约为 15。期权的到期期限大约为 1 年。股票价格的预期波动率约为 0.2（20%）。针对
    0.15 到 0.25 之间的不同波动率值进行计算模拟。一次模拟中的步数约为 10,000 步。


    蒙特卡洛模拟基于马尔可夫链。它们与量子行走相关，而量子行走类似于随机行走。量子蒙特卡洛方法应用于股票定价、基于风险的投资策略、收益计算、投资组合收益计算以及资产投资影响分析。


    量子人工智能模拟有助于预测不确定的结果。一个包含数据存储中所有状态的随机行走可以演变成一个包含多种股票和共同基金的交易系统。从可能的状态中得出概率平均值是模拟的目标。基于蒙特卡洛方法的量子算法会被计算
    m 次，以获得客户投资组合中股票和共同基金的 m 种随机组合。


    一个量子人工智能模拟器可以针对超过 10,000 个未来场景执行模拟。这些场景将不会包含以下关键因素：


    *   市场崩盘

    *   公司特定事件

    *   政治意外

    *   意外加息


    模拟结果并不准确，因为这些关键因素可能会破坏交易市场的稳定性，带来下跌风险和上涨潜力。量子人工智能模拟可以处理股票、共同基金以及美式、欧式、亚式、回溯式和百慕大式等期权。模拟模型将包含以下变量：


    *   今日股票价格

    *   行权价

    *   到期年限

    *   无风险利率

    *   波动率

    *   模拟次数

    *   步数


    影响模拟的其他参数包括商品价格、通货膨胀率以及交易市场中的其他资产。从数学上讲，使用正态分布的模拟如下所示：


    ```

    Stock_Price(t+1) = Stock_Price(t) *Pow(e, (drift+random_value))

    drift = average_stock_price - (variance/2)

    random_value = ( standard_deviation * normal_inverse)

    normal_inverse 是正态分布的逆函数。

    ```


    分布可以用 `Q(x)` 建模为频率分布，或者用密度函数 `r(x)` 建模（x 是连续的）。


    如果有一个实值函数 `f(X)`，其频率的概率分布为 `Q(x)`，那么 `f(X)` 的期望值如下：


    ```

    E(f(x)) = Σ f(x) Q(x) 其中 Q(x) > 0 且 Σ Q(x) = 1

    ```


    X 是离散的。


    `f(X)` 的平均值是 `(1/n) Σ f(xi)`，其中 i 的范围是 1 到 N。


    模拟模型中的投资期限通常在 1 到 25 年之间。资产的下跌和上涨价格是输入项。该模型模拟包含股票、共同基金和期权的投资组合的风险中性路径。Bumping
    与更改模型中参数的敏感性并执行模拟有关。


    量子人工智能模拟器中复杂的部分是知识库、推理引擎和解释模块。


    知识库是通过将来自不同来源的领域专业知识转换和迁移到一个语义模型中创建的。该领域包含普遍发生的一般原则、实体和事件。领域中的实体可能具有关系和底层结构。知识库捕获了操作员在领域中不同职能级别执行的任务。组织模型包含职能级别。任务模型详细描述了操作员的任务。应用模型将包含与操作员系统相关的信息。本体论是知识库的关键部分。静态本体论与领域实体及其关系相关。动态本体论与实体的状态和转换规则相关。认知本体论与状态转换指南相关。领域动作、谓词、过程、对象层次结构和有限状态表是模型的一部分。


    一个基于知识的系统可以是一个预测天气的系统，它拥有气象学知识。它可以高精度地预报天气。作为气象学家的知识工程师会以事实和规则的形式添加他们的知识。类似地，军事战略家可以利用国防知识库提出军事策略。知识库将包含一套标准的攻防策略。参见图
    14-1。


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig1_HTML.jpg](img/490826_1_En_14_Fig1_HTML.jpg)


    图 14-1


    投资组合管理


    与交易和咨询知识库相关的统计模型将根据历史数据和股票市场的最新趋势而演变。市场事件、交易领域中的对象、可观察的模式、交易策略和业务策略都是交易系统知识库的一部分。知识库将包含结构性知识、策略性知识和支持性知识类型。结构性知识将包含交易领域中不同的抽象级别。策略性知识与解决交易世界中不同问题的方法和技术相关。支持性知识用于处理交易领域中的意外情况和问题原因。


    推理引擎执行规则，知识库需要根据这些规则识别对象状态和实体属性的变化。引擎根据知识库中的规则解决问题。推理引擎有助于回答模拟过程中出现的问题。


    解释模块包含用于衡量解决方案有效性的陈述性规则。解释涉及评估系统结果并通过推理确定原因。解释和推理基于不同的规则类型，例如因果规则、触发规则、数据规则、假设规则和筛选规则。量子人工智能模拟器基于一组事件识别要执行的场景。参见图
    14-2。


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig2_HTML.jpg](img/490826_1_En_14_Fig2_HTML.jpg)


    图 14-2


    人工智能模型开发


    从银行业转到其他垂直领域，比如医疗保健。在医疗保健领域，量子人工智能可用于分析基因 DNA 序列。基因组序列的规模很大。量子人工智能可用于生物工程和远程医疗中的图像处理和分析。癌症等危重疾病可以通过这些技术进行诊断。它还有助于药物发现和研究。这些技术提供了更好的预测和时间序列分析。


    量子处理能力有助于交通管理、传感器数据分析、供应链规划、采购决策、大数据搜索、运输优化、资源规划和资产管理。与比特类似，量子比特是量子计算机的计算基础。


    现在让我们来看看交通管理。

    '
- fmt: '### Traffic Management


    Traffic modeling in transportation depends on traffic zones, trip tables, highway
    networks, vehicle capacity, and land-use models. Land-use models consist of trends,
    land-use and zoning plans, activity areas, and maps. A transportation system has
    streets, highways, parking, travel times, and speed limits. The transportation
    network will have traffic volumes and vehicle capacities. Travel patterns identify
    the mode of use, typical source to destination paths, and the trip characteristics.
    Wardrop’s first principle is based on the network and road user balance. The journey
    times of all the paths used are equal and less than the unused path by one vehicle.
    This principle helps in minimizing the average time for a trip. There are other
    principles and algorithms to balance the road user and network traffic flow. See
    Figure [14-3](#490826_1_En_14_Chapter.xhtml#Fig3).


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig3_HTML.jpg](images/490826_1_En_14_Chapter/490826_1_En_14_Fig3_HTML.jpg)


    Figure 14-3


    Trip planning


    Trips are generated based on the source, destination, vehicle, and city transportation
    network. The network has vehicles, cyclists, pedestrians in different time zones,
    and space all constantly moving. Transportation planning is a continuous activity,
    and the street network infrastructure keeps getting updated. Traffic modeling
    is done using techniques such as simulation and machine learning. Traffic control
    is done using historical data, estimating the number of vehicles during a time
    period, and managing the flow of the traffic across the network.


    ![../images/490826_1_En_14_Chapter/490826_1_En_14_Fig4_HTML.jpg](images/490826_1_En_14_Chapter/490826_1_En_14_Fig4_HTML.jpg)


    Figure 14-4


    Traffic planning


    A max flow–min cut approach is used to maximize the flow of the traffic in a transportation
    network. This approach, based on the maximum flow of traffic from the source to
    the destination, is the same as the minimum cut to separate the source from the
    destination. This approach can be applied to a computer network packet flow.


    The packet flow through a network can be modeled using the max flow–min cut approach.
    The network has the information flow through the nodes to reach the destination.
    The goal is to maximize the number of packets that can flow through a computer
    network. Similarly, this method can be used to assign students to a dorm based
    on the condition that every student wants to live in one’s own dorm of choice.
    The goal is to maximize the number of students who get dorms.


    In other verticals, quantum algorithms and techniques are used for predictive
    analytics. In healthcare, the quantum annealing method can help in optimizing
    the nonadverse effects in protein folding and drug discovery. The other areas
    are drug design and personalized medicine. In manufacturing, quantum computing
    techniques can be applied for supply chain optimization problems. The typical
    problems are related to distribution, production, procurement, and logistics.
    In the media industry, quantum methods are applied for scheduling advertising
    and optimizing revenue.


    Let’s look at the quantum algorithms and techniques implemented in smart cities.


    ### Smart Cities


    The problems in smart cities consist of big data handling and require analytics
    and decisions in real time. A city consists of cars (autonomous and human driven),
    trucks, autos, buses, and other transport vehicles. The traffic lights are on
    different streets of the city. The traffic history of each street is available
    for planning a trip at different transit times on the weekdays and on the weekends.
    Smart city traffic management and drive planning solutions help citizens plan
    trips.


    Now, let’s look at the limitations of quantum computing and algorithms.


    ### Limitations of Quantum Computing


    Quantum computing hardware has issues with vibrations and external interactions
    such as radiation, light, and other factors. Decoherence is related to measuring
    the state at different points and collapsing the quantum states. The probability
    of decoherence increases with the number of quantum bits in exponential fashion.
    Phase errors are induced by using the quantum methods. Classical methods can cause
    small errors by using error correction methods. Testing is a problem as different
    copies of the unknown state cannot be created. Superposition is required for quantum
    computing methods, but a realistic model can be achieved as superposition requires
    the lowering of the system entropy.


    ## Quantum Computing News Sources


    The following are the news sources related to quantum computing:


    *   *IBM research blog*: [`https://www.ibm.com/blogs/research/category/quantcomp/`](https://www.ibm.com/blogs/research/category/quantcomp/)

