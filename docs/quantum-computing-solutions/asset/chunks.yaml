    图 10-7 K-中位数算法


    ```

    √(x2-x1)²+(y2-y1)²

    ```


    曼哈顿度量的公式如下：


    ```

    |x2-x1| + |y2-y1|

    ```


    **提示**


    k-中位数与 k-means 的区别在于簇中心的选择方式。k-means 选择均值作为质心，而 k-中位数则选择簇内数据点的中位数。


