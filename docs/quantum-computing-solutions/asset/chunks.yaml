    \ and (i%10==0)):\n            if stopCondition:\n                if nump.all(nump.linalg.norm(x[:n]-prevX,\
    \ axis=1) < 1e-5):\n                    break\n                prevX = x[:n].copy()\n\
    \        gradientValue, _ = gradientFunction(data, sigma, x=x, coeffs=coeffs)\n\
    \        x = x - stepSize * gradientValue\n        if returnHistory:\n       \
    \     xHistory[:,:,i+1] = x[:n,:].copy()\n    if returnHistory:\n        xHistory\
    \ = xHistory[:,:,:i+1]\n        return x, xHistory\n    else:    \n        return\
    \ x, None\n\ndef PerformFinalClusteringAlgo(x, stepSize):\n    clusters = nump.zeros((x.shape[0],))\n\
    \    clusterIndex = 0\n    for i in range(x.shape[0]):\n        if clusters[i]==0:\n\
    \            clusterIndex = clusterIndex+1\n            clusters[i] = clusterIndex\n\
    \            temp = nump.argwhere(clusters==0)\n            spatDistances = nump.linalg.norm(x[temp[:,0]]-x[i],\
    \ axis=1)\n            temp = nump.argwhere(spatDistances<=(stepSize/2))\n   \
    \         if temp.shape[0]>0:\n                clusters[temp[:,0]] = clusterIndex\n\
    \    clusters[clusters==0] = clusterIndex\n    return clusters\n\ndef displayClusteringValues(xHistory,\
    \ clusters):\n    plot.ion()\n    if xHistory.shape[1] > 3:\n        pca = decomPCA(3)\n\
    \        pca.fit(xHistory[:,:,0])\n        newXHistory = nump.zeros((xHistory.shape[0],\
    \ 3, xHistory.shape[2]))\n        for i in range(xHistory.shape[2]):\n       \
    \     newXHistory[:,:,i] = pca.transform(xHistory[:,:,i])\n        xHistory =\
    \ newXHistory\n    ax = plot.axes(projection='3d')\n    sc = ax.scatter(xHistory[:,\
    \ 0, 0], xHistory[:, 1, 0], xHistory[:, 2, 0], c=clusters, s=20)\n    ax.set_xlim((nump.min(xHistory[:,\
    \ 0, :]), nump.max(xHistory[:, 0, :])))\n    ax.set_ylim((nump.min(xHistory[:,\
    \ 1, :]), nump.max(xHistory[:, 1, :])))\n    ax.set_zlim((nump.min(xHistory[:,\
    \ 2, :]), nump.max(xHistory[:, 2, :])))\n    for i in range(xHistory.shape[2]):\n\
    \        sc._offsets3d = (nump.ravel(xHistory[:, 0, i]), nump.ravel(xHistory[:,\
    \ 1, i]), nump.ravel(xHistory[:, 2, i]))\n        plot.gcf().suptitle('step #'\
    \ + str(i) + '/' + str(xHistory.shape[2]-1))\n        plot.pause(0.01)\n    plot.ioff()\n\
    \    plot.close()\n```\n\n## 命令\n\n```\npip3 install nump\npython3 QCAlgo.py\n\
    ```\n\n## 输出\n\n使用量子聚类算法，可以创建聚类。图 10-10 显示了第四步之后的输出。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig10_HTML.jpg](img/490826_1_En_10_Fig10_HTML.jpg)\n\
    \n**图 10-10** 四步后的量子聚类输出\n\n图 10-11 显示了 29 步后的输出，图 10-12 显示了 46 步后的输出。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig12_HTML.jpg](img/490826_1_En_10_Fig12_HTML.jpg)\n\
    \n**图 10-12** 46 步后的输出\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig11_HTML.jpg](img/490826_1_En_10_Fig11_HTML.jpg)\n\
    \n**图 10-11** 29 步后的输出\n\n图 10-13 显示了 50 步结束时的输出。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig13_HTML.jpg](img/490826_1_En_10_Fig13_HTML.jpg)\n\
    \n**图 10-13** 50 步后的输出\n\n## 量子流形嵌入\n\n量子流形嵌入（见图 10-14）包含若干为欧几里得空间的片段。欧几里得空间代表了量子系统中的量子态。该欧几里得空间有与\
    \ `m` 个维度相关的 `m` 个向量。经典流形是嵌入在高维欧几里得系统中的 `m` 维形状。`Isomap` 是流形嵌入算法的一个示例。`Isomap`\
    \ 有助于利用底层的流形找到全局最优解。\n\n![../images/490826_1_En_10_Chapter/490826_1_En_10_Fig14_HTML.jpg](img/490826_1_En_10_Fig14_HTML.jpg)\n\
    \n**图 10-14** 流形嵌入\n\n## 小结\n\n在本章中，我们研究了与量子数据处理算法相关的技术，例如量子 k-means、量子 k-medians、量子聚类和量子流形嵌入。\n\
    \n# 11. 量子人工智能算法\n"
- fmt: "# Introduction\n\n> *“If we take quantum theory seriously as a picture of\
    \ what’s really going on, each measurement does more than disturb: it profoundly\
    \ reshapes the very fabric of reality.”*\n> \n> —Nick Herbert\n\nThis chapter\
    \ covers the topic of quantum AI algorithms. You can see how quantum AI algorithms\
    \ are implemented in day-to-day life. Code examples are presented for specific\
    \ algorithms such as quantum probability, quantum walks, quantum search, quantum\
    \ deep learning, and quantum parallelism.\n\n# Initial Setup\n\nYou need to set\
    \ up `Python` 3.5 to run the code samples in this chapter. You can download it\
    \ from [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/).\n\
    \n# Quantum Probability\n\nA quantum computation framework has probability-based\
    \ events that are modeled as Hilbert multidimensional subspaces. The system in\
    \ context is referred to as a *state vector* in Hilbert space. Event probabilities\
    \ are computed by using vector projection on subspaces and calculating the projection\
    \ length squared.\n\nNow, let’s look in detail at Hilbert space. It is a mathematical\
    \ vector space that has a dot product or an inner product of vectors. The space\
    \ is related to the distance function, which is referred to as the *inner product\
    \ space*.\n\nQuantum probability (see Figure [11-1](#490826_1_En_11_Chapter.xhtml#Fig1))\
    \ is based on mathematical quantum theory. A quantum probability space represents\
    \ a system that is not well known in physical space.\n\n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig1_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig1_HTML.jpg)\n\
    \nFigure 11-1\n\nQuantum probability\n\nA quantum probability space is a pair\
    \ `(B, ρ)` where `B` is a Q-algebra and `ρ : B → D` is a function with the following\
    \ properties:\n\n(a) `ρ(aB + bC) = aρ(B) + bρ(C)` (B, C ∈ A, a, b ∈ D),\n\n(b)\
    \ `ρ(B∗ ) = ρ(B) ∗` (B ∈ B),\n\n(c) `ρ(B∗B) ≥ 0` (B ∈ B)\n\nA projection `Q ∈\
    \ B` is an observation on the system. A partition of the measurement that is an\
    \ identity `{Q1, ..., Qm}` yields the measurements `Q1, …, Qm`. The larger `ρ(Q)`\
    \ is, the more likely the measurement is `Q`.\n\nThe law of probability is based\
    \ on `ρ(Q)`, where `Q ∈ B`. If `ρ(Q)=1`, the yield `Q` will be the measurement\
    \ of the `Q` value.\n\n> **Tip**  \n> Quantum probability is based on Von Neumann\
    \ axioms and relaxed constraints, which are based on Kolmogorov probability.\n\
    \n## Classic Walks\n\nA classical random walk (see Figure [11-2](#490826_1_En_11_Chapter.xhtml#Fig2))\
    \ is based on the behavior of a particle traversing on the line. The particle\
    \ movement is based on the probability rules. The simplest walk of a particle\
    \ is modeled as a time step with the unit distance moved left or right. The movement\
    \ has probability `q` for left and `1-q` for right. The probabilities are independent\
    \ of the previous positions.\n\n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig2_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig2_HTML.jpg)\n\
    \nFigure 11-2\n\nClassical random walk\n\nNow let’s look at the quantum walks\
    \ technique.\n\n## Quantum Walks\n\nQuantum walks (see Figure [11-3](#490826_1_En_11_Chapter.xhtml#Fig3))\
    \ are based on the traversal of the quantum particle, which is in a superposition\
    \ state. The probabilities are associated with the left and right movements. The\
    \ sum of the probabilities of the superposition states is not unitary. A quantum\
    \ walk is based on a particle’s spin. A random quantum walk is possible by rotating\
    \ the particle with spin. Quantum walks are used for creating quantum algorithms\
    \ based on the quantum computation model. There are two types of quantum walks:\
    \ discrete-time and continuous-time quantum walks.\n\n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig3_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig3_HTML.jpg)\n\
    \nFigure 11-3\n\nQuantum random walk\n\nThe coined walk model (see Figure [11-4](#490826_1_En_11_Chapter.xhtml#Fig4))\
    \ is based on the coin and identity operators of Hilbert space. The operator used\
    \ in the coined walk model is `D ⊗ M`, where `D` is the coin operator that represents\
    \ the particle’s motion and `M` is the identity operator of the Hilbert space\
    \ `GP`. The walk model is based on the coin toss. The computation model is based\
    \ on the superposition of the quantum states modeling the coin state. The Hadamard\
    \ operator is the frequently used coin. After applying the coin operator, a shift\
    \ operator is applied. The superposition state is created by superposition of\
    \ `m=1` and `m=-1`. The probability distribution in the coined quantum walk is\
    \ not normal distribution. The standard deviation of this quantum walk is not\
    \ `√s`. It is proportional to `s` steps. Assume that the probability of the quantum\
    \ particle to go to the right is 1. After `s` steps, the particle is found at\
    \ `m=s`. This scenario is referred to as a *ballistic case*. The quantum particle\
    \ is assumed to have unit velocity in motion. The speed of the quantum particle\
    \ in a ballistic scenario is half the speed of the free particle.\n\n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig4_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig4_HTML.jpg)\n\
    \nFigure 11-4\n\nCoined walk model\n\nLet’s look at the code implementation of\
    \ a coin toss quantum walk.\n\n### Code Sample\n\n```\nimport math\nimport pylab\
    \ as pythonLab\ndef GetProbabilities(posn):\nreturn [sum([abs(amp) ** 2 for amp\
    \ in place]) for place in posn]\ndef ApplyNormalisation(posn):\nN = math.sqrt(sum(GetProbabilities(posn)))\n\
    return [[amp / N for amp in place] for place in posn]\ndef GetTimeStep(posn):\n\
    return ApplyNormalisation([[x[0] + x[1], x[0] - x[1]] for x in posn])\ndef GetShift(coin):\n\
    newposn = [[0, 0] for i in range(len(coin))]\nfor j in range(1, len(position)\
    \ - 1):\nnewposn[j + 1][0] += coin[j][0]\nnewposn[j - 1][1] += coin[j][1]\nreturn\
    \ ApplyNormalisation(newposn)\nminval, maxval = -400, 401\nposition = [[0, 0]\
    \ for i in range(minval, maxval)]\nposition[-minval] = [1 / math.sqrt(2), 1j /\
    \ math.sqrt(2)]\nfor time in range(-minval):\nposition = GetShift(GetTimeStep(position))\n\
    pythonLab.plot(range(minval, maxval), GetProbabilities(position))\npythonLab.show()\n\
    ```\n\n### Command\n\n```\npip3 install pylab\npython3 quantum_walk.py\n```\n\n\
    ### Output\n\nFigure [11-5](#490826_1_En_11_Chapter.xhtml#Fig5) shows the quantum\
    \ walk output.\n\n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig5_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig5_HTML.jpg)\n\
    \nFigure 11-5\n\nQuantum walk output\n\nLet’s now look at the continuous-time\
    \ quantum walk.\n\nA continuous-time quantum walk (see Figure [11-6](#490826_1_En_11_Chapter.xhtml#Fig6))\
    \ is based on the Markov process. A Markov process is modeled as a graph with\
    \ `M` vertices that are connected to others with an edge. Assume `γ` is the jumping\
    \ rate per unit time between the vertices. The constraint is that the walk is\
    \ between the nodes on the edge. The walk is represented by stochastic generator\
    \ matrix `P`. The sum of the overlap integrals squared across all vertices is\
    \ 1.\n\n![../images/490826_1_En_11_Chapter/490826_1_En_11_Fig6_HTML.jpg](images/490826_1_En_11_Chapter/490826_1_En_11_Fig6_HTML.jpg)\n\
    \nFigure 11-6\n\nContinuous-time quantum walk\n\nA quantum walk is modeled using\
    \ a quantum mechanical wave function. The wave function is coherent superposition\
    \ of all possible wave paths. The probability distribution is based on the quantum\
    \ interference effects. Quantum walks help in solving real-life problems, and\
    \ they are faster in polynomial order of time. The problems such as element distinctness,\
    \ identifying triangle, and NAND tree evaluation are solved using quantum walks.\
    \ Grover’s search algorithm can be modeled as a quantum walk algorithm.\n\n> **Tip**\
    \  \n> Quantum walks are based on the quantum mechanics–based walks that model\
    \ quantum stochastic motion physics.\n\nLet’s look at the code implementation\
    \ of a coin toss quantum walk."
