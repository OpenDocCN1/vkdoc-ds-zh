    \ Summary\n\nIn this chapter, we looked at quantum operators, sets, vectors, matrices,\
    \ and tensors. These are the mathematical concepts required for quantum computing.\n\
    \n# Part IIQuantum Computing Basics\n\n# 3. Quantum Subsystems and Properties\n\
    \n## Introduction\n\n> *The mathematics of quantum mechanics very accurately describes\
    \ how our universe works.*\n> \n> —Antony Garrett Lisi\n\nThis chapter covers\
    \ quantum subsystems and their properties. Single and multiple quantum bit systems\
    \ are discussed in detail. Quantum states, protocols, operations, and transformations\
    \ are also presented in this chapter.\n\nA quantum computer processes information\
    \ related to real-life problems and solves them using quantum mechanics. A classical\
    \ computer uses bits that are either 0 or 1\\. We have to pick one of those options\
    \ since it is based on the electric current in a classical computer wire. Quantum\
    \ units are based on the quantum superposition principle in which 0 and 1 are\
    \ superposed. This opens up possible states that are infinite and based on the\
    \ 0 and 1 with weights in a continuous range. In classical computers, decimal\
    \ system–based values are converted to binary numbers. Similarly, quantum units\
    \ are defined using the two-dimensional Hilbert space. See Figure [3-1](#490826_1_En_3_Chapter.xhtml#Fig1).\n\
    \n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig1_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1\n\nClassic versus quantum bits\n\n## Initial Setup\n\nYou need to\
    \ set up Python 3.5 to run the code samples in this chapter. You can download\
    \ it from [`https://www.python.org/downloads/release/python-350/`](https://www.python.org/downloads/release/python-350/).\n\
    \n## Single Qubit System\n\nThe quantum bit is the foundation for a quantum computation\
    \ framework. By using quantum bits (*qubits*), the quantum computer performs better\
    \ than a classical computer. A quantum computer stores the information in quantum\
    \ bits. A quantum bit represents a quantum particle like an electron having a\
    \ charge as 0 or 1 and as 0 and 1 simultaneously. A Bloch sphere is used to show\
    \ the position of the quantum bit’s state. The sphere has a radius of one unit.\
    \ A Hilbert space is used to model the surface of the sphere. A Hilbert space\
    \ is related to an inner product of vectors in vector space. Length and angle\
    \ measurements are shown in the inner product. See Figure [3-2](#490826_1_En_3_Chapter.xhtml#Fig2).\n\
    \n![../images/490826_1_En_3_Chapter/490826_1_En_3_Fig2_HTML.jpg](images/490826_1_En_3_Chapter/490826_1_En_3_Fig2_HTML.jpg)\n\
    \nFigure 3-2\n\nBloch sphere\n\nNow let’s look at a code sample in Python that\
    \ demonstrates a single qubit system."
