    \ validation: 0.6800000\nit value:     9 | Cost Features: 0.8027511 | Accuracy\
    \ training: 0.7466667 | Accuracy for validation: 0.6800000\nit value:    10 |\
    \ Cost Features: 0.7695152 | Accuracy training: 0.8000000 | Accuracy for validation:\
    \ 0.7600000\n...........................................................................\n\
    ...........................................................................\n\
    it value:    47 | Cost Features: 0.5413240 | Accuracy training: 0.9466667 | Accuracy\
    \ for validation: 1.0000000\nit value:    48 | Cost Features: 0.5239643 | Accuracy\
    \ training: 0.9466667 | Accuracy for validation: 1.0000000\nit value:    49 |\
    \ Cost Features: 0.5100842 | Accuracy training: 0.9466667 | Accuracy for validation:\
    \ 1.0000000\nit value:    50 | Cost Features: 0.5006861 | Accuracy training: 0.9466667\
    \ | Accuracy for validation: 1.0000000\n```\n\n训练数据和测试数据约占数据集的 75%。验证集约占数据集值的\
    \ 25%。训练数据用于拟合模型的参数，测试数据用于评估模型的性能。验证数据用于微调机器学习模型。\n\n损失和准确率是在训练数据和验证数据集上衡量的。当验证损失相对于训练损失增加时，模型会出现过拟合。目标是相对于损失，验证准确率较高。需要选择具有代表性的数据集以避免数据源偏差。偏差可以基于数据总体中的统计期望值和实际值来估计。需要根据度量均方误差来计算观察到的模型误差。均方误差需要被最小化。\n\
    \n## 经典支持向量机\n\n经典支持向量机（SVM）基于监督机器学习。SVM 使用数据进行训练，并用于预测输入是否属于特定类别。训练数据包含 SVM 所要预测的类别集合。SVM\
    \ 中使用支持向量来最大化类别集合之间的距离。见图 9-6。\n\n![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig6_HTML.jpg](img/490826_1_En_9_Fig6_HTML.jpg)\n\
    \n图 9-6\n\n支持向量机\n\nSVM 的量子对应版本使用特征映射来呈现量子电路信息。核函数概念被用于分类方法中。特征映射修饰了特征。特征是上下文中所讨论主题的可测量属性。分类是关于寻找输入信息各个类别之间的距离。\n\
    \n量子支持向量机基于量子处理器来求解问题。它基于监督学习。多类分类器建立在量子支持向量机之上。量子处理器拥有用于处理内存中量子比特的量子随机存取存储器（QRAM）。\n\
    \n提示\n\nQRAM 由三个组件组成：存储器阵列、输入寄存器和输出寄存器。存储器阵列可以是经典的或基于量子的。寄存器由量子比特组成。\n\n让我们详细了解一下量子稀疏支持向量机。\n\
    \n## 量子稀疏支持向量机\n\n有多种技术，如最小二乘法，可用于模拟量子稀疏支持向量机。Harrow-Hassidim-Lloyd（HHL）算法用于求解基于线性方程组的系统，以利用训练好的量子比特进行预测。这是经典计算技术和量子计算技术的混合算法。\n\
    \n正则化是稀疏支持向量机技术的一部分。它与目标函数中对参数权重施加的惩罚有关。由特征组成的高维空间可用于获得准确的预测。L2 范数惩罚被用作正则化算法，而\
    \ L1 范数优于 L2 范数。支持向量机中的目标函数使用带有 L1 范数的合页损失最小化。见图 9-7。\n\n![../images/490826_1_En_9_Chapter/490826_1_En_9_Fig7_HTML.jpg](img/490826_1_En_9_Fig7_HTML.jpg)\n\
    \n图 9-7\n\n量子支持向量机\n\n线性规划是半定规划（SDP）的一种形式，它使用了稀疏支持向量机的公式。量子稀疏支持向量机使用量子半定规划求解器。求解半定规划的算法步骤如下所示：\n\
    \n1.  在字典中创建参数。\n2.  将数据集创建为输入对象。\n3.  算法基于输入数据集和参数执行。\n4.  打印包含成功率和详细信息的结果。\n\
