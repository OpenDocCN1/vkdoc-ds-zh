    现在，让我们来看看经典的 k-中位数算法。


    ## 经典 K-中位数算法


    k-中位数技术（见图 10-7）基于数据集的中位数选择质心。k-means 算法则选择簇内数据点的均值作为质心。从质心到簇内数据点的距离计算采用曼哈顿度量。两点`(x1,y1)`和`(x2,
    y2)`之间的欧几里得距离公式如下：


