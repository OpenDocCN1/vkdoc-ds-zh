- fmt: "# Initial Setup\n\nYou need to set up `Python 3.5` to run the code samples\
    \ in this chapter. You can download it from [https://www.python.org/downloads/release/python-350/](https://www.python.org/downloads/release/python-350/).\n\
    \n# Approximate Optimization Algorithms\n\nIn this section, we look at approximate\
    \ algorithms such as semidefinite programming and approximate combinatorial optimization.\n\
    \nApproximate combinatorial optimization helps in finding a solution closer to\
    \ the optimum value quickly. This technique may not give the best solution, however.\
    \ This method helps in finding a short path for a traveling salesman problem.\
    \ The traveling salesman problem is about a salesman who needs to travel within\
    \ `M` cities. The salesman can visit each city once but needs to end where he\
    \ started. The classic solution is to set the first city as the starting and end\
    \ points. The next step is to identify all possible permutations, `(M-1)!`, of\
    \ the cities. Each permutation needs to be checked for the cost or the goal. The\
    \ objective of the problem is to identify the permutation with the least cost.\
    \ See Figure [6-1](#490826_1_En_6_Chapter.xhtml#Fig1).\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig1_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig1_HTML.jpg)\n\
    \n*Figure 6-1 – Approximate combinatorial optimization*\n\nDynamic programming\
    \ can be used for this problem by breaking it down into subproblems. Start at\
    \ the first city, and for all other cities, create a subproblem starting from\
    \ the new city. These subproblems will create a recursion to identify the cheapest\
    \ travel itinerary for the salesperson.\n\nThe approximate optimization algorithm\
    \ calculates the optimal itinerary by finding the cost of the minimum spanning\
    \ tree. A minimum spanning tree is a subgroup of the connected path of the cities\
    \ without having cycles and lesser total edge cost.\n\nLet’s now look at semidefinite\
    \ programming algorithms.\n\n## Semidefinite Programming\n\nSemidefinite programming\
    \ is an important technique in optimization. The generality is the key principle\
    \ behind this method. The variable matrix in the optimization problem is constrained\
    \ to be positive semidefinite. The semidefinite programming term comes from the\
    \ constraint related to the positive semidefiniteness.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig2_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig2_HTML.jpg)\n\
    \n*Figure 6-2 – Semidefinite programming*\n\nThe quantum semidefinite programming\
    \ technique has the following steps:\n\n1.  Apply the oracle function for a search\
    \ violating the constraint.\n2.  Generate a density matrix.\n3.  Calculate the\
    \ phase estimation of the unitary operator on the density matrix.\n    a.  Estimate\
    \ `Tr[e^(- density matrix)]`.\n    b.  Check if the output is `λ`. If so, return\
    \ the value `λ -1e^^(-λ)`.\n4.  Execute step 1, and measure the density matrix\
    \ of the second system.\n5.  If the output is `λ`, accept it; otherwise, reject\
    \ it.\n6.  Keep iterating until this step is accepted.\n\n```\ndensity matrix\
    \ = Σk k λ k | Ψk > < λ k'|\n```\n\n> **Note:** The density matrix represents\
    \ the statistical state of the quantum system. In the classical system, probability\
    \ distribution is the equivalent.\n\nSemidefinite programming can be presented\
    \ mathematically. Given `n` real numbers and `c1, cn ∈ R`, and `p × p` Hermitian\
    \ matrices `D : B1,..,...,...Bp`, the objective is to maximize `Transpose (DX)`\
    \ such that `Transpose(B i X) < c i X >= 0`. The variable `X` is constrained to\
    \ be positive semidefinite.\n\n![../images/490826_1_En_6_Chapter/490826_1_En_6_Fig3_HTML.jpg](images/490826_1_En_6_Chapter/490826_1_En_6_Fig3_HTML.jpg)\n\
    \n*Figure 6-3 – Quantum annealing: semidefinite programming*\n\nThe problems solved\
    \ by a semidefinite programming method can be with no constraints or with constraints\
    \ such as equalities and inequalities. The input for the quantum semidefinite\
    \ programming algorithm consists of a sparse matrix, quantum states, and quantum\
    \ operators. A typical sparse matrix has at most `n` nonzero elements per row.\n\
    \nQuantum annealing is another semidefinite programming technique. It is related\
    \ to the quantum system’s behavior. This helps in solving NP-hard optimization\
    \ problems. An optimization problem like the traveling salesman problem can be\
    \ solved using quantum annealing. The solution is the ground state of the physical\
    \ system, which is based on the Hamiltonian function. The Hamiltonian function\
    \ describes the energy and motion of the physical system. The classical equivalent\
    \ is the simulated annealing, random search, and gradient descent algorithms.\n\
    \n> **Note:** The Hamiltonian operator is related to the potential and kinetic\
    \ energy sum for the quantum particles. Hamiltonian is Hermitian. A Hermitian\
    \ operator’s eigenvalues are real, and the eigenfunctions are orthogonal. The\
    \ eigenvalue shows the spread of the data or characteristic vector of a transformation,\
    \ which is linear.\n\nSemidefinite programming is related to using linear programming\
    \ by replacing the vectors with positive semidefinite matrices. It is based on\
    \ linear programming and convex quadratic programming. Semidefinite programming\
    \ generalizes the linear programming by using the block diagonal, symmetric, and\
    \ semidefinite matrices. These methods are used in structural design and control\
    \ theory–based applications. The methods are also used in the chemical industry\
    \ for identifying how to optimally mix chemical materials.\n\nThe maximum cut\
    \ problem is a well-known problem where semidefinite programming is applied. The\
    \ maximum cut problem is related to identifying a maximum cut in a graph. In a\
    \ given network or a graph, the goal is to identify a subgroup of vertices based\
    \ on the size of the edges between the vertices. The maximum cut problem is used\
    \ in large-scale integration applications.\n\nThe input for the problem is the\
    \ number of vertices, edges, and adjacency list with weights of the edges. Every\
    \ edge has the origin and the destination. The goal is to identify the cut that\
    \ has the highest total weight of the edges.\n\nNow let’s look at a semidefinite\
    \ programming example in `Python`.\n\nThe mathematical problem is as follows:\n\
    \nminimize `Transpose (CX)`\n\nsuch that `Transpose(A i X) < b i X >= 0`. Variable\
    \ `X` is constrained to be positive semidefinite.\n\nIn the following `Python`\
    \ code, `CMatrix` is generated randomly. The `A` and `b` matrices are also generated\
    \ randomly. `CVXPy` has a mathematical API to solve convex optimization problems.\
    \ The optimum value is calculated for the generated problem.\n\n### Code Sample\n\
    \n```python\nimport cvxpy as cvxp\nimport numpy as nump\nn = 3\np = 3\nnump.random.seed(1)\n\
    CMat = nump.random.randn(n, n)\nAMat = []\nbMat = []\nfor i in range(p):\n   \
    \ AMat.append(nump.random.randn(n, n))\n    bMat.append(nump.random.randn())\n\
    XMat = cvxp.Variable((n,n), symmetric=True)\nconstraints = [XMat >> 0]\nconstraints\
    \ += [\n    cvxp.trace(AMat[i]@XMat) == bMat[i] for i in range(p)\n]\nproblem\
    \ = cvxp.Problem(cvxp.Minimize(cvxp.trace(CMat@XMat)), constraints)\nproblem.solve()\n\
    print(\"The optimal value of the problem is\", problem.value)\nprint(\"A solution\
    \ X is\")\nprint(XMat.value)\n```\n\n### Command\n\n```\npip3 install cvxpy\n\
    pip3 install nump\npython3 sdp_cvx.py\n```\n\n### Output\n\n```\nThe optimal value\
    \ of the problem is 2.654351510231541\nA solution X is\n[[ 1.60805795 -0.59770492\
    \ -0.69576152]\n [-0.59770492  0.22229041  0.24689363]\n [-0.69576152  0.24689363\
    \  1.39679885]]\n```\n\nSimilarly, real-life problems can be either maximize or\
    \ minimize problems. They can be modeled as in the previous code with constraints\
    \ modeled as linear equations."
