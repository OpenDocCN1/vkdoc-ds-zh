    \n宇宙中的任何事物都可以是一个对象，它可以是生物或非生物。一个*集合*是一组对象的全体。集合中的对象被称为*成员*（或*元素*）。以下是集合的一些例子：\n\
    \n- 英语中的辅音字母\n- 质数\n- 算术数列\n\n使用大写字母来表示集合。集合的元素用小写字母表示。一个很好的例子是 `N` 代表自然数集合。集合使用花括号\
    \ `{ }` 以枚举法表示。例如，`A = {1,2,3,4,5}` 是一个所有小于 6 的整数组成的集合。集合中的每个成员只列出一次，顺序不重要。另一种表示集合的方法是描述法。`C\
    \ = {y : y` 是英文字母中的辅音字母`}`。\n\n集合分为以下几种类型：\n\n- 空集\n- 有限集\n- 无限集\n- 单元素集\n\n空集的成员数量为\
    \ 0。单元素集的成员数量为 1。有限集具有有限数量的元素。空集的一个很好例子是平方为 -2 的实数集合。\n\n集合的阶是有限集中唯一成员的数量。这也被称为集合的*基数*。如果两个集合的基数相同，则它们相等。子集是其元素都是超集成员的集合。例如，`A\
    \ = {1,2}` 和 `B = {1,2,3,4}`。在这种情况下，`A` 是 `B` 的*子集*，而 `B` 是 `A` 的*超集*。\n\n一个*幂集*是给定集合所有子集构成的集合。全集\
    \ `U` 是给定集合的超集。如果两个集合的交集是空集，则它们不相交。维恩图用于表示集合之间的关系（图 2-7）。\n\n![../images/490826_1_En_2_Chapter/490826_1_En_2_Fig7_HTML.jpg](img/490826_1_En_2_Fig7_HTML.jpg)\n\
    \n图 2-7\n\n维恩图\n\n两个集合的*并集*是包含属于 `A` 或 `B` 或两者中所有元素的集合。例如，`A = {1,2,3}`，`B = {4,5,6}`，则\
    \ `A U B = {1,2,3,4,5,6}`。\n\n两个集合的*交集*是包含两个集合所有公共元素的集合。例如，`A = {1,2,3}`，`B =\
    \ {2,4,5}`，则 `A ∩ B = {2}`。\n\n集合 `A` 和 `B` 的*差集*是属于 `A` 但不属于 `B` 的元素组成的集合。例如，`A\
    \ = {1,2,3}`，`B = {2,4,5}`，则 `A - B = {1,3}`。\n\n一个集合的*补集*是包含全集 `U` 中但不含有集合 `A`\
    \ 元素的集合。\n\n现在让我们看一个 Python 代码示例，展示并集、交集、差集和对称差集等集合运算。\n"
