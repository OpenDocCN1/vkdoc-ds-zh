- "# 8. 符号微分与积分\n\n## 使用 MATLAB 进行符号计算。符号变量\n\nMATLAB 的符号数学工具箱模块允许你轻松地对公式和表达式进行符号化地操作和处理。你可以展开、因式分解和简化多项式、有理式和三角函数式；求解多项式方程和方程组的代数解；符号化地计算导数和积分；求解微分方程的符号解；处理幂、极限以及代数级数的许多其他方面。为此，MATLAB\
  \ 首先要求所有变量（或代数表达式）使用命令 `syms`（或 `sym`）声明为符号变量。例如，如果我们想将 `6*a*b + 3*a² + 2*a*b` 视为一个符号表达式并简化它，我们首先需要将变量\
  \ `a` 和 `b` 声明为符号变量，如下所示：\n\n```\n>> syms a b\n>> simplify(6*a*b + 3*a² + 2*a*b)\n\
  ans =\n8 * a * b + 3 * a ^ 2\n```\n\n或者，我们可以使用以下表达式：\n\n```\n>> simplify(sym('6*a*b\
  \ + 3*a² + 2*a*b'))\nans =\n8 * a * b + 3 * a ²\n```\n\nMATLAB 的符号数学工具箱提供了几个可用于定义和操作符号变量的命令。下面将对这些命令进行描述：\n\
  \n| `syms x y z… t` | 创建符号变量 `x`, `y`, `z`,…, `t`。 |\n| `syms x y z… t real` | 创建符号变量\
  \ `x`, `y`, `z`,…, `t` 并假定它们是实数。 |\n| `syms x y z… t unreal` | 创建符号变量 `x`, `y`,\
  \ `z`,…, `t` 并假定它们不是实数。 |\n| `syms` | 列出工作区中的符号变量。 |\n| `x = sym ('x')` | 变量 `x`\
  \ 成为符号变量（等同于 `syms x`）。 |\n| `x = sym ('x', real)` | 变量 `x` 成为实数符号变量。 |\n| `x =\
  \ sym('x',unreal)` | 变量 `x` 成为非实数符号变量。 |\n| `s = sym (A)` | 从 `A` 创建一个符号对象，其中 `A`\
  \ 可以是字符串、标量、数组、数值表达式等。 |\n| `s = sym (A, 'option')` | 将数组、标量或数值表达式 `A` 根据指定选项转换为符号对象。选项可以是\
  \ `'f'`（浮点）、`'r'`（有理数）、`'e'`（错误格式）或 `'d'`（十进制）。 |\n| `double(x)` | 将变量或表达式 `x` 转换为双精度数值。\
  \ |\n| `sym2poly (poly)` | 返回一个向量，其分量是符号多项式 `poly` 的系数。 |\n| `poly2sym (vector)`\
  \ | 返回一个符号多项式，其系数是向量 `vector` 的分量。 |\n| `poly2sym(vector, 'v')` | 返回一个变量为 `v` 的符号多项式，其系数是向量\
  \ `vector` 的分量。 |\n| `char (X)` | 将非负整数数组 `X`（解释为 ASCII 值）转换为字符串。 |\n| `latex (S)`\
  \ | 将符号表达式 `S` 转换为 Latex 代码。 |\n| `ccode (S)` | 将符号表达式 `S` 转换为 C 代码。 |\n| `fortran\
