- "# 使用 MATLAB 进行数值计算。微分方程应用\n\n\n\n## MATLAB 与编程\n\nMATLAB 可作为一种高级编程语言使用，包含数据结构、函数、流程控制指令、输入/输出管理，甚至面向对象编程。\n\
  \nMATLAB 程序通常编写在称为 M 文件的文件中。M 文件无非就是一段 MATLAB 代码（脚本），用于执行一系列命令或函数，这些命令或函数可以接受参数并产生输出。M\
  \ 文件可使用文本编辑器创建。\n\n### 文本编辑器\n\n通过单击 MATLAB 桌面上的新建 M 文件按钮 ![A978-1-4842-0310-1_6_Figa_HTML.jpg](img/A978-1-4842-0310-1_6_Figa_HTML.jpg)，或在\
  \ MATLAB 桌面（图 6-1）或命令窗口（图 6-2）中选择“文件 ➤ 新建 ➤ M 文件”，即可激活编辑器/调试器。编辑器/调试器会打开一个文件，用于创建\
  \ M 文件，即一个空白文件，我们将在其中编写 MATLAB 编程代码（图 6-3）。您可以通过 MATLAB 桌面上的“文件 ➤ 打开”（图 6-1）打开现有的\
  \ M 文件，或者，也可以在命令窗口中使用 `Open` 命令（图 6-2）。您还可以通过右键单击当前目录窗口，然后从弹出的菜单中选择“新建 ➤ M 文件”（图\
  \ 6-4）来打开编辑器/调试器。使用“打开”菜单选项，您可以打开一个现有的 M 文件。您可以同时打开多个 M 文件，每个文件将显示在单独的窗口中。\n\n![A978-1-4842-0310-1_6_Fig4_HTML.jpg](img/A978-1-4842-0310-1_6_Fig4_HTML.jpg)\n\
