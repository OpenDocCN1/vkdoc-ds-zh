  A = x-x**2/2+x**3/3-x**4/4+x**5/5\n```\n\n\n\n"
- '# 符号函数：替换与函数运算


  MATLAB 的符号数学模块允许你直接使用 `f = ''函数表达式''`（或 `f = 函数表达式`）语法定义符号函数，前提是变量已事先通过 `syms` 声明为符号变量。


  一旦符号函数被显式定义，就可以使用如下所示命令为函数中的变量替换值，即计算函数在给定点的值：


  | `subs(f, a)` | 计算函数 `f` 在点 `a` 处的值。 |

  | :--- | :--- |

  | `subs(f, a, b)` | 在函数 `f` 中将 `a` 替换为 `b`。 |

  | `subs(f, 变量, 值)` | 在函数 `f` 中将变量 `变量` 替换为值 `值`。 |

  | `subs(f, {x, y, ...}, {a, b, ...})` | 在函数 `f` 中将变量 `{x, y, ...}` 分别替换为值 `{a, b,
  ...}`。 |


  第一个例子中，我们定义函数 `f(x) = x³` 并计算 `f(2)` 和 `f(b+2)`。


  ```

  >> f=''x³''


  f =


  x³


  >> A=subs(f,2)


  A =


  8


  >> syms b


  >> B=subs(f,b+2)


  B =


  (b+2) ^ 3

  ```


  在下面的例子中，我们考虑二元函数 `f(a, b) = a+b`，首先将 `a` 替换为 `4`，然后将 `a` 和 `b` 分别替换为 `3` 和 `5`（即求
  `f(3,5)`）。


  ```

  >> syms a b


  >> subs(a+b,a,4)


  ans =


  4+b


  >> subs(a+b,{a,b},{3,5})


  ans =


  8

  ```


  以下是另外三个替换示例。


  ```

  >> subs (cos (a) + (b), {a, b}, {sym (''alpha''), 2})


  ans =


  cos (alpha) + sin (2)


  >> subs(''exp(a*t)'',''a'',-magic(2))


  ans =


  [exp (t), exp(-3*t)]

  [exp(-4*t), exp(-2*t)]


  >> syms x y


  >> subs(x*y,{x,y},{[0 1;-1 0],[1-1;-2 1]})


  ans =


  0-1

  2 0

  ```


  除了替换功能，MATLAB 还提供了一些执行函数运算的命令，如函数的加、减、乘、除运算，以及复合与求逆。下表总结了这些命令的语法：


  | `symadd(f, g)` | 求函数 `f` 和 `g` 的和（`f + g`） |

  | :--- | :--- |

  | `symop(f, ''+'', g, ''+'', h, ''+'',.....)` | 返回和 `f+g+h+...`。注意，`symop` 在更新版本的
  MATLAB 中已废弃。 |

  | `symsub(f, g)` | 返回 `f` 和 `g` 的差（`f-g`） |

  | `symop(f, ''-'', g, ''-'', h, ''-'',.....)` | 返回差 `f-g-h-...` |

  | `symmul(f, g)` | 返回 `f` 和 `g` 的积（`f * g`） |

  | `symop(f, ''*'', g, ''*'', h, ''*'',.....)` | 返回积 `f * g * h *...` |

  | `symdiv(f, g)` | 返回 `f` 和 `g` 的商（`f/g`） |

  | `symop(f, ''/'', g, ''/'', h, ''/'',.....)` | 返回连商 `((f/g)/h)/...` |

  | `sympow(f, k)` | 将 `f` 提升为 `k` 次幂（`k` 为标量） |

  | `symop(f, ''^'', g)` | 将一个函数提升为另一个函数的幂（`f^g`） |

  | `compose(f, g)` | 复合 `f` 和 `g`（`f ∞ g (x) = f(g(x))`） |

  | `compose(f, g, u)` | 复合 `f` 和 `g`，将表达式 `u` 作为 `f` 和 `g` 的定义域 |

  | `g = finverse(f)` | 返回函数 `f` 的反函数 |

  | `g = finverse(f, v)` | 返回函数 `f` 的反函数，使用符号变量 `v` 作为自变量 |


  在下面的例子中，给定函数 `f(x)=x²`，`g(x)=x³+1` 和 `h(x) = sin(x)+cos(x)`，我们计算 `(f+g)(x)`，`(f-g+h)(x)`，`(f/g)(x)`，`f(g(x))`，`f(h(π/3))`
  和 `f(g(h(sin(x))))`。


  ```

  >> syms x


  >> f = x ^ 2; g = x ^ 3 + 1; h = sin (x) + cos (x);


  >> sum = symadd(f,g)


  sum =


  x²+x³+1


  >> combination = symadd(symsub(f,g),h)


  combination =


  x ^ 2-x ^ 3-1 + sin (x) + cos (x)


  >> combination = symop(f,''-'',g,''+'',h)


  combination =


  x ^ 2-x ^ 3-1 + sin (x) + cos (x)


  >> quotient = symdiv (f, g)


  quotient =


  x ^ 2-/(x³+1)


  >> composite = subs (compose (g, f), x-1)


  composite =


  (x-1) ^ 6 + 1


  >> composite1 = subs (compose (f, h), pi/3)


  composite1 =


  1.8660


  >> composite1 = subs (compose (f, h), '' pi/3'')


  composite1 =


  (sin ((pi/3)) + cos ((pi/3))) ^ 2


  >> composite2 = subs (compose (f , compose (g, h)), ''sin (x)'')


  composite2 =


  ((sin (sin (x)) + cos (sin (x))) ^ 3 + 1) ^ 2

  ```


  在下面的例子中，我们求函数 `f(x) = sin(x²)` 的反函数，并验证结果正确。


  ```

  >> syms x


  >> f = sin(x²)


  f =


  sin(x²)


  >> g = finverse(f)


  g =


  asin(x)^(1/2)


  >> compose(f,g)


  ans =


  x

  ```


  MATLAB 还提供了一组预定义的符号特殊函数，其语法如下表所示：


  | `cosint(x)` | 余弦积分，![A978-1-4842-0310-1_8_Fige_HTML.jpg](img/A978-1-4842-0310-1_8_Fige_HTML.jpg)
  ，其中 γ 是欧拉-马歇罗尼常数 0.5772156649... |

  | :--- | :--- |

  | `sinint(x)` | 正弦积分，![A978-1-4842-0310-1_8_Figf_HTML.jpg](img/A978-1-4842-0310-1_8_Figf_HTML.jpg)
  。 |

  | `hypergeom(n,d,z)` | 广义超几何函数。 |

  | `lambertw(x)` | 朗伯函数 λ(x)，由方程 λ(x) * e^(λ(x)) = x 定义。 |

  | `zeta(x)` | 黎曼 zeta 函数 ζ(x)，定义为 ![A978-1-4842-0310-1_8_Figg_HTML.jpg](img/A978-1-4842-0310-1_8_Figg_HTML.jpg)。
  |

  | `zeta(n,x)` | `zeta(x)` 的第 n 阶导数。 |


  第一个例子中，我们求级数 ![A978-1-4842-0310-1_8_Figh_HTML.jpg](img/A978-1-4842-0310-1_8_Figh_HTML.jpg)
  的和，该值等于 ζ(4)。


  ```

  >> zeta (4)


  ans =


  1.0823

  ```


  接下来我们求积分 ![A978-1-4842-0310-1_8_Figi_HTML.jpg](img/A978-1-4842-0310-1_8_Figi_HTML.jpg)。我们使用正弦积分函数。


  ```

  >> sinint (2)


  ans =


  1.6054

  ```




  '
- "# 数学分析：函数、极限、连续性与级数\n\nMATLAB 的符号数学模块让您能够轻松处理数学分析问题。它可以计算极限、求导数、求和级数、寻找函数的泰勒级数、计算积分以及处理方程。\n\
  \n在求解极限时，可使用相同函数来计算数列极限、函数极限、函数序列极限，当然也能用于分析函数的连续性以及数值级数和幂级数的收敛性。单变量和多变量分析的方法是类似的。以下是可用的函数。\n\
  \n| `limit (sequence, inf)` | 计算由通项表示的数列在 n 趋于无穷大时的极限。 |\n| `limit (sequence, inf)`\
  \ | 计算由通项表示的数列在 n 趋于无穷大时的极限。 |\n| `limit (function, x, a)` | 计算由解析表达式表示的关于变量 x 的函数，当变量\
  \ x 趋于值 a 时的极限。 |\n| `limit (function, a)` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 趋于值 a 时的极限。\
  \ |\n| `limit (function, x, a, 'right')` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 从右侧趋于值 a\
  \ 时的极限。 |\n| `limit (function, x, a, 'left')` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 从左侧趋于值\
  \ a 时的极限。 |\n| `symsum (S, v, a, b)` | 求通项为 S、变量 v 从 a 到 b 的级数之和。 |\n| `symsum (S,\
  \ v)` | 求通项为 S、变量 v 的值从 0 到 v-1 的级数之和。 |\n| `r = symsum (S)` | 返回关于符号变量 k（由 `findsym`\
  \ 确定）的通项为 S 的级数之和，其中 k 的值从 0 到 k-1。 |\n| `symsum (S, a, b)` | 求关于符号变量 k（由 `findsym`\
  \ 确定）的通项为 S 的级数之和，其中 k 的值从 a 到 b。 |\n\n作为第一个例子，我们计算以下数列极限：\n\n![A978-1-4842-0310-1_8_Figj_HTML.jpg](img/A978-1-4842-0310-1_8_Figj_HTML.jpg)\n\
  \n我们得到：\n\n```\n>> syms n\n>> limit (((2*n-3) /(3*n-7)) ^ 4, inf)\nans =\n16/81\n\
  >> limit ((3*n³+7*n²+1) /(4*n³-8*n+5), n, inf)\nans =\n3/4\n>> limit (((n+1)/2)\
  \ * ((n⁴+1)/n ^ 5), inf)\nans =\n1/2\n>> limit (((n+1)/n ^ 2) ^(1/n), inf)\nans\
  \ =\n1\n```\n\n接下来我们计算以下函数极限：\n\n![A978-1-4842-0310-1_8_Figk_HTML.jpg](img/A978-1-4842-0310-1_8_Figk_HTML.jpg)\n\
  \n我们得到：\n\n```\n>> syms x a\n>> limit((x-1)/(x^(1/2)-1),x,1)\nans =\n2\n>> limit((x-(x+2)^(1/2))/((4*x+1)^(1/2)-3),2)\n\
  ans =\n9/8\n>> limit((1+x)^(1/x))\nans =\nexp (1)\n>> limit(sin(a*x)²/x²,x,0)\n\
  ans =\na²\n```\n\n在下面的例子中，我们计算定义在 `R` 上的函数序列 `gn = (x²+n*x)/n` 的极限。\n\n```\n>> limit((x²+n*x)/n,n,inf)\n\
  ans =\nx\n```\n\n我们看到极限函数的图形是通过第一和第三象限的对角线。我们可以如下演示这一点（参见图 8-1）：\n\n```\n>> fplot('[(x²+x),(x²+2*x)/2,(x²+3*x)/3,(x²+4*x)/4,\n\
  (x²+5*x)/5,(x²+5*x)/5,(x²+6*x)/6,(x²+7*x)/7,(x²+8*x)/8,\n(x²+9*x)/9]',[-2,2,-2,2])\n\
  ```\n\n![A978-1-4842-0310-1_8_Fig1_HTML.jpg](img/A978-1-4842-0310-1_8_Fig1_HTML.jpg)\n\
  \n图 8-1.\n\n以下例子验证了函数 `f(x) = sin(x) / x` 在 `R-{0}` 上的连续性。下面的命令检查了 ![A978-1-4842-0310-1_8_Figl_HTML.jpg](img/A978-1-4842-0310-1_8_Figl_HTML.jpg)\
  \ 是否成立。\n\n```\n>> syms x a\n>> limit (sin (x) / x, x, a)\nans =\nsin (a) /a\n```\n\
  \n接下来我们证明函数 ![A978-1-4842-0310-1_8_Figm_HTML.jpg](img/A978-1-4842-0310-1_8_Figm_HTML.jpg)\
  \ 在点 `x = 0` 不连续，通过说明其左右极限不匹配（一个为 0，另一个为无穷大）。\n\n```\n>> syms x\n>> limit((exp(1/x)),x,0,'right')\n\
  ans =\ninf\n>> limit((exp(1/x)),x,0, 'left')\nans =\n0\n```\n\n在以下例子中，我们通过应用比值检验法（![A978-1-4842-0310-1_8_Figo_HTML.jpg](img/A978-1-4842-0310-1_8_Figo_HTML.jpg)）来确定级数\
  \ ![A978-1-4842-0310-1_8_Fign_HTML.jpg](img/A978-1-4842-0310-1_8_Fign_HTML.jpg)\
  \ 是否收敛，如果收敛，则计算其和。\n\n```\n>> syms n\n>> f = n/2 ^ n\nf =\nn/(2^n)\n>> limit (subs(f,n,n+1)/f,\
  \ n, inf)\nans =\n1/2\n```\n\n我们看到相邻项比值的极限小于 1，这意味着该级数收敛。我们使用以下方法计算其和：\n\n```\n\
  >> symsum(f,n,1,inf)\nans =\n2\n```\n\n\n\n## 导数、积分与微分方程\n\n下文将介绍在数学分析中，处理导数、积分和微分方程时常用的\
  \ MATLAB 函数。我们首先从与微分相关的函数开始。\n\n| `diff('f', 'x')` | 返回 `f` 对 `x` 的导数。 |\n| `syms\
