- "# 7. 具有初值和边值的常微分方程与偏微分方程\n\n## 微分方程的数值解\n\nMATLAB 在其基本模块中提供了用于数值求解常微分方程 (ODE)、微分代数方程\
  \ (DAE) 和边值问题的命令。它还可以求解具有边值的微分方程组以及抛物型和椭圆型偏微分方程。\n\n\n\n## 带初始值的常微分方程\n\n常微分方程包含因变量\
  \ `y` 关于自变量 `t` 的一个或多个导数。带初始值的一阶常微分方程可表示为：\n\n![A978-1-4842-0310-1_7_Figa_HTML.jpg](img/A978-1-4842-0310-1_7_Figa_HTML.jpg)\n\
  \n上述问题可以推广到 `y` 为向量的情形，即 `y = (y[1], y[2], …, y[n])`。\n\n下表中列出了 MATLAB 基本模块中与带初始值的常微分方程和微分代数方程相关的命令：\n\
  \n| 命令 | 求解问题类型、数值方法及语法 |\n| --- | --- |\n| `ode45` | 基于龙格-库塔法的常微分方程 |\n| `ode23`\
  \ | 基于龙格-库塔法的常微分方程 |\n| `ode113` | 基于亚当斯法的常微分方程 |\n| `ode15s` | 使用 NDF（BDF）的微分代数方程和常微分方程\
  \ |\n| `ode23s` | 基于罗森布罗克法的常微分方程 |\n| `ode23t` | 基于梯形法则的常微分和微分代数方程 |\n| `ode23tb`\
  \ | 使用 TR-BDF2 的常微分方程 |\n\n上述七个命令的通用语法如下：\n\n`[T, y] = solver(odefun,tspan,y0)`\n\
  \n`[T, y] = solver(odefun,tspan,y0,options)`\n\n`[T, y] = solver(odefun,tspan,y0,options,p1,p2...)`\n\
  \n`[T, y, TE, YE, IE] = solver(odefun,tspan,y0,options)`\n\n其中，`solver` 可以是 `ode45`、`ode23`、`ode113`、`ode15s`、`ode23s`、`ode23t`\
  \ 或 `ode23tb` 中的任意一个命令。\n\n参数 `odefun` 计算微分方程或方程组的右端项，方程形式为 `y’ = f(t, y)` 或 `M(t,\
  \ y)y’ = f(t, y)`，其中 `M(t, y)` 称为质量矩阵。命令 `ode23s` 只能求解具有恒定质量矩阵的方程。命令 `ode15s` 和\
  \ `ode23t` 可求解代数微分方程以及具有奇异质量矩阵的常微分方程组。参数 `tspan` 是一个向量，指定积分范围 `[t[0], tf]`（`tspan\
  \ = [t[0], t[1], …, t[f]]`，其元素必须为递增或递减序列，用于获取特定 `t` 值对应的解）。参数 `y[0]` 指定初始条件向量。参数\
  \ `p1`、`p2`、... 是传递给 `odefun` 的可选参数。参数 `options` 通过命令 `options odeset` 指定额外的积分选项，该命令可在程序手册中找到。向量\
  \ `T` 和 `y` 分别给出解的自变量和因变量的数值结果。\n\n作为第一个示例，我们求解以下常微分方程组在区间 `[0,12]` 上的解：\n\n![A978-1-4842-0310-1_7_Figb_HTML.jpg](img/A978-1-4842-0310-1_7_Figb_HTML.jpg)\n\
  \n为此，我们在一个 M 文件中定义一个名为 `system1` 的函数，该函数将存储方程组的表达式。该函数首先定义一个包含三行的列向量，随后为这些行分别赋值，这些赋值构成了三个方程的语法（图\
  \ 7-1）。\n\n![A978-1-4842-0310-1_7_Fig1_HTML.jpg](img/A978-1-4842-0310-1_7_Fig1_HTML.jpg)\n\
  \n图 7-1。\n\n接着，我们在命令窗口中输入以下内容来求解方程组：\n\n```\n>> [T, Y] = ode45(@system1,[0 12],[0\
  \ 1 1])\nT =\n    0\n    0.0001\n    0.0001\n    0.0002\n    0.0002\n    0.0005\n\
  \    .\n    .\n    11.6136\n    11.7424\n    11.8712\n    12.0000\nY =\n     0 \
  \        1.0000    1.0000\n     0.0001    1.0000    1.0000\n     0.0001    1.0000\
  \    1.0000\n     0.0002    1.0000    1.0000\n     0.0002    1.0000    1.0000\n\
  \     0.0005    1.0000    1.0000\n     0.0007    1.0000    1.0000\n     0.0010 \
  \   1.0000    1.0000\n     0.0012    1.0000    1.0000\n     0.0025    1.0000   \
  \ 1.0000\n     0.0037    1.0000    1.0000\n     0.0050    1.0000    1.0000\n   \
  \  0.0062    1.0000    1.0000\n     0.0125    0.9999    1.0000\n     0.0188    0.9998\
  \    0.9999\n     0.0251    0.9997    0.9998\n     0.0313    0.9995    0.9997\n\
  \     0.0627    0.9980    0.9990\n     .\n     .\n     0.8594   -0.5105    0.7894\n\
  \     0.7257   -0.6876    0.8552\n     0.5228   -0.8524    0.9281\n     0.2695 \
  \  -0.9631    0.9815\n    -0.0118   -0.9990    0.9992\n    -0.2936   -0.9540   \
  \ 0.9763\n    -0.4098   -0.9102    0.9548\n    -0.5169   -0.8539    0.9279\n   \
  \ -0.6135   -0.7874    0.8974\n    -0.6987   -0.7128    0.8650\n```\n\n为了更好地解释结果，可以使用以下命令将上述数值解绘制成图形（图\
  \ 7-2）：\n\n```\n>> plot (T, Y(:,1), '-', T, Y(:,2),'-', T, Y(:,3),'. ')\n```\n\n\
  ![A978-1-4842-0310-1_7_Fig2_HTML.jpg](img/A978-1-4842-0310-1_7_Fig2_HTML.jpg)\n\n\
  图 7-2。\n\n\n\n## 带边界条件的常微分方程\n\nMATLAB 还允许您求解带有边界条件的常微分方程。边界条件规定了在定义区间端点处，解函数值之间必须满足的关系。这类问题的最简单形式是方程组：\n\
  \n![A978-1-4842-0310-1_7_Figc_HTML.jpg](img/A978-1-4842-0310-1_7_Figc_HTML.jpg)\n\
  \n其中 `x` 是自变量，`y` 是因变量，`y'` 是 `y` 对 `x` 的导数（即 `y' = dy/dx`）。此外，区间 `[a, b]` 上的解必须满足以下边界条件：\n\
  \n![A978-1-4842-0310-1_7_Figd_HTML.jpg](img/A978-1-4842-0310-1_7_Figd_HTML.jpg)\n\
  \n更一般地，这种类型的微分方程可以表示如下：\n\n![A978-1-4842-0310-1_7_Fige_HTML.jpg](img/A978-1-4842-0310-1_7_Fige_HTML.jpg)\n\
  \n其中向量 `p` 由参数构成，这些参数必须通过边界条件与解同时确定。\n\n求解这些问题的命令是 `bvp4c`，其语法如下：\n\n```\nSol =\
  \ bvp4c (odefun, bcfun, solinit)\n```\n\n```\nSol = bvp4c (odefun, bcfun, solinit,\
  \ options)\n```\n\n```\nSol = bvp4c (odefun, bcfun, solinit, options, p1, p2...)\n\
  ```\n\n在上述语法中，`odefun` 是一个计算 `f(x, y)` 的函数。它可以采用以下形式之一：\n\n```\ndydx = odefun(x,\
  \ y)\n```\n\n```\ndydx = odefun(x, y, p1, p2, ...)\n```\n\n```\ndydx = odefun(x,\
  \ y, parameters)\n```\n\n```\ndydx = odefun(x, y, parameters, p1, p2, ...)\n```\n\
  \n`bvp4c` 中的参数 `bcfun` 是一个计算边界条件残差的函数。其形式如下：\n\n```\nRes = bcfun(ya, yb)\n```\n\n\
  ```\nRes = bcfun(ya, yb, p1, p2, ...)\n```\n\n```\nRes = bcfun(ya, yb, parameters)\n\
  ```\n\n```\nRes = bcfun(ya, yb, parameters, p1, p2, ...)\n```\n\n参数 `solinit` 是一个包含解的初始猜测的结构体。它具有以下字段：`x`（给出初始网格的有序节点，以便边界条件施加于\
  \ `a = solinit.x(1)` 和 `b = solinit.x(end)`）；以及 `y`（解的初始猜测，以向量形式给出，使得第 i 个条目是解的第\
  \ i 个分量在所有由 `x` 给出的网格点上的常数猜测）。结构体 `solinit` 使用命令 `bvpinit` 创建。其语法为 `solinit = bvpinit(x,\
  \ y)`。\n\n作为示例，我们求解以下二阶微分方程：\n\n![A978-1-4842-0310-1_7_Figf_HTML.jpg](img/A978-1-4842-0310-1_7_Figf_HTML.jpg)\n\
  \n其解必须满足边界条件：\n\n![A978-1-4842-0310-1_7_Figg_HTML.jpg](img/A978-1-4842-0310-1_7_Figg_HTML.jpg)\n\
  \n这等价于以下问题（其中 `y[1] = y` 且 `y[2] = y'`）：\n\n![A978-1-4842-0310-1_7_Figh_HTML.jpg](img/A978-1-4842-0310-1_7_Figh_HTML.jpg)\n\
  \n我们在区间 `[0,4]` 上考虑五个等距点的网格，我们对解的初始猜测是 `y[1] = 1` 和 `y[2] = 0`。这些假设包含在以下语法中：\n\n\
  ```\n>> solinit = bvpinit (linspace (0,4,5), [1 0]);\n```\n\n图 7-3 和图 7-4 描绘的 M\
  \ 文件展示了如何输入方程及其边界条件。\n\n![A978-1-4842-0310-1_7_Fig4_HTML.jpg](img/A978-1-4842-0310-1_7_Fig4_HTML.jpg)\n\
  \n图 7-4.\n\n![A978-1-4842-0310-1_7_Fig3_HTML.jpg](img/A978-1-4842-0310-1_7_Fig3_HTML.jpg)\n\
  \n图 7-3.\n\n使用以下语法求解方程：\n\n```\n>> Sun = bvp4c (@twoode, @twobc, solinit);\n```\n\
  \n可以使用命令 `bvpval` 绘制解的图形（图 7-5），如下所示：\n\n```\n>> y = bvpval (Sun, linspace (0,4));\n\
  >> plot (x, y(1,:));\n```\n\n![A978-1-4842-0310-1_7_Fig5_HTML.jpg](img/A978-1-4842-0310-1_7_Fig5_HTML.jpg)\n\
  \n图 7-5.\n\n\n\n## 偏微分方程\n\nMATLAB 的基本模块具有求解带初边值条件的偏微分方程和偏微分方程组的功能。用于计算解的基本函数是`pedepe`，用于评估这些解的基本函数是`pdeval`。\n\
  \n函数`pedepe`的语法如下：\n\n```\nSol = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan)\n\
  Sol = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan, options)\nSun = pdepe(m, pdefun,\
  \ icfun, bcfun, xmesh, tspan, options, p1, p2...)\n```\n\n参数 `m` 根据问题的对称性（分别对应块状、圆柱状或球状）取值为\
  \ 0、1 或 2。参数 `pdefun` 定义微分方程的组成，`icfun` 定义初始条件，`bcfun` 定义边界条件，`xmesh` 和 `tspan`\
  \ 是指定数值解所需点 `[x[0], x[1], ..., x[n]]` 和 `[t[0], t[1], ..., t[f]]` 的向量（n, f ≥ 3），`options`\
  \ 指定底层求解器的某些计算选项（`RelTol`、`AbsTol`、`NormControl`、`InitialStep` 和 `MaxStep` 分别用于指定相对容差、绝对容差、范数容差、初始步长和最大步长），而\
  \ `p1`、`p2`、... 是传递给函数 `pdefun`、`icfun` 和 `bcfun` 的参数。\n\n`pdepe` 求解如下形式的偏微分方程：\n\
  \n![A978-1-4842-0310-1_7_Figi_HTML.jpg](img/A978-1-4842-0310-1_7_Figi_HTML.jpg)\n\
  \n其中 a ≤ x ≤ b 且 t[0] ≤ t ≤ t[f]。此外，对于 t = t[0] 以及所有 x，解分量满足初始条件：\n\n![A978-1-4842-0310-1_7_Figj_HTML.jpg](img/A978-1-4842-0310-1_7_Figj_HTML.jpg)\n\
  \n并且对于所有 t 以及每个 x = a 或 x = b，解分量满足如下形式的边界条件：\n\n![A978-1-4842-0310-1_7_Figk_HTML.jpg](img/A978-1-4842-0310-1_7_Figk_HTML.jpg)\n\
  \n此外，我们有 `a = xmesh(1)`、`b = xmesh(end)`、`tspan(1) = t[0]` 和 `tspan(end) = t[f]`。而且\
  \ `pdefun` 计算偏微分方程中的项 c、f 和 s，因此：\n\n```\n[c, f, s] = pdefun(x, t, u, dudx)\n```\n\
  \n类似地，`icfun` 评估初始条件：\n\n```\nu = icfun(x)\n```\n\n最后，`bcfun` 评估边界条件中的项 p 和 q：\n\
  \n```\n[pl, ql, pr, qr] = bcfun(xl, ul, xr, ur, t)\n```\n\n作为第一个示例，我们求解以下偏微分方程（x\
  \ ∈ [0,1] 且 t ≥ 0）：\n\n![A978-1-4842-0310-1_7_Figl_HTML.jpg](img/A978-1-4842-0310-1_7_Figl_HTML.jpg)\n\
