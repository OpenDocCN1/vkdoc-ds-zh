  \n的变系数非齐次线性方程称为柯西-欧拉方程。\n\nMATLAB 可以直接使用 `dsolve` 或 `maple('dsolve')` 命令求解此类方程。\n\
  \n### 练习 3-5\n\n求解下列微分方程：\n\n![A978-1-4842-0310-1_3_Figw_HTML.jpg](img/A978-1-4842-0310-1_3_Figw_HTML.jpg)\n\
