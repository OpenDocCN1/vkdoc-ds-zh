- "# 线性代数：化简与求解方程\n\nMATLAB 专门处理了用于简单、有理数和复数代数表达式的计算。符号数学工具箱中的函数能高效实现代数表达式的化简、因式分解、合并与展开等运算，并包含三角表达式和复变量表达式。这些函数的语法如下。\n\
  \n| `r = collect(S)` `r = collect(S, v)` | 根据变量 `v`（若未指定 `v`，则按 `x`）合并多项式数组 `S`\
  \ 中的每个多项式。 |\n| `r = expand(S)` | 展开 `S` 中包含的每个多项式、三角、指数或对数函数。 |\n| `factor(x)`\
  \ | 对 `x`（符号或数值）进行因式分解。 |\n| `r = horner(p)` | 将多项式 `p` 转换为 Horner 形式（即嵌套形式）。 |\n\
  | `[n, d] = numden(A)` | 将符号或数值矩阵 `A` 的每个元素转换为简化后的有理形式。 |\n| `r = simple(s)` `[r,how]\
  \ = simple(s)` | 简化符号表达式 `s`，寻求最短的可能输出。第二种形式仅输出最终结果及描述特定简化过程的字符串。 |\n| `r = simplify(S)`\
  \ | 简化符号矩阵 `S` 的每个元素。 |\n| `[y, sigma] = subexpr(x, sigma)` `[y, sigma] = subexpr(x,\
  \ 'sigma')` | 将符号表达式 `x` 用公共子表达式重写，并用符号变量 `sigma` 替代该子表达式。 |\n\n第一个示例，我们将表达式 `y(sin(x)\
  \ + 1) + sin(x)` 按 `sin(x)` 进行合并。\n\n```\n>> syms x and\n>> pretty (collect (y *\
  \ (sin (x) + 1) + sin (x), sin (x)))\n(y + 1) sin (x) + y\n```\n\n接下来，我们先按 `x` 合并，再按\
  \ `ln(x)` 合并函数 `f(x) = aln(x)-xln(x)-x`。\n\n```\n>> syms a x\n>> f=a*log(x)-log(x)*x-x\n\
  f =\na*log(x)-log(x)*x-x\n>> pretty(collect(f,x))\n(- log (x) - 1) x + log (x)\n\
  >> pretty(collect(f,log(x)))\n(a - x) log (x) - x\n```\n\n下面的示例中，我们展开各种代数表达式。\n\n\
  ```\n>> syms a b x y t\n>> expand([sin(2*t), cos(2*t)])\nans =\n[2 * sin (t) * cos\
  \ (t), 2 * cos (t) ^ 2-1]\n>> expand(exp((a+b)²))\nans =\nexp(a²) * exp(a*b) ^ 2\
  \ * exp(b²)\n>> expand (cos (x + y))\nans =\ncos (x) * cos (y) - sin (x) * sin(y)\n\
  >> expand((x-2)*(x-4))\nans =\nx²-6*x+8\n```\n\n接下来我们对各种表达式进行因式分解。\n\n```\n>> factor(x³-y³)\n\
  ans =\n(x - y) *(x²+x*y+y²)\n>> factor([a²-b², a³+b³])\nans =\n[(a-b)*(a+b), (a+b)*(a²-a*b+b²)]\n\
  >> factor(sym('12345678901234567890'))\nans =\n(2) * (3) ^ 2 * (5) * (101) * (3803)\
  \ * (3607) * (27961) * (3541)\n```\n\n下面我们化简各种表达式。\n\n```\n>> syms x y z a b c\n\
  >> simplify(exp(c*log(sqrt(a+b))))\nans =\n(a + b) ^(1/2*c)\n>> simplify (sin (x)\
  \ ^ 2 + cos (x) ^ 2)\nans =\n1\n>> S = [(x²+5*x+6)/(x+2),sqrt(16)];\nR = simplify(S)\n\
  R =\n[ x+3,   4]\n```\n\n以下函数可用于求解符号方程和方程组：\n\n| `solve('equation', 'x')` | 针对变量\
  \ `x` 求解方程。 |\n| `syms x; solve(equation,x)` | 针对变量 `x` 求解方程。 |\n| `solve('e1,e2,...,en',\
  \ 'x1,x2,...,xn')` | 针对变量 `x1,...,xn` 求解方程组 `e1,...,en`。 |\n| `syms x1 x2... xn;\
  \ solve(e1,e2,...,en, x1,x2,...,xn)` | 针对变量 `x1,...,xn` 求解方程组 `e1,...,en`。 |\n\n\
  第一个示例，我们针对变量 `x` 求解方程 `3ax - 7x² + x³ = 0`，其中 `a` 是参数。\n\n```\n>> solve('3*a*x-7*x²+x³=0','x')\n\
  ans =\n[                       0]\n[7/2 + 1/2 *(49-12*a) ^(1/2)]\n[7/2-1/2 *(49-12*a)\
  \ ^(1/2)]\n```\n\n接下来，我们将上述方程中的 `a` 视为变量，`x` 视为参数进行求解。\n\n```\n>> pretty(solve('3*a*x-7*x²+x³=0','a'))\n\
  -1/3 x (- 7 + x)\n```\n\n在下面的示例中，我们计算 `-1` 和 `1` 的四次方根。\n\n```\n>> S=solve('x⁴+1=0')\n\
  S =\n[  1/2*2^(1/2)+1/2*i*2^(1/2)]\n[ -1/2*2^(1/2)-1/2*i*2^(1/2)]\n[  1/2*2^(1/2)-1/2*i*2^(1/2)]\n\
  [ -1/2*2^(1/2)+1/2*i*2^(1/2)]\n>> numeric(S)\nans =\n0.70710678118655 + 0.70710678118655i\n\
  -0.70710678118655 - 0.70710678118655i\n0.70710678118655 - 0.70710678118655i\n```\n\
  \n\n\n`-0.70710678118655 + 0.70710678118655i`\n\n```\n>> S1=solve('x⁴-1=0')\n```\n\
  \n```\nS1 =\n[  1]\n[ -1]\n[  i]\n[ -i]\n```\n\n接下来我们计算复数`2 + 2i`的五次方根。\n\n```\n\
  >> numeric(solve('x⁵-(2+2*i)=0'))\n```\n\n```\nans =\n1.21598698264961 + 0.19259341768888i\n\
  0.19259341768888 + 1.21598698264961i\n-1.09695770450838 + 0.55892786746601i\n-0.87055056329612\
  \ - 0.87055056329612i\n0.55892786746601 - 1.09695770450838i\n```\n\n在下面的示例中，我们求解变量`x`的方程`sin(x)cos(x)=a`：\n\
  \n```\n>> simple (solve ('sin (x) * cos (x) = a', 'x'))\n```\n\n```\nans =\npi/2\
  \ - asin(2*a)/2\nasin(2*a)/2\n```\n\n```\n>> pretty(ans)\n+-                -+\n\
  |  pi   asin(2 a)  |\n|  -- - ---------  |\n|  2        2      |\n|            \
  \      |\n|     asin(2 a)    |\n|     ---------    |\n|         2        |\n+- \
  \               -+\n```\n\n如果我们针对特殊情况`a=0`求解上述方程，会得到：\n\n```\n>> solve ('sin (x)\
  \ * cos (x) = 0', 'x')\n```\n\n```\nans =\n[       0]\n[1/2 * pi]\n[-1/2 * pi]\n\
  ```\n\n在下面的示例中，我们求解方程组`u + v + w = a`，`3u + v = b`，`u - 2v - w = 0`，其中`u`，`v`和`w`是变量，`a`，`b`和`c`是参数。\n\
  \n```\n>> syms u v w a b c\n>> [u, v, w] = solve('u+v+w=a,3*u+v=b,u-2*v-w=c',u,v,w)\n\
  ```\n\n```\nu =\n1/5 * b + 1/5 * a + 1/5 * c\n\nv =\n2/5 * b - 3/5 * a - 3/5 * c\n\
  \nw =\n-3/5 * b + 7/5 * a + 2/5 * c\n```\n\n**练习 8-1**\n\n考虑下面的符号矩阵`A`：\n\n![A978-1-4842-0310-1_8_Figgg_HTML.jpg](img/A978-1-4842-0310-1_8_Figgg_HTML.jpg)\n\
