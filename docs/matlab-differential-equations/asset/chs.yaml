  \ -----------------)\n2           1/2\n(x  + 3 x - 1)\n\n>> pretty(simple(int(x^(-1)*(9-4*x²)^(1/2),\
  \ x)))\n2 1/2                 3\n(9 - 4 x )    - 3 atanh(-------------)\n2 1/2\n\
  (9 - 4 x )\n\n>> pretty(simple(int(x⁸*(3+5*x³)^(1/4),x)))\n3        6         9\
  \          3 1/4\n4/73125 (288 - 120 x  + 125 x  + 1875 x ) (3 + 5 x )\n```\n\n\
