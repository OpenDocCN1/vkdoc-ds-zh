  \ `gn = cos(nx)`，`n = 1, 2, 3, ...`，在区间 `[−π, π]` 上。\n\nMATLAB 提供了广泛的正交多项式列表，这些多项式对于求解某些高阶非线性微分方程非常有用。允许我们使用这些多项式的函数如下：\n\
