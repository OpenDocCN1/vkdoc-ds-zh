  \ `y = 0`、`y = 2.5981` 和 `y = -2.5981`。\n\n在使一阶导数无穷大的点上，曲线具有垂直切线。这些点为 `x = 1` 和\
  \ `x = -1`。因此，垂直切线与两条垂直渐近线重合。\n\n绘制曲线及其渐近线（见图 8-6）：\n\n```\n>> fplot('[x³/(x²-1),x]',[-5,5,-5,5])\n\
  ```\n\n![A978-1-4842-0310-1_8_Fig6_HTML.jpg](img/A978-1-4842-0310-1_8_Fig6_HTML.jpg)\n\
  \n**图 8-6.**\n\n我们还可以在同一张图中展示曲线、渐近线以及水平和垂直切线（图 8-7）：\n\n```\n>> fplot('[x³/(x²-1),x,2.5981,-2.5981]',[-5,5,-5,5])\n\
  ```\n\n![A978-1-4842-0310-1_8_Fig7_HTML.jpg](img/A978-1-4842-0310-1_8_Fig7_HTML.jpg)\n\
  \n**图 8-7.**\n\n#### 练习 8-12\n\n给定向量函数 `(u(x,y), v(x,y))`，其中：\n\n![A978-1-4842-0310-1_8_Figvv_HTML.jpg](img/A978-1-4842-0310-1_8_Figvv_HTML.jpg)\n\
  \n\n\n确定在何种条件下我们可以找到逆向量函数`(x(u,v), y(u,v))`，其中`x = x(u, v)`且`y = y(u,v)`，并求该逆变换的导数和雅可比矩阵。在点`(π/4,\
  \ -π/4)`处计算该逆函数的值。\n\n为找到函数可逆的条件，我们引用反函数定理。这些函数是可微的且具有连续导数，可能除了`x = 0`处。现在我们考虑变换`∂(u(x,\
  \ y), v(x,y)) / ∂(x, y)`的雅可比矩阵：\n\n```\n>> syms x y\n>> J=simple((jacobian([(x⁴+y⁴)/x,sin(x)+cos(y)],[x,y])))\n\
  J =\n[ 3*x²-1/x²*y⁴,         4*y³/x]\n[          cos(x),         -sin(y)]\n>> pretty(det(J))\n\
  4           4      3\n3 sin(y) x  - sin(y) y  + 4 y  cos(x) x\n- ---------------------------------------\n\
  \                   2\n                  x\n```\n\n因此，在此表达式不为零的点上，我们可以用`u`和`v`解出`x`和`y`。此外，我们还必须有`x\
  \ ≠ 0`。\n\n我们计算逆函数的导数。其值是上面求得的原函数雅可比矩阵的逆矩阵，其雅可比矩阵的行列式是原函数雅可比矩阵行列式的倒数：\n\n```\n>>\
  \ I=simple(inv(J));\n>> pretty(simple(det(I)))\n2\nx\n- ---------------------------------------\n\
  4           4      3\n3 sin(y) x  - sin(y) y  + 4 y  cos(x) x\n```\n\n现在我们求此逆函数在点`(π/4,\
  \ -π/4)`处的值：\n\n```\n>> numeric(subs(subs(determ(I),pi/4,'x'),-pi/4,'y'))\nans =\n\
  0.38210611216717\n>> numeric(subs(subs(symdiv(1,determ(J)),pi/4,'x'),-pi/4,'y'))\n\
  ans =\n0.38210611216717\n```\n\n这些结果证实了逆函数的雅可比矩阵的行列式是原函数雅可比矩阵行列式的倒数。\n\n**练习 8-13**\n\
  \n给定函数`f(x, y) = e^(x-y)`以及变换`u = u(x,y) = x + y`，`v = v(x,y) = x`，求`f(u, v)`。\n\
  \n我们计算逆变换及其雅可比矩阵，以应用变量替换定理：\n\n```\n>> syms x y u v\n>> [x,y]=solve('u=x+y,v=x','x','y')\n\
  x =\nv\ny =\nu-v\n>> jacobian([v,u-v],[u,v])\nans =\n[  0,  1]\n[  1, -1]\n>> f=exp(x-y);\n\
  >> pretty(simple(subs(f,{x,y},{v,u-v})* abs(det(jacobian(\n[v,u-v],[u,v])))))\n\
  exp(2 v - u)\n```\n\n所求函数为`f(u, v) = e^(2v - u)`。\n\n**练习 8-14**\n\n求下列积分：\n\n```\n\
