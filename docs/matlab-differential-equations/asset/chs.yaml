  \ 作为第二个参数来调用子函数。执行主函数时，只需提供一个值列表作为输入，系统便会计算其算术平均值和中位数。子函数会自动执行，如下所示。\n\n```\n>>\
  \ [mean, median] = newstats ([10,20,3,4,5,6])\nmean =\n     8\nmedian =\n    5.5000\n\
  ```\n\n## 使用数值分析求解常微分方程\n\n求解常微分方程的精确解并非易事。有几种不同的方法可以获得常微分方程的近似解。这些数值方法包括（但不限于）欧拉法、休恩法、泰勒级数法、龙格-库塔法（在\
  \ MATLAB 基本模块中实现）、亚当斯-巴什福斯-莫尔顿法、米尔恩法和汉明法。\n\n### 欧拉法\n\n假设我们想要求解区间 `[a, b]` 上的微分方程\
  \ `y' = f(t, y)`，`y(a) = y[0]`。我们使用点 `t[k] = a + kh`，`k = 0,1,..., M`，`h = (b-a)/M`\
  \ 所给出的划分，将区间 `[a, b]` 划分为 `M` 个相同大小的子区间。然后欧拉法通过计算 `y[k+1] = y[k] + hf(t[k], y[k])`，`k\
  \ = 0,1, ..., M-1` 来迭代求解微分方程。\n\n欧拉法是使用图 6-25 所示的 M 文件实现的。\n\n![A978-1-4842-0310-1_6_Fig25_HTML.jpg](img/A978-1-4842-0310-1_6_Fig25_HTML.jpg)\n\
  \n图 6-25.\n\n### 休恩法\n\n假设我们想要求解区间 `[a, b]` 上的微分方程 `y' = f(t, y)`，`y(a) = y[0]`。我们使用点\
  \ `t[k] = a + kh`，`k = 0,1,..., M`，`h = (b-a)/M` 所给出的划分，将区间 `[a, b]` 划分为 `M` 个相同大小的子区间。然后休恩法通过计算\
  \ `y[k+1] = y[k] + h(f(t[k], y[k]) + f(t[k+1], y[k] + f(t[k], y[k])))/2`，`k = 0,1,...,\
  \ M-1` 来迭代求解微分方程。\n\n休恩法是使用图 6-26 所示的 M 文件实现的。\n\n![A978-1-4842-0310-1_6_Fig26_HTML.jpg](img/A978-1-4842-0310-1_6_Fig26_HTML.jpg)\n\
  \n图 6-26.\n\n\n\n## 泰勒级数法\n\n假设我们要在区间 `[a, b]` 上求解微分方程 `y' = f(t, y)`，`y(a) = y[0]`。我们使用点\
  \ `t[k] = a + kh`，`k = 0, 1, ..., M`，`h = (b - a) / M` 划分的区间 `[a, b]`，将其分成 `M` 个等长子区间。泰勒级数法（这里我们考虑四阶方法）通过计算\
  \ `y'`、`y\"`、`y\"'` 和 `y\"\"` 在每个划分点处给出 `y` 的四阶泰勒级数，从而找到微分方程的解。\n\n泰勒级数法是使用图 6-27\
  \ 所示的 M 文件实现的。\n\n![A978-1-4842-0310-1_6_Fig27_HTML.jpg](img/A978-1-4842-0310-1_6_Fig27_HTML.jpg)\n\
  \n图 6-27。\n\n例如，我们使用欧拉法、亨氏法和泰勒级数法在区间 `[0, 3]` 上求解微分方程 `y'(t) = (t - y)/2`，其中 `y(0)\
  \ = 1`。\n\n我们首先通过图 6-28 所示的 M 文件定义函数 `f(t, y)`。\n\n![A978-1-4842-0310-1_6_Fig28_HTML.jpg](img/A978-1-4842-0310-1_6_Fig28_HTML.jpg)\n\
  \n图 6-28。\n\n使用欧拉法以 100 步计算该方程的解如下：\n\n```\n>> E = euler('dif1',0,3,1,100)\nE =\n\
  0 1.00000000000000\n0.03000000000000 0.98500000000000\n0.06000000000000 0.97067500000000\n\
  0.09000000000000 0.95701487500000\n0.12000000000000 0.94400965187500\n0.15000000000000\
  \ 0.93164950709688\n0.18000000000000 0.91992476449042\n.\n.\n.\n2.85000000000000\
  \ 1.56377799005910\n2.88000000000000 1.58307132020821\n2.91000000000000 1.60252525040509\n\
  2.94000000000000 1.62213737164901\n2.97000000000000 1.64190531107428\n3.00000000000000\
  \ 1.66182673140816\n```\n\n此解可绘制成图（见图 6-29）如下：\n\n```\n>> plot (E (:,2))\n```\n\n\
  ![A978-1-4842-0310-1_6_Fig29_HTML.jpg](img/A978-1-4842-0310-1_6_Fig29_HTML.jpg)\n\
  \n图 6-29。\n\n使用亨氏法以 100 步计算该方程的解如下：\n\n```\n>> H = heun('dif1',0,3,1,100)\nH =\n\
