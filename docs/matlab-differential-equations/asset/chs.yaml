  \ x) = y(x) * cos(x) /(1 + y(x) ^ 2), y(x))'))`\n```\n                         \
  \                2\n                      log(y(x)) + 1/2 y(x) - sin(x) = _C1\n\
  ```\n\n### 齐次微分方程\n\n考虑一个一般形式的一阶一次微分方程：\n\n![A978-1-4842-0310-1_2_Figg_HTML.jpg](img/A978-1-4842-0310-1_2_Figg_HTML.jpg)\n\
  \n如果函数`M`和`N`满足以下条件，则称该方程为`n`次齐次方程：\n\n![A978-1-4842-0310-1_2_Figh_HTML.jpg](img/A978-1-4842-0310-1_2_Figh_HTML.jpg)\n\
  \n对于这种类型的方程，我们可以通过变量替换`x = vy`，将原始微分方程（变量为`x`和`y`）转化为另一个（可分离的）方程（变量为`v`和`y`）。新的方程通过分离变量法求解，然后通过反转变量替换求得原始方程的解。\n\
  \n**练习 2-2**\n\n求解微分方程：\n\n![A978-1-4842-0310-1_2_Figi_HTML.jpg](img/A978-1-4842-0310-1_2_Figi_HTML.jpg)\n\
  \n首先检查方程是否为齐次方程：\n\n`» maple('m:=(x,y) - > x ^ 2 - y ^ 2');`\n\n`» maple('n:=(x,y)\
  \ - > x * y ');`\n\n`» factor('m(t*x,t*y)')`\n```\nans =\nt ^ 2 *(x-y) *(x + y)\n\
  ```\n\n`» factor('n(t*x,t*y)')`\n```\nans =\nt ^ 2 * x * y\n```\n\n因此该方程是 2 次齐次方程。为了求解，我们应用变量替换`x\
  \ = vy`。\n\n在执行变量替换之前，建议使用命令`maple('with(difforms)')`加载`difforms`库，这将允许你处理微分形式。加载此库后，还建议使用命令`maple('defform(v=0,x=0,y=0)')`，该命令允许声明在微分过程中不是常数或参数的所有变量。\n\
  \n`» maple('with(difforms)');`\n\n`» maple('defform(v=0,x=0,y=0)');`\n\n现在我们可以进行变量替换`x\
  \ = vy`，并将项分组为`d(v)`和`d(y)`。\n\n`» simplify('subs(x = v * y m(x,y) * d(x) + n(x,y)\
  \ * d(y))')`\n```\nans =\nv ^ 2 * y ^ 3 * d(v) + v ^ 3 * y ^ 2 * d(y) - y ^ 3 *\
  \ d(v)\n```\n\n`» pretty(maple('collect(v ^ 2 * y ^ 3 * d(v) + v ^ 3 * y ^ 2 * d(y)\
  \ - y ^ 3 * d(v) {d(v), d(y)})'))`\n```\n2  2    2                       2\n(v \
  \ y  - y )(y d(v) + v d(y)) + y  v d(y)\n```\n\n如果我们将前一个表达式除以`v³y³`，并将项分组为`d(v)`和`d(y)`，我们就得到了一个分离变量的方程。\n\
  \n`» pretty(maple('collect(((v²*y³-y³) * d(v) + v ^ 3 * y ^ 2 * d(y)) /(v³*y³),\
  \ {d(v), d(y)})'))`\n```\n2  3    3\n(v  y  - y ) d(v)    d(y)\n-----------------\
  \ + ----\n3  3           y\nv  y\n```\n\n前面的表达式可以简化。\n\n`» pretty(maple('convert(collect(((v²*y³-y³)\
  \ * d(v) + v ^ 3 * y ^ 2 * d(y)) /(v³*y³), {d(v), d(y)}), parfrac, y)'))`\n```\n\
  2\n(v  - 1) d(v)    d(y)\n------------- + ----\n3          y\nv\n```\n\n现在，我们求解方程：\n\
  \n`» pretty(simple('int((v²-1)/v ^ 3, v) + int(1/y,y)'))`\n```\n1\nlog(v) + ----\
  \ + log(y)\n2\n2 v\n```\n\n最后反转变量替换：\n\n`» pretty(simple('subs(v = x / y log(v)\
  \ + 1/2/v ^ 2 + log(y))'))`\n```\n2\ny\nlog(x) + 1/2 ----\n2\nx\n```\n\n因此，原始微分方程的通解为：\n\
  \n![A978-1-4842-0310-1_2_Figj_HTML.jpg](img/A978-1-4842-0310-1_2_Figj_HTML.jpg)\n\
  \n现在我们可以用图形表示该微分方程的解。为此，我们绘制带有参数`C`的解的图形，这等价于由上述通解左侧定义的函数的等高线图（参见图 18-1）：\n\n`»\
  \ [x,y]=meshgrid(0.1:0.05:1/2,-1:0.05:1);`\n\n`» z=y.²./(2*x.²)+log(x);`\n\n`» contour(z,65)`\n\
  \n![A978-1-4842-0310-1_2_Fig1_HTML.jpg](img/A978-1-4842-0310-1_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n\n\n## 恰当微分方程\n\n若满足![A978-1-4842-0310-1_2_Figl_HTML.jpg](img/A978-1-4842-0310-1_2_Figl_HTML.jpg)，则称微分方程\n\
  \n![A978-1-4842-0310-1_2_Figk_HTML.jpg](img/A978-1-4842-0310-1_2_Figk_HTML.jpg)\n\
  \n为恰当微分方程。若方程为恰当的，则存在函数 `F`，其全微分 `dF` 与上述方程的左端相等，即：\n\n![A978-1-4842-0310-1_2_Figm_HTML.jpg](img/A978-1-4842-0310-1_2_Figm_HTML.jpg)\n\
  \n因此解族由 `F(x,y) = C` 给出。\n\n下面的练习遵循此类方程代数解法的常规步骤。\n\n**练习 2-3**\n\n求解微分方程：\n\n![A978-1-4842-0310-1_2_Fign_HTML.jpg](img/A978-1-4842-0310-1_2_Fign_HTML.jpg)\n\
  \n首先，尝试用 `dsolve` 求解方程：\n\n```\n» maple('m:=(x,y) - > - 1 + y * exp(x*y) + y * cos(x*y)')\n\
  ```\n\n```\n» maple('n:=(x,y) - > 1 + x * exp(x*y) + x * cos(x*y)')\n```\n\n```\n\
  » dsolve('m(x,y) + n(x,y) * Dy = 0')\n??? Error using ==> dsolve\nExplicit solution\
  \ could not be found.\n```\n\n因此函数 `dsolve` 无法给出所提出方程的解。我们将尝试使用经典代数方法来求解该方程。\n\n\
  首先，检验所提出的微分方程是否为恰当的。\n\n```\n» pretty(simple(diff('m(x,y)','y')))\nexp(y x) + x\
  \ y exp(y x) + cos(y x) - x sin(y x) y\n```\n\n```\n» pretty(simple(diff('n(x,y)','x')))\n\
  exp(y x) + x y exp(y x) + cos(y x) - x sin(y x) y\n```\n\n由于方程是恰当的，我们可以通过以下方式找到解：\n\
  \n```\n» solution1 = simplify('int(m(x,y), x) + g(y)')\nsolution1 =\n-x+exp(y*x)\
  \ + sin(y*x) + g(y)\n```\n\n接下来，我们通过以下条件求函数 `g(y)`：\n\n![A978-1-4842-0310-1_2_Figo_HTML.jpg](img/A978-1-4842-0310-1_2_Figo_HTML.jpg)\n\
  \n```\n» pretty(simplify('int(m(x,y), x) + g(y)'))\n                   -x + exp(y\
  \ x) + sin(y x) + g(y)\n```\n\n```\n» pretty(simplify('diff(-x+exp(y*x) + sin(y*x)\
  \ + g(y), y)'))\n                                               d\n            \
  \      x exp(y x) x + x cos(y x) + -- g(y)\n                                   \
  \           dy\n```\n\n```\n» simplify('solve(x * exp(y*x) + x * cos(y*x) + diff(g(y),\
  \ y) = n(x,y), diff(g(y), y))')\nans =\n1\n```\n\n因此 `g'(y) = 1`，所以最终解为（省略常数项）：\n\
  \n```\n» pretty(simplify('subs(g(y) = int(1,y),-x+exp(y*x) + sin(y*x) + g(y))'))\n\
  -x + exp(y x) + sin(y x) + y\n```\n\n为了以图形形式表示解族，我们绘制上述表达式的等高线图（图 18-2）：\n\n```\n\
  » [x,y]=meshgrid(-2*pi/3:.2:2*pi/3);\n» z =-x+exp(y.*x) + sin(y.*x) + y;\n» contour(z,100)\n\
  ```\n\n![A978-1-4842-0310-1_2_Fig2_HTML.jpg](img/A978-1-4842-0310-1_2_Fig2_HTML.jpg)\n\
  \n**图 2-2。**\n\n下一节我们将看到，任何可约的微分方程如何通过积分因子转化为恰当方程。\n\n## 线性微分方程\n\n一阶线性微分方程是如下形式的方程：\n\
  \n![A978-1-4842-0310-1_2_Figp_HTML.jpg](img/A978-1-4842-0310-1_2_Figp_HTML.jpg)\n\
  \n其中 `P(x)` 和 `Q(x)` 是给定的关于 `x` 的函数。\n\n此类微分方程可通过在方程两边乘以积分因子转化为恰当方程：\n\n![A978-1-4842-0310-1_2_Figq_HTML.jpg](img/A978-1-4842-0310-1_2_Figq_HTML.jpg)\n\
  \n其通解由以下表达式给出：\n\n![A978-1-4842-0310-1_2_Figr_HTML.jpg](img/A978-1-4842-0310-1_2_Figr_HTML.jpg)\n\
  \nMATLAB 实现了这些线性微分方程的解，并且只要积分因子中的积分可求，就会给出结果。\n\n**练习 2-4**\n\n求解微分方程：\n\n![A978-1-4842-0310-1_2_Figs_HTML.jpg](img/A978-1-4842-0310-1_2_Figs_HTML.jpg)\n\
  \n```\n» pretty(simple(dsolve('x * Dy + 3 * y = x * sin(x)')))\n               \
  \     /   3 t \\\n             C36 exp| - --- |\n  x sin(x)          \\    x  /\n\
  \  -------- - ----------------\n     3              3\n```\n\n"
- "# 高阶微分方程。拉普拉斯变换与特殊类型的方程\n\n## 常高阶方程\n\n`n` 阶常线性微分方程具有以下一般形式：\n\n![A978-1-4842-0310-1_3_Figa_HTML.jpg](img/A978-1-4842-0310-1_3_Figa_HTML.jpg)\n\
  \n如果函数 `f(x)` 恒为零，则方程称为齐次方程。否则称为非齐次方程。如果函数 `ai`（i = 1, …, n）是常数，则称该方程为常系数方程。\n\n\
  在此背景下，一个非常重要的概念是线性无关函数集。若函数集 `{f1, f2, …, fn}` 在它们的共同定义域内任意 `x` 处的朗斯基行列式不为零，则称该函数集是线性无关的。给定函数集在共同定义域内某点\
  \ `x` 处的朗斯基行列式定义如下：\n\n![A978-1-4842-0310-1_3_Figb_HTML.jpg](img/A978-1-4842-0310-1_3_Figb_HTML.jpg)\n\
  \nMATLAB 命令 `maple('Wronskian')` 可用于计算函数集的朗斯基矩阵。其语法为：\n\n*   `maple('Wronskian(V,x)')`：计算以\
  \ `x` 为自变量的函数向量 `V` 对应的朗斯基矩阵。\n\n`n` 阶齐次线性方程\n\n![A978-1-4842-0310-1_3_Figc_HTML.jpg](img/A978-1-4842-0310-1_3_Figc_HTML.jpg)\n\
  \n的一组线性无关的平凡解构成的集合 `S = {f1, …, fn}`，称为该方程的一个基本解组。\n\n若函数 `ai`（i = 1, …, n）在开区间\
  \ `I` 内连续，则齐次方程在 `I` 上存在一个基本解组 `S = {fi}`。\n\n此外，齐次方程的通解将由以下函数给出：\n\n![A978-1-4842-0310-1_3_Figd_HTML.jpg](img/A978-1-4842-0310-1_3_Figd_HTML.jpg)\n\
  \n其中 `{c[i]}` 是一组任意常数。\n\n方程：\n\n![A978-1-4842-0310-1_3_Fige_HTML.jpg](img/A978-1-4842-0310-1_3_Fige_HTML.jpg)\n\
  \n称为常系数齐次微分方程的特征方程。该特征方程的解决定了相应微分方程的通解。\n\n**练习 3-1**\n\n证明以下函数集\n\n![A978-1-4842-0310-1_3_Figf_HTML.jpg](img/A978-1-4842-0310-1_3_Figf_HTML.jpg)\n\
  \n是线性无关的。\n\n```\n» indfunctions = maple('vector([exp(x), x * exp(x), x ^ 2 * exp(x)])')\n\
  indfunctions =\n[exp(x), x * exp(x), x ^ 2 * exp(x)]\n```\n\n```\n» W=maple('Wronskian(indfunctions,x)')\n\
  W =\n[exp(x),          x*exp(x),                     x²*exp(x)]\n[exp(x),   exp(x)+x*exp(x),\
  \          2*x*exp(x)+x²*exp(x)]\n[exp(x), 2*exp(x)+x*exp(x), 2*exp(x)+4*x*exp(x)+x²*exp(x)]\n\
  ```\n\n```\n» pretty(determ(W))\n       3\n2 exp(x)\n```\n\n得到朗斯基行列式的值，显然它始终不为零。因此，该函数集是线性无关的。\n\
  \n\n\n## 线性高阶方程。常系数齐次方程\n\nn 阶齐次线性微分方程\n\n![A978-1-4842-0310-1_3_Figg_HTML.jpg](img/A978-1-4842-0310-1_3_Figg_HTML.jpg)\n\
  \n如果函数 `ai` (i = 1, …, n) 均为常数（即它们不依赖于变量 x），则称其具有常系数。\n\n方程：\n\n![A978-1-4842-0310-1_3_Figh_HTML.jpg](img/A978-1-4842-0310-1_3_Figh_HTML.jpg)\n\
  \n被称为上述微分方程的**特征方程**。该特征方程的解（`m[1]`, `m[2]`, …, `m[n]`）决定了相应微分方程的通解。\n\n如果 `m[i]`\
  \ (i = 1, …, n) 互不相同，则常系数齐次方程的通解为：\n\n![A978-1-4842-0310-1_3_Figi_HTML.jpg](img/A978-1-4842-0310-1_3_Figi_HTML.jpg)\n\
  \n其中 `c[1]`, `c[2]`, …, `c[n]` 是任意常数。\n\n如果某个 `m[i]` 是特征方程的 k 重根，则它决定了解中的以下 k 项：\n\
  \n![A978-1-4842-0310-1_3_Figj_HTML.jpg](img/A978-1-4842-0310-1_3_Figj_HTML.jpg)\n\
  \n如果特征方程有一个复根 `m[j] = a+bi`，那么它的复共轭 `m[j+1] = a-bi` 也是一个根。这两个根决定了齐次方程通解中的一对项：\n\n\
  ![A978-1-4842-0310-1_3_Figk_HTML.jpg](img/A978-1-4842-0310-1_3_Figk_HTML.jpg)\n\n\
  MATLAB 直接应用此方法，使用命令 `dsolve` 或 `maple('dsolve')` 来获得常系数齐次线性方程的解。\n\n**练习 3-2**\n\
  \n求解以下方程：\n\n![A978-1-4842-0310-1_3_Figl_HTML.jpg](img/A978-1-4842-0310-1_3_Figl_HTML.jpg)\n\
  \n![A978-1-4842-0310-1_3_Figm_HTML.jpg](img/A978-1-4842-0310-1_3_Figm_HTML.jpg)\n\
  \n```\n» pretty(dsolve('3*D2y+2*Dy-5*y=0'))\n                      /   5 t \\\n\
  \  C38 exp(t) + C39 exp| - --- |\n                      \\    3  /\n```\n\n```\n\
  » pretty(dsolve('2 * D2y + 5 * Dy + 5 * y = 0', ' y(0) = 0 Dy(0) = 1/2 '))\n   \
  \                       /   1/2   \\\n     1/2    /   5 t \\    | 15    t |\n 2\
  \ 15    exp| - --- | sin| ------- |\n             \\    4  /    \\    4    /\n \
  \ -----------------------------------\n                  15\n```\n\n**练习 3-3**\n\
  \n求解微分方程\n\n![A978-1-4842-0310-1_3_Fign_HTML.jpg](img/A978-1-4842-0310-1_3_Fign_HTML.jpg)\n\
  \n```\n» pretty(simple(dsolve('9*D4y-6*D3y+46*D2y-6*Dy+37*y=0')))\n            \
  \                              / t \\                   / t \\\nC46 cos(t) + C47\
  \ sin(t) + C44 cos(2 t) exp| - | + C45 sin(2 t) exp| - |\n                     \
  \                     \\ 3 /                   \\ 3 /\n```\n\n观察解，可以明显看出特征方程有两对复共轭解。\n\
  \n```\n» solve('9*x⁴-6*x³+46*x²-6*x+37=0')\nans =\n         i\n        -i\n1/3 +\
  \ 2*i\n1/3 - 2*i\n```\n\n## 常系数非齐次方程。参数变易法\n\n考虑常系数非齐次线性方程：\n\n![A978-1-4842-0310-1_3_Figo_HTML.jpg](img/A978-1-4842-0310-1_3_Figo_HTML.jpg)\n\
  \n假设 {`y1`, `y2`, ..., `yn`} 是相应齐次方程的一个线性无关解集：\n\n![A978-1-4842-0310-1_3_Figp_HTML.jpg](img/A978-1-4842-0310-1_3_Figp_HTML.jpg)\n\
  \n非齐次方程的一个特解由下式给出：\n\n![A978-1-4842-0310-1_3_Figq_HTML.jpg](img/A978-1-4842-0310-1_3_Figq_HTML.jpg)\n\
  \n其中函数 `ui` 通过如下方式获得：\n\n![A978-1-4842-0310-1_3_Figr_HTML.jpg](img/A978-1-4842-0310-1_3_Figr_HTML.jpg)\n\
  \n这里 `W[i]y[1, y2, …, yn]` 是将朗斯基矩阵 `Wy[1, y2, …, yn]` 的第 i 列替换为向量 (0, 0,…, 0, 1)\
  \ 的转置后得到的矩阵的行列式。\n\n然后，非齐次方程的解由齐次方程的通解和非齐次方程的特解组合而成。如果齐次方程特征方程的根 `m[i]` 全部不同，则非齐次方程的通解为：\n\
  \n![A978-1-4842-0310-1_3_Figs_HTML.jpg](img/A978-1-4842-0310-1_3_Figs_HTML.jpg)\n\
  \n如果某些根是重根，我们参考之前讨论过的齐次方程解的一般形式。\n\n**练习 3-4**\n\n求解下列微分方程：\n\n![A978-1-4842-0310-1_3_Figt_HTML.jpg](img/A978-1-4842-0310-1_3_Figt_HTML.jpg)\n\
  \n![A978-1-4842-0310-1_3_Figu_HTML.jpg](img/A978-1-4842-0310-1_3_Figu_HTML.jpg)\n\
  \n我们将遵循参数变易法的代数方法来求解第一个方程。我们首先考虑齐次方程的特征方程，以获得一组线性无关的解。\n\n```\n» solve('m²+4*m+13=0')\n\
  ans =\n[- 2 + 3 * i]\n[- 2 - 3 * i]\n```\n\n```\n» maple('f: = x - > x * cos(3*x)\
  \ ^ 2');\n» maple('y1: = x - > exp(-2*x) * cos(3*x)');\n» maple('y2: = x - > exp(-2*x)\
  \ * sin(3*x)');\n» maple('W: = x - > Wronskian([y1(x), y2(x)], x)');\n» pretty(simplify(maple('det(W(x))')))\n\
  3 exp(-4 x)\n```\n\n我们看到朗斯基行列式非零，表明这些函数是线性无关的。现在计算函数 `Wi`，i = 1, 2。\n\n```\n» maple('W1:\
  \ x-= > array([[0, y2(x)], [1, diff((y2)(x), x)]])');\n» pretty(simplify(maple('det(W1(x))')))\n\
  -exp(-2 x) sin(3 x)\n```\n\n```\n» maple('W2: x-= > array([[y1(x), 0], [diff((y1)(x),\
  \ x), 1]])');\n» pretty(simplify(maple('det(W2(x))')))\nexp(-2 x) cos(3 x)\n```\n\
  \n现在计算非齐次方程的特解。\n\n```\n» maple('u1:=x->factor(simplify(int(f(x)*det(W1(x))/det(W(x)),x)))');\n\
  » maple('u1(x)')\nans =\n1/14652300*exp(2*x)*(129285*cos(9*x)*x-6084*cos(9*x)-28730*sin(9*x)*x-13013*sin(9*x)+281775*cos(3*x)*x-86700*cos(3*x)-187850*sin(3*x)*x-36125*sin(3*x))\n\
  ```\n\n```\n» maple('u2:=x->factor(simplify(int(f(x)*det(W2(x))/det(W(x)),x)))');\n\
  » maple('u2(x)')\nans =\n1/14652300 * exp(2*x) *(563550 * cos(3*x) * x+108375 *\
  \ cos(3*x) + 845325 * sin(3*x) * x-260100 * sin(3*x) + 28730 * cos(9*x) * x+13013\
