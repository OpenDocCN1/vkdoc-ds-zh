- "# 一阶微分方程。恰当方程、分离变量法、齐次方程和线性方程\n\n## 一阶微分方程\n\n尽管 MATLAB 仅实现了与此主题相关数量相对较少的命令，但它处理微分方程的效率仍然非常高。我们将看到如何使用这些命令来代数求解每种类型的微分方程。此外，还实现了用于方程和方程组近似解的数值方法。\n\
  \n用于求解微分方程的基本命令是 `dsolve`。该命令用于寻找常微分方程和常微分方程组的符号解。方程通过符号表达式指定，其中字母 `D` 用于表示微分，而\
  \ `D2`、`D3` 等则用于表示二阶、三阶等微分。前面带有 `D`（或 `D2` 等）的字母是因变量（通常是 `y`），任何前面不带 `D`（或 `D2`\
  \ 等）的字母被视为自变量的候选。如果未指定自变量，则默认取 `x` 作为自变量。如果 `x` 被指定为因变量，则自变量为 `t`。也就是说，`x` 默认是自变量，除非它被声明为因变量，在这种情况下，自变量被理解为\
  \ `t`。\n\n你可以使用附加方程来指定初始条件，其形式为 `y(a) = b` 或 `Dy(a) = b` 等。如果未指定初始条件，微分方程的解将包含积分常数\
  \ `C1`、`C2` 等。求解微分方程最重要的 MATLAB 命令如下：\n\n`dsolve('equation', 'v')`：解给定的微分方程，其中 `v`\
  \ 是自变量（如果未指定 `'v'`，则默认自变量为 `x`）。此命令仅返回显式解。\n\n`dsolve('equation', 'initial_condition',\
  \ …, 'v')`：在给定的初始条件下解给定的微分方程。\n\n`dsolve('equation', 'cond1', 'cond2', …, 'condn',\
  \ 'v')`：在给定的初始条件下解给定的微分方程。\n\n`dsolve('equation', 'cond1, cond2, …, condn', 'v')`：在给定的初始条件下解给定的微分方程。\n\
  \n`dsolve('eq1', 'eq2', …, 'eqn', 'cond1', 'cond2', …, 'condn', 'v')`：在给定的初始条件下解给定的微分方程组。\n\
  \n`dsolve('eq1, eq2, …, eqn', 'cond1, cond2, …, condn', 'v')`：在给定的初始条件下解给定的微分方程组。\n\
  \n`maple('dsolve(equation, func(var))')`：解给定的微分方程，其中 `var` 是自变量，`func` 是因变量（返回隐式解）。\n\
  \n`maple('dsolve({equation, cond1, cond2, … condn}, func(var))')`：在给定的初始条件下解给定的微分方程。\n\
  \n`maple('dsolve({eq1, eq2, …, eqn}, {func1(var), func2(var), … funcn(var)})')`：解给定的微分方程组（返回隐式解）。\n\
  \n`maple('dsolve(equation, func(var), ''explicit'')')`：解给定的微分方程，如果可能，以显式形式提供解。\n\
  \n示例如下。\n\n首先，我们求解一阶一次的微分方程，包括有初值和无初值的情况。\n\n```\n» pretty(dsolve('Dy = a*y'))\n\
  C2 exp(a t)\n\n» pretty(dsolve('Df = f + sin(t)'))\nsin(t)   cos(t)\nC6 exp(t) -\
  \ ------ - ------\n2        2\n```\n\n前两个方程也可以按以下方式求解：\n\n```\n» pretty(sym(maple('dsolve(diff(y(x),\
  \ x) = a * y, y(x))')))\ny(x) = exp(a x) _C1\n\n» pretty(maple('dsolve(diff(f(t),t)=f+sin(t),f(t))'))\n\
  f(t) = - 1/2 cos(t) - 1/2 sin(t) + exp(t) _C1\n\n» pretty(dsolve('Dy = a*y', 'y(0)\
  \ = b'))\nexp(a x) b\n\n» pretty(dsolve('Df = f + sin(t)', 'f(pi/2) = 0'))\n/  \
  \ pi \\\nexp| - -- | exp(t)\n\\   2  /          sin(t)   cos(t)\n------------------\
  \ - ------ - ------\n2              2        2\n```\n\n\n\n## 常微分方程求解\n\n现在我们解一个一阶二次方程。\n\
  \n`» y = dsolve('(Dy) ^ 2 + y ^ 2 = 1', ' y(0) = 0', 's')`\n```\ny =\ncosh((pi*i)/2\
  \ + s*i)\ncosh((pi*i)/2 - s*i)\n```\n\n我们也可以用以下方式求解：\n\n`» pretty(maple('dsolve({diff(y(s),s)²\
  \ + y(s)² = 1, y(0) = 0}, y(s))'))`\n```\ny(s) = sin(s), y(s) = - sin(s)\n```\n\n\
  现在我们来解一个二阶一阶方程。\n\n`» pretty(dsolve('D2y = - a ^ 2 * y ', 'y(0) = 1, Dy(pi/a) =\
  \ 0'))`\n```\nexp(-a t i)   exp(a t i)\n----------- + ----------\n2            2\n\
  ```\n\n接下来我们求解几个方程组，分别带有和不带初始值。\n\n`>> dsolve('Dx = y', 'Dy = -x')`\n```\nans =\n\
  y: [1x1 sym]\nx: [1x1 sym]\n```\n\n`>> y`\n```\ny =\ncosh((pi*i)/2 + s*i)\ncosh((pi*i)/2\
  \ - s*i)\n```\n\n`>> x`\n```\nx =\nx\n```\n\n`>> y=dsolve('Df = 3*f+4*g', 'Dg =\
  \ -4*f+3*g')`\n```\ny =\ng: [1x1 sym]\nf: [1x1 sym]\n```\n\n`>> y.g`\n```\nans =\n\
  C27*cos(4*t)*exp(3*t) - C28*sin(4*t)*exp(3*t)\n```\n\n`>> y.f`\n```\nans =\nC28*cos(4*t)*exp(3*t)\
  \ + C27*sin(4*t)*exp(3*t)\n```\n\n`>> y=dsolve('Df = 3*f+4*g, Dg = -4*f+3*g', 'f(0)=0,\
  \ g(0)=1')`\n```\ny =\ng: [1x1 sym]\nf: [1x1 sym]\n```\n\n`>> y.g`\n```\nans =\n\
  cos(4*t)*exp(3*t)\n```\n\n`>> y.f`\n```\nans =\nsin(4*t)*exp(3*t)\n```\n\n最后一个方程组也可以用以下方式求解：\n\
  \n`» pretty(maple('dsolve({diff(f(x),x)= 3*f(x)+4*g(x), diff(g(x),x)=-4*f(x)+3*g(x),\
  \     f(0)=0,g(0)=1}, {f(x),g(x)})'))`\n```\n{f(x) = exp(3 x) sin(4 x), g(x) = exp(3\
  \ x) cos(4 x)}\n```\n\n### 分离变量法\n\n如果一个微分方程可以写成以下形式，则称其具有可分离变量：\n\n![A978-1-4842-0310-1_2_Figa_HTML.jpg](img/A978-1-4842-0310-1_2_Figa_HTML.jpg)\n\
  \n这种类型的方程可以通过代入以下形式立即求解：\n\n![A978-1-4842-0310-1_2_Figb_HTML.jpg](img/A978-1-4842-0310-1_2_Figb_HTML.jpg)\n\
  \n如果 MATLAB 不能直接用`dsolve`函数求解微分方程，我们可以尝试将其表示为上述形式，并根据给定积分进行代数求解，鉴于该程序在符号计算方面的多功能性，这不会带来特别的困难。\n\
  \n**练习 2-1**\n\n求解微分方程：\n\n![A978-1-4842-0310-1_2_Figc_HTML.jpg](img/A978-1-4842-0310-1_2_Figc_HTML.jpg)\n\
  \n首先尝试直接求解。该方程可以写成以下形式：\n\n![A978-1-4842-0310-1_2_Figd_HTML.jpg](img/A978-1-4842-0310-1_2_Figd_HTML.jpg)\n\
  \n`» dsolve('Dy = y * cos(x) /(1+y²)')`\n```\nans =\n                0\nexp(C33\
  \ + t*cos(x))*exp(-wrightOmega(2*C33 + 2*t*cos(x))/2)\n```\n\n因此，该微分方程似乎不能用`dsolve`求解。但在本例中，变量是可分离的，因此我们可以按如下方式求解该方程：\n\
  \n`» pretty(solve('int(cos(x), x) = int((1+y²) / y, y)'))`\n```\n  +-          \
  \                -+\n  |         /           2 \\    |\n  |         |          y\
  \  |    |\n  |     asin| log(y) + -- |    |\n  |         \\          2  /    |\n\
  \  |                            |\n  |           /           2 \\  |\n  |      \
  \     |          y  |  |\n  |  pi - asin| log(y) + -- |  |\n  |           \\   \
  \       2  /  |\n  +-                          -+\n```\n\n经过简单的重排，我们看到通解由下式给出：\n\
  \n![A978-1-4842-0310-1_2_Fige_HTML.jpg](img/A978-1-4842-0310-1_2_Fige_HTML.jpg)\n\
  \n现在我们通过初始条件，令`x = 0`且`y = 1`，求常数`C`的值。\n\n`» C = simple('solve(subs(x = 0, y =\
  \ 1, sin(x) = log(y) + 1/2 * y ^ 2 + C), C)')`\n```\nC =\n-1/2\n```\n\n因此最终解为：\n\
