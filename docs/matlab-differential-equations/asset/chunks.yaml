- fmt: '# Derivatives, Integrals and Differential Equations


    We describe below the MATLAB functions which are used in mathematical analysis
    when dealing with derivatives, integrals and differential equations. We will begin
    with the differentiation-related functions.


    | `diff(''f'', ''x'')` | Returns the derivative of `f` with respect to `x`. |

    | `syms x, diff(f, x)` | Returns the derivative of `f` with respect to `x`. |

    | `diff(''f'', ''x'', n)` | Returns the nth derivative of `f` with respect to
    `x`. |

    | `syms x, diff(f, x, n)` | Returns the nth derivative of `f` with respect to
    `x`. |

    | `r = taylor(f, n, v)` | Returns the MacLaurin series of order n-1 for the function
    `f` in the variable `v`. |

    | `r = taylor(f)` | Returns the MacLaurin series of order 5 for the function `f`
    in the default variable. |

    | `r = taylor(f, n, v, a)` | Returns the Taylor series of order n-1 for the function
    `f` in the variable `v` in a neighborhood of the point `a`. |

    | `R = jacobian(w, v)` | Returns the Jacobian matrix of `w` with respect to `v`.
    |


    Below are the integration-related functions:


    | `syms x, int(f(x), x)` or `int(''f(x)'', ''x'')` | Computes the indefinite integral
    ![A978-1-4842-0310-1_8_Figp_HTML.jpg](A978-1-4842-0310-1_8_Figp_HTML.jpg) |

    | `int(int(''f(x, y)'', ''x''), ''y'')` | Calculates the double integral ![A978-1-4842-0310-1_8_Figq_HTML.jpg](A978-1-4842-0310-1_8_Figq_HTML.jpg)
    |

    | `syms x y int(int(f(x, y), x), y)` | Calculates the double integral ![A978-1-4842-0310-1_8_Figr_HTML.jpg](A978-1-4842-0310-1_8_Figr_HTML.jpg)
    |

    | `int(int(int(...int(''f(x, y..., z)'', ''x''), ''y'')...), ''z'')` | Calculates
    ![A978-1-4842-0310-1_8_Figs_HTML.jpg](A978-1-4842-0310-1_8_Figs_HTML.jpg) |

    | `syms x y z int(int(int(...int(f(x, y...z), x), y)...), z)` | Calculates ![A978-1-4842-0310-1_8_Figt_HTML.jpg](A978-1-4842-0310-1_8_Figt_HTML.jpg)
    |

    | `syms x a b, int(f(x), x, a, b)` | Calculates the definite integral ![A978-1-4842-0310-1_8_Figu_HTML.jpg](A978-1-4842-0310-1_8_Figu_HTML.jpg)
    |

    | `int(''f(x)'', ''x'', ''a'', ''b'')` | Calculates the definite integral ![A978-1-4842-0310-1_8_Figv_HTML.jpg](A978-1-4842-0310-1_8_Figv_HTML.jpg)
    |

    | `int(int(''f(x,y)'', ''x'', ''a'', ''b''), ''y'', ''c'', ''d'')` | Calculates
    the integral ![A978-1-4842-0310-1_8_Figw_HTML.jpg](A978-1-4842-0310-1_8_Figw_HTML.jpg)
    |

    | `syms x y a b c d, (int(int(f(x,y), x, a, b), y, c, d))` | Calculates the integral
    ![A978-1-4842-0310-1_8_Figx_HTML.jpg](A978-1-4842-0310-1_8_Figx_HTML.jpg) |

    | `int(int(int(...int(''f(x, y,...,z)'', ''x'', ''a'', ''b''), ''y'', ''c'', ''d''),...),
    ''z'', ''e'', ''f'')` | Calculates the integral ![A978-1-4842-0310-1_8_Figy_HTML.jpg](A978-1-4842-0310-1_8_Figy_HTML.jpg)
    |

    | `syms x y z a b c d e f, int(int(int(...int(f(x, y,...,z), x, a, b), y, c, d)...),
    z, e, f)` | Calculates the integral ![A978-1-4842-0310-1_8_Figz_HTML.jpg](A978-1-4842-0310-1_8_Figz_HTML.jpg)
    |


    The following table summarizes the functions related to differential equations:


    | `dsolve(''e'', ''v'')` | Solves the differential equation `e` where `v` is the
    independent variable (if you don''t specify `''v''`, the independent variable
    is by default `x`). It returns only explicit solutions. |

    | `dsolve(''e'', ''c'', ''v'')` | Solves the differential equation `e` subject
    to the initial condition specified by `c` and where `v` is the independent variable.
    |

    | `dsolve(''e'', ''c1'', ''c2'', ..., ''cn'', ''v'')` | Solves the differential
    equation `e` subject to the initial conditions specified by `c1`,...,`cn`, where
    `v` is the independent variable. |

    | `dsolve(''e'', ''c1,c2,...,cn'', ''v'')` | Solves the differential equation
    `e` subject to the specified initial conditions `c1`,...,`cn`, where `v` is the
    independent variable. |

    | `dsolve(''e1'', ''e2'', ..., ''en'', ''c1'', ''c2'', ..., ''cn'', ''v'')` |
    Solves the system of differential equations `e1`,...,`en`, subject to the specified
    initial conditions `c1`,...,`cn`, where `v` is the independent variable. |

    | `dsolve(''e1, e2,..., en'', ''c1, c2,..., cn'', ''v'')` | Solves the system
    of differential equations `e1`,...,`en` subject to the specified initial conditions
    `c1`,...,`cn` where `v` is the independent variable. |


    As a first example, we calculate the derivative of the function `ln(sin(2x))`.'
