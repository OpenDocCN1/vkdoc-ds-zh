    # 2. First Order Differential Equations. Exact Equations, Separation of Variables,
    Homogeneous and Linear Equations


    ## First Order Differential Equations


    Although it implements only a relatively small number of commands related to this
    topic, MATLAB’s treatment of differential equations is nevertheless very efficient.
    We shall see how we can use these commands to solve each type of differential
    equation algebraically. Numerical methods for the approximate solution of equations
    and systems of equations are also implemented.


    The basic command used to solve differential equations is dsolve. This command
    finds symbolic solutions of ordinary differential equations and systems of ordinary
    differential equations. The equations are specified by symbolic expressions where
    the letter D is used to denote differentiation, or D2, D3, etc, to denote differentiation
    of order 2,3,…, etc. The letter preceded by D (or D2, etc) is the dependent variable
    (which is usually y), and any letter that is not preceded by D (or D2, etc) is
    a candidate for the independent variable. If the independent variable is not specified,
    it is taken to be x by default. If x is specified as the dependent variable, then
    the independent variable is t. That is, x is the independent variable by default,
    unless it is declared as the dependent variable, in which case the independent
    variable is understood to be t.


    You can specify initial conditions using additional equations, which take the
    form y(a) = b or Dy(a) = b,…, etc. If the initial conditions are not specified,
    the solutions of the differential equations will contain constants of integration,
    C1, C2,…, etc. The most important MATLAB commands that solve differential equations
    are the following:


    dsolve(‘equation’, ‘v’): This solves the given differential equation, where v
    is the independent variable (if ‘v’ is not specified, the independent variable
    is x by default). This returns only explicit solutions.


    dsolve(‘equation’, ‘initial_condition’,…, ‘v’): This solves the given differential
    equation subject to the specified initial condition.


    dsolve(‘equation’, ‘cond1’, ‘cond2’,…, ‘condn’, ‘v’): This solves the given differential
    equation subject to the specified initial conditions.


    dsolve(‘equation’, ‘cond1, cond2,…, condn’, ‘v’): This solves the given differential
    equation subject to the specified initial conditions.


    dsolve(‘eq1’, ‘eq2’,…, ‘eqn’, ‘cond1’, ‘cond2’,…, ‘condn’ , ‘v’): This solves
    the given system of differential equations subject to the specified initial conditions.


    dsolve(‘eq1, eq2,…, eqn’, ‘cond1, cond2,…, condn’ , ‘v’): This solves the given
    system of differential equations subject to the specified initial conditions.


    maple(‘dsolve(equation, func(var))’): This solves the given differential equation,
    where var is the independent variable and func is the dependent variable (returns
    implicit solutions).


    maple(‘dsolve({equation, cond1, cond2,… condn}, func(var))’): This solves the
    given differential equation subject to the specified initial conditions.


    maple(‘dsolve({eq1, eq2,…, eqn}, {func1(var), func2(var),… funcn(var)})’): This
    solves the given system of differential equations (returns implicit solutions).


    maple(‘dsolve(equation, func(var), ’explicit’)’): This solves the given differential
    equation, offering the solution in explicit form, if possible.


    Examples are given below.


    First, we solve differential equations of first order and first degree, both with
    and without initial values.


    `» pretty(dsolve(''Dy = a*y''))`


    `C2 exp(a t)`


    `» pretty(dsolve(''Df = f + sin(t)''))`


    `sin(t)   cos(t)`


    `C6 exp(t) - ------ - ------`


    `2        2`


    The previous two equations can also be solved in the following way:


    `» pretty(sym(maple(''dsolve(diff(y(x), x) = a * y, y(x))'')))`


    `y(x) = exp(a x) _C1`


    `» pretty(maple(''dsolve(diff(f(t),t)=f+sin(t),f(t))''))`


