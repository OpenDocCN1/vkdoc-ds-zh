    M-file fun1.m. To define this function in MATLAB select M-file New from the File
    menu in the top menu bar (or click the button ![A978-1-4842-0310-1_6_Figc_HTML.jpg](A978-1-4842-0310-1_6_Figc_HTML.jpg)
