- fmt: '# The Taylor Series Method


    This method provides approximate polynomial solutions of general differential
    equations, and is based on the Taylor series expansion of functions. MATLAB offers
    the option `''series''` for the command `maple(''dsolve'')`, which allows you
    to solve equations by this method. Its syntax is as follows:


    ```

    maple(''dsolve(equation, func(var), ''series''))

    ```


    There is also the command `maple(''powsolve'')`, which gives a power series solution
    of linear differential equations, and whose syntax is as follows:


    ```

    maple(''powseries [powsolve](equation, cond1,...,condn) '')

    ```


    Using the command `maple(''convert(polynom)'')` you can convert a complicated
    solution to a polynomial in powers of the variable.


