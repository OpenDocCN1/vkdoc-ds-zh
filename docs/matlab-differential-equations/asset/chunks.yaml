    M4 =\n16  2  3 13\n 5 11 10  8\n 9  7  6 12\n 4 14 15  1\n```\n\n## 局部变量和全局变量\n\
    \n通常，每个定义为 M 文件的函数都包含局部变量，即仅在该 M 文件内有效的变量，与其他 M 文件及基本工作空间无关。 然而，可以在 M 文件内部定义变量，使其同时在其他\
    \ M 文件及基本工作空间中有效。 为此，需要使用 `GLOBAL` 命令来定义全局变量，其语法如下：\n\n`GLOBAL x y z...`\n\n这将变量\
    \ `x`、`y` 和 `z` 定义为全局变量。\n\n任何在函数内部定义为全局变量的变量都可单独供其他函数使用，并可在基本工作空间命令行中使用。 如果一个全局变量不存在，则它首次被使用时，将被初始化为一个空数组。\
    \ 如果已经存在一个与正在定义的全局变量同名的变量，MATLAB 将发送一条警告信息，并将该变量的值更改为与全局变量匹配。 最好在每个需要访问该全局变量的函数中，以及在命令行中，都将其声明为全局变量，以便从基本工作空间中访问它。\
    \ `GLOBAL` 命令位于函数的开头（在任何对该变量的引用出现之前）。\n\n作为示例，假设我们想要研究交互系数 `α` 和 `β` 在 Lotka–Volterra\
    \ 捕食者-猎物模型中的影响：\n\n![A978-1-4842-0310-1_6_Fige_HTML.jpg](img/A978-1-4842-0310-1_6_Fige_HTML.jpg)\n\
    \n为此，我们在 M 文件 `lotka.m` 中创建函数 `lotka`，如图 6-14 所示。\n\n![A978-1-4842-0310-1_6_Fig14_HTML.jpg](img/A978-1-4842-0310-1_6_Fig14_HTML.jpg)\n\
    \n图 6-14.\n\n之后，我们可能在命令行中输入以下内容：\n\n```\n>> global ALPHA BETA\nALPHA = 0.01\n\
    BETA = 0.02\n```\n\n然后，这些全局值就可以在 M 文件 `lotka.m` 中用于 `α` 和 `β`（无需再指定它们）。 例如，我们可以使用以下语法生成图形（图\
    \ 6-15）：\n\n```\n>> [t, y] = ode23('lotka', 0.10, [1; 1]); plot(t,y)\n```\n\n\
    ![A978-1-4842-0310-1_6_Fig15_HTML.jpg](img/A978-1-4842-0310-1_6_Fig15_HTML.jpg)\n\
    \n图 6-15.\n\n## 数据类型\n\nMATLAB 有 14 种不同的数据类型，总结在下面的图 6-16 中。\n\n![A978-1-4842-0310-1_6_Fig16_HTML.jpg](img/A978-1-4842-0310-1_6_Fig16_HTML.jpg)\n\
    \n图 6-16.\n\n以下是不同的数据类型：\n\n| 数据类型 | 示例 | 描述 |\n| --- | --- | --- |\n| `single`\
    \ | `3*10³⁸` | 单精度数值。 其存储需求小于双精度，但精度较低。 这种数据类型不应用于数学运算。 |\n| `double` | `3*10³⁰⁰\
    \ 5+6i` | 双精度数值。 这是 MATLAB 中最常用的数据类型。 |\n| `sparse` | `speye(5)` | 双精度稀疏矩阵。 |\n\
    | `int8`、`uint8`、`int16`、`uint16`、`int32`、`uint32` | `uint8(magic(3))` | 8 位、16\
    \ 位和 32 位的整数和无符号整数。 这使得可以在高效管理内存的情况下使用整数值。 这种数据类型不应用于数学运算。 |\n| `char` | `'Hello'`\
    \ | 字符（每个字符长度为 16 位）。 |\n| `cell` | `{17 'hello' eye(2)}` | 元胞数组（包含大小相似的数据）。 |\n\
    | `structure` | `a.day = 12; a.color = 'Red'; a.mat = magic(3);` | 结构体（包含大小相似的元胞）。\
    \ |\n| `user class` | `inline('sin(x)')` | MATLAB 类（使用函数构建） |\n| `java class`\
    \ | `Java.awt.Frame` | Java 类（在 API 中定义或使用 Java 自定义）。 |\n| `function handle` |\
    \ `@humps` | 管理 MATLAB 中的函数。 它可以位于参数列表的最后，并使用 `feval` 进行求值。 |\n\n## 流程控制：FOR 循环、WHILE\
    \ 循环和 IF ELSEIF 条件语句\n\n递归函数、条件运算和分段函数的应用在数学中非常普遍。 循环的处理对于定义这些类型的函数是必需的。 自然，这些函数的定义将通过\
    \ M 文件来完成。\n"
- fmt: "### FOR 循环\n\nMATLAB 有其自己版本的`DO`语句（大多数编程语言的语法中都定义了此语句）。此语句允许你重复运行一条命令或一组命令。例如：\n\
    \n```\n» for i=1:3, x(i)=0, end\nx =\n0\nx =\n0     0\nx =\n0 0 0\n```\n\n`FOR`循环的一般形式如下：\n\
    \n```\nfor variable = expression\n    commands\nend\n```\n\n循环总是以子句`for`开始，以子句`end`结束，并在其内部包含一组由逗号分隔的命令。如果任何命令定义了一个变量，则该命令必须以分号结尾，以避免在输出中重复。通常，循环在\
    \ M 文件的语法中使用。下面是一个示例（图 [6-17](#A978-1-4842-0310-1_6_Chapter.html#Fig17)）：\n\n\
    ![A978-1-4842-0310-1_6_Fig17_HTML.jpg](A978-1-4842-0310-1_6_Fig17_HTML.jpg)\n\n\
    图 6-17.\n\n在这个循环中，我们定义了一个阶为`(m, n)`的希尔伯特矩阵。如果将其保存为 M 文件`matrix1.m`，我们稍后可以通过运行该\
    \ M 文件并为变量`m`和`n`（矩阵维度）指定值来构建任何希尔伯特矩阵，如下所示：\n\n```\n>> M = matrix1 (4,5)\nM =\n\
    \    1.0000    0.5000    0.3333    0.2500    0.2000\n    0.5000    0.3333    0.2500\
    \    0.2000    0.1667\n    0.3333    0.2500    0.2000    0.1667    0.1429\n  \
    \  0.2500    0.2000    0.1667    0.1429    0.1250\n```\n\n### WHILE 循环\n\nMATLAB\
    \ 有其自己版本的`WHILE`结构（在大多数编程语言的语法中定义）。此语句允许你在满足指定的逻辑条件时，重复运行一条命令或一组命令。此循环的一般语法如下：\n\
    \n```\nwhile condition\n    commands\nend\n```\n\n循环总是以子句`while`开始，后跟一个条件，并以子句`end`结束。其内部包含一组由逗号分隔的命令，当条件满足时，这些命令会不断循环。如果任何命令定义了一个变量，则该命令必须以分号结尾，以避免在输出中重复。作为一个示例，我们编写一个\
    \ M 文件（图 [6-18](#A978-1-4842-0310-1_6_Chapter.html#Fig18)）并保存为`while1.m`，该文件计算其阶乘不超过`10^(100)`的最大数。\n\
    \n![A978-1-4842-0310-1_6_Fig18_HTML.jpg](A978-1-4842-0310-1_6_Fig18_HTML.jpg)\n\
    \n图 6-18.\n\n我们现在运行该 M 文件。\n\n```\n>> while1\nn =\n    70\n```\n\n### IF ELSEIF\
    \ ELSE END 循环\n\n与大多数结构化编程语言一样，MATLAB 也包含`IF-ELSEIF-ELSE-END`结构。使用此结构，可以在满足某些条件时运行脚本。循环语法如下：\n\
    \n```\nif condition\n    commands\nend\n```\n\n在这种情况下，如果条件为真，则执行命令。但此循环的语法可能更通用。\n\
    \n```\nif condition\n    commands1\nelse\n    commands2\nend\n```\n\n在这种情况下，如果条件为真，则执行`commands1`；如果条件为假，则执行`commands2`。\n\
    \n`IF`语句和`FOR`语句可以嵌套。当使用`ELSEIF`语句嵌套多个`IF`语句时，一般语法如下：\n\n```\nif condition1\n\
    \    commands1\nelseif condition2\n    commands2\nelseif condition3\n    commands3\n\
    .\n.\nelse\nend\n```\n\n在这种情况下，如果`condition1`为真，则执行`commands1`；如果`condition1`为假且`condition2`为真，则执行`commands2`；如果`condition1`和`condition2`均为假且`condition3`为真，则执行`commands3`，依此类推。\n\
    \n上述嵌套语法等效于以下非嵌套语法，但执行速度更快：\n\n```\nif condition1\n    commands1\nelse\n    if\
    \ condition2\n        commands2\n    else\n        if condition3\n           \
    \ commands3\n        else\n            .\n            .\n        end\n    end\n\
    end\n```\n\n例如，考虑 M 文件`else1.m`（见图 [6-19](#A978-1-4842-0310-1_6_Chapter.html#Fig19)）。\n\
    \n![A978-1-4842-0310-1_6_Fig19_HTML.jpg](A978-1-4842-0310-1_6_Fig19_HTML.jpg)\n\
    \n图 6-19.\n\n运行该文件时，它会根据参数`n`是否为负、非负奇数或非负偶数，分别返回`negative`、`odd`或`even`：\n\n```\n\
    >>else1 (8), else1 (5), else1 (- 10)\nA =\nn is even\nA =\nn is odd\nA =\nn is\
    \ negative\n```\n\n### Switch 和 Case\n\n`switch`语句根据变量或表达式的值执行某些语句。其基本语法如下：\n\n\
    ```\nswitch expression (scalar or string)\n    case value1\n        statements\
    \ % runs if expression is value1\n    case value2\n        statements % runs if\
    \ expression is value2\n    .\n    .\n    .\n    otherwise\n        statements\
    \ % runs if neither case is satisfied\nend\n```\n\n下面是一个函数的示例，该函数根据输入是等于`-1`、`0`、`1`还是其他值，分别返回`'minus\
    \ one'`、`'zero'`、`'one'`或`'another value'`（图 [6-20](#A978-1-4842-0310-1_6_Chapter.html#Fig20)）。\n\
    \n![A978-1-4842-0310-1_6_Fig20_HTML.jpg](A978-1-4842-0310-1_6_Fig20_HTML.jpg)\n\
    \n图 6-20.\n\n运行上述示例，我们得到：\n\n```\n>> case1 (25)\nanother value\n>> case1 (- 1)\n\
    minus one\n```\n\n### Continue\n\n`continue`语句将控制权传递给它所在的`for`循环或`while`循环的下一次迭代，忽略循环体中剩余的指令。下面是一个\
    \ M 文件`continue.m`（图 [6-21](#A978-1-4842-0310-1_6_Chapter.html#Fig21)），它统计文件`magic.m`中的代码行数，忽略空行和注释。\n\
    \n![A978-1-4842-0310-1_6_Fig21_HTML.jpg](A978-1-4842-0310-1_6_Fig21_HTML.jpg)\n\
    \n图 6-21.\n\n运行该 M 文件，我们得到：\n\n```\n>> continue1\n25 lines\n```\n\n### Break\n\
    \n`break`语句终止`for`循环或`while`循环的执行，并跳转到循环外的第一条指令。下面是一个 M 文件`break1.m`（图 [6-22](#A978-1-4842-0310-1_6_Chapter.html#Fig22)），它读取文件`fft.m`中的代码行，一旦遇到第一个空行就退出循环。\n\
    \n![A978-1-4842-0310-1_6_Fig22_HTML.jpg](A978-1-4842-0310-1_6_Fig22_HTML.jpg)\n\
    \n图 6-22.\n\n运行该 M 文件，我们得到：\n\n```\n>> break1\n%FFT Discrete Fourier transform.\n\
    %   FFT(X) is the discrete Fourier transform (DFT) of vector X.  For\n%   matrices,\
    \ the FFT operation is applied to each column. For N-D\n%   arrays, the FFT operation\
    \ operates on the first non-singleton\n%   dimension.\n%\n%   FFT(X,N) is the\
    \ N-point FFT, padded with zeros if X has less\n%   than N points and truncated\
    \ if it has more.\n%\n%   FFT(X,[],DIM) or FFT(X,N,DIM) applies the FFT operation\
    \ across the\n%   dimension DIM.\n%\n%   For length N input vector x, the DFT\
    \ is a length N vector X,\n%   with elements\n%                    N\n%      X(k)\
    \ =       sum  x(n)*exp(-j*2*pi*(k-1)*(n-1)/N), 1 <= k <= N.\n%              \
    \     n=1\n%   The inverse DFT (computed by IFFT) is given by\n%             \
    \       N\n%      x(n) = (1/N) sum  X(k)*exp( j*2*pi*(k-1)*(n-1)/N), 1 <= n <=\
    \ N.\n%                   k=1\n%\n%   See also IFFT, FFT2, IFFT2, FFTSHIFT.\n\
    ```\n\n### Try ... Catch\n\n`try`和`catch`之间的指令会一直执行，直到发生错误。指令`lasterr`用于显示错误的原因。此命令的一般语法如下：\n\
    \n```\ntry,\n    instruction\n    ...,\n    instruction\ncatch,\n    instruction\n\
    \    ...,\n    instruction\nend\n```"
  raw: '### The FOR Loop


    MATLAB has its own version of the DO statement (defined in the syntax of most
    programming languages). This statement allows you to run a command or group of
    commands repeatedly. For example:


    `» for i=1:3, x(i)=0, end`


    `x =`


    `0`


    `x =`


    `0     0`


    `x =`


    `0 0 0`


    The general form of a FOR loop is as follows:


    `for variable = expression`


    `commands`


    `end`


    The loop always starts with the clause for and ends with the clause end, and includes
    in its interior a whole set of commands that are separated by commas. If any command
    defines a variable, it must end with a semicolon in order to avoid repetition
    in the output. Typically, loops are used in the syntax of M-files. Here is an
    example (Figure [6-17](#A978-1-4842-0310-1_6_Chapter.html#Fig17)):


    ![A978-1-4842-0310-1_6_Fig17_HTML.jpg](A978-1-4842-0310-1_6_Fig17_HTML.jpg)


    Figure 6-17.


    In this loop we have defined a Hilbert matrix of order (m, n). If we save it as
    an M-file matrix1.m, we can build any Hilbert matrix later by running the M-file
    and specifying values for the variables m and n (the matrix dimensions) as shown
    below:


    `>> M = matrix1 (4,5)`


    `M =`


    `1.0000 0.5000 0.3333 0.2500 0.2000`


    `0.5000 0.3333 0.2500 0.2000 0.1667`


    `0.3333 0.2500 0.2000 0.1667 0.1429`


    `0.2500 0.2000 0.1667 0.1429 0.1250`


    ### The WHILE Loop


    MATLAB has its own version of the WHILE structure defined in the syntax of most
    programming languages. This statement allows you to repeat a command or group
    of commands a number of times while a specified logical condition is met. The
    general syntax of this loop is as follows:


    `while condition`


    `commands`


    `end`


    The loop always starts with the clause while, followed by a condition, and ends
    with the clause end, and includes in its interior a whole set of commands that
    are separated by commas which continually loop while the condition is met. If
    any command defines a variable, it must end with a semicolon in order to avoid
    repetition in the output. As an example, we write an M-file (Figure [6-18](#A978-1-4842-0310-1_6_Chapter.html#Fig18))
    that is saved as while1.m, which calculates the largest number whose factorial
    does not exceed 10^(100).


    ![A978-1-4842-0310-1_6_Fig18_HTML.jpg](A978-1-4842-0310-1_6_Fig18_HTML.jpg)


    Figure 6-18.


    We now run the M-file.


    `>> while1`


    `n =`


    `70`


    ### IF ELSEIF ELSE END Loops


    MATLAB, like most structured programming languages, also includes the IF-ELSEIF-ELSE-END
    structure. Using this structure, scripts can be run if certain conditions are
    met. The loop syntax is as follows:


    `if condition`


    `commands`


    `end`


    In this case the commands are executed if the condition is true. But the syntax
    of this loop may be more general.


    `if condition`


    `commands1`


    `else`


    `commands2`


    `end`


    In this case, the commands commands1 are executed if the condition is true, and
    the commands commands2 are executed if the condition is false.


    IF statements and FOR statements can be nested. When multiple IF statements are
    nested using the ELSEIF statement, the general syntax is as follows:


    `if condition1`


    `commands1`


    `elseif condition2`


    `commands2`


    `elseif condition3`


    `commands3`


    `.`


    `.`


    `else`


    `end`


    In this case, the commands commands1 are executed if condition1 is true, the commands
    commands2 are executed if condition1 is false and condition2 is true, the commands
    commands3 are executed if condition1 and condition2 are false and condition3 is
    true, and so on.


    The previous nested syntax is equivalent to the following unnested syntax, but
    executes much faster:


    `if condition1`


    `commands1`


    `else`


    `if condition2`


    `commands2`


    `else`


    `if condition3`


    `commands3`


    `else`


    `.`


    `.`


    `end`


    `end`


    `end`


