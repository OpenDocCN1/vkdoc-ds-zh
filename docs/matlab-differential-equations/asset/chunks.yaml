    ![A978-1-4842-0310-1_3_Figu_HTML.jpg](A978-1-4842-0310-1_3_Figu_HTML.jpg)


    We will follow the algebraic method of variation of parameters to solve the first
    equation. We first consider the characteristic equation of the homogeneous equation
    to obtain a set of linearly independent solutions.


    `» solve(''m^2+4*m+13=0'')`


