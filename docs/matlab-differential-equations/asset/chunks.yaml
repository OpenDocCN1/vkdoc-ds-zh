    ## Partial Differential Equations


    MATLAB implements several commands which can be used when working with partial
    differential equations, all of which require the prior use of the maple command.
    We have:


    pdesolve (pdeqn, fnc (var 1,.., varn)): This solves the partial differential equation
    pdeqn for the function fnc (var1,.., varn).


    pdesolve (exprpd, fnc (var1,.., varn)): This solves the partial differential equation
    exprpd=0 .


    DEtools[PDEchangecoords] (pdeqn, [varind, 1,.., varind, n], option): This converts
    the partial differential equation pdeqn in the independent variables varind1,..,
    varindn to the new coordinate system defined by the option. The possible two-dimensional
    coordinate systems are bipolar, cardoid, cassinian, elliptic, hyperbolic, invcassinian,
    invelliptic, logarithmic, logcosh, maxwell, parabolic, polar, rose and tangent.
    For three dimensions possible systems include, among others, bispherical, cardoidal,
    conical, cylindrical, ellipsoidal, paraboloidal, sixsphere, spherical and toroidal.


    DEtools [PDEchangecoords] (pdeqn, [va1,.., van], option, [vn1, .., vnn]): This
    converts the partial differential equation pdeqn to the specified new coordinate
    system in the given independent variables.


    DEtools[PDEchangecoords] ({pdeqn1, .., pdeqnm}, [varind1, .., varindn], option):
    This converts the given system of partial differential equations to the specified
    new coordinate system in the given independent variables.


    EXAMPLES:


    `» pretty(sym(maple(''pdesolve( diff(f(x,y),x,x)+5*diff(f(x,y),x,y)=3, f(x,y)
    )'')))`


                                   `2`


                   `f(x, y) = 3/2 x  + _F1(y) + _F2(y - 5 x)`


    `» pretty(sym(maple(''pdesolve( 3*diff(g(x,y),x)+7*diff(g(x,y),x,y)=x*y, g(x,y)
    ) '')))`


                        `2           2`


         `g(x, y) = 1/6 x  y - 7/18 x  + _F1(y) + exp(- 3/7 y) _F2(x)`


    `» pretty(sym(maple(''pdesolve( diff(h(x,y),x,x)-diff(h(x,y),y,y)=0, h(x,y)) '')))`


                      `h(x, y) = _F1(y + x) + _F2(y - x)`


    `» pretty(sym(maple(''pdesolve(y*diff(U(x,y),x)+x*diff(U(x,y),y)=0, U(x,y) ) '')))`


                                           `2    2`


                           `U(x, y) = _F1(-x  + y ).`


