    \ = 1, sin(x) = log(y) + 1/2 * y ^ 2 + C), C)')`\n```\nC =\n-1/2\n```\n\n因此最终解为：\n\
    \n![A978-1-4842-0310-1_2_Figf_HTML.jpg](img/A978-1-4842-0310-1_2_Figf_HTML.jpg)\n\
    \n同样地，你可以求解任何其他具有可分离变量的微分方程。\n\n上述微分方程也可以直接通过以下方式求解：\n\n`» pretty(maple('dsolve(diff(y(x),\
    \ x) = y(x) * cos(x) /(1 + y(x) ^ 2), y(x))'))`\n```\n                       \
    \                  2\n                      log(y(x)) + 1/2 y(x) - sin(x) = _C1\n\
    ```\n\n## 齐次微分方程\n\n考虑一个一般形式的一阶一次微分方程：\n\n![A978-1-4842-0310-1_2_Figg_HTML.jpg](img/A978-1-4842-0310-1_2_Figg_HTML.jpg)\n\
    \n如果函数`M`和`N`满足以下条件，则称该方程为`n`次齐次方程：\n\n![A978-1-4842-0310-1_2_Figh_HTML.jpg](img/A978-1-4842-0310-1_2_Figh_HTML.jpg)\n\
    \n对于这种类型的方程，我们可以通过变量替换`x = vy`，将原始微分方程（变量为`x`和`y`）转化为另一个（可分离的）方程（变量为`v`和`y`）。新的方程通过分离变量法求解，然后通过反转变量替换求得原始方程的解。\n\
    \n**练习 2-2**\n\n求解微分方程：\n\n![A978-1-4842-0310-1_2_Figi_HTML.jpg](img/A978-1-4842-0310-1_2_Figi_HTML.jpg)\n\
    \n首先检查方程是否为齐次方程：\n\n`» maple('m:=(x,y) - > x ^ 2 - y ^ 2');`\n\n`» maple('n:=(x,y)\
    \ - > x * y ');`\n\n`» factor('m(t*x,t*y)')`\n```\nans =\nt ^ 2 *(x-y) *(x + y)\n\
    ```\n\n`» factor('n(t*x,t*y)')`\n```\nans =\nt ^ 2 * x * y\n```\n\n因此该方程是 2 次齐次方程。为了求解，我们应用变量替换`x\
    \ = vy`。\n\n在执行变量替换之前，建议使用命令`maple('with(difforms)')`加载`difforms`库，这将允许你处理微分形式。加载此库后，还建议使用命令`maple('defform(v=0,x=0,y=0)')`，该命令允许声明在微分过程中不是常数或参数的所有变量。\n\
    \n`» maple('with(difforms)');`\n\n`» maple('defform(v=0,x=0,y=0)');`\n\n现在我们可以进行变量替换`x\
    \ = vy`，并将项分组为`d(v)`和`d(y)`。\n\n`» simplify('subs(x = v * y m(x,y) * d(x) + n(x,y)\
    \ * d(y))')`\n```\nans =\nv ^ 2 * y ^ 3 * d(v) + v ^ 3 * y ^ 2 * d(y) - y ^ 3\
    \ * d(v)\n```\n\n`» pretty(maple('collect(v ^ 2 * y ^ 3 * d(v) + v ^ 3 * y ^ 2\
    \ * d(y) - y ^ 3 * d(v) {d(v), d(y)})'))`\n```\n2  2    2                    \
    \   2\n(v  y  - y )(y d(v) + v d(y)) + y  v d(y)\n```\n\n如果我们将前一个表达式除以`v³y³`，并将项分组为`d(v)`和`d(y)`，我们就得到了一个分离变量的方程。\n\
    \n`» pretty(maple('collect(((v²*y³-y³) * d(v) + v ^ 3 * y ^ 2 * d(y)) /(v³*y³),\
    \ {d(v), d(y)})'))`\n```\n2  3    3\n(v  y  - y ) d(v)    d(y)\n-----------------\
    \ + ----\n3  3           y\nv  y\n```\n\n前面的表达式可以简化。\n\n`» pretty(maple('convert(collect(((v²*y³-y³)\
    \ * d(v) + v ^ 3 * y ^ 2 * d(y)) /(v³*y³), {d(v), d(y)}), parfrac, y)'))`\n```\n\
    2\n(v  - 1) d(v)    d(y)\n------------- + ----\n3          y\nv\n```\n\n现在，我们求解方程：\n\
    \n`» pretty(simple('int((v²-1)/v ^ 3, v) + int(1/y,y)'))`\n```\n1\nlog(v) + ----\
    \ + log(y)\n2\n2 v\n```\n\n最后反转变量替换：\n\n`» pretty(simple('subs(v = x / y log(v)\
    \ + 1/2/v ^ 2 + log(y))'))`\n```\n2\ny\nlog(x) + 1/2 ----\n2\nx\n```\n\n因此，原始微分方程的通解为：\n\
    \n![A978-1-4842-0310-1_2_Figj_HTML.jpg](img/A978-1-4842-0310-1_2_Figj_HTML.jpg)\n\
    \n现在我们可以用图形表示该微分方程的解。为此，我们绘制带有参数`C`的解的图形，这等价于由上述通解左侧定义的函数的等高线图（参见图 18-1）：\n\n\
    `» [x,y]=meshgrid(0.1:0.05:1/2,-1:0.05:1);`\n\n`» z=y.²./(2*x.²)+log(x);`\n\n\
    `» contour(z,65)`\n\n![A978-1-4842-0310-1_2_Fig1_HTML.jpg](img/A978-1-4842-0310-1_2_Fig1_HTML.jpg)\n\
    \n图 2-1\n"
- fmt: "# Exact Differential Equations\n\nThe differential equation\n\n![A978-1-4842-0310-1_2_Figk_HTML.jpg](A978-1-4842-0310-1_2_Figk_HTML.jpg)\n\
    \nis said to be exact if ![A978-1-4842-0310-1_2_Figl_HTML.jpg](A978-1-4842-0310-1_2_Figl_HTML.jpg).\
    \ If the equation is exact, then there exists a function `F` such that its total\
    \ differential `dF` coincides with the left-hand side of the above equation, i.e.:\n\
    \n![A978-1-4842-0310-1_2_Figm_HTML.jpg](A978-1-4842-0310-1_2_Figm_HTML.jpg)\n\n\
    therefore the family of solutions is given by `F(x,y) = C`.\n\nThe exercise below\
    \ follows the usual steps of an algebraic solution to this type of equation.\n\
    \n**EXERCISE 2-3**\n\nSolve the differential equation:\n\n![A978-1-4842-0310-1_2_Fign_HTML.jpg](A978-1-4842-0310-1_2_Fign_HTML.jpg)\n\
    \nFirst of all, we try to solve the equation with `dsolve`:\n\n```\n» maple('m:=(x,y)\
    \ - > - 1 + y * exp(x*y) + y * cos(x*y)')\n```\n\n```\n» maple('n:=(x,y) - > 1\
    \ + x * exp(x*y) + x * cos(x*y)')\n```\n\n```\n» dsolve('m(x,y) + n(x,y) * Dy\
    \ = 0')\n??? Error using ==> dsolve\nExplicit solution could not be found.\n```\n\
    \nThus the function `dsolve` does not give a solution to the proposed equation.\
    \ We are going to try to solve the equation using the classical algebraic method.\n\
    \nFirst we check that the proposed differential equation is exact.\n\n```\n» pretty(simple(diff('m(x,y)','y')))\n\
    exp(y x) + x y exp(y x) + cos(y x) - x sin(y x) y\n```\n\n```\n» pretty(simple(diff('n(x,y)','x')))\n\
    exp(y x) + x y exp(y x) + cos(y x) - x sin(y x) y\n```\n\nSince the equation is\
    \ exact, we can find the solution in the following way:\n\n```\n» solution1 =\
    \ simplify('int(m(x,y), x) + g(y)')\nsolution1 =\n-x+exp(y*x) + sin(y*x) + g(y)\n\
    ```\n\nNow we find the function `g(y)` via the following condition:\n\n![A978-1-4842-0310-1_2_Figo_HTML.jpg](A978-1-4842-0310-1_2_Figo_HTML.jpg)\n\
    \n```\n» pretty(simplify('int(m(x,y), x) + g(y)'))\n                   -x + exp(y\
    \ x) + sin(y x) + g(y)\n```\n\n```\n» pretty(simplify('diff(-x+exp(y*x) + sin(y*x)\
    \ + g(y), y)'))\n                                               d\n          \
    \        x exp(y x) x + x cos(y x) + -- g(y)\n                               \
    \               dy\n```\n\n```\n» simplify('solve(x * exp(y*x) + x * cos(y*x)\
    \ + diff(g(y), y) = n(x,y), diff(g(y), y))')\nans =\n1\n```\n\nThus `g'(y) = 1`,\
    \ so the final solution will be, omitting the addition of a constant:\n\n```\n\
    » pretty(simplify('subs(g(y) = int(1,y),-x+exp(y*x) + sin(y*x) + g(y))'))\n-x\
    \ + exp(y x) + sin(y x) + y\n```\n\nTo graphically represent the family of solutions,\
    \ we draw the following contour plot of the above expression (Figure 18-2):\n\n\
    ```\n» [x,y]=meshgrid(-2*pi/3:.2:2*pi/3);\n» z =-x+exp(y.*x) + sin(y.*x) + y;\n\
    » contour(z,100)\n```\n\n![A978-1-4842-0310-1_2_Fig2_HTML.jpg](A978-1-4842-0310-1_2_Fig2_HTML.jpg)\n\
    \n**Figure 2-2.**\n\nIn the following section we will see how any reducible differential\
    \ equation can be transformed to an exact equation using an integrating factor.\n\
    \n## Linear Differential Equations\n\nA linear first order differential equation\
    \ is an equation of the form:\n\n![A978-1-4842-0310-1_2_Figp_HTML.jpg](A978-1-4842-0310-1_2_Figp_HTML.jpg)\n\
    \nwhere `P(x)` and `Q(x)` are given functions of `x`.\n\nDifferential equations\
    \ of this type can be transformed into exact equations by multiplying both sides\
    \ of the equation by the integrating factor:\n\n![A978-1-4842-0310-1_2_Figq_HTML.jpg](A978-1-4842-0310-1_2_Figq_HTML.jpg)\n\
    \nand the general solution is then given by the expression:\n\n![A978-1-4842-0310-1_2_Figr_HTML.jpg](A978-1-4842-0310-1_2_Figr_HTML.jpg)\n\
    \nMATLAB implements these solutions of linear differential equations, and offers\
    \ them whenever the integral appearing in the integrating factor can be found.\n\
    \n**EXERCISE 2-4**\n\nSolve the differential equation:\n\n![A978-1-4842-0310-1_2_Figs_HTML.jpg](A978-1-4842-0310-1_2_Figs_HTML.jpg)\n\
    \n```\n» pretty(simple(dsolve('x * Dy + 3 * y = x * sin(x)')))\n             \
    \       /   3 t \\\n             C36 exp| - --- |\n  x sin(x)          \\    x\
    \  /\n  -------- - ----------------\n     3              3\n```\n\n# Higher Order\
    \ Differential Equations. The Laplace Transform and Special Types of Equations\n\
    \n## Ordinary High-Order Equations\n\nAn ordinary linear differential equation\
    \ of order `n` has the following general form:\n\n![A978-1-4842-0310-1_3_Figa_HTML.jpg](A978-1-4842-0310-1_3_Figa_HTML.jpg)\n\
    \nIf the function `f(x)` is identically zero, the equation is called homogeneous.\
    \ Otherwise, the equation is called non-homogeneous. If the functions `a[i](x)`\
    \ (i = 1, …, n) are constant, the equation is said to have constant coefficients.\n\
    \nA concept of great importance in this context is that of a set of linearly independent\
    \ functions. A set of functions `{f[1](x), f[2](x), …, f[n](x)}` is linearly independent\
    \ if, for any `x` in their common domain of definition, the Wronskian determinant\
    \ of the functions is non-zero. The Wronskian determinant of the given set of\
    \ functions, at a point `x` of their common domain of definition, is defined as\
    \ follows:\n\n![A978-1-4842-0310-1_3_Figb_HTML.jpg](A978-1-4842-0310-1_3_Figb_HTML.jpg)\n\
    \nThe MATLAB command `maple('Wronskian')` allows you to calculate the Wronskian\
    \ matrix of a set of functions. Its syntax is:\n\n*   `maple('Wronskian(V,x)')`:\
    \ This computes the Wronskian matrix corresponding to the vector of functions\
