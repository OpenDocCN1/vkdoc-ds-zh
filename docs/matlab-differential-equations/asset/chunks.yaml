    R =\n24\n```\n\n**练习 8-16**\n\n计算下列积分的值：\n\n该积分表示指定界限之间正态曲线下的面积。\n\n```\n>> numeric(int('exp(-x²/2)/(2*pi)^(1/2)','x',-1.96,1.96))\n\
    ans =\n0.95000420970356\n```\n\n**练习 8-17**\n\n求曲面`ax² + y² = z`和`z = a² - y²`的交线，并计算交线所围成的体积。同时，求曲面`z\
