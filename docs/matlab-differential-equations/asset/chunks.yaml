    `For more help on directory/topic, type "help topic".`


    As we can see, the help command displays a list of program directories and their
    contents. Help on any given topic topic can be displayed using the command help
    topic. For example:


    `» help inv`


    `INV    Matrix inverse.`


    `INV(X) is the inverse of the square matrix X.`


    `A warning message is printed if X is badly scaled or`


