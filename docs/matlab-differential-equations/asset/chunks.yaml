    \    y  |    |\n  |     asin| log(y) + -- |    |\n  |         \\          2  /\
    \    |\n  |                            |\n  |           /           2 \\  |\n\
    \  |           |          y  |  |\n  |  pi - asin| log(y) + -- |  |\n  |     \
    \      \\          2  /  |\n  +-                          -+\n```\n\n经过简单的重排，我们看到通解由下式给出：\n\
    \n![A978-1-4842-0310-1_2_Fige_HTML.jpg](img/A978-1-4842-0310-1_2_Fige_HTML.jpg)\n\
