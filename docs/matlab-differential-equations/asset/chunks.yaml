    The linearly independent solutions of the following second order differential
    equation are called Bessel functions:


    ![A978-1-4842-0310-1_3_Figxx_HTML.jpg](A978-1-4842-0310-1_3_Figxx_HTML.jpg) (Bessel
    equation)


    The linearly independent solutions of the following differential equation are
    called modified Bessel functions:


    ![A978-1-4842-0310-1_3_Figyy_HTML.jpg](A978-1-4842-0310-1_3_Figyy_HTML.jpg) (modified
    Bessel equation)


    MATLAB implements the following related functions:


    *   Ai(z) and Bi(z) are the linearly independent solutions of the Airy differential
    equation.

    *   BesselJ(n,z) and BesselY(n,z) are the linearly independent solutions of the
    Bessel differential equation.

    *   BesselI(n,z) and BesselK(n,z) are the linearly independent solutions of the
    modified Bessel differential equation.


