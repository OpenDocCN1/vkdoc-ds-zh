    # 带边界条件的常微分方程


    MATLAB 还允许您求解带有边界条件的常微分方程。边界条件规定了在定义区间端点处，解函数值之间必须满足的关系。这类问题的最简单形式是方程组：


    ![A978-1-4842-0310-1_7_Figc_HTML.jpg](img/A978-1-4842-0310-1_7_Figc_HTML.jpg)


    其中 `x` 是自变量，`y` 是因变量，`y''` 是 `y` 对 `x` 的导数（即 `y'' = dy/dx`）。此外，区间 `[a, b]` 上的解必须满足以下边界条件：


    ![A978-1-4842-0310-1_7_Figd_HTML.jpg](img/A978-1-4842-0310-1_7_Figd_HTML.jpg)


    更一般地，这种类型的微分方程可以表示如下：


    ![A978-1-4842-0310-1_7_Fige_HTML.jpg](img/A978-1-4842-0310-1_7_Fige_HTML.jpg)


    其中向量 `p` 由参数构成，这些参数必须通过边界条件与解同时确定。


    求解这些问题的命令是 `bvp4c`，其语法如下：


    ```

    Sol = bvp4c (odefun, bcfun, solinit)

    ```


    ```

    Sol = bvp4c (odefun, bcfun, solinit, options)

    ```


    ```

    Sol = bvp4c (odefun, bcfun, solinit, options, p1, p2...)

    ```


    在上述语法中，`odefun` 是一个计算 `f(x, y)` 的函数。它可以采用以下形式之一：


    ```

    dydx = odefun(x, y)

    ```


    ```

    dydx = odefun(x, y, p1, p2, ...)

    ```


    ```

    dydx = odefun(x, y, parameters)

    ```


    ```

    dydx = odefun(x, y, parameters, p1, p2, ...)

    ```


    `bvp4c` 中的参数 `bcfun` 是一个计算边界条件残差的函数。其形式如下：


    ```

    Res = bcfun(ya, yb)

    ```


    ```

    Res = bcfun(ya, yb, p1, p2, ...)

    ```


    ```

    Res = bcfun(ya, yb, parameters)

    ```


    ```

    Res = bcfun(ya, yb, parameters, p1, p2, ...)

    ```


    参数 `solinit` 是一个包含解的初始猜测的结构体。它具有以下字段：`x`（给出初始网格的有序节点，以便边界条件施加于 `a = solinit.x(1)`
    和 `b = solinit.x(end)`）；以及 `y`（解的初始猜测，以向量形式给出，使得第 i 个条目是解的第 i 个分量在所有由 `x` 给出的网格点上的常数猜测）。结构体
    `solinit` 使用命令 `bvpinit` 创建。其语法为 `solinit = bvpinit(x, y)`。


    作为示例，我们求解以下二阶微分方程：


    ![A978-1-4842-0310-1_7_Figf_HTML.jpg](img/A978-1-4842-0310-1_7_Figf_HTML.jpg)


    其解必须满足边界条件：


    ![A978-1-4842-0310-1_7_Figg_HTML.jpg](img/A978-1-4842-0310-1_7_Figg_HTML.jpg)


    这等价于以下问题（其中 `y[1] = y` 且 `y[2] = y''`）：


    ![A978-1-4842-0310-1_7_Figh_HTML.jpg](img/A978-1-4842-0310-1_7_Figh_HTML.jpg)


    我们在区间 `[0,4]` 上考虑五个等距点的网格，我们对解的初始猜测是 `y[1] = 1` 和 `y[2] = 0`。这些假设包含在以下语法中：


    ```

    >> solinit = bvpinit (linspace (0,4,5), [1 0]);

    ```


    图 7-3 和图 7-4 描绘的 M 文件展示了如何输入方程及其边界条件。


    ![A978-1-4842-0310-1_7_Fig4_HTML.jpg](img/A978-1-4842-0310-1_7_Fig4_HTML.jpg)


    图 7-4.


    ![A978-1-4842-0310-1_7_Fig3_HTML.jpg](img/A978-1-4842-0310-1_7_Fig3_HTML.jpg)


    图 7-3.


    使用以下语法求解方程：


    ```

    >> Sun = bvp4c (@twoode, @twobc, solinit);

    ```


    可以使用命令 `bvpval` 绘制解的图形（图 7-5），如下所示：


    ```

    >> y = bvpval (Sun, linspace (0,4));

    >> plot (x, y(1,:));

    ```


    ![A978-1-4842-0310-1_7_Fig5_HTML.jpg](img/A978-1-4842-0310-1_7_Fig5_HTML.jpg)


    图 7-5.

