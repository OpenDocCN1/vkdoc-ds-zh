  trans: "\n### FOR 循环\n\nMATLAB 有其自己版本的`DO`语句（大多数编程语言的语法中都定义了此语句）。此语句允许你重复运行一条命令或一组命令。例如：\n\
    \n```\n» for i=1:3, x(i)=0, end\nx =\n0\nx =\n0     0\nx =\n0 0 0\n```\n\n`FOR`循环的一般形式如下：\n\
