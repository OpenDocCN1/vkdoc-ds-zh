    [         0]

    [ i*3^(1/2)]

    [-i * 3 ^(1/2)]

    ```


    The only possible turning point occurs at `x = 0`, and as `f(0) = 0`, this possible
    turning point is `(0,0)`:


    ```

    >> subs (diff(f,3), 0)

    ```


    ```

    ans =

    -6

    ```


    As the third derivative at `x = 0` is not zero, we see that the origin is indeed
    a turning point:


