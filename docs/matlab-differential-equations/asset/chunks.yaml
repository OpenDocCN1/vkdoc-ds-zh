    \n方程组在图 7-21 所示的 M 文件中引入，边界条件在图 7-22 所示的 M 文件中给出，图 7-23 中的 M 文件设置初始解。\n\n![A978-1-4842-0310-1_7_Fig23_HTML.jpg](img/A978-1-4842-0310-1_7_Fig23_HTML.jpg)\n\
