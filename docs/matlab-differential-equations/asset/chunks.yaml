    It has the following fields: x (which gives the ordered nodes of the initial mesh
    so that the boundary conditions are imposed at a = `solinit.x(1)` and b = `solinit.x(end)`);
    and y (the initial guess for the solution, given as a vector, so that the i-th
    entry is a constant guess for the i-th component of the solution at all the mesh
    points given by x). The structure solinit is created using the command bvpinit.
    The syntax is `solinit = bvpinit(x,y)`.


    As an example we solve the second order differential equation:


    ![A978-1-4842-0310-1_7_Figf_HTML.jpg](A978-1-4842-0310-1_7_Figf_HTML.jpg)


    whose solutions must satisfy the boundary conditions:


    ![A978-1-4842-0310-1_7_Figg_HTML.jpg](A978-1-4842-0310-1_7_Figg_HTML.jpg)


    This is equivalent to the following problem (where y [1] = y and y [2] = y’):


    ![A978-1-4842-0310-1_7_Figh_HTML.jpg](A978-1-4842-0310-1_7_Figh_HTML.jpg)


    We consider a mesh of five equally spaced points in the interval [0,4] and our
    initial guess for the solution is y [1] = 1 and y [2] = 0\. These assumptions
    are included in the following syntax:


    `>> solinit = bvpinit (linspace (0,4,5), [1 0]);`


    The M-files depicted in Figures [7-3](#A978-1-4842-0310-1_7_Chapter.html#Fig3)
    and [7-4](#A978-1-4842-0310-1_7_Chapter.html#Fig4) show how to enter the equation
    and its boundary conditions.


    ![A978-1-4842-0310-1_7_Fig4_HTML.jpg](A978-1-4842-0310-1_7_Fig4_HTML.jpg)


    Figure 7-4.


    ![A978-1-4842-0310-1_7_Fig3_HTML.jpg](A978-1-4842-0310-1_7_Fig3_HTML.jpg)


    Figure 7-3.


    The following syntax is used to find the solution of the equation:


    `>> Sun = bvp4c (@twoode, @twobc, solinit);`


    The solution can be graphed (Figure [7-5](#A978-1-4842-0310-1_7_Chapter.html#Fig5))
    using the command bvpval as follows:


    `>> y = bvpval (Sun, linspace (0,4));`


    `>> plot (x, y(1,:));`


    ![A978-1-4842-0310-1_7_Fig5_HTML.jpg](A978-1-4842-0310-1_7_Fig5_HTML.jpg)


    Figure 7-5.'
