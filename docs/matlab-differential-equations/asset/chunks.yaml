    There is a command for help on a certain sequence of characters (lookfor string)
    which allows you to find all those functions or commands that contain or refer
    to the given string string. This command is very useful when there is no direct
    support for the specified string, or if you want to view the help for all commands
    related to the given sequence. For example, if we seek help for all commands that
    contain the sequence complex, we can use the lookfor complex command to see which
    commands MATLAB provides.


    `» lookfor complex`


    `ctranspose.m: %''   Complex conjugate transpose.`


    `CONJ   Complex conjugate.`


    `CPLXPAIR Sort numbers into complex conjugate pairs.`


    `IMAG   Complex imaginary part.`


    `REAL   Complex real part.`


    `CDF2RDF Complex diagonal form to real block diagonal form.`


    `RSF2CSF Real block diagonal form to complex diagonal form.`


    `B5ODE  Stiff problem, linear with complex eigenvalues(B5 of EHL).`


    `CPLXDEMO Maps of functions of a complex variable.`


    `CPLXGRID Polar coordinate complex grid.`


    `CPLXMAP Plot a function of a complex variable.`


    `GRAFCPLX Demonstrates complex function plots in MATLAB.`


    `ctranspose.m: %TRANSPOSE Symbolic matrix complex conjugate transpose.`


    `SMOKE  Complex matrix with a "smoke ring" pseudospectrum.`


    ## MATLAB and Programming


    By properly combining all the objects defined in MATLAB, according to the rules
    of syntax of the program, you can build useful mathematical research programming
    code. Programs usually consist of a series of instructions in which values are
    calculated, are assigned names and are reused in further calculations.


    As in programming languages like C or FORTRAN, in MATLAB you can write programs
    with loops, control flow and conditionals. MATLAB can write procedural programs,
    i.e., it can define a sequence of standard steps to run. As in C or Pascal, a
    Do, For, or While loop can be used for repetitive calculations. The language of
    MATLAB also includes conditional constructs such as If—Then—Else. MATLAB also
    supports different logical operators, such as AND, OR, NOT and XOR.


    MATLAB supports procedural programming (with iterative processes, recursive functions,
    loops, etc.), functional programming and object-oriented programming. Here are
    two simple examples of programs. The first generates the Hilbert matrix of order
    n, and the second calculates all the Fibonacci numbers less than 1000.


    `% Generating the Hilbert matrix of order n`


    `t = ''1/(i+j-1)'';`


    `for i = 1:n`


    `for j = 1:n`


    `a(i,j) = eval(t);`


    `end`


    `end`


    `% Calculating the Fibonacci numbers`


    `f = [1 1]; i = 1;`


    `while f(i) + f(i-1) < 1000`


    `f(i+2) = f(i) + f(i+1);`


    `i = i+1`                


    `end`'
