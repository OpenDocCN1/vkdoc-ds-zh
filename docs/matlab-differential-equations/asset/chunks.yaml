    # The Runge–Kutta Method


    The Runge–Kutta method gives a set of data points to which you can fit a curve,
    approximating the solution of a differential equation. Maple provides the option
    `numeric` for the command `maple(''solve'')` which enables the calculation of
    approximate numerical solutions of differential equations. Its syntax is:


    ```

    maple(''dsolve(equation, func(var), ''numeric''))

    ```


