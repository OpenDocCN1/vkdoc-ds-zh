- fmt: "### Return\n\nThe `return` statement terminates the current script and returns\
    \ the control to the invoked function or the keyboard. The following is an example\
    \ (Figure [6-23](#A978-1-4842-0310-1_6_Chapter.html#Fig23)) that computes the\
    \ determinant of a non-empty matrix. If the array is empty it returns the value\
    \ 1.\n\n![A978-1-4842-0310-1_6_Fig23_HTML.jpg](A978-1-4842-0310-1_6_Fig23_HTML.jpg)\n\
    \nFigure 6-23.\n\nRunning the function for a non-empty array we get:\n\n```\n\
    >> A = [-1,-1,1; 1,0,1; 1,1,1]\nA =\n-1 -1 -1\n1  0  1\n1 -1 -1\n>> det1 (A)\n\
    ans =\n2\n```\n\nNow we apply the function to an empty array:\n\n```\n>> B =[]\n\
    B =\n     []\n>> det1 (B)\nans =\n     1\n```\n\n## Subfunctions\n\nM-file-defined\
    \ functions can contain code for more than one function. The main function in\
    \ an M-file is called a primary function, which is precisely the function which\
    \ invokes the M-file, but subfunctions hanging from the primary function may be\
    \ added which are only visible for the primary function or another subfunction\
    \ within the same M-file. Each subfunction begins with its own function definition.\
    \ An example is shown in Figure [6-24](#A978-1-4842-0310-1_6_Chapter.html#Fig24).\n\
    \n![A978-1-4842-0310-1_6_Fig24_HTML.jpg](A978-1-4842-0310-1_6_Fig24_HTML.jpg)\n\
    \nFigure 6-24.\n\nThe subfunctions `mean` and `median` calculate the arithmetic\
    \ mean and the median of the input list. The primary function `newstats` determines\
    \ the length `n` of the list and calls the subfunctions with the list as the first\
    \ argument and `n` as the second argument. When executing the main function, it\
    \ is enough to provide as input a list of values for which the arithmetic mean\
    \ and median will be calculated. The subfunctions are executed automatically,\
    \ as shown below.\n\n```\n>> [mean, median] = newstats ([10,20,3,4,5,6])\nmean\
    \ =\n     8\nmedian =\n    5.5000\n```\n\n## Ordinary Differential Equations Using\
    \ Numerical Analysis\n\nObtaining exact solutions of ordinary differential equations\
    \ is not a simple task. There are a number of different methods for obtaining\
    \ approximate solutions of ordinary differential equations. These numerical methods\
    \ include, among others, Euler’s method, Heun’s method, the Taylor series method,\
    \ the Runge–Kutta method (implemented in MATLAB’s Basic module), the Adams–Bashforth–Moulton\
    \ method, Milne’s method and Hamming’s method.\n\n### Euler’s Method\n\nSuppose\
    \ we want to solve the differential equation `y' = f(t, y)`, `y(a) = y[0]`, on\
    \ the interval `[a, b]`. We divide the interval `[a, b]` into `M` subintervals\
    \ of the same size using the partition given by the points `t[k] = a + kh`, `k\
    \ = 0,1,..., M`, `h = (b-a)/M`. Euler’s method then finds the solution of the\
    \ differential equation iteratively by calculating `y[k+1] = y[k] + hf(t[k], y[k])`,\
    \ `k = 0,1, ..., M-1`.\n\nEuler’s method is implemented using the M-file shown\
    \ in Figure [6-25](#A978-1-4842-0310-1_6_Chapter.html#Fig25).\n\n![A978-1-4842-0310-1_6_Fig25_HTML.jpg](A978-1-4842-0310-1_6_Fig25_HTML.jpg)\n\
    \nFigure 6-25.\n\n### Heun’s Method\n\nSuppose we want to solve the differential\
    \ equation `y' = f(t, y)`, `y(a) = y[0]`, on the interval `[a, b]`. We divide\
    \ the interval `[a, b]` into `M` subintervals of the same size using the partition\
    \ given by the points `t[k] = a + kh`, `k = 0,1,..., M`, `h = (b-a)/M`. Heun’s\
    \ method then finds the solution of the differential equation iteratively by calculating\
    \ `y[k+1] = y[k] + h(f(t[k], y[k]) + f(t[k+1], y[k] + f(t[k], y[k])))/2`, `k =\
    \ 0,1,..., M-1`.\n\nHeun’s method is implemented using the M-file shown in Figure\
    \ [6-26](#A978-1-4842-0310-1_6_Chapter.html#Fig26).\n\n![A978-1-4842-0310-1_6_Fig26_HTML.jpg](A978-1-4842-0310-1_6_Fig26_HTML.jpg)\n\
    \nFigure 6-26."
