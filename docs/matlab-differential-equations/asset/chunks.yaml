    ### Continue


    The continue statement passes control to the next iteration in a for loop or while
    loop in which it appears, ignoring the remaining instructions in the body of the
    loop. Below is an M-file continue.m (Figure [6-21](#A978-1-4842-0310-1_6_Chapter.html#Fig21))
