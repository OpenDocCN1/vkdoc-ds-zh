    ## Local and Global Variables


    Typically, each function defined as an M-file contains local variables, i.e.,
    variables that have effect only within the M-file, separate from other M-files
    and the base workspace. However, it is possible to define variables inside M-files
    which can take effect simultaneously in other M-files and in the base workspace.
    For this purpose, it is necessary to define global variables with the GLOBAL command
    whose syntax is as follows:


    `GLOBAL x y z...`


    This defines the variables x, y and z as global.


    Any variables defined as global inside a function are available separately for
    the rest of the functions and in the base workspace command line. If a global
    variable does not exist, the first time it is used, it will be initialized as
    an empty array. If there is already a variable with the same name as a global
    variable being defined, MATLAB will send a warning message and change the value
    of that variable to match the global variable. It is convenient to declare a variable
    as global in every function that will need access to it, and also in the command
    line, in order to access it from the base workspace. The GLOBAL command is located
    at the beginning of a function (before any occurrence of the variable).


    As an example, suppose that we want to study the effect of the interaction coefficients
    α and β in the Lotka–Volterra predator-prey model:


    ![A978-1-4842-0310-1_6_Fige_HTML.jpg](A978-1-4842-0310-1_6_Fige_HTML.jpg)


