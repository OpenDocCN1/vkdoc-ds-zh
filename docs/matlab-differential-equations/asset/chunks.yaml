    As for any program, the best way to learn MATLAB is to use it. By practicing on
    examples you become familiar with the syntax and notation peculiar to MATLAB.
    Each example we give consists of the header with the user input prompt “»” followed
    by the MATLAB response on the next line. See Figure [1-27](#A978-1-4842-0310-1_1_Chapter.html#Fig27).


