    ## 退出到 MS-DOS 环境的命令


    你有三种方法可以从 MATLAB 命令窗口退出到 MS-DOS 操作系统环境，以便运行临时任务。在命令窗口中输入命令 `! dos_command`，可以在
    MATLAB 环境中执行指定的 DOS 命令。例如：


    ```

    ! dir

    The volume of drive D has no label

    The volume serial number £ is 145 c-12F2

    Directory of D:\MATLAB52\bin


    .              <DIR>        13/03/98   0:16 .

    ..             <DIR>        13/03/98   0:16 ..

    BCCOPTS  BAT         1.872  19/01/98  14:14 bccopts.bat

    CLBS110  DLL       219.136  21/08/97  22:24 clbs110.dll

    CMEX     BAT         2.274  13/03/98   0:28 cmex.bat

    COMPTOOL BAT        34.992  19/01/98  14:14 comptool.bat

    DF50OPTS BAT         1.973  19/01/98  14:14 df50opts.bat

    FENG     DLL        25.088  18/12/97  16:34 feng.dll

    FMAT     DLL        16.896  18/12/97  16:34 fmat.dll

    FMEX     BAT         2.274  13/03/98   0:28 fmex.bat

    LICENSE  DAT           470  13/03/98   0:27 license.dat

    W32SSI   DLL        66.560  02/05/97   8:34 w32ssi.dll

    10 file(s)         11.348.865 bytes

    directory(s) 159.383.552 bytes free

    ```


    命令 `! dos_command &` 用于在后台模式下执行指定的 DOS 命令。该命令通过在 MATLAB 命令窗口上打开一个 DOS 环境窗口来执行，如图
    1-29 所示。要返回到 MATLAB 环境，只需在命令窗口中的任意位置点击鼠标右键（DOS 环境窗口将自动关闭）。你可以随时返回到 DOS 窗口运行任何操作系统命令，只需点击屏幕底部标有
    MS-DOS 符号的图标。


    ![A978-1-4842-0310-1_1_Fig29_HTML.jpg](img/A978-1-4842-0310-1_1_Fig29_HTML.jpg)


    图 1-29.


    命令 `>>dos_command` 用于在 MATLAB 屏幕中执行 DOS 命令。使用上述三个命令，不仅可以执行 DOS 命令，还可以执行各种可执行文件或批处理任务（图
    1-30）。


    ![A978-1-4842-0310-1_1_Fig30_HTML.jpg](img/A978-1-4842-0310-1_1_Fig30_HTML.jpg)


    图 1-30.


    命令 `>>dos dos_command` 也用于在 MATLAB 命令窗口中以自动模式执行指定的 DOS 命令（图 1-31）。


    ![A978-1-4842-0310-1_1_Fig31_HTML.jpg](img/A978-1-4842-0310-1_1_Fig31_HTML.jpg)


    图 1-31.


    要退出 MATLAB，只需在命令窗口中输入 `quit`，然后按 Enter 键。


    # 一阶微分方程。恰当方程、分离变量法、齐次方程和线性方程


    ## 一阶微分方程


    尽管 MATLAB 仅实现了与此主题相关数量相对较少的命令，但它处理微分方程的效率仍然非常高。我们将看到如何使用这些命令来代数求解每种类型的微分方程。此外，还实现了用于方程和方程组近似解的数值方法。


    用于求解微分方程的基本命令是 `dsolve`。该命令用于寻找常微分方程和常微分方程组的符号解。方程通过符号表达式指定，其中字母 `D` 用于表示微分，而
    `D2`、`D3` 等则用于表示二阶、三阶等微分。前面带有 `D`（或 `D2` 等）的字母是因变量（通常是 `y`），任何前面不带 `D`（或 `D2`
    等）的字母被视为自变量的候选。如果未指定自变量，则默认取 `x` 作为自变量。如果 `x` 被指定为因变量，则自变量为 `t`。也就是说，`x` 默认是自变量，除非它被声明为因变量，在这种情况下，自变量被理解为
    `t`。


    你可以使用附加方程来指定初始条件，其形式为 `y(a) = b` 或 `Dy(a) = b` 等。如果未指定初始条件，微分方程的解将包含积分常数 `C1`、`C2`
    等。求解微分方程最重要的 MATLAB 命令如下：


    `dsolve(''equation'', ''v'')`：解给定的微分方程，其中 `v` 是自变量（如果未指定 `''v''`，则默认自变量为 `x`）。此命令仅返回显式解。


    `dsolve(''equation'', ''initial_condition'', …, ''v'')`：在给定的初始条件下解给定的微分方程。


    `dsolve(''equation'', ''cond1'', ''cond2'', …, ''condn'', ''v'')`：在给定的初始条件下解给定的微分方程。


    `dsolve(''equation'', ''cond1, cond2, …, condn'', ''v'')`：在给定的初始条件下解给定的微分方程。


    `dsolve(''eq1'', ''eq2'', …, ''eqn'', ''cond1'', ''cond2'', …, ''condn'', ''v'')`：在给定的初始条件下解给定的微分方程组。


    `dsolve(''eq1, eq2, …, eqn'', ''cond1, cond2, …, condn'', ''v'')`：在给定的初始条件下解给定的微分方程组。


    `maple(''dsolve(equation, func(var))'')`：解给定的微分方程，其中 `var` 是自变量，`func` 是因变量（返回隐式解）。


    `maple(''dsolve({equation, cond1, cond2, … condn}, func(var))'')`：在给定的初始条件下解给定的微分方程。


    `maple(''dsolve({eq1, eq2, …, eqn}, {func1(var), func2(var), … funcn(var)})'')`：解给定的微分方程组（返回隐式解）。


    `maple(''dsolve(equation, func(var), ''''explicit'''')'')`：解给定的微分方程，如果可能，以显式形式提供解。


    示例如下。


    首先，我们求解一阶一次的微分方程，包括有初值和无初值的情况。


    ```

    » pretty(dsolve(''Dy = a*y''))

    C2 exp(a t)


    » pretty(dsolve(''Df = f + sin(t)''))

    sin(t)   cos(t)

    C6 exp(t) - ------ - ------

    2        2

    ```


    前两个方程也可以按以下方式求解：


    ```

    » pretty(sym(maple(''dsolve(diff(y(x), x) = a * y, y(x))'')))

    y(x) = exp(a x) _C1


    » pretty(maple(''dsolve(diff(f(t),t)=f+sin(t),f(t))''))

    f(t) = - 1/2 cos(t) - 1/2 sin(t) + exp(t) _C1


    » pretty(dsolve(''Dy = a*y'', ''y(0) = b''))

    exp(a x) b


    » pretty(dsolve(''Df = f + sin(t)'', ''f(pi/2) = 0''))

    /   pi \

    exp| - -- | exp(t)

    \   2  /          sin(t)   cos(t)

    ------------------ - ------ - ------

    2              2        2

    ```

    '
