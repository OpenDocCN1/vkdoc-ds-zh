  trans: "\n# 带初始值的常微分方程\n\n常微分方程包含因变量 `y` 关于自变量 `t` 的一个或多个导数。带初始值的一阶常微分方程可表示为：\n\n\
    ![A978-1-4842-0310-1_7_Figa_HTML.jpg](img/A978-1-4842-0310-1_7_Figa_HTML.jpg)\n\
    \n上述问题可以推广到 `y` 为向量的情形，即 `y = (y[1], y[2], …, y[n])`。\n\n下表中列出了 MATLAB 基本模块中与带初始值的常微分方程和微分代数方程相关的命令：\n\
    \n| 命令 | 求解问题类型、数值方法及语法 |\n| --- | --- |\n| `ode45` | 基于龙格-库塔法的常微分方程 |\n| `ode23`\
    \ | 基于龙格-库塔法的常微分方程 |\n| `ode113` | 基于亚当斯法的常微分方程 |\n| `ode15s` | 使用 NDF（BDF）的微分代数方程和常微分方程\
    \ |\n| `ode23s` | 基于罗森布罗克法的常微分方程 |\n| `ode23t` | 基于梯形法则的常微分和微分代数方程 |\n| `ode23tb`\
    \ | 使用 TR-BDF2 的常微分方程 |\n\n上述七个命令的通用语法如下：\n\n`[T, y] = solver(odefun,tspan,y0)`\n\
    \n`[T, y] = solver(odefun,tspan,y0,options)`\n\n`[T, y] = solver(odefun,tspan,y0,options,p1,p2...)`\n\
    \n`[T, y, TE, YE, IE] = solver(odefun,tspan,y0,options)`\n\n其中，`solver` 可以是 `ode45`、`ode23`、`ode113`、`ode15s`、`ode23s`、`ode23t`\
    \ 或 `ode23tb` 中的任意一个命令。\n\n参数 `odefun` 计算微分方程或方程组的右端项，方程形式为 `y’ = f(t, y)` 或 `M(t,\
    \ y)y’ = f(t, y)`，其中 `M(t, y)` 称为质量矩阵。命令 `ode23s` 只能求解具有恒定质量矩阵的方程。命令 `ode15s`\
    \ 和 `ode23t` 可求解代数微分方程以及具有奇异质量矩阵的常微分方程组。参数 `tspan` 是一个向量，指定积分范围 `[t[0], tf]`（`tspan\
    \ = [t[0], t[1], …, t[f]]`，其元素必须为递增或递减序列，用于获取特定 `t` 值对应的解）。参数 `y[0]` 指定初始条件向量。参数\
    \ `p1`、`p2`、... 是传递给 `odefun` 的可选参数。参数 `options` 通过命令 `options odeset` 指定额外的积分选项，该命令可在程序手册中找到。向量\
    \ `T` 和 `y` 分别给出解的自变量和因变量的数值结果。\n\n作为第一个示例，我们求解以下常微分方程组在区间 `[0,12]` 上的解：\n\n![A978-1-4842-0310-1_7_Figb_HTML.jpg](img/A978-1-4842-0310-1_7_Figb_HTML.jpg)\n\
    \n为此，我们在一个 M 文件中定义一个名为 `system1` 的函数，该函数将存储方程组的表达式。该函数首先定义一个包含三行的列向量，随后为这些行分别赋值，这些赋值构成了三个方程的语法（图\
    \ 7-1）。\n\n![A978-1-4842-0310-1_7_Fig1_HTML.jpg](img/A978-1-4842-0310-1_7_Fig1_HTML.jpg)\n\
    \n图 7-1。\n\n接着，我们在命令窗口中输入以下内容来求解方程组：\n\n```\n>> [T, Y] = ode45(@system1,[0 12],[0\
    \ 1 1])\nT =\n    0\n    0.0001\n    0.0001\n    0.0002\n    0.0002\n    0.0005\n\
    \    .\n    .\n    11.6136\n    11.7424\n    11.8712\n    12.0000\nY =\n     0\
    \         1.0000    1.0000\n     0.0001    1.0000    1.0000\n     0.0001    1.0000\
    \    1.0000\n     0.0002    1.0000    1.0000\n     0.0002    1.0000    1.0000\n\
    \     0.0005    1.0000    1.0000\n     0.0007    1.0000    1.0000\n     0.0010\
    \    1.0000    1.0000\n     0.0012    1.0000    1.0000\n     0.0025    1.0000\
    \    1.0000\n     0.0037    1.0000    1.0000\n     0.0050    1.0000    1.0000\n\
    \     0.0062    1.0000    1.0000\n     0.0125    0.9999    1.0000\n     0.0188\
    \    0.9998    0.9999\n     0.0251    0.9997    0.9998\n     0.0313    0.9995\
    \    0.9997\n     0.0627    0.9980    0.9990\n     .\n     .\n     0.8594   -0.5105\
    \    0.7894\n     0.7257   -0.6876    0.8552\n     0.5228   -0.8524    0.9281\n\
    \     0.2695   -0.9631    0.9815\n    -0.0118   -0.9990    0.9992\n    -0.2936\
    \   -0.9540    0.9763\n    -0.4098   -0.9102    0.9548\n    -0.5169   -0.8539\
    \    0.9279\n    -0.6135   -0.7874    0.8974\n    -0.6987   -0.7128    0.8650\n\
    ```\n\n为了更好地解释结果，可以使用以下命令将上述数值解绘制成图形（图 7-2）：\n\n```\n>> plot (T, Y(:,1), '-',\
    \ T, Y(:,2),'-', T, Y(:,3),'. ')\n```\n\n![A978-1-4842-0310-1_7_Fig2_HTML.jpg](img/A978-1-4842-0310-1_7_Fig2_HTML.jpg)\n\
    \n图 7-2。\n"
- fmt: '# Ordinary Differential Equations with Boundary Values


    MATLAB also allows you to solve ordinary differential equations with boundary
    conditions. The boundary conditions specify a relationship that must hold between
    the values of the solution function at the end points of the interval on which
    it is defined. The simplest problem of this type is the system of equations


    ![A978-1-4842-0310-1_7_Figc_HTML.jpg](A978-1-4842-0310-1_7_Figc_HTML.jpg)


    where `x` is the independent variable, `y` is the dependent variable and `y''`
    is the derivative with respect to `x` (i.e., `y'' = dy/dx`). In addition, the
    solution on the interval `[a, b]` has to meet the following boundary condition:


    ![A978-1-4842-0310-1_7_Figd_HTML.jpg](A978-1-4842-0310-1_7_Figd_HTML.jpg)


    More generally this type of differential equation can be expressed as follows:


    ![A978-1-4842-0310-1_7_Fige_HTML.jpg](A978-1-4842-0310-1_7_Fige_HTML.jpg)


    where the vector `p` consists of parameters which have to be determined simultaneously
    with the solution via the boundary conditions.


    The command that solves these problems is `bvp4c`, whose syntax is as follows:


    ```

    Sol = bvp4c (odefun, bcfun, solinit)

    ```


    ```

    Sol = bvp4c (odefun, bcfun, solinit, options)

    ```


    ```

    Sol = bvp4c (odefun, bcfun, solinit, options, p1, p2...)

    ```


    In the syntax above `odefun` is a function that evaluates `f(x, y)`. It may take
    one of the following forms:


    ```

    dydx = odefun(x, y)

    ```


    ```

    dydx = odefun(x, y, p1, p2, ...)

    ```


    ```

    dydx = odefun(x, y, parameters)

    ```


    ```

    dydx = odefun(x, y, parameters, p1, p2, ...)

    ```


    The argument `bcfun` in `bvp4c` is a function that computes the residual in the
    boundary conditions. Its form is as follows:


    ```

    Res = bcfun(ya, yb)

    ```


    ```

    Res = bcfun(ya, yb, p1, p2, ...)

    ```


    ```

    Res = bcfun(ya, yb, parameters)

    ```


    ```

    Res = bcfun(ya, yb, parameters, p1, p2, ...)

    ```


    The argument `solinit` is a structure containing an initial guess of the solution.
    It has the following fields: `x` (which gives the ordered nodes of the initial
    mesh so that the boundary conditions are imposed at `a = solinit.x(1)` and `b
    = solinit.x(end)`); and `y` (the initial guess for the solution, given as a vector,
    so that the i-th entry is a constant guess for the i-th component of the solution
    at all the mesh points given by `x`). The structure `solinit` is created using
    the command `bvpinit`. The syntax is `solinit = bvpinit(x, y)`.


    As an example we solve the second order differential equation:


    ![A978-1-4842-0310-1_7_Figf_HTML.jpg](A978-1-4842-0310-1_7_Figf_HTML.jpg)


    whose solutions must satisfy the boundary conditions:


    ![A978-1-4842-0310-1_7_Figg_HTML.jpg](A978-1-4842-0310-1_7_Figg_HTML.jpg)


    This is equivalent to the following problem (where `y[1] = y` and `y[2] = y''`):


    ![A978-1-4842-0310-1_7_Figh_HTML.jpg](A978-1-4842-0310-1_7_Figh_HTML.jpg)


    We consider a mesh of five equally spaced points in the interval `[0,4]` and our
    initial guess for the solution is `y[1] = 1` and `y[2] = 0`. These assumptions
    are included in the following syntax:


    ```

    >> solinit = bvpinit (linspace (0,4,5), [1 0]);

    ```


    The M-files depicted in Figures [7-3](#A978-1-4842-0310-1_7_Chapter.html#Fig3)
    and [7-4](#A978-1-4842-0310-1_7_Chapter.html#Fig4) show how to enter the equation
    and its boundary conditions.


    ![A978-1-4842-0310-1_7_Fig4_HTML.jpg](A978-1-4842-0310-1_7_Fig4_HTML.jpg)


    Figure 7-4.


    ![A978-1-4842-0310-1_7_Fig3_HTML.jpg](A978-1-4842-0310-1_7_Fig3_HTML.jpg)


    Figure 7-3.


    The following syntax is used to find the solution of the equation:


    ```

    >> Sun = bvp4c (@twoode, @twobc, solinit);

    ```


    The solution can be graphed (Figure [7-5](#A978-1-4842-0310-1_7_Chapter.html#Fig5))
    using the command `bvpval` as follows:


    ```

    >> y = bvpval (Sun, linspace (0,4));

    >> plot (x, y(1,:));

    ```


    ![A978-1-4842-0310-1_7_Fig5_HTML.jpg](A978-1-4842-0310-1_7_Fig5_HTML.jpg)


    Figure 7-5.'
