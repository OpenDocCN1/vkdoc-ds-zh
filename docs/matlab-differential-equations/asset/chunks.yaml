    下表总结了与微分方程相关的函数：


    | `dsolve(''e'', ''v'')` | 求解微分方程 `e`，其中 `v` 是自变量（如果不指定 `''v''`，则自变量默认为 `x`）。仅返回显式解。
    |

    | `dsolve(''e'', ''c'', ''v'')` | 求解微分方程 `e`，并满足 `c` 指定的初始条件，其中 `v` 是自变量。 |

    | `dsolve(''e'', ''c1'', ''c2'', ..., ''cn'', ''v'')` | 求解微分方程 `e`，并满足 `c1`,...,`cn`
    指定的初始条件，其中 `v` 是自变量。 |

    | `dsolve(''e'', ''c1,c2,...,cn'', ''v'')` | 求解微分方程 `e`，并满足指定的初始条件 `c1`,...,`cn`，其中
    `v` 是自变量。 |

    | `dsolve(''e1'', ''e2'', ..., ''en'', ''c1'', ''c2'', ..., ''cn'', ''v'')` |
    求解微分方程组 `e1`,...,`en`，并满足指定的初始条件 `c1`,...,`cn`，其中 `v` 是自变量。 |

    | `dsolve(''e1, e2,..., en'', ''c1, c2,..., cn'', ''v'')` | 求解微分方程组 `e1`,...,`en`，并满足指定的初始条件
    `c1`,...,`cn`，其中 `v` 是自变量。 |


