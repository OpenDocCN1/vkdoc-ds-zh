  raw: '## Ordinary Differential Equations with Initial Values


    An ordinary differential equation contains one or more derivatives of the dependent
    variable y with respect to the independent variable t. A first order ordinary
    differential equation with an initial value for the independent variable can be
    represented as:


    ![A978-1-4842-0310-1_7_Figa_HTML.jpg](A978-1-4842-0310-1_7_Figa_HTML.jpg)


    The previous problem can be generalized to the case where y is a vector, y = (y
    [1], y [2],..., y [n] ).


    MATLAB’s Basic module commands relating to ordinary differential equations and
    differential algebraic equations with initial values are presented in the following
    table:


    | Command | Class of Problem Solving, Numerical Method and Syntax |

    | --- | --- |

    | ode45 | Ordinary differential equations by the Runge–Kutta method |

    | ode23 | Ordinary differential equations by the Runge–Kutta method |

    | ode113 | Ordinary differential equations by Adams’ method |

    | ode15s | Differential algebraic equations and ordinary differential equations
    using NDFs (BDFs) |

    | ode23s | Ordinary differential equations by the Rosenbrock method |

    | ode23t | Ordinary differential and differential algebraic equations by the trapezoidal
    rule |

    | ode23tb | Ordinary differential equations using TR-BDF2 |


    The common syntax for the previous seven commands is the following:


    `[T, y] = solver(odefun,tspan,y0)`


    `[T, y] = solver(odefun,tspan,y0,options)`


    `[T, y] = solver(odefun,tspan,y0,options,p1,p2...)`


    `[T, y, TE, YE, IE] = solver(odefun,tspan,y0,options)`


    In the above, solver can be any of the commands ode45, ode23, ode113, ode15s,
    ode23s, ode23t, or ode23tb.


    The argument odefun evaluates the right-hand side of the differential equation
    or system written in the form y’ = f (t, y) or M(t, y)y ’=f (t, y), where M(t,
    y) is called a mass matrix. The command ode23s can only solve equations with constant
    mass matrix. The commands ode15s and ode23t can solve algebraic differential equations
    and systems of ordinary differential equations with a singular mass matrix. The
    argument tspan is a vector that specifies the range of integration [t [0] , tf]
    (tspan= [t [0] , t [1] ,...,t [f] ], which must be either an increasing or decreasing
    list, is used to obtain solutions for specific values of t).The argument y [0]
    specifies a vector of initial conditions. The arguments p1, p2,... are optional
    parameters that are passed to odefun. The argument options specifies additional
    integration options using the command options odeset which can be found in the
    program manual. The vectors T and y present the numerical values of the independent
    and dependent variables for the solutions found.


    As a first example we find solutions in the interval [0,12] of the following system
    of ordinary differential equations:


    ![A978-1-4842-0310-1_7_Figb_HTML.jpg](A978-1-4842-0310-1_7_Figb_HTML.jpg)


    For this, we define a function named system1 in an M-file, which will store the
    equations of the system. The function begins by defining a column vector with
    three rows which are subsequently assigned components that make up the syntax
    of the three equations (Figure [7-1](#A978-1-4842-0310-1_7_Chapter.html#Fig1)).


    ![A978-1-4842-0310-1_7_Fig1_HTML.jpg](A978-1-4842-0310-1_7_Fig1_HTML.jpg)


    Figure 7-1.


    We then solve the system by typing the following in the Command Window:


    `>> [T, Y] = ode45(@system1,[0 12],[0 1 1])`


    `T =`


    `0`


    `0.0001`


    `0.0001`


    `0.0002`


    `0.0002`


    `0.0005`


    `.`


    `.`


    `11.6136`


    `11.7424`


    `11.8712`


    `12.0000`


    `Y =`


    `0 1.0000 1.0000`


    `0.0001 1.0000 1.0000`


    `0.0001 1.0000 1.0000`


    `0.0002 1.0000 1.0000`


    `0.0002 1.0000 1.0000`


    `0.0005 1.0000 1.0000`


    `0.0007 1.0000 1.0000`


    `0.0010 1.0000 1.0000`


    `0.0012 1.0000 1.0000`


    `0.0025 1.0000 1.0000`


    `0.0037 1.0000 1.0000`


    `0.0050 1.0000 1.0000`


    `0.0062 1.0000 1.0000`


    `0.0125 0.9999 1.0000`


    `0.0188 0.9998 0.9999`


    `0.0251 0.9997 0.9998`


    `0.0313 0.9995 0.9997`


    `0.0627 0.9980 0.9990`


    `.`


    `.`


    `0.8594-0.5105 0.7894`


    `0.7257-0.6876 0.8552`


    `0.5228-0.8524 0.9281`


    `0.2695-0.9631 0.9815`


    `-0.0118-0.9990 0.9992`


    `-0.2936-0.9540 0.9763`


    `-0.4098-0.9102 0.9548`


    `-0.5169-0.8539 0.9279`


    `-0.6135-0.7874 0.8974`


    `-0.6987-0.7128 0.8650`


    To better interpret the results, the above numerical solution can be graphed (Figure
    [7-2](#A978-1-4842-0310-1_7_Chapter.html#Fig2)) by using the following command:


    `>> plot (T, Y(:,1), ''-'', T, Y(:,2),''-'', T, Y(:,3),''. '')`


    ![A978-1-4842-0310-1_7_Fig2_HTML.jpg](A978-1-4842-0310-1_7_Fig2_HTML.jpg)


