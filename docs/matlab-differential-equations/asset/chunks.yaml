    \n```\nS1 =\n[  1]\n[ -1]\n[  i]\n[ -i]\n```\n\n接下来我们计算复数`2 + 2i`的五次方根。\n\n```\n\
    >> numeric(solve('x^5-(2+2*i)=0'))\n```\n\n```\nans =\n1.21598698264961 + 0.19259341768888i\n\
