    # Systems of Differential Equations and Finite Difference Equations


    ## Systems of Linear Homogeneous Equations with Constant Coefficients


    MATLAB can solve this type of system directly, simply by using the command `dsolve`
    or `maple(''dsolve'')` with the familiar syntax.


    A system of differential equations, written as `X''(t) = AX(t)` has a general
    solution of the form:


    ![A978-1-4842-0310-1_5_Figa_HTML.jpg](A978-1-4842-0310-1_5_Figa_HTML.jpg)


    where the eigenvalues `{λ[k]}` (`K = 1, 2, ... n`) corresponding to the eigenvectors
    `{V[k]}` of the matrix of the system are all assumed to be different.


    If an eigenvalue `λ[k]` is a complex number `a[k] + b[ki]`, then it generates
    the following component of the overall solution:


    ![A978-1-4842-0310-1_5_Figb_HTML.jpg](A978-1-4842-0310-1_5_Figb_HTML.jpg)


    where:


    ![A978-1-4842-0310-1_5_Figc_HTML.jpg](A978-1-4842-0310-1_5_Figc_HTML.jpg)


    ![A978-1-4842-0310-1_5_Figd_HTML.jpg](A978-1-4842-0310-1_5_Figd_HTML.jpg)


    Here ![A978-1-4842-0310-1_5_Fige_HTML.jpg](A978-1-4842-0310-1_5_Fige_HTML.jpg)
    is the eigenvector corresponding to the eigenvalue `λ[k]` and ![A978-1-4842-0310-1_5_Figf_HTML.jpg](A978-1-4842-0310-1_5_Figf_HTML.jpg)
    is its conjugate.


    If there is an eigenvalue `λ[i]` of multiplicity `m > 1`, then it will generate
    a portion of the general solution of the form:


    ![A978-1-4842-0310-1_5_Figg_HTML.jpg](A978-1-4842-0310-1_5_Figg_HTML.jpg)


