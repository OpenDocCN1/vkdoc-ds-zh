    \n## 偏微分方程\n\nMATLAB 实现了若干可用于处理偏微分方程的命令，这些命令均需预先使用 `maple` 命令。包括：\n\n`pdesolve\
    \ (pdeqn, fnc (var 1,.., varn))`：求解函数 `fnc (var1,.., varn)` 的偏微分方程 `pdeqn`。\n\n\
    `pdesolve (exprpd, fnc (var1,.., varn))`：求解偏微分方程 `exprpd=0`。\n\n`DEtools[PDEchangecoords]\
    \ (pdeqn, [varind, 1,.., varind, n], option)`：将自变量为 `varind1,.., varindn` 的偏微分方程\
    \ `pdeqn` 转换为由 `option` 定义的新坐标系。可用的二维坐标系包括 `bipolar`、`cardoid`、`cassinian`、`elliptic`、`hyperbolic`、`invcassinian`、`invelliptic`、`logarithmic`、`logcosh`、`maxwell`、`parabolic`、`polar`、`rose`\
    \ 和 `tangent`。三维坐标系包括（但不限于）`bispherical`、`cardoidal`、`conical`、`cylindrical`、`ellipsoidal`、`paraboloidal`、`sixsphere`、`spherical`\
    \ 和 `toroidal`。\n\n`DEtools [PDEchangecoords] (pdeqn, [va1,.., van], option, [vn1,\
    \ .., vnn])`：将偏微分方程 `pdeqn` 转换为指定新坐标系下的方程，指定新的自变量。\n\n`DEtools[PDEchangecoords]\
    \ ({pdeqn1, .., pdeqnm}, [varind1, .., varindn], option)`：将给定的偏微分方程组转换为指定新坐标系下的方程组。\n\
    \n## 示例：\n\n```\n» pretty(sym(maple('pdesolve( diff(f(x,y),x,x)+5*diff(f(x,y),x,y)=3,\
    \ f(x,y) )')))\n                              2\n               f(x, y) = 3/2\
    \ x  + _F1(y) + _F2(y - 5 x)\n```\n\n```\n» pretty(sym(maple('pdesolve( 3*diff(g(x,y),x)+7*diff(g(x,y),x,y)=x*y,\
    \ g(x,y) ) ')))\n                   2           2\n     g(x, y) = 1/6 x  y - 7/18\
    \ x  + _F1(y) + exp(- 3/7 y) _F2(x)\n```\n\n```\n» pretty(sym(maple('pdesolve(\
    \ diff(h(x,y),x,x)-diff(h(x,y),y,y)=0, h(x,y)) ')))\n                  h(x, y)\
    \ = _F1(y + x) + _F2(y - x)\n```\n\n```\n» pretty(sym(maple('pdesolve(y*diff(U(x,y),x)+x*diff(U(x,y),y)=0,\
    \ U(x,y) ) ')))\n                                      2    2\n              \
    \         U(x, y) = _F1(-x  + y ).\n```\n\n# 使用 MATLAB 进行数值计算。微分方程应用\n"
- fmt: '# MATLAB and Programming


    MATLAB can be used as a high-level programming language including data structures,
    functions, instructions for flow control, management of inputs/outputs and even
    object-oriented programming.


    MATLAB programs are usually written in files called M-files. An M-file is nothing
    more than a MATLAB code (script) that executes a series of commands or functions
    that accept arguments and produce an output. The M-files are created using the
    text editor.


    ## Text Editor


    The Editor/Debugger is activated by clicking on the create a new M-file button
    ![A978-1-4842-0310-1_6_Figa_HTML.jpg](A978-1-4842-0310-1_6_Figa_HTML.jpg) in the
    MATLAB desktop or by selecting File ➤ New ➤ M-file in the MATLAB desktop (Figure
    [6-1](#A978-1-4842-0310-1_6_Chapter.html#Fig1)) or Command Window (Figure [6-2](#A978-1-4842-0310-1_6_Chapter.html#Fig2)).
    The Editor/Debugger opens a file in which we create the M-file, i.e. a blank file
    into which we will write MATLAB programming code (Figure [6-3](#A978-1-4842-0310-1_6_Chapter.html#Fig3)).
    You can open an existing M-file using File ➤ Open on the MATLAB desktop (Figure
    [6-1](#A978-1-4842-0310-1_6_Chapter.html#Fig1)) or, alternatively, you can use
    the command `Open` in the Command Window (Figure [6-2](#A978-1-4842-0310-1_6_Chapter.html#Fig2)).
    You can also open the Editor/Debugger by right-clicking on the Current Directory
    window and choosing New ➤ M-file from the resulting pop-up menu (Figure [6-4](#A978-1-4842-0310-1_6_Chapter.html#Fig4)).
    Using the menu option Open, you can open an existing M-file. You can open several
    M-files simultaneously, each of which will appear in a different window.


    ![A978-1-4842-0310-1_6_Fig4_HTML.jpg](A978-1-4842-0310-1_6_Fig4_HTML.jpg)


    Figure 6-4.


    ![A978-1-4842-0310-1_6_Fig3_HTML.jpg](A978-1-4842-0310-1_6_Fig3_HTML.jpg)


    Figure 6-3.


