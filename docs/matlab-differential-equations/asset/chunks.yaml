- fmt: "# Partial Differential Equations\n\nMATLAB's Basic module has features that\
    \ enable you to solve partial differential equations and systems of partial differential\
    \ equations with initial boundary conditions. The basic function used to calculate\
    \ the solutions is `pedepe`, and the basic function used to evaluate these solutions\
    \ is `pdeval`.\n\nThe syntax of the function `pedepe` is as follows:\n\n```\n\
    Sol = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan)\nSol = pdepe(m, pdefun, icfun,\
    \ bcfun, xmesh, tspan, options)\nSun = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan,\
    \ options, p1, p2...)\n```\n\nThe parameter `m` takes the value 0, 1 or 2 according\
    \ to the nature of the symmetry of the problem (block, cylindrical or spherical,\
    \ respectively). The argument `pdefun` defines the components of the differential\
    \ equation, `icfun` defines the initial conditions, `bcfun` defines the boundary\
    \ conditions, `xmesh` and `tspan` are vectors `[x[0], x[1], ..., x[n]]` and `[t[0],\
    \ t[1], ..., t[f]]` that specify the points at which a numerical solution is requested\
    \ (n, f ≥ 3), `options` specifies some calculation options of the underlying solver\
    \ (`RelTol`, `AbsTol`, `NormControl`, `InitialStep` and `MaxStep` to specify relative\
    \ tolerance, absolute tolerance, norm tolerance, initial step and max step, respectively)\
    \ and `p1`, `p2`, ... are parameters to pass to the functions `pdefun`, `icfun`\
    \ and `bcfun`.\n\n`pdepe` solves partial differential equations of the form:\n\
    \n![A978-1-4842-0310-1_7_Figi_HTML.jpg](A978-1-4842-0310-1_7_Figi_HTML.jpg)\n\n\
    where a ≤ x ≤ b and t[0] ≤ t ≤ t[f]. Moreover, for t = t[0] and for all x the\
    \ solution components meet the initial conditions:\n\n![A978-1-4842-0310-1_7_Figj_HTML.jpg](A978-1-4842-0310-1_7_Figj_HTML.jpg)\n\
    \nand for all t and each x = a or x = b, the solution components satisfy the boundary\
    \ conditions of the form:\n\n![A978-1-4842-0310-1_7_Figk_HTML.jpg](A978-1-4842-0310-1_7_Figk_HTML.jpg)\n\
    \nIn addition, we have that `a = xmesh(1)`, `b = xmesh(end)`, `tspan(1) = t[0]`\
    \ and `tspan(end) = t[f]`. Moreover `pdefun` finds the terms c, f and s of the\
    \ partial differential equation, so that:\n\n```\n[c, f, s] = pdefun(x, t, u,\
    \ dudx)\n```\n\nSimilarly `icfun` evaluates the initial conditions:\n\n```\nu\
    \ = icfun(x)\n```\n\nFinally, `bcfun` evaluates the terms p and q of the boundary\
    \ conditions:\n\n```\n[pl, ql, pr, qr] = bcfun(xl, ul, xr, ur, t)\n```\n\nAs a\
    \ first example we solve the following partial differential equation (x ∈ [0,1]\
    \ and t ≥ 0):\n\n![A978-1-4842-0310-1_7_Figl_HTML.jpg](A978-1-4842-0310-1_7_Figl_HTML.jpg)\n\
    \nsatisfying the initial condition:\n\n![A978-1-4842-0310-1_7_Figm_HTML.jpg](A978-1-4842-0310-1_7_Figm_HTML.jpg)\n\
    \nand the boundary conditions:\n\n![A978-1-4842-0310-1_7_Fign_HTML.jpg](A978-1-4842-0310-1_7_Fign_HTML.jpg)\n\
    \nWe begin by defining functions in M-files as shown in Figures [7-6](#A978-1-4842-0310-1_7_Chapter.html#Fig6)\
    \ to [7-8](#A978-1-4842-0310-1_7_Chapter.html#Fig8).\n\n![A978-1-4842-0310-1_7_Fig8_HTML.jpg](A978-1-4842-0310-1_7_Fig8_HTML.jpg)\n\
    \nFigure 7-8.\n\n![A978-1-4842-0310-1_7_Fig7_HTML.jpg](A978-1-4842-0310-1_7_Fig7_HTML.jpg)\n\
    \nFigure 7-7.\n\n![A978-1-4842-0310-1_7_Fig6_HTML.jpg](A978-1-4842-0310-1_7_Fig6_HTML.jpg)\n\
    \nFigure 7-6.\n\nOnce the support functions have been defined, we define the function\
    \ that solves the equation (see the M-file in Figure [7-9](#A978-1-4842-0310-1_7_Chapter.html#Fig9)).\n\
    \n![A978-1-4842-0310-1_7_Fig9_HTML.jpg](A978-1-4842-0310-1_7_Fig9_HTML.jpg)\n\n\
    Figure 7-9.\n\nTo view the solution (Figures [7-10](#A978-1-4842-0310-1_7_Chapter.html#Fig10)\
    \ and [7-11](#A978-1-4842-0310-1_7_Chapter.html#Fig11)), we enter the following\
    \ into the MATLAB Command Window:\n\n```\n>> pdex1\n```\n\n![A978-1-4842-0310-1_7_Fig11_HTML.jpg](A978-1-4842-0310-1_7_Fig11_HTML.jpg)\n\
    \nFigure 7-11.\n\n![A978-1-4842-0310-1_7_Fig10_HTML.jpg](A978-1-4842-0310-1_7_Fig10_HTML.jpg)\n\
    \nFigure 7-10.\n\nAs a second example we solve the following system of partial\
    \ differential equations (x ∈ [0,1] and t ≥ 0):\n\n![A978-1-4842-0310-1_7_Figo_HTML.jpg](A978-1-4842-0310-1_7_Figo_HTML.jpg)\n\
    \n![A978-1-4842-0310-1_7_Figp_HTML.jpg](A978-1-4842-0310-1_7_Figp_HTML.jpg)\n\n\
    satisfying the initial conditions:\n\n![A978-1-4842-0310-1_7_Figq_HTML.jpg](A978-1-4842-0310-1_7_Figq_HTML.jpg)\n\
    \nand the boundary conditions:\n\n![A978-1-4842-0310-1_7_Figr_HTML.jpg](A978-1-4842-0310-1_7_Figr_HTML.jpg)\n\
    \nTo conveniently use the function `pdepe`, the system can be written as:\n\n\
    ![A978-1-4842-0310-1_7_Figs_HTML.jpg](A978-1-4842-0310-1_7_Figs_HTML.jpg)\n\n\
    The left boundary condition can be written as:\n\n![A978-1-4842-0310-1_7_Figt_HTML.jpg](A978-1-4842-0310-1_7_Figt_HTML.jpg)\n\
    \nand the right boundary condition can be written as:\n\n![A978-1-4842-0310-1_7_Figu_HTML.jpg](A978-1-4842-0310-1_7_Figu_HTML.jpg)\n\
    \nWe start by defining the functions in M-files as shown in Figures [7-12](#A978-1-4842-0310-1_7_Chapter.html#Fig12)\
    \ to [7-14](#A978-1-4842-0310-1_7_Chapter.html#Fig14).\n\n![A978-1-4842-0310-1_7_Fig14_HTML.jpg](A978-1-4842-0310-1_7_Fig14_HTML.jpg)\n\
    \nFigure 7-14.\n\n![A978-1-4842-0310-1_7_Fig13_HTML.jpg](A978-1-4842-0310-1_7_Fig13_HTML.jpg)\n\
    \nFigure 7-13.\n\n![A978-1-4842-0310-1_7_Fig12_HTML.jpg](A978-1-4842-0310-1_7_Fig12_HTML.jpg)\n\
    \nFigure 7-12.\n\nOnce the support functions are defined, the function that solves\
    \ the system of equations is given by the M-file shown in Figure [7-15](#A978-1-4842-0310-1_7_Chapter.html#Fig15).\n\
    \n![A978-1-4842-0310-1_7_Fig15_HTML.jpg](A978-1-4842-0310-1_7_Fig15_HTML.jpg)\n\
    \nFigure 7-15.\n\nTo view the solution (Figures [7-16](#A978-1-4842-0310-1_7_Chapter.html#Fig16)\
    \ and [7-17](#A978-1-4842-0310-1_7_Chapter.html#Fig17)), we enter the following\
    \ in the MATLAB Command Window:\n\n```\n>> pdex4\n```\n\n![A978-1-4842-0310-1_7_Fig17_HTML.jpg](A978-1-4842-0310-1_7_Fig17_HTML.jpg)\n\
    \nFigure 7-17.\n\n![A978-1-4842-0310-1_7_Fig16_HTML.jpg](A978-1-4842-0310-1_7_Fig16_HTML.jpg)\n\
    \nFigure 7-16.\n\n## EXERCISE 7-1\n\nSolve the following Van der Pol system of\
    \ equations:\n\n![A978-1-4842-0310-1_7_Figv_HTML.jpg](A978-1-4842-0310-1_7_Figv_HTML.jpg)\n\
    \nWe begin by defining a function named `vdp100` in an M-file, where we will store\
    \ the equations of the system. This function begins by defining a vector column\
    \ with two empty rows which are subsequently assigned the components which make\
    \ up the equation (Figure [7-18](#A978-1-4842-0310-1_7_Chapter.html#Fig18)).\n\
    \n![A978-1-4842-0310-1_7_Fig18_HTML.jpg](A978-1-4842-0310-1_7_Fig18_HTML.jpg)\n\
    \nFigure 7-18.\n\nWe then solve the system and plot the solution `y[1] = y[1](t)`\
    \ given by the first column (Figure [7-19](#A978-1-4842-0310-1_7_Chapter.html#Fig19))\
    \ by typing the following into the Command Window:\n\n```\n>> [T, Y] = ode15s(@vdp1000,[0\
    \ 3000],[2 0]);\n>> plot(T, Y(:,1),'-')\n```\n\n![A978-1-4842-0310-1_7_Fig20_HTML.jpg](A978-1-4842-0310-1_7_Fig20_HTML.jpg)\n\
    \nFigure 7-20.\n\n![A978-1-4842-0310-1_7_Fig19_HTML.jpg](A978-1-4842-0310-1_7_Fig19_HTML.jpg)\n\
    \nFigure 7-19.\n\nSimilarly we plot the solution `y[2] = y[2](t)` (Figure [7-20](#A978-1-4842-0310-1_7_Chapter.html#Fig20))\
    \ by using the syntax:\n\n```\n>> plot(T, Y(:,2),'-')\n```\n\n## EXERCISE 7-2\n\
    \nGiven the following differential equation\n\n![A978-1-4842-0310-1_7_Figw_HTML.jpg](A978-1-4842-0310-1_7_Figw_HTML.jpg)\n\
    \nsubject to the boundary conditions `y(0) = 1`, `y'(0) = 0`, `y'(π) = 0`, find\
    \ a solution for `q = 5` and `λ = 15` based on an initial solution defined on\
    \ 10 equally spaced points in the interval `[0, π]` and graph the first component\
    \ of the solution on 100 equally spaced points in the interval `[0, π]`.\n\nThe\
    \ given equation is equivalent to the following system of first order differential\
    \ equations:\n\n![A978-1-4842-0310-1_7_Figx_HTML.jpg](A978-1-4842-0310-1_7_Figx_HTML.jpg)\n\
    \nwith the following boundary conditions:\n\n![A978-1-4842-0310-1_7_Figy_HTML.jpg](A978-1-4842-0310-1_7_Figy_HTML.jpg)\n\
    \nThe system of equations is introduced in the M-file shown in Figure [7-21](#A978-1-4842-0310-1_7_Chapter.html#Fig21),\
    \ the boundary conditions are given in the M-file shown in Figure [7-22](#A978-1-4842-0310-1_7_Chapter.html#Fig22),\
    \ and the M-file in Figure [7-23](#A978-1-4842-0310-1_7_Chapter.html#Fig23) sets\
    \ up the initial solution.\n\n![A978-1-4842-0310-1_7_Fig23_HTML.jpg](A978-1-4842-0310-1_7_Fig23_HTML.jpg)\n\
    \nFigure 7-23.\n\n![A978-1-4842-0310-1_7_Fig22_HTML.jpg](A978-1-4842-0310-1_7_Fig22_HTML.jpg)\n\
    \nFigure 7-22.\n\n![A978-1-4842-0310-1_7_Fig21_HTML.jpg](A978-1-4842-0310-1_7_Fig21_HTML.jpg)\n\
    \nFigure 7-21.\n\nThe initial solution for `λ = 15` and 10 equally spaced points\
    \ in `[0, π]` is calculated using the following MATLAB syntax:\n\n```\n>> lambda\
    \ = 15;\nsolinit = bvpinit(linspace(0,pi,10), @mat4init, lambda);\n```\n\nThe\
    \ numerical solution of the system is calculated using the following syntax:\n\
    \n```\n>> sol = bvp4c(@mat4ode,@mat4bc,solinit);\n```\n\nTo graph the first component\
    \ on 100 equally spaced points in the interval `[0, π]` we use the following syntax:\n\
    \n```\n>> xint = linspace(0,pi);\nSxint = bvpval(ground, xint);\nplot(xint, Sxint(1,:)))\n\
    axis([0 pi -1 1.1])\nxlabel('x')\nylabel('solution y')\n```\n\nThe result is shown\
    \ in Figure [7-24](#A978-1-4842-0310-1_7_Chapter.html#Fig24).\n\n![A978-1-4842-0310-1_7_Fig24_HTML.jpg](A978-1-4842-0310-1_7_Fig24_HTML.jpg)\n\
    \nFigure 7-24.\n\n## EXERCISE 7-3\n\nSolve the following differential equation\n\
    \n![A978-1-4842-0310-1_7_Figz_HTML.jpg](A978-1-4842-0310-1_7_Figz_HTML.jpg)\n\n\
    in the interval `[0,20]`, taking as initial solution `y = 2`, `y' = 0`. Solve\
    \ the more general equation\n\n![A978-1-4842-0310-1_7_Figaa_HTML.jpg](A978-1-4842-0310-1_7_Figaa_HTML.jpg)\n\
    \nThe general equation above is equivalent to the following system of first-order\
    \ linear equations:\n\n![A978-1-4842-0310-1_7_Figbb_HTML.jpg](A978-1-4842-0310-1_7_Figbb_HTML.jpg)\n\
    \nwhich is defined for `µ = 1` in the M-file shown in Figure [7-25](#A978-1-4842-0310-1_7_Chapter.html#Fig25).\n\
    \n![A978-1-4842-0310-1_7_Fig25_HTML.jpg](A978-1-4842-0310-1_7_Fig25_HTML.jpg)\n\
    \nFigure 7-25.\n\nTaking the initial solution `y[1] = 2` and `y[2] = 0` in the\
    \ interval `[0, 20]`, we can solve the system using the following MATLAB syntax:\n\
    \n```\n>> [t, y] = ode45(@vdp1,[0 20],[2; 0])\nt =\n         0\n    0.0000\n \
    \   0.0001\n    0.0001\n    0.0001\n    0.0002\n    0.0004\n    0.0005\n    0.0006\n\
    \    0.0012\n      .\n      .\n   19.9559\n   19.9780\n   20.0000\n\ny =\n   \
    \ 2.0000         0\n    2.0000   -0.0001\n    2.0000   -0.0001\n    2.0000   -0.0002\n\
    \    2.0000   -0.0002\n    2.0000   -0.0005\n      .\n      .\n    1.8729    1.0366\n\
    \    1.9358    0.7357\n    1.9787    0.4746\n    2.0046    0.2562\n    2.0096\
    \    0.1969\n    2.0133    0.1413\n    2.0158    0.0892\n    2.0172    0.0404\n\
    ```\n\nWe can graph the solutions using the following syntax (see Figure [7-26](#A978-1-4842-0310-1_7_Chapter.html#Fig26)):\n\
    \n```\n>> plot(t, y(:,1),'-', t, y(:,2),'-')\n>> xlabel('time t')\n>> ylabel('solution\
    \ y')\n>> legend('y_1', 'y_2')\n```\n\n![A978-1-4842-0310-1_7_Fig26_HTML.jpg](A978-1-4842-0310-1_7_Fig26_HTML.jpg)\n\
    \nFigure 7-26.\n\nTo solve the general system with the parameter `µ`, we define\
    \ the system in the M-file shown in Figure [7-27](#A978-1-4842-0310-1_7_Chapter.html#Fig27).\n\
    \n![A978-1-4842-0310-1_7_Fig27_HTML.jpg](A978-1-4842-0310-1_7_Fig27_HTML.jpg)\n\
    \nFigure 7-27.\n\nNow we can graph the first solution `y[1] = 2` and `y[2] = 0`\
    \ corresponding to `µ = 1000` in the interval `[0,1500]` using the following syntax\
    \ (see Figure [7-28](#A978-1-4842-0310-1_7_Chapter.html#Fig28)):\n\n```\n>> [t,\
    \ y] = ode15s(@vdp2,[0 1500],[2; 0],[],1000);\n>> xlabel('time t')\n>> ylabel('solution\
    \ y_1')\n```\n\n![A978-1-4842-0310-1_7_Fig29_HTML.jpg](A978-1-4842-0310-1_7_Fig29_HTML.jpg)\n\
    \nFigure 7-29.\n\n![A978-1-4842-0310-1_7_Fig28_HTML.jpg](A978-1-4842-0310-1_7_Fig28_HTML.jpg)\n\
    \nFigure 7-28.\n\nTo graph the first solution `y[1] = 2` and `y[2] = 0` for another\
    \ value of the parameter, for example `µ = 100`, in the interval `[0,1500]`, we\
    \ use the following syntax (see Figure [7-29](#A978-1-4842-0310-1_7_Chapter.html#Fig29)):\n\
    \n```\n>> [t, y] = ode15s(@vdp2,[0 1500],[2; 0],[],100);\n>> plot(t, y(:,1),'-');\n\
    ```"
  raw: '## Partial Differential Equations


    MATLAB’s Basic module has features that enable you to solve partial differential
    equations and systems of partial differential equations with initial boundary
    conditions. The basic function used to calculate the solutions is pedepe, and
    the basic function used to evaluate these solutions is pdeval.


    The syntax of the function pedepe is as follows:


    `Sol = pdepe (m, pdefun, icfun, bcfun, xmesh, tspan)`


    `Sol = pdepe (m, pdefun, icfun, bcfun, xmesh, tspan, options)`


    `Sun = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan, options, p1, p2...)`


    The parameter m takes the value 0, 1 or 2 according to the nature of the symmetry
    of the problem (block, cylindrical or spherical, respectively). The argument pdefun
    defines the components of the differential equation, icfun defines the initial
    conditions, bcfun defines the boundary conditions, xmesh and tspan are vectors
    [x [0], x [1],...,x [n]] and [t [0], t [1],...,t [f]] that specify the points
    at which a numerical solution is requested (n, f ³3), options specifies some calculation
    options of the underlying solver (`RelTol`, `AbsTol,NormControl`, `InitialStep`
    and `MaxStep` to specify relative tolerance, absolute tolerance, norm tolerance,
    initial step and max step, respectively) and p1, p2,... are parameters to pass
    to the functions pdefun, icfun and bcfun.


    pdepe solves partial differential equations of the form:


    ![A978-1-4842-0310-1_7_Figi_HTML.jpg](A978-1-4842-0310-1_7_Figi_HTML.jpg)


    where a≤x≤b and t [0]≤t≤ t [f]. Moreover, for t = t [0] and for all x the solution
    components meet the initial conditions:


    ![A978-1-4842-0310-1_7_Figj_HTML.jpg](A978-1-4842-0310-1_7_Figj_HTML.jpg)


    and for all t and each x = a or x = b, the solution components satisfy the boundary
    conditions of the form:


    ![A978-1-4842-0310-1_7_Figk_HTML.jpg](A978-1-4842-0310-1_7_Figk_HTML.jpg)


    In addition, we have that a `= xmesh (1), b = xmesh (end), tspan (1) =` t [0]
    and `tspan (end) =` t [f]. Moreover pdefun finds the terms c, f and s of the partial
    differential equation, so that:


    `[c, f, s] = pdefun (x, t, u, dudx)`


    Similiarly icfun evaluates the initial conditions


    `u = icfun (x)`


    Finally, bcfun evaluates the terms p and q of the boundary conditions:


    `[pl, ql, pr, qr] = bcfun (xl, ul, xr, ur, t)`


    As a first example we solve the following partial differential equation (xÎ[0,1]
    and t≥0):


    ![A978-1-4842-0310-1_7_Figl_HTML.jpg](A978-1-4842-0310-1_7_Figl_HTML.jpg)


    satisfying the initial condition:


    ![A978-1-4842-0310-1_7_Figm_HTML.jpg](A978-1-4842-0310-1_7_Figm_HTML.jpg)


    and the boundary conditions:


    ![A978-1-4842-0310-1_7_Fign_HTML.jpg](A978-1-4842-0310-1_7_Fign_HTML.jpg)


    We begin by defining functions in M-files as shown in Figures [7-6](#A978-1-4842-0310-1_7_Chapter.html#Fig6)
    to [7-8](#A978-1-4842-0310-1_7_Chapter.html#Fig8).


    ![A978-1-4842-0310-1_7_Fig8_HTML.jpg](A978-1-4842-0310-1_7_Fig8_HTML.jpg)


    Figure 7-8.


    ![A978-1-4842-0310-1_7_Fig7_HTML.jpg](A978-1-4842-0310-1_7_Fig7_HTML.jpg)


    Figure 7-7.


    ![A978-1-4842-0310-1_7_Fig6_HTML.jpg](A978-1-4842-0310-1_7_Fig6_HTML.jpg)


    Figure 7-6.


    Once the support functions have been defined, we define the function that solves
    the equation (see the M-file in Figure [7-9](#A978-1-4842-0310-1_7_Chapter.html#Fig9)).


    ![A978-1-4842-0310-1_7_Fig9_HTML.jpg](A978-1-4842-0310-1_7_Fig9_HTML.jpg)


    Figure 7-9.


    To view the solution (Figures [7-10](#A978-1-4842-0310-1_7_Chapter.html#Fig10)
    and [7-11](#A978-1-4842-0310-1_7_Chapter.html#Fig11)), we enter the following
    into the MATLAB Command Window:


    `>> pdex1`


    ![A978-1-4842-0310-1_7_Fig11_HTML.jpg](A978-1-4842-0310-1_7_Fig11_HTML.jpg)


    Figure 7-11.


    ![A978-1-4842-0310-1_7_Fig10_HTML.jpg](A978-1-4842-0310-1_7_Fig10_HTML.jpg)


    Figure 7-10.


    As a second example we solve the following system of partial differential equations
    (xÎ[0,1] and t ≥ 0):


    ![A978-1-4842-0310-1_7_Figo_HTML.jpg](A978-1-4842-0310-1_7_Figo_HTML.jpg)


    ![A978-1-4842-0310-1_7_Figp_HTML.jpg](A978-1-4842-0310-1_7_Figp_HTML.jpg)


    satisfying the initial conditions:


    ![A978-1-4842-0310-1_7_Figq_HTML.jpg](A978-1-4842-0310-1_7_Figq_HTML.jpg)


    and the boundary conditions:


    ![A978-1-4842-0310-1_7_Figr_HTML.jpg](A978-1-4842-0310-1_7_Figr_HTML.jpg)


    To conveniently use the function pdepe, the system can be written as:


    ![A978-1-4842-0310-1_7_Figs_HTML.jpg](A978-1-4842-0310-1_7_Figs_HTML.jpg)


    The left boundary condition can be written as:


    ![A978-1-4842-0310-1_7_Figt_HTML.jpg](A978-1-4842-0310-1_7_Figt_HTML.jpg)


    and the right boundary condition can be written as:


    ![A978-1-4842-0310-1_7_Figu_HTML.jpg](A978-1-4842-0310-1_7_Figu_HTML.jpg)


    We start by defining the functions in M-files as shown in Figures [7-12](#A978-1-4842-0310-1_7_Chapter.html#Fig12)
    to [7-14](#A978-1-4842-0310-1_7_Chapter.html#Fig14).


    ![A978-1-4842-0310-1_7_Fig14_HTML.jpg](A978-1-4842-0310-1_7_Fig14_HTML.jpg)


