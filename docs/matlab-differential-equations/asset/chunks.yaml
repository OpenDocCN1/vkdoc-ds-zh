    \ (modified Bessel equation)\n\nMATLAB implements the following related functions:\n\
    \n*   `Ai(z)` and `Bi(z)` are the linearly independent solutions of the Airy differential\
    \ equation.\n*   `BesselJ(n,z)` and `BesselY(n,z)` are the linearly independent\
