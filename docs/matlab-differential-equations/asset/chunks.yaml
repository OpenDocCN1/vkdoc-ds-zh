    there is a maximum and at the point with abscissa ![A978-1-4842-0310-1_8_Figuu_HTML.jpg](A978-1-4842-0310-1_8_Figuu_HTML.jpg)
    there is a minimum. At `x = 0` we know nothing:


    ```

    >> [numeric (subs (f, sqrt (3))), numeric (subs (f, - sqrt (3)))]

