    ---------\nsin (2 x)\n```\n\nThis derivative can be simplified:\n\n```matlab\n\
    >> pretty(simple(diff('log(sin(2*x))','x')))\n```\n\n```\n2\n--------\ntan(2 x)\n\
    ```\n\nIn the following example we calculate the first, second, third and fourth\
    \ derivatives of the function `f(x) = 1 /x`.\n\n```matlab\n>> f='1/x';\n[diff(f),diff(f,2),diff(f,3),diff(f,4),diff(f,5)]\n\
    ```\n\n```\nans =\n[-1/x ^ 2, 2/x ^ 3, - 6/x ^ 4, 24/x ^ 5, - 120/x ^ 6]\n```\n\
    \nThen, given the function `f(x, y) = sin(xy) + cos(xy²)`, we calculate the following\
    \ partial derivatives:\n`∂f/∂x`, `∂f/∂y`, `∂²f/∂x²`, `∂²f/∂y²`, `∂²f/∂x∂y`, `∂²f/∂y∂x`\
    \ and `∂⁴f/∂²x∂²y`.\n\n```matlab\n>> syms x y\n>> f = sin(x*y) + cos(x*y^2)\n\
    ```\n\n```\nf =\nsin(x*y) + cos(x*y^2)\n```\n\n```matlab\n>> diff(f,x)\n```\n\n\
    ```\nans =\ncos(x*y) *-sin(x*y^2) * y ^ 2\n```\n\n```matlab\n>> diff(f,y)\n```\n\
    \n```\nans =\ncos(x*y) * x-2 * sin(x*y^2) * x * y\n```\n\n```matlab\n>> diff(diff(f,x),x)\n\
    ```\n\n```\nans =\n-sin(x*y) * y ^ 2-cos(x*y^2) * y ^ 4\n```\n\n```matlab\n>>\
    \ diff (diff(f,y), y)\n```\n\n```\nans =\n-sin(x*y) * x ^ 2-4 * cos(x*y^2) * x\
    \ ^ 2 * y ^ 2-2 * sin(x*y^2) * x\n```\n\n```matlab\n>> diff(diff(f,x),y)\n```\n\
    \n```\nans =\n-sin(x*y) * x * y + cos(x*y)-2 * cos(x*y^2) * x * y ^ 3-2 * sin(x*y^2)\
    \ * y\n```\n\n```matlab\n>> diff(diff(f,y),x)\n```\n\n```\nans =\n-sin(x*y) *\
    \ x * y + cos(x*y)-2 * cos(x*y^2) * x * y ^ 3-2 * sin(x*y^2) * y\n```\n\n```matlab\n\
    >> diff(diff(diff(diff(f,x),x),y,y))\n```\n\n```\nans =\nsin(x*y) * y ^ 3 * x-3\
    \ * cos(x*y) * y ^ 2 + 2 * cos(x*y^2) * y ^ 7 * x + 6 * sin(x*y^2) * y ^ 5\n```\n\
    \nNext we find the Taylor series up to order 10 of the function `1/(2-x)` in a\
    \ neighborhood of the point `x=1`:\n\n```matlab\n>> syms x\n>> f=1/(2-x)\n```\n\
    \n```\nf =\n1/(2-x)\n```\n\n```matlab\n>> pretty(taylor(f,11,x,1))\n```\n\n```\n\
    2          3          4          5          6          7\nx + (x - 1)  + (x -\
    \ 1)  + (x - 1)  + (x - 1)  + (x - 1)  + (x - 1)\n8          9          10\n+\
    \ (x - 1)  + (x - 1)  + (x - 1)\n```\n\nThe following example computes the integral\
    \ ![A978-1-4842-0310-1_8_Figaa_HTML.jpg](A978-1-4842-0310-1_8_Figaa_HTML.jpg).\n\
    \n```matlab\n>> int('1/(x^2-1)','x')\n```\n\n```\nans =\n-atanh (x)\n```\n\nThe\
    \ following example estimates the integral ![A978-1-4842-0310-1_8_Figbb_HTML.jpg](A978-1-4842-0310-1_8_Figbb_HTML.jpg)\
    \ for arbitrary parameters `a` and `b`.\n\n```matlab\n>> syms x a b, pretty(simple(int(a*log(1+b*x),x)))\n\
    ```\n\n```\na (log(1 + b x) - 1) (1 + b x)\n------------------------------\n \
    \             b\n```\n\nThe following example computes the double integral ![A978-1-4842-0310-1_8_Figcc_HTML.jpg](A978-1-4842-0310-1_8_Figcc_HTML.jpg)\
    \ where `a` is an arbitrary parameter.\n\n```matlab\n>> syms x a b, pretty(simple(int(int(a*log(1+b*x),x),b)))\n\
    ```\n\n```\na (-dilog(1 + b x) + log(1 + b x) + log(1 + b x) x b - 1 - 2 b x -\
    \ log(b))\n```\n\nThe following example computes the triple integral ![A978-1-4842-0310-1_8_Figdd_HTML.jpg](A978-1-4842-0310-1_8_Figdd_HTML.jpg).\n\
    \n```matlab\n>> syms x a b, pretty(simple(int(int(int(a*log(1+b*x),x),b),a)))\n\
    ```\n\n```\n2\n1/2a(-dilog(1 + b x) + log(1 + b x) + log(1 + b x) x b - 1 - 2\
    \ b x - log(b))\n```\n\nWe calculate ![A978-1-4842-0310-1_8_Figee_HTML.jpg](A978-1-4842-0310-1_8_Figee_HTML.jpg).\n\
    \n```matlab\n>> syms x a b, pretty (simple (int (a * log(1+b*x), x, 0, 1)))\n\
    ```\n\n```\nab + log(1+b)+ b log (1+b) – b\n------------------------------\n \
    \             b\n```\n\nThe following example computes ![A978-1-4842-0310-1_8_Figff_HTML.jpg](A978-1-4842-0310-1_8_Figff_HTML.jpg),\
    \ where `a` is an arbitrary parameter.\n\n```matlab\n>> syms x a b, pretty(simple(int(int(a*log(1+b*x),x,0,1),b,2,3)))\n\
    ```\n\n```\na (8 log (2) - 2 - dilog (4) - 3 log (3) + dilog (3))\n```\n\nIn the\
    \ following example we solve the first order first degree differential equation\
    \ `y'(t) = ay(t)` where `a` is an arbitrary parameter.\n\n```matlab\n>> pretty(dsolve('Dy\
    \ = a*y'))\n```\n\n```\nC1 exp (a t)\n```\n\nThus we see that the family of solutions\
    \ turns out to be `y(t) = c[1] e^{at}`.\n\nNow we solve the above differential\
    \ equation with the initial condition `y(0) = b`.\n\n```matlab\n>> pretty(dsolve('Dy\
    \ = a*y', 'y(0) = b'))\n```\n\n```\nb exp (a t)\n```\n\nNext we solve the first\
    \ order second degree differential equation `y'²(s) + y²(s) = 1` with the initial\
    \ condition `y(0) = 0`.\n\n```matlab\n>> y = dsolve ('(Dy) ^ 2 + y ^ 2 = 1', 'y(0)\
    \ = 0', 's')\n```\n\n```\ny =\n[-sin (s)]\n[ sin (s)]\n```\n\nNow we solve the\
    \ second order first degree differential equation `y\"(t) = a²y'(t)` with the\
    \ initial conditions `y(0) = 1` and `y'(π/a) = 0`.\n\n```matlab\n>> pretty (dsolve\
    \ ('D2y = - a ^ 2 * y ', 'y(0) = 1, Dy (pi/a) = 0'))\n```\n\n```\ncos (a t)\n\
    ```\n\nTherefore, the solution is the function `y(t) = cos(at)`.\n\nIn the following\
    \ example we solve the system of equations: `x'(t) = y(t)`, `y'(t) = -x(t)`.\n\
    \n```matlab\n>> [x, y] = dsolve('Dx = y', 'Dy =-x')\n```\n\n```\nx =\ncos (t)\
    \ * C1 + sin (t) * C2\ny =\n-sin (t) * C1 + cos (t) * C2\n```\n\nNext we calculate\
    \ the solution of the previous system of differential equations for the initial\
    \ conditions `x(0) = 0` and `y(0) = 1`.\n\n```matlab\n>> [x, y] = dsolve ('Dx\
    \ = y, Dy = - x', 'x (0) = 0, y (0) = 1')\n```\n\n```\nx =\nsin (t)\ny =\ncos\
    \ (t)\n```"
