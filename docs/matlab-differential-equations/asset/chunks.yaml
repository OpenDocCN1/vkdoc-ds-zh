    ```


    ```

    >> limit(x^3/(x^2-1)-x,x,inf)

    ```


    ```

    ans =

    0

    ```


    The line `y = x` is an oblique asymptote. Now we will analyze the maxima and minima,
    inflection points and intervals of concavity and growth of the function:


    ```

    >> solve (diff (f))

    ```


    ```

    ans =

    [       0]

