- fmt: "# Ordinary Differential Equations with Initial Values\n\nAn ordinary differential\
    \ equation contains one or more derivatives of the dependent variable `y` with\
    \ respect to the independent variable `t`. A first order ordinary differential\
    \ equation with an initial value for the independent variable can be represented\
    \ as:\n\n![A978-1-4842-0310-1_7_Figa_HTML.jpg](A978-1-4842-0310-1_7_Figa_HTML.jpg)\n\
    \nThe previous problem can be generalized to the case where `y` is a vector, `y\
    \ = (y[1], y[2], …, y[n])`.\n\nMATLAB’s Basic module commands relating to ordinary\
