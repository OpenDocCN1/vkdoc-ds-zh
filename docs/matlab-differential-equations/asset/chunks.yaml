  trans: '

    ### 数据可视化


    `MATLAB` 提供了可视化科学与工程数据所需的所有图形功能。这包括用于二维和三维图形的工具、三维体可视化工具、交互式创建图形的工具，以及使用最流行图形格式进行导出的能力。用户可以自定义图形，例如添加多个坐标轴、更改线条和标记的颜色、添加注释、`LaTeX`
    方程和图例，以及绘制路径。


    可以创建各种向量数据的二维图形表示，包括：


    *   折线图、面积图、条形图和扇形图

    *   方向图和速度图

    *   直方图

    *   多边形和曲面图

    *   散点气泡图

    *   动画


    图 1-6 显示了某发动机多次排放测试结果的线性图，并带有一条拟合数据的曲线。


    ![A978-1-4842-0310-1_1_Fig6_HTML.jpg](img/A978-1-4842-0310-1_1_Fig6_HTML.jpg)


    图 1-6.


    `MATLAB` 还提供了用于显示二维数组、三维标量数据和三维向量数据的函数。可以使用这些函数来可视化和理解大量复杂的多维数据。还可以定义图形的特性，例如相机方向、透视、光照、光源和透明度。三维图形功能包括：


    *   曲面图、等高线图和网格图

    *   空间曲线

    *   锥体图、相位图、流线图和等值面图


    图 1-7 显示了一个等值面的三维图形，揭示了富勒烯碳-60 分子的测地线结构。


    ![A978-1-4842-0310-1_1_Fig7_HTML.jpg](img/A978-1-4842-0310-1_1_Fig7_HTML.jpg)


    图 1-7.


    `MATLAB` 包含用于图形编辑和设计的交互式工具。在 `MATLAB` 图形中，您可以执行以下任意任务：


    *   将新的数据集拖放到图形中

    *   更改图形中任何对象的属性

    *   更改缩放、旋转、视图（即全景）、相机角度和光照

    *   添加数据标签和注释

    *   绘制形状

    *   生成可复用于不同数据的 `M-file`


    图 1-8 展示了一系列图形，这些图形是通过将数据集拖放到图形窗口、创建新的子图、更改颜色和字体等属性以及添加注释，以交互方式创建的。


    ![A978-1-4842-0310-1_1_Fig8_HTML.jpg](img/A978-1-4842-0310-1_1_Fig8_HTML.jpg)


    图 1-8.


    `MATLAB` 兼容所有知名的数据文件和图形格式，例如 `GIF`、`JPEG`、`BMP`、`EPS`、`TIFF`、`PNG`、`HDF`、`AVI`
    和 `PCX`。因此，可以将 `MATLAB` 图形导出到其他应用程序，例如 `Microsoft Word` 和 `Microsoft Powerpoint`，或桌面出版软件。在导出之前，您可以创建并应用包含所有设计细节、字体、线宽等的样式模板，以满足出版规范要求。


    ### 数值计算


    `MATLAB` 包含数学、统计和工程函数，支持这些领域中的大多数操作。这些函数由数学专家开发，是 `MATLAB` 语言的基础。举例来说，`MATLAB`
    在以下领域实现了数学函数和数据分析：


    *   矩阵运算与线性代数

    *   多项式与插值

    *   傅里叶分析与滤波

    *   统计与数据分析

    *   优化与数值积分

    *   常微分方程 (ODE)

    *   偏微分方程 (PDE)

    *   稀疏矩阵操作


    ### 结果发布与应用程序分发


    此外，`MATLAB` 包含许多允许您记录和共享工作的函数。您可以将 `MATLAB` 代码与其他语言和应用程序集成，并将您的算法和 `MATLAB` 应用程序作为独立的程序或软件模块进行分发。


    `MATLAB` 允许您以图形或完整报告的形式导出结果。您可以将图形导出为所有流行的图形格式，然后将其导入到其他软件包中，例如 `Microsoft Word`
    或 `Microsoft PowerPoint`。使用 `MATLAB Editor`，您可以自动将 `MATLAB` 代码发布为 `HTML` 格式、`Word`、`LaTeX`
    等。例如，图 1-9 显示了一个 `M-file`（左侧）使用 `MATLAB Editor` 发布成了 `HTML`（右侧）。发送到 `Command Window`
    或图形中的结果会被捕获并包含在文档中，注释则成为 `HTML` 中的标题和文本。


    ![A978-1-4842-0310-1_1_Fig9_HTML.jpg](img/A978-1-4842-0310-1_1_Fig9_HTML.jpg)


    图 1-9.


    可以使用 `MATLAB Report Generator`（另售）创建更复杂的报告，例如模拟执行和各种参数测试。


    `MATLAB` 提供了使您能够将 `MATLAB` 应用程序与 `C` 和 `C++` 代码、`FORTRAN` 代码、`COM` 对象以及 `Java`
    代码集成的函数。您可以调用 `DLLs`、`Java` 类和 `ActiveX` 控件。使用 `MATLAB engine` 库，您还可以从 `C`、`C++`
    或 `FORTRAN` 代码中调用 `MATLAB`。


    您可以在 `MATLAB` 中创建算法，并将其分发给其他 `MATLAB` 用户。使用 `MATLAB Compiler`（另售），算法可以分发给没有 `MATLAB`
    的用户，既可以作为独立应用程序，也可以作为包含在项目中的软件模块。其他附加产品能够将算法转换为可从 `COM` 或 `Microsoft Excel` 调用的软件模块。

