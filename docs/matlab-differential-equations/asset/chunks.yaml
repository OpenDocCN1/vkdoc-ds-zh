    Figure [6-14](#A978-1-4842-0310-1_6_Chapter.html#Fig14).


    ![A978-1-4842-0310-1_6_Fig14_HTML.jpg](A978-1-4842-0310-1_6_Fig14_HTML.jpg)


    Figure 6-14.


    Later, we might type the following in the command line:


    `>>global ALPHA BETA`


    `ALPHA = 0.01`


    `BETA = 0.02`


    These global values may then be used for α and β in the M-file lotka.m (without
    having to specify them). For example, we can generate the graph (Figure [6-15](#A978-1-4842-0310-1_6_Chapter.html#Fig15))
    with the following syntax:


    `>> [t, y] = ode23 (''lotka'', 0.10, [1; 1]); plot(t,y)`


    ![A978-1-4842-0310-1_6_Fig15_HTML.jpg](A978-1-4842-0310-1_6_Fig15_HTML.jpg)


    Figure 6-15.


    ## Data Types


    MATLAB has 14 different data types, summarized in Figure [6-16](#A978-1-4842-0310-1_6_Chapter.html#Fig16)
    below.


    ![A978-1-4842-0310-1_6_Fig16_HTML.jpg](A978-1-4842-0310-1_6_Fig16_HTML.jpg)


    Figure 6-16.


    Below are the different types of data:


    | Data Type | Example | Description |

    | --- | --- | --- |

    | `single` | `3* 10 ^ 38` | Simple numerical precision. This requires less storage
    than double precision, but it is less precise. This type of data should not be
    used in mathematical operations. |

    | `Double` | `3*10^300 5+6i` | Double numerical precision. This is the most commonly
    used data type in MATLAB. |

    | `sparse` | `speye(5)` | Sparse matrix with double precision. |

    | `int8, uint8, int16, uint16, int32, uint32` | `UInt8(magic (3))` | Integers
    and unsigned integers with 8, 16, and 32 bits. These make it possible to use entire
    amounts with efficient memory management. This type of data should not be used
    in mathematical operations. |

    | `char` | `''Hello''` | Characters (each character has a length of 16 bits).
    |

    | `cell` | `{17 ''hello'' eye (2)}` | Cell (contains data of similar size). |

    | `structure` | `a.day = 12; a.color = ''Red''; a.mat = magic(3);` | Structure
    (contains cells of similar size). |

    | `user class` | `inline(''sin (x)'')` | MATLAB class (built with functions) |

    | `java class` | `Java.awt.Frame` | Java class (defined in API or own) with Java.
    |

    | `function handle` | `@humps` | Manages functions in MATLAB. It can be last in
    a list of arguments and evaluated with feval. |


    ## Flow Control: FOR Loops, WHILE and IF ELSEIF


    The use of recursive functions, conditional operations and piecewise defined functions
    is very common in mathematics. The handling of loops is necessary for the definition
    of these types of functions. Naturally, the definition of the functions will be
    made via M-files.'
