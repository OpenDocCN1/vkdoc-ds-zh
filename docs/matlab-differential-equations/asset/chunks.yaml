    \ 文件中的主函数称为主函数，它正是调用该 M 文件的函数，但可以添加从属于主函数的子函数，这些子函数仅对主函数或同一 M 文件中的其他子函数可见。每个子函数都以自身的函数定义开头。示例如图\
    \ 6-24 所示。\n\n![A978-1-4842-0310-1_6_Fig24_HTML.jpg](img/A978-1-4842-0310-1_6_Fig24_HTML.jpg)\n\
    \n图 6-24.\n\n子函数 `mean` 和 `median` 计算输入列表的算术平均值和中位数。主函数 `newstats` 确定列表的长度 `n`，并以列表作为第一个参数、`n`\
    \ 作为第二个参数来调用子函数。执行主函数时，只需提供一个值列表作为输入，系统便会计算其算术平均值和中位数。子函数会自动执行，如下所示。\n\n```\n\
    >> [mean, median] = newstats ([10,20,3,4,5,6])\nmean =\n     8\nmedian =\n   \
    \ 5.5000\n```\n\n## 使用数值分析求解常微分方程\n\n求解常微分方程的精确解并非易事。有几种不同的方法可以获得常微分方程的近似解。这些数值方法包括（但不限于）欧拉法、休恩法、泰勒级数法、龙格-库塔法（在\
    \ MATLAB 基本模块中实现）、亚当斯-巴什福斯-莫尔顿法、米尔恩法和汉明法。\n\n### 欧拉法\n\n假设我们想要求解区间 `[a, b]` 上的微分方程\
    \ `y' = f(t, y)`，`y(a) = y[0]`。我们使用点 `t[k] = a + kh`，`k = 0,1,..., M`，`h = (b-a)/M`\
    \ 所给出的划分，将区间 `[a, b]` 划分为 `M` 个相同大小的子区间。然后欧拉法通过计算 `y[k+1] = y[k] + hf(t[k], y[k])`，`k\
    \ = 0,1, ..., M-1` 来迭代求解微分方程。\n\n欧拉法是使用图 6-25 所示的 M 文件实现的。\n\n![A978-1-4842-0310-1_6_Fig25_HTML.jpg](img/A978-1-4842-0310-1_6_Fig25_HTML.jpg)\n\
    \n图 6-25.\n\n### 休恩法\n\n假设我们想要求解区间 `[a, b]` 上的微分方程 `y' = f(t, y)`，`y(a) = y[0]`。我们使用点\
    \ `t[k] = a + kh`，`k = 0,1,..., M`，`h = (b-a)/M` 所给出的划分，将区间 `[a, b]` 划分为 `M` 个相同大小的子区间。然后休恩法通过计算\
    \ `y[k+1] = y[k] + h(f(t[k], y[k]) + f(t[k+1], y[k] + f(t[k], y[k])))/2`，`k =\
    \ 0,1,..., M-1` 来迭代求解微分方程。\n\n休恩法是使用图 6-26 所示的 M 文件实现的。\n\n![A978-1-4842-0310-1_6_Fig26_HTML.jpg](img/A978-1-4842-0310-1_6_Fig26_HTML.jpg)\n\
    \n图 6-26.\n"
- fmt: '# The Taylor Series Method


    Suppose we want to solve the differential equation `y'' = f(t, y)`, `y(a) = y[0]`,
    on the interval `[a, b]`. We divide the interval `[a, b]` into `M` subintervals
    of the same size using the partition given by the points `t[k] = a + kh`, `k =
    0, 1, ..., M`, `h = (b - a) / M`. The Taylor series method (let us consider here
    the method to order 4) finds a solution to the differential equation by evaluating
    `y''`, `y"`, `y"''` and `y""` to give the 4th order Taylor series for `y` at each
    partition point.


    The Taylor series method is implemented using the M-file shown in Figure [6-27](#A978-1-4842-0310-1_6_Chapter.html#Fig27).


    ![A978-1-4842-0310-1_6_Fig27_HTML.jpg](A978-1-4842-0310-1_6_Fig27_HTML.jpg)


    Figure 6-27.


    As an example we solve the differential equation `y''(t) = (t - y)/2` on the interval
    `[0, 3]`, with `y(0) = 1`, using Euler’s method, Heun’s method and by the Taylor
    series method.


    We will begin by defining the function `f(t, y)` via the M-file shown in Figure
    [6-28](#A978-1-4842-0310-1_6_Chapter.html#Fig28).


    ![A978-1-4842-0310-1_6_Fig28_HTML.jpg](A978-1-4842-0310-1_6_Fig28_HTML.jpg)


    Figure 6-28.


    The solution of the equation using Euler’s method in 100 steps is calculated as
    follows:


    ```

    >> E = euler(''dif1'',0,3,1,100)

    E =

    0 1.00000000000000

    0.03000000000000 0.98500000000000

    0.06000000000000 0.97067500000000

    0.09000000000000 0.95701487500000

    0.12000000000000 0.94400965187500

    0.15000000000000 0.93164950709688

    0.18000000000000 0.91992476449042

