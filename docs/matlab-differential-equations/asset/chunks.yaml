    \ Hilbert 矩阵，第二个计算所有小于 1000 的斐波那契数。\n\n```\n% 生成 n 阶 Hilbert 矩阵\nt = '1/(i+j-1)';\n\
    for i = 1:n\n    for j = 1:n\n        a(i,j) = eval(t);\n    end\nend\n\n% 计算斐波那契数\n\
    f = [1 1]; i = 1;\nwhile f(i) + f(i-1) < 1000\n    f(i+2) = f(i) + f(i+1);\n \
    \   i = i+1\nend\n```\n"
