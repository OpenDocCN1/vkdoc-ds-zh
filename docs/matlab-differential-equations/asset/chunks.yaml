    \n```\n2          3          4          5          6          7\nx + (x - 1) \
    \ + (x - 1)  + (x - 1)  + (x - 1)  + (x - 1)  + (x - 1)\n8          9        \
    \  10\n+ (x - 1)  + (x - 1)  + (x - 1)\n```\n\n下面的例子计算积分 ![A978-1-4842-0310-1_8_Figaa_HTML.jpg](img/A978-1-4842-0310-1_8_Figaa_HTML.jpg)。\n\
    \n```matlab\n>> int('1/(x²-1)','x')\n```\n\n```\nans =\n-atanh (x)\n```\n\n下面的例子估计带有任意参数\
    \ `a` 和 `b` 的积分 ![A978-1-4842-0310-1_8_Figbb_HTML.jpg](img/A978-1-4842-0310-1_8_Figbb_HTML.jpg)。\n\
    \n```matlab\n>> syms x a b, pretty(simple(int(a*log(1+b*x),x)))\n```\n\n```\n\
    a (log(1 + b x) - 1) (1 + b x)\n------------------------------\n             \
    \ b\n```\n\n下面的例子计算二重积分 ![A978-1-4842-0310-1_8_Figcc_HTML.jpg](img/A978-1-4842-0310-1_8_Figcc_HTML.jpg)，其中\
    \ `a` 是一个任意参数。\n\n```matlab\n>> syms x a b, pretty(simple(int(int(a*log(1+b*x),x),b)))\n\
    ```\n\n```\na (-dilog(1 + b x) + log(1 + b x) + log(1 + b x) x b - 1 - 2 b x -\
    \ log(b))\n```\n\n下面的例子计算三重积分 ![A978-1-4842-0310-1_8_Figdd_HTML.jpg](img/A978-1-4842-0310-1_8_Figdd_HTML.jpg)。\n\
    \n```matlab\n>> syms x a b, pretty(simple(int(int(int(a*log(1+b*x),x),b),a)))\n\
    ```\n\n```\n2\n1/2a(-dilog(1 + b x) + log(1 + b x) + log(1 + b x) x b - 1 - 2\
    \ b x - log(b))\n```\n\n我们计算 ![A978-1-4842-0310-1_8_Figee_HTML.jpg](img/A978-1-4842-0310-1_8_Figee_HTML.jpg)。\n\
    \n```matlab\n>> syms x a b, pretty (simple (int (a * log(1+b*x), x, 0, 1)))\n\
    ```\n\n```\nab + log(1+b)+ b log (1+b) – b\n------------------------------\n \
    \             b\n```\n\n下面的例子计算 ![A978-1-4842-0310-1_8_Figff_HTML.jpg](img/A978-1-4842-0310-1_8_Figff_HTML.jpg)，其中\
    \ `a` 是一个任意参数。\n\n```matlab\n>> syms x a b, pretty(simple(int(int(a*log(1+b*x),x,0,1),b,2,3)))\n\
    ```\n\n```\na (8 log (2) - 2 - dilog (4) - 3 log (3) + dilog (3))\n```\n\n在下面的例子中，我们求解一阶一次微分方程\
    \ `y'(t) = ay(t)`，其中 `a` 是一个任意参数。\n\n```matlab\n>> pretty(dsolve('Dy = a*y'))\n\
    ```\n\n```\nC1 exp (a t)\n```\n\n因此，我们得知解族为 `y(t) = c[1] e^{at}`。\n\n现在我们求解上述带有初始条件\
    \ `y(0) = b` 的微分方程。\n\n```matlab\n>> pretty(dsolve('Dy = a*y', 'y(0) = b'))\n\
    ```\n\n```\nb exp (a t)\n```\n\n接下来，我们求解一阶二次微分方程 `y'²(s) + y²(s) = 1`，其初始条件为 `y(0)\
    \ = 0`。\n\n```matlab\n>> y = dsolve ('(Dy) ^ 2 + y ^ 2 = 1', 'y(0) = 0', 's')\n\
    ```\n\n```\ny =\n[-sin (s)]\n[ sin (s)]\n```\n\n现在，我们求解二阶一次微分方程 `y\"(t) = a²y'(t)`，其初始条件为\
    \ `y(0) = 1` 和 `y'(π/a) = 0`。\n\n```matlab\n>> pretty (dsolve ('D2y = - a ^ 2\
    \ * y ', 'y(0) = 1, Dy (pi/a) = 0'))\n```\n\n```\ncos (a t)\n```\n\n因此，解是函数 `y(t)\
    \ = cos(at)`。\n\n在下面的例子中，我们求解方程组：`x'(t) = y(t)`, `y'(t) = -x(t)`。\n\n```matlab\n\
    >> [x, y] = dsolve('Dx = y', 'Dy =-x')\n```\n\n```\nx =\ncos (t) * C1 + sin (t)\
    \ * C2\ny =\n-sin (t) * C1 + cos (t) * C2\n```\n\n接下来，我们计算上述微分方程组在初始条件 `x(0) =\
    \ 0` 和 `y(0) = 1` 下的解。\n\n```matlab\n>> [x, y] = dsolve ('Dx = y, Dy = - x', 'x\
    \ (0) = 0, y (0) = 1')\n```\n\n```\nx =\nsin (t)\ny =\ncos (t)\n```\n"
- fmt: '# Linear Algebra: Simplifying and Solving Equations


    Calculations with simple, rational and complex algebraic expressions are specially
    treated in MATLAB. The Symbolic Match toolbox functions efficiently implement
    the operations of simplification, factorization, grouping and expansion of algebraic
    expressions, and includes trigonometric expressions and expressions in a complex
    variable. The syntax of these functions is as follows.


    | `r = collect(S)` `r = collect(S, v)` | Each polynomial in the array of polynomials
    `S` is grouped in terms of the variable `v` (or `x` if `v` is not specified).
    |

    | `r = expand(S)` | Expands each polynomial or trigonometric, exponential or logarithmic
    function contained in `S`. |

    | `factor(x)` | Factors `x` (symbolic or numerical). |

    | `r = horner(p)` | Converts the polynomial `p` into its Horner, or nested, polynomial
    representation. |

    | `[n, d] = numden(A)` | Converts each element of the symbolic or numerical matrix
    `A` to a simplified rational form. |

    | `r = simple(s)` `[r,how] = simple(s)` | Simplifies the symbolic expression `s`
    looking for the shortest possible output. The second option presents only the
    final result and a string describing the particular simplification. |

    | `r = simplify(S)` | Simplifies each element of the symbolic matrix `S`. |

    | `[y, sigma] = subexpr(x, sigma)` `[y, sigma] = subexpr(x, ''sigma'')` | Rewrites
    the symbolic expression `x` in terms of a common subexpression, substituting this
    subexpression with the symbolic variable `sigma`. |


    As a first example we group the expression `y(sin(x) + 1) + sin(x)` in terms of
    `sin(x)`.


    ```

    >> syms x and

    >> pretty (collect (y * (sin (x) + 1) + sin (x), sin (x)))

    (y + 1) sin (x) + y

    ```


    Next we group, firstly in terms of `x`, and then `ln(x)`, the function `f(x) =
    aln(x)-xln(x)-x`.


    ```

    >> syms a x

    >> f=a*log(x)-log(x)*x-x

    f =

    a*log(x)-log(x)*x-x

    >> pretty(collect(f,x))

    (- log (x) - 1) x + log (x)

    >> pretty(collect(f,log(x)))

    (a - x) log (x) - x

    ```


    In the following example we expand various algebraic expressions.


    ```

    >> syms a b x y t

    >> expand([sin(2*t), cos(2*t)])

    ans =

    [2 * sin (t) * cos (t), 2 * cos (t) ^ 2-1]

    >> expand(exp((a+b)^2))

    ans =

    exp(a^2) * exp(a*b) ^ 2 * exp(b^2)

    >> expand (cos (x + y))

    ans =

    cos (x) * cos (y) - sin (x) * sin(y)

    >> expand((x-2)*(x-4))

    ans =

    x^2-6*x+8

    ```


    Next we factorize various expressions.


    ```

    >> factor(x^3-y^3)

    ans =

    (x - y) *(x^2+x*y+y^2)

    >> factor([a^2-b^2, a^3+b^3])

    ans =

    [(a-b)*(a+b), (a+b)*(a^2-a*b+b^2)]

    >> factor(sym(''12345678901234567890''))

    ans =

    (2) * (3) ^ 2 * (5) * (101) * (3803) * (3607) * (27961) * (3541)

    ```


    Below we simplify various expressions.


    ```

    >> syms x y z a b c

    >> simplify(exp(c*log(sqrt(a+b))))

    ans =

    (a + b) ^(1/2*c)

    >> simplify (sin (x) ^ 2 + cos (x) ^ 2)

    ans =

    1

    >> S = [(x^2+5*x+6)/(x+2),sqrt(16)];

    R = simplify(S)

    R =

    [ x+3,   4]

    ```


    The following functions can be used to solve symbolic equations and systems of
    equations:


    | `solve(''equation'', ''x'')` | Solves the equation in terms of the variable
    `x`. |

    | `syms x; solve(equation,x)` | Solve the equation in terms of the variable `x`.
    |

    | `solve(''e1,e2,...,en'', ''x1,x2,...,xn'')` | Solves the system of equations
    `e1,...,en` in terms of the variables `x1,..., xn`. |

    | `syms x1 x2... xn; solve(e1,e2,...,en, x1,x2,...,xn)` | Solves the system of
    equations `e1,...,en` in terms of the variables `x1,..., xn`. |


    As a first example we solve the equation `3ax - 7x^2 + x^3 = 0` in terms of `x`,
    where `a` is a parameter.


    ```

    >> solve(''3*a*x-7*x^2+x^3=0'',''x'')

    ans =

    [                       0]

    [7/2 + 1/2 *(49-12*a) ^(1/2)]

    [7/2-1/2 *(49-12*a) ^(1/2)]

    ```


    Next we solve the above equation where `a` is the variable and `x` is the parameter.


    ```

    >> pretty(solve(''3*a*x-7*x^2+x^3=0'',''a''))

    -1/3 x (- 7 + x)

    ```


    In the following example, we calculate the fourth roots of `-1` and `1`.


    ```

    >> S=solve(''x^4+1=0'')

    S =

    [  1/2*2^(1/2)+1/2*i*2^(1/2)]

    [ -1/2*2^(1/2)-1/2*i*2^(1/2)]

    [  1/2*2^(1/2)-1/2*i*2^(1/2)]

    [ -1/2*2^(1/2)+1/2*i*2^(1/2)]

    >> numeric(S)

    ans =

    0.70710678118655 + 0.70710678118655i

    -0.70710678118655 - 0.70710678118655i

    0.70710678118655 - 0.70710678118655i

    ```'
