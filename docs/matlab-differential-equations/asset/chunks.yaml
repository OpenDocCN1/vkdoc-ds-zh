  raw: '## Linear Higher-Order Equations. Homogeneous Equations with Constant Coefficients


    The homogeneous linear differential equation of order n


    ![A978-1-4842-0310-1_3_Figg_HTML.jpg](A978-1-4842-0310-1_3_Figg_HTML.jpg)


    is said to have constant coefficients if the functions a [i] (x) (i = 1, …, n)
    are all constant (i.e. they do not depend on the variable x).


    The equation:


    ![A978-1-4842-0310-1_3_Figh_HTML.jpg](A978-1-4842-0310-1_3_Figh_HTML.jpg)


    is called the characteristic equation of the above differential equation. The
    solutions (m [1], m [2], …, m [n] ) of this characteristic equation determine
    the general solution of the associated differential equation.


    If the m [i] (i = 1, …, n) are all different, the general solution of the homogeneous
    equation with constant coefficients is:


    ![A978-1-4842-0310-1_3_Figi_HTML.jpg](A978-1-4842-0310-1_3_Figi_HTML.jpg)


    where c [1], c [2], …, c [n] are arbitrary constants.


    If some m [i] is a root of multiplicity k of the characteristic equation, then
    it determines the following k terms of the solution:


    ![A978-1-4842-0310-1_3_Figj_HTML.jpg](A978-1-4842-0310-1_3_Figj_HTML.jpg)


    If the characteristic equation has a complex root m [j] = a+bi , then its complex
    conjugate m [j+1] = a-bi is also a root. These two roots determine a pair of terms
    in the general solution of the homogeneous equation:


    ![A978-1-4842-0310-1_3_Figk_HTML.jpg](A978-1-4842-0310-1_3_Figk_HTML.jpg)


    MATLAB directly applies this method to obtain the solutions of homogeneous linear
    equations with constant coefficients, using the command dsolve or maple(‘dsolve’).


    EXERCISE 3-2


    Solve the following equations:


    ![A978-1-4842-0310-1_3_Figl_HTML.jpg](A978-1-4842-0310-1_3_Figl_HTML.jpg)


    ![A978-1-4842-0310-1_3_Figm_HTML.jpg](A978-1-4842-0310-1_3_Figm_HTML.jpg)


    `» pretty(dsolve(''3*D2y+2*Dy-5*y=0''))`


                          `/   5 t \`


      `C38 exp(t) + C39 exp| - --- |`


                          `\    3  /`


    `» pretty(dsolve(''2 * D2y + 5 * Dy + 5 * y = 0'', '' y(0) = 0 Dy(0) = 1/2 ''))`


                              `/   1/2   \`


          `1/2    /   5 t \    | 15    t |`


      `2 15    exp| - --- | sin| ------- |`


                 `\    4  /    \    4    /`


      `-----------------------------------`


                      `15`


    EXERCISE 3-3


    Solve the differential equation


    ![A978-1-4842-0310-1_3_Fign_HTML.jpg](A978-1-4842-0310-1_3_Fign_HTML.jpg)


    `» pretty(simple(dsolve(''9*D4y-6*D3y+46*D2y-6*Dy+37*y=0'')))`


                                              `/ t \                   / t \`


    `C46 cos(t) + C47 sin(t) + C44 cos(2 t) exp| - | + C45 sin(2 t) exp| - |`


                                              `\ 3 /                   \ 3 /`


    Looking at the solution, it is evident that the characteristic equation has two
    pairs of complex conjugate solutions.


    `» solve(''9*x^4-6*x^3+46*x^2-6*x+37=0'')`


    `ans =`


             `i`


            `-i`


    `1/3 + 2*i`


    `1/3 - 2*i`


    ## Non-Homogeneous Equations with Constant Coefficients. Variation of Parameters


    Consider the non-homogeneous linear equation with constant coefficients:


    ![A978-1-4842-0310-1_3_Figo_HTML.jpg](A978-1-4842-0310-1_3_Figo_HTML.jpg)


    Suppose {y [1](x), y [2](x),....., y [n] (x)} is a linearly independent set of
    solutions of the corresponding homogeneous equation:


    ![A978-1-4842-0310-1_3_Figp_HTML.jpg](A978-1-4842-0310-1_3_Figp_HTML.jpg)


    A particular solution of the non-homogeneous equation is given by:


    ![A978-1-4842-0310-1_3_Figq_HTML.jpg](A978-1-4842-0310-1_3_Figq_HTML.jpg)


    where the functions u [i] (x) are obtained as follows:


    ![A978-1-4842-0310-1_3_Figr_HTML.jpg](A978-1-4842-0310-1_3_Figr_HTML.jpg)


    Here W [i] [ y [1](x), y [2](x), …, y [n] (x)] is the determinant of the matrix
    obtained by replacing the i-th column of the Wronskian matrix W[y [1](x), y [2](x),
    …, y [n] (x)] by the transpose of the vector (0, 0,…, 0, 1).


    The solution of the non-homogeneous equation is then given by combining the general
