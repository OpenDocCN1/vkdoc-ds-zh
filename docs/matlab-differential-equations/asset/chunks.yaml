    = 0, 1, ..., M`，`h = (b - a) / M` 划分的区间 `[a, b]`，将其分成 `M` 个等长子区间。泰勒级数法（这里我们考虑四阶方法）通过计算
    `y''`、`y"`、`y"''` 和 `y""` 在每个划分点处给出 `y` 的四阶泰勒级数，从而找到微分方程的解。


