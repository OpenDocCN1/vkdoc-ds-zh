    # 数学分析：函数、极限、连续性与级数


    MATLAB 的符号数学模块让您能够轻松处理数学分析问题。它可以计算极限、求导数、求和级数、寻找函数的泰勒级数、计算积分以及处理方程。


    在求解极限时，可使用相同函数来计算数列极限、函数极限、函数序列极限，当然也能用于分析函数的连续性以及数值级数和幂级数的收敛性。单变量和多变量分析的方法是类似的。以下是可用的函数。


    | `limit (sequence, inf)` | 计算由通项表示的数列在 n 趋于无穷大时的极限。 |

    | `limit (sequence, inf)` | 计算由通项表示的数列在 n 趋于无穷大时的极限。 |

    | `limit (function, x, a)` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 趋于值 a 时的极限。 |

    | `limit (function, a)` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 趋于值 a 时的极限。 |

    | `limit (function, x, a, ''right'')` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 从右侧趋于值 a 时的极限。
    |

    | `limit (function, x, a, ''left'')` | 计算由解析表达式表示的关于变量 x 的函数，当变量 x 从左侧趋于值 a 时的极限。
    |

    | `symsum (S, v, a, b)` | 求通项为 S、变量 v 从 a 到 b 的级数之和。 |

    | `symsum (S, v)` | 求通项为 S、变量 v 的值从 0 到 v-1 的级数之和。 |

    | `r = symsum (S)` | 返回关于符号变量 k（由 `findsym` 确定）的通项为 S 的级数之和，其中 k 的值从 0 到 k-1。
    |

    | `symsum (S, a, b)` | 求关于符号变量 k（由 `findsym` 确定）的通项为 S 的级数之和，其中 k 的值从 a 到 b。 |


    作为第一个例子，我们计算以下数列极限：


    ![A978-1-4842-0310-1_8_Figj_HTML.jpg](img/A978-1-4842-0310-1_8_Figj_HTML.jpg)


    我们得到：


    ```

    >> syms n

    >> limit (((2*n-3) /(3*n-7)) ^ 4, inf)

    ans =

    16/81

    >> limit ((3*n³+7*n²+1) /(4*n³-8*n+5), n, inf)

    ans =

    3/4

    >> limit (((n+1)/2) * ((n⁴+1)/n ^ 5), inf)

    ans =

    1/2

    >> limit (((n+1)/n ^ 2) ^(1/n), inf)

    ans =

    1

    ```


    接下来我们计算以下函数极限：


    ![A978-1-4842-0310-1_8_Figk_HTML.jpg](img/A978-1-4842-0310-1_8_Figk_HTML.jpg)


    我们得到：


    ```

    >> syms x a

    >> limit((x-1)/(x^(1/2)-1),x,1)

    ans =

    2

    >> limit((x-(x+2)^(1/2))/((4*x+1)^(1/2)-3),2)

    ans =

    9/8

    >> limit((1+x)^(1/x))

    ans =

    exp (1)

    >> limit(sin(a*x)²/x²,x,0)

    ans =

    a²

    ```


    在下面的例子中，我们计算定义在 `R` 上的函数序列 `gn = (x²+n*x)/n` 的极限。


    ```

    >> limit((x²+n*x)/n,n,inf)

    ans =

    x

    ```


    我们看到极限函数的图形是通过第一和第三象限的对角线。我们可以如下演示这一点（参见图 8-1）：


    ```

    >> fplot(''[(x²+x),(x²+2*x)/2,(x²+3*x)/3,(x²+4*x)/4,

    (x²+5*x)/5,(x²+5*x)/5,(x²+6*x)/6,(x²+7*x)/7,(x²+8*x)/8,

    (x²+9*x)/9]'',[-2,2,-2,2])

    ```


    ![A978-1-4842-0310-1_8_Fig1_HTML.jpg](img/A978-1-4842-0310-1_8_Fig1_HTML.jpg)


    图 8-1.


    以下例子验证了函数 `f(x) = sin(x) / x` 在 `R-{0}` 上的连续性。下面的命令检查了 ![A978-1-4842-0310-1_8_Figl_HTML.jpg](img/A978-1-4842-0310-1_8_Figl_HTML.jpg)
    是否成立。


    ```

    >> syms x a

    >> limit (sin (x) / x, x, a)

    ans =

    sin (a) /a

    ```


    接下来我们证明函数 ![A978-1-4842-0310-1_8_Figm_HTML.jpg](img/A978-1-4842-0310-1_8_Figm_HTML.jpg)
    在点 `x = 0` 不连续，通过说明其左右极限不匹配（一个为 0，另一个为无穷大）。


    ```

    >> syms x

    >> limit((exp(1/x)),x,0,''right'')

    ans =

    inf

    >> limit((exp(1/x)),x,0, ''left'')

    ans =

    0

    ```


    在以下例子中，我们通过应用比值检验法（![A978-1-4842-0310-1_8_Figo_HTML.jpg](img/A978-1-4842-0310-1_8_Figo_HTML.jpg)）来确定级数
    ![A978-1-4842-0310-1_8_Fign_HTML.jpg](img/A978-1-4842-0310-1_8_Fign_HTML.jpg)
    是否收敛，如果收敛，则计算其和。


    ```

    >> syms n

    >> f = n/2 ^ n

    f =

    n/(2^n)

    >> limit (subs(f,n,n+1)/f, n, inf)

    ans =

    1/2

    ```


    我们看到相邻项比值的极限小于 1，这意味着该级数收敛。我们使用以下方法计算其和：


    ```

    >> symsum(f,n,1,inf)

    ans =

    2

    ```

