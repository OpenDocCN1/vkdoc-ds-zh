  trans: '好的，作为资深文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，为您完成本次翻译任务。



    # MATLAB 工作环境


    图 1-10 展示了 MATLAB 环境的主要工作区。这是您输入 MATLAB 程序的界面。


    ![A978-1-4842-0310-1_1_Fig10_HTML.jpg](img/A978-1-4842-0310-1_1_Fig10_HTML.jpg)


    图 1-10.


    下表总结了 MATLAB 环境的各个组件。


    ![A978-1-4842-0310-1_1_Fig12_HTML.jpg](img/A978-1-4842-0310-1_1_Fig12_HTML.jpg)


    图 1-12.


    ![A978-1-4842-0310-1_1_Fig11_HTML.jpg](img/A978-1-4842-0310-1_1_Fig11_HTML.jpg)


    图 1-11.


    | 工具 | 描述 |

    | --- | --- |

    | Command History（命令历史） | 允许您查看当前会话在命令窗口中输入的命令，并可以复制和运行这些命令（见图 1-11 的右下方部分） |

    | Command Window（命令窗口） | 您在此处输入 MATLAB 命令（见图 1-11 的中央部分） |

    | Workspace（工作区） | 允许您查看工作区的内容（变量等）（见图 1-11 的右上方部分） |

    | Help（帮助） | 提供 MATLAB 的帮助和演示 |

    | Start button（启动按钮） | 使您能够运行工具并访问 MATLAB 文档（图 1-12） |


    MATLAB 命令是在命令窗口中用户输入提示符 `»` 的右侧编写的，命令的响应会立即显示在下面的几行中。退出响应后，用户输入提示符会重新显示，允许您输入更多内容（图
    1-13）。


    ![A978-1-4842-0310-1_1_Fig13_HTML.jpg](img/A978-1-4842-0310-1_1_Fig13_HTML.jpg)


    图 1-13.


    当在命令窗口中向 MATLAB 输入命令，且结果未赋给变量时，返回的响应将以表达式 `ans =` 开头，如图 1-13 顶部附近所示。如果将结果赋给一个变量，那么我们就可以在后续输入中将该变量用作参数。图
    1-13 中的变量 `v` 就是这种情况，它随后被用作指数运算的输入。


    要运行 MATLAB 命令，只需键入命令并按 Enter 键。如果在输入末尾加上分号，程序会执行计算并将其保存在内存（工作区）中，但不会在屏幕上显示结果（参见图
    1-13 中的第一个条目）。输入提示符 `»` 出现，表示您可以输入新命令。


    与 C 编程语言一样，MATLAB 区分大小写；例如，`Sin(x)` 和 `sin(x)` 是不同的。所有内置函数的名称都以小写字母开头。命令、变量或函数的名称中不应有空格。在其他情况下，空格将被忽略，并且可以使用空格使输入更具可读性。可以通过用逗号分隔多个条目来在同一命令行中输入它们，并在最后一个条目末尾按
    Enter 键（见图 1-14）。如果在一行中的某个条目末尾使用分号，则其对应的输出将不会显示。


    ![A978-1-4842-0310-1_1_Fig14_HTML.jpg](img/A978-1-4842-0310-1_1_Fig14_HTML.jpg)


    图 1-14.


    可以在命令输入行中以 `%` 符号开头输入描述性注释。当您运行输入时，MATLAB 会忽略注释并处理其余代码（见图 1-15）。


    ![A978-1-4842-0310-1_1_Fig15_HTML.jpg](img/A978-1-4842-0310-1_1_Fig15_HTML.jpg)


    图 1-15.


    为了简化通过 MATLAB 解释器（通过命令窗口提示符）输入脚本的过程，您可以使用箭头键。例如，如果您按一次向上箭头键，您将恢复上次提交的条目。如果您按两次向上键，您将恢复倒数第二次提交的条目，依此类推。


    如果您在输入区域键入一串字符，然后按向上箭头键，您将恢复以指定字符串开头的最后提交的条目。


    在 MATLAB 会话期间输入的命令会临时存储在缓冲区（工作区）中，直到会话结束，届时它们可以永久存储在文件中或永久丢失。


    以下是在 MATLAB 输入区域（命令行）中可使用的键及其功能的摘要：


    | 向上箭头 (Ctrl-P) | 检索上一个条目。 |

    | 向下箭头 (Ctrl-N) | 检索下一个条目。 |

    | 向左箭头 (Ctrl-B) | 将光标向左移动一个字符。 |

    | 向右箭头 (Ctrl-F) | 将光标向右移动一个字符。 |

    | CTRL-向左箭头 | 将光标向左移动一个单词。 |

    | CTRL-向右箭头 | 将光标向右移动一个单词。 |

    | Home (Ctrl-A) | 将光标移动到行首。 |

    | End (Ctrl-E) | 将光标移动到当前行的行尾。 |

    | Escape | 清除命令行。 |

    | Delete (Ctrl-D) | 删除光标指示的字符。 |

    | Backspace | 删除光标左侧的字符。 |

    | CTRL-K | 删除（清除）当前行。 |


    命令 `clc` 会清除命令窗口，但不会删除工作区的内容（内容仍保留在内存中）。


    ## MATLAB 帮助


    您可以通过工具栏中的帮助按钮 ![A978-1-4842-0310-1_1_Figa_HTML.jpg](img/A978-1-4842-0310-1_1_Figa_HTML.jpg)
    或菜单栏中的 Help 选项来查找 MATLAB 帮助。此外，也可以通过 MATLAB 命令获得支持。命令 `help` 提供所有 MATLAB 命令的通用帮助（见图
    1-16）。单击其中任何一个，您可以获得更具体的帮助。例如，如果您单击命令 `graph2d`，您将获得有关二维图形的支持（见图 1-17）。


    ![A978-1-4842-0310-1_1_Fig17_HTML.jpg](img/A978-1-4842-0310-1_1_Fig17_HTML.jpg)


    图 1-17.


    ![A978-1-4842-0310-1_1_Fig16_HTML.jpg](img/A978-1-4842-0310-1_1_Fig16_HTML.jpg)


    图 1-16.


    您可以使用命令 `help command` 或 `help topic` 来请求关于特定命令 `command`（图 1-18）或任何主题 `topic`（图
    1-19）的帮助。


    ![A978-1-4842-0310-1_1_Fig19_HTML.jpg](img/A978-1-4842-0310-1_1_Fig19_HTML.jpg)


    图 1-19.


    ![A978-1-4842-0310-1_1_Fig18_HTML.jpg](img/A978-1-4842-0310-1_1_Fig18_HTML.jpg)


    图 1-18.


    命令 `lookfor string` 允许您查找所有引用或包含字符串 `string` 的 MATLAB 函数或命令。当没有针对指定字符串的直接支持时，或者要查看与给定字符串相关的所有命令的帮助时，此命令非常有用。例如，如果我们想查找所有包含序列
    `inv` 的命令的帮助，我们可以使用命令 `lookfor inv`（图 1-20）。


    ![A978-1-4842-0310-1_1_Fig20_HTML.jpg](img/A978-1-4842-0310-1_1_Fig20_HTML.jpg)


    图 1-20.

