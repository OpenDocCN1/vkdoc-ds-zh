    ```


    The first derivative vanishes at `x = 0`, ![A978-1-4842-0310-1_8_Figrr_HTML.jpg](A978-1-4842-0310-1_8_Figrr_HTML.jpg)
    and ![A978-1-4842-0310-1_8_Figss_HTML.jpg](A978-1-4842-0310-1_8_Figss_HTML.jpg).
    These include maximum and minimum candidates. To verify if they are maxima or
    minima, we find the value of the second derivative at those points:


    ```

    >> [numeric(subs(diff(f,2),0)),numeric(subs(diff(f,2),sqrt(3))),

    numeric(subs(diff(f,2),-sqrt(3)))]

    ```


    ```

    ans =

    0 2.5981 - 2.5981

    ```


