    \n我们首先在 M 文件中定义函数，如图 7-12 到 7-14 所示。\n\n![A978-1-4842-0310-1_7_Fig14_HTML.jpg](img/A978-1-4842-0310-1_7_Fig14_HTML.jpg)\n\
