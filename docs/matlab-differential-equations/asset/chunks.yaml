    ```


    ```

    ans =

    NaN

    ```


    Thus, there are no horizontal asymptotes. To see if there are vertical asymptotes,
    we look at the values of x that make y infinite:


    ```

    >> solve(''x^2-1'')

    ```


    ```

    ans =

    [1]

    [-1]

    ```


    The vertical asymptotes are the lines `x = 1` and `x = -1`. Now let us see if
    there are any oblique asymptotes:


    ```

    >> limit(x^3/(x^2-1)/x,x,inf)

    ```


    ```

    ans =

