- fmt: "## Linear Higher-Order Equations. Homogeneous Equations with Constant Coefficients\n\
    \nThe homogeneous linear differential equation of order n\n\n![A978-1-4842-0310-1_3_Figg_HTML.jpg](A978-1-4842-0310-1_3_Figg_HTML.jpg)\n\
    \nis said to have constant coefficients if the functions `a[i](x)` (i = 1, …,\
    \ n) are all constant (i.e. they do not depend on the variable x).\n\nThe equation:\n\
    \n![A978-1-4842-0310-1_3_Figh_HTML.jpg](A978-1-4842-0310-1_3_Figh_HTML.jpg)\n\n\
    is called the characteristic equation of the above differential equation. The\
    \ solutions (`m[1]`, `m[2]`, …, `m[n]`) of this characteristic equation determine\
    \ the general solution of the associated differential equation.\n\nIf the `m[i]`\
    \ (i = 1, …, n) are all different, the general solution of the homogeneous equation\
    \ with constant coefficients is:\n\n![A978-1-4842-0310-1_3_Figi_HTML.jpg](A978-1-4842-0310-1_3_Figi_HTML.jpg)\n\
    \nwhere `c[1]`, `c[2]`, …, `c[n]` are arbitrary constants.\n\nIf some `m[i]` is\
    \ a root of multiplicity k of the characteristic equation, then it determines\
    \ the following k terms of the solution:\n\n![A978-1-4842-0310-1_3_Figj_HTML.jpg](A978-1-4842-0310-1_3_Figj_HTML.jpg)\n\
    \nIf the characteristic equation has a complex root `m[j] = a+bi`, then its complex\
    \ conjugate `m[j+1] = a-bi` is also a root. These two roots determine a pair of\
    \ terms in the general solution of the homogeneous equation:\n\n![A978-1-4842-0310-1_3_Figk_HTML.jpg](A978-1-4842-0310-1_3_Figk_HTML.jpg)\n\
    \nMATLAB directly applies this method to obtain the solutions of homogeneous linear\
    \ equations with constant coefficients, using the command `dsolve` or `maple('dsolve')`.\n\
    \nEXERCISE 3-2\n\nSolve the following equations:\n\n![A978-1-4842-0310-1_3_Figl_HTML.jpg](A978-1-4842-0310-1_3_Figl_HTML.jpg)\n\
    \n![A978-1-4842-0310-1_3_Figm_HTML.jpg](A978-1-4842-0310-1_3_Figm_HTML.jpg)\n\n\
    ```\n» pretty(dsolve('3*D2y+2*Dy-5*y=0'))\n                      /   5 t \\\n\
    \  C38 exp(t) + C39 exp| - --- |\n                      \\    3  /\n```\n\n```\n\
    » pretty(dsolve('2 * D2y + 5 * Dy + 5 * y = 0', ' y(0) = 0 Dy(0) = 1/2 '))\n \
    \                         /   1/2   \\\n     1/2    /   5 t \\    | 15    t |\n\
    \ 2 15    exp| - --- | sin| ------- |\n             \\    4  /    \\    4    /\n\
    \  -----------------------------------\n                  15\n```\n\nEXERCISE\
    \ 3-3\n\nSolve the differential equation\n\n![A978-1-4842-0310-1_3_Fign_HTML.jpg](A978-1-4842-0310-1_3_Fign_HTML.jpg)\n\
    \n```\n» pretty(simple(dsolve('9*D4y-6*D3y+46*D2y-6*Dy+37*y=0')))\n          \
    \                                / t \\                   / t \\\nC46 cos(t) +\
    \ C47 sin(t) + C44 cos(2 t) exp| - | + C45 sin(2 t) exp| - |\n               \
    \                           \\ 3 /                   \\ 3 /\n```\n\nLooking at\
    \ the solution, it is evident that the characteristic equation has two pairs of\
    \ complex conjugate solutions.\n\n```\n» solve('9*x^4-6*x^3+46*x^2-6*x+37=0')\n\
    ans =\n         i\n        -i\n1/3 + 2*i\n1/3 - 2*i\n```\n\n## Non-Homogeneous\
    \ Equations with Constant Coefficients. Variation of Parameters\n\nConsider the\
    \ non-homogeneous linear equation with constant coefficients:\n\n![A978-1-4842-0310-1_3_Figo_HTML.jpg](A978-1-4842-0310-1_3_Figo_HTML.jpg)\n\
    \nSuppose {`y[1](x)`, `y[2](x)`, ..., `y[n](x)`} is a linearly independent set\
    \ of solutions of the corresponding homogeneous equation:\n\n![A978-1-4842-0310-1_3_Figp_HTML.jpg](A978-1-4842-0310-1_3_Figp_HTML.jpg)\n\
    \nA particular solution of the non-homogeneous equation is given by:\n\n![A978-1-4842-0310-1_3_Figq_HTML.jpg](A978-1-4842-0310-1_3_Figq_HTML.jpg)\n\
    \nwhere the functions `u[i](x)` are obtained as follows:\n\n![A978-1-4842-0310-1_3_Figr_HTML.jpg](A978-1-4842-0310-1_3_Figr_HTML.jpg)\n\
    \nHere `W[i][y[1](x), y[2](x), …, y[n](x)]` is the determinant of the matrix obtained\
    \ by replacing the i-th column of the Wronskian matrix `W[y[1](x), y[2](x), …,\
    \ y[n](x)]` by the transpose of the vector (0, 0,…, 0, 1).\n\nThe solution of\
    \ the non-homogeneous equation is then given by combining the general solution\
    \ of the homogeneous equation with the particular solution of the non-homogeneous\
    \ equation. If the roots `m[i]` of the characteristic equation of the homogeneous\
    \ equation are all different, the general solution of the non-homogeneous equation\
    \ is:\n\n![A978-1-4842-0310-1_3_Figs_HTML.jpg](A978-1-4842-0310-1_3_Figs_HTML.jpg)\n\
    \nIf some of the roots are repeated, we refer to the general form of the solution\
    \ of a homogeneous equation discussed earlier.\n\nEXERCISE 3-4\n\nSolve the following\
    \ differential equations:\n\n![A978-1-4842-0310-1_3_Figt_HTML.jpg](A978-1-4842-0310-1_3_Figt_HTML.jpg)\n\
    \n![A978-1-4842-0310-1_3_Figu_HTML.jpg](A978-1-4842-0310-1_3_Figu_HTML.jpg)\n\n\
    We will follow the algebraic method of variation of parameters to solve the first\
    \ equation. We first consider the characteristic equation of the homogeneous equation\
    \ to obtain a set of linearly independent solutions.\n\n```\n» solve('m^2+4*m+13=0')\n\
    ans =\n[- 2 + 3 * i]\n[- 2 - 3 * i]\n```\n\n```\n» maple('f: = x - > x * cos(3*x)\
    \ ^ 2');\n» maple('y1: = x - > exp(-2*x) * cos(3*x)');\n» maple('y2: = x - > exp(-2*x)\
    \ * sin(3*x)');\n» maple('W: = x - > Wronskian([y1(x), y2(x)], x)');\n» pretty(simplify(maple('det(W(x))')))\n\
    3 exp(-4 x)\n```\n\nWe see that the Wronskian is non-zero, indicating that the\
    \ functions are linearly independent. Now we calculate the functions `W[i](x)`,\
    \ i = 1, 2.\n\n```\n» maple('W1: x-= > array([[0, y2(x)], [1, diff((y2)(x), x)]])');\n\
    » pretty(simplify(maple('det(W1(x))')))\n-exp(-2 x) sin(3 x)\n```\n\n```\n» maple('W2:\
    \ x-= > array([[y1(x), 0], [diff((y1)(x), x), 1]])');\n» pretty(simplify(maple('det(W2(x))')))\n\
    exp(-2 x) cos(3 x)\n```\n\nNow we calculate the particular solution of the non-homogeneous\
    \ equation.\n\n```\n» maple('u1:=x->factor(simplify(int(f(x)*det(W1(x))/det(W(x)),x)))');\n\
    » maple('u1(x)')\nans =\n1/14652300*exp(2*x)*(129285*cos(9*x)*x-6084*cos(9*x)-28730*sin(9*x)*x-13013*sin(9*x)+281775*cos(3*x)*x-86700*cos(3*x)-187850*sin(3*x)*x-36125*sin(3*x))\n\
    ```\n\n```\n» maple('u2:=x->factor(simplify(int(f(x)*det(W2(x))/det(W(x)),x)))');\n\
    » maple('u2(x)')\nans =\n1/14652300 * exp(2*x) *(563550 * cos(3*x) * x+108375\
