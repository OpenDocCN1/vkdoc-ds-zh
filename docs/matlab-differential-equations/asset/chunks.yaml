    1/2                        1/2\n2/15 15    exp(- 5/4 t) sin(1/4 15    t)\n```\n\
    \n**练习 8-20**\n\n在初始条件`x(0) = 1`和`y(0) = 2`下，求解以下方程组：\n- `x' - y = e^(-t)`\n-\
