    (x(u,v), y(u,v)) with x = x(u, v) and y = y(u,v) and find the derivative and the
    Jacobian of the inverse transformation. Find the value of this inverse function
    at the point (π/4,-π/4).


    To find the conditions under which the function is invertible we appeal to the
    inverse function theorem. The functions are differentiable with continuous derivatives,
    except perhaps at x= 0\. Now we consider the Jacobian of the transformation ∂
    (u(x, y), v(x,y)) /∂(x, y):


    `>> syms x y`


    `>> J=simple((jacobian([(x^4+y^4)/x,sin(x)+cos(y)],[x,y])))`


    `J =`


    `[ 3*x^2-1/x^2*y^4,         4*y^3/x]`


    `[          cos(x),         -sin(y)]`


    `>> pretty(det(J))`


    `4           4      3`


    `3 sin(y) x  - sin(y) y  + 4 y  cos(x) x`


    `- ---------------------------------------`


    `2`


    `x`


    Therefore, at the points where this expression does not vanish, we can solve for
    x and y in terms of u and v. In addition, we must also have x≠0.


    We calculate the derivative of the inverse function. Its value is the inverse
    of the Jacobian matrix of the original function found above and the determinant
    of its Jacobian is the reciprocal of the determinant of the Jacobian of the original
    function:


    `>> I=simple(inv(J));`


    `>> pretty(simple(det(I)))`


    `2`


    `x`


    `- ---------------------------------------`


    `4           4      3`


    `3 sin(y) x  - sin(y) y  + 4 y  cos(x) x`


    We now find the value of this inverse function at the point (π/4,-π/4):


    `>> numeric(subs(subs(determ(I),pi/4,''x''),-pi/4,''y''))`


    `ans =`


    `0.38210611216717`


    `>> numeric(subs(subs(symdiv(1,determ(J)),pi/4,''x''),-pi/4,''y''))`


    `ans =`


    `0.38210611216717`


    These results confirm that the determinant of the Jacobian of the inverse function
    is the reciprocal of the determinant of the Jacobian of the original function.


