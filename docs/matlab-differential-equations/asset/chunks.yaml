    ctranspose.m: %TRANSPOSE 符号矩阵的复共轭转置。\nSMOKE  具有“烟环”伪谱的复矩阵。\n```\n\n# MATLAB 与编程\n\
    \n通过根据程序的语法规则，正确组合 MATLAB 中定义的所有对象，你可以构建有用的数学研究编程代码。程序通常由一系列指令组成，在这些指令中计算值、为值分配名称，并在后续计算中重用这些值。\n\
    \n与 C 或 FORTRAN 等编程语言一样，在 MATLAB 中你可以编写包含循环、控制流和条件判断的程序。MATLAB 可以编写过程式程序，即它可以定义一系列要执行的标准步骤。与\
    \ C 或 Pascal 一样，可以使用`Do`、`For`或`While`循环进行重复计算。MATLAB 语言还包括条件结构，例如`If—Then—Else`。MATLAB\
