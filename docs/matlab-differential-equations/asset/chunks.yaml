    ## 脚本


    脚本是最简单的 M 文件。脚本没有输入或输出参数。它仅包含 MATLAB 顺序执行的指令，这些指令也可以按顺序在命令窗口中提交。脚本对工作区中的现有数据或脚本创建的新数据进行操作。脚本使用的任何变量都将保留在工作区中，并可在脚本结束后用于后续计算。


    以下是一个脚本示例，该脚本生成极坐标形式的几条曲线，代表花瓣。将脚本语法输入编辑器（图 6-6）后，通过单击按钮 ![A978-1-4842-0310-1_6_Figb_HTML.jpg](img/A978-1-4842-0310-1_6_Figb_HTML.jpg)
