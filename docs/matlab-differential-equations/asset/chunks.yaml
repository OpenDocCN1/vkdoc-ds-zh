    where {c [i] } is a set of arbitrary constants.


    The equation:


    ![A978-1-4842-0310-1_3_Fige_HTML.jpg](A978-1-4842-0310-1_3_Fige_HTML.jpg)


    is called the characteristic equation of the homogeneous differential equation
    with constant coefficients. The solutions of this characteristic equation determine
