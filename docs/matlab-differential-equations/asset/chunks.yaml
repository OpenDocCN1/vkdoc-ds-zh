  raw: '## Systems of Linear Non-Homogeneous Equations with Constant Coefficients


    Now let us consider systems of non-homogeneous differential equations with constant
    coefficients of the form X’ = AX + F(t).


    The general solution of the homogeneous system X’ = AX takes the form X = f (t)C.
    A particular solution of the non-homogeneous system is:


    ![A978-1-4842-0310-1_5_Figi_HTML.jpg](A978-1-4842-0310-1_5_Figi_HTML.jpg)


    The general solution of the non-homogeneous system will be X = f (t)C + X p, which
    is, using the previous expression:


    ![A978-1-4842-0310-1_5_Figj_HTML.jpg](A978-1-4842-0310-1_5_Figj_HTML.jpg)


    This method is a generalization to systems of equations of the method of variation
    of parameters for simple equations.


    MATLAB can solve such systems of equations directly with the command dsolve or
    maple(‘dsolve''), provided the integrals that appear in the solution can be evaluated.


