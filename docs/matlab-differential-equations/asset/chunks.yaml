    equation. If the roots m [i] of the characteristic equation of the homogeneous
    equation are all different, the general solution of the non-homogeneous equation
    is:


    ![A978-1-4842-0310-1_3_Figs_HTML.jpg](A978-1-4842-0310-1_3_Figs_HTML.jpg)


    If some of the roots are repeated, we refer to the general form of the solution
    of a homogeneous equation discussed earlier.


