  trans: "\n# 偏微分方程\n\nMATLAB 的基本模块具有求解带初边值条件的偏微分方程和偏微分方程组的功能。用于计算解的基本函数是`pedepe`，用于评估这些解的基本函数是`pdeval`。\n\
    \n函数`pedepe`的语法如下：\n\n```\nSol = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan)\n\
    Sol = pdepe(m, pdefun, icfun, bcfun, xmesh, tspan, options)\nSun = pdepe(m, pdefun,\
    \ icfun, bcfun, xmesh, tspan, options, p1, p2...)\n```\n\n参数 `m` 根据问题的对称性（分别对应块状、圆柱状或球状）取值为\
    \ 0、1 或 2。参数 `pdefun` 定义微分方程的组成，`icfun` 定义初始条件，`bcfun` 定义边界条件，`xmesh` 和 `tspan`\
    \ 是指定数值解所需点 `[x[0], x[1], ..., x[n]]` 和 `[t[0], t[1], ..., t[f]]` 的向量（n, f ≥ 3），`options`\
    \ 指定底层求解器的某些计算选项（`RelTol`、`AbsTol`、`NormControl`、`InitialStep` 和 `MaxStep` 分别用于指定相对容差、绝对容差、范数容差、初始步长和最大步长），而\
    \ `p1`、`p2`、... 是传递给函数 `pdefun`、`icfun` 和 `bcfun` 的参数。\n\n`pdepe` 求解如下形式的偏微分方程：\n\
    \n![A978-1-4842-0310-1_7_Figi_HTML.jpg](img/A978-1-4842-0310-1_7_Figi_HTML.jpg)\n\
    \n其中 a ≤ x ≤ b 且 t[0] ≤ t ≤ t[f]。此外，对于 t = t[0] 以及所有 x，解分量满足初始条件：\n\n![A978-1-4842-0310-1_7_Figj_HTML.jpg](img/A978-1-4842-0310-1_7_Figj_HTML.jpg)\n\
    \n并且对于所有 t 以及每个 x = a 或 x = b，解分量满足如下形式的边界条件：\n\n![A978-1-4842-0310-1_7_Figk_HTML.jpg](img/A978-1-4842-0310-1_7_Figk_HTML.jpg)\n\
    \n此外，我们有 `a = xmesh(1)`、`b = xmesh(end)`、`tspan(1) = t[0]` 和 `tspan(end) = t[f]`。而且\
    \ `pdefun` 计算偏微分方程中的项 c、f 和 s，因此：\n\n```\n[c, f, s] = pdefun(x, t, u, dudx)\n\
    ```\n\n类似地，`icfun` 评估初始条件：\n\n```\nu = icfun(x)\n```\n\n最后，`bcfun` 评估边界条件中的项 p\
    \ 和 q：\n\n```\n[pl, ql, pr, qr] = bcfun(xl, ul, xr, ur, t)\n```\n\n作为第一个示例，我们求解以下偏微分方程（x\
    \ ∈ [0,1] 且 t ≥ 0）：\n\n![A978-1-4842-0310-1_7_Figl_HTML.jpg](img/A978-1-4842-0310-1_7_Figl_HTML.jpg)\n\
    \n满足初始条件：\n\n![A978-1-4842-0310-1_7_Figm_HTML.jpg](img/A978-1-4842-0310-1_7_Figm_HTML.jpg)\n\
    \n以及边界条件：\n\n![A978-1-4842-0310-1_7_Fign_HTML.jpg](img/A978-1-4842-0310-1_7_Fign_HTML.jpg)\n\
    \n我们首先在 M 文件中定义函数，如图 7-6 到 7-8 所示。\n\n![A978-1-4842-0310-1_7_Fig8_HTML.jpg](img/A978-1-4842-0310-1_7_Fig8_HTML.jpg)\n\
    \n图 7-8.\n\n![A978-1-4842-0310-1_7_Fig7_HTML.jpg](img/A978-1-4842-0310-1_7_Fig7_HTML.jpg)\n\
    \n图 7-7.\n\n![A978-1-4842-0310-1_7_Fig6_HTML.jpg](img/A978-1-4842-0310-1_7_Fig6_HTML.jpg)\n\
    \n图 7-6.\n\n一旦定义了支持函数，我们就定义求解方程的函数（参见图 7-9 中的 M 文件）。\n\n![A978-1-4842-0310-1_7_Fig9_HTML.jpg](img/A978-1-4842-0310-1_7_Fig9_HTML.jpg)\n\
    \n图 7-9.\n\n要查看解（图 7-10 和 7-11），我们在 MATLAB 命令窗口中输入以下内容：\n\n```\n>> pdex1\n```\n\
    \n![A978-1-4842-0310-1_7_Fig11_HTML.jpg](img/A978-1-4842-0310-1_7_Fig11_HTML.jpg)\n\
    \n图 7-11.\n\n![A978-1-4842-0310-1_7_Fig10_HTML.jpg](img/A978-1-4842-0310-1_7_Fig10_HTML.jpg)\n\
    \n图 7-10.\n\n作为第二个示例，我们求解以下偏微分方程组（x ∈ [0,1] 且 t ≥ 0）：\n\n![A978-1-4842-0310-1_7_Figo_HTML.jpg](img/A978-1-4842-0310-1_7_Figo_HTML.jpg)\n\
    \n![A978-1-4842-0310-1_7_Figp_HTML.jpg](img/A978-1-4842-0310-1_7_Figp_HTML.jpg)\n\
    \n满足初始条件：\n\n![A978-1-4842-0310-1_7_Figq_HTML.jpg](img/A978-1-4842-0310-1_7_Figq_HTML.jpg)\n\
    \n以及边界条件：\n\n![A978-1-4842-0310-1_7_Figr_HTML.jpg](img/A978-1-4842-0310-1_7_Figr_HTML.jpg)\n\
    \n为了便于使用函数 `pdepe`，该方程组可以写成：\n\n![A978-1-4842-0310-1_7_Figs_HTML.jpg](img/A978-1-4842-0310-1_7_Figs_HTML.jpg)\n\
    \n左边界条件可以写为：\n\n![A978-1-4842-0310-1_7_Figt_HTML.jpg](img/A978-1-4842-0310-1_7_Figt_HTML.jpg)\n\
