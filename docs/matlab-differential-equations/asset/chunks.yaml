    optimized for the processor. For general scalar calculations, MATLAB generates
    instructions in machine code using JIT (Just-In-Time) technology. Thanks to this
    technology, which is available for most platforms, the execution speeds are much
    faster than for traditional programming languages.


    MATLAB includes development tools, which help efficiently implement algorithms.
    Some of these tools are listed below:


    ![A978-1-4842-0310-1_1_Fig3_HTML.jpg](A978-1-4842-0310-1_1_Fig3_HTML.jpg)


    Figure 1-3.


    *   MATLAB Editor – used for editing functions and standard debugging, for example
    setting breakpoints and running step-by-step simulations

    *   M-Lint Code Checker - analyzes the code and recommends changes to improve
    performance and maintenance (see Figure [1-3](#A978-1-4842-0310-1_1_Chapter.html#Fig3))


    *   MATLAB Profiler - records the time taken to execute each line of code

    *   Directory Reports - scans all files in a directory and creates reports about
    the efficiency of the code, differences between files, dependencies of files and
    code coverage


    You can also use the interactive tool GUIDE (Graphical User Interface Development
    Environment) to design and edit user interfaces. This tool allows you to include
    pick lists, drop-down menus, push buttons, radio buttons and sliders, as well
    as MATLAB diagrams and ActiveX controls. You can also create graphical user interfaces
    by means of programming using MATLAB functions.


    Figure [1-4](#A978-1-4842-0310-1_1_Chapter.html#Fig4) shows a completed wavelet
    analysis tool (below) which has been created using the user interface GUIDE (above).


    ![A978-1-4842-0310-1_1_Fig4_HTML.jpg](A978-1-4842-0310-1_1_Fig4_HTML.jpg)


    Figure 1-4.


    ### Data Access and Analysis


    MATLAB supports the entire process of data analysis, from the acquisition of data
    from external devices and databases, pre-processing, visualization and numerical
    analysis, up to the production of results in presentation quality.


    MATLAB provides interactive tools and command line operations for data analysis,
    which include: sections of data, scaling and averaging, interpolation, thresholding
    and smoothing, correlation, Fourier analysis and filtering, searching for one-dimensional
    peaks and zeros, basic statistics and curve fitting, matrix analysis, etc.


    The diagram in Figure [1-5](#A978-1-4842-0310-1_1_Chapter.html#Fig5) shows a curve
    that has been fitted to atmospheric pressure differences averaged between Easter
    Island and Darwin in Australia.


    ![A978-1-4842-0310-1_1_Fig5_HTML.jpg](A978-1-4842-0310-1_1_Fig5_HTML.jpg)


    Figure 1-5.


    The MATLAB platform allows efficient access to data files, other applications,
    databases and external devices. You can read data stored in most known formats,
    such as Microsoft Excel, ASCII text files or binary image, sound and video files,
    and scientific archives such as HDF and HDF5 files. The binary files for low level
    I/O functions allow you to work with data files in any format. Additional features
    allow you to view Web pages and XML data.


    It is possible to call other applications and languages, such as C, C++, COM,
    DLLs, Java, FORTRAN, and Microsoft Excel objects, and access FTP sites and Web
    services. Using the Database Toolbox, you can even access ODBC/JDBC databases.'
  trans: '

    ## 引言


    MATLAB 是一个用于科学计算和高级编程的平台，它采用交互式环境，使您能够比使用 `C`、`C++` 和 `FORTRAN` 等传统语言更高效地执行复杂的计算任务。它是目前科学和工程领域最流行的平台之一。


    MATLAB 是一个用于算法开发、数据可视化、数据分析和数值分析的交互式高级技术计算环境。MATLAB 适用于解决涉及技术计算的问题，它使用集成在易于使用的命令中的优化算法。


    MATLAB 可用于广泛的应用领域，包括微积分、代数、统计学、计量经济学、质量控制、时间序列、信号与图像处理、通信、控制系统设计、测试与测量系统、金融建模、计算生物学等。称为工具箱（可单独获取的、用于特定目的
    MATLAB 函数集合）的补充工具集扩展了 MATLAB 环境，使您能够解决不同应用领域的特殊问题。


    此外，MATLAB 包含许多允许您记录和共享工作成果的函数。可以将 MATLAB 代码与其他语言和应用程序集成，并分发使用 MATLAB 开发的算法和应用程序。


    以下是 MATLAB 最重要的特性：


    -   它是一种用于技术计算的高级语言

    -   它提供了一个用于管理代码、文件和数据的开发环境

    -   它具有用于探索、设计和迭代求解的交互式工具

    -   它支持用于线性代数、统计学、傅里叶分析、滤波、优化和数值积分的数学函数

    -   它可以生成高质量的二维和三维图形以辅助数据可视化

    -   它包括创建自定义图形用户界面的工具

    -   它可以与外部语言集成，例如 `C/C++`、`FORTRAN`、`Java`、`COM` 和 Microsoft Excel


    MATLAB 开发环境允许您以交互模式开发算法、分析数据、显示数据文件和管理项目（见图 1-1）。


    ![A978-1-4842-0310-1_1_Fig1_HTML.jpg](img/A978-1-4842-0310-1_1_Fig1_HTML.jpg)


    图 1-1。


    ## 开发算法和应用程序


    MATLAB 提供了一种高级编程语言和开发工具，使您能够快速开发和分析算法和应用程序。


    MATLAB 语言包含解决科学和工程问题所必需的向量和矩阵运算。这简化了开发和执行过程。


    使用 MATLAB 语言，编程和开发算法的速度比使用传统语言更快，因为不再需要执行低级管理任务，例如声明变量、指定数据类型和分配内存。在许多情况下，MATLAB
    消除了对 `for` 循环的需求。因此，一行 MATLAB 代码通常可以替换几行 `C` 或 `C++` 代码。


    同时，MATLAB 提供了传统编程语言的所有特性，包括算术运算符、控制流、数据结构、数据类型、面向对象编程 (OOP) 和调试。


    图 1-2 展示了一个通信调制算法，它生成 1024 个随机比特、执行调制、添加复高斯噪声并以图形方式表示结果，所有这些仅用九行 MATLAB 代码即可完成。


    ![A978-1-4842-0310-1_1_Fig2_HTML.jpg](img/A978-1-4842-0310-1_1_Fig2_HTML.jpg)


    图 1-2。


    MATLAB 使您能够一次执行一个命令或一组命令，无需编译或链接，并重复执行以获得最优解。


    为了快速执行复杂的向量和矩阵计算，MATLAB 使用针对处理器优化的库。对于一般的标量计算，MATLAB 使用 JIT（即时编译）技术生成机器码指令。得益于这项在大多数平台上都可用的技术，其执行速度比传统编程语言快得多。


    MATLAB 包含有助于高效实现算法的开发工具。下面列出了其中一些工具：


    ![A978-1-4842-0310-1_1_Fig3_HTML.jpg](img/A978-1-4842-0310-1_1_Fig3_HTML.jpg)


    图 1-3。


    -   MATLAB 编辑器——用于编辑函数和标准调试，例如设置断点和逐步运行仿真

    -   M-Lint 代码检查器——分析代码并建议更改以提升性能和可维护性（见图 1-3）

    -   MATLAB 分析器——记录执行每一行代码所花费的时间

    -   目录报告——扫描目录中的所有文件，并生成关于代码效率、文件间差异、文件依赖关系和代码覆盖率的报告


    您还可以使用交互式工具 `GUIDE`（图形用户界面开发环境）来设计和编辑用户界面。该工具允许您包含选择列表、下拉菜单、按钮、单选按钮和滑块，以及 MATLAB
    图表和 ActiveX 控件。您还可以通过使用 MATLAB 函数编程来创建图形用户界面。


    图 1-4 展示了一个使用用户界面 `GUIDE`（上方）创建的完整小波分析工具（下方）。


    ![A978-1-4842-0310-1_1_Fig4_HTML.jpg](img/A978-1-4842-0310-1_1_Fig4_HTML.jpg)


    图 1-4。


    ## 数据访问与分析


    MATLAB 支持数据分析的整个过程，从从外部设备和数据库采集数据、预处理、可视化和数值分析，直至生成具有演示质量的结果。


    MATLAB 为数据分析提供了交互式工具和命令行操作，包括：数据分段、缩放与平均、插值、阈值处理与平滑、相关性、傅里叶分析与滤波、一维峰值和零点搜索、基本统计与曲线拟合、矩阵分析等。


    图 1-5 中的图表显示了一条拟合于复活节岛和澳大利亚达尔文之间平均气压差的曲线。


    ![A978-1-4842-0310-1_1_Fig5_HTML.jpg](img/A978-1-4842-0310-1_1_Fig5_HTML.jpg)


    图 1-5。


    MATLAB 平台允许高效访问数据文件、其他应用程序、数据库和外部设备。您可以读取以大多数已知格式存储的数据，例如 Microsoft Excel、ASCII
    文本文件或二进制图像、声音和视频文件，以及诸如 `HDF` 和 `HDF5` 文件之类的科学档案。用于低级 I/O 函数的二进制文件允许您处理任何格式的数据文件。附加功能允许您查看网页和
    XML 数据。


    可以调用其他应用程序和语言，例如 `C`、`C++`、`COM`、`DLL`、`Java`、`FORTRAN` 和 Microsoft Excel 对象，并访问
    FTP 站点和 Web 服务。使用数据库工具箱，您甚至可以访问 `ODBC/JDBC` 数据库。

    '
- fmt: '### Data Visualization


    All graphics functions necessary to visualize scientific and engineering data
    are available in `MATLAB`. This includes tools for two- and three-dimensional
    diagrams, three-dimensional volume visualization, tools to create diagrams interactively,
    and the ability to export using the most popular graphic formats. It is possible
    to customize diagrams, adding multiple axes, changing the colors of lines and
    markers, adding annotations, `LaTeX` equations and legends and plotting paths.


    Various two-dimensional graphical representations of vector data can be created,
    including:


    *   Line, area, bar and sector diagrams

    *   Direction and velocity diagrams

    *   Histograms

    *   Polygons and surfaces

    *   Dispersion bubble diagrams

    *   Animations


    Figure [1-6](#A978-1-4842-0310-1_1_Chapter.html#Fig6) shows linear plots of the
    results of several emission tests of a motor, with a curve fitted to the data.


    ![A978-1-4842-0310-1_1_Fig6_HTML.jpg](A978-1-4842-0310-1_1_Fig6_HTML.jpg)


    Figure 1-6.


    `MATLAB` also provides functions for displaying two-dimensional arrays, three-dimensional
    scalar data and three-dimensional vector data. It is possible to use these functions
    to visualize and understand large amounts of complex multi-dimensional data. It
    is also possible to define the characteristics of the diagrams, such as the orientation
    of the camera, perspective, lighting, light source and transparency. Three-dimensional
    diagramming features include:


    *   Surface, contour and mesh plots

    *   Space curves

    *   Cone, phase, flow and isosurface diagrams


    Figure [1-7](#A978-1-4842-0310-1_1_Chapter.html#Fig7) shows a three-dimensional
    diagram of an isosurface that reveals the geodesic structure of a fullerene carbon-60
    molecule.


    ![A978-1-4842-0310-1_1_Fig7_HTML.jpg](A978-1-4842-0310-1_1_Fig7_HTML.jpg)


    Figure 1-7.


    `MATLAB` includes interactive tools for graphic editing and design. From a `MATLAB`
    diagram, you can perform any of the following tasks:


    *   Drag and drop new sets of data into the figure

    *   Change the properties of any object in the figure

    *   Change the zoom, rotation, view (i.e. panoramic), camera angle and lighting

    *   Add data labels and annotations

    *   Draw shapes

    *   Generate an `M-file` for reuse with different data


    Figure [1-8](#A978-1-4842-0310-1_1_Chapter.html#Fig8) shows a collection of graphics
    which have been created interactively by dragging data sets onto the diagram window,
    making new subdiagrams, changing properties such as colors and fonts, and adding
    annotations.


    ![A978-1-4842-0310-1_1_Fig8_HTML.jpg](A978-1-4842-0310-1_1_Fig8_HTML.jpg)


    Figure 1-8.


    `MATLAB` is compatible with all the well-known data file and graphics formats,
    such as `GIF`, `JPEG`, `BMP`, `EPS`, `TIFF`, `PNG`, `HDF`, `AVI`, and `PCX`. As
    a result, it is possible to export `MATLAB` diagrams to other applications, such
    as `Microsoft Word` and `Microsoft Powerpoint`, or desktop publishing software.
    Before exporting, you can create and apply style templates that contain all the
    design details, fonts, line thickness, etc., necessary to comply with the publication
    specifications.


    ### Numerical Calculation


    `MATLAB` contains mathematical, statistical, and engineering functions that support
    most of the operations carried out in those fields. These functions, developed
    by math experts, are the foundation of the `MATLAB` language. To cite some examples,
    `MATLAB` implements mathematical functions and data analysis in the following
    areas:


    *   Manipulation of matrices and linear algebra

    *   Polynomials and interpolation

    *   Fourier analysis and filters

    *   Statistics and data analysis

    *   Optimization and numerical integration

    *   Ordinary differential equations (ODEs)

    *   Partial differential equations (PDEs)

    *   Sparse matrix operations


    ### Publication of Results and Distribution of Applications


    In addition, `MATLAB` contains a number of functions which allow you to document
    and share your work. You can integrate your `MATLAB` code with other languages
    and applications, and distribute your algorithms and `MATLAB` applications as
    autonomous programs or software modules.


    `MATLAB` allows you to export the results in the form of a diagram or as a complete
    report. You can export diagrams to all popular graphics formats and then import
    them into other packages such as `Microsoft Word` or `Microsoft PowerPoint`. Using
    the `MATLAB Editor`, you can automatically publish your `MATLAB` code in `HTML`
    format, `Word`, `LaTeX`, etc. For example, Figure [1-9](#A978-1-4842-0310-1_1_Chapter.html#Fig9)
    shows an `M-file` (left) published in `HTML` (right) using the `MATLAB Editor`.
    The results, which are sent to the `Command Window` or to diagrams, are captured
    and included in the document and the comments become titles and text in `HTML`.


    ![A978-1-4842-0310-1_1_Fig9_HTML.jpg](A978-1-4842-0310-1_1_Fig9_HTML.jpg)


    Figure 1-9.


    It is possible to create more complex reports, such as mock executions and various
    parameter tests, using `MATLAB Report Generator` (available separately).


    `MATLAB` provides functions enabling you to integrate your `MATLAB` applications
    with `C` and `C++` code, `FORTRAN` code, `COM` objects, and `Java` code. You can
    call `DLLs` and `Java` classes and `ActiveX` controls. Using the `MATLAB engine`
    library, you can also call `MATLAB` from `C`, `C++`, or `FORTRAN` code.


    You can create algorithms in `MATLAB` and distribute them to other users of `MATLAB`.
    Using the `MATLAB Compiler` (available separately), algorithms can be distributed,
    either as standalone applications or as software modules included in a project,
    to users who do not have `MATLAB`. Additional products are able to turn algorithms
    into a software module that can be called from `COM` or `Microsoft Excel`.'
