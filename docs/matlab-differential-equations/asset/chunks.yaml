    \n图 6-18.\n\n我们现在运行该 M 文件。\n\n```\n>> while1\nn =\n    70\n```\n\n### IF ELSEIF\
    \ ELSE END 循环\n\n与大多数结构化编程语言一样，MATLAB 也包含`IF-ELSEIF-ELSE-END`结构。使用此结构，可以在满足某些条件时运行脚本。循环语法如下：\n\
    \n```\nif condition\n    commands\nend\n```\n\n在这种情况下，如果条件为真，则执行命令。但此循环的语法可能更通用。\n\
    \n```\nif condition\n    commands1\nelse\n    commands2\nend\n```\n\n在这种情况下，如果条件为真，则执行`commands1`；如果条件为假，则执行`commands2`。\n\
