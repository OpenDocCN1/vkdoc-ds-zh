    Figure 6-8.


    ![A978-1-4842-0310-1_6_Fig7_HTML.jpg](A978-1-4842-0310-1_6_Fig7_HTML.jpg)


    Figure 6-7.


    ![A978-1-4842-0310-1_6_Fig6_HTML.jpg](A978-1-4842-0310-1_6_Fig6_HTML.jpg)


    Figure 6-6.


    ## Functions and M-Files. Function, Eval and Feval


    We already know that MATLAB has a wide variety of functions that can be used in
    everyday work with the program. But, in addition, the program also offers the
    possibility of custom defined functions. The most common way to define a function
    is to write its definition to a text file, called an M-file, which will be permanent
    and will therefore enable the function to be used whenever required.


    MATLAB is usually used in command mode (or interactive mode), in which case a
    command is written in a single line in the Command Window and is immediately processed.
    But MATLAB also allows the implementation of sets of commands in batch mode, in
    which case a sequence of commands can be submitted which were previously written
    in a file. This file (M-file) must be stored on disk with the extension `.m` in
    the MATLAB subdirectory, using any ASCII editor or by selecting M-file New from
    the File menu in the top menu bar, which opens a text editor that will allow you
    to write command lines and save the file with a given name. Selecting M-File Open
    from the File menu in the top menu bar allows you to edit any pre-existing M-file.


    To run an M-file simply type its name (without extension) in interactive mode
    into the Command Window and press Enter. MATLAB sequentially interprets all commands
    and statements of the M-file line by line and executes them. Normally the literal
    commands that MATLAB is performing do not appear on screen, except when the command
    `echo on` is active and only the results of successive executions of the interpreted
    commands are displayed. Normally, work in batch mode is useful when automating
    large scale tedious processes which, if done manually, would be prone to mistakes.
    You can enter explanatory text and comments into M-files by starting each line
    of the comment with the symbol `%`. The `help` command can be used to display
    comments made in a particular M-file.


    The command `function` allows the definition of functions in MATLAB, making it
    one of the most useful applications of M-files. The syntax of this command is
    as follows:


    ```

    function output_parameters = function_name (input_parameters)

    the function body

    ```


    Once the function has been defined, it is stored in an M-file for later use. It
    is also useful to enter some explanatory text in the syntax of the function (using
    `%`), which can be accessed later by using the `help` command.


    When there is more than one output parameter, they are placed between square brackets
    and separated by commas. If there is more than one input parameter, they are separated
    by commas. The body of the function is the syntax that defines it, and should
    include commands or instructions that assign values to output parameters. Each
    command or instruction of the body often appears in a line that ends either with
    a comma or, when variables are being defined, by a semicolon (in order to avoid
    duplication of outputs when executing the function). The function is stored in
    the M-file named `function_name.m`.


    Let us define the function `fun1(x) = x ^ 3 - 2 x + cos(x)`, creating the corresponding
    M-file `fun1.m`. To define this function in MATLAB select M-file New from the
    File menu in the top menu bar (or click the button ![A978-1-4842-0310-1_6_Figc_HTML.jpg](A978-1-4842-0310-1_6_Figc_HTML.jpg)
    in the MATLAB tool bar). This opens the MATLAB Editor/Debugger text editor that
    will allow us to insert command lines defining the function, as shown in Figure
    [6-11](#A978-1-4842-0310-1_6_Chapter.html#Fig11).


    ![A978-1-4842-0310-1_6_Fig11_HTML.jpg](A978-1-4842-0310-1_6_Fig11_HTML.jpg)


    Figure 6-11.'
