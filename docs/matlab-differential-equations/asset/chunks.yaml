    # 7. Ordinary and Partial Differential Equations with Initial and Boundary Values


    ## Numerical Solutions of Differential Equations


    MATLAB provides commands in its Basic module allowing for the numerical solution
    of ordinary differential equations (ODEs), differential algebraic equations (DAEs)
    and boundary value problems. It is also possible to solve systems of differential
    equations with boundary values and parabolic and elliptic partial differential
    equations.'
