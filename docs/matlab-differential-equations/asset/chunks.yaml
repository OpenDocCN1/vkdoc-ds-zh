    Otherwise, the equation is called non-homogeneous. If the functions a [i] (x)
    (i = 1, …, n) are constant, the equation is said to have constant coefficients.


    A concept of great importance in this context is that of a set of linearly independent
    functions. A set of functions { f [1](x), f [2](x), …, f [n] (x)} is linearly
    independent if, for any x in their common domain of definition, the Wronskian
    determinant of the functions is non-zero. The Wronskian determinant of the given
    set of functions, at a point x of their common domain of definition, is defined
    as follows:


    ![A978-1-4842-0310-1_3_Figb_HTML.jpg](A978-1-4842-0310-1_3_Figb_HTML.jpg)


