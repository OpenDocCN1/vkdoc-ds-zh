        `2      cos(x)`


    `- -----------`


          `1/2  1/2`


         `x   pi`


    # 4. Differential Equations Via Approximation Methods


    ## Higher Order Equations and Approximation Methods


    When the known algebraic methods for solving differential equations and systems
    of differential equations offer no solution, we usually resort to methods of approximation.
    The approximation methods can involve both symbolic and numerical work. The symbolic
    approach yields approximate algebraic solutions, and its most representative technique
    is the Taylor series method. The numerical approach yields a solution in the form
    of a finite set of solution points, to which a curve can be fitted by various
    algebraic methods (interpolation, regression,…). This curve will be an approximate
    solution of the differential equation. Among the most common numerical methods
    is the Runge–Kutta method.


    Approximation methods are most commonly employed to find the solution of equations
    and systems of differential equations of order and degree greater than one, where
    the exact solution cannot be obtained by other methods.'
