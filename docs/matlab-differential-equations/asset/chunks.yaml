    ## Separation of Variables


    A differential equation is said to have separable variables if it can be written
    in the form


    ![A978-1-4842-0310-1_2_Figa_HTML.jpg](A978-1-4842-0310-1_2_Figa_HTML.jpg)


    This type of equation can be solved immediately by putting ![A978-1-4842-0310-1_2_Figb_HTML.jpg](A978-1-4842-0310-1_2_Figb_HTML.jpg)


    If MATLAB cannot directly solve a differential equation with the function dsolve,
    then we can try to express it in the above form and solve the given integrals
    algebraically, which does not present particular difficulties for the program,
    given its versatility in symbolic computation.


    EXERCISE 2-1


    Solve the differential equation:


    ![A978-1-4842-0310-1_2_Figc_HTML.jpg](A978-1-4842-0310-1_2_Figc_HTML.jpg)


    First of all we try to solve it directly. The equation can be written in the form:


    ![A978-1-4842-0310-1_2_Figd_HTML.jpg](A978-1-4842-0310-1_2_Figd_HTML.jpg)


    `» dsolve(''Dy = y * cos(x) /(1+y^2)'')`


    `ans =`


                                                               `0`


    `exp(C33 + t*cos(x))*exp(-wrightOmega(2*C33 + 2*t*cos(x))/2)`


    Thus the differential equation appears not to be solvable with dsolve. However,
    in this case, the variables are separable, so we can solve the equation as follows:


    `» pretty(solve(''int(cos(x), x) = int((1+y^2) / y, y)''))`


      `+-                          -+`


      `|         /           2 \    |`


      `|         |          y  |    |`


      `|     asin| log(y) + -- |    |`


      `|         \          2  /    |`


      `|                            |`


      `|           /           2 \  |`


      `|           |          y  |  |`


      `|  pi - asin| log(y) + -- |  |`


      `|           \          2  /  |`


      `+-                          -+`


    Thus, after a little rearrangement, we see that the general solution is given
    by:


    ![A978-1-4842-0310-1_2_Fige_HTML.jpg](A978-1-4842-0310-1_2_Fige_HTML.jpg)


    We now find the value of the constant C via the initial condition, putting x =
    0 and y = 1.


    `» C = simple(''solve(subs(x = 0, y = 1, sin(x) = log(y) + 1/2 * y ^ 2 + C), C)'')`


    `C =`


    `-1/2`


    Thus the final solution is ![A978-1-4842-0310-1_2_Figf_HTML.jpg](A978-1-4842-0310-1_2_Figf_HTML.jpg)


    In the same way you can solve any other differential equation with separable variables.


    The above differential equation is also solvable directly by using:


    `» pretty(maple(''dsolve(diff(y(x), x) = y(x) * cos(x) /(1 + y(x) ^ 2), y(x))''))`


                                              `2`


                          `log(y(x)) + 1/2 y(x) - sin(x) = _C1`


    ## Homogeneous Differential Equations


    Consider a general differential equation of first degree and first order of the
    form


    ![A978-1-4842-0310-1_2_Figg_HTML.jpg](A978-1-4842-0310-1_2_Figg_HTML.jpg)


    This equation is said to be homogeneous of degree n if the functions M and N satisfy:


    ![A978-1-4842-0310-1_2_Figh_HTML.jpg](A978-1-4842-0310-1_2_Figh_HTML.jpg)


    For this type of equation, we can transform the initial differential equation
    (with variables x and y), via the change of variable x = vy, into another (separable)
    equation (with variables v and y). The new equation is solved by separation of
    variables and then the solution of the original equation is found by reversing
    the change of variable.


    EXERCISE 2-2


    Solve the differential equation:


    ![A978-1-4842-0310-1_2_Figi_HTML.jpg](A978-1-4842-0310-1_2_Figi_HTML.jpg)


    First we check if the equation is homogeneous


    `» maple(''m:=(x,y) - > x ^ 2 - y ^ 2'');`


    `» maple(''n:=(x,y) - > x * y '');`


    `» factor(''m(t*x,t*y)'')`


    `ans =`


    `t ^ 2 *(x-y) *(x + y)`


    `» factor(''n(t*x,t*y)'')`


    `ans =`


    `t ^ 2 * x * y`


    Thus the equation is homogeneous of degree 2\. To solve it we apply the change
    of variable x = vy.


    Before performing the change of variable, it is advisable to load the library
    difforms, using the command maple(‘with(difforms)’), which will allow you to work
    with differential forms. Once this library is loaded it is also convenient to
    use the command maple(‘defform(v=0,x=0,y=0)’), which allows you to declare all
    variables which will not be constants or parameters in the differentiation.


    `» maple(''with(difforms)'');`


    `» maple(''defform(v=0,x=0,y=0)'');`


    Now we can make the change of variable x = vy, and group the terms in d(v) and
    d(y).


    `» simplify(''subs(x = v * y m(x,y) * d(x) + n(x,y) * d(y))'')`


    `ans =`


    `v ^ 2 * y ^ 3 * d(v) + v ^ 3 * y ^ 2 * d(y) - y ^ 3 * d(v)`


    `» pretty(maple(''collect(v ^ 2 * y ^ 3 * d(v) + v ^ 3 * y ^ 2 * d(y) - y ^ 3
    * d(v) {d(v), d(y)})''))`


    `2  2    2                       2`


    `(v  y  - y )(y d(v) + v d(y)) + y  v d(y)`


    If we divide the previous expression by v³y³, and group the terms in d(v) and
    d(y), we already have an equation in separated variables.


    `» pretty(maple(''collect(((v^2*y^3-y^3) * d(v) + v ^ 3 * y ^ 2 * d(y)) /(v^3*y^3),
    {d(v), d(y)})''))`


    `2  3    3`


    `(v  y  - y ) d(v)    d(y)`


    `----------------- + ----`


    `3  3           y`


    `v  y`


    The previous expression can be simplified.


    `» pretty(maple(''convert(collect(((v^2*y^3-y^3) * d(v) + v ^ 3 * y ^ 2 * d(y))
    /(v^3*y^3), {d(v), d(y)}), parfrac, y)''))`


    `2`


    `(v  - 1) d(v)    d(y)`


    `------------- + ----`


    `3          y`


    `v`


    Now, we solve the equation:


    `» pretty(simple(''int((v^2-1)/v ^ 3, v) + int(1/y,y)''))`


    `1`


    `log(v) + ---- + log(y)`


    `2`


    `2 v`


    Finally we reverse the change of variable:


    `» pretty(simple(''subs(v = x / y log(v) + 1/2/v ^ 2 + log(y))''))`


    `2`


    `y`


    `log(x) + 1/2 ----`


    `2`


    `x`


    Thus the general solution of the original differential equation is:


    ![A978-1-4842-0310-1_2_Figj_HTML.jpg](A978-1-4842-0310-1_2_Figj_HTML.jpg)


    Now we can represent the solutions of this differential equation graphically.
    To do this we graph the solutions with parameter C, which is equivalent to the
    following contour plot of the function defined by the left-hand side of the above
    general solution (see Figure 18-1):


    `» [x,y]=meshgrid(0.1:0.05:1/2,-1:0.05:1);`


    `» z=y.^2./(2*x.^2)+log(x);`


    `» contour(z,65)`


    ![A978-1-4842-0310-1_2_Fig1_HTML.jpg](A978-1-4842-0310-1_2_Fig1_HTML.jpg)


    Figure 2-1.'
