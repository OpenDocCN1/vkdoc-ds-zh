    `» W=maple(''Wronskian(indfunctions,x)'')`


    `W =`


    `[exp(x),          x*exp(x),                     x^2*exp(x)]`


    `[exp(x),   exp(x)+x*exp(x),          2*x*exp(x)+x^2*exp(x)]`


