    Figure 6-2.


    ![A978-1-4842-0310-1_6_Fig1_HTML.jpg](A978-1-4842-0310-1_6_Fig1_HTML.jpg)


    Figure 6-1.


    Figure [6-5](#A978-1-4842-0310-1_6_Chapter.html#Fig5) shows the functions of the
    icons in the Editor/Debugger.


    ![A978-1-4842-0310-1_6_Fig5_HTML.jpg](A978-1-4842-0310-1_6_Fig5_HTML.jpg)


    Figure 6-5.


    ## Scripts


    Scripts are the simplest possible M-files. A script has no input or output arguments.
    It simply consists of instructions that MATLAB executes sequentially and that
    could also be submitted in a sequence in the Command Window. Scripts operate with
    existing data on the workspace or new data created by the script. Any variable
    that is used by a script will remain in the workspace and can be used in further
    calculations after the end of the script.


    Below is an example of a script that generates several curves in polar form, representing
    flower petals. Once the syntax of the script has been entered into the editor
    (Figure [6-6](#A978-1-4842-0310-1_6_Chapter.html#Fig6)), it is stored in the work
    library (work) and simultaneously executes by clicking the button ![A978-1-4842-0310-1_6_Figb_HTML.jpg](A978-1-4842-0310-1_6_Figb_HTML.jpg)
    or by selecting the option Save and run from the Debug menu (or pressing F5).
    To move from one chart to the next press ENTER.


    ![A978-1-4842-0310-1_6_Fig10_HTML.jpg](A978-1-4842-0310-1_6_Fig10_HTML.jpg)


    Figure 6-10.


    ![A978-1-4842-0310-1_6_Fig9_HTML.jpg](A978-1-4842-0310-1_6_Fig9_HTML.jpg)


    Figure 6-9.


