- fmt: "Define the function `f(x)` as:\n\n![A978-1-4842-0310-1_8_Figll_HTML.jpg](A978-1-4842-0310-1_8_Figll_HTML.jpg)\n\
    \nand study its continuity on the real line.\n\nExcept at the point `x = 0` the\
    \ continuity is clear. To analyze the behavior of the function at the point `x\
    \ = 0` we calculate the lateral limits as `x→0`:\n\n```\n>> syms x\nlimit(1/(1+exp(1/x)),x,0,'right')\n\
    ans =\n0\n>> limit(1/(1+exp(1/x)),x,0,'left')\nans =\n1\n```\n\nThe limit of the\
    \ function as `x→0` does not exist because the lateral limits are different. But,\
    \ since the lateral limits are finite, the discontinuity at `x = 0` is a finite\
    \ jump (also known as a discontinuity of the first kind). We illustrate this result\
    \ in the graph shown in Figure [8-4](#A978-1-4842-0310-1_8_Chapter.html#Fig4).\n\
    \n```\n>> fplot('1/(1+exp(1/x))',[-5,5])\n```\n\n![A978-1-4842-0310-1_8_Fig4_HTML.jpg](A978-1-4842-0310-1_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4. EXERCISE 8-8\n\nStudy the continuity of the function `f: R²→R` defined\
    \ by:\n\n![A978-1-4842-0310-1_8_Figmm_HTML.jpg](A978-1-4842-0310-1_8_Figmm_HTML.jpg)\n\
    \nSince the function is clearly continuous elsewhere, we only need to check the\
    \ continuity of the function at `(1,0)`. We need to show that:\n\n![A978-1-4842-0310-1_8_Fignn_HTML.jpg](A978-1-4842-0310-1_8_Fignn_HTML.jpg)\n\
    \n```\n» syms x y m a r\n» limit (limit (y ^ 2 *(x-1) ^ 2 / (y ^ 2 +(x-1) ^ 2),\
    \ x, 0), y, 0)\nans =\n0\n» limit (limit (y ^ 2 *(x-1) ^ 2 / (y ^ 2 + (x-1) ^\
    \ 2), y, 0), x, 0)\nans =\n0\n» limit((m*x)^2*(x-1)^2/((m*x)^2+(x-1)^2),x,0)\n\
    ans=\n0\n» limit ((m*x) *(x-1) ^ 2/((m*x) +(x-1) ^ 2), x, 0)\nans =\n```\n\nThus\
    \ we see that the iterated and directional limits (along the lines `y = mx`) coincide,\
    \ which leads us to believe that the limit exists and that its value is zero.\
    \ To corroborate these results we calculate the limit in polar coordinates:\n\n\
    ```\n» limit (limit ((r ^ 2 * sin (a) ^ 2) * (r * cos (a) - 1) ^ 2 / ((r ^ 2 *\
    \ sin (a) ^ 2)\n+ (r * cos (a) - 1) ^ 2), r, 1), a, 0)\nans =\n0\n```\n\nWe conclude\
    \ that the limit is zero at the point `(1,0)`, which ensures the continuity of\
    \ the function. In Figure [8-5](#A978-1-4842-0310-1_8_Chapter.html#Fig5) we graph\
    \ the surface defined by `f`, and in particular illustrate the continuity and\
    \ the tendency to 0 of the function in a neighborhood of the point `(1,0)`.\n\n\
    ```\n» [x, y] = meshgrid(0:0.05:2,-2:0.05:2);\nz=y.^2.*(x-1).^2./(y.^2+(x-1).^2);\n\
    mesh(x,y,z), view ([- 23, 30])\n```\n\n![A978-1-4842-0310-1_8_Fig5_HTML.jpg](A978-1-4842-0310-1_8_Fig5_HTML.jpg)\n\
    \nFigure 8-5. EXERCISE 8-9\n\nFind the sum of each of the following series:\n\n\
    ![A978-1-4842-0310-1_8_Figoo_HTML.jpg](A978-1-4842-0310-1_8_Figoo_HTML.jpg)\n\n\
    ![A978-1-4842-0310-1_8_Figpp_HTML.jpg](A978-1-4842-0310-1_8_Figpp_HTML.jpg)\n\n\
    where `p` is a parameter.\n\nBefore finding the sums we first need to determine\
    \ whether the series do indeed converge. We apply the ratio test for the first\
    \ series:\n\n```\n>> syms n\n>> f=(3+2*n)/((1-n)*n*7^n);\n>> pretty(f)\n3 + 2\
    \ n\n------------\n        n\n(1 - n) n 7\n>> limit(subs(f,n,n+1)/f,n,inf)\nans\
    \ =\n1/7\n```\n\nAs the limit is less than 1, the series is convergent. We will\
    \ calculate its sum. The result MATLAB returns will often be complicated and depend\
    \ on certain special functions. We obtain the following:\n\n```\n>> S1 = symsum(f,n,2,inf)\n\
