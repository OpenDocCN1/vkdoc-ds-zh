  raw: '## Exact Differential Equations


    The differential equation


    ![A978-1-4842-0310-1_2_Figk_HTML.jpg](A978-1-4842-0310-1_2_Figk_HTML.jpg)


    is said to be exact if ![A978-1-4842-0310-1_2_Figl_HTML.jpg](A978-1-4842-0310-1_2_Figl_HTML.jpg).
    If the equation is exact, then there exists a function F such that its total differential
    dF coincides with the left-hand side of the above equation, i.e.:


    ![A978-1-4842-0310-1_2_Figm_HTML.jpg](A978-1-4842-0310-1_2_Figm_HTML.jpg)


    therefore the family of solutions is given by F(x,y) = C.


    The exercise below follows the usual steps of an algebraic solution to this type
    of equation.


    EXERCISE 2-3


    Solve the differential equation:


    ![A978-1-4842-0310-1_2_Fign_HTML.jpg](A978-1-4842-0310-1_2_Fign_HTML.jpg)


    First of all, we try to solve the equation with dsolve:


    `» maple(''m:=(x,y) - > - 1 + y * exp(x*y) + y * cos(x*y)'');`


    `» maple(''n:=(x,y) - > 1 + x * exp(x*y) + x * cos(x*y)'');`


    `» dsolve(''m(x,y) + n(x,y) * Dy = 0'')`


    `??? Error using ==> dsolve`


    `Explicit solution could not be found.`


    Thus the function dsolve does not give a solution to the proposed equation. We
    are going to try to solve the equation using the classical algebraic method.


    First we check that the proposed differential equation is exact.


    `» pretty(simple(diff(''m(x,y)'',''y'')))`


    `exp(y x) + x y exp(y x) + cos(y x) - x sin(y x) y`


    `» pretty(simple(diff(''n(x,y)'',''x'')))`


    `exp(y x) + x y exp(y x) + cos(y x) - x sin(y x) y`


    Since the equation is exact, we can find the solution in the following way:


    `» solution1 = simplify(''int(m(x,y), x) + g(y)'')`


    `solution1 =`


    `-x+exp(y*x) + sin(y*x) + g(y)`


    Now we find the function g(y) via the following condition:


    ![A978-1-4842-0310-1_2_Figo_HTML.jpg](A978-1-4842-0310-1_2_Figo_HTML.jpg)


    `» pretty(simplify(''int(m(x,y), x) + g(y)''))`


                       `-x + exp(y x) + sin(y x) + g(y)`


    `» pretty(simplify(''diff(-x+exp(y*x) + sin(y*x) + g(y), y)''))`


                                                   `d`


                      `x exp(y x) x + x cos(y x) + -- g(y)`


                                                  `dy`


    `» simplify(''solve(x * exp(y*x) + x * cos(y*x) + diff(g(y), y) = n(x,y), diff(g(y),
    y))'')`


    `ans =`


    `1`


    Thus g''(y) = 1, so the final solution will be, omitting the addition of a constant:


    `» pretty(simplify(''subs(g(y) = int(1,y),-x+exp(y*x) + sin(y*x) + g(y))''))`


    `-x + exp(y x) + sin(y x) + y`


    To graphically represent the family of solutions, we draw the following contour
    plot of the above expression (Figure 18-2):


    `» [x,y]=meshgrid(-2*pi/3:.2:2*pi/3);`


    `» z =-x+exp(y.*x) + sin(y.*x) + y;`


    `» contour(z,100)`


    ![A978-1-4842-0310-1_2_Fig2_HTML.jpg](A978-1-4842-0310-1_2_Fig2_HTML.jpg)


    Figure 2-2.


    In the following section we will see how any reducible differential equation can
    be transformed to an exact equation using an integrating factor.


    ## Linear Differential Equations


    A linear first order differential equation is an equation of the form:


    ![A978-1-4842-0310-1_2_Figp_HTML.jpg](A978-1-4842-0310-1_2_Figp_HTML.jpg)


    where P(x) and Q(x) are given functions of x.


    Differential equations of this type can be transformed into exact equations by
    multiplying both sides of the equation by the integrating factor:


    ![A978-1-4842-0310-1_2_Figq_HTML.jpg](A978-1-4842-0310-1_2_Figq_HTML.jpg)


    and the general solution is then given by the expression:


    ![A978-1-4842-0310-1_2_Figr_HTML.jpg](A978-1-4842-0310-1_2_Figr_HTML.jpg)


