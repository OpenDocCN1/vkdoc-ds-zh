    parentheses versus square brackets, spaces and punctuation (particularly commas
    and semicolons).


    ## Help with Commands


    We have already seen in the previous chapter how you can get help using MATLAB’s
    drop down menus.


    But, in addition, support can also be obtained via commands (instructions or functions),
    implemented as MATLAB objects.


    You can use the help command to get immediate access to diverse information.


    `» help`


    `HELP topics:`


    `matlab\general       -  General purpose commands.`


    `matlab\ops           -  Operators and special characters.`


    `matlab\lang          -  Programming language constructs.`


