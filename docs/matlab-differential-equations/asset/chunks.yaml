    ## 函数与 M 文件。Function、Eval 和 Feval


    我们已经知道 MATLAB 拥有大量函数，可用于程序的日常工作中。但是，此外，该程序还提供了自定义函数的可能性。定义函数最常见的方式是将其定义写入一个称为
    M 文件的文本文件，该文件是永久性的，因此可以在需要时随时使用该函数。


    MATLAB 通常以命令模式（或交互模式）使用，此时在命令窗口中写入一行命令并立即处理。但 MATLAB 也允许以批处理模式执行命令集，此时可以提交事先写入文件的一系列命令。此文件（M
    文件）必须使用任何 ASCII 编辑器，或通过选择顶部菜单栏“文件”菜单中的“新建 M 文件”来保存到磁盘上的 MATLAB 子目录中，扩展名为 `.m`。这会打开一个文本编辑器，允许您写入命令行并以指定名称保存文件。选择顶部菜单栏“文件”菜单中的“打开
    M 文件”可编辑任何预先存在的 M 文件。


    要运行 M 文件，只需在交互模式下在命令窗口中键入其名称（不带扩展名）并按 Enter 键。MATLAB 会逐行顺序解释 M 文件中的所有命令和语句并执行它们。通常，MATLAB
    正在执行的文字命令不会显示在屏幕上，除非 `echo on` 命令处于活动状态，此时只会显示解释命令的连续执行结果。通常，在自动化大规模繁琐过程时，批处理模式很有用，这些过程如果手动完成，则容易出现错误。您可以通过使用符号
    `%` 开始注释的每一行，向 M 文件中输入解释性文本和注释。`help` 命令可用于显示特定 M 文件中的注释。


    `function` 命令允许在 MATLAB 中定义函数，使其成为 M 文件最有用的应用之一。此命令的语法如下：


    ```

    function 输出参数 = 函数名 (输入参数)

    函数体

    ```


    函数定义完成后，将存储在 M 文件中以备后用。在函数语法中（使用 `%`）输入一些解释性文本也很有用，稍后可以使用 `help` 命令访问这些文本。


    当有多个输出参数时，将它们放在方括号内并用逗号分隔。如果有多个输入参数，则用逗号分隔。函数体是定义它的语法，并且应包括为输出参数赋值的命令或指令。函数体的每个命令或指令通常出现在一行中，该行以逗号结尾，或者在定义变量时以分号结尾（以避免在执行函数时重复输出）。该函数存储在名为
    `函数名.m` 的 M 文件中。


    让我们定义函数 `fun1(x) = x ^ 3 - 2 x + cos(x)`，创建相应的 M 文件 `fun1.m`。要在 MATLAB 中定义此函数，请选择顶部菜单栏“文件”菜单中的“新建
    M 文件”（或单击 MATLAB 工具栏中的按钮 ![A978-1-4842-0310-1_6_Figc_HTML.jpg](img/A978-1-4842-0310-1_6_Figc_HTML.jpg)）。这将打开
    MATLAB 编辑器/调试器文本编辑器，允许我们插入定义该函数的命令行，如图 6-11 所示。


    ![A978-1-4842-0310-1_6_Fig11_HTML.jpg](img/A978-1-4842-0310-1_6_Fig11_HTML.jpg)


    图 6-11.

