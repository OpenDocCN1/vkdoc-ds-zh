- fmt: "# 8. Symbolic Differential and Integral Calculus\n\n## Symbolic Computation\
    \ with MATLAB. Symbolic Variables\n\nMATLAB’s Symbolic Math Toolbox module allows\
    \ you to easily manipulate and operate on formulae and expressions symbolically.\
    \ It is possible to expand, factor and simplify polynomials and rational and trigonometric\
    \ expressions; find algebraic solutions of polynomial equations and systems of\
    \ equations; evaluate derivatives and integrals symbolically; find symbolic solutions\
    \ of differential equations; manipulate powers, limits and many other facets of\
    \ algebraic series. To do this, MATLAB first requires that all variables (or algebraic\
    \ expressions) are declared as symbolic with the command `syms` (or `sym`). For\
    \ example, if we want to treat `6*a*b + 3*a² + 2*a*b` as a symbolic expression\
    \ and simplify it, we first need to declare the two variables `a` and `b` as symbolic\
    \ as follows:\n\n```\n>> syms a b\n>> simplify(6*a*b + 3*a^2 + 2*a*b)\nans =\n\
    8 * a * b + 3 * a ^ 2\n```\n\nAlternatively, we could have used the following\
    \ expression:\n\n```\n>> simplify(sym('6*a*b + 3*a^2 + 2*a*b'))\nans =\n8 * a\
    \ * b + 3 * a ^2\n```\n\nThe MATLAB symbolic mathtoolbox provides several commands\
    \ which can be used to define and manipulate symbolic variables. These are described\
    \ below:\n\n| `syms x y z… t` | Creates symbolic variables `x`, `y`, `z`,…, `t`.\
    \ |\n| `syms x y z… t real` | Creates symbolic variables `x`, `y`, `z`,…, `t`\
    \ and assumes they are real. |\n| `syms x y z… t unreal` | Creates symbolic variables\
    \ `x`, `y`, `z`,…, `t` and assumes that they are not real. |\n| `syms` | Lists\
    \ the symbolic variables in the workspace. |\n| `x = sym ('x')` | The variable\
    \ `x` becomes symbolic (equivalent to `syms x`). |\n| `x = sym ('x', real)` |\
    \ The variable `x` becomes a real symbolic variable. |\n| `x = sym('x',unreal)`\
    \ | The variable `x` becomes a non-real symbolic variable. |\n| `s = sym (A)`\
    \ | Creates a symbolic object from `A`, where `A` may be a string, a scalar, an\
    \ array, a numeric expression, etc. |\n| `s = sym (A, 'option')` | Converts an\
    \ array, scalar or numeric expression `A` to a symbolic object according to the\
    \ specified option. The option can be `'f'` for floating point, `'r'` for rational,\
    \ `'e'` for an error format or `'d'` for decimal. |\n| `double(x)` | Converts\
    \ the variable or expression `x` to numeric double-precision. |\n| `sym2poly (poly)`\
    \ | Returns a vector whose components are the coefficients the symbolic polynomial\
    \ `poly`. |\n| `poly2sym (vector)` | Returns a symbolic polynomial whose coefficients\
    \ are the components of the vector `vector`. |\n| `poly2sym(vector, 'v')` | Returns\
    \ a symbolic polynomial in the variable `v` whose coefficients are the components\
    \ of the vector `vector`. |\n| `char (X)` | Converts the array `X` of non-negative\
    \ integers (interpreted as ASCII values) into a character string. |\n| `latex\
    \ (S)` | Convers the symbolic expression `S` into Latex code. |\n| `ccode (S)`\
    \ | Converts a symbolic expression `S` into C code. |\n| `fortran (s)` | Converts\
    \ a symbolic expression `S` into Fortran code. |\n| `pretty (expr)` | Converts\
    \ a symbolic expression into typeset mathematics. |\n| `digits (d)` | Returns\
    \ symbolic variables with a precision of `d` significant decimal digits. |\n|\
    \ `digits` | Returns the current accuracy for symbolic variables. |\n| `vpa (expr)`\
    \ | Returns the numerical result of the expression to the number of significant\
    \ digits specified by `digits`. |\n| `vpa (expr, n)` | Returns the numerical result\
    \ of the expression to `n` significant decimal digits. |\n| `vpa('expr', n)` |\
    \ Numerical result of the expression to `n` significant decimal digits. |\n| `findsym\
    \ (S)` | Returns all the symbolic variables in the symbolic expression or symbolic\
    \ matrix `S`. |\n| `isvarname (S)` | Returns `TRUE` if `S` is a valid symbolic\
    \ variable. |\n| `vectorize (S)` | Inserts a point in the string `S` before any\
    \ symbol `^`, `*` or `/`. |\n\nAs a first example we consider `H = 3a² − 2a +\
    \ 7`, `F = 6a³ − 5a + 2` and `G = 5a² + 4a − 3`, and calculate: `H + F + G`, `H\
    \ − F + G` and `H − F − G`.\n\n```\n>> syms a\n>> H = 3*a^2 - 2*a + 7; F = 6*a^3\
    \ - 5*a + 2; G = 5*a^2 + 4*a - 3;\n>> pretty(H+F+G)\n2                3\n8 a \
    \ - 3 a + 6 + 6 a\n>> pretty(H-F+G)\n2                3\n8 a  + 7 a + 2 - 6 a\n\
    >> pretty(H-F-G)\n2              3\n-2 a  - a + 8 - 6 a\n```\n\nIn the following\
    \ example, we carry out the following symbolic rational operations:\n\n![A978-1-4842-0310-1_8_Figa_HTML.jpg](A978-1-4842-0310-1_8_Figa_HTML.jpg)\n\
    \nWe will begin by defining the variables `a`, `b` and `c` as symbolic and subsequently\
    \ perform the specified operations.\n\n```\n>> syms a b c\n>> pretty(1/(2*a)+1/(3*b)+1/(4*a)+1/(5*b)+1/(6*c))\n\
    3/4 1/a + 8/15 1/b + 1/6 1/c\n>> pretty((1-a)^9/(1-a)^3)\n6\n(1 - a)\n>> pretty(1/(1+a)+1/(1+a)^2+1/(1+a)^3)\n\
    1        1          1\n----- + -------- + --------\n1 + a           2        \
    \  3\n       (1 + a)    (1 + a)\n>> pretty (simplify (1 /(1+a) + 1 /(1+a) ^ 2\
    \ + 1 /(1+a) ^ 3))\n2\n3 + 3 a + a\n------------\n3\n(1 + a)\n```\n\nNext we calculate\
    \ ![A978-1-4842-0310-1_8_Figb_HTML.jpg](A978-1-4842-0310-1_8_Figb_HTML.jpg) and\
    \ ![A978-1-4842-0310-1_8_Figc_HTML.jpg](A978-1-4842-0310-1_8_Figc_HTML.jpg) symbolically.\n\
    \n```\n>> pretty(sym(sqrt(2)+3*sqrt(2)-sqrt(2)/2))\n1/2\n7/2 2\n>> pretty (sym\
    \ (1 / (1 + sqrt (2)) + 1 / (1-sqrt (2))))\n-2\n```\n\nIn the following example,\
    \ we calculate ![A978-1-4842-0310-1_8_Figd_HTML.jpg](A978-1-4842-0310-1_8_Figd_HTML.jpg)\
    \ symbolically and pass the result to numerical form.\n\n```\n>> r=sym(1/(2+sqrt(5)))\n\
    r =\n8505245244017276*2^(-55)\n>> numeric(r)\nans =\n0.24\n```\n\nWe then solve\
    \ the equation `x⁴ + 1 = 0` and present the result in typeset mathematical form.\n\
    \n```\n>> solve('x^4+1=0')\nans =\n[  1/2*2^(1/2)+1/2*i*2^(1/2)]\n[ -1/2*2^(1/2)-1/2*i*2^(1/2)]\n\
    [  1/2*2^(1/2)-1/2*i*2^(1/2)]\n[ -1/2*2^(1/2)+1/2*i*2^(1/2)]\n>> pretty(solve('x^4+1=0'))\n\
    [      1/2          1/2 ]\n[1/2/2 + 1/2 i 2]\n[                       ]\n[   \
    \    1/2          1/2]\n[-1/2 2 - 1/2 i 2]\n[                       ]\n[     \
    \ 1/2          1/2 ]\n[1/2 2 - 1/2 i 2]\n[                       ]\n[       1/2\
    \          1/2]\n[-1/2 2 + 1/2 i 2]\n```\n\nNext we transform a vector to a polynomial\
    \ and vice versa.\n\n```\n>> pretty(poly2sym([1 0 9 6 2]))\n4      2\nx  + 9 x\
    \  + 6 x + 2\n>> sym2poly(x^4+9*x^2+6*x+2)\nans =\n1.00 0 9.00 6.00 2.00\n```\n\
    \nBelow is a Hilbert matrix of order 2 whose entries have been evaluated to five\
    \ significant decimal digits.\n\n```\n>> vpa (hilb (2), 5)\nans =\n[1.,. 50000]\n\
    [. 50000,. 33333]\n```\n\nIn the following example we define a symbolic matrix\
    \ and calculate its determinant.\n\n```\n>> syms x\nA = [cos(a*x), sin(a*x);-sin(a*x),\
    \ cos(a*x)]\nA =\n[cos(a*x), sin(a*x)]\n[-sin(a*x), cos(a*x)]\n>> det (A)\nans\
    \ =\ncos(a*x) ^ 2 + sin(a*x) ^ 2\n```\n\nNext we define the previous symbolic\
    \ matrix in an alternative form and calculate its inverse.\n\n```\n>> A = sym\
    \ ([cos(a*x), sin(a*x);-sin(a*x), cos(a*x)])\nA =\n[cos(a*x), sin(a*x)]\n[-sin(a*x),\
    \ cos(a*x)]\n>> pretty (inv (A))\n[cos(a x)      sin(a x)]\n[--------    - --------]\n\
    [   %1            %1   ]\n[                      ]\n[sin(a x)     cos (a x)]\n\
    [--------     -------- ]\n[   %1           %1    ]\n2           2\n%1: = cos(a\
    \ x) + sin(a x)\n```\n\nIn the following example, we calculate `1/2 + 1/3` symbolically,\
    \ set the numerical precision to 25 digits and calculate the numerical value of\
    \ the same expression. We finish by checking the current level of numerical accuracy.\n\
    \n```\n>> sym(1/2+1/3)\nans =\n5/6\n>> digits(25)\nvpa('1/2+1/3')\nans =\n.8333333333333333333333333\n\
    >> digits\ndigits = 25\n```\n\nIn the following example the ASCII characters whose\
    \ numeric codes are 93, 126 and 115 are obtained.\n\n```\n>> char (93,126,115)\n\
    ans =\n]\n∼\ns\n```\n\nThe following example transforms the series expansion of\
    \ `ln(1 + x)` into Latex code, C code and FORTRAN code\n\n```\n>> syms x\n>> f\
    \ = taylor(log(1+x));\n>> latex(f)\nans =\nx-1/2\\,{x}^{2}+1/3\\,{x}^{3}-1/4\\\
    ,{x}^{4}+1/5\\,{x}^{5}\n>> ccode(f)\nans =\nA = x-x*x/2.0+x*x*x/3.0-x*x*x*x/4.0+x*x*x*x*x/5.0;\n\
    >> fortran(f)\nans =\nA = x-x**2/2+x**3/3-x**4/4+x**5/5\n```"
  raw: '# 8. Symbolic Differential and Integral Calculus


    ## Symbolic Computation with MATLAB. Symbolic Variables


    MATLAB’s Symbolic Math Toolbox module allows you to easily manipulate and operate
    on formulae and expressions symbolically. It is possible to expand, factor and
    simplify polynomials and rational and trigonometric expressions; find algebraic
    solutions of polynomial equations and systems of equations; evaluate derivatives
    and integrals symbolically; find symbolic solutions of differential equations;
    manipulate powers, limits and many other facets of algebraic series. To do this,
    MATLAB first requires that all variables (or algebraic expressions) are declared
    as symbolic with the command syms (or sym). For example, if we want to treat 6
    *a*b + 3 *a ² + 2 *a*b as a symbolic expression and simplify it, we first need
    to declare the two variables a and b as symbolic as follows:


    `>> syms a b`


    `>> simplify(6*a*b + 3*a^2 + 2*a*b)`


    `ans =`


    `8 * a * b + 3 * a ^ 2`


    Alternatively, we could have used the following expression:


    `>> simplify(sym(''6*a*b + 3*a^2 + 2*a*b''))`


    `ans =`


    `8 * a * b + 3 * a ^2`


    The MATLAB symbolic mathtoolbox provides several commands which can be used to
    define and manipulate symbolic variables. These are described below:


    | syms x y z… t | Creates symbolic variables x, y, z,…, t. |

    | syms x y z… t real | Creates symbolic variables x, y, z,…, t and assumes they
    are real. |

    | syms x y z… t unreal | Creates symbolic variables x, y, z,…, t and assumes that
    they are not real. |

    | syms | Lists the symbolic variables in the workspace. |

    | x = sym (‘x’) | The variable x becomes symbolic (equivalent to syms x). |

    | x = sym (‘x’, real) | The variable x becomes a real symbolic variable. |

    | x = sym(‘x’,unreal) | The variable x becomes a non-real symbolic variable. |

    | s = sym (A) | Creates a symbolic object from A, where A may be a string, a scalar,
    an array, a numeric expression, etc. |

    | s = sym (A, ‘option’) | Converts an array, scalar or numeric expression A to
    a symbolic object according to the specified option. The option can be ‘f’ for
    floating point, ‘r’ for rational, ‘e’ for an error format or ‘d’ for decimal.
    |

    | double(x) | Converts the variable or expression x to numeric double-precision.
    |

    | sym2poly (poly) | Returns a vector whose components are the coefficients the
    symbolic polynomial poly. |

    | poly2sym (vector) | Returns a symbolic polynomial whose coefficients are the
    components of the vector vector. |

    | poly2sym(vector, ‘v’) | Returns a symbolic polynomial in the variable v whose
    coefficients are the components of the vector vector. |

    | char (X) | Converts the array X of non-negative integers (interpreted as ASCII
    values) into a character string. |

    | latex (S) | Convers the symbolic expression S into Latex code. |

    | ccode (S) | Converts a symbolic expression S into C code. |

    | fortran (s) | Converts a symbolic expression S into Fortran code. |

    | pretty (expr) | Converts a symbolic expression into typeset mathematics. |

    | digits (d) | Returns symbolic variables with a precision of d significant decimal
    digits. |

    | digits | Returns the current accuracy for symbolic variables. |

    | vpa (expr) | Returns the numerical result of the expression to the number of
    significant digits specified by digits. |

    | vpa (expr, n) | Returns the numerical result of the expression to n significant
    decimal digits. |

    | vpa(‘expr’, n) | Numerical result of the expression to n significant decimal
    digits. |

    | findsym (S) | Returns all the symbolic variables in the symbolic expression
    or symbolic matrix S. |

    | isvarname (S) | Returns TRUE if S is a valid symbolic variable. |

    | vectorize (S) | Inserts a point in the string S before any symbol ^, * or /
    . |


    As a first example we consider H = 3a ² − 2a + 7, F = 6a ³ − 5a + 2 and G = 5a
    ² + 4a − 3, and calculate: H + F + G, H − F + G and H − F − G.


    `>> syms a`


    `>> H = 3*a^2 - 2*a + 7; F = 6*a^3 - 5*a + 2; G = 5*a^2 + 4*a - 3;`


    `>> pretty(H+F+G)`


    `2                3`


    `8 a  - 3 a + 6 + 6 a`


    `>> pretty(H-F+G)`


    `2                3`


    `8 a  + 7 a + 2 - 6 a`


    `>> pretty(H-F-G)`


    `2              3`


    `-2 a  - a + 8 - 6 a`


    In the following example, we carry out the following symbolic rational operations:


    ![A978-1-4842-0310-1_8_Figa_HTML.jpg](A978-1-4842-0310-1_8_Figa_HTML.jpg)


    We will begin by defining the variables a, b and c as symbolic and subsequently
    perform the specified operations.


    `>> syms a b c`


    `>> pretty(1/(2*a)+1/(3*b)+1/(4*a)+1/(5*b)+1/(6*c))`


    `3/4 1/a + 8/15 1/b + 1/6 1/c`


    `>> pretty((1-a)^9/(1-a)^3)`


    `6`


    `(1 - a)`


    `>> pretty(1/(1+a)+1/(1+a)^2+1/(1+a)^3)`


    `1        1          1`


    `----- + -------- + --------`


    `1 + a           2          3`


    `(1 + a)    (1 + a)`


    `>> pretty (simplify (1 /(1+a) + 1 /(1+a) ^ 2 + 1 /(1+a) ^ 3))`


    `2`


    `3 + 3 a + a`


    `------------`


    `3`


    `(1 + a)`


    Next we calculate ![A978-1-4842-0310-1_8_Figb_HTML.jpg](A978-1-4842-0310-1_8_Figb_HTML.jpg)
    and ![A978-1-4842-0310-1_8_Figc_HTML.jpg](A978-1-4842-0310-1_8_Figc_HTML.jpg)
    symbolically.


    `>> pretty(sym(sqrt(2)+3*sqrt(2)-sqrt(2)/2))`


    `1/2`


    `7/2 2`


    `>> pretty (sym (1 / (1 + sqrt (2)) + 1 / (1-sqrt (2))))`


    `-2`


    In the following example, we calculate ![A978-1-4842-0310-1_8_Figd_HTML.jpg](A978-1-4842-0310-1_8_Figd_HTML.jpg)
    symbolically and pass the result to numerical form.


    `>> r=sym(1/(2+sqrt(5)))`


    `r =`


    `8505245244017276*2^(-55)`


    `>> numeric(r)`


    `ans =`


    `0.24`


    We then solve the equation x ⁴+ 1 = 0 and present the result in typeset mathematical
    form.


    `>> solve(''x^4+1=0'')`


    `ans =`


    `[  1/2*2^(1/2)+1/2*i*2^(1/2)]`


    `[ -1/2*2^(1/2)-1/2*i*2^(1/2)]`


    `[  1/2*2^(1/2)-1/2*i*2^(1/2)]`


    `[ -1/2*2^(1/2)+1/2*i*2^(1/2)]`


    `>> pretty(solve(''x^4+1=0''))`


    `[      1/2          1/2 ]`


    `[1/2/2 + 1/2 i 2]`


    `[                       ]`


    `[       1/2          1/2]`


    `[-1/2 2 - 1/2 i 2]`


    `[                       ]`


    `[      1/2          1/2 ]`


    `[1/2 2 - 1/2 i 2]`


    `[                       ]`


    `[       1/2          1/2]`


    `[-1/2 2 + 1/2 i 2]`


    Next we transform a vector to a polynomial and vice versa.


    `>> pretty(poly2sym([1 0 9 6 2]))`


    `4      2`


    `x  + 9 x  + 6 x + 2`


    `>> sym2poly(x^4+9*x^2+6*x+2)`


    `ans =`


    `1.00 0 9.00 6.00 2.00`


    Below is a Hilbert matrix of order 2 whose entries have been evaluated to five
    significant decimal digits.


    `>> vpa (hilb (2), 5)`


    `ans =`


    `[1.,. 50000]`


    `[. 50000,. 33333]`


    In the following example we define a symbolic matrix and calculate its determinant.


    `>> syms x`


    `A = [cos(a*x), sin(a*x);-sin(a*x), cos(a*x)]`


    `A =`


    `[cos(a*x), sin(a*x)]`


    `[-sin(a*x), cos(a*x)]`


    `>> det (A)`


    `ans =`


    `cos(a*x) ^ 2 + sin(a*x) ^ 2`


    Next we define the previous symbolic matrix in an alternative form and calculate
    its inverse.


    `>> A = sym ([cos(a*x), sin(a*x);-sin(a*x), cos(a*x)])`


    `A =`


    `[cos(a*x), sin(a*x)]`


    `[-sin(a*x), cos(a*x)]`


    `>> pretty (inv (A))`


    `[cos(a x)      sin(a x)]`


    `[--------    - --------]`


    `[   %1            %1   ]`


    `[                      ]`


    `[sin(a x)     cos (a x)]`


    `[--------     -------- ]`


    `[   %1           %1    ]`


    `2           2`


    `%1: = cos(a x) + sin(a x)`


    In the following example, we calculate 1/2 + 1/3 symbolically, set the numerical
    precision to 25 digits and calculate the numerical value of the same expression.
    We finish by checking the current level of numerical accuracy.


    `>> sym(1/2+1/3)`


    `ans =`


    `5/6`


    `>> digits(25)`


    `vpa(''1/2+1/3'')`


    `ans =`


    `.8333333333333333333333333`


    `>> digits`


    `digits = 25`


    In the following example the ASCII characters whose numeric codes are 93, 126
    and 115 are obtained.


    `>> char (93,126,115)`


    `ans =`


    `]`


    `∼`


    `s`


    The following example transforms the series expansion of ln(1 +x) into Latex code,
    C code and FORTRAN code


    `>> syms x`


    `>> f = taylor(log(1+x));`


    `>> latex(f)`


    `ans =`


    `x-1/2\,{x}^{2}+1/3\,{x}^{3}-1/4\,{x}^{4}+1/5\,{x}^{5}`


    `>> ccode(f)`


    `ans =`


    `A = x-x*x/2.0+x*x*x/3.0-x*x*x*x/4.0+x*x*x*x*x/5.0;`


    `>> fortran(f)`


    `ans =`


    `A = x-x**2/2+x**3/3-x**4/4+x**5/5`'
  trans: "\n# 8. 符号微分与积分\n\n## 使用 MATLAB 进行符号计算。符号变量\n\nMATLAB 的符号数学工具箱模块允许你轻松地对公式和表达式进行符号化地操作和处理。你可以展开、因式分解和简化多项式、有理式和三角函数式；求解多项式方程和方程组的代数解；符号化地计算导数和积分；求解微分方程的符号解；处理幂、极限以及代数级数的许多其他方面。为此，MATLAB\
    \ 首先要求所有变量（或代数表达式）使用命令 `syms`（或 `sym`）声明为符号变量。例如，如果我们想将 `6*a*b + 3*a² + 2*a*b`\
    \ 视为一个符号表达式并简化它，我们首先需要将变量 `a` 和 `b` 声明为符号变量，如下所示：\n\n```\n>> syms a b\n>> simplify(6*a*b\
    \ + 3*a² + 2*a*b)\nans =\n8 * a * b + 3 * a ^ 2\n```\n\n或者，我们可以使用以下表达式：\n\n```\n\
    >> simplify(sym('6*a*b + 3*a² + 2*a*b'))\nans =\n8 * a * b + 3 * a ²\n```\n\n\
    MATLAB 的符号数学工具箱提供了几个可用于定义和操作符号变量的命令。下面将对这些命令进行描述：\n\n| `syms x y z… t` | 创建符号变量\
    \ `x`, `y`, `z`,…, `t`。 |\n| `syms x y z… t real` | 创建符号变量 `x`, `y`, `z`,…, `t`\
    \ 并假定它们是实数。 |\n| `syms x y z… t unreal` | 创建符号变量 `x`, `y`, `z`,…, `t` 并假定它们不是实数。\
    \ |\n| `syms` | 列出工作区中的符号变量。 |\n| `x = sym ('x')` | 变量 `x` 成为符号变量（等同于 `syms x`）。\
    \ |\n| `x = sym ('x', real)` | 变量 `x` 成为实数符号变量。 |\n| `x = sym('x',unreal)` | 变量\
    \ `x` 成为非实数符号变量。 |\n| `s = sym (A)` | 从 `A` 创建一个符号对象，其中 `A` 可以是字符串、标量、数组、数值表达式等。\
    \ |\n| `s = sym (A, 'option')` | 将数组、标量或数值表达式 `A` 根据指定选项转换为符号对象。选项可以是 `'f'`（浮点）、`'r'`（有理数）、`'e'`（错误格式）或\
    \ `'d'`（十进制）。 |\n| `double(x)` | 将变量或表达式 `x` 转换为双精度数值。 |\n| `sym2poly (poly)`\
    \ | 返回一个向量，其分量是符号多项式 `poly` 的系数。 |\n| `poly2sym (vector)` | 返回一个符号多项式，其系数是向量 `vector`\
    \ 的分量。 |\n| `poly2sym(vector, 'v')` | 返回一个变量为 `v` 的符号多项式，其系数是向量 `vector` 的分量。\
    \ |\n| `char (X)` | 将非负整数数组 `X`（解释为 ASCII 值）转换为字符串。 |\n| `latex (S)` | 将符号表达式\
    \ `S` 转换为 Latex 代码。 |\n| `ccode (S)` | 将符号表达式 `S` 转换为 C 代码。 |\n| `fortran (s)`\
    \ | 将符号表达式 `S` 转换为 Fortran 代码。 |\n| `pretty (expr)` | 将符号表达式转换为排印数学格式。 |\n| `digits\
    \ (d)` | 返回具有 `d` 位有效十进制数字精度的符号变量。 |\n| `digits` | 返回当前符号变量的精度。 |\n| `vpa (expr)`\
    \ | 返回表达式在由 `digits` 指定的有效数字位数下的数值结果。 |\n| `vpa (expr, n)` | 返回表达式在 `n` 位有效十进制数字下的数值结果。\
    \ |\n| `vpa('expr', n)` | 表达式在 `n` 位有效十进制数字下的数值结果。 |\n| `findsym (S)` | 返回符号表达式或符号矩阵\
    \ `S` 中的所有符号变量。 |\n| `isvarname (S)` | 如果 `S` 是有效的符号变量名，则返回 `TRUE`。 |\n| `vectorize\
    \ (S)` | 在字符串 `S` 中任何符号 `^`、`*` 或 `/` 之前插入一个点。 |\n\n作为第一个示例，我们考虑 `H = 3a² − 2a\
    \ + 7`，`F = 6a³ − 5a + 2` 和 `G = 5a² + 4a − 3`，并计算：`H + F + G`，`H − F + G` 和 `H\
    \ − F − G`。\n\n```\n>> syms a\n>> H = 3*a² - 2*a + 7; F = 6*a³ - 5*a + 2; G =\
    \ 5*a² + 4*a - 3;\n>> pretty(H+F+G)\n2                3\n8 a  - 3 a + 6 + 6 a\n\
    >> pretty(H-F+G)\n2                3\n8 a  + 7 a + 2 - 6 a\n>> pretty(H-F-G)\n\
    2              3\n-2 a  - a + 8 - 6 a\n```\n\n在下面的示例中，我们执行以下符号有理运算：\n\n![A978-1-4842-0310-1_8_Figa_HTML.jpg](img/A978-1-4842-0310-1_8_Figa_HTML.jpg)\n\
    \n我们将首先将变量 `a`、`b` 和 `c` 定义为符号变量，然后执行指定的运算。\n\n```\n>> syms a b c\n>> pretty(1/(2*a)+1/(3*b)+1/(4*a)+1/(5*b)+1/(6*c))\n\
    3/4 1/a + 8/15 1/b + 1/6 1/c\n>> pretty((1-a)⁹/(1-a)³)\n6\n(1 - a)\n>> pretty(1/(1+a)+1/(1+a)²+1/(1+a)³)\n\
    1        1          1\n----- + -------- + --------\n1 + a           2        \
    \  3\n       (1 + a)    (1 + a)\n>> pretty (simplify (1 /(1+a) + 1 /(1+a) ^ 2\
    \ + 1 /(1+a) ^ 3))\n2\n3 + 3 a + a\n------------\n3\n(1 + a)\n```\n\n接下来，我们符号化计算\
    \ ![A978-1-4842-0310-1_8_Figb_HTML.jpg](img/A978-1-4842-0310-1_8_Figb_HTML.jpg)\
    \ 和 ![A978-1-4842-0310-1_8_Figc_HTML.jpg](img/A978-1-4842-0310-1_8_Figc_HTML.jpg)。\n\
    \n```\n>> pretty(sym(sqrt(2)+3*sqrt(2)-sqrt(2)/2))\n1/2\n7/2 2\n>> pretty (sym\
    \ (1 / (1 + sqrt (2)) + 1 / (1-sqrt (2))))\n-2\n```\n\n在下面的示例中，我们符号化计算 ![A978-1-4842-0310-1_8_Figd_HTML.jpg](img/A978-1-4842-0310-1_8_Figd_HTML.jpg)\
    \ 并将结果转换为数值形式。\n\n```\n>> r=sym(1/(2+sqrt(5)))\nr =\n8505245244017276*2^(-55)\n\
    >> numeric(r)\nans =\n0.24\n```\n\n然后我们求解方程 `x⁴ + 1 = 0` 并以排印数学格式呈现结果。\n\n```\n\
    >> solve('x⁴+1=0')\nans =\n[  1/2*2^(1/2)+1/2*i*2^(1/2)]\n[ -1/2*2^(1/2)-1/2*i*2^(1/2)]\n\
    [  1/2*2^(1/2)-1/2*i*2^(1/2)]\n[ -1/2*2^(1/2)+1/2*i*2^(1/2)]\n>> pretty(solve('x⁴+1=0'))\n\
    [      1/2          1/2 ]\n[1/2/2 + 1/2 i 2]\n[                       ]\n[   \
    \    1/2          1/2]\n[-1/2 2 - 1/2 i 2]\n[                       ]\n[     \
    \ 1/2          1/2 ]\n[1/2 2 - 1/2 i 2]\n[                       ]\n[       1/2\
    \          1/2]\n[-1/2 2 + 1/2 i 2]\n```\n\n接下来，我们将向量转换为多项式，反之亦然。\n\n```\n>> pretty(poly2sym([1\
    \ 0 9 6 2]))\n4      2\nx  + 9 x  + 6 x + 2\n>> sym2poly(x⁴+9*x²+6*x+2)\nans =\n\
    1.00 0 9.00 6.00 2.00\n```\n\n下面是一个 2 阶 Hilbert 矩阵，其元素已计算到五位有效十进制数字。\n\n```\n\
    >> vpa (hilb (2), 5)\nans =\n[1.,. 50000]\n[. 50000,. 33333]\n```\n\n在下面的示例中，我们定义一个符号矩阵并计算其行列式。\n\
    \n```\n>> syms x\nA = [cos(a*x), sin(a*x);-sin(a*x), cos(a*x)]\nA =\n[cos(a*x),\
    \ sin(a*x)]\n[-sin(a*x), cos(a*x)]\n>> det (A)\nans =\ncos(a*x) ^ 2 + sin(a*x)\
    \ ^ 2\n```\n\n接下来，我们用另一种形式定义之前的符号矩阵并计算其逆矩阵。\n\n```\n>> A = sym ([cos(a*x), sin(a*x);-sin(a*x),\
    \ cos(a*x)])\nA =\n[cos(a*x), sin(a*x)]\n[-sin(a*x), cos(a*x)]\n>> pretty (inv\
    \ (A))\n[cos(a x)      sin(a x)]\n[--------    - --------]\n[   %1           \
    \ %1   ]\n[                      ]\n[sin(a x)     cos (a x)]\n[--------     --------\
    \ ]\n[   %1           %1    ]\n2           2\n%1: = cos(a x) + sin(a x)\n```\n\
    \n在以下示例中，我们符号化计算 `1/2 + 1/3`，将数值精度设置为 25 位数字，并计算同一表达式的数值。最后，我们检查当前的数值精度水平。\n\n\
    ```\n>> sym(1/2+1/3)\nans =\n5/6\n>> digits(25)\nvpa('1/2+1/3')\nans =\n.8333333333333333333333333\n\
    >> digits\ndigits = 25\n```\n\n在以下示例中，获得了数字代码为 93、126 和 115 的 ASCII 字符。\n\n```\n\
    >> char (93,126,115)\nans =\n]\n∼\ns\n```\n\n以下示例将 `ln(1 + x)` 的级数展开转换为 Latex\
    \ 代码、C 代码和 FORTRAN 代码。\n\n```\n>> syms x\n>> f = taylor(log(1+x));\n>> latex(f)\n\
    ans =\nx-1/2\\,{x}^{2}+1/3\\,{x}^{3}-1/4\\,{x}^{4}+1/5\\,{x}^{5}\n>> ccode(f)\n\
    ans =\nA = x-x*x/2.0+x*x*x/3.0-x*x*x*x/4.0+x*x*x*x*x/5.0;\n>> fortran(f)\nans\
    \ =\nA = x-x**2/2+x**3/3-x**4/4+x**5/5\n```\n"
- fmt: '# Symbolic Functions. Substitution and Functional Operations


    MATLAB’s symbolic mathematics module allows you to define symbolic functions directly
    using the syntax `f = ‘function’` (or `f = function`) provided the variables have
    previously been defined as symbolic with `syms`.


    Once a symbolic function has been explicitly defined, it is possible to substitute
    values for the variables in the function, i.e., calculate the value of the function
    at a given point, using the commands shown below:


    | `subs(f, a)` | Applies the function `f` at the point `a`. |

    | `subs(f,a,b)` | Substitutes `b` in place of `a` in the function `f`. |

    | `subs(f, variable, value)` | Replaces the variable `variable` by the value `value`
    in the function `f`. |

    | `subs(f, {x,y,…}, {a,b,…})` | Replaces the variables `{x, y,…}` respectively
    by the values `{a, b,…}` in the function `f`. |


    As a first example we define the function `f(x) = x^3` and calculate `f(2)` and
    `f(b+2)`.


    ```

    >> f=''x^3''


    f =


    x^3


    >> A=subs(f,2)


    A =


    8


    >> syms b


    >> B=subs(f,b+2)


    B =


    (b+2) ^ 3

    ```


    In the following example we consider the two-variable function `f(a, b) = a+b`
    and first replace `a` by `4`, and then `a` and `b` respectively by `3` and `5`
    (i.e., we find `f(3,5)`).


    ```

    >> syms a b


    >> subs(a+b,a,4)


    ans =


    4+b


    >> subs(a+b,{a,b},{3,5})


    ans =


    8

    ```


    Here are three additional examples of substitutions.


    ```

    >> subs (cos (a) + (b), {a, b}, {sym (''alpha''), 2})


    ans =


    cos (alpha) + sin (2)


    >> subs(''exp(a*t)'',''a'',-magic(2))


    ans =


    [exp (t), exp(-3*t)]

    [exp(-4*t), exp(-2*t)]


    >> syms x y


    >> subs(x*y,{x,y},{[0 1;-1 0],[1-1;-2 1]})


    ans =


    0-1

    2 0

    ```


    In addition to replacement, MATLAB also provides commands that allow functional
    operations, such as summation, subtraction, multiplication and division of functions,
    as well as composition and inversion. The following list summarizes the syntax
    of these commands:


    | `symadd(f, g)` | Adds the functions `f` and `g` (`f + g`) |

    | `symop(f, ‘+’, g, ‘+’, h, ‘+’,.....)` | Returns the sum `f+g+h+....` Note that
    `symop` is obsolete in more recent versions of MATLAB. |

    | `symsub(f, g)` | Returns the difference of `f` and `g` (`f-g`) |

    | `symop(f, ‘-’, g, ‘-’, h, ‘-’,.....)` | Returns the difference `f-g-h-…` |

    | `symmul(f, g)` | Returns the product of `f` and `g` (`f * g`) |

    | `symop(f, ‘*’, g, ‘*’, h, ‘*’,.....)` | Returns the product `f * g * h *…` |

    | `symdiv(f, g)` | Returns the quotient of `f` and `g` (`f/g`) |

    | `symop(f, ‘/’, g, ‘/’, h, ‘/’,.....)` | Returns the successive quotient `((f/g)/h)/…`
    |

    | `sympow(f, k)` | Raises `f` to the power `k` (`k` a scalar) |

    | `symop(f, ‘^’, g)` | Raises a function to the power of another function (`f^g`)
    |

    | `compose(f, g)` | Composes `f` and `g` (`f ∞ g (x) = f(g(x))`) |

    | `compose(f, g, u)` | Composes `f` and `g`, taking the expression `u` as the
    domain of `f` and `g` |

    | `g = finverse(f)` | Returns the inverse of the function `f` |

    | `g = finverse(f, v)` | Returns the inverse of the function `f` using the symbolic
    variable `v` as an independent variable |


    In the following example, given the functions `f(x)=x^2`, `g(x)=x^3+1` and `h(x)
    = sin(x)+cos(x)`, we calculate `(f+g)(x)`, `(f-g+h)(x)`, `(f/g)(x)`, `f(g(x))`,
    `f(h(π/3))` and `f(g(h(sin(x))))`.


    ```

    >> syms x


    >> f = x ^ 2; g = x ^ 3 + 1; h = sin (x) + cos (x);


    >> sum = symadd(f,g)


    sum =


    x^2+x^3+1


    >> combination = symadd(symsub(f,g),h)


    combination =


    x ^ 2-x ^ 3-1 + sin (x) + cos (x)


    >> combination = symop(f,''-'',g,''+'',h)


    combination =


    x ^ 2-x ^ 3-1 + sin (x) + cos (x)


    >> quotient = symdiv (f, g)


    quotient =


    x ^ 2-/(x^3+1)


    >> composite = subs (compose (g, f), x-1)


    composite =


    (x-1) ^ 6 + 1


    >> composite1 = subs (compose (f, h), pi/3)


    composite1 =


    1.8660


    >> composite1 = subs (compose (f, h), '' pi/3'')


    composite1 =


    (sin ((pi/3)) + cos ((pi/3))) ^ 2


    >> composite2 = subs (compose (f , compose (g, h)), ''sin (x)'')


    composite2 =


    ((sin (sin (x)) + cos (sin (x))) ^ 3 + 1) ^ 2

    ```


    In the following example we find the inverse of the function `f(x) = sin(x^2)`
    and check that the result is correct.


    ```

    >> syms x


    >> f = sin(x^2)


    f =


    sin(x^2)


    >> g = finverse(f)


    g =


    asin(x)^(1/2)


    >> compose(f,g)


    ans =


    x

    ```


    MATLAB also provides a group of predefined symbolic special functions, whose syntax
    is presented in the following table:


    | `cosint(x)` | The cosine integral, ![A978-1-4842-0310-1_8_Fige_HTML.jpg](A978-1-4842-0310-1_8_Fige_HTML.jpg)
    where γ is the Euler–Mascheroni constant 0.5772156649… |

    | `sinint(x)` | The sine integral, ![A978-1-4842-0310-1_8_Figf_HTML.jpg](A978-1-4842-0310-1_8_Figf_HTML.jpg)
    . |

    | `hypergeom(n,d,z)` | The generalized hypergeometric function. |

    | `lambertw(x)` | The Lambert function λ(x), which is defined by the equation
    λ(x) * e^(λ(x)) = x. |

    | `zeta(x)` | The Riemann zeta function ζ(x), defined as ![A978-1-4842-0310-1_8_Figg_HTML.jpg](A978-1-4842-0310-1_8_Figg_HTML.jpg).
    |

    | `zeta(n,x)` | The Nth derivative of `zeta(x)`. |


    As a first example we find the sum of the series ![A978-1-4842-0310-1_8_Figh_HTML.jpg](A978-1-4842-0310-1_8_Figh_HTML.jpg),
    whose value is ζ(4).


    ```

    >> zeta (4)


    ans =


    1.0823

    ```


    Next we find the integral ![A978-1-4842-0310-1_8_Figi_HTML.jpg](A978-1-4842-0310-1_8_Figi_HTML.jpg).
    We use the sine integral function.


    ```

    >> sinint (2)


    ans =


    1.6054

    ```'
  raw: '## Symbolic Functions. Substitution and Functional Operations


    MATLAB’s symbolic mathematics module allows you to define symbolic functions directly
    using the syntax f = ‘function’ (or f = function) provided the variables have
    previously been defined as symbolic with syms.


    Once a symbolic function has been explicitly defined, it is possible to substitute
    values for the variables in the function, i.e., calculate the value of the function
    at a given point, using the commands shown below:


    | subs(f, a) | Applies the function f at the point a. |

    | subs(f,a,b) | Substitutes b in place of a in the function f. |

    | subs (f, variable, value) | Replaces the variable variable by the value value
    in the function f. |

    | subs(f, {x,y,…}, {a,b,…}) | Replaces the variables {x, y,…} respectively by
    the values {a, b,…} in the function f. |


    As a first example we define the function f(x) = x ³ and calculate f(2) and f(b+
    2).


    `>> f=''x^3''`


    `f =`


    `x^3`


    `>> A=subs(f,2)`


    `A =`


    `8`


    `>> syms b`


    `>> B=subs(f,b+2)`


    `B =`


    `(b+2) ^ 3`


    In the following example we consider the two-variable function f(a, b) = a+b and
    first replace a by 4, and then a and b respectively by 3 and 5 (i.e., we find
    f(3,5)).


    `>> syms a b`


    `>> subs(a+b,a,4)`


    `ans =`


    `4+b`


    `>> subs(a+b,{a,b},{3,5})`


    `ans =`


    `8`


    Here are three additional examples of substitutions.


    `>> subs (cos (a) + (b), {a, b}, {sym (''alpha''), 2})`


    `ans =`


    `cos (alpha) + sin (2)`


    `>> subs(''exp(a*t)'',''a'',-magic(2))`


    `ans =`


    `[exp (t), exp(-3*t)]`


    `[exp(-4*t), exp(-2*t)]`


    `>> syms x y`


    `>> subs(x*y,{x,y},{[0 1;-1 0],[1-1;-2 1]})`


    `ans =`


    `0-1`


    `2 0`


    In addition to replacement, MATLAB also provides commands that allow functional
    operations, such as summation, subtraction, multiplication and division of functions,
    as well as composition and inversion. The following list summarizes the syntax
    of these commands:


    | symadd (f, g) | Adds the functions f and g (f + g) |

    | symop(f, ‘+’, g, ‘+’, h, ‘+’,.....) | Returns the sum f+g+h +.... Note that
    symop is obsolete in more recent versions of MATLAB. |

    | symsub (f, g) | Returns the difference of f and g (f-g) |

    | symop(f, ‘-’, g, ‘-’, h, ‘-’,.....) | Returns the difference f-g-h-… |

    | symmul (f, g) | Returns the product of f and g (f * g) |

    | symop(f, ‘ * ’,g, ‘ *’ , h, ‘ * ’,.....) | Returns the product f * g * h *…
    |

    | symdiv (f, g) | Returns the quotient of f and g (f/g) |

    | symop(f, ‘/’, g, ‘/’, h, ‘/’,.....) | Returns the successive quotient((f /g)/h)/…
    |

    | sympow (f, k) | Raises f to the power k (k a scalar) |

    | symop(f, ‘^’, g) | Raises a function to the power of another function (f ^g
    ) |

    | compose (f, g) | Composes f and g (f ∞ g (x) = f (g (x))) |

    | compose(f, g, u) | Composes f and g, taking the expression u as the domain of
    f and g |

    | g = finverse (f) | Returns the inverse of the function f |

    | g = finverse(f, v) | Returns the inverse of the function f using the symbolic
    variable v as an independent variable |


    In the following example, given the functions f(x)=x ² , g(x)=x ³ +1 and h(x)
    = sin(x)+cos(x), we calculate (f+g)(x), (f-g+h)(x), (f/g)(x), f(g(x)), f(h(π/3))
    and f(g(h(sin(x)))).


    `>> syms x`


    `>> f = x ^ 2; g = x ^ 3 + 1; h = sin (x) + cos (x);`


    `>> sum = symadd(f,g)`


    `sum =`


    `x^2+x^3+1`


    `>> combination = symadd(symsub(f,g),h)`


    `combination =`


    `x ^ 2-x ^ 3-1 + sin (x) + cos (x)`


    `>> combination = symop(f,''-'',g,''+'',h)`


    `combination =`


    `x ^ 2-x ^ 3-1 + sin (x) + cos (x)`


    `>> quotient = symdiv (f, g)`


    `quotient =`


    `x ^ 2-/(x^3+1)`


    `>> composite = subs (compose (g, f), x-1)`


    `composite =`


    `(x-1) ^ 6 + 1`


    `>> composite1 = subs (compose (f, h), pi/3)`


    `composite1 =`


    `1.8660`


    `>> composite1 = subs (compose (f, h), '' pi/3'')`


    `composite1 =`


    `(sin ((pi/3)) + cos ((pi/3))) ^ 2`


    `>> composite2 = subs (compose (f , compose (g, h)), ''sin (x)'')`


    `composite2 =`


    `((sin (sin (x)) + cos (sin (x))) ^ 3 + 1) ^ 2`


    In the following example we find the inverse of the function f (x) = sin(x ²)
    and check that the result is correct.


    `>> syms x`


    `>> f = sin(x^2)`


    `f =`


    `sin(x^2)`


    `>> g = finverse(f)`


    `g =`


    `asin(x)^(1/2)`


    `>> compose(f,g)`


    `ans =`


    `x`


    MATLAB also provides a group of predefined symbolic special functions, whose syntax
    is presented in the following table:


    | cosint ( x ) | The cosine integral, ![A978-1-4842-0310-1_8_Fige_HTML.jpg](A978-1-4842-0310-1_8_Fige_HTML.jpg)
    where γ is the Euler–Mascheroni constant 0.5772156649… |

    | sinint( x ) | The sine integral, ![A978-1-4842-0310-1_8_Figf_HTML.jpg](A978-1-4842-0310-1_8_Figf_HTML.jpg)
    . |

    | hypergeom( n,d,z ) | The generalized hypergeometric function. |

    | lambertw( x ) | The Lambert function λ(x), which is defined by the equation
    λ(x)e ^(λ(x)) = x. |

    | zeta( x ) | The Riemann zeta function ζ(x), defined as ![A978-1-4842-0310-1_8_Figg_HTML.jpg](A978-1-4842-0310-1_8_Figg_HTML.jpg).
    |

    | zeta ( n, x ) | The Nth derivative of zeta (x). |


    As a first example we find the sum of the series ![A978-1-4842-0310-1_8_Figh_HTML.jpg](A978-1-4842-0310-1_8_Figh_HTML.jpg),
    whose value is ζ(4).


    `>> zeta (4)`


    `ans =`


    `1.0823`


    Next we find the integral ![A978-1-4842-0310-1_8_Figi_HTML.jpg](A978-1-4842-0310-1_8_Figi_HTML.jpg).
    We use the sine integral function.


    `>> sinint (2)`


    `ans =`


    `1.6054`'
  trans: '

    # 符号函数：替换与函数运算


    MATLAB 的符号数学模块允许你直接使用 `f = ''函数表达式''`（或 `f = 函数表达式`）语法定义符号函数，前提是变量已事先通过 `syms`
    声明为符号变量。


    一旦符号函数被显式定义，就可以使用如下所示命令为函数中的变量替换值，即计算函数在给定点的值：


    | `subs(f, a)` | 计算函数 `f` 在点 `a` 处的值。 |

    | :--- | :--- |

    | `subs(f, a, b)` | 在函数 `f` 中将 `a` 替换为 `b`。 |

    | `subs(f, 变量, 值)` | 在函数 `f` 中将变量 `变量` 替换为值 `值`。 |

    | `subs(f, {x, y, ...}, {a, b, ...})` | 在函数 `f` 中将变量 `{x, y, ...}` 分别替换为值 `{a,
    b, ...}`。 |


    第一个例子中，我们定义函数 `f(x) = x³` 并计算 `f(2)` 和 `f(b+2)`。


    ```

    >> f=''x³''


    f =


    x³


    >> A=subs(f,2)


    A =


    8


    >> syms b


    >> B=subs(f,b+2)


    B =


    (b+2) ^ 3

    ```


    在下面的例子中，我们考虑二元函数 `f(a, b) = a+b`，首先将 `a` 替换为 `4`，然后将 `a` 和 `b` 分别替换为 `3` 和 `5`（即求
    `f(3,5)`）。


    ```

    >> syms a b


    >> subs(a+b,a,4)


    ans =


    4+b


    >> subs(a+b,{a,b},{3,5})


    ans =


    8

    ```


    以下是另外三个替换示例。


    ```

    >> subs (cos (a) + (b), {a, b}, {sym (''alpha''), 2})


    ans =


    cos (alpha) + sin (2)


    >> subs(''exp(a*t)'',''a'',-magic(2))


    ans =


    [exp (t), exp(-3*t)]

    [exp(-4*t), exp(-2*t)]


    >> syms x y


    >> subs(x*y,{x,y},{[0 1;-1 0],[1-1;-2 1]})


    ans =


    0-1

    2 0

    ```


    除了替换功能，MATLAB 还提供了一些执行函数运算的命令，如函数的加、减、乘、除运算，以及复合与求逆。下表总结了这些命令的语法：


    | `symadd(f, g)` | 求函数 `f` 和 `g` 的和（`f + g`） |

    | :--- | :--- |

    | `symop(f, ''+'', g, ''+'', h, ''+'',.....)` | 返回和 `f+g+h+...`。注意，`symop` 在更新版本的
    MATLAB 中已废弃。 |

    | `symsub(f, g)` | 返回 `f` 和 `g` 的差（`f-g`） |

    | `symop(f, ''-'', g, ''-'', h, ''-'',.....)` | 返回差 `f-g-h-...` |

    | `symmul(f, g)` | 返回 `f` 和 `g` 的积（`f * g`） |

    | `symop(f, ''*'', g, ''*'', h, ''*'',.....)` | 返回积 `f * g * h *...` |

    | `symdiv(f, g)` | 返回 `f` 和 `g` 的商（`f/g`） |

    | `symop(f, ''/'', g, ''/'', h, ''/'',.....)` | 返回连商 `((f/g)/h)/...` |

    | `sympow(f, k)` | 将 `f` 提升为 `k` 次幂（`k` 为标量） |

    | `symop(f, ''^'', g)` | 将一个函数提升为另一个函数的幂（`f^g`） |

    | `compose(f, g)` | 复合 `f` 和 `g`（`f ∞ g (x) = f(g(x))`） |

    | `compose(f, g, u)` | 复合 `f` 和 `g`，将表达式 `u` 作为 `f` 和 `g` 的定义域 |

    | `g = finverse(f)` | 返回函数 `f` 的反函数 |

    | `g = finverse(f, v)` | 返回函数 `f` 的反函数，使用符号变量 `v` 作为自变量 |


    在下面的例子中，给定函数 `f(x)=x²`，`g(x)=x³+1` 和 `h(x) = sin(x)+cos(x)`，我们计算 `(f+g)(x)`，`(f-g+h)(x)`，`(f/g)(x)`，`f(g(x))`，`f(h(π/3))`
    和 `f(g(h(sin(x))))`。


    ```

    >> syms x


    >> f = x ^ 2; g = x ^ 3 + 1; h = sin (x) + cos (x);


    >> sum = symadd(f,g)


    sum =


    x²+x³+1


    >> combination = symadd(symsub(f,g),h)


    combination =


    x ^ 2-x ^ 3-1 + sin (x) + cos (x)


    >> combination = symop(f,''-'',g,''+'',h)


    combination =


    x ^ 2-x ^ 3-1 + sin (x) + cos (x)


    >> quotient = symdiv (f, g)


    quotient =


    x ^ 2-/(x³+1)


    >> composite = subs (compose (g, f), x-1)


    composite =


    (x-1) ^ 6 + 1


    >> composite1 = subs (compose (f, h), pi/3)


    composite1 =


    1.8660


    >> composite1 = subs (compose (f, h), '' pi/3'')


    composite1 =


    (sin ((pi/3)) + cos ((pi/3))) ^ 2


    >> composite2 = subs (compose (f , compose (g, h)), ''sin (x)'')


    composite2 =


    ((sin (sin (x)) + cos (sin (x))) ^ 3 + 1) ^ 2

    ```


    在下面的例子中，我们求函数 `f(x) = sin(x²)` 的反函数，并验证结果正确。


    ```

    >> syms x


    >> f = sin(x²)


    f =


    sin(x²)


    >> g = finverse(f)


    g =


    asin(x)^(1/2)


    >> compose(f,g)


    ans =


    x

    ```


    MATLAB 还提供了一组预定义的符号特殊函数，其语法如下表所示：


    | `cosint(x)` | 余弦积分，![A978-1-4842-0310-1_8_Fige_HTML.jpg](img/A978-1-4842-0310-1_8_Fige_HTML.jpg)
    ，其中 γ 是欧拉-马歇罗尼常数 0.5772156649... |

    | :--- | :--- |

    | `sinint(x)` | 正弦积分，![A978-1-4842-0310-1_8_Figf_HTML.jpg](img/A978-1-4842-0310-1_8_Figf_HTML.jpg)
    。 |

    | `hypergeom(n,d,z)` | 广义超几何函数。 |

    | `lambertw(x)` | 朗伯函数 λ(x)，由方程 λ(x) * e^(λ(x)) = x 定义。 |

    | `zeta(x)` | 黎曼 zeta 函数 ζ(x)，定义为 ![A978-1-4842-0310-1_8_Figg_HTML.jpg](img/A978-1-4842-0310-1_8_Figg_HTML.jpg)。
    |

    | `zeta(n,x)` | `zeta(x)` 的第 n 阶导数。 |


    第一个例子中，我们求级数 ![A978-1-4842-0310-1_8_Figh_HTML.jpg](img/A978-1-4842-0310-1_8_Figh_HTML.jpg)
    的和，该值等于 ζ(4)。


    ```

    >> zeta (4)


    ans =


    1.0823

    ```


    接下来我们求积分 ![A978-1-4842-0310-1_8_Figi_HTML.jpg](img/A978-1-4842-0310-1_8_Figi_HTML.jpg)。我们使用正弦积分函数。


    ```

    >> sinint (2)


    ans =


    1.6054

    ```

    '
- fmt: '# Mathematical Analysis Functions. Limits, Continuity, and Series


    MATLAB''s symbolic mathematics module allows you to work on mathematical analysis
    with ease. It is possible to calculate limits, obtain derivatives, sum series,
    find the Taylor series of functions, calculate integrals and work with equations.


    When working with limits, the same functions are applied to calculate limits of
    sequences, functions and sequences of functions, and of course, to analyze the
    continuity of functions and convergence of numerical series and power series.
    The analysis for one and several variables is similar. The following functions
    are available.


    | `limit (sequence, inf)` | Calculates the limit of the sequence, indicated by
    its general term, as n tends to infinity. |

    | `limit (sequence, inf)` | Calculates the limit of the sequence, indicated by
    its general term, as n tends to infinity. |

    | `limit (function, x, a)` | Calculates the limit of the function of the variable
    x, indicated by its analytical expression, as the variable x tends towards the
    value a. |

    | `limit (function, a)` | Calculates the limit of the function of the variable
    x, indicated by its analytical expression, as the variable x tends towards the
    value a. |

    | `limit (function, x, a, ''right'')` | Calculates the limit of the function of
    the variable x, indicated by its analytical expression, as the variable x tends
    to the value a from the right. |

    | `limit (function, x, a, ''left'')` | Calculates the limit of the function of
    the variable x, indicated by its analytical expression, as the variable x tends
    to the value a from the left. |

    | `symsum (S, v, a, b)` | Finds the sum of the series with general term S where
    the variable v runs from a to b. |

    | `symsum (S, v)` | Finds the sum of the series with general term S where the
    value of the variable v ranges from 0 to v-1. |

    | `r = symsum (S)` | Returns the sum of the series with general term S in terms
    of the symbolic variable k (as determined by `findsym`) where the value of k ranges
    from 0 to k-1. |

    | `symsum (S, a, b)` | Finds the sum of the series with general term S in terms
    of the symbolic variable k (as determined by `findsym`) where the value of k ranges
    from a to b. |


    As a first example we calculate the following sequential limits:


    ![A978-1-4842-0310-1_8_Figj_HTML.jpg](A978-1-4842-0310-1_8_Figj_HTML.jpg)


    We have:


    ```

    >> syms n

    >> limit (((2*n-3) /(3*n-7)) ^ 4, inf)

    ans =

    16/81

    >> limit ((3*n^3+7*n^2+1) /(4*n^3-8*n+5), n, inf)

    ans =

    3/4

    >> limit (((n+1)/2) * ((n^4+1)/n ^ 5), inf)

    ans =

    1/2

    >> limit (((n+1)/n ^ 2) ^(1/n), inf)

    ans =

    1

    ```


    Next we calculate the following function limits:


    ![A978-1-4842-0310-1_8_Figk_HTML.jpg](A978-1-4842-0310-1_8_Figk_HTML.jpg)


    We have:


    ```

    >> syms x a

    >> limit((x-1)/(x^(1/2)-1),x,1)

    ans =

    2

    >> limit((x-(x+2)^(1/2))/((4*x+1)^(1/2)-3),2)

    ans =

    9/8

    >> limit((1+x)^(1/x))

    ans =

    exp (1)

    >> limit(sin(a*x)^2/x^2,x,0)

    ans =

    a^2

    ```


    In the following example we calculate the limit of the sequence of functions `g[n](x)
    = (x^2+n*x)/n` with `x` in `R`.


    ```

    >> limit((x^2+n*x)/n,n,inf)

    ans =

    x

    ```


    We see that the graph of the limit function is given by the diagonal passing through
    the first and third quadrants. We can demonstrate this as follows (see Figure
    [8-1](#A978-1-4842-0310-1_8_Chapter.html#Fig1)):


    ```

    >> fplot(''[(x^2+x),(x^2+2*x)/2,(x^2+3*x)/3,(x^2+4*x)/4,

    (x^2+5*x)/5,(x^2+5*x)/5,(x^2+6*x)/6,(x^2+7*x)/7,(x^2+8*x)/8,

    (x^2+9*x)/9]'',[-2,2,-2,2])

    ```


    ![A978-1-4842-0310-1_8_Fig1_HTML.jpg](A978-1-4842-0310-1_8_Fig1_HTML.jpg)


    Figure 8-1.


    The following example verifies the continuity of the function `f(x)` in `R-{0}`
    where `f(x) = sin(x) / x`. The following command checks that ![A978-1-4842-0310-1_8_Figl_HTML.jpg](A978-1-4842-0310-1_8_Figl_HTML.jpg).


    ```

    >> syms x a

    >> limit (sin (x) / x, x, a)

    ans =

    sin (a) /a

    ```


    Next we show that the function ![A978-1-4842-0310-1_8_Figm_HTML.jpg](A978-1-4842-0310-1_8_Figm_HTML.jpg)
    is not continuous at the point `x = 0` by showing that the lateral limits do not
    match (one is zero and the other is infinite).


    ```

    >> syms x

    >> limit((exp(1/x)),x,0,''right'')

    ans =

    inf

    >> limit((exp(1/x)),x,0, ''left'')

    ans =

    0

    ```


    In the following example we determine whether the series ![A978-1-4842-0310-1_8_Fign_HTML.jpg](A978-1-4842-0310-1_8_Fign_HTML.jpg)
    is convergent by applying the ratio test (![A978-1-4842-0310-1_8_Figo_HTML.jpg](A978-1-4842-0310-1_8_Figo_HTML.jpg))
    and if it is, we calculate its sum.


    ```

    >> syms n

    >> f = n/2 ^ n

    f =

    n/(2^n)

    >> limit (subs(f,n,n+1)/f, n, inf)

    ans =

    1/2

    ```


    We see that the limit of the ratio of successive terms is less than 1, which means
    the series converges. We calculate its sum using the following:


    ```

    >> symsum(f,n,1,inf)

    ans =

    2

    ```'
