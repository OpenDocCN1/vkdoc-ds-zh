    \ * cos(9*x) + 129285 * sin(9*x) * x-6084 * sin(9*x))\n```\n\n```\n» maple('yp:\
    \ = x - > factor(simplify(y1(x) *(x) u1 + y2(x) * u2(x)))');\n» maple('yp(x)')\n\
    ans =\n-23/1105 * x * cos(3*x) ^ 2 + 13436/1221025 * cos(3*x) ^ 2 + 24/1105 *\
    \ cos(3*x) * sin(3*x) * x + 3852/1221025 * cos(3*x) * sin(3*x) + 54/1105 * x-21168/1221025\n\
    ```\n\nThen we can write the general solution of the non-homogeneous equation:\n\
    \n```\n» maple(' y: = x - > simplify(c1 * y1(x) + c2 * y2(x) + yp(x))');\n» maple('combine(and(x),\
    \ trig)')\nans =\nC1 * exp(-2*x) * cos(3*x) + c2 * exp(-2*x) * sin(3*x)-23/2210\
    \ * x * cos(6*x) + 1/26 * x + 6718/1221025 * cos(6*x)-2/169 + 12/1105 * x * sin(6*x)\
