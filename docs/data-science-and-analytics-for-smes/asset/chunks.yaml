- fmt: '# 7.5 Random Forest and Boosted Trees


    In situations where visualization and interpretation of rules from the decision
    tree do not matter, several tree extensions that combine the results of multiple
    trees can increase the performance. Random forest is a popular multitree approach,
    introduced by Breiman.⁵


    Random forest uses the following basic steps:


    1. Take a number of random samples from the data, each with a different replacement.
    Bootstrap is the name for this sampling method.

    2. Adapt/fit each sample with a classification (or regression) tree (and therefore
    produce a “forest”) using a random selection of predicting variables at every
    stage.

    3. To get better predictions, do a combination of the predictions and classifications
    from the various trees. Voting is used for classification, while averaging is
    used for prediction.


    `Boosted trees` are another type of multitree improvement. A sequence of trees
    is fitted, with each tree focusing on records from the preceding tree that were
    incorrectly classified. It has the following steps:


    1. Use only one tree.

    2. Create a sample in which misclassified records have a higher chance of being
    chosen.

    3. Create a tree with the new sample.

    4. Steps 1 and 2 earlier should be done repeatedly.

    5. Classify records using weighted voting, with subsequent trees receiving more
    weight.


    If we run a boosted tree on the same data, it slightly outperforms the single
    pruned tree. In terms of overall accuracy, the boosted tree outperforms the validation
    data, particularly when it comes to correctly classifying 1s (rare classes of
    special interest).


    ## Customer loyalty with random forest


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig17_HTML.png)


    The parameter section of the Process tab is depicted with the number of folds
    set to 10, sampling type set to automatic, and enable parallel execution checked.


    **Figure 7-14a**


    Main process of random forest


    1. Create a new process, and drag the already imported `Churn_Modelling.xlsx`
    data to the design view. We will use the settings in Figure [7-14a](#532459_1_En_7_Chapter.xhtml#Fig17)
    (main process) and [7-14b](#532459_1_En_7_Chapter.xhtml#Fig18) (inner process)
    to develop and evaluate the model.


    The `Random Forest` operator generates a model which is a combination of several
    trees. We will leave the default which is 100 trees as seen in its `Number of
    Trees` parameter. In Figure [7-14a](#532459_1_En_7_Chapter.xhtml#Fig17), click
    the `Set Role` operator and set the `attribute name` to be `Exited` and the `target
    role` to be `label`. Leave the `Cross Validation` operator as default settings,
    meaning that we will be using a tenfold validation.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig18_HTML.png)


    The parameter section of the process tab is depicted with the main criterion set
    to first and the accuracy option checked.


    **Figure 7-14b**


    Inner process for the random forest


    In Figure [7-14b](#532459_1_En_7_Chapter.xhtml#Fig18) for the `Random Forest`
    operator, we leave the number of trees as default. The `Apply Model` operator
    needs no parameter adjustment. For the parameters of the `Performance (Classification)`
    operator, simply leave as default, which is accuracy.


    `OPTIONAL`: Note that the random forest model can produce “variable importance”
    scores, which measure the relative contribution of the different predictors. The
    importance score for a particular predictor is computed by summing up the decrease
    in the Gini index for that predictor over all the trees in the forest. (To get
    this result, alter the `Random Forest` operator in the inner process (i.e., Figure
    [7-14b](#532459_1_En_7_Chapter.xhtml#Fig18)) by right-clicking it and putting
    the breakpoint after, then connect the `wei` to `thr`. If you run the process,
    you will see the strength of each attribute.)


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig19_HTML.png)


    The graph tab displays the forest model with node and edge labels checked.


    **Figure 7-15a**


    Some sections of the random forest model


    1. For the settings in Figures [7-14a](#532459_1_En_7_Chapter.xhtml#Fig17) and
    [7-14b](#532459_1_En_7_Chapter.xhtml#Fig18), we are expecting two outputs. Figure
    [7-15a](#532459_1_En_7_Chapter.xhtml#Fig19) is the random forest model, and Figure
    [7-15b](#532459_1_En_7_Chapter.xhtml#Fig20) is the performance of the model.


    The list of the trees is displayed in Figure [7-15a](#532459_1_En_7_Chapter.xhtml#Fig19).
    If you click each tree, you will see the model of the tree as shown in Figure
    [7-15a](#532459_1_En_7_Chapter.xhtml#Fig19). There are a total of 100 different
    trees.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig20_HTML.png)


    The performance tab is selected with criteria set to accuracy and table view checked.
    The values of pred 1 and pred 0 for true 1 and 0 are highlighted.


    **Figure 7-15b**


    Performance of the random forest model


    ## For customer loyalty with boosted trees


    To run the boosted tree algorithm, use the same settings for the random forest
    in Figures [7-14a](#532459_1_En_7_Chapter.xhtml#Fig17) and [7-14b](#532459_1_En_7_Chapter.xhtml#Fig18)
    except that in Figure [7-14b](#532459_1_En_7_Chapter.xhtml#Fig18) the `Random
    Forest` operator will be replaced with the `Gradient Boosted Trees` operator.
    The resulting model and performance are displayed in Figures [7-16a](#532459_1_En_7_Chapter.xhtml#Fig21)
    and [7-16b](#532459_1_En_7_Chapter.xhtml#Fig22), respectively.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig21_HTML.png)


    The graph tab displays the boosted tree model with node and edge labels checked
    and tree one selected under gradient boosted.


    **Figure 7-16a**


    Some sections of the boosted trees


    The list of the trees is displayed in Figure [7-16a](#532459_1_En_7_Chapter.xhtml#Fig21).
    If you click each tree, you will see the model of the tree as shown in Figure
    [7-16a](#532459_1_En_7_Chapter.xhtml#Fig21). There are a total of 100 different
    trees.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig22_HTML.png)


    The performance tab is selected with criteria set to accuracy and table view checked.
    The values of pred 1 and pred 0 for true 1 and 0 are highlighted.


    **Figure 7-16b**


    Performance of the boosted tree model


    Having used the different algorithms to solve this problem, we can now compare
    their accuracy and select the best for this particular data. Just as for the prediction,
    for the classification too, there might be a need to use different data and algorithm
    setting to experiment for better accuracy. Comparing Figures [7-7b](#532459_1_En_7_Chapter.xhtml#Fig8),
    [7-11b](#532459_1_En_7_Chapter.xhtml#Fig14), [7-15b](#532459_1_En_7_Chapter.xhtml#Fig20),
    and [7-16b](#532459_1_En_7_Chapter.xhtml#Fig22), we can see that the best of the
    algorithms is the neural network (Figure [7-7b](#532459_1_En_7_Chapter.xhtml#Fig8)),
    which gave an accuracy of 85.79%, just slightly higher than random forest.


    For this problem, the objective is to predict which customers will be loyal to
    prospective customers. With the result of the prediction for the new customers,
    we can identify this, particularly if we select those that have a high propensity.
    Also for the existing customers, we can predict the loyal ones and the ones about
    to churn and take necessary actions. If, for example, the goal is to target prospective
    customers, we can rank the prospective customer records from highest to lowest
    propensity (in the newly predicted dataset) in order to act on those with the
    highest propensity for target marketing.'
