  trans: '

    ## 9.1 中小企业电子商务


    `电子商务`是指通过线上渠道买卖商品和服务。它涉及以任何创业形式直接或间接交易产品或服务，旨在创造财富，从而为最终用户增值，并改善生计手段。


    `电子商务`中小企业（`SMEs`）是指利用数字在线服务作为平台，为目标客户创建认知度并推出产品与服务的初创企业。这些活动包括促销推广和营销策略，以促成在线购买、推动销售，并维持重复购买。


    以下是在电子商务分析项目中可能希望达成的一些分析目标：


    *   捕获、建模和分析与网站交互的用户的行为模式及画像，以推荐有效的营销活动（即提取可支持多项决策的知识，例如针对每个客户群体的营销活动）、定价策略等。

    *   了解客户以建立长期关系并提升服务质量。

    *   发现消费者情绪以实现有效的客户关系管理。

    *   发现具有共同兴趣的用户社区以实现更精准的定位。

    *   为公司有效的生产计划、资本投资和扩张决策提供建议。

    *   发现有助于提高网站在访客中受欢迎程度的趋势。

    *   提供产品交叉销售和布局建议，以增加网站上销售的产品数量，并根据产品推荐重新设计布局。

    *   优化销售漏斗，确保尽可能多的人完成购买产品的步骤，即在网站上售出更多产品。此外，发现销售漏斗（电子商务网站）中的薄弱环节，并推荐改进策略。

    *   识别最有利可图的客户、最频繁的搜索关键词以及最佳的销售时间线。

    *   根据标准的电子商务关键绩效指标（`放弃率`、微观到宏观转化率、平均订单价值（`AOV`）、销售转化率、客户留存率、电子商务流失率等）评估网站，并利用结果提供改善网站销售的建议。

    *   发现客户购买模式中的序列或关联趋势，这些趋势有助于推荐向上销售、交叉销售或嵌入推荐系统。

    *   开发预测模型，以确定哪些外部客户（至少访问过网站一次但未购买任何东西的客户）具有较高的购买倾向，以便建议对其进行直邮或营销。

    *   客户生命周期价值预测等等。


    在此类领域可能分析的数据类型包括：


    1.  **交易数据**


    由于消费者与电子商务企业之间的互动，交易或业务活动数据迅速涌现。这些数据结构化，来自多种来源，包括客户关系项目（例如，公司维护的客户档案、客户投诉频率的增加）和销售交易。总体而言，零售商显然可以从整个价值链中的交易数据中获益匪浅。³


    2.  **点击流数据**


    点击流数据源于网络和数字广告，以及社交媒体活动，如电子商务企业的推文、博客、Facebook 墙贴等。用户在特定网页内浏览的一系列页面称为点击流，可用于电子商务中的多种分析。点击流跟踪的主要目标是帮助深入了解网站访客的活动。


    3.  **语音数据**


    语音数据通常通过电话通话、呼叫中心或客户服务获取的信息。根据最新研究，语音数据有助于分析消费者购买行为或定位新客户。


    4.  **视频数据**


    视频数据是从当前图像捕捉中获取的实时数据。电子商务公司希望结合图像识别工具收集海量数据，而不仅仅是滑动流信息或交易数据。⁴

    '
- fmt: '# 9.2 Introduction to SME Case Study


    The case study business is a food and agriculture business named `FarmCo`. The
    focus of `FarmCo` is to make food items available at the doorstep and also supply
    farmers with the necessary inputs needed for their farming process. In essence,
    they help to connect food item suppliers and agricultural product suppliers with
    those that are demanding to purchase them. They take orders both offline and online,
    but even the offline orders are eventually entered into the online system so as
    to be able to have a holistic view to running the business operation. They have
    a staff strength of about 20 employees in different capacity; some are into the
    management of the offline operations such as logistics and supply, stocking and
    procurement, and so on, while others are into managing the online operations which
    include digital marketing and sales management. `FarmCo` is being managed by an
    ecommerce software which is the main data source for this analytics project.


    The conceptual business model for `FarmCo` is given by Figure [9-1](#532459_1_En_9_Chapter.xhtml#Fig1).
    It helps to understand the major parts and layout of the business process and
    to particularly know where the data for analytics will be coming from.


    ![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig1_HTML.jpg)


    A model displays a conceptual business model for e-commerce software related to
    12 parameters.


    **Figure 9-1** Conceptual business model for `FarmCo`


    From Figure [9-1](#532459_1_En_9_Chapter.xhtml#Fig1), we can see that the ecommerce
    software is at the heart of the operations process of the business; it helps to
    connect the farmers to those producing the equipment that they need and also connect
    the food item buyers to those that are producing them. The software also monitors
    the stock available, order, delivery, customer information, and some level of
    information of the staffs. The software is in sync with other software such as
    `Google Analytics`, etc. This is to be able to capture some information or data
    not built into the software.


    For this project, the analytics road map is given in Figure [9-2](#532459_1_En_9_Chapter.xhtml#Fig2).


    ![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig2_HTML.jpg)


    The analytics road map displays initial analysis from the pre-engagement phase
    and engagement phase to the post-engagement phase in 3 to 6 months.


    **Figure 9-2** Analytics road map


    Typically, the whole analytics process takes between three and six months, but
    every project comes with its peculiarities, and, therefore, this time might change
    from project to project.


    The initial analysis phase will be covered in Section [9.3](#532459_1_En_9_Chapter.xhtml#Sec3).


    In the pre-engagement phase, you want to carry out some level of analysis to know
    what is obtainable from the data you have been able to retrieve in the initial
    analysis phase. Based on this result, you are able to present a detailed analytics
    journey mapping for the clients so that there will be a clear understanding of
    the roles of all parties in the project. At this point, you want to make it plain
    what is obtainable and what is to be moved into the future analytics project (recommendations
    to improve the analytics in the future). Timelines have to be specified with margins,
    and, most importantly, the stated goals each have to be clearly attached to the
    success criteria and how they will be measured. Finally, the data readiness (which
    translates to the feasibility of making the intended recommendations from the
    data) should be stated with the assumptions upon which the analytics project is
    to be carried.


    In the engagement model, we develop our machine learning models and perform all
    necessary analysis with adequate communication (feedback) of the insights to necessary
    stakeholders.^(1,2)


    For the post-engagement phase, there is a need to train the teams responsible
    for the implementation of the recommendations from the analytics project. There
    is a need to explain how to successfully implement the result from the analysis.
    This is very important because it determines if the analytics project is termed
    successful or not. At the end of the day, even after an excellent work, if the
    analytics project insights are not correctly implemented, there might not be any
    or much success recorded. After the preparation, we now implement the results
    in whatever form applicable to the organization and give enough time to measure
    and track the metrics against the success criteria stated in the pre-engagement
    phase. Most times during or after the post-engagement phase, there might be a
    need to iterate that process based on feedback.


    Figure [9-3](#532459_1_En_9_Chapter.xhtml#Fig3) is the engagement model that clearly
    reveals all parties involved and what part they will be playing for the `FarmCo`
    analytics project. Figure [9-3](#532459_1_En_9_Chapter.xhtml#Fig3) captures the
    engagement phase, where the data scientist reports to both the `FarmCo` stakeholders
    and the technical team during the modeling and analysis. Also the data scientist
    during modeling receives feedback from the technical team for necessary model
    reworking. In the post-engagement phase, both the data scientist and the technical
    team are involved in the measurement and tracking of the goals, metrics, and success
    criteria after successful implementation is carried out. Note that in Figure [9-3](#532459_1_En_9_Chapter.xhtml#Fig3),
    feedback also goes to the implementation stage, and the cycle might be iterated
    based on results obtained from the modeling and measurement phases.


    ![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig3_HTML.jpg)


    Communicating insights in the engagement phase and feedback incorporation, go-live
    prep and go live in post engagement phase are displayed.


    **Figure 9-3** Engagement model for the `FarmCo` analytics project


    ## 9.3 Initial Analysis


    The initial analysis has to do with the following steps:


    1.  Highlight the decision objectives (goals) and determine the analytics output
    that will help to make intended decision feasible.

    2.  Discover available data (internal and external) for analytics goals in (1).

    3.  Access the data in (2) and what is the quality for analytics goals in (1).

    4.  Is the data in (3) able to determine the analytics output in (1)?


    During the initial analysis for `FarmCo`, the goals that the stakeholders intended
    to solve (or they proposed) include the following:


    1.  Reach out to prospects and convert them to loyal customers.

    2.  Maximize social media engagement, that is, tracking and converting the engagement
    to sales.

    3.  Provide recommendations for effective production plans, capital investments,
    and expansion decision of the company.

    4.  Discover trends that can help to increase the popularity of the website among
    its visitors.

    5.  Identify best-selling items.


    Based on the result of steps 1 to 4 of the initial assessment, the goals were
    modified to the following after several feedback meetings with the stakeholders:


    1.  Increase website sales revenue.

    2.  Increase and retain (customer satisfaction) website traffic.


    Note that there were several recommendations for data platform upgrades that will
    help to explore some of the intended goals directly, for example, to reach out
    to prospects and convert to loyal customers, there has to be a system or program
    module that collects some information from the prospects so that they can be the
    object of targeting after a segmentation modeling.'
