    \nA screenshot depicts three tabs, performance in percentage, description, and\
    \ annotations. The description consists of five lines of code for the performance\
    \ vector.\n\nFigure 10-23b\n\nPerformance of K=3\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig26_HTML.png)\n\
    \nA screenshot depicts a line graph plotting the values for 0, 1, and 2\\. The\
    \ lines for 0, 1, and 2 fluctuate between negative 3 and 2.50.\n\nFigure 10-23a\n\
    \nCluster profile for K=3\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig25_HTML.jpg)\n\
    \nA screenshot depicts three tabs, performance in percentage, description, and\
    \ annotations. The description consists of five lines of code for the performance\
    \ vector.\n\nFigure 10-22b\n\nCluster performance of K=2\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig24_HTML.png)\n\
    \nA screenshot depicts a line graph plotting the values for 0 and 1. The line\
    \ for 0 lies steadily at 0.00 with slight fluctuations. The line for 1 represents\
    \ wild fluctuations.\n\nFigure 10-22a\n\nCluster profile for K=2\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig23_HTML.png)\n\
    \nA screenshot depicts the clustering process, which involves the following steps,\
    \ retrieve, nominal to numerical, select attributes, normalize, cluster, and performance.\n\
    \nFigure 10-21\n\nThe clustering process (k-means)\n\nFrom the preceding results,\
    \ we select K=3 due to the following reasons:\n\n*   avg._within_centroid_distance:\
    \ The average within-cluster distance is calculated by averaging the distance\
    \ between the centroid and all examples of a cluster. The smaller, the better.\n\
    \n*   davies_bouldin: The algorithms that produce clusters with low intra-cluster\
    \ distances (high intra-cluster similarity) and high inter-cluster distances (low\
    \ inter-cluster similarity) will have a low Davies-Bouldin index; the clustering\
    \ algorithm that produces a collection of clusters with the smallest Davies-Bouldin\
    \ index is considered the best algorithm based on this criterion.\n\nHaving decided\
    \ on K=3 for the internal data, to choose the best segmentation result for the\
    \ problem at hand (internal data), we can use the profit made as a metric and\
    \ then for each segment calculate the mean profit for all members in the cluster.\
    \ There are other metrics that can be used such as cancel rates, etc., depending\
    \ on the application scenario. The output of the cluster (Figure [10-25](#532459_1_En_10_Chapter.xhtml#Fig30))\
    \ can be linked with the original FarmCo.Internal.xlsx to know the profit of each\
    \ cluster member and then calculate each cluster’s mean profit made. This is revealed\
    \ in Table [10-2](#532459_1_En_10_Chapter.xhtml#Tab2). Notice that the profit\
    \ made is not part of the attributes for clustering as it will not be in the external\
    \ data.\n\nTable 10-2\n\nMean Cluster Profits"
  trans: "\n# 排版后的文档\n\n在 Figure 10-16 中，我们有一个更详细的概念模式版本，揭示了内部数据和外部数据中提出的聚类。（这只是为了给读者一个预期概念，实际上聚类的知识在初期可能并不像图中这样清晰。）\n\
    \n![图 10-16 更详细的概念设计](img/532459_1_En_10_Fig18_HTML.png)\n\n图 10-16 更详细的概念设计\n\
    \n1. **确定分析所需的数据及获取方式**：对于此方法，我们需要使用两组数据。内部数据名为 `FarmCo.Internal.xlsx`，外部数据名为\
    \ `FarmCo.External.csv`。\n\n2. **执行分析**：将对内部和外部数据执行以下步骤。\n    - **数据预处理**：\n \
    \       - **缺失值处理**：`k`-means 无法处理缺失值。如果缺失值很少，可以将其排除；如果缺失值很多，则必须进行插补。\n      \
    \  - **数据可视化**将用于发现离群值。将分类变量转换为数值型，因为 `k`-means 使用距离函数，无法直接处理分类变量（如果是序数，则用等差数列替换；如果是名义变量，则转换为二进制）。\n\
    \        - **数据归一化**将被用来均衡每个维度的权重。\n    - **确定 `k` 值**：有几种方法可以做到这一点（如前所述），但我们将指定要使用的\
    \ `k` 值。\n    - **创建聚类模型**：使用合适的距离度量来计算记录之间的距离（因为我们已将所有属性转换为数值，所以选择了数值度量）。\n \
    \   - **验证聚类**：为了验证生成的聚类，我们使用**平均质心内距离**。\n    - **解释结果**：比较聚类质心以描述不同聚类的特征，并尝试为每个聚类赋予一个标签。\n\
    \n## 内部数据 5a–e\n\n在检查内部数据的缺失值后，我们得到了 Figure 10-17 中的统计结果（向下滚动查看全部）。\n\n![图 10-17\
    \ 摘要统计](img/532459_1_En_10_Fig19_HTML.png)\n\n图 10-17 摘要统计\n\n通过检查数值属性的离群值（使用散点图），我们发现所有属性均无离群值。Figure\
    \ 10-18 是一个示例。\n\n![图 10-18 检查数值属性（总金额）](img/532459_1_En_10_Fig20_HTML.png)\n\n\
    图 10-18 检查数值属性（总金额）\n\nFigure 10-19 是内部数据的相关性矩阵结果；使用欧几里得距离时，高度相关的变量是不利的。Figure\
    \ 10-20 给出了成对表格（按降序排列）。基于此结果，我们将剔除`Item Count`、`No of C`、`Email Status = P`和`Quantity`，因为它们具有较高的相关值。\n\
    \n![图 10-20 成对相关性](img/532459_1_En_10_Fig22_HTML.jpg)\n\n图 10-20 成对相关性\n\n![图\
    \ 10-19 相关性矩阵](img/532459_1_En_10_Fig21_HTML.png)\n\n图 10-19 相关性矩阵\n\n为了确定 `k`\
    \ 值，我们将尝试 `2`、`3`、`4`，并选择分离效果最好的 `k`。重新导入数据，并在导入时将`Customer ID`的角色设为`Id`，以便将每个客户链接到其所属的聚类。Figure\
    \ 10-21 中的设置将生成 Figure 10-22a（`K=2`）、10-22b（`K=2` 的性能）、10-23a（`K=3`）、10-23b（`K=3`\
    \ 的性能）、10-24a（`K=4`）和 10-24b（`K=4` 的性能）中的可视化聚类结果。\n\n![图 10-24b K=4 的性能](img/532459_1_En_10_Fig29_HTML.jpg)\n\
    \n图 10-24b `K=4` 的性能\n\n![图 10-24a K=4 的聚类轮廓](img/532459_1_En_10_Fig28_HTML.png)\n\
    \n图 10-24a `K=4` 的聚类轮廓\n\n![图 10-23b K=3 的性能](img/532459_1_En_10_Fig27_HTML.jpg)\n\
    \n图 10-23b `K=3` 的性能\n\n![图 10-23a K=3 的聚类轮廓](img/532459_1_En_10_Fig26_HTML.png)\n\
    \n图 10-23a `K=3` 的聚类轮廓\n\n![图 10-22b K=2 的聚类性能](img/532459_1_En_10_Fig25_HTML.jpg)\n\
    \n图 10-22b `K=2` 的聚类性能\n\n![图 10-22a K=2 的聚类轮廓](img/532459_1_En_10_Fig24_HTML.png)\n\
    \n图 10-22a `K=2` 的聚类轮廓\n\n![图 10-21 聚类过程（k-means）](img/532459_1_En_10_Fig23_HTML.png)\n\
    \n图 10-21 聚类过程（`k-means`）\n\n根据上述结果，我们选择 `K=3`，原因如下：\n\n- **`avg._within_centroid_distance`**：平均簇内距离通过计算质心与簇内所有样本之间距离的平均值得到。该值越小越好。\n\
    - **`davies_bouldin`**：产生低簇内距离（高簇内相似性）和高簇间距离（低簇间相似性）的算法将具有较低的 Davies-Bouldin 指数；根据此标准，能够产生具有最小\
    \ Davies-Bouldin 指数聚类集合的聚类算法被认为是最佳算法。\n\n在确定内部数据的 `K=3` 后，为了选择适合当前问题（内部数据）的最佳细分结果，我们可以使用已获利润作为指标，然后计算每个细分中所有成员的聚类平均利润。还可以使用其他指标，例如取消率等，具体取决于应用场景。聚类的输出（Figure\
    \ 10-25）可以与原始 `FarmCo.Internal.xlsx` 关联，以了解每个聚类成员的利润，然后计算每个聚类的平均利润。表 10-2 展示了这一结果。请注意，已获利润不属于聚类的属性，因为它不会出现在外部数据中。\n\
    \n**表 10-2 平均聚类利润**\n"
