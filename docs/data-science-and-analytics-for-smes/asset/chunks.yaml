    \ we need to find out the current state of the website traffic. We want to answer\
    \ questions like the following:\n\n1.  *Is the website traffic increasing or decreasing?*\n\
    \    *   Why is the traffic going up and down? Why is it not increasing steadily?\n\
    \n    *   What special thing did they do in the months of March and May to give\
    \ a slight jump in visitors?\n\n    *   Anything happened in July to reduce the\
    \ website traffic\n\n    *   Could it be a decrease in published content or loss\
    \ of backlinks, etc.?\n\n    *   Could it be server failure, holidays, etc.?\n\
    \n    *   Where are the traffic coming from? Can the visits be broken down to\
    \ the sources of the traffic?\n\n    *   Break the traffic down to new users and\
    \ returning customers, and where are they coming from?\n\n    *   What marketing\
    \ techniques have they been using? Which ones have been successful and which ones\
    \ have not? It will be nice to use data to answer these questions.\n\n**Goal 2:\
    \ Increase website sales revenue**\n\nThe first thing to do is to use descriptive\
    \ analytics to find out the current situation of things as regards this goal.\
    \ Particularly, we want to explore the following metrics sales, revenue, and conversion\
    \ rate. These are the metrics that can help to measure and understand this problem\
    \ or goal. We want to answer questions like the following:\n\n*Are the sales and\
    \ revenue of the website incremental, fluctuating, plateauing, or declining?*\n\
    \nThe result of the descriptive analytics is presented in Section [9.5](#532459_1_En_9_Chapter.xhtml#Sec5)\
    \ for the two goals of this analytics project. For goal one, the result of the\
    \ descriptive analytics shows that the revenue is fluctuating contrary to the\
    \ ideal which should at least be increasing steadily. This then required that\
    \ there be a follow-up diagnosis analytics to find out why this is so. In the\
    \ diagnosis analytics, we want to answer the following questions:\n\n*Which marketing\
    \ activities increased orders?*\n\n*What is the effectiveness of marketing campaigns\
    \ as per order?*\n\n*Where are the orders coming from?*\n\n*What categories of\
    \ products are bringing in the order?*\n\n*What is the* ***AOV (average order\
    \ value)**, which tracks the average dollar amount spent each time a customer\
    \ places an order on a website?*\n\n*What marketing activities increased revenue?*\n\
    \n*What is the effectiveness of marketing campaigns as per revenue?*\n\n*Is the\
    \ revenue incremental?*\n\n*What is determining the conversion rates?*\n\n*  \
    \ *What paths are customers taking to check out?*\n\n*   *What is responsible\
    \ for low conversion rate?*\n\n*   *Why are visitors not buying or completing\
    \ the checkout process?*\n\n*   *What is their checkout process like? Is it complicated?*\n\
    \nThe answers to these questions will be revealed in the pre-engagement section\
    \ (Section [9.5](#532459_1_En_9_Chapter.xhtml#Sec5)). These answers, together\
    \ with the available data, will then determine the predictive modeling approach\
    \ that is described in Section [10.​1](#532459_1_En_10_Chapter.xhtml#Sec1).\n\n\
    ## 9.5 Pre-engagement\n\nIn this section, we will give examples of some of the\
    \ descriptive analytics outputs for answering some of the questions asked in the\
    \ previous section. Also, in the pre-engagement phase, there is a need to detail\
    \ the metrics to be used in assessing the success of these goals. Also, at this\
    \ stage after getting the results from the descriptive analytics, we need to decide\
    \ if recommendations will be made for implementation (i.e., we have been able\
    \ to discover some insights that the business can use to make some decisions)\
    \ or for further analysis (i.e., the results will form the basis for the modeling\
    \ in the engagement phase) or for future analytics (i.e., there is a need to provide\
    \ data advice that could help the analytics in the future).\n\n**Goal 1: Increase\
    \ website traffic**\n\nFor this goal, the success criterion is the website traffic,\
    \ and the current situation of such is depicted in Figure [9-4](#532459_1_En_9_Chapter.xhtml#Fig4).\n\
    \n![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig4_HTML.png)\n\nA line chart\
    \ relates the count of the session I D to months with a maximum number of pages\
    \ in May and the least number in August.\n\nFigure 9-4\n\nCurrent website traffic\n\
    \nFrom Figure [9-4](#532459_1_En_9_Chapter.xhtml#Fig4), we can see that the traffic\
    \ goes up and down, with a steady decline from June. At this point, we want to\
    \ find out if there is any reason for this from the organization’s point of view,\
    \ for example, change in marketing, weather, government issues, and so on. Ideally,\
    \ the traffic is supposed to be increasing steadily.\n\nThere are several angles\
    \ to these descriptive analytics that could be presented based on the available\
    \ data, for example, we can also try to see the top ten most visited pages and\
    \ the time of these visits. In addition, for each marketing channel, SEO, email\
    \ campaign, coupon code, social media, etc., report the new visitors, returning\
    \ visitors, orders, sales, conversions, new online accounts, and bounce that has\
    \ come from them in total (i.e., not monthly). The result of this will help to\
    \ know which channel is bringing in the visits, for example, and the diagnosis\
    \ can start from there. We will also be able to know if the investments in these\
    \ channels are proportional to the visit’s results.\n\nThe recommendation here\
    \ is that there needs to be further analysis preferably diagnosis analytics to\
    \ be able to find answers to the questions that have come up. In this book, we\
    \ will provide examples of such diagnosis report in Section [10.​1](#532459_1_En_10_Chapter.xhtml#Sec1),\
    \ but it is important to note that there are much more that could be done in this\
    \ regard not included. In addition, we plan to also directly increase the visit\
    \ to the website by using advanced descriptive analytics to recommend how to direct\
    \ traffic from the social media to the website.\n\n**Goal 2: Increase** **website\
    \ sales revenue**\n\nFor this goal, the success criteria chosen are orders, revenue,\
    \ and conversion rate. The current situation of these criteria is depicted in\
    \ Figures [9-5](#532459_1_En_9_Chapter.xhtml#Fig5), [9-6](#532459_1_En_9_Chapter.xhtml#Fig6),\
    \ and [9-7](#532459_1_En_9_Chapter.xhtml#Fig7), respectively.\n\n![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig7_HTML.png)\n\
    \nA line chart displays the maximum conversion rate in Week 32 and the least conversion\
    \ rate for event dates in Week 1.\n\nFigure 9-7\n\nCurrent conversion rate\n\n\
    ![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig6_HTML.jpg)\n\nA line chart\
    \ displays the maximum total cost in February and the least total cost for the\
    \ event date in April.\n\nFigure 9-6\n\nCurrent situation of the revenue\n\n![](images/532459_1_En_9_Chapter/532459_1_En_9_Fig5_HTML.jpg)\n\
    \nA bar chart displays the maximum order count for event dates in January and\
    \ the least order count for event dates in April.\n\nFigure 9-5\n\nCurrent state\
    \ of orders from the website"
  trans: "\n# 9.4 分析方法\n\n针对本分析项目需要探索的每个目标，我们将采用第 1.3 节中描述的分析方法。如前所述，根据应用场景的不同，我们可能会先使用描述性分析作为探索性研究的形式，以发现需要在诊断分析阶段回答的问题，然后再进行预测性分析和规范性分析。其他时候，我们可能直接进入其中任何一个阶段。所有这些决策都由分析项目的性质决定。\n\
    \n**目标 1：增加网站流量**\n\n使用描述性分析，我们需要了解网站流量的当前状态。我们希望回答以下问题：\n\n1.  *网站流量是增加还是减少？*\n\
    \    *   流量为何上下波动？为何没有稳步增长？\n    *   他们在三月和五月做了什么特别的事情使得访客数量略有提升？\n    *   七月份发生了什么导致网站流量减少？\n\
    \    *   是否是由于发布内容减少或反向链接丢失等原因？\n    *   是否可能是服务器故障、节假日等原因？\n    *   流量来自哪里？能否按流量来源对访问进行细分？\n\
    \    *   将流量细分为新用户和回访客户，他们分别来自哪里？\n    *   他们采用了哪些营销技巧？哪些是成功的，哪些是不成功的？用数据来回答这些问题将会很有帮助。\n\
    \n**目标 2：增加网站销售收入**\n\n首先要做的，是使用描述性分析来了解与该目标相关的当前状况。具体来说，我们希望探索以下指标：销售量、收入和转化率。这些指标有助于衡量和理解这个问题或目标。我们希望回答以下问题：\n\
    \n*网站的销售量和收入是递增、波动、停滞还是下降？*\n\n描述性分析的结果将在第 9.5 节中针对本分析项目的两个目标进行展示。对于目标一，描述性分析结果显示收入是波动的，而非理想中至少应稳步增长的状态。这就要求后续进行诊断分析，以找出原因。在诊断分析中，我们希望回答以下问题：\n\
    \n*哪些营销活动增加了订单？*\n\n*按订单量计算，营销活动的效果如何？*\n\n*订单来自哪里？*\n\n*哪些类别的产品带来了订单？*\n\n*`AOV（平均订单价值）`是多少？该指标追踪客户在网站上下单时每次的平均消费金额。*\n\
    \n*哪些营销活动增加了收入？*\n\n*按收入计算，营销活动的效果如何？*\n\n*收入是递增的吗？*\n\n*决定转化率的因素是什么？*\n\n*  \
    \ *客户结账的路径是怎样的？*\n*   *导致转化率低的原因是什么？*\n*   *为什么访客不购买或不完成结账流程？*\n*   *他们的结账流程是怎样的？是否复杂？*\n\
    \n这些问题的答案将在前期介入部分（第 9.5 节）中揭晓。这些答案，连同可用的数据，将共同决定第 10.1 节中描述的预测建模方法。\n\n## 9.5\
    \ 前期介入\n\n在本节中，我们将给出一些描述性分析输出的示例，以回答前一节中提出的部分问题。同时，在前期介入阶段，需要详细说明用于评估这些目标是否成功的指标。此外，在此阶段，获得描述性分析的结果后，我们需要决定是提出可供实施的建议（即，我们已经发现了一些企业可以用于决策的见解），还是进行进一步分析（即，结果将为介入阶段的建模奠定基础），亦或是为未来的分析做准备（即，需要提供数据建议，以帮助未来的分析工作）。\n\
    \n**目标 1：增加网站流量**\n\n对于这个目标，成功的标准是网站流量，其当前状况如图 9-4 所示。\n\n![](img/532459_1_En_9_Fig4_HTML.png)\n\
    \n折线图显示了会话 ID 计数与月份的关系，五月份页面数最多，八月份最少。\n\n图 9-4\n\n当前网站流量\n\n从图 9-4 中，我们可以看到流量上下波动，并且从六月份开始持续下降。此时，我们希望从组织的角度找出是否存在任何原因，例如营销策略的变化、天气、政府问题等。理想情况下，流量应该是稳步增长的。\n\
    \n根据可用数据，可以从多个角度呈现这些描述性分析结果，例如，我们还可以尝试查看访问量最高的前十页面以及这些访问的时间。此外，针对每个营销渠道（SEO、电子邮件营销、优惠码、社交媒体等），报告其带来的新访客、回访访客、订单、销售额、转化率、新在线账户和跳出率的总数（即非月度数据）。例如，结果将有助于了解哪个渠道带来了访问量，诊断便可以从此处开始。我们还将能够判断对这些渠道的投资是否与访问结果成正比。\n\
    \n此处给出的建议是，需要进行进一步分析，最好是诊断分析，以便能够为出现的问题找到答案。在本书中，我们将在第 10.1 节中提供此类诊断报告的示例，但需要注意的是，在这方面还有很多可以做的事情并未包含在内。此外，我们还计划通过使用高级描述性分析来建议如何将流量从社交媒体引导至网站，从而直接增加网站访问量。\n\
    \n**目标 2：增加网站销售收入**\n\n对于这个目标，选定的成功标准是订单量、收入和转化率。这些标准的当前状况分别如图 9-5、9-6 和 9-7 所示。\n\
    \n![](img/532459_1_En_9_Fig7_HTML.png)\n\n折线图显示，第 32 周的转化率最高，第 1 周的活动日期转化率最低。\n\
    \n图 9-7\n\n当前转化率\n\n![](img/532459_1_En_9_Fig6_HTML.jpg)\n\n折线图显示，二月份的总成本最高，四月份的活动日期总成本最低。\n\
    \n图 9-6\n\n当前收入状况\n\n![](img/532459_1_En_9_Fig5_HTML.jpg)\n\n柱状图显示，一月份活动日期的订单量最高，四月份活动日期的订单量最低。\n\
    \n图 9-5\n\n网站当前订单状态\n"
- fmt: "在Figure [9-5](#532459_1_En_9_Chapter.xhtml#Fig5)中，可以观察到网站的订单量略有下降，并逐渐在增加。造成这种下降的原因是什么？我们可以给出哪些建议以避免未来再次出现这种情况？\n\
    \n在Figure [9-6](#532459_1_En_9_Chapter.xhtml#Fig6)中，收入上下波动，而非稳定增长。在Figure [9-7](#532459_1_En_9_Chapter.xhtml#Fig7)中，周转化率也呈现出相同的波动趋势。\n\
    \n除了对这些目标进行进一步诊断分析的建议之外，我们还建议在预测性和规范性方法中建立一些模型，以直接增加网站的销售额和收入。这一点在Section [10.1](#532459_1_En_10_Chapter.xhtml#Sec1)中也有涉及。\n\
    \n# 10. 案例研究第二部分\n\n在本章中，我们将通过详细介绍所讨论案例研究的参与阶段，来总结用于说明典型中小企业商业分析咨询的案例研究。参与后阶段被省略，因为建议的实施由企业的系统和流程决定。需要注意的是，咨询步骤可以针对任何企业（尤其是小型企业）进行定制。第[9](#532459_1_En_9_Chapter.xhtml)章和第[10](#532459_1_En_10_Chapter.xhtml)章中描述的整个步骤已简化以便理解，但在实际业务应用中，可能需要反复迭代该过程，直到获得满意的结果。这是因为你需要不断吸收利益相关者和领域专家的反馈。\n\
    \n## 10.1 目标1：增加网站流量\n\n首先要明确阐述从第一个目标的参与前阶段总结出的分析流程。为实现增加网站流量的首要目标，我们将根据现有数据使用两种主要的分析方法。\n\
    \n1.  根据参与前阶段的结果，我们将进行诊断分析，以发现导致当前网站流量特征的原因，并根据结果提出建议。请注意，本节仅展示诊断分析的结果。为此，我们将使用描述性分析。\n\
    \n2.  我们将研究FarmCo运营的社交媒体环境，并尝试识别该环境中的一些主要影响者，以便进行营销和流量引导。为此，我们将使用社交网络分析。\n\n**分析结果**\n\
    \n1.  为实现此目标，合并了多个数据源，包括营销数据、促销数据以及FarmCo的Google Analytics账户数据。这些数据用于通过描述性分析回答以下问题。\n\
    \n2.  *为什么流量会上下波动？*\n\n    通过与销售和营销团队的访谈，发现五月和六月流量下降的原因是在Facebook等平台没有投放广告，而FarmCo仅依赖自然搜索。三月经历的流量增长是由于二月中旬的促销活动。\n\
    \n3.  *网站流量的输入是什么？*\n\n    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig1_HTML.png)\n\
    \n    一个水平条形图显示了默认渠道与用户数的关系。图表绘制了其他、直接、电子邮件、自然搜索、付费搜索、引荐和社交渠道的数值。自然搜索的数值最大。\n\n\
    \    Figure 10-1\n\n    网站流量的输入\n\n    Figure [10-1](#532459_1_En_10_Chapter.xhtml#Fig1)中的结果用于评估这些平台可用的预算，并查看其是否与从这些平台获得的流量结果成正比。\n\
    \n    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig2_HTML.png)\n\n    一个折线图绘制了从2021年1月1日到2021年8月1日期间的用户数与日期关系。用户数、新用户数和回访用户数的曲线分别在1500至2500、500至1700和500至1000之间波动。所有数据均为近似值。\n\
    \n    Figure 10-2\n\n    流量类型\n\n4.  *他们获得了什么类型的流量？*\n\n    流量类型的结果（Figure [10-2](#532459_1_En_10_Chapter.xhtml#Fig2)）将帮助他们了解谁真正有兴趣访问他们的网站；是新的还是回访的访客？这些信息可以通过多种方式使用；一个例子是了解在进行营销时如何调整他们的目标受众。\n\
    \n5.  *新客户/回访客户的流量来自哪里？*\n\n    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig3_HTML.png)\n\
    \n    一个水平条形图显示了流量来源与用户数的关系。图表绘制了其他、直接、电子邮件、自然搜索、付费搜索、引荐和社交渠道的数值。\n\n    Figure\
    \ 10-3\n\n    新客户/回访客户的流量来源\n\n    从领域专家那里获悉，回访客户更有可能成交，这使得我们特别关注回访客户。从Figure\
    \ [10-3](#532459_1_En_10_Chapter.xhtml#Fig3)中，我们可以看到，虽然数量很小，但电子邮件和引荐似乎拥有最高比例的回访客户。因此，战略选择要么是继续从自然搜索获取大量流量，希望更多人回访，要么是增加来自电子邮件和引荐的客户数量，或两者兼施。\n\
    \n6.  *访问网站的是什么样的人（人口统计、兴趣等）？*\n\n    Figure [10-4a](#532459_1_En_10_Chapter.xhtml#Fig4)和[10-4b](#532459_1_En_10_Chapter.xhtml#Fig5)中的结果有助于评估营销中使用的目标受众的兴趣和人口统计信息是否与实际访问网站的人一致？由此得出的结论将有助于调整营销所针对的受众。\n\
    \n    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig5_HTML.png)\n\n    一个饼图显示了按年龄段划分的访问网站的用户。25至34岁年龄段的用户数量最多，65岁及以上的用户数量最少。\n\
    \n    Figure 10-4b\n\n    访客人口统计（年龄）\n\n    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig4_HTML.png)\n\
    \n    一个饼图显示了访问网站的不同类型用户。该饼图显示了所有类型的用户分布。\n\n    Figure 10-4a\n\n    访客人口统计（兴趣）\n\
    \n总之，有必要在促销活动的时间安排上采取果断措施。还需要调整营销的目标受众以增加流量。同时还发现了一些有价值的营销渠道/活动，可以将预算集中于此以增加流量。\n\
    \n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig6_HTML.png)\n\n一张图片显示了用户名`nig_farmer`，该用户名连接了许多其他用户名，形成了一个网络。\n\
    \nFigure 10-5\n\nFarmCo的可视化网络\n\n1.  为了演示，我们只选取FarmCo的一种产品——家禽；对于这种产品，我们使用搜索条件（`poultry`，`Nigeria`）从[netlytic.org](http://netlytic.org)提取推文。我们能够创建在尼日利亚对该产品感兴趣的人的沟通网络。用于此实际演示的数据名为`PoultryNigeria.gephi`。加载数据、运行所有统计信息并对网络进行必要的修饰后（使用了特征向量中心性），生成的网络如Figure\
    \ [10-5](#532459_1_En_10_Chapter.xhtml#Fig6)所示。\n\n从Figure [10-5](#532459_1_En_10_Chapter.xhtml#Fig6)中，用户名`nig_farmer`是主要影响者，可用于营销推广的触达。"
  raw: 'In Figure [9-5](#532459_1_En_9_Chapter.xhtml#Fig5), it can be observed that
    the orders from the website slightly declined and are gradually increasing. What
    is responsible for this decline? What recommendations can we give to avoid such
    in the future?


    In Figure [9-6](#532459_1_En_9_Chapter.xhtml#Fig6), the revenue fluctuates up
    and down instead of a steady increase. In Figure [9-7](#532459_1_En_9_Chapter.xhtml#Fig7),
    the weekly conversion rate also suffers from the same fluctuation trend.


    Apart from the recommendation for the further diagnosis analytics for this goal,
    we would also recommend some modeling in the predictive and prescriptive approaches
    in order to directly increase the sales and revenue from the website. This is
    also covered in Section [10.​1](#532459_1_En_10_Chapter.xhtml#Sec1).


    # 10. Case Study Part II


    In this chapter, we will conclude the case study used for the illustration of
    a typical Business Analytics consulting for an SME by presenting the details of
    the engagement phase for the case study in question. The post-engagement phase
    is left out as the implementation of the recommendations is determined by the
    systems and procedures of the business. It is important to note that the consulting
    steps can be customized for any business (particularly small businesses). The
    whole steps described in Chapters [9](#532459_1_En_9_Chapter.xhtml) and [10](#532459_1_En_10_Chapter.xhtml)
    have been made simple for understanding, though in real-life business applications,
    there might be a need to iterate the process until satisfactory results have been
    obtained. This is because you constantly need to incorporate feedback from the
    stakeholders and domain experts.


    ## 10.1 Goal 1: Increase Website Traffic


    The first thing is to state clearly the analytics procedure concluded from the
    pre-engagement phase for the first goal. To address the first goal of increasing
    website traffic, we will use two major analytics approaches given the available
    data.


    1.  From the result of the pre-engagement phase, we will follow up with a diagnosis
    analysis to discover what is responsible for the nature of the current website
    traffic and make recommendations from the results. Note that in this section,
    only the results of the diagnosis analysis are presented. For this, we will use
    descriptive analytics.


    2.  We will study the social media environment in which FarmCo operates and attempt
    to identify some major influencers in that environment for the purpose of marketing
    and directing traffic. For this, we will use social network analysis.


    **Analytics** **result**


    1.  Several data sources were combined to address this goal, data from marketing,
    sales promotion, and also data from the Google Analytics account of FarmCo. The
    data was used to answer the following questions using descriptive analytics.


    2.  *Why is the traffic going up and down?*


    From the interview with the sales and marketing team, it was discovered that the
    reduction in the month of May and June is based on the reason that there was no
    advert on Facebook, etc., but FarmCo relied only on organic search. The increase
    in traffic experienced in the month of March is due to a promotion in the month
    of February middle promotion.


    1.  *What are the inputs to the* *website traffic**?*


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig1_HTML.png)


    A horizontal bar graph depicts default channels versus users. The graph plots
    the values for others, direct, email, organic search, paid search, referral, and
    social. The value is the maximum for organic search.


    Figure 10-1


    Inputs to the website traffic


    The result in Figure [10-1](#532459_1_En_10_Chapter.xhtml#Fig1) is used to evaluate
    the budget available for these platforms and see if it is directly proportional
    to the traffic results obtained from them.


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig2_HTML.png)


    A line graph plots the number of users versus the dates 1 January 2021 through
    1 August 2021\. The lines for users, new users, and returning users fluctuate
    between 1500 and 2500, 500 and 1700, and 500 and 1000, respectively. All data
    are approximate.


    Figure 10-2


    Type of traffic


    1.  *What kind of traffic are they getting?*


    The result of the type of traffic (Figure [10-2](#532459_1_En_10_Chapter.xhtml#Fig2))
    will help them to know who is actually interested in visiting their website; is
    it new or returning visitors? This information can be used in several ways; an
    example is to know how to modify their target audience when marketing.


    1.  *Where is the traffic of new customers/returning customers* *coming from?*


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig3_HTML.png)


    A horizontal bar graph depicts the source of traffic versus users. The values
    are plotted for others, direct, email, organic search, paid search, referral,
    and social.


    Figure 10-3


    Source of traffic for new/returning customers


    From the domain expert, it was gathered that returning customers are more likely
    to do business, and this makes us particularly interested in the returning customers.
    From Figure [10-3](#532459_1_En_10_Chapter.xhtml#Fig3), we can see that though
    small in number, the email and referral seem to be having the highest proportion
    of returning customers. So the strategic option here is either to keep getting
    large traffic from the organic search, for example, hoping that more will return,
    or to increase the number of customers from email and referrals or both.


    1.  *What kind of people are visiting the website (demography, interests, etc.)?*


    The results in Figure [10-4a](#532459_1_En_10_Chapter.xhtml#Fig4) and [10-4b](#532459_1_En_10_Chapter.xhtml#Fig5)
    is to help evaluate if the interest and demography of the target audience used
    in marketing tallies with that of those actually coming to the website? Conclusions
    from this will help to adjust the marketing audience targeted.


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig5_HTML.png)


    A pie chart depicts users visiting the website according to their age group. The
    age group 25 to 34 has the maximum number of users, and 65 and above has the minimum
    number of users.


    Figure 10-4b


    Demography of visitors (age)


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig4_HTML.png)


    A pie chart depicts different types of users visiting the website. The pie chart
    is equally divided for all kinds of users.


    Figure 10-4a


    Demography of visitors (interests)


    In summary, there is a need to take decisive steps on the timing of promotional
    activities. There is also a need to adjust the target audience for marketing to
    increase traffic. Also discovered are the valuable marketing channels/campaigns
    to focus the budget on to increase the traffic.


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig6_HTML.png)


    An image depicts the user name n i g underscore farmer which is connected to many
    other user names, forming a network.


    Figure 10-5


    Visualized Network of FarmCo


    1.  For this demonstration, we pick only one product of FarmCo, which is poultry;
    for this product, we use the search criteria (poultry, Nigeria) to extract tweets
    on [netlytic.​org](http://netlytic.org). We are able to create the communication
    network of people interested in this product in Nigeria. The data to be used for
    this practical demo is named PoultryNigeria.gephi. After loading the data, running
    all the statistics, and performing necessary cosmetics for the network (eigenvector
    centrality was used), the resulting network is given in Figure [10-5](#532459_1_En_10_Chapter.xhtml#Fig6).


    From Figure [10-5](#532459_1_En_10_Chapter.xhtml#Fig6), the username nig_farmer
    is the major influencer and can be used for reaching out for marketing purposes.'
  trans: "\n在图 9-5 中，可以观察到网站订单量略有下降后又逐渐回升。造成这种下降的原因是什么？我们可以给出哪些建议来避免未来再次出现这种情况？\n\n\
    在图 9-6 中，收入上下波动，而非稳定增长。图 9-7 显示，周转化率也呈现出同样的波动趋势。\n\n除了对这些目标进行更深层次诊断分析的建议外，我们还建议在预测性和规范性方法中建立一些模型，以直接增加网站的销售额和收入。这一点在第\
    \ 10.1 节中也有所涉及。\n\n# 10. 案例研究第二部分\n\n在本章中，我们将通过详细介绍所讨论案例研究的参与阶段，来总结用于说明典型中小企业商业分析咨询的案例研究。参与后阶段被省略，因为建议的实施取决于企业的系统和流程。需要注意的是，咨询步骤可以根据任何企业（尤其是小型企业）进行定制。第\
    \ 9 章和第 10 章中描述的整个步骤已简化以便理解，但在实际业务应用中，可能需要反复迭代该过程，直到获得满意的结果。这是因为你需要不断吸收利益相关者和领域专家的反馈。\n\
    \n## 10.1 目标 1：增加网站流量\n\n我们首先要明确阐述从第一个目标的参与前阶段总结出的分析流程。为了实现增加网站流量的首要目标，我们将根据现有数据采用两种主要的分析方法。\n\
    \n1.  根据参与前阶段的结果，我们将进行诊断分析，以发现造成当前网站流量特征的原因，并基于结果提出建议。请注意，本节仅展示诊断分析的结果。为此，我们将使用描述性分析。\n\
    \n2.  我们将研究 FarmCo 运营的社交媒体环境，并尝试识别该环境中的一些主要影响者，以便开展营销和引导流量。为此，我们将使用社交网络分析。\n\n\
    **分析结果**\n\n1.  为实现此目标，我们合并了多个数据源，包括营销数据、促销数据以及 FarmCo 的 Google Analytics 账户数据。这些数据用于通过描述性分析回答以下问题。\n\
    \n2.  *为什么流量会上下波动？*\n\n    通过与销售和营销团队的访谈，我们发现 5 月和 6 月流量下降的原因是未在 Facebook 等平台投放广告，FarmCo\
    \ 仅依赖自然搜索。3 月份经历的流量增长是由于 2 月中旬的促销活动。\n\n3.  *网站流量的输入是什么？*\n\n    ![](img/532459_1_En_10_Fig1_HTML.png)\n\
    \n    一个水平条形图显示了默认渠道与用户数的关系。图表绘制了其他、直接、电子邮件、自然搜索、付费搜索、引荐和社交渠道的数值。自然搜索的数值最大。\n\n\
    \    图 10-1\n\n    网站流量的输入\n\n    图 10-1 中的结果用于评估这些平台可用的预算，并查看其是否与从这些平台获得的流量结果成正比。\n\
    \n    ![](img/532459_1_En_10_Fig2_HTML.png)\n\n    一个折线图绘制了从 2021 年 1 月 1 日到 2021\
    \ 年 8 月 1 日期间的用户数与日期关系。用户数、新用户数和回访用户数的曲线分别在 1500 至 2500、500 至 1700 和 500 至 1000\
    \ 之间波动。所有数据均为近似值。\n\n    图 10-2\n\n    流量类型\n\n4.  *他们获得了什么类型的流量？*\n\n    流量类型的结果（图\
    \ 10-2）将帮助他们了解谁真正有兴趣访问他们的网站；是新的访客还是回访的访客？这些信息可以通过多种方式得到应用；一个例子是了解在进行营销时如何调整他们的目标受众。\n\
    \n5.  *新客户/回访客户的流量来自哪里？*\n\n    ![](img/532459_1_En_10_Fig3_HTML.png)\n\n    一个水平条形图显示了流量来源与用户数的关系。图表绘制了其他、直接、电子邮件、自然搜索、付费搜索、引荐和社交渠道的数值。\n\
    \n    图 10-3\n\n    新客户/回访客户的流量来源\n\n    从领域专家那里我们获悉，回访客户更有可能成交，这让我们特别关注回访客户。从图\
    \ 10-3 中，我们可以看到，尽管数量很小，但电子邮件和引荐似乎拥有最高比例的回访客户。因此，战略选择要么是继续从自然搜索获取大量流量，希望更多人回访，要么是增加来自电子邮件和引荐的客户数量，或者两者并行。\n\
    \n6.  *访问网站的是什么样的人（人口统计信息、兴趣等）？*\n\n    图 10-4a 和 10-4b 中的结果有助于评估营销中使用的目标受众的兴趣和人口统计信息是否与实际访问网站的人一致？由此得出的结论将有助于调整营销所针对的受众。\n\
    \n    ![](img/532459_1_En_10_Fig5_HTML.png)\n\n    一个饼图显示了按年龄段划分的访问网站的用户。25 至\
    \ 34 岁年龄段的用户数量最多，65 岁及以上的用户数量最少。\n\n    图 10-4b\n\n    访客人口统计信息（年龄）\n\n    ![](img/532459_1_En_10_Fig4_HTML.png)\n\
    \n    一个饼图显示了访问网站的不同类型用户。该饼图显示了所有类型的用户分布。\n\n    图 10-4a\n\n    访客人口统计信息（兴趣）\n\
    \n总之，有必要在促销活动的时间安排上采取果断措施。还需要调整营销的目标受众以增加流量。同时我们还发现了一些有价值的营销渠道/活动，可以将预算集中于此以增加流量。\n\
    \n![](img/532459_1_En_10_Fig6_HTML.png)\n\n一张图片显示了用户名`nig_farmer`，该用户名连接了许多其他用户名，形成了一个网络。\n\
    \n图 10-5\n\nFarmCo 的可视化网络\n\n1.  为了演示，我们只选取 FarmCo 的一种产品——家禽；对于这种产品，我们使用搜索条件（`poultry`，`Nigeria`）从[netlytic.org](http://netlytic.org)提取推文。我们能够创建在尼日利亚对该产品感兴趣的人的沟通网络。用于此实际演示的数据名为`PoultryNigeria.gephi`。加载数据、运行所有统计信息并对网络进行必要的修饰后（使用了特征向量中心性），生成的网络如图\
    \ 10-5 所示。\n\n从图 10-5 中，可以看出用户名`nig_farmer`是主要影响者，可用于营销推广的触达。\n"
- fmt: '## 10.2 Goal 2: Increase Website Sales Revenue


    Just like the first goal, we first state clearly the analytics procedure concluded
    from the pre-engagement phase for the second goal. To address the second goal,
    we will use three major analytics approaches given the available data:


    1. *Customer loyalty intervention*: Apply logistic regression on sampled historical
    data to build a model to discover the customers that will churn. This model will
    be used to predict what the existing customers on their website will do (churn
    or not churn). This will then be followed up with associative rule mining, which
    will be used to recommend products to those that would have churned through email.
    In this approach, churn is described as those that have not bought anything in
    the last two years back from the last date that the historical data was sampled.


    2. *Recency, frequency, and monetary segmentation*: For the second approach, we
    will perform RFM segmentation. This was a decision based on the lack of attribute
    richness for the typical clustering. The intention is to be able to understand
    and profile the current customers of FarmCo for better understanding toward customer
    relationship management.


    3. *Strategic market target*: This approach will model prescriptive analytics.
    Prescriptive analytics will be used to determine the best actionable strategy
    for targeting future customers. For this analytics approach, the clustering technique
    will be used, `k-means` clustering to be specific. We will also be adopting the
    thinking backward approach in the analytics project.


    ### Customer loyalty intervention


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig7_HTML.png)


    A screenshot depicts an example set for logistic regression slash sample historical.
    A bar graph plots the values for international and N C.


    **Figure 10-6** Example of studying the target variable to categorical outcome


    1. Study the target variable to categorical outcome using a bar chart, outcome
    on y axis (example in Figure [10-6](#532459_1_En_10_Chapter.xhtml#Fig7)). Doing
    this for all relevant attributes revealed that (apart from `Email Status`, `Os
    Version`, and `Payment Method`) the categories of all the categorical attributes
    are fairly OK as there are no attributes with too many categories or error in
    the categories or imbalanced categories. If any of these issues existed, it needs
    to be dealt with at this point.


    2. Import the data named `SampleHistorical.xlsx`, replace errors with missing
    values, and exclude `CustomerID`, `Billing State`, `Email Permission`, `Device
    Brand`, `Shipping Country`, and `Shipping State` (this is due to either too many
    categories or only one category).


    3. Check the statistics to be sure that there are no missing values.


    4. Visualize the attribute for the classification task using the following as
    a guide:


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig8_HTML.png)


    A screenshot depicts an example set for retrieving sample historical data. A scatterplot
    depicts item count versus discounted price for churn and non-churn. The highest
    churn plotted in (540000, 300).


    **Figure 10-7** An example of studying the relationship of the outcome variable
    to pairs of numerical predictors via a color-coded scatter plot


    5. Study the relationship of the target/outcome variable to pairs of numerical
    predictors via a color-coded scatter plot (example in Figure [10-7](#532459_1_En_10_Chapter.xhtml#Fig8)).
    Doing this for all relevant variables revealed that there is no correlation between
    the numerical predictors. This therefore means that we can move all the numerical
    predictors to the modeling stage.


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig9_HTML.png)


    A screenshot depicts the correlation analysis for different items with fourteen
    columns and rows.


    **Figure 10-8** Correlation matrix


    6. Use correlation analysis to remove correlated attributes (Figure [10-8](#532459_1_En_10_Chapter.xhtml#Fig9)).
    The results of the correlation revealed that there is a need to remove either
    `Item Count` or `Quantity` as they are highly correlated.


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig11_HTML.png)


    A table consists of three rows and columns. The column headers are true churn,
    true not churn, and class precision. The row headers are predicted churn, predict
    not churn, and class recall are given.


    **Figure 10-10** Evaluation of the logistic regression model


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig10_HTML.png)


    A screenshot depicts a table with six columns and eighteen rows. The column headers:
    attribute, coefficient, stratified coefficient, stratified error, z-value, and
    p-value. The values for the different attributes are given.


    **Figure 10-9** Logistic regression model


    7. Using the conclusions from step 3a–c, you can create a logistic regression
    model as seen in Figure [10-9](#532459_1_En_10_Chapter.xhtml#Fig10). (Note that
    it is better to use stratified cross-validation as the data sample is small.)
    The evaluation of the model is seen in Figure [10-10](#532459_1_En_10_Chapter.xhtml#Fig11).
    The model gave an accuracy of 61.08%. (Note that at this stage, there is a need
    to try other algorithms, attribute selection techniques, and so on, if we desire
    a higher accuracy, but for the purpose of this illustration, we proceed regardless.)


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig12_HTML.png)


    A screenshot depicts the prediction result for the different attributes with eleven
    columns and nineteen rows. The column headers are prediction, confidence churn,
    and non churn, billing count, browser, device type, email status, Os, payment,
    and discount.


    **Figure 10-11** Prediction Result


    8. Using the modeling in Figure [10-9](#532459_1_En_10_Chapter.xhtml#Fig10), we
    can predict the intention of the current customers to churn using the data named
    `FoodAgricGroup.xlsx`. Take note that this data does not contain the attribute
    named `Intention`, as this is what is to be predicted. The result of the prediction
    can be seen in Figure [10-11](#532459_1_En_10_Chapter.xhtml#Fig12).


    ![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig13_HTML.png)


    A screenshot depicts the result history with data, graph, description, and annotations,
    and the result of the association rules in a table format with 10 columns and
    twenty rows.


    **Figure 10-12** Result of association rule mining


    9. The next step is to use the transactional data named `FoodAgricTransAsso.xlsx`
    to perform the association rule to discover items that are being sold together.
    The result of this is revealed in Figure [10-12](#532459_1_En_10_Chapter.xhtml#Fig13).


    10. To conclude this analytics approach, we will use the inference in Figure [10-12](#532459_1_En_10_Chapter.xhtml#Fig13)
    to recommend products to customers (with high propensity to churn as revealed
    in Figure [10-11](#532459_1_En_10_Chapter.xhtml#Fig12)) through an email marketing
    campaign. Note that this is just one approach to implementing the analytics results.
    There are other creative ways that can be explored such as embedding a recommendation
    engine on the website and many more.


    ### RFM segmentation


    RFM segmentation is used to target certain clusters of clients with communications
    that are more tailored to their specific behaviors. RFM segmentation is a useful
    tool for identifying groups of clients who should be given extra attention. The
    letters RFM stand for recency, frequency, and monetary value. RFM uses numerical
    scales to produce a high-level portrayal of clients that is both brief and instructive.
    It is straightforward to comprehend and interpret.


    - *Recency*: How long has it been since a consumer engaged in an activity or made
    a purchase with the brand?

    - *Frequency*: How often has a customer transacted or interacted with the brand
    during a particular period of time?'
