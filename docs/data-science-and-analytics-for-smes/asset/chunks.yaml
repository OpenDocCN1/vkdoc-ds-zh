- fmt: '# 5. Descriptive Analytics Tools


    This chapter is focused on the mostly common descriptive analytics tools used
    in business generally and specifically in small businesses. The chapter will help
    to use descriptive analytics tools to understand your business and make recommendations
    that can improve your business profits. For small businesses, descriptive analytics
    helps SMEs to make sense of available data to monitor business indicators at a
    glance, help SME owners observe sales trends and patterns on an overall basis,
    and deep dive into product categories and customer groups. It also helps SMEs
    plan product strategy, pricing policies that will maximize their projected revenues
    and derive valuable insights for getting more customers.


    ## 5.1 Introduction


    In Business Analytics, descriptive analytics helps to link the market to the firm
    through information and provide information needed for actionable decisions. Therefore,
    descriptive analytics can be seen as the principles for systematically collecting
    and interpreting data that can aid decision makers. There are three types of descriptive
    analytics:


    *   *Exploratory research*: This is used in situations where there is a need to
    solve an ambiguous problem, for example, to conduct exploratory research to find
    out why sales are declining.

    *   *Descriptive research*: It provides answers to questions bothering on awareness,
    for example, what kind of people are buying our goods?

    *   *Causal research*: This is used in situations where the problem is clearly
    defined, for example, will buyers purchase more of our products with a change
    of our store arrangement?


    The rest of this chapter picks each of the common descriptive analytics tools
    and gives detailed explanation on their uses and a practical demonstration of
    how to use them. The data used for the practical demonstrations in this chapter
    is named `SuperstoreNigeria.xls`.


    `RapidMiner` can be used for several types of visualization, but we have selected
    the popular and most common ones in this chapter.


    ## 5.2 Bar Chart


    The bar chart can be used to examine categorical data for unexpected patterns
    of results, for example, there may be many more of some categories than others.
    Some categories may be missing completely or there might even be uneven distributions
    in the categories. There might even be extra categories, for example, if there
    was a mistake and the gender was recorded as `"M"` and `"F,"` but also as `"m"`
    and `"f,"` `"male"` and `"female."` There may also be unbalanced experiments such
    that some data are missing or unusable; this can be discovered using bar charts.
    Bar charts can also help to discover when we have too many categories and make
    decisions as to whether we are to combine them and how. Finally, it can reveal
    errors and missing values.


    **Creating a bar chart in RapidMiner**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig1_HTML.png)


    The imported data for row ID, column ID, order date, ship date, ship mode, customer
    ID, segment, and country are listed.


    Figure 5-1 Screenshot of the imported data


