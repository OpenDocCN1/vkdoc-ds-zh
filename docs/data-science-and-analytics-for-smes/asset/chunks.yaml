  trans: "\n## 5.12 习题\n\n1.  本练习是实操业务问题一（第 5.11 节）的延续。目的是利用 `SuperstoreNigeria.xls`\
    \ 发掘更多见解，回答以下问题。（注意：部分问题可能需要使用如 Tableau 等更交互式的可视化工具。）\n    1.  每个子类别的销售额总和是多少？这与利润有何关系？即哪个子类别利润最高，哪个最低？请使用颜色进行标识。\n\
    \    2.  每个细分市场的销售额总和是多少？这与数量有何关系？即哪个细分市场产量最高，哪个最低？请使用颜色进行标识。\n    3.  哪些州获得了最高和最低的折扣？（使用地图。）\n\
    \    4.  哪些州的利润较高？（使用文字云、树状图和气泡图。）\n    5.  哪些州获得了最高和最低的折扣？（使用地图。）\n    6.  在尼日利亚的哪个类别、子类别和州，销售额最高？\n\
    \    7.  在尼日利亚的哪个类别、子类别、地区和州，销售额最高？\n    8.  对于名为“家具”的类别，且其配送方式属性为标准级，所获得的总利润和总销售额是多少？请确保输出结果有恰当的标题，即“类别与配送方式的总销售额和总利润”。\n\
    \    9.  对于使用标准级配送方式的办公用品，其销售总数量和总销售额是多少？\n    10. 基于类别和子类别，比较东区与西区的销售额。\n\n2.\
    \  你已获得一份名为 `chapter5Assign.xls` 的数据。该数据包含一家尼日利亚面条零售企业的交易数据（*数据为虚构，仅供作业使用*）。假设该企业希望基于描述性分析的结果，获得有效营销活动的建议，而你被聘用为数据科学家，请以仪表盘的形式向管理层展示你的结果。\n\
    \n# 6. 预测数值型结果\n\n在本章中，我们将探讨用于预测的流行技术，尤其是在零售业务中的应用。解释这些技术的方法是利用它们来解决一个业务问题。要解决的业务问题是零售业务中常见的销售预测问题。本章首先解释预测技术的基本概念；接着，我们探讨如何评估这些技术。之后，我们描述意图解决的业务问题。然后，我们逐一选取各项选定技术，解释所涉及的算法以及如何用它们来解决所描述的问题。使用的预测技术包括多元线性回归、回归树和神经网络。作为本章的结尾，我们比较这三种算法的结果，并针对该问题得出结论。因此，本章提供的分析产品是针对小型零售企业的销售预测问题。\n\
    \n## 6.1 引言\n\n在分析之旅第 1.​3 节中，曾提到分析主要分为三类：描述性分析、预测性分析和规范性分析。在本章中，我们将使用预测性分析来解决小型零售企业的销售预测问题。为了为预测性分析打下良好基础，我们将解释一些基本概念。\n\
    \n机器学习用于研究计算机如何基于数据进行学习或提升性能。在机器学习中，计算机会自动学习识别复杂模式，并基于数据做出智能决策。³\n\n*监督学习*：这是向算法输入数据的过程，其中已知感兴趣的输出变量，算法“学习”如何在输出未知时用新记录预测该值。预测性分析属于监督学习范畴。预测性分析有两种类型：预测分类结果（分类），例如“购买”或“不购买”；以及预测数值型结果（预测），例如股票价格。预测算法的示例包括多元线性回归、回归树（决策树）、逻辑回归、用于回归的\
    \ `SVM`（支持向量机）等。分类方法的示例包括朴素贝叶斯、贝叶斯网络、分类树（决策树）、`KNN`、`SVM`（支持向量机）等。在本章中，我们将重点讨论处理数值型结果预测的那类预测性分析。用于预测数值型结果的历史数据是有标签的，意味着数据中所有行都以一个目标属性结尾，该属性正是我们打算预测的属性。在预测数值型或分类结果时，数据需要按比例划分，例如\
    \ 70% 或 60% 用于训练，30% 或 40% 用于测试。有些算法，如 `KNN`（K-近邻），需要不同的划分方式，因为需要使用一个划分集来确定最佳的\
    \ k 值。这将在第 7 章中讨论。\n\n在商业中，预测可用于实现以下目标，例如：\n\n*   根据人口统计信息和先前的活动模式预测客户的信用卡行为\n\
    *   利用历史的飞行常客信息预测度假旅行支出\n*   利用历史数据、产品和销售信息预测客服人员需求\n*   基于历史数据，通过产品交叉销售预测销售额\n\
    *   预测折扣对零售额的影响\n\n分类可用于实现以下目标，例如：\n\n*   确定哪些贷款申请人属于高风险或低风险对象。\n*   在市场营销中，例如，分类有助于判断客户是否会购买产品。\n\
    *   分类在确定客户忠诚度方面非常有价值；特别是，我们可以预测客户是否会流失。\n\n*无监督学习*：这类分析旨在尝试发现数据中的模式，而非预测期望的输出值。聚类属于机器学习的无监督学习方法，此外还有许多其他方法。在这种方法中，原始、无标签且未划分的数据被输入算法，而输出的则是已标签或已分类的数据。\n"
- fmt: '# 6.2 Evaluating Prediction Models


    In this section, we look at how to evaluate prediction models, which is the main
    focus of this chapter. Several measures are used to evaluate prediction performance.
    These metrics are based on a validation or test dataset, which is more objective
    than the training dataset. The validation dataset isn’t used to choose predictors
    or calculate model parameters. The prediction error (`e`) is the discrepancy between
    the outcome value and the predicted outcome value for the record `i`.^(1,3)


    ![$$ {e}_i={y}_i-{\hat{y}}_i $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ1.png)


    (Eq. 6.1)


    Some numerical measurements of prediction accuracy are as follows:


    * **MAE (mean absolute error/deviation)**: This represents the average absolute
    error’s magnitude.


    ![$$ \frac{1}{n}{\sum}_{i=1}^n\left|{e}_i\right| $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ2.png)


    (Eq. 6.2)


    * **Mean error**: This measure is similar to the MAE, except that it preserves
    the sign of the errors, allowing negative errors to cancel out positive errors
    of equal magnitude.


    ![$$ \frac{1}{n}{\sum}_{i=1}^n{e}_i $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ3.png)


    (Eq. 6.3)


    * **MPE (mean percentage error)**: This is a percentage score that indicates how
    far predictions differ from actual values (on average), taking into account the
    error’s direction.


    ![$$ 100\times \frac{1}{n}{\sum}_{i=1}^n\frac{e_i}{y_i} $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ4.png)


    (Eq. 6.4)


    * **MAPE (mean absolute percentage error)**: This metric gives a percentage score
    for how far predictions differ from actual values (on average).


    ![$$ 100\times \frac{1}{n}{\sum}_{i=1}^n\left|\frac{e_i}{y_i}\right| $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ5.png)


    (Eq. 6.5)


    * **RMSE (root mean squared error)**: This is comparable to the standard error
    of estimate in linear regression; however, it is calculated using validation data
    instead of training data. Its units are the same as the outcome variables.


    ![$$ \sqrt{\sum_{i-1}^n{e}_i^2} $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ6.png)


    (Eq. 6.6)


    A lift chart is a graphical representation of a model’s prediction performance,
    especially when the purpose is to rank the predicted results. (For more explanations,
    check Galit et al. (2018), Chapter [5](#532459_1_En_5_Chapter.xhtml).)


    ## 6.3 Practical Business Problem II (Sales Prediction)


    For this practical business problem, we will use a large Toyota car dealership
    company. The way the business runs is that if you want to buy a new Toyota car,
    you have an option to sell your old car to the company and add money to what you
    get and buy a new one. The company now aims to entice more consumers to come in
    and sell their used Toyota Corollas by running a promotion in which it will pay
    top dollar for used Toyota Corollas. The company’s goal is to resell the used
    ones that were purchased and make a profit. So the business analyst’s job is to
    predict the price at which the company will purchase these old cars (from their
    customers) in order to make a profit. Since this book looks at solving the business
    problems from the consulting approach, we try to present the solution to resemble
    the typical way you would approach it as a consultant. To do this, we explore
    three suitable and most popular algorithms (multiple linear regression, regression
    trees, and neural network) and compare the results to make our conclusions. It
    is important to say here that selecting the algorithms used here is not the only
    way that this experiment can be carried out; we can try other approaches, particularly
    in terms of the attribute combinations, algorithm settings, and algorithm types.
    The ultimate goal is to get the best performance while avoiding bias in data.


    The data for this practical business problem is named `ToyotaCorollaData.xlsx`,
    and it offers information about past used cars purchased by the company. The data
    description is as follows:


    | Variable | Description |

    | --- | --- |

    | `Id` | *Unique identification* |

    | `Price` | *Offer price* |

    | `Age` | *Age in months* |

    | `KM` | *Kilometers* |

    | `Fuel_Type` | *Fuel type (Petrol, Diesel, CNG)* |

    | `HP` | *Horsepower* |

    | `Met_Color` | *Metallic color* |

    | `Automatic` | *Automatic (Yes = 1, No = 0)* |

    | `CC` | *Cylinder volume in cubic centimeters* |

    | `Doors` | *Number of doors* |

    | `Quarterly_Tax` | *Quarterly tax* |

    | `Weight` | *Weight in kilograms* |


    Regardless of the prediction algorithm that will be used, the very first thing
    is to perform basic data preprocessing and explore the data using the necessary
    visualization tools for the purpose of prediction. The following preprocessing
    task will be carried out:


    1. Statistics and missing value issues

    2. Outlier detection

    3. Visualization

    4. Data transformation

    5. Correlation analysis


    All these steps have been handled one way or the other in numbers 1–10 under the
    practical demonstration.


    ### Practical demonstration


    ![An example set table has 12 rows and 18 columns of data comprising price, fuel
    type, metal color, type, cc, doors, etc.](images/532459_1_En_6_Chapter/532459_1_En_6_Fig1_HTML.png)


    **Figure 6-1**: Load data


    1. Create a repository named `Sales Prediction`, create two folders in the repository
    (`data` and `process`), import the data named `ToyotaCorollaData.xlsx`, and save
    into the `data` folder in the repository.

    2. When loading in `ToyotaCorollaData.xlsx`, on the **Format your columns** (data
    types) interface, select **Replace error with missing values**. Also on the same
    interface, you can edit the data types if necessary; for example, maybe a categorical
    data has been given an integer, you can change it to nominal or polynominal. Click
    **next** and **finish** the data import process. The final interface after loading
    the data should look like Figure [6-1](#532459_1_En_6_Chapter.xhtml#Fig1).


    ![An example set of statistical figures for sales prediction data for the Toyota
    Corolla. Four histograms present data for price, age, kilometers, and fuel type.](images/532459_1_En_6_Chapter/532459_1_En_6_Fig2_HTML.png)


    **Figure 6-2**: Summary statistics'
