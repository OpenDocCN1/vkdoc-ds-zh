    \  重复实际业务问题 V，使用相同的数据集（`nodeslabelStaff.csv`），这次将中心性度量与性能进行关联。\n2.  使用数据集 `VegetableTransactions.csv`，执行关联规则分析，并对结果进行评论。使用必要的标准选择最重要的规则，并对所选规则给出适当的解释。\n\
    3.  使用名为 `Alegra.xlsx` 的数据，使用 k-means 聚类算法执行聚类分析。验证、可视化并解释生成的聚类。\n\n# 9. 案例研究\
    \ 第一部分\n\n本章是本书主要咨询案例研究的开始部分。我们将解释一个典型的商业分析咨询项目，并创建一个路线图或示例，说明如何进行一个商业分析咨询项目。我们首先通常描述中小型电子商务环境，因为这是我们选定案例研究的业务环境；接着讨论该环境特有的分析数据来源。接下来，我们简要描述将作为案例研究的业务，然后介绍针对该业务咨询所特有的分析路线图。本章以初始分析和预接洽阶段的结果结束，这些结果将构成第\
    \ 10 章详细分析和实施阶段的基础。"
- fmt: '## 9.1 SME Ecommerce


    `Ecommerce` is the buying and selling of goods and services online. It involves
    trading of products or services directly or indirectly, by any means of venture,
    for the purpose of wealth creation, thereby adding value to the end users, and
    to improve means of livelihood.


    `Ecommerce` small and medium enterprises (`SMEs`) are start-up ventures that employ
    digital online services as a platform for creating awareness and launching products
    and services to target customers. These involve promotional efforts and marketing
    strategies to initiate online purchases and drive sales and for maintaining repeated
    purchases.


    The following are some of the analytics goals that one might want to achieve in
    an ecommerce analytics project:


    * To capture, model, and analyze the behavioral patterns and profiles of users
    interacting with a website to recommend effective marketing campaign (i.e., extracts
    knowledge that may support several decisions, e.g., marketing campaigns per customer
    segment), pricing policy, etc.

    * To understand customers to develop long-term relationships and to improve service
    quality.

    * To discover consumer sentiments for effective customer relationship management.

    * To discover communities of users who share common interests for better targeting.

    * To provide recommendations for effective production plans, capital investments,
    and expansion decision of the company.

    * To discover trends that can help to increase the popularity of the website among
    its visitors.

    * To provide product cross-selling and layout recommendations to increase the
    number of products sold on the website and redesign the layout based on product
    recommendations.

    * To optimize the sales funnel to make sure that as many people as possible go
    through the steps to buy the product, that is, to get more products sold on the
    website. In addition, discover weak spots in the sales funnel (ecommerce website)
    and recommend strategies to rectify them.

    * To identify the most profitable customers, the most frequent search keywords,
    and the best sales timeline.

    * To evaluate the website based on standard ecommerce key performance metrics
    (`abandonment`, micro- to macroconversion rates, average order value (`AOV`),
    sales conversion rates, customer retention rates, ecommerce churn rates, etc.)
    and use the results to provide recommendations to improve the sales on the website.

    * To discover sequential or associative trends in customer buying patterns that
    could help to recommend for upselling, cross-selling, or embedding recommender
    systems.

    * To develop a predictive model to determine which of the external customers (customers
    who have been to their website at least once and did not buy anything) have high
    propensity to buy so that we can recommend them for direct mailing or marketing.

    * Customer lifetime value prediction and many more.


    The types of data that one might analyze in such domain include:


    1. **Transaction data**


    Transaction or business activity data has emerged rapidly as a result of interactions
    seen between consumers and the ecommerce business. These data are structured and
    come from a variety of sources, including customer relationship programs (e.g.,
    customer profiles maintained by the company, the increase in the frequency of
    customer complaints) and sales transactions. Overall, it is clear that eretailers
    can reap numerous benefits from transaction data across the value chain.³


    2. **Clickstream data**


    Clickstream data emanates from web and digital advertising, as well as social
    media activities such as ecommerce business tweets, blogs, Facebook wall postings,
    and many more. The series of pages viewed by a user within a specific web page
    is referred to as the clickstream, and this can be used for several types of analytics
    in ecommerce. The primary goal of clickstream tracking is to help get insight
    into the activities of visitors on the site.


    3. **Voice data**


    Voice data is the information that is typically obtained through phone calls,
    call centers, or customer service. According to recent research, voice data can
    be useful for analyzing consumer purchasing behavior or targeting new customers.


    4. **Video data**


    Video data is real-time data derived from current image capture. Ecommerce companies
    want to collect massive amounts of data in conjunction with image recognition
    tools, and not just swipe-stream information or transaction data.⁴'
