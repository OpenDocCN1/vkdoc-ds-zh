    **图 2-11** 过滤异常值的流程


    1.  我们通过处理异常值来继续我们的实践示例。创建一个新流程，并使用本示例步骤 2 中解释的过程，导入缺失值清洗后得到的数据（`OnlineQuestionAfterMissing.csv`）。在处理异常值之前查看数据时，你可以在设计视图中仅使用该数据运行流程。要通过过滤行来处理异常值，请使用图
    2-11 中的流程；点击`Select Attributes`运算符；对于`attribute filter type`，点击`subset`并选择所有属性，以便流程的输出将包含存储的完整数据。请注意，有时你可能希望在应用`detect
    outliers`运算符之前进行归一化，尤其是在使用欧氏距离时。对于`Detect Outliers`运算符，请注意在参数中，邻居数默认设置为`10`。你可能希望根据你对运算符工作原理的理解来更改此值。与
    RapidMiner 中所有其他运算符一样，有必要阅读所有运算符的帮助文档，以了解如何针对你特定的任务最大限度地利用它。`Filter Examples`运算符根据你对其编程的方式，选择保留数据的哪些行以及移除哪些行。你可以设置`filters`参数，即`outlier`
    > 等于 `false`；如果这样做，你将观察到，尽管我们预期只移除一行，但更多行被移除了。处理此问题更有效的方法是通过修正而不是删除行来处理异常值。最后，`Write
    CSV`运算符用于将结果数据保存到名为`OnlineQuestionAfterOutlier.csv`的 CSV 文件中。


    ![](img/532459_1_En_2_Fig13_HTML.png)


    截图展示了具有三个选择选项卡的创建过滤器选项卡。


    **图 2-12a** 修正异常值


    1.  不是像步骤 9 那样移除整行，你可以根据特定属性过滤结果。为此，你首先需要通过可视化检测异常值的数量。例如，在这种情况下，我们已经能够检测到有一个异常值，并且我们注意到该值在属性`age`上大于等于`300`。根据此信息处理异常值时，你可以使用与图
    2-11 相同的流程，然后对`filter examples`运算符进行设置，如图 2-12a 所示。


    # 归一化与分类变量


    归一化用于将属性数据缩放到指定范围内。这是一种组织数据的方法，使所有记录和字段中的数据看起来相似。我们进行归一化，是为了在建模或分析过程中，属性不会相互占据不当优势。某些算法需要归一化，例如神经网络；此外，一些聚类算法也需要数据归一化。归一化有几种类型：最小-最大归一化、z-score
    归一化等。最小-最大归一化是最常见的归一化数据方法之一。对于每个特征，该特征的最小值被转换为`0`，最大值被转换为`1`，而其他所有值都被转换为介于`0`和`1`之间的小数。

    '
- fmt: "### Handling Categorical Variables\n\nWhen dealing with ordered categorical\
    \ variables (age group, degree of creditworthiness, etc.), label the categories\
    \ numerically (1, 2, 3, …) and handle the variable like it were a continuous variable.\
    \ If a categorical variable is nominal, sometimes there is a need to convert it\
    \ to dummy. For example, if `occupation` is a categorical attribute with \"unemployed,\"\
    \ \"employed,\" or \"retired\" categories and a record has a category of unemployed,\
    \ this is translated as in Table [2-1](#532459_1_En_2_Chapter.xhtml#Tab1).\n\n\
    **Table 2-1**  \nCreating Dummies\n\n| - | A table displays two rows and three\
    \ columns. Three column headings are: `occupation unemployed`, `occupation employed`,\
    \ and `occupation retired`. |\n\nWhen we convert a categorical variable with many\
    \ categories to dummies, we may end up with too many variables. One technique\
    \ to deal with this is to combine close or similar categories to reduce the number\
    \ of categories. Combining categories involves the use of both professional knowledge\
    \ and common sense. In general, categories with a small number of observations\
    \ are suitable candidates for combining with others. Only use the categories that\
    \ are most important to the analysis and mark the others as \"other.\" You can\
    \ also use a bar chart to make such decision.^(12)\n\nA screengrab represents\
    \ two tabs: `process` and `parameter`. Both tabs displays process leading to nominal\
    \ to numerical operators.\n\n**Figure 2-12b**  \nNormalize and Nominal to Numerical\
    \ operators\n\n1.  To normalize the data resulting from the outlier treatment\
    \ `OnlineQuestionAfterOutlier.csv`, you can use the `Normalize` operator, and\
    \ to convert to a dummy, you can use the `Nominal to Numerical` operator (see\
    \ Figure [2-12b](#532459_1_En_2_Chapter.xhtml#Fig14)). For both the `Normalize`\
    \ and `Nominal to Numerical` operators, you will need to select the attributes\
    \ using the `attribute filter type` and `attribute` parameters as shown in Figure\
    \ [2-12b](#532459_1_En_2_Chapter.xhtml#Fig14).\n\n## 2.5 Data Visualization\n\n\
    Data can be visualized for several purposes in an analytics project. Data can\
    \ be visualized for prediction, classification, and unsupervised learning, also\
    \ known as advanced descriptive analytics. For a detailed understanding of data\
    \ visualization, check out the following references: Galit et al. (2019), chapter\
    \ [3](#532459_1_En_3_Chapter.xhtml) or Thomas Rahlf (2017).\n\nWhen visualizing\
    \ data for prediction, we explore the data with the following guide:\n\n- Use\
    \ a histogram/boxplot to determine any needed transformation (plot the outcome\
    \ variable against the numerical predictors). If it's the histogram, for example,\
    \ we check skewness. This will be covered in Chapter [6](#532459_1_En_6_Chapter.xhtml).\n\
    - We can also study the relation of the target variable to categorical predictors\
    \ via boxplots, bar charts, and multiple panels.\n- Use a scatter plot to study\
    \ the relationship between the numerical predictors. When you do this, you are\
    \ looking for relationships between them that could affect your analysis negatively\
    \ or positively.\n- Examine scatter plots with added color to determine the need\
    \ for interaction terms.\n\nWhen visualizing for classification, we explore the\
    \ data with the following guide:\n\n- Use bar charts with the outcome on the y\
    \ axis to study the relationship between the target variable and categorical predictors.\n\
    - Use color-coded scatter plots to study the relationship between the target variable\
    \ and two numerical predictors to denote the outcome.\n- A side-by-side boxplot,\
    \ in which each numerical variable is compared to the outcome, can be used to\
    \ investigate the relationship between outcome and numerical predictors. It's\
    \ worth noting that the most separable boxes represent predictions that could\
    \ be useful.\n\nUse the following as a suggestion when visualizing for an unsupervised\
    \ task:\n\n- Create scatter plot matrices to identify pairwise relationships and\
    \ clustering of observations.\n- Use heat maps to examine the correlation table.\n\
    - Use various aggregation levels and zooming to determine areas of the data with\
    \ different behavior.\n\n## 2.6 Problems\n\n1.  Using the data named `OnlineQuestionAfterOutlier.csv`,\
    \ create dummies of all categorical attributes and normalize all numerical attributes.\n\
    2.  Perform the typical data preprocessing for prediction for the data named `FarmCo.External.xlsx`;\
    \ describe the steps you took for this process, conclusions made, and the resulting\
    \ data (the target attribute is `Unit Price`).\n\n# 3. Business Analytics Consulting\n\
    \nIn this chapter, we will look at Business Analytics consulting, particularly\
    \ what the concept implies and how to build such a career path. We will explain\
    \ the types of Business Analytics consulting that exist and then narrow them down\
    \ to how to navigate the world of Business Analytics consulting for small businesses.\
    \ In this chapter, we will look at how to manage a typical analytics project and\
    \ measure the success of analytics projects. In conclusion, we will discuss issues\
    \ revolving around how to bill analytics projects, particularly as a consultant."
  raw: '### Handling Categorical Variables


    When dealing with ordered categorical variables (age group, degree of creditworthiness,
    etc.), label the categories numerically (1, 2, 3, …) and handle the variable like
    it were a continuous variable. If a categorical variable is nominal, sometimes
    there is a need to convert it to dummy. For example, if occupation is a categorical
    attribute with “unemployed,” “employed,” or “retired” categories and a record
    has a category of unemployed, this is translated as in Table [2-1](#532459_1_En_2_Chapter.xhtml#Tab1).


    Table 2-1


    Creating Dummies


    | -![](images/532459_1_En_2_Chapter/532459_1_En_2_Figa_HTML.jpg)A table displays
    two rows and three columns. Three column headings are: occupation unemployed,
    occupation employed, and occupation retired. |


    When we convert a categorical variable with many categories to dummies, we may
    end up with too many variables. One technique to deal with this is to combine
    close or similar categories to reduce the number of categories. Combining categories
    involves the use of both professional knowledge and common sense. In general,
    categories with a small number of observations are suitable candidates for combining
    with others. Only use the categories that are most important to the analysis and
    mark the others as “other.” You can also use a bar chart to make such decision.^(12)


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig14_HTML.png)


    A screengrab represents two tabs: process and parameter. Both tabs displays process
    leading to nominal to numerical operators.


    Figure 2-12b


    Normalize and Nominal to Numerical operators


    1.  To normalize the data resulting from the outlier treatment OnlineQuestionAfterOutlier.csv,
    you can use the ***Normalize*** operator, and to convert to a dummy, you can use
    the ***Nominal to Numerical*** operator (see Figure [2-12b](#532459_1_En_2_Chapter.xhtml#Fig14)).
    For both the ***Normalize*** and ***Nominal to Numerical*** operators, you will
    need to select the attributes using the ***attribute filter type*** and ***attribute***
    parameters as shown in Figure [2-12b](#532459_1_En_2_Chapter.xhtml#Fig14).


    ## 2.5 Data Visualization


    Data can be visualized for several purposes in an analytics project. Data can
    be visualized for prediction, classification, and unsupervised learning, also
    known as advanced descriptive analytics. For a detailed understanding of data
    visualization, check out the following references: Galit et al. (2019), chapter
    [3](#532459_1_En_3_Chapter.xhtml) or Thomas Rahlf (2017).


    When visualizing data for prediction, we explore the data with the following guide:


    *   Use a histogram/boxplot to determine any needed transformation (plot the outcome
    variable against the numerical predictors). If it’s the histogram, for example,
    we check skewness. This will be covered in Chapter [6](#532459_1_En_6_Chapter.xhtml).


    *   We can also study the relation of the target variable to categorical predictors
    via boxplots, bar charts, and multiple panels.


    *   Use a scatter plot to study the relationship between the numerical predictors.
    When you do this, you are looking for relationships between them that could affect
    your analysis negatively or positively.


    *   Examine scatter plots with added color to determine the need for interaction
    terms.


    When visualizing for classification, we explore the data with the following guide:


    *   Use bar charts with the outcome on the y axis to study the relationship between
    the target variable and categorical predictors.


    *   Use color-coded scatter plots to study the relationship between the target
    variable and two numerical predictors to denote the outcome.


    *   A side-by-side boxplot, in which each numerical variable is compared to the
    outcome, can be used to investigate the relationship between outcome and numerical
    predictors. It’s worth noting that the most separable boxes represent predictions
    that could be useful.


    Use the following as a suggestion when visualizing for an unsupervised task:


    *   Create scatter plot matrices to identify pairwise relationships and clustering
    of observations.


    *   Use heat maps to examine the correlation table.


    *   Use various aggregation levels and zooming to determine areas of the data
    with different behavior.


    ## 2.6 Problems


    1.  Using the data named OnlineQuestionAfterOutlier.csv, create dummies of all
    categorical attributes and normalize all numerical attributes.


    2.  Perform the typical data preprocessing for prediction for the data named FarmCo.External.xlsx;
    describe the steps you took for this process, conclusions made, and the resulting
    data (the target attribute is Unit Price).


    # 3. Business Analytics Consulting


    In this chapter, we will look at Business Analytics consulting, particularly what
    the concept implies and how to build such a career path. We will explain the types
    of Business Analytics consulting that exist and then narrow them down to how to
    navigate the world of Business Analytics consulting for small businesses. In this
    chapter, we will look at how to manage a typical analytics project and measure
    the success of analytics projects. In conclusion, we will discuss issues revolving
    around how to bill analytics projects, particularly as a consultant.'
  trans: "\n### 处理分类变量\n\n处理有序分类变量（如年龄组、信用等级等）时，请用数字（1, 2, 3, …）为类别进行标记，并将该变量视为连续变量处理。如果分类变量是名义变量，有时则需要将其转换为虚拟变量。例如，若\
    \ `occupation` 是一个包含\"失业\"、\"在职\"或\"退休\"类别的分类属性，且某条记录的类别为\"失业\"，则可将其转换为表 2-1 所示的形式。\n\
    \n**表 2-1**  \n创建虚拟变量\n\n| - | 表格显示两行三列。三列标题分别为：`occupation unemployed`，`occupation\
    \ employed`，`occupation retired`。 |\n\n当我们将包含多个类别的分类变量转换为虚拟变量时，可能会产生过多变量。处理这一问题的一种技巧是合并相近或相似的类别，以减少类别数量。合并类别需要同时运用专业知识和常识。通常，观测数量较少的类别是适合与其他类别合并的候选对象。只保留对分析最重要的类别，并将其他类别标记为\"\
    其他\"。你也可以使用条形图来辅助做出此类决策。¹²\n\n一张截图显示了两个选项卡：`process` 和 `parameter`。两个选项卡都显示了从名义变量到数值型变量的处理过程。\n\
    \n**图 2-12b**  \n归一化与名义变量转数值型运算符\n\n1.  要对经过异常值处理后的数据 `OnlineQuestionAfterOutlier.csv`\
    \ 进行归一化，可以使用 `Normalize` 运算符；若要转换为虚拟变量，则可以使用 `Nominal to Numerical` 运算符（参见图 2-12b）。对于\
    \ `Normalize` 和 `Nominal to Numerical` 这两个运算符，都需要使用 `attribute filter type` 和\
    \ `attribute` 参数来选择属性，如图 2-12b 所示。\n\n## 2.5 数据可视化\n\n在分析项目中，数据可视化的目的有多种。数据可以用于预测、分类以及无监督学习（也称为高级描述性分析）的可视化。有关数据可视化的详细理解，请参考以下文献：Galit\
    \ 等人（2019 年）第 3 章或 Thomas Rahlf（2017 年）的著作。\n\n在进行预测的数据可视化时，我们按以下指南探索数据：\n\n-\
    \   使用直方图/箱线图来确定是否需要任何转换（绘制结果变量与数值型预测变量的关系图）。例如，如果是直方图，我们检查偏度。这将在第 6 章中介绍。\n-\
    \   我们还可以通过箱线图、条形图和多面板图来研究目标变量与分类型预测变量之间的关系。\n-   使用散点图来研究数值型预测变量之间的关系。这样做时，你是在寻找它们之间可能对你的分析产生正面或负面影响的关系。\n\
    -   检查添加了颜色的散点图，以确定是否需要交互项。\n\n在进行分类的数据可视化时，我们按以下指南探索数据：\n\n-   使用 Y 轴显示结果变量的条形图来研究目标变量与分类型预测变量之间的关系。\n\
    -   使用颜色编码的散点图来研究目标变量与两个数值型预测变量之间的关系，并用颜色表示结果。\n-   可以使用并排箱线图来研究结果变量与数值型预测变量之间的关系，其中每个数值型变量都与结果变量进行比较。值得注意的是，分离度最高的箱线图代表可能有用的预测项。\n\
    \n在进行无监督任务的数据可视化时，建议采用以下方法：\n\n-   创建散点图矩阵，以识别观测值之间的成对关系和聚类情况。\n-   使用热力图来检查相关性表。\n\
    -   使用不同的聚合级别和缩放功能来确定数据中行为不同的区域。\n\n## 2.6 习题\n\n1.  使用名为 `OnlineQuestionAfterOutlier.csv`\
    \ 的数据，为所有分类属性创建虚拟变量，并对所有数值型属性进行归一化。\n2.  对名为 `FarmCo.External.xlsx` 的数据执行典型的预测数据预处理；描述你在此过程中采取的步骤、得出的结论以及处理后的数据（目标属性为\
    \ `Unit Price`）。\n\n# 3. 商业分析咨询\n\n在本章中，我们将探讨商业分析咨询，特别是其概念含义以及如何建立这样的职业道路。我们将解释存在的商业分析咨询类型，然后聚焦于如何为小型企业导航商业分析咨询的世界。在本章中，我们将了解如何管理一个典型的分析项目以及如何衡量分析项目的成功。最后，我们将讨论关于如何为分析项目收费的问题，特别是作为咨询顾问时应如何处理。\n"
- fmt: '### 3.1 Business Analytics Consulting


    A consultant is someone who is engaged in the business of giving expert advice
    to people working in a professional or technical field. Business Analytics consulting
    therefore refers to when such expert advice entails any stage of the Business
    Analytics journey as described in Chapter [1](#532459_1_En_1_Chapter.xhtml), Section
    [1.​3](#532459_1_En_1_Chapter.xhtml#Sec3). It can also be seen as the act or process
    of educating clients on varying aspects of data and modern technology involved
    in taking data, understanding it, processing it, and extracting value from the
    data.²


    ![](images/532459_1_En_3_Chapter/532459_1_En_3_Fig1_HTML.jpg)


    *An illustration represents four types of data scientist positions in different
    types of consulting organizations.*


    **Figure 3-1** Data scientist positions


    Figure [3-1](#532459_1_En_3_Chapter.xhtml#Fig1) gives some examples of different
    positions and entry-level roles of data scientists in different types of organizations.
    From Figure [3-1](#532459_1_En_3_Chapter.xhtml#Fig1), a graduate or a self-taught
    data scientist can secure a position as a junior data scientist in any consulting
    firm and so on.¹ Today, these roles might be customized depending on the type
    of large company in question. Some of these companies also take data science interns.
    There are also independent data science consultants who offer data science consulting
    services without working for the company or organization whether it’s a small
    or large business. Some are referred to as data science freelancers, and to get
    jobs, they use platforms like [`www.freelancer.com/`](https://www.freelancer.com/),
    [`www.toptal.com/`](https://www.toptal.com/), [`www.upwork.com/`](https://www.upwork.com/),
    and so on, while some just position themselves as Business Analytics consultants
    or consulting firm and work independent of any organization or platform. In practice,
    there are several issues that an independent data scientist might face; on the
    top of this list is the resistance of the business in question to release all
    the data needed for analysis. The advice to independent data science consultants
    is to not scare the business by asking for all you need at once. However, you
    have to do your initial analysis and know what you will need to solve the problem.
    The approach is to retrieve some amount of data to start with and show some results
    that can encourage the clients to open up more in terms of data. You can simulate
    what they stand to gain from the data if made available. Always carry your clients
    and stakeholders along at every stage of the analytics project. Business Analytics
    consulting should be seen as offering products, in which case the product is in
    the form of solving analytical problems. Business Analytics consultants can package
    analytics solutions to specific problems as products offered. This book looks
    at Business Analytics consulting from this perspective. Some of the problems termed
    as products that we look at include customer loyalty (Chapter [7](#532459_1_En_7_Chapter.xhtml)),
    customer and product segmentation (Chapter [8](#532459_1_En_8_Chapter.xhtml)),
    customer profiling (Chapter [7](#532459_1_En_7_Chapter.xhtml)), and so on. It
    is important to note that these problems, though common in retail business, also
    find expressions in other types of business.


    It is important for Business Analytics consultants to know that data science techniques
    are embedded in business understanding. If you don’t know how a business operates
    and how to improve a business normally, you cannot know how the data science technique
    will be used or where it fits in, to improve the sales of the business, for example.
    A good example is in using data science to improve ecommerce business sales. For
    example, to sell more of products not selling, you have to know how this can be
    done in typical marketing, for example, through cross-selling. This will not inform
    us of the kind of analytics to carry out. In this situation, you might want to
    use association rule analysis to discover products that have occurred together
    in the past and then use it for cross-selling.


    A Business Analytics consultant might perform three types of roles when working
    with clients: expert (outside looking in, you’re working with a client who has
    a problem and wants you to fix it), pair-of-hands (providing a service that the
    client company might be able to perform themselves), and collaborator (working
    side by side, the outside consultant joins forces with members of the client organization
    to work on the project or solve the problem together). Each of these represents
    a different kind of interaction and a different source of satisfaction for the
    consultant.³ When you take up consulting opportunities, it is important to state
    clearly which mode you want to operate with.


    ---


    **排版说明：**

    - 仅将连续段落间的多余空行删除（例如第一个段落后的空行、图片说明与正文间的空行等），同时保留图片引用和段落内部结构。

    - 保留原文中所有链接、数字上标（²、¹、³）以及章节引用。

    - 按照要求，未出现需加反引号的变量/函数/命令/路径名（原文中无此类内容），因此未做反引号处理。

    - 原文无代码块，因此未添加代码块标记。

    - 标题层级保留为 `###`（即 Markdown 二级标题），符合原文结构。'
