    analytics solutions to specific problems as products offered. This book looks
    at Business Analytics consulting from this perspective. Some of the problems termed
    as products that we look at include customer loyalty (Chapter [7](#532459_1_En_7_Chapter.xhtml)),
    customer and product segmentation (Chapter [8](#532459_1_En_8_Chapter.xhtml)),
    customer profiling (Chapter [7](#532459_1_En_7_Chapter.xhtml)), and so on. It
    is important to note that these problems, though common in retail business, also
    find expressions in other types of business.


    It is important for Business Analytics consultants to know that data science techniques
    are embedded in business understanding. If you don’t know how a business operates
    and how to improve a business normally, you cannot know how the data science technique
    will be used or where it fits in, to improve the sales of the business, for example.
    A good example is in using data science to improve ecommerce business sales. For
    example, to sell more of products not selling, you have to know how this can be
    done in typical marketing, for example, through cross-selling. This will not inform
    us of the kind of analytics to carry out. In this situation, you might want to
    use association rule analysis to discover products that have occurred together
    in the past and then use it for cross-selling.


    A Business Analytics consultant might perform three types of roles when working
    with clients: expert (outside looking in, you’re working with a client who has
    a problem and wants you to fix it), pair-of-hands (providing a service that the
    client company might be able to perform themselves,) and collaborator (working
    side by side, the outside consultant joins forces with members of the client organization
    to work on the project or solve the problem together). Each of these represents
    a different kind of interaction and a different source of satisfaction for the
    consultant.³ When you take up consulting opportunities, it is important to state
    clearly which mode you want to operate with.'
  trans: '

    ### 3.1 商业分析咨询


    顾问是指从事为专业或技术领域工作者提供专家建议业务的人。因此，商业分析咨询即指此类专家建议涉及第一章 1 第 1.​3 节所述的商业分析旅程中任一阶段的情况。它也可被视为一种行为或过程，旨在教育客户了解数据及现代技术的各个方面，包括获取数据、理解数据、处理数据以及从数据中提取价值。²


    ![](img/532459_1_En_3_Fig1_HTML.jpg)


    *一张展示了不同类型咨询组织中四种数据科学家职位的插图。*


    **图 3-1** 数据科学家职位


    图 3-1 提供了不同类型组织中数据科学家不同职位和入门级角色的示例。从图 3-1 可以看出，应届毕业生或自学成才的数据科学家可以在任何咨询公司获得初级数据科学家等职位。¹
    如今，这些角色可能会根据所涉及的大型公司的类型而定制。其中一些公司也招收数据科学实习生。此外，还有独立的数据科学顾问，他们不为任何公司或组织（无论规模大小）工作，而是提供数据科学咨询服务。有些人被称为数据科学自由职业者，他们利用诸如[`www.freelancer.com/`](https://www.freelancer.com/)、[`www.toptal.com/`](https://www.toptal.com/)、[`www.upwork.com/`](https://www.upwork.com/)等平台寻找工作，而另一些人则将自己定位为商业分析顾问或咨询公司，独立于任何组织或平台开展工作。在实践中，独立数据科学家可能会面临若干问题；其中首要问题是相关企业不愿释放分析所需的全部数据。给独立数据科学顾问的建议是：不要一次性要求所有数据而吓到企业。然而，你必须先进行初步分析，了解解决该问题所需的数据。方法是先获取部分数据进行初步分析，并展示一些成果，以此鼓励客户在数据方面更加开放。你可以模拟如果数据可用，他们能从中获得什么收益。在分析项目的每个阶段，始终让你的客户和利益相关者参与进来。商业分析咨询应被视为提供产品，其产品形式是解决分析问题。商业分析顾问可以将针对特定问题的分析解决方案打包成产品来提供。本书便从这一视角审视商业分析咨询。我们视为产品来探讨的一些问题包括：客户忠诚度（第七章
    7）、客户与产品细分（第八章 8）、客户画像（第七章 7）等。值得注意的是，这些问题虽然在零售业中常见，但在其他类型的业务中也有体现。


    商业分析顾问必须明白，数据科学技术是植根于业务理解之中的。例如，如果你不了解企业如何运营以及通常如何改进业务，你就无法知道如何应用数据科学技术或其在何处适用，以提升企业的销售额。一个很好的例子是利用数据科学改善电子商务销售额。例如，为了销售更多滞销产品，你必须了解在典型的营销中如何做到这一点（例如通过交叉销售）。但这并不会告知我们应进行何种分析。在这种情况下，你可能需要使用关联规则分析来发现过去经常同时出现的产品，然后将其用于交叉销售。


    商业分析顾问在与客户合作时可能会扮演三种角色：专家（局外观望，你与有问题的客户合作，并希望你能解决它）、助手（提供客户公司本可以自行完成的服务）和协作者（并肩作战，外部顾问与客户组织成员联手，共同完成项目或解决问题）。每一种角色都代表着一种不同的互动方式，并为顾问带来不同来源的满足感。³
    当你承接咨询项目时，明确说明你希望以哪种模式运作非常重要。


    ---


