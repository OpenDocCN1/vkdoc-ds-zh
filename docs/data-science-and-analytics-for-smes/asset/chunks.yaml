  trans: '

    ## 7.4 分类树


    关于决策树算法的详细信息，请参考第 6.​4 节。


    决策树算法可用于预测数值型和类别型结果。当预测结果为类别型时，称为分类树。分类树利用预测变量信息，将一条记录沿着树“向下”传递，直到到达底部的节点（叶节点）。然后，我们通过汇总树形成过程中属于该叶节点的所有训练数据的“投票”来对其进行分类。获得最多投票的类别将分配给新记录。


    **利用分类树分析客户忠诚度**


    使用第 7.2 节介绍的客户忠诚度问题，以下演示如何使用分类树来解决该问题：


    ![](img/532459_1_En_7_Fig11_HTML.png)


    过程选项卡包含一个参数设置区域，其中将折叠次数设为 10，采样类型设为自动，并勾选了启用并行执行。


    图 7-10a


    决策树主过程


    1.  创建一个新过程，并将已导入的 `Churn_Modelling` 数据拖拽至设计视图。我们将使用图 7-10a（主过程）和图 7-10b（子过程）中的设置来开发和评估模型。


    `决策树`操作符用于生成决策树模型，该模型可用于分类和回归。此操作符可处理包含名义属性和数值属性的`示例集`。对于分类，标签`属性`必须为名义型；对于回归，则必须为数值型。在图
    7-10a 中，点击`设置角色`操作符，将`属性名称`设置为`Exited`，`目标角色`设置为标签。`交叉验证`操作符保持默认设置，即我们将使用十折交叉验证。


    ![](img/532459_1_En_7_Fig12_HTML.png)


    参数设置区域用于设置增益比、最大深度为 10、置信度为 0.1、最小增益为 0.01、后剪枝和前剪枝等标准。


    图 7-10b


    决策树子过程


    在图 7-10b 中，对于`决策树`操作符，我们将标准设置为`gain_ratio`。这表明我们正在预测类别型结果。`应用模型`操作符无需调整参数。对于`性能（分类）`操作符的参数，只需保持默认值即可，即`accuracy`。


    对于图 7-10a 和图 7-10b 中的设置，我们期望得到两个输出。图 7-11a 是神经网络模型，图 7-11b 是模型的性能表现。


    ![](img/532459_1_En_7_Fig14_HTML.png)


    选择了性能选项卡，标准设置为`accuracy`，并勾选了表格视图。`true 1` 和 `0` 对应的 `pred 1` 和 `pred 0` 数据被高亮显示。


    图 7-11b


    决策树模型的性能


    ![](img/532459_1_En_7_Fig13_HTML.png)


    在图形选项卡下展示了一个决策树模型，并且在树部分勾选了显示节点和边标签。


    图 7-11a


    决策树模型的部分内容


    ![](img/532459_1_En_7_Fig15_HTML.png)


    展示了过程流，其连接顺序为：检索、设置角色、交叉验证、应用模型和检索。


    图 7-12


    预测新记录（决策树）


    1.  一旦我们为预测建立了最优模型，就可以使用该模型对新数据进行预测。为此，我们将加载已准备好的、用于预测新客户的数据 `Churn_ModelingNew.xlsx`。为了预测新记录，我们将修改图
    7-10a 中的主过程，得到图 7-12。


    ![](img/532459_1_En_7_Fig16_HTML.png)


    选择了数据选项卡，表格中预测列以及置信度 1 和 0 列的值被高亮显示。


    图 7-13


    预测的记录（决策树）


    1.  图 7-13 是对图 7-12 中修改后的输出结果。它显示了预测新交易的结果。

