    ### 2. 定制网络


    在这一步中，我们将定制网络。在此之前，在**工具**菜单下，点击`插件`，并下载所有可用的插件。如有必要，请检查更新并更新您的应用程序。接下来，通过点击**统计**选项卡，然后点击每个统计指标旁的**运行**按钮（如图
    8-27 所示），**运行**所有必要的统计指标。点击这些统计指标时，会显示其方法和算法的说明。需要运行的统计指标通常由分析目标决定。在此例中，为演示目的我们将运行所有指标。


    ![](img/532459_1_En_8_Fig31_HTML.png)


    *一张电脑截图展示了数据实验室，其中显示了网络中每个节点的各项统计结果。*


    **图 8-28** – 数据实验室


    1.  运行完所有统计指标后，点击**数据实验室**，即可看到图 8-28 所示的界面，该图显示了网络中每个节点的各项**统计**结果。我们还可以通过在图
    8-28 中点击`边`来查看网络中的边。这些结果可以导出到 Excel，用于进行回归或相关性等其他分析。


    ![](img/532459_1_En_8_Fig32_HTML.png)


    *一张电脑截图显示了彩色节点。这是通过将所需的颜色拖放到`概览`选项卡的`外观`窗口中实现的。*


    **图 8-29** – 更改节点颜色


    1.  点击**概览**选项卡以再次显示网络，然后在**外观**窗口中，点击并拖动您想要的颜色（如图 8-29 所示），然后点击`应用`。


    ![](img/532459_1_En_8_Fig34_HTML.png)


    *一张电脑截图描绘了不同大小的节点。这可以通过在`外观`窗口中选择节点，然后选择所需的大小和排名来实现。*


    **图 8-31** – 使用特征向量中心性对边进行排序


    ![](img/532459_1_En_8_Fig33_HTML.png)


    *一张电脑截图显示了节点的彩色边。这是通过使用`外观`窗口中的`边`选项卡完成的。*


    **图 8-30** – 更改边颜色


    1.  使用`外观`窗口的**边**选项卡为边添加颜色（图 8-30），并使用特征向量中心性调整节点的大小（图 8-31）。这可以通过在**外观窗口**中选择节点，然后选择大小和排名来实现，如图
    8-31 所示。图中单元（节点）的重要性或影响力通过其中心性来衡量。在本演示中，我们选择特征向量中心性。


    ![](img/532459_1_En_8_Fig35_HTML.jpg)


    *一张电脑截图说明了运行 Fruchterman Reingold 布局的设置。*


    **图 8-32** – Fruchterman-Reingold 布局


    1.  `Gephi` 提供了多种不同的布局来呈现您的图形，以及一些使其外观更佳的插件。对于此示例，我们将使用最流行的布局之一：**Fruchterman-Reingold**。它是一种力导向图算法，可以让我们清晰地看到图形中的连接。图
    8-32 显示了运行此布局的设置。


    ![](img/532459_1_En_8_Fig37_HTML.jpg)


    *一张电脑截图显示了`显示节点标签`选项卡。*


    **图 8-34** – 显示标签


    ![](img/532459_1_En_8_Fig36_HTML.png)


    *一张电脑截图显示了`过滤器`选项卡下的详细信息。它展示了过滤度数的步骤。*


    **图 8-33** – 过滤度数


    1.  点击图 8-32 中的**运行**，几秒钟后停止，并消除所有连接数少于三个的节点（使用图 8-33 中的设置）。这将使图形更整洁，并让我们看到更重要的边（同时不影响统计结果）。在窗口右侧，点击**过滤器**选项卡，然后点击**过滤**下的**属性**和**属性**下的**范围**。在**范围**下，双击**度数**。它将出现在**查询**中；然后您可以点击图
    8-33 中的**过滤器**。再次运行 Fruchterman-Reingold，并通过点击**显示节点标签**（图 8-34）来添加标签（用户名）。


    最终得到的网络如图 8-35 所示。


    ![](img/532459_1_En_8_Fig38_HTML.png)


    *一张最终社交通信网络的图示。它显示节点 `ecobank_nigeria` 具有最高的特征向量中心性。*


    **图 8-35** – 用户网络


    就此示例而言，我们将在此处暂停，但还有许多其他设置可用于可视化此网络，以获取各种类型的洞察。此外，`预览`选项卡可用于更好地可视化网络。从图 8-35 中，我们可以看到节点
    `ecobank_nigeria` 具有最高的特征向量中心性，这表明它是中心性最高的节点，因为它的邻居也具有中心性。


    ---


    ### 网络分析 – 示例 2


    对于第二个示例，我们将创建一个食品和农业企业的产品网络。边列表是根据产品一起被购买时的关联关系创建的。用于创建此网络的数据文件分别命名为 `EdgeListProducts.csv`
    和 `NodeListProducts.csv`。


    ![](img/532459_1_En_8_Fig39_HTML.png)


    *一张电脑截图显示了边列表成功加载到 `Gephi` 后的界面。*


    **图 8-36** – 成功加载 `EdgeListProducts.csv`


    1.  在 `Gephi` 中打开一个新项目。将数据作为无向图加载到 `Gephi` 中（`文件` ➤ `打开`），并首先加载 `EdgeListProducts.csv`。图
    8-36 是边列表成功加载到 `Gephi` 后的界面。


    ![](img/532459_1_En_8_Fig40_HTML.jpg)


    *一张图描绘了彩色的节点和边。它使用特征向量中心性来调整节点大小。*


    **图 8-37** – 使用特征向量中心性调整图形大小


    1.  通过点击**文件** ➤ **导入电子表格**来加载节点列表，选择 `NodeListProducts.csv`，点击`下一步`，然后点击`完成`。在生成的结果界面（图
    8-37）中，确保将**图类型**更改为**无向**，并选择**追加到现有工作空间**。


