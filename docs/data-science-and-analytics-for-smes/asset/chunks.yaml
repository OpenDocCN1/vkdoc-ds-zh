    **Association analysis – application for SMEs**


    The retail industry makes extensive use of association analysis to gain insight
    into the products that customers buy together. Knowing if particular sets of things
    are routinely purchased together is one type of choice that can be made. Association
    analysis aids in the design of catalogs and the layout of retail stores, as well
    as in cross-selling, promotions, and the identification of client categories based
    on purchasing habits. In order to increase SMEs’ sales while reducing the costs
    of overstocking, the results of association analysis can be used to stock the
    shelves with the correct product mix. When it comes to cross-selling products,
    the results of association analysis can be used to increase the average spend
    per customer. SMEs’ frontline employees are likely to have varying levels of expertise
    in this art because their experience and observational skills differ. Association
    analysis can help small businesses learn more about the kind of items their consumers
    are most likely to purchase so that they may better train and guide their employees
    in this area.


    **Association analysis example**


    A shoe retailer stores the data for the sales made to each customer and is able
    to convert it to the transactional data stored in shoes.xlsx. The intention of
    the shoe retailer is to analyze associations among purchases of these shoe items
    for purposes of point-of-sale display and guidance to sales personnel in promoting
    cross-sales.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig18_HTML.png)


