- fmt: "# Table 8-1: Data Format for Association Analysis\n\nTable [8-1](#532459_1_En_8_Chapter.xhtml#Tab1)\
    \ is the example of the format for the data used for association analysis using\
    \ the Apriori algorithm. Each row represents the transactions, and each column\
    \ represents an item, and the total column is the total items available. An example\
    \ of the source of transactional data for association analysis is data collected\
    \ using barcode scanners in supermarkets where each record lists all items bought\
    \ by a customer on a single-purchase transaction.\n\n**Table 8-1**  \n*An Example\
    \ of Data Used for Association Mining*\n\n| Trans. | Crocs | KennethCole | Llbean\
    \ | Nike | Adidas | Skechers | Fila |\n|--------|-------|-------------|--------|------|--------|----------|------|\n\
    | 1      | 0     | 1           | 1      | 1    | 1      | 0        | 1    |\n\
    | 2      | 0     | 0           | 1      | 0    | 1      | 0        | 1    |\n\
    | 3      | 0     | 1           | 0      | 0    | 1      | 1        | 1    |\n\
    | 4      | 0     | 0           | 1      | 1    | 1      | 0        | 1    |\n\
    | 5      | 0     | 1           | 0      | 0    | 1      | 0        | 1    |\n\
    | 6      | 0     | 0           | 0      | 0    | 1      | 0        | 0    |\n\
    | 7      | 0     | 1           | 1      | 1    | 1      | 0        | 1    |\n\
    | 8      | 0     | 0           | 1      | 1    | 0      | 0        | 1    |\n\
    | 9      | 0     | 0           | 0      | 0    | 1      | 0        | 0    |\n\
    | 10     | 1     | 1           | 1      | 1    | 0      | 0        | 0    |\n\
    | 11     | 0     | 0           | 1      | 0    | 0      | 0        | 1    |\n\n\
    # Association Analysis – Application for SMEs\n\nThe retail industry makes extensive\
    \ use of association analysis to gain insight into the products that customers\
    \ buy together. Knowing if particular sets of things are routinely purchased together\
    \ is one type of choice that can be made. Association analysis aids in the design\
    \ of catalogs and the layout of retail stores, as well as in cross-selling, promotions,\
    \ and the identification of client categories based on purchasing habits. In order\
    \ to increase SMEs' sales while reducing the costs of overstocking, the results\
    \ of association analysis can be used to stock the shelves with the correct product\
    \ mix. When it comes to cross-selling products, the results of association analysis\
    \ can be used to increase the average spend per customer. SMEs' frontline employees\
    \ are likely to have varying levels of expertise in this art because their experience\
    \ and observational skills differ. Association analysis can help small businesses\
    \ learn more about the kind of items their consumers are most likely to purchase\
    \ so that they may better train and guide their employees in this area.\n\n# Association\
    \ Analysis Example\n\nA shoe retailer stores the data for the sales made to each\
    \ customer and is able to convert it to the transactional data stored in `shoes.xlsx`.\
    \ The intention of the shoe retailer is to analyze associations among purchases\
    \ of these shoe items for purposes of point-of-sale display and guidance to sales\
    \ personnel in promoting cross-sales.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig18_HTML.png)\n\
    \n*A computer screenshot illustrates the settings of the process to create frequent\
    \ itemsets.*\n\n**Figure 8-16**  \n*Process to create frequent itemsets*\n\n1.\
    \ Create a new repository (call it Association); **Import** the data named `shoes.xlsx`.\
    \ When importing, make sure to convert all the columns to binominal data type\
    \ apart from the Transaction no (`Trans.`). After importing the data, check the\
    \ **Statistics** to be sure that there are no missing values.\n\n2. Use the settings\
    \ in Figure [8-16](#532459_1_En_8_Chapter.xhtml#Fig18) to create frequent itemsets\
    \ as displayed in the results in Figure [8-17](#532459_1_En_8_Chapter.xhtml#Fig19)\
    \ after running the process.\n\nIn Figure [8-16](#532459_1_En_8_Chapter.xhtml#Fig18),\
    \ for the **Select Attributes** operator, select all the binominal attributes\
    \ apart from `Trans.` For the FP-Growth, leave the setting as default. Sometimes,\
    \ depending on the data, you might need to reduce the support to get any result\
    \ at all. The FP-Growth algorithm is an efficient algorithm for calculating frequently\
    \ co-occurring items in a transaction database.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig19_HTML.png)\n\
    \n*A computer screenshot demonstrates the output of the process to create frequent\
    \ itemsets with the specifications on the left.*\n\n**Figure 8-17**  \n*Output\
    \ of the process to create frequent itemsets*\n\nModify the settings in Figure\
    \ [8-16](#532459_1_En_8_Chapter.xhtml#Fig18) to give Figure [8-18](#532459_1_En_8_Chapter.xhtml#Fig20)\
    \ which is the complete settings for generating association rules. For now, in\
    \ Figure [8-18](#532459_1_En_8_Chapter.xhtml#Fig20), we leave the parameters for\
    \ the **Create Association Rules** operator as default. But this can be adjusted\
    \ based on the nature of the data.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig20_HTML.png)\n\
    \n*A computer screenshot illustrates the setting to generate association rules.*\n\
    \n**Figure 8-18**  \n*Process to create association rules*\n\nThe result of running\
    \ Figure [8-18](#532459_1_En_8_Chapter.xhtml#Fig20) is given in Figure [8-19](#532459_1_En_8_Chapter.xhtml#Fig21).\
    \ It shows the premises (antecedent), conclusion (consequent), support, confidence,\
    \ lift, and so on for the generated rules. To select the best to act upon, we\
    \ are looking for the highest support, uplift at least greater than one with high\
    \ confidence.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig21_HTML.png)\n\
    \n*A computer screenshot demonstrates the output of the process to generate association\
    \ rules with some specifications displayed on the left.*\n\n**Figure 8-19**  \n\
    *Resulting association rule*\n\nSorting by lift, in order to select the best rules,\
    \ we get Figure [8-20](#532459_1_En_8_Chapter.xhtml#Fig22).\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig22_HTML.png)\n\
    \n*A computer screenshot displays the output of the process to generate association\
    \ rules after sorting by the Lift attribute in descending order.*\n\n**Figure\
    \ 8-20**  \n*Sorting Figure [8-19](#532459_1_En_8_Chapter.xhtml#Fig21) by lift\
    \ ratio*\n\n- Interpreting the first rule in Figure [8-20](#532459_1_En_8_Chapter.xhtml#Fig22),\
    \ we have\n\n*If Fila, llbean, and Adidas are purchased together, then, with confidence\
    \ of 94.5%, Nike and Bata will also be purchased. This rule has a lift ratio of\
    \ 1.379.*\n\nThe preceding rule can be used in several ways, for example, if the\
    \ customer is requesting for a particular brand of shoe, you can introduce a new\
    \ brand to the customer. This new brand is recommended based on solving the brand\
    \ association problem which makes it certain that the customer will also want\
    \ to buy the new brand. This type of inference can be implemented in several ways\
    \ by SMEs.\n\nExamples include through email marketing, recommender engines, promotions,\
    \ and so on."
