  trans: "\n# 回归树过程\n\n一个包含七个步骤的流程截图：检索（Retrieve）、名义到数值（Nominal to Numerical）、设置角色（Set\
    \ Role）、拆分数据（Split Data）、决策树（Decision Tree）、应用模型（Apply Model）和性能（Performance）。\n\
    \n**图 6-16**  \n回归树过程\n\n1. 创建一个新流程，将`ToyotaCorollaData2`数据拖拽到**设计视图**中（请记住，该版本数据中已排除了\
    \ ID 列）。运行回归树的整体流程如图 6-16 所示。\n\n![图 6-16](img/532459_1_En_6_Fig19_HTML.png)\n\
    \n一张回归树决策树截图，其图形选项卡下方包含两个不相交的决策树。\n\n**图 6-16a**  \n回归树模型的某些部分\n\n1. 对于`Nominal\
    \ to Numerical`（名义到数值）运算符，选择`Fuel_Type`属性（将`Fuel_Type`转换为虚拟变量）。点击`Set Role`（设置角色）运算符，将`attribute\
    \ name`设置为`Price`，将`target role`设置为`label`。点击`Split Data`（拆分数据）运算符，在该数据的`partitions`属性中，分别添加两个条目：`0.6`和`0.4`。点击`Decision\
    \ Tree`（决策树）运算符，将`criterion`参数设置为`least_square`。请注意，`least_square`是唯一允许数值预测的准则。所有其他参数可根据帮助中的说明进行设置。`Apply\
    \ Model`（应用模型）运算符无需调整参数；它用于将`Decision Tree`（决策树）运算符获得的模型应用于验证数据集。对于`Performance\
    \ (Regression)`（性能（回归））运算符的参数，只需保留默认值，即`root mean square error`（均方根误差）。\n\n2.\
    \ 采用图 6-16 中的设置，我们预期得到三个输出（即三个连接到`res`的链接）。第一个是回归树模型（图 6-16a），第二个是模型性能结果（图 6-16b），第三个是显示验证数据集预测结果的数据表（图\
    \ 6-16c）。\n\n在数据驱动的方法中，树模型是最透明且易于解释的。树模型通过创建对预测变量的分割，将记录划分为子组。这些分割创建了透明且易于理解的逻辑规则。图\
    \ 6-16a 模型中的此类示例如下：\n\n*   `IF Age_08_04 >= 32.500`\n*   `AND Age_08_04 > 56.500`\n\
    *   `AND Age_08_04 > 68.500`\n*   `AND KM > 108389.500`\n*   `AND KM > 193192.500`\n\
    *   `AND MET_Color > 0.500`\n*   `THEN Price is 4825.000`\n\n![图 6-16b](img/532459_1_En_6_Fig20_HTML.png)\n\
    \n一张性能向量截图，显示均方根误差值为`1362.617 ± 0.000`。\n\n**图 6-16b**  \n评估回归树\n\n从图 6-16b 中可以看出，与多元线性回归相比，回归树给出了更好的性能结果。\n\
    \n![图 6-16c](img/532459_1_En_6_Fig21_HTML.png)\n\n一张示例集表格截图，包含 17 行 12 列，数据包括价格、预测值、燃料类型、车龄、里程、马力、金属色、是否自动挡以及排量。\n\
    \n**图 6-16c**  \n结果数据集\n\n图 6-16c 是对 40%验证数据集进行评估的输出，并比较了验证数据集中的预测结果与原始价格。\n\n\
    ![图 6-17a](img/532459_1_En_6_Fig22_HTML.png)\n\n一张流程截图，包含五个步骤：检索（Retrieve）、设置角色（Set\
    \ Role）、验证（Validation）和应用模型（Apply Model）。下方的一个丰田检索（Retrieve Toyota）步骤也连接到上方的应用模型（Apply\
    \ Model）步骤。\n\n**图 6-17a**  \n回归树主流程\n\n1. 对于回归树，我们将使用图 6-17a（主流程）和图 6-17b（内部流程）中的设置来预测新记录。\n\
    \n![图 6-17b](img/532459_1_En_6_Fig23_HTML.png)\n\n一张流程验证截图，左侧训练（Training）部分有一个决策树步骤。它连接到测试（Testing）部分，进而连接到应用模型\
    \ 2（Apply model 2）和性能（Performance）。\n\n**图 6-17b**  \n回归树内部流程\n\n1. 图 6-17b 是内部流程，您可以通过双击`Split\
    \ Validation`（拆分验证）运算符来创建。`Decision Tree`（决策树）、`Regression`（回归）、`Apply Model`（应用模型）和`Performance\
    \ (Regression)`（性能（回归））运算符均保持与之前相同的默认设置。\n\n![图 6-18](img/532459_1_En_6_Fig24_HTML.png)\n\
    \n一张示例集截图，包含一个九行十二列的表格。它提供了预测价格、车龄、里程、燃料类型、马力、金属色、是否自动挡、排量、车门数、季度类型和重量等数据。\n\n\
    **图 6-18**  \n结果数据集\n\n1. 加载的新数据的预测价格如图 6-18 所示。\n"
- fmt: "# Neural Network (Prediction)\n\nThe neural network is a versatile data-driven\
    \ method for classification and prediction. In terms of interpretability, it is\
    \ referred to as a \"black box.\" The principles of nodes and layers, as well\
    \ as how they join to form the structure of a network, are used in neural networks.\
    \ The predictive performance of a neural network is demonstrated by the fact that\
    \ it captures the very complicated relationship between predictors and the target\
    \ variable. It is quite tolerant of noisy data. Despite these benefits, neural\
    \ networks lack a built-in variable selection mechanism, and their adaptability\
    \ is strongly reliant on having enough data for training. When employing a neural\
    \ network, it's important to keep an eye out for weights that lead to a local\
    \ rather than a global optimum. Multilayer feedforward networks have been the\
    \ most successful neural network applications in data mining.⁴\n\n## Multilayer\
    \ Feedforward Networks\n\nA feedforward network is a completely connected network\
    \ with no cycles and a one-way flow. It is made up of three layers: an input layer\
    \ with nodes that accept predictor values, a layer of nodes that receives input\
    \ from the previous layers, and a layer of output nodes. The outputs of each layer's\
    \ nodes are fed into the following layer nodes (see Figure [6-19](#532459_1_En_6_Chapter.xhtml#Fig25)).\n\
    \n![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig25_HTML.png)\n\nA multilayer\
    \ feed-forward network has three layers: an input layer, a hidden layer, and an\
    \ output layer. Each is connected to the next one.\n\n**Figure 6-19** Multilayer\
    \ feedforward networks, Galit et al. (2018), p. 274\n\nFigure [6-19](#532459_1_En_6_Chapter.xhtml#Fig25)\
    \ shows an architectural design with two predictors, two hidden layers, and two\
    \ nodes in the output layer that reflect the expected outcome value.\n\nWhen we\
    \ use a neural network for predicting numerical outcome, the predicted value needs\
    \ to be converted to its original unit; this is because, to perform the prediction,\
    \ both the predictors (numerical) and the outcome variables will have been normalized\
    \ (rescaled to a `[0,1]` interval).\n\nWhen working with neural networks, we must\
    \ make the following decisions:\n\n- **Network architecture**: This can be accomplished\
    \ by trial-and-error runs on various architectures or through the use of algorithms.\n\
    - **Choice of predictor**: Depending on the software, you need to choose the learning\
    \ rate and momentum. The learning rate has a range of 0 to 1 and is mostly used\
    \ to avoid overfitting. The momentum is employed to keep the ball going while\
    \ the weights are converged to the best possible position.\n- **Number of hidden\
    \ layers**: This is commonly set to one (though we can always experiment with\
    \ others) because a single hidden layer is usually enough to capture even the\
    \ most intricate interactions between predictors.\n- **Size of hidden layer**:\
    \ The level of intricacy of the relationship between the predictors that the network\
    \ captures is determined by the number of nodes in the hidden layer. Starting\
    \ with `p` (number of predictors) nodes and gradually decreasing or increasing\
    \ while testing for overfitting is a good rule of thumb.\n- **Number of output**:\
    \ The number of nodes in a categorical outcome with `m` classes should be `m`\
    \ or `m-1`. A single output node is usually used for a numerical result.\n\nMoreover,\
    \ to avoid overfitting in neural networks, the number of training iterations should\
    \ be limited, and the data should not be overtrained. We look at the performance\
    \ on the validation dataset or cross-validation dataset to see when it starts\
    \ to deteriorate while the training set performance is still improving to detect\
    \ overfitting.\n\n## Data Preprocessing for Neural Networks\n\nWhen the predictors\
    \ and outcome variable are on a scale of `[0,1]`, neural networks perform best.\
    \ We normalize measurements for a numerical variable `X` that takes values in\
    \ the range `[a; b]`, by subtracting `a` from `X` and dividing by `b - a`. The\
    \ normalized measurement is then\n\n![$$ {X}_{norm}=\\frac{X-a}{b-a} $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ9.png)\n\
    \n(Eq. 6.9)\n\nThe minimal and maximal values of `X` in the data can be used to\
    \ estimate `a` and `b`. Other than the creation of dummy variables, no adjustments\
    \ are required for binary variables. If categorical variables with `m` categories\
    \ are ordinal, choosing `m` fractions in the range `[0,1]` should represent their\
    \ perceived ordering. If the categories are nominal, make `m-1` dummies out of\
    \ them. Note that it is also important to transform highly skewed predictors for\
    \ better predictive performance. This situation is common with variables in the\
    \ Business Analytics domain such as income. So it is advised to first transform\
    \ this kind of variable by taking a `log` before scaling to `[0,1]`.\n\n## Neural\
    \ Network – Evaluating Performance (Numerical Outcome)\n\nThe prediction performance\
    \ of regression trees can be examined in the same manner that other predictive\
    \ approaches (e.g., linear regression and regression trees) are evaluated, using\
    \ summary measures like `RMSE`.\n\n## Sales Prediction Problem – Neural Network\n\
    \nUsing the sales prediction problem introduced in Section [6.2](#532459_1_En_6_Chapter.xhtml#Sec2),\
    \ the following demonstrates how to use a neural network to solve the problem:\n\
    \n![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig26_HTML.png)\n\nA process\
    \ screenshot has seven steps: Retrieve Toyota, Nominal to Numerical, Set Role,\
    \ Split Data, Neural Net, Apply Model and Performance. A parameters tab is on\
    \ the right.\n\n**Figure 6-20** Neural network process\n\n1.  Create a new process,\
    \ and drag the `ToyotaCorollaData2` data to the **design view** (remember that\
    \ the ID column has been excluded in this version of the data). The overall process\
    \ for running the neural network is given in Figure [6-20](#532459_1_En_6_Chapter.xhtml#Fig26).\n\
    \n    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig27_HTML.png)\n\n    An\
    \ improved neural network screenshot has 13 inputs at left leading to 9 points\
    \ in the middle named Hidden 1, which lead to a single output at right.\n\n  \
    \  **Figure 6-21a** Neural network model\n\n2.  For the **Nominal to Numerical**\
    \ operator, you will select the `Fuel_Type` attribute (converting `Fuel_Type`\
    \ to dummies). Click the **Set Role** operator and set the **attribute name**\
    \ to be `Price` and **target role** to be label. Click the **Split Data** operator,\
    \ and for the **partitions** property of this data, add two entries, 0.6 and 0.4,\
    \ respectively. For the **Neural Net** operator, we will leave the default setting\
    \ as seen in Figure [6-20](#532459_1_En_6_Chapter.xhtml#Fig26). This operator\
    \ learns a model by means of a feedforward neural network trained by a backpropagation\
    \ algorithm (multilayer perceptron). This operator cannot handle polynomial attributes\
    \ (for more explanations on the parameters of the operator, check the help). Note\
    \ that we did not use the normalize operator; this is taken care of by the normalize\
    \ parameter of the **Neural Net** operator as seen selected by default in Figure\
    \ [6-20](#532459_1_En_6_Chapter.xhtml#Fig26). The **Apply Model** operator needs\
    \ no parameter adjustment; it is used to apply the model obtained from the **Neural\
    \ Net** operator on the validation dataset. For the parameters of the **Performance\
    \ (Regression)** operator, simply leave as default, which is the *root mean square\
    \ error*.\n\n3.  With the settings in Figure [6-16](#532459_1_En_6_Chapter.xhtml#Fig18),\
    \ we are expecting three outputs (i.e., three links to `res`). The first is the\
    \ Neural Net model (Figure [6-21a](#532459_1_En_6_Chapter.xhtml#Fig27)), the second\
    \ is the model performance result (Figure [6-21b](#532459_1_En_6_Chapter.xhtml#Fig28)),\
    \ and the third is the data table revealing the predicted results (Figure [6-21c](#532459_1_En_6_Chapter.xhtml#Fig29))\
    \ for the validation dataset.\n\nThe figure reveals the input, hidden, and output\
    \ layers.\n\n![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig28_HTML.png)"
  raw: '## 6.6 Neural Network (Prediction)


    The neural network is a versatile data-driven method for classification and prediction.
    In terms of interpretability, it is referred to as a “black box.” The principles
    of nodes and layers, as well as how they join to form the structure of a network,
    are used in neural networks. The predictive performance of a neural network is
    demonstrated by the fact that it captures the very complicated relationship between
    predictors and the target variable. It is quite tolerant of noisy data. Despite
    these benefits, neural networks lack a built-in variable selection mechanism,
    and their adaptability is strongly reliant on having enough data for training.
    When employing a neural network, it’s important to keep an eye out for weights
    that lead to a local rather than a global optimum. Multilayer feedforward networks
    have been the most successful neural network applications in data mining.⁴


    **Multilayer feedforward networks**


    A feedforward network is a completely connected network with no cycles and a one-way
    flow. It is made up of three layers: an input layer with nodes that accept predictor
    values, a layer of nodes that receives input from the previous layers, and a layer
    of output nodes. The outputs of each layer’s nodes are fed into the following
    layer nodes (see Figure [6-19](#532459_1_En_6_Chapter.xhtml#Fig25)).


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig25_HTML.png)


    A multilayer feed-forward network has three layers: an input layer, a hidden layer,
    and an output layer. Each is connected to the next one.


    Figure 6-19


    Multilayer feedforward networks, Galit et al. (2018), p. 274


    Figure [6-19](#532459_1_En_6_Chapter.xhtml#Fig25) shows an architectural design
    with two predictors, two hidden layers, and two nodes in the output layer that
    reflect the expected outcome value.


    When we use a neural network for predicting numerical outcome, the predicted value
    needs to be converted to its original unit; this is because, to perform the prediction,
    both the predictors (numerical) and the outcome variables will have been normalized
    (rescaled to a [0,1] interval).


    When working with neural networks, we must make the following decisions:


    *   *Network architecture*: This can be accomplished by trial-and-error runs on
    various architectures or through the use of algorithms.


    *   *Choice of predictor*: Depending on the software, you need to choose the learning
    rate and momentum. The learning rate has a range of 0 to 1 and is mostly used
    to avoid overfitting. The momentum is employed to keep the ball going while the
    weights are converged to the best possible position.


    *   *Number of hidden layers*: This is commonly set to one (though we can always
    experiment with others) because a single hidden layer is usually enough to capture
    even the most intricate interactions between predictors.


    *   *Size of hidden layer*: The level of intricacy of the relationship between
    the predictors that the network captures is determined by the number of nodes
    in the hidden layer. Starting with p (number of predictors) nodes and gradually
    decreasing or increasing while testing for overfitting is a good rule of thumb.


    *   *Number of output*: The number of nodes in a categorical outcome with m classes
    should be m or m-1\. A single output node is usually used for a numerical result.


    Moreover, to avoid overfitting in neural networks, the number of training iterations
    should be limited, and the data should not be overtrained. We look at the performance
    on the validation dataset or cross-validation dataset to see when it starts to
    deteriorate while the training set performance is still improving to detect overfitting.


    Data preprocessing for neural networks: When the predictors and outcome variable
    are on a scale of [0,1], neural networks perform best. We normalize measurements
    for a numerical variable X that takes values in the range [a; b], by subtracting
    a from X and dividing by b – a. The normalized measurement is then


    ![$$ {X}_{norm}=\frac{X-a}{b-a} $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ9.png)


    (Eq. 6.9)


    The minimal and maximal values of X in the data can be used to estimate a and
    b. Other than the creation of dummy variables, no adjustments are required for
    binary variables. If categorical variables with m categories are ordinal, choosing
    m fractions in the range [0,1] should represent their perceived ordering. If the
    categories are nominal, make m-1 dummies out of them. Note that it is also important
    to transform highly skewed predictors for better predictive performance. This
    situation is common with variables in the Business Analytics domain such as income.
    So it is advised to first transform this kind of variable by taking a log before
    scaling to [0,1].


    Neural network – *evaluating performance* *(numerical outcome)*: The prediction
    performance of regression trees can be examined in the same manner that other
    predictive approaches (e.g., linear regression and regression trees) are evaluated,
    using summary measures like RMSE.


    **Sales prediction problem** **– neural network**


    Using the sales prediction problem introduced in Section [6.2](#532459_1_En_6_Chapter.xhtml#Sec2),
    the following demonstrates how to use a neural network to solve the problem:


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig26_HTML.png)


    A process screenshot has seven steps: Retrieve Toyota, Nominal to Numerical, Set
    Role, Split Data, Neural Net, Apply Model and Performance. A parameters tab is
    on the right.


    Figure 6-20


    Neural network process


    1.  Create a new process, and drag the *ToyotaCorollaData2* data to the ***design
    view*** (remember that the ID column has been excluded in this version of the
    data). The overall process for running the neural network is given in Figure [6-20](#532459_1_En_6_Chapter.xhtml#Fig26).


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig27_HTML.png)


    An improved neural network screenshot has 13 inputs at left leading to 9 points
    in the middle named Hidden 1, which lead to a single output at right.


    Figure 6-21a


    Neural network model


    1.  For the ***Nominal to Numerical*** operator, you will select the Fuel_Type
    attribute (converting Fuel_Type to dummies). Click the ***Set Role*** operator
    and set the ***attribute name*** to be *Price* and *target role* to be label.
    Click the ***Split Data*** operator, and for the ***partitions*** property of
    this data, add two entries, 0.6 and 0.4, respectively. For the ***Neural Net***
    operator, we will leave the default setting as seen in Figure [6-20](#532459_1_En_6_Chapter.xhtml#Fig26).
    This operator learns a model by means of a feedforward neural network trained
    by a backpropagation algorithm (multilayer perceptron). This operator cannot handle
    polynomial attributes (for more explanations on the parameters of the operator,
    check the help). Note that we did not use the normalize operator; this is taken
    care of by the normalize parameter of the ***Neural Net*** operator as seen selected
    by default in Figure [6-20](#532459_1_En_6_Chapter.xhtml#Fig26). The ***Apply
    Model*** operator needs no parameter adjustment; it is used to apply the model
    obtained from the ***Neural Net*** operator on the validation dataset. For the
    parameters of the ***Performance (Regression)*** operator, simply leave as default,
    which is the *root mean square error*.


    2.  With the settings in Figure [6-16](#532459_1_En_6_Chapter.xhtml#Fig18), we
    are expecting three outputs (i.e., three links to ***res***). The first is the
    Neural Net model (Figure [6-21a](#532459_1_En_6_Chapter.xhtml#Fig27)), the second
    is the model performance result (Figure [6-21b](#532459_1_En_6_Chapter.xhtml#Fig28)),
    and the third is the data table revealing the predicted results (Figure [6-21c](#532459_1_En_6_Chapter.xhtml#Fig29))
    for the validation dataset.


    The figure reveals the input, hidden, and output layers.


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig28_HTML.png)'
  trans: "\n# 神经网络（预测）\n\n神经网络是一种通用的数据驱动方法，可用于分类和预测。在可解释性方面，它被称为“黑箱”。神经网络运用了节点和层的原理，以及它们如何连接形成网络结构。神经网络之所以能展现其预测性能，是因为它能捕捉预测变量与目标变量之间非常复杂的关系。它对噪声数据有相当好的容忍度。尽管有这些优势，但神经网络缺乏内置的变量选择机制，并且其适应性在很大程度上依赖于拥有足够的数据进行训练。使用神经网络时，务必警惕那些会导致局部最优而非全局最优的权重。在数据挖掘中，多层前馈网络是神经网络最成功的应用之一。⁴\n\
    \n## 多层前馈网络\n\n前馈网络是一种完全连接、无环路且单向流动的网络。它由三层组成：一个包含接收预测变量值的节点的输入层、一个接收前一层输入的节点层，以及一个输出节点层。每一层节点的输出都会馈送到下一层节点（见图\
    \ 6-19）。\n\n![](img/532459_1_En_6_Fig25_HTML.png)\n\n一个多层前馈网络包含三层：输入层、隐藏层和输出层。每一层都与下一层相连。\n\
    \n**图 6-19** 多层前馈网络，Galit 等人 (2018)，第 274 页\n\n图 6-19 展示了一种架构设计，包含两个预测变量、两个隐藏层以及输出层中反映预期结果值的两个节点。\n\
    \n当我们使用神经网络预测数值型结果时，需要将预测值转换回其原始单位；这是因为，为了进行预测，预测变量（数值型）和结果变量都会被归一化（重新缩放至 `[0,1]`\
    \ 区间）。\n\n在使用神经网络时，我们必须做出以下决策：\n\n-   **网络架构**：这可以通过对各种架构进行试错运行或使用算法来实现。\n-  \
    \ **预测变量的选择**：根据软件的不同，需要选择学习率和动量。学习率的范围是 0 到 1，主要用于避免过拟合。在权重收敛到尽可能最佳位置的过程中，采用动量来保持调整方向。\n\
    -   **隐藏层数量**：通常设置为一个（尽管我们总是可以尝试其他数量），因为单个隐藏层通常足以捕捉预测变量之间哪怕是最复杂的交互作用。\n-   **隐藏层的大小**：网络捕捉到的预测变量之间关系的复杂程度，由隐藏层中的节点数量决定。一个好的经验法则是从\
    \ `p`（预测变量的数量）个节点开始，然后逐步减少或增加，同时测试是否过拟合。\n-   **输出数量**：对于具有 `m` 个类别的分类结果，输出节点数应为\
    \ `m` 或 `m-1`。对于数值型结果，通常只用一个输出节点。\n\n此外，为避免神经网络过拟合，应限制训练迭代次数，并且不应过度训练数据。我们通过观察验证集或交叉验证集上的性能来确定何时开始下降，而同时训练集性能仍在提升，以此发现过拟合。\n\
    \n## 神经网络的数据预处理\n\n当预测变量和结果变量处于 `[0,1]` 尺度时，神经网络的性能最佳。对于取值区间为 `[a; b]` 的数值变量 `X`，我们通过将\
    \ `X` 减去 `a` 并除以 `b - a` 来进行归一化。归一化后的度量值为：\n\n![$$ {X}_{norm}=\\frac{X-a}{b-a}\
    \ $$](img/532459_1_En_6_Chapter_TeX_Equ9.png)\n\n（公式 6.9）\n\n可以使用数据中 `X` 的最小值和最大值来估计\
    \ `a` 和 `b`。除了创建哑变量之外，二元变量无需进行调整。如果具有 `m` 个类别的分类变量是有序的，则选择 `[0,1]` 区间内的 `m` 个分数来表示其感知顺序。如果这些类别是无序的，则将它们创建为\
    \ `m-1` 个哑变量。请注意，为了获得更好的预测性能，对高度偏斜的预测变量进行变换也很重要。这种情况在商业分析领域的变量（如收入）中很常见。因此，建议先对此类变量取\
    \ `log`，然后再缩放到 `[0,1]` 区间。\n\n## 神经网络——评估性能（数值结果）\n\n回归树的预测性能可以通过与其他预测方法（例如线性回归和回归树）相同的方式来检验，即使用像\
    \ `RMSE` 这样的汇总度量。\n\n## 销售预测问题——神经网络\n\n使用第 6.2 节中介绍的销售预测问题，以下演示了如何使用神经网络解决该问题：\n\
    \n![](img/532459_1_En_6_Fig26_HTML.png)\n\n一个流程截图显示了七个步骤：检索丰田数据、标称型转数值型、设置角色、分割数据、神经网络、应用模型和性能。右侧是一个参数选项卡。\n\
    \n**图 6-20** 神经网络流程\n\n1.  创建一个新流程，并将 `ToyotaCorollaData2` 数据拖到**设计视图**中（请记住，此版本的数据中已排除了\
    \ ID 列）。运行神经网络的总体流程如图 6-20 所示。\n\n    ![](img/532459_1_En_6_Fig27_HTML.png)\n\n\
    \    一个改进的神经网络截图，左侧有 13 个输入，指向中间名为隐藏层 1 的 9 个点，这些点再指向右侧的一个输出。\n\n    **图 6-21a**\
    \ 神经网络模型\n\n2.  对于**标称型转数值型** 算子，您将选择 `Fuel_Type` 属性（将 `Fuel_Type` 转换为哑变量）。点击**设置角色**\
    \ 算子，并将**属性名称**设为 `Price`，**目标角色**设为标签。点击**分割数据** 算子，并在该数据的**分区**属性中添加两个条目，分别为\
    \ 0.6 和 0.4。对于**神经网络** 算子，我们将保留图 6-20 中所示的默认设置。该算子通过一个由反向传播算法（多层感知器）训练的前馈神经网络来学习模型。该算子无法处理多项式属性（有关该算子参数的更多解释，请查看帮助）。请注意，我们没有使用归一化算子；这是由图\
    \ 6-20 中默认选中的**神经网络** 算子的归一化参数来处理的。**应用模型** 算子无需参数调整；它用于将从**神经网络** 算子获得的模型应用于验证数据集。对于**性能（回归）**\
    \ 算子的参数，只需保留默认设置，即*均方根误差*。\n\n3.  使用图 6-16 中的设置，我们期望得到三个输出（即三个指向 `res` 的链接）。第一个是神经网络模型（图\
    \ 6-21a），第二个是模型性能结果（图 6-21b），第三个是显示验证数据集预测结果的数据表（图 6-21c）。\n\n该图展示了输入层、隐藏层和输出层。\n\
    \n![](img/532459_1_En_6_Fig28_HTML.png)\n"
