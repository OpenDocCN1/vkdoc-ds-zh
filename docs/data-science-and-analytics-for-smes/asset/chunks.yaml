    A computer screenshot illustrates the importing of the fresh data from the existing
    excel sheet by changing the role of customer Id to Id and excluding some specific
    attributes.


    Figure 8-11


    Importing the data for k-means clustering


    Create a new process (call it preprocessing2). Use the settings in Figure [8-12](#532459_1_En_8_Chapter.xhtml#Fig12)
    to create the process. The purpose of this process is to preprocess only the attributes
    that will be clustered.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig12_HTML.png)


    A computer screenshot illustrates the settings to create a new process which aims
    to preprocess only the attributes that are used for clustering.


    Figure 8-12


    Preprocessing the data for k-means


    For the ***Replace Missing Value*** operator, select Brand, Online order, Product
    class, Product size, and Tenure; for the ***Nominal to Numerical*** operator,
    select all available categorical data; and for the ***Normalize*** operator, select
    all apart from customer Id. For the csv file parameter of the ***Write CSV***
    operator, select NoodleRetailNormalize.csv (which is an empty csv file that you
    would have created by yourself and saved somewhere on your system). After running
    the process, the data will be stored in NoodleRetailNormalize.csv.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig13_HTML.png)


    A computer screenshot displays the settings to perform the K-means clustering
    process.


    Figure 8-13


    k-means process


    1.  *Determine k*: To determine k, there are several approaches to do this, but
    we shall be supplying the number of k (which is 2) to use for this demonstration,
    representing the domain expert.


    2.  *Perform k-means clustering and validate the clusters*: Numerical measures
    were selected because we have converted all the attributes to numerical. ***Import***
    the NoodleRetailNormalize.csv, and create a new process (call it kmeans); use
    the settings in Figure [8-13](#532459_1_En_8_Chapter.xhtml#Fig13) for this process
    (the k-means clustering). For the k parameter of the ***k means*** operator, set
    it as 2 and leave all other parameter settings as default. For the ***Cluster
    Distance Performance*** operator, leave the main criterion parameter as default.
    (Please read the help of these operators in the RapidMiner documentation for more
    details.)'
  trans: '以下是根据您的要求，将英文文本翻译成中文的 Markdown 内容：


    ---


    以下缺失值在这些统计结果中显而易见，将通过用属性的平均值替换来处理：


    - `Brand` – 93

    - `Online order` – 170

    - `Product class` – 93

    - `Product size` – 93

    - `Tenure` – 214


    创建一个新进程（命名为 `preprocessing1`）。使用图 8-5 中的设置，用平均值替换缺失值。点击 **Replace Missing Values**
    运算符，并选择 `Brand`、`Online order`、`Product class`、`Product size` 和 `Tenure`。


    ![](img/532459_1_En_8_Fig5_HTML.png)


    *一张电脑截图展示了在面条零售公司数据统计结果中插入缺失值的过程。*


    **图 8-5** *处理缺失值的流程*


    运行该进程，并使用图 8-6 中的设置可视化结果数据（仅数值属性）以检测异常值。


    ![](img/532459_1_En_8_Fig6_HTML.png)


    *一张电脑截图显示了数值属性与其值之间的箱线图。图的设置显示在图的左侧。*


    **图 8-6** *可视化数值属性*


    无论数值变量是单独可视化还是按照图 8-6 中的设置一起可视化，似乎都没有出现异常值。


    图 8-7 是使用散点图检测 `age` 属性异常值的可视化结果；这对于所有数值属性都可以类似操作。


    ![](img/532459_1_En_8_Fig7_HTML.png)


    *一张电脑截图显示了客户 ID 与 age 属性之间的散点图，分别位于 Y 轴和 X 轴。设置显示在图的左侧。*


    **图 8-7** *数值属性 age 的散点图*


    我们来修改图 8-5 中的设置，以得到图 8-8 中的结果，从而通过将所有分类变量转换为数值、进行归一化和执行相关性矩阵来探究是否需要对属性进行缩减。


    ![](img/532459_1_En_8_Fig8_HTML.png)


    *一张电脑截图展示了将所有分类变量转换为数值并创建相关性矩阵的设置。*


    **图 8-8** *数据的进一步预处理*


    如图 8-8 所示，`Nominal to Numerical` 运算符选择了所有分类属性。点击 **Normalize** 运算符，对于 **attribute
    filter type** 参数，选择 **all**。将 **Correlation Matrix** 运算符保持默认设置。运行进程，得到图 8-9 中的相关性矩阵；点击同一图中的
    **Pairwise Table**，并将相关性值按降序排序，得到图 8-10。


    ![](img/532459_1_En_8_Fig10_HTML.jpg)


    *一张电脑截图显示了点击成对表格选项并按降序排序相关性值后获得的相关性矩阵。*


    **图 8-10** *相关性矩阵（成对表格）*


    ![](img/532459_1_En_8_Fig9_HTML.png)


    *一张电脑截图显示了带有一些高亮值的相关性矩阵。该矩阵有助于判断是否需要缩减属性。*


    **图 8-9** *相关性矩阵*


    从图 8-10 中可以看出，没有强相关的成对变量（最高的成对相关性为 0.331），因此，本演示将使用所有属性。（列表顶部的某些属性可能会在稍后移除，以观察评估时是否能得到更好的聚类分离。）这一决定基于皮尔逊相关性公式，该公式由
    **Correlation Matrix** 运算符使用。


    皮尔逊相关系数 `R` 是最终得到的结果，其值必须介于 –1 到 +1 之间，即 –1 <= `R` <= +1。


    ![$$ r=\frac{n\sum xy-\sum x\sum y}{\surd \left\{n\sum {x}²-\left(x{\sum}²\right)\right\}\left\{n\sum
    {y}²{\left(\sum y\right)}²\right\}} $$](img/532459_1_En_8_Chapter_TeX_Equa.png)


    上述公式用于获取 `R` 的值，且 `R` 的值必须落在以下范围内：


    - `+1 到 0.7`：表示变量之间的强度呈正向完美相关

    - `0.6 到 0.5`：表示变量之间的强度呈一定相关性

    - `0.4 到 0.2`：表示变量之间的强度呈弱相关性

    - `-1 到 -0.7`：表示变量之间的强度呈负向强相关

    - `-0.6 到 -0.5`：表示变量之间的强度呈一定相关性

    - `-0.4 到 -0.2`：表示变量之间的强度呈弱相关性

    - `0`：表示没有相关性或关系


    ---


    (b) 接下来我们进入预处理的第二部分，这部分涉及重新导入数据（因为聚类需要客户 ID）并仅选择那些没有强相关性的属性。该进程的结果将存储在一个 csv 文件中，随后该文件将被重新导入，用于
    k-means 聚类。


    **重新导入**数据（`NoodleRetail.xlsx`）；这次，将 `customer Id` 的角色更改为 `Id`，如图 8-11 所示。之后，排除属性
    `Country`、`Number of Records`、`Transaction Date`、`Transaction Id`、`Deceased Indicator`
    和 `Product Id`。在 `RapidMiner` 中将这个新数据命名为 `NoodleRetail2`。


    ![](img/532459_1_En_8_Fig11_HTML.png)


    *一张电脑截图展示了通过将 customer Id 的角色更改为 Id 并排除某些特定属性，从现有 Excel 表中重新导入数据的过程。*


    **图 8-11** *为 k-means 聚类导入数据*


    创建一个新进程（命名为 `preprocessing2`）。使用图 8-12 中的设置来创建该进程。此进程的目的是仅预处理将要用于聚类的属性。


    ![](img/532459_1_En_8_Fig12_HTML.png)


    *一张电脑截图展示了创建一个旨在仅预处理用于聚类属性的新进程的设置。*


    **图 8-12** *为 k-means 预处理数据*


    对于 **Replace Missing Value** 运算符，选择 `Brand`、`Online order`、`Product class`、`Product
    size` 和 `Tenure`；对于 **Nominal to Numerical** 运算符，选择所有可用的分类数据；对于 **Normalize**
    运算符，选择除 `customer Id` 之外的所有数据。对于 **Write CSV** 运算符的 csv 文件参数，选择 `NoodleRetailNormalize.csv`（这是一个您需要自行创建并保存在系统某处的空
    csv 文件）。运行进程后，数据将存储在 `NoodleRetailNormalize.csv` 中。


    ![](img/532459_1_En_8_Fig13_HTML.png)


    *一张电脑截图显示了执行 k-means 聚类过程的设置。*


    **图 8-13** *k-means 进程*


    1.  **确定 k**：确定 `k` 有几种方法，但在本演示中，我们将直接提供 `k` 的值（即 2），以代表领域专家的意见。

    2.  **执行 k-means 聚类并验证聚类结果**：由于我们已经将所有属性转换为数值型，因此选择了数值指标。**导入** `NoodleRetailNormalize.csv`，并创建一个新进程（命名为
    `kmeans`）；使用图 8-13 中的设置来配置此进程（即 k-means 聚类）。对于 **k means** 运算符的 `k` 参数，设置为 2，并保持所有其他参数设置为默认。对于
    **Cluster Distance Performance** 运算符，将主标准参数保持为默认值。（更多详细信息，请阅读 `RapidMiner` 文档中这些运算符的帮助内容。）'
- fmt: 'From Figure [8-13](#532459_1_En_8_Chapter.xhtml#Fig13), we expect three outputs
    as shown in Figures [8-14a](#532459_1_En_8_Chapter.xhtml#Fig14), [8-14b](#532459_1_En_8_Chapter.xhtml#Fig15),
    and [8-14c](#532459_1_En_8_Chapter.xhtml#Fig16), respectively.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig14_HTML.png)


    A computer screenshot depicts the performance of the K-means clustering model
    which informs about the extent of separation of the clusters.


    **Figure 8-14a**


    Performance results for the k-means model


    Figure [8-14a](#532459_1_En_8_Chapter.xhtml#Fig14) is the performance of the k-means
    model which is used to know how well the clusters are separated. From the RapidMiner
    documentation, `avg._within_centroid_distance`, the average within-cluster distance
    is calculated by averaging the distance between the centroid and all examples
    of a cluster. The smaller, the better. When comparing the results of several k-means
    models, the model that produces a collection of clusters with the smallest Davies-Bouldin
    index is considered the best algorithm based. Even though we chose a value for
    our `k` in this demonstration, it is advised in practice to try several values
    of `k` and compare the `avg._within_centroid_distance` and the Davies-Bouldin
    index before selecting `k`.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig15_HTML.png)


    A computer screenshot displays the output of the clustered data and indicates
    the cluster to which each customer belongs to using the id of the cluster.


    **Figure 8-14b**


    Cluster dataset


    Figure [8-14b](#532459_1_En_8_Chapter.xhtml#Fig15) is the output of the data that
    has been clustered, indicating (using the cluster Id) the cluster to which each
    customer belongs. This can be further visualized to see how well the customers
    are separated. (The `Cluster Model Visualizer` operator can help, but it does
    not come with the free edition of RapidMiner.)


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig16_HTML.png)


    A computer screenshot depicts a line chart which is the plot of the cluster centroid.
    It informs about the attributes that describe different clusters.


    **Figure 8-14c**


    Visualized Centroid Values for each Attribute


    The plot tab selected in Figure [8-14c](#532459_1_En_8_Chapter.xhtml#Fig16) is
    the plot of the centroid table which helps to see which attributes describe different
    clusters.


    1.  *Interpret your results*: To characterize the resulting clusters, we examine
    the cluster centroids, using this line chart (also known as the profile plot).
    We can see from Figure [8-14c](#532459_1_En_8_Chapter.xhtml#Fig16) that the clusters
    are not too separated from each other for some attributes, but nonetheless there
    are some attributes that give distinct separation such as the Brand = Dangote,
    Brand = Chikki, Product class = medium, Product class = low, Product class = high,
    Product size = large, Product size = small, and list price. These are the main
    distinguishing attributes for this k-means model, and they can be used to characterize
    each of the clusters.


    To characterize the different clusters, compare the cluster centroid (centroid
    table in Figure [8-14c](#532459_1_En_8_Chapter.xhtml#Fig16)) and try to give each
    cluster a label. This label is obtained from any or all of the variables in the
    dataset. The question here then is: Which clusters would you target for offers,
    and what types of offers would you target to customers in that cluster?


    ## 8.4 Association Analysis


    Association analysis is a technique used to discover groups of related items (clusters)
    in databases that store transactions.


    It aims to figure out what kinds of things people tend to buy together. When this
    discovery is made, these items can be shown together among the other items, offered
    in post-transaction coupons, or recommended for online shopping. In order to select
    a subset of rules, the stages of establishing association rules include formulating
    rules and evaluating the strength of those rules.


    Algorithms for mining frequent itemsets are used to construct association rules.
    The classic one selected is the Apriori algorithm of Agrawal et al. (1993). The
    important steps in the algorithm are shown in Figure [8-15](#532459_1_En_8_Chapter.xhtml#Fig17).


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig17_HTML.png)


    A figure illustrates the steps in the Apriori algorithm of Agrawal et al.


    **Figure 8-15**


    Apriori algorithm by Agrawal et al. (1993)


    The algorithm can generate a lot of rules, but we only need to make a decision
    using the strongest based on the dependence between the antecedent and consequent.
    If we have the following rule:


    > *If diaper and biscuits are purchased, THEN wipes are purchased on the same
    trip.*


    *Antecedent: Diaper and biscuits are purchased.*


    *Consequent: Wipes are purchased on the same trip.*


    The strength of association implied by a rule is measured using


    ![$$ Support=P\left( antecedent\ AND\ consequent\right) $$](images/532459_1_En_8_Chapter/532459_1_En_8_Chapter_TeX_Equ1.png)


    (Eq. 8.1)


    The support for the rule indicates the rule’s overall impact in terms of size:
    What is the total number of transactions impacted? If only a few transactions
    are impacted, the rule may not be of much benefit.


    ![$$ Confidence=\frac{no. transactions\ with\ both\ antecedent\ and\ consequent\
    itemsets}{no. of\ transactions\ wi\textrm{t}h\ antecedent\ itemset} $$](images/532459_1_En_8_Chapter/532459_1_En_8_Chapter_TeX_Equ2.png)


    (Eq. 8.2)


    ![$$ Confidence=\frac{P\left( antecedent\ AND\ consequent\right)}{P(antecedent)}=P\left(
    consequent| antecedent\right) $$](images/532459_1_En_8_Chapter/532459_1_En_8_Chapter_TeX_Equ3.png)


    (Eq. 8.3)


    *   A high value of confidence suggests a strong association rule (in which we
    are highly confident).

    *   However, this can be deceptive because when the antecedent and/or the consequent
    have strong support, we can have a high level of confidence in both even though
    they are independent.

    *   The confidence tells us the rate at which consequences will be discovered
    and is useful in judging a rule’s usefulness in business or operational context.
    There may be too few consequences found by a rule with a low degree of confidence
    for it to justify the cost of promoting that rule’s consequent in all transactions
    that include the antecedent.


    ![$$ lift\ ratio=\frac{confidence}{benchmark\ confidence} $$](images/532459_1_En_8_Chapter/532459_1_En_8_Chapter_TeX_Equ4.png)


    (Eq. 8.4)


    *   We may better evaluate an association rule’s strength by comparing its confidence
    level to a benchmark value, in which we assume that the antecedent and consequent
    itemsets in a transaction are independent of each other. In other words, what
    level of confidence can we have in the results if the antecedent and consequent
    itemsets are independent?

    *   A lift ratio larger than 1.0 implies that the relationship between the antecedent
    and the consequent is more significant than would be expected if the two sets
    were independent. The larger the lift ratio, the more significant the association.

    *   The lift ratio is a measure of how well the rule is at finding the consequents,
    compared to random selection. Even though a very efficient rule is preferable
    to an inefficient rule, we must also take into account support: a rule with high
    efficiency but low support may not be as desirable as a rule with lower efficiency
    but much higher support.'
