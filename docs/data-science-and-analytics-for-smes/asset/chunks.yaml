- fmt: '## 2.2 Data Quality and Integrity


    It is often said in the world of computing that garbage in is garbage out, that
    is, the quality of information produced after processing cannot be better than
    the quality of information that was processed. This is not any less true in data
    analytics. The quality of data refers to the degree to which data can be used
    for its intended purpose and the degree to which data accurately represents the
    real world. There is a need to measure the quality of data to be used for analysis,
    and this can be done by checking the data for the following:


    - **Completeness**: This is used to check if we have all of the information we
    should have. We respond to questions such as, “Have all events been captured?”
    Are all reference data values taken into account?

    - **Uniqueness**: This is when we check if single events are captured only once.

    - **Accuracy**: This is where we determine if the data is a true representation
    of the concept it is attempting to convey. Ensuring numerical and string values
    are correct, as well as timestamps and other properties, is among the other activities.

    - **Consistency**: In checking for consistency, we want to ensure that the data
    format is as expected. There is a need to ensure that the same data is captured
    the same way every time.

    - **Conformance/validity**: Does the data in the database comply with the syntax,
    encoding, or other model requirements? Are data formats correct? Are codes as
    expected? Are naming conventions adhered to?

    - **Timeliness**: Here, we want to know if data is available by the time it is
    needed. This is also referred to as “data latency.”

    - **Provenance**: Here, we want to know if we have visibility into the origins
    of the data. And how much confidence do we have that the data is real and accurate?


    From a survey in 2017 on 7376 respondents by Kaggle⁵ on the data science competition
    community, it was discovered after asking them to rate the barriers they faced
    at work that the highest in the rank was the dirty data problem which carried
    a percentage of 49.4% out of the whole population surveyed.


    Particularly common in the SME business environment is the **dirty data problem**.
    These are situations where data is full of errors such as misspelled data, typos,
    and duplicate data. This can be fixed systematically when identified. There are
    also situations where data violates business rules; to solve this, there might
    be a need to involve a cross-functional effort between departments of the organization.
    There are situations where data is collected using the wrong method or the wrong
    population. This data often comes from asking the wrong business questions; all
    these can be overcome by putting a proper data governance procedure in place for
    the business at the start or carry out corrective measure when discovered. Currently,
    there are algorithms that can be used to analyze data for duplicates and other
    mistakes. It is important to emphasize here that prevention is the best cure,
    that is, improved procedures of data collection, forms, and records with more
    standardized fields are preferable. In addition, make origins and history of data
    visible and transparent in order to trace back every mistake. In conclusion, the
    completeness, validity, and consistency of your data depend on the methods, and
    each business will have developed and customized such methods for its particular
    needs.


    ## 2.3 Data Governance


    Data governance is simply defined as the process put in place to make sure that
    data is available, usable, secured, and has integrity. In the past, only large
    corporations cared about data governance, but because small businesses are also
    onboard making data-informed decisions, they are also embracing data governance.
    The data governance process is built on a collection of rules and regulations
    that secure data and ensure that it is handled in accordance with all applicable
    external laws. The data steward is responsible for developing and enforcing these
    uniform norms and regulations. For small businesses, the way to go about data
    governance is to tackle it from these three directions. First, assign someone
    (or more if you can afford it) to the task of data governance. A good rule of
    thumb is that as soon as you have a full-time analyst in your team, they should
    explicitly own data governance.⁹ Second, the person in charge comes up with a
    document known as a data **treasure map** consisting of a list of where data comes
    from, for example, marketing, finance, sales CRM, etc., and a list of where the
    data goes to, for example, data warehouse if any or the business intelligence
    visualization tools. (Note that small business also refers to one-man business,
    so this second stage might not be available in the form of a software application
    but interpreted as copying data from `Excel` to `Tableau` manually). Third thing
    is to include the information about who uses your data. Finally, there is a need
    to educate all employees on the importance of the data governance model developed,
    its dos and don’ts. For more resources on data governance for small business,
    check Nwabude, Begg, and McRobbie (2014).^(6,7) For the tools that can help small
    business with data governance check Nwabude(2014) and others^(8,10)


    ## 2.4 Data Preparation


    After the necessary data has been retrieved for analytics, the very first thing
    to do is to clean the data. This is necessary because analysis done on faulty
    data can be misleading, and there can be serious economic consequences of using
    uncleaned data for analysis. In the past, many major organizations have lost a
    lot of revenue due to this, and a popular example is the JPMorgan Chase trading
    loss.^(11)


    First of all, let’s lay some foundation about the types of variables so that we
    can understand the data preparation procedures. The data obtained is in the form
    of variables. Categorical variables have a fixed range of values and can be unordered
    (called nominal variables) with categories such as North America, Europe, and
    Asia; or they could be ordered (called ordinal variables) with categories such
    as high value and low value. Numerical variables are never ending. They are continuous
    (able to assume any real numerical value, usually in a given range). Numerical
    variables can be integers which take only integer values. Another kind of variable
    is the date, and we have other ones depending on the analytics platform being
    used.


    When cleaning the data, we are examining the data for bad formatting, trailing
    spaces, duplicates, empty rows, synonyms, and abbreviations. In cleaning the data,
    you ask questions like: *Do character variables have valid values? Are numerical
    values within range? Are there duplicate values/rows? Are values unique for some
    variables? Are dates valid? Does the dataset even contain attributes indicating
    what you want to predict? In which case there is no need for prediction. Are there
    missing values? Is there inconsistency in description?*


    In preparing and examining the data you want to use, summary statistics can be
    used to discover the complete set of variables in the data, learn the characteristics
    of the variables and the range of values in the variables, and select variables
    for the analysis. Mean, median, standard deviation, minimum, maximum, and so on
    are all examples of summary statistics. The minimum and maximum can be used to
    detect extreme values that might be errors. The mean and median give a sense of
    the central values of that variable, and a large deviation between the two also
    indicates skew. The standard deviation gives a sense of how dispersed the data
    are (relative to the mean).


    ### Summary Statistics'
