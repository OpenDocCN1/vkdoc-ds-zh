    Billing State=Ogun is very high.


    Billing State=Others is low.


    Billing State=Lagos is slightly low.


    Email Status=A is low.


    DiscountedPrice is slightly high.


    (Note that other k values that give better separation and distinct characteristics
    can be tried out.)


    **Linking both segmentation processes**


    So after segmenting external data, we want to select the cluster that matches
    Cluster_1 from the internal data. Unfortunately for this demonstration, Cluster_1
    (Billing State=Lagos is slightly high) is the only striking characteristic as
    the other attributes’ characteristics are not striking. Regardless, we still proceed
    by using only this attribute to match the characteristics of the external data
    to find that Cluster_0 is the cluster with such characteristics along with other
    characteristics.


    The recommendation therefore is that if we intend to target a cluster that has
    a potential of high profit made and large number of members, Cluster_0 in the
    external data is the recommended one. In other situations, where there are more
    distinguishing characteristics of the cluster, the recommendation would have been
    richer.


    1.  ***Display and present the result.***


    Based on the audience in question, these results need to be presented in simple
    charts supported with necessary visual diagrams to depict the best option and
    the reason for selecting such an option.'
  trans: '

    | 聚类名称 | 平均利润 |

    | --- | --- |

    | `Cluster_0` | 172,000 |

    | `Cluster_1` | 745,555 |

    | `Cluster_2` | 175,000 |


    ![](img/532459_1_En_10_Fig30_HTML.png)


    该截图以表格形式展示了包含十二列和十八行的聚类数据集。


    **图 10-25** 聚类数据集


    接下来，我们将根据图 10-23 得到的聚类结果，尝试解释上述所有聚类的特征如下：


    ***Cluster_0***


    - `Billing State=Lagos` 略低。

    - `Billing State=Others` 略高。

    - 该聚类没有能够使其脱颖而出的显著属性。


    ***Cluster_1***


    - `Billing State=Lagos` 略高。

    - 其他属性特征不显著。


    ***Cluster_2***


    - `Email Status=A` 非常低。

    - `No of Days` 非常高。

    - 这两个属性很大程度上将该聚类的项与其他项区分开来。


    由于 `Cluster_1` 具有最高的平均利润，理想情况下我们希望利用 `Cluster_1` 的特征在外部数据中寻找相似的聚类，然后将其作为目标（按照最佳情况方案的选择），因为它客户数量多且平均利润高。


    ### 外部数据 5a–e


    接下来的步骤将有助于对外部客户进行细分。


    导入外部数据（`FarmCo.External`），并在导入时排除以下字段：`Customer ID`、`Shipping State`、`Quantity`、`No
    of C`、`Item Count`。这是因为它们在内部数据聚类中未被使用。


    检查外部数据（`FarmCo.External.csv`）的缺失值后，我们得到图 10-26 中的统计数据。某些属性存在缺失值，稍后将通过 `replace
    missing value` 运算符处理。


    ![](img/532459_1_En_10_Fig31_HTML.png)


    该截图展示了一个表格，包含列标题：名称、类型、缺失值和统计信息。在列标题“名称”下方列出了不同的属性。


    **图 10-26** 汇总统计


    检查数值属性的异常值（使用散点图），我们发现所有属性均无异常值。图 10-27 是一个示例。


    ![](img/532459_1_En_10_Fig32_HTML.png)


    该截图展示了一个散点图，绘制了折扣价与折扣价的关系。X 轴和 Y 轴的值分别为 2,749 和 50。


    **图 10-27** 检查数值属性（`Discounted Price`）


    我们可以检查外部数据的相关性矩阵（图 10-28）。需要注意，为了能够将两个聚类输出结果关联起来，外部数据细分必须使用与内部数据细分相同的属性。


    ![](img/532459_1_En_10_Fig33_HTML.png)


    该截图展示了外部数据相关性矩阵的结果。高度相关的变量位于表格的对角线上，并已高亮显示。


    **图 10-28** 相关性矩阵（外部数据）


    再次导入外部数据，这次将 `Customer ID` 的角色设置为 `Id`。在导入时排除以下字段：`Customer ID`、`Shipping State`、`Quantity`、`No
    of C`、`Item Count`。图 10-29 中的设置将生成图 10-30a（`K=2`）、10-30b（`K=2` 的性能）、10-31a（`K=3`）、10-31b（`K=3`
    的性能）、10-32a（`K=4`）和 10-32b（`K=4` 的性能）中所示的聚类可视化结果。请注意，在选择属性时，请选择用于内部聚类的那些属性。


    ![](img/532459_1_En_10_Fig40_HTML.jpg)


    该截图展示了三个选项卡：性能百分比、描述和注释。描述包含七行性能向量的代码。


    **图 10-32b** `K=4` 的性能（外部数据）


    ![](img/532459_1_En_10_Fig39_HTML.png)


    该截图展示了一个折线图，绘制了 0、1、2 和 3 的值。0、1、2 和 3 的线在负 1 和 13 之间波动。


    **图 10-32a** `K=4` 的聚类轮廓（外部数据）


    ![](img/532459_1_En_10_Fig38_HTML.jpg)


    该截图展示了三个选项卡：性能百分比、描述和注释。描述包含六行性能向量的代码。


    **图 10-31b** `K=3` 的性能（外部数据）


    ![](img/532459_1_En_10_Fig37_HTML.png)


    该截图展示了一个折线图，绘制了 0、1 和 2 的值。0、1 和 2 的线在负 1 和 2.75 之间波动。


    **图 10-31a** `K=3` 的聚类轮廓（外部数据）


    ![](img/532459_1_En_10_Fig36_HTML.jpg)


    该截图展示了三个选项卡：性能百分比、描述和注释。描述包含五行性能向量的代码。


    **图 10-30b** `K=2` 的性能（外部数据）


    ![](img/532459_1_En_10_Fig35_HTML.png)


    该截图展示了一个折线图，绘制了 0 和 1 的值。0 和 1 的线在负 0.8 和 1.1 之间波动。


    **图 10-30a** `K=2` 的聚类轮廓（外部数据）


    ![](img/532459_1_En_10_Fig34_HTML.png)


    该截图描述了外部数据的聚类过程，涉及以下步骤：检索、替换缺失值、标称型转数值型、选择属性、归一化、聚类和性能评估。


    **图 10-29** 对外部数据进行聚类


    根据上述结果，我们选择 `K=2`，因为其 `davies_bouldin` 值最小。


    这些聚类的特征如下：


    ***Cluster_0***


    - `Billing State=Ogun` 低。

    - `Billing State=Others` 略高。

    - `Billing State=Lagos` 略高。

    - `Email Status=A` 略高。

    - `DiscountedPrice` 低。


    ***Cluster_1***


    - `Billing State=Ogun` 非常高。

    - `Billing State=Others` 低。

    - `Billing State=Lagos` 略低。

    - `Email Status=A` 低。

    - `DiscountedPrice` 略高。


    （注意，可以尝试其他能够提供更好分离度和显著特征的 `k` 值。）


    ### 关联两个细分过程


    因此，在对外部数据进行细分后，我们希望选择与内部数据中 `Cluster_1` 相匹配的聚类。遗憾的是，在本演示中，`Cluster_1`（`Billing
    State=Lagos` 略高）是唯一显著的特征，其他属性特征并不突出。尽管如此，我们仍然仅使用这个属性来匹配外部数据的特征，从而发现 `Cluster_0`
    是具备该特征以及其他特征的聚类。


    因此，建议是：如果我们打算针对一个具有高利润潜力和大量成员的聚类，那么外部数据中的 `Cluster_0` 是推荐选择。在其他情况下，如果聚类具有更多区分性特征，那么推荐将更为丰富。


    ### 展示并呈现结果


    根据目标受众，这些结果需要用简单的图表并辅以必要的可视化图表来呈现，以展示最佳方案及其被选择的原因。'
