- fmt: "### 6.4 Multiple Linear Regression\n\nThe multiple linear regression (MLR)\
    \ model illustrates the link between the dependent variable and several independent\
    \ variables (two or more). The variance (i.e., `R²`), as well as the unique contribution\
    \ of each independent variable, are expressed in the MLR model’s output. The regression\
    \ line is the name given to the regression equation. The coefficient of determination,\
    \ often known as `R²`, provides the proportion of the variability of the independent\
    \ variables (`X`) and quantifies the ability to predict an individual `Y` using\
    \ these independent variables.\n\nEquation [6.7](#532459_1_En_6_Chapter.xhtml#Equ7)\
    \ represents the regression equation. `x1`, `x2`, ... `xp` are independent variables\
    \ in this equation, while `β0`...`βp` are coefficients and `ϵ` is the noise or\
    \ unexplained element. `Y` stands for the dependent variable, which is the numerical\
    \ attribute we want to predict. Data is utilized to estimate the coefficients,\
    \ and data is also used to quantify the noise.\n\n![$$ Y={\\beta}_0+{\\beta}_1{X}_1+{\\\
    beta}_2{X}_2+{\\beta}_3{X}_3+\\dots \\dots \\dots +{\\beta}_p{X}_p+\\in $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ7.png)\n\
    \n(Eq. 6.7)\n\nThe data is also utilized to evaluate model performance if the\
    \ task at hand is to predict a numerical outcome. If the graph is skewed to the\
    \ right or left when visualizing with the histogram, we may need to convert the\
    \ independent variables using data transformation techniques (e.g., logarithmic\
    \ form `log(X)`). Note that the dependent variable does not have to be normally\
    \ distributed, but the model’s residuals have to be normally distributed for the\
    \ MLR model to be valid. Furthermore, because MLR is sensitive to multicollinearity,\
    \ there should be no multicollinearity, which means that the independent variables\
    \ should not be highly correlated. The adjusted `R²`, which is defined in Equation\
    \ [6.8](#532459_1_En_6_Chapter.xhtml#Equ8), is a popular method for evaluating\
    \ MLR models.\n\n![$$ {R}_{adj}^2=1-\\frac{n-1}{n-p-1}\\left(1-{R}^2\\right) $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ8.png)\n\
    \n(Eq. 6.8)\n\n*   `p` is the number of variables to be predicted.\n*   `R²` denotes\
    \ the model’s fraction of explained variability (in a model with a single predictor,\
    \ this is the squared correlation).\n*   Higher `R²_{adj}` values, like `R²`,\
    \ suggest greater fit.\n\nUnlike `R²`, which ignores the number of predictors\
    \ used, `R²_{adj}` penalizes the number of predictors used. For a more detailed\
    \ discussion of the multiple linear regression model, see Galit et al. (2018).³\
    \ The validation/test dataset is used to determine MLR’s prediction performance.\
    \ These are dataset partitions that are not meant to be used to select predictors\
    \ or calculate model parameters.\n\n### Variable selection in linear regression\n\
    \nChoosing the right form to use is determined by domain knowledge, data availability,\
    \ and the required predictive capability. It’s important to be cautious before\
    \ employing all of the available variables to build your model because collecting\
    \ a full complement of predictors for future forecasts can be costly or impossible.\
    \ Furthermore, we may be able to measure fewer predictors more reliably (e.g.,\
    \ in surveys), and the more predictors we have, the more likely we are to have\
    \ missing values in the data. To limit the number of predictors, there are a few\
    \ options. To reduce the number of predictors, one technique is to employ domain\
    \ knowledge. The utilization of computational power and statistical performance\
    \ measures is another option. Some of these approaches are as follows:\n\n*  \
    \ *Exhaustive search*: Evaluate all subsets of predictors and each subset model,\
    \ using certain criteria to evaluate the models.\n*   *Popular subset selection\
    \ algorithms*: This process uses an iterative partial search through the space\
    \ of all potential regression models. Forward selection, backward elimination,\
    \ and stepwise regression are examples of these.\n*   Principal component analysis,\
    \ for example, is particularly useful when subsets of observations are measured\
    \ on the same scale and are highly associated. If the number of variables is enormous,\
    \ principal component analysis can help to identify a few variables that are weighted\
    \ linear combinations of the original variables and maintain the majority of the\
    \ original set’s information. It’s most commonly used with numerical variables.\
    \ Check out Galit et al. (2018) for further information.\n\n### Sales prediction\
    \ problem – MLR\n\n1.  The first thing we are going to do is to create a new process\
    \ in `RapidMiner` and load the data again; we call it `ToyotaCorollaData2` (we\
    \ will exclude the ID column). This can be seen in Figure [6-9](#532459_1_En_6_Chapter.xhtml#Fig9).\n\
    \n    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig9_HTML.png)\n    A screenshot\
    \ of an example data set with 13 rows and columns presenting data for fuel types,\
    \ price, age, kilometers, HP, color, automatic, etc.\n    **Figure 6-9** Loading\
    \ the data\n\n    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig10_HTML.png)\n\
    \    A process screenshot has seven steps: Retrieve, Nominal to Numerical, Set\
    \ Role, Split Data leading to Linear Regression and apply model, and Performance.\n\
    \    **Figure 6-10** MLR overall process\n\n2.  The overall process for running\
    \ the multiple linear regression is given in Figure [6-10](#532459_1_En_6_Chapter.xhtml#Fig10).\n\
    \n    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig11_HTML.png)\n    A linear\
    \ regression table with 8 rows and 12 columns with data for fuel type, age, kilometer,\
    \ HP, met color, automatic, C c doors, etc.\n    **Figure 6-11** MLR model\n\n\
    3.  The first thing is to drag the data `ToyotaCorollaData2` to the design view\
    \ and search for all the operators in Figure [6-10](#532459_1_En_6_Chapter.xhtml#Fig10)\
    \ and connect them appropriately. For the `Nominal to Numerical` operator, you\
    \ will select the `Fuel_Type` attribute (converting `Fuel_Type` to dummies). Click\
    \ the `Set Role` operator and set the *attribute name* to be `Price` and *target\
    \ role* to be label. Click the `Split Data` operator, and for the partitions property\
    \ of this data, add two entries, 0.6 and 0.4, respectively. This means that you\
    \ are partitioning the data into 60% for the training and 40% for the validation.\
    \ Click the `Linear Regression` operator; the feature selection parameter though\
    \ optional is M5 prime by default. This is an expert parameter. It indicates the\
    \ feature selection method to be used during regression. The following options\
    \ are available: none, M5 prime, greedy, T-Test, and iterative T-Test (more information\
    \ in `Rapidminer.doc`). The `Apply Model` operator needs no parameter adjustment;\
    \ it is used to apply the model obtained from the `Linear Regression` operator\
    \ on the validation dataset. Note that the training dataset is what the linear\
    \ regression model uses to build the model. For the parameters of the `Performance\
    \ (Regression)` operator, simply leave as default, which is the *root mean square\
    \ error*.\n\n4.  With the settings in Figure [6-10](#532459_1_En_6_Chapter.xhtml#Fig10),\
    \ we are expecting three outputs (i.e., three links to `res`). The first is the\
    \ MLR model (Figure [6-11](#532459_1_En_6_Chapter.xhtml#Fig11)), the second is\
    \ the model performance result (Figure [6-12](#532459_1_En_6_Chapter.xhtml#Fig12)),\
    \ and the third is the data table revealing the predicted results (Figure [6-13](#532459_1_En_6_Chapter.xhtml#Fig13))\
    \ for the validation dataset."
  raw: '## 6.4 Multiple Linear Regression


    The multiple linear regression (MLR) model illustrates the link between the dependent
    variable and several independent variables (two or more). The variance (i.e.,
    R²), as well as the unique contribution of each independent variable, are expressed
    in the MLR model’s output. The regression line is the name given to the regression
    equation. The coefficient of determination, often known as R², provides the proportion
    of the variability of the independent variables (X) and quantifies the ability
    to predict an individual Y using these independent variables.


    Equation [6.7](#532459_1_En_6_Chapter.xhtml#Equ7) represents the regression equation.
    x1, x2,...xp are independent variables in this equation, while 0...p are coefficients
    and ϵ is the noise or unexplained element. Y stands for the dependent variable,
    which is the numerical attribute we want to predict. Data is utilized to estimate
    the coefficients, and data is also used to quantify the noise.


    ![$$ Y={\beta}_0+{\beta}_1{X}_1+{\beta}_2{X}_2+{\beta}_3{X}_3+\dots \dots \dots
    +{\beta}_p{X}_p+\in $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ7.png)


    (Eq. 6.7)


    The data is also utilized to evaluate model performance if the task at hand is
    to predict a numerical outcome. If the graph is skewed to the right or left when
    visualizing with the histogram, we may need to convert the independent variables
    using data transformation techniques (e.g., logarithmic form [log(X)). Note that
    the dependent variable does not have to be normally distributed, but the model’s
    residuals have to be normally distributed for the MLR model to be valid. Furthermore,
    because MLR is sensitive to multicollinearity, there should be no multicollinearity,
    which means that the independent variables should not be highly correlated. The
    adjusted R², which is defined in Equation [6.8](#532459_1_En_6_Chapter.xhtml#Equ8),
    is a popular method for evaluating MLR models.


    ![$$ {R}_{adj}^2=1-\frac{n-1}{n-p-1}\left(1-{R}^2\right) $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_Equ8.png)


    (Eq. 6.8)


    *   p is the number of variables to be predicted.


    *   R² denotes the model’s fraction of explained variability (in a model with
    a single predictor, this is the squared correlation).


    *   Higher ![$$ {R}_{adj}^2 $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_IEq1.png)
    values, like R², suggest greater fit.


    Unlike R², which ignores the number of predictors used,![$$ {R}_{adj}^2 $$](images/532459_1_En_6_Chapter/532459_1_En_6_Chapter_TeX_IEq2.png)penalizes
    the number of predictors used. For a more detailed discussion of the multiple
    linear regression model, see Galit et al. (2018).³ The validation/test dataset
    is used to determine MLR’s prediction performance. These are dataset partitions
    that are not meant to be used to pick predictors or calculate model parameters.


    **Variable selection in** **linear regression**


    Choosing the right form to use is determined by domain knowledge, data availability,
    and the required predictive capability. It’s important to be cautious before employing
    all of the available variables to build your model because collecting a full complement
    of predictors for future forecasts can be costly or impossible. Furthermore, we
    may be able to measure fewer predictors more reliably (e.g., in surveys), and
    the more predictors we have, the more likely we are to have missing values in
    the data. To limit the number of predictors, there are a few options. To reduce
    the number of predictors, one technique is to employ domain knowledge. The utilization
    of computational power and statistical performance measures is another option.
    Some of these approaches are as follows:


    *   *Exhaustive search*: Evaluate all subsets of predictors and each subset model,
    using certain criteria to evaluate the models.


    *   *Popular subset selection algorithms*: This process uses an iterative partial
    search through the space of all potential regression models. Forward selection,
    backward elimination, and stepwise regression are examples of these.


    *   Principal component analysis, for example, is particularly useful when subsets
    of observations are measured on the same scale and are highly associated. If the
    number of variables is enormous, principal component analysis can help to identify
    a few variables that are weighted linear combinations of the original variables
    and maintain the majority of the original set’s information. It’s most commonly
    used with numerical variables. Check out Galit et al. (2018) for further information.


    **Sales prediction problem** **– MLR**


    1.  The first thing we are going to do is to create a new process in RapidMiner
    and load the data again; we call it *ToyotaCorollaData2* (we will exclude the
    ID column). This can be seen in Figure [6-9](#532459_1_En_6_Chapter.xhtml#Fig9).


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig9_HTML.png)


    A screenshot of an example data set with 13 rows and columns presenting data for
    fuel types, price, age, kilometers, HP, color, automatic, etc.


    Figure 6-9


    Loading the data


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig10_HTML.png)


    A process screenshot has seven steps: Retrieve, Nominal to Numerical, Set Role,
    Split Data leading to Linear Regression and apply model, and Performance.


    Figure 6-10


    MLR overall process


    1.  The overall process for running the multiple linear regression is given in
    Figure [6-10](#532459_1_En_6_Chapter.xhtml#Fig10).


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig11_HTML.png)


    A linear regression table with 8 rows and 12 columns with data for fuel type,
    age, kilometer, HP, met color, automatic, C c doors, etc.


    Figure 6-11


    MLR model


    1.  The first thing is to drag the data ToyotaCorollaData2 to the design view
    and search for all the operators in Figure [6-10](#532459_1_En_6_Chapter.xhtml#Fig10)
    and connect them appropriately. For the ***Nominal to Numerical*** operator, you
    will select the Fuel_Type attribute (converting Fuel_Type to dummies). Click the
    ***Set Role*** operator and set the *attribute name* to be *Price* and *target
    role* to be label. Click the ***Split Data*** operator, and for the partitions
    property of this data, add two entries, 0.6 and 0.4, respectively. This means
    that you are partitioning the data into 60% for the training and 40% for the validation.
    Click the ***Linear Regression*** operator; the feature selection parameter though
    optional is M5 prime by default. This is an expert parameter. It indicates the
    feature selection method to be used during regression. The following options are
    available: none, M5 prime, greedy, T-Test, and iterative T-Test (more information
    in Rapidminer.doc). The ***Apply Model*** operator needs no parameter adjustment;
    it is used to apply the model obtained from the ***Linear Regression*** operator
    on the validation dataset. Note that the training dataset is what the linear regression
    model uses to build the model. For the parameters of the ***Performance (Regression)***
    operator, simply leave as default, which is the *root mean square error*.


    2.  With the settings in Figure [6-10](#532459_1_En_6_Chapter.xhtml#Fig10), we
    are expecting three outputs (i.e., three links to ***res***). The first is the
    MLR model (Figure [6-11](#532459_1_En_6_Chapter.xhtml#Fig11)), the second is the
    model performance result (Figure [6-12](#532459_1_En_6_Chapter.xhtml#Fig12)),
    and the third is the data table revealing the predicted results (Figure [6-13](#532459_1_En_6_Chapter.xhtml#Fig13))
    for the validation dataset.'
  trans: "\n### 6.4 多元线性回归\n\n多元线性回归模型说明了因变量与多个自变量（两个或更多）之间的关系。MLR 模型的输出中会体现方差（即`R²`），以及每个自变量的独特贡献。回归方程也被称为回归线。决定系数（通常称为`R²`）提供了自变量（`X`）变异性的比例，并量化了利用这些自变量预测某个特定`Y`的能力。\n\
    \n方程 6.7 代表了回归方程。在该方程中，`x1`, `x2`, ... `xp` 是自变量，`β0`...`βp` 是系数，`ϵ` 是噪声或未解释的因素。`Y`\
    \ 代表因变量，即我们希望预测的数值属性。数据用于估算系数，同时也用于量化噪声。\n\n![$$ Y={\\beta}_0+{\\beta}_1{X}_1+{\\\
    beta}_2{X}_2+{\\beta}_3{X}_3+\\dots \\dots \\dots +{\\beta}_p{X}_p+\\in $$](img/532459_1_En_6_Chapter_TeX_Equ7.png)\n\
    \n(公式 6.7)\n\n如果当前任务是预测一个数值结果，数据同样用于评估模型性能。当使用直方图进行可视化时，如果图形向左或向右偏斜，我们可能需要使用数据转换技术（例如对数形式`log(X)`）来转换自变量。请注意，因变量不必呈正态分布，但要使\
    \ MLR 模型有效，模型的残差必须呈正态分布。此外，由于 MLR 对多重共线性敏感，因此不应存在多重共线性，这意味着自变量之间不应高度相关。调整后的`R²`（定义见公式\
    \ 6.8）是评估 MLR 模型的常用方法。\n\n![$$ {R}_{adj}²=1-\\frac{n-1}{n-p-1}\\left(1-{R}²\\\
    right) $$](img/532459_1_En_6_Chapter_TeX_Equ8.png)\n\n(公式 6.8)\n\n*   `p` 是待预测变量的数量。\n\
    *   `R²` 表示模型中可解释变异性的比例（在只有一个预测变量的模型中，这相当于相关系数的平方）。\n*   与`R²`类似，较高的`R²_{adj}`值表明拟合优度更高。\n\
    \n与忽略所用预测变量数量的`R²`不同，`R²_{adj}`会对使用的预测变量数量进行惩罚。关于多元线性回归模型的更详细讨论，请参见 Galit 等人 (2018)。³\
    \ 验证/测试数据集用于确定 MLR 的预测性能。这些数据集分区不应用于选择预测变量或计算模型参数。\n\n### 线性回归中的变量选择\n\n选择使用的具体形式取决于领域知识、数据可用性和所需的预测能力。在将所有可用变量用于构建模型之前，务必谨慎，因为为未来预测收集完整的预测因子集可能代价高昂或不可行。此外，我们或许能够更可靠地测量较少的预测因子（例如在调查中），而预测因子越多，数据中出现缺失值的可能性就越大。为了限制预测因子的数量，有几种选择。一种技术是利用领域知识来减少预测因子的数量。另一种选择是利用计算能力和统计性能指标。其中一些方法如下：\n\
    \n*   *穷举搜索*：评估所有预测因子子集以及每个子集模型，并使用特定标准来评估模型。\n*   *流行的子集选择算法*：此过程通过对所有潜在回归模型的空间进行迭代部分搜索来执行。前向选择、后向消除和逐步回归都属于此类算法。\n\
    *   例如，主成分分析在观测子集在同一尺度上测量且高度相关时特别有用。如果变量数量庞大，主成分分析有助于识别少数几个变量，这些变量是原始变量的加权线性组合，并保留了原始集合的大部分信息。它最常用于数值变量。更多信息请查阅\
    \ Galit 等人 (2018)。\n\n### 销售预测问题 – MLR\n\n1.  我们要做的第一件事是在`RapidMiner`中创建一个新流程并重新加载数据；我们将其命名为`ToyotaCorollaData2`（我们将排除\
    \ ID 列）。这可以在图 6-9 中看到。\n\n    ![](img/532459_1_En_6_Fig9_HTML.png)\n    一个包含 13\
    \ 行和列的数据集示例截图，展示了燃料类型、价格、车龄、行驶里程、马力、颜色、自动挡等数据。\n    **图 6-9** 加载数据\n\n    ![](img/532459_1_En_6_Fig10_HTML.png)\n\
    \    一个包含七个步骤的流程截图：检索、标称型转数值型、设置角色、拆分数据，接着是线性回归和应用模型，以及性能评估。\n    **图 6-10** MLR\
    \ 整体流程\n\n2.  运行多元线性回归的整体流程如图 6-10 所示。\n\n    ![](img/532459_1_En_6_Fig11_HTML.png)\n\
    \    一个包含 8 行和 12 列的线性回归表，数据涉及燃料类型、车龄、行驶里程、马力、金属色、自动挡、C C 车门等。\n    **图 6-11**\
    \ MLR 模型\n\n3.  首先将数据`ToyotaCorollaData2`拖到设计视图，搜索图 6-10 中的所有算子并将它们正确连接。对于`标称型转数值型`算子，您需要选择`Fuel_Type`属性（将`Fuel_Type`转换为虚拟变量）。点击`设置角色`算子，并将*属性名称*设置为`Price`，*目标角色*设置为标签。点击`拆分数据`算子，对于此数据的分区属性，分别添加两个条目，0.6\
    \ 和 0.4。这意味着您将数据划分为 60% 用于训练，40% 用于验证。点击`线性回归`算子；特征选择参数虽然可选，但默认是 M5 prime。这是一个专家参数。它指定回归中使用的特征选择方法。可用的选项有：无、M5\
    \ prime、贪婪、T 检验和迭代 T 检验（更多信息见`Rapidminer.doc`）。`应用模型`算子无需调整参数；它用于将从`线性回归`算子获得的模型应用于验证数据集。请注意，线性回归模型使用训练数据集来构建模型。对于`性能（回归）`算子的参数，只需保留默认设置，即*均方根误差*。\n\
    \n4.  使用图 6-10 中的设置，我们期望得到三个输出（即三个连接到`res`的链接）。第一个是 MLR 模型（图 6-11），第二个是模型性能结果（图\
    \ 6-12），第三个是显示验证数据集预测结果的数据表（图 6-13）。\n"
