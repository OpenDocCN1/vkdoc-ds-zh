    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig20_HTML.png)


    A computer screenshot illustrates the setting to generate association rules.


    Figure 8-18


    Process to create association rules


    The result of running Figure [8-18](#532459_1_En_8_Chapter.xhtml#Fig20) is given
    in Figure [8-19](#532459_1_En_8_Chapter.xhtml#Fig21). It shows the premises (antecedent),
    conclusion (consequent), support, confidence, lift, and so on for the generated
