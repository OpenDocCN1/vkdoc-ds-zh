  trans: '

    ### 8.5 网络分析


    网络是一组相互连接（边）的对象（节点）的集合。图 8-21 展示了一个从推文中获取的通信网络示例。


    ![一张图示展示了从推文中获取的通信网络结构，包含多个相互连接的节点。](img/532459_1_En_8_Fig23_HTML.jpg)


    **图 8-21** 社交通信网络示例


    网络有多种类型。有从社交互动和人际关系中产生的社交网络，例如社交媒体上的网络、合著者网络等。还有其他类型的网络，如交通和移动网络、信息网络、生物网络等。


    网络中的节点指代对象，例如人、部门、交通站点等。边指代对象之间的连接，可能是友谊、婚姻、家庭关系、研究交流等。带权重的边还可以反映连接质量，例如网络中两人之间交换了多少封电子邮件。两点之间的距离可以用地图上边的长度来描述。


    网络结构可以是无向（双向）的或有向的。有向网络的一个例子是：Ibk 在 Twitter 上关注了 Femi，但 Femi 没有关注 Ibk。无向或双向网络的一个例子是：两人共同署名发表了一篇研究论文。


    有多种工具和平台可以用来创建和可视化网络；例如 `Gephi`、`networkX`、`Graphviz` 和 `R`（`igraph`）。可以使用这些工具中的任何一种来创建图形布局，但以下指导原则可以使图形更具可读性：


    *   每个节点应清晰可辨。

    *   对于每个节点，应能确定其度（连接数）。

    *   对于每个连接，应能追踪其从源节点到目标节点的路径。

    *   能够识别集群和离群点很重要。


    **网络度量指标**


    *   **度分布**：在网络中，度分布描述了一个节点连接了多少个其他节点。它有助于了解网络中的节点数量及其边的范围。

    *   **密度**：它给出了一个图在边（而非节点）方面的整体连通性。它是实际边数与最大可能边数之比。

    *   **平均聚类系数**：这也被称为“三元闭包”。聚类系数表示网络中共享连接的节点加入该网络的可能性。

    *   **网络直径**：用于描述网络中任意一对节点之间的最大距离。

    *   **社区数量**：它给出了网络中节点子集的数量，使得该子集中的每个作者都能与其他每个作者通过路径相连，而子集外的任何作者都无法与该子集中的任何作者通过路径相连。

    *   **度中心性**：它试图基于“重要节点拥有大量连接”这一思想来寻找中心性。

    *   **接近中心性**：它旨在通过假设“重要节点将接近网络中所有其他节点”来寻找中心性。

    *   **介数中心性**：对中心性的探索基于“连接其他节点的节点是重要节点”这一概念。

    *   **特征向量**：用以表达“一个节点的邻居越中心，该节点自身就越中心”这一思想。


    有关网络度量指标的更多信息，请参阅 Tsvetovat 和 Kouznetsov (2011)。


    **网络数据**


    网络数据可以是边列表或邻接列表的形式。图 8-22a 和图 8-22b 分别展示了边列表和邻接列表（针对同一数据）。


    ![一张表示网络数据的邻接列表形式的图，是一个 9 行 9 列的表格。](img/532459_1_En_8_Fig25_HTML.png)


    **图 8-22b** 邻接列表


    ![一张表示网络数据的边列表形式的图，是一个 15 行 2 列的表格。](img/532459_1_En_8_Fig24_HTML.png)


    **图 8-22a** 边列表


    网络分析几乎可以应用于所有感兴趣的领域。在商业中，我们可以用它来回答如下问题：


    *   广告是否可能在网络中传播？

    *   在这个商业环境中，谁是最具影响力的人？

    *   哪些产品与其他产品高度关联？

    *   以及其他更多问题。


    在本节中，我们将通过两个简单的示例演示如何在 `Gephi` 中创建和定制网络。在 8.6 节中，我们将演示一个真实的业务问题场景，展示网络分析的应用。请注意，这也可以定制来解决若干相关的其他问题。在这些示例中，将使用
    `Gephi` 进行实践演示。本书的 1.8 节详细说明了如何设置 `Gephi` 以及熟悉 `Gephi` 环境。


    **网络分析 – 示例 1**


    名为 `dynamic.gexf` 的数据是一个 `Gephi` 文件，包含来自一个通信社交网络（Twitter）用户的推文。这些推文已被转换为 `Gephi`
    文件形式的边列表（数据是使用 `netlytics.org` 下载并转换的）。关于如何下载数据并创建包含节点和边的 `Gephi` 文件的完整教程，请访问
    [`https://yusufsalman.medium.com/twitter-network-analysis-and-visualisation-with-netlytic-and-gephi-0-9-1-1011b009261`](https://yusufsalman.medium.com/twitter-network-analysis-and-visualisation-with-netlytic-and-gephi-0-9-1-1011b009261)。下载到
    Excel 中的数据如图 8-23 所示。


