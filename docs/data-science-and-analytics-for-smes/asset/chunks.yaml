    - 仅将连续段落间的多余空行删除（例如第一个段落后的空行、图片说明与正文间的空行等），同时保留图片引用和段落内部结构。

    - 保留原文中所有链接、数字上标（²、¹、³）以及章节引用。

    - 按照要求，未出现需加反引号的变量/函数/命令/路径名（原文中无此类内容），因此未做反引号处理。

    - 原文无代码块，因此未添加代码块标记。

    - 标题层级保留为 `###`（即 Markdown 三级标题），符合原文结构。'
- fmt: '### 3.2 Managing Analytics Project


    Typically, an analytics project is in phases; these phases will be covered in
    detail in Chapter [4](#532459_1_En_4_Chapter.xhtml). But this section will cover
    some important issues that relate to managing an analytics project successfully.


    The first thing to do when you kick-start an analytics project is to establish
    the scope of the project, particularly stating clearly those things that are within
    the boundaries of the project. This should be made and documented at the beginning
    of the project. Clearly defining the goal of the analytics project will help to
    do this. This will help to take care of distractions and additions (even though
    valuable) that are not part of what you set out to do. If these additions are
    important, there can now be a basis for renegotiation.


    The next and most important thing to put in place for managing an analytics project
    effectively is procedures for effective communication with all parties involved
    in the analytics project, from your team members to the stakeholders; they need
    to be kept in the know of what is going on whether good or bad, progressive or
    not. If need be, you need to also establish a line of escalation in case you need
    something resolved, for example, you are having issues retrieving data updates
    from the appropriate quarters. Closely related to this is the fact that you need
    to be able to monitor your team using whatever kind of tracker app you are comfortable
    with; this will enable you to get regular updates and identify and fix issues
    before it causes more damage to the analytics process. It will also help the communication
    of the analytics team. Finally, since the whole essence of consulting is to make
    money by solving business problems with analytics, then, there is a need to track
    hours and finances invested in the project so you know how to bill accurately,
    though this also depends on the billing approach you have chosen.


    In addition to the above, for you to be able to successfully manage an analytics
    project you need to be able to conceptualize analytical solutions for real-world
    problems. This means that when the problem is presented to you in the form of
    a real-world or real business problem, you need to be able to translate it to
    an analytics problem (note that not all problems are solvable with analytics)
    and then break the solution down into smaller components and link them together
    to give the overall results as revealed in Figure [3-2](#532459_1_En_3_Chapter.xhtml#Fig2).


    ![](images/532459_1_En_3_Chapter/532459_1_En_3_Fig2_HTML.jpg)


    A flowchart represents the problem-solving process in business analytics. Real-world
    problems are defined as analytics problems to get an overall result.


    **Figure 3-2:** Analytics problem solving process


    It is important to state at this point that machine algorithms and so on are not
    enough to solve business problems analytics-wise; there has to be a marriage of
    the business domain expertise (marketing, sales, etc.), technical expertise (data
    engineers, information technologist, etc.), and the technical skills involved
    in data analytics.


    No matter the size of the business you are consulting for, there is a need to
    factor all the above into your analytics project to make it successful.


    ### 3.3 Success Metrics in Analytics Project


    It is important to determine accurately the metrics to be used in evaluating the
    success of your analytics project because this helps to determine if the project
    has been successful or not. Not only that, it will help to bill your clients.
    As consultants, there is a need to leverage on previous success stories to bid
    for other contracts; therefore, getting accurate success metrics will make this
    possible. Even though there are general success metrics, the most effective metrics
    used in measuring the success of an analytics project is determined by the application
    area of that particular project. For example, if you are consulting for an ecommerce
    business with a goal to improve the sales or revenue, the metric to measure for
    success will include the `AOV` (average order value). In a physical retail shop,
    for example, the total number of customers that has been added due to implementing
    the results of the analytics project will be a good metric if the goal is to increase
    the customer base.


    Generally, for a data science project, we have the following metrics:


    - **Traditional metrics**: These types of metrics will help us to know how we
    are performing relative to the plan. This is where you want to check the time,
    budget, and scope of what is meant to be achieved.

    - **Agile metrics**: These types of metrics help us to check at frequent intervals
    if we are providing value or not. These can be achieved by including cycle times
    and velocity/speed metrics.

    - **Financial metrics**: These border around if the organization is truly increasing
    its financial value due to the results obtained from the analytics project. It
    is important to note that this might not be assessed only on completion but even
    after relevant milestones. Metrics such as these include revenue and cost metrics,
    return on investments, and so on.

    - **Organizational goals**: You want to constantly check if your project is impacting
    the organizational goals and meeting the satisfaction of the stakeholders.

    - **Software metrics**: In situations where the analytics project translates into
    software, you want to be sure if the quality of the software meets industry standards
    based on defect count, latency, and so on.

    - **Model performance metrics**: Depending on the type of models used for your
    analytics project, you need to evaluate them based on the appropriate evaluation
    technique, for example, using the root mean square error (`RMSE`), precision and
    recall, and so on.'
