  trans: '

    ### 建议、策略与计划


    分析完成后，需要将模型集成到运营系统中，并基于真实记录运行以产生决策或行动，从而部署模型。例如，可将模型应用于某电商企业现有客户的数据，相应的行动可能是“针对最可能流失的客户开展营销活动”。


    在提出这些建议并提供战略计划时，需要用分析流程的执行摘要来支撑你的建议，并重点关注拟议计划的商业价值。还需要不断将计划与投资回报率挂钩，尤其要结合分析项目的具体背景。在此阶段，需利用前几个步骤获得的洞察，制定行动计划——从高层战略到具体执行措施。你的战略将涉及根据分析创建若干备选行动方案，并说明每种方案的优缺点，以便利益相关方决定选择哪一个。


    ### 实施


    在实施阶段，分析结果将接受实时检验。实施的性质由你在上一步制定的战略决定。在此阶段，你需要监控在分析旅程第一步中为每个目标设定的成功指标。根据结果是否成功，你可能需要根据分析旅程中获得的经验教训对流程进行迭代。整个流程本质上具有迭代性。此外，实施后还需利用用户反馈迭代分析流程，以获得更好的分析结果和结果解读。此迭代中需要重复哪个阶段，由反馈的性质决定。在某些情况下，可能需要重新审视系统数据采集阶段，甚至数据分析阶段。


    ## 1.4 中小企业


    根据普华永道尼日利亚公司 Uyi Akpata 的一份报告³，中小微企业（微型、小型和中型企业）是经济增长的引擎，在促进发展、创造就业和出口等方面发挥着作用。根据世界银行的数据，中小微企业占全球所有企业的
    90%以上，并提供了全球超过 50%的就业岗位。在新兴经济体中，正规中小企业可贡献高达 40%的国民收入（GDP）。


    根据尼日利亚工业银行在普华永道³报告中的定义，可使用表 1-1 对中小企业进行界定。


    **表 1-1**

    中小企业定义


    | 企业类别指标 | 微型企业 | 小型企业 | 中型企业 |

    | --- | --- | --- | --- |

    | 员工人数 | <=10 | >11<=50 | >51<=200 |

    | 总资产（奈拉） | <=500 万 | >500 万<=1 亿 | >1 亿<=5 亿 |

    | 年营业额（奈拉） | <=2000 万 | <=1 亿 | <=5 亿 |


    同一份报告指出，中小企业当前面临的最紧迫问题是获取融资，其次是寻找客户。对于中小企业而言，寻找客户的任务主要通过营销分析、客户关系管理分析等方式完成，这占据了商业分析的绝大部分比重。


    ## 1.5 小企业中的商业分析


    迄今为止，已有部分中小企业从数据科学中受益，例如 Goodvine Group⁸等，但仍有大量潜力有待挖掘。中小企业同样可以通过解决与大型企业相同的挑战来受益于数据科学，这些挑战包括客户获取成本、客户流失、销售预测、物流或市场份额争夺；唯一的区别在于，这需要在资源更少的情况下完成。尽管小企业收集的数据量可能不及大型企业，但数据的多样性和产生速度通常相同。好在只要它们能够快速高效地利用数据，就有能力与同领域的大型竞争对手抗衡。有趣的是，小企业在最大化利用数据科学方面相比大企业的一个优势在于：它们无需庞大的数据科学团队就能从数据中获取价值。


    中小企业在应用数据科学提升收入时面临的主要问题包括：


    *数据收集量不足*：由于技术进步，小企业可获得海量数据，但缺乏有效收集和组织信息的数据系统。


    *数据集成困难*：为了确保分析的完整性和准确性，需要整合来自多个孤立来源的数据；目前这项工作多为手动完成，既耗时又繁琐。


    *数据质量与完整性缺失*：垃圾进，垃圾出。如果数据充满错误且无法反映问题的全貌（有时称为非对称数据），就无法从中获得准确的洞察。关于中小企业如何从商业分析中受益、面临的挑战及解决方案的更多细节，可参阅
    Coleman 等人（2008 年）的文献⁶。


    解决上述部分问题的主要方案是，无论企业规模多小，都要实施数据治理策略。数据治理是一套确保信息被有效且高效地利用，以帮助组织实现其目标的程序、职责、政策、标准和衡量方法⁷。小企业需要认识到，越早建立这套体系，就越能为已经到来的未来做好充分准备。

    '
- fmt: '# 1.6 Types of Analytics Problems in SME


    In this section, we try to highlight some types of questions SMEs can answer with
    data analytics and some suggested techniques that might help to explore such (Table
    [1-2](#532459_1_En_1_Chapter.xhtml#Tab2)). It is important to note that these
    questions are informed by the kind of business and the nature of the analytics
    goal at hand. Also sometimes, there might be a need to combine the techniques
    or use them as prerequisite to each other as demonstrated in the consulting business
    problem scenario in Chapters [9](#532459_1_En_9_Chapter.xhtml) and [10](#532459_1_En_10_Chapter.xhtml).
    It is also important to note that the answer to these questions can only yield
    the needed value when embedded in the analytics process described in Section [1.3](#532459_1_En_1_Chapter.xhtml#Sec3).


    **Table 1-2**

    SME Problems and Techniques


    | Questions | Suggested Techniques |

    | --- | --- |

    | • How does promotion embark my sales? | Time series forecasting |

    | • Who buys our products during promotions or who are our customers? • Which
    type of displays work better? • What products are selling together and what products
    are neutralizing each other? • How can we target our marketing and promotions
    and offer recommended products to customers? • How can we discover the most influential
    customers/prospect? • How can we know our employee efficiency? • What do we stock
    and how do we position them? | Association rule mining, network analysis, collaborative
    filtering |

    | • What are customers buying? • What are the categories of customers we have?
    | Clustering |

    | • Why are our sales dropping or declining? | Descriptive/exploratory analysis
    |

    | • How can we predict sales? • How can we predict the impact of discounts on
    sales? • How can we estimate the profit of a sales adventure, predict prices,
    etc.? • Which customer is going to buy or buy next? • How many purchases they
    are going to make? • How many of our customers will stay with us or leave? • How
    do we retain customers and target them in the right way? • How do we turn nonprofiting
    customers to more profiting ones or profiting to more profiting? • What do we
    store or discard? • When do we store or discard? • What is the correct price point
    that is maximizing sales? • What are the most profitable products? • How do we
    increase our customer base? | Classification and prediction techniques |


    ## 1.7 Analytics Tools for SMES


    Some of the analytics tools that small businesses can use are captured in Figure
    [1-3](#532459_1_En_1_Chapter.xhtml#Fig3), though there are still more. Some of
    these tools are available as open source and can be used for free, while some
    are not. As tempting as it may seem for businesses to want to opt for the free
    ones, it is important to find out what is obtainable on these platforms before
    settling for them. In this book, we primarily use `RapidMiner Studio` but also
    augment it with `RStudio` and `Gephi` in order to have a robust view to the analytics
    procedure. `RapidMiner Studio` was selected so as to appeal to nonprogramming
    Business Analytics audience, and `Gephi` is used for the network analysis to create
    beautiful and easy-to-interpret networks. It is also important to note that all
    the tools used in this book are open source (available for free download online).


    ![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig3_HTML.jpg)


    An illustration represents fourteen types of analytical tools icons used by subject
    matter experts.


    **Figure 1-3**

    Some analytics tools for SMEs


    ## 1.8 Road Map to This Book


    This book is divided into four major parts. Figure [1-4](#532459_1_En_1_Chapter.xhtml#Fig4)
    gives the overall structure of the book and where the topics in this book fit
    in. Chapter numbers are indicated beside the topic. Part 1 (Chapters [1](#532459_1_En_1_Chapter.xhtml)
    and [2](#532459_1_En_2_Chapter.xhtml)) explains the fundamental concepts explored
    in this book, such as data science, data science for business (Business Analytics),
    and what it takes to carry out any analytics project both generally and specifically
    for a small business. In this part, we also explore issues around data and how
    to manage and prepare it for the analytics project with practical examples. Part
    2 (Chapters [3](#532459_1_En_3_Chapter.xhtml) and [4](#532459_1_En_4_Chapter.xhtml))
    focuses on analytics consulting and explains how to navigate your way through
    to becoming successful in the data analytics consulting space. It also gives a
    detail of the phases involved in Business Analytics consulting. Part 3 (Chapters
    [5](#532459_1_En_5_Chapter.xhtml)–[8](#532459_1_En_8_Chapter.xhtml)) is focused
    on the data mining techniques common with small businesses, and this is expressed
    in an approach that first explains the basic concepts of these techniques in a
    simple way and then uses a real business problem scenario for the practical application.
    This part is practical oriented and based on case study problems experienced by
    small businesses. In this book, we will cover five different practical business
    problems. These business problems are covered in Chapters [5](#532459_1_En_5_Chapter.xhtml)–[8](#532459_1_En_8_Chapter.xhtml).
    The techniques used in the book demonstrate how to solve these problems. It is
    important to say here that despite using a particular problem as a case study,
    it is not only in this situation that the approach can be deployed, but it can
    be used in other similar problem scenarios. The techniques selected are based
    on their popularity in practice, and they fall under the broad category of prediction
    (predicting numerical outcome), classification (predicting categorical outcome),
    and descriptive analytics. Finally, Part 4 brings the consulting principles into
    practice by using an SME case study to model the already explained consulting
    phases in Part 2 and adopting the appropriate techniques among the ones explained
    in Part 3. Although each chapter stands alone, we advise that you read Part 1
    before proceeding to Part 3, and Part 2 before proceeding to Part 4.


    ![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig4_HTML.jpg)


    An illustration represents the organization of a book. It consists of four blocks
    marked as parts one, two, three, and four.


    **Figure 1-4**

    Road map to the book


    Since this book is practical based, the following is a guide to installation and
    a brief introduction to the softwares we will be using for the practical demonstration.


    ### Using RapidMiner Studio


    `RapidMiner Studio` is a comprehensive open source data mining tool that contains
    over 400 built-in data mining operators as well as a broad spectrum of visualization
    tools. It was started by Ralf Klinkenberg, Ingo Mierswa, and Simon Fischer at
    the University of Dortmund, Germany. Today, it is currently maintained by commercial
    company plus open source developers. It comes in two editions, the community edition
    which is free and the enterprise edition which is commercial. The documentation
    and installation guide for `RapidMiner` can be found at [`https://docs.rapidminer.com/`](https://docs.rapidminer.com/)`.`
    `RapidMiner Studio` can be downloaded directly from [`https://rapidminer.com/`](https://rapidminer.com/).
    Figure [1-5](#532459_1_En_1_Chapter.xhtml#Fig5) is the landing page after successfully
    downloading and installing the `RapidMiner Studio`.


    ![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig5_HTML.png)


    A screengrab of the first page of the installed Rapid Miner software.


    **Figure 1-5**

    Welcome to RapidMiner


    A detailed introduction to the `RapidMiner Studio` for first-time users can be
    found at [`https://docs.rapidminer.com/downloads/RapidMiner-v6-user-manual.pdf`](https://docs.rapidminer.com/downloads/RapidMiner-v6-user-manual.pdf).'
