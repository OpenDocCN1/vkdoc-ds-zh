    can be found in Section [8.8](#532459_1_En_8_Chapter.xhtml#Sec8) of this chapter.


    ## 8.6 Practical Business Problem V (Staff Efficiency)


    Collaboration networks have been used in people analytics to reduce employee overload,
    improve the resiliency of global teams, enhance career paths, and so on. The following
    are some of the metrics used in collaboration networks:


    *Network size*: Number of nodes attached to a node. In-degree (measure the number
    of nodes connected from other nodes) and out-degree (measure the number of nodes
    the particular node is connected to). This is captured by an average degree in
    Gephi.


    *Network strength*: Strong ties and weak ties. How weak or strong the in-degree
    or out-degree is. This can be captured by a weighted degree in Gephi.


    *Network range*: How many different types of people you are connected to. A high
    range network has the ability to get information from a variety of sources. This
    can be investigated by checking how many communities you belong to.


    *Network density*: Measures the degree of interaction between all members of a
    population and all other members. It is the overall interaction measure that measures
    how closely networked network members are. It is not calculated for each member.
    This is captured by Graph density in Gephi.


    Other metrics are as explained in Section [8.5](#532459_1_En_8_Chapter.xhtml#Sec5).


    In this problem scenario, we will use network analytics for people analytics,
    one of the major application types of Business Analytics. We will particularly
    be focusing on analyzing collaboration networks. In the problem scenario, we have
    an organization that is looking at improving the efficiency of its employees.
    Even though this could be done in several ways, we will explore the possibility
    of using a communication network of the employees of the organization and investigate
    performance using this network.


    In this problem scenario, the network data was collected via a survey and converted
    to a node (nodeslabelStaff.csv) and edge list (edgeslistStaff.csv), respectively.


    In this problem scenario, we are looking at the possibility of generating any
    or some of the following insights. Is the network good or bad, are people really
    doing what they are supposed to be doing in terms of collaboration, and so on?
    To do this, we will answer questions like: How do collaboration patterns vary?
    How do collaboration patterns matter for important outcomes? This can be explored
    with respect to Individuals, groups, or organizations.


    To answer the question, “How do collaboration patterns vary?”, we can use simple
    descriptive statistics; we can pick a network size, for example, and compare across
    individuals and compare changes over time. The result of this can be used for
    managing employees in the following areas: performance assessment, roles and responsibilities,
    pay and promotions, training and mentoring, job rotations and career development,
    and retention.


    To answer the question, “How do collaboration patterns matter for important outcomes
    we care about for our employees?”, first we should realize that there are different
    types of outcomes for individuals such as performance (sales per quarter, cost
    savings, self-reported 1–3 ratings, manager-reported 1–3 ratings, bonus), satisfaction,
    commitment, burnout, turnover, etc.


    In this practical example, we have chosen to use network size to examine performance.
    To do this, we will check the correlation between size and performance. For our
    case study, the performance data is captured in sales per quarter (measured in
    millions).


    **Practical demonstration**


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig44_HTML.png)


    A computer screenshot illustrates the result of successfully loading the edge
    list into Gephi and importing the nodeslabelStaff dot c s v file.


    Figure 8-41


    Importing edgeslistStaff.csv'
