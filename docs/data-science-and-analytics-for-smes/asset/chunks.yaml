    ## 7.7 逻辑回归


    逻辑回归基于一个将预测变量与结果联系起来的模型。可以使用少量数据来训练逻辑回归分类器，然后将其应用于大量新记录。当结果变量`Y`是分类变量时，逻辑回归扩展了线性回归的概念。


    根据其预测变量的值，逻辑回归可用于将类别未知的新记录分类到某个类别中（称为分类）。它还可用于发现区分不同类别中记录的特征（基于其预测变量轮廓或已知类别的数据中的预测变量），这称为特征分析（profiling）。


    当我们需要对客户进行分类（如回头客或非回头客）（分类）、寻找区分客户的特征（特征分析）等时，我们使用逻辑回归。我们可以使用逻辑回归来计算新记录落入某个类别的倾向，然后按倾向从高到低对记录进行排序，以便我们将精力集中在那些倾向最高的记录上。


    预测变量`x[1], x[2],......x[p]`可以是分类变量、连续变量，或两者的组合。


    **逻辑回归的步骤**


    1.  计算属于每个类别的倾向。

    2.  使用倾向的截断值将每条记录分类到其中一个类别。该记录被分配到具有最高概率的类别。


    与`KNN`一样，二分类器中的默认截断值为0.5。


    **逻辑回归模型**


    根据公式[6.7](#532459_1_En_6_Chapter.xhtml#Equ7)中的线性回归方程，我们可以将`p`表示为预测变量`(x[1], x[2]……x[p])`的线性函数：


    ![$$ Y={\beta}_0+{\beta}_1{X}_1+{\beta}_2{X}_2+{\beta}_3{X}_3+\dots \dots \dots
    +{\beta}_p{X}_p $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ8.png)


    (公式 7.8)


    相反，逻辑回归使用预测变量的非线性函数，形式为：


    ![$$ p=\frac{1}{1+{e}^{-\left({\beta}_0+{\beta}_1{x}_1+{\beta}_2{\beta x}_2+\dots
    +{\beta}_q{\beta x}_q\right)}} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ9.png)


    (公式 7.9)


    这就是所谓的逻辑响应函数。对于任何值`x[1]...x[q]`，右侧的结果将始终落在[0；1]之间。


    **优势比（Odds）** 是衡量属于特定类别的指标。属于类别1的概率与属于类别0的概率之比，被定义为属于类别1的优势比。我们也可以进行反向计算。如果我们知道优势比，就可以使用公式[7.9](#532459_1_En_7_Chapter.xhtml#Equ9)计算事件的概率。如果我们反向计算概率，会得到以下结果：


    ![$$ Odds\left(Y=1\right)=\frac{p}{1-p} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ10.png)


    (公式 7.10)


    例如，如果获胜的概率为0.5，则获胜的优势比为0.5 / 0.5 = 1，即属于类别1的概率除以属于类别0的概率。我们可以执行反向计算；如果我们知道优势比，可以通过修改公式[7.10](#532459_1_En_7_Chapter.xhtml#Equ10)来计算事件的概率。由此得到公式[7.11](#532459_1_En_7_Chapter.xhtml#Equ11)。


    ![$$ p=\frac{odds}{1+ odds} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ11.png)


    (公式 7.11)


    我们可以通过将公式[7.9](#532459_1_En_7_Chapter.xhtml#Equ9)代入公式[7.11](#532459_1_En_7_Chapter.xhtml#Equ11)来描述优势比与预测变量之间的关系，例如：


    ![$$ Odds\left(Y=1\right)={e}^{\beta_0+{\beta}_1{x}_1+{\beta}_2{x}_2+\dots +{\beta}_q{x}_q}
    $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ12.png)


    (公式 7.12)


    现在，我们可以通过在等式两边取自然对数²，推导出逻辑模型的标准形式。'
