- fmt: "**Monetary**: Also referred to as “monetary value,” this factor reflects how\
    \ much a customer has spent with the brand during a particular period of time.\n\
    \nFigure [10-13a](#532459_1_En_10_Chapter.xhtml#Fig14) is an example of an RFM\
    \ segmentation. The figure is a 3D visualization of the clusters generated from\
    \ an RFM segmentation. One of the interpretations from Figure [10-13a](#532459_1_En_10_Chapter.xhtml#Fig14)\
    \ reveals that some customers have not spent a lot of money but frequently visit\
    \ the business website and have made recent purchases of high value.\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig14_HTML.png)\n\
    \nAn image depicts a 3 Dimensional scatterplot for R F M segmentation with the\
    \ axes x, z, and y, labeled as frequency, recency, and monetary.\n\n**Figure 10-13a**\
    \ 3D visualization of RFM segmentation⁴ ([`https://miro.medium.com/max/1400/1*_uQS11qVzIv4rTNDPM6Rqw.png`](https://miro.medium.com/max/1400/1*_uQS11qVzIv4rTNDPM6Rqw.png))\n\
    \nTo perform customer segmentation using the RFMT (Recency Frequency Monetary\
    \ Tenure) approach, the spreadsheet data must be transformed to RFMT data. The\
    \ following tips can help:\n\n1.  Create a unique identification for each customer.\n\
    2.  For a given ID, the RFMT values of the corresponding customer can be calculated\
    \ from the other fields.\n    - All product expenses from the same customer are\
    \ accumulated as the monetary (`M`) value.\n    - The number of times the same\
    \ customers bought is counted as the frequency (`F`) value.\n    - Time-lapse\
    \ from the customer’s most recent purchase to the crawling date was calculated\
    \ as the recency (`R`) value. In this scenario, we use days as units of time;\
    \ when days span several years, it could be used as months or years.\n    - The\
    \ fourth variable, interpurchase time (`T`), measures the average time gap between\
    \ consecutive shopping trips. If the first and the last purchase dates of a customer\
    \ are denoted as `T[1]` and `T[n]`, respectively, the customer’s holistic shopping\
    \ cycle (`L`) can be approximated by the months between `T[1]` and `T[n]`, and\
    \ thus the `T` value (in month) can be calculated as follows:\n\n`T = L / (F −\
    \ 1) = (T[n] − T[1]) / (F − 1)` (1).\n\nTo calculate `T`, only customers who made\
    \ at least two purchases (i.e., `F ≥ 2`) in the given period were considered.\
    \ This resulted in the data named `*RFMFoodAgric.xlsx*`.\n\n**Table 10-1** Four\
    \ Tiers for Each Dimension\n\n| Recency | Frequency | Monetary |\n| --- | ---\
    \ | --- |\n| R-Tier-1 (most recent) | F-Tier-1 (most frequent) | M-Tier-1 (highest\
    \ spend) |\n| R-Tier-2 | F-Tier-2 | M-Tier-2 |\n| R-Tier-3 | F-Tier-3 | M-Tier-3\
    \ |\n| R-Tier-4 (least recent) | F-Tier-4 (only one transaction) | M-Tier-4 (lowest\
    \ spend) |\n\nThe RFMT values obtained in step b are then used to divide the customers\
    \ into four tiers for each dimension, such that each customer will be assigned\
    \ to one tier in each dimension as seen in Table [10-1](#532459_1_En_10_Chapter.xhtml#Tab1).\
    \ This resulted into the data named `*FinalRFM.xlsx*` (though this data has about\
    \ five tiers instead of four as in Table [10-1](#532459_1_En_10_Chapter.xhtml#Tab1)).\n\
    \nIt is possible to use the results of RFM segmentation to target certain groups\
    \ of clients depending on the RFM segments in which they appear. Groups like best\
    \ customers are examples of this type of consumer (customers who are found in\
    \ R-Tier-1, F-Tier-1, and M-Tier-1, meaning that they transacted recently, do\
    \ so often, and spend more than other customers).\n\n- **High-spending new customers**:\
    \ Customers in 1-4-1 and 1-4-2. These are consumers that have only transacted\
    \ once, but very recently, and have spent a significant amount of money.\n- **Lowest-spending\
    \ active loyal customers**: Customers in segments 1-1-3 and 1-1-4 make up this\
    \ group. They transacted recently and do so often, but spend the least.\n- **Churned\
    \ best customers**: Customers in groups 4-1-1, 4-1-2, 4-2-1, and 4-2-2. They used\
    \ to transact frequently and spend a lot of money, but they haven't done so in\
    \ a long time.\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig15_HTML.png)\n\
    \nA screenshot of a bar graph depicts frequency versus count. The bar plotted\
    \ in different frequencies in 1, 3, 5, 2, and 4. The frequency one has the highest\
    \ value.\n\n**Figure 10-13b** Bar chart for the frequency\n\n1.  Import the data\
    \ named `*FinalRFM.xlsx*`, check the statistics, and make sure there is no missing\
    \ data. Change the type of all the RFMT attributes to polynominal.\n2.  Visualize\
    \ the data using a bar chart to see that the RFMT categories have fair data distribution.\
    \ Figure [10-13b](#532459_1_En_10_Chapter.xhtml#Fig15) is an example.\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig16_HTML.png)\n\
    \nA screenshot depicts a line graph that plots the values for different frequencies\
    \ such as 0, 1, 2, 3, and 4. The line has fluctuating trends.\n\n**Figure 10-14**\
    \ Clusters discovered\n\n3.  Figure [10-14](#532459_1_En_10_Chapter.xhtml#Fig16)\
    \ is the final cluster visualization for the RFMT modeling, when `k` is equal\
    \ to 4, for example.\n4.  Based on the clusters discovered and the tiers used\
    \ for the RFMT data, we can profile the clusters. The final step in RFM segmentation\
    \ is to customize communications for each of the discovered clusters of customers.\n\
    \n### Strategic market target\n\nThe goal here is to prescribe the optimal cluster\
    \ in the external data to target for marketing using prescriptive analytics. We\
    \ will use the thinking backward approach for this assignment. This approach consists\
    \ of the following steps:\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig17_HTML.jpg)\n\
    \nAn illustration depicts two circles labeled internal and external segmentation,\
    \ links the two together, and constructs options.\n\n**Figure 10-15** High-level\
    \ conceptual design\n\n1.  **Start with the decision we want to make**: In this\
    \ project, we need to choose an actionable customer acquisition strategy out of\
    \ the following available options.\n    - Increase customer base by acquiring\
    \ as many customers as possible, no matter what kind of customers they are, with\
    \ the hope of retaining them for high future revenue.\n    - Increase customer\
    \ base by acquiring only few premium customers (due to low marketing budget).\n\
    \    - Increase customer base by acquiring many high profit customers (best-case\
    \ scenario).\n2.  **Determine what analysis outputs would help make that decision**:\
    \ The analysis output we are expecting is to have one or two slides that describe\
    \ each option in step 1 and the summary that compares each option based on key\
    \ metrics (available in the data). We will also explain how we arrived at the\
    \ conclusions. Note that this procedure leverages on having the same attributes\
    \ in internal and external data. In some situations, this might not be possible,\
    \ but there are third parties that can help with external segmentation to overcome\
    \ this.\n3.  **Design the analysis that creates those outputs**: Figure [10-15](#532459_1_En_10_Chapter.xhtml#Fig17)\
    \ is a high-level conceptual design of the approach. The aim is to segment the\
    \ internal data and also segment the external data. After that, we will now link\
    \ the two together and construct options which will help to maximize the business\
    \ decisions in step 1. The intention is to use internal data to describe the characteristics\
    \ of the current customer base and the historical performance of these segments\
    \ (e.g., total profit made from the customers). We will follow this up by describing\
    \ the external customer characteristics and use these to determine what the acquisition\
    \ opportunity is for each segment.\n- Start with the decision we want to make.\n\
    - Determine what analysis outputs would help make that decision.\n- Design the\
    \ analysis that creates those outputs.\n- Determine what data is needed for analysis\
    \ and how to get it.\n- Execute the analysis.\n- Display and present the result."
