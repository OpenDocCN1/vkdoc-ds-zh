- fmt: "# 8.1 Clustering\n\nClustering is an unsupervised machine learning approach\
    \ that aims to segment data into similar groups of records to gain insight. Cluster\
    \ analysis is a method that forms clusters of records by calculating the distance\
    \ between these records. Clustering is applied in business² in various ways which\
    \ include categorizing clients based on demographic and transaction history information\
    \ and then tailoring a marketing plan for each category. It can also be used to\
    \ create segments for customers and give them identities called “personas” to\
    \ help focus energy on sales. It is also used in market structure analysis to\
    \ find groups of comparable products based on competitive similarity measurements.\n\
    \nThere are two popular clustering approaches:⁴\n\n1. **Hierarchical method**:\
    \ This has to do with arranging clusters into a natural hierarchy; hierarchical\
    \ approaches are extremely useful. These methods are agglomerative or divisive\
    \ in nature.\n\n2. **Nonhierarchical method**: The `k-means` algorithm is an example\
    \ of such a technique. `K` signifies that the algorithm assigns records to each\
    \ cluster based on a predetermined number of clusters. Because it is less computationally\
    \ costly, thus it’s better for big data.³\n\nRegardless of whether the clustering\
    \ approach is hierarchical or nonhierarchical, two sorts of distances must be\
    \ defined: distance between records and distance between two clusters in the dataset\
    \ used. In addition, there is a range of metrics that can be employed for these\
    \ distances in both methods.\n\nIt is necessary to keep in mind the following\
    \ while measuring the distance between two records:\n\n- The distance should not\
    \ be negative.\n- There should be no distance between a record and itself (0).\n\
    - The distance between `i` and `j` must be equal to the distance between `j` and\
    \ `i`.\n- Any pair’s distance cannot exceed the total of the distances of the\
    \ other two pairings.\n\nThe measures used for the distance between two records\
    \ (numerical data) include the following:\n\n- **Euclidean distance**: This type\
    \ of measure requires the normalization of continuous measurements before computing.\
    \ A different distance (such as the statistical distance) is also recommended\
    \ if the measurements are highly correlated. Outliers can make Euclidean distance\
    \ skewed. For Euclidean distance, outliers are either deleted or more robust distances\
    \ like Manhattan distances are used.\n- **Correlation-based similarity**.\n- **Statistical\
    \ distance** which is also referred to as Mahalanobis distance.\n- **Manhattan\
    \ distance** (“city block”).\n- **Maximum coordinate distance**.\n\nFor more information\
    \ on the preceding list, check Han et al. (2012).\n\nSimilarity measures are more\
    \ intuitively appealing than distance measures for measuring the distance between\
    \ two records having categorical data with binary values. In this case, the matching\
    \ coefficient and Jaccard’s coefficient are the most helpful similarity measurements.\
    \ For measuring the distance between two records, categorical data and mixed data\
    \ (some continuous and some binary), a similarity coefficient suggested by Gower\
    \ is very useful.⁵\n\nWhen measuring the distance between two clusters, the following\
    \ definitions are important:\n\n- **Minimum distance**: The distance between the\
    \ two clusters’ closest pair of records, one record in each cluster.\n- **Maximum\
    \ distance**: The distance between the two records that are the farthest apart.\n\
    - **Average distance**: The average distance between any two records.\n- **Centroid\
    \ distance**: Centroid linkage clustering is based on centroid distance, in which\
    \ groups are represented by their mean values for each variable, forming a vector\
    \ of means. The distance between these two vectors determines the distance between\
    \ two clusters.\n\nIt is good for clusters to be well separated; the more separated,\
    \ the more homogenous groups we have, so these distances help us to see this separation\
    \ clearly.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig1_HTML.png)\n\n\
    A figure of two well-separated clusters in two dimensions. The minimum distance,\
    \ maximum distance, and centroid distance between them are marked in the figure.\n\
    \n**Figure 8-1**  \nA two-dimensional illustration of various distance metrics\
    \ between two clusters: (a) minimum distance, (b) centroid distance, and (c) maximum\
    \ distance"
  raw: '## 8.1 Clustering


    Clustering is an unsupervised machine learning approach that aims to segment data
    into similar groups of records to gain insight. Cluster analysis is a method that
    forms clusters of records by calculating the distance between these records. Clustering
    is applied in business² in various ways which include categorizing clients based
    on demographic and transaction history information and then tailoring a marketing
    plan for each category. It can also be used to create segments for customers and
    give them identities called “personas” to help focus energy on sales. It is also
    used in market structure analysis to find groups of comparable products based
    on competitive similarity measurements.


    There are two popular clustering approaches:⁴


    1.  *Hierarchical method*: This has to do with arranging clusters into a natural
    hierarchy; hierarchical approaches are extremely useful. These methods are agglomerative
    or divisive in nature.


    2.  *Nonhierarchical method*: The k-means algorithm is an example of such a technique.
    K signifies that the algorithm assigns records to each cluster based on a predetermined
    number of clusters. Because it is less computationally costly, thus it’s better
    for big data.³


    Regardless of whether the clustering approach is hierarchical or nonhierarchical,
    two sorts of distances must be defined: distance between records and distance
    between two clusters in the dataset used. In addition, there is a range of metrics
    that can be employed for these distances in both methods.


    It is necessary to keep in mind the following while measuring the distance between
    two records:


    *   The distance should not be negative.


    *   There should be no distance between a record and itself (0).


    *   The distance between i and j must be equal to the distance between j and i.


    *   Any pair’s distance cannot exceed the total of the distances of the other
    two pairings.


    The measures used for the distance between two records (numerical data) include
    the following:


    *   *Euclidean distance*: This type of measure requires the normalization of continuous
    measurements before computing. A different distance (such as the statistical distance)
    is also recommended if the measurements are highly correlated. Outliers can make
    Euclidean distance skewed. For Euclidean distance, outliers are either deleted
    or more robust distances like Manhattan distances are used.


    *   Correlation-based similarity.


    *   Statistical distance which is also referred to as Mahalanobis distance.


    *   Manhattan distance (“city block”).


    *   Maximum coordinate distance.


    For more information on the preceding list, check Han et al. (2012).


    Similarity measures are more intuitively appealing than distance measures for
    measuring the distance between two records having categorical data with binary
    values. In this case, the matching coefficient and Jaccard’s coefficient are the
    most helpful similarity measurements. For measuring the distance between two records,
    categorical data and mixed data (some continuous and some binary), a similarity
    coefficient suggested by Gower is very useful.⁵


    When measuring the distance between two clusters, the following definitions are
    important:


    *   *Minimum distance*: The distance between the two clusters’ closest pair of
    records, one record in each cluster.


    *   *Maximum distance*: The distance between the two records that are the farthest
    apart.


    *   *Average distance*: The average distance between any two records.


    *   *Centroid distance*: Centroid linkage clustering is based on centroid distance,
    in which groups are represented by their mean values for each variable, forming
    a vector of means. The distance between these two vectors determines the distance
    between two clusters.


    It is good for clusters to be well separated; the more separated, the more homogenous
    groups we have, so these distances help us to see this separation clearly.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig1_HTML.png)


    A figure of two well-separated clusters in two dimensions. The minimum distance,
    maximum distance, and centroid distance between them are marked in the figure.


    Figure 8-1


    A two-dimensional illustration of various distance metrics between two clusters:
    (a) minimum distance, (b) centroid distance, and (c) maximum distance'
  trans: "\n# 8.1 聚类分析\n\n聚类是一种无监督机器学习方法，旨在将数据划分为相似的记录组以获取洞察。聚类分析通过计算记录间的距离来形成记录簇。聚类在商业²中有多种应用方式，包括根据人口统计和交易历史信息对客户进行分类，然后为每个类别制定营销计划。它还可用于创建客户细分，并赋予其称为\"\
    用户画像\"的身份标识，从而帮助集中销售精力。此外，在市场竞争结构分析中，它可用于基于竞争相似性度量寻找同类产品群。\n\n目前有两种主流的聚类方法：⁴\n\
    \n1. **层次方法**：涉及将簇排列成自然层级结构，这类方法极具实用性。这些方法本质上可分为凝聚式或分裂式。\n\n2. **非层次方法**：`k-means`算法是此类技术的代表。`K`表示算法根据预设的簇数量将记录分配到各簇中。由于其计算成本较低，因此更适合大数据处理。³\n\
    \n无论采用层次还是非层次聚类方法，都必须定义两种距离：记录间的距离以及数据集中两个簇之间的距离。此外，这两种方法均可采用一系列度量指标来计算这些距离。\n\
    \n在测量两个记录之间的距离时，需谨记以下几点：\n\n- 距离值不得为负。\n- 记录与自身距离应为零（0）。\n- 记录`i`与`j`之间的距离必须等于记录`j`与`i`之间的距离。\n\
    - 任意两记录间的距离不得超过另外两对距离之和。\n\n用于测量两个数值型记录之间距离的度量包括：\n\n- **欧几里得距离**：该度量要求在计算前对连续测量值进行标准化处理。若测量值高度相关，则建议使用其他距离度量（如统计距离）。异常值会导致欧几里得距离产生偏差。对于欧几里得距离，要么剔除异常值，要么使用更稳健的距离度量如曼哈顿距离。\n\
    - **基于相关性的相似度**。\n- **统计距离**，也称马氏距离。\n- **曼哈顿距离**（\"城市街区距离\"）。\n- **最大坐标距离**。\n\
    \n关于上述距离的更多信息，可参考 Han 等 (2012) 的文献。\n\n对于包含二元分类数据的记录，相似度度量在直观上比距离度量更具吸引力。在此情况下，匹配系数和杰卡德系数是最有用的相似度度量。对于包含分类数据和混合数据（部分连续、部分二元）的记录间距离测量，Gower\
    \ 提出的相似度系数非常实用。⁵\n\n在测量两个簇之间的距离时，以下定义至关重要：\n\n- **最小距离**：两个簇中最接近的一对记录（每个簇中取一个记录）之间的距离。\n\
    - **最大距离**：两个簇中相距最远的两个记录之间的距离。\n- **平均距离**：任意两个记录之间的平均距离。\n- **质心距离**：质心链接聚类基于质心距离，其中各组由其各变量的均值表示，形成均值向量。这两个向量之间的距离决定了两个簇之间的距离。\n\
    \n理想的簇之间应具有良好分离度；分离度越高，得到的组内均质性越强，因此这些距离度量有助于清晰观察这种分离状态。\n\n![](img/532459_1_En_8_Fig1_HTML.png)\n\
    \n二维空间中两个良好分离簇的示意图。图中标注了它们之间的最小距离、最大距离和质心距离。\n\n**图 8-1**  \n两个簇之间多种距离度量的二维示意图：(a)\
    \ 最小距离，(b) 质心距离，(c) 最大距离"
- fmt: "## 8.2 K-Means\n\n`k-means`算法将样本划分为预先定义的`k`个分离良好（无重叠）的簇，目的是使这些簇在采用的度量标准（例如，图[8-1](#532459_1_En_8_Chapter.xhtml#Fig1)）上具有相似性。记录与其簇质心之间的总距离（或欧几里得距离平方和）是衡量簇内离散度的常用指标。`k-means`算法如图[8-2](#532459_1_En_8_Chapter.xhtml#Fig2)所示。\n\
    \n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig2_HTML.png)\n\n一张包含四个步骤的`K-means`算法示意图，用于创建用户指定数量的簇。\n\
    \n图 8-2\n`K-means`聚类算法\n\n**如何确定k**\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig3_HTML.png)\n\
    \n三个图表展示了如何使用肘部法、轮廓系数法和间隙统计法来确定样本中的最佳簇数。\n\n图 8-3\n比较三种直接确定最佳k值方法的结果\n\n1.  `K`可以通过外部因素确定，例如先验知识、领域知识以及业务环境中呈现的一些约束条件。\n\
    2.  你可以尝试不同的`k`值并比较得到的距离。簇内成员间的距离要小，而不同簇之间的距离要大。\n3.  也可以通过直接方法确定`k`，这些方法优化某个准则，例如簇内平方和或平均轮廓系数。这些方法包括*间隙统计*法；此外还有超过30种其他指标。图[8-3](#532459_1_En_8_Chapter.xhtml#Fig3)演示了使用其中三种方法，之后我们进行投票。基于图[8-3](#532459_1_En_8_Chapter.xhtml#Fig3)，答案介于4（肘部法）和2（轮廓系数法）之间；为了做出决定，你必须尝试其他几种指标，获得最高投票数的簇数获胜。\n\
    \n**验证簇**\n\n找到有意义的簇是聚类分析的一个关键目标。以下步骤可以帮助你实现这一目标：\n\n1.  *簇的可解释性*：得到的簇的解释是否合理？探究每个簇的属性以解释这些簇。你可以通过以下方式做到这一点：\n\
    \    1.  分析聚类分析的结果，为每个簇的度量得出汇总统计量（例如平均值、最小值和最大值）。\n    2.  检查簇是否沿着某个从聚类分析中省略的共同特征（变量）分离。\n\
    \    3.  给簇打标签。在此步骤中，我们将根据对数据的理解为不同的簇命名和标记。\n2.  *簇的稳定性*：如果某些输入发生变化，簇的分配是否会受到很大影响？\n\
    3.  *簇的分离度*：通过检查簇间变异与簇内变异的比率来确定分离是否合理。这正是我们需要簇间距离的地方。内部有效性度量关注的是簇中包含的信息以及数据点相对于这些簇的排列方式。为了获得良好的聚类效果，一个簇中的所有点彼此靠近是很重要的。同时，簇之间彼此分离、区别明显也很重要。内部有效性所使用的度量包括：\n\
    \    *   平均质心内距离\n    *   簇的密度\n    *   基于平方和的项分布\n    *   Davies-Bouldin指数\n\
    4.  *簇的数量*：生成的簇的数量必须与分析目标相关。此处使用外部有效性度量将聚类算法创建的簇与先前已知的簇进行比较。要在现实场景中做到这一点，模型开发和测试需要专家的输入，他们将提供簇。用于外部有效性的度量包括：\n\
    \    *   Rand指数⁷\n    *   调整后的Rand指数⁶\n    *   Jaccard指数⁸\n    *   Fowlkes-Mallows指数⁸\n\
    5.  此外还有基于密度的方法（例如，相似性度量）。\n\n更多关于簇的内容，请查阅 Han 等人 (2012) 的著作。\n\n**解释簇**\n\n*\
    \   我们查看簇质心以确定所生成簇的特征。\n*   此外，我们可以查看哪些变量最有效地区分这些簇。\n*   我们还可以研究关于簇内离散度的信息。\n\
    *   使用簇质心之间的欧几里得距离，我们可以确定各个簇相隔多远。\n\n**为目标营销目的解释簇**\n\n一旦我们对众多客户形象有了清晰的了解，我们就可以针对每个形象的独特偏好定制我们的营销互动，即将新发现的客户形象与最适合每个形象的营销互动联系起来。这些互动应该量身定制，以满足每个特定形象的独特需求、愿望和偏好。"
  raw: "## 8.2 K-Means\n\nThe k-means algorithm divides the sample into a predefined\
    \ number k of well-separated (no overlaps) clusters with the purpose of making\
    \ these clusters similar in terms of the measures adopted (e.g., Figure [8-1](#532459_1_En_8_Chapter.xhtml#Fig1)).\
    \ The total distance (or sum of squared Euclidean distances) between records and\
    \ their cluster centroid is a commonly used metric of within-cluster dispersion.\
    \ The k-means algorithm is expressed in Figure [8-2](#532459_1_En_8_Chapter.xhtml#Fig2).\n\
    \n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig2_HTML.png)\n\nAn image of\
    \ the K-means algorithm consisting of four steps to create a user-defined number\
    \ of clusters.\n\nFigure 8-2\n\nK-means clustering algorithm\n\n**How to determine\
    \ k**\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig3_HTML.png)\n\nThree\
    \ graphs illustrate the use of the elbow method, silhouette method, and gap statistic\
    \ method to determine the optimal number of clusters in a sample.\n\nFigure 8-3\n\
    \nComparing the results of three direct methods to determine the best k\n\n1.\
    \  K can be determined by external considerations such as previous or domain knowledge\
    \ and some constraints presented in the business environment.\n\n2.  You can try\
    \ different k and compare the resulting distance. The distance with cluster members\
    \ has to be small, and the distance between different clusters has to be large.\n\
    \n3.  K can also be determined by direct methods that optimize a criterion, such\
    \ as the within-cluster sums of squares or the average silhouette. These methods\
    \ include *gap statistic* methods; there are more than 30 other indices. Figure\
    \ [8-3](#532459_1_En_8_Chapter.xhtml#Fig3) demonstrates using three of these methods\
    \ after which we take a vote. Based on Figure [8-3](#532459_1_En_8_Chapter.xhtml#Fig3),\
    \ the answer is between 4 (elbow) and 2 (silhouette); to make your decision, you\
    \ have to try several other indices, and the number of clusters with the highest\
    \ vote wins.\n\n**Validating clusters**\n\nFinding meaningful clusters is a key\
    \ goal of cluster analysis. The following steps can assist you in accomplishing\
    \ this:\n\n1.  *Cluster interpretability*: Is the interpretation of the clusters\
    \ that resulted reasonable? Explore the properties of each cluster to interpret\
    \ the clusters. You can do this by doing the following:\n    1.  Analyze the results\
    \ of the cluster analysis to derive summary statistics (such as averages, minimums,\
    \ and maximums) for each cluster’s measurement.\n\n2.  Examine the clusters for\
    \ separation along with some common feature (variable) that was omitted from the\
    \ cluster analysis.\n\n3.  Label the clusters. In this step, we’re going to name\
    \ and label the different clusters depending on our understanding of the data.\n\
    \n2.  *Stability of the cluster*: Are cluster assignments affected greatly if\
    \ some of the inputs are changed?\n\n3.  *Cluster separation*: Determine whether\
    \ the separation is fair by examining the ratio of between-cluster variation to\
    \ within-cluster variation. This is where we need the distance between clusters.\
    \ Internal validity measurements are concerned with the information included in\
    \ the clusters and the arrangement of data points with regard to them. It is important\
    \ that all the points in a cluster are close to one another in order to have good\
    \ clustering. It is also important that clusters are well separated and distinct\
    \ from one another. The validity measures used in internal validity include the\
    \ following:\n    *   Average within centroid distance\n\n*   The density of clusters\n\
    \n*   Distribution of items by sum of squares\n\n*   Davies-Bouldin index\n\n\
    4.  *Number of clusters*: The number of clusters generated must be relevant to\
    \ the goal of the analysis. External validity measures are used here to compare\
    \ the clusters created by the clustering algorithm with previously known clusters.\
    \ To do this in real-world scenarios, model development and testing require input\
    \ from experts who will have to provide the clusters. The measures used for external\
    \ validity include\n    *   Rand index⁷\n\n*   Adjusted Rand index⁶\n\n*   Jaccard\
    \ index⁸\n\n*   Fowlkes-Mallows index⁸\n\n5.  There is also a density-based approach\
    \ (e.g., similarity measure).\n\nFor more on clusters, please check Han et al.\
    \ (2012).\n\n**Interpreting** **the clusters**\n\n*   We look at the cluster centroids\
    \ to determine the characteristics of the generated clusters.\n\n*   In addition,\
    \ we can see which variables are most effective at distinguishing the clusters.\n\
    \n*   We can also study the information about the within-cluster dispersion.\n\
    \n*   Using the Euclidean distance between the clusters’ centroids, we can determine\
    \ how far apart the clusters are.\n\n**Interpreting the clusters for** **target\
    \ marketing purpose**\n\nAs soon as we have a clear picture of the numerous client\
    \ personas, we can tailor our marketing interactions to each persona’s unique\
    \ preferences, that is, linking the newly found client personas to the most appropriate\
    \ marketing interactions for each of them. These interactions should be tailored\
    \ to meet the unique requirements, wants, and preferences of each individual persona."
