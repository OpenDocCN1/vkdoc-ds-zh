  trans: "\n# 性能向量截图的均方根误差为 1307.861，误差范围为 ±0.000。\n\n# 图 6-21b\n\n## 评估神经网络\n\n从图\
    \ 6-21b 可以看出，针对此问题场景所比较的三个算法中，神经网络得出的结果最佳。\n\n![](img/532459_1_En_6_Fig29_HTML.png)\n\
    \n一个示例集截图显示了 18 行 14 列的数据，涉及价格、预测价格、燃料类型、车龄、行驶里程、马力、金属漆颜色、自动挡和排量。\n\n# 图 6-21c\n\
    \n## 结果数据集\n\n图 6-21c 是使用 40% 验证数据集进行评估，并将预测结果与验证数据集中的原始价格进行比较的输出结果。\n\n![](img/532459_1_En_6_Fig30_HTML.png)\n\
    \n一个流程截图中包含以下步骤：检索丰田、设置角色、名义值转数值、验证、分组模型和应用模型。左下角的“检索丰田”步骤指向“应用模型”步骤。\n\n# 图 6-22a\n\
    \n## 预测新数据（神经网络）\n\n1.  对于神经网络，我们将使用图 6-22a（主流程）和图 6-22b（内部流程）中的设置来预测新记录。\n\n\
    ![](img/532459_1_En_6_Fig31_HTML.png)\n\n一个流程验证截图左侧有一个神经网络，连接到右侧的“测试”选项卡，指向“应用模型\
    \ 2”，随后指向“性能”。\n\n# 图 6-22b\n\n## 预测新数据的内部流程\n\n1.  图 6-22b 是您通过双击 `Split Validation`（分割验证）运算符创建的内部流程。`Neural\
    \ Net`（神经网络）、`Apply Model`（应用模型）和 `Performance (Regression)`（性能（回归））运算符保持与之前一样的默认设置。\n\
    \n![](img/532459_1_En_6_Fig32_HTML.png)\n\n一个示例集截图显示了 9 行 12 列的数据，包含预测价格、燃料类型、车龄、行驶里程、马力、金属漆颜色、自动挡、排量和车门数。\n\
    \n# 图 6-23\n\n## 结果数据集\n\n1.  新加载数据的预测价格如图 6-23 所示。\n\n## 6.7 关于销售预测的结论\n\n在尝试了多种数据属性与算法的组合并检查最佳性能后，需要确定将采用哪个实验来得出结论。在本例中，我们假设已经妥善处理了过拟合等问题，因此会选择能给出最佳预测的算法。从图\
    \ 6-24 可以看出，误差最低（即 RMSE 值最小）的算法是神经网络。\n\n![](img/532459_1_En_6_Fig33_HTML.jpg)\n\
    \n一个截图显示了 MLR（多元线性回归）、RT（回归树）和 NN（神经网络）的均方根误差值。数值分别为 2949.808、1362.617 和 1307.861（±0.000）。\n\
    \n# 图 6-24\n\n## 比较三种算法的结果\n\n在商业应用中，这些模型可以有多种使用方式。例如，可以将其嵌入到一个应用程序中，该程序能够实时呈现丰田卡罗拉（Toyota\
    \ Corolla）的预测流程，用于辅助针对新客户及其他方面做出决策。\n\n## 6.8 练习题\n\n1.  使用图 6-11 中的 MLR（多元线性回归）模型，写出回归方程，预测具有以下属性值的交易：\n\
    \n`Age_08_04=29`，`KM=50000`，`Fuel_Type=Petrol`，`HP=100`，`Met_Color=0`，`Automatic=1`，`CC=1800`，`Doors=4`，`Quarterly_Tax=80`，`Weight=1170`\n\
    \n2.  为了使用第 6.5 节中的神经网络解决销售问题，请使用直方图探索每个数值变量。对于任何偏态分布的变量，先使用对数变换，然后再进行归一化。再次运行第\
    \ 6.5 节中的神经网络模型，并将您的结果与第 6.5 节中的结果进行比较。哪个模型的准确率更高？\n\n3.  给定名为 `FoodAgricGroup.xlsx`\
    \ 的数据样本，针对下列列出的每个算法，创建并评估模型以预测总金额（目标属性）。哪个模型给出的准确率最高？\n    1.  神经网络\n    2.  多元线性回归\n\
    \    3.  回归树\n\n请就以下阶段详细展示每个算法所得出的结果：\n\n1.  数据可视化\n2.  特征选择\n3.  模型开发\n4.  模型评估\n\
    \n# 7. 分类技术\n\n在本章中，尽管存在多种分类技术，但我们将探讨业务领域中用于分类的流行技术。为此，我们将使用第三个商业问题，该问题围绕客户忠诚度展开，并采用神经网络、分类树和随机森林算法。在解决这个问题时，我们特别关注如何为我们的中小企业获取并留住更多客户。我们还将介绍一些其他基于分类的技术，例如\
    \ K 近邻和逻辑回归。在运用这些技术解决问题时，我们解释所选算法的基本概念，并以此演示如何将这些解决问题的过程应用于实际的商业场景。\n"
- fmt: '# 7.1 Classification Models and Evaluation


    An important part of data analysis is the process of classifying the data that
    has been collected. Classification is a type of supervised machine learning approach
    that derives models used in this type of situations. This type of model is known
    as a classifier, and it is used to predict categorical (discrete, unordered) class
    labels. A typical example is to predict if a customer will leave a retail store.
    Classification models have been used for several applications in business such
    as fraud detection, customer target marketing, staff performance prediction, and
    so on. Classification models work using a two-step process. The first is to construct
    the model from a labeled dataset (training data). The second is to use the model
    to classify future unknown objects (in the validation dataset, which is known
    but predicted using the newly developed model). In this step, we estimate the
    accuracy of the model by comparing the result with the original label (known)
    in the validation dataset. The validation dataset is independent of the training
    set; otherwise, overfitting will occur.


    In classification, oversampling occurs when classes are found in very uneven ratios;
    random sampling may produce too few of the rare classes to yield relevant information
    about what differentiates them from the dominant class. To avoid these challenges,
    stratified sampling can be used. Stratified sampling is used to sample from data
    which can be partitioned into subportions.² The data is divided into homogeneous
    portions called strata (the plural of stratum).


    We must judge classifiers because there are several types of classifiers and predicting
    approaches, and within each method, there are often multiple alternatives that
    can result in totally different outcomes. The probability of a *misclassification
    error* is used to evaluate the performance of classifiers. When a record is misclassified,
    it means it has been placed in a class by a model to which it does not belong.


    The metrics for evaluating classifier performance are as follows:¹


    Accuracy and recognition rate


    ![$$ \frac{TN+ TN}{P+N} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ1.png)


    (Eq. 7.1)


    Error rate, misclassification rate


    ![$$ \frac{FN+ FN}{P+N} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ2.png)


    (Eq. 7.2)


    Sensitivity, true positive rate, recall


    ![$$ \frac{TP}{P} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ3.png)


    (Eq. 7.3)


    Specificity, true negative rate


    ![$$ \frac{TN}{N} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ4.png)


    (Eq. 7.4)


    Precision


    ![$$ \frac{TP}{TP+ FP} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ5.png)


    (Eq. 7.5)


    F, F1, F-score, the harmonic mean of precision and recall


    ![$$ \frac{2\ x\ precision\ x\ recall}{precision+ recall} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ6.png)


    (Eq. 7.6)


    The terms true positive, true negative, false positive, positive, and negative
    samples are abbreviated as `TP`, `TN`, `FP`, `P`, and `N`, respectively.


    - **True positives (`TP`)**: These are the positive tuples that the classifier
    properly labels.

    - **True negatives (`TN`)**: These are the negative tuples that the classifier
    correctly categorized.

    - **False positives (`FP`)**: These are negative tuples that have been mistakenly
    categorized as positive.

    - **False negatives (`FN`)**: Positive tuples are classified as negative.


    A confusion matrix is used to summarize the accurate and inaccurate classifications
    that a classifier generated for a given set of data, and this is done using the
    validation dataset for analyzing the performance of classifiers. In Table [7-1](#532459_1_En_7_Chapter.xhtml#Tab1),
    the confusion matrix illustrates `TP`, `TN`, `FP`, and `FN`. Classifier performance
    can be assessed using a confusion matrix, which is a useful tool for testing how
    well a classifier detects tuples from different classes. A classifier’s `TP` and
    `TN` show that it correctly classifies, whereas its `FP` and `FN` indicate that
    it incorrectly classifies, respectively. The `Fbeta` measure is a generalization
    of the `F`-measure that adds a configuration parameter called beta. `Fbeta` is
    used when both precision and recall are important but slightly more attention
    is needed on one or the other, such as when false negatives are more important
    than false positives, or the reverse.


    **Table 7-1** Confusion Matrix


    | Actual Class | Predicted Class | | |

    | --- | --- | --- | --- |

    | | | Yes | No |

    | Yes | | `TP` | `FN` |

    | No | | `FP` | `TN` |


    ## Propensities and cut-off for classification


    Some classification algorithms begin by calculating the probability that a record
    belongs to each of the classes. Another word for probability is "propensity."
    Propensities are frequently used as a first step in predicting class membership
    (classification) or in ranking records based on the probability of belonging to
    the desired class. To ensure that all classes are accurate, the record might be
    moved to a class that is most likely to get it (class with the greatest probability).
    Concentrate on a single class and compare the propensity (probability) of class
    membership to an analyst-determined cut-off value when there are many records
    and a single class is of interest. If the probability of inclusion in the desired
    class is greater than the cut-off, the record is moved to the desired class. There''s
    a default cut-off value of 0.5 in two-class classifiers.³'
