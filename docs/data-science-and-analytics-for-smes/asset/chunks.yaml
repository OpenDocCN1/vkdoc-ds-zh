- fmt: '# 5.4 Line Graphs


    Line graphs are used to track changes over short and long periods. When smaller
    changes exist, line graphs are better to use than bar graphs. Line graphs can
    also be used to compare changes over the same period of time for more than one
    group.


    **Creating line graphs in RapidMiner**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig6_HTML.png)


    The visualization tab displays a line graph wherein the plot type is selected
    as line, x-axis, and value columns are set to sales and profit.


    Figure 5-6: Example of a line graph


    1.  Create a line graph by adjusting the settings as seen in Figure [5-6](#532459_1_En_5_Chapter.xhtml#Fig6)
    to reflect `sales` on the x axis and `profit` on the y axis.

    2.  From Figure [5-6](#532459_1_En_5_Chapter.xhtml#Fig6), we can see how profit
    (y axis) changes with sales (x axis).


    # 5.5 Boxplots


    A boxplot is a standardized way of displaying the distribution of data based on
    a five-number summary: minimum, first quartile (Q1), median, third quartile (Q3),
    and maximum. It can tell you about your outliers and what their values are. It
    can also tell you if your data is symmetrical, how tightly your data is grouped,
    and if and how your data is skewed. It can also be used for comparisons of distributions
    across subgroups.


    **Creating boxplots in RapidMiner**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig7_HTML.png)


    The visualization tab displays a box plot, wherein the plot type is selected as
    a box plot and value columns are set to quantity.


    Figure 5-7: Example of boxplots


    1.  Create a boxplot for the attribute quantity by adjusting the settings as seen
    in Figure [5-7](#532459_1_En_5_Chapter.xhtml#Fig7). The `Plot type` is set to
    Boxplot, while the `Value columns` (y axis) is set to quantity.

    2.  From Figure [5-7](#532459_1_En_5_Chapter.xhtml#Fig7), the minimum quantity
    is 1, the first quartile (Q1) is 2, the median is 3, the third quartile (Q3) is
    5, and the maximum is 14. The majority of the quantity falls between 2 and 5.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig8_HTML.png)


    The visualization tab displays a side-by-side box plot wherein the plot type is
    set to a box plot. The x-axis labeling is specified in value columns.


    Figure 5-8: Side-by-side boxplots


    1.  Figure [5-8](#532459_1_En_5_Chapter.xhtml#Fig8) shows the side-by-side boxplots
    for all the numerical attributes in the data: sales, discount, quantity, and profit.
    This is obtained by including all of them in the `Value columns`.


    # 5.6 Scatter Plots


    The scatter plots help to discover features such as:


    - *Causal relationships (linear and nonlinear)*: One variable may have a direct
    influence on another in some way. For example, people with more experience tend
    to get paid more. It is standard to put the dependent variable on the vertical
    axis.

    - *Associations*: Variables may be associated with one another without being directly
    causally related. Children get good marks in English and in Math because they
    are intelligent, not because the ability in one subject is the reason for the
    ability in the other.

    - *Outliers or groups of outliers*: Cases can be outliers when the scatter plot
    is created for two dimensions (one on the x axis and the other on the y axis),
    but not outliers in either dimension separately. Taller people are generally heavier,
    but there may be people of moderate height who are so heavy or light for their
    height that they stand out in comparison with the rest of the population.

    - *Clusters*: Sometimes, there are groups of cases that are separate from the
    rest of the data.


    **Creating scatter plots in RapidMiner**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig9_HTML.png)


    The visualization tab displays a scatterplot wherein the plot type is set to scatter,
    x-axis and value columns are set to sales and quantity.


    Figure 5-9: Scatter plot


    1.  Create a scatter plot of sales on the x axis and quantity on the y axis by
    adjusting the settings as seen in Figure [5-9](#532459_1_En_5_Chapter.xhtml#Fig9).
    The `Plot type` is set to scatter plot.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig10_HTML.png)


    In a color-coded scatterplot, the plot type is set to scatter, the x-axis and
    value columns are set to sales and quantity, and the color is set to category.


    Figure 5-10: Example of color-coded scatter plot


    1.  A color-coded scatter plot can be created by adding a categorical variable
    to the setting (`color`) in Figure [5-9](#532459_1_En_5_Chapter.xhtml#Fig9) to
    give Figure [5-10](#532459_1_En_5_Chapter.xhtml#Fig10). The color-coded scatter
    plot helps to further explain the relationship between attribute sales and quantity
    using a categorical variable (category to separate that relationship). From Figure
    [5-10](#532459_1_En_5_Chapter.xhtml#Fig10), we can see that items with low quantity
    and low sales mostly belong to the technology category.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig11_HTML.png)


    The plot type is set to scatter matrix, value column with x-axes labeling, and
    column summary set to histogram featuring six scatterplots and three histograms.


    Figure 5-11: Example of a scatter plot matrix


    1.  Let us now create a scatter plot matrix for the numerical attributes discount,
    quantity, and sales using the settings in Figure [5-11](#532459_1_En_5_Chapter.xhtml#Fig11).
    The Plot type is set to Scatter Matrix; Value columns are set to Sales, Quantity,
    and Discount; and Column Summary is set to Histogram. The scatter plot matrix
    will help to compare all the attributes intended at once.


    # 5.7 Packed Bubble Charts


    Bubble charts display data as a cluster of circles. It can be used to visualize
    the size of categorical attributes. Each category of the categorical attribute
    represents a circle, whereas the number in each category represents the size of
    those circles.


    **Creating packed bubble charts in RapidMiner**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig12_HTML.png)


    The visualization tab displays a packed bubble chart wherein the plot type is
    set to packed bubble, value column and category are set to age and sex.


    Figure 5-12: Packed bubble chart


    1.  To create bubble charts, the data named `OnlineQuestion1.xls` will be used.
    Import the data into your repository; in the design view, link the data to the
    result (`res`), then run the process, and on the resulting interface (i.e., `Results`),
    click the visualizations tab. (Note that the configuration of the free RapidMiner
    edition used for this course does not allow for visualizing more than 2000 rows
    for packed bubble charts.)

    2.  Create the bubble charts using the setting as shown in Figure [5-12](#532459_1_En_5_Chapter.xhtml#Fig12).
    The `Value column` (y axis) is set to Age. The `Category` is set to sex (the categorical
    attribute under investigation).'
