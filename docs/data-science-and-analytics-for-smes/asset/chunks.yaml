    ## Preface


    This book is written from the perspective of offering a Business Analytics service
    as a product. It helps to understand how to package your analytics solution as
    a product that can be offered as a consulting service. Some of these products
    are customer loyalty, market segmentation, sales and revenue increase, etc. It
    is also particularly focused on small businesses and their peculiarity in analytics.
    Understanding the contents of the book will help anyone interested in applying
    data analytics to make a difference in small businesses achieve such, starting
    from the beginner’s level. It uses a do-it-yourself approach to analytics, and
    the tools used are easily available online and are nonprogramming based.


    The book teaches the tricks and techniques of Business Analytics consulting for
    small businesses. In particular, readers will be able to create and measure the
    success of their analytics project. The book also provides a career guide and
    helps to jump-start the world of Business Analytics consulting career. The approach
    in the book is to focus on popular problems in the small and medium business world
    that have data science solutions and then introduce the technique and how to use
    it to solve the problems. Readers will not only learn the fundamental techniques
    used in solving these problems, but they will also experience how to use them
    in practical use cases and problem scenarios. The techniques are taught in a simple
    way, but the book is supported with a lot of reference and resource material that
    can help build more mastery on the techniques.


    The book is divided into four major parts. Part 1 (Chapters [1](#532459_1_En_1_Chapter.xhtml)
    and [2](#532459_1_En_2_Chapter.xhtml)) explains the fundamental concepts explored
    in this book, such as data science, data science for business (Business Analytics),
    and what it takes to carry out any analytics project both generally and specifically
    for a small business. In this part, we also explore issues around data and how
    to manage and prepare it for the analytics project with practical examples. Part
    2 (Chapters [3](#532459_1_En_3_Chapter.xhtml) and [4](#532459_1_En_4_Chapter.xhtml))
    focuses on analytics consulting and explains how to navigate your way through
    to becoming successful in the data analytics consulting space. It also gives a
    detail of the phases involved in Business Analytics consulting. Part 3 (Chapters
    [5](#532459_1_En_5_Chapter.xhtml)–[8](#532459_1_En_8_Chapter.xhtml)) is focused
    on the data mining techniques common with small businesses, and this is expressed
    in an approach that first explains the basic concepts of these techniques in a
    simple way and then uses a real small business problem scenario for the practical
    application. This part is practical oriented and based on case study problems
    experienced by small businesses. In this book, we will explore five major practical
    business problem scenarios and several small business problems for illustration.
    These are covered in Chapters [5](#532459_1_En_5_Chapter.xhtml)–[8](#532459_1_En_8_Chapter.xhtml).
    The techniques used demonstrate how to solve these problems. It is important to
    say here that despite using a particular problem as a case study, it is not only
    in this situation that the approach can be deployed, but it can be used in other
    similar problem scenarios. The techniques selected are based on their popularity
    in practice, and they fall under the broad classification of prediction (predicting
    numerical outcome), classification (predicting categorical outcome), and descriptive
    analytics. Finally, Part 4 brings the consulting principles to life by using an
    SME case study to model the already explained consulting phases in Part 2 and
    adopting the appropriate techniques among the ones explained in Part 3. Although
    each chapter stands alone, we advise that you read Part 1 before proceeding to
    Part 3, and Part 2 before proceeding to Part 4.


    The tools used for the practical examples are `RapidMiner Studio` and `Gephi`.
    The book is written such that all the `RapidMiner Studio` and `Gephi` screenshots
    are included with details of how to run them. `GitHub` will also be used to store
    the practical project.


    This book goes beyond explaining the techniques to giving an experience of applying
    the recommendations from the modeling to get results. In particular, we use a
    sample of business scenarios experienced in the past for the use cases. The book
    is also supported with a real-life business group on Telegram ([`https://t.me/+kSSQjNhhz6plZTk0`](https://t.me/%252BkSSQjNhhz6plZTk0))
    where we harvest business problems and encourage readers to be a part of solving
    the problems. We have in this book real-life business case studies (from the Telegram
    group) that can be used as a reference. The book also comes with links to YouTube
    videos that help to explain some of the concepts better.


    This book, together with the solutions to the exercises and more application scenarios
    and data science techniques, is available as an online course and training; you
    can visit `datasciencenaija.com` for more details.


    We appreciate reader feedback. We would like to know what you think about this
    book, good or bad. To give us general feedback, simply send an email to ibukunafolabi0909@gmail.com.
    Also, the data and more information about the book can also be obtained at [*www.datasciencenaija.com/book*](http://www.datasciencenaija.com/book).


    ## Acknowledgments


    First of all, I would like to acknowledge God almighty for making it possible
    for me to write this book. I would also like to thank my husband Oluwafemi Afolabi
    for his support and encouragement that has made this book a reality. I deeply
    appreciate Prof. Olufunke Oladipupo and Dr. Joke Badejo who have taught me a lot,
    both as a data scientist and in other aspects of life. Lastly, I would like to
    say thank you to Timileyin Owoseni and Christabel Uzor, my M.Sc. students who
    also helped with the book. I will not forget my wonderful students that I have
    been fortunate to teach and advise, Obinna Okorie, Temi Oyedepo, and many others;
    I learned a lot from them. I would like to appreciate afrimash.com for the opportunity
    to learn practical data science consulting.


