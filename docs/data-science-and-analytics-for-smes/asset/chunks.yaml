    # 5. 描述性分析工具


    本章重点介绍商业中，尤其是小型企业中，最常用的描述性分析工具。本章将帮助你运用描述性分析工具来了解你的业务，并提出能够提升企业利润的建议。对于小型企业而言，描述性分析有助于中小企业理解可用数据，从而一眼监控业务指标，帮助中小企业主从整体上观察销售趋势和模式，并深入分析产品类别和客户群体。它还能帮助中小企业规划产品策略和定价政策，以最大化预期收入，并从中获取有价值的见解来吸引更多客户。


    ## 5.1 引言


    在商业分析中，描述性分析通过信息将市场与企业联系起来，并提供可执行决策所需的信息。因此，描述性分析可以被视为系统地收集和解释数据以辅助决策者的原则。描述性分析有三种类型：


    *   *探索性研究*：用于需要解决模糊问题的情况，例如，进行探索性研究以找出销售额下降的原因。

    *   *描述性研究*：用于回答关于认知度的问题，例如，购买我们产品的是哪类人群？

    *   *因果研究*：用于问题被明确定义的情况，例如，改变店铺布局后，买家是否会购买更多我们的产品？


    本章的其余部分将选取每种常见的描述性分析工具，详细解释其用途，并实际演示如何使用它们。本章用于实际演示的数据集名为 `SuperstoreNigeria.xls`。


    `RapidMiner` 可用于多种类型的可视化，但我们在本章中只挑选了最流行和最常见的几种。


    ## 5.2 条形图


    条形图可用于检查分类数据中是否存在意外的结果模式，例如，某些类别的数量可能远多于其他类别。某些类别可能完全缺失，或者类别内分布不均。甚至还可能出现额外的类别，例如，如果出现错误，`性别`被记录为
    `"M"` 和 `"F"`，但同时也被记录为 `"m"` 和 `"f"`、`"male"` 和 `"female"`。也可能存在不平衡的实验，导致某些数据缺失或不可用；这些问题都可以通过条形图发现。条形图还有助于在类别过多时发现问题，并帮助我们决定是否以及如何合并它们。最后，它还能揭示错误和缺失值。


    **在 RapidMiner 中创建条形图**


    ![](img/532459_1_En_5_Fig1_HTML.png)


    导入的数据列出了行 ID、列 ID、订单日期、发货日期、发货模式、客户 ID、细分市场和国家的数据。


    图 5-1 导入数据的截图


    1.  您可以创建一个新的存储库或使用现有存储库，并**导入**名为 `SuperstoreNigeria.xls` 的数据（指南请参考第[2]章第 2.​4
    节）。

    2.  图 5-1 是导入数据在 `RapidMiner` 中的截图。点击**下一步**，并选择您要存放数据的存储库。


    ![](img/532459_1_En_5_Fig2_HTML.png)


    `Rapid Miner Studio` 窗口导入了一个数据表，并显示了一个包含 `数据`、`统计信息`、`可视化`和`注释`选项的导航面板。


    图 5-2 导入数据的示例集


    1.  在图 5-2 所示的**结果**界面上，您可以点击**数据**、**统计信息**、**可视化**和**注释**，以探索数据的各种特征，具体解释见第[2]章第
    2.​4 节。


    ![](img/532459_1_En_5_Fig3_HTML.png)


    可视化选项卡中的绘图部分列出了绘图类型、值列、分组依据、聚合函数、颜色分组和堆叠。


    图 5-3 条形图示例


    1.  点击图 5-2 中的**可视化**按钮，然后调整由此产生的界面设置（如图 5-3 所示），即可创建条形图。请注意**绘图类型**、**值列**（y
    轴）、**聚合数据**、**分组依据**和**聚合函数**的设置。**绘图类型**设置为 `条形图（列）`。选择 `行 ID` 作为**值列**，以便计算数据中的每一行来创建条形图。勾选**聚合数据**表示我们将使用聚合计算。选择**分组依据**，指明我们要检查的分类变量（`细分市场`）。**聚合函数**则表示我们想要知道在名为
    `细分市场`的分类属性中，每个类别存在多少行数据。


    ## 5.3 直方图


    直方图用于将数据分组到区间中，并为每个区间绘制一个条形，以展示经验分布。直方图有助于理解数据的中心位置。直方图是识别数据分布形状的绝佳工具。有时数据会向左或向右偏斜，这时需要进行数据转换。例如，当使用直方图检查数据的预测情况时，你需要确保数据没有以可能影响分析结果的方式向左或向右偏斜。也就是说，数据需要是对称的或几乎对称的。


    对数变换法适用于转换右偏数据，但不适用于零值和负值。平方根法适用于转换右偏数据，但不适用于负值。平方变换法适用于转换左偏数据，但不适用于负值。立方根法适用于转换右偏数据以及包含负值的数据，但其对数变换效果不佳。


    **在 RapidMiner 中创建直方图**


    ![](img/532459_1_En_5_Fig4_HTML.png)


    可视化选项卡显示了一个直方图，其中绘图类型选择为 `直方图`，值列选择为 `利润`。


    图 5-4 属性“利润”的直方图


    1.  按如下方式更改设置，即可创建图 5-4 中的直方图：将**绘图类型**设置为 `直方图`。使用**值列**来选择您希望为其创建直方图的数值型属性。


    ![](img/532459_1_En_5_Fig5_HTML.png)


    可视化选项卡显示了一个直方图，其中绘图类型选择为 `直方图`，值列选择为 `数量`。


    图 5-5 属性“数量”的直方图


    1.  图 5-5 是属性“数量”的直方图。

    2.  图 5-4 中的直方图相当对称，而图 5-5 中的直方图则略微向右偏斜。对称的直方图意味着数据在将直方图垂直分成两等份的线两侧均匀分布。在直方图上这条线与
    x 轴相交的数值即为中位数，它同时等于平均值和众数（对于对称的直方图形状而言）。我们还可以使用直方图来确定大部分数值落在哪个区间范围内。

