    7-7b、7-11b、7-15b 和 7-16b，我们可以看到最佳算法是神经网络（图 7-7b），其准确率为 85.79%，略高于随机森林。


    对于这个问题，目标是预测哪些客户将成为潜在客户中的忠诚客户。利用对新客户的预测结果，我们可以识别这一点，特别是如果我们选择那些具有高倾向性的客户。同时，对于现有客户，我们也可以预测出忠诚客户和即将流失的客户，并采取必要措施。例如，如果目标是瞄准潜在客户，我们可以将潜在客户记录按倾向性从高到低排序（在新预测的数据集中），以便针对那些具有最高倾向性的客户采取行动进行目标营销。

