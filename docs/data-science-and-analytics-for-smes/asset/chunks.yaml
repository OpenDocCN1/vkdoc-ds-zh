- fmt: "## 5.12 Problems\n\n1.  This exercise is the continuation of the practical\
    \ business problem I (Section [5.11](#532459_1_En_5_Chapter.xhtml#Sec11)). The\
    \ intention is to discover more insights, using the `SuperstoreNigeria.xls` to\
    \ answer the following questions. (Note: Some questions might require more interactive\
    \ visualization tools like Tableau.)\n    1.  What is the sum of sales for each\
    \ subcategory and how does this relate with the profit, that is, which subcategory\
    \ has the highest and lowest profit. Use color to indicate this.\n    2.  What\
    \ is the sum of sales for each segment and how does this relate with the quantity,\
    \ that is, which segment has the highest and lowest quantity produced. Use color\
    \ to indicate this.\n    3.  Which states have been given the highest and lowest\
    \ discount? (Use map.)\n    4.  Which states are making high profits (wordmap,\
    \ treemap, and bubble map)?\n    5.  Which states have been given the highest\
    \ and lowest discount? (Use map.)\n    6.  In what category, subcategory, and\
    \ State of Nigeria is the highest sales made?\n    7.  In what category, subcategory,\
    \ region, and State of Nigeria are the highest sales made?\n    8.  For the category\
    \ named furniture, that the ship mode attribute is standard class, what is the\
    \ total profit made and the total sales made. Make sure that your output is titled\
    \ appropriately. Total Sales and Total Profit for Category and Ship Mode.\n  \
    \  9.  What is the total quantity sold and total sales made for office supplies\
    \ using standard class ship mode.\n    10.  Based on the category and subcategory,\
    \ compare the sales in the East and West Regions.\n\n2.  You have been provided\
    \ with a data named `chapter5Assign.xls`. It consists of the transactional data\
    \ of a Nigerian noodle retail business (*data is fictitious, created just for\
    \ the assignment*). Assuming this business intends on obtaining recommendation\
    \ for an effective marketing campaign based on the result of descriptive analytics\
    \ and you have been employed as the data scientist, present your result to the\
    \ management in the form of the dashboard.\n\n# 6. Predicting Numerical Outcomes\n\
    \nIn this chapter, we will explore the popular techniques used for prediction,\
    \ particularly in the retail business. The approach used in explaining these techniques\
    \ is to use them in solving a business problem. The business problem to be addressed\
    \ is the sales prediction problem which is common in the retail business. The\
    \ chapter first explains the fundamental concept of prediction techniques; next,\
    \ we look at how such techniques are evaluated. After this, we describe the business\
    \ problem we intend to solve. We then pick each of the selected techniques one\
    \ by one and explain the algorithms involved and how they can be used to solve\
    \ the problem described. The prediction techniques used are the multiple linear\
    \ regression, the regression trees, and the neural network. To conclude the chapter,\
    \ we compare the results of the three algorithms and conclude on the problem in\
    \ question. In this chapter, therefore, the analytics product offered is the sales\
    \ prediction problem for small retail businesses.\n\n## 6.1 Introduction\n\nIn\
    \ Section [1.​3](#532459_1_En_1_Chapter.xhtml#Sec3) under the analytics journey,\
    \ it was mentioned that there are three major types of analytics: descriptive,\
    \ predictive, and prescriptive. In this chapter, the predictive analytics will\
    \ be used to solve the sales prediction problem for small retail businesses. To\
    \ lay a good foundation for predictive analytics, we will explain some fundamental\
    \ concepts.\n\nMachine learning is used to investigate how computers learn or\
    \ improve performance based on data. In machine learning, computer programs automatically\
    \ learn to recognize complex patterns and make intelligent decisions based on\
    \ data.³\n\n*Supervised learning*: This is the process of feeding data to an algorithm,\
    \ in which an output variable of interest is known, and the algorithm “learns”\
    \ how to predict this value with fresh records when the output is unknown. Predictive\
    \ analytics falls under the supervised. There are two types of predictive analytics,\
    \ predicting categorical outcome (classification), for example, buy or no buy,\
    \ or predicting numerical outcome (prediction), for example, stock price. Examples\
    \ of predictive algorithms include multiple linear regression, regression tree\
    \ (decision tree), logistic regression, `SVM` (support vector machine) for regression,\
    \ and so on. Examples of classification methods include Naïve Bayes, Bayesian\
    \ network, classification tree (decision tree), `KNN`, `SVM` (support vector machine),\
    \ and so on. In this chapter, we will focus on the kind of predictive analytics\
    \ that deals with predicting numerical outcome. The historical data used for predicting\
    \ numerical outcome is labeled in the sense that all the rows in the data will\
    \ end with a target attribute which is the attribute we intend predicting. In\
    \ predicting either numerical or categorical outcome, the data needs to be portioned\
    \ to 70% or 60% for training and 30% or 40% for testing, respectively. There are\
    \ some algorithms like the `KNN` (K-nearest neighbor) that require a different\
    \ kind of partitioning because there is a need to use a partition to determine\
    \ the best k. This will be covered in Chapter [7](#532459_1_En_7_Chapter.xhtml).\n\
    \nIn business, prediction can be used to achieve the following, for example:\n\
    \n*   Predicting client credit card behavior based on demographics and previous\
    \ activity patterns\n*   Using historical frequent flyer information to predict\
    \ vacation travel spending\n*   Using historical data, product, and sales information\
    \ to predict helpdesk personnel requirements\n*   Based on historical data, predicting\
    \ sales through product cross-selling\n*   Predicting the effect of discounts\
    \ on retail sales\n\nClassification can be used to achieve the following, for\
    \ example:\n\n*   To determine which loan applicants are dangerous or safe to\
    \ lend to.\n*   In marketing, for example, classification can help to know if\
    \ a customer will buy a product or not.\n*   Classification is very valuable in\
    \ determining customer loyalty; in particular, we can predict if a customer will\
    \ churn or not.\n\n*Unsupervised learning*: This type of analysis entails attempting\
    \ to discover patterns in the data rather than projecting the desired output value.\
    \ Clustering falls under the unsupervised learning approach to machine learning,\
    \ and there are many more. In this approach, the raw, unlabeled, and partitioned\
    \ data is fed into the algorithm, and the output is labeled or classified data."
