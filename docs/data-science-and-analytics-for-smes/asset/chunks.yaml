  trans: "\n# 表 8-1：关联分析的数据格式\n\n表 8-1 展示了使用 Apriori 算法进行关联分析时所采用的数据格式示例。每一行代表一个交易事务，每一列代表一个商品品项，总计列表示所有可用的商品品项。关联分析中交易数据的一个典型来源是超市收银台扫描仪收集的数据，其中每条记录列出了顾客单次交易中购买的所有商品。\n\
    \n**表 8-1**  \n*用于关联挖掘的数据示例*\n\n| 交易编号 | Crocs | KennethCole | Llbean | Nike |\
    \ Adidas | Skechers | Fila |\n|--------|-------|-------------|--------|------|--------|----------|------|\n\
    | 1      | 0     | 1           | 1      | 1    | 1      | 0        | 1    |\n\
    | 2      | 0     | 0           | 1      | 0    | 1      | 0        | 1    |\n\
    | 3      | 0     | 1           | 0      | 0    | 1      | 1        | 1    |\n\
    | 4      | 0     | 0           | 1      | 1    | 1      | 0        | 1    |\n\
    | 5      | 0     | 1           | 0      | 0    | 1      | 0        | 1    |\n\
    | 6      | 0     | 0           | 0      | 0    | 1      | 0        | 0    |\n\
    | 7      | 0     | 1           | 1      | 1    | 1      | 0        | 1    |\n\
    | 8      | 0     | 0           | 1      | 1    | 0      | 0        | 1    |\n\
    | 9      | 0     | 0           | 0      | 0    | 1      | 0        | 0    |\n\
    | 10     | 1     | 1           | 1      | 1    | 0      | 0        | 0    |\n\
    | 11     | 0     | 0           | 1      | 0    | 0      | 0        | 1    |\n\n\
    # 关联分析——中小企业的应用\n\n零售行业广泛运用关联分析，以深入了解顾客通常会一起购买哪些商品。了解特定商品组合是否经常被同时购买，是一种决策类型。关联分析有助于设计商品目录和零售店铺布局，同时还能用于交叉销售、促销活动，以及根据购买习惯识别客户群体。为了在降低库存积压成本的同时增加中小企业的销售额，可以利用关联分析的结果，以正确的商品组合来配置货架。在交叉销售商品方面，关联分析的结果可用于提高每位顾客的平均消费额。中小企业的前端销售人员在这方面的技能水平可能参差不齐，因为他们的经验和观察能力各不相同。关联分析可以帮助小企业深入了解顾客最可能购买哪些类型的商品，从而更好地对员工进行相关领域的培训和指导。\n\
    \n# 关联分析示例\n\n一家鞋类零售商存储了每位顾客的销售数据，并能将其转换为存储在`shoes.xlsx`文件中的事务数据。该鞋类零售商的目的是分析这些鞋类商品购买之间的关联，以便用于销售点展示和指导销售人员促进交叉销售。\n\
    \n![](img/532459_1_En_8_Fig18_HTML.png)\n\n*一张计算机截图，展示了创建频繁项集过程的设置。*\n\n**图 8-16**\
    \  \n*创建频繁项集的过程*\n\n1. 创建一个新的存储库（命名为 Association）；**导入**名为`shoes.xlsx`的数据。导入时，确保将除交易编号（`Trans.`）之外的所有列转换为二项数据类型。导入数据后，检查**统计信息**，确保没有缺失值。\n\
    \n2. 使用图 8-16 中的设置来创建频繁项集，运行该过程后，结果如图 8-17 所示。\n\n在图 8-16 中，对于**选择属性**运算符，请选择除`Trans.`之外的所有二项属性。对于\
    \ FP-Growth，保留默认设置。有时，根据数据情况，您可能需要降低支持度才能获得结果。FP-Growth 算法是一种用于计算事务数据库中频繁共同出现商品项的高效算法。\n\
    \n![](img/532459_1_En_8_Fig19_HTML.png)\n\n*一张计算机截图，展示了创建频繁项集过程的输出，左侧显示了相关规格参数。*\n\
    \n**图 8-17**  \n*创建频繁项集过程的输出*\n\n修改图 8-16 中的设置，得到图 8-18，这是生成关联规则的完整设置。目前，在图 8-18\
    \ 中，我们将**创建关联规则**运算符的参数保留为默认值。但这可以根据数据的性质进行调整。\n\n![](img/532459_1_En_8_Fig20_HTML.png)\n\
    \n*一张计算机截图，展示了生成关联规则的设置。*\n\n**图 8-18**  \n*创建关联规则的过程*\n\n运行图 8-18 的结果如图 8-19\
    \ 所示。它展示了所生成规则的前提（前件）、结论（后件）、支持度、置信度、提升度等信息。为了选择最佳规则加以应用，我们需要寻找最高的支持度，提升度至少大于\
    \ 1 且置信度高的规则。\n\n![](img/532459_1_En_8_Fig21_HTML.png)\n\n*一张计算机截图，展示了生成关联规则过程的输出，左侧显示了一些规格参数。*\n\
    \n**图 8-19**  \n*得到的关联规则*\n\n为了选择最佳规则，按提升度排序，我们得到图 8-20。\n\n![](img/532459_1_En_8_Fig22_HTML.png)\n\
    \n*一张计算机截图，显示了按提升度降序排序后，生成关联规则过程的输出。*\n\n**图 8-20**  \n*按提升度对图 8-19 进行排序*\n\n\
    - 解读图 8-20 中的第一条规则，我们有：\n\n*如果 Fila、Llbean 和 Adidas 被同时购买，那么，有 94.5%的置信度，Nike\
    \ 和 Bata 也将被购买。这条规则的提升度为 1.379。*\n\n上述规则可以有多种应用方式，例如，如果顾客正在询问某个特定品牌的鞋子，你可以向顾客介绍一个新品牌。推荐这个新品牌是基于解决品牌关联问题，这能确保顾客也会想要购买这个新品牌。中小企业可以通过多种方式实施此类推断。\n\
    \n示例包括通过电子邮件营销、推荐引擎、促销活动等等。\n"
- fmt: '### 8.5 Network Analysis


    A network is a set of objects (nodes) with interconnections (edges). An example
    of a communication network obtained from tweets is shown in Figure [8-21](#532459_1_En_8_Chapter.xhtml#Fig23).


    ![A diagram illustrates the structure of a communication network obtained from
    tweets. It has several interconnected nodes.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig23_HTML.jpg)


    **Figure 8-21** An example of a social communication network


    There are different types of networks. There are social networks that are created
    from social interactions and personal relationships, for example, on social media,
    co-authorship networks, and so on. There are other types of networks such as transportation
    and mobility networks, information networks, biological networks, and so on.


    The nodes in the network refer to objects such as people, departments, transport
    stations, and so on. The edges refer to the connection between the objects which
    could be friendship, marriage, family ties, research communication, and so on.
    Weighted edges can also reflect connection qualities, such as how much email is
    exchanged between two people on a network. Distance between two points can be
    depicted using the length of an edge on a map.


    Networks can either be undirected (bidirected) or directed in structure. An example
    of a directed network is if Ibk follows Femi on Twitter, and Femi does not follow
    Ibk. An example of an undirected or bidirected network is if two people co-author
    a research publication together.


    There are various tools and platforms from which we can create and visualize networks;
    examples include `Gephi`, `networkX`, `Graphviz`, and `R` (`igraph`). Graph layouts
    can be created using any of these tools, but the following guidelines can make
    them more readable:


    * Each node should be clearly discernible.

    * For each node, you should be able to determine its degree.

    * For every connection, you should be able to follow it from source to destination.

    * It’s important to be able to identify clusters and outliers.


    **Network metrics**


    * **Degree distribution**: In a network, the degree distribution describes how
    many nodes a node is connected to. It helps to know the number of nodes in the
    network and the range of their edges.

    * **Density**: This gives the overall connectedness of a graph that focuses on
    the edges, not the nodes. It is the ratio of the actual number of edges to the
    maximum number of potential edges.

    * **Average clustering coefficient**: This is also known as “triadic closure.”
    The clustering coefficient indicates the possibility that a node that shares connections
    in the network would join the network.

    * **Network diameter**: This is used to describe the maximum distance between
    any pair of nodes in the network.

    * **Number of communities**: This gives the number of the subset of nodes in the
    network, such that every author in the subset has a path to every other author
    and no other author has a path to any author in the subset.

    * **Degree centrality**: This tries to find centrality based on the idea that
    significant nodes have a large number of connections.

    * **Closeness centrality**: This aims to find centrality by assuming that significant
    nodes will be close to all other nodes in a network.

    * **Betweenness centrality**: The search for centrality is founded on the notion
    that nodes that connect to other nodes are significant nodes.

    * **Eigenvectors**: To convey the idea that a node is more central if its neighbors
    are more central.


    For more on network metrics, check Tsvetovat and Kouznetsov (2011).


    **Network data**


    Network data can either be in the form of the edge list or the adjacency list.
    Figures [8-22a](#532459_1_En_8_Chapter.xhtml#Fig24) and [8-22b](#532459_1_En_8_Chapter.xhtml#Fig25)
    present the edge list and adjacency list (of the same data), respectively.


    ![A figure of the adjacency list form for representing network data. It is a table
    with 9 rows and 9 columns.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig25_HTML.png)


    **Figure 8-22b** Adjacency list


    ![A figure of the edge list form for representing network data. It is a table
    with 15 rows and 2 columns.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig24_HTML.png)


    **Figure 8-22a** Edge list


    Network analysis can be applied in almost all of the domain of interest. In business,
    we can use it to answer questions like the following:


    * Is an advertisement likely to spread in the network?

    * Who are the most influential people in this business environment?

    * What products are highly connected to other products?

    * And many more.


    In this section, we will use two simple examples to demonstrate how to create
    networks and customize them in `Gephi`, and in Section [8.6](#532459_1_En_8_Chapter.xhtml#Sec6),
    we will demonstrate a real business problem scenario example of the application
    of network analysis. Note that this can be customized to solve several related
    problems also. For these examples, `Gephi` will be used for the practical demonstration.
    Section [1.8](#532459_1_En_1_Chapter.xhtml#Sec17) of this book gives the details
    of how to set up `Gephi` and to be familiar with the `Gephi` environment.


    **Network analysis – example 1**


    The data named `dynamic.gexf` is a `Gephi` file that contains tweets from users
    in a communication social network (Twitter). These tweets have been converted
    to an edge list in the form of a `Gephi` file (data was downloaded and converted
    using `netlytics.org`). For a complete tutorial of how to download the data and
    create the `Gephi` file which contains the nodes and edges, please visit [`https://yusufsalman.medium.com/twitter-network-analysis-and-visualisation-with-netlytic-and-gephi-0-9-1-1011b009261`](https://yusufsalman.medium.com/twitter-network-analysis-and-visualisation-with-netlytic-and-gephi-0-9-1-1011b009261).
    The downloaded data in Excel is presented in Figure [8-23](#532459_1_En_8_Chapter.xhtml#Fig26).


    ![A computer screenshot illustrates the downloaded data containing the tweets
    from users of a social communication network.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig26_HTML.png)


    **Figure 8-23** Downloaded data in Excel format


    ![A computer screenshot illustrates the details inside the statistics tab with
    the option to run each of the components.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig30_HTML.jpg)


    **Figure 8-27** Statistics in Gephi


    ![A computer screenshot demonstrates the created network with the specifications
    listed on the left side.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig29_HTML.png)


    **Figure 8-26** Loaded network


    1.  Load the `Gephi` application as seen in Figure [8-24](#532459_1_En_8_Chapter.xhtml#Fig27).
    Click **Open Gephi file** and select `dynamic.gexf` to reveal the interface in
    Figure [8-25](#532459_1_En_8_Chapter.xhtml#Fig28).


    ![A computer screenshot illustrates the loading of the Gephi application.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig27_HTML.png)


    **Figure 8-24** Loading the `dynamic.gexf` file


    In Figure [8-25](#532459_1_En_8_Chapter.xhtml#Fig28), you can set the **Graph
    Type**, which in this case is directed (by default). The number of nodes and edges
    is also revealed on this interface, together with some other details. Figure [8-25](#532459_1_En_8_Chapter.xhtml#Fig28)
    also asks if you want to open the file in a new workspace or append it to an existing
    workspace. If you are importing the node list which is a detailed description
    of the nodes, the option of append will be used, but for this example, we will
    open in a new workspace. Click **OK**.


    ![A computer screenshot displays the interface when the tab to open the Gephi
    file is clicked and dynamic dot g e x f is selected.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig28_HTML.png)


    **Figure 8-25** Importing the interface


    The network created is then displayed in Figure [8-26](#532459_1_En_8_Chapter.xhtml#Fig29).'
