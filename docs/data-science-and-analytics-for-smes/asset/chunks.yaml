- fmt: "### Using Gephi\n\n`Gephi` is an open source and free software for visualization\
    \ and exploration of all kinds of graphs and networks. To download `Gephi`, visit\
    \ [`https://gephi.org/`](https://gephi.org/). Some installation guide can be found\
    \ at [`https://gephi.org/users/install/`](https://gephi.org/users/install/). If\
    \ you have any issues installing `Gephi`, visit [`www.youtube.com/watch?v=-JU-S5dMDVo`](http://www.youtube.com/watch%253Fv%253D-JU-S5dMDVo).\
    \ After installing `Gephi` successfully, you will see the screen in Figure [1-6](#532459_1_En_1_Chapter.xhtml#Fig6).\
    \ A quick introduction to `Gephi` can be found at [`https://gephi.org/tutorials/gephi-tutorial-quick_start.pdf`](https://gephi.org/tutorials/gephi-tutorial-quick_start.pdf).\n\
    \n![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig6_HTML.png)\n\nA screengrab\
    \ of the first page of the installed `Gephi` software.\n\nFigure 1-6\n\n`Gephi`\
    \ screen\n\n## 1.9 Problems\n\n1.  Design a conceptual business model for the\
    \ following business scenarios:\n    1.  A small business that intends to use\
    \ information on its current training attendee to build a model to predict who\
    \ will come for training in the future. The result of this prediction is to be\
    \ used for target marketing.\n    2.  Hadetulah eye clinic is a small business\
    \ of about 20 staffs in total and about five branches in Nigeria. They offer several\
    \ services relating to eye treatment, from diagnosing to sales of eye treatment\
    \ equipment. Even though they do not have a core enterprise application running,\
    \ they capture financial operations data in the form of excel sheets storing diagnosis\
    \ results, information of the referral hospitals, equipment details, rental or\
    \ sales information, and invoices. Their goal is to attract more customers.\n\n\
    2.  Assuming you are part of an analytics project embarked on a task to improve\
    \ the efficiency of an operation of an airline business. Your task is to understand\
    \ how the business operates. In doing this, you are requested to come up with\
    \ the conceptual model that gives a detailed explanation of the elements in that\
    \ business space and how they relate together.\n\n3.  Create a conceptual business\
    \ model for a noodle retail small business. This company intends to segment their\
    \ current customers so as to be able to describe them for effective customer relationship\
    \ management.\n\n# 2. Data for Analysis in Small Business\n\nIn this chapter,\
    \ we will look at the various sources of data generally and in small business.\
    \ This is important because the major challenge of consulting for small business\
    \ is the lack of data or quality data for analysis. This chapter will therefore\
    \ detail the sources of data for analysis explaining first the type or form that\
    \ data exists and some general ideas of how to collect such data. It gives an\
    \ overview on data quality and integrity issues and touches on data literacy.\
    \ In addition, we will explain typical data preparation procedures for data analytics\
    \ techniques. To conclude, we look at data visualization, particularly toward\
    \ preparing data for various analytics tasks as explained in Section [1.3](#532459_1_En_1_Chapter.xhtml#Sec3).\n\
    \n## 2.1 Source of Data\n\nData can be retrieved in different forms; the most\
    \ basic category of data is the structured, semistructured, and unstructured data.¹\n\
    \n*Structured data*: This type of data has a predefined order to it, and it is\
    \ formatted to a particular structure before it is stored. This structure is referred\
    \ to as schema-on-write. One good example is data stored in a relational database\
    \ management system.\n\n*Unstructured data*: This is when data is stored in its\
    \ native format and not processed until it is used, which is known as schema-on-read.\
    \ It has no form or order. It can be stored in a variety of file formats; examples\
    \ are emails, social media posts, presentations, chats, IoT sensor data, and satellite\
    \ imagery.\n\n*Semistructured data*: This form of data includes metadata that\
    \ outlines specific features of the data³ and allows it to be manipulated more\
    \ efficiently than unstructured data. Data stored in `XML` format is an example\
    \ of this kind of data.\n\nIn business, the types of systems that capture data\
    \ include the following:\n\n*   Core enterprise systems\n*   Customer and people\
    \ systems\n*   Product and presence systems\n*   Technical operations systems\n\
    *   External sources systems\n\nIt’s important to note that sometimes these systems\
    \ overlap in their functionalities stated as follows in some situations.\n\n*Core\
    \ enterprise*: These include systems that help in managing the financial operations\
    \ of the business. They are used for billing and invoicing, enterprise resource\
    \ planning, supply chain management, purchasing and selling activities, monitoring\
    \ production activities, and many more. When compared to the other classes, they\
    \ have a vast volume and are normally created, saved, and maintained within the\
    \ operating application.\n\n*Customer and people systems*: These include client\
    \ services, marketing automation, campaign management, human resource systems,\
    \ and customer relationship management (`CRM`) systems.\n\n*Product and presence\
    \ systems*: They help to store information about product management. These include\
    \ product management, content management, web management, and analytics. Many\
    \ of the actions that people undertake in ecommerce can be measured in the most\
    \ minute detail. These include customer reviews, weblog data, mouse click trails,\
    \ global positioning satellite (`GPS`), and so on.\n\n*Technical operations systems*:\
    \ They are very tactical and help to monitor processes of other systems to make\
    \ sure that they are functioning properly. They include process monitoring, alarming\
    \ and fault monitoring, ticketing and workflow management, telematics, and machine\
    \ data processing.\n\n*External source systems*: These include data collected\
    \ outside the organization but are relevant for the analytics process. They include\
    \ demographic and segmentation data, data from partners, supplies and government\
    \ agencies.\n\nTo extract this data for analytics or prepare it for secondary\
    \ analytics storage like the data warehouse, there are several languages available\
    \ which include but are not limited to `SQL`, `Python`, and so on. Sometimes,\
    \ when the data is not available for extraction, we might need to collect it using\
    \ either the active data collection approach or the passive data collection approach.\n\
    \n*Active data collection*: This occurs when data is collected directly from the\
    \ user, for example, a user deliberately shares personal data when completing\
    \ an online retail transaction. When collecting such data, oftentimes, there is\
    \ a need to include some disclosure of the data being collected. Active data can\
    \ also be collected using surveys whether online or offline, and there are procedures\
    \ to be followed² to carry this out to achieve a particular goal. Online platforms\
    \ include `Google Forms`, `SurveyMonkey`, and so on."
