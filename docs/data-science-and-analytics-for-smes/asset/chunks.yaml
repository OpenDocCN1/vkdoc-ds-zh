    # 被动数据收集


    *被动数据收集*：当目标对象不参与数据收集时发生。它通过扫描仪或媒体（如广播、电视和社交媒体）收集。其他被动收集数据的方式包括网络和移动平台。网络数据提供了大量关于客户正在查看什么的信息，无论在你的网站还是竞争对手的网站上。例如，对于电子商务网站，我们可以收集客户评论、网络交易数据、客户人口统计数据以及网络日志数据。帮助收集网络数据的公司例子是`Comscore`（[`www.comscore.com/`](http://www.comscore.com/)）。这些公司可以帮助收集数据，从而洞察特定公司在社交媒体上的趋势，了解该公司竞争对手网站上正在发生什么等等。


    ## 真实商业案例 I


    *为小型企业提供咨询需要创造性地从来源分析数据；例如，一个组织不同主题培训的小型企业，旨在利用其当前培训参与者的信息来构建模型，预测哪些潜在客户未来会对培训感兴趣。他们打算向被预测感兴趣的潜在客户推介新的培训包。由于是小型企业，执行此任务的预算极少，因此他们需要知道如何用可用资源精确地瞄准哪些潜在客户。为了获取此任务的外部数据，数据分析师不得不在`Facebook`上投放定向广告，并附上一个`Google
    Form`链接，用于收集感兴趣潜在客户的详细信息。这是一种创造性地获取外部数据的方式。*


    ## 真实商业案例 II


    *`Hadetulah`眼科诊所是一家小型企业，总共约 20 名员工，在尼日利亚约有五个分支机构。他们提供与眼部治疗相关的多项服务；从诊断到眼科治疗设备的销售。尽管他们没有运行核心的企业应用程序，但他们以
    Excel 表格的形式捕获财务运营数据。他们还存储关于转诊医院、设备详情、租赁或销售信息以及发票的信息。对于`Hadetulah`，客户和人员系统以 Excel
    表格形式捕获，包括客户姓名、电话、年龄、性别、职业、地址等信息。他们还能够捕获诸如在镜片类型上的花费、为客户服务的员工等信息。* *图* **2-1** *展示了`Hadetulah`光学公司特征表示示例的示意图。从此图中，我们可以看到客户的图片以及表示客户的特征或属性。该图进一步给出了每个属性可能具有的值的示例，并说明了这（不同客户的历史特征集合）将如何作为预测算法的输入，其中属性`amount`是标签。开发模型后，我们现在可以将其用于预测新客户。*


    ![](img/532459_1_En_2_Fig1_HTML.png)


    图示展示了一张客户图片，其旁边列出了各种特征，即：`amount`、`age`、`type of eye defect`、`type of frame`、`location`、`height`和`weight`。通过预测金额生成一个学习模型。


    **图 2-1**

    `Hadetulah`光学的特征表示


