    ## 6.5 Regression Trees


    The family of decision tree classifiers includes regression trees. The data-driven
    method of decision tree classifiers necessitates a significant amount of data.
    ID3, C4.5, CART (Classification and Regression Trees), and others are examples.
    This group of techniques uses a greedy (i.e., nonbacktracking) approach in which
    decision trees are built in a recursive divide-and-conquer approach from the top
    down. As the tree is created, the training set is recursively partitioned into
    smaller subsets. The way characteristics are chosen in the creation of the tree
    and the pruning processes utilized in decision tree algorithms differ.


    **Attribute selection** **measures in decision tree classifiers**


    A heuristic for picking the splitting criterion that “best” splits a given data
    partition, D, of class-labeled training tuples into individual classes is an attribute
    selection measure. If we split D into smaller partitions, the optimum splitting
    requirement is for each partition to be pure. Because they determine how tuples
    at a given node are split, attribute selection measures are also known as splitting
    rules. The attribute selection measure assigns a score to each attribute that
    describes the training tuples in question. For the given tuples, the attribute
    with the highest measure score is chosen as the splitting attribute. If the splitting
    attribute is continuous-valued or we are limited to binary trees, we must determine
    a split point or a splitting subset as part of the splitting criterion, respectively.²
    The three popular attribute selection measures are


    *   *Information gain*


    *   *Gain ratio*


    *   *Gini index*


    An example of a decision tree structure is given in Figure [6-15](#532459_1_En_6_Chapter.xhtml#Fig17).


    ![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig17_HTML.jpg)


    A regression decision tree structure flows height, root node; next, color, true;
    color leads to branch at left and below to False and False. False is a leaf node.


    Figure 6-15


    Decision tree example


    *   A root node, branches, and leaf nodes are all included.


    *   Each internal node represents a test on an attribute.


    *   Each branch represents the test’s result, and each leaf node represents a
    class.


    Some of the benefits of employing decision tree classifiers include the fact that
    they do not require domain knowledge, are simple to understand, and are white
    boxes, meaning that we can quickly interpret decision tree models. This can be
    accomplished by extracting the decision tree’s rules. Outliers aren’t a problem
    for decision tree algorithms, and they can tolerate missing values.


    Overfitting is a risk of building depth trees on the training data when utilizing
    decision trees. When final splits are based on a tiny number of records, this
    is said to happen. Overfitting will result in poor performance while dealing with
    new data. To avoid overfitting, we can use the tree depth parameter, the least
    number of records in a terminal node, and the minimal decrease in impurity to
    stop the tree from growing before it starts overfitting the data. In our data
    partitioning, we can additionally prune the tree or utilize cross-validation.


    **Regression trees**


    Both numerical and categorical outcomes can be predicted using decision tree algorithms.
    Regression trees are used when the expected outcome is a numerical value. When
    using a regression tree to make a prediction, the predictor data is utilized to
    “drop” the record down the tree until it reaches a terminal node. The average
    outcome value of the training records in that terminal node determines the value
    of the terminal node in regression trees.


