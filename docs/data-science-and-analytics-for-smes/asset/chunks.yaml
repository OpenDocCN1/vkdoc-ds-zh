    ### 现实生活中的事件与描述


    分析能够为企业解决的问题，主要源于发现特定业务的需求，尤其是那些可通过分析来解决的需求。值得注意的是，在构建一个能产生成果的成功分析项目之前，你需要对业务领域有深入理解，并掌握该业务的典型成功策略，因为分析建议将被用于改进这一目标。根据所涉业务类型的不同，有多种方法可以发现其特定的分析需求。这些方法包括使用访谈、社交媒体（`文本挖掘`）、焦点小组等。同样重要的是，这些需求应聚焦于具体业务的目标。总体而言，业务分析有助于提升业务流程、降低业务成本、驱动业务战略，并监控与改善业务财务绩效。例如，优步（Uber）在
    2018 年初优化了其`客户至上工单助手（COTA）`，利用预测分析提高了响应支持工单的速度与准确性。这是实施业务分析的企业的一个绝佳案例。根据毕马威（KPMG）对新兴基础设施趋势的分析，许多公司现在都采用预测分析来预见维护与运营问题，避免其演变为重大故障。¹²


    在业务分析旅程的第一阶段，我们需要理解数据挖掘项目或业务分析项目的目标，特别是要弄清它是为了回答一个问题或多个问题的一次性努力，还是一个持续的过程。此后，我们需要明确要做出的决策，并确定或建议能够帮助决策的分析输出。这将有助于设计一个概念性的分析框架，以生成所需输出。


    概念性业务模型用于理解业务领域中的数据以及业务的实际运作方式。它特别有助于理解背景信息在解决分析问题中的重要性，同时也帮助我们理解关键要素之间的关联。由于业务分析是解决问题（即回答疑问），因此在此阶段了解在分析过程中哪些问题是值得提问的至关重要。概念性业务模型将帮助我们做到这一点。


    在处理现实世界事件的这一阶段，我们还需要理解究竟有哪些因素会贡献给我们用于分析项目的数据。例如，数据可能来自某人的购买行为，也可能来自产品或服务的使用。事实上，数据可能来自问题领域的任何方面。正如业务分析定义中所指出的，需要将重点放在有助于解决方案的数据上。并非仅仅拥有海量数据，而是要聚焦于解决所提出的问题或疑问所需的数据。以下场景给出了一个真实的中小企业（SME）业务示例，用以诠释分析旅程的这一阶段。


    **一个真实的业务问题：** *Alegria Recyclers Ltd（[www.alegriarecyclers.com.ng/](http://www.alegriarecyclers.com.ng/)）是一家处理废料回收的小型企业。Alegria
    只有两名正式员工和大约十名临时员工。该公司处理医院废弃物，如 X 光胶片。他们的客户是各类医院和诊所。数据科学家面临的任务是，为定位未来客户制定最佳的可执行策略。*


    *该业务的概念性业务模型如图 1-2 所示。它涵盖了业务的大部分活动。作为业务分析顾问，你需要通过首先构建概念性模型来理解你所咨询的业务；这将帮助你了解如何在业务领域捕获现实世界的事件，即所需的数据以及不同类型数据的重要性。它还将帮助你理解如何优化地使用分析结果，以便在分析项目中获得最佳成果。第一步是寻找潜在客户；在此环节，你需要探索过去合作过的客户类型数据，了解描述这些潜在客户的属性是什么，从不同类型客户那里获取何种材料等；所有这些信息，例如，有助于构建聚类模型，从而帮助
    Alegria 理解其潜在客户以及更多信息。在概念性模型的第二步中，该步骤涉及 Alegria 如何联系第一步中的潜在客户，你需要存储关于联系时间、地点等信息。对于剩余的每一步，如协商收集废弃物、收集废弃物、回收废弃物以及从废弃物中创收，你都需要提取出可能被捕获的数据属性。这就是你如何利用概念性业务模型全面理解业务领域数据的方法。*


    ![](img/532459_1_En_1_Fig2_HTML.jpg)


    该模型展示了从回收废弃物中创收这一业务理念的可行性。


    **图 1-2** Alegria Recyclers Ltd 的概念性业务模型

    '
- fmt: '### Capturing the Data


    After successfully identifying what will form the basis of your data and the type
    of data using the conceptual business models, the next thing is to capture the
    data and store it in a form that can be used for analytics. Capturing the data
    deals with the mechanism that captures the physical or digital representation
    of that real-world phenomenon and puts it somewhere. In this stage, there is a
    need to identify what is to be stored or retrieved (i.e., if the data has been
    stored before). Sometimes, it might involve feature selection and representation
    (which will be explained in Section [2.​1](#532459_1_En_2_Chapter.xhtml#Sec1)).


    The peculiarity of small businesses when it comes to capturing the data is that
    there is a lot of data literacy needed to be done due to the fact that most of
    these businesses are characterized with lack of an enterprise management system
    that manages their data; also, they particularly don’t know what the data needs
    of their business are. There is therefore a need for data integrity evangelism
    so as to get the best out of the analytics project. For this reason, the task
    of capturing data for analysis is a little challenging; most of the data is in
    the form of excel sheets that might not be particularly analytics ready.


    There are several data cleaning and preprocessing functions in Microsoft Excel
    which can be used. Also, there might be a need to use more interactive data visualization
    tools like Tableau (`www.tableau.com/`) and Power BI (`www.microsoft.com/en-us/download/details.aspx?id=58494`)
    for this purpose of capturing and preparing the data for analysis. There are other
    tools available for free or for a token on the Internet that can help capture
    small business processes which will help make available data at the back end that
    can jump-start the analytics process no matter how small the business is.


    Google Analytics, for example, can help small businesses, particularly ecommerce
    businesses, to create actionable strategies from automatically generated data
    from the ecommerce platform. This data can be used to measure marketing campaign
    performance, return on investment, and many more (`analytics.google.com`). For
    businesses that have been able to put the correct data gathering and governance
    procedures in place, the data capturing stage is much more easy to navigate as
    all that is left is to check the appropriateness of the data for the particular
    analytics goal.


    ### Accessible Location and Storage


    In this stage, you try to understand where the data you are working with comes
    from and then bring them together on one platform. There might be a need to pull
    data together from different databases which could be internal (e.g., past purchases
    made by customers) or external (credit ratings, census data, etc.). Most often,
    this is referred to as a data warehouse or enterprise data warehouse. Currently,
    there are a variety of emerging technologies to do this both physical and virtual.


    There are several sources that data might come from; we will learn more about
    this in the upcoming Section [2.​1](#532459_1_En_2_Chapter.xhtml#Sec1). In situations
    where enterprise management systems or software exist no matter how small, the
    primary source of data for business is the operational databases or application
    program as explained in the conceptual business model. There are other sources
    of data in business, for example, scannable barcodes, point-of-sale (POS) devices,
    mouse click trails, global positioning satellite (GPS), and so on. The Internet
    is also a rich source of external data, whether stored in databases or from social
    media platforms.


    ### Extracting Data for Analysis


    In preparation for analysis, a good question to answer is: How many variables
    and how much data do you need to use for your modeling? According to Galit et
    al. (2019, p. 29), we can have ten records for every predictor variable, and Delmaster
    and Hancock (2001, p. 68) also recommend that for classification procedures, we
    can have at least `6 × m × p` records, where `m` is the number of outcome classes
    and `p` is the number of variables.


    In extracting data for analysis, it’s important to sample data; this is important
    because it helps to get a good sample proportion out of the population since we
    have some algorithms that cannot handle large amounts of data for statistical
    analysis. Hence, representing a good sample proportion out of our population will
    be a good practice to perform analysis and come up with several hypotheses.


    Also while preparing your data for analysis, you would want to explore, clean,
    and preprocess the data, verify that the data are in reasonable condition, handle
    missing data, and check if the values of attributes are in reasonable range, given
    what you would expect from each variable. At this stage, you also want to check
    for outliers, normalize your data if necessary, and ensure consistency in the
    definitions of fields, units of measurement, time periods, and so on. Finally,
    at this stage, you want to handle categorical variables, converting to dummies
    where necessary.


    Another major step in preparing data for analysis is data visualization which
    will be explained in detail in Section [2.​5](#532459_1_En_2_Chapter.xhtml#Sec12).
    Visualization can help to take care of most of the data preparation steps mentioned
    earlier and is also used for variable derivation and selection. Visualization
    can help to determine the appropriate bin sizes in case binning of numerical variables
    will be needed and combine categories as part of the data reduction process. In
    case the cost of data collection is high, data visualization can be used to determine
    which variables and metrics are actually useful. The visualization also helps
    us to understand the data structure and clean the data to remove unexpected gaps
    or “illegal” values. Visualizations will also help to identify outliers, discover
    initial patterns, and come up with questions that can be explored in the course
    of the analysis.


    In extracting data for analysis, data reduction helps to eliminate variables that
    are not needed. In addition to this, feature extraction methods are used to reduce
    the data’s dimension and identify the majority of the components that represent
    the data. Data partitioning (in Chapter [6](#532459_1_En_6_Chapter.xhtml)) and
    transformation are very important in preparing our data for analytics. Data transformation
    is carried out in situations where you need to turn variables like amount earned
    into a range between N50,000 and N100,000. There are also situations where you
    need to create new variables from what you have, for example, creating a variable
    `true` or `false` capturing if a customer showed up or not from the purchase data
    on customers. It is also important for us to know what each variable means and
    whether to include it in the analysis or not.'
