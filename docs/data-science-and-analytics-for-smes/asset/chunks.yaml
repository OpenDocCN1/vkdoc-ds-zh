- fmt: "# K-Nearest Neighbor\n\nIn this section, we’ll look at the K-nearest neighbor\
    \ (KNN) algorithm and how it can help us obtain more clients using a practical\
    \ example. K-nearest neighbor can be used to predict both numerical and categorical\
    \ output. In this example, it will be used to predict the categorical output.\
    \ This is particularly because the task of getting more customers is a classification\
    \ task.\n\nKNN searches the training dataset for records that are “similar” for\
    \ the purpose of classifying or predicting a new record. By using averaging for\
    \ prediction as well as voting for classification, these “neighbors” are used\
    \ to produce a classification or prediction for the new record. The method is\
    \ to search the training data for records that are comparable to (or have values\
    \ similar to) the record we want to classify. We classify the one we wish to classify\
    \ based on the classes that these related records fall under.\n\n**How do we determine\
    \ these similar records (the neighbors)?**\n\nThe Euclidean distance is a distance\
    \ measurement that is extensively used. Between two records (`x[1], x[2]........x[p]`)\
    \ and (`u[1], u[2]....... u[p]`), the Euclidean distance is\n\n![$$ \\sqrt{{\\\
    left({x}_1-{u}_1\\right)}^2+{\\left({x}_2-{u}_2\\right)}^2\\kern0.5em +\\dots\
    \ \\dots \\dots \\dots \\dots ..+{\\left({x}_p-{u}_p\\right)}^{2\\kern1.5em }}\
    \ $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ7.png)\n\n(Eq.\
    \ 7.7)\n\n- Prior to computing a Euclidean distance, in most circumstances, the\
    \ predictors should be normalized so that the scales of each individual predictor\
    \ are equal.\n- It’s also worth noting that new records are standardized using\
    \ the mean and standard deviations from the training data, and the new record\
    \ is not included in calculating them.\n- Validation data, like new data, is excluded\
    \ from this calculation.\n\n**To classify, KNN uses the following rules:**\n\n\
    - If `k = 1` (the simplest case)\n  - We find the closest record (the nearest\
    \ neighbor) and classify the new record as being in the same class as its closest\
    \ neighbor.\n- If `k > 1`\n  - Locate the `k` neighbors that are closest to the\
    \ one being classified.\n  - Classify the record using a majority decision rule,\
    \ with the record being classified as a member of the `k` neighbors’ majority\
    \ class.\n\nIn business, KNN can be used in most classification scenarios and\
    \ works well when the available data is not much.\n\nIt is crucial to reduce the\
    \ amount of time to calculate distances while preprocessing data for the KNN algorithm\
    \ by working with fewer attributes. This is because the anticipated distance to\
    \ the nearest neighbor increases drastically with the number of predictors. To\
    \ reduce the attributes, we can apply different dimension reduction techniques.\
    \ Also, the number of records necessary in the training set to qualify for KNN\
    \ increases exponentially with the number of predictors. As a result, methods\
    \ such as selecting subsets of predictors for our model or merging them using\
    \ methods like principal component analysis, singular value decomposition, and\
    \ factor analysis are needed to reduce the number of predictors.³\n\n**Choosing\
    \ K**\n\nTo avoid overfitting owing to noise in the training data, the `k` value\
    \ chosen should be bigger than 1. Because it can suit the noise in the data, `K`\
    \ should not be too low. `K` should not be set too high, as this will prevent\
    \ the algorithm from capturing the data’s local structure. The optimal option\
    \ of `k` is determined by the data’s nature. The range of `k` values should be\
    \ between 1 and 20. To avoid ties, we’ll use odd numbers. The best categorization\
    \ performance determines the value of `K`. We classify the records in the validation\
    \ data using the training data, then compute error rates for different `k` values.\
    \ In `RapidMiner`, select `k` to be a small (between 1 and 14), positive, and\
    \ odd integer. Select several `k` and run the following process iteratively for\
    \ those `k` values till you get the one with the best accuracy.\n\nAlso, categorical\
    \ variables must be transformed to binary dummies before KNN can be employed,\
    \ and unlike statistical models such as regression, all binaries must be created\
    \ and used with KNN. It’s also important to normalize the features (due to the\
    \ use of Euclidean distance, for example).\n\nFor KNN, the data partitioning is\
    \ advised as follows:\n\n- **Training**: Develop the models for different values\
    \ of `k`, and then select the best value of `k`.\n- **Validation**: To be used\
    \ to evaluate the accuracy for each value of `k` using the training data and then\
    \ select the best value of `k`.\n- **Testing**: When the best value of `k` is\
    \ selected, then this is used to check the final accuracy.\n\nThe evaluation of\
    \ the KNN model can be done based on the methods for evaluating prediction or\
    \ classification as the case demand since it can be used for both.\n\n## Classification\
    \ example using KNN\n\nA picture frame designer would like to find a way of classifying\
    \ their customers in Lagos into those likely to purchase a family size frame and\
    \ those not likely to buy one. We will use a random sample of 12 families who\
    \ have purchased the frames and 12 who have not, living in Ibadan (a similar city).\n\
    \n![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig24_HTML.png)\n\nThe plot type\
    \ is set to boxplot, the value column set to income, and the group by family frames\
    \ feature a side-by-side boxplot.\n\n**Figure 7-17b** Side-by-side boxplot for\
    \ visualization for KNN (Income)\n\n![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig23_HTML.png)\n\
    \nThe plot type is set to boxplot, value column set to house area, and group by\
    \ family frames featuring a side-by-side boxplot.\n\n**Figure 7-17a** Side-by-side\
    \ boxplot for visualization for KNN (House Area)\n\n1. The data used for this\
    \ example is called `FramesData.xlsx`. Create a new **repository** and two **subfolders**\
    \ (`data` and `process`). Create a new process. **Import** the data and check\
    \ the **Statistics**. From the statistics, there are no missing values.\n\n2.\
    \ Visualization: Study the relation of outcome to numerical predictors via side-by-side\
    \ boxplots. The most separable boxes indicate potentially useful predictors. Figures\
    \ [7-17a](#532459_1_En_7_Chapter.xhtml#Fig23) and [7-17b](#532459_1_En_7_Chapter.xhtml#Fig24)\
    \ show a fair result in this regard.\n\n![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig25_HTML.png)\n\
    \nThe plot type is set to scatter, the x-axis column set to income, the value\
    \ column set to house area, and the color set to family frames.\n\n**Figure 7-18**\
    \ Color-coded scatter plot for Income and House Area\n\n1. For more visualization\
    \ for classification, we will use the color-coded scatter plot in Figure [7-18](#532459_1_En_7_Chapter.xhtml#Fig25).\n\
    \nUse the settings in Figure [7-19](#532459_1_En_7_Chapter.xhtml#Fig26) to check\
    \ the correlation, and the result is displayed in Figure [7-20](#532459_1_En_7_Chapter.xhtml#Fig27).\n\
    \n![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig27_HTML.jpg)\n\nThe Data tab\
    \ is displayed with a table listing the values for the corresponding attributes,\
    \ wherein some values are highlighted.\n\n**Figure 7-20** Correlation matrix output\
    \ for `FramesData.xlsx`\n\n![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig26_HTML.png)\n\
    \nThe process tab is displayed with retrieve frames data followed by a correlation\
    \ matrix where the mat is linked to res.\n\n**Figure 7-19** Correlation matrix\
    \ process for `FramesData.xlsx`\n\n![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig28_HTML.png)\n\
    \nThe parameters section of the process tab with a split set to relative, a split\
    \ ratio set to 0.6, and a sampling type set to automatic.\n\n**Figure 7-21a**\
    \ Main process of KNN"
  raw: '## 7.6 K-Nearest Neighbor


    In this section, we’ll look at the K-nearest neighbor (KNN) algorithm and how
    it can help us obtain more clients using a practical example. K-nearest neighbor
    can be used to predict both numerical and categorical output. In this example,
    it will be used to predict the categorical output. This is particularly because
    the task of getting more customers is a classification task.


    KNN searches the training dataset for records that are “similar” for the purpose
    of classifying or predicting a new record. By using averaging for prediction as
    well as voting for classification, these “neighbors” are used to produce a classification
    or prediction for the new record. The method is to search the training data for
    records that are comparable to (or have values similar to) the record we want
    to classify. We classify the one we wish to classify based on the classes that
    these related records fall under.


    **How do we determine these similar records (the neighbors)?**


    The Euclidean distance is a distance measurement that is extensively used. Between
    two records (x[1], x[2]........x[p]) and (u[1], u[2]....... u[p]), the Euclidean
    distance is


    ![$$ \sqrt{{\left({x}_1-{u}_1\right)}^2+{\left({x}_2-{u}_2\right)}^2\kern0.5em
    +\dots \dots \dots \dots \dots ..+{\left({x}_p-{u}_p\right)}^{2\kern1.5em }} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ7.png)


    (Eq. 7.7)


    *   Prior to computing a Euclidean distance, in most circumstances, the predictors
    should be normalized so that the scales of each individual predictor are equal.


    *   It’s also worth noting that new records are standardized using the mean and
    standard deviations from the training data, and the new record is not included
    in calculating them.


    *   Validation data, like new data, is excluded from this calculation.


    **To classify, KNN uses the following** **rules****:**


    *   If k = 1 (the simplest case)


    *   We find the closest record (the nearest neighbor) and classify the new record
    as being in the same class as its closest neighbor.


    *   If k > 1


    *   Locate the k neighbors that are closest to the one being classified.


    *   Classify the record using a majority decision rule, with the record being
    classified as a member of the k neighbors’ majority class.


    In business, KNN can be used in most classification scenarios and works well when
    the available data is not much.


    It is crucial to reduce the amount of time to calculate distances while preprocessing
    data for the KNN algorithm by working with fewer attributes. This is because the
    anticipated distance to the nearest neighbor increases drastically with the number
    of predictors. To reduce the attributes, we can apply different dimension reduction
    techniques. Also, the number of records necessary in the training set to qualify
    for KNN increases exponentially with the number of predictors. As a result, methods
    such as selecting subsets of predictors for our model or merging them using methods
    like principal component analysis, singular value decomposition, and factor analysis
    are needed to reduce the number of predictors.³


    **Choosing K**


    To avoid overfitting owing to noise in the training data, the k value chosen should
    be bigger than 1\. Because it can suit the noise in the data, K should not be
    too low. K should not be set too high, as this will prevent the algorithm from
    capturing the data’s local structure. The optimal option of k is determined by
    the data’s nature. The range of k values should be between 1 and 20\. To avoid
    ties, we’ll use odd numbers. The best categorization performance determines the
    value of K. We classify the records in the validation data using the training
    data, then compute error rates for different k values. In RapidMiner, select k
    to be a small (between 1 and 14), positive, and odd integer. Select several k
    and run the following process iteratively for those k values till you get the
    one with the best accuracy.


    Also, categorical variables must be transformed to binary dummies before KNN can
    be employed, and unlike statistical models such as regression, all binaries must
    be created and used with KNN. It’s also important to normalize the features (due
    to the use of Euclidean distance, for example).


    For KNN, the data partitioning is advised as follows:


    *   *Training*: Develop the models for different values of k, and then select
    the best value of k.


    *   *Validation*: To be used to evaluate the accuracy for each value of k using
    the training data and then select the best value of k.


    *   *Testing*: When the best value of k is selected, then this is used to check
    the final accuracy.


    The evaluation of the KNN model can be done based on the methods for evaluating
    prediction or classification as the case demand since it can be used for both.


    **Classification example using KNN**


    A picture frame designer would like to find a way of classifying their customers
    in Lagos into those likely to purchase a family size frame and those not likely
    to buy one. We will use a random sample of 12 families who have purchased the
    frames and 12 who have not, living in Ibadan (a similar city).


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig24_HTML.png)


    The plot type is set to boxplot, the value column set to income, and the group
    by family frames feature a side-by-side boxplot.


    Figure 7-17b


    Side-by-side boxplot for visualization for KNN (Income)


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig23_HTML.png)


    The plot type is set to boxplot, value column set to house area, and group by
    family frames featuring a side-by-side boxplot.


    Figure 7-17a


    Side-by-side boxplot for visualization for KNN (House Area)


    1.  The data used for this example is called *FramesData.xlsx*. Create a new ***repository***
    and two ***subfolders*** (data and process). Create a new process. ***Import***
    the data and check the ***Statistics***. From the statistics, there are no missing
    values.


    2.  Visualization: Study the relation of outcome to numerical predictors via side-by-side
    boxplots. The most separable boxes indicate potentially useful predictors. Figures
    [7-17a](#532459_1_En_7_Chapter.xhtml#Fig23) and [7-17b](#532459_1_En_7_Chapter.xhtml#Fig24)
    show a fair result in this regard.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig25_HTML.png)


    The plot type is set to scatter, the x-axis column set to income, the value column
    set to house area, and the color set to family frames.


    Figure 7-18


    Color-coded scatter plot for Income and House Area


    1.  For more visualization for classification, we will use the color-coded scatter
    plot in Figure [7-18](#532459_1_En_7_Chapter.xhtml#Fig25).


    Use the settings in Figure [7-19](#532459_1_En_7_Chapter.xhtml#Fig26) to check
    the correlation, and the result is displayed in Figure [7-20](#532459_1_En_7_Chapter.xhtml#Fig27).


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig27_HTML.jpg)


    The Data tab is displayed with a table listing the values for the corresponding
    attributes, wherein some values are highlighted.


    Figure 7-20


    Correlation matrix output for FramesData.xlsx


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig26_HTML.png)


    The process tab is displayed with retrieve frames data followed by a correlation
    matrix where the mat is linked to res.


    Figure 7-19


    Correlation matrix process for FramesData.xlsx


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig28_HTML.png)


    The parameters section of the process tab with a split set to relative, a split
    ratio set to 0.6, and a sampling type set to automatic.


