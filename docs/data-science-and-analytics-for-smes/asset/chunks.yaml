    \ prediction price, fuel types, age, kilometers, HP, met color, automatic, c c,\
    \ and doors.\n\n# Figure 6-23\n\n## Resulting dataset\n\n1.  The predicted prices\
    \ for the new data loaded are given in Figure [6-23](#532459_1_En_6_Chapter.xhtml#Fig32).\n\
    \n## 6.7 Conclusion on Sales Prediction\n\nAfter trying several combinations of\
    \ data attributes and algorithms, while checking for the best performance, there\
    \ is a need to conclude which of the experiments you will use for your conclusion.\
    \ In this case, we go with the algorithms that give the best prediction assuming\
    \ we have been able to take care of overfitting and all. From Figure [6-24](#532459_1_En_6_Chapter.xhtml#Fig33),\
    \ we see that the algorithm giving the lowest error that is the lowest value of\
    \ RMSE is the neural network.\n\n![](images/532459_1_En_6_Chapter/532459_1_En_6_Fig33_HTML.jpg)\n\
    \nA screenshot has values for M L R, R T, and N N root mean squared errors. Values\
    \ are 2949.808; 1362.617; and 1307.861 plus or minus 0.000 respectively.\n\n#\
    \ Figure 6-24\n\n## Comparing the results of the three algorithms\n\nIn business\
    \ applications, these models can be used in several ways, for example, it could\
    \ be embedded in an application which gives the process of the Toyota Corolla\
    \ in real time for making the decision concerning new customers and several others.\n\
    \n## 6.8 Problems\n\n1.  Using the MLR model in Figure [6-11](#532459_1_En_6_Chapter.xhtml#Fig11),\
    \ write the regression equation to predict for the transaction with the following\
    \ attribute values:\n\n`Age_08_04=29`, `KM=50000`, `Fuel_Type=Petrol`, `HP=100`,\
    \ `Met_Color=0`, `Automatic=1`, `CC=1800`, `Doors=4`, `Quarterly_Tax=80`, `Weight=1170`\n\
    \n2.  For solving the sales problem using the neural network in Section [6.5](#532459_1_En_6_Chapter.xhtml#Sec5),\
    \ explore each of the numerical variables using the histogram, and for anyone\
    \ that is skewed, first transform using the logarithm before normalization. Run\
    \ the neural network model in Section [6.5](#532459_1_En_6_Chapter.xhtml#Sec5)\
    \ again and compare your results to the one in Section [6.5](#532459_1_En_6_Chapter.xhtml#Sec5).\
    \ Which one has a higher accuracy?\n\n3.  Given the data sample named `FoodAgricGroup.xlsx`,\
    \ for each of the listed algorithm, create and evaluate models to predict Total\
    \ Amount (target attribute). Which model gives the highest accuracy?\n    1. \
    \ Neural network\n    2.  Multiple linear regression\n    3.  Regression trees\n\
    \nPresent the result obtained from each algorithm in detail for the following\
    \ stages:\n\n1.  Data visualization\n2.  Feature selection\n3.  Model development\n\
    4.  Model evaluation\n\n# 7. Classification Techniques\n\nIn this chapter, even\
    \ though there are several classification techniques, we will explore the popular\
    \ ones used for classification in the business domain. In doing this, we will\
    \ use the third business problem centered on customer loyalty using neural networks,\
    \ classification trees, and random forest algorithms. In solving this problem,\
    \ we are particular about how to get and retain more customers for our small business.\
    \ We will also introduce some other classification-based techniques such as K-nearest\
    \ neighbor and logistic regression. In using these techniques to solve the problem,\
    \ we explain the fundamental concepts in the chosen algorithms and use them to\
    \ demonstrate how these problem solving processes can be adopted in real business\
    \ scenarios."
