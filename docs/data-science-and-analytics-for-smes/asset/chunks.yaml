  trans: '

    ### 3.2 管理分析项目


    通常，一个分析项目会分为多个阶段；这些阶段将在第 4 章中详细介绍。但本节将涵盖与成功管理分析项目相关的一些重要问题。


    启动分析项目时，首先要做的事情是确定项目范围，特别是要清晰说明哪些事项属于项目边界之内。这应在项目开始时制定并记录在案。明确分析项目的目标有助于做到这一点。这有助于排除那些不属于你既定任务范围内的干扰和新增事项（即使它们很有价值）。如果这些新增事项很重要，那么就有了重新协商的基础。


    下一个也是有效管理分析项目最重要的事情，是建立与项目中所有相关方（从你的团队成员到利益相关者）进行有效沟通的程序；他们需要了解正在发生的事情，无论是好是坏，是否有进展。如有必要，你还需要建立一条升级上报的渠道，以防需要解决某些问题，例如，你在从相关方获取数据更新时遇到问题。与此密切相关的是，你需要能够使用任何你习惯的追踪应用程序来监控你的团队；这将使你能够定期获取更新，并在问题对分析过程造成更大损害之前识别并修复它们。这也有助于分析团队的沟通。最后，由于咨询的全部本质是通过用分析解决业务问题来赚钱，因此需要追踪投入到项目中的时间和财务成本，以便你能够准确计费，不过这也取决于你所选择的计费方式。


    除了上述内容，为了能够成功管理一个分析项目，你需要能够为现实世界的问题构思分析解决方案。这意味着，当问题以现实世界或真实业务问题的形式呈现在你面前时，你需要能够将其转化为一个分析问题（请注意，并非所有问题都能用分析解决），然后将解决方案分解为更小的组成部分，并将它们联系起来，以得出如图
    3-2 所示的总体结果。


    ![](img/532459_1_En_3_Fig2_HTML.jpg)


    该流程图展示了业务分析中的问题解决过程。现实世界问题被定义为分析问题，以得出总体结果。


    **图 3-2：** 分析问题解决过程


    在此需要指出的是，仅靠机器算法等并不足以从分析角度解决业务问题；必须将业务领域专业知识（市场营销、销售等）、技术专业知识（数据工程师、信息技术专家等）以及数据分析所涉及的技术技能结合起来。


    无论你咨询的客户业务规模大小，都需要将上述所有因素纳入你的分析项目，以确保其成功。


    ### 3.3 分析项目中的成功度量标准


    准确确定用于评估分析项目成功与否的度量标准非常重要，因为这有助于判断项目是否成功。不仅如此，它还将有助于向客户计费。作为顾问，需要利用过去的成功案例来竞标其他合同；因此，获取准确的成功度量标准将使这成为可能。尽管存在通用的成功度量标准，但用于衡量分析项目成功与否的最有效度量标准是由该特定项目的应用领域决定的。例如，如果你正在为一家电子商务企业提供咨询，其目标是提高销售额或收入，那么衡量成功的指标将包括
    `AOV`（平均订单价值）。再比如，在一家实体零售店，如果目标是增加客户群，那么由于实施分析项目的结果而新增的客户总数将是一个很好的度量标准。


    通常，对于一个数据科学项目，我们有以下几个度量标准：


    - **传统指标**：这类指标有助于我们了解相对于计划的执行情况。这包括检查要实现的目标的时间、预算和范围。

    - **敏捷指标**：这类指标有助于我们频繁地检查是否在提供价值。这可以通过包含周期时间和速度/速率指标来实现。

    - **财务指标**：这关乎组织是否因分析项目所取得的结果而真正增加了其财务价值。需要注意的是，这可能不仅要在项目完成时评估，还要在相关里程碑达成后进行评估。此类指标包括收入和成本指标、投资回报率等。

    - **组织目标**：你需要持续检查你的项目是否对组织目标产生影响，并满足利益相关者的期望。

    - **软件指标**：在分析项目转化为软件的情况下，你需要确保软件的质量（基于缺陷数量、延迟等）符合行业标准。

    - **模型性能指标**：根据你的分析项目所使用的模型类型，你需要基于适当的评估技术对其进行评估，例如，使用均方根误差（`RMSE`）、精确率和召回率等。


    '
- fmt: '# 3.4 Billing the Analytics Project


    First of all, it is important to say here that the billing in this section is
    talking from the perspective of a consultant outside the organization. Before
    billing any analytics consulting project, the very first thing to do is the initial
    analysis. The details of the initial analysis are covered in Chapter [4](#532459_1_En_4_Chapter.xhtml),
    Section [4.​1](#532459_1_En_4_Chapter.xhtml#Sec1). The initial analysis may or
    may not be billed depending on the state of your proposal.


    Sometimes, you might want to do an initial analysis for free to let the clients
    see the potential in buying into the analytics projects. If the situation is such
    that the client is already onboard and the initial analysis is such that it will
    involve some investment in time and resources as there is a need to troubleshoot
    some data-related issues, the initial analysis can be billed. The initial analysis
    is also billed in situations where it’s the client that called for the analysis.


    What the initial analysis helps to do in billing the analytics project includes
    the following:


    - First, it can be discovered, particularly with small businesses, that the data
    needed for the analytics project is not available; hence, the project cannot be
    carried out. Sometimes, after initial analysis, the best that can happen is to
    advise the clients on data governance procedures and revisit the project some
    other time.


    - Second, the initial analysis will help you to get the realistic goals of the
    analytics project and the metrics to be used to evaluate the success. This will
    help you know what the components of the billing will be. If, for example, the
    goal is to increase the number of customers, and the return on investment for
    a customer is known, you can have an agreement on what percentage to collect on
    each increase in customers. This method usually works when the client is not willing
    to put a downpayment on the analytics project, and you still want to go ahead
    because you see a potential success story (this is usually the case with really
    small businesses).


    - Third, the result of the initial analysis will help you to know the tasks involved
    in solving the problem and the amount of investment that will go into the project
    in terms of time, financial resources, and so on. All these have to be costed
    in detail and factored into the billing process. At this point, it is important
    to say that there might be a need to either have a business negotiator on your
    team or be educated in the art of negotiating. There are several online courses
    that could help here.


    Data science consultants often offer their analytics service as a product. The
    billing can then be done just as a normal product is billed. Product-based billing
    can be done by the client paying for what they got out of the service rendered.
    So if you provide your analytics service and the metrics show success, you are
    paid based on the agreed amount. To bargain with the future result of the analytics
    project, you need to be able to clearly define and measure what the analytics
    project will achieve. So in essence, clients can be charged for an analytics project
    based on percentage increase in success criteria.


    Note that there might be a need to make the agreement legal. Providing your analytics
    service as a product could also be putting it in stages of completion, that is,
    kickoff, update, milestones, and so on. These stages can be pitched as a product
    and billed.


    Also, an important warning is to beware of hidden costs of consulting, for example,
    when calculating the hours spent on the consulting project, some times spent on
    the analytics project might not be direct, for example, the time spent keeping
    up with the technology team, research, prospecting, accounting, proposals, marketing,
    internal trainings, code review, and so on. If you had to organize training, research
    and development, and so on, the time to do all these must be included in the cost.


    Sometimes, when consulting for a small business, you might even need to do a first
    implementation of recommendation, and when they see the results, you now can charge
    for continuous implementation.


    Finally, defining the scope of an analytics project is useful even in billing
    the clients as this will help to know where your analytics task starts and stops.
    Sometimes, when dealing with small businesses and because of the urge to get successful
    results, you might be tempted to go outside the typical boundaries of analytics,
    for example, gathering data, marketing, and so on, just to get your intended results.
    Depending on the situation at hand, this may or may not be part of the task, but
    it is important to state here that if it is, it should be factored into the billing
    both in terms of resources used and time spent.


    # 4. Business Analytics Consulting Phases


    This chapter will look at the stages involved in Business Analytics consulting,
    mainly when the analytics service is offered as a product from either within or
    outside the business. We will look at the proposal and initial stages of analysis
    that gives direction to the analytics project. Then we look at the details involved
    in the pre-engagement, engagement, and post-engagement phases. It is important
    to know that the stages are presented in a typical or generic way, but when implemented,
    there might be a reason to modify or customize them for the application scenario.'
  raw: '## 3.4 Billing the Analytics Project


    First of all, it is important to say here that the billing in this section is
    talking from the perspective of a consultant outside the organization. Before
    billing any analytics consulting project, the very first thing to do is the initial
    analysis. The details of the initial analysis are covered in Chapter [4](#532459_1_En_4_Chapter.xhtml),
    Section [4.​1](#532459_1_En_4_Chapter.xhtml#Sec1). The initial analysis may or
    may not be billed depending on the state of your proposal. Sometimes, you might
    want to do an initial analysis for free to let the clients see the potential in
    buying into the analytics projects. If the situation is such that the client is
    already onboard and the initial analysis is such that it will involve some investment
    in time and resources as there is a need to troubleshoot some data-related issues,
    the initial analysis can be billed. The initial analysis is also billed in situations
    where it’s the client that called for the analysis. What the initial analysis
    helps to do in billing the analytics project includes the following:


    *   First, it can be discovered, particularly with small businesses, that the
    data needed for the analytics project is not available; hence, the project cannot
    be carried out. Sometimes, after initial analysis, the best that can happen is
    to advise the clients on data governance procedures and revisit the project some
    other time.


    *   Second, the initial analysis will help you to get the realistic goals of the
    analytics project and the metrics to be used to evaluate the success. This will
    help you know what the components of the billing will be. If, for example, the
    goal is to increase the number of customers, and the return on investment for
    a customer is known, you can have an agreement on what percentage to collect on
    each increase in customers. This method usually works when the client is not willing
    to put a downpayment on the analytics project, and you still want to go ahead
    because you see a potential success story (this is usually the case with really
    small businesses).


    *   Third, the result of the initial analysis will help you to know the tasks
    involved in solving the problem and the amount of investment that will go into
    the project in terms of time, financial resources, and so on. All these have to
    be costed in detail and factored into the billing process. At this point, it is
    important to say that there might be a need to either have a business negotiator
    on your team or be educated in the art of negotiating. There are several online
    courses that could help here.


    Data science consultants often offer their analytics service as a product. The
    billing can then be done just as a normal product is billed. Product-based billing
    can be done by the client paying for what they got out of the service rendered.
    So if you provide your analytics service and the metrics show success, you are
    paid based on the agreed amount. To bargain with the future result of the analytics
    project, you need to be able to clearly define and measure what the analytics
    project will achieve. So in essence, clients can be charged for an analytics project
    based on percentage increase in success criteria. Note that there might be a need
    to make the agreement legal. Providing your analytics service as a product could
    also be putting it in stages of completion, that is, kickoff, update, milestones,
    and so on. These stages can be pitched as a product and billed.


    Also, an important warning is to beware of hidden costs of consulting, for example,
    when calculating the hours spent on the consulting project, some times spent on
    the analytics project might not be direct, for example, the time spent keeping
    up with the technology team, research, prospecting, accounting, proposals, marketing,
    internal trainings, code review, and so on. If you had to organize training, research
    and development, and so on, the time to do all these must be included in the cost.


    Sometimes, when consulting for a small business, you might even need to do a first
    implementation of recommendation, and when they see the results, you now can charge
    for continuous implementation.


    Finally, defining the scope of an analytics project is useful even in billing
    the clients as this will help to know where your analytics task starts and stops.
    Sometimes, when dealing with small businesses and because of the urge to get successful
    results, you might be tempted to go outside the typical boundaries of analytics,
    for example, gathering data, marketing, and so on, just to get your intended results.
    Depending on the situation at hand, this may or may not be part of the task, but
    it is important to state here that if it is, it should be factored into the billing
    both in terms of resources used and time spent.


    # 4. Business Analytics Consulting Phases


    This chapter will look at the stages involved in Business Analytics consulting,
    mainly when the analytics service is offered as a product from either within or
    outside the business. We will look at the proposal and initial stages of analysis
    that gives direction to the analytics project. Then we look at the details involved
    in the pre-engagement, engagement, and post-engagement phases. It is important
    to know that the stages are presented in a typical or generic way, but when implemented,
    there might be a reason to modify or customize them for the application scenario.'
  trans: '

    # 3.4 分析项目的计费


    首先，这里需要明确的是，本节所讨论的计费是从组织外部顾问的角度出发的。在任何分析咨询项目计费之前，首先要做的是初步分析。初步分析的细节涵盖在第 4 章，第
    4.​1 节中。初步分析是否计费，取决于你提案的具体情况。


    有时，你可能希望免费进行初步分析，以便让客户看到购买分析项目的潜在价值。如果情况是客户已经决定参与，并且初步分析需要投入一定的时间和资源，因为需要解决一些与数据相关的问题，那么初步分析可以计费。在客户主动要求分析的情况下，初步分析也同样需要计费。


    初步分析在分析项目计费中的作用包括以下几点：


    -   首先，通过初步分析可以发现，尤其是对于小型企业，分析项目所需的数据可能不可用；因此，项目无法开展。有时，初步分析之后，最好的做法是就数据治理流程向客户提供建议，并在其他时间重新审视该项目。


    -   其次，初步分析将帮助你确定分析项目的切实目标以及用于评估成功的指标。这将有助于你了解计费的组成部分。例如，如果目标是增加客户数量，并且已知每位客户的回报率，你可以就每增加一位客户收取多少比例的提成达成协议。这种方法通常适用于客户不愿为分析项目支付预付款，而你仍希望继续推进，因为你看到了潜在的成功的可能性（这种情况通常发生在非常小的企业中）。


    -   第三，初步分析的结果将帮助你了解解决问题所涉及的任务，以及在时间、财务资源等方面需要投入项目的投资量。所有这些都需要详细核算并纳入计费流程。在此有必要指出，你的团队中可能需要有一位商务谈判专家，或者你需要学习谈判技巧。有一些在线课程可以帮助你在这方面提升。


    数据科学顾问通常将他们的分析服务作为一种产品来提供。这样，计费就可以像普通产品一样进行。基于产品的计费方式可以是客户为他们从所提供服务中获得的价值付费。因此，如果你提供了分析服务，并且指标显示成功，你将根据约定金额获得报酬。为了用分析项目的未来结果进行谈判，你需要能够清晰地定义和衡量分析项目将实现的目标。因此，本质上，可以根据成功率提升的百分比来向客户收取分析项目的费用。


    请注意，可能需要将协议法律化。将你的分析服务作为产品提供，也可以将其分解为多个完成阶段，例如启动、更新、里程碑等。这些阶段可以作为一个产品来推销和计费。


    此外，一个重要的警告是，要警惕咨询中的隐性成本，例如，在计算咨询项目上花费的时间时，有些用于分析项目的时间可能并非直接投入，比如与技术团队沟通、研究、勘探、会计、提案、营销、内部培训、代码审查等。如果你需要组织培训、研发等，完成这些工作所需的时间也必须计入成本。


    有时，当为小型企业提供咨询时，你可能甚至需要首先实施一项建议，当他们看到结果后，你才能收取持续实施的费用。


    最后，明确分析项目的范围对于客户计费也是有用的，因为这有助于确定你的分析任务从哪里开始到哪里结束。有时，在与小型企业打交道时，由于急于获得成功的结果，你可能容易受到诱惑而超越分析的传统边界，例如，为了获得预期结果而去收集数据、进行营销等。根据具体情况，这可能属于任务的一部分，也可能不属于。但需要在此明确指出，如果属于，那么所使用的资源和花费的时间都应纳入计费考量。


    # 4. 商业分析咨询阶段


    本章将探讨商业分析咨询所涉及的各个阶段，主要是指在分析服务作为产品（无论是来自企业内部还是外部）提供时的情况。我们将探讨为分析项目指明方向的提案和初步分析阶段。接着，我们来看预参与、参与和参与后阶段所涉及的细节。需要明白的是，这些阶段是以典型或通用的方式呈现的，但在实际实施时，可能需要根据应用场景对其进行修改或定制。

    '
- fmt: '### 4.1 Proposal and Initial Analysis


    Before coming up with a proposal pitch, which will probably be the first time
    you interact with the organization, you have to do a research on the organization
    or SME to get some background information that will help your analytics proposal.
    In the proposal, the background information will help you to know and highlight
    the problems you plan to solve for the organization. Though this is not compulsory,
    it could help grab the attention of the stakeholders and make them interested
    in investing in the analytics project. The major hindrance to jump-starting the
    analytics project with SMEs is that the stakeholders don’t see a need or an urgency
    to invest in such a project at the moment given the fact that they are still making
    some income based on their present methodology. The onus now lies on the consultant
    to convince them on the transformation and achievement that data analytics could
    bring about. In situations where this stage is not needed (i.e., the stakeholders
    are already onboard), you can just have a brief introduction meeting which will
    detail the analytics procedure and elicit the kind of problems that are relevant
    to the business. It will also help at this point to get feedback from the stakeholders
    and know what is on their mind and what they hope to achieve with the analytics
    project. Though there are situations where the stakeholders might not know what
    constitutes analytics problems, they will definitely know the needs of the organization.
    At this stage, very good presentation skills will be needed to get your proposal
    accepted. At the proposal stage, it will help to present problems that have been
    customized for the business in particular. The consultant needs to be careful
    at this stage not to give false hope or to propose to solve problems for which
    data resources are not available, all in a bid to get the proposal accepted.


    In the initial analysis stage, you want to find out what is available in terms
    of the data, data quality, and integrity. This is the stage where you explore
    the proposed problems with respect to the data to be used in solving each of the
    problems. At the end of this phase, you should be able to give a detailed report
    of what is achievable given the available data. Also, in the initial analytics
    stage, you need to understand the organization’s operational procedure (conceptual
    business model) as explained under the Business Analytics journey in Section [1.​3](#532459_1_En_1_Chapter.xhtml#Sec3)
    of Chapter [1](#532459_1_En_1_Chapter.xhtml). This will enable you to be able
    to understand the optimization approaches for the proposed analytics models and
    how the result of your analytics will fit into the organization or business process.
    You will also be able to discover when and who will be responsible for implementing
    your recommendation and so on. With this, you are able to know who is to be involved
    in the communication stages of the analytics project. After the initial analysis,
    you should also be able to give an idea of what are the expected outcomes of the
    analytics project at a high level of abstraction and advice on best data practices
    for the organization. The tasks involved in the initial analysis stage can be
    summarized as follows:


    - Discovery and assessment of the available data (internal and external) for analytics
    and the quality.

    - Highlight the details on how to access the data available.

    - Understand the organizational database and stage the process of integrating
    the data for analysis if need be.

    - Discover the analytics obtainable from the current data.

    - Highlight the decision objectives and determine the analytics output that will
    help to make an intended decision feasible, given the available data.


    The output of the initial analysis stage includes:


    - Documentation on the detailed discoveries as regards the current data available
    and obtainable and an abstraction of what benefits can be obtained from it.

    - Advice on the data platform upgrades and integration, particularly toward future
    analytics.

    - Specific highlights of the objectives of the analytics project, decisions that
    can be made, and the analytics output that will help to make such decisions feasible
    given the available data.

    - Projects that will be carried out, stating the milestones, deliverables, costs,
    and expected ROIs.


    At this stage, you need to make it clear that the analytics project is an iterative
    process, which means that you might need to make recommendations which will be
    implemented and evaluated and, if necessary, repeated. This initial analysis will
    help to:


    - Learn what is possible with your data.

    - Have a fresh set of eyes on your current data pipelines, warehouses, and analytics
    strategy.

    - Give advice on data platform upgrades.


    In the initial analysis stage, you want to understand whatever data is available,
    that is, inquiring with subject matter experts about what field names might mean
    and seeking internal tribal knowledge of data source usage. There might even be
    a need to explore whatever data was given at this stage to know its feasibility
    to solve the problem because it is not uncommon to land in situations where the
    data you discovered from the inception is not as rich as you thought it would
    be for analysis.


    Take note that during the initial analysis, you need to be able to determine how
    to avoid wasting time on unrealistic clients and let go of a project if it will
    not lead to a success story whether based on data resources or the negative business
    environmental situations. Finally, learn to navigate hype and unrealistic expectations.
    The rest of the analytics project is captured in three phases as presented in
    Figure [4-1](#532459_1_En_4_Chapter.xhtml#Fig1). Just as mentioned earlier, this
    can be customized and expanded based on the nature of the individual analytics
    project. For the remaining part of this chapter, we will pick each of the stages
    one after the other and explain them in detail.


    ![A photograph represents three phases of an analytics project. Duration is three
    to six months and phases include pre-engagement, engagement, and post-engagement
    phases.](images/532459_1_En_4_Chapter/532459_1_En_4_Fig1_HTML.png)


    **Figure 4-1** Analytics consulting phases


    A typical analytics project consists of three major phases as revealed in Figure
    [4-1](#532459_1_En_4_Chapter.xhtml#Fig1). The whole duration for the project varies
    based on the data situations and many other factors in the business domain, but,
    typically, it should cover an average of three to six months in which the post-engagement
    phase should be given at least three months. A good example of the IBM consulting
    process can be found at [`https://365datascience.com/trending/ibm-data-science-consulting/`](https://365datascience.com/trending/ibm-data-science-consulting/).'
