- fmt: "1.  Load the `edgeslistStaff.csv` into Gephi, and set the Graph Type to Undirected.\
    \ Import the second csv file (`nodeslabelStaff.csv`) using Import Spreadsheet\
    \ under the File menu. When importing `nodeslabelStaff.csv`, make sure to append\
    \ to existing workspace. Figure 8-41 shows the resulting interface after this\
    \ step is successfully done.\n\n![A computer screenshot illustrates the output\
    \ after running the Fruchterman Reingold algorithm and expanding the network.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig45_HTML.png)\n\
    \n**Figure 8-42**  \nExpanding the network\n\n2.  Run Fruchterman-Reingold and\
    \ then the expansion to give Figure 8-42.\n\n![A computer screenshot demonstrates\
    \ the exported data in an excel sheet.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig47_HTML.png)\n\
    \n**Figure 8-44**  \nExported data in Excel\n\n![A network graph illustrates the\
    \ final staff communication network. It informs that the node Tobi has the highest\
    \ degree in the communication network of the organization.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig46_HTML.png)\n\
    \n**Figure 8-43**  \nThe final staff communication network\n\n3.  Run the Statistics\
    \ (Prestige, Average Degree, Avg. Weighted Degree, Network Diameter, Graph density,\
    \ Modularity, Connected Components, Eigenvector centrality). In the Appearance\
    \ window, click **size** → **Ranking** and choose attribute `degree-min-1`, `max-50`.\
    \ (You can try several variations and see the one that suits your purpose).\n\
    4.  Click show node labels; adjust the size of nodes to make it bigger. There\
    \ are so many things you can explore in the Appearance, Layout, and Statistics\
    \ windows to have a beautiful and attractive network and also communicate different\
    \ insight. As an example, we can visualize the clusters in the network by using\
    \ the settings **Nodes** → **Color** → **Partition** → **Modularity**. Click Preview\
    \ (show node label in the preview); the final network should look like Figure\
    \ 8-43.\n\nThe color of the node indicates the cluster that each node belongs\
    \ to, while the sizes indicate their degrees. The network graph in Figure 8-43\
    \ shows that the node Tobi has the highest degree in the organization’s communication\
    \ network; this indicates that a lot of nodes in this organization communicate\
    \ with Tobi. The implication of this, for example, is that in such an organization,\
    \ there is a need to ensure that such a node does not break down.\n\n5.  Click\
    \ the Data Laboratory, export the Nodes table in csv format, and open in Excel\
    \ for further analysis. Figure 8-44 is the exported data opened in Excel.\n\n\
    ![A computer screenshot displays the window to add the data analysis tool in the\
    \ excel sheet to correlate network size with performance.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig48_HTML.jpg)\n\
    \n**Figure 8-45**  \nData analysis in Excel\n\n6.  Use correlation analysis in\
    \ Excel to correlate the degree (network size) with performance. To do this, hold\
    \ the ALT key and type `t` and type `I` in succession, and you will see the window\
    \ to add the data analysis tool in Figure 8-45.\n\n![A computer screenshot portrays\
    \ an excel workbook with the values filled for 27 rows and 15 columns.](images/532459_1_En_8_Chapter/532459_1_En_8_Fig49_HTML.png)\n\
    \n**Figure 8-46**  \nCorrelation Analysis in Excel\n\n7.  Click **OK**; click\
    \ **Data Analysis** on the tools bar, select correlation, and select the input\
    \ range and new workbook as the output option (Figure 8-46).\n8.  Click **OK**.\
    \ This results in a correlation value of `0.293707089965323` between degree and\
    \ `salesperquarter` (millions). The interpretation of this from Pearson’s correlation\
    \ is that the strength of variables is poorly related though positive. (Assuming\
    \ the data is such that the correlation is +1 to 0.7, then the strength of the\
    \ variables is perfectly related in a positive way, and we can then go ahead to\
    \ look at how to increase the collaborations by providing motivations to build\
    \ ties.)\n\n## 8.7 Problems\n\n1.  Repeat the practical business problem V, using\
    \ the same data (`nodeslabelStaff.csv`); this time around, correlate the centrality\
    \ measures with the performance.\n2.  Using the dataset `VegetableTransactions.csv`,\
    \ perform an association rule analysis, and comment on the results. Select the\
    \ most important rules using the necessary criteria and give appropriate interpretation\
    \ to the selected rules.\n3.  Using the data named `Alegra.xlsx`, perform clustering\
    \ analysis using the k-means clustering algorithm. Validate, visualize, and interpret\
    \ the resulting clusters.\n\n# 9. Case Study Part I\n\nThis chapter is the beginning\
    \ part of the major consulting case study for this book. We will explain a typical\
    \ Business Analytics consulting project and create a road map or an example of\
    \ how to navigate a Business Analytics consulting project. We start with a description\
    \ of the SME ecommerce environment generally, since this is the business environment\
    \ of our selected case study; we then talk about the sources of data for analytics\
    \ peculiar to this environment. Next, we describe the business to be used as a\
    \ case study briefly, followed by the analytics road map peculiar to consulting\
    \ for this business. This chapter ends with the results of the initial analysis\
    \ and pre-engagement phase which forms the basis for the detailed analytics and\
    \ implementation phase in Chapter 10."
