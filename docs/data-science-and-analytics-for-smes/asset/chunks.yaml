    Data analysis in Excel


    1.  Use correlation analysis in Excel to correlate the degree (network size) with
    performance. To do this, hold the ***ALT key*** and ***type t*** and ***type I***
    in succession, and you will see the window to add the data analysis tool in Figure
    [8-45](#532459_1_En_8_Chapter.xhtml#Fig48).


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig49_HTML.png)


    A computer screenshot portrays an excel workbook with the values filled for 27
    rows and 15 columns.


    Figure 8-46


    Correlation Analysis in Excel


    1.  Click ***OK***; click ***Data Analysis*** on the tools bar, select correlation,
    and select the input range and new workbook as the output option (Figure [8-46](#532459_1_En_8_Chapter.xhtml#Fig49)).


    1.  Click ***OK***. This results in a correlation value of 0.293707089965323 between
    *degree* and *salesperquarter (millions)*. The interpretation of this from Pearson’s
    correlation is that the strength of variables is poorly related though positive.
    (Assuming the data is such that the correlation is +1 to 0.7, then the strength
    of the variables is perfectly related in a positive way, and we can then go ahead
    to look at how to increase the collaborations by providing motivations to build
    ties.)


    ## 8.7 Problems


    1.  Repeat the practical business problem V, using the same data (nodeslabelStaff.csv);
    this time around, correlate the centrality measures with the performance.


    2.  Using the dataset VegetableTransactions.csv, perform an association rule analysis,
    and comment on the results. Select the most important rules using the necessary
    criteria and give appropriate interpretation to the selected rules.


    3.  Using the data named Alegra.xlsx, perform clustering analysis using the k-means
    clustering algorithm. Validate, visualize, and interpret the resulting clusters.


    # 9. Case Study Part I


    This chapter is the beginning part of the major consulting case study for this
    book. We will explain a typical Business Analytics consulting project and create
    a road map or an example of how to navigate a Business Analytics consulting project.
    We start with a description of the SME ecommerce environment generally, since
    this is the business environment of our selected case study; we then talk about
    the sources of data for analytics peculiar to this environment. Next, we describe
    the business to be used as a case study briefly, followed by the analytics road
    map peculiar to consulting for this business. This chapter ends with the results
    of the initial analysis and pre-engagement phase which forms the basis for the
    detailed analytics and implementation phase in Chapter [10](#532459_1_En_10_Chapter.xhtml).'
