  trans: '

    # 树状图


    树状图通过嵌套矩形来展示数据，可用于可视化分类属性的规模。分类属性中的每个类别对应一个矩形，而每个类别中的数值则决定了这些矩形的大小。


    ## 在 RapidMiner 中创建树状图


    ![](img/532459_1_En_5_Fig13_HTML.png)


    图形类型设置为`树状图`，值列设置为`年龄`，选择聚合数据，`分组依据`设置为`喜欢数学`，聚合函数设置为`计数`。


    **图 5-13** — 树状图


    1.  要创建树状图，将使用名为 `OnlineQuestion1.xls` 的数据。（请注意，本课程使用的免费 RapidMiner 版本配置不允许可视化超过
    2000 行的树状图。）

    2.  使用图 5-13 所示的设置创建树状图。**值列**（y 轴）设置为`年龄`，**分组依据**设置为`喜欢数学`（正在研究的分类属性），**聚合函数**设置为`计数`，以显示矩形的大小是如何确定的。

    3.  从图 5-13 可以看出，`是`的计数最高，这由最大的蓝色矩形表示。其次是`可能`，以此类推。


    # 热图


    热图是一种数值数据的图形显示方式，其中使用颜色来表示数值。它们对于可视化相关表格和数据中的缺失值特别有用。为此，信息会在一个二维表格中呈现。一组属性的相关性表格具有相同的行数和列数。如果属性数量很多，则可以使用属性的一个子集。热图使通过颜色代码快速扫描相关性值变得简单快捷。


    ## 在 RapidMiner 中创建热图


    ![](img/532459_1_En_5_Fig14_HTML.png)


    图形类型设置为热图，值列列出`年龄`、`应付金额`、`消息`和`已迁移 _AD`。


    **图 5-14** — 缺失数据的热图


    1.  为了创建用于可视化缺失数据的热图，例如，我们将使用名为 `OnlineQuestion1.xls` 的数据，并按照图 5-14 所示进行设置。**图形类型**为热图，选择的属性是`年龄`、`应付金额`、`消息`和`已迁移
    _AD`。我们将在第 6 章中探讨用于相关性的热图。

    2.  在图 5-14 中，根据所选属性，数据中的整行（223 行）都被显示出来。特定属性的缺失数据以白色表示。像这样可视化数据有助于了解有多少数据缺失。例如，很少有包含缺失数据的单元格。


    # 地理地图


    地图基本上是数据的地理表示。某些类型的推论只有在数据以地理方式可视化时才能最好地实现。


    ## 在 RapidMiner 中创建地理地图


    ![](img/532459_1_En_5_Fig15_HTML.png)


    图形类型设置为点地图，选择地图设置为`尼日利亚`，并分别选择`纬度`和`经度`。


    **图 5-15** — 定位客户的点地图


    1.  为了演示，我们将使用 `customersNigeria.xls` 数据。该数据包含某个特定企业的客户及其位置信息。

    2.  要创建地理地图，请将数据导入到您的存储库中；在设计视图中，将数据链接到结果（`res`），然后运行流程，在生成的结果界面（`结果`）上，点击可视化选项卡。

    3.  按照图 5-15 所示进行设置。**图形类型**为点地图；**选择地图**为`尼日利亚`。**纬度**是`纬度`，**经度**是`经度`。

    4.  从图 5-15 中，我们可以轻松推断出尼日利亚客户的位置集中情况。

    5.  还可以探索其他类型的地图，例如用于通过颜色渐变显示与区域（例如国家或州）相关联的数值的等值线图，或用于可视化属于多个不同类别的区域的分类地图⁷。


    需要说明的是，出于演示目的，我们仅选择了一些常用工具，并使用最常见的设置进行可视化。根据分析目标，还可以使用其他设置。此外，还有其他更具交互性的可视化工具，例如
    Tableau 和 Power BI，值得探索。

    '
- fmt: '## 5.11 A Practical Business Problem I (Simple Descriptive Analytics)


    This is the first out of the five business problems addressed in this book.


    **Problem scenario**: In this problem, we use an ecommerce business as a case
    study. Let us assume that we have a business that sells clothes online. The data
    (`SuperstoreNigeria.xls`) used contains the record of sales. The task is to use
    descriptive analytics tools to describe what happened in the past and what things
    look like currently. Our intention is to be able to use the result to understand
    the business environment and make better sales decisions. The data contains the
    attributes: `Row ID`, `Order ID`, `Order Date`, `Ship Date`, `Ship Mode`, `Customer
    ID`, `Segment`, `Country`, `State`, `Postal Code`, `Region`, `Product ID`, `Category`,
    `Sub-Category`, `Sales`, `Quantity`, `Discount`, `Profit`. In this problem, we
    intend answering the following questions:


    1. What is the sum of sales for each subcategory for each region?

    2. How does sales compare with profit from 2014 to 2017?

    3. Which states are making high profits and which states are making a loss (use
    geographic map)?

    4. What is the relationship between discount, sales, and profit?

    5. In what category, subcategory, and State of Nigeria are the highest sales made?


    **Solution**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig17_HTML.png)


    A bar chart plots the sum of sales versus subcategories. The bars are plotted
    for the regions of south, west, central, and east.


    **Figure 5-16b** Comparing region, sales, and subcategory


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig16_HTML.jpg)


    The plot type is a bar, the value column is sales, aggregate data selected, group
    by sub-category, aggregation function is the sum, and the color group is a region.


    **Figure 5-16a** Settings for comparing region, sales, and subcategory


    1. *What is the sum of sales for each subcategory for each region?* The intention
    behind this question is to know what particular subcategory of their products
    gives them the highest sales and where (as regards region) this is happening.
    The first thing to do is to **Import** `SuperstoreNigeria.xls` and drag it to
    the design view, run the process, and in the **Results** interface, click visualization.
    To answer this question, we will use the bar chart. Figure [5-16a](#532459_1_En_5_Chapter.xhtml#Fig16)
    gives the setting for the answer to this question. From Figure [5-16b](#532459_1_En_5_Chapter.xhtml#Fig17),
    which is the bar chart visualization, we can see that the East Region is having
    the highest total sales for categories: copiers, machines, phones, storage, and
    book cases. The West Region is having the highest total sales for categories:
    supplies, accessories, tables, and chairs. Overall, the West Region has the highest
    sales in the chairs subcategory. This information can help to know what products
    to keep producing in large quantities in the future and which region to target.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig18_HTML.png)


    The plot type is set to line, the value columns are sales profit, aggregate data
    is selected, groups are made by order date, and the aggregation function is the
    sum.


    **Figure 5-17** Comparing profits and sales over time


    2. *How does sales compare with profit from 2014 to 2017?* The intention behind
    this question is to know if sales are actually translating to profit within a
    particular period of time. To answer this question, we will use the line graph.
    Figure [5-17](#532459_1_En_5_Chapter.xhtml#Fig18) gives the setting for the answer
    to this question. Note that to answer this question, it is more logical to use
    the sum of the profits and sales made. The answer in Figure [5-17](#532459_1_En_5_Chapter.xhtml#Fig18)
    shows that there is no particular linear trend that can be observed between the
    sales and the profit with respect to time.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig19_HTML.png)


    The plot type is choropleth map, the value column is profit, the aggregate function
    is the sum, join by state and the join key is the name. Show entire map is selected.


    **Figure 5-18** Profit and loss per region


    3. *Which states are making high profits and which states are making a loss?*
    The answer to this question can help to determine which state to focus on, for
    example, when marketing, so as to get more profit, and if, for example, they are
    making loss in a state and spending more marketing resources in that state, it
    might be wise to further investigate why this is so. To answer this question,
    we will use geographic maps. Figure [5-18](#532459_1_En_5_Chapter.xhtml#Fig19)
    gives the setting for the answer to this question. From Figure [5-18](#532459_1_En_5_Chapter.xhtml#Fig19),
    we can see that Lagos has the highest sales in total.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig20_HTML.png)


    The plot type is set to line, the value column is set to discount, profit, group
    by row I D, the aggregation function is the sum, and no stacking is selected.


    **Figure 5-19a** Discount and profit (using the original values)


    4. *What is the relationship between the discount given and the profit made?*
    The intention behind this question is to know if the discount offered is translating
    to the profit that is being made, given that the whole idea behind discount is
    to make more sales and eventually make more profit for the organization. The answer
    to the question is revealed by using the settings in Figure [5-19a](#532459_1_En_5_Chapter.xhtml#Fig20).
    To answer this question, we are using the total discount and total sales for each
    unique `Row ID`, to get the holistic view of the result.


    Unfortunately, due to the discount having smaller values than profit, it is almost
    not showing up in the graph. We have to select the logarithmic scale to see the
    discount as revealed in Figure [5-19b](#532459_1_En_5_Chapter.xhtml#Fig21). From
    Figure [5-19b](#532459_1_En_5_Chapter.xhtml#Fig21), we see that there is no linear
    trend that is observed between the discount and the profit.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig21_HTML.png)


    The chart display mode is set to regular, y 1 is set to logarithmic, the show
    title is selected, and the horizontal position is set to center.


    **Figure 5-19b** Discount and profit (using the normal values)


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig22_HTML.png)


    The plot type is set to a horizontal bar, the value column is sales, group by
    sub-category, the aggregation function is the sum, and the color group is set
    to category.


    **Figure 5-20** Category, subcategory, and sales


    5. *In what category or subcategory is the highest sales made?* The intention
    behind this question is to know the category, subcategory in particular, that
    is giving the highest sales. The answer to the question is revealed in the settings
    in Figure [5-20](#532459_1_En_5_Chapter.xhtml#Fig22). The subcategory giving the
    highest sales is the phones, and it belongs to the category of technology. The
    answer to this question can help reveal the bestselling subcategory and category
    irrespective of the region, etc.'
