  trans: '

    # 7.1 分类模型与评估


    数据分析的一个重要环节是对收集到的数据进行分类。分类是一种监督式机器学习方法，它能够推导出适用于此类情况的模型。这种模型被称为分类器，用于预测分类（离散、无序）的类别标签。一个典型的例子是预测顾客是否会离开零售商店。分类模型已广泛应用于商业领域，例如欺诈检测、客户定向营销、员工绩效预测等。分类模型通过两步流程工作：第一步是利用带标签的数据集（训练数据）构建模型；第二步是利用该模型对未来的未知对象进行分类（在验证数据集中，这些对象的标签已知，但通过新开发的模型进行预测）。在此步骤中，我们通过将结果与验证数据集中的原始标签（已知）进行比较来评估模型的准确率。验证数据集必须独立于训练集；否则会导致过拟合。


    在分类过程中，当各类别的比例极不平衡时，就会出现欠采样问题；随机采样可能产生过少的稀有类别样本，从而难以获取将其与主导类别区分开来的有效信息。为避免这些挑战，可以采用分层抽样。分层抽样用于从可划分为子部分的数据中进行抽样²。数据被划分为同质的子部分，称为层（stratum
    的复数形式）。


    我们必须对分类器进行评判，因为存在多种类型的分类器和预测方法，而在每种方法内部，通常又有多种可能产生完全不同结果的替代方案。*误分类错误*的概率用于评估分类器的性能。当一条记录被错误分类时，意味着模型将其归入了不属于它的类别。


    评估分类器性能的指标如下：¹


    准确率和识别率


    ![$$ \frac{TN+ TN}{P+N} $$](img/532459_1_En_7_Chapter_TeX_Equ1.png)


    （公式 7.1）


    错误率，误分类率


    ![$$ \frac{FN+ FN}{P+N} $$](img/532459_1_En_7_Chapter_TeX_Equ2.png)


    （公式 7.2）


    灵敏度，真正率，召回率


    ![$$ \frac{TP}{P} $$](img/532459_1_En_7_Chapter_TeX_Equ3.png)


    （公式 7.3）


    特异度，真负率


    ![$$ \frac{TN}{N} $$](img/532459_1_En_7_Chapter_TeX_Equ4.png)


    （公式 7.4）


    精确率


    ![$$ \frac{TP}{TP+ FP} $$](img/532459_1_En_7_Chapter_TeX_Equ5.png)


    （公式 7.5）


    F、F1、F-score，精确率和召回率的调和平均数


    ![$$ \frac{2\ x\ precision\ x\ recall}{precision+ recall} $$](img/532459_1_En_7_Chapter_TeX_Equ6.png)


    （公式 7.6）


    真正例、真负例、假正例、正例样本和负例样本这些术语分别缩写为 `TP`、`TN`、`FP`、`P` 和 `N`。


    - **真正例（`TP`）**：是被分类器正确标记的正例元组。

    - **真负例（`TN`）**：是被分类器正确分类的负例元组。

    - **假正例（`FP`）**：是被错误分类为正例的负例元组。

    - **假负例（`FN`）**：是被分类为负例的正例元组。


    混淆矩阵用于汇总分类器在给定数据集上产生的正确与错误分类情况，该矩阵通过验证数据集来分析分类器的性能。在表 7-1 中，混淆矩阵展示了 `TP`、`TN`、`FP`
    和 `FN`。分类器的性能可以通过混淆矩阵进行评估，这是检验分类器检测不同类别元组效果的有效工具。分类器的 `TP` 和 `TN` 表明其正确分类，而 `FP`
    和 `FN` 则分别表明其错误分类。`Fbeta` 度量是 `F` 度量的泛化形式，它增加了一个名为 beta 的配置参数。当精确率和召回率都很重要，但需要略微侧重其中一方时（例如，假负例比假正例更重要，或反之），便会使用
    `Fbeta`。


    **表 7-1** 混淆矩阵


    | 实际类别 | 预测类别 | | |

    | --- | --- | --- | --- |

    | | | 是 | 否 |

    | 是 | | `TP` | `FN` |

    | 否 | | `FP` | `TN` |


    ## 分类的倾向性与截断值


    一些分类算法首先计算记录属于每个类别的概率。概率的另一个说法是“倾向性”。倾向性常被用作预测类别归属（分类）的第一步，或根据属于目标类别的概率对记录进行排序。为确保所有类别都准确，记录可能会被划归到最可能属于它的类别（概率最大的类别）。当存在大量记录且只关注单个类别时，需专注于该类别，并将属于该类别的倾向性（概率）与分析人员确定的截断值进行比较。如果属于目标类别的概率大于截断值，则该记录被划归到目标类别。在二分类器中，默认的截断值为
    0.5。³

    '
- fmt: '## 7.2 Practical Business Problem III (Customer Loyalty)


    Customer loyalty is described as the habit of repeatedly choosing a certain brand’s
    or company’s products or services notwithstanding the availability of a comparable
    product or service from another company, commonly referred to as a competitor.
    Loyal customers can never be swayed by the cost, pricing, or surplus of products
    from competitors. They would rather pay a higher price for the same high-quality
    service and product they are accustomed to. Starbucks credits its rewards program
    for the majority of the additional $2.65 billion in revenue. Customer loyalty
    benefits all types of organizations since it drives repeat business, boosts revenue,
    develops brand influencers and advocates, distinguishes a company from its competition,
    and provides honest and useful feedback.


    In this third practical business problem, we will use and compare the results
    of the neural network, classification tree, and random forest using the same experimental
    conditions. The goal is to use a case study to demonstrate how we can use these
    algorithms to arrive at making inferences that can be used to get and retain customers
    for our businesses. In particular, we will predict the loyalty of bank customers
    and use this to know if a customer will be leaving the bank or not (i.e., how
    loyal is the customer). Based on the result of the prediction, an appropriate
    relationship marketing approach will then be used to encourage the customer to
    stay (if you predicted they will leave) or step up CRM for those that are loyal,
    for example, discounts for more sales. It’s important to note that though we used
    a bank as a case study here, any other business can be used with appropriate data
    attributes.


    The data for the business problem is named `Churn_Modelling.csv`, and it contains
    data on the customers of a bank. The data description is as follows:


    | • RowNumber | *Identification has to be removed* |

    | • CustomerId | *Identification has to be removed* |

    | • Surname | *Identification textual has to be removed* |

    | • CreditScore | *Integer* |

    | • Geography | *Categorical – indicating the country* |

    | • Gender | *Categorical – indicating the sex* |

    | • Age | *Integer* |

    | • Tenure | *Integer* |

    | • Balance | *Real* |

    | • NumOfProducts | *Integer* |

    | • HasCrCard | *Integer but has to be changed to categorical* |

    | • IsActiveMember | *Integer but has to be changed to categorical* |

    | • EstimatedSalary | *Real* |

    | • Exited | *Outcome variable but has to be changed to categorical* |


    Regardless of the classification algorithm that will be used, the very first thing
    is to perform basic data preprocessing and explore the data using necessary visualization
    tools for the purpose of classification.


    **General data preprocessing for the classification techniques**


    ![Figure 7-2](images/532459_1_En_7_Chapter/532459_1_En_7_Fig1_HTML.png)


    The images show the importing data process begins with date format, replacing
    errors with missing values checked, and three buttons below, which are previous,
    next, and cancel.


    Figure 7-2 Importing the data


    1. Create a new **repository** and two **subfolders** (for data and for the process)
    in the repository. **Import** the data named `Churn_Modelling.csv` into the data
    subfolder. When importing, remove `RowNumber`, `CustomerID`, and `Surname` columns
    and convert `HasCrCard`, `IsActiveMember`, and `Exited` to categorical attributes.
    Also, replace errors with missing values when importing the data. Figure [7-2](#Fig1)
    is the screenshot of importing the data.


    ![Figure 7-3](images/532459_1_En_7_Chapter/532459_1_En_7_Fig2_HTML.png)


    The plot type is set to column bar, value columns set to exited, group by geography,
    and aggregation function set to count.


    Figure 7-3 Example of a bar chart of a categorical attribute and target variable


    2. After importing the data, drag it to the design view and connect it to **res**.
    Run the process and view the **statistics**. From the **statistics** view of the
    data, notice that the unnecessary attributes have been removed, and the needed
    attribute change has occurred. Also, there are no missing values.


    3. Using the guide for visualization, particularly with respect to classification
    (refer to Section [2.5](#Sec12) in Chapter [2](#532459_1_En_2_Chapter.xhtml)),
    we will study the relation of outcome to categorical predictors using bar charts
    with the outcome on the `y` axis. The goal is to find out if the category of the
    predictors is fairly represented in the outcome or target attribute. Use the settings
    in Figure [7-3](#Fig2) to visualize all the categorical variables against the
    target attribute. We can see that for all the categorical attributes, there is
    a fair representation in the outcome variable.


    ![Figure 7-4](images/532459_1_En_7_Chapter/532459_1_En_7_Fig3_HTML.png)


    The plot type is set to scatter, the x-axis column set to age, the value column
    set to credit score, and the color set to exited.


    Figure 7-4 An example of a color-coded scatter plot for classification


    4. Study the relation of outcome to pairs of numerical predictors via color-coded
    scatter plots (color denotes the outcome). The goal here is to see if there is
    a linear relationship between the numerical predictors and to see the strength
    of the outcome class in the numerical predictors. Use the settings in Figure [7-4](#Fig3)
    to do this for different combinations of the numerical attributes. Notice that
    there is no such linear relationship. In case there is such relationship, it has
    to be handled because of multicollinearity.


    ![Figure 7-5](images/532459_1_En_7_Chapter/532459_1_En_7_Fig4_HTML.jpg)


    The plot type is set to boxplot, the value column is set to age, and the group
    by option is selected with the exited option.


    Figure 7-5 An example of the boxplot visualized for classification


    5. Study the relation of outcome to numerical predictors via side-by-side boxplots:
    plot boxplots of a numerical variable by outcome. Create similar displays for
    each numerical predictor. The most separable boxes indicate potentially useful
    predictors. Use the settings in Figure [7-5](#Fig4) to investigate this for all
    the numerical attributes. Note that apart from `NumOfProducts` and `EstimatedSalary`,
    all the other numerical attributes are fairly separable as indicated by the red
    arrow in Figure [7-5](#Fig4). (Their medians are fairly different). In exercise
    3 of this chapter, we will experiment the classification process removing these
    attributes, but for now it will be included.'
