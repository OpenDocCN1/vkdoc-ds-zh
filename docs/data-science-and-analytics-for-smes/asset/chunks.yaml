  trans: '

    ### 4.1 提案与初步分析


    在提交提案（这很可能是你与该组织的首次互动）之前，你必须先对组织或领域专家进行调研，收集一些背景信息，以支持你的数据分析提案。在提案中，这些背景信息将帮助你了解并突出你计划为该组织解决的问题。虽然这不是强制要求，但它有助于吸引利益相关者的注意力，并让他们有兴趣投资于该数据分析项目。与中小企业启动数据分析项目的主要障碍在于，利益相关者目前基于现有方法仍能获得一定收入，因此他们认为目前没有投资此类项目的必要或紧迫性。现在，顾问有责任说服他们，让他们了解数据分析所能带来的转型和成就。在不需要此阶段的情况下（即利益相关者已经参与），只需召开一次简短的介绍会议，详细说明分析流程，并引出与业务相关的各类问题。此时，获取利益相关者的反馈、了解他们的想法以及希望通过数据分析项目实现的目标也很有帮助。尽管在某些情况下，利益相关者可能不清楚什么是分析问题，但他们肯定了解组织的需求。在这一阶段，需要具备非常出色的演示技巧，才能使你的提案获得认可。在提案阶段，提出针对特定业务量身定制的问题会有所帮助。顾问在此阶段需要小心谨慎，不要为了获得提案通过而许下虚假承诺，或提议解决那些缺乏数据资源的问题。


    在初步分析阶段，你需要查明数据、数据质量和完整性方面有哪些可用资源。此阶段，你将根据用于解决每个问题的数据，来探索已提出的问题。在此阶段结束时，你应该能够根据现有数据，给出关于可实现目标的详细报告。此外，在初步分析阶段，你需要了解组织的运营流程（概念性业务模型），正如第
    1 章 1.​3 节“业务分析历程”中所阐述的那样。这将使你能够理解所提议的分析模型的优化方法，以及你的分析结果如何融入组织或业务流程。你还将能够发现何时以及由谁负责实施你的建议等。通过这些，你就能知道在分析项目的沟通阶段需要让哪些人参与。在初步分析之后，你还应该能够在较高的抽象层次上给出数据分析项目预期成果的概念，并就组织的最佳数据实践提供建议。初步分析阶段涉及的任务可总结如下：


    -   发现并评估可用于分析的数据（内部和外部）及其质量。

    -   强调如何获取可用数据的细节。

    -   理解组织数据库，并在必要时策划整合数据以供分析的过程。

    -   发现当前数据可实现的分析内容。

    -   明确决策目标，并确定有助于在给定数据下使预期决策可行的分析输出。


    初步分析阶段的输出包括：


    -   关于当前可用和可获取数据的详细发现文档，以及对其可带来哪些益处的抽象说明。

    -   关于数据平台升级和整合的建议，尤其面向未来的分析。

    -   具体指出数据分析项目的目标、可做出的决策，以及有助于在给定数据下使这些决策可行的分析输出。

    -   将要执行的项目，并说明里程碑、可交付成果、成本和预期投资回报率。


    在此阶段，你需要明确指出数据分析项目是一个迭代过程，这意味着你可能需要提出建议，这些建议将被实施和评估，并在必要时重复进行。这个初步分析将有助于：


    -   了解你的数据能够实现什么。

    -   以全新的视角审视你当前的数据管道、数据仓库和分析策略。

    -   就数据平台升级提供建议。


    在初步分析阶段，你希望了解所有可用的数据，即向领域专家询问字段名称的含义，并寻求关于数据源使用的内部经验知识。甚至可能有必要在此阶段探索所获得的任何数据，以了解其解决问题的可行性，因为遇到你最初发现的数据并非如最初所想那样丰富到足以用于分析的情况并不少见。


    请注意，在初步分析期间，你需要能够确定如何避免在不切实际的客户身上浪费时间，并且如果某个项目无论是基于数据资源还是负面的业务环境状况都不会成为成功案例，那么就放弃它。最后，要学会应对炒作和不切实际的期望。数据分析项目的其余部分包含在图
    4-1 所示的三个阶段中。正如前面提到的，可以根据单个数据分析项目的性质进行定制和扩展。在本章的剩余部分，我们将逐一讲解每个阶段并进行详细说明。


    ![一张照片，展示了数据分析项目的三个阶段。项目周期为三到六个月，阶段包括参与前阶段、参与阶段和参与后阶段。](img/532459_1_En_4_Fig1_HTML.png)


    **图 4-1** 数据分析咨询阶段


    如图 4-1 所示，一个典型的数据分析项目包含三个主要阶段。项目的总时长因数据状况和业务领域中的许多其他因素而异，但通常应涵盖平均三到六个月的时间，其中参与后阶段应至少给予三个月。IBM
    咨询流程的一个好例子可以在 [`https://365datascience.com/trending/ibm-data-science-consulting/`](https://365datascience.com/trending/ibm-data-science-consulting/)
    找到。

    '
- fmt: '### 4.2 Pre-engagement Phase


    In the pre-engagement phase, there is a need to carry out an exhaustive exploratory
    analysis using descriptive analytics to expose or discover the situation of things
    in relation to the intended goals. At the end of this phase, there might be a
    need to refine the goals based on their feasibility assessment. For each goal,
    you need to highlight the present situation using descriptive analytics, the conclusions
    that can be deduced, and the recommendations for immediate implementation or future
    analytics. There is a need to define success criteria, data readiness, and assumptions
    for each of the goals stated. This is termed the kickoff and readiness phase.
    It is where you try to map the journey for your clients and see where analytics
    can play an important role in this journey.


    Technically, the pre-engagement phase consists of the following:


    *Clients'' analytics journey mapping*: After developing the conceptual business
    model, you then try to identify the stage of the conceptual business model where
    the analytics solution will be used and what it will be used for. This will help
    you to know the data needs for the analytics project, particularly specific attributes.


    *Scoping out immediate and future needs*: To do this, you will take the goals
    of the analytics project and detail what you need to solve that is actually available
    and that needs to be available in the future. For example, if there is a need
    to clone the external market, what external data will be needed, and is it possible
    to get access to it?


    *Timelines*: There is a need to state the time that each of the phases will take
    so that all parties will be carried along. This has to be done by stating clearly
    the milestones and time of their accomplishments.


    *Engagement model*: This model will help to give all parties involved an idea
    of where they will be featuring in the project and what their role will be. It
    can also include a solution architecture that gives the clients an idea of how
    the analytics project will progress. Figure [4-2](#532459_1_En_4_Chapter.xhtml#Fig2)
    is an example of a simple solution architecture together with the engagement model
    for consulting for an ecommerce business.²


    ![](images/532459_1_En_4_Chapter/532459_1_En_4_Fig2_HTML.png)


    Cyclic model of solution architecture and engagement. Illustrated in two columns:
    the post-engagement phase, which includes go-live prep and go-live, measurement
    and tracking, and feedback incorporation. After this, either go live prep and
    go live start, or it moves to the modeling and analysis phase and later to the
    communicating insights phase.


    Figure 4-2


    Sample of a solution architecture and engagement model


    The solution architecture and engagement model presented in Figure [4-2](#532459_1_En_4_Chapter.xhtml#Fig2)
    captures the pre-engagement and the post-engagement phase. This has been highly
    customized for a particular Business Analytics project directed at improving online
    sales. A different kind of business might interpret this in a slightly different
    manner based on contextual information. In the model presented in Figure [4-2](#532459_1_En_4_Chapter.xhtml#Fig2),
    we can see some important characteristics; first, it is iterative, and there is
    a need to revisit some stages based on the result from the stages after it. Also,
    all parties that will be responsible for making the analytics project successful
    must be carried along, and their inputs are important to the success of the project.
    The solution architecture is very important because it helps to demonstrate the
    competence of the analytics team in solving the problem and helps the stakeholders
    to know what will be involved in getting the job done, and this is helpful particularly
    in getting whatever resources will be needed to execute the project.


    *Success criteria*: For each of the goals, there is a need to use descriptive
    analytics to present the present situation in relation to the relevant success
    metrics as explained in Section [3.​3](#532459_1_En_3_Chapter.xhtml#Sec3) in Chapter
    [3](#532459_1_En_3_Chapter.xhtml). To do this, you are to give a detail of the
    values of the metrics before and after the goal is accomplished. The stakeholders
    should be communicated on these success criteria, so that they can give their
    contributions based on their domain knowledge and organizational goals.


    *Data readiness and assumptions*: Finally, the pre-engagement phase should make
    it clearly known what is obtainable from the available data. This will clear any
    false expectation from the analytics project. In some situations, it could either
    redirect the project or cause some data decisions to be made such as stalling
    the project to curate data and so on. By stating the assumptions for the successful
    completion of the project, the stakeholders are able to know why some things do
    not go as planned.


    At the end of the pre-engagement phase, there is a need to come up with the documents
    containing the details of the pre-engagement phase, which is presented to the
    stakeholders. This is important because oftentimes there would have been a further
    modification and refinement of the conclusions from the initial analysis stage.'
