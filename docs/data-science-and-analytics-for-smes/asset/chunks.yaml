    \ the RFMT data, we can profile the clusters. The final step in RFM segmentation\
    \ is to customize communications for each of the discovered clusters of customers.\n\
    \n**Strategic market target**\n\nThe goal here is to prescribe the optimal cluster\
    \ in the external data to target for marketing using prescriptive analytics. We\
    \ will use the thinking backward approach for this assignment. This approach consists\
    \ of the following steps:\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig17_HTML.jpg)\n\
    \nAn illustration depicts two circles labeled internal and external segmentation,\
    \ links the two together, and constructs options.\n\nFigure 10-15\n\nHigh-level\
    \ conceptual design\n\n1.  *Start with the decision we want to make*: In this\
    \ project, we need to choose an actionable customer acquisition strategy out of\
    \ the following available options.\n    1.  Increase customer base by acquiring\
    \ as many customers as possible, no matter what kind of customers they are, with\
    \ the hope of retaining them for high future revenue.\n\n2.  Increase customer\
    \ base by acquiring only few premium customers (due to low marketing budget).\n\
    \n3.  Increase customer base by acquiring many high profit customers (best-case\
    \ scenario).\n\n2.  *Determine what analysis outputs would help make that decision*:\
    \ The analysis output we are expecting is to have one or two slides that describe\
    \ each option in step 1 and the summary that compares each option based on key\
    \ metrics (available in the data). We will also explain how we arrived at the\
    \ conclusions. Note that this procedure leverages on having the same attributes\
    \ in internal and external data. In some situations, this might not be possible,\
    \ but there are third parties that can help with external segmentation to overcome\
    \ this.\n\n3.  *Design the analysis that creates those outputs*: Figure [10-15](#532459_1_En_10_Chapter.xhtml#Fig17)\
    \ is a high-level conceptual design of the approach. The aim is to segment the\
    \ internal data and also segment the external data. After that, we will now link\
    \ the two together and construct options which will help to maximize the business\
    \ decisions in step 1\\. The intention is to use internal data to describe the\
    \ characteristics of the current customer base and the historical performance\
    \ of these segments (e.g., total profit made from the customers). We will follow\
    \ this up by describing the external customer characteristics and use these to\
    \ determine what the acquisition opportunity is for each segment.\n\n*   Start\
    \ with the decision we want to make.\n\n*   Determine what analysis outputs would\
    \ help make that decision.\n\n*   Design the analysis that creates those outputs.\n\
    \n*   Determine what data is needed for analysis and how to get it.\n\n*   Execute\
    \ the analysis.\n\n*   Display and present the result."
  trans: "\n**货币价值**：也称为“货币价值”，该指标反映客户在特定时间段内在该品牌的消费金额。\n\n图 10-13a 是 RFM 细分的一个示例，该图展示了基于\
    \ RFM 细分生成的聚类三维可视化。从图 10-13a 可以解读出，部分客户虽然消费金额不高，但频繁访问企业网站，并且近期有过高价值购买行为。\n\n![](img/532459_1_En_10_Fig14_HTML.png)\n\
    \n图片展示了用于 RFM 细分的三维散点图，坐标轴 x、z、y 分别标注为频率、近度与货币价值。\n\n**图 10-13a** RFM 细分三维可视化⁴\
    \ ([`https://miro.medium.com/max/1400/1*_uQS11qVzIv4rTNDPM6Rqw.png`](https://miro.medium.com/max/1400/1*_uQS11qVzIv4rTNDPM6Rqw.png))\n\
    \n要使用 RFMT（近度、频率、货币价值、在册时长）方法进行客户细分，必须将电子表格数据转换为 RFMT 数据。以下技巧可供参考：\n\n1.  为每位客户创建唯一标识符。\n\
    2.  对于给定的 ID，可从其他字段计算对应客户的 RFMT 值。\n    - 同一客户的所有产品支出累计为货币价值（`M`）。\n    - 同一客户的购买次数计为频率（`F`）。\n\
    \    - 从客户最近一次购买到数据抓取日期的时间间隔计算为近度（`R`）。在本场景中，使用天数作为时间单位；若天数跨越数年，也可改用月或年。\n   \
    \ - 第四个变量为购买间隔时间（`T`），衡量连续购物之间的平均时间间隔。若某客户的首次和末次购买日期分别记为`T[1]`和`T[n]`，则该客户的整体购物周期（`L`）可近似为`T[1]`与`T[n]`之间的月数，因此`T`值（以月为单位）可按如下公式计算：\n\
    \n`T = L / (F − 1) = (T[n] − T[1]) / (F − 1)` (1)。\n\n为计算`T`，仅考虑在给定时期内至少完成两次购买（即`F\
    \ ≥ 2`）的客户。由此生成的数据文件命名为`*RFMFoodAgric.xlsx*`。\n\n**表 10-1** 各维度的四个层级\n\n| 近度 |\
    \ 频率 | 货币价值 |\n| --- | --- | --- |\n| R-层级-1（最近购买） | F-层级-1（最频繁） | M-层级-1（最高消费）\
    \ |\n| R-层级-2 | F-层级-2 | M-层级-2 |\n| R-层级-3 | F-层级-3 | M-层级-3 |\n| R-层级-4（最久未购）\
    \ | F-层级-4（仅一次交易） | M-层级-4（最低消费） |\n\n然后，利用步骤 b 中获得的 RFMT 值，将每位客户在每个维度上划分至四个层级之一，如表\
    \ 10-1 所示。由此生成的数据文件命名为`*FinalRFM.xlsx*`（尽管该数据实际包含约五个层级，而非表 10-1 中的四个）。\n\n利用 RFM\
    \ 细分的结果，可以根据客户所属的 RFM 细分群体来定位特定客户群。例如，最佳客户群体（出现在 R-层级-1、F-层级-1 和 M-层级-1 中的客户，意味着他们近期交易频繁且消费高于其他客户）。\n\
    \n- **高消费新客户**：位于 1-4-1 和 1-4-2 分组的客户。这些消费者仅交易过一次，但交易时间很近，且消费金额可观。\n- **最低消费活跃忠实客户**：该群体由位于\
    \ 1-1-3 和 1-1-4 分组的客户组成。他们近期交易频繁，但消费最少。\n- **流失的最佳客户**：位于 4-1-1、4-1-2、4-2-1 和\
    \ 4-2-2 分组的客户。他们过去交易频繁且消费较高，但已长时间未进行交易。\n\n![](img/532459_1_En_10_Fig15_HTML.png)\n\
    \n柱状图截图展示了频率与计数的关系。柱状图以频率 1、3、5、2、4 绘制，其中频率 1 对应的数值最高。\n\n**图 10-13b** 频率柱状图\n\
    \n1.  导入名为`*FinalRFM.xlsx*`的数据，检查统计信息，确保无缺失数据。将所有 RFMT 属性的类型更改为多项式。\n2.  使用柱状图对数据进行可视化，确保\
    \ RFMT 类别具有合理的数据分布。图 10-13b 即为一例。\n\n![](img/532459_1_En_10_Fig16_HTML.png)\n\n\
    折线图截图展示了不同频率值（如 0、1、2、3、4）对应的数值，线条呈现波动趋势。\n\n**图 10-14** 发现的聚类\n\n3.  图 10-14\
    \ 是当`k`等于 4 时，RFMT 建模的最终聚类可视化结果。\n4.  基于发现的聚类以及用于 RFMT 数据的层级，我们可以对聚类进行画像分析。RFM\
    \ 细分的最后一步是针对每个发现的客户聚类定制沟通策略。\n\n### 战略市场目标\n\n此处的目标是通过规范性分析，在外部数据中确定用于营销的最优聚类。本作业将采用反向思考方法，该方法包含以下步骤：\n\
    \n![](img/532459_1_En_10_Fig17_HTML.jpg)\n\n示意图描绘了两个分别标注为内部细分和外部细分的圆圈，两者相互连接，并构建了选项。\n\
    \n**图 10-15** 高层概念设计\n\n1.  **从我们要做的决策开始**：在该项目中，我们需要从以下可用选项中选择一项可执行的客户获取策略。\n\
    \    - 通过尽可能多地获取客户来扩大客户基础，无论客户类型如何，期望留住他们以实现未来高收入。\n    - 由于营销预算有限，仅通过获取少量优质客户来扩大客户基础。\n\
    \    - 通过获取大量高利润客户来扩大客户基础（最佳情况）。\n2.  **确定哪些分析输出有助于做出该决策**：我们期望的分析输出是制作一或两张幻灯片，描述步骤\
    \ 1 中的每个选项，并提供一个基于关键指标（数据中可用）对各选项进行比较的摘要。我们还将解释得出结论的过程。请注意，此过程依赖于内部数据和外部数据具有相同属性。在某些情况下，这可能无法实现，但可以借助第三方提供的外部细分来解决这一问题。\n\
    3.  **设计能够产生这些输出的分析**：图 10-15 是该方法的顶层概念设计。目的是对内部数据进行细分，同时也对外部数据进行细分。之后，将两者关联起来并构建选项，这将有助于最大化步骤\
    \ 1 中的业务决策。意图是利用内部数据描述当前客户群的特征以及这些细分群体的历史表现（例如，从客户中获取的总利润）。接着，我们将描述外部客户特征，并据此确定每个细分群体的获取机会。\n\
    - 从我们要做的决策开始。\n- 确定哪些分析输出有助于做出该决策。\n- 设计能够产生这些输出的分析。\n- 确定分析所需的数据及其获取方式。\n- 执行分析。\n\
    - 展示并呈现结果。\n"
- fmt: "# 排版后的文档\n\n在 Figure [10-16](#532459_1_En_10_Chapter.xhtml#Fig18) 中，我们有一个更详细的概念模式版本，揭示了内部数据和外部数据中提出的聚类。（这只是为了给读者一个预期概念，实际上聚类的知识在初期可能并不像图中这样清晰。）\n\
    \n![图10-16 更详细的概念设计](images/532459_1_En_10_Chapter/532459_1_En_10_Fig18_HTML.png)\n\
    \n图10-16 更详细的概念设计\n\n1. **确定分析所需的数据及获取方式**：对于此方法，我们需要使用两组数据。内部数据名为 `FarmCo.Internal.xlsx`，外部数据名为\
    \ `FarmCo.External.csv`。\n\n2. **执行分析**：将对内部和外部数据执行以下步骤。\n    - **数据预处理**：\n \
    \       - **缺失值处理**：`k`-means 无法处理缺失值。如果缺失值很少，可以将其排除；如果缺失值很多，则必须进行插补。\n      \
    \  - **数据可视化**将用于发现离群值。将分类变量转换为数值型，因为 `k`-means 使用距离函数，无法直接处理分类变量（如果是序数，则用等差数列替换；如果是名义变量，则转换为二进制）。\n\
    \        - **数据归一化**将被用来均衡每个维度的权重。\n    - **确定 `k` 值**：有几种方法可以做到这一点（如前所述），但我们将指定要使用的\
    \ `k` 值。\n    - **创建聚类模型**：使用合适的距离度量来计算记录之间的距离（因为我们已将所有属性转换为数值，所以选择了数值度量）。\n \
    \   - **验证聚类**：为了验证生成的聚类，我们使用**平均质心内距离**。\n    - **解释结果**：比较聚类质心以描述不同聚类的特征，并尝试为每个聚类赋予一个标签。\n\
    \n## 内部数据 5a–e\n\n在检查内部数据的缺失值后，我们得到了 Figure [10-17](#532459_1_En_10_Chapter.xhtml#Fig19)\
    \ 中的统计结果（向下滚动查看全部）。\n\n![图10-17 摘要统计](images/532459_1_En_10_Chapter/532459_1_En_10_Fig19_HTML.png)\n\
    \n图10-17 摘要统计\n\n通过检查数值属性的离群值（使用散点图），我们发现所有属性均无离群值。Figure [10-18](#532459_1_En_10_Chapter.xhtml#Fig20)\
    \ 是一个示例。\n\n![图10-18 检查数值属性（总金额）](images/532459_1_En_10_Chapter/532459_1_En_10_Fig20_HTML.png)\n\
    \n图10-18 检查数值属性（总金额）\n\nFigure [10-19](#532459_1_En_10_Chapter.xhtml#Fig21) 是内部数据的相关性矩阵结果；使用欧几里得距离时，高度相关的变量是不利的。Figure\
    \ [10-20](#532459_1_En_10_Chapter.xhtml#Fig22) 给出了成对表格（按降序排列）。基于此结果，我们将剔除`Item\
    \ Count`、`No of C`、`Email Status = P`和`Quantity`，因为它们具有较高的相关值。\n\n![图10-20 成对相关性](images/532459_1_En_10_Chapter/532459_1_En_10_Fig22_HTML.jpg)\n\
    \n图10-20 成对相关性\n\n![图10-19 相关性矩阵](images/532459_1_En_10_Chapter/532459_1_En_10_Fig21_HTML.png)\n\
    \n图10-19 相关性矩阵\n\n为了确定 `k` 值，我们将尝试 `2`、`3`、`4`，并选择分离效果最好的 `k`。重新导入数据，并在导入时将`Customer\
    \ ID`的角色设为`Id`，以便将每个客户链接到其所属的聚类。Figure [10-21](#532459_1_En_10_Chapter.xhtml#Fig23)\
    \ 中的设置将生成 Figure [10-22a](#532459_1_En_10_Chapter.xhtml#Fig24)（`K=2`）、[10-22b](#532459_1_En_10_Chapter.xhtml#Fig25)（`K=2`\
    \ 的性能）、[10-23a](#532459_1_En_10_Chapter.xhtml#Fig26)（`K=3`）、[10-23b](#532459_1_En_10_Chapter.xhtml#Fig27)（`K=3`\
    \ 的性能）、[10-24a](#532459_1_En_10_Chapter.xhtml#Fig28)（`K=4`）和 [10-24b](#532459_1_En_10_Chapter.xhtml#Fig29)（`K=4`\
    \ 的性能）中的可视化聚类结果。\n\n![图10-24b K=4 的性能](images/532459_1_En_10_Chapter/532459_1_En_10_Fig29_HTML.jpg)\n\
    \n图10-24b `K=4` 的性能\n\n![图10-24a K=4 的聚类轮廓](images/532459_1_En_10_Chapter/532459_1_En_10_Fig28_HTML.png)\n\
    \n图10-24a `K=4` 的聚类轮廓\n\n![图10-23b K=3 的性能](images/532459_1_En_10_Chapter/532459_1_En_10_Fig27_HTML.jpg)\n\
    \n图10-23b `K=3` 的性能\n\n![图10-23a K=3 的聚类轮廓](images/532459_1_En_10_Chapter/532459_1_En_10_Fig26_HTML.png)\n\
    \n图10-23a `K=3` 的聚类轮廓\n\n![图10-22b K=2 的聚类性能](images/532459_1_En_10_Chapter/532459_1_En_10_Fig25_HTML.jpg)\n\
    \n图10-22b `K=2` 的聚类性能\n\n![图10-22a K=2 的聚类轮廓](images/532459_1_En_10_Chapter/532459_1_En_10_Fig24_HTML.png)\n\
    \n图10-22a `K=2` 的聚类轮廓\n\n![图10-21 聚类过程（k-means）](images/532459_1_En_10_Chapter/532459_1_En_10_Fig23_HTML.png)\n\
    \n图10-21 聚类过程（`k-means`）\n\n根据上述结果，我们选择 `K=3`，原因如下：\n\n- **`avg._within_centroid_distance`**：平均簇内距离通过计算质心与簇内所有样本之间距离的平均值得到。该值越小越好。\n\
    - **`davies_bouldin`**：产生低簇内距离（高簇内相似性）和高簇间距离（低簇间相似性）的算法将具有较低的 Davies-Bouldin 指数；根据此标准，能够产生具有最小\
    \ Davies-Bouldin 指数聚类集合的聚类算法被认为是最佳算法。\n\n在确定内部数据的 `K=3` 后，为了选择适合当前问题（内部数据）的最佳细分结果，我们可以使用已获利润作为指标，然后计算每个细分中所有成员的聚类平均利润。还可以使用其他指标，例如取消率等，具体取决于应用场景。聚类的输出（Figure\
    \ [10-25](#532459_1_En_10_Chapter.xhtml#Fig30)）可以与原始 `FarmCo.Internal.xlsx` 关联，以了解每个聚类成员的利润，然后计算每个聚类的平均利润。表\
    \ 10-2 展示了这一结果。请注意，已获利润不属于聚类的属性，因为它不会出现在外部数据中。\n\n**表 10-2 平均聚类利润**"
  raw: "In Figure [10-16](#532459_1_En_10_Chapter.xhtml#Fig18), we have a more detailed\
    \ version of the conceptual schema revealing the proposed clusters in the internal\
    \ data and the external data. (This is just to give an idea of what we are expecting\
    \ as in practice the knowledge of the clusters might not be clear like this in\
    \ the beginning.)\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig18_HTML.png)\n\
    \nAn illustration depicts two root sets which consist of the numbers 0, 1, 2,\
    \ and 6, 7, and 0, respectively. Linking both the root sets leads to actionable\
    \ strategies.\n\nFigure 10-16\n\nMore detailed conceptual design\n\n1.  *Determine\
    \ what data is needed for analysis and how to get it*: For this approach, we will\
    \ need to use two sets of data. The internal data named FarmCo.Internal.xlsx and\
    \ the external data named FarmCo.External.csv.\n\n2.  *Execute the analysis*:\
    \ The following steps will be performed for both the internal and external data.\n\
    \    1.  *Data preprocessing*: *Missing value handling - k*-means cannot deal\
    \ with missing values. If there are only few missing values, they can be excluded;\
    \ if there are many, they have to be imputed. *Data visualization* will be used\
    \ to discover outliers. Convert c*ategorical variables to numerical as k*-means\
    \ uses a distance function and cannot handle categorical variables directly (if\
    \ it’s ordinal, replace with an arithmetic sequence; if it’s nominal, convert\
    \ to binary). *Data normalization will be used* to weigh each dimension equally.\n\
    \n2.  *Determine the number of k*: There are several approaches to doing this\
    \ (as explained earlier), but we shall be supplying the number of k to use.\n\n\
    3.  *Create the* *clustering model*: Use the appropriate distance measure for\
    \ the distance between records (numerical measure was selected because we have\
    \ converted all the attributes to numerical).\n\n4.  *Validate the clusters*:\
    \ To validate the generated cluster, we use the *avg. within-centroid distance*.\n\
    \n5.  *Interpret your results*: Compare the cluster centroid to characterize the\
    \ different clusters, and try to give each cluster a label.\n\n**Internal data\
    \ 5a–e**\n\nAfter examining the internal data for missing values, we have the\
    \ statistics (scroll down to see all) in Figure [10-17](#532459_1_En_10_Chapter.xhtml#Fig19).\n\
    \n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig19_HTML.png)\n\nA table\
    \ depicts the maximum, minimum, and average values for the customer I D, the number\
    \ of C, D, and N, quantity, item count, total amount, number of days, and discount\
    \ price.\n\nFigure 10-17\n\nSummary statistics\n\nChecking the numerical attributes\
    \ for outliers (using scatter plots), we discover that all the attributes don’t\
    \ have outliers. Figure [10-18](#532459_1_En_10_Chapter.xhtml#Fig20) is an example.\n\
    \n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig20_HTML.png)\n\nA screenshot\
    \ depicts a scatterplot plotting the total amount versus the total amount. The\
    \ values for X and Y are 10, and 400 is highlighted.\n\nFigure 10-18\n\nChecking\
    \ the numerical attributes (Total Amount)\n\nFigure [10-19](#532459_1_En_10_Chapter.xhtml#Fig21)\
    \ is the result of the correlation matrix for the internal data; highly correlated\
    \ variables are a disadvantage when using Euclidian distance. The pairwise table\
    \ is given in Figure [10-20](#532459_1_En_10_Chapter.xhtml#Fig22) (sorted in descending\
    \ order). Based on this result, we will eliminate Item Count, No of C, Email Status\
    \ = P, and Quantity as they have high correlation values.\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig22_HTML.jpg)\n\
    \nA screenshot depicts a table showing pairwise correlation with three columns\
    \ and eighteen rows. It is sorted in descending order.\n\nFigure 10-20\n\nPairwise\
    \ correlation\n\n![](images/532459_1_En_10_Chapter/532459_1_En_10_Fig21_HTML.png)\n\
    \nA screenshot depicts the result of a correlation matrix with eighteen columns\
    \ and rows. The highly correlated variables lie along the diagonal of the table,\
    \ which is highlighted.\n\nFigure 10-19\n\nCorrelation matrix\n\nTo determine\
    \ the number of k, we will use 2, 3, 4, and we select the best separated k. Import\
    \ the data again and, this time, set the role of Customer ID to Id when importing\
    \ so that we can link each customer to its cluster. The settings in Figure [10-21](#532459_1_En_10_Chapter.xhtml#Fig23)\
