    2.  Click ***show node labels***; adjust the size of nodes to make it bigger.
    There are so many things you can explore in the ***appearance***, ***layout***,
    and ***statistics*** windows to have a beautiful and attractive network and also
    communicate different insight. As an example, we can visualize the clusters in
