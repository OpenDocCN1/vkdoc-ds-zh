  trans: '

    ### 4.2 准备阶段


    在准备阶段，需要运用描述性分析进行详尽的探索性分析，以揭示或发现与预期目标相关的事务状况。此阶段结束时，可能需要根据可行性评估来调整目标。对于每个目标，你需要利用描述性分析突出当前状况、可推导出的结论，以及关于立即实施或未来分析的建议。需要为每个既定目标定义成功标准、数据准备情况和假设条件。这被称为启动与准备阶段。在此阶段，你试图为客户描绘旅程地图，并探究分析工作在这一旅程中能发挥何种重要作用。


    从技术层面讲，准备阶段包含以下内容：


    *客户分析旅程映射*：在开发出概念性业务模型后，你需要确定概念性业务模型中哪些环节将使用分析解决方案及其用途。这将有助于你了解分析项目的数据需求，特别是特定属性。


    *界定近期与未来需求*：为此，你需要明确分析项目的目标，并详细列出当前实际可用且未来需要具备的解决条件。例如，如果需要克隆外部市场，需要哪些外部数据，以及是否有可能获取这些数据？


    *时间线*：需要明确说明每个阶段所需的时间，以便所有参与方都能同步跟进。这必须通过清晰地阐明里程碑及其完成时间来实现。


    *参与模式*：该模式有助于让所有相关方了解自己在项目中的定位及职责。它还可以包含一个解决方案架构，让客户了解分析项目将如何推进。图 4-2 展示了一个针对电商业务咨询的简单解决方案架构及参与模式示例。


    ![](img/532459_1_En_4_Fig2_HTML.png)


    解决方案架构与参与的循环模式。以两列图示：后参与阶段，包括上线准备与上线、测量与跟踪、反馈整合。之后，要么进入上线准备与上线阶段，要么进入建模与分析阶段，再进入沟通洞察阶段。


    图 4-2


    解决方案架构与参与模式示例


    图 4-2 中呈现的解决方案架构与参与模式涵盖了准备阶段和后参与阶段。这是为某个旨在提升在线销售额的特定商业分析项目量身定制的。不同类型的业务可能会根据上下文信息对此进行略有不同的解读。在图
    4-2 所示的模型中，我们可以看到一些重要特征：首先，该模型是迭代的，需要根据后续阶段的结果重新审视某些环节。此外，所有对确保分析项目成功负有责任的相关方都必须被纳入进来，他们的意见对项目的成功至关重要。解决方案架构非常重要，因为它有助于展示分析团队解决问题的能力，并帮助利益相关者了解完成工作所需涉及的方面，这对于获取执行项目所需的各种资源尤其有帮助。


    *成功标准*：对于每个目标，需要使用描述性分析来呈现与相关成功指标相关的当前状况，正如第 3 章第 3.​3 节所述。为此，你需要详细说明目标实现前后指标值的变化。这些成功标准应与利益相关者沟通，以便他们能根据其领域知识和组织目标提出意见。


    *数据准备与假设*：最后，准备阶段应明确说明从现有数据中可以获取什么。这将消除对分析项目可能存在的任何不切实际的期望。在某些情况下，这可能会改变项目方向，或促使做出一些数据决策，例如暂停项目以整理数据等。通过阐明项目成功完成的假设条件，利益相关者能够理解为什么某些事情未能按计划进行。


    在准备阶段结束时，需要整理包含该阶段详细内容的文档，并提交给利益相关者。这一点很重要，因为初始分析阶段的结论常常需要进一步的修改和完善。

    '
- fmt: '## 4.3 Engagement Phase


    Depending on the kind of analytics project, meaning, for example, we are expected
    to come up with software or recommendations for implementation or both, the engagement
    phase is when you build the solution to the problem or goal identified.


    The engagement phase typically includes modeling and analysis, regular feedback,
    and communicating insights effectively to clients. The components of the engagement
    phase stated might increase depending on the project at hand but not reduced as
    each of these components determine the success of the project.


    **Modeling and analysis**: First, determine the data mining task. Will it be descriptive
    analytics, predictive analytics, or prescriptive analytics? Will it be a combination
    of all these or will the task be used to complement each other? Sometimes, the
    predictive and prescriptive use descriptive techniques in the exploratory stage.
    This involves translating the general question or problem into a more specific
    statistical question.


    Depending on the problem at hand, there are several ways to approach them; for
    example, the problem can be an anomaly detection problem where you identify unusual
    data records or association modeling, where you search for relationships between
    variables. It could even be clustering (discovering groups and structures in the
    data that are in some way or another "similar," without using known structures
    in the data), classification (generalizing known structures to apply to new data),
    regression (finding a function which models the data with the least error), or
    summarization (providing a more compact representation of the dataset, including
    visualization and report generation).³


    In practice, you can select from descriptive, predictive, prescriptive, cognitive,
    or diagnosis. You can also perform descriptive first and, based on the results,
    use diagnosis to further investigate why and then use predictive and prescriptive
    analytics to solve the problem. You might even need to combine some or all of
    them. Most times, the result of the descriptive and diagnosis will determine the
    predictive technique to use.


    The data mining technique to be used is determined by the size of the dataset,
    the types of patterns that exist in the data, whether the data meets some underlying
    assumptions of the method, how noisy the data are, and the particular goal of
    the analysis. It is therefore important to apply several different methods and
    select the one that is most useful for the goal at hand. It is important to note
    that the modeling process is iterative, and there is a need to try several variants
    of the technique and use multiple variants of the same algorithm. The final choice
    is determined by performance assessment of the technique or algorithm as the case
    may be.¹


    **Feedback**: In the engagement phase, there is a need for continuous feedback
    between the analytics team and the stakeholders, and this can be as many as the
    turn of events. Sometimes, this feedback could alter the course of action, encourage
    the domain experts to cooperate more, and so on.


    **Communication of insights**: Insights will be communicated at regular intervals.
    Some insights can even cause some proposed future analytics to change and rework
    the whole analytics project. Communicating insights requires the knowledge of
    quality presentation skills orally and in presenting the results in the form of
    charts together with mastery in storytelling. In communicating insights, you should
    be able to gauge your audience and see what is appropriate for such an audience;
    sometimes, a high level of abstraction is needed, and sometimes there is a need
    for details. Results need to be presented using visuals where necessary, and finally
    tie up your recommendation with the insights that you have generated.


    ## 4.4 Post-Engagement Phase


    After communicating the recommendations of your analytics project, the next phase
    is the post-engagement phase, also known as the measurement tracking phase. This
    phase consists of the go-live preparation, go-live, measurement tracking against
    success metrics, and feedback incorporation. The steps in the post-engagement
    phase are iterative.


    **Go-live preparation**: This is when you organize workshops and training to educate
    those that will implement the recommendations and how they will implement them
    such that the overall goal of the analytics project can be achieved. Sometimes,
    there might be a need to use demos, fliers, and videos just to pass the message
    across. You also need to factor in change management, that is, how the people,
    processes, and systems that drive the organization will respond to the change
    that the recommendation will bring about to achieve the overall goal. If the solution
    involves a technology product, for example, you also need to tidy up loose ends
    as to how the solution will fit into the existing system.


    **Go-live**: In this step, you deploy your solution, implement the recommendation,
    and supervise the implementation of the recommendation. It takes two to three
    months for the implementation to go on before the tracking begins.


    **Measurement tracking against success metrics**: The next step is to track the
    effectiveness of your recommendations based on the success metrics highlighted
    in the pre-engagement phase. Based on the results from tracking the metrics, there
    are decisions to be made at this point. You might need to decide if there is a
    need to iterate the modeling processes or adjust the recommendations to improve
    success metrics or conclude on the achievement of the desired goal. Sometimes,
    you might need to track compliance techniques; for example, if it''s a recommender
    system that has recommended some products, you want to find out if those products
    ended up being sold or not.


    **Feedback incorporation**: The feedback from the go-live, measuring, and tracking
    will cause some actions to be taken toward the success of the project, particularly
    in improving the analytics process.


    Finally, when the measurement reveals a level of success that is acceptable, the
    next thing is to see how the process can be automated to avoid heavy dependency
    on the manual implementation of recommendations in the future. Though this is
    optional, having things run themselves is more efficient than relying on a manual
    process if it can be afforded.


    ## 4.5 Problems


    Given the following scenarios, explain the details of the activities for the pre-engagement,
    engagement, and post-engagement phases of a freelance business analyst that was
    given a contract based on the following:


    1.  A textile retailer, though having been experiencing success early, is now
    starting to see a decline in sales. Thankfully, the retailer has a dashboard that
    collects demographic information about current and target customers. The goal
    of this retailer is to use this information to locate areas for improvement and
    identify where sales were strongest. One way to go about this is to segment buyers
    by relevant factors and customize marketing strategies to each group.


    2.  A fitness instructor noticed that customers were leaving his business. The
    intention is to develop and install a predictive analytics model that will identify
    if a customer is likely to leave and quickly offer incentives that could prevent
    them from leaving.'
