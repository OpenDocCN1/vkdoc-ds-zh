    A screenshot depicts the clustering process for external data, which involves
    the following steps: retrieve, replace the missing value, nominal to numerical,
    select attributes, normalize, clustering, and performance.


    **Figure 10-29** Clustering the external data


    From the preceding results, we select `K=2` due to its smallest `davies_bouldin`
    value.


    The characteristics of the clusters are given as follows:


    ***Cluster_0***


    - `Billing State=Ogun` is low.

    - `Billing State=Others` is slightly high.

    - `Billing State=Lagos` is slightly high.

    - `Email Status=A` is slightly high.

    - `DiscountedPrice` is low.


    ***Cluster_1***


    - `Billing State=Ogun` is very high.

    - `Billing State=Others` is low.

    - `Billing State=Lagos` is slightly low.

    - `Email Status=A` is low.

    - `DiscountedPrice` is slightly high.


    (Note that other `k` values that give better separation and distinct characteristics
    can be tried out.)


    ### Linking both segmentation processes


    So after segmenting external data, we want to select the cluster that matches
    `Cluster_1` from the internal data. Unfortunately for this demonstration, `Cluster_1`
    (`Billing State=Lagos` is slightly high) is the only striking characteristic as
    the other attributes’ characteristics are not striking. Regardless, we still proceed
    by using only this attribute to match the characteristics of the external data
    to find that `Cluster_0` is the cluster with such characteristics along with other
    characteristics.


    The recommendation therefore is that if we intend to target a cluster that has
    a potential of high profit made and large number of members, `Cluster_0` in the
    external data is the recommended one. In other situations, where there are more
    distinguishing characteristics of the cluster, the recommendation would have been
    richer.


    ### Display and present the result


    Based on the audience in question, these results need to be presented in simple
    charts supported with necessary visual diagrams to depict the best option and
    the reason for selecting such an option.'
