    ## 使用逻辑回归进行分类的示例


    此示例使用的数据集名为 `UniversalBank.xlsx`。它包含 5000 名客户的数据。数据包括客户对最近一次个人贷款活动的反应（`personal
    loan`，个人贷款），以及客户的人口统计信息（`age` 年龄，`income` 收入等）和客户与银行的关系（`mortgage` 抵押贷款，`securities
    account` 证券账户等）。详情如下：


    | • Age | *客户年龄（以整年计算）* |

    | • Experience | *专业经验年数* |

    | • Income | *客户年收入（千美元）* |

    | • Family | *客户家庭人数* |

    | • CCAvg | *每月信用卡平均支出（千美元）* |

    | • Education | *教育水平。1：本科；2：研究生；3：高级/专业* |

    | • Mortgage | *房屋抵押贷款价值（如有，千美元）* |

    | • Securities Account | *若客户在银行有证券账户，编码为 1* |

    | • CD Account | *若客户在银行有大额定期存单账户，编码为 1* |

    | • Online Banking | *若客户使用网上银行服务，编码为 1* |

    | • Credit Card | *若客户使用由 Universal Bank 发行的信用卡，编码为 1* |


    在这 5000 名客户中，只有 480 名客户（即 9.6%）接受了此前一次营销活动中的个人贷款邀请。目标是建立一个模型，用于识别在未来的邮件营销中最有可能接受贷款邀请的客户。


    银行的这个应用场景只是一个选定的例子；其他应用场景，例如在销售活动中，目标是建立一个模型来识别最有可能进行购买的客户。在服务活动中，即向客户提供某种形式服务的企业，目标是建立一个模型，用于识别在未来提案或营销中会接受该服务邀约的客户。


    结果变量是 `personal loan`，其中 *yes*（是）被定义为 *success*（成功）（这等价于将接受者的结果变量设置为 1，将非接受者的结果变量设置为
    0）。


    解决此问题所需的某些数据预处理步骤是，先将属性 *Education*（教育水平）转换为多项式，然后将其转换为虚拟变量，并移除其中一个虚拟变量。目标属性 *Personal
    loan*（个人贷款）将被转换为二项式。之后，应对数据进行可视化以进行分类，并使用相关性矩阵发现相关属性（在本实践演示中将跳过此步骤，因为它将在本章的练习
    4 中进行）。此外，与线性回归类似，在逻辑回归中，我们可以使用自动变量选择启发式方法，例如逐步选择法、向前选择法和向后消除法（更多解释见 ^(4,5,6)）。


