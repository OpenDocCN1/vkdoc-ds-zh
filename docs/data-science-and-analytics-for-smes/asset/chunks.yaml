    Next, we try to explain the characteristics of all the preceding clusters as follows,
    as obtained from Figure [10-23](#532459_1_En_10_Chapter.xhtml#Fig26):


    ***Cluster_0***


    - `Billing State=Lagos` is slightly low.

    - `Billing State=Others` is slightly high.

    - This cluster does not have striking attributes that can distinguish it.


    ***Cluster_1***


    - `Billing State=Lagos` is slightly high.

    - Other attribute characteristics are not striking.


    ***Cluster_2***


    - `Email Status=A` is very low.

    - `No of Days` is very high.

    - These two attributes mostly separate items on this cluster.


    Since `Cluster_1` has the highest mean profit, ideally we would want to use the
    characteristics of `Cluster_1` to look for a similar cluster in the external data
    and then target it (going by the option of the best-case scenario), because it
    has a high number of customers and also high mean profit made.


    ### External data 5a–e


    The next set of steps will help to segment the external customers.


    Import the external data (`FarmCo.External`), and exclude the following while
    importing: `Customer ID`, `Shipping State`, `Quantity`, `No of C`, `Item Count`.
    This is because they are not used for internal data clustering.


    After examining the external data (`FarmCo.External.csv`) for missing values,
    we have the statistics in Figure [10-26](#532459_1_En_10_Chapter.xhtml#Fig31).
    There are missing values for some attributes. This will be dealt with by the `replace
    missing value` operator later.


