    \n收入为零的客户接受贷款的概率比估计为`e^(-6.127+(0.037)(0)) = 0.00218`。\n\n收入为$100K的客户接受贷款的概率比为`e^(-6.127+(0.037)(100))\
    \ = 0.0883`。\n\n## 7.8 练习\n\n1.  根据`Figure [7-24a](#532459_1_En_7_Chapter.xhtml#Fig34)`中的模型写出逻辑回归方程。\n\
    \n2.  通过预测新客户，完成使用逻辑回归的分类示例（第 [7.7](#532459_1_En_7_Chapter.xhtml#Sec7) 节）。\n\n\
    3.  重复实际商业问题 III；这一次，移除属性`NumOfProducts`和`EstimatedSalary`，并比较结果。算法的性能是否有改善？\n\
    \n4.  重复实际商业问题 III；这一次，包含相关矩阵并使用它在应用所有三种算法之前移除相关属性。准确性是否提高了？\n\n5.  对于本次练习，我们将使用一个名为`iandfnetworksolutions`的商业培训机构的数据科学案例研究。`iandfnetworksolutions`是一家在线数据分析培训和咨询公司，员工人数少于十人。数据科学家当前的任务是找出最佳的子集（前10%的潜在客户），以便针对他们开展一对一营销活动，该公司已发现这种方式在这种情况下最为有效。内部数据文件名为`InternalData.xlsx`；外部数据文件名为`Prospects.xlsx`。\n\
    \n6.  对于本次练习，我们将使用一家位于尼日利亚的大型面条零售店的案例研究。这家大型商店销售不同种类的面条给那些以更小批量进行零售的小商店。该零售店已成功保存了遍布尼日利亚各地的客户记录，并已整理出潜在客户的数据。数据科学家当前的任务是找出最佳模型，以：\n\
    \    1.  根据是否应该针对在线销售或线下销售来对潜在客户进行分类（分类问题）。\n    2.  找出区分在线和线下客户的因素（客户画像问题）。\n\
    \n数据文件命名为：\n    *   *内部数据*：`NoodleRetailLRInternal.xlsx`\n    *   *外部数据*：`NoodleRetailLRExternal.xlsx`\n\
    \n# 8. 高级描述性分析\n\n本章主要关注高级描述性分析技术。在本章中，我们将首先解释聚类（一种无监督学习方法）的概念。然后我们将介绍一种聚类技术，即`k-means`聚类。通过第四个实际商业问题，我们将解释如何使用`k-means`聚类技术来解决一个真实的商业问题。接下来，我们将解释关联规则的示例，最后是网络分析。我们将重点解释这些技术如何用于解决商业相关问题，特别是针对小企业，并以第五个商业问题结束，该问题侧重于使用网络分析来提升员工效率。"
