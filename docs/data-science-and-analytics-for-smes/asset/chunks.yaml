    shoes.xlsx. When importing, make sure to convert all the columns to binominal
    data type apart from the Transaction no (Trans.). After importing the data, check
    the ***Statistics*** to be sure that there are no missing values.


    2.  Use the settings in Figure [8-16](#532459_1_En_8_Chapter.xhtml#Fig18) to create
    frequent itemsets as displayed in the results in Figure [8-17](#532459_1_En_8_Chapter.xhtml#Fig19)
    after running the process.


    In Figure [8-16](#532459_1_En_8_Chapter.xhtml#Fig18), for the ***Select Attributes***
    operator, select all the binominal attributes apart from *Trans.* For the FP-Growth,
    leave the setting as default. Sometimes, depending on the data, you might need
    to reduce the support to get any result at all. The FP-Growth algorithm is an
    efficient algorithm for calculating frequently co-occurring items in a transaction
    database.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig19_HTML.png)


    A computer screenshot demonstrates the output of the process to create frequent
    itemsets with the specifications on the left.


    Figure 8-17


    Output of the process to create frequent itemsets


    Modify the settings in Figure [8-16](#532459_1_En_8_Chapter.xhtml#Fig18) to give
    Figure [8-18](#532459_1_En_8_Chapter.xhtml#Fig20) which is the complete settings
