- fmt: "## 8.3 Practical Business Problem IV (Customer Segmentation)\n\nThe case study\
    \ of this practical business problem is a noodle retail small business. `NoodleRetail.xlsx`\
    \ is a data on a noodle retail company that intends to segment their current customers\
    \ so as to be able to describe them. The goal is to segment and describe current\
    \ customers, that is, identify clusters of customers that have similar characteristics\
    \ for the purpose of targeting different segments for different types of offers\
    \ in the future. To do this, the clustering process needs to give them segments\
    \ that are as homogeneous as possible within themselves and heterogeneous from\
    \ each other.\n\n**Customer segmentation using k-means**\n\nThe following steps\
    \ are used for the segmentation process:\n\n1. *Data preprocessing*: We will first\
    \ handle missing values if there are any as `k-means` cannot deal with missing\
    \ values. If there are only few missing values, they can be excluded; if there\
    \ are many, they have to be imputed. We will then perform data visualization to\
    \ discover outliers. We will convert categorical to numerical (as `k-means` uses\
    \ a distance function and cannot handle categorical variables directly). If the\
    \ categorical variables are ordinal, we will replace with an arithmetic sequence,\
    \ and if it’s nominal, convert to binary. After this, we will normalize the data\
    \ and apply an appropriate dimension reduction technique. It is important to reduce\
    \ the dimension because any more than few tens of dimensions mean that distance\
    \ interpretation isn’t obvious and must be prevented. For this example, we use\
    \ Section [2.5](#532459_1_En_2_Chapter.xhtml#Sec12) as a guide for the data preprocessing\
    \ for unsupervised learning.\n\n2. Determine the number of `k`. There are several\
    \ approaches to doing this (as taught earlier), but we shall be supplying the\
    \ number of `k` to use for this assignment as a domain expert.\n\n3. Perform `k-means`\
    \ clustering using an appropriate distance measure for the distance between records\
    \ (numerical measure was selected because we have converted all the attributes\
    \ to numerical).\n\n4. Validate the clusters. To validate the generated cluster,\
    \ we use the *avg. within centroid distance*. (To further check the stability\
    \ of the clusters, you can remove a random 5% of the data (by taking a random\
    \ sample of 95% of the records) and repeat the analysis. Does the same picture\
    \ emerge?)\n\n5. To interpret the clusters, we will:\n   * Compare the cluster\
    \ centroid to characterize the different clusters, and try to give each cluster\
    \ a label.\n   * Provide an appropriate name for each cluster using any or all\
    \ of the variables in the dataset.\n   * Which clusters would you target for offers,\
    \ and what types of offers would you target to customers in that cluster?\n\n\
    **Data description**\n\nThe noodle retail data consist of the following attributes:\n\
    \n- `Brand`\n- `Country`\n- `Customer Id`\n- `Gender`\n- `Income Class`\n- `List\
    \ Price`\n- `Number of Records`\n- `Online Order`\n- `Owns Car`\n- `Product Class`\n\
    - `Product Id`\n- `Product Size`\n- `Purchases`\n- `Past 3 Years`\n- `State`\n\
    - `Transaction Date`\n- `Transaction Id`\n- `Deceased Indicator`\n- `Tenure`\n\
    \n1. (a) *Data preprocessing*: Create a repository (`Clustering`); create two\
    \ subfolders in the repository and name them `data` and `process`. **Import**\
    \ the data named `NoodleRetail.xlsx` into the `data` subfolder. When importing,\
    \ make sure to exclude the following attributes based on the reasons stated:\n\
    \   - `Country` (same values all through)\n   - `Number of Records` (same values\
    \ all through)\n   - `Customer Id` (not needed for the preprocessing)\n   - `Transaction\
    \ Date` (not needed for clustering)\n   - `Transaction Id` (not needed for clustering)\n\
    \   - `Deceased Indicator` (same values all through)\n   - `Product Id` (not needed\
    \ for the preprocessing or clustering)\n\nFigure [8-4](#532459_1_En_8_Chapter.xhtml#Fig4)\
    \ shows the **Statistics** of the data.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig4_HTML.png)\n\
    \nA screenshot of a noodle retail company’s statistics of the data that is used\
    \ to segment and describe the company’s customers using clustering.\n\n**Figure\
    \ 8-4** Statistics of the data"
  raw: "## 8.3 Practical Business Problem IV (Customer Segmentation)\n\nThe case study\
    \ of this practical business problem is a noodle retail small business. NoodleRetail.xlsx\
    \ is a data on a noodle retail company that intends to segment their current customers\
    \ so as to be able to describe them. The goal is to segment and describe current\
    \ customers, that is, identify clusters of customers that have similar characteristics\
    \ for the purpose of targeting different segments for different types of offers\
    \ in the future. To do this, the clustering process needs to give them segments\
    \ that are as homogeneous as possible within themselves and heterogeneous from\
    \ each other.\n\n**Customer segmentation using k-means**\n\nThe following steps\
    \ are used for the segmentation process:\n\n1.  *Data preprocessing*: We will\
    \ first handle missing values if there are any as k-means cannot deal with missing\
    \ values. If there are only few missing values, they can be excluded; if there\
    \ are many, they have to be imputed. We will then perform data visualization to\
    \ discover outliers. We will convert categorical to numerical (as k-means uses\
    \ a distance function and cannot handle categorical variables directly). If the\
    \ categorical variables are ordinal, we will replace with an arithmetic sequence,\
    \ and if it’s nominal, convert to binary. After this, we will normalize the data\
    \ and apply an appropriate dimension reduction technique. It is important to reduce\
    \ the dimension because any more than few tens of dimensions mean that distance\
    \ interpretation isn’t obvious and must be prevented. For this example, we use\
    \ Section [2.​5](#532459_1_En_2_Chapter.xhtml#Sec12) as a guide for the data preprocessing\
    \ for unsupervised learning.\n\n2.  Determine the number of k. There are several\
    \ approaches to doing this (as taught earlier), but we shall be supplying the\
    \ number of k to use for this assignment as a domain expert.\n\n3.  Perform k-means\
    \ clustering using an appropriate distance measure for the distance between records\
    \ (numerical measure was selected because we have converted all the attributes\
    \ to numerical).\n\n4.  Validate the clusters. To validate the generated cluster,\
    \ we use the *avg. within centroid distance*. (To further check the stability\
    \ of the clusters, you can remove a random 5% of the data (by taking a random\
    \ sample of 95% of the records) and repeat the analysis. Does the same picture\
    \ emerge?)\n\n5.  To interpret the clusters, we will\n    *   Compare the cluster\
    \ centroid to characterize the different clusters, and try to give each cluster\
    \ a label.\n\n*   Provide an appropriate name for each cluster using any or all\
    \ of the variables in the dataset.\n\n*   Which clusters would you target for\
    \ offers, and what types of offers would you target to customers in that cluster?\n\
    \n**Data description**\n\nThe noodle retail data consist of the following attributes:\n\
    \nBrand\n\nCountry\n\nCustomer Id\n\nGender\n\nIncome Class\n\nList Price\n\n\
    Number of Records\n\nOnline Order\n\nOwns Car\n\nProduct Class\n\nProduct Id\n\
    \nProduct Size\n\nPurchases\n\nPast 3 Years\n\nState\n\nTransaction Date\n\nTransaction\
    \ Id\n\nDeceased Indicator\n\nTenure\n\n1.  (a) *Data preprocessing*: Create a\
    \ repository (***Clustering***); create two subfolders in the repository and name\
    \ them data and process. ***Import*** the data named NoodleRetail.xlsx into the\
    \ ***data*** subfolder. When importing, make sure to exclude the following attributes\
    \ based on the reasons stated:\n    *   Country (same values all through)\n\n\
    *   Number of Records (same values all through)\n\n*   Customer Id (not needed\
    \ for the preprocessing)\n\n*   Transaction Date (not needed for clustering)\n\
    \n*   Transaction Id (not needed for clustering)\n\n*   Deceased Indicator (same\
    \ values all through)\n\n*   Product Id (not needed for the preprocessing or clustering)\n\
    \nFigure [8-4](#532459_1_En_8_Chapter.xhtml#Fig4) shows the ***Statistics*** of\
    \ the data.\n\n![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig4_HTML.png)\n\
    \nA screenshot of a noodle retail company’s statistics of the data that is used\
    \ to segment and describe the company’s customers using clustering.\n\nFigure\
    \ 8-4\n\nStatistics of the data"
  trans: "\n## 8.3 实际商业问题 IV（客户细分）\n\n本实际商业问题的案例研究对象是一家面条零售小企业。`NoodleRetail.xlsx`\
    \ 是一家面条零售公司的数据，该公司计划对现有客户进行细分，以便能够对其进行描述。目标是细分并描述现有客户，即识别出具有相似特征的客户群，以便未来针对不同细分群体提供不同类型的优惠。为此，聚类过程需要生成的各个细分群体在内部尽可能同质，而在群体间则尽可能异质。\n\
    \n**使用 k-means 进行客户细分**\n\n细分过程遵循以下步骤：\n\n1.  *数据预处理*：由于 `k-means` 无法处理缺失值，我们将首先处理可能存在的缺失值。如果缺失值很少，可以将其排除；如果缺失值很多，则必须进行插补。接着，我们将进行数据可视化以发现异常值。我们将把类别型数据转换为数值型数据（因为\
    \ `k-means` 使用距离函数，无法直接处理类别型变量）。如果类别型变量是有序的，我们将用等差数列替换；如果是名义型的，则转换为二进制。之后，我们将对数据进行归一化处理，并应用适当的降维技术。降维非常重要，因为一旦维度超过几十个，距离的解释就不那么直观了，必须避免这种情况。对于本例，我们参考第\
    \ 2.5 节作为无监督学习数据预处理的指南。\n\n2.  确定 `k` 值。有多种方法可以做到这一点（如前所述），但在此任务中，我们将作为领域专家直接提供要使用的\
    \ `k` 值。\n\n3.  使用适当的距离度量（因为我们已经将所有属性转换为数值型，所以选择了数值度量）来执行 `k-means` 聚类，用于计算记录间距离。\n\
    \n4.  验证聚类。为了验证生成的聚类，我们使用*平均质心内距离*。（为了进一步检查聚类的稳定性，你可以随机删除 5% 的数据（即抽取 95% 的记录作为随机样本）并重复分析。是否得到相同的结果？）\n\
    \n5.  为了解释聚类，我们将：\n    *   比较聚类质心以描述不同聚类的特征，并尝试为每个聚类赋予一个标签。\n    *   使用数据集中的任意或所有变量为每个聚类提供一个合适的名称。\n\
    \    *   你会针对哪些聚类提供优惠？你会向该聚类中的客户提供什么类型的优惠？\n\n**数据描述**\n\n面条零售数据包含以下属性：\n\n- `Brand`\n\
    - `Country`\n- `Customer Id`\n- `Gender`\n- `Income Class`\n- `List Price`\n-\
    \ `Number of Records`\n- `Online Order`\n- `Owns Car`\n- `Product Class`\n- `Product\
    \ Id`\n- `Product Size`\n- `Purchases`\n- `Past 3 Years`\n- `State`\n- `Transaction\
    \ Date`\n- `Transaction Id`\n- `Deceased Indicator`\n- `Tenure`\n\n1. (a) *数据预处理*：创建一个存储库（`Clustering`）；在该存储库中创建两个子文件夹，分别命名为\
    \ `data` 和 `process`。将名为 `NoodleRetail.xlsx` 的数据**导入**到 `data` 子文件夹中。导入时，请确保根据所述原因排除以下属性：\n\
    \   - `Country`（所有值均相同）\n   - `Number of Records`（所有值均相同）\n   - `Customer Id`（预处理不需要）\n\
    \   - `Transaction Date`（聚类不需要）\n   - `Transaction Id`（聚类不需要）\n   - `Deceased\
    \ Indicator`（所有值均相同）\n   - `Product Id`（预处理或聚类不需要）\n\n图 8-4 显示了数据的**统计信息**。\n\n\
    ![](img/532459_1_En_8_Fig4_HTML.png)\n\n一家面条零售公司数据的统计信息截图，这些数据用于通过聚类来细分和描述公司客户。\n\
    \n**图 8-4** 数据统计信息\n"
- fmt: '以下是根据要求排版后的 Markdown 内容：


    ---


    The following missing values are obvious from these statistics and will be treated
    by replacing them with the average value of the attributes:


    - `Brand` – 93

    - `Online order` – 170

    - `Product class` – 93

    - `Product size` – 93

    - `Tenure` – 214


    Create a new process (call it `preprocessing1`). Use the settings in Figure [8-5](#532459_1_En_8_Chapter.xhtml#Fig5)
    to replace the missing value with average. Click the **Replace Missing Values**
    operator and select `Brand`, `Online order`, `Product class`, `Product size`,
    and `Tenure`.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig5_HTML.png)


    *A computer screenshot illustrates the process to insert the missing values in
    the statistics of the data of the noodle retail company.*


    **Figure 8-5** *Process to deal with missing values*


    Run the process and visualize the resulting data (only the numerical attributes)
    for outliers using the settings in Figure [8-6](#532459_1_En_8_Chapter.xhtml#Fig6).


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig6_HTML.png)


    *A computer screenshot of a boxplot between the numeric attributes and their values.
    The settings of the plot are shown on the left side of the plot.*


    **Figure 8-6** *Visualizing the numerical attributes*


    Whether the numerical variables are visualized separately or together as revealed
    in the settings in Figure [8-6](#532459_1_En_8_Chapter.xhtml#Fig6), there appear
    to be no outliers.


    Figure [8-7](#532459_1_En_8_Chapter.xhtml#Fig7) is the visualization of the `age`
    attribute using a scatter plot to detect outliers; this can be done for all the
    numerical attributes.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig7_HTML.png)


    *A computer screenshot of a scatter plot between customer id and age attribute
    on the Y and X-axes, respectively. The settings are depicted on the left of the
    plot.*


    **Figure 8-7** *Scatter plot of the numerical attribute age*


    Let’s modify the settings in Figure [8-5](#532459_1_En_8_Chapter.xhtml#Fig5) to
    give Figure [8-8](#532459_1_En_8_Chapter.xhtml#Fig8) in order to investigate for
    the need to reduce attributes by converting all categorical variables to numerical,
    normalizing and performing a correlation matrix.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig8_HTML.png)


    *A computer screenshot depicts the settings to convert all categorical variables
    to numeric and create a correlation matrix.*


    **Figure 8-8** *Further preprocessing of the data*


    As seen in Figure [8-8](#532459_1_En_8_Chapter.xhtml#Fig8), the `Nominal to Numerical`
    operator selects all the categorical attributes. Click the **Normalize** operator,
    and for the **attribute filter type** parameter, select **all**. Leave the **Correlation
    Matrix** operator as the default setting. Running the process gives us the correlation
    matrix in Figure [8-9](#532459_1_En_8_Chapter.xhtml#Fig9); clicking the **Pairwise
    Table** in the same figure and sorting the correlation values in descending order,
    we get Figure [8-10](#532459_1_En_8_Chapter.xhtml#Fig10).


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig10_HTML.jpg)


    *A computer screenshot of a correlation matrix obtained after clicking the pairwise
    table option and sorting the correlation values in descending order.*


    **Figure 8-10** *Correlation matrix (Pairwise Table)*


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig9_HTML.png)


    *A computer screenshot displays the correlation matrix with some highlighted values.
    The matrix helps to find out the need to reduce attributes.*


    **Figure 8-9** *Correlation matrix*


    From Figure [8-10](#532459_1_En_8_Chapter.xhtml#Fig10), we see that there are
    no strongly correlated pair (the highest pairwise correlation is 0.331), and for
    this reason, all the attributes will be used for this demonstration. (Some attributes
    on top of the list might be removed later to see if there will be better cluster
    separation when evaluated.) This decision is concluded based on the Pearson correlation
    formula, which is used by the **Correlation Matrix** operator.


    Pearson’s correlation coefficient `R` is the end result obtained in which the
    value must range from –1 to +1 or –1 <= `R` <= +1.


    ![$$ r=\frac{n\sum xy-\sum x\sum y}{\surd \left\{n\sum {x}^2-\left(x{\sum}^2\right)\right\}\left\{n\sum
    {y}^2{\left(\sum y\right)}^2\right\}} $$](images/532459_1_En_8_Chapter/532459_1_En_8_Chapter_TeX_Equa.png)


    The preceding formula is used to get the value for `R`, and the value for `R`
    must fall in the following range:


    - `+1 to 0.7`: Means that the strength of the variables is perfectly related in
    a positive way

    - `0.6 to 0.5`: Means that the strength of variables is fairly related

    - `0.4 to 0.2`: Means that the strength of variables is poorly related

    - `-1 to -0.7`: Means that the strength of variables is strongly related in a
    negative way

    - `-0.6 to -0.5`: Means that the strength of variables is fairly related

    - `-0.4 to -0.2`: Means that the strength of variables is poorly related

    - `0`: Means that there is no strength or relation


    ---


    (b) We then move to the second part of preprocessing which deals with importing
    the afresh (because we need the customer ID for clustering) and selecting only
    the attributes that are not strongly correlated. The result of this process will
    be stored in a csv file which will then be imported again for k-means clustering.


    **Import** the data (`NoodleRetail.xlsx`) again; this time, change the role of
    `customer Id` to `Id` as seen in Figure [8-11](#532459_1_En_8_Chapter.xhtml#Fig11).
    After this, exclude the attributes `Country`, `Number of Records`, `Transaction
    Date`, `Transaction Id`, `Deceased Indicator`, and `Product Id`. Name this new
    data `NoodleRetail2` in `RapidMiner`.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig11_HTML.png)


    *A computer screenshot illustrates the importing of the fresh data from the existing
    excel sheet by changing the role of customer Id to Id and excluding some specific
    attributes.*


    **Figure 8-11** *Importing the data for k-means clustering*


    Create a new process (call it `preprocessing2`). Use the settings in Figure [8-12](#532459_1_En_8_Chapter.xhtml#Fig12)
    to create the process. The purpose of this process is to preprocess only the attributes
    that will be clustered.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig12_HTML.png)


    *A computer screenshot illustrates the settings to create a new process which
    aims to preprocess only the attributes that are used for clustering.*


    **Figure 8-12** *Preprocessing the data for k-means*


    For the **Replace Missing Value** operator, select `Brand`, `Online order`, `Product
    class`, `Product size`, and `Tenure`; for the **Nominal to Numerical** operator,
    select all available categorical data; and for the **Normalize** operator, select
    all apart from `customer Id`. For the csv file parameter of the **Write CSV**
    operator, select `NoodleRetailNormalize.csv` (which is an empty csv file that
    you would have created by yourself and saved somewhere on your system). After
    running the process, the data will be stored in `NoodleRetailNormalize.csv`.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig13_HTML.png)


    *A computer screenshot displays the settings to perform the K-means clustering
    process.*


    **Figure 8-13** *k-means process*


    1.  **Determine k**: To determine `k`, there are several approaches to do this,
    but we shall be supplying the number of `k` (which is 2) to use for this demonstration,
    representing the domain expert.

    2.  **Perform k-means clustering and validate the clusters**: Numerical measures
    were selected because we have converted all the attributes to numerical. **Import**
    the `NoodleRetailNormalize.csv`, and create a new process (call it `kmeans`);
    use the settings in Figure [8-13](#532459_1_En_8_Chapter.xhtml#Fig13) for this
    process (the k-means clustering). For the `k` parameter of the **k means** operator,
    set it as 2 and leave all other parameter settings as default. For the **Cluster
    Distance Performance** operator, leave the main criterion parameter as default.
    (Please read the help of these operators in the `RapidMiner` documentation for
    more details.)'
