    age. To deal with the outlier based on this information, you can use the same
    process in Figure [2-11](#532459_1_En_2_Chapter.xhtml#Fig12) and then for the
    filter examples operator set as in Figure [2-12a](#532459_1_En_2_Chapter.xhtml#Fig13).


    ### Normalization and Categorical Variables


    Normalization is used to scale attribute data to fall within a specified range.
    It is the method of organizing data to appear similar across all records and fields.
    We normalize so that attributes will not take undue advantage over each other
    in modeling or analytics processes. Some algorithms require it, for example, neural
    networks; also, some clustering algorithms require data normalization. There are
    several types: min-max normalization, z-score normalization, and so on. Min-max
    normalization is one of the most common ways to normalize data. For every feature,
    the minimum value of that feature gets transformed into a 0, the maximum value
    gets transformed into a 1, and every other value gets transformed into a decimal
    between 0 and 1.'
