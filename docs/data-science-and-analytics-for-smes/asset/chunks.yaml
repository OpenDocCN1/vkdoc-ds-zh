    |     • EstimatedSalary | *Real* |

    |     • Exited | *Outcome variable but has to be changed to categorical* |


    Regardless of the classification algorithm that will be used, the very first thing
    is to perform basic data preprocessing and explore the data using necessary visualization
    tools for the purpose of classification.


    **General** **data preprocessing** **for the classification techniques**


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig1_HTML.png)


    The images show the importing data process begins with date format, replacing
    errors with missing values checked, and three buttons below, which are previous,
    next, and cancel.


    Figure 7-2


    Importing the data


    1.  Create a new ***repository*** and two ***subfolders*** (for data and for the
    process) in the repository. ***Import*** the data named *Churn_Modelling.csv*
    into the data subfolder. When importing, remove RowNumber, CustomerID, and Surname
    columns and convert HasCrCard, IsActiveMember, and Exited to categorical attributes.
    Also, replace errors with missing values when importing the data. Figure [7-2](#532459_1_En_7_Chapter.xhtml#Fig1)
    is the screenshot of importing the data.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig2_HTML.png)


    The plot type is set to column bar, value columns set to exited, group by geography,
    and aggregation function set to count.


    Figure 7-3


    Example of a bar chart of a categorical attribute and target variable


    1.  After importing the data, drag it to the design view and connect it to ***res***.
    Run the process and view the ***statistics***. From the ***statistics*** view
    of the data, notice that the unnecessary attributes have been removed, and the
    needed attribute change has occurred. Also, there are no missing values.


    2.  Using the guide for visualization, particularly with respect to classification
    (refer to Section [2.​5](#532459_1_En_2_Chapter.xhtml#Sec12) in Chapter [2](#532459_1_En_2_Chapter.xhtml)),
    we will study the relation of outcome to categorical predictors using bar charts
    with the outcome on the *y* axis. The goal is to find out if the category of the
    predictors is fairly represented in the outcome or target attribute. Use the settings
    in Figure [7-3](#532459_1_En_7_Chapter.xhtml#Fig2) to visualize all the categorical
    variables against the target attribute. We can see that for all the categorical
    attributes, there is a fair representation in the outcome variable.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig3_HTML.png)


    The plot type is set to scatter, the x-axis column set to age, the value column
    set to credit score, and the color set to exited.


    Figure 7-4


    An example of a color-coded scatter plot for classification


    1.  Study the relation of outcome to pairs of numerical predictors via color-coded
    scatter plots (color denotes the outcome). The goal here is to see if there is
    a linear relationship between the numerical predictors and to see the strength
    of the outcome class in the numerical predictors. Use the settings in Figure [7-4](#532459_1_En_7_Chapter.xhtml#Fig3)
    to do this for different combinations of the numerical attributes. Notice that
    there is no such linear relationship. Incase there is such relationship, it has
    to be handled because of multicollinearity.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig4_HTML.jpg)


    The plot type is set to boxplot, the value column is set to age, and the group
    by option is selected with the exited option.


    Figure 7-5


    An example of the boxplot visualized for classification


    1.  Study the relation of outcome to numerical predictors via side-by-side boxplots:
    plot boxplots of a numerical variable by outcome. Create similar displays for
    each numerical predictor. The most separable boxes indicate potentially useful
    predictors. Use the settings in Figure [7-5](#532459_1_En_7_Chapter.xhtml#Fig4)
    to investigate this for all the numerical attributes. Note that apart from NumOfProducts
    and EstimatedSalary, all the other numerical attributes are fairly separable as
    indicated by the red arrow in Figure [7-5](#532459_1_En_7_Chapter.xhtml#Fig4).
    (Their medians are fairly different). In exercise 3 of this chapter, we will experiment
    the classification process removing these attributes, but for now it will be included.'
