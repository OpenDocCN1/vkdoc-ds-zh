    ## 10.2 目标 2：提升网站销售收入


    与第一个目标类似，我们首先明确从第二个目标的预接洽阶段得出的分析流程。为了实现第二个目标，我们将根据现有数据采用三种主要的分析方法：


    1.  *客户忠诚度干预*：对采样的历史数据应用逻辑回归，构建模型以发现可能流失的客户。该模型将用于预测其网站现有客户的行为（流失或不流失）。随后将进行关联规则挖掘，用于通过电子邮件向那些可能流失的客户推荐产品。在此方法中，流失被定义为从历史数据采样日期起，过去两年内未购买任何商品的客户。


    2.  *最近购买时间、购买频率与消费金额细分*：第二种方法，我们将执行 RFM 细分。这是基于典型聚类所需的属性丰富度不足而做出的决定。目的是能够理解和描绘
    FarmCo 现有客户的画像，以便更好地进行客户关系管理。


    3.  *战略市场目标*：此方法将建模规范分析。规范分析将用于确定针对未来客户的最佳可执行策略。对于这种分析方法，将使用聚类技术，具体来说是 `k-means`
    聚类。我们还将在此分析项目中采用反向思考的方法。


    ### 客户忠诚度干预


    ![](img/532459_1_En_10_Fig7_HTML.png)


    一张截图展示了逻辑回归/样本历史的示例集。一个条形图绘制了国际和 NC 的值。


    **图 10-6** 研究目标变量与分类结果的示例


    1.  使用条形图研究目标变量与分类结果的关系，y 轴为结果（如图 10-6 所示）。对所有相关属性执行此操作后发现（除了 `Email Status`、`Os
    Version` 和 `Payment Method`），所有分类属性的类别都相当正常，因为没有属性包含过多类别、类别中存在错误或类别不均衡。如果存在任何这些问题，则需在此阶段处理。


    2.  导入名为 `SampleHistorical.xlsx` 的数据，用缺失值替换错误，并排除 `CustomerID`、`Billing State`、`Email
    Permission`、`Device Brand`、`Shipping Country` 和 `Shipping State`（原因是这些属性要么类别过多，要么只有一个类别）。


    3.  检查统计数据以确保没有缺失值。


    4.  使用以下指南可视化分类任务的属性：


    ![](img/532459_1_En_10_Fig8_HTML.png)


    一张截图展示了检索样本历史数据的示例集。一个散点图绘制了流失与非流失客户的商品数量与折扣价格的关系。最高流失点绘制在 (540000, 300) 处。


    **图 10-7** 通过颜色编码散点图研究结果变量与成对数值预测变量关系的示例


    5.  通过颜色编码散点图研究目标/结果变量与成对数值预测变量的关系（如图 10-7 所示）。对所有相关变量执行此操作后发现，数值预测变量之间没有相关性。这意味着我们可以将所有数值预测变量进入建模阶段。


    ![](img/532459_1_En_10_Fig9_HTML.png)


    一张截图展示了不同项目的相关分析，包含十四行十四列。


    **图 10-8** 相关矩阵


    6.  使用相关性分析移除相关属性（图 10-8）。相关性分析结果显示，需要移除 `Item Count` 或 `Quantity`，因为它们高度相关。


    ![](img/532459_1_En_10_Fig11_HTML.png)


    一个表格包含三行三列。列标题为真实流失、真实非流失和类别精确率。行标题为预测流失、预测非流失和类别召回率。


    **图 10-10** 逻辑回归模型评估


    ![](img/532459_1_En_10_Fig10_HTML.png)


    一张截图展示了一个包含六列十八行的表格。列标题：属性、系数、分层系数、分层误差、z 值和 p 值。各个属性的值已给出。


    **图 10-9** 逻辑回归模型


    7.  使用步骤 3a–c 的结论，您可以创建一个逻辑回归模型，如图 10-9 所示。（注意，由于数据样本较小，最好使用分层交叉验证。）模型的评估结果如图
    10-10 所示。该模型的准确率为 61.08%。（注意，在此阶段，如果我们希望获得更高的准确率，还需要尝试其他算法、属性选择技术等，但出于本示例演示的目的，我们继续进行。）


    ![](img/532459_1_En_10_Fig12_HTML.png)


    一张截图展示了不同属性的预测结果，包含十一列十九行。列标题为预测、置信度（流失和非流失）、账单数量、浏览器、设备类型、电子邮件状态、操作系统、付款方式和折扣。


    **图 10-11** 预测结果


    8.  使用图 10-9 中的模型，我们可以利用名为 `FoodAgricGroup.xlsx` 的数据预测当前客户的流失意向。请注意，该数据不包含名为 `Intention`
    的属性，因为这正是要预测的内容。预测结果如图 10-11 所示。


    ![](img/532459_1_En_10_Fig13_HTML.png)


    一张截图展示了包含数据、图表、描述和注释的结果历史，以及以表格形式呈现的关联规则结果，该表格有 10 列二十行。


    **图 10-12** 关联规则挖掘结果


    9.  下一步是使用名为 `FoodAgricTransAsso.xlsx` 的事务数据执行关联规则，以发现哪些商品常被一起购买。结果如图 10-12 所示。


    10. 为了总结这种分析方法，我们将利用图 10-12 中的推论，通过电子邮件营销活动向客户（即图 10-11 中显示的高流失倾向客户）推荐产品。请注意，这只是实施分析结果的一种方法。还可以探索其他创造性的方法，例如在网站上嵌入推荐引擎等等。


    ### RFM 细分


    RFM 细分用于针对特定客户群，发送更贴合其特定行为的沟通信息。RFM 细分是识别需要给予额外关注的客户群体的有用工具。RFM 代表最近购买时间、购买频率和消费金额。RFM
    使用数值标尺来生成既简洁又有启发性的高层次客户画像。它易于理解和解读。


    -   *最近购买时间*：客户上次与品牌进行互动或购买活动有多久了？

    -   *购买频率*：客户在特定时期内与品牌发生交易或互动的频率如何？

