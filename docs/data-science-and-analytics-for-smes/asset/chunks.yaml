    ## 7.2 实际业务问题 III（客户忠诚度）


    客户忠诚度被描述为，即使其他公司（通常称为竞争对手）提供类似的产品或服务，客户仍反复选择某个品牌或公司产品或服务的习惯。忠诚的客户绝不会被竞争对手产品的成本、价格或数量所动摇。他们宁愿为所习惯的同等高质量服务和产品支付更高的价格。星巴克将其
    26.5 亿美元的额外收入大部分归功于其奖励计划。客户忠诚度对所有类型的组织都有益，因为它能带来回头客、增加收入、培养品牌影响者和倡导者、使公司从竞争中脱颖而出，并提供诚实且有用的反馈。


    在这个第三个实际业务问题中，我们将使用相同的实验条件，比较神经网络、分类树和随机森林的结果。目标是通过一个案例研究来演示如何使用这些算法进行推断，从而为我们的企业获取和留住客户。具体来说，我们将预测银行客户的忠诚度，并以此来了解客户是否会离开银行（即客户的忠诚度如何）。根据预测结果，将采用适当的关係营销方法来鼓励客户留下（如果你预测他们会离开），或者为忠诚的客户加强客户关系管理，例如提供折扣以促进更多销售。需要注意的是，虽然我们这里以银行作为案例研究，但任何其他业务都可以使用合适的数据属性进行同样的操作。


    该业务问题的数据文件名为 `Churn_Modelling.csv`，其中包含一家银行客户的数据。数据描述如下：


    | • RowNumber | *标识信息，需要移除* |

    | • CustomerId | *标识信息，需要移除* |

    | • Surname | *文本型标识信息，需要移除* |

    | • CreditScore | *整型* |

    | • Geography | *分类型 – 表示国家* |

    | • Gender | *分类型 – 表示性别* |

    | • Age | *整型* |

    | • Tenure | *整型* |

    | • Balance | *实数型* |

    | • NumOfProducts | *整型* |

    | • HasCrCard | *整型，但需更改为分类型* |

    | • IsActiveMember | *整型，但需更改为分类型* |

    | • EstimatedSalary | *实数型* |

    | • Exited | *结果变量，但需更改为分类型* |


    无论使用哪种分类算法，首先要做的事情都是执行基本的数据预处理，并使用必要的可视化工具探索数据，以便进行分类。


    **分类技术的通用数据预处理**


    ![图 7-2](img/532459_1_En_7_Fig1_HTML.png)

    图片展示了从日期格式开始的导入数据过程，将错误替换为缺失值并进行检查，下方有三个按钮：上一个、下一个和取消。


    图 7-2 导入数据


    1. 创建一个新的**存储库**，并在其中创建两个**子文件夹**（一个用于数据，一个用于流程）。将名为 `Churn_Modelling.csv` 的**数据**导入到数据子文件夹中。导入时，移除
    `RowNumber`、`CustomerID` 和 `Surname` 列，并将 `HasCrCard`、`IsActiveMember` 和 `Exited`
    转换为分类型属性。同时，在导入数据时将错误替换为缺失值。图 7-2 是导入数据的截图。


    ![图 7-3](img/532459_1_En_7_Fig2_HTML.png)

    图表类型设置为柱状图，值列设置为 Exited，分组依据设置为 Geography，聚合函数设置为计数。


    图 7-3 分类型属性和目标变量的柱状图示例


    2. 导入数据后，将其拖入设计视图并连接到 **res**。运行流程并查看**统计信息**。从数据的**统计信息**视图中，可以注意到不必要的属性已被移除，所需的属性更改也已生效。此外，没有缺失值。


    3. 根据可视化指南，特别是关于分类的部分（请参阅第 2 章第 2.5 节），我们将使用柱状图研究结果与分类型预测变量的关系，其中结果变量位于 `y` 轴上。目标是找出预测变量的类别在结果或目标属性中是否得到了公平的体现。使用图
    7-3 中的设置来可视化所有分类型变量与目标属性的关系。我们可以看到，对于所有分类型属性，它们在结果变量中都有公平的体现。


    ![图 7-4](img/532459_1_En_7_Fig3_HTML.png)

    图表类型设置为散点图，x 轴列设置为 Age，值列设置为 Credit Score，颜色设置为 Exited。


    图 7-4 用于分类的彩色编码散点图示例


    4. 通过彩色编码散点图研究结果与成对数值预测变量的关系（颜色表示结果）。此处的目的是查看数值预测变量之间是否存在线性关系，并观察结果类别在数值预测变量中的强度。请使用图
    7-4 中的设置，对不同的数值属性组合进行此操作。请注意，不存在这样的线性关系。如果存在这种关系，由于多重共线性，必须对其进行处理。


    ![图 7-5](img/532459_1_En_7_Fig4_HTML.jpg)

    图表类型设置为箱线图，值列设置为 Age，并选择分组依据选项为 Exited。


    图 7-5 为分类可视化的箱线图示例


    5. 通过并排箱线图研究结果与数值预测变量的关系：绘制按结果分组的数值变量的箱线图。为每个数值预测变量创建类似的显示。分离度最高的箱线图表示潜在有用的预测变量。请使用图
    7-5 中的设置对所有数值属性进行此项研究。请注意，除了 `NumOfProducts` 和 `EstimatedSalary` 之外，所有其他数值属性都具有相当好的分离度，如图
    7-5 中的红色箭头所示（它们的中位数差异相当大）。在本章的练习 3 中，我们将尝试移除这些属性后的分类过程，但目前仍将它们包括在内。

    '
- fmt: '# 7.3 Neural Network


    Please refer to Section [6.​5](#532459_1_En_6_Chapter.xhtml#Sec5) for details
    on the neural network algorithm.


    **Customer loyalty with neural network**


    Using the customer loyalty problem introduced in Section [7.2](#532459_1_En_7_Chapter.xhtml#Sec2),
    the following demonstrates how to use a neural network to solve the problem:


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig5_HTML.png)


    The process tab displays the parameters section. A number of folds are set to
    10, sampling type is set to automatic, and enable parallel execution is checked.


    Figure 7-6a


    Main process of the neural network


    1. Create a new process, drag the already imported `Churn_Modelling` data to the
    design view. We will use the settings in Figures [7-6a](#532459_1_En_7_Chapter.xhtml#Fig5)
    (main process) and [7-6b](#532459_1_En_7_Chapter.xhtml#Fig6) (inner process) to
    develop and evaluate the model.


    In Figure [7-6a](#532459_1_En_7_Chapter.xhtml#Fig5), for the `Nominal to Numerical`
    operator you will select the attributes `Gender`, `Geography`, `HasCrCard`, and
    `IsActiveMember` (converting them to dummies). Click the `Set Role` operator and
    set the `attribute name` to be `Exited` and the `target role` to be label. Leave
    the `Cross Validation` operator as default settings, meaning that we will be using
    a 10 folds validation.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig6_HTML.png)


    The process tab displays the parameters section, where the main criterion is set
    to first and accuracy is checked from a listed set of parameters.


    Figure 7-6b


    Inner processes of the neural network


    In Figure [7-6b](#532459_1_En_7_Chapter.xhtml#Fig6) for the `Neural Net` operator,
    we will click the hidden layer and give it any name (e.g., “ibk”) and set it to
    –1. If the hidden layer size value is set to –1, the layer size would be calculated
    from the number of attributes of the input example set. More information in the
    RapidMiner documentation. All other settings remain as default. The `Apply Model`
    operator needs no parameter adjustment. For the parameters of the `Performance
    (Classification)` operator, simply leave as default, which is accuracy.


    For the settings in Figures [7-6a](#532459_1_En_7_Chapter.xhtml#Fig5) and [7-6b](#532459_1_En_7_Chapter.xhtml#Fig6),
    we are expecting two outputs. Figure [7-7a](#532459_1_En_7_Chapter.xhtml#Fig7)
    is the neural network model, and Figure [7-7b](#532459_1_En_7_Chapter.xhtml#Fig8)
    is the performance of the model.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig8_HTML.png)


    The performance tab with the criterion set to accuracy and table view is selected.
    The data in columns of true 1, true 0, and class precision is listed.


    Figure 7-7b


    Performance result of the model


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig7_HTML.png)


    The neural net section of the results tab is displayed with the neural network
    model depicted in three columns of input, hidden, and output.


    Figure 7-7a


    Neural network model


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig9_HTML.png)


    The process tab has a flow of processes defined as retrieve, set role, nominal
    to numerical conversion, cross-validation, group models, apply model, and retrieve.


    Figure 7-8


    Predicting for new records or transactions


    1. Once we have established an optimal model for prediction, we can now use the
    model to predict new data. To do this, we will load the data `Churn_ModelingNew.xlsx`
    which has been prepared for predicting for new customers. The data is prepared
    such that it does not have the outcome variable. Also when importing the data,
    remove `RowNumber`, `CustomerID`, and `Surname` columns and convert `HasCrCard`,
    `IsActiveMember`, and `Exited` to categorical attributes. Also, replace errors
    with missing values when importing the data. To predict a new record, we will
    modify the main process in Figure [7-6a](#532459_1_En_7_Chapter.xhtml#Fig5) to
    give Figure [7-8](#532459_1_En_7_Chapter.xhtml#Fig9).


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig10_HTML.png)


    The results tab is selected with the data listed in the table where the columns
    of prediction, confidence 1, and confidence 0 are highlighted.


    Figure 7-9


    Output of the new prediction


    1. Figure [7-9](#532459_1_En_7_Chapter.xhtml#Fig10) is the output from the modification
    in Figure [7-8](#532459_1_En_7_Chapter.xhtml#Fig9). It shows the result for predicting
    the new transactions. It also reveals the confidence (propensity) of the predicted
    results. From these confidence results, we can see that the default threshold
    of 0.5 has been used to classify the customers into `Exited` (1) or not `Exited`
    (0).'
