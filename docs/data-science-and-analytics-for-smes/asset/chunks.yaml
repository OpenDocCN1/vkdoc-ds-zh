    and distributions, for example, histograms. Some advanced descriptive analytics
    includes associations or clustering algorithms. An example of the question that
    descriptive analytics helps to answer is: *What type of customers are renting
    our equipment?* Sometimes, we use descriptive analytics to identify the link between
    two variables; this field of study is known as association rule mining. A supermarket,
    for example, might collect information on customer purchase behavior. The supermarket
    can use this information to discover which products are usually purchased together
    and sell them accordingly. This is known as market basket analysis. In addition,
    clustering can be used to identify groupings and structures in data that are “similar”
    in some sense without relying on existing data structures.


    *Predictive analytics* takes what we know of what happened in the past to predict
    what will happen in the future. It makes use of advanced statistics such as regression
    algorithms that include linear, logistic, and tree-based algorithms, neural networks,
    and so on. Classification and regression tasks fall under predictive analytics.
    Classification deals with generalizing known structures to apply to new data.
    For example, an email program might attempt to classify an email as “legitimate”
    or as “spam.” Regression attempts to determine the strength and character of the
    relationship between one dependent variable and a series of other variables. An
    example of the question that predictive analytics helps to answer is: *Who rented
    our equipment in the past, predict who will rent in the future?* Predictive analytics
    is typically an iterative process in which we try multiple variants of the same
    algorithm, that is, choosing different variables or settings within the algorithm.
    The choice of what to settle for is usually decided by feedback from the algorithm’s
    performance on validation data and how well it is performing on real-world data.
    It is important to note here that machine learning algorithms are data dependent,
    so this iterative process must be observed for each case study data before concluding
    which algorithm to settle for.


    *Prescriptive analytics* links analysis to decision making by providing recommendations
    on what we should do. It helps us to know which customers to target and what choice
    we should make and usually involves the integration of numerical optimization
    techniques with business rules and financial models.


    There are other types of tasks which include the diagnostic analytics and the
    cognitive analytics.


    *Diagnostic analytics* takes past performance and uses it to determine which elements
    influence specific trends. It helps to answer the question “*why did it happen?*”,
    thus creating a clear connection between data and behavioral patterns. It enables
    data analysts to drill into the analytics to uncover patterns, trends, and correlations,
    and it uses more complicated queries. Regression analysis, anomaly detection,
    clustering analysis, and other techniques are among those used.⁵


    *Cognitive analytics*: The descriptive, diagnostic, predictive, and prescriptive
    analytics are gradually evolving currently to include specialized areas such as
    cognitive analytics, automated analytics, smart analytics, and more.⁵ Artificial
    Intelligence and Machine Learning techniques are combined with data analytics
    approaches in cognitive analytics. In the field of Business Analytics, cognitive
    analytics solutions assist companies in making key business decisions and reaching
    conclusions based on existing knowledge bases.⁵


    The choice of which task or algorithm to use or how to combine them is determined
    by the size of the dataset; the types of patterns that exist in the data, that
    is, whether the data meets some underlying assumptions of the method; how noisy
    the data is; and, most importantly, the particular goal of the analysis. The approach
    used in data mining is to apply several different methods and select the one that
    is most useful for the goal at hand. For a more comprehensive understanding of
    how to evaluate models, check Galit Shmueli et al. (2018, p. 117).


    ### Summarize and Interpret Results


    In this stage of the Business Analytics journey, we interpret and summarize the
    results obtained from the data analytics stage. It is very important to factor
    in the context of the business. There is a need for a clear understanding of how
    the business works so you can understand what the results are telling you. We
    interpret the results of analysis using charts, graphs, statistical tables, and
    so on in order to make it easy to see what is going on. In doing this, simplicity
    is the key; we need to narrow all that has been done to a few key points and determine
    whether you have successfully answered the questions we set out to answer. In
    Business Analytics, when interpreting the results, you must not forget to state
    (by linking the interpreted results with the problem scenario) what the company
    stands to gain from this analysis.


    ### Presentation


    In presenting the results, you need a clear understanding of how the business
    works; then with the help of charts, graphs, or tables, you will be able to present
    what is going on. You will also need to supplement the figure with a short narrative
    explaining what they mean. Simplicity is the word here, regardless of how complex
    the analytics procedure is; at this point, you will need to reduce the details
    and sieve out all your analysis into a few key points. At this point, you want
    to check if you have been able to successfully answer all the questions you set
    out to answer at the beginning of the analytics project. It’s interesting to know
    that sometimes you might even discover that you were asking or pursuing the wrong
    goal or question to begin with. Do not forget that as a business analyst, solid
    presentation skills are required to be able to communicate your analytics results
    efficiently. Depending on the tools you are using to make your presentation (Tableau
    dashboard, Microsoft PowerPoint, etc.), you will need to develop mastery in its
    use and ability to use it to communicate effectively.'
  trans: '

    # 数据分析


    在此阶段，我们确定要执行的数据挖掘任务。其范围涵盖描述性分析、诊断性分析、预测性分析、规范性分析和认知性分析。有时，您可能需要将这些任务结合起来，或将它们作为相互的先决条件。这里需要重点注意的是，没有一种方法比另一种更重要；一切都取决于业务分析项目的最终目标或目的。


    `*描述性分析*`有助于描述当前事物的状态或过去发生的事件。在描述性分析中，我们利用现有信息来更好地理解业务环境，并将这些知识与商业洞察力相结合，以做出更明智的决策。描述性分析使用简单的汇总、交叉表以及简单的统计量（如均值、中位数、标准差和分布，例如直方图）。一些高级的描述性分析包括关联规则或聚类算法。描述性分析能够帮助回答的一个问题示例是：`*什么样的客户在租用我们的设备？*`
    有时，我们使用描述性分析来识别两个变量之间的联系；这一研究领域被称为关联规则挖掘。例如，超市可能会收集顾客购买行为的信息。超市可以利用这些信息发现哪些商品通常被一起购买，并据此进行销售。这被称为购物篮分析。此外，聚类可用于识别数据中在某种意义上“相似”的分组和结构，而无需依赖现有的数据结构。


    `*预测性分析*`利用我们对过去发生事件的了解来预测未来会发生什么。它使用高级统计方法，例如回归算法，包括线性回归、逻辑回归、基于树的算法、神经网络等。分类和回归任务属于预测性分析范畴。分类涉及将已知结构泛化以应用于新数据。例如，电子邮件程序可能会尝试将一封电子邮件分类为“合法”或“垃圾邮件”。回归则试图确定一个因变量与一系列其他变量之间关系的强度和特征。预测性分析能够帮助回答的一个问题示例是：`*谁过去租用过我们的设备，预测未来谁会租用？*`
    预测性分析通常是一个迭代过程，我们会尝试同一算法的多个变体，即在算法中选择不同的变量或设置。最终选择什么通常取决于算法在验证数据上的性能反馈以及它在真实世界数据上的表现。这里需要重点注意的是，机器学习算法依赖于数据，因此在为每个案例研究数据选择最终算法之前，必须遵循这个迭代过程。


    `*规范性分析*`通过提供关于我们应该做什么的建议，将分析与决策联系起来。它帮助我们了解应该瞄准哪些客户、应该做出哪些选择，并且通常涉及将数值优化技术与业务规则和财务模型相结合。


    还有其他类型的任务，包括诊断性分析和认知性分析。


    `*诊断性分析*`利用过去的表现来决定哪些因素影响了特定的趋势。它有助于回答“`*为什么会发生？*`”这个问题，从而在数据和行为模式之间建立清晰的联系。它使数据分析师能够深入分析，以揭示模式、趋势和相关性，并且会使用更复杂的查询。回归分析、异常检测、聚类分析以及其他技术均属于所用方法之列。⁵


    `*认知性分析*`：描述性、诊断性、预测性和规范性分析目前正在逐步演变，以包含诸如认知性分析、自动化分析、智能分析等专业领域。⁵ 在认知性分析中，人工智能和机器学习技术与数据分析方法相结合。在业务分析领域，认知性分析解决方案能够帮助公司基于现有知识库做出关键业务决策并得出结论。⁵


    选择使用哪种任务或算法，或如何组合它们，取决于数据集的大小；数据中存在的模式类型，即数据是否满足方法的某些基本假设；数据的嘈杂程度；以及最重要的——分析的特定目标。数据挖掘中采用的方法是应用几种不同的方法，然后选择对当前目标最有用的那一种。关于如何评估模型的更全面理解，请查阅
    Galit Shmueli 等人（2018 年，第 117 页）。


    # 结果汇总与解读


    在业务分析旅程的这个阶段，我们解读并汇总从数据分析阶段获得的结果。将业务背景纳入考量至关重要。需要清晰理解业务运作方式，这样才能明白结果所传达的信息。我们使用图表、统计表格等工具来解读分析结果，以便于直观地了解情况。在此过程中，简洁是关键；我们需要将所有已完成的工作归纳为几个关键点，并判断是否成功回答了最初设定的问题。在业务分析中，解读结果时，务必（通过将解读结果与问题场景联系起来）说明公司能从这次分析中获得什么收益。


    # 结果呈现


    在呈现结果时，您需要清晰理解业务运作方式；然后借助图表或表格，您将能够展示出发生了什么。您还需要用简短的叙述来补充说明这些图形的含义。这里的核心是简洁，无论分析过程有多复杂；在此时，您需要精简细节，将您的所有分析筛选出几个关键点。在这个阶段，您要检查自己是否能够成功地回答分析项目开始时设定的所有问题。有趣的是，有时您甚至可能会发现，您一开始提出的目标或问题就是错误的。请不要忘记，作为一名业务分析师，需要具备扎实的呈现技巧，才能有效传达您的分析结果。根据您用于演示的工具（`Tableau
    仪表板`、`Microsoft PowerPoint` 等），您需要熟练掌握其使用方法，并能够利用它进行有效沟通。

    '
- fmt: '### Recommendations, Strategies, and Plan


    After carrying out the analysis, there is a need to deploy the model by integrating
    the model into operational systems and running it on real records to produce decisions
    or actions. For example, the model might be applied to data on the existing customers
    of an ecommerce business, and the action might be “a campaign targeted toward
    customers most likely to churn.”


    In making these recommendations and providing strategic plans, there will be a
    need to back up your recommendations with an executive summary of the analytics
    process and focus on the business value of the proposed plan. There is also a
    need to constantly link the plan to the return on investment, particularly considering
    the context of the analytics project. In this phase, use the insights obtained
    from previous steps to create a plan for taking some action, from high-level strategy
    to specific actions to be taken. The strategy will involve you creating several
    alternative courses of action from your analysis and the advantages and disadvantages
    of each so that the stakeholders can determine which one to opt for.


    ### Implementation


    In the implementation stage, the result of the analysis is put to test live. The
    nature of this implementation will be determined by your strategy in the previous
    step. In this stage, you will have to monitor the success metrics you highlighted
    related to each goal in the first step of the analytics journey. Depending on
    whether the results are successful or not, you might need to iterate the process
    based on lessons learned in the analytics journey. This entire process is iterative
    in nature. Also, after implementation, there is a need to use feedback from the
    users to iterate the analytics process for better analytics results and interpretation
    of results. The stage to be repeated in this iteration is determined by the nature
    of the feedback. There are situations where there will be a need to revisit the
    system data capture stage or even the data analysis stage.


    ## 1.4 Small and Medium Enterprises (SME)


    According to Uyi Akpata in a report by PwC Nigeria,³ the MSME (micro, small, and
    medium enterprises) sector is an economy’s growth engine, contributing to its
    development, job generation, and export, among other things. According to the
    World Bank, MSMEs account for over 90% of all enterprises and more than 50% of
    all jobs worldwide. In emerging economies, formal SMEs can account for up to 40%
    of national income (GDP).


    According to the Bank of Industry (BOI) in a report by PwC³, SMEs can be defined
    using Table [1-1](#532459_1_En_1_Chapter.xhtml#Tab1).


    **Table 1-1**

    SME’s Definition


    | Enterprise Category Indicator | Micro Enterprise | Small Enterprise | Medium
    Enterprise |

    | --- | --- | --- | --- |

    | Number of employees | <=10 | >11<=50 | >51<=200 |

    | Total assets (N) | <=5million | >5<= 100million | >100<=500million |

    | Annual turnover (N) | <=20million | <=100million | <=500million |


    In the same report, the most pressing problem currently faced by SMEs is obtaining
    finance, followed by finding customers. For SMEs, the task of finding customers
    is mostly captured by marketing analytics, analytics in customer relationship
    management, and so on, which takes the lion share of Business Analytics.


    ## 1.5 Business Analytics in Small Business


    So far, some SMEs have benefited from data science, the likes of which include
    Goodvine Group⁸ and so on, but there is still a lot of ground to cover. SMEs can
    equally benefit from data science by solving the same challenges as large businesses,
    which include customer acquisition cost, churn, sales forecasting, logistics,
    or capturing market share; the only difference is that this has to be done with
    fewer resources. Although small businesses may not be capturing a larger volume
    of data as large enterprises, the variety and velocity are often the same. The
    good thing is that, so far, they are able to use the data quickly and efficiently
    and can compete with larger competitors in the same space. Interestingly, one
    of the edges that small businesses have over larger ones when it comes to maximizing
    data science is that they do not need a large data science team to get value out
    of data.


    The major problems of small and medium businesses when it comes to applying data
    science to improve revenue include the following:


    *The amount of data collected*: Due to technology advancement, there is an enormous
    amount of data available in small businesses, but these businesses lack a data
    system that efficiently collects and organizes information.


    *Data integration*: For analysis to be complete and accurate, there is a need
    to bring together data across multiple, disjointed sources; currently, this is
    done manually and can be time-consuming and cumbersome.


    *Data that lacks quality and integrity*: Garbage in, garbage out. There are no
    accurate insights that we can get from data that is full of errors and does not
    reflect the whole problem scenario, sometimes referred to as asymmetrical data.
    For more details of how SMEs can benefit from Business Analytics, the challenges,
    and solution, this can be found in Coleman et al. (2008).⁶


    The major solution to some of the problems stated earlier is to implement a data
    governance policy for the business no matter how small. Data governance is a set
    of procedures, responsibilities, policies, standards, and measurements that ensure
    that information is used effectively and efficiently to help an organization achieve
    its objectives.⁷ Small businesses need to realize that the earlier they have this
    in place, the better they are prepared for the future that is here already.'
