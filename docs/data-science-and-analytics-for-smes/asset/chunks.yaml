- fmt: '### 2. Customizing the Network


    In this step, we will customize the network. Before that, under the **Tools**
    menu, click `Plugins`, and download all the available plugins. Check for updates
    and update your application if necessary. Next, **Run** all the necessary statistics
    by clicking the **Statistics** tab and then the **Run** button beside each as
    displayed in Figure [8-27](#532459_1_En_8_Chapter.xhtml#Fig30). The explanation
    of the methods and algorithms of each of these statistics are given as you click
    them. The statistics you need to run is usually determined by the goal of the
    analysis. In this case, we will run all for demonstration purposes.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig31_HTML.png)


    *A computer screenshot demonstrates the data laboratory that displays the result
    of each statistic for each node of the network.*


    **Figure 8-28** – Data laboratory


    1.  After running all the statistics, click the **Data Laboratory** to reveal
    Figure [8-28](#532459_1_En_8_Chapter.xhtml#Fig31) which shows the result of each
    **Statistics** for each node in the network. We can also see the edges in the
    network by clicking `Edges` in Figure [8-28](#532459_1_En_8_Chapter.xhtml#Fig31).
    This can be exported to Excel for other analyses such as regression or correlation.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig32_HTML.png)


    *A computer screenshot displays colourful nodes. It is done by clicking and dragging
    the desired colour to the `Appearance` window of the `Overview` tab.*


    **Figure 8-29** – Changing node color


    1.  Click the **Overview** tab to display the network again, and in the **Appearance**
    window, click and drag the color you want as revealed in Figure [8-29](#532459_1_En_8_Chapter.xhtml#Fig32),
    then click `Apply`.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig34_HTML.png)


    *A computer screenshot depicts nodes of different sizes. It can be done by selecting
    the nodes in the `Appearance` window and then selecting the desired size and ranking.*


    **Figure 8-31** – Ranking the edges using eigenvector centrality


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig33_HTML.png)


    *A computer screenshot displays the colourful edges of the nodes. It is done by
    using the `Edges` tab in the `Appearance` window.*


    **Figure 8-30** – Changing edge color


    1.  Use the **Edges** tab of the `Appearance` window to add color to the edges
    (Figure [8-30](#532459_1_En_8_Chapter.xhtml#Fig33)) and adjust the sizes of nodes
    using eigenvector centrality (Figure [8-31](#532459_1_En_8_Chapter.xhtml#Fig34)).
    This can be done by selecting the nodes in the **Appearance window** and selecting
    size and ranking as seen in Figure [8-31](#532459_1_En_8_Chapter.xhtml#Fig34).
    The importance or influence of units (nodes) in a graph is measured by their centrality.
    We choose the eigenvector centrality in this demonstration.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig35_HTML.jpg)


    *A computer screenshot illustrates the setting to run the Fruchterman Reingold
    layout.*


    **Figure 8-32** – Fruchterman-Reingold layout


    1.  `Gephi` offers various different layouts to present your graph and a few plugins
    to make it look better. For this example, we will use one of the most popular
    layouts: **Fruchterman-Reingold**. It’s a force-directed graph algorithm, and
    it will give us a clear view of the connections in our graph. Figure [8-32](#532459_1_En_8_Chapter.xhtml#Fig35)
    shows the setting of running this layout.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig37_HTML.jpg)


    *A computer screenshot displays the `Show node labels` tab.*


    **Figure 8-34** – Show labels


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig36_HTML.png)


    *A computer screenshot displays the details under the `Filters` tab. It shows
    the steps to filter the degrees.*


    **Figure 8-33** – Filtering the degrees


    1.  Click **Run** in Figure [8-32](#532459_1_En_8_Chapter.xhtml#Fig35), stop after
    a few seconds, and eliminate all nodes with less than three connections (use the
    settings in Figure [8-33](#532459_1_En_8_Chapter.xhtml#Fig36)). This will tidy
    up the graph and allow us to see more important edges (while not affecting the
    statistics). On the right side of the window, click the **Filters** tab, and click
    **Attributes** under **Filter** and **Range** under **Attribute**. Under **Range**,
    double-click **Degree**. It will appear in the **Queries**; you can then click
    **Filter** in Figure [8-33](#532459_1_En_8_Chapter.xhtml#Fig36). Run the Fruchterman-Reingold
    again and add labels (usernames) by clicking the **show Node labels** (Figure
    [8-34](#532459_1_En_8_Chapter.xhtml#Fig37)).


    The resulting network is displayed in Figure [8-35](#532459_1_En_8_Chapter.xhtml#Fig38).


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig38_HTML.png)


    *A figure of the resulting social communication network. It depicts that the node
    `ecobank_nigeria` has the highest eigenvector centrality.*


    **Figure 8-35** – Network of Users


    For this example, we will stop here, but there are a lot of other settings that
    can be used to visualize this network for various types of insights. Also, the
    `Preview` tab can be used for better visualization of the network. From Figure
    [8-35](#532459_1_En_8_Chapter.xhtml#Fig38), we can see the node `ecobank_nigeria`
    has the highest eigenvector centrality, signifying that it is the most central
    because its neighbors are also central.


    ---


    ### Network Analysis – Example 2


    For the second example, we will be creating a product network of a food and agricultural
    business. The edge list is created from the associations of the products as they
    are purchased together. The data files to be used for creating this network are
    named `EdgeListProducts.csv` and `NodeListProducts.csv`, respectively.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig39_HTML.png)


    *A computer screenshot displays the interface after the edge list is successfully
    loaded into `Gephi`.*


    **Figure 8-36** – Successfully loading `EdgeListProducts.csv`


    1.  Open a new project in `Gephi`. Load the data into `Gephi` as an undirected
    graph (`File` ➤ `Open`), and load the `EdgeListProducts.csv` first. Figure [8-36](#532459_1_En_8_Chapter.xhtml#Fig39)
    is the interface after successfully loading the edge list into `Gephi`.


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig40_HTML.jpg)


    *A figure depicts the colourful nodes and edges. It uses eigenvector centrality
    to resize the nodes.*


    **Figure 8-37** – Resizing the graph using eigenvector centrality


    1.  Load the node list by clicking **File** ➤ **Import spreadsheet**, select the
    `NodeListProducts.csv`, click `Next`, and then click `Finish`. On the resulting
    interface in Figure [8-37](#532459_1_En_8_Chapter.xhtml#Fig40), make sure to change
    the **Graph Type** to **undirected** and select the **Append to existing workspace**.


    2.  Run all the **Statistics**. Filter out nodes with a degree not up to 12.


    3.  Change the node to pink and the edge to blue, and use **eigenvector centrality**
    to resize the nodes (just as in example 1); we should have Figure [8-37](#532459_1_En_8_Chapter.xhtml#Fig40).


    ![](images/532459_1_En_8_Chapter/532459_1_En_8_Fig41_HTML.png)


    *A network graph illustrates the result of using eigenvector centrality for ranking
    nodes on the network. It highlights the nodes with high centrality values.*


    **Figure 8-38** – Network of products (eigenvector centrality)


    1.  Run the **Fruchterman-Reingold** layout to see Figure [8-38](#532459_1_En_8_Chapter.xhtml#Fig41),
    click the **Show label** button, run the **Label Adjust** layout, and run the
    **Expansion** layout to resize the network so that it is bigger and labels are
    readable. The result should look like Figure [8-38](#532459_1_En_8_Chapter.xhtml#Fig41).'
