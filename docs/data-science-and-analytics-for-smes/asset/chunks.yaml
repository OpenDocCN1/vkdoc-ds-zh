    Scatter plots


    1.  Use a scatter plot to study the relationship between the numerical predictors.
    When you do this, you are looking at relationships between them that could affect
    your analysis negatively or positively. Figure [6-4](#532459_1_En_6_Chapter.xhtml#Fig4)
    is the scatter plot of attribute KM and Price; this reveals a slight relationship
    between the two attributes. As the price is reducing, the KM is increasing. This
    relationship is not set to affect our experiment negatively, so we can leave the
