- fmt: '# 1. Introduction


    In this chapter, we introduce data science generally and narrow it down to data
    science for business which is also referred to as Business Analytics. We then
    give a detailed explanation of the process involved in Business Analytics in the
    form of the Business Analytics journey. In this journey, we explain what it takes
    from start to finish to carry out an analytics project in the business world,
    focusing on small business consulting, even though the process is generic to all
    types of business, small or large. We also give a description of what small business
    refers to in this book and the peculiarities of navigating an analytics project
    in such a terrain. To conclude the chapter, we talk about the types of analytics
    problems that are common to small businesses and the tools available to solve
    these problems given the budget situation of small businesses when it comes to
    analytics projects.


    ## 1.1 Data Science


    In simple terms, data science refers to the ability to take data, generate an
    understanding from the data, process the data, extract value from the data, visualize
    the data, and present it in such a way that decisions can be made from this presentation.
    Data science is described as the process of extracting knowledge from huge amounts
    of data. It is an intersection of Mathematics, Statistics, Visualization, and
    Artificial Intelligence. Artificial Intelligence is a superset of machine learning,
    which is a superset of deep learning.


    ## 1.2 Data Science for Business


    Data science for business is popularly referred to as Business Analytics, which
    is how we will refer to it in this book. The activity and art of using quantitative
    data to inform decision-making is known as Business Analytics. Several organizations
    have different interpretations of the term. Data visualization and reporting are
    used in Business Analytics to comprehend “what happened and” what is happening
    (Business Intelligence).¹ The goal of Business Analytics is to assist you to focus
    on the datasets that will help you increase your company’s revenue, productivity,
    and efficiency.⁴


    In Business Analytics, we want to see how we can analyze data from various sources
    particularly keeping in mind the KPIs (key performance indicators) of the business
    in real time and use this to support strategic business decisions.


    Comparing Business Analytics and data science, we discover that Business Analytics
    deals with extracting meaningful insights from the visualized data for making
    decisions, while data science is more directed to taking raw data and using algorithms,
    statistical models, and computer programming to extract valuable insights. In
    this book, we combine both the perspective of Business Analytics and data science
    and refer to it as data science for business.


    Business Analytics has major application types that include


    1.  *Financial analytics*: This can be characterized as data analytics aimed at
    solving specific business queries and predicting future financial outcomes. Financial
    analytics aims to shape business strategy using trustworthy, verifiable information
    rather than intuition. It gives companies extensive views of their financial data
    as well as the tools they need to understand significant patterns and take action
    to enhance their performance (`www.techtarget.com/searcherp/definition/financial-analytics`).
    Organizations such as McAfee, Deloitte, and Wiley are seeing reductions in costs,
    gains in efficiency, and so on through financial analytics.


    2.  *People analytics*: People analytics is a data-driven approach to workplace
    management. People are the most important assets to organizations, and if they
    are managed better, it will impact the business for better. We use it to answer
    questions like: Who should we hire? Who should we promote? What are the best career
    paths for the company? What are the patterns of collaboration like? Who are the
    key communicators, and what can we do to increase communication? And so forth.
    Using people analytics, companies such as Google, Amazon, Cisco, and many others
    are able to understand how exactly to engage, retain, and ensure productivity
    from their people.


    3.  *Customer analytics*: This is when data is used to better understand the customer’s
    composition, needs, and satisfaction. Additionally, the enabling technology is
    used to divide customers into groups based on their behavior, to identify general
    trends, and to generate customized marketing and sales activities.⁸ In domains
    such as banking, insurance, or finance, customer analytics can help to understand
    customer life value, attrition, and so on. Customer analytics is heavily used
    in ecommerce websites like Amazon, Flipkart, and many more.


    4.  *Operation analytics*: The term “operational analytics” refers to a sort of
    Business Analytics that focuses on enhancing current operations.^(11) This sort
    of Business Analytics, like others, entails the use of a variety of data mining
    and data aggregation technologies in order to obtain more transparent data for
    business planning.⁹ Operational analytics has been used by Loom, Bold Penguin,
    and Atrium inspiring things such as unlocking collaboration between customer success
    and sales to reach customers with a unified front and many more.


    ## 1.3 Business Analytics Journey


    Business Analytics life cycle can be referred to as information-action value chain²
    or Business Analytics journey. It is the process of linking the data and its source
    to the analysis and the result of the analysis. It also includes communicating
    the results of the analysis and assessing if the goals of the analytics project
    have been met.


    The information-action value chain (Business Analytics journey) consists of about
    nine stages as captured in Figure [1-1](#532459_1_En_1_Chapter.xhtml#Fig1).


    ![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig1_HTML.jpg)


    A flowchart represents the journey of business analytics, consisting of nine stages.
    The journey of implementation of business analytics starts with real-world events
    and their characteristics.


    Figure 1-1 Business Analytics journey'
  raw: '# 1. Introduction


    In this chapter, we introduce data science generally and narrow it down to data
    science for business which is also referred to as Business Analytics. We then
    give a detailed explanation of the process involved in Business Analytics in the
    form of the Business Analytics journey. In this journey, we explain what it takes
    from start to finish to carry out an analytics project in the business world,
    focusing on small business consulting, even though the process is generic to all
    types of business, small or large. We also give a description of what small business
    refers to in this book and the peculiarities of navigating an analytics project
    in such a terrain. To conclude the chapter, we talk about the types of analytics
    problems that are common to small businesses and the tools available to solve
    these problems given the budget situation of small businesses when it comes to
    analytics projects.


    ## 1.1 Data Science


    In simple terms, data science refers to the ability to take data, generate an
    understanding from the data, process the data, extract value from the data, visualize
    the data, and present it in such a way that decisions can be made from this presentation.
    Data science is described as the process of extracting knowledge from huge amounts
    of data. It is an intersection of Mathematics, Statistics, Visualization, and
    Artificial Intelligence. Artificial Intelligence is a superset of machine learning,
    which is a superset of deep learning.


    ## 1.2 Data Science for Business


    Data science for business is popularly referred to as Business Analytics, which
    is how we will refer to it in this book. The activity and art of using quantitative
    data to inform decision-making is known as Business Analytics. Several organizations
    have different interpretations of the term. Data visualization and reporting are
    used in Business Analytics to comprehend “what happened and” what is happening
    (Business Intelligence).¹ The goal of Business Analytics is to assist you to focus
    on the datasets that will help you increase your company’s revenue, productivity,
    and efficiency.⁴


    In Business Analytics, we want to see how we can analyze data from various sources
    particularly keeping in mind the KPIs (key performance indicators) of the business
    in real time and use this to support strategic business decisions.


    Comparing Business Analytics and data science, we discover that Business Analytics
    deals with extracting meaningful insights from the visualized data for making
    decisions, while data science is more directed to taking raw data and using algorithms,
    statistical models, and computer programming to extract valuable insights. In
    this book, we combine both the perspective of Business Analytics and data science
    and refer to it as data science for business.


    Business Analytics has major application types that include


    1.  *Financial analytics*: This can be characterized as data analytics aimed at
    solving specific business queries and predicting future financial outcomes. Financial
    analytics aims to shape business strategy using trustworthy, verifiable information
    rather than intuition. It gives companies extensive views of their financial data
    as well as the tools they need to understand significant patterns and take action
    to enhance their performance ([`www.techtarget.com/searcherp/definition/financial-analytics`](http://www.techtarget.com/searcherp/definition/financial-analytics)).
    Organizations such as McAfee, Deloitte, and Wiley are seeing reductions in costs,
    gains in efficiency, and so on through financial analytics.


    2.  *People analytics*: People analytics is a data-driven approach to workplace
    management. People are the most important assets to organizations, and if they
    are managed better, it will impact the business for better. We use it to answer
    questions like: Who should we hire? Who should we promote? What are the best career
    paths for the company? What are the patterns of collaboration like? Who are the
    key communicators, and what can we do to increase communication? And so forth.
    Using people analytics, companies such as Google, Amazon, Cisco, and many others
    are able to understand how exactly to engage, retain, and ensure productivity
    from their people.


    3.  *Customer analytics*: This is when data is used to better understand the customer’s
    composition, needs, and satisfaction. Additionally, the enabling technology is
    used to divide customers into groups based on their behavior, to identify general
    trends, and to generate customized marketing and sales activities.⁸ In domains
    such as banking, insurance, or finance, customer analytics can help to understand
    customer life value, attrition, and so on. Customer analytics is heavily used
    in ecommerce websites like Amazon, Flipkart, and many more.


    4.  *Operation analytics*: The term “operational analytics” refers to a sort of
    Business Analytics that focuses on enhancing current operations.^(11) This sort
    of Business Analytics, like others, entails the use of a variety of data mining
    and data aggregation technologies in order to obtain more transparent data for
    business planning.⁹ Operational analytics has been used by Loom, Bold Penguin,
    and Atrium inspiring things such as unlocking collaboration between customer success
    and sales to reach customers with a unified front and many more.


    ## 1.3 Business Analytics Journey


    Business Analytics life cycle can be referred to as information-action value chain²
    or Business Analytics journey. It is the process of linking the data and its source
    to the analysis and the result of the analysis. It also includes communicating
    the results of the analysis and assessing if the goals of the analytics project
    have been met.


    The information-action value chain (Business Analytics journey) consists of about
    nine stages as captured in Figure [1-1](#532459_1_En_1_Chapter.xhtml#Fig1).


    ![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig1_HTML.jpg)


    A flowchart represents the journey of business analytics, consisting of nine stages.
    The journey of implementation of business analytics starts with real-world events
    and their characteristics.


    Figure 1-1


    Business Analytics journey'
