    data named `SuperstoreNigeria.xls` (refer to Section [2.​4](#532459_1_En_2_Chapter.xhtml#Sec5)
    in Chapter [2](#532459_1_En_2_Chapter.xhtml) for a guide).

    2.  Figure [5-1](#532459_1_En_5_Chapter.xhtml#Fig1) is a screenshot of the imported
    data in `RapidMiner`. Click **Next** and select the repository where you want
    to put the data.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig2_HTML.png)


    The `Rapid Miner Studio` window imported a data table, and a navigation panel
    with options of `Data`, `Statistics`, `Visualizations`, and `Annotations` is depicted.


    Figure 5-2 Example set of the imported data


    1.  On the **Results** interface in Figure [5-2](#532459_1_En_5_Chapter.xhtml#Fig2),
    you can click the **Data**, **Statistics**, **Visualizations**, and **Annotations**
    to explore the various characteristics of the data as explained in Chapter [2](#532459_1_En_2_Chapter.xhtml),
    Section [2.​4](#532459_1_En_2_Chapter.xhtml#Sec5).


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig3_HTML.png)


    The plot section in the visualization tab lists the plot type, value columns,
    group by, aggregation function, color group, and stacking.


    Figure 5-3 Bar chart example


    1.  Create a bar chart by clicking the **Visualizations** button in Figure [5-2](#532459_1_En_5_Chapter.xhtml#Fig2)
    and then adjusting the setting of the resulting interface as revealed in Figure
    [5-3](#532459_1_En_5_Chapter.xhtml#Fig3). Take note of the settings of **Plot
    type**, **Value columns** (y axis), **Aggregate data**, **group by**, and **aggregation
    function**. The **Plot type** is set as `Bar (Column)`. The `Row ID` is selected
    for the **Value columns** so as to count each row in the data to create the bar
    chart. **Aggregate data** is selected to indicate we will be using aggregated
    calculations. The **group by** is selected indicating the categorical variable
    (`segment`) we want to examine. The **aggregation function** indicates that we
    want to know how many rows exist for each category in the categorical attribute
    called `segment`.


    ## 5.3 Histogram


    A histogram is used to group data into intervals, and drawing a bar for each interval
    shows the empirical distribution. Histograms help to understand the center of
    the data. Histograms are an excellent tool for identifying the shape of your data
    distribution. There are situations where data is either skewed to the right or
    left, and you have to perform data transformation. When using a histogram to examine
    your data for prediction, for example, you want to make sure the data is not skewed
    to the right or to the left in such a way that it could affect the result of your
    analysis. That is, the data needs to be symmetric or almost symmetric.


    The log method is good for transforming right-skewed data and bad for zero and
    negative values. The square root method is good for transforming right-skewed
    data and bad for negative values. The square is good for transforming data that
    is left-skewed but bad for negative values. The cube root is good for transforming
    data that is right-skewed and also negative values but not effective for log transformation.


    **Creating a histogram in RapidMiner**


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig4_HTML.png)


    The visualization tab displays a histogram wherein the plot type is selected as
    `Histogram` and value columns are selected as `profit`.


    Figure 5-4 Histogram of the attribute profit


    1.  Create a histogram in Figure [5-4](#532459_1_En_5_Chapter.xhtml#Fig4) by changing
    the settings as follows; the **Plot type** is set as `Histogram`. The **value
    columns** is used to select the numerical attribute you wish to create the histogram
    for.


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig5_HTML.png)


    The visualization tab displays a histogram wherein the plot type is selected as
    `Histogram` and value columns are selected as `quantity`.


    Figure 5-5 Histogram of the attribute quantity


    1.  Figure [5-5](#532459_1_En_5_Chapter.xhtml#Fig5) is the histogram of the attribute
    quantity.

    2.  The histogram in Figure [5-4](#532459_1_En_5_Chapter.xhtml#Fig4) is fairly
    symmetric, while that in Figure [5-5](#532459_1_En_5_Chapter.xhtml#Fig5) is slightly
    skewed to the right. A histogram that is symmetric has data evenly distributed
    on both sides of the line that divide the histogram into two equal halves vertically.
    The value on the x axis where this happens on the histogram plot is the median,
    which is also equal to the mean and equal to the mode (for symmetric histogram
    shape). We can also use the histogram to pick where most of the values fall between.'
