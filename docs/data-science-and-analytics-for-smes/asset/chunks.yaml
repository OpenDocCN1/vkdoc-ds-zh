    # 7.3 神经网络


    有关神经网络算法的详细信息，请参阅 6.5 节。


    **基于神经网络的客户忠诚度分析**


    利用 7.2 节中介绍的客户忠诚度问题，下面演示如何使用神经网络来解决该问题：


    ![](img/532459_1_En_7_Fig5_HTML.png)


    “进程”选项卡显示了参数部分。其中，折叠次数设置为 10，采样类型设置为自动，并勾选了启用并行执行。


    图 7-6a

    神经网络主流程


    1. 创建一个新流程，将已导入的 `Churn_Modelling` 数据拖拽至设计视图。我们将使用图 7-6a（主流程）和图 7-6b（内部流程）中的设置来开发和评估模型。


    在图 7-6a 中，对于 `Nominal to Numerical` 运算符，您需要选择属性 `Gender`、`Geography`、`HasCrCard`
    和 `IsActiveMember`（将它们转换为虚拟变量）。点击 `Set Role` 运算符，将 `attribute name` 设置为 `Exited`，并将
    `target role` 设置为标签。`Cross Validation` 运算符保留默认设置，这意味着我们将使用 10 折交叉验证。


    ![](img/532459_1_En_7_Fig6_HTML.png)


    “进程”选项卡显示了参数部分，其中主要标准设置为“first”，并从列出的参数集中勾选了“accuracy”。


    图 7-6b

    神经网络内部流程


    在图 7-6b 中，对于 `Neural Net` 运算符，我们将点击隐藏层并为其任意命名（例如，“ibk”），然后将其设置为 -1。如果隐藏层大小值设置为
    -1，则层大小将根据输入示例集的属性数量计算得出。更多信息请参阅 RapidMiner 文档。所有其他设置保留默认值。`Apply Model` 运算符无需调整参数。对于
    `Performance (Classification)` 运算符的参数，只需保留默认值（即准确率）。


    对于图 7-6a 和图 7-6b 中的设置，我们预期会得到两个输出结果。图 7-7a 是神经网络模型，图 7-7b 是模型的性能表现。


    ![](img/532459_1_En_7_Fig8_HTML.png)


    选中了性能选项卡，标准设置为准确率，并选择表格视图。其中列出了 true 1、true 0 和分类精确度列的数据。


    图 7-7b

    模型的性能结果


    ![](img/532459_1_En_7_Fig7_HTML.png)


    结果选项卡的神经网络部分显示了神经网络模型，该模型以输入层、隐藏层和输出层三列形式呈现。


    图 7-7a

    神经网络模型


    ![](img/532459_1_En_7_Fig9_HTML.png)


    进程选项卡定义了一个流程链，依次为：检索、设置角色、名义值到数值的转换、交叉验证、模型分组、应用模型和检索。


    图 7-8

    预测新记录或新交易


    1. 一旦我们建立了用于预测的最优模型，就可以使用该模型预测新数据。为此，我们将加载已为预测新客户准备好的数据文件 `Churn_ModelingNew.xlsx`。该数据已进行预处理，不包含结果变量。同时，在导入数据时，请移除
    `RowNumber`、`CustomerID` 和 `Surname` 列，并将 `HasCrCard`、`IsActiveMember` 和 `Exited`
    转换为分类属性。此外，在导入数据时，将错误替换为缺失值。为了预测新记录，我们将修改图 7-6a 中的主流程，得到图 7-8。


    ![](img/532459_1_En_7_Fig10_HTML.png)


    选中结果选项卡，表格中列出了数据，其中预测值、置信度 1 和置信度 0 列被高亮显示。


    图 7-9

    新预测的输出结果


    1. 图 7-9 是对图 7-8 进行修改后的输出结果。它显示了预测新交易的结果，并揭示了预测结果的置信度（倾向性）。从这些置信度结果中，我们可以看到使用了默认阈值
    0.5 来将客户分类为`已流失` (1) 或`未流失` (0)。

    '
- fmt: '## 7.4 Classification Tree


    Please refer to Section [6.​4](#532459_1_En_6_Chapter.xhtml#Sec4) for details
    on decision tree algorithms.


    Decision tree algorithms can be used to predict both numerical and categorical
    outcomes. When the predicted outcome is categorical, it is referred to as classification
    trees. Classification trees use predictor information to “drop” a record down
    the tree until it reaches a node at the bottom (terminal node). We can then classify
    it by gathering a “vote” of all the training data that belongs to the terminal
    node during the formation of the tree. The class with the most votes gets the
    new record.


    **Customer loyalty with classification tree**


    Using the customer loyalty problem introduced in Section [7.2](#532459_1_En_7_Chapter.xhtml#Sec2),
    the following demonstrates how to use the classification tree to solve the problem:


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig11_HTML.png)


    The process tab has a parameters section where the number of folds is set to 10,
    the sampling type is set to automatic, and enable parallel execution is checked.


    Figure 7-10a


    Decision tree main process


    1.  Create a new process, and drag the already imported `Churn_Modelling` data
    to the design view. We will use the settings in Figures [7-10a](#532459_1_En_7_Chapter.xhtml#Fig11)
    (main process) and [7-10b](#532459_1_En_7_Chapter.xhtml#Fig12) (inner process)
    to develop and evaluate the model.


    The `Decision Tree` operator generates a decision tree model, which can be used
    for classification and regression. This operator can process `ExampleSets` containing
    both nominal and numerical attributes. The label `Attribute` must be nominal for
    classification and numerical for regression. In Figure [7-10a](#532459_1_En_7_Chapter.xhtml#Fig11),
    click the `Set Role` operator and set the `attribute name` to be `Exited` and
    `target role` to be label. Leave the `Cross Validation` operator as default settings,
    meaning that we will be using a tenfold validation.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig12_HTML.png)


    The parameters section is where criteria are set for gain ratio, maximal depth,
    10, confidence 0.1, minimal gain 0.01, pruning, and pre-pruning.


    Figure 7-10b


    Inner process of the decision tree


    In Figure [7-10b](#532459_1_En_7_Chapter.xhtml#Fig12) for the `Decision Tree`
    operator, we set the criterion to `gain_ratio`. This signifies that we are predicting
    categorical outcome. The `Apply Model` operator needs no parameter adjustment.
    For the parameters of the `Performance (Classification)` operator, simply leave
    as default, which is `accuracy`.


    For the settings in Figures [7-10a](#532459_1_En_7_Chapter.xhtml#Fig11) and [7-10b](#532459_1_En_7_Chapter.xhtml#Fig12),
    we are expecting two outputs. Figure [7-11a](#532459_1_En_7_Chapter.xhtml#Fig13)
    is the neural network model, and Figure [7-11b](#532459_1_En_7_Chapter.xhtml#Fig14)
    is the performance of the model.


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig14_HTML.png)


    The performance tab is selected with the criterion set to `accuracy` and the table
    view checked. The data of `pred 1` and `pred 0` for `true 1` and `0` are highlighted.


    Figure 7-11b


    Performance of the decision tree model


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig13_HTML.png)


    A decision tree model is depicted under the graph tab with node and edge labels
    checked under the tree section.


    Figure 7-11a


    Some sections of the decision tree model


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig15_HTML.png)


    The process flow is depicted with a link between retrieve followed by set role,
    cross-validation, apply the model and retrieve.


    Figure 7-12


    Predicting for new records (decision trees)


    1.  Once we have established an optimal model for prediction, we can now use the
    model to predict for new data. To do this, we will load the data `Churn_ModelingNew.xlsx`
    which has been prepared for predicting new customers. To predict a new record,
    we will modify the main process in Figure [7-10a](#532459_1_En_7_Chapter.xhtml#Fig11)
    to give Figure [7-12](#532459_1_En_7_Chapter.xhtml#Fig15).


    ![](images/532459_1_En_7_Chapter/532459_1_En_7_Fig16_HTML.png)


    The data tab is selected, with the values in the columns of prediction, confidence
    1 and 0, highlighted in the table.


    Figure 7-13


    Predicted records (decision trees)


    1.  Figure [7-13](#532459_1_En_7_Chapter.xhtml#Fig16) is the output from the modification
    in Figure [7-12](#532459_1_En_7_Chapter.xhtml#Fig15). It shows the result for
    predicting the new transactions.'
