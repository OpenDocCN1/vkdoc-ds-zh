    - Create a repository; click the arrow down beside **Import Data** in Figure [2-2](#532459_1_En_2_Chapter.xhtml#Fig2).

    - The first thing to do is to create a repository for your project using the following
    steps:


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig3_HTML.jpg)


    A screengrab represents the repository tab. An arrow indicates an import tab folder.


    **Figure 2-3** Import data


    - Click **Import Data** (Figure [2-3](#532459_1_En_2_Chapter.xhtml#Fig3)).

    - Select your data file (`OnlineQuestion1.xlsx`) from anywhere it is on your computer.

    - Load the data to be cleaned.

    - Give your local repository a name “`OnlineCourse`.”

    - Create two folders in your repository (`data` and `process`).


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig4_HTML.png)


    A screengrab displays a list of data with eight columns. The heading of the data
    list is format your columns.


    **Figure 2-4** Format data types


    - Format your columns (data types). The data types in RapidMiner are polynominal
    (categorical variables with more than two categories), binominal (categorical
    variable with two categories), real (numbers with decimals), integers (numbers
    without decimals), date_time (data and time together), date, and time.^(13) At
    this stage (Figure [2-4](#532459_1_En_2_Chapter.xhtml#Fig4)), you can examine
    all attributes to see if their data type is in order based on domain knowledge
    and the purpose of the analysis. This is when you answer questions like: *Are
    values unique for some variable?* etc. There might be a need to change the type,
    change the role of the variable, rename the variable, or remove the variable (this
    can be done by clicking the arrow beside the attribute in Figure [2-4](#532459_1_En_2_Chapter.xhtml#Fig4)).
    For this purpose of demonstration, let’s change the attributes `message` and `MOVED_AD`
    to binominal.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig6_HTML.png)


    A screengrab represents the statistical data with six columns. In the result history
    folder, the statistics tab is selected.


    **Figure 2-6** Summary statistics


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig5_HTML.png)


    A screengrab represents an example set tab and data listed in eleven columns.
    On the left margin, it contains tabs such as data, statistics, and visualizations,
    and annotations. The data tab is selected.


    **Figure 2-5** Displayed interface of loaded data


    - In situations where there might be errors (e.g., character variable having numerical
    data and vice versa), the **Replace error with missing values** will take care
    of this. In the next step of the cleaning process, we can deal with the missing
    data.

    - To load/import the data into the repository, select the `data` subfolder in
    your repository and click **Finish**.

    - The displayed interface of loaded data is revealed in Figure [2-5](#532459_1_En_2_Chapter.xhtml#Fig5).
    From here, you can click the **Statistics** to reveal the summary statistics (Figure
    [2-6](#532459_1_En_2_Chapter.xhtml#Fig6)).

    - Examine the statistics to solve the following issues: Does character variable
    have valid values? Are numerical values within range? The `min` and `max` functions
    can be used to detect extreme values that might be errors. Are there missing values?
    Check for the following: difference in scales, definitions of fields, units of
    measurement, time periods, and so on.


    ### Missing Data


    How do we handle missing data? You cannot just simply throw away data in many
    cases because you need to have enough data for meaningful analysis. Also, there
    might be more than one attribute with different missing values in which case too
    many rows will be removed. Sometimes, missing values are informative. You therefore
    need to do further investigation to know what happened or if it was just an error
    in input. The fact that data points are missing can even have high predictive
    power. The first option to deal with missing values is to replace them. You might
    want to fill the values with some smart estimates. The second way to deal with
    missing values is to remove the row or column. The third way is to impute a value
    with zero, mean, median, and many other ways of imputation. Another way is to
    convert missing values to one of the categories in the data, if the data attribute
    is categorical in nature. It is important that you have to try as much as possible
    to minimize distortion when dealing with missing values and use domain knowledge
    to conclude on what step to take.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig7_HTML.png)


    A screengrab points to an arrow named Run on the menu bar. The Process tab is
    selected, which contains the retrieval of Online Question 1. Another arrow marked
    as a result points towards retrieving Online Question 1.


    **Figure 2-7** Running your first process in RapidMiner


    - From Figure [2-6](#532459_1_En_2_Chapter.xhtml#Fig6), click the **Design** tab
    and drag the data to the design view from the repository (this is how we add the
    operator or data to the design view).

    - Connect the output of the data to the result (`res`) as seen in Figure [2-7](#532459_1_En_2_Chapter.xhtml#Fig7).

    - Run the processes by clicking the **run** (blue triangle on the tools bar) button
    (indicated in Figure [2-7](#532459_1_En_2_Chapter.xhtml#Fig7)).

    - To handle missing data, we will continue from where we stopped in step 7.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig8_HTML.png)


    A screengrab represents the statistical data with six columns. In the result history
    folder, the statistics tab is selected.


    **Figure 2-8a** Checking the statistics again


    - From the output after clicking **Statistics** (Figure [2-8a](#532459_1_En_2_Chapter.xhtml#Fig8)),
    you will observe that not all attributes have missing values, and this is where
    you decide how to deal with the missing values.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig9_HTML.png)


    A screengrab represents two tabs: process and parameter. In the process tab, retrieve
    online questions and replace missing values folder leads to the result. The select
    attributes window is also represented in the process tab.


    **Figure 2-8b** Replace Missing Values operator


    - We cannot use the **Use Filter Examples** operator to remove missing values
    because that would amount to over 50 records being lost, so we will use the **Replace
    Missing Value** operator.

    - Under **Operators**, search for the **Replace Missing Value** operator and add
    it to the design in Figure [2-7](#532459_1_En_2_Chapter.xhtml#Fig7) and link it
    to the **Retrieve OnlineQuestion1** operator and then to the output.

    - At this point, it is important to know that there are different ways to handle
    different attributes in the parameter settings of the **Replace Missing Value**
    operator. If you want to deal with the attribute one by one, you can first use
    the **select attribute** operator to select the attribute you want to deal with
    and then use the **Replace Missing Value** operator to deal with the attribute.'
