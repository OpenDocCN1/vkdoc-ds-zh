  trans: "\n### 使用 Gephi\n\n`Gephi` 是一款用于可视化和探索各类图形与网络的开源免费软件。要下载 `Gephi`，请访问 [`https://gephi.org/`](https://gephi.org/)。部分安装指南可在\
    \ [`https://gephi.org/users/install/`](https://gephi.org/users/install/) 找到。如果在安装\
    \ `Gephi` 时遇到任何问题，请访问 [`www.youtube.com/watch?v=-JU-S5dMDVo`](http://www.youtube.com/watch%253Fv%253D-JU-S5dMDVo)。成功安装\
    \ `Gephi` 后，您将看到如图 1-6 所示的界面。有关 `Gephi` 的快速入门介绍，可参阅 [`https://gephi.org/tutorials/gephi-tutorial-quick_start.pdf`](https://gephi.org/tutorials/gephi-tutorial-quick_start.pdf)。\n\
    \n![](img/532459_1_En_1_Fig6_HTML.png)\n\n已安装的 `Gephi` 软件首页截图。\n\n图 1-6\n\n`Gephi`\
    \ 界面\n\n## 1.9 问题\n\n1.  为以下业务场景设计一个概念性商业模式：\n    1.  一家小企业打算利用其当前培训参与者的信息来构建一个模型，以预测未来谁会来参加培训。此预测结果将用于目标营销。\n\
    \    2.  Hadetulah 眼科诊所是一家小型企业，总共约有 20 名员工，在尼日利亚设有约五家分店。他们提供多种与眼科治疗相关的服务，从诊断到眼科治疗设备的销售。尽管他们没有运行核心的企业应用程序，但他们以\
    \ Excel 表格的形式捕获财务运营数据，存储诊断结果、转诊医院信息、设备详细信息、租赁或销售信息以及发票。他们的目标是吸引更多客户。\n\n2.  假设您参与了一个旨在提高某航空企业运营效率的分析项目。您的任务是了解该业务的运作方式。为此，您需要提出一个概念模型，详细解释该业务领域中的要素以及它们之间的相互关系。\n\
    \n3.  为一家面条零售小企业创建一个概念性商业模式。该公司打算对其现有客户进行细分，以便能够描述他们，从而实现有效的客户关系管理。\n\n# 2. 小企业分析数据\n\
    \n在本章中，我们将探讨一般企业及小企业中的各种数据来源。这一点很重要，因为为小企业提供咨询的主要挑战在于缺乏数据或缺乏用于分析的高质量数据。因此，本章将详细阐述用于分析的数据来源，首先解释数据存在的类型或形式，以及如何收集此类数据的一些通用思路。本章概述了数据质量和完整性问题，并涉及数据素养。此外，我们将解释数据分析技术的典型数据准备流程。最后，我们将探讨数据可视化，特别侧重于为第\
    \ 1.3 节中所述的各种分析任务准备数据。\n\n## 2.1 数据来源\n\n数据可以以不同形式检索；最基本的数据类别是结构化数据、半结构化数据和非结构化数据。¹\n\
    \n*结构化数据*：此类数据具有预定义的顺序，并在存储之前被格式化为特定结构。这种结构被称为写时模式。一个很好的例子是存储在关系数据库管理系统中的数据。\n\
    \n*非结构化数据*：这是指数据以其原始格式存储，直到使用时才进行处理，这称为读时模式。它没有固定的形式或顺序。它可以以多种文件格式存储；例如电子邮件、社交媒体帖子、演示文稿、聊天记录、物联网传感器数据和卫星图像。\n\
    \n*半结构化数据*：这种形式的数据包含概述数据特定特征的元数据³，使其能够比非结构化数据更高效地被操作。以 `XML` 格式存储的数据就是此类数据的一个例子。\n\
    \n在业务中，捕获数据的系统类型包括以下内容：\n\n*   核心企业系统\n*   客户与人员系统\n*   产品与存在系统\n*   技术运营系统\n\
    *   外部来源系统\n\n需要注意，有时这些系统的功能会重叠，在某些情况下具体表现如下所述。\n\n*核心企业系统*：这些系统包括帮助管理企业财务运营的系统。它们用于计费和开票、企业资源规划、供应链管理、采购和销售活动、监控生产活动等等。与其他类别相比，它们拥有庞大的数据量，并且通常是在运行的应用中创建、保存和维护的。\n\
    \n*客户与人员系统*：这些系统包括客户服务、营销自动化、活动管理、人力资源系统以及客户关系管理（`CRM`）系统。\n\n*产品与存在系统*：它们有助于存储关于产品管理的信息。这包括产品管理、内容管理、Web\
    \ 管理和分析。人们在电子商务中进行的许多操作都可以被极其细致地测量。这些包括客户评论、网络日志数据、鼠标点击轨迹、全球定位卫星（`GPS`）数据等。\n\n\
    *技术运营系统*：它们非常具有策略性，有助于监控其他系统的流程，确保其正常运行。它们包括流程监控、告警和故障监控、工单和工作流管理、远程信息处理以及机器数据处理。\n\
    \n*外部来源系统*：这些系统包括在组织外部收集但对分析过程相关的数据。它们包括人口统计和细分数据、来自合作伙伴、供应商和政府机构的数据。\n\n为了提取这些数据进行分析，或将其准备用于次要分析存储（如数据仓库），有多种语言可用，包括但不限于\
    \ `SQL`、`Python` 等。有时，当数据无法直接提取时，我们可能需要使用主动数据收集方法或被动数据收集方法来收集数据。\n\n*主动数据收集*：当数据直接从用户处收集时发生，例如，用户在完成在线零售交易时故意分享个人数据。在收集此类数据时，通常需要包含对所收集数据的某些披露声明。主动数据也可以通过在线或离线调查来收集，并且需要遵循特定程序²来实施以实现特定目标。在线平台包括\
    \ `Google Forms`、`SurveyMonkey` 等。\n"
- fmt: '# 被动数据收集


    *被动数据收集*：当目标对象不参与数据收集时发生。它通过扫描仪或媒体（如广播、电视和社交媒体）收集。其他被动收集数据的方式包括网络和移动平台。网络数据提供了大量关于客户正在查看什么的信息，无论是在你自己的网站还是竞争对手的网站上。例如，对于电子商务网站，我们可以收集客户评论、网络交易数据、客户人口统计数据以及网络日志数据。帮助收集网络数据的公司例子是`Comscore`（[`www.comscore.com/`](http://www.comscore.com/)）。这些公司可以帮助收集数据，从而洞察特定公司在社交媒体上的趋势，了解该公司竞争对手网站上正在发生什么等等。


    ## 真实商业案例 I


    *为小型企业提供咨询需要创造性来源分析数据；例如，一个组织不同主题培训的小型企业，旨在利用其当前培训参与者的信息来构建模型，预测哪些潜在客户未来会对培训感兴趣。他们打算向被预测为感兴趣的潜在客户推介新的培训包。由于是小型企业，执行此任务的预算极少，因此他们需要知道用可用资源精确瞄准哪些潜在客户。为了获取此任务的外部数据，数据分析师不得不在`Facebook`上投放定向广告，并附上一个`Google
    Form`链接，用于收集感兴趣潜在客户的详细信息。这是创造性获取外部数据的一种方式。*


    ## 真实商业案例 II


    *`Hadetulah`眼科诊所是一家小型企业，总共约20名员工，在尼日利亚约有五个分支机构。他们提供与眼部治疗相关的多项服务；从诊断到眼科治疗设备的销售。尽管他们没有运行核心的企业应用程序，但他们以Excel表格的形式捕获财务运营数据。他们还存储关于转诊医院、设备详情、租赁或销售信息以及发票的信息。对于`Hadetulah`，客户和人员系统以Excel表格形式捕获，包括客户姓名、电话、年龄、性别、职业、地址等信息。他们还能够捕获诸如在镜片类型上的花费、为客户服务的员工等信息。*
    *图* *[*2-1*](#532459_1_En_2_Chapter.xhtml#Fig1)* *展示了`Hadetulah`光学公司特征表示示例的示意图。从此图中，我们可以看到客户的图片以及表示客户的特征或属性。该图进一步给出了每个属性可能具有的值的示例，并说明了这（不同客户的历史特征集合）将如何作为预测算法的输入，其中属性`amount`是标签。开发模型后，我们现在可以将其用于预测新客户。*


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig1_HTML.png)


    图示展示了一张客户图片，其旁边列出了各种特征，即：`amount`、`age`、`type of eye defect`、`type of frame`、`location`、`height`和`weight`。通过预测金额生成一个学习模型。


    **图 2-1**

    `Hadetulah`光学的特征表示


    ## 数据隐私


    作为数据分析师，非常重要的是要熟悉数据隐私指南，无知不能成为借口，即使是在数据隐私问题上。为此，已有相关标准来帮助执行数据隐私。专业或商业组织会建立某些道德标准，以制定一套不具有法律约束力的信息处理程序。为了强制执行对某些数据集的特定处理，法律秩序已确立了法律标准。公司或机构也可以建立自己的政策指南或标准。此外，还有良好的判断标准，它指出，即使某事在技术上符合更正式的规则，也应不断思考：“这是一个好主意吗？”以及“可能的后果是什么？”


    以下是需要遵循的隐私指南：


    - 避免使用完整姓名、婚前姓、母亲娘家姓或昵称。

    - 不要包含个人识别号码、国家身份号码、护照号码、驾驶执照、纳税人识别号码或金融账户/信用卡号码。

    - 不要包含地址详情，例如居住地址或电子邮件地址。

    - 应避免使用个人信息，如图片（特别是面部或其他可识别特征）、指纹、笔迹或其他生物识别数据（例如，视网膜扫描、语音签名、面部几何形状）。

    - 不要包含与前述信息相关联或可关联的个人信息（例如，出生证明、出生地、种族、宗教、体重、活动、地理标识、就业信息、健康记录、学术信息、财务详细信息）。


    有必要了解你所在国家适用的数据政策；例如，在尼日利亚，我们有**尼日利亚数据隐私法规**。⁴'
  raw: '*Passive data collection*: This occurs when the object of interest is not
    involved in the data collection. It is collected through scanner or media such
    as radio, television, and social media. Other passive means of collecting data
    include web and mobile platforms. Web data gives you a lot of information about
    what your customers are looking at either on your own website or even the competitors’
    website. For ecommerce websites, for example, we can collect customer reviews,
    web transaction data, customers’ demographic data, and weblog data. An example
    of companies that help collect web data is Comscore ([`www.comscore.com/`](http://www.comscore.com/)).
    These companies can help to collect data which can give insights to how a particular
    company is trending on social media, see what is happening on the company’s competitor’s
    website, and so on.


    ***A*** ***real business illustration*** ***I:*** *Consulting for small business
    requires creativity in sourcing for analytics data; for example, a small business
    that organizes training on different subjects aims at using information on its
    current training attendee to build a model to predict which of its prospects will
    be interested in training in the future. Their intention is to approach the prospects
    predicted to be interested with their new training package. Since it’s a small
    business, there is minimal budget to carry out this task, and therefore they need
    to know the exact prospects to target with the available resources. In order to
    get external data for this task, the data analyst had to put a targeted advert
    on Facebook, accompanied by a Google Form link which is used to collect the details
    of interested prospects. This is one way to source external data creatively.*


    ***A real business illustration II:*** *Hadetulah eye clinic is a small business
    of about 20 staff in total and about five branches in Nigeria. They offer several
    services relating to eye treatment; from diagnosing to sales of eye treatment
    equipment. Even though they do not have a core enterprise application running,
    they capture financial operation’s data in the form of excel sheets. They also
    store information* *on the referral hospitals, equipment details, rental or sales
    information, and invoices. For Hadetulah, the customer and people systems are
    captured in excel sheets in the form of name of customer, phone, age, sex, occupation,
    address, and so on. They are also able to capture information such as the amount
    spent on types of lenses, staff who attended to the customer, and so on.* *Figure*
    [*2-1*](#532459_1_En_2_Chapter.xhtml#Fig1) *gives an illustration of a feature
    representation example for Hadetulah opticals. From this figure, we can see the
    customer’s picture and the features or attributes that represent the customer.
    The figure further gives an example of the values that each attribute might have
    and illustrates how this (an historical collection of features of different customers)
    will be an input to the prediction algorithm given that the attribute amount is
    the label. After developing the model, we can now use it to predict for a new
    customer.*


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig1_HTML.png)


    An illustration illustrates a picture of a customer, and besides it, various features
    are listed, namely, amount, age, type of eye defect, type of frame, location,
    height, and weight. A learning model is generated with predicted amounts.


    Figure 2-1


    Feature representation of Hadetulah optical


    ### Data Privacy


    It is very important as a data analyst to familiarize yourself with the data privacy
    guidelines, and ignorance is not an excuse even when it comes to data privacy
    issues. To this end, there are standards in place to help enforce data privacy.
    Professional or commercial organizations establish certain ethical standards in
    order to put in place a set of nonlegally binding information treatment procedures.
    To enforce the treatment of certain sets of data, legal standards have been established
    by law and order. A company or an institution can also establish its own policy
    guidelines or standards. There is also the good judgment standard, which states
    that even if something is technically correct by more formal rules, one should
    constantly consider “Is this a good idea?” and “What might the repercussions be?”


    The following are the privacy guidelines that need to be followed:


    *   Avoid using complete names, maiden names, mother’s maiden names, or nicknames.


    *   Do not include personal identification numbers, National Identity Numbers,
    passport numbers, driver’s license, taxpayer identification numbers, or financial
    account or credit card numbers.


    *   Do not include address details, such as residential address or email address.


    *   Personal information such as a picture (particularly of a face or other identifiable
    feature), fingerprints, handwriting, or other biometric data should be avoided
    (e.g., retina scan, voice signature, facial geometry).


    *   Do not include information about a person that is linked or linkable to one
    of the preceding information (e.g., birth certificate, birthplace, race, religion,
    weight, activities, geographical indicators, employment information, health records,
    academic information, financial details).


    There is a need to find out the data policy operable in your own country; in Nigeria,
    for example, we have Nigeria Regulations on Data Privacy.⁴'
