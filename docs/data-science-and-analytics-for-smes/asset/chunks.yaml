    selected. Note that you could actually create the histograms for yourself using
    the ***Visualizations*** tab. Figure [6-3](#532459_1_En_6_Chapter.xhtml#Fig3)
    shows the boxplot of some of the numerical variables which we are using to find
    out if the data has outliers and so on. If you do this for all the other numerical
    attributes, you will find out that there are no variables with outliers. The boxplot
    can help you to study the median, first quartile, the distribution for each variable,
    and so on.


