  trans: '

    从图 8-13 中，我们预期会得到三个输出结果，分别如图 8-14a、8-14b 和 8-14c 所示。


    ![](img/532459_1_En_8_Fig14_HTML.png)


    这是一张计算机截图，展示了 K 均值聚类模型的性能，该图反映了各聚类之间的分离程度。


    **图 8-14a**


    K 均值模型的性能结果


    图 8-14a 显示的是 K 均值模型的性能，用于了解各聚类的分离效果。根据 RapidMiner 文档，`avg._within_centroid_distance`（平均簇内质心距离）是通过计算质心与某个簇内所有样本点之间距离的平均值得到的。该值越小越好。在比较多个
    K 均值模型的结果时，能产生具有最小 Davies-Bouldin 指数聚类集合的模型，被认为是基于该指标的最佳算法。尽管在此示例中我们为 `k` 选择了一个值，但实践中建议在选定
    `k` 之前，先尝试多个 `k` 值，并比较其 `avg._within_centroid_distance` 和 Davies-Bouldin 指数。


    ![](img/532459_1_En_8_Fig15_HTML.png)


    这是一张计算机截图，显示了已聚类数据的输出，并通过聚类 ID 指明了每个客户所属的聚类。


    **图 8-14b**


    聚类数据集


    图 8-14b 是已完成聚类数据的输出，它（通过聚类 ID）指明了每个客户所属的聚类。可以进一步将其可视化，以观察客户的分离效果。（`Cluster Model
    Visualizer` 运算符可以提供帮助，但该功能未包含在 RapidMiner 免费版本中。）


    ![](img/532459_1_En_8_Fig16_HTML.png)


    这是一张计算机截图，描绘了一张折线图，即聚类质心图。它反映了描述不同聚类的属性信息。


    **图 8-14c**


    每个属性的可视化质心值


    图 8-14c 中选中的“绘图”选项卡展示了质心表的图表，这有助于观察哪些属性描述了不同的聚类。


    1.  *解读你的结果*：为了描述所得到的聚类特征，我们通过这张折线图（也称为轮廓图）来检查聚类质心。从图 8-14c 中可以看出，对于某些属性，各聚类之间分离程度不高，但仍有一些属性呈现出明显的分离，例如品牌
    = Dangote、品牌 = Chikki、产品等级 = 中等、产品等级 = 低等、产品等级 = 高等、产品尺寸 = 大、产品尺寸 = 小以及标价。这些是该
    K 均值模型的主要区分属性，可用于描述每个聚类的特征。


    为了描述不同聚类的特征，请比较聚类质心（图 8-14c 中的质心表），并尝试为每个聚类赋予一个标签。这个标签可以来自数据集中的任何一个或所有变量。那么这里的问题是：你会针对哪些聚类提供优惠？又会向该聚类中的客户提供何种类型的优惠？


    ## 8.4 关联分析


    关联分析是一种用于在存储交易记录的数据库中发现相关项目组（聚类）的技术。


    其目的是找出人们倾向于同时购买哪些物品。一旦发现这种关联，就可以将这些物品放在一起展示，或在交易后提供优惠券，或作为在线购物推荐。为了选择规则的子集，建立关联规则的步骤包括制定规则和评估这些规则的强度。


    频繁项集挖掘算法用于构建关联规则。经典算法之一是 Agrawal 等人（1993）提出的 Apriori 算法。该算法的重要步骤如图 8-15 所示。


    ![](img/532459_1_En_8_Fig17_HTML.png)


    此图展示了 Agrawal 等人提出的 Apriori 算法中的步骤。


    **图 8-15**


    Agrawal 等人（1993）的 Apriori 算法


    该算法可以生成大量规则，但我们只需要根据前件和后件之间的依赖关系，利用最强的规则来做决策。如果我们有以下规则：


    > *如果购买了尿布和饼干，那么在同一次购物中也会购买湿巾。*


    *前件：购买了尿布和饼干。*


    *后件：在同一次购物中购买了湿巾。*


    规则所隐含的关联强度通过以下方式衡量：


    ![$$ 支持度 = P\left( 前件\ AND\ 后件\right) $$](img/532459_1_En_8_Chapter_TeX_Equ1.png)


    （公式 8.1）


    规则的支持度从规模角度反映了规则的总体影响：受影响的交易总数是多少？如果只有少数交易受到影响，那么该规则可能没有太大价值。


    ![$$ 置信度 = \frac{同时包含\ 前件\ 和\ 后件\ 项集的交易数}{包含\ 前件\ 项集的交易数} $$](img/532459_1_En_8_Chapter_TeX_Equ2.png)


    （公式 8.2）


    ![$$ 置信度 = \frac{P\left( 前件\ AND\ 后件\right)}{P(前件)} = P\left( 后件| 前件\right) $$](img/532459_1_En_8_Chapter_TeX_Equ3.png)


    （公式 8.3）


    *   置信度值高表明存在强关联规则（对此我们高度确信）。

    *   然而，这可能具有欺骗性，因为当前件和/或后件有很强的支持度时，即使它们相互独立，我们也可能对两者都有很高的置信度。

    *   置信度告诉我们后件被发现的比率，有助于判断规则在业务或运营环境中的实用性。如果一条规则的置信度很低，导致发现的后件太少，那么在所有包含前件的交易中推广该规则的后件可能得不偿失。


    ![$$ 提升度 = \frac{置信度}{基准置信度} $$](img/532459_1_En_8_Chapter_TeX_Equ4.png)


    （公式 8.4）


    *   我们可以通过将关联规则的置信度与一个基准值进行比较，来更好地评估规则的强度。基准值假设交易中的前件和后件项集是相互独立的。换句话说，如果前件和后件项集是独立的，我们对结果能有怎样的置信度？

    *   提升度大于 1.0 意味着前件与后件之间的关系比假设两者独立时预期的关系更显著。提升度越大，关联性越强。

    *   提升度是衡量规则发现后件的能力（与随机选择相比）的指标。尽管高效的规则优于低效的规则，但我们还必须考虑支持度：一条高效但支持度低的规则，可能不如一条效率较低但支持度高得多的规则理想。

