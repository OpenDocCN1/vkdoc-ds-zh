    ### Data Cleaning – Outliers


    What are outliers? An outlier is an observation that lies an abnormal distance
    from other values in a random sample from a population. To detect outliers, we
    check if values are in a reasonable range, given what you would expect for each
    variable. When there are obvious outliers, for example, in Figure [2-10](#532459_1_En_2_Chapter.xhtml#Fig11),
    there is a need to deal with them.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig11_HTML.png)


    A graph plots age versus amount to pay. A third parameter, an example set, is
    also marked. Outlier is covering the age range from 275 to 300, where x is equal
    to 300 and y is equal to 10000.


    Figure 2-10


    Outliers


    Furthermore, to detect outliers, we can check the distance between each data point
    and the mean. Any observation above or below three standard deviations away from
    the mean are considered outliers. When variables are paired, outliers fall outside
    the pattern (scatter plot). The purpose of identifying outliers is usually to
    call attention to values that need further review, for example, a temperature
    of 200°F for a sick person or age of 300\. Some key questions about outliers are:
    Is the outlier a mistake or legitimate point? Is the outlier part of the population
    of interest? The answer will help to decide whether to include the outlier in
    our analysis or not. One way to detect outliers is to sort the records by the
    column, then review the data for very large or very small values in that column.
    You also look at each column’s minimum and maximum values (this can be done using
    statistics in RapidMiner). Boxplot visualization or a scatter plot of two numerical
    variables can also be used to find outliers. If the outlier is due to a mistake,
    fix it; if the outlier is outside the target population, eliminate it. If outliers
    are much beyond the range of the rest of the data (e.g., a misplaced decimal),
    it may have a significant impact on some of the data mining processes we plan
    to employ, such as Euclidean distance in clustering. Other methods for dealing
    with outliers include data transformation, the use of outlier-resistant tools
    such as mean instead of median, and so on. All of these are decisions that should
    be made by someone with domain expertise of the application in question.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig12_HTML.png)


    A process represents filtering of outliers. The stages consists of retrieve question
    online, select attributes, detect outliers, filter examples, and write C S V.


    Figure 2-11


    Process for filtering outliers


    1.  We continue our practical example by dealing with outliers. Create a new process,
    and ***Import*** the data (*OnlineQuestionAfterMissing.csv*) resulting from the
    missing value cleaning, using the procedure explained in step 2 of this example.
    To take a look at the data before handling outliers, you can run the process with
    only the data in the design view. To handle outliers by filtering out the row,
    use the process in Figure [2-11](#532459_1_En_2_Chapter.xhtml#Fig12); click the
    ***Select Attributes*** operator; for ***attribute filter type***, click ***subset***
    and select all the attributes so the output of the process will contain the whole
    data stored. Note that, sometimes, you might want to normalize before applying
    the ***detect outliers*** operator, particularly when using Euclidean distance.
    For the ***Detect Outliers*** operator, note that in the parameter, the number
    of neighbors is set to 10 by default. You might want to change that based on your
    understanding of how the operator works. Just as it is with all other operators
    in RapidMiner, there is a need to read the help document of all the operators
    to know how to maximize it for your own particular task. The ***Filter Examples***
    operator selects which row(s) of the data is kept and which is removed based on
    how you program it. You can set the ***filters*** *parameter*, thus outlier> equals
    >false; if you do this, you will observe that even though we expected only one
    row to be removed, more roles are gone. A more efficient way to deal with this
    problem is to handle outliers by correcting rather than deleting the row. Finally,
    the ***Write CSV*** operator is used to save the resulting data in a csv file
    named ***OnlineQuestionAfterOutlier.csv***.


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig13_HTML.png)


    A screengrab represents a create filter tab with three selection tabs.


