  trans: '

    ### 示例 2.1


    数据文件`OnlineQuestion1.xlsx`需要经历数据清洗过程。首先，通过汇总统计了解并熟悉数据，处理缺失数据和异常值，最后对数据进行标准化。我们将按顺序逐一处理这些任务。


    ![](img/532459_1_En_2_Fig2_HTML.jpg)


    屏幕截图显示了带有导入数据文件夹的资源库选项卡。一个箭头指向下拉箭头。


    **图 2-2** 创建资源库


    - 创建资源库；点击图 2-2 中**导入数据**旁边的向下箭头。

    - 首先要做的是，按照以下步骤为你的项目创建一个资源库：


    ![](img/532459_1_En_2_Fig3_HTML.jpg)


    屏幕截图显示了资源库选项卡。一个箭头指向导入选项卡文件夹。


    **图 2-3** 导入数据


    - 点击**导入数据**（图 2-3）。

    - 从你电脑上的任意位置选择你的数据文件（`OnlineQuestion1.xlsx`）。

    - 加载待清洗的数据。

    - 为你本地的资源库命名为“`OnlineCourse`”。

    - 在你的资源库中创建两个文件夹（`data`和`process`）。


    ![](img/532459_1_En_2_Fig4_HTML.png)


    屏幕截图显示了一个包含八列数据的列表。该数据列表的标题是“格式化列”。


    **图 2-4** 格式化数据类型


    - 格式化你的列（数据类型）。在 RapidMiner 中，数据类型包括多项式（两个以上类别的分类变量）、二项式（两个类别的分类变量）、实数（带小数的数字）、整数（不带小数的数字）、日期时间（日期和时间）、日期以及时间。¹³
    在此阶段（图 2-4），你可以检查所有属性，根据领域知识及分析目的确认其数据类型是否正确。此时你需要回答诸如：*某些变量取值是否唯一？*等问题。可能需要更改类型、更改变量角色、重命名变量或删除变量（可通过点击图
    2-4 中属性旁的箭头进行）。为便于演示，我们将`message`和`MOVED_AD`属性改为二项式类型。


    ![](img/532459_1_En_2_Fig6_HTML.png)


    屏幕截图显示了包含六列的统计数据。在结果历史文件夹中，已选中统计选项卡。


    **图 2-6** 汇总统计


    ![](img/532459_1_En_2_Fig5_HTML.png)


    屏幕截图显示了一个示例集选项卡，数据以十一列形式列出。左侧边栏包含数据、统计、可视化及注释等选项卡。其中数据选项卡被选中。


    **图 2-5** 加载数据的显示界面


    - 在可能出现错误（例如字符变量包含数值数据，反之亦然）的情况下，**用缺失值替换错误**功能可处理此类问题。在清洗过程的下一步中，我们可以处理缺失数据。

    - 要将数据加载/导入资源库，请在你的资源库中选择`data`子文件夹，然后点击**完成**。

    - 加载数据的显示界面如图 2-5 所示。在此界面中，你可以点击**统计**查看汇总统计信息（图 2-6）。

    - 检查统计数据以解决以下问题：字符变量是否包含有效值？数值是否在合理范围内？可利用`min`和`max`函数检测可能为错误值的极值。是否存在缺失值？检查以下内容：量纲差异、字段定义、计量单位、时间段等。


    ### 缺失数据


    如何处理缺失数据？在许多情况下，你不能简单地丢弃数据，因为你需要足够的数据来进行有意义的分析。此外，可能有多个属性存在不同的缺失值，导致需要删除过多行记录。有时，缺失值本身包含信息。因此，你需要进一步调查，了解发生了什么情况，或者是否仅为输入错误。数据点的缺失甚至可能具有很强的预测能力。处理缺失值的首选方案是替换它们。你可能希望用一些智能估计值来填充数值。第二种处理方法是删除整行或整列。第三种方法是用零、均值、中位数以及多种其他插补方式进行数值插补。另一种方法是，如果数据属性本质上是分类属性，则将缺失值转换为数据中的某一类别。在处理缺失值时，务必尽可能减少失真，并利用领域知识来决定采取何种步骤，这一点至关重要。


    ![](img/532459_1_En_2_Fig7_HTML.png)


    屏幕截图指向菜单栏上名为“运行”的箭头。已选中“过程”选项卡，其中包含“检索 Online Question 1”操作。另一个标记为“结果”的箭头指向“检索
    Online Question 1”。


    **图 2-7** 在 RapidMiner 中运行第一个过程


    - 在图 2-6 中，点击**设计**选项卡，并从资源库中将数据拖拽至设计视图（这是我们向设计视图添加算子或数据的方式）。

    - 将数据的输出连接到结果（`res`），如图 2-7 所示。

    - 点击**运行**按钮（工具栏上的蓝色三角形，如图 2-7 所示）来运行过程。

    - 为了处理缺失数据，我们将从第 7 步停止的地方继续。


    ![](img/532459_1_En_2_Fig8_HTML.png)


    屏幕截图显示了包含六列的统计数据。在结果历史文件夹中，已选中统计选项卡。


    **图 2-8a** 再次检查统计信息


    - 从点击**统计**（图 2-8a）后的输出中，你会观察到并非所有属性都有缺失值，这时就需要你决定如何处理这些缺失值。


    ![](img/532459_1_En_2_Fig9_HTML.png)


    屏幕截图显示了两个选项卡：过程选项卡和参数选项卡。在过程选项卡中，“检索 Online Questions”和“替换缺失值”文件夹指向结果结果。过程选项卡中还显示了“选择属性”窗口。


    **图 2-8b** 替换缺失值算子


    - 我们不能使用**使用过滤示例**算子来删除缺失值，因为那样会导致丢失超过 50 条记录，所以我们将使用**替换缺失值**算子。

    - 在**算子**下，搜索**替换缺失值**算子，将其添加到图 2-7 的设计视图中，并将其连接到**检索 OnlineQuestion1**算子，再连接到输出。

    - 此时，需要明确一点：在**替换缺失值**算子的参数设置中，针对不同属性有不同的处理方式。如果你想逐个处理属性，可以先使用**选择属性**算子选中要处理的属性，然后再使用**替换缺失值**算子对该属性进行处理。

