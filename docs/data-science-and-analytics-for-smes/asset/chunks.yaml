  trans: '

    # 5.4 折线图


    折线图用于跟踪短期和长期的变化。当存在较小变化时，折线图比柱状图更适用。折线图也可用于比较多个组在同一时间段内的变化情况。


    **在 RapidMiner 中创建折线图**


    ![](img/532459_1_En_5_Fig6_HTML.png)


    可视化选项卡显示了一个折线图，其中图形类型选择为折线，X 轴和数值列设置为销售额和利润。


    图 5-6：折线图示例


    1.  通过调整设置创建一个折线图，如图 5-6 所示，以反映 X 轴上的`sales`和 Y 轴上的`profit`。

    2.  从图 5-6 中，我们可以看到利润（Y 轴）如何随销售额（X 轴）变化。


    # 5.5 箱线图


    箱线图是一种基于五数摘要（最小值、第一四分位数（Q1）、中位数、第三四分位数（Q3）和最大值）来标准化显示数据分布的方法。它可以告诉你关于离群值及其数值的信息。它还能告诉你数据是否对称、数据聚集的紧密程度，以及数据是否存在偏斜及其偏斜方向。它也可用于比较子组之间的分布。


    **在 RapidMiner 中创建箱线图**


    ![](img/532459_1_En_5_Fig7_HTML.png)


    可视化选项卡显示了一个箱线图，其中图形类型选择了箱线图，数值列设置为数量。


    图 5-7：箱线图示例


    1.  通过调整设置，如图 5-7 所示，为属性“数量”创建一个箱线图。`Plot type`设置为箱线图，而`Value columns`（Y 轴）设置为数量。

    2.  从图 5-7 可知，最小数量为 1，第一四分位数（Q1）为 2，中位数为 3，第三四分位数（Q3）为 5，最大值为 14。大部分数量分布在 2 到
    5 之间。


    ![](img/532459_1_En_5_Fig8_HTML.png)


    可视化选项卡显示了一个并列箱线图，其中图形类型设置为箱线图。X 轴标签在数值列中指定。


    图 5-8：并列箱线图


    1.  图 5-8 显示了数据中所有数值属性（销售额、折扣、数量和利润）的并列箱线图。这是通过将所有属性都包含在`Value columns`中获得的。


    # 5.6 散点图


    散点图有助于发现以下特征：


    -   *因果关系（线性和非线性）*：一个变量可能以某种方式直接影响另一个变量。例如，经验更丰富的人往往薪酬更高。通常将因变量放在垂直轴上。

    -   *关联性*：变量之间可能存在关联，但不一定是直接的因果关系。孩子们在英语和数学上取得好成绩是因为他们聪明，而不是因为一个科目的能力强是另一个科目能力强的缘由。

    -   *离群值或离群值组*：当为两个维度（一个在 X 轴上，另一个在 Y 轴上）创建散点图时，某些个案可能成为离群值，但在单独考虑每个维度时却并非离群值。个子较高的人通常体重更重，但也可能存在中等身高的人，其体重相对于身高来说过重或过轻，从而在人群中显得突出。

    -   *簇群*：有时，存在一些与其余数据分离的个案群组。


    **在 RapidMiner 中创建散点图**


    ![](img/532459_1_En_5_Fig9_HTML.png)


    可视化选项卡显示了一个散点图，其中图形类型设置为散点图，X 轴和数值列设置为销售额和数量。


    图 5-9：散点图


    1.  通过调整设置，如图 5-9 所示，创建一个以销售额为 X 轴、数量为 Y 轴的散点图。`Plot type`设置为散点图。


    ![](img/532459_1_En_5_Fig10_HTML.png)


    在颜色编码的散点图中，图形类型设置为散点图，X 轴和数值列设置为销售额和数量，颜色设置为类别。


    图 5-10：颜色编码散点图示例


    1.  可以通过在图 5-9 的设置中添加一个分类变量（`color`）来创建颜色编码的散点图，从而得到图 5-10。颜色编码的散点图有助于使用分类变量（用类别来区分这种关系）进一步解释属性销售额和数量之间的关系。从图
    5-10 中，我们可以看到，低数量和低销售额的商品大多属于技术类别。


    ![](img/532459_1_En_5_Fig11_HTML.png)


    图形类型设置为散点图矩阵，数值列带有 X 轴标签，列摘要设置为直方图，包含六个散点图和三个直方图。


    图 5-11：散点图矩阵示例


    1.  现在，让我们使用图 5-11 中的设置为数值属性（折扣、数量和销售额）创建一个散点图矩阵。`Plot type`设置为散点图矩阵；`Value columns`设置为销售额、数量和折扣；`Column
    Summary`设置为直方图。散点图矩阵将有助于一次性比较所有目标属性。


    # 5.7 气泡图


    气泡图以圆形簇的形式显示数据。它可以用来可视化分类属性的大小。分类属性的每个类别代表一个圆形，而每个类别中的数量则代表这些圆形的大小。


    **在 RapidMiner 中创建气泡图**


    ![](img/532459_1_En_5_Fig12_HTML.png)


    可视化选项卡显示了一个气泡图，其中图形类型设置为气泡图，数值列和类别设置为年龄和性别。


    图 5-12：气泡图


    1.  要创建气泡图，将使用名为`OnlineQuestion1.xls`的数据。将数据导入到你的存储库中；在设计视图中，将数据连接到结果（`res`），然后运行流程，在出现的界面（即`Results`）上，单击可视化选项卡。（注意，本课程使用的免费版
    RapidMiner 的配置不允许对超过 2000 行的数据进行气泡图可视化。）

    2.  使用如图 5-12 所示的设置创建气泡图。`Value column`（Y 轴）设置为年龄。`Category`设置为性别（正在调查的分类属性）。

    '
- fmt: '# Treemaps


    Treemaps display data in nested rectangles. It can be used to visualize the size
    of categorical attributes. Each category of the categorical attribute represents
    a rectangle, whereas the number in each category represents the size of those
    rectangles.


    ## Creating Treemaps in RapidMiner


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig13_HTML.png)


    The plot type is set to `tree map`, the value column is set to `age`, aggregate
    data is selected, `group by` set to `like maths`, and the aggregation function
    is set to `count`.


    **Figure 5-13** — Treemaps


    1. To create treemaps, the data named `OnlineQuestion1.xls` will be used. (Note
    that the configuration of the free RapidMiner edition used for this course does
    not allow for visualizing more than 2000 rows for treemaps.)

    2. Create the treemap using the setting as shown in Figure 5-13. The **Value column**
    (y axis) is set to `Age`, **Group by** is set to `LikeMaths` (the categorical
    attribute under investigation), and the **Aggregation Function** is set to `count`
    to show how the size of the rectangles is determined.

    3. From Figure 5-13, `Yes` has the highest count, and this is indicated by the
    largest rectangle color blue. This is followed by `Maybe` and so on.


    # Heat Maps


    A heat map is a graphical display of numerical data where color is used to denote
    values. They are especially useful for the purpose of visualizing correlation
    tables and visualizing missing values in the data. To do this, the information
    is conveyed in a two-dimensional table. A correlation table for a set of attributes
    has the same number of rows and columns. If the number of attributes is a lot,
    then a subset of the attributes can be used. Heat maps make it easy and faster
    to scan correlation values with the color codes.


    ## Creating Heat Maps in RapidMiner


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig14_HTML.png)


    The plot type is set to a heat map, value columns list the `Age`, `AmountToPay`,
    `Message`, and `Moved_AD`.


    **Figure 5-14** — Heat map for missing data


    1. To create heat maps for visualizing missing data, for example, we will use
    the data named `OnlineQuestion1.xls` and make the settings as displayed in Figure
    5-14. The **Plot type** is heat map, the attributes selected are `Age`, `AmountToPay`,
    `Message`, and `Moved_AD`. We will look at heat maps for correlation in Chapter
    6.

    2. In Figure 5-14, given the selected attributes, the whole rows (223) in the
    data are displayed. The missing data for a particular attribute is represented
    in color white. Visualizing the data like this will help to have an idea of how
    much data is missing. For example, there are very few cells with missing data.


    # Geographical Maps


    Maps are basically the geographical representation of your data. There are certain
    types of inferences that are best achieved only when the data is visualized geographically.


    ## Creating Geographical Maps in RapidMiner


    ![](images/532459_1_En_5_Chapter/532459_1_En_5_Fig15_HTML.png)


    The plot type is set to point map, a select map is set to `Nigeria`, and `latitude`
    and `longitude` are selected, respectively.


    **Figure 5-15** — Point map locating customers


    1. For the purpose of demonstration, we will use the `customersNigeria.xls` data.
    This data consists of the customers of a particular business and their location
    data.

    2. To create the geographical maps, import the data into your repository; in the
    design view, link the data to the result (`res`), then run the process, and on
    the resulting interface (`Results`), click the visualizations tab.

    3. Create the setting as shown in Figure 5-15. The **Plot type** is point map;
    **Select map** is `Nigeria`. **Latitude** is `latitude`, and **Longitude** is
    `longitude`.

    4. From Figure 5-15, we can easily make inferences about the location concentration
    of the customers in Nigeria.

    5. Other types of maps can be explored such as the choropleth maps for displaying
    numerical values associated to regions (e.g., a country or a state) via a color
    gradient or the categorical maps used to visualize regions that belong to a number
    of distinct categories.⁷


    It is important to say that for the purpose of demonstration, we have just selected
    some popular tools and used the most common setting for the visualization. There
    are other settings that can be used based on the goal of the analysis. Also, there
    are other more interactive visualization tools such as Tableau and Power BI which
    can be explored.'
