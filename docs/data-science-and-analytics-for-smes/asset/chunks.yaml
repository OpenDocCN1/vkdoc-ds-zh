    ## 7.7 Logistic Regression


    Logistic regression is based on a model that links the predictors to the result.
    A small set of data can be used to train logistic regression classifiers, which
    can then be applied to large groups of new records. When the result variable,
    Y, is categorical, logistic regression extends the concepts of linear regression.


    Based on the values of its predictor variables, logistic regression may be used
    to classify a new record, whose class is not known, into one of the classes (called
    classification). It can also be used to discover features distinguishing between
    records in various classes in terms of their predictor profile or predicting variables
    in data where the class is known (called profiling).


    When we need to classify customers as returning or nonreturning (classification)
    in business, find features that discriminate between customers (profiling), and
    so on, we use logistic regression. We can use logistic regression to calculate
    a new record’s propensity to fall into one of several classes, and records are
    then ranked from highest to lowest propensity so that we can focus our efforts
    on those with the highest propensity.


    The predictor variables x[1], x[2],......x[p] could be categorical, continuous,
    or a combination of both.


    Steps of logistic regression


    1.  Calculate the propensities of belonging to each class.


    2.  Use a cut-off value on the propensities to classify each record into one of
    the classes. The record is assigned to the class with the highest probability.


    Just like in KNN, the default cut-off value in two-class classifiers is 0.5.


    **The logistic regression model**


    From the linear regression equation in Equation [6.​7](#532459_1_En_6_Chapter.xhtml#Equ7),
    we can express *p* as a linear function *predictor* (*x*[*1*]*,x*[*2*]*……x*[*p*]):


    ![$$ Y={\beta}_0+{\beta}_1{X}_1+{\beta}_2{X}_2+{\beta}_3{X}_3+\dots \dots \dots
    +{\beta}_p{X}_p $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ8.png)


    (Eq. 7.8)


    Instead, the logistic regression uses a nonlinear function of the predictors in
    the form


    ![$$ p=\frac{1}{1+{e}^{-\left({\beta}_0+{\beta}_1{x}_1+{\beta}_2{\beta x}_2+\dots
    +{\beta}_q{\beta x}_q\right)}} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ9.png)


    (Eq. 7.9)


    This is what is referred to as the logistic response function. For any value x[1]...x[q],
    the right-hand side will always result in values between [0; 1].


    Odds are a measure of belonging to a specific class. The ratio of the probability
    of belonging to class 1 to the probability of belonging to class 0 is defined
    as the odds of belonging to class 1\. We may also do a computation in the opposite
    direction. We can compute the probability of an event using Equation [7.9](#532459_1_En_7_Chapter.xhtml#Equ9)
    if we know the odds. If we compute the probability in the opposite direction,
    we get the following result:


    ![$$ Odds\left(Y=1\right)=\frac{p}{1-p} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ10.png)


    (Eq. 7.10)


    If the chance of winning is 0.5, for example, the odds of winning are 0:5/0:5
    = 1, that is, the probability of being in class 1 divided by the probability of
    being in class 0\. We can perform the reverse calculation; we can compute the
    probability of an event if we know the odds by modifying Equation [7.10](#532459_1_En_7_Chapter.xhtml#Equ10).
    This gives us Equation [7.11](#532459_1_En_7_Chapter.xhtml#Equ11).


    ![$$ p=\frac{odds}{1+ odds} $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ11.png)


    (Eq. 7.11)


    We may describe the relationship between the odds and the predictors by substituting,
    for example, Equation [7.9](#532459_1_En_7_Chapter.xhtml#Equ9) into Equation [7.11](#532459_1_En_7_Chapter.xhtml#Equ11)
    as


    ![$$ Odds\left(Y=1\right)={e}^{\beta_0+{\beta}_1{x}_1+{\beta}_2{x}_2+\dots +{\beta}_q{x}_q}
    $$](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ12.png)


    (Eq. 7.12)


    Now, we can derive the standard formulation of a logistic model by using a natural
    logarithm² on both sides:'
