  trans: '

    # 1.6 中小企业分析问题的类型


    在本节中，我们尝试强调中小企业可以通过数据分析回答的一些问题类型，以及一些可能有助于探索这些问题的建议技术（表 1-2）。需要注意的是，这些问题是由业务类型和当前分析目标的性质决定的。此外，有时可能需要将多种技术结合使用，或将它们作为彼此的先决条件，如第
    9 章和第 10 章的咨询业务问题场景所示。同样重要的是，只有当这些问题被嵌入到第 1.3 节所述的分析过程中时，其答案才能产生所需的价值。


    **表 1-2**

    中小企业问题与技术


    | 问题 | 建议技术 |

    | --- | --- |

    | • 促销如何影响我的销售？ | 时间序列预测 |

    | • 在促销期间是谁购买了我们的产品？或者说我们的客户是谁？• 哪种类型的展示效果更好？• 哪些产品在同时销售，哪些产品在相互抵消？• 我们如何精准定位营销和促销活动，并向客户推荐产品？•
    我们如何发现最具影响力的客户/潜在客户？• 我们如何了解员工的效率？• 我们应该库存什么，以及如何摆放它们？ | 关联规则挖掘、网络分析、协同过滤 |

    | • 客户在购买什么？• 我们的客户有哪些类型？ | 聚类分析 |

    | • 我们的销售额为何下降或减少？ | 描述性/探索性分析 |

    | • 我们如何预测销售额？• 我们如何预测折扣对销售额的影响？• 我们如何估算销售活动的利润、预测价格等？• 哪个客户即将购买或会购买下一件商品？• 他们会购买多少次？•
    我们的客户中有多少人会留下或离开？• 我们如何留住客户并以正确的方式针对他们？• 我们如何将非盈利客户转变为盈利客户，或将盈利客户转变为更高利润的客户？•
    我们应该存储什么或丢弃什么？• 我们何时存储或丢弃？• 能够最大化销售额的正确价格点是多少？• 哪些产品利润最高？• 我们如何增加客户群？ | 分类与预测技术
    |


    ## 1.7 中小企业的分析工具


    中小企业可以使用的一些分析工具如图 1-3 所示，尽管还有更多。其中一些工具是开源的，可以免费使用，而另一些则不是。尽管企业倾向于选择免费工具似乎很诱人，但在选定之前，了解这些平台上的可用功能非常重要。在本书中，我们主要使用
    `RapidMiner Studio`，但也辅以 `RStudio` 和 `Gephi`，以便对分析过程有一个全面的视角。选择 `RapidMiner Studio`
    是为了吸引非编程背景的业务分析受众，而 `Gephi` 用于网络分析，以创建美观且易于解释的网络图。同样需要注意的是，本书中使用的所有工具都是开源的（可在线免费下载）。


    ![](img/532459_1_En_1_Fig3_HTML.jpg)


    一幅插图展示了主题专家使用的十四种分析工具图标。


    **图 1-3**

    中小企业的一些分析工具


    ## 1.8 本书路线图


    本书分为四个主要部分。图 1-4 展示了本书的整体结构以及本书各主题在其中的位置。章节编号标示在主题旁边。第 1 部分（第 1 章和第 2 章）解释了本书探讨的基本概念，例如数据科学、面向业务的数据科学（业务分析），以及无论是总体上还是专门针对小型企业，执行任何分析项目所需的条件。在这一部分，我们还探讨了与数据相关的问题，以及如何通过实际示例为分析项目管理和准备数据。第
    2 部分（第 3 章和第 4 章）侧重于分析咨询，并解释了如何在数据分析咨询领域取得成功。它还详细介绍了业务分析咨询所涉及的各个阶段。第 3 部分（第 5
    章至第 8 章）侧重于中小企业常见的数据挖掘技术，并通过一种方法进行阐述，该方法首先以简单的方式解释这些技术的基本概念，然后使用真实的业务问题场景进行实际应用。这部分以实践为导向，基于小型企业遇到的案例研究问题。在本书中，我们将涵盖五个不同的实际业务问题。这些业务问题在第
    5 章至第 8 章中讨论。本书使用的技术展示了如何解决这些问题。需要在此说明的是，尽管使用特定问题作为案例研究，但该方法不仅适用于这种情况，还可以用于其他类似的问题场景。选择这些技术是基于它们在实践中的普及程度，它们属于预测（预测数值结果）、分类（预测分类结果）和描述性分析的大类范畴。最后，第
    4 部分通过使用一个中小企业案例研究来实践咨询原则，对第 2 部分中已解释的咨询阶段进行建模，并采用第 3 部分中解释的适当技术。尽管每个章节都是独立的，但我们建议您在进入第
    3 部分之前先阅读第 1 部分，在进入第 4 部分之前先阅读第 2 部分。


    ![](img/532459_1_En_1_Fig4_HTML.jpg)


    一幅插图展示了本书的组织结构。它由四个块组成，分别标记为第一部分、第二部分、第三部分和第四部分。


    **图 1-4**

    本书路线图


    由于本书以实践为基础，以下是安装指南以及对我们将在实践演示中使用的软件的简要介绍。


    ### 使用 RapidMiner Studio


    `RapidMiner Studio` 是一个全面的开源数据挖掘工具，包含超过 400 个内置数据挖掘操作符以及广泛的可视化工具。它由德国多特蒙德大学的 Ralf
    Klinkenberg、Ingo Mierswa 和 Simon Fischer 创建。如今，它由一家商业公司以及开源开发者共同维护。它有两个版本：免费的社区版和商业的企业版。`RapidMiner`
    的文档和安装指南可在 [`https://docs.rapidminer.com/`](https://docs.rapidminer.com/) 找到。`RapidMiner
    Studio` 可以直接从 [`https://rapidminer.com/`](https://rapidminer.com/) 下载。图 1-5 是成功下载并安装
    `RapidMiner Studio` 后的起始页面。


    ![](img/532459_1_En_1_Fig5_HTML.png)


    已安装的 Rapid Miner 软件首页截图。


    **图 1-5**

    欢迎使用 RapidMiner


