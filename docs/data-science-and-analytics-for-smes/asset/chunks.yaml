- fmt: '### Events in Real Life and Description


    The problems that analytics can solve for business come majorly by discovering
    needs of a particular business, particularly the needs that can be solved by analytics.
    It is important to note that before you can build a successful analytics project
    that will yield results, you need to have a domain understanding of the business
    terrain and also the typical success strategies of the business since the analytics
    recommendation will be used to improve this purpose. Depending on the kind of
    business in question, there are several means to discover their particular analytics
    needs. Some of these means include using interviews, social media (`text mining`),
    focus groups, and so on. It is also important to note that these needs should
    be focused on the goal of specific business. Generally, Business Analytics helps
    to boost business processes, reduce business cost, drive business strategy, and
    monitor and improve business financial performance. Uber, for example, enhanced
    its `Customer Obsession Ticket Assistant (COTA)` in early 2018 to improve the
    speed and accuracy while responding to support tickets using predictive analytics.
    This is a great example of a company that has implemented Business Analytics.
    Many companies now employ predictive analytics to anticipate maintenance and operational
    concerns before they become major problems; this is according to a KPMG analysis
    on emerging infrastructure trends.^(12)


    In this first stage of Business Analytics journey, we develop an understanding
    of the purpose of the data mining project or Business Analytics project particularly
    to know if it is a one-shot effort to answer a question or questions or if it
    is an ongoing procedure. After this, we then highlight the decisions we want to
    make and determine or suggest the analysis output that will help to make the decision.
    It will help to have a design that is a conceptual design of the analysis that
    will create the output.


    The conceptual business model is used to understand data in the business domain
    and how the business actually works. It particularly helps to understand the importance
    of context in solving analytical problems. It also helps us to understand how
    important elements relate together. Since Business Analytics solves problems,
    that is, it answers questions, it is therefore important to know at this stage
    what questions are worth asking in the course of the analytics project. This conceptual
    business model will help us to do that.


    In this stage of dealing with real-world events, we also want to understand what
    exactly contributes to the data that we are to be using for the analytics project.
    For example, the data might come from someone making a purchase. It could also
    come from using a product or service. As a matter of fact, data could come from
    anything in the problem domain. Just as is referred to in the definition of Business
    Analytics, there is a need to focus on the data which is targeted toward contributing
    to the solution. It is not just about having a large volume of data but focusing
    on the data needed to solve the problem or questions highlighted. The following
    scenario gives a real SME business example of interpreting this stage of the analytics
    journey.


    **A real business problem:** *Alegria Recyclers Ltd (*[www.alegriarecyclers.com.ng/](http://www.alegriarecyclers.com.ng/)*)
    is a small business which deals in recycling waste materials. Alegria has just
    two permanent staffs and about ten ad hoc staffs. Alegria deals in recycling hospital
    wastes like the X-ray films. Their customers are various types of hospitals and
    clinics. The task at hand for the data scientist is come up with the best actionable
    strategy for targeting future customers.*


    *The conceptual business model of this business is captured in* *Figure* [1-2](#532459_1_En_1_Chapter.xhtml#Fig2)*.
    It captures most of the activities of the business. As a Business Analytics consultant,
    you need to understand the business you are consulting for, by first developing
    the conceptual model; this will help you to know how to capture the real-world
    events in the business domain, that is, the data needed and the importance of
    different types of data. It will also help you to understand how the results of
    your analysis will be used optimally to get the best results in your analytics
    project. The first step talks about looking for prospects; this is where you want
    to explore data of the type of clients that they have worked with in the past,
    what are the attributes that describe such prospects, what kind of materials are
    obtained from these different types of clients, and so on; all the information,
    for example, can help to build clustering models that will help Alegria to understand
    their prospects and many more. In the second step of the conceptual model which
    deals with how Alegria contacts the prospects in step one, you want to store information
    on the time of contact, location, etc. For each of the remaining steps, such as
    negotiating for collecting of waste, collecting the waste, recycling the waste,
    and making revenue from the waste, you will have to bring out the data attributes
    that could be captured. This is how you are able to use the conceptual business
    model to have a complete understanding of the data in the business domain.*


    ![](images/532459_1_En_1_Chapter/532459_1_En_1_Fig2_HTML.jpg)


    A model represents the feasibility of the business idea of making revenue from
    recycled wastes.


    **Figure 1-2** Conceptual business model of Alegria Recyclers Ltd'
