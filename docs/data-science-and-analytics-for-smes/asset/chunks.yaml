    ## 数据清洗 – 异常值


    什么是异常值？异常值是指从总体随机样本中，与其他值存在异常距离的观测值。要检测异常值，我们会检查这些值是否在合理的范围内，这取决于你对每个变量的预期。当存在明显的异常值时，例如，在图[2-10](#532459_1_En_2_Chapter.xhtml#Fig11)中，需要对其进行处理。


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig11_HTML.png)


    该图表绘制了年龄与应付金额的关系。第三个参数，即示例集，也被标记出来。异常值覆盖了年龄从275到300的范围，其中x等于300，y等于10000。


    **图2-10** 异常值


    此外，要检测异常值，我们可以检查每个数据点与均值之间的距离。任何距离均值超过三个标准差的观测值都被视为异常值。当变量成对出现时，异常值会落在（散点图的）模式之外。识别异常值的目的通常是引起对需要进一步审查的值的注意，例如，一个病人的体温为200°F，或者年龄为300岁。关于异常值的一些关键问题是：该异常值是错误还是合法数据点？该异常值是否属于目标总体的一部分？答案将有助于决定是否在我们的分析中纳入该异常值。检测异常值的一种方法是按列对记录进行排序，然后审查该列中非常大或非常小的值。你还可以查看每列的最小值和最大值（可以使用RapidMiner中的统计功能完成此操作）。箱线图可视化或两个数值变量的散点图也可用于发现异常值。如果异常值是由于错误造成的，则修正它；如果异常值超出目标总体范围，则将其剔除。如果异常值远超其余数据的范围（例如，小数点位错置），它可能会对我们计划采用的一些数据挖掘过程（如聚类中的欧氏距离）产生显著影响。处理异常值的其他方法包括数据变换、使用抗异常值工具（如用中位数代替均值）等。所有这些决策都应由对相关应用领域具有专业知识的领域专家做出。


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig12_HTML.png)


    该流程表示异常值的过滤。这些阶段包括：在线检索问题、选择属性、检测异常值、过滤示例以及写入CSV。


    **图2-11** 过滤异常值的流程


    1.  我们通过处理异常值来继续我们的实践示例。创建一个新流程，并使用本示例步骤2中解释的过程，导入缺失值清洗后得到的数据（`OnlineQuestionAfterMissing.csv`）。在处理异常值之前查看数据时，你可以在设计视图中仅使用该数据运行流程。要通过过滤行来处理异常值，请使用图[2-11](#532459_1_En_2_Chapter.xhtml#Fig12)中的流程；点击`Select
    Attributes`运算符；对于`attribute filter type`，点击`subset`并选择所有属性，以便流程的输出将包含存储的完整数据。请注意，有时你可能希望在应用`detect
    outliers`运算符之前进行归一化，尤其是在使用欧氏距离时。对于`Detect Outliers`运算符，请注意在参数中，邻居数默认设置为`10`。你可能希望根据你对运算符工作原理的理解来更改此值。与RapidMiner中所有其他运算符一样，有必要阅读所有运算符的帮助文档，以了解如何针对你特定的任务最大限度地利用它。`Filter
    Examples`运算符根据你对其编程的方式，选择保留数据的哪些行以及移除哪些行。你可以设置`filters`参数，即`outlier` > 等于 `false`；如果这样做，你将观察到，尽管我们预期只移除一行，但更多行被移除了。处理此问题更有效的方法是通过修正而不是删除行来处理异常值。最后，`Write
    CSV`运算符用于将结果数据保存到名为`OnlineQuestionAfterOutlier.csv`的CSV文件中。


    ![](images/532459_1_En_2_Chapter/532459_1_En_2_Fig13_HTML.png)


    截图展示了具有三个选择选项卡的创建过滤器选项卡。


    **图2-12a** 修正异常值


    1.  不是像步骤9那样移除整行，你可以根据特定属性过滤结果。为此，你首先需要通过可视化检测异常值的数量。例如，在这种情况下，我们已经能够检测到有一个异常值，并且我们注意到该值在属性`age`上大于等于`300`。根据此信息处理异常值时，你可以使用与图[2-11](#532459_1_En_2_Chapter.xhtml#Fig12)相同的流程，然后对`filter
    examples`运算符进行设置，如图[2-12a](#532459_1_En_2_Chapter.xhtml#Fig13)所示。


    # 归一化与分类变量


    归一化用于将属性数据缩放到指定范围内。这是一种组织数据的方法，使所有记录和字段中的数据看起来相似。我们进行归一化，是为了在建模或分析过程中，属性不会相互占据不当优势。某些算法需要归一化，例如神经网络；此外，一些聚类算法也需要数据归一化。归一化有几种类型：最小-最大归一化、z-score归一化等。最小-最大归一化是最常见的归一化数据方法之一。对于每个特征，该特征的最小值被转换为`0`，最大值被转换为`1`，而其他所有值都被转换为介于`0`和`1`之间的小数。'
