    ## 7.7 逻辑回归


    逻辑回归基于一个将预测变量与结果联系起来的模型。可以使用少量数据来训练逻辑回归分类器，然后将其应用于大量新记录。当结果变量`Y`是分类变量时，逻辑回归扩展了线性回归的概念。


    根据其预测变量的值，逻辑回归可用于将类别未知的新记录分类到某个类别中（称为分类）。它还可用于发现区分不同类别中记录的特征（基于其预测变量轮廓或已知类别的数据中的预测变量），这称为特征分析（profiling）。


    当我们需要对客户进行分类（如回头客或非回头客）（分类）、寻找区分客户的特征（特征分析）等时，我们使用逻辑回归。我们可以使用逻辑回归来计算新记录落入某个类别的倾向，然后按倾向从高到低对记录进行排序，以便我们将精力集中在那些倾向最高的记录上。


    预测变量`x[1], x[2],......x[p]`可以是分类变量、连续变量，或两者的组合。


    **逻辑回归的步骤**


    1.  计算属于每个类别的倾向。

    2.  使用倾向的截断值将每条记录分类到其中一个类别。该记录被分配到具有最高概率的类别。


    与`KNN`一样，二分类器中的默认截断值为 0.5。


    **逻辑回归模型**


    根据公式 6.7 中的线性回归方程，我们可以将`p`表示为预测变量`(x[1], x[2]……x[p])`的线性函数：


    ![$$ Y={\beta}_0+{\beta}_1{X}_1+{\beta}_2{X}_2+{\beta}_3{X}_3+\dots \dots \dots
    +{\beta}_p{X}_p $$](img/532459_1_En_7_Chapter_TeX_Equ8.png)


    (公式 7.8)


    相反，逻辑回归使用预测变量的非线性函数，形式为：


    ![$$ p=\frac{1}{1+{e}^{-\left({\beta}_0+{\beta}_1{x}_1+{\beta}_2{\beta x}_2+\dots
    +{\beta}_q{\beta x}_q\right)}} $$](img/532459_1_En_7_Chapter_TeX_Equ9.png)


    (公式 7.9)


    这就是所谓的逻辑响应函数。对于任何值`x[1]...x[q]`，右侧的结果将始终落在[0；1]之间。


    **优势比（Odds）** 是衡量属于特定类别的指标。属于类别 1 的概率与属于类别 0 的概率之比，被定义为属于类别 1 的优势比。我们也可以进行反向计算。如果我们知道优势比，就可以使用公式
    7.9 计算事件的概率。如果我们反向计算概率，会得到以下结果：


    ![$$ Odds\left(Y=1\right)=\frac{p}{1-p} $$](img/532459_1_En_7_Chapter_TeX_Equ10.png)


    (公式 7.10)


    例如，如果获胜的概率为 0.5，则获胜的优势比为 0.5 / 0.5 = 1，即属于类别 1 的概率除以属于类别 0 的概率。我们可以执行反向计算；如果我们知道优势比，可以通过修改公式
    7.10 来计算事件的概率。由此得到公式 7.11。


    ![$$ p=\frac{odds}{1+ odds} $$](img/532459_1_En_7_Chapter_TeX_Equ11.png)


    (公式 7.11)


    我们可以通过将公式 7.9 代入公式 7.11 来描述优势比与预测变量之间的关系，例如：


    ![$$ Odds\left(Y=1\right)={e}^{\beta_0+{\beta}_1{x}_1+{\beta}_2{x}_2+\dots +{\beta}_q{x}_q}
    $$](img/532459_1_En_7_Chapter_TeX_Equ12.png)


    (公式 7.12)


    现在，我们可以通过在等式两边取自然对数²，推导出逻辑模型的标准形式。

    '
- fmt: '![`\mathit{\log}(odds)={\beta}_0+{\beta}_1{X}_1+{\beta}_2{X}_2+{\beta}_3{X}_3+\dots
    \dots \dots +{\beta}_p{X}_p`](images/532459_1_En_7_Chapter/532459_1_En_7_Chapter_TeX_Equ13.png)


    (`Eq. 7.13`)


    For more information, visit Galit et al. (2018), Chapter [10](#532459_1_En_10_Chapter.xhtml).


    ## Classification example using logistic regression


    The dataset used for this example is named `UniversalBank.xlsx`. It consists of
    data on 5000 customers. The data include the customer’s response to the last personal
    loan campaign (`personal loan`), as well as customer demographic information (`age`,
    `income`, etc.) and the customer’s relationship with the bank (`mortgage`, `securities
    account`, etc.). The details are as follows:


    | • Age | *Customer’s age in completed years* |

    | • Experience | *Number of years of professional experience* |

    | • Income | *Annual income of the customer ($000s)* |

    | • Family | *Family size of the customer* |

    | • CCAvg | *Average spending on credit cards per month ($000s)* |

    | • Education | *Education level. 1: Undergrad; 2: Graduate; 3: Advanced/Professional*
    |

    | • Mortgage | *Value of house mortgage if any ($000s)* |

    | • Securities Account | *Coded as 1 if customer has securities account with bank*
    |

    | • CD Account | *Coded as 1 if customer has certificate of deposit (CD) account
    with bank* |

    | • Online Banking | *Coded as 1 if customer uses Internet banking facilities*
    |

    | • Credit Card | *Coded as 1 if customer uses credit card issued by Universal
    Bank* |


    Among these 5000 customers, only 480 (= 9.6%) accepted the personal loan offered
    to them in a previous campaign. The goal is to build a model that identifies customers
    who are most likely to accept the loan offer in future mailings.


    The bank application scenario is just a selected example; other application scenarios
    is in a sales campaign for example, where the goal is to build a model that identifies
    customers who are most likely to make a purchase. In a service campaign, that
    is, a business that offers one form of service or another to clients, the goal
    is to build a model that identifies clients who will take the service offer in
    future proposals or marketing.


    The outcome variable is `personal loan`, with *yes* defined as the *success* (this
    is equivalent to setting the outcome variable to 1 for an acceptor and 0 for a
    non-acceptor).


    Some data preprocessing necessary for solving this problem is to convert the attribute
    *Education* to polynomial first and then to dummy later and remove one of the
    dummies. The target attribute *Personal loan* will be converted to binomial. After
    this, the data should be visualized for classification and use the correlation
    matrix to discover correlated attributes (this will be skipped in this practical
    demonstration as it is captured in exercise 4 of this chapter). Also, as in linear
    regression, in logistic regression we can use automated variable selection heuristics
    such as stepwise selection, forward selection, and backward elimination (more
    explanations in ^(4,5,6)).


