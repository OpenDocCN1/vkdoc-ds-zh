  \ 界面\n\n## 1.9 问题\n\n1.  为以下业务场景设计一个概念性商业模式：\n    1.  一家小企业打算利用其当前培训参与者的信息来构建一个模型，以预测未来谁会来参加培训。此预测结果将用于目标营销。\n\
  \    2.  Hadetulah 眼科诊所是一家小型企业，总共约有 20 名员工，在尼日利亚设有约五家分店。他们提供多种与眼科治疗相关的服务，从诊断到眼科治疗设备的销售。尽管他们没有运行核心的企业应用程序，但他们以\
  \ Excel 表格的形式捕获财务运营数据，存储诊断结果、转诊医院信息、设备详细信息、租赁或销售信息以及发票。他们的目标是吸引更多客户。\n\n2.  假设您参与了一个旨在提高某航空企业运营效率的分析项目。您的任务是了解该业务的运作方式。为此，您需要提出一个概念模型，详细解释该业务领域中的要素以及它们之间的相互关系。\n\
  \n3.  为一家面条零售小企业创建一个概念性商业模式。该公司打算对其现有客户进行细分，以便能够描述他们，从而实现有效的客户关系管理。\n\n"
- "# 2. 小企业分析数据\n\n在本章中，我们将探讨一般企业及小企业中的各种数据来源。这一点很重要，因为为小企业提供咨询的主要挑战在于缺乏数据或缺乏用于分析的高质量数据。因此，本章将详细阐述用于分析的数据来源，首先解释数据存在的类型或形式，以及如何收集此类数据的一些通用思路。本章概述了数据质量和完整性问题，并涉及数据素养。此外，我们将解释数据分析技术的典型数据准备流程。最后，我们将探讨数据可视化，特别侧重于为第\
  \ 1.3 节中所述的各种分析任务准备数据。\n\n## 2.1 数据来源\n\n数据可以以不同形式检索；最基本的数据类别是结构化数据、半结构化数据和非结构化数据。¹\n\
  \n*结构化数据*：此类数据具有预定义的顺序，并在存储之前被格式化为特定结构。这种结构被称为写时模式。一个很好的例子是存储在关系数据库管理系统中的数据。\n\n\
  *非结构化数据*：这是指数据以其原始格式存储，直到使用时才进行处理，这称为读时模式。它没有固定的形式或顺序。它可以以多种文件格式存储；例如电子邮件、社交媒体帖子、演示文稿、聊天记录、物联网传感器数据和卫星图像。\n\
  \n*半结构化数据*：这种形式的数据包含概述数据特定特征的元数据³，使其能够比非结构化数据更高效地被操作。以 `XML` 格式存储的数据就是此类数据的一个例子。\n\
  \n在业务中，捕获数据的系统类型包括以下内容：\n\n*   核心企业系统\n*   客户与人员系统\n*   产品与存在系统\n*   技术运营系统\n* \
  \  外部来源系统\n\n需要注意，有时这些系统的功能会重叠，在某些情况下具体表现如下所述。\n\n*核心企业系统*：这些系统包括帮助管理企业财务运营的系统。它们用于计费和开票、企业资源规划、供应链管理、采购和销售活动、监控生产活动等等。与其他类别相比，它们拥有庞大的数据量，并且通常是在运行的应用中创建、保存和维护的。\n\
  \n*客户与人员系统*：这些系统包括客户服务、营销自动化、活动管理、人力资源系统以及客户关系管理（`CRM`）系统。\n\n*产品与存在系统*：它们有助于存储关于产品管理的信息。这包括产品管理、内容管理、Web\
  \ 管理和分析。人们在电子商务中进行的许多操作都可以被极其细致地测量。这些包括客户评论、网络日志数据、鼠标点击轨迹、全球定位卫星（`GPS`）数据等。\n\n\
  *技术运营系统*：它们非常具有策略性，有助于监控其他系统的流程，确保其正常运行。它们包括流程监控、告警和故障监控、工单和工作流管理、远程信息处理以及机器数据处理。\n\
  \n*外部来源系统*：这些系统包括在组织外部收集但对分析过程相关的数据。它们包括人口统计和细分数据、来自合作伙伴、供应商和政府机构的数据。\n\n为了提取这些数据进行分析，或将其准备用于次要分析存储（如数据仓库），有多种语言可用，包括但不限于\
  \ `SQL`、`Python` 等。有时，当数据无法直接提取时，我们可能需要使用主动数据收集方法或被动数据收集方法来收集数据。\n\n*主动数据收集*：当数据直接从用户处收集时发生，例如，用户在完成在线零售交易时故意分享个人数据。在收集此类数据时，通常需要包含对所收集数据的某些披露声明。主动数据也可以通过在线或离线调查来收集，并且需要遵循特定程序²来实施以实现特定目标。在线平台包括\
  \ `Google Forms`、`SurveyMonkey` 等。\n\n\n\n## 被动数据收集\n\n*被动数据收集*：当目标对象不参与数据收集时发生。它通过扫描仪或媒体（如广播、电视和社交媒体）收集。其他被动收集数据的方式包括网络和移动平台。网络数据提供了大量关于客户正在查看什么的信息，无论在你的网站还是竞争对手的网站上。例如，对于电子商务网站，我们可以收集客户评论、网络交易数据、客户人口统计数据以及网络日志数据。帮助收集网络数据的公司例子是`Comscore`（[`www.comscore.com/`](http://www.comscore.com/)）。这些公司可以帮助收集数据，从而洞察特定公司在社交媒体上的趋势，了解该公司竞争对手网站上正在发生什么等等。\n\
  \n## 真实商业案例 I\n\n*为小型企业提供咨询需要创造性地从来源分析数据；例如，一个组织不同主题培训的小型企业，旨在利用其当前培训参与者的信息来构建模型，预测哪些潜在客户未来会对培训感兴趣。他们打算向被预测感兴趣的潜在客户推介新的培训包。由于是小型企业，执行此任务的预算极少，因此他们需要知道如何用可用资源精确地瞄准哪些潜在客户。为了获取此任务的外部数据，数据分析师不得不在`Facebook`上投放定向广告，并附上一个`Google\
  \ Form`链接，用于收集感兴趣潜在客户的详细信息。这是一种创造性地获取外部数据的方式。*\n\n## 真实商业案例 II\n\n*`Hadetulah`眼科诊所是一家小型企业，总共约\
  \ 20 名员工，在尼日利亚约有五个分支机构。他们提供与眼部治疗相关的多项服务；从诊断到眼科治疗设备的销售。尽管他们没有运行核心的企业应用程序，但他们以 Excel\
  \ 表格的形式捕获财务运营数据。他们还存储关于转诊医院、设备详情、租赁或销售信息以及发票的信息。对于`Hadetulah`，客户和人员系统以 Excel 表格形式捕获，包括客户姓名、电话、年龄、性别、职业、地址等信息。他们还能够捕获诸如在镜片类型上的花费、为客户服务的员工等信息。*\
  \ *图* **2-1** *展示了`Hadetulah`光学公司特征表示示例的示意图。从此图中，我们可以看到客户的图片以及表示客户的特征或属性。该图进一步给出了每个属性可能具有的值的示例，并说明了这（不同客户的历史特征集合）将如何作为预测算法的输入，其中属性`amount`是标签。开发模型后，我们现在可以将其用于预测新客户。*\n\
  \n![](img/532459_1_En_2_Fig1_HTML.png)\n\n图示展示了一张客户图片，其旁边列出了各种特征，即：`amount`、`age`、`type\
  \ of eye defect`、`type of frame`、`location`、`height`和`weight`。通过预测金额生成一个学习模型。\n\n\
  **图 2-1**\n`Hadetulah`光学的特征表示\n\n## 数据隐私\n\n作为数据分析师，非常重要的是要熟悉数据隐私指南，无知不能成为借口，即使是在数据隐私问题上。为此，已有相关标准来帮助执行数据隐私。专业或商业组织会建立某些道德标准，以制定一套不具有法律约束力的信息处理程序。为了强制执行对某些数据集的特定处理，法律秩序已确立了法律标准。公司或机构也可以建立自己的政策指南或标准。此外，还有良好的判断标准，它指出，即使某事在技术上符合更正式的规则，也应不断思考：“这是一个好主意吗？”以及“可能的后果是什么？”\n\
  \n以下是需要遵循的隐私指南：\n\n- 避免使用完整姓名、婚前姓、母亲娘家姓或昵称。\n- 不要包含个人识别号码、国家身份号码、护照号码、驾驶执照、纳税人识别号码或金融账户/信用卡号码。\n\
  - 不要包含地址详情，例如居住地址或电子邮件地址。\n- 应避免使用个人信息，如图片（特别是面部或其他可识别特征）、指纹、笔迹或其他生物识别数据（例如，视网膜扫描、语音签名、面部几何形状）。\n\
  - 不要包含与前述信息相关联或可关联的个人信息（例如，出生证明、出生地、种族、宗教、体重、活动、地理标识、就业信息、健康记录、学术信息、财务详细信息）。\n\n\
  有必要了解你所在国家适用的数据政策；例如，在尼日利亚，我们有**尼日利亚数据隐私法规**。⁴\n\n\n\n## 2.2 数据质量与完整性\n\n在计算机领域，常有人说“垃圾进，垃圾出”，即处理后的信息质量不可能优于被处理信息的质量。这一原则在数据分析中同样适用。数据质量指的是数据能够用于其预期目的的程度，以及数据准确反映现实世界的程度。我们需要衡量用于分析的数据质量，这可以通过检查数据是否符合以下标准来实现：\n\
  \n- **完整性**：用于检查我们是否拥有应该拥有的全部信息。我们需要回答诸如：“所有事件都被捕获了吗？”“是否考虑了所有参考数据值？”\n- **唯一性**：检查单个事件是否只被记录一次。\n\
  - **准确性**：判断数据是否真实地代表了其试图传达的概念。确保数值和字符串值正确，以及时间戳和其他属性正确，是其中的一部分工作。\n- **一致性**：检查一致性时，我们想要确保数据格式符合预期。需要确保相同的数据每次都以相同的方式被捕获。\n\
  - **合规性/有效性**：数据库中的数据是否符合语法、编码或其他模型要求？数据格式是否正确？代码是否符合预期？是否遵守了命名规范？\n- **及时性**：这里，我们想知道数据是否在需要时可用。这也被称为“数据延迟”。\n\
  - **来源**：这里，我们想知道能否追溯数据的来源。以及我们对数据真实性和准确性的信心有多大？\n\n根据 2017 年 Kaggle⁵在数据科学竞赛社区对\
  \ 7376 名受访者进行的一项调查，当要求他们评价工作中遇到的障碍时，发现排名最高的障碍是“脏数据”问题，占受访者总数的 49.4%。\n\n在中小企业环境中，**脏数据问题**尤为常见。这些情况是指数据充满错误，例如拼写错误、笔误和重复数据。这些问题在识别后可以系统地修复。还有一些情况是数据违反了业务规则；要解决这个问题，可能需要组织内跨部门的协同努力。还有些情况是数据收集方法不当或针对错误的人群收集。这类数据通常源于提出了错误的业务问题；所有这些都可以通过在业务初期建立适当的数据治理程序来克服，或者在发现问题后采取纠正措施。目前，已有算法可用于分析数据中的重复项和其他错误。这里需要强调的是，预防胜于治疗，也就是说，改进数据收集程序、优化表单和记录，并采用更多标准化字段是更可取的方法。此外，要确保数据的来源和历史可见且透明，以便追溯每一个错误。总之，你的数据的完整性、有效性和一致性取决于所使用的各种方法，而每个企业都将根据自身特定需求来开发和定制这些方法。\n\
  \n## 2.3 数据治理\n\n数据治理简单定义为：为确保数据可用、可用、安全且具有完整性而实施的流程。过去，只有大型企业关注数据治理，但由于小企业也开始基于数据做出决策，它们也正在拥抱数据治理。数据治理流程建立在保障数据安全并确保其处理符合所有适用外部法律法规的规则集合之上。数据管理员负责制定和强制执行这些统一的标准和规定。对于小企业而言，实施数据治理可以从以下三个方向入手。首先，指派一个人（如果预算允许，可以指派多人）负责数据治理任务。一个好的经验法则是，一旦你的团队拥有一位全职分析师，就该明确由他负责数据治理。⁹\
  \ 其次，负责人制定一份名为数据**藏宝图**的文档，其中包含数据来源列表（例如，市场、财务、销售 CRM 等）和数据去向列表（例如，数据仓库（如有）或商业智能可视化工具）。（请注意，小企业也指一人企业，因此这第二阶段可能不是以软件应用程序的形式存在，而是体现为手动将数据从`Excel`复制到`Tableau`。）第三件事是记录谁在使用你的数据。最后，需要教育所有员工了解所开发的数据治理模型的重要性，及其注意事项。关于小企业数据治理的更多资源，请参考\
  \ Nwabude, Begg, 和 McRobbie (2014).^(6,7) 关于可帮助小企业进行数据治理的工具，请参考 Nwabude(2014) 等人的作品^(8,10)。\n\
  \n## 2.4 数据准备\n\n在检索到分析所需的必要数据后，首先要做的是清理数据。这是必要的，因为基于有缺陷的数据进行分析可能会产生误导，并且使用未经清洗的数据进行分析可能会带来严重的经济后果。过去，许多大型组织因此损失了大量收入，一个著名的例子是摩根大通的交易亏损。¹¹\n\
  \n首先，让我们为变量类型打下一些基础，以便我们理解数据准备流程。获得的数据以变量的形式存在。分类变量具有固定的取值范围，可以是无序的（称为名义变量），其类别如：北美、欧洲和亚洲；或者可以是有序的（称为序数变量），其类别如：高价值和低价值。数值变量是无止境的。它们是连续的（能够在给定范围内取任何实数数值）。数值变量可以是整数，即仅取整数值。另一种变量是日期，根据所使用的分析平台，我们还有其他的变量类型。\n\
  \n在清洗数据时，我们检查数据是否存在格式错误、尾随空格、重复项、空行、同义词和缩写。在清洗数据时，你会问诸如此类的问题：*字符变量是否有有效值？数值是否在范围内？是否存在重复的值/行？某些变量的值是否是唯一的？日期是否有效？数据集是否包含你希望预测的属性？如果包含，则无需进行预测。是否存在缺失值？描述中是否存在不一致之处？*\n\
  \n在准备和检查你想要使用的数据时，可以使用汇总统计来发现数据中所有变量，了解变量的特征和变量中值的范围，并为分析筛选变量。均值、中位数、标准差、最小值、最大值等都是汇总统计的示例。最小值和最大值可用于检测可能是错误的极值。均值和中位数可以揭示该变量的中心值概念，两者之间的较大偏差也表明存在偏斜。标准差则体现了数据（相对于均值）的分散程度。\n\
