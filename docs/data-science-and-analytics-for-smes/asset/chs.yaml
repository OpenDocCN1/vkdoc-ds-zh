  \ 6-18**  \n结果数据集\n\n1. 加载的新数据的预测价格如图 6-18 所示。\n\n\n\n## 神经网络（预测）\n\n神经网络是一种通用的数据驱动方法，可用于分类和预测。在可解释性方面，它被称为“黑箱”。神经网络运用了节点和层的原理，以及它们如何连接形成网络结构。神经网络之所以能展现其预测性能，是因为它能捕捉预测变量与目标变量之间非常复杂的关系。它对噪声数据有相当好的容忍度。尽管有这些优势，但神经网络缺乏内置的变量选择机制，并且其适应性在很大程度上依赖于拥有足够的数据进行训练。使用神经网络时，务必警惕那些会导致局部最优而非全局最优的权重。在数据挖掘中，多层前馈网络是神经网络最成功的应用之一。⁴\n\
  \n### 多层前馈网络\n\n前馈网络是一种完全连接、无环路且单向流动的网络。它由三层组成：一个包含接收预测变量值的节点的输入层、一个接收前一层输入的节点层，以及一个输出节点层。每一层节点的输出都会馈送到下一层节点（见图\
  \ 6-19）。\n\n![](img/532459_1_En_6_Fig25_HTML.png)\n\n一个多层前馈网络包含三层：输入层、隐藏层和输出层。每一层都与下一层相连。\n\
  \n**图 6-19** 多层前馈网络，Galit 等人 (2018)，第 274 页\n\n图 6-19 展示了一种架构设计，包含两个预测变量、两个隐藏层以及输出层中反映预期结果值的两个节点。\n\
  \n当我们使用神经网络预测数值型结果时，需要将预测值转换回其原始单位；这是因为，为了进行预测，预测变量（数值型）和结果变量都会被归一化（重新缩放至 `[0,1]`\
  \ 区间）。\n\n在使用神经网络时，我们必须做出以下决策：\n\n-   **网络架构**：这可以通过对各种架构进行试错运行或使用算法来实现。\n-   **预测变量的选择**：根据软件的不同，需要选择学习率和动量。学习率的范围是\
  \ 0 到 1，主要用于避免过拟合。在权重收敛到尽可能最佳位置的过程中，采用动量来保持调整方向。\n-   **隐藏层数量**：通常设置为一个（尽管我们总是可以尝试其他数量），因为单个隐藏层通常足以捕捉预测变量之间哪怕是最复杂的交互作用。\n\
  -   **隐藏层的大小**：网络捕捉到的预测变量之间关系的复杂程度，由隐藏层中的节点数量决定。一个好的经验法则是从 `p`（预测变量的数量）个节点开始，然后逐步减少或增加，同时测试是否过拟合。\n\
  -   **输出数量**：对于具有 `m` 个类别的分类结果，输出节点数应为 `m` 或 `m-1`。对于数值型结果，通常只用一个输出节点。\n\n此外，为避免神经网络过拟合，应限制训练迭代次数，并且不应过度训练数据。我们通过观察验证集或交叉验证集上的性能来确定何时开始下降，而同时训练集性能仍在提升，以此发现过拟合。\n\
  \n### 神经网络的数据预处理\n\n当预测变量和结果变量处于 `[0,1]` 尺度时，神经网络的性能最佳。对于取值区间为 `[a; b]` 的数值变量 `X`，我们通过将\
  \ `X` 减去 `a` 并除以 `b - a` 来进行归一化。归一化后的度量值为：\n\n![$$ {X}_{norm}=\\frac{X-a}{b-a} $$](img/532459_1_En_6_Chapter_TeX_Equ9.png)\n\
  \n（公式 6.9）\n\n可以使用数据中 `X` 的最小值和最大值来估计 `a` 和 `b`。除了创建哑变量之外，二元变量无需进行调整。如果具有 `m` 个类别的分类变量是有序的，则选择\
  \ `[0,1]` 区间内的 `m` 个分数来表示其感知顺序。如果这些类别是无序的，则将它们创建为 `m-1` 个哑变量。请注意，为了获得更好的预测性能，对高度偏斜的预测变量进行变换也很重要。这种情况在商业分析领域的变量（如收入）中很常见。因此，建议先对此类变量取\
  \ `log`，然后再缩放到 `[0,1]` 区间。\n\n### 神经网络——评估性能（数值结果）\n\n回归树的预测性能可以通过与其他预测方法（例如线性回归和回归树）相同的方式来检验，即使用像\
  \ `RMSE` 这样的汇总度量。\n\n### 销售预测问题——神经网络\n\n使用第 6.2 节中介绍的销售预测问题，以下演示了如何使用神经网络解决该问题：\n\
  \n![](img/532459_1_En_6_Fig26_HTML.png)\n\n一个流程截图显示了七个步骤：检索丰田数据、标称型转数值型、设置角色、分割数据、神经网络、应用模型和性能。右侧是一个参数选项卡。\n\
