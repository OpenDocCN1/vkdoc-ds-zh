- "# 8. 高级描述性分析\n\n本章主要关注高级描述性分析技术。在本章中，我们将首先解释聚类（一种无监督学习方法）的概念。然后我们将介绍一种聚类技术，即`k-means`聚类。通过第四个实际商业问题，我们将解释如何使用`k-means`聚类技术来解决一个真实的商业问题。接下来，我们将解释关联规则的示例，最后是网络分析。我们将重点解释这些技术如何用于解决商业相关问题，特别是针对小企业，并以第五个商业问题结束，该问题侧重于使用网络分析来提升员工效率。\n\
  \n\n\n## 8.1 聚类分析\n\n聚类是一种无监督机器学习方法，旨在将数据划分为相似的记录组以获取洞察。聚类分析通过计算记录间的距离来形成记录簇。聚类在商业²中有多种应用方式，包括根据人口统计和交易历史信息对客户进行分类，然后为每个类别制定营销计划。它还可用于创建客户细分，并赋予其称为\"\
  用户画像\"的身份标识，从而帮助集中销售精力。此外，在市场竞争结构分析中，它可用于基于竞争相似性度量寻找同类产品群。\n\n目前有两种主流的聚类方法：⁴\n\n\
  1. **层次方法**：涉及将簇排列成自然层级结构，这类方法极具实用性。这些方法本质上可分为凝聚式或分裂式。\n\n2. **非层次方法**：`k-means`算法是此类技术的代表。`K`表示算法根据预设的簇数量将记录分配到各簇中。由于其计算成本较低，因此更适合大数据处理。³\n\
  \n无论采用层次还是非层次聚类方法，都必须定义两种距离：记录间的距离以及数据集中两个簇之间的距离。此外，这两种方法均可采用一系列度量指标来计算这些距离。\n\n\
  在测量两个记录之间的距离时，需谨记以下几点：\n\n- 距离值不得为负。\n- 记录与自身距离应为零（0）。\n- 记录`i`与`j`之间的距离必须等于记录`j`与`i`之间的距离。\n\
  - 任意两记录间的距离不得超过另外两对距离之和。\n\n用于测量两个数值型记录之间距离的度量包括：\n\n- **欧几里得距离**：该度量要求在计算前对连续测量值进行标准化处理。若测量值高度相关，则建议使用其他距离度量（如统计距离）。异常值会导致欧几里得距离产生偏差。对于欧几里得距离，要么剔除异常值，要么使用更稳健的距离度量如曼哈顿距离。\n\
  - **基于相关性的相似度**。\n- **统计距离**，也称马氏距离。\n- **曼哈顿距离**（\"城市街区距离\"）。\n- **最大坐标距离**。\n\n\
  关于上述距离的更多信息，可参考 Han 等 (2012) 的文献。\n\n对于包含二元分类数据的记录，相似度度量在直观上比距离度量更具吸引力。在此情况下，匹配系数和杰卡德系数是最有用的相似度度量。对于包含分类数据和混合数据（部分连续、部分二元）的记录间距离测量，Gower\
  \ 提出的相似度系数非常实用。⁵\n\n在测量两个簇之间的距离时，以下定义至关重要：\n\n- **最小距离**：两个簇中最接近的一对记录（每个簇中取一个记录）之间的距离。\n\
  - **最大距离**：两个簇中相距最远的两个记录之间的距离。\n- **平均距离**：任意两个记录之间的平均距离。\n- **质心距离**：质心链接聚类基于质心距离，其中各组由其各变量的均值表示，形成均值向量。这两个向量之间的距离决定了两个簇之间的距离。\n\
  \n理想的簇之间应具有良好分离度；分离度越高，得到的组内均质性越强，因此这些距离度量有助于清晰观察这种分离状态。\n\n![](img/532459_1_En_8_Fig1_HTML.png)\n\
  \n二维空间中两个良好分离簇的示意图。图中标注了它们之间的最小距离、最大距离和质心距离。\n\n**图 8-1**  \n两个簇之间多种距离度量的二维示意图：(a)\
  \ 最小距离，(b) 质心距离，(c) 最大距离\n\n\n## 8.2 K-Means\n\n`k-means`算法将样本划分为预先定义的`k`个分离良好（无重叠）的簇，目的是使这些簇在采用的度量标准（例如，图\
  \ 8-1）上具有相似性。记录与其簇质心之间的总距离（或欧几里得距离平方和）是衡量簇内离散度的常用指标。`k-means`算法如图 8-2 所示。\n\n![](img/532459_1_En_8_Fig2_HTML.png)\n\
  \n一张包含四个步骤的`K-means`算法示意图，用于创建用户指定数量的簇。\n\n图 8-2\n`K-means`聚类算法\n\n**如何确定 k**\n\n\
  ![](img/532459_1_En_8_Fig3_HTML.png)\n\n三个图表展示了如何使用肘部法、轮廓系数法和间隙统计法来确定样本中的最佳簇数。\n\
  \n图 8-3\n比较三种直接确定最佳 k 值方法的结果\n\n1.  `K`可以通过外部因素确定，例如先验知识、领域知识以及业务环境中呈现的一些约束条件。\n\
  2.  你可以尝试不同的`k`值并比较得到的距离。簇内成员间的距离要小，而不同簇之间的距离要大。\n3.  也可以通过直接方法确定`k`，这些方法优化某个准则，例如簇内平方和或平均轮廓系数。这些方法包括*间隙统计*法；此外还有超过\
  \ 30 种其他指标。图 8-3 演示了使用其中三种方法，之后我们进行投票。基于图 8-3，答案介于 4（肘部法）和 2（轮廓系数法）之间；为了做出决定，你必须尝试其他几种指标，获得最高投票数的簇数获胜。\n\
  \n**验证簇**\n\n找到有意义的簇是聚类分析的一个关键目标。以下步骤可以帮助你实现这一目标：\n\n1.  *簇的可解释性*：得到的簇的解释是否合理？探究每个簇的属性以解释这些簇。你可以通过以下方式做到这一点：\n\
  \    1.  分析聚类分析的结果，为每个簇的度量得出汇总统计量（例如平均值、最小值和最大值）。\n    2.  检查簇是否沿着某个从聚类分析中省略的共同特征（变量）分离。\n\
  \    3.  给簇打标签。在此步骤中，我们将根据对数据的理解为不同的簇命名和标记。\n2.  *簇的稳定性*：如果某些输入发生变化，簇的分配是否会受到很大影响？\n\
  3.  *簇的分离度*：通过检查簇间变异与簇内变异的比率来确定分离是否合理。这正是我们需要簇间距离的地方。内部有效性度量关注的是簇中包含的信息以及数据点相对于这些簇的排列方式。为了获得良好的聚类效果，一个簇中的所有点彼此靠近是很重要的。同时，簇之间彼此分离、区别明显也很重要。内部有效性所使用的度量包括：\n\
  \    *   平均质心内距离\n    *   簇的密度\n    *   基于平方和的项分布\n    *   Davies-Bouldin 指数\n4.\
  \  *簇的数量*：生成的簇的数量必须与分析目标相关。此处使用外部有效性度量将聚类算法创建的簇与先前已知的簇进行比较。要在现实场景中做到这一点，模型开发和测试需要专家的输入，他们将提供簇。用于外部有效性的度量包括：\n\
  \    *   Rand 指数⁷\n    *   调整后的 Rand 指数⁶\n    *   Jaccard 指数⁸\n    *   Fowlkes-Mallows\
  \ 指数⁸\n5.  此外还有基于密度的方法（例如，相似性度量）。\n\n更多关于簇的内容，请查阅 Han 等人 (2012) 的著作。\n\n**解释簇**\n\
  \n*   我们查看簇质心以确定所生成簇的特征。\n*   此外，我们可以查看哪些变量最有效地区分这些簇。\n*   我们还可以研究关于簇内离散度的信息。\n\
  *   使用簇质心之间的欧几里得距离，我们可以确定各个簇相隔多远。\n\n**为目标营销目的解释簇**\n\n一旦我们对众多客户形象有了清晰的了解，我们就可以针对每个形象的独特偏好定制我们的营销互动，即将新发现的客户形象与最适合每个形象的营销互动联系起来。这些互动应该量身定制，以满足每个特定形象的独特需求、愿望和偏好。\n\
  \n\n\n## 8.3 实际商业问题 IV（客户细分）\n\n本实际商业问题的案例研究对象是一家面条零售小企业。`NoodleRetail.xlsx` 是一家面条零售公司的数据，该公司计划对现有客户进行细分，以便能够对其进行描述。目标是细分并描述现有客户，即识别出具有相似特征的客户群，以便未来针对不同细分群体提供不同类型的优惠。为此，聚类过程需要生成的各个细分群体在内部尽可能同质，而在群体间则尽可能异质。\n\
  \n**使用 k-means 进行客户细分**\n\n细分过程遵循以下步骤：\n\n1.  *数据预处理*：由于 `k-means` 无法处理缺失值，我们将首先处理可能存在的缺失值。如果缺失值很少，可以将其排除；如果缺失值很多，则必须进行插补。接着，我们将进行数据可视化以发现异常值。我们将把类别型数据转换为数值型数据（因为\
  \ `k-means` 使用距离函数，无法直接处理类别型变量）。如果类别型变量是有序的，我们将用等差数列替换；如果是名义型的，则转换为二进制。之后，我们将对数据进行归一化处理，并应用适当的降维技术。降维非常重要，因为一旦维度超过几十个，距离的解释就不那么直观了，必须避免这种情况。对于本例，我们参考第\
  \ 2.5 节作为无监督学习数据预处理的指南。\n\n2.  确定 `k` 值。有多种方法可以做到这一点（如前所述），但在此任务中，我们将作为领域专家直接提供要使用的\
  \ `k` 值。\n\n3.  使用适当的距离度量（因为我们已经将所有属性转换为数值型，所以选择了数值度量）来执行 `k-means` 聚类，用于计算记录间距离。\n\
  \n4.  验证聚类。为了验证生成的聚类，我们使用*平均质心内距离*。（为了进一步检查聚类的稳定性，你可以随机删除 5% 的数据（即抽取 95% 的记录作为随机样本）并重复分析。是否得到相同的结果？）\n\
  \n5.  为了解释聚类，我们将：\n    *   比较聚类质心以描述不同聚类的特征，并尝试为每个聚类赋予一个标签。\n    *   使用数据集中的任意或所有变量为每个聚类提供一个合适的名称。\n\
  \    *   你会针对哪些聚类提供优惠？你会向该聚类中的客户提供什么类型的优惠？\n\n**数据描述**\n\n面条零售数据包含以下属性：\n\n- `Brand`\n\
  - `Country`\n- `Customer Id`\n- `Gender`\n- `Income Class`\n- `List Price`\n- `Number\
  \ of Records`\n- `Online Order`\n- `Owns Car`\n- `Product Class`\n- `Product Id`\n\
  - `Product Size`\n- `Purchases`\n- `Past 3 Years`\n- `State`\n- `Transaction Date`\n\
  - `Transaction Id`\n- `Deceased Indicator`\n- `Tenure`\n\n1. (a) *数据预处理*：创建一个存储库（`Clustering`）；在该存储库中创建两个子文件夹，分别命名为\
  \ `data` 和 `process`。将名为 `NoodleRetail.xlsx` 的数据**导入**到 `data` 子文件夹中。导入时，请确保根据所述原因排除以下属性：\n\
  \   - `Country`（所有值均相同）\n   - `Number of Records`（所有值均相同）\n   - `Customer Id`（预处理不需要）\n\
  \   - `Transaction Date`（聚类不需要）\n   - `Transaction Id`（聚类不需要）\n   - `Deceased Indicator`（所有值均相同）\n\
  \   - `Product Id`（预处理或聚类不需要）\n\n图 8-4 显示了数据的**统计信息**。\n\n![](img/532459_1_En_8_Fig4_HTML.png)\n\
  \n一家面条零售公司数据的统计信息截图，这些数据用于通过聚类来细分和描述公司客户。\n\n**图 8-4** 数据统计信息\n\n\n以下是根据您的要求，将英文文本翻译成中文的\
  \ Markdown 内容：\n\n---\n\n以下缺失值在这些统计结果中显而易见，将通过用属性的平均值替换来处理：\n\n- `Brand` – 93\n\
  - `Online order` – 170\n- `Product class` – 93\n- `Product size` – 93\n- `Tenure`\
