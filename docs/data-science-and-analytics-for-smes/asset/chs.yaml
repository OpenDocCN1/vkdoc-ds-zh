  \ 7-5 中的红色箭头所示（它们的中位数差异相当大）。在本章的练习 3 中，我们将尝试移除这些属性后的分类过程，但目前仍将它们包括在内。\n\n\n\n##\
  \ 7.3 神经网络\n\n有关神经网络算法的详细信息，请参阅 6.5 节。\n\n**基于神经网络的客户忠诚度分析**\n\n利用 7.2 节中介绍的客户忠诚度问题，下面演示如何使用神经网络来解决该问题：\n\
