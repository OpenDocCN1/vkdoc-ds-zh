  \ 7-12 中修改后的输出结果。它显示了预测新交易的结果。\n\n\n\n## 7.5 随机森林与提升树\n\n在不关心决策树规则的可视化和解释的情况下，有几种结合多棵树结果的树扩展方法可以提升性能。随机森林是一种流行的多树方法，由\
  \ Breiman 提出。⁵\n\n随机森林采用以下基本步骤：\n\n1.  从数据中抽取多个随机样本，每个样本进行不同的有放回抽样。这种抽样方法称为自举法（Bootstrap）。\n\
  2.  在每一阶段随机选择预测变量，用每个样本拟合一个分类树（或回归树）（从而产生一个\"森林\"）。\n3.  为了获得更好的预测结果，综合不同树的预测结果和分类结果。分类采用投票法，预测采用平均法。\n\
  \n`提升树`是另一种多树改进方法。它拟合了一系列树，每棵树都重点关注前一棵树中分类错误的记录。其步骤如下：\n\n1.  只使用一棵树。\n2.  创建一个样本，使其中被错误分类的记录有更高的被选中概率。\n\
  3.  用新样本创建一棵树。\n4.  重复上述步骤 1 和 2。\n5.  使用加权投票法对记录进行分类，后续的树获得更高的权重。\n\n如果在相同数据上运行提升树，其性能略优于单个剪枝树。就整体准确率而言，提升树在验证数据上表现更优，尤其是在正确分类\
  \ 1（特殊关注的稀有类别）方面。\n\n### 使用随机森林进行客户忠诚度分析\n\n![](img/532459_1_En_7_Fig17_HTML.png)\n\
