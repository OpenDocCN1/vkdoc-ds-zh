- '# 前言


  本书是从将商业分析服务作为产品提供的角度撰写的。它有助于理解如何将你的分析解决方案打包成可咨询服务的产品。其中一些产品包括客户忠诚度、市场细分、销售和收入增长等。本书特别关注小型企业及其在分析方面的特殊性。理解本书内容将有助于任何有兴趣通过应用数据分析为小型企业带来改变的人，即使是从初学者水平开始也能实现这一目标。本书采用自助式分析方法，所使用的工具均可在线轻松获取，且无需编程基础。


  本书教授为小型企业提供商业分析咨询的技巧和方法。具体而言，读者将能够创建并衡量其分析项目的成功。本书还提供了职业指南，并帮助读者快速进入商业分析咨询职业领域。本书的方法侧重于中小型企业世界中具有数据科学解决方案的常见问题，然后介绍相关技术及其使用方法。读者不仅将学习解决这些问题所使用的基本技术，还将体验如何在实际用例和问题场景中应用它们。这些技术以简单的方式教授，但本书附带了大量参考资料和资源材料，有助于读者更深入地掌握这些技术。


  本书分为四个主要部分。第一部分（第 1 章和第 2 章）解释了本书探讨的基本概念，例如数据科学、商业数据科学（商业分析），以及一般意义上和针对小型企业开展任何分析项目所需的条件。在这一部分中，我们还通过实际示例探讨了围绕数据的问题，以及如何管理和准备数据以用于分析项目。第二部分（第
  3 章和第 4 章）侧重于分析咨询，并解释了如何在数据分析咨询领域中获得成功。它还详细介绍了商业分析咨询所涉及的阶段。第三部分（第 5 章至第 8 章）专注于小型企业常用的数据挖掘技术，并以一种先简单解释这些技术的基本概念，然后使用真实的小型企业问题场景进行实际应用的方式呈现。本部分以实践为导向，基于小型企业遇到的问题案例研究。在本书中，我们将探讨五个主要的实际业务问题场景和几个小型企业问题作为说明。这些内容涵盖在第
  5 章至第 8 章中。所使用的技术展示了如何解决这些问题。这里需要说明的是，尽管使用特定问题作为案例研究，但该方法不仅适用于这种情况，还可以用于其他类似的问题场景。所选技术基于其在实践中的流行度，并归属于预测（预测数值结果）、分类（预测分类结果）和描述性分析的广泛分类。最后，第四部分通过使用一个中小企业案例研究来模拟第二部分中已解释的咨询阶段，并采用第三部分中介绍的适当技术，使咨询原则变得生动。尽管每章都是独立的，但我们建议您在进入第三部分之前先阅读第一部分，并在进入第四部分之前先阅读第二部分。


  实际示例所使用的工具是`RapidMiner Studio`和`Gephi`。本书的编写方式包含了所有`RapidMiner Studio`和`Gephi`的屏幕截图，并详细说明了如何运行它们。`GitHub`也将用于存储实践项目。


  本书不仅仅解释技术，还提供了应用模型建议以获得结果的体验。特别是，我们在用例中使用了过去遇到的业务场景样本。本书还得到了一个真实的商业团体 Telegram 群组（[`https://t.me/+kSSQjNhhz6plZTk0`](https://t.me/%252BkSSQjNhhz6plZTk0)）的支持，我们在此收集业务问题，并鼓励读者参与解决问题。本书中包含了（来自
  Telegram 群的）真实商业案例研究，可作为参考。本书还附带了 YouTube 视频链接，有助于更清晰地解释某些概念。


  本书连同练习题的解答、更多应用场景和数据科学技术，均可作为在线课程和培训提供；您可以访问`datasciencenaija.com`了解更多详情。


  我们感谢读者的反馈。我们想知道您对本书的看法，无论好坏。如需提供一般性反馈，只需发送电子邮件至 ibukunafolabi0909@gmail.com。此外，数据和关于本书的更多信息也可在
  [*www.datasciencenaija.com/book*](http://www.datasciencenaija.com/book) 获取。


