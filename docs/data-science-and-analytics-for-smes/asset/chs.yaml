  \n创建一个新进程（命名为 `preprocessing2`）。使用图 8-12 中的设置来创建该进程。此进程的目的是仅预处理将要用于聚类的属性。\n\n![](img/532459_1_En_8_Fig12_HTML.png)\n\
  \n*一张电脑截图展示了创建一个旨在仅预处理用于聚类属性的新进程的设置。*\n\n**图 8-12** *为 k-means 预处理数据*\n\n对于 **Replace\
  \ Missing Value** 运算符，选择 `Brand`、`Online order`、`Product class`、`Product size` 和\
  \ `Tenure`；对于 **Nominal to Numerical** 运算符，选择所有可用的分类数据；对于 **Normalize** 运算符，选择除\
  \ `customer Id` 之外的所有数据。对于 **Write CSV** 运算符的 csv 文件参数，选择 `NoodleRetailNormalize.csv`（这是一个您需要自行创建并保存在系统某处的空\
