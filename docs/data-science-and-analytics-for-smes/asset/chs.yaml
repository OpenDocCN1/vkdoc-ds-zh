  \ 轴和 X 轴。设置显示在图的左侧。*\n\n**图 8-7** *数值属性 age 的散点图*\n\n我们来修改图 8-5 中的设置，以得到图 8-8 中的结果，从而通过将所有分类变量转换为数值、进行归一化和执行相关性矩阵来探究是否需要对属性进行缩减。\n\
  \n![](img/532459_1_En_8_Fig8_HTML.png)\n\n*一张电脑截图展示了将所有分类变量转换为数值并创建相关性矩阵的设置。*\n\n\
  **图 8-8** *数据的进一步预处理*\n\n如图 8-8 所示，`Nominal to Numerical` 运算符选择了所有分类属性。点击 **Normalize**\
  \ 运算符，对于 **attribute filter type** 参数，选择 **all**。将 **Correlation Matrix** 运算符保持默认设置。运行进程，得到图\
  \ 8-9 中的相关性矩阵；点击同一图中的 **Pairwise Table**，并将相关性值按降序排序，得到图 8-10。\n\n![](img/532459_1_En_8_Fig10_HTML.jpg)\n\
  \n*一张电脑截图显示了点击成对表格选项并按降序排序相关性值后获得的相关性矩阵。*\n\n**图 8-10** *相关性矩阵（成对表格）*\n\n![](img/532459_1_En_8_Fig9_HTML.png)\n\
  \n*一张电脑截图显示了带有一些高亮值的相关性矩阵。该矩阵有助于判断是否需要缩减属性。*\n\n**图 8-9** *相关性矩阵*\n\n从图 8-10 中可以看出，没有强相关的成对变量（最高的成对相关性为\
  \ 0.331），因此，本演示将使用所有属性。（列表顶部的某些属性可能会在稍后移除，以观察评估时是否能得到更好的聚类分离。）这一决定基于皮尔逊相关性公式，该公式由\
  \ **Correlation Matrix** 运算符使用。\n\n皮尔逊相关系数 `R` 是最终得到的结果，其值必须介于 –1 到 +1 之间，即 –1 <=\
  \ `R` <= +1。\n\n![$$ r=\\frac{n\\sum xy-\\sum x\\sum y}{\\surd \\left\\{n\\sum {x}²-\\\
  left(x{\\sum}²\\right)\\right\\}\\left\\{n\\sum {y}²{\\left(\\sum y\\right)}²\\\
  right\\}} $$](img/532459_1_En_8_Chapter_TeX_Equa.png)\n\n上述公式用于获取 `R` 的值，且 `R` 的值必须落在以下范围内：\n\
  \n- `+1 到 0.7`：表示变量之间的强度呈正向完美相关\n- `0.6 到 0.5`：表示变量之间的强度呈一定相关性\n- `0.4 到 0.2`：表示变量之间的强度呈弱相关性\n\
  - `-1 到 -0.7`：表示变量之间的强度呈负向强相关\n- `-0.6 到 -0.5`：表示变量之间的强度呈一定相关性\n- `-0.4 到 -0.2`：表示变量之间的强度呈弱相关性\n\
  - `0`：表示没有相关性或关系\n\n---\n\n(b) 接下来我们进入预处理的第二部分，这部分涉及重新导入数据（因为聚类需要客户 ID）并仅选择那些没有强相关性的属性。该进程的结果将存储在一个\
  \ csv 文件中，随后该文件将被重新导入，用于 k-means 聚类。\n\n**重新导入**数据（`NoodleRetail.xlsx`）；这次，将 `customer\
