  \n\n\n## 5.12 习题\n\n1.  本练习是实操业务问题一（第 5.11 节）的延续。目的是利用 `SuperstoreNigeria.xls` 发掘更多见解，回答以下问题。（注意：部分问题可能需要使用如\
  \ Tableau 等更交互式的可视化工具。）\n    1.  每个子类别的销售额总和是多少？这与利润有何关系？即哪个子类别利润最高，哪个最低？请使用颜色进行标识。\n\
