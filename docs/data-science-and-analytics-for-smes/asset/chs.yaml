  \ 你已获得一份名为 `chapter5Assign.xls` 的数据。该数据包含一家尼日利亚面条零售企业的交易数据（*数据为虚构，仅供作业使用*）。假设该企业希望基于描述性分析的结果，获得有效营销活动的建议，而你被聘用为数据科学家，请以仪表盘的形式向管理层展示你的结果。\n\
  \n"
- "# 6. 预测数值型结果\n\n在本章中，我们将探讨用于预测的流行技术，尤其是在零售业务中的应用。解释这些技术的方法是利用它们来解决一个业务问题。要解决的业务问题是零售业务中常见的销售预测问题。本章首先解释预测技术的基本概念；接着，我们探讨如何评估这些技术。之后，我们描述意图解决的业务问题。然后，我们逐一选取各项选定技术，解释所涉及的算法以及如何用它们来解决所描述的问题。使用的预测技术包括多元线性回归、回归树和神经网络。作为本章的结尾，我们比较这三种算法的结果，并针对该问题得出结论。因此，本章提供的分析产品是针对小型零售企业的销售预测问题。\n\
  \n## 6.1 引言\n\n在分析之旅第 1.​3 节中，曾提到分析主要分为三类：描述性分析、预测性分析和规范性分析。在本章中，我们将使用预测性分析来解决小型零售企业的销售预测问题。为了为预测性分析打下良好基础，我们将解释一些基本概念。\n\
  \n机器学习用于研究计算机如何基于数据进行学习或提升性能。在机器学习中，计算机会自动学习识别复杂模式，并基于数据做出智能决策。³\n\n*监督学习*：这是向算法输入数据的过程，其中已知感兴趣的输出变量，算法“学习”如何在输出未知时用新记录预测该值。预测性分析属于监督学习范畴。预测性分析有两种类型：预测分类结果（分类），例如“购买”或“不购买”；以及预测数值型结果（预测），例如股票价格。预测算法的示例包括多元线性回归、回归树（决策树）、逻辑回归、用于回归的\
  \ `SVM`（支持向量机）等。分类方法的示例包括朴素贝叶斯、贝叶斯网络、分类树（决策树）、`KNN`、`SVM`（支持向量机）等。在本章中，我们将重点讨论处理数值型结果预测的那类预测性分析。用于预测数值型结果的历史数据是有标签的，意味着数据中所有行都以一个目标属性结尾，该属性正是我们打算预测的属性。在预测数值型或分类结果时，数据需要按比例划分，例如\
  \ 70% 或 60% 用于训练，30% 或 40% 用于测试。有些算法，如 `KNN`（K-近邻），需要不同的划分方式，因为需要使用一个划分集来确定最佳的 k\
  \ 值。这将在第 7 章中讨论。\n\n在商业中，预测可用于实现以下目标，例如：\n\n*   根据人口统计信息和先前的活动模式预测客户的信用卡行为\n*  \
  \ 利用历史的飞行常客信息预测度假旅行支出\n*   利用历史数据、产品和销售信息预测客服人员需求\n*   基于历史数据，通过产品交叉销售预测销售额\n* \
  \  预测折扣对零售额的影响\n\n分类可用于实现以下目标，例如：\n\n*   确定哪些贷款申请人属于高风险或低风险对象。\n*   在市场营销中，例如，分类有助于判断客户是否会购买产品。\n\
  *   分类在确定客户忠诚度方面非常有价值；特别是，我们可以预测客户是否会流失。\n\n*无监督学习*：这类分析旨在尝试发现数据中的模式，而非预测期望的输出值。聚类属于机器学习的无监督学习方法，此外还有许多其他方法。在这种方法中，原始、无标签且未划分的数据被输入算法，而输出的则是已标签或已分类的数据。\n\
  \n\n\n## 6.2 评估预测模型\n\n在本节中，我们将探讨如何评估预测模型，这也是本章的重点。有多种指标可用于评估预测性能。这些指标基于验证集或测试集，其客观性优于训练集。验证数据集不用于选择预测因子或计算模型参数。预测误差（`e`）是指记录\
  \ `i` 的结果值与预测结果值之间的差异。^(1,3)\n\n![$$ {e}_i={y}_i-{\\hat{y}}_i $$](img/532459_1_En_6_Chapter_TeX_Equ1.png)\n\
  \n(公式 6.1)\n\n预测准确度的一些数值衡量指标如下：\n\n*   **MAE (平均绝对误差)**：表示绝对误差的平均大小。\n\n![$$ \\\
  frac{1}{n}{\\sum}_{i=1}^n\\left|{e}_i\\right| $$](img/532459_1_En_6_Chapter_TeX_Equ2.png)\n\
  \n(公式 6.2)\n\n*   **平均误差**：该指标与 MAE 类似，区别在于它保留了误差的符号，允许负误差抵消大小相等的正误差。\n\n![$$ \\\
  frac{1}{n}{\\sum}_{i=1}^n{e}_i $$](img/532459_1_En_6_Chapter_TeX_Equ3.png)\n\n(公式\
  \ 6.3)\n\n*   **MPE (平均百分比误差)**：这是一个百分比分数，表示预测值与实际值（平均）的偏离程度，并考虑了误差的方向。\n\n![$$\
  \ 100\\times \\frac{1}{n}{\\sum}_{i=1}^n\\frac{e_i}{y_i} $$](img/532459_1_En_6_Chapter_TeX_Equ4.png)\n\
  \n(公式 6.4)\n\n*   **MAPE (平均绝对百分比误差)**：该指标给出一个百分比分数，表示预测值与实际值（平均）的偏离程度。\n\n![$$\
  \ 100\\times \\frac{1}{n}{\\sum}_{i=1}^n\\left|\\frac{e_i}{y_i}\\right| $$](img/532459_1_En_6_Chapter_TeX_Equ5.png)\n\
  \n(公式 6.5)\n\n*   **RMSE (均方根误差)**：该指标与线性回归中的估计标准误差相当；但它使用验证数据而非训练数据计算。其单位与结果变量相同。\n\
  \n![$$ \\sqrt{\\sum_{i-1}^n{e}_i²} $$](img/532459_1_En_6_Chapter_TeX_Equ6.png)\n\
  \n(公式 6.6)\n\n提升图是一种以图形方式展示模型预测性能的方法，尤其是在需要对预测结果进行排序时。（更多解释请参见 Galit 等人（2018），第\
  \ 5 章。）\n\n## 6.3 实际业务问题二（销售预测）\n\n针对这个实际业务问题，我们将以一家大型丰田汽车经销商公司为例。该公司的业务模式是：如果你打算购买一辆新的丰田汽车，可以选择将旧车卖给公司，然后在你获得的旧车估价基础上加钱购买新车。公司现在希望通过一项促销活动来吸引更多消费者前来出售他们的旧款丰田花冠，并承诺为此类汽车支付高价。公司的目标是将收购的旧车转售以获取利润。因此，业务分析师的工作就是预测公司应以什么价格从顾客那里购买这些旧车，从而确保盈利。由于本书旨在从咨询的角度解决业务问题，我们将尝试以典型的咨询方式来呈现解决方案。为此，我们探索了三种合适且最流行的算法（多元线性回归、回归树和神经网络），并比较结果以得出结论。需要说明的是，这里选择的算法并非进行此实验的唯一途径；我们可以尝试其他方法，特别是在属性组合、算法设置和算法类型方面。最终目标是获得最佳性能，同时避免数据偏差。\n\
  \n此实际业务问题的数据文件名为 `ToyotaCorollaData.xlsx`，它提供了公司过去收购的二手车相关信息。数据描述如下：\n\n| 变量 | 描述\
  \ |\n| --- | --- |\n| `Id` | *唯一标识* |\n| `Price` | *报价* |\n| `Age` | *车龄（月）* |\n\
  | `KM` | *行驶里程（公里）* |\n| `Fuel_Type` | *燃油类型（汽油、柴油、压缩天然气）* |\n| `HP` | *马力* |\n\
  | `Met_Color` | *金属漆颜色* |\n| `Automatic` | *是否自动挡（是=1，否=0）* |\n| `CC` | *气缸容积（立方厘米）*\
  \ |\n| `Doors` | *车门数量* |\n| `Quarterly_Tax` | *季度税费* |\n| `Weight` | *重量（千克）* |\n\
  \n无论使用何种预测算法，首要任务都是执行基本的数据预处理，并使用必要的可视化工具探索数据，以便进行预测。将执行以下预处理任务：\n\n1.  统计与缺失值问题\n\
  2.  异常值检测\n3.  可视化\n4.  数据转换\n5.  相关性分析\n\n所有这些步骤都已在前 1\\-10 点的实际操作演示中以不同方式处理过。\n\
