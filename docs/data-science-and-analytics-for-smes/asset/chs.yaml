  \n\n\n## 6.4 多元线性回归\n\n多元线性回归模型说明了因变量与多个自变量（两个或更多）之间的关系。MLR 模型的输出中会体现方差（即`R²`），以及每个自变量的独特贡献。回归方程也被称为回归线。决定系数（通常称为`R²`）提供了自变量（`X`）变异性的比例，并量化了利用这些自变量预测某个特定`Y`的能力。\n\
  \n方程 6.7 代表了回归方程。在该方程中，`x1`, `x2`, ... `xp` 是自变量，`β0`...`βp` 是系数，`ϵ` 是噪声或未解释的因素。`Y`\
  \ 代表因变量，即我们希望预测的数值属性。数据用于估算系数，同时也用于量化噪声。\n\n![$$ Y={\\beta}_0+{\\beta}_1{X}_1+{\\\
  beta}_2{X}_2+{\\beta}_3{X}_3+\\dots \\dots \\dots +{\\beta}_p{X}_p+\\in $$](img/532459_1_En_6_Chapter_TeX_Equ7.png)\n\
  \n(公式 6.7)\n\n如果当前任务是预测一个数值结果，数据同样用于评估模型性能。当使用直方图进行可视化时，如果图形向左或向右偏斜，我们可能需要使用数据转换技术（例如对数形式`log(X)`）来转换自变量。请注意，因变量不必呈正态分布，但要使\
  \ MLR 模型有效，模型的残差必须呈正态分布。此外，由于 MLR 对多重共线性敏感，因此不应存在多重共线性，这意味着自变量之间不应高度相关。调整后的`R²`（定义见公式\
  \ 6.8）是评估 MLR 模型的常用方法。\n\n![$$ {R}_{adj}²=1-\\frac{n-1}{n-p-1}\\left(1-{R}²\\right)\
  \ $$](img/532459_1_En_6_Chapter_TeX_Equ8.png)\n\n(公式 6.8)\n\n*   `p` 是待预测变量的数量。\n\
  *   `R²` 表示模型中可解释变异性的比例（在只有一个预测变量的模型中，这相当于相关系数的平方）。\n*   与`R²`类似，较高的`R²_{adj}`值表明拟合优度更高。\n\
  \n与忽略所用预测变量数量的`R²`不同，`R²_{adj}`会对使用的预测变量数量进行惩罚。关于多元线性回归模型的更详细讨论，请参见 Galit 等人 (2018)。³\
  \ 验证/测试数据集用于确定 MLR 的预测性能。这些数据集分区不应用于选择预测变量或计算模型参数。\n\n### 线性回归中的变量选择\n\n选择使用的具体形式取决于领域知识、数据可用性和所需的预测能力。在将所有可用变量用于构建模型之前，务必谨慎，因为为未来预测收集完整的预测因子集可能代价高昂或不可行。此外，我们或许能够更可靠地测量较少的预测因子（例如在调查中），而预测因子越多，数据中出现缺失值的可能性就越大。为了限制预测因子的数量，有几种选择。一种技术是利用领域知识来减少预测因子的数量。另一种选择是利用计算能力和统计性能指标。其中一些方法如下：\n\
  \n*   *穷举搜索*：评估所有预测因子子集以及每个子集模型，并使用特定标准来评估模型。\n*   *流行的子集选择算法*：此过程通过对所有潜在回归模型的空间进行迭代部分搜索来执行。前向选择、后向消除和逐步回归都属于此类算法。\n\
  *   例如，主成分分析在观测子集在同一尺度上测量且高度相关时特别有用。如果变量数量庞大，主成分分析有助于识别少数几个变量，这些变量是原始变量的加权线性组合，并保留了原始集合的大部分信息。它最常用于数值变量。更多信息请查阅\
  \ Galit 等人 (2018)。\n\n### 销售预测问题 – MLR\n\n1.  我们要做的第一件事是在`RapidMiner`中创建一个新流程并重新加载数据；我们将其命名为`ToyotaCorollaData2`（我们将排除\
  \ ID 列）。这可以在图 6-9 中看到。\n\n    ![](img/532459_1_En_6_Fig9_HTML.png)\n    一个包含 13\
