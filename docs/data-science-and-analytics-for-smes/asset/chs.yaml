  \    | 1           | 1      | 1    | 0      | 0        | 0    |\n| 11     | 0  \
  \   | 0           | 1      | 0    | 0      | 0        | 1    |\n\n### 关联分析——中小企业的应用\n\
  \n零售行业广泛运用关联分析，以深入了解顾客通常会一起购买哪些商品。了解特定商品组合是否经常被同时购买，是一种决策类型。关联分析有助于设计商品目录和零售店铺布局，同时还能用于交叉销售、促销活动，以及根据购买习惯识别客户群体。为了在降低库存积压成本的同时增加中小企业的销售额，可以利用关联分析的结果，以正确的商品组合来配置货架。在交叉销售商品方面，关联分析的结果可用于提高每位顾客的平均消费额。中小企业的前端销售人员在这方面的技能水平可能参差不齐，因为他们的经验和观察能力各不相同。关联分析可以帮助小企业深入了解顾客最可能购买哪些类型的商品，从而更好地对员工进行相关领域的培训和指导。\n\
  \n### 关联分析示例\n\n一家鞋类零售商存储了每位顾客的销售数据，并能将其转换为存储在`shoes.xlsx`文件中的事务数据。该鞋类零售商的目的是分析这些鞋类商品购买之间的关联，以便用于销售点展示和指导销售人员促进交叉销售。\n\
  \n![](img/532459_1_En_8_Fig18_HTML.png)\n\n*一张计算机截图，展示了创建频繁项集过程的设置。*\n\n**图 8-16**\
  \  \n*创建频繁项集的过程*\n\n1. 创建一个新的存储库（命名为 Association）；**导入**名为`shoes.xlsx`的数据。导入时，确保将除交易编号（`Trans.`）之外的所有列转换为二项数据类型。导入数据后，检查**统计信息**，确保没有缺失值。\n\
