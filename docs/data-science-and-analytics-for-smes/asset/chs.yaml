  \ 8-39 中，我们能够看到具有高介数中心性的节点在其他节点集群之间形成了桥梁。\n\n![](img/532459_1_En_8_Fig43_HTML.png)\n\
  \n网络图展示了使用紧密度中心性对网络节点进行排序的结果。\n\n**图 8-40** 产品紧密度中心性网络\n\n1.  使用`closeness centrality`，我们得到图\
  \ 8-40 中的网络。\n\n图 8-40 中的网络图是使用紧密度中心性对网络节点进行排序的结果。从图 8-38 中，我们能够看到具有高中心性值的节点，因为它们与网络中的其他节点距离很近。关于这些中心性指标在不同领域应用的参考文献，请参阅本章的第\
  \ 8.8 节。\n\n## 8.6 实践业务问题五（员工效率）\n\n协作网络已被用于人员分析，以减少员工超负荷、提高全球团队的韧性、优化职业发展路径等。以下是协作网络中使用的一些指标：\n\
  \n*   **网络规模**：连接到某个节点的节点数量。入度（衡量从其他节点连接到本节点的节点数量）和出度（衡量特定节点所连接的节点数量）。这在`Gephi`中通过平均度来捕获。\n\
  *   **网络强度**：强连接和弱连接。入度或出度的强弱程度。这在`Gephi`中可以通过加权度来捕获。\n*   **网络范围**：你连接的不同类型人员的数量。高范围网络能够从多种来源获取信息。这可以通过检查你所属的社区数量来探究。\n\
  *   **网络密度**：衡量所有成员之间以及所有成员与其他所有成员之间的交互程度。这是一个衡量网络成员之间连接紧密程度的整体交互指标。它不针对每个成员进行计算。这在`Gephi`中通过图密度来捕获。\n\
  \n其他指标如第 8.5 节所述。\n\n在此问题场景中，我们将使用网络分析进行人员分析，这是业务分析的主要应用类型之一。我们将特别专注于分析协作网络。在该问题场景中，我们有一个组织，该组织正在寻求提高其员工的效率。尽管可以通过多种方式实现，但我们将探索使用该组织员工的沟通网络，并通过该网络研究绩效表现。\n\
  \n在此问题场景中，网络数据通过调查收集，并分别转换为节点文件（`nodeslabelStaff.csv`）和边列表文件（`edgeslistStaff.csv`）。\n\
  \n在此问题场景中，我们正在寻求生成以下某些或全部洞察的可能性：网络是好是坏，人们在协作方面是否真正在做他们应该做的事情，等等。为此，我们将回答以下问题：协作模式如何变化？协作模式对重要结果有何影响？\
  \ 我们可以针对个人、群体或组织进行探索。\n\n为了回答“协作模式如何变化？”这个问题，我们可以使用简单的描述性统计；例如，我们可以选择一个网络规模，在个体之间进行比较，并比较随时间的变化。其结果可用于以下员工管理领域：绩效评估、角色与职责、薪酬与晋升、培训与指导、工作轮换与职业发展以及员工保留。\n\
  \n为了回答“协作模式如何影响我们关心的员工重要成果？”这个问题，首先我们应该认识到，对于个人而言存在不同类型的成果，例如绩效（每季度销售额、成本节约、自我报告的\
  \ 1-3 分评级、经理报告的 1-3 分评级、奖金）、满意度、承诺、倦怠、离职率等。\n\n在这个实际示例中，我们选择使用网络规模来检验绩效。为此，我们将检查规模与绩效之间的相关性。在我们的案例研究中，绩效数据以每季度销售额（以百万计）来捕获。\n\
  \n**实践演示**\n\n![](img/532459_1_En_8_Fig44_HTML.png)\n\n计算机屏幕截图展示了成功将边列表加载到`Gephi`并导入`nodeslabelStaff.csv`文件的结果。\n\
