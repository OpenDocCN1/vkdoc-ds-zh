  \ Tableau 和 Power BI，值得探索。\n\n\n\n## 5.11 一个实际业务问题 I（简单描述性分析）\n\n这是本书中探讨的五个业务问题中的第一个。\n\
  \n**问题场景**：在本问题中，我们以一家电子商务企业作为案例研究。假设我们经营一家在线销售服装的企业。所使用的数据（`SuperstoreNigeria.xls`）包含销售记录。任务是使用描述性分析工具来描述过去发生了什么以及当前的情况。我们的目标是能够利用分析结果来了解业务环境并做出更好的销售决策。数据包含以下属性：`Row\
  \ ID`、`Order ID`、`Order Date`、`Ship Date`、`Ship Mode`、`Customer ID`、`Segment`、`Country`、`State`、`Postal\
  \ Code`、`Region`、`Product ID`、`Category`、`Sub-Category`、`Sales`、`Quantity`、`Discount`、`Profit`。在本问题中，我们打算回答以下问题：\n\
  \n1.  每个区域中每个子类别的销售额总和是多少？\n2.  从 2014 年到 2017 年，销售额与利润的对比情况如何？\n3.  哪些州盈利高，哪些州亏损（使用地理地图）？\n\
  4.  折扣、销售额和利润之间有什么关系？\n5.  在尼日利亚的哪个类别、子类别和州实现了最高的销售额？\n\n**解决方案**\n\n![](img/532459_1_En_5_Fig17_HTML.png)\n\
  \n条形图展示了销售额总和与子类别的对比关系。柱状条针对南部、西部、中部和东部区域绘制。\n\n**图 5-16b** 比较区域、销售额和子类别\n\n![](img/532459_1_En_5_Fig16_HTML.jpg)\n\
  \n图表类型为条形，数值列为销售额，所选数据为聚合数据，分组依据为子类别，聚合函数为求和，颜色分组依据为区域。\n\n**图 5-16a** 比较区域、销售额和子类别的设置\n\
  \n1.  *每个区域中每个子类别的销售额总和是多少？* 这个问题背后的意图是了解他们产品的哪个特定子类别带来了最高的销售额，以及这种情况发生在哪里（就区域而言）。首先要做的是**导入**\
  \ `SuperstoreNigeria.xls`，将其拖拽到设计视图，运行流程，然后在**结果**界面中，点击可视化。为了回答这个问题，我们将使用条形图。图\
  \ 5-16a 展示了回答此问题的设置。从图 5-16b（即条形图可视化）中，我们可以看到东部区域在复印机、机械设备、电话、存储设备和书柜这些类别上的总销售额最高。西部区域在耗材、配件、桌子和椅子这些类别上的总销售额最高。总体而言，西部区域在椅子子类别上拥有最高的销售额。这些信息有助于了解未来应该大量生产哪些产品以及应该针对哪个区域。\n\
  \n![](img/532459_1_En_5_Fig18_HTML.png)\n\n图表类型设置为折线图，数值列设置为销售额和利润，所选数据为聚合数据，分组依据为订单日期，聚合函数为求和。\n\
  \n**图 5-17** 随时间变化的利润与销售额对比\n\n2.  *从 2014 年到 2017 年，销售额与利润的对比情况如何？* 这个问题背后的意图是了解在特定时间段内，销售额是否真的转化为了利润。为了回答这个问题，我们将使用折线图。图\
  \ 5-17 展示了回答此问题的设置。请注意，回答这个问题时，使用利润和销售额的总和更为合理。图 5-17 中的答案显示，销售额与利润之间没有观察到特定的线性趋势随时间变化。\n\
  \n![](img/532459_1_En_5_Fig19_HTML.png)\n\n图表类型为等值区域图，数值列为利润，聚合函数为求和，关联依据为州，关联键为名称。已选择显示完整地图。\n\
  \n**图 5-18** 每个区域的利润和亏损\n\n3.  *哪些州盈利高，哪些州亏损？* 这个问题的答案有助于确定应该关注哪个州（例如在市场营销时），以便获得更多利润；并且，例如，如果在一个州亏损并在该州投入了更多的营销资源，那么进一步调查原因可能是明智的。为了回答这个问题，我们将使用地理地图。图\
  \ 5-18 展示了回答此问题的设置。从图 5-18 中，我们可以看到拉各斯州的总销售额最高。\n\n![](img/532459_1_En_5_Fig20_HTML.png)\n\
