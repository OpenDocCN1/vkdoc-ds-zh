  \n### 数据清洗 – 异常值\n\n什么是异常值？异常值是指从总体随机样本中，与其他值存在异常距离的观测值。要检测异常值，我们会检查这些值是否在合理的范围内，这取决于你对每个变量的预期。当存在明显的异常值时，例如，在图\
  \ 2-10 中，需要对其进行处理。\n\n![](img/532459_1_En_2_Fig11_HTML.png)\n\n该图表绘制了年龄与应付金额的关系。第三个参数，即示例集，也被标记出来。异常值覆盖了年龄从\
  \ 275 到 300 的范围，其中 x 等于 300，y 等于 10000。\n\n**图 2-10** 异常值\n\n此外，要检测异常值，我们可以检查每个数据点与均值之间的距离。任何距离均值超过三个标准差的观测值都被视为异常值。当变量成对出现时，异常值会落在（散点图的）模式之外。识别异常值的目的通常是引起对需要进一步审查的值的注意，例如，一个病人的体温为\
  \ 200°F，或者年龄为 300 岁。关于异常值的一些关键问题是：该异常值是错误还是合法数据点？该异常值是否属于目标总体的一部分？答案将有助于决定是否在我们的分析中纳入该异常值。检测异常值的一种方法是按列对记录进行排序，然后审查该列中非常大或非常小的值。你还可以查看每列的最小值和最大值（可以使用\
  \ RapidMiner 中的统计功能完成此操作）。箱线图可视化或两个数值变量的散点图也可用于发现异常值。如果异常值是由于错误造成的，则修正它；如果异常值超出目标总体范围，则将其剔除。如果异常值远超其余数据的范围（例如，小数点位错置），它可能会对我们计划采用的一些数据挖掘过程（如聚类中的欧氏距离）产生显著影响。处理异常值的其他方法包括数据变换、使用抗异常值工具（如用中位数代替均值）等。所有这些决策都应由对相关应用领域具有专业知识的领域专家做出。\n\
  \n![](img/532459_1_En_2_Fig12_HTML.png)\n\n该流程表示异常值的过滤。这些阶段包括：在线检索问题、选择属性、检测异常值、过滤示例以及写入\
  \ CSV。\n\n**图 2-11** 过滤异常值的流程\n\n1.  我们通过处理异常值来继续我们的实践示例。创建一个新流程，并使用本示例步骤 2 中解释的过程，导入缺失值清洗后得到的数据（`OnlineQuestionAfterMissing.csv`）。在处理异常值之前查看数据时，你可以在设计视图中仅使用该数据运行流程。要通过过滤行来处理异常值，请使用图\
  \ 2-11 中的流程；点击`Select Attributes`运算符；对于`attribute filter type`，点击`subset`并选择所有属性，以便流程的输出将包含存储的完整数据。请注意，有时你可能希望在应用`detect\
  \ outliers`运算符之前进行归一化，尤其是在使用欧氏距离时。对于`Detect Outliers`运算符，请注意在参数中，邻居数默认设置为`10`。你可能希望根据你对运算符工作原理的理解来更改此值。与\
  \ RapidMiner 中所有其他运算符一样，有必要阅读所有运算符的帮助文档，以了解如何针对你特定的任务最大限度地利用它。`Filter Examples`运算符根据你对其编程的方式，选择保留数据的哪些行以及移除哪些行。你可以设置`filters`参数，即`outlier`\
  \ > 等于 `false`；如果这样做，你将观察到，尽管我们预期只移除一行，但更多行被移除了。处理此问题更有效的方法是通过修正而不是删除行来处理异常值。最后，`Write\
  \ CSV`运算符用于将结果数据保存到名为`OnlineQuestionAfterOutlier.csv`的 CSV 文件中。\n\n![](img/532459_1_En_2_Fig13_HTML.png)\n\
  \n截图展示了具有三个选择选项卡的创建过滤器选项卡。\n\n**图 2-12a** 修正异常值\n\n1.  不是像步骤 9 那样移除整行，你可以根据特定属性过滤结果。为此，你首先需要通过可视化检测异常值的数量。例如，在这种情况下，我们已经能够检测到有一个异常值，并且我们注意到该值在属性`age`上大于等于`300`。根据此信息处理异常值时，你可以使用与图\
  \ 2-11 相同的流程，然后对`filter examples`运算符进行设置，如图 2-12a 所示。\n\n## 归一化与分类变量\n\n归一化用于将属性数据缩放到指定范围内。这是一种组织数据的方法，使所有记录和字段中的数据看起来相似。我们进行归一化，是为了在建模或分析过程中，属性不会相互占据不当优势。某些算法需要归一化，例如神经网络；此外，一些聚类算法也需要数据归一化。归一化有几种类型：最小-最大归一化、z-score\
  \ 归一化等。最小-最大归一化是最常见的归一化数据方法之一。对于每个特征，该特征的最小值被转换为`0`，最大值被转换为`1`，而其他所有值都被转换为介于`0`和`1`之间的小数。\n\
  \n\n\n### 处理分类变量\n\n处理有序分类变量（如年龄组、信用等级等）时，请用数字（1, 2, 3, …）为类别进行标记，并将该变量视为连续变量处理。如果分类变量是名义变量，有时则需要将其转换为虚拟变量。例如，若\
  \ `occupation` 是一个包含\"失业\"、\"在职\"或\"退休\"类别的分类属性，且某条记录的类别为\"失业\"，则可将其转换为表 2-1 所示的形式。\n\
  \n**表 2-1**  \n创建虚拟变量\n\n| - | 表格显示两行三列。三列标题分别为：`occupation unemployed`，`occupation\
  \ employed`，`occupation retired`。 |\n\n当我们将包含多个类别的分类变量转换为虚拟变量时，可能会产生过多变量。处理这一问题的一种技巧是合并相近或相似的类别，以减少类别数量。合并类别需要同时运用专业知识和常识。通常，观测数量较少的类别是适合与其他类别合并的候选对象。只保留对分析最重要的类别，并将其他类别标记为\"\
  其他\"。你也可以使用条形图来辅助做出此类决策。¹²\n\n一张截图显示了两个选项卡：`process` 和 `parameter`。两个选项卡都显示了从名义变量到数值型变量的处理过程。\n\
  \n**图 2-12b**  \n归一化与名义变量转数值型运算符\n\n1.  要对经过异常值处理后的数据 `OnlineQuestionAfterOutlier.csv`\
  \ 进行归一化，可以使用 `Normalize` 运算符；若要转换为虚拟变量，则可以使用 `Nominal to Numerical` 运算符（参见图 2-12b）。对于\
  \ `Normalize` 和 `Nominal to Numerical` 这两个运算符，都需要使用 `attribute filter type` 和 `attribute`\
  \ 参数来选择属性，如图 2-12b 所示。\n\n## 2.5 数据可视化\n\n在分析项目中，数据可视化的目的有多种。数据可以用于预测、分类以及无监督学习（也称为高级描述性分析）的可视化。有关数据可视化的详细理解，请参考以下文献：Galit\
  \ 等人（2019 年）第 3 章或 Thomas Rahlf（2017 年）的著作。\n\n在进行预测的数据可视化时，我们按以下指南探索数据：\n\n-  \
  \ 使用直方图/箱线图来确定是否需要任何转换（绘制结果变量与数值型预测变量的关系图）。例如，如果是直方图，我们检查偏度。这将在第 6 章中介绍。\n-   我们还可以通过箱线图、条形图和多面板图来研究目标变量与分类型预测变量之间的关系。\n\
  -   使用散点图来研究数值型预测变量之间的关系。这样做时，你是在寻找它们之间可能对你的分析产生正面或负面影响的关系。\n-   检查添加了颜色的散点图，以确定是否需要交互项。\n\
  \n在进行分类的数据可视化时，我们按以下指南探索数据：\n\n-   使用 Y 轴显示结果变量的条形图来研究目标变量与分类型预测变量之间的关系。\n-   使用颜色编码的散点图来研究目标变量与两个数值型预测变量之间的关系，并用颜色表示结果。\n\
  -   可以使用并排箱线图来研究结果变量与数值型预测变量之间的关系，其中每个数值型变量都与结果变量进行比较。值得注意的是，分离度最高的箱线图代表可能有用的预测项。\n\
  \n在进行无监督任务的数据可视化时，建议采用以下方法：\n\n-   创建散点图矩阵，以识别观测值之间的成对关系和聚类情况。\n-   使用热力图来检查相关性表。\n\
  -   使用不同的聚合级别和缩放功能来确定数据中行为不同的区域。\n\n## 2.6 习题\n\n1.  使用名为 `OnlineQuestionAfterOutlier.csv`\
  \ 的数据，为所有分类属性创建虚拟变量，并对所有数值型属性进行归一化。\n2.  对名为 `FarmCo.External.xlsx` 的数据执行典型的预测数据预处理；描述你在此过程中采取的步骤、得出的结论以及处理后的数据（目标属性为\
  \ `Unit Price`）。\n\n"
- '# 3. 商业分析咨询


  在本章中，我们将探讨商业分析咨询，特别是其概念含义以及如何建立这样的职业道路。我们将解释存在的商业分析咨询类型，然后聚焦于如何为小型企业导航商业分析咨询的世界。在本章中，我们将了解如何管理一个典型的分析项目以及如何衡量分析项目的成功。最后，我们将讨论关于如何为分析项目收费的问题，特别是作为咨询顾问时应如何处理。




  ## 3.1 商业分析咨询


  顾问是指从事为专业或技术领域工作者提供专家建议业务的人。因此，商业分析咨询即指此类专家建议涉及第一章 1 第 1.​3 节所述的商业分析旅程中任一阶段的情况。它也可被视为一种行为或过程，旨在教育客户了解数据及现代技术的各个方面，包括获取数据、理解数据、处理数据以及从数据中提取价值。²


  ![](img/532459_1_En_3_Fig1_HTML.jpg)


  *一张展示了不同类型咨询组织中四种数据科学家职位的插图。*


  **图 3-1** 数据科学家职位


  图 3-1 提供了不同类型组织中数据科学家不同职位和入门级角色的示例。从图 3-1 可以看出，应届毕业生或自学成才的数据科学家可以在任何咨询公司获得初级数据科学家等职位。¹
  如今，这些角色可能会根据所涉及的大型公司的类型而定制。其中一些公司也招收数据科学实习生。此外，还有独立的数据科学顾问，他们不为任何公司或组织（无论规模大小）工作，而是提供数据科学咨询服务。有些人被称为数据科学自由职业者，他们利用诸如[`www.freelancer.com/`](https://www.freelancer.com/)、[`www.toptal.com/`](https://www.toptal.com/)、[`www.upwork.com/`](https://www.upwork.com/)等平台寻找工作，而另一些人则将自己定位为商业分析顾问或咨询公司，独立于任何组织或平台开展工作。在实践中，独立数据科学家可能会面临若干问题；其中首要问题是相关企业不愿释放分析所需的全部数据。给独立数据科学顾问的建议是：不要一次性要求所有数据而吓到企业。然而，你必须先进行初步分析，了解解决该问题所需的数据。方法是先获取部分数据进行初步分析，并展示一些成果，以此鼓励客户在数据方面更加开放。你可以模拟如果数据可用，他们能从中获得什么收益。在分析项目的每个阶段，始终让你的客户和利益相关者参与进来。商业分析咨询应被视为提供产品，其产品形式是解决分析问题。商业分析顾问可以将针对特定问题的分析解决方案打包成产品来提供。本书便从这一视角审视商业分析咨询。我们视为产品来探讨的一些问题包括：客户忠诚度（第七章
  7）、客户与产品细分（第八章 8）、客户画像（第七章 7）等。值得注意的是，这些问题虽然在零售业中常见，但在其他类型的业务中也有体现。


  商业分析顾问必须明白，数据科学技术是植根于业务理解之中的。例如，如果你不了解企业如何运营以及通常如何改进业务，你就无法知道如何应用数据科学技术或其在何处适用，以提升企业的销售额。一个很好的例子是利用数据科学改善电子商务销售额。例如，为了销售更多滞销产品，你必须了解在典型的营销中如何做到这一点（例如通过交叉销售）。但这并不会告知我们应进行何种分析。在这种情况下，你可能需要使用关联规则分析来发现过去经常同时出现的产品，然后将其用于交叉销售。


  商业分析顾问在与客户合作时可能会扮演三种角色：专家（局外观望，你与有问题的客户合作，并希望你能解决它）、助手（提供客户公司本可以自行完成的服务）和协作者（并肩作战，外部顾问与客户组织成员联手，共同完成项目或解决问题）。每一种角色都代表着一种不同的互动方式，并为顾问带来不同来源的满足感。³
  当你承接咨询项目时，明确说明你希望以哪种模式运作非常重要。


