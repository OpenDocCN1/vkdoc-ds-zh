  3.  从图 5-13 可以看出，`是`的计数最高，这由最大的蓝色矩形表示。其次是`可能`，以此类推。\n\n## 热图\n\n热图是一种数值数据的图形显示方式，其中使用颜色来表示数值。它们对于可视化相关表格和数据中的缺失值特别有用。为此，信息会在一个二维表格中呈现。一组属性的相关性表格具有相同的行数和列数。如果属性数量很多，则可以使用属性的一个子集。热图使通过颜色代码快速扫描相关性值变得简单快捷。\n\
