  \n## 6.5 回归树\n\n决策树分类器家族包括回归树。决策树分类器的数据驱动方法需要大量数据。例如 `ID3`、`C4.5`、`CART`（分类与回归树）等。这类技术使用贪婪（即非回溯）方法，以递归的分治方式自顶向下构建决策树。随着树的创建，训练集被递归地划分为更小的子集。特征在树创建过程中的选择方式以及决策树算法中使用的剪枝过程有所不同。\n\
  \n**决策树分类器中的属性选择度量**\n\n属性选择度量是一种启发式方法，用于挑选将给定的类标记训练元组数据分区 D 分割成单个类的“最佳”分割标准。如果我们将\
  \ D 分割成更小的分区，最优的分割要求是每个分区都是纯的。由于属性选择度量决定了给定节点上的元组如何被分割，因此它们也被称为分割规则。属性选择度量为描述相关训练元组的每个属性分配一个分数。对于给定的元组，得分最高的属性被选为分割属性。如果分割属性是连续值的，或者我们仅限于二叉树，我们必须分别确定一个分割点或一个分割子集作为分割标准的一部分。²\
  \ 三种流行的属性选择度量是：\n\n*   信息增益\n*   增益率\n*   基尼指数\n\n决策树结构的一个示例如图 6-15 所示。\n\n![一个回归决策树结构流程：高度，根节点；然后是颜色，真；颜色引出一个左侧分支和下方的假和假。假是一个叶节点。](img/532459_1_En_6_Fig17_HTML.jpg)\n\
  \n**图 6-15**\n决策树示例\n\n*   包含根节点、分支和叶节点。\n*   每个内部节点代表对一个属性的测试。\n*   每个分支代表测试的结果，每个叶节点代表一个类别。\n\
  \n使用决策树分类器的一些好处包括：它们不需要领域知识，易于理解，并且是白盒模型，这意味着我们可以快速解释决策树模型。这可以通过提取决策树的规则来实现。离群点对决策树算法不是问题，并且它们可以容忍缺失值。\n\
  \n使用决策树时，在训练数据上构建深层树存在过拟合的风险。当最终的分割基于少量记录时，据说就会发生这种情况。过拟合会导致处理新数据时性能不佳。为了避免过拟合，我们可以使用树深度参数、终端节点中的最少记录数以及最小的不纯度减少量，在树开始过拟合数据之前阻止其生长。在我们的数据划分中，我们还可以修剪树或使用交叉验证。\n\
  \n**回归树**\n\n决策树算法可以预测数值型和类别型结果。当预期结果是数值时，使用回归树。使用回归树进行预测时，使用预测变量数据将记录“掉落”到树中，直到到达终端节点。该终端节点中训练记录的平均结果值决定了回归树中该终端节点的值。\n\
  \n**销售预测问题 – 回归树**\n\n使用第 6.2 节中介绍的销售预测问题，以下内容演示了如何使用回归树来解决该问题：\n\n![相关流程截图](img/532459_1_En_6_Fig18_HTML.png)\n\
