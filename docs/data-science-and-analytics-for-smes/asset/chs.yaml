  \ FP-Growth，保留默认设置。有时，根据数据情况，您可能需要降低支持度才能获得结果。FP-Growth 算法是一种用于计算事务数据库中频繁共同出现商品项的高效算法。\n\
  \n![](img/532459_1_En_8_Fig19_HTML.png)\n\n*一张计算机截图，展示了创建频繁项集过程的输出，左侧显示了相关规格参数。*\n\
