  \ 1 和 0 时，对应预测值 pred 1 和 pred 0 的数值被高亮显示。\n\n**图 7-16b**\n\n提升树模型的性能\n\n在使用了不同的算法来解决这个问题之后，我们现在可以比较它们的准确率，并为这个特定数据选择最佳算法。与预测类似，对于分类问题，也可能需要使用不同的数据和算法设置进行实验以获得更好的准确率。比较图\
  \ 7-7b、7-11b、7-15b 和 7-16b，我们可以看到最佳算法是神经网络（图 7-7b），其准确率为 85.79%，略高于随机森林。\n\n对于这个问题，目标是预测哪些客户将成为潜在客户中的忠诚客户。利用对新客户的预测结果，我们可以识别这一点，特别是如果我们选择那些具有高倾向性的客户。同时，对于现有客户，我们也可以预测出忠诚客户和即将流失的客户，并采取必要措施。例如，如果目标是瞄准潜在客户，我们可以将潜在客户记录按倾向性从高到低排序（在新预测的数据集中），以便针对那些具有最高倾向性的客户采取行动进行目标营销。\n\
  \n\n\n## K-近邻算法\n\n在本节中，我们将探讨 K-近邻（KNN）算法，并通过一个实际案例了解它如何帮助我们获取更多客户。K-近邻算法可用于预测数值型和分类型输出。在本例中，它将用于预测分类型输出。这主要是因为获取更多客户的任务是一个分类任务。\n\
  \nKNN 会在训练数据集中搜索用于分类或预测新记录的相似记录。这些“近邻”通过平均法进行预测或投票法进行分类，从而为新记录产生分类结果或预测值。其方法是搜索训练数据中与待分类记录相似（或具有相似值）的记录。然后，根据这些相关记录所属的类别对待分类记录进行分类。\n\
  \n**我们如何确定这些相似记录（近邻）？**\n\n欧几里得距离是一种广泛使用的距离度量方法。两个记录（`x[1], x[2]……x[p]`）和（`u[1],\
  \ u[2]……u[p]`）之间的欧几里得距离为\n\n![$$ \\sqrt{{\\left({x}_1-{u}_1\\right)}²+{\\left({x}_2-{u}_2\\\
  right)}²\\kern0.5em +\\dots \\dots \\dots \\dots \\dots ..+{\\left({x}_p-{u}_p\\\
  right)}^{2\\kern1.5em }} $$](img/532459_1_En_7_Chapter_TeX_Equ7.png)\n\n（式 7.7）\n\
  \n- 在计算欧几里得距离之前，大多数情况下，应对预测变量进行归一化，以使每个预测变量的尺度相同。\n- 同样值得注意的是，新记录是使用训练数据的均值和标准差进行标准化的，并且在计算这些值时不会包含新记录。\n\
  - 与新数据一样，验证数据也被排除在此计算之外。\n\n**KNN 使用以下规则进行分类：**\n\n- 如果 `k = 1`（最简单的情况）\n  - 找到最近的记录（最近邻），并将新记录分类为其最近邻所属的类别。\n\
  - 如果 `k > 1`\n  - 找到距离待分类记录最近的 `k` 个近邻。\n  - 使用多数决策规则对记录进行分类，将该记录归类为 `k` 个近邻中多数类别的成员。\n\
  \n在商业领域，KNN 可用于大多数分类场景，并且在可用数据不多时表现良好。\n\n在使用 KNN 算法进行数据预处理时，通过使用较少的属性来减少计算距离的时间至关重要。这是因为与最近邻的预期距离会随着预测变量数量的增加而急剧增加。为了减少属性数量，我们可以应用不同的降维技术。此外，训练集中满足\
  \ KNN 要求所需的记录数量会随着预测变量数量的增加呈指数级增长。因此，需要采用诸如为模型选择预测变量子集或使用主成分分析、奇异值分解和因子分析等方法合并预测变量来减少预测变量的数量³。\n\
  \n**选择 K 值**\n\n为避免因训练数据中的噪声而导致过拟合，选择的 `k` 值应大于 1。因为 `K` 值过低会适应数据中的噪声，`K` 值也不应设置过高，否则会阻止算法捕捉数据的局部结构。`k`\
  \ 值的最佳选择取决于数据的性质。`k` 值的范围应在 1 到 20 之间。为避免平局，我们将使用奇数。`K` 的值由最佳分类性能决定。我们使用训练数据对验证数据中的记录进行分类，然后计算不同\
  \ `k` 值下的错误率。在 `RapidMiner` 中，选择 `k` 为一个较小（介于 1 到 14 之间）、正数且为奇数的整数。选择几个 `k` 值，并针对这些\
  \ `k` 值迭代运行以下过程，直到获得精度最高的那个值。\n\n此外，在使用 KNN 之前，必须将分类变量转换为二进制虚拟变量，并且与回归等统计模型不同，使用\
  \ KNN 时必须创建并使用所有二进制变量。标准化特征也很重要（例如，由于使用欧几里得距离）。\n\n对于 KNN，建议按如下方式进行数据划分：\n\n-  \
  \ **训练**：为不同的 `k` 值开发模型，然后选择最佳的 `k` 值。\n-   **验证**：用于使用训练数据评估每个 `k` 值的准确率，然后选择最佳的\
  \ `k` 值。\n-   **测试**：选定最佳的 `k` 值后，用于检查最终的准确率。\n\n由于 KNN 可用于预测和分类，因此可以根据具体情况，依据评估预测或分类的方法来对\
  \ KNN 模型进行评估。\n\n### 使用 KNN 进行分类的示例\n\n一位相框设计师希望找到一种方法，将拉各斯的客户分类为可能购买家庭尺寸相框的群体和不太可能购买的群体。我们将使用居住在伊巴丹（一个类似城市）的\
  \ 12 个购买过相框和 12 个没有购买过相框的家庭作为随机样本。\n\n![](img/532459_1_En_7_Fig24_HTML.png)\n\n\
