  \ RapidMiner 文档，`avg._within_centroid_distance`（平均簇内质心距离）是通过计算质心与某个簇内所有样本点之间距离的平均值得到的。该值越小越好。在比较多个\
  \ K 均值模型的结果时，能产生具有最小 Davies-Bouldin 指数聚类集合的模型，被认为是基于该指标的最佳算法。尽管在此示例中我们为 `k` 选择了一个值，但实践中建议在选定\
  \ `k` 之前，先尝试多个 `k` 值，并比较其 `avg._within_centroid_distance` 和 Davies-Bouldin 指数。\n\
