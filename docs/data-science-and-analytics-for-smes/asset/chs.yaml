- "# 7. 分类技术\n\n在本章中，尽管存在多种分类技术，但我们将探讨业务领域中用于分类的流行技术。为此，我们将使用第三个商业问题，该问题围绕客户忠诚度展开，并采用神经网络、分类树和随机森林算法。在解决这个问题时，我们特别关注如何为我们的中小企业获取并留住更多客户。我们还将介绍一些其他基于分类的技术，例如\
  \ K 近邻和逻辑回归。在运用这些技术解决问题时，我们解释所选算法的基本概念，并以此演示如何将这些解决问题的过程应用于实际的商业场景。\n\n\n\n## 7.1\
  \ 分类模型与评估\n\n数据分析的一个重要环节是对收集到的数据进行分类。分类是一种监督式机器学习方法，它能够推导出适用于此类情况的模型。这种模型被称为分类器，用于预测分类（离散、无序）的类别标签。一个典型的例子是预测顾客是否会离开零售商店。分类模型已广泛应用于商业领域，例如欺诈检测、客户定向营销、员工绩效预测等。分类模型通过两步流程工作：第一步是利用带标签的数据集（训练数据）构建模型；第二步是利用该模型对未来的未知对象进行分类（在验证数据集中，这些对象的标签已知，但通过新开发的模型进行预测）。在此步骤中，我们通过将结果与验证数据集中的原始标签（已知）进行比较来评估模型的准确率。验证数据集必须独立于训练集；否则会导致过拟合。\n\
  \n在分类过程中，当各类别的比例极不平衡时，就会出现欠采样问题；随机采样可能产生过少的稀有类别样本，从而难以获取将其与主导类别区分开来的有效信息。为避免这些挑战，可以采用分层抽样。分层抽样用于从可划分为子部分的数据中进行抽样²。数据被划分为同质的子部分，称为层（stratum\
  \ 的复数形式）。\n\n我们必须对分类器进行评判，因为存在多种类型的分类器和预测方法，而在每种方法内部，通常又有多种可能产生完全不同结果的替代方案。*误分类错误*的概率用于评估分类器的性能。当一条记录被错误分类时，意味着模型将其归入了不属于它的类别。\n\
  \n评估分类器性能的指标如下：¹\n\n准确率和识别率\n\n![$$ \\frac{TN+ TN}{P+N} $$](img/532459_1_En_7_Chapter_TeX_Equ1.png)\n\
  \n（公式 7.1）\n\n错误率，误分类率\n\n![$$ \\frac{FN+ FN}{P+N} $$](img/532459_1_En_7_Chapter_TeX_Equ2.png)\n\
  \n（公式 7.2）\n\n灵敏度，真正率，召回率\n\n![$$ \\frac{TP}{P} $$](img/532459_1_En_7_Chapter_TeX_Equ3.png)\n\
  \n（公式 7.3）\n\n特异度，真负率\n\n![$$ \\frac{TN}{N} $$](img/532459_1_En_7_Chapter_TeX_Equ4.png)\n\
  \n（公式 7.4）\n\n精确率\n\n![$$ \\frac{TP}{TP+ FP} $$](img/532459_1_En_7_Chapter_TeX_Equ5.png)\n\
  \n（公式 7.5）\n\nF、F1、F-score，精确率和召回率的调和平均数\n\n![$$ \\frac{2\\ x\\ precision\\ x\\\
  \ recall}{precision+ recall} $$](img/532459_1_En_7_Chapter_TeX_Equ6.png)\n\n（公式\
  \ 7.6）\n\n真正例、真负例、假正例、正例样本和负例样本这些术语分别缩写为 `TP`、`TN`、`FP`、`P` 和 `N`。\n\n- **真正例（`TP`）**：是被分类器正确标记的正例元组。\n\
  - **真负例（`TN`）**：是被分类器正确分类的负例元组。\n- **假正例（`FP`）**：是被错误分类为正例的负例元组。\n- **假负例（`FN`）**：是被分类为负例的正例元组。\n\
  \n混淆矩阵用于汇总分类器在给定数据集上产生的正确与错误分类情况，该矩阵通过验证数据集来分析分类器的性能。在表 7-1 中，混淆矩阵展示了 `TP`、`TN`、`FP`\
  \ 和 `FN`。分类器的性能可以通过混淆矩阵进行评估，这是检验分类器检测不同类别元组效果的有效工具。分类器的 `TP` 和 `TN` 表明其正确分类，而 `FP`\
  \ 和 `FN` 则分别表明其错误分类。`Fbeta` 度量是 `F` 度量的泛化形式，它增加了一个名为 beta 的配置参数。当精确率和召回率都很重要，但需要略微侧重其中一方时（例如，假负例比假正例更重要，或反之），便会使用\
  \ `Fbeta`。\n\n**表 7-1** 混淆矩阵\n\n| 实际类别 | 预测类别 | | |\n| --- | --- | --- | --- |\n\
  | | | 是 | 否 |\n| 是 | | `TP` | `FN` |\n| 否 | | `FP` | `TN` |\n\n### 分类的倾向性与截断值\n\n\
  一些分类算法首先计算记录属于每个类别的概率。概率的另一个说法是“倾向性”。倾向性常被用作预测类别归属（分类）的第一步，或根据属于目标类别的概率对记录进行排序。为确保所有类别都准确，记录可能会被划归到最可能属于它的类别（概率最大的类别）。当存在大量记录且只关注单个类别时，需专注于该类别，并将属于该类别的倾向性（概率）与分析人员确定的截断值进行比较。如果属于目标类别的概率大于截断值，则该记录被划归到目标类别。在二分类器中，默认的截断值为\
  \ 0.5。³\n\n\n\n## 7.2 实际业务问题 III（客户忠诚度）\n\n客户忠诚度被描述为，即使其他公司（通常称为竞争对手）提供类似的产品或服务，客户仍反复选择某个品牌或公司产品或服务的习惯。忠诚的客户绝不会被竞争对手产品的成本、价格或数量所动摇。他们宁愿为所习惯的同等高质量服务和产品支付更高的价格。星巴克将其\
  \ 26.5 亿美元的额外收入大部分归功于其奖励计划。客户忠诚度对所有类型的组织都有益，因为它能带来回头客、增加收入、培养品牌影响者和倡导者、使公司从竞争中脱颖而出，并提供诚实且有用的反馈。\n\
  \n在这个第三个实际业务问题中，我们将使用相同的实验条件，比较神经网络、分类树和随机森林的结果。目标是通过一个案例研究来演示如何使用这些算法进行推断，从而为我们的企业获取和留住客户。具体来说，我们将预测银行客户的忠诚度，并以此来了解客户是否会离开银行（即客户的忠诚度如何）。根据预测结果，将采用适当的关係营销方法来鼓励客户留下（如果你预测他们会离开），或者为忠诚的客户加强客户关系管理，例如提供折扣以促进更多销售。需要注意的是，虽然我们这里以银行作为案例研究，但任何其他业务都可以使用合适的数据属性进行同样的操作。\n\
  \n该业务问题的数据文件名为 `Churn_Modelling.csv`，其中包含一家银行客户的数据。数据描述如下：\n\n| • RowNumber | *标识信息，需要移除*\
  \ |\n| • CustomerId | *标识信息，需要移除* |\n| • Surname | *文本型标识信息，需要移除* |\n| • CreditScore\
  \ | *整型* |\n| • Geography | *分类型 – 表示国家* |\n| • Gender | *分类型 – 表示性别* |\n| • Age\
  \ | *整型* |\n| • Tenure | *整型* |\n| • Balance | *实数型* |\n| • NumOfProducts | *整型*\
  \ |\n| • HasCrCard | *整型，但需更改为分类型* |\n| • IsActiveMember | *整型，但需更改为分类型* |\n| •\
  \ EstimatedSalary | *实数型* |\n| • Exited | *结果变量，但需更改为分类型* |\n\n无论使用哪种分类算法，首先要做的事情都是执行基本的数据预处理，并使用必要的可视化工具探索数据，以便进行分类。\n\
  \n**分类技术的通用数据预处理**\n\n![图 7-2](img/532459_1_En_7_Fig1_HTML.png)\n图片展示了从日期格式开始的导入数据过程，将错误替换为缺失值并进行检查，下方有三个按钮：上一个、下一个和取消。\n\
  \n图 7-2 导入数据\n\n1. 创建一个新的**存储库**，并在其中创建两个**子文件夹**（一个用于数据，一个用于流程）。将名为 `Churn_Modelling.csv`\
  \ 的**数据**导入到数据子文件夹中。导入时，移除 `RowNumber`、`CustomerID` 和 `Surname` 列，并将 `HasCrCard`、`IsActiveMember`\
  \ 和 `Exited` 转换为分类型属性。同时，在导入数据时将错误替换为缺失值。图 7-2 是导入数据的截图。\n\n![图 7-3](img/532459_1_En_7_Fig2_HTML.png)\n\
  图表类型设置为柱状图，值列设置为 Exited，分组依据设置为 Geography，聚合函数设置为计数。\n\n图 7-3 分类型属性和目标变量的柱状图示例\n\
  \n2. 导入数据后，将其拖入设计视图并连接到 **res**。运行流程并查看**统计信息**。从数据的**统计信息**视图中，可以注意到不必要的属性已被移除，所需的属性更改也已生效。此外，没有缺失值。\n\
  \n3. 根据可视化指南，特别是关于分类的部分（请参阅第 2 章第 2.5 节），我们将使用柱状图研究结果与分类型预测变量的关系，其中结果变量位于 `y` 轴上。目标是找出预测变量的类别在结果或目标属性中是否得到了公平的体现。使用图\
  \ 7-3 中的设置来可视化所有分类型变量与目标属性的关系。我们可以看到，对于所有分类型属性，它们在结果变量中都有公平的体现。\n\n![图 7-4](img/532459_1_En_7_Fig3_HTML.png)\n\
  图表类型设置为散点图，x 轴列设置为 Age，值列设置为 Credit Score，颜色设置为 Exited。\n\n图 7-4 用于分类的彩色编码散点图示例\n\
  \n4. 通过彩色编码散点图研究结果与成对数值预测变量的关系（颜色表示结果）。此处的目的是查看数值预测变量之间是否存在线性关系，并观察结果类别在数值预测变量中的强度。请使用图\
  \ 7-4 中的设置，对不同的数值属性组合进行此操作。请注意，不存在这样的线性关系。如果存在这种关系，由于多重共线性，必须对其进行处理。\n\n![图 7-5](img/532459_1_En_7_Fig4_HTML.jpg)\n\
  图表类型设置为箱线图，值列设置为 Age，并选择分组依据选项为 Exited。\n\n图 7-5 为分类可视化的箱线图示例\n\n5. 通过并排箱线图研究结果与数值预测变量的关系：绘制按结果分组的数值变量的箱线图。为每个数值预测变量创建类似的显示。分离度最高的箱线图表示潜在有用的预测变量。请使用图\
