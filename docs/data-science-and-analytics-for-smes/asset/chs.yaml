  \    4.  哪些州的利润较高？（使用文字云、树状图和气泡图。）\n    5.  哪些州获得了最高和最低的折扣？（使用地图。）\n    6.  在尼日利亚的哪个类别、子类别和州，销售额最高？\n\
  \    7.  在尼日利亚的哪个类别、子类别、地区和州，销售额最高？\n    8.  对于名为“家具”的类别，且其配送方式属性为标准级，所获得的总利润和总销售额是多少？请确保输出结果有恰当的标题，即“类别与配送方式的总销售额和总利润”。\n\
