- 'no': 3689
  overturn_probability: 0.0
  alternative: 部分标题（非章节）
  counter_evidence:
  - 标题为 '# 第四部分：想象未来与对话艺术'。
  - 根据规则，“如果存在标题为‘第 X 部分’，那么该书为部分-章节模式，遇到部分和章标题时，都要划分新章”。
  - 该行使用了一级标题 '#'，且明确标示为“第四部分”，在书籍结构中属于最高层级的分割点，必须分章。
  keep_split: true
- 'no': 3749
  overturn_probability: 0.2
  alternative: 章节末尾的总结段落标题
  counter_evidence:
  - 标题为 '## 第 4 部分总结'。
  - 在标准的“部分-章节”书籍结构中，部分总结（Part Summary）通常被视为该部分的最后一个组成部分，或者是一个独立的、较短的章节。
  - 规则指出“必须排除...正文段落中的小标题”，但“部分总结”通常具有统领性或概括性，且长度短、独立成行。
  - 然而，也有观点认为部分总结只是上一部分（或整个部分）的附录，不属于新的“大章”。但鉴于其带有独立编号性质的标题（虽无数字序号，但为独立模块），且后续内容是对全部分的回顾，将其划分为独立一章在逻辑上比并入上一章更清晰，符合“统领性”特征。
  - 反方证据：它没有数字序号（如 20.），且是对第 4 部分（包含 16-19 章）的总结，可能被误判为第 19 章的一部分。但在大多数书籍数字化处理中，部分总结常作为独立实体。
  keep_split: true
