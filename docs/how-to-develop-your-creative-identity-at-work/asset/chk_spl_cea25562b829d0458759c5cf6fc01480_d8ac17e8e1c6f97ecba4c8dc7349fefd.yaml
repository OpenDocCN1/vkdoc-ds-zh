- 'no': 3011
  overturn_probability: 0.05
  alternative: 真正的章节标题
  counter_evidence:
  - 该标题使用了 Markdown 的一级标题格式 '# 16. 用幽默来交谈'，这是书籍中最高层级的章节标记。
  - 序号 '16' 与上下文中的章节逻辑连贯（前文隐含第 15 章内容，此处开启第 16 章），且未包含子层级编号。
  - 标题后紧跟二级标题 '## 什么是幽默？' 和正文内容，符合章节起始的上下文特征。
  keep_split: true
- 'no': 3147
  overturn_probability: 0.1
  alternative: 二级节标题（非最高层级章）
  counter_evidence:
  - 在 Markdown 格式中，'##' 通常表示二级标题，而前文（如 3011）使用 '# 16.' 作为一级标题。如果该书严格遵循 Markdown 层级，'##
    17.' 可能被视为隶属于某一部分或前一章的子章节，而非独立的大章。
  - 然而，观察全书模式，'## 18.' (3314) 和 '## 19.' (3486) 也使用 '##' 格式作为独立章节标题，这表明该书可能将偶数章或后续章节统一标记为
    '##'，或者 '##' 在此书语境下即代表最高层级章节（可能因导出工具转换导致 '#' 丢失或层级扁平化）。
  - '由于序号 ''17'' 紧随 ''16''，且内容独立，语义上确实是新章节。但鉴于格式层级与前一个章节（''# 16.''）不一致，存在轻微误判风险（即它可能是第
    16 章下的一个大节，但鉴于 18、19 也如此，更可能是全书后续的章节统一用了 ## 标记，或者是排版导出错误）。'
  keep_split: true
- 'no': 3314
  overturn_probability: 0.1
  alternative: 二级节标题（非最高层级章）
  counter_evidence:
  - 格式为 '## 18. 在倾听中汲取灵感'。与前文 '## 17.' 保持一致。
  - 虽然 '##' 在标准 Markdown 中是二级标题，但在此书中，带有 '18.' 这样的高序号且无父级章节编号（如 18.1）的标题，结合后续出现的 '###
    何为灵感心态？'（三级标题），可以推断 '##' 在此语境下实际承担的是章（Chapter）的功能，而 '###' 承担的是节（Section）的功能。
  - 因此，尽管符号层级看似较低，但语义和序号层级证明它是大章。
  keep_split: true
