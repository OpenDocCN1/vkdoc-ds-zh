- 'no': 96
  overturn_probability: 0.3
  alternative: 前置内容的一部分
  counter_evidence:
  - 规则指出“前言、序言...正文之前的内容，统一划分为一章”。目录通常被视为前置内容的一部分。
  - 然而，许多结构化数据提取任务会将“目录”作为一个独立的结构块处理，因为它具有强烈的导航属性，且与版权页/引言在语义上有所区别。
  - 但严格遵循“统一划分为一章”的前置内容规则，目录应归属于第0章（从no 0开始的前置部分），而非独立新章。不过，由于目录篇幅较长且结构独立，保留分章也有一定合理性，故置信度不高。
  keep_split: true
