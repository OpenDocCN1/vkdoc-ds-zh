    ## 杨辉三角


    计算机科学中的一个经典问题是生成杨辉三角。例如，一个六行的三角形如下所示：


    ```

    1

    1  1

    1  2  1

    1  3  3  1

    1  4  6  4  1

    1  5 10 10  5  1

    1  6 15 20 15  6  1

    ```


    通常，如果将其存储为二维数组，公式如下：


    ```

    a[n][0] = 1   # 其中 n >=0

    a[n][n] = 1

    a[n][m] = a[n-1][m] + a[n-1][m-1]

    ```


    首先，这显然是一个二维数组。所以，对于一个四行的三角形，它看起来像这样：


    ```

    [[1],[1,1],[1,2,1],[1,3,3,1]]

    ```


    为了方便打印，我们暂时这样做：


    ```

    triangle.each{|row| p row.inspect}

    ```


    考虑到我们正在构建一个数组的结构，使用 `reduce()` 似乎很合适。初始值是 `[]`。


    ```

    triangle = (0..5).reduce([]) do |memo, n|

    memo.push []

    end

    triangle.each{|row| p row.inspect}

    "[]"

    "[]"

    "[]"

    "[]"

    "[]"

    "[]"

    => [[], [], [], [], [], []]

    ```


    这生成了一个数组的数组，但其中包含的内容不够。不过，我们知道第一个和最后一个值是 1。我们可以将其余的值默认为零。我们还知道每个数组有 `n-1` 个元素。（注意
    `row[-1]` 是表示数组最后一个元素的方法）。


    ```

    triangle = (0..5).reduce([]) do |memo, n|

    row = n==0 ? [] : Array.new(n+1)

    row[0] = 1

    row[-1] = 1

    memo << row

    end

    triangle.each{|row| p row.inspect}

    ```


    这得出：


    ```

    "[1]"

    "[1, 1]"

    "[1, nil, 1]"

    "[1, nil, nil, 1]"

    "[1, nil, nil, nil, 1]"

    "[1, nil, nil, nil, nil, 1]"

    => [[1], [1, 1], [1, nil, 1], [1, nil, nil, 1], [1, nil, nil, nil, 1], [1, nil,
    nil, nil, nil, 1]]

    ```


    结构逐渐成形，但我们也知道第 n 行是前一行的一个函数。因此，我们需要回溯到上一行并进行处理以生成下一行。


    ```

    triangle = (0..5).reduce([]) do |memo, n|

    if n==0

    row = [1]

    else

    prev = memo[-1]

    row = prev.each_cons(2).map { |a,b| a+b }

    row.unshift(1)

    row.push(1)

    end

    memo << row

    end

    triangle.each{|row| p row.inspect}

    ```


    这得出：


    ```

