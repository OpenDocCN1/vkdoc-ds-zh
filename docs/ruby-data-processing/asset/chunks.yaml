    ## Reverse Polish Notation Parser


    One way to describe arithmetic operations is to use notation where the operands
    for an operation come before the operator. For example, the expression


    ```

    3 + 2

    ```


    would be written as


    ```

    3 2 +

    ```


    This is called postfix or reverse polish notation. (It was a big feature of the
    Hewlett-Packard calculators used by engineering geeks back in the 1980s when I
    went to school). It lets you avoid using parentheses. Processing is easier because
    one only needs to use a stack. As each token (number or operator) is read, it
    is pushed onto the stack. When an operator is pushed on the stack, it is a special
    case. The operator is popped off the stack along with the next two elements, which
    are the operands, and the operation is performed. The result is pushed back on
    the stack.


    So, for example, the processing of the expression


    ```

    3 3 4 * 4 7 8 + - * +

    ```


    can be shown as a sequence of stack snapshots, one per line. The stack grows to
    the right as the tokens are scanned, and if an operator is pushed on the stack,
    the RPN interpreter pops off the last three tokens, runs the calculation, and
    pushes the answer back onto the stack.


    ```

    3

    3 3

    3 3 4

    3 3 4 *

