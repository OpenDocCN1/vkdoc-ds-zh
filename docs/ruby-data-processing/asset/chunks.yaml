    []\

    , []], [[], [], [], [], [], [], [], [[6, 8, 10]], [], []], [[], [],     [], [],
    \

    [], [], [], [], [], [], []], [[], [], [], [], [], [], [], [], [], [], [], []],
    [\

    [], [], [], [], [], [],     [], [], [], [], [], [[5, 12, 13]], []], [[], [], [],\

    [], [], [], [], [], [], [], [], [], [], []], [[], [], [],    [], [], [], [], [\

    ], [], [], [], [[9, 12, 15]], [], [], []], [[], [], [], [], [], [], [], [], [],
    \

    [], [], [],       [],[], [], []], [[], [], [], [], [], [], [], [], [], [], [],
    [\

    ], [], [], [[8, 15, 17]], [], []]]

    ```


    看起来好多了，但我们得到了很多空数组，并且它们嵌套了三层深。这是因为`map`总是返回一个数组。因此，嵌套的`map`调用会返回数组的数组。首先要做的是尝试展平外层的数组，如下所示：


    ```

    (5..17).map do |hypotenuse|

    (1..hypotenuse).map do |opposite|

    (1..opposite).select do |adjacent|

    adjacent*adjacent + opposite*opposite == hypotenuse*hypotenuse

    end.map do |selected_adjacent|

    [selected_adjacent,opposite,hypotenuse]

    end

    end

    end.flatten

    => [3, 4, 5, 6, 8, 10, 5, 12, 13, 9, 12, 15, 8, 15, 17]

    ```


    这是不对的，因为我们在展平数组的数组的数组时做得太过分了。如果我们把它们按三个一组进行分组，实际上得到的正是斜边从 5 到 17 的毕达哥拉斯三元组。但是，我们希望保留实际的三元组。因此，我们需要逐次展平每个`map`的结果。在
    Ruby 中，有一个叫做`flat_map`的函数可以做到这一点。我们需要展平外层的`map`和第一个内层的`map`，以便得到一个由三元组数组组成的数组。我还将数字上限提高到
    26：


    ```

    (5..26).flat_map do |hypotenuse|

    (1..hypotenuse).flat_map do |opposite|

    (1..opposite).select do |adjacent|

    adjacent*adjacent + opposite*opposite == hypotenuse*hypotenuse

    end.map do |selected_adjacent|

    [selected_adjacent,opposite,hypotenuse]

    end

    end

    end

    => [[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15], [8, 15, 17], [12, 16, 20],
    \

    [15, 20, 25], [7, 24, 25], [10, 24, 26]]

    ```


    这就是我们想要的结果。你可以将数字上限调得更高，看看会发生什么。


    # 逆向工程复杂解决方案


    在某些时候，你会遇到由其他人（或者是由很久以前的你自己所写，而你已经忘记了它是如何工作的）编写的代码，你需要理解这段代码做了什么，以及是否需要修复或改进它。


    阅读一个使用`map`、`reduce`或`select`的数据处理工作流，与阅读典型的命令式编码风格的代码非常不同。此外，Ruby 传递块的方式可能会让许多不熟悉这种编码风格的人感到困惑。我曾遇到过一些人，他们阅读我的`map`/`reduce`/`select`数据处理级联代码时，表现出愤怒、困惑和轻蔑。而我自己看到其他人写的这类代码时，也曾有过同样的感受。我从命令式编程转向使用这种风格，是因为我可以用更少的代码行解决问题，并且能够有条理地解决问题，因为级联中的每一步都可以单独调试。


    在本节中，我将给出一个示例，并引导你逆向工程这个解决方案，从而理解最初用来推导出该方案的技术。

    '
- fmt: '# Solution for Pascal’s Triangle


    I found the following code on the internet (at [`http://kellegous.com/j/2006/06/28/post-9/`](http://kellegous.com/j/2006/06/28/post-9/))
    for a Pascal’s triangle (I picked 0..5 to make it easier to display). It is used
    here with the permission of the code’s author, Kelly Norton.


    ```

    text =

    (0..5).reduce([[1]]) { |a,x|

    a.unshift a.first.reduce([0,[]]) { |b,y|

    [y,b.last << (b.first + y)]

    }.last + [1]

    }.reduce([]) { |c,z|

    next [z[z.length/2].to_s.length*2,z.length,""] if c.empty?

    [c[0],c[1], z.map { |j|

    j.to_s.center(c[0])

    }.join('''').center(c[0]*c[1])+"\n#{c.last}"]

    }.last

    puts text

    ```


    When I ran it, I got the following:


    ```


    1    1

    1   2    1

    1   3    3    1

    1   4   6    4    1

    1   5   10   10   5   1

    => nil

    ```


    Lovely. It looks like a nicely formatted Pascal’s triangle, and it is a lot more
    concise than the example I wrote.


    This function seems to be using two cascading `reduce` steps to build the result.
    Let’s see what the first stage does:


    ```

    text =

    (0..5).reduce([[1]]) { |a,x|

    a.unshift a.first.reduce([0,[]]) { |b,y|

    [y,b.last  [[1, 6, 15, 20, 15, 6, 1], [1, 5, 10, 10, 5, 1], [1, 4, 6, 4, 1], [1,
    3, 3, 1], [1, 2, 1], [1, 1], [1]]

    ```


    This is interesting. It looks like the Pascal’s triangle array, but in reverse.
    Let’s add a debugging statement. Don’t forget to return the memo afterward.


    ```

    text =

    (0..5).reduce([[1]]) { |a,x|

    memo =

    a.unshift a.first.reduce([0,[]]) { |b,y|

    [y,b.last  [[1, 6, 15, 20, 15, 6, 1], [1, 5, 10, 10, 5, 1], [1, 4, 6, 4, 1], [1,
    3, 3, 1], [1, 2, 1], [1, 1], [1]]

    ```


    We can see that each run of `reduce` adds a row to the triangle and saves the
    triangle in the memo. Let’s see what happens in each of the inner `reduce` steps
    by printing out key data after each main step:


    ```

    text =

    (0..5).reduce([[1]]) { |a,x|

    puts "Before processing a: #{a}  , x: #{x}"

    memo =

    a.unshift a.first.reduce([0,[]]) { |b,y|

    puts " Before processing inner loop, b: #{b}, y: #{y}"

    inner_memo =

    [y,b.last << (b.first + y)]

    puts "  After processing inner loop y: #{y}, the inner memo is #{inner_memo}"

    inner_memo

    }.last + [1]

    puts "After processing x: #{x}, the memo is: #{memo}"

    puts ""

    memo

    }

    ```


    This yields a lot of output:


    ```

    Before processing a: [[1]], x: 0

