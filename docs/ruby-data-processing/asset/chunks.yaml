  trans: "  \n显而易见，内层循环的每一步都会遍历最后一行（`a[]`的第一个元素），并通过将元素右移将其插入到内部记忆数组的前面。接着，它会将该数字（`y`）与`b[]`的第一个元素（始终是整数或`nil`）相加，然后将结果追加到`b[]`最后一个元素（始终是数组）的末尾。处理完成后得到的内部记忆数组，其第一个元素是一个数字，第二个元素是部分行。这个第一个元素在下一次迭代中需要与部分行的最后一个元素相加时使用。\n\
    \n内层循环最后一次运行后，记忆数组的第二个元素是`[1,6,15,20,16,5]`，这几乎是三角形的一整行。这就是为什么内层循环的结果会在数组末尾追加`[1]`，从而构成三角形的一个完整行。\n\
    \n从这里开始，只需反转结果即可得到三角形的原始数据，然后将其打印出来——正如我在本书前面所写的示例那样。我将其留作练习，让读者思考这个例子如何将三角形格式化为漂亮的对称形式并打印出来。\n\
    \n在本书中，我尽力引导你理解如何使用`map`、`reduce`和`select`来解决数据处理问题。如果你通读了本书，输入了示例并思考了结果，我真诚希望这能激发你思考如何将这些技术应用到自己的数据处理问题中。我也希望你能将这些技巧传承下去，在未来解决自己的数据处理问题。\n\
