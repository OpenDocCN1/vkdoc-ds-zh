    \n# 1. Basic Ruby\n\nThis section will acquaint or refresh you with basic ways\
    \ to use the Ruby command line, as well as some relevant Ruby coding.\n\nIf you\
    \ are comfortable programming in Ruby and understand the Ruby Enumerable Library\
    \ reasonably well, you can skip this section.\n\n## The Command Line\n\nAfter\
    \ you install Ruby, you can fire up the interactive command line in Windows, Linux,\
    \ or Mac OSX. I’m using Windows.\n\n```\nC:\\>  irb\nirb(main):001:0>\n```\n\n\
    For brevity, I won’t write the full `irb` prompt every time.\n\nYou can execute\
    \ Ruby statements line by line. The value returned by each expression is preceded\
    \ by `⇒`.\n\n```\nirb> a = 4\n=> 4\nirb> a\n=> 4\nirb> a + 7\n=> 11\n```\n\nYou\
    \ can choose to put multiple statements on one line, separated by a semicolon.\n\
    \n```\nirb> list = [\"one\", \"two\",\"three\"];1\n=>1\nirb> list\n=>[\"one\"\
    , \"two\", \"three\"]\n```\n\nYou can also have a statement that spans multiple\
    \ lines.\n\n```\nirb> [2,3,4,5].each do |n|\nirb>    if n%2==0\nirb>        puts\
    \ \"even\"\nirb>    else\nirb>        puts \"odd\"\nirb>    end\nirb> end\n=>\
    \ \"even\"\n=> \"odd\"\n=> \"even\"\n=> \"odd\"\n```\n\nYou can put the code into\
    \ a file called `sample.rb`, located in the same directory or folder from which\
    \ you ran `irb` .\n\n```\n1  [2,3,4,5].each do |n|\n2      if n%2 == 0\n3    \
    \      puts \"even\"\n4      else\n5          puts \"odd\"\n6      end\n7  end\n\
    ```\n\nThen, with `irb`:\n\n```\nirb> load \"sample.rb\"\nirb> end\n=> \"even\"\
    \n=> \"odd\"\n=> \"even\"\n=> \"odd\"\nirb>\n```\n\nYou could also copy the code\
    \ block from your text editor and paste it directly into your command line and\
    \ get the same result, as long as you use only spaces for indentation. (Using\
    \ tabs for indentation will work fine if you load the file from the command prompt,\
    \ but if you paste tabs directly into `irb`, it will generate errors).\n\nYou\
    \ can either type the code samples from this book into `irb` directly or type\
    \ them into a text editor and then load the file as just shown.\n\n## Object Scope\n\
    \nWhen you are in a Ruby program, the general method of executing a method `f`\
    \ on an object `obj` is as follows:\n\n```\nobj.f\n```\n\nThat is true whether\
    \ you are in a Ruby program or the command line. When code is in the main program\
    \ file, or in the `irb` command-line interpreter, there is an implied context\
    \ for many functions, such as `puts`. That is why you can do this:\n\n```\nputs\
    \ \"Hello world\"\n```\n\nYou don’t need to specify a class to qualify `puts`,\
    \ because `puts` is a method of the underlying context object.\n\n## String\n\n\
    Strings are basic constructs in all languages. Let’s look at a few basic operations\
    \ used in this book. Try them out on the `irb` command line for yourself.\n\n\
    length or size\n\n*   This yields the size of the string.\n\ndowncase\n\n*   This\
    \ converts all letters to lowercase.\n\nupcase\n\n*   This converts all letters\
    \ to uppercase.\n\ncapitalize\n\n*   This capitalizes the first letter of a string.\n\
    \nsplit()\n\n*   This searches a substring for the argument string and splits\
    \ the string into a array comprising substrings on both sides of the `split` argument,\
    \ while the substring of the `split` argument is discarded. If there are no matches,\
    \ an array is returned with the whole string:\n\n    ```\n    irb> base_string\
    \ = \"abc def  ghi\"\n    irb> base_string.split(\" \")\n    => [\"abc\",\"def\"\
    ,\"ghi\"]\n    irb> base_string.split(\"  \")\n    => [\"abc def\",\"ghi\"]\n\
    \    irb> base_string.split(\" d\")\n    => [\"abc\",\"ef ghi\"]\n    irb> base_string.split(\"\
    efghi\")\n    => [\"abc def ghi\"]\n    ```\n\njoin()\n\n*   This joins each element\
    \ of an array of strings with the string in the `join` argument as the separator.\n\
    \n    ```\n    irb> stringlist = [\"This\", \"is\", \"a\", \"sentence\"]\n   \
    \ irb> stringlist.join(\" \")\n    => \"This is a sentence\"\n    irb> stringlist.join(\"\
    ,\")\n    => \"This,is,a,sentence\"\n    irb> stringlist.join(\" A SPACE \")\n\
    \    => \"This A SPACE is A SPACE a A SPACE sentence \"\n    ```\n\nstring interpolation\n\
    \n*   This lets you define a string template with parameters. The string `#{}`\
    \ gives you a place to put a variable.\n\n    ```\n    irb> first = \"Jack\";\
    \ last = \"Black\"\n    irb> full_name = \"#{first} #{last}\"\n    => \"Jack Black\"\
    \n    ```\n\n*   This is especially useful for iterating over a list:\n\n    ```\n\
    \    irb> smith_brothers = [\"Terry\", \"Jerry\", \"Harry\"]\n    irb> smith_brothers.each{|brother|\
    \ puts \"#{brother} Smith\"}\n    Terry Smith\n    Jerry Smith\n    Harry Smith\n\
    \    => [\"Terry\", \"Jerry\", \"Harry\"]\n    ```\n\n*   C/C++ programmers will\
    \ recognize string interpolation as being similar to the `sprintf` function in\
    \ the C standard library.\n\n## Array\n\nArrays in Ruby are like arrays in other\
    \ languages. They are a collection of things indexed by a whole number (e.g.,\
    \ 0,1,2,…). In Ruby, an array can contain any Ruby object at an index. Array indices\
    \ in Ruby start at `0`.\n\nArrays implement the Ruby Enumerable interface, so\
    \ they will have key methods such as `each`, `map`, `reduce`, `select`, and others."
