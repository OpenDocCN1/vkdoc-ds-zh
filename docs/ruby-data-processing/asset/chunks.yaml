    ## Group by Area Code


    Sometimes, you have a data set that must be grouped by a function of an element.
    Consider this list of phone numbers:


    ```

    John,613-555-1234

    Matt,613-555-2345

    Andrew,613-555-3456

    Bob,416-555-2222

    Sheila,905-555-7777

    Sara,416-555-9999

    Grocery,416-492-9999

    Pizza,416-967-1111

    Gabers,613-310-7777

    Shah,905-555-1212

    ```


    You want to group the list by area code. In this case, it is the first three-digit
    number in each phone number.


    The area code can be extracted by performing a `split()` on the phone number and
    taking the first element (`index 0`). For example:


    ```ruby

    phone_number = "613-555-1234"

    area_code = phone_number.split("-")[0]

    => "613"

    ```


    Once you have access to the area code, it can serve as a key to a `Hash` keyed
    by the area code. In our example:


    ```ruby

    area_code_groups[area_code] = phone number

    ```


    However, we''ll need an array if there are more numbers. A new array has to be
    created if one doesn''t exist for a new area code, as follows:


    ```ruby

    if area_code_groups[area_code].nil?

    area_code_groups[area_code] = [phone_number]

    else

    area_code_groups[area_code].push phone_number

    end

    ```


    The complete text, then, is as follows:


    ```ruby

    phonelist_text.split("\n").map do |row|

    row.split(",")

    end.map do |split_row|

    [split_row[0], split_row[1].split("-")]

    end.reduce({}) do |area_code_groups, ac_split_row|

    if area_code_groups[ac_split_row[1][0]].nil?

    area_code_groups[ac_split_row[1][0]] = [ [ac_split_row[0], ac_split_row[1].join("-")].join(",")
    ]

    else

    area_code_groups[ac_split_row[1][0]].push [ac_split_row[0], ac_split_row[1].join("-")].join(",")

    end

    area_code_groups

    end

    ```'
