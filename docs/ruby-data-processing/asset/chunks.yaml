- fmt: 'What is apparent is that each step of the inner loop iterates over the last
    row (the first element of `a[]`) and unshifts it onto the inner memo array (by
    sliding everything over to the right). It then adds that number (`y`) to the first
    element of `b[]` (which is always an integer or `nil`) and then pushes it onto
    the end of the last element of `b[]` (which is always an array). The resulting
    inner memo after processing is a number as the first element and a partial row
    as the second element. The first element is needed for the next iteration when
    it is added to the last element of the partial row.


    After the inner loop runs for the last time, the second element of the memo is
    `[1,6,15,20,16,5]`, which is almost a full row of the triangle. That is why the
    result of the inner loop has `[1]` pushed onto the end of the array, which makes
    a full row of the triangle.


    From here, one only has to reverse the result to get the raw data for the triangle
    and then print it out, as I did earlier in this book with the example I wrote.
    I leave it as an exercise for the reader to see how this example formats and prints
    the triangle in a nice symmetrical format.


    Throughout this book, I have tried my best to walk you through the mechanics of
    using `map`, `reduce`, and `select` to solve data processing problems. If you
    have gone through this book, and typed in the examples and pondered the results,
    I sincerely hope that it has stimulated your thinking about how to apply these
    to your own data processing problems. I also hope that you can carry these techniques
    forward to solve your own data processing problems in the future.


