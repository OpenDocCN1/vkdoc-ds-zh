    因此，完整的数据处理解决方案如下：


    ```ruby

    namebar_names =

    File.open("names.txt","r").read.split("\n").map do |name|

    [name.split(" ")[1], name]

    end.inject({}) do |memo, annotated_name|

    if memo[annotated_name[0]].nil?

    memo[annotated_name[0]] = [annotated_name[1]]

    else

    memo[annotated_name[0]] << annotated_name[1]

    end

