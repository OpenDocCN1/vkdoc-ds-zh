    ]\n    irb> base_string.split(\"efghi\")\n    => [\"abc def ghi\"]\n    ```\n\n\
    `join()`\n\n*   将字符串数组的每个元素与 `join` 参数中的字符串作为分隔符连接起来。\n\n    ```\n    irb> stringlist\
    \ = [\"This\", \"is\", \"a\", \"sentence\"]\n    irb> stringlist.join(\" \")\n\
    \    => \"This is a sentence\"\n    irb> stringlist.join(\",\")\n    => \"This,is,a,sentence\"\
    \n    irb> stringlist.join(\" A SPACE \")\n    => \"This A SPACE is A SPACE a\
    \ A SPACE sentence \"\n    ```\n\n字符串插值\n\n*   允许你定义一个带有参数的字符串模板。字符串 `#{}` 为你提供了一个放置变量的位置。\n\
    \n    ```\n    irb> first = \"Jack\"; last = \"Black\"\n    irb> full_name = \"\
    #{first} #{last}\"\n    => \"Jack Black\"\n    ```\n\n*   这在遍历列表时尤其有用：\n\n   \
    \ ```\n    irb> smith_brothers = [\"Terry\", \"Jerry\", \"Harry\"]\n    irb> smith_brothers.each{|brother|\
    \ puts \"#{brother} Smith\"}\n    Terry Smith\n    Jerry Smith\n    Harry Smith\n\
    \    => [\"Terry\", \"Jerry\", \"Harry\"]\n    ```\n\n*   C/C++ 程序员会认识到字符串插值与\
    \ C 标准库中的 `sprintf` 函数类似。\n\n## 数组\n\nRuby 中的数组与其他语言中的数组类似。它们是由整数（例如 0,1,2,...）索引的事物的集合。在\
    \ Ruby 中，数组可以在一个索引处包含任何 Ruby 对象。Ruby 中的数组索引从 `0` 开始。\n\n数组实现了 Ruby 的 Enumerable\
    \ 接口，因此它们将拥有诸如 `each`、`map`、`reduce`、`select` 等关键方法。\n"
- fmt: "### Special Methods\n\n`compact()`\n\n- 此方法可移除数组中的 `nil` 成员。例如：\n\n    ```\n\
    \    irb> [1,nil,2,nil,nil,3,nil,[]].compact\n    => [1,2,3,[]]\n    ```\n\n`flatten()`\n\
    \n- 此方法可展平任意深度的嵌套数组。处理嵌套的`map`和`reduce`语句时，此方法非常实用。例如：\n\n    ```\n    irb> [[1,[2,3]],4,[5,6]].flatten\n\
    \    => [1,2,3,4,5,6]\n    ```\n\n`push()`\n\n- 此方法将一个元素推入数组末尾，并返回一个新数组。例如：\n\n\
    \    ```\n    irb> [1,2,3,4,5].push(666)\n    => [1,2,3,4,5,666]\n    ```\n\n\
    `pop`\n\n- 此方法移除数组的最后一个元素并返回该元素，同时返回一个新数组。例如：\n\n    ```\n    irb> the_array =\
    \ [1,2,3,4,5]\n    irb> tail = the_array.pop\n    irb> tail\n    => 5\n    irb>\
    \ the_array\n    => [1, 2, 3, 4]\n    ```\n\n`unshift()`\n\n- 此方法将一个元素推入数组的开头，并返回一个新数组。例如：\n\
    \n    ```\n    irb> the_array = [1,2,3,4,5]\n    irb> the_array.unshift(666)\n\
    \    => [666, 1, 2, 3, 4, 5]\n    ```\n\n`shift`\n\n- 此方法移除数组的第一个元素并返回该元素，同时修改原数组。例如：\n\
    \n    ```\n    irb> the_array = [1,2,3,4,5]\n    irb> head = the_array.shift\n\
    \    irb> head\n    => 1\n    irb> the_array\n    => [2, 3, 4, 5]\n    ```\n\n\
    ## Hash\n\n`Hash`的另一个术语是“关联数组”或“字典”。`Hash`通过键对象进行索引，每个键对象对应一个值（另一个对象）。\n\n```\n\
    irb> newhash = Hash.new\n=> {}\nirb> newhash2 = {}\n=> {}\n```\n\n这是创建新哈希的两种方法。哈希的键可以是任何对象或符号。\n\
    \n```\nirb> newhash = {key1: \"some_value\", key2: 2}\n=> {:key1=> \"some_value\"\
    , :key2=>2}\nirb> newhash2 = {}\nirb> newhash2[:key1] = \"key1_symbol\"\nirb>\
    \ newhash2[\"key1\"] = \"key3_string\"\nirb> newhash2[3] = 3\nirb> newhash2[:key4]\
    \ = [4,\"44\"]\nirb> newhash2[[3,\"33\"]] = \"wow\"\nirb> newhash2\n=> {:key1=>\"\
    key1_symbol\", \"key2\"=>\"key2_string\", 2=>1, :key4=>[4,\"44\"], [3,\"33]=\\\
    \n\"wow\" }\n```\n\n键可以是任何对象，包括符号、字符串、数字、哈希、数组等。使用`each`或`map`遍历哈希时，它会发出一个包含两个元素的数组（键作为第一个元素，值作为第二个元素），或者直接发出键和值两个元素。（注意，`inspect`用于检查任何对象的内容。）\n\
    \n```\nirb> newhash = {a: 1, b: 2, c: 3}\nirb> newhash.each{|e| puts e.inspect}\n\
    [:a, 1]\n[:b, 2]\n[:c, 3]\n=> {:a => 1, :b => 2, :c => 3}\nirb> newhash.map{|key,\
    \ value| \"The key is #{key} and the value is #{value}\"}\n=> [\"The key is a\
    \ and the value is 1\", \"The key is b and the value is 2\", \"The key is c and\
    \ the value is 3\"]\n```\n\n## Block-passing Syntax\n\nRuby 是支持词法闭包（也称为匿名函数或块）的语言之一。这些函数是动态创建的。函数可以采用已定义函数的形式。例如：\n\
    \n```\nirb> def plus_two(a,b)\nirb>    a + b + 2\nirb> end\nirb> plus_two(3,4)\n\
    => 9\n```\n\n或者，可以按如下方式定义：\n\n```\nirb> plus_two = ->(a,b) do\nirb>    a + b +\
    \ 2\nirb> end\n```\n\n或者，也可以这样定义：\n\n```\nirb> plus_three = ->(a,b){a + b + 3}\n\
    irb> plus_three.call(5,7)\n=> 15\n```\n\n现在，匿名函数或块可以作为参数传递给其他函数。接受函数（已定义的或匿名的）作为参数的函数可以选择在程序流程中执行该函数。假设有一个名为`printit()`的函数，定义如下：\n\
    \n```\nirb> printit = ->(a) do\nirb>    puts a.inspect\nirb> end\n```\n\n现在，假设想要打印一个范围内的每个元素。可以调用数组的`each`方法，它将把传递的块应用于数组的每个元素。\n\
    \n```\nirb> (1..5).each(&printit)\n\n=> (1..5)\n```\n\n也可以直接传递一个代码块来执行。代码块由`do`和`end`或`{`和`}`包围。竖线之间的对象可选地传递给块（取决于块的定义），并由块用于执行。块的返回值是块中最后一个表达式的值。\n\
    \n```\nirb> (1..5).each do |num|\nirb>    puts num.inspect\nirb> end\n```\n\n\
    你将得到与之前相同的输出。以下方式也是如此：\n\n```\nirb> (1..5).each{|num| puts num.inspect }\n```\n\
    \n在 Ruby 中，`map`、`reduce`和`select`都接受一个代码块作为参数，该代码块按照函数的定义执行。在本书中，我将最常使用`do`-`end`语法，有时也会使用`{\
    \ }`语法。\n\n## Reading from Files\n\n数据处理中一个常见的操作是读取和写入文件。假设有一个`names.txt`文件，内容如下：\n\
    \n```\n1,John\n2,Jack\n3,Jim\n4,Jared\n5,John\n```\n\n读取它的方式如下：\n\n```\nirb> names\
    \ = File.open(\"names.txt\").read\n```\n\n在某些计算机上，换行符由回车符（“\\n”）分隔；而在其他计算机上，换行符由换行符和回车符（“\\\
    r\\n”）分隔。\n\n如果要将此文件拆分为行，可以执行以下操作：\n\n```\nirb> names.split(\"\\n\")\n```\n\n\
    这可能会返回\n\n```\n=>[\"1,John\\r\", \"2,Jack\\r\", \"3,Jim\\r\", \"4,Jared\\r\",\
    \ \"5,John\\r\"]\n```\n\n或\n\n```\n=>[\"1,John\", \"2,Jack\", \"3,Jim\", \"4,Jared\"\
    , \"5,John\"]\n```\n\n为了确保一致性，请使用`chomp`方法，它会移除末尾的空白字符（如果存在）。例如：\n\n```\nirb>\
    \ \"John\\r\".chomp\n=> \"John\"\nirb> \"John\".chomp\n=> \"John\"\n```\n\n因此，针对我们的数组，为了确保不会意外捕获多余的换行符，我们可以这样做：\n\
    \n```\nirb> names.split(\"\\n\").map{|row| row.chomp}\n=>[\"1,John\", \"2,Jack\"\
    , \"3,Jim\", \"4,Jared\", \"5,John\"]\n```\n\n我假设本书中的示例不使用“\\r\\n”，而仅使用“\\n”。如果你的操作系统不支持这种换行符，请在处理数组之前使用`chomp()`方法。\n\
    \n# 2. Function Overview and Simple Examples\n\nRuby 库包含 `Enumerable` 模块。该库包含\
    \ `map()`、`reduce()`、`select()` 等函数。本节将概述使用这三个函数的代码中不同部分的语法和含义。\n\n如果你能轻松地完成本节内容，既能将代码输入\
    \ `irb` 又能理解结果，那么你将处于一个有利的位置，能够通过下一章中的复杂示例和逆向工程来加深理解。"
  raw: "### Special Methods\n\ncompact()\n\n*   This method on an array gets rid of\
    \ nil members. For example:\n\n    ```\n    irb> [1,nil,2,nil,nil,3,nil,[]].compact\n\
    \    => [1,2,3,[]]\n    ```\n\nflatten()\n\n*   This method gets rid of inner\
    \ arrays to an arbitrary depth. It is often useful when dealing with nested `map`\
    \ and `reduce` statements. For example:\n\n    ```\n    irb> [[1,[2,3]],4,[5,6]].flatten\n\
    \    => [1,2,3,4,5,6]\n    ```\n\npush()\n\n*   This method pushes an element\
    \ onto the end of an array and returns a new array. For example:\n\n    ```\n\
    \    irb> [1,2,3,4,5].push(666)\n    => [1,2,3,4,5,666]\n    ```\n\npop\n\n* \
    \  This method removes the last element of an array and returns that element and\
    \ returns a new array. For example:\n\n    ```\n    irb> the_array = [1,2,3,4,5]\n\
    \    irb> tail = the_array.pop\n    irb> tail\n    => 5\n    irb> the_array\n\
    \    => [1, 2, 3, 4]\n    ```\n\nunshift()\n\n*   This method pushes an element\
    \ onto the beginning of an array and returns a new array. For example:\n\n   \
    \ ```\n    irb> the_array = [1,2,3,4,5]\n    irb> the_array.unshift(666)\n   \
    \ => [666, 1, 2, 3, 4, 5]\n    ```\n\nshift\n\n*   This method removes the first\
    \ element of an array and returns that element and modifies the old array. For\
    \ example:\n\n    ```\n    irb> the_array = [1,2,3,4,5]\n    irb> head = the_array.shift\n\
    \    irb> head\n    => 1\n    irb> the_array\n    => [2, 3, 4, 5]\n    ```\n\n\
    ## Hash\n\nAnother term for hash is an “associative array,” or even a “dictionary”,\
    \ Hashes are indexed by a key object, and there is a value (another object) for\
    \ each key object.\n\n```\nirb> newhash = Hash.new\n=> {}\nirb> newhash2 = {}\n\
    => {}\n```\n\nThese are two ways of creating a new hash. The key of a hash can\
    \ be any object or symbol .\n\n```\nirb> newhash = {key1: \"some_value\", key2:\
    \ 2}\n=> {:key1=> \"some_value\", :key2=>2}\nirb> newhash2 = {}\nirb> newhash2[:key1]\
    \ = \"key1_symbol\"\nirb> newhash2[\"key1\"] = \"key3_string\"\nirb> newhash2[3]\
    \ = 3\nirb> newhash2[:key4] = [4,\"44\"]\nirb> newhash2[[3,\"33\"]] = \"wow\"\n\
    irb> newhash2\n=> {:key1=>\"key1_symbol\", \"key2\"=>\"key2_string\", 2=>1, :key4=>[4,\"\
    44\"], [3,\"33]=\\\n\"wow\" }\n```\n\nThe key can be any object, including symbols,\
    \ strings, numbers, hashes, arrays, or anything. When iterating through a hash\
    \ using `each` or `map`, it emits a single array with the key as the first element\
    \ and the value as the second element, or it can emit two elements, which are\
    \ the key and the value. (Note that `inspect` is how you can inspect the content\
    \ of any object).\n\n```\nirb> newhash = {a: 1, b: 2, c: 3}\nirb> newhash.each{|e|\
    \ puts e.inspect}\n[:a, 1]\n[:b, 2]\n[:c, 3]\n=> {:a => 1, :b => 2, :c => 3}\n\
    irb> newhash.map{|key, value| \"The key is #{key} and the value is #{value}\"\
    }\n=> [\"The key is a and the value is 1\", \"The key is b and the value is 2\"\
    , \"The key is c and the value is 3\"]\n```\n\n## Block-passing Syntax\n\nRuby\
    \ is one of many languages that allow lexical closures, otherwise known (kind\
    \ of) as anonymous functions or blocks. These functions are dynamically created.\
    \ The function can take the form of a defined function. For example:\n\n```\n\
    irb> def plus_two(a,b)\nirb>    a + b + 2\nirb> end\nirb> plus_two(3,4)\n=> 9\n\
    ```\n\nOr, you could define it as follows:\n\n```\nirb> plus_two = ->(a,b) do\n\
    irb>    a + b + 2\nirb> end\n```\n\nOr, you could define it this way:\n\n```\n\
    irb> plus_three = ->(a,b){a + b + 3}\nirb> plus_three.call(5,7)\n=> 15\n```\n\n\
    Now, anonymous functions or blocks can be passed to other functions as parameters.\
    \ A function that takes a function (defined or anonymous) as a parameter will\
    \ optionally execute the function in its program flow. Suppose there is a function\
    \ called `printit()` defined as follows:\n\n```\nirb> printit = ->(a) do\nirb>\
    \    puts a.inspect\nirb> end\n```\n\nNow, suppose you want to print each element\
    \ of a range. You will call `each` on the array, which will run the block passed\
    \ to `each` for each element of the array.\n\n```\nirb> (1..5).each(&printit)\n\
    \n=> (1..5)\n```\n\nYou could also pass an actual block of code to run. The block\
    \ is surrounded by `do` and `end` or `{` and `}`. Objects between the vertical\
    \ bars are optionally passed to the block (depending on the definition of the\
    \ block), and they are used by the block to execute. The return value of a block\
    \ is the value of the last expression in the block.\n\n```\nirb> (1..5).each do\
    \ |num|\nirb>    puts num.inspect\nirb> end\n```\n\nYou will get the same output\
    \ as earlier. Ditto for the following:\n\n```\nirb> (1..5).each{|num| puts num.inspect\
    \ }\n```\n\nIn Ruby, `map`, `reduce`, and `select` all take a code block as a\
    \ parameter, and the code block is executed as defined by the function. In this\
    \ book, I will use the `do`-`end` syntax most often, and sometimes the `{ }` syntax.\n\
    \n## Reading from Files\n\nA common operation in data processing is reading from\
    \ files and writing to files. Suppose you have `names.txt`, which looks like this:\n\
    \n```\n1,John\n2,Jack\n3,Jim\n4,Jared\n5,John\n```\n\nTo read it, you would do\
    \ the following:\n\n```\nirb> names = File.open(\"names.txt\").read\n```\n\nNow,\
    \ on some computers, new lines are split by a carriage return (“\\n”), and on\
    \ other computers lines are split by a line feed and a carriage return (“\\r\\\
    n”).\n\nIf you want to split this file into rows, you would do the following:\n\
    \n```\nirb> names.split(\"\\n\")\n```\n\nThat could yield\n\n```\n=>[\"1,John\\\
    r\", \"2,Jack\\r\", \"3,Jim\\r\", \"4,Jared\\r\", \"5,John\\r\"]\n```\n\nor\n\n\
    ```\n=>[\"1,John\", \"2,Jack\", \"3,Jim\", \"4,Jared\", \"5,John\"]\n```\n\nTo\
    \ ensure consistency, use the `chomp` method, which removes whitespace characters\
    \ if they exist. For example:\n\n```\nirb> \"John\\r\".chomp\n=> \"John\"\nirb>\
    \ \"John\".chomp\n=> \"John\"\n```\n\nSo, for our array, just to ensure that we\
    \ don’t pick up stray line feeds, we do the following:\n\n```\nirb> names.split(\"\
    \\n\").map{|row| row.chomp}\n=>[\"1,John\", \"2,Jack\", \"3,Jim\", \"4,Jared\"\
    , \"5,John\"]\n```\n\nI assume that the examples in this book don’t use “\\r\\\
    n”, but rather just “\\n”. If that doesn’t work on your operating system, use\
    \ the `chomp()` method as shown before working with the array.\n\n# 2. Function\
    \ Overview and Simple Examples\n\nThe Ruby library includes the module Enumerable.\
    \ This library contains `map()`, `reduce()`, `select()` , and other functions.\
    \ This section will outline the syntax and meanings of the different parts of\
    \ code that use these three functions.\n\nIf you can get through this section\
    \ comfortably, both typing the code into `irb` and understanding the results,\
    \ then you will be in a good position to deepen your understanding with the complex\
    \ examples and reverse engineering that follow in the next chapters."
