- fmt: '# Pythagorean Triplets


    The Pythagoras Theorem is an important one in mathematics. It states that, for
    a right triangle, the square of the hypotenuse is the sum of the squares of the
    other two sides. A Pythagorean triplet is one where all three sides of a right
    triangle are integers. For example, `[3,4,5]` or `[5,12,13]` or `[8,15,17]`. Math
    teachers the world over use these to create math tests so that they don’t have
    to be bothered marking inexact long-division or square-root calculations.


    How do you solve this problem of generating Pythagorean triplets?


    First of all, the hypotenuse is the longest side. So, we have to search all possible
    integer values of the hypotenuse. We’ll start at 5, because we know that 5 is
    the length of the hypotenuse of the smallest Pythagorean triangle. We know that
    we have to return a triplet, which could be an array of three elements. We’ll
    start with 5 and end with 17 for now:


    ```

    (5..17).map do |hypotenuse|

    [nil,nil,hypotenuse]

    end

    => [[nil, nil, 5], [nil, nil, 6], [nil, nil, 7], [nil, nil, 8], [nil, nil, 9],
    [\

    nil, nil, 10], [nil, nil, 11], [nil, nil, 12], [nil, nil, 13], [nil, nil, 14],
    [\

    nil, nil, 15], [nil, nil, 16], [nil, nil, 17]]

    ```


    So far, so good. However, we need real numbers and not `nil` for the opposite
    and adjacent sides. We merely have to put them in nested loops. The opposite only
    has to search from 1 until the current hypotenuse, and the adjacent only has to
    search from 1 to the current opposite, as follows:


    ```

    (5..17).map do |hypotenuse|

    (1..hypotenuse).map do |opposite|

    (1..opposite).map do |adjacent|

    [adjacent,opposite,hypotenuse]

    end

    end

    end

    => [[[[1, 1, 5]], [[1, 2, 5], [2, 2, 5]], [[1, 3, 5], [2, 3, 5], [3, 3, 5]], [[1\

    , 4, 5], [2, 4, 5], [3, 4, 5], [4, 4, 5]], [[1, 5, 5], [2, 5, 5], [3, 5, 5], [4,\

    5, 5], [5, 5, 5]]], [[[1, 1, 6]], [[1, 2, 6], [2, 2, 6]], [[1, 3, 6], [2, 3, 6]\

    , [3, 3, 6]], [[1, 4, 6], [2, 4, 6], [3, 4, 6], [4, 4, 6]], [[1, 5, 6], [2, 5,
    6\

    ], [3, 5, 6], [4, 5, 6], [5, 5, 6]], [[1, 6, 6], [2, 6, 6], [3, 6, 6], [4, 6,
    6]\

    , [5, 6, 6], [6, 6, 6]]], [[[1, 1, 7]], [[1, 2, 7], [2, 2, 7]], [[1, 3, 7], [2,
    \

    3, 7], [3, 3, 7]], [[1, 4, 7], [2, 4, 7], [3, 4, 7], [4, 4, 7]], [[1, 5, 7], [2,\

    5, 7], [3, 5, 7], [4, 5, 7], [5, 5, 7]], [[1, 6, 7], [2, 6, 7], [3, 6, 7], [4,
    \

    6, 7], [5, 6, 7], [6, 6, 7]], [[1, 7, 7], [2, 7, 7], [3, 7, 7], [4, 7, 7], [5,
    7\

    , 7], [6, 7, 7], [7, 7, 7]]], [[[1, 1, 8]], [[1, 2, 8], [2, 2, 8]], [[1, 3, 8],
    \

    [2, 3, 8], [3, 3, 8]], [[1, 4, 8], [2, 4, 8], [3, 4, 8], [4, 4, 8]], [[1, 5, 8],\

    [2, 5, 8], [3, 5, 8], [4, 5, 8], [5, 5, 8]], [[1, 6, 8], [2, 6, 8], [3, 6, 8],
    \

    [4, 6, 8], [5, 6, 8] , [6, 6, 8]], [[1, 7, 8], [2, 7, 8], [3, 7, 8], [4, 7, 8],
    \

    [5, 7, 8], [6, 7, 8], [7, 7, 8]], [[1, 8, 8], [2, 8, 8], [3, 8, 8], [4, 8, 8],
    .\

    ....................

    ```


    The returned value is a mess, but it gets all the reasonable combinations. Now,
    once we have all of the numbers, we don’t want to keep numbers that aren’t triplets;
    we only keep the triplets. That means that we should only choose values for “opposite”
    that make a Pythagorean triplet with the other two. In other words, the last call
    to `map` should be preceded by a `select` where the predicate is the Pythagorean
    triplet rule:


    ```

    (5..17).map do |hypotenuse|

    (1..hypotenuse).map do |opposite|

    (1..opposite).select do |adjacent|

    adjacent*adjacent + opposite*opposite == hypotenuse*hypotenuse

    end.map do |selected_adjacent|

    [selected_adjacent,opposite,hypotenuse]

    end

    end

    end

    => [[[], [], [], [[3, 4, 5]], []], [[], [], [], [], [], []], [[], [], [], [],
    []\

    , [], []], [[], [], [], [], [],     [], [], []], [[], [], [], [], [], [], [],
    []\

    , []], [[], [], [], [], [], [], [], [[6, 8, 10]], [], []], [[], [],     [], [],
    \

    [], [], [], [], [], [], []], [[], [], [], [], [], [], [], [], [], [], [], []],
    [\

    [], [], [], [], [], [],     [], [], [], [], [], [[5, 12, 13]], []], [[], [], [],\

    [], [], [], [], [], [], [], [], [], [], []], [[], [], [],    [], [], [], [], [\

    ], [], [], [], [[9, 12, 15]], [], [], []], [[], [], [], [], [], [], [], [], [],
    \

    [], [], [],       [],[], [], []], [[], [], [], [], [], [], [], [], [], [], [],
    [\

    ], [], [], [[8, 15, 17]], [], []]]

    ```


    This looks better, but we have a lot of blank arrays, and they are nested three
    deep. That is because `map` always returns an array. So, nested `map` calls will
    return arrays of arrays. The first thing to do is try to flatten the outer array,
    as follows:


    ```

    (5..17).map do |hypotenuse|

    (1..hypotenuse).map do |opposite|

    (1..opposite).select do |adjacent|

    adjacent*adjacent + opposite*opposite == hypotenuse*hypotenuse

    end.map do |selected_adjacent|

    [selected_adjacent,opposite,hypotenuse]

    end

    end

    end.flatten

    => [3, 4, 5, 6, 8, 10, 5, 12, 13, 9, 12, 15, 8, 15, 17]

    ```


    This is not right, because we went too far in flattening the array of arrays of
    arrays. If we group them in triplets, we actually have the Pythagorean triplets
    from 5 to 17 for the hypotenuse. However, we want actual triplets preserved. So,
    we need to successively flatten the results of each `map`. In Ruby, there is a
    function called `flat_map` that does this. We need to flatten the outer `map`
    and the first inner `map` in order to have an array of triplet arrays. I’ll also
    bump up the number to 26:


    ```

    (5..26).flat_map do |hypotenuse|

    (1..hypotenuse).flat_map do |opposite|

    (1..opposite).select do |adjacent|

    adjacent*adjacent + opposite*opposite == hypotenuse*hypotenuse

    end.map do |selected_adjacent|

    [selected_adjacent,opposite,hypotenuse]

    end

    end

    end

    => [[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15], [8, 15, 17], [12, 16, 20],
    \

    [15, 20, 25], [7, 24, 25], [10, 24, 26]]

    ```


    This is the result we were seeking. You can bump the number up higher to see what
    happens.


    # Reverse-Engineering Complex Solutions


    At some point, you will be presented with code that was written by others (or
    by you, a long time ago, and you have since forgotten how it works), and you will
    need to understand what the code did and if it needs to be fixed or evolved.


    Reading a data-processing workflow that uses `map`, `reduce`, or `select` is very
    different from reading typical code written in an imperative coding style. In
    addition, Ruby’s way of passing blocks can be confusing to many people unfamiliar
    with that coding style. I have experienced people reading my `map`/`reduce`/`select`
    data-processing cascades and reacting with anger, confusion, and scorn. And I
    myself have felt that way about such code from other people. I switched from imperative
    coding to using this style because I can solve my problems with fewer lines of
    code, and I can solve the problems in a disciplined way because each step in the
    cascade is individually debuggable.


    In this section, I will present an example and walk you through reverse-engineering
    the solution and gaining understanding of the techniques used to derive the solution
    in the first place.'
