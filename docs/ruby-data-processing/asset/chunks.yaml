    The output should look like this:


    ```


    fizz

    buzz

    fizz


    fizzbuzz


    fizz

    buzz

    fizz


    fizzbuzz


    fizz

    buzz

    ```


    The data structure for the output should be an array. We want to do something
    to each element of the array to get the output. Let’s start with fizz, which requires
    that the number be divisible by 2 (`n%2==0`):


    ```

    (1..15).map do |n|

    if n%2 == 0

    "fizz"

    else

    n.to_s

    end

    end

    ```


    That gives us the following:


    ```

    => ["1", "fizz", "3", "fizz", "5", "fizz", "7", "fizz", "9", "fizz", "11", ...
    \ and so on

    ```


    That is close, but we didn’t address the buzz:


    ```

    (1..15).map do |n|

    if n%2 == 0

    "fizz"

    elsif n%3 ==0

    "buzz"

    else

    n.to_s

    end

    end

    ```


    That gives us the following:


    ```

    => ["1", "fizz", "buzz", "fizz", "5", "fizz", "7", "fizz", "buzz", "fizz", "11",\

    "fizz", "13", "fizz", "buzz"]

    ```


    That’s close, but the fizzbuzz examples didn’t happen at 6 and 12\. Let’s add
    in another clause. To be divisible by 2 and 3 implies that it must be divisible
    by 6:


    ```

    fizzbuzz_list =

    (1..15).map do |n|

    if n%2 == 0

    "fizz"

    elsif n%3 ==0

    "buzz"

    elsif n%6 == 0

    "fizzbuzz"

    else

    n.to_s

    end

    end

    ```


    This yielded the same result as the previous attempt. A closer inspection of the
    code suggests that if the number is divisible by 6, it will always be even and
    will be caught by the `n%2==0` clause. However, if we catch the `n%6==0` clause
    first, what happens?


    ```

    fizzbuzz_list =

    (1..15).map do |n|

    if n%6 == 0

    "fizzbuzz"

    elsif n%3 ==0

