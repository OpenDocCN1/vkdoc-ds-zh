    Introduction


    I wrote mostly reactive software for many years, but there was always a user interface
    or reporting component that had string manipulation, data synthesis, or data formatting.
    Since I was not trained as a computer scientist, I did not learn of higher-order
    functions such as `map()` , `reduce()` , and `select()` that were found in languages
    like Lisp or Smalltalk. Also, Ruby, Python, C++, and JavaScript were not around
    when I was in school. As a result, I struggled with cumbersome, error-prone imperative
    code for some tasks.


    A few years after learning Ruby, but while still using the imperative programming
    style for data processing, I discovered the Ruby Enumerable library and started
    using its higher-order functions, such as `map()` , `reduce()` , and `select()`
    . What happened to my data-processing code?


    *   Code became more straightforward because data-processing tasks could be expressed
    with a cascading pipeline of map , reduce , and select stages. Each stage in the
    pipeline was simple to develop and debug.

    *   Code volume was reduced by half.

    *   Code was naturally more robust, and debugging took much less time.

    *   By thinking of solutions in terms of map , reduce , and select , I was able
    to envision and solve more complex problems.


    However, I couldn’t find any but the most trivial examples of how to use these
    functions to solve data-processing problems. It took me a lot of time-consuming
    trial and error with map , reduce , and select to solve these kinds of problems.


    I decided to write this book to


    *   codify my learning and help you understand it more quickly and effectively
    than I did; and

    *   show you my problem-solving approaches to help you solve your data-processing
    problems.


    I’ll also admit that I was forced to learn many of the programming nuances of
    these functions as I wrote the examples.


    ## Who This Book Can Help


    This book can help those who


    *   want to become more skilled in writing data-processing code by becoming more
    fluent in using map , reduce and select ;

    *   are willing to type in all the code in the examples and run the code using
    the irb Ruby command line and a text editor;

    *   are willing to carefully read and try the examples in this book and to reflect
    and ponder the outputs, and even tweak the programs independently to try to understand
    what is happening;

    *   are open to learning a different way to approach data-processing problems;
    and

    *   are willing to try failed approaches to learn the nuances of these functions.


    ## Who This Book Might Not Help


    This book might not help you if you want


    *   recipes for standard problems via a cookbook; or

    *   a reference for data-processing solutions.


    Prerequisites


    You should be familiar with some Ruby programming or at least some programming
    in another language. If you don’t know Ruby, search out the book [Learn Ruby the
    Hard Way](http://learnrubythehardway.org/book/) [¹](#A463517_1_En_BookFrontmatter_OnlinePDF.html#Fn1)
    and go through it as prescribed by its author, Zed Shaw.


    If you are fluent with Python, you might benefit from this book if you go slowly
    and look up Ruby information online as you move through this book.


    An internet connection helps if you want to search for online help using Google,
    Bing, or another search engine.


    You should have a computer with Ruby 2.2.x installed. Windows works, as do Linux
    and Mac OSX.


    You should have a good syntax-highlighting text editor. I recommend Notepad++
    on Windows or gedit on Linux or Macintosh, both of which are free. Sublime works
    on Windows, Linux, or Macintosh and is slightly better, but costs about $70 at
    the time of this writing.


    Acknowledgments


    I would like to acknowledge a few people who helped make me a better programmer
    and a better writer. Thanks go to Kevin Szabo and Ronnie Taylor, both of whom
    helped me be a better programmer, and to Christina Hardy, who helped me to become
    a better writer. And thanks also go to Mark Powers and the publication team at
    Apress who helped produce this book.'
