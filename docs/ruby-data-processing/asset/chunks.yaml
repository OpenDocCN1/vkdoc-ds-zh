  trans: "\n# 帕斯卡三角形的解法\n\n我在互联网上找到了以下代码（来自 [`http://kellegous.com/j/2006/06/28/post-9/`](http://kellegous.com/j/2006/06/28/post-9/)），用于生成帕斯卡三角形（我选取了\
    \ 0..5 以便更易显示）。此处使用已获得代码作者 Kelly Norton 的许可。\n\n```\ntext =\n(0..5).reduce([[1]])\
    \ { |a,x|\na.unshift a.first.reduce([0,[]]) { |b,y|\n[y,b.last << (b.first + y)]\n\
    }.last + [1]\n}.reduce([]) { |c,z|\nnext [z[z.length/2].to_s.length*2,z.length,\"\
    \"] if c.empty?\n[c[0],c[1], z.map { |j|\nj.to_s.center(c[0])\n}.join('').center(c[0]*c[1])+\"\
    \\n#{c.last}\"]\n}.last\nputs text\n```\n\n当我运行它时，得到了以下结果：\n\n```\n\n1    1\n\
    1   2    1\n1   3    3    1\n1   4   6    4    1\n1   5   10   10   5   1\n=>\
    \ nil\n```\n\n非常棒。它看起来像一个格式精美的帕斯卡三角形，而且比我之前写的示例简洁得多。\n\n这个函数似乎使用了两个级联的 `reduce`\
    \ 步骤来构建结果。让我们看看第一阶段做了什么：\n\n```\ntext =\n(0..5).reduce([[1]]) { |a,x|\na.unshift\
    \ a.first.reduce([0,[]]) { |b,y|\n[y,b.last  [[1, 6, 15, 20, 15, 6, 1], [1, 5,\
    \ 10, 10, 5, 1], [1, 4, 6, 4, 1], [1, 3, 3, 1], [1, 2, 1], [1, 1], [1]]\n```\n\
    \n这很有趣。它看起来像帕斯卡三角形的数组，但顺序是反的。让我们添加一条调试语句。别忘了随后要返回 memo 对象。\n\n```\ntext =\n(0..5).reduce([[1]])\
    \ { |a,x|\nmemo =\na.unshift a.first.reduce([0,[]]) { |b,y|\n[y,b.last  [[1, 6,\
    \ 15, 20, 15, 6, 1], [1, 5, 10, 10, 5, 1], [1, 4, 6, 4, 1], [1, 3, 3, 1], [1,\
    \ 2, 1], [1, 1], [1]]\n```\n\n我们可以看到，每次 `reduce` 运行都会向三角形中添加一行，并将该三角形保存在 memo\
    \ 中。让我们通过在每个主要步骤后打印关键数据，来看看每个内部 `reduce` 步骤中发生了什么：\n\n```\ntext =\n(0..5).reduce([[1]])\
    \ { |a,x|\nputs \"处理 a 之前：#{a}，x：#{x}\"\nmemo =\na.unshift a.first.reduce([0,[]])\
    \ { |b,y|\nputs \" 处理内层循环之前，b：#{b}，y：#{y}\"\ninner_memo =\n[y,b.last << (b.first\
    \ + y)]\nputs \"  处理内层循环 y：#{y} 之后，内部 memo 为：#{inner_memo}\"\ninner_memo\n}.last\
    \ + [1]\nputs \"处理 x：#{x} 之后，memo 为：#{memo}\"\nputs \"\"\nmemo\n}\n```\n\n这会产生大量的输出：\n\
    \n```\n处理 a 之前：[[1]]，x：0\n 处理内层循环之前，b：[0, []]，y：1\n  处理内层循环 y：1 之后，内部 memo 为：[1,\
    \ [1]]\n处理 x：0 之后，memo 为：[[1, 1], [1]]\n处理 a 之前：[[1, 1], [1]]，x：1\n 处理内层循环之前，b：[0,\
    \ []]，y：1\n  处理内层循环 y：1 之后，内部 memo 为：[1, [1]]\n 处理内层循环之前，b：[1, [1]]，y：1\n  处理内层循环\
    \ y：1 之后，内部 memo 为：[1, [1, 2]]\n处理 x：1 之后，memo 为：[[1, 2, 1], [1, 1], [1]]\n处理\
    \ a 之前：[[1, 2, 1], [1, 1], [1]]，x：2\n 处理内层循环之前，b：[0, []]，y：1\n  处理内层循环 y：1 之后，内部\
