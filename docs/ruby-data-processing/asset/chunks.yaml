    ## Debugging Blocks for `Map`, `Reduce`, and `Select`


    The best way to learn about your problem as you solve it is to insert print statements
    like `puts` to see what happens as you execute the loop.


    ### Debugging `Map` Blocks


    The thing to remember is that `map` operates on each element of the collection
    for each run of the block. When debugging, you want to see how the block operated
    on each element.


    ```

    [1,2,3,4,5].map do |number|

    result = number*number

    puts "The result of the function on element: #{number} is #{result}"

    result

    end

    ```


    It is important to save the result in a local variable so that you can return
    it as the last statement of the block. If you don’t, the result of the `puts`
    statement will be returned (usually `nil`).


    ### Debugging `Reduce` Blocks


    Debugging `reduce` is a bit different because the memo is carried from element
    to element. Therefore, you want to print out the element as well as the memo.


    ```

    final_answer =

    [1,2,3,4,5].reduce(0) do |memo, number|

    memo = memo + number

    puts "After operating on number: #{number}, the memo is #{memo.inspect} "

    memo

    end

    After operating on number: 1, the memo is 1

    After operating on number: 2, the memo is 3

    After operating on number: 3, the memo is 6

    After operating on number: 4, the memo is 10

    After operating on number: 5, the memo is 15

    => 15

    ```


    Again, make sure that you save the memo before printing it, then return it at
    the end of the block.


    If you are using `memo` to build a different data structure as a part of the `reduce`
    block, inspecting the memo becomes extremely useful in converging on a good solution.


    ### Debugging `Select` Blocks


    Debugging `select` is easy because the only thing you need to know is whether
    the predicate was `true` for a particular element.


    For example, a `select` filter that only keeps even numbers (`number%2==0`) could
    be debugged like this:


    ```

    [1,2,3,4,5].select do |number|

    predicate = number%2==0

    puts "The predicate is #{predicate} for number #{number}"

    predicate

    end

    The predicate is false for number 1

    The predicate is true for number 2

    The predicate is false for number 3

    The predicate is true for number 4

    The predicate is false for number 5

    => [2, 4]

    ```


    Here, you can see that only the numbers for which the predicate was `true` ended
    up in the answer (`[2,4]`).'
