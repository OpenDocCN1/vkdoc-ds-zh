    Jack, 555-0000

    Jim, 555-0000

    Jared, 555-6666

    John, 555-7777, 555-2344

    ```


    This doesn’t even follow the first normal form for data normalization, but that
    is OK for humans. First of all, you have already extracted your data sets into
    the arrays `names` and `phones` as follows:


    ```

