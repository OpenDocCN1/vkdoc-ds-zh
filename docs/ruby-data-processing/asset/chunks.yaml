    ### `max`


    该函数用于查找数组中的最大元素：


    ```

    irb> [1,3,5,6,7,8,6,0].max

    => 8

    ```


    `Reduce` 在这里适用，因为当你遍历数组时，会将最大值保存在备忘录中。这个示例甚至不需要显式的初始值，因为第一个元素就是备忘录的默认值。


    ```

    [4,3,5,6,7,8,6,0].reduce do |memo, element|

    if element > memo

    memo = element

    else

    memo = memo

    end

    puts "The largest element after checking #{element} is #{memo}"

    memo

    end

    The largest element after checking 3 is 4

    The largest element after checking 5 is 5

    The largest element after checking 6 is 6

    The largest element after checking 7 is 7

    The largest element after checking 8 is 8

    The largest element after checking 6 is 8

    The largest element after checking 0 is 8

    => 8

    ```


    当然，简洁的编码方式如下：


    ```

    [4,3,5,6,7,8,6,0].reduce do |memo, element|

    (element > memo) ? element : memo

    end

    => 8

    ```


    ## `Select`


    Ruby `Enumerable` 库中的这个函数非常简单。`select()` 方法应用于数组或哈希。`select()` 的工作是选择那些对其应用谓词后返回
    `true` 的元素。（谓词是一个返回 `true` 或 `false` 的表达式，它在传递给 `select` 的代码块中运行）。


    下面的简单示例中，谓词总是返回 `true`，因此选择了集合中的所有成员。在此例中，集合是 `[1,2,3,4,5]`，谓词是 `true`：


    ```

    [1,2,3,4,5].select do |element|

    true

    end

    => [1,2,3,4,5]

    ```


    一个稍微复杂一点的示例是从原始集合 `[1,2,3,4,5]` 中选择偶数（即谓词为 `element % 2 == 0` 的元素）：


    ```

    [1,2,3,4,5].select do |element|

    element % 2 == 0

    end

    => [2,4]

    ```


    `Select` 可以级联。假设你想找出 1 到 100 之间以 7 开头的偶数。首先，选择偶数。然后，选择以 7 开头的数字：


    ```

    irb>  (1..100).select{|number| number % 2 == 0}\

    irb*> .select{|even_number| even_number.to_s[0] == "7"}

    => [70, 72, 74, 76, 78]

    ```


    你也可以反转级联顺序：


    ```

    irb>  (1..100).select{|number| number.to_s[0] == "7"}\

    irb*> .select{|seven_number| seven_number % 2 == 0}

    => [70, 72, 74, 76, 78]

    ```


    由于 `select` 返回一个数组，你可以级联 `select` 调用。例如，你可以使用一个 `select` 代码块选择偶数，然后通过 `map` 调用将它们平方。例如：


    ```

    [1,2,3,4,5].select do |number|

    number%2==0

    end.map do |even_number|

    even_number * even_number

    end

    => [4, 16]

    ```


    许多更复杂的操作都可以通过与 `select` 调用级联来解决。


    # 3. 复杂解决方案


    本节中的示例将向你展示如何使用 `map`、`reduce` 和 `select` 来解决更复杂的问题。我将从一个关于调试的部分开始，然后介绍复杂的解决方案。请先阅读调试部分，因为这是理解问题以及深入理解
    `map`、`reduce` 和 `select` 的关键。


    ## `Map`、`Reduce` 和 `Select` 的调试代码块


    在解决问题的过程中，了解问题的最佳方法是插入如 `puts` 这样的打印语句，来观察循环执行时发生了什么。


    ### 调试 `Map` 代码块


    需要记住的是，`map` 在每次运行代码块时都会对集合中的每个元素进行操作。调试时，你想看到代码块如何对每个元素进行操作。


    ```

    [1,2,3,4,5].map do |number|

    result = number*number

    puts "The result of the function on element: #{number} is #{result}"

    result

    end

    ```


    将结果保存在一个局部变量中很重要，这样你才能将它作为代码块的最后一条语句返回。如果不这样做，`puts` 语句的结果将会被返回（通常是 `nil`）。


    ### 调试 `Reduce` 代码块


    调试 `reduce` 稍有不同，因为备忘录会在元素之间传递。因此，你需要打印出元素以及备忘录。


    ```

    final_answer =

    [1,2,3,4,5].reduce(0) do |memo, number|

    memo = memo + number

    puts "After operating on number: #{number}, the memo is #{memo.inspect} "

    memo

    end

    After operating on number: 1, the memo is 1

    After operating on number: 2, the memo is 3

    After operating on number: 3, the memo is 6

    After operating on number: 4, the memo is 10

    After operating on number: 5, the memo is 15

    => 15

    ```


    再次强调，确保在打印备忘录之前保存它，然后在代码块结束时返回它。


    如果你在 `reduce` 代码块中使用 `memo` 来构建不同的数据结构，检查备忘录对于收敛到一个好的解决方案变得极其有用。


    ### 调试 `Select` 代码块


    调试 `select` 很简单，因为你唯一需要知道的是谓词对于特定元素是否为 `true`。


    例如，一个只保留偶数（`number%2==0`）的 `select` 过滤器可以这样调试：


    ```

    [1,2,3,4,5].select do |number|

    predicate = number%2==0

    puts "The predicate is #{predicate} for number #{number}"

    predicate

    end

    The predicate is false for number 1

    The predicate is true for number 2

    The predicate is false for number 3

    The predicate is true for number 4

    The predicate is false for number 5

    => [2, 4]

    ```


    在这里，你可以看到只有那些谓词为 `true` 的数字才会出现在结果中（`[2,4]`）。

