    # Denormalize a Data Set


    Sometimes, you have a normalized data set that you want to denormalize for human
    use.


    For example, you may have a data set extracted from an SQL database. The first
    table is a list of names, uniquely identified by an ID, with each row formatted
    as `{id,name}`. (Note that there are two different Johns).


    ```

    1,John

    2,Jack

    3,Jim

    4,Jared

    5,John

    ```


    Then, you have a list of phone numbers with a unique ID, and a unique user ID,
    but phone numbers can be duplicated (because two people might share a phone);
    however, each entry is associated with a user. The format is `{id, user_id, phone_number}`.
    For example:


    ```

    1,1,555-2344

    2,1,555-1111

    3,2,555-0000

    4,3,555-0000

    5,4,555-6666

    7,5,555-7777

    8,5,555-2344

    ```


    However, you would like the denormalized list to look like this for easy user
    consumption:


