    This program is used as a programming question. Write a program to go through
    a list of integers 1..N. If the number is divisible by 2, print “fizz”; if it
    is divisible by 3, print “buzz”; if it is divisible by 2 and 3, print “fizzbuzz”;
    otherwise, print the number.


