    \n# 1. 基础 Ruby\n\n本节将介绍或帮助你回顾使用 Ruby 命令行的基本方式，以及一些相关的 Ruby 编码技巧。\n\n如果你已经熟悉 Ruby\
    \ 编程并且对 Ruby 的 Enumerable 库有较好的理解，可以跳过本节。\n\n## 命令行\n\n安装 Ruby 后，你可以在 Windows、Linux\
    \ 或 Mac OSX 上启动交互式命令行。我使用的是 Windows。\n\n```\nC:\\>  irb\nirb(main):001:0>\n```\n\
    \n为简洁起见，我不会每次都写出完整的`irb`提示符。\n\n你可以逐行执行 Ruby 语句。每个表达式返回的值前面都会有`⇒`。\n\n```\nirb>\
    \ a = 4\n=> 4\nirb> a\n=> 4\nirb> a + 7\n=> 11\n```\n\n你也可以将多条语句放在同一行，用分号隔开。\n\
    \n```\nirb> list = [\"one\", \"two\",\"three\"];1\n=>1\nirb> list\n=>[\"one\"\
    , \"two\", \"three\"]\n```\n\n你也可以编写跨越多行的语句。\n\n```\nirb> [2,3,4,5].each do |n|\n\
    irb>    if n%2==0\nirb>        puts \"even\"\nirb>    else\nirb>        puts \"\
    odd\"\nirb>    end\nirb> end\n=> \"even\"\n=> \"odd\"\n=> \"even\"\n=> \"odd\"\
    \n```\n\n你可以将代码放入一个名为`sample.rb`的文件中，并将其放置在与运行`irb`相同的目录或文件夹中。\n\n```ruby\n1 \
    \ [2,3,4,5].each do |n|\n2      if n%2 == 0\n3          puts \"even\"\n4     \
    \ else\n5          puts \"odd\"\n6      end\n7  end\n```\n\n然后，在`irb`中：\n\n```\n\
    irb> load \"sample.rb\"\nirb> end\n=> \"even\"\n=> \"odd\"\n=> \"even\"\n=> \"\
    odd\"\nirb>\n```\n\n你也可以从文本编辑器复制代码块并直接粘贴到命令行中，以获得相同的结果，只要你在缩进时只使用空格。（如果从命令提示符加载文件，使用制表符进行缩进是可以正常工作的，但如果直接将制表符粘贴到`irb`中，则会产生错误）。\n\
    \n你可以将本书中的代码示例直接输入到`irb`中，或者输入到文本编辑器中，然后按刚才所示的方式加载文件。\n\n## 对象作用域\n\n在 Ruby 程序中，对对象`obj`执行方法`f`的一般方式如下：\n\
    \n```ruby\nobj.f\n```\n\n无论你是在 Ruby 程序中还是在命令行中，情况都是如此。当代码位于主程序文件中，或者位于`irb`命令行解释器中时，许多函数（例如`puts`）都会有一个隐含的上下文。这就是为什么你可以这么做：\n\
    \n```ruby\nputs \"Hello world\"\n```\n\n你不需要指定一个类来限定`puts`，因为`puts`是底层上下文对象的一个方法。\n\
    \n## 字符串\n\n字符串是所有语言中的基本构造。让我们看看本书中使用的一些基本操作。请自行在`irb`命令行中尝试它们。\n\n`length` 或\
    \ `size`\n\n*   返回字符串的长度。\n\n`downcase`\n\n*   将所有字母转换为小写。\n\n`upcase`\n\n*  \
    \ 将所有字母转换为大写。\n\n`capitalize`\n\n*   将字符串的第一个字母大写。\n\n`split()`\n\n*   在子字符串中搜索参数字符串，并将字符串分割成一个数组，该数组包含`split`参数两侧的子字符串，而`split`参数的子字符串被丢弃。如果没有匹配项，则返回包含整个字符串的数组：\n\
    \n    ```\n    irb> base_string = \"abc def  ghi\"\n    irb> base_string.split(\"\
    \ \")\n    => [\"abc\",\"def\",\"ghi\"]\n    irb> base_string.split(\"  \")\n\
    \    => [\"abc def\",\"ghi\"]\n    irb> base_string.split(\" d\")\n    => [\"\
    abc\",\"ef ghi\"]\n    irb> base_string.split(\"efghi\")\n    => [\"abc def ghi\"\
    ]\n    ```\n\n`join()`\n\n*   将字符串数组的每个元素与`join`参数中的字符串作为分隔符连接起来。\n\n    ```\n\
    \    irb> stringlist = [\"This\", \"is\", \"a\", \"sentence\"]\n    irb> stringlist.join(\"\
    \ \")\n    => \"This is a sentence\"\n    irb> stringlist.join(\",\")\n    =>\
    \ \"This,is,a,sentence\"\n    irb> stringlist.join(\" A SPACE \")\n    => \"This\
    \ A SPACE is A SPACE a A SPACE sentence \"\n    ```\n\n字符串插值\n\n*   允许你定义一个带有参数的字符串模板。字符串`#{}`为你提供了一个放置变量的位置。\n\
    \n    ```\n    irb> first = \"Jack\"; last = \"Black\"\n    irb> full_name = \"\
    #{first} #{last}\"\n    => \"Jack Black\"\n    ```\n\n*   这在遍历列表时尤其有用：\n\n   \
    \ ```\n    irb> smith_brothers = [\"Terry\", \"Jerry\", \"Harry\"]\n    irb> smith_brothers.each{|brother|\
    \ puts \"#{brother} Smith\"}\n    Terry Smith\n    Jerry Smith\n    Harry Smith\n\
    \    => [\"Terry\", \"Jerry\", \"Harry\"]\n    ```\n\n*   C/C++ 程序员会认识到字符串插值与\
    \ C 标准库中的`sprintf`函数类似。\n\n## 数组\n\nRuby 中的数组与其他语言中的数组类似。它们是由整数（例如 0,1,2,...）索引的事物的集合。在\
    \ Ruby 中，数组可以在一个索引处包含任何 Ruby 对象。Ruby 中的数组索引从`0`开始。\n\n数组实现了 Ruby 的 Enumerable\
    \ 接口，因此它们将拥有诸如`each`、`map`、`reduce`、`select`等关键方法。"
