- fmt: '# Annotate a Sequence of Sales with Running Total


    Start with a sequence of numbers—say, representing the dollar value of sales.


    ```

    sales_data = [1,2,4,7,9,11]

    ```


    Annotate each number with the current running total. The final list should look
    like this:


    ```

    [[1,1],[2,3],[4,7],[7,14],[9,23],[11,34]]

    ```


    At first glance, this looks like an application for `map()`, because we are annotating
    each sales figure with a number. However, the number is a cumulative total of
    previous sales figures, which intuitively suggests using `reduce()`.


    For example, one of the following equivalent operations:


    ```

    [1,2,4,7,9,11].reduce(0,:+)

    ```


    or


    ```

    [1,2,4,7,9,11].reduce(0){|run_total, sales_fig| run_total + sales_fig}

    ```


    or


    ```

    [1,2,4,7,9,11].reduce(0) do |running_total, sales_figure|

    running_total + sales_figure

    end

    ```


    This yields a total of 34.


    Also, we know that our result will be an array of arrays, and our initial value
    will be a blank array. Also, each iteration will have to push an array of two
    elements into the initial array. The first element of the inner array holds the
    current sales figure, while the second one holds the running total. Try the following
    to get the structure right:


    ```

    test1 =

    sales_data.reduce([]) do |memo, sales_figure|

    memo.push([sales_figure, 666])

    end

    ```


    This yields the following:


    ```

    [[1, 666], [2, 666], [4, 666], [7, 666], [9, 666], [11, 666]]

    ```


    We''re on the right track, but we now have to figure out how to get the running
    total into the second element of the inner arrays. The running total, of course,
    is the last cumulative total plus the current sales figure.


    ```

    test2 =

    sales_data.reduce([]) do |memo, sales_figure|

    memo.push([sales_figure, memo.last[-1] + sales_figure])

    end

    ```


    This throws up an exception because `memo.last` has nothing in it on the first
    run of the iteration. We need to handle that case by assigning it a 0, as follows:


    ```

    test2 =

    sales_data.reduce([]) do |memo, sales_figure|

    last_total = memo.last.nil? ? 0 : memo.last[1]

    memo.push([sales_figure, last_total + sales_figure])

    end

    ```


    This yields the correct answer:


    ```

    [[1, 1], [2, 3], [4, 7], [7, 14], [9, 23], [11, 34]]

    ```


    ## Pascal''s Triangle


    A classic problem in computer science is the one of generating Pascal''s triangle.
    For example, a six-row triangle looks like this:


    ```

    1

    1  1

    1  2  1

    1  3  3  1

    1  4  6  4  1

    1  5 10 10  5  1

    1  6 15 20 15  6  1

    ```


    In general, if one stores it as a two-dimensional array, the formula is as follows:


    ```

    a[n][0] = 1   # where n >=0

    a[n][n] = 1

    a[n][m] = a[n-1][m] + a[n-1][m-1]

    ```


    First, this is obviously a two-dimensional array. So, it will look something like
    this for a four-row triangle:


    ```

    [[1],[1,1],[1,2,1],[1,3,3,1]]

    ```


    For convenient printing, we''ll just do this for now:


    ```

    triangle.each{|row| p row.inspect}

    ```


    Given that we''re building a structure of arrays, it seems like a good fit for
    using `reduce()`. The initial value is `[]`.


    ```

    triangle = (0..5).reduce([]) do |memo, n|

    memo.push []

    end

    triangle.each{|row| p row.inspect}

    "[]"

    "[]"

    "[]"

    "[]"

    "[]"

    "[]"

    => [[], [], [], [], [], []]

    ```


    That yields an array of arrays, but not enough is contained in it. However, we
    know that the first and last values are 1. We can default the rest of the values
    to zero. And we know that each array has `n-1` elements. (Note that `row[-1]`
    is the way to denote the last element of an array).


    ```

    triangle = (0..5).reduce([]) do |memo, n|

    row = n==0 ? [] : Array.new(n+1)

    row[0] = 1

    row[-1] = 1

    memo << row

    end

    triangle.each{|row| p row.inspect}

    ```


    This yields:


    ```

    "[1]"

    "[1, 1]"

    "[1, nil, 1]"

    "[1, nil, nil, 1]"

    "[1, nil, nil, nil, 1]"

    "[1, nil, nil, nil, nil, 1]"

    => [[1], [1, 1], [1, nil, 1], [1, nil, nil, 1], [1, nil, nil, nil, 1], [1, nil,
    nil, nil, nil, 1]]

    ```


    The structure is taking shape, but we also know that the nth row is a function
    of the previous row. So, we need to dig back to the last row and muck with it
    to generate the next row.


    ```

    triangle = (0..5).reduce([]) do |memo, n|

    if n==0

    row = [1]

    else

    prev = memo[-1]

    row = prev.each_cons(2).map { |a,b| a+b }

    row.unshift(1)

    row.push(1)

    end

    memo << row

    end

    triangle.each{|row| p row.inspect}

    ```


    This yields:


    ```

    "[1]"

