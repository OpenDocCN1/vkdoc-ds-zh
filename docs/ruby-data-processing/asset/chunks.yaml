    Hewlett-Packard calculators used by engineering geeks back in the 1980s when I
    went to school). It lets you avoid using parentheses. Processing is easier because
    one only needs to use a stack. As each token (number or operator) is read, it
    is pushed onto the stack . When an operator is pushed on the stack , it is a special
    case. The operator is popped off the stack along with the next two elements, which
    are the operands, and the operation is performed. The result is pushed back on
    the stack.


    So, for example, the processing of the expression


    ```

