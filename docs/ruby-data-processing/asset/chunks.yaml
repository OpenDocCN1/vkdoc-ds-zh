    ## 按区号分组


    有时，你需要根据某个元素的函数来对数据集进行分组。考虑以下电话号码列表：


    ```

    John,613-555-1234

    Matt,613-555-2345

    Andrew,613-555-3456

    Bob,416-555-2222

    Sheila,905-555-7777

    Sara,416-555-9999

    Grocery,416-492-9999

    Pizza,416-967-1111

    Gabers,613-310-7777

    Shah,905-555-1212

    ```


    你需要根据区号来对列表进行分组。本例中，区号是每个电话号码的前三位数字。


    通过对电话号码执行 `split()` 并取第一个元素（`索引 0`），就可以提取出区号。例如：


    ```ruby

    phone_number = "613-555-1234"

    area_code = phone_number.split("-")[0]

    => "613"

    ```


    一旦获取到区号，它就可以作为以区号为键的 `Hash` 的键。在我们的示例中：


    ```ruby

    area_code_groups[area_code] = phone number

    ```


    但是，如果某个区号下有多个号码，我们就需要一个数组。对于新的区号，如果对应的数组不存在，则必须创建一个新数组，如下所示：


    ```ruby

    if area_code_groups[area_code].nil?

    area_code_groups[area_code] = [phone_number]

    else

    area_code_groups[area_code].push phone_number

    end

    ```


    因此，完整的代码如下：


    ```ruby

    phonelist_text.split("\n").map do |row|

    row.split(",")

    end.map do |split_row|

    [split_row[0], split_row[1].split("-")]

    end.reduce({}) do |area_code_groups, ac_split_row|

    if area_code_groups[ac_split_row[1][0]].nil?

    area_code_groups[ac_split_row[1][0]] = [ [ac_split_row[0], ac_split_row[1].join("-")].join(",")
    ]

    else

    area_code_groups[ac_split_row[1][0]].push [ac_split_row[0], ac_split_row[1].join("-")].join(",")

    end

    area_code_groups

    end

    ```'
- fmt: '# Sliding Window Average


    Sometimes you have a data set that varies widely, but the long-term norm follows
    a set pattern. Suppose you have a list of fall temperatures in Ottawa from October
    1 through October 31.


    ```

    dailytemps = [10,20,22,23,15,18,17,10,10,10,17,20,21,18,8,16,20,8,7,8,8,18,23,24\

    ,5,6,15,18,19,0,2]

    ```


    You want to get the average of the last five days. For the first four days, just
    take the average of the previous four days. For the first three days, just the
    average of previous three days, and so on.


    We can use `reduce` because we’re doing operations that require a memo of previous
    calculations. Let us see if we can find the last five temperatures. The memo initializes
    with an array of five `nil`s. On each iteration, we’ll push the temperature onto
    the end of the memo and shift the oldest one off the memo. We’ll only test it
    on the first seven elements to save space. See here:


    ```

    initial_last_5 = [nil,nil,nil,nil,nil]

    dailytemps.first(7).reduce(initial_last_5) do |memo, temperature|

    memo.push temperature

    memo.shift

    puts "After pushing #{temperature}, the last 5 are: #{memo.inspect}"

    memo

    end

    After pushing 10, the last 5 are: [nil, nil, nil, nil, 10]

    After pushing 20, the last 5 are: [nil, nil, nil, 10, 20]

    After pushing 22, the last 5 are: [nil, nil, 10, 20, 22]

    After pushing 23, the last 5 are: [nil, 10, 20, 22, 23]

    After pushing 15, the last 5 are: [10, 20, 22, 23, 15]

    After pushing 18, the last 5 are: [20, 22, 23, 15, 18]

    After pushing 17, the last 5 are: [22, 23, 15, 18, 17]

    => [22, 23, 15, 18, 17]

    ```


    We are saving the last five temperatures successfully after each step. Now, we
    need to save the average as well. To do that, we have to start with an initial
    array of the last five, as well as an initial average. A `Hash` is a good structure
    for the memo. The first key is the average, while the last key is the array of
    the last five elements. When we push the temperature, we need to do it to `memo[:last_5]`
    instead of just to `memo`. Also, the average of the last five temperatures is
    the sum of the non-`nil` elements divided by the number of non-`nil` elements.
    (`compact` gets rid of non-`nil` elements, and `length` is the number of non-`nil`
    elements remaining). For example:


    ```

    example_5 = [nil,nil,6,8,13]

    average = (example_5.compact.reduce(0,:+)) / (example_5.compact.length)

    => 9

    ```


    Nine is the correct answer for the average of the three non-`nil` numbers.


    Now, we’ll apply that to the calculation as follows:


    ```

    initial_hash = {average: 0, last_5: [nil,nil,nil,nil,nil]}

    dailytemps.first(7).reduce(initial_hash) do |memo, temperature|

    memo[:last_5].push temperature

    memo[:last_5].shift

    memo[:average] =

    (memo[:last_5].compact.reduce(0,:+)) / (Float(memo[:last_5].compact.leng\

    th))

    puts "After pushing #{temperature}, the last 5 are: #{memo.inspect}"

    memo

    end

    ```


    The output looks like this:


    ```

    After pushing 10, the memo is: {:average=>10.0, :last_5=>[nil, nil, nil, nil,
    10\

