  \ [zero_four_tuple]\nend\ncluster_list\nend.map do |cluster |\n(cluster.reduce(0)\
  \ do |sum, zero_four_tuple|\nsum + zero_four_tuple[0]\nend / cluster.size).round(4)\n\
