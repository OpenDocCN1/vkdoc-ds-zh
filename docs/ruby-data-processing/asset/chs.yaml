- '# 清洗数据集


  分析数据集时一个常见的问题是脏数据。例如，你有一个名为`name_prov.txt`的 CSV 文件，里面是姓名和省份列表。


  ```

  John,Ontario

  Azamat,ON

  Hafaz,Alta

  Tamir,QC

  Jacques,Quebec

  Bill,AB

  Bart,Ont

  Carn,Que

  Dave,Alta

  Don,SK

  Fred,Saskatchewan

  Gary,Que

  Hari,Sask

  Ian,SK

  Jerry,Alberta

  Karl,ON

  ```


  加拿大人看到这个列表通常会知道，"ON"、"Ont"和"Ontario"都代表安大略省，"AB"、"Alta"和"Alberta"代表阿尔伯塔省，其他省份也类似。处理这个问题的一种方法是清洗数据集并标准化省份名称。数据转换将接收"ON"、"Ont"和"Ontario"中的任意一个，并将其替换为标准名称"Ontario"。（作为数据清洗者，你可以选择任何一种形式。我这里选择使用全称）。


  第一步是获取省份列表：


  ```

  province_file = File.open("name_prov.txt").read.split(("\n")

  ```


  这会得到一个行数组。现在，我们将每一行按逗号拆分，并只取第二个元素（数组中的索引 1）


  ```

  provinces = province_file.map do |row|

  row.split(",")[1]

  end

  => ["Ontario","ON","Alta","QC","Quebec","AB","Ont","Que","Alta","SK","Saskatchew\

  an","Que","Sask","SK","Alberta","ON"]

  ```


  这样就得到了一个省份名称数组，但有些名称是重复的。我们需要去重后的名称。为此，我们使用数组方法`uniq()`：


  ```

  provinces.uniq

  ```


  这样我们就得到了一个无重复的省份标签列表。


  现在，我们来编码标准化规则。我们将使用一个`Hash`（哈希表）来查找名称并返回标准名称。


  ```

  standard_name_lookup =

  { "ON" => "Ontario",

  "Ont" => "Ontario",

  "Ontario" => "Ontario",

  "Alta" => "Alberta",

  "Alberta" => "Alberta",

  "AB" => "Alberta",

  "QC" => "Quebec",

  "Que" => "Quebec",

  "Quebec" => "Quebec",

  "SK" => "Saskatchewan",

  "Sask" => "Saskatchewan",

  "Saskatchewan" => "Saskatchewan"

  }

  ```


  现在，如果我们要查找名为"AB"的省份，只需这样做：


  ```

  standard_name_lookup["AB"]

  => "Alberta"

  ```


  我们希望将这些规则编码到一个名为`standard_name_lookup.txt`的 CSV 文件中，内容如下所示：


  ```

  ON,Ontario

  Ont,Ontario

  Ontario,Ontario

  Alta,Alberta

  Alberta,Alberta

  AB,Alberta

  QC,Quebec

  Que,Quebec

  Quebec,Quebec

  SK,Saskatchewan

  Sask,Saskatchewan

  Saskatchewan,Saskatchewan

  ```


  这使得查找策略数据（编码在`standard_name_lookup.txt`中）与源代码分离。这样，如果你想要更改查找策略，只需编辑此文件——无需更改软件。


  那么，读取文件并将其转换为`Hash`就变成了：


  ```

  standard_name_lookup =

  File.open("standard_name_lookup.txt","r").read.split("\n").map do |row|

  row.split(",")

  end.reduce({}) do |lookup_table, row|

  lookup_table.merge row[0] => row[1]

  end

  ```


  因此，剩下的工作就是用标准名称替换各种省份标签：


  ```

  standardized_province_file =

  province_file.map do |row|

  row.split(",")

  end.map do |split_row|

  [split_row[0], standard_name_lookup[split_row[1]]

  end

  ```


  这会得到一个名称已被替换的数组。接下来只需要用逗号连接每个行的元素，然后再用回车连接每一行。完整的代码就变成如下所示：


  ```

  standard_name_lookup =

  File.open("standard_name_lookup.txt","r").read.split("\n").map do |row|

  row.split(",")

  end.reduce({}) do |lookup_table, row|

  lookup_table.merge row[0] => row[1]

  end

  standardized_province_file =

  province_file.map do |row|

  row.split(",")

  end.map do |split_row|

  [split_row[0], standard_name_lookup[split_row[1]]

  end.map do |standardized_split_row|

  standardized_split_row.join(",")

  end.join("\n")

  ```




  '
- "# 为销售数据序列添加累计总额注释\n\n从一组数字序列开始——例如，表示销售额的美元数值。\n\n```\nsales_data = [1,2,4,7,9,11]\n\
  ```\n\n为每个数字添加当前的累计总额注释。最终列表应如下所示：\n\n```\n[[1,1],[2,3],[4,7],[7,14],[9,23],[11,34]]\n\
  ```\n\n乍看之下，这似乎是 `map()` 的一个应用，因为我们正在为每个销售额数据添加注解数字。然而，这个数字是先前销售额数据的累计总和，直觉上表明应该使用\
  \ `reduce()`。\n\n例如，以下任一等效操作：\n\n```\n[1,2,4,7,9,11].reduce(0,:+)\n```\n\n或\n\n\
  ```\n[1,2,4,7,9,11].reduce(0){|run_total, sales_fig| run_total + sales_fig}\n```\n\
  \n或\n\n```\n[1,2,4,7,9,11].reduce(0) do |running_total, sales_figure|\nrunning_total\
  \ + sales_figure\nend\n```\n\n这将得出总计为 34。\n\n此外，我们知道结果将是一个数组的数组，并且初始值将是一个空数组。同时，每次迭代都必须将一个包含两个元素的数组推入初始数组。内部数组的第一个元素保存当前销售额，第二个元素保存累计总额。尝试以下操作以构建正确的结构：\n\
  \n```\ntest1 =\nsales_data.reduce([]) do |memo, sales_figure|\nmemo.push([sales_figure,\
  \ 666])\nend\n```\n\n这将得出以下结果：\n\n```\n[[1, 666], [2, 666], [4, 666], [7, 666],\
  \ [9, 666], [11, 666]]\n```\n\n我们走对了方向，但现在需要弄清楚如何将累计总额放入内部数组的第二个元素。当然，累计总额就是上次的累计总额加上当前的销售额。\n\
  \n```\ntest2 =\nsales_data.reduce([]) do |memo, sales_figure|\nmemo.push([sales_figure,\
  \ memo.last[-1] + sales_figure])\nend\n```\n\n这会引发一个异常，因为在第一次迭代运行时 `memo.last` 中没有任何内容。我们需要通过将其赋值为\
  \ 0 来处理这种情况，如下所示：\n\n```\ntest2 =\nsales_data.reduce([]) do |memo, sales_figure|\n\
  last_total = memo.last.nil? ? 0 : memo.last[1]\nmemo.push([sales_figure, last_total\
  \ + sales_figure])\nend\n```\n\n这将得出正确答案：\n\n```\n[[1, 1], [2, 3], [4, 7], [7, 14],\
  \ [9, 23], [11, 34]]\n```\n\n## 杨辉三角\n\n计算机科学中的一个经典问题是生成杨辉三角。例如，一个六行的三角形如下所示：\n\n\
  ```\n1\n1  1\n1  2  1\n1  3  3  1\n1  4  6  4  1\n1  5 10 10  5  1\n1  6 15 20 15\
  \  6  1\n```\n\n通常，如果将其存储为二维数组，公式如下：\n\n```\na[n][0] = 1   # 其中 n >=0\na[n][n] =\
  \ 1\na[n][m] = a[n-1][m] + a[n-1][m-1]\n```\n\n首先，这显然是一个二维数组。所以，对于一个四行的三角形，它看起来像这样：\n\
  \n```\n[[1],[1,1],[1,2,1],[1,3,3,1]]\n```\n\n为了方便打印，我们暂时这样做：\n\n```\ntriangle.each{|row|\
  \ p row.inspect}\n```\n\n考虑到我们正在构建一个数组的结构，使用 `reduce()` 似乎很合适。初始值是 `[]`。\n\n```\n\
  triangle = (0..5).reduce([]) do |memo, n|\nmemo.push []\nend\ntriangle.each{|row|\
  \ p row.inspect}\n\"[]\"\n\"[]\"\n\"[]\"\n\"[]\"\n\"[]\"\n\"[]\"\n=> [[], [], [],\
  \ [], [], []]\n```\n\n这生成了一个数组的数组，但其中包含的内容不够。不过，我们知道第一个和最后一个值是 1。我们可以将其余的值默认为零。我们还知道每个数组有\
  \ `n-1` 个元素。（注意 `row[-1]` 是表示数组最后一个元素的方法）。\n\n```\ntriangle = (0..5).reduce([])\
  \ do |memo, n|\nrow = n==0 ? [] : Array.new(n+1)\nrow[0] = 1\nrow[-1] = 1\nmemo\
  \ << row\nend\ntriangle.each{|row| p row.inspect}\n```\n\n这得出：\n\n```\n\"[1]\"\n\
  \"[1, 1]\"\n\"[1, nil, 1]\"\n\"[1, nil, nil, 1]\"\n\"[1, nil, nil, nil, 1]\"\n\"\
  [1, nil, nil, nil, nil, 1]\"\n=> [[1], [1, 1], [1, nil, 1], [1, nil, nil, 1], [1,\
  \ nil, nil, nil, 1], [1, nil, nil, nil, nil, 1]]\n```\n\n结构逐渐成形，但我们也知道第 n 行是前一行的一个函数。因此，我们需要回溯到上一行并进行处理以生成下一行。\n\
  \n```\ntriangle = (0..5).reduce([]) do |memo, n|\nif n==0\nrow = [1]\nelse\nprev\
  \ = memo[-1]\nrow = prev.each_cons(2).map { |a,b| a+b }\nrow.unshift(1)\nrow.push(1)\n\
  end\nmemo << row\nend\ntriangle.each{|row| p row.inspect}\n```\n\n这得出：\n\n```\n\"\
  [1]\"\n\"[1, 1]\"\n\"[1, 2, 1]\"\n\"[1, 3, 3, 1]\"\n\"[1, 4, 6, 4, 1]\"\n\"[1, 5,\
  \ 10, 10, 5, 1]\"\n=> [[1], [1, 1], [1, 2, 1], [1, 3, 3, 1], [1, 4, 6, 4, 1], [1,\
  \ 5, 10, 10, 5, 1]]\n```\n\n这好一些了。行开始充实起来。现在，要构建当前行，你需要前一行。\n\n例如，你可以对前一行使用 `reduce`\
  \ 来得到当前行。要获取一行的最后两个元素，你需要记住它们。例如：\n\n```\n[1,3,3,1].reduce([nil,nil]) do |memo,\
  \ element|\nmemo.push element\nmemo.shift\nputs \"After pushing #{element}, the\
  \ memo is #{memo.inspect}\"\nmemo\nend\nAfter pushing 1, the memo is [nil, 1]\n\
  After pushing 3, the memo is [1, 3]\nAfter pushing 3, the memo is [3, 3]\nAfter\
  \ pushing 1, the memo is [3, 1]\n=> [3, 1]\n```\n\n我们越来越接近了。让我们把和保存在 `memo` 中。现在，请记住\
  \ `memo` 的结构必须改变。我们需要一个地方来保存最后两个元素的数组以及它们的和。因此，`memo` 将是一个 `Hash`，以 `:sum` 和 `:last_2`\
  \ 作为键。\n\n```\ninitial_memo = {sum: 0, last_2: [nil,nil]}\n[1,3,3,1].reduce(initial_memo)\
  \ do |memo, element|\nmemo[:last_2].push element\nmemo[:last_2].shift\nmemo[:sum]\
  \ = memo[:last_2].compact.reduce(0,:+)\nputs \"After pushing element #{element},\
  \ memo is #{memo}\"\nmemo\nend\n```\n\n结果如下：\n\n```\nAfter pushing element 1, memo\
  \ is {:sum=>1, :last_2=>[nil, 1]}\nAfter pushing element 3, memo is {:sum=>4, :last_2=>[1,\
  \ 3]}\nAfter pushing element 3, memo is {:sum=>6, :last_2=>[3, 3]}\nAfter pushing\
  \ element 1, memo is {:sum=>4, :last_2=>[3, 1]}\n=> {:sum=>4, :last_2=>[3, 1]}\n\
  ```\n\n我们更接近了。这个和遵循模式 1,4,6,4，这几乎就是下一行（缺少最后一个 1）。所以，现在我们需要将下一行保存在 `memo` 中，然后在计算完成时将其提取出来，如下所示：\n\
  \n```\ninitial_memo = {last_2: [nil,nil], next_row: []}\n[1,3,3,1].reduce(initial_memo)\
  \ do |memo, element|\nmemo[:last_2].push element\nmemo[:last_2].shift\nmemo[:next_row].push\
  \ memo[:last_2].compact.reduce(0,:+)\nputs \"After pushing element #{element}, memo\
  \ is #{memo}\"\nmemo\nend\n```\n\n结果如下：\n\n\n\n```\n推送元素 1 后，memo 为 {:last_2=>[nil,\
  \ 1], :next_row=>[1]}\n推送元素 3 后，memo 为 {:last_2=>[1, 3], :next_row=>[1, 4]}\n推送元素\
  \ 3 后，memo 为 {:last_2=>[3, 3], :next_row=>[1, 4, 6]}\n推送元素 1 后，memo 为 {:last_2=>[3,\
  \ 1], :next_row=>[1, 4, 6, 4]}\n=> {:last_2=>[3, 1], :next_row=>[1, 4, 6, 4]}\n\
  ```\n\n差不多完成了！我们只需要从结果中提取 `:next_row`，然后在下一行的末尾添加一个 1。同时我也会移除 `puts` 语句。\n\n```\n\
  initial_memo = {last_2: [nil,nil], next_row: []}\n[1,3,3,1].reduce(initial_memo)\
  \ do |memo, element|\n  memo[:last_2].push element\n  memo[:last_2].shift\n  memo[:next_row].push\
  \ memo[:last_2].compact.reduce(0,:+)\n  memo\nend[:next_row].push 1\n=> [1, 4, 6,\
  \ 4, 1]\n```\n\n于是，我们得到了每一行的公式。来看看它对几个例子是否有效。首先是顶层行：\n\n```\ninitial_memo = {last_2:\
  \ [nil,nil], next_row: []}\n[1].reduce(initial_memo) do |memo, element|\n  memo[:last_2].push\
  \ element\n  memo[:last_2].shift\n  memo[:next_row].push memo[:last_2].compact.reduce(0,:+)\n\
  \  memo\nend[:next_row].push 1\n=> [1, 1]\n```\n\n如果是空行呢（例如 `[]`）？\n\n```\ninitial_memo\
  \ = {last_2: [nil,nil], next_row: []}\n[].reduce(initial_memo) do |memo, element|\n\
  \  memo[:last_2].push element\n  memo[:last_2].shift\n  memo[:next_row].push memo[:last_2].compact.reduce(0,:+)\n\
  \  memo\nend[:next_row].push 1\n=> [1]\n```\n\n看起来没问题。接下来需要对每一行都执行这个操作。我们再次使用 `reduce`，因为每次迭代都会将\
  \ memo 传递到下一次。尝试如下（比如，七行）：\n\n```\ninital_memo = [[]]\n(1..7).reduce([[]]) do |memo,\
  \ num|\ninitial_memo = {last_2: [nil,nil], next_row: []}\nmemo.push(\n  memo[-1].reduce(initial_memo)\
  \ do |memo, element|\n    memo[:last_2].push element\n    memo[:last_2].shift\n\
  \    memo[:next_row].push memo[:last_2].compact.reduce(0,:+)\n    memo\n  end[:next_row].push(1)\n\
  )\nputs \"处理第 #{num} 行后，memo 为 #{memo}\"\nmemo\nend\n```\n\n这样可行。接下来需要移除 `puts`\
  \ 语句并以适当格式打印出来。\n\n```\ninital_memo = [[]]\ntriangle =\n(1..7).reduce([[]]) do |memo,\
  \ num|\ninitial_memo = {last_2: [nil,nil], next_row: []}\nmemo.push(\n  memo[-1].reduce(initial_memo)\
  \ do |memo, element|\n    memo[:last_2].push element\n    memo[:last_2].shift\n\
  \    memo[:next_row].push memo[:last_2].compact.reduce(0,:+)\n    memo\n  end[:next_row].push(1)\n\
  )\nputs \"处理第 #{num} 行后，memo 为 #{memo}\"\nmemo\nend\ntriangle.each{|row| p row.inspect}\n\
  \"[]\"\n\"[1]\"\n\"[1, 1]\"\n\"[1, 2, 1]\"\n\"[1, 3, 3, 1]\"\n\"[1, 4, 6, 4, 1]\"\
  \n\"[1, 5, 10, 10, 5, 1]\"\n\"[1, 6, 15, 20, 15, 6, 1]\"\n```\n\n更简洁的版本如下：\n\n```\n\
  triangle.each{|row| puts row.join (\", \") };1\n\n1,  1\n1,  2,  1\n1,  3,  3, \
  \ 1\n1,  4,  6,  4,  1\n1,  5, 10, 10,  5,  1\n1,  6, 15, 20, 15,  6,  1\n```\n\n\
  ## 逆波兰表示法解析器\n\n描述算术运算的一种方式是使用操作数在前、运算符在后的表示法。例如，表达式\n\n```\n3 + 2\n```\n\n可以写成\n\
  \n```\n3 2 +\n```\n\n这称为后缀表示法或逆波兰表示法（在我上学时的 1980 年代，这曾是惠普计算器的一大特色，深受工程极客们喜爱）。它可以避免使用括号。处理起来也更简单，因为只需要一个栈。每读取一个词法单元（数字或运算符），就将其压入栈中。当运算符被压入栈时，这是一个特殊情况。运算符会与接下来的两个元素（即操作数）一起弹出栈，执行运算，然后将结果压回栈中。\n\
  \n例如，表达式\n\n```\n3 3 4 * 4 7 8 + - * +\n```\n\n的处理过程可以用一系列栈快照来表示，每行对应一个快照。随着词法单元的扫描，栈向右增长；如果运算符被压入栈中，RPN\
  \ 解析器会弹出最后三个词法单元，执行计算，并将答案压回栈中。\n\n```\n3\n3 3\n3 3 4\n3 3 4 *\n3 12           \
  \      (12 是 4*3)\n3 12 4\n3 12 4 7\n3 12 4 7 8\n3 12 4 7 8 +\n3 12 4 15       \
  \     (15 是 7+8)\n3 12 4 15 -\n3 12 -11             (-11 是 4-15)\n3 12 -11 *\n3\
  \ -132               (-132 是 12*(-11))\n3 -132 +\n-129                 (-129 是 3\
  \ + (-132))\n```\n\n那么如何解决这个问题？首先，我们通过以空格分割字符串来对其进行词法分析（这不是最健壮的词法分析方法，但足以应对这个例子）。一旦从字符串中得到了词法单元数组，我们可能需要在每次迭代后记住栈的状态。在\
  \ Ruby 中，可以使用数组的 `push` 和 `pop` 操作将其用作栈。此外，栈的初始值为空数组。试试下面的代码：\n\n```\nexpression\
  \ = \"1 2 2 + 3 * -\"\nanswer = expression.split(\" \").reduce([]) do |stack, token|\n\
  \  stack.push(token)\n  puts \"推送 #{token} 后栈的状态为 #{stack.inspect}\"\n  stack\n\
  end\n```\n\n这将输出以下内容：\n\n```\n推送 1 后栈的状态为 [\"1\"]\n推送 2 后栈的状态为 [\"1\", \"2\"]\n\
  推送 2 后栈的状态为 [\"1\", \"2\", \"2\"]\n推送 + 后栈的状态为 [\"1\", \"2\", \"2\", \"+\"]\n推送\
  \ 3 后栈的状态为 [\"1\", \"2\", \"2\", \"+\", \"3\"]\n推送 * 后栈的状态为 [\"1\", \"2\", \"2\"\
  , \"+\", \"3\", \"*\"]\n推送 - 后栈的状态为 [\"1\", \"2\", \"2\", \"+\", \"3\", \"*\", \"\
  -\"]\n=> [\"1\", \"2\", \"2\", \"+\", \"3\", \"*\", \"-\"]\n```\n\n这样，我们就在每次迭代后正确地保存了栈的状态。现在，我们需要识别运算符\
  \ `+`、`-`、`*` 和 `/`。试试这个：\n\n```\nexpression = \"1 2 2 + 3 * -\"\nanswer = expression.split(\"\
  \ \").reduce([]) do |stack, token|\n  stack.push(token)\n  puts \"推送 #{token} 后栈的状态为\
  \ #{stack.inspect}\"\n  if [\"+\",\"-\",\"*\",\"/\"].include?(token)\n    puts \"\
  \ 词法单元 #{token} 是一个运算符\"\n  end\n  stack\nend\n```\n\n输出如下：\n\n```\n推送 1 后栈的状态为\
  \ [\"1\"]\n推送 2 后栈的状态为 [\"1\", \"2\"]\n推送 2 后栈的状态为 [\"1\", \"2\", \"2\"]\n推送 + 后栈的状态为\
  \ [\"1\", \"2\", \"2\", \"+\"]\n词法单元 + 是一个运算符\n推送 3 后栈的状态为 [\"1\", \"2\", \"2\"\
  , \"+\", \"3\"]\n推送 * 后栈的状态为 [\"1\", \"2\", \"2\", \"+\", \"3\", \"*\"]\n词法单元 *\
  \ 是一个运算符\n推送 - 后栈的状态为 [\"1\", \"2\", \"2\", \"+\", \"3\", \"*\", \"-\"]\n词法单元 -\
  \ 是一个运算符\n=> [\"1\", \"2\", \"2\", \"+\", \"3\", \"*\", \"-\"]\n```\n\n现在，根据 RPN\
  \ 规则，如果词法单元是运算符，我们需要执行运算。要执行运算，我们必须从栈中弹出运算符，然后弹出第一个操作数，最后弹出第二个操作数。我将在第一次遇到运算符时停止这次迭代，以便查看栈的状态。\n\
  \n\n\n```ruby\nexpression = \"1 2 2 + 3 * -\"\nanswer = expression.split(\" \").reduce([])\
  \ do |stack, token|\nstack.push(token)\nputs \"The stack after pushing #{token}\
  \ is #{stack.inspect}\"\nif [\"+\",\"-\",\"*\",\"/\"].include?(token)\nputs \" Token\
  \ #{token} is an operator\"\noperator = stack.pop\nsecond_operand = stack.pop\n\
  first_operand = stack.pop\nputs \" Second operand is #{second_operand}. First operand\
  \ is #{first_operand}\"\nraise \"Stop for a bit\"\nend\nstack\nend\n```\n\n这会打印出以下内容：\n\
  \n```\nThe stack after pushing 1 is [\"1\"]\nThe stack after pushing 2 is [\"1\"\
  , \"2\"]\nThe stack after pushing 2 is [\"1\", \"2\", \"2\"]\nThe stack after pushing\
  \ + is [\"1\", \"2\", \"2\", \"+\"]\nToken + is an operator\nSecond operand is 2\\\
  . First operand is 2\nStop for a bit\n(repl):11:in `block in initialize'\n(repl):2:in\
  \ `each'\n(repl):2:in `reduce'\n(repl):2:in `initialize'\n```\n\n`Stop for a bit`\
  \ 这个异常只让我们到达了第一个运算符。我只是想展示运算符和操作数从栈中被弹出。现在，我们只需向第一个操作数发送 `\"operator\"` 消息，并将第二个操作数作为参数传递。（请记住，5\
  \ 和 7 都是 `Fixnum` 类的 Ruby 对象，它们都有一个名为 `:+` 的方法）。例如，\n\n```ruby\n5 + 7\n```\n\n等同于\n\
  \n```ruby\n5.send(:+,7)\n```\n\n如果你不信，可以在命令行上试试。\n\n现在，从栈中弹出的每个令牌都是字符串。操作数必须转换为整数（使用\
  \ `to_i`），而运算符必须转换为符号（使用 `to_sym`）。因此，代码片段如下所示：\n\n```ruby\nfirst_operand.to_i.send(operator.to_sym,\
  \ second_operand.to_i)\n```\n\n这会告诉解释器调用 `5` 这个对象的 `:+` 方法（因为 `\"+\".to_sym` 是 `:+`），该对象恰好是一个\
  \ `Fixnum`。一旦计算出该结果，就必须将结果重新压入栈中。（`stack` 变量是此次 `reduce` 操作的记忆体）。\n\n```ruby\nexpression\
  \ = \"1 2 2 + 3 * -\"\nanswer = expression.split(\" \").reduce([]) do |stack, token|\n\
  stack.push(token)\nputs \"The stack after pushing #{token} is #{stack.inspect}\"\
  \nif [\"+\",\"-\",\"*\",\"/\"].include?(token)\nputs \" Token #{token} is an operator\"\
  \noperator = stack.pop\nsecond_operand = stack.pop\nfirst_operand = stack.pop\n\
  puts \" Second operand is #{second_operand}. First operand is #{first_operand}\"\
  \nresult = first_operand.to_i.send(operator.to_sym, second_operand.to_i)\nputs \"\
  \ The result of this expression is #{result}\"\nstack.push(result)\nputs \" The\
  \ stack after evaluating the expression is #{stack.inspect}\"\nend\nstack\nend\n\
  ```\n\n这会打印出以下内容：\n\n```\nThe stack after pushing 1 is [\"1\"]\nThe stack after\
  \ pushing 2 is [\"1\", \"2\"]\nThe stack after pushing 2 is [\"1\", \"2\", \"2\"\
  ]\nThe stack after pushing + is [\"1\", \"2\", \"2\", \"+\"]\nToken + is an operator\n\
  Second operand is 2\\. First operand is 2\nThe result of this expression is 4\n\
  The stack after evaluating the expression is [\"1\", 4]\nThe stack after pushing\
  \ 3 is [\"1\", 4, \"3\"]\nThe stack after pushing * is [\"1\", 4, \"3\", \"*\"]\n\
  Token * is an operator\nSecond operand is 3\\. First operand is 4\nThe result of\
  \ this expression is 12\nThe stack after evaluating the expression is [\"1\", 12]\n\
  The stack after pushing - is [\"1\", 12, \"-\"]\nToken - is an operator\nSecond\
  \ operand is 12\\. First operand is 1\nThe result of this expression is -11\nThe\
  \ stack after evaluating the expression is [-11]\n```\n\n现在，要清理代码并打印结果，我们执行以下操作：\n\
  \n```ruby\nexpression = \"1 2 2 + 3 * -\"\nanswer = expression.split(\" \").reduce([])\
  \ do |stack, token|\nstack.push(token)\nif [\"+\",\"-\",\"*\",\"/\"].include?(token)\n\
  operator = stack.pop\nsecond_operand = stack.pop\nfirst_operand = stack.pop\nresult\
  \ = first_operand.to_i.send(operator.to_sym, second_operand.to_i)\nstack.push(result)\n\
  end\nstack\nend[0]\nputs \"The expression is #{expression}. The answer is #{answer}.\"\
  \n```\n\n## 生成队服姓名条列表\n\n假设你有一个简单的文本文件 `names.txt`，里面包含一个名字列表。这些是篮球队里女孩们的名字。\n\n\
  ```\nEmily Muller\nLois Makad\nSophie Wheaton\nAbby Muller\nZoe Gee\nAnastasia Semanova\n\
  Iulia Semanova\nJane Smith\nMegan Sundstrom\nBrunhilda Schmidt\nSally Park\nJill\
  \ Bailey\n```\n\n你想生成一个姓名条列表，用来放在球员的球衣上。除非有两个人姓氏相同，否则只使用姓氏。如果有同姓的情况，那么姓名条应包含名字首字母和姓氏。因此，列表看起来像这样：\n\
  \n```\nE. Muller\nMakad\nWheaton\nA. Muller\nGee\nA. Semanova\nI. Semanova\nSmith\n\
  Sundstrom\nSchmidt\nPark\nBailey\n```\n\n首先，将文件读入一个巨大的字符串：\n\n```ruby\nnames = File.open(\"\
  names.txt\",\"r\").read\n```\n\n你可以像这样将字符串拆分为数组：\n\n```ruby\nnamelist = names.split(\"\
  \\n\")\n```\n\n这会生成一个如下所示的数组：\n\n```\n[\"Emily Muller\", \"Lois Makad\", \"Sophie\
  \ Wheaton\", # 等等\n]\n```\n\n首先，你想用姓氏来注释列表以作辅助：\n\n```ruby\nannotated_namelist =\
  \ namelist.map do |name|\n[name.split(\" \")[1], name]\nend\n```\n\n然后，你想按不同的姓氏对名字进行分组。Ruby\
  \ 哈希是一种按姓氏键存储的有用方式：\n\n```ruby\ngrouped_list =\nannotated_namelist.reduce({}) do\
  \ |memo, annotated_name|\nif memo[annotated_name[0]].nil?\nmemo[annotated_name[0]]\
  \ = [annotated_name[1]]\nelse\nmemo[annotated_name[0]] << annotated_name[1]\nend\n\
  memo\nend\n```\n\n此时，我们已经按不同的姓氏建立了哈希键，它看起来像这样：\n\n```\n{\"Muller\"   =>   [\"Emily\
  \ Muller\", \"Abby Muller\"],\n\"Makad\"    =>   [\"Lois Makad\"],\n\"Wheaton\"\
  \  =>   [\"Sophie Wheaton\"],\n\"Gee\"      =>   [\"Zoe Gee\"],\n\"Semanova\" =>\
  \   [\"Anastasia Semanova\", \"Iulia Semanova\"],\n\"Smith\"     =>   [\"Jane Smith\"\
  ]\n\"Sundstrom\" =>   [\"Megan Sundstrom\"],\n\"Schmidt\"   =>   [\"Brunhilda Schmidt\"\
  ],\n\"Park\"      =>   [\"Sally Park\"],\n\"Bailey\"    =>   [\"Jill Bailey\"]\n\
  }\n```\n\n我们应该注意到，键是字符串，值是一个或多个名字的数组。我们需要将名字简化为姓名条。如果数组中只有一个元素（名字），我们只需拆分字符串并取第二个元素，即姓氏。如果有多个元素，我们需要拆分字符串，取第一个元素的第一个字母，并将其与第二个元素连接起来。详见此处：\n\
  \n```ruby\ngrouped_label_names =\ngrouped_list.map do |key,value|\nif value.size>1\n\
  res = value.map do |name|\n\"#{name.split(' ')[0][0]}. #{name.split(' ')[1]}\"\n\
  end\nres\nelse\nvalue[0].split(' ')[1]\nend\nend\n```\n\n这会生成以下内容：\n\n```\n[[\"\
  E. Muller\", \"A. Muller\"], \"Makad\", \"Wheaton\", \"Gee\", [\"A. Semanova\",\
  \ \"I. Semanova\"], \"Smith\", \"Sundstrom\", \"Schmidt\", \"Park\", \"Bailey\"\
  ]\n```\n\n这已经很接近了。列表只需展平即可：\n\n```ruby\ngrouped_label_names.flatten\n```\n\n这会生成以下内容：\n\
  \n```\n[\"E. Muller\", \"A. Muller\", \"Makad\", \"Wheaton\", \"Gee\", \"A. Semanova\"\
  , \"I. Semanova\", \"Smith\", \"Sundstrom\", \"Schmidt\", \"Park\", \"Bailey\"]\n\
  ```\n\n然后，只需通过回车符连接即可重新构建列表，如下所示：\n\n```ruby\ngrouped_label_names.flatten.join(\"\
  \\n\")\n```\n\n完成后，需要将数组展平并重新构建为文本文件：\n\n```ruby\nnamebar_names =\ngrouped_label_names.flatten.join(\"\
  \\n\")\n```\n\n因此，完整的数据处理解决方案如下：\n\n```ruby\nnamebar_names =\nFile.open(\"names.txt\"\
  ,\"r\").read.split(\"\\n\").map do |name|\n[name.split(\" \")[1], name]\nend.inject({})\
  \ do |memo, annotated_name|\nif memo[annotated_name[0]].nil?\nmemo[annotated_name[0]]\
  \ = [annotated_name[1]]\nelse\nmemo[annotated_name[0]] << annotated_name[1]\nend\n\
  memo\nend.map do |key,value|\nif value.size>1\nres = value.map do |name|\n\"#{name.split('\
  \ ')[0][0]}. #{name.split(' ')[1]}\"\nend\nres\nelse\nvalue[0].split(' ')[1]\nend\n\
  end.flatten.join(\"\\n\")\n```\n\n\n"
- "# 求两个函数的交点\n\n假设你有两个函数：`y = x` 和 `y = 10sin(x)`。你想找到它们的交点。一些已知事实如下：\n\n- `y = 10sin(x)`\
  \ 的周期为 `2*pi`，约等于 6.2，因此每隔半个周期（约 3.14）便有一个真正的零点。\n- `y = 10sin(x)` 的最大值为 10，最小值为\
  \ -10，因此如果我们要沿着直线 `y = x` 进行搜索，可以将 `x` 的取值范围限制在 -10 到 10 之间。\n- 根据微积分知识，我们知道 `y\
  \ = 10sin(x)` 的斜率为 `y = 10cos(x)`，当 `x=0` 以及其他一些位置时，斜率达到最大值 10。\n- 对于斜率为 10 的情况，如果你想让\
  \ `y` 的变化量不超过某个很小的值，那么 `x` 的变化量最多只能是该变化量的十分之一。\n- 当 `y = 10sin(x)` 与 `y = x` 的差值为\
  \ 0 时，即发生交点。但在不完美的现实条件下，我们可以认为，只要差值小于某个值（例如 0.02），就算作交点。\n- 要保证差值小于 0.02，我们必须以该差值的十分之一（即\
  \ 0.002）为步长来测试交点。因此，定义域（即要测试的 `x` 值集合）可以表示如下：\n\n`(-10..10).step(0.002)`\n\n通过以下方式打印出来：\n\
  \n```\n(-10..10).step(0.002).map{|n| n}\n```\n\n这会生成 2000 个待测试的 `x` 值。对于每个这样的值，你需要收集两个函数对应的数值范围。每个范围是一个包含三个元素的数组，由\
  \ `x` 值、第一个函数的值（`y=x`）和第二个函数的值（`y=10sin(x)`）组成。如下所示：\n\n```\nfunction_values =\n\
  (-10..10).step(0.002).map do |x|\n  [x, x, 10*Math.sin(x)]\nend\n```\n\n现在，当这两个函数之间的差值（例如，三元组中的第一个元素与第二个元素）极小时，便发生交点。在我们的示例中，我们每次将\
  \ `x` 值增加 0.002，因此预期的最大变化量为 0.02。因此，差值小于 0.02 的值就可以实际视为零点。在这大约两千个三元组中，我们只需选出元素 1\
  \ 和元素 2（而不是元素 0）非常接近的那些。换句话说，差值的绝对值应小于 0.02。请看以下代码：\n\n```\nzeroes = function_values.select\
  \ do |three_tuple|\n  (three_tuple[0] - three_tuple[1]).abs < 0.02\nend\n```\n\n\
