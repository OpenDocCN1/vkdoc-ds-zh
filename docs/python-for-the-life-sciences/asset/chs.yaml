  ```\nPython 3.7.2 (v3.7.2:9a3ffc0492, Dec 24 2018, 02:44:43)\n[Clang 6.0 (clang-600.0.57)]\
  \ on darwin\nType \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
  >>>\n```\n\n如果只是想快速验证 Python 发行版是否正常工作，可以尝试在 Python 提示符（`>>>`）下输入以下两行代码，每输入一行后按回车键。\n\
  \n```\n>>> a = 4\n>>> print(a)\n```\n\n你应该会看到类似这样的结果：\n\n```\n>>>\n```\n\n**给 macOS\
  \ 用户一句重要的提醒——** 你的 Mac 上的 Python 发行版实际上被 macOS 操作系统用于各种系统维护任务，因此用不同版本的 Python 替换它是不明智的。另一种优雅的安装\
  \ Python 3.x 的方法是创建一个[虚拟环境](https://en.wikipedia.org/wiki/Virtual_environment_software)，在其中运行新的\
  \ Python 发行版，这样就不会影响机器上现有的任何 Python 发行版或库。为 Python 创建虚拟环境超出了本书的范围，但如果你好奇如何操作，可以查阅\
  \ Python 的 [virtualenv](https://pypi.python.org/pypi/virtualenv)^(²²) 工具的文档。\n\n\
  ## 在 Linux 电脑上安装 Python\n\n如果你运行的是主流 [Linux](https://en.wikipedia.org/wiki/Linux)\
  \ 发行版（例如 [Ubuntu](http://www.ubuntu.com/)、^(²³) [Fedora](https://getfedora.org/)、^(²⁴)\
  \ [Debian](https://www.debian.org/)^(²⁵)），几乎肯定已经预装了 Python 2.7.x，但你可能需要单独安装 Python\
  \ 3（通常这是一个名为 `python3` 的独立软件包，可以与 Python 2.7 并行安装——就像 macOS 一样）。由于大多数 Linux 用户对\
  \ Unix 命令行已经有一定了解，这些说明不像针对其他操作系统那样逐步详细。此外，不同 Linux 发行版打包和安装软件的方式差异很大，几乎无法提供全面的指南。简而言之，要充分利用本书，你应该使用\
  \ Linux 软件包管理器安装以下额外软件包：`matplotlib`（用于绘图）、`NumPy`（数值计算 Python 库）和 `pip`（用于从 PyPI\
  \ 仓库安装软件包，请参见下一节）。例如，在 Fedora 中，相关软件包是 `python3-matplotlib`、`python3-numpy` 和 `python3-pip`。每个发行版都有图形化软件包管理工具，搜索这些软件包应该能快速找到目标。通过命令行安装通常也相当简单。例如，在\
  \ Fedora 中，你可以运行：\n\n```\n$ sudo dnf install python3-matplotlib python3-numpy python3-pip\n\
  ```\n\n对于 Ubuntu 和 Debian，`apt-get` 是等效的工具，尽管软件包名称可能略有不同。\n\n## 在 Windows 电脑上安装\
  \ Python\n\n不幸的是，Microsoft Windows 不像 Mac 和 Linux 平台那样预装 Python 发行版。不过幸运的是，python.org\
  \ 的好心人提供了一套易于使用的 Windows 安装程序，几乎涵盖了你能想到的任何现有 Python 版本。正如目前有多个 Python 版本在使用一样，当前也有多个\
  \ Windows 版本在使用。为了本书的目的，我们假设你没有被困在 [*侏罗纪公园*](https://en.wikipedia.org/wiki/Jurassic_Park)，使用一台\
  \ 400 MHz、64MB 内存、运行 [Windows 98](https://en.wikipedia.org/wiki/Windows_98) 的 PC。我们提供的说明将基于在本书写作时的当前\
  \ Windows 版本（即 [Windows 10](https://www.microsoft.com/en-us/windows-10)）^(²⁶) 下的安装。\n\
  \n要在 Windows 平台上获取 Python，我们的第一站当然是 [Python 官网](https://www.python.org/)。Python\
  \ 官网首页中央有一个非常大的菜单栏，其中包含一个指向 **下载** 页面的便捷链接。点击此链接，浏览器会显示一个弹出菜单，提供下载当前 Python 3.x\
  \ 版本的选项。选择 Python 3.x 选项后，下载将自动开始。根据 Windows 系统的配置方式，文件（名称类似 `python-3.x.y.exe`）通常会保存在“下载”文件夹中，以备需要时再次查找。\n\
  \n文件下载完成后，运行它以开始安装。如果你对 Windows 机器拥有管理员权限，请允许“为所有用户安装 Python”的默认选项，并且建议勾选“将 Python\
  \ 3.x 添加到默认 `PATH`”的复选框。选择这些选项后，在安装程序菜单中点击“立即安装”，并在询问是否允许 Python 安装继续时回答“是”。Python\
  \ 安装过程中，你会看到一个带有绿色进度条的“安装进度”指示，显示安装进度；如果一切顺利，你会看到“安装成功”的消息。安装完成后，点击消息窗口中的小“关闭”按钮退出安装程序。\n\
  \n为确保 Python 3.x 安装成功，使用 Windows 开始菜单打开 **命令提示符** 应用，并在提示符下输入 `python`。如果安装正确，你应该会进入一个\
  \ Python shell，并看到类似这样的 Python 启动信息：\n\n```\nPython 3.7.3 (v3.7.3:ef4ec6ed12, Mar\
  \ 25 2019, 21:26:53) [MSC v.1916 32 bit (Intel)] on win32\nType \"help\", \"copyright\"\
  , \"credits\" or \"license\" for more information.\n>>>\n```\n\n要退出 Python shell\
  \ 并返回 Windows 命令提示符，只需输入 `quit()`。\n\n给 Windows 用户一句忠告——你需要单独安装我们将在本书多个章节中使用到的优秀\
  \ Python 绘图库 `matplotlib`^(²⁷)。你可以查看本章后续关于[如何安装附加 Python 模块](https://docs.python.org/2.7/installing/)的章节，了解如何使用\
  \ Python 包管理器 `pip` 等工具进行安装；但如果你想要一个真正“电池齐全”的 Python 发行版，它自带大量有用且额外的功能包，那么你可能想了解\
  \ WinPython^(²⁸)（但如果你想与本书中的代码示例完全同步，可能需要确保下载并安装 WinPython 3.x）。\n\n\n\n## 使用 IDLE\
  \ Python Shell\n\n`IDLE`（https://docs.python.org/2/library/idle.html）是一个 Python\
  \ 图形用户界面（GUI），其运行 Python 代码的方式与 Linux 或 Mac 的终端窗口或 Windows 命令行工具允许你运行输入其中的 shell\
  \ 命令类似。`IDLE` 甚至允许你将 Python 代码保存到文件中，并加载和运行这些文件。此外，大多数版本的 `IDLE` 还会对 Python 代码进行颜色编码，以突出显示\
  \ Python 关键字、字符串、方法名称等内容，使代码更易于阅读和理解。\n\n因此，`IDLE` 本身就是一个非常简洁、最基本形式的集成开发环境（IDE）（https://en.wikipedia.org/wiki/Integrated_development_environment）。Python\
  \ 有许多非常优秀的 IDE，其中一些甚至是免费的（就像 Python 本身一样）。如果你开始着手更大、更具雄心的代码项目，这些更高级的 IDE 可以帮助你管理代码，处理诸如版本控制（https://en.wikipedia.org/wiki/Version_control）和打包代码以便分发等问题。即使是超越这些高级问题，它们也能提供一个非常舒适便捷的框架来管理代码，通过实时突出显示语法和其他错误，帮助你管理模块之间的依赖关系，当然还有代码测试。还有很多非常优秀的代码编辑器，它们本身并非真正的\
  \ IDE，但可以配置成功能类似 IDE 的工具。在下一节中，我们将简要提及一些可以替代使用 `IDLE` 的方案。我们也会给出一些自己的建议，但归根结底，最适合你、让你感到最舒适便捷的开发环境，很可能很大程度上取决于你的个人性格和工作风格。\n\
  \n在 Mac 上启动 `IDLE`，打开 Mac 终端窗口（如果桌面上没有，可以在 `应用程序` 的 `实用工具` 文件夹中找到 `终端`），然后输入 `idle`。\n\
  \n在 Linux 计算机上启动 `IDLE`，打开一个终端窗口并输入 `idle`。在一些流行的 Linux 发行版（如 Ubuntu）中，`IDLE` 包含在\
  \ Python 发行版中，但默认未安装。如果是这种情况，当你输入 `idle` 时，会收到一条错误消息或一条类似这样的友好提示信息：\n\n```\n程序 'idle'\
  \ 当前未安装。您可以通过输入以下命令来安装：sudo apt install idle\n```\n\n如果你收到这样的消息，只需执行 `sudo apt install\
  \ idle`（如果你使用的是 Fedora，则执行 `sudo dnf install python3-tools`），然后输入管理员密码即可快速完成 `IDLE`\
  \ 的安装。如果收到消息说完全找不到 `IDLE`，你可能需要按照我们刚才描述的方式自行安装。\n\n一旦安装好 `IDLE`，你可以重新在终端窗口中尝试输入\
  \ `idle`，一切应该就能正常工作了。\n\n要在 Windows 计算机上启动 `IDLE`，只需在“开始”菜单的搜索框中输入 `idle`，如果你按照上一节的说明安装了\
  \ Python，你应该能够点击搜索结果中的 `IDLE (Python GUI)`。\n\n一如既往，我们建议你查阅 Python 官方网站上的详尽文档，其中包括关于\
  \ `IDLE`（https://docs.python.org/2/library/idle.html）的详细章节。\n\n## Python 开发环境\n\n\
  如果你正在为 Python 寻找不同的开发环境，有许多 `IDLE` 的替代方案，从像 `vim`（http://www.vim.org/）这样的代码编辑器，到标志性的\
  \ `emacs`（https://www.gnu.org/software/emacs/）编辑器（它本身实际上也是一个代码解释器），再到功能齐全、应有尽有的\
  \ IDE，例如 Eclipse IDE（带有 PyDev 扩展）、`PyCharm` 和 GitHub 的 Atom。其中一些编辑器如 `emacs` 编辑器（深受各地电脑极客喜爱），如果你以前从未使用过，学习曲线会相当陡峭。有些则过于庞大，感觉像有点大材小用。\n\
  \n你对 Python 开发环境的选择将在很大程度上取决于你的个性、品味和特定的工作风格。说到 Python 开发环境，我们想说 *萝卜白菜各有所爱*，但如果你想要一些指导，我们非常喜欢\
  \ `PyCharm` 开发环境，它不仅易于安装和使用，只要你愿意使用免费的社区版（https://www.jetbrains.com/pycharm/features/editions_comparison_matrix.html），它甚至是免费的。社区版缺少一些更高级的专业软件开发功能，但完成本书中描述的所有\
  \ Python 项目，你不需要其中的任何一个。最棒的是，`PyCharm` 社区版适用于 Mac、Linux 和 Windows。这只是我们的一点浅见，请随意忽略我们的建议，找到属于你自己的开发\
  \ Python 代码的理想环境。为了帮助你，本章末尾的资源部分提供了一个托管在 Python wiki 上的 Python IDE 列表链接。\n\n## 安装\
  \ Python 包管理器：pip\n\n在本节中，我们将介绍设置便捷的 Python 包管理器 `pip` 的步骤。一旦你能够通过终端访问命令行提示符，无论你是在\
  \ macOS、Linux 还是 Windows 上运行，这些步骤都应该是相同的。`pip` 是你通往 Python 包索引（`PyPI`，https://pypi.python.org/）提供的核心库之外更广阔的\
  \ Python 包世界的门户。尽管我们的书主要侧重于仅使用核心 Python 和标准库的示例，但也有一些地方使用了这些外部包。首先，你可能已经安装了 `pip`（特别地，如果你正在运行\
  \ Linux，你应该已经安装了一个类似于 `python3-pip` 的包）。*由于我们使用的是 Python 3，你需要确保使用的是 `pip` 的 Python\
  \ 3 版本，而不是 Python 2 版本，这可以通过使用* `pip3` *命令来指定*。要进行检查，请在命令行中运行以下命令：\n\n```\n$ pip3\
  \ -V\n```\n\n（在某些系统上，你可能需要使用 `python3-pip` 作为命令 `pip`。）如果你看到类似这样的信息：\n\n```\npip\
  \ 18.1 from /usr/lib/python3.7/site-packages/pip (python 3.7)\n```\n\n恭喜！你已经安装了\
  \ `pip`，无需再进行下一步操作。如果没有，你可以使用 `easy_install`（它是 Python 工具的一部分）来安装 `pip`：\n\n```\n\
  $ easy_install-3.7 --user pip\n```\n\n请注意我们使用了选项 `--user`，这很重要，因为它会将 `pip` 安装在*用户*账户下，而不是系统\
  \ Python 安装目录下，用户通常无法访问系统 Python 目录，除非他们是管理员。使用 `pip` 安装包非常简单，例如：\n\n```\n$ pip3\
  \ install --user <包名>\n```\n\n这将使该包在用户的 Python 程序中可用（再次注意 `--user` 选项的使用）。关于 `pip`\
  \ 和安装包的更多细节，请参阅 *Python 打包用户指南*。`pip` 的实际使用示例会在各个章节中首次使用特定包时记录（例如第 8 章），但如果你想立即开始，这里有一行命令可以一次性安装两个最常用的外部包\
  \ `NumPy` 和 `matplotlib`：\n\n```\n$ pip3 install --user numpy matplotlib\n```\n\n\
  \n\n## 获取示例代码\n\n本书中展示的所有代码均可在我们便捷的 GitHub 仓库中找到^(³⁹)：\n\n*   [`https://amberbiology.github.io/py4lifesci/`](https://amberbiology.github.io/py4lifesci/)\n\
  \n上述网站提供了所有当前代码示例的链接，格式包括 `.zip` 和 `tar.gz`。如果你选择 `.zip` 文件，下载后会将所有代码示例解压到你选择的位置。macOS\
  \ 系统会自动完成此操作，Windows 用户可能需要下载像 [WinZip](http://www.winzip.com/) 这样的归档管理工具。^(⁴⁰)\
  \ Linux 用户可能更习惯使用 `.tar.gz` 格式。\n\n你也可以在此处预览所有代码示例（同样从上述网站链接而来）：\n\n*   [`http://github.com/amberbiology/py4lifesci`](http://github.com/amberbiology/py4lifesci)\n\
  \n对于已经熟悉 `git` [命令行工具](https://git-scm.com/book/en/v2/Getting-Started-The-Command-Line)^(⁴¹)的高级用户，可以通过将仓库直接*克隆*到你选择的目录来保持代码最新：\n\
  \n```\n$ git clone https://github.com/amberbiology/py4lifesci.git\n```\n\n（你也可以安装并使用\
  \ [GitHub Desktop](https://desktop.github.com/)^(⁴²) 来克隆仓库。）\n\n每章的文件名格式如下：\n\n\
  ```\nPFTLS_Chapter_.py\n```\n\n有些章节包含多个 Python 文件，在这种情况下，我们会附加一个子章节编号，如下所示：\n\n\
  ```\nPFTLS_Chapter__.py\n```\n\n因此，可以很容易地找到相关的示例，例如，第二章的代码为：\n\n```\nPFTLS_Chapter_02.py\n\
  ```\n\n要运行此代码，只需打开你选择的终端，切换到解压上述代码的目录，然后运行该示例：\n\n```\ncd  \n./PFTLS_Chapter_02.py\n\
  ```\n\n在上述文本中，我们描述了如何使用“pip”安装包，但在你“克隆”仓库后，你也可以通过运行以下命令，从 PyPI 下载并安装运行所有示例所需的全部包：\n\
  \n```\ncd  \n./setup.py develop\n```\n\n这样做还有一个额外的好处，即设置好环境以便运行所有单元测试：\n\n```\n\
  ./setup.py test\n```\n\n## 实验室中的 Python\n\n*Python 语言基础*\n\n| ![../images/476668_1_En_2_Chapter/476668_1_En_2_Figa_HTML.jpg](img/476668_1_En_2_Figa_HTML.jpg)\
  \ | *“我是渡渡鸟教授，很高兴认识你，”渡渡鸟说道，他的声音以及倚靠手杖的姿态都透露出他的虚弱与疲惫。* *“我也很高兴认识你，”爱丽丝说。“你真的还在用计算器和电子表格做所有的数值工作吗？”她问道。*\
  \ *“哦，我亲爱的孩子，不然你以为我为什么总是这么疲惫？”渡渡鸟回答说。“我要做实验、写经费申请、准备演示文稿。在这些事情中，你觉得我还能从哪里挤出时间来分析我研究实验室每天产生的大量数据呢？”*\
  \ *“恕我冒昧，”爱丽丝带着几分忐忑说道，“您了解‘灭绝’这个概念吗？”* |\n| ![../images/476668_1_En_2_Chapter/476668_1_En_2_Figb_HTML.gif](img/476668_1_En_2_Figb_HTML.gif)\
  \ | *声明变量，* `print` *；注释；缩进代码与代码块；数值变量；整数；浮点数；指数；字符串；类型；鸭子类型；条件语句；函数；整数与十进制算术；布尔变量；*\
  \ `True` *，* `False` *，* `if` *，* `elif` *，* `else` *；比较运算符* |\n| ![../images/476668_1_En_2_Chapter/476668_1_En_2_Figc_HTML.gif](img/476668_1_En_2_Figc_HTML.gif)\
  \ | *生物化学，缓冲液，摩尔浓度，分子量，摩尔体积* |\n\nPython 绝对是你在实验室中的好朋友，因此我们将从那些简单的日常实验室工作开始，过去你可能会为此掏出电子计算器，其微小的按钮仿佛是为那些对算术都漠不关心的小孩子的手指设计的。如今，你更可能伸手去拿智能手机，但你也可以把它收起来（那局暂停的《帝国冲突\
  \ III》在你下次喝咖啡休息时依然会等着你）。\n\n\n\n## 在 Python 中声明变量\n\n让我们通过查看如何声明要使用的变量来进入 Python。首先，这里有一堆简单的数值变量声明，演示了\
  \ Python 的变量声明语法和基本的 Python 数字格式。它们也展示了 Python 中可接受的变量名类型——例如，你很快会通过惨痛教训发现，Python\
  \ 变量名不能以数字开头。^(⁴⁶)\n\n```\n### 声明数值变量\nh2oOxygens = 1\nh2oHydrogens = 2\nh2o_density_in_grams_per_liter\
  \ = 1000\noxygenMass = 15.9994\nhydrogenMass = 1.00794\navogadro = 6.023e23\n```\n\
  \n这里有几个值得注意的点：\n\n在 Python 中，一行文本中跟在 `#`（井号或“磅”号）后面的任何内容都被视为注释，Python 解释器会忽略它，即使该文本包含语法正确且合理的代码——如果井号不存在，Python\
  \ 本可以运行这些代码。这不仅适用于为代码编写文档，还适用于暂时阻止程序中的代码行被执行——例如在测试代码时。你可以在行首使用井号使整行成为注释，也可以在一行中任何\
  \ Python 代码之后使用它，为那段代码添加注释。\n\n在本书中，我们将使用以下方案来处理进入 Python 编辑器或开发环境的所有内容，以便于区分 Python\
  \ 注释、Python 代码、Python 输出和 Python 错误消息，如下所示：\n\n**Python 注释：**\n\n```\n### oxygenMass\
  \ = 15.9994\n```\n\n**Python 代码：**\n\n```\nprint(oxygenMass)\n```\n\n**Python 输出：**\n\
  \n```\n15.9994\n```\n\n**Python 错误消息：**\n\n```\nNameError: name 'oxygenMars' is\
  \ not defined\n```\n\n需要注意的是，如果你选择的编辑器或 IDE 具有自动为 Python 输入和输出添加颜色标记的功能，它不一定会使用这种特定的配色方案。\n\
  \n我们的示例展示了 Python 用于[实数](https://en.wikipedia.org/wiki/Real_number)的三种基本格式：\n\n\
  *   **整数**：`h2oOxygens = 1`\n*   **浮点数**：`hydrogenMass = 1.00794`\n*   **指数形式**：`avogadro\
  \ = 6.023e23`\n\nPython 变量名可以包含字母、数字和下划线字符，如 `h2o_density_in_grams_per_liter` 所示。但它们不能以数字开头，也不能包含空格。\n\
  \nPython 变量名也是**区分大小写**的，因此以下都是不同的变量：\n\n```\nmyvariable = 1\nMyVariable = 3.172\n\
  MYVARIABLE = 'Undefined'\n```\n\n换句话说，随后指定 `myvariable = 2` 不会影响 `MyVariable` 或\
  \ `MYVARIABLE` 的值。\n\n类似地，我们可以通过在单引号或双引号中括起声明的值来声明 Python 中的字符串变量。在 Python 中，单引号和双引号可以互换使用，但它们必须成对出现——你不能用单引号开始一个字符串，然后用双引号结束它。然而，这确实允许你在字符串内部使用单引号和双引号（如下面的\
  \ `jfk` 示例所示）。\n\n```\n### 声明字符串变量\nbuffer = 'Tris'\nbuffer = \"MES\"\njfk = \"\
  I'm proud to say 'Ich bin ein Berliner'\"\ncarbonMass = \"12.0107\"\n```\n\n考虑这些例子中的最后一个：`carbonMass\
  \ = \"12.0107\"`。\n\n你认为它是一个数字还是一个字符串？\n\n它实际上是一个字符串，因为它被引号括起来了，如果你试图用它做任何数学运算（比如将它乘以另一个数字），结果将不是你期望的那样。稍后会详细介绍，但在我们将所有这些变量投入实际的\
  \ Python 代码中使用之前（是的，马上就来），让我们考虑一个与 Python 变量相关且重要的问题。\n\n在 Python 中还有一种声明字符串变量的方法，它允许你在字符串中包含换行符。例如，这对于将文本段落声明为字符串非常有用。要使用它，你必须在**三引号**中括起字符串本身，如下所示：\n\
  \n```\nlimerick = \"\"\" Said a young researcher named Spode\nHaving reached the\
  \ end of his road\n'I have far too much data\nFor this hand calculator\nIf only\
  \ I knew how to code!' \"\"\"\n```\n\n从这个例子中可以看出，三引号字符串不仅可以包含换行符，还可以包含单引号和双引号。顺便提一下，如果需要对\
  \ Python 代码的整个部分进行注释（例如出于测试目的），使用三引号也是一种非常有用的方法。\n\n## Python 处理所有类型\n\n那些使用过 Java\
  \ 或 C 等其他编程语言的人可能习惯于看到一种包含变量**类型**的变量声明语法。例如，在 C 中，你必须在代码中使用变量*之前*声明它的类型 —— 就像这样：`int\
  \ myvariable;` 这将 `myvariable` 设置为一个整数，以便可以在代码中适当处理它。\n\n用计算机极客的说法，Python 不要求其变量是**显式类型化**的。Python\
  \ 使用一种称为[鸭子类型](https://en.wikipedia.org/wiki/Duck_typing)的动态类型化方法，其核心理念是：**如果它走路像鸭子，说话像鸭子，那么它就是鸭子**！例如，当\
  \ Python 看到变量值被引号括起来时，如 `buffer = 'Tris'`，它会将该变量视为字符串，即使字符串的内容看起来像一个数字，如 `carbonMass\
  \ = \"12.0107\"`。同样，对于数值变量，如果变量的值符合 Python 数值格式之一的语法，它会将该变量视为一个数字。\n\n这种鸭子类型化方法使\
  \ Python 极其灵活，因为变量可以根据需要即时引入，甚至可以在代码执行过程中改变类型。\n\n例如，在 Python 代码中声明 `a = 11`（一个整数）以及稍后声明\
  \ `a = \"One greater than 10\"`（一个字符串）是完全允许的。不过请注意——如果管理不当，这种灵活性也可能导致后续在理解和调试代码时出现问题。例如，如果你有一段代码用\
  \ `a` 进行算术运算，但在该代码执行之前你已经将 `a` 重新声明为字符串，那么结果可能不太理想。\n\n此时，你们中可能有些人想跳进去编写一些 Python\
  \ 代码，这些代码不仅仅是给变量赋值，而其他人可能仍然对 Python 变量声明语法有疑问。变量名可以有多长？我可以在变量名中使用其他字符吗？在变量名中使用大小写字符的\
  \ Python 最佳实践是什么？等等，不一而足。\n\n![../images/476668_1_En_2_Chapter/476668_1_En_2_Figd_HTML.jpg](img/476668_1_En_2_Figd_HTML.jpg)\n\
  \n细心的读者们，别担心！Python 网站包含一个丰富的文档库，其中有 Python 语言参考^(⁴⁷)，甚至还有 Python 风格指南。^(⁴⁸) 这两份文档的大部分内容在目前对你来说可能意义不大，因为我们的\
  \ Python 之旅才刚刚开始，但当你阅读本书的各个章节时，它们是非常好的参考资料。我们的目标是提供足够的背景知识让你开始使用 Python，而官方 Python\
  \ 网站^(⁴⁹)上的在线文档是补充你在本书中所学内容的绝佳资源。\n\n闲话少说……\n\n\n\n## 我们的第一段真正的 Python 代码\n\n```\n\
  ### 计算水分子质量并输出到控制台\nh2oOxygens = 1\nh2oHydrogens = 2\noxygenMass = 15.9994\nhydrogenMass\
  \ = 1.00794\nh2oMass = h2oOxygens * oxygenMass + h2oHydrogens * hydrogenMass\nprint('H2O\
  \ 的分子量 = ',h2oMass)\n```\n\n借用一位爱穿宽大[垮裤](https://en.wikipedia.org/wiki/MC_Hammer)的\
  \ 1980 年代嘻哈歌手的话来说，咱们来“拆解一下”。\n\n清单 2-1 中的第一行是一条 Python 注释。提醒一下，Python 代码中任何出现在井号（`#`）后面的字符都会被当作注释，不会作为代码执行。注释甚至可以附加到可执行代码行的末尾，就像这样：\n\
  \n```\noxygenMass = 15.9994       # 标准原子量\n```\n\n你可以用注释来注解代码，以提醒自己或告知他人某段代码的功能、工作原理、存在的问题，或你希望在该代码段中包含的任何其他信息。\n\
  \n第二行只是使用我们之前声明的变量计算水分子的质量，并将其赋值给变量 `h2oMass`。\n\n第三行引入了向 Python 控制台的输出。控制台是代码输出的默认流，包括\
  \ `print()` 函数调用的内容以及任何 Python 错误消息。当你运行前面的代码时，第 3 行的 `print()` 函数会在 Python 控制台中产生如下输出：\n\
  \n```\nH2O 的分子量 =  18.01528\n```\n\n如果你将此代码输入到 Python 编辑器中并运行，并在 Python 控制台中看到了此输出，请为自己鼓掌。你刚刚运行了你的第一个小型\
  \ Python 程序！\n\n#### Python 函数\n\n与几乎所有编程语言一样，你可能希望将代码组织成整洁、清晰的代码块，以便于维护和理解。那么，我们直接开始学习如何在\
  \ Python 中定义函数吧，因为在本书中我们将编写的代码里，函数将是一个相当普遍的特性。稍后，我们将开始把函数称为方法，以配合 Python 对[面向对象](https://en.wikipedia.org/wiki/Object-oriented_programming)代码的支持，不过关于这一点，后面还有更多（很多很多）内容要讲。\n\
  \n目前，理解 Python 函数的最佳方式就是看它们如何运作，下面就是清单 2-2 中的一个函数。\n\n```\n### 一个计算摩尔体积的简单函数\ndef\
  \ calculateMolarVolume(mass,density):\nvolume = mass/density\nreturn volume\n```\n\
  \n如果你曾经用 BASIC 或 Java 等主流编程语言写过代码，那么这段代码片段会看起来非常熟悉。不过，Python 有一个特别显著的特性值得在此一提：\n\
  \n**Python 代码中的缩进具有语法意义，而不仅仅是为了美观。**\n\n在许多编程语言中，鼓励程序员缩进代码块以使代码更具可读性，但这是一种美学选择，程序员可以忽略它而不会影响代码本身的执行。\n\
  \n**但在 Python 中并非如此……**\n\n在 Python 中，缩进用于指示特定代码块的开始和结束位置。如前面的示例所示，Python 函数内部的所有代码必须缩进，以定义其属于该函数。为了更清楚地说明这一点，请看清单\
  \ 2-3 中的代码。\n\n```\ndef explainIndentedCode():\nprint('这个缩进的行属于函数的一部分')\nprint('这一行也是')\n\
  print('这个未缩进的行不属于函数的一部分')\n```\n\n如果你在代码中调用 `explainIndentedCode()` 函数，函数声明下方所有缩进的\
  \ `print()` 函数调用都将被执行，但该函数调用本身不会执行后面那个未缩进的 `print()` 函数。在 Python 中，有各种可以执行代码块的地方，这些代码块甚至可能出现在其他（已经缩进的）代码块内部（例如函数）。稍后当我们讲到\
  \ Python 的 `if` 语句时，就能看到实际的用例。\n\n但让我们先回到我们的 `calculateMolarVolume()` 函数。\n\n我们可以看到，函数定义包含了两个参数，`mass`（质量）和\
  \ `density`（密度），它们在函数内部用于计算 `volume`（体积），即摩尔体积。函数末尾的 `return` 语句指定了函数结束时返回的内容（如果有的话）。没有\
  \ `return` 语句的函数与具有空 `return` 语句的函数相同，即不返回任何内容。Python 实际上有一个表示“无”的特殊值，叫做 `None`，我们稍后会看到更多相关内容。不过现在，你可能会好奇\
  \ Python 为什么要费心搞一个表示“无”的特殊值。原因之一是它允许你在代码中测试一个变量是被赋值为“有”，还是“无”。但暂时不必过于担心——后续章节会讲清楚的。\n\
  \n让我们做个小测试，运行我们的 `calculateMolarVolume()` 函数，看看执行清单 2-4 中的代码会得到什么结果。\n\n```\ndef\
  \ calculateMolarVolume(mass,density):\nvolume = mass/density\nreturn volume\nh2oMolarVolume\
  \ = calculateMolarVolume(h2oMass,h2o_density_in_grams_per_liter)\nprint('1 摩尔 H2O\
  \ 的体积 = ',h2oMolarVolume,'L')\n```\n\n确保你事先已经包含了我们之前列出的变量声明。如果你运行这两行代码，应该会看到以下内容：\n\
  \n```\n1 摩尔 H2O 的体积 =  0.01801528 L\n```\n\n正如生物化学教科书所指出的，1 摩尔水的体积确实约为 18 毫升。\n\n\
  现在我们渐入佳境，再来创建另一个函数，用于计算 1 升体积内某种物质的分子数量。为此，我们再次需要用到刚才看到的摩尔体积计算，但现在我们将在新函数内部通过引用之前编写的函数来重用该函数，如清单\
  \ 2-5 所示。\n\n```\n### 一个计算每升分子数的函数\ndef moleculesPerLiter(mass,density):\nmolarVolume\
  \ = calculateMolarVolume(mass,density)\nnumberOfMolarVolumes = 1.0/molarVolume\n\
  numberOfMolecules = avogadro * numberOfMolarVolumes\nreturn numberOfMolecules\n\
  ```\n\n再次注意，我们将相同的两个参数 `mass`（质量）和 `density`（密度）传递给新函数，并且在函数的第一行，我们使用了之前的函数，并将返回的结果赋值给变量\
  \ `molarVolume`（摩尔体积）。\n\n和之前一样，我们将把水的质量和密度传递给该函数。不过这次，我们要计算的不是水的摩尔体积，而是 1 升水中的分子数量。那么，现在让我们运行这个新函数（再次确保包含了之前赋值的变量声明，我们假设你已经在\
  \ Python 会话中包含了它们），看看会得到什么结果。\n\n```\nh2oMoleculesPerLiter = moleculesPerLiter(h2oMass,h2o_density_in_grams_per_liter)\n\
  print('1L 中 H2O 的分子数 = ',h2oMoleculesPerLiter)\n1L 中 H2O 的分子数 =  3.343273043771731e+25\n\
  ```\n\n我们的第二个函数与第一个函数具有非常相似的特征——一个需要两个参数的函数定义，一些数学运算，以及一个返回的结果。这确实展示了函数如何在 Python\
  \ 代码中被重用，甚至在其它函数内部使用。诚然，我们的第一个函数只是一个相当简单的例子，它本身很容易简化为单行代码，但你已经明白了其中的道理。一个真正的 Python\
  \ 函数可能包含几十、几百甚至几千行代码。\n\n\n\n## 在 Python 中使用整数和小数\n\n在本章结束前，我们还要再创建一个函数。不过在此之前，先花点时间看看那些曾让许多\
  \ Python 新手栽跟头的算术陷阱。\n\n第一个陷阱与整数运算有关。\n\n尝试在你的 Python 编辑器中运行代码清单 [2-6](https://example.com)\
  \ 中的代码，看看结果如何。\n\n```\na = 3\nb = 6\nprint('a/b = ', a/b)\n```\n\n运行这段代码，你应该会得到：\n\
  \n```\na/b = 0.5\n```\n\n重要的是要认识到，Python 2.7 的行为与此完全不同。在 Python 2.7 中，结果会是零。这是因为在前述代码中，`a`\
  \ 和 `b` 都被定义为整数，因此当我们执行 `a/b` 运算时，Python 2.7 返回了一个整数结果。由于 3/6 的实际结果是 0.5，Python\
  \ 2.7 并未将这个小数作为整数返回——它只返回了结果的整数部分，也就是零。这让 Python 新手们陷入了困境。例如，你明知代码某部分需要处理浮点数，于是初始时将相关变量赋值为浮点值。然而在代码的其他部分，这些变量又被重新赋值为整数——于是乎，你本想得到一个十进制小数，结果却得了个零。\n\
  \n在 Python 3 中，这个怪癖已经被消除，代码现在会按你期望的方式运行——无论输入变量是否为整数，都会自动将结果转换为浮点数。这一点很重要，尤其是在将代码从\
  \ Python 2 迁移到 Python 3 时。\n\n因此，例如下面的示例现在都能按预期工作：\n\n```\nprint('b/a = ', b/a)\n\
  b/a = 2.0\nprint('12/5 = ', 12/5)\n12/5 = 2.4\n```\n\n你仍然可以通过手动将它们指定为浮点数来进行运算，如下例所示，不过现在已无必要。\n\
  \n```\na = 3.0\nb = 6.0\nprint('a/b = ', a/b)\na/b = 0.5\n```\n\n作为给读者的小练习，尝试探究一下在代码运算中混合使用整数和浮点数会发生什么。\n\
  \n在进入本章最后一个（也是最实用的）函数之前，还有一个 Python 小陷阱需要了解……\n\n尝试代码清单 [2-7](https://example.com)\
  \ 中的代码。\n\n```\na = 6.0\nb = 3.0\nc = 5.0\nprint('a/b+c = ', a/b+c)\nprint('a/(b+c)\
  \ = ', a/(b+c))\n```\n\n你应该会得到这个结果：\n\n```\na/b+c = 7.0\na/(b+c) = 0.75\n```\n\n\
  这只是善意地提醒你，不要忘记计算机极客们所说的 [运算符优先级](https://en.wikipedia.org/wiki/Order_of_operations)，这其实是一个花哨的说法，指的是如果你不自己指定运算顺序（例如，通过使用括号强制让加法运算符在除法运算符\
  \ *之前* 执行，而除法通常优先级更高），算术运算符的执行顺序。\n\n对于算术运算符以及任何其他 Python 特性，如果你需要更多关于 Python 工作原理的细节，python.org\
  \ 上的在线文档库是你的好帮手——特别是关于运算符优先级的专门章节。\n\n### 条件语句\n\n好了——现在我们准备用最后一个函数来结束本章，该函数将计算一些常用实验室缓冲液的简易储备液配方。在这个最后的函数中，我们将介绍\
  \ Python **条件语句**。条件语句是计算机编程的核心，其基本形式为：\n\n- **如果**：*条件为真*\n- *则执行某些操作*\n\n让我们看看最后一个函数的代码，并在代码清单\
  \ [2-8](https://example.com) 中实际体验一下。\n\n```python\n### 用于计算缓冲液配方的函数，使用了条件语句\ndef\
  \ bufferRecipe(buffer, molarity):\n    if buffer == 'Tris':\n        grams = 121.14\n\
  \    elif buffer == 'MES':\n        grams = 217.22\n    elif buffer == 'HEPES':\n\
  \        grams = 238.30\n    else:\n        return 'Huh???'\n    gramsPerLiter =\
  \ grams * molarity\n    return gramsPerLiter\n```\n\n函数 `bufferRecipe` 接受两个参数：`buffer`——缓冲液的名称——以及\
  \ `molarity`——你想要配制的储备液的摩尔浓度。根据你提供的缓冲液名称，它将相应的值赋给变量 `grams`，并返回配制 1L 溶液所需的缓冲液重量（以克为单位）。\n\
  \n我们可以在该函数中看到条件语句的运用。\n\n```python\nif buffer == 'Tris':\n    grams = 121.14\n```\n\
  \nPython 条件语句的形式为：\n\n```\nif <条件>:\n    <代码块>\nelif <条件>:\n    <代码块>\n...\nelse:\n\
  \    <代码块>\n```\n\n我们的示例中第一个条件是提供的缓冲液名称等于字符串 `'Tris'`，通过 Python 相等运算符 `==` 表示。请注意相等运算符与用于变量赋值的等号之间的区别。\n\
  \n```\nbuffer == 'Tris'\n```\n\n**判断**变量 `buffer` 的值是否等于字符串 `'Tris'`，而\n\n```\n\
  buffer = 'Tris'\n```\n\n**设置**变量 `buffer` 的值为字符串 `'Tris'`。\n\nPython 的相等运算符可能看起来不像，但它实际上是一种返回“真”或“假”的函数，分别由\
  \ Python 特殊值 `True` 和 `False` 表示。`if` 语句随后根据接收到的真或假值，决定是否执行一个缩进的代码块。\n\n**代码块？**\n\
  \n是的。Python 中的条件语句也使用缩进语法来确定条件满足时应执行什么操作。代码清单 [2-9](https://example.com) 中的示例最能说明这一点。\n\
  \n```python\nsomething = 6\nanotherThing = 6\nif something == anotherThing:\n  \
  \  print('这条语句会被打印')\n    print('这条也会')\nprint('无论怎样，这条语句都会被打印')\n```\n\n让我们实际运行一下。执行上述代码，我们会得到：\n\
  \n```\n这条语句会被打印\n这条也会\n无论怎样，这条语句都会被打印\n```\n\n但如果我们将前述代码中的变量改为：\n\n```python\nanotherThing\
  \ = 4\n```\n\n则会得到：\n\n```\n无论怎样，这条语句都会被打印\n```\n\nPython if 块中的 `elif` 子句和 `else`\
  \ 子句是可选的，但它们提供了更多选项，包括即使所有条件子句都不满足时也能执行某些操作。例如，请参见代码清单 [2-10](https://example.com)\
  \ 中的代码和输出。\n\n```python\nsomething = 10\nif something == 6:\n    print('something\
  \ 是 6')\nelif something == 4:\n    print('something 是 4')\nelse:\n    print('something\
  \ 完全是别的值')\n```\n\n输出：\n\n```\nsomething 完全是别的值\n```\n\n如果你只有一条语句需要基于条件为 `True`\
  \ 来执行，你也可以使用不带缩进块的简写语法，像这样：\n\n```python\nif something == 11: print('它比 10 大 1')\n\
  ```\n\n与其他编程语言一样，Python 中的相等运算符只是一组**比较运算符**中的一员，它们如下所示：\n\n- `==` 等于\n- `!=` 不等于\n\
  - `>` 大于\n- `<` 小于\n- `<>` 大于或小于（即不等于）\n- `>=` 大于或等于\n- `<=` 小于或等于\n\n\n\n\n除了这些比较运算符外，任何条件语句都可以通过在开头加上`not`语句来取反。例如：\n\
  \n```\nnot (something == anotherThing)\n```\n\n逻辑上等同于：\n\n```\nsomething != anotherThing\n\
  ```\n\nPython 中的条件语句还可以通过`and`和`or`子句链接在一起，以创建更复杂的条件，不过我们将在另一章中讨论这些。\n\n因此，掌握了 Python\
  \ 条件语句的知识后，我们现在可以理解最新函数的工作原理。如果传递给`buffer`参数的是三个已识别的缓冲区之一，函数会返回相应的配方，否则返回`'Huh???'`。\n\
  \n```\nprint('Recipe for 0.1M Tris = ',bufferRecipe('Tris',0.1),'g/L')\nRecipe for\
  \ 0.1M Tris =  12.114 g/L\nprint('Recipe for 0.5M MES = ',bufferRecipe('MES',0.5),'g/L')\n\
  Recipe for 0.5M MES =  108.61 g/L\nprint('Recipe for 1mM HEPES = ',bufferRecipe('HEPES',1.0e-3),'g/L')\n\
  Recipe for 1mM HEPES =  0.2383 g/L\nprint('Recipe for 1.0M Goop = ',bufferRecipe('Goop',1.0),'g/L')\n\
  Recipe for 1.0M Goop =  Huh??? g/L\n```\n\n注意，我们现在直接在`print`函数中调用`bufferRecipe`函数，而不是将其分配给变量并单独打印。在本书中，有时我们会以更冗长、不太\
  \ Pythonic 的方式编写新介绍的 Python 特性，只是为了在开始时让它们更清晰。\n\n与此相关的是，实际上有一种更好的方法来编写`bufferRecipe`函数，即使用\
  \ Python 字典，我们将在第 3 章中介绍。字典是 Python 最棒的特性之一，稍后我们将看到，它们为我们提供了一种更优雅的实现`bufferRecipe`函数的方式。\n\
  \n"
- "# 3. 理解序列\n\n*生物序列与 Python 数据结构*\n\n| ![../images/476668_1_En_3_Chapter/476668_1_En_3_Figa_HTML.gif](img/476668_1_En_3_Figa_HTML.gif)\
  \ | *“你确实非常奇怪，”爱丽丝对鸟说。“你只有长度没有宽度，而且你的一端看起来和另一端太像了，很难知道该和哪一端说话。”* *“和其他所有鸟一样，我从头开始，一直延伸到脚，”鸟说。“只要把我放在任何其他鸟旁边，你就会发现我们都是同样的构造。”*\
  \ *爱丽丝看起来困惑不解，从她的表情中，鸟看出需要一些额外的澄清。* *“听着，只要在一张纸上写下头-身体-脚，瞧！你就有了一个识别任何鸟类的现成模板，”鸟不耐烦地说。*\
  \ *爱丽丝似乎一时陷入了沉思，“但这个模式也会匹配其他小女孩，”她最后说道。* *“好吧，好吧，”鸟生气地说。“我现在真的不想讨论同构问题，但既然你提出来了……”*\
  \ |\n| ![../images/476668_1_En_3_Chapter/476668_1_En_3_Figb_HTML.gif](img/476668_1_En_3_Figb_HTML.gif)\
  \ | *字符串变量；列表；*`len()`*；迭代器；代码块；字符串和列表的切片表示法；对象；方法；字符串搜索；列表方法；字典；键值对；布尔值，*`in`*，*`True`*，*`False`*；子串；元组，*`while`*；可变和不可变对象*\
  \ |\n| ![../images/476668_1_En_3_Chapter/476668_1_En_3_Figc_HTML.gif](img/476668_1_En_3_Figc_HTML.gif)\
  \ | *DNA 序列，限制性内切酶，限制性酶切，分子量* |\n\n序列是生物学的关键部分，到本章结束时，你会惊讶于自己以前为什么不使用 Python 来管理它们。Python\
  \ 有一些非常出色的特性，使其成为存储、搜索和分析蛋白质及核酸序列的绝佳工具。如果 Python 处理序列的能力是它对生命科学家的唯一吸引，那么仅凭这一点就足以使其在生物学家的工具箱中占有一席之地。\n\
  \n## 关于序列和字符串\n\n由于生物序列通常以字符串形式表示，字符串可能是我们讨论用 Python 编写代码管理序列的一个很好的起点。\n\n这是一个非常简单的\
  \ DNA 序列：\n\n```\nmySequence = 'atcg'\n```\n\nPython 中的字符串有许多特性，使其成为处理生物序列的绝佳载体。清单\
  \ 3-1 给出了一个例子。\n\n```\nmySequence = 'atcg'\nprint('Sequence length is ',len(mySequence))\n\
  Sequence length is  4\n列表 3-1\nPython 中的字符串\n```\n\n在清单 3-1 中，我们展示了 Python 的`len`函数如何返回字符串的字符长度，正如我们将在其他章节中看到的，它也可以应用于其他\
  \ Python 变量类型，如列表。\n\n如果我们要对序列进行任何计算，我们肯定希望能够逐位置遍历序列，所以这似乎是介绍 Python 循环的好时机。清单 3-2\
  \ 中有一个例子，紧接着是其输出。\n\n```\nmySequence = 'atcg'\nfor c in mySequence:\nprint(c)\n\
  a\nt\nc\ng\n列表 3-2\nPython 中的循环\n\n```\n\n你刚刚输入并执行的代码翻译成中文就是“对于`mysequence`中的每一项，给该项一个临时名称`c`，然后将`c`打印到控制台。”这种循环结构在\
  \ Python 中称为**迭代器**。Python 知道字符串是由更小的项（在本例中是字符）组成的，所以当你使用`\"for\"`命令迭代一个字符串时，迭代器会按出现顺序返回字符串中的每个字符。我使用了名称`c`，因为本例中的项是字符，但我完全可以轻松使用任何其他名称，比如`b`或`base`，因为我们处理的序列是\
  \ DNA 序列。\n\n`print(c)`一行的缩进非常重要。正如我们在其他章节中看到的，缩进是在 Python 中创建要一起执行的代码块的方式。在`for`语句下方缩进一级的每一行代码都会在每次循环迭代时执行。例如，请参见清单\
  \ 3-3。\n\n```\nfor c in mySequence:\nprint('This line will be executed for each\
  \ pass through the loop')\nprint('So will this one')\nprint('This line will only\
  \ be executed at the end')\nThis line will be executed for each pass through the\
  \ loop\nSo will this one\nThis line will be executed for each pass through the loop\n\
  So will this one\nThis line will be executed for each pass through the loop\nSo\
  \ will this one\nThis line will be executed for each pass through the loop\nSo will\
  \ this one\nThis line will only be executed at the end\n列表 3-3\n循环中的缩进\n```\n\n\
  `for`代码块中的两行缩进代码会针对序列中的每个字符执行，而未缩进的`print`语句则只在所有迭代完成后执行一次。清单 3-4 展示了一个更贴近实际示例的`for`循环中的代码块。\n\
  \n```\ni = 0\nfor c in mySequence:\ni += 1\nprint(i,c)\n1 a\n2 t\n3 c\n4 g\n列表 3-4\n\
  for 循环中的代码块\n```\n\n在前面的例子中，我们还初始化了一个变量`i`为零，然后在每次循环迭代时将其递增 1，这样我们也可以打印 DNA 序列中每个碱基的索引。带有\
  \ Python 递增运算符`i += 1`的表达式是编写`i = i + 1`的语法简写，并且还有一个类似的递减运算符`-=`。\n\n字符串（以及 Python\
  \ 中所有基于列表的对象）的另一个特性是，它们的字符（如果是列表则为项）也可以根据对象中的数值位置来访问，从 0 开始（Python 中所有列表、序列、数组等都是从\
  \ 0 开始编号）直到对象的长度减 1。你还可以使用`[from:to]`语法对字符串（以及列表）进行切片：\n\n\n\n\n```python\nprint(mySequence[0])\n\
  a\nprint(mySequence[3])\ng\nprint(mySequence[-1])\ng\nprint(mySequence[0:4])\natcg\n\
  print(mySequence[:4])\natcg\nprint(mySequence[2:3])\nc\nprint(mySequence[2:4])\n\
  cg\nprint(mySequence[2:])\ncg\nprint(mySequence[-3:])\ntcg\n```\n\n注意 Python 索引的以下特性：`[from:to]`\
  \ 范围中的最后一个数字是**独占的**，例如，如果你想要选择序列中到位置 41 及之前的切片，`to` 指定符需要是 42（该位置**不会**被包含在选中的子字符串（或子列表）中）；如果省略了\
  \ `from` 或 `to` 索引，则默认使用字符串（或列表）的开头或结尾；字符串（或列表）的负索引表示距离字符串末尾的第 `-n` 个位置。\n\n既然我们已经介绍了\
  \ Python 字符串和列表的切片表示法，那么让我们花点时间介绍一下 Python 列表，因为它们在某些方面与字符串非常相似，并且我们可以将已学到的字符串表示法应用到列表上。\n\
  \n## 列表与更多内容\n\nPython 列表是一个由项目组成的序列，类似于字符串是由字符组成的序列，但不同之处在于 **Python 列表项目可以是任何\
  \ Python 对象**，而不仅仅是字符。我们也不在 Python 列表周围使用引号，而是像这样使用方括号：\n\n```python\nmySequenceAsAList\
  \ = ['a','t','c','g']\n```\n\n请注意，这里我们存储了与之前字符串示例完全相同的序列，但这次使用的是列表格式。注意各个项目是如何用逗号分隔并括在方括号中而不是引号中的。尽管这种格式看起来与之前的字符串版本截然不同，但我们可以看到，我们之前使用的字符串切片表示法应用于这个列表时，产生的结果与之前应用于字符串时非常相似。\n\
  \n```python\nprint(mySequenceAsAList[0])\na\nprint(mySequenceAsAList[3])\ng\nprint(mySequenceAsAList[-1])\n\
  g\nprint(mySequenceAsAList[0:4])\n['a', 't', 'c', 'g']\nprint(mySequenceAsAList[:4])\n\
  ['a', 't', 'c', 'g']\nprint(mySequenceAsAList[2:3])\n['c']\nprint(mySequenceAsAList[2:4])\n\
  ['c', 'g']\nprint(mySequenceAsAList[2:])\n['c', 'g']\nprint(mySequenceAsAList[-3:])\n\
  ['t', 'c', 'g']\n```\n\n我们新的基于列表的序列包含字符，就像之前的字符串版本一样，所以当我们打印列表中的单个项目时，例如 `print(mySequenceAsAList[0])`，我们得到与之前相同的结果\
  \ —— 一个字符。然而，当我们打印列表的切片时，例如 `print(mySequenceAsAList[2:4])`，我们会以列表格式而不是字符串格式得到结果。请注意，任何时候我们对列表使用切片表示法，即使结果只包含一个项目，我们得到的始终是列表格式的结果。例如，`print(mySequenceAsAList[2:3])`\
  \ 返回 `['c']` 而不是 `c`。字符串在编程语言中是一种非常常见且广泛使用的习语，你可以将 Python 字符串视为 Python 列表的一种特殊版本，专门用于表示字符序列，并具有其自身适用于字符串的特殊语法。\n\
  \n但现在让我们看看 Python 列表和 Python 字符串之间的一些主要区别。首先，也是最重要的一点，Python 列表项目可以是任何 Python 对象：字符串、数字\
  \ —— 甚至另一个列表、列表的列表、列表的列表的列表…… 好吧，你明白我的意思。这是一个包含完全不同类型对象集合的列表，包括字符串、列表、数字，甚至 Python\
  \ 的 `True` 和 `None` 值。`True` 是 Python 内置的布尔值，毫不奇怪，它是其姊妹布尔值 `False` 的对立面。`None` 值用于表示没有赋值的\
  \ Python 对象 —— 它实际上是一个指向空值的指针。我们会在本书中经常遇到这些内置值，并变得非常熟悉它们，但暂时，让我们先看看它们如何作为元素出现在列表中：\n\
  \n```python\nmyList = ['atcg',['a','t','c','g'],42,True,None]\nprint('Length of\
  \ myList is: ',len(myList))\nLength of myList is:  5\nprint(myList[0])\natcg\nprint(myList[1])\n\
  ['a', 't', 'c', 'g']\nprint(myList[2])\n\nprint(myList[3])\nTrue\nprint(myList[4])\n\
  None\n```\n\n作为一个有点好奇的小插曲，请注意 `myList` 中的第二个项目（`myList[1]`）本身就是一个列表。既然它嵌入在另一个列表中，你认为应该如何引用内部列表中的项目？实际上这非常合乎逻辑且直观\
  \ —— 例如：\n\n```python\nprint(myList[1][2])\nc\nprint(myList[1][1:3])\n['t', 'c']\n\
  ```\n\n很简单，对吧？\n\n现在来点更有难度的？\n\n**Python 中字符串和列表的一个重大区别是列表是可变的（`mutable`），而字符串则不是。**\n\
  \n呼！\n\n正式声明一下，如果你不确定“*可变*”是什么意思，它听起来就是它本身的意思 —— 可改变的、可修改的。说字符串是不可变的可能看起来违反直觉，因为我们一开始可以给它们赋值，但一旦字符串值被赋值，除非用另一个字符串替换它，否则它不能被改变。\n\
  \n当我们说：\n\n```python\ncorrectSpelling = 'recognize'\n```\n\n然后：\n\n```python\ncorrectSpelling\
  \ = 'recognise'\n```\n\n我们实际上并没有修改字符串 `correctSpelling`，我们本质上是创建了一个同名的新字符串。如果我们将\
  \ `correctSpelling` 声明为一个列表，在列表 3-5 中，我们可以进行字符串无法做到的完全修改。\n\n```python\ncorrectSpelling\
  \ = ['r','e','c','o','g','n','i','z','e']\ncorrectSpelling[7] = 's'\nprint(correctSpelling)\n\
  ['r', 'e', 'c', 'o', 'g', 'n', 'i', 's', 'e']\n```\n*列表 3-5：修改列表*\n\n如果我们尝试类似地编辑字符串版本（**Python\
  \ 中不允许这样做**）：\n\n```python\ncorrectSpelling = 'recognize'\ncorrectSpelling[7] =\
  \ 's'\ncorrectSpelling[7] = 's'\nTypeError: 'str' object does not support item assignment\n\
  ```\n\n我们会得到一条错误消息，告诉我们字符串类型（在 Python 中缩写为 `str`）不允许对其单个项目进行赋值。实际上有一些特殊的函数用于编辑字符串，但它们都是创建新字符串，而不是编辑现有字符串，例如，在列表\
  \ 3-6 中。\n\n```python\ncorrectSpelling = 'recognise'\ncorrectSpelling = correctSpelling.replace('s','z')\n\
  print(correctSpelling)\nrecognize\n```\n*列表 3-6：编辑字符串*\n\n\n\n## 方法和对象\n\n`correctSpelling.replace('s','z')`\
  \ 这条语句的语法可能看起来有些陌生，但它却引入了 Python 中我们尚未接触过的一个方面。Python 中的**对象**（例如字符串）可以拥有其特定**对象类型**所独有的特殊函数，这些专用函数被称为**方法**（关于对象的更多内容，请参阅第\
  \ 7 章关于[面向对象编程](https://en.wikipedia.org/wiki/Object-oriented_programming)的内容，届时我们将看到可以定义自己的对象类型，甚至可以重新定义或扩展现有的\
  \ Python 对象类型）。\n\n对象类型的方法可以通过前面展示的 `object.method()` 语法应用于该类型的*实例*。方法只是一个为特定对象类型定义的*函数*。它拥有名称和用于传递参数的括号，这与我们在第\
  \ 2 章描述函数声明时所见的情形相同。然而，最大的区别在于，方法始终接收调用它的对象作为参数。这听起来可能有些奇怪，但当你考虑到方法是专属于某对象类型的函数时，这就完全合理了。它旨在为其所针对的对象类型执行某些操作或与该对象类型协同工作，因此，它永远不会在不涉及该类型对象的任何上下文中使用。\n\
  \n在示例 `correctSpelling.replace('s','z')` 中，`correctSpelling` 是字符串对象，它正在使用为字符串对象定义的\
  \ `replace()` 方法。\n\n为了完成对 Python 列表的介绍，让我们来看看一些很酷的**列表方法**（即为列表对象定义的函数），它们允许我们编辑列表。\n\
  \n```\nmyList = ['apple','banana','pear','llama','orange']\nprint(myList)\n['apple',\
  \ 'banana', 'pear', 'llama', 'orange']\nmyList.append('peach')\nprint(myList)\n\
  ['apple', 'banana', 'pear', 'llama', 'orange', 'peach']\nmyList.insert(2,'kiwi')\n\
  print(myList)\n['apple', 'banana', 'kiwi', 'pear', 'llama', 'orange', 'peach']\n\
  myList.remove('llama')\nprint(myList)\n['apple', 'banana', 'kiwi', 'pear', 'orange',\
  \ 'peach']\n```\n\n在 Python 中，还有一些不采用 `object.method()` 语法的其他编辑列表的方式，例如：\n\n```\n\
  myList[4] = 'lemon'\nprint(myList)\n['apple', 'banana', 'kiwi', 'pear', 'lemon',\
  \ 'peach']\nprint(sorted(myList))\n['apple', 'banana', 'kiwi', 'lemon', 'peach',\
  \ 'pear']\n```\n\n列表在 Python 中极其灵活，还有很多使用它们的方法，我们将在其他章节中看到。不过现在，如果你想更深入地研究一下 Python\
  \ 列表的用法，可以看看 Python 官方网站上的这篇[数据结构文档](https://docs.python.org/2/tutorial/datastructures.html)。\n\
  \n## Python 字典是你的朋友\n\n既然我们已经开始了解如何将生物学序列存储为 Python 字符串，并使用 `[from:to]` 字符串切片符号来访问片段，那么让我们看看\
  \ Python 中最有用的特性之一——字典——如何帮助我们分析生物学序列。\n\n我们是否已经提到过 **Python 字典是你的朋友？**\n\nPython\
  \ 字典是一个带标签的项目的存储库。项目的顺序不像在字符串或列表中那样至关重要，因此，项目不是根据其数值位置来标记，而是几乎可以按照我们选择的任何方式进行标记——例如：\n\
  \n```\nmusician = {'name':'Nigel','instrument':'guitar','preferred volume':11,}\n\
  print(musician['name'])\nNigel\nprint(musician['instrument'])\nguitar\nprint(musician['preferred\
  \ volume'])\n```\n\nPython 字典由**键值对**组成，其中**键**是查找项目所用的标签，**值**显然是项目的值。字典的值可以是任何*不可变*的\
  \ Python 对象——例如：\n\n```\ngene = {'name':'p53','taxonomy':9606,'metal binding':True,\
  \ \\\n'locations':['cytoplasm','nucleus']}\nprint(gene['name'])\np53\nprint(gene['taxonomy'])\n\
  9606\nprint(gene['metal binding'])\nTrue\nprint(gene['locations'])\n['cytoplasm',\
  \ 'nucleus']\nprint(gene['locations'][0])\ncytoplasm\nprint(gene['locations'][1])\n\
  Nucleus\n```\n\n![../images/476668_1_En_3_Chapter/476668_1_En_3_Figd_HTML.jpg](img/476668_1_En_3_Figd_HTML.jpg)\n\
  \n在此示例中，**键**都是字符串，但**值**包括一个字符串、一个整数、一个布尔值和一个列表。请注意，引用字典内嵌列表中项目的逻辑仍然适用——与我们之前列表嵌套列表示例的唯一区别在于，这里使用键（而非数值位置）来引用字典项。\n\
  \n好了，回到字典的话题……\n\nPython 中的字典键名**必须是唯一的**，并且可以是任何**不可变**对象类型，因此字符串和数字可以作为字典键，但列表（如前所述是可变的）则不可以。顺便提一下，Python\
  \ 中实际上有一种特殊的不可变列表类型，称为**元组**，它用普通圆括号括起来，以区别于可变列表。元组*可以*用作字典键，不过我们暂时不再多说元组了。\n\n\
  可以通过简单的声明直接将新条目添加到字典中，例如：\n\n```\ngene['name'] = 'homo sapiens'\ngene['id'] = 96020344\n\
  ```\n\n也可以像这样创建一个空字典：\n\n```\ngene = {}\n```\n\n因此，在列表 3-7 中，我们创建了一个核苷酸分子量的字典（如果你是生物学家，这真的很有用！），然后创建了一个计算寡核苷酸分子量的函数，最后使用一个短\
  \ DNA 序列测试了我们的新函数。\n\n```\ndnaMolecularWeight = {'a':313.2,'c':289.2,'t':304.2,'g':329.2}\n\
  def oligoMolecularWeight(sequence):\n    dnaMolecularWeight = {'a':313.2,'c':289.2,'t':304.2,'g':329.2}\n\
  \    molecularWeight = 0.0\n    for base in sequence:\n        molecularWeight +=\
  \ dnaMolecularWeight[base]\n    return molecularWeight\n\ndnaSequence = 'tagcgctttatcg'\n\
  print(oligoMolecularWeight(dnaSequence))\n4002.59999999999\n```\n\n**列表 3-7** 计算分子量\n\
  \n太棒了！\n\n\n\n### 用 Python 编写的 DNA 限制性内切酶酶切函数\n\n现在我们来看一个稍微复杂一点的案例，其中我们可以将字典和列表结合使用——计算限制性内切酶酶切后产生的\
  \ DNA 片段的分子量。\n\n限制性内切酶的活性可以通过其在 DNA 序列上的识别位点以及相对于该识别位点的切割位置来定义。我们来创建一个字典，用于定义这些限制性内切酶的参数：\n\
  \n```\nrestrictionEnzymes = {}\n```\n\n并添加几个限制性内切酶，以便开始使用：\n\n```\nrestrictionEnzymes['bamH1']\
  \ = ['ggatcc',0]\nrestrictionEnzymes['sma1'] = ['cccggg',2]\n```\n\n请注意，该字典中每个条目的**键**是酶的名称，而值是一个列表，其第一个元素是酶的识别位点，第二个元素是酶相对于识别位点切割\
  \ DNA 的位置。\n\n你可以想象为这个字典添加一整批限制性内切酶，甚至将其用作一种简单的限制性内切酶数据库，从而进行数字化的 DNA 限制性酶切实验。然而，你几乎肯定需要一种方法来跟踪字典中存在哪些酶，并且能够查询字典中是否包含你感兴趣的酶。\n\
  \n如果要在代码中使用字典，有两个非常有用的字典方法你应该了解，描述它们的最佳方式是看看它们在实际中的应用：\n\n```\nprint(restrictionEnzymes.keys())\n\
  ['bamH1', 'sma1']\nprint('sma1' in restrictionEnzymes)\nTrue\nprint('EcoR1' in restrictionEnzymes)\n\
  False\n```\n\n这里再次使用了 `object.method()` 语法来访问为字典对象定义的方法。`keys()` 方法返回一个包含字典所有键的**列表**，而检查指定的键是否\
  \ `in` 字典则返回 `True` 或 `False`。请注意，`keys()` 方法返回的字典键列表不一定按输入顺序排列，也不一定是字母顺序或其他特定顺序。**Python\
  \ 字典的排序方式与 Python 列表不同**，因此你不能像操作列表那样通过位置来引用字典条目。\n\n顺便提一下，你当然可以使用之前用过的 `sorted()`\
  \ 函数按字母顺序对键进行排序，如下所示：\n\n```\nprint(sorted(restrictionEnzymes.keys()))\n['bamH1',\
  \ 'sma1']\n```\n\n在我们深入介绍限制性内切酶酶切函数的完整代码之前，需要介绍另一个非常有用的字符串方法，即 `find`。它的工作原理如下：\n\
  \n```\nmySequence = 'gctgtatttcgatcgatttatgct'\nprint(mySequence.find('ttt'))\n\n\
  print(mySequence.find('gtgtgt'))\n\n```\n\n请注意，`mySequence.find` 方法返回字符串 `mySequence`\
  \ 中**第一个**出现的子串 `'ttt'` 的位置。如果我们搜索一个**不在**该序列中的子串（`'gtgtgt'`），`find` 方法会返回 `-1`，表示未找到该子串（注意，`find`\
  \ 不能使用 `0` 表示“未找到”，因为这实际上是 Python 字符串中第一个位置的索引，`0` 表示子串就在那个位置）。\n\n但还要注意，`mySequence`\
  \ 中还有第二个 `'ttt'` 出现。如果我们想找出 `mySequence` 中所有 `'ttt'` 的出现位置该怎么办呢？对于我们想要编写的限制性内切酶酶切函数来说，肯定需要能够做到类似的事情。\n\
  \n我们仍然可以在限制性内切酶酶切函数中使用 `find` 方法，但需要了解该方法可以接受的一些额外参数，在此过程中，我们还将学习函数中的**默认参数**。\n\
  \n如果我们查看 `find` 方法声明的代码，它看起来应该是这样的：\n\n```\ndef find(self,substring,start=None,end=None):\n\
  ```\n\n请记住，方法只是针对其定义所操作对象的函数（正式地说，它们操作的是**特定类的实例**，但更多内容将在后续的**面向对象编程**和**Python\
  \ 类**中介绍）。所以暂时不必过于纠结 `self` 参数，这只是方法特有的语法，通过它，方法将对象作为第一个参数接收，从而知道它操作的是哪个对象。\n\n\
  我们真正关心的是方法声明中已经预定义的两个参数 `start` 和 `end`。Python 允许我们为函数和方法的参数声明默认值，这样我们就无需每次都输入它们。当某个参数几乎总是相同时，这会非常有用——例如：\n\
  \n```\ndef automobile(color,horsepower,wheels=4):\n```\n\n这允许我们这样使用该函数：\n\n```\n\
  myCar = automobile('火焰灰',300)\n```\n\n在该函数中，默认情况下会自动设置为四个轮子。但我们也允许在需要时指定轮子数量（例如，处理相对罕见的三轮汽车情况）：\n\
  \n```\nmyCar = automobile('钴黑色',150,3)\n```\n\n类似地，我们可以覆盖 `find` 方法的默认 `start` 和\
  \ `end` 参数，以便强制在字符串的不同区域进行搜索。这样，每次找到 `'ttt'` 子串时，我们都可以从下一个位置重新开始搜索：\n\n```\nprint(mySequence.find('ttt'))\n\
  \nprint(mySequence.find('ttt',7))\n\n```\n\n在我们使用的这个简单示例中，一眼就能看出只有两个 `'ttt'` 子串出现，但如果处理的是更长的序列和/或更复杂的子串呢？\n\
  \n我们需要一种方法，能够连续迭代整个序列，从头到尾识别出所有子串的位置。让我们通过引入 Python 的 `while` 运算符来看看如何实现这一点：\n\n\
  ```\nfound = 0\nsearchFrom = found\nwhile found != -1:\n    found = mySequence.find('ttt',searchFrom)\n\
  \    if found != -1:\n        print('子串发现于: ',found)\n        searchFrom = found\
  \ + 1\n子串发现于:  6\n子串发现于:  16\n```\n\n只要 `while` 包含的条件为真，它就会继续迭代执行其后缩进的代码块。在这里，我们利用了\
  \ `find` 方法在找不到更多子串时返回 `-1` 的特性。循环的工作非常简单：我们搜索子串，每次找到时报告它并更新下一次搜索的起始位置，然后重复，直到最终\
  \ `find` 方法返回 `-1`。\n\n现在，我们终于可以编写本章一直致力于构建的函数了——一个接收 DNA 序列并计算限制性内切酶酶切后产生的 DNA\
  \ 片段分子量的函数。\n\n我们将使用本章之前创建的 `oligoMolecularWeight` 函数来计算片段的分子量——我们还将使用之前创建的限制性内切酶字典。\n\
  \n在函数内部，我们将片段及其分子量存储为函数将要返回的**元组列表**。回想一下我们之前的讨论，**元组只是一个不可变的列表**，在 Python 中它与列表的区别在于使用圆括号而不是方括号。例如：\n\
  \n```\nfruit = ['苹果','橙子']\nprint(fruit)\n['苹果', '橙子']\nfruit[1] = '梨'\nprint(fruit)\n\
  ['苹果', '梨']\nfruit = ('苹果','橙子')\nprint(fruit)\n('苹果', '橙子')\nfruit[1] = '梨'\nTypeError:\
  \ 'tuple' 对象不支持元素赋值\n此行将在每次循环迭代中执行\n```\n\n\n然而，在其他所有方面，元组的行为与列表类似，但一旦创建，如果不创建新元组就无法编辑。如前所述，元组因这一特性可用作字典键，同时它们也适用于创建那些一旦生成就不得编辑的列表，这对于我们限制性内切酶消化函数的结果来说似乎很合适。\n\
  \n那么闲话少叙，让我们直接进入清单 3-8 中的 DNA 限制性内切酶消化函数。\n\n```\nrestrictionEnzymes = {}\nrestrictionEnzymes['bamH1']\
  \ = ['ggatcc',0]\nrestrictionEnzymes['sma1'] = ['cccggg',2]\ndef restrictionDigest(sequence,enzyme):\n\
  motif = restrictionEnzymes[enzyme][0]\ncutPosition = restrictionEnzymes[enzyme][1]\n\
  fragments = []\nfound = 0\nlastCut = found\nsearchFrom = lastCut\nwhile found !=\
  \ -1:\nfound = sequence.find(motif,searchFrom)\nif found != -1:\nfragment = sequence[lastCut:found+cutPosition]\n\
  mwt = oligoMolecularWeight(fragment)\nfragments.append((fragment,mwt))\nelse:\n\
  fragment = sequence[lastCut:]\nmwt = oligoMolecularWeight(fragment)\nfragments.append((fragment,mwt))\n\
  lastCut = found + cutPosition\nsearchFrom = lastCut + 1\nreturn fragments\n```\n\
  \n*清单 3-8* DNA 限制性内切酶消化函数\n\n接下来，让我们逐步解析它……\n\n```\ndef restrictionDigest(sequence,enzyme)\n\
  motif = restrictionEnzymes[enzyme][0]\ncutPosition = restrictionEnzymes[enzyme][1]\n\
  ```\n\n该函数接受两个参数：DNA 序列和来自 `restrictionEnzymes` 库的酶名称。为了让代码更具可读性，我们将限制性位点序列赋值给 `motif`，将切割位置赋值给\
  \ `cutPosition`。\n\n```\nfragments = []\nfound = 0\nlastCut = found\nsearchFrom\
  \ = lastCut\n```\n\n接着我们创建一个列表，用于存储并最终返回消化结果，同时初始化一些重要变量，用于追踪我们在序列中的处理进度。变量 `found`\
  \ 表示最后一个找到的限制性位点的位置，初始化为序列的起始位置。变量 `lastCut` 存储上一次切割 DNA 的位置（可能与限制性位点的起始位置不同），这用于定义当前片段的起始位置（同时也是上一个片段的结束位置）。变量\
  \ `searchFrom`（同样是为了提高代码可读性而引入）指示下一次搜索应从何处开始，它总是上一次切割 DNA 位置的下一个位置。\n\n```\nwhile\
  \ found != -1:\nfound = sequence.find(motif,searchFrom)\nif found != -1:\nfragment\
  \ = sequence[lastCut:found+cutPosition]\nmwt = oligoMolecularWeight(fragment)\n\
  fragments.append((fragment,mwt))\nelse:\nfragment = sequence[lastCut:]\nmwt = oligoMolecularWeight(fragment)\n\
  fragments.append((fragment,mwt))\nlastCut = found + cutPosition\nsearchFrom = lastCut\
  \ + 1\n```\n\n函数的剩余部分通过一个 `while` 循环遍历 DNA 序列，只要 `sequence.find` 方法成功找到另一个限制性位点，循环就会继续。当找到位点时，计算当前片段并将其存入\
  \ `fragments` 列表。\n\n请注意，一旦 `sequence.find` 方法未能找到另一个限制性位点，我们需要完成从当前位置到序列末尾的最后一个片段，并将其与其他片段一起存储。\n\
  \n在每次循环迭代结束时，我们更新上一次 DNA 链的切割位置，以及下一次循环搜索的起始位置（如果还有下一次循环的话）。\n\n现在，让我们用一个虚构的 DNA\
  \ 序列来测试限制性内切酶消化函数。我特意在该序列中插入了两个 `bamH1` 限制性位点（当然，你首先需要执行清单 3-8 中的代码）：\n\n```\ndigestSequence\
  \ = 'gcgatgctaggatccgcgatcgcgtacgatcgtacgcggtacggacggatccttctc'\nprint(restrictionDigest(digestSequence,'bamH1'))\n\
  [('gcgatgcta', 2800.7999999999997), ('ggatccgcgatcgcgtacgatcgtacgcggtacggac', 11478.400000000005),\
  \ ('ggatccttctc', 3345.1999999999994)]\n```\n\n太棒了！\n\n我们的函数以元组列表的形式返回限制性内切酶消化片段，每个元组包含片段的序列及其分子量。这个函数本身就非常实用，但这还仅仅触及了\
  \ Python 处理生物序列能力的皮毛。稍后，我们将看到 Python 最强大的工具之一——**正则表达式**，如何被用于大规模基因组学和测序应用。但在那之前，我们将通过贝叶斯定理，进行一个关于\
  \ Python 数学表达式和字符串格式化的简短停留。\n\n"
