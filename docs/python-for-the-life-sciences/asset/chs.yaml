  \ (冷泉港出版社, 2007)\n- Bintu, Buchler, Garcia, Gerland, Hwa, Kondev, 和 Phillips (2005a).\
  \ 转录调控的数字化：模型.^(¹⁶⁵) *《遗传学与发展当前观点》*, **15**, 116–124\n- Bintu, Buchler, Garcia,\
  \ Gerland, Hwa, Kondev, Kuhlman, *等* (2005b). [转录调控的数字化：应用.](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3462814/)^(¹⁶⁶)\
  \ *《遗传学与发展当前观点》*, **15**, 125–135\n\n## 脚注\n\n### 13. 驯服网络毛团\n\n*使用 Python 集合挖掘系统生物学数据*\n\
