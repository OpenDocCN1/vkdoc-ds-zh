  ```


  看起来不错，所以在下一节中，我们将通过重写函数，使其反映方程中所示的贝叶斯定理的一般形式来收尾。


  ## 使用通用贝叶斯函数进行字符串格式化


  ```

  def bayes(outComeA,outComeB,pB,pAGivenB,pAGivenNotB):

  pNotB = 1.0 - pB

  pA = pAGivenB * pB + pAGivenNotB * pNotB

  pBGivenA = (pAGivenB * pB) / pA

  return ''p (%s | %s) = %.2f'' % (outcomeB, outcomeA, pBGivenA)

  代码清单 4-3

  一个带有 Python 字符串格式化的简单通用贝叶斯函数

  ```


  在代码清单 4-3 中，我们展示了一个函数，它在功能上（无意双关）与我们刚刚在代码清单 4-2 中实现的更具体的 `biomarker` 形式相同，区别在于我们现在增加了两个额外的参数
  `outComeA` 和 `outComeB`，这样我们就可以向函数提供我们要计算概率的结果 `pA` 和 `pB` 的描述。这两个描述性参数在函数的最终 `return`
  语句中被使用，以便以比通用方程更具可读性的形式输出结果。


  你还会在 `return` 语句中看到 Python 巧妙的字符串格式化用法。


  ```

  return ''p (%s | %s) = %.2f'' % (outcomeB, outcomeA, pBGivenA)

  ```


  这种字符串格式化语法允许你在 Python 字符串中为数字、文本或各种其他 Python 数据类型放置占位符，之后可以根据需要以编程方式将这些占位符插入到字符串中。在我们的函数中，我们将两个结果描述作为字符串（`%s`）输出，并将最终计算出的
  `pBGivenA` 概率作为保留两位小数的浮点数（`%.2f`）输出。


