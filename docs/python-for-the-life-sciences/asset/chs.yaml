- "# 一本面向现代生命科学家的书，怎么能避而不谈实验室里随处可见的可靠主力——96 孔板呢？\n\n如今，你走进几乎任何一间实验室，都随处可见这些小东西（也被称为微孔板）。近年来，使用\
  \ 96 孔板（及其他规格）板的高科技仪器数量激增，这更是加剧了它们在实验室中的普及。此外，这些仪器通常能够在相对很短的时间内扫描这些板并从中读取大量数据。因此，我们认为有必要专门用两章的篇幅来介绍这个不起眼的\
  \ 96 孔板，只是为了展示我们可以用 Python 处理和可视化孔板数据的几种方法，以及展示如何用它来创建能够与实验室自动化系统对接的软件。\n\n需要明确的是，96\
  \ 孔格式可能是目前最常用的孔板，但也存在许多其他网格布局的孔板。如果我们要编写简洁、可复用的代码，那么应该确保它能够处理孔数更少或更多的孔板，或者行列比例不同的孔板。别担心，我们会的。\n\
  \n最后这一段很好地引出了我们希望在代码中捕捉的这些检测孔板的第一个基本属性——数据点在二维网格上的组织方式。孔板上的每个孔实际上可能包含多个数据点，这些数据点都通过它们在二维网格上的共同坐标进行分组和关联。例如，你可以将孔的体积、光密度或其中任何内容的浓度视为独立的数据点。这个二维网格坐标可以表示为一个简单的一维参数——比如孔`15`——这是根据从左到右、从上到下读取孔板的方式，就像我们阅读大多数印欧语系文本一样。或者，它也可以采用常见的用于行和列的`字母:数字`格式来读取——例如`A6`、`B12`等等。如果我们想编写灵活通用的代码来处理孔板，为了导航孔板数据，我们可能需要能够在这几种不同的二维坐标系之间进行切换。但这样做还有另一个充分的理由……\n\
  \n## 我们提到机器人了吗？\n\n生物实验室里到处都是带有机器人组件的仪器和读板机，这些组件能够逐个孔地移动、扫描、采样，甚至装载孔板。这给处理孔板数据的软件带来了全新的挑战。是的，数据将在这个二维网格上组织，但软件可能还需要物理上处理孔板本身，或者读取/采样/装载孔板的扫描器或移液器头。在关于孔板检测的第二章（即本章的下一章）中，我们不会教你如何编写驱动\
  \ [Arduinos](https://en.wikipedia.org/wiki/Arduino) 或其他用于机器人应用的物理设备的底层代码，但我们会编写能够生成驱动机器人所需的高级指令的代码，并期望它在某个时候可能需要连接到某种能够驱动机器人、或者至少能够接收和解释来自机器人的位置数据的机器控制软件。\n\
  \n## 介绍 96 孔板\n\n那么，让我们快速看一下 96 孔板，以提醒我们自己正在处理的是什么。\n\n在图 9-1 中，你可以从板左侧压印的字母 A 到\
  \ H，以及顶部压印的数字 1 到 12 看出，该板遵循我们已经描述过的惯例，即使用字母标签表示行，数字标签表示列。这个板也显示了典型板的 8 行乘 12 列的矩形格式。值得注意的是，这种矩形格式几乎是通用的，但也存在其他格式的板——例如正方形，具有相同的行数和列数。\n\
  \n![../images/476668_1_En_9_Chapter/476668_1_En_9_Fig1_HTML.jpg](img/476668_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1 标准 96 孔板\n\n我们将假定一个孔板可以有任意宽高比（对应于或多或少任意数量的行和列）来编写代码，但我们将假定一个孔板始终具有固定的`x，y`轴方向，其中对应于板列的`x`轴用数字标记，对应于板行的`y`轴用字母标记。因此，例如，一个特定的孔可能有坐标`D10`，对应于\
  \ y 轴上的行`D`和 x 轴上的列`10`。\n\n如果你一直留意的话，你会发现我们将始终以`行:列`格式——换句话说，就是`y:x`格式——来引用板上的位置。这符合我们组织表格数据的方式，而这种方式可能源于我们西半球人[几千年前](https://en.wikipedia.org/wiki/Writing_system%2523Directionality)就书写文本布局共同做出的一些选择。\n\
  \n由于孔板也是一个聚合了许多属性和参数的对象的好例子，因此孔板的概念非常适合（不是双关语）表示为 Python 对象。类似地，板上的每个孔本身可以被视为一个属性的聚合体，其中最重要的就是它在板上的坐标。基于这些考虑，我们将使用面向对象编程（OOP）的方法来编写我们的孔板管理代码。\n\
  \n## 用于多孔板的 Python 类\n\n关于坐标系的这个讨论很好地引出了我们希望多孔板类拥有的一个基础属性。由于孔板的孔可以说是排列在一个网格上，我们需要能够说出我们在板上的位置，换句话说，我们在谈论哪个孔。我们还需要知道孔的顺序以及我们如何从一个孔移动到下一个孔。例如，如果我们正在从[逗号分隔值](https://en.wikipedia.org/wiki/Comma-separated_values)（CSV）文件中读取孔板检测数据，以便将每个数据点分配到正确的孔，我们需要能够虚拟地穿过孔板，将文件中的数据正确映射到\
  \ Python 的孔板对象。此外，如果我们希望代码能够驱动机器人以从孔板读取数据（例如，使用分光光度传感器）或将液体移液到孔中，我们需要知道如何在孔板上水平和垂直移动。例如，在一个有\
  \ 12 列的 96 孔板上，当机器人水平地遍历了一行 12 个孔后，它需要知道下一个孔位于其当前位置向下 1 行、向后退 12 列的位置，才能移动到那里。\n\
  \n对于多孔板，我们至少可以使用三种有用的坐标系：对于板的二维布局，二维坐标系似乎是最直观的。我们可以使用`行:列`表示法来实现这一点，既可以使用数字（为行和列使用简单的数字），也可以使用字母数字（为行使用字母标签，为列使用数字）。第一个系统的坐标看起来像这样：\n\
  \n\n\n```python\n### 排版后的文本\n\n- `(1,1), (2,3), (6,10)`\n\n第二个系统的坐标如下：\n\n- `A01`,\
  \ `B03`, `F10`\n\n这基本不言自明，但为什么在列整数前加零呢？这只是一个小技巧，使所有孔标签长度一致。其原因现在可能不明显，但请耐心等待，一切都会解释清楚！对于像孔板这样的二维物体，使用一维坐标系的原因可能不那么明显，但这种更简单的坐标系也有其用途，我们很快就会看到。一维坐标系简单地以线性方式反映了板上孔的顺序，从第一个到最后一个。根据我们书写和阅读的方式，从左到右、从上到下的系统似乎很自然，对于一个\
  \ 96 孔板，该系统会将左上角的孔标记为 1，右下角的孔标记为 96——从左到右读取每一整行，然后向下移动到下一行的最左侧孔。\n\n从**处理**的角度来看，一维坐标系非常有用，因为当我们物理地（例如，使用机器人）或虚拟地（例如，从输入流读取板分析数据）处理多孔板时，我们经常需要知道**序列中的下一个孔是什么**，这样才能遍历板上所有孔。\n\
  \n最后，我们需要能够将这些坐标系相互映射，以便在不同应用之间一致地切换。这一切归结为：在我们实现处理多孔板的 Python 类的代码中，我们的类构造函数方法将主要致力于设置板的布局和用于在其中移动的坐标系。\n\
  \n那么，让我们开始编写用于处理多孔板的 Python 类的`__init__`构造函数方法，如清单 9-1 所示。\n\n```python\nimport\
  \ math, os, string, csv\nimport matplotlib.pyplot as plt\nclass Plate:\n    rowLabels\
  \ = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n    mapPositions = {'position1D':0,'position2D':1,'wellID':2}\n\
  \    def __init__(self,id,rows,columns):\n        self.id = id\n        self.rows\
  \ = rows\n        self.columns = columns\n        self.size = self.rows * self.columns\n\
  \        self.validate = {}\n        self.data = {}\n        for key in Plate.mapPositions:\n\
  \            self.validate[key] = []\n        for n in range(1,self.size+1):\n \
  \           self.data[n] = {}\n            m = self.map(n,check=False)\n       \
  \     for key in Plate.mapPositions:\n                self.validate[key].append(m[Plate.mapPositions[key]])\n\
  ```\n\n清单 9-1 `Plate`类的构造函数\n\n你首先会注意到，我们导入了一些其他 Python 模块（如`matplotlib`），这些模块稍后会用到，但我们会根据需要再获取它们。\n\
  \n在`Plate`类的代码中，你会看到我们使用了**类变量**，这是我们在第 7 章关于 OOP 中介绍的概念。你会记得，这些变量对于类的每个实例不是唯一的，而是在类的所有实例之间共享。对于`Plate`类，我们有两个类变量：`rowLabels`和`mapPositions`。`rowLabels`变量定义了我们可以用于板的行标签。因此，尽管我们的类所表示的板理论上可以有任意数量的行和列，但通过引入这个允许的行标签列表，我们默认假设一个板永远不会超过\
  \ 26 行。如果需要，我们可以扩展这个假设，但这可能会不必要地使事情复杂化——例如，我们可能需要扩展代码以处理两个或更多字母的行标签。然而，为了本章的目的，我们将坚持使用大写字母\
  \ A-Z 作为行标签，并假设所有板最多有 26 行。\n\n`mapPositions`类变量需要一点解释。考虑到我们希望在我们的类中支持三种板坐标系，并且我们希望能够在它们之间进行任意映射——实现这些目标的一个直接明了的做法是编写一系列六个映射函数，如图\
  \ 9-2 所示。\n\n![../images/476668_1_En_9_Chapter/476668_1_En_9_Fig2_HTML.jpg](img/476668_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2 96 孔板的映射函数\n\n首先，这需要编写和维护大量代码，并且在可能需要对一个孔进行多次映射的情况下，它还会迫使我们单独存储、跟踪和使用每个函数的输出坐标。此外，我们还需要跟踪输入坐标并正确使用它们，因为每个函数只期望一种坐标类型作为输入。一个干净优雅的解决方案是编写一个主映射函数，它接受三种坐标类型中的任何一种作为输入，并以单个结构化变量（如元组）输出所有三种映射。我们一些更有远见的读者可能已经意识到，这会导致少量的冗余，因为该函数的计算输出之一将与输入相同，但为了方便起见，这是值得付出的微小代价。最后，`mapPositions`类变量的存在理由是在全局范围内定义坐标映射函数输出中映射坐标类型的顺序。如果你不太确定这是如何工作的，不用担心，当我们看到映射函数的实际代码时，一切都会变得清晰。\n\
  \n出于透明度的考虑，我们还应该承认，选择这种方法的另一个原因是希望有机会介绍 Python[类型](https://docs.python.org/2/library/stdtypes.html)^([¹¹⁵])，并演示如何使用它们创建可以处理不同类型输入的\
  \ Python 函数。当我们看到执行实际坐标映射的代码时，你将很快看到它是如何工作的。但现在，让我们继续剖析类的构造函数。\n\n如果我们查看`__init__`构造函数方法的函数签名，可以看到它接受三个参数（除了始终传递给实例方法的`self`之外）：`id`、`rows`和`columns`。\n\
  \n```python\ndef __init__(self,id,rows,columns):\n```\n\n`id`参数允许输入一个唯一 ID 来标识板。这对于任何一种实验室自动化过程（例如，使用机器人）几乎肯定非常重要，因为实际的物理板可能有某种跟踪\
  \ ID，我们需要记录并将其附加到相应的板数据上。请注意，此 ID 与类实例 ID 或任何其他内部 Python 引用无关。`rows`和`columns`参数不言自明，将用于定义板的布局以及坐标映射。声明为空字典的`validate`字段将用于检查我们支持的三种坐标系中任何一种格式的坐标输入对于当前板是否有效（我们稍后会看到它是如何工作的）。`data`字段（也是一个\
  \ Python 字典）将用于保存每个孔的实际数据。这些数据可能是例如实验室测量的光密度或 pH 值，或者是描述孔中设置条件的参数，如化学浓度或孔是否为对照样品。\n\
  \n\n\n接下来，我们设置`validate`字典。该字典将包含三个列表，分别存储三种有效输入坐标，对应我们希望支持的三种孔板坐标系。这个键值对字典的键将来自类变量`mapPositions`。对于每个键，我们将其初始值定义为一个空列表，如下所示：\n\
  \n```\nfor key in Plate.mapPositions:\nself.validate[key] = []\n```\n\n在我们的`__init__`构造函数方法中，其余代码只是简单地从**1**到**n**（其中**n**为孔位数量）遍历孔板上的每个位置，并使用映射函数生成代表每个位置的三组等效坐标。\n\
  \n### 导航孔板\n\n稍后我们将了解映射方法的工作原理，但在深入探讨该方法的具体机制之前，先看一下清单 9-2 中的代码及其返回值。\n\n```\ndef\
  \ map(self,loc,check=True):\nif type(loc) == type(15):\nif check:\nif not loc in\
  \ self.validate['position1D']:\nraise Exception('Invalid 1D Plate Position: %s'\
  \ % str(loc))\nrow = int(math.ceil(float(loc)/float(self.columns))) - 1\ncol = loc\
  \ - (row * self.columns) - 1\nelif type(loc) == type((3,2)):\nif check:\nif not\
  \ loc in self.validate['position2D']:\nraise Exception('Invalid 2D Plate Position:\
  \ %s' % str(loc))\nrow = loc[0] - 1\ncol = loc[1] - 1\nelif type(loc) == type('A07'):\n\
  if check:\nif not loc in self.validate['wellID']:\nraise Exception('Invalid Well\
  \ ID: %s' % str(loc))\nrow = Plate.rowLabels.index(loc[0])\ncol = int(loc[1:]) -\
  \ 1\nelse:\nraise Exception('Unrecognized Plate Location Type: %s' % str(loc))\n\
  pos = self.columns * row + col + 1\nid = \"%s%02d\" % (Plate.rowLabels[row],col+1)\n\
  return (pos,(row+1,col+1),id)\n```\n\n清单 9-2\n\n`Plate`类中的`map`方法\n\n`map`函数的代码中包含大量优秀的\
  \ Python 学习内容，稍后我们将详细探讨。不过，首先要关注的是函数末尾的`return`语句。\n\n```\nreturn (pos,(row+1,col+1),id)\n\
  ```\n\n我们可以看到`map`返回一个包含三个值的元组——每个值对应一种坐标系。这样我们就避免了如前图所述那样，需要编写六个独立的函数，每个函数有六个独立的输入和输出。我们的`map`函数将三种坐标类型中的任意一种作为输入，并输出一个包含全部三种映射结果的元组。我们还可以利用类变量`mapPositions`来追踪元组中哪个位置对应哪种坐标系。亲爱的读者，这里有一个小问题要问您……您会注意到，我们硬编码了`mapPositions`方法的输出——换句话说，我们只是直接将每种坐标类型插入到输出元组中，而没有直接使用`mapPositions`类变量。这种解决方案编码起来很快，但缺乏一定的鲁棒性。例如，如果我们决定改变`mapPositions`的顺序，将`wellID`坐标系放在第一位会怎样？这将破坏我们的大部分代码，因为在组装`map`输出元组时，我们没有直接使用`mapPositions`类变量，所以返回元组中坐标系的顺序是硬编码且*静态*的，也就是说，即使我们更改了`mapPositions`中的顺序，它也不会改变。我们如何通过使用`mapPositions`类变量来配置`map`方法返回的值，从而使代码更加健壮？\n\
  \n我们也可以返回一个像`mapPositions`一样的字典，包含与`mapPositions`相同的三个键（`position1D`、`position2D`、`wellID`），但每个键对应的值是映射后该坐标系统的实际坐标，如下所示：\n\
  \n```\n{'position1D':9,'position2D':(2,3),'wellID':'B03'}\n```\n\n或者，以真正的面向对象编程风格，我们甚至可以创建一个映射坐标类，其中三种坐标系分别对应对象中的一个字段。此外，我们还可以将整个`map`方法嵌入到新类中，并让我们的`__init__`构造函数方法接受三种坐标类型中的任意一种作为参数。这种方法的唯一问题是，现在孔板和坐标分成了两个类，但它们之间又相互依赖。不过，这个问题很容易解决。这里给读者再提一个小*思想实验*：您将如何使用独立但相互依赖的孔板类和坐标类，以一种健壮的面向对象编程方法来编写这个问题的代码？如需灵感，可以回顾第\
  \ 7 章中的面向对象编程介绍。现在回到我们常规的编程任务（双关语）……\n\n我们已经添加了`map`函数的代码，现在来做个简单测试：创建一个经典的 96 孔板（8\
  \ 行 12 列），并运行一些`map`测试。\n\n```\np = Plate('Assay 42',8,12)\nprint(p.map(1))\n(1,\
  \ (1, 1), 'A01')\nprint(p.map((1,1)))\n(1, (1, 1), 'A01')\nprint(p.map('A01'))\n\
  (1, (1, 1), 'A01')\nprint(p.map(96))\n(96, (8, 12), 'H12')\nprint(p.map((8,12)))\n\
  (96, (8, 12), 'H12')\nprint(p.map('H12'))\n(96, (8, 12), 'H12')\nresult = p.map('B01')\n\
  print(result[Plate.mapPositions['wellID']])\nB01\n```\n\n最后一段代码展示了如何使用类变量`mapPositions`来“记住”每个坐标映射在输出元组中的位置，这样我们就不必为了引用所需的坐标类型而显式输入元组中的位置了。\n\
  \n在完全深入`map`函数的代码之前，我们已经通过一个“黑盒”示例了解了它在输入和输出层面的工作原理。现在，我们可以理解`__init__`构造函数方法是如何构建`validate`字典的——该字典用于验证（或拒绝）提供给孔板类任何方法的输入坐标。`validate`字典有三个键，直接取自我们作为类变量创建的`mapPositions`字典，每个键对应一种坐标系。每个键的值只是一个列表，包含该坐标系下所有有效的孔板坐标。\n\
  \n因此，对于一个 8 行 12 列的 96 孔板，每种坐标系的有效值如下：\n\n- 坐标系`position1D`：**1, 2, 3, … 94, 95,\
  \ 96**\n- 坐标系`position2D`：**(1,1), (1,2), (1,3), … (8,10), (8,11), (8,12)**\n- 坐标系`wellID`：**‘A01’,\
  \ ‘A02’, ‘A03’, … ‘H10’, ‘H11’, ‘H12’**\n\n如果我们查看清单 9-1 中构造函数里实际填充`validate`字典的代码段：\n\
  \n```\nfor n in range(1,self.size+1):\nself.data[n] = {}\nm = self.map(n,check=False)\n\
  for key in Plate.mapPositions:\nself.validate[key].append(m[Plate.mapPositions[key]])\n\
  ```\n\n我们可以看到，它遍历了孔板的所有`position1D`坐标，即从**1**到**n**（其中**n**为孔位数量）的整数序列，并为每个位置生成一个包含三个坐标映射的元组。每个映射值随后被添加到`validate`字典中对应坐标类型的有效坐标列表中。\n\
  \n对此有几点说明：首先，你会看到循环的范围是从`1`到孔板的`size`字段加 1。\n\n```\nfor n in range(1,self.size+1):\n\
  ```\n\n\n\n这是为什么呢？  \n请务必牢记：所有 Python 序列（例如字符串）和列表的索引都是从 0 开始的。遵循这一惯例，Python 的 `range()`\
  \ 方法生成的数值总是**包含起始值，但不包含**第二个范围参数。例如，`range(0, 100)` 会生成 0 到 99 的数值——换句话说，这 100 个值恰好对应一个包含\
  \ 100 个元素的 Python 序列或列表的正确索引。  \n\n![../images/476668_1_En_9_Chapter/476668_1_En_9_Figd_HTML.jpg](img/476668_1_En_9_Figd_HTML.jpg)\
  \  \n\n目前不必过多纠结其缘由，只需记住这些非常重要的 Python 事实，在此值得重申：  \n\n- 所有有序的 Python 序列和列表的元素**都是从\
  \ 0 开始索引的**。  \n- 长度为 `n` 的有序 Python 序列或列表中的最高索引是 `n – 1`。  \n- 调用 `range(m, n)`\
  \ 会生成从 `m` 到 `n – 1` 的所有整数值。  \n\n对于多孔板，我们通常习惯将孔从 `1` 到 `n` 编号，而不是从 0 开始。因此，如果从\
  \ 1 开始编号，我们需要在代码中将 `range()` 方法调整为 `n + 1`（即 `self.size + 1`）。  \n\n其次，在调用 `map`\
  \ 方法时，那个神秘的 `check=False` 是怎么回事？  \n\n```python\nm = self.map(n, check=False)\n\
  ```\n\n原因是 `map` 方法具有双重功能。它不仅为输入坐标提供一组坐标映射，还会检查输入的坐标对于当前 `Plate` 实例是否有效。当我们首次运行\
  \ `map` 方法来生成有效坐标列表时，需要禁用这第二个坐标检查功能，因为我们实际上正在生成用于检查工作的坐标列表。换句话说，在生成有效坐标列表之前，我们无法根据这些坐标检查输入坐标！\
  \  \n这个设计很好地引出了对 `map` 方法代码的详细分析。  \n\n现在我们已经知道 `map` 方法签名中 `check=False` 的作用，让我们看看\
  \ `map` 是如何工作的。  \n\n查看 `map` 方法，可以发现它通过一个 `if`-`elif`-`else` 风格的条件语句被分成四个部分，该语句用于测试传递给方法参数\
  \ `loc` 的输入坐标的 `type`。  \n\n```python\nif type(loc) == type(15):\n    ... do this\n\
  elif type(loc) == type((3, 2)):\n    ... do that\nelif type(loc) == type('A07'):\n\
  \    ... do the other\nelse:\n    ... do something else altogether\n```\n\nPython\
  \ 的 `type` 方法，顾名思义，返回传递给它的对象的 `type`。例如，如果你在 Python 控制台中输入：  \n\n```python\na =\
  \ 9\nprint(type(a))\n```\n\n你会看到：  \n\n```python\n<type 'int'>\n```\n\n或者更简单，你可以这样输入：\
  \  \n\n```python\nprint(type(9))\n```\n\n所以，在第一个测试中，例如我们写的：  \n\n```python\nif type(loc)\
  \ == type(15):\n```\n\n我们是在测试 `loc` 是否是 `position1D` 坐标，由于这些坐标只是整数，我们也可以将测试写成： \
  \ \n\n```python\nif type(loc) == int:\n```\n\n实际上，对于所有三种坐标类型测试，我们都可以写成：  \n\n```python\n\
  if type(loc) == int:\nelif type(loc) == tuple:\nelif type(loc) == str:\n```\n\n\
  其中 `int`、`tuple` 和 `str` 是与孔板支持的三种坐标系中的坐标相对应的 Python 类型。这与我们选择的 `type` 测试实现方式效果相同，但当我们查看代码时，还需要记住每个\
  \ `type` 对应哪个坐标系，以及每种坐标的预期格式。例如，`wellID` 坐标类型必须是 `str` 类型，这并不能告诉我们，或者更重要的是，不能让阅读我们代码的其他人知道，它需要由一个大写行字母后跟一个两位数组成。\
  \  \n\n像这样编写输入 `wellID` 坐标的测试：  \n\n```python\nelif type(loc) == type('A07'):\n\
  ```\n\n能传达更多信息，并使代码更容易理解。  \n\n因此，`map` 方法被一组条件语句划分，每个条件用于处理一种特定的坐标类型。查看每种情况的代码，我们可以看到第一条语句就利用了\
  \ `check` 方法参数来决定是否对输入坐标执行有效性测试。  \n\n```python\nif check:\n    if not loc in self.validate['position1D']:\n\
  \        raise Exception('Invalid 1D Plate Position: %s' % str(loc))\n```\n\n你可能会对初始的\
  \ `check` 语句感到有点惊讶。我们难道不需要写：  \n\n- `if check == True:`  \n\n实际上，不需要。这展示了 Python\
  \ 中一个便捷的简写方式，值得稍作解释。理解这一点很重要（也很有启发性）：该方法会计算其后跟随的内容，以确定它是 `True` 还是 `False`。这通常是一些比较语句，比如：\
  \  \n\n```python\nif a > b:\n```\n\n或者更复杂的：  \n\n```python\nif (gene.length > 1000\
  \ and gene.hasBRE()):\n```\n\n无论如何，一旦语句被计算，你可以想象 `if` 后面的整个语句会被替换为 `True` 或 `False`，就像这样：\
  \  \n\n```python\nif True:\n```\n\n然后随后的代码块会根据结果决定是否执行。  \n在我们的例子中，变量 `check` 被设置为\
  \ `True` 或 `False`，因此直接计算该变量就足够了，我们不需要添加 `== True` 比较。  \n\n在继续之前，这段代码展示了你可以使用 `if`\
  \ 简写的其他方式。  \n\n```python\ndef testA(a):\n    if a:\n        return \"a seems to\
  \ be True\"\n    else:\n        return \"a seems to be False\"\n\nprint(testA(1))\
  \           # a seems to be True\nprint(testA(0))           # a seems to be False\n\
  print(testA(-1))          # a seems to be True\nprint(testA(0.0))         # a seems\
  \ to be False\nprint(testA(0.00001))     # a seems to be True\nprint(testA([]))\
  \          # a seems to be False\nprint(testA([1, 2, 3]))   # a seems to be True\n\
  print(testA(\"\"))          # a seems to be False\nprint(testA(\"a\"))         #\
  \ a seems to be True\n```\n\n*有趣*！Python 为你提供了一个便捷的简写，用于测试数值变量是否非零，或者有序集合（如字符串和列表）是否为空（换句话说，它们的长度是否为零）。\
  \  \n\n但回到我们的多孔板代码……  \n\n```python\nif check:\n    if not loc in self.validate['position1D']:\n\
  \        raise Exception('Invalid 1D Plate Position: %s' % str(loc))\n```\n\n如果\
  \ `check` 被设置为 `True`，则在 `Plate` 类构造函数中创建的 `validate` 字典中的相应列表中搜索输入坐标 `loc`，如果不在其中，则\
  \ `raise` 一个 `Exception`，并用适当的错误信息终止程序。  \n\n假设 `loc` 通过检查是有效的，接下来看看会发生什么。在接下来的两行代码中，我们计算与输入坐标对应的行和列索引。\
  \  \n\n```python\nrow = int(math.ceil(float(loc) / float(self.columns))) - 1\ncol\
  \ = loc - (row * self.columns) - 1\n```\n\n\n\n### 排版后的文档\n\n这看起来有点复杂，但实际上非常简单。让我们以一块\
  \ 8 行 12 列的 96 孔板为例来演练一下。假设我们要映射第 15 个孔位的坐标。在`position1D`格式中，`loc`的输入值就是整数 15。要计算它位于哪一行，我们需要除以列数。但\
  \ 12.0/15.0 等于 1.25。并没有 1.25 行，但我们可以将 1.25 理解为“第 1 行加上 0.25 个下一行”。这时就需要用到导入的 [Python\
  \ math 模块](https://docs.python.org/2/library/math.html)。`math.ceil` 方法将 1.25 向上取整为下一个最大的整数（浮点数），即\
  \ 2.0，这正是我们要找的行号。由于我们需要用浮点数进行运算，但又希望行号是整数，因此需要将整个结果强制转换为 `int` 类型。这样我们就得到了在孔板上标记的行号整数，但请记住，**Python\
  \ 集合的索引从 0 开始，而不是从 1 开始**，因此在我们的 `Plate` 类内部，孔板上的第 1 行被索引为第 0 行；因此，我们必须先减 1 来完成计算，这样就能与内部表述保持一致的运算。\n\
  \n![images/476668_1_En_9_Figf_HTML.jpg](img/476668_1_En_9_Figf_HTML.jpg)\n\n稍后，当我们准备输出映射后的坐标时，我们将从内部基于\
  \ 0 索引的孔板表述，转换回现实世界中孔板所使用的外部坐标系统，其行和列从 1 开始索引。请注意：这就是为什么我们说这两行代码计算的是行和列的**索引值**，而不是实际的行和列**编号**，稍后我们会将索引值转换回编号。\n\
  \n对于处理`loc`输入坐标的那段代码块，上述解释可能显得有些冗长，但如果你查看`map`方法，就会看到三种输入坐标类型的处理方式本质上是相同的。输入坐标会与`validate`字典进行比对，然后被转换成行和列索引，因为这是计算三种坐标格式中任意一种的非常便捷的起点，我们稍后会看到。\n\
  \n在进入返回包含三种映射的元组的最终计算之前，我们还需要提一下，我们还有一个`else`子句，用于捕获任何不符合三种坐标类型之一的输入——例如，如果有人输入了一个\
  \ Python 字典作为坐标。`else`子句只是处理可能传递给`map`方法但未被识别为三种坐标类型之一的“任何其他内容”。\n\n现在，我们准备完成`map`方法，并像这样输出坐标映射：\n\
  \n```\npos = self.columns * row + col + 1\nid = \"%s%02d\" % (Plate.rowLabels[row],col+1)\n\
  return (pos,(row+1,col+1),id)\n```\n\n我们计算`position1D`坐标`pos`，并在结果上加 1，以便用外部孔板坐标来表达。`position2D`坐标我们已经有了，因为我们已经计算了行和列索引，我们只需要记住对它们各自加\
  \ 1，以孔板坐标来表达，这在`return`语句的`(row+1,col+1)`部分完成。最后，我们需要以孔标签的形式计算`wellID`坐标，该标签包含一个行字母和列号。\n\
  \n现在，如果我们通过一个 96 孔板的例子，就能清楚地看到内部（从 0 开始索引）坐标和外部（从 1 开始索引）孔板坐标之间的区别。\n\n假设我们的输入坐标是\
  \ 5。这对应第 1 行、第 5 列，我们计算出的行索引和列索引分别是 0 和 4。要转换为`wellID`坐标，我们使用了一些更高级的 Python 字符串格式化（我们在第\
  \ 4 章首次介绍了字符串格式化）：\n\n```\nid = \"%s%02d\" % (Plate.rowLabels[row],col+1)\n```\n\
  \n`%s`格式你现在应该熟悉了，它将其转换为一个简单的字符串，这正是我们想要的行标签格式。`%02d`格式将其转换为长度为 2 的整数字符串表示，必要时前面补零。换句话说，像\
  \ 12 这样的整数会被格式化为“12”，而像 5 这样的整数则会被格式化为“05”。现在，我们只需使用行索引 0，配合`rowLabels`类变量来获取行标签——`rowLabels[0]`的值是`\"\
  A\"`——而实际（孔板上的）列号就是列索引加 1，得到 5。\n\n因此，我们的输入坐标 5 在`wellID`坐标系统中映射为字符串`\"A05\"`。剩下的就是`map`方法将包含三个坐标映射的元组装配并返回，就像这样：\n\
  \n```\nreturn (pos,(row+1,col+1),id)\n```\n\n呼！仅仅一个类方法就涵盖了这么多内容，但围绕这个`Plate`类创建章节的美妙之处在于，除了为读者提供使用\
  \ Python 处理多孔板的实用基础外，它还为我们作者提供了展示 Python 特性以及“Pythonic”做事方式的机会，而除生物学之外，这正是本书的精华所在。\n\
  \n在我们最终结束`map`方法的讨论之前。你们中观察力较强的读者可能已经注意到，一旦我们生成了包含每个坐标系统有效坐标列表的`validate`字典，我们本可以在后续直接使用这些列表来为`map`方法的任何坐标输入提供映射，而不是每次都重新计算映射。我们仍然需要`map`方法中编写的代码来计算`validate`字典中的那些初始列表，但是——没错——从那时起我们完全可以利用这些列表，而不是每次都重新计算映射。\n\
  \n如果你想知道这该如何实现，何不花点时间自己思考一下，甚至亲自实现一下呢。本着那些鼓励读者超越书本内容、围绕主题进行额外探索的教科书的精神，我们将使用`validate`字典中生成的坐标列表来实现一个更高效的`map`方法，作为留给读者的练习！\n\
  \n## 分配与检索孔板数据\n\n既然我们已经建立了定义孔板位置（孔）所需的坐标系统，现在让我们编写一些代码来向孔中添加数据并检索数据。为此，我们将创建几个新的`Plate`方法，非常直观且明确的命名就是`set`和`get`。\n\
  \n第一个`Plate`方法`set`如列表 9-3 所示。\n\n```\ndef set(self,loc,propertyName,value):\nm\
  \ = self.map(loc)\npos = m[Plate.mapPositions['position1D']]\nself.data[pos][key]\
  \ = value\nListing 9-3\nPlate 类的 set 方法\n```\n\n在仔细研读过`map`方法的代码之后，`set`方法的代码现在应该看起来相当不言自明了。该方法接受一个孔板位置（以我们支持的三种坐标格式之一）、一个属性名和一个值。然后，它为提供的位置生成映射，并使用`position1D`坐标将属性及其值作为**键值对**添加到我们在类构造函数中创建的孔板数据字典中。\n\
  \n\n\n### 文本排版处理\n\n您还记得在 `Plate` 类的 `__init__` 方法中，我们为 `data` 创建了一个空字典，然后遍历了培养板上的所有\
  \ `position1D` 位置，创建了由 `position1D` 坐标和一个空字典组成的键值对，用于存储该孔位的数据，如下所示：`5:{}`。例如，如果我们像这样使用\
  \ `set` 方法：\n\n```python\nmyPlate.set(5,'浓度',27.4)\n```\n\n然后像这样检查数据字典：\n\n```python\n\
  print(myPlate.data[5])\n```\n\n我们会看到\n\n```python\n{'浓度': 27.4}\n```\n\n仅从查看这个示例，现在很明显\
  \ `get` 方法应该如何通过孔位和属性来检索数据。一个有效的孔位坐标和一个属性将被传递给该方法，它会返回指定孔位的属性值，就像在清单 9-4 中所示。\n\n\
  ```python\ndef get(self,loc,属性名称):\n    m = self.map(loc)\n    pos = m[Plate.mapPositions['position1D']]\n\
  \    if 属性名称 in self.data[pos]:\n        return self.data[pos][属性名称]\n    else:\n\
  \        return\n```\n\n*清单 9-4* – `Plate` 类的 `get` 方法\n\n我们在这里添加了一个小细节，即我们不会直接返回指定孔位的属性值，而是首先检查指定的孔位是否实际拥有所引用的属性。如果我们不这样做，并且孔位字典不包含指定属性的键，那么我们的代码将会因错误而崩溃。相反，如果该属性不在孔位的字典中，我们会通过从方法中\
  \ `return` 来优雅地处理这种情况。\n\n在我们继续之前，让我们检查一下我们的 `set` 和 `get` 方法以确保它们能正常工作。\n\n```python\n\
  p = Plate('myPlate',8,12)\np.set('B01', '浓度', 0.87)\nprint(p.get(13, '浓度'))\n0.87\n\
  print(p.get((2,1), '浓度'))\n0.87\nprint(p.get('B01', '浓度'))\n0.87\n```\n\n## 从 CSV\
  \ 文件进行读写\n\n这一切都很好，但您可能并不想在实验室中手动输入所有来自培养板实验的数据点。无论如何，如今您的大量培养板实验数据很有可能是由仪器和/或机器人自动生成的，它们会将每个孔位的数据写入某种结构化文件中，该文件的布局大致与培养板本身相对应。同样，您的很多培养板实验数据也有可能存储在\
  \ Excel 电子表格中。无论哪种情况，我们都要向 `Plate` 类添加一些代码，用于从一种最常见且通用的表格数据存储文件格式中读取培养板实验数据，这种格式被实验室仪器、机器人和人类广泛使用——即[逗号分隔值](https://en.wikipedia.org/wiki/Comma-separated_values)格式，或称\
  \ CSV。\n\n![../images/476668_1_En_9_Chapter/476668_1_En_9_Figg_HTML.jpg](img/476668_1_En_9_Figg_HTML.jpg)\n\
  \nCSV 是一种纯文本格式，它简单地排列表格数据，使得表格的每一行由文件中的一行文本表示（以[回车符 <CR>](https://en.wikipedia.org/wiki/Carriage_return)\
  \ 结尾），每行的列之间用逗号分隔，如下所示：\n\n```\n3.2, 4.8, 4.1, 2.0, 0.9, 3.5, ...\n1.1, 2.4, 3.7,\
  \ 3.1, 1.1, 4.6, ...\n...\n```\n\n顺便提一下，您可能已经知道，您可以从 Microsoft Excel 等电子表格应用程序中以\
  \ CSV 格式导出表格数据。如果您希望表格数据具有更易于人类阅读的格式，或者将其输入到另一个不处理 Excel 自身内部数据格式的应用程序中，这将特别有用。在我们继续之前，我们先暂停一下，注意\
  \ CSV 是一种如此通用且常用的格式，以至于 Python 标准库甚至包含了一个 [csv 模块](https://docs.python.org/2/library/csv.html)^(¹²⁰)，专门用于处理这种格式的数据。而且，既然我们已经在第\
  \ 5 章中向您展示了如何编写自己的代码来处理输入文件数据，我们在这里将使用 Python 的 `csv` 模块，特别是因为它是 Python 标准库的一部分。\n\
  \n那么，让我们考虑最简单的情况，假设我们有一个实验室仪器，它以简单的 CSV 格式写入多孔位数据，该格式仅由数据行和列组成。有时您会遇到更复杂的 CSV 文件，其中还包含额外的数据，例如表格的行和列轴标签。这些数据通常作为额外字段包含在实际行和列数据之前的文件中，如下所示：\n\
  \n```\n浓度, 孵育时间 (小时)\n3.2, 4.8, 4.1, 2.0, 0.9, 3.5, ...\n1.1, 2.4, 3.7, 3.1, 1.1,\
  \ 4.6, ...\n...\n```\n\n甚至表格数据中嵌入了单独的行和列标签，如下所示：\n\n```\n1, 2, 3, 4, 5, 6, ...\n\
  A, 3.2, 4.8, 4.1, 2.0, 0.9, 3.5, ...\nB, 1.1, 2.4, 3.7, 3.1, 1.1, 4.6, ...\nC, ...\n\
  ```\n\n诸如此类……处理这些更复杂的 CSV 格式是 Python 的 `csv` 模块非常擅长的事情，但目前，我们假设创建文件的仪器只写出最简单格式的培养板孔位数据行和列。\n\
  \n让我们在 `Plate` 类中创建一个方法，用于从清单 9-5 中的一个简单 CSV 文件读取培养板数据。\n\n```python\ndef readCSV(self,文件路径,属性名称):\n\
  \    try:\n        nWell = 1\n        with open(文件路径, mode=\"r\") as csvFile:\n\
  \            csvReader = csv.reader(csvFile)\n            for 行 in csvReader:\n\
  \                for 孔位数据 in 行:\n                    self.set(nWell, 属性名称,float(孔位数据))\n\
  \                    nWell += 1\n    except:\n        print(\"无法从 %s 正确读取 CSV 数据\"\
  \ % 文件路径)\n        return\n    return\n```\n\n*清单 9-5* – `Plate` 类的 `readCSV` 方法\n\
  \n首先要注意到的是，我们将所有处理文件操作、数据读取和数据转换的代码都包裹在了我们在第 5 章中介绍的 `try` … `except` 子句中，以便捕获在打开或读取\
  \ CSV 文件数据时可能发生的任何错误，并优雅地退出。我们同样捕获了在将读取为字符串的数据转换为浮点数时可能发生的任何错误。例如，这种错误可能发生在文件中某个位置，由于某种原因，实验室仪器无法读取该孔位的有效值，从而跳过了该位置，并在\
  \ CSV 文件中用一个无法转换为浮点值的字符串值将其标记为未读。\n\n在 `try` … `except` 子句中，我们定义了打开的文件句柄 `csvFile`，其作用域限定在我们使用\
  \ `with` 语句创建的一个新的代码块内。然后，我们实例化了一个名为 `reader` 的类，该类在 `csv` 模块中为我们定义，使用的语句是\n\n```python\n\
  csvReader = csv.reader(csvFile)\n```\n\n\n\n这个名为 `reader` 的类，本质上是我们之前遇到过的、以字符串和列表等多种形式出现的一种极其实用的\
  \ Python 迭代器。迭代器是任何支持 `for <元素> in <集合>` 语法的 Python 对象类型。对于 `reader` 类而言，它所存储的元素是来自\
  \ CSV 文件的数据行，而每一行数据本身又是一个列表，可以在此基础上进行另一层迭代。\n\n明白了这一点，我们现在可以看到，该方法在顶层对行进行迭代：\n\n\
  ```\nfor row in csvReader:\n```\n\n接着，对于每一行，它又对组成该行的值列表进行迭代：\n\n```\nfor wellData\
  \ in row:\n```\n\n将遇到的每个值转换为浮点数，并使用我们之前编写的 `set` 方法将其赋值给对应的孔。你还会注意到，在每次遍历当前行中的值时，我们都会将变量\
  \ `nWell` 递增 1，这样在写入每个孔的值时，就能同步更新我们在板上的位置。\n\n如果在读取文件和转换数据的过程中发生任何错误，该方法将跳转到 `except`\
  \ 子句中的代码，并抛出一个带有错误消息的 Python 异常。我们在这里采用了一种“一网打尽”的单一方式，即由于以下任一原因导致的错误：\n\n- 打开 CSV\
  \ 文件\n- 从 CSV 文件读取数据\n- 转换 CSV 文件中的数据\n\n都会触发我们的 `except` 子句。你会注意到，采用这种方式，无论发生上述哪种错误，我们都会得到相同的通用错误消息。对于简单情况，这种方法可能没问题。在现有场景下，读取一个小型\
  \ CSV 文件时，要找出错误实际发生的位置可能工作量不大——但如果涉及大量数据或更复杂的工作流程来处理数据，那么几乎可以肯定，值得为过程的每个阶段使用单独的\
  \ `try` … `except` 子句，并为每个阶段提供更具体、更具信息量的错误消息。\n\n现在，让我们用一个实际的 CSV 文件来测试我们的 `readCSV`\
  \ 方法，就像烹饪节目中常说的那样，“这是我们提前准备好的一个。”下表显示了一组 96 孔板（8 行 12 列）的数据，格式为逗号分隔值（顺便说一句，如果你好奇的话，这些数据完全是虚构的，仅用于测试我们的\
  \ `Plate` 类）。我们还在一些较短的数字前面额外添加了一些[空白字符](https://en.wikipedia.org/wiki/Whitespace_character)，这样所有数字都能垂直对齐，更易于阅读。\n\
  \n需要注意的一点是，如果我们指定逗号作为一行数据值中数据点之间的分隔符，那么该行数据值中是否存在其他空白字符（如空格和制表符）通常无关紧要，因为解析 CSV\
  \ 文件的软件通常默认会忽略这些字符，并在解析过程中将其剔除（不过，在需要时也可以覆盖此默认行为）。同样重要的是要记住，尽管此表格看起来包含 96 个浮点数，但当从文件中读取它们时，它们将被读取为`字符串`，因为\
  \ CSV 格式并非专门针对包含数值数据的文件。\n\n例如，你可能有一个包含个人联系信息的文件，其中诸如名字、姓氏、地址、电话号码等字段，都是在一行中由逗号分隔的值，该行代表一个联系人。请务必记住，CSV\
  \ 格式的目的仅仅是分隔文件或表格中的各个数据值，而不是为每个数据值应如何解释或使用提供任何规则。这部分工作取决于你，即数据的最终用户。\n\n为了测试我们新的\
  \ CSV 功能，我们将以下数据存储在一个名为 `96plateCSV.txt` 的文本文件中：\n\n```\n0.32, 1.13,  2.72,  4.85,\
  \  5.79,  6.51,  7.43,  7.65,  8.06,  8.11, v8.28,  9.49\n1.37, 0.86,  8.02,  9.47,\
  \ 10.03, 12.13, 13.97, 13.78, 14.53, 15.22, 18.50, 19.88\n1.01, 0.22, 19.32, 20.64,\
  \ 24.93, 25.41, 26.15, 26.33, 30.40, 34.48, 35.93, 37.22\n0.29, 0.65, 31.35, 31.75,\
  \ 40.04, 41.18, 42.21, 44.90, 46.16, 46.49, 48.41, 53.10\n1.10, 1.36, 54.68, 55.09,\
  \ 57.47, 57.62, 57.42, 61.82, 64.15, 65.97, 70.95, 72.55\n0.78, 0.33, 74.53, 78.97,\
  \ 79.34, 80.01, 80.94, 81.55, 83.88, 83.49, 84.37, 86.49\n0.12, 0.72, 86.40, 86.42,\
  \ 87.13, 87.57, 88.02, 88.47, 89.25, 89.05, 89.61, 90.76\n0.24, 0.21, 90.29, 93.49,\
  \ 93.53, 95.18, 95.34, 95.96, 96.77, 97.73, 98.08, 98.72\n```\n\n然后，我们实例化一个新的 96\
  \ 孔 `Plate`，并使用 `readCSV` 方法像这样读取它：\n\n```\np = Plate('My 96-Well Plate',8,12)\n\
  p.readCSV('96plateCSV.txt','concentration')\n```\n\n从代码中可以看出，我们将读取 CSV 数据表，并将其赋值给孔属性\
  \ `concentration`。由于 `readCSV` 方法使用 `set` 方法将每个数据值赋值给一个孔，因此 CSV 数据会依次放入 `data` 字典中，该字典由\
  \ `Plate` 类定义，用于保存孔板的数据。我们可以使用 `get` 方法查看每个孔被分配了什么值。\n\n```\nprint(p.get(1,'concentration'))\n\
  0.32\nprint(p.get(12,'concentration'))\n9.49\nprint(p.get(96,'concentration'))\n\
  98.72\n```\n\n到目前为止，一切顺利。我们可以使用三个坐标系统中的任何一个在多孔板中导航；我们可以读取广泛使用的 CSV 格式的多孔板数据；我们可以将命名的数据值分配给单个孔；我们可以通过指定孔和属性名称来检索它们。这已经是一个坚实、基础的*多孔板*类框架了，但让我们考虑一些可能想要添加的进一步功能。\n\
  \n如果我们在工作中编写一个真正的 `Plate` 类，可以想象有许多功能可能想要添加。例如，我们甚至可以将每个孔实现为 `Well` 类的一个实例，并配备一整套字段和方法，以各种复杂的方式处理孔数据。因此，在结束多孔板的话题之前，让我们通过几个我们希望它能做到的基本示例，进一步扩展\
  \ `Plate` 类的功能。正如本章开头所承诺的，这应包括一些处理实验室自动化的基本功能，这种自动化在孔板数据处理中正变得越来越普遍。\n\n为实验室自动化编写代码本身就是（并且确实是）整本书的主题。因此，虽然详细描述如何为机器人和自动化仪器编写驱动程序超出了本书的范围，但我们将向你展示如何编写高级代码，使你能够将你的\
  \ Python 软件与用于机器控制的底层驱动程序软件（通常用 C 语言编写）对接。\n\n## 孔，孔，孔：孔板上的数学运算\n\n多孔板的网格布局自然适合于利用板的行和列来组织孔板实验——例如，将每个样本及其对照品放置在单行中，或者在一行中水平地对给定样本进行连续稀释，或者在一列孔中垂直地进行稀释。出于这个原因，来自多孔板的数据通常可以按行和列进行有效的组织和/或分析。考虑到这一点，让我们为\
  \ `Plate` 类添加一些进一步的功能，以便能够快速方便地按行和列检索板上的数据。\n\n\n\n我们将向`Plate`类添加两个方法——`getRow`和`getColumn`——它们接受任意一种我们支持的坐标系统中的单个板位置，并返回该位置所在行或列的位置列表。这将相对快速且容易实现，因为我们将使用已实现的便捷`map`方法来完成大部分繁重工作。首先是清单\
  \ 9-6 中展示的`getRow`方法。\n\n```\ndef getRow(self,loc):\nhere = self.map(loc)\nrow =\
  \ []\nfor n in range(0,self.size):\nthere = self.map(n+1)\nif there[1][0] == here[1][0]:\n\
  row.append(there)\nreturn row\nListing 9-6\ngetRow method for Plate class\n```\n\
  \n这个方法很容易分解。首先，我们使用`map`方法检查提供的位置，该方法还会提供一个包含该位置到三种支持坐标系统映射的元组。\n\n```\nhere = self.map(loc)\n\
  ```\n\n创建了一个名为`row`的空列表来保存方法将要返回的行位置后，我们遍历板上的所有位置，生成每个位置的坐标，并使用`position2D`（行，列）坐标来测试每个位置的行索引是否与输入位置的行索引匹配。这种方法的一个很好的副作用是，与输入位置位于同一行的位置会按照它们在板上出现的顺序添加到`row`列表中。\n\
  \n和往常一样，让我们测试一下新代码：\n\n```\np = Plate('My 96-Well Plate',8,12)\np.readCSV('96plateCSV.txt','concentration')\n\
  print(p.getRow('B01'))\n(13, (2, 1), 'B01'), (14, (2, 2), 'B02'), (15, (2, 3), 'B03'),\
  \ (16, (2, 4), 'B04'), ...\nprint(p.getRow(27))\n[(25, (3, 1), 'C01'), (26, (3,\
  \ 2), 'C02'), (27, (3, 3), 'C03'),(28, (3, 4), 'C04'), ...\nprint(p.getRow((4,7)))\n\
  [(37, (4, 1), 'D01'), (38, (4, 2), 'D02'), (39, (4, 3), 'D03'), (40, (4, 4), 'D04'),\
  \ ...\n```\n\n我们已经截断了`print`语句的输出，但你能理解其大意。`getRow`方法返回与输入板位置位于同一行的所有板位置的映射坐标。让我们在清单[9-7\
  \ 中创建一个类似的`getColumn`方法。\n\n```\ndef getColumn(self,loc):\nhere = self.map(loc)\n\
  col = []\nfor n in range(0,self.size):\nthere = self.map(n+1)\nif there[1][1] ==\
  \ here[1][1]:\ncol.append(there)\nreturn col\nListing 9-7\ngetColumn method for\
  \ Plate class\n```\n\n这个方法的工作方式与`getRow`方法几乎完全相同，区别在于它使用`position2D`坐标的列索引来匹配位置。这两个方法实际上非常相似，我们可以轻松地将它们合并为一个`getRowAndColumn`方法，该方法在遍历板位置时同时填充`row`和`col`列表，并将它们作为两个列表返回。我们将把这作为留给读者的一项练习。\n\
  \n分析多孔板数据通常涉及基于板上孔的行和列进行计算，甚至在整个板上进行计算。这包括数学运算，例如从一行孔数据中减去对照孔值，或计算一行或一列的平均值。可以想象，人们希望对多孔板数据执行各种各样的计算，并且掌握了我们为识别板上行和列位置以及从特定孔中检索数据而编写的方法，我们完全有能力实现此类方法。作为示例，让我们看看计算多个孔平均值的简单但普遍的问题。我们将直接基于`get`、`getRow`和`getColumn`方法进行构建，以演示如何使用`Plate`类的这一基本基础设施来扩展其功能。\n\
  \n在清单 9-8 中，我们展示了一个方法的代码，该方法接受一个属性名称和（可选）单个位置作为输入，并计算该属性在一行或一列孔甚至整个板上的平均值。\n\n```\n\
  def average(self,propertyName,loc=None):\nif loc == None:\ntotal = 0.0\nfor pos\
  \ in range(0,self.size):\ntotal += self.get(pos+1, propertyName)\nreturn total/self.size\n\
  row = self.getRow(loc)\ncol = self.getColumn(loc)\nrowTotal = 0.0\ncolTotal = 0.0\n\
  for pos in row:\nrowTotal += self.get(pos[1],propertyName)\nrowMean = rowTotal /\
  \ self.columns\nfor pos in col:\ncolTotal += self.get(pos[1],propertyName)\ncolMean\
  \ = colTotal / self.rows\nreturn (rowMean,colMean)\nListing 9-8\nComputing the average\
  \ across a feature in the Plate class\n```\n\n这里我们可以看到，该方法的`loc`参数是可选的，因为提供了一个默认值`loc=None`，当没有为`average`方法传递`loc`值时将使用该默认值。不传递特定位置实际上是让方法用户计算整个板的平均值，你可以在`if\
  \ loc == None:`之后的代码块中看到这一点。所有孔的总和初始化为零，我们遍历板上的每个位置，累加指定属性的值，最后除以位置数量。\n\n如果为`loc`参数提供了值，`average`方法会分别使用`getRow`和`getColumn`方法生成行和列位置的列表，然后遍历这些列表中的位置来计算行和列的平均值，并在元组`(rowMean,\
  \ colMean)`中返回这两个值。\n\n让我们用一个使用我们之前介绍过的测试数据表、从 CSV 文件读取并标记为属性名`concentration`的 96\
  \ 孔板来测试一下：\n\n```\np = Plate('My 96-Well Plate',8,12)\np.readCSV('96plateCSV.txt','concentration')\n\
  ```\n\n首先，测试指定孔位置的行和列平均值：\n\n```\nprint(p.average('concentration','B03'))\n(11.479999999999999,\
  \ 45.91375)\n```\n\n接下来，通过不指定孔位置来测试整个板的平均值的计算：\n\n```\nprint(p.average('concentration'))\n\
  43.6519791667\n```\n\n如果你是那种需要亲自验证这类结果的人，请尽管使用前面提供的数据表进行计算。不过剧透一下——如果你乐意相信我们的话，我们已经验证过了！\n\
  下一步：我们将把虚拟孔板代码付诸实践，并在第 10 章中，在自动化与可视化的真实（物理）世界中对其进行全面测试。\n\n## 参考资料与拓展阅读\n\n*  \
  \ 关于[微孔板](https://en.wikipedia.org/wiki/Microtiter_plate)你想知道但不敢问的一切\n\n## 脚注\n\n\
