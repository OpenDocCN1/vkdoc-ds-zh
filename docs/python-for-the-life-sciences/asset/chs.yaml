  现在我们需要稍微偏离一下主题，来谈谈**类型转换**。不，这不是你在即将上映的好莱坞大片里做的那种选角工作。这里的类型转换指的是将变量从一种`type`（比如字符串）转换为另一种类型（比如整数）。你可能还记得第\
  \ 2 章中提到过，Python 使用**鸭子类型**，也就是说，变量会被赋予一种特定的类型，而无需事先明确告诉计算机会期待这种类型的变量。\n\n那么，类型转换在当前这个场景中能如何帮助我们呢？\n\
  \n在我们的具体案例中，这其实非常简单。我们真正想从字符串 `\"2.1\\n\"` 中得到的是其中包含的浮点数 `2.1`。所以我们只需使用 `float()`\
  \ 函数将字符串转换为浮点数。你可以自己尝试一下：\n\n```\nline = float(\"2.1\\n\")\nprint(line)\n2.1\n```\n\
  \n请注意，`float()` 神奇地提取了浮点数，并删除了那个碍眼的换行符。你现在已经成功地将原始字符串转换为了一个浮点数，它现在被保存在变量 `line`\
  \ 中。如果你遇到的数据不是浮点数，而是一堆整数，你可以使用一个类似的函数 `int()`；或者，你也可以使用 `str()` 函数将整数或数字转换回字符串；更多详情请参见\
  \ [Python 内置函数文档](https://docs.python.org/2/library/functions.html)^(⁶³)。\n\n好了，短暂的偏离主题到此结束。让我们把类型转换整合回我们最初的循环中，请注意，我们现在将新转换后的值*存储*到一个新变量\
  \ `level` 中，以便后面使用。在代码清单 5-3 中，是改进后的新循环。\n\n```\nf = open(\"gene_expression.txt\"\
  , 'r')\nlines = f.readlines()\nfor line in lines:\nlevel = float(line)\nprint(level)\n\
  f.close()\n代码清单 5-3\n打开文件并转换为浮点数\n```\n\n我们还使用 `print()` 函数将数据输出回屏幕。如果你运行这个程序，你会看到一个简短得多的输出：\n\
  \n```\n2.1\n0.9\n0.1\n```\n\n嗒哒！你现在已经成功地从文件中获取了实际值并放入了你的程序！恭喜恭喜。是时候喝杯咖啡了。别担心，我会等你的。\n\
  \n回来了？好的，我们得承认一个小问题：我们还不能*马上*进入用*数据*做有趣事情的部分。是的，我们必须处理一个小问题，那就是输入文件中有时可能存在*错误*。\n\
  \n哎呀，老兄！\n\n是的，亲爱的读者，你要明白，我们说的不是你*代码*中的错误，而是*其他人*可能引入到你输入数据文件中的错误。那些显然远不如你细心，并且可能也不像你这样正直的人。\n\
  \n也许那个人给了你一个看起来像这样的文件：\n\n```\n2.1\n0.9\n3.1xx\n0.1\n```\n\n然后你运行同样的代码，它会戛然而止，并出现以下错误信息：\n\
  \n```\n2.1\n0.9\nTraceback (most recent call last):\nFile \"./File_IO.py\", line\
  \ 8, in \nlevel = float(line)\nValueError: invalid literal for float(): 3.1xx\n\
  ```\n\n哎哟！\n\n你必须通过错误检测的魔法，尽可能防范这些捣蛋鬼。但是，为了不伤害那些其他人（他们可能碰巧是很好的人、合作者，或者你的实验室导师）的感情，我们将采用更友善、更温和的\
  \ Python 说法：[异常处理。](https://docs.python.org/2/tutorial/errors.html)^(⁶⁴)\n\n## 当事情出错时：Python\
  \ 异常处理\n\n如果你编写的程序所有内容都是硬编码的，并且没有外部输入，那你可能永远不需要担心异常。但那样的程序会非常无聊：每次运行时，它都会做完全相同的事情。而且，如果你不能处理数据，你在生命科学或计算生物学领域肯定做不了任何有趣的事情！即使你使用\
  \ Python 建立一些理论模型，你也会希望能够修改参数或读取模型规格。\n\n在生命科学中，就像在生活中一样，事情并非总能按计划进行，这是一个不争的事实。因此，尽早为你的程序建立一些健壮性是值得的。是的，处理这些异常并不是最有趣的事情，有点像吃药，但请相信我们，你以后会感谢我们的。\n\
  \n处理错误的基本格式是，我们首先尝试*做我们原本要做的事情*，这在所有情况下都会执行，除非我们遇到错误，在这种情况下我们就*做其他事情*。这听起来很有道理，对吧？结构如下所示：\n\
  \n```\ntry:\n做我们原本要做的事情\nexcept 某种错误类型:\n做其他事情\n```\n\n让我们回到最初的例子。出问题的那一行代码是在将字符串转换为浮点数时。`float()`\
  \ 函数不知道拿这个字符串怎么办，因为它显然不是一个数字。之前显示的灰色原始错误信息告诉我们，我们遇到的错误类型是 `ValueError`，所以我们需要添加一个异常来处理这种情况。我们可以选择当异常发生时想做什么，最简单的方法就是忽略它。为此，你可以调用\
  \ `pass` 函数，这相当于告诉电脑“继续前进，这里没什么好看的”：\n\n```\ntry:\nlevel = float(line)\nexcept ValueError:\n\
  pass\n```\n\n但一个好的调试实践是识别出有问题的行，这样你就可以向发送文件给你的人报告他们的错误之处。\n\n```\ntry:\nlevel =\
  \ float(line)\nexcept ValueError:\nprint(\"line is not a number:\", line)\n```\n\
  \n请注意，你可能会遇到多种不同类型的错误，你可以通过使用多个 `except` 子句来分别处理它们，不过我们暂时保持简单。\n\n现在，完整的程序开始成形了（记得保持缩进正确），如代码清单\
  \ 5-4 所示。\n\n```\nf = open(\"gene_expression.txt\", 'r')\nlines = f.readlines()\n\
  for line in lines:\ntry:\nlevel = float(line)\nexcept ValueError:\nprint(\"line\
  \ is not a number:\", line)\nprint(level)\nf.close()\n代码清单 5-4\n带异常处理的打开文件操作\n```\n\
  \n现在让我们来做一些真正的计算！回到我们最初计算平均值的例子，我们现在可以通过在代码清单 5-5 中跟踪总表达水平值(`sum`)和表达次数(`count`)来实现这一点。\n\
  \n```\nf = open(\"gene_expression.txt\", 'r')\nlines = f.readlines()\nsum = 0\n\
  count = 0\nfor line in lines:\ntry:\nlevel = float(line)\nexcept ValueError:\nprint(\"\
  line is not a number:\", line)\nprint(level)\nsum += level\ncount += 1\nprint(\"\
  average:\", sum/float(count))\nf.close()\n代码清单 5-5\n即时从文件计算平均值\n```\n\n这将输出以下内容：\n\
  \n```\n2.1\n0.9\n0.1\naverage: 1.03333333333\n```\n\n这样，我们就达到了最初的目标：读取一个文件并计算一组表达水平值的平均值。但是，你现在可能会问，我难道不能在电子表格里做同样的事情吗？为什么我需要所有这些\
  \ Python 的东西？是的，没错，但计算平均值只是开始。你会从各种类型的文件中获得各种数据，它们可能有许多不同的格式。Python 将为你提供处理几乎所有情况的灵活性。接下来，我们将基于现有技能，展示如何解析一种最常见的序列数据文件：[FASTA](https://en.wikipedia.org/wiki/FASTA)\
  \ 文件。\n\n![../images/476668_1_En_5_Chapter/476668_1_En_5_Figd_HTML.jpg](img/476668_1_En_5_Figd_HTML.jpg)\n\
  \n\n\n## 重新发明轮子：解析 FASTA 文件\n\nFASTA 文件是生物信息学、基因组学和进化生物学中最常见的序列格式之一。我们首先要说明的是，如果你最终以序列分析为生，你很可能会用到现有的解析器，例如\
  \ [Biopython](http://biopython.org/) ^(⁶⁵) 提供的那些，它们既能*读取*也能*写入*多种序列格式。我们强烈建议你在扎实掌握我们在此介绍的基础知识后，去研究这些软件包。例如，[解析\
  \ FASTA 文件](http://biopython.org/wiki/SeqIO)^(⁶⁶) 就会像运行代码清单 5-6 中的代码一样简单（`import`\
  \ 语句将在第 6 章中更详细地描述）。另外请注意，这段代码需要先安装 Biopython 包才能运行（参见第 1 章如何使用 `pip` 安装 Biopython）；但是，我们***不***期望你现在就自己执行这段代码，我们展示它仅仅是为了说明代码的简洁性。\n\
  \n```\nfrom Bio import SeqIO\nhandle = open(\"example.fasta\", \"rU\")\nfor record\
  \ in SeqIO.parse(handle, \"fasta\"):\nprint(record.id)\nhandle.close()\n代码清单 5-6\n\
  使用 Biopython 解析文件\n```\n\n那么，假设你想将一个生物体的某些序列读入你的程序，以便最终能搜索其中的各种基序或基因（这是我们将在第 7 章关于\
  \ Python 正则表达式的主题中深入探讨的话题）。*首先*需要从文件中读取序列。我们创建了一个测试数据文件 `Sequences.fasta`，位于 `genomes`\
  \ 子目录中，供你练习。请注意，FASTA 文件的扩展名差异很大；有时可能是 `.fasta`，就像本例这样，有时是 `.fas`，或者 `.fna`：（代表**核**酸的\
  \ **F**ASTA 文件指示符）。那么让我们直接开始，看看前几行：\n\n```\n>Gene1\nAGCTTTTCATTCTGACTGCAACGGGCAATATGTCTCTGTGTGGATTAAAAAAAGAGTGTCTGATAGCAGC\n\
  TTCTGAACTGGTTACCTGCCGTGAGTAAATTAAAATTTTATTGACTTAGGTCACTAAATACTTTAACCAA\nTATAGGCATAGCGCACAGACAGATAAAAATTACAGAGTACACAACATCCATGAAACGCATTAGCACCACC\n\
  ATTACCACCACCATCACCATTACCACAGGTAACGGTGCGGGCTGACGCGTACAGGAAACACAGAAAAAAG\nCCCGCACCTGACAGTGCGGGCTTTTTTTTCGACCAAAGGTAACGAGGTAACAACCATGCGAGTGTT\n\
  ```\n\n如你所见，FASTA 文件中每个序列的基本格式非常简单：\n\n1. *标识符*：以 \">\" 开头，后跟一个唯一字符串（标识符本身）。\n2.\
  \ *序列*：从标识符的下一行开始。此序列由多个符号（核酸或氨基酸）组成，这些符号可以出现在单行中，也可以跨越多行。\n\n然而，细节是魔鬼，由于 FASTA\
  \ 格式相当松散（例如，它允许在序列之间有空行），我们的解析器应该对这些微小的格式变化有足够的鲁棒性。显然，一个完整的 FASTA 解析器可能需要处理更多复杂情况，例如捕捉不属于标准核苷酸“字母表”的字母。但在介绍所有异常情况之前，我们将先在代码清单\
  \ 5-7 中展示我们的解析器。它的目标是读取一个 FASTA 格式的文件，将每个序列保存到一个**字典**中，并打印该字典。\n\n```\nf = open(\"\
  Sequences.fasta\", 'r')\nlines = f.readlines()\nseq_dict = {}\nseq_name = None \
  \ # 初始状态下，我们尚未找到任何基因\nfor line in lines:\nif line[0] == '>':\n### 获取基因名称，用于字典\n\
  seq_name = line[1:].strip()\nseq_dict[seq_name] = \"\nelse:\nif seq_name:  # 我们已经找到一个序列！\n\
  ### 将序列追加到字典中\nseq_dict[seq_name] = seq_dict[seq_name] + line.strip()\nprint(seq_dict)\n\
  f.close()\n代码清单 5-7\n使用标准 Python 库解析 FASTA 文件\n```\n\n如你所见，文件打开部分和遍历文件中每一行的 `for`\
  \ 循环与我们之前的示例相同。我们需要解决的关键挑战是，根据当前的 `line`，判断我们当前处于以下三种不同状态中的哪一种：（**i**）尚未开始任何序列，（**ii**）正在*开始*一个新序列，或者（**iii**）正在向一个*已有*序列添加内容。我们可以使用当前序列的名称\
  \ `seq_name` 来跟踪状态。\n\n在文件开头，尚未找到任何序列，因此在开始 `for` 循环之前，我们将 `seq_name` 设置为 Python\
  \ 的 `None` [常量。​](https://docs.python.org/2/library/constants.html)^(⁶⁷) 正如我们在前几章中提到的，`None`\
  \ 最常用于指示值*缺失*，在这种情况下它很有用，因为我们可以在实际给 `seq_name` 变量赋值*之前*引用它。我们还初始化了一个空字典 `seq_dict`。\n\
  \n现在我们准备好进行循环了。我们在循环*内部*要做的*第一件事*是检查当前行是否包含序列起始字符 \">\"；如果是，那么我们就开始工作了！我们现在可以使用\
  \ Python 切片 `line[1:]` 将 `seq_name` 赋值为该行中*第一个字符之后*的所有内容。请注意，与上一节关于读取基因表达数据类似，我们需要去掉讨厌的行尾字符。这里我们可以使用内建的\
  \ `strip()` 函数，该函数作用于字符串，用于移除所有*前导和尾随的空格*以及特殊字符^(⁶⁸)（如行尾字符）。我们还用这个新的 `seq_name`\
  \ 将字典初始化为空字符串 `\"\"`。这是一个空的容器，我们将开始用序列数据填充它。\n\n如果该行*没有*以序列起始字符开头，那么我们需要首先检查当前是否已设置\
  \ `seq_name`。这处理了我们尚未找到序列标识符的情况——例如，如果文件的第一行是空行，那么 `seq_name` 将被设置为 `None`，这是一个需要确保代码鲁棒性的示例。如果它*已经*设置，那么太棒了！——我们准备开始将这些序列添加到\
  \ `seq_name` 当前对应的字典条目中。这是通过提取当前序列并使用 `+` 运算符，将当前行经过 `strip()` 处理后的版本追加到字符串末尾来实现的——同样请注意，这巧妙处理了行为空行或仅包含空白字符的情况。最后，我们打印出字典。\n\
  \n为了全面测试这个程序，让我们创建一个测试文件 `Sequences.fasta`，它不仅仅是一个标准的 FASTA 文件，而是特意包含了一些复杂情况：\n\n\
  ```\n>Gene1\nAGCTTTTCATTCTGACTGCAACGGGCAATATGTCTCTGTGTGGATTAAAAAAAGAGTGTCTGATAGCAGC\n\
  TTCTGAACTGGTTACCTGCCGTGAGTAAATTAAAATTTTATTGACTTAGGTCACTAAATACTTTAACCAA\nTATAGGCATAGCGCACAGACAGATAAAAATTACAGAGTACACAACATCCATGAAACGCATTAGCACCACC\n\
  ATTACCACCACCATCACCATTACCACAGGTAACGGTGCGGGCTGACGCGTACAGGAAACACAGAAAAAAG\nCCCGCACCTGACAGTGCGGGCTTTTTTTTCGACCAAAGGTAACGAGGTAACAACCATGCGAGTGTT\n\
  >Gene2\nGGCGCGCGTCTTTGCAGCGATGTCACGCGCCCGTATTTCCGTGGTGCTGATTACGCAATCATCTTCCGAA\n\
  TACAGTATCAGTTTCTGCGTTCCGCAAAGCGACTGTGTGCGAGCTGAACGGGCAATGCAGGAAGAGTTCT\nAGGTGATGGTATGCGCACCTTACGTGGGATCTCGGCGAAATTCTTTGCCGCGCTGGCCCGCGCCAATATC\n\
  AACATTGTCGCCATTGCTCAGGGATCTTCTGAACGCTCAATCTCTGTCGTGGTCAATAACGATGATGCGA\nCCACTGGCGTGCGCGTTACTCATCAGATGCTGTTCAATACCGATCAGGTTATCGAAGTGTTTGTGAT\n\
  AAAACTGGCGTGCGCGTTACTCATCAGATGCTGTTCAATACCGATCAGGTTATCGAAGTGTTTGTGAT\n> Gene 3 (other\
  \ comment)\nTACAGTATCAGTTTCTGCGTTCCGCAAAGCGACTGTGTGCGAGCTGAACGGGCAATGCAGGAAGAGTTCTATTTCCCAATTTTTAGGAACCC\n\
  ```\n\n\n\n请注意，我们引入了两个格式不同的额外序列：`Gene2` 在标识符和序列之间有一个空行，而 `Gene 3` 包含带有额外空格的标识符，并且序列位于单行中（而不是分成多行）。如果我们运行程序\
  \ `PFTLS_Chapter_05_02.py`，我们应该会看到序列以字典形式打印出来：\n\n```\n{'Gene1':'','Gene2':\
  \ '',Gene\
  \ 3 (other comment)': 'TACAGTATCAGTTTCTGCGTTCCGCAAAGCGACTGTGTGCGAGCTGAACGGGCAATGCAGGAAGAGTTCTATTTCCCAATTTTTAGGAACCC'}\n\
  ```\n\n请注意，程序像冠军一样处理了每个测试用例，所有标识符都被正确用作字典键，所有序列都由连续的核苷酸标识符组成。\n\n干得好，各位！在下一章中，我们将介绍\
  \ Python **正则表达式**，这将极大地提升我们在基因组数据中搜索序列“针”（如本章所示）的能力。\n\n"
- "# 6. 在数据堆中寻找“针”\n\n*用于基因组学和测序的正则表达式*\n\n| ![../images/476668_1_En_6_Chapter/476668_1_En_6_Figa_HTML.jpg](img/476668_1_En_6_Figa_HTML.jpg)\
  \ | *“哦，天哪！”白兔说道。“我实验室会议要迟到了，还有堆积如山的基因测序数据要处理。”*\n*他放弃了计算器和电子表格，花了大价钱买了一个处理基因数据的炫酷桌面应用，但依然很沮丧。那个看起来想满足所有人需求的应用，在紧要关头，根本无法完成他处理实验数据所需的特定分析。*\n\
  *突然，毫无预兆地，一只坐在池塘中央睡莲上的智慧老蟾蜍，用沙哑的声音说了一个词：“Python！”*\n*“什么？不，不，不！”被逼得焦头烂额的白兔喊道。“谁都知道\
  \ Python 很慢，因为它是一种解释型语言，而时间正是我最缺少的东西。”*\n*“嘿，你是那个穿着花哨马甲、戴着怀表的啮齿动物，而我只是个吃苍蝇的老家伙。我能懂什么？”老蟾蜍说着跳进水里寻找下一顿美餐。*\
  \ |\n| ![../images/476668_1_En_6_Chapter/476668_1_En_6_Figb_HTML.gif](img/476668_1_En_6_Figb_HTML.gif)\
  \ | *正则表达式、`re`模块、Python 模块和子模块、`import`、Python `MatchObject`、迭代器、Python 字节码、Python\
  \ 解释器、`random`模块、2038 年问题、`time`模块、Cython、SWIG、Python 标准库* |\n| ![../images/476668_1_En_6_Chapter/476668_1_En_6_Figc_HTML.gif](img/476668_1_En_6_Figc_HTML.gif)\
  \ | *新一代测序、基因启动子、限制性内切酶、限制位点、基因组、DNA、核苷酸、染色体、共有序列、错配* |\n\n那些参与基因组学或[新一代测序](https://en.wikipedia.org/wiki/DNA_sequencing%2523Next-generation_methods)的读者，会特别喜欢这一章，我们将介绍正则表达式，这是\
  \ Python 最强大的文本处理特性之一。\n\n理解正则表达式的最佳方式是将其视为字符序列中的**可搜索模式**。最简单的模式就是像我们在第 3 章关于序列的部分中定义\
  \ DNA 限制位点时所看到的直接字符序列。回想一下，我们将限制位点定义为一个识别基序和作用位点，酶在此处切割 DNA，如下所示：\n\n```\nrestrictionEnzymes['bamH1']\
  \ = ['ggatcc',0]\n```\n\n尽管我们在那一章中并没有实际使用正则表达式，但我们搜索的小序列 `'ggatcc'` 本身就是一个有效的正则表达式——一个在每个位置上搜索模式都由一个字符唯一且明确地定义的正则表达式。\n\
  \n但让我们考虑一个稍微复杂一点的例子——一个我们希望在给定位置有多个可能字符的例子。限制性内切酶 ***NciI*** 识别 DNA 序列 **CC(C 或\
  \ G)GG**（并在第二个 C 之后切割 DNA）。我们如何在 Python 库中表示这个限制性内切酶？\n\n一种方法是搜索两个可能的序列变体 **CCCGG**\
  \ 和 **CCGGG**。这可行，但效率极低，因为需要对每个序列变体运行整个搜索。现在想象一下，对于像 ***ScrFI*** 这样的限制性内切酶，其识别位点为\
  \ CC(A、T、C 或 G)GG！这需要对序列变体 **CCAGG**、**CCTGG**、**CCCGG** 和 **CCGGG** 进行单独搜索，而该酶仅在一个位置上存在歧义！有些限制性内切酶在其识别位点的多个位置识别多个碱基，从而产生数十甚至数百个需要搜索的序列变体。\n\
  \n幸运的是，有一种更好、更快、更高效的方法，那就是正则表达式。\n\n\n\n## Python 正则表达式库与 `import`\n\n要在 Python\
  \ 中使用正则表达式，我们需要*导入* Python 正则表达式库⁷¹ `re`，而不能依赖像 `find` 这样的简单字符串搜索方法。`import` 一个库是什么意思？简单来说，使用\
  \ `re` 库意味着我们走出了*核心*语言特性（内置功能）的范围，转而使用属于**Python 标准库**的功能。可以这样理解：核心语言就像内太阳系（水星、金星、地球、火星），而标准库则好比外行星（木星、土星、海王星、天王星）。它们依然属于\
  \ Python 太阳系，只是轨道稍微靠外一些。导入模块很简单，只需在程序开头输入\n\n```\nimport re\n```\n\n就完成了！（当然，如果你使用的是其他模块，只需将\
  \ `re` 替换为相应的模块名。）如果你只需要使用该模块中的全局函数（正如我们在本章所做的那样），那么这些就足够了。（实际应用中，许多模块由各种*子模块*组成，我们将在第\
  \ 7 章讨论子模块及相关概念*命名空间*，在此之前，这种简单的 `import` 形式就够用了。）\n\n因此，在代码清单 6-1 中，让我们直接使用 Python\
  \ 正则表达式库中与字符串 `find` 方法等效的功能。我们还将使用之前在处理序列章节中创建的限制性内切酶库，不过现在可以扩展其功能，使其能够处理在任意位置允许多个碱基的\
  \ DNA 限制性位点。\n\n```\nimport re\nrestrictionEnzymes = {}\nrestrictionEnzymes['bamH1']\
  \ = ['ggatcc',0]\nrestrictionEnzymes['sma1'] = ['cccggg',2]\nrestrictionEnzymes['nci1']\
  \ = ['cc[cg]gg',2]\nrestrictionEnzymes['scrF1'] = ['cc[atcg]gg',2]\nsequence1 =\
  \ 'atatatccgggatatatcccggatatat'\nprint(re.findall(restrictionEnzymes['bamH1'][0],sequence1))\n\
  []\nprint(re.findall(restrictionEnzymes['nci1'][0],sequence1))\n['ccggg', 'cccgg']\n\
  print(re.findall(restrictionEnzymes['scrF1'][0],sequence1))\n['ccggg', 'cccgg']\n\
  代码清单 6-1\n创建正则表达式（输出已内联显示）\n```\n\n首先，我们通过 `import re` 语句导入 Python 正则表达式库，然后创建限制性内切酶库（为了完整性，这里直接复用了第\
  \ 3 章的代码）。你会看到，我们还添加了之前讨论过的两种新的限制性内切酶，它们在识别位点的某一位置允许多个碱基。\n\n接下来，我们定义了一个序列，在其中有意识地插入了两种*NciI*\
  \ 识别位点的变体，并用 `at` 碱基对序列将它们隔开，以便于观察。\n\n最后，我们使用 `re` 模块的 `findall` 方法，在序列中搜索与 *BamH1*、*NciI*\
  \ 和 *ScrF1* 识别位点对应的正则表达式。让我们逐一分析。\n\n`BamH1` 的正则表达式只是一个简单的字符串：`'ggatcc'`。\n\n*NciI*\
  \ 和 *ScrF1* 的正则表达式包含一个由方括号界定的位置，方括号内是一组字符。这是正则表达式的一种语法，用于指定在该模式位置上允许哪些字符。你可以将方括号理解为一种“或”语句——例如：\n\
  \n`'cc[cg]gg'` 表示 \"**cc** 后跟 **c** 或 **g**，然后接 **gg**\"\n\n`'cc[atcg]gg'` 表示 \"\
  **cc** 后跟 **a** 或 **t** 或 **c** 或 **g**，然后接 **gg**\"\n\n在代码清单 6-1 的示例代码中，我们现在可以看到为什么\
  \ *BamH1* 搜索没有找到任何匹配，而 *NciI* 和 *ScrF1* 都匹配了我们插入序列的两个识别位点——因为它们满足这两种酶的搜索标准：与 *NciI*\
  \ 匹配的两个可能位点实际上是 *ScrF1* 匹配位点的子集，而 *ScrF1* 在识别位点的中心位置还允许 **a** 和 **t**。\n\n事实上，还有一种更简单的正则表达式语法，可以允许\
  \ *ScrF1* 识别位点中心位置为任意四种碱基。\n\n```\nrestrictionEnzymes['scrF1'] = ['cc.gg',2]\n```\n\
  \n正则表达式中的点号表示任何字符都能在该位置匹配搜索模式。在我们的 DNA 序列场景中，这意味着任意碱基（**a**、**t**、**c** 或 **g**），但要注意——它也会接受其他任何字符，包括那些*不属于*有效\
  \ DNA 序列的元素。\n\n### 使用正则表达式识别基因启动子\n\n让我们看一个稍微复杂一点的例子，展示如何利用正则表达式处理 DNA 序列的强大功能——在基因组中搜索具有生物学意义的序列，例如[**基因启动子**](https://en.wikipedia.org/wiki/Promoter_%2528genetics%2529)（我们将在关于生化动力学的第\
  \ 12 章中探讨启动子控制基因表达水平的多种有趣方式）。基因启动子通常由相对保守的识别序列组成，这些序列之间由一段间隔序列（通常长度可变）隔开。例如，许多细菌基因启动子由基因上游的两个不同识别序列构成，如图\
  \ 6-1 所示。\n\n![../images/476668_1_En_6_Chapter/476668_1_En_6_Fig1_HTML.png](img/476668_1_En_6_Fig1_HTML.png)\n\
  \n图 6-1\n\n典型的细菌基因启动子\n\n-10 位置识别位点的共有序列是 `tataat`，而 -35 位点的共有序列是 `ttgaca`。我们可以很容易地编写一个\
  \ Python 正则表达式，像这样在基因组中搜索这类共有启动子区域：\n\n```\npromoter = 'ttgaca...................tataat'\n\
  ```\n\n这会匹配那些恰好由两个固定碱基数的共有识别位点（中间位置的碱基可以是任意四种）组成的任何序列。由于这些序列是本身存在一定变异性的基序的共有序列，我们可以扩展搜索，在已知变异度较高的共有序列位置允许错配，如下所示：\n\
  \n```\npromoter = 'ttga.a...................ta...t'\n```\n\n但如果共有序列之间的间隔长度可变呢？\n\
  \n事实证明，正则表达式也为我们提供了一种简单有效的方法来处理这种情况。我们可以创建允许识别位点之间具有可变碱基数的搜索模式，如下所示：\n\n```\npromoter\
  \ = 'ttgaca.{15,25}tataat'\n```\n\n点号后的花括号表示对花括号前字符重复 15 到 25 次——在本例中，点号匹配任意碱基。这个搜索模式会匹配基因组中由两个共有识别位点组成，且中间被任意\
  \ 15 到 25 个碱基隔开的任何片段。\n\n```\nsequence2 = 'cccccttgacaccccccccccccccccctataatccccc'\n\
  sequence3 = 'cccccttgacaccccccccccccccccccccctataatccccc'\nprint(re.findall(promoter,sequence2))\n\
  ['ttgacaccccccccccccccccctataat']\nprint(re.findall(promoter,sequence3))\n['ttgacaccccccccccccccccccccctataat']\n\
  ```\n\n从上述代码可以看出，正则表达式 `'ttgaca.{15,25}tataat'` 同时匹配了 `sequence2` 和 `sequence3`，这两个序列仅在两个共有序列之间的间隔长度上有所不同。\n\
  \n\n\n### MatchObject：我们首次真正接触 Python 对象\n\n现在你大概正看着 `re.findall()` 方法的结果，觉得似乎少了点什么。有时，知道匹配模式是否存在于序列中以及其内容是什么就足够了，但如果我还想知道它在序列中的*位置*呢？别担心，`re.finditer()`\
  \ 方法正是解决这个问题的好帮手。`finditer()` 方法并不像 `findall()` 方法那样简单地返回一个匹配列表，因为它能够执行更复杂的搜索，生成一组更丰富、结构更清晰的结果。如果我们尝试直接打印\
  \ `finditer()` 搜索的结果，会是这样的：\n\n```\nprint(re.finditer(promoter,sequence2))\n```\n\
  \n呃，好吧——什么是“callable-iterator 对象”，我又该如何处理它呢？\n\n为了处理这种额外的复杂性，`finditer()` 方法返回一个包含\
  \ Python `MatchObject` 对象的可迭代集合，这样搜索结果可以逐个被遍历，并且每个结果都能得到更详尽的分析。技术上来说，`finditer()`\
  \ 方法返回一个对象，它是一种有序的其他对象的列表。该方法的顶层结果是一个**迭代器**，可以使用我们已在字符串和列表中用过的 `for element in\
  \ object` 语法，通过依次调用其包含的每个对象来进行遍历。该**迭代器**对象中引用的每个元素实际上都是一个 Python `MatchObject`，它类似于每个搜索命中的小型数据库，可以被查询以提取和分析其所包含的匹配信息。\n\
  \n除了更传统的*过程式*编程风格（本质上是一系列供计算机执行的指令块）外，Python 还支持*面向对象*编程（常缩写为 OOP）。我们之前使用的对象方法（如\
  \ `string.find`）已经让我们对这一点小有体验，而在第 7 章中，我们将真正深入探讨 OOP 的细节。不过目前，将 Python **迭代器**和\
  \ `MatchObject` 视为像 `String` 或 `int` 一样的其他 Python 对象就足够了，它们各自拥有自己的属性和方法。\n\n在代码清单\
  \ 6-2 中，我们展示了一些代码，演示了如何遍历 `finditer()` 方法返回的搜索命中列表（这假设变量已按上述方式定义），并询问每个对应的 `MatchObject`。\n\
  \n```\nmatches = re.finditer(promoter,sequence2)\nfor m in matches:\n    print(m.group())\n\
  \    print(m.start(),m.end())\nttgacaccccccccccccccccctataat\n5 34\n代码清单 6-2\n遍历正则表达式匹配结果\n\
  ```\n\n在我们的简单示例中，实际上只有一个搜索命中需要遍历，我们使用 `MatchObject` 的方法 `group()`、`start()` 和 `end()`\
  \ 打印了匹配序列及其起始和结束位置。这让你初步体会到如何处理正则表达式的搜索结果，但你能用它们做的事情远多于我们这里讨论的。\n\n如果你想了解更多，请查看关于\
  \ `MatchObjects` 的官方 Python 文档。\n\n正则表达式在计算机科学中有着悠久的历史，并且在计算机编程语言中几乎无处不在。我们在本章中看到的正则表达式模式仅仅触及了它们能力的皮毛——事实上，用一整本书来讨论正则表达式也是完全可能的。然而，就这一简短的入门介绍而言，如果你正在寻找深入正则表达式的良好途径，最好从官方\
  \ Python 文档开始。这篇 Python 正则表达式“操作指南”是一个非常不错的起点。\n\n## 但 Python 对于真正的基因组学工作来说太慢了，对吧？\n\
  \n现在，你们有些人可能会说，对于搜索我们在示例中展示的那种小规模序列，这还算不错，但它能处理基因组学和下一代测序领域的研究人员感兴趣的那种序列吗？那种序列长度常常可以达到数百万个碱基对？\n\
  \n答案是肯定的。\n\n我提出这一点是因为你可能会在某天听到（或者已经听到）有人这样说：“Python 是一种[解释型语言](https://en.wikipedia.org/wiki/Interpreted_language)，因此对于密集的计算工作来说太慢了。”虽然这种笼统的说法在很大程度上是一堆废话，但它确实包含了一点真相，即在某些情况下，解释型编程语言确实存在一些与性能相关的缺点。\n\
  \n[编译型](https://en.wikipedia.org/wiki/Compiler)编程语言，如 [C](https://en.wikipedia.org/wiki/C_%28programming_language%29)\
  \ 和 [Fortran](https://en.wikipedia.org/wiki/Fortran)，在运行代码之前会被转换成一组[机器可执行指令](https://en.wikipedia.org/wiki/Machine_code)，这样当你点击“运行”时，硬件可以立即开始执行代码。因此，这些编译型语言通常具有性能优势。相比之下，对于像\
  \ Python 这样的解释型语言，代码必须先被解析并即时转换成可执行代码，然后硬件才能实际运行。然而，这种对编译型与解释型语言的解释非常简化。包括 Python\
  \ 在内的一些语言还使用一种称为[字节码](https://en.wikipedia.org/wiki/Bytecode)的中间代码层，原始编程语言已被转换成一组非常接近机器自身可执行指令集的指令。因此，字节码可以极其高效地运行，因为将它们即时转换成机器可执行指令的开销非常小。这意味着你的\
  \ Python 代码中，一部分可能在运行时被解析和解释，而另一部分则已编译成字节码，以便更快速、更高效地执行。\n\n但等等（正如电视购物节目喜欢说的那样），还有更多！\n\
  \nPython 的情况还因为以下事实而变得更加复杂：Python 模块也可以用其他语言（如 C）编写，然后编译成机器可执行指令，并与 Python 解释器链接。这意味着你的\
  \ Python 代码可以作为解释型代码运行，也可以从字节码运行，或者直接作为机器可执行指令运行——所有这些都可以在同一个应用程序中完成！\n\n官方的 Python\
  \ 解释器实际上是用 C 编写的，作为 [Python 标准库](https://docs.python.org/2/library/index.html)一部分的许多模块也是如此。这意味着当你从运行在\
  \ Python 解释器中的代码调用这些标准库模块时，这些模块包含的函数和方法可以直接（并且非常高效地）作为编译后的机器可执行指令运行（只要它们运行时不遇到任何引用回解释型代码的情况）。\n\
  \n也许你能猜到我们这次短暂涉足计算机科学要导向哪里。\n\n我们在 Python 中通过导入 `re` 模块（正则表达式库所在之处）将其引入代码的正则表达式库，是用\
  \ C 编写并编译的。它也是高度[优化的代码](https://en.wikipedia.org/wiki/Program_optimization)，极其高效，正如我们希望在接下来向你展示的代码块中所演示的那样。\n\
  \n让我们来看一个来自人类基因组学的例子。\n\n\n\n人类基因组中最大的连续序列是[染色体 1](https://en.wikipedia.org/wiki/Chromosome_1_%2528human%2529)，拥有\
  \ 2.5 亿个碱基对。在代码清单 6-3 中，我们创建一个随机的合成染色体 1，并使用 Python 正则表达式来探测其序列。\n\n```\nimport\
  \ random\nbases = ['a','t','c','g']\nsequenceList = []\nfor n in range(0,250000000):\n\
  sequenceList.append(random.choice(bases))\nchromosome = \".join(sequenceList)\n\
  Listing 6-3\nCreating random synthetic chromosome\n```\n\n首先我们`import`了 Python 的`random`模块，该模块包含用于生成随机数和随机序列的代码。在这段代码中，我们将构建一个随机的、2.5\
  \ 亿个碱基的序列。正如我们从第 3 章中了解到的，Python 字符串是不可变的，因此更高效的做法是将一个非常大的字符串构建为列表，然后将列表转换为字符串。\n\
  \n![../images/476668_1_En_6_Chapter/476668_1_En_6_Figd_HTML.jpg](img/476668_1_En_6_Figd_HTML.jpg)\n\
  \n我们的随机序列将由 4 种 DNA 碱基`a`、`t`、`c`和`g`组成，我们将使用`random.choice`方法将它们逐个随机添加到列表中，直到达到所需的\
  \ 2.5 亿个碱基的长度。然后我们可以使用`join`方法将列表转换为字符串，作为我们的合成染色体。请注意，空字符串上的`join`方法会将参数中指定的列表的每个元素取出来，并使用空字符串作为分隔符将其添加到结果字符串中。在我们的例子中使用空字符串，是因为我们不希望序列中的碱基之间有任何分隔符。\n\
  \n当你运行这段代码时，如果它需要几分钟才能完成，请不要感到惊讶。这是一个需要组装的大字符串。创建合成基因序列的代码将是本章中最慢的部分。\n\n一旦我们将合成染色体组装为字符串，让我们在代码清单\
  \ 6-3 后面添加一些代码，看看使用 Python 正则表达式搜索它需要多长时间。为了开始测试，让我们在我们的 2.5 亿碱基合成染色体中搜索基因启动子示例中的下游保守序列`tataat`。完整代码如代码清单\
  \ 6-4 所示。\n\n```\nimport time\nimport random\nbases = ['a','t','c','g']\nsequenceList\
  \ = []\nfor n in range(0,250000000):\nsequenceList.append(random.choice(bases))\n\
  chromosome = \".join(sequenceList)\nsearchPattern = 'tataat'\nt1 = time.time()\n\
  result = re.finditer(searchPattern,chromosome)\nt2 = time.time()\nprint('Start time\
  \ =',t1,'seconds. End time =',t2,' seconds.')\nListing 6-4\nCreating synthetic chromosome\
  \ and searching for regular expression\n```\n\n这里我们引入了另一个 Python 模块——`time`模块，顾名思义，它用于处理时间。`time.time()`方法返回自一个任意固定日期和时间（Python\
  \ 文档中称为[纪元开始](https://en.wikipedia.org/wiki/Unix_time)）以来的秒数。这听起来非常史前和/或末日风格，但你可能惊讶地发现，这个伟大的历史开端实际上是\
  \ 1970 年 1 月 1 日。\n\n![../images/476668_1_En_6_Chapter/476668_1_En_6_Fige_HTML.jpg](img/476668_1_En_6_Fige_HTML.jpg)\n\
  \n如果你有兴趣了解更多，你可能想了解一下即将到来的[2038 年问题](https://en.wikipedia.org/wiki/Year_2038_problem)，这是\
  \ Unix 时间纪元的终点，除非操作系统改变时间值存储和处理的方式。\n\n好了，在关于 Unix 时间的小插曲之后，回到基因组学……\n\n我们将使用`time()`方法来查看正则表达式搜索代码在\
  \ 2.5 亿碱基的合成染色体中搜索`tataat`保守序列需要多长时间。我们将在搜索开始前和代码运行结束后立即记录时间（以秒为单位），然后比较结果（你的数字会与这些数字略有不同，因为你将相对于本书出版时间在未来运行代码）：\n\
  \n```\nStart time = 1446646598.11 seconds. End time = 1446646598.11 seconds.\n```\n\
  \n好的——这很快。如果你查看开始和结束时间，它们是一样的——至少精确到小数点后两位。让我们通过多次运行搜索并平均结果来进行更合适的基准测试，以便更好地了解搜索实际花费的时间。我们还将从结束时间中减去开始时间，并对搜索重复次数求平均，这样我们就可以直接得到搜索花费的时间。\n\
  \n我们将要在代码清单 6-5 中重复定时搜索**一百万次**，这应该能让你感受到这种正则表达式搜索到底有多快。\n\n```\nimport time\nimport\
  \ random\nbases = ['a','t','c','g']\nsequenceList = []\nfor n in range(0,250000000):\n\
  sequenceList.append(random.choice(bases))\nchromosome = \".join(sequenceList)\n\
  searchPattern = 'tataat'\nnsearch = 1000000\nt1 = time.time()\nfor n in range(0,nsearch):\n\
  result = re.finditer(searchPattern,chromosome)\nt2 = time.time()\nprint('Average\
  \ search time was ',(t2-t1)/float(nsearch),' seconds')\nAverage search time was\
  \  1.06230282784e-06  seconds\nnmatches = 0\nfor match in result:\nnmatches += 1\n\
  print('Number of search hits = ',nmatches)\nNumber of search hits =  60951\nListing\
  \ 6-5\nTiming a repeated search one million times (output is interspersed)\n```\n\
  \n**你可以看到这非常快！**——大约每次完整搜索需要 1 微秒。不过等一下，这次搜索这么快仅仅是因为没有找到任何匹配吗？\n\n让我们看看。在代码清单 6-5\
  \ 的末尾部分，我们遍历搜索命中结果（记住，`finditer`返回一个可迭代对象）并对它们进行计数。根据我们的计时数据，**`finditer`搜索在约一微秒内从我们的\
  \ 2.5 亿碱基序列中识别出了超过 60,000 个匹配**。Python 正则表达式搜索实在太快了！\n\n让我们在代码清单 6-6 中再做一次计时测试，这次使用稍微复杂的正则表达式，允许第四个位置为任意碱基。\n\
  \n```\nimport time\nimport random\nbases = ['a','t','c','g']\nsequenceList = []\n\
  for n in range(0,250000000):\nsequenceList.append(random.choice(bases))\nchromosome\
  \ = \".join(sequenceList)\nsearchPattern = 'tat.at'\nnsearch = 1000000\nt1 = time.time()\n\
  for n in range(0,nsearch):\nresult = re.finditer(searchPattern,chromosome)\nt2 =\
  \ time.time()\nprint('Average search time was ',(t2-t1)/float(nsearch),' seconds')\n\
  Average search time was  1.0852959156e-06  seconds\nnmatches = 0\nfor match in result:\n\
  nmatches += 1\nprint('Number of search hits = ',nmatches)\nNumber of search hits\
  \ =  239051\nListing 6-6\nSecond timing test\n```\n\n我们可以看到，我们得到的命中次数现在已经激增到近 240,000\
  \ 次，这并不奇怪，因为我们使用了更宽松的搜索模式。然而，每次搜索的平均时间仍然接近 1 微秒。\n\n所以下次有人告诉你 Python 对于任何类型的密集计算来说太慢时，你可以礼貌地向他们展示正则表达式搜索的出色性能——而且你只需键入几行代码并点击“运行”就可以执行这些搜索，而不必像使用编译语言那样经过单独的编译和链接步骤。我是否还提到过，你的\
  \ Python 代码可以在任何装有标准 Python 发行版的计算机上“原样”运行？\n\n\n\n与 Python 标准库中的许多模块一样，处理正则表达式的\
  \ `re` 模块实际上是用 C 语言编写的。因此，虽然对 `search` 的初始函数调用由 Python 解释器处理，但后续的搜索实际上是在编译后的原生代码中运行的，这也解释了其高效性。事实上，Python\
  \ 语言的一大优势在于它能非常轻松地与 C 这类原生编译语言交互，使得代码中计算密集的部分能够在 CPU 和内存方面“在裸机上”运行，几乎不受 Python 解释器开销的影响。\n\
  \n甚至有一些模块，如 [Cython](http://cython.org/)，允许你编写 Python 代码，将其转换为 C 语言，并编译成一个机器可执行的模块，然后你可以像导入任何其他\
  \ Python 模块一样，在应用中使用 `import` 导入它。还有一个名为 [SWIG](http://www.swig.org/Doc1.3/Python.html)\
  \ 的框架，允许你用 C 编写模块，编译并将其链接到 Python 解释器（有关这两个模块的更多信息，请参阅本章末尾的参考资料）。如果你有兴趣使用这些方法之一为你的\
  \ Python 项目创建高性能代码，那么掌握一定程度的额外技术知识会很有帮助。因此，我们在此顺便提及它们，但要提醒的是，这些是较为高级的 Python 编程主题，实际上超出了本入门书的范围。\n\
  \n下一章将通过进入面向对象编程（OOP）的神秘世界，继续介绍 Python 语言的核心特性。我们将暂时停留在生物序列的领域——在我们学习面向对象编程对生物学定量探索有多大帮助时，它们将成为我们的指引。\n\
  \n"
- "# 7. 对象课程\n\n*作为 Python 对象的生物序列*\n\n| ![../images/476668_1_En_7_Chapter/476668_1_En_7_Figa_HTML.gif](img/476668_1_En_7_Figa_HTML.gif)\
  \ | *“我不需要整理我的东西，”疯帽子宣称。“我有自己独特的一套系统，如果你不是我，看起来会完全混乱，但请相信我——我确切知道每样东西在哪里。”* *“你度假回来后会怎样？”一位晚餐客人问道。“你还能记得所有东西在哪里吗？”*\
  \ *“如果别人移动了什么东西呢？”另一位晚餐客人问道。* *“或者你自己移动了某样东西，却忘了放回原处呢？”又一位客人问道。* *“或者！”疯帽子红着脸厉声说道。“所有东西都被你们这群忘恩负义的晚餐客人四处乱动，把大鼻子伸进去，而你们本应该更懂规矩！”*\
  \ *在随后尴尬的沉默中，所有晚餐客人都只是盯着自己的茶杯。* |\n| ![../images/476668_1_En_7_Chapter/476668_1_En_7_Figb_HTML.gif](img/476668_1_En_7_Figb_HTML.gif)\
  \ | *面向对象编程、函数式编程、过程式编程、对象、类、实例、方法、继承、装饰器、Python* `Object` *、* `__init__()` *、*\
  \ `self` *、构造器、类变量与实例变量、重写、* `__str__()` *、* `print` |\n| ![../images/476668_1_En_7_Chapter/476668_1_En_7_Figc_HTML.gif](img/476668_1_En_7_Figc_HTML.gif)\
  \ | *DNA、RNA、蛋白质、序列、序列搜索、转录、翻译、遗传密码、密码子、分子量、核苷酸* |\n\n在本章中，我们将向你提供一个非常简洁的[面向对象编程](https://en.wikipedia.org/wiki/Object-oriented_programming)（OOP）入门介绍。如果你需要用\
  \ Python 编写比相对简单的脚本更复杂的程序，你很可能需要学习这种编程范式。关于 OOP 的讨论很多，支持和反对的双方也都伴随着大量的宣传。正如我们在正则表达式案例中看到的那样，甚至有整本书专门探讨这个主题。简单的事实是，OOP\
  \ 是一种组织代码的方式，如果运用得当，它通常会使代码更简洁、更易于理解、更易于维护且更具可重用性。如果你认为根据上述描述，我们属于支持 OOP 的一方，那你是对的。然而，必须强调的是，它是编写代码的*一种*方式，但并非*唯一*方式。OOP\
  \ 并非在所有情况下都完美适用。例如，对于小型脚本，使用 OOP 可能感觉像用大锤砸坚果。\n\n## 为什么选择面向对象编程？\n\n还有一个激烈争论的问题位于所有计算机编程语言的核心：如何管理代码中创建的所有实体（变量、函数等）的状态，使得代码的健壮性和一致性能够随其复杂性扩展。简而言之，有充分的理由认为\
  \ OOP 范式并非管理代码的最佳方法，尤其是当代码变得非常复杂，并开始拥有大量可变部分时。经常被提出的 OOP 替代方案是[函数式编程](https://en.wikipedia.org/wiki/Functional_programming)。这场争论远远超出了本书的范围，但我们希望你能意识到它的存在，以免你认为我们是在将\
  \ OOP 视为解决所有问题的万能药。OOP 可能并不完美，但在本书写作时，它是全世界绝大多数程序员当前编写代码时所采用的范式。\n\n根据我们的经验，在使用过\
  \ OOP 和非 OOP 编程范式后，我们认为 OOP 在帮助程序员更好地管理拥有大量可变部件的大型代码项目的复杂性这一既定目标上，表现得相当成功。如果你此刻在问自己：“我应该学习\
  \ OOP 吗？”那么，如果你将来想用 Python（或任何其他 OOP 编程语言，如 [Java](https://en.wikipedia.org/wiki/Java_%28programming_language%29)）进行任何大型项目的开发，我们会明确地回答“是的”。\n\
  \n![../images/476668_1_En_7_Chapter/476668_1_En_7_Figd_HTML.jpg](img/476668_1_En_7_Figd_HTML.jpg)\n\
  \n熟悉 OOP 范式也将对你大有裨益，因为如果你需要学习其他编程语言，大多数现代主流语言（如 [Java](https://en.wikipedia.org/wiki/Java_%28programming_language%29)、[C++](https://en.wikipedia.org/wiki/C%2B%2B)、[Ruby](https://en.wikipedia.org/wiki/Ruby_%28programming_language%29)、[C#](https://en.wikipedia.org/wiki/C_Sharp_%28programming_language%29)\
  \ 等）都是以 OOP 为核心的。\n\n我们在本章中旨在提供一次 OOP 领域的入门导览，以及 OOP 在 Python 中是如何实现的。我们的目的是为你提供足够的信息，让你能够开始使用\
  \ Python 进行 OOP 编程，而不会用冗长（且令人疲惫）的领域综述给你带来负担——话说回来，那样的综述足以填满整本书，从而没有空间讨论其他内容了！\n\n\
  因此，要开始讨论什么是 OOP，我们先从它*不是*什么开始——换句话说，OOP 与我们迄今为止在本书中看到的大部分内容有何不同？\n\n\n\n### OOP\
  \ 的核心在于组织我们的程序\n\n到目前为止，我们看到的代码大多采用[过程式编程](https://en.wikipedia.org/wiki/Procedural_programming)风格，顾名思义，这种风格主要由组织成计算机需遵循流程的代码块构成。这些流程在\
  \ Python 中主要是函数和方法，但在其他编程语言中，它们可能被称为子程序或代码块。它们的共同点在于将代码组织成更小的单元或任务——例如，从文件中读取 96\
  \ 孔板的数据表，或根据序列计算寡核苷酸的分子量。\n\n需要明确的是，运行代码的硬件并不关心代码的组织方式。当一切正常运行时，硬件只会按指定顺序执行给定的指令，而不会在意代码是否合理、整洁或组织有序。程序员组织代码的方式在某些情况下可能会影响执行效率（例如存在不必要的冗余），但假设代码正确无误，能实现程序员的意图且没有错误，那么无论它是否高效或组织良好，硬件都会执行它。\n\
  \n因此，作为一个基本原则，我们可以说 **组织代码主要是为了程序员（以及任何可能需要阅读、理解、使用、协作或修改其代码的人）的便利**。\n\nOOP 是一个*概念模型*，用于描述程序员试图在其代码中实现的任何内容，顾名思义，它以*对象*作为核心构建块。\n\
  \n实际上，我们在前面章节中使用 **object.method** 语法时已经遇到过 Python 对象——例如，`list.append()` 方法用于将项目追加到列表末尾。`list`\
  \ 对象已在 Python 标准库中为你定义好了，但若要深入了解幕后机制并理解 Python 对象，让我们在我们非常熟悉的领域——生物学中，自行设计一两个对象。\n\
  \n![../images/476668_1_En_7_Chapter/476668_1_En_7_Fige_HTML.jpg](img/476668_1_En_7_Fige_HTML.jpg)\n\
  \n## 用于处理生物学序列的 OOP 实现\n\n假设我们正在创建一个管理生物学序列的应用程序，该程序必须处理 DNA、RNA 和蛋白质序列。这些似乎都是我们代码中\
  \ Python 对象的良好候选者，因此我们将其作为示例。\n\n那么，如果你坐好了并集中注意力，以下是 OOP 新手需要了解的第一个重大要点。\n\n当我们用\
  \ OOP 代码描述一个对象时，**我们实际上是在描述该对象的模板，这个模板被称为** [类.​](https://en.wikipedia.org/wiki/Class_%2528computer_programming%2529)\
  \ 仔细想想，这完全合理。我们的应用程序可能需要处理数百甚至数千个序列对象，因此为所有对象编写一个主描述是明智的。\n\n**类是对象的模板，定义了该对象的所有实例**。我们将每个实际对象称为其所属类的***实例***。从这个意义上说，当我们在\
  \ Python 中谈论对象时，实际指的是**特定类的实例**。\n\n在创建实例（对象）之前，我们首先需要从以下方面描述类：**(i)** 它存储了哪些属性——这些通常被称为字段、实例字段或实例变量——以及\
  \ **(ii)** 它能做什么，即它的方法。解释这些概念的最佳方式是考虑它们在我们的序列类中的表现形式（从现在开始，当我们描述对象的模板时，将使用术语**类**；当我们描述作为类实例的实际对象时，使用**实例**）。\n\
  \n每个序列对象都必须能够存储实际的序列：如果是 DNA 或 RNA 序列，则为核苷酸碱基；如果是蛋白质，则为肽段。但序列对象还需要什么呢？也许还需要一个名称，或者从数据库中提取的登录号。类中的字段还可以用于设置其所定义对象的*状态*——例如，如果对象是蛋白质中的氨基酸，你可以想象有一个布尔（`True`/`False`）字段来定义它是否被磷酸化。你可能还能想到许多可以在序列示例中包含的其他字段，但当前我们假设\
  \ `Sequence` 类包含一个名称字段和一个序列字段。\n\n## 命名空间和模块\n\n我们需要在此暂停一下，简要讨论一下**命名空间**和**模块**。你可能会问，这些是什么？嗯，我们在第\
  \ 6 章介绍 `import` 语句时曾简要提及命名空间。如果你曾经“冲浪”过互联网（嘿，还记得 1990 年代吗？），并且访问过一个叫 Google 的小网站，那么你其实一直在遇到这些命名空间，只是没有这么称呼它们而已。`google.com`\
  \ 本身就是一个命名空间，而这些熟悉的站点：\n\n```\nnews.google.com\nimages.google.com\n```\n\n实际上只是整个\
  \ `google.com` 命名空间中的元素。在一个命名空间内，所有内容必须唯一。例如，在 `google.com` 命名空间中不能有两个 `images`，但显然\
  \ `images.yahoo.com` 是可以的，因为它位于完全不同的命名空间中。命名空间在 Python 中有多种用途，它们允许你使用简写引用元素，并将类和函数分组到**模块**中。\n\
  \n例如，我们在本章中创建的所有类都包含在文件 `PFTLS_Chapter_07.py` 中，这个文件本身既构成了一个**模块**，也构成了一个**命名空间**（关于模块和命名空间的更多细节和示例，请参阅可靠的\
  \ [Python 语言手册中关于模块的部分](https://docs.python.org/2/tutorial/modules.html)^(⁷⁸)）。我们将在第\
  \ 11 章讨论从模块中导入单个类和函数的方法时，再回到模块和命名空间的话题。但目前，只需知道每个 Python 类在此模块中必须有唯一的名称即可（[另请参阅\
  \ Python 教程](https://docs.python.org/2.7/tutorial/classes.html)^(⁷⁹)）。说到这里，让我们回到对类的讨论。\n\
  \n\n\n## 类定义的结构\n\n请注意，我们现在正按照 Python 编码风格编写类名。按照惯例，Python 程序员倾向于以大写字母开头命名类（这不是强制要求，而是\
  \ Python 程序员广泛认同的实践，目的是让每个人的代码更具可读性和更易理解）。\n\n如果类名由多个单词组成，例如 `ProteinSequence`，Python\
  \ 的通用惯例是使用驼峰命名法（CamelCase），即每个单词的首字母大写。\n\n相比之下，字段的命名惯例通常以小写字母开头，并且仅为了可读性而使用大写字母来标记新单词的开始。例如，我们的\
  \ `Sequence` 类可能包含 `sequence` 和 `sequenceName` 这两个字段。您已经可以看出这如何有助于提高代码的可读性，因为您现在可以区分\
  \ `Sequence` 类及其包含的 `sequence` 字段。\n\n目前不必过分担心这些惯例，但尽早开始在代码中使用它们是一个好习惯。忘记或混淆它们可能会使您的代码更难阅读，但不会导致代码出错。\n\
  \n图 7-1 以小型示意图的形式展示了我们到目前为止草拟的 `Sequence` 类。\n\n![../images/476668_1_En_7_Chapter/476668_1_En_7_Fig1_HTML.jpg](img/476668_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\nSequence 类整体结构\n\n我们有两个字段，但还没有方法。正如我们在第 3 章的 `string.find()` 示例中所见，方法是特定于某个类的函数。方法定义了类能做什么，并且通常作用于该类的对象或与该对象协作。例如，我们像这样使用\
  \ `string.find()` 方法：`mySequence.find('ttt')` 来定位字符串 `mySequence` 中的模式 `'ttt'`。\n\
  \n那么，我们需要我们的 `Sequence` 类能够做什么呢？\n\n我们可能需要实现一个搜索方法，用于在序列中定位感兴趣的模式，但我们现在遇到了一个小难题……\n\
  \n我们是否要对所有三种类型的序列都使用同一个 `Sequence` 类？\n\n我们提出这个问题的原因是，有些方法可能并不适用于所有三种类型——例如，将一个\
  \ DNA 序列翻译成蛋白质序列的函数，应用于一个本身已经是蛋白质序列的序列上是没有意义的。也许我们需要在我们的应用程序中编写三个独立的类，每种序列类型一个。不过，等一下——这是否意味着，我们想要用于所有序列类型的搜索方法，都必须为每种类型单独编写呢？\n\
  \n好吧，先别急着思考这个问题，我们将绘制一个表格，如图 7-2 所示，展示我们希望对每种序列类型具备哪些方法。\n\n![../images/476668_1_En_7_Chapter/476668_1_En_7_Fig2_HTML.jpg](img/476668_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\n每种 Sequence 子类所需的功能\n\n## 类继承\n\n能够满足此表格要求的一种确定方法是将每种序列类型编写为一个独立的类，但缺点是我们将不得不创建一些冗余代码。然而，OOP\
  \ 有一个旨在帮助程序员解决这类问题的特性，它被称为继承。\n\n正如父母有继承其属性的孩子一样，OOP 类可以拥有*子类*，这些子类继承其*父类*的字段和方法。作为\
  \ OOP 程序员，我们甚至可以选择哪些属性被子类继承，哪些不继承。同样，我们可以自由地为子类赋予其父类所不具备的新属性。这在实际中对我们意味着，我们想要在所有子类中共有的每个属性，都可以放入父类中，然后由子类继承。在我们的示例中，这意味着我们希望在\
  \ DNA、RNA 和蛋白质类中拥有的搜索方法，只需在父类中编写一次，即可作为方法在每个序列类型中被继承。\n\n稍后我们将更详细地了解其工作原理，但让我们先直接看看如何通过编写\
  \ DNA、RNA 和蛋白质序列的父类来在 Python 中创建类。我们将此父类命名为 `Sequence`，因为它是一种通用类，并非特定的序列类型。这甚至不需要是我们实际打算使用的类，而只是一个通用的占位符类，我们实际想要使用的特定类可以从它那里继承一些字段和方法。在某些编程语言中，这些通用类甚至可以被指定为*抽象类*，这意味着它们不能被直接*实例化*（即用于创建类的实例（对象）），而只能通过它们的子类来调用。Python\
  \ 实际上有一种使用 Python 语言特性（称为装饰器⁸⁰）来指定抽象类的方法，但我们在此不讨论，因为它们是更高级的 Python 主题，超出了本入门教程的范围。\n\
  \n因此，图 7-3 是我们为生物序列设计的顶层或父类。请记住，它的两个字段和一个方法将被我们从中创建的所有子类继承。\n\n![../images/476668_1_En_7_Chapter/476668_1_En_7_Fig3_HTML.jpg](img/476668_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3\n\n父类 Sequence 的设计\n\n而清单 7-1 是创建我们用于生物序列的父类的代码。\n\n```\n### A Python class\
  \ for handling biological sequences\nclass Sequence:\ndef __init__(self,name,sequence):\n\
  self.name = name\nself.sequence = sequence\ndef search(self,pattern):\nreturn self.sequence.find(pattern)\n\
  ```\n\n清单 7-1\n\n生物序列的父类\n\n重要的是要记住，这段代码只是定义了 `Sequence` 类，在我们实例化它之前，它不会创建任何实例（对象）。Python\
  \ 类定义以 `class` 关键字开头，后跟类名和冒号。稍后我们将看到，如果我们创建的类是一个继承自父类的子类，我们还需要在当前类名后面的括号中包含父类的名称。然而，由于\
  \ `Sequence` 是一个顶层类，我们不需要这个额外的语法。\n\n\n  \n我们刚刚告诉你的并不完全准确。Python 中最高层的类是`pyObject`，所有其他类都继承自它。当你在\
  \ Python 中创建顶层类时，它会*自动且不可见地*继承自`pyObject`，后者包含一系列对所有 Python 对象而言固有的有用属性，例如用于创建类实例的`__init__`方法（一个不包含实例化类方法的类定义，恐怕没什么用，对吧？）。\
  \  \n\n因此，`__init__`方法几乎总是你新类中定义的第一个方法，因为它包含了指导类如何创建自身实例的指令。你还会注意到，名称略显奇怪的`self`始终是传递给`__init__`的第一个参数。这仅仅是对我们正在创建的对象的引用。你可以把它想象成该对象将要存储的地址。你不需要知道实际的地址是什么——Python\
  \ 在后台为你处理了这一切。  \n\n![../images/476668_1_En_7_Chapter/476668_1_En_7_Figf_HTML.jpg](img/476668_1_En_7_Figf_HTML.jpg)\
  \  \n\n你可以在`__init__`接下来的两行代码中看到这一切是如何工作的。你会注意到，对于我们的`Sequence`类，`__init__`方法需要两个参数`name`和`sequence`，它们从外部传入。`Sequence`类在创建新实例时，第一件事就是使用这两个外部变量来定义自己的`name`和`sequence`字段。这些是对象自身独有的`name`和`sequence`版本，不再需要与那些外部变量的值相对应，甚至不需要与`Sequence`类的任何其他实例的`name`和`sequence`变量相对应。这其实就是`self`的含义。当你在对象的上下文中引用它时，它总是指该对象的那个字段的版本。这允许你区分对象的字段版本（例如`self.name`）与同名的外部变量（例如`name`），或者来自另一个对象的相同字段。\
  \  \n\n作为一个小插曲来更全面地解释`self`，假设你有一个类，其方法允许该对象与同一类的另一个对象进行比较（这是编程中非常常见的场景，例如判断两个字符串或数字是否相等）。外部对象作为参数传递给当前对象的方法——在这种情况下，Python\
  \ 程序员之间一种（非强制性的）约定是将外部对象命名为`other`，以便与`self`进行清晰区分。现在，当前对象的方法可以比较自己版本的字段和另一个对象版本的字段，类似于清单\
  \ 7-2 中的代码。  \n\n```\ndef compareNames(self,other):\nif self.name == other.name:\n\
  return True\nelse:\nreturn False\nListing 7-2\nFunction to compare names between\
  \ two objects\n```\n\n因此，当你使用`__init__`方法初始化新对象时，你始终使用参数`self`来本质上建立对该对象的引用，这将使你能够在代码中明确地引用其字段和方法。在某些\
  \ OOP 语言中，`self`作为隐藏变量传递给构造函数，但在 Python 中，我们必须显式地传递它。  \n\n你可以看到，在我们这个非常简单的例子中，`__init__`方法为`Sequence`类所做的全部事情就是定义`name`和`sequence`字段。在`__init__`方法之后，我们还包含了`search`方法，我们希望它被`Sequence`的所有子类继承。注意，与所有实例方法一样，它接受`self`作为第一个参数。`search`方法还接受第二个参数`pattern`，顾名思义，它是在对象`self.sequence`中搜索的模式。\
  \  \n\n由于`Sequence`是一个真实的类，尽管我们更倾向于将其用作抽象类，但我们还是继续创建它的一个实例来测试父类代码并确保其工作正常（确保你首先执行了清单\
  \ 7-1 中定义类的代码）：  \n\n```\nmySequence = Sequence('Some made up sequence','cgtatgcgct')\n\
  print(mySequence.name)\nSome made up sequence\nprint(mySequence.sequence)\ncgtatgcgct\n\
  print(mySequence.search('gcg'))\n\n```\n\n到目前为止一切顺利。我们的父类`Sequence`按预期工作。我们能够创建该类的一个实例`mySequence`，然后可以使用**对象.属性**语法来访问它的字段和方法。\
  \  \n\n![../images/476668_1_En_7_Chapter/476668_1_En_7_Figg_HTML.jpg](img/476668_1_En_7_Figg_HTML.jpg)\
  \  \n\n现在，我们继续在清单 7-3 中创建`Sequence`的第一个子类，它将专门用于处理 DNA 序列（请注意，需要先执行清单 7-1 中的代码）。\
  \  \n\n```\nclass DNASequence(Sequence):\ndef __init__(self,name,sequence):\nSequence.__init__(self,name,sequence)\n\
  def transcribe(self):\nreturn self.sequence.replace('t','u')\nListing 7-3\nDefining\
  \ a subclass of Sequence: DNASequence\n```\n\n首先注意，我们现在在当前类名后面的括号中写出父类，以表明这个新类`DNASequence`是`Sequence`的一个子类。你还会注意到，我们`__init__`方法中的代码被替换为一行，它简单地将`name`和`sequence`参数传回我们已经为`Sequence`父类编写的`__init__`方法。重要的是，我们也可以在我们的`DNASequence`子类的`__init__`方法中包含更多代码，以添加父类中没有的对象初始化步骤——但就目前而言，我们满足于仅仅使用父类`__init__`方法中已有的步骤来初始化我们子类的实例。\
  \  \n\n你还会注意到，子类定义中没有出现`search`方法，因为我们希望从`Sequence`父类继承它，并且我们还有一个父类中没有的新方法`transcribe`。这很有道理，因为`transcribe`方法是特定于\
  \ DNA 序列的，我们不希望它被其他序列类型继承（如果我们把它放在父类中，它就会被继承）。  \n\n和之前一样（在执行了清单 7-1 和清单 7-3 中的代码之后），让我们创建新的`DNASequence`子类的一个实例并测试它：\
  \  \n\n```\nmyDNASequence = DNASequence('My first DNA sequence','gctgatatc')\nprint(myDNASequence.name)\n\
  My first DNA sequence\nprint(myDNASequence.sequence)\ngctgatatc\nprint(myDNASequence.search('gat'))\n\
  \nprint(myDNASequence.transcribe())\ngcugauauc\n```\n\n很好！  \n\n尽管我们没有在`DNASequence`子类中显式包含`search`方法，但我们可以看到它已按预期成功地从`Sequence`父类继承。我们还有一个特定于`DNASequence`子类的新方法`transcribe`。子类从父类继承，而非反过来，因此`transcribe`方法不会回传给父类`Sequence`，也不会传给它的任何子类。如果你是一个经验主义者，只重视基于经验的知识，你可以尝试从父类使用`transcribe`来验证最后这句话。\
  \  \n\n```\nprint(mySequence.transcribe())\nAttributeError: Sequence instance has\
  \ no attribute 'transcribe'\n```\n\n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n我们继续创建一个 `RNASequence` 类，它将包含一个 `translate` 方法，用于将其核苷酸序列翻译成肽序列。为了提高处理长序列时的效率，`translate`\
  \ 方法会先创建一个肽列表，然后对空字符串使用 `join` 方法，将其转换为单个字符串。为了翻译 RNA 密码子，我们还将创建一个 Python 库，其中包含标准的[遗传密码](https://en.wikipedia.org/wiki/Genetic_code)，作为翻译的查找表。\n\
  \n清单 7-4 中是 `RNASequence` 类的代码（需要同时执行清单 7-1 中的代码才能生效）。\n\n```\nimport string\nrnaToProtein\
  \ = {'uuu':'F','uuc':'F','uua':'L','uug':'L',\n'ucu':'S','ucc':'S','uca':'S','ucg':'S',\n\
  'uau':'Y','uac':'Y','uaa':'STOP','uag':'STOP',\n'ugu':'C','ugc':'C','uga':'STOP','ugg':'W',\n\
  'cuu':'L','cuc':'L','cua':'L','cug':'L',\n'ccu':'P','ccc':'P','cca':'P','ccg':'P',\n\
  'cau':'H','cac':'H','caa':'Q','cag':'Q',\n'cgu':'R','cgc':'R','cga':'R','cgg':'R',\n\
  'auu':'I','auc':'I','aua':'I','aug':'M',\n'acu':'T','acc':'T','aca':'T','acg':'T',\n\
  'aau':'N','aac':'N','aaa':'K','aag':'K',\n'agu':'S','agc':'S','aga':'R','agg':'R',\n\
  'guu':'V','guc':'V','gua':'V','gug':'V',\n'gcu':'A','gcc':'A','gca':'A','gcg':'A',\n\
  'gau':'D','gac':'D','gaa':'E','gag':'E',\n'ggu':'G','ggc':'G','gga':'G','ggg':'G'}\n\
  class RNASequence(Sequence):\ndef __init__(self,name,sequence):\nSequence.__init__(self,name,sequence)\n\
  def translate(self):\npeptide = []\nfor n in range(0,len(self.sequence),3):\ncodon\
  \ = self.sequence[n:n+3]\npeptide.append(rnaToProtein[codon])\npeptideSequence =\
  \ \".join(peptide)\nreturn peptideSequence\n清单 7-4\n定义一个包含类变量的子类\n```\n\n`translate`\
  \ 方法的代码稍微复杂一些，但如果你仔细观察，你会发现它只是每次以三个碱基为单位遍历 RNA 序列，并使用 `rnaToProtein` 字典将每个三碱基密码子翻译成一个肽。\n\
  \n让我们测试这个新的子类（请确保先执行清单 7-1 和清单 7-4 中的代码）来看看它是如何工作的：\n\n```\nmyRNASequence = RNASequence('My\
  \ first RNA sequence','gcugauauc')\nprint(myRNASequence.name)\nMy first RNA sequence\n\
  print(myRNASequence.sequence)\ngcugauauc\nprint(myRNASequence.search('gau'))\n\n\
  print(myRNASequence.translate())\nADI\n```\n\n最后，为了完整起见，我们将在清单 7-5 中添加一个 `ProteinSequence`\
  \ 类来完善我们的一组生物序列子类（需要先执行清单 7-1 中的代码）。\n\n```\nclass ProteinSequence(Sequence):\n\
  def __init__(self,name,sequence):\nSequence.__init__(self,name,sequence)\nmyProteinSequence\
  \ = ProteinSequence('My first protein sequence','MDVTLFSLQY')\nprint(myProteinSequence.name)\n\
  My first protein sequence\nprint(myProteinSequence.sequence)\nMDVTLFSLQY\nprint(myProteinSequence.search('LFS'))\n\
  \n清单 7-5\nProteinSequence 子类\n```\n\n与其仅仅让类方法 `transcribe` 和 `translate` 生成一个包含转录或翻译序列的字符串，我们当然也可以直接输出相应的类。在清单\
  \ 7-6 中，我们展示了一个更新的 `DNASequence` 类，它提供了 `transcribe` 方法的一个替代方案，该方法输出一个新的 `RNASequence`\
  \ 对象，而不仅仅是返回一个 RNA 序列字符串（请注意，需要先通过执行清单 7-1 和清单 7-4 中的代码来定义 `Sequence` 和 `RNASequence`\
  \ 类）。\n\n```\nclass DNASequence(Sequence):\ndef __init__(self,name,sequence):\n\
  Sequence.__init__(self,name,sequence)\nself.residues = {'a':313.2,'c':289.2,'t':304.2,'g':329.2}\n\
  def transcribe(self):\nreturn self.sequence.replace('t','u')\ndef transcribeToRNA(self):\n\
  rnaSequence = self.sequence.replace('t','u')\nrnaName = 'Transcribed from ' + self.name\n\
  return RNASequence(rnaName,rnaSequence)\nnewRNASequence = myDNASequence.transcribeToRNA()\n\
  print(newRNASequence.name)\nTranscribed from My first DNA sequence\nprint(newRNASequence.sequence)\n\
  gcugauauc\n清单 7-6\n返回 RNASequence 对象的更新版 DNASequence 类\n```\n\n在 `transcribeToRNA`\
  \ 这个新方法中，我们可以看到，它实际上返回的是一个 `RNASequence` 类的实例，而不仅仅是一个编码 RNA 序列的字符串。这仅仅是为了说明，从 Python\
  \ 的角度来看，用户定义类的实例并没有什么特别之处。类的实例可以从函数和方法中返回，也可以作为参数传递给它们，并且**类甚至可以出现在其他类的字段中**。\n\n\
  为了向您展示类和对象如何让您的工作更轻松，在清单 7-7 中，我们通过添加几个额外的方法和一个新字段来稍微扩展一下父类。\n\n```\nclass Sequence:\n\
  def __init__(self,name,sequence):\nself.name = name\nself.sequence = sequence\n\
  self.residues = {}\ndef search(self,pattern):\nreturn self.sequence.find(pattern)\n\
  def molecularWeight(self):\nmwt = 0.0\nfor residue in self.sequence:\nmwt += self.residues[residue]\n\
  return mwt\ndef validSequence(self):\nfor residue in self.sequence:\nif not residue\
  \ in self.residues:\nreturn False\nreturn True\n清单 7-7\n扩展父类\n```\n\n这段代码大部分与之前相同，但您可以看到我们在\
  \ `__init__` 方法中添加了一行代码，用于定义一个名为 `residues` 的字段。我们将使用这个字段来定义子类序列中残基的单字母代码和分子量，但在父类中——您还记得，它本质上是一个我们不打算直接使用的通用序列类——`residues`\
  \ 只是一个空字典。严格来说，我们根本不需要将 `residues` 添加到父类中，但我们喜欢将这类占位符字段放入父类中，即使我们从未打算实际实例化父类。这可以作为一种提醒，提醒我们需要在子类中包含这个字段。\n\
  \n另一个重大变化是两个方法 `molecularWeight` 和 `validSequence`，它们分别使用 `residues` 字典来计算分子量和验证序列。在这种情况下，验证序列意味着检查序列中的所有残基是否对该特定序列类型有效。如果我们像清单\
  \ 7-8 那样，将 `residues` 字段修改为 `DNASequence` 类的 `__init__` 方法，就能明白这意味着什么（你需要先通过运行清单\
  \ 7-7 中的代码来加载 `Sequence` 和 `RNASequence` 类，然后再运行清单 7-4 中的代码）。\n\n```\nclass DNASequence(Sequence):\n\
  def __init__(self,name,sequence):\nSequence.__init__(self,name,sequence)\nself.residues\
  \ = {'a':313.2,'c':289.2,'t':304.2,'g':329.2}\ndef transcribe(self):\nreturn self.sequence.replace('t','u')\n\
  def transcribeToRNA(self):\nrnaSequence = self.sequence.replace('t','u')\nrnaName\
  \ = 'Transcribed from ' + self.name\nreturn RNASequence(rnaName,rnaSequence)\n清单\
  \ 7-8\n向 DNASequence 子类添加残基\n```\n\n`residues` 的字典键就是四个 DNA 核苷酸，它们对应的值就是各自的分子量（在这个简单的例子中，我们没有包含任何末端或修饰残基的分子量）。现在，我们可以让\
  \ `DNASequence` 对象计算它自己的分子量并验证它的序列，如下所示：\n\n```\nprint(myDNASequence.molecularWeight())\n\
  2775.8\nprint(myDNASequence.validSequence())\nTrue\n```\n\n\n\n## 类变量、实例变量与其他类作为变量\n\
  \n好吧——我们得坦白承认，我们可能刚刚做了一件有点傻的事，至少从面向对象编程的角度来看是这样。我们将 `residues` 字典放在 `__init__` 方法中的方式，意味着\
  \ `DNASequence` 类的每个实例都会拥有自己的残基属性副本。从原则上讲，这种做法存在风险，因为我们有可能不小心在 `DNASequence` 类的某个特定实例中重新赋值这些属性的值，从而产生一个与其他\
  \ `DNASequence` 实例不再共享共同属性的 `DNASequence` 对象（顺便提一下，在某些情况下我们可能**确实**希望如此，那样的话我们就不算太蠢了）。我们采用的方法效率也很低，因为现在必须在每个\
  \ `DNASequence` 实例中都存储同一份字典的副本。对于几十甚至几百条序列来说，这不算什么大问题，但对于数百万条序列来说，可能就成问题了。\n\n如果有一种方法，能够为整个类一次性创建一个字段，该类的所有实例都能访问它，而不必各自携带该字段的独立副本，那该多好啊？事实证明，在\
  \ Python 中，确实有办法做到这一点，我们可以使用一种称为**类变量**的结构来实现，稍后我们将详细了解它——敬请期待。\n\n请注意，一旦我们为父类 `Sequence`\
  \ 添加了那两个额外方法，我们只需在子类 `DNASequence` 中添加一行代码来定义该序列类型的残基，然后就能随时使用额外功能了。为了也将此功能扩展到 `RNASequence`\
  \ 和 `ProteinSequence` 子类，我们只需要类似地将 `residues` 字典也添加到它们各自的 `__init__` 方法中即可，当然，要包含每种序列类型对应的残基定义。\n\
  \n这些最后的改动展示了对象不仅能很好地帮助你组织代码，还能使代码更一致、更易于使用。我们所有的序列类在搜索、计算分子量和验证序列方面都拥有相同的语法和功能。每个子类也都具有与其特定序列类型相一致的额外功能——例如，不可能在不经意间让应用程序尝试转录一条蛋白质序列，这种操作毫无意义，并且如果任其不受检查地执行下去，可能会在应用程序的后续部分引起错误和不一致的行为，而这些错误和行为可能更难追踪和调试。还记得我们之前是如何评论\
  \ Python 字符串和列表对象通过 `[from:to]` 语法所具备的通用且一致的功能和语法吗？你刚刚已经看到了如何通过使用类，将这种清晰的组织和一致性带入你自己的代码中。\n\
  \n重要的是要认识到，在 Python 中，你自己创建的类与 Python 库中提供的核心类（如字符串、整数和浮点数）之间没有根本区别。你创建的类甚至可以作为一个字段用在另一个类中。例如，让我们把\
  \ `DNASequence` 类中的 `residues` 字段单独拿出来，让它自己成为一个类，并拥有自己的功能。\n\n在代码清单 7-9 中，是我们新类\
  \ `DNANucleotide` 的定义。\n\n```\nclass DNANucleotide:\n    nucleotides = {'a': 313.2,\
  \ 'c': 289.2, 't': 304.2, 'g': 329.2}\n    def __init__(self,nuc):\n        self.name\
  \ = nuc\n        self.weight = DNANucleotide.nucleotides[nuc]\n```\n\n*代码清单 7-9\
  \ – 处理核苷酸的类*\n\n为了说明类可以以嵌套方式使用（即类作为字段出现在其他类内部），我们会把这个例子尽量简化，但同时我们也会巧妙利用这个例子来介绍 Python\
  \ 类变量。⁸¹ 你可以在类定义中的下面这行看到类变量的定义：\n\n```\nnucleotides = {'a': 313.2, 'c': 289.2, 't':\
  \ 304.2, 'g': 329.2}\n```\n\n但请注意，**这行代码并没有出现在实际实例化类的代码中**。这使得它成为一个由 `DNANucleotide`\
  \ 类的所有实例共享的变量，而不是某个实例中的字段。\n\n我们为什么要这样做呢？需要稍作进一步解释……\n\n如果 `DNANucleotide` 类能够以某种方式包含它*自己的*\
  \ DNA 核苷酸定义，并且独立于代码中其他任何地方的定义，那将非常方便。这意味着 `DNANucleotide` 类将始终使用同一组一致的数据，同时也打破了程序员在其代码中使用\
  \ `DNANucleotide` 类时，却可能未在代码中提供其所需的核苷酸定义这一潜在危险依赖。\n\n实现这一目标的一种方法是，让 `DNANucleotide`\
  \ 类的每个实例都拥有自己的核苷酸定义副本——例如放在 `__init__` 例程中。这样做没问题，但可能有点浪费。例如，如果我们要构建[人类 1 号染色体](https://en.wikipedia.org/wiki/Chromosome_1_%2528human%2529)的\
  \ DNA 序列，最终可能会得到大约 2.5 亿个核苷酸，每个核苷酸都需要存储空间来存放自己那份 `nucleotides` 数据定义的副本。此外，我们将这些数据嵌入\
  \ `DNANucleotide` 类的目标，是为了让使用这个类进行编码更安全、更健壮、更一致。因此，我们并不真的希望 `DNANucleotide` 的每个实例都拥有该数据的*自己的*定义——相反，我们希望它们都共享一份*相同的*数据副本。\n\
  \n因此有了**类变量**——一个实际上由类的所有实例共享的单一定义，而不是每个实例都必须携带自己的副本。\n\n![../images/476668_1_En_7_Chapter/476668_1_En_7_Figh_HTML.jpg](img/476668_1_En_7_Figh_HTML.jpg)\n\
  \n稍后我们将看到如何引用类变量，但请先思考一下。由于该定义不是在类实例内部做出的，我们不能使用习惯的 `self.field` 语法来处理类实例中的字段。\n\
  \n如果我们查看 `__init__` 例程，可以看到它接收一个单一的核苷酸，然后使用 `nucleotides` 类变量中包含的字典来同时添加分子量属性。\n\
  \n就像这样：\n\n```\ndef __init__(self,nuc):\n    self.name = nuc\n    self.weight =\
  \ DNANucleotide.nucleotides[nuc]\n```\n\n现在你可以看到如何引用 `nucleotides` 类变量了。\n\n```\n\
  self.weight = DNANucleotide.nucleotides[nuc]\n```\n\n和所有类变量一样，它只是类名后跟变量名。\n\n我们来快速测试一下，确保我们的新类能正常工作。\n\
  \n```\nnucleotide = DNANucleotide('g')\nprint(nucleotide.name, nucleotide.weight)\n\
  g 329.2\n```\n\n太棒了！\n\n为了保持简单，我们只为 `DNANucleotide` 添加了几个字段，使其成为一个功能极简的类。实际上，当你费尽心思在\
  \ Python 中创建一个新类时，你可能希望实现的[数据封装](https://en.wikipedia.org/wiki/Encapsulation_%2528computer_programming%2529)程度和功能比我们这个简单的例子所展示的要高得多。\n\
  \n\n\n现在我们将使用新的`DNANucleotide`类，该类位于一个用于 DNA 序列的类中。为了保持简单，我们将在清单 7-10 中暂时也创建一个自己的新\
  \ DNA 序列类——该类*不*继承先前`Sequence`类的所有内容。\n\n```\nclass NewDNASequence():\ndef __init__(self,name,sequence):\n\
  self.name = name\nself.sequence = []\nfor s in sequence:\nd = DNANucleotide(s)\n\
  self.sequence.append(d)\ndef molecularWeight(self):\nmwt = 0.0\nfor s in self.sequence:\n\
  mwt += s.weight\nreturn mwt\ndef __str__(self):\nnucs = []\nfor s in self.sequence:\n\
  nucs.append(s.name)\nreturn \".join(nucs)\nListing 7-10\nNew parent class\n```\n\
  \n如果你查看`__init__`例程，你会看到我们像之前一样读取一个序列字符串，但现在我们实际上是逐个字母地循环遍历序列，并使用每个字母创建一个`DNANucleotide`类的新实例。然后我们将该新类实例追加到我们在实例化类时建立的一个列表中。因此，这个新类中的`sequence`字段不再只是一个字符串，而是一个类实例列表。\n\
  \n在我们继续讨论这个新类的其他细节之前，请花点时间思考一下，这里实际上发生了大量的类嵌入。我们不仅将`DNANucleotide`类作为字段嵌入到`NewDNASequence`类中，而且还使用\
  \ Python 的`list`类来存储`DNANucleotide`类的序列！\n\n让我们创建一个`NewDNASequence`类的实例并详细检查它（首先执行清单\
  \ 7-10 中的代码）。\n\n```\nmyDNASequence = NewDNASequence('My new DNA sequence','gctgatatc')\n\
  print(myDNASequence.sequence[0])\n\n```\n\n有趣！\n\n当我们尝试打印类`sequence`字段中的第一个元素时，我们没有得到一个字母，而是得到了\
  \ Python 用来表明你引用了一个类的那种打印表示——在这种情况下，是一个 ID 为`0x10cd7cf38`的`DNANucleotide`实例。不必过于担心这个\
  \ ID——它本质上只是 Python 在底层使用的一个指针，用于在代码需要引用该特定类实例时使用。换句话说，它告诉代码在遇到诸如`s.name`这样的引用时去哪里查找，其中`s`将是一个`DNANucleotide`的实例，例如\
  \ ID 为`0x10cd7cf38`。\n\n我们可以通过简单地打印列表中某个元素的实例字段来确认`myDNASequence`的`sequence`字段是一个`DNANucleotide`实例的列表，如下所示：\n\
  \n```\nprint(myDNASequence.sequence[0].name)\ng\nprint(myDNASequence.sequence[0].weight)\n\
  329.2\n```\n\n你会看到我们还向新类添加了一个`molecularWeight`方法，以表明计算分子量的功能现在已嵌入（或者如果你愿意，可以说是*固化*）到了`DNANucleotide`类中，我们不需要在代码中提供任何额外的核苷酸分子量表来访问此功能。请注意，我们不能真的在`DNANucleotide`类中编写`molecularWeight`方法，因为它只有在`DNANucleotide`实例序列的上下文中才有意义。然而，外层`NewDNASequence`类创建此方法所需的核心部分是由`DNANucleotide`类提供的。\n\
  \n```\nprint(myDNASequence.molecularWeight())\n2775.8\n```\n\n这是良好编码实践的一个重要方面，因为程序员称之为*可移植实现*。例如，另一个程序员可以获取你的`DNANucleotide`类，将其放入他们的代码中并使用，而无需担心依赖关系，例如需要一个与你的类代码兼容的、具有特定命名法和格式的核苷酸分子量表。\n\
  \n## 关于继承和重写继承方法的更多内容\n\n在我们结束关于 OOP 的这一章之前，我们希望你能回想起本章前面我们告诉你的，在底层，所有 Python 对象都自动且不可见地继承自一个名为`pyObject`的主\
  \ Python 类。\n\n这被证明在许多方面都非常有用，其中之一是 Python 的创建者可以使用`pyObject`来定义对所有 Python 对象通用的占位字段。这里有一个具体的例子。\n\
  \n当你使用 Python 的`print`命令时，它似乎会自动知道如何将任何类型的对象（从简单的整数或字符串到列表甚至类）的打印表示渲染到控制台输出流中。\n\
  \n尝试运行这段代码，你会明白我们的意思：\n\n```\na = 10\nb = 10.0\nc = 'DNA'\nd = [1,2,3,4,5]\nprint(a,\
  \ b, c, d)\n10 10.0 DNA [1, 2, 3, 4, 5]\n```\n\nPython 在这里使用的技巧是，每个对象中都有一个名为`__str__()`的特殊方法，当运行时，它会返回该类的字符串表示。当你编写自己的类时，此方法存在，但它将默认为从`pyObject`或超类（即直接或间接子类的类）继承的`__str__()`方法。例如，如果你创建自己的\
  \ Python 类，Python 不知道如何最好地使用`print`函数以有意义的形式将其实例渲染为文本，因此它默认为安全选项，实际上只是说：“**这是类 x\
  \ 的一个实例，其 ID 是 y**”。\n\n这里的技巧是，`print`函数运行对象的`__str__()`方法，以获取它需要写入 Python 控制台输出流的适当字符串表示。\n\
  \n更令人感兴趣的技巧是，作为程序员，如果你希望在`print`时获得不同的字符串表示，你可以[重写](https://en.wikipedia.org/wiki/Method_overriding)类的`__str__()`方法。要重写此（或任何）继承方法，你只需在类定义中提供你自己的版本即可。如果你回头看看我们为`NewDNASequence`编写的类定义，你会发现我们正是这样做的。\n\
  \n当我们为`DNANucleotide`类编写类定义时，我们没有费心去重写`__str__()`；因此，当我们尝试打印它时，我们得到了那种默认的“这是类 x\
  \ 的一个实例”消息以及类实例的 ID，如下所示：\n\n由于我们确实花时间在`NewDNASequence`类中提供了我们自己的`__str__()`版本，有效地重写了它从`pyObject`继承的通用类版本，我们将看到，如果我们尝试`print`一个`NewDNASequence`类的实例，我们会得到我们在重写的`__str__()`方法中指定的字符串表示——在本例中，是一个表示序列的字符串，如下所示：\n\
  \n```\nprint(myDNASequence)\ngctgatatc\n```\n\n这样就结束了我们对 Python 面向对象编程的介绍。在本书后面的章节中，我们将进一步基于这里提出的概念进行构建。不过，像往常一样，值得查看[官方\
  \ Python 文档](https://docs.python.org/2.7/tutorial/classes.html)^(⁸²)中关于类的部分。甚至超越\
  \ Python 编程语言，如果你真的想加深对面向对象编程的理解，值得阅读一本深入讨论 OOP 范式的优秀书籍（见下一节）。\n\n在下一章中，我们将更深入地探索基因组数据：研究如何使用\
  \ Python 分析由数十亿个“短序列”（有时称为下一代测序（NGS）数据）组成的大规模数据。\n\n参考资料与进一步探索\n\n\n\n-   Gamma、Helm、Johnson\
  \ 和 Vlissides 合著的 *《设计模式：可复用面向对象软件的基础》*^(⁸³) (Addison-Wesley, 1994)。这是一本关于不同形式面向对象模式的经典著作（因其四位作者常被称为“四人帮”）。\n\
  \n-   Harold Abelson、Gerald Jay Sussman 和 Julie Sussman 合著的 [*《计算机程序的构造和解释》*](https://www.amazon.com/Structure-Interpretation-Computer-Programs-Second/dp/0070004846)^(⁸⁴)\
  \ (MIT Press, 1996)。这本书堪称计算机科学领域的“圣经”。作者探讨了计算机编程工具，例如在计算机程序概念模型家族（面向对象编程便是其中一员）中使用的抽象和模块化。\n\
  \n## 脚注\n\n8.  基因组的剪切与拼接\n\n### 下一代测序流程\n\n![../images/476668_1_En_8_Chapter/476668_1_En_8_Figa_HTML.gif](img/476668_1_En_8_Figa_HTML.gif)\n\
