  \ 95%。\n\n就本书而言，我们并不特别讨论智能手机和平板电脑等移动平台。这些计算平台也有 Python 的一些发行版，但大多数还相对不成熟，而且无论如何，移动计算平台都带有触摸屏、加速度计和\
