  \n## 脚注\n\n## 19. 追溯生命足迹\n\n### 使用 Wright-Fisher 模型进行进化动力学分析\n\n![../images/476668_1_En_19_Chapter/476668_1_En_19_Figa_HTML.gif](img/476668_1_En_19_Figa_HTML.gif)\
