  \n*图灵斑图的元胞自动机模型*\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Figa_HTML.gif](img/476668_1_En_16_Figa_HTML.gif)\
  \ |\n *爱丽丝意识到她讨厌国王和王后让她整天玩的愚蠢游戏。*\n*“如果我们能使用同一个棋盘，但不必担心总有人要赢，那会怎样？”*\n*“是的，”她喃喃自语，“我只要让每个格子根据它的邻居是谁来改变颜色。然后，我就让它们随机初始，而不是摆成这种愚蠢的战斗阵型，”她开始大声说话，扔掉了她的权杖。*\n\
  *“那将会有一系列永无止境、不断变化的游戏，而不是这种对将死的痴迷，”她喊道，一边跳起来甩掉了他们强迫她戴上的不舒服的王冠。*\n*然后她听到国王和王后骚动起来，所以她迅速捡起她的王冠和权杖，坐回原位，叹了口气。*\
  \ |\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Figb_HTML.gif](img/476668_1_En_16_Figb_HTML.gif)\
  \ |\n **numpy** *二维数组*，`zeros()`，颜色映射，**matplotlib** `pcolor()` *，* `pause()` |\n\
  \n\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Figc_HTML.gif](img/476668_1_En_16_Figc_HTML.gif)\
  \ | *发育生物学，激活-抑制系统，图灵斑图，形态发生素，豹纹，形态发生，元胞自动机，斑马鱼* |\n\n对生物体发育这一神奇过程的定量研究由来已久。我们在上一章看到的\
  \ L 系统可追溯至 20 世纪 60 年代末，但这段历史远比那时更为久远。达西·汤普森早在 1917 年就撰写了经典著作[*论生长与形态*](https://en.wikipedia.org/wiki/On_Growth_and_Form)，远早于\
  \ 1953 年 DNA 双螺旋结构的发现。事实上，就在前一年——1952 年——英国计算机科学家艾伦·图灵发表了一篇论文，描述了一个试图回答以下问题的数学模型：豹子是如何长出斑点的？当然，图灵最为人熟知的是他在二战期间破解德国恩尼格玛密码机方面的贡献，以及他因\
  \ 20 世纪 50 年代对同性恋的彻底可耻迫害而英年早逝，但他对理论生物学的贡献同样意义重大。\n\n图灵想知道，一种在*单个细胞*水平上起作用的简单**化学机制**，是否能够产生动物身上观察到的*全局多细胞图案*，例如豹子复杂的皮毛图案和斑马的条纹。这与我们在上一章刚刚描述的\
  \ Lindenmayer 系统在概念上非常相似。图灵首先设想一个单一的***分化***细胞分泌*两种化学物质*，*或称为* ***形态发生素***，它们会扩散到该细胞的邻域，如图\
  \ 16-1 所示。\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Fig1_HTML.jpg](img/476668_1_En_16_Fig1_HTML.jpg)\n\
  \n**图 16-1** 图灵斑图背后的两种形态发生素的浓度梯度\n\n1. 一种**短程激活剂**，它从源细胞扩散出去，但会非常快速地（由于衰减）被清除，使得靠近细胞处活化剂浓度很高，而稍远一点则低得多。\n\
  2. 一种**长程抑制剂**，它也会从源细胞扩散出去，但清除速度要慢得多，因此靠近源细胞处其浓度低于活化剂，但在远离细胞的地方仍会持续存在。\n\n他进一步设想，激活和抑制形态发生素的*相对含量*将决定相邻细胞是否也会*分化*并开始*自身*分泌这两种形态发生素（这正是一开始将它们称为激活剂和抑制剂的原因）。二维空间中化学扩散过程的相互作用产生了与动物皮毛惊人相似的图案。图灵运用了一些高阶的偏微分方程来模拟这一过程，但幸运的是，我们有一种更简单、更具生成性的方法可以捕捉图灵所描述的本质动态，那就是[元胞自动机](https://en.wikipedia.org/wiki/Cellular_automaton)。元胞自动机（或称\
  \ **CA**）是一个*二维对象晶格*，通常被称为“元胞”，其状态通过一系列***更新规则***受其相邻“元胞”影响（更多内容我们将在第 18 章关于基于智能体建模的章节中讨论）。（请注意，称它们为“元胞”通常只是一个方便的比喻，但在我们特定的案例中，我们将其视为构成组织的多细胞基质中的*实际细胞*。）在模拟的每个时间步长中，CA\
  \ 中的每个元胞都会咨询其直接邻居，并根据这些邻居的状态作为函数来更新自身状态。这些更新规则构成了我们实现图灵扩散方案的核心。\n\n### 元胞自动机初始化！\n\
  \n像往常一样，让我们直接进入清单 16-1 中的 Python 代码，并在过程中解释其动态。\n\n```\nfrom numpy import zeros\n\
  from numpy.random import random, seed\nseed()\nprobability_of_black = 0.5\nwidth\
  \ = 100\nheight = 100\n## 初始化元胞自动机 (CA)\nCA = zeros([height, width])      # 主 CA\n\
  next_CA = zeros([height, width]) # 下一时间步的 CA\nactivator_radius = 1\nactivator_weight\
  \ = 1\ninhibitor_radius = 5\ninhibitor_weight = -0.1\ntime = 0\n```\n\n**清单 16-1**\
  \ 设置元胞自动机\n\n我们首先导入所需的 `numpy`（`zeros`）和 `numpy.random`（`random` 和 `seed`）库，然后设置随机种子。接着，我们通过\
  \ `probability_of_black` 定义了二维数组中任何给定元胞为**黑色**（即*已分化*）的概率。为了契合豹纹主题，我们设想所有非黑色元胞（即*未分化*的元胞）为**橙色**。然后我们创建*两个*二维元胞自动机：\n\
  \n1.  `CA` 是当前的元胞自动机状态：运行模型时，我们将*读取*这个元胞数组以进行更新。\n2.  `next_CA` 是*下一个*时间步的元胞自动机状态，在更新过程中，我们将*写入*这个元胞自动机。\n\
  \n\n\n### 以这种方式进行的更新有时被称为*同步*更新，因为每个元胞 CA 都是在*同一*时刻更新的。每个 CA 本质上是一个二维矩阵（也称为二维数组），我们使用\
  \ NumPy 库中的另一个功能[`zeros()`](http://docs.scipy.org/doc/numpy/reference/generated/numpy.zeros.html)来创建这些矩阵。\n\
  \n`zeros()`会创建空的*矩阵*，其维度由列表[`height`, `width`]指定。（这是一个非常有用的函数，因为它也可以用于创建一维*数组*，在后续章节存储大量绘图数据点时将派上用场。）\n\
  \n接下来，我们定义*激活剂*的*半径*（这对应于激活化学物质能够扩散的最大距离，默认我们将其设置为 1，因此只考虑最近的 9 个相邻元胞）以及该激活化学物质的*权重*。然后，我们定义最大的*抑制剂半径*（注意，这考虑了当前激活元胞周围\
  \ 5x5 网格内的所有元胞）以及抑制剂的*权重*（我们将其设为负值，以明确其与激活剂的作用方向相反）。最后，我们将`time`设置为零。\n\n接下来，我们通过循环遍历各个维度，并使用我们的老朋友`random()`函数，将每个元胞随机分配为分化或未分化状态，从而初始化`CA`。以下是清单\
  \ 16-2 中的代码片段。\n\n```\n## 初始化 CA\nfor x in range(width):\nfor y in range(height):\n\
  if random() < probability_of_black:\ncell_state = 1\nelse:\ncell_state = 0\nCA[y,\
  \ x] = cell_state\n清单 16-2\n初始化元胞自动机\n```\n\n按照惯例，我们将所有状态为`1`的元胞视为**黑色**（已分化），状态为`0`的元胞视为**橙色**（未分化）。图\
  \ 16-2 展示了一个随机初始化的元胞自动机。\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Fig2_HTML.jpg](img/476668_1_En_16_Fig2_HTML.jpg)\n\
  \n图 16-2\n随机初始化的元胞自动机\n\n## 创建更新规则\n\n所有设置都已完成，现在我们准备深入生物学的核心，并开始在`simulation_step`函数中实际模拟发育过程。基本思路与我们之前做的一样，遍历自动机网格中的每一个元胞，并决定每个元胞是分化还是去分化。清单\
  \ 16-3 展示了模拟步骤的函数。\n\n```\ndef simulation_step(CA, next_CA):\nfor x in range(width):\n\
  for y in range(height):\ncell_state = CA[y, x]  # 获取当前状态\nactivating_cells = 0\n\
  inhibiting_cells = 0\n### 统计半径内的抑制细胞数量\nfor xpos in range(- inhibitor_radius, inhibitor_radius\
  \ + 1):\nfor ypos in range(- inhibitor_radius, inhibitor_radius + 1):\ninhibiting_cells\
  \ += CA[(y+ypos)%height, (x+xpos)%width]\n### 统计半径内的激活细胞数量\nfor xpos in range(-\
  \ activator_radius, activator_radius + 1):\nfor ypos in range(- activator_radius,\
  \ activator_radius + 1):\nactivating_cells += CA[(y+ypos)%height, (x+xpos)%width]\n\
  ### 如果加权后的激活细胞数量大于邻域内的抑制细胞数量\n### 则诱导当前细胞分化\nif (activating_cells * activator_weight)\
  \ + (inhibiting_cells * inhibitor_weight) > 0:\ncell_state = 1\nelse:\ncell_state\
  \ = 0\n### 现在更新状态\nnext_CA[y, x] = cell_state\nreturn next_CA\n清单 16-3\n用于将元胞自动机推进一个时间步的模拟函数\n\
  ```\n\n第一部分相当直接：我们遍历元胞自动机网格的`x`和`y`坐标，并检索当前在 x 和 y 位置的`cell_state`。接下来的两个（内部）for\
  \ 循环是抑制和激活*作用*于当前元胞的地方。我们来分解一下：\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Fig3_HTML.jpg](img/476668_1_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3\n抑制范围\n\n1.  ***抑制循环***：第一个循环检查当前元胞`inhibition_radius`半径内的所有元胞。此循环统计那些显示为**黑色**的元胞——即那些当前具有化学抑制剂且距离当前元胞足够近以影响它的元胞。该邻域内黑色元胞越多，对当前元胞的抑制影响就越大（倾向于将其关闭为**橙色**状态）。让我们以图\
  \ 16-2 中的原始 CA 为例，并高亮显示可能对抑制产生贡献的元胞，用浅蓝色叠加表示，此时`inhibition_radius`为 5，如图 16-3 所示。\n\
  \n在这个特定示例中，有*六个*元胞会影响当前元胞的状态，因此在此时间步中，`inhibiting_cells`将被设置为 6。\n\n2.  ***激活循环***：类似地，第二个循环检查当前元胞`activator_radius`半径内的所有元胞，如图\
  \ 16-4 中的浅红色所示。\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Fig4_HTML.jpg](img/476668_1_En_16_Fig4_HTML.jpg)\n\
  \n图 16-4\n激活剂范围\n\n同样，该邻域内黑色元胞越多，激活化学物质对当前元胞的影响就越大，但与之前的情况相反，它倾向于激活元胞，从而使其变为**黑色**。在前面的例子中，我们有两个元胞，因此`activating_cells\
  \ = 2`。\n\n3.  ***决策***：两个循环之后的最后一步是决定该元胞应该变成橙色还是黑色。我们在代码中通过计算激活元胞的加权和并将其与抑制元胞的加权和相加来实现这一点。在我们的代码示例中，这个和为\n\
  \n`(2 x 1) + (-0.1 x 6) = 2 - 0.6 = 1.4 > 0`\n\n由于在此示例中该和为正，因此有足够的激活剂导致元胞变为**黑色**，从而将`cell_state`设置为\
  \ 1。如果该和为负，则将其设置为 0。从生物学上讲，这实现了图灵形态发生模型的主要特征：如果邻域内激活化学物质在总体上多于抑制化学物质，那么细胞就会分化，否则就会去分化。\n\
  \n4.  ***更新***：好了，我们快要（但还没有！）完成了。我们必须将输出*写入*到`next_CA`元胞自动机中相应的位置。这是一个关键点：在更新所有元胞之前，我们不能写入原始的`CA`网格，否则就会出现计算机科学家喜欢称之为“[***竞态条件***](https://en.wikipedia.org/wiki/Race_condition)”的问题。\n\
  \n5.  ***返回新的 CA***：一旦所有元胞都被更新，我们就得到了刚刚写入的`next_CA`，`simulation_step`所做的最后一件事就是将此`next_CA`返回给主程序。我们将在下一节中处理实际的更新。\n\
  \n![../images/476668_1_En_16_Chapter/476668_1_En_16_Figd_HTML.jpg](img/476668_1_En_16_Figd_HTML.jpg)\n\
  \n## 生成元胞自动机斑纹图案\n\n现在我们准备绘制模拟的输出并运行一些形态发生过程！我们可以使用清单 16-4 中的`matplotlib`技能。\n\n\
  ```\n### 创建绘图\nfig1 = plt.figure()\n### 按时间循环\nfor time in range(10):\nplt.pcolor(CA,\
  \ vmin = 0, vmax = 1, cmap = \"copper_r\")  # 绘制当前 CA\nplt.axis('image')\nplt.title('时间:\
  \ ' + str(time))\nplt.draw()\nplt.pause(0.5)\nCA = simulation_step(CA, next_CA)\
  \  # 推进模拟\n清单 16-4\n使用 matplotlib 可视化形态发生过程\n```\n\n\n\n和往常一样，我们使用 `figure()` 函数设置图形，然后循环执行模型的十个时间步，每次都绘制一个新图形。对于图形本身，我们使用\
  \ matplotlib 的 [`pcolor`](http://matplotlib.org/examples/pylab_examples/pcolor_demo.html)\
  \ 函数；该函数接收一个 NumPy 数组和一个特定的颜色映射 (`cmap`)，用于绘制元胞自动机状态的热力图。我们使用的特定颜色映射是 \"`copper_r`\"\
  ，其颜色范围从橙色到黑色，你猜对了，它能呈现豹纹图案。由于我们的 CA 只有两种状态：当元胞状态为 0 时显示为**橙色**，当状态为 1 时显示为**黑色**。\n\
  \n接着调用 `axis()`、`title()`、`draw()` 和 `pause()` 函数。请注意，我们使用了 `draw()` 命令后跟 `pause()`\
  \ 命令，而不是之前示例中使用的 `show()`，因为后者会导致代码停止。这样，模拟中每个时间步的当前 CA 会显示 0.5 秒，然后才进入下一个时间步。在\
  \ for 循环结束时，进入下一个时间步之前，我们调用 `simulation_step()` 函数。这里，我们将当前的 `CA` 和 `next_CA` 作为函数参数传递。至关重要的是，我们将\
  \ `simulation_step` 的结果重新赋值给 `CA`。*这*就是我们之前提到的同步更新步骤，将接力棒传递给下一个时间步：*已写入的*现在变成了*待读取的*。\n\
  \n## 形态发生实战\n\n让我们看看实际效果…. 我们从 `t=0` 时刻一个黑白元胞数量相等的随机网格开始。你可以在图 16-5 中看到，即使在第一个 `t=1`\
  \ 时间步，结构就已经开始显现。\n\n![../images/476668_1_En_16_Chapter/476668_1_En_16_Fig5_HTML.jpg](img/476668_1_En_16_Fig5_HTML.jpg)\n\
  \n**图 16-5** 形态发生模拟的前两个时间步\n\n如图 16-6 所示，到了 `t=2` 时刻，我们已经能看到那些豹纹裤了！而到 `t=5` 时刻，图案已经稳定下来。\n\
  \n![../images/476668_1_En_16_Chapter/476668_1_En_16_Fig6_HTML.jpg](img/476668_1_En_16_Fig6_HTML.jpg)\n\
  \n**图 16-6** 形态发生模拟的后续时间步\n\n我们鼓励你尝试调整网格大小以及激活剂和抑制剂强度的相对半径和权重，以生成你自己的皮毛图案。你可以在本书附带的代码下载或我们的\
  \ GitHub 站点中（如第 1 章所述），找到将清单 16-1 至 16-4 合并为单个文件的完整代码。大约此时，经验丰富的实验室生物学家可能会想，这一切似乎有点*抽象*。真正的胚胎并非在这些离散的时间步中发育，而且在自然界中，有没有真实的细胞分泌化学物质并以某种方式相互作用的例子呢？\n\
  \n历史的转折点发生在 2012 年，整整 60 年后，一个研究团队发表了一篇论文（Müller, 2012），在[斑马鱼胚胎](https://en.wikipedia.org/wiki/Zebrafish)中实验性地验证了图灵机制。他们成功识别并量化了斑马鱼胚胎模式生成过程中与图灵提出的机制相对应的两种形态发生素，并测量了可映射回原始方程的速率常数。他们还构建了一个模型（比这里介绍的稍复杂），该模型重现了实验生物体中发现的图案，从而弥合了理论预测与实验验证之间的鸿沟。\n\
  \n尽管此处的 CA 模型仍然是对原始图灵方程的一种近似，并且冒着再次唠叨的风险，但它表明，即使是用几行 Python 代码实现的简单模型，也能成为培养对发育生物学基本过程直觉的有力工具。计算发育生物学已成为一个活跃的研究领域；请参阅本章以及第\
  \ 15 章的参考文献。\n\n现在，我们将从探讨*个体内部*发生的发育等生物过程，转向接下来的几章（第 17–19 章），这些章节将专门介绍如何使用 Python\
  \ 以计算方式探索*多个生物体种群*的动态。\n\n## 参考文献与延伸阅读\n\n* James D. Murray (1988). [豹子是如何获得斑点的。](http://www.math.ttu.edu/%257Elallen/murray_SciAm.pdf)\
  \ *科学美国人*, **258**, 80–87\n* Turing (1952). [形态发生的化学基础。](http://rstb.royalsocietypublishing.org/content/237/641/37)\
  \ *伦敦皇家学会哲学汇刊 B：生物科学*, **237**, 37–72\n* Forgacs and Newman, [*发育胚胎的生物物理学*](https://www.cambridge.org/catalogue/catalogue.asp%253Fisbn%253D9780521783378)\
  \ (剑桥大学出版社, 2005)\n* Müller *等* (2012). [Nodal 和 Lefty 的差异扩散性是反应-扩散模式形成系统的基础。](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3525670/)\
  \ *科学*, **336**, 721–724\n\n## 脚注\n\n17. 狐狸看管鸡舍\n\n*基于捕食者-猎物动态的生态建模*\n\n![../images/476668_1_En_17_Chapter/476668_1_En_17_Figa_HTML.gif](img/476668_1_En_17_Figa_HTML.gif)\
  \  \n*“假海龟，你为什么哭？”爱丽丝问道。*  \n*“你知道成为被猎食的各种动物的混合体是什么滋味吗？”假海龟凄惨地抽着鼻子说。“有人想吃我的肉，还有巨大的饥饿海鸟，如果我不留神，它们会从水边把我抓走当点心。”*\
  \  \n*“听起来太可怕了，”爱丽丝同情地说。*  \n*“哼，作为一个神话般的杂交生物，我得说，我从不觉得被拼凑起来有什么困扰，”格里芬以他最不屑和高傲的语气高谈阔论道。*\
  \  \n*“你说得倒轻巧，”假海龟反驳道，“你是那种不用担心自己会成为谁午餐的捕食者的组合！”*  \n*“哼，那就请原谅我不是食物链底层的住户了！”格里芬气呼呼地说。*\
  \  \n*“嗜血的野兽！”假海龟厉声说道。*  \n*“行走的沙拉吧！”格里芬回击道。*\n\n![../images/476668_1_En_17_Chapter/476668_1_En_17_Figb_HTML.gif](img/476668_1_En_17_Figb_HTML.gif)\
  \  \n**max()**, **matplotlib.animation**, 元组解包, **numpy**\n\n![../images/476668_1_En_17_Chapter/476668_1_En_17_Figc_HTML.gif](img/476668_1_En_17_Figc_HTML.gif)\
  \  \n生态学, 生态系统, 种群动态, 繁荣-萧条, 离散模型, 捕食者-猎物, 承载力, 状态空间, Lotka-Volterra 模型\n\n\n\n"
- "# 生态系统与种群动态的 Python 建模\n\n## 从个体到生态系统\n\n从个体生物体向上一个层级是[生态系统](https://en.wikipedia.org/wiki/Ecosystem)：生物体之间以及与其环境的相互作用。在任何真实的生态系统中，任何物种的个体数量都在不断变化，因为个体会出生和死亡。显然，任何生物种群的增长也受到可用资源数量的限制，并最终受到一个理论上限的限制——这个界限被称为“[承载能力](https://en.wikipedia.org/wiki/Carrying_capacity)”。如果这些“资源”恰好是另一个物种，那么对该物种来说就更糟糕了。虽然“大自然，血淋淋的爪牙”这句古老格言过于简化，但在许多情况下，“猎物”物种数量的增加可能意味着“捕食者”的更多晚餐。然而，这种情况是双向作用的：如果捕食者开始吃光所有猎物，那么捕食者可能就得节食了，以免它们自己开始挨饿。\n\
  \n## 种群动态学\n\n[种群动态学](https://en.wikipedia.org/wiki/Population_dynamics)是研究物种相互作用以及种群增长和变化的领域。种群动态建模的相关性已超出其起源于生物体生态学的范畴（尽管在那里仍然非常重要！），扩展到了细胞或分子水平的种群动态研究，例如癌症和病毒等传染病。因此，所有领域的生物学家都最好多了解种群动态学。种群动态学在生物学之外也有许多应用，从经济泡沫的增长和破裂到社交网络的兴起（和衰落）。当你开始环顾四周，观察事物如何兴衰（从你最喜欢的乐队开始），以及可能如何再次流行时，可以确信某种形式的种群动态学在驱动着这一切。\n\
  \n`Python` 再次非常适合用优雅简洁的代码帮助您建模和可视化种群动态。生态模型的核心是“[捕食者-猎物](https://en.wikipedia.org/wiki/Lotka%25E2%2580%2593Volterra_equations)”的概念：一个单一的**捕食者**物种和一个单一的**猎物**物种。虽然这对于包含许多物种的完整生态系统来说可能是一个过于粗略的简化，但捕食者-猎物模型的基本结构可以被视为更复杂模型的良好概念性“构建块”。完整生态系统中的许多动态都可以在捕食者-猎物模型中以缩影的形式重现。\n\
  \n## 建模实例：鸡与狐狸\n\n那么，让我们直接想象一个种群：后院里的一群**鸡**正受到附近树林里露营的**狐狸**种群的捕食。我们在清单 17-1 中建立模型，通过使用\
  \ `Python` 的 `NumPy` 数组追踪在指定代数内两个物种的数量。为了代码简洁，我们使用 `\"Ch\"` 代表鸡，`\"Fx\"` 代表狐狸。\n\
  \n这里我们使用 `NumPy` 的 `zeros()` 函数（我们在第 [16] 章(#476668_1_En_16_Chapter.xhtml)首次遇到）创建存储每个时间点物种数量的数组。与之前使用\
  \ `zeros` 的主要区别在于，我们现在创建的是**一维数组**而不是**二维数组**，这只需要一个**单个整数**参数，而不是**维度列表**。\n\n\
  ```\nimport numpy as np\ngenerations = 5000\n### setup empty arrays\nCh = np.zeros(generations+1)\n\
  Fx = np.zeros(generations+1)\n### initialize the population\nCh[0] = 100.0\nFx[0]\
  \ = 10.0\nb_Ch = 0.5   # prey birth rate\nd_Ch = 0.015 # predation rate (death rate\
  \ of prey)\nb_Fx = 0.015     # predator birth rate\nd_Fx = 0.5       # predator\
  \ death rate\n### set parameters\ndt = 0.01   # scale parameters so that timestep\
  \ doesn't \"jump\"\nfor t in range(0, generations):\nCh[t+1] = Ch[t]        + dt\
  \ * (b_Ch * Ch[t]  - d_Ch * Fx[t] * Ch[t])\nFx[t+1] = Fx[t]        + dt * (-d_Fx\
  \ * Fx[t]   +  b_Fx * Fx[t] * Ch[t])\nListing 17-1\nInitializing and running the\
  \ chicken and foxes ecological model\n```\n\n我们首先创建数组并初始化种群规模。接下来，我们设置模型的其他参数。首先，我们定义一些参数来控制捕食者和猎物的**出生**率（以\
  \ `\"b_\"` 为前缀）或**死亡**率（以 `\"d_\"` 为前缀）。该模型使用了我们在第 [13] 章(#476668_1_En_13_Chapter.xhtml)首次介绍的离散时间步长。这符合我们使用直接模拟方法介绍问题的理念。因此，我们需要引入一个时间步长大小——`dt`——其缘由稍后将解释。\n\
  \n在清单 17-1 的末尾，我们运行模型，您会注意到它的代码只有***三行***！这就是整个模型。然后我们只需循环经过代数，每一代（`t+1`）根据前一代（`t`）的值进行更新。对于鸡和狐狸，我们从每个物种的当前数量开始，然后对每个物种的该数量进行**增加**（通过出生）和**减少**（通过死亡）。\n\
  \n鸡的***出生数量***（方程中的第一项 `b_Ch * Ch[t]`）仅取决于当前鸡的数量（这假设有无限的食物）。然而，鸡的***死亡数量***取决于狐狸的数量：捕食者越多，鸡的死亡就越多……哦，太可怕了，太可怕了！这意味着对于鸡的死亡，两个物种的数量之间将存在一个*交互项*；因此，我们将死亡率（`d_Ch`）乘以当前的狐狸数量（`Fx[t]`）和当前的鸡的数量（`Ch[t]`）。\n\
  \n狐狸的情况则完全相反。狐狸会以其自然率***死亡***（除了那些讨厌的鸡，没有其他东西能让这些狐狸活着！）；因此，我们将 `d_Fx` 乘以 `Fx[t]`。但是新狐狸的***出生***率将取决于周围猎物的数量，所以在这种情况下，我们将狐狸的出生率（`b_Fx`）乘以狐狸的数量（`Fx[t]`）和鸡的数量（`Ch[t]`）。\n\
  \n为了百分之百明确总和的每个部分意味着什么，我们在代码中添加了注释：\n\n```\nfor t in range(0, generations):\n###\
  \ old prey   +   newly born prey   -  killed prey\nCh[t+1] = Ch[t]        + dt *\
  \ (b_Ch * Ch[t]  - d_Ch * Fx[t] * Ch[t])\n### old predators   -  predator death\
  \   +  births of predators\nFx[t+1] = Fx[t]        + dt * (-d_Fx * Fx[t]    +  b_Fx\
  \ * Fx[t] * Ch[t])\n```\n\n![../images/476668_1_En_17_Chapter/476668_1_En_17_Figd_HTML.jpg](img/476668_1_En_17_Figd_HTML.jpg)\n\
  \n如前所述，最后一个复杂之处在于，因为我们使用的是***离散***时间间隔，所以引入了时间步长：`dt`。这通过相关的时间尺度（每一代可能代表一个更小的时间步长）来缩放新生和死亡的数量，这就是为什么它位于前面代码中括号外面的原因，并确保模拟数字平滑变化。\n\
  \n## 观察繁荣与萧条\n\n现在模拟的艰巨工作已经完成。与前面章节一样，在清单 17-2 中，我们转向使用 **matplotlib** 来绘制输出结果。\n\
  \n\n\n```python\n### do the plotting\n### get the maximum of the population so we\
  \ can scale window properly\npopMax = max(max(Fx), max(Ch))\nfig1 = plt.figure()\n\
  plt.xlim(0, generations)\nplt.ylim(0, popMax)\nplt.xlabel('time')\nplt.ylabel('population\
  \ count')\ntime_points = list(range(generations + 1))\nplt.plot(time_points, Fx,\
  \ label=\"Foxes\")\nplt.plot(time_points, Ch, label=\"Chickens\")\nplt.legend()\n\
  plt.draw()\nplt.show()\n```\n*清单 17-2* 使用 matplotlib 绘制模拟输出\n\n完整的代码如清单 17-3 所示。\n\
  \n```python\nimport numpy as np\nfrom matplotlib import pylab as plt\nimport matplotlib.animation\
  \ as animation\ngenerations = 5000\n### setup empty arrays\nFx = np.zeros(generations+1)\n\
  Ch = np.zeros(generations+1)\n### initialize the population\nCh[0] = 100.0\nFx[0]\
  \ = 10.0\n### set the parameters\ndt = 0.01     # scale parameters so that each\
  \ timestep doesn't \"jump\"\nb_Ch = 0.5    # prey birth rate\nd_Ch = 0.015  # predation\
  \ rate (death rate of prey)\nb_Fx = 0.015  # predator birth rate\nd_Fx = 0.5   \
  \ # predator death rate\n### run predator-prey!\nfor t in range(0, generations):\n\
  ### old prey + newly born prey - killed prey\nCh[t+1] = Ch[t] + dt * (b_Ch * Ch[t]\
  \ - d_Ch * Fx[t] * Ch[t])\n### old predators - predator death + births of predators\n\
  Fx[t+1] = Fx[t] + dt * (-d_Fx * Fx[t] + b_Fx * Fx[t] * Ch[t])\n### do the plotting\n\
  ### get the maximum of the population so we can scale window properly\npopMax =\
  \ max(max(Fx), max(Ch))\nfig1 = plt.figure()\nplt.xlim(0, generations)\nplt.ylim(0,\
  \ popMax)\nplt.xlabel('time')\nplt.ylabel('population count')\ntime_points = list(range(generations\
  \ + 1))\nplt.plot(time_points, Fx, label=\"Foxes\")\nplt.plot(time_points, Ch, label=\"\
  Chickens\")\nplt.legend()\nplt.draw()\nplt.show()\n```\n*清单 17-3* 模型与可视化的完整代码\n\n\
  运行清单 17-3 中的代码，应生成类似于图 17-1 的输出，展示出鸡和狐狸种群开始相互影响时产生的多个周期。请注意，当鸡的数量从初始的 100 只开始增加时，狐狸的数量也随之迅速增长，因为周围有更多美味的猎物！这导致鸡的数量在大约\
  \ 120 只时停止增长，并开始下降。然而，由于美味的鸡数量减少，狐狸的生存变得困难，这为鸡种群的恢复提供了时间，于是周期再次开始。\n\n![../images/476668_1_En_17_Chapter/476668_1_En_17_Fig1_HTML.jpg](img/476668_1_En_17_Fig1_HTML.jpg)\n\
  \n*图 17-1* 捕食者-猎物模型的可视化\n\n图 17-1 展示了大多数捕食者-猎物模型中出现的经典繁荣与衰退的循环模式，两个物种在此过程中持续“共舞”。该模型已广泛应用于病毒种群等其他生物实体，并在生物学之外的领域也有应用。这种循环模式让人不禁思考：相比两条上下波动的时序曲线，是否还有更好的方式来展示其中的动态？\n\
  \n## 动画化捕食者-猎物模型\n\n答案是肯定的！因为这是一个[动力系统](https://en.wikipedia.org/wiki/Dynamical_system)的实例，可以看作是在二维[状态空间](https://en.wikipedia.org/wiki/State_space)中移动的一个点。系统随时间在该空间中经过的路径被称为**轨迹**。系统起始位置不同，所遵循的轨迹也会不同。\n\
  \n![../images/476668_1_En_17_Chapter/476668_1_En_17_Fige_HTML.jpg](img/476668_1_En_17_Fige_HTML.jpg)\n\
  \n**matplotlib**库再次提供了解决方案，通过使用其动画子包（这一点我们在清单 17-3 的导入语句中已有所暗示）。有关动画包的更多详细信息，请参阅\
  \ matplotlib 文档^(²¹³)。\n\n```python\nfig2 = plt.figure()\nplt.plot(Ch, Fx, 'g-',\
  \ alpha=0.2)  # state space\nplt.xlabel('Chickens (prey population size)')\nplt.ylabel('Foxes\
  \ (predator population size)')\nline, = plt.plot(Ch[0], Fx[0], 'r.', markersize=10)\
  \ # draw point as red\ndef init():\nline.set_data([], [])  # set empty data\nreturn\
  \ line,\ndef animate(i):\nline.set_xdata(Ch[i])\nline.set_ydata(Fx[i])\nreturn line,\n\
  ani = animation.FuncAnimation(fig2, animate, range(0, len(time_points)), init_func=init,\
  \ interval=25, blit=False)\nplt.show()\n```\n*清单 17-4* 状态空间的动画化\n\n让我们逐步分析这段代码。我们首先像之前一样设置总图，然后绘制状态空间。这相当简单：我们只是将鸡的数量（`Ch`）与狐狸的数量（`Fx`）进行绘图，而不是作为时间的函数。`'g-'`表示一条实心（**-**）绿色（`g`）线，`alpha`设置线条的透明度，使其看起来略微淡化。随后添加坐标轴标签。为了在状态空间图上添加轨迹的初始点，我们绘制第一个时间点，即\
  \ x-y 坐标：`Ch[0]`、`Fx[0]`，具体如下：\n\n```python\nline, = plt.plot(Ch[0], Fx[0], 'r.',\
  \ markersize=10)\n```\n\n但将结果赋值给变量`points`需要进一步说明。`plot`命令总是返回一个元组（关于元组的更多信息，请参见第\
  \ 3 章），其中包含图中所有线条的列表。由于这个特定绘图只有*一条*线，我们对`line`进行所谓的**元组解包**，以获取列表中的*第一个*元素（更多详情，请参阅\
  \ matplotlib 文档中的教程^(²¹⁴)）。\n\n然后，我们设置两个辅助函数来实现动画：\n\n1.  `init()` 创建动画将“静止”的基础帧，返回一个可由下一个函数更新的线条对象。\n\
  \n2.  `animate()` 接受一个整数 **i** 作为输入，代表模拟的当前时间步。此函数更新`init()`函数中创建的`line`帧，从而通过使用`set_xdata`和`set_ydata`函数移动红点，更新系统在整个状态空间中的位置。\n\
  \n最后一步通过调用`animation.FuncAnimation`并传入参数：`fig2`、动画将运行的`time_points`范围（实质上是让红点穿过状态空间），以及前文所述用于初始化和更新动画的两个函数，来*运行*动画。最后调用`plt.show()`显示图形。\n\
  \n如果你获取清单 17-3 中的完整代码，并将清单 17-4 中的代码附加到其后，然后运行它。它应该会生成一个类似于图 17-2 中所示的图形，只是红点将从底部中间开始，并向外螺旋移动。现在，我们可以一目了然地看清系统的循环性质，完整地观察整个轨迹。\n\
  \n![../images/476668_1_En_17_Chapter/476668_1_En_17_Fig2_HTML.jpg](img/476668_1_En_17_Fig2_HTML.jpg)\n\
  \n*图 17-2* 鸡和狐狸状态空间的可视化\n\n\n\n敏锐的读者可能会注意到，轨迹是不稳定的，也就是说，它不会收敛到一个稳定的圆，而是在每次迭代中开始略微向外螺旋。如果增加迭代次数，你会发现螺旋会向外扩展得更远（相应地，时间序列图中的幅度也会增加）。这种不稳定性是由于我们处理的是*离散*时间步长，这隐式地在模拟中引入了*时间滞后*。可以通过使`dt`参数更小来减少这种滞后，从而减少时间延迟并使模拟更平滑。但要做到这一点，需要转向使用[Lotka-Volterra\
  \ 微分方程](https://en.wikipedia.org/wiki/Lotka%25E2%2580%2593Volterra_equations)的*连续*版本模型，我们在参考章节中链接了一个使用`SciPy`库求解这些方程的示例。\
  \  \n下一章建立在使用整数个体数量进行种群动态建模的概念之上，但更进一步：将***个体本身***建模为离散、唯一的智能体。\n\n## 参考文献与进一步探索\n\
