  \n实际上，它们是伪装的**字符串**^(⁶¹)，证明这一点的方法之一是，当我们把每一行打印到屏幕时，它包含了所谓的*换行*符。不，这并不是地铁线路的终点站（比如我们美丽家乡波士顿^(62)\
  \ 红线上的 Alewife 或 Braintree）。它是一个*不可见字符*，告诉计算机该行的字符已经处理完毕，可以开始下一行了。这就是为什么输出行的每一行之间都有一个空行，而原始文件中却没有。\n\
