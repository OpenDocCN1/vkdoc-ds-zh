  \ 发行版。如果你对使用 Python 进行移动计算感兴趣，不妨看看非常有趣的 Kivy^(¹⁷) Python 平台。\n\n等等——Python 不止一种？\n\
  \n此时，有必要对现有的不同 Python 版本稍作说明。需要明确的是，我们这里讨论的并不是所有替代官方发行版的那些 Python 变体和实现。我们只讨论可以在\
  \ [Python 网站](https://www.python.org/)^(¹⁸) 上找到的官方 Python 发行版。\n\n早在 2008 年，Python\
  \ 的一个新的主要版本，3.0 版，就发布了。它包含了一些（很大程度上是细微的）语言更改，不幸的是，这些更改破坏了 Python 与许多人在代码中使用的众多流行代码库的兼容性。这对科学和技术社区的影响尤其大，因为其中一些库（如\
  \ [`NumPy`](http://www.numpy.org/) ^(¹⁹)) 是全世界 Python 社区所使用的大量科学和技术 Python 代码的核心组件。\n\
  \n因此，最初很大一部分 Python 社区成员迟迟不愿采用任何 3.x 版本的官方 Python 发行版，而是更愿意停留在最后一个官方 Python 2.x\
  \ 版本，即 Python 2.7 上。然而，随着 Python 2.7.x 在 2020 年被逐步淘汰，大多数坚持使用旧版本的用户要么已经转换，要么计划在淘汰日期之前转换（在第一版中，我们也是那些坚持者之一——现在不了——这应该会让\
  \ [Guido](https://en.wikipedia.org/wiki/Guido_van_Rossum) 感到高兴）。\n\n**归根结底，本书中的\
  \ Python 代码现在已移植到使用 Python 3。** **随着 Python 2.7 即将停止支持，读者应下载并使用 Python 3 来编写和运行本书中介绍的代码。**（如果你碰巧已经学过\
  \ Python 2.x，那么从 Python 3.x 开始迁移是一个渐进的过程，主要涉及学习这两个主要版本之间一些细微的语法和行为差异。）\n\n如果你足够好奇，想了解更多关于\
  \ Python 版本分支的信息，在官方 Python 网站上甚至[有一个专门讨论这个问题的页面](https://wiki.python.org/moin/Python2orPython3)。该页面反映的官方观点是，现在每个人都应该使用\
  \ Python 3.x，尤其是因为许多最重要且广泛使用的第三方代码库现在都已更新以支持它。不过，也承认在本书撰写之时，并非所有这些问题都已解决，并且仍然有一些人出于合理的原因继续使用\
  \ Python 2.x。\n\n## 为你的电脑下载 Python 发行版\n\n**先别**这样做！\n\n我们是认真的——真的——**别**这样做！\n\n\
  你的机器上很可能已经有一个 Python 发行版了，尤其是如果你使用的是 Mac 或 Linux 机器。所以，在**贸然**从官方 Python 网站下载 Python\
  \ 之前，请务必查看以下部分，它们描述了在你的电脑上获得可用 Python 发行版的最佳途径。如果阅读了适用于你电脑类型（或者如果你的电脑不属于这里描述的三种主要台式机/笔记本电脑平台）的部分后，你认为确实需要下载并安装一个\
