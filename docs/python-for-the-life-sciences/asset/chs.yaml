  \ | *本章没有太多生物学内容* |\n\n## 在你的电脑上获取 Python\n\n对于本书的读者来说，这显然是第一步，这样才能运行你的 Python 代码。至于代码编辑，有很多选择，包括使用你可能已经在电脑上拥有的纯文本编辑器。这绝非最佳方案，但在我们处理了在电脑上真正获取\
  \ Python 发行版的主要问题之后，我们将进一步讨论你可能想要用来编辑和管理 Python 代码的工具。\n\n为了便于讨论，我们假设你的电脑是运行苹果 [macOS](https://en.wikipedia.org/wiki/MacOS)\
  \ 操作系统的 Apple Mac，或采用 PC 架构、运行微软 [Windows](https://en.wikipedia.org/wiki/Microsoft_Windows)\
