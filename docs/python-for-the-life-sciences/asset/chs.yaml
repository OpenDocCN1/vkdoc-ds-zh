  \ |  \n*微孔板布局与物理尺寸、二维坐标系、步进电机、机器人、热图、光密度*\n\n我们已经探讨了如何将微孔板作为虚拟对象来处理，现在来看一下如何将其作为物理（及视觉）对象来操作。实验室微孔板检测是许多人构建基于实验室自动化和机器人的[高通量](https://en.wikipedia.org/wiki/High_throughput_biology)流程的热门目标，目前已有大量实验室仪器和机器人能够自动在多孔板中设置实验、监控实验过程并读取数据。要实现这些功能，所使用的计算机驱动设备需要某种形式的微孔板物理映射。\n\
  \n## 物理映射微孔板\n\n我们将用于物理映射多孔板的简单方案如下图所示，并做出以下假设。第一个孔——在我们三种坐标系中称为 **1**、**(1,1)**\
  \ 或 '**A01**'——位于微孔板的左上角。我们将微孔板的左上角选为二维物理坐标系的原点，该坐标系将用于在板上导航。微孔板具有从左到右轴 **x** 定义的宽度和从上到下轴\
  \ **y** 定义的高度，这些轴界定了板的边缘。你会注意到，由于我们将物理坐标系的原点定义为微孔板的左上角，随着行号递增，我们在 **y** 方向上是向下移动的。最左侧列孔相对于板左边缘的位置可由\
  \ **xb**（**x** 方向上的偏移量）定义。类似地，最顶部行孔相对于板上边缘的位置可由 **yb**（**y** 方向上的偏移量）定义。每个孔的内径由参数\
  \ **d** 定义。假设孔的间距在水平和垂直方向上相等，并由单一参数 **p** 表示。\n\n对于真实的微孔板，这些假设不一定全部成立，但为了演示微孔板的物理映射方法，这个非常简单的方案已经足够。如果真实微孔板的物理布局更为复杂，例如孔的水平和垂直间距不相等，则需要更多参数来描述。在板上进行物理导航所需的计算也会更复杂。\n\
  \n![../images/476668_1_En_10_Chapter/476668_1_En_10_Fig1_HTML.jpg](img/476668_1_En_10_Fig1_HTML.jpg)\n\
  \n**图 10-1** 96 孔板的物理布局\n\n不过，其原理本质上与我们在此描述的简单方案相同。我们在微孔板上确定一个或多个参考点，并据此描述孔的布局。在继续之前，值得花时间仔细查看图\
  \ 10-1 中我们简单物理微孔板方案的示意图，因为它解释了我们将在本节中使用的大量代码。\n\n现在，让我们向 `Plate` 类添加一个 `definePhysicalMap`\
  \ 方法，该方法定义了为自动化及可视化目的所需的微孔板物理布局。从该方案可以看出，我们的方法需要将方案中的每个参数作为参数接收。我们将让 `definePhysicalMap`\
  \ 方法使用这些参数来计算并存储板上所有孔的物理位置，以供后续使用。我们还将使用此方法初始化自动化代码，生成板上一个与机械臂或仪器读头的默认初始化位置相对应的起始位置。我们将这个初始化位置（任意地）设定在坐标\
  \ `(0,0)`，即微孔板的左上角，之后机器人或仪器的所有移动都将以该起始位置为参考。\n\n那么物理坐标系的单位呢？在编写代码时，我们实际上不需要在 `definePhysicalMap`\
  \ 中指定一组距离单位。这是因为我们将完全以机器人或仪器移动所使用的任何单位制来工作。对于通常驱动机器人或仪器上移动传感器的计算机控制[步进电机](https://en.wikipedia.org/wiki/Stepper_motor)，其步长通常以旋转角度的若干分之一来精确定义。\n\
  \n![../images/476668_1_En_10_Chapter/476668_1_En_10_Figd_HTML.jpg](img/476668_1_En_10_Figd_HTML.jpg)\n\
  \n一旦这个旋转通过仪器的连杆和齿轮传动，旋转的分量将转化为相应微小的线性运动。换句话说，电机的一个旋转**步进**可映射为线性运动，通常以毫米或微米为单位度量，具体取决于电机精度及仪器或机器人的齿轮传动比。因此，对于我们的\
  \ `definePhysicalMap` 方法，我们需要做的只是确保以相同单位（例如毫米）输入所有物理微孔板参数，并以相同单位指定仪器的步长。再次强调，为了演示及保持简单，我们将假设仪器在\
  \ **x** 和 **y** 方向上的移动步长相等。如果并非如此，则需要添加额外参数，并对不同方向的移动分别进行计算。\n\n以下是在 `Plate` 类中\
  \ `definePhysicalMap` 方法的代码，见清单 10-1（请记住，构建 `Plate` 类的这些代码清单是逐步累加的，应在第 9 章代码清单中已介绍的所有方法之后添加）：\n\
  \n```\ndef definePhysicalMap(self,width,height,xBorder,yBorder, \\\ndiameter,pitch,stepsize):\n\
  self.width = width\nself.height = height\nself.xBorder = xBorder\nself.yBorder =\
  \ yBorder\nself.diameter = diameter\nself.pitch = pitch\nself.stepSize = stepsize\n\
  self.xwells = []\nself.ywells = []\nxpos = self.xBorder\nfor nx in range(0,self.columns):\n\
  self.xwells.append(xpos)\nxpos += self.pitch\nypos = -self.yBorder\nfor ny in range(0,self.rows):\n\
  self.ywells.append(ypos)\nypos -= self.pitch\nself.initializePlateHead()\nself.setPlotCurrentPosition()\n\
  ```\n\n**清单 10-1** 为 `Plate` 类定义物理映射\n\n\n\n### 物理板映射与初始化\n\n再看一下图 10-1 中展示的物理板模式，你会发现我们用来定义物理板的每个参数都作为参数传递给`definePhysicalMap`方法。`width`和`height`参数对应板在**x**和**y**方向上的尺寸。`xBorder`和`yBorder`对应**xb**和**yb**，`diameter`对应**d**，`pitch`对应**p**。你会注意到我们还有一个`stepSize`参数，它定义了板在**x**和**y**维度上线性运动单个单位的尺寸。`stepSize`参数必须与其他参数采用相同的单位，通常应该是这些单位的一个分数——例如，如果板尺寸以毫米为单位提供，`stepSize`可能是\
  \ 0.01，这对应百分之一毫米的步长。对于此配置，我们需要机器控制系统向机器人或仪器驱动电机发送 100 步，才能在我们选择的维度上实现一毫米的线性移动。\n\
  \n将提供的参数存储为实例变量后，`definePhysicalMap`方法会创建两个实例变量`xwells`和`ywells`，它们分别是包含板列和行水平位置的列表。以下是生成`xwells`列表的代码：\n\
  \n```\nxpos = self.xBorder + self.diameter/2.0\nfor nx in range(0,self.columns):\n\
  \    self.xwells.append(xpos)\n    xpos += self.pitch\n```\n\n水平孔位置`xpos`初始化为实例变量`xBorder`加上半个孔直径，这样我们实际上是将最左列在**x**方向上的位置定义为最左侧孔的中心。然后我们遍历板上的列数，每次将当前列位置追加到`xwells`列表，再将孔间距`pitch`加到当前位置以计算下一个位置。因此，从最左侧孔的中心开始，所有后续孔位置也将对应各自孔的中心。这对自动化代码很重要，因为我们可能希望机器人和仪器从孔的**中心**（而不是边缘）进行移液和/或采样。\n\
  \n我们执行类似操作来生成垂直行位置的`ywells`列表，但由于板的 y 轴方向与行编号顺序相反，在遍历垂直行位置时必须使用**y**的**递减**值——换句话说，我们从**y**为零开始，以**y**的**负**增量向下移动板。如果你再次参考板模式，原因就一目了然了。\n\
  \n```\nypos = -self.yBorder - self.diameter/2.0\nfor ny in range(0,self.rows):\n\
  \    self.ywells.append(ypos)\n    ypos -= self.pitch\n```\n\n### 板位置初始化\n\n现在我们已经有了板上每一行和每一列的水平与垂直位置，只需使用孔在板网格布局中的位置来查找其在板上的水平和垂直位置，就可以轻松计算板上任意孔的物理位置。\n\
  \n扩展`Plate`类使其能够进行物理映射后，剩下的工作就是为`Plate`实例提供一个`initializePlatePosition`方法，该方法处理我们用于存储板上当前物理位置的**x**和**y**两个新实例变量。创建这些变量后，`initializePlatePosition`方法的主要工作是将它们初始化为(0,0)，即我们的坐标系原点。这有点随意——我们本可以从第一个孔、最后一个孔甚至其他可能更适合机器人或仪器的物理位置（例如板的几何中心）开始。\n\
  \n在`definePhysicalMap`方法的末尾，你会看到还有一个对`setPlotCurrentPlatePosition`方法的调用，我们也将介绍该方法。这只是一个设置`True`或`False`标志的方法，用于确定在可视化板时是否直观地表示当前板位置。我们还没有讨论板的可视化，但这将是本章的最后一个主题，届时我们将介绍非常强大且易于使用的[`matplotlib`](http://matplotlib.org/)\
  \ ⁴⁹库。在我们的板可视化方法中，我们希望可以选择显示当前板位置（例如，对应于机器人移液装置或仪器读取头的位置）。这对于测试目的非常有用，当我们使用物理映射代码在板上移动时，它可以显示当前位置相对于板布局的位置。如清单\
  \ 10-2 所示，这个简单的`setPlotCurrentPlatePosition`方法需要做的就是标记是否在可视化中包括当前板位置，并提供为其分配颜色的选项。能够选择颜色的原因在我们深入可视化主题并学习使用颜色映射可视化板数据时会更加明显。\n\
  \n```\ndef initializePlatePosition(self):\n    self.x = 0\n    self.y = 0\n\ndef\
  \ setPlotCurrentPosition(self, status=False, color='yellow'):\n    self.plotCurrentPosition\
  \ = status\n    self.currentPositionColor = color\n\nListing 10-2\nPlate 类的初始化方法\n\
  ```\n\n你会注意到，由**x**和**y**变量表示的板当前位置是以**整数**为单位的。当我们开始使用机器人和仪器在物理上导航板时，我们假设这些设备的运动由步进电机驱动，因此运动单位必须以整数步表示。你还会注意到`plotCurrentPlatePosition`的默认状态是`False`，但稍后当我们想要全面测试物理导航板的代码时，我们会启用它。相关内容很快就会介绍。\n\
  \n### 孔物理位置映射\n\n我们在板上主要关注的物理位置是孔的位置，现在让我们使用生成的板行和列位置列表`xwells`和`ywells`，为`Plate`类添加一个方法，以物理映射清单\
  \ 10-3 中任意孔的位置。\n\n```\ndef mapWell(self, loc):\n    m = self.map(loc)[Plate.mapPositions['position2D']]\n\
  \    xpos = self.xwells[m[1]-1]\n    ypos = self.ywells[m[0]-1]\n    return (xpos,\
  \ ypos)\n\nListing 10-3\nPlate 类的 mapWell 方法\n```\n\n`mapWell`方法使用我们的`map`方法为输入的孔位置生成坐标元组，但我们不是将整个三个值的元组赋值给`m`，而是只从元组中提取`position2D`坐标。\n\
  \n```\nm = self.map(loc)[Plate.mapPositions['position2D']]\n```\n\n从语法上看，这可能有点奇怪，因为我们相当于在方法调用后附加了一个字典键查找，但这在\
  \ Python 中是完全合法的。一种有用的理解方式是：每当你看到一个返回对象（无论是整数、列表、字典、用于模拟*霸王龙*繁殖习性的用户定义类等）的方法调用时，你可以在思维上用该对象替换方法调用，并且任何用于访问该对象元素或字段的语法都是完全合法的。从某种意义上说，这只是一种节省额外代码的简写形式。在我们的示例中，我们可以先将`map`返回的元组赋值给`m`，然后再从中提取`position2D`坐标。\n\
  \n```\nm = self.map(loc)\nm = m[Plate.mapPositions['position2D']]\n```\n\n结果是一样的，但代码会稍长一些。\n\
  \n\n\n现在我们有了以（行，列）形式表示的坐标，就可以利用存储行和列位置的`xwells`和`ywells`列表，查找该孔在板上的物理位置。你会注意到，由于\
  \ Python 列表索引从 0 开始，而我们的孔板坐标系中行和列均从 1 开始索引，因此需要将行和列都减去 1。\n\n```\nxpos = self.xwells[m[1]-1]\n\
  ypos = self.ywells[m[0]-1]\n```\n\n在继续之前，我们先创建一个 96 孔板，为其应用物理映射，然后快速测试新的`mapWell`方法。\n\
  \n```\np = Plate('My 96-well plate',8,12)\np.definePhysicalMap(127.71,85.43,14.36,10.0,3.47,9.0,0.1)\n\
  print(p.mapWell(1))\n(16.095, -11.735)\nprint(p.mapWell(2))\n(25.095, -11.735)\n\
  print(p.mapWell(12))\n(115.095, -11.735)\nprint(p.mapWell(85))\n(16.095, -74.735)\n\
  print(p.mapWell(96))\n(115.095, -74.735)\n```\n\n映射后的 96 孔板宽 85.43mm，高 127.71mm。从板的左上角测量，第一列的水平偏移为\
  \ 14.36mm，第一行的垂直偏移为 10.0mm。孔的直径为 3.47mm，间距为 9.0mm。最后，我们使用的自动化设备的步长为 0.1mm。\n\n基于这些参数并再次参考我们的板示意图，第一个孔的\
  \ x 坐标应为：\n\n*   **xb** + **d**/2 = 14.36 + 3.47/2 = 16.095\n\n同样，第一个孔的 y 坐标应为：\n\
  \n*   **yb** + **d**/2 = 10.0 + 3.47/2 = 11.735\n\n因此，第一个孔的`mapWell`计算是正确的。对于板上的第二个孔，由于它位于同一行，y\
  \ 坐标应保持不变，x 坐标则应增加孔间距`p`，即 16.095 + 9.00 = 25.095。你还会注意到，随着我们向下移动行，孔的 y 坐标值变得越来越负，这与我们的坐标原点（板的左上角）是一致的。如前所述，如果你想检查其余的计算结果，请自行验证。\n\
  \n### 编程实现整板移动\n\n现在我们能定义板上任意孔的物理位置，接下来只需定义所需的 x 和 y 轴移动，就可以将这些指令发送给仪器或机器人，以物理方式移动移液机器人或传感器在板上工作。我们只需要知道当前位置和下一个目标位置，然后利用`stepSize`参数计算出到达目标所需的\
  \ x 和 y 步数。\n\n```\ndef moveTo(self,loc):\npos = self.mapWell(loc)\nstepsPerUnit\
  \ = 1.0 / self.stepSize\nnewx = int(round(pos[0] * stepsPerUnit))\nnewy = int(round(pos[1]\
  \ * stepsPerUnit))\nxshift = newx - self.x\nyshift = newy - self.y\nself.x += xshift\n\
  self.y += yshift\nreturn (xshift,yshift)\n```\n清单 10-4\n`moveTo`方法（`Plate`类）\n\n\
  `moveTo`方法（如清单[10-4]所示）正是这样做的：它接受一个孔位置作为`destination`（目标），计算从板的当前位置（`self.x`, `self.y`）到达`destination`所需的\
  \ x 和 y 步数，并在过程中将板的当前位置更新为这个新位置。既然我们是在物理坐标系中工作，你会注意到，我们必须始终使用整数值来表示当前的 x 和 y 坐标位置以及从当前位置移动到新位置所需的偏移量。因为`stepSize`参数是我们用于定义板物理布局单位的分数，它不一定能得出整数步数，所以在计算新位置时，我们需要四舍五入到最接近的整数。这正是\
  \ Python 内置函数`round`所做的事情——例如：\n\n```\nprint(round(5.4))\n5.0\nprint(round(5.6))\n\
  6.0\n```\n\n尽管`round`返回最接近的整数，但它仍然是浮点数。如果你需要整数，则必须将其转换为 Python 的`int`类型，如下所示：\n\n\
  ```\nprint(int(round(5.6)))\n```\n\n需要牢记的是，板上所有的物理坐标都必须以**整数值**表示，因为我们是用整数步数来定义板上的二维物理运动。\n\
  现在来测试我们的`moveTo`方法。我们将从移动到孔 1 开始，然后沿着第一行前进到孔 2，接着向下移动一行并回到第 1 列（即孔 13 的位置），最后直接跳到板上的最后一个孔——96\
  \ 号孔。对于每次移动，我们将打印出所需的 x 和 y 偏移量、新的物理位置以及该位置孔的精确物理坐标，以便比较。你会立即发现，由于物理移动使用的是整数步数，当前物理位置与`mapWell`方法确定的精确孔位并不完全相同。只要我们使用的步进电机步长相对于板的物理尺寸足够小，这种差异就非常微小，对我们的机器人或自动化仪器来说永远不是问题。在我们的例子中，板尺寸以毫米为单位提供，`stepSize`定义为\
  \ 0.1，即十分之一毫米。这个线性单位相对于板尺寸确实很小，因此我们的自动化设备几乎不会因精度不足而无法定位到孔。\n\n现在开始测试：\n\n```\nprint(p.moveTo(1))\n\
  (161, -117)\nprint(p.x, p.y)\n161 -117\nprint(p.mapWell(1))\n(16.095, -11.735)\n\
  print(p.moveTo(2))\n(90, 0)\nprint(p.x, p.y)\n251 -117\nprint(p.mapWell(2))\n(25.095,\
  \ -11.735)\nprint(p.moveTo(13))\n(-90, -90)\nprint(p.x, p.y)\n161 -207\nprint(p.mapWell(13))\n\
  (16.095, -20.735)\nprint(p.moveTo(96))\n(990, -540)\nprint(p.x, p.y)\n1151 -747\n\
  print(p.mapWell(96))\n(115.095, -74.735)\n```\n\n很好！从测试结果可以看出，由`moveTo`方法输出的偏移量计算出的最终位置（`p.x`,\
  \ `p.y`），在每种情况下都是最接近`mapWell`方法计算出的实际浮点孔位坐标的整数值。\n在我们团队为某个客户实施的真实实验室自动化项目中，这类高级\
  \ Python 代码以我们展示的方式生成了二维移动指令，然后将其传递给一个用 C 语言编写的底层机器控制库，该库实际驱动实验室机器人的步进电机。这需要借助前面提到的名为\
  \ SWIG（简化封装与接口生成器）的平台进行一些代码调整，该平台能让用 C 等语言编写的代码库与你的 Python 代码对接，使其子程序和函数可以从 Python\
  \ 中调用，就像调用 Python 方法一样。大多数实验室自动化硬件都附带这类底层机器控制库，用户可以直接或借助 SWIG 等接口软件将它们集成到自己的应用程序中。深入探讨如何设置、编程和使用这类自动化硬件已超出本书的范围和目的，但我们会在本章末尾推荐一些优秀资源，供你更深入地学习实验室自动化这一主题。\n\
  \n\n\n## 使用 matplotlib 可视化多孔板\n\n至此，我们终于来到了多孔板漫长探索之旅的最后一个主题——可视化板式测定数据。我们花了大量时间处理\
  \ Python 中的板式测定数据，部分原因是板式测定已成为生命科学研究中如此普遍的特征，但也因为这个主题为我们提供了许多绝佳的 Python 学习机会。\n\n\
  [matplotlib 库](http://matplotlib.org/)^(¹²³)是一个功能强大且易于使用的 Python 扩展，提供了出色的图形和绘图功能。如果你查看\
  \ matplotlib 文档，会发现[pyplot](http://matplotlib.org/api/pyplot_api.html)^(¹²⁴)（我们将在本章中详细讨论）是\
  \ matplotlib 中一种类似 [MATLAB](https://www.mathworks.com/products/matlab.html) 的绘图框架^(¹²⁵)。如果你曾使用过\
  \ MATLAB，那么 matplotlib 的总体环境和设置，特别是 pyplot，会让你感到非常熟悉^(¹²⁶)。matplotlib 通常存在于大多数 Windows\
  \ 或 macOS 的 Python 发行版中，并且在大多数 Linux 发行版中也作为附加包提供（例如，在 Ubuntu 和 Fedora 中，该包都称为 `python-matplotlib`）。如果\
  \ matplotlib 尚未包含在你的主要 Python 安装中，请参阅第 1 章，了解通过 `pip` 安装 matplotlib 的更多详细信息。\n\n\
  简要介绍完毕，让我们从一个简单的库使用示例开始吧！我们将编写一些代码来绘制板的布局，其中孔的颜色根据某种选定的属性进行编码。\n\n我们还将使用 `currentPlatePosition`\
  \ 标志以及我们在 `setPlotCurrentPlatePosition` 方法中实现的对当前板位进行绘图的颜色。\n\n### 使用 matplotlib\
  \ 颜色映射\n\n首先，让我们思考如何根据某种属性对孔进行颜色编码。假设我们想要表示之前示例中从 CSV 文件读取的 `concentration` 数据。板上的每个孔都有一个与\
  \ `concentration` 属性相关联的值，我们希望使用颜色映射来表示板上浓度值的范围。你可能在之前许多其他应用程序中见过颜色映射的使用。在生物学中，一个显而易见的例子是使用彩色[热图](https://en.wikipedia.org/wiki/Heat_map)来表示细胞中基因表达的差异水平，如图\
  \ 10-2 所示。\n\n![../images/476668_1_En_10_Chapter/476668_1_En_10_Fig2_HTML.jpg](img/476668_1_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2 表示差异基因表达的热图\n\n我们将开发一些 Python 代码来创建板上孔的热图，根据我们为每个孔分配了值的某个指定属性进行着色。根据[一图胜千言](https://en.wikipedia.org/wiki/A_picture_is_worth_a_thousand_words)的古老格言，我们将利用可视化的力量，以一种直观的方式表示板式测定数据，并一目了然地展示数据中存在的趋势（如果有的话）。\n\
  \n为此，我们将利用一种通过 [RGB 颜色模型](https://en.wikipedia.org/wiki/RGB_color_model)在计算机上表示颜色的方法。在\
  \ Python 的 matplotlib 库中，颜色的红、绿、蓝分量可以使用包含三个值的元组来表示，分别对应颜色的红、绿、蓝分量。在 matplotlib 中，这些分量的浮点数值介于\
  \ 0.0（对应零强度）和 1.0（对应全强度）之间。在许多使用固定位数在屏幕上表示颜色的计算机上，你经常会看到整数形式的数值，其范围反映了用于定义每种颜色的位数所对应的数值限制（例如，8\
  \ 位颜色的范围是 0 到 255）。\n\nPython matplotlib 使用浮点数来表示颜色范围，这有效地将其 RGB 颜色模型与任何特定的固定位颜色模型解耦，因为它总是会被转换为最接近当前用于可视化的显示器或打印机所适位的值。然而，自然情况下，每个颜色位数更高的系统总能显示特定颜色的更多色调。\n\
  \n为了说明我们的颜色映射将如何工作，假设我们想要根据孔中某内容物的浓度对每个孔进行颜色编码，其中白色对应最低浓度，红色对应最高浓度。\n\n- 在我们的 matplotlib\
  \ RGB 颜色模型中，白色是 `(1.0, 1.0, 1.0)`，对应所有三种颜色的最大强度。\n- 红色是 `(1.0, 0.0, 0.0)`——红色最大，完全没有绿色和蓝色。\n\
  \n要生成恰好介于这两个极端中间的浓度的颜色，我们只需计算每个颜色分量之间的差值，将这些差值除以 2.0，然后将结果加到较低浓度的颜色上。\n\n计算过程如下：\n\
  \n- **R** = `1.0 + ((1.0 - 1.0) / 2.0)`，**G** = `1.0 + ((0.0 - 1.0) / 2.0)`，**B**\
  \ = `1.0 + ((0.0 - 1.0) / 2.0)`\n- **RGB** = `(1.0, 0.5, 0.5)`\n\n要查看此颜色映射算法的实际效果，图\
  \ 10-3 展示了最小、中间和最大浓度颜色绘制成圆形的效果。\n\n![../images/476668_1_En_10_Chapter/476668_1_En_10_Fig3_HTML.jpg](img/476668_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3 红色系的浓度颜色\n\n这就是我们颜色映射系统工作的基础。用户将指定要颜色编码的孔属性、一个“最小”属性颜色和一个“最大”属性颜色。然后，颜色映射方法将扫描板上所有孔的指定属性，并为每个孔分配一种颜色，该颜色对应于该孔所选属性的值。由于我们是考虑最终用户最大利益的贴心的程序员，我们也允许用户选择要颜色编码的属性的最小值和最大值。这意味着，所有小于或等于此选定最小属性值的值将应用“最小”颜色，所有大于或等于“最大”属性值的值将应用“最大”颜色。允许用户选择应用颜色映射的属性值范围，使他们能够对最终的可视化效果拥有更大的控制权。\n\
  \n\n\n因此，在我们开始使用按属性值对孔进行颜色编码的选项来绘制孔板之前，让我们先实现生成颜色图的方法。代码清单 10-5 展示了我们 `Plate` 类中新增的\
  \ `createColorMap` 方法。\n\n```\ndef createColorMap(self, propertyName, loColor=(1.0,1.0,1.0),\
  \ \\\nhiColor=(1.0,0.0,0.0), propertyRange=(0.0, 100.0)):\nself.colorMap = []\n\
  pRange = propertyRange[1] - propertyRange[0]\nrRange = hiColor[0] - loColor[0]\n\
  gRange = hiColor[1] - loColor[1]\nbRange = hiColor[2] - loColor[2]\nfor n in range(0,self.size):\n\
  p = self.get(n+1,propertyName)\nscaledP = (p - propertyRange[0]) / pRange\nr = loColor[0]\
  \ + (scaledP * rRange)\nif r < 0.0: r = 0.0\nif r > 1.0: r = 1.0\ng = loColor[1]\
  \ + (scaledP * gRange)\nif g < 0.0: g = 0.0\nif g > 1.0: g = 1.0\nb = loColor[2]\
  \ + (scaledP * bRange)\nif b < 0.0: b = 0.0\nif b > 1.0: b = 1.0\nself.colorMap.append((r,g,b))\n\
  return\n代码清单 10-5\n为 Plate 类创建颜色图\n```\n\n可以看到，我们提供了默认颜色——白色代表最小值，红色代表最大值，以及属性的默认范围，该范围以包含最小和最大属性值的元组形式传递给该方法。一旦该方法计算出了属性值的范围以及每个颜色分量的颜色范围，我们就开始启动循环，遍历孔板上的每个孔，并计算与每个孔属性值相对应的颜色。这些值存储在一个新的实例变量\
  \ `colorMap` 中，如果决定选择按颜色绘图，稍后绘制孔板时会用到它。实例变量 `colorMap` 只是一个颜色元组的列表，每个元组对应孔板上的一个位置（孔）。\n\
  \n所以，这里给读者留一个小练习：我们 `Plate` 类的实例可能为孔定义多个属性——例如每个孔内单独成分的浓度、[光密度](https://en.wikipedia.org/wiki/Absorbance)测量值、细胞系\
  \ ID 等等。你将如何实现一个功能，使得所有这些属性的颜色图能够同时存储，并且能选择其中任何一个用于带颜色图的绘图？*提示：Python 字典是你的好帮手*。\n\
  \n既然我们现在允许用户为颜色图设置自己的最小和最大属性值，就需要一种方法来处理超出指定范围的属性值。正如我们之前所说，需要将任何低于属性范围的值设置为最小颜色，将任何高于属性范围的值设置为最大颜色值。这些代码块就是为每个颜色分量处理这个问题的。\n\
  \n```\nr = loColor[0] + (scaledP * rRange)\nif r < 0.0: r = 0.0\nif r > 1.0: r =\
  \ 1.0\n```\n\n例如，这里是计算*红色*颜色分量的代码。缩放后的颜色值必须介于 0.0 和 1.0 之间，计算出的超出此范围的值必须重置。一旦为每个颜色分量计算出合适的缩放值，RGB\
  \ 元组就会被追加到 `colorMap` 列表中。\n\n### matplotlib 绘图命令\n\n既然我们可以为孔属性生成颜色图，终于准备好使用 [matplotlib](http://matplotlib.org/)\
  \ 来绘制孔板了。例如，你可以定义输出图形的大小和分辨率，这对于生成用于印刷出版物（如科学期刊）的图形非常有用。我们将使用之前定义的孔板的物理映射来设定绘图的坐标系和所有孔的布局，但我们会关闭通常绘制图形时会显示的带有刻度和标记的坐标轴，因为这些轴与我们的目的无关。\n\
  \n我们将把孔板绘制成圆形网格布局（假设孔是圆形的），并且还会使用 matplotlib 的文本功能来标记孔板的行和列。如果已经为孔板实例生成了颜色图，我们将用它来对孔进行颜色编码；最后，如果实例的\
  \ `plotCurrentPlatePosition` 标志为 `True`，我们将添加一个小圆圈来显示孔板的 `currentPlatePosition`。在代码清单\
  \ 10-6 中，我们看到了 `Plate` 类中新增的 `plotPlate` 方法的代码。\n\n```\ndef plotPlate(self,figWidth=4.0,figHeight=3.0,dpi=200,\
  \ \\\nrowlabelOffset=3.0,columnLabelOffset=2.0, fontSize=None):\nif self.width ==\
  \ None:\nreturn\nwellColor = 'w'\nplt.figure(figsize=(figWidth,figHeight),dpi=dpi)\n\
  plt.axes()\nplt.axis('off')\nif fontSize == None:\nfontSize = figHeight * 3\n#outline\
  \ = plt.Rectangle((0, 0), self.width, -self.height, fc=\"gray\")\n#plt.gca().add_patch(outline)\n\
  npos = -1\nleftText = self.xwells[0] - (self.diameter * rowlabelOffset)\ntopText\
  \ = self.ywells[0] + (self.diameter * columnLabelOffset)\nfor yw in self.ywells:\n\
  ymap = self.map(npos+2)\nletter = ymap[2][0]\nplt.text(leftText, yw - (self.diameter\
  \ / 2.0), letter, color=\"black\", \\\nfontsize=fontSize)\nfor xw in self.xwells:\n\
  npos += 1\nif npos <= self.columns:\nxmap = self.map(npos+1)\ncol = str(int(xmap[2][1:]))\n\
  plt.text(xw - (self.diameter / 2.0), topText, col, color=\"black\", \\\nfontsize=fontSize)\n\
  if not self.colorMap == None:\nwellColor = self.colorMap[npos]\ncircle = plt.Circle((xw,\
  \ yw), radius=self.diameter, fc=wellColor)\nplt.gca().add_patch(circle)\nif self.plotCurrentPosition:\n\
  circle = plt.Circle((self.x * self.stepSize, self.y * self.stepSize), \\\nradius=self.diameter\
  \ / 3.0, fc=self.currentPositionColor)\nplt.gca().add_patch(circle)\nplt.axis('scaled')\n\
  plt.show()\n代码清单 10-6\n创建图像：Plate 类中的 plotPlate 方法\n```\n\n在深入剖析代码之前，让我们快速看一下它的输出，以便为后续讨论提供更多背景信息。我们将创建一个\
  \ 96 孔板，从之前使用的 CSV 文件中读取数据，应用物理映射和颜色图对数据进行颜色编码，然后绘制结果。\n\n```\np = Plate('My 96-well\
  \ plate', 8, 12)\np.definePhysicalMap(127.71, 85.43, 14.36, 10.0, 3.47, 9.0, 0.1)\n\
  p.readCSV('96plateCSV.txt', 'concentration')\np.createColorMap('concentration',\
  \ propertyRange=[0.0, 100.0])\np.setPlotCurrentPosition(True, color=\"orange\")\n\
  print(p.moveTo(15))\np.plotPlate(figWidth=8.0, figHeight=5.0, dpi=200)\n```\n\n\
  可以看到，我们使用默认的白-红配色方案定义了一个颜色图，范围从 0.0 到 100.0，我们将孔板的 `plotCurrentPlatePosition` 标志设置为\
  \ `True`，并指定颜色“橙色”用于绘制孔板的 `currentPlatePosition`。最后，在实际绘制结果之前，我们还执行了一次 `moveTo`\
  \ 操作，将孔板的 `currentPlatePosition` 设置为位置 15。结果如图 10-4 所示。\n\n![../images/476668_1_En_10_Chapter/476668_1_En_10_Fig4_HTML.jpg](img/476668_1_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4\n绘制孔板水平的输出结果\n\n\n\n在这个为这块板子完全虚构的数据集中，您可以看到每行的前两个孔位本应是对照孔，而后面的孔位则呈现出明显趋向更高浓度的趋势。您可以想象，例如一个连续稀释实验，其中板子的每一行代表一组特定条件下的某个稀释度。无论如何，这个虚构的数据集是为了很好地展示颜色映射算法（它也确实做到了）。您还会注意到板子位置\
  \ 15 上有一个橙色小圆点，对应于我们执行`moveTo`操作后得到的`currentPlatePosition`。这种可视化方式非常便于模拟机械臂或仪器传感器在板上的移动。例如，我们可以编写一系列移动动作，并在板上将其可视化，如图\
  \ 10-5 所示。\n\n![../images/476668_1_En_10_Chapter/476668_1_En_10_Fig5_HTML.jpg](img/476668_1_En_10_Fig5_HTML.jpg)\n\
  \n**图 10-5** 机器人或传感器在板上的可能编程移动轨迹\n\n那么，来看代码……在解读`plotPlate`的代码时，我们建议您同时参考[pyplot\
  \ 文档](http://matplotlib.org/api/pyplot_summary.html)^(¹²⁷)，因为我们的目的不是提供关于 matplotlib\
  \ 或 pyplot 的详尽教程。\n\n```\nif self.width == None:\nreturn\n```\n\n在我们的新方法`plotPlate`中，首先要做的是检查当前板实例是否已经分配了物理映射，因为如果没有映射，我们就无法绘制它。如果`width`未定义，我们就知道物理映射尚未分配，因此退出。\n\
  \n接下来，我们分配一个默认的孔位颜色，用于处理未定义颜色映射、只想绘制板布局和（可选）当前位置的情况。\n\n```\nwellColor = 'w'\n```\n\
  \n[在 matplotlib 中，有一套标准的常用颜色](http://matplotlib.org/api/colors_api.html)^(¹²⁸)，为了方便，我们可以仅用一个字母来引用它们。在这里，`'w'`代表白色。\n\
  \n```\nplt.figure(figsize=(figWidth,figHeight),dpi=dpi)\nplt.axes()\nplt.axis('off')\n\
  ```\n\n接下来，我们初始化一个[`pyplot`](http://matplotlib.org/api/pyplot_api.html)图形。`plt`这个符号是从哪里来的？还记得在第\
  \ 9 章中，当我们刚开始为`Plate`类编写代码时，我们使用`as`关键字以略有不同的方式导入了 pyplot 子模块：\n\n```\nimport matplotlib.pyplot\
  \ as plt\n```\n\n使用`import ... as ..`形式并采用像`plt`这样的缩写非常常见，这样可以避免反复输入`mathplotlib.pyplot`甚至`pyplot`。这使得通过简单输入`plt.<command>`名称就能轻松调用任何\
  \ matplotlib 命令。因此，`plt`成为了`matplotlib.pyplot`的便捷简写。\n\n```\nplt.figure(figsize=(figWidth,figHeight),dpi=dpi)\n\
  ```\n\n我们使用传递给`plotPlate`方法的`figWidth`、`figHeight`和`dpi`参数来初始化新的`plt`图形。这允许用户以英寸为单位指定图形的宽度和高度，以及以每英寸点数为单位的图形分辨率。我们之所以在板可视化代码中添加这个特性，是因为当您使用\
  \ Python 为印刷期刊生成任何类型的图表或图形时，对 matplotlib 图形输出的大小和分辨率进行这种程度的控制可能极其重要。这些科学期刊通常对图形大小和分辨率有相当严格的要求，因此作为生命科学家，了解如何根据其规格定制图表和图形是非常有用的。同样，无论您是为会议海报生成大幅面图形，还是为实验室网站生成图表，Python\
  \ 都是为各种媒介生成图形的绝佳工具。\n\n\n\n在下一段代码中，我们向绘图添加了一组（不可见的）坐标轴，这实质上定义了它的坐标系：\n\n```\nplt.axes()\n\
  ```\n\n但我们关闭了可见的坐标轴：\n\n```\nplt.axis('off')\n```\n\n因为我们并没有绘制图表，因此不需要它们。\n\n除了让用户控制输出图形的大小和分辨率之外，我们还提供了设置板面标签字体大小的选项，同时允许该方法本身根据图形大小选择一个合理的默认字体大小。\n\
  \n```\nif fontSize == None:\n    fontSize = figHeight * 3\n```\n\n接下来的任务是计算绘图中列标签水平线（对于\
  \ 96 孔板，12 列对应 A 到 H）和行标签垂直线（对于 96 孔板，8 行对应 1 到 8）的位置。秉承我们为用户提供对绘图美学细节一定控制权的理念，我们还提供了两个方法参数\
  \ `rowLabelOffset` 和 `columnLabelOffset`，用户可以用它们控制行和列标签距离孔边缘的距离。为了确保这些偏移量与板本身的布局按比例缩放，它们实际用作单个孔直径的倍数。例如，`rowLabelOffset`\
  \ 为 3.0（默认值）会将行标签定位在最左侧孔边缘的三个孔直径距离处。对于孔可能比典型情况更靠近或更远离板边缘的不同板布局，可以想象用户可能希望对行和列标签的位置拥有一定程度的控制。\n\
  \n接下来是方法的主体部分，我们使用 `y` 和 `x` 的嵌套循环按行和列遍历所有板的位置，在必要的位置添加行和列标签，并实际绘制颜色编码的孔。\n\n这段代码的结构如下：\n\
  \n- **遍历每一行：**\n    - 绘制当前行的行标签\n    - **遍历当前行中的每一列：**\n        - **如果在板的第一行：**\n\
  \            - 绘制当前列的列标签\n            - 绘制当前孔\n        - **否则：**\n            -\
  \ 绘制当前孔\n        - **如果 `plotCurrentPlatePosition` 标志被设置：**\n            - 绘制板的当前位置\n\
  \n你会注意到在实际代码中，当我们在实际绘制孔时，如果存在颜色映射，我们会使用它；否则，我们仅使用默认的（白色）孔颜色。\n\n`plotPlate` 方法的最后一行：\n\
  \n```\nplt.show()\n```\n\n实际生成绘图，搞定！\n\n**不同的板布局**\n\n在我们结束这段多孔板的漫长旅程之前，你可能注意到我们目前只绘制了\
  \ 96 孔板，所以让我们确认一下 `plotPlate` 方法也适用于其他布局。我们以标准的 24 孔板为例，它有 4 行 6 列。你可以在图 10-6 中看到结果。\n\
  \n![../images/476668_1_En_10_Chapter/476668_1_En_10_Fig6_HTML.jpg](img/476668_1_En_10_Fig6_HTML.jpg)\n\
  \n**图 10-6** 24 孔配置中的输出板面水平\n\n```\np = Plate('My 24-well plate', 4, 6)\np.readCSV('24plateCSV.txt','concentration')\n\
  p.definePhysicalMap(140.71, 100.43, 14.36, 10, 7.0, 18.0, 0.1)\np.createColorMap('concentration',\
  \ propertyRange=[0.0, 100.0])\np.moveTo(24)\np.setPlotCurrentPosition(True, color=\"\
  orange\")\np.plotPlate(figWidth=8.0, figHeight=5.0, dpi=200)\n```\n\n让我们暂时收起实验设备。在下一章中，我们将通过研究最小的“生物”系统——一个单分子——来继续我们的用代码表示生物学的旅程。在分子尺度上，我们实际上更多地属于物理和化学领域，而非生物学，但现代生物学的大部分内容正是在这些非常小的尺度上研究生物系统，因此我们的书中不能缺少它。\n\
