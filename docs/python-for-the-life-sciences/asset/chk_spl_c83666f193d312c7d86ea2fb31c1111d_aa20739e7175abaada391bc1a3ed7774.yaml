- 'no': 8851
  overturn_probability: 0.9
  alternative: 正文中某个主题条目下的“另见”引用行（属于索引或目录内的交叉引用标记）
  counter_evidence:
  - 该行内容为“另见 `贝叶斯定理`”，这是典型的交叉引用（Cross-reference）格式，而非章节标题。在Markdown或书籍排版中，“另见”通常跟随在某个词条之后，指示读者去查阅另一个相关词条。
  - 若将此行为章节起始，意味着章节标题是“另见...”，这不符合任何书籍或文档的命名规范。真正的索引章节标题通常是“索引”、“参考文献”或“A-Z 字母表”，而“另见”是条目内部的内容。
  - 上下文显示前后均为空行，且后续出现了“### 条件概率”等三级标题，说明当前处于一个较大的索引或附录区域内部。将“另见”行设为分章点会导致索引结构被错误地打碎成无数个极小的片段，违背了“索引统一划分为一章”的规则。
  keep_split: false
- 'no': 8931
  overturn_probability: 0.95
  alternative: 索引中的独立词条（Topic Entry）
  counter_evidence:
  - 内容“Swarm 开发组 (SDG)”带有 `##` 标记，但在该文档的语境下（结合其他行如“另见”、“T”、“U”等字母索引标记），这显然是一个按字母顺序排列的索引词条。
  - 规则明确指出：“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章。文末索引也划分为一章。”。因此，索引中的每一个词条（Entry）都不应作为新的章节划分点，它们共同属于“索引”这一大章。
  - 将该行分章会导致索引被切分成数十个微小章节，严重破坏文档结构的逻辑完整性。
  keep_split: false
- 'no': 8945
  overturn_probability: 0.98
  alternative: 索引的字母分隔符（Section Divider）
  counter_evidence:
  - 内容仅为单个字母“T”，这是典型的索引字母分组标记。
  - 在索引结构中，字母标记（如 A, B, C... T, U...）用于组织条目，它们本身不是章节标题，而是属于“索引”这一章内部的排版元素。
  - 将其划分为新章节没有语义意义，且违背了“文末索引统一划分为一章”的规则。
  keep_split: false
- 'no': 9131
  overturn_probability: 0.2
  alternative: “脚注”作为一个独立的附录标题，或者全文末尾的注释汇总页
  counter_evidence:
  - 虽然规则提到“文末索引也划分为一章”，但“脚注”（Footnotes/Endnotes）有时被视为独立于索引的附录部分。如果该文档结构为“正文-索引-脚注”，则脚注部分可以单独成章。
  - 然而，考虑到前文大量的索引条目被错误标记，且“脚注”通常紧随索引之后，在某些标准化文档处理中，索引和脚注可能被合并处理。但相比前几项，此项作为独立章节的可能性较高，因为它是整个文档的收尾部分，且标题具有明确的统领性。
  keep_split: true
