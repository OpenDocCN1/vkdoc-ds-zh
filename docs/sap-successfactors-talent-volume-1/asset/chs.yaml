  \ |\n| | `360 高管评估：修改能力（添加/删除能力）` | 拥有此 360 高管评估权限的角色可以修改表单中的能力项。 |\n| | `360 高管评估：修改参与者（添加/删除参与者）`\
  \ | 拥有此 360 高管评估权限的角色可以修改表单中的参与者列表。 |\n| | `360 高管评估：退回表单` | 拥有此 360 高管评估权限的角色可以将表单退回一步。此操作仅在签名步骤有效。\
  \ |\n| | `360 高管评估：发送副本` | 拥有此 360 高管评估权限的角色可以将 360 评估反馈表单的副本发送给另一个用户。 |\n\n\n\n\
  ## 360 度评估权限与配置指南\n\n### 权限说明\n\n#### 360 度高管评估：发送电子邮件提醒\n拥有此`360 Executive Review`权限的角色可以向参与者列表发送电子邮件提醒。\n\
  \n#### 360 度高管评估：查看详细 360 度报告\n拥有此`360 Executive Review`权限的角色可以查看已完成表单的详细`360 Review`报告。\n\
  \n#### 360 度高管评估：查看参与者评分（仅限已完成表单）\n拥有此`360 Executive Review`权限的角色可以查看已完成表单中各个参与者的评分。\n\
  \n#### 一般用户权限\n##### 创建表单的权限\n拥有此权限的角色可以创建`360 Review`反馈表单。\n\n### 管理表单模板\n####\
  \ 表单模板\n拥有此权限的角色可以创建和维护`360 Review`反馈表单模板。\n\n### 计划批量创建表单（稍后启动表单）\n拥有此权限的角色可以安排在稍后的日期/时间批量创建表单。\n\
  \n### 批量创建表单实例（立即启动表单）\n拥有此权限的角色可以批量启动表单。\n\n#### 路由图\n拥有此权限的角色可以访问配置屏幕`Routing\
  \ Maps`，以创建和维护用于`360 Review`反馈表单的路由图。\n\n### 评分量表\n拥有此权限的角色可以访问配置屏幕`Rating Scales`，以创建和维护用于`360\
  \ Review`反馈表单的评分量表。\n\n> **注意：** 在本节中，我们仅讨论特定于`360 Review`反馈流程的权限。我们不会审查用户特定权限等。\n\
  \n> **注意：** 本节讨论的权限可以在管理中心的 `Admin Center` 中访问。执行`Manage Permission Roles`以访问这些权限。强烈建议在配置`360\
  \ Review`反馈表单之前，将这些权限分配给正确的角色。\n\n在讨论了所需的权限之后，请记住将这些权限分配给所需的组。这将帮助我们准备好审查管理中心的 `Admin\
  \ Center` 中可用的不同配置步骤。\n\n## 管理中心相关配置步骤\n\n现在我们已经拥有了进行配置所需的权限，让我们开始吧！与`360 Review`相关的配置屏幕可以在管理中心的\
  \ `Admin Center` 中的 `Company Processes and Cycles` 和 `360 Review` 部分找到（参见图 `12-2`）。表\
  \ `12-2` 从高层次描述了每个配置屏幕的功能。\n\n**表 12-2** 360 度评估反馈表单的配置屏幕\n\n| 配置屏幕 | 描述 |\n|---|---|\n\
  | `Change 360 Process Owner` | 执行此配置屏幕以更改`360 Review`反馈表单的所有者。 |\n| `Change Participant\
  \ Category` | 执行此配置屏幕以更改`360 Review`反馈表单中的参与者类别。 |\n| `Complete / Decline 360 Form`\
  \ | 执行此配置屏幕以完成或拒绝分配给该用户的`360 Review`反馈表单。<br>**注意：** 执行此配置屏幕时，在登录页面上您将看到选项 `[Mass\
  \ Decline/Complete 360 Documents](https://salesdemo.successfactors.eu/xi/ui/pm360/pages/mass_decline_forms.xhtml?pess_new_admin=true&_s.crb=4jvSN1icATY2ek4X6wSxw5v%252f8b1Y%252fBQ%252fZ45XLX2WQ5Q%25253d)`。您可以使用此配置选项导入一个包含您想要完成/拒绝的`360\
  \ Review`反馈表单文档 ID 的 CSV 文件。当您有多个`360 Review`反馈表单需要处理时，通常会使用此选项。 |\n| `E-Mail Notification\
  \ Templates Settings` | 执行此配置屏幕以访问与`360 Review`审查流程关联的电子邮件模板设置。在显示的页面上，搜索 `*360*`\
  \ 以访问`360 Review`流程使用的所有电子邮件模板。在此配置屏幕上，您可以启用或禁用提供的电子邮件模板。如果需要，您可以通过配置显示电子邮件部分中的设置来更改电子邮件模板的内容。<br>**注意：**\
  \ 此配置屏幕用于访问不同模块和平台使用的所有电子邮件模板。 |\n| `Form Template Settings` | 使用此配置屏幕更改`360 Review`表单设置，以及下载现有反馈表单或导入新表单。\
  \ |\n| `Launch 360 Review` | 在此配置屏幕上，您可以创建和启动`360 Review`表单。 |\n| `Manage Route\
  \ Maps` | 使用此配置屏幕创建和维护用于`360 Review`表单的路由图。 |\n| `Manage Scheduled Review` | 在此配置屏幕上，您可以修改或取消`360\
  \ Review`反馈表单的启动。 |\n| `Manage Templates` | 在此配置屏幕上，您可以更改`360 Review`反馈表单的配置并对其进行维护。\
  \ |\n| `Rating Scales` | 在此配置屏幕上创建和维护`360 Review`表单中使用的评分量表。 |\n| `Restore Completed\
  \ 360` | 在此配置屏幕上，我们可以将已完成的`360 Review`反馈表单恢复给参与者或流程所有者进行评估。 |\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig2_HTML.jpg](img/499651_1_En_12_Fig2_HTML.jpg)\n\
  \n**图 12-2** 管理中心 `Admin Center` 中可用的`360 Review`配置步骤\n\n在了解了这些不同的配置屏幕之后，下一节我们将讨论如何配置一个新的`360\
  \ Review`反馈表单。\n\n## 配置 360 度评估反馈表单\n\n我们将从配置一个新的`360 Review`反馈表单开始。在配置一个新表单之前，我们将配置将在`360\
  \ Review`反馈表单中使用的路由图。\n\n### 配置路由图\n\n我们可以通过执行配置屏幕 `Manage Route Maps` 来配置路由图。在显示的页面上，点击\
  \ `Getting Started`。在显示的页面上，点击 `Add New Route Map`。这将显示两个选项（参见图 `12-3`）。我们可以手动构建一个新的路由图，或者使用库中预置的路由图之一。\n\
  \n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig3_HTML.jpg](img/499651_1_En_12_Fig3_HTML.jpg)\n\
  \n**图 12-3** 创建新的路由图\n\n我们将在本节中讨论这两个选项。\n\n### 使用库中的预置路由图构建新路由图\n\n如图 `12-3` 所示，点击\
  \ `Choose from Library` 选项。这将显示 `SuccessStore` 中所有可用的路由图。`360 Review` 特定的路由图带有前缀\
  \ `\"360\"`（参见图 `12-4`）。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig4_HTML.jpg](img/499651_1_En_12_Fig4_HTML.jpg)\n\
  \n**图 12-4** 使用 `SuccessStore` 中可用的路由图\n\n> **提示：** 在图 `12-4` 中，当您点击某个路由图名称时，系统将为您显示该路由图。您可以查看所有与`360\
  \ Review`相关的路由图，并选择最适合您业务需求的一个。如果您没有找到任何满足需求的路由图，您可以手动创建一个新的路由图。\n\n> **注意：** `SuccessFactors`\
  \ 在 `SuccessStore` 中提供了许多预配置的对象，客户和实施团队可以在配置期间利用这些对象。这些预配置的对象不同于快速部署解决方案 (`Rapid\
  \ Deployment Solutions`, `RDS`) 中可用的对象。`SuccessStore` 中可用的对象帮助客户和实施团队在配置方面抢占先机。这些预置对象可以用作基线，并进一步配置以满足业务需求。\n\
  \n\n\n## 配置路线图与反馈表单\n\n在本次讨论中，我们将选择预配置的路线图 **360 - 员工与经理流程**。点击该路线图旁边的单选按钮，然后点击“添加到我的实例”。这将显示一个新的对话框，您可以在其中输入路线图的名称。点击“保存”以保存您的设置。这将显示路线图，您可以在其中进行进一步修改（如有需要）（参见图\
  \ 12-5）。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig5_HTML.jpg](img/499651_1_En_12_Fig5_HTML.jpg)\n\
  \n**图 12-5** 维护预交付的路线图\n\n点击路线图中的每个流程步骤；您可以添加详细信息，例如步骤名称、步骤描述以及哪个角色将拥有该特定步骤。当您点击“显示高级选项”时，您可以维护诸如步骤介绍、鼠标悬停文本（如完成后的步骤名称、步骤模式等）之类的详细信息。步骤\
  \ ID 通常会预填充，但您可以更改它（例如，提供一个更具描述性的 ID）。\n\n完成更改后，请记得保存。\n\n了解了如何利用预配置的路线图后，我们将回顾如何为\
  \ 360 评估流程手动创建一个新的路线图。\n\n### 手动构建路线图\n\n我们将手动创建一个新的路线图，其中经理将提名评估者并将其发送给 HR 进行审批，然后再将\
  \ 360 评估表发送给员工进行评估。\n\n如图 12-3 所示，点击“构建您自己的”。系统将创建一个新的路线图（参见图 12-6）。在显示的页面上，您可以为路线图输入新名称和描述。（请注意，默认情况下，系统会显示“路线图”并附带一个数字作为新路线图的名称。）\n\
  \n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig6_HTML.jpg](img/499651_1_En_12_Fig6_HTML.jpg)\n\
  \n**图 12-6** 手动创建新路线图\n\n在路线图名称下，您会注意到有三个选项。对于我们的路线图，我们将选择以下两个选项：\n\n*   **我想在 360\
  \ 评估路线图中个性化评估阶段**：选择此选项将允许您编辑评估阶段中评估者可以看到的内容。正是在评估阶段，评估者对员工进行评分和提供反馈。\n*   **对表单路由使用相对日期**：选择此选项后，所有路线图日期将变为相对的。通过选择此选项，您可以定义相对于流程中另一个步骤之前/之后的天数。（请注意，您也可以为每个流程步骤输入实际日期。）\n\
  \n> **注意**\n>\n> 当您选择此选项时，系统将显示一条警告消息：“当相对日期复选框打开时，不允许对路线图中的步骤位置进行重新排序。”这意味着如果您需要重新排序步骤，则需要取消选择此选项以重新排序路线图步骤，然后在需要时再次选择此选项。\n\
  \n> **提示**\n>\n> 您可以点击每个选项旁边显示的问号（`?`）来了解其含义以及何时/何处可以使用它。\n\n在“修改阶段”部分，点击 `+` 图标以创建一个新步骤。我们将此步骤命名为“直线经理提名评估者”。提供步骤描述。\n\
  \n在“步骤类型”（参见图 12-7）中，选择“单一角色”。在“角色”部分，选择“经理”作为负责此步骤的角色。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig7_HTML.jpg](img/499651_1_En_12_Fig7_HTML.jpg)\n\
  \n**图 12-7** 配置路线图中的步骤\n\n现在，点击“修改阶段”中显示的 `+` 以创建路线图中的第二个步骤。我们将此步骤命名为“HR 代表批准评估者”。输入步骤描述。在“步骤类型”中，选择“单一角色”并选择“HR\
  \ 代表”作为负责此步骤的角色。\n点击“保存”以保存您的路线图。\n\n在下一步中，我们将开始配置一个新的 360 评估反馈表单。我们将通过执行配置屏幕“管理模板”来配置表单。\n\
  \n#### 管理模板\n\n在配置屏幕“管理模板”上，我们可以创建新表单，以及维护已配置的 360 评估反馈表单。在显示的页面（参见图 12-8）上，点击“360\
  \ 多评估者”选项卡。在显示的页面上，点击“添加新模板”以创建一个新模板。这将显示 `SuccessStore` 中提供的预配置 360 评估反馈表单。点击模板旁边的单选按钮以选择该特定模板。对于我们的讨论，我们将选择名为“[PE\
  \ 360 Multi-rater form](https://salesdemo.successfactors.eu/xi/ui/admin/pages/template/manageTemplates.xhtml?tab=goal&_s.crb=wFF78bV0cwQHLiORz1KpoU8UDaAdnWH9eQvTq1vB3qw%253d)”的模板。点击“添加到我的实例”以创建新表单。当您点击“添加到我的实例”时，系统将显示一个新的对话框。在该对话框中，您可以输入模板的新名称以符合您的业务需求。点击“保存”以保存您的设置。系统现在将显示模板供您配置。您可以在需要的地方进行更改。\n\
  \n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig8_HTML.jpg](img/499651_1_En_12_Fig8_HTML.jpg)\n\
  \n**图 12-8** 配置 360 评估反馈表单\n\n在显示的页面上，点击“常规设置”。在“常规设置”中，您可以提供模板的名称和描述。在“常规设置”中，您可以配置“路线图”和“评分量表”设置。对于我们的讨论，我们将配置我们之前讨论过的路线图\
  \ **360 - 员工与经理流程**。如果您希望 360 评估流程的参与者保持匿名，您可以选择“在 360 报告功能中启用匿名”选项。\n\n> **注意**\n\
  >\n> “路线图”设置和“评分量表”设置都应在“常规设置”中预先配置。路线图是通过执行配置步骤“管理路线图”来配置的，而评分量表则是在“评分量表”屏幕上配置的。\n\
  \n完成“常规设置”部分的配置后，点击“编辑字段和部分”部分。\n\n我们要回顾的第一个部分是“员工信息”。在 360 评估反馈表单中，“员工信息”部分将显示与员工相关的数据。在“管理模板\
  \ – 员工信息”部分，我们可以命名该部分的名称、输入该部分的描述，并选择员工数据的哪些详细信息（参见图 12-9）应显示在 360 评估反馈表单中。\n\n\
  ![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig9_HTML.jpg](img/499651_1_En_12_Fig9_HTML.jpg)\n\
  \n**图 12-9** 配置员工信息部分\n\n点击“保存”以保存您的更改。\n\n> **注意**\n>\n> 默认情况下，员工的名字和姓氏将显示在 360\
  \ 评估反馈表单中。此设置无法更改。\n\n在 360 评估反馈表单中，“评估日期”部分将显示您在启动表单时输入的日期。在“管理模板 - 评估日期”部分，您可以命名该部分，以及输入该部分的描述（参见图\
  \ 12-10）。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig10_HTML.jpg](img/499651_1_En_12_Fig10_HTML.jpg)\n\
  \n**图 12-10** 配置评估日期部分\n\n\n\n在`Rater Selection`（评估者选择）部分，您可以配置将被分配到表单的不同评估者。您可以更改默认的节名称，并在需要时输入描述。此部分配置的评估者默认会被分配到\
  \ 360 度评估反馈表单，并且您配置的评估者标签会显示在分配给评估者的角色旁边。\n\n如图 12-11 所示，您可以将直接下属、经理、二级经理、矩阵经理、HR\
  \ 人员以及这些参与者的多个层级作为指定角色添加到流程中。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig11_HTML.jpg](img/499651_1_En_12_Fig11_HTML.jpg)\n\
  \n图 12-11 配置评估者选择部分\n\n- 在`Rater Category Name`（评估者类别名称）列中，您可以输入分配给流程的角色的标签。此标签会显示给用户（员工/经理/HR），他们可以选择想要联系的参与者列表以获取反馈。\n\
  - 当您选择`Auto Include in Form`（自动包含在表单中）时，您定义的角色将在表单启动时自动包含在流程中。\n- 在`Role`（角色）列中，您定义需要包含在流程中的角色。配置的角色会在表单发送给评估者进行反馈时自动分配给他们。此处配置的角色将帮助用户（员工/经理/HR）确定谁可以被选择以联系获取反馈。\n\
  - `Do not allow user to remove`（不允许用户移除）列用于确定用户是否有权从参与者列表中移除已定义的角色。如果您为定义的角色选择了此列，那么该角色将强制包含在\
  \ 360 度评估反馈流程中。\n\n在`Manage Templates – Introduction`（管理模板 – 介绍）部分（见图 12-12），您可以输入关于\
  \ 360 度评估反馈表单以及流程中对参与者期望的一些介绍文本。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig12_HTML.jpg](img/499651_1_En_12_Fig12_HTML.jpg)\n\
  \n图 12-12 介绍部分\n\n**提示**\n\n在介绍部分，客户可以提供一份文档的链接，该文档详细说明了 360 度评估反馈流程的内容，以及该流程如何在企业范围内用于支持员工的发展愿景。\n\
  \n在`Manage Templates – Competency Feedback`（管理模板 – 能力反馈）部分，您可以配置要包含在 360 度评估反馈表单中的能力项。能力项可以设置为`Core`（核心）或`Job\
  \ Specific`（特定岗位）。与配置其他部分类似，您可以输入节名称和该节的介绍。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig13_HTML.jpg](img/499651_1_En_12_Fig13_HTML.jpg)\n\
  \n图 12-13 配置能力部分\n\n- 在`Section Type`（节类型）中（见图 12-13），您可以选择是向表单添加`Job Specific`（特定岗位）、`Core`（核心）还是两种类型的能力项。\n\
  \n**注意**\n\n`Core`（核心）和`Job Specific`（特定岗位）能力项应在系统中配置并可用，以便您在模板中使用。\n\n**注意**\n\n\
  如果您选择`Job Specific`（特定岗位），则在表单启动时，系统会在表单中填充特定于岗位的能力项。能力项是作为`Job Profile Builder`（岗位档案生成器）配置的一部分添加的。更多信息请参见第\
  \ 3 章。\n\n- `Unable to Rate`（无法评级）字段是评定量表的一部分，但不包含在总体评分中。`Unable to Rate`等同于`N/A`。您可以使用系统默认的`Unable\
  \ to Rate`，或将其更改为`N/A`或您想要显示的任何文本。`Unable to Rate`评级意味着参与者没有足够的信息，或者拒绝对该特定能力项进行评级。\n\
  \n点击`Unable to Rate`（无法评级）字段下方显示的`Show advanced options`（显示高级选项）。这将显示额外的配置选项（见图\
  \ 12-14）。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig14_HTML.jpg](img/499651_1_En_12_Fig14_HTML.jpg)\n\
  \n图 12-14 配置能力部分的进阶选项\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig15_HTML.jpg](img/499651_1_En_12_Fig15_HTML.jpg)\n\
  \n图 12-15 配置能力部分的行为描述\n\n- `Allow users to add competencies`（允许用户添加能力项）：如果选择此选项，将允许用户能够从能力项列表中添加能力项到表单中。\n\
  - `Show Behaviors`（显示行为描述）：如果选择此选项，并且所选能力项关联了行为描述，则该行为描述将显示在表单中。\n\n    如果选择此选项，系统将显示额外的选项（见图\
  \ 12-15）。\n\n- `Display Mode`（显示模式）：在显示模式下，您可以选择在能力评级的上方或下方显示行为描述。默认情况下，行为描述将显示在能力评级下方。\n\
  - `Filter By Job Code`（按岗位代码筛选）：如果您只想显示特定于岗位的行为描述，请选择此选项。\n- `Rating on behavior`（对行为描述评级）：如果您想启用对与能力项关联的行为描述进行评级的选项，请选择此选项。\n\
  - `Include the ability to rate`（包含评级能力）：如果您希望评估者使用模板中配置的评定量表对能力项（以及启用时的行为描述）进行评级，请选择此选项。如果未选择此选项，则评估者将无法对能力项进行评级。\n\
  \n当您选择`Include the ability to rate`（包含评级能力）选项时，系统将显示额外的选项（见图 12-16）。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig16_HTML.jpg](img/499651_1_En_12_Fig16_HTML.jpg)\n\
  \n图 12-16 配置能力部分的评级与评论\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig17_HTML.jpg](img/499651_1_En_12_Fig17_HTML.jpg)\n\
  \n图 12-17 配置能力部分的单一评级框\n\n- `Everyone has their own rating box for each item`（每个人在每个项目上都有自己的评级框）：如果选择此选项，每个评估者都将拥有自己的评级框。评估者的评级框将显示在员工自评评级框旁边。选择此选项后，系统将显示额外的选项。\n\
  \n    - `The Final score is the EM’s rating`（最终分数为员工经理的评级）：当选择此选项时，表单将显示评估者提供的评级。系统会将员工经理（角色：EM）提供的分数视为最终分数。\n\
  \    - `The final score can be granted to any role by permission`（最终分数可通过权限授予任何角色）：当选择此选项时，您可以配置将哪个角色提供的评级视为最终分数。\n\
  \n**注意** 大家各自拥有对每个项目的评级框是 360 度评估反馈流程中的建议做法。这为经理和当事人（如果有权限）提供了审查其他评估者提供的反馈的机会。\n\
  \n- `Everyone shares one rating box for each item`（每个人在每个项目上共享一个评级框）：如果选择此选项，表单中只会显示一个评级框。哪些角色可以访问评级框可以在模板中进行权限设置。如果评级框由多个评估者共享，则最后输入的分数将被计为该能力项的最终分数。选择此选项后，系统将显示一个额外的选项（见图\
  \ 12-17）。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n-   **除拥有私人自评评分框的员工外**：\
  \ 如果您选择此选项，系统将为员工显示一个独立的评分框，员工可使用该框进行自我评估。\n-   **为每个项目添加评论**： 如果选择此选项，每个能力项将显示一个评论框。\n\
  -   **添加总体评论**： 如果选择此选项，表单将显示一个章节评论框。\n-   **并排或上下显示经理和员工评论**： 在此部分中，您可以配置评论框的显示方式。两个选项是并排显示或上下堆叠显示（参见图\
  \ 12-16）。\n\n我们将配置的最后一个部分是“摘要”部分。此部分提供表单中所有评估章节的汇总概述。摘要部分将提供每个评估部分的平均分数，以及在表单级别的总体分数。与前面的部分类似，在摘要部分中，您可以在需要时输入自定义名称，也可以使用系统默认值。您还可以选择提供该部分的描述。\n\
  \n此部分可配置的字段如下所示（参见图 12-18）：\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig18_HTML.jpg](img/499651_1_En_12_Fig18_HTML.jpg)\n\
  \n**图 12-18** 配置摘要部分\n\n-   **允许手动评分**： 如果选择此选项，表单将提供一个手动输入总体得分的选项。此总体得分将覆盖系统生成的总体评分。但是，如果选择此选项，系统将把手动输入的评分视为最终分数。因此，即使您确定系统生成的评分为最终分数，您仍然需要手动输入一个可能与系统生成的总体得分相同的分数。\n\
  \n选择此选项后，系统将显示附加选项：\n    1.  每个人都有自己的每个项目的评分框\n    2.  每个人共享一个每个项目的评分框\n\n勾选第一个选项将显示附加选项：\n\
  \    -   (a) 最终评分是员工经理的评分\n    -   (b) 最终评分可以通过权限授予任何角色\n\n所有这些选项的行为与我们之前在能力部分讨论的类似。\n\
  \n-   **权重**： 如果您单击`权重平均分配`按钮，系统将自动平均分配每个评估部分的权重，使其总和为 100%。在我们的讨论中，我们只有一个评估部分：能力反馈。因此，系统为该部分提供了\
  \ 100.0。\n\n-   **无法评分**： 此行为与我们之前在能力部分讨论的类似。\n\n> **提示**  \n> 我们可以重新排列模板中不同部分的显示顺序。要将某个部分移动到不同的顺序，请将鼠标悬停在该部分名称上。系统将显示“三个垂直点”（参见图\
  \ 12-22）。如果将鼠标移到这三个垂直点上，光标将变成一个方向十字。抓住它并将其移动到您希望该部分显示的位置。\n\n您还有一个向模板`添加新部分`的选项。此新部分必须属于以下部分类型之一：附加评论、能力、年中、目标或签名（参见图\
  \ 12-19）。新部分的配置将与我们之前在前面的部分中讨论的类似。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig19_HTML.jpg](img/499651_1_En_12_Fig19_HTML.jpg)\n\
  \n**图 12-19** 可用的部分类型\n\n> **注意**  \n> 我们通常添加一个新部分来捕获未在交付部分中捕获的评论或评分。例如，我们可能希望评估者对员工在工作特定能力或核心能力方面的表现进行评分。或者，我们可能会添加一个部分来捕获员工及其经理的签名，以完成\
  \ 360 度评估反馈表。\n\n就我们的讨论而言，我们将添加一个部分；类型为`目标`作为新部分。与其他部分类似，我们可以输入新的部分名称，并提供部分描述。\n\
  \n在部分类型中（参见图 12-20），您可以在目标和个与发展计划之间进行选择。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig20_HTML.jpg](img/499651_1_En_12_Fig20_HTML.jpg)\n\
  \n**图 12-20** 添加目标部分\n\n如果我们选择`目标部分`，下拉菜单“选择您要链接的目标计划”将显示系统中处于活动状态的目标计划。\n\n如果我们选择`个人发展计划部分`（参见图\
  \ 12-21），下拉菜单将显示系统中可用的活跃发展计划。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig21_HTML.jpg](img/499651_1_En_12_Fig21_HTML.jpg)\n\
  \n**图 12-21** 添加发展计划部分\n\n如果您希望评估者能够对目标进行评分，请选择`包含评分功能`选项。如果您不希望私人目标显示在 360 度评估反馈表中，请选择`排除私人目标`选项。如果您希望将目标权重计入分数计算，请选择`包含输入权重功能`选项。如果您希望评估者为每个项目添加评论，请选择`为每个项目添加评论`选项。如果您希望评估者提供总体评论，请选择`添加总体评论`选项。保存您的更改。\n\
  \n> **提示**  \n> 如果您需要评估者对目标和个人发展计划都进行评分，则创建两个不同的部分。一个部分可用于目标，第二个部分用于个人发展计划。\n\n\
  我们可以重新排列模板中不同部分的显示顺序。要将某个部分移动到不同的顺序，请将鼠标悬停在该部分名称上。系统将显示一个点状网格。如果将鼠标移到点上，光标将变成一个方向十字（参见图\
  \ 12-22）。抓住它并将其移动到您希望该部分显示的位置。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig22_HTML.jpg](img/499651_1_En_12_Fig22_HTML.jpg)\n\
  \n**图 12-22** 移动部分\n\n**表单预览**  \n您可以通过单击`预览`来预览您已配置的模板（参见图 12-23）。在配置期间或启动表单之前预览表单，将帮助您理解和直观地了解\
  \ 360 度评估反馈表的外观。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig23_HTML.jpg](img/499651_1_En_12_Fig23_HTML.jpg)\n\
  \n**图 12-23** 预览已配置的表单\n\n### 表单模板设置\n\n模板的管理设置也可以在`表单模板设置`部分中进行配置。您可以通过执行`表单模板设置`来访问配置屏幕。配置屏幕`表单模板设置`的登陆页面将显示系统中已配置并可用的所有表单。从显示的表单列表中，选择您要配置的\
  \ 360 度评估反馈模板。登陆页面将显示可供配置的管理设置（参见图 12-24）。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig24_HTML.jpg](img/499651_1_En_12_Fig24_HTML.jpg)\n\
  \n**图 12-24** 配置步骤：表单模板设置\n\n\n\n## 访问表单模板设置\n\n您可以在“管理模板”配置屏幕中，通过模板访问“表单模板设置”。在“管理模板\
  \ ➤ 表单模板”中显示的模板中，单击“常规设置”，滚动到该部分末尾。“高级设置”链接会将您带到“表单模板设置”配置屏幕。\n\n在本节（参见表 12-3）中，我们将回顾\
  \ 360 度评估反馈表单的特定管理设置。（注意：关于“表单模板设置”部分的详细讨论，请参阅第 6 章“绩效管理简介”及相关章节。）\n\n### 表 12-3\
  \ 表单模板设置管理设置\n\n| 管理设置 | 描述 |\n| --- | --- |\n| **模板名称** | 这是表单启动时将显示的名称。您可以根据需要以不同语言配置模板名称。**注意：**\
  \ 如果表单启动后模板名称发生更改，则新名称仅反映在名称更改后启动的表单上。任何正在进行的表单都不会显示新名称。 |\n| **模板类型** | 这是一个只读字段。模板类型反映了为其配置模板的流程。\
  \ |\n| **路由映射** | 此处显示我们之前配置的路由映射。如有需要，您可以更改路由映射。单击下拉菜单将显示系统中所有可用的已配置路由映射。 |\n|\
  \ **模板状态** | 此字段有两个值：`Enable` 和 `Disable`。如果模板处于活动状态，则其状态为 `Enable`。如果您不再使用该模板，请将状态更改为\
  \ `Disable`。 |\n| **当旧经理是流程负责人时，将进行中的文档的自动流程负责人更改为新经理（仅适用于 360 度评估）** | 在 360 度评估反馈过程中，如果员工的经理发生变更，选择此选项将自动将进行中的表单转移给新经理。新经理也被标记为该流程的新流程负责人。**注意：**\
  \ 您也可以在“更改 360 度流程负责人”配置屏幕上更改 360 度评估反馈表单的流程负责人。 |\n| **当旧经理是流程负责人时，将已完成文档的自动流程负责人更改为新经理（仅适用于\
  \ 360 度评估）** | 选择此选项将自动将完整的文档转移给新经理。新经理也被标记为该流程的新流程负责人。 |\n| **将 360 度文档从旧经理的收件箱文件夹转移到新经理时，不要自动拒绝旧经理在评估中的参与者表单**\
  \ | 选择此选项将允许将旧经理正在进行的参与者表单转移给新经理。**注意：** 当表单转移给新经理时，新经理可以联系旧经理（离线方式）并收集他们的意见/反馈，以评估正在进行的表单。\
  \ |\n| **当转移处于评估阶段的 360 度文档时，将新经理添加为参与者（如果新经理是被移除的参与者，他们将被重新添加）** | 选择此选项将把新经理添加为进行中表单的参与者。\
  \ |\n| **在 360 度临时报告中隐藏已删除用户的记录（注意：此配置后需要报告同步，以确保现有表单中的已删除用户不会显示在 360 度评估临时报告中。请前往\
  \ `Company Settings` 并在 `360 Multi-Rater Subject` 中运行同步）** | 选择此选项将在“报告中心”生成报告时隐藏已删除用户的记录。\
  \ |\n| **详细 360 度报告权限控制：启用详细 360 度报告权限，适用于：** | 启用此选项将在 360 度评估反馈表单上显示“详细 360 度报告”链接。您可以仅为特定角色启用此选项。\
  \ |\n| **在 360 度表单中为以下角色隐藏 `decline to participate` 按钮：** | 您可以启用此选项，仅为选定的角色隐藏 `decline\
  \ to participate` 按钮。**注意：** 如果您选择了所有角色，则该按钮将不会显示在表单的所有角色中。 |\n| **在 360 度评估开始后，为以下角色启用添加新参与者：**\
  \ | 您可以启用此选项，为选定的角色提供 `add new participants` 的选项。 |\n| **为以下角色启用 `Send Back`：**\
  \ | 当您为选定的角色启用此选项时，他们将看到 `Send to Previous Step` 选项。当参与者单击该选项时，系统会将表单发回给路由映射中的先前参与者，以获取更多输入。\
  \ |\n| **为以下角色启用发送提醒电子邮件：** | 启用此选项后，系统将发送提醒电子邮件以完成流程。**注意：** 要使用此选项，您应该启用配置屏幕 `E-Mail\
  \ Notification Templates Settings` 上的 `Document Due Notification` 开关。要向外部参与者发送提醒电子邮件，应在同一配置屏幕上启用\
  \ `360 Document Evaluation Notification for External Participant` 开关。 |\n| **在 360\
  \ 度评估开始后，为以下角色启用移除参与者：** | 当为进行中的表单启用此选项时，选定的角色将能够从 360 度评估反馈流程中移除参与者。 |\n| **从详细\
  \ 360 度报告中启用差距分析视图** | 启用此选项后，系统将显示差距分析视图。**注意：** 差距分析允许您比较两组评分者之间的评分，并了解评分中的显著性。\
  \ |\n| **从详细 360 度报告中启用排名视图** | 启用此选项后，系统将显示排名视图。**注意：** 排名视图使您能够在一个列表中查看所有类别的能力或行为。类别可以按从高到低或从低到高排序。\
  \ |\n| **详细 360 度报告权限控制：启用详细 360 度报告权限，适用于** | 选中此选项后，为其启用（并授予权限）的角色将在 360 度评估反馈表单上看到“详细\
  \ 360 度报告”链接。 |\n| **详细 360 度报告权限控制：使用表单 XML** | 启用此选项后，在模板 XML 中，您可以授予在管理设置“启用详细\
