  \n### 职位档案构建器内容\n\n在表 3-2 中，我们将审查职位档案内容类型。\n\n通过此对`JPB`的介绍，我们将开始审查各个内容类型的配置。\n\n\
  ## 职族\n\n`职族`是`JPB`中的基础内容类型。所有其他内容都建立在职族内容之上，或与职族内容相关。在本节中，我们将审查如何在`JPB`中构建一个职族。\n\
  \n### 使用 SuccessStore 创建职族\n\n我们可以通过从`SuccessStore`下载交付的内容，在 SAP SuccessFactors\
  \ 中创建职族。\n\n> **说明**\n>\n> 最佳实践是利用`SuccessStore`中可用的内容。如有需要，你也可以通过手动构建所需内容来创建职族和角色。\n\
  \n前往管理中心，点击`管理职位档案内容`。在显示的页面上，点击下拉菜单`选择内容类型`，然后选择`设置职族和角色`。在显示的页面上，点击`从 SuccessStore\
  \ 添加职族`。这将显示`管理 SuccessStore 技能内容`配置页面。\n\n> **说明**\n>\n> 配置页面`管理职位档案内容`包含两个标签页：`职族`和`角色`。请确保你处于`职族`标签页。见图\
  \ 3-8。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig8_HTML.jpg](img/499651_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\n`管理 SuccessStore 技能内容`页面\n\n在显示的页面上，选择你想要添加的职族。这将显示与该职族关联的所有角色。选择你想要添加的角色。这将显示与该角色关联的所有技能。选项面板提供给你`添加角色`和`添加角色\
  \ + 职族`的选项。它还提供“同时添加映射技能”的选项。点击`添加`来添加你的选择。当你不再想添加更多职族时，点击“我已完成”。这将带你返回配置页面`管理职位档案内容`。在`管理职位档案内容`页面上，你将看到你从`SuccessStore`添加的新职族。\n\
  \n\n\n### 通过用户界面创建职能门类\n\n您可以通过用户界面手动创建职能门类。前往管理中心，点击“管理职位档案内容”（`Manage Job Profile\
  \ Content`）的配置页面。在显示的页面上，点击“选择内容类型”（`Select Content Type`）下拉菜单，选择“设置职能门类与角色”（`Set\
  \ Up Families and Roles`）。在显示的页面上，点击“创建职能门类”（`Create Family`）。\n\n在下一个显示的页面（见图 3-9）上，输入您正在创建的职能门类的名称。（此为必填字段。）\n\
  \n点击“映射技能”（`Map Skills`）以将某些技能映射到新创建的职能门类。在显示的页面（见图 3-10）上，在下拉菜单中选择“按类别浏览的未分配技能”（`Unassigned\
  \ Skills Browsed by Category`）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig10_HTML.jpg](img/499651_1_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10**\n\n通过选择“按类别浏览的未分配技能”将技能映射到职能门类\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig9_HTML.jpg](img/499651_1_En_3_Fig9_HTML.jpg)\n\
  \n**图 3-9**\n\n在用户界面中创建职能门类\n\n1.  点击显示的库。这将显示可用的类别。\n2.  选择您感兴趣的类别。这将显示属于所选类别的组。\n\
  3.  选择您感兴趣的组。这将显示该组可用的技能。\n4.  选择您感兴趣的技能。如果您想将所选技能映射到一个角色，请点击选项窗格中显示的“映射”（`Map`）。\n\
  5.  点击“完成”（“I’m Done”）以结束操作。\n\n这将带您返回“创建新内容（职能门类）”（`Create New Content (Family)`）配置页面。您会看到新添加的技能已被添加到该职能门类中。\n\
  \n您可以为新添加的技能添加熟练度等级（见图 3-11）。点击“熟练度等级”（`Proficiency Level`）列中的下拉菜单，为每个技能选择熟练度等级。为每个技能添加熟练度等级将有助于管理者评估其员工相对于职位所需熟练度等级的掌握情况。同时，员工也能识别出任何技能差距，并参加培训项目以填补所识别的差距。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig11_HTML.jpg](img/499651_1_En_3_Fig11_HTML.jpg)\n\
  \n**图 3-11**\n\n为新添加的技能添加熟练度\n\n**注意**\n\n我们将在本章稍后部分介绍技能门户组件。\n\n我们也可以通过选择“按职位职能门类浏览的基于职能门类的技能”（`Family-based\
  \ Skills Browsed by Job Family`）选项来将技能映射到职能门类。\n\n具体来说，要将技能映射到职能门类，请点击您要为其映射技能的职能门类。分配给该职能门类的角色将被显示出来。在显示的页面上，点击“已映射技能”（`Mapped\
  \ Skills`）选项。在下一个显示的页面上，您将看到“映射技能”（`Map Skills`）选项。在显示的页面上，从下拉菜单中选择“按职位职能门类浏览的基于职能门类的技能”（`Family-based\
  \ Skills Browsed by Job Family`）选项（见图 3-12）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig12_HTML.jpg](img/499651_1_En_3_Fig12_HTML.jpg)\n\
  \n**图 3-12**\n\n通过选择“按职位职能门类浏览的基于职能门类的技能”将技能映射到职能门类\n\n这将显示系统中配置的所有职能门类。选择您要为其分配技能的职能门类。这将显示分配给该职能门类的角色。选择您要为其分配技能的角色。\n\
  \n这将显示系统中可用的技能。选择所有需要的技能。\n\n点击“映射”（`Map`）。这会将技能分配给特定角色。\n\n点击“完成”（“I’m done.”）。\n\
  \n这将带您进入显示分配给该角色和职能门类技能的页面（见图 3-13）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig13_HTML.jpg](img/499651_1_En_3_Fig13_HTML.jpg)\n\
  \n**图 3-13**\n\n列出分配给职能门类和角色的技能\n\n### 编辑技能\n\n在显示的页面上，点击任意技能。新页面（见图 3-14）将显示该技能的内容，以及所分配熟练度的描述。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig14_HTML.jpg](img/499651_1_En_3_Fig14_HTML.jpg)\n\
  \n**图 3-14**\n\n编辑技能的内容\n\n客户通常会购买第三方工具来获取技能内容和熟练度描述。通常，客户希望编辑这些内容以符合企业文化及其业务性质。另一些时候，在导入内容时，可能会导入外来字符（例如图\
  \ 3-14 中所示的`&ʿ`），因此我们必须编辑内容以将其删除。随着企业对职位档案的价值和附加值越来越熟悉，客户可能还希望更改技能的类别。您可以在“编辑：技能”（`Edit:\
  \ Skill`）页面上进行此类编辑。\n\n#### 角色\n\n在系统中创建角色与创建职能门类类似。前往管理中心，点击“管理职位档案内容”（`Manage\
  \ Job Profile Content`）。在显示的页面上，点击“角色”（`Roles`）选项卡。页面中将显示系统中不同的角色及其所属的职能门类（见图 3-15）。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig15_HTML.jpg](img/499651_1_En_3_Fig15_HTML.jpg)\n\
  \n**图 3-15**\n\n实例中可用的角色\n\n点击“创建角色”（`Create Role`）。这将显示“创建新内容（角色）”（`Create New\
  \ Content (Role)`）。输入角色的名称。在“职能门类”（`Family`）下拉字段中，选择该角色将要分配到的职能门类名称。现在我们需要将角色映射到职位代码。\n\
  \n点击“映射职位代码”（`Map Job Codes`）。在显示的对话框中（图 3-16），您需要输入要分配的职位代码的前导字符。系统会根据前导字符显示所有匹配您输入内容的职位代码。如果有多个匹配项，选项将以下拉菜单形式显示。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig16_HTML.jpg](img/499651_1_En_3_Fig16_HTML.jpg)\n\
  \n**图 3-16**\n\n为角色添加职位代码\n\n选择职位代码后，您需要选择其用途。可用选项为“默认”（`Default`）和“继任”（`Succession`）。点击“保存”（`Save`）以添加职位代码。\n\
  \n如果您想添加更多职位代码，请点击“添加职位代码”（`Add Job Code`）。\n\n点击“创建角色”（`Create Role`）以完成设置。\n\n\
  如果您的系统环境中包含员工中心（Employee Central），请参考知识库文章 2832345，“使用 JDM 或 JPB - 员工档案时，职位代码或分类与角色映射的区别”，以了解如何配置\
  \ JPB。\n\n将显示“管理职位档案内容”（`Manage Job Profile Content`）页面，其中包含新创建的角色。\n\n**注意**\n\n\
  您可以通过点击相应的选项卡，为新创建的角色添加技能、胜任力和人才库。该过程类似于为角色添加职位代码。当您映射胜任力时，与该胜任力相关的行为和胜任力类型也会被映射到职能门类。请注意，当您将人才库映射到角色时，其前提条件是系统中已存在该人才库。创建人才库的过程类似于创建胜任力类型，这将在本章后面讨论。\n\
  \n2) 您可以使用 SuccessStore 创建角色。该过程类似于使用 SuccessStore 创建职能门类。\n\n\n\n#### 技能\n\n在用户界面和`SuccessStore`中创建技能的过程与我们之前讨论的创建职能的过程类似。\n\
  \n我们之前已经讨论过如何编辑技能内容，以及如何为技能分配熟练度并编辑已分配给技能的熟练度。\n\n**提示**\n\n如果您的人员概要文件中有一个技能门户部件（见图\
  \ 3-17），您可以查看分配给该岗位的技能。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig17_HTML.jpg](img/499651_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17：人员概要文件中的技能门户部件\n\n如果员工拥有相应权限，他们可以添加技能并进行自我评分。经理的评分以及该技能的期望评分也会显示。此视图极大地帮助员工了解在已分配技能中是否存在任何能力差距。理解能力及其差距能极大地帮助员工制定学习计划。当您点击“查找拥有这些技能的其他人员”链接时，系统将返回具有类似技能分配的员工的搜索结果。这极大地增强了员工与同事社交并互相学习经验的体验。\n\
  \n### 胜任力与胜任力类型\n\n*胜任力*是员工执行任务的能力。胜任力包括已识别/定义的行为集合和胜任力类型。胜任力类型是系统中对胜任力进行分类的方式，并且可以独立维护。将胜任力分配给职位代码，使组织能够识别需要为员工发展的胜任力，使主管能够识别需要投入的胜任力，并帮助员工识别需要填补的胜任力差距。\n\
  \n在本节中，我们将讨论如何在`SuccessFactors`中创建和维护胜任力及胜任力类型。\n\n如果您系统中部署了`Employee Central`，请参考知识库文章\
  \ 2080013，“如何管理职能、角色和胜任力映射 - `SuccessFactors Employee Central`”。\n\n**注意**\n\n最佳实践是利用`SuccessStore`中可用的内容。或者，您也可以通过手动构建所需内容来创建胜任力和胜任力类型。\n\
  \n#### 胜任力类型\n\n在`SuccessFactors`中，您可以在`管理数据`配置步骤中创建和维护胜任力类型。胜任力类型也可以通过`导入和导出数据`配置步骤批量导入系统。\n\
  \n我们可以通过前往管理中心并点击`管理数据`来手动创建胜任力类型。在显示的页面上，对于`新建`字段，选择`胜任力类型`。在`胜任力类型`界面（见图 3-18），输入胜任力类型的名称。点击`保存`以保存您的条目。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig18_HTML.jpg](img/499651_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18：创建胜任力类型\n\n**注意**\n\n`GUID`是一个唯一标识符，由系统自动生成。`GUID`无需任何配置。在您保存新的胜任力类型后，系统将生成一个`GUID`。\n\
  \n要在`管理数据`中维护现有的胜任力类型，请在搜索框中输入`胜任力类型`。在下一个字段中，选择您要维护的胜任力类型。您可以修改`胜任力类型名称`字段，然后点击`保存`以保存您的条目。\n\
  \n#### 批量创建胜任力类型\n\n您可以通过将数据导入系统来创建新的胜任力类型。具体来说，您可以前往管理中心并点击`导入和导出数据`。在显示的页面上，在字段“选择要执行的操作”中，选择选项“下载模板”。在字段`选择通用对象`中，选择`胜任力类型`。在字段“包含依赖项”中，选择`否`。点击`下载`。\n\
  \n在模板中（见图 3-19），输入胜任力类型的名称。您无需输入`GUID`。将 A 列留空。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig19_HTML.png](img/499651_1_En_3_Fig19_HTML.png)\n\
  \n图 3-19：导入胜任力类型模板\n\n**注意**\n\n通常，我们至少要输入`name.defaultValue`和`name.en_US`列中的胜任力类型名称。这些列可能会根据您使用的默认语言以及已激活的其他语言选项而变化。\n\
  \n现在，在`导入和导出数据`配置步骤（见图 3-20）中，在“选择要执行的操作”中选择`导入数据`。在字段`选择通用对象`中，选择`胜任力类型`。对于`清除类型`，选择`增量加载`。（注意：如果您选择`完全清除`选项，现有的胜任力类型将被新值覆盖。）点击`导入`以导入您的数据。（注意：如果您想验证模板格式是否正确，可以点击`验证`。如果验证失败，您可以找出导致错误的原因，进行更正，然后重试。）\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig20_HTML.jpg](img/499651_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20：导入胜任力类型\n\n在`监控作业`配置步骤中，您可以监控数据是否已导入或是否存在任何错误（见图 3-21）。您可以通过前往管理中心并点击`监控作业`来访问`监控作业`。在`监控作业`中，如果您向右滚动到`作业详情`列，您可以看到数据导入模板中有多少条记录以及已处理了多少条。`下载状态`列提供了一个超链接，用于下载作业的结果。下载的文件将在错误记录旁显示错误详情（如果有的话）。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig21_HTML.jpg](img/499651_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21：监控作业界面\n\n\n\n#### 能力\n\n如果要维护一项现有能力，请明确你要维护的对象。在与该能力对应的行中，你会看到一个齿轮图标（见图\
  \ 3-22）。点击齿轮后，你将看到 `Edit`（编辑）、`Inactivate`（停用）和 `Delete`（删除）选项。如果要对能力进行修改，请点击 `Edit`（编辑）。`Inactivate`（停用）不会删除该能力，但该能力将不再可用。`Delete`（删除）将永久删除该能力。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig22_HTML.jpg](img/499651_1_En_3_Fig22_HTML.jpg)\n\
  \n**图 3-22** 维护现有能力\n\n创建新能力的流程与我们之前介绍的内容类似。在“`Manage Job Profile Content`（管理职务档案内容）”页面上，从下拉菜单中选择“`Competency`（能力）”。要添加新能力，请点击“`Create\
  \ Competency`（创建能力）”。在显示的页面上（见图 3-23），你可以输入新能力的详细信息。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig23_HTML.jpg](img/499651_1_En_3_Fig23_HTML.jpg)\n\
  \n**图 3-23** 创建新能力\n\n如果要编辑某项能力，你可以点击该能力（显示在“`Competency Name`（能力名称）”列下）。系统将显示详细信息页面，你可以在该页面中对该能力进行修改。\n\
  \n当某项能力与某职务档案关联时，即使你停用了该能力，它仍会继续显示。如果你不想使用特定能力，且不希望该能力出现在职务档案中，则需要删除该能力。\n\n在“`Edit\
  \ Competency`（编辑能力）”页面（见图 3-23）上，输入能力名称以及要为其分配的库和类别。在“`Description`（描述）”字段中，输入该能力的描述。你可以选择该能力是否为核心能力。\n\
  \n> **注意：** 在“`Library`（库）”和“`Category`（类别）”字段中，你需要输入起始字符，系统将显示可用的数据。如果有多个选项可用，则选项将以下拉列表形式显示。\n\
  \n输入能力详情后，你可以为该能力定义行为。在“`Behaviors`（行为）”部分，点击“`Assign Behaviors`（分配行为）”。在显示的对话框中，输入行为名称并提供描述。点击“`OK`（确定）”保存你的输入。保存行为后，系统会为该行为生成一个\
  \ `GUID`。\n\n向下滚动页面，在“`Competency Type`（能力类型）”部分，你可以将能力分配到某一能力类型。你可以为一项能力分配多种能力类型。当一项能力被分配到多种能力类型时，在“`Manage\
  \ Job Profile Content (Competency)`（管理职务档案内容（能力））”页面的“`Competency Type`（能力类型）”列中，你会注意到显示第一个能力类型，后面跟着一个带超链接的加号（`+`）。加号会显示附加到此能力的其他能力类型的数量。将鼠标悬停在\
  \ `+` 符号上，将显示已分配的能力类型。\n\n> **注意：** 前提条件是，系统中应已配置好能力类型，并且可用于将能力分配到该能力类型。\n\n> **提示：**\
  \ 你可以通过导入和导出数据来创建新能力（请回顾我们之前讨论过此功能的能力类型相关章节）。我们建议你将其作为一项练习自行操作：创建新能力，然后将新能力与行为和能力类型关联起来。\n\
  \n> **注意：** 为其他职务档案构建器 (JPB) 对象创建内容的流程与我们目前讨论的内容类似。我们建议你将为其他 JPB 对象创建内容作为练习，以便熟悉该流程。\n\
  \n## 职务档案对象依赖关系\n\n在表 3-3 中，我们列出了可以与职务档案关联的职务档案对象类型以及其他职务档案构建器 (Job Profile Builder)\
  \ 对象。你可以在配置步骤“`Manage Job Profile Content`（管理职务档案内容）”和“`Manage Job Profile Content\
  \ Import/Export`（管理职务档案内容导入/导出）”中建立这些关联。我们已经在之前的章节中回顾了这两个配置步骤。\n\n\n\n### 管理职位档案内容导入/导出\n\
  \n我们可以通过将不同职位档案构建器对象的内容批量导入系统来创建它们。您也可以从同一个配置步骤导出不同 JPB 对象的内容。要访问该配置，请转到管理中心并点击`管理职位档案内容导入/导出`（见图\
  \ 3-24）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig24_HTML.jpg](img/499651_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24  \n管理职位档案内容导入/导出页面\n\n在显示的页面上，在`下载数据导入文件模板`字段中，您可以下载要为其导入内容的模板。以我们的审查为例，我们将下载`角色映射的人才库`对象的模板，并为此对象导入数据。\n\
  \n> **注意**  \n> `下载数据导入文件模板`下拉列表中列出的职位档案构建器对象将在“职位档案对象依赖关系”一节中予以审查。\n\n当您选择一个对象进行下载时，您可以选择下载包含数据的模板，或者下载空白模板。如图\
  \ 3-25 所示，如果您选择`是`，将下载包含数据的模板。选择`否`将下载空白模板。如果您是 JPB 配置的新手，我们建议您下载包含数据的模板。您可以查看数据的构建方式，并在填充模板数据时将其作为参考。（注意：在导入数据之前，请记住从模板中删除下载的数据。）\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig25_HTML.jpg](img/499651_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25  \n下载模板\n\n> **注意**  \n> 如果您正在下载包含数据的模板，则需要从配置步骤`监控职位`中下载该模板。如果只是一个空白模板，系统将从配置步骤`管理职位档案内容导入/导出`中下载该模板。\n\
  \n由于 JPB 对象基于 MDF，因此您可以在不同 JPB 对象之间建立关联，也可以在相同类型的 JPB 对象之间建立父子关系。因此，如果您正在建立此类关联，请务必复制您计划关联的对象记录的\
  \ GUID。\n\n如前所述，以我们的讨论为例，我们将为`角色映射的人才库`对象导入数据。在导入这些数据之前，我们应该检查我们计划与该对象关联的人才库是否存在于系统中。如果不存在，我们需要创建这些模板。\n\
  \n因此，为`角色映射的人才库`对象导入数据的过程如下：\n\n1.  创建人才库。  \n    1.1. 我们之前讨论过，人才库是在配置步骤`管理数据`中创建的，而要导入/导出人才库，我们需要执行配置步骤`导入和导出数据`。\
  \  \n    1.2. 创建人才库后，我们需要记下新创建人才库的代码。这是必需的，因为我们正在将角色与人才库相关联。  \n        > **提示：**\
  \ 您可以在配置步骤`管理数据`中找到人才库记录的代码。在显示的页面上（见图 3-26），在搜索字段中输入**人才库**。在下一个字段中，选择您正在考虑的人才库。记下`代码`字段中显示的代码。（注意：此代码对于每个人才库记录都是唯一的。）\n\
  \n        ![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig26_HTML.jpg](img/499651_1_En_3_Fig26_HTML.jpg)\n\
  \n        图 3-26  \n        在配置步骤`管理数据`中查看的人才库数据\n\n2.  完成前述步骤后，填写`角色映射的人才库`对象的模板并执行导入。\n\
  \n3.  验证导入是否成功完成。\n\n### 职位档案模板\n\n我们可以使用职位档案模板为系统中配置的职位档案提供一致的外观和风格。职位档案模板通常包含多个分区。您可以定义哪些分区是必需的，并定义它们在分区中的显示顺序。您可以将一个职位档案模板分配给一个或多个职位族。\n\
  \n在本节中，我们将讨论职位档案模板、如何配置职位档案模板，以及如何将它们分配给职位族。\n\n> **注意**  \n> 您可以在一个实例中配置多个职位档案模板。您可以为系统中的所有角色使用一个职位档案模板，或者为不同角色分配不同的职位档案模板。例如，您可以为一个被标识为“个人贡献者”的角色提供一种职位档案模板，为被定义为“经理”的角色提供另一种不同的职位档案模板，并为被定义为“高管”的角色提供另一种职位档案模板。\n\
  \n\n\n### 配置职位简介模板\n\n要配置一个新的职位简介模板，请前往“管理中心”并点击`管理职位简介模板`。\n\n在显示的页面上（见图 3-27），点击`创建模板`。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig27_HTML.jpg](img/499651_1_En_3_Fig27_HTML.jpg)\n\
  \n*图 3-27：管理职位简介模板*\n\n**提示**  \n如果系统中已存在职位简介模板，您可以通过复制现有模板来创建新的职位简介模板。要复制现有模板，请点击现有模板的齿轮图标（齿轮图标显示在`操作`列中）。您将看到`编辑`、`复制`和`删除`选项。点击`复制`即可复制模板。\n\
  \n在显示的页面上，输入模板的名称。您可以添加希望与此职位简介模板关联的职位族。点击`下一步`。\n\n如前所述，职位简介模板由若干区块组成。每个区块将包含该职位特定“职位简介对象”的数据。点击`添加区块`以显示可以添加到职位简介模板的不同区块（见图\
  \ 3-28）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig28_HTML.jpg](img/499651_1_En_3_Fig28_HTML.jpg)\n\
  \n*图 3-28：向职位简介模板添加区块*\n\n对于我们的职位简介模板，我们将添加名为`详细描述`、`简短描述`、`胜任力`、`技能`、`教育背景`和`面试问题`的区块。\n\
  \n**提示**  \n我们可以将系统提供的职位简介对象重命名为符合业务需求的任何标题。例如，`详细描述`区块可以重命名为`职位描述`，`简短描述`可以重命名为`职位概要`。要重命名区块，请点击它。区块标题现在即可编辑。输入您想使用的标题并点击`“完成。”`。\n\
  \n此外，您可以通过拖放区块到职位简介模板中的适当位置来调整区块顺序。\n\n您可以继续配置职位简介模板（见图 3-29）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig29_HTML.jpg](img/499651_1_En_3_Fig29_HTML.jpg)\n\
  \n*图 3-29：配置职位简介模板*\n\n当您点击一个区块时（见图 3-30），该区块的选项将显示在区块右侧。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig30_HTML.jpg](img/499651_1_En_3_Fig30_HTML.jpg)\n\
  \n*图 3-30：向职位简介模板添加区块*\n\n以下是可用的区块选项：\n\n*   **设为必填区块**：如果您勾选此选项，则该区块在职位简介模板中为必填项。\n\
  \n    **注意**  \n    当您将一个区块设为必填时，该区块中会显示一个红色`*R*`标记。\n\n*   **仅限管理员可见**：您可以设置该区块仅在管理员接收职位简介确认时对其可见。\n\
  \n*   **在职位申请中显示**：职位简介模板可以与 SuccessFactors 招聘模块集成。集成配置后，勾选此选项将使该区块在职位申请中可见（可用），以便招聘人员等资源可以查看。\n\
  \n*   **在外部招聘公告中显示**：勾选此选项将使该区块发布在外部招聘公告中，以便外部候选人能够看到根据模板格式化的职位要求。\n\n*   **在内部招聘公告中显示**：勾选此选项将使该区块发布在内部招聘公告中，以便内部候选人能够看到根据模板格式化的职位要求。\n\
  \n**注意**  \n当一个区块被标记为“仅限管理员可见”时，该区块无法在职位申请中显示。因此，`在职位申请中显示`选项将不可选。\n\n您还可以配置字体样式及不同的字体选项（粗体、下划线和斜体）。\n\
  \n**提示**  \n最佳实践是使职位简介模板中所有区块的字体样式保持一致。\n\n现在您已经了解了这些背景信息，接下来我们将讨论职位简介以及如何在系统中配置职位简介。\n\
  \n\n\n### 职位简介\n\n以下是在系统中配置职位简介的前提条件：\n\n-   系统中应包含`JPB`对象的内容。\n-   职位简介模板已配置并可在系统中使用。\n\
  \n要在系统中设置职位简介，请前往管理中心，点击**管理职位简介**。\n\n在显示的页面（见图 3-31）上，您可以看到系统中已配置并可用的职位简介。您还可以根据职位所属的**职能**、**角色**或**职位**进行筛选。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig31_HTML.jpg](img/499651_1_En_3_Fig31_HTML.jpg)\n\
  \n**图 3-31** 管理职位简介\n\n要创建新的职位简介，请点击**创建职位简介**。\n\n在显示的页面（见图 3-32）上，您可以选择要分配的职位职能。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig32_HTML.jpg](img/499651_1_En_3_Fig32_HTML.jpg)\n\
  \n**图 3-32** 创建职位简介\n\n系统会显示该职位职能下分配的所有角色。选择您要分配的职位角色。\n\n**注意**  \n角色与职位简介之间存在一一对应的关系。换言之，一个角色只能分配给一个职位简介。\n\
  \n系统会显示分配给该职位角色的所有职位。您可以选择一个或多个职位进行职位简介的分配。将职位分配给职位简介后，点击**下一步**。\n\n此时将显示职位简介模板。\n\
  \n在审阅各个版块并向其中添加内容之前，我们需要先为职位简介输入一个标题。在职位简介的顶部，点击**输入职位简介名称**字段。您需要在此处输入职位简介的标题。（注意：如果您不输入标题，将无法保存职位简介。）\n\
  \n**注意**  \n如果某个职位简介内容（见图 3-33）已映射到该角色，则该已映射内容不可进行任何编辑。您会注意到，已映射到此角色的能力项显示为锁定状态（即不可编辑）。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig33_HTML.jpg](img/499651_1_En_3_Fig33_HTML.jpg)\n\
  \n**图 3-33** 不可编辑的版块\n\n如果您想为职位简介添加新内容，请高亮选中版块标题（例如图 3-33 中的标题），然后点击**编辑**。对于此职位简介，您可以添加系统中可用的新能力项。\n\
  \n对于尚未映射内容的`JPB`对象，您可以直接在职位简介中添加内容。将鼠标悬停在版块标题上时，会看到一个**添加**按钮。您可以点击**添加**来添加新内容。\n\
  \n**注意**  \n`JPB`对象的内容应在系统中完成配置并可用。\n\n点击**“我已完成”**以保存您的内容和更改。（注意：您需要手动激活职位简介。默认情况下，新创建的职位简介处于**草稿**状态。）这将带您进入配置页面**管理职位简介**。在显示的页面上，找到新创建的职位简介。在**操作**列下，点击齿轮图标。这将显示**编辑**、**复制**、**删除**和**激活**选项。点击**激活**以激活新创建的职位简介。\n\
  \n**注意**  \n在职位简介中，如果某个必填版块没有内容，您将无法激活该职位简介。当您尝试激活时，将收到一条错误消息（见图 3-34）。点击**更新职位简介**即可编辑该职位简介，并为必填版块填入内容。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig34_HTML.jpg](img/499651_1_En_3_Fig34_HTML.jpg)\n\
  \n**图 3-34** 尝试激活不完整的职位简介时出现的错误消息\n\n**注意**  \n`SuccessFactors` 不建议清除职位简介数据。清除职位简介数据可能会影响数据与实体的映射关系，也可能影响\
  \ `JPB` 招聘管理数据。\n\n### 职位简介生成器：工作流\n\n许多组织希望在职位简介发布前先进行审阅和批准。这将确保关键利益相关者了解相关更改，验证不同版块中是否已填入正确数据，并确保所做的更改与讨论内容保持一致。\n\
  \n在本节中，我们将讨论如何设置工作流，以及如何配置工作流使其显示在 `SuccessFactors` 首页的**待办事项**磁贴上。\n\n#### 配置职位简介生成器工作流\n\
  \n您可以通过前往管理中心，点击**管理组织、薪酬和职位结构**来创建工作流。在显示的页面上，从**新建**下拉菜单中选择**工作流**。\n\n如图 3-35\
  \ 所示，我们创建了一个名为**职位简介变更**的工作流。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig35_HTML.jpg](img/499651_1_En_3_Fig35_HTML.jpg)\n\
  \n**图 3-35** 创建工作流\n\n**注意**  \n动态组是根据特定标准配置的一组审批人。当您将动态组设为审批人时，该组的所有成员都会收到工作流审批、评论请求和工作流完成通知。\n\
  \n**审批人类型**的其他选项包括**动态角色**、**职位**和**职位关系**。\n\n要创建动态组，请前往管理中心，点击**管理工作流组**。在显示的页面（见图\
  \ 3-36）上，您可以点击**创建新组**来创建新组。您可以通过点击特定组名来编辑现有组。您还可以通过点击**克隆组**来复制现有组。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig36_HTML.jpg](img/499651_1_En_3_Fig36_HTML.jpg)\n\
  \n**图 3-36** 创建动态组\n\n-   对于**审批人类型**，选择**动态组**。对于**审批角色**，选择**动态组**。\n-   对于**编辑事务**，选择**编辑但不改变路由**。\n\
  \n**注意**  \n对于**编辑事务**字段，您有以下选项：\n\n-   ***无审批人行为***：您可以指定如果某个步骤未识别出审批人，工作流应如何执行。选项包括**跳过此步骤**和**终止工作流**。\n\
  -   ***尊重权限***：在此字段中，您指定工作流审批人是否有权查看工作流字段。选项如下：\n    -   ***是***：审批人有权查看他们拥有权限的工作流字段。\n\
  \    -   ***否***：审批人有权查看工作流字段，无论其分配的基于角色的权限如何。\n-   ***禁止编辑***：审批人无法编辑正在运行的工作流。\n\
  -   ***编辑并变更路由***：审批人可以编辑正在运行的工作流。当工作流重新提交时，系统会自动重新计算工作流审批路由。\n-   ***编辑但不改变路由***：审批人可以编辑正在运行的工作流。当工作流重新提交时，系统不会重新计算工作流审批路由。\n\
  -   ***仅编辑附件***：审批人只能编辑工作流的附件（如有）。\n\n点击**保存**以保存新配置的工作流。\n\n配置好 `JPB` 的工作流后，在下一节中，我们将探讨如何使工作流审批通知显示在\
  \ `SuccessFactors` 首页的**待办事项**磁贴中。\n\n**注意**  \n您需要被分配以下基于角色的权限，才能在系统中设置工作流：\n\n\
  -   • `管理工作流请求`\n-   • `管理工作流组`\n\n您还需要被分配到一个动态工作流组中。\n\n\n\n### 职位档案生成器工作流：在待办事项磁贴中显示\n\
  \n我们将对`职位档案草稿`对象定义进行配置更改。要进行更改，请转到管理中心并单击“配置对象定义”。\n\n在显示的页面（见图 3-37）上，在搜索框中选择`对象定义`。从对象定义列表中选择`职位档案草稿`。单击“执行操作”，然后单击“进行更正”。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig37_HTML.jpg](img/499651_1_En_3_Fig37_HTML.jpg)\n\
  \n图 3-37\n\n编辑职位档案草稿对象\n\n我们将对该对象进行以下更改：\n\n*   在`工作流路由`字段中，选择我们在“配置职位档案生成器工作流”一节中配置的工作流（`职位档案变更`）。\n\
  *   在`待处理数据`字段中，选择`否`选项。\n*   在`待办事项类别`字段中，选择`职位档案请求`选项。\n\n单击`保存`以保存更改。\n\n要查看哪些职位档案和工作流正在处理中，请转到配置步骤“管理职位档案”。在显示的页面上，您将看到两个选项卡：`职位档案`和`工作流中的职位档案`。要查看工作流，请单击`工作流中的职位档案`选项卡（见图\
  \ 3-38）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig38_HTML.jpg](img/499651_1_En_3_Fig38_HTML.jpg)\n\
  \n图 3-38\n\n“工作流中的职位档案”选项卡\n\n显示的页面将列出已更改并等待审批的职位档案。当您单击职位档案时，显示的页面（见图 3-39）将显示需要审批该更改的审批人。在显示的档案中，您可以单击`先前版本`选项卡来查看更改前的职位档案。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig39_HTML.jpg](img/499651_1_En_3_Fig39_HTML.jpg)\n\
  \n图 3-39\n\n职位档案工作流详情\n\n### 职位档案确认设置\n\n在本节中，我们将讨论如何配置职位档案确认设置。某些行业（通常是受监管行业，如制药、医疗保健等）要求组织提供其员工理解所分配职位说明的证明。组织需要维护此类信息的接收凭证。\n\
  \n要配置确认，请转到管理中心并单击“配置职位档案确认”。\n\n> **注意：** 如果您无法访问此配置步骤，请确认您已分配了“配置职位档案确认设置”权限。该权限位于`管理员权限`下的`管理职位档案生成器`中。\n\
  \n在显示的页面（见图 3-40）上，您可以选择应触发确认的职位档案更改。您可以在以下情况下触发确认：\n\n*   职位档案发生变更\n*   职位代码发生变更\n\
  *   角色与职位档案映射发生变更\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig40_HTML.jpg](img/499651_1_En_3_Fig40_HTML.jpg)\n\
  \n图 3-40\n\n配置职位档案确认设置\n\n您还可以配置标准确认声明。\n\n当您对职位档案进行更改时，受影响的员工会在 SuccessFactors\
  \ 主页的待办事项列表中的`职位档案变更`磁贴中看到通知（见图 3-41）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig41_HTML.jpg](img/499651_1_En_3_Fig41_HTML.jpg)\n\
  \n图 3-41\n\n“职位档案变更”磁贴\n\n单击该磁贴会将用户带到一个确认页面，用户可以在该页面审查更改并单击“我已阅读”来确认已接收。\n\n> **提示：**\
  \ 您可以通过转到管理中心并单击“职位档案确认报告”，来查看已收到职位档案变更确认通知的员工列表。在报告（见图 3-42）中，您还可以查看员工是否已审阅更改并完成确认。如果员工尚未确认更改，状态将为`待处理`。如果员工已确认更改，将显示确认更改的日期和时间戳。您可以按用户名、姓氏、角色和用户所做的最新更改来筛选报告。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig42_HTML.jpg](img/499651_1_En_3_Fig42_HTML.jpg)\n\
  \n图 3-42\n\n“职位档案确认报告”屏幕\n\n了解了 JPB 的背景后，我们将回顾一个需要将 JPB 与 SuccessFactors Recruiting\
  \ 集成的案例。\n\n## 案例研究\n\n在本节中，我们将回顾一个案例研究，其中我们将 JPB 与 SuccessFactors Recruiting Management\
  \ (RCM) 集成。\n\n### 描述\n\n客户 A 已实施 SuccessFactors Recruiting Management。在当前职位档案生成器实施过程中，客户正在探索将\
  \ JPB 与 RCM 集成的可能性。公司希望其顾问向他们说明需要完成哪些配置步骤。\n\n\n\n### 解决方案\n\n我们将完成将招聘管理与`JPB`集成所需的配置。\n\
  \n**步骤 1：** 要将`JPB`与招聘模块集成，请转到管理中心并单击“管理招聘设置”。在显示的页面（见图 3-43）上，滚动到“职位需求”部分。选中“在需求中使用职位简介”选项。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig43_HTML.jpg](img/499651_1_En_3_Fig43_HTML.jpg)\n\
  \n图 3-43  \n将`JPB`与招聘管理（RCM）集成\n\n单击“保存”以保存设置。\n\n**步骤 2：** 查看职位简介模板，并确认您希望与职位需求集成的部分。对于这些部分，请确认您已标记“在职位需求中显示”选项。如果您希望该部分在职位发布中可见，则可以勾选“在外部发布中显示”和“在内部发布中显示”选项。\n\
  \n**提示：** 某些部分，例如面试问题，不应显示在职位发布中，但它们应在职位需求中可用。对于此类部分，您需要选择“在职位需求中显示”，但不要勾选“在外部发布中显示”和“在内部发布中显示”选项。\n\
  \n**步骤 3：** 当您创建新的职位需求时，可以选择“浏览系列与角色”选项。创建此选项非常有用，因为您可以在创建需求时直接选择职位系列和角色（见图 3-44）。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig44_HTML.jpg](img/499651_1_En_3_Fig44_HTML.jpg)\n\
  \n图 3-44  \n使用“浏览系列与角色”选项创建职位需求\n\n当您使用“从空白模板创建新职位需求”选项创建需求时，系统会提示您选择一个职位角色（见图 3-45），以便从职位简介中显示与该职位角色相关的具体细节。单击“选择角色”后，系统会将您带到与图\
  \ 3-44 相同的界面。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig45_HTML.jpg](img/499651_1_En_3_Fig45_HTML.jpg)\n\
  \n图 3-45  \n系统提示选择职位角色\n\n在职位需求中，您可以单击“职位简介”选项卡，在职位需求和职位简介之间切换。\n\n如果您希望招聘人员或招聘经理（或任何招聘角色）能够编辑职位简介中的部分内容，则需为其授予`JobReqJobProfile`中的“编辑”权限。您可以在“管理员权限\
  \ → 管理职位与技能简介可见性”中找到`JobReqJobProfile`权限（见图 3-46）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig46_HTML.jpg](img/499651_1_En_3_Fig46_HTML.jpg)\n\
  \n图 3-46  \n授予在职位需求中编辑职位简介的权限\n\n**步骤 4：** 当职位需求与`JPB`集成后，如果某个部分在职位简介中可用，则该部分将显示在“职位简介”选项卡上。您在需求中对职位简介所做的任何更改仅适用于该需求，不会回写到主职位简介。职位需求创建后，您对职位简介所做的任何更改都不会同步到该需求中。\n\
  \n## 本章总结\n\n在本章中，我们首先回顾了职位简介构建器是什么，以及它如何与其他 SuccessFactors 人才管理模块集成。我们审查了需要授予用户的权限，以便他们能够访问与`JPB`相关的不同配置步骤。我们列出了`JPB`内容类型，并在本章后面讨论了`JPB`对象之间的依赖关系。我们还详细讨论了如何配置`JPB`内容以及如何导入/导出内容。随后，我们在本章中配置了一个职位简介模板，并使用该模板配置了一个职位简介。我们还讨论了如何为`JPB`配置工作流。在章节末尾，我们回顾了员工如何查看和确认其分配职位的职位描述。最后，我们讨论了如何将`JPB`与招聘管理（RCM）集成。\n\
  \n在下一章中，我们将讨论 SuccessFactors 目标管理。该章节将详细讨论配置选项，以及员工和经理如何设定各自的目标。\n\n"
- "# 4. 基础目标管理\n\n目标管理为 SAP SuccessFactors 客户提供了在线设定和追踪整个组织业务目标的方法。此外，它还为 SAP SuccessFactors\
  \ 中的许多集成功能提供了起点，使公司能够平稳运营，并为员工提供正向引导和奖励。客户可以通过识别用于开发和追踪每个目标的字段来配置其目标计划模板。另外，客户可以决定员工的目标是个人目标、团队目标和/或小组目标。无论客户选择在目标计划中包含哪种目标类型，其结果都可以在全年内进行更新和追踪，甚至可以整合到绩效考核表中。\n\
  \n对于试图执行其业务战略的组织而言，SuccessFactors 目标管理的功能变得至关重要。为了说明这一点，我们以两家公司为例。在这两家公司中，高层业务目标均在董事会中设定，并传达给首席执行官（CEO）执行。在第一家公司，CEO\
  \ 召集其直接下属开会，分享构成目标的各项财务指标和增长数据。然后，他们要求直接下属将这些信息层层传达下去。在季度末，首席财务官（CFO）要求其团队提取报告，以检查他们是否在朝着高层目标前进。CEO\
  \ 的团队随后审查结果，并命令直接下属尝试找出哪些方面进展顺利，哪些方面出现问题。随着年底临近，绩效评估离线进行，并根据个人绩效对每位员工进行评级。然而，尽管基于经理观察和关系的高评级数量众多，但由于公司业绩不佳，很少有员工获得加薪。当员工询问为何存在如此大的差距时，经理们陷入了尴尬的境地，无法给出清晰的解释。\n\
  \n\n\n第二家公司采用了 SAP SuccessFactors，并将作为我们贯穿本章的范例。董事会会议结束后，CEO 立即在 SAP SuccessFactors\
  \ 中设定自己的目标。由于安全权限限制，CEO 确信只有自己能看到这些目标。随后，CEO 召集直接下属开会，讨论如何将部分目标分解到他们的目标计划中。接着，CEO\
  \ 将部分目标向下级联至直接下属，并为其他下属创建目标，同时将这些目标与自己的目标关联。此外，直接下属也会创建一些自己的目标。此过程会逐级重复，直至最后一个符合目标计划条件的员工。在定期的持续绩效管理会议中，员工和管理者会主动在系统中更新自己的目标和状态。当第一季度到来时，CFO\
  \ 提交了结果报告，但这一次，CEO 的团队能够将这些结果与系统中的数据进行对比。团队可以从一个目标计划导航到另一个，追踪组织中哪些目标达到或超出了预期，哪些在个人层面未能达标，并采取相应的纠正措施。在持续的绩效评审中，这些纠正措施会被沟通传达，引导公司朝着更好的方向发展。到了年底，目标会被纳入年度绩效表格，并以清晰的百分比形式呈现为总体绩效评分的一部分。这进而会影响基于绩效的薪酬部分，为管理者解释员工薪酬提供了清晰的依据。此外，管理者还可能看到自己的目标如何与组织内更高层级的目标相关联，从而有助于解释个人贡献如何影响公司的整体绩效。确实，一个成功实施的\
  \ SAP SuccessFactors 目标管理方案能为您的组织带来巨大益处！让我们更深入地探讨如何着手吧！\n\n## 本章涵盖内容\n\n在本章中，我们将引导您完成设置目标管理的各个步骤，以满足大多数组织的需求。首先，我们会在配置管理中启用该模块并分配配置权限。接着，我们通过在线编辑器创建和修改一个基本的目标计划模板。然后，我们详细讲解如何编辑该在线编辑器生成的\
  \ XML，并附带您可以在实际应用中使用的示例代码。最后，我们将以最终用户的视角快速浏览端到端的基础目标流程。在下一章中，我们将介绍其他不常用但功能强大的目标管理概念和功能，这些功能在满足不同组织执行业务目标的需求时非常有效。\n\
  \n## 目标管理的基本配置\n\n在本节中，我们将介绍从头到尾配置一个基本目标计划所需的所有步骤，以便最终用户能够访问一个满足具有基本需求的公司简单要求的目标计划。通常，这种类型的目标计划是与真实客户进行首次迭代评审的良好起点。\n\
  \n### 配置目标管理的前提条件\n\n在进行主要配置之前，需要执行一些步骤以确保目标管理功能已开启，并且已授予访问配置所需屏幕的适当权限。\n\n####\
  \ 配置管理设置\n\n设置目标管理的第一步是编辑您的配置管理设置，以便 SAP SuccessFactors 中能显示相应的屏幕和权限。请按以下步骤操作：\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig1_HTML.jpg](img/499651_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n配置管理中的目标管理设置\n\n1. 登录配置管理并选择您的公司 ID。\n2. 点击“公司设置”。\n3. 勾选“目标管理套件”旁边的复选框，并在下拉菜单中选择“全面目标管理”，如图\
  \ 4-1 所示。\n\n#### 分配配置和管理目标管理的权限\n\n在此，我们将分配基于角色的权限，使您能够配置和管理目标管理。请按以下步骤操作：\n\n\
  > 注意  \n> 我们假设本章中基于角色的权限已在配置管理中启用，并且您有权编辑权限角色。另请注意，配置管理设置有时需要一段时间才能在系统中生效。如果您没有立即看到权限显示，请注销并在大约一小时后重新登录。更改通常不会超过一夜就能生效。\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig2_HTML.jpg](img/499651_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n管理目标权限\n\n1. 在搜索栏中输入并选择 `Manage Permission Roles`。\n2. 屏幕加载后，点击您要修改的角色。然后点击\
  \ `Permission…`。\n3. 点击左侧的 `Manage Goals`，然后勾选 `Import Goals`、`Import/Export Goals\
  \ library` 和 `Goal Management Feature Settings` 旁边的复选框，如图 4-2 所示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig3_HTML.jpg](img/499651_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n分配管理表单模板的权限\n\n1. 点击左侧的 `Manage Form Templates`，然后勾选 `Form Templates` 旁边的复选框，如图\
  \ 4-3 所示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig4_HTML.jpg](img/499651_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n管理系统属性权限\n\n1. 点击左侧的 `Manage System Properties`，然后勾选 `Mobile Settings`\
  \ 和 `E-Mail Notification Templates Settings` 旁边的复选框，如图 4-4 所示。\n2. 在主要权限角色屏幕上点击\
  \ `Done`，然后点击 `Save Changes`。\n\n### 目标管理的主要配置\n\n现在我们已经激活了目标管理模块，并拥有了进行配置所需屏幕的权限，让我们开始吧！本节将引导您完成配置一个简单目标计划的基本步骤，同时涵盖修改主模板和管理流程的屏幕。\n\
  \n\n\n### 目标模板配置\n\n下面我们来了解如何创建和编辑目标模板。目标模板通常也被称为目标计划。一般每年或每个周期都会创建一个新模板；因此，通常会在模板名称中包含年份，例如\"\
  2020 年目标计划\"（别担心，创建新目标计划就像复制旧模板并重命名一样简单）。在我们的示例中，将使用在线编辑器界面\"管理模板\"。这是开始创建基础模板的好方法，对于没有配置权限的客户也同样可用。目标模板的一些功能无法在在线编辑器中编辑，必须直接在模板底层的\
  \ XML 中进行操作，然后通过配置上传到系统中。我们将单独介绍这些功能。开始操作前，请遵循以下步骤：\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig5_HTML.jpg](img/499651_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n管理模板界面\n\n1.  在搜索栏中输入并选择\"管理模板\"。界面将如图 4-5 所示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig6_HTML.jpg](img/499651_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n目标计划编辑器\"预览\"页面\n\n2.  点击\"添加新模板\"。在弹出的窗口中，从 SuccessStore 选择一个模板，例如\"扩展目标计划\"\
  。这将作为您编辑的起始模板。点击\"添加到我的实例\"。\n3.  为模板输入一个名称，例如\"2020 年目标计划\"，然后点击\"保存\"。编辑器将如图 4-6\
  \ 所示，显示\"预览\"页面。\n\n**注意** 虽然预览可以大致了解模板上将显示哪些字段，但它并不能 100% 真实地反映表单在屏幕上的实际外观。我们建议使用测试用户进行测试。\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig7_HTML.jpg](img/499651_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n目标模板通用设置\n\n4.  点击左侧的\"通用设置\"。界面将更新为通用设置页面，如图 4-7 所示。首先确保您已选择页面顶部的\"更改语言\"\
  下拉菜单中的\"默认\"语言。如果您正在进行全局实施，您可以从下拉菜单中选择一种语言以提供所需的翻译。\n\n**注意** 我们建议始终使用在线编辑器的每个页面上的默认语言来配置表单。这将自动为您系统中启用的其他语言填充值（如果您需要编辑可用语言，可以在配置中公司设置下激活它们）。因此，如果您只使用美国英语（`en_US`）并填写所有默认值，则完全无需更改语言。\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig8_HTML.jpg](img/499651_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n编辑类别\n\n5.  使用\"名称\"字段根据需要更改目标计划的标题。\n6.  在\"用户说明\"字段中输入您想提供的任何说明。\n\n\
  **注意** 这是一个在线 HTML 编辑器。我们发现一些客户喜欢提供技术帮助文档和策略文档的链接，这些文档提供了创建 SMART 目标的背景信息，超越了 SAP\
  \ 提供的在线向导。\n\n7.  输入开始和结束日期。\n\n**注意** 这些日期是目标被其所在计划的员工执行的时间。通常，我们发现这些日期与年度开始和结束或财年开始和结束对齐。如果目标计划在第一季度末到期，开始日期设在过去的情况也并不少见。\n\
  \n8.  如果需要，请勾选 SMART 目标向导的复选框。\n\n**注意** 目标向导是一个弹出窗口，允许最终用户逐步创建个人目标，并在每一步询问他们的目标是否具体、可衡量、可实现、相关和有时限（SMART）。我们经常发现客户对查看\
  \ SMART 目标向导的功能很好奇，但随后认为它过于简单而无用，转而选择依赖自己的策略和程序文件来帮助指导用户。此外，您必须使用某些标准字段才能使 SMART\
  \ 目标向导正常工作。\n\n9.  如果需要，请勾选\"在目标计划上显示持续绩效管理成就\"旁边的复选框。这将在目标计划中添加一列，显示与目标相关的任何 CPM\
  \ 成就。\n\n**注意** 我们建议使用此功能，因为它有助于提醒用户他们的成就。您必须已实施持续绩效管理 (CPM) 才能使此功能生效。我们将在第 13 章更详细地介绍\
  \ CPM。\n\n10. 点击\"编辑类别\"（在继续到下一页之前，您可能也想定期点击\"保存\"）。这将展开以显示您下载的模板附带的标准类别，如图 4-8\
  \ 所示。您可以根据需要重命名这些类别、删除它们或添加其他类别。\n\n**注意** \"类别\"与目标计划配置中被称为\"字段\"的其他区域不同，它们是唯一的。类别将作为分区显示在最终用户的目标计划上，在视觉上分隔每个目标。它们对于报告也很重要，因为它们可能与整体业务计划的主要支柱相对应。要完全移除类别的使用，您需要在\
  \ XML 模板中删除所有类别（请参阅本章后面的\"下载、编辑和上传 XML\"部分）。\n    - 要添加类别，请点击\"添加新类别\"，该类别将出现在列表中。\n\
  \    - 要编辑类别名称，请点击该类别，然后在右侧出现的字段中输入类别的新名称（在选择语言后）。\n    - 要删除类别，请点击垃圾桶图标。\n\n**注意** 我们不建议在表单被最终用户使用后删除类别，因为这可能会破坏数据！此外，许多公司要求将\"\
  选择类别\"添加到类别下拉菜单中。但是，如果下拉菜单类别之一是\"选择类别\"，这会被视为最终用户目标计划上的一个分区。因此，我们不建议在下拉菜单中添加这样的值。\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig9_HTML.jpg](img/499651_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n编辑字段\n\n11. 点击\"编辑字段\"。该区域将展开，显示您从 SuccessStore 下载的模板中包含的字段，如图 4-9 所示。您可以将鼠标悬停在一个字段上，然后点击垃圾桶图标来删除它。您可以通过拖放字段来更改它们在目标计划中的显示顺序。点击\"\
  添加新字段\"来添加一个字段，或点击现有字段进行编辑。\n\n**注意** 您不能在线工具中删除 `name`、`metric`、`start` 和 `due`\
  \ 字段。我们也建议使用这些字段，因为它们与诸如目标向导之类的标准功能相关联。\n\n表 4-2\n可用的自定义字段类型和配置选项\n\n| 字段类型 | 配置选项\
  \ |\n| --- | --- |\n| `text` | 必填字段，在人员档案模块中显示。 |\n| `textarea` | 必填字段，在人员档案模块中显示。\
  \ |\n| `enum` | 必填字段，在人员档案模块中显示。作为枚举字段，还需要您定义可能的条目列表，以及每个条目的背景和前景颜色标签。 |\n| `date`\
  \ | 必填字段，在人员档案模块中显示。 |\n| `percent` | 必填字段，在人员档案模块中显示。 |\n| `number` | 必填字段，在人员档案模块中显示。\
  \ |\n| `link` | 必填字段，在人员档案模块中显示。 |\n\n表 4-1\n\n\n\n## 目标计划标准字段与选项\n\n| 技术字段名 | 字段类型\
  \ | 描述 | 配置选项 |\n| --- | --- | --- | --- |\n| `name` | `textarea` | 这是用于标识目标的主要字段，例如“到年底将销售收入提高\
  \ 5%”。此字段不可删除。 | 标签、必填字段、在人员档案模块中显示。 |\n| `metric` | `textarea` | 用于标识如何衡量目标。此字段不可删除。\
  \ | 标签、必填字段、在人员档案模块中显示。 |\n| `weight` | `percent` | 此字段通常被将目标纳入绩效表单的组织使用。它将决定该单个目标分数占整个目标板块分数的百分比。如果您使用绩效表单，并且认为某些目标（如公司强制目标）应比个人目标具有更高的权重，我们建议使用此字段。否则，所有目标将被同等对待。\
  \ | 标签、必填字段、在人员档案模块中显示。 |\n| `start` | `date` | 用于指示目标开始执行的日期。此字段不可删除。 | 标签、必填字段、在人员档案模块中显示。\
  \ |\n| `due` | `date` | 用于指示目标结束执行的日期。此字段不可删除。 | 标签、必填字段、在人员档案模块中显示。 |\n| `done`\
  \ | `percent` | 用于指示目标完成的百分比。我们建议使用此字段，因为它有助于报告。 | 标签、必填字段、在人员档案模块中显示、在移动目标计划中显示。\
  \ |\n| `state` | `enum` | 用于指示目标是按计划进行还是需要注意。我们建议包含此字段，因为它对执行地图很重要。 | 标签、必填字段、在人员档案模块中显示、在移动目标计划中显示。作为一个枚举字段，它还需要您定义可能的条目列表，并为每个条目定义背景和前景颜色标签。\
  \ |\n| `milestones` | `table` | 此字段用于追踪为帮助实现目标而计划的特定里程碑的目标完成日期与实际完成日期。根据我们的经验，大多数客户不使用此字段，因为它会变得过于详细。\
  \ | 标签、必填字段。作为一个表格，您还需要定义表格的列标题。默认标签为“目标日期”、“里程碑”和“实际日期”。 |\n| `tasks` | `table`\
  \ | 尽管技术字段名是“tasks”，但此字段的默认标签是“子目标”。根据我们的经验，大多数客户不使用此字段，因为它会变得过于详细。 | 标签、必填字段。作为一个表格，您还需要定义表格的列标题。默认列标签为“子目标描述”和“完成百分比”。\
  \ |\n| `targets` | `table` | 尽管技术字段名是“targets”，但此字段的默认标签是“任务”。其理念是详细列出多个独立任务，这些任务共同促成更大目标的实现。根据我们的经验，客户不使用此字段，因为它会涉及过多不必要的细节。\
  \ | 标签、必填字段。作为一个表格，您还需要定义表格的列标题。默认列标签为“目标日期”和“任务”。 |\n| `desc` | `textarea` | 用于更详细地描述目标。我们建议不要使用此字段，因为它有时会导致与`name`字段中应填写的内容混淆。\
  \ | 标签、必填字段、在人员档案模块中显示。 |\n\n1. 编辑字段时，请修改标签（务必先选择您想要的语言），并根据需要勾选“必填字段”复选框。如果您希望此字段显示在“人员档案模块”中，也请勾选此框。有关此模块的更多信息，请参见第\
  \ 2 章。`done`和`state`字段还允许您将这些字段显示在计划的移动版本上。请参考表 4-1 和 4-2，根据您组织的业务需求添加、编辑和删除标准字段及自定义字段。\n\
  \n2. 点击“保存”。\n\n3. 返回“管理模板”主屏幕，您可能还希望将最新模板移至顶部并将其设为默认模板，以便用户在目标计划页面上首先看到它。\n\n恭喜！您现在已设置了一个基本的目标计划模板！参考我们的模型组织，我们可以看到此模板将如何帮助公司使用各种字段来记录目标数据，这些字段可以添加、删除和配置以满足组织需求。我们还向您展示了哪些字段可用于与年度绩效评估和持续绩效管理进行集成，以进一步激励和追踪员工朝着这些业务目标取得的进展。接下来，我们将了解目标库如何通过提供表述良好的示例目标来指导员工，以及执行地图和一致性图表如何帮助您从更宏观的角度了解目标在整个组织中的执行情况。\n\
  \n\n\n#### 目标库\n\n目标库提供了一组供最终用户参考的示例目标。如果员工对设定目标的概念不熟悉，并且需要具体的示例来学习如何制定一个规范的目标，这些内容会非常有帮助。SAP\
  \ SuccessFactors 提供了一个标准目标库，当您使用来自 SuccessStore 的目标计划模板时，会引用该库。您可以修改此库，或者从头开始构建一个新库。\n\
  \n**注意：** 虽然标准目标库提供了一些很好的示例，但其提供的类别和具体目标可能并非都与您的组织相关。此外，标准库仅预填充了名称和指标字段。如果您希望填充其他字段，则需要创建一个新库（如果需要，您可以简单地复制现有库作为起点，但我们建议将其创建为一个具有唯一标识符的新库）。如果您创建了自定义库，您还需要在目标计划模板\
  \ XML 中执行映射，将您上传的字段映射到目标计划模板上的相应字段。我们将在“下载、编辑和上传 XML”部分介绍如何执行此操作。\n\n要导入目标库，请遵循以下步骤：\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig10_HTML.jpg](img/499651_1_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10** 导入/导出目标库界面\n\n1.  在搜索栏中输入并选择“导入/导出目标库”。屏幕将如图 4-10 所示显示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig11_HTML.jpg](img/499651_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** 针对 en_US 区域设置的标准库下载示例\n\n2.  在开始创建自己的库之前，您可能希望先更好地了解 SuccessFactors\
  \ 目标库的结构。要下载 SuccessFactors 库，请选中“SuccessFactors 目标库”旁边的复选框，以及您希望下载的一个或多个所需语言。点击“导出”。您可以打开文件查看并编辑信息，如图\
  \ 4-11 所示。\n\n**注意：** `.csv` 文件中的第 2 行定义了文档的整体标题。您将在上图中观察到，有五行以 `\"HEADER\"` 开头。这些行各自定义了如何根据\
  \ `ENTRY_TYPE` 列中的值来构造标题以及 `.CSV` 文档中给定行的数据。例如，您在示例中看到的大部分行其 `ENTRY_TYPE` 都是 `\"\
  GoalLibraryEntry\"`，每一行代表一个单独的目标。您为目标模板配置的字段将出现在右侧的 `ENTRY_NAME` 列及之后的位置。此结构将根据您下载的目标计划模板而变化。标题将根据需要基于您的模板被包含进来。\n\
  \n第 8 行通过定义目标库名称开始文件的实际数据。接下来的两行定义了一个类别，然后是一个子类别。请注意 `GUID`（全局唯一标识符）列非常重要。您为某个条目定义的\
  \ `GUID` 可以作为另一个条目的父 `GUID` 被引用。例如，最高层级的所有类别都会引用分配给该库的 `600001` 这个 `GUID`。类别也可以引用其他类别作为父级，从而成为子类别。然后，一个\
  \ `GoalLibraryEntry` 会引用一个类别或子类别。`Milestone`、`Task`、`Target` 和 `MetricLookupEntry`\
  \ 则各自引用一个 `GoalLibraryEntry` 作为其父级。\n\n如果您正在更新库，请务必将 `ACTION` 列中的 `\"ADD\"` 更改为\
  \ `\"UPDATE\"`。您每次都必须执行库的完整加载；不能只更新一个条目。您也可以使用 `\"DELETE\"` 操作来移除条目。标准库非常容易损坏 ——\
  \ 我们建议将您希望保留的库条目复制到一个新库中。\n\n3.  要从头开始创建库，请选择您希望下载其 `.CSV` 导入文件模板的目标模板，然后点击“下载”。\n\
  \n4.  打开文件并根据上述注意事项中的说明进行条目录入。保存文件，然后点击“导入”以选择要上传的文件。根据任何错误消息来排查错误；否则，您的新库将出现在“将目标库导出到\
  \ CSV 文件”部分下。\n\n5.  请注意，如果您创建了一个新库，您将需要更改目标模板的 XML。关于如何执行此操作的说明，请参见本章的“下载、编辑和上传\
  \ XML”部分。\n\n\n\n## 电子邮件通知\n\n目标管理提供旨在让员工和经理及时了解目标计划变更的通知。请按照以下步骤配置这些邮件：\n\n**注意**\n\
  许多客户往往会发现过多邮件会让用户感到疲劳。我们建议限制开启哪些邮件。通常，客户不会选择开启任何这些通知。相反，很多人依赖报告来管理员工和经理是否填写了目标，并手动通知那些看起来不活跃的用户。\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig12_HTML.jpg](img/499651_1_En_4_Fig12_HTML.jpg)\n\
  \n**图 4-12** — “电子邮件通知模板”屏幕\n\n1.  在搜索栏中输入并选择“电子邮件通知模板设置”。屏幕将如图 4-12 所示。\n\n**表\
  \ 4-3** — 目标管理通知列表\n\n| 通知 | 备注 |\n| --- | --- |\n| 目标创建通知 | 当添加目标时，向目标计划的所有者发送警报。这在经理为员工更新计划时可能有用。您可以选择包含或排除私人目标。可用令牌为\
  \ `[[OBJ_NAME]]` `[[OBJ_SENDER]]` `[[SIGNATURE]]`。 |\n| 目标删除通知 | 当删除目标时，向目标计划的所有者发送警报。这在经理为员工更新计划时可能有用。您可以选择包含或排除私人目标。可用令牌为\
  \ `[[OBJ_NAME]]` `[[OBJ_SENDER]]` `[[SIGNATURE]]`。 |\n| 目标修改通知（每日） | 如果有任何目标被修改，则每\
  \ 24 小时批量向员工和经理发送电子邮件通知。可用令牌为 `[[LAST_EMAIL_DATE]]` `[[GOAL_OWNER]]` `[[OBJ-PLAN-NAME]]`\
  \ `[[OBJ_LIST]]` `[[SIGNATURE]]`。您可以选择包含或排除私人目标。请注意，您还可以排除对链接目标、取消链接目标以及级联目标操作的修改通知。您也可以排除删除操作，以免消息与目标删除通知重复。您还可以选择矩阵经理是否会为其矩阵下属接收通知。此外，您可以按员工合并邮件，这样经理对于某个员工目标计划的所有更改只会收到一条消息。配置此通知后，您需要登录您公司实例的配置中心并设置一个计划任务来发送通知。请按照以下步骤操作：1.\
  \ 点击“管理计划任务”。2. 在出现的新屏幕中，点击“创建新任务”并输入名称，例如“目标修改通知”。3. 对于“任务类型”，选择“目标通知邮件”，并在任务参数中选择“今天”。对于执行次数选择“重复”，并选择“每日”。选择\
  \ 23:00 作为时间（该任务通过收集自 0:00 以来的所有修改来工作，因此这能最大限度地捕获所有修改）。 |\n| 目标评论通知 | 4. 对于开始日期，选择今天的日期以及大约在当前时间后\
  \ 5 分钟的时间。5. 点击“创建任务”。6. 在出现的主屏幕中，点击“操作”菜单并选择“提交”。您的任务将每天在 23:00 开始运行！另外，如果您想在此通知中启用指向目标计划的直接链接，请执行以下步骤：1.\
  \ 确保已为此通知选择“按员工合并”选项。2. 在搜索栏中输入并选择“公司系统和徽标设置”。3. 勾选“启用 HTML 通知”旁边的复选框。4. 点击“保存公司系统设置”。\
  \ |\n| 目标评论通知 | 当向目标添加评论时，向员工和经理发送通知。如果经理评论，员工会收到通知。如果员工回复，经理会收到通知。如果其他人发表评论，则两人都会收到邮件。可用令牌为\
  \ `[[OBJ_RECIPIENT]]`、`[[OBJ_SENDER]]`、`[[OBJ_NAME]]`、`[[OBJ-PLAN-NAME]]`、`[[OBJ_COMMENT]]`、`[[OBJ_COMMENT_HERE]]`。\
  \ |\n\n1.  参考表 4-3 来决定激活和/或编辑哪些模板。勾选您想要激活的邮件旁边的复选框，然后点击左下角的“保存通知设置”。要编辑任何特定通知的单独设置或内容，请点击左侧的通知名称，右侧屏幕将相应更新。点击“保存更改”以保存对该特定通知所做的编辑。\n\
  \    1.  要修改不同语言的消息，请从下拉菜单中选择语言，并在进行编辑之前点击“切换到”。\n\n2.  修改邮件内容时，您可以插入令牌以从相关目标计划中提取文本数据。可用令牌列于表\
  \ 4-3 中。\n\n#### 启用移动功能\n\n移动目标允许员工和经理访问、查看和编辑基本目标信息，例如名称、描述和状态。不支持备用或高级功能，例如群组目标、团队目标、指标查找表等。\n\
  \n**注意**\n由于移动应用的简单性质，我们将不介绍如何使用该应用。我们邀请您前往 Apple App Store 或 Android Market 搜索“SuccessFactors”来下载该应用。下载后，您可以点击右上角的“演示”来浏览该应用。如果您想将应用与您实例上的特定用户关联以使用真实数据，则需要完成屏幕上的注册过程。如需查看支持和不支持的功能列表，请参考\
  \ SAP 注释 2475032。\n\n要启用移动功能，请按照以下步骤操作：\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig13_HTML.jpg](img/499651_1_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-13** — 在移动设置中激活目标管理\n\n1.  在搜索栏中输入并选择“启用移动功能”。将出现移动设置屏幕。\n2.  点击左侧的“模块”。然后勾选“目标管理”旁边的复选框，如图\
  \ 4-13 所示。更改将立即生效。\n\n## 向最终用户分配目标表单权限\n\n在进一步通过编辑 XML 来配置我们的目标计划之前，明智的做法是在测试实例中向最终用户（例如，仅一个测试用户）分配权限，以便我们可以看到\
  \ XML 配置的结果并根据需要进行故障排除。要分配权限给最终用户，请按照以下步骤操作。\n\n\n\n### 创建员工角色\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig14_HTML.jpg](img/499651_1_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14：目标计划最终用户权限\n\n1. 在搜索栏中输入并选择`\"管理权限角色\"`。点击您要编辑的权限角色名称（或通过点击`\"新建\"`创建一个新角色），然后点击`\"\
  权限…\"`。\n2. 在弹出的窗口中点击左侧的`\"目标\"`，然后勾选`\"目标管理访问权限\"`（该权限允许用户导航至系统的目标板块）和`\"目标计划权限\"\
  `旁的复选框。点击`\"其他\"`单选按钮，并高亮选中您希望授予用户权限的特定目标计划。图 4-14 展示了最终结果示例。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig15_HTML.jpg](img/499651_1_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15：定义目标计划访问的目标群体\n\n3. 点击`\"完成\"`。\n4. 在角色主界面上，您需要定义目标群体。通常对于员工角色，其目标群体仅限于员工本人。因此，员工只能查看和编辑自己的目标计划。滚动至角色页面底部，点击`\"\
  添加…\"`。在`\"将角色授予：\"`处，选择该角色将赋予的群体。在目标群体下方，选择`\"目标群体为\"`单选按钮，然后点击下拉菜单旁的复选框，选择`\"\
  被授予用户（本人）\"`。参见图 4-15。\n5. 点击`\"完成\"`，然后在角色主界面上点击`\"保存更改\"`。\n\n**注意**：此处的权限仅控制特定员工对目标计划的访问入口。关于目标的操作权限以及公共目标与私人目标的可见性，均在各目标计划模板\
  \ XML 中定义。部分组织提倡透明度，可能希望向全体员工开放整个组织的目标计划访问权限，但通过控制操作权限，确保只有员工和经理能够编辑目标。\n\n### 创建经理角色/HR\
  \ 角色\n\n如需创建经理角色，请重复上述为经理角色设置的步骤。在第 4 步中，对于`\"将角色授予：\"`，选择`\"所有经理\"`，或选择特定的经理群体。同时，在`\"\
  目标群体\"`下，选择`\"被授予用户的直属下属\"`。勾选`\"包含对被授予用户的直属下属的下级报告的访问权限\"`，并选择您希望经理拥有访问权限的层级深度。图\
  \ 4-16 展示了最终结果示例。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig16_HTML.jpg](img/499651_1_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16：为经理定义目标计划目标群体访问权限\n\n**注意**：根据我们的经验，您可能还需要为 HR 管理员重复此流程以创建单独的角色，只需在第一个下拉菜单中选择`\"\
  HR 经理\"`即可。\n\n## 需要 XML 配置的基本目标计划功能\n\n现在我们已经构建了一个基本的目标计划并将其分配给示例群体，以便进行故障排除，接下来可以开始深入研究不那么直观的\
  \ XML 配置。\n\n### 下载、编辑和上传 XML\n\n为了编辑 XML，我们首先需要下载它。当您使用本章前面部分介绍的在线工具创建目标计划模板时，系统会自动生成一个\
  \ XML。现在，我们将登录到配置系统来下载模板以便编辑。请按照以下步骤下载模板、修改模板并重新上传：\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig17_HTML.jpg](img/499651_1_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17：上传和下载目标计划 XML 模板\n\n1. 登录贵公司的配置系统，点击`\"导入/更新/导出目标计划模板\"`。\n2. 如图 4-17 所示，点击`\"\
  导出\"`列下方的图标。您的网页浏览器会将文件下载到本地计算机。\n3. 使用 XML 编辑器打开文件，进行编辑后点击`保存`。\n4. 返回配置系统，这次上传目标计划：点击`\"\
  导入/更新/导出目标计划模板\"`。\n5. 点击`\"浏览…\"`按钮，选择您的 XML 文件。\n6. 点击`\"上传\"`。系统将处理文件，并给出成功消息或错误消息，您可以根据错误消息对所做的更改进行故障排除。\n\
  \n**注意**：我们建议您每次仅修改少量设置，并将每组更改保存为本地计算机上的新文件名，以便缩小可能问题的范围。在最坏的情况下，您可以回退到文件的上一个成功版本。\n\
  \n### 目标计划 XML 格式\n\n在本节中，我们将依次逐步讲解 XML 的每个区域，并描述配置选项，包括示例代码片段。通过按顺序将这些示例代码片段拼接起来，您可以上传一个功能完整的目标计划。\n\
  \n\n#### `<obj-plan-template>` 标签\n\n`<obj-plan-template>` 标签是 XML 结构中的最高层级标签。它定义了一系列可开启或关闭、或可调整的选项，用于启用/禁用功能或对其进行调整。\n\
  \n示例如下：\n\n```\n参考表 4-4 根据需要修改属性值。\n```\n\n**表 4-4 `<obj-plan-template>` 属性**\n\n\
  | 属性 | 描述 |\n| --- | --- |\n| `spellchk` | 对于任何文本区域字段，如果此值设置为 `\"true\"`，则会显示拼写检查链接；否则，不显示该链接。\
  \ |\n| `new-obj-share-status-public` | 当设置为 `\"true\"` 时，所有新目标默认为公开；否则，它们被设置为私有。如果你选择只允许用户拥有一种类型的目标，并隐藏公开与私有目标的区别，则必须将此设置为\
  \ `\"true\"` 并移除所有私有访问权限。更多信息，请参见 SAP 说明 2514964。 |\n| `instructions-viewdefault`\
  \ | 此属性不再使用，系统会忽略它。 |\n| `alerts-viewdefault` | 将终端用户的显示选项默认为查看提醒。提醒会向用户显示其他人是否修改了目标或链接/对齐关系。\
  \ |\n| `cascade-parent-viewdefault` | 此属性不再使用，系统会忽略它。 |\n| `cascade-child-viewdefault`\
  \ | 此属性不再使用，系统会忽略它。 |\n| `expand-collapse-categories` | 如果设置为 `\"true\"`，则用户可以展开或折叠每个类别。\
  \ |\n| `share-confirm` | 如果设置为 `\"true\"`，则会弹出一个确认框，询问用户是否确认共享目标；否则，不显示此确认框。 |\n\
  | `unshare-confirm` | 如果设置为 `\"true\"`，则会弹出一个确认框，询问用户是否确认取消共享目标；否则，不显示此确认框。 |\n\
  | `allow-group-goal` | 如果你选择使用组目标，则将此设置为 `\"true\"`。我们将在第 5 章中介绍组目标。 |\n| `goal-tree-link`\
  \ | 如果设置为 `\"true\"`，则已链接的目标旁边会显示一个图标，用户可以点击该图标查看“目标对齐聚焦”报告。 |\n| `pager-max-objs-per-page`\
  \ | 接受一个整数值。根据此处输入的目标数量创建分页。如果设置为 `\"0\"`，则所有目标显示在一页上。我们建议将其设置为 `\"0\"`。 |\n| `pager-max-page-links`\
  \ | 此属性不再使用，系统会忽略它。 |\n| `pager-max-children-per-parent` | 此属性不再使用，系统会忽略它。 |\n|\
  \ `more-details-child-format` | 如果输入 `\"goal-plan\"`，则向下对齐的目标会以目标计划中显示的迷你版本显示。如果未设置或设置为\
  \ `\"original\"`，则仅显示全名、用户名和目标名称。 |\n| `show-goal-id` | 如果设置为 `\"true\"`，则目标计划中会添加一列“目标\
  \ ID”。 |\n| `display-alignment-format` | 如果设置为 `\"names\"`，则显示目标所有者姓名，并附带一个查看其计划中目标的链接。如果设置为\
  \ `\"goals\"`，则显示所有者姓名、目标名称和其他字段，而不是链接。 |\n| `use-text-for-privacy` | 如果设置为 `\"\
  true\"`，则用户可以从“公开”和“私有”的下拉选项中选择。否则，使用图标（太阳镜）来指示目标是否为私有。如果你不使用私有与公开目标，请完全移除该属性。更多信息，请参见\
  \ SAP 说明 2514964。 |\n\n#### `<obj-plan-id>` 元素\n\n`<obj-plan-template>` 标签下的第一个元素是\
  \ `<obj-plan-id>`。它设置了系统中目标计划的唯一数字标识符。如果你使用在线编辑器工具创建计划，系统会自动分配此标识符。否则，你可以选择一个尚未使用的数字。你可以在配置界面的“导入/更新/导出目标计划模板”屏幕上查看现有模板并选择一个新的\
  \ ID。如果你上传的计划与现有计划具有相同的 ID，则会覆盖该计划。\n\n示例如下：\n\n```xml\n\n```\n\n你选择的数字很重要，因为不同的数字对应使用相同\
  \ XML 格式的不同类型目标计划。数字范围如下表所示：\n\n| 数字范围 | 模板类型 |\n| --- | --- |\n| 1–1000 | 目标计划\
  \ |\n| 2001–3000 | 发展计划 |\n| 4001–5000 | 学习活动 |\n| 5001–5099 | 职业工作表 |\n\n#### `<obj-plan-type>`\
  \ 元素\n\n`<obj-plan-type>` 元素定义了计划是目标计划、发展计划、学习活动还是职业工作表。使用 `\"Business\"` 将计划类型定义为目标计划。\n\
  \n示例如下：\n\n```xml\nBusiness\n```\n\n#### `<obj-plan-name>` 元素\n\n这将是你使用在线工具设置并为终端用户显示的目标计划标题。第一行定义了默认名称。你可以在其下方为实例中每个启用的区域设置名称。\n\
  \n示例如下：\n\n```xml\n2020 Goal Plan\n2020 Goal Plan\n```\n\n#### `<obj-plan-desc>`\
  \ 和 `<obj-plan-lastmodified>` 元素\n\n描述和最后修改时间仅对在 XML 或在线工具中配置目标计划的人员显示。当你在在线工具中保存或在配置中上传\
  \ XML 时，最后修改时间会自动更新。\n\n示例如下：\n\n```xml\n6/20/20 3:16 PM\n```\n\n#### `<obj-plan-start>`\
  \ 和 `<obj-plan-due>` 元素\n\n开始日期和截止日期定义了实现目标的周期。这些应该在在线工具中设置。它们也作为用户创建目标时的默认开始日期和结束日期。\n\
  \n示例如下：\n\n```xml\n01/01/2020\n12/31/2020\n```\n\n#### `<obj-plan-numbering>` 元素\n\
  \n通过将一个目标添加到计划中另一个目标的下方并缩进它，可以将目标组织成子目标。要启用此功能，您必须通过此元素定义编号方案。通常，我们发现如果客户需要编号，他们倾向于使用\
  \ `1.1.1` 的表示法，其中第一个数字是类别的编号顺序，第二个数字是类别中目标的编号，第三个是缩进的目标：\n\n要移除编号，只需从此元素中删除这三行代码。要禁止缩进，只删除最后一行。要使编号根据用户按列排序的方式自动生成，请删除两行。\n\
  \n#### `<switches>` 元素\n\n`<switches>` 元素是您可以列出希望为目标计划开启或关闭的各种功能的地方。在以下示例中，我们仅涵盖与目标计划相关的开关（其他用于发展计划的开关将在第\
  \ 2 卷第 1 章中介绍）。\n\n参考表 4-5 来决定关闭或开启哪些开关。\n\n**表 4-5 可用的目标计划 XML 开关**\n\n| 开关 | 描述\
  \ |\n| --- | --- |\n| `cascader-role` | 如果你计划允许经理或其他用户级联目标，重要的是要意识到，默认情况下，级联者将对目标员工目标的所有字段拥有写入权限。如果你的需求不同，你将需要启用此特殊级联者角色，该角色可以定义不同的权限。更多信息，请参见\
  \ SAP 说明 2072029。 |\n| `cws-dispoption-competency-desc` | 如果你将能力与目标关联，开启此选项将默认在目标计划上显示能力描述。\
  \ |\n| `turnoff-add-personal-goal-button` | 这关闭了用户创建个人目标的能力。它本质上强制用户使用库目标或管理员已导入到其计划中的目标。仅建议用于不允许终端用户在库外或管理员放置在其计划上的目标之外创建临时目标的组织。\
  \ |\n| `percentage-value-over-100` | 开启此开关允许任何百分比字段（例如权重字段）中输入的数值超过 100。我们建议保持关闭，除非你有一个自定义的百分比字段，其中可能与此相关（例如，超过\
  \ 100% 的完成率）。 |\n\n\n\n##### `threaded-feedback`\n此功能允许以线程样式显示目标评论，而此前它们以表格形式显示。我们建议启用此功能。如果您计划添加目标并希望将评论显示在绩效表单上，请遵循\
  \ SAP 备注 2459850 中的说明。\n\n##### `continuouspm-integration`\n此开关对应于在线工具中用于启用持续绩效管理集成的复选框。此开关将在目标计划中增加一列，显示与目标相关的任何\
  \ CPM 成果。如果您已实施 CPM，我们建议启用此功能。\n\n以下是一个包含我们建议的示例代码段：\n\n#### `<add-wizard>` 元素\n\
  如前所述，在在线工具中创建模板时，目标向导是一个弹出窗口，允许最终用户逐步创建个人目标，并在每一步询问其目标是否符合“具体的、可衡量的、可达成的、相关的、有时限的”（SMART）原则。如果您选择添加此功能，您将看到此元素被添加到您的目标计划模板中。虽然您可以通过在线工具打开或关闭向导，但将目标对齐作为向导一部分的额外功能只能通过\
  \ XML 添加。要添加此额外功能，只需像以下示例那样添加`<include-goal-align>`。\n\n我们的示例代码段如下所示（但我们根据客户反馈建议不要包含此项）：\n\
  \n#### `<text-replacement>` 元素\n在 XML 的这一区域，您可以定义一系列用于替换目标计划屏幕上特定标准文本元素的元素。SAP 备注\
  \ 2072180 定义了可放置在`for`属性中的可用选项。值得注意的是，您将看到您在在线工具中定义的说明会出现在此处。\n\n以下是我们的示例，其中包含了来自在线工具的说明：\n\
  \n```\nhere.Some item to consider working with goals:The goals listed here should\
  \ be executed from 1/1/20 to 12/3/20Your goals will be visible to your manager and\
  \ aboveSome goals may be added to your plan by your managerYour goals will be pulled\
  \ onto your performance form and incorporated as part of your overall performance\
  \ score for the year]]>\nhere.Some item to consider working with goals:The goals\
  \ listed here should be executed from 1/1/20 to 12/3/20Your goals will be visible\
  \ to your manager and aboveSome goals may be added to your plan by your managerYour\
  \ goals will be pulled onto your performance form and incorporated as part of your\
  \ overall performance score for the year]]>\n```\n\n#### `<obj-library>` 元素\n为了将目标库与目标计划关联起来，需要在\
  \ XML 中定义一个映射。您从 SuccessStore 下载的标准目标模板已经包含了一个到 SuccessFactors 目标库的映射。您可以将其替换为您自己的映射，如下例所示。只需列出所有库字段\
  \ ID 以及您希望映射的所有目标计划 XML 字段名称。\n\n以下示例将库中的`Name`映射到目标计划模板 XML 中的`name`：\n\n图 4-18\
  \ 展示了映射流程，从本章前面介绍的库上传开始，经过 XML 中定义的映射，最终到达最终用户屏幕。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig18_HTML.jpg](img/499651_1_En_4_Fig18_HTML.jpg)\n\
  \n**图 4-18**\n库上传到最终用户屏幕的字段映射流程示意图\n\n#### `<category>` 和 `<default-category>` 元素\n\
  XML 的这一部分用于定义您的目标类别。我们建议您使用在线工具定义类别，它们将自动填充到此区域。如果您根本不想将计划划分为类别，请完全删除此部分（以及默认类别和类别字段的权限）。请注意，您在此处定义类别的顺序将决定它们向用户显示的顺序。默认类别必须放在最后。\n\
  \n我们的示例代码段如下所示：\n\n```\nFinancial Growth and Responsibility\nFinancial Growth and\
  \ Responsibility\n\nCustomer Care\n\nBusiness Process Improvement\nBusiness Process\
  \ Improvement\n\nGrowing Self and Others\nGrowing Self and Others\n\nOther\nOther\n\
  ```\n\n#### `<field-definition>` 元素\n字段定义是向目标计划添加单个字段的方式。它们设置了字段的名称、类型、是否必填等属性。我们建议您在在线编辑器中创建所有字段。这是因为每当您添加字段时，在线工具都会自动更新`<field-definition>`、`<field-permissions>`、`<plan-layout>`和`<form-layout>`元素。在在线工具中添加字段后，您可以根据需要对在线工具中无法设置的个别设置进行编辑。在线工具无法创建的少数标准字段和类型，我们需要在此处作为补充进行说明。第一种是显示为复选框且很少使用的`bool`类型字段。第二种是标准的`comments`字段（`id`和`type`均为`comments`），客户可能希望包含也可能不包含（我们在示例中包含了它们，以便您了解其样式）。第三种是标准字段\
  \ ID `obj-plan-field1`（`type`为`text`），用作已分配目标的使命陈述，且很少使用。最后两种是`group-rating`和`group-rating-comments`，类型为`rating`，我们将在第\
  \ 5 章中进一步讨论。\n\n如果您选择创建或手动编辑字段，请参考表 4-6 了解字段定义的每个属性的含义。\n\n**表 4-6**\n目标计划字段属性\n\
  \n| 属性 | 描述 |\n| --- | --- |\n| `required` | 设置为`true`或`false`以指定该字段是否为必填。 |\n|\
  \ `viewdefault` | 如果希望默认不显示此字段，则设置为`off`（用户必须从显示选项中选择才能看到）；否则，此项默认开启。 |\n| `showlabel`\
  \ | 当您稍后定义计划布局时，这将更有意义——它决定是否显示字段标签。如果该字段位于布局的第一行并因此显示在列标题下方，我们建议将此项设置为`off`；否则，设置为`on`。\
  \ |\n| `reportable` | 如果设置为`true`，该字段将被添加到标准目标清单报告中。您最多可以选择 20 个字段，并且它们在不同目标计划间的\
  \ ID 和类型必须匹配。根据我们的经验，大多数公司不使用此遗留报告。同样重要的是，任何自定义字段必须设置为可报告，以便经理在向下级联目标后可以查看员工计划上的这些字段。\
  \ |\n| `field-show-coaching-advisor` | 仅用于类型为`textarea`的字段。这主要用于发展计划，并就会在员工未达到、达到或超越胜任力期望时如何撰写辅导要点提供建议。\
  \ |\n| `spellchk` | 仅用于类型为`textarea`的字段，用于显示一个拼写检查图标，对字段内容执行拼写检查。 |\n| `cascade-update`\
  \ | 如果设置为`push-down`，则只有群组/团队目标所有者可以编辑该字段。如果设置为`regular`，则任何被分配该目标的人都可以编辑。我们将在第\
  \ 5 章中进一步讨论这一点。 |\n\n\n\n以下是排版后的文本：\n\n我们的以下示例仅展示使用在线编辑器时生成的几个示例字段（为简洁起见），此外我们手动添加了`comments`字段，以便让您深入了解每种类型字段的结构：\n\
  \n```\n目标名称\n目标名称\n目标名称\n目标名称\n\n指标\n指标\n指标\n指标\n\n权重\n权重\n权重\n权重\n0.0\n\n开始日期\n\
  开始日期\n开始日期\n开始日期\n\n截止日期\n截止日期\n截止日期\n截止日期\n\n完成百分比\n完成百分比\n完成百分比\n完成百分比\n0.0\n\n\
  状态\n状态\n状态\n状态\n\n未开始\n未开始\n\n进行中\n进行中\n\n已延迟\n已延迟\n\n已完成\n已完成\n\n已延期\n已延期\n\n已取消\n\
  已取消\n\n里程碑\n里程碑\n里程碑\n里程碑\n里程碑\n里程碑\n\n目标日期\n目标日期\n目标日期\n目标日期\n\n里程碑\n里程碑\n里程碑\n\
  里程碑\n\n实际日期\n实际日期\n实际日期\n实际日期\n\n评论\n评论\n\n```\n\n#### `<permission>` 元素\n\n`<permission>`\
  \ 元素部分列出了可在目标计划中执行的每个操作，并为每个操作分配了可执行者（由标准目标管理角色定义）。在线编辑器的主要缺点之一是您无法使用编辑器编辑操作权限。幸运的是，当您创建模板时，它会提供一些标准权限，这些权限可以在\
  \ XML 中修改。请参考表格 4-7 和 4-8 来了解每个操作的含义、每个角色包含的人员以及哪些角色可以执行哪些操作。请记住，在考虑角色和权限时，起始参考点始终是您正在查看其目标计划的员工。\n\
  \n### 表 4-8  \n目标计划操作\n\n| 操作 | 描述 |\n| --- | --- |\n| `private-access` | 如果目标设置为私有，则定义的角色可以查看它。\
  \ |\n| `create` | 谁可以在目标计划中创建目标。 |\n| `delete` | 谁可以从计划中移除目标。请注意，对于团队目标，无论此权限如何，创建者始终可以删除。\
  \ |\n| `delete-group-goal` | 谁可以从目标计划中移除团队目标。 |\n| `move` | 谁可以缩进或将目标向上或向下移动。 |\n\
  | `share` | 谁可以将目标设为公开或私有。 |\n| `cascade-pull` | 谁可以将目标从另一个计划拉取到当前计划中（只能是 `*` 或\
  \ `none`）。 |\n| `cascade-push` | 谁可以将目标从当前计划推送到另一个计划中。 |\n| `cascade-align` | 谁可以将此计划中的两个不同目标链接到另一个计划。\
  \ |\n| `unalign-parent` | 谁可以取消链接已推送到目标计划中的目标。 |\n| `unalign-child` | 谁可以取消链接已推送到另一个目标计划中的目标。\
  \ |\n| `create-row` | 谁可以在类型为 `type=“table”` 的字段中创建行。 |\n| `delete-row` | 谁可以在类型为\
  \ `type=“table”` 的字段中删除行。 |\n| `move-row` | 谁可以在类型为 `type=“table”` 的字段中移动行。 |\n\n\
  ### 表 4-7  \n目标计划权限角色\n\n| 角色 | 描述 | 支持的操作 |\n| --- | --- | --- |\n| `*` | 所有人 |\
  \ `private-access`, `create`, `delete`, `delete-group-goal`, `cascade-pull`, `cascade-push`,\
  \ `cascade-align`, `create-row`, `delete-row`, `move-row` |\n| `E` | 员工（其目标计划所属者）\
  \ | `private-access`, `create`, `delete`, `delete-group-goal`, `move`, `share`,\
  \ `cascade-pull`, `cascade-push`, `cascade-align`, `unalign-parent`, `unalign-child`,\
  \ `create-row`, `delete-row`, `move-row` |\n| `EM` | 用户数据文件中定义的员工的经理 | `private-access`,\
  \ `create`, `delete`, `delete-group-goal`, `share`, `cascade-push`, `cascade-align`,\
  \ `create-row`, `delete-row`, `move-row` |\n| `EMM` | 员工的经理的经理 | `private-access`,\
  \ `delete`, `delete-group-goal`, `share`, `cascade-push`, `cascade-align`, `create-row`,\
  \ `delete-row`, `move-row` |\n| `EM+` | 员工的经理以及该经理以上的所有汇报链成员 | 与上述操作相同 |\n| `ED`\
  \ | 员工的直接下属 | 与上述操作相同 |\n| `EDD` | 员工直接下属的直接下属 | 与上述操作相同 |\n| `ED+` | 员工的直接下属以及层级中所有下属\
  \ | 与上述操作相同 |\n\n\n\nEM | 员工经理的直接下属（即同一位经理下的同事）。 | 与前述操作相同 |  \nEX | 用户数据文件中定义的员工矩阵经理。\
  \ | 与前述操作相同 |  \nEY | 以矩阵经理身份汇报给员工的直接下属。 | 与前述操作相同 |  \nEH | 用户数据文件中定义的员工 HR 经理。\
  \ | `private-access`， `share`， `cascade-align`， `create-row`， `delete-row`， `move-row`\
  \ |  \nF | 表单审核人。如果你已将目标拉取至绩效表单，并注意到某些审核绩效表单的人因与员工无直接汇报关系而无法查看目标，则可能需要使用此角色。完整说明请参见\
  \ SAP 说明 2077256。 | `private-access`， `create`， `share`， `cascade-align`， `create-row`，\
  \ `delete-row`， `move-row` |  \nOP | 目标父级角色。仅在使用团队目标时相关（将在第 5 章中介绍）。指将该目标下推至员工计划的人。\
  \ | `private-access`， `delete` |  \nOC | 目标子级角色。仅在使用团队目标时相关（将在第 5 章中介绍）。指其目标由此目标下推而来的人。\
  \ | `private-access` |  \nCascader | 将目标级联至员工计划的人。请记住，此角色仅在 `cascader-role` 开关打开时生效。\
  \ | `create-row`， `delete-row`， `move-row`（仅用于字段/表级权限） |\n\n> **注意**  \n> 上表并未列出\
  \ SAP SuccessFactors 中所有可用角色，仅包含目标管理模块中支持的角色。如需查看所有模块的完整列表，请参阅 SAP 说明 2087940。\n\
  \n以下示例展示了从 SuccessStore 创建模板时赋予的标准权限。根据我们的经验，你很可能需要修改这些权限以适应组织的需求：\n\n#### `<field-permission>`\
  \ 元素\n\n`<field-permission>` 元素使用标准角色定义各字段的权限。`type` 属性中可设置的可用权限包括 `None`、`Read`\
  \ 和 `Write`。\n\n> **注意**  \n> 表字段的权限也可以按单个表列来定义；但我们不建议这样做，因为绩效管理（PM）表单不支持此方式。\n\n\
  以下示例展示了通过在线编辑器添加字段时的默认权限。我们的示例还包含了手动添加的备注字段：\n\n#### `<plan-layout>` 元素\n\n`<plan-layout>`\
  \ 元素控制主目标计划屏幕上各字段的显示顺序。此外，列权重决定了当浏览器窗口缩放时该字段试图占据的屏幕空间（所有权重的总和应为 100）。\n\n示例如下：\n\
  \n#### `<form-layout>` 元素\n\n该元素控制目标在绩效管理表单内的“目标详情”标签页中的显示方式（假设你正在将目标集成到绩效表单中）。整个布局在\
  \ `CDATA[ ]` 的括号内以 html 编写。从以下示例中可以看到，每个函数调用如何对应表格单元格内一个特定字段（在字段定义中具有相应 `id`）的显示，以及列宽如何再次通过百分比定义（这些百分比的总和应为\
  \ 100）。\n\n示例如下：\n\n```\nCategory: ${field.category}\n#set ($group = \"name-state\"\
  )\n\n#if ($display.name) ${label.name}:\n${field.name} #end\n&nbsp;\n#if ($display.metric)\
  \ ${label.metric}:\n${field.metric} #end\n&nbsp;\n#if ($display.weight) ${label.weight}:\n\
  ${field.weight} #end\n&nbsp;\n#if ($display.start) ${label.start}:\n${field.start}\
  \ #end\n&nbsp;\n#if ($display.due) ${label.due}:\n${field.due} #end\n&nbsp;\n#if\
  \ ($display.done) ${label.done}:\n${field.done} #end\n&nbsp;\n#if ($display.state)\
  \ ${label.state}:\n${field.state} #end\n\n#### turn off grouping for subsequent\
  \ fields #set ($group = \"\")\n\n#if ($display.milestones)\n\n${label.milestones}:${field.milestones}\n\
  #end\n]]>\n```\n\n> **注意**  \n> 在 `<form-layout>` 元素之后，如果你是从 SuccessStore 创建的模板，可能会注意到\
  \ `<pdf-layout>` 和 `<details-layout>` 元素。这些是已不再使用的遗留元素，可以忽略，或替换为 `\"<pdf-layout><![CDATA[[]]]></pdf-layout>\
  \ <details-layout><![CDATA[[]]]></details-layout>\"`。如果完全移除它们，系统会在上传 XML 时抛出错误。\n\
  \n#### `<mobile-field-list>` 元素\n\n此部分控制移动端目标列表视图中显示的字段。如果你在在线工具中勾选了 `done` 和 `state`\
  \ 字段的复选框，它们将如下示例所示显示在此处：\n\n> **注意**  \n> 我们在文档末尾添加了 `<obj-plan-template>` 字段的闭合标签，因为这是\
  \ XML 文档的结尾，需要闭合该标签。\n\n## 基本配置总结\n\n恭喜！你现在已经开启了目标管理，使用在线编辑工具配置了一个基本的目标计划模板，将该表单分配给了用户，并对底层\
  \ XML 进行了修改以支持组织的任何基本需求！现在，是时候按照端到端的目标计划流程，参观我们在示例中创建的表单了。\n\n## 使用目标管理\n\n在本节中，我们将基于上一节构建的样本\
  \ XML，通过一个基本的目标设置流程，审视我们配置的最终成果。首先，我们将以经理身份登录，在自己的计划上创建一些目标，并将这些目标级联给下属员工。然后，我们将作为其中一名员工登录，查看目标，调整我们的计划，并与同事对齐目标。让我们开始吧！\n\
  \n### 以经理身份创建和级联目标\n\n在目标设定周期中，经理的典型工作场景是创建目标并将其级联给员工。以我们的模型公司示例为例，此时 CEO 将登录系统并开始向团队分配目标。让我们按照以下步骤了解如何实现：\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig19_HTML.jpg](img/499651_1_En_4_Fig19_HTML.jpg)\n\
  \n**图 4-19** 目标计划\n\n1. 以你分配给经理角色的某个用户身份登录系统或代理登录。\n2. 点击屏幕左上角的导航菜单，选择“目标”。屏幕将如图\
  \ 4-19 所示。被选为默认计划并分配给经理的目标计划应出现在用户名旁边的下拉菜单中。你会注意到所选类别已出现，但尚未分配任何目标。\n3. 点击“添加目标”。你将看到创建新目标、使用目标向导或从其他目标计划复制的选项。\n\
  4. 点击“创建新目标”。你将看到添加个人目标或库目标的选项。点击“库目标”。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig21_HTML.jpg](img/499651_1_En_4_Fig21_HTML.jpg)\n\
  \n**图 4-21** 添加目标\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig20_HTML.jpg](img/499651_1_En_4_Fig20_HTML.jpg)\n\
  \n**图 4-20** 添加库目标\n\n5. 你将看到已上传至库并与目标计划模板中 `<obj-library>` 映射关联的目标列表。通过点击左侧的复选框选择目标，然后点击“添加所选”。示例如图\
  \ 4-20 所示。根据 `<field-definition>` 元素中的配置，将出现如图 4-21 所示的“添加目标”屏幕。映射的库字段将预填充，如下所示。开始日期和截止日期也将默认填入\
  \ `<obj-plan-start>` 和 `<obj-plan-end>` 日期。\n\n\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig22_HTML.jpg](img/499651_1_En_4_Fig22_HTML.jpg)\n\
  \n**图 4-22** 目标计划中显示的目标\n\n1.  根据需要修改字段中的值，然后点击“保存更改”。\n    该目标将如图 4-22 所示。\n\n\
  ![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig23_HTML.jpg](img/499651_1_En_4_Fig23_HTML.jpg)\n\
  \n**图 4-23** 级联目标\n\n1.  点击目标旁边的复选框将其选中，然后点击最右侧“操作”下方的三个点图标。您将看到基于您的 `<permission>`\
  \ 元素设置而可用的操作。您也可以点击屏幕顶部“添加目标”旁边的“操作”来查看更多操作。点击此处并选择“级联”。屏幕将如图 4-23 所示显示用户的直接下属。\n\
  \n2.  假设您已正确设置权限，您可以勾选经理的每个直接下属旁边的复选框，然后点击“下一步”。确认字段已按您的要求填充，然后点击“级联”。\n\n3.  在成功弹出窗口中，点击“关闭”。\n\
  \n4.  现在点击左上角已登录经理的姓名，下拉显示直接下属列表。点击您要查看其计划的员工姓名。加载计划后，您将在员工的目标计划上看到您级联的目标。\n\n###\
  \ 作为员工创建和对齐目标\n\n现在我们已经了解了经理如何创建目标并将其级联给员工，让我们来看看员工如何使用 SMART 目标向导创建自己的目标并将其与他人对齐。请遵循以下步骤：\n\
  \n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig24_HTML.jpg](img/499651_1_En_4_Fig24_HTML.jpg)\n\
  \n**图 4-24** 使用 SMART 向导添加目标\n\n1.  以被分配了您所创建的员工角色的身份登录或代理登录。\n\n2.  点击屏幕左上角的导航菜单，然后点击“目标”。将加载默认的目标计划。\n\
  \n3.  点击“添加目标”。您将看到用于创建新目标、使用目标向导或从其他目标计划复制的选项。\n\n4.  点击“目标向导”。“添加 SMART 目标”屏幕将如图\
  \ 4-24 所示。通过输入所需信息并点击“下一步”逐步完成向导的每个步骤。该目标将出现在目标计划上。确保目标设置为公开。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig25_HTML.jpg](img/499651_1_En_4_Fig25_HTML.jpg)\n\
  \n**图 4-25** 授予查看所有员工目标计划模板权限的角色\n\n1.  重新以管理员身份登录，并按照“创建员工角色”部分的步骤，创建一个新的员工角色，但这次将目标用户的权限设置为“全部”。结果应如图\
  \ 4-25 所示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig26_HTML.jpg](img/499651_1_En_4_Fig26_HTML.jpg)\n\
  \n**图 4-26** 对齐目标\n\n1.  现在，为同一个经理名下的另一位员工重复步骤 1-4。在目标计划主页面上，勾选目标旁边的复选框。点击“操作”列下方的三个点图标，并选择“链接到另一位员工的目标”，如图\
  \ 4-26 所示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig27_HTML.jpg](img/499651_1_En_4_Fig27_HTML.jpg)\n\
  \n**图 4-27** 对齐目标的结果\n\n1.  在出现的新弹出窗口中，点击两位员工共同经理的姓名。您将看到经理直接下属的姓名。点击步骤 1 中用户旁边的单选按钮，然后点击“下一步”。\n\
  \n2.  点击您在步骤 1-4 中创建的目标旁边的单选按钮，然后点击“下一步”。\n\n3.  在确认屏幕上，点击“链接”。您现在应该看到该目标与第一个目标对齐，如图\
  \ 4-27 所示。\n\n![../images/499651_1_En_4_Chapter/499651_1_En_4_Fig28_HTML.jpg](img/499651_1_En_4_Fig28_HTML.jpg)\n\
  \n**图 4-28** 目标对齐聚焦报告\n\n1.  现在您也可以点击“操作”列下方的三个点图标，并选择“目标对齐聚焦”来查看此目标及其链接的另一个目标的状态，如图\
  \ 4-28 所示。\n\n在前面的示例中，我们向您展示了两种最常见的目标计划场景：一种是经理为自己和员工设定目标，另一种是员工也可以查看其他计划中的公开目标，并将目标与其自身计划对齐。我们还可以说明上述步骤如何帮助我们的模范公司\
  \ CEO 不仅创建和级联目标，还能跨组织跟踪相互关联的目标的进度。\n\n## 总结\n\n我们希望您享受了设置和使用基本目标计划的体验！现在您应该知道如何在配置中激活目标管理、设置权限以配置和管理目标管理、创建基本目标计划模板并直接编辑\
  \ XML，以及作为经理和员工使用该计划。您还看到了模范公司如何使用这个强大的在线工具来设定其公司目标，并在公司内逐级下传，以便员工执行。此外，我们看到了员工如何使用该工具在相互关联的目标上进行协作，以及如何跨公司跟踪这些目标的进度。我们还向您展示了员工如何从示例目标库中提取内容并设定自己的个人目标。在下一章中，我们将逐步介绍一些利用目标管理中不太常用但功能依然强大的特性的替代目标设定方法。\n\
  \n## 5. 备选目标管理概念与功能\n\n根据我们的经验，上一章介绍的基本配置和用法是大多数组织在实施目标管理时所必需的。然而，还有其他一些管理工具和可配置功能，使用范围虽不广，但可能非常强大。此类功能通常仅用于需要支持其独特业务流程的组织。在本章中，我们假设您已熟悉创建和使用目标计划的基本工具，并将逐步介绍一些更特殊的场景，在这些场景中我们可以利用一些较少使用的管理功能和配置选项。\n\
  \n> **注意**\n>\n> 我们假设在进行本章所述的任何额外配置之前，您已完成前一章中概述的基本配置。\n\n## 使用批量更新工具管理目标\n\n许多人力资源管理员最终会通过授予他们一个权限角色来手动管理目标，该角色允许他们访问和查看所有员工或他们被指定为人力资源管理员的目标计划。虽然这对于小团体来说很实用，但对于大量员工则需要使用批量更新工具。以下小节概述了可用于执行此类批量更新的两种工具。\n\
  \n### 批量导入和分配目标\n\n在某些业务目标设定对所有员工都是集中式的组织中，目标将由管理员批量分配给员工，而不是由员工自行选择。这种情况可能程度不同：员工可能完全没有自己创建的目标，或者某些目标由集中管理员设定，其他目标则由员工自行分配。对于基本的目标计划，有两个屏幕有助于批量分配目标：旧的“导入目标”和“Beta\
  \ 版目标导入”屏幕。\n\n### 设置导入目标的前提条件\n\n\n\n## 旧版导入目标屏幕\n\n默认情况下，当您按照上一章的配置步骤启用目标管理时，管理员可以访问旧版“导入目标”屏幕。要为导入目标分配权限并激活测试版目标导入，请执行以下步骤：\n\
  \n1. 在搜索栏中输入并选择“管理权限角色”。\n2. 屏幕加载后，点击要修改的角色，然后点击“权限…”。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig1_HTML.jpg](img/499651_1_En_5_Fig1_HTML.jpg)\n\
  \n**图 5-1** 导入目标和目标管理功能设置权限\n\n3. 点击左侧的“管理目标”，然后点击右侧的“导入目标”和“目标管理功能设置”，如图 5-1 所示。\n\
  4. 点击“完成”。在主屏幕上点击“保存更改”。\n5. 分配权限后，可以通过在搜索栏中输入并选择“目标管理功能设置”，选择“目标导入”，然后点击“保存”来激活“测试版目标导入”。\n\
  \n**注意：** 这两个屏幕并不是批量分配目标的唯一方式。如果您实施团队目标，还有另一种相关的方法，我们将在下一节中介绍。\n\n### 测试版目标导入\n\n\
  尽管名为“测试版”，但测试版目标导入已完全可用。它提供了 SAP 在旧版导入目标基础上添加的最新功能，包括支持指标查找表和注释；将导入作为作业调度；对齐目标；更新已添加到计划、使命声明和团队目标中的目标；以及将目标设置为只读。要通过“测试版目标导入”屏幕导入目标，请执行以下步骤：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig2_HTML.jpg](img/499651_1_En_5_Fig2_HTML.jpg)\n\
  \n**图 5-2** 测试版目标导入屏幕\n\n1. 请确保您以已分配电子邮件的用户身份登录，否则您将无法在最后一步看到结果电子邮件！\n2. 在搜索栏中输入并选择“测试版目标导入”。测试版目标导入屏幕将出现，如图\
  \ 5-2 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig3_HTML.jpg](img/499651_1_En_5_Fig3_HTML.jpg)\n\
  \n**图 5-3** 示例目标导入模板 CSV 文件（含标题）\n\n3. 选择您要上传目标的目标计划模板。点击“生成 CSV 标题”。系统将根据模板`XML`中的配置，下载一个包含与目标计划模板关联字段的文件。示例如图\
  \ 5-3 所示。\n\n**表 5-1** 目标导入文件列\n\n| 列 | 描述 |\n| --- | --- |\n| `TYPE` | 指定您上传的是普通目标的`OBJECTIVE`、取决于团队目标类型的`OBJECTIVE_GROUPV1`或`OBJECTIVE_GROUP_V2`（我们将在下一节介绍团队目标版本），还是团队目标的`OBJECTIVE_TEAM`（也将在下一节介绍）。您还可以指定`TASK`、`MILESTONE`、`TARGET`、`METRICLOOKUP`或`OBJCOMMENT`用于与目标关联的表数据。\
  \ |\n| `ACTION` | 可以是`ADD`、`UPDATE`、`DELETE`、`ASSIGN`、`SHARE`、`UNSHARE`或`UNASSIGN`。`SHARE`和`UNSHARE`用于为团队目标分配/取消分配所有者。`ASSIGN`/`UNASSIGN`只是将团队目标添加到计划中。\
  \ |\n| `ID`/`SUBID` | 未使用。SAP 将使用此字段填充创建目标导出屏幕时系统为该目标生成的自动内部系统 ID。 |\n| `GUID` |\
  \ 目标的唯一 ID，供您（上传者）用于标识要分配的目标。 |\n| `SUBGUID` | 表数据（`TASK`、`MILESTONE`等）的唯一 ID，供您（上传者）用于标识该表数据。\
  \ |\n| `FILTER_*` | 当您填充这些字段时，系统将查看用户数据文件（`UDF`）中的相应字段，并将目标/表数据分配给所有具有相同值的用户。例外情况是`MGR`字段，它不起作用（保留以备将来功能使用）。如果您不想进行过滤，而是将行分配给所有用户，请在`FILTER_USERNAME`列中输入“`ALL`”，并将其他所有列留空。\
  \ |\n| `OBJECTIVE_*` | 这些列将根据您选择的模板的`XML`定义而变化。它们代表目标计划中的每个字段/表字段。`PUBLIC`字段的值为“`Y`”或“`N`”。日期字段应采用`3/30/2020`的格式。\
  \ |\n\n4. 向文件添加行。\n\n**注意：** 让我们花点时间看看上图中显示的示例导入模板。您在文件中包含的每一行数据代表要添加的一个目标或表字段行，至少包含模板上的最小必填字段以及一个或多个用户的分配。列`D`、`E`和`F`都代表您赋予目标的\
  \ ID。列`G`到`L`都以`FILTER`开头，允许您使用过滤条件来选择谁将获得该目标。任何匹配过滤条件的用户都将被分配该目标。其余以`OBJECTIVE`开头的列是根据`XML`配置的字段，将与目标关联填充。表\
  \ 5-1 给出了每一列的具体说明。\n\n5. 点击“导入文件”并选择您更新的文件。\n6. 选择字符编码。\n\n**注意：** 我们推荐使用`UTF-8`字符编码，特别是对于包含多种语言的国际化实施，以避免上传格式错误的字符。\n\
  \n7. 根据需要选中“只读目标”和“允许重复分配团队目标”旁边的复选框。\n8. 点击“导入”。您将收到一条错误消息或成功消息，表明已调度作业，并且您将收到一封包含结果的电子邮件。\n\
  \n**注意：** 作为使用此屏幕上传的替代方法，您可以在配置中使用相同的文件模板来调度作业，以便从`SFTP`服务器拉取文件。为此，请登录您公司实例的配置环境，点击“管理作业”。点击“创建作业”，并在“作业类型”字段中选择“`TGM\
  \ FTP Data Import`”。在上传非常大的文件时，您可能希望使用此方法。请注意，无论使用哪种方法，系统都限制您一次最多上传 30,000 条记录。\n\
  \n### 旧版导入目标\n\n根据 SAP 帮助文档，旧版“导入目标”仅在“测试版目标导入”不支持您要完成的功能时使用——具体来说，是设置目标计划的可见性以及将目标设置为只读。然而，我们在同一文档中看到，这些功能在测试版目标导入中是支持的。此外，我们不建议设置目标计划的可见性——这是在基于角色的权限存在之前的旧版活动，而基于角色的权限现在用于控制对目标计划的访问。因此，我们不建议使用旧版“导入目标”。根据我们的个人经验，我们从未遇到过需要使用它的客户。\n\
  \n### 向最终用户添加导入目标的权限\n\n在某些情况下，您可能希望为目标导入功能对最终用户（例如经理）开放。为此，请将以下代码段添加到目标计划`XML`的`<permission>`元素部分：\n\
  \n```\n<permission>\n  ...\n</permission>\n```\n\n然后，经理将看到从目标计划屏幕右上角“操作”菜单中导入目标的选项，如图\
  \ 5-4 所示。文件格式与管理员的相同；但是，只能使用用户过滤器，并且用户名必须是当前屏幕上显示的目标计划对应的用户名。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig4_HTML.jpg](img/499651_1_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4** 从操作菜单导入目标\n\n\n\n## 员工间目标转移\n\n当员工离职、调岗或工作职责发生变化时，会发生什么？在很多情况下，这会导致业务目标的转移，需要将这些目标从一个人转移到另一个人。为了实现这一点，我们可以在员工之间转移目标。接下来，我们将逐步介绍设置和使用目标转移功能所需的步骤。\n\
  \n### 设置配置\n\n在使用该功能之前，需要先在配置中启用它。请按照以下步骤激活该功能：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig5_HTML.jpg](img/499651_1_En_5_Fig5_HTML.jpg)\n\
  \n**图 5-5**  \n在配置中启用目标转移向导\n\n1.  登录配置，并选择您的公司实例。\n2.  点击“公司设置”。\n3.  勾选“TGM/CDP\
  \ 目标转移向导”旁的复选框，如图 5-5 所示。\n4.  点击“保存”。\n\n#### 分配权限\n\n现在功能已激活，接下来需要分配使用它的权限：\n\n\
  ![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig6_HTML.jpg](img/499651_1_En_5_Fig6_HTML.jpg)\n\
  \n**图 5-6**  \n分配目标转移权限\n\n1.  在搜索栏中输入并选择“管理权限角色”。\n2.  屏幕加载后，点击您要修改的角色。然后点击“权限...”\n\
  3.  点击左侧的“管理用户”，然后点击右侧的“目标转移”，如图 5-6 所示。\n4.  点击“完成”。\n5.  在主屏幕上，点击“保存更改”。\n\n###\
  \ 使用目标转移\n\n现在功能已开启，并且我们拥有使用权限，可以开始操作了！请遵循以下步骤：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig7_HTML.jpg](img/499651_1_En_5_Fig7_HTML.jpg)\n\
  \n**图 5-7**  \n“目标转移”屏幕\n\n1.  在搜索栏中输入并选择“在用户之间转移目标”。屏幕将如图 5-7 所示显示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig8_HTML.jpg](img/499651_1_En_5_Fig8_HTML.jpg)\n\
  \n**图 5-8**  \n转移目标\n\n2.  输入要转出目标的员工的用户名，或使用“查找用户”链接来查找该员工。\n3.  对要转入目标的员工重复上一步操作。\n\
  4.  点击“查找目标”。计划中的目标将如图 5-8 所示显示。\n\n> **注意**  \n> 请勿转移已分配给用户的母目标。\n\n5.  勾选要转移的目标旁的复选框，然后点击“转移”。\n\
  6.  屏幕将更新，告知您目标已成功转移。\n\n> **注意**  \n> 对目标所做的任何评论，以及与其他目标的任何关联，也将一并转移。\n\n## 其他目标管理概念与功能\n\
  \n在本节中，我们将介绍一些不常用，但可以提供强大功能以满足组织更专业化需求的功能。这包括目标执行与对齐图、目标计划状态、自定义计算、成就查找、组目标、团队目标和计划（Initiatives）。\n\
  \n### 目标执行/对齐图\n\n目标执行提供了一种方法，使客户能够比标准完成百分比和状态字段更深入地跟踪整个组织内的目标进展。它适用于频繁跟踪目标进度，并将目标状态更新作为其业务执行策略一部分的组织。例如，一个采用目标管理（MBO）方法论并需要工具来帮助跟踪进度的组织。目标执行由三个组件组成：状态报告、执行图和会议议程。其核心理念是，组织团队围绕其关联目标紧密合作，并定期提供状态报告。通过这种方式，系统数据保持最新，显示关联目标进展情况的执行图或对齐图也始终保持相关性。\n\
  \n> **注意**  \n> 由于 Adobe Flash 将在 2020 年底退役，执行图正被对齐图取代。两者的配置几乎相同，主要的技术差异在于底层用户界面技术。我们建议使用新的对齐图，因为旧技术将不再受支持。此外，目标执行功能的全部维护结束时间定于\
  \ 2019 年下半年，生命周期结束时间定于 2020 年下半年。有关更多详细信息，请参阅 SAP 说明 2071572。因此，我们保留本节内容主要是为了支持现有客户，不建议为新客户启动新的目标执行实施。\n\
  \n### 目标执行前提条件\n\n使用此功能时，需要注意一些限制。首先，目标必须相互关联（级联或对齐），可视化才有意义。其次，我们将在本章中概述的标准字段一次只能关联一个激活的目标计划（这是屏幕知道正在执行哪个计划并进行渲染的方式）。同时请记住，权限在此处发挥作用，它决定了哪些目标是公开的，哪些是私有的，以及因此谁可以在执行图/对齐图中看到它们。\n\
  \n#### 配置设置\n\n要在配置中激活目标执行，请遵循以下步骤：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig9_HTML.jpg](img/499651_1_En_5_Fig9_HTML.jpg)\n\
  \n**图 5-9**  \n目标执行配置设置\n\n1.  登录您公司实例的配置，然后点击“公司设置”。\n2.  勾选“启用执行图 – 需要‘版本 11 UI\
  \ 框架 (ULTRA)’”、“启用状态报告 – 需要‘版本 11 UI 框架 (ULTRA)’”和“启用会议议程 – 需要‘版本 11 UI 框架 (ULTRA)’”旁的复选框。示例如图\
  \ 5-9 所示。\n3.  点击“保存”。\n\n#### 配置权限\n\n请遵循以下步骤为您的管理员角色分配配置目标执行的权限：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig10_HTML.jpg](img/499651_1_En_5_Fig10_HTML.jpg)\n\
  \n**图 5-10**  \n管理目标执行权限\n\n1.  在搜索栏中输入并选择“管理权限角色”。\n2.  点击您要编辑的角色名称。\n3.  点击“权限...”\n\
  4.  点击左侧的“管理目标”。\n5.  勾选“管理目标执行配置”和“目标管理功能设置”旁的复选框，如图 5-10 所示。\n6.  点击“完成”。\n7.\
  \  在主屏幕上，点击“保存更改”。\n\n### 目标执行/对齐图配置\n\n在目标执行屏幕工作之前，您需要将表 5-2 中的以下字段实现在您的目标计划 XML\
  \ 的 `<field-definition>` 元素部分。\n\n**表 5-2**  \n目标执行字段\n\n| 字段 | 类型 | 描述 |\n| ---\
  \ | --- | --- |\n\n\n\n`bizx-target` | 数值 | 指计划参与者试图实现的目标指标值。如果目标是团队目标，您还可以设置字段属性\
  \ `rollup-calc-type=\"sum\"` 或 `\"average\"`，以便目标负责人根据所有关联目标的输入值获得最终目标分数。请务必在 `<plan-layout>`\
  \ 元素中也包含此字段。 |\n\n`bizx-actual` | 数值 | 当前已实现的指标实际值。如果目标是团队目标，您还可以设置字段属性 `rollup-calc-type=\"\
  sum\"` 或 `\"average\"`，以便目标负责人根据所有关联目标的输入值获得最终实际分数。请务必在 `<plan-layout>` 元素中也包含此字段。\
  \ |\n\n`bizx-pos` | 枚举 | 表示成功的可能性。仅限于以下枚举值，需在 XML 中为字段输入这些值：\n```\n<enum-value value=\"\
  1\" style=\"background:red;color:black;\">\n<enum-label>低</enum-label>\n</enum-value>\n\
  <enum-value value=\"2\" style=\"background:yellow;color:black;\">\n<enum-label>中</enum-label>\n\
  </enum-value>\n<enum-value value=\"3\" style=\"background:green;color:white;\">\n\
  <enum-label>高</enum-label>\n</enum-value>\n<default-value>3</default-value>\n```\n\
  请务必在 `<plan-layout>` 元素中也包含此字段。 |\n\n`bizx-strategic` | 枚举 | 标识此目标是否为战略目标的“是/否”标志。您只能在\
  \ XML 中定义以下值：\n```\n<enum-value value=\"0\" style=\"background:white;color:black;\"\
  >\n<enum-label>非战略</enum-label>\n</enum-value>\n<enum-value value=\"1\" style=\"\
  background:white;color:black;\">\n<enum-label>战略</enum-label>\n</enum-value>\n<default-value>0</default-value>\n\
  ```\n请务必在 `<plan-layout>` 元素中也包含此字段。 |\n\n`bizx-effort-spent` | 枚举 | 显示在执行地图、状态报告和会议议程页面中（非目标计划主页面）。该字段仅限于您必须在\
  \ XML 中包含的以下值：\n```\n<enum-value value=\"0\" style=\"background:white;color:black;\"\
  >\n<enum-label>无</enum-label>\n</enum-value>\n<enum-value value=\"1\" style=\"background:white;color:black;\"\
  >\n<enum-label>非常少</enum-label>\n</enum-value>\n<enum-value value=\"2\" style=\"\
  background:white;color:black;\">\n<enum-label>很少</enum-label>\n</enum-value>\n<enum-value\
  \ value=\"3\" style=\"background:white;color:black;\">\n<enum-label>一些</enum-label>\n\
  </enum-value>\n<enum-value value=\"4\" style=\"background:white;color:black;\">\n\
  <enum-label>很多</enum-label>\n</enum-value>\n<enum-value value=\"5\" style=\"background:white;color:black;\"\
  >\n<enum-label>非常多</enum-label>\n</enum-value>\n<default-value>0</default-value>\n\
  ``` |\n\n`bizx-status-comments` | 文本域 | 仅用于状态报告视图上的评论（非目标计划主页面的评论）。 |\n\n将字段添加到\
  \ XML 后，您可以按照以下步骤激活目标执行功能：\n\n> **注意：** 如果您之前未添加该字段，则在尝试保存设置时会收到错误提示！\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig11_HTML.jpg](img/499651_1_En_5_Fig11_HTML.jpg)\n\
  \n**图 5-11** 目标执行设置\n\n1.  在搜索栏中输入并选择“目标执行设置”。\n2.  在“目标计划”字段中，选择您已添加目标执行字段的活跃目标计划。\n\
  3.  在“状态报告设置”下，考虑是否要为员工添加填写状态报告的提醒。在图 5-11 所示的示例中，我们将开始日期设为一年的第一个星期五，并设置每周五发送提醒通知。如果报告在周一之前未填写，员工将收到另一封提醒邮件，通知状态报告已逾期。\n\
  4.  点击“完成”以保存更改。\n\n在实际发送电子邮件之前，您需要完成电子邮件模板的配置。如果您不想发送邮件提醒，您仍然需要完成上述提醒设置；但是，您可以禁用后续步骤中概述的电子邮件。要配置提醒邮件，请执行以下步骤：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig12_HTML.jpg](img/499651_1_En_5_Fig12_HTML.jpg)\n\
  \n**图 5-12** 目标执行邮件配置\n\n1.  在搜索栏中输入并选择“电子邮件通知模板设置”。\n2.  根据需要勾选“状态报告到期提醒”、“状态报告逾期提醒”、“状态报告更新请求”和“状态报告已提交通知”旁边的复选框，然后点击“保存通知设置”。示例见图\
  \ 5-12。\n3.  点击您想要编辑的电子邮件模板名称。完成编辑后，点击“保存更改”。\n\n如果您希望使用对齐图表而不是执行地图，在激活上述所有通知后，还应执行以下步骤：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig13_HTML.jpg](img/499651_1_En_5_Fig13_HTML.jpg)\n\
  \n**图 5-13** 启用目标对齐图表\n\n1.  在搜索栏中输入并选择“目标管理功能设置”。\n2.  勾选“启用目标对齐图表”旁边的复选框，如图 5-13\
  \ 所示。\n3.  点击“保存”。\n\n> **注意：** 我们建议使用新的对齐图表，因为目标执行功能将在 2020 年后不再受支持。\n\n### 分配最终用户权限角色\n\
  \n现在我们已经完成了配置，接下来可以为最终用户分配使用目标执行功能的权限。请执行以下步骤：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig14_HTML.jpg](img/499651_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14** 目标执行最终用户权限\n\n1.  在搜索栏中输入并选择“管理权限角色”。\n2.  点击您要编辑的角色名称。\n3.  点击“权限...”\n\
  4.  在左侧点击“目标”。\n5.  根据需要勾选“访问执行地图”、“访问会议议程”和“访问状态报告”旁边的复选框。示例见图 5-14。\n\n> **注意：**\
  \ 通常，执行地图分配给经理或高管角色，会议议程分配给经理角色，状态报告分配给员工角色。\n\n6.  点击“完成”。\n7.  在权限角色主屏幕上，点击“保存更改”。\n\
  \n### 使用目标执行\n\n下面，我们将通过一个快速场景来演示目标执行的工作原理：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig15_HTML.jpg](img/499651_1_En_5_Fig15_HTML.jpg)\n\
  \n**图 5-15** 填写目标执行专属字段\n\n1.  以一名目标关联到其经理的员工身份登录。\n2.  导航至目标计划。\n3.  在“操作”列下，点击“编辑目标”。填写新的\
  \ `bizx-target`、`bizx-actual`、`bizx-pos` 和 `bizx-strategic` 字段的值。示例见图 5-15。\n\n\
  ![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig16_HTML.jpg](img/499651_1_En_5_Fig16_HTML.jpg)\n\
  \n**图 5-16** 目标执行状态报告\n\n1.  导航至“状态报告”。如图 5-16 所示，填写 `bizx-target`、`bizx-actual`、`bizx-effort-spent`\
  \ 和 `bizx-status-comments` 字段的值。点击“发送状态更新”。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig17_HTML.jpg](img/499651_1_En_5_Fig17_HTML.jpg)\n\
  \n**图 5-17** 会议议程页面\n\n1.  以该目标所关联的目标负责人（经理）身份登录。\n\n\n\n2.  导航到“目标 ➤ 会议议程”。屏幕将如图\
  \ 5-17 所示。您将看到员工更新的状态报告。您也可以使用此屏幕选择/取消选择要在 PDF 打印输出中创建的目标。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig18_HTML.jpg](img/499651_1_En_5_Fig18_HTML.jpg)\n\
  \n**图 5-18** 目标对齐图表\n\n1.  导航到“目标 ➤ 目标对齐图表”。假设存在关联目标，并且所有“目标执行”字段已通过目标计划和状态报告填写完毕，您将看到这些关联目标的状态，如图\
  \ 5-18 所示（如果字段值缺失，您将看到一个错误屏幕）。您可以点击`>`和`<`图标来查看/隐藏每个目标之间的关联关系。您还可以下载图表的 PDF 或 JPEG\
  \ 格式。\n\n#### 目标计划状态\n\n根据我们的经验，一些组织要求锁定目标计划，以便限制或禁止对目标进行进一步编辑。例如，一个组织可能希望在 1 月份强制执行目标设定期，之后锁定计划，以便在当年后期无法编辑目标（例如，以防止任何试图使原始目标看起来更接近实际结果的行为）。由于目标计划不是可路由的表单，实现此目标的逻辑方法是通过目标计划状态。目标计划状态在目标计划顶部添加一个链接，以便只有被授权的人员才能锁定或解锁该计划。当表单被锁定或解锁时，它将遵循两套（或更多，取决于您配置的数量）不同的已定义权限（通常将字段设置为可编辑或只读）。\n\
  \n> **注意**\n>\n> 此功能不适用于群组目标和团队目标。另外，虽然我们个人只见过锁定和解锁状态，但从技术上讲，您可以定义任意数量的状态。更多详情，请参见\
  \ SAP 注释`2072109`。\n\n### 配置目标计划状态\n\n要添加目标计划状态，您需要为每个状态定义一组权限。这可以通过添加`<object-plan-states>`元素，然后在其内部定义每个`<object-plan-state>`元素来完成。每个`<object-plan-state>`应包含一组`<permission>`和`<field-permission>`元素，这些元素定义了特定于该状态的权限。\n\
  \n示例代码如下所示：\n\n```\n...\n  <object-plan-states>\n    <object-plan-state id=\"unlocked\"\
  >\n      <label>Unlocked</label>\n      <action>Unlock</action>\n      <permission>...</permission>\n\
  \      <field-permission>...</field-permission>\n    </object-plan-state>\n    <object-plan-state\
  \ id=\"locked\">\n      <label>Locked</label>\n      <action>Lock</action>\n   \
  \   <permission>...</permission>\n      <field-permission>...</field-permission>\n\
  \    </object-plan-state>\n  </object-plan-states>\n...\n```\n\n### 使用目标计划状态\n\n\
  添加目标计划状态后，用户将在目标计划顶部看到状态指示器，如下所示。在我们的示例中，以员工身份登录时，您可以看到目标计划状态是什么，但必须由经理登录并查看员工的目标计划才能更改其状态。状态名称和操作将根据您在\
  \ XML 配置中的定义显示。在图 5-19 所示的示例中，经理只需点击“锁定”链接，权限就会更改为我们在示例代码中为“锁定”状态定义的权限。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig19_HTML.jpg](img/499651_1_En_5_Fig19_HTML.jpg)\n\
  \n**图 5-19** 目标计划状态的经理视图\n\n### 自定义计算\n\n可以创建基于其他字段值进行计算的自定义字段。一个常见的例子是“目标评分”字段，您可以通过将单个目标评级乘以该目标的权重来计算。\n\
  \n#### 配置自定义计算\n\n使用计算功能需要在 XML 中添加两个新元素（以及它们可能拥有的子元素）。`<calculator>`元素定义了执行计算的方式（可以理解为`字段\
  \ a + 字段 b`），而`<auto-population>`元素定义了哪个字段被填充哪个计算结果。此外，`<auto-population>`可以包含规则。`<rules>`元素允许您定义哪些`<calculator>`元素将作为条件，哪些将作为结果。您甚至可以包含指标查找表（也称为成就查找表），这有助于定义哪些评分满足各种条件和阈值，从而转换为最终评级。\n\
  \n> **注意**\n>\n> 有关指标查找表的更多信息，请参见 SAP 注释`2072202`。\n\n在创建计算和条件时，您可以使用标准的`+`、`-`、`*`和`/`运算符。也可以使用括号`()`定义优先级。此外，还支持使用`FUNC.<functionname>`格式的函数。支持的函数有：`round(number)`、`ceil(number)`、`floor(number)`和`diff(date1,\
  \ date2, Unit)`。`Unit`可以是以下值之一：`MILLISECOND`、`SECOND`、`MINUTE`、`HOUR`、`DAY`、`WEEK`、`MONTH`、`QUARTER`、`YEAR`。`NOW`全局变量将返回当前日期和时间。\n\
  \n在创建条件时，您可以使用标准的`==`、`!=`、`>`、`>=`、`<`、`<=`、`&&`、`||`和`!`运算符。\n\n在里程碑、目标、任务等表格中，您可以对列使用以下函数：`sum(column)`、`avg(column)`、`add(column1,\
  \ column2)`、`subtract(column1, column2)`、`multiple(column1, column2)`和`divide(column1,\
  \ column2)`。您还可以使用函数`gm_sub_goal_rating_of_milestones`、`gm_sub_goal_rating_of_targets`和`gm_sub_goal_rating_of_tasks`来计算每种表格类型的最终评级。\n\
  \n要计算目标计划的总分，您需要使用标准字段`goal-score`来填充每个单独目标的评级。然后，您可以将`<obj-plan-template>`元素的属性`show-total-goalscore`设置为`true`。或者，您可以通过在`<category>`元素中设置相同的属性和值来为每个类别设置总分。\n\
  \n如何使用计算的例子不胜枚举。为简洁起见，我们在下面提供了一个简单但常见的示例，以帮助您理解计算的结构，以便您可以根据需要创建自己的计算。在此示例中，我们为每个目标计算一个分数，并向最终用户显示每个类别的总分和最终总分。\n\
  \n我们的示例代码如下所示：\n\n```\n...\n  <auto-population>\n    <rules>\n      <rule>\n   \
  \     ...\n        <result>\n          <calculator>...</calculator>\n          <field\
  \ id=\"goal-score\" />\n        </result>\n      </rule>\n    </rules>\n  </auto-population>\n\
  \  <calculator id=\"Rating\">\n    <label>Rating</label>\n    <label>Rating</label>\n\
  \    <description>Individual Goal Rating</description>\n    <default-value>0.0</default-value>\n\
  \    <format>#.#</format>\n    <calculation>...</calculation>\n  </calculator>\n\
  ...\n```\n\n> **注意**\n>\n> 这里有几个“陷阱”可能会让您感到困扰！首先，当您将`goal-score`添加到计划布局时，它要到第二天才会出现。其次，如果您更新了计算逻辑，您需要以最终用户身份更新每个目标中的值，然后新的计算才会执行！很多时候，一旦计算逻辑发生变化，最好在测试时直接创建全新的目标。在目标计划周期中间更改计算逻辑很可能会导致计算错误和混乱。\n\
  \n### 以最终用户身份查看目标评分\n\n作为最终用户，您现在可以看到目标计划顶部的目标评级、每个类别顶部的评级以及作为每个目标列出的评级，如图 5-20\
  \ 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig20_HTML.jpg](img/499651_1_En_5_Fig20_HTML.jpg)\n\
  \n**图 5-20** 向最终用户显示的目标评级\n\n## 群组目标\n\n\n\n## 群组目标\n\n`群组目标`提供了两个不同版本（v1 和 v2），用于创建、管理目标并将其分配给特定群组中的个人以协作执行。无论您选择使用哪个版本，每个目标都有一个创建者（制定目标的人）、一个所有者（目标最初在其计划上创建的人）、一个分配者（将目标分配给成员的人）以及成员（被分配了目标的用户）。此外，在这两个版本中，对所有者目标所做的任何更改都可以下推给成员目标（这是使用群组目标而非简单关联个人目标的一个关键原因）。表\
  \ 5-3 突出了 v1 和 v2 之间的差异，以帮助您选择哪个版本（如果有的话）可能适合您的组织。您必须选择其中一个版本。\n\n| 群组目标版本 | 描述\
  \ |\n| --- | --- |\n| v1 | 最适合于您希望动态分配成员（例如，按部门、分部、地点字段）和/或希望所有成员获得相同评级的情况。 |\n\
  | v2 | 虽然此版本不支持动态分配（必须具体指明所有成员，但可以在目标分配后进行更改）也不支持群组评级，但它支持较新的功能，例如任务、目标、里程碑和计算评级。此外，字段可以由群组成员编辑。有关更多信息，请参见\
  \ SAP 注释 `2072705`。 |\n\n#### 配置前提条件\n\n在配置群组目标之前，您必须决定要使用群组目标 v1 还是 v2。如果您选择 v1，它默认已开启，您只需执行\
  \ XML 和权限设置。如果您想使用 v2，则需要在配置管理中开启所需的版本。请按照以下步骤开启群组目标 v2：\n\n1.  登录您公司实例的配置管理。\n\
  2.  点击“公司设置”。\n3.  点击“启用 Group Goals 2.0 – 需要‘总体目标管理’”。\n4.  点击“保存”。\n\n> **注意：**\
  \ 如果您希望群组目标的更新也适用于非活跃用户（例如，如果他们正在休假），请点击下图所示的选项。此外，如果您使用的是基于角色的权限，并希望向角色添加一项允许最终用户定义目标人群的权限，请点击下方的“启用群组目标的目标人群\
  \ – 需要‘总体目标管理’”。您还可以勾选“启用群组目标分配权限的目标人群”和“启用群组目标删除权限的目标人群”复选框，以便这些权限在授予访问权限时使用角色的目标人群。图\
  \ 5-21 指出了这些选项的位置。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig21_HTML.jpg](img/499651_1_En_5_Fig21_HTML.jpg)\n\
  \n*图 5-21 启用群组目标 v2 及相关选项*\n\n### 配置群组目标\n\n要在您的目标计划中允许群组目标，只需将 XML `<obj-plan-template>`\
  \ 元素属性 `allow-group-goal` 编辑为 `true`。\n\n示例代码如下所示：\n\n```\n...\n...\n```\n\n####\
  \ 分配最终用户权限\n\n一旦我们在配置管理中完成设置并在计划中开启了群组目标，我们就可以为最终用户进行权限角色分配。请按照以下说明操作：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig22_HTML.jpg](img/499651_1_En_5_Fig22_HTML.jpg)\n\
  \n*图 5-22 群组目标权限*\n\n1.  在搜索栏中输入并选择“管理权限角色”。\n2.  点击您想要编辑的权限角色的名称。\n3.  点击“权限...:”，然后在左侧点击“目标”。\n\
  4.  选中“新建群组目标创建”和“群组目标分配”权限，如图 5-22 所示。\n\n> **注意：** 上图中的“目标人群”权限仅当您在配置管理中选择了“启用群组目标的目标人群”选项时才会出现；您还需要确保在您的角色中定义了一个目标人群。同样，如果您在配置管理中选择了“启用群组目标分配权限的目标人群”和“启用群组目标删除权限的目标人群”，那么这些选项将如图\
  \ 5-22 所示那样出现。\n\n5.  点击“完成”。\n6.  在主权限角色编辑屏幕上，务必在“授予此角色给…”部分下，通过点击“添加…”或“编辑授权”并根据需要定义目标人群，来根据需要更新/添加目标人群。\n\
  7.  在主权限角色编辑屏幕上，点击“保存更改”。\n\n### 使用群组目标\n\n既然我们已经完成了配置并分配了权限，让我们开始使用我们的群组目标吧！请按照以下说明操作：\n\
  \n> **注意：** 我们将在此处演示群组目标 v2，因为它支持我们迄今为止在示例代码中配置的功能。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig23_HTML.jpg](img/499651_1_En_5_Fig23_HTML.jpg)\n\
  \n*图 5-23 创建群组目标*\n\n1.  以您已分配群组目标权限的人员身份登录（在我们的示例中，这是一位经理）。\n2.  在导航菜单中，导航至“目标”。\n\
  3.  点击屏幕右上角的“添加目标”，然后选择“创建新目标”。应出现“创建新目标”屏幕，其中包含创建“群组目标”的选项，如图 5-23 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig24_HTML.jpg](img/499651_1_En_5_Fig24_HTML.jpg)\n\
  \n*图 5-24 添加群组目标*\n\n4.  点击“群组目标”。将出现“创建群组目标”屏幕，如图 5-24 所示。请注意，显示的字段将与您的 XML 中配置的字段相对应；主要区别在于“类型”字段将显示为只读，并显示为“群组（版本\
  \ 2.0）”。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig25_HTML.jpg](img/499651_1_En_5_Fig25_HTML.jpg)\n\
  \n*图 5-25 分配群组目标*\n\n5.  根据需要填写字段，然后点击“保存更改”。该目标将被添加到目标计划中。\n6.  在目标计划中，点击目标旁边的复选框，然后点击“分配”，如图\
  \ 5-25 所示。\n7.  点击您希望为其分配目标的员工旁边的复选框，然后点击“下一步”。\n8.  点击“分配”。群组目标即已分配给员工。\n\n###\
  \ 团队目标\n\n`团队目标`提供了一种方式，让经理可以将目标分配给他们的团队，而无需在自己的目标计划中拥有这些目标。此功能基本上与本章刚刚介绍的群组目标 2.0\
  \ 相同，主要区别在于该目标不在经理的目标计划中。然而，尽管功能非常相似，但重要的是要注意，某些配置和最终用户菜单选择是不同的，以防客户希望并行使用它们。`团队目标`还引入了共同所有者概念。当执行团队目标的“共享”操作时，与之共享的人将成为共同所有者，并拥有与所有者相同的权限。如果所有者放弃了目标，其中一位共同所有者将成为新的所有者。这一点很重要，因为如果没有人成为共同所有者，而所有者变为非活跃状态，该目标将无法编辑。\n\
  \n### 配置团队目标的前提条件\n\n在进行配置之前，请确保按照以下步骤在配置管理中激活团队目标：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig26_HTML.jpg](img/499651_1_En_5_Fig26_HTML.jpg)\n\
  \n*图 5-26 启用团队目标*\n\n\n1.  登录到贵公司的配置界面，点击“公司设置”。\n2.  勾选“启用团队目标”旁边的复选框，如图 5-26 所示。\n\
  3.  点击“保存”。\n\n#### 配置团队目标\n\n正如我们在团队目标中提到的，您需要添加相同的 XML 代码，将 `allow-group-goal`\
  \ 属性设置为 `true`。\n\n此外，您还需要遵循以下步骤：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig27_HTML.jpg](img/499651_1_En_5_Fig27_HTML.jpg)\n\
  \n**图 5-27** 启用团队目标\n\n1.  在搜索栏中输入并选择“目标管理功能设置”。\n2.  勾选“启用团队目标”和“启用删除团队目标共享”选项旁边的复选框，如图\
  \ 5-27 所示。\n3.  点击“保存”。\n\n#### 分配最终用户权限\n\n激活团队目标后，您可以将其分配给权限角色。请遵循以下步骤：\n\n1.\
  \  在搜索栏中输入并选择“管理权限角色”。\n2.  点击您想要编辑的权限角色名称（建议使用经理角色）。\n3.  点击“权限…”：\n4.  在弹出窗口的左侧，点击“目标”，然后根据需要勾选“管理团队目标”、“分配团队目标”和“共享团队目标”旁边的复选框。\n\
  \n**注意** 请留意此界面，“管理团队目标”和“分配团队目标”需要设置权限目标，而“共享团队目标”则不需要！\n\n5.  点击“完成”。\n6.  在主权限角色编辑界面，务必在“授予此角色给…”部分下，通过点击“添加…”或“编辑授权”，并根据需要定义目标群体，从而根据需要更新/添加目标群体。\n\
  7.  在主权限角色编辑界面，点击“保存更改”。\n\n#### 以最终用户身份使用团队目标\n\n现在我们已经配置并分配了团队目标权限，让我们来试一下！请遵循以下步骤：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig28_HTML.jpg](img/499651_1_En_5_Fig28_HTML.jpg)\n\
  \n**图 5-28** 启动团队目标\n\n1.  以您已分配权限的用户身份登录（例如，一位经理）。\n2.  在导航菜单中选择“目标”。\n3.  点击屏幕右上角的“操作”，然后选择“启动团队目标”，如图\
  \ 5-28 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig29_HTML.jpg](img/499651_1_En_5_Fig29_HTML.jpg)\n\
  \n**图 5-29** 创建团队目标\n\n1.  在出现的新屏幕中，点击右上角的“创建团队目标”。\n2.  您将看到“创建团队目标”界面，如图 5-29\
  \ 所示。该界面显示的字段与您在主要 XML 配置中配置的一致。“类型”字段将显示值“团队”。根据需要填写字段，然后点击“保存更改”。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig30_HTML.jpg](img/499651_1_En_5_Fig30_HTML.jpg)\n\
  \n**图 5-30** 显示操作菜单的团队目标界面\n\n1.  您将返回主“团队目标”界面，该界面现在将显示您刚刚创建的团队目标（以及您作为所有者的任何其他目标）。点击您目标“操作”列下的图标，然后选择“分配”。示例见图\
  \ 5-30。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig31_HTML.jpg](img/499651_1_En_5_Fig31_HTML.jpg)\n\
  \n**图 5-31** 选择接收团队目标的员工\n\n1.  弹出窗口将自动显示您团队的成员，如图 5-31 所示。勾选他们姓名旁边的复选框，然后点击“下一步”。接着点击“分配”。\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig32_HTML.jpg](img/499651_1_En_5_Fig32_HTML.jpg)\n\
  \n**图 5-32** 共享团队目标\n\n1.  您将返回主“团队目标”界面，其中“分配给”列下的数字已更新。再次点击“操作”列下的图标，然后点击“共享”。\n\
  2.  将显示“共享团队目标”弹出窗口，如图 5-32 所示。输入您希望与之共享目标的用户名称（例如，经理的上级），然后点击“添加”。最后点击“完成”。\n3.\
  \  点击“目标面板”返回目标计划。您会注意到该目标并未显示在您（作为经理）的目标计划上。您可以查看团队成员的目标计划，会发现该目标出现在他们的计划中。您也可以尝试以经理的上级身份登录，会发现该目标同样未显示在其计划中，但由于已共享，他们可以在“团队目标”界面中看到该目标。\n\
  \n至此，大功告成！您已经成功创建、对齐并共享了一个团队目标！\n\n#### 举措\n\n举措为组织提供了一种在公司、部门或团队级别设定高层目标的方式，员工可以将其个人目标与之对齐。举措也可以分组到举措组中。举措的分配和共享方式与团队目标相同（即使其他人成为该举措的共同所有者）。\n\
  \n**注意** 根据我们的经验，举措易于配置，并能有助于聚焦高层目标。\n\n### 配置举措的先决条件\n\n在配置之前，请务必遵循以下步骤在配置界面中激活举措：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig33_HTML.jpg](img/499651_1_En_5_Fig33_HTML.jpg)\n\
  \n**图 5-33** 启用举措\n\n1.  登录到贵公司的配置界面，点击“公司设置”。\n2.  勾选“启用举措”旁边的复选框，如图 5-33 所示。\n\
  3.  点击“保存”。\n\n### 配置举措\n\n在系统中激活后，配置举措是一个简单的过程。请遵循以下步骤：\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig34_HTML.jpg](img/499651_1_En_5_Fig34_HTML.jpg)\n\
  \n**图 5-34** 配置举措\n\n1.  在搜索栏中输入并选择“目标管理功能设置”。屏幕将如图 5-34 所示。\n2.  勾选“启用举措”旁边的复选框。\n\
  3.  点击“保存”。\n\n### 为举措分配最终用户权限\n\n现在举措已在系统中激活并配置完成，我们可以将其分配给最终用户。请遵循以下步骤分配管理和共享举措的权限：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig35_HTML.jpg](img/499651_1_En_5_Fig35_HTML.jpg)\n\
  \n**图 5-35** 分配管理和共享举措的权限\n\n1.  在搜索栏中输入并选择“管理权限角色”。\n2.  点击您想要编辑的权限角色名称（建议使用经理角色或\
  \ HR 管理员角色）。\n3.  点击“权限…”：\n4.  在弹出窗口的左侧，点击“目标”，然后根据需要勾选“管理举措”和“共享举措”旁边的复选框。示例见图\
  \ 5-35。\n5.  点击“完成”。\n6.  在主权限角色编辑界面，务必在“授予此角色给…”部分下，通过点击“添加…”或“编辑授权”，并根据需要定义目标群体，从而根据需要更新/添加目标群体。\n\
  7.  在主权限角色编辑界面，点击“保存更改”。\n\n### 以最终用户身份使用举措\n\n现在配置已完成，角色也已分配，我们可以开始使用举措了！请遵循以下步骤来管理、共享举措，并将目标与举措对齐：\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig36_HTML.jpg](img/499651_1_En_5_Fig36_HTML.jpg)\n\
  \n**图 5-36** 管理举措界面\n\n\n1.  以您分配权限的用户身份登录公司实例。\n\n2.  在搜索栏中键入并选择“管理倡议”。将显示“管理倡议”屏幕，如图\
  \ 5-36 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig37_HTML.jpg](img/499651_1_En_5_Fig37_HTML.jpg)\n\
  \n**图 5-37** 创建倡议组和倡议\n\n3.  单击右上角的“创建倡议组”按钮。输入倡议组名称和描述，并将该倡议标记为有效。根据需要单击“添加倡议”按钮，向组中添加单个倡议，并根据需要输入倡议名称和描述。完成后，单击“保存”。示例如图\
  \ 5-37 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig38_HTML.jpg](img/499651_1_En_5_Fig38_HTML.jpg)\n\
  \n**图 5-38** 管理倡议操作菜单\n\n4.  您将返回到主“管理倡议”屏幕，您的倡议组将显示在列表中，如图 5-38 所示。单击“操作”列下的图标，然后选择“共享”以共享该倡议。\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig39_HTML.jpg](img/499651_1_En_5_Fig39_HTML.jpg)\n\
  \n**图 5-39** 共享倡议屏幕\n\n5.  将出现“共享倡议”弹出窗口，如图 5-39 所示。键入您要与之共享该倡议的员工的姓名（请记住，员工搜索将遵循角色的目标人群）。单击“添加”，然后单击“完成”。\n\
  \n**注意** 然后，您可以作为与之共享该倡议的人员登录，该倡议也会出现在他们的“管理倡议”屏幕上。如果您想撤销自己作为倡议所有者的访问权限，请从“操作”菜单中选择“撤销”。要彻底删除一个倡议，请从“操作”菜单中选择“删除”。\n\
  \n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig40_HTML.jpg](img/499651_1_En_5_Fig40_HTML.jpg)\n\
  \n**图 5-40** 倡议组分配示例\n\n6.  您将返回到“管理倡议”主屏幕。单击“操作”列下的图标，然后单击“分配”。将出现“倡议组分配”弹出窗口，如下图所示。在这里，您可以使用用户数据文件（`UDF`）中的字段动态创建组。示例如图\
  \ 5-40 所示。\n\n![../images/499651_1_En_5_Chapter/499651_1_En_5_Fig41_HTML.jpg](img/499651_1_En_5_Fig41_HTML.jpg)\n\
  \n**图 5-41** 将目标与倡议对齐\n\n7.  完成创建受分配者组后，单击“与目标计划对齐”选项卡。选中您希望添加该倡议的目标计划旁边的复选框。然后点击“完成”。\n\
  \n8.  从主导航菜单导航到“目标”，然后选择其中一个受分配者的目标计划。单击目标旁边的“编辑”。已分配的倡议组将出现在编辑目标屏幕的底部，并带有您可以选择与目标对齐的可用倡议，如图\
  \ 5-41 所示。\n\n恭喜！您现在已经成功创建、共享、分配并使目标与倡议对齐！\n\n## 结论\n\n在本章中，我们介绍了目标计划的备选功能和管理技术。虽然根据我们的经验，基本目标计划能满足大多数组织的需求，但看到组织使用本章介绍的一个或多个功能也并不罕见。\n\
  \n我们首先向您展示了如何使用批量导入和目标转移功能，在直接编辑单个用户的目标计划之外管理目标。然后，我们开始介绍备选概念，首先介绍了目标执行，它向我们展示了如何跟踪整个组织的目标进度。接着，我们讨论了目标计划状态功能，该功能可以根据状态（通常用于“锁定”目标计划）允许不同的权限方案。接下来，我们探讨了如何自动计算单个目标的评级。我们还介绍了组目标\
  \ v1 和 v2，它们允许您自动将目标更改推送给所有参与者，以及团队目标，其用法类似于组目标，但适用于经理不想被分配到该目标的情况。现在您应该清楚理解这三个功能是如何紧密相关，但在整个组织内协作处理目标时，用于不同场景的。最后，我们介绍了倡议功能，这些功能可用于将目标与您在组织内定义的特定员工群体所驱动的关键业务倡议对齐。\n\
  \n需要注意的是，虽然所有这些功能在技术上可以并行运行，但我们从未在实际场景中见过这种情况。例如，在同时使用组目标、团队目标和倡议的场景中，需要向员工传达的概念范围会令人困惑。在这种情况下，您很可能会因为试图让员工理解目标计划如何运作的噪音而失去推动业务目标的重点。在大多数情况下，我们发现客户会使用一个基本的目标计划，并且可能同时使用本章中的一个或两个功能。这里的关键要点是了解这些功能的存在，以便在特殊情况下满足绝大多数客户的特殊需求，并且系统实施者不应感到必须使用所有功能。\n\
  \n"
- "# 6. 绩效管理介绍\n\n绩效管理有助于培养人才，衡量个人与公司目标一致的目标，识别培训需求，并奖励绩效。绩效评估过程用于评估员工在实现目标和能力方面的有效性，并且是识别下一年度发展需求的工具。一旦对绩效进行了评级和讨论，其结果可用于校准、继任计划和薪酬决策。\n\
  \nSAP SuccessFactors 绩效管理通过使用高度可配置的模板和路线图自动执行年度评估流程，从而简化了该流程。例如，一份典型的绩效表整合了员工的目标和能力，并在一年中在人与人之间流转。可以记录实现目标的进展并添加评论。在年底，员工可以评估他们认为自己实现目标的程度。经理将做出最终的评级决定。然后，经理和员工将坐下来讨论当年的绩效并为下一年做计划。\n\
  \n此自动化流程由人力资源管理员管理，并允许在特定日期为特定员工组生成表单。如果表单需要向前或向后移动、需要修改截止日期或需要删除或恢复表单，管理员可以在流程中进行干预。\n\
  \n**注意**\n\n\n\n## 要完成本章中的配置步骤，我们假定您已完成了第 4 章所述的“目标管理”配置。此外，我们还假定您已按照第 3 章所述，将能力与岗位角色关联起来，或将能力标记为“核心”，以便能将其纳入表单。\n\
  \n接下来几章我们将讨论绩效管理。此处，我们将介绍配置绩效管理的初始步骤，包括：\n\n1.  在 `Provisioning` 中启用设置\n2.  创建基于角色的权限\n\
  3.  配置路线图\n4.  配置评分等级\n5.  配置绩效表单模板\n\n在第 7 章中，我们将深入探讨绩效表单模板，以便更好地理解模板的各部分。我们将了解每个模板部分的用途、配置和权限。\n\
  \n完成第 7 章中绩效表单模板的设置后，我们将继续在第 8 章中管理绩效表单。第 9 章将从用户角度提供绩效流程的逐步演示。第 10 章将涵盖绩效表单模板 XML\
  \ 和翻译。最后，在第 11 章中，我们将了解更多关于“请求反馈”、“获取反馈”和“添加修改者”功能的信息。\n\n## 配置绩效表单模板时需要做出的决策\n\n\
  作为实施过程的一部分，您需要审查绩效管理的可用功能，并决定启用哪些特性和功能。您还需要就即将创建的绩效表单的布局、权限和内容做出决策。\n\n您需要做出的决策类型包括以下内容：\n\
  \n*   绩效评审流程的步骤有哪些？\n*   每个步骤涉及哪些角色？\n*   路线图中使用的标签和文本是什么？\n*   目标计划是否会集成到绩效表单中？\n\
  *   表单上是否会使用发展目标？\n*   每个步骤中哪些角色可以查看和执行哪些操作？\n*   是否可以从表单中添加或删除目标？\n*   是否包含能力？如果是，是核心能力、角色特定能力还是自定义能力？\n\
  *   表单上将显示哪些部分？\n*   表单上有哪些必填字段？\n*   将使用哪种类型的总体评分？\n*   评分是文本、圆形还是星形？\n*   表单是否包含“获取反馈”和“请求反馈”附件以及与目标关联的\
  \ CPM 成就？\n*   是否使用手动总体评分？\n*   在表单总体评分中使用的目标和能力权重是多少？\n\n这项工作的成果将是一份完整的配置工作簿。工作簿中做出的决策将驱动您实例中绩效管理的配置。\n\
  \n请使用以下链接访问绩效管理配置工作簿：[`https://partneredge.sap.com/en/products/successfactors-hcmsuite.html`](https://partneredge.sap.com/en/products/successfactors-hcmsuite.html)\n\
  \n## Provisioning\n\n让我们从 `Provisioning` 开始。我们将设置 SAP SuccessFactors Performance\
  \ Management v12 Acceleration，这是最新版本，并将在后续版本中持续更新和增强。\n\n转到“公司设置”并启用以下内容：\n\n* \
  \  绩效管理\n*   绩效管理访问权限 – 需要“版本 11 UI 框架 (ULTRA)”\n*   工作流\n*   GM-PM 同步\n\n以下是建议启用但与绩效管理相关的可选功能：\n\
  \n*   团队概览访问权限\n*   绩效管理团队评分人\n*   绩效管理团队评分人 – 启用除自评外所有表单的显示\n*   表单路由的相对日期\n* \
  \  可折叠路线图\n\n\n\n## 可选功能\n\n某些可选功能可能已经启用。若未启用，建议开启以下功能：\n\n* 法律扫描\n* 启用完整版法律扫描\n\
  * 拼写检查\n* 启用完整版拼写检查\n* 语言包（如需自定义短语和标签）\n* 显示待办事项 Portlet\n* 登录后显示主页\n* 动态群组 V2\n\
  \n若您正在使用能力素质模型，还应启用以下功能：\n\n* 能力素质库管理套件\n* 写作助手（若使用 SuccessFactors 2.1 能力素质库）\n\n\
  如前所述，“GM-PM 同步”作为一项可选设置，允许目标在特定配置下同步至绩效表单。该功能支持在绩效表单上进行的任何目标更新同步至目标计划；反之亦然——若用户在目标计划中添加新目标，其当前有效的绩效表单也将同步更新。\n\
  \n针对临时性绩效管理报告，请确保启用`Ad Hoc Builder`，然后启用以下选项：\n\n* 在“其他临时子域架构配置”下启用“绩效管理”\n* 在`people\
  \ pill`的`启用从用户开始包含`中启用“绩效管理”\n\n保存已完成的更新。请注意，“公司设置”中的某些部分需要单独保存。\n\n现在我们已经启用了绩效管理，接下来将进入实例创建基于角色的权限。\n\
  \n## 绩效管理管理员的基于角色权限\n\n我们将创建管理员所需的权限，以便其创建和管理绩效相关任务。您可能决定由人力资源部门的用户处理管理任务，而非由系统管理员负责整个绩效周期。\n\
  \n请创建一个包含应具有绩效管理管理员角色的一个或多个用户的权限组，或识别现有角色并为其添加绩效相关访问权限。\n\n在搜索栏中输入并选择`管理权限角色`。然后选择并打开现有角色进行更新，也可以创建新的权限角色。\n\
  \n打开角色后，进入`权限角色详情`页面的权限设置部分，点击`权限`按钮，将弹出如图 6-1 所示的权限设置弹窗。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig1_HTML.jpg](img/499651_1_En_6_Fig1_HTML.jpg)\n\
  \n*图 6-1：权限设置概览*\n\n在屏幕左侧页面的`用户权限`部分，找到并选择`绩效`。相关绩效权限将显示在该部分的右侧。\n\n如图 6-2 所示，选择`绩效管理访问权限`。\n\
