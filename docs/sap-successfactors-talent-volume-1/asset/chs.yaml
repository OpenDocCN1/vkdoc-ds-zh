  \ 版本由 `SAP UI5` 技术支持，并提供直观的用户体验。您可以通过安装 `Upgrade Center`（升级中心）中提供的新 UI 来升级到 `SAP\
  \ Fiori` 版本。您可以通过在搜索框中执行配置屏幕 `Upgrade Center`（升级中心）来访问它。在显示的页面上，可选升级中有一个名为 `360\
  \ Review – SAP Fiori Version (Beta)`（360 度反馈 – SAP Fiori 版本（Beta））的选项。点击此选项，在显示的页面上（见图\
  \ 12-33），您将看到升级到 `SAP Fiori` 版本的选项。\n\n![../images/499651_1_En_12_Chapter/499651_1_En_12_Fig33_HTML.jpg](img/499651_1_En_12_Fig33_HTML.jpg)\n\
  \n图 12-33\n升级到 `SAP Fiori` 版本（beta）\n\n**注意**\n\n要升级到 `SAP Fiori` 版本，前提条件是系统中必须已启用并可用\
  \ `360 Review`（360 度反馈）。任何使用旧解决方案配置的模板都需要更新为 `SAP Fiori` 解决方案。您可以在配置屏幕 `Manage Templates`（管理模板）中进行更新。进行中和已完成的表单不受升级影响。\n\
  \n升级后，您有最多 30 天的时间可以回退到旧解决方案。\n\n如果您回退到旧解决方案，需要注意以下几点：\n\n*   任何使用 `SAP Fiori` 版本创建的模板将被系统锁定，无法供将来使用。\n\
  *   任何使用 `SAP Fiori` 版本的表单可以继续使用。但是，这些基于 `SAP Fiori` 的表单无法回退到旧解决方案。\n\n**提示**\n\n\
  升级后，如果您发现与 `OData API` 相关的功能未更新，可以刷新缓存。您可以通过执行配置屏幕 `OData API Metadata Refresh And\
  \ Export`（OData API 元数据刷新和导出）来访问缓存。\n\n目前，`SAP Fiori` 版本不支持旧解决方案中可用的所有功能。从高层面上看，以下功能目前（截至\
  \ `H1’2020 版本`）在 `SAP Fiori` 版本中不可用：\n\n*   发展目标部分\n*   发展目标部分中的学习活动\n*   打印功能\n\
  *   `EZ rater`（简易评分器）\n*   在路线图中添加修改器的功能\n*   绩效表单历史记录\n*   `360 Review feedback`（360\
  \ 度反馈）表单历史记录\n\n强烈建议您审视自己的业务需求，了解哪些功能可用，并决定是否要升级。\n\n在最后几个部分中，我们回顾了 `360 Review\
  \ feedback`（360 度反馈）表单的配置。掌握了这些知识后，在下一节中，我们将讨论 `360 Review feedback`（360 度反馈）表单的部署。\n\
