  \ 此模块记录员工的紧急联系人详情。员工与紧急联系人的关系也在此模块中维护。*注：在业务需求收集研讨会期间，请与客户确认他们在记录员工紧急联系人时的文化习惯。有时，客户希望只维护一个紧急联系人，并且只维护联系电话号码，而不记录电子邮件地址。如果客户有\
  \ SuccessFactors Onboarding 模块，紧急联系信息通常在入职流程中记录。在这种情况下，入职流程中记录的信息应在此模块中显示。* |\n\
