  \ |\n| 能力-行为分解 | 此模块用于显示在 SuccessFactors 绩效管理表单中收集的行为评级。 |\n| 能力 | 此模块用于显示在 SuccessFactors\
  \ 绩效管理表单中收集的能力评级。 |\n| 发展目标 | 此模块用于显示在 SuccessFactors 发展目标计划中记录的发展目标信息。 |\n| 目标评级\
  \ | 此模块用于显示在 SuccessFactors 绩效管理表单中收集的目标评级。 |\n| 概览 | 此模块用于显示绩效与潜力或方式与内容的最新评级。 |\n\
  | 绩效历史 | 此模块用于显示员工的绩效评级。 |\n| 继任者 | 此模块用于显示被提名为该员工当前职位继任者的员工。 |\n| 职位 | 此模块显示员工当前职位的详细信息。\
  \ |\n| 绩效-潜力历史矩阵网格布局趋势 | 此模块显示绩效与潜力评级。 |\n| 当前提名 | 此模块显示员工被提名为继任者的职位。 |\n| 方式与内容历史矩阵网格布局趋势\
  \ | 此模块显示目标与能力评级。 |\n| 学习历史 | 此模块显示您的员工已完成的学习项目列表。 |\n| 课程状态 | 此模块显示分配给员工的课程及其完成状态。\
  \ |\n| 浮动薪酬个人视图 | 此模块显示员工的浮动薪酬。 |\n| 历史 | 此模块显示系统中的所有表单，例如已完成的绩效表单、360 度评估表单和活跃的目标表单。\
  \ |\n| 个人浮动薪酬报表 | 此模块显示员工的个人浮动薪酬报表。 |\n| 薪酬报表 | 此模块显示员工的薪酬报表。 |\n| 奖金分配报表 | 此模块显示员工的奖金分配报表。\
  \ |\n| 技能档案 | 此模块显示分配给员工的技能及其预期/当前评级。在人员档案中，员工可以编辑此模块以添加新技能并提供自己的评级。 |\n| 个人合并报表\
  \ | 此模块显示员工的个人合并报表。这是一个薪酬专用的门户组件。 |\n| 目标 | 在此模块中，您可以创建和编辑目标。*注：在 SuccessFactors\
  \ 中，“目标”和“目的”可以互换使用。* |\n\n**注意：** 我们暂不讨论“雇佣信息”模块，因为该模块用于显示来自 Employee Central 的数据。\n\
  \n### 个人信息\n\n这些模块显示在继任数据模型中定义的标准元素和`userinfo`元素中收集的个人数据。表 2-5 对这些模块进行了说明。\n\n**注意：**\
  \ 标准元素是由 SuccessFactors 提供的数据元素。标准元素示例包括 `username`、`userid`、`firstname`、`lastname`、地址字段、`ssn`等。\n\
  \n**表 2-5**\n个人信息\n\n| 模块名称 | 模块说明 |\n| --- | --- |\n| 传记信息 | 此模块用于记录员工的人员信息，例如\
  \ `personID`、出生日期和出生国家。*注：`personID` 通常用于捕获员工在系统中的 ID。根据业务需求，`personID` 可用于维护员工的旧系统\
  \ ID（来自之前的人力资源信息系统）。在业务需求收集研讨会期间，请了解需求以及此字段在 SuccessFactors 中的使用方式。* |\n| 个人信息 |\
  \ 此模块显示员工的个人信息。模块中记录了诸如姓名、婚姻状况、国籍、称谓、首选姓名等详细信息。如果实施了 Employee Central，此模块还会显示员工的全球信息详情。当您选择员工居住的国家时，系统将显示特定于该国家的字段。例如，如果您选择美国，则会显示特定于美国的字段，如族裔、退伍军人身份和残疾详情，供员工填写。*注：客户使用`首选姓名`来记录员工的首选姓名。许多员工在工作场所使用昵称，并且同事之间以该名字相称。此字段可用于记录员工的首选姓名。*\
