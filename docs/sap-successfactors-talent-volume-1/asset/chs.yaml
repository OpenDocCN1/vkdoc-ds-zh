  \ 度评审反馈过程中，有时被评审人或其经理会认为迄今为止收到的反馈不够充分，没有涉及正确类型的参与者，或者忽略（未包含）了一位关键的参与者，或者该参与者现在可以被包含到流程中。\n\
  \n在评估完成之后，但在开始完成或签名步骤之前，流程负责人可以执行以下操作：\n\n- 在表格中添加更多的参与评审人\n- 将表格退回给一个（或多个）参与者\n\
  \n在评审后阶段，拥有相应权限的角色可以添加新参与者或移除选定的参与者。当您点击`添加新参与者`时，系统会显示一个页面，您可以在其中添加新的参与者。您可以添加内部或外部参与者。同样，点击`移除选定的参与者`会将该参与者从流程中移除。\n\
  \n在经理评估阶段，被评审人的经理可以将表格退回给参与者，要求其对反馈（包括评论和/或评分）进行复核。当经理点击`召回`按钮（见图 12-27）时，表格将退还给参与者进行重新评估。经理还会看到一个可选的评论框，他们可以在其中输入评论以说明其关注点。\n\
