  \n你需要将表 3-1 中显示的权限授予需要访问`JPB`的角色。\n\n点击`完成`以保存你的更改。\n\n图 3-7 显示了需要配置的权限设置，以便授予对`职位档案`对象的查看/编辑权限。\n\
