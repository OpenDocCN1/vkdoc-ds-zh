  \n*图 10-19：发展目标的学习活动选项卡*\n\n如果允许，此选项卡将显示在所有发展目标中，即使是那些没有学习活动的目标。如果发展目标没有关联的学习活动，该选项卡将包含消息“您没有发展目标的学习活动”。选项卡顺序无法更改。如果还启用了“成就”选项卡，它将作为第一个选项卡列出。\n\
