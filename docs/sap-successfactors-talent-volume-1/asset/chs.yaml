  \ 3-4）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig4_HTML.jpg](img/499651_1_En_3_Fig4_HTML.jpg)\n\
  \n**图 3-4** 编辑`职位档案`对象定义的安全设置\n\n按图 3-4 所示配置`安全`部分。\n\n- *安全字段*：设置为`是`。\n- *权限类别*：设置为`管理职位与技能档案可见性`。\n\
  - *RBP 主体用户字段*：留空。\n- *创建符合目标条件*：设置为`否`。\n\n点击`保存`以保存您的设置。\n\n\n\n### 设置可见性：技能档案\n\
  \n我们需要编辑`技能档案`对象定义来配置可见性设置。前往管理中心，点击`配置对象定义`。\n\n在显示的屏幕上，第一个搜索框中选择`对象定义`。然后在相邻的搜索框中输入`技能档案`。\n\
  \n此时会显示`技能档案`的对象定义。点击`执行操作` ➤ `进行修正`。这样你就可以编辑对象定义了。向下滚动页面至`安全`部分（见图 3-5）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig5_HTML.jpg](img/499651_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n编辑`技能档案`对象定义的安全设置\n\n按照图 3-5 所示配置`安全`部分：\n\n*   *安全字段*：`是`\n*   *权限类别*：`管理职位与技能档案可见性`\n\
  *   *RBP 主体用户字段*：`externalCode`\n*   *创建尊重目标条件*：`否`\n\n点击`保存`以保存你的设置。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig6_HTML.jpg](img/499651_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n\n编辑`已评技能`的安全设置\n\n### 设置可见性：已评技能\n\n我们需要编辑`已评技能`对象定义来配置可见性设置。前往管理中心，点击`配置对象定义`。\n\
  \n在显示的屏幕上，第一个搜索框中选择`对象定义`。然后在相邻的搜索框中输入`已评技能`。\n\n此时会显示`已评技能`的对象定义。点击`执行操作` ➤ `进行修正`。这样你就可以编辑对象定义了。向下滚动页面至`安全`部分（见图\
