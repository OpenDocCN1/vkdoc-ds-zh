  \ | 如果使用 CPM，则用于绩效目标和发展目标部分 |\n\n我们将查看一些可能为目标显示的选项卡。最重要的选项卡是“他人评分”选项卡。此选项卡的标准标签是“来自他人的评分”。该选项卡包含其他用户给出的目标或能力评分和评论。例如，员工对每个目标和能力进行自我评分。如果配置了，员工还可以为每个目标或能力添加评论。当表单转交经理审核时，员工的评分和评论将显示在“来自他人的评分”选项卡中。\n\
