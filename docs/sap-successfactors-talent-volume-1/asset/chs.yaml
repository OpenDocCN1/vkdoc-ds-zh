  \ Details`、`Achievements`和`Other’s Rating`选项卡。可以为特定角色和步骤设置独立的选项卡权限，也可以在“部分”级别设置这些`goal`选项卡权限。在本章的“目标部分”中，我们将学习如何在表格的特定部分隐藏选项卡。接下来，我们将介绍用户在绩效表单上会看到的部分。\n\
  \n### 部分\n\n每个部分都有其自己的设置、标签、字段和权限。部分确实有一些共同元素。部分中使用的元素包括：\n\n*   `fm-sect-name`\n\
  *   `fm-sect-intro`\n*   `fm-sect-config`\n*   `fm-element`\n\n部分的顺序基于在每个部分中找到的`fm-sect`索引。每个部分都包含索引，第一个部分的索引号从`0`开始。以下是一个代码段示例：\n\
