  Required and recommended features are marked. After saving the updates, let's continue!\n\
  \nThere are two very useful features within performance forms: Spell Check and Legal\
  \ Scan. We will cover each.\n\n### Spell Check\n\nMost performance forms have sections\
  \ for users to add comments. We have enabled Spell Check so users can verify for\
  \ spelling errors. Once enabled, no further action is required from the admin unless\
  \ they wish to add additional words to the company dictionary. This can be particularly\
  \ useful if users wish to include company terminology in their comments.\n\nTo manage\
  \ the company dictionary, role-based permissions need to be added to the admin role.\
  \ In role permissions, use the following path:\n\n`Administrator Permissions` ➤\
  \ `Manage System Properties` ➤ `Company Dictionary`\n\nEnter and select \"Manage\
  \ Dictionary\" in the search bar. An example of the dictionary interface is shown\
  \ in Figure 6-5.\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig5_HTML.jpg](img/499651_1_En_6_Fig5_HTML.jpg)\n\
  \n**Figure 6-5** Add/Remove Words from Company Dictionary\n\nHere, there are three\
  \ options for adding words:\n\n1.  Add or remove a word.\n2.  Import a list of words\
  \ via CSV file.\n3.  Download the company dictionary file.\n\n#### Add or Remove\
  \ a Word\n\nClick the \"Add or Remove a Word\" button, and you will be able to add\
  \ words to or delete words from the company dictionary directly on this screen.\
  \ To add a word, type the word in the text box and click the \"Add\" button. Any\
  \ existing word can be deleted in the same way. After making all updates, click\
  \ \"Done\", and the dictionary will save the modifications.\n\n#### Import a Word\
  \ List\n\nClick the \"Import a word list\" button to add words to the company dictionary\
  \ from a CSV file. There is no readily available sample template to download for\
  \ building the file. Instead, create a simple file with each word on its own line,\
  \ save the file as a CSV format, and then import the file.\n\n#### Download Company\
  \ Dictionary\n\nIt is also possible to download the existing company dictionary.\
  \ New words can be added to the file, and it can then be re-imported.\n\n### Legal\
  \ Scan\n\nUsers can perform a legal scan on any text entry within a performance\
  \ form to find any offensive or inappropriate words or phrases. SAP provides a base\
  \ legal scan library with terms considered to be objectionable and their suggested\
  \ replacements.\n\n#### Managing the Legal Scan Library\n\nTo manage the legal scan\
  \ library, role-based permissions need to be added to the admin role. In role permissions,\
  \ use the following paths:\n\n-   `Administrator Permissions` ➤ `Manage Competencies\
  \ and Skills` ➤ `Legal Scan Library`\n-   `Administrator Permissions` ➤ `Manage\
  \ Competencies and Skills` ➤ `Legal Scan Library Import`\n\nWords or phrases can\
  \ be added to the library via \"Legal Scan Library\", as shown in Figure 6-6.\n\n\
  ![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig6_HTML.jpg](img/499651_1_En_6_Fig6_HTML.jpg)\n\
  \n**Figure 6-6** Add to Legal Scan Library\n\nAn admin can enter a word or phrase\
  \ in the \"Your Text\" box and the suggested alternative in the \"Suggestions\"\
  \ box. Since the scan uses exact matching, ensure entries are created for multiple\
  \ variations of the word or phrase.\n\n#### Legal Scan Library Import\n\n\n\n可导入法律扫描库。在搜索栏中键入并选择“Legal\
  \ Scan Library Import”。导入屏幕示例如图 6-7 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig7_HTML.jpg](img/499651_1_En_6_Fig7_HTML.jpg)\n\
  \n**图 6-7** 法律扫描库导入\n\n在此，管理员将导入一个包含待替换单词/短语和建议替换内容的文件。没有可供下载以查看文件布局的模板，但文件布局非常直观。导入文件包含两列且无表头：A\
  \ 列包含要替换的关键词（必须为小写），B 列包含建议的替换单词或短语。然后，使用 CSV 格式保存该文件。无法下载或导出现有库。如需获取库的副本，需向 SAP\
  \ 提交支持工单。\n\n> **注意**：要了解如何请求获取法律扫描库副本，请参阅 SAP 注释 #2219367。\n\n在本章稍后开始配置表单模板时，我们将看到如何为绩效表单启用法律扫描和拼写检查功能。现在我们已经了解了一些基本功能、设置和权限，接下来让我们深入探讨绩效管理模板。\n\
  \n## 表单还是模板？\n\n首先，让我们澄清“绩效表单”（`performance form`）和“绩效表单模板”（`performance form template`）这两个术语之间的区别。有些人错误地将它们混用，但它们并不相同。表单模板类似于一个蓝图，它定义了绩效表单的布局、表单内的各个部分，以及工作流程、评分等级、角色和权限。绩效表单是根据表单模板的设置和选项为员工生成的。绩效表单是实际的个人绩效评估，是传统纸质绩效表单的自动化电子版本。每个表单都包含特定于用户的信息。表单从绩效表单模板生成。\n\
  \n一旦我们启用了绩效管理并为管理员授予了基于角色的权限，我们就可以构建绩效表单模板。表单模板由以下部分组成：\n\n*   路线图（Route map）\n\
  *   评分等级（Rating scale）\n*   部分（Sections）\n\n在创建表单模板之前，需要完成一些先决步骤。我们将先了解路线图和评分等级，然后才能开始创建绩效表单模板。\n\
  \n## 路线图\n\n可以将路线图视为绩效表单模板的“路线图”。路线图定义了表单的流程（步骤）。它确定了在每个步骤中谁将拥有表单，以及用户可能执行的操作。更正式地说，路线图定义了表单在绩效评估过程中的流转，明确了步骤顺序并为每个步骤分配了角色。路线图还可以为流程的每个步骤定义开始和结束日期。在表单上可见的与路线图相关的文本、标签和按钮也在此处定义。\n\
  \n分配给路线图步骤的角色是基于与表单生成目标用户的关系。员工角色（`E`）分配给该用户。`EM` 角色是用户的经理，`EH` 角色是员工的 HR 经理，依此类推。\n\
  \n示例如下：\n\n1.  员工在其“绩效收件箱”中收到绩效表单并进行自我评估。对目标和能力进行评分并添加评论。\n2.  表单流转至经理处。经理将看到员工的所有评分和评论。经理完成对员工的评估。为目标和能力添加评分和评论。总体表单评分根据经理的目标和能力评分计算得出。\n\
  3.  表单流转至二级经理处进行审阅。二级经理可以添加可选评论。\n4.  表单流转至下一环节，经理与员工进行年终绩效面谈。在此环节中，给予反馈并审阅评分。\n\
  5.  表单流转至员工处进行签字确认。这是为了确认年终评估会议已举行。\n6.  表单流转至经理处进行签字确认。这是为了确认与员工举行的年终评估会议已完成。\n\
  7.  经理签字后，表单流程完成。该评估的副本将出现在所有相应用户的“绩效已完成”文件夹中。\n\n我们将为表单的每一次流转在路线图中构建一个步骤。\n\n在\
  \ Provisioning 中设置绩效管理时，我们提到了几个可选的路线图相关功能：\n*   “启用表单路由的相对日期”（`Enable Relative Dates\
  \ for Form Routing`）控制是否可以在路线图中为步骤使用相对日期。如果你不明白这意味着什么，我们稍后会解释。如果启用但决定以后不使用，启用它不会影响你的路线图。如果你决定在未来的路线图中使用它，该选项将已可用。\n\
  *   “启用可折叠路线图”（`Enable Collapsible Route Map`）是另一个你可能已启用的选项。如果绩效表单很长，此功能会很方便。如果用户需要大量滚动，他们可以折叠表单上的路线图以腾出一些空间。路线图可随时展开。\n\
  \n我们设置的管理员基于角色的权限包括创建和编辑路线图的权限。该权限位于以下路径：`Administrator Permissions` ➤ `Manage Form\
  \ Templates` ➤ `Routing Maps`。此权限授予创建和编辑路线图的访问权限。\n\n路线图必须在配置绩效表单模板之前创建。路线步骤及其关联角色用于为模板中的按钮、部分和字段构建权限。一个路线图可以被多个绩效表单模板使用，而一个绩效表单模板只能有一个路线图。随着我们继续，这一点会变得更加清晰。\n\
  \n路线图将显示在绩效表单上，这有助于用户跟踪表单在流程中所处的步骤，并查看步骤的截止日期、步骤描述以及每个步骤分配给了哪个用户/角色。示例如图 6-8 所示。\n\
  \n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig8_HTML.jpg](img/499651_1_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8** 绩效表单上的路线图\n\n如前所述，路线图基于步骤和角色。让我们先看看角色，以便了解它们如何在路线图中工作。前面的章节已经讨论过角色。对于绩效表单，我们主要会用到员工角色（`E`）、员工经理角色（`EM`）、HR\
  \ 代表角色（`EH`），可能还有二级经理角色（`EMM`）。对于每个步骤，我们需要确定哪个角色将在其收件箱中收到该表单。\n\n### 管理路线图\n\n现在让我们进一步了解路线图。在搜索栏中键入并选择“Manage\
  \ Route Maps”。将显示“Route Map List”，如图 6-9 所示。在创建路线图之前，此列表为空。为了说明此页面上的列，我们将查看一个包含现有路线图的列表。\n\
  \n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig9_HTML.jpg](img/499651_1_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9** 路线图列表\n\n创建路线图后，它将显示在此概览页面上。路线图名称将列在第一列。名称列之后，您将看到一个显示图标。单击此图标可查看路线步骤，如图\
  \ 6-10 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig10_HTML.jpg](img/499651_1_En_6_Fig10_HTML.jpg)\n\
  \n**图 6-10** 路线步骤预览\n\n\n\n接下来是“活动”列。如果复选框为空，则路线图处于非活动状态，无法在模板中使用。\n\n随后是“描述”列，用于包含路线图的简要说明。该描述只会显示在此路线图概览页面上，不会出现在其他地方。如果描述过长，该列将显示“...”；将鼠标悬停在该列上，即可查看完整的描述，如图\
  \ 6-11 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig11_HTML.jpg](img/499651_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11\n路线图描述\n\n“更新于”列包含路线图最后修改的日期。\n\n“相关模板”列显示使用了该路线图的绩效模板数量。点击该数字，您将看到使用该路线图的模板名称，如图\
  \ 6-12 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig12_HTML.jpg](img/499651_1_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12\n与路线图关联的模板\n\n可以通过点击除“描述”之外的任何列标题来对路线图列表进行排序。既然我们已经介绍了路线图列表页面，接下来让我们创建一个路线图！\n\
  \n## 创建路线图\n\n点击“添加新路线图”，您可以选择自行构建路线图或从库中选择。我们将从“从库中选择”开始，介绍这两个选项。如图 6-13 所示，将弹出一个窗口，显示\
  \ SuccessStore 中所有可用的路线图。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig13_HTML.jpg](img/499651_1_En_6_Fig13_HTML.jpg)\n\
  \n图 6-13\nSuccessStore 中可用的路线图\n\n### SuccessStore 路线图\n在这里，您将看到为 360 度评估、薪酬和绩效模板预定义的路线图。您可以滚动列表，阅读描述，并查看每种路线图可用的语言。您可以选择其中一个绩效路线图，并将其作为起点来创建满足您需求的路线图。选择后，“添加到我的实例”按钮将变为可用。系统将提示您为路线图命名，然后它会在您的屏幕上打开。您可能会发现使用\
  \ SuccessStore 路线图入手更容易，因为它提供了一个包含一些步骤及相关角色的框架。您可以添加或删除步骤、修改现有步骤或重新排列步骤顺序。由于这些字段尚未填充，您仍然需要决定许多文本和标签。\n\
  \n## 复制路线图\n\n您也可以复制当前的路线图进行编辑，并将其用于与我们即将构建的表单模板关联。您可以打开一个现有的路线图，然后点击“另存为...”，如图\
  \ 6-14 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig14_HTML.jpg](img/499651_1_En_6_Fig14_HTML.jpg)\n\
  \n图 6-14\n复制现有路线图\n\n将弹出一个窗口，提示您为这个复制的路线图提供一个名称。保存新的路线图名称后，该路线图将显示出来，您就可以进行更新了。\n\
  \n## 构建路线图\n\n我们现在来查看“自行构建”选项。将弹出一个包含已命名但没有任何步骤的路线图的窗口，如图 6-15 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig15_HTML.jpg](img/499651_1_En_6_Fig15_HTML.jpg)\n\
  \n图 6-15\n空白路线图\n\n为路线图取一个有意义的名称。如果您计划将此路线图用于一个特定的绩效表单模板，您可以使用与绩效表单模板名称相似的名称。如果您计划将此路线图用于多个绩效表单模板，您可以使用一个对所有这些模板都足够通用的名称。在您从所有路线图列表中创建绩效表单模板时，您需要标识出路线图名称，因此请确保名称有意义且易于查找。在添加步骤之前，您将无法保存路线图，所以让我们继续了解路线图的组成部分。\n\
  \n路线图页面上的几乎每个字段都有一个问号图标。这是一个很好的资源，提供了该字段用途的描述。示例如图 6-16 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig16_HTML.jpg](img/499651_1_En_6_Fig16_HTML.jpg)\n\
  \n图 6-16\n信息图标\n\n## 路线图阶段\n\n在路线图屏幕的左侧，您将看到三个阶段：修改、签名和完成。阶段内部构建了步骤。这些步骤标识了表单的流程以及每个步骤涉及的角色：\n\
  \n1.  *修改阶段*是大部分操作发生的地方。此阶段的步骤允许用户查看和更新表单内容。\n\n2.  *签名阶段*用于签署或确认表单内容。该步骤由员工和/或经理使用，以确认已经进行了年终绩效讨论和评级。电子签署表单并不表示同意最终评级，而仅表示确认讨论已进行。用户最多只能在此阶段提供评论，表单的其余部分不可编辑。提交后，表单的签名行将包含用户的姓名以及表单签署的日期。\n\
  \n3.  *完成阶段*发生在最终签名步骤提交之后。此阶段不能创建任何步骤，并且在表单内，用户无法执行任何操作。在此阶段，表单已被路由到用户的“绩效已完成”文件夹。所有在路线图上拥有角色的用户都将在其“已完成”文件夹中收到一份表单副本。\n\
  \n现在我们已经了解了这三个路线图阶段，接下来让我们探讨一些可选功能。通常，这些复选框是未选中的，但我们将介绍每个选项的用途。\n\n## 路线图选项\n\n\
  如图 6-17 所示，路线图页面顶部有三个复选框可以启用。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig17_HTML.jpg](img/499651_1_En_6_Fig17_HTML.jpg)\n\
  \n图 6-17\n路线图选项\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig18_HTML.jpg](img/499651_1_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18\n路线图中的相对日期\n\n1.  我需要在 360 度评估路线图中个性化评估阶段：将此复选框保持未选中状态。此选项仅适用于 360 度评估模板。360\
  \ 度评估表单将在第 12 章中介绍。\n\n2.  仅当用户存在所有角色时才创建迭代和协作步骤：用一个例子可能是解释此选项的最佳方式。假设您的绩效表单有一个步骤，从员工（E）开始，然后是经理步骤（EM），接着是一个由经理（EM）和人力资源经理（EH）共享的步骤。如果员工在\
  \ EH 角色中没有人力资源经理（即用户数据文件中的 HR 字段不包含 HR 用户 ID），则此经理/人力资源经理步骤将被跳过，表单将路由到下一步。\n\n\n\
  \n3.  为表单路由使用相对日期：仅当在**预置** ➤ **公司设置**中启用了“为表单路由启用相对日期”时，您才会看到此选项。启用后，步骤的开始、退出和到期日期将基于表单活动之前或之后的天数，而不是使用固定的日历天数。您将在图\
  \ 6-18 中看到一个示例。\n\n根据具体步骤以及选择的是“之前”还是“之后”，天数将相对于表单创建日期、同一步骤的到期日期、同一步骤的退出日期或表单的到期日期。例如，为路线图第一步的开始日期选择“之前”，三个日期字段选项将为：表单到期日期之前“X”天、同一步骤到期日期之前或同一步骤退出日期之前。如果选择了“之后”单选按钮，则天数将相对于表单创建日期。启用后，编辑路线图时，步骤将无法重新排序。\n\
  \n## 修改阶段步骤\n\n现在我们将使用工作流设计器为路线图构建步骤。在**修改阶段**部分，点击“添加步骤”图标。系统将提示您为步骤命名，如图 6-19\
  \ 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig19_HTML.jpg](img/499651_1_En_6_Fig19_HTML.jpg)\n\
  \n**图 6-19** 创建一个修改步骤\n\n为步骤命名并点击“确定”后，该部分会展开，您现在将在路线图中看到新步骤。点击新步骤，让我们查看现在为该步骤显示的**步骤配置**。示例如图\
  \ 6-20 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig20_HTML.jpg](img/499651_1_En_6_Fig20_HTML.jpg)\n\
  \n**图 6-20** 步骤配置\n\n现在我们将逐一介绍这些字段。\n\n**步骤名称** 是在您将步骤添加到路线图时创建的。从上图可以看出，步骤名称显示在**步骤配置**的**步骤名称**字段中。您可以在任一位置更改步骤名称。名称应为该步骤所发生事件的简短描述。例如，“员工自我评估”是步骤名称，并将显示在绩效表单的路线图中。\n\
  \n**步骤描述** 将显示在用户主页的“绩效待办事项”磁贴中。此磁贴包含用户所有待处理的绩效相关任务。例如，如果您将步骤描述为“2020 年自我评估”，则磁贴中的**待办事项**项目将显示为“[员工姓名]的\
  \ 2020 年自我评估”。这在后期阶段尤其有用，当管理者收件箱中有数十份员工评估，并且他们正试图为特定员工找到特定步骤中的特定表单时。如果创建路线图时此字段留空，则**待办事项**列表将使用步骤名称。\n\
  \n在查看**步骤类型**之前，让我们先了解一下角色。必须为路线图中的每个步骤确定角色。这是用户相对于被评估员工所持有的角色。最常见的角色是员工 (E)、管理者\
  \ (EM)、HR 代表 (EH) 和第二级管理者 (EMM)。建议避免使用自定义角色，因为该角色在绩效表单中不可用。\n\n在**步骤类型**部分下方，有一个用于选择角色的框。点击向下箭头查看可用标准角色列表，如图\
  \ 6-21 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig21_HTML.jpg](img/499651_1_En_6_Fig21_HTML.jpg)\n\
  \n**图 6-21** 步骤角色\n\n我们将为路线图的每个步骤选择角色。现在我们来查看**步骤类型**。\n\n**步骤类型** 标识步骤中使用的角色以及步骤将如何运作。**步骤类型**选项仅对**修改**和**签名阶段**步骤可用。如表\
  \ 6-2 所示，有三种类型可供选择。\n\n**表 6-2** 步骤类型\n\n| 步骤类型 | 描述 |\n| --- | --- |\n| 单一 | 此步骤中只有一个角色。例如，您希望表单转至具有员工角色的用户。\
  \ |\n| 迭代 | 在此步骤中，多个角色将有权访问表单。但是，表单一次仅与一个角色的用户在一起。表单将保留在该步骤中，但会在它们之间来回传递。您需要确定必须为此步骤中第一个角色的角色（进入用户），以及能够将表单路由到下一步骤的角色（退出用户）。每个角色都将有一个按钮，用于将表单发送给步骤中的另一个角色。只有退出用户才能将表单路由到下一步骤。\
  \ |\n| 协作 | 多个角色共享此步骤。根据绩效表单模板中的权限，所有角色都可以编辑或查看表单。但是，该步骤中的每个角色不能同时处理该表单。表单不会在步骤内来回传递。此步骤中的所有角色的收件箱中都有该表单，但当一个角色正在编辑时，另一个角色只能查看被锁定不可编辑的表单。在表单顶部，会显示“表单当前由[员工姓名]处理”。这是另一个协作者正在编辑表单的提示。一旦编辑表单的角色保存并关闭表单，另一个角色即可进行编辑。只有被指定为退出角色的角色才会拥有将表单路由到下一步骤的按钮。进入用户只能保存/关闭或取消。\
  \ |\n\n协作步骤的示例如图 6-22 所示。该步骤由员工和管理者共享。管理者被指定为退出用户，这意味着只有管理者会在此步骤中看到提交按钮。员工将无法路由表单。\n\
  \n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig22_HTML.jpg](img/499651_1_En_6_Fig22_HTML.jpg)\n\
  \n**图 6-22** 协作路线图步骤\n\n当表单处于迭代步骤时，员工可以编辑表单，但可能无法将其提交到下一步骤，如图 6-23 所示。唯一可用的选项是“取消”和“保存并关闭”。\n\
  \n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig23_HTML.jpg](img/499651_1_En_6_Fig23_HTML.jpg)\n\
  \n**图 6-23** 迭代步骤中非退出用户的角色\n\n现在我们将回溯并返回到路线图。一旦步骤被命名、确定了其类型以及属于该步骤的角色，我们将查看步骤日期。\n\
  \n## 步骤日期\n\n步骤日期是可选条目，适用于**修改**和**签名阶段**步骤。日期主要用于您关注表单在绩效周期内的特定日期位于特定步骤时。\n\n我们将解释这些日期是什么以及如何使用它们。\n\
  \n**开始日期** 是步骤开始的日期。如果表单在步骤开始日期之前到达用户的收件箱，用户可以在该步骤中处理表单，并且表单不会被锁定。还有一个强制开始日期的复选框。强制开始日期会使表单在用户收件箱中变为只读，直到步骤开始的那一天。用户会在收件箱中看到表单，但在步骤开始日期之前无法编辑。如果在表单周期开始之前生成表单，强制步骤开始日期可能对第一步有帮助。\n\
  \n当用户试图在步骤开始日期之前编辑表单时，会看到如图 6-24 所示的消息。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig24_HTML.jpg](img/499651_1_En_6_Fig24_HTML.jpg)\n\
  \n**图 6-24** 步骤尚未开始的弹出窗口\n\n**退出日期** 用于防止用户在步骤退出日期之前将表单移动到下一步骤。\n\n\n\n## 路由图步骤配置指南\n\
  \n`Due Date`标识步骤必须完成的截止时间。同时提供一个复选框，用于自动将表单发送到下一步。“自动发送至截止日期”功能与步骤截止日期配合使用。启用后，将显示两个单选按钮：“仅发送通过验证的表单”或“无论验证结果如何始终发送”。验证指步骤中任何必填项：\n\
  \n- 当启用自动发送并选择“无论验证结果如何始终发送”时，即使该步骤的角色尚未接触表单或填写必填字段，表单也会自动移至下一步。这通常用于员工步骤。由于经理的评分是记录评分，如果员工未输入自我评估，表单将移至下一步供经理评分。未输入员工必填评分不会影响整体表单评分，因此将表单移交给下一步通常是安全的。自动发送选项会在步骤截止日期后的第二天移动表单。如果使用此选项且同时设定了步骤退出日期，则该日期必须早于截止日期。\n\
  \n- 当启用自动发送并选择“仅发送通过验证的表单”时，如果该步骤的用户未填写表单上的所有必填字段，则截止日期过后表单不会自动移至下一步。如果步骤包含审核过程所需的字段，建议使用此选项。例如，经理评估步骤。经理必须输入个人目标评分、评论和总体评分。如果经理尚未打开表单或保存表单时未完成所有必填字段，则当步骤截止日期到达时，表单将停留在当前步骤。\n\
  \n对于从头开始构建的路由图，您只需命名步骤并指定步骤类型和角色后即可保存路由图。\n\n### 路由图高级选项\n\n在步骤的“步骤配置”中，点击“显示高级选项”，您将看到一系列需要填写的额外字段。高级选项适用于修改阶段、签名阶段和完成阶段。但每个阶段的字段会有所不同。图\
  \ 6-25 展示了修改阶段步骤的高级选项。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig25_HTML.jpg](img/499651_1_En_6_Fig25_HTML.jpg)\n\
  \n图 6-25 高级选项\n\n请参考表 6-3 了解这些字段在绩效管理（PM）表单中的含义和用途。\n\n表 6-3 步骤高级选项\n\n| 高级选项 |\
  \ 描述 |\n| --- | --- |\n| 步骤介绍与鼠标悬停文本 | 路由图显示在绩效表单顶部，当鼠标悬停当前步骤时，此文本提供该步骤用途的说明。 |\n\
  | 步骤完成后的名称 | 步骤完成后，路由图上显示的步骤名称。如果留空，将使用步骤名称。 |\n| 拒绝按钮鼠标悬停文本 | 仅在签名阶段可用，表单可被拒绝并退回上一步。这是悬停在拒绝按钮上时看到的文本。\
  \ |\n| 步骤模式 | 定义角色在步骤中可执行的操作：完全编辑或仅评论。这些选项仅在修改阶段可用。 |\n| 迭代步骤按钮文本 | 仅对标识为迭代的步骤可用。您可以为此按钮设置标签，用于在同一步骤的用户间来回移动表单。\
  \ |\n| 退出按钮文本 | 将表单移至下一步的按钮标签。也显示在步骤的下拉菜单和步骤确认页面的按钮上。 |\n| 步骤退出文本 | 当表单提交至下一步时，会显示一个确认页面，您可以定义在此显示的文本，例如说明操作的含义或用户需要做什么。\
  \ |\n| 上一级步骤退出按钮文本 | 如果用户要将表单退回一步，这是表单上按钮的标签。 |\n| 上一级步骤退出文本 | 当表单退回一步时，会显示一个确认页面，您可以定义在此显示的文本。\
  \ |\n| 步骤退出提醒 | 启用后，路由图页面会展开，以便您创建提醒文本，在提交表单至下一步时显示。此消息将以弹出窗口形式显示。不适用于迭代步骤。 |\n\
  | 步骤 ID | 使用 SuccessStore 路由图时自动生成的系统标识符，例如“5139493800574679”。从头创建路由图时此字段为空。建议重新标记系统生成的\
  \ ID，使用简短名称以便在模板 XML 中引用，例如员工签名步骤使用“ESign”。从头创建路由图时，请使用简短易识别的步骤 ID。 |\n| 审核开始 |\
  \ 只有一个步骤可启用此选项。标识此为审核的开始，并会为经理创建团队概览页面。所有步骤（包括“审核开始”步骤）都将显示在团队概览中。 |\n| 轮次外访问 |\
  \ 允许审核人在团队概览上访问表单并在表单进入其收件箱前提供评分。需要启用“审核开始”才能使用此选项，但不能分配给第一个步骤。不支持迭代或协作步骤。 |\n|\
  \ 一对一会议 | 可在修改阶段的步骤中启用。这会在团队概览上为经理提供“确认一对一会议”按钮。该按钮会将表单路由至签名步骤而无需打开表单。建议用于单个角色（EM），并且应为最后一个修改步骤。\
  \ |\n\n创建初始步骤后，添加另一个步骤并填写适用的相同字段。按照流程中步骤应发生的顺序创建所有步骤。提醒您，一旦表单进入签名阶段，表单将不可编辑，只能在绩效表单的签名部分添加评论。\n\
  \n### 签名阶段步骤\n\n添加完修改阶段的所有步骤后，点击签名阶段中的添加图标以创建签名步骤。该阶段的路由图示例如图 6-26 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig26_HTML.jpg](img/499651_1_En_6_Fig26_HTML.jpg)\n\
  \n图 6-26 签名步骤\n\n在此阶段中，“步骤类型”选项不再是修改阶段的“单一角色”、“迭代”或“协作”。取而代之的是一个下拉列表，仅允许选择一个单一角色。您可以在此阶段创建多个步骤，每个步骤对应一个应签署表单的角色。命名步骤后，您将看到与修改阶段相同的“步骤配置”部分。但展开高级选项时，您需要填写的字段会更少。您无法将表单移回修改阶段，因此不会看到“上一级步骤退出文本”和“上一级步骤退出按钮文本”选项。也没有“审核开始”、“轮次外访问”和“一对一会议”选项。但有一个用于定义拒绝按钮鼠标悬停文本的选项。如果表单模板配置为允许在签名步骤拒绝表单，您可以在此处设置悬停在拒绝按钮上时显示的鼠标悬停文本。\n\
  \n表 6-3 还提到，对于系统生成的路由图，需要重命名步骤 ID，因为它们使用长数字字符串。如果表单模板 XML 需要更新且您需要引用步骤 ID，则用描述性名称替换会很有帮助。您将在第\
  \ 10 章中了解绩效表单模板 XML。\n\n### 完成阶段步骤\n\n\n\n## 路线图完成\n\n当你确定了签名步骤后，路线图的最后一个阶段就是“完成”，如图\
  \ 6-27 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig27_HTML.jpg](img/499651_1_En_6_Fig27_HTML.jpg)\n\
  \n**图 6-27** 路线图的完成阶段\n\n此阶段没有任何操作。一旦最终签名从签名阶段提交，表单将直接进入“绩效已完成”文件夹，供路线图中每个角色的用户使用。\n\
  \n完成阶段几乎不需要配置。你可以输入步骤介绍文本和步骤介绍鼠标悬停文本。此外，还可以选择其他应收到已完成绩效表单副本的角色。\n\n在完成路线图的构建后，请保存它。你现在已经学会了如何创建路线图。\n\
  \n如前所述，现有的路线图可以被删除、复制或编辑。可以使用 SuccessStore 中的路线图或复制的路线图作为起点，创建一个新的路线图，用于新的表单模板。最好避免删除任何路线图，除非它们未在任何绩效表单模板中使用。建议仅对已与某个绩效表单模板关联的现有路线图进行文本或标签更改。如果现有路线图已与绩效表单模板关联，不建议添加或删除其中的步骤，因为这会破坏表单内的权限。\n\
  \n通过 `管理路线图` 所做的任何更改都不会影响已生效的表单。要对已生效的表单进行更改，你需要使用 `修改表单路线图` 选项。你将在第 8 章中了解更多关于此功能的信息。\n\
  \n我们现在已经学会了如何从 SuccessStore 下载路线图。我们复制了一个现有的路线图，并创建了一个全新的路线图。我们了解了路线图中的各个阶段，并学习了步骤角色、步骤类型，以及如何创建文本和按钮标签。我们很快就会学习如何将路线图与表单模板关联。但首先，我们需要创建一个要在表单中使用的评级量表。\n\
  \n## 评级量表简介\n\n作为创建评级量表的序曲，我们应该进一步了解评级在绩效表单中是如何使用的。绩效表单中的目标和能力部分用于评估员工。在这些部分中，每个目标和能力都会进行评级。评级量表定义了可用的评级值。摘要部分包含表单的整体评级，该评级由各项评级和部分权重计算得出。此外，也允许经理手动覆盖计算出的总体评级。所有这些都使用我们将要定义的同一评级量表。\n\
  \n由于常规的摘要部分不计算总体目标和总体能力得分，因此有一个可选的“目标能力摘要”部分用于此目的。还有一个可选的摘要部分，供经理输入手动评定的总体绩效评级和潜力评级。这些摘要部分用于继任计划，并使用继任矩阵评级量表。由于这些摘要部分不使用绩效评级量表，这些部分的评级将单独处理。现在，我们先来看一下表单模板中目标、能力和摘要部分所使用的评级量表。\n\
  \n**注意**\n\n> 有关评级的更多信息，例如在特定场景中如何进行计算，请参阅 SAP 注释 #2078768。\n\n## 评级量表\n\n绩效评估的目的是为员工提供一个年度总体评级。因此，在创建绩效表单之前，我们需要设置评级量表，以定义每个可能的评级值是什么。\n\
  \n评级量表定义了一组数值，并包含相应的分数标签和描述。关于这个数值评级量表的一个有趣之处在于，它在表单上的默认显示形式是一组星星。有一些选项允许用圆圈代替星星显示，或者你也可以选择为评级量表使用文本。当我们开始配置绩效表单模板时，我们将进一步讨论这些选项。\n\
  \n该量表将用于目标能力摘要和摘要部分。可以为表单的不同部分使用不同的评级量表，但这样做并不建议，因为它可能导致总体评级、报告和仪表板中的不准确。\n\n需要基于角色的权限才能创建评级量表。在搜索栏中键入并选择`管理权限角色`。选择并打开管理员角色以添加权限。使用路径\
  \ `管理员权限 ➤ 管理表单模板 ➤ 评级量表` 将此权限添加到该角色。\n\n一旦你的角色拥有创建/编辑评级量表的权限，请在搜索栏中键入并选择`评级量表`。`评级量表概览`页面将显示，如图\
  \ 6-28 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig28_HTML.jpg](img/499651_1_En_6_Fig28_HTML.jpg)\n\
  \n**图 6-28** 评级量表设计器概览页面\n\n与路线图概览页面类似，这里有名称、描述和`激活`列。评级量表可以被停用或删除，但建议不要删除已在往年表单中使用过的评级量表。只有激活的评级量表才能用于绩效表单模板。此外，还有量表创建日期、量表最后更新日期以及最后更新者等列。\n\
  \n我们可以使用三个预构建的评级量表之一，创建一个全新的评级量表，或者复制一个现有的评级量表。我们将探索所有这些选项。\n\n> 有关自定义评级量表的更多信息，请参阅\
  \ SAP 注释 #2078766。\n>\n> 有关最佳实践，请参阅 SAP 注释 #2078781。\n\n## 创建新评级量表\n\n我们将定义评级量表中有多少个分数，然后为每个分数创建关联的文本标签和描述。如果你为评级使用文本，评级标签将显示在绩效表单上。如果你将鼠标悬停在评级量表上，评级描述将显示在表单上。这对用户很有帮助，他们可以在给出评级之前看到带有描述的评级。\n\
  \n点击`创建新评级量表`，评级量表设计器将显示，如图 6-29 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig29_HTML.jpg](img/499651_1_En_6_Fig29_HTML.jpg)\n\
  \n**图 6-29** 创建评级量表\n\n\n\n## 评分量表选项\n\n在此，您可以选择使用三种预设量表，或自行创建量表。默认的五分量表将显示标签和说明。您可以使用该五分量表，并对标签或说明进行任何修改。\n\
  \n您可以删除此量表的评分项，或为其添加更多评分项。此外，还可以选择创建三分量表或七分量表。另一种选择是构建您自己的量表。\n\n建议使用五分量表。此量表大小提供了一个中间评分，并且评分之间具有足够的区分度。最低评分为`\"\
  1\"`，最高评分为`\"5\"`。\n\n也可以使用反向量表，其中`\"5\"`为最低评分。要启用此功能，需要在配置（Provisioning）中反转量表设置。在`\"\
  公司设置\"`中，启用`\"评分量表顺序：较低值被视为更有利（例如，\"1\"优于\"5\"）（仅用于仪表盘和报表）。\"` 不建议使用反向量表。\n\n请注意，一旦启用此设置，反向量表将应用于所有包含绩效评分的绩效模板和报表中的所有评分量表。如果您在反向量表中使用圆形或星形进行评分，评分量表将显示为下拉列表。如果您计划在职业发展规划模块中实施职业工作表（Career\
  \ Worksheet），则不支持反向量表。\n\n### 构建您自己的量表\n\n点击`\"构建您自己的\"`按钮后，评分量表设计器页面会发生变化，您将看到一个空白量表。示例见图\
  \ 6-30。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig30_HTML.jpg](img/499651_1_En_6_Fig30_HTML.jpg)\n\
  \n*图 6-30：构建您自己的评分量表*\n\n您可以通过输入带有标签和说明的评分来开始构建量表，然后点击`\"添加新评分\"`以添加一个新的空白评分行。\n\
  \n为了避免使用`\"添加新评分\"`选项一次添加一行，您可以在评分行上方的`\"最低\"`、`\"最高\"`和`\"增量\"`框中输入值。此方法将根据您选择的最小和最大评分以及每个评分之间的增量生成一个评分量表。\n\
  \n在图 6-31 所示的示例中，最低评分为 1，最高评分为`\"7\"`，评分以 1 为增量递增。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig31_HTML.jpg](img/499651_1_En_6_Fig31_HTML.jpg)\n\
  \n*图 6-31：生成评分量表*\n\n点击`\"生成\"`按钮后，将创建包含七个评分的评分量表，如图 6-32 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig32_HTML.jpg](img/499651_1_En_6_Fig32_HTML.jpg)\n\
  \n*图 6-32：生成的评分量表*\n\n使用此方法无需一次添加一个新评分。但是，每个评分的标签和说明仍然需要输入。虽然不推荐，但可以创建最多包含 40 个评分的评分量表。\n\
  \n### 复制评分量表\n\n您可以打开一个现有的评分量表，点击`\"另存为…\"`（如图 6-33 所示），并提供一个新的量表名称；这样您就创建了一个现有评分量表的副本。\n\
  \n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig33_HTML.jpg](img/499651_1_En_6_Fig33_HTML.jpg)\n\
  \n*图 6-33：复制现有评分量表*\n\n然后，您可以编辑新的评分量表，更改标签和说明，或修改评分数。\n\n至此，路线图和评分量表已配置完毕，接下来我们进入绩效表单模板。\n\
  \n#### 管理模板\n\n我们将开始配置我们的绩效管理表单模板。该模板定义了绩效表单的组件和结构。它将指定要使用的路线图、评分量表、目标计划，以及胜任力（能力项）和可选的发展计划。已启动的绩效表单的外观和行为基于这些配置决策。\n\
  \n在搜索栏中键入并选择`\"管理模板\"`。这看起来类似于创建目标计划模板。您现在将看到一个额外的选项卡`\"绩效评估\"`，它出现在`\"目标计划\"`选项卡之前，如图\
  \ 6-34 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig34_HTML.jpg](img/499651_1_En_6_Fig34_HTML.jpg)\n\
  \n*图 6-34：管理模板中的绩效评估选项卡*\n\n在我们下载预先构建的 SuccessStore 绩效表单模板之前，不会看到任何模板列出。一旦我们有了一个表单模板，我们可以复制它来创建一个新版本，例如用于新的计划年度。建议为每个绩效评估周期使用单独的模板。\n\
  \n当我们有多个表单模板时，适用以下操作：单击`\"模板名称\"`、`\"更新日期\"`或`\"模板描述\"`列标题以更改模板排序顺序。表单类型字段标识版本。只有有效的模板才能被使用。\n\
  \n与目标计划模板类似，当启用`\"仅显示活动模板\"`时，只会显示活动模板。非活动计划无法使用或启动。由于模板无法删除，您可以隐藏非活动模板以使概览列表更易于管理。\n\
  \n将显示少于 50 个字符的模板描述，与目标计划和路线图描述类似，将鼠标悬停在`\"…\"`上可查看更长的模板描述。\n\n### 从 SuccessStore\
  \ 添加模板\n\n与创建目标计划和路线图类似，我们可以从 SuccessStore 添加新模板。点击`\"添加新模板\"`，预置的最佳实践模板将显示出来，如图\
  \ 6-35 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig35_HTML.jpg](img/499651_1_En_6_Fig35_HTML.jpg)\n\
  \n*图 6-35：SuccessStore 绩效表单模板*\n\n选择一个模板添加到您的实例中。系统将提示您命名模板，如图 6-36 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig36_HTML.jpg](img/499651_1_En_6_Fig36_HTML.jpg)\n\
  \n*图 6-36：命名绩效表单模板*\n\n建议在模板名称中包含年份或周期。此名称将显示在绩效表单上，因此请确保其有意义。示例如图 6-37 所示。\n\n\
  ![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig37_HTML.jpg](img/499651_1_En_6_Fig37_HTML.jpg)\n\
  \n*图 6-37：入门级绩效表单模板*\n\n### 复制表单模板\n\n创建模板的另一种方法是复制任何现有模板。无法从头开始创建模板。与复制目标计划模板类似，打开一个现有的绩效表单模板并点击`\"\
  另存为…\"`。出现提示时，提供新名称并保存模板。现在您将拥有一个表单模板的副本以供编辑。但是，某些高级的表单模板设置将不会被复制过来。我们稍后会详细讨论这一点。\n\
  \n## 模板组件\n\n我们有了一个绩效表单模板。然后呢？我们将了解其组件，以便掌握如何修改模板。就像目标计划模板一样，在页面最左侧，您会看到`\"预览\"\
  `和`\"常规设置\"`。绩效表单模板还包含`\"编辑字段和章节\"`。\n\n我们将在本章介绍`\"常规设置\"`，并在下一章继续介绍`\"编辑字段和章节\"\
  `。\n\n## 常规设置概览\n\n\n\n表单模板的“常规设置”示例如图 6-38 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig38_HTML.jpg](img/499651_1_En_6_Fig38_HTML.jpg)\n\
  \n**图 6-38** 表单模板的常规设置\n\n在“常规设置”中，您可以找到模板名称和描述，并在此处确定要使用的路线图和评分量表。“隐藏评分数值”、“无法评分”、“高级设置”和“显示高级选项…”是我们需要决定的其他选项。如果在操作过程中遇到困难，您会在所有模板分节的许多字段旁看到问号图标。将鼠标悬停在该图标上，即可获得有关该字段的有用信息。\n\
  \n## 分节概述\n\n点击“编辑字段和分节”即可查看表单模板的布局和内容，该模板位于“常规设置”下方，如图 6-39 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig39_HTML.jpg](img/499651_1_En_6_Fig39_HTML.jpg)\n\
  \n**图 6-39** 表单模板分节\n\n展开视图将列出模板中会出现的分节。现在，让我们回到“常规设置”以了解更多信息。\n\n#### 常规设置\n\n\
  在此，我们将定义模板名称，并确定要与表单模板关联的路线图和评分量表。这些是必填字段。选择路线图和评分量表后，其描述将根据您在创建路线图和评分量表时为其分配的描述自动填充。\n\
  \n模板名称可通过点击“添加更多+”进行本地化。如图 6-40 所示，会弹出一个窗口，您可以添加所选语言的标签。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig40_HTML.jpg](img/499651_1_En_6_Fig40_HTML.jpg)\n\
  \n**图 6-40** 模板标签的本地化\n\n模板描述为可选字段，不会出现在表单的任何位置。它对管理员而言更具参考价值，如果包含表单流程、所用角色以及评分内容的摘要，可能会很有帮助。与目标计划和路线图类似，如果描述超过\
  \ 50 个字符，它将不会显示在模板概览页面的“模板描述”列中。相反，您需要将鼠标悬停在“…”上才能查看描述。\n\n必须为表单模板附加一个路线图，以确定表单的工作流程。如果您在此处尝试选择路线图，将会看到一个警告弹出窗口，类似于图\
  \ 6-41 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig41_HTML.jpg](img/499651_1_En_6_Fig41_HTML.jpg)\n\
  \n**图 6-41** 路线图选择警告\n\n从 SuccessStore 下载的表单模板未附加路线图，因此在此处选择您的路线图是安全的。如果您复制了一个表单模板，原始表单模板中的路线图和绩效量表会显示在“常规设置”中。如果您随后创建了一个新的路线图用于复制的模板，并在此处选择它，则现有的权限将会被破坏。为避免这种情况，您需要在“高级设置”中选择新的路线图。建议始终在“高级设置”中选择路线图，这样您将养成使用此方法的习惯，并且无需担心引起任何路线图/角色权限问题。\n\
  \n现在，我们需要确定表单中将要使用的评分量表。点击“评分量表”字段中的下拉箭头，以显示所有启用的量表。示例如图 6-42 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig42_HTML.jpg](img/499651_1_En_6_Fig42_HTML.jpg)\n\
  \n**图 6-42** 评分量表选择\n\n选择我们新创建的评分量表。所选评分量表将应用于模板中所有包含评分的分节。有一个复选框用于启用“隐藏评分数值（仅显示文本标签）”。此选项将使评分量表显示为带有评分标签的下拉列表。如果您的组织习惯于文本评分，则可以使用此选项。如果未启用，默认评分量表将使用星级。\n\
  \n“无法评分”用于定义中性评级的标签，并适用于所有使用评分的表单分节。例如，它可用于表示“不适用”或“新到无法评分”。此中性值将成为量表的一部分，但不会用于计算总体评分。输入标签后，点击“应用”，如图\
  \ 6-43 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig43_HTML.jpg](img/499651_1_En_6_Fig43_HTML.jpg)\n\
  \n**图 6-43** 将中性评级应用于评分量表\n\n这将使“无法评分”值应用于表单中所有包含评分的分节。此时您将无法保存更新的表单模板。必须在“目标”分节中确定目标计划才能保存。但我们将继续讨论这些设置和选项，直到进入“目标”分节为止。现在，我们继续讨论“常规设置”中的高级设置。\n\
  \n## 高级设置\n\n点击“高级设置”，将显示一个弹出窗口，也称为*表单模板设置*。这些设置的子集如图 6-44 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig44_HTML.jpg](img/499651_1_En_6_Fig44_HTML.jpg)\n\
  \n**图 6-44** 表单模板设置\n\n在这里，您会看到大量的设置，它们用于启用某些功能并定义一些表单行为。更新这些设置时，有些会立即应用于已生效的表单，有些则仅在新启动的表单中生效。\n\
  \n选择要与模板一起使用的路线图。在页面左侧找到“路线图”，您会看到该模板尚未分配路线图，如图 6-45 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig45_HTML.jpg](img/499651_1_En_6_Fig45_HTML.jpg)\n\
  \n**图 6-45** 选择路线图\n\n点击下拉箭头选择我们创建的路线图。接下来，滚动到此设置页面的最底部，您会看到一个标有“更新表单模板”的按钮。点击此按钮以保存设置。\n\
  \n现在，我们将重点介绍一些您可能启用的常用设置。我们从默认日期开始，如图 6-46 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig46_HTML.jpg](img/499651_1_En_6_Fig46_HTML.jpg)\n\
  \n**图 6-46** 选择表单创建日期\n\n### 表单创建的默认日期\n\n这些日期将定义绩效评估的考核期和表单的截止日期。您可以使用固定日期或相对日期。这些日期会影响任何电子邮件通知，因为它们是基于日期的。与路线图上的相对日期类似，*相对日期*基于表单创建日期、默认开始日期、默认结束日期或默认截止日期之前或之后的天数。使用负数表示所选日期之前的天数。\n\
  \n示例如图 6-47 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig47_HTML.jpg](img/499651_1_En_6_Fig47_HTML.jpg)\n\
  \n**图 6-47** 相对表单日期\n\n在此示例中，默认开始日期是表单创建日期后的 0 天。这意味着评估开始日期与表单生成的日期相同。默认截止日期是表单创建日期后的\
  \ 100 天。默认结束日期是默认截止日期前的 10 天。\n\n\n\n#### 选择“固定”默认日期\n\n选择“固定”默认日期将导致日期选项发生变化。您现在可以选择实际的日历日期，如图\
  \ 6-48 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig48_HTML.jpg](img/499651_1_En_6_Fig48_HTML.jpg)\n\
  \n**图 6-48** 固定默认表单日期\n\n通常情况下，固定日期用于年度绩效表单。您可以设置开始日期为 1 月 1 日，结束日期为 12 月 31 日。截止日期通常设置在评估期结束日期后的\
  \ 15 到 30 天。无论默认日期的类型如何，当为此模板启动表单时，这些日期都会被引入，并显示在表单的“审查日期”部分。如果您不更改这些日期，则将使用默认日期。\n\
  \n#### 默认通知日期\n\n接下来，我们将介绍默认通知日期。示例如图 6-49 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig49_HTML.jpg](img/499651_1_En_6_Fig49_HTML.jpg)\n\
  \n**图 6-49** 默认通知日期\n\n这些日期用于根据表单截止日期前的“X”天数，确定何时发送表单截止日期通知和逾期表单通知：\n\n*   默认到期通知日期（天数）\n\
  *   默认逾期通知日期（天数）\n\n在讨论复制表单模板时，我们提到某些高级设置不会从原始表单模板复制过来。这同样适用于所有这些日期字段。它们将重置为零，默认截止日期为创建日期后的\
  \ 30 天。\n\n## 通用表单模板设置\n\n请参考表 6-4 了解一些常见设置。\n\n**表 6-4** 通用表单模板设置\n\n| 设置项 | 描述\
  \ |\n| --- | --- |\n| 自动经理转移 | 选择“自动经理转移”下的所有选项。此设置允许表单根据关系变更重新路由。*要了解更多信息，请参考 SAP\
  \ 注释 #2077194。* |\n| 将圆形图标显示为评分 | 星标是默认的评分类型。您可以选择用圆形代替星标来显示评分。 |\n| 在团队概览中显示对勾代替评分\
  \ | 在已启动表单的“团队概览”中，经理将在步骤列中看到一个对勾，以标识步骤已完成，而不是显示步骤的数值评分。 |\n| 启用拼写检查 | 当使用公司词典时推荐启用。要使用此功能，必须先在配置中启用公司词典。\
  \ |\n| 启用法律扫描 | 当您有法律库时推荐启用。要使用此功能，必须先在配置中启用法律库。 |\n| 启用写作助手 | 仅适用于包含能力的表单。 |\n\
  | 禁用“请求评论”路由 | 如果不使用“获取反馈”选项，请勾选此选项（以禁用）。 |\n| 禁用“请求编辑”路由 | 如果不使用“获取反馈”选项，请勾选此选项（以禁用）。\
  \ |\n| 隐藏添加/删除签署人按钮 | 勾选此选项（以禁用）。 |\n| 禁用“发送并打开下一份表单”按钮 | 勾选此选项（以禁用）。 |\n| 禁用“删除”按钮\
  \ | 勾选此选项（以禁用）。 |\n| 禁用“备注”按钮 | 勾选此选项（以禁用）。 |\n| 禁用“表单”按钮 | 勾选此选项（以禁用）。 |\n| 禁用“360”按钮\
  \ | 勾选此选项（以禁用）。 |\n| 在签署阶段显示签署路由步骤名称 | 启用。当表单处于签署阶段时，在路由图中显示步骤的名称。 |\n| 显示步骤开始日期\
  \ | 勾选此选项（以禁用）。 |\n| 在文档打印预览中显示数字签名 | 启用。指定签署人的姓名、角色以及签署表单的日期显示在表单的打印副本上。 |\n| 禁止用户更改结束日期\
  \ | 勾选此选项（以禁用）。 |\n| 禁止用户更改截止日期 | 勾选此选项（以禁用）。 |\n| 启用表单路由到上一步 | 可选，仅当您允许表单返回到上一步时启用。\
  \ |\n\n\n\n### 显示跳过签名步骤时的签名栏\n建议启用。用于在跳过签名步骤时，在表单的签名区域显示一个空签名行，而不是完全不显示任何签名信息。\n\
  \n### 启用附件\n启用后可向绩效表单添加附件。\n\n保存所有更新并关闭此弹出窗口。\n\n> **注意**\n> 如需查看完整的高级设置列表及其用途，请参考\
  \ SAP 注释 #2077413。\n\n接下来，我们将讨论模板可用的高级选项。\n\n## 显示高级选项\n\n在“高级设置”链接下方，点击“显示高级选项…”，如图\
  \ 6-50 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig50_HTML.jpg](img/499651_1_En_6_Fig50_HTML.jpg)\n\
  \n*图 6-50 – 显示高级选项*\n\n此部分将展开，如图 6-51 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig51_HTML.jpg](img/499651_1_En_6_Fig51_HTML.jpg)\n\
  \n*图 6-51 – 高级选项*\n\n展开后，“显示高级选项…”将变为“隐藏高级选项…”。您可以点击此标签来隐藏这些选项，该部分将折叠。\n\n选项详情请参考表\
  \ 6-5。\n\n### 表 6-5 – 高级选项\n\n| 选项 | 描述 |\n| --- | --- |\n| **启用上一步按钮** | 启用后，表单上将出现一个按钮，可将表单回退一步。必须在高级表单模板设置中启用此选项才能使用。\
  \ |\n| **启用删除按钮** | 不建议启用。启用后，可以定义删除按钮可用的步骤和角色。必须在高级表单模板设置中启用此选项才能使用。 |\n| **启用缩放调整计算**\
  \ | 用于摘要部分，创建一个“调整后的计算得分”来替代始终为数值的计算表单评分。将分数映射到标签，并可基于每个分数的最小值或最大值进行分数映射。*我们将在下一章的摘要部分更详细地介绍这一点。*\
  \ |\n| **已定义按钮权限** | 为每个步骤中的角色定义按钮权限。如果未定义，则所有步骤中的所有角色都将拥有按钮权限。 |\n| **已定义他人评分标签页权限**\
  \ | 允许某个角色查看目标、能力和摘要部分的“他人评分”标签页。包含评论和评分选项。 |\n| **已定义在支持信息面板中请求反馈数据的权限** | 使用“请求反馈”功能时，设置权限以在表单的“支持信息”面板中查看反馈。如果未设置权限，所有用户将在所有步骤中看到反馈。*我们将在第\
  \ 11 章中学习* 请求反馈 *功能。* |\n\n从高级选项中可以看出，复选框用于启用某些选项，某些选项则用于定义权限。“启用缩放调整计算”将在下一章的摘要部分进行讨论。如果未在高级表单设置中启用“请求反馈”，则不会看到“已定义在支持信息面板中请求反馈数据的权限”选项。我们将在第\
  \ 11 章中了解此功能。\n\n## 保存模板\n\n提醒一下，只有在选择了将在审核过程中使用的目标计划后，才能保存更新后的模板。您可以使用在第 4 章中创建的目标计划。如果您现在想保存模板，请展开“编辑字段和部分”，找到“目标”部分，并选择要关联到模板的目标计划。示例如图\
  \ 6-52 所示。现在点击“保存”以保存更新后的表单模板。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig52_HTML.jpg](img/499651_1_En_6_Fig52_HTML.jpg)\n\
  \n\n\n### 图 6-52  \n将目标计划关联至绩效表单模板\n\n接下来，我们将了解如何在模板中使用权限。\n\n### 高级选项权限  \n随着学习的深入，我们将进一步探讨绩效表单模板中使用的权限，但以下是一些需要牢记的高级概念。除了基于角色的绩效管理权限外，表单模板中还存在针对路线图中角色的特定权限，这些权限控制着用户能够查看和执行的操作。表单权限反映了表单查看者与表单主体之间的关系。举例说明：乔（员工角色）为丹（经理角色）工作，而辛迪是乔的人力资源经理（HR\
  \ 代表角色）。为乔创建了一份绩效表单。你需要决定这些角色（员工、经理和人力资源经理）在流程的各个步骤中能够查看和执行哪些操作。\n\n默认的表单权限中，表单各部分的权限为`Enabled`（启用），各部分的字段权限为`Write`（写入）。这些权限允许所有角色在流程的所有步骤中查看和操作所有内容。\n\
  \n要授予权限，请先移除角色和步骤的默认权限，然后根据需要为每个路线步骤中的每个角色重新授予权限。\n\n系统“自上而下”读取权限。请先设置最严格的权限，然后有选择性地授予每个权限。\n\
  \n当我们进入模板各部分时，这一点将变得清晰，但目前这些关于权限的信息已足以让我们讨论将出现在绩效表单上的按钮和面板。\n\n### 按钮和面板  \n接下来，我们将学习出现在绩效表单上的按钮和面板。我们将了解它们的功能和工作原理。按钮位于绩效表单的右下角。按钮用于执行诸如将表单退回上一步、提交表单至下一步、保存表单或签署表单之类的操作。绩效表单上的按钮示例如图\
  \ 6-53 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig53_HTML.jpg](img/499651_1_En_6_Fig53_HTML.jpg)\n\
  \n**图 6-53**  \n绩效表单上的按钮\n\n面板显示在绩效表单的顶部，包含来自表单的数据。面板可能包含整体表单评分，并标识当前步骤需要填写的必填字段数量，或用于存放附件。此处，我们将为路线图中每个步骤的角色授予按钮和面板的权限。\n\
  \n图 6-54 是一个包含五个可用面板的绩效表单标题示例。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig54_HTML.jpg](img/499651_1_En_6_Fig54_HTML.jpg)\n\
  \n**图 6-54**  \n绩效表单上的面板\n\n与我们关联到绩效表单模板的路线图定义了路线步骤以及每个步骤中的角色。按钮权限将根据路线步骤中的角色进行设置。我们将为路线图中每个步骤的每个角色定义哪些按钮是可见的，哪些是隐藏的。\n\
  \n例如，对于在“员工自我评估”步骤中具有员工角色的路线图，必须定义员工在此步骤中能够访问的按钮。\n\n按钮权限位于`General Settings`（常规设置）内的高级选项中。点击`0\
  \ Button Permission(s) defined. Click to modify.`（已定义 0 个按钮权限。点击进行修改。）将显示一个用于添加按钮权限的弹窗。如图\
  \ 6-55 所示，点击`+ Add Another`（+ 添加另一个）。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig55_HTML.jpg](img/499651_1_En_6_Fig55_HTML.jpg)\n\
  \n**图 6-55**  \n添加按钮权限\n\n你需要确定权限类型、按钮、角色和路线步骤以授予按钮权限。完成权限设置的选项如下所示。\n\n- **类型**\
  \ 定义访问权限：\n  - `Enabled`（启用）使按钮在该步骤中可见且可点击。\n  - `None`（无）使按钮在该步骤中对用户不可见。\n- **按钮**\
  \ 标识允许特定步骤中的特定角色使用的按钮和面板。\n- **角色** 标识正在设置权限的角色。\n- **路线步骤** 标识允许使用该按钮的步骤。这些路线步骤来自关联到表单模板的路线图。\n\
  \n请参考表 6-6 了解每个按钮的描述。\n\n**表 6-6**  \n按钮描述\n\n| 按钮 | 描述 |\n| --- | --- |\n| 拒绝 |\
  \ 将表单从签署步骤发回至上一个修改阶段步骤。 |\n| 最终确定表单 | 将表单发送至下一步。此按钮的标签在路线图中配置。 |\n| 签署 | 用于签署阶段。点击签署按钮将以电子方式签署表单并添加日期。\
  \ |\n| 发送至上一步 | 将表单退回一步。此按钮的标签在路线图中配置。 |\n| 删除表单 | 仅在高级模板设置中未禁用删除按钮时生效。删除按钮出现在表单工具栏上。\
  \ |\n| 获取评论 | 用于获取反馈。仅在高级模板设置中未禁用“请求评论路由”时生效。 |\n| 获取编辑 | 用于获取反馈。仅在高级模板设置中未禁用“请求编辑路由”时生效。\
  \ |\n\n有五个面板可能出现在绩效考核表单的顶部。请参考表 6-7 了解面板描述。\n\n**表 6-7**  \n面板描述\n\n| 面板 | 描述 |\n\
  | --- | --- |\n| 总体评分 | 此按钮仅在给出最终评分后显示表单评分，并且仅对有权对所有部分项目进行评分的用户可见。 |\n| 差距分析 | 员工和经理评分差异的比较图表。\
  \ |\n| 未完成项 | 此面板包含必填字段的计数。如果所有必填字段都未填写，用户将无法提交表单。用户可以点击此面板查看哪些必填字段尚未填写。对于有必填项的步骤非常有用。点击面板中的必填字段会将表单移动到需要填写该字段的部分。\
  \ |\n| 团队排名 | 经理可以查看其每位直接下属的、已使用相同表单模板评分的表单的评分排名。 |\n| 支持信息 | 如果已在高级模板设置中进行配置，可能包含附件、员工档案中的注释以及“请求反馈”评论。\
  \ |\n\n我们需要按角色和步骤确定按钮权限。按钮权限基于与绩效表单模板关联的路线图中的角色。这些决策应在配置工作簿中做出。但作为复习，对于路线图中的角色，我们应该考虑：\n\
  \n- 在所有步骤的表单中都不使用的按钮/面板\n- 所有步骤都需要的按钮/面板\n- 特定步骤需要的按钮/面板\n- 特定步骤不需要的按钮/面板\n- 在已完成的表单上显示的面板\n\
  \n首先，确定您不希望在任何步骤的表单上看到的所有按钮和面板。\n\n例如，对于一个基本模板，您可能不需要：\n\n- `获取编辑`\n- `获取评论`\n-\
  \ `拒绝`\n- `删除表单`\n\n您可能不需要以下面板：\n\n- `差距分析`\n- `团队排名`\n\n我们的第一个按钮权限将标识那些永远不应出现在表单上的按钮和面板。类型应为`None`（无），我们将选择要隐藏的按钮和面板。这意味着在您不希望表单上可见的每个按钮旁边打勾。接下来，我们将选择所有角色和所有步骤。例如，图\
  \ 6-56 列出了六个在每一步中对于所有角色都不可见的按钮。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig56_HTML.jpg](img/499651_1_En_6_Fig56_HTML.jpg)\n\
  \n**图 6-56**  \n从表单中隐藏的按钮\n\n\n\n如果你点击 `Buttons` 的下拉箭头，就会看到我们选中的按钮。由于我们已经移除了所有角色和步骤对特定按钮和容器的权限，现在我们可以确定在每个步骤和每个角色中都希望看到的按钮和容器。鉴于“未授予权限即表示按钮权限已授予”的原则，为每个步骤和每个角色创建按钮/容器权限仍然可能有用。这并不意味着要为每个步骤和每个角色下的每个按钮和容器都分别设置权限。相反，你应该明确在每个步骤中，每个角色需要哪些按钮和容器，以及哪些需要隐藏。\n\
  \n首先，你可以创建“启用（Enabled）”权限。确定在当前步骤以及与该步骤关联的角色下，哪些按钮和容器需要可用。对于要在该步骤中隐藏的按钮或容器，你需要创建一个“无（None）”权限，并指定该角色不应看到的按钮和容器。你需要对路线图中的每个步骤都重复此过程。\n\
  \n使用这种方法可以让你轻松发现任何权限问题，因为你可以看到每个步骤允许了哪些权限。例如，在测试期间，你期望经理在经理评估步骤中能够将表单发回给员工。然而，该按钮并没有出现在表单底部。因此，作为管理员，你可以返回模板，打开按钮权限，定位到经理评估步骤的按钮权限，并发现该按钮没有为经理角色启用。你可以通过为经理角色在此步骤中添加“发送到上一步（Send\
  \ to Previous Step）”按钮来修正权限。但这不会修正已发布的表单。你需要重新发布表单来测试现在是否工作正常。话虽如此，为每个步骤明确定义“无（None）”和“启用（Enabled）”权限会使查找任何问题变得更加简单。\n\
  \n回顾一下我们的路线图，有一个按钮我们只需要在一个步骤中使用。经理评估步骤允许将表单发回给员工。为了能够使用这个按钮，我们首先必须在高级模板设置中启用“表单路由到上一步（form\
  \ routing to previous step）”。启用此功能后，我们就可以在经理评估步骤中为经理授予“发送到上一步（Send to Previous Step）”按钮的权限，如图\
  \ 6-57 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig57_HTML.jpg](img/499651_1_En_6_Fig57_HTML.jpg)\n\
  \n**图 6-57** 将表单后退一步的权限\n\n在路线图的“修改阶段”中，每个步骤都需要“完成表单（Finalize Form）”按钮。这个按钮用于将表单推进到下一步。你应该确定路线图中“修改阶段”的步骤，并确保“完成表单（Finalize\
  \ Form）”按钮在这些步骤中都已启用。对于签名步骤，应启用“签名（Sign）”按钮。这是为了在表单上以电子方式添加签名和日期所必需的。\n\n表单底部最多只能出现五个按钮。在这五个按钮中，“保存并关闭（Save\
  \ and Close）”和“取消（Cancel）”将始终显示。如果你为一个步骤启用了超过五个按钮，其中一些按钮将会根据按钮优先级被归入“更多操作（More Actions）”内。\n\
  \n按钮优先级如下：\n\n1.  完成表单 或 签名 或 一对一确认 (Finalize Form or Sign or Confirm 1:1) （选择其一）\n\
  2.  拒绝 (Reject)\n3.  发送 (Send)\n4.  获取反馈/撤回反馈 (Get Feedback/Recall Feedback)\n5.\
  \  发送到上一步 (Send to Previous Step)\n6.  添加修改人 (Add Modifier)\n7.  添加签名人 (Add Signer)\n\
  \n一个包含超过五个按钮的绩效表单示例如图 6-58 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig58_HTML.jpg](img/499651_1_En_6_Fig58_HTML.jpg)\n\
  \n**图 6-58** 表单上最多五个按钮\n\n关于按钮需要记住的事项：\n\n-   使用上下箭头移动权限以更改其顺序。\n-   对于协作式和迭代式的路线步骤，只有该步骤的退出用户才能看到“完成表单（Finalize\
  \ Form）”按钮。即使你为该步骤中的两个角色都授予了按钮访问权限，情况也是如此。\n-   如果你为“获取评论（Get Comments）”、“获取编辑（Get\
  \ Edits）”和“删除表单（Delete Form）”创建了按钮权限，但如果在高级模板设置中没有启用相应的设置，这些按钮将不会在表单上显示。对于将表单路由后退一步也是如此。\n\
  -   如果表单已经发布，而你之后更新了表单模板中的按钮权限，这些更改不会影响已发布的表单。你需要重新发布表单才能使权限更新生效。\n-   如果按钮在表单模板高级设置中被禁用，但在模板的高级选项中又被允许，则使用表单模板高级设置的权限。\n\
  \n基于按钮权限，你可以根据角色定义哪些容器会显示在已完成的表单上。例如，你可以决定允许员工在其完成的表单上查看他们的整体评分容器，而经理则可以查看总体分数容器、差距分析容器和团队排名器容器。我们将在第\
  \ 7 章学习如何设置这些权限。\n\n## 他人评分 (Other’s Rating) 标签页权限\n\n本节要定义的最后一个权限是“他人评分（Other’s\
  \ Rating）”标签页的权限，如图 6-59 所示。此权限授予查看表单上其他用户输入的目标和能力评级及评论的权限。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig59_HTML.jpg](img/499651_1_En_6_Fig59_HTML.jpg)\n\
  \n**图 6-59** 绩效表单上的“他人评分”标签页\n\n图 6-60 显示了可以找到他人评分权限的表单模板部分。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig60_HTML.jpg](img/499651_1_En_6_Fig60_HTML.jpg)\n\
  \n**图 6-60** 需要定义的“他人评分”标签页权限\n\n此权限用于授予路线步骤中的某个角色查看其他用户评论和评分的权限。示例见图 6-61。\n\n\
  ![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig61_HTML.jpg](img/499651_1_En_6_Fig61_HTML.jpg)\n\
  \n**图 6-61** “他人评分”标签页权限\n\n例如，在自我评估期间，员工为其表单上的每个目标输入评分和评论。当表单流转到经理评估步骤时，通过此权限，经理将能够看到员工输入的评分和评论。\n\
  \n为此，需要确定该标签页对于每个步骤以及步骤中的每个角色是可见（`Enabled`）还是隐藏（`None`）。这是通过 `类型 (Type)` 来完成的。最好从\
  \ `无 (None)` 开始，然后添加任何你希望该标签页可见的步骤。这可以确保“他人评分”标签页在任何步骤中都不会对任何角色可见。然后，你可以根据角色和步骤逐步添加权限。权限示例如图\
  \ 6-62 所示。\n\n![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig62_HTML.jpg](img/499651_1_En_6_Fig62_HTML.jpg)\n\
  \n**图 6-62** 第一步隐藏了“他人评分”标签页权限\n\n请参阅图 6-63 中表单处于第一步时，“来自他人的评分 (Ratings from Others)”标签页显示“没有来自他人的评分\
  \ (There are no Ratings from Others)”的示例。发生这种情况是因为没有为该角色和该步骤设置 `无 (None)` 权限。\n\n\
  ![../images/499651_1_En_6_Chapter/499651_1_En_6_Fig63_HTML.jpg](img/499651_1_En_6_Fig63_HTML.jpg)\n\
  \n**图 6-63** 没有评分的“他人评分”标签页\n\n\n\n### “Other’s Rating Tab Permissions”与表单模板设置\n\
  \n`Other’s Rating Tab Permissions` 定义了所有包含评分的表单部分的选项卡权限。登录用户将在屏幕左侧看到他们输入的评分；而其他所有人的评分将显示在屏幕右侧的\
  \ `Ratings from Others` 选项卡中。创建权限完成后，点击 `Done`。在表单模板的 `General Settings` 中点击 `Hide\
  \ advanced options…` 以隐藏这些选项，该部分将折叠。保存模板，在下一章中，我们将进一步了解构成表单模板的各部分。\n\n## 后续内容\n\n\
  本章我们涵盖了众多内容。目前我们已经了解了如何启用绩效管理、设置基于管理员角色的权限、创建路线图和评分量表。我们还从 `SuccessStore` 下载了一个预构建的绩效表单模板，并开始探索其功能、选项、设置和权限。在下一章中，我们将更深入地探讨绩效表单模板，并学习如何为表单各部分配置和授予权限。\n\
  \n"
- "# 7. 绩效表单模板设置\n\n在上一章中，我们启用了绩效管理、设置了权限，并开始查看绩效表单模板的组件。本章我们将继续讨论，通过探索定义用户在绩效表单中看到的布局和内容的表单模板部分，还将学习可为各部分和字段配置的权限。\n\
  \n我们将返回表单模板以设置各部分和权限。在搜索栏中输入并选择 `Manage Templates`。转到 `Performance Review` 选项卡，选择要更新的绩效表单模板。\n\
  \n## 模板各部分\n\n模板显示后，展开 `Edit Fields and Sections` 部分。示例如图 7-1 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig1_HTML.jpg](img/499651_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1**\n模板的编辑字段和部分视图\n\n本章我们将重点关注此部分。根据从 `SuccessStore` 下载的预构建表单模板或复制的表单模板，您在模板上看到的部分可能有所不同。但是，可以添加任何标准部分，也可以创建自定义部分。\n\
  \n以下列出了模板中可能使用的标准部分：\n\n*   `Introduction`\n*   `Employee Information`\n*   `Review\
  \ Dates`\n*   `Mid-Year`\n*   `Additional Comments`\n*   `Goals/Objectives`（以及 `Development\
  \ Objectives`）\n*   `Competency`（角色、核心和自定义）\n*   `Summary`\n*   `Performance Potential\
  \ Summary`\n*   `Objective Competency Summary`\n*   `Customized Weighted Rating`\n\
  *   `Signature`\n\n也可以创建包含自定义字段的自定义部分。\n\n我们将了解这些部分，包括每个部分的目的、内容和可设置的权限。我们将查看可添加到表单模板中的部分。在模板最后一个部分下方，找到并点击\
  \ `Add New Section`，标准部分将显示在一个弹出窗口中，如图 7-2 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig2_HTML.jpg](img/499651_1_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2**\n新部分选项\n\n如果这些部分中的任何一个已存在于模板中，它们可能不会出现在列表中。某些部分每个模板只能使用一次，例如 `Employee\
  \ Information`、`Review Dates`、`Summary` 和 `Signature`。未显示在 `Section type` 下拉列表中的部分已存在于模板中，因此无法再次添加。`Goals`、`Competency`\
  \ 和自定义部分可以在表单模板中出现多次。选择一个部分名称，点击 `Add`，该部分将被添加到模板中。它将显示为表单模板的最后一个部分。\n\n每个部分将按照表单模板中的顺序出现在您的绩效表单上。可以通过单击一个部分并将其拖到新位置来重新排列部分顺序。进行更新时请保存模板。\n\
  \n## 部分、操作和字段权限\n\n在第 6 章中，我们回顾了按钮权限以及在表单模板 `General Settings` 的高级选项部分中找到的 `Other’s\
  \ Rating Tab Permissions`。在表单模板的这一部分中，需要配置部分、操作和字段权限。根据部分类型，将有不同的功能和权限需要配置。\n\n\
  表 7-1 列出了权限类型及其选项。\n\n**表 7-1**\n权限类型\n\n| 类型 | 权限 | 设置对象 |\n| --- | --- | --- |\n\
  | `Section` | `Enabled`、`Hidden` 或 `Disabled` | 路线步骤中的角色 |\n| `Action` | `Enabled`、`None`\
  \ | 路线步骤中的角色 |\n| `Field` | `None`、`Read`、`Write` | 部分评论、手动总体评分、计算总体评分、加权平均值 |\n\
  \n首先定义部分权限。我们可以隐藏一个部分、查看一个部分（`Disabled`）或编辑一个部分（`Enabled`）。对于用户可能编辑操作或字段的任何步骤，必须启用该部分。例如，如果您没有为某个步骤（用户将在其中添加目标评分）启用该部分，则该部分内字段的\
  \ `Write` 权限将不会被生效。权限的顺序很重要。系统从上到下读取它们。每个新权限会覆盖任何可能与之冲突的先前权限。\n\n需牢记的一些基本规则如下：\n\
  \n*   当权限未设置时，系统授予所有用户所有权限。\n*   对于仅需“只读”的部分，在所有步骤中为所有角色使用 `Disabled`。\n*   要授予部分角色权限而非全部，请先为所有步骤中的所有角色定义\
  \ `None` 权限。然后，您可以逐步为需要查看该部分的角色和步骤添加权限。\n*   如果一个部分已启用，则该部分内的字段权限可用于对某些角色隐藏字段。\n\
  *   如果一个部分是可编辑的，但字段权限为 `None`，则用户将只看到部分标题和页眉。\n*   在路线图中需要 `Summary` 和 `Signature`\
  \ 部分之前，请将其隐藏。\n*   要在已完成的表单上查看字段，请首先为所有角色设置 `Read` 权限，然后为编辑设置 `Write` 权限，为查看设置 `Read`\
  \ 权限，或为在特定步骤中隐藏字段设置 `None` 权限。\n\n现在，我们将查看表单模板的每个部分以及如何设置它。\n\n正如我们所见，存在标准的绩效表单模板部分。每个部分都有不同的功能、选项和权限。也可以创建自定义部分。自定义部分可以包含描述、部分评论和自定义字段。如果您单击一个部分，您可以更新部分标签、为其他语言添加标签以及设置权限。现在，我们将逐一介绍各部分类型。我们将看到模板中的部分及其在绩效表单上的显示方式，并学习如何配置部分和字段权限。\n\
  \n## Introduction 部分\n\n\n\n#### 简介部分\n\n此部分可配置为显示有关绩效评估流程的信息以及如何填写表单的说明，也可包含链接或图片。该部分的示例如图\
  \ 7-3 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig3_HTML.jpg](img/499651_1_En_7_Fig3_HTML.jpg)\n\
  \n**图 7-3** 简介部分\n\n此部分唯一可用的选项是`Section Name`（部分名称）和`Description`（描述），并且两者都可以有本地化标签。此部分不包含任何字段，因此无需设置字段权限。只能设置部分权限，即`Hidden`（隐藏）或`Disabled`（禁用）。由于此部分没有字段，即使您选择了`Enabled`（启用）或未设置权限，该部分仍将是只读的。\n\
  \n图 7-4 是一个嵌入了图片的简介部分示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig4_HTML.jpg](img/499651_1_En_7_Fig4_HTML.jpg)\n\
  \n**图 7-4** 带图片的简介部分\n\n### 员工信息部分\n\n`Employee Information`（员工信息）部分可配置为显示员工的一些基本信息。该部分的示例如图\
  \ 7-5 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig5_HTML.jpg](img/499651_1_En_7_Fig5_HTML.jpg)\n\
  \n**图 7-5** 员工信息部分\n\n您可以更改部分名称并添加本地化部分标签。您也可以添加带有本地化标签的描述。`Description`（描述）字段的内容将显示在表单的该部分中，可以是文本、图片、链接或它们的组合。描述将显示在`Display\
  \ Options`（显示选项）所选字段的上方。`Display Options`（显示选项）中列出了可以出现在表单该部分中的字段。点击字段旁边的复选框，使其显示在此部分。\n\
  \n`Employee Information`（员工信息）部分的示例如图 7-6 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig6_HTML.jpg](img/499651_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** 绩效管理表单上的员工信息部分\n\n您还可以在此部分包含其他字段，但这些字段必须添加到表单模板`XML`中，我们将在第 10 章中介绍。其他字段包括：\n\
  \n*   `Emp ID`（员工编号）\n*   `Business Phone Number`（办公电话）\n*   `Fax Number`（传真号码）\n\
  *   `Home Address`（家庭地址）\n*   `Review Frequency`（评估频率）\n*   `Last Review Date`（上次评估日期）\n\
  *   用户数据文件中的任何自定义`01-15`字段\n\n也可以重新排列`XML`中的字段显示顺序。\n\n此部分是只读的，对所有角色和路由步骤，权限类型应为`Disabled`（禁用），如图\
  \ 7-7 所示。如果没有授予任何部分权限，该部分仍会显示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig7_HTML.jpg](img/499651_1_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7** 只读部分的权限\n\n### 评估日期部分\n\n`Review Dates`（评估日期）部分显示三个标准字段。您可以添加一个描述，该描述将显示在标准字段上方。您也可以为部分名称和描述添加本地化标签。该部分会显示启动表单的用户（发起人）的姓名。此部分还会从表单模板的高级设置中提取默认的开始日期和默认的结束日期。这些日期与默认的截止日期一起用于绩效评估周期。\n\
  \n模板中`Review Dates`（评估日期）部分的示例如图 7-8 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig8_HTML.jpg](img/499651_1_En_7_Fig8_HTML.jpg)\n\
  \n**图 7-8** 评估日期部分\n\n不能向此部分添加额外字段，也不能删除或重新排序现有字段。绩效表单上该部分的示例如图 7-9 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig9_HTML.jpg](img/499651_1_En_7_Fig9_HTML.jpg)\n\
  \n**图 7-9** 绩效管理表单上的评估日期部分\n\n在上图所示的示例中，发起人是启动表单的用户。看到这个字段可能会让用户感到困惑，但它无法被移除。由于这是一个可选部分，许多组织选择不使用它。您可以通过点击垃圾桶图标来删除该部分；另一个选择是隐藏该部分。要在您的表单模板中使用此部分，应将其对所有角色和所有步骤禁用。\n\
  \n### 年中部分\n\n`Mid-Year`（年中）部分可用于跟踪年中进行的任何讨论。员工和经理可以在年中坐下来回顾实现目标的进展情况。此时不会进行评级，但这是一个*纠正航向*的机会，以处理可能出现的任何问题。可以制定发展目标来解决年终前可以改进的薄弱领域。根据讨论内容，可以添加或移除其他目标。\n\
  \n模板中该部分的示例如图 7-10 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig10_HTML.jpg](img/499651_1_En_7_Fig10_HTML.jpg)\n\
  \n**图 7-10** 年中部分\n\n此部分可以包含一个日期字段，用于标识年中谈话的日期。也可以启用整体部分评论。此部分可以隐藏、启用或禁用。此部分唯一可用的字段权限是部分评论。\n\
  \n以下是如何允许使用此部分的示例。您的绩效评估流程包含一个初始步骤，员工在此设定年度目标。然后表单流转到经理处编辑目标。在这些步骤中，`Mid-Year`（年中）和`Assessment`（评估）部分将被隐藏。`Mid-Year`（年中）部分在年中步骤期间显示并可编辑，而年中评估之后的评估步骤则被隐藏。一旦进入评估步骤，`Mid-Year`（年中）部分将变为只读。\n\
  \n`Mid-Year`（年中）部分的示例如图 7-11 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig11_HTML.jpg](img/499651_1_En_7_Fig11_HTML.jpg)\n\
  \n**图 7-11** 绩效表单上的年中部分\n\n### 附加评论部分\n\n还有一个可选部分可用于添加额外评论。您可以重命名此部分并包含一个描述，该描述将显示在部分的顶部。此部分已预先配置，仅包含评论文本框，如图\
  \ 7-12 所示。您可以添加、编辑或删除评论字段，并本地化标签。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig12_HTML.jpg](img/499651_1_En_7_Fig12_HTML.jpg)\n\
  \n**图 7-12** 附加评论部分\n\n如果您希望有一个与`Goals`（目标）或`Competency`（能力）部分评论分开的评论部分，这会很有用。您可以创建一个长文本字符串，作为您的`textarea`响应的标签。图\
  \ 7-13 显示了一个示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig13_HTML.jpg](img/499651_1_En_7_Fig13_HTML.jpg)\n\
  \n**图 7-13** 将文本添加为评论字段标签\n\n此部分没有权限，这意味着在任何`Modify Stage`（修改阶段）步骤中，任何角色都可以添加评论。这也意味着任何角色都可以覆盖或删除来自先前步骤的评论。您可以在表单模板`XML`中添加权限来解决此问题，但创建一个自定义部分可能更简单，因为它提供了更多的字段类型和权限选项。\n\
  \n\n\n## 绩效表格的组成部分\n\n图 7-14 展示了一个绩效表格中的示例评论部分。你可以看到，该部分已被重命名，并且 `Description` 字段显示在评论上方。\n\
  \n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig14_HTML.jpg](img/499651_1_En_7_Fig14_HTML.jpg)\n\
  \n**图 7-14** PM 表格上的附加评论部分\n\n至此，我们已经了解了在表单模板中可能只出现一次的基本部分。接下来，我们将介绍自定义部分。\n\n##\
  \ 自定义部分\n\n除了标准部分之外，还可以创建自定义部分。在一个表单模板中，你可以有多个自定义部分。与大多数标准部分类似，自定义部分可以包含部分评论和描述。自定义部分的独特之处在于，在执行表单批量启动时，可以编辑其描述。模板的自定义部分如图\
  \ 7-15 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig15_HTML.jpg](img/499651_1_En_7_Fig15_HTML.jpg)\n\
  \n**图 7-15** 自定义部分\n\n如图 7-16 所示，有几种类型的自定义元素。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig16_HTML.jpg](img/499651_1_En_7_Fig16_HTML.jpg)\n\
  \n**图 7-16** 自定义元素类型\n\n可以为目标、胜任力以及自定义部分创建自定义字段。在摘要部分也允许使用自定义字段，但必须通过表单模板 XML 添加。在一个部分中，自定义字段将垂直显示，而非并排显示，因此除了字段顺序外，你无法设置该部分中字段的布局。在目标和胜任力部分，自定义字段将显示在评级字段上方。\n\
  \n表 7-2 显示了可用的八种自定义元素类型。\n\n**表 7-2** 自定义元素类型\n\n| 元素 | 描述 |\n| --- | --- |\n| 标签\
  \ | 将显示为粗体文本标签，不附带数据输入字段。 |\n| 文本 | 标签字段以及用于输入一行文本的开放框。 |\n| 文本区域 | 多行文本输入框。 |\n\
  | 日期 | 日期输入。 |\n| 列表 | 下拉列表。 |\n| 整数 | 用于输入整数的文本框。 |\n| 双精度 | 用于输入带小数数字的文本框。 |\n\
  | 复选框 | 带标签的复选框。指定 `\"evalue\"`；否则，选中时不会存储任何内容。 |\n\n除了 `\"Label\"`（标签）元素类型外，每个自定义元素都可以定义一个标签，该标签将显示在输入字段之前。你可以决定在部分中添加一个或多个自定义字段。需要为每个步骤中的角色定义权限，以确定哪些角色可以查看该部分、浏览该部分或编辑该部分。\n\
  \n> **注意**：有关如何配置自定义字段的更多详细信息，请参考 SAP 备注 #2888737。\n\n请注意，为某个部分定义的自定义元素，若要在另一部分中使用，则必须重新创建。\n\
  \n自定义部分具有 `\"仅限管理层\"` 选项，如图 7-17 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig17_HTML.jpg](img/499651_1_En_7_Fig17_HTML.jpg)\n\
  \n**图 7-17** 自定义部分中的“仅限管理层”选项\n\n选中时，此选项充当部分权限，只有经理和人力资源角色才能在绩效表格上看到该部分。\n\n一个使用了多种自定义元素的自定义部分示例如图\
  \ 7-18 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig18_HTML.jpg](img/499651_1_En_7_Fig18_HTML.jpg)\n\
  \n**图 7-18** 绩效表格中的自定义部分\n\n接下来我们要看的几个部分用于评估。我们可以对目标计划中的目标以及特定于岗位的、核心的或自定义的胜任力进行评分。这些评分将用于计算总体绩效评级。在查看目标和胜任力部分之前，我们先来看看权重及其对这些部分的影响。\n\
  \n### 权重\n\n权重是可选的，可用于部分，或部分内的项目，或两者兼用。目标和胜任力部分的权重用于总体表单评级计算。在一个部分内，你可以为该部分中的项目定义目标总权重。\n\
  \n关于权重需要了解以下几点：\n\n-   权重可以设置为可编辑或只读。\n-   通常，项目级的胜任力不被加权。\n-   如果不使用权重，则项目和部分的权重被视为相等。\n\
  -   权重可以是数字或百分比。\n-   将部分权重设置为 `0`，以将该部分排除在总体评分计算之外。\n\n现在我们已经了解了一些关于权重的背景知识，也知道评分是怎么回事，接下来可以继续讲解目标和胜任力部分了。\n\
  \n#### 目标部分\n\n通常情况下，年度目标的达成情况是衡量绩效的标尺。表单模板应包含你的组织正在使用的目标计划。表单模板上的目标部分示例如图 7-19\
  \ 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig19_HTML.jpg](img/499651_1_En_7_Fig19_HTML.jpg)\n\
  \n**图 7-19** 表单模板上的目标部分\n\n在上图中，有一个需要填写的部分名称和描述。你还需要确定该部分使用的目标计划。目标部分可以在一个表单模板中出现多次，理想情况下，一次用于目标计划，另一次用于发展目标计划。可以有额外的目标计划部分，但不推荐；表单应该只使用一个目标计划进行评分。该部分的类型通过单选按钮\
  \ `目标部分` 或 `个人发展计划部分` 来标识。用于链接到模板的计划下拉列表将基于所选的部分类型单选按钮。\n\n将目标填充到绩效表格有两种方式：自动填充和自动同步。\n\
  \n-   **自动填充** 在创建表单时从目标计划中拉取目标。此方法的一个缺点在于，如果在绩效表格启动后向目标计划中添加了任何目标，这些目标将不会出现在表单上，除非你配置并使用\
  \ `\"添加现有目标\"` 按钮。这需要用户在其绩效表格中手动添加目标。\n-   **自动同步** 在目标计划和绩效表格之间同步目标。绩效表格将包含用户目标计划中的目标。对目标计划所做的任何更改都将反映在绩效表格中；反之，在绩效表格中进行的任何目标更新、删除或添加也将反映回目标计划中。\n\
  \n> **提示**：你可以在高级选项中勾选 `\"同步目标计划和评审表单中的目标\"` 选项来启用自动同步。\n\n如果启用，用户可以在绩效表格上添加或删除目标。此外，可以为每个目标添加评论，添加为整个目标部分的评论，或者两者都添加。员工和经理可以为每个目标输入评分。\n\
  \n目标部分的其他特性包括：\n\n-   拼写检查\n-   法律扫描\n-   评分等级描述\n\n一个绩效表格的目标部分示例如图 7-20 所示。\n\n\
  ![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig20_HTML.jpg](img/499651_1_En_7_Fig20_HTML.jpg)\n\
  \n**图 7-20** 绩效表格上的示例目标部分\n\n\n\n## 目标章节\n\n“目标”章节的选项和功能取决于表单模板及 `Provisioning`\
  \ 中表单模板 XML 所启用的内容。此处，我们将重点介绍可通过“管理模板”在表单模板中更新的功能。第 10 章将介绍可进行的 XML 更新。\n\n在讨论表单模板选项之前，让我们先看一下上图中显示的示例“目标”章节。可以看到，有一个初始的“目标”章节作为表头。此处的章节描述即为“目标”章节表头。“目标”章节表头之后是来自用户目标计划的每个目标，这些目标被分隔到各自的目标子章节中。\n\
  \n对于每个目标，您都可以看到其名称和描述。我们在表单模板中创建并指定的评分量表将用于对每个目标进行评分。评分分数的默认视图以星形表示。用户可以为每个目标输入评论和评分。还可以在表单上最后一个目标之后设置一个总体目标评论章节。表单中对目标的任何更改都将反映在目标计划中。\n\
  \n### 配置决策\n\n在填写配置工作簿时，需要做出以下决策：\n\n-   哪些角色在哪些步骤中可以添加、编辑或删除目标？\n-   哪些角色在哪些步骤中可以输入评分？\n\
  -   是否为每个目标设置评论？如果是，在哪个步骤，为哪个角色设置，以及这些评论是否为可选项？\n-   哪个角色在哪个步骤中可以查看“他人评分”选项卡？\n\
  -   是否包含目标摘要章节？如果是，哪个角色在哪个步骤中可以添加或查看评论？评论是可选的还是必填的？\n-   目标占总体评分的百分比是多少？\n-   其他步骤的其他用户可以查看哪些目标章节数据？\n\
  \n这些决策决定了如何配置该章节。就我们的目标而言，我们将允许员工和经理为每个目标项目添加评论并提供评分。\n\n*有关字段和章节权限的说明，请参考 SAP 注释\
  \ #2077252。*\n\n### 配置章节\n\n除了常规设置之外，还有很多选项，让我们从上往下看。我们首先来看看“描述”后面的选项。单击“显示高级选项…”以展开该章节，如图\
  \ 7-21 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig21_HTML.jpg](img/499651_1_En_7_Fig21_HTML.jpg)\n\
  \n**图 7-21** 表单的目标章节\n\n选择一个单选按钮，以标识您在此章节中使用的是目标计划还是发展计划。使用下拉列表选择要在绩效模板中使用的目标计划。这将从所选的目标计划中将目标拉取到绩效表单中。\n\
  \n> **注意**  \n> 发展目标通常不进行评分。但是，如果您希望包含一个出现在绩效表单上的发展计划，可以添加一个额外的“目标”章节。您可以将该章节配置为能够添加或删除发展目标，但不进行评分。\n\
  \n请参考表 7-3 了解每个设置的含义。\n\n**表 7-3** 目标章节高级设置\n\n| 设置项 | 描述 |\n| --- | --- |\n| 显示“添加现有目标”按钮\
  \ | 仅当目标未从目标计划自动填充到表单时才适用。启用后，“添加目标”按钮允许用户从目标计划中选择一个目标添加到绩效表单中。 |\n| 禁止评分 | 如果此设置是在“常规设置”中应用的，则它已经为所有包含评分的章节填充了该设置。如果在此处输入，则该标签仅适用于目标章节。也可以添加本地标签。\
  \ |\n\n#### 高级选项\n\n| 设置项 | 描述 |\n| --- | --- |\n| 包含评分功能 | 用于标识该章节是否会被评分。如果是，则每个目标都会被评分。对于每个评估步骤，角色将为每个目标拥有自己的评分框。经理的评分将成为最终评分，或者您也可以选择将其他角色的评分设为最终评分。或者，对于每个评估步骤，每个目标都会有一个评分框，并且每个步骤的评分会覆盖上一步骤输入的评分。如果未启用，则不会有评分目标的选项。启用时：\
  \ • 每个人对每个目标项目都有自己独立的评分框。 – 最终分数是经理的评分（推荐）。 – 可以指定任何角色的评分作为最终评分。 • 所有人共享每个目标的一个评分框。最后输入的评分将成为最终评分。\
  \ |\n| 排除私有目标 | 启用时： • 如果您的目标计划包含私有目标且自动同步已开启，则私有目标不会出现在绩效表单的“目标”章节中。 • 如果您的目标计划包含私有目标，自动同步未开启，并且启用了“添加现有目标”，则无法选择私有目标。\
  \ • 当启用在绩效表单内添加目标时，您将无法创建私有目标。 |\n| 包含输入权重功能 | 允许用户更新目标权重。权重用于目标评分计算。 |\n| 为每个项目包含评论\
  \ | 每个目标都会显示一个评论框。可以允许特定步骤中的特定角色添加或查看评论。 |\n| 包含总体评论 | 在每个单独的目标之后，可以包含一个目标摘要章节，并允许用户添加或查看目标章节评论。\
  \ |\n| 在摘要中显示章节 | 目标项目权重和评分显示在表单摘要章节中。 |\n| 显示计算出的章节评分 | 计算出的总体目标评分显示在表单摘要章节中。 |\n\
  | 从目标计划权重自动填充目标权重 | 当与目标计划自动同步时，来自目标计划中每个目标的权重将填充到绩效表单上的目标中。 |\n| 允许用户在章节内添加/移除目标\
  \ | 使用户能够向绩效表单中添加或从中删除目标。需与操作权限结合使用。 |\n| 同步目标计划与审核表单中的目标 | 对目标计划所做的更改会自动同步到绩效表单的“目标”章节。对绩效表单内目标所做的更改会同步到目标计划。\
  \ |\n| 使用指标查询表评分 | 如果目标计划包含指标查询表，则启用指标查询表评分功能。 |\n| 包含在总体目标评分计算中 | 表示此章节中的目标将用于计算总体目标评分。\
  \ |\n| 在目标章节中显示 | 使用目标能力摘要章节时，此章节中的目标将显示在此处。 |\n| 锁定项目权重 | 防止用户更改目标权重。 |\n| 包含在总体绩效摘要章节评分中\
  \ | 在总体绩效摘要章节中包含目标章节。 |\n| 最少目标数 | 绩效表单上目标的最小数量。 |\n| 最多目标数 | 绩效表单上目标的最大数量。 |\n\
  | 目标能力摘要的章节权重 | 仅当使用目标能力摘要章节时适用。指定用于目标能力评分计算的目标评分权重。 |\n| 总权重 | 章节中所有目标的总权重。 |\n\
  | 评分量表 | 如果在模板的常规设置中选择，所有包含评分的章节将使用此量表。可以在章节内选择不同的量表，但不建议这样做。 |\n| 隐藏评分数值 | 评分通过下拉列表使用评分标签进行选择，而不是使用星形或圆形。\
  \ |\n| 默认评分 | 可以定义打开表单时显示的默认评分。 |\n| 为评分字段选择替代标签 | 为评分字段定义另一个标签，例如“选择一个评分”。 |\n\n\
  \n\n在开始讨论评分量表之前，我们简要介绍了评分量表的格式。\n\n### 评分量表外观\n\n默认的评分量表以星形显示，如图 7-22 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig22_HTML.jpg](img/499651_1_En_7_Fig22_HTML.jpg)\n\
  \n**图 7-22** 默认星形评分\n\n“Too New to Rate” 值显示在量表的最左侧，其图标为“无圈”图标。\n\n在表单模板的高级设置中，您可以选择使用圆形显示评分量表。圆形评分量表的示例如图\
  \ 7-23 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig23_HTML.jpg](img/499651_1_En_7_Fig23_HTML.jpg)\n\
  \n**图 7-23** 圆形评分\n\n“Too New to Rate” 值显示在量表的最左侧，其图标为“无圈”图标。\n\n最后一种评分量表显示方式是以下拉列表形式呈现的文本，如图\
  \ 7-24 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig24_HTML.jpg](img/499651_1_En_7_Fig24_HTML.jpg)\n\
  \n**图 7-24** 文本评分\n\n下拉列表中使用的是评分量表的文本标签。\n\n无论评分量表类型如何，这三种类型都在问号图标中显示评分描述，如图 7-25\
  \ 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig25_HTML.jpg](img/499651_1_En_7_Fig25_HTML.jpg)\n\
  \n**图 7-25** 评分描述\n\n“Too New to Rate” 值是下拉列表中的第一个评分。在这些评分量表中，“Too New to Rate”\
  \ 没有数值，并且不参与整个表单的计算。所选量表类型将应用于目标与能力项评分以及摘要部分的总体评分。计算得出的总体表单评分将使用数值量表。我们将在讨论模板摘要部分时进一步介绍总体表单评分。\n\
  \n#### 部分的权限\n\n一个部分可以设置五种类型的权限：\n\n1.  部分\n2.  操作（仅适用于目标与能力部分）\n3.  字段\n4.  必填字段\n\
  5.  自定义元素（仅适用于目标与能力部分以及使用 XML 的摘要部分）\n\n并非所有权限都适用于每个部分。例如，操作、字段和必填字段不适用于员工信息、简介、审核日期和附加评论等部分。\n\
  \n图 7-26 展示了模板目标部分可用的权限类型示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig26_HTML.jpg](img/499651_1_En_7_Fig26_HTML.jpg)\n\
  \n**图 7-26** 部分权限类型\n\n我们将逐一查看每种权限类型。\n\n##### 部分权限\n我们从部分权限开始。部分可以设置为隐藏、可编辑或只读。权限类型包括“隐藏”、“启用”或“禁用”。对于每个模板部分，需要根据角色和步骤确定该部分是不可见、可编辑还是仅供查看。\n\
  \n#### 操作权限\n操作权限用于目标与能力部分，以添加或移除目标或能力。操作类型有“无”或“启用”。操作选项包括“添加项目”或“移除项目”。仅当为该部分启用了“允许用户在此部分中添加/移除目标”时，这些权限才生效。这些权限应根据角色和步骤进行设置。\n\
  \n##### 字段权限\n字段权限定义了在每个步骤中，哪些字段根据角色是隐藏、可查看还是可编辑的。例如，某个部分可能可见；但根据角色和步骤，某些字段可能被隐藏。选项包括“无”、“读取”和“写入”。\n\
  \n目标与能力字段包括：\n\n*   项目评分（经理评分）\n*   非官方用户评分\n*   项目权重\n*   部分权重\n*   项目评论\n*   主题评分（员工自评）\n\
  \n\n\n## 章节评论\n\n- 章节评论\n- 自定义字段\n\n通常，员工会在经理评估之前的步骤中进行自评。允许员工对目标项目进行评分的字段是`Subject\
  \ Rating`。使用`Item Rating`作为经理的评分。在路线图步骤中定义的任何其他角色将使用`Unofficial User Rating`。\n\n\
  ### 必填字段权限（可选）\n\n我们可以确定哪些字段（如果有）在表单可以进入下一步之前必须填写。为每个必填字段定义角色和步骤。表单模板中的必填字段权限如图\
  \ 7-27 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig27_HTML.jpg](img/499651_1_En_7_Fig27_HTML.jpg)\n\
  \n**图 7-27** 必填字段的发送操作\n\n必填字段权限独有的特点是`Send Action`。您必须确定发送操作是`Next Step`还是`Signature`。对于`Next\
  \ Step`，该字段是将表单发送到下一步之前必须填写的条目。`Signature`操作用于在移动到签名步骤之前必须填写该字段的情况。\n\n例如，如果用户必须输入目标评分，则将其设置为应输入该字段步骤的必填字段。除非填写了必填字段，否则用户将无法将其绩效表单提交到下一步。如果允许，`Incomplete\
  \ Items`面板将显示该步骤的必填字段数量。建议将评分设置为必填项，以便将表单提交到下一步。\n\n### 自定义元素权限（可选）\n\n我们之前在本章中讨论了自定义部分并了解了自定义字段。自定义字段可以添加到目标和能力部分。创建自定义字段后，您需要按步骤和角色定义权限。也可以将自定义字段设为必填。\n\
  \n如果在部分中启用了`Include an Overall Comment`，您将看到一个位于最终目标之后的评论部分。您可以按步骤和角色设置查看或创建评论的权限。图\
  \ 7-28 显示了一个章节评论的示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig28_HTML.jpg](img/499651_1_En_7_Fig28_HTML.jpg)\n\
  \n**图 7-28** 整体目标评论\n\n如您所见，各个目标会被评分，但用户无法输入整体目标评分。各个目标项目的评分将用于计算整体表单评分。整体表单评分将显示在摘要部分。如果使用了客观能力摘要部分，则可以显示计算得出的整体目标评分。\n\
  \n## 发展目标部分\n\n在表单模板中包含发展计划是一个可选部分。要添加此部分，请选择`Goal`部分类型，如图 7-29 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig29_HTML.jpg](img/499651_1_En_7_Fig29_HTML.jpg)\n\
  \n**图 7-29** 添加发展目标部分\n\n这与用于目标的部分相同，因此选项和设置也相同。只需确保选中`Individual Development Plan\
  \ Section`单选按钮，然后选择要链接到表单模板的发展计划。命名该部分，添加描述，并允许用户添加或移除发展目标。尽管可以对发展目标进行评分，但不建议这样做。发展目标旨在确定需要改进的领域，对其进行评分似乎不太合适。通常，在表单中包含此部分更多是为了提供信息，或允许用户根据其实现目标的进展情况来添加发展目标。发展目标面向未来，而评分目标则针对过去的行为。\n\
  \n如果包含此部分，您可以将其设置为只读，但允许员工添加发展目标或对现有发展目标添加评论。示例如图 7-30 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig30_HTML.jpg](img/499651_1_En_7_Fig30_HTML.jpg)\n\
  \n**图 7-30** 发展目标部分高级选项\n\n表单中发展目标部分的一个示例发展目标如图 7-31 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig31_HTML.jpg](img/499651_1_En_7_Fig31_HTML.jpg)\n\
  \n**图 7-31** 绩效表单上的发展目标\n\n根据为此示例设置的权限，可以编辑或删除发展目标，并可以添加额外的发展目标。发展目标上没有评分。\n\n###\
  \ 能力部分\n\n能力描述了员工履行其工作所需的基本技能。在绩效表单中包含能力是有意义的，因为能力是可观察和可衡量的，并且会影响绩效。除了对员工实现目标的情况进行评分外，也可以对能力进行评分。与目标部分一样，每个项目都会被评分。目标项目评分和能力项目评分将一起用于计算整体表单评分。\n\
  \n在配置工作簿中，需要做出决策以确定如何设置表单模板部分，包括：\n\n- 使用角色、核心或自定义能力\n- 在能力上使用评论，由哪个角色在哪个步骤进行\n\
  - 谁可以在哪个步骤对能力进行评分\n- 使用整体能力评论\n\n如果您正在使用能力库（最好是 SuccessFactors 2.1 能力库，且能力已链接到职位代码），您可以将员工特定角色的能力拉入表单进行评分。如果您还确定了`core`能力，您也可以在表单上有一个单独的核心能力部分。也允许用户向绩效表单添加额外能力。但建议谨慎行事，因为这可能会削弱角色和核心能力评分的权重重要性。\n\
  \n能力部分的其他可选功能包括：\n\n- 拼写检查\n- 法律审查\n- 写作助手\n\n这些选项需要在 Provisioning 以及表单模板高级设置中启用。\n\
  \n一个绩效表单的能力部分示例见图 7-32。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig32_HTML.jpg](img/499651_1_En_7_Fig32_HTML.jpg)\n\
  \n**图 7-32** 绩效表单上的核心能力部分\n\n目标部分的大部分功能和配置选项与能力部分相同。我们将指出显著的差异。图 7-33 显示了表单模板中能力部分的一个示例。\n\
  \n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig33_HTML.jpg](img/499651_1_En_7_Fig33_HTML.jpg)\n\
  \n**图 7-33** 能力部分\n\n### 能力部分类型\n\n您的表单上可以有多个能力部分。理想情况下，您应该为每种能力类型创建一个单独的能力部分。但是，也可以在同一部分中包含自定义能力与特定职位的能力，或者自定义能力与核心能力。特定职位的能力和核心能力不能出现在同一部分中。\n\
  \n您可以选择`Job Specific`、`Core`或`Custom`作为部分类型。使用我们在图 7-34 中的示例，能力部分类型是`Core`，并且列出了核心能力。这意味着所有创建了表单的人都会拥有这些相同的能力。您可以决定是否存在适用于所有角色的公司范围能力。\n\
  \n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig34_HTML.jpg](img/499651_1_En_7_Fig34_HTML.jpg)\n\
  \n**图 7-34** 选择能力类型\n\n\n\n## 能力模块\n\n这些能力通过 `Job Profile Builder` 被识别为“核心”能力。如果您选择了“特定职位”，所有与用户职位角色关联的能力将填充到能力模块中。\n\
  \n### 自定义能力\n\n另一种选择是使用自定义能力。这些是硬编码的能力，将显示在每个人的表单上。在将模块类型选择为“自定义”后，展开高级选项部分，您将看到“已定义\
  \ 0 个自定义能力。单击以修改”，如图 7-35 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig35_HTML.jpg](img/499651_1_En_7_Fig35_HTML.jpg)\n\
  \n图 7-35  \n定义自定义能力\n\n您可以在模板中定义自定义能力。您可以从任何现有能力中选择那些应该硬编码在表单上的能力。您也可以创建不与职位代码关联或非核心的新能力，然后在模板中选择这些能力。\n\
  \n图 7-36 展示了创建自定义能力的示例。该能力是使用 `Job Profile Builder` 创建的。请参考第 3 章了解更多关于 `Job Profile\
  \ Builder` 的信息。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig36_HTML.jpg](img/499651_1_En_7_Fig36_HTML.jpg)\n\
  \n图 7-36  \n创建新能力\n\n一旦新能力创建完成，它就可以被选为硬编码能力，从而显示在所有用户的绩效表单上。如图 7-37 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig37_HTML.jpg](img/499651_1_En_7_Fig37_HTML.jpg)\n\
  \n图 7-37  \n选择硬编码能力\n\n### 能力权限\n\n与目标模块类似，您需要设置模块、字段、必填字段和自定义字段的权限。可用的字段与目标模块字段相同，如下所示：\n\
  \n- 项目评分（管理者评分）\n- 非官方用户评分\n- 项目权重\n- 模块权重\n- 项目评论\n- 主体评分（员工自评）\n- 模块评论\n- 自定义字段\n\
  \n### 行为\n\n如果您有能力关联的行为，并且这些能力的行为映射到职位角色，那么可以在绩效表单上显示与能力关联的行为。也可以根据这些行为来对能力进行评分。\n\
  \n图 7-38 是一个带有关联行为的能力示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig38_HTML.jpg](img/499651_1_En_7_Fig38_HTML.jpg)\n\
  \n图 7-38  \n带有关联行为的能力\n\n该能力关联到一个职位角色，如图 7-39 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig39_HTML.jpg](img/499651_1_En_7_Fig39_HTML.jpg)\n\
  \n图 7-39  \n与职位角色关联的能力\n\n通过选择“显示行为”，将显示每个能力对应的行为。您还可以选择显示模式，使行为在绩效表单中出现在能力评分的上方或下方。\n\
  \n示例如图 7-40 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig40_HTML.jpg](img/499651_1_En_7_Fig40_HTML.jpg)\n\
  \n图 7-40  \n显示每个能力的行为\n\n图 7-41 展示了行为如何出现在绩效表单中能力下方的示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig41_HTML.jpg](img/499651_1_En_7_Fig41_HTML.jpg)\n\
  \n图 7-41  \n绩效管理表单中带有行为的能力\n\n在此示例中，用户对能力进行评分和评论，并查看关联的行为。\n\n也可以基于行为而非能力进行评分。如果一个能力有多个行为，则每个行为都会被评分，然后系统会为每个能力计算总体行为评分。示例如图\
  \ 7-42 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig42_HTML.jpg](img/499651_1_En_7_Fig42_HTML.jpg)\n\
  \n图 7-42  \n根据行为对能力进行评分\n\n例如，如果一个能力有五个关联行为，每个行为都会被评分，然后每个能力会有一个计算得出的总体行为评分。\n\n\
  图 7-43 所示的示例中有两个行为需要评分，以便为该能力生成计算评分。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig43_HTML.jpg](img/499651_1_En_7_Fig43_HTML.jpg)\n\
  \n图 7-43  \n需要在绩效管理表单上评分的带有行为的能力\n\n## 总结模块\n\n整体绩效总结模块包含了来自所有评估模块（目标和能力）的汇总评分信息。\n\
  \n可以在总结模块中使用的整体表单评分有三种类型：\n\n1.  *计算出的总体评分*：这是默认评分，基于目标和能力模块中的项目评分以及模块权重得出。即使您对项目评分和手动总体评分使用星形、圆形或文本格式，该评分也将是数字格式。\n\
  2.  *手动总体评分*：允许管理者创建一个整体表单评分，用于替代计算出的整体表单评分。如果使用星形或圆形，手动总体评分在总结模块中将显示为星形或圆形。\n3.\
  \  *调整后的计算评分*：允许将一系列评分映射到评分量表中的一个值。该评分可用于替代计算出的总体评分，因为它可以显示为文本，而非数字。\n\n在讨论此模块时，我们将解释每种评分类型。\n\
  \n在配置工作簿中需要做出的评分决策包括：\n\n- 是否显示计算出的总体评分？\n- 是否允许手动覆盖计算出的评分？\n- 是否使用总体绩效评论？\n- 评分发生在哪个步骤？\n\
  - 哪些后续步骤可以查看此模块？\n\n表单模板中总结模块的示例如图 7-44 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig44_HTML.jpg](img/499651_1_En_7_Fig44_HTML.jpg)\n\
  \n图 7-44  \n绩效总结模块\n\n#### 选项\n\n- *允许手动评分* 将在总结模块中创建一个评分录入项，可用于替代计算出的评分。手动评分将覆盖计算出的评分，并成为记录在案的评分。\n\
  - *权重* 用于定义在总体评分计算中使用的每个模块的权重。您可以等权重分配模块，或为每个评分模块定义百分比。这些权重总和必须为 100%，并将用于计算总体评分。权重百分比将显示在模块标签中。\n\
  - 如果您有希望从总体评分中排除的评分模块，请将权重设置为 0，但确保其余模块权重加起来为 100%。\n- *无法评分*，也称为“未评分评分”，在此处提供一个标签来表示不影响评分计算的非分数值，例如“入职时间过短无法评分”或“不适用”。如果已在“常规设置”中设置，则此项将已填充。\n\
  \n此模块使用在“常规设置”中确定的评分量表。这些评分的平均分以及每个模块的权重将显示在总结模块中，同时显示的还有一个计算出的总体绩效分数。您也可以允许管理者在此模块中手动输入员工的总体绩效评分。\n\
  \n\n\n让我们查看如图 7-45 所示的高级选项。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig45_HTML.jpg](img/499651_1_En_7_Fig45_HTML.jpg)\n\
  \n**图 7-45** 汇总部分高级选项\n\n各选项的说明见表 7-4。\n\n**表 7-4** 高级选项\n\n| 选项 | 说明 |\n| --- |\
  \ --- |\n| 允许覆盖未评级 | 与“手动评级”配合使用，允许在将表单发送到下一步骤时，用计算出的评级覆盖未评级的手动评级。 |\n| 显示部分评论 |\
  \ 创建一个汇总评论部分。 |\n| 启用“强制设定最高总分” | 根据目标或能力级别的最低分数，设定评分者可以选择的最大可能总分。防止评分者给出超出允许范围的更高分数。*更多信息，请参见\
  \ SAP 说明 #2077218。* |\n| 默认评级 | 未作选择时的评级值。可用于显示“选择评级”，以便用户知道需要输入评级。在保存评级前，此默认评级也会显示在总分显示块中。\
  \ |\n| 为评级字段选择备选标签 | 允许您更改汇总部分中的“表单整体评级”标签。但是，这在表单模板中不起作用，因此必须在表单模板 XML 中更新该标签。\
  \ |\n\n汇总部分需要设置“部分”、“字段”和“必填字段”的权限。\n\n需要授权的字段包括：\n\n- 部分评论\n- 计算出的整体评级\n- 手动整体评级\n\
  - 加权平均值\n\n**部分权限**  \n此部分应隐藏，直到经理进行评估时再显示。在此步骤中，经理将看到每个部分的评级。根据权重，各部分的评级将显示并计算出表单的整体评级。\n\
  \n一个绩效表单汇总部分的示例如图 7-46 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig46_HTML.jpg](img/499651_1_En_7_Fig46_HTML.jpg)\n\
  \n**图 7-46** 绩效管理表单上的汇总部分\n\n在上图所示的示例中，在“目标”和“能力”部分中设置了“在汇总部分显示”，因此汇总部分将包含每个目标和能力及其评级的条目。此外，还会显示该部分的评级。\n\
  \n**部分评级计算**  \n显示的部分评级按以下公式计算：  \n*∑*(条目评级 * 条目权重) / ∑(条目权重)  \n\n现在，我们准备逐步了解您可能使用的表单评级。\n\
  \n**计算出的表单整体评级**  \n此部分包含基于目标与能力条目评级以及各部分权重计算出的表单整体评级。  \n计算出的表单整体评级公式为：  \n*∑*(部分评级\
  \ * 部分权重) / ∑(部分权重)  \n\n要在此部分中看到此评级，`计算出的整体评级`字段应为任何需要看到此评级的角色和步骤设置`读取`权限。通常，如果您同时允许手动整体评级，并且它将覆盖计算出的评级，那么经理也将看到计算出的评级，但员工在后续任何步骤中都看不到。\
  \  \n如果条目的权重总和不为 100%，则在计算此分数时会进行归一化处理。\n\n> **注意**  \n> 要了解有关评级归一化的更多信息，请参见 SAP\
  \ 说明 #2078768。\n\n**手动表单整体评级**  \n经理可能希望将计算出的表单整体评级作为指导，但在分配整体评级时希望灵活考虑其他变量。由于计算出的整体评级不可编辑，因此汇总部分中可以使用手动表单整体评级。这允许经理覆盖计算出的表单评级。请确保在此部分中启用了“允许手动评级”，如图\
  \ 7-47 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig47_HTML.jpg](img/499651_1_En_7_Fig47_HTML.jpg)\n\
  \n\n\n### 启用手动总体评分\n\n使用手动总体评分时，手动总体表单评分将成为表单总体评分和记录评分。  \n管理器需要拥有“手动总体评分”的“写入”权限，才能输入手动评分。启用后，默认值为管理器的评分，并将其作为记录评分。由于这将成为表单总体评分，强烈建议在后续所有步骤中向员工隐藏计算出的表单评分。\n\
  \n### 调整后计算评分\n\n在“摘要”部分，可以使用与总体评分分数对应的调整评分量表。计算出的总体评分是数值型的，因此使用调整评分量表可以将评分文本标签映射到数值分数。此外，您还可以将一系列分数映射到特定分数，从而强制计算评分指向特定值。\
  \  \n此功能在评分显示为星形或圆形时无效；调整后的计算评分将以文本形式显示。要使用此功能，您需要允许总体评分，因为它会填充此字段且为只读。\n\n返回“常规设置”，然后点击“启用量表调整计算”，如图\
  \ 7-48 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig48_HTML.jpg](img/499651_1_En_7_Fig48_HTML.jpg)\n\
  \n**图 7-48** 启用量表调整计算\n\n您将看到一个复选框用于启用，如图 7-49 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig49_HTML.jpg](img/499651_1_En_7_Fig49_HTML.jpg)\n\
  \n**图 7-49** 启用量表调整计算复选框\n\n启用后，您可以设置量表中每个评分的值，如图 7-50 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig50_HTML.jpg](img/499651_1_En_7_Fig50_HTML.jpg)\n\
  \n**图 7-50** 设置量表调整计算的值\n\n该量表控制评分的计算或显示。如果您使用数值评分，可以将标签映射到分数。您可以设置最小和最大分数，以映射到量表中的一个评分。例如，如果计算评分为\
  \ 3.7，您可以决定将 3.51 到 4 之间的任何评分映射到评分 4，然后将调整后的评分标签显示为总体评分。\n\n启用此选项后，您可以显示调整后的评分标签（“映射到描述”字段）和/或调整后的评分值（“映射到分数”字段）。示例如图\
  \ 7-51 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig51_HTML.jpg](img/499651_1_En_7_Fig51_HTML.jpg)\n\
  \n**图 7-51** 设置量表调整计算的值\n\n第二个复选框“启用显示计算评分”启用后，将在“摘要”部分同时显示计算出的评分值。这意味着您将在该部分看到总体调整计算评分和总体计算评分。\
  \  \n在“常规设置”中配置调整量表后，该量表即可在“摘要”部分使用。  \n当未启用手动评分时，总体评分即为调整后的计算评分。没有单独的调整后计算评分需要授权，因此如果您启用了量表调整计算，则需读取的字段是“计算出的总体评分”。\n\
  \n记录评分按以下顺序确定：\n\n*   默认总体评分为计算出的总体表单评分。\n*   如果使用了调整后的计算评分，则其为总体表单评分。\n*   手动总体评分优先于所有其他评分。\n\
  *   管理器的评分为记录评分。\n\n### 评分量表外观\n\n*   默认评分量表为星形。\n*   如果使用星形的评分量表评分项超过七个，则量表变为下拉列表。\n\
  *   您可以在模板的高级设置中将星形更改为圆形。\n\n\n\n## 排版后的内容\n\n您可以使用评分标签显示评分等级。此设置在各个部分中完成。\n\n如果在每个评分部分使用星号或圆圈，则针对手动总体评分，评分等级将显示为星号或圆圈，但计算出的总体评分将是数字。\n\
  \n我们现在已经看到了绩效表单的典型组成部分。需要`目标`和`能力`部分才能输入项目评分、项目评论以及各部分的总体评论。`摘要`部分使用这些部分的评分及其部分权重来计算表单总体评分。如果已配置，经理可以创建手动总体表单评分，该评分将覆盖计算出的评分。在经理评估步骤之后，表单可能会进入校准环节、二级经理评审环节，或进入经理与员工之间的一对一讨论环节。在会议期间，当表单与员工共享时，`摘要`部分将显示并讨论评分。会议结束后，表单通常会流转给员工，以便他们确认讨论会议已进行。这就是我们接下来要查看的`签名`部分。\n\
  \n## 签名部分\n\n表单的最后一个部分是签名部分，如图 7-52 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig52_HTML.jpg](img/499651_1_En_7_Fig52_HTML.jpg)\n\
  \n*图 7-52 表单模板的签名部分*\n\n此部分用于电子签名，并显示表单签署的日期。一旦表单从“修改阶段”进入“签名阶段”，表单上唯一允许的输入项是签名评论。您可以使用`描述`字段创建文本，或添加签名前显示的图像或\
  \ URL。评论是可以添加到此部分的唯一字段。自定义字段不可用。需要为此部分设置部分权限和必填字段权限。仅当启用“包含评论”时，才能为部分评论设置必填字段权限。\n\
  \n关于部分权限，在准备好进行签名之前，`签名`部分应对所有步骤隐藏。如果可以添加签名评论，则该部分应在签名步骤中“启用”，并且您可以将评论设为必填。如果您不使用评论，则对于需要显示`签名`部分的步骤，该部分应被禁用。您可以在未启用部分权限的情况下签署表单。\n\
  \n提交后，表单会自动添加电子日期和签名。您可以在此阶段设置多个步骤，以获取多个签名，例如员工、经理和 HR 经理的签名。最终签名提交后，表单将进入所有路线图相关用户的`绩效已完成`文件夹。\n\
  \n图 7-53 显示了一个表单`签名`部分的示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig53_HTML.jpg](img/499651_1_En_7_Fig53_HTML.jpg)\n\
  \n*图 7-53 绩效表单的签名部分*\n\n从示例中可以看出，签名行之前有一些文本行。这些文本来自表单模板中的`描述`字段。当存在多个签名步骤时，“`[员工姓名]\
  \ 尚未签名`”将一直显示，直到后续签名步骤的用户提交表单为止。您可以在任何或所有签名步骤允许输入评论。\n\n现在我们已经了解了绩效表单模板最常用的部分，我们将回顾可能使用的其他摘要部分：`绩效潜力摘要`和`目标能力摘要`。此外，还有一个`自定义加权评分`部分。\n\
  \n## 目标能力摘要部分\n\n`目标能力摘要`部分提供了一些不同的总体评分以及一个表单总体评分。\n\n> **注意：** 术语“目标”和“目的”可互换使用。在本章中，我们一直将目标称为目的，但请理解标准的`目标能力摘要`部分可能被重命名为“目的能力摘要”。\n\
  \n`目标能力摘要`部分可以与我们刚刚了解的`摘要`部分一起使用，或者替代它使用。有一点值得注意：如果您没有继任管理许可证，您将无法使用此摘要部分类型，因为它依赖于继任管理矩阵评分。\n\
  \n`目标能力摘要`部分生成三个评分：\n\n1.  总体目标评分\n2.  总体能力评分\n3.  总体目标能力评分（“OCOC”）\n\n> **注意：**\
  \ `目标能力摘要`部分中的总体分数不支持按调整后的标尺计算评分。\n\n标准的`摘要`部分使用目标项和能力项评分来计算表单总体评分，而此部分则汇总能力项评分以计算总体能力评分，并汇总目标项评分以计算总体目标评分。\n\
  \n此部分还可以创建一个总体目标能力评分（“OCOC”），该评分基于这些总体分数以及为`目标`和`能力`部分配置的权重进行计算。此评分基于表单模板“常规设置”中标识的评分等级。如果两个摘要部分都在表单模板中，则`摘要`部分的总体分数将作为记录评分。如果您希望将“OCOC”评分作为记录评分，则应省略标准的`摘要`部分。\n\
  \n如前所述，此部分使用矩阵评分等级来计算总体目标和能力评分，而不是使用其他部分使用的常规绩效评分等级。这两个分数的交叉点可以绘制在“方式与内容”矩阵网格上。这些评分等级通常包含三个评分，以允许形成\
  \ 9 宫格评分。\n\n在表单模板中使用此摘要部分的好处是，可以创建在继任管理模块中使用的总体能力和总体目标评分。这些分数可用于矩阵网格报告、人才概况和仪表板\
  \ Portlet。\n\n如果您要将此摘要部分与标准的`摘要`部分一起使用，有一个重要的考虑因素。我们刚才提到，矩阵网格评分等级通常包含三个评分，以便构建 9\
  \ 宫格矩阵。如果您在总体能力和目标分数上使用三分制的矩阵评分等级，而在表单其余部分使用五分制，这将对报告和人才概况 Portlet 造成不一致。这将导致分数被“归一化”。\n\
  \n为了保持一致性，建议在表单评分等级和矩阵评分等级中使用相同数量的分数。如果您使用五分制评分等级，则您的矩阵评分等级也应包含五个分数。两个评分等级的标签不必相同。\n\
  \n您将在第 2 卷第 5 章中了解到更多关于矩阵网格评分等级以及如何配置 9 宫格矩阵的内容。我们将简要介绍这些功能，以便了解如何在绩效表单的`目标能力摘要`部分中使用这些等级。\n\
  \n您需要在 Provisioning 中配置“继任管理”；还需要启用“矩阵网格报告（9 宫格）”和“矩阵网格：方式与内容对比报告（9 宫格）”。\n\n请参考第\
  \ 2 卷第 5 章，了解如何配置评分等级和矩阵网格。\n\n既然我们已经介绍了矩阵评分等级和网格的概念，让我们回到模板来配置`目标能力摘要`部分：\n\n*\
  \   将“目标能力摘要”部分添加到表单模板。您可以移动它，使其出现在`签名`部分之前。\n\n\n\n*   我们可以使用此部分替代”摘要“（`Summary`）部分，并使用“OCOC”计算得分作为总体评级。如果是这种情况，请删除`Summary`部分；否则，常规`Summary`部分的总体评级将优先。\n\
  *   此部分可以作为`Summary`部分的补充，`Summary`部分的评级将作为记录评级。\n*   确保将要纳入总体得分的“目标”（`Goals`）和“能力”（`Competency`）部分已启用相关设置，以将其纳入总体目标或能力评级计算。\n\
  *   如果尚未为继任计划（`Succession`）设置配置目标与能力的矩阵网格评级量表，请先进行配置。建议使用与绩效评级量表相同数量的评级等级。\n*  \
  \ 如果计划在绩效表单的“目标能力摘要”（`Objective Competency Summary`）部分中显示图表，请配置“方式 vs. 结果”（`How\
  \ vs. What`）矩阵网格报告。\n\n在设置此部分时，需注意以下几点：\n\n*   确保表单模板未使用星号或圆圈作为评级符号。\n*   在“通用设置”（`General\
  \ Settings`）中，启用“隐藏数值型评级值（仅显示文本标签）”（`Hide numeric rating values (only show text\
  \ labels)`）。\n*   矩阵网格评级量表只能以下拉列表形式显示。\n*   虽然可以使用手动总体目标和能力评级，但建议不要这样做。\n\n表单模板的“目标能力摘要”（`Objective\
  \ Competency Summary`）部分如图 7-54 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig54_HTML.jpg](img/499651_1_En_7_Fig54_HTML.jpg)\n\
  \n**图 7-54** 目标能力摘要部分\n\n以下是一些关于哪个评级将成为记录评级的基本指南：\n\n1.  如果使用“OCOC”得分且同时包含总体`Summary`部分，则`Summary`部分的评级将作为记录评级。\n\
  2.  如果使用“OCOC”得分但未包含总体`Summary`部分，则“OCOC”评级将成为表单总体评级，并作为记录评级。\n3.  如果未为“目标能力摘要”部分或评级指定目标与能力部分的权重，则“OCOC”评级将为“未评级”（`unrated`）。\n\
  4.  如果使用“OCOC”得分且同时包含“绩效潜力摘要”（`Performance Potential Summary`）部分，则`Performance Potential\
  \ Summary`部分的评级将作为记录评级。\n\n此部分有一些设置需要在表单模板`XML`中进行配置，我们将在第 10 章中介绍。\n\n表 7-5 列出了此部分可选择的选项。\n\
  \n**表 7-5** 目标能力摘要部分选项\n\n| **选项** | **描述** |\n| --- | --- |\n| 包含部分评论（`Include\
  \ section comments`） | 可在部分底部添加评论，适用于进行评级的用户。 |\n| 计算总体能力评级（`Calculate overall competency\
  \ rating`） | 总体能力评级基于能力部分项目评级和部分权重计算得出。 |\n| 允许编辑总体能力评级：允许手动总体能力评级（`Allow overall\
  \ competency rating to be edited: allow manual overall competency rating`） | 此选项允许手动输入总体能力评级。编辑内容不会反映在表单的总体绩效评级中。\
  \ |\n| 计算总体目标评级（`Calculate overall objective rating`） | 总体目标评级基于目标部分项目评级和部分权重计算得出。\
  \ |\n| 允许编辑总体目标评级：允许手动总体目标评级（`Allow overall objective rating to be edited: allow\
  \ manual overall objective rating`） | 此选项允许手动输入总体目标评级。编辑内容不会反映在表单的总体绩效评级中。 |\n|\
  \ 显示总体目标能力评级（`Show overall objective competency rating`） | 即“OCOC”评级，是基于总体能力评级和总体目标评级计算得出的总体评级。\
  \ |\n| 显示总体目标能力评级矩阵（`Display overall objective competency rating matrix`） | 矩阵网格将显示在表单上，用于标识员工总体能力评级与总体目标评级相交的象限。\
  \ |\n| 总体评级显示顺序（`Overall Rating Display Order`） | 此选项不受支持。如果同时允许手动和计算得出的总体评级，无论选择何种顺序，手动评级始终显示在计算得出的评级之前。\
  \ |\n| 部分显示顺序：先显示能力再显示目标，或先显示目标再显示能力（`Section Display Order: show competencies than\
  \ objectives or objectives followed by competencies.`） | 决定在此部分中能力与目标的显示顺序。 |\n\n\
  “目标能力摘要”部分需要设置部分、字段和必填字段的权限。\n\n需要授权的字段包括：\n\n*   部分评论（`Section Comments`）\n*  \
  \ 能力手动总体评级（`Competency Manual Overall Rating`）\n*   目标手动总体评级（`Objective Manual Overall\
  \ Rating`）\n\n如果这些字段的权限设置为“无”（`None`），则部分将无评论，且仅使用计算得出的总体能力和总体目标评级。\n\n图 7-55 是一个绩效管理（PM）表单中“目标能力摘要”部分的示例。可以看出，总体能力评级由两个能力部分（角色特定能力和核心能力）组成，每个部分的权重不同。评级量表为三分矩阵量表。总体能力评级由两个能力部分评级组成。\n\
  \n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig55_HTML.jpg](img/499651_1_En_7_Fig55_HTML.jpg)\n\
  \n**图 7-55** 绩效管理表单中的目标能力摘要部分\n\n总体评级（“OCOC”）由三个部分评级乘以其占总分百分比后再求和得出。\n\n图 7-56 是展示目标与能力总体评级交叉点的矩阵网格。\n\
  \n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig56_HTML.jpg](img/499651_1_En_7_Fig56_HTML.jpg)\n\
  \n**图 7-56** 目标能力摘要部分的矩阵网格\n\n除非计划使用继任计划（`Succession`），否则此部分可能无需包含。\n\n## 绩效潜力摘要部分（`Performance\
  \ Potential Summary Section`）\n\n现在我们将讨论“绩效潜力摘要”部分。此部分用于创建手动总体绩效评级和手动总体潜力评级。这些得分会填充到继任计划矩阵网格中，常用于识别高潜力人才。\n\
  \n此部分的行为与“目标能力摘要”部分类似，但使用不同的评级量表。与“目标能力摘要”部分一样，使用继任计划矩阵网格评级。在此情况下，矩阵评级量表为“绩效”（`Performance`）和“潜力”（`Potential`）。两个得分用于矩阵网格，以显示两个评级之间的交叉点。与“目标能力摘要”部分类似，建议矩阵评级量表与表单评级量表中的评分等级数量保持一致。\n\
  \n“绩效潜力摘要”部分用于输入手动评级：\n\n1.  总体绩效评级（`Overall performance rating`）\n2.  总体潜力评级（`Overall\
  \ potential rating`）\n\n\n\n### 配置表现-潜力矩阵报告\n\n除了创建潜力矩阵评分量表和表现评分量表之外，还需要配置“表现-潜力”矩阵网格报告。有关此配置的更多信息，请参见第\
  \ 2 卷第 5 章。\n\n本节主要用于继任计划目的，特别是提名流程。如果您决定在本节中允许手动表现评分，则该评分将成为表单整体评分和记录评分。如果您在表单模板设置中启用了自定义评分计算，则该评分将成为记录评分。\n\
  \n与目标能力总结部分不同，本部分不支持计算的整体评分。您只能在本节中使用手动表现评分和潜力评分。此外，本部分不显示部分权重。\n\n当您在绩效表单模板中包含总结部分和表现-潜力总结部分时，来自表现-潜力总结部分的整体表现分数即为该表单的记录评分。\n\
  \n点击“添加新部分”并选择“表现-潜力总结”。表单模板中的表现-潜力总结部分如图 7-57 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig57_HTML.jpg](img/499651_1_En_7_Fig57_HTML.jpg)\n\
  \n**图 7-57** 表现-潜力总结部分\n\n由于本部分没有计算评分，因此其选项比目标能力总结部分少。\n\n以下列出了可用选项：\n\n- 包括部分评论\n\
  - 允许编辑整体表现评分\n- 允许编辑整体潜力评分\n- 显示整体表现-潜力矩阵\n- 部分显示顺序：表现/潜力 或 潜力/表现\n\n表现-潜力总结部分需要设置部分、字段和必填字段的权限。\n\
  \n允许的字段包括：\n\n- 部分评论\n- 手动表现整体评分\n- 手动潜力整体评分\n\n如果不允许手动评分，则本节将没有值。\n\n图 7-58 是绩效管理表单中表现-潜力总结部分的示例。\n\
  \n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig58_HTML.jpg](img/499651_1_En_7_Fig58_HTML.jpg)\n\
  \n**图 7-58** 绩效表单上的表现-潜力矩阵网格\n\n在此，经理选择来自矩阵网格评分量表的潜力和表现评分。两个数据点的交叉点显示在矩阵网格中。此信息也包含在员工档案和继任计划报告中。还有一个最终的整体评分部分可用。\n\
  \n### 自定义加权评分部分\n\n最后一个总结部分计算自定义加权整体评分。自定义加权评分基于不同步骤中的不同角色计算，给出一个手动整体评分（来自官方评分字段）。来自步骤和角色的评分和权重在业务规则中定义。另一条规则定义了用于计算整体加权评分的触发步骤。\n\
  \n该部分显示用于计算表单评分的用户和步骤的评分。也可以配置手动覆盖评分。\n\n计算出的表单评分基于在业务规则中指定的步骤和角色的评分和权重进行计算。您需要配置路由图中的哪个步骤触发计算。\n\
  \n> **注意**：管理员角色需要拥有创建业务规则的权限。\n\n点击“添加新部分”并选择“自定义加权评分”以将该部分添加到表单模板中。\n\n表单模板的自定义加权评分部分如图\
  \ 7-59 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig59_HTML.jpg](img/499651_1_En_7_Fig59_HTML.jpg)\n\
  \n**图 7-59** 表单模板中的自定义加权评分部分\n\n有一个选项允许手动评分覆盖计算出的评分。字段权限针对手动评分和计算评分设置。没有部分评论，也没有任何自定义或必填字段。\n\
  \n图 7-60 展示了绩效表单中自定义加权评分部分的示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig60_HTML.jpg](img/499651_1_En_7_Fig60_HTML.jpg)\n\
  \n**图 7-60** 绩效管理表单的自定义加权评分部分\n\n此示例显示了每个步骤中由哪个用户/角色给出的整体评分。创建了一个业务规则来确定基于角色和步骤的这些分数的权重。还创建了一个触发规则，用于确定应在哪个步骤计算最终评分。\n\
  \n业务规则标识了将在计算中使用的评分步骤。它定义了基于角色和步骤的这些评分的权重。\n\n图 7-61 是所创建的业务规则的示例。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig61_HTML.jpg](img/499651_1_En_7_Fig61_HTML.jpg)\n\
  \n**图 7-61** 加权评分业务规则\n\n在此示例中，来自评估步骤中经理角色的评分将占计算评分的 75%。来自人力资源审核步骤中人力资源经理角色的评分将占整体计算评分的\
  \ 25%。\n\n创建一个触发器以在表单计算中使用这些权重。触发规则的示例如图 7-62 所示。\n\n![../images/499651_1_En_7_Chapter/499651_1_En_7_Fig62_HTML.jpg](img/499651_1_En_7_Fig62_HTML.jpg)\n\
  \n**图 7-62** 计算整体评分的触发规则\n\n触发规则指定要使用的表单模板、应应用计算的步骤以及要使用的计算规则。在我们的示例中，整体表单评分计算将使用`Weight_Roles`计算规则，该规则应用于使用“2020\
  \ 自定义权重评分”表单模板启动的表单的人力资源审核步骤中。\n\n此总结部分使用计算出的整体评分和手动整体评分。计算出的整体评分在基于业务规则的步骤处触发。手动整体评分可由在表单模板权限中设置的步骤中的角色修改。\n\
  \n自 2020 年 H1 版本起，此总结部分现在可用于校准流程。\n\n我们现在已经了解了可用于绩效表单的各部分。我们学习了每个部分的用途，并了解了如何按角色和步骤为每个部分和字段设置权限。\n\
  \n## 结论\n\n在下一章中，我们将设置基于员工角色的权限，启用电子邮件通知，并启动绩效表单。我们还将涵盖管理员在绩效审核过程中可能执行的一些功能。\n\n"
- "# 8. 管理绩效管理表单\n\n既然我们已经启用了绩效管理并创建了表单模板，在启动绩效表单之前，我们还有几个步骤。我们将首先设置将在审核过程的各个步骤中发送给员工的电子邮件通知。我们还将设置员工、经理和人力资源经理基于角色的权限，以允许这些角色访问绩效管理。我们将决定任何路由图步骤的开始和截止日期，并学习如何立即启动表单或安排表单在稍后日期启动。我们将涵盖诸如删除和恢复表单、使表单对某些用户不可见、路由表单以及导入整体评分等主题。\n\
  \n## 电子邮件通知\n\n\n\n### 绩效评估表的电子邮件通知\n\n有一系列可启用的、特定于绩效评估表的电子邮件通知。通知会发送给与所需任务或操作相关联的用户。这些电子邮件是基于绩效评估表的流转或用户所需操作而触发的。与绩效评估表相关的电子邮件通知包括：\n\
  \n-   绩效评估表的创建、流转和完成\n-   步骤到期和步骤逾期通知\n-   请求反馈通知\n\n最常用的通知是流转通知和步骤到期通知。流转通知告知用户其绩效收件箱中有一份表格，有待他们处理。步骤到期通知提醒用户，表格仍在他们的收件箱中，并且需要在步骤到期日之前处理。在第\
  \ 6 章中，管理员角色已在角色的“管理员权限”部分的“管理系统属性”下，将权限设置为“`电子邮件通知模板设置`”。\n\n要查看所有可能启用的通知，请在搜索栏中输入并选择“`电子邮件通知模板设置`”。屏幕示例如图\
  \ 8-1 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig1_HTML.jpg](img/499651_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1：电子邮件通知\n\n请参阅表 8-1 了解可启用的与绩效相关的通知。\n\n#### 表 8-1：绩效评估表的电子邮件通知\n\n| 电子邮件\
  \ | 描述 | 收件人 |\n| --- | --- | --- |\n| 文档创建 | 在表单启动时创建，通知用户表单已在他们的绩效收件箱中。 | 第一步负责人\
  \ |\n| 文档流转 | 在表单已流转并进入用户收件箱时发送。 | “流转至”步骤的步骤负责人 |\n| 文档驳回 | 表单在签名阶段被驳回。 | 上一步骤的步骤负责人\
  \ |\n| 文档完成 | 表单已完成，并通知用户表单已在他们的“绩效完成”文件夹中。 | 流转路线中的所有角色，但如果启用，可选择其他收件人 |\n| 文档转发\
  \ | 当一份已完成的表单被转发到用户的“绩效完成”文件夹时，发送给该用户。 | 收到转发已完成表单的用户 |\n| 移除当前签署人 | 当签署人被从表单中移除时，发送给表单的当前签署人。\
  \ | 当前签署人 |\n| 文档流转步骤退出 | 当某个步骤完成时发送。 | 该步骤的步骤负责人 |\n| 文档删除 | 当文档被删除时发送。 | 可选择：经理；经理和雇员；经理、雇员和人力资源；以及整个流转链\
  \ |\n| 批量创建表单实例 | 当一组表单被启动时发送。 | 发送给启动这些表单的用户 |\n| 文档到期 | 发送提醒通知，告知表单即将到期。取决于表单模板高级设置中的默认到期日期以及到期前的默认天数。\
  \ | 步骤负责人 |\n| 文档逾期 | 使用表单模板高级设置中的默认到期日期以及到期后的默认逾期天数。 | 步骤负责人 |\n| 步骤到期 | 根据流转路线步骤中的到期日期和表单模板高级设置中设置的默认到期天数发送。\
  \ | 发送给临近步骤到期日的步骤负责人 |\n| 步骤逾期 | 一旦步骤逾期，根据流转路线步骤中的到期日期和表单模板高级设置中设置的默认逾期天数发送。 | 发送给已过步骤到期日的步骤负责人\
  \ |\n| 请求反馈 | 由经理在团队概览中发送，用于请求对其直接下属的反馈。 | 发送给被请求反馈者，并抄送给反馈请求者 |\n| 绩效评估启动经理通知 |\
  \ 经理会收到有关其员工已生成表单（包括表单到期日）的通知。表单的所有步骤及其开始和到期日期都会列出。 | 不再支持 |\n| 绩效评估流程更新（面向经理通知）\
  \ | 经理会收到关于自我评估和反馈请求状态的更新。如果表单的当前步骤没有指定到期日期，则此电子邮件通知将使用表单的到期日期。 | 不再支持 |\n\n单击电子邮件模板名称旁边的复选框以启用该通知。单击页面左侧的通知名称，以查看右侧的通知默认详细信息。您可以将通知优先级设置为高，并更新每种通知类型的电子邮件主题和正文。进行这些修改后，所有与该电子邮件模板关联的表单都将使用更新后的版本。\n\
  \n### 按模板自定义通知\n\n某些通知类型的电子邮件主题和正文可以自定义，以便为每个绩效评估表模板使用不同的措辞。可以自定义的通知列表如下：\n\n- \
  \  文档创建\n-   文档流转\n-   文档完成\n-   文档到期\n-   文档逾期\n-   步骤到期\n-   步骤逾期\n\n以下是一个使用步骤到期通知的示例。您可能希望为\
  \ 2020 年的绩效评估表的步骤到期通知设置特定的文本。而与此电子邮件通知类型关联的其他表单都应使用默认文本。\n\n这可以通过几个步骤完成：\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig2_HTML.jpg](img/499651_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2：按表单模板更新电子邮件\n\n1.  单击“`为每个表单指定不同模板`”右侧的复选框，如图 8-2 所示。对于上述列表中未提及的任何通知，此复选框将不会激活。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig3_HTML.jpg](img/499651_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3：自定义通知时的警告\n\n2.  将弹出一个窗口，警告用户与该通知关联的每个表单模板都可能需要手动更新。单击“`确定`”继续，如图 8-3 所示。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig4_HTML.jpg](img/499651_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4：选择要自定义的表单模板\n\n3.  在“`为每个表单指定不同模板`”下方，单击下拉列表，选择您希望为其创建自定义通知的 PM 表单模板。接着，单击“`更新设置`”按钮，如图\
  \ 8-4 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig5_HTML.jpg](img/499651_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5：创建自定义通知文本时的警告\n\n4.  屏幕将刷新，您会看到一条警告消息，提示该语言和表单模板组合没有对应的模板，如图 8-5 所示。\n\n\
  ![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig6_HTML.jpg](img/499651_1_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6：自定义通知\n\n5.  对此表单模板要使用的电子邮件主题、正文和文本进行任何修改，然后单击“`保存更改`”，如图 8-6 所示。\n\n现在，您已经为\
  \ 2020 年绩效评估示例表单模板的步骤到期通知创建了自定义通知。要查看此通知类型下其他任何表单模板的通知，请从下拉列表中选择另一个表单模板，然后单击“`切换至`”。页面将刷新，并显示所选表单的文本；除非该特定绩效评估表模板的文本已被更新，否则它将显示为默认文本。您可以为所选表单模板进行修改，然后单击“`保存更新`”。\n\
  \n### 令牌\n\n\n\n#### 通知与令牌\n\n通知使用从表单中提取数据的令牌。更新电子邮件通知内容时，您可以省略现有令牌，或根据需要添加任何令牌。常用令牌列表请参见表\
  \ 8-2。\n\n#### 表 8-2：常用令牌\n\n| 令牌 | 说明 |\n| --- | --- |\n| `[[COMPANY_NAME]]` |\
  \ 公司名称 |\n| `[[DOC_COMMENT]]` | 需要包含在电子邮件中的发件人备注 |\n| `[[DOC_COMPLETION_DATE]]`\
  \ | 表单完成日期 |\n| `[[DOC_DUE_DATE]]` | 表单截止日期 |\n| `[[DOC_LAST_MODIFIED]]` | 表单最后修改日期\
  \ |\n| `[[DOC_TITLE]]` | 表单名称 |\n| `[[EMP_NAME]]` | 主题对象全名 |\n| `[[EMP_USER_ID]]`\
  \ | 主题对象用户 ID |\n| `[[EMP_PASSWORD]]` | 主题对象密码 |\n| `[[IS_WAS_DUE_ON]]` | 表单截止日期（MM/DD/YYYY\
  \ 格式） |\n| `[[IS_WAS_DUE_ON_LONG]]` | 表单截止日期（月份用文本表示，例如：2020 年 8 月 12 日） |\n| `[[NO_OF_DAYS]]`\
  \ | 当前日期与表单截止日期之间的天数 |\n| `[[RECIPIENT_NAME]]` | 此文档的收件人全名 |\n| `[[RECIPIENT_USERNAME]]`\
  \ | 此文档的收件人用户名 |\n| `[[REVIEW_END_ON]]` | 审核结束日期 |\n| `[[SENDER]]` | 表单发送者名称 |\n\
  | `[SIGNATURE]]` | 签名 |\n\n为了防止表单在路由过程中用户添加备注，请从电子邮件正文中删除 `[DOC_COMMENT]`。\n\n###\
  \ 自定义通知设置\n\n部分电子邮件通知具有可自定义的设置。对于与通知关联的每个表单模板，都有设置来关闭通知、设置合并间隔，以及选择其他收件人来接收通知。\n\
  \n允许自定义设置的通知包括：\n\n- 文档创建\n- 文档路由\n- 文档退回\n- 文档转发\n- 文档完成\n- 文档删除\n\n这些通知将显示“为表单模板自定义设置”，如图\
  \ 8-7 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig7_HTML.jpg](img/499651_1_En_8_Fig7_HTML.jpg)\n\
  \n**图 8-7：** 为表单模板自定义设置\n\n点击此链接后，将弹出一个窗口，其中显示与通知关联的所有有效表单模板，如图 8-8 所示。此列表还将包含任何招聘和薪酬表单模板。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig8_HTML.jpg](img/499651_1_En_8_Fig8_HTML.jpg)\n\
  \n**图 8-8：** 自定义设置\n\n可以自定义的设置位于三列下：“已启用”、“合并和间隔”和“其他收件人”。要关闭任何表单模板的通知发送，请取消选中“已启用”列中的复选框。当“合并和间隔”启用时，所有此类型的通知将以单封电子邮件的形式发送给收件人。您还可以选择合并邮件的发送频率。选项为每\
  \ 1、2、4、6、8、12 或 24 小时。此设置对于拥有大量直接下属的管理者非常有用。例如，使用文档完成通知，管理者将收到一封列出已完成其绩效表单的直接下属的电子邮件，而不是为每个完成的表单单独接收一封电子邮件。每个表单模板的最后一个可自定义设置是添加其他收件人来接收通知。这允许添加不在路由图中的用户。\n\
  \n### 设置电子邮件发送选项\n\n对于某些没有设置自定义间隔选项的通知，有一个称为“设置电子邮件发送选项”的选项，如图 8-9 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig9_HTML.jpg](img/499651_1_En_8_Fig9_HTML.jpg)\n\
  \n**图 8-9：** 电子邮件合并选项\n\n启用此选项后，它将与页面底部的“合并电子邮件间隔（从凌晨 12:00 开始，以小时计）”配合使用。您可以在此处选择发送合并邮件的默认间隔，选项为\
  \ 1、2、4、6、8、12 或 24 小时，如图 8-10 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig10_HTML.jpg](img/499651_1_En_8_Fig10_HTML.jpg)\n\
  \n**图 8-10：** 设置发送合并电子邮件的间隔\n\n允许自定义设置的通知也具有此选项：\n\n- 文档创建\n- 文档路由\n- 文档退回\n- 文档完成\n\
  - 文档转发\n- 文档删除\n\n这些通知可以为特定的表单模板设置合并间隔。以下列出的通知为与该通知关联的所有表单模板设置合并间隔。\n\n这两个无法自定义但可以发送合并邮件的通知是：\n\
  \n- 步骤到期\n- 步骤逾期\n\n### 通知的后台作业计划\n\n有少数电子邮件通知需要安排后台作业才能生成通知。\n\n需要计划作业的绩效表单相关电子邮件通知包括：\n\
  \n- 文档到期\n- 文档逾期\n- 步骤到期\n- 步骤逾期\n\n需要计划的后台作业包括：\n\n- `Send Form Due Notification`\n\
  - `Send Form Late Notification`\n- `Send 360 Step Due Notification`\n- `Send 360\
  \ Step Late Notification`\n\n360 步骤到期和 360 步骤逾期通知作业适用于 PM 和 360 表单。\n\n要进行设置，请在预配置模块中，转到“管理计划作业”，如图\
  \ 8-11 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig11_HTML.jpg](img/499651_1_En_8_Fig11_HTML.jpg)\n\
  \n**图 8-11：** 管理计划作业\n\n接下来，转到“创建新作业”，如图 8-12 所示。在这里，我们将为这四个通知设置每日运行的作业。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig12_HTML.jpg](img/499651_1_En_8_Fig12_HTML.jpg)\n\
  \n**图 8-12：** 创建新作业\n\n单击“作业类型”下拉列表，从上述列表中找到作业名称。示例如图 8-13 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig13_HTML.jpg](img/499651_1_En_8_Fig13_HTML.jpg)\n\
  \n**图 8-13：** 选择作业类型\n\n在创建计划期间，为作业命名并设置其运行频率。对于每日运行的作业，应设置为“重复”。您可以设置为清晨运行，以便在步骤/表单到期后的清晨移动表单。完成输入后，保存作业并提交。这样可以确保作业从您选择的开始日期起开始运行。\n\
  \n> **注意：** 要了解有关如何设置后台作业的更多信息，请参阅 SAP 说明 #2212605。\n\n图 8-14 是步骤到期通知作业的示例，设置为每天凌晨\
  \ 5:51 运行。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig14_HTML.jpg](img/499651_1_En_8_Fig14_HTML.jpg)\n\
  \n**图 8-14：** 步骤到期通知计划作业\n\n要使此电子邮件通知在绩效表单位于用户收件箱且步骤已逾期时发送给该用户：\n\n- 在“电子邮件通知模板”中启用了“步骤到期通知”。\n\
  - 表单模板的路由图设置了步骤到期日期。\n- 表单模板在高级设置中设置了“默认到期通知日期（天）”。\n- 表单模板在高级设置中未禁用步骤退出通知。\n- 已计划后台作业每日运行。\n\
  \n图 8-15 是步骤到期通知的示例电子邮件。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig15_HTML.jpg](img/499651_1_En_8_Fig15_HTML.jpg)\n\
  \n**图 8-15：** 步骤到期通知\n\n\n\n## 绩效管理权限与路线图设置\n\n路线图将 8/18/20 设定为自我评估步骤的截止日期。模板的高级设置中，通知时间为截止日期前三天。员工在步骤截止日期前三天收到了这封邮件。\n\
  \n#### 基于角色的权限\n\n现在来设置用户访问绩效管理所需的基于角色的权限。我们从员工角色开始。\n\n#### 员工权限\n\n用户需要访问以下内容：\n\
  \n- `Home`（首页）菜单中的`Performance`（绩效）选项卡\n- 主页上的`To-Do`（待办事项）磁贴\n- 目标计划\n- 发展计划（如果在绩效表单中显示）\n\
  \n我们需要设置基于角色的权限，以便允许用户看到`Home`菜单中的`Performance`选项卡。在`Manage Permission Roles`（管理权限角色）中，打开员工角色，点击`Permission`（权限），然后进入：\n\
  \n- `User Permissions`（用户权限） ➤ `Performance`（绩效） ➤ `Performance Management Access`（绩效管理访问权限）\n\
  \n*请注意，即使没有此权限，如果用户在收件箱中有表单，仍然能看到`Performance`选项卡。*\n\n用户需要访问主页上的`To-Do`磁贴：\n\n\
  - `User Permissions`（用户权限） ➤ `Homepage v3 Tile Group Permission`（主页 v3 磁贴组权限） ➤\
  \ `Homepage v3 To-Do tile group`（主页 v3 待办事项磁贴组）\n\n以下内容适用于在表单模板中使用目标且尚未启用时：\n\n\
  - `User Permissions`（用户权限） ➤ `Goals`（目标） ➤ `Goal Management Access`（目标管理访问权限）\n\
  - `User Permissions`（用户权限） ➤ `Goals`（目标） ➤ `Goal Plan Permissions`（目标计划权限）（指定具体计划）\n\
  \n以下内容适用于在表单模板中使用发展计划且尚未启用时：\n\n- `User Permissions`（用户权限） ➤ `Career Development\
  \ Planning`（职业发展规划） ➤ `Career Development Plan (CDP) Access Permission`（职业发展计划访问权限）\n\
  - `User Permissions`（用户权限） ➤ `Goals`（目标） ➤ `Goal Management Access`（目标管理访问权限） ➤\
  \ `Goal Plan Permissions`（目标计划权限）（指定具体发展计划）\n\n#### 经理权限\n\n为了让经理能够创建或运行绩效相关的临时报告，请确保已启用报告权限。\n\
  \n在`Manage Permission Roles`（管理权限角色）中，打开经理角色，点击`Permission`（权限），然后进入`User Permissions`（用户权限）\
  \ ➤ `Reports Permission`（报告权限）。您可以包含：\n\n- `Ad Hoc Report Builder Standard Reports\
  \ Bin`（临时报告生成器标准报告库）（如果使用 EC）\n- `Report Center`（报告中心）\n- `Classic Reports`（经典报告）\n\
  - `Detail Report`（详细报告）\n- `List View`（列表视图）\n- `Analytics Tiles and Dashboards`（分析磁贴与仪表板）\n\
  - 选择任何与绩效相关的磁贴和仪表板。\n- `Create Report`（创建报告）\n- `Performance Management`（绩效管理）\n\
  - `Run Report`（运行报告）\n- 选择任何与绩效相关的磁贴和仪表板。\n\n同时，为经理角色授予`Performance Management`（绩效管理）访问权限和`Team\
  \ Overview Access`（团队概览访问权限）：\n\n- `User Permissions`（用户权限） ➤ `Performance`（绩效）\
  \ ➤ `Performance Management Access`（绩效管理访问权限）\n- `User Permissions`（用户权限） ➤ `Performance`（绩效）\
  \ ➤ `Team Overview Access`（团队概览访问权限）\n\n以下内容适用于在表单模板中使用目标且尚未启用时：\n\n- `User Permissions`（用户权限）\
  \ ➤ `Goals`（目标） ➤ `Goal Management Access`（目标管理访问权限）\n- `User Permissions`（用户权限）\
  \ ➤ `Goals`（目标） ➤ `Goal Plan Permissions`（目标计划权限）（指定具体计划）\n\n以下内容适用于在表单模板中使用发展计划且尚未启用时：\n\
  \n- `User Permissions`（用户权限） ➤ `Career Development Planning`（职业发展规划） ➤ `Career Development\
  \ Plan (CDP) Access Permission`（职业发展计划访问权限）\n- `User Permissions`（用户权限） ➤ `Goals`（目标）\
  \ ➤ `Goal Management Access`（目标管理访问权限） ➤ `Goal Plan Permissions`（目标计划权限）（指定具体发展计划）\n\
  \n#### 人力资源经理权限\n\n除了管理员可以生成表单外，您可能也决定允许人力资源经理创建表单。例如，您后续可能会创建一个用于绩效改进的混合绩效表单。在这种情况下，经理可以联系支持该团队的人力资源经理来生成表单。由人力资源经理来执行此任务，相比让管理员启动表单，可以为流程提供更高的保密性。\n\
  \n您可以为您刚刚为经理角色设置的相同权限，也为人力资源经理进行设置。与经理角色类似，您可以授予其报告访问权限。\n\n在`Manage Permission\
  \ Roles`（管理权限角色）中，打开人力资源经理角色，点击`Permissions`（权限），然后进入`User Permissions`（用户权限） ➤\
  \ `Reports Permission`（报告权限）。在`Reports Permission`选项中，您可以包含以下内容：\n\n- `Ad Hoc Report\
  \ Builder Standard Reports Bin`（临时报告生成器标准报告库）（如果使用 EC）\n- `Report Center`（报告中心）\n\
  - `Classic Reports`（经典报告）\n- `Detail Report`（详细报告）\n- `List View`（列表视图）\n- `Analytics\
  \ Tiles and Dashboards`（分析磁贴与仪表板）\n- 选择任何与绩效相关的磁贴和仪表板。\n- `Create Report`（创建报告）\n\
  - `Performance Management`（绩效管理）\n- `Run Report`（运行报告）\n- 选择任何与绩效相关的磁贴和仪表板。\n\n\
  与经理角色不同，还需要授予创建表单的权限：\n\n- `User Permissions`（用户权限） ➤ `General User Permission`（一般用户权限）\
  \ ➤ `Permission to Create Forms`（创建表单的权限）（指定要创建的表单）\n\n授予启动表单的权限：\n\n- `Administrator\
  \ Permissions`（管理员权限） ➤ `Manage Form Templates`（管理表单模板） ➤ `Mass Create Form Instances`（批量创建表单实例）（立即启动表单）\n\
  - `Administrator Permissions`（管理员权限） ➤ `Manage Form Templates`（管理表单模板） ➤ `Schedule\
  \ Mass Form Creation`（安排批量表单创建）（稍后启动表单）\n\n保存这些角色，接下来我们将讨论路线图。\n\n### 设置路线图日期\n\n\
  在启动绩效表单之前，我们需要在路线图中设置任何步骤的开始日期或截止日期。在搜索栏中输入并选择`Manage Route Maps`（管理路线图）。然后打开与将在表单启动中使用的绩效表单模板相关联的路线图。\n\
  \n通常情况下，人力资源部门会规划绩效评估周期中各步骤的日期。根据评估流程的开始和结束日期，您需要确认他们是否对流程的每个步骤使用了特定的时间窗口。有些公司会在年初设定目标，并保持表单的初始步骤开放，以便员工追踪进度和添加评论。然后他们会沟通年中检核步骤的日期。他们可能希望在某特定日期之前，阻止任何表单进入经理审阅环节。考虑到所有这些因素，您可以查看绩效周期日期，并判断是否需要向路线图添加步骤开始日期和截止日期。\n\
  \n最常用的是步骤开始日期和步骤截止日期，步骤退出日期则不太常见。您需要确认步骤开始日期是否会传达，以及开始日期是否会被强制执行。例如，当表单提前启动，而您不希望员工此时进入并编辑表单时，可以使用步骤开始日期的强制执行功能。在步骤开始日期之前，他们将只有只读访问权限。\n\
  \n另一个重要决策涉及步骤退出日期。如果用户在步骤截止日期前没有完成其收件箱中的表单，您是否希望该表单自动流转到下一个步骤？如果是这样，您需要设置一个步骤截止日期，并在路线图步骤中启用`Automatic\
  \ send on due date`（截止日期自动发送）选项。\n\n如图 8-16 所示，路线图的第一个步骤定义了步骤截止日期。当启用`Automatic\
  \ send on due date`（截止日期自动发送）选项时，会显示两个附加选项：\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig16_HTML.jpg](img/499651_1_En_8_Fig16_HTML.jpg)\n\
  \n**图 8-16** 配置步骤日期\n\n- **Only send forms that pass validation**（仅发送通过验证的表单）：如果此步骤中存在必填字段，则不将表单向前移动。此选项可用于需要输入评级等必填项的步骤。通过验证的表单将向前移动；有错误的表单则不会。\n\
  - **Always send regardless of validation**（无论验证结果如何始终发送）：无论步骤中是否存在必填字段，表单都会自动流转到下一步。\n\
  \n\n\n## 使用自动路由功能\n\n当表单处于没有必填字段的步骤时，使用自动路由功能可能会有所帮助。例如，在流程的早期阶段，您可能希望员工在表单上输入备注。与其通过运行报告来追踪员工在流程中的位置，不如让表单在截止日期自动路由。\n\
  \n如果您打算使用步骤日期，并非每个步骤都需要设置。这也适用于`截止日期自动发送`和步骤开始日期强制执行。您可以为某个步骤设置开始日期，为另一个步骤设置带有自动路由的步骤退出日期。只需确保没有步骤日期重叠，以免导致表单卡住。\n\
  \n使用自动移动选项时请务必谨慎。例如，您的路由图在某些早期步骤中未启用`截止日期自动发送`，但在后续步骤中启用了此选项。处于早期步骤的表单不会自动前进。尚未到达自动路由步骤的表单在该步骤到期时也不会被自动路由。这意味着任何尚未到达自动路由步骤的表单都不会被自动路由。对于某个步骤，自动路由仅基于该步骤的截止日期执行一次。如果表单在截止日期之后才到达自动路由步骤，则不会执行自动路由。只有处于设置了截止日期且启用了自动路由的步骤中的表单才会被移动到下一步。\n\
  \n如果您已设置任何自动路由步骤，则需要安排一个每日运行的后台作业来处理路由。我们接下来将介绍这部分内容。\n\n### 调度自动路由步骤到期后台作业\n\n\
  在本章前面部分，我们讨论了电子邮件通知的设置以及步骤到期和步骤逾期通知所需的后台作业。如果您正在使用自动路由选项，那么启用步骤到期日期的电子邮件通知也是合理的，这可以提醒用户在表单移动之前完成该步骤。\n\
  \n正如我们之前讨论的，如果您计划发送步骤到期通知，需要在表单模板的高级模板设置中启用通知，开启电子邮件通知，并设置好后合作业。\n\n自动路由过程也需要一个后台作业。此作业将在步骤到期日后的第二天，按照作业中设定的时间移动表单。\n\
  \n要设置此作业，请进入`配置`，转到`管理计划作业` ➤ `创建新作业`，如图 8-17 所示，然后设置`自动路由步骤到期文档`计划作业。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig17_HTML.jpg](img/499651_1_En_8_Fig17_HTML.jpg)\n\
  \n**图 8-17** 创建新后台作业\n\n点击`作业类型`字段中的向下箭头，找到`基于截止日期自动路由`。为作业命名并设置执行频率。应设置为`定期`以每日运行。您可以将运行时间设置在清晨，这样表单就会在步骤到期后的清晨被移动。保存作业并提交。这将确保作业从您选择的开始日期起开始运行。\n\
  \n已创建作业的示例如图 8-18 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig18_HTML.jpg](img/499651_1_En_8_Fig18_HTML.jpg)\n\
  \n**图 8-18** 步骤截止日期自动路由作业\n\n> **注意：** 有关在路由图中使用日期的更多信息，请参阅 SAP 注释 #2087333。\n\n\
  ### 路由图上的相对截止日期\n\n可以在路由图上使用相对日期来表示开始日期、退出日期和截止日期。\n\n相对日期让您可以根据另一个活动之前或之后的天数来指定开始、退出或截止日期。\n\
  \n为了在路由图上使用相对日期，必须在`配置`中进行设置。为此，请转到`公司设置`并启用此选项：`为表单路由启用相对日期`。\n\n启用后，您的路由图将显示`为表单路由使用相对日期`选项，如图\
  \ 8-19 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig19_HTML.jpg](img/499651_1_En_8_Fig19_HTML.jpg)\n\
  \n**图 8-19** 使用相对日期的选项\n\n选中后，您将看到一个弹出警告：`更改此选项将重置您的路由图日期设置。是否继续？`示例如图 8-20 所示。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig20_HTML.jpg](img/499651_1_En_8_Fig20_HTML.jpg)\n\
  \n**图 8-20** 使用相对日期时的警告消息\n\n选择`继续`。将出现一条说明，指出当启用相对日期时，不允许重新排序路由图中步骤的位置。\n\n您会注意到路由图上的步骤开始、步骤退出和步骤截止日期选项现已更改。一个示例路由图如图\
  \ 8-21 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig21_HTML.jpg](img/499651_1_En_8_Fig21_HTML.jpg)\n\
  \n**图 8-21** 在路由图上设置相对截止日期\n\n您将无法再选择固定日期。相反，路由步骤日期将相对于所选日期选项之前或之后的天数而定。\n\n对于路由步骤日期，您需要选择`之后`或`之前`并指定天数。根据您设置的是哪种日期（开始、退出或截止）以及选择的是天数`之前`还是`之后`，可用的日期选择选项会有所不同。示例如图\
  \ 8-22 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig22_HTML.jpg](img/499651_1_En_8_Fig22_HTML.jpg)\n\
  \n**图 8-22** 相对日期选项\n\n下拉列表中可能显示的可选选项包括以下内容：\n\n- `表单创建日期`\n- `表单截止日期`\n- `同一步骤开始日期`\n\
  - `同一步骤截止日期`\n- `同一步骤退出日期`\n- `前一步骤退出日期`\n- `前一步骤截止日期`\n\n在设置相对日期时，您不会看到所有这些选项；选项基于您正在设置的路由步骤日期类型，以及该日期是所选日期的`之前`还是`之后`。\n\
  \n设置步骤开始日期和截止日期的示例如图 8-23 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig23_HTML.jpg](img/499651_1_En_8_Fig23_HTML.jpg)\n\
  \n**图 8-23** 设置第一个步骤的日期\n\n对于此路由图的第一个步骤，强制步骤开始日期设置为表单创建日期后的 10 天。该步骤在步骤开始日期后的 30\
  \ 天到期。\n\n## 待办事项磁贴\n\n在启动表单之前，我们还有一项设置任务。\n\n在主页上，待办事项面板中会显示一个与绩效管理相关的待办事项磁贴。用户需要执行的任何与绩效相关的操作都将显示在此磁贴中。示例如图\
  \ 8-24 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig24_HTML.jpg](img/499651_1_En_8_Fig24_HTML.jpg)\n\
  \n**图 8-24** 主页上的待办事项面板\n\n此待办事项磁贴上的项目可能来自路由给用户的绩效表单。示例如图 8-25 所示。需要操作的项目包含一个链接，可将用户引导至所需操作或表单以完成任务。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig25_HTML.jpg](img/499651_1_En_8_Fig25_HTML.jpg)\n\
  \n**图 8-25** 绩效相关的待办事项\n\n\n\n管理员也可以向磁贴中添加补充待办事项。在第 6 章中，我们讨论了一些可授予的可选管理员权限。如果尚未完成，管理员角色需要拥有更新待办事项磁贴的权限。在搜索栏中输入并选择“管理权限角色”。打开管理员角色并添加以下权限。在“管理员权限”部分下，找到“管理用户”，然后选择“待办事项管理员”和“管理主页”。保存角色，然后我们可以继续。\n\
  \n要设置此磁贴，请在搜索栏中输入并选择“管理主页”。接下来，单击“待办事项设置”，如图 8-26 所示。您将看到所有可以更新的选项。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig26_HTML.jpg](img/499651_1_En_8_Fig26_HTML.jpg)\n\
  \n**图 8-26**  \n待办事项设置\n\n#### 常规设置\n\n单击“常规设置”，如图 8-27 所示。在这里，我们可以更改待办事项显示的默认日期。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig27_HTML.jpg](img/499651_1_En_8_Fig27_HTML.jpg)\n\
  \n**图 8-27**  \n常规设置\n\n设置项包括：\n\n*   待处理项目\n*   隐藏补充项目\n*   隐藏逾期项目\n\n这些设置用于确定待处理的待办事项何时显示，以及补充待办事项或逾期项目是否可以在指定天数后隐藏。请注意，此处的任何更改都将影响所有待办事项磁贴。\n\
  \n### 重命名待办事项磁贴\n\n此外，在“待办事项设置”下，您可以重命名“审阅绩效”待办事项磁贴，如图 8-28 所示。更改“显示名称”列中的标签。\n\n\
  ![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig28_HTML.jpg](img/499651_1_En_8_Fig28_HTML.jpg)\n\
  \n**图 8-28**  \n重命名待办事项磁贴\n\n### 显示/隐藏待办事项磁贴\n\n接下来，我们需要确保已启用*绩效管理*的待办事项磁贴。此设置也在“待办事项设置”中。单击“显示/隐藏待办事项磁贴”，将弹出一个窗口，如图\
  \ 8-29 所示。确保“审阅绩效”设置为显示。如果没有，请将其更改为“是”并保存。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig29_HTML.jpg](img/499651_1_En_8_Fig29_HTML.jpg)\n\
  \n**图 8-29**  \n启用“审阅绩效”待办事项磁贴\n\n### 补充待办事项\n\n您还可以添加补充待办事项。例如，如果您没有使用步骤到期电子邮件通知，您希望提醒员工其绩效评估的自我评估步骤即将到期。\n\
  \n在“待办事项设置”中单击“补充待办事项”，将弹出一个窗口，如图 8-30 所示。选择附加待办事项将驻留的磁贴，为该“待办事项”设置一个名称及其到期日期。您还需要确定哪个角色会看到此附加待办事项。在此示例中，一个待办事项将驻留在“审阅绩效”待办事项磁贴中，标签为“完成自我评估”，并附带到期日期。员工角色将看到该项目。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig30_HTML.jpg](img/499651_1_En_8_Fig30_HTML.jpg)\n\
  \n**图 8-30**  \n添加一个与绩效相关的补充待办事项\n\n图 8-31 显示了用户“审阅绩效”待办事项磁贴中一个补充待办事项的示例。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig31_HTML.jpg](img/499651_1_En_8_Fig31_HTML.jpg)\n\
  \n**图 8-31**  \n补充待办事项\n\n如果用户单击“我已完成”，该项目将从其待办事项列表中移除。\n\n此部分需要考虑的事项如下：\n\n*  \
  \ 待办事项列表使用路线图步骤描述，而非路线图步骤名称。\n*   待办事项使用步骤到期日期。如果没有步骤到期日期，该待办事项将在磁贴中显示“无到期日期”。\n\
  *   待办事项按到期日期排序，然后按字母顺序排列。\n*   如果待办事项具有相同的路线图步骤名称和相同的步骤到期日期，它们将组合在待办事项磁贴中。\n\n\
  我们现在已经完成了启动表单所需的所有设置和配置，那么让我们开始吧！\n\n### 启动表单\n\n我们现在将启动基于表单模板的表单。我们将确定使用哪个表单模板，为哪些员工以及在何时创建绩效表单。启动表单的角色将需要在*管理员权限*中的*管理表单模板*下拥有基于角色的权限“批量创建表单实例”和“计划批量创建表单”。\n\
  \n此外，该角色还需要拥有创建表单的权限。通常，管理员角色能够创建任何表单，因为已经授予了所有表单的权限。但是，如果您希望某个角色只能启动特定的表单，请在该角色的权限中，转到用户权限\
  \ ➤ 常规用户权限 ➤ 创建表单的权限，如图 8-32 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig32_HTML.jpg](img/499651_1_En_8_Fig32_HTML.jpg)\n\
  \n**图 8-32**  \n创建表单的权限\n\n您需要单击“其他”单选按钮，并选择该角色可以创建的特定表单。保存更新，然后我们将开始启动流程。\n\n在搜索栏中输入并选择“启动表单”。“启动表单”屏幕如图\
  \ 8-33 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig33_HTML.jpg](img/499651_1_En_8_Fig33_HTML.jpg)\n\
  \n**图 8-33**  \n选择要启动的表单模板\n\n在初始的“启动表单”屏幕上，选择要生成的表单类型，然后选择表单模板。模板类型下拉列表中的选项包括“全部”、360\
  \ 或绩效管理。选择“绩效管理”。基于选择的类型为“绩效管理”，“表单模板”下拉列表将包含用户有权创建的所有活动绩效模板。\n\n选择表单后，将显示有关所选表单模板的信息，如图\
  \ 8-34 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig34_HTML.jpg](img/499651_1_En_8_Fig34_HTML.jpg)\n\
  \n**图 8-34**  \n表单模板信息\n\n将显示表单模板描述、路线图、评分量表、模板部分和最后修改日期。在此启动步骤中，您可以预览表单模板或取消启动。如果取消，您将返回到“管理模板”中的表单模板以进行编辑。\n\
  \n### 启动日期\n\n单击“下一步”将进入启动流程的步骤 1。步骤 1 如图 8-35 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig35_HTML.jpg](img/499651_1_En_8_Fig35_HTML.jpg)\n\
  \n**图 8-35**  \n步骤 1，启动的“启动日期”步骤\n\n此步骤允许您进行一次性启动，立即启动或选择稍后日期。或者，启动可以根据选定的标准重复进行。我们将研究这两种选项。\n\
  \n#### 一次性启动\n\n此选项仅生成一次表单。您可以立即启动表单，或选择特定的启动日期。出于我们的目的，我们将选择“现在”，但您也可以选择将来的日期。\n\
  \n#### 定期计划\n\n另一种选项启用定期启动。此选项用于您希望根据特定的基于日期的标准重复批量创建表单的情况。在启动时符合标准的员工将生成一个表单。\n\
  \n有三个与日期相关的选项可供选择：\n\n\n\n"
- '# 1.  入职日期：选择入职后的天数，以启动表单。


  例如，新员工入职时间尚短，不足以参与年度评审流程，因此你可以创建一份新员工试用期表单，用于评价其进展或作为设定目标的框架。在所选天数过后，将为新员工启动其试用期表单。


  '
- '# 2.  周年日期：选择周年纪念日之前或之后的天数，以启动表单。


  如果贵组织按照员工的入职周年日期进行绩效评估，而非所有员工采用统一的评审周期，则可以使用此选项。


  '
- "# 3.  根据所选月份数（1、3、6 或 12）启动表单，与入职日期或周年日期无关。\n\n例如，如果你选择在入职日期后 90 天启动表单，那么任何距离今天入职日期正好满\
  \ 90 天的员工，今天都会生成一份表单。明天，则任何距离当天入职日期满 90 天的员工会在那时生成表单，以此类推。定期计划启动会根据当前日期，查看所选的天数/月数或年数，从而确定今天哪些人会生成表单。\n\
  \n要使用这些选项中的任何一个，都需要设置每天运行的后台作业。该每日作业会运行，检查当天符合条件的人员，并为这些用户生成表单。我们将在启动表单讨论的最后部分对此进行说明。\n\
  \n选择其中一个选项后，你需要指明定期计划作业应开始运行的日期。点击`“下一步”`进入第 2 步。\n\n## 评审周期\n\n启动流程的第 2 步用于定义进行评审的时间段。有四个选项可供选择，如图\
  \ 8-36 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig36_HTML.jpg](img/499651_1_En_8_Fig36_HTML.jpg)\n\
  \n**图 8-36** 启动流程的第二步：评审周期步骤\n\n### 评审周期选项\n\n1.  **为表单配置的日期：** 日期来自表单模板高级设置中的默认开始日期、结束日期和到期日期。\n\
  2.  **上一个日历年：** 使用上一日历年的 1 月 1 日作为开始日期，12 月 31 日作为结束日期。\n3.  **本日历年：** 使用当前年的 1\
  \ 月 1 日作为开始日期，12 月 31 日作为结束日期。\n4.  **自定义：** 你自行选择评审周期的开始和结束日期。\n\n选项 2、3 和 4 还需要为已完成的表单设置到期日期。点击`“下一步”`进入启动流程的第\
  \ 3 步。\n\n## 选择员工\n\n在启动流程的第 3 步，你将选择为其生成表单的用户。界面示例如图 8-37 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig37_HTML.jpg](img/499651_1_En_8_Fig37_HTML.jpg)\n\
  \n**图 8-37** 启动流程的选择员工步骤\n\n有多个选项可供选择：\n\n*   **截至启动日期的所有在职员工**\n*   **一位员工** –\
  \ 按姓名搜索，并可继续逐个添加用户\n*   **员工组**\n\n有两种选项可与所选员工配合使用：\n\n1.  你可以选择包含非在职员工。这适用于除已排除非在职员工的动态组之外的任何员工选项。\n\
  2.  仅当用户在选定日期范围内没有现有表单时，才为其创建表单。\n\n选择`“员工组”`将展开该区域，显示更多可供选择的组选项，如图 8-38 所示。\n\n\
  ![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig38_HTML.jpg](img/499651_1_En_8_Fig38_HTML.jpg)\n\
  \n**图 8-38** 为表单启动选择员工组\n\n*   **动态组：** 使用或复制现有动态组，或创建一个新的动态组以供使用。\n*   **共享组：**\
  \ 如果你正在使用共享组，请选择此单选按钮，然后从下拉列表中查找共享组。\n\n\n\n### 上传 CSV 文件：导入一个包含用户 ID 的 CSV 文件。该文件中的所有用户\
  \ ID 都将生成一份表单。\n\n### 按筛选条件查找员工：点击此选项，您将看到可供选择的筛选条件。\n\n请注意，您选择中包含的员工取决于您的目标人群和启动日期。做出选择后，点击“下一步”继续下一个启动步骤。有关创建组群的更多信息，请参阅\
  \ SAP 说明 `#2088248`。\n\n## 编辑介绍文本\n\n如果您在表单模板中设置了自定义板块，并启用了“在批量创建中编辑介绍文本描述”，您将看到一个额外的步骤，如图\
  \ 8-39 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig39_HTML.jpg](img/499651_1_En_8_Fig39_HTML.jpg)\n\
  \n**图 8-39** 更新自定义介绍文本\n\n启用后，在此处输入的文本将显示在表单自定义板块的顶部。\n\n## 摘要\n\n启动流程中的“摘要”部分，如图\
  \ 8-40 所示，会显示之前所有步骤的选择结果。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig40_HTML.jpg](img/499651_1_En_8_Fig40_HTML.jpg)\n\
  \n**图 8-40** 启动的摘要步骤\n\n任何或所有步骤的决策都可以更改。点击任意部分的“更改”，它将带您回到相应的步骤，您可以在启动前进行任何编辑。然后，您需要逐步浏览启动屏幕，直到返回“摘要”步骤。\n\
  \n“摘要”屏幕上还有两个复选框：\n\n- **向表单收件人发送电子邮件通知**：路由流程中的第一个人将收到表单已创建的通知。该表单将出现在用户的“绩效收件箱”中，并且在其主页的“绩效”磁贴中会有一个“待办事项”项目。如果“文档创建”电子邮件通知已启用，但此选项未勾选，则不会生成电子邮件。\n\
  \n建议启用此选项，以便在审核流程开始时，路由流程中的第一个用户能知道表单何时进入其收件箱。对于后续步骤，系统将发送路由邮件，告知用户表单已进入其收件箱，等待他们处理。\n\
  \n- **创建在途副本**：启动表单的用户会将其表单副本发送到其“在途”表单文件夹。如果启动表单的管理员勾选了此选项，他们将会收到大量表单，因此不建议使用。\n\
  \n进行任何更改或启用选项后，点击“启动”，将显示一个确认弹出窗口，如图 8-41 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig41_HTML.jpg](img/499651_1_En_8_Fig41_HTML.jpg)\n\
  \n**图 8-41** 启动确认\n\n点击“确定”后，您将看到“完成”步骤，如图 8-42 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig42_HTML.jpg](img/499651_1_En_8_Fig42_HTML.jpg)\n\
  \n**图 8-42** 启动的完成步骤\n\n如果您尚未启用“批量创建表单实例”通知，并且想确认启动已完成，请记下“完成”步骤中列出的作业 ID，然后点击“监控作业”。\n\
  \n“批量创建表单作业监控器”将在一个弹出屏幕中显示。点击“筛选”旁边的展开图标，如图 8-43 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig43_HTML.jpg](img/499651_1_En_8_Fig43_HTML.jpg)\n\
  \n**图 8-43** 批量创建表单作业监控器\n\n继续点击“刷新”按钮，直到看到您已启动表单的作业 ID，如图 8-44 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig44_HTML.jpg](img/499651_1_En_8_Fig44_HTML.jpg)\n\
  \n**图 8-44** 刷新直至作业完成\n\n\n\n一旦您看到任务 ID 且任务状态为“已完成”，则表示您已成功启动绩效表单！关闭弹出窗口，然后关闭启动页面。\n\
  \n在启动的“启动日期”步骤中，当我们选择了循环表单启动时，我们简要提到了需要设置后台任务。使用与设置邮件通知运行任务相同的步骤。进入 `Provisioning`，转到\
  \ `Manage Scheduled Jobs` ➤ `Create New Job`，然后创建“计划表单创建”。将任务计划为每天运行。图 8-45 显示了一个示例。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig45_HTML.jpg](img/499651_1_En_8_Fig45_HTML.jpg)\n\
  \n**图 8-45** 循环表单启动的后台任务\n\n**注意**\n\n有关管理计划评审的更多信息，请参阅 SAP 说明 #2076115；要了解有关批量启动表单的更多信息，请参阅\
  \ SAP 说明 #2601584。\n\n## 附加管理员功能\n\n一旦评审周期开始，管理员就可以忙于设置报表和仪表盘，并将“绩效历史”Portlet 添加到人员档案中。接下来我们将介绍这些功能。\n\
  \n## 报表\n\n在这里，我们将介绍一些可用的绩效管理相关报表。作为经理和 HR 经理角色权限设置的一部分，我们授予了他们对标准报表、仪表盘和即席查询报表的访问权限。\n\
  \n### 标准报表\n\n对于我们将要查看的报表，经理和 HR 经理角色需要能够访问经典报表和列表视图报表。要验证角色是否拥有这些权限，请在搜索栏中键入并选择“管理权限角色”。选择要检查权限的角色。在\
  \ `User Permissions` 部分中，找到“报表权限”，然后选择“经典报表”和“列表视图”。保存角色。\n\n在这里，我们将查看经典报表和列表视图报表。当用户拥有报表访问权限时，它将出现在主页菜单中，如图\
  \ 8-46 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig46_HTML.jpg](img/499651_1_En_8_Fig46_HTML.jpg)\n\
  \n**图 8-46** 主页菜单\n\n从主页菜单中，选择“报表”。如果显示了报表中心视图，请单击“切换到经典视图”，如图 8-47 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig47_HTML.jpg](img/499651_1_En_8_Fig47_HTML.jpg)\n\
  \n**图 8-47** 报表中心\n\n标准报表将列出，如图 8-48 所示。请注意，根据权限，您可能看不到所显示的所有报表。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig48_HTML.jpg](img/499651_1_En_8_Fig48_HTML.jpg)\n\
  \n**图 8-48** 经典报表\n\n在左侧面板上，报表按类别分组。选择“按类型显示所有报表”以查看如图 8-49 所示的视图。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig49_HTML.jpg](img/499651_1_En_8_Fig49_HTML.jpg)\n\
  \n**图 8-49** 按类型显示的报表\n\n绩效相关报表包括：\n\n*   表单列表\n*   逾期文档\n*   表单状态摘要\n*   评级摘要\n\
  \n图 8-50 是表单列表的示例。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig50_HTML.jpg](img/499651_1_En_8_Fig50_HTML.jpg)\n\
  \n**图 8-50** 表单列表报表\n\n此报表列出用户的当前表单。每一行还显示与绩效表单关联的表单模板、表单状态、当前步骤、到期日期以及表单是否已完成。管理员可以运行此报表以在整个组织内进行报告。如果由\
  \ HR 经理运行，该报表将仅包含其支持的员工。如果由经理运行，该报表将仅包括向其汇报的下属及其以下级别的员工。\n\n## 仪表盘\n\n有一些可从 SuccessStore\
  \ 添加的标准绩效相关仪表盘。我们将简要介绍执行此操作的过程。\n\n在搜索栏中键入并选择“管理仪表盘”。如图 8-51 所示，单击“管理标准仪表盘”和“YouCalc\
  \ 文件”。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig51_HTML.jpg](img/499651_1_En_8_Fig51_HTML.jpg)\n\
  \n**图 8-51** 管理仪表盘\n\n接下来，单击“从 SuccessStore 添加标准仪表盘”。在这里，您将看到所有可从 SuccessStore 获取的仪表盘和磁贴。如图\
  \ 8-52 所示，有绩效相关的磁贴和仪表盘。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig52_HTML.jpg](img/499651_1_En_8_Fig52_HTML.jpg)\n\
  \n**图 8-52** 绩效相关仪表盘和磁贴\n\n标准的绩效相关磁贴包括：\n\n*   绩效表单分布\n*   绩效表单状态\n*   绩效表单逾期\n\
  *   总体绩效评级分布\n\n添加后，转到“操作”列并点击“编辑”，如图 8-53 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig53_HTML.jpg](img/499651_1_En_8_Fig53_HTML.jpg)\n\
  \n**图 8-53** 编辑磁贴\n\n要使磁贴在主页上可用，请转到“可用性”选项卡并选择“主页”，如图 8-54 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig54_HTML.jpg](img/499651_1_En_8_Fig54_HTML.jpg)\n\
  \n**图 8-54** 在主页上启用\n\n保存磁贴。对每个添加的磁贴执行此操作。接下来，在搜索栏中键入并选择“管理主页”。在这里，我们将确保磁贴可见。找到绩效磁贴。将磁贴从“存储库”或“未使用”选项卡移动到“默认”选项卡，如图\
  \ 8-55 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig55_HTML.jpg](img/499651_1_En_8_Fig55_HTML.jpg)\n\
  \n**图 8-55** 将磁贴移至默认选项卡\n\n将它们与其他经理相关磁贴一起放入“我的团队”版块。图 8-56 显示了一个示例。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig56_HTML.jpg](img/499651_1_En_8_Fig56_HTML.jpg)\n\
  \n**图 8-56** 添加到“我的团队”的磁贴\n\n保存更新。只要经理角色启用了分析磁贴和仪表盘，他们就会在主页上看到这些内容。所需的权限如图 8-57\
  \ 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig57_HTML.jpg](img/499651_1_En_8_Fig57_HTML.jpg)\n\
  \n**图 8-57** 管理员的磁贴和仪表盘权限\n\n可能显示在经理主页上的绩效相关磁贴示例如图 8-58 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig58_HTML.jpg](img/499651_1_En_8_Fig58_HTML.jpg)\n\
  \n**图 8-58** 经理主页上的绩效磁贴\n\n还有一些可用的标准绩效仪表盘：\n\n*   绩效仪表盘\n*   绩效和能力仪表盘\n\n请注意，绩效仪表盘包含一个用于“绩效与潜力”的磁贴。如果您未在表单模板中使用“绩效潜力摘要”部分，此磁贴将为空白且无法移除。同样，如果您的表单模板不评估能力，请不要使用绩效和能力仪表盘。仪表盘可以共享，这使用户能够在报表中心内生成仪表盘。\n\
  \n**注意**\n\n要了解有关仪表盘和磁贴的更多信息，请参阅 SAP 说明 #2536495。\n\n## 即席查询报表\n\n管理员可以创建供自己使用的报表，也可以创建可供其他用户运行的共享报表。\n\
  \n\n\n### 绩效管理报表\n\n创建临时报表时，需要选择“绩效管理”作为域，如图 8-59 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig59_HTML.jpg](img/499651_1_En_8_Fig59_HTML.jpg)\n\
  \n**图 8-59** 绩效管理报表的域\n\n向导会逐步引导您完成报表的创建。示例如图 8-60 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig60_HTML.jpg](img/499651_1_En_8_Fig60_HTML.jpg)\n\
  \n**图 8-60** 创建临时报表的步骤\n\n使用向导创建临时报表时，在“人员”选项卡上，选择“已登录用户”以及管理员应有权访问的级别数量。示例如图 8-61\
  \ 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig61_HTML.jpg](img/499651_1_En_8_Fig61_HTML.jpg)\n\
  \n**图 8-61** 选择报表类型\n\n如果已授予绩效管理数据的临时报表创建权限，HR 管理员和/或部门主管即可为其目标群体创建临时报表。例如，当部门主管运行此报表时，结果将只包含其团队成员。\n\
  \n作为管理员，您可以创建可供 HR 管理员和部门主管使用的临时报表，以便他们为其目标群体运行报表。这可通过共享报表来实现，如图 8-62 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig62_HTML.jpg](img/499651_1_En_8_Fig62_HTML.jpg)\n\
  \n**图 8-62** 共享临时报表\n\n然后，您可以选择与谁共享该报表。报表可按角色共享，如图 8-63 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig63_HTML.jpg](img/499651_1_En_8_Fig63_HTML.jpg)\n\
  \n**图 8-63** 按角色共享报表\n\n可被纳入报表的字段有很多，如图 8-64 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig64_HTML.jpg](img/499651_1_En_8_Fig64_HTML.jpg)\n\
  \n**图 8-64** 绩效表单字段\n\n> **注意：** 要了解更多关于临时报表的信息，请参阅 SAP 说明 #2536445。\n\n## 人员档案中的绩效相关模块\n\
  \n如果在数据模型中配置并启用了绩效评级背景元素，这些元素可以显示在人员档案中。通常，这些元素会出现在档案的“人才档案”部分，只有员工和部门主管可以查看。其中部分模块可能仅允许部门主管查看。\n\
  \n对于数据模型中的任何评级背景元素，请确保相应的角色拥有查看权限。在角色设置中，通过“用户权限”➤“员工数据”进入“背景元素”部分。在图 8-65 中，正在为部门主管角色授予“绩效历史面板”的查看权限。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig65_HTML.jpg](img/499651_1_En_8_Fig65_HTML.jpg)\n\
  \n**图 8-65** 授予“绩效历史面板”的查看权限\n\n保存角色后，需要将该模块添加到人员档案中。\n\n在搜索栏中输入并选择“配置人员档案”。从屏幕的“可用模块”部分找到“绩效历史面板”，然后将其拖放到屏幕左侧的“人才档案”部分，如图\
  \ 8-66 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig66_HTML.jpg](img/499651_1_En_8_Fig66_HTML.jpg)\n\
  \n**图 8-66** 将“绩效历史面板”添加到人员档案\n\n为模块创建的子部分命名，如图 8-67 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig67_HTML.jpg](img/499651_1_En_8_Fig67_HTML.jpg)\n\
  \n**图 8-67** 为子部分命名\n\n\n\n## 排版的 Markdown 文本\n\n## 图 8-67  \n#### 为人才资料板块的子板块命名\n\
  \n您可以重命名该板块，如图 8-68 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig68_HTML.jpg](img/499651_1_En_8_Fig68_HTML.jpg)\n\
  \n## 图 8-68  \n#### 重命名绩效历史板块\n\n如果您的模板包含“绩效潜力摘要”板块或“目标胜任力摘要”板块，这些板块可以被允许并配置为也显示在个人资料中。在下一章中，您将看到用户资料中的板块。\n\
  现在我们已经了解了如何报告绩效数据，接下来我们将探讨管理员在评审周期中可能需要执行的一些管理功能。\n\n#### 删除表单\n\n在某些情况下，可能需要删除表单。例如，可能需要启动一个新表单，从而删除原有表单。在搜索栏中键入并选择\
  \ `Delete Form`。您将看到多种删除表单的方式。示例如图 8-69 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig69_HTML.jpg](img/499651_1_En_8_Fig69_HTML.jpg)\n\
  \n## 图 8-69  \n#### 删除表单\n\n可以根据用户或表单属性进行高级搜索。此外，还可以上传包含文档 ID 的文件。所有符合条件表单都将显示；您可以选择一个、多个或全部进行删除。示例如图\
  \ 8-70 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig70_HTML.jpg](img/499651_1_En_8_Fig70_HTML.jpg)\n\
  \n## 图 8-70  \n#### 选择要删除的表单\n\n#### 恢复表单\n\n在某些情况下，可能为已离职但现已返岗的用户删除了表单，或是表单被意外删除。与“删除表单”操作类似，表单也可以恢复。\n\
  在搜索栏中键入并选择 `Restore Form`。示例如图 8-71 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig71_HTML.jpg](img/499651_1_En_8_Fig71_HTML.jpg)\n\
  \n## 图 8-71  \n#### 恢复表单\n\n高级搜索选项基于用户属性或表单属性。符合搜索条件的表单将显示，您可以选择要恢复的表单。表单将恢复到其被删除时的步骤。\n\
  \n## 隐藏文档可见性\n\n可以隐藏对用户可见的表单。例如，某位经理拥有其直接下属 2016 年至 2019 年的绩效表单副本。这些表单位于其 `Performance\
  \ Completed` 文件夹中。该经理转岗为个人贡献者，不应再访问这些表单。我们希望这些表单不再出现在该用户的 `Performance Completed`\
  \ 文件夹中。这可以通过隐藏文档对用户的可见性来实现。此操作不会删除表单，也不会影响拥有表单副本的其他用户。此功能适用于用户 `Performance En Route`\
  \ 或 `Completed` 文件夹中的表单。它不会隐藏用户收件箱中的表单。\n如果管理员角色尚未获得相应权限，则需要获取权限才能执行此操作。在搜索栏中键入并选择\
  \ `Manage Permission Roles`。选择要添加权限的角色。在 `Administrator Permissions` 部分中找到 `Manage\
  \ Documents`，然后选择 `Manage Document Visibility`。保存该角色。\n\n现在我们来隐藏一份文档。在搜索栏中键入并选择\
  \ `Manage Document Visibility`。屏幕示例如图 8-72 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig72_HTML.jpg](img/499651_1_En_8_Fig72_HTML.jpg)\n\
  \n## 图 8-72  \n#### 管理文档可见性\n\n要定位需要隐藏的特定表单，有三种选项：\n\n*   按用户\n*   按文档 ID\n*   按\
  \ CSV 上传\n\n根据所选单选按钮，所需的输入项会有所不同。\n我们将逐一查看每个选项。\n\n##### 按用户\n\n\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig73_HTML.jpg](img/499651_1_En_8_Fig73_HTML.jpg)\n\
  \n**图 8-73**  \n按用户移除文档可见性\n\n- 为了隐藏一个用户的表单，使其对另一个用户不可见。\n- 要移除文档可见性，需要具有可见性的用户和文档主体。示例如图\
  \ 8-73 所示。\n\n在该示例中，列出了经理`George Hill`拥有的所有关于`Jada Baker`的表单。管理员可以选择任意或全部表单，从`George`的可见性中移除。选择后，点击“Remove\
  \ Visibility”（移除可见性）。将显示一个确认弹窗，如图 8-74 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig74_HTML.jpg](img/499651_1_En_8_Fig74_HTML.jpg)\n\
  \n**图 8-74**  \n确认文档可见性移除\n\n点击“OK”（确定）后，将显示表单名称以及失去可见性的用户。示例如图 8-75 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig75_HTML.jpg](img/499651_1_En_8_Fig75_HTML.jpg)\n\
  \n**图 8-75**  \n表单已成功隐藏\n\n##### 按文档 ID 隐藏\n\n表单可基于文档 ID 进行隐藏。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig76_HTML.jpg](img/499651_1_En_8_Fig76_HTML.jpg)\n\
  \n**图 8-76**  \n按文档 ID 移除可见性\n\n- 为了隐藏一个用户的表单，使其对另一个用户不可见。\n- 要移除文档可见性，需要文档 ID 和具有表单可见性的用户。示例如图\
  \ 8-76 所示。\n\n此选项的工作方式与按用户移除表单相同。选择文档 ID 和具有可见性的用户。搜索结果显示后，选择表单并移除可见性。当确认弹窗出现时，点击“OK”（确定）以隐藏文档。该表单将不再对所选用户可见。\n\
  \n##### 按 CSV 上传\n\n可以通过文件上传来移除文档可见性，具体方式如下：\n\n- 进行批量移除表单可见性。\n- 为多个用户隐藏多个表单。\n\
  - 提供两种文件模板：按角色或按用户 ID。\n\n点击“by CSV Upload”（通过 CSV 上传）按钮，您将能够下载一个用于上传的文件模板。示例如图\
  \ 8-77 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig77_HTML.jpg](img/499651_1_En_8_Fig77_HTML.jpg)\n\
  \n**图 8-77**  \n下载用于文档可见性移除上传的模板\n\n您可以下载“By Roles”（按角色）模板或“By User ID”（按用户 ID）模板。\n\
  \n“By Roles”模板使用表单 ID 和用户角色。一个包含条目的示例如图 8-78 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig78_HTML.jpg](img/499651_1_En_8_Fig78_HTML.jpg)\n\
  \n**图 8-78**  \n“按角色”模板\n\n“By Roles”模板使用表单 ID 和用户在路线图中的角色。这基于用户在表单路线图中的角色。  \n\
  “By User ID”模板使用表单 ID 和用户 ID。用户 ID 是您希望为其隐藏表单的员工 ID。  \n两种上传的方法相同。我们将通过用户 ID 进行上传。\n\
  \n“By User ID”模板的示例如图 8-79 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig79_HTML.jpg](img/499651_1_En_8_Fig79_HTML.jpg)\n\
  \n**图 8-79**  \n用于隐藏表单可见性的用户 ID 文件\n\n在文件中，您可以输入多个表单 ID 及对应的用户 ID。您可以选择对多个用户隐藏同一个表单。\
  \  \n保存 CSV 文件后，选择该文件并上传。\n\n屏幕将刷新。如果文件没有问题，您将看到“Success”（成功），并且文件中的表单列表将显示出来。选择要隐藏的表单，然后点击“Remove\
  \ Visibility”（移除可见性），如图 8-80 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig80_HTML.jpg](img/499651_1_En_8_Fig80_HTML.jpg)\n\
  \n\n\n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig80_HTML.jpg`\n\n**图 8-80**\
  \ 所选表单的可见性\n\n此时将显示确认弹出窗口；确认后，这些表单将被隐藏。\n\n表单隐藏后，您将看到已隐藏的表单名称和用户名。示例如图 [8-81] 所示。\n\
  \n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig81_HTML.jpg`\n\n**图 8-81** 表单已被设为不可见\n\
  \n请注意，如果您移除了所有有权访问表单的用户的文档可见性，系统将删除该文档。现在我们已经了解了如何隐藏表单，接下来学习如何恢复隐藏的表单。\n\n### 恢复文档可见性\n\
  \n任何隐藏的文档都可以恢复其可见性。此操作位于`管理文档可见性`屏幕底部。可以通过输入文档 ID 逐个恢复文档。点击`列出已移除的用户`，所有失去该文档可见性的用户都会显示出来。示例如图\
  \ [8-82] 所示。\n\n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig82_HTML.jpg`\n\
  \n**图 8-82** 恢复文档可见性\n\n选择用户，随后将显示确认弹出窗口。确认后，表单即被恢复。\n\n屏幕将显示表单 ID 以及已恢复表单的用户。示例如图\
  \ [8-83] 所示。\n\n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig83_HTML.jpg`\n\
  \n**图 8-83** 文档已恢复\n\n该表单将被恢复至隐藏前所在的`绩效`文件夹中的用户。\n\n## 路由表单\n\n作为管理员，您可能需要将表单移至上一步或下一步。这可以针对单个表单或多个表单执行。路由表单需要依次操作一系列屏幕。在搜索栏中输入并选择`路由文档`，我们将从这里开始操作。屏幕示例如图\
  \ [8-84] 所示。\n\n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig84_HTML.jpg`\n\
  \n**图 8-84** 路由表单\n\n您首先需要搜索表单，然后选择表单，最后决定如何路由该表单。根据在`搜索方式`下拉列表中选择的搜索类型，您将拥有不同的搜索选项，下文将对此进行说明。\n\
  \n### 按表单 ID 搜索\n\n选中此选项时，搜索选项包括输入单个表单的文档编号，或上传包含多个表单 ID 的 CSV 文件。此方法允许您为多个用户以及单个表单移动表单。\n\
  \n### 按表单模板搜索\n\n选中此选项时，您可以搜索所有表单模板，包括非活跃的模板。选中后，您可以进一步通过用户或表单属性来定义搜索。还有其他搜索选项，如图\
  \ [8-85] 所示。\n\n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig85_HTML.jpg`\n\
  \n**图 8-85** 为特定模板选择一组表单\n\n当您需要移动同时启动的大量表单时，此选项非常有用。例如，您可能决定跳过年中评估步骤，直接将表单移至年终评估。此方法即可完成移动。选择表单组后，表单将按步骤显示，如图\
  \ [8-86] 所示。\n\n`../images/499651_1_En_8_Chapter/499651_1_En_8_Fig86_HTML.jpg`\n\
  \n**图 8-86** 按步骤选择表单\n\n您可以取消选择任何步骤中的表单，从而仅针对特定一个或多个步骤中的表单。然后，您将能够选择所选步骤中的哪些表单需要移动。\n\
  \n\n\n### 按员工文件夹搜索\n\n此搜索用于识别员工及搜索其“我的表单”文件夹。示例如图 8-87 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig87_HTML.jpg](img/499651_1_En_8_Fig87_HTML.jpg)\n\
  \n**图 8-87** 按员工文件夹搜索\n\n此搜索用于查找单个用户的表单。\n\n### 按主题用户搜索\n\n最后一种搜索类型是按用户名搜索。你也可以按用户或表单属性进行搜索。此搜索用于查找单个用户的表单。示例如图\
  \ 8-88 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig88_HTML.jpg](img/499651_1_En_8_Fig88_HTML.jpg)\n\
  \n**图 8-88** 按主题搜索\n\n此搜索用于为单个用户流转表单。\n\n选定表单后，必须选择流转选项。示例如图 8-89 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig89_HTML.jpg](img/499651_1_En_8_Fig89_HTML.jpg)\n\
  \n**图 8-89** 流转选项\n\n根据当前步骤，你可以将表单向前或向后移动一步，移动到特定步骤，或移动到新步骤。选中的单选按钮将提供不同的选项。\n\n\
  将表单向前移动一步的示例如图 8-90 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig90_HTML.jpg](img/499651_1_En_8_Fig90_HTML.jpg)\n\
  \n**图 8-90** 将表单向前移动一步\n\n选项包括*更改原因*、*表单验证选项*和*通知选项*。如果你希望包含必填字段的表单向前移动，应选择“跳过表单验证”。位于包含未填写必填项的步骤中的表单将被流转。如果启用了流转电子邮件通知，你需要决定是否发送流转通知。\n\
  \n单击单选按钮查看可选选项。确定流转选项后，单击“下一步”，流转将开始执行。摘要页面将显示结果，如图 8-91 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig91_HTML.jpg](img/499651_1_En_8_Fig91_HTML.jpg)\n\
  \n**图 8-91** 表单流转确认\n\n至此，您已成功移动了绩效表单。\n\n### 修改流转路线图\n\n我们已了解如何将表单流转到其他步骤。现在，我们将学习如何更改已启动表单的流转路线图。假设您正处于绩效评估周期中，并且在路线图中使用了步骤截止日期。现已决定延长输入评级的期限。这需要更改已启动表单的步骤截止日期。无需删除表单并重新开始，可以更改路线图上任何步骤的截止日期。\n\
  \n路线图修改的四个选项如下：\n\n1.  **修改通用选项。** 更改路线图标签的文本；更改步骤日期。\n2.  **更改步骤类型和权限。** 针对特定步骤，更改其类型和权限。\n\
  3.  **添加步骤。** 为选定表单的路线图添加一个步骤。\n4.  **删除步骤。** 从选定表单的路线图中移除一个步骤。\n\n首先，在搜索栏中输入并选择“修改表单流转路线图”。屏幕示例如图\
  \ 8-92 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig92_HTML.jpg](img/499651_1_En_8_Fig92_HTML.jpg)\n\
  \n**图 8-92** 修改表单流转路线图页面\n\n您将看到与流转表单相同的“搜索方式”选项。下拉列表显示的选项如图 8-93 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig93_HTML.jpg](img/499651_1_En_8_Fig93_HTML.jpg)\n\
  \n**图 8-93** 搜索选项\n\n根据搜索类型的不同，有不同的搜索条件：\n\n*   **表单 ID：** 选择表单 ID。\n*   **表单模板：**\
  \ 选择模板，您还可以添加按用户和模板属性的搜索。\n*   **员工文件夹：** 选择员工姓名和文件夹（`全部`、`收件箱`、`流转中`或`已完成`）。\n\
  *   **主题用户：** 选择员工姓名，您还可以添加按用户和模板属性的搜索。\n\n根据搜索条件，您可以选择单个表单或多个表单。在我们的示例中，我们将修改一组表单的步骤截止日期。我们将按模板名称进行搜索。更改路线图步骤日期是该工具最常见的用途。我们将详细介绍此类更改，并简要提及其他选项。\n\
  \n#### 更改步骤截止日期\n\n选择模板并选择该模板的表单组，如图 8-94 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig94_HTML.jpg](img/499651_1_En_8_Fig94_HTML.jpg)\n\
  \n**图 8-94** 选择表单组\n\n单击“选择”以查看所选模板的已启动表单组，如图 8-95 所示。组是在单次启动期间创建的表单。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig95_HTML.jpg](img/499651_1_En_8_Fig95_HTML.jpg)\n\
  \n**图 8-95** 选择表单\n\n选择组后，单击“完成”，弹出窗口将关闭，组信息将被填充，如图 8-96 所示。单击“搜索”。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig96_HTML.jpg](img/499651_1_En_8_Fig96_HTML.jpg)\n\
  \n**图 8-96** 搜索表单\n\n选择所有表单，然后单击“下一步”，如图 8-97 所示。这将更改该组中所有表单的步骤截止日期。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig97_HTML.jpg](img/499651_1_En_8_Fig97_HTML.jpg)\n\
  \n**图 8-97** 选择所有表单\n\n选择后，将显示选项，如图 8-98 所示。选择“修改通用选项”并单击“下一步”。这将允许我们更改步骤截止日期。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig98_HTML.jpg](img/499651_1_En_8_Fig98_HTML.jpg)\n\
  \n**图 8-98** 选择一个操作\n\n与所选表单模板关联的路线图将显示出来，如图 8-99 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig99_HTML.jpg](img/499651_1_En_8_Fig99_HTML.jpg)\n\
  \n**图 8-99** 更新路线图\n\n在此处，我们将更改步骤截止日期，如图 8-100 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig100_HTML.jpg](img/499651_1_En_8_Fig100_HTML.jpg)\n\
  \n**图 8-100** 更新步骤截止日期\n\n单击“下一步”，将显示摘要屏幕，如图 8-101 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig101_HTML.jpg](img/499651_1_En_8_Fig101_HTML.jpg)\n\
  \n**图 8-101** 更新摘要\n\n摘要将显示已更改和未更改表单的数量。您已成功更新一组已启动表单的步骤截止日期。我们将简要了解其他三个选项。\n\n\
  #### 更改步骤类型和权限\n\n使用四种“搜索方式”之一识别将更新路线图的表单后，您将选择路线图更改类型。从下拉列表中，您将选择与表单模板关联的路线图中的步骤，如图\
  \ 8-102 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig102_HTML.jpg](img/499651_1_En_8_Fig102_HTML.jpg)\n\
  \n**图 8-102** 选择一个步骤\n\n\n\n选择后，屏幕将显示将要修改的表单数量。图 8-103 展示了一个示例。请注意，更改仅适用于尚未进入所选步骤的表单。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig103_HTML.jpg](img/499651_1_En_8_Fig103_HTML.jpg)\n\
  \n**图 8-103** 待更新的表单\n\n点击“下一步”后，路线图将会显示，并且要更新的步骤将高亮显示。您将能够对路线图进行修改，如图 8-104 所示。完成后点击“下一步”。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig104_HTML.jpg](img/499651_1_En_8_Fig104_HTML.jpg)\n\
  \n**图 8-104** 更新路线图步骤\n\n将显示一个摘要屏幕，其中包含已更改和未更改的表单数量。\n\n### 添加步骤\n\n选择要更新的表单后，在向导的“选择操作”步骤中，您将选择“添加步骤”。路线图随即打开，您可以添加一个步骤，如图\
  \ 8-105 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig105_HTML.jpg](img/499651_1_En_8_Fig105_HTML.jpg)\n\
  \n**图 8-105** 添加步骤的路线图\n\n将显示一个弹出窗口，您可以在此命名该步骤，如图 8-106 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig106_HTML.jpg](img/499651_1_En_8_Fig106_HTML.jpg)\n\
  \n**图 8-106** 向路线图添加步骤\n\n在此示例中，在“经理确认”之后添加了一个额外的签名步骤。如图 8-107 所示，更改摘要会显示出来。\n\n\
  ![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig107_HTML.jpg](img/499651_1_En_8_Fig107_HTML.jpg)\n\
  \n**图 8-107** 更改摘要\n\n现在，您已为所选表单的路线图添加了一个步骤。\n\n### 移除步骤\n\n更新活动表单路线图的最后一个选项是删除一个步骤。\n\
  \n搜索并找到要修改的表单后，选择“移除步骤”，如图 8-108 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig108_HTML.jpg](img/499651_1_En_8_Fig108_HTML.jpg)\n\
  \n**图 8-108** 选择路线图更改类型\n\n从下拉菜单中，您将选择要移除的步骤。选择该步骤后，将要修改的表单数量会显示出来，如图 8-109 所示。\n\
  \n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig109_HTML.jpg](img/499651_1_En_8_Fig109_HTML.jpg)\n\
  \n**图 8-109** 待修改的表单\n\n删除后，“摘要”页面将显示已更改和未更改的表单数量，如图 8-110 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig110_HTML.jpg](img/499651_1_En_8_Fig110_HTML.jpg)\n\
  \n**图 8-110** 更改摘要\n\n至此，我们已经了解了更新活动表单路线图的各种方式。接下来，我们来看一个可用于已启动表单的附加管理工具。\n\n##\
  \ 导入总体评分\n\n在某些情况下，您可能需要将总体绩效评级加载到绩效表单中。例如，您已经在旧版系统中启动了审核流程，现在正转换为 SAP SuccessFactors\
  \ 绩效管理模块。部分员工已获得评级，您希望将这些评级加载到新的 SAP SuccessFactors 绩效表单中。另一个例子涉及 SAP SuccessFactors\
  \ 薪酬模块。绩效表单的评级会被加载到薪酬工作表中，用于做出加薪和奖金决策。您可能没有运行绩效周期，但薪酬团队需要这些绩效评级。您可以创建一个简单的绩效模板，其中包含一个用于输入手动总体评级的“摘要”部分。导入文件可以将评级加载到这些表单中，然后薪酬模块便可在工作表中使用这些评级。\n\
  \n管理员角色需要具备导入评分的权限。基于角色的导入评分权限可以添加到管理员角色的权限中。该权限位于“管理员权限”下，通过**管理文档** > **导入总体评分**进行授予。\n\
  \n在搜索栏中输入并选择“导入总体评分”。导入评分屏幕的示例如图 8-111 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig111_HTML.jpg](img/499651_1_En_8_Fig111_HTML.jpg)\n\
  \n**图 8-111** 导入总体评分\n\n使用的导入文件非常简单。请记住以下要点：\n\n- 应为 CSV 文件。\n- 文件必须包含标题行。\n- 第一列的标题必须是\
  \ `DOCUMENT_ID`。这是用户绩效表单的唯一标识符。您可以通过查看单个表单上的“信息”图标轻松找到此编号。但是，要批量上传评分，您可以运行临时查询来获取特定模板的文档\
  \ ID。\n- 绩效模板必须包含一个带有手动总体评级字段的“摘要”部分。\n- 在评级加载中使用与模板中相同的评级量表。\n- 评级可以包含小数。\n\n可为绩效、绩效潜能、目标和能力摘要部分导入手动总体绩效评级分数。\n\
  \n在导入评级之前，所有将加载评级的表单都需要移至可以输入手动评级的步骤。请参阅本章前面的“路由表单”部分。\n\n手动总体评级分数的列标题为：\n\n- `PERFORMANCE`\n\
  - `POTENTIAL`\n- `COMPETENCY`\n- `OBJECTIVE`\n\n示例文件如图 8-112 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig112_HTML.jpg](img/499651_1_En_8_Fig112_HTML.jpg)\n\
  \n**图 8-112** 示例导入绩效评级文件\n\n在示例中，正在为列出的文档 ID 加载绩效评级。使用的是数字评分。\n\n仅包含要加载的评级类型的列。导入后，系统将生成一封包含导入结果的电子邮件。示例如图\
  \ 8-113 所示。\n\n![../images/499651_1_En_8_Chapter/499651_1_En_8_Fig113_HTML.jpg](img/499651_1_En_8_Fig113_HTML.jpg)\n\
  \n**图 8-113** 示例导入邮件\n\n成功完成加载后，打开文件中列出的任意表单，您将在“摘要”部分看到总体评级。\n\n\n\n## 结论\n\n我们已经将绩效管理基本原则中学到的知识付诸实践。我们设置了电子邮件通知，确定了用户角色所需的基于角色的权限，配置了路线图中的步骤日期，并设置了一些后台作业。最后，我们介绍了一些绩效管理管理员在评审过程中可能执行的简单管理操作。\n\
  \n通过以上实践，我们对配置决策、权限设置以及已启用功能如何影响表单工作方式有了更深入的理解。在下一章中，我们将从用户的角度逐步介绍绩效评估表单。\n\n"
- "# 9. 使用绩效管理表单\n\n在前三章中，我们配置了绩效管理，授予了基于角色的权限，并创建了评级量表、路线图和绩效表单模板。我们了解了表单模板的各个部分，并看到了绩效管理管理员可以执行的任务类型。最后，我们启动了一个绩效表单。在本章中，我们将从用户的角度逐步介绍绩效评估流程。\n\
  \n## 绩效表单操作指南\n\n表单启动后，如果启用了“文档创建”电子邮件通知，则评审流程第一步中的用户将收到通知，告知绩效表单已在其绩效收件箱中。\n\n\
  图 9-1 显示了一个示例通知。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig1_HTML.jpg](img/499651_1_En_9_Fig1_HTML.jpg)\n\
  \n**图 9-1** 收件箱中表单的电子邮件通知\n\n用户可以点击电子邮件中的链接访问表单，或前往 SuccessFactors 主页。在主页的待办事项面板中，会有一个绩效磁贴，当用户有待处理的绩效相关操作时，该磁贴会显示出来。示例如图\
  \ 9-2 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig2_HTML.jpg](img/499651_1_En_9_Fig2_HTML.jpg)\n\
  \n**图 9-2** 绩效待办事项磁贴\n\n该磁贴会显示待处理项目的数量以及项目的截止日期。如果有多个待处理操作，则会显示距首个项目到期还有多少天。点击绩效待办事项磁贴，将弹出一个待办绩效事项弹出窗口，如图\
  \ 9-3 所示。对于管理者而言，当表单到达管理者评审步骤时，列表可能会非常长。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig3_HTML.jpg](img/499651_1_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3** 绩效待办事项\n\n请注意，其后会显示路线图步骤描述以及被评估员工的姓名。如果表单的此步骤有截止日期，则还会显示距到期还有多少天。点击链接将打开表单。另一种访问绩效表单的方式是通过主页菜单，我们将在下面讨论。\n\
  \n## 绩效收件箱\n\n如前所述，用户可以通过通知电子邮件或主页上的绩效待办事项磁贴访问表单。绩效收件箱也可以通过主页菜单访问。点击主页下拉箭头，选择“绩效”，如图\
  \ 9-4 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig4_HTML.jpg](img/499651_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4** 通过主页菜单访问绩效\n\n点击链接将用户带到“我的表单”，即绩效收件箱，如图 9-5 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig5_HTML.jpg](img/499651_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5** 绩效我的表单\n\n在屏幕左侧，列出了“我的表单”文件夹：*所有表单*、*进行中*和*已完成*。每个文件夹都有不同的显示选项。显示选项不能重新排序或删除。但是，用户可以通过取消选择来隐藏某列。我们将逐一查看每个文件夹。\n\
  \n### 进行中\n\n表单将出现在用户的收件箱或传输中文件夹中。\n\n-   当前处于用户步骤的表单将出现在收件箱中。这些表单需要执行操作。\n-   传输中表单正由路线图中的另一位用户持有。\n\
  \n用户收件箱中的表单概览显示了表单所对应的员工姓名、当前步骤名称以及与表单相关的日期。您还可以看到表单来自谁以及表单的最后修改时间。传输中文件夹有助于查看当前谁持有表单以及表单处于哪个步骤。\n\
  \n#### 已完成\n\n用户在其中扮演过角色的所有已完成文档都会显示在此处。此外，如果已配置，从其他用户发送来的已完成表单也会显示在此处：\n\n-   这是唯一可以添加子文件夹的文件夹。\n\
  -   展开此文件夹，您会看到“新建文件夹”和“未归档”。\n-   已完成的表单会存放在“未归档”文件夹中，直到用户将其移动到已创建并命名的已完成文件夹。\n\
  \n对于任何类别，都有一个“操作”列。只要未在表单模板高级设置中勾选“禁用信息”按钮，用户就会在“操作”列看到一个信息图标。点击该图标将打开一个表单视图，如图\
  \ 9-6 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig6_HTML.jpg](img/499651_1_En_9_Fig6_HTML.jpg)\n\
  \n**图 9-6** 绩效表单的信息视图\n\n此视图包含表单属性以及审批链。基于路线图，会显示各个步骤以及每个步骤的用户和表单状态。还有一个审计跟踪，显示在将表单移至下一步时所做的任何评论。您可以点击“属性”部分的“关闭”按钮，或点击此页面顶部的“返回至：”链接来关闭此视图。*有关这些设置以及如何限制访问权限的更多信息，请参见\
  \ SAP 注释 #2075925。*\n\n使用电子邮件中的链接、绩效待办事项磁贴中项目的链接或绩效我的表单收件箱中的链接，均可打开绩效表单。\n\n## 绩效表单视图\n\
  \n我们来看一下表单上的一些功能。示例如图 9-7 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig7_HTML.jpg](img/499651_1_En_9_Fig7_HTML.jpg)\n\
  \n**图 9-7** 绩效表单视图\n\n我们将在表单顶部看到绩效表单标题和一些表单操作。在表单标题上方，还有一个返回绩效收件箱的链接。\n\n在表单的右上角，有一系列图标，这些图标可能因表单模板中的设置而异。示例如图\
  \ 9-8 所示。操作选项可能包括对整个表单进行拼写检查和法律扫描、查看表单属性的链接以及添加到 Outlook 的链接。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig8_HTML.jpg](img/499651_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8** 表单选项\n\nOutlook 会议请求会随表单链接和表单截止日期一同创建。用户可以给自己发送会议请求，以便获得日历提醒。*要了解如何设置，请参见\
  \ SAP 注释 #2089432。*\n\n可能还有用于打印、另存为 PDF 和保存的图标。\n\n表单模板的各部分会列在表单顶部，如图 9-9 所示。\n\n\
  ![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig9_HTML.jpg](img/499651_1_En_9_Fig9_HTML.jpg)\n\
  \n**图 9-9** 表单各部分链接\n\n\n\n### 表单上的路线图\n\n点击任一区域，用户即可跳转到表单的相应部分。\n\n接下来，我们将查看显示在表单顶部的路线图。图\
  \ 9-10 展示了一个示例。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig10_HTML.jpg](img/499651_1_En_9_Fig10_HTML.jpg)\n\
  \n**图 9-10** 表单上的路线图\n\n与表单模板关联的路线图横跨绩效表单顶部显示。路线图中展示了“评估”、“签署”和“已完成”阶段的步骤。当前步骤编号会高亮显示。如果在路线图中为该步骤设置了截止日期，该日期将显示在当前步骤名称上方。您只能看到当前步骤的截止日期，而不会看到其他步骤的。\n\
  \n每个步骤名称右侧都会显示一个信息图标。点击该图标会显示路线图步骤的截止日期、用户姓名及其角色、以及步骤描述。图 9-11 展示了一个示例。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig11_HTML.jpg](img/499651_1_En_9_Fig11_HTML.jpg)\n\
  \n**图 9-11** 步骤名称信息\n\n您可以点击任意步骤的信息图标来查看这些信息。在这里，您可以看到未来步骤的截止日期。\n\n对于当前步骤，您还会在步骤名称下方看到`操作`选项，如图\
  \ 9-12 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig12_HTML.jpg](img/499651_1_En_9_Fig12_HTML.jpg)\n\
  \n**图 9-12** 路线图步骤的操作\n\n点击`操作`，您将看到该步骤可用的所有操作。显示的操作按钮名称，用于推动表单进入该步骤。如果您滚动到表单底部，会发现按钮名称与当前步骤中的操作名称相同。图\
  \ 9-13 展示了一个示例。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig13_HTML.jpg](img/499651_1_En_9_Fig13_HTML.jpg)\n\
  \n**图 9-13** 表单底部的按钮\n\n不推动表单前进的按钮不会显示在`操作`下。这意味着`取消`和`保存并关闭`不会列在路线图步骤的`操作`选项中。\n\
  \n在配置工具中的`公司设置`里，`启用可折叠路线图`选项允许折叠路线图。点击表单路线图区域中的`隐藏`按钮，如图 9-14 所示。如果用户需要滚动浏览表单的许多区域，这可以释放一些空间。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig14_HTML.jpg](img/499651_1_En_9_Fig14_HTML.jpg)\n\
  \n**图 9-14** 隐藏表单上路线图的选项\n\n折叠后，表单的路线图区域将显示表单所属用户的姓名以及步骤截止日期。点击`显示`即可再次展开路线图。图 9-15\
  \ 展示了一个示例。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig15_HTML.jpg](img/499651_1_En_9_Fig15_HTML.jpg)\n\
  \n**图 9-15** 折叠后的路线图\n\n### 表单上的 Pod\n\n显示在表单顶部的 Pod 基于表单模板中设置的权限。Pod 权限基于角色和路线图步骤。\n\
  \n在我们的示例中，员工评估步骤有两个可见的 Pod——“未完成项目”和“支持信息”，如图 9-16 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig16_HTML.jpg](img/499651_1_En_9_Fig16_HTML.jpg)\n\
  \n**图 9-16** 绩效表单上的 Pod\n\nPod 的位置无法更改；每个 Pod 在表单上都有固定的位置。\n\n#### 必填字段\n\n在我们的示例中，“未完成项目”Pod\
  \ 已启用，并且表单包含必填项。此 Pod 显示表单进入下一步之前需要填写的项目数量。如果您点击该 Pod，将显示未完成项目的列表，如图 9-17 所示。\n\n\
  ![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig17_HTML.jpg](img/499651_1_En_9_Fig17_HTML.jpg)\n\
  \n**图 9-17** 未完成项目\n\n点击 Pod 中列出的任意项目，可直接跳转到表单上的必填项。必填项标有红色星号。图 9-18 展示了一个示例。\n\n\
  ![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig18_HTML.jpg](img/499651_1_En_9_Fig18_HTML.jpg)\n\
  \n**图 9-18** 必填评级\n\n如果 Pod 已启用，但当前步骤没有必填项，则 Pod 中的计数将为零。如果您在填写必填字段时保存表单，未完成项目的数量会减少。\n\
  \n如果未填写必填字段，则在将表单提交到下一步时，将显示一条错误消息，并且在所有必填字段填写完毕之前，表单无法继续推进。此时会弹出一个窗口，如图 9-19 所示。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig19_HTML.jpg](img/499651_1_En_9_Fig19_HTML.jpg)\n\
  \n**图 9-19** 必填字段的错误消息\n\n### 支持信息 Pod\n\n此步骤启用的另一个 Pod 是“支持信息”Pod。回形针图标旁边的数字表示表单当前存在的附件数量。要使此功能生效，必须先在配置工具的`公司设置`中启用附件管理器，并且高级表单模板设置也必须启用附件。\n\
  \n点击该 Pod，用户将能够根据其权限查看、添加或删除附件。此 Pod 如图 9-20 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig20_HTML.jpg](img/499651_1_En_9_Fig20_HTML.jpg)\n\
  \n**图 9-20** 在“支持信息”Pod 中添加附件\n\n可附加的文件类型包括：`bmp`、`doc`、`docm`、`docx`、`gif`、`htm`、`html`、`jpg`、`jpeg`、`msg`、`pdf`、`png`、`ppt`、`pptx`、`rtf`、`tif`、`txt`、`xls`\
  \ 和 `xlsx`。通常，只有添加附件的用户才能删除该附件。大多数情况下，路线图中的任何用户都可以查看其他用户在之前步骤中添加的附件。但是，表单模板 XML\
  \ 控制着附件权限。您将在第 10 章中了解更多关于如何配置的信息。\n\n### 只读区域\n\n在我们配置的表单模板中，我们使用了几个只读区域：“引言”、“员工信息”和“审核日期”。这些区域本质上是信息性的。这些区域的一个示例如图\
  \ 9-21 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig21_HTML.jpg](img/499651_1_En_9_Fig21_HTML.jpg)\n\
  \n**图 9-21** 绩效表单的只读区域\n\n### 可编辑区域\n\n此表单中的其余区域都是可编辑的。包括一个自定义区域、一个目标区域和两个能力素质区域。每个区域都以描述开头，每个单独的目标或能力素质都划分在自己的子区域中。我们将简要查看每个区域。\n\
  \n#### 目标区域\n\n目标区域的一个示例如图 9-22 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig22_HTML.jpg](img/499651_1_En_9_Fig22_HTML.jpg)\n\
  \n**图 9-22** 目标区域\n\n\n\n版块名称显示其在总分中的占比。在本示例中，目标项目的评分将占总分的 60%。根据模板的配置方式，员工可以自行添加额外目标或编辑现有目标。目标项目必须进行评分，红色星号即表示此项为必填项。此处采用标准的星级评分方式。用户可以点击问号图标查看每个评分等级的描述，如图\
  \ 9-23 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig23_HTML.jpg](img/499651_1_En_9_Fig23_HTML.jpg)\n\
  \n图 9-23 评分等级描述\n\n在我们的示例中，没有针对单个目标项目的评论，但存在一个整体目标版块的评论，如图 9-24 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig24_HTML.jpg](img/499651_1_En_9_Fig24_HTML.jpg)\n\
  \n图 9-24 目标版块评论\n\n为了避免用户对每个目标进行评论（当目标数量较多时可能会很繁琐），我们配置了整体版块评论。这使得用户可以在一个位置集中突出显示关于目标完成情况的关键要点。在我们的示例中，整体评论为可选项。\n\
  \n#### 能力版块\n\n在第 7 章中，当我们回顾表单模板设置时，我们了解到可以有多个能力版块：核心能力、岗位特定能力和自定义能力。每个版块可以分配不同的权重，并且并非所有能力版块都需要纳入整体表单评分的计算。为了便于说明，我们假设有两个能力版块：核心能力和岗位特定能力。这两个版块都会对每项能力进行评论，但没有整体版块评论。\n\
  \n#### 写作助手\n\n如果你在使用带有项目评论的能力版块并启用了写作助手，那么每个能力项目评论框上方都会出现“写作助手”按钮，如图 9-25 所示。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig25_HTML.jpg](img/499651_1_En_9_Fig25_HTML.jpg)\n\
  \n图 9-25 能力评论上的写作助手\n\n点击“写作助手”按钮会弹出一个窗口，其中列出了针对该能力的建议评论。这些评论可以作为撰写能力评论时的出发点，也可以直接使用。示例如图\
  \ 9-26 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig26_HTML.jpg](img/499651_1_En_9_Fig26_HTML.jpg)\n\
  \n图 9-26 为一项能力撰写评论\n\n这些*引导性*短语是附加在标准能力库中的各项能力上的。如果你使用的是自定义库，则可以添加这些短语。这些短语按不同程度分组，例如*改善*、*符合*或*超越*。用户可以选择使用第一人称（“我”）或第三人称（员工姓名）作为评论的口吻。点击一个短语，然后点击“引用”。对每个要添加的引用都执行此操作；完成后点击“关闭”。\n\
  \n随后，这些评论将显示在能力项目评论中，如图 9-27 所示。这些评论可以编辑。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig27_HTML.jpg](img/499651_1_En_9_Fig27_HTML.jpg)\n\
  \n图 9-27 从写作助手添加的评论\n\n当管理者使用写作助手时，“您”或员工姓名是叙述选项。\n\n> **注意** 有关写作助手的工作原理及其配置方法的更多信息，请参见\
  \ SAP 说明文档 #2086614。\n\n特定于角色的能力将位于一个单独的版块中。一个示例角色特定能力版块如图 9-28 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig28_HTML.jpg](img/499651_1_En_9_Fig28_HTML.jpg)\n\
  \n图 9-28 角色特定能力\n\n在所示的示例中，每项能力都有评分和评论。你可以选择不为该能力版块设置项目评论。你还可以添加整体能力评论，或将这些字段设置为必填或隐藏。当有多个能力版块时，它们可以使用不同的字段和权限。\n\
  \n#### 附加评论版块\n\n另一个标准版块是附加评论版块。示例如图 9-29 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig29_HTML.jpg](img/499651_1_En_9_Fig29_HTML.jpg)\n\
  \n图 9-29 附加评论版块\n\n此版块在表单模板中不可设置权限，这意味着除非该版块被隐藏或禁用，否则任何步骤中的任何角色都可以添加或编辑评论。在第 10\
  \ 章中，我们将学习如何编辑绩效表单模板 XML 以添加这些权限。\n\n#### 自定义版块\n\n一个绩效表单可以包含多个自定义版块。这些版块不需要聚集在一起。它们可以出现在任何其他模板版块之间。与标准版块一样，该版块可以按步骤隐藏，并且可以设置权限来隐藏字段、允许编辑字段或查看字段。一个包含两个自定义版块的绩效表单示例，如图\
  \ 9-30 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig30_HTML.jpg](img/499651_1_En_9_Fig30_HTML.jpg)\n\
  \n图 9-30 带有自定义字段的自定义版块\n\n此示例展示了可使用的各种字段类型：`text`、`textarea`、`date`、`number`、`checkbox`\
  \ 或 `dropdown list`。任何 `textarea` 字段都有多个可用选项，如图 9-31 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig31_HTML.jpg](img/499651_1_En_9_Fig31_HTML.jpg)\n\
  \n图 9-31 多行文本选项\n\n除了文本格式化选项外，用户还可以添加 URL、执行拼写检查或法律扫描。拼写检查和法律扫描将在下面进行说明。\n\n####\
  \ 拼写检查\n\n在配置系统（Provisioning）中进行绩效管理设置时，我们启用了`拼写检查`和`法律扫描`。启用后，我们还在表单模板的高级设置中添加了以下内容：“启用拼写检查”和“启用法律扫描”。\n\
  \n这为用户在表单上提供了三种拼写检查选项：\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig32_HTML.jpg](img/499651_1_En_9_Fig32_HTML.jpg)\n\
  \n图 9-32 拼写检查\n\n1.  通过点击“A–Z”拼写检查图标对`textarea`字段进行拼写检查。如图 9-32 所示弹出窗口。将显示建议的单词更改。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig33_HTML.jpg](img/499651_1_En_9_Fig33_HTML.jpg)\n\
  \n图 9-33 表单上的操作\n\n1.  转到表单顶部的“操作”，然后选择“对整个表单进行拼写检查”，如图 9-33 所示。此选项将对表单中的所有文本条目进行拼写检查。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig34_HTML.jpg](img/499651_1_En_9_Fig34_HTML.jpg)\n\
  \n图 9-34 开始表单扫描\n\n1.  点击提交按钮将表单移至下一步，此时将弹出一个窗口，如图 9-34 所示。将会出现一系列屏幕来检查表单文本条目，如果发现任何错误，系统将提示用户进行更改。在此示例中，同时执行了拼写检查和法律扫描。一旦扫描完成且没有必填条目的错误，关闭扫描弹出窗口，用户将进入确认界面，以便进入下一步。\n\
  \n##### 法律扫描\n\n\n\n## 法律扫描与表单提交\n\n当启用`Legal Scan`（法律扫描）时，用户将拥有与`Spell Check`（拼写检查）相同的三个选项。`Legal\
  \ Scan`的弹窗会查找任何不当的词语或短语，并给出替代建议，如图 9-35 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig35_HTML.jpg](img/499651_1_En_9_Fig35_HTML.jpg)\n\
  \n**图 9-35**  \n法律扫描\n\n如果您希望在每次将表单提交至下一步时避免看到扫描弹窗，可以在高级表单模板设置中，点击`\"Disable Spell\
  \ Check On Route\"`（禁用路由拼写检查）和`\"Disable Legal Scan on Route\"`（禁用路由法律扫描）选项，如图 9-36\
  \ 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig36_HTML.jpg](img/499651_1_En_9_Fig36_HTML.jpg)\n\
  \n**图 9-36**  \n关闭表单扫描的选项\n\n用户仍可通过使用`\"Actions\"`（操作）选项，或分别对每个文本区域进行操作，来进行完整的表单扫描。\n\
  \n## 将表单提交至下一步\n\n在员工填写完所有必填字段并提供备注后，可以将表单发送至下一步。对于包含大量必填字段的表单，建议用户在填写过程中不时点击表单右上角的保存图标。这样做会更新`Incomplete\
  \ Items`（未完成项）分区中的计数。这是一种确保您能毫无错误地提交表单的简便方法。当所有必填字段都填写完毕时，`Incomplete Items`分区的显示如图\
  \ 9-37 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig37_HTML.jpg](img/499651_1_En_9_Fig37_HTML.jpg)\n\
  \n**图 9-37**  \n所有必填项已完成\n\n如果没有拼写检查或法律扫描错误，并且所有必填字段都已填写完毕，用户即可提交表单。这将根据路由图将表单路由至流程中的下一步。\n\
  \n随后会显示一个确认屏幕。这给了用户最后一次机会，可以返回表单进行任何修改，或确认提交至下一步。用户可以添加备注。这些备注将在发送给下一步用户的文档路由邮件中可见。此外，点击备注部分标签旁的问号（如图\
  \ 9-38 所示），将显示路由图中的文本。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig38_HTML.jpg](img/499651_1_En_9_Fig38_HTML.jpg)\n\
  \n**图 9-38**  \n确认页面\n\n在路由邮件通知中，`\"DOC_COMMENT\"`令牌控制是否允许输入备注。示例如图 9-39 所示。\n\n\
  ![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig39_HTML.jpg](img/499651_1_En_9_Fig39_HTML.jpg)\n\
  \n**图 9-39**  \n用于路由文档的邮件\n\n如果移除了该令牌，用户在提交表单时将无法向邮件通知中添加备注。\n\n提交后，将显示`My Forms`（我的表单）页面。该表单将不再出现在用户的`Inbox`（收件箱）文件夹中。点击`\"\
  En Route\"`（路由中），您将看到该表单现在位于用户的管理者处。示例如图 9-40 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig40_HTML.jpg](img/499651_1_En_9_Fig40_HTML.jpg)\n\
  \n**图 9-40**  \n在“路由中”文件夹中的表单\n\n如果已启用，当表单流转至下一步时，表单的接收者将收到一份文档路由通知，如图 9-41 所示。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig41_HTML.jpg](img/499651_1_En_9_Fig41_HTML.jpg)\n\
  \n**图 9-41**  \n路由通知\n\n邮件通知显示员工姓名作为发件人。通知还包含用户在提交确认页面上添加的备注，以及步骤截止日期。该表单现在位于管理者的`Performance\
  \ Inbox`（绩效收件箱）中。\n\n## 表单的管理者视图\n\n现在，我们将从管理者的角度来查看员工发送后的已启动表单。当管理者收到邮件通知，告知其收件箱中有表单时，他们可以点击邮件中的链接，在主页的`Performance\
  \ To-Do`（绩效待办）磁贴中找到相关的绩效任务，或者从`Home`（主页）菜单进入`Performance`（绩效）选项卡。\n\n在表单的路由图（如图\
  \ 9-42 示例所示）中，当前步骤编号会高亮显示，而前一步骤编号则会显示一个绿色的对勾标记。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig42_HTML.jpg](img/499651_1_En_9_Fig42_HTML.jpg)\n\
  \n**图 9-42**  \n处于“管理者评估”步骤的表单\n\n上图中显示的路由图里，前一步骤的名称已经更新。步骤完成后显示的标签是在创建路由图时设置的，它对应的是第一个路由图步骤中的`\"\
  Step Name After Completion\"`（完成后的步骤名称）。与您在前一步骤中看到的类似，当前步骤显示了该步骤的截止日期以及适用于该步骤的操作。如前所述，步骤截止日期仅对当前步骤显示。\n\
  \n在我们的示例中，对于`Manager Assessment`（管理者评估）步骤，所有分区都已包含在内。由于这是给出总体评级的步骤，我们还包含了`Overall\
  \ Score`（总体评分）分区。一旦管理者输入最终评级，该分区将显示总体评分。接下来我们将逐一查看每个分区。\n\n### 团队排名器分区\n\n`Team\
  \ Ranker`（团队排名器）分区根据总体评分显示管理者直属下属的排名。这与`Team Overview`（团队概览）中出现的`Team Rater`（团队评估器）选项不同。`Team\
  \ Rater`用于输入能力项得分；`Team Ranker`则根据表单总体评分显示每位直属下属的排名。尚未被评分的员工将没有排名，如图 9-43 所示。此分区仅供管理者使用。如果员工角色被授予了此分区的权限，该分区对他们也不可见。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig43_HTML.jpg](img/499651_1_En_9_Fig43_HTML.jpg)\n\
  \n**图 9-43**  \n团队排名器分区\n\n### 差距分析分区\n\n`Gap Analysis`（差距分析）分区将显示管理者评分高于或低于员工自评的数量。随着管理者输入评分并保存表单，这些数字会发生变化。示例如图\
  \ 9-44 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig44_HTML.jpg](img/499651_1_En_9_Fig44_HTML.jpg)\n\
  \n**图 9-44**  \n差距分析分区详情\n\n当您点击该分区时，详情会显示管理者的哪些项目评分高于或低于员工的自评。管理者与员工项目评分之间的差异程度用`\"\
  +\"`或`\"-\"`表示。例如，如果某个员工在某个项目上自评为*Extraordinary*（杰出），则该标签的数值分数是`\"5\"`。如果管理者给出的评分是*Meets\
  \ Expectations*（符合预期），其数值分数是`\"3\"`，那么这两个评分之间的差距就是`\"-2\"`。这意味着管理者的评分比员工的评分低了 2\
  \ 分。如果管理者和员工对某个项目给出了相同的评分，则不存在差异。\n\n### 支撑材料分区\n\n`Supporting Information`（支撑材料）分区如图\
  \ 9-45 所示。计数数字显示该分区中有多少个附件。根据本例中的配置，管理者可以查看员工添加的附件、添加另一个附件、或删除他们自己添加的附件。您可以决定是否允许管理者删除员工添加的附件，或者在特定步骤中隐藏该分区。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig45_HTML.jpg](img/499651_1_En_9_Fig45_HTML.jpg)\n\
  \n**图 9-45**  \n支撑材料分区\n\n\n\n您还会注意到，此组件除了有回形针图标及其附件计数外，还有一个带有数字的评论气泡图标。此组件可能还包含“请求反馈”评论以及备注。即使我们的表单未配置使用“请求反馈”功能，经理也会看到评论图标和数字。我们将在第\
  \ 11 章了解“请求反馈”功能。\n\n现在我们已经介绍了表单顶部可用的组件，我们将探讨一些额外的章节功能。\n\n## EZ-Rater\n\n表单模板的\
  \ XML 中可能启用一项名为 `EZ-Rater` 的功能。此功能出现在表单的“目标”和“能力”部分。对于每个目标和能力的评分，经理将能够看到员工自评与经理评分之间的差距。这对于年终与员工讨论时非常有用。\n\
  \n示例如图 9-46 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig46_HTML.jpg](img/499651_1_En_9_Fig46_HTML.jpg)\n\
  \n图 9-46 EZ-Rater\n\n在经理录入评分并将表单提交至下一步后，该差距图将在所有后续步骤和角色中可见。\n\n## 他人评分选项卡\n\n在配置表单模板时，我们设置了权限，允许经理在所有步骤中查看来自其他评分者的评分和评论。这意味着员工在先前步骤中录入的条目评分和条目评论将对经理可见。示例如图\
  \ 9-47 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig47_HTML.jpg](img/499651_1_En_9_Fig47_HTML.jpg)\n\
  \n图 9-47 他人评分选项卡\n\n在签署前的所有步骤中，用户将在章节左侧看到自己的评分和评论。在所有步骤中，如果用户有权限，“他人评分”选项卡中的评分和评论将显示在章节右侧。\n\
  \n我们还讨论了通过“绩效”选项卡中的“我的表单”访问表单。如果启用并授予权限，经理还可以访问“团队概览”选项卡，如图 9-48 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig48_HTML.jpg](img/499651_1_En_9_Fig48_HTML.jpg)\n\
  \n图 9-48 团队概览访问\n\n点击 `团队概览`，您将看到类似于图 9-49 的界面。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig49_HTML.jpg](img/499651_1_En_9_Fig49_HTML.jpg)\n\
  \n图 9-49 团队概览\n\n此页面为经理提供了一*目了然*的视图，显示哪些表单已启动、哪些员工有已启动的表单，以及每个表单所处的步骤。如果有来自多个模板生成的表单，则每个关联表单的表单模板将按天分组。展开任意表单组以查看详细信息。示例如图\
  \ 9-50 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig50_HTML.jpg](img/499651_1_En_9_Fig50_HTML.jpg)\n\
  \n图 9-50 团队概览表单分组\n\n展开后，将显示“我的团队”，其中包含需要审核的表单列表。此列表包括已启动表单的直接下属，以及经理在路由图中担任角色的其他员工的已启动表单。页面将显示路由图步骤及任何步骤的到期日期。如果已配置，员工完成的每个步骤旁边都会有一个对勾标记。这使得经理能够轻松查看每个表单在流程中的位置。已完成的一对一步骤将显示不同的图标。将鼠标悬停在图标上，可以看到该步骤已被确认，如上一图所示。\n\
  \n根据步骤和经理的角色，可能会显示一些按钮，这些按钮可以将经理直接带入表单。例如，表单可能处于经理评估步骤。一个带有链接的按钮将显示 `审核 {员工姓名}`。如果经理点击该按钮，表单将打开，并且他们可以完成该员工的经理评估步骤。任何当前处于经理步骤的表单都将有一个按钮，可进入表单完成操作。\n\
  \n可能还会出现一个“请求反馈”按钮，使经理能够向其他用户请求评论。这些评论将显示在表单上的“支持信息”组件中。您将在第 11 章了解如何配置“请求反馈”。此外，还会讨论此功能的工作原理以及它与另一个名为“获取反馈”的反馈收集选项有何不同。\n\
  \n处于“签署阶段”的表单会显示需要签署的数量以及谁需要先签署表单。这里有一个步骤允许经理召回表单。示例如图 9-51 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig51_HTML.jpg](img/499651_1_En_9_Fig51_HTML.jpg)\n\
  \n图 9-51 团队概览中的签署步骤\n\n点击 `召回` 链接会将表单退回一步。如果表单没有退回一步的选项，此功能将很有帮助。\n\n还有“团队评分者”选项，允许经理为已启动表单的直接下属进行能力评分。该选项如图\
  \ 9-52 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig52_HTML.jpg](img/499651_1_En_9_Fig52_HTML.jpg)\n\
  \n图 9-52 团队评分者选项\n\n在图 9-53 所示的示例中，有一个下拉列表用于选择能力类型。我们的表单包含核心能力和岗位特定能力，因此每个部分将单独评分。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig53_HTML.jpg](img/499651_1_En_9_Fig53_HTML.jpg)\n\
  \n图 9-53 团队评分者\n\n这将更新尚未通过评分步骤的表单中的能力评分。在我们上一图所示的示例中，Julien 和 Scott 的表单已经通过了经理评估步骤，因此无法更新评分。Bettina\
  \ 的表单尚未被评估，因此经理可以在此处输入他们的能力评分，她的表单将反映这些评分。\n\n> 要了解有关团队概览及其附加功能的更多信息，请参阅 SAP 说明\
  \ #2078755。\n\n## 将表单退回一步\n\n在图 9-54 所示的示例中，我们允许经理将表单路由回上一步的员工。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig54_HTML.jpg](img/499651_1_En_9_Fig54_HTML.jpg)\n\
  \n图 9-54 将表单退回一步\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\n\n##\
  \ 示例流程\n\n在该示例中，经理决定将表单退回至上一步骤，让员工进行更新。如果经理在退回表单前已开始在表单中输入某些评分并保存了表单，员工将看不到经理所做的任何输入。只要经理在其步骤中要填写的任何字段的权限设置为`\"\
  None\"`，则退回至员工手中的表单将与之前离开员工时的状态完全一致。这意味着员工步骤中的经理评分和经理评语字段的权限应为`\"None\"`。当表单退回至此步骤时，员工步骤中的所有可编辑字段将恢复可编辑状态。员工完成修改后，将提交表单，表单将再次流转至经理步骤。经理在此步骤中已做的任何输入都将得到保留。\n\
  \n## 摘要部分\n\n经理所使用的摘要部分将包含表单中所有`目标`和`能力`部分的评分，前提是它们在表单模板的摘要部分中已指定了权重。示例如图 9-55 所示。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig55_HTML.jpg](img/499651_1_En_9_Fig55_HTML.jpg)\n\
  \n**图 9-55** 经理评分前的摘要部分\n\n根据表单模板配置，每个目标和能力及其项目评分将在此部分显示。各部分的权重也会一并显示。我们也允许经理输入一个手动总体评分，该评分将覆盖计算得出的评分。经理输入评分并保存表单后，表单总体评分将被计算出来。在此示例中，手动总体评分是必填项。一旦输入此评分，`总体得分`数据块将更新为此评分，并将其作为最终记录评分。所有评分已填写的摘要部分示例如图\
  \ 9-56 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig56_HTML.jpg](img/499651_1_En_9_Fig56_HTML.jpg)\n\
  \n**图 9-56** 包含计算后总体评分的摘要部分\n\n每个单项评分会与各部分的计算评分一同显示。计算评分是数值。尽管每个部分中的项目评分以星级显示，但在此处项目评分显示了数值和文本值。手动评分则使用星级评分系统。\n\
  \n请注意图 9-57 中的示例，手动总体评分也在`总体得分`数据块中使用了数值和文本值进行显示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig57_HTML.jpg](img/499651_1_En_9_Fig57_HTML.jpg)\n\
  \n**图 9-57** 包含手动总体评分的总体得分数据块\n\n### 团队排名器数据块\n\n为员工设定总体得分后，您可以看到`团队排名器`数据块已更新，根据总体得分纳入了此表单的排名。示例如图\
  \ 9-58 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig58_HTML.jpg](img/499651_1_En_9_Fig58_HTML.jpg)\n\
  \n**图 9-58** 更新后的团队排名\n\n### 无评语选项的确认屏幕\n\n使用我们的示例模板，经理完成绩效评分后的下一步是与员工进行年终讨论。在此步骤中，经理是角色所有者，因此当确认页面显示时，没有评语选项，如图\
  \ 9-59 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig59_HTML.jpg](img/499651_1_En_9_Fig59_HTML.jpg)\n\
  \n**图 9-59** 无评语选项的确认屏幕\n\n出现这种情况是因为表单在下一步骤将流转给同一用户，因此无需发送电子邮件通知。\n\n### 表单上评分的视图\n\
  \n根据查看表单的用户身份不同，评分和评语的显示位置也不同。输入评分和评语的用户将在每个目标和能力项的左侧看到这些字段。在我们的示例图 9-60 中，经理的评分和评语位于目标项下方左侧。员工对该项目的评分和评语则位于右侧的`来自他人的评分`下方。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig60_HTML.jpg](img/499651_1_En_9_Fig60_HTML.jpg)\n\
  \n**图 9-60** 经理视角下的项目评分和评语\n\n当以员工身份查看表单时，员工的评分和评语位于左侧，而经理的评分和评语则位于右侧的`来自他人的评分`下方，如图\
  \ 9-61 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig61_HTML.jpg](img/499651_1_En_9_Fig61_HTML.jpg)\n\
  \n**图 9-61** 员工视角下的项目评分和评语\n\n### 计算后的总体评分\n\n如果您在摘要部分使用计算后的总体评分，同时允许手动总体评分，则手动评分将是最终记录评分。强烈建议在后续任何步骤中隐藏计算后的评分。包含计算后评分的部分如图\
  \ 9-62 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig62_HTML.jpg](img/499651_1_En_9_Fig62_HTML.jpg)\n\
  \n**图 9-62** 不可见的计算后评分\n\n#### 签名步骤\n\n一旦所有修改步骤完成、评分已给出、年终讨论也已进行，表单将进入签名阶段。\n\n\
  此阶段的表单为只读状态。唯一可编辑的部分是签名部分，可以在其中添加评语。如果在高级表单模板设置中进行了配置，则可以显示需要签署表单的用户名称。示例如图 9-63\
  \ 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig63_HTML.jpg](img/499651_1_En_9_Fig63_HTML.jpg)\n\
  \n**图 9-63** 签署前的签名部分\n\n用户提交表单后，签署日期和电子签名将添加到表单中。员工签署后的签名部分示例如图 9-64 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig64_HTML.jpg](img/499651_1_En_9_Fig64_HTML.jpg)\n\
  \n**图 9-64** 包含一个签名的签名部分\n\n如果您决定不使用签名部分，只需在表单模板中隐藏该部分，那么表单将在最后一个修改步骤后直接进入已完成步骤。\n\
  \n#### 已完成步骤\n\n一旦添加了最终签名并提交了表单，表单将进入`我的表单`的`已完成`文件夹，如图 9-65 所示。任何在流程中扮演角色的用户都将在其`绩效已完成`文件夹中收到一份表单副本。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig65_HTML.jpg](img/499651_1_En_9_Fig65_HTML.jpg)\n\
  \n**图 9-65** 已完成文件夹中的表单\n\n#### 报告\n\n如果经理被授予了报告访问权限，他们可能能够运行标准报告、运行为其创建的即席报告、创建自己的即席报告、查看磁贴以及生成仪表板。\n\
  \n### 仪表板/磁贴\n\n管理员可以从`SuccessStore`添加标准的绩效表单相关磁贴，然后将其放置在经理的主页上。示例如图 9-66 所示。\n\n\
  ![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig66_HTML.jpg](img/499651_1_En_9_Fig66_HTML.jpg)\n\
  \n**图 9-66** 主页上的绩效磁贴\n\n### 向下钻取\n\n\n\n在磁贴中，经理可以向下钻取以查看详细信息。示例如图 9-67 所示。\n\n\
  ![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig67_HTML.jpg](img/499651_1_En_9_Fig67_HTML.jpg)\n\
  \n**图 9-67** 向下钻取磁贴\n\n结果可以下载为 Excel 或 `CSV` 文件。\n\n#### 报告中心\n\n在报告中心内，可以生成经理有权访问的仪表盘。`Type`\
  \ 列将显示“Dashboard”，如图 9-68 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig68_HTML.jpg](img/499651_1_En_9_Fig68_HTML.jpg)\n\
  \n**图 9-68** 报告中心报告\n\n经理可以运行此报告，生成的数据将显示在磁贴中。示例如图 9-69 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig69_HTML.jpg](img/499651_1_En_9_Fig69_HTML.jpg)\n\
  \n**图 9-69** 经理生成的仪表盘\n\n这些是标准磁贴，属于管理员从 SuccessStore 添加的标准绩效仪表盘的一部分。\n\n## 即席报告\n\
  \n获得权限后，经理可以运行为其创建的报告。管理员将创建报告，然后进行共享。共享报告将显示一个图标以标识其为共享。经理将仅能看到其直接下属以及根据经理角色权限设置的下级层级的结果。示例如图\
  \ 9-70 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig70_HTML.jpg](img/499651_1_En_9_Fig70_HTML.jpg)\n\
  \n**图 9-70** 运行共享的即席报告\n\n如果经理的角色具有创建报告的权限，他们可以创建自己的报告。有一个向导可以引导完成创建报告的各个步骤。通常，选择的报告类型是“Table”，域为“Performance\
  \ Management”，如图 9-71 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig72_HTML.jpg](img/499651_1_En_9_Fig72_HTML.jpg)\n\
  \n**图 9-72** People Profile 上的绩效历史 Portlet\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig71_HTML.jpg](img/499651_1_En_9_Fig71_HTML.jpg)\n\
  \n**图 9-71** 创建即席报告\n\n与共享报告和磁贴类似，经理将仅能看到其直接下属以及根据经理角色权限设置的下级层级的结果。人力资源经理角色也可能被授予报告权限，其结果将包括其支持的员工。\n\
  \n查看绩效相关信息的另一种方式是通过 *People Profile*。我们现在将介绍一些可用的 Portlet 和块。\n\n#### 绩效历史 Portlet\n\
  \n有一些与绩效相关的 Portlet 和块可能出现在用户的 People Profile 中。通常，它们出现在档案的“人才档案”部分，该部分仅对员工和经理可见。绩效历史\
  \ Portlet 的示例如图 6-72 所示。\n\n如果表单模板中包含“目标能力摘要”部分，则可能显示目标能力 Portlet。示例如图 9-73 所示。\n\
  \n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig73_HTML.jpg](img/499651_1_En_9_Fig73_HTML.jpg)\n\
  \n**图 9-73** 档案中的目标能力矩阵网格\n\n此外，如果数据模型中配置并允许使用评级背景元素，则可以在 People Profile 中设置块。整体潜力评级块和最新绩效评级块的示例如图\
  \ 9-74 所示。\n\n![../images/499651_1_En_9_Chapter/499651_1_En_9_Fig74_HTML.jpg](img/499651_1_En_9_Fig74_HTML.jpg)\n\
  \n**图 9-74** 整体潜力与绩效评级块\n\n现在，我们已经从用户的角度走完了绩效流程。\n\n## 结论\n\n在最后三章中，我们启用了绩效管理，设置了权限，并创建了表单模板。在本章中，我们通过员工及其经理的视角走完了绩效评估流程。在下一章中，我们将深入探讨一些必须在后端表单模板\
  \ `XML` 中完成的配置细节。我们还将学习一些可能用到的**高级功能**。\n\n"
- "# 10. 绩效管理 XML 与翻译\n\n正如我们在目标计划模板中看到的，并非所有配置都可以在 UI 中完成。某些操作、权限和格式设置必须在 Provisioning\
  \ 中的表单模板 `XML` 中完成。在本章中，我们将介绍修改绩效表单模板 `XML` 的一般结构和方法。然后，我们将在相关部分确定仅 `XML` 才需要的配置，并了解只能在\
  \ `XML` 中进行的修改类型（除非有特定的 `XML` 专用配置需求，否则此处不会涵盖所有部分类型）。\n\n我们采用逐节分析的方法来检查 `XML`，以避免混淆（即使某个功能的端到端解决方案可能跨越多个部分）。我们首先了解如何访问\
  \ `XML`。然后，我们详细查看元（meta）部分。接着，我们总体了解绩效部分的结构以及可配置的内容。随后，我们进入具体部分，包括引言部分、员工信息部分、评审日期部分、目标部分、能力部分、摘要部分、自定义部分和签名部分。最后，我们将介绍如何通过特殊的“消息键”方法来更新翻译。\n\
  \n> **注意：** 这可能是本书中最具挑战性的一章。我们假设您在尝试直接编辑本章中所示的 `XML` 之前，已遵循了之前所有绩效管理章节中的步骤。根据我们的经验，大多数客户需求可通过完全在线配置绩效表单来满足；然而，了解那些在客户提出要求时仍然可用的功能也是好的！同时，理解\
  \ `XML` 的工作原理也很重要，这样一些难以理解的技术问题就会变得清晰。例如，特定路由图步骤上的权限问题或翻译不显示正确的问题，通常只能通过直接检查 `XML`\
  \ 来解决。\n>\n> 虽然我们在本节中涵盖了客户要求的许多需要直接编辑 `XML` 的场景，但这并不代表所有可能的 `XML` 编辑。如有疑问，请从 SAP\
  \ note 229273 中下载并检查 `sf-form.dtd`，以全面详细了解 `XML` 的结构和功能。\n\n## 访问 XML\n\n我们将使用我们从\
  \ SuccessStore 下载并在 UI 中更新的表单模板。要访问表单模板 `XML`，请在 Provisioning 中转到“Form Template\
  \ Administration”，如图 10-1 所示。\n\n![../images/499651_1_En_10_Chapter/499651_1_En_10_Fig1_HTML.jpg](img/499651_1_En_10_Fig1_HTML.jpg)\n\
  \n**图 10-1** 访问表单模板 XML\n\n将显示该实例的所有模板。列表将包括现有的绩效、360 度评估、薪酬、角色就绪和招聘模板。模板名称、类型和系统生成的\
  \ ID 显示如图 10-2 所示。\n\n![../images/499651_1_En_10_Chapter/499651_1_En_10_Fig2_HTML.jpg](img/499651_1_En_10_Fig2_HTML.jpg)\n\
  \n**图 10-2** 表单模板列表\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n正如我们在用户界面中所见，非活动表单模板可以隐藏但不能删除。在\
  \ Provisioning 中，活动和未活动的模板都会显示，并且无法区分它们。这意味着你的列表会变得非常冗长且难以管理。处理方法之一是在用户界面中重命名非活动表单模板。你可以在表单模板名称前添加\
  \ `\"ZZZ\"`。这样一来，在 Provisioning 中，所有重命名的非活动模板就很容易识别，并且会移动到列表的末尾，如图 10-3 所示。\n\n\
  ![../images/499651_1_En_10_Chapter/499651_1_En_10_Fig3_HTML.jpg](img/499651_1_En_10_Fig3_HTML.jpg)\n\
  \n**图 10-3** 非活动表单模板\n\n我们将打开从 SuccessStore 下载并修改过的表单模板。示例如图 10-4 所示。\n\n![../images/499651_1_En_10_Chapter/499651_1_En_10_Fig4_HTML.jpg](img/499651_1_En_10_Fig4_HTML.jpg)\n\
  \n**图 10-4** 添加并重新排列 XML 部分\n\n## 各部分\n\nXML 部分是实例中配置的表单模板部分的后端视图。但是，XML 部分还具有设置属性、标签和权限的额外功能。\n\
