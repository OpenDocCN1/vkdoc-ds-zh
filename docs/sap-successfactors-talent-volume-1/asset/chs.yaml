- "# 2. 人才简介\n\nSuccessFactors 中的人员简介以不同的信息块形式显示员工数据。这些信息块为员工和经理提供自助服务功能。在信息块中显示哪些数据可以通过权限进行控制；信息块的视图也可以通过权限进行控制。通常，人员简介包含个人信息、地址和联系方式等信息块。如果您已实施名为\
  \ Employee Central 的 SAP SuccessFactors HRIS 产品，则可以配置额外的信息块，例如工资单、国民身份证等。\n\n人才简介是\
  \ SAP SuccessFactors 中人员简介的一个子部分。人才简介由绩效、潜力、薪酬和继任管理等信息块组成。\n\n在本章中，我们将详细讨论人才简介，包括如何使用提供员工和经理自助服务功能的信息块来配置人才简介，如何填充信息块，以及如何设置信息块的编辑或仅显示权限。\n\
  \n**注**：当您配置 SuccessFactors 并将员工导入实例时，SuccessFactors 会默认为所有员工创建一个人简介。您可以向人员简介添加信息块。这些信息块可以是系统自带的信息块和客户构建的信息块的组合。\n\
  \n员工简介中显示员工相关数据的区块被称为*信息块*。\n\n## 人员简介中的人员选择器\n\n人员选择器是人员简介中的一个下拉列表（见图 2-1），用于显示员工的经理、直接下属和同级。用户可以从姓名中选择以查看特定员工的简介。当您单击下拉列表时，系统会显示一个搜索框。您也可以使用搜索框搜索员工。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig1_HTML.jpg](img/499651_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1：人员简介中的人员选择器\n\n客户有时有隐藏人员选择器中同级人员的业务需求。在管理中心有一个设置，您可以在此隐藏人员选择器下拉列表中的同级人员。请注意，此设置是全局性的，不能限制到特定的员工组。\n\
  \n要隐藏人员选择器中的同级详细信息，请转到管理中心并点击平台功能设置。在显示的配置页面上，选择名为“隐藏同级”的设置。保存您的配置。\n\n## 人才简介\n\
  \n人才简介显示与人才解决方案相关的信息块（见图 2-2）。当安装了 SuccessFactors 人才解决方案，如绩效管理、继任管理、薪酬和学习管理系统时，与这些解决方案相关的信息块将被激活并在系统中可用。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig2_HTML.jpg](img/499651_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2：人才简介\n\n**注**：您可以通过以下方式访问员工简介：转到 SuccessFactors 主页，单击“主页”下拉列表，然后选择“我的员工档案”（图\
  \ 2-3），这是 SuccessFactors 演示实例中的员工档案。员工简介将显示各种标题。单击标题将导航到员工简介中的特定信息块。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig3_HTML.jpg](img/499651_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3：导航到“我的员工档案”\n\n表 2-1 列出了您将在人才简介中看到的一些示例信息块。这不是一个完整的列表，客户可能已经配置了其中一些或几个其他信息块。其中一些信息块在客户实例中可能以不同的名称提及。\n\
  \n**表 2-1**：人才简介中的示例信息块\n\n\n\n| Portlet | 描述 |\n| --- | --- |\n| `Badges` | 组织授予员工徽章，以表彰其出色的工作表现。例如，员工可能会获得“团队合作者”徽章，以表彰其卓越的团队协作能力。员工可以在一定时间内展示该徽章。还有一些徽章可能与员工的工作表现无关，而是反映员工的工作文化。例如，某枚徽章可能表彰员工在特定时期内的\
  \ 100%出勤率或零客户投诉。徽章通常是一种表示同伴认可的方式，这些徽章可以展示在“人才简介”中的指定 Portlet 中。 |\n| `Talent Overview:\
  \ Talent Information` | `Talent Information` Portlet 显示企业中使用的不同人才标识。HR、经理或人才团队可以编辑\
  \ `Talent Information` Portlet。企业配置的标识可能包括以下内容：1. *流失风险*：该员工流失的风险有多大？值可能为低、中、高或非常高。2. *流失影响*：如果该员工离开团队，对团队/组织会产生多大影响？值可能为低、中、高或非常高。3. *离职原因*：一个备注框，用于记录离职原因，或使用下拉菜单（也称为选择列表值）来选择离职原因。4. *未来领导者*：该员工是否有潜力成为领导者？可能值为是和否。\
  \ |\n| - | 5. *多元化候选人*：该员工是否是多元化候选人？*多元化*的含义可能因国家或地域而异。6. *新任职*：如果该员工是新任职的，此标识可能设为“是”。企业可能在最初的\
  \ 180 天或 365 天内使用此标识。此标识可能用于触发下游活动，例如启动 30/60/90 天目标。这些标识可能具有二进制（是/否）或多个值。具体使用哪些值取决于业务需求，这些可以在研讨会中讨论并记录下来。客户企业可能不会使用所有这些标识，或者其中一些标识可能会被重新定义以符合企业文化。客户也可以使用自定义标识。\
  \ |\n| `Talent Overview: Overview` | 此 Portlet 将显示总体绩效评分、潜力排名、能力排名和目标评分。Portlet\
  \ 还将显示“绩效与潜力”九宫格矩阵。 |\n| `Skill Profile` | 员工（或任何拥有适当权限的人员）可以在此 Portlet 中添加技能。 |\n\
  | `Performance and Competencies: Performance History` | 此 Portlet 显示员工在配置日期范围和流程内的绩效评级。此\
  \ Portlet 是系统提供的，并具有预定义字段。因此，无法对此 Portlet 进行修改。 |\n| `Performance and Competencies:\
  \ Competencies` | 此 Portlet 显示员工在其年度绩效表格中，在配置日期范围和流程内获得的能力评级。 |\n| `Promotability\
  \ and Performance: Promotability (Manager View Only)` | 在此 Portlet 中，经理将输入职位角色的详细信息、员工是否准备好晋升，以及员工可能胜任该职位的时间范围。还有一个可选的备注字段，经理可以在其中输入评论。\
  \ |\n| `Potential and Performance Views: Potential (Manager View Only)` | 在此 Portlet\
  \ 中，经理将输入员工的潜力评级。 |\n| `Objective-Competency Historical Matrix Grid Placement` |\
  \ 此 Portlet 将显示目标与能力评级的九宫格矩阵。这些评级来自配置日期范围和流程内的年度绩效表格。 |\n| `Successors: Successor\
  \ portlet` | 此 Portlet 显示被指定接替该员工职位的人员。 |\n| `Successors: Nomination portlet` |\
  \ 此 Portlet 显示该员工被指定为继任者的职位。 |\n\n客户可以配置许多不同的 Portlet，以符合其文化和业务需求。对于顾问或内部 `SuccessFactors`\
  \ 团队来说，理解业务需求并相应地配置 Portlet 非常重要。\n\n**提示**\n\n建议的做法是尽可能使用默认 Portlet。使用默认 Portlet\
  \ 的一个显著优势是，如果 `SuccessFactors` 有升级，这些 Portlet 会自动升级，无需客户团队付出任何额外努力。对于包含来自人才解决方案数据的\
  \ Portlet，默认 Portlet 会自动使用来自最新表格或对象的评级进行更新。\n\n在下一节中，我们将深入探讨不同 Portlet 中“人才简介”的配置。我们还将研究需要使用\
  \ XML 在 `Succession` 数据模型中进行哪些配置。在探索配置的过程中，我们将初步了解名为 `Manage Business Configuration`\
  \ 的配置步骤。\n\n### 构建自定义 Portlet\n\n“人才简介”可以包含默认 Portlet 以及客户特定 Portlet 的组合。我们可以在基于\
  \ XML 的 `Succession` 数据模型中配置 Portlet。如果您无法访问数据模型，则可以在 `Admin Center` 中配置 Portlet。\n\
  \n在本节中，我们将讨论如何在 `Admin Center UI` 中创建背景元素，然后讨论如何在 XML 中创建背景元素。\n\n**注意**\n\n如果您熟悉\
  \ XML 配置，可以从 `Provisioning` 下载 `Succession` XML 文件。客户无法访问 `Provisioning`。只有被授予 `Provisioning`\
  \ 访问权限的认证顾问才能访问它。\n\n### 在 UI 中创建背景元素\n\n“人员简介”中的自定义 Portlet 被称为*背景元素*。\n\n在搜索框中输入配置步骤\
  \ `Manage Business Configuration`（参见图 2-4）。在 `Manage Business Configuration` 屏幕上，向下滚动到\
  \ `Employee Profile` 部分，并展开 `Background Elements`。我们将在此部分创建一个自定义背景元素。向下滚动并点击 `Create\
  \ New`。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig4_HTML.jpg](img/499651_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4 操作搜索框\n\n在显示的页面上（参见图 2-5），您需要填写各个字段。表 2-2 描述了不同的字段及其含义。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig5_HTML.jpg](img/499651_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5 创建背景元素\n\n**注意**\n\n如果搜索没有将您带到 `Manage Business Configuration` 页面，请查看下一节“启用业务配置\
  \ UI”。否则，请跳到“块设置”部分。\n\n### 启用业务配置 UI\n\n客户和实施团队使用 `Business Configuration UI (BCUI)`\
  \ 来执行以下操作：\n\n1.  添加/维护自定义背景元素\n2.  维护标准的 `userinfo` 对象\n3.  添加/更改标签\n4.  添加/更改翻译\n\
  5.  启用字段\n6.  更改字段的可见性\n7.  将字段设为必填\n\n#### 前提条件\n\n您需要确保 `Succession` 数据模型在 `Provisioning`\
  \ 中可用。`Manage Business Configuration`（也称为 `BCUI`）是 `SuccessFactors` 中的一个管理工具，用于创建和维护通常在\
  \ XML 数据模型中维护的对象。\n\n如果 `Succession` 数据模型不可用，请打开一个组件为 `LOD-SF-PLT-PPRV` 的工单，并请求支持将\
  \ `Succession` 数据模型导入到您的公司 ID 中。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 在您的实例中启用 BCUI\n\n在“配置”中，确认配置开关 `Enable Generic Objects` 已勾选。如果未勾选，您需要将其勾选。启用\
  \ `Enable Generic Objects` 后，在“管理中心”选择 `Enable Business Configuration`。启用此项后，您需要在“配置”中执行\
  \ BCUI 同步作业，即 `Synchronize Business Configuration`（参见图 2-6）。此作业仅需执行一次。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig6_HTML.jpg](img/499651_1_En_2_Fig6_HTML.jpg)\n\
  \n**图 2-6** 配置“同步业务配置”\n\n在“配置”中，点击 `Manage Scheduled Jobs`。在显示的页面上，创建一个作业类型为 `Synchronize\
  \ Business Configuration` 的作业。配置作业后，仅执行该作业一次。\n\n> **注意**  \n> 在作业运行期间，配置步骤 `Manage\
  \ Business Configuration` 将被锁定。在此期间，对 Succession 数据模型所做的任何更改都可能导致 BCUI 与 Succession\
  \ 数据模型之间存在差异。\n\n作业执行后，您通过 `Manage Business Configuration` 对 Succession 数据模型所做的任何更改都将自动触发此作业。\n\
  \n### BCUI 的权限\n\n对于需要访问 `Manage Business Configuration` 的权限组/权限角色，您需要分配在 `Manage\
  \ Business Configuration` 中访问和维护对象的权限。在“管理中心”中，`Manage Permission Roles` 项目分配了本节所述的权限。\n\
  \n在 `Administrator Permissions` 部分的 `Metadata Framework` 权限组中，选择以下项：\n\n- `Manage\
  \ Data`\n- `Read/Write Permission on Metadata Framework`\n- `Import Permission on\
  \ Metadata Framework`\n- `Admin Access to the OData API`\n- `Manage Configuration\
  \ UI`\n\n在 `Administrator Permissions` 部分的 `Manage Business Configuration` 权限组中，执行以下操作：\n\
  \n- 为列出的对象选择可见性和操作。\n  - 为某个对象选择 `Visibility` 意味着该对象将显示在 BCUI 中。\n  - `Actions`\
  \ 表示可以对该特定对象执行的操作。\n- 点击 `Done` 保存您的设置。\n\n### 块设置\n\n配置表 2-2 中的设置，以配置背景元素。\n\n\
  **表 2-2** 背景元素中的字段\n\n| 字段 | 说明 |\n| --- | --- |\n| `Type Id` | `Type Id` 值用于标识背景元素。因此，`Type\
  \ Id` 值应为唯一的整数，例如 10。 |\n| `ID` | 您在此字段中输入背景元素的 ID。该 ID 应为唯一值，并且不能用于任何其他元素。ID 不应包含任何空格，因为不支持空格，例如\
  \ `custWillingToRelocate`。建议的做法是以小写字母开头，后跟其他大写单词，且无空格。*注意：您会注意到某些 SuccessFactors\
  \ 交付的背景元素以 `sys` 开头。在修改此类窗口小部件时，需要考虑这些窗口小部件的限制。* |\n| `Label` | 这是将显示在“人员档案”中的字段名称。您可以通过单击字段旁边的图标来添加语言翻译。\
  \ |\n| `Default Label` | 这是未配置标签的语言所显示的标签。 |\n| `Enabled` | `Enabled` 的值为 `Yes`/`No`。如果您希望该字段显示在“人员档案”中，请选择值\
  \ `Yes`。*注意：在“人员档案”中显示窗口小部件是一个两步过程。**步骤 1：在配置中启用该窗口小部件。**步骤 2：在基于角色的权限中授予该窗口小部件查看/编辑的权限。*\
  \ |\n| `Description` | 此条目将显示在块中。该字段仅供参考。 |\n| `Max Entries` | 这是可以在该背景元素中创建的最大条目数。最大条目数仅对\
  \ ESS/MSS 有效。当通过平面文件导入填充窗口小部件时，最大条目数会被覆盖。 |\n| `Scale Id (Feedback Type)` | 输入您计划在此窗口小部件中使用的评分等级。例如，如果该窗口小部件用于记录员工的搬迁意愿，并且该意愿按\
  \ 1 到 3 的等级记录，那么您将使用包含 1、2、3 的评分等级。 |\n\n### 数据字段\n\n在本节中，您将填写在后台窗口小部件中显示的字段的详细信息。如图\
  \ 2-5 所示，前四个字段在屏幕上可见。要查看需要填写的其他字段，您需要点击 `Details`。表 2-3 描述了这些字段。\n\n> **注意**  \n\
  > 作为一种建议做法，请在填写这些字段之前先填写“块设置”下的设置。\n\n**表 2-3** 背景元素中的数据字段\n\n\n\n| 字段 | 说明 |\n\
  | --- | --- |\n| `Id` | 这是后台数据字段的 ID。它必须是唯一的，并且不能与特定后台元素中的任何其他数据字段重复。 |\n| `Enabled`\
  \ | 值为 `Yes` 和 `No`。如果希望该字段显示在后台元素中，请选择值 `Yes`。 |\n| `Hidden` | 如果希望该字段在人员档案中呈现，请选择值\
  \ `Yes`。否则，值应为 `No`。 |\n| `URL Link` | 在该字段中输入的值将显示为链接。默认值为 `Yes` 和 `No`。如果不希望该值在用户界面中显示为链接，请选择\
  \ `No`。 |\n| `Field Name` | 这是数据库字段名称。支持的值如下：**VARCHAR（文本）字段（`vfld1` 到 `vfld13`）**：如果该字段显示文本并且是下拉列表，则可以使用此类型。可以使用\
  \ `vfld1` 到 `vfld13` 的值。*注意：在特定的后台元素中，不能重复使用字段名称。如果您有一个字段名称为 `vfld1` 的字段，那么下次有文本/选择列表字段时，您必须使用例如\
  \ `vfld2`。* |\n| - | **DATE 字段（`dfld1` 到 `dfld5`）**：如果该字段是日期字段，则将字段命名为 `dfld1` 到\
  \ `dfld5`。使用此字段名称时，字段将显示一个“日历”按钮，您可以使用该按钮选择日期。***注意：*** *与 Varchar 字段名称类似，您不能在同一个后台元素中重复使用日期字段名称。因此，如果您将一个数据字段命名为\
  \ `dfld1`，则下一个日期字段将为 `dfld2`。系统限制在一个特定后台元素中最多只能有五个日期字段。* **开始日期和结束日期（`startDate`，`endDate`）**：这些是日期字段。如果使用此日期名称，则将两个字段都设为必填项，以便同时填写开始日期和结束日期字段。此字段通常用于确保开始日期和结束日期的值同步。换句话说，结束日期的值不早于开始日期。***注意：***\
  \ *您只能在特定的后台元素中使用开始日期/结束日期。将开始日期和结束日期字段设为必填项可确保两个字段都被填写，而不会留下一个空白。* **整数（INTEGER）字段（`ifld1`\
  \ 到 `ifld4`）**：这支持的整数范围为 `-2,147,483,648` 到 `2,147,483,647`。如果您计划使用此字段名称，则值需要在 `ifld1`\
  \ 到 `ifld4` 范围内。此字段使用的字段名称不能在同一个后台元素中用于其他不同的字段。***注意：*** *如果该字段用于捕获电话号码，建议您将该字段用作文本字段；换句话说，字段名称可以是\
  \ `vfld1` 到 `vfld15`。* **FLOAT（实数）字段（`ffld1` - `ffld4`）**：如果您计划使用该字段输入浮点数，请使用此字段名称。字段名称需要在\
  \ `ffld1` 到 `ffld4` 的范围内。**最后修改日期（`lastModified`）**：此字段显示该 Portlet 行项目最后修改的日期。***注意：***\
  \ *如果您计划向此字段导入值，请勿使用此字段名称。导入时不支持此字段。* **附件字段（`ATTACHMENT_ID`）**：如果您计划使用此字段上传/导入附件，请使用此字段名称。***注意：***\
  \ *一个后台元素中只能有一个附件字段。* |\n| `Number Format Ref.` | 您可以将此数据字段留空。*注意：SuccessFactors\
  \ 创建此字段是作为未来产品开发的占位符。即使该字段显示，当前也不可用于任何配置。* |\n| `Field Display Format Ref.` | 您可以将此数据字段留空。*注意：与\
  \ `Number Format Ref.` 类似，此字段在配置用户界面中显示为未来 SuccessFactors 产品的占位符。* |\n| `Masked`\
  \ | 如果该字段中的数据需要在人员档案用户界面中受到保护而不显示，则选择 `Yes`。可用值为 `Yes` 和 `No`。*注意：如果您选择 `Yes`，则该字段中的数据将被星号屏蔽并显示为\
  \ `******`。您需要点击星号才能查看该值。* |\n| `Document Type Id` | 如果您使用此后台元素上传附件，则可以使用此数据字段对附件进行分类。此字段是一个选择列表，它提供以下值：•\
  \ 360 度多评估者附件 • 应聘面试附件 • 附件 • 候选人历史 • 证书 • 求职信 • 通用对象附件 • HRIS 附件 • 绩效评估 • 绩效附件\
  \ • 出版物 • 简历 • 用户自定义 *注意：仅当字段类型为 `Attachment_ID` 时才需要填写此字段。* |\n| `Max. File Size\
  \ KB` | 这是可以上传到后台元素中此字段的附件的最大文件大小。*注意：此处指定的文件大小应小于或等于在 Provisioning 中配置的附件最大文件大小（参见图*\
  \ *2-6**）。**您需要是经过 SuccessFactors 认证的顾问才能访问 Provisioning。目前客户无权访问 Provisioning。*\
  \ |\n| `File Formats` | 如果字段类型是附件，您可以为该后台元素定义此数据字段支持的文件格式。支持的文件格式如下：`DOC`、`PDF`、`CSV`、`HTM`、`PPT`、`XLS`、`GIF`、`PNG`、`JPG`、`JPEG`、`HTML`、`RTF`、`BMP`、`XLSX`、`DOCX`、`PPTX`、`TXT`、`XML`、`MSG`、`DOCM`、`TIF`\
  \ 和 `MP4`。 |\n| `HRIS Fields Mapping value` | 您可以将此数据字段留空。 |\n| `Earning Data Mapping\
  \ Value` | 您可以将此数据字段留空。 |\n| `Text Area Enabled` | 如果字段名称是 `VarChar`，并且您希望该字段支持多行文本，则可以选择\
  \ `Yes`。此数据字段的有效值为 `Yes` 和 `No`。 |\n| `Merge` | 默认值为 `Yes`。请勿更改此值。 |\n| `Label`\
  \ | 这是将在用户界面和 SuccessFactors 实例中显示的名称。在此数据字段中，您可以通过单击字段中显示的图标来配置语言翻译。 |\n| `Default\
  \ Label` | 这是针对您尚未配置标签的语言所显示的标签。*示例：如果实例中的语言之一是中文，并且您尚未配置中文语言的标签（有关详细信息，请参阅 `Label`\
  \ 字段），那么当您的语言是中文时，将显示在此数据字段中配置的值。* |\n| `Picklist` | 如果您的字段是一个选择列表，请选择将在此后台元素的此数据字段中显示的选择列表。*注意：在此字段中选择选择列表之前，应先在实例中配置并存在该选择列表。*\
  \ |\n| `Parent Picklist Id` | 如果您希望此字段是一个选择列表，并且它使用另一个字段作为父字段，则请输入父字段的 ID。*示例：在此后台元素中，您正在捕获如果有机会，员工愿意重新安置到哪个国家和州。您有两个字段：`Country`\
  \ 和 `State`。因此，如果您在 `Country` 字段中选择 `USA`，则州字段将显示美国的所有州。如果您在父字段中选择 `Canada`，则州字段将显示加拿大的所有省/地区。在配置\
  \ `Country` 字段时，在 `picklist` 数据字段中，您将选择 `Country` 选择列表。在配置 `State` 字段时，在 `picklist`\
  \ 数据字段中，您将选择 `State` 选择列表。在 `State` 字段的 `parent picklist ID` 数据字段中，您将输入 `Country`\
  \ 字段的 ID。* |\n| `Required` | 如果您希望此字段为必填项，则选择 `Yes`。选择 `No` 将使该字段成为可选字段。有效值为 `Yes`\
  \ 和 `No`。 |\n| `Max Length` | 在此数据字段中，您可以配置字段的最大长度。有效值如下：• `vfld1` 到 `vfld15`（4,000\
  \ 个字符） • `Start date`：日期 • `End date`：日期 • `dfld1` 到 `dfld3`：日期 • `ifld1` 到 `ifld5`：整数\
  \ `-2147483648` 到 `2147483647` • `ffld1` 到 `ffld4`：浮点数 `1.40129846432481707e-45`\
  \ 到 `3.40282346638528860e+38`（正数或负数） |\n| `Display Size` | 此数据字段未被使用。您可以将其留空。 |\n\
  \n\n\n## 使用 XML 配置背景元素\n\n您可以在 XML 中配置背景元素。您可以从 `Provisioning` 下载一份继任数据模型副本。在 `Provisioning`\
  \ 中，继任数据模型位于**继任管理**部分；点击**导入/导出数据模型**链接（见图 2-7）。在显示的页面上，选择**导出文件**选项（选择**保存**，而非**打开**），然后点击**提交**。\n\
  \n**注意**\n\n您需要一个编辑器来编辑 XML 文件。互联网上有一些免费的编辑器可供使用。`Notepad++` 和 `XMLPad` 是其中比较流行的两款。\n\
  \n使用您选择的任意编辑器打开 XML 文件。向下滚动到包含背景元素 XML 代码的部分。\n\n作为练习，我们将使用 XML 创建一个背景元素。在该背景元素中，员工将输入他们最喜欢的五个旅行目的地。他们将按\
  \ 1 到 5 的等级对这些目的地进行排序，且最多可创建五条记录。\n\n背景元素的结构如下：\n\n- 旅行目的地名称（文本字段）\n- 对该旅行目的地为何是其最爱的描述（文本区域字段）\n\
  - 旅行目的地评分（选择列表）\n- 上次访问日期（日期）\n- 附件（上传旅行目的地图片）\n\n背景元素的结构应包含在标签 `<background-element>`\
  \ 和 `</background-element>` 之间。切勿在另一个背景元素结构内构建新的背景元素；换言之，不支持嵌套背景元素。\n\n清单 2-1 显示了继任数据模型中提供的背景元素\
  \ `insideWorkExperience` 的 XML 代码。\n\n```\nInside Work History\nInside Work History\n\
  \nFrom Date\nFrom Date\n\nEnd Date\nEnd Date\n\nTitle\nTitle\n\nDepartment\nDepartment\n\
  \n清单 2-1\n背景元素的 XML 代码\n```\n\n请参考表 2-2 和 2-3，以便更好地理解此 XML 代码。如果您是 XML 新手，开发新背景元素的一个简单方法是复制现有背景元素并对其进行修改。\n\
  \n**提示**\n\n为了构建新的背景元素，我们将复制提供的背景元素并进行修改。我们将该背景元素命名为**最喜欢的旅行目的地**，其 ID 为 `favTravelDestinations`。对于类型\
  \ ID，我们从 90 开始。您可以使用 XML 文件中未使用的任何 ID。通常，对于自定义背景元素，我从 90 开始。因此，第一个自定义元素为 90，接着是\
  \ 91，以此类推。确保您使用的 ID 未被其他任何背景元素使用。不支持重复的 ID。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig7_HTML.jpg](img/499651_1_En_2_Fig7_HTML.jpg)\n\
  \n**图 2-7** 下载继任数据模型\n\n清单 2-2 显示了背景元素**最喜欢的旅行目的地**的 XML 代码。\n\n```\nFavorite Travel\
  \ Destinations\nFavorite Travel Destinations\nTest\n\nName of destination\nName\
  \ of destination\n\nDesc why this is your fav destination?\nDesc why this is your\
  \ fav destination?\n\nRate travel destination\nRate travel destination\n\nDate last\
  \ visited\nDate last visited\n\nPost PICS if any\nPost PICS if any\n\n清单 2-2\n自定义背景元素的\
  \ XML 代码\n```\n\n现在，让我们来回顾一下我们配置的 XML 代码。您会注意到，背景元素包含在标签 `<background-element>`\
  \ 和 `</background-element>` 之间。与 `favTravelDestination` 相关的所有配置都包含在这些标签内。\n\n- 背景元素\
  \ `favTravelDestination` 的 ID 在名为 `id` 的字段中提及。类型 ID 在字段 `type-id` 中提及。我们讨论过，员工最多只能输入五个条目。这在字段\
  \ `max-entries` 中提及。我们将背景元素命名为**最喜欢的旅行目的地**。\n\n```\n    Favorite Travel Destinations\n\
  \    Favorite Travel Destinations\n    Test\n```\n\n- 背景元素中的各个字段包含在标签 `<data-field>`\
  \ 和 `</data-field>` 之间。我们将目的地名称配置为文本字段，因此字段名为 `vfld1`。字段 ID 为 `destName`。该字段的标签是“Name\
  \ of destination”。\n\n```\n    Name of destination\n    Name of destination\n```\n\
  \n- 我们希望员工描述为什么这是他们最喜欢的旅行目的地。该字段需要是一个文本区域，以便条目显示在更大的文本字段中，并且我们可以滚动该字段。您会注意到 XML\
  \ 代码 `text-area-enabled` 为 `true`。如果我们不设置此项，该字段将显示为文本字段。由于该字段是描述性的，如下所示：\n\n```\n\
  \    Desc why this is your fav destination?\n    Desc why this is your fav destination?\n\
  ```\n\n- 我们希望员工按 1 到 5 的等级对旅行目的地进行评分。为此，字段应配置为选择列表，我们还需要配置一个选择列表并将其分配给该字段。如果您查看\
  \ XML 代码，会看到字段名为 `vfld11`。我们已经在“Name of destination”中使用了字段名 `vfld1`。如前所述，每个背景元素的字段名应是唯一的。您会注意到\
  \ XML 代码 `<picklist id>`。这表示该字段是一个选择列表字段。选择列表 ID 表示分配给此字段的选择列表。\n\n```\n    Rate\
  \ travel destination\n    Rate travel destination\n```\n\n- 我们希望配置一个日期字段，以记录员工上次访问该目的地的日期。由于该字段是日期字段，字段\
  \ `id` 值为 `endDate`，字段名为 `endDate`。\n\n```\n    Date last visited\n    Date last\
  \ visited\n```\n\n- 我们希望配置一个字段，以便员工在愿意分享时上传旅行照片。我们将 `field-name` 配置为 `attachment1`，并将\
  \ `document-type-id` 配置为 `Attachments`。\n\n```\n    Post PICS if any\n    Post PICS\
  \ if any\n```\n\n**提示** 如您所见，通过**管理中心**在 UI 中配置背景元素要容易得多。无论如何，这是我首选的配置背景元素的方法。作为产品路线图的一部分，`SuccessFactors`\
  \ 正在将越来越多的配置任务从 `Provisioning` 迁移到**管理中心**，以便客户可以在 UI 中配置和维护其应用程序。\n\n\n\n### 配置选项列表\n\
  \n虽然配置选项列表超出了本书的范围，但由于我们在配置自定义背景元素时使用了选项列表，因此我们将简要了解如何配置它们。在本节中，我们将了解如何在 `Picklist\
  \ Center`（选项列表中心）中创建选项列表。\n\n**注意：** SAP 已宣布所有 SuccessFactors 客户都将迁移到 `Picklist\
  \ Center`。因此，在本节中，我们将回顾如何在 `Picklist Center` 中创建选项列表。\n\n在 `Action`（操作）搜索框中输入配置步骤\
  \ **Picklist Center**。在显示的页面上（见图 2-8），点击 `+` 图标创建一个新的选项列表。如果选项列表已创建，您想对其进行维护，请在搜索框中输入选项列表的名称。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig8_HTML.jpg](img/499651_1_En_2_Fig8_HTML.jpg)\n\
  \n*图 2-8* – 配置选项列表\n\n系统会弹出一个创建选项列表的对话框（见图 2-9）。在对话框中，配置以下设置：\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig9_HTML.jpg](img/499651_1_En_2_Fig9_HTML.jpg)\n\
  \n*图 2-9* – 创建新的选项列表\n\n- **Code（代码）**：输入选项列表的代码。该代码应是唯一的。\n- **Name（名称）**：这是您正在创建的选项列表的标签。此标签将显示在选项列表字段的用户界面中。\n\
  - **Status（状态）**：选项列表的状态需要设置为 `Active`（激活）才能使用。如果您不再需要该选项列表，则将其状态更改为 `Inactive`（停用）。\n\
  - **Effective Start Date（生效开始日期）**：这是选项列表激活并在实例中可用的日期。作为一种实践，我们将此日期配置为 `01/01/1900`。\n\
  - **Display Order（显示顺序）**：默认情况下，显示顺序为 `Alphabetical`（按字母顺序）。其他值为 `Numeric`（数字顺序）和\
  \ `Custom`（自定义顺序）。\n- **Parent Picklist（父选项列表）**：如果您正在创建的选项列表是子选项列表，请输入父选项列表的名称。\n\
  \n点击 `Save`（保存）创建新的选项列表。现在，我们将为此选项列表添加值。见图 2-10。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig10_HTML.jpg](img/499651_1_En_2_Fig10_HTML.jpg)\n\
  \n*图 2-10* – 向选项列表添加值\n\n在显示的页面上，点击 `+` 图标。然后为这些设置输入以下值：\n\n- **External Code（外部代码）**：SuccessFactors\
  \ 中的所有模块都通过外部代码进行通信。`External Code` 设置是该特定选项列表值的 ID。在一个选项列表内，请确保外部代码是唯一的。\n- **Label（标签）**：这是选项列表值的标签。此标签将显示在选项列表的用户界面中。建议做法是，标签应具有含义且易于理解。\n\
  - **Status（状态）**：如果您希望显示该选项列表值，则状态应为 `Active`（激活）。如果该值不再使用，则其状态将为 `InActive`（停用）。\n\
  - **Non-unique External Code（非唯一外部代码）**：默认情况下，系统会从 `External Code`（外部代码）字段复制值。保留此字段是为了在迁移后维护旧版选项列表的外部代码。请勿更改此字段中显示的值。\n\
  \n点击 `Save`（保存）以保存这些值。以类似的方式，为该选项列表输入其他值（见图 2-11）。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig11_HTML.jpg](img/499651_1_En_2_Fig11_HTML.jpg)\n\
  \n*图 2-11* – 配置选项列表值\n\n**提示：** 创建选项列表后，如果在选项列表字段中看不到新创建的选项列表，请在 `Action`（操作）搜索框中输入配置步骤\
  \ **OData API Metadata Refresh And Export**（OData API 元数据刷新和导出）。在显示的页面上，点击 `Cache`（缓存）字段旁边的\
  \ `Refresh`（刷新）按钮（见图 2-12）。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig12_HTML.jpg](img/499651_1_En_2_Fig12_HTML.jpg)\n\
  \n*图 2-12* – OData API 元数据刷新\n\n这将刷新缓存。刷新后，您将能够在选项列表值中看到新创建的选项列表。\n\n创建了背景元素后，在下一节中，我们将讨论如何将背景元素添加到员工档案中。\n\
  \n### 配置人才档案\n\n我们配置的背景元素需要显示在员工门户中。在员工档案中显示背景元素是一个两步过程。\n\n1.  在配置步骤 `Configure\
  \ People Profile`（配置员工档案）中，将背景元素分配给一个版块和一个区块。\n2.  分配所需的权限，以便背景元素显示在员工档案中。\n\n在下一节中，我们将讨论如何将背景元素分配给一个区块。\n\
  \n## 员工档案区块\n\n如果要在员工档案中显示背景元素，则需要将该背景元素分配给一个区块。此分配在配置步骤 `Configure People Profile`\
  \ 中完成。您可以通过转到管理中心并单击 `Configure People Profile`（配置员工档案）来访问该配置步骤。\n\n在讨论配置步骤之前，在本节中，我们将回顾系统中可用的不同区块。\n\
  \n\n\n### 人才模块\n\n此处列出的人才模块类别，用于展示来自人才解决方案的员工相关数据，例如绩效与目标管理、薪酬与浮动薪酬、继任计划以及发展计划。表\
  \ 2-4 对这些模块进行了说明。\n\n**表 2-4**\n人才模块\n\n| 模块名称 | 模块说明 |\n| --- | --- |\n| 个人档案趋势信息\
