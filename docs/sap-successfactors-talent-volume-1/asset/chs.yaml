  \ 2-6。\n\n**表 2-6** 薪酬信息\n\n| 区块名称 | 区块描述 |\n| --- | --- |\n| 薪酬信息 | 此区块显示员工的薪酬详细信息，例如薪酬类型、薪酬组、薪资等级、奖金目标、薪酬比率和渗透率。\
  \ |\n| 非经常性薪酬组件 | 此区块显示非经常性薪酬组件，例如奖金。 |\n| 备选成本分配 | 如果员工被分配到多个成本中心，这些详细信息将显示在此区块中。\
  \ |\n| 一次性扣除 | 此区块显示员工的单次扣款。 |\n| 预支资格 | 此区块显示预支工资的资格详情。 |\n| 当前预支款 | 此区块显示员工已领取的预支工资。\
  \ |\n| 薪资信息 | 此区块显示员工的薪资详细信息。*注意：如果薪资外包给第三方薪资提供商，则不要启用此区块。* |\n| 总薪酬历史 | 这是一个小组件。该小组件以图形格式显示员工的薪酬历史。\
  \ |\n| 经常性扣除 | 此区块显示对员工工资的经常性扣除。 |\n\n### 自定义区块\n\n自定义区块（见表 2-7）包含用于收集员工数据的对象，且独立于任何\
  \ SuccessFactors 模块。例如，有关管理经验的详细信息将在背景元素中捕获，并显示在个人档案背景信息区块中。\n\n**表 2-7** 自定义区块\n\
  \n| 区块名称 | 区块描述 |\n| --- | --- |\n| 个人档案背景信息 | 此区块显示背景元素中的数据。背景元素可以是自定义构建的，也可以由\
  \ SuccessFactors 提供。 |\n| 个人档案用户信息 | 此区块显示员工的基本详细信息，如名字、姓氏等。 |\n| 徽章 | 此区块显示员工已获得的徽章。自定义徽章和系统提供的徽章均显示在此区块中。*注意：如有需要，您可以配置与您组织文化相符的自定义徽章。*\
  \ |\n| 标签 | 您可以针对特定技能、经验或兴趣等为员工添加标签。您可以使用这些标签来搜索具有特定技能或兴趣的员工。 |\n| 备注 | 这是一个文本区域区块，可以输入和显示备注。通常，备注区块由\
  \ HR 或经理用于输入与员工相关的备注。如果备注区块由 HR 或经理使用，则员工通常没有查看该区块的权限（即，该区块将对员工隐藏）。 |\n| 组织架构图 |\
  \ 此区块显示员工与其经理之间的汇报关系。如果员工有直接下属，则也会显示该员工的直接下属。点击显示的头像时，系统将带您进入该特定员工的个人档案。 |\n| LinkedIn\
  \ | 此区块是一个小组件，用于显示员工的 LinkedIn 个人资料。您可以配置个人档案与 LinkedIn 之间的集成，以在个人档案中动态显示 LinkedIn\
  \ 个人资料。 |\n| 个人档案趋势信息 | 此区块显示员工的评级信息。评级信息来源于绩效评级、目标评级以及绩效与潜力对比评级等数据。 |\n\n#### 添加分区\n\
  \n在个人档案中，分区允许您将不同的组件逻辑地分组。一个分区由一个分区标题和子分区组成。一个分区可以包含任意数量的子分区。\n\n一个个人档案可以包含任意数量的分区。\n\
  \n在图 2-13 中，标题“福利”和“人才档案”是分区。如图所示，通过将个人档案分类为分区并添加包含背景元素的子分区，可以为用户呈现一个更简洁、更友好的个人档案。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig13_HTML.jpg](img/499651_1_En_2_Fig13_HTML.jpg)\n\
  \n**图 2-13** 分区/子分区\n\n要创建分区，请前往管理后台并选择“配置个人档案”。在显示的页面中，滚动到页面底部。点击“添加新分区”按钮。\n\n\
  将创建一个新分区（见图 2-14）。在“编辑分区：无标题”下，输入分区名称，然后点击“保存”。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig14_HTML.jpg](img/499651_1_En_2_Fig14_HTML.jpg)\n\
  \n**图 2-14** 创建分区\n\n**提示**\n\n您可以通过点击“编辑分区”下显示的地球图标，以多种语言添加分区标题。或者，当您点击“应用于所有语言”按钮时，您输入的标题也可用于其他语言。\n\
  \n\n\n### 添加模块\n\n你可以将模块添加到新建的区域。首先，为小节添加标题（见图 2-15）。点击区域中显示的小节（在我们的“测试”区域中，该小节目前没有标题）。此时将显示设置“编辑小节：无标题”。输入小节的标题，然后点击“保存”。\n\
  \n> **注意**  \n> 请参阅本章的“人员档案模块”部分，以了解更多关于模块以及可供配置的不同类型模块的信息。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig15_HTML.jpg](img/499651_1_En_2_Fig15_HTML.jpg)\
  \  \n*图 2-15 – 创建模块*\n\n若要在小节中添加模块，请浏览可用的模块以找到要添加的模块。将该模块拖拽至你希望其显示的小节中。\n\n如果该小节已满（即该小节中已配置了两个模块），请将模块悬停在两个模块之间，或悬停在模块与下一个小节之间。系统将自动创建新的小节。\n\
  \n> **提示**  \n> 将模块移动到小节时，如果你在模块中看到红色勾选标记，则表示系统没有足够的空间将该模块放入该特定小节。当系统能够将模块放入小节时，你会注意到模块右上角出现绿色勾选标记。\n\
  \n将模块移动到小节后，你会注意到需要添加详细信息，例如模块标题和描述，以及选择评分显示方式的选项（见图 2-16）。标题为必填字段，并会显示在人员档案中。你在配置中输入的描述会作为上下文帮助文本显示在人员档案中。保存你的配置。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig16_HTML.jpg](img/499651_1_En_2_Fig16_HTML.jpg)\
  \  \n*图 2-16 – 配置模块*\n\n当你配置`个人档案背景信息`模块时，你会注意到还需要进行额外的配置。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig17_HTML.jpg](img/499651_1_En_2_Fig17_HTML.jpg)\
  \  \n*图 2-17 – 重复条目*\n\n- **背景元素**：系统会显示系统中所有可用背景元素的配置设置列表。你选择希望在人员档案中显示的背景元素。\n\
  - **重复条目标题**：在背景元素模块中，用户可以创建多条数据条目。你可以选择是否为每个单独的条目设置标题。该背景元素中配置的列可供你选择。或者，你也可以选择`无`。如果选择`无`，则系统会将多条数据条目显示为单个无标题的模块。在图\
  \ 2-17 中，我们有两个不同的小节显示背景元素：`组织内工作经验`和`职能经验`。在背景元素`组织内工作经验`中，我们将`标题`列作为重复条目的标题，而在背景元素`职能经验`中，我们选择`无`作为重复条目的标题。因此，不同的数据条目显示为单个模块。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig18_HTML.jpg](img/499651_1_En_2_Fig18_HTML.jpg)\
  \  \n*图 2-18 – 以表格视图显示的背景元素*\n\n- **模块大小**：选项包括`小`和`大`。选择`小`时，背景元素会显示在小节的一列中。选择`大`时，背景元素会显示在小节的两列中。\n\
  - **模块布局**：选项包括`列表视图`和`表格视图`。图 2-17 中显示的背景元素为列表视图。背景元素中的条目以滚动列表的形式显示。图 2-18 中的背景元素以表格视图显示。在表格视图中，背景元素的列显示为列标题，不同的条目显示在单独的行中。\n\
  \n你可以在一个区域中添加任意数量的模块。当你向区域添加模块时，系统会自动创建新的小节。如图 2-16 所示，每个小节显示两列；因此，你可以在每个小节中配置两个模块。有些模块（如`LinkedIn`和`徽章`）较宽，占据两列。因此，在这些小节中，你只能配置一个模块。\n\
  \n> **提示**  \n> 在配置区域或小节时，如果你想返回到可用模块，请点击`编辑区域`/`编辑小节`配置视图右上角显示的`X`图标。此时将显示可用模块配置视图。\n\
  \n#### 配置常规设置\n\n在`配置人员档案`配置页面的顶部，你会看到一个名为`常规设置`的区域。你可以通过勾选/取消勾选选项来启用或禁用这些设置（见图\
  \ 2-19）。\n\n表 2-8 总结了每个选项。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig19_HTML.jpg](img/499651_1_En_2_Fig19_HTML.jpg)\
  \  \n*图 2-19 – 人员档案：常规设置配置*\n\n**表 2-8：常规设置配置选项**\n\n| 配置设置 | 描述 |\n| --- | ---\
  \ |\n| 允许员工编辑背景图片 | 启用此选项后，员工可以上传自己的背景图片到个人资料头部。 |\n| 管理人员背景图片库 | 图片库维护着可供员工选择的图片存储库。作为管理员，你可以维护可供员工使用的图片。\
  \ |\n| 允许员工录制姓名发音 | 如果勾选，员工将获得在人员档案中访问`我的姓名`的权限。用户可以使用此功能录制关于如何发音其姓名的简短音频片段。用户也可以输入其音标拼写。**注意：**\
  \ 在复选框下方，你会看到一个指向`阅读我的姓名协议`的链接。该协议规定所有媒体内容均存储在位于德国的 SAP 数据中心。此链接/协议不对用户开放。 |\n|\
  \ 允许员工录制关于我的视频 | 如果勾选，员工将获得在人员档案中访问`关于我`的权限。用户可以使用此功能录制关于自己的简短视频片段。该视频片段将在人员档案中该员工的个人资料头部内提供。**注意：**\
  \ 在复选框下方，你会看到一个名为`阅读关于我协议`的链接。该协议规定所有媒体内容均存储在位于德国的 SAP 数据中心。此链接/协议不对用户开放。 |\n| 允许员工输入简介文字\
  \ | 启用此选项后，员工可以输入关于自己的简介文字，最多 500 个字符。简介文字将在人员档案中该员工的个人资料头部内提供。 |\n| 显示完成百分比 | 如果启用此选项，最终用户会看到其人员档案中显示完成百分比的图标。员工可以使用档案完成向导来完成其档案。**注意：**\
  \ `显示完成百分比`仅对该特定员工可见（即，当他们以“自己”的身份查看其人员档案时），对其他任何用户/角色（包括管理员角色）均不可见。 |\n\n\n\n###\
  \ 配置标头字段\n\n如图 2-20 所示，你可以点击“`配置标头字段`”链接，以配置应在“`人员档案`”标头中显示哪些数据字段。\n\n默认情况下，标头中可显示以下字段：\n\
  \n-   员工照片\n-   员工姓名\n-   `用户 ID`\n-   职位头衔\n-   员工所在组织详情，例如部门、分部、地点\n-   时区（由员工选择）\n\
  -   当地时间（员工所在时区）\n-   `电子邮件`\n-   电话号码\n-   `Facebook` 和 `LinkedIn` 徽标\n\n系统还允许你选择最多三个你在系统中配置的自定义数据字段。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig20_HTML.jpg](img/499651_1_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20  \n人员档案：配置标头设置\n\n当你点击“`配置标头字段`”链接时，会显示可供配置的字段（见图 2-20）。在显示的页面上，你可以勾选/取消勾选希望显示在“`人员档案`”标头中的字段。\n\
  \n要配置自定义字段，你需要勾选“`自定义字段`”。一旦勾选，选择列表便会启用。你可以从选择列表中选择任意可用字段显示在档案标头中。\n\n**注意：** 员工需要获得权限才能查看“`人员档案`”标头中的某个字段。作为管理员，我们在进行此配置时所做的只是启用那些可以在“`人员档案`”和档案标头中被编辑/设为可见的字段。员工需要被授予\
  \ `自身` 的相应权限才能查看或编辑某个字段。其他角色，如`经理`、`上级经理`、`HR` 和`同事`，也需要拥有相应的权限。例如，你可能有一个要求，即`Facebook`\
  \ 仅应对员工本人和 `HR` 可见（角色为 `自身`）。在这种情况下，你只需向 `自身` 和 `HR` 角色授予权限。其他角色（如`经理`、`上级经理`、`HR`\
  \ 和`同事`）将没有查看或编辑的权限。\n\n### 配置人才数据设置\n\n在“`人才数据设置`”区域（见图 2-21），你可以配置等级评分应在“`人员档案`”中显示的日期范围。你还可以配置这些评分的来源。这些来源是系统中已配置并可用的不同表单。你也可以将进行中的表单作为数据源包括在内。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig21_HTML.jpg](img/499651_1_En_2_Fig21_HTML.jpg)\n\
  \n图 2-21  \n人员档案：配置人才数据设置\n\n**提示：** 建议你选择所有数据源。这样你就可以查看员工历年的评分。\n\n#### 设置对 Portlet\
  \ 的权限\n\n我们需要为不同角色（如员工（`自身`）、`HR`、`经理`、`直接上级`及更高级经理）设置对“`人员档案`”中不同 portlet 和数据字段的编辑/查看功能的权限。在下一节中，我们将回顾如何为不同角色配置权限。\n\
  \n#### 经理权限角色\n\n你将权限分配给一个角色，并将该角色分配到一个权限组（见图 2-22，你可以在其中访问与权限相关的配置步骤）。员工需要被分配到一个权限组，才能导航操作\
  \ `SuccessFactors`。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig22_HTML.jpg](img/499651_1_En_2_Fig22_HTML.jpg)\n\
  \n图 2-22  \n设置用户权限\n\n在开始配置之前，负责配置权限的顾问/团队需要了解需要哪些权限组，并且需要为每个组分配权限。一个员工可能被分配到多个权限组。重要的是，要考虑分配给员工的不同权限组之间不应相互抵消。例如，假设一个员工被分配到一个无权查看其他员工业绩评分的组，同时又分配到了一个有权查看其他员工业绩评分的组。在这种情况下，系统会判定拥有查看权限的组优先于没有查看权限的组。\n\
  \n客户通常会询问 `HR`、经理或 `HR` 支持台如何知晓员工是否在“`人员档案`”中更新了信息。例如，如果员工更改了姓名或家属信息，`HR` 需要了解此变更，以便支持后续流程。如果没有部署\
  \ `Employee Central`，`HR` 就无法收到任何姓名更改的通知。因此，在这种特定场景下，需要告知业务部门：姓名将仅对员工本人（`自身`）可见，且只有\
  \ `HR` 拥有编辑能力。\n\n在审查各模块的权限时，你需要与业务部门确认谁将维护这些模块中的数据。你应该仔细填写权限工作簿，确定参与者（`HR`、`经理`、`经理+1`\
  \ 等）以及他们对每个模块拥有的权限（编辑/查看）。\n\n**提示：** `SuccessFactors` 中有一些预定义的报表，你可以在基于角色的权限（`RBP`）配置期间执行以提供支持。这些报表如下：\n\
  \n-   `RBP 用户到角色报表`：此报表列出了授予用户的所有权限角色，以及分配给该权限角色的目标人群。\n-   `RBP 权限到用户报表`：此报表列出了所有权限以及被授予特定权限的用户。\n\
  -   `RBP 用户到组报表`：此报表列出了用户及其所属的权限组。\n-   `RBP 权限角色报表`：此报表列出了已授予的权限角色及其分配的目标人群。\n\n\
  \n\n#### 需要分配的权限\n\n`People Profile` 很可能是 `SuccessFactors` 中最重要的对象。在 `SuccessFactors`\
  \ 中，它是比其他任何对象都更频繁被查看/编辑的对象。因此，正确捕获和配置权限要求至关重要。当系统中存在多个模块时，配置与人员档案相关的权限会更具挑战性。在配置权限时，您需要谨慎行事，避免最终创建超出必要的过多权限组或权限角色。\n\
  \n> **提示**  \n> 通常，会为每个 `SuccessFactors` 模块维护一个权限工作簿。虽然这是实施过程中的标准方法，但对于安全管理员来说，这无法提供任何关于这些权限如何与现有权限组和角色合并的见解。\n\
  \n图 2-23 展示了一个权限工作簿的快照，这是我通常在进行实施时所使用的。在左侧，我们列出了系统中所有可用的权限。在右侧，我们确定了不同的执行者，例如所有用户、员工组、主管（通常指直属经理及以上级别）等。然后，我们确定谁需要哪些权限的访问权限。我发现，维护一个通用的权限工作簿，可以大大减轻权限需求收集和配置的压力，同时也有助于安全管理员理解\
  \ `SuccessFactors` 安全架构的整体蓝图。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig23_HTML.jpg](img/499651_1_En_2_Fig23_HTML.jpg)\
  \  \n*图 2-23 – 权限工作簿*\n\n> **注意**  \n> 详细审阅权限工作簿超出了本书的范围。\n\n在表 2-9 中，我们将审阅访问 `People\
  \ Profile` 中特定对象需要分配哪些权限。\n\n**表 2-9 – 权限**\n\n| 待访问对象 | 权限名称 | 描述 |\n| --- | ---\
  \ | --- |\n| `People Profile` | `User Permissions ➤ General User Permission ➤ Live\
  \ Profile Access` | 此权限应分配给所有需要访问 `People Profile` 的用户。 |\n| 在 `People Profile`\
  \ 中配置的区块和板块 | `User Permissions ➤ Employee Views` | 控制 `People Profile` 中配置的板块的可见性。`Employee\
  \ Views` 中列出了 `People Profile` 中配置的不同板块。您可以勾选/取消勾选需要分配给此权限角色的板块。 |\n| `People Profile`\
  \ 中的数据字段 | `User Permissions ➤ Employee Data` | 查看员工数据的权限在此权限中列出。您可以控制哪些字段/背景元素可以被哪个权限角色编辑或查看。**注意：**\
  \ 您可以对单个 HRIS 字段（例如 `First Name`、`Last Name`、`Address 1` 等）进行权限设置。背景元素（系统提供的和自定义的）仅能作为独立的背景元素进行权限设置。\
  \ |\n\n#### 导入与导出数据\n\n我们可以将数据导入到系统中配置的任何背景元素中。目前，从非 MDF 背景元素导出数据的唯一方式是通过报表。\n\n\
  要将数据导入到非 MDF 背景元素，您可以转到管理后台并点击 `Import Extended User Information`。\n\n> **注意** \
  \ \n> 您可以通过转到管理后台并点击 `Import and Export Data` 来导出和导入基于 MDF 的背景元素的数据。讨论基于 MDF 的背景元素超出了本书的范围。当\
  \ `SuccessFactors Employee Central` 在系统中时，会使用基于 MDF 的背景元素。\n\n### 导入扩展用户信息\n\n在配置步骤\
  \ `Import Extended User Information`（参见图 2-24）的登录页面上，选择 `Background Information`\
  \ 选项以将数据导入到背景元素中。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig24_HTML.jpg](img/499651_1_En_2_Fig24_HTML.jpg)\
  \  \n*图 2-24 – 背景信息数据导入*\n\n点击 `Download Data Import File Template` 下载我们将使用的导入模板。该模板包含系统中所有非\
  \ MDF 背景元素的结构。我们只会使用将要为其导入数据的背景元素。因此，您需要删除本次导入不会用到的背景元素结构。\n\n图 2-25 显示了我们之前配置的背景元素\
  \ `Favorite Travel Destinations` 的列。我们仅为此背景元素导入少量员工的数据。\n\n我们将按照以下格式填写数据：\n\n- **`^UserID`**：输入您要为其导入数据的员工的\
  \ UserID。  \n  > **注意**  \n  > 您可以从 UDF 文件（“用户数据文件”）中获取 UserID。您可以通过转到管理后台并点击 `Employee\
  \ Export` 从系统中导出 UDF 文件。\n- **`^AssignmentID`**：此列可以留空。\n- **`favTravelDestinations`**：此列的值始终为\
  \ `favTravelDestinations`。此值是静态的。\n- **`destName`**：输入目的地名称。针对本次导入，我们的值将是 `London,\
  \ England`。\n- **`destDesc`**：此列将包含为什么这是首选目的地的描述。我们的值将是 `“I love everything about\
  \ London.”`  \n  ![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig25_HTML.jpg](img/499651_1_En_2_Fig25_HTML.jpg)\
  \  \n  *图 2-25 – 用于导入数据的导入模板*\n- **`rateTravelDest`**：我们的值将是 `Rank 5`。  \n  > **注意**\
  \  \n  > 在背景元素中，字段 `rateTravelDest` 是一个选择列表字段。您需要查看选择列表以获取您在此处使用的实际值。您需要在此列中输入选择列表值的标签。\n\
  - **`endDate`**：此字段在用户界面中的标签是 `Date Last Visited`。我们将使用值 `7/3/2017`。\n\n在配置步骤 `Import\
  \ Extended User Information`（参见图 2-25）中，选择单选按钮 `Background Information`。选择适当的区域设置和字符编码。根据我们这里的讨论，我们将选择\
  \ `English US` 和 `Unicode (UTF-8)`。\n\n在 `Specify Additional File Options` 部分，您有三个选项：\n\
  \n- **通过增量添加数据导入**：选择此选项时，文件中的数据将被添加到员工记录中的现有数据中。如果导入文件中没有某员工的记录，但系统中已存在该记录，则现有记录不受影响。\n\
  - **通过覆盖现有数据导入**：此选项将覆盖现有数据。因此，如果员工 `1000` (UID) 存在此背景元素的现有记录，且该员工未出现在导入文件中，则其数据将被擦除。使用此选项时请谨慎。\n\
  - **通过覆盖现有数据导入（为优化性能推荐）**：此选项将使用文件中的现有数据覆盖数据。如果系统中的数据与文件中的数据相同，则该记录将被跳过。\n\n对于本次导入，我们将选择“通过增量添加数据导入”选项。\n\
  \n点击 `Choose File` 并上传文件。点击 `Import Extended User Data File` 以导入文件。系统现在将显示一个对话框。阅读对话框内容后点击\
  \ `Yes`。\n\n访问 `People Profile` 并检查背景元素。您会注意到数据已成功导入。\n\n\n\n## 导出数据的计划任务\n\n如果您拥有`Provisioning`的访问权限，则可以配置后端作业来计划导出。在`Provisioning`中，进入`管理作业计划程序`部分的配置步骤`管理计划任务`。在显示的页面中，点击`创建新作业`。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig26_HTML.jpg](img/499651_1_En_2_Fig26_HTML.jpg)\n\
  \n**图 2-26** 计划导出数据的作业\n\n如图 2-26 所示，输入作业名称和作业所有者。在`作业类型`中，选择`实时用户档案导出`。在`作业参数`中，选择`背景信息`，然后选择`包含附件`。在“选择导出内容”部分，选择`仅导出扩展数据`。\n\
  \n在`服务器访问`中，您需要输入 SFTP 的详细信息。\n\n> **注意：** 所有`SuccessFactors`客户都将有权访问`SuccessFactors`提供的\
  \ SFTP。有时，客户可能更倾向于使用他们自己的 SFTP。请与客户确认他们的偏好。\n\n在`文件访问`中，输入您希望将导出的文件存放到的文件夹。\n\n\
  在`作业发生与通知`中，将作业配置为仅执行一次。\n\n保存作业。在作业页面上，提交作业并立即执行。当作业成功执行后，登录 SFTP，您应该会在您在`Provisioning`中配置的文件夹中看到导出的文件。\n\
  \n> **提示：** 您可以在`Provisioning`中配置作业，以将数据导入到背景元素。将导入文件放到 SFTP 的特定文件夹中。配置并执行作业。计划任务将使用该文件并相应地更新背景元素。\n\
  \n### 使用集成中心导出背景元素数据\n\n虽然`集成中心`通常用于为集成创建数据文件，但您也可以使用`集成中心`来导出背景元素的数据。您可以通过前往`管理中心`并点击`集成中心`来访问`集成中心`。在显示的页面上，点击`我的集成`。这将打开一个新页面，显示所有在`集成中心`中配置和可用的集成。点击`创建`并选择`计划简单文件输出集成`来创建一个新的集成。\n\
  \n在搜索框中，输入您要导出数据的背景元素的 ID（参见图 2-26）。在我们的讨论中，我们将输入`favTravelDestinations`。在同一页面的右侧，您将看到该背景元素中配置的字段。选择您希望包含在导出文件中的字段。点击`选择`。在下一页，您可以输入文件名以及文件输出格式。点击`下一步`。此处会显示背景元素中的数据。在显示的页面中，您还可以选择重命名列标题以及数据格式。如果需要，您还可以通过拖放来更改列的顺序，以按照您希望的顺序排列。\n\
  \n> **提示：** 当您使用`Provisioning`中的计划任务导出数据时，重命名列标题或配置数据格式的选项是不可行的。因此，一些客户更喜欢使用`集成中心`来导出数据。\n\
  \n在数据显示的页面中，您可以右键单击任何列标题。这将显示可用于配置该特定列的选项。\n\n在`目标设置`选项中，您可以配置 SFTP 详细信息、文件名以及希望生成文件存放的文件夹。在`计划`选项中，您可以配置此作业的执行时间和频率。参见图\
  \ 2-27。\n\n> **注意：** 您还可以通过在`报告中心`创建基于表格的报告来导出数据。如您所见，我们有多种导出数据的选项。您选择哪种选项取决于业务需求。例如，如果您只需要一次性或按需导出数据，那么优先使用报告导出。如果导出的数据将被其他应用程序使用，那么您可以使用`集成中心`或`Provisioning`中的计划任务来导出数据。与`Provisioning`中的计划任务相比，`集成中心`相对较新，因此`Provisioning`中的计划任务更常见且更受欢迎。\n\
  \n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig27_HTML.jpg](img/499651_1_En_2_Fig27_HTML.jpg)\n\
  \n**图 2-27** 使用集成中心导出数据\n\n## 案例研究\n\n在本节中，我们将回顾一个案例研究，其中我们将在`人员档案`中配置趋势元素，并将历史数据导入这些元素。\n\
  \n### 描述\n\n客户 A 希望在`人员档案`中配置趋势元素，并且希望这些元素仅对直线经理和 HR 经理可见和可编辑。员工将无法访问这些趋势元素。客户希望将`绩效`和`潜力`模块分别标记为“仅限绩效经理/HR\
  \ 查看”和“仅限潜力经理/HR 查看”。\n\n客户 A 还希望将历史遗留数据加载到这些趋势元素中。\n\n\n\n### 解决方案\n\n背景元素 `sysOverallObjective`、`sysOverallCompetency`、`sysOverallPerformance`、`sysOverallPotential`、`sysOverallCustom1`\
  \ 和 `sysOverallCustom2` 被称为*趋势元素*。\n\n我们将像配置其他背景元素一样，在人员档案中配置它们。\n\n**步骤 1：** 我们将检查趋势元素的结构，并在需要时启用它们。前往管理中心，点击“管理业务配置”。\n\
  \n在显示的页面上（见图 2-28），点击“员工档案”部分，然后点击“背景元素”。向下滚动，并点击 `sysOverallPerformance`。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig28_HTML.jpg](img/499651_1_En_2_Fig28_HTML.jpg)\n\
  \n图 2-28\n\n启用 `sysOverallPerformance`\n\n检查“已启用”字段的值是否为“是”。如果不是，请从下拉菜单中选择“是”，然后点击“保存”。这将启用该趋势元素。\n\
  \n**注意**\n\n“评分字段”部分用于趋势元素。这些字段显示评分数据。在评分字段中，转到“评分”字段，然后点击“详细信息”。在显示的页面上，确保“已启用”字段为“是”，并且“插入评分”字段为“是”。点击“保存”以保存更改。\n\
  \n类似地，启用趋势元素 `sysOverallPotential`，并在需要时对“评分字段”进行更改。\n\n**步骤 2：** 现在，我们将通过前往管理中心并点击“配置人员档案”来在人员档案中配置这两个趋势元素。在显示的页面上（见图\
  \ 2-29），滚动到“人才档案”部分。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig29_HTML.jpg](img/499651_1_En_2_Fig29_HTML.jpg)\n\
  \n图 2-29\n\n在人员档案中配置 `sysOverallPerformance`/`sysOverallPotential`\n\n在“可用块”列表中，滚动到“人才”部分。该部分的第一个块是“个人档案趋势信息”。选择该块并将其拖放到“人才档案”部分。这将显示“编辑块属性”（见图\
  \ 2-30）。在编辑页面上，在“趋势元素”下拉菜单中，选择趋势元素“绩效 **仅经理可见”。这就是我们在上一部分中检查的块 `sysOverallPerformance`。现在，将“块标题”更改为“绩效\
  \ **经理/HR 可见”。更新描述以反映“块标题”设置。点击“保存”以保存更改。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig30_HTML.jpg](img/499651_1_En_2_Fig30_HTML.jpg)\n\
  \n图 2-30\n\n编辑块 `sysOverallPerformance`\n\n类似地，配置块 `sysOverallPotential`。将分区标签更改为“绩效和潜力\
  \ 仅经理/HR 可见”。记得勾选选项“在档案上显示此分区”。点击“保存”以保存更改。\n\n**步骤 3：** 现在，我们将通过前往管理中心并选择“经理权限角色”来将这些块的权限仅授予直线经理和\
  \ HR。选择需要授权的适当权限角色。在“用户权限”部分，滚动到“员工数据”。在显示的页面上（页面将显示在您的右侧），滚动到“背景”部分。为块“绩效 **仅经理/HR\
  \ 可见”和“潜力 **仅经理/HR 可见”选择“编辑/查看”权限。\n\n**步骤 4：** 前往您作为直线经理或 HR 身份所管理的任意员工的人员档案。滚动到“人才档案”部分。您可以查看我们刚刚配置的分区和块。请参见图\
  \ 2-31 以查看我的实例中的视图。\n\n![../images/499651_1_En_2_Chapter/499651_1_En_2_Fig31_HTML.jpg](img/499651_1_En_2_Fig31_HTML.jpg)\n\
  \n图 2-31\n\n`sysOverallPerformance` 和 `sysOverallPotential` 在人员档案中显示\n\n**注意**\n\
  \n如果您想创建块和分区/子分区，建议您探索人员档案中的 LinkedIn 块。您可以参考 SAP SuccessFactors KBA: 2085406，“如何启用\
  \ LinkedIn 集成（标准元素）- 员工档案”，以获取有关如何在人员档案中配置 LinkedIn 的详细信息。供您参考，SuccessFactors 现在提供了一个在人员档案中显示\
  \ LinkedIn 小部件的选项。您可以参考 SAP SuccessFactors KBA: 2507469，“人员档案的 LinkedIn 小部件概述 -\
  \ SuccessFactors 员工档案”，了解如何配置该小部件。\n\n## 结论\n\n在本章中，我们讨论了人员档案和人才档案。然后，我们讨论了如何在人员档案中配置块。我们研究了当前可用的两个选项：在管理中心的用户界面中配置和在继任数据模型中配置。您应该使用哪个选项取决于您自己的偏好。没有唯一的方法。两个选项都能完成任务。在本章后面，我们讨论了如何导出和导入数据。我们研究了在管理中心手动导入的选项以及在\
  \ Provisioning 中配置计划任务的选项。随后，我们回顾了如何通过在 Provisioning 中配置导出任务来导出数据。我们还讨论了集成中心和报告中心提供的选项。在本章末尾，我们通过一个案例研究，讨论了如何配置趋势元素，如\
  \ `sysOverallPerformance` 和 `sysOverallPotential`。\n\n有一件事我们没有讨论，我将其留作您的练习：将数据导入到新配置的趋势元素中。作为提示，我建议您回顾“导入扩展用户信息”部分和图\
  \ 2-24。该过程类似于为背景元素导入数据。\n\n在下一章中，我们将讨论职位档案构建器，我们将回顾职位档案构建器提供的功能，以及如何利用它为您的人才战略带来效率。\n\
  \n"
- "# 3. 职位档案构建器\n\n职位档案构建器是 SAP SuccessFactors 中的一个工具，用于维护职位元素。这些元素包括职位描述、经验、资质、技能、能力、行为、教育背景、认证和技能。职位档案构建器\
  \ (JPB) 基于 SuccessFactors 元数据框架，并且可以与 SuccessFactors 人才模块（如招聘、绩效与目标管理、职业发展、继任管理和人员档案）集成。\n\
  \n**表 3-3** 职位档案构建器对象及相关对象\n\n| 职位档案构建器对象 | 相关对象 |\n| --- | --- |\n| 系列 | 系列 – 技能\
  \ |\n| | 系列 – 能力 |\n| 角色 | 角色 – 映射的技能 |\n| | 角色 – 职位代码 |\n| | 角色 – 映射的能力 |\n| |\
  \ 角色 – 映射的人才库 |\n| | 角色 – 映射的能力行为 |\n| 能力 | 能力 – 行为 |\n| | 能力 – 能力类型 |\n| 教育背景 |\
  \ 教育背景 – 学位 |\n| | 教育背景 – 专业 |\n| 职位档案 | 职位档案 – 页眉 |\n| | 职位档案 – 认证 |\n| | 职位档案\
  \ – 身体要求 |\n| | 职位档案 – 相关行业 |\n| | 职位档案 – 学位 |\n| | 职位档案 – 雇佣条件 |\n| | 职位档案 – 简短描述\
  \ |\n| | 职位档案 – 能力 |\n| | 职位档案 – 专业 |\n| | 职位档案 – 薪酬数据 |\n| | 职位档案 – 技能 |\n| | 职位档案\
  \ – 详细描述 |\n| | 职位档案 – 页脚 |\n| | 职位档案 – 工作职责 |\n| | 职位档案 – 面试问题 |\n| 职位模板 | 职位模板\
  \ – 关联的系列 |\n| | 职位模板 – 分区 |\n\n**表 3-2** 档案内容类型\n\n\n\n| 内容类型 | 描述 | JPB 对象 |\n\
  | --- | --- | --- |\n| 职位族 | 涉及相似工作类型的职位可以归为职位族。通常，同一职位族中的职位需要相似的胜任力、技能和培训。例如：人力资源（HR）、会计等。\
  \ | `设置职位族与角色` |\n| 角色 | 与特定职位相关的预期行为和技能。在 JPB 中，角色可以与职位代码、职位分类、职位族和职务相关联。例如：会计。\
  \ | `设置职位族与角色` |\n| 胜任力类型 | 胜任力类型有助于将胜任力组织到不同类别中。例如：所有与会计角色相关的胜任力可以归类为“会计”胜任力类型。一个胜任力可以分配给多个胜任力类型。\
  \ | `胜任力类型` |\n| 胜任力 | 胜任力是一组已定义的行为。胜任力帮助组织与员工识别和评估需要发展的胜任力差距。胜任力也帮助组织和员工识别员工擅长的胜任力。员工需要具备并拥有为某个角色所定义的一组特定胜任力的经验。例如：一个名为`承担责任`的胜任力可能具有行为“对履行承诺负责；对任务和目标表现出主人翁精神；不为糟糕表现找借口或将责任推卸给他人”。因此，如果`承担责任`胜任力与某个角色相关联，我们会期望员工表现出“对他们需要交付的任务负责并具备主人翁精神”的行为。\
  \ | `胜任力` |\n| 行为 | 这是某个角色所需的一组已定义的特质。例如：人力资源业务伙伴（HRBP）角色可能需要一个名为`善于倾听`的胜任力，该胜任力可能关联着`同理心`行为。一个胜任力可以有多个关联行为。一个行为可以关联到多个胜任力。\
  \ | `分配行为` |\n| 技能 | 技能是工作所需的知识与经验的结合。员工可以通过经验、学习、指导和跟随经验丰富的人员来发展这些技能。注意：技能通过熟练程度进行评估。例如：`系统设计`是系统分析师角色所需的技能。员工可以通过教育、经验（来自过往工作）、学习（通过组织提供的学习课程）以及跟随有经验的同事来发展这项技能。`系统设计`是系统分析师工作的必备技能。要成为首席系统分析师，你需要达到熟练程度\
  \ 5 级（5/5），而初级系统分析师只需要 3 级熟练程度。 | `技能` |\n| 工作职责 | 工作职责是指分配给某个职位的一系列任务、职责和责任。例如：作为人力资源业务伙伴（HRBP），你的工作职责将包括在计算机系统中维护员工的个人档案。\
  \ | `工作职责` |\n| 相关行业 | 这是一个行业列表。某些工作可能需要特定的行业经验。此列表可以与这些特定工作相关联。例如：制造流程的系统设计与 HRIS\
  \ 业务流程的系统设计是不同的。因此，系统分析师的角色可能需要具备在制造公司工作的经验。 | `相关行业` |\n| 雇佣条件 | 这是一个就业所需条件的列表。这些雇佣条件可以是通用的，也可以是与特定工作相关的。例如：一个通用的雇佣条件可能包括工作日的办公时间。一个特定的雇佣条件可能是要求隔周周六上班。\
  \ | `雇佣条件` |\n| 学历——学位 | 这是一个学历水平列表。一些工作可能需要特定的学位级别。学位列表可能包括：完成学业、学士学位、硕士学位、博士学位等。例如：制药公司科学家的职位可能要求员工拥有博士学位。\
  \ | `学历——学位` |\n| 学历——专业 | 这是在攻读学位期间所修科目的列表。专业列表可能包含以下内容：国际商务、人工智能、有机化学等。例如：制药公司科学家的角色可能要求员工拥有有机化学博士学位。\
  \ | `学历——专业` |\n| 身体要求 | 这是一项执行工作所需的身体条件列表。例如：仓库工人可能需要频繁举起重达 20 磅的物体。 | `身体要求` |\n\
  | 认证 | 这指的是由外部机构进行的评估列表或通过教育获得的资格。例如：SuccessFactors 顾问应获得 SuccessFactors 招聘模块的助理认证。\
  \ | `认证` |\n| 面试问题 | 这是系统中维护的问题列表。这些问题可以是通用的，也可以是针对特定角色的。例如：一个通用问题可能是“你是否有在美国工作的授权？”一个针对特定角色的问题可能是，“你完成过多少次\
  \ SuccessFactors 实施？” | `面试问题` |\n\n\n\n**表 3-1**  \n`JPB` 的权限设置\n\n| RBP 权限选项 |\
  \ 权限 |\n| --- | --- |\n| 一般用户权限 | 选择`用户登录`。选择`实时档案访问`。 |\n| 元数据框架 | 选择`全部`。**注意**：选择`全部`将选中`元数据框架`选项下的所有可用权限。\
  \ |\n| 管理职位档案构建器 | 选择`全部`。**注意**：此权限授予管理职位档案及职位档案内容，以及导入/导出职位档案内容的权限。 |\n| 管理职位与技能档案可见性\
  \ | 滚动至以下权限：`职位档案`：选择`查看`、`编辑`和`导入/导出`。`JobReqJobProfile`：选择`查看`、`编辑`和`导入/导出`。`技能档案`：选择`查看`、`编辑`和`导入/导出`。\
  \ |\n| 管理职位与技能档案可见性 | `技能档案`。`分级技能（Rated Skills）`：选择`查看`、`纠正`、`创建`、`调整顺序`、`删除`和`导入/导出`。**注意**：仅当`技能档案`对象启用时，此权限才可见。\
  \ |\n\n**注意**\n在本章中，我们将`职位档案构建器`简称为`JPB`。\n\n使用`JPB`，您可以在`SuccessFactors`中为不同的内容类型构建内容库。以下是`JPB`中可用的内容类型：\n\
  \n- 职族\n- 职位角色\n- 认证\n- 胜任力，包括行为表现\n- 雇佣条件\n- 教育背景、学历\n- 教育背景、专业\n- 面试问题\n- 岗位身体条件要求\n\
  - 技能，最多五个熟练度级别\n- 相关行业\n- 工作职责，包括职务\n\n在`JPB`中开发内容后，您需要创建职位档案模板，在其中定义要包含在职位档案中的格式和章节。职位档案会关联到职位角色，而与职位角色相关的内容则来源于您将在系统中创建或导入的内容。\n\
  \n`JPB`构建于`SuccessFactors` `元数据框架 (MDF)`之上。`MDF`使您能够创建和维护对象定义、对象之间的关系以及对象层级结构。`JPB`是`SuccessFactors`旧工具`职位描述管理器\
  \ (JDM)`的继承者。`JDM`与`JPB`之间的区别在于`MDF`。如果您是现有的`JDM`客户，您可以通过将职族、角色和职位代码迁移到角色映射，并将胜任力迁移到新配置的`JPB`框架，从而升级到`JPB`。您只能在配置`JPB`之后进行此项配置。知识库文章\
  \ 2276692，“关于从 JDM 迁移到 JPB 的说明”是一份很好的参考资料。\n\n**注意**\n详细讨论`MDF`超出了本书的范围。\n\n在实施`JPB`之前，请确保客户实例满足以下前提条件：\n\
  \n- 客户应已实施`SuccessFactors`平台。\n- 客户应已实施基于角色的权限 (`RBP`)。\n- 客户应使用`V12`用户界面。\n\n**注意**\n\
  `JPB`是`SuccessFactors`平台的一个组件，无需支付额外许可费用。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig1_HTML.jpg](img/499651_1_En_3_Fig1_HTML.jpg)\n\
  \n**图 3-1** 将`JPB`与`SuccessFactors`人才管理模块集成\n\n图 3-1 展示了不同的`SuccessFactors`模块如何利用`JPB`。\n\
  \n实施`JPB`使企业中的不同职位角色能够清晰洞察所需的岗位要求、技能和胜任力。当系统中定义了岗位标准后，员工可以识别自身岗位的职位要求、明确培训需求、与主管合作规划绩效目标，并确定在企业中担任下一个职位角色所需的技能和胜任力。招聘人员可以使用`JPB`中的内容创建职位申请，并且可以通过利用与岗位相关联的比较比率和区间渗透率来进行薪酬规划。\n\
  \n**注意**\n客户会使用由第三方供应商开发的职位描述、技能和胜任力。我们可以使用此类第三方供应商提供的内容，并将其加载到`JPB`中。\n\n在本章中，我们将讨论如何配置`JPB`，以及如何将其集成到`SuccessFactors`人才管理模块中。我们将首先回顾如何在`Provisioning`中激活`JPB`。然后，我们将介绍需要设置的权限，以便访问`JPB`和不同对象，以及如何配置不同对象的可见性设置。我们将审视不同的内容类型，以及如何将数据导入到不同的内容类型中。在本章末尾，我们将通过一个案例研究，了解在真实场景中如何将`JPB`集成到`SuccessFactors`模块中。本章将提供关于如何在企业人才战略中利用`JPB`的全面概述。\n\
  \n## 在 Provisioning 中的配置\n\n在开始使用`JPB`之前，我们需要在`SuccessFactors` `Provisioning`中激活`JPB`。在`Provisioning`的`编辑公司设置`部分，搜索`JDM\
  \ v2.0`（见图 3-2）。选中此开关。您还需要选中`技能主目录`开关。（请注意，它提示您“请确保合同中包含该内容。需要额外订阅费用。”）记得保存您的设置。如果您未激活`技能主目录`开关，您将无法在配置屏幕`管理职位档案内容`上看到来自`SuccessStore`的`添加<<内容类型>>`链接。“需要额外订阅费用”的说明已失效；因此，您可以忽略该说明。\n\
  \n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig2_HTML.jpg](img/499651_1_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2** 在`Provisioning`中激活`JPB`\n\n**注意**\n在激活`JDM v2.0`之前，您需要激活以下开关：\n\n- `启用通用对象`\n\
  - `启用附件管理器`\n\n#### 设置安全权限\n\n您需要为以下`JPB`权限配置基于角色的可见性权限：\n\n- 职位与技能可见性\n- 技能档案\n\
  - 分级技能\n\n由于`JPB`是一个基于`MDF`的对象，我们在管理屏幕`配置对象定义`上配置这些设置。按照以下各节的步骤完成配置。\n\n您可以在`管理员部分`\
  \ ➤ `管理职位与技能档案可见性`中查看这些权限。\n\n### 设置可见性：职位档案\n\n我们需要编辑`职位档案`对象定义以配置可见性设置。转到`管理中心`并点击`配置对象定义`。\n\
  \n在显示的屏幕上，第一个搜索框中选择`对象定义`。然后在搜索框中输入`职位档案`（见图 3-3）。\n\n![../images/499651_1_En_3_Chapter/499651_1_En_3_Fig3_HTML.jpg](img/499651_1_En_3_Fig3_HTML.jpg)\n\
