- '# 1. SAP SuccessFactors 人才模块简介


  ## 欢迎！


  欢迎来到 *SAP SuccessFactors 人才管理*！SAP SuccessFactors 是一组基于云平台的模块组合，涵盖整个人力资本管理（HCM）数据存储、管理和报告领域。模块包括作为核心人力资源信息系统（HRIS）的
  `Employee Central (EC)`、`Onboarding (ONB)`、`Learning Management System (LMS)`、`Recruiting
  (RCM/RMK)`、`Analytics and Planning (WFA/WFP)`、`Compensation and Variable Pay (CMP/VarPay)`
  和 `Jam`，以及一系列人才管理模块。SAP SuccessFactors 人才模块提供了一套基于 SuccessFactors 云平台构建的先进工具，适用于希望实时从全球任意位置存储和管理人才信息的客户。这些模块包括
  `Job Profile Builder (JPB)`、`Goal Management (GM)`、`Performance Management (PM)`、`360`、`Continuous
  Performance Management (CPM)`、`Calibration`、`Career Development Planning (CDP)`
  和 `Succession Management (SCM)`。利用这些基于云的工具，客户可以快速请求实例，并与 SAP 和/或经认证的 SAP SuccessFactors
  合作伙伴合作，根据自身需求对该实例进行配置。由于实例是一个仅需配置而无需编码即可运行的系统，与传统本地部署解决方案相比，云解决方案能帮助您在更短时间内、以更低资本投入启动并运行系统。本书将引导您完成每个模块的配置，并指导您使用已配置的模块，从而帮助您快速高效地实现人才解决方案。



  ## 我们将涵盖哪些内容？


  这套上下两册的书籍仅涵盖 SAP SuccessFactors 人才模块。每个章节或章节组专门介绍系统的单个模块或跨模块领域。这些章节将引导您完成每个模块的配置和使用，使您能够快速实施和应用它！章节的顺序遵循模块配置的逻辑递进。我们在每一章中都尽力做到“完整指南”的标准。我们涵盖了所有可用的配置选项，同时根据我们在为各种组织实施
  SAP SuccessFactors 的集体实际经验，为您指出推荐的选项。


  第 2 章从人才档案开始。当我们提到“人才档案”时，我们指的是人员档案和继任数据模型（SDM）中与人才相关的组件。在本章中，我们将讨论可以在人才档案中配置和显示的不同人才管理相关门户组件。我们将分享
  SAP SuccessFactors 交付的门户组件如何自动使用来自人才模块的数据进行更新。我们还将讨论如何开发自定义门户组件，如何向这些门户组件导入/导出数据，以及对这些门户组件数据的更改如何传递到下游流程，如继任管理和校准。


  第 3 章继续介绍职位档案生成器（JPB）。职位档案生成器是一个重要的工具，对于创建结构良好的职位目录至关重要。我们将讨论如何创建职位档案模板以及如何将职位数据导入实例。我们还将重点介绍
  JPB 如何与其他 SAP SuccessFactors 人才模块集成，充当职位相关数据和功能的基石。


  第 4 章和第 5 章将涵盖目标管理（GM）。目标管理是人才战略中的一个重要流程，它将员工与组织的业务目标对齐。在本章中，我们将回顾如何在 SAP SuccessFactors
  中设定和管理目标。我们从第 4 章开始，逐步讲解配置和使用一个非常基础的目标管理实施所需的所有步骤。然后，第 5 章将带我们了解替代的目标管理功能，这些功能不太常用，但可以帮助满足特定客户的具体业务需求。


  第 6 章至第 13 章深入探讨绩效管理（PM）。这些章节将讨论绩效管理模块的组成部分，以及如何让员工评估流程对您的组织有意义。第 6 章和第 7 章将逐步讲解配置一个基础绩效表单所需的步骤。一旦您的绩效表单配置完毕，第
  8 章将逐步说明如何在绩效评估流程中管理该表单。接着，第 9 章从最终用户的角度出发，带我们走过整个绩效评估过程。之后，第 10 章进入更高级的绩效管理，向您展示一些只能通过
  XML 以及翻译流程进行配置的功能。然后，第 11 章涵盖“请求反馈”、“获取反馈”、“添加修饰符”和“添加签署人”功能，这些功能有助于在常规路由图之外获取绩效意见。在第
  12 章中，我们还将探讨使用 360 度评估表单从更广泛的人群获取绩效反馈的选项。第 13 章以持续绩效管理作为结尾，近年来它作为年度绩效表单的替代和/或补充方案，其采用率越来越高。


  第 14 章和第 15 章将引导我们进入通常在绩效评估结束时进行的下一步：校准。第 14 章中，我们将讨论如何将校准整合到绩效评估流程中，以及如何将人才字段和继任数据集成到校准工具中的选项。我们将讨论如何配置校准，包括需要对
  PM 表单和路由图进行的修订。我们还将分享为使用绩效和潜力评级而对继任数据模型进行的更新。然后，在第 15 章中，我们将带您体验一次校准会话。


  最后，我们在第 16 章中以结论部分作为收尾。结论部分回顾了每一章涉及的概念和学到的经验教训。它将帮助读者总结每章已实现的目标，并在引导用户在系统启动后进入后续步骤之前，理解最终解决方案的整体业务价值。


  第二卷将深入探讨发展模块、职业工作表以及导师制（也称为职业发展规划（CDP）模块），然后是继任管理（SCM）。


  ## 关键概念


  在开始之前，让我们先介绍几个关键概念，这将有助于我们为后续章节做好准备。


  ### 实例/公司


  “实例”或“公司”是指在特定数据中心上 SuccessFactors 系统的唯一可配置分区。一个组织可能有多个实例，例如，大多数公司会在预览数据中心拥有一个测试系统，用于在实施期间以及生产后测试新功能和即将发布的特性，此外还有一个生产实例。每个实例或公司都被分配一个唯一的公司
  ID 以进行区分。实例之间的数据和配置不共享，因此组织的数据是安全的，只有他们自己可以访问。但是，存在在公司内导入/导出数据和同步配置的方法。


  ### 配置管理


  `Provisioning` 是 SAP SuccessFactors 系统中的一个区域，只有 SAP 或经过认证的 SAP SuccessFactors 合作伙伴才能访问。它允许这些资源开启特定功能、调度作业以及执行某些配置。在整本书中，我们会指出某项特定配置是否需要
  `provisioning` 权限。


  #### 基于角色的权限


  在 SuccessFactors 最初创建时（在与 SAP 合并之前），权限是分配给单个用户的。后来，SuccessFactors 引入了权限角色的概念，以更好地符合企业范围内的系统期望。基于角色的权限（RBPs）允许管理员创建代表一组权限的角色，这些权限允许访问功能和特性，以及关于特定用户组的信息。角色可以分配给权限组，权限组就是被分配了角色的用户。权限组也可以代表目标人群，即该权限组可以查看、编辑等的数据集。


  ### 搜索栏


  搜索栏允许用户无需使用更传统的菜单导航系统，即可快速访问系统中的不同功能。只需使用自动提示功能开始输入屏幕或功能的名称，系统就会开始显示与您的安全设置相关且与您的文本搜索匹配的导航选项。然后，您可以单击自动提示列表中开始出现的任何搜索结果，以导航到该屏幕。搜索栏位于屏幕顶部。


  > **注意**

  > 搜索栏也可以以相同的方式用于搜索系统中的用户并显示其个人档案。



  好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将以下英文文本翻译成中文。



  #### 用户数据文件


  用户数据文件（UDF）允许客户在系统中输入员工数据，以便人才模块可以访问这些数据。它是一个逗号分隔值（`.csv`）平面文件，其中每一列代表一个可以加载的标准字段或自定义字段。您可以下载
  `.csv` 模板，并通过在搜索栏中输入并选择“导入员工数据”来导入数据。请注意，此模板中的某些列可能会根据您的继任数据模型配置而略有不同。


  **注**：EC 客户不应直接使用员工导入界面加载用户数据文件，因为这些数据是由 EC HRIS 内部创建，或从招聘或入职模块集成的。EC 数据也可以在导入和导出数据界面中加载。EC
  数据会映射到 UDF，并从 EC 自动同步到 UDF。我们不会详细介绍此过程。有关更多信息，请参见 SAP 说明 2080728。


  #### 检查工具


  我们在每一章中都尽力以逻辑顺序指导您完成配置步骤，以避免任何配置错误。但是，错误确实会发生！如果您遇到问题，SAP 引入了“检查工具”来帮助您！鉴于该工具涵盖了大多数模块，我们不会在任何特定章节中深入探讨它。了解它的存在可以在您遇到困难时提供帮助，这很好！您可以查看
  SAP 说明 2472648 以获取更多信息。


  #### DTD


  在本地机器上编辑 XML 时，可以使用 SAP 提供的文档类型定义（DTD）文件。在尝试将正在编辑的 XML 加载到预配置系统之前，这些文件有助于检查其结构。虽然这些文件不是必需的（如果在预配置系统中上传
  XML 时结构不正确，系统会提醒您），但它们值得一提。由于每个 XML 都有一个 DTD，我们不会在任何特定章节中介绍它们。有关 DTD 的更多信息，请参见 SAP
  说明 2292731。


  #### 文本替换和管理语言


  在本书中，我们介绍了如何在每个模块中提供典型翻译。但是，有些区域看起来无法翻译，因为它们是整个平台的一部分。一些基本词汇，例如“employee”，可以使用文本替换功能进行替换。有关文本替换的信息，请参见
  SAP 说明 2089472。对于文本替换中不可用的词汇，可以使用管理语言功能进行替换。有关更多信息，请参见 SAP 说明 2576546。


  #### 移动端


  为简洁起见，我们不会深入介绍每个模块的移动端特性和功能。此外，移动应用程序的发布周期只需几周，而不是主 SuccessFactors 应用程序的半年发布周期——因此，我们在本书中提供的任何具体细节都会很快过时！


  移动应用程序可以通过 Apple App Store 和 Android Market 下载。它们提供演示模式，如果您在下载后感到好奇，可以免费试用。总的来说，其功能与主应用程序相同，但有所缩减。有关所有模块具体功能的更多信息，请参考移动端功能矩阵，该矩阵可在以下位置找到：


  [`https://help.sap.com/viewer/c3cbc8ddf8ef421d81d4b71a6f88a7a3/latest/en-US`](https://help.sap.com/viewer/c3cbc8ddf8ef421d81d4b71a6f88a7a3/latest/en-US)


  ## 让我们开始吧！


  我们希望本章为您即将开始的 SAP SuccessFactors 人才管理各个模块的旅程做好了准备。我们已经向您概述了什么是 SAP SuccessFactors，以及整个解决方案中人才管理部分的构成。我们还讨论了哪些章节涵盖了哪些模块，并概述了每个章节将要涵盖的内容。此外，我们还介绍了一些关键概念，这些概念将帮助您为理解这些章节做好准备。让我们开始吧！


