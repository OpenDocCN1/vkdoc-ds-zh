  \n```\n代码段示例\n```\n\n目标（客观）、能力、客观能力总结和绩效潜力总结部分的章节名称标签有所不同，如下所示：\n\n*   `<obj-sect-name>`\n\
  *   `<comp-sect-name>`\n*   `<summary-sect-name>`\n*   `<pp-sect-name>`\n*   `<oc-sect-name>`\n\
  \n部分介绍标签。简介、员工信息、审核日期和自定义部分将使用`<fm-sect-intro>`标签。这对应于可能在模板实例中添加的介绍文本。`<fm-sect-name>`标签的代码段示例如下：\n\
  \n```\n代码段示例\n```\n\n目标（客观）、能力、客观能力总结和绩效潜力总结部分的章节介绍标签有所不同，如下所示：\n\n*   `<obj-sect-intro>`\n\
  *   `<comp-sect-intro>`\n*   `<summary-sect-intro>`\n*   `<pp-sect-intro>`\n*  \
  \ `<oc-sect-intro>`\n\n#### 评分选项\n\n在我们对绩效表格的回顾中，我们已经展示了不同评分者可以提供不同评分的地方。评分选项决定了表格中提供的哪个评分将作为记录评分。记录评分很重要，因为它是在其他模块和报告中使用的绩效表格的最终输出。\n\
  \n评分选项属性`rating-opt`用于设置评分选项。它可以具有表 10-2 中描述的值。\n\n**表 10-2 评分选项值**\n\n| 值 | 描述\
  \ |\n| :--- | :--- |\n| `0` | 这是默认值，也是最简单的。所有用户为每个项目共享一个评分框。在 XML 中，此项目评分显示为`item-rating`。系统将使用您的权限设置来确定哪些用户可以查看和编辑此字段。实际上，具有写入权限的用户可以互相覆盖评分，因此最终路线图中具有写入权限的最后一个用户拥有最终决定权。当最终用户查看评论时，用户的评论旁边不会显示评分。\
  \ |\n| `1` | 此选项通常用于当您希望员工提供他们自己的评分（不算作官方评分）并可以与经理评分进行比较时。使用此设置，默认情况下，所有用户都可以编辑`item-rating`字段，即记录评分。您可以通过设置不同的权限来覆盖此设置。与值`0`类似，最后一个编辑评分的人决定了记录评分。除了默认权限之外，另一个关键区别是员工也将拥有自己独立的评分，他们可以在其中给自己评分。此额外评分在\
  \ XML 中显示为`item-cmt-rating`。此评分不计入记录评分。因此，您应该将员工的`item-rating`权限设置为“只读”或“无”，以防止他们错误地设置记录评分。当最终用户查看评论时，评分量表会显示在主体的评论旁边。<br>**注意：**\
  \ `item-cmt-rating`不能设置为必填。 |\n| `2` | 此选项通常用于当您希望除了员工之外，还有更多人有权查看或编辑非官方评分时。这是最具动态性的选项，因为任何角色组合都可以读取或编辑官方的和/或非官方的评分。默认情况下，每个人都授予对`item-cmt-rating`和`item-rating`的访问权限。您只需为您不希望其编辑其中一个或另一个或两者的角色设置“只读”或“无”权限。当最终用户查看评论时，评分量表会显示在所有评估者的评论旁边。<br>**注意：**\
  \ 使用获取反馈并允许编辑时，评分是用户的非官方评分，由`<item-cmt-rating>`标识。为了使其正常工作，请不要使用`rating-opt \"2\"\
  `。通过授予经理对此字段的只读权限，经理会在其`item-rating`下方看到一个额外的空白`item-cmt-rating`。除非同时从“他人评分”选项卡中隐藏`item-cmt-rating`，否则无法为经理隐藏此额外字段。使用此字段的“只读”权限，以便查看反馈提供者给出的评分。\
  \ |\n| `3` | 此选项用于当您希望只有经理才能编辑官方评分，但希望员工仍然收到一个弹出警告，提示需要他们自己的自评时。非官方的员工评分在 XML 中显示为`subject-item-rating`，经理的评分显示为`item-rating`。当最终用户查看评论时，每个用户都会看到他们的评分量表与员工的评分并列显示。\
  \ |\n\n**注意**\n\n这些选项会根据您在在线表单编辑器中的选择自动在 XML 中更改，因此无需在 XML 中编辑它们；但是，在测试表单并进行调整时，了解它们如何影响权限和记录评分非常重要。\n\
  \n**注意**\n\n有关更多信息，请参阅 SAP 注释 2185897。\n\n### EZ-Rater 图表可见性\n\n当在目标或能力部分（`sect-mode=\"\
  EZ-Rater\"`）中使用 EZ-Rater 时，每个目标或能力将有一个差距分析图，显示主体和经理评分之间的差异。要删除任何目标或能力部分中的差距分析图可见性，请在`</fm-sect-config>`的最后一行添加`<ez-rater\
  \ show-gap=\"false\" />`。此设置无法通过“管理模板”在 UI 中更新。\n\n### 部分配置标签\n\n在每个部分中，`<fm-sect-config>`标签包含该部分的一些基本设置。部分权限、必填字段和默认评分标签都可以在此标签内定义。对于目标和能力部分，该标签还将包含：\n\
