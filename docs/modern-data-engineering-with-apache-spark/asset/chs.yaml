  \ Scala 文件启动 Spark Shell\n\n此命令从示例 5-4 启动 `spark-shell`，并在后台以一致的顺序执行大量额外工作，使你能够增强由\
  \ `spark-shell` 驱动的 Spark 应用的运行时行为。当你使用 `spark-submit` 命令时（你将在后续章节中看到更多相关内容），这些相同的功能也可供你使用。\n\
  \n图 5-1 显示了启动 `spark-shell` 时的事件顺序。\n\n![](img/505711_1_En_5_Fig1_HTML.png)\n\n\
  **图 5-1** 在 Spark Shell 实例中将控制权交还给你之前执行的一系列步骤\n\nSpark Shell 扩展了 Scala REPL，使你能够使用\
  \ Apache Spark 特定的参数，并混入 Scala REPL 特定的命令。当 Spark Shell 被实例化时，所有使用 `--conf` 选项声明的运行时配置都已添加到\
  \ `SparkConf` 和 `SparkContext` 中，所有依赖项都已使用 `--packages` 选项下载并解析，并且 JAR 和相关的类路径都已加载，包括使用\
  \ `--jars` 选项定义的、需要添加到应用类路径中的任何其他本地 JAR。最后，在 `spark-shell` 初始化之后，作为最后一步，由于 Scala\
  \ REPL 的行为，任何使用 `-i <file>` 选项包含的额外 Scala 文件都会被加载。\n\n> **注意**  \n> 如果你好奇的话，REPL\
  \ 代表**读取**、**求值**、**打印**、**循环**。对于 Scala REPL 来说，这个小控制台程序读取每一行文本（作为标准输入），逐行求值（动态编译并存储类信息、变量等），然后只要没有抛出异常，就打印处理后的每一行的输出（如果有的话）。然后它将最后一行（或几行）保存到会话的命令堆栈中，最后返回到第一个读取状态（等待你的下一行输入）。整个过程成为一个从\
  \ R -> E -> P 再回到 R 的循环。\n\n掌握了图 5-1 中关于 `spark-shell` 行为的知识后，我们可以可靠地保证，由启动 `spark-shell`\
  \ 提供的 Spark 会话 (`spark`) 可以被 `spark-shell` 环境上下文中的任何 Scala 文件（使用 `-i` 包含）可靠地引用。正是这个事件顺序使你能够从\
  \ `spark-shell` 创建复合应用。这与 Zeppelin 中每个段落内动态解释 Spark 代码的过程类似。每个段落都被读取、求值（动态编译）并加载到\
  \ Spark 应用上下文中，而你无需动一根手指！\n\n让我们看看 `connect-jdbc.scala` 的源代码，如示例 5-5 所示。它包含了建立与我们的\
  \ MySQL 数据库（容器）连接所需的最少内容，并且很快就能使我们能够迭代地查询数据库并测试我们的临时查询。此源代码的完整版本位于 `ch-05/docker/examples/connect-jdbc.scala`\
  \ 的 `examples` 目录中，其中包含适用于相关情况的配置回退到默认配置值。\n\n```\n// spark: SparkSession (来自 spark-shell)\n\
  // 从 spark conf 中赋值\nval jdbcDriver = spark.conf.get(\"spark.jdbc.driver.class\"\
  )\nval dbHost     = spark.conf.get(\"spark.jdbc.host\")\nval dbPort     = spark.conf.get(\"\
  spark.jdbc.port\")\nval defaultDb  = spark.conf.get(\"spark.jdbc.default.db\")\n\
  val dbTable    = spark.conf.get(\"spark.jdbc.table\")\nval dbUser     = spark.conf.get(\"\
  spark.jdbc.user\")\nval dbPass     = spark.conf.get(\"spark.jdbc.password\")\nval\
  \ connectionUrl = s\"jdbc:mysql://$dbHost:$dbPort/$defaultDb\"\n// 加载远程 SQL 表\n\
  val df = spark\n.read\n.format(\"jdbc\")\n.options(MapString, String\n)\n.load()\n\
  ```\n\n**示例 5-5** `connect-jdbc.scala` 的源代码\n\n示例 5-4 中展示的这个部分应用直接依赖于 Spark 的核心配置，以及启动\
  \ `spark-shell` 时创建的 Spark 会话。由于它是在 `spark-shell` 完成启动应用所需的所有工作*之后*才被加载的（见图 5-1），因此在运行时，你的代码可以方便地访问所有这些内容。\n\
  \n如果你还没有尝试运行代码，现在就去运行，然后我们将更深入地探讨我们是如何在示例 5-5 的这个部分应用范围内读取配置的。\n\n\n\n#### Spark\
  \ 配置：访问模式与运行时变更\n\nSpark 配置在运行时分为两个独立的类。第一个是主要的不可变配置 `SparkConf`。这个只读对象可通过 `SparkContext`\
  \ 访问，而 `SparkContext` 又可通过 `SparkSession` 获取。此核心应用配置在应用启动时从多个位置组装而成：\n\n1. 标准 Spark\
  \ 发行版提供的默认或内部配置（由你自行构建，或下载官方构建版本）。\n2. 在 `$SPARK_HOME/conf` 中定义的 Spark 环境级别覆盖。示例文件位于\
  \ `/path/to/ch-05/docker/spark/conf/spark-defaults.conf`。\n3. 应用提交时使用 `--conf <key=value>`\
  \ 选项进行的覆盖。\n4. 应用内部配置。这些配置在构建 Spark Session 时直接指定。某些配置（如 `spark.sql.warehouse.location.dir`\
  \ 等）在应用的整个生命周期内只能设置一次。\n\n最终生成的 `SparkConf` 是不可变的，用于构造驱动程序应用的 `SparkContext`。\n\n\
  第二个配置是存储在 `RuntimeConfig` 对象中的运行时配置。它基本上是 `SparkSession` 中完全不可变配置的一个可变副本。图 5-1 是可视化\
  \ Spark 配置类型二元性的良好参考。\n\n#### 查看 SparkConf\n\n由于 `SparkConf` 是不可变的，我们只能读取对象内的值。你可以使用在清单\
  \ 5-4 中启动的 `spark-shell` 来转储当前配置。在 `spark-shell` 中，你可以使用当前的 `SparkSession`（`spark`）来获取\
  \ `SparkContext`，最后获取 `SparkConf` 本身，然后将其配置作为调试字符串打印出来。此过程如清单 5-6 所示。\n\n```\nscala>\
  \ spark.sparkContext.getConf.toDebugString\nspark.app.id=local-1613941330294\nspark.app.name=Spark\
  \ shell\nspark.driver.host=192.168.1.18\nspark.driver.port=52829\nspark.executor.id=driver\n\
  spark.home=/Users/me/install/spark-3.0.1-bin-hadoop3.2\nspark.jars=file:///Users/me/git/newfront/spark-moderndataengineering/ch-05/docker/jars/mariadb-java-client-2.7.2.jar,file:///Users/me/.ivy2/jars/mysql_mysql-connector-java-8.0.23.jar,file:///Users/me/.ivy2/jars/com.google.protobuf_protobuf-java-3.11.4.jar\n\
  spark.jdbc.default.db=default\nspark.jdbc.driver.class=com.mysql.cj.jdbc.Driver\n\
  spark.jdbc.host=127.0.0.1\nspark.jdbc.password=*********(已编辑)\nspark.jdbc.port=3306\n\
  spark.jdbc.table=customers\nspark.jdbc.user=dataeng\nspark.master=local[*]\nspark.repl.class.outputDir=/private/var/folder...\n\
  清单 5-6\n使用 spark-shell 访问并打印不可变的 SparkConf\n```\n\n你可能已经注意到，配置自动编辑了 `spark.jdbc.password`\
  \ 的值。这是 Spark 引擎设置的安全防护措施之一，并且可以使用名为 `spark.redaction.regex` 的属性来扩展或替换 `redaction`\
  \ 正则表达式的值。默认情况下，Spark 会自动编辑任何匹配 `secret|password|token` 的配置属性。如果你有其他用于机密的模式或命名约定，只需覆盖\
  \ `spark.redaction.regex` 即可。要查看更多细节，可以查阅官方 Spark 文档中的运行时环境设置（`http://spark.apache.org/docs/latest/configuration.html#runtime-environment`）。\n\
  \n#### 访问运行时配置\n\n你可以使用 `SparkSession` 对象（`spark-shell` 中的 `spark` 变量）来获取（读取）和设置（写入）`RuntimeConfig`\
  \ 的值。在活动的 `spark-shell` 中，使用清单 5-7 来读取 `spark.jdbc.driver.class` 的值，亲自尝试一下。\n\n\
  ```\nspark.conf.get(\"spark.jdbc.driver.class\", \"com.mysql.cj.jdbc.Driver\")\n\
  清单 5-7\n获取带有回退值的运行时配置\n```\n\n这种访问模式（在适用情况下带有回退值）贯穿于部分应用 `connect-jdbc.scala` 中。我们将\
  \ JDBC 配置值读取并赋值给便捷变量，然后构造 JDBC `DataFrameReader`。\n\n你可以通过调用 `SparkSession` 上的 set\
  \ 方法来使用运行时配置更新大多数值。使用活动的 `spark-shell`，尝试使用清单 5-8 中的代码设置 `spark.jdbc.driver.class`\
  \ 的值。\n\n```\nspark.conf.set(\"spark.jdbc.driver.class\", \"org.mariadb.jdbc.Driver\"\
  )\n清单 5-8\n动态设置 RuntimeConfig 的值\n```\n\n通过获取和设置值，你可以在特定的时间节点，或者换句话说，在执行的*特定阶段*内更新应用的行为。\n\
  \n注意\n\n在本书的后续旅程中，我们还会看到更多关于 `RuntimeConfig` 的内容，但值得指出的是，每个 `SparkSession` 都可以修改不可变\
  \ `SparkConf` 的一个子集，而不会改变 Spark 应用的默认行为。这是因为 `SparkContext` 保留了默认配置（在初始应用启动时定义），从而确保了\
  \ `SparkSession` 的一个或多个实例之间的关注点分离。\n\n回到正在运行的 `spark-shell`（在清单 5-4 中启动），让我们看看使用\
  \ Spark Shell 进行迭代开发的过程。\n\n#### 使用 Spark Shell 进行迭代开发\n\n在活动的 `spark-shell` 中，尝试调用\
  \ `printSchema` 或在标识为 `df` 的 `DataFrame` 上执行 `show()` 操作。你甚至可以尝试使用选择（selection）和限制（limit）子句，如清单\
