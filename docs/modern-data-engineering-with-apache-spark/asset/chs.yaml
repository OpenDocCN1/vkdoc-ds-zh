  运行代码清单 3-14 中的代码，你会发现平均烘焙度为 `7.8`。这是一个简单的分析查询。你认为还有哪些理由适合使用 Spark SQL？


  根据你使用 SQL 的背景以及你在 Apache Spark 学习之旅中所处的阶段，你可以在熟悉编写 Spark 应用程序的同时使用 SQL 解释器。归根结底，SQL
  解析器足够强大，你不会看到任何重大差异。在大多数情况下，你也不会影响应用程序的整体性能。另外值得一提的是，调用 `spark.sql("select * from
