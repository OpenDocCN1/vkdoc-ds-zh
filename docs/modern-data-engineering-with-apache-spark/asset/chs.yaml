  **图 3-5** 通过 Zeppelin UI 显示的 coffees 表格式良好的输出


  在幕后，Zeppelin 使用活动的 `SparkSession` 将您的 SQL 命令传递给 SQL 解释器。`SparkSession` 上的 SQL 入口点是
