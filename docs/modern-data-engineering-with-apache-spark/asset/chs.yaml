  在上一章中，你学习了如何使用 Apache Spark 强大的聚合和分析函数，从 `agg` 操作符（它能够基于分组数据集直接实现强大的列式聚合功能），到分析型窗口函数（它允许你使用这些独特的窗口功能对数据集进行分区和分析）。这使你能够在活动迭代中，从当前位置向前（`lag`）或向后（`lead`）查看多行数据。你学会了使用
  `lag` over 创建逐行平均增量，以及类似的技术来创建运行累计总数。


  本章将继续遵循上一章的思路，重点介绍如何使用结构化流式处理创建有状态聚合。它教你如何将分析处理和洞察生成迁移到流中。本章还将扩展前四章奠定的技术和基础，用于创建可靠的有状态应用程序，利用检查点、预写日志和进程触发。此外，本章还将介绍用于有状态流式聚合的
  Spark `StateStore`。你将学习构建高级的流式分析应用程序。


