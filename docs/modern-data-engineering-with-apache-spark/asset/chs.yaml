  如代码清单 1-1 所示，数据湖本身只是一种组织真实数据的方式。要处理（或查询）存储在数据湖中的数据，必须先将数据（由分布式表布局中的一个或多个文件表示）读取到能够直接查询数据的系统中（例如
  Apache Spark SQL、Amazon Athena 等），前提是底层存储格式必须是可直接查询的（例如 Apache Avro 或 Apache Parquet）。在代码清单
  1-1 中，显示的分布式表以 Apache Parquet 列式格式存储，并使用了 Snappy 压缩。随着章节的展开，你将进一步了解 Apache Parquet。


  如果数据不幸地采用了不易查询的格式，也仍有希望。众多编程语言支持多种技术，这些技术可以执行初始读取（打开）、解析（转换）和转换原始真实数据的过程，将其转换为能够加载到物理数据库或更常见的托管云数据仓库中的格式。


  **注意**


  你将在第 3 章使用 Apache Spark 处理简单的工作负载，包括读取、转换和查询存储在文件系统上的数据。到第 6 章，你将使用托管表，这允许 Apache
  Spark SQL 处理管理分布式表元数据所需的操作。例如，这些元数据包含分布式数据库位置、表名、所有权和权限，以及注释表和数据库的元数据，以协助数据发现过程。


  除了简单地将数据从数据湖加载到外部数据系统之外，读取和转换原始真实数据集的过程还可用于生成更专业的数据集，这些数据集可以作为上游数据集的子集或父数据集的依赖数据集保存回数据湖。这些专门的数据子集（视图）类似于子节点，而共同的上游父节点则类似于通用数据集（原始数据）与众多分支子集及其后代之间的关系。




  ## 数据依赖与数据管道架构


  一个依赖数据集可以简单到只是一个父数据集的子集，也可能更复杂，例如当来自多个数据集的数据被连接以创建更复杂的子数据集时。增加复杂性的还有这样一个事实：每个子数据集也会成为任何从其派生的新下游数据的“数据源”，并且每个子数据集也可以是来自其他“数据家族树”的一个或多个附加数据集（节点）的连接输出。这就是数据血缘概念的来源，对于心智模型来说，将其想象成树形结构比想象成最终往往形成的、由相互依赖的数据集组成的更大图状结构更容易。只需将其视为一个家族树，但拥有更多潜在的父母，当然，是数据而非人！


  考虑到所有可能的数据集都可以从无数个数据源数据集派生（或重新派生），事情很快就会从简单变得复杂。正因如此，分布式`SQL`表成为处理大量数据的流行方式。大量数据很快变成了“大数据”，随后又被“无界数据”的概念所取代，但元数据和存储机制基本保持不变，使用云数据湖进行无界存储，并通过存储在流行的`Apache
  Hive Metastore`中的元数据进行强化。


  正如你将在本书后面看到的，`Apache Spark SQL`使得扩展这些常见的`SQL`工作负载变得简单，它可以连接到存储在一个或多个位置的数据，以多种不同的处理模式和访问模式运行，从近实时的连续流到更实时的结构化微批处理，再到简单的基于批处理、按需处理，甚至是即席处理。这个过程通常始于第一步：使用传统的`ETL`（提取-转换-加载）作业以及`ELT`（提取-加载-转换）将原始数据从数据湖移出并放入更可用的数据存储中，你将在后面了解这些内容。你将看到直接针对这些数据源数据运行工作负载是多么简单，使用`Apache
  Spark SQL`。


  > **提示**

  >

  > 将数据源数据集中存储在一个中心位置可能是你最关键的数据资产之一。你不仅可以使用这些数据来解决许多问题并回答许多问题，还可以在需要重建表或从数据基础设施中的问题（例如糟糕的部署或其他下游损坏）中恢复时使用这些数据。当你进入本书后半部分时，你将了解更多关于如何为数据成功做好准备的内容。


  数据湖和数据仓库在现代数据生态系统的结构中各有其作用。它们就像数据的阴阳。将这些不同的数据能力结合使用，封装了一个整体的数据连续体，并满足了数据平台的众多需求。


  ### 数据管道架构


  数据工程师的关键职责之一在理论上非常简单——他们负责*数据管道*的基础设施和管理。数据管道只是一个花哨的名称，封装了在规模上、在源和汇之间可靠地移动和转换数据的过程。*源*和*汇*的概念是一种用于思考移动和转换数据的系统的心智模型，你也可以从*上游*和*下游*的角度来思考。


  如果你从足够高的层次上审视事物，数据本质上是在一个大型网络图中，通过一系列有向的作业血缘和函数转换进行旅程。*源*指的是数据的上游来源，例如一个数据库。*汇*指的是可以物理映射到现实世界汇的引用。这是一个出口或出口点，数据流在此处被收集。


  > **提示**

  >

  > 数据流通常用水来比喻，因为这是人们容易理解的事物。考虑水在自然界中的运作方式。水滴聚集并汇合形成水坑和水洼。根据收集速率和收集水的容器，小水洼很容易变成溪流。这些溪流流动并汇合形成河流，分散到三角洲、湖泊甚至海洋。在微观层面，每个水分子都由一个结构组成，可以用一个数据点来表示，从这个角度来说，这个比喻开始变得牵强。然而，作为一种心智模型，它确实有效。


  我喜欢思考数据管道血缘中的每个作业如何以类似于描述`API`的方式工作。一个`API`有一个约定的契约，规定了`API`请求中必须包含哪些数据，并且`API`所有者对如何处理和响应好的和坏的请求，以及如何处理错误以及当出现问题时这些错误如何传播回调用者（客户端）做出强有力的保证。一个不按文档方式运行的`API`会让内部或外部客户非常生气，同样，那些“应该”以某种方式呈现或具有特定字段但实际上并非如此的数据，也会让任何在你或你团队拥有的管道作业下游处理数据的人感到愤怒。


  '
- "# 数据管道\n\n数据管道可以用几种不同的方式来定义。在最简单的形式中，管道可以定义为一个作业或函数，它从单个上游数据源读取数据，并将数据集以其原始形式或转换后的形式移动（写入）到另一个位置（汇）。在极端情况下，数据管道也可以用来描述一个随时间变化的分布式数据转换的复杂网络，我们将在下一节讨论工作流编排时看到这一点。\n\
  \n如果你考虑本章前面提到的`ETL`作业的情况，它们被介绍为在源数据库表和目标数据库汇之间可靠移动数据中扮演着至关重要的角色。图 1-3 中展示了一个修改后的示例。它展示了`ETL`作业在定义数据管道中如何发挥基础性作用。\n\
  \n![](img/505711_1_En_1_Fig3_HTML.jpg)\n\n**图 1-3** 一个简单的`ETL`管道作业\n\n当这些简单的作业跨一系列管道步骤和多个执行阶段连接起来时，事情开始变得更加令人兴奋。这些多步骤作业已经变得如此普遍，以至于像`Airflow`这样的工作流编排器在数据平台中已经变得司空见惯。\n\
  \n\n\n## 工作流编排\n\n工作流编排是控制数据在大型数据网络中可靠流动的基本方式，它由一系列相互依赖的作业和数据管道定义。图 1-4 展示了一个多步骤的、有向的数据转换作业分布式网络。作业可以在工作流管理器中的特定时间被触发，例如在计划任务\
  \ `cron` 作业的情况下，它们也可以由上游作业的完成来触发。使用上游作业完成作为触发器来启动一系列数据转换阶段中的下一个（或多个）作业，通常被定义为有向无环图（DAG），即上游和下游作业的网络。第\
  \ 8 章专门讨论工作流，并涵盖如何设置和运行 Apache Airflow。\n\n![](img/505711_1_En_1_Fig4_HTML.jpg)\n\
  \n**图 1-4**  \n一个多步骤的有向数据转换管道\n\n图 1-4 是一个管道作业的有向无环图（DAG）的高级视图，这些作业共享一个共同的上游初始触发器。如果你只有少数几个作业需要运行，并且其中大部分作业可以独立运行（无需了解任何上游作业是否成功完成），那么工作流编排可能显得大材小用，可以委托给更简单的\
  \ `cron` 机制。\n\n无论是作为简单的转换，还是通过 DAG 定义的一系列相互依赖的管道作业，运行数据管道的好处在于，它为数据管道内每个执行阶段（数据汇）所产生数据的位置（数据源）、格式或模式以及预期行为，提供了一个单一事实来源。拥有单一事实来源的数据不仅有益，对于运营大型数据依赖网络更是至关重要。正如工作流管理和编排服务介入以帮助可靠地运行分布式数据转换作业和管道一样，数据目录也介入以提供一种机制，用于发现数据源、这些数据源的上游和下游依赖关系，以及数据的模式、版本、所有者，甚至数据的谱系和访问策略。\n\
  \n#### 数据目录\n\n数据目录提供了组织内可用数据的基本视图，并且可以扩展以封装所有权，这由描述数据生产者（个人、团队或组织）的元数据来定义。这些生产者有时被称为*数据管理者*。数据目录还可以充当定义公共*数据契约*的角色，该契约可用于建立规则来管理数据的时效性、每个字段的可用性（例如，何时为默认值或空值），以及每个字段的治理和访问规则等。\n\
  \n我们将在第 6 章中通过介绍 Spark SQL Catalog 来探讨*数据目录*。你将在第 5 章中学习使用 Apache Hive Metastore\
  \ 和 Spark SQL 来创建和管理 SQL 表，这些表可以在 Apache Spark 中轻松发现和直接使用。\n\n#### 数据谱系\n\n这种关于数据如何在组织内无数数据管道中流动的高级视图，由逻辑数据源和数据汇定义，它创造了发布数据谱系的方法，该谱系表示为跨数据管道的一系列数据转换。\n\
  \n了解并理解数据如何流经这些数据管道是整体管理中最困难的事情之一，尽早采取这些步骤有助于解决构建可靠数据平台时出现的常见问题。如果没有合适的通用工具，随着事情变得越来越复杂，管理数据可能会变成一场噩梦。\n\
  \n我们将在本书后面更详细地探讨数据目录和数据谱系，并介绍数据治理的概念。接下来，我们将探讨流处理，它使管道架构能够以更流畅的方式移动，作为一种基于数据可用性的推送式系统，而不是批处理系统中常见的拉取式系统。\n\
  \n## 流处理\n\n流处理是从操作系统（OS）进程之间通过总线传递消息的简单机制演变而来的。它们更广为人知的名字是*发布/订阅系统*，因为系统进程会以单台机器内跨应用通信的形式发布或订阅消息。\n\
  \n#### 进程间通信\n\n这种简单但有用的结构，通过允许单台计算机操作系统内的进程（应用程序和内核任务）参与对话，实现了并行处理能力的巨大提升。其美妙之处在于，进程可以以同步或异步方式参与对话，并在许多应用程序之间分配工作，而无需锁定和同步带来的必要开销。\n\
  \n#### 网络队列\n\n这种通过单系统上的发布/订阅消息总线实现并行处理的方法，使得工程师能够以分布式优先的方式扩展和演进这些系统。这导致了网络*消息队列*的出现。\n\
  \n基本的消息队列允许在一个分布式*先进先出（FIFO）* 风格的队列中创建一个或多个通道（即命名队列），该队列作为服务运行在可网络寻址的位置（例如，`ip-address:port`）之上。这使得基于网络的应用程序和服务能够异步通信，这意味着消息的生产者不需要直接了解订阅者（消费者）。相反，这被卸载到网络队列上，极大地简化了分布式系统。\n\
  \n#### 从分布式队列到可重放消息队列\n\n[Apache Kafka](https://www.kafka.apache.org/) 在技术社区中家喻户晓，它作为数据平台中的一个组件，就像精品苏打水和乒乓球之于任何初创公司一样普遍。Kafka\
  \ 始于 LinkedIn，后来被赠予 Apache 基金会，其目标是创建一个分布式、容错的平台，用于处理低延迟的数据馈送，即*数据流*。\n\nKafka 以全新的方法构建了分布式网络队列。然而，它在处理来自消费者的部分故障方面采用了不同的方法。正如你可能想象的那样，如果我们有一个分布式队列，并且我们从该队列中取出一条消息，那么我们可以假设该队列会清除该消息，然后一切照旧。\n\
  \n然而，面对故障时，无论你将责任归咎于何处，如果由于应用程序代码中的错误导致处理消息的进程丢失，那么从队列中清除的消息就会导致数据丢失。读取消息的系统经常会遇到坏数据，如果没有适当的防御机制来处理损坏的数据，进程可能会意外终止，且无法恢复。现在你可以想象，这对业务来说可不是什么好事。\n\
  \n#### 容错与可靠性\n\n为了保护消费者免受这种不可避免的情况影响，Kafka 的架构设计确保了下游故障不会立即导致数据丢失。解决方案是像数据库处理可靠性那样处理消息，即通过持久化写入。神奇的是，分布式预写日志（WAL）应运而生。我们现在来介绍关键术语、架构组件和\
  \ Kafka 的命名法。如果你有 Kafka 的使用经验，可以跳过这部分，直接了解 Spark 如何作为现代数据拼图的最后一块发挥作用。\n\n\n\n####\
  \ Kafka 的分布式架构\n\nKafka 将生产者发出的数据存储在称为**主题**（topic）的结构中。一个 Kafka 主题进一步被分解为一个或多个逻辑分区，这使得每个主题能够进行扩展，以处理可变的读写吞吐量。每个分区保证按时间顺序存储其接收到的数据（称为\
  \ *Kafka 记录*）。参见图 1-5。\n\n![](img/505711_1_En_1_Fig5_HTML.jpg)\n\n图 1-5\nKafka 架构\n\
  \n鉴于每个分区都维护着这种同步的记录流，Kafka 通常用于存储来自连续时间序列事件（例如用户将商品放入购物车，或信用卡交易）的事件流。这些时间序列事件流使系统能够分析那些原本难以高效分组的数据。\n\
  \n由于可以保证每个分区内事件的顺序，并且写入每个分区的事件是根据每条记录的键来分布的，这种分布方式有助于解决与时间序列分析相关的常见问题。数据无序、存储在许多不同位置以及不同数据存储中的问题，感觉就像本章前面讨论的数据孤岛问题。\n\
  \n应用程序无需先运行一个作业来跨所有分区或不同数据存储按键收集所有数据，而是可以直接处理 Kafka 主题的各个分区或切片，而无需事先对数据进行混洗。\n\n\
  这可以大大减轻处理信用卡欺诈或基于用户实时活动提供推荐建议的系统的压力。通过为每条记录选择合适的键，可以保证数据在每个主题内的落盘方式。\n\n##### Kafka\
  \ 记录\n\n记录是简单的数据行，以持久化的方式写入磁盘，类似于预写式日志（WAL）。每条记录由一个键标识，这有助于 Kafka 将数据传递到正在写入的主题的正确分区。记录携带一条主要消息或有效负载，称为消息值。除了键/值对之外，还有一个内部时间戳（Unix\
  \ 纪元毫秒），在消息被接收并写入主题日志时打上。这确保了插入顺序不会因时间问题（时钟漂移、时区差异等）而受到影响。最后，在较新版本的 Kafka 中，每条记录都有一个可选的标头映射，可用于进一步注释数据。它可以应用关于生产者、有效负载模式以及你能想到的任何内容的元数据。\n\
  \n##### 代理\n\nKafka 以类似于常见发布/订阅系统的方式管理数据生产者和消费者。存储在主题每个分区中的数据由 Kafka 集群中的一个活跃代理管理。\n\
  \n这些代理管理写入主题的每条记录的副本，并保持同步，这样即使由于服务器离线或网络分区导致某个代理丢失，也不会造成数据丢失。下一个可用的同步副本会迅速接管数据的服务，并且\
  \ Kafka 会找到另一个可用的代理来分配为下一个备份，以防止数据丢失的情况。\n\n##### 为什么流处理很重要\n\nKafka 是使用最广泛的流处理框架，鉴于该框架灵活、低延迟、高可用的特性，不难理解其原因。然而，Kafka\
  \ 并非该领域的唯一参与者。Apache Pulsar 源自雅虎内部项目，是 Kafka 的另一个开源替代方案。虽然本书不会使用 Apache Pulsar，但了解还有其他替代方案总是好的。第\
  \ 11 章将介绍如何将 Apache Kafka 与 Spark 结合使用。\n\n## 总结\n\n在第一章中，我向你阐述了在当前数据工程这个激动人心的领域取得成功，需要采取哪些步骤以及技术需要取得哪些进步。\n\
  \n你看到了云优先解决方案的兴起如何使我们能够专注于真正想要处理的事情并确定优先级。在操作过 Hadoop 集群并使用过 Amazon S3 之后，我不得不说，不必担心磁盘和主机故障、数据复制、备份或恢复和灾难缓解，这让我能够专注于使用数据，并创建更多有用的工具，这些工具*与数据协同工作*，而不是处理数据运行所依赖的操作。\n\
  \n我们探讨了数据库如何随着时间的推移而演变，并讨论了传统 OLTP/OLAP 风格数据库、NoSQL 数据库以及最后的 NewSQL 数据库的一些基本概念和范式。这里有趣的一点是，在\
  \ NoSQL 时代，出现了从 SQL 的巨大转变，虽然文档存储（完全非规范化的数据集）对组织具有巨大价值，但能够通过 SQL 风格的查询和操作来表达我们如何处理数据，已经重新主导了市场。\n\
  \n鉴于可用的数据库种类繁多，以及这些数据孤岛内的碎片化，我们探讨了 ETL 作业和数据管道架构的兴起。这种能够高效地将数据从一个源移动到另一个源的概念，是催生数据仓库的催化剂，同时也催生了统一数据湖的发明。随着公司处理越来越多的数据，以及管道规模和复杂性的增加，像\
  \ Apache Airflow 这样的工作流管理器应运而生。这些技术就像是数据管弦乐队中缺失的拼图，而工作流管理器则成为了指挥，协助为整个数据平台带来和谐。\n\
  \n在本章的最后，我们讨论了消息队列和代理的演变。我们讨论了流处理，以及这种分布式的传话游戏如何为从批处理到更实时的、基于流的处理（随着 Kafka 的诞生）这一激动人心的转变奠定了基础。\n\
  \n在本书的其余部分，我们将深入探讨 Apache Spark 生态系统，采用动手实践、循序渐进的方法来解决现实世界中的数据工程问题。当你解决基础问题并在此过程中构建自己完全容器化的、可工作的数据平台时，你将逐步了解支撑数据工程保护伞的众多层次和技术。\n\
  \n\n\n"
- "# 2. Apache Spark 入门\n\nApache Spark 是数据工程师的瑞士军刀。作为一个统一框架，它提供了必要的库，能够有效连接并建立共同的数据叙事，让工程师们能够跨学科协作。从原始数据的摄取和验证，到数据清洗、转换和聚合，再到趋势的分析探索和洞察的生成，Spark\
  \ 将任何成功数据运营中的各个组成部分串联起来。它还支持用于特征工程和稳健机器学习的一致（可序列化）管道。\n\n在本章中，你将学习 Apache Spark\
  \ 如何作为数据平台内的核心中心组件发挥作用。正如数据仓库和数据湖解决了数据通用访问的核心问题一样，Spark 解决了在整个数据平台上大规模集中和统一数据处理方式的问题。这简化了你需要使用的工具数量，让你能专注于更少的事情，从而更高效地工作。作为附带效应，Spark\
  \ 为简化组织中的许多系统和流程提供了绝佳机会。\n\n本章的目标很简单；我们将共同为 Spark 生态系统打下坚实的理解基础，并牢固确立 Spark 在现代数据工程师中所扮演的角色。我们从\
  \ Spark 编程模型的基础概念开始，探索 Spark 应用架构中的核心基础知识和组件，并了解 Spark 如何通过委托优雅地处理关注点分离。\n\n本章也是一个入门指南，包含了在本地启动并运行\
  \ Spark 的必要步骤。你将完成第一个 Spark 动手练习。这个练习有助于加深你对如何使用 `spark-shell`（或者我喜欢称之为 *Spark 游乐场*）处理商业智能领域一些基本问题的理解。到本章结束时，你将运行过你的第一个\
  \ Spark 应用程序，而对于那些更有 Spark 经验的读者，这个练习可能会为你提供处理 Spark 工作的不同视角。\n\n## Apache Spark\
  \ 架构\n\nApache Spark 是从 *MapReduce* 编程模型演变而来的。要理解这种演变是如何发生的，我们首先来看看什么是 MapReduce。MapReduce\
  \ 因 Jeffrey Dean 和 Sanjay Ghemawat（谷歌）在其 2004 年的开创性论文《[MapReduce：大型集群上的简化数据处理](https://static.googleusercontent.com/media/research.google.com/en/archive/mapreduce-osdi04.pdf)》中而声名大噪。这种编程模型促成了谷歌搜索引擎的成功，这篇论文也为\
  \ Hadoop 等开源 MapReduce 框架的出现铺平了道路。这使得谷歌以外的公司也能够开始以标准化的方式高效处理大型集群计算数据问题，即所谓的*大数据*。\n\
  \n### MapReduce 范式\n\n从非常高的层面来看，MapReduce 与第 1 章的 ETL 作业示例有一些相似之处。每个作业都从一组特定的输入数据（存储在分布式文件系统上的文件）开始，并使用\
  \ MapReduce API 在两个（或更多）不同的部分编写工作流。\n\n一个典型的工作流从一些转换逻辑（映射阶段）开始。这个过程本质上是从分布式文件系统中提取信息，具体取决于所读取文件的编码方式，并负责将输入数据转换为键/值映射数据的集合。*可以说输入数据被解析并映射到特定的已知类型*。接下来，映射阶段的输出被传递给归约器，归约器处理来自映射阶段的结果排序数据集合，这些数据按公共分组键进行组织。\n\
  \n本质上，整个过程有效地映射了大量数据（比可靠地放入内存的数据量还要大），使用互连服务器（集群）网络，将数据排序并分组到分布式数据集中。然后进一步归约这些数据集以完成给定的目标，例如计算指向给定网站的入站引用数量，这曾帮助谷歌生成其\
  \ PageRank 算法。整个过程的输出随后再次写入可靠的存储，以便在其他地方重用。\n\n与传统的 ETL 作业不同，MapReduce 作业不是直接从数据库读取，而是需要访问比当时（2004\
  \ 年）任何现有数据库所能容纳的更多的数据。为了可靠地处理这些海量数据，一种分布式执行模型应运而生。它可以使用存储在可靠分布式文件系统上的数据来处理这些庞大的数据集，并能自动跟踪复杂的分布式工作流。\n\
  \n图 2-1 介绍了 MapReduce 编程模型。通过从概念上审视 MapReduce，你将更容易理解 Spark 是如何从这种编程模型演变而来的。\n\n\
  ![](img/505711_1_En_2_Fig1_HTML.jpg)\n\n图 2-1\n\nJeff Dean 和 Sanjay Ghemawat 概念化的\
  \ MapReduce 编程模型。数据通过一个无环的分布式工作流从左向右移动\n\n#### 映射器\n\nMapReduce 编程模型围绕*作业*构建，这些作业本质上是编码好的例程，以水平分布式的方式读取和处理数据。每个作业可以通过采用分而治之的方法来处理大量数据（源自文件系统），该方法从一组有限的输入文件开始。这些输入文件（存储在分布式文件系统中）随后被分发到\
  \ MapReduce 集群中，作为一系列名为*分片*的分区进行处理（如图 2-1 左侧所示）。所有必需的分片随后由 MapReduce 引擎通过分配给*任务*转换为映射阶段任务。然后，每个映射任务完全隔离运行，使每个任务能够以松散耦合的方式完成工作。\n\
  \n心智模型\n\nMapReduce 执行模式可以被视为一种分布式的*分而治之*方法，为了处理越来越大的数据集，可以添加更多机器来水平分担工作。每个任务在概念上可以被视为一个黑盒，它接收分配到的输入，并将其工作结果写入特定的输出位置。\n\
  \n#### 持久且安全的无环执行\n\n每个隔离任务完成后，其结果输出会被写回分布式文件系统以实现持久性，并确认任务完成。\n\n注意\n\n在分布式系统中，持久性、一致性和可靠性往往是相辅相成的。在讨论数据系统的持久性时，你几乎总是可以将这一系列问题归结为容错性和一致的数据行为。\n\
  \n从 MapReduce 方面来看，将所有中间文件（见图 2-1）持久地写入磁盘，在作业执行的每个阶段处理的数据之间建立了一个具体的屏障，这类似于示例多步骤数据管道（第\
  \ 1 章的图 1-4）中定义的一系列作业。最后，持久写入中间文件还确保了大型复杂作业能够处理磁盘故障或网络分区，而无需重新启动整个作业。默认情况下，由于底层分布式文件系统（HDFS）的复制和容错机制，执行阶段之间存储的数据具有隐式的可用性保证。\n\
  \n正如你可以想象的，用于更新谷歌搜索索引的 MapReduce 作业（在 2004 年以及现在）需要在所有执行阶段以一致的保证运行完成，以确保每个作业的结果是确定且可信的。\n\
  \n\n\n### Reducers\n\n我们以图 2-1 右侧所示的 *reducers*（reduce 阶段任务）来结束对 MapReduce 的快速浏览。每个\
  \ reducer 任务读取 mapper 任务（你可以将其视为上游数据准备阶段）的输出，这些输出以中间键/值映射的形式写入。对于每个键，映射值会被分组、排序，然后作为输入馈送到\
  \ reducer 任务中。\n\nreducer 任务接收一个 `key` 和一个 `Iterator<value>` 作为输入，并处理数据集合以达到期望的结果。最后，每个任务的输出会被写回磁盘，当所有工作处理完毕，该作业即被视为成功。\n\
  \nMapReduce 之所以成功，是因为其编程模型使得大型集群计算作业能够运行，而工程师无需理解编写大型分布式系统和应用程序的底层复杂性。我并不是说构建直观的\
  \ MapReduce 程序很简单；在轻松采用这种思维模型时，总会遇到一些摩擦。我想你可以说，API 需要更多的灵活性或创造性。这就是 Spark 登场的地方。\n\
  \nApache Spark 吸收了 MapReduce 范式的精华，同时使工程师能够直观地控制数据在每个作业或一系列作业的上下文中如何被访问、处理和缓存。接下来，我们将探讨\
  \ Spark 如何实现并行计算，这些计算既可以使用标准的分布式（基于磁盘）文件系统，也可以将中间数据存储（缓存）在内存中。这极大地加速了我们今天所知的分布式数据处理、分析和迭代算法。\n\
  \n### 从数据隔离到分布式数据集\n\nApache Spark 从 MapReduce 的种子中发展而来，引入了一种革命性的处理分布式数据的新方式。它吸收了\
  \ MapReduce 范式的精华，并通过支持跨共享的分布式数据集进行并行计算和迭代，引入了一种全新的编程模型。\n\n2010 年，开创性论文《Spark：使用工作集的集群计算》向世界介绍了\
  \ Spark 编程模型，并着重改进了使用 MapReduce 时遇到的常见问题。其新颖之处在于，在多个并行操作之间重用工作数据集（在内存中），从而无需在执行和处理的每个阶段之间持续回退到磁盘（并产生额外的\
  \ IO/文件系统打开成本）。那么它是如何工作的呢？\n\n## Spark 编程模型\n\n要理解 Spark 编程模型，你需要吸收 MapReduce 的优点。MapReduce\
  \ 的核心设计原则是在松散耦合任务的工作内存中进行隔离的数据访问。由于 MapReduce 作业使用无环数据流模型来分而治之地处理工作，类似于数据管道封装的常见数据处理任务流程，这使得\
  \ MapReduce 作业能够专注于将大型数据问题分解为较小的功能黑盒阶段。然而，这也意味着，为了在多个作业中处理相同的数据集，每个作业都必须重复工作，将相同的数据加载到工作内存中。这虽然高效，但也可能引起其他副作用，例如增加\
  \ MapReduce 集群有限资源的压力。\n\n#### 你从未学会分享吗？\n\n要理解 MapReduce 常见的缺点，请考虑以下情况。假设你被要求编写一个例程，需要统计某一天访问你公司网店的所有独立用户。你还需要计算每个客户购物车中添加的商品平均数量，同时找出当天所有购物车中最常添加的十大商品。你会如何回答这些问题？这类问题对于从事商业智能（BI）的分析师来说很常见。图\
  \ 2-2 展示了一个使用 MapReduce 的解决方案。\n\n![](img/505711_1_En_2_Fig2_HTML.jpg)\n\n**图 2-2**\
  \ 从 MapReduce 获取答案需要多次访问原始数据集\n\n要解决图 2-2 中提出的三个问题，你需要创建三个不同的作业：\n\n*   图 2-2 中的第一个作业\
  \ *Unique Users*，从存储在分布式文件系统 `activity` 目录中的记录读取数据。为简单起见，我们假设该目录存在于一个每日目录中，例如 `/YYYYmmdd/activity`。此作业加载每日用户活动事件数据，并将其转换为一个映射，该映射可在\
  \ reducer 阶段使用，作为一种通过键获取当日独立用户的方法。然后对这些 ID 进行求和，以计算每日独立用户数。\n\n*   图 2-2 中的第二个作业\
  \ *Avg Cart Items*，同样读取存储在 `activity` 目录中的数据。它将每个分片中的 *用户 ID* 映射到 *商品 ID*，然后对这些映射进行排序和分组，以馈送到\
  \ reducer。然后，reducer 对每个独立用户的购物车商品进行求和，并将此数据输出为用户与其每日购物车商品总和的映射。此数据会被写入另一个位置，由另一个\
  \ MapReduce 作业读取并生成所有用户的平均购物车商品数。最后，它将结果写入 `daily/cart/avg` 目录。\n\n*   图 2-2 中的最后一个作业\
  \ *Top 10 Cart Items*，再次从 `activity` 目录读取原始数据，将数据映射为 *商品 ID* 到该商品在每个购物车中的总计数，并写入中间可靠存储。数据按商品\
  \ ID 排序和分组后馈送到 reducer，以便它们计算每个商品的总计数。这些每日运行的总计数随后被写入可靠存储，然后另一个作业从这里接手，可以从该数据集中选出前十名。\n\
  \n如今，像这样解决常见迭代问题的方案在分析领域以及其他更复杂的数据领域（如机器学习）中已司空见惯。\n\n**注意：** 如果你觉得使用 MapReduce\
  \ 解决图 2-2 中的问题所需的步骤总数过多，你的感觉没错。回顾来看，其中存在大量不必要的复杂性和许多活动部件，而这正是 Apache Spark 旨在改变的地方。\n\
  \nApache Spark 改变了在同一应用程序上下文（例如图 2-2 中的 BI 查询）中跨并行操作加载、转换和处理数据的方式。它通过引入一个灵活的编程模型来实现这一点，该模型使工程师能够编写本地代码，这些代码在集群中运行时可以分布式执行，具有极高的容错性，并且可以使用函数式编程风格编写。Spark\
  \ 编程模型的核心是 *弹性分布式数据集*，简称 *RDD*。\n\n\n\n## 弹性分布式数据集模型\n\n从高层视角来看，你可以将 `RDD` 视为一种*只读*、*不可变的数据集合*，它被分区存储在一组连接到\
  \ Spark 应用程序的网络服务器（称为*执行器*）上。`RDD` 对象本身编码了实现预期结果所需的转换谱系（例如图 2-2 中的查询），从输入数据（由分布式数据源和源元数据表示）开始，再到从输入到输出的整个过程中的每一次转换。输入数据可以是物理存储在机器上的文件、分布式文件系统中的文件，也可以是按主题分区的数据（例如\
  \ Apache Kafka）。\n\n> **注意**  \n> 如果你对分区的概念还不熟悉，没关系。文件中的分区只是基于范围的指针，允许文件被分割并由多个并行进程读取。如果你有一个\
  \ 1GB 的文件，并将其分成十个大小相等的分区，那么每个分区就是 100MB。可分区文件通常意味着一种易于分割的文件格式，例如每行是一条记录的换行分隔 JSON\
  \ 文件。你可能无法精确地分割文件，但可以将其视为搜索结果的分页概念。每个分区封装了一个数据范围，例如分区 1 从第 0 行到第 400 行，以此类推。\n\n\
  然而，`RDD` 超越了 MapReduce 范式，通过在 Spark 应用程序运行时的显式步骤序列中嵌入或记录所有分布式转换的谱系，实现了更好的性能（速度）和容错性。这种方法意味着\
  \ Spark 可以在作业运行期间优雅地处理故障，因为存在一个轻量级的记录或日志，记录了作业中发生的所有重要事件。可以将 `RDD` 视为区块链账本。这种跨 `RDD`\
  \ 所有分区的分布式转换（事务）谱系可用于同步对共享变量的访问以及对缓存中存储数据的并行访问，但也可用于通过从故障点反向遍历作业谱系来重新创建丢失的分区。通过读取转换链，`RDD`\
  \ 可以在 Spark 作业的任何时间点、为其任何分区重建，如果需要，可以一直回溯到原始数据源，或者回溯到沿途的任何其他缓存检查点。这个过程使 Spark 能够填充和恢复因硬件故障而丢失的数据，而无需重新启动作业或重新加载所有数据。这既节省了时间又节省了金钱！\n\
  \n此外，`RDD` 所表示的元素不必像 MapReduce 的分片和中间文件那样是物理对象。相反，`RDD` 就像一个转换指针图，因此在部分故障的情况下，代表特定处理阶段的\
  \ `RDD` 可以被高效地重新计算。`RDD` 本身不存储物理数据，只存储元数据，使其成为协调跨网络连接计算机的分布式集群进行数据处理的一种手段。\n\n最后，虽然\
  \ `RDD` 并非专门共享数据模型，但 Spark 允许程序在数据谱系中的特定点缓存 `RDD`。这使得从该点开始可以对数据进行并行处理或多遍处理，而无需返回原始数据源，也无需不必要地重新转换数据或进行代价高昂的多次连接。我们将在本书后面介绍缓存和检查点，目前了解\
  \ `RDD` 模型就足以让你开始思考 Spark 是如何运作的了。\n\n> **注意**  \n> 我花了一些时间才完全理解 `RDD` 缓存范式。许多程序不需要多次访问数据集，因此对于这些单遍应用程序来说，将数据内容存储在内存中没有意义。Spark\
  \ 是惰性缓存的，因此为了缓存数据，Spark 需要对数据进行第一遍处理。因此，只有当你想要多次访问数据时，缓存才有意义。\n\n在本章末尾，我们将再次回顾图\
  \ 2-2 中的 BI 用例示例。我希望你将看到使用 Spark 以更少的步骤更高效地解决相同问题是多么简单。在开始练习之前，让我们先了解一下 Spark 架构，以便有一个可以回顾的参考。我们还将介绍安装\
  \ Spark 以运行后续练习中示例代码所需的步骤。这将非常令人兴奋。\n\n## Spark 应用程序架构\n\n考虑到即使是设计简单的应用程序也固有的复杂性，编写分布式软件可能是一项艰巨的任务。为什么这么难？很高兴你问到这个问题！分布式计算要求编写程序时采取特定操作，以确保程序的复杂部分能够以并行方式跨连接服务器（或节点）网络高效运行。同时，它必须协调跨节点通信，并在程序运行时的不同阶段之间编排（序列化/反序列化，或简而言之，与二进制表示之间的转换）数据。\n\
  \n我意识到我忽略了其他复杂性，例如如何处理导致集群内出现严重盲点的网络分区，如何处理节点故障，以及由于部分错误场景，这些问题如何变得更加复杂。使用 Spark\
  \ 编写应用程序的好处在于，你不必花费大量脑力来制定编写分布式应用程序的策略。你只需编写应用程序，剩下的工作（大部分）就交给 Spark 了。\n\n鉴于编写完全分布式应用程序的复杂性，编写\
  \ Spark 应用程序的方法简单地将分布式应用程序固有的复杂性抽象化了，这样工程师就可以专注于解决问题，而不是运行和管理复杂的分布式应用程序。本质上，Spark\
  \ 框架使应用程序作者能够使用 Spark 编写程序，这些程序在各方面看起来都与非分布式软件无异。然而，当它们运行时，程序会以完全分布式、高度可并行化的方式运行，繁重的工作在幕后隐式完成。\n\
  \nSpark 程序（通常简称为应用程序）之所以成为可能，归功于以下三个主要组件：\n\n- 驱动程序\n- 集群管理器\n- 程序执行器\n\n驱动程序就是\
  \ Apache Spark 应用程序。每个应用程序都由驱动程序监督，执行阶段（工作）被划分并分布到程序执行器上，每个执行阶段（通常是某种*转换*）使用简单的\
  \ RPC 通信，最终达到应用程序的预期结果，这被称为*动作*。在幕后，集群管理器辛勤工作，持续监控集群状态，检查正在运行的应用程序，并观察集群中剩余的可用的计算容量。我们将在本书后半部分深入探讨\
  \ Spark Standalone 和 Spark on Kubernetes。\n\n图 2-3 展示了这三个主要组件，以及 Spark 应用程序（驱动程序）在运行时如何与其他分布式组件（集群管理器和执行器）交互。\n\
  \n![](img/505711_1_En_2_Fig3_HTML.jpg)\n\n**图 2-3** Spark 应用程序及其运行时的核心组件\n\n\n\n\
  ### 驱动程序的作用\n\n驱动程序是任何 Spark 应用的核心与大脑。之前我提到分布式软件很复杂，而驱动程序则抽象了其中的大部分复杂性，并无私地代表你的应用，以高度容错的方式协调应用的执行。\n\
  \n图 2-3 左侧展示了驱动程序。驱动程序只是作为应用运行时的委托。作为 Spark 应用的代表，驱动程序身兼数职，并借助 `SparkContext` 管理运行应用的复杂性。在高层面上，`SparkContext`\
  \ 控制着驱动程序的以下几个方面：\n\n- **资源管理**：Spark 驱动程序通过与集群管理器交互（见图 2-3）来请求和释放集群资源。这使得你的程序逻辑能够分布到一组指定的计算节点（称为执行器）的子集群上。鉴于驱动程序还负责在这些节点间分配工作，它也可以在执行器节点丢失（如果这些机器离线或无法访问）或任务失败时，与集群管理器进行协调。工作可以在任何可用的执行器上重新调度，以确保部分故障不会导致整个应用失败（在合理范围内）。\n\
  \n- **应用状态管理**：`SparkContext` 会跟踪活动作业和已完成作业。这样，应用状态机可以控制驱动程序的执行，同时处理应用内部的故障。\n\n\
  - **配置管理器**：`SparkContext` 还负责将初始应用配置同步到一个名为 `SparkConf` 的对象中。这是 Spark 应用配置的初始快照，可以在运行时通过另一个名为\
  \ `RuntimeConfig` 的对象进行修改（我们将在后续章节中用到它）。\n\n- **作业调度器**：`SparkContext` 将跨集群的调度工作控制为一系列*作业*、*阶段*和*任务*。当你开始编写第一个\
  \ Spark 应用时，我们将在第 3 章中详细介绍。\n\n我们可以用本章剩余部分来强调 *Spark 驱动程序*和 `SparkContext` 的众多职责，但在后续章节中进行更实际的探索时，逐步深入理解会更容易。我们现在先暂停一下，来熟悉\
  \ Spark 集群管理器。\n\n### 集群管理器的作用\n\n集群管理器（图 2-3 中间部分）与 Spark 驱动程序一样，扮演着核心角色。如果你将每个抽象层视为支撑\
  \ Spark 架构的一根支柱，那么集群管理器就是*集群协调器*，是负责管理和维护集群状态以及分配给每个活动 Spark 应用的执行器的委托。\n\n为了在集群内启动\
  \ Spark 应用，驱动程序必须首先向集群管理器请求资源。这是一种刻意的*关注点分离*，它将集群本身的管理职责与应用运行时环境的控制职责分离开来。\n\n###\
  \ 自带集群\n\n为了对实际的 Spark 集群本身实现更细粒度的控制，Spark 集群可以以可插拔的方式运行在几种流行的分布式集群计算框架上，这使得组织能够重用业界已经成熟的技术。或者，他们也可以选择在\
  \ Spark 的原生集群编排器（称为 Spark Standalone）上运行集群。\n\nSpark 目前支持的分布式计算框架有：\n\n- **Spark\
  \ Standalone**：原生的 Spark 集群管理器。此运行模式需要划分出特定资源来协调集群状态，包括一个充当*集群管理器*的 `Spark Master`，以及一个可选的*备用*主节点，用于在*活动*主节点离线时实现高可用性（HA）。此模式需要集群计算节点，这些节点被称为*工作*节点，它们运行一个或多个*执行器*\
  \ JVM。我们将在第 14 章中更详细地介绍 Spark Standalone。\n\n- **Mesos**：Mesos 是一个流行的通用分布式计算框架，由\
  \ Matei Zaharia 共同创立，他也是 Spark 的核心创建者之一。本书不涉及如何使用 Mesos 部署应用，但感兴趣的读者可以在网上找到大量资源。\n\
  \n- **Kubernetes**：Kubernetes 是一个家喻户晓的名字，在过去几年中，它作为一种管理基础设施即代码的方式变得极其流行。它最初在谷歌内部构建，然后开源，是\
  \ Spark 可以运行的最新集群支持。我们将在第 15 章中探讨部署选项时，介绍 Spark on Kubernetes。\n\n- **Yarn**：Hadoop\
  \ 在许多组织中仍然非常流行，用于运行 MapReduce 类型的作业。Yarn 管理器使得 Spark 应用能够在数据源处或尽可能靠近特定任务存储在 HDFS\
  \ 中的数据的位置运行执行器进程。本书不涉及如何使用 Yarn 部署应用，但感兴趣的读者可以在网上找到大量资源。\n\n最后但同样重要的是，我们来看图 2-3\
  \ 中 Spark 应用架构的最后一个组件，即*执行器节点*。\n\n\n\n### Spark 执行器的作用\n\n如图 2-3 右侧所示，执行器的职责简单但至关重要，即作为\
  \ Spark 驱动程序所分配任务的**计算代理**。简而言之，你的大部分工作将在执行器上运行，而非驱动程序本身。\n\n每个执行器实例都以一次性（临时）方式运行。这意味着当集群中的某个节点离线，或\
  \ Spark 应用程序运行时遇到异常需要停止时，工作负载可以轻松地被重新调度。由于执行器是松散耦合的，你可以忽略幕后发生的许多事情，只需知道 Spark 应用程序具有弹性，且执行器本身易于替换即可。\n\
  \n顺便提一下，由于 Spark 具有如此强的弹性，许多公司选择在成本较低的云计算资源（如 Amazon EC2 Spot 实例，价格低廉但极不可靠）上运行优先级较低的工作负载，但仍能完成任务，同时成本降低\
  \ 90%。这种弹性的根源可以追溯到本章前面介绍的 RDD，简而言之，它能够实现数据的快速恢复，确保一旦驱动程序分配了新的执行器实例，程序就能继续运行。请记住，RDD\
  \ 存储了所有分区数据转换步骤的分布式记录，它是实现故障期间快速可靠恢复的催化剂。\n\n根据 Spark 集群所使用的集群管理器，执行器要么在 `worker`\
  \ 进程中运行（如 Spark Standalone 的情况），要么由资源管理器控制（当使用 Yarn、Mesos 或 Kubernetes 时）。如前所述，我们将在本书后面（第\
  \ 13 章）探讨 Spark 应用程序的部署策略，届时将专门介绍 Spark Standalone 和 Kubernetes 部署。\n\n**提示**\n\n\
  执行器可以在低成本或高成本实例上运行。在配备高 IOPS 优质 SSD、多 CPU 以分发任务以及大量工作内存的昂贵硬件上运行执行器，有助于作业更快完成。但根据应用程序的配置方式，并非越大越好。对于某些子问题，过度配置\
  \ Spark 应用程序实际上会损害整体性能。\n\n我希望，通过介绍 Spark 应用程序架构的核心组件（驱动程序、集群管理器和程序执行器），并审视 Spark\
  \ 基于组件的委派机制，你已经开始从高层对 Spark 的工作原理有了初步了解。随着我们继续这段旅程，我们将不断回顾这些核心组件，并拓宽视野，加深对如何将 Spark\
  \ 作为核心框架来处理现代数据工程师常见问题的理解。\n\n为了结束对 Spark 特性和组件的介绍，有必要谈谈 Spark 生态系统以及扩展 Spark 核心能力的\
  \ API。\n\n### 模块化的 Spark 生态系统\n\nSpark 的核心是用 Scala 和 Java 编写的，并设计为在 Java 虚拟机（JVM）上运行，但这并不妨碍你使用\
  \ Python、R 甚至 SQL 来运行 Spark 操作。这些编写 Spark 应用程序的替代方式都是通过使用命令接口或网关实现的。这意味着未来可以编写 Spark\
  \ 解释器来进一步扩展 Spark 支持的语言，并为这些新语言添加惯用的函数式支持。这也意味着在编写数据工程管道和作业时，你可以选择如何与 Spark 交互。接下来你将看到，你还可以通过混合使用额外的模块，选择如何在\
  \ Spark 作业之上叠加额外的功能。\n\n#### 核心 Spark 模块\n\nSpark 的核心能力分布在几个核心模块中。这些库增强了 Spark 的能力，从而支持在\
  \ Spark 应用程序中以不同方式处理数据。从支持像传统 OLTP 或 OLAP 数据库一样查询数据的 `SparkSQL`，到支持以微批次或连续模式处理真正数据流的\
  \ `Spark Structured Streaming`，再到用于训练和嵌入机器学习模型的 `Spark MLib`，以及通过 `GraphX` 和社区驱动的\
  \ `GraphFrames` 查询图形关系。这些库中的每一个都增强了 Spark 的能力，使你能够在同一个统一平台上处理复杂的用例。本章稍后你将初步了解 `SparkSQL`。\n\
  \n#### 从 RDD 到 DataFrame 和 Dataset\n\n我们在本章前面讨论了`弹性分布式数据集`（`RDD`），尽管 RDD 对 Spark\
  \ 的早期成功至关重要，但你主要将使用 RDD 之上的一个更高级抽象，称为 `DataFrame`，以及它的强类型兄弟 `dataset`。我们将在本章末尾的练习中更详细地探讨\
  \ `DataFrame`，并了解它如何与 `SparkSQL` 良好配合，以简化我们向数据提问的方式。在本书后面，我们还将花大量时间讨论 datasets。现在，如果你准备好了，让我们开始运行\
  \ Spark。\n\n## 开始使用 Spark\n\n在短短几十页的篇幅里，我们一起涵盖了很多内容和历史。我想可以肯定地说，我们都准备好开始使用 Spark\
  \ 了。下一节的目标很简单。你将了解如何在本地安装 Spark，然后通过一个入门练习来结束本章。\n\n**注意**\n\n以下安装说明使用 macOS 的 Homebrew。如需在\
  \ Linux 或 Windows 子系统 for Linux 上使用 Homebrew，请参考 [`https://docs.brew.sh/Homebrew-on-Linux`](https://docs.brew.sh/Homebrew-on-Linux)。\n\
  \n### 安装 Spark\n\n安装 Spark 轻而易举。我们现在就来逐步完成在 Spark 3 上启动和运行的步骤。如果你想使用 Spark 2.x 阅读本书，则必须使用\
  \ Java 8，但值得一提的是，本书的源代码是为 Spark 3 编写和测试的。\n\n运行它所需的唯一条件如下：\n\n*   Java 开发工具包（[JDK](https://www.oracle.com/java/technologies/javase-jdk11-downloads.html)）\n\
  *   Scala 2.12（Spark 3 的默认版本）\n\n如果你已经安装了 Java 和 Scala，可以直接跳到下载 Spark 的步骤。\n\n####\
  \ 下载 Java JDK\n\nJava JDK 有两种版本：`官方 Oracle Java JDK` 和 `OpenJDK`。Spark 3 同时支持 Java\
  \ 8 和 Java 11，选择哪种版本由你决定。本书将使用开源的 OpenJDK 11。你可以访问 Oracle 网站 [`https://www.oracle.com/java/technologies/javase-jdk11-downloads.html`](https://www.oracle.com/java/technologies/javase-jdk11-downloads.html)\
  \ 下载官方 JDK，并选择适合你环境的构建版本。或者，如果你使用的是装有 Homebrew 的 Mac 笔记本电脑，只需在终端窗口中运行以下命令：\n\n```\n\
  > brew install openjdk@11\n```\n\n现在你的笔记本电脑上应该已经安装了 Java。接下来，让我们确保也安装了 Scala。\n\n\
  #### 下载 Scala\n\n如果你在 Mac 笔记本电脑上进行这些练习，可以使用 Homebrew 并运行以下命令来满足此要求：\n\n```\n> brew\
  \ install scala@2.12\n```\n\n如果你计划在其它环境（Windows/Linux）中工作，请参考 [`https://www.scala-lang.org/download/`](https://www.scala-lang.org/download/)\
  \ 上的下载说明来安装 Scala。\n\n好了。现在你已经准备好了先决条件，是时候下载并安装 Spark 了。\n\n\n\n#### 下载 Spark\n\n\
  现在可以下载 Spark 3 版本了。图 2-4 展示了 Spark 官方下载页面的示例。\n\n![](img/505711_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n从稳定版发布包中下载 Spark，访问 [*https://spark.apache.org/downloads.html*](https://spark.apache.org/downloads.html)\n\
  \n操作步骤很简单：\n\n1. 选择 Spark 3.x 版本。\n2. 选择为 Apache Hadoop 3.2 及更高版本构建的包类型。\n3. 点击“Download\
  \ Spark”链接。\n\n这样就会将压缩的 Spark 发布包下载到你的笔记本电脑上。好了，到目前为止一切顺利。现在你只需要解压这个包，并将 Spark 移动到一个方便的主目录中。打开你最喜欢的终端应用（我使用的是\
  \ Mac 笔记本电脑上的默认终端应用），然后执行以下命令：\n\n```\n1.   mkdir ~/sources\n2.   cd ~/sources\n\
  3.   mv ~/Downloads/spark-3.0.1-bin-hadoop3.2.tgz ~/sources\n4.   tar -xvzf spark-3.0.1-bin-hadoop3.2.tgz\n\
  5.   mv spark-3.0.1-bin-hadoop3.2 spark-3.0.1\n6.   rm spark-3.0.1-bin-hadoop3.2.tgz\n\
  ```\n\n如果你正确执行了这些步骤，那么 Spark 现在应该已经安装在 `~/sources/spark-3.0.1/` 目录下了。让我们测试一下一切是否正常，并启动本地的\
  \ Apache Spark。\n\n**注意：** 当你阅读本书时，可用的 Spark 版本会因新版本的发布日期而有所不同。本书是为 Apache Spark\
  \ 3.x 编写的。书中使用的版本可能略有不同，所以在跟随练习时请留意这一点。\n\n### 试运行 Spark\n\n既然 Spark 已经安装好了，你应该运行一个简单的测试来确保一切工作正常。打开一个新的终端窗口，并执行清单\
  \ 2-1 中的命令。\n\n```\nexport JAVA_HOME=/usr/local/opt/openjdk@11/libexec/openjdk.jdk/Contents/Home/\n\
  export SPARK_HOME=~/sources/spark-3.0.1/\n$SPARK_HOME/bin/spark-shell\n```\n\n清单\
  \ 2-1：导出所需的 `JAVA_HOME` 和 `SPARK_HOME` 环境变量，并启动 Spark Shell 以测试安装过程\n\n**注意：** 你笔记本电脑上的路径可能与我的设置不同。如果\
  \ Spark Shell 无法启动，请参考安装说明。\n\n假设一切按计划进行，你现在应该在终端窗口中看到一些调试信息，包括 Spark 标志的 ASCII\
  \ 版本、运行时 Java 和 Scala 版本信息，以及正在运行的 Spark 发布版本。以下是我机器上的一个示例：\n\n```\nSpark context\
  \ Web UI available at http://192.168.1.18:4041\nSpark context available as 'sc'\
  \ (master = local[*], app id = local-1609119924108).\nSpark session available as\
  \ 'spark'.\nWelcome to\n____              __\n/ __/__  ___ _____/ /__\n_\\ \\/ _\
  \ \\/ _ `/ __/  '_/\n/___/ .__/\\_,_/_/ /_/\\_\\   version 3.0.1\n/_/\nUsing Scala\
  \ version 2.12.10 (OpenJDK 64-Bit Server VM, Java 11.0.9)\nType in expressions to\
  \ have them evaluated.\nType :help for more information.\nscala>\n```\n\n## Spark\
  \ Shell\n\n可以把 *Spark Shell* 看作一个快速测试想法的工具，或者干脆就是一个 Spark 游乐场。我这么说是因为在开始一个新想法之前，你不需要编写任何代码或进行编译。这个\
  \ Shell 程序的魔力在于它处理类动态加载的方式。对于每一行新的输入，Shell 会保存其先前状态，读取并响应输入，动态编译和链接新的类和函数，如果没有抛出错误，则保存其新状态。如果你好奇\
  \ REPL 究竟是如何工作的，可以查看 Spark REPL 的源代码。不过，更简单的方法是先通过实际操作建立一个心智模型，然后当你准备好时，再让好奇心带你走完剩下的路。现在，让我们从一些基础知识开始，通过本书的第一个动手练习来热身。\n\
  \n## 练习 2-1：重温商业智能用例\n\n你还记得图 2-2 中展示的假设性商业智能问题吗？回顾一下，我们需要创建一系列作业来读取与虚构电商网站上用户活动相关的事件数据，目标是得出以下三个常见的每日报告：\n\
  \n- 查找每日活跃用户（或每日独立用户）。\n- 计算所有用户购物车中商品的每日平均数量。\n- 生成所有用户购物车中被添加次数最多的前十件商品。\n\n###\
  \ 定义问题\n\n解决大多数数据问题都始于*数据*以及我们想要达成目标的规格说明。在这种情况下，我们对需要完成的任务有了一个粗略的想法，如本练习引言所述，现在我们可以开始了。但在更正式的场合，你还需要考虑以下几点：\n\
  \n- 你可以访问哪些数据源？\n- 谁拥有这些数据？你知道谁生成数据并控制数据集的格式（或模式）吗？\n- 数据能否被 Spark 原生读取？\n\n这只是团队在开始处理数据之前需要提出的一些问题的示例。幸运的是，我们可以直接推进并解决问题，因为我们将要创建自己需要处理的数据。\n\
  \n\n\n### 解决问题\n\n如果你没有运行 `spark-shell`，请返回清单 2-1 中的步骤启动 shell。启动 `spark-shell`\
  \ 后，我们将创建几行数据以供使用。你可以复制并粘贴代码（如果在笔记本电脑上阅读），直接粘贴到 `spark-shell` 中，或者逐行输入到 `spark-shell`\
  \ 中。\n\n**提示**\n\n要启用粘贴模式，只需输入 `:paste` 并按回车键。你应该会看到 `// Entering paste mode (ctrl-D\
  \ to finish)`。要退出粘贴模式并解释清单 2-2 中的代码块，只需按 Ctrl+D。你应该会看到 `// Exiting paste mode, now\
  \ interpreting`。\n\n```\nimport spark.implicits._\nimport org.apache.spark.sql.functions._\n\
  case class Activity(\nuserId: String,\ncartId: String,\nitemId: String)\nval activities\
  \ = Seq(\nActivity(\"u1\", \"c1\", \"i1\"),\nActivity(\"u1\", \"c1\", \"i2\"),\n\
  Activity(\"u2\", \"c2\", \"i1\"),\nActivity(\"u3\", \"c3\", \"i3\"),\nActivity(\"\
  u4\", \"c4\", \"i3\"))\nval df = spark.createDataFrame(activities)\n.toDF(\"user_id\"\
  , \"cart_id\", \"item_id\")\n// 输出表格行\ndf.show()\n清单 2-2\n导入 Spark 辅助工具、定义 Activity\
  \ 案例类并生成一些数据\n```\n\n清单 2-2 中的代码为我们第一个微应用奠定了基础。该示例首先从“魔法 spark 对象”中导入一些 Spark 的隐式辅助函数。`spark-shell`\
  \ 在启动时会创建所谓的 *SparkSession*，并将其赋值给变量 `spark`。接下来，我们导入使用 SparkSQL 所需的函数，并使用 `Activity`\
  \ 案例类定义数据模型。\n\n当我们生成一些 `Activity` 数据，并最终使用 Spark 解释这些活动并创建初始 DataFrame 时，事情变得更加有趣。这里涉及很多魔法，但现在你只需知道\
  \ `spark.implicits._` 使我们能够将 Scala 对象转换并编码为 DataFrame API 所需的 Spark 格式。我们将在后续章节中更详细地介绍\
  \ DataFrame。\n\n当你调用 `df.show()` 时，清单 2-2 中代码块的输出就开始了。此时，Spark 会以格式化表格的形式展示你的活动\
  \ DataFrame。\n\n```\n+-------+-------+-------+\n|user_id|cart_id|item_id|\n+-------+-------+-------+\n\
  |     u1|     c1|     i1|\n|     u1|     c1|     i2|\n|     u2|     c2|     i1|\n\
  |     u3|     c3|     i3|\n|     u4|     c4|     i3|\n+-------+-------+-------+\n\
  ```\n\n有了数据，让我们继续并逐步解决本练习开始时提出的三个问题。\n\n**提示**\n\n如果你是 Scala 新手，那么案例类需要一些介绍。简而言之，案例类创建了扩展\
  \ Scala 产品类型的模板化类，并自动生成不可变构造函数、伴生对象（辅助模板）、字段级访问器，以及 `copy`、`equals`、`hashCode` 和\
  \ `toString` 方法。案例类在编写新类时为你节省时间，并且案例类表示的不可变对象对于函数式编程和分布式系统都很重要。有关完整详细信息，请参阅[在线 Scala\
  \ 书籍](https://docs.scala-lang.org/overviews/scala-book/case-classes.html)。\n\n###\
  \ 问题 1：查找指定日期的日活跃用户\n\n现在我们有了清单 2-1 中定义的 DataFrame，获取唯一用户就像计算 DataFrame 中不同的 `user_ids`\
  \ 一样简单。清单 2-3 中的代码片段将计算唯一用户数。\n\n```\nscala> df.select(\"user_id\").distinct().count()\n\
  res1: Long = 4\n清单 2-3\n获取不同用户\n```\n\n你应该会看到数字 4。你会注意到你立即得到了这个问题的答案。\n\n### 问题\
  \ 2：计算所有用户购物车中每日平均商品数量\n\n下一个问题稍微复杂一些，因为它需要对数据进行分组和聚合。但正如你将看到的，它也可以直观地表达。将清单 2-4\
  \ 中的代码粘贴到 `spark-shell` 中（记得使用 `:paste`，然后复制，最后按 Ctrl+D 解释）。\n\n```\nval avg_cart_items\
  \ = df.select(\"cart_id\",\"item_id\")\n.groupBy(\"cart_id\")\n.agg(count(col(\"\
  item_id\")) as \"total\")\n.agg(avg(col(\"total\")) as \"avg_cart_items\")\n清单 2-4\n\
  计算所有购物车中每日平均商品数量\n```\n\n当你运行清单 2-4 中的代码时，你会注意到你不会像在清单 2-3 中那样立即得到答案。这与 Spark 的执行方式有关，这是一个明确的设计选择，称为*惰性执行*。Spark\
  \ 会制定一个执行计划，但除非有*动作*（在清单 2-3 中，`count()` 就是动作），否则不会立即执行任何操作。我们将在本书后面介绍查询计划，但为了先睹为快，请对\
  \ `avg_cart_items` 使用 `explain()` 方法，如清单 2-5 所示。\n\n```\nscala> avg_cart_items.explain()\n\
  == Physical Plan ==\n*(3) HashAggregate(keys=[], functions=[avg(total#87L)])\n+-\
  \ Exchange SinglePartition, true, [id=#109]\n+- *(2) HashAggregate(keys=[], functions=[partial_avg(total#87L)])\n\
  +- *(2) HashAggregate(keys=[cart_id#57], functions=[count(item_id#58)])\n+- Exchange\
  \ hashpartitioning(cart_id#57, 200), true, [id=#104]\n+- *(1) HashAggregate(keys=[cart_id#57],\
  \ functions=[partial_count(item_id#58)])\n+- *(1) LocalTableScan [cart_id#57, item_id#58]\n\
  清单 2-5\n使用 Explain 函数查看 Spark 在后台执行的操作\n```\n\n**注意**\n\n此时运行 `explain()` 的输出可能看起来像天书。如果你是\
  \ Spark 或 DataFrame API 的新手，这是意料之中的。还记得本章前面我们讨论过 Spark RDD 如何存储所有转换回原始数据源的数据血统吗？DataFrame\
  \ 在 RDD 之上运行，而这个计划就是那种转换数据血统的逐步示例。要读取输出，请从 explain 输出的末尾 `*(1) LocalTableScan` 开始，然后反向追溯到\
  \ `*(3) HashAggregate`。你会看到 Spark 会自动分析查询以创建执行计划，从而实现最佳结果。在这种情况下，它是一个简单的 (1) 对 DataFrame\
  \ 中的活动数据进行本地表扫描，(1) 选择我们需要的字段，`groupBy` 并聚合 (2) 每个购物车的总商品数，最后 (3) 生成聚合购物车总数的平均值。真是一段奇妙的旅程！\n\
  \n现在要获取购物车商品总数的平均值，我们需要添加一个动作。这里最简单的方法是调用 `show()`，这是 DataFrame 上的一个动作。这将执行清单 2-4\
  \ 中的语句，如清单 2-6 所示。\n\n```\nscala> avg_cart_items.show()\n+--------------+\n|avg_cart_items|\n\
  +--------------+\n|          1.25|\n+--------------+\n清单 2-6\n使用 show() 动作查看计算结果\n\
  ```\n\n我们将在后续章节中更详细地介绍 SparkSQL、DataFrame 和聚合，请将此视为对后续内容的预览。现在，让我们解决本练习的最后一个问题。\n\
  \n\n\n### 问题 3：生成所有用户购物车中被添加次数最多的前十件商品\n\n该问题与问题 2 类似，要求我们对整个 DataFrame 中的结果进行分组和排序。清单\
  \ 2-7 展示了完整的解决方案。\n\n```\nscala> :paste\n// 进入粘贴模式（按 Ctrl-D 结束）\ndf.select(\"item_id\"\
  )\n.groupBy(\"item_id\")\n.agg(count(col(\"item_id\")) as \"total\")\n.sort(desc(\"\
  total\"))\n.limit(10)\n.show()\n// 退出粘贴模式，开始解释。\n+-------+-----+\n|item_id|total|\n\
  +-------+-----+\n|     i3|    2|\n|     i1|    2|\n|     i2|    1|\n+-------+-----+\n\
  清单 2-7\n对结果集进行分组、聚合、排序和限制，以查看用户购物车中排名前 N 的商品\n```\n\n由于购物车中只有三件商品（除非你添加了更多），因此我们的查询只得到三个结果。然而，在现实世界中，你的\
  \ Spark 作业可能需要处理数百万行数据，但 Spark 使得从五行数据扩展到数百万行变得异常简单。\n\n完成此练习后，我们可以安全地停止 `spark-shell`。为此，你只需按\
  \ `Ctrl+C` 关闭会话，或按 `:q` 退出而不会产生任何错误代码。这将通知驱动程序应用程序停止运行 `spark-shell`。\n\n### 练习\
  \ 2-1：总结\n\n本练习让你通过使用 `spark-shell` 获得了 Spark 的实践经验。虽然这些练习中的代码很简单，但我希望它能让你开动脑筋，并对接下来的内容感到兴奋。\n\
  \n## 总结\n\n本章涵盖了 Apache Spark 的历史，它源于对 MapReduce 的知识和学习。你了解了 Spark 编程模型，以及它如何比 MapReduce\
  \ 提供更大的灵活性，同时实现容错性和可靠性。它还通过 Spark 应用程序内运行的进程之间共享内存数据集，带来了数据缓存和重用的额外优势。\n\n你了解了 Spark\
  \ 是如何以真正的模块化方式进行架构设计的，从而在集群管理、Spark 应用程序的运行时，甚至 Spark 应用程序所需的可插拔库和 API 之间实现了真正的关注点分离。\n\
  \n本章还介绍了 Spark 是如何构建在 JVM 上运行的，但像 Python 和 R 这样的不同编程语言如何通过命令处理网关来控制 Spark 驱动程序的操作。这意味着拥有不同技能或语言偏好的团队成员可以协同工作，编写运行在同一个底层\
  \ Spark 集群和生态系统之上的程序。\n\n我们以你的第一个练习结束了本章，你了解到 Spark 使回答常见的商业智能问题变得多么简单和富有表现力。事实上，解决不同用户计数问题（清单\
  \ 2-3）可以使用 Spark SQL 和临时内联视图进一步简化，如清单 2-8 所示。\n\n```\ndf.createOrReplaceTempView(\"\
  activities\")\nspark.sql(\"\"\"\nselect count(distinct(user_id)) as unique_users\n\
  from activities\n\"\"\").show\n清单 2-8\n创建临时视图以查找不同用户的总数\n```\n\n如前所述，Spark 提供了多种访问和处理数据的方式。事实上，Spark\
  \ SQL 可以使用 Spark Thrift 服务运行，允许你使用 [Tableau](https://www.tableau.com/) 或 [Apache\
  \ Superset](https://superset.apache.org/) 连接到 Spark 进行数据分析和可视化。\n\n下一章重点介绍核心 Spark\
  \ API 所支持的基础功能，这些功能可帮助你在处理各种外部数据源以及各种常见文件格式、协议和压缩类型时发挥作用。你将通过强化练习和示例，学习如何使用核心 Spark\
  \ API 解决作为数据工程师可能遇到的许多问题，这些练习和示例将帮助你熟悉核心 Spark API。如果你准备好了，我们就开始吧。\n\n"
- "# 3. 处理数据\n\n上一章向你介绍了 Spark 的架构和编程模型。我们快速浏览了核心 Spark 组件和 API，并以一个练习结束，该练习向你介绍了\
  \ `spark-shell` 和 DataFrame API。你还首次看到了 Spark SQL API，它使你能够以结构化的方式快速轻松地表达复杂的分析查询。它还能在编写复杂的\
  \ SQL 表达式时，干净地抽象掉底层的复杂性。\n\n在本章中，我们将继续上一章的内容，并在前两章的基础上进行构建。我们将探索通过 DataFrame API\
  \ 读取、转换和编写结构化数据的过程，并再次审视如何使用 Spark SQL。在整个过程中，你将通过专注于使用 Spark 核心[数据源](https://spark.apache.org/docs/latest/sql-data-sources.html)功能的入门练习进行动手实践。\n\
  \n作为一名数据工程师，你的工作取决于轻松处理数据的能力，我坚信这是日常工作中最重要的核心技能之一。你需要思维敏捷，找出摄取、解析和验证新数据源的新方法，这些数据源可能并非总是以最优化或最容易摄取的形式存在。但无论如何，你的任务是将数据转换为干净、结构良好且最重要的是可靠的数据。幸运的是，Apache\
  \ Spark 支持当今许多更常用的数据格式，并且你很快就会发现，跨数据源和格式工作根本不需要是一项困难的任务。\n\n在开始之前，你将学习并在开发环境中安装两个额外的基础设施组件。第一个是\
  \ [*Docker*](https://www.Docker.com) 运行时，第二个是一个名为 [*Apache Zeppelin*](https://zeppelin.apache.org/docs/0.9.0/)\
  \ 的笔记本环境。这些工具将成为你作为数据工程师旅程中的关键工具，这个过程现在就开始！\n\n## Docker\n\n对于那些尚未在*容器化*生态系统中工作过的人来说，Docker\
  \ 是当今市场上使用最广泛的容器平台之一。Docker 在帮助建立 [*开放容器倡议*](https://opencontainers.org/) *(OCI)*\
  \ 方面也发挥了重要作用，该倡议定义了容器格式和运行时应该如何工作及互操作的标准。那么，容器到底是什么？\n\n\n\n### 容器\n\n首先，我们来理解为什么容器如此重要。如果你从事过传统\
  \ DevOps 工作，或曾尝试在多台笔记本电脑或少量服务器上搭建本地环境，你就会知道，要简化每个物理环境的设置和部署步骤是多么困难。即使使用包管理器（如 `apt-get`、`yum`\
  \ 或 `homebrew`），让每个环境高效运行所需的步骤也可能很快变得难以控制。此过程中最常见的痛点集中在**一致性**和**运行时保障**上。通常，你在本地能正常工作的内容，其他工程师可能无法以同样的精细度（甚至完全无法）运行。最后，也是最重要的一点，即使你和所有人在本地都能正常运行，最终部署时情况也可能大相径庭。\n\
  \n正是由于这些原因，容器已成为关键任务应用的必备工具。有了容器，你可以专注于编写软件，因为你知道，只要共享相同的底层容器和文件系统层，你运行的内容也能在其他人那里运行，无需担心运行时包冲突或系统需求不满足的问题。\n\
  \n`Docker`（以及广义上的容器）通过让软件在轻量级、独立、可执行的环境中轻松运行，解决了软件部署的常见问题。你的软件与所有必要组件打包在一起，无论底层操作系统和硬件配置如何，都能可靠运行。这是通过在\
  \ Mac 或 PC 上进行虚拟化，创建一个 Linux 环境来实现的。在 Linux 操作系统中，控制组（*cgroups*）能够将这些轻量级、隔离的环境与共享的主机操作系统隔离开来（即“监禁”）。CGroups\
  \ 超出了本书的讨论范围，但如果你好奇[容器的工作原理](https://www.linuxjournal.com/content/everything-you-need-know-about-linux-containers-part-i-linux-control-groups-and-process)，可以上网查阅相关资料。这非常有趣。\n\
  \n最后，容器实现了跨 Linux、Mac 和 Windows，以及跨不同 CPU（如当今市场上常见的 Intel x64（64 位）、x86（32 位）和 ARM\
  \ 处理器）的统一开发体验。一切都能直接运行，无需为不同的发布环境编译和维护多个目标构建版本。\n\n安装 `Docker` 非常简单，只需下载运行时即可；或者，你也可以选择最省力的方式，安装\
  \ [*Docker Desktop*](https://www.docker.com/products/docker-desktop)，下一节将对此进行介绍。\n\
  \n### Docker Desktop\n\n按照 [`https://www.docker.com/products/docker-desktop`](https://www.docker.com/products/docker-desktop)\
  \ 上的下载说明操作，很快你的计算机上就会拥有运行 `Docker` 所需的所有组件。`Docker Desktop` 会自动保持系统更新，并在有新版本或安全补丁可供安装时通知你。如果你直接在\
  \ Linux 上运行，可以安装 [Docker 引擎](https://docs.docker.com/engine/install/)。\n\n> **注意**\
  \  \n> 在撰写本文时，`Docker Desktop` 对于使用 M1 芯片组 macOS 的用户仍处于测试阶段。要安装 M1 预览版，你必须使用此链接：[`https://docs.docker.com/docker-for-mac/apple-m1/`](https://docs.docker.com/docker-for-mac/apple-m1/)。\n\
  \n### 配置 Docker\n\n`Docker` 运行时用于协调和运行使用共享操作系统的容器。这意味着你的系统需要与 `Docker` 运行时以及宿主机（例如你的笔记本电脑、台式机或服务器）共享资源。为了有效运行\
  \ `Docker` 环境，你需要预先为 `Docker` 分配一部分（子集）CPU 核心和 RAM 内存。\n\n我建议为 `Docker` 分配以下最低资源，以确保其有效运行。CPU\
  \ 核心和内存越多越好。\n\n- CPU：4 核\n- 内存：8GB\n- 交换空间：2GB\n- 磁盘映像大小：100GB\n\n> **注意**  \n\
  > 作为经验法则，最好至少保留 1GB RAM 和至少一个 CPU 供宿主机的主操作系统使用。\n\n要重新配置你的 `Docker` 偏好设置，请按照以下步骤操作：\n\
  \n![图 3-1](img/505711_1_En_3_Fig1_HTML.jpg)  \n*图 3-1：Docker Desktop：偏好设置 ➤ 资源视图（来自用户界面）*\n\
  \n1. 打开 `Docker Desktop`。\n2. 点击配置图标（偏好设置），然后点击“资源”菜单项（参见图 3-1）。\n3. 更新配置。\n4. 点击“应用并重启”。\n\
  \n现在你已经安装了 `Docker` 运行时，可以继续学习 Apache Zeppelin 了。你将使用 Zeppelin 来运行本章的练习。\n\n## Apache\
  \ Zeppelin\n\n*Apache Zeppelin* 是一个开源的*笔记本*环境。如果你不熟悉笔记本环境是什么，没关系，学完本章你就会了解了。你可能听说过\
  \ [*Jupyter*](https://jupyter.org/)，它是数据科学家和机器学习工程师的标准实验环境。与 Jupyter 类似，Zeppelin\
  \ 也是一个基于 Web 的交互式开发环境，但它原生支持 Apache Spark 以及许多其他连接器，这些连接器被称为解释器。\n\n### 解释器\n\n\
  在 Zeppelin 中，*解释器*是一个通用接口，它允许 Zeppelin 运行时通过一个通用的*远程过程调用（RPC）*框架来控制本地库和远程服务。RPC\
  \ 使得软件客户端能够通过轻量级消息协议向后端 RPC 服务发出外部调用，从而让 RPC 客户端能够以抽象的方式在服务器上运行代码，感觉就像客户端在本地运行相同的例程一样。这种抽象使得创建高效的接口变得容易，以便与许多其他服务进行互操作，而无需更改客户端调用各种连接服务的方式。就\
  \ Zeppelin 而言，你可以将 Zeppelin 运行时视为通往许多后端服务的路由器，但具有统一的用户界面。在接下来的练习中，我们将使用 `Markdown`、`SQL`\
  \ 和 `Spark` 解释器。\n\n\n\n### 笔记本\n\n笔记本环境的神奇之处在于它能够动态编译并按需运行代码。一个*笔记本*由一系列*笔记*组成。每个笔记被拆分为一个或多个*段落*。每个段落包含独立的代码片段、文档、图表等内容。在每个笔记本中，代码可以按过程化级联方式解释运行（即按顺序依次执行每个段落，也称为*播放笔记本*），也可以异步方式单独运行某个段落。Zeppelin\
  \ 的工作方式与 `spark-shell` 类似，能够即时读取并编译你的代码，但它还能让你超越终端限制。例如，你可以：\n\n1. 将会话进度保存在笔记本中，这样就能快速重启环境并从中断处继续工作。笔记本会自动保存，因此即使电脑意外关机，你也不会措手不及。\n\
  \n2. 通过内置的 SparkSQL 解释器可视化 DataFrame 中存储的数据。这是一个有用的工具，因为人脑并不擅长阅读基于文本的数据输出并理解其含义。将数据绘制成图表对项目成功至关重要，因为你可以发现缺失数据以及其他可能被忽略的数据特征。\n\
  \n3. 在同一个笔记本中与多个用户实时交互。*此功能仅在你运行托管版 Zeppelin 或通过 [`ngrok`](https://ngrok.com/) 隧道连接到本地主机时可用。\n\
  \n4. 轻松导入和导出笔记本，共享常见问题的解决方案，无需任何人编译任何代码。\n\n在下一节中，我们将启动 Zeppelin 并探索如何充分利用这个有价值的工具。\n\
  \n**书籍源代码**\n\n如果你还没有下载本书的源代码，我建议你现在就下载。只需访问 [`https://github.com/newfront/spark-moderndataengineering`](https://github.com/newfront/spark-moderndataengineering)\
  \ 并下载其中的内容即可。在后续练习中，你将使用位于 `/ch-03/start` 的起始点。\n\n## 准备你的 Zeppelin 环境\n\n要跟随练习操作，你需要在本地安装并运行\
  \ Spark。第二章 2 已经介绍了这一过程。\n\n假设一切安装完毕，并且你能够在上一章的练习中测试 `spark-shell`，那么你可能还记得，在启动\
  \ `spark-shell` 之前，你需要手动将环境变量导出到终端会话中。更好的做法是将这些变量导出到你的 `.bashrc` 或 `.zshrc` 文件中。\n\
  \n列表 3-1 展示了运行 Spark 所需的环境变量参考。同样的过程也可以使用 `.bashrc` 或 `.bash_profile` 完成。每次运行 Spark\
  \ 时手动添加这些参数很快就会变得烦人，因此你可以将它们复制到你的 Bash 环境配置文件中。只需确保路径与你本地的设置一致即可。使用临时环境变量（如第二章 2\
  \ 所示）进行测试的原因，是为了在导出之前确保路径定义正确且一切正常。\n\n```\nexport JAVA_HOME=\"/Library/Java/JavaVirtualMachines/zulu-11.jdk/Contents/Home/\"\
  \nexport SPARK_HOME=~/install/spark-3.1.0\n列表 3-1\n来自 .zshrc 配置文件的示例\n```\n\n现在环境已经设置好，在继续之前，请确保调用\
  \ `source ~/.zshrc` 来刷新你的 Bash 会话（从终端）。现在，你可以开始行动了！\n\n### 使用 Docker 运行 Apache Zeppelin\n\
  \n执行以下两个简单步骤来启动 Zeppelin 进程。该过程将安装并启动 Zeppelin。如果这是你第一次安装 Zeppelin Docker 镜像，根据你的网络连接情况，可能需要几分钟时间。一旦此\
  \ Docker 镜像被本地缓存，启动和停止 Zeppelin 环境将非常迅速。\n\n```\n1.   cd ch-03/start/docker\n2.\
  \   ./run.sh start\n```\n\n此时，Apache Zeppelin 将在你的笔记本电脑上运行。\n\n查看 `ch-03/start/docker/run.sh`\
  \ 脚本可以更全面地了解环境是如何设置的。`start` 函数如列表 3-2 所示。\n\n```\nfunction start() {\nsparkExists\n\
  createNetwork\ndocker compose -f ${DOCKER_COMPOSE_FILE} up -d --remove-orphans zeppelin\n\
  echo \"Zeppelin 将在 http://127.0.0.1:8080 上运行\"\n}\n列表 3-2\nrun.sh 脚本中的 start 函数确保你的本地环境按预期设置，然后将\
  \ Zeppelin 容器的实际运行委托给 Docker Compose 进程\n```\n\n在短暂停顿讨论 Docker 运行时之后，我们将继续介绍 Zeppelin。\n\
  \n**注意**\n\n以下部分将进一步深入探讨调用 `run.sh start` 时的工作进程。如果你熟悉 Docker 和容器，可以跳过此部分。\n\n###\
  \ Docker 网络\n\n`run.sh` 脚本在 Docker 内部创建了一个名为 `mde` 的网络。这个桥接网络允许在 Docker 运行时内运行的容器之间相互通信，但前提是它们也共享对同一\
  \ Docker 网络的访问权限，并且该网络也受到外部主机网络的保护。这意味着，除非采取进一步操作（使用端口转发到宿主机），否则你实际上创建了一个在 Docker\
  \ 运行时内受到保护的私有网络。\n\n```\ndocker network create -d bridge mde\n```\n\n鉴于 Docker 运行的是自包含的\
  \ Linux 可执行文件，这意味着在 Docker 内部运行的容器既受到其自身容器的隔离，也受到 Docker 运行时的隔离。这很好，因为 Docker 对容器运行时采取了安全的、无共享的风格，但如果你想要从一个容器连接到多个不同的容器——例如，运行数据库、分布式文件系统或像\
  \ Kafka 或 Redis Streams 这样的流式数据源——如果不打开容器之间的共享网络，你将无法做到这一点。\n\n在接下来的章节中，我们将使用 Docker\
  \ 网络来运行各种流式管道所需的一切，并处理不同批处理作业的编排。\n\n**注意**\n\n如果你想从本地主机网络使用与容器关联的主机名，可以修改你的 `/etc/hosts`\
  \ 文件，在记录底部为 Zeppelin 添加一行。例如：`127.0.0.1 zeppelin` 将使你能够在 `http://zeppelin:8080`\
  \ 查看 Zeppelin UI。\n\n\n\n### Docker Compose\n\n编排 Zeppelin 环境的过程相当简单。在第一个用例中，大部分繁重工作由\
  \ `ch-03/start/docker/docker-compose-all.yaml` 完成。Docker Compose 配置如代码清单 3-3 所示。此处展示的配置是一个简单的示例，包含一个名为\
  \ `zeppelin` 的单一 `service`。\n\n```\nversion: '3'\nservices:\nzeppelin:\nimage: apache/zeppelin:0.9.0\n\
  container_name: zeppelin\nvolumes:\n- ${PWD}/notebook:/notebook\n- ${PWD}/logs:/logs\n\
  - ${PWD}/data:/learn\n- ${SPARK_HOME}:/spark\nenvironment:\n- SPARK_HOME=/spark\n\
  - ZEPPELIN_LOG_DIR=/logs\n- ZEPPELIN_NOTEBOOK_DIR=/notebook\n- ZEPPELIN_ADDR=0.0.0.0\n\
  - ZEPPELIN_SPARK_MAXRESULT=10000\n- ZEPPELIN_INTERPRETER_OUTPUT_LIMIT=204800\nhealthcheck:\n\
  interval: 5s\nretries: 10\nports:\n- 8080:8080\n- 4040:4040\n- 4041:4041\nnetworks:\n\
  - mde\nhostname: \"zeppelin\"\nnetworks:\nmde:\nexternal:\nname: mde\n代码清单 3-3\n\
  Docker Compose 文件 docker-compose-all.yaml 创建了一个一致的配置，用于可靠地运行一个或多个容器\n```\n\nDocker\
  \ Compose 配置是一种声明式资源，由 Docker 引擎解释，用于可靠地运行一致的服务。查看代码清单 3-3 中的 `services` 块，你会看到一系列嵌套配置，这些配置允许\
  \ Docker 运行时组装该服务。例如，`zeppelin` 服务指示 Docker 使用或拉取 `apache/zeppelin:0.9.0 image`（容器），并将生成的绑定服务关联到名为\
  \ `zeppelin` 的容器。`container_name` 属性可用作特定名称的别名。默认情况下，`docker runtime` 会创建一个唯一命名的容器。\n\
  \n**注意**\n\n`0.9.0` 是本书编写时 Zeppelin 的镜像标签和发布版本。\n\n#### Volumes\n\n`volumes` 块用于将外部卷挂载到\
  \ Docker 容器的运行时中。如果你查看 `zeppelin` 服务的配置，会看到我们将主机文件系统中的特定目录正向挂载到 `zeppelin` 容器中。这些声明使我们能够使用相对路径\
  \ `${PWD}/notebook:notebook` 自动导入 Zeppelin 入门笔记。你还会看到 `${PWD}/data:/learn` 中包含一个数据目录，以及通过\
  \ `${PWD}/logs:logs` 输出的 Zeppelin 日志。虽然所有以 `${PWD}` 开头的资源都位于我们的本地文件系统中，但生成的路径是容器内挂载卷的绝对位置（在此例中为\
  \ Zeppelin）。\n\n**提示**\n\n容器是不可变的。这是一个重要的细节，因为 Docker 容器中创建的所有文件在设计上都被隔离（或困在）在容器内。如果你不记得导出运行时所做的更改，那么根据设计，如果你停止并移除容器，启动容器后所做的所有更改都将丢失，包括任何新笔记、对配置的任何更改或运行时所做的任何其他操作。使用卷挂载，你可以共享完全可用的实验，而无需修改容器本身。这个概念是容器生态系统的核心，你将在后续章节中学习许多技术和最佳实践（以及一些有趣的技巧）。\n\
  \n#### Environment\n\n环境变量是一种在运行时修改 Docker 容器行为的简单方法。`environment` 块使我们能够覆盖 Zeppelin\
  \ 的一些默认设置，以创建（或接入）基础容器，从而实现我们期望的结果。这种技术很重要，因为自定义容器的另一种方法会导致创建新的 Docker 镜像。在 `docker-compose-all.yaml`\
  \ 中，我们使用主机系统环境变量，通过 `$SPARK_HOME` 引用并挂载本地 Spark 安装路径。这个技巧提供了一个基于本地容器的挂载 `$SPARK_HOME=/spark`，可以在\
  \ `volumes` 块下看到。然后更新 Docker 容器中的环境变量，使其指向你挂载的 Apache Spark，这让你可以在 Zeppelin 运行时中自带\
  \ Spark。很巧妙。\n\n#### Ports\n\n每个 Docker 容器都在自己隔离的环境中运行。为了允许访问外部世界，我们必须有目的地显式暴露我们想要使用的任何端口。使用\
  \ `ports` 块，我们启用了从内部 Docker 网络到主机系统的端口转发。这允许 Docker 运行时将外部请求转发到特定端口，再转发到内部容器。这一步对于暴露\
  \ Zeppelin UI 以及 Spark UI 的端口是必要的。\n\n在本书的大部分练习中，你将使用 `docker-compose`。如果你想回顾 Docker\
  \ 网络的基础知识或查看 `docker-compose` YAML 的结构，请再次访问本节。现在，让我们回到 Zeppelin。\n\n## 使用 Apache\
  \ Zeppelin\n\n打开 Zeppelin 主页（使用你喜欢的网络浏览器），地址为 localhost 端口 8080（[`http://127.0.0.1:8080`](http://127.0.0.1:8080)）。这是之前执行\
  \ `ch-03/start/docker/run.sh start` 命令的结果。确认主页加载成功，然后我们可以一起运行第一个笔记。服务主页如图 3-2 所示。\n\
  \n![](img/505711_1_En_3_Fig2_HTML.jpg)\n\n图 3-2\n\n加载 Zeppelin 主页将确认一切已正确启动\n\n\
  在 Zeppelin 环境运行后（你应该会看到与图 3-2 类似的屏幕），你会看到主页左侧有一个标有 Notebook 的部分。在此部分中，你会看到一些笔记已加载，可供动手练习使用。本地笔记本目录已通过卷挂载到你的主机系统，因此你可以添加新笔记并修改现有笔记，而无需担心更改是否会持久保存。\n\
  \n从 Zeppelin 主页，点击 `ch-03` 下名为 `3-1_IntroToSparkOnZeppelin` 的笔记本。这将打开初始启动笔记。你会注意到笔记被分成多个单独的文本块。笔记的这些单独部分称为段落。每个段落可以单独运行，或者你也可以使用笔记本顶部的播放图标，以同步级联方式运行所有段落。图\
  \ 3-3 展示了如何运行所有段落。\n\n![](img/505711_1_En_3_Fig3_HTML.jpg)\n\n图 3-3\n\n使用笔记顶部的播放图标运行所有段落\n\
  \n运行所有段落是确保笔记内容已执行且 Spark 解释器按预期工作的简单方法。这个初始步骤可能需要一点时间，因为有一些后台进程正在准备笔记本环境。\n\n**提示**\n\
  \n我更喜欢以与在线滚动浏览文章相同的方式来浏览笔记本，即采用自上而下的方法。这仅仅意味着我喜欢按顺序手动运行每个段落。这种探索策略可以帮助你理解笔记本的架构、作者的意图，并再次确认笔记中没有破坏性代码。如果你操之过急，已经点击了“运行所有段落”，那也完全没问题。不过，作为经验法则，三思而后行总是更好的，尤其是在第一次运行笔记时。\n\
  \n\n\n### 绑定解释器\n\nApache Zeppelin 使用解释器，让笔记中的每个段落能够通过统一的用户界面与不同的数据源进行交互。在后台，保持连接活跃的复杂性被委托给了\
  \ Zeppelin 服务本身。通常，每个笔记会连接到一小部分服务，但随着你逐渐习惯使用 Zeppelin，你可能会发现，交织使用多个数据源来创建整体仪表板，或调试和调查来自多个位置的数据，会更有用。\n\
  \nZeppelin 通过初始的模数行来标识每个段落关联的是哪个解释器，例如，在每个段落中都能看到 `%{interpreter}`。在你当前打开的入门笔记中，我们混合使用了\
  \ Markdown `%md` 和基于 Scala 的 Spark `%spark`。在本章的剩余部分，我们将专注于对所有新段落使用 `%spark` 解释器。图\
  \ 3-4 可作为解释器绑定的参考。\n\n![](img/505711_1_En_3_Fig4_HTML.jpg)\n\n图 3-4\n\nZeppelin\
  \ 中 Spark 解释器的一个示例\n\n如果你还没有点击“全部运行”，现在可以点击笔记中“读取 CSV”段落上的播放图标。\n\n快速回顾一下，我们刚刚了解到，一个笔记包含一个或多个段落，并且每个段落都绑定到一个独立的解释器。例如，Spark/Scala\
  \ `%spark` 或 Markdown `%md`。本质上，由 Zeppelin 笔记本环境处理的关注点分离，能够提供比直接使用 Spark shell 更一致的体验，正如你在上一章中所体验到的。\n\
  \n让我们正式开始本章的练习，目标是学习如何使用 Apache Zeppelin 来加速 Apache Spark 的探索和实验过程。\n\n### 练习 3-1：读取纯文本文件并转换\
  \ DataFrame\n\n正如我在本章开头提到的，作为数据工程师，你处理的数据并不总是定义良好、格式规范或文档齐全的。在某些情况下，就像这第一个练习，你将探索未知数据，并且需要一些自定义解析来将数据集格式化为\
  \ Spark 可以高效处理和分析的形式。那么，请设身处地，想象你是一家名为 CoffeeCo 的特色咖啡公司新入职的数据工程师。这是第一天，你被要求找到一种简单的方法来处理和清理纯文本文件，以便下游数据系统能够可靠地使用它们。\n\
  \n#### 将纯文本文件转换为 DataFrame\n\n在 Zeppelin 入门笔记中，向下滚动到标题为“读取和分析”的段落。该段落纯文本文件的内容会进入一个\
  \ DataFrame。段落代码将为你预填好，并在清单 3-4 中显示以供参考。DataFrame 的模式会打印到标准输出，让你了解 Apache Spark\
  \ 如何解释纯文本文件。\n\n```\n%spark\nval df = spark.read.text(\"file:///learn/raw-coffee.txt\"\
  )\ndf.printSchema\n清单 3-4\n该代码片段通过指示 SparkSession 读取纯文本文件来生成一个 DataFrame\n```\n\n\
  清单 3-4 中的简单代码片段使用了 `DataFrameReader` 类。`DataFrameReader` 类使你能够通过一个简单的接口，将各种数据集作为\
  \ DataFrame 加载到 Spark 中。我们将使用这个段落（Zeppelin 对笔记本中可运行部分的术语）作为练习的起点。从现在开始，你将添加新的段落、编写代码，并在进行过程中运行笔记本。\n\
  \n继续，点击段落右上角的*播放*按钮来运行该段落。Spark 引擎初始化后，你将看到以下输出。\n\n```\nroot\n|-- value: string\
  \ (nullable = true)\n```\n\n该输出是调用 `df.printSchema` 的结果。Spark 将所有数据源与一个*模式*关联起来，该模式定义了数据的类型化结构。在这种情况下，我们正在读取一个基于文本的文件，因此生成的\
  \ DataFrame 将有一个名为 `value` 的单一类型列，由 `StringType` 表示。我们将在本章末尾更详细地介绍模式，这些模式由 Spark\
  \ 的 `StructType` 和底层的 `StructFields` 封装。\n\n你可能会注意到输出的模式有点模糊。主要是，你可能会问自己，整个文件是否由这一个值表示，或者是什么。为了发现模式代表什么，让我们创建一个新的段落，并在这个简单的\
  \ DataFrame 上调用 `show()` 操作。\n\n#### 窥视 DataFrame 的内容\n\n将鼠标悬停在“读取和分析”段落下方，你会看到一个提示，显示“添加段落”。点击该提示，你会看到一个新的段落出现。这个新段落将根据前一个解释器自动填充解释器，这意味着第一行将是\
  \ `%spark`。现在，只需在 DataFrame (`df`) 上调用 `show()`，如清单 3-5 所示。\n\n```\n%spark\ndf.show()\n\
  清单 3-5\n在 DataFrame 上调用 show() 将读取最多前 20 行，并以简单的控制台格式化表格输出\n```\n\n现在运行清单 3-5 中的代码。你会看到\
  \ Spark 已经对未知的文本文件进行了基本的初步处理，根据换行符 (`\\n`) 分隔符拆分文本文件的每一行。你还会注意到输出被格式化以表示 DataFrame\
  \ 的表格结构（行和列），在这种情况下，总共五行数据，只有一列（名为 value）。\n\n```\n+--------------+\n|         value|\n\
  +--------------+\n|   folgers, 10|\n|     yuban, 10|\n|nespresso, 10,|\n|    ritual,\
  \ 4,|\n|four barrel, 5|\n+--------------+\n```\n\n这个输出让我们对数据本身有了更深入的了解。我们可以观察到，`value`\
  \ 列表示一个名称和一个数值，以逗号分隔的对形式出现。作为数据工程师，在规范化和清理数据时编写自定义解析器是很常见的。我们将逐步讲解如何解析 DataFrame\
  \ 的每一行，将其转换为一对命名列，分别代表咖啡品牌（例如，Folgers、Yuban）和相应的烘焙程度（或者简单地说，咖啡豆的深浅）。\n\n\n\n###\
  \ 使用模式匹配进行 DataFrame 转换\n\n利用你对底层数据格式的了解（通过代码清单 3-5 获得），你可以构建一个自定义转换器来格式化 DataFrame。简而言之，此转换会将每一行原始文本（来自\
  \ value 列）转换为一个表示咖啡品牌（`String`）和烘焙程度（`Int`）的 DataFrame。\n\n在代码清单 3-5 所在段落的下方新建一个段落。然后将代码清单\
  \ 3-6 的内容复制到该段落中并运行。\n\n```\n%spark\nval converted = df.map { r =>\nr.getString(0).split(\"\
  ,\") match {\ncase Array(name:String,roast:String) =>\n(name,roast.trim.toInt)\n\
  }\n}.toDF(\"name\",\"roast\")\nconverted.printSchema\n代码清单 3-6\n使用一系列转换创建新的 DataFrame\n\
  ```\n\n代码清单 3-6 是一个使用 Scala 创建函数式转换（`map`）并结合模式匹配技术的示例，从而实现了我们的自定义解析器。\n\n简而言之，代码清单\
  \ 3-6 中的转换代码执行了以下操作：\n\n1. 通过在 DataFrame 上调用 `map` 函数，你可以生成一个内联函数式转换（使用 Scala），该转换将应用于\
  \ DataFrame 的每一行（由 `r =>` 表示）。\n\n2. 鉴于 DataFrame 是行的集合（由 `Row` 类表示），并且我们知道每一行由一个\
  \ `String` 列组成，因此我们可以显式调用 `r.getString(0)` 访问器方法。这将提供一个 `String`，我们可以对其调用 `split`\
  \ 来手动细分该 `String`。\n\n3. 接下来，我们使用[模式匹配](https://docs.scala-lang.org/tour/pattern-matching.html)来解构（或[提取](https://docs.scala-lang.org/tour/extractor-objects.html)）包含两个元素的\
  \ `String` 数组，将其赋值给 `name` 和 `roast` 变量。这种技术允许我们使用命名变量，这些变量可以放入元组中。为了将烘焙程度的值转换为整数，我们首先使用\
  \ `trim` 方法移除 `String` 上任何不必要的填充（空格），以确保转换为 `int`（`roast.trim.toInt`）能够成功。值得一提的是，此处展示此方法是为了简单起见，并非完全防御性编程。对于任何包含超过两个逗号的行，此示例都会出错。完整的笔记本（在章节材料中）展示了如何使用全匹配模式\
  \ `case _ =>` 添加防御性回退。\n\n4. 最后，使用 `toDF(\"name\",\"roast\")` 方法将 Scala 元组转换回 DataFrame。由于我们是从元组转换而来，DataFrame\
  \ 的默认列名将是 `_1`、`_2`，这不太具有可读性。\n\n运行这个新段落（通过 Zeppelin 本地运行）后，你会看到生成的 DataFrame（名为\
  \ `converted`）具有所需的模式。\n\n```\nroot\n|-- name: string (nullable = true)\n|-- roast:\
  \ integer (nullable = false)\n```\n\n再创建一个段落，并调用 `converted.show()` 来查看自定义转换的效果。\n\
  \n```\n%spark\nconverted.show()\n+-----------+-----+\n|       name|roast|\n+-----------+-----+\n\
  |    folgers|   10|\n|      yuban|   10|\n|  nespresso|   10|\n|     ritual|   \
  \ 4|\n|four barrel|    5|\n+-----------+-----+\n```\n\n虽然这第一个练习并非高深莫测，但它应该能让你对学习使用\
  \ Apache Zeppelin 快速测试想法，甚至学习 Apache Spark 的方方面面感到兴奋。\n\n### 练习 3-1：总结\n\n本练习介绍了在\
  \ Docker 上运行 Apache Zeppelin 的基础知识。你学会了使用 Spark 读取和解析原始文本文件，并在此过程中了解到 DataFrame\
  \ 本质上由具有强类型列的数据行组成。接下来，我们将更深入地研究 DataFrame，揭示模式的工作原理，并学习如何让 Spark 为我们工作，从而使我们的数据工程工作更轻松，最终让我们能够更高效地工作。\n\
  \n## 处理结构化数据\n\n本着探索的精神，我们将继续研究在内容解析和转换方面，如何使用 Spark 为我们完成繁重的工作。这基本上消除了对复杂自定义解析器的需求，取而代之的是，你可以学会更多地依赖\
  \ Spark，因为它会读取数据并为其应用结构。\n\n### 练习 3-2：DataFrame 与半结构化数据\n\n返回 Zeppelin 主页。打开名为\
  \ `3-2_LetSparkWorkForYou` 的笔记本，这是练习 3-2 的起点。你将学习使用 CSV `DataFrameReader`，作为练习 3-1\
  \ 的后续，你在练习 3-1 中创建了一个简单的类型化 CSV 解析器。虽然你本可以在练习 3-1 中使用 CSV 读取器，但那样你就无法学到手动解析和转换数据所带来的宝贵技能。继续前进！\n\
  \n代码清单 3-7 中显示的段落内容使用 CSV 读取器创建了一个 DataFrame。现在你可以加载咖啡数据，而无需手动拆分列。\n\n```\n%spark\n\
  val coffees = spark.read.csv(\"file:///learn/raw-coffee.txt\").toDF(\"name\",\"\
  roast\")\ncoffees.show()\n代码清单 3-7\n通过用更强大的 CSV 读取器替换基于文本的读取器来增强代码清单 3-4\n```\n\n\
  运行代码清单 3-7 中的段落后，输出显示咖啡数据在第一次解析时似乎被正确解释（解析）。\n\n```\n+-----------+-----+\n|    \
  \   name|roast|\n+-----------+-----+\n|    folgers|   10|\n|      yuban|   10|\n\
  |  nespresso|   10|\n|     ritual|    4|\n|four barrel|    5|\n+-----------+-----+\n\
  ```\n\n尽管看起来一切顺利，但事实并非如此。让我们通过添加一个新段落来测试 `coffees` DataFrame 的模式（`printSchema`），看看原因何在。以代码清单\
  \ 3-8 中的代码片段为指导。\n\n```\n%spark\ncoffees.printSchema\n代码清单 3-8\n一个简单的 Zeppelin 段落，用于测试\
  \ Spark 通过 CSV 读取器自动生成的模式\n```\n\n嗯，事实证明 `coffees` DataFrame 的底层模式只是简单的字符串。\n\n\
  ```\nroot\n|-- name: string (nullable = true)\n|-- roast: string (nullable = true)\n\
  ```\n\n虽然 Spark 为我们省去了手动拆分 CSV 数据每一行字符串的麻烦，并且完全有能力为我们做一些繁重的工作，但我们仍然缺少拼图中的一个重要部分，那就是如何强制\
  \ Spark 为我们提供正确的模式。\n\n#### 模式推断\n\n默认情况下，Spark 采用平衡配置。这意味着你可以快速上手，并且引擎会根据 Spark\
  \ 社区的集体共同需求做出决策。这也意味着许多选项默认是关闭的，以优化引擎的整体性能。模式推断就是这种情况。\n\n如果你思考一下 Spark 在尝试推断给定输入数据集的模式时需要做什么，那么这与你的大脑在浏览和扫描同一文件时的工作方式并没有太大不同。你本能地寻找模式，并且仅通过观察就能轻松判断文件是字符串数据还是数值数据，但\
  \ Spark 并没有那么高效。Spark 必须打开文件、读取、解析并测试每个列中的数据，以生成共识，或达成一致，确定要绑定到每个列行的不同类型。\n\n对于像我们在本练习中使用的小文件来说，这不是问题。测试所有内容是成本效益高的，因为只有几行数据。然而，如果你想推断一个大型文件（恰好每行包含大量列）的模式，那么你很容易发现自己内存不足。\n\
  \n\n\n### 使用推断模式\n\n在笔记本（`3-2_LetSparkWorkForYou`）中，在刚刚添加的清单 3-8 段落下方，新增一个段落。这个新段落（如清单\
  \ 3-9 所示）将用于增强 Spark 在加载纯文本内容时对模式的解释和推断能力。\n\n```\n%spark\nval coffeeAndSchema =\
  \ spark.read\n.option(\"inferSchema\", true)\n.csv(\"file:///learn/raw-coffee.txt\"\
  )\n.toDF(\"name\",\"roast\")\ncoffeeAndSchema.printSchema\n清单 3-9\n在 DataFrameReader\
  \ 上设置 inferSchema 选项\n```\n\n通过添加这个可选配置，你现在可以释放 Spark 引擎自动推断（测试并生成）模式的能力。生成的 DataFrame（`coffeeAndSchema`）自行学习到每一行包含一个\
  \ `String` 列和一个 `Double` 列。在读取 CSV 或 JSON 等半结构化数据时，推断过程会选择最佳匹配类型。\n\n```\nroot\n\
  |-- name: string (nullable = true)\n|-- roast: double (nullable = true)\n```\n\n\
  使用这种技术可以让 Spark 从数据的一个较小子集（例如大文件的前 10,000 行）中学习。在实践中，上游数据可能会以不可预见的方式发生变化，因此在处理半结构化数据时，使用显式模式（声明式）通常更符合你的最佳利益。\n\
  \n### 使用声明模式\n\n你可以使用模式推断来生成并导出一个具体的模式，以便后续复用。在处理关键数据集时，使用严格模式可以让你忽略（跳过）损坏的数据，或者在遇到不符合规范或解析错误的数据时快速失败并抛出异常。最后，使用特定模式能让\
  \ Spark 更高效地运行，因为模式推断需要测试数据集子集（样本）中的所有列，才能为每个列类型达成一致。我将向你介绍一种我称之为“窃取模式”的有趣技术，你可以用它来生成并导出严格模式。\n\
  \n### 窃取模式\n\n创建一个新段落，并以清单 3-10 为指导。完成后，继续运行它。\n\n```\n%spark\nimport org.apache.spark.sql.types._\n\
  // 窃取模式\nval coffeeSchema: StructType = coffeeAndSchema.schema\nval coffeeSchemaDDL:\
  \ String = coffeeSchema.toDDL\n// `name` STRING,`roast` DOUBLE\n// 创建一个显式模式（从窃取的模式中）\n\
  val coffeeDDLStruct: StructType = StructType.fromDDL(coffeeSchemaDDL)\n// 直接使用窃取的模式读取咖啡\
  \ CSV 文件\nval coffees = spark.read\n.option(\"inferSchema\", false)\n.schema(coffeeDDLStruct)\n\
  .csv(\"file:///learn/raw-coffee.txt\")\n清单 3-10\n使用 DataFrame 上的 DDL 方法导出推断模式\n\
  ```\n\n清单 3-10 中的“窃取模式”展示了如何将推断模式提取为 DDL 字符串。应用此技术时，你可以将 `coffeeSchemaDDL` 的值直接导出到文件系统，或者简单地手动复制粘贴到配置文件中。关键之处在于，你可以将\
  \ DDL 字符串直接加载到 `DataFrameReader` 中，从而绕过模式推断，并最终为 Spark 应用程序中的数据处理添加更明确的严格规则。\n\n\
  ```\nspark.read\n.schema(\"`name` STRING,`roast` DOUBLE\")\n.csv(\"file:///learn/raw-coffee.txt\"\
  )\n```\n\n这种模式可以节省时间，并使你的应用程序能够在生产环境中强制执行严格模式，而无需依赖推断。虽然在你从一个已知模式开始时这个过程并非必需，但了解其可能性以及\
  \ `StructType` 如何在 DDL 和内部 Spark 模式之间轻松转换是值得的。你也可以使用 Spark DSL 手动创建数据定义。\n\n###\
  \ 构建数据定义\n\n使用“窃取模式”（清单 3-10）得到的推断模式与练习 3-1 中的结果模式略有不同。区别在于与 `roast` 列关联的推断数据类型。我们想要一个整数，但\
  \ Spark 将其解释为 `double`，即 Spark 的 `DoubleType`。我们可以通过手动构建 `StructType` 来纠正这个模式。\n\
  \n在 Zeppelin 笔记本中添加另一个段落，并将清单 3-11 中的代码片段复制到该段落中；点击运行。这种手动操作带来的额外好处是为模式中的每个字段提供了文档说明。\n\
  \n```\n%spark\nval coffeeSchema = StructType(\nSeq(\nStructField(\"name\", StringType,\n\
  metadata = new MetadataBuilder()\n.putString(\"comment\", \"咖啡品牌名称\")\n.build()),\n\
  StructField(\"roast\", DoubleType,\nmetadata = new MetadataBuilder()\n.putString(\"\
  comment\", \"咖啡烘焙度 (1-10)\")\n.build())))\nval coffees = spark.read\n.option(\"\
  inferSchema\", \"false\")\n.schema(coffeeSchema)\n.csv(\"file:///learn/raw-coffee.txt\"\
  )\n清单 3-11\n构建一个 coffeeSchema StructType，以便在将咖啡数据作为 DataFrame 读取时直接使用\n```\n\n手动定义\
  \ `StructType` 可以解锁 `StructField` 对象上直接可用的额外选项，包括声明每个命名列的 `DataType` 以及至关重要的元数据选项。让我们深入幕后，进一步了解\
  \ `StructType`、`StructField`、`DataType` 和元数据。\n\n### 关于 StructType 的一切\n\n正如我们在清单\
  \ 3-11 中看到的，当我们组合一个模式定义时，实际上是在生成一个 `StructType` 类的实例。`StructType` 是一个元数据对象，用于存储\
  \ DataFrame 中每个列的字段级信息。这类似于 SQL 中的表定义。`StructType` 本身只是一个容器对象，由一系列 `StructFields`\
  \ 组成。\n\n\n\n## StructField\n\n`StructField` 是一个与 DataFrame 中列关联的简单对象。每个 `StructField`\
  \ 都有一个唯一的字段名、一个 `DataType`、一个声明该列是否可为空的布尔值，以及一个可选但重要的元数据。\n\n## Spark 数据类型\n\nSpark\
  \ 支持多种可在 DataFrame 中表示的数据类型。每种类型都可以在 Java JVM 和本地内存之间自动转换。我们将在第 6 章深入探讨 Catalyst\
  \ 引擎，但本节可作为对开箱即用类型的入门介绍。表 3-1 可在后续练习中作为快速参考。虽然该表并非所有可用数据类型的完整列表，但足以帮助您入门。\n\n**表\
  \ 3-1** Apache Spark 可在 Scala 类型与本地编码的 DataType 之间进行原生转换\n\n| DataType | Scala 中的值类型\
  \ | Spark API |\n| --- | --- | --- |\n| `ByteType` | `Byte` | `ByteType` |\n| `ShortType`\
  \ | `Short` | `ShortType` |\n| `IntegerType` | `Int` | `IntegerType` |\n| `LongType`\
  \ | `Long` | `LongType` |\n| `FloatType` | `Float` | `FloatType` |\n| `DoubleType`\
  \ | `Double` | `DoubleType` |\n| `DecimalType` | `java.math.BigDecimal` | `DecimalType`\
  \ |\n| `StringType` | `String` | `StringType` |\n| `BinaryType` | `Array[Byte]`\
  \ | `BinaryType` |\n| `BooleanType` | `Boolean` | `BooleanType` |\n| `TimestampType`\
  \ | `java.sql.Timestamp` | `TimestampType` |\n| `DateType` | `java.sql.Date` | `DateType`\
  \ |\n\n您可能熟悉表 3-1 中的部分（或全部）Scala 类型。我们甚至已经使用过一些原生的 `DataType`。您还记得是哪些吗？到本书结束时，您将使用过该表中的大部分原生类型（尽管是隐式地），此外，随着我们进入本书后续章节，还会接触到更复杂的类型。现在，请先记住这张表，我们将花一点时间来了解如何使用\
  \ `Metadata` 类。\n\n## 为结构化模式添加元数据\n\n`Metadata` 类是对 `Map[String, Any]` 的简单封装，它允许您在字段级别为模式添加描述性元数据。`comment`\
  \ 字段是一个保留的元数据键名，会自动带入您的表定义中。最终，使用元数据可以让您记录数据集，并解决因数据文档不完善而导致的发现难题。通过使用一个简单的内置结构，您可以为其他工程师、系统和分析师提供便利。\n\
  \n## 练习 3-2：总结\n\n此时，您可能已经开始理解，甚至可能对 Spark 的能力感到兴奋。我发现从内到外解决问题很有帮助，而在迄今为止的练习中，我们正是这样做的。您在练习\
  \ 1 中学习了如何读取纯文本并将其转换为一个干净且定义明确的 DataFrame，并发现了如何利用模式推断来省去编写自定义字段级解析器的工作。然后，您了解到手动构建模式（`StructType`）并提供字段级元数据和声明式\
  \ `DataType` 还有一些额外的好处。我们已经涵盖了很多内容，但我们还有更长的路要走，所以如果您准备好了，我们将开始接触一点 Spark SQL。\n\n"
- '# 使用解释型 Spark SQL


  这里有谁喜欢 SQL？Spark 作为数据工程师让我们的生活更轻松的方式之一，是使我们能够像在传统 SQL 数据库中简单查询表一样处理数据。您可能会问，这是如何实现的？嗯，只需利用它已知的数据结构即可。这是一种迂回的说法，即
  Spark 依赖 `StructType` 来物化视图，供您的应用程序使用。让我们通过一个实际示例来看看如何操作。


  ## 练习 3-3：SparkSQL 快速入门


  在本练习中，您可以继续使用练习 3-2（“3-2_LetSparkWorkForYou”）中的 Zeppelin 笔记。我们上次结束时（见清单 3-11），您刚刚创建了一个手动模式并重建了
  `coffees` DataFrame。


  ### 创建 SQL 视图


  在笔记中添加一个新段落，并输入清单 3-12 的内容。


  ```

  %spark

  coffees.createOrReplaceTempView("coffees")

  spark.sql("desc coffees").show(truncate=false)

  清单 3-12

  使用 DataFrame 通过 createOrReplaceTempView 创建 SQL 视图

  ```


  只需一行代码（清单 3-12），您就可以使用 `coffees` DataFrame 轻松生成一个临时的内存视图。这将在您的 `SparkSession` 上下文中注册一个临时表，该表将在会话期间存在，直到您显式删除它。清单
  3-12 的第 2 行引入了 SQL 解释器，该解释器可通过 `SparkSession` 使用。


  ```

  spark.sql("desc coffees").show(truncate=false)

  ```


  在段落（清单 3-12）上点击运行后，您将看到输出显示表元数据。您注意到什么有趣的地方了吗？


  ```

  +--------+---------+-------------------------+

  |col_name|data_type|comment                  |

  +--------+---------+-------------------------+

  |name    |string   |咖啡品牌名称             |

  |roast   |double   |咖啡烘焙等级 (1-10)      |

  +--------+---------+-------------------------+

  ```


  如练习 3-2 所述，元数据有一个名为 `comment` 的保留键，其值将应用于您创建的任何表。为模式定义元数据的主要好处之一是通过记录数据为其他工程师提供便利。这个简单的示例说明了字段级文档为何有益。现在，任何描述
  `coffees` 表的人都可以立即理解每个列的含义。这可谓价值连城。


  在您的活动 Zeppelin 会话中有了临时视图（`coffees`）之后，是时候学习如何使用 `%sql` 解释器了。


  ### 使用 Spark SQL Zeppelin 解释器


  在您的笔记中添加另一个新段落，然后添加清单 3-13 中的简单 SQL 命令。


  ```

  %sql

  select * from coffees

  清单 3-13

  在 Apache Zeppelin 中使用 Spark SQL 解释器

  ```


