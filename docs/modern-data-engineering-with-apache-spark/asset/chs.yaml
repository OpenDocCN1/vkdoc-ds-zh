  ```


  现在，让我们换个话题，学习如何查看与 Spark 驱动程序应用程序日志和 Spark Driver UI 相关的运行时信息。




  #### 查看驱动程序日志


  通过调用 `spark-submit` 生成的驱动程序 Pod（而非启动 Pod 本身）上，可以获取应用程序日志。这种间接性是因为我们使用集群部署模式来部署应用程序。


  ```

  % kubectl logs spark-redis-streams-app-driver -f \

  -n spark-apps

  ```


  现在，您可以通过 `-f` 参数实时跟踪驱动程序日志的更新。如果您想转储日志，请省略 `-f` 参数，这样您将看到存储在 `kubelet` 中驱动程序 Pod
  的所有可用日志。（Pod 中容器的日志存在内存限制，因此 `-f` 选项允许您在处理流式应用程序时读取所有日志。）


  #### 查看驱动程序 UI


  与查看驱动程序日志的过程类似，您可以连接到远程驱动程序 Pod，并使用一个名为 `port-forward` 的简单 `kubectl` 命令来转发 Spark
  UI。


  ```

  % kubectl port-forward {spark-driver-pod} 4040:4040 \

  -n spark-apps

  ```


  其精妙之处在于，只有您组织中能够访问您命名空间的成员才能使用 Spark UI。在此示例中，只有您可以访问自己的 minikube 集群。


  #### 发送 CoffeeOrder 事件


  打开一个新的终端窗口，并通过 `exec` 命令连接到本章第一部分中的 Redis 服务 Pod。


  ```

  % kubectl exec -it redis-deployment-pv-{hash} \

  -n data-services \

  -- redis-cli

  ```


  然后，向 `CoffeeOrder` 的流中添加一些记录。


  ```

  % xadd com:coffeeco:coffee:v1:orders  * timestamp 1637548381179 orderId ord123 storeId
  st1 customerId ca100 numItems 6 price 48.00

  % xadd com:coffeeco:coffee:v1:orders  * timestamp 1637548458800 orderId ord124 storeId
  st1 customerId ca101 numItems 3 price 36.00

  % xadd com:coffeeco:coffee:v1:orders  * timestamp 1637720977241 orderId ord125 storeId
  st2 customerId ca102 numItems 1 price 4.99

  % xadd com:coffeeco:coffee:v1:orders  * timestamp 1637783601557 orderId ord126 storeId
  st1 customerId ca103 numItems 2 price 10.99

  ```


  您应该会在驱动程序日志中看到一些活动（打开一个窗口并跟踪日志），或者前往驱动程序 UI 查看 Spark Structured Streaming UI 或 Spark
  SQL 微批次。当您准备好并确认应用程序正在运行（并处理数据）后，即可删除驱动程序和跳板 Pod。


  #### 删除驱动程序和跳板 Pod


  当您删除 Spark Structured Streaming 驱动程序时，与该驱动程序关联的所有资源也会被删除。这些资源会通过 `ownerReferences`
  自动为您管理。当您完成应用程序运行，或者需要在事故期间关闭系统时，Kubernetes 将负责删除由 `spark-submit` 进程生成的任何资源，包括自动生成的
  `configMaps`、驱动程序 Pod 服务以及执行器 Pod。


  ```

  % kubectl delete pod/redis-streams-app-driver -n spark-apps

  pod "redis-streams-app-driver" deleted

  ```


  虽然驱动程序 Pod 及其所有资源现在都已移除，但您的跳板 Pod 仍然保留。这是因为您启动了跳板 Pod，而您触发的 `spark-submit` 进程生成了驱动程序及相关配置和密钥。当您准备好关闭跳板
  Pod 时，只需同样将其删除即可。


  #### 自动化部署与自动恢复


  当您对应用程序的稳定性感到满意（一切按预期运行）时，可以应用简单的 `deployment-redis-streams.yaml` 文件来部署上一节中涵盖的所有内容。


  ```

  % kubectl apply -f ch-15/spark-on-kubernetes/spark-redis-streams/deployment-redis-streams.yaml

  service/redis-service unchanged

  configmap/spark-redis-streams-conf unchanged

  secret/hivesite-admin configured

  secret/minio-access configured

  deployment.apps/spark-redis-streams-app created

  ```


  恭喜！您刚刚在 Kubernetes 上部署了一个幂等的 Spark Structured Streaming 应用程序。


  ### 第 2 部分：总结


  本章的后半部分让您付诸实践，并让您掌控在 Kubernetes 上运行 Spark Structured Streaming 应用程序。您学习了如何创建可靠的有状态部署，以及如何使用服务别名（外部网络服务类型）在命名空间之间进行通信。本章是一个开端，教您如何充分利用完全容器化的
  Apache Spark 应用程序。既然您已读完本书，还有许多方向可以探索。在结论之后，我还提供了一些额外的思考内容。敬请继续阅读！


  ## 结论


  首先，感谢您达到这个重要的里程碑，并将本书坚持读完。我希望本书中传授的经验能帮助您以不同的视角思考您的工作、与您共事的工程师、您所效力（或拥有）的公司、您所影响的系统，以及如何优化您作为数据工程师的每日时间投入产出。本书基于我在
  Twilio 公司任职时的真实经历、众多研讨会（内部和外部举办）、在 Spark 办公时间（同样在 Twilio）提供指导和调试应用程序的无数时光，以及过去六年与
  Apache Spark 打交道并使其与不同数据系统和服务协同工作的无数其他经验教训。我认识到，通往流式处理卓越之路并非总是一帆风顺。但是，只要有时间、耐心，并能够使用本地数据平台或直接在基于
  Spark 的单元测试中本地验证假设，您就能以更少的时间和麻烦解决最复杂的问题。


  请记住，几乎所有数据问题，无论大小，都可以分解成更小、更易于处理的问题，然后再重新组合起来。花时间去理解手头的问题，制定一个行动计划，并朝着最优解决方案努力。如果问题需要一个更通用的解决方案以实现广泛复用，那就大胆去做。最后，请记住在其中寻找乐趣，并享受您所做的工作。




  '
- '# 结语与展望


  Docker、容器和 Kubernetes 已经改变了组织以一致且隔离的方式处理数据的方式。将 Apache Spark 纳入考量，便打开了通往全新表达复杂数据管道与转换的大门，这些管道与转换通过它们与数据所涵盖的更大规模数据网络之间的多重关系得以实现。


  本书只是现代数据工程这座冰山的尖顶，提供了我发现在处理任何规模的数据问题时都极具价值的基础知识。关于下一步该往何处去，我有一些想法供你参考。


  - **JVM 调优**。Apache Spark 使用 JVM 垃圾回收机制。对于流式作业，默认的 G1GC 设置可能会由于小对象随时间堆积而导致较长的 GC
  暂停。这是基于 IO 密集型作业处理大量记录（每个微批次）的结果。请使用阶段和任务级别的 GC 指标来跟踪 GC 暂停、GC 线程数量和对象数量。如果你的内存不足且包含大量字符串对象，还可以在驱动器和执行器中添加`-XX:+UseStringDeduplication`以及其他额外的
  Java 选项来减少内存占用。


  - **Amazon EKS 和托管节点组**。Amazon 为其弹性 Kubernetes 服务提供了一个名为*托管节点组*的功能（底层使用自动扩缩组）。此功能使你能够创建按需或竞价实例的隔离组，这些组可以（使用选择器）被显式调度，以运行你的
  Spark 驱动器或应用程序执行器。每个托管节点组根据热节点总数，使用最小值、期望值和最大值这三个概念进行扩缩容。你可以将最小值设置为 0，这意味着当应用程序启动时，节点将按需获取（这对于昂贵的实例类型非常有利，例如
  GPU 实例，或偶尔用于一次性任务的巨型实例）。Amazon 会尽力维持你的期望节点数量，并在达到分配节点的最大数量后停止分配。如果你需要运行一个基于 Amazon
  EKS 的平台，此选项有助于在命名空间级别划定资源限制。


  - **托管 Kafka、RDBMS 和 Redis**。随着公司的发展，大规模管理 Kafka 需要一个专门的团队。如果你刚开始着手，采用完全托管的 Kafka（使用
  Confluent 或 Amazon）并花时间使用它而不是运维它会很有帮助。你的数据库需求（无论是 OLTP/OLAP/NoSQL 等）也是如此。通过付费方式使用服务是快速前进的途径，可以避免同时还要扩展规模并提供全天候运维支持的头痛问题。记住要举办游戏日场景演练，因为正常运行时间
  SLA 通常提供 99.999%级别的保障，这意味着服务仍可能偶尔不可用或需要一些手动干预。


  - **湖仓一体**。我们在本书中介绍了数据湖和数据仓库。当前市场上有几种常见的开源平台，它们将数据湖的可扩展性与强模式以及事务性插入、合并和删除操作结合在一起。[DeltaLake](https://delta.io/)、Apache
  [Hudi](https://hudi.apache.org/)和 Apache [Iceberg](https://iceberg.apache.org/)是三种相互竞争的技术，它们均开箱即用地支持
  Apache Spark。我倾向于偏向由 Spark 社区构建的技术，因此如果 Apache Spark 支持对你的湖仓一体需求至关重要，请尝试使用 DeltaLake。你只需放入一个额外的
  JAR 包，就可以开始了。




