  \ Spark Driver 应用如何在独立集群中部署和分发。\n\n## 多租户的分布式共享资源与资源调度\n\n请将 Spark 独立集群视作一个分布式操作系统。您拥有总计的*核心数*（CPU）、总计的*内存量*（RAM），以及每个*节点*、worker（执行器）和\
