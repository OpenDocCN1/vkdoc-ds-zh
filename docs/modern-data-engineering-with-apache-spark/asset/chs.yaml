- "# 以分离模式运行 Airflow\n\n以分离模式运行允许你将每个容器作为后台进程运行，该进程会持续运行，直到你显式地停止容器进程（或关闭机器）。在分离模式下运行时，需要考虑两件事。首先是用于启动和关闭容器的方法。例如，你是偏好使用命令行别名还是脚本文件？第二件要考虑的事情是你想如何管理使用多服务\
  \ Docker Compose 定义创建的复合运行时环境，以及你希望共享卷和目录位于何处以及如何引用。让我们先了解如何以分离模式运行 Airflow，然后提供一个解决方案，用于创建更精简的本地\
  \ Docker 环境。\n\n## 启动服务\n\nDocker Compose 进程接受显式的文件指针 `-f`，可用于传递绝对路径，同时还有 `-d` 标志，它会将进程更改为在后台而不是前台运行。这两种模式的区别在于，在前台你会看到由你的\
  \ `docker-compose.yaml` 定义控制的所有容器的所有日志。而在后台，如果你想要重新连接到容器的输出并查看输出，则必须引用实际的容器标识符：`docker\
  \ logs -f container_ID`。清单 8-5 显示了更长的 `docker compose` 命令。你可以从 Airflow 工作目录运行此命令。\n\
  \n```\ndocker compose \\\n-f docker-compose.yaml \\\nup -d\n清单 8-5\n向 docker compose\
  \ 传递文件引用并以分离模式运行\n```\n\n## 关闭服务\n\n当你准备好关闭 Airflow 集群时，可以再次使用 `docker compose`\
  \ 来停止所有容器。执行清单 8-6 中的命令来关闭你的 Airflow 集群。\n\n```\ndocker compose \\\n-f docker-compose.yaml\
  \ \\\ndown --remove-orphans\n清单 8-6\n使用 docker compose 关闭 docker-compose.yaml 定义中直接定义的所有服务\n\
  \n从本地目录（例如 `/ch-08/airflow/`）中启动和关闭 Airflow（或任何由 Docker Compose 控制的服务）的过程足够简单。然而，从长远来看，除非你努力组织好自己的本地环境，否则这个过程会比实际需要的更困难。例如，如果你有许多由多个\
  \ `docker-compose.yaml` 定义控制的环境，以支持许多不同的本地数据工程用例，那么容器命名冲突或其他环境问题可能会出现。从长远来看，创建一个服务层次结构，整齐地嵌套在根目录下，会容易得多。现在我们来看看如何优化你的本地环境，以降低后续流程的复杂性。\n\
  \n\n\n#### 优化本地数据工程环境\n\n随着你为本地数据工程环境添加越来越多的技术，你可能会发现创建一个统一的位置（父目录）很有用，该目录可用于创建一个有序的本地数据平台，按服务划分，并结合特定的服务卷挂载、`docker-compose.yaml`\
  \ 定义和 `.env` 规范来组织，从而为 Docker 运行特定技术创建一致的环境。\n\n现在让我们来优化你的环境。将本章迄今为止完成的所有工作复制到 `dataengineering`\
  \ 父目录中。执行清单 8-7 中的命令，将 `dataengineering` 目录添加到你的主目录中。\n\n```\nmkdir ~/dataengineering\
  \ &&\ncp -R /path/to/ch-08/airflow ~/dataengineering\n清单 8-7\n创建 dataengineering\
  \ 根目录并从章节练习中复制 airflow 目录及其内容\n```\n\nAirflow 已顺利安置在新家，下一步是添加一个简单的别名来启动和停止 Airflow。别名可以添加到你的本地\
  \ Bash 或 shell 环境设置文件（`.bashprofile`、`.bashrc` 或 `.zshrc`）中，具体取决于你运行的命令行。清单 8-8\
  \ 展示了如何为 UNIX 风格系统添加 `airflow2_start` 和 `airflow2_stop` 别名。\n\n```\n### Apache Spark\
  \ 的 MDE 辅助工具\nexport DATA_ENGINEERING_BASEDIR=\"~/dataengineering\"\nalias airflow2_start=\"\
  docker compose -f ${DATA_ENGINEERING_BASEDIR}/airflow/docker-compose.yaml up -d\"\
  \nalias airflow2_stop=\"docker compose -f ${DATA_ENGINEERING_BASEDIR}/airflow/docker-compose.yaml\
  \ down --remove-orphans\"\n清单 8-8\n使用 Bash 别名简化 Airflow 的启动和停止\n```\n\n对配置文件进行更改后，请确保运行\
  \ `source` 命令将更改加载到当前会话中。例如，执行 `source ~/.zshrc` 命令会将这两个 Airflow 别名添加到当前终端会话中。现在，无论何时需要启动本地\
  \ Airflow 集群，你只需记住 `airflow2_start`；同样，当你完成工作或想释放一些系统资源时，只需调用 `airflow2_stop` 即可。你已经让启动和停止\
  \ Airflow 变得更加容易。你可能也迫不及待想查看效果了。让我们回到正题。\n\n#### 健康检查：Airflow 在运行吗？\n\n假设你已经使用 `airflow2_start`\
  \ 别名或清单 8-4 与清单 8-5 中的任一命令启动了 Airflow，那么检查程序是否运行的最简单方法是打开你常用的浏览器，访问 `http://localhost:8088`。你会看到一个登录界面，如图\
  \ 8-2 所示。\n\n![](img/505711_1_En_8_Fig2_HTML.jpg)\n\n图 8-2\n\nAirflow 登录界面\n\n登录界面确认至少\
  \ Airflow 的 Web 服务器进程已启动并正在运行。你可以使用用户名（`airflow`）和密码（`airflow`）登录。登录后应会进入 Airflow\
  \ 的主用户界面（见图 8-3）。\n\n![](img/505711_1_En_8_Fig3_HTML.jpg)\n\n图 8-3\n\nAirflow 的默认用户界面\n\
  \n注意\n\n你的浏览器可能会提示用户名和密码已泄露。这是因为 `airflow:airflow` 这个用户名:密码组合是 Airflow 的默认值，除了本地测试外，绝不应在其他任何场合使用。\n\
  \n在 Airflow 主屏幕上，你将看到所有作业定义、作业元数据以及每个作业先前运行（如果有）的统计信息。这也是进行常规安全管理和常见管理任务的出发点。在本章中，我们将花一些时间了解用户/角色控制，并探讨如何添加安全配置（如密码）。\n\
  \n首先，你的作业定义官方称为 *DAG*（有向无环图）。这是因为每个作业都被定义为一个或多个操作的有向无环图，本质上每个 DAG 本身就是一个管道操作或一个完整的复杂工作流。\n\
  \n注意\n\n你可以选择保留或删除这些默认作业。我建议保留它们，以便你可以浏览示例，了解 Airflow 能实现哪些功能。\n\n#### 运行 Airflow\
  \ DAG\n\n在 Airflow 运行且你已处于 DAG 屏幕的情况下，让我们运行其中一个示例作业。点击 `example_bash_operator`（位于示例列表顶部）进入\
  \ DAG 概览屏幕（见图 8-4）。\n\n![](img/505711_1_En_8_Fig4_HTML.png)\n\n图 8-4\n\nAirflow\
  \ 的 DAG 详情用户界面是你完成大部分工作的地方\n\n图 8-4 中的 DAG 用户界面为你提供了一个多步骤管道作业的总体概览。要运行此示例作业，你需要执行以下两步：\n\
  \n1.  将开关图标（图 8-4 中“DAG”字样左上角）切换至启用状态。默认情况下 DAG 处于禁用状态以节省集群资源。你需要选择启用以运行每个计划或单次执行。\n\
  \n2.  点击播放图标（右侧，刷新和删除按钮旁边）开始运行管道。\n\n当你按下“触发”按钮后（确认可选的 JSON 配置后），作业将启动，随后你会看到作业过渡到“运行中”状态。图\
  \ 8-5 中的用户界面显示了实时的 Airflow 作业视图。\n\n![](img/505711_1_En_8_Fig5_HTML.png)\n\n图 8-5\n\
  \n实时 Airflow 作业的运行视图\n\n值得一提的是，该作业几乎会立即完成；但更新后的 Airflow 2 用户界面的一个不错功能是自动刷新选项（如图\
  \ 8-5 右侧所示）。如果启用此选项，你可以在管道在操作阶段之间主动切换时观察其进度，这有助于在 DAG 中任务完成或失败时监控/观察进度或故障。\n\n####\
  \ 练习 8-1：总结\n\n现在，无论何时你想要启动 Apache Airflow，它都已准备就绪。但是，要从 Airflow 启动 Spark 批处理作业，你还需要完成更多工作。下一节将向你介绍\
  \ Airflow 的组件，然后我们将安装 Spark 运算符。\n\n## Apache Airflow 的核心组件\n\n在运行了第一个 Airflow DAG\
  \ 之后，现在是时候讨论最初让 DAG 得以运行的组件了。主要是 Airflow 的任务、运算符、调度器和执行器。\n\n### 任务\n\n在每个 DAG 内部，都存在一系列一个或多个*任务*，这些任务被执行以完成特定\
  \ DAG 所规定的要求。任务是 Airflow 中的基本执行单元，对于 Spark 应用程序也是如此。这里的重叠之处在于，对于 Spark，你有作业，每个作业由分配任务的任务阶段组成。对于\
  \ Airflow，你的 DAG 由任务组成，这些任务按特定预定义顺序运行，工作是在管理特定 DAG 的 Airflow 执行器上下文中完成的。任务可以使用运算符执行任意代码，因此每个\
  \ DAG 可以处理许多任务。每个任务可以根据所使用的运算符在本地或远程执行。\n\n\n\n### 运算符\n\nAirflow 运算符是模板化的任务。你可以将其视为一个可复用的蓝图，用于封装通用用例，使得通用的\
  \ Python 代码能够被复用以完成特定操作。在示例 DAG（`example_bash_operator`）中，你已经接触了两个核心的 Airflow 运算符——`BashOperator`\
  \ 和 `DummyOperator`。\n\n`BashOperator` 的功能正如其名：它用于执行 bash（或命令行）操作。`DummyOperator`\
  \ 用于确保 DAG 在任务图中有一个最终的公共节点。在构建更复杂的 DAG 时，`DummyOperator` 也可用作占位符。清单 8-9 展示了 `example_bash_operator`\
  \ DAG 的 Python 代码。\n\n```python\nfrom datetime import datetime, timedelta\nfrom\
  \ airflow import DAG\nfrom airflow.operators.bash import BashOperator\nfrom airflow.operators.dummy\
  \ import DummyOperator\nwith DAG(\ndag_id='example_bash_operator',\nschedule_interval='0\
  \ 0 * * *',\nstart_date=datetime(2021, 12, 28),\ndagrun_timeout=timedelta(minutes=60),\n\
  tags=['example', 'example2'],\nparams={\"example_key\": \"example_value\"},\n) as\
  \ dag:\nrun_this_last = DummyOperator(task_id='run_this_last',)\nrun_this = BashOperator(\n\
  task_id='run_after_loop',\nbash_command='echo 1',\n)\nrun_this >> run_this_last\n\
  for i in range(3):\ntask = BashOperator(\ntask_id='runme_' + str(i),\nbash_command='echo\
  \ \"{{ task_instance_key_str }}\" && sleep   1',\n)\ntask >> run_this\nalso_run_this\
  \ = BashOperator(\ntask_id='also_run_this',\nbash_command='echo \"run_id={{ run_id\
  \ }} | dag_run={{ dag_run }}\"',\n)\nalso_run_this >> run_this_last\nthis_will_skip\
  \ = BashOperator(\ntask_id='this_will_skip',\nbash_command='echo \"hello world\"\
  ; exit 99;',\ndag=dag,\n)\nthis_will_skip >> run_this_last\nif __name__ == \"__main__\"\
  :\ndag.cli()\n清单 8-9\n创建包含同步和异步任务的 DAG\n```\n\n在清单 8-9 中，每个任务都被定义为 `DummyOperator`\
  \ 或 `BashOperator` 的一个实例。你定义的每个任务都作为图中的一个节点，而作为设计管道的工程师，你需要通过将任务（节点）相互设置为子节点或父节点来建立处理顺序。\n\
  \n在图模式（如图 8-6 所示）下查看你的 DAG，有助于你规划更复杂的工作流。本质上，每个任务可以复杂也可以简单。`SparkOperator` 就是一个可以添加到工作流中的复杂任务示例。\n\
  \n![](img/505711_1_En_8_Fig6_HTML.jpg)\n\n图 8-6\n\n组成简单 `example_bash_operator`\
  \ DAG 的相互连接与独立任务的图形视图\n\n我们将在本章后面更详细地介绍专门的 `SparkSubmitOperator` 和 `SparkSQLOperator`。为了让你全面掌握\
  \ Airflow 的各种功能，我的建议是你在新的本地沙盒环境中尽情探索和实验。接下来，我们将探讨 Airflow 如何在 DAG 中运行每个任务背后的过程。\n\
  \n### 调度器与执行器\n\n执行器是 Airflow 中的进程，负责根据计划启动 DAG 中的任务。例如，假设你有一个需要在每天结束时运行的作业。调度此\
  \ DAG 的属性如清单 8-10 所示。\n\n```python\nDAG(\ndag_id=\"daily_active_users_reporting_job\"\
  ,\nstart_date=days_ago(2),\ndefault_args=args,\ntags=[\"coffee_co\",\"core\"],\n\
  schedule_interval=\"@daily\",\n)\n清单 8-10\n配置每日 Cron 作业的 DAG 示例\n```\n\nAirflow\
  \ 在启动时会解析 DAG 定义，并定期解析以支持在运行时添加 DAG。当遇到新的 `dag_id` 时，DAG 元数据会被写入关系数据库管理系统（RDBMS），并且一旦超过\
  \ `start_date` 的阈值，调度器执行器进程将触发 DAG 运行（如果作业未被禁用）。\n\n清单 8-10 中配置的计划将 `start_date`\
  \ 设置为 `days_ago(2)`，并将 `schedule_interval` 设置为 `@daily`。这是一个回填作业的示例。它会查看当前日期（在 Airflow\
  \ 服务器上）并回溯，以便在按每日计划（每天开始时或午夜）运行之前，先补跑前两天。更多信息可参考 Airflow 官方文档中 DAG 运行下的 Cron 预设部分。\n\
  \nAirflow 执行器会等待调度器通知它某个 DAG 已准备好运行。实际上，执行器本身运行在调度器进程内部。由于这种关系，考虑到调度与执行之间的紧密耦合，对于给定的\
  \ Airflow 集群，你只能指定一种执行模式。\n\nAirflow 自带了几个有用的执行器，提供本地或远程的执行模式。\n\n#### 本地执行\n\n\
  如果你运行的是小型集群，可以使用 `SequentialExecutor` 或 `LocalExecutor`。本地执行意味着任务执行将与执行器进程位于同一位置，而执行器进程本身运行在调度器进程内部。这种进程嵌套方式可能适合测试，但这种模式无法扩展以并行运行多个\
  \ DAG。\n\n#### 远程执行\n\n对于拥有必须运行的关键工作流的**生产环境**，你**别无选择**，只能使用远程执行。这使得多个 DAG 的工作负载能够跨\
  \ Airflow 工作节点网络并行执行。要查看你的 Airflow 集群正在运行哪种执行模式，请执行清单 8-11 中的命令。\n\n```bash\ndocker\
  \ exec \\\n-it airflow_airflow-webserver_1 \\\nairflow config get-value core executor\n\
  清单 8-11\n查看 Airflow 执行器配置\n```\n\n输出将显示 `CeleryExecutor`，这是 Airflow 中较流行的远程执行器选项之一。`CeleryExecutor`\
  \ 使用 Redis 进行调度，并将其工作分发到 Airflow 工作进程上。现在，让我们将注意力转向如何将 Apache Spark 与 Airflow 集成。\n\
  \n## 使用 Airflow 调度 Spark 批处理作业\n\nAirflow 是一个强大的外部调度器，你可以依靠它来运行关键的 Apache Spark\
  \ 批处理作业。此外，工作流编排正成为数据平台的重要组成部分，用于自动化日益复杂的数据管道，并满足众多内部和外部数据客户的需求。正如你在练习 8-1 中学到的，在\
  \ Airflow 上运行一个 DAG 非常容易（一旦你掌握了基础知识）。要开始使用 Airflow 和 Spark，你所需要的只是 *Spark Airflow\
  \ Provider*，它允许你使用几种不同的 Spark 运算符。\n\n### 练习 8-2：安装 Spark Airflow Provider 并运行 Spark\
  \ DAG\n\n本练习将重点教你安装 Apache Spark provider。你将学习如何手动安装，然后我们将注意力转向使用一个预构建的、已打包好所需组件的\
  \ Airflow 容器。接着，你将学习如何使用 Admin UI 在 Airflow 中配置一些运行时配置，最后通过 Airflow 运行上一章中的批处理应用程序。\n\
  \n让我们先从你在练习 8-1 中设置的 Airflow 版本开始。你将直接在 webserver 和 worker Airflow 容器上执行 `pip install`\
  \ 命令，因为 Spark Python 模块必须在本地可用。\n\n#### 定位 Airflow 容器\n\n要运行安装命令，你需要列出 Airflow 容器的完整名称。执行清单\
  \ 8-12 中的命令来查看容器名称。\n\n```bash\ndocker ps | grep airflow_airflow-w*\n清单 8-12\n使用\
  \ Docker 查找 Airflow 容器元数据\n```\n\n获得容器名称后，你可以使用 Docker CLI 运行安装脚本（使用 pip/Python）。\n\
  \n\n\n### 手动安装 Spark 提供商\n\n以下流程演示了如何以 `airflow` 用户身份进行身份验证并安装 Spark 提供商。请以代码清单\
  \ 8-13 和 8-14 作为安装指南。\n\n> **注意**\n> 该示例演示如何在 Web 服务器上安装提供商。你还需要在工作节点上重复此过程，或者继续阅读以使用预构建的容器。\n\
  \n```\ndocker exec \\\n--user airflow \\\n-it airflow_airflow-webserver_1 \\\nbash\n\
  ```\n\n*代码清单 8-13：以 Airflow（管理）用户身份打开 Bash 会话以获取安装新提供商的正确权限*\n\n在 Docker 容器中，执行代码清单\
  \ 8-14 中所示的 `pip install` 命令。\n\n```\npip install \\\n--no-cache-dir \\\n--user\
  \ \\\napache-airflow-providers-apache-spark\n```\n\n*代码清单 8-14：使用 Pip 安装 Spark 提供商*\n\
  \n你已完成 Web 服务器上的操作。不幸的是，现在需要为每个工作节点实例重新开始整个过程。这将确保提供商在 Airflow 集群中一致地安装。一致性至关重要，因为\
  \ Airflow 作为分布式服务运行，并且你无法总是保证 DAG 将在何处被调度。\n\n> **注意**\n> 你可以将命名队列与 `CeleryExecutor`\
  \ 结合使用，以协助在 worker 之间分配工作，你也可以将任务分配到预配置的处理池中，但队列和池不在本书的讨论范围内。\n\n当 DAG 被触发时，对于每个独立的\
  \ DAG 运行，封装该 DAG 的所有任务将一直运行，直到全部成功或关键任务失败，从而阻止其余任务的完成。在实际使用中，你会看到工作节点轻松扩展到数十到数百个实例，而在企业集群中规模甚至更大。现在想象一下，你的任务是确保整个系统保持同步，同时记住必须为每次部署重复此步骤以确保一致性。你愿意承担让一切保持同步的任务吗？\n\
  \n当然不。这显然是一种反模式，尤其考虑到我们最初是使用容器来运行事物的。诚然，你可以添加一些容器启动时运行的脚本，但这意味着你会因为依赖关系失败而面临潜在的运行时错误。当中央软件包仓库（如\
  \ Pypi 或 Maven）发生故障，或者软件包位置发生更改时（归档的制品版本经常如此），你可能已经遇到过此类问题。\n\n### 使用容器实现运行时一致性\n\
  \n基于一致容器的运行时环境在故障排除时消除了环境方面的猜测，因此你可以集中精力并快速让系统恢复运行。对我们来说，这意味着我们不必手动安装 DAG 操作所需的任何东西。\n\
  \n> **注意**\n> `ch-08/airflow/README.md` 中的“高级操作”一节包含了构建自定义 Airflow Docker 镜像的说明，该镜像预装了\
  \ Apache Spark 提供商和 Java 11（JRE）。\n\n为了使用预先构建的 Docker 容器（`newfrontdocker/apache-airflow-spark:2.1.0`），你需要对位于\
  \ `~/dataengineering/airflow/.env` 的环境文件进行快速调整。然后，为了使更改生效，你还需要重启你的 Airflow 集群。首先，使用\
  \ `airflow_stop` 别名关闭你现有的集群。\n\n> **注意**\n> 如果你尚未设置本地环境，请返回代码清单 8-7 获取说明。\n\n现在，编辑\
  \ `.env` 文件（使用编辑器或命令行），取消注释代码清单 8-15 中所示的这一行。\n\n```\nAIRFLOW_IMAGE_NAME=newfrontdocker/apache-airflow-spark:2.1.0\n\
  ```\n\n*代码清单 8-15：将自定义 Airflow 镜像添加到 Docker 环境文件*\n\n完成后，保存更改，并使用 `airflow_start`\
  \ 别名重新启动集群。你无需重新初始化任何内容，因为您只是切换了运行时容器（而不是切换到不同的 RDBMS 或执行器后端）。\n\n现在我们可以继续运行一个 Spark\
  \ DAG。\n\n### 使用 Apache Airflow 运行 Spark 作业\n\n你已经处理了所有必需的依赖项，Airflow 现在已准备好运行你的\
  \ Spark 批处理作业。在接下来的部分，你将使用 Airflow UI 添加一些额外的配置和辅助工具来运行 Spark 作业。\n\n#### 添加 Airflow\
  \ 变量\n\nAirflow 变量类似于环境变量，但它们在元数据数据库中配置，并可通过 `airflow.models` Python 包访问。变量可以直接在\
  \ Airflow 中使用 Admin UI（管理 ➤ 变量）管理，或直接使用 Airflow 命令行管理。此服务允许你在 DAG 中配置可重用的键/值对。\n\
  \n代码清单 8-16 将 `SPARK_HOME` 变量添加到可通过 Airflow DAG 访问的运行时变量集合中。变量可以增强你的 DAG，更重要的是，变量由管理员控制，并且需要基于角色的用户权限才能添加或删除。\n\
  \n```\ndocker exec \\\n-it airflow_airflow-webserver_1 \\\nairflow variables set\
  \ SPARK_HOME /opt/spark\n```\n\n*代码清单 8-16：Airflow 变量使你能够将配置直接注入到你的 DAG 中*\n\n现在打开\
  \ Airflow UI（`http://localhost:8088`），然后点击 Variables 控件（在 Admin 菜单中）以在列表中看到新变量（如图\
  \ 8-7 所示）。\n\n![](img/505711_1_En_8_Fig7_HTML.png)\n\n*图 8-7：列表中可见 `SPARK_HOME`\
  \ 变量*\n\n你还可以为你添加到 Airflow 中的任何变量编辑元数据以添加描述。这个简单的操作有助于记录给定变量的用法并清晰地传达你的意图。\n\n>\
  \ **注意**\n> `admin` 菜单仅对具有 Admin 角色的用户可用，因此并非任何人都可以编辑这些变量。本章的“继续探索”部分向你展示了如何创建普通用户并介绍了\
  \ Airflow 角色（基于角色的访问控制）的概念。\n\n#### 添加 Airflow 连接\n\n连接使 Airflow 能够与外部服务（如 Apache\
  \ Spark）进行通信，并且可以直接使用 Admin UI（管理 ➤ 连接）或命令行（`airflow connections list`）设置新的连接。\n\
  \n鉴于 Spark Airflow 提供商是一个扩展 Airflow 的模块，因此有简单的方法连接到给定的 Spark 集群（或进程）是合理的。打开 Airflow\
  \ UI 并转到 Admin ➤ Connections 页面。点击 + 按钮（在左侧）为 Spark 创建一个新连接。此操作将带你进入一个带有空白表单的新页面。\n\
  \n使用该表单，从 Conn Type 菜单中选择 Spark 类型来创建 `local_spark_connection`。完成的表单如图 8-8 所示。\n\
  \n![](img/505711_1_En_8_Fig8_HTML.png)\n\n*图 8-8：使用 Airflow UI 添加 Apache Spark 连接*\n\
  \n连接创建完成后，让我们继续编写你的第一个 Spark DAG。你将要使用 `SparkSubmitOperator`，它包含在你安装到 Airflow 集群中的\
  \ Spark 提供商里。\n\n\n\n### 编写你的首个 Spark DAG\n\nSpark 附带了一些示例应用。其中之一名为 `SparkPI`。我们将使用这个\
  \ Spark 示例应用来熟悉如何编写一个新的 DAG。让我们从“每日 Pi”这个想法开始。\n\n首先，在 Airflow DAGs 目录下创建一个名为 `daily_spark_pi.py`\
  \ 的文件（路径为 `~/dataengineering/airflow/dags/daily_spark_pi.py`）。然后输入（或复制）代码清单 8-17\
  \ 中的代码并保存你的更改。\n\n```\nfrom airflow.providers.apache.spark.operators.spark_submit\
  \ import SparkSubmitOperator\nfrom airflow.models import DAG, Variable\nfrom airflow.utils.dates\
  \ import days_ago\nargs = {\n'owner': 'airflow',\n}\nspark_home = Variable.get(\"\
  SPARK_HOME\")\nwith DAG(\ndag_id='daily_spark_pi',\ndefault_args=args,\nschedule_interval='@daily',\n\
  start_date=days_ago(1),\ntags=['coffeeco', 'core'],\n) as dag:\nspark_pi_job = SparkSubmitOperator(\n\
  application=f'{spark_home}/examples/jars/spark-examples_2.12-3.1.1.jar',\nconn_id=\"\
  local_spark_connection\",\njava_class=\"org.apache.spark.examples.SparkPi\",\ntask_id=\"\
  spark_pi_job\"\n)\n```\n\n代码清单 8-17 中的 DAG 首先导入了 `SparkSubmitOperator` 和一些辅助库，这些库使你能够访问\
  \ Airflow 变量，以及一些用于调度的其他实用程序。然后，我们创建了一个字典，用于存储 DAG 的所有者元数据。接下来，我们获取 `spark_home`\
  \ 变量，以便在创建 `spark_pi_job` 时使用。最后，我们指定了 DAG 的元数据和调度计划。\n\n```\nwith DAG(\ndag_id='daily_spark_pi',\n\
  default_args=args,\nschedule_interval='@daily',\nstart_date=days_ago(1),\ntags=['coffeeco',\
  \ 'core'],\n) as dag:\n```\n\n然后，我们使用 `SparkSubmitOperator` 向 DAG 块添加了一个任务。\n\n\
  ```\nspark_pi_job = SparkSubmitOperator(\napplication=f'{spark_home}/examples/jars/spark-examples_2.12-3.1.1.jar',\n\
  conn_id=\"local_spark_connection\",\njava_class=\"org.apache.spark.examples.SparkPi\"\
  ,\ntask_id=\"spark_pi_job\"\n)\n```\n\n现在你已经写好了 DAG，让我们运行它。\n\n### 运行 Spark DAG\n\
  \n所有新 DAG 默认均处于暂停状态。这可以进行不同的配置，但通常来说这是个好主意，因为这种行为用于保护你的 Airflow 集群资源，避免被多个同时启动的\
  \ DAG 所淹没。让我们通过命令行取消暂停此 DAG。\n\n```\ndocker exec \\\n-it airflow_airflow-webserver_1\
  \ \\\nairflow dags unpause daily_spark_pi\nDag: daily_spark_pi, paused: False\n\
  ```\n\nDAG 取消暂停后，你可以手动触发它。\n\n```\ndocker exec \\\n-it airflow_airflow-webserver_1\
  \ \\\nairflow dags trigger daily_spark_pi\n```\n\n假设一切按预期工作，你应该能够列出此 DAG 的成功运行记录。\n\
  \n```\ndocker exec \\\n-it airflow_airflow-webserver_1 \\\nairflow dags list-runs\
  \ \\\n-d daily_spark_pi \\\n--state success\n```\n\n你还可以使用 Airflow UI 查看 DAG 运行期间生成的日志。为此，请按以下步骤操作：\n\
  \n1.  进入 Airflow DAGs 主页，使用 `coffeeco` 标签过滤出活动任务（`/home?status=active&tags=coffeeco`）。\n\
  \n2.  点击 `daily_spark_pi` DAG，切换到图表视图（`/graph?dag_id=daily_spark_pi`）。\n\n3.  点击\
  \ `spark_pi_job`。你会在顶部看到一个名为“日志”的按钮；点击它以查看此次任务运行的日志。参见图 8-9。\n\n日志将显示任务的输出，包括运行\
  \ Spark DAG 的结果。如果向下滚动页面，你会看到以下内容：\n\n```\n{spark_submit.py:526} INFO - Pi is roughly\
  \ 3.1411757058785295\n```\n\n这确认了你能够从 Apache Airflow 运行 Spark 工作流。尽管这令人兴奋，但你接下来要做的是创建一个\
  \ DAG，用于运行你在第 7 章中创建的 Spark 应用程序。\n\n### 练习 8-2：总结\n\n本练习教你如何安装 Apache Spark 提供商、配置变量和连接，以及使用\
  \ `SparkSubmitOperator` 编写并运行一个简单的 Spark DAG。在本章的最后一个练习中，你将学习运用前两个练习中掌握的技能，运行第 7\
  \ 章中的 `SparkEventExtractorApp`。\n\n## 使用 Airflow 运行 SparkEventExtractorApp\n\n在上一章中，你编写并编译了你的第一个\
  \ Spark 应用程序。你学会了如何创建一个由配置驱动的应用程序，该应用程序仅将来自本地数据仓库的两个表中的数据连接起来。这个类似简单 ETL 的过程合并了来自\
  \ `customers` 表和 `customerRatings` 表的数据。\n\n在本章的剩余部分，你将设置一个 Airflow DAG，以便使用 Airflow\
  \ 配置并运行此应用程序。\n\n### 从可运行的 Spark Submit 开始\n\n鉴于我们的目标是创建一个 DAG 来运行 `SparkEventExtractorApp`，那么首先要做的就是查看运行该应用程序需要什么。回顾一下，我们必须提供大量的配置、JAR\
  \ 文件位置以及用于启动应用程序的驱动程序配置。\n\n```\n$SPARK_HOME/bin/spark-submit \\\n--class \"com.coffeeco.data.SparkEventExtractorApp\"\
  \ \\\n--packages=org.mariadb.jdbc:mariadb-java-client:2.7.2 \\\n--conf \"spark.event.extractor.source.table=...\"\
  \ \\\n--conf \"spark.event.extractor.destination.table=... \" \\\n--conf \"spark.event.extractor.save.mode=...\"\
  \ \\\n--conf \"spark.sql.warehouse.dir=...\" \\\n--driver-java-options \"-Dconfig.file=conf/local.conf\"\
  \ \\\ntarget/scala-2.12/spark-event-extractor...jar\n```\n\n当我们在 Airflow 中使用 `SparkSubmitOperator`\
  \ 时，它本质上是在 Airflow 集群上下文中生成一个类似的 `spark-submit` 命令。这要求我们稍微修改 Spark 提交代码，以便它可以作为\
  \ DAG 运行。让我们从后往前看，先看一下最终的 DAG，然后将所需的配置和 JAR 文件移到正确的位置，以便一切都能正常运行。\n\n\n\n### 练习\
  \ 8-3：编写并运行客户评分 Airflow DAG\n\n在 `~/dataengineering/airflow/dags` 目录下创建一个新文件，命名为\
  \ `customer_ratings_etl_dag.py`。然后复制（或粘贴）以下 Python 代码片段，以组装最终的 DAG。\n\n```python\n\
  from airflow.providers.apache.spark.operators.spark_submit import SparkSubmitOperator\n\
  from airflow.models import DAG, Variable\nfrom airflow.utils.dates import days_ago\n\
  ```\n\n接下来，我们将添加用户归属信息，并复用上一个 DAG 中的 Spark 主目录变量。\n\n```python\nargs = {\n'owner':\
  \ 'scotteng',\n}\nspark_home = Variable.get(\"SPARK_HOME\")\n```\n\n到目前为止一切顺利。接下来，我们将创建一个新的字典，用于存储作业的完整\
  \ Spark 配置。\n\n```python\ncustomer_ratings_conf = {\n\"spark.sql.warehouse.dir\"\
  : \"s3a://com.coffeeco.data/warehouse\",\n\"spark.hadoop.fs.s3a.impl\": \"org.apache.hadoop.fs.s3a.S3AFileSystem\"\
  ,\n\"spark.hadoop.fs.s3a.endpoint\": \"http://minio:9000\",\n\"spark.hadoop.fs.s3a.access.key\"\
  : \"minio\",\n\"spark.hadoop.fs.s3a.secret.key\": \"minio_admin\",\n\"spark.hadoop.fs.s3a.path.style.access\"\
  : \"true\",\n\"spark.sql.catalogImplementation\": \"hive\",\n\"spark.sql.hive.metastore.version\"\
  : \"2.3.7\",\n\"spark.sql.hive.metastore.jars\": \"builtin\",\n\"spark.sql.hive.metastore.sharedPrefixes\"\
  : \"org.mariadb.jdbc,com.mysql.cj.jdbc\",\n\"spark.sql.hive.metastore.schema.verification\"\
  : \"true\",\n\"spark.sql.hive.metastore.schema.verification.record.version\": \"\
  true\",\n\"spark.sql.parquet.compression.codec\": \"snappy\",\n\"spark.sql.parquet.mergeSchema\"\
  : \"false\",\n\"spark.sql.parquet.filterPushdown\": \"true\",\n\"spark.hadoop.parquet.enable.summary-metadata\"\
  : \"false\",\n\"spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version\":\
  \ \"2\",\n\"spark.sql.hive.javax.jdo.option.ConnectionUserName\": \"dataeng\",\n\
  \"spark.event.extractor.source.table\": \"bronze.customerRatings\",\n\"spark.event.extractor.destination.table\"\
  : \"silver.customerRatings\",\n\"spark.event.extractor.save.mode\": \"ErrorIfExists\"\
  \n}\n```\n\n这个字典可以直接在 `SparkSubmitOperator` 中使用，从而减少了在 DAG 内部扫描配置的麻烦。在编写实际的 DAG\
  \ 之前，你需要添加以下变量（`app_jars` 和 `driver_class_path`），以提高最终 DAG 的可读性。\n\n```python\n\
  app_jars=f'{spark_home}/user_jars/hadoop-aws-3.2.0.jar,{spark_home}/user_jars/hadoop-cloud-storage-3.2.0.jar,{spark_home}/user_jars/mariadb-java-client-2.7.2.jar,{spark_home}/user_jars/mysql-connector-java-8.0.23.jar,{spark_home}/user_jars/aws-java-sdk-bundle-1.11.375.jar'\n\
  driver_class_path=f'{spark_home}/user_jars/mariadb-java-client-2.7.2.jar:{spark_home}/user_jars/mysql-connector-java-8.0.23.jar:{spark_home}/user_jars/hadoop-aws-3.2.0.jar:{spark_home}/user_jars/hadoop-cloud-storage-3.2.0.jar:{spark_home}/user_jars/aws-java-sdk-bundle-1.11.375.jar'\n\
  ```\n\n最后，我们现在可以使用这些变量和属性来创建我们的 ETL DAG。\n\n```python\nwith DAG(\ndag_id='customer_ratings_etl_dag',\n\
  default_args=args,\nschedule_interval='@daily',\nstart_date=days_ago(1),\ntags=['coffeeco',\
  \ 'core'],\n) as dag:\ncustomer_ratings_etl_job = SparkSubmitOperator(\napplication=f'{spark_home}/user_jars/spark-event-extractor.jar',\n\
  jars=app_jars,\ndriver_class_path=driver_class_path,\nconf=customer_ratings_conf,\n\
  conn_id=\"local_spark_connection\",\nname='daily-customer_ratings',\nverbose=True,\n\
  java_class=\"com.coffeeco.data.SparkEventExtractorApp\",\nstatus_poll_interval='20',\n\
  task_id=\"customer_ratings_etl_job\"\n)\n```\n\n就是这样。保存文件，然后轻轻拍拍自己的肩膀，给自己一点鼓励。\n\
  \n设置工作中最繁重的部分就是所有的配置。你可能已经注意到，为了连接这个作业，我们使用了许多新的 Spark 设置。让我们首先看看 Spark SQL 仓库的配置。\n\
  \n#### Spark 配置\n\n作业配置声明了我们 Spark SQL 仓库的设置。\n\n```json\n\"spark.sql.warehouse.dir\"\
  : \"s3a://com.coffeeco.data/warehouse\",\n\"spark.hadoop.fs.s3a.impl\": \"org.apache.hadoop.fs.s3a.S3AFileSystem\"\
  ,\n\"spark.hadoop.fs.s3a.endpoint\": \"http://minio:9000\",\n\"spark.hadoop.fs.s3a.access.key\"\
  : \"minio\",\n\"spark.hadoop.fs.s3a.secret.key\": \"minio_admin\",\n\"spark.hadoop.fs.s3a.path.style.access\"\
  : \"true\"\n```\n\n`spark.sql.warehouse.dir` 属性在上一章中使用过。复习一下，这是当你的应用程序启动时，为 `SparkContext`\
  \ 提供的单个不可变仓库路径。我们将其配置为通过另一个名为 MinIO 的服务指向 Amazon S3。MinIO 的工作方式类似于 Amazon S3，可以作为即插即用的替代方案在本地或云端运行。在本节完成后，我们将更详细地介绍其工作原理。然而，通过从本地挂载的目录迁移到\
  \ S3 克隆，我们通过引入一个完全可互操作的本地服务，简化了未来的工作（在我们将要使用 S3 的情况下）。这使得在本地环境和其他环境（包括生产环境）之间切换变得轻松，而无需过多改变我们的思维模型。\n\
  \n##### 本地作业配置\n\n我们还提供了三个必需的配置，用于告知我们的 Spark 批处理作业在哪里查找我们打算进行连接的数据。这些配置在第 7 章中介绍过，允许你修改数据库表和名称。\n\
  \n```json\n\"spark.event.extractor.source.table\": \"bronze.customerRatings\",\n\
  \"spark.event.extractor.destination.table\": \"silver.customerRatings\",\n\"spark.event.extractor.save.mode\"\
  : \"ErrorIfExists\"\n```\n\n##### Spark 提交属性\n\n`SparkSubmitOperator` 的属性使我们能够配置如何启动\
  \ Spark 应用程序，其约定与实际的 `spark-submit` 命令几乎相同。\n\n```python\nSparkSubmitOperator(\n\
  application=f'{spark_home}/user_jars/spark-event-extractor.jar',\njars=app_jars,\n\
  driver_class_path=driver_class_path,\nconf=customer_ratings_conf,\nconn_id=\"local_spark_connection\"\
  ,\nname='daily-customer_ratings',\nverbose=True,\njava_class=\"com.coffeeco.data.SparkEventExtractorApp\"\
  ,\nstatus_poll_interval='20',\ntask_id=\"customer_ratings_etl_job\"\n)\n```\n\n\
  在运行此 Spark 应用程序的情况下，我们需要向运行时提供一些额外的 JAR。我们添加了 `jars` 和 `driver_class_path` 配置，以告知\
  \ Spark 加载一些特定于驱动程序的 JAR（主要是 Hive JDBC JAR），以及 Amazon S3 JAR，以便我们能够与 MinIO S3 客户端通信。\n\
  \n我们还开启了详细日志记录（`verbose=True`），以便从 Airflow 方面监控作业。最后，我们将作业完成轮询设置为每 20 秒一次（`status_poll_interval='20'`）。这允许我们持续从作业获取更新，并每\
  \ 20 秒获取一次新的日志更新，而不是在作业等待失败或完成时看不到任何信息。\n\n#### Docker 嵌套\n\n由于 Airflow 在 Docker\
  \ 内部运行，我们必须确保 Spark JAR 和配置对 Airflow 工作进程都是可用的。回顾一下，这是因为我们正在运行 `CeleryExecutor`，这意味着我们在\
  \ Airflow 工作进程上远程运行。可以通过为你的 Docker 实例提供一个共享文件系统，甚至使用云对象存储（如 Amazon S3）来简化此过程。然后，Airflow\
  \ 可以按需获取你的依赖项（JAR）和其他应用程序配置。\n\n##### 将 Spark 应用程序 JAR 复制到共享的 Spark JAR 位置\n\n由于你正在复用你在第\
  \ 7 章中创建的 Spark 应用程序，你需要将 JAR 复制到 `~/dataengineering/airflow/docker-compose.yaml`\
  \ 中引用的 `spark/jars` 目录中。\n\n```bash\ncp /path/to/ch-07/app/target/scala-2.12/spark-event-extractor-assembly-0.1-SNAPSHOT.jar\
  \ ~/dataengineering/airflow/spark/jars/spark-event-extractor.jar\n```\n\n现在，让我们运行这个\
  \ DAG。\n\n\n\n#### 运行客户评价 ETL DAG\n\n要运行该 DAG，您需要完成扩展环境搭建。相关说明位于章节材料中的主`README`文件中。该搭建过程将为您提供运行新\
  \ DAG 所需的一切。请注意，若需多次运行该任务，您必须将`spark.event.extractor.save.mode`切换为`Overwrite`。或者，您也可以直接从\
  \ Spark SQL 数据仓库位置删除`silver.customerratings`目录。\n\n使用 Airflow UI，进入主 DAG 页面，点击`customer_ratings_etl_dag`\
  \ DAG。在 UI 中，点击“立即触发”按钮。您将看到一个成功状态，如图 8-10 示例所示。\n\n![](img/505711_1_En_8_Fig10_HTML.png)\n\
  \n图 8-10\n\n在 Airflow 中成功运行`SparkEventExtractorApp`\n\n您可以查看 Spark 日志，了解所有动态组件如何协同工作。但本质上，您在本书所学内容值得获得掌声。\n\
  \n#### 练习 8-3：总结\n\n本章最后一个练习展示了如何使用 Airflow DAG 启动更复杂的 Spark 批处理作业。为了能够使用最终的`docker-compose-chapter-end.yaml`替换练习\
  \ 8-2 中使用的`docker-compose.yaml`，需要进行大量准备工作。在结束本章之前，让我们探讨一下使 DAG 能够运行所需的基础架构和组件。\n\
  \n### 审视混合架构\n\n现在，运行此 DAG 时需要记住许多动态组件。首先，您需要管理本地 MySQL 支持的（Hive Metastore）以及 Airflow\
  \ Docker 容器，并以某种方式为 Spark SQL 数据仓库提供额外的共享卷。所有这些中央数据平台组件共同构成了您基础设施的关键部分，并使 Airflow\
  \ 能够运行 Spark DAG。\n\n图 8-11 是您本地数据平台当前简化状态的示例。您已经运行了使 Airflow 工作所需的一切。您拥有由 MySQL\
  \ 支持的 Hive Metastore，负责存储分布式数据表的元数据；同时还有新的 MinIO S3 数据湖。您现在可以重用本地 Spark 安装中的共享配置，并在\
  \ Zeppelin 和 Airflow 之间重用配置和 JAR 包。这为您提供了 Spark UI，用于交互查看从 Airflow 生成的数据。另一方面，您拥有\
  \ Airflow，它可以运行作业，将数据存储到您的数据湖中，或作为 JDBC 表存储到 MySQL 中。\n\n![](img/505711_1_En_8_Fig11_HTML.png)\n\
  \n图 8-11\n\n客户评价 ETL DAG 背后的组件架构\n\n#### 设置扩展环境\n\n章节材料中的主`README`提供了扩展本地环境启动和运行的分步说明。关于\
  \ MinIO 以及迁移 Hive Metastore，还有一些额外的要点值得说明。\n\n扩展环境将此实践环境的所有关键组件移至您笔记本电脑上的一个单一位置。这将使您能够从今以后重用所有这些通用架构组件，而无需记住我们在哪个章节练习中添加了哪些内容。该路径设置为您主目录下的一个名为`dataengineering`的文件夹。\n\
  \n```\n~/dataengineering\n-/airflow\n-/minio\n-/mysql\n-/spark\n-/zeppelin\n```\n\
  \n#### 从本地文件系统迁移到 MinIO\n\n为简化后续操作，章节材料中提供了使用 MinIO 分布式文件系统的说明。简而言之，MinIO 是 Amazon\
  \ S3 的克隆，并与 S3 API 完全兼容。这将在未来章节中降低一些复杂性。需要注意的一点是，首次运行 MinIO 时，您必须在文件系统上设置一些权限。幸运的是，您可以通过\
  \ UI 完成此操作。参见图 8-12。\n\n![](img/505711_1_En_8_Fig12_HTML.png)\n\n图 8-12\n\n将文件系统从默认的“只读”切换为“读写”\n\
  \n您需要打开 MinIO UI（`http://localhost:9001`）。您也可以在`/etc/hosts`文件中添加一条记录，以便更容易地找到它。我的记录是`http://minio:9001`。进入主页后，系统将提示您进行身份验证（用户和密码存储在\
  \ MinIO 的`docker-compose.yaml`文件中）。或者，如果您未做任何更改，则用户名为`minio`，密码为`minio_admin`。这将允许您应用前缀权限。\n\
  \n#### 应用存储桶前缀权限\n\n在屏幕左侧（如图 8-13 所示），您将看到`com.coffeeco.data`。这是默认存储桶名称，您只需将鼠标悬停在该名称上，点击出现的小圆点，即可打开权限菜单。\n\
  \n![](img/505711_1_En_8_Fig13_HTML.jpg)\n\n图 8-13\n\n在 MinIO 浏览器中编辑\n\n只需添加前缀`/warehouse/*`并将其设置为“读写”，即可大功告成。\n\
  \n接下来您可能想要做的是将 Hive Metastore 表迁移到一个更好的公共位置。\n\n#### 在公共位置引导 MySQL\n\n您的 Hive Metastore\
  \ 很可能位于`ch-06`目录中。您可以从当前 metastore 中导出 SQL 数据库和表，并将现有内容移动到`~/dataengineering/mysql`；或者您可以从头开始，在`~/dataengineering/mysql`目录中进行引导。章节材料中的`mysql`目录包含一个`README.md`文件，提供了从头开始全新\
  \ Hive 安装的分步说明。\n\n从现在开始，我们将在探索数据领域时重复使用此通用设置。\n\n## 持续探索\n\n本章全面介绍了如何使用 Airflow\
  \ 调度 Apache Spark 应用程序。如您所知，总有更多可以学习的内容（但并非所有内容都适合放入书中）。作为持续探索，我建议如下：\n\n*   在运行\
  \ DAG 时，您可以添加 DAG 覆盖变量。这使得您能够对底层 DAG 进行额外更改，而无需返回并修改底层 Python 代码。尝试添加一个变量来更改以下变量：\n\
  \n    `spark.event.extractor.save.mode`\n\n    可用选项为`ErrorIfExists`、`Overwrite`、`Ignore`和`Append`。\n\
  \n*   使用第 7 章的通用特性创建另一个 Spark 应用程序，并使用 Airflow 运行它。\n\n*   尝试生成一个新的数据集，或思考一个可以利用本地数据仓库中的数据解决的新问题。\n\
  \n除了持续探索之外，下一节将介绍创建单个用户和分配角色的过程。\n\n\n\n### 创建用户\n\n使用 Airflow 命令行创建新用户非常简单。本质上，所有用户命令都嵌套在\
  \ `users` 子命令中。\n\n```\ndocker exec \\\n-it airflow_airflow_webserver-1 \\\nairflow\
  \ users [子命令]\n```\n\n例如，假设你需要创建一个新用户，并为其授予 Airflow 内的有限权限。你可以使用 `User` 角色来分配常规权限。例如，执行清单\
  \ 8-18 中的命令来生成 `scotteng` 用户。\n\n```\ndocker exec \\\n-it airflow_airflow_webserver-1\
  \ \\\nairflow users create \\\n--username scotteng \\\n--firstname Scott \\\n--lastname\
  \ Haines \\\n--role User \\\n--email scott@coffeeco.com\n清单 8-18\n通过 Airflow 命令行生成新用户\n\
  ```\n\n该命令会要求你输入密码，因此只需按照提示完成新用户的创建即可。创建完成后，退出 Airflow，然后以 `scotteng` 用户身份重新登录。你会注意到\
  \ **Admin** 或 **Security** 菜单已经消失，但你仍然可以运行 DAG（见图 8-14）。\n\n![](img/505711_1_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14\n\n以普通用户身份查看 Airflow 界面\n\n这就是目前的内容。\n\n## 小结\n\n本章从较高层次介绍了工作流自动化的概念，并向你介绍了\
  \ Apache Airflow。虽然我们可以轻松地用本书剩余部分讨论如何创建越来越复杂的 Airflow DAG，并深入探究 Airflow 的更多细微之处，但这项工作将留给你自己完成。在继续我们的旅程时，我们还会再次提到\
  \ Airflow，但下一站我们将进入一个激动人心的主题：使用 Apache Spark 编写 Structured Streaming 应用。系好安全带，事情即将加速发展！\n\
  \n# 流处理入门\n\n由于每个数据工程问题可能涉及多个维度，学习解决和优化这些问题颇具挑战性。在每个新问题开始时，你必须考虑数据发现、数据整理、数据摄入、数据转换以及数据责任——这是一个涵盖数据契约（严格定义的数据定义）的范畴，同时还需要优化数据摄入足迹（因为大规模数据很容易侵蚀运营成本）。此外，数据访问、数据谱系和数据治理等问题也需要时刻放在心上。理解如何运用你的综合知识来制定快速的数据行动计划，是一项能让你作为现代数据工程师走得更远的技能。\n\
  \n回顾你在本书中学到的处理数据的各种方式：无论是从使用 `spark-shell` 探索初步想法的小规模起步，还是使用笔记本（Apache Zeppelin）进一步深入这些想法，最后将学到的经验整合到\
  \ Spark 应用中。通过这个过程，你学会了创建可复用、经过测试的 Spark 应用，也掌握了通过探索来解决问题的重要技能。你学会了如何经历问题识别与分解的阶段——理解问题、制定行动计划、测试和验证结果，最后将解决方案封装成一个完整的应用。更重要的是，你通过实践学会了如何分解这些端到端的数据问题：使用\
  \ Spark SQL 编写转换查询，学习测试这些微应用（通过查询）的行为，甚至学会了如何安排它们的定期运行（使用 Apache Airflow）。\n\n所有这些步骤都是为了现在这一刻。正如上一章结尾所承诺的，事情即将开始加速。为什么会这样？因为现在我们正从批处理迈向流处理，即处理无界数据集。\n\
  \n对于许多用例来说，在数据可用时立即进行流式处理，有助于将一个非常庞大的数据问题（由于事件数据的规模）转化为一个更易于管理的问题。只需更频繁地处理更少的数据点，你就可以分而治之地解决一个可能成本高昂的数据问题。然而，如何从批处理思维过渡到流处理思维也颇具挑战性。\n\
  \n例如，假设你的任务是创建一个每天必须处理约 10 亿个事件的应用。虽然由于数据规模庞大，这听起来可能有些牵强，但后退一步思考应用/流程的意图通常会有所帮助。如果数据可以被分解（分区）并作为流式操作并行处理，你只需创建一个能够每秒摄入和处理区区\
  \ 11.5 千个事件的应用（如果事件流是恒定的，每分钟约 69.5 万个事件）。\n\n尽管这些数字可能看起来遥不可及，但这也是分布式流处理真正大放异彩之处。本质上，你是在缩小问题的视角或范围，以便在分区数据集上以更分布式的方式，随时间推移达成目标。虽然并非所有问题都能通过流式处理解决，但相当多的问题确实适用于这种处理模式。\n\
  \n本章是对流处理的温和介绍，为你直接进入第 10 章构建自己的端到端 Structured Streaming 应用铺平道路，而无需回过头来讨论大量决策过程背后的理论。\n\
  \n到本章结束时，你应该理解以下内容（高层次概述）：\n\n-   如何思考流数据及流数据处理问题\n-   为什么数据责任始于生产者\n-   在 API 边界处理数据质量的方法\n\
  -   为什么二进制可序列化的结构化数据至关重要\n\n## 流处理\n\n流数据*并非静止不动*。事实上，你可以将其视为“活着的”（即使只是短暂的）。这是因为流数据是封装了*当下*的数据——它记录事件和动作*在传输过程中*的发生情况。让我们看一个实用但理论性的例子，从一个简单的传感器数据事件流开始。在你的脑海中，想象你最后去过的那个停车场（或停车库）。\n\
  \n\n\n### 用例：实时停车位可用性\n\n想象一下，你刚刚找到停车位，全靠那些指引你前往空位的指示牌。现在，假设这一切都源于本地停车传感器互联网络发出的数据。这些传感器的唯一用途，就是识别当下时刻可用停车位的数量。\n\
  \n这是一个实时数据问题，其中实时准确度是可衡量的，并且停车结构的用户可以实际感受到。要实现这些功能，首先要声明系统场景。\n\n> “我们希望创建一个系统，能追踪所有可用停车位，识别车辆何时停放，并知道车辆在某个位置停留了多久。这个过程应尽可能自动化。”\n\
  \n优化这样的系统，可以从每个停车位安装一个简单传感器开始（关联 `sensor.id`/`spot.id` 引用）。该传感器负责以位置标识符、时间戳和简单比特位（0\
  \ 或 1）的形式发出数据，以表示车位是空置还是被占用。这些数据可以编码成一种紧凑的消息格式，如代码清单 9-1 所示，该格式将被高效编码，并由每个设备定期发送。\n\
  \n```\nmessage ParkingSensorStatus {\nuint32 sensor_id = 1;\nuint32 space_id  =\
  \ 2;\nuint64 timestamp = 3;\nbool   available = 4;\n}\n代码清单 9-1\n传感器事件示例（封装于 Google\
  \ Protocol Buffer 消息格式中）\n```\n\n在一天正常的车流过程中，由于个体驾驶员的动态时间安排，每个传感器的状态会以不可预测的方式在开或关（二元状态）之间切换。这些传感器数据可以实时告知驾驶员，车库里现在总共有\
  \ X 个可用车位。这些数据有助于自动化人类的决策过程，甚至可以通过一个简单的 Web 服务在线提供，用于实时状态追踪。此外，这些数据还可用于追踪每个传感器的上次签到时间，这可用于诊断故障传感器，甚至追踪传感器离线和故障的频率。如今，技术更先进的停车场甚至能通过方向标志和提示，引导驾驶员前往结构中的可用车位。这减少了停车场内的交通和拥堵，进而提高了客户满意度，而这一切仅仅通过捕获传感器数据的实时流并对其进行近实时处理就能实现。\n\
  \n考虑到从这些传感器事件流中收集到的时间信息，聪明的停车场运营者可以根据过往趋势，基于对停车位的实时需求和当前可用性，来降低或提高每日或每小时的定价。通过在合理范围内优化定价，运营者可以找到完美的临界点，即每小时/每日的价格能使停车场满员。换句话说，“在什么价格下，大多数人会选择停车，且车位不会被闲置？”\n\
  \n这是一个源于实时传感器数据收集的优化问题示例。越来越多的组织开始研究如何重用数据来同时解决多个问题。物联网（IoT）用例只是你在编写流式应用程序时可能处理的众多数据流之一。在本书的前面部分，我们讨论了创建一个系统，该系统可以获取咖啡店上座率信息，从而告知人们附近哪家店有能容纳他们聚会规模人数的座位。在那个故事中，我们只是创建了一个可用于连接展示此示例的合成表。然而，这是另一个可以通过传感器解决的问题，或者通过像签到系统这样简单的东西来解决，该系统会发出相关的事件数据，并通过流式数据管道可靠地传递到下游。这两个例子都采用了基础分析，并且都可以从简单的机器学习中受益，以发现新的行为模式，从而实现更优化的运营。在过深入之前，我们先稍作停留，深入探讨流式数据网络所提供的能力。\n\
  \n### 时间序列数据与事件流\n\n从静态数据的思维模式，转变为随着时间推移来解释数据的思维模式，即从跨越多个视角和时刻的无界数据流的角度来看待数据，这既是一种视角上的练习，也可能是一种难以适应的挑战。通常，当你考虑流式系统时，连续事件流的概念会浮出水面。这是最常见的用例之一，可以作为理解*流式数据*概念的温和入门。例如，图\
  \ 9-1 中所示的抽象时间序列。\n\n![](img/505711_1_En_9_Fig1_HTML.png)\n\n图 9-1\n\n事件发生在精确的时间点，可以单独收集和处理（t1->t4），也可以跨时间窗口聚合（w1）\n\
  \n如你所见，数据本身根据给定系统（或应用程序）所采用的视角，存在于各种状态中。每个事件（T1->T4）在其狭窄的参考框架内只了解*发生了什么*，换句话说，事件捕获了一个有限的（相对的）*时间*视角。当一系列事件在一个有界集合（窗口）中被一起处理时，你获得了一系列数据点（事件），这些事件封装了完全实现或部分实现的想法。当你缩小范围查看整个时间线时，你可以描绘出一个从第一个事件到最后一个事件更准确的故事。让我们进一步阐述这个想法。\n\
  \n#### 事件是孤立的吗？\n\n考虑一个简单的事实。你的事件数据要么作为一个完整的想法存在，要么作为部分的想法或念头存在。我发现，将数据视为随时间展开的故事，有助于赋予这些数据字节以生命力。因此，每个数据点都有助于构成一个完整的故事，就像一系列随时间交织、组合或实现的想法和念头。\n\
  \n在你尝试采用分布式数据视角看待事物时，这个数据构成概念可以作为一个透镜。我还发现，在构建和定义新的分布式数据模型，以及处理大规模现实世界数据网络时，这个概念也非常有用。如果将这些事件视为一个整体，它们共同讲述一个特定的故事，事件留下的线索可以告知事物发生的顺序，而每个事件的时间戳则极大地增强了这种叙述能力。没有时间的事件会呈现事物发生的扁平化视图，而时间的加入则赋予你动量或速度的概念，或者是事件之间或整个数据点系列在时间上的减慢和拉伸。理解流经众多管道和数据通道的数据行为，对于数据运营至关重要，并且需要可靠的监控来保持数据以最佳速度流动。让我们看一个用例，其中时间维度有助于更清晰地描绘真实世界的场景。\n\
  \n\n\n#### 用例：追踪客户满意度\n\n如果我告诉你，两位顾客走进咖啡店，点了饮料，然后带着饮料离开，你可能会问我为什么费心告诉你这些——毕竟这就是咖啡店里常发生的事。但如果我告诉你，这两杯咖啡几乎是同时制作的，而故事中的第一位顾客在五分钟内就进出咖啡店了呢？如果我告诉你那是一个工作日，且故事发生在早高峰时段呢？如果我告诉你第二位顾客（恰好排在队伍中下一位）在咖啡店里待了\
  \ 30 分钟呢？你可能会问，这位顾客是不是留下来看报纸或使用洗手间了——这些都是合理的疑问。\n\n如果我告诉你，这位顾客之所以等待，是因为在四步咖啡制作流程的第\
  \ 3 步和第 4 步之间出现了错误，那么我们就更能理解未来如何优化顾客体验了。这四步分别是：\n\n1.  顾客点单：`{customer.order:initialized}`\n\
  2.  完成支付：`{customer.order:payment:processed}`\n3.  订单排队：`{customer.order:queued}`\n\
  4.  订单完成：`{customer.order:fulfilled}`\n\n无论错误是发生在自动化环节，还是源于现实系统的故障（如打印机卡纸、咖啡师漏单，或其他任何原因），结果都是顾客需要主动介入，告知运营流程（咖啡制作流水线）似乎有人忘了他们的饮料。\n\
  \n此时，讨论可以转向如何处理顾客的情绪反应——这种反应可能在积极与消极之间剧烈波动：从乐于助人的高兴（1 分），到轻微受挫（4 分），再到因拖延和流程故障而爆发的愤怒（10\
  \ 分）。但通过这个假设的用例推演，我们现在都更清楚地了解了如何利用优秀的数据采集技术来服务于各种场景。\n\n#### 事件时间、事件记录顺序及事件间延迟，皆蕴含信息\n\
  \n如果不了解从第一个事件（`customer.order:initialized`）到最终事件（`customer.order:fulfilled`）之间经过了多少时间，或者每个步骤通常需要多长时间完成，我们就无法对体验进行评分，也无法真正理解发生了什么——这实际上为系统中的异常延迟或故障制造了盲区。了解顾客在不同规模订单中通常等待时间的统计数据（平均值、中位数和\
  \ 99 百分位）是很有价值的，因为这些历史数据点可以通过自动化方式用于预防性解决问题——例如，当订单耗时超出预期时。这直接决定了顾客是感到不满还是成为终身客户。\n\
  \n这也是企业向客户征求反馈的重要原因之一——无论是针对体验给出“赞/踩”，还是奖励性的应用内参与（用积分兑换免费商品和服务）。这些通过现实互动收集并捕获的数据，编码为事件，并按你的需求进行处理——如果它能对公司的运营和声誉产生积极影响，那将非常有用。只需确保遵守数据隐私法规，最终不要让你的客户感到不适。\n\
  \n这个小小的思维实验旨在揭示一个事实：你在事件数据中捕获的细节（以及数据故事随时间演变的脉络）可能带来颠覆性的改变。时间是赋予这些旅程动力的维度。但时间本身也存在一个问题。\n\
  \n### 时间的问题\n\n虽然事件在精确的时间点发生，但时间的问题在于，它也受制于时间和空间（位置）的难题。爱因斯坦用相对论从宇宙尺度解释了这一问题，但在更局部的尺度上，这也是一个问题。例如，我的家人居住在美国的不同地区。协调大家的时间表让每个人的日程同步就很困难。即使是像通过视频通话叙旧或现实世界中的家庭聚会这样简单的事件也会遇到这种情况。即使一切都协调好了，人们也习惯性地会迟到一点。\n\
  \n将视角从我家人或一般人身上拉远——从事件集中协调的角度来看——你会发现问题不仅仅关乎跨时区（东部/中部/西部海岸）的同步。如果仔细观察，你会发现，相对于我们本地/物理空间的时间，也存在一定程度的时间漂移或时钟偏差。\n\
  \n以现代数字时钟为例。它在你的智能手机、手表或众多“智能”联网设备上作为一个进程运行。保持不变的是时间保持显著的同步性（即使漂移只有几毫秒）。许多人仍然有模拟（非数字）时钟。这些设备的精度差异很大，从高端手表（“精密时计”）的难以置信的精确，到有时需要每隔几天重新校准一次的廉价时钟。\n\
  \n这里的要点是，两个系统对精确时间达成一致的情况很少见，就像人们也难在时间和空间上进行协调一样。因此，必须使用一个中央参考（或视角）来同步跨多个时区运行的系统的时间。\n\
  \n#### 时间校正\n\n在任何现代云基础设施中运行的服务器都采用一种称为[网络时间协议](https://en.wikipedia.org/wiki/Network_Time_Protocol)（NTP）的进程来纠正时间漂移问题。NTP\
  \ 进程负责使用可靠的中央时间服务器同步本地服务器时钟。此进程将本地时间校正到与协调世界时（UTC）相差几毫秒以内。这是一个需要牢记的重要概念，因为运行在大型网络中并产生事件数据的应用程序将负责创建时间戳，而这些时间戳必须精确，才能使分布式事件对齐。此外，还有一个棘手的夏令时问题，因此，要协调来自不同时区以及不同本地日期时间语义的系统数据，就需要从这个中央同步的视角来审视时间。\n\
  \n我们已经从理论上探讨了时间与基于事件的数据的关系，但为了完善背景知识，我们还应该从时间与系统中数据需要被捕获和处理的优先级（无论是流式处理还是其他方式）的关系来审视它。\n\
  \n### 按优先级排序的事件处理模式\n\n你可能熟悉这句话：“时间至关重要。”这是说某件事很重要且是最高优先级的。解决速度至关重要。这种优先级意识可以用作一种工具或定义性指标，在处理关键数据时，为实时、近实时、批量或最终（按需）处理提供依据。这四种处理模式对时间有不同的处理方式，从而对当前的数据问题产生特定的关注点。其范围基于进程必须完成的速度，这反过来又限制了任务的复杂度（作为时间的一个因素）。将这些处理风格视为由截止日期驱动的。完成某个动作只有一定的时间限制。\n\
  \n\n\n# 实时处理\n\n实时系统的预期是，从上游系统发出事件，到该事件被处理并可供分析和洞察使用，端到端延迟在毫秒到几秒之间。这些事件会直接发送到事件流处理服务（如\
  \ `Apache Kafka`），在正常情况下，该服务能让监听器/消费者在事件写入后立即使用。真正的实时系统有许多典型用例，包括物流（例如停车位示例以及在咖啡店找空桌）。对业务产生全新影响的流程，例如欺诈检测、主动网络入侵检测或其他恶意行为检测，在这些场景中，较长的平均检测时间（平均毫秒/秒级检测时间）可能导致灾难性的声誉或财务损失。\n\
  \n对于其他系统，以近实时方式运行是完全可接受的。由于解决棘手问题需要时间，实时决策需要对其要提出的问题提供高性能、预计算或低延迟的答案。这就是纯粹的内存式流处理。\n\
  \n# 近实时处理\n\n大多数人想到“实时”时，实际想到的是近实时。它与实时拥有一组类似的时间约束，唯一的区别在于端到端延迟的预期从数秒放宽到了几分钟。对于大多数系统来说，并没有真正的理由需要对每个到达的事件立即做出反应，因此，虽然时间仍然至关重要，但数据可用性的\
  \ `SLA` 优先级被放宽了。\n\n保持更新的运营仪表盘和指标系统（每 30 秒到五分钟刷新图表和检查监控）通常足以快速发现问题并提供对现实状况的近似呈现。对于所有其他数据系统，则存在批处理或按需处理的概念。\n\
  \n# 批处理\n\n我们在前两章中介绍了批处理和周期性调度，但为了清晰起见，需要说明的是，通过定期作业将数据从可靠的数据源（数据湖或数据库）推送到其他关联系统，过去是，并且现在仍然是现实世界中处理大量数据的方式。其原因在于成本。这归结为运营成本和维护大型流式系统的人力成本。\n\
  \n流式系统需要全天候访问可变数量的资源，从 CPU、GPU 到网络 IO 和 RAM，并且期望这些资源不会稀缺，因为流处理中的延迟（阻塞）可能会迅速累积。另一方面，从长远来看，批处理可能更易于维护，前提是数据的使用者理解从数据首次在上游发出，到数据可用于下游使用之间总是存在时间差。\n\
  \n最后需要考虑的是按需处理（或即时处理）。\n\n# 按需处理或即时处理\n\n面对现实吧。有些问题（即查询）很少被提出，或者其提出方式根本不适合任何预定义的模式。\n\
  \n例如，自定义报表作业和探索性数据分析是两种非常适合这些范式的数据访问方式。大多数情况下，回答这些查询所需的后备数据会直接从数据湖加载，然后使用共享计算资源或隔离的计算集群进行处理。这些查询所提供的数据，可能是其他实时或近实时系统处理并存储后用于批处理或历史分析的副产品。\n\
  \n使用这种模式，数据可以通过从较慢的商品对象存储（如 `Amazon S3`）导入记录到内存中，或快速访问的固态硬盘（SSD）上，来解冻并按需加载。根据数据的大小、格式和布局，可以直接从云对象存储中查询。这种模式可以轻松地通过\
  \ `Spark SQL` 委托给 `Apache Spark`。这使得可以通过 `Apache Zeppelin` 等工具进行临时分析，或者通过使用 [Apache\
  \ Spark thrift-server](https://spark.apache.org/docs/latest/sql-distributed-sql-engine.html)\
  \ 和 `Apache Hive Metastore` 的 JDBC 绑定在应用程序内直接进行分析。\n\n这四种处理方式的区别在于时间。\n\n回到视图和视角的概念，每种方法或模式都有其适用的*时机和场景*。流处理处理的是在特定时间点捕获的事件，正如我们在本章前半部分所讨论的，我们如何关联时间、如何捕获和测量一系列事件（作为数据），共同描绘出当前正在发生什么或过去发生了什么。同样重要的是要讨论流处理的基础。在下一节中，我们将介绍处理连续、无界数据流时的一些常见问题和解决方案。因此，将数据作为核心支柱并由此向外扩展是合情合理的。\n\
  \n# 流处理基础\n\n基础是结构赖以建立的不可动摇、坚不可摧的根基。在构建成功的数据架构时，数据是整个系统的核心租户，也是该基础的主要组成部分。目前，数据进入数据平台的最流行方式是通过像\
  \ `Apache Kafka` 这样的流处理平台。这意味着围绕数据模式、可用性和有效性制定的数据契约，成为了该数据基础的关键支撑（考虑到 `Apache Kafka`\
  \ 所提供的去中心化、分布式流处理能力）。\n\n## 构建可靠的流式数据系统\n\n作为数据工程师，构建可靠的数据系统实际上就是我们的工作，这意味着数据停机时间应该像业务的其他任何组成部分一样被衡量。你可能在某个时候听说过\
  \ `SLA`（服务水平协议）、`SLO`（服务水平目标）和 `SLI`（服务水平指标）这些术语。简而言之，这些缩略词与用于评估系统的契约、承诺和度量相关联，它们最终使服务所有者为其成功和失败负责。例如，你的团队或组织与客户之间的服务水平协议（`SLA`）用于就你提供的服务创建具有约束力的合同。对于数据团队来说，这意味着基于你的服务水平目标（`SLO`）来识别和捕获指标（`KPMs`：关键绩效指标）。`SLO`\
  \ 是你承诺根据 `SLA` 需要履行的约定，它们可以是从承诺近乎完美（99.999%）的服务可用性，到像承诺特定数据集保留 90 天这样简单的事情。最后，你的服务水平指标（`SLI`）是你按照服务水平契约运作的证据，通常以运营分析（仪表盘）或报告的形式呈现。\n\
  \n明确目标有助于制定实现目标的计划。这段旅程始于数据接入点（即数据摄取点）。具体来说，始于每个数据点的正式结构和身份标识。考虑到“越来越多的数据通过像 `Apache\
  \ Kafka` 这样的流处理平台进入数据平台”这一观察，对发射到这些数据流的数据进行编译时保证、向后兼容性和快速二进制序列化会很有帮助。数据问责制本身就是一个挑战。让我们看看原因。\n\
  \n## 管理流式数据问责制\n\n流式系统每周 7 天、每天 24 小时、每年 365 天运行。如果不在前期对这个问题投入精力，这可能会使事情复杂化；而其中一个时不时冒出来的问题就是损坏的数据，即传输中的数据问题。\n\
  \n\n\n# 处理飞行中的数据问题\n\n在飞行中减少数据问题有两种常见方法。首先，你可以在数据网络边缘引入看门人，通过传统应用程序编程接口（`API`）来协商和验证数据；其次，你可以创建并编译辅助库（即软件开发工具包，`SDK`），以强制执行数据协议，并使分布式写入者能够接入你的流式数据基础设施。你甚至可以同时采用这两种策略。\n\
  \n## 数据看门人\n\n在数据网络边缘添加网关`API`的好处在于，你可以在数据生产点强制执行*身份验证*（该系统能否访问此`API`？）、*授权*（该系统能否向特定数据流发布数据？）和*验证*（此数据是否可接受或有效？）。图\
  \ 9-2 展示了数据网关的流程。\n\n![图 9-2](img/505711_1_En_9_Fig2_HTML.png)\n\n图 9-2\n\n数据网关服务可以充当数据网络的看门人。它们提供了用于认证`API`访问的机制，授权哪些上游服务（`API`/服务）可以发布数据，并且还可以在损坏或错误数据进入数据网络（流处理）之前，对来自发布者的数据进行验证。\n\
  \n这意味着上游数据生产系统可以在生产数据时*快速失败*。这能阻止损坏数据在数据网络边缘进入流式或静态数据管道。它是一种通过错误代码和有用的消息，以更自动化的方式与生产者就问题发生的具体原因和方式建立对话的手段。\n\
  \n```json\n{\n\"error\": {\n\"code\": 400,\n\"message\": \"The event data is missing\
  \ the userId, and the timestamp is invalid (expected a string with ISO8601 formatting).\
  \ Please view the docs at http://coffeeco.com/docs/apis/customer/order#required-fields\
  \ to adjust the payload.\"\n}\n}\n```\n\n这种方法有其利弊。优点在于，大多数编程语言都原生支持 `HTTP`（或 `HTTP/2`）传输协议（或只需添加一个小型库），而\
  \ `JSON` 数据是目前几乎最通用的数据交换格式。另一方面（缺点），有人可能会认为这又多了一个需要管理的服务，而且如果没有某种形式的 `API` 自动化或遵循像\
  \ [OpenAPI](https://spec.openapis.org/oas/latest.html%2523format) 这样的开放规范，每个新的 `API`\
  \ 路由都可能开始耗费过多时间。`API` 会成为一个集中的故障点，而且更多的变更并不一定意味着更好的功能！要扭转这个问题，这正是单元测试和功能测试如此重要的原因。理想情况下，数据本身（模式/格式）可以通过启用字段级验证（谓词）、生成有用的错误消息并采取自我保护行动，来决定其自身数据级契约的规则。嘿，只需一点路由级或数据级的元数据和一些创造性思维，`API`\
  \ 就可以自动生成自我定义的路由和行为。\n\n最后，网关`API`可被视为集中的麻烦制造者，因为上游系统未能生成有效数据（例如被看门人阻止）的每一次失败，都意味着有价值的信息（事件数据或指标）被丢弃。这里的责任归属问题也往往是双向的，因为看门人的一次糟糕部署可能会使一个未设置好在网关宕机（即使是几秒钟）时处理重试的上游系统陷入盲目。\n\
  \n撇开所有利弊不谈，使用网关`API`在损坏数据进入数据平台之前阻止其传播，意味着需要排查问题原因的地点更少了。这肯定比调试一个由数据管道、服务和无数最终数据目的地组成的分布式网络要好得多。那么`SDK`呢？\n\
  \n## 软件开发工具包\n\n`SDK`是导入到代码库中的库（或微框架），用于简化一个操作、活动或其他复杂流程。它们还有另一个名字：*客户端*。以之前关于使用良好错误消息和错误代码的例子来说，这个流程对于告知客户端其先前的操作无效是必要的。然而，直接在`SDK`中添加适当的安全护栏以减少潜在问题的范围可能更有优势。例如，假设我们设置了一个`API`，用于通过事件追踪来跟踪客户与咖啡相关的行为。一个客户端`SDK`理论上可以包含所有必要的工具来管理与`API`服务器的交互，包括身份验证、授权和验证。事实上，如果`SDK`能发挥其作用，验证问题就会不复存在。清单\
  \ 9-2 展示了一个可用于可靠跟踪客户事件的`SDK`示例。\n\n```scala\nimport com.coffeeco.data.sdks.client._\n\
  import com.coffeeco.data.sdks.client.protocol._\nCustomer.fromToken(token)\n.track(\n\
  eventType=Events.Customer.Order,\nstatus=Status.Order.Initalized,\ndata=Order.toByteArray\n\
  )\n```\n\n清单 9-2  \n`SDK` 使应用程序能够以一致的方式可靠地发出事件数据\n\n通过一些额外的努力（即客户端`SDK`），数据验证或事件损坏的问题几乎可以消失。其他问题可以在`SDK`本身中处理，例如当服务器离线时如何重试发送请求。与其让所有请求立即重试，或陷入一个无限冲击网关负载均衡器的循环中，`SDK`可以采取更智能的行动，例如使用指数退避。\n\
  \n### 惊群问题\n\n假设你有一台网关`API`服务器。你编写了一个出色的`API`，公司内许多团队都在向此`API`发送事件数据。一切顺利，直到有一天，一个新的内部团队开始向服务器发送无效数据。（他们没有遵守你的\
  \ `HTTP` 状态码，而是将所有非 200 的 `HTTP` 码视为重试的原因。他们忘了添加任何重试启发式算法，比如指数退避，所以所有请求都在一个不断增长的重试队列中无限重试。）请注意，在这个新团队加入之前，从来没有理由运行`API`服务器的多个实例，也从未需要使用任何形式的服务级速率限制器，因为一切都在约定的\
  \ `SLA` 内平稳运行。\n\n好吧，那是今天之前的事了。现在你的服务离线了。数据在积压，上游服务正在填满它们的队列，人们很沮丧，因为他们的服务因为你这个单点故障而开始遇到问题。\n\
  \n这些问题都源于一种资源匮乏形式，被称为“惊群问题”。当许多进程在等待一个事件（例如系统资源变得可用，或者在这个例子中`API`服务器重新上线）时，就会发生这个问题。然后所有进程都会争相尝试获取资源，在许多情况下，单个进程（`API`服务器）上的负载足以使服务再次离线。不幸的是，这又开始了新一轮的资源匮乏循环。当然，除非你能安抚这群“惊马”，或者将负载分散到更多的工作进程中，从而降低整个网络的负载，让资源有喘息的空间。\n\
  \n虽然这个最初的例子更像是一次无意的分布式拒绝服务攻击（`DDoS`），但这类问题可以在客户端（使用指数退避或自我节流）和`API`边缘（通过负载均衡和速率限制）得到解决。\n\
  \n\n\n最终，如果没有由运营指标、监控器和系统级（`SLA`/`SLO`）告警所构建的恰当洞察渠道，数据可能会消失无踪，而这将成为一个难以解决的挑战。\n\n\
  无论你决定在数据网络边缘添加数据网关 API，采用自定义`SDK`来实现上游一致性和可问责性，还是决定采用其他方法来处理数据进入数据平台的问题，了解你有哪些可选方案总是好的。无论数据以何种路径进入你的数据流，如果不深入探讨数据格式、协议以及二进制可序列化数据的话题，那么这篇关于流式数据的入门介绍便不算完整。谁知道呢，你或许会发现一种更好的方法来处理数据可问责性问题！\n\
  \n## 为任务选择正确的数据协议\n\n当你想到结构化数据时，脑海中首先浮现的可能是`JSON`数据。`JSON`数据具有结构，是一种基于 Web 的标准数据协议，而且最重要的是，它非常易于使用。这些都是快速上手的好处，但随着时间的推移，如果没有适当的防护措施，在为流式系统标准化使用`JSON`时，你可能会面临问题。第一个问题是`JSON`数据是可变的。这意味着作为一种数据结构，它很灵活，因此也很脆弱。数据必须保持一致才能实现可问责，并且在网络间传输数据（在线传输）时，序列化格式（二进制表示）应该具有高度可压缩性。对于`JSON`数据，你必须为载荷中表示的每个对象发送其（所有字段的）键。这不可避免地意味着，在一系列对象中，每增加一条记录（除了第一条），你通常都要发送大量额外的数据负担。\n\
  \n幸运的是，这并不是一个新问题，而且恰好存在处理这类事情的最佳实践，以及关于什么才是最佳数据序列化策略的多种学派思想。这并不是说`JSON`没有优点。只是当涉及到奠定坚实的数据基础时，结构越多越好，压缩程度越高越好，只要这不会消耗大量`CPU`周期即可。\n\
  \n### 可序列化的结构化数据\n\n在高效编码和传输二进制数据方面，通常会提到两种序列化框架：[Apache Avro](https://avro.apache.org/)\
  \ 和 Google [Protocol Buffers](https://developers.google.com/protocol-buffers)（`protobuf`）。这两个库都提供了高效的`CPU`技术用于序列化基于行的数据结构，并且两者也都提供了它们自己的*远程过程调用*（`RPC`）框架和功能。我们先来看\
  \ Avro，然后是`protobuf`，最后我们会简要介绍远程过程调用。\n\n#### Avro 消息格式\n\n使用 Avro，你可以通过记录（record）的概念为结构化数据定义声明式模式。这些记录只是`JSON`格式的数据定义文件（模式），以`avsc`文件类型存储。列表\
  \ 9-3 展示了一个咖啡模式的例子。\n\n```\n{\n\"namespace\": \"com.coffeeco.data\",\n\"type\":\
  \ \"record\",\n\"name\": \"Coffee\",\n\"fields\": [\n(\"name\": \"id\", \"type:\
  \ \"string\"},\n{\"name\": \"name\", \"type\": \"string\"},\n{\"name\": \"boldness\"\
  , \"type\": \"int\", \"doc\": \"从轻度到深度烘焙。1 到 10\"},\n{\"name\": \"available\", \"\
  type\": \"boolean\"}\n]\n}\n列表 9-3\ncoffee.avsc: 定义咖啡模式可以相当容易地完成\n```\n\n处理 Avro\
  \ 数据可以根据你希望在运行时的工作方式，分为两条不同的路径。你可以采用编译时方法，也可以在运行时按需动态处理。这带来了一种灵活性，可以增强交互式数据发现会话。例如，Avro\
  \ 最初被创建为一种高效的数据序列化协议，用于在 Hadoop 文件系统中长期存储大型数据集合为分区文件。鉴于数据通常在`HDFS`内部从一个位置读取并写入另一个位置，Avro\
  \ 可以为每个文件存储一次（在写入时使用的）模式。\n\n#### Avro 二进制格式\n\n当你将一组 Avro 记录写入磁盘时，该过程会将 Avro 数据的模式直接编码到文件本身中（一次）。`Parquet`文件编码也有类似的过程，其中模式被压缩并作为二进制文件页脚写入。我们在第\
  \ 4 章末尾亲身经历了这个过程，当时我们为`StructType`添加了`StructField`级别的文档。这个模式被用来编码我们的`DataFrame`，当我们写入磁盘时，它在下一次读取时保留了我们内联的文档。\n\
  \n##### 启用向后兼容性并防止数据损坏\n\n在将多个文件作为单个集合读取的情况下，如果记录之间的模式发生变化，可能会出现问题。Avro 将二进制记录编码为字节数组，并在反序列化时将模式应用于数据。\n\
  \n这意味着你必须采取额外的预防措施来保持向后兼容性，否则你将发现自己遇到`ArrayIndexOutOfBounds`异常的问题。\n\n这可能会以微妙的方式发生在模式上。例如，假设你需要将模式中某个特定字段的整数值更改为长整数值。不要这样做。这会因为从`int`到`long`的字节大小增加而破坏向后兼容性。这是因为模式定义被用来确定记录中每个字段在字节数组中的起始和结束位置。为了保持向后兼容性，你需要弃用该整数字段的后续使用（同时在你的\
  \ Avro 定义中保留它），并在模式中添加（追加）一个新字段供后续使用。\n\n#### Avro 流式数据的最佳实践\n\n从带有有用内嵌模式的静态 Avro\
  \ 文件，转向无界的高质量二进制数据流，主要的区别在于你需要自带模式。这意味着你需要支持向后兼容性（以防你需要回退并重新处理模式变更前后的数据），以及正向兼容性，以防已有消费者正在从流中读取数据。\n\
  \n这里的挑战是同时支持这两种兼容性，因为 Avro 不具备忽略未知字段的能力，而这正是支持正向兼容性的一个要求。为了应对 Avro 的这些挑战，Confluence\
  \ 公司开源了他们的[模式注册表](https://docs.confluent.io/platform/current/schema-registry/index.html)（用于与\
  \ Kafka 配合使用），这使得可以在`Kafka`主题（数据流）级别进行模式版本管理。\n\n在不使用模式注册表支持 Avro 时，你必须确保在更新编写者上的模式库版本之前，已经更新了所有活跃的读取者（Spark\
  \ 应用程序或其他）以使用新模式版本。在你切换的那一刻，你可能会发现自己正站在一次事故的起点。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n#### Protobuf 消息格式\n\n使用 protobuf，你可以通过“消息（messages）”这一概念来定义结构化数据。消息的编写格式类似于在\
  \ C 语言中定义结构体。这些消息被写入带有 `.proto` 扩展名的文件中。协议缓冲区的一个重要优势是支持 *导入（imports）*。这意味着你可以定义通用的消息类型和枚举，这些类型和枚举可以在大型项目中使用，甚至可以导入到外部项目中，从而实现大规模的复用。使用\
  \ protobuf 创建 `Coffee` 记录（消息类型）的简单示例如清单 9-4 所示。\n\n```\nsyntax = \"proto3\";\noption\
  \ java_package=\"com.coffeeco.protocol\";\noption java_outer_classname=\"Common\"\
  ;\nmessage Coffee {\nstring id       = 1;\nstring name     = 2;\nuint32 boldness\
  \ = 3;\nbool available  = 4;\n}\n```\n\n*清单 9-4 coffee.proto：使用 Protobuf 定义 Coffee\
  \ 数据类型*\n\n使用 protobuf，你只需定义一次消息，然后就可以为你选择的编程语言进行编译。例如，我们可以使用 [ScalaPB](https://scalapb.github.io/)\
  \ 项目（由 [Nadav Samet](https://www.linkedin.com/in/nadav-samet/) 创建和维护）中的独立编译器，通过\
  \ `coffee.proto` 文件为 Scala 生成代码。\n\n##### 代码生成\n\n编译 protobuf 可以实现简单的代码生成。下面的示例取自\
  \ `/ch-09/data/protobuf` 目录。本章的 `README` 中说明了如何安装 ScalaPB，并包含了设置正确环境变量以执行清单 9-5\
  \ 中命令的步骤。\n\n```\n$SCALAPBC/bin/scalapbc -v3.11.1 \\\n--scala_out=/Users/`whoami`/Desktop/coffee_protos\
  \ \\\n--proto_path=$SPARK_MDE_HOME/ch-09/data/protobuf/ \\\ncoffee.proto\n```\n\n\
  *清单 9-5 为 Scala 编译 Protobuf 消息*\n\n从长远来看，这个过程可以节省时间，因为你无需再编写额外的代码来序列化和反序列化数据对象（无论是在不同语言之间，还是在不同代码库中）。\n\
  \n##### Protobuf 二进制格式\n\n序列化后的格式（二进制线路格式）是使用“二进制字段级分隔符”的概念进行[编码](https://developers.google.com/protocol-buffers/docs/encoding)的。这些分隔符作为标记，用于识别序列化后的\
  \ protobuf 消息中封装的数据类型。在示例 `coffee.proto` 中，你可能已经注意到每个字段类型旁边都有一个索引标记（`string id =\
  \ 1;`）。这用于辅助消息在网络上传输时的编码/解码。这意味着与 avro 二进制格式相比，它会增加一点点额外开销，但如果你仔细阅读过[编码规范](https://developers.google.com/protocol-buffers/docs/encoding)，你会发现其他方面的效率（如位打包、对数值数据类型的高效处理、以及对每条消息的前\
  \ 15 个索引进行特殊编码）完全弥补了这些额外的字节开销。关于将 protobuf 作为流式数据的首选二进制协议，从全局来看，其优点远远多于缺点。它能弥补自身不足的方式之一，就是对向后和向前兼容性的支持。\n\
  \n##### 启用向后兼容性并防止数据损坏\n\n在修改 protobuf 模式时，有一些与我们在讨论 avro 时类似的规则需要牢记。根据经验法则，你可以更改字段的名称，但**绝不能**更改字段的类型或位置（索引），除非你想破坏向后兼容性。在需要长期支持任何类型数据时，这些规则不容忽视，尤其是当团队对\
  \ protobuf 的使用越来越熟练时，情况会变得特别棘手。如果不够小心，那种想要重新排列和优化的需求，最终可能会给你带来麻烦。（更多背景信息，请参见“随时间推移维护数据质量”。）\n\
  \n##### 流式 Protobuf 数据的最佳实践\n\nProtobuf 同时支持向后和向前兼容性，这意味着你可以部署新的写入器，而无需担心先更新读取器，反之亦然。你可以用更新版本的\
  \ protobuf 定义来更新读取器，而无需担心对所有写入器进行复杂的部署。Protobuf 通过“未知字段”的概念来支持向前兼容。这是一个在 avro 规范中不存在的额外概念，它用于追踪那些由于本地\
  \ protobuf 版本与当前正在读取的版本之间存在差异而无法解析的索引和关联字节。这样做的好处是，你可以在任何时候选择采用 protobuf 定义中的新变更。\n\
  \n例如，假设你有两个流式应用程序 (a) 和 (b)。应用程序 (a) 正在处理来自上游 Kafka 主题 (x) 的流式数据，为每条记录增加额外的信息，然后将其写入一个新的\
  \ Kafka 主题 (y)。应用程序 (b) 从主题 (y) 读取数据并进行处理。假设 protobuf 定义有了一个新版本，而应用程序 (a) 尚未更新到最新版本。上游的\
  \ Kafka 主题 (x) 和应用程序 (b) 已经更新，并期望使用升级后提供的一些新字段。令人惊叹的是，即使应用程序 (a) 并不知道这些未知字段的存在，也仍然可以将它们传递给应用程序\
  \ (b)。\n\n**提示**\n\n*随时间推移维护数据质量*：在使用 avro 或 protobuf 时，你应该像对待要推送到生产环境的代码一样对待模式。这意味着要创建一个可以提交到公司\
  \ GitHub（或你使用的任何版本控制系统）的项目，也意味着你应该为模式编写单元测试。这不仅提供了如何使用每种消息类型的实际示例，而且测试数据格式的重要原因在于确保对模式的修改不会破坏向后兼容性。锦上添花的是，为了对模式进行单元测试，你首先需要编译\
  \ (`.avsc` 或 `.proto`) 文件，并使用相应的库进行代码生成。这使得创建可发布的库代码变得更加容易，你还可以使用发布版本（例如 1.0.0）来对模式的每次变更进行编目。\n\
  \n实现此过程的一个简单方法是，在项目生命周期中，将所有模式变更对应的每条消息的二进制副本序列化并存储起来。我发现直接在单元测试中添加这个步骤非常成功，即使用测试套件创建、读取这些记录，并将其直接写入项目的测试资源目录。这样，所有模式变更对应的每个二进制版本都可以在代码库中找到。\n\
  \n只要前期多花一点功夫，从全局来看，你就可以为自己省去很多麻烦，并且可以高枕无忧，因为你知道数据是安全的（至少在数据生产和消费这一端是如此）。\n\n现在你已经知道，在实施长期数据问责策略时，使用\
  \ avro 或 protobuf 是有好处的。通过使用这些与语言无关、基于行的结构化数据格式，你可以减少长期被特定语言锁定的问题，为将来可能使用的任何主流编程语言留有选择余地。支持遗留的库和代码库可能是一件吃力不讨好的工作。此外，序列化格式还有助于降低与发送和接收大量数据相关的网络带宽成本和拥塞。这也有助于降低长期保存数据的存储开销。\n\
  \n最后，让我们来看看这些结构化数据协议如何在通过远程过程调用（RPC）发送和接收数据时，进一步提高效率。\n\n\n\n### 远程过程调用\n\n简而言之，RPC\
  \ 框架使客户端应用能够通过来回传递序列化消息，以本地函数调用的方式透明地调用远程（服务端）方法。客户端和服务端的实现使用相同的公共接口定义来定义可用的功能性\
  \ RPC 方法和服务。接口定义语言（`IDL`）定义了协议和消息定义，并作为客户端和服务端之间的契约。让我们通过查看流行的开源 RPC 框架 [gRPC](https://grpc.io/)\
  \ 来实际了解这一点。\n\n#### gRPC\n\n`gRPC` 最初由 Google 构思和创建，代表“通用型”远程过程调用，是一个强大的开源框架，用于高性能服务，从分布式数据库协调（如\
  \ [CockroachDB](https://www.cockroachlabs.com/docs/stable/architecture/distribution-layer.html)\
  \ 所示）到实时分析（如 [Microsoft 的 Azure 视频分析](https://docs.microsoft.com/en-us/azure/media-services/live-video-analytics-edge/grpc-extension-protocol)\
  \ 所示）。\n\n通过使用协议缓冲区（protocol buffers）进行消息定义、序列化以及服务的声明和定义，`gRPC` 可以简化您捕获数据和构建服务的方式。例如，假设我们希望继续创建一个用于追踪客户咖啡订单的\
  \ API。API 契约可以在一个简单的服务文件中定义，然后服务端实现以及任意数量的客户端实现都可以使用相同的服务定义和消息类型来构建。\n\n##### 定义一个\
  \ gRPC 服务\n\n您可以轻松地定义一个服务接口，包括其请求和响应对象，以及需要在客户端和服务端之间传递的消息类型，如清单 9-6 中的示例所示。\n\n\
  ```\nsyntax = \"proto3\";\nservice CustomerService {\nrpc TrackOrder (Order) returns\
  \ (Response) {}\nrpc TrackOrderStatus (OrderStatusTracker) returns (Response) {}\n\
  }\nmessage Order {\nuint64 timestamp    = 1;\nstring orderId      = 2;\nstring userId\
  \       = 3;\nStatus status       = 4;\n}\nenum Status {\nunknown_status = 0;\n\
  initalized     = 1;\nstarted        = 2;\nprogress       = 3;\ncompleted      =\
  \ 4;\nfailed         = 5;\ncanceled       = 6;\n}\nmessage OrderStatusTracker {\n\
  uint64 timestamp = 1;\nStatus status    = 2;\nstring orderId   = 3;\n}\nmessage\
  \ Response {\nuint32 statusCode = 1;\nstring message    = 2;\n}\n清单 9-6\nservices.proto：定义\
  \ gRPC 服务和消息\n```\n\n借助 `gRPC`，实现和维护数据基础设施中使用的服务端和客户端代码会变得容易得多。由于 `protobuf` 支持向后和向前兼容性，这意味着旧的\
  \ `gRPC` 客户端仍然可以向新的 `gRPC` 服务发送有效消息，而不会遇到常见问题和痛点。\n\n图 9-3 展示了一个 `gRPC` 在工作中的示例。服务端代码使用\
  \ C++ 编写以实现高速，而使用 Ruby 和 Java 编写的客户端可以使用 `protobuf` 消息作为其通信手段与该服务进行互操作。\n\n![图 9-3](img/505711_1_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3** — RPC（在此示例中为 `gRPC`）的工作方式是在客户端和服务端之间传递序列化消息。客户端实现了相同的接口定义语言（`IDL`）接口，这充当了客户端和服务端之间的\
  \ API 契约。（来源：[*https://grpc.io/docs/what-is-grpc/introduction/*](https://grpc.io/docs/what-is-grpc/introduction/)）\n\
  \n##### gRPC 使用 HTTP/2\n\n此外，对于现代服务栈而言，`gRPC` 可以使用 `HTTP/2` 作为其传输层。这也意味着您可以利用现代数据网格（例如\
  \ [Envoy](https://www.envoyproxy.io/)）来实现代理支持、路由和服务级身份验证，同时减少标准 HTTP over TCP 中出现的\
  \ TCP 数据包拥塞问题。\n\n在数据责任方面，减少传输中的数据问题并取得成功，始于数据本身，并从该中心点向外扩展。在深入处理流式数据洪流之前，应考虑就数据如何进入您的数据网络制定流程。\n\
  \n## 总结\n\n本章的目标是阐述从静态的基于批处理的思维方式，转变为考虑使用实时流式数据的风险与收益时，所涉及到的各个组成部分、概念和细微差别。实时利用数据可以带来快速、可操作的洞察，并为最先进的机器学习和人工智能打开大门。然而，如果事先没有采取正确的步骤，分布式数据管理也可能演变成一场数据危机。请记住，如果没有建立在有效（可信）数据之上的坚实数据基础，实时之路将并非易事。\n\
  \n在下一章中，您将基于创建一个系统的概念来构建一个端到端的结构化流式处理应用，该系统用于处理关于每家咖啡店可用座位数的实时信息，以便人们能够找到距离其当前位置最近且有适合其同行人数座位的店铺。在此过程中，您将学习使用\
  \ [Kafka](https://kafka.apache.org/) 以及 [Redis](https://redis.io/)（[Redis Streams](https://redis.io/topics/streams-intro)）。这两种流式处理技术既有很好的重叠之处，也存在差异，这些特点使它们非常适合与\
  \ Spark Structured Streaming 配合使用。\n\n# 10. 编写结构化流式处理应用的模式\n\n在上一章中，我们为处理传输中的数据建立了一个流式处理参考框架。通过介绍那些常常阻碍流式处理成功之路的常见问题和陷阱，您发现了本地协调时间与全局协调时间之间的细微差别，也就是时间带来的麻烦。您还了解了当损坏或无效数据进入您的数据网络时所产生的复杂问题，即传输中的数据问题。在一个完美的世界里，每个事件或数据点都会神奇地以正确的时间对齐（同步）顺序出现，但在一个不完美的世界里，有一些工具可以帮助您。\n\
  \n在本章中，您将发现用于在使用 Spark Structured Streaming 时解决流式数据问题的有效设计模式。首先，您将了解封装 Spark Structured\
  \ Streaming 的核心编程模型和概念。从简单入手，逐步深入，您将编写一系列 Structured Streaming 应用，这些应用将应对读取和写入无界数据流所必需的核心语义。\n\
  \n本章将教您：\n\n- 使用 `Redis Streams` 处理结构化流式数据。这将强化上一章中关于严格模式对于构建可问责数据系统必要性的课程。\n- 了解什么是检查点，以及它们如何为有状态的结构化流式处理应用提供动力。\n\
  - 通过触发器与 Spark 配置的结合，使用速率限制来控制您的应用。\n- 理解如何设计 Structured Streaming 应用。\n\n让我们从学习\
  \ Spark Structured Streaming 的核心原则开始，奠定基础。\n\n\n\n## 什么是 Apache Spark Structured\
  \ Streaming？\n\n简而言之，Apache Spark Structured Streaming 让你能够以一种易于理解的方式利用实时流式数据的强大功能。借助结构化的\
  \ Spark API 所提供的基础，它使你（工程师）能够将流式数据视为跨无限系列微批次（数据集）的时间点视图，或视为单个事件（数据点）的连续流。\n\nSpark\
  \ Structured Streaming 编程模型的核心是我们的老朋友 SparkSQL。作为一个统一的处理过程，SparkSQL 使你在编写处理流式数据、静态数据（批处理数据）或两者混合的应用程序时，能够应用相同的思维模型。通过模糊*表*和*视图*之间的界限，Structured\
  \ Streaming 有效消除了在这两种数据访问模型之间处理数据所带来的认知负担。在下一节中，你将了解这种处理模式的工作原理，从*无界表*的概念开始。\n\n\
  ## 无界表与 Spark Structured Streaming 编程模型\n\n无界表是一种结构，它使得在你的应用程序上下文中，更容易概念化用于转换和查询流式数据的处理模式。如果你真的存储一张无界表，应用程序最终将因所有这些数据的重量（数据点数量）和压力（内存和\
  \ CPU）而崩溃。在大多数现实世界的 Structured Streaming 应用程序中，被摄入到你流式应用程序中的数据流，在每个数据点对于实时处理变得不必要、无趣或无用之前，都有一个处理截止日期，或数据存活时间（TTL）。更稳妥的说法可能是，当你编写一个\
  \ Structured Streaming 应用程序时，实际上是在创建一个应用程序，它在内存中处理和存储一组有界数据，跨越一个随时间变化的、无限或无界的最终数据流。图\
  \ 10-1 展示了无界表的概念。\n\n![](img/505711_1_En_10_Fig1_HTML.png)\n\n图 10-1\n\nSpark Structured\
  \ Streaming 编程模型\n\n图 10-1 是一个高层级的序列图，展示了在 Spark 中随时间推移，能够可靠地摄取结构化无界流式数据的过程。在示例中，随着新数据被摄入到应用程序中，一个确定性的周期随着系统的每次“滴答”（即微批次）而开始。在每个批次中，Spark\
  \ 在处理下一组数据之前，会执行一系列有向步骤（输入 --> 查询 --> 结果 --> 输出）。这一系列确定性的步骤（称为 DAG）代表了 Spark Structured\
  \ Streaming 的四个基本处理范式：\n\n*   执行/处理模式（微批次或连续模式）\n*   触发器（有效的处理窗口/边界）\n*   增量查询（随时间推移的渐进式数据处理）\n\
  *   流式输出模式（完整、更新和追加）\n\n接下来你将探索这些范式，并理解它们在 Spark Structured Streaming 中所扮演的角色。\n\
  \n### 处理模式\n\n最初，微批次处理是 Structured Streaming 唯一引入的执行模式，并且至今仍是默认模式。流式微批次的调度和执行使应用程序开发者能够转向一个可靠、结构化的流处理模型，而远离由\
  \ Spark 第一个流式编程模型引入的自定义方法。\n\n**Apache Spark Streaming 与*离散化流（DStreams）***\n\n使用\
  \ DStreams 时，工程师必须深入了解 `RDD` API（*Apache Spark 的核心数据结构和编程模型*）。这意味着工程师必须学会有效地使用较低级别的\
  \ `RDD` API。这包括理解如何从故障中恢复、实现接收器、高效地序列化/反序列化他们的代码和数据，以及扩展和性能调优他们的应用程序。这些仍然是需要学习的内容，只是通过\
  \ `DataFrames` 和 `Datasets` API 以及 SparkSQL 提供的抽象，学习层次更高了。你可以将这视为通往 Structured Streaming\
  \ 道路上一个更自然的垫脚石，它展示了社区为克服障碍所采用的设计模式中的优点、缺点和丑陋之处。\n\n幸运的是，本书不介绍 Apache Spark Streaming，而是介绍更易于理解、性能更高且能自我优化的\
  \ *Apache Spark Structured Streaming*。我建议你回顾一下 Spark 的发展历程，以理解过去的状况，并欣赏其演进的成果。现在，回到\
  \ Structured Streaming 的处理模式。\n\n连续执行模式被引入，用于实现极低端到端延迟的真正实时处理。两种执行模式都能使应用程序管理流处理的复杂性，同时仅改变应用程序中数据处理方式的语义。图\
  \ 10-2 显示了数据在输入源和输出端之间的一般流程如何保持一致，而主要的区别在于触发机制。\n\n![](img/505711_1_En_10_Fig2_HTML.png)\n\
  \n图 10-2\n\nStructured Streaming 的处理流程\n\n理解何时使用每种处理模式，是你在编写任何初始代码之前必须做出的关键决策。我们来看看原因。\n\
  \n\n\n#### 微批处理\n\n如前所述，微批处理在结构化流式处理诞生之初便被引入。这种处理范式使应用程序开发者能够使用结构化的 Spark API（`DataFrame`/`Dataset`）编写流式应用。微批执行的机制依赖于周期性轮询新数据的概念。这使得\
  \ Spark 结构化流式引擎能够生成新一批数据进行处理。值得指出的是，这些应用不仅体现在数据层面的结构化（数据严格绑定到真实的结构化模式 `StructType`），还体现在每个微批处理前后的规划与执行的有序性上。\n\
  \n每个批次都以执行计划为起点，该计划是 Spark 引擎进行规划、分析和优化等一系列预处理步骤的结果，如图 10-3 所示。\n\n![](img/505711_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3  \nSpark 处理的每个批次（或微批）数据的优化过程\n\n生成物理计划（如图 10-3 所示，详情参见第 6 章）后，输入数据源及其相关元数据会被预写（预写日志），为每个微批创建一个称为检查点的参考点。这使得应用在运行过程中可以安然失效，并以确定性的方式从最后一个完整保存点回滚并恢复。\n\
  \n在每个微批处理的另一端，输出写入器会确认其操作成功，这一过程被称为*提交*。同样值得指出的是，每个微批必须成功处理完成后，下一个微批才能开始处理。这种确认机制通过完全提交微批内所有已完成的工作来实现，或者在发生终态不可恢复故障时中止所有后续执行。\n\
  \n综合这些原则，你的应用将能够从可靠的数据源处理结构化数据，以一系列确定性的微批形式，为整个应用生命周期内的所有输入和输出提供清晰一致的模式，从而应对看似无限的流式数据。我们将在下一节的章节练习中实际演示这一过程。\n\
  \n#### 连续处理\n\n结构化流式处理发布后不久，低延迟（亚秒级）的连续处理执行框架也随之推出。Spark 执行框架不再依赖对数据源的周期性轮询，而是依靠长期运行的任务来处理从数据源到数据接收器的端到端连续数据处理。这意味着数据会以最快的速度逐事件处理，无需等待每个批次的所有事件数据完全提交而带来的开销。图\
  \ 10-4 提供了一个高层级示意图，以帮助理解这一模型。\n\n![](img/505711_1_En_10_Fig4_HTML.png)\n\n图 10-4\
  \  \n连续处理执行模式\n\n虽然这种执行模式可以实现极低的延迟（约 100ms 端到端），但它最适合处理单个事件的流，而非那些可以分组、分析或整体处理的微批事件集合。例如，如果你要构建一个系统，用于通知顾客他们点的咖啡已准备好取餐（类似苹果的推送通知服务），从技术上讲，你可以将此负载分布到\
  \ Spark 集群上，确保每条消息精确发送一次。你肯定不想惹恼顾客，导致他们选择退出通知。\n\n你将在第三个和第四个练习中学习如何使用检查点和触发器。这也将是一次尝试连续处理和微批处理的机会。\n\
  \n### 练习材料\n\n第 10 章的练习材料位于 [`https://github.com/newfront/spark-moderndataengineering/tree/main/ch-10`](https://github.com/newfront/spark-moderndataengineering/tree/main/ch-10)。材料中的\
  \ `README` 文件将为你提供有关其他安装步骤或注意事项的更多背景信息。这些练习依赖于第 8 章中扩展的 `~/dataengineering/` 环境设置，该设置提供了通用的\
  \ MySQL（Hive Metastore）和 MinIO（S3）。\n\n## 练习概述\n\n以下练习旨在教你使用 Apache Spark 结构化流式处理的核心功能。你在完成一系列练习时，将采用不同的方法模式。这些练习都围绕同一个核心挑战展开并延伸。\n\
  \n### 挑战\n\n你需要创建一个系统，用于摄取 CoffeeCo 旗下所有咖啡店的实时事件数据。该系统将用于追踪整个网络中的顾客使用模式，从订单追踪开始。对于每个订单，可以预期一个可靠的上游网关（如第\
  \ 9 章所述示例）会生成可靠事件，供你的 Spark 应用摄取。\n\n图 10-5 展示了为流式应用提供必要数据的高层级系统工作流程。为简化起见，本章练习将重点放在事件流平台之后的数据处理上。因此，我们需要先定义一个事件格式。\n\
  \n![](img/505711_1_En_10_Fig5_HTML.png)\n\n图 10-5  \n订单追踪的入口路径。每个订单通过事件网关 API 发送一个事件，并排入事件流平台\n\
  \n### OrderEvent 格式\n\n虽然在没有约定数据格式的情况下编写基于事件的应用程序并非不可能，但这样做难度更大，并且长期来看会使事情复杂化。在本例中，假设每个事件的格式需要提供订单\
  \ ID、关联客户 ID、交易门店 ID、订购商品数量以及交易总价。这些信息将被封装在一个我们称之为 `OrderEvent` 的结构中。我们清楚最终需要摄取的内容，只需将实际事件形式化即可。\n\
  \n**注意：** 在现实世界中，数据工程师常常需要负责创建结构化数据格式，甚至编写上游系统来生成数据并输入到他们自己的数据域中。这样他们便拥有自己域的数据合约，从而理解网络中其他上游数据提供者/生产者之间的数据血缘关系。\n\
  \n正如上一章所述，事件应保持一致且可靠；否则你的流式应用可能会突然停止运行，给你带来一团乱麻（以及停机故障）。这并不意味着在测试某个想法之前，你需要花费大量时间将上游数据梳理得井井有条。事实上，通常正确的做法是从粗略的概念/想法入手，然后分阶段逐步完善。\n\
  \n现在我们就采用这种方法。我们将首先在 Spark 引擎内部构建将要处理的数据。\n\n\n\n### 深入理解 Spark Struct\n\n鉴于您使用\
  \ Spark SQL 进行的结构化数据转换依赖于 `StructType`，您可以先通过简单的 DataFrame 概念来构思应用程序。这使您能够在正式确定特定应用的数据契约之前快速行动。请记住，始终从小处着手，逐步构建。\n\
  \n```scala\nnew StructType()\n  .add(StructField(\"timestamp\", LongType, false))\n\
  \  .add(StructField(\"orderId\", StringType, false))\n  .add(StructField(\"storeId\"\
  , StringType, false))\n  .add(StructField(\"customerId\", StringType, false))\n\
  \  .add(StructField(\"numItems\", IntegerType, false))\n  .add(StructField(\"price\"\
  , FloatType, nullable false))\n```\n\n现在，我们对应用程序中将要使用的数据结构有了一个概括性的表示，可以开始第一个练习了。\n\
  \n### 练习 10-1：使用 Redis Streams 驱动 Spark Structured Streaming\n\n[Redis Streams](https://redis.io/topics/streams-intro)\
  \ 可用于快速构建和测试完整的端到端流式应用程序。正如您将在本练习中看到的，这有助于发现构建应用程序的流程。\n\nRedis Streams 运行开销很小，这得益于它是\
  \ [Redis](https://redis.io/) 的一个原生数据结构。Redis 是一个高度优化的数据结构存储系统，在社区中非常知名且受欢迎。如果您从未使用过\
  \ Redis，您仍然可以从本练习中学习。\n\n**练习 10-1**\n\n练习材料位于 `/ch-10` 目录下的 `/applications/redis-streams`\
  \ 文件夹，具体路径为 `/exercises/01_redis-streams`。\n\n### 启动本地环境\n\n使用 `exercises/01_redis-streams`\
  \ 目录下提供的 `docker-compose` 文件开始。您将再次使用 Docker Compose 启动环境，这意味着您也需要启动 Docker。\n\n\
  ```bash\ndocker compose \\\n-f docker-compose.yaml \\\nup -d --remove-orphans\n\
  ```\n\n这将启动练习的外部依赖项：Redis、MinIO 和 MySQL。然后，是时候连接到新的 Redis 容器了。\n\n### 连接到 Redis\n\
  \n打开终端或创建一个新的会话。您将使用连接到 Redis Docker 容器的终端，并通过 `redis-cli` 提供到 Redis 的命令行连接。此连接将用于将新的事件数据推送到您的流中。这也是读取、写入和管理事件流（或其他\
  \ Redis 需求）数据的完整生命周期的便捷方式。额外的好处是，您无需编写任何应用程序代码即可开始。\n\n#### 连接到 Redis CLI\n\n借助\
  \ Redis 容器，您现在可以通过执行清单 10-1 中的命令来连接到 `redis-cli`。\n\n```bash\ndocker exec \\\n-it\
  \ redis redis-cli\n```\n*清单 10-1：连接到 Redis 容器并使用 redis-cli（命令行）*\n\n在提示符下执行 `ping`\
  \ 命令。您将看到返回了 `PONG`，这意味着一切正常。\n\n```bash\n127.0.0.1:6379> ping\nPONG\n```\n\n接下来，您将学习监控流入\
  \ Redis 的命令流。这是观察系统中不同点之间发生了什么的好方法。\n\n#### 启用 Redis 命令监控\n\n打开另一个终端窗口并执行清单 10-2\
  \ 中的命令。连接成功后，您应该会看到一条 `OK` 消息。\n\n```bash\ndocker exec \\\n-it redis redis-cli monitor\n\
  ```\n*清单 10-2：使用 Redis 容器中的 redis-cli 监控发送到 Redis（本地或远程）的命令*\n\n监控进程是一个有用的视图，可以实时查看哪些命令正在被发送到\
  \ Redis。如果等待几秒钟，您将看到来自 Redis 容器健康检查的 ping 消息通过监控器。\n\n```bash\n1626138124.541908\
  \ [0 127.0.0.1:59704] \"ping\"\n```\n\n**容器健康检查**\n\n`docker-compose` 文件（`ch-10/exercises/01_redis-streams/`）中提供的\
  \ `healthcheck` 块使服务能够使用简单的命令自我监控。对于 Redis，健康检查只是通过 `redis-cli` 发送一个 ping 并确保其不会超时。这意味着容器运行正常。\n\
  \n```yaml\nhealthcheck:\n  test: [\"CMD\", \"redis-cli\", \"ping\"]\n  interval:\
  \ 5s\n  timeout: 30s\n  retries: 50\n```\n\n现在是时候使用 Redis 创建您的第一个流了。\n\n### 创建 Redis\
  \ Stream\n\n*Redis Stream* 是自动生成的，并且在您添加数据时会立即可用。由于 Redis 是一个内存数据库，流生成的开销很小，因为没有需要立即创建的文件、新的磁盘空间分配或与流生成相关的昂贵锁定。您只需发布第一个事件，流就会神奇地出现。在后台，Redis\
  \ 会定期将整个数据库持久化到 RDB（这是您整个 Redis 数据库的一个时间点快照）。如果您熟悉 Redis，那么流类型在概念上是列表、有序集合和哈希映射[数据结构](https://redis.io/topics/data-types)的混合体。\n\
  \n#### 流的保证\n\nRedis *保证* 流中每个事件的字段顺序，以及插入顺序的一致性。每个事件标识符将始终大于在其之前插入的任何事件。\n\n**为什么字段级顺序很重要**\n\
  \n字段级顺序的重要性不仅仅是为了安心。作为由 Redis Stream 封装的事件存储的每个编码负载，都是指向一个哈希映射的指针。根据设计，哈希映射可以通过其键随机访问，但它们开箱即用不会保留任何特定顺序。例如，Java\
  \ 中的 HashMap 和 LinkedHashMap 有很大的区别。当您想要维护 `EntrySet` 中键的顺序时，会使用链接变体。为了 Redis Stream\
  \ 内部的可靠性和一致性，Redis 负责处理字段级顺序，但您仍然必须提供一个可靠的事件。我们将在练习后面部分查看这是如何处理的。\n\n**事件标识符**\n\
  \n您使用 `XADD` 命令添加新事件。该命令包括使用自动生成的 ID 而不是提供您自己的标识符的选项。有效的事件 ID 格式是 `<number>-<number>`。对于自动生成的\
  \ ID，Redis 将事件被摄取到 Redis 时的 UNIX 纪元毫秒数（时间戳）和在同一毫秒内接收到的事件的单调递增 ID 连接起来。\n\n```\n\
  1625766684875-0\n```\n\n这种模式确保了每个事件的标识大于其之前的任何事件。如果您决定使用自己的标识符，则必须记住这一点。否则，由于事件\
  \ ID 的预期被打破，您将看到错误消息 `ERR Invalid stream ID specified as stream command argument`。\n\
  \n##### Redis Streams 是仅追加的\n\n理解 Redis 的流是一种仅追加的流式数据结构非常重要。仅追加意味着您无法更改插入顺序。这迫使希望重新组织事件（排序、添加缺失数据）的上游系统读取流、重新组织它，然后将事件推送到新的流中，或者将这些结果推送到另一个可靠的存储中。当您拥有一个不可变的、仅追加的流式数据源时，您可以保持一致性。这降低了使用这些数据的复杂性，并为您提供了流式处理的理想可靠数据源。\n\
  \n让我们发布一个事件并生成您的第一个流。\n\n\n\n#### 向 Redis Stream 发布事件\n\n你可以通过发布事件来创建 Redis Stream。复制清单\
  \ 10-3 中从 `xadd` 开始的命令，并将其粘贴到 `redis-cli` 中。\n\n```\n127.0.0.1:6379> xadd com:coffeeco:coffee:v1:orders\
  \  * timestamp 1625766472513 orderId ord126 storeId st1 customerId ca183 numItems\
  \ 6 price 48.00\n清单 10-3\n向 Redis Stream 发布事件\n```\n\nRedis 将通过返回已发布事件的事件 ID 来确认你的命令。例如，返回\
  \ `\"1625766684875-0\"`。\n\n##### 从 Redis Stream 消费事件\n\n现在你已经发布了一个事件并生成了一个流。你可以使用\
  \ `redis-cli` 读取（消费）所有可用的已发布事件。为此，你将使用 `xrange` 或 `xrevrange` 命令，这些命令允许你读取流中的项目。使用\
  \ `redis-cli` 执行清单 10-4 中的命令。\n\n```\n127.0.0.1:6379> xrange com:coffeeco:coffee:v1:orders\
  \ - + COUNT 1\n清单 10-4\n使用 xrange 从 Redis Stream 读取事件\n```\n\n这将按照插入顺序（升序）获取添加到流中的第一个项目，该顺序基于流的尾部（可以思考一下链表如何使用头指针或尾指针）。从概念上讲，这个过程相当于\
  \ SQL 中的 `order by asc limit 1`。\n\n```\nselect * from v1.orders\norder by timestamp\
  \ asc limit 1\n```\n\n与此相反的是 `xrevrange` 选项。它使用降序插入顺序，从流的头部（最新的项目优先）读取数据。现在你已经对\
  \ Redis Stream 的工作原理有了基本了解，是时候进入 Spark 应用程序本身了。\n\n#### SparkRedisStreamsApp\n\n\
  打开 `SparkRedisStreamsApp`，它位于本章材料中 `applications` 目录的 `/ch-10/applications/redis-streams`\
  \ 路径下。此应用程序可追溯到第 7 章，当时你在 Scala 中创建了第一个编译好的 Spark 应用程序。应用程序的整体结构相同，但增加了一个 Dockerfile\
  \ 和一个非托管库项（`lib/spark-redis`）。在撰写本文时，`spark-redis` 库尚不普遍适用于 Spark 3.x。\n\n```\n\
  redis-streams/\nconf/\nlib/\nproject/\nsrc/\nDockerfile\nbuild.sbt\n```\n\n该项目提供了构建端到端应用程序所需的所有基础模块。我们不妨先不浏览代码，而是换个策略，先编译，再提问。\n\
  \n让我们先使用 `sbt` 编译应用程序。\n\n##### 编译应用程序\n\n从项目根目录（`redis-streams`）开始，编译应用程序。\n\n\
  ```\nsbt clean assembly\n```\n\n注意\n\n编译应用程序需要 Redis 在 Docker 中运行。返回练习的开始位置，在练习目录中执行\
  \ `docker compose` 命令。\n\n应用程序编译完成后，你的 JAR 文件将位于 `target/scala-2.12/spark-redis-streams-assembly-0.1-SNAPSHOT.jar`。下一步我们将应用程序包装到自己的\
  \ Docker 容器中，届时会用到这个资源。\n\n##### 构建 Docker 容器\n\n编译好应用程序后，你现在可以构建 Docker 容器了。打开项目根目录中的\
  \ Dockerfile（如清单 10-5 所示）。\n\n```\nFROM newfrontdocker/apache-spark-base:spark-3.1.2-jre-11-scala-2.12\n\
  COPY target/scala-2.12/spark-redis-streams-assembly-0.1-SNAPSHOT.jar /opt/spark/app/spark-redis-streams.jar\n\
  EXPOSE 4040\n清单 10-5\n用于创建我们的统一 Redis Streams 应用程序的 Dockerfile\n```\n\n容器定义文件（Dockerfile）只是在\
  \ `apache-spark-base` 基础容器之上添加了一个新层，该层将你的应用程序 JAR 复制到 `/opt/spark/app` 目录（由 `spark-base`\
  \ 容器创建）。它还暴露了端口 4040，这是 Spark UI 运行的端口。从项目根目录执行清单 10-6 中的 `docker build` 命令。\n\n\
  ```\ndocker build . \\\n-t `whoami`/spark-redis-streams:latest\n清单 10-6\n构建 spark-redis-streams\
  \ Docker 容器\n```\n\n你会看到容器构建几乎不需要时间（假设 `apache-spark-base` 容器已缓存在本地 Docker 中）。\n\
  \n```\n[+] Building 0.4s (7/7) FINISHED\n=> [internal] load build definition from\
  \ Dockerfile                                                                   \
