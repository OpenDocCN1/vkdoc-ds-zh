  #### 练习 3-3：总结


  你学会了生成临时 SQL 视图，这使你能够使用 SQL 查询 DataFrame。虽然我们这里只是浅尝辄止，但练习的主要目的是向你展示使用 Spark 处理数据的不同方式。回顾一下，`DataFrame`
  具有一个模式（schema），并且在 `SparkSession` 的上下文中生成表或视图时会使用该模式的 DDL。虽然在后续章节中你将处理更丰富、更复杂的数据集，但你可以继续探索这第一个数据集。


