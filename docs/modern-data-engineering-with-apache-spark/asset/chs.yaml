  数据透视是一种强大的分析操作，它将分组提升到了一个新的水平，可用于在数据的复杂子集上创建细项报告。我们将要学习的最后一个操作是 Spark 对分析窗口函数的支持。


  ### 分析窗口函数


  Spark 开箱即用地提供了多种分析支持和操作。本章已经涵盖了可用的分组聚合（`groupBy`，`rollup`），并解释了如何利用强大的 `agg` 运算符来支持并行聚合。您学会了生成基本求和、提取`min`和`max`值以及计算百分位数。上一节教会您使用强大的
  `pivot` 操作来转置（旋转）多行数据以创建复杂的子聚合，但所有这些先前的聚合函数都有一个共同点：它们都创建了一个全新的数据集。窗口函数的工作方式略有不同。


  窗口函数能够实现与纯聚合不同的分析模式。关键区别在于，分组聚合（`groupBy`，`rollup` 等）将多个值归约为（每个分组集）一个单一值，而窗口函数则向输入数据集的每一行添加一个分析值或聚合结果作为新列，从而保留所有行。


  例如，假设我们想要创建一个按小时和跨商店的订单有序索引（运行计数）。为了构造查询，我们将使用 `partitionBy` 而不是 `groupBy`，因为我们不是在进行分组聚合。`PartitionBy`
  创建一个窗口规范，可用于最佳地分割数据集的一个子集并对其进行排序，以便进行分析处理。让我们看看如何使用窗口函数。代码清单 12-34 中的代码块生成了一个窗口，我们可以使用它为
  `coffeeOrdersDf` 添加新列。


  ```scala

  %spark

  import org.apache.spark.sql.expressions.Window

  val hourlyOrders = coffeeOrdersDf

  .withColumn("timestamp",

  to_timestamp($"timestamp"/1000)

  )

  .withColumn("hour", hour($"timestamp"))

  val window = Window

  .partitionBy("store_id","date","hour")

  .orderBy(asc("timestamp"))

  hourlyOrders

  .withColumn("transaction_number", row_number.over(window))

  .withColumn("running_total",sum($"num_items").over(window))

  .limit(6)

  .show

  Listing 12-34

  创建一个窗口规范，用于计算每小时的交易编号以及在窗口内累计售出的商品总数

  ```


  该窗口表示数据集的一个视图，该视图按 `store_id`、`date` 和 `hour` 进行分区，然后将分区后的数据子集按时间戳升序排序。这将使我们能够计算从每小时第一笔交易到最后一笔交易售出的商品总数。请参见代码清单
  12-35。对于每笔交易，我们看到后续每一行的商品总数（`num_items`）都会根据前一个 `num_items` 的值增加。


  ```

  +--------+----------+----+-----------+---------+------+

  |store_id|      date|hour|transaction|num_items|totals|

  +--------+----------+----+-----------+---------+------+

  |  store1|2021-09-06|   3|          1|       11|    11|

  |  store1|2021-09-06|   3|          2|       19|    30|

  |  store1|2021-09-06|   3|          3|        3|    33|

  |  store1|2021-09-06|   3|          4|       20|    53|

  |  store1|2021-09-06|   3|          5|        5|    58|

  |  store1|2021-09-06|   3|          6|       17|    75|

  +--------+----------+----+-----------+---------+------+

  Listing 12-35

  应用 `row_number` 和 `sum` 窗口聚合函数后的输出

  ```


  能够向咖啡订单添加交易编号（`row_number`）和运行总计（`totals`）对于统计销售额非常有用。根据您想要分析的内容，还可以完成其他有趣的事情。




  #### 计算交易间累计平均购买商品数量的差值


  例如，假设你想计算两笔交易之间售出商品数量的差值，并同时计算每小时交易量的累计滚动平均差值？


  这可以通过使用窗口函数中的 `lag` 来实现。Lag 意为“滞后”，滞后操作利用“当前行”、提供的列以及前方行的值，向后查找以获取数据集中任意行的值。在代码清单
  12-36 中，我们使用 `lag($"num_items",1)` 向后查找一行，从而计算出交易之间购买商品数量的绝对差值。最后，我们在窗口上使用 `avg($"diff_last_sale")`
  来创建累计平均值。


  ```spark

  hourlyOrders

  .withColumn("transaction", row_number.over(window))

  .withColumn("totals", sum($"num_items").over(window))

  .withColumn("diff_last_sale",

  abs($"num_items" - lag($"num_items", 1).over(window))

  )

  .withColumn("avg_diff",

  bround(avg($"diff_last_sale").over(window),2)

  )

  清单 12-36

  使用窗口函数 lag(column,step) 计算上次售出商品数量与本次交易售出商品数量之间的差值

  ```


  计算窗口函数（代码清单 12-36）的结果如下所示。


  ```spark

  +-----------+------+--------------+--------+

  |transaction|totals|diff_last_sale|avg_diff|

  +-----------+------+--------------+--------+

  |          1|    11|          null|    null|

  |          2|    30|             8|     8.0|

  |          3|    33|            16|    12.0|

  |          4|    53|            17|   13.67|

  |          5|    58|            15|    14.0|

  |          6|    75|            12|    13.6|

  |          7|    87|             5|   12.17|

  |          8|    99|             0|   10.43|

  +-----------+------+--------------+--------+

  ```


  虽然输出只截取了前八笔交易，但你已经明白了。通过从 `groupBy`（分组集）转向 `partitionBy`（窗口）操作，你可以实现很多功能。通过混合搭配窗口函数的分析功能和强大的聚合能力，你可以创建复杂的报告并生成真正新颖的见解。


  如果最后一个例子让你觉得关联性不强，那么设想一下，你的任务是优化 CoffeeCo 咖啡店的订单流程，你处理的数据与发现（隔离）每家店铺运营中可能存在的问题和低效环节有关。利用捕获的数据，并测量从订单创建到订单完成的时间，你可以使用相同的
  `lag` 技术，结合数据透视、连接和额外的汇总操作，来计算按类别和店铺细分的菜单项物流和时间的报告。最长排队时间的原因可能是某些商品制作困难（高级手冲咖啡或食品），从菜单中移除某一商品可能就能加快所有其他交易的速度。


  ### 练习 12-2：总结


  本章的第二个练习让你接触了如何使用分组聚合方法，并解释了如何转换数据以创建复杂的报告，从而协助你进行数据侦探工作。


  ## 总结


  理解如何可靠地捕获、验证、清理和存储数据是数据工程师工作的一部分。能够利用行业工具高效地完成工作是需要时间和实践积累的。本章深入探讨了如何使用分析数据，并学习如何处理这些数据以理解更高级的数据转换工作，从而服务于分析场景。本章前半部分重点介绍了如何清理数据、切换时区、替换空值、创建和使用用户自定义函数。最后，我们探讨了
  Apache Spark 中可用的聚合和分析处理方法及操作。


  下一章内容稍短，主要关注两个简单的结构化流式应用程序。第一个是咖啡订单指标应用程序，它能够生成可用于实时仪表盘和运营的实时报告。第二个应用程序更为高级，使用了
  `flatMapGroupsWithState` 操作符。在探讨部署模式和监控之前，这是我们需要编写代码的最后一章。


