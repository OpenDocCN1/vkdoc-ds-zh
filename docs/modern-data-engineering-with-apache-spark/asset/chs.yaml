  ```

  *清单 7-2 —— Spark 应用程序目录结构*


  清单 7-2 中展示的嵌套目录和文件是任何使用 Scala 编写的应用程序的典型结构，对于编写过 Java 应用程序的人来说应该很熟悉。让我们从根级别开始，逐一介绍这些结构。


  ##### README.md


  这是一个让您能够告知并指导其他工程师的机会——他们将来不可避免地会接手您曾开发过的应用程序。记录构建和运行应用程序的要求，以及任何对未来工程师有用的附加信息至关重要。如果您使用
  [GitHub](https://github.com/)，当有人查看您的代码时，项目会自动渲染此文件。


  ##### build.sbt


  这是您应用程序的[构建定义](https://www.scala-sbt.org/1.x/docs/Basic-Def.html)。`build.sbt` 文件指导构建过程，提供变量和规则，包括要编译的
  Scala 和 Spark 版本。它还负责组装一个 fat JAR（将所有依赖项打包到一个 JAR 中，从而简化应用程序的部署方式）。这依赖于项目根目录下`project`目录中的额外配置文件。它们共同为您提供了构建和发布应用程序所需的工具。


  ##### conf


  `conf`目录用于存储应用程序的外部配置覆盖。这是一种常见模式，用于为多环境覆盖提供正确的配置，例如开发、预发布、性能和生产环境，以及区域配置覆盖。此外，提供本地测试配置也很实用，可以在本地开发环境中运行应用程序时使用。


  *多环境配置*


  ```

  conf/

  local.conf

  dev.conf

  stage.conf

  prod.conf

  ```


  ##### project


  如果您是`sbt`新手，`project`目录是您进行配置的一站式商店。`build.properties`跟踪您要使用的`sbt`版本，以及任何声明的插件和解析器。插件为您的`sbt`构建增加功能，而解析器则告诉`sbt`在哪里找到依赖项，例如
  Apache Spark 等。


  ##### src


  源代码（`src`）目录是应用程序代码所在的位置。这是您的应用程序根目录。清单 7-3 中的目录结构显示了应用程序源代码和资源。


  ```

  src/

  main/

  resources/

  application.conf

  log4j.properties

  scala/

  com.coffeeco.data/

  config/

  Configuration.scala

  SparkApplication.scala

  SparkBatchApplication.scala

  ...

  test/

  resources/

  application-test.conf

  scala/

  ...

  ```

  *清单 7-3 —— Spark 应用程序源代码和运行时资源*


  现在您已对应用程序布局有了大致了解，接下来让我们看看可以在应用程序中使用的通用组件。


  #### 通用 Spark 应用程序组件


  您编写的每个应用程序都包含可以抽象出来以供重用的通用组件。这确保了有一个用于初始化和设置（引导）应用程序运行时的简单框架。在本章中，您将了解以下三个通用组件：


  - `Configuration.scala`：此组件旨在跨多个 Spark 应用程序重用，是一种为应用程序提供分层配置的通用方法。除非需要在运行时覆盖配置值，否则建议通过`application.conf`或任何环境/区域覆盖配置提供应用程序配置的大部分内容。这样，所有必需的配置都可以通过您的
  CI/CD 管道随应用程序一起分发。


  - `SparkApplication.scala`：此组件旨在与`Configuration.scala`结合使用。在为 Spark 应用程序生成`SparkSession`时，可能存在一些您希望所有
  Spark 应用程序继承的默认行为。例如，监控应用程序性能、操作指标以及导致任务失败的问题。对您的应用程序保持关注可以确保您知道每个应用程序何时不再处于健康运行状态。我们将在第
  12 章“通往生产环境之路”中再次讨论监控和`SparkApplication`特质。


  - `SparkBatchApplication.scala`：此特质扩展了`SparkApplication`特质，专门用于批处理应用程序。


  让我们从查看`Configuration`对象开始。


  #### 应用程序配置


  `Configuration`对象为 Spark 应用程序提供了一种可定制的方式，用于生成显式设置，在应用程序初始化时提供给核心的`SparkConf`。您的应用程序可以有几种不同的方式达到其当前配置状态。在第
  5 章中，您了解了如何使用`spark-shell`的`conf`参数访问和修改`SparkConf`；在第 6 章中，您进一步了解了处理集群范围 Spark
  配置的`spark-defaults.conf`文件。现在，我们引入另一种方式，并将详细讨论。


  让我们从查看`Configuration.scala`源代码开始（如清单 7-4 所示，可在在线章节内容中找到）。


  ```

  object Configuration {

  private lazy val defaultConfig = ConfigFactory.load("application.conf")

  private val config = ConfigFactory.load().withFallback(defaultConfig)

  config.checkValid(ConfigFactory.defaultReference(), "default")

  private lazy val appConfig = config.getConfig("default")

  lazy val appName: String = appConfig.getString("appName")

  object Spark {

  private val spark = appConfig.getConfig("spark")

  private val _settings = spark.getObject("settings")

  lazy val settings: Map[String, String] = _settings.map({ case (k,v) =>

  (k, v.unwrapped().toString)

  }).toMap

  }

  }

  ```

  *清单 7-4 —— 通用配置助手*


  清单 7-4 中展示的`Configuration`代码构建在流行的 [Typesafe Config](https://github.com/lightbend/config)
  库之上。该库与 Apache Spark 配合良好，使您的应用程序能够创建配置层，这些配置层可以被延迟加载、评估，并混合到任何 Apache Spark 应用程序的运行时配置中。让我们看一下`application.conf`的格式，以了解配置是如何生成的。




  ### 应用默认配置


  默认应用配置在应用组装过程中与 Spark 应用程序一起编译。它为应用程序的*任何*实例提供了一个有保障的通用配置基础。你可以将其视为配置基础的第一层具体结构。默认配置会与你的应用程序一起编译，并可在
  `ch-07/app/src/main/resources/application.conf` 下的应用源代码中找到。请参见代码清单 7-5。


  ```

  default {

  appName = "spark-event-extractor"

  spark {

  settings {

  "spark.sql.session.timeZone" = "UTC"

  "spark.sql.catalogImplementation" = "hive"

  "spark.sql.hive.metastore.version" = "2.3.7"

  "spark.sql.hive.metastore.jars" = "builtin"

  "spark.sql.hive.metastore.sharedPrefixes" = "..."

  ...

  }

  }

  }

  代码清单 7-5

  应用默认配置（显示部分配置）

  ```


  `application.conf` 由代码清单 7-4 中的 `ConfigFactory` 对象加载并解析。它被加载到名为 `default` 的 `config`
  中。来自代码清单 7-4 的流程还会检查配置的存在性和有效性，确保在 `default` 路径下不存在损坏的对象。如果配置损坏，则解析配置将失败并抛出 `ConfigException`，你的应用程序也会随之失败。*请记住，尽早失败总比在运行时晚些失败要好*。


  配置解析完成后，你的自定义配置就可以在指定的默认配置中使用了。


  ```

  private lazy val appConfig = config.getConfig("default")

  ```


  至此，在代码清单 7-4 中，你可以访问应用程序名称 `appName` 以及 `default.spark.settings` 下包含的配置项。此时这些就是你所需要的全部内容，因为你希望有一种通用的方式将应用配置与应用代码一起发布。


  这组基础配置值也可以在运行时通过外部配置文件进行修改。这将会从编译后的应用程序资源中加载 `application.conf`，然后在应用启动时覆盖（或重写）应用默认值。当你需要根据开发、预发布和生产环境等运行时环境，指定特定于区域的配置或设置时，就会看到这种模式。


  ### 运行时配置覆盖


  能够使用额外的外部配置来增强你的应用程序，提供了许多能力，从简单地添加区域或环境覆盖，到更高级的自动化（如自动增强应用程序的 CPU 核心和 RAM 配置）。无论使用场景是简单还是前沿，使用显式覆盖都能让你轻松更改应用程序，而无需重新编译和重新发布。请考虑以下用例。


  假设你需要在两个不同的时区运行一个报表作业。如果应用默认配置指定了 `"spark.sql.session.timeZone"="UTC"`，那么你可以简单地通过一个名为
  `timezone-pst.conf` 的简单覆盖文件来覆盖默认的 `application.conf`，从而无缝地处理这个用例。现在你可能有额外的需求，但在最简单的用例中，你可以在特定时区运行一个一致的作业。


  ```

  default {

  spark {

  settings {

  "spark.sql.session.timeZone" = "America/Los_Angeles"

  }

  }

  }

  ```


  此外，你也可以通过在 Spark 提交中使用运行时配置覆盖来实现相同的效果（就像你在第 5 章中学到的那样）。


  ```

  --conf "spark.sql.session.timeZone= America/Los_Angeles"

  ```


  **注意**

  在第 8 章中，你将学习如何使用 Airflow 为诸如时区切换报表作业之类的用例增加更多控制。每个 DAG 代表 Airflow 中的一个工作流，并确保运行时覆盖可以被确定下来。这意味着你的下游依赖项永远不会找不到你本应生成的数据。作为数据工程师，一致性和可靠性是你的首要任务。


  介绍完 `Configuration` 对象后，现在是时候看看如何将其与 `SparkApplication` trait 结合使用，以提供无缝的 Spark
  初始化了。


  ## 通用 Spark 应用程序初始化


  `SparkApplication` trait 是一个简单的模块，它提供了一种通用方式来初始化你的 Spark 应用程序。它依赖于上一节中的 `Configuration`
  对象来简化不可变 `SparkConf` 的生成，然后将其输入到 `SparkSession` 的构建中，而 `SparkSession` 是进入 Spark
  运行时的入口点。


  那么这究竟是如何实现的呢？请看代码清单 7-6 中显示的 trait。


  ```

  trait SparkApplication extends App {

  val appName = Configuration.appName

  lazy val sparkConf: SparkConf = {

  val coreConf = new SparkConf()

  .setAppName(appName)

  // 如果缺失则合并

  Configuration.Spark.settings.foreach(tuple =>

  coreConf.setIfMissing(tuple._1, tuple._2))

  coreConf

  }

  lazy implicit val sparkSession: SparkSession = {

  SparkSession.builder()

  .config(sparkConf)

  .enableHiveSupport()

  .getOrCreate()

  }

  lazy val validationRules: Map[()=>Boolean, String] = Map.empty

  def validateConfig()

  (implicit sparkSession: SparkSession): Boolean = {

  if (validationRules.nonEmpty) {

  val results = validationRules.foldLeft(List.empty[String])(

  (errs: List[String], rule: (()=>Boolean, String)) => {

  if (rule._1()) {

  // 继续处理下一个规则

  errs

  } else {

  // 如果谓词不为真，则存在问题

  errs :+ rule._2

  }

  })

  if (results.nonEmpty)

  throw new RuntimeException(s"配置遇到问题：\n ${results.mkString("\n")}")

  else true

  } else true

  }

  def run(): Unit = {

  validateConfig()

  }

  }

  代码清单 7-6

  SparkApplication Trait

  ```


  代码清单 7-6 展示了 `SparkApplication` trait 的源代码。这个 trait（或混入）扩展了 Scala 核心库中包含的 Scala
  `App` trait。`App` trait 提供了将任何对象快速转换为可执行文件的功能，这恰好是初始化 Spark 应用程序的一个无缝起点（因为可执行文件意味着我们也有一个主类）。我们扩展
  `App` trait 的另一个原因是它会延迟 Spark 应用程序的初始化。这意味着我们可以保证 Spark 应用程序会在所有其他静态类和对象初始化之后才被评估。


  在 `SparkApplication` trait 的这个初次实现中，你可能会注意到并没有发生什么太复杂的事情。我们所做的是确保任何混入了这个 trait 的应用程序都能够访问用于配置验证、生成
  `SparkSession` 和 `SparkConf` 的通用命令接口，并且所有应用程序都有一个 run 方法。理论很简单，对吧？


  构建运行每个 Spark 应用程序的入口点现在只需要一点点设置即可开始。你基本上可以开始编写每个新应用程序，而无需担心常见的样板代码以及支持许多做类似事情的不同方式。相反，你现在有了一个用于整体运行应用程序的通用框架。后台执行的脚手架操作类似于
  `spark-shell` 和 Apache Zeppelin 的初始化方式。


  最后要查看的通用组件是 `SparkBatchApplication` trait，它是 `SparkApplication` trait 的一个小型扩展。它为你提供了一组一致的方法来创建批处理应用程序。




  #### 可靠的批处理应用程序


  构建通用组件的诀窍在于从小处着手并巧干。此外，值得指出的是，通用组件应该是多个应用程序执行完全相同的操作所得到的最终成果。许多优秀的库都是通过解决常见问题而构建的，所以顺其自然，并从你的团队、社区或线上获取反馈和意见吧。然后观察一切如何演变。最后，确保你的库能简化问题，并且仅在必要时引入防护措施。


  基于此，代码清单 7-7 给出了一个从小处着手并确保所有批处理应用程序都具备一些防护措施的示例。


  ```

  trait SparkBatchApplication extends SparkApplication {

  lazy val saveMode: SaveMode = SaveMode.ErrorIfExists

  def runBatch(saveMode: SaveMode = saveMode): Unit

  final override def run(): Unit = {

  super.run() // 将会调用 validate config

  runBatch()

  }

  }

  代码清单 7-7

  SparkBatchApplication 特质

  ```


  任何继承自 `SparkBatchApplication` 特质的应用程序都需要定义 `runBatch` 方法并添加相应的配置验证才能开始运行。该特质还有助于引导继承它的应用程序默认采用防御性编程。虽然
  `saveMode` 并未在特质层面强制执行，但实现 `runBatch` 方法会要求应用程序工程师（即使他们之前没有考虑过）思考 `saveMode`。这并非是强制批处理作业做正确的事情，而是为每个应用程序需要考虑的重点提供指导。


  换一种方式思考，从 `SparkApplication` 特质重写的 `run` 方法在 `SparkBatchApplication` 特质中被标记为 `final`。这限制了任何实现类再次重写
  `run` 方法，换句话说，工程师只需要关注 `runBatch` 方法的上下文。试图绕过这个接口将会失败。这个强制功能使作为库作者的你能够做一些有趣的事情，包括驱动通用应用程序启动器，这些启动器只需要一个
  `run` 方法。通过这种方式，无论启动的是批处理作业还是流处理作业，你只需关注一个方法。你还应该提供适当的防护措施，以便留有足够的灵活性，让人们继续使用你的库！


  #### 跟进练习


  将这些辅助库作为公共库提供是很自然的事情。这样，你团队/公司的所有应用程序都可以使用同一套通用工具来构建，而不是让每个新应用程序都重新发明轮子。后者很快就会让人感到疲倦。如果你有干劲，在读完本章之后，尝试将这些通用的
  Spark 组件抽取到一个单独的项目中。


  #### 练习 7-2：总结


  第二个练习带你了解了 Spark 应用程序的布局（目录结构）以及使得编写 Spark 应用程序更简单的三个通用特质。现在已经介绍了通用的 Spark 应用程序组件，是时候编写实际的
  Spark 应用程序了。


  ### 连接各个节点


  掌握了如何布局 Spark 应用程序、通用的应用程序初始化组件以及接口（特质）之后，下一步就是编写应用程序。作为编写第一个流式 Spark 应用程序的前奏，此应用程序将基于一个简单的批处理作业。这个过程会巩固之前的练习，例如使用容器化数据库表和基于分布式文件系统的表所做的工作。它将构建一个能够处理两个数据源之间连接的批处理作业。


  **说明**：这个过程将帮助你过渡到处理激动人心的概念——*无界表* 和结构化数据的*无界流*，这些内容将在第 10 章中介绍（在第 9 章关于流式数据处理系统的思维模型构建章节之后）。


  ### 应用程序目标


  此应用程序的目标很简单：从一个受管理的 Spark 表中读取所有客户评分，然后根据 `customerId` 将每条评分与存储在分布式客户表中的客户数据进行连接。最后，将连接后的数据结果写入一个新的表位置。


  此外，由于本章也向着工作流编排的方向发展，我们希望将此应用程序作为管道作业来运行。这意味着在提交应用程序运行时，驱动程序应用程序需要以运行时配置的形式接收输入（或源表）和输出（或目标表）。这是一个*无状态的基于批处理的
  Spark 应用程序*的示例，因为它需要外部影响来完成手头的任务。


  让我们从外到内进行，首先建模我们的事件，设计运行时配置，确定启动应用程序的 `spark-submit` 命令的样子，然后从主应用程序类一直向下深入到栈底。如果你准备好了，让我们开始构建
  `spark-event-extractor` 应用程序。


  ### 练习 7-3：SparkEventExtractor 应用程序


  首先要明确一点。这个应用程序旨在处理一个客户评分事件。所以我们需要为此类事件提出一个方案。


  #### 评分事件


  客户评分事件需要为我们的应用程序提供事件发生的时间（这对于后续的流式应用程序将变得更加重要）、客户的唯一标识符、评分以及我们可以用来在应用程序中进一步增强评分事件的任何其他元数据。


  **头脑风暴客户评分事件的结果**


  ```

  {

  "created": "2021-04-18 16:28:13.198",

  "eventType": "CustomerRatingEventType",

  "label": "customer.rating",

  "customerId": "CUST124",

  "rating": 4,

  "ratingType": "rating.store",

  "storeId": "STOR123"

  }

  ```


  最初的客户评分事件被定义为一个简单的 JSON 对象。JSON 数据易于序列化，并且可以成为测试想法的好方法，而无需大量前期开销。定义好初始事件定义后，我们可以建模一个简单的
  Scala case class 来协助序列化和反序列化。


  #### CustomerRatingEventType


  客户评分事件允许我们定义一个包装类，可以支持跨商店和商品的客户评分，如代码清单 7-8 所示。


