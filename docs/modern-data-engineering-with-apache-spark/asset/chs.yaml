  \ |\n\n好了。现在事情开始变得更加规范了。我们知道如何配置连接，并创建了回退（默认值）以使我们的应用更易于使用。包含特定的应用配置选项以及可以作为护栏（或辅助轮）的回退，使得使用你的库代码成为一种愉快的体验。\n\
  \n启动脚本如示例 5-4 所示。\n\n> **提示**  \n> 以下代码片段假设你的本地工作目录是本章练习文件夹中 Docker 目录的根目录。`/ch-05/docker/`\n\
