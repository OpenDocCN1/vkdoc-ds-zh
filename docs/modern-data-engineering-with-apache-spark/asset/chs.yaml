  | id|first_name|               email|\n+---+----------+--------------------+\n|\
  \  1|     Scott|  scott@coffeeco.com|\n|  2|      John|  john.hamm@acme.com|\n|\
  \  3|      Milo|mhaines@coffeeco.com|\n+---+----------+--------------------+\n```\n\
  \n现在让我们学习如何描述视图和表。\n\n\n\n#### 描述视图与表\n\n你已经学会了使用 `JDBC` 连接到 MySQL Docker 容器。那么，通过简单的\
  \ SQL 风格的描述来查看表的模式（schema）是否合理呢？理论上，Spark 应该能够引用底层的关系——在本例中就是我们的 `customers` 表，所以不妨试试看。请跟随清单\
  \ 5-10 中的代码片段进行操作。\n\n```\ndf.createOrReplaceTempView(\"customers\")\nspark.sql(\"\
  desc customers\").show()\n清单 5-10\n在 spark-shell 中，创建客户视图并描述表\n```\n\n在 `desc customers\
  \ sql` 命令上调用 `show` 后，你将看到以下输出。\n\n```\n+----------+---------+-------+\n|  col_name|data_type|comment|\n\
  +----------+---------+-------+\n|        id|   string|   null|\n|   created|timestamp|\
  \   null|\n|   updated|timestamp|   null|\n|first_name|   string|   null|\n| last_name|\
  \   string|   null|\n|     email|   string|   null|\n+----------+---------+-------+\n\
  ```\n\n如果这个过程看起来有些绕，那是因为它确实如此。如果我们已经能够访问数据库，为什么还需要事先知道 `customers` 表的存在才能执行描述操作呢？这样的流程又如何能扩展？如果不依赖团队内部的知识，又该如何发现这张表的位置或模式呢？\n\
  \n我们将在下一章中使用 Hive Metastore 来简化数据发现的过程，但现在请记住这种感受。它应该像是你在数据发现道路上遇到的一个不必要的障碍。不过，让我们先完成这个练习，使用我们的\
  \ `JDBC` 连接信息将数据写回 `customers` MySQL 表。\n\n#### 将 DataFrame 写入外部 MySQL 表\n\n为了完成从\
  \ MySQL 到 Spark 再返回的完整往返，我们需要继续将数据写回数据库。你可能会想，我们需要先创建一些新记录才能做到这一点，没错，我们确实需要增加表中的记录数。\n\
  \n#### 生成一些新客户\n\n你已经擅长在 Zeppelin 和 Spark Shell 中生成数据，甚至可以直接使用 MySQL Shell。虽然我们可以继续使用\
  \ MySQL Shell 来添加更多客户，但直接从 Spark 中操作会更有乐趣。\n\n我们可以复用刚才描述过的当前客户表的模式。作为参考，你可以运行 `df.printSchema`\
  \ 或 `df.schema.toDDL` 来快速查看数据结构。你将看到以下模式。\n\n```\nroot\n|-- id: string (nullable\
  \ = true)\n|-- created: timestamp (nullable = true)\n|-- updated: timestamp (nullable\
  \ = true)\n|-- first_name: string (nullable = true)\n|-- last_name: string (nullable\
  \ = true)\n|-- email: string (nullable = true)\n```\n\n现在第一个障碍来了。为了向数据库中添加更多行，你需要创建一个与\
  \ `customers` 数据库表模式匹配的 `DataFrame`。这意味着我们需要想出一种生成老式 *时间戳* 的方法。\n\n如果你还记得第 3 章，我们讨论过模式（schemas）和\
  \ `StructType`。我们还介绍了 Spark 的数据类型。作为复习，用于时间戳的内部 Scala 类型是 `java.sql.Timestamp`。如果每行数据都包含适当的\
  \ Scala 类型，那么 Spark 可以为我们隐式转换为内部的 `TimestampType`，这样我们就可以继续正常工作了。\n\n清单 5-11 中的代码片段展示了创建新客户所需的代码。（提供了\
  \ `ts` 和 `time` 函数以简化客户创建过程。）我们为 Spark 提供了构建和写入更多客户所需的一切！\n\n**提示**\n\n请记住，你可以使用\
  \ `:paste` 命令将多行代码一次性粘贴到 `spark-shell` 中。粘贴完代码后，按 `Cmd+D` 即可运行所有粘贴的内容。\n\n```\n\
  import org.apache.spark.sql._\nimport java.sql.Timestamp\nimport java.time._\n//\
  \ spark: SparkSession (来自 spark-shell)\nassert(spark.isInstanceOf[SparkSession])\n\
  def ts(timeStr: String) = Timestamp.valueOf(timeStr)\ndef time = Timestamp.from(Instant.now())\n\
  // 创建一些新客户\nval records = Seq(\nRow(\"4\",ts(\"2021-02-21 21:00:00\"),time,\"Penny\"\
  ,\"Haines\",\"penny@coffeeco.com\"),\nRow(\"5\",ts(\"2021-02-21 22:00:00\"),time,\"\
  Cloud\",\"Fast\",\"cloud.fast@acme.com\"),\nRow(\"6\",ts(\"2021-02-21 23:00:00\"\
  ),time,\"Marshal\",\"Haines\",\"paws@coffeeco.com\")\n)\nval newCustomers = spark.createDataFrame(\n\
  spark.sparkContext.parallelize(records),\ncustomers.schema\n)\n清单 5-11\n创建一个 DataFrame\
  \ 来表示更多客户\n```\n\n清单 5-11 中的代码创建了一个名为 `ts` 的简单辅助函数，它接受一个简单的 `DateTime` 字符串（例如 `2021-02-21\
  \ 21:00:00`），并将其转换为 `Timestamp` 类的实例，Spark 可以将其隐式转换为内部的 `TimestampType`。除了这个函数之外，还有一个用于获取当前时间的简单函数，名为\
  \ `time`。\n\n接下来，我们生成三个新客户，并通过将客户记录的 `RDD` 与从临时视图 `customers`（来自清单 5-10）中提取的模式包装在一起，创建一个新的\
  \ `DataFrame`。\n\n*对于一直在记录的人来说，这是我们遇到的创建 DataFrame 的第四种方法！*\n\n剩下的就是将我们的新记录写入外部的\
  \ `customers` 表。\n\n#### 使用 JDBC DataFrameWriter\n\n我们可以复用 `connect-jdbc.scala`\
  \ 定义的大部分变量，这些变量通过 `spark-shell` 可用，因为我们最初将 `connect-jdbc.scala` 加载到了同一个上下文中。现在，让我们学习如何使用清单\
  \ 5-12 中的代码片段将数据写回 `customers` 表。\n\n```\nnewCustomers\n.write\n.format(\"jdbc\"\
  )\n.options(MapString, String\n)\n.save()\n清单 5-12\n创建 JDBC DataFrameWriter 实例，并尝试将\
  \ DataFrame newCustomers 定义的行保存到 MySQL 的 customers 表\n```\n\n如果你从本章开始就一直跟着练习，那么你刚刚应该看到了一个错误弹出。\n\
  \n`Table or view 'customers' already exists.`\n\n`SaveMode: ErrorIfExists.`\n\n\
  抛出这个错误是因为 Spark 默认是防御性的（又一个防护栏）。当我们保存三个新列时，我们实际上可能会覆盖数据库表或添加重复的行。让我们庆幸吧，因为我们刚刚被\
  \ `SaveMode` 拯救了。\n\n\n\n### SaveMode\n\n表 5-3 详细列出了由 `SaveMode` 枚举指定的模式。\n\n**表\
  \ 5-3** `DataFrameWriter` 上的 SaveMode 选项\n\n| SaveMode | 描述 |\n| --- | --- |\n|\
  \ `Append` | 如果数据或表已存在，则 `DataFrame` 的内容将被追加到现有数据中。 |\n| `ErrorIfExists` | 如果数据已存在，则抛出异常。\
  \ |\n| `Ignore` | 如果数据已存在，则保存操作不会保存 `DataFrame` 的内容，也不会更改现有数据。 |\n| `Overwrite`\
  \ | 如果数据或表已存在，则现有数据将被 `DataFrame` 的内容覆盖。 |\n\n修改清单 5-12 中的代码，手动指定*保存模式*并尝试再次保存。更改内容如清单\
  \ 5-13 所示。完整示例位于 Zeppelin 笔记本（“5-2_MySQLAndSpark”）中。只需访问 `http://localhost:8080`\
  \ 即可加载示例。\n\n```\nnewCustomers\n.write\n.format(\"jdbc\")\n.mode(\"append\")\n.options(MapString,\
  \ String\n)\n.save()\n清单 5-13\n向 Customers 表追加新行\n```\n\n这次你不会看到任何异常抛出。你甚至可以使用以下查询来查询之前（在清单\
  \ 5-10 中）创建的临时 `customers` 视图。\n\n```\nspark.sql(\"select * from customers\").show\n\
  ```\n\n神奇的是，你的新行无需刷新任何内容就显示出来了。这是为什么呢？这是因为临时 `customers` 视图只是一个承诺，最终会通过我们的 JDBC\
  \ 连接去获取数据。事实上，如果你重新连接到 MySQL Docker 实例，`docker exec -it mysql bash`，并重新登录到 `mysql`\
  \ shell，你可以查询 `default.customers` 表，你会看到你的新行已经愉快地存在于我们默认数据库的 `customers` 表中。\n\n\
  **注意：** 通过 JDBC 写入 MySQL 的源代码可在章节练习材料的 `/ch-05/docker/examples/save-jdbc.scala`\
  \ 中找到。如果使用 `:paste` 的过程变得有些难以控制，你可以使用 Scala REPL 的 `:load` 函数。只需 `:load` 该文件即可。最终结果将类似于使用你在图\
  \ 5-1 中学到的 `-i <file>`。\n\n现在，你已经正式完成了从 MySQL 到 Spark 再返回的完整往返！请为自己鼓掌，并退后一步，思考一下你刚刚完成的所有工作。考虑到我们最初的目标是创建一个命令行工具，使用户能够运行即席\
  \ SQL 查询，并且几乎完成了除此之外的所有其他工作，我们现在应该先完成这个目标，然后再继续前进。\n\n利用你在本练习中学到的所有知识，你可以扩展之前的 `connect-jdbc.scala`\
  \ 示例，使其能够通过命令行接收 SQL 查询。使用清单 5-14 中的应用程序启动命令来指导你创建命令行 SQL 应用程序。这个最终练习的代码位于 `examples`\
  \ 目录下的 `/path/to/ch-05/docker/examples/jdbc-adhoc-query.scala`。\n\n```\n$SPARK_HOME/bin/spark-shell\
  \ \\\n--conf \"spark.jdbc.driver.class=com.mysql.cj.jdbc.Driver\" \\\n--conf \"\
  spark.jdbc.host=127.0.0.1\" \\\n--conf \"spark.jdbc.port=3306\" \\\n--conf \"spark.jdbc.default.db=default\"\
  \ \\\n--conf \"spark.sql.query=select id, first_name, email from customers where\
  \ email LIKE '%coffeeco%' ORDER BY email ASC LIMIT 3\" \\\n--conf \"spark.jdbc.user=dataeng\"\
  \ \\\n--conf \"spark.jdbc.password=dataengineering_user\" \\\n--jars=spark/jars/mariadb-java-client-2.7.2.jar,spark/jars/mysql-connector-java-8.0.23.jar\
  \ \\\n-i examples/jdbc-adhoc-query.scala\n清单 5-14\n用于查询表的命令行驱动 Shell 脚本\n```\n\n\
  清单 5-14 中的应用程序配置属性将 `connect-jdbc.scala` 引入的 `spark.jdbc.table` 配置属性替换为 `spark.sql.query`。此更改考虑到了\
  \ Spark 中 JDBC `DataFrameReader` 的工作方式。你可以传入以下两个连接属性之一——`dbtable` 或 `query`——但不能同时传入两者。有关参数的完整列表，请返回表\
  \ 5-1。\n\n尝试创建可工作的 Spark 部分应用程序，以运行清单 5-14 中基于 `spark-shell` 的应用程序。请记住，在现实世界中，你可能希望将数据库用户操作限制为只读，并且根据表的大小，你可能还需要为查询添加默认限制。你不会希望有人触发像\
  \ `` DROP DATABASE `default` `` 这样的查询。\n\n**提示：** 任何使用 `spark-shell` 命令启动的应用程序都会等待（或挂起），直到你手动退出应用程序。这是由于\
  \ REPL 中循环的性质所致。如果你想自动退出 `spark-shell`，作为应用程序的最后一步，你可以使用 `sys.exit(0)` 正常退出程序。如果执行过程中出现问题，例如查询格式错误，那么\
  \ `spark-shell` 将抛出异常并退出。对于命令行应用程序，通常使用零表示成功，非零值表示操作不成功。可以将其视为 HTTP 状态码。\n\n###\
  \ 练习 5-2：总结\n\n本练习涵盖了很多内容，不仅向你介绍了如何将 JDBC 与 Apache Spark 结合使用，还介绍了使用复合文件和 `spark-shell`\
  \ 进行迭代开发的强大功能。虽然在 `spark-shell` 上使用复合应用程序模式并非旨在为生产应用程序提供支持，但它确实使你作为工程师能够将问题分解为一系列逻辑步骤，并从\
  \ `spark-shell` 或像 Apache Zeppelin 这样的其他交互式开发环境中获得近乎即时的反馈。这种将问题迭代分解为其逻辑部分的过程对于数据工程师、软件工程师或任何处理复杂问题解决的人来说都至关重要。\n\
  \n在最纯粹的形式中，我们在练习 5-1 和 5-2 中实际上将关注点分离到了逻辑 Docker 容器边界。你学会了直接在数据库（MySQL Docker 容器）中创建表，并手动插入行以创建一个基础的\
  \ MySQL 表，供 Apache Spark 读写。你学会了利用 `spark-shell` 的优势，添加动态运行时依赖项和自定义配置。你甚至可以说你已经开始编写可重用代码，即使这些代码被拆分到由\
  \ `spark-shell` 驱动的复合应用程序中的几个单独文件中。\n\n## 继续探索\n\n**注意：** 本节是可选的，涵盖了一些更高级的过程。你可以跳过本节，稍后再回来阅读。\n\
  \n章节练习都假设我们必须处理定义不佳的 `customers` 数据库表模式。*是的，它并不好！* 我们可以做得更好。考虑到我们目前可以向数据库添加几乎无限数量的重复项。这确实不是一个好的设计，尤其是在\
  \ MySQL 支持约束的情况下。我提供这些继续探索作为额外的思考素材，并深入一些更高级的领域，包括表截断和列级去重技术。\n\n**注意：** 标题为“5_2_MySQLAndSpark”的笔记可以从\
  \ Zeppelin UI 运行。其中包含使用 JDBC 连接器进行读取和写入的额外步骤和扩展说明（`http://localhost:8080/#/notebook/2G1SGWZBW`）。\n\
  \n\n\n### 好的模式设计带来更优方案\n\n如果我们能为 `customers` 表设计一个更好的模式，结果会怎样？它能让我们的工作更轻松吗？清单 5-15\
  \ 展示了 `bettercustomers` 表的 `create table` 语法。\n\n```\nCREATE TABLE IF NOT EXISTS\
  \ `bettercustomers` (\n`id` mediumint NOT NULL AUTO_INCREMENT COMMENT '客户自动编号',\n\
  `created` timestamp DEFAULT CURRENT_TIMESTAMP COMMENT '客户注册日期',\n`updated` timestamp\
  \ DEFAULT CURRENT_TIMESTAMP COMMENT '最后记录更新时间',\n`first_name` varchar(100) NOT NULL,\n\
  `last_name` varchar(100) NOT NULL,\n`email` varchar(255) NOT NULL UNIQUE,\nPRIMARY\
  \ KEY (`id`)\n);\n清单 5-15\nbettercustomers 表的修改版建表语法\n```\n\n你可能会立刻想到，对 `email`\
  \ 字段添加 `UNIQUE` 约束是个好主意。不是吗？或许你注意到我们现在有了自动“单调”递增的行号，这是朝着正确方向迈出的一步？又或者是因为我们在表定义中加入了列级注释？实际上，所有这些答案都是正确的。通过定义良好的表结构，我们可以依赖数据库来处理部分核心业务逻辑，比如存储下一个客户\
  \ ID 以及防止重复数据。这能腾出更多时间来专注于解决应用程序中的其他问题。\n\n使用 Zeppelin 笔记（`5_2_MySQLAndSpark`），你可以逐步完成以下示例。首先从修复\
  \ `customers` 表开始。这包括如何仅使用表模式中的非默认列来创建 `bettercustomers` 表并写入初始行，以及其他操作。这意味着只需要\
  \ `first_name`、`last_name` 和 `email` 这三列。\n\n注意\n\n对于这些附加练习，你需要通过 MySQL 控制台创建 `bettercustomers`\
  \ 表。请按照笔记本中的说明，或运用本章所学知识，根据清单 5-15 中的表定义来创建新表。\n\n### 使用最小模式写入客户记录\n\n清单 5-16 中的段落展示了一种向\
  \ `bettercustomers` 表添加客户的简化方法。该代码流程基于清单 5-11，并省去了手动指定时间戳的步骤。这种技术更为高级，它显式地忽略了某些可能随时变化、从而在未来引发问题的特定列。你可以按照章节说明，使用\
  \ Apache Zeppelin 运行此代码。\n\n```\n%spark\nimport org.apache.spark.sql.types._\nimport\
  \ org.apache.spark.sql._\nval simpleFieldNames = Set(\"first_name\", \"last_name\"\
  , \"email\")\nval simpleSchema = StructType(\nbetterCustomers.schema.fields.filter(sf\
  \ => simpleFieldNames.contains(sf.name)))\nval saveMode = \"append\"\n// 创建简化的行！\n\
  val rows = spark.createDataFrame(\nspark.sparkContext.parallelize(\nSeq(\nRow(\"\
  Nanna\",\"Haines\",\"nhugs@coffeeco.com\"),\nRow(\"The\",\"Rock\",\"djohnson@coffeeco.com\"\
  ))),\nsimpleSchema)\nrows\n.write\n.format(\"jdbc\")\n.mode(saveMode)\n.options(MapString,\
  \ String)\n.save()\n清单 5-16\n利用数据库表约束和默认值，可以直接从 Spark 向远程数据库写入稀疏行，从而降低带宽传输成本\n```\n\
  \n这难道不令人兴奋吗！同样令人兴奋的是，这个查询可能引发的问题。没有什么比一个老掉牙的麻烦更能破坏你辛苦付出、自以为大功告成的努力了。\n\n实话实说——你刚刚运行的查询*就是一场等待发生的灾难*。你可能会问，这是为什么？问题源于\
  \ `SaveMode` 值被存放在一个变量中。作为工程师，我们喜欢做的一件事就是简化问题，而这通常意味着以更配置驱动或基于库的方式编写核心组件（就像 Spark\
  \ 社区编写 JDBC 连接器那样）。对于清单 5-16 中的简单用例，这意味着有人可能会天真地将 `SaveMode` 的值改为 `overwrite`，对于\
  \ JDBC 的 `DataFrameWriter` 来说，这会删除当前表，并用写入的 DataFrame 内容重新创建表。考虑到我们刚刚花费时间和精力定义并创建了表定义，这将导致灾难性的后果。\n\
  \n此外，新表将被替换为仅包含行 DataFrame 中的三列（`first_name`、`last_name` 和 `email`）。本质上，我们本想让生活更轻松——在这个例子中是通过使用最小模式插入新行——但我们却可能因此引入了一个关键缺陷，并让任何关键的生产数据库表都面临一场等待发生的灾难。哎呀！更糟糕的是，之后数据库中只会存在清单\
  \ 5-16 中的两条记录。\n\n好消息是，如果你的意图确实是覆盖 `bettercustomers` 表，你可以通过在 JDBC 的 `DataFrameWriter`\
  \ 上添加 `truncate` 选项来保留现有的表定义。该选项会保持清单 5-15 中的原始表语法不变。更新后的 JDBC 配置如清单 5-17 所示。\n\n\
  ```\nrows\n.write\n.format(\"jdbc\")\n.mode(saveMode)\n.options(MapString, String)\n\
  .save()\n清单 5-17\n使用 Truncate 保留表定义\n```\n\n这样就好多了。在接下来的探索中，你将学习如何处理由定义不佳的 `customers`\
  \ 模式所引入的问题。你也可以依赖*截断（truncation）*来解决下一个问题。不过，这里有一个有趣的陷阱。那么，请继续阅读，祝你好运！\n\n### 对表进行去重、重新排序和截断\n\
  \n在这个延续的练习中，你需要想出一种方法来对 `customers` 数据库表中存储的记录进行去重、重新排序和截断。这个练习教你如何处理固定的、有问题的模式以及一般的数据。对于这个用例，你不能简单地修改\
  \ `customers` 数据库表的模式。当对清单 5-2 中的原始 `customers` 表模式应用 *保存 + 追加* 操作时，存在一个小问题。由于*表模式上没有声明任何约束*，如果你简单地命令\
  \ Spark 写入，它会愉快地一遍又一遍地写入重复的行。仅使用 JDBC 连接器且没有基于 RDBMS 的约束时，Spark 没有现成的方法来忽略写入数据库时的重复行。\n\
  \n正如你在“好的模式设计带来更优方案”探索中所看到的，重复记录的拒绝可以通过约束来处理。然而，简单的 `customers` 表可以拥有无限数量的重复记录。为了了解创建大量重复记录是多么简单，请尝试在你启动的活跃\
  \ `spark-shell` 中（如清单 5-4 所示）运行 `:load examples/save-jdbc.scala` 几十次，以创建大量重复数据。\n\
  \n现在来解决这个问题。你可以使用以下技术来帮助你完成。\n\n\n\n#### 删除重复行\n\n使用 `dropDuplicates` 函数可以有条件地删除\
  \ DataFrame 中的重复行。该函数仅保留由唯一列值标识的第一行，并忽略其他重复项。例如：`df.dropDuplicates(\"id\")`。\n\n\
  若希望对重复行的选择拥有更多控制权，可以结合分组子句与 distinct min/max 运算符，例如仅选择创建日期最早且更新日期最新的行。这种使用聚合函数进行预处理的技巧，在读取和处理变更数据捕获（CDC）日志时非常有用。您可以参考\
  \ Zeppelin 中名为“Select Distinct and Sort”的段落，查看交互式示例。\n\n#### 使用 Order By 排序\n\n\
  通过 `ORDER BY` 子句对临时 `customers` 视图进行排序，或直接在 DataFrame 上使用 `sort` 函数，可以对数据集中的记录进行重新排序。例如：`df.sort(asc(\"\
  id\"))`。\n\n#### 截断 SQL 表\n\n截断表会清除所有已提交的记录，即所有已写入数据库预写日志（WAL）并被 RDBMS 确认的行。这类似于调用\
  \ `DELETE FROM customers` 而非 `DROP TABLE customers`，在必要时比直接删除物理表更优。您已在清单 5-17 中了解了截断表的\
  \ JDBC 选项。\n\n请记住，删除整个表可能会破坏依赖该表的其他应用程序。\n\n警告\n\n请谨慎使用表截断操作，因为当您执行全表*覆盖*时，可能会误删表中的所有数据。\n\
  \n#### 暂存与替换\n\n考虑一下，当您需要覆盖整个表以进行去重或修复损坏条目时，如何在执行实际覆盖操作之前存储表的当前快照。Apache Spark 允许您使用\
  \ DataFrame 的 `saveAsTable` 函数存储数据集的持久化快照。该方法利用 Hive Metastore 和分布式文件系统来存储可靠的（持久化）备份。然后，您可以使用该持久化表保存去重排序后的表，再截断物理表本身，并用暂存的（持久化）记录进行替换。您将在下一章学习如何使用\
  \ Hive Metastore。\n\n注意\n\n问题的完整解决方案位于 `/ch-05/docker/examples/deduplicate-reorder-truncate.scala`。我建议您在查看答案之前先尝试各种方法并探索可能的解决方案。祝您顺利！\n\
  \n## 本章小结\n\n本章教您如何仅依靠原生 JDBC 驱动程序、JDBC `DataFrameReader` 和 `DataFrameWriter`，完成从\
  \ MySQL 到 Spark 再返回的完整数据往返流程。如果您将使用 `spark-shell` 编写复合应用程序的过程与使用 Apache Zeppelin\
  \ 的体验进行比较，那么您可能会清楚地发现，复合（部分）应用程序提供了另一种快速开发的途径。它使您能够再次重用相同的基于 Docker 的开发环境，自主选择数据工程探索之路！\n\
  \n在下一章中，您将学习如何使用 Apache Hive Metastore。您将设置、配置并运行完全由基于 Docker 的 MySQL 数据库支持的 Metastore。您将看到\
  \ Metastore 如何简化数据发现过程，并支持在 Spark 应用程序上下文中进行数据探索。您将了解 Hive Metastore 如何引入使用数据库表的新方式，以及如何保护您的数据源存储，并在多个\
  \ Spark 应用程序之间提供文档和共享表定义。\n\n准备好了吗？\n\n"
- "# 6. 数据发现与 Spark SQL 目录\n\n能够连接并处理大多数公司现代技术栈中包含的数据系统和服务，是数据工程师的一项关键技能。幸运的是，Spark\
  \ 提供了处理和转换数据的机制，使您能够采取行动并解决问题，而无需编写和维护另一套自定义基础设施代码。通过依赖 Spark 的核心能力，您学会了利用 JDBC\
  \ 的强大功能与传统数据库中存储的数据进行互操作。访问任何兼容 JDBC 的 RDBMS，使您能够一次性编写 SQL 查询，这意味着您无需为支持具有不同业务逻辑的独立应用程序而烦恼。\n\
  \n本章延续了第 5 章的学习内容。这将是我们首次探讨如何结合使用数据湖和关系数据库来填充 *Spark SQL 目录* 的内容。此过程使您能够为数据源添加丰富的元数据注释，这些元数据描述了\
  \ Spark 应用程序生成的表。这些上下文信息详细说明了数据管道的输入和输出格式，还可以扩展用于自动生成*数据血缘*图，或用作内部乃至外部*数据目录*的通用数据可发现性服务。这不仅对您和您的团队至关重要，对数据组织中任何希望重用或分析\
  \ Spark 作业输出数据的其他成员也同样宝贵。\n\n在本章的最后，我们将通过扩展之前的练习，使用 Spark 的强类型数据集，来了解 Spark 如何优化您的转换流程。这个最终练习将向您介绍\
  \ Spark 如何编码应用程序代码的意图，并通过内部的 Catalyst 优化器，神奇地生成并优化从开始到结束运行应用程序所需的逻辑执行阶段。\n\n本章分为以下几个部分：\n\
  \n* Hive Metastore 与 Spark SQL 目录\n* Catalyst 优化器\n* Spark 数据集\n\n练习内容\n\n您可以在本书\
  \ GitHub 仓库的 `ch-06/` 文件夹中找到本章所需的材料，地址为 [`https://github.com/newfront/spark-moderndataengineering`](https://github.com/newfront/spark-moderndataengineering)。只需使用运行脚本启动环境，然后访问\
  \ `http://localhost:8080` 即可。\n\n```\ncd ch-06/docker && ./run.sh start\n```\n\n\
  ## 数据发现与数据目录\n\n在上一章中，我们探讨了在 Apache Spark 中通过 JDBC 连接数据库（RDBMS）是多么容易。虽然我们能够连接到为练习而启动的数据库，但有一个主要问题可能会在日后造成麻烦。这个障碍具体是：如果事先不了解数据库的位置、数据库中物理表所代表的数据类型，以及这些数据在底层表模式中的表示方式，那么简单的数据发现行为几乎就不存在。然而，数据发现实际上是数据驱动型企业成功的关键，作为数据工程师，这确实应该引起您的重视。\n\
  \n### 数据目录为何重要\n\n数据发现可能看起来不是我们当前需要立即关注的问题，因为本书上下文中我们正在处理的数据，仅代表一家虚构公司初始客户数据库中的少量客户、少量咖啡品牌及一些基本元数据（以浓度表示的烘焙程度）、少量门店以及白天每家门店客流量的部分信息。然而，在现实世界中，数据发现问题是一个更为重大的关切。让我为您描绘一下这个场景。\n\
  \n\n\n### 数据的一厢情愿\n\n随着任何公司的发展，新员工的加入自然会导致小团队扩张。随着团队持续壮大，在某个节点上，团队自然会发生分叉，再次拆分成更小的团队，并拥有更具体的职责范围和关注领域。由原团队成员组成的新团队，会随着公司的有机增长而继续这种成长与分裂的循环。在一段时间内，团队可以依赖部落知识，或者依赖在公司长期积累但文档记录不足的流程，而跨团队沟通使得团队能够直接分享部落知识、数据位置、表结构和原始数据格式。\n\
  \n出于某种原因，许多初创公司，甚至一些非常成熟的公司，都陷入了这样一种想法：在云时代，团队能够更加敏捷、快速行动，甚至打破常规，以跟上令人目眩的创新步伐。这样一来，工程师和产品经理很容易跳过或忽视详尽文档和软件测试这一至关重要的步骤。这种做法不言而喻的副作用是，技术债务很容易堆积，成为难以启齿的隐患。这是为了公司持续向前发展而必须承担的风险！不幸的是，历史往往会重演，这种高额的技术债务可能导致流程和模式迅速变得不可持续。\n\
  \n随着公司发展壮大、收购新公司、工程师更替、部门重组，以及其他跨团队/跨项目数据平台的出现，过去依赖部落知识，或者期望团队等待核心团队成员回复 Slack 消息、加入视频会议，甚至亲自到场，来引导新团队了解过时流程的做法，会变得对公司及其员工的福祉有害。在处理数据时，清晰的文档和已建立的跨职能工作方式显得尤为重要。\n\
  \n对于数据团队而言，依赖手动沟通数据模式变更，或者玩那种古老的“传话游戏”（你知道的，鲍勃告诉爱丽丝，爱丽丝又告诉我，X 团队正在更改他们的数据格式），会带来巨大的成本和进展阻碍。不可靠的流程在压力下会迅速崩溃，其副作用是，将原本核心、可靠的数据变成了不可靠、不可信的数据。对某个数据库表的模式，或数据湖中记录的原始格式的变更沟通不足，将导致生产中断，因为团队可能甚至不知道谁依赖于他们的数据，或者谁会受到上游破坏性变更的影响。中断意味着人们会生气，然后开始互相指责。这是一个转折点，一个分岔路口，也是当公司达到一定规模时，数据平台、集中化流程和其他“做事方式”出现的原因之一。\n\
  \n### 数据目录来救场\n\n幸运的是，在公司内部环境之外，存在着标准的做事方式。就像大多数设计模式一样，人们遵循它们是因为它们可以节省时间，并避免在事情崩溃时遭受打击带来的潜在痛苦。我之前描绘的画面，是当公司内部核心数据层的信任崩溃时可能发生的最坏情况。事实是，数据文档与任何\
  \ API 文档同等重要。这些基于元数据的数据定义代表并充当了一个集中式契约，规定了如何、何时以及为何消费和使用表中存储的数据。而实现这一目标最广泛使用的标准方法之一，就是使用\
  \ Apache Hive Metastore。\n\n## Apache Hive Metastore\n\n`Hive Metastore` 最初是为了提供重要的元数据而构建的，这些元数据可用于简化不同团队处理其数据湖中分布式数据的方式。这些伪表定义映射了关键缺失的信息，包括与存储在这些分布式\
  \ SQL 表中的数据进行互操作所需的模式、分区、编码器和解码器。\n\n这些元数据在运行时被用作粘合剂，使 [Apache Hive](https://cwiki.apache.org/confluence/display/Hive/Home)\
  \ 能够对存储在 HDFS 中的数据运行类似 SQL 的分布式查询。回顾第 1 章，我们讨论了分布式文件系统、数据管道和 ETL 的出现。曾几何时，对于使用 MapReduce\
  \ 编写和维护 ETL 作业的数据工程师来说，Apache Hive 简直是天赐之物。\n\n大数据实际上只是一种用于存储、处理和查询大规模分区且完全分布式数据的技术，这些数据无法放入传统的\
  \ SQL 数据库中。Hive 提供了一种机制，让人们可以像对待传统数据库那样对待这些分布式文件系统，即将其视为带有模式的表。这使得数据工程师能够专注于将数据摄入\
  \ HDFS 的管道、将数据表示为具有代表性数据结构和模式的表，以及将所有这些信息汇总到每个分布式 Hive 表的表定义中的数据血缘信息。\n\n这些表元数据存在于\
  \ `Hive Metastore` 中，并提供了描述每个 Hive 表的谁、什么、哪里和为什么的关键信息。此外，元数据存储使有权限访问它的团队能够发现新表，并找到重用此分布式数据仓库中可用数据的新途径。所有这一切都无需依赖大量的跨团队沟通、冗长的会议和分享部落知识，就能开始高效工作。\n\
  \n### 具有现代风格的元数据\n\n如今，`Hive Metastore` 依然健在且运行良好，但其用途已与最初设计有所不同。现在，典型的做法是运行元数据存储，却从未打算使用\
  \ Hive 本身。这种变化可以被视为一种演进，它与现代数据技术栈中的其他变化同步发生。基于云的分布式对象存储（如 Amazon S3 和 Azure Blob\
  \ Storage）的日益普及，使得行业焦点从 Hadoop 和 HDFS 转移开来。\n\n类似的迁移也发生在公司身上，它们正在远离许多较老的 Hadoop\
  \ 技术，比如 Hive 本身。在第 2 章中，你了解到 Spark 是如何从 MapReduce 成功的精华中诞生的。它改变了核心执行模型，以在内存中重用计算，并允许对同一数据进行多次迭代，而无需显式返回数据源，这本身就是一次自然的技术演进。\n\
  \n类似于回收利用的概念，生态系统只是重用了 MapReduce 的组件，但做了一些改变。Spark SQL 和 Hive 之间的关系也是如此。Spark SQL\
  \ 完全有能力作为一个功能完备的 SQL 引擎运行，并且正如你即将亲身体验的那样，它也可以利用 `Hive Metastore`。虽然它可以与 Hive 互操作，但它自己也能运行得很好。\n\
  \n\n\n### 练习 6-1：使用 Hive Metastore 增强 Spark SQL\n\nHive Metastore 为描述表的位置、数据编码（例如\
  \ Parquet、ORC）、列式模式以及统计信息提供了单一可信源，旨在实现数据民主化，供数据工程师、分析师、机器学习工程师和数据科学家等人员使用。借助 Metastore，人们无需四处询问或大海捞针就能找到数据集！\n\
  \n下一节将引导您完成启动并运行 Hive Metastore 所需的五个简单步骤。与上一章的练习类似，您可以使用章节源材料实时运行所有内容。\n\n**引导选项**\n\
  \n`run.sh` 提供了一个引导选项。如果您只想引导此环境而不关心所有曲折细节，我保证我不会介意。标题为“6_1_HiveMetaStore”的 Apache\
  \ Zeppelin 笔记以 *Bootstrap the Environment* 开头，它将引导您完成命令和设置。您可以跳到 Spark SQL Catalog\
  \ 部分，稍后再回到本节以获取有关初始化数据库表、用户权限和 Spark 配置的更多信息。\n\n#### 配置 Hive Metastore\n\n配置 Hive\
  \ Metastore 需要几个步骤，让我们从让它在 Spark 上下文中工作开始。幸运的是，这些步骤相当简单：\n\n1.  创建 `metastore` 数据库。\n\
  2.  授予您的 MySQL 用户对该数据库的访问权限。\n3.  创建数据库表。\n4.  配置 Spark 环境以访问 metastore。\n5.  为\
  \ Spark 环境提供 Hive 依赖项。\n\n这些步骤应该不会太多。实际上，Spark 能够运行 Hive Metastore，而无需运行任何额外的服务（或容器）。唯一真正的要求是您已初始化数据库和表，并已授予您的\
  \ Spark `dataeng` 用户对数据库的访问权限。\n\n#### 创建 Metastore 数据库\n\n为了简化在完成实际 metastore 数据库创建后初始化\
  \ Hive Metastore 表的过程，表定义 SQL 文件已提供在章节的 `exercise` 目录中。`docker file copy` 命令已包含在\
  \ `run.sh` 中。命令行参数 `hiveInit` 将代表您将必要的文件复制到正在运行的 `mysql` 容器中。只需执行清单 6-1 中的命令即可。\n\
  \n```\ncd /path/to/ch-06/docker &&\n./run.sh start &&\n./run.sh hiveInit\n清单 6-1\n\
  启动章节练习环境并初始化 Apache Hive Metastore\n```\n\n`hiveInit` 命令将运行以下两个 Docker `copy` 命令。\n\
  \n```\ndocker cp hive/install/hive-schema-2.3.0.mysql.sql mysql:/\ndocker cp hive/install/hive-txn-schema-2.3.0.mysql.sql\
  \ mysql:/\n```\n\n##### 连接到 MySQL Docker 容器\n\n使用以下 `docker exec` 命令登录到容器上下文。\n\n\
  ```\ndocker exec -it mysql bash\n```\n\n##### 以 root 用户身份认证 MySQL 用户\n\n登录到本地 MySQL\
  \ 容器后，使用 `mysql` shell 以 MySQL root 用户身份进行认证。\n\n```\nmysql -u root -p\n```\n\n\
  `MYSQL_ROOT_PASSWORD` 值可以在 `ch-06/docker/docker-compose-all.yaml` 中找到。\n\n#####\
  \ 创建 Hive Metastore 数据库\n\n进入 `mysql` shell 后，继续创建 `metastore` 数据库。\n\n```\nmysql>\
  \ CREATE DATABASE `metastore`;\n```\n\n现在数据库已创建，是时候授予您的 Spark `mysql` 用户访问权限了。\n\
  \n##### 授予对 Metastore 的访问权限\n\n授予 `dataeng` 用户对 `metastore` 数据库的访问权限。\n\n```\nREVOKE\
  \ ALL PRIVILEGES, GRANT OPTION FROM 'dataeng'@'%';\nGRANT ALL PRIVILEGES ON `default`.*\
  \ TO 'dataeng'@'%';\nGRANT ALL PRIVILEGES ON `metastore`.* TO 'dataeng'@'%';\nFLUSH\
  \ PRIVILEGES;\n```\n\n**提示**\n\n通常的做法是创建特定于用例的用户来管理对 Hive Metastore 数据库的访问。应根据应用程序的访问模式，授予用户对\
  \ metastore 的读/写或只读访问权限。许多应用程序仅消费数据，并将表数据复制到 Hive Metastore 上下文之外的不同位置。请记住，数据访问是一种特权！\n\
  \n您现在已完成 `root` 用户会话。您应该退出此会话，并以 `dataeng` MySQL 用户身份重新登录。\n\n```\nmysql> exit\n\
  ```\n\n#### 创建 Metastore 表\n\n我们即将完成 metastore 的设置。接下来要做的是创建底层的 Hive Metastore 表本身。配置\
  \ metastore 数据库表需要一次性设置成本。幸运的是，我们可以直接将表定义导入到 `mysql` 控制台中。\n\n##### 以 dataeng 用户身份认证\n\
  \n在 MySQL 容器上下文中，将您的认证 MySQL 用户更改为 `dataeng`。\n\n```\nmysql -u dataeng -p\n```\n\
  \n##### 切换到 Metastore 数据库\n\n```\nmysql> use metastore;\n```\n\n##### 导入 Hive Metastore\
  \ 表\n\n`SOURCE` 命令可用于轻松读取和应用适用于我们 Hive 版本（v2.3.0）的 SQL 表配置命令。此文件在 `mysql` Docker\
  \ 容器中可用，因为您在设置过程的早期使用了 `hiveInit` 命令。\n\n```\nmysql> SOURCE /hive-schema-2.3.0.mysql.sql;\n\
  ```\n\n就是这样。您现在是一个全新安装的 Hive Metastore 的快乐拥有者。如果您想查看在此过程中初始化了哪些表，可以从当前的 MySQL 会话运行以下命令。\n\
  \n```\nuse metastore;\nshow tables;\n```\n\n运行 `show tables` 命令将产生一长串表名（超过 50 个）。您可以随意使用\
  \ `DESCRIBE` 命令查看任何表以获取更多上下文，或者直接退出控制台。现在，您的 metastore 已准备好投入使用。接下来，我们将添加 Spark\
  \ 访问 Hive Metastore 所需的配置。\n\n#### 配置 Spark 以使用 Hive Metastore\n\nHive Metastore\
  \ 传统上通过 `hive-site.xml` 进行配置。Spark 会自动在 `$SPARK_HOME` 目录下的 `conf` 目录中查找此配置文件。此文件及其他文件已为您预先配置好，并可在\
  \ `ch-06/docker/spark/conf/` 目录下的 `exercise` 文件中找到。\n\n如果您现在不想查看配置，可以跳过本节，直接转到 Spark\
  \ SQL Catalog。\n\n##### 配置 Hive Site XML\n\n`hive-site.xml` 文件仅包含四个属性。它们为 Spark\
  \ 提供了将在您的应用程序中使用的 Hive Metastore 数据库的默认连接属性。这些属性如表 6-1 所示。\n\n**表 6-1** Hive Metastore\
  \ 配置选项\n\n| 属性 | 描述 |\n| --- | --- |\n| `javax.jdo.option.ConnectionURL` | 定义到您的\
  \ metastore 的 JDBC 连接 URL。 |\n| `javax.jdo.option.ConnectionDriverName` | 定义用于连接到\
  \ metastore 的 JDBC 驱动 `ClassName`。 |\n| `javax.jdo.option.ConnectionUserName` |\
  \ 定义 metastore 数据库用户名。 |\n| `javax.jdo.option.ConnectionPassword` | 定义 metastore\
  \ 用户的密码。 |\n\n官方 Hive 文档中提供了更多配置选项，包括对共享 Hive Metastore 的不同访问模式。这些包括运行完全独立的 Hive\
  \ Metastore 服务器（v3.x 及以上版本）以及 *Hive Thriftserver*，以及如何为域分片提供多个 thrift URL，这有助于减少因过多连接到单个\
  \ Hive Metastore 实例而导致的拥塞。由于 metastore 是无状态的，这意味着服务本身不存储物理状态，您可以简单地创建多个前端服务，以便对\
  \ thrift 服务器的连接进行负载均衡，然后连接到底层的 metastore 数据库。\n\n\n\n### 配置 Apache Spark 以连接到外部\
  \ Hive Metastore\n\n您刚刚了解到 Apache Spark 使用 `hive-site.xml` 文件连接到 Hive Metastore。练习开始时我们没有提到的是，所有必需的配置都已为您提供在练习的\
  \ `conf` 目录中。然后，该目录通过 `docker-compose-all.yaml` 文件挂载到 Docker 环境中。\n\n这意味着您无需将任何文件复制到\
  \ `$SPARK_HOME` 位置。打开 Docker Compose 文件 `/ch-06/docker/docker-compose-all.yaml`，查看\
  \ `services:zeppelin:volumes` 部分以了解更多详情。\n\n在 `ch-06/docker` 目录的上下文中，以下三个目录被挂载为卷：\n\
  \n- `/spark/conf` – 此目录包含 `spark-defaults.conf` 和 `hive-site.xml`。\n- `/spark/jars`\
  \ – 此目录包含我们启动 Spark 时希望在本地包含的所有 MySQL JDBC 驱动程序 JAR 包。\n- `/spark/sql` – 此目录被挂载，以便我们可以将其用作\
  \ Spark SQL Warehouse 的根目录。\n\n`spark-defaults.conf` 文件是一个可选文件，可用于覆盖在该 Spark 安装上下文中运行的*所有\
  \ Spark 作业*的默认 Spark 配置值。对于当前的用例，我们只关心表 6-2 中详述的七个属性。\n\n**表 6-2** Hive Metastore\
  \ 配置属性\n\n| Spark 属性名称 | 描述 | 示例 |\n| --- | --- | --- |\n| `spark.sql.warehouse.dir`\
  \ | 读取和写入分布式 SQL 表的默认位置。此位置可以位于本地文件系统或任何兼容 HDFS 的文件系统上。 | `hdfs://metastores/hive/`\
  \ `file:///spark/warehouse/` `s3a://your-bucket/hive/` |\n| `spark.sql.catalogImplementation`\
  \ | 定义 Spark 会话的后端 SQL 目录。 | `hive` |\n| `spark.sql.hive.metastore.version` | 定义\
  \ Metastore 的 Hive 版本。 | 2.3.7 |\n| `spark.sql.hive.metastore.jars` | 定义要加载到 Spark\
  \ 类路径中的 Hive JAR 包的位置。Spark 默认使用内置的 JAR 包。 | `builtin`、`maven` 或 `/path/to/the/jars`\
  \ |\n| `spark.sql.hive.metastore.sharedPrefixs` | 用于搜索和加载特定版本 Hive Metastore 的逗号分隔的类名前缀。\
  \ | `com.mysql.cj.jdbc`、`com.mysql.jdbc`、`org.postgresql` |\n| `spark.sql.hive.metastore.schema.verification`\
  \ | 如果设置为 `true`，则 Spark Metastore 版本必须与 Hive Metastore 中 `VERSION` 的值匹配。 | `true`\
  \ |\n| `spark.sql.hive.metastore.schema.verification.record.version` | 如果设置为 `true`，Spark\
  \ 将针对 Hive Metastore 中发布的内容强制执行记录级模式验证。 | `true` |\n\n表 6-2 中描述的配置已在章节练习的 `spark-defaults.conf`\
  \ 文件中预先配置。为简单起见，我们使用标准的 Hive 内置 JAR 包（撰写本文时为 v2.3.7）。\n\n### 使用 Hive Metastore 进行模式强制\n\
  \n值得指出的是，Hive Metastore 可以作为写入分布式表的应用程序之间任何模式争议的可靠仲裁者。这意味着不良数据不会污染您的数据湖。这是使用 Hive\
  \ Metastore 的众多原因之一。此选项通过 `spark.sql.hive.metastore.schema.verification.record.version`\
  \ 设置进行配置（如表 6-2 所述）。\n\n> **注意：** 您可以使用表 6-2 中的配置升级与 Spark 一起使用的 Hive Metastore\
  \ 版本。具体来说，使用 `spark.sql.hive.metastore.jars` 和 `spark.sql.hive.metastore.version`\
  \ 属性。您可以从官方 [Apache Hive 网站](https://hive.apache.org/downloads.html) 下载所需的 Hive\
  \ Metastore JAR 包，以运行替代版本的 Hive Metastore。\n\n### Spark 默认配置\n\n`spark-defaults.conf`\
  \ 文件中定义的默认值使我们能够“一次定义”特定的集群范围设置，这些设置将自动应用于在默认值上下文中启动的任何 Spark 应用程序。在我们的案例中，这意味着在\
  \ Zeppelin 环境中启动的任何应用程序。可以使用应用程序级覆盖或在应用程序启动时提供显式配置 `--conf` 值来显式覆盖默认值。\n\n#### 使用\
  \ Spark 默认值保护集群\n\n您可以将默认配置值视为*重要的通用设置*，这些设置提供给您的 Spark 应用程序，以利于应用程序运行时并保护集群中运行的其他应用程序。\n\
  \n例如，如果您正在管理或运行自己的 Spark 集群，您很可能需要平衡运营成本，并且通常会部署一个固定大小的集群，该集群考虑了将按日或按小时运行的应用程序的需求。此外，您还需要考虑这些是批处理应用程序还是流式应用程序，以及应用程序是\
  \ IO 密集型还是 CPU 密集型。然后，启动到集群中的每个应用程序都可以从集群总资源中获取固定或动态数量的资源（最小/最大份额）。如果所有应用程序都尊重其他应用程序资源的边界，那么这种策略可以很好地发挥作用。\n\
  \n#### 提供默认限制\n\n鉴于每个应用程序可以从共享集群资源中请求非固定数量的资源，至少可以说，集群管理可能很困难。尤其是当您期望数据管道中的每个作业都能运行时。因此，在设置应用程序可以消耗的资源总数的预定义限制时，采取高度防御性的措施变得非常重要，因为并非每个应用程序都需要相同数量的计算核心或\
  \ RAM 才能成功运行。这就是默认值发挥作用的地方。这里的妙处在于，应用程序所有者实际上需要了解某些配置的工作原理才能覆盖它们，根据我的经验，许多应用程序可以在默认的少量核心和\
  \ RAM 上正常运行。\n\n例如，如果您考虑常见的 T 恤尺码方法（S、M、L、XL），一个小型应用程序可能包含以下内容：\n\n```\nspark.cores.max\
  \ 8\nspark.executor.cores 1\nspark.executor.memory 1g\n```\n\n此配置会将一个应用程序固定到八个计算核心和八个运行\
  \ 1GB JVM 大小的执行器上。\n\n通过让其他应用程序所有者更容易地声明共享集群的一部分，或者在像 Kubernetes 这样更动态的环境中，有许多配置选项可以简单地抽象到默认值中。第\
  \ 14 章介绍了使用 Spark Standalone 部署应用程序，第 15 章介绍了使用 Kubernetes 部署应用程序。\n\n\n\n### 生产环境\
  \ Hive Metastore 注意事项\n\n使用外部 Hive Metastore 的好处在于，你的表定义将在 Spark SQL 会话之间持久保存。如果没有为\
  \ `SparkSession` 提供 `hive-site.xml`，则会使用 Derby 创建一个本地 Metastore。基于 Derby 的 Metastore\
  \ 不适用于生产环境，且只能与单个 `SparkContext` 配合使用，你可以将其理解为“单一位置”。\n\n同样值得指出的是，Hive Metastore\
  \ 并非直接与 MySQL 绑定。大多数常见的关系型数据库（MS SQL Server、MariaDB、Oracle 和 Postgres）也受支持。有关配置和使用其他外部关系型数据库的更多信息，你可以在线查看管理手册。\n\
  \n最后，为了运行生产级、高可用的 Metastore，必须防范任何单点故障，包括底层数据库本身。运行兼容 SQL/JDBC 的托管式云数据库，例如 [Amazon\
  \ Aurora DB](https://aws.amazon.com/rds/aurora/%253Faurora-whats-new.sort-by%253Ditem.additionalFields.postDateTime%2526aurora-whats-new.sort-order%253Ddesc)\
  \ 或 [Google Cloud Spanner](https://cloud.google.com/spanner)，为减少在没有资深 DBA 的情况下运营数据库时可能出现的故障提供了良好选择。如果你不具备自行运维的条件，建议使用任何具备监控、备份和自动故障转移功能的完全托管型关系型数据库，而不是自行搭建。\n\
  \n### 练习 6-1：总结\n\n这个初始练习引导你完成了引导 Hive Metastore 以创建外部、可靠的 Hive Metastore 的过程。现在你已经完成了\
  \ Hive Metastore 的引导、`hive-site.xml` 文件的配置以及 `spark-defaults.conf` 文件的准备，接下来可以专注于\
  \ Spark SQL Catalog，并学习如何使用外部 Hive Metastore 来驱动更可靠的 SQL 体验。\n\n## Spark SQL Catalog\n\
  \n*Spark SQL Catalog* 是 Spark 内部的 SQL 元数据管理器。Spark SQL Catalog 提供的功能为处理数据库、临时表或托管表、视图、函数等提供了资源。你刚刚了解了\
  \ Hive Metastore；Spark SQL Catalog 提供了简单的抽象，使你能够轻松地与 Hive Metastore 进行互操作。如前所述，确保你生成的数据以自文档化的方式呈现，以便其他团队能够按需获取数据，而无需再安排会议来理解\
  \ `wU35` 或 `l2W` 这些列的含义（当然，它们分别代表 35 岁以下女性和最近两周），这对于数据平台和组织目标的成功至关重要。显然，代号并不会让数据团队的工作变得简单。如果每个表定义都有模式支持，并且每个列不仅存储数据类型，还存储简短的注释，那么使用你表的其他工程师就可以通过\
  \ Spark SQL Catalog 以自助方式了解你的数据。\n\n### 练习 6-2：使用 Spark SQL Catalog\n\nSpark SQL\
  \ Catalog 可直接通过 `SparkSession` 访问，并提供了许多有用的方法来检查数据仓库和数据湖中可用的数据。\n\n**注意**\n\n请使用标题为“6_2_SparkSQLCatalog”的\
  \ Zeppelin 笔记跟随本练习。与之前的章节一样，在笔记中创建一个新段落，并使用 `%spark` 代码块来构建工作笔记。\n\n#### 创建 Spark\
  \ Session\n\n让我们学习从头开始创建 `SparkSession`。使用代码清单 6-2 中的代码片段，在你的 Zeppelin 笔记中创建一个新段落并运行它以生成\
  \ `SparkSession`。\n\n```\n%spark\nimport org.apache.spark.sql._\nval sparkSessionHive\
  \ = SparkSession.builder\n.master(spark.conf.get(\"spark.master\"))\n.config(spark.sparkContext.getConf)\n\
  .appName(\"hive-support\")\n.enableHiveSupport()\n.getOrCreate()\n代码清单 6-2\n创建支持\
  \ Apache Hive 的新 SparkSession\n```\n\n我们刚刚创建的 `SparkSession` 可用于进一步探索 Spark SQL\
  \ API。接下来，我们将通过一个有趣的探索过程来使用 `SparkSession`。鉴于我们在数据库（本地 MySQL 数据库）中有数据，第一个探索领域将是列出并查看可用的内容。\n\
  \n#### Spark SQL 数据库\n\n刚开始时，我们知道希望能够查找并找到可用的数据库。这个过程可以利用我们熟悉的老朋友 SQL，帮助我们站稳脚跟并理解\
  \ SQL Catalog 的功能。\n\n##### 列出可用数据库\n\n```\n%spark\nsparkSessionHive\n.sql(\"show\
  \ databases;\")\n.show\n```\n\n此方法允许我们查看可用的数据库。在我们的例子中，只有 `default` 数据库。你可能注意到了一条明显缺失的信息。你能发现它吗？也许问问自己\
  \ `default` 到底是什么意思？这是指上一章中我们命名为 `default` 的 MySQL 数据库，还是其他含义？\n\n要了解更多信息，你需要深入\
  \ Spark SQL Catalog，如代码清单 6-3 所示。\n\n```\n%spark\nsparkSessionHive\n.catalog\n.listDatabases\n\
  .show(truncate=false)\n代码清单 6-3\n使用 Spark SQL Catalog 列出数据库\n```\n\n运行代码清单 6-3 中\
  \ `listDatabases` 代码块的结果如表 6-3 所示。\n\n**表 6-3**  \n默认的 Spark SQL 数据库，即仓库\n\n| 名称\
  \ | 描述 | locationUri |\n| --- | --- | --- |\n| `default` | 默认 Hive 数据库 | `file:/spark/sql/warehouse`\
  \ |\n\n这说得通。当我们在本章前面配置 Hive Metastore 时，我们只提供了连接到 Metastore 的 JDBC 信息，而没有提供连接到实际\
  \ MySQL 数据库的信息，而该数据库恰好也被命名为 `default`。\n\n\n\n"
- '# 查找当前数据库


  当前数据库相当于使用 SQL 的 `use` 命令。这仅用于告知你 Spark 会话中当前激活的是哪个数据库。


  ```

  %spark

  sparkSessionHive

  .catalog

  .currentDatabase

  ```


  我们已经了解了如何列出和查看本地数据湖中存储的数据库。如果我们想创建一个新数据库，以便按团队名称或业务部门等维度来组织其下的表，该怎么做呢？


  使用数据库作为对单个团队所拥有的表进行分类的一种手段，是一种高效查看元存储中所有权归属的好方法。这种模式之所以重要，原因有很多，但主要归结为常见的文件系统最佳实践和设计模式。


  在 Hive 元存储中，数据库是与分布式“仓库”中某个物理目录相关联的路径前缀。数据库结构是一种限制对表集合的访问、识别一组表或单个表所有权的机制，它并不表示一个独立的物理数据库。


  如果所有团队都将其表共享在同一个 `default` 数据库位置，那么随着时间的推移，表名发生冲突的可能性会很高。更糟糕的是，你可能会因为用户错误和命名冲突而意外删除自己的表。因此，按数据库名称来区分团队或业务部门非常重要。此外，数据库前缀化也有助于缓解因读写容量问题而产生的故障。


  无论你是在 HDFS 上运行，还是使用像 S3 这样的云对象存储作为数据湖的分布式文件系统，为了横向扩展以支持更高的读写能力需求，最终都意味着文件系统应该能够使用路径前缀进行组合。对于
  HDFS，你可以设置一个 `NameNode`（可以将其视为协调节点，因为它了解分布式文件系统的路由工作原理）来使用[联合路由](https://hadoop.apache.org/docs/current/hadoop-project-dist/hadoop-hdfs-rbf/HDFSRouterFederation.html)，根据文件系统的路径前缀将入站请求路由到不同的
  HDFS 集群。你可以利用这种技术为大型和小型工作负载实现智能扩展（如果你正在运行自己的 Hadoop 集群）。对于 S3 和其他云对象存储，通常使用 base64
  编码的前缀，这可以在 S3 文件系统中实现动态分片（或分区），其中每个路径前缀都可以通过元存储或解析数据库进行查找和解析。


  现在，假设元存储的性能问题已经得到处理。你将学习如何创建一个数据库，该数据库将在分布式文件系统中映射为一个前缀绑定的目录。


  '
- '# 创建数据库


  在元存储中创建数据库可以按照清单 6-4 中的示例进行操作。


  ```

  %spark

  val dbName = "coffee_co_common"

  val dbDescription = "此数据库存储关于库存、门店和客户的通用信息"

  val defaultWarehouse = spark.catalog.getDatabase("default").locationUri

  val warehousePrefix = s"$defaultWarehouse/common"

  spark.sql(s"""

  CREATE DATABASE IF NOT EXISTS $dbName

  COMMENT ''$dbDescription''

  LOCATION ''$warehousePrefix''

  WITH DBPROPERTIES(TEAM=''core'',LEAD=''scott'',TEAM_SLACK=''#help_coffee_common'');

  """)

  清单 6-4

  使用 Spark SQL 在 Hive 元存储中创建数据库

  ```


  清单 6-4 中 SQL 查询的 `LOCATION` 属性将数据库与用于驱动 SQL 表的分布式文件系统中的目录或路径前缀绑定在一起。能够使用 Spark SQL
  目录和 Hive 元存储定义基于团队或组织的数据库，其美妙之处在于，你可以提供所有必要的工具，让团队能够跟踪特定数据库及其底层表的所有权。这个简单的步骤非常有用，能使团队成为负责任的数据管理者。


  '
- '# 使用 JDBC 加载外部表


  现在你已经了解了如何创建新数据库，接下来让我们看看如何将外部数据库表 `bettercustomers` 加载到我们新的 `coffee_co_common`
  数据库中。第一步是向 Spark 提供连接信息，以验证我们的 MySQL 数据库。然后，我们可以读取该表并将其写入我们的数据湖。使用清单 6-5 中的代码连接到
  `bettercustomers` 表（该表是在第 5 章的持续探索中创建的）。


  ```

  %spark

  val jdbcDriver = spark.conf.get("org.mariadb.jdbc.Driver")

  val dbHost     = spark.conf.get("mysql")

  val dbPort     = spark.conf.get("3306")

  val defaultDb  = spark.conf.get("default")

  val dbTable    = spark.conf.get("bettercustomers")

  val dbUser     = spark.conf.get("dataeng")

  val dbPass     = spark.conf.get("dataengineering_user")

  val connectionUrl = s"jdbc:mysql://$dbHost:$dbPort/$defaultDb"

  val betterCustomers = sparkSessionHive.read

  .format("jdbc")

  .option("url", connectionUrl)

  .option("driver", jdbcDriver)

  .option("dbtable", "bettercustomers")

  .option("user", dbUser)

  .option("password", dbPass)

  .load()

  betterCustomers.createOrReplaceTempView("customers")

  清单 6-5

  使用 JDBC 读取外部 Bettercustomers 表以在 Spark 中创建临时视图

  ```


  这个初始步骤仅仅是为最终加载客户表做准备。鉴于 Spark 不会立即加载临时视图，你可以确保该表对 Spark 会话是可访问的。这是一种与你的会话进行交互并确保所有预期加载的数据确实可用的好方法。


  '
- "# 列出表\n\nSpark SQL 目录使你能够列出和查看特定 Spark 会话可用的所有表。\n\n```\n%spark\nsparkSessionHive\n\
  .catalog\n.listTables\n.show(truncate=false)\n```\n\n这将显示 Spark 会话目录中存储的当前状态。\n\n\
  ```\n+---------+--------+-----------+---------+-----------+\n|     name|database|description|tableType|isTemporary|\n\
  +---------+--------+-----------+---------+-----------+\n|customers|    null|   \
  \    null|TEMPORARY|       true|\n+---------+--------+-----------+---------+-----------+\n\
  ```\n\n`customers` 表的 `tableType` 为 `TEMPORARY`，这仅意味着它只在内存中可用。如果我们停止 Spark 上下文（关闭\
  \ Zeppelin），该表将不再存在于 Spark SQL 目录元数据中。我们希望这些数据在我们的数据湖中可用，并且可以通过 Hive 元存储访问。因此，我们需要将这些数据加载到我们的数据湖（仓库）中。\n\
  \n如果你回想一下本书前面提到的 ETL 流程示例，这仅仅是另一种类型的 ETL。在这种情况下，我们只是将数据加载到数据湖中，以便其他数据团队，甚至你自己的数据团队，能够更轻松地处理这些数据。\n\
  \n\n\n### 创建持久化表\n\n在上一章中，我们探讨了在 `DataFrameWriter` 上使用 `saveAsTable` 方法。我们将再次使用此方法，将表写入\
  \ `coffee_co_common` 数据库，并全部存储在数据仓库中。\n\n```\n%spark\nval coffeeCoDatabaseName =\
  \ \"coffee_co_common\"\nsparkSessionHive.catalog\n.setCurrentDatabase(coffeeCoDatabaseName)\n\
  betterCustomers\n.write\n.mode(\"errorIfExists\")\n.saveAsTable(\"customers\")\n\
  ```\n\n就像我们使用传统 SQL 切换数据库上下文一样，我们必须告诉 Spark 要使用哪个数据库，除非我们希望默认回到 `default` 数据库。这可以通过在\
  \ Spark SQL Catalog 上使用 `setCurrentDatabase` 方法轻松完成。一旦 Spark Session 的上下文切换到使用 `coffee_co_common`\
  \ 数据库，我们就可以自由地将表保存到 SQL Catalog 中。\n\n如果你继续列出 SQL Catalog 上下文中可用的表，你会看到这个新表现在出现了。\n\
  \n```\n%spark\nsparkSessionHive\n.catalog\n.listTables.show\n+---------+----------------+-----------+---------+-----------+\n\
  |     name|        database|description|tableType|isTemporary|\n+---------+----------------+-----------+---------+-----------+\n\
  |customers|coffee_co_common|       null|  MANAGED|      false|\n|customers|    \
  \        null|       null|TEMPORARY|       true|\n+---------+----------------+-----------+---------+-----------+\n\
  ```\n\n在 `customers` 行的 `database` 列下，你会看到该表确实存储在我们的新 `coffee_co_common` 数据库中，并且该表现在完全由\
  \ Spark *管理*。这意味着不仅元数据被管理（在此例中，数据存储在 Hive Metastore 中），而且数据湖中的底层分布式表也被管理。\n\n###\
  \ 查找表是否存在\n\n最后一项可能派上用场的功能是在 Spark 应用程序中检查特定数据库上下文中是否存在表。\n\n```\n%spark\nval dbName\
  \ = \"coffee_co_common\"\nval tableName = \"customers\"\nsparkSessionHive\n.catalog\n\
  .tableExists(dbName, tableName)\n```\n\n这可以用作一个简单的布尔值，来检查你需要操作的表是否存在。如果你的应用程序期望首次写入特定位置，此检查也可以用作合理性检查。最终，在\
  \ `DataFrameWriter` 上使用默认保存模式（`errorIfExists`）比担心应用程序是否会覆盖共享位置中的数据更安全。\n\n好了，继续往下。我们将了解\
  \ Metastore 数据库的布局，并做一些练习，旨在帮助你充分了解 Hive Metastore，以便你能自信地自行探索。在暂时离开 Zeppelin 练习之后，我们将回到\
  \ Zeppelin 笔记本，并学习如何从这些受管理的 Spark 表中读取（加载）数据。你将看到如何为你的表和表列启用数据发现选项，最后，你将通过了解如何在\
  \ Spark 应用程序中管理表缓存，以及如何在不再需要时最终删除表，来结束本节内容。\n\n### Hive Metastore 中的数据库和表\n\n要理解数据库和表的元数据是如何管理的，了解元数据存储在哪里以及如何找到通往\
  \ Hive Metastore 数据库的路径会很有帮助。你可以按照以下步骤查看此记录：\n\n1.  打开一个新的终端会话，或在当前上下文中添加一个新标签页。\n\
  2.  然后，在 MySQL Docker 容器上创建一个新的 Bash 会话，并使用容器上的 `secrets` 文件登录到 MySQL CLI。\n3. \
  \ 切换到 metastore 数据库并查询 `TBLS` 表。\n\n```\ndocker exec -it mysql bash\nmysql --defaults-file=./secrets\n\
  mysql> use metastore;\n```\n\n接下来，我们将查看新数据库和受管理表的元数据。\n\n#### 查看 Hive Metastore\
  \ 数据库\n\n存储在 Hive Metastore 中的数据库位于 `DBS` 表中。该表的可用模式只需一个简单的 `describe` 命令即可查看，这有助于高效地查询它。在此例中，你只有一个条目，但在实际环境中，可能有成百上千个数据库条目，找到你的目标可能会有点复杂。\n\
  \n```\nmysql> describe DBS;\n+-----------------+---------------+------+-----+---------+-------+\n\
  | Field           | Type          | Null | Key | Default | Extra |\n+-----------------+---------------+------+-----+---------+-------+\n\
  | DB_ID           | bigint        | NO   | PRI | NULL    |       |\n| DESC     \
  \       | varchar(4000) | YES  |     | NULL    |       |\n| DB_LOCATION_URI | varchar(4000)\
  \ | NO   |     | NULL    |       |\n| NAME            | varchar(128)  | YES  | UNI\
  \ | NULL    |       |\n| OWNER_NAME      | varchar(128)  | YES  |     | NULL   \
  \ |       |\n| OWNER_TYPE      | varchar(10)   | YES  |     | NULL    |       |\n\
  +-----------------+---------------+------+-----+---------+-------+\n```\n\n鉴于我们在\
  \ Spark 中创建了一个名为 `coffee_co_common` 的数据库，我们可以使用一个简单的按 `NAME` 的等值查询来找到该数据库。\n\n```\n\
  mysql> select * from DBS where NAME = 'coffee_co_common';\n+-------+--------------------------------------------------+-------------+\n\
  | DB_ID | DESC   | DB_LOCATION_URI   | NAME   | OWNER_NAME | OWNER_TYPE |\n+-------+--------------------------------------------------+-------------+\n\
  |     1 | This database stores ... | file:...warehouse/common | coffee_co_common\
  \ | zeppelin   | USER       |\n+-------+--------------------------------------------------+-------------+\n\
  ```\n\n目前你真正需要关心的唯一一行是 `DB_ID` 行，因为它是主键。这将在下一节中用于查找受管理的 customers 表。\n\n\n\n###\
  \ 查看 Hive Metastore 表\n\nHive Metastore 将表元数据存储在 `TBLS` 表中。这句话听起来很“元”！和之前一样，我们先描述一下\
  \ `TBLS` 表的模式，以便了解查询时可以使用哪些列。\n\n```\nmysql> describe TBLS;\n+--------------------+--------------+------+-----+---------+-------+\n\
  | Field              | Type         | Null | Key | Default | Extra |\n+--------------------+--------------+------+-----+---------+-------+\n\
  | TBL_ID             | bigint       | NO   | PRI | NULL    |       |\n| CREATE_TIME\
  \        | int          | NO   |     | NULL    |       |\n| DB_ID              |\
  \ bigint       | YES  | MUL | NULL    |       |\n| LAST_ACCESS_TIME   | int    \
  \      | NO   |     | NULL    |       |\n| OWNER              | varchar(767) | YES\
  \  |     | NULL    |       |\n| RETENTION          | int          | NO   |     |\
  \ NULL    |       |\n| SD_ID              | bigint       | YES  | MUL | NULL   \
  \ |       |\n| TBL_NAME           | varchar(256) | YES  | MUL | NULL    |      \
  \ |\n| TBL_TYPE           | varchar(128) | YES  |     | NULL    |       |\n| VIEW_EXPANDED_TEXT\
  \ | mediumtext   | YES  |     | NULL    |       |\n| VIEW_ORIGINAL_TEXT | mediumtext\
  \   | YES  |     | NULL    |       |\n| IS_REWRITE_ENABLED | bit(1)       | NO \
  \  |     | b'0'    |       |\n+--------------------+--------------+------+-----+---------+-------+\n\
  ```\n\n现在，我们可以使用 Spark 查询刚刚创建的表，看看 `TBLS` 级别存储了哪些信息。\n\n```\nselect TBL_ID,TBL_TYPE,TBL_NAME,SD_ID\n\
  from TBLS where DB_ID = 1;\n+--------+---------------+-----------+-------+\n| TBL_ID\
  \ | TBL_TYPE      | TBL_NAME  | SD_ID |\n+--------+---------------+-----------+-------+\n\
  |      4 | MANAGED_TABLE | customers |     4 |\n+--------+---------------+-----------+-------+\n\
  ```\n\n经过这些操作，我们基本上只检索到了已经知道的 `TBL_NAME` 和 `TBL_TYPE` 信息，但这确实给了我们另一个线索，即 `TBL_ID`。Metastore\
  \ 中的 `TABLE_PARAMS` 表将是我们开始看到 Spark 运行所需信息的地方。\n\n随着我们继续深入这个“兔子洞”，你可能想知道这到底什么时候是个头。这段旅程还将连接另外两个点，之后你就可以选择自己的探索路径了，因为\
  \ Metastore 拥有大量额外的表，它们协同工作，为你的数据提供了一个强大的发现层。\n\n### Hive 表参数\n\n接下来值得提及的表是核心参数表，它类似于\
  \ `spark-defaults.conf` 文件或其他属性或配置文件。不同之处在于，它存储在数据库中，而不是分布式文件系统中的平面文件中。\n\n```\n\
  mysql> describe TABLE_PARAMS;\n+-------------+--------------+------+-----+---------+-------+\n\
  | Field       | Type         | Null | Key | Default | Extra |\n+-------------+--------------+------+-----+---------+-------+\n\
  | TBL_ID      | bigint       | NO   | PRI | NULL    |       |\n| PARAM_KEY   | varchar(256)\
  \ | NO   | PRI | NULL    |       |\n| PARAM_VALUE | mediumtext   | YES  |     |\
  \ NULL    |       |\n+-------------+--------------+------+-----+---------+-------+\n\
  ```\n\n使用之前的 `TBL_ID`，我们可以查看 `customers` 表的表属性。\n\n```\nmysql> select * from TABLE_PARAMS\
  \ where TBL_ID = 4;\n+--------+-----------------------------------+----------------------+\n\
  | TBL_ID | PARAM_KEY                         | PARAM_VALUE          |\n+--------+-----------------------------------+----------------------+\n\
  |      4 | comment                           | Loyal patrons of...  |\n|      4\
  \ | numFiles                          | 1                    |\n|      4 | spark.sql.create.version\
  \          | 3.1.1                |\n|      4 | spark.sql.partitionProvider    \
  \   | filesystem           |\n|      4 | spark.sql.sources.provider        | parquet\
  \              |\n|      4 | spark.sql.sources.schema.numParts | 1             \
  \       |\n|      4 | spark.sql.sources.schema.part.0   | {\"type\":\"struct\"...}\
  \ |\n|      4 | totalSize                         | 1896                 |\n|  \
  \    4 | transient_lastDdlTime             | 1615756742           |\n+--------+-----------------------------------+----------------------+\n\
  ```\n\n这最后一张表使我们能够查看 Spark “自动”应用于托管表的重要配置。这包括指导 Spark 读取我们表所需的所有信息。它还简化了我们使用数据的方式，包括简化了将表加载或读取到\
  \ Spark 中的过程。\n\n换个话题，让我们回到 Zeppelin 环境，以便将保存的数据加载到我们的托管表中。\n\n## 使用 Spark SQL 目录中的表\n\
  \n一旦元数据在 SparkSession 的 catalog 对象中可用，你就可以使用 `table` 方法加载数据以供应用程序使用。\n\n```\n%spark\n\
  val dbName = \"coffee_co_common\"\nsparkSessionHive\n.catalog\n.setCurrentDatabase(dbName)\n\
  sparkSessionHive\n.table(\"customers\")\n.show()\n```\n\n嗯，这真是让人耳目一新，不是吗？除了在会话目录上下文中设置当前数据库之外，访问表时不需要任何特殊的指导或指引。Spark\
  \ SQL 目录抽象了所有关于查询 Hive Metastore 的业务逻辑。正如我们在手动查询 Hive Metastore 时所看到的，内省、加载和转换这些分布式表所需的所有元数据几乎都触手可及。\n\
  \n## 通过表和列级注释进行数据发现\n\n本节主要介绍如何使用 Spark SQL 目录来帮助您、您的团队或任何数据团队高效地发现数据。您已经了解了 Hive\
  \ Metastore 在帮助团队发现存储在这些混合数据湖/数据仓库中的数据方面所起的关键作用。我们研究了如何使用命名空间模式来组织数据，该模式本质上创建了一个物理目录，其中记录了表的所有权，以及特定上下文中的所有表所有者。您还学习了如何直接查询\
  \ Hive Metastore 中的众多表，因为掌握您或您的团队所使用的底层技术对于任何数据系统的健康都至关重要。\n\n最后，我们将通过手动修改表和列级注释来结束对\
  \ Hive Metastore 的深入探讨，这样任何使用我们生成数据的人都能完全理解我们的意图。他们无需在单独的 wiki 或文档档案中查找信息，而是可以使用他们最熟悉的工具。\n\
  \n\n\n### 添加表级描述与列出表\n\n表级描述有助于记录表的用途。想象一下，如果新团队想要理解 `customers` 表，却看到以下内容，会发生什么。\n\
  \n```\n%spark\nsparkSessionHive\n.catalog\n.listTables\n.where($\"database\".equalTo(\"\
  coffee_co_common\"))\n.select($\"name\", $\"description\", $\"tableType\")\n.show()\n\
  +---------+-----------+---------+\n|     name|description|tableType|\n+---------+-----------+---------+\n\
  |customers|      null |  MANAGED|\n+---------+-----------+---------+\n```\n\n这个表可能代表任何东西。如果存在多个可能被使用的表，例如\
  \ `customers_current`、`customers_a` 和 `customers_test`，该怎么办？现在需要查看很多地方，这意味着有两种选择。团队或个人可以安排会议询问你或你的团队该用哪个表，或者同样可能的是，特别是当他们急于生成报告时，团队可能会抛硬币决定，使用看起来更新一些的表。他们甚至可能花费数小时、数天或数周梳理数据来搞清楚问题，最后在截止日期临近时才来求助。\n\
  \n我们可以通过一个简单的 `ALTER TABLE` 命令来预防这个问题，添加 `TBLPROPERTIES` 来描述 `customers` 表。\n\n\
  ```\n%spark\nsparkSessionHive.sql(\n\"\"\"\nALTER TABLE customers\nSET TBLPROPERTIES\
  \ (\n'comment' = 'Production Customers Data',\n'active' = 'true'\n)\n\"\"\")\n```\n\
  \n现在，当列出表时，团队将看到 *Production Customers Data* 描述符，这可以帮助他们确定这是要使用的正确表。\n\n```\n+---------+-------------------------+---------+\n\
  |name     |description              |tableType|\n+---------+-------------------------+---------+\n\
  |customers|Production Customers Data|MANAGED  |\n+---------+-------------------------+---------+\n\
  ```\n\n### 添加列级描述与列出列\n\n现在你已经为表本身添加了描述，你可以重复此过程，应用列级描述符。此过程类似于使用 `TBLPROPERTIES`\
  \ 添加表级注释，但这里我们针对的是表上使用 `ALTER COLUMN` 的 `comment` 字段。\n\n```\n%sql\nuse coffee_co_common;\n\
  ALTER TABLE customers ALTER COLUMN id\nCOMMENT \"Unique identifier for our Customer.\"\
  ;\nALTER TABLE customers ALTER COLUMN created\nCOMMENT \"timestamp when the account\
  \ became active\";\nALTER TABLE customers ALTER COLUMN updated\nCOMMENT \"timestamp\
  \ when this record last changed\";\nALTER TABLE customers ALTER COLUMN first_name\n\
  COMMENT \"The first name on the account\";\nALTER TABLE customers ALTER COLUMN last_name\n\
  COMMENT \"The last name on the account\";\nALTER TABLE customers ALTER COLUMN email\n\
  COMMENT \"customers email on file. Unique Constraint. Not to be used for Marketing\"\
  ;\n```\n\n更新 Hive Metastore 中的列后，现在很容易理解每一列。如果任何团队现在需要列出表的列，他们可以轻松做到。\n\n```\n%spark\n\
  val dbName = \"coffee_co_common\"\nval tableName = \"customers\"\nsparkSessionHive\n\
  .catalog\n.listColumns(dbName, tableName)\n.select($\"name\", $\"description\",\
  \ $\"dataType\")\n.show(truncate=false)\n```\n\n[Spark SQL Catalog](https://github.com/apache/spark/blob/master/sql/core/src/main/scala/org/apache/spark/sql/catalog/Catalog.scala)\
  \ 的 `listColumns` 方法有两个变体。对于我们的用例，由于我们在 catalog 上下文中加载了两个表（一个非托管表和一个名为 `customers`\
  \ 的托管表），存在一些歧义，即使我们将当前数据库上下文指向 `coffee_co_common` 数据库，Spark 在列出列时也可能提供错误信息。根据我的经验，这类用例通常不会发生，因为你的作业通常会根据特定的关注点分离进行拆分，一个批处理作业（或流处理作业）将数据写入托管表，而另一个作业从托管表中读取数据并继续转换数据以解决数据用例。无论如何，最好先进行测试；记住那句老话：“三思而后行。”\n\
  \n输出现在为任何人提供了理解每列用途的必要信息。注意：此输出已被截断以适应页面。\n\n```\n+----------+--------------------+---------+\n\
  |      name|         description| dataType|\n+----------+--------------------+---------+\n\
  |        id|Unique identifier...|      int|\n|   created|timestamp when th...|timestamp|\n\
  |   updated|timestamp when th...|timestamp|\n|first_name|The first name on...| \
  \  string|\n| last_name|The last name on ...|   string|\n|     email|customers email\
  \ o...|   string|\n+----------+--------------------+---------+\n```\n\n我们已经探索了 Spark\
  \ SQL Catalog 的大部分功能，但还没有结束。还有一些内容可以很好地完善这次深入探讨。首先，我们还没有讨论表缓存、缓存表意味着什么、如何清除缓存（以释放内存）、以及当另一个进程修改了你正在处理的表时如何更新缓存。然后是更有趣的部分，即如何删除或丢弃表。考虑到数据只应在需要存在的时间内保留，保持工作区整洁比以往任何时候都更重要。\n\
  \n## 缓存表\n\n缓存你正在处理的表有很多原因。这有助于减少分布式文件系统（例如 S3 或 HDFS）的负担，因为处理复杂查询时无需多次往返数据湖。复杂查询是指任何需要多次处理和转换同一数据集的查询。在报表或任何分析查询的情况下，例如，通常使用自连接来处理去重。或者，对于复杂的子集，使用半连接可能更容易，就像你在本书前面学习使用连接时看到的那样。\n\
  \n#### 删除临时视图\n\n为了简化事情，我们可以删除临时的 `customers` 视图，这样我们只需要关注托管表 `customers`。\n\n```\n\
  %spark\nsparkSessionHive\n.catalog\n.dropTempView(\"customers\")\n```\n\n现在进入 catalog\
  \ 中的缓存管理。\n\n#### 在 Spark 内存中缓存表\n\n仅使用 Spark Session 上的 catalog，我们可以使用 `cacheTable`\
  \ 方法将表数据存储在内存中（或者如果表太大，我们也可以处理）。\n\n```\n%spark\nval tableName = \"customers\"\n\
  spark.catalog.cacheTable(tableName)\n```\n\n就是这样。嗯，差不多。在本书中，我们还没有查看 Spark UI。现在我们将只看它的一个功能，即\
  \ Storage 选项卡。\n\n##### Spark UI 的 Storage 视图\n\n你可以在 `http://localhost:4040/storage/`\
  \ 打开 Spark UI 的 Storage 选项卡。如果你没有在笔记本中跳过前面的内容，你会看到一个漂亮的空白屏幕，如图 6-1 所示。\n\n![](img/505711_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\nSpark UI 的 Storage 选项卡\n\n鉴于我们还没有触发任何操作，`customers` 表中的数据虽然被标记为缓存，但实际上并不存在于\
  \ Spark 的存储中。这是因为没有理由急切地对表进行完整加载，因为你正在编写的应用程序可能只需要对数据执行一次遍历。在这种情况下，Spark 喜欢懒惰，这样做是为了保护你的应用程序，避免在开始任何工作之前就遇到内存问题。\n\
  \n**提示**\n\n如果你已将映射 `127.0.0.1 spark` 应用到你的 `/etc/hosts` 文件中，那么你也可以使用 `http://spark:4040/storage/`\
  \ 来查看此选项卡。此过程在章节材料中有所介绍，示例可以在 `/ch-06/docker/etc` 中找到。\n\n\n\n### 强制 Spark 缓存\n\n\
  要强制 Spark 缓存来自 `customers` 表的数据，你需要调用 Spark 执行操作。在这种情况下，你可以简单地调用 `head` 来返回表中的第一行。\n\
  \n```\n%spark\nval tableName = \"customers\"\nsparkSessionHive.table(tableName).head\n\
  ```\n\n这样就完成了。现在，如果你刷新存储界面，你将看到内存中的表。参考界面如图 6-2 所示。\n\n![](img/505711_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n显示已缓存 RDD 列表的 Spark 存储界面\n\n这很有趣，不是吗？现在你有了另一种方法来确保你编写的应用程序确实按照你期望的方式运行。由于\
  \ `customers` 表存在于缓存中，当你想要从该缓存中移除一个表时，检查其行为就变得很简单了。\n\n### 取消缓存表\n\n当我们在 Spark 应用程序的内存中缓存数据时，这意味着你正在减少为\
  \ Spark 应用程序中对象存储分配的可用总内存。我们不会深入探讨内存管理的细节，但每个 Spark 应用程序都会将分配的可用内存分成两个空间——一个空间专用于运行应用程序所需的内存（来自\
  \ JVM 开销、IO 连接等），另一个空间专用于应用程序中的对象存储（就像我们缓存内存表时看到的那样）。这由 `spark.memory.fraction`\
  \ 控制，默认情况下是 60/40 的分割。\n\n现在，让我们看看取消缓存我们之前缓存的表的过程。\n\n```\n%spark\nval tableName\
  \ = \"customers\"\nsparkSessionHive.catalog.uncacheTable(tableName)\n```\n\n###\
  \ 清除所有表缓存\n\n在 Spark 应用程序的不同位置可能缓存了许多表。如果你想从头开始，可以使用简单的 `clearCache` 目录方法。\n\n```\n\
  %spark\nsparkSessionHive.catalog.clearCache\n```\n\n这比追踪所有已缓存的表要容易得多。是的，你可以遍历目录中所有可用的表，检查它们是否存在缓存，然后选择性地移除每个缓存，但有时直接清除所有内容更好。\n\
  \n### 刷新表\n\n在清除所有缓存的兴奋中，我们跳过一个重要的概念。当你将表缓存到内存中，并且上游数据存储在你无法控制的情况下被更新时（例如，另一个应用程序正在写入表的位置，从而使你的缓存失效），为了确保你拥有最新的数据，你可以在\
  \ Spark 目录上使用 `refreshTable` 方法。这会刷新关于表的元数据以及构成表的底层文件。\n\n```\n%spark\nsparkSessionHive\n\
  .catalog\n.refreshTable(\"customers\")\n```\n\n这里有一个有趣的事实。如果你的 Spark 应用程序有意覆盖了你已缓存的表，它也会使你的本地缓存失效，从而无需在你自己的应用程序逻辑中包含任何表刷新操作。\n\
  \n## 使用 Spark 托管表测试自动缓存刷新\n\n这是一个有趣的部分。要完整展示这个用例，需要几个步骤：\n\n1.  将 `customers` 表的内容复制到一个名为\
  \ `customers_temp` 的新托管表中。\n2.  从这个新的托管表 `customers_temp` 中读取数据到一个名为 `tableCopy`\
  \ 的引用变量中，然后缓存该表。\n3.  调用 `tableCopy.head` 以在本地 Spark 内存中缓存该表。\n4.  将 `tableCopy`\
  \ 与自身进行 `Union` 操作以复制数据。\n5.  写入另一个名为 `union` 的托管表。\n6.  现在，你可以自由地覆盖初始的 `customers_temp`\
  \ 表，而 Spark 不会通知你正在尝试覆盖当前正在读取的表（顺便说一句，它通常会这样做）。\n7.  你已经绕过了安全检查，现在 `customers_temp`\
  \ 中加载了 `duplicates`。\n8.  有趣的是，如果你查看 Spark UI 中的存储选项卡（`http://localhost:4040/storage/`），你会看到\
  \ Spark 已经清除了无效的缓存表视图。\n\n你可以在“6_2_SparkSQLCatalog”笔记本中“Testing Automatic Cache\
  \ Refresh in Spark”标题下跟随此示例，或者不看示例，尝试利用你在本章中学到的关于 Spark SQL 目录的知识。最后，你必须创建两个额外的托管表来欺骗\
  \ Spark，使其覆盖另一个托管表。完成此练习后，你可以继续清理刚刚创建的表。\n\n## 移除表\n\n删除表可以使用 `DROP TABLE` 命令完成。或者，稍微费点功夫，你也可以直接使用底层的\
  \ Spark SQL 目录 Catalyst 操作。这些操作都属于传统的数据操作语言（DML）类别。\n\n### 数据操作语言\n\n*DML* 代表数据操作语言。这是由\
  \ `INSERT`、`UPDATE` 和 `DELETE` 命令封装的一类 SQL 操作。在本章前面设置 Hive Metastore 时，曾简要提到 Spark\
  \ 应用程序对 Hive Metastore 的只读、只写和读写访问。\n\n## 授权\n\n通过 DCL 授权管理传统关系型数据库的授权（权限）同样适用于管理连接到\
  \ Hive Metastore 的 Spark 应用程序的访问。为了数据安全最佳实践，你必须控制对数据的访问。应该只设置最小权限集，例如为用户启用只读操作的权限，如\
  \ `SELECT`。根据应用程序的实际需求添加功能。\n\n例如，如果我们的 `dataeng` 用户需要读取基本的 Hive Metastore 表元数据以读取上游表数据，然后进行转换，最后使用\
  \ `saveAsTable` 将数据写入一个新的托管表，我们可以安全地使用该用户权限的子集。\n\n```\n读写访问\nREVOKE ALL PRIVILEGES\
  \ ON `metastore`.* TO `dataeng`@`%`;\nGRANT CREATE, SELECT, INSERT ON `metastore`.*\
  \ TO 'dataeng'@'%';\nFLUSH PRIVILEGES;\n只读访问\nREVOKE ALL PRIVILEGES ON `metastore`.*\
  \ TO `dataeng`@`%`;\nGRANT SELECT ON `metastore`.* TO 'dataeng'@'%';\nFLUSH PRIVILEGES;\n\
  完全访问\nREVOKE ALL PRIVILEGES ON `metastore`.* FROM `dataeng`@`%`;\nGRANT ALL PRIVILEGES\
  \ ON  `metastore`.* TO  'dataeng'@'%';\nFLUSH PRIVILEGES;\n```\n\n##### 角色\n\n本书不会涵盖安全和数据访问管理的所有细节。不过，值得思考的一点是，研究一下是否支持基于角色的用户数据访问授权。这个强大的功能可以根据常见的角色名称实现高效的访问治理。以下是一个对\
  \ Hive Metastore 进行读写访问的示例。\n\n```\n角色\nCREATE ROLE readwrite;\nGRANT CREATE, SELECT,\
  \ INSERT, UPDATE, ALTER ON `metastore`.* TO readwrite;\n应用角色\nREVOKE ALL PRIVILEGES\
  \ ON `metastore`.* FROM `dataeng`@`%`;\nGRANT readwrite TO `dataeng`@`%`;\nFLUSH\
  \ PRIVILEGES;\n查看授权\nmysql> SHOW GRANTS FOR `dataeng`@`%`;\n+------------------------------------------------------+\n\
  | Grants for dataeng@%                                 |\n+------------------------------------------------------+\n\
  | GRANT USAGE ON *.* TO `dataeng`@`%`                  |\n| GRANT ALL PRIVILEGES\
  \ ON `default`.* TO `dataeng`@`%` |\n| GRANT `readwrite`@`%` TO `dataeng`@`%`  \
  \             |\n+------------------------------------------------------+\n```\n\
  \n这可以大大减少授予和撤销对 Hive Metastore 的通用访问权限所需的工作量。\n\n\n\n### Drop Table\n\n使用`DROP TABLE`会根据表是托管表还是外部表执行不同的操作。如果表由\
  \ Spark 管理，该命令将完全删除分布式表所有分区中的所有文件，以及所有元数据和表上提供的任何注释。如果表被定义为外部表，`DROP TABLE`命令将仅从\
  \ Hive Metastore 中移除表元数据，外部表将不受影响。\n\n请记住像现在这样通过 Docker 在本地尝试操作，这样你可以在对真实数据存储执行命令之前测试不同的命令。\n\
  \n```sql\n%sql\nDROP TABLE customers_temp;\nDROP TABLE unioned;\n```\n\n正如你刚刚体验到的，使用\
  \ SparkSession 上的 SQL 解释器删除表非常简单。如果你的应用程序尝试两次删除同一个表，该操作将抛出异常。如 DML 侧边栏中所述，基于角色的访问或显式用户权限有助于保护这些共享数据存储免遭意外删除。\n\
  \n### 条件删除表\n\n为了保护你的应用程序，明智的做法是使用条件。`IF EXISTS`条件是一个布尔操作，`false`条件将短路或停止命令的处理。\n\
  \n```sql\n%sql\nDROP TABLE IF EXISTS customers_temp;\nDROP TABLE IF EXISTS unioned;\n\
  ```\n\n最后但同样重要的是，让我们看看如何直接使用 Spark SQL 的 Catalyst 类来删除表。这是你刚刚运行的条件删除分布式`customers`表的解释型\
  \ SQL DML 查询的功能等价物。\n\n### 使用 Spark SQL Catalyst 删除表\n\n这将是我们第一次直接使用 Spark Catalyst\
  \ 类；在下一节中，我们将更深入地研究 Catalyst 优化器。\n\n```scala\n%spark\nimport org.apache.spark.sql.catalyst.TableIdentifier\n\
  val catalog = sparkSessionHive.sessionState.catalog\nval tableName = \"customers_temp\"\
  \nval tableId = TableIdentifier(tableName)\ncatalog\n.dropTable(tableId,ignoreIfNotExists=true,purge=true)\n\
  ```\n\n你可能会问，我们为什么要费这么大劲？事实证明，使用 Spark SQL Catalog 中的方法并没有一个简单的方法来删除表。\n\n这实际上是一件好事，因为这种高级技术要求你，应用程序的作者，非常坚定地使用\
  \ DSL 来删除表。毕竟，Spark SQL Catalog 中没有`dropTable`方法是有原因的。或者，是的，你可以使用 Spark SQL 解释器中的简单`DROP\
  \ TABLE`，但让我们想象一个不可能做到的世界。如果人们开始行为不端，你可以使用 DML 侧边栏中提到的基于角色或用户授权的方法，限制在你的数据平台内运行的\
  \ Spark 应用程序可用的操作。特殊权限应授予数据管理员，或仓库中特定表或数据库的负责任维护者。\n\n### 练习 6-2：总结\n\nSpark SQL\
  \ 和 Hive Metastore 更好地协同工作，作为一个团队，为你的所有 Spark 应用程序提供一个集中的元数据服务，用于组织中通常可用的数据。正如你在上一节中学到的，要全面了解这种强大的数据发现形式，需要掌握许多细微差别。我们研究了基于用户的访问，如何使用\
  \ SparkSession 上的简单方法将数据从传统 RDBMS（在我们的例子中是 MySQL）移动到分布式数据仓库。我们研究了通过注释 Hive Metastore\
  \ 数据库所有权、表列描述和表名称属性来为未来做铺垫。\n\n继续。现在是时候参观 Spark Catalyst 优化器了。这是贯穿本书向你介绍的已解释 SQL\
  \ 查询和 DataFrame 功能之间的粘合剂。\n\n## Spark Catalyst 优化器\n\n在本书中我们遇到的功能转换和强大 DataFrame\
  \ 操作的幕后，存在一个强大但看似透明的引擎。它默默地工作，以优化和编排应用程序执行所需的每一个作业、阶段和任务。本质上，Catalyst 优化器解析你的应用程序代码，并将其高效地转换为一系列优化的步骤，称为*执行计划*。见图\
  \ 6-3。\n\n![Figure 6-3](img/505711_1_En_6_Fig3_HTML.jpg)\n\n图 6-3：Catalyst 优化器解析\
  \ Spark 应用程序的高级意图，并将每个步骤通过一系列转换转换为高度优化、可分发、可执行的作战计划\n\n此过程分为四个不同的阶段：\n\n*   分析\n\
  *   逻辑优化\n*   物理规划\n*   代码生成\n\n为了充分理解 Catalyst 引擎所做的工作，让我们使用 Spark 内置的内省层来查看每个不同的阶段。以下示例针对存储在我们数据仓库中的\
  \ parquet 数据分析了一个简单查询。\n\n注意：请使用标题为“6_3_CatalystOptimizer”的 Zeppelin 笔记进行跟随。此最终笔记要求你已完成整章练习，以生成该部分所需的数据。\n\
  \n### 使用 Explain 内省 Spark 的 Catalyst 优化器\n\n你可以在 DataFrame 上调用操作之前的任何时间点使用`explain`方法，或者在\
  \ Spark SQL 解释器中使用`EXPLAIN`子句。\n\n```scala\n%spark\nsparkSessionHive\n.table(\"\
  customers\")\n.where(\ncol(\"email\").like(\"scott%\")\n)\n.select($\"id\", $\"\
  email\", $\"last_name\")\n.explain(\"extended\")\n```\n\n此 DataFrame 查询在功能上等同于以下\
  \ SQL 查询。\n\n```sql\n%sql\nselect id, email, last_name from customers\nwhere email\
  \ like 'scott%'\n```\n\n无论你决定如何构建查询，Spark Catalyst 优化器都将从同一起点开始，即查询解析。这第一个操作标志着\
  \ Catalyst 从解析到优化和规划之旅的开始。\n\n### 逻辑计划解析\n\n执行的初始阶段负责将查询的意图转换为层次树。\n\n```\n== Parsed\
  \ Logical Plan ==\n'Project [unresolvedalias('id, None), unresolvedalias('email,\
  \ None), unresolvedalias('last_name, None)]\n+- Filter email#5 LIKE scott%\n+- SubqueryAlias\
  \ spark_catalog.coffee_co_common.customers\n+- Relation[id#0,created#1,updated#2,first_name#3,last_name#4,email#5]\
  \ parquet\n```\n\n此步骤负责将每个查询转换并构建为关系以及这些关系上的表达式的树。第一步是识别未知列（`UnresolvedAlias`）的工作，并且在解释型\
  \ Spark SQL 的情况下，你会看到`coffee_co_common.customers`表，即`relation`，被标记为`UnresolvedRelation`。\n\
  \n```\n|== Parsed Logical Plan ==\n'Project ['id, 'email, 'last_name]\n+- 'Filter\
  \ 'email LIKE scott%\n+- 'UnresolvedRelation [coffee_co_common, customers], [],\
  \ false\n```\n\n这就是逻辑分析器发挥作用的地方。\n\n### 逻辑计划分析\n\n分析后的逻辑计划负责实体解析（`UnresolvedAlias`、`UnresolvedRelation`等），以便可以根据已知的模式和数据源或接收器位置验证列和表。\n\
  \n```\n== Analyzed Logical Plan ==\nid: int, email: string, last_name: string\n\
  Project [id#0, email#5, last_name#4]\n+- Filter email#5 LIKE scott%\n+- SubqueryAlias\
  \ spark_catalog.coffee_co_common.customers\n+- Relation[id#0,created#1,updated#2,first_name#3,last_name#4,email#5]\
  \ parquet\n```\n\n在优化器旅程的每一步，都会完成一组特定的子任务。在上面的例子中，这就像解析列和验证数据源可以提供查询请求的数据一样简单。\n\
  \n\n\n### 不可解析的错误\n\n不可解析的列可能由多种因素导致，例如在自由格式 SQL 查询中列名拼写错误。Spark 会快速失败，并通过 `AnalysisException`\
  \ 告诉你分析阶段失败的原因。\n\n你可以通过向 `select` 中添加一个新的、不可解析的字段，来让查询抛出异常。\n\n```\n%spark\ncustomersTable\n\
  .where(col(\"email\").like(\"scott%\"))\n.select($\"id\", $\"email\", $\"last_name\"\
  , $\"unknown\")\n.show()\n```\n\n这会在实际执行物理计划之前触发异常，快速失败。\n\n```\norg.apache.spark.sql.AnalysisException:\
  \ cannot resolve '`unknown`' given input columns: [spark_catalog.coffee_co_common.customers.created,\
  \ spark_catalog.coffee_co_common.customers.email, spark_catalog.coffee_co_common.customers.first_name,\
  \ spark_catalog.coffee_co_common.customers.id, spark_catalog.coffee_co_common.customers.last_name,\
  \ spark_catalog.coffee_co_common.customers.updated];\n'Project [id#0, email#5, last_name#4,\
  \ 'unknown]\n+- Filter email#5 LIKE scott%\n+- SubqueryAlias spark_catalog.coffee_co_common.customers\n\
  +- Relation[id#0,created#1,updated#2,first_name#3,last_name#4,email#5] parquet\n\
  ```\n\n分析器阶段的这种短路机制非常有用，尤其是在尝试调试与数据相关的问题时。接下来，在解析了计划中的所有未解析实体后，Spark 将进入查询优化阶段。\n\
  \n### 逻辑计划优化\n\n在此规划阶段，Spark 会在你的查询之上引入优化，例如添加空值检查，并将已知的静态表达式（如下面优化计划中的 `StartsWith`）进行转换。\n\
  \n```\n== Optimized Logical Plan ==\nProject [id#0, email#5, last_name#4]\n+- Filter\
  \ (isnotnull(email#5) AND StartsWith(email#5, scott))\n+- Relation[id#0,created#1,updated#2,first_name#3,last_name#4,email#5]\
  \ parquet\n```\n\n此优化阶段转换了以下内容：\n\n```\nFilter email#5 LIKE scott% 变为\nFilter (isnotnull(email#5)\
  \ AND StartsWith(email#5, scott))\n```\n\n现在进入最终的规划阶段：物理计划。\n\n### 物理计划\n\n物理计划是\
  \ Spark 将你的查询转换为生成的 Java 字节码之前的最后一步。\n\n```\n== Physical Plan ==\n*(1) Project [id#0,\
  \ email#5, last_name#4]\n+- *(1) Filter (isnotnull(email#5) AND StartsWith(email#5,\
  \ scott))\n+- *(1) ColumnarToRow\n+- FileScan parquet coffee_co_common.customers[id#0,last_name#4,email#5]\
  \ Batched: true, DataFilters: [isnotnull(email#5), StartsWith(email#5, scott)],\
  \ Format: Parquet, Location: InMemoryFileIndex[file:/spark/sql/warehouse/common/customers],\
  \ PartitionFilters: [], PushedFilters: [IsNotNull(email), StringStartsWith(email,scott)],\
  \ ReadSchema: struct\n```\n\n该计划为 Spark 提供了所有必要的信息，以生成一个真实的执行计划，用于读取、过滤和加载投影字段（`ID`、`email`\
  \ 和 `last_name`）到 Spark 中作为 DataFrame。拼图的最后一块是代码生成组件。\n\n### Java 字节码生成\n\n这最后一步将物理计划编译并转换为实际的\
  \ Java 字节码。这个过程被称为*全阶段代码生成*，它通过将所有 Java 方法调用内联到一个针对 JVM 优化的单一函数中来优化你的查询，而不是为了人类可读（尽管有些人以能够阅读并完全理解生成的代码为傲）。\n\
  \n```\n%spark\ncustomersTable\n.select($\"id\", $\"email\", $\"last_name\")\n.where(col(\"\
  email\").like(\"scott%\"))\n.explain(\"codegen\")\n```\n\n这将输出部分人类可读的详细信息以供分析。\n\
  \n```\nFound 1 WholeStageCodegen subtrees.\n== Subtree 1 / 1 (maxMethodCodeSize:369;\
  \ maxConstantPoolSize:142(0.22% used); numInnerClasses:0) ==\n*(1) Project [id#0,\
  \ email#5, last_name#4]\n+- *(1) Filter (isnotnull(email#5) AND StartsWith(email#5,\
  \ scott))\n+- *(1) ColumnarToRow\n+- FileScan parquet coffee_co_common.customers[id#0,last_name#4,email#5]\
  \ Batched: true, DataFilters: [isnotnull(email#5), StartsWith(email#5, scott)],\
  \ Format: Parquet, Location: InMemoryFileIndex[file:/spark/sql/warehouse/common/customers],\
  \ PartitionFilters: [], PushedFilters: [IsNotNull(email), StringStartsWith(email,scott)],\
  \ ReadSchema: struct\nGenerated code:\n/* 001 */ public Object generate(Object[]\
  \ references) {\n/* 002 */   return new GeneratedIteratorForCodegenStage1(references);\n\
  /* 003 */ }\n/* 004 */\n/* 005 */ // codegenStageId=1\n/* 006 */ final class GeneratedIteratorForCodegenStage1\
  \ extends org.apache.spark.sql.execution.BufferedRowIterator {\n/* 007 */   private\
  \ Object[] references;\n/* 008 */   private scala.collection.Iterator[] inputs;\n\
  /* 009 */   private int columnartorow_batchIdx_0;\n...\n```\n\n对于大多数 Spark 工程师来说，了解这些高级特性并非必需，但对于理解\
  \ Spark 的运行方式至关重要。此外，利用 Catalyst 对于创建 Spark 引擎的扩展非常有价值，例如当你想要读取和写入 Spark 核心编码器未知/不支持的数据格式时。\n\
  \n现在你已经了解了 Spark 优化应用程序流程所经历的步骤，我们将通过查看数据集来结束这一内容丰富的章节。\n\n## 数据集\n\n简而言之，*数据集*是一个强类型、高效编码的对象集合，驻留在系统原生内存中，由\
  \ Spark 引擎访问和编排。虽然概念上与 DataFrame 类似，但 Dataset API 暴露了类型化能力，包括创建自定义有状态聚合（用于流式应用程序）和其他强类型聚合，以便与更传统的基于批处理的分析一起使用。\n\
  \n当谈到*类型化*与*非类型化*时，这仅仅意味着 Spark 预先明确知道数据的格式和结构，即其*模式*。另一件值得一提的事情是，数据集具有不可变的固定模式。\n\
  \n### RDD\n\n回想一下，我们在本书前面讨论 Spark 编程模型时，讨论过 RDD（弹性分布式数据集）对象。作为复习，RDD 是 DataFrame\
  \ 和 Dataset 的智能骨干。它们存储了关于应用程序中数据血统的分布式（分区）元数据的逻辑映射——从最初从可靠数据源或内存数据结构加载数据开始，经过每个转换（变更）阶段，直到\
  \ Spark 应用程序中的终端操作（触发点）。每次我们调用 `write`、`show` 或 `collect` 时，我们都见证了操作的实际执行。\n\n虽然\
  \ RDD 本身不存储任何物理对象数据。Spark 驱动程序应用程序的 `SparkContext` 明确知道数据在分配给应用程序实时运行时的 Spark 执行器的内存和磁盘空间中的位置。在每个完整的执行阶段，生成的输出数据存储在不可变的数据缓冲区中，并记录转换数据血统的新步骤。尽管这个过程或多或少是透明的，但我们将在本书中更仔细地研究这个过程。\n\
  \n我们刚才说到哪了？数据集是强类型、不可变的数据集合，它们是从 JVM 对象（Scala 或 Java 类）编码而来的。它们与 Spark 生态系统的其他部分配合良好，因为它们只是\
  \ RDD 之上的一层。由于数据集具有不可变或固定的模式，这意味着 Spark 在应用程序的上下文中处理数据时可以采取某些自由。同样值得一提的是，Python\
  \ 和 R API 不能使用数据集，这是使用 Scala API 的一大优势。\n\n\n\n### 练习 6-3：将 DataFrame 转换为 Dataset\n\
  \n让我们从一个实际示例开始。假设你能够访问之前管理过的客户数据，我们可以将这些数据复用于当前场景。现在需要做的就是生成一个简单的 Case 类来充当客户数据的中介。回想一下上一章中，我们在创建要插入到关系型数据库管理系统（RDBMS）的额外行时，研究了\
  \ Java 类型的互操作性。同样的技术可以应用于 Case 类，它可以与 Catalyst 行进行隐式互操作。\n\n#### 创建客户 Case 类\n\n\
  ```scala\n%spark\nimport java.sql.Timestamp\nimport org.apache.spark.sql.Dataset\n\
  case class Customer(\n  id: Integer,\n  created: Timestamp,\n  updated: Timestamp,\n\
  \  first_name: String,\n  last_name: String,\n  email: String)\n```\n\n定义好类之后，我们现在可以将\
  \ DataFrame 转换为 Dataset。\n\n### Dataset 别名\n\n有一个名为 `as` 的简单辅助方法，它使用编码器将 DataFrame\
  \ 转换为 Dataset。\n\n```scala\n%spark\nimport org.apache.spark.sql._\nimplicit val\
  \ customerEnc = Encoders.product[Customer]\nval customerData: Dataset[Customer]\
  \ = customersTable\n  .as[Customer]\n```\n\nDataset 使你能够使用 Scala 的标准函数式编程，或者根据你的用例使用\
  \ Catalyst 表达式。这种范式为你的数据工程任务提供了最大的灵活性，因为有时复杂的任务无法转换为有意义的 SQL 操作。在这些情况下，回归到核心的工程技能会非常有用。例如，你可以混合使用\
  \ Catalyst 和 Scala 操作。\n\n### 混合使用 Catalyst 和 Scala 功能\n\n我们可以创建自己的 Lambda 函数，这些函数可以被内联，并用于过滤以特定模式开头的电子邮件字符串，例如我的名字。\n\
  \n```scala\ncustomerData\n  .filter(_.email.startsWith(\"scott\"))\n  .explain(\"\
  formatted\")\n```\n\n这种过滤方法允许你编写专门的 Scala 过滤器，这些过滤器可以直接使用 Scala `Customer` 类进行操作，而不是使用纯\
  \ Catalyst 表达式（正如我们在本章前面看到的那样）。此函数将在每一行上被调用，因为 Spark 在遍历内部 Spark 行时，会封装每个批次。对于每个过滤操作，该行将从内部\
  \ Spark 格式（一种称为 *Tungsten* 的优化的原生内存格式）转换为可与 Scala Lambda 函数一起使用的 Java 对象。\n\n**注意**\n\
  \n这种从原生内存到 JVM 内存的转换可能会导致垃圾回收周期，从而降低应用程序的性能，因此请注意这一点，并记住尽可能不要忽视 Catalyst 原生函数。`org.apache.spark.sql.functions`\
  \ 是经过效率优化的，并且随 Apache Spark 免费提供。根据经验法则，过多的垃圾回收（更不用说对 Lambda 函数的支持）会拖慢你的 Spark 应用程序。例如，我曾见过从使用\
  \ Lambda 表达式切换到使用原生 SQL 函数时，性能提升了 50-60%。\n\n同样的过滤操作也可以使用类型化的 Catalyst 表达式轻松调用。\n\
  \n#### 使用类型化的 Catalyst 表达式\n\n以下示例在功能上与前一个示例等效，不同之处在于我们使用类型化的 Catalyst 列表达式来执行 `startsWith`\
  \ 过滤。\n\n```scala\n%spark\ncustomerData\n  .filter($\"email\".startsWith(\"scott\"\
  ))\n  .explain(\"formatted\")\n```\n\n这使我们能够使用谓词下推（优化功能），而不是先将所有 Parquet 数据读入内存，然后进行过滤。在你后续的\
  \ Spark 学习旅程中，将会了解到更多优化技术，但使用 Dataset 能够实现两全其美，你可以在混合执行模型中利用 Spark 或传统的 Scala。\n\
  \n#### 练习 6-3：总结\n\n在构建 Spark Structured Streaming 应用程序时，通常更倾向于使用 Dataset，因为其固定的结构在编译时提供了明确的数据契约，避免了在运行时出现问题。此外，随着时间的推移，我更喜欢使用\
  \ Dataset 来定义我所编写应用程序的入口和出口（输入和输出）。这确保了我为生成的数据提供了一个坚实的 API 边界。由于从 Dataset 转换为 DataFrame\
  \ 非常简单（`ds.toDF`），应用程序可以选择它们需要如何操作。然而，能够在整个组织中共享这些格式（通过 Hive Metastore 或在一个包含通用数据格式的共享库中）有助于你复用数据，而无需担心数据在应用程序之下发生变化。\n\
  \n我还发现 Dataset 能够极大地加速并改进编写单元测试的过程。只需投入一点前期努力，就可以使用更具测试驱动的方法来编写 Spark 应用程序。这可以节省漫长的编译和部署周期，而且良好的测试使工程师能够轻松调试任何类型的\
  \ Spark 应用程序，从标准批处理到流处理。我们将在第 7 章中探讨编写和测试完整端到端管道应用程序的过程。\n\n## 总结\n\n在本章中，你学习了如何将\
  \ Apache Hive Metastore 与 Spark SQL Catalog 结合使用。你发现了为 Hive 数据库的所有权添加重要富元数据、为生成的表添加简单描述和定义、以及如何提供丰富的列级信息是多么容易，以便通过你的操作实现轻松的数据发现。这种改善数据发现的简单行为，有助于在数据平台环境中进行前瞻性投入。现在，其他团队可以有能力去寻找他们今天所需的数据，以解决未来的数据问题。\n\
  \n然后，我们更深入地探讨了幕后机制，并查看了 Spark 在 Catalyst 优化器中使用的优化管道。我们看到了它如何规划并将你的查询从解析计划转换为分析计划，再到优化计划，最后到物理计划。这一系列事件极大地改善了在代码生成阶段生成的\
  \ Java 字节码，最终，你的应用程序会直接受益于这种精心编译。\n\n本章最后，我们探讨了使用显式编码将 Case 类转换为 Dataset 的过程。在接下来的几章中，当你着手构建和运行批处理及流处理的管道作业时，你将依赖前六章中的这些信息，以务实的方法构建现代数据工程环境的核心组件。\n\
  \n"
- '# 7. 数据管道与结构化 Spark 应用


  幕后存在一种核心处理范式，它可以帮助连接你作为数据工程师构建的几乎所有内容。这种处理范式既是有效移动和处理数据的物理模型，也是心智模型，被称为 *数据管道*。我们最初在介绍驱动现代数据栈的历史和通用组件时，曾在第
  1 章中简要提及数据管道。本章将教你如何编写、测试和编译可靠的 Spark 应用程序，这些应用程序可以直接融入数据管道中。




  '
- "# 数据管道\n\n在第一章中，你了解了数据管道的起源，以及管道工作如何从著名的**抽取-转换-加载（ETL）**设计模式演变而来。从概念上讲，ETL 使得像\
  \ `MapReduce` 这样的框架日益流行，因为复杂的问题可以被定义为工作流或一系列任务，从而将困难的分布式数据处理分而治之，分解为可消化的小型计算。数据管道建立了用于处理批处理或流处理的一致处理范式。由于数据管道仅仅是在系统间可靠移动数据的通道，开始思考数据在使用\
  \ ETL 处理时，如何在更大的数据拓扑中的各点之间流动，有助于建立一个清晰的思维模型。当你越来越熟悉那些数据流扇出、分叉或汇入一个或多个数据处理管道的复杂数据处理时，你的思维模型就可以开始转变为一个通过工作流编排（我们将在下一章讨论）来协调的相互依赖任务图。\n\
  \n打个比方，可以将数据管道视为一个由软件驱动的汽车或制造装配线。装配线上的每个工位都只专注于做好一项工作，这在同步数据处理中很有意义，因为每个任务都依赖上游任务的成功来完成其预定目标。图\
  \ 7-1 展示了一个更复杂的数据管道的例子，其中一些任务需要按照装配线式的处理方式同步运行，而其他任务则可以完全异步运行。\n\n![](img/505711_1_En_7_Fig1_HTML.png)\n\
  \n*图 7-1 – 混合同步/异步数据管道*\n\n图 7-1 显示，管道任务 A 到 C 相互依赖，需要按特定的同步顺序完成。这通常是组合式数据处理的典型情况。你将新的数据对象作为其他可用数据的复合体或组合来进行组合。这在数据源\
  \ A、B 和 C 的组合中可以看到。然而，在前三个上游管道任务完成后，下游任务 D 和 E 是独立的，可以异步运行。\n\n鉴于数据管道的动态特性，只要数据流的变更不破坏任何依赖任务的下游数据需求，就可以在数据处理网络中新增、插入或移除数据处理任务。虽然这种灵活性提供了一种高效机制来重用上游工作产生的数据，但数据血缘问题或数据处理盲点可能会悄然出现，导致孤立的问题。这可能导致数据陈旧，主要原因在于管道破损（糟糕的上游任务），或数据网络中任何关键点的数据损坏所引发的系统范围问题。\n\
  \n随着数据管道复杂度的增长，你将看到对自动化的需求日益增加。起初，像 crontab 以及由 webhooks 和 API 触发的简单工作流之类的简单解决方案就能维持运行。然而，随着规模随时间扩大和增长，通常会迁移到更专业的工作流编排框架来管理更大的数据处理规模。你将在第八章学习如何使用\
  \ `Apache Airflow` 搭配 `Spark`，届时我们将探讨工作流编排。本章则提供了构建可靠的基于批处理的 `Spark` 应用程序的蓝图，使其准备好接入\
  \ `Airflow`。\n\n## 管道基础\n\n在之前的六章中，你一直在为数据管道之旅做准备，学习了现代数据工程师所需的重要历史、概念、组件和基础。作为回顾，前两章介绍并讲解了过去的状况和发展趋势，并让你在本地上手运行了\
  \ `Apache Spark`。第三章和第四章探讨了数据的读取、解析、转换和写入，并讨论了数据文档、强类型以及为他人铺路的重要性。\n\n随着第五章中 JDBC\
  \ 数据源的引入，你学会了使用 `Apache Spark` 与现有数据存储进行互操作，以便处理外部数据库。第六章介绍了 Spark SQL Catalog。你学会了使用外部的\
  \ `Apache Hive Metastore` 为 Spark SQL 提供支持，这可以简化处理外部表或托管表的过程，并能解决一些与数据发现、数据所有权和数据访问相关的常见问题。\n\
  \n在这个过程中，你一直在学习使用 `Spark` 来解决数据问题，而无需不必要地分心去思考如何编写能够按照标准软件开发最佳实践进行编译、单元测试、文档化和发布的应用程序。你将在本章中学习如何将常见的软件工程最佳实践应用于你作为数据工程师所做的工作中。\n\
  \n## Spark 应用程序：形式与功能\n\n在本书的这一部分之前，你一直依赖 `Apache Zeppelin` 或手动使用 `spark-shell`\
  \ 来交互式地输入命令和处理数据。这些*交互式应用程序*只是 `Spark` 应用程序可以采用的众多形式之一。`Spark` 应用程序可以采用的另外两种形式是*基于批处理的应用程序*和*流式应用程序*。了解这三种风格之间的异同可以帮助你决定编写哪种风格的\
  \ `Spark` 应用程序。这个过程也是从构思到生产过程中的一个关键决策点。\n\n### 交互式应用程序\n\n顾名思义，交互式应用程序在某种意义上是有生命力的，因为它们等待读取、评估和处理来自用户的输入。这种机制为许多不同的用例提供了良好的即时反馈循环，包括数据发现和探索性数据分析，以及在学习和尝试新事物时可以依赖的工具。`Spark\
  \ Shell` 和 `Apache Zeppelin`（笔记本环境）提供了使用 `Spark` 的温和入门方式，无需编译代码或设置任何 IDE。不过，这些方法也存在局限性。\n\
  \n## Spark Shell\n\n`Spark` 自带的 `REPL`（也就是 `spark-shell`）在第五章中有详细介绍，当时我们探讨了如何在 `Spark`\
  \ 运行时环境之上创建快速的动态应用程序。尽管你可以通过动态文件加载和 `Spark` 配置的组合来构建相当复杂的例程，但其限制因素在于，这些 Shell 应用程序并非为满足生产系统黄金时段所需的完全一致性和可靠性而设计。充其量，这种操作模式就像一个强大的交互式脚本环境。\n\
  \n\n\n#### Notebook 环境\n\n在本书中，我们全程使用了 Apache Zeppelin，以便通过 Notebook 简化与 Apache\
  \ Spark 和 Scala 的协作方式。Notebook 环境是一个强大的工具。它将 `spark-shell` 的简洁性与一致的运行时环境融为一体，并且可以通过传递笔记或实时协作（托管版\
  \ Zeppelin）在同事之间共享。Zeppelin 让想法（启发式方法和代码流程）能够在一系列段落中得以充分实现，这些段落既可以作为同步流程（整体上）运行，也可以单独运行，这在调试某个段落时通常是常见情况。\n\
  \n锦上添花的是（至少在我看来），它能将内联文档与交互式图表和表格混合在一起，并与每个笔记中处理的数据并行展示。我们将在第 12 章中再次使用 Zeppelin\
  \ 进行分析处理和洞察生成。\n\n在工作中使用 Notebook 环境也是利弊参半。虽然编写一系列相对复杂的数据处理操作来访问内部和外部数据源可能很简单，但这种易用性也带来了损害生产系统的潜在风险。设想一个笔记，它对非生产数据系统（在非生产环境中）执行了大量相对昂贵的查询。虽然编写该笔记的工程师无意造成损害，但这些昂贵的查询有可能导致某个服务或数据库宕机——如果同一个笔记被迁移到生产环境或意外保存，就可能引发事故。\n\
  \n> **提示：** 了解你的数据规模：要清楚你正在处理的数据的规模，不仅仅是总记录数/行数，还包括所需的内存和 IO（带宽）开销。理解你正在处理的数据规模，对于运行健康的数据应用至关重要。这就是为什么许多应用在规划阶段使用\
  \ Notebook，而最终却以编译后的流处理或批处理应用形式进入生产环境的原因。\n\n## 批处理应用\n\n批处理应用不一定比你在 Zeppelin 中编写的一些简单段落更复杂。主要区别在于创建编译后的批处理应用的过程，而不是在\
  \ Zeppelin 中编写一个快速笔记或段落。我们将在本章下一节中介绍为批处理应用构建蓝图的过程，但在那之前，请记住以下几点。\n\n与传统软件开发的最佳实践一样，编写健壮、可靠的数据应用需要你编写包含测试（单元测试和自动化测试）、符合团队或公司的卓越标准、经过代码审查、并采用分阶段方法发布的代码。它还必须确保下游系统以及其他依赖系统得到保护。最后，它必须确保每个作业都以高性能方式运行，并配备适当的指标和应用级监控，以确保每个作业都能履行并满足约定的\
  \ SLA。\n\n在编写 Spark 批处理应用时，有两种方法可以帮助你设计接口和配置。应用可以是**无状态**的或**有状态**的。\n\n#### 无状态批处理应用\n\
  \n无状态批处理应用不需要状态管理。这种编写批处理应用的方法旨在处理非常特定的任务，所有必要的配置都在运行时提供给应用。这类应用非常适合传统的数据管道作业。例如，管道作业可以配置为在开始和结束日期之间从外部表中导入所有行。由于职责划分清晰，且没有长期状态管理，每次运行批处理应用都可以自行设定其边界。例如，如果需要回填数据，可以创建一个或多个作业，并触发这些作业并行运行，而无需担心交叉污染（只要边界明确，例如按天加载分区数据）。**回填**是将缺失数据加载到数据源的过程。\n\
  \n> **提示：** 为复用而设计：虽然你可以创建一次性应用，但更好的做法是考虑如何让应用通过外部配置驱动以实现复用。否则，你将不得不反复对内部配置进行微小修改、发布、运行，然后重复这一过程。\n\
  \n无状态批处理应用的一个例子是每日报表作业。报表作业通常针对特定的数据子集运行，例如每日或每小时的指标或事件汇总。清单 7-1 中显示的批处理作业配置展示了一个示例应用如何被配置为从外部运行。\n\
  \n```\n$SPARK_HOME/bin/spark-submit \\\n--class \"com.coffeeco.reporting.DailyReport\"\
  \ \\\n--master \"spark://thehost:7077\" \\\n--deploy-mode \"client\" \\\n--conf\
  \ \"spark.report.table.source=daily-summaries\" \\\n--conf \"spark.report.table.sink=daily-reports\"\
  \ \\\n--conf \"spark.report.range.start=2021-03-01\" \\\n--conf \"spark.report.range.end=2021-03-02\"\
  \ \\\n...\n清单 7-1 外部配置让您的批处理应用可以一次编写，多种方式使用\n```\n\n与无状态批处理应用相对的是有状态批处理应用。\n\n####\
  \ 有状态批处理应用\n\n有状态批处理应用可以被设计为使用任意数量的外部系统来可靠地管理其配置和应用状态，例如 Apache ZooKeeper 或 HDFS。然而，另一种技巧是使用\
  \ Spark Structured Streaming，并将其配置为每次触发仅执行一次。这种技术使你可以利用强大的 Structured Streaming\
  \ 引擎的有状态语义，来跟踪和管理一切的有效状态，包括数据源、已处理并完全提交的数据，以及批处理作业的每次运行。所有这些都无需你手动捕获和管理数据管道中批次间的作业元数据。对于更复杂的数据处理作业（包括从多个外部数据源读取和关联数据，且这些数据源混合了批处理和流处理来源），手动管理外部状态很快就会变得难以应付。\n\
  \n> **提示：** 如果你的有状态批处理作业将作为周期性批处理作业运行，用于将数据从流处理源可靠地移动到 HDFS 或 S3 等可靠数据存储中，请确定作业中哪些方面可以复用，以构建通用的基础应用。通用应用可以是配置驱动的，也可以建立在抽象类（库）之上，并在通用接口之间共享。基础化应用使得常见的数据工程问题能够一次性解决，并将经验教训进行复用，而无需从想法到生产耗费漫长的前置时间。\n\
  \n\n\n#### 从有状态批处理到流式应用\n\n有状态批处理应用的另一个常见用途是周期性处理来自流式数据源（如 Apache Kafka）的数据。在给定主题的所有分布式分区中，可靠地追踪应用在数据流中的位置需要大量元数据，而这对于无状态批处理任务来说并不太适用。\n\
  \n最后，你可以在将应用开启为全天候流式处理之前，利用有状态批处理应用帮助进行性能调优。通过将外部配置与内部有状态处理相结合，你可以增加每批处理的记录数，并测试应用在不同\
  \ CPU/RAM 分配组合下的表现。能够先在批处理模式下测试的应用，可以逐步增加负荷直至达到其极限点，或配置为获得最大数据吞吐量。当你对结果满意后，只需切换触发器，你的应用就可以作为流式任务运行，并从上一次批处理结束的位置继续处理。你可以在第\
  \ 10 章学习如何编写可靠的有状态批处理任务，包括使用外部配置来控制每个微批次的处理频率和速率的详细细节。\n\n## 流式应用\n\nApache Spark\
  \ 使你能构建处理无界数据源的应用，而无需过多改变你从批处理中形成的思维模式。鉴于 Spark Structured Streaming 应用默认会作为一系列持续处理的微批次数据来运行，因此按批次逐一处理问题是非常直观的。Spark\
  \ 使你能通过两种主要的处理模式来处理流式数据：*微批次处理* 和 *持续处理*。\n\n#### 微批次处理\n\n这种处理模式会定期检查流式数据源（如 Apache\
  \ Kafka），并触发一个新的批次进行处理。这意味着你可以将你的应用视为在无限数据流中，周期性处理有限数据集。\n\n微批次处理更适合常见的分析处理需求，例如在时间窗口内汇总指标。回顾第\
  \ 4 章，当时我们通过关联每家咖啡店的当前店内顾客数据，来构建一种判断是否有足够座位容纳不同规模聚会的方法。这种事件处理非常适合实时场景，因为这些数据流如果不及时处理，很快就会失去意义。例如，这些数据可用于驱动一个移动应用，帮助顾客找到离他们最近且有可用座位的门店。\n\
  \n然而，考虑到之前的有状态批处理用例，这些数据从历史角度来看也很有意义，只是精度要求不同。你可能需要将这些数据按 15 到 30 分钟的间隔进行汇总，以便让其他团队能够生成每家门店的日/周/月绩效报告。\n\
  \n#### 持续处理\n\n与基于微批次处理不同，持续处理支持对每条记录进行单独处理，确保每个数据点都以有状态的方式被精确处理一次。这种处理方式可用于实现实时计费场景，即你需要单独（且持久地）处理每笔交易。对于计费来说，每个操作在事件级别上要么成功要么失败尤为重要，这与“至少一次”的处理方式相反，因为后者可能导致对客户重复计费。在微批次内发生部分故障的情况下，Spark\
  \ 会回滚并重新处理该部分数据集，这是微批次流处理和计费时常见的一个陷阱。\n\n**注意**  \n本书不涉及持续处理，但如果你感兴趣，可以使用第 11 章（Apache\
  \ Kafka）的环境自行测试。（在撰写本文时，唯一支持持续处理的数据源是 Apache Kafka。）\n\n了解 Spark 应用可以采用的多种运行模式，是设计可靠数据应用的第一步。第二步，当然就是实际编写应用。接下来我们将进行一项练习，为你编写本章后续部分的内容做好准备。\n\
  \n## 设计 Spark 应用\n\n如你所知，数据工程本质上是高效、可靠地移动和转换数据的艺术。为了做好我们的工作，每个任务，或者我们在数据管道中运行的系列任务，都应该是特定数据需求的结果，并编码为经过传统软件开发周期的已发布数据应用。软件开发周期如图\
  \ 7-2 所示。它总结了成功构建和运行软件所需的七个常见概念执行阶段。同样的流程可以（也应该）应用于任何数据工程团队或数据组织的规划和成功运营。\n\n![](img/505711_1_En_7_Fig2_HTML.png)\n\
  \n图 7-2\n\n软件开发周期\n\n可靠的数据应用遵循传统的软件开发周期。你计划编写什么、为什么需要编写它、目标受众是谁、以及需要在何时完成——所有这些问题都源于传统的基于规范的规划和构思。这些计划会引出需要快速且仔细分析的工作，然后才能开始设计和编写完成任务的代码。在项目的规划、分析和设计阶段，你可能会在像\
  \ Apache Zeppelin 这样的笔记本环境中工作。你也可能会回到这些交互式环境中去调试生产中的问题，或者快速调出一个图表与同事分享。\n\n**提示**\
  \  \n交互式环境因多种原因而格外宝贵，但对于快速进行调研尝试尤其不可替代。它们帮助你在软件生命周期早期就发现缺口，避免在之后花费时间规范化代码、编写单元测试、进行代码审查以及准备生产发布。\n\
  \n我们将在下一节中通过一个扩展用例来展开工作。此练习的目的是帮助你思考如何用数据解决问题。鉴于数据工程师专注于数据，学习抽象地思考数据和数据建模是核心技能。数据建模对所有数据从业者来说都是一项基本技能，虽然关于分类法、命名约定和通用理论的讨论不在本书范围内，但下一个用例将向你介绍如何构建基础数据问题的框架。\n\
  \n\n\n"
- '# 用例：CoffeeCo 与咖啡仪式


  并非每个人都喜欢咖啡或茶。然而，说到仪式感和社群文化，咖啡产业背后蕴藏着巨大的成功。在本书的开篇，我们已经简要提及了在名为 CoffeeCo 的公司担任新数据工程师所需应对的一些琐碎事务。你可以将其视为你日常光顾的任何一家主流咖啡品牌。或者，如果你对咖啡有强烈的抵触情绪，你也可以运用相关工具处理并转化这些数据，使其更符合你的喜好（希望我们还能做朋友）。


  贯穿本章及本书后续内容，你将专注于编写 Spark 应用程序，以促进并协调 CoffeeCo 的数据需求。你将扩展之前章节的基础原语，例如我们为咖啡店、库存、顾客以及顾客购买行为建立的模型。你将使用这些数据编写目标驱动的应用程序，像在实际工作中一样推动
  CoffeeCo 的业务发展。这些经验几乎可以应用于你作为数据工程师横向处理数据平台、或纵向专注于特定功能或业务单元时所遇到的所有工作。所学到的技能可用于解决大多数企业面临的常见问题。


  恭喜你升职了。你现在是 CoffeeCo 的创始数据工程师。你的首要任务是构建能够代表 CoffeeCo 业务多个方面的核心数据模型。要做到这一点，你需要更深入地了解业务。


  ## 思考数据


  如果你从一个足够高的视角来看，会发现大多数面向客户的企业都存在一条共通的主线。即，企业都有待售的某种*产品*、销售产品的*场所*（线上或实体店），以及购买产品的*顾客*。这类似于名词的概念：业务围绕着人、地点和事物展开。


  思考一家公司的数据需求时，需要考虑哪些业务方面需要被捕捉，以便做出明智的决策，以及我们如何从数据中提取意义？对于所有新的数据运营来说，这些可能是艰巨的任务。策略因地而异，但你可以使用一种非常有帮助的机制，它直接借鉴自产品管理和用户故事流程。简化来说，我们将采用一个颇具创意的名称：*数据故事*。


  ## 数据故事讲述与数据建模


  无论你在何处工作、以何种方式工作，所有工作都围绕着任务的概念展开。这是一个分解的过程：你将庞大的想法或琐事分解成可以在不必一次性考虑所有问题的情况下完成的较小任务。这是一项需要时间积累的技能。许多工程师经过多年磨练，学会了如何思考问题，将其拆解为功能性子组件、可复用的类和接口。由于数据工程与传统软件工程紧密相关，这些技能可以很容易地迁移到我们思考数据问题的方式上。这只需要一点练习。幸运的是，你现在将逐步了解高层次的数据建模过程。


  ## 练习 7-1：数据建模


  故事讲述的过程可以成为一个有用的工具，用于理解数据关系，这些关系对于分解像公司这样复杂的想法是必要的。在我们的案例中，公司是 CoffeeCo。我们将把它分解为一个由*想法、实体、类别*和*关系*构成的层级结构，用于构建数据模型。在决定捕获和集成哪些数据时，这个过程甚至对战略规划和决策也很有用。取决于你在公司的角色，你可能需要推动许多超出你数据工程师职责范围的工作。理解全局图景或事物（与数据相关的）如何各得其所，是一项宝贵的技能。与许多事情一样，数据建模始于一个故事。


  ### 故事


  CoffeeCo 致力于为人们提供独特的咖啡饮用体验，并根据个人需求和口味进行定制。我们从最优质的咖啡豆开始，通过一个视我们如家人的全球种植者网络进行采购。这些关键的关系确保我们能够获得稳定的季节性产品，这些产品天然有机地生长。额外的好处是，它确保了每一种咖啡都来自一个知名的产区，该产区能够满足我们追求的生长条件和自然风味特征。利用最先进的个性化系统，我们让顾客能够对咖啡体验的方方面面进行评分，从咖啡的烘焙方式、咖啡豆品种、最喜爱的农场和生产商，甚至到他们最喜欢的门店。每一杯咖啡、每一次光顾、每一次个人体验，都增进了顾客对咖啡的热爱，以及他们围绕咖啡所建立的社群。


  ### 分解故事


  你可能已经发现，你的大脑已经开始对 CoffeeCo 的故事进行分解和消化。你可能已经开始分离特定的关系，并思考可以用来传达特定高层次概念（如供应商、地点和顾客）的名称和总体实体。你可能完全跳过了数据建模，而是专注于数据可以用来做什么以及如何做。这一切都很好，因为这意味着故事吸引了你的注意力。首先，我们来看看如何分解出具体的实体，然后我们再讨论数据如何被使用。


  ### 提取数据模型


  在高层次上，你可以使用故事来指导支持业务的核心实体之间的关系。本质上，CoffeeCo 为每位*顾客*提供*产品*。产品从*供应商*处采购。每个供应商在一个或多个特定的*位置*运营。产品在多家*门店*销售，每种产品在一个或多个*位置*有库存。顾客体验可以通过每位顾客消费实体产品的*评分*来追踪。每家门店的体验可以通过*顾客评分*来评定。评分作为一种结构，可用于生成个性化的体验，该体验会随着时间的推移为每位顾客进行适应和学习。


  一旦提取出高层次实体，你可以通过讲述它们的子故事来进一步分解每种类型。正如你将看到的，这个过程可以直接从故事中产生一个良好的数据模型。


  #### 顾客


  *顾客*与一个账户标识符相关联。每个账户基于一个随机分配的 UUID 进行唯一标识，该 UUID 可以在账户创建时在线生成，也可以在门店购买时通过二维码提供给顾客。当顾客完成注册并将他们的账户身份与友好的移动应用程序关联后，顾客账户即变为激活状态。这需要顾客的姓氏、名字以及电子邮件地址。


  ```

  case class Customer(

  active: Boolean,

  created: Timestamp,

  customerId: String,

  firstName: String,

  lastName: String,

  email: String,

  nickname: String,

  membership: Membership,

  preferences: Preferences

  )

  ```


  此客户数据模型用于规划基线信息以及关系，例如 `Membership` 和 `Preferences` 的情况。这些是对客户的占位关系，可以在数据建模之旅的后续阶段进行组合。




  ##### 门店


  顾客在各门店购买咖啡产品。每个门店都关联一个唯一标识符，每个地点还包含开业日期、物理位置（如地址、经度和纬度）以及营业时间等附加信息。此外，每家门店都有最大客容量和额外设施，例如户外座位、得来速服务等。在考量门店之间的差异时，每日菜单是一个重要因素。菜单包含可供选择的咖啡、价格等等内容。


  ```

  case class Store(

  alias: String,

  storeId: String,

  capacity: Int,

  openSince: Timestamp,

  openNow: Boolean,

  opensAt: Int,

  closesAt: Int,

  storeInfo: StoreInfo,

  location: Location

  )

  ```


  与客户数据模型类似，关于`StoreInfo`、`Location`和`Menu`数据模型，我们也留下了一些线索供后续练习。我们将在下一节中进一步探讨这些内容。


  ##### 商品、货物与单品


  每个产品都是一个待售货物单元。在这种情况下，可供出售的品类远不止咖啡。每种在售产品类型都有唯一的标识符、一个可作为人类可识别名称的友好名称或别名，以及单位成本。考虑到你可以出售一杯、一壶、速溶咖啡、新鲜烘焙咖啡以及其他散装商品，你需要在此进行抽象思考。鉴于每种在售产品都列在菜单上，并且
  Scala 有一个核心`Product`类，我们将此模型命名为`Item`。


  ```

  case class Item(

  itemId: String,

  availability: Availability,

  cost: Int,

  name: String,

  points: Int,

  vendor: Vendor

  )

  ```


  鉴于产品具有通用可用性、季节性可用性，甚至地理可用性，我们可以将产品的可用性建模为`Item`案例类的一个子资源。`Vendor`信息也是如此。这使我们能够处理数据，并允许数据模型随时间演变。


  ##### 供应商


  CoffeeCo 与来自世界各地的各种供应商合作。供应商提供商品和服务，从种植和生产季节性咖啡品种的农场，到为每家门店销售杯子和小饰品的制造商，不一而足。本书中我们只处理与咖啡相关的数据，但值得思考未来如何扩展数据模型，这样你就不必费力处理大量最终大同小异的各种数据模型。


  ```

  case class Vendor(

  active: Boolean,

  name: String,

  location: Location,

  vendorId: String

  )

  ```


  你可能已经注意到，每个供应商有一种或多种产品，而每种产品只有一个供应商。这让你可以决定在处理特定管道时如何关联数据。考虑到每个供应商也可能在多个地点运营，将供应商绑定到单个地点可能会引发问题。你可能需要引入*运营点*的概念。供应商可以在不同地点拥有多个运营点，生产不同的产品。这个问题供你思考。


  ##### 位置


  位置是一个抽象概念，涉及一个起点。考虑到企业是在特定地点运营的，无论是在线上还是现实世界中，`Location`数据模型也是如此。该数据模型包含许多位置需求所通用的信息。


  ```

  case class Location(

  locationId: String,

  city: String,

  state: String,

  country: String,

  zipcode: String,

  timezone: String,

  longitude: String,

  latitude: String

  )

  ```


  `Location`数据有助于关联系统内客户行为的趋势和模式。以 CoffeeCo 为例，这些位置数据可用于了解哪些供应商生产某位顾客特别喜欢的某种风格的咖啡。这些数据也可用于了解哪些门店为大多数顾客提供了最佳体验，以及物理位置是否起着关键作用。有时，只需将户外座位、晴朗天气和良好的过往人流结合起来，就能照亮某人的一天。


  ##### 评分


  CoffeeCo 故事中的最后一个数据模型是*评分*。鉴于评分是由顾客针对特定门店或产品给出的，我们可以使用一个评分系统来大体上跟踪这些信息。为简单起见，我们可以像许多系统一样，从基础开始。请记住，你随时可以在日后增加复杂性。


  ```

  case class Rating(

  created: Timestamp,

  customerId: String,

  score: Int,

  item: Option[String],

  store: Option[String]

  )

  ```


  评分数据模型被分解为灵活的格式，为评分系统提供了一个框架。这包括支持基于产品或门店的评分，这些评分被记录为单个顾客的评分。


  ### 练习 7-1：总结


  将故事转化为数据的过程，其历史几乎与人类在洞穴中绘画一样悠久。想想看，一图胜千言（好吧，不总是这样，但你明白我的意思），定义良好的数据模型可以用类似的方式来捕获数据，无论是高分辨率的细节，还是仅仅作为对过去情况的概要。本练习旨在帮助你概念化数据建模过程，并思考数据的组成方式。


  ## 从数据模型到数据应用


  现在，你们期待已久的时刻到了。是时候开始编写你们的第一个主要 Spark 应用了。这个过程将教会你如何架构和编写可测试的应用代码，你可以将其作为今后编写无数应用的蓝图。本练习的源代码可在章节材料中找到。


  练习材料


  你可以在本书 GitHub 资源（位于 [`https://github.com/newfront/spark-moderndataengineering`](https://github.com/newfront/spark-moderndataengineering)）的
  `ch-07/` 文件夹中找到本章的材料。


  ### 每个应用都始于一个想法


  你需要构建一个新的数据管道，该管道将摄取顾客评分，并将每条评分与客户表进行关联，本质上执行的是一个美其名曰的 ETL 操作。然后，这些数据可以在下游进一步处理，以创建更复杂的数据集，例如每位顾客的偏好（或口味画像，或门店画像）。


  ## 想法


  经过一点头脑风暴，你为这些评分事件想出了一个简单的数据模型，并决定利用手头现有的工具快速测试一下。你问这些工具有哪些？好吧，你有你的 IDE（我偏爱 [IntelliJ](https://www.jetbrains.com/idea/)），并且能够重用本地的
  Docker 环境来快速行动并测试你的想法。


  然而，你需要一个行动计划。你需要它，这样你才能为验证你的想法设定一个时间范围。这就是应用蓝图的用武之地。如果你想一想直到现在你在 Zeppelin 环境中完成的工作，那么你可以将下一步视为将你的笔记本或工作流固化为一个编译后的应用的一种方式。


  ### 练习 7-2：Spark 应用蓝图


  Spark 应用蓝图是创建应用所需的框架或样板代码。这包括编译和组装一个功能完整的 Spark 应用所需的一般布局、配置和构建设置。


  作为一般经验法则，你的每个 Spark 应用每次都应以相同的方式布局。这创建了一种一致的工作方式，并为你和所有编写应用的人提供了一个类似的参考框架，用于查找配置文件的位置，以及关于如何构建和运行应用的预期。




  #### 默认应用程序布局


  打开项目代码（位于`ch-07/app`），您将看到清单 7-2 所示的目录结构和配置文件。


  > **注意**：如果您已经编写 Java 和 Scala 应用程序一段时间，可以直接跳到“通用 Spark 应用程序组件”部分。接下来的内容是应用程序目录结构的概述。


  ```

  app/

  conf/

  local.conf

  project/

  build.properties

