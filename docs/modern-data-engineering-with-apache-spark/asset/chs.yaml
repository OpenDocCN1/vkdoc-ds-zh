  \ (1) *活动主节点* 协商，根据应用设置（或集群默认设置）中关于运行分布式工作负载所需的总资源（核心/内存）来 (2) *分配执行器*。在此示例中，我们设置了\
  \ 16 个总核心的限制，指示集群资源管理器（Standalone 模式下的活动主节点）为该应用分配四个 Worker 中的两个。至此，Spark 集群的 50%\
  \ 被分配出去，另外 50% 为空闲。一旦执行器通过 `SparkContext` 分配给 Spark 驱动程序，驱动程序就不再需要与主节点通信，除非有执行器丢失（服务器宕机或\
  \ JVM 因内存不足而退出），或者启用了 `spark.dynamic.allocation` 并且应用向集群请求或归还资源。\n\n这也意味着，当前集群设置可以轻松处理已分配执行器中断（例如两个\
  \ Worker 同时离线）的故障场景。驱动程序 (A) 只需向资源管理器（Spark 活动主节点）请求新的执行器即可——鉴于集群中还有两个完全空闲的 Worker，这个请求是可以被处理的。\n\
  \n我们再看图 14-5 中的例子，该图展示了第二个 Spark 应用加入共享集群的过程。为举例说明，第二个应用将采用以下部署设置。\n\n![](img/505711_1_En_14_Fig5_HTML.png)\n\
  \n**图 14-5** 共享集群上的 Spark 驱动程序多租户部署\n\n```\nspark.cores.max: 4\nspark.executor.cores:\
  \ 2\nspark.executor.memory: 4gb\n```\n\n第二个驱动程序将向集群中剩余的两个 Worker（它们还有可供调度的资源）请求资源。至此，所有\
  \ Worker 都被安排了执行器。好处是资源浪费更少（因为没有核心或内存被闲置），且集群中运行着不止一个应用；但另一方面，如果此时丢失一个 Worker，会发生什么呢？\n\
  \n在图 14-5 的场景中，如果集群丢失一个 Worker，结果取决于丢失的是哪一个。这里有两种情况。第一种，驱动程序 (B) 会完全运行在一个 Worker\
  \ 上，因为每个执行器配置了 2 个核心和 4GB 内存。为了继续运行，新的分配将被执行，工作负载转移到另一个有空闲资源的 Worker 上，也就是应用 (B)\
  \ 已有执行器正在运行的那个 Worker。\n\n第二种情况，如果驱动程序 (A) 丢失了一个 Worker，那么其配置文件所需的所有核心或内存（8 核心 x\
  \ 16GB 内存）就无法在集群中得到满足。这将导致应用 (A) 以降级状态运行，但至少它仍在运行。\n\n谈到计算资源的调度，一个很好的经验法则是为集群预留一些扩展空间。你可以通过以下方式实现：当集群资源调度超过\
  \ 75% 时添加新节点；采用自动扩缩组或基于云的规则（如 Amazon Elastic Kubernetes Service 中的托管节点组）；或者更改执行器设置，使每个执行器能够适应不同的配置。例如，将配置改为\
  \ 4 核 x 8GB，同时保持 16 个最大核心数不变，这样驱动程序 (A) 就会分布在更多 JVM 上，从而在丢失一个 Worker 时仍能正常运行，而不会进入降级状态。\n\
  \n只要有足够的资源来应对故障或扩展，动态分配过程就能实现更具弹性的伸缩。接下来，你将学习如何控制这个过程。\n\n**注意**\n\n下一章将介绍 Kubernetes\
  \ (k8s) 资源管理器，并学习如何以弹性可伸缩的方式启动 Spark 应用，这同样会用到动态分配。动态分配过程为 Spark 应用程序提供了一种协议，用于根据当前处理的数据量的起伏来请求或归还额外的资源。\n\
  \n\n\n### 使用动态资源分配弹性伸缩 Spark 应用\n\nSpark 应用的处理需求会动态变化，这些需求由执行器级别的资源（`cores`/`memory`/*`GPUs`）组成，并会随应用生命周期而改变。为了管理并行运行的众多应用的不同需求，动态分配允许每个\
  \ Spark 应用选择启用该功能，并定义适当的设置来控制如何释放和重新分配额外资源。表 14-2 列出了常见的 Spark 配置。\n\n**表 14-2.**\
  \ 使用动态分配为 Spark 应用启用弹性伸缩\n\n| 属性名称 | 默认值 | 功能说明 |\n| --- | --- | --- |\n| `spark.dynamicAllocation.enabled`\
  \ | `false` | 按条件选择是否启用动态资源分配。 |\n| `spark.shuffle.service.enabled` | `false` |\
  \ 要将执行器释放回 Spark 集群，Spark Worker 必须运行*外部 shuffle 服务*，这是动态分配的前提条件。即使执行器仍持有 Spark\
  \ 应用所需的部分 shuffle（数据），此服务也允许将其释放。 |\n| `spark.dynamicAllocation.minExecutors` |\
  \ `0` | 建议将此值设置为 `1` 或更高，以确保您的应用在等待可用 Worker 分配资源时不会因资源匮乏而停滞。 |\n| `spark.dynamicAllocation.maxExecutors`\
  \ | `INF` | 设置此值可以阻止应用请求集群中所有（可用的）执行器。 |\n| `spark.dynamicAllocation.schedulerBacklogTimeout`\
  \ | `1s` | 当有任务挂起时，驱动程序将等待此时间长度，之后才向主节点请求新的执行器。 |\n\n动态分配实现了对弹性伸缩工作负载的自动化管理，能够根据需求按需从集群请求和归还资源。根据作业（或应用）的优先级或预期表现，动态分配可以有效地管理跨共享计算集群运行多个共置（多租户）工作负载的成本。然而，在启用动态分配时，需要考虑每个应用的不同（动态）需求以及工作负载的优先级，因为很容易出现许多应用处于空闲等待状态，等待集群资源变得可用的情况。\n\
  \n对于 Spark Structured Streaming 应用，每个微批次往往以更频繁的方式处理更少量的数据，这与典型的基于大批次、一次性读取并处理大量数据的应用行为不同。是的，您也可以运行使用\
  \ `Trigger.Once` 的有状态批处理作业，但这需要仔细考虑应用的语义以及与应用性质相关的服务等级协议或优先级。\n\n鉴于 Structured Streaming\
  \ 应用始终在线的特性，动态分配和外部 shuffle 服务有时会干扰并损害您关键任务型流式应用的性能。有时，唯一阻碍应用以最高速度运行的是内部应用调度器，它控制着\
  \ Spark Driver 应用内运行的内部（作业）的并行度和处理模式。\n\n### 调度模式：FIFO 对比 FAIR\n\n默认情况下，Spark 应用以\
  \ *FIFO*（先进先出）调度模式运行。由于 Spark Structured Streaming 应用采用分而治之的策略处理一个或多个数据源的连续（无界）流，这些流通过微批处理范式（产生确定性、容错的数据集）被分块和分解，因此\
  \ Spark Driver 应用会努力确保每个微批次内的每个转换阶段，即由 `StreamingQuery`（例如 `spark.readStream...writeStream.start()`）定义的阶段，能够基于定义流式应用任务的\
  \ `QueryPlan` 获得优先级。\n\n那么，如果一个应用有多个 `StreamingQuery` 呢？在上一章中，您了解了 `SparkStructuedStreamingApplication`\
  \ trait，它包含了以下两个方法：`awaitTermination` 和 `awaitAnyTermination`。\n\n```scala\ndef\
  \ awaitTermination(query: StreamingQuery): Unit = {\n  query.awaitTermination()\n\
  }\ndef awaitAnyTermination(): Unit = {\n  sparkSession.streams.awaitAnyTermination()\n\
  }\n```\n\n在一个基本的 Spark Structured Streaming 应用中，通常只有一个上游源和一个下游汇。因此，对主 `StreamingQuery`\
  \ 调用 `awaitTermination` 将使 Spark Driver 应用保持运行，直到该 `StreamingQuery` 终止。对于 `FIFO`\
  \ 模式调度器来说，这种单一应用关注点是完全没问题的，因为只有一个主要关注点。\n\n然而，一旦您决定在方程式中引入第二个流式查询，您在每个微批次中就需要排队等待资源，这似乎不太公平，不是吗？\n\
  \n幸运的是，Spark 内置了一个 `FAIR` 调度器。这种执行模式允许并行共享资源。这使得单个 Spark 应用内的总资源分配更加均衡。\n\n####\
  \ `FAIR` 模式调度器\n\n您可以通过在驱动程序应用配置中设置调度器模式来选择使用 `FAIR` 调度器。\n\n```\nspark.scheduler.mode=FAIR\n\
  ```\n\n除了设置调度器模式之外，Spark 还要求您的应用使用分配文件定义一个或多个调度器池。\n\n```\nspark.scheduler.allocation.file=\"\
  s3a:///path/to/fair-scheduler.xml\"\n```\n\n调度器分配文件是一个简单的 XML 文件，用于定义一个或多个命名池，并为相应的池定义\
  \ `schedulingMode`、`weight` 和 `minShare` 选项。\n\n- **`schedulingMode`**: 此选项默认为 `FIFO`，但也可以设置为\
  \ `FAIR`。`FIFO` 会优先处理池中第一个被调度的工作负载，让额外的工作在队列中堆积。`FAIR` 会将工作均匀地分配到池资源中。\n\n- **`weight`**:\
  \ 池权重声明了在特定池上进行调度的优先级。此优先级默认为 `1`，可以设置得更高以创建用于调度的优先级池（类似于优先级队列）。\n\n- **`minShare`**:\
  \ 设置给定池的核心分配数量。调度器将首先尝试分配预定义数量的核心，以确保每个池在将任何额外的 CPU 核心资源分配到其余已定义的池之前，都拥有其应有的核心数量。\n\
  \n```xml\n<allocations>\n  <pool name=\"FAIR\">\n    <schedulingMode>FAIR</schedulingMode>\n\
  \    <weight>2</weight>\n    <minShare>2</minShare>\n  </pool>\n  <pool name=\"\
  FIFO\">\n    <schedulingMode>FIFO</schedulingMode>\n    <weight>1</weight>\n   \
  \ <minShare>1</minShare>\n  </pool>\n</allocations>\n```\n\n**代码清单 14-3.** `fair-scheduler.xml`\
  \ 分配文件示例\n\n代码清单 14-3 中的示例配置旨在进一步定义调度模式在各调度器池中的工作方式。由于驱动程序应用使用 `SparkContext` 调度工作，`FAIR`\
  \ 调度器可用于修改每个 `SparkSession`（重用同一 Spark 上下文）的行为，以管理和共享为 Spark 应用分配的公共集群资源池。\n\n\n\
  \n"
- '# Spark 调度器池与应用程序监控


  默认情况下，当 `spark.scheduler.mode` 设置为 `FAIR` 时，Spark 会将所有工作分配到 *default* 池。通过修改默认池配置，我们可以调整调度权重以优先处理默认（`FAIR`）池，或者划分不同的池用于在
  `FIFO` 或 `FAIR` 模式下运行低优先级工作负载。利用 `fair-scheduler.xml` 文件，您可以确保高优先级工作以公平（FAIR）方式进行调度。


  如果存在低优先级工作，或者处于共享环境（如 Zeppelin）中可能有多个并发会话时，您可以指定一个特定池专门用于低优先级工作。清单 14-4 中的示例展示了如何从现有的
  `SparkSession` 生成一个临时任务。


  ```

  // spark = SparkSession

  new Thread {

  val other: SparkSession = spark.newSession()

  other.sparkContext.setLocalProperty(

  "spark.scheduler.pool", "queued")

  other.sparkContext.setJobGroup("batch.job", "runs in thread", true)

  other.range(100)

  .write

  .format("console")

  .save()

  }

  清单 14-4

  为非关键、锦上添花的任务设置低优先级调度器池

  ```


  您可能会疑惑为什么要在新线程中生成一个新会话。嗯，答案其实很简单。在 `SparkContext` 上设置本地属性（`setLocalProperty`）的线程将使用分配给它的调度器池。如果我们在主线程（当前线程）上运行一个
  `StreamingQuery`，那么我们就需要划分出第二个线程来运行非关键工作。


  建议在阅读完“Spark 监听器”部分后，重新审视此边栏。您可以使用 `SparkApplicationListener` 或 `QueryListener`
  中提供的 `SparkSession` 来创建和调度临时查询，如清单 14-4 所示。鉴于 Apache Spark 及其众多连接器赋予您的丰富能力，您可以利用临时流程来创建响应式应用程序或控制事件驱动的子程序。


  对每个正在运行的 Spark 应用程序进行某种形式的监控和可观测性至关重要。如果不了解过去的情况，就很难衡量应用程序在构建和发布周期中的变化。希望您能在将应用程序首次发布到生产环境（如果它们是关键任务）之前，就开始捕获其指标。就此而言，有大量可用的（开箱即用的）指标可用于测量、记录和监控
  Spark 应用程序的性能与行为。您将了解两种更常见的 Spark 监听器接口（`SparkListener`、`QueryListener`）以及*Apache
  Spark REST 端点*提供的指标。结合这些能力，可以监控 Spark 应用程序的行为，并实现响应式的事件驱动警报。


  ## Spark 监听器与应用程序监控


  关于先有鸡还是先有蛋的争论由来已久。我无法回答这个问题，但监控 Spark 应用程序以及定义哪些指标对于衡量关键任务 Spark 应用程序的性能至关重要，这本身就是一门微妙的艺术。为每个应用程序确定关键绩效指标（KPI）会根据
  Spark 应用程序数据合同中定义的*服务水平指标（SLIs）、服务等级目标（SLOs）和服务等级协议（SLAs）*而变化。这些指标有助于定义和塑造每个应用程序的性能特征，并让您了解预期的行为（什么是正常的）。考虑到潜在的大型应用程序表面积以及各个组成部分，包括上游（数据源）和下游（数据接收器），最初可能很难回答关于指标的问题，但将其分解成组、识别所需的数据来源，然后逐步推进会有所帮助。


  从广义上讲，监控不仅关乎了解服务的运行方式，同样重要的是能够准确定位系统中出现问题的位置，并在发生故障时缩短平均恢复时间（MTTR），或者仅仅是为了更好地了解应用程序以确保其最佳行为。


  监控也有助于指导其他决策。如果这是您的第一次监控尝试，了解我们可以开箱即用地监控哪些内容也会有所帮助，尤其是在 Spark 方面。这要从监听开始。


  ### Spark 监听器


  `SparkListener` 类可以通过 `SparkSession` 的 `SparkContext` 对象添加到您的驱动程序应用程序中，或者通过应用程序配置使用
  `spark.extraListeners` 选项进行添加。


  ```

  // spark = SparkSession

  spark.sparkContext

  .addSparkListener(SparkApplicationListener())

  ```


  `SparkListener` 是用于接入运行时应用程序指标和 Spark 应用程序一般行为的主要候选者。此外，如果您需要对运行中的问题采取更具响应性的方法，监听器可以作为创建临时事件驱动控件的起点。


  清单 14-5 通过一个名为 `SparkApplicationListener` 的案例类扩展了 `SparkListener` 类。




  ```scala

  case class SparkApplicationListener()

  extends SparkListener {

  val logger: Logger = Logger.getLogger(classOf[SparkApplicationListener])

  val session: SparkSession = SparkSession.getDefaultSession.getOrElse {

  throw new RuntimeException("There is no SparkSession")

  }

  override def onApplicationStart(applicationStart: SparkListenerApplicationStart):
  Unit = {

  super.onApplicationStart(applicationStart)

  logger.info(s"app.start app.name=${applicationStart.appName}")

  }

  override def onJobStart(jobStart: SparkListenerJobStart): Unit = {

  super.onJobStart(jobStart)

  logger.info(s"job.start jobId=${jobStart.jobId} jobStart.time=${jobStart.time}")

  }

  override def onStageSubmitted(stageSubmitted: SparkListenerStageSubmitted): Unit
  = {

  super.onStageSubmitted(stageSubmitted)

  val stageInfo: StageInfo = stageSubmitted.stageInfo

  logger.info(s"stage.submitted stage.id=${stageInfo.stageId}")

  }

  override def onStageExecutorMetrics(executorMetrics: SparkListenerStageExecutorMetrics):
  Unit = {

  super.onStageExecutorMetrics(executorMetrics)

  val em: SparkListenerStageExecutorMetrics = executorMetrics

  logger.info(s"stage.executor.metrics stageId=${em.stageId} stage.attempt.id=${em.stageAttemptId}
  exec.id=${em.execId}")

  }

  override def onTaskStart(taskStart: SparkListenerTaskStart): Unit = {

  super.onTaskStart(taskStart)

  val ts = taskStart

  val taskInfo: TaskInfo = ts.taskInfo

  // taskInfo 包含丰富的状态和时序信息

  logger.info(s"task.start " +

  s"task.id=${taskInfo.taskId} task.status=${taskInfo.status} task.attempt.number=${taskInfo.attemptNumber}
  " +

  s"stage.id=${ts.stageId} stage.attempt.id=${ts.stageAttemptId}"

  )

  }

  override def onTaskGettingResult(taskGettingResult: SparkListenerTaskGettingResult):
  Unit = {

  super.onTaskGettingResult(taskGettingResult)

  logger.info(s"task.getting.result ${taskGettingResult.taskInfo.taskId}")

  }

  override def onTaskEnd(taskEnd: SparkListenerTaskEnd): Unit = {

  super.onTaskEnd(taskEnd)

  val te = taskEnd

  val taskInfo: TaskInfo = te.taskInfo

  val taskEndReason: TaskEndReason = te.reason

  val taskMetrics: TaskMetrics = te.taskMetrics

  logger.info(s"task.end task.type=${taskEnd.taskType} end.reason=${taskEndReason.toString}
  task.id=${taskInfo.taskId}" +

  s"executor.cpu.time=${taskMetrics.executorCpuTime}")

  }

  override def onStageCompleted(stageCompleted: SparkListenerStageCompleted): Unit
  = {

  super.onStageCompleted(stageCompleted)

  val stc = stageCompleted

  val stageInfo: StageInfo = stc.stageInfo

  //val stm: TaskMetrics = stageInfo.taskMetrics

  logger.info(s"stage.completed stage.id=${stageInfo.stageId} stage.completion.time=${stageInfo.completionTime.getOrElse(0)}")

  }

  override def onJobEnd(jobEnd: SparkListenerJobEnd): Unit = {

  super.onJobEnd(jobEnd)

  logger.info(s"job.end job.id=${jobEnd.jobId} end.time=${jobEnd.time}")

  }

  override def onExecutorAdded(executorAdded: SparkListenerExecutorAdded): Unit =
  {

  super.onExecutorAdded(executorAdded)

  }

  override def onExecutorMetricsUpdate(executorMetricsUpdate: SparkListenerExecutorMetricsUpdate):
  Unit = {

  super.onExecutorMetricsUpdate(executorMetricsUpdate)

  }

  override def onExecutorRemoved(executorRemoved: SparkListenerExecutorRemoved): Unit
  = {

  super.onExecutorRemoved(executorRemoved)

  }

  override def onEnvironmentUpdate(environmentUpdate: SparkListenerEnvironmentUpdate):
  Unit = {

  super.onEnvironmentUpdate(environmentUpdate)

  }

  override def onOtherEvent(event: SparkListenerEvent): Unit = {

  super.onOtherEvent(event)

  }

  override def onApplicationEnd(applicationEnd: SparkListenerApplicationEnd): Unit
  = {

  super.onApplicationEnd(applicationEnd)

  logger.info(s"application.ended end.time=${applicationEnd.time}")

  }

  }

  ```


  **列表 14-5** `SparkApplicationListener` 案例类


  列表 14-5 中的案例类继承了 `SparkListener`，为进一步探索指标提供了一个简单的切入点。事件的顺序很重要。每个作业启动并产生一个或多个阶段，这些阶段将任务分发给分配给应用程序的执行器。能够跟踪失败任务或失败阶段的比率，可以使你从高层次上深入了解应用程序的运行时行为。


  举个具体的例子，你可以直接在 Spark 单元测试中观察 `SparkApplicationListener`，以查看应用程序运行时生成的事件。尝试启用位于 `TypedRevenueAggregatesSpec`（来自第
  13 章）中的监听器。只需取消注释该行并运行应用程序单元测试，即可观察实际效果。


  ```scala

  val testSession = SparkTypedStatefulAggregationsApp

  .sparkSession

  .newSession()

  testSession.sparkContext

  .addSparkListener(SparkApplicationListener())

  ```


  `SparkListener` 可用于通过 [`stats.d`](https://github.com/statsd/statsd) 发布指标。结合你内部的指标系统，或使用
  [DataDog](https://www.datadoghq.com/) 等付费服务，你可以存储与应用程序运行时相关的重要指标。


  **提示**：应用程序指标可通过 Spark 应用程序驱动程序上的 metrics REST API 从 Driver 应用程序 UI（默认端口 4040）获取。请使用官方“Spark
  监控”文档，查看可用于通过驱动程序和独立主进程消费指标的各种 API。


  除了主要的 `SparkListener` 之外，还有一个有用的类可用于向应用程序添加控制流，称为 `StreamingQueryListener`。




  ### 使用 `StreamingQueryListener` 观察结构化流行为


  `StreamingQueryListener` 用于观察 `SparkSession.streams` 对象，可以接入驱动程序管理的所有 `StreamingQuery`
  实例。该监听器追踪的三种可观察状态分别对应所有流查询的 `started`（启动）、`progress`（微批次完成）和 `termination`（终止）事件。


  代码清单 14-6 继承了 `StreamingQueryListener`，并提供了示例方法实现、监听器接口方法名称以及事件对象。为帮助您入门，它演示了如何接入部分事件元数据以增强日志记录。


  ```

  case class QueryListener() extends StreamingQueryListener {

  val logger: Logger = Logger.getLogger(classOf[QueryListener])

  val session: SparkSession = SparkSession.getDefaultSession.getOrElse {

  throw new RuntimeException("没有可用的 SparkSession")

  }

  override def onQueryStarted(event: StreamingQueryListener.QueryStartedEvent): Unit
  = {

  logger.info(s"query.started stream.id=${event.id} stream.name=${event.name} " +

  s"stream.run.id=${event.runId} stream.start.time=${event.timestamp}")

  }

  override def onQueryProgress(event: StreamingQueryListener.QueryProgressEvent):
  Unit = {

  val queryProgress: StreamingQueryProgress = event.progress

  val batchId = queryProgress.batchId

  val batchDuration = queryProgress.batchDuration

  val inputRowsRate = queryProgress.inputRowsPerSecond

  val processedRowsRate = queryProgress.processedRowsPerSecond

  val outputRowsPerBatch = queryProgress.sink.numOutputRows

  val progressSummary = queryProgress.prettyJson

  logger.info(s"query.progress stream.id=${queryProgress.id} stream.name=${queryProgress.name}
  " +

  s" batch.id=$batchId batch.duration=$batchDuration" +

  s" rate: input.rows.per.second=$inputRowsRate processed.rows.per.second=$processedRowsRate
  " +

  s" sink.output.rows.per.batch=$outputRowsPerBatch " +

  s"\n progressSummary=$progressSummary")

  }

  override def onQueryTerminated(event: StreamingQueryListener.QueryTerminatedEvent):
  Unit = {

  if (event.exception.nonEmpty) {

  logger.error(s"query.terminated.with.exception exception=${event.exception.get}")

  // 决定后续操作

  } else {

  logger.info(s"query.terminated stream.id=${event.id} stream.run.id=${event.runId}")

  }

  }

  }

  代码清单 14-6

  StreamingQueryListener 使您能够观察结构化流应用程序的运行时行为

  ```


  `QueryListener` 类可用于监控任何结构化流应用程序。与 `SparkApplicationListener` 类似，您可以使用第 13 章的 `TypedRevenueAggregatesSpec`
  来测试 `QueryListener`。


  ```

  testSession.streams.addListener(QueryListener())

  ```


  现在您有了直接设置断点并插入创造性控制流的方法，以应对各种进度或终止事件。通过采用测试驱动的方法来理解 `QueryListener` 的能力，您可以在 IDE
  中轻松创建更好的测试来驱动意外行为。


  最终，查询观察是一项有助于确保应用程序持续按预期运行的功能。通过扩展监听器，您可以收集重要的流式指标（输入和处理速率），从而了解应用程序的运行状况。


  最后请注意，代码清单 14-5 中的 `SparkApplicationListener` 和代码清单 14-6 中的 `QueryListener` 都直接运行在
  Spark Driver 上。了解这一点后，您可以在应用程序出现异常时，编写连接到 Slack 或 [PagerDuty](https://www.pagerduty.com/)
  的钩子，或者利用 `SparkSession` 句柄（两个示例监听器类中都可用）来触发基于事件的子程序。例如，使用 `QueryListener`，您可以根据活动查询进程的原因（异常）主动停止所有正在运行的查询并优雅地关闭故障驱动程序。代码清单
  14-7 展示了 `QueryListener` 的钩子，让您了解如何接入事件来控制应用程序。终止 `StreamingQuery` 的异常可能是可恢复的。否则，您可能需要关闭应用程序。


  ```

  // QueryListener

  def resetTerminated(): Unit = {

  session.streams.resetTerminated()

  }

  def haltAllStreams(): Unit = {

  session.streams.active.foreach { query =>

  logger.info(s"stream.stop name=${query.name} stream.id=${query.id}")

  query.stop()

  }

  }

  def shutdown(): Unit = {

  haltAllStreams()

  session.sparkContext.cancelAllJobs()

  session.stop()

  }

  override def onQueryTerminated(event: StreamingQueryListener.QueryTerminatedEvent):
  Unit = {

  if (event.exception.nonEmpty) {

  logger.error(s"query.terminated.with.exception exception=${event.exception.get}")

  if (exception.is.recoverable) {

  resetTerminated()

  } else {

  shutdown()

  }

  }

  }

  代码清单 14-7

  使用 QueryListener 响应 StreamingQuery 中接收到的异常

  ```


  代码清单 14-7 接入 `StreamingQueryManager` 和 `SparkContext`，以重置任何已终止的流或停止任何额外的流查询。然后显式调用取消所有活动作业（给打开的和活动的作业时间优雅地停止和清理）。代码最后要求驱动程序应用优雅关闭。选择何时停止应用程序，对于保护下游应用程序免受损坏数据或其他未知因素的影响至关重要。当遇到不可恢复的异常时，通常更好的做法是让应用程序失败并通知应用程序所有者，因为知道这（可能并且很可能会）在短期内导致流量阻塞，但这可以保护任何下游系统免受运行中数据问题的影响。


  有许多策略可以确保应用程序无论环境如何变化都能持续运行。了解让应用程序保持稳定的正确模式需要耐心和实践，但有了合适的工具，就可以更容易地实现自动化恢复，并直接在应用程序中广播需要知晓的事件（在它们崩溃之前）。


  ### 监控模式


  连接到指标聚合器（如 [Prometheus](https://prometheus.io/) 或 [DataDog](https://www.datadoghq.com/)）的连接器可以整合到您的
  Spark 监听器中，从而创建由驱动程序发出的可观测性中心点。这比监控和观察所有执行器更好，因为异常信息和执行器指标最终会传回驱动程序，然后可以通过 `SparkApplicationListener`
  接入。


  您的应用程序发出的指标——通过 Spark 监听器接口或 Spark 内部收集并通过 JMX 或 REST 接口提供的指标——可用于驱动仪表盘和其他警报系统。此外，一旦操作指标开始流动，您就可以使用应用程序的历史指标来确保它们在新版本发布到生产环境后仍能保持同样好或更好的性能。这些先前的观察（历史指标）有助于确保对每个应用程序的更新和升级（例如错误修复或性能调优的结果）可以被监控和衡量，从而保持您的
  SLA、SLO 和 SLI 处于受控状态。


  ### Spark 独立集群与应用迁移策略


  互联网上充满了最佳实践和建议。在 Spark 独立集群上运行多租户应用程序时，最好制定一个迁移应用程序和集群组件的策略，以最大程度地减少停机时间。




  ### 反模式：心存侥幸


  部署和滚动（按比例替换）服务器集群的工具已经存在一段时间了。其中一种很快失效的模式是针对 Spark Worker 的“滚动并祈祷”方法。如果您正在运行结构化流式处理应用程序，您将不断中断正在运行的驱动器应用程序，而应用程序可以处理间歇性暂停、请求新的执行器、分配以及重建任何丢失的应用程序状态。持续中断的过程，例如每五分钟滚动
  5% 的 Worker，可能会侵蚀服务等级协议（SLA）。当机器上线或下线时，应用程序中断可以自然处理，但通常更好的方法是启动一个替代的 Spark Standalone
  集群并迁移应用程序（具体取决于延迟和您的工具）。


  ### 最佳实践


  1.  创建一个新集群。

  2.  将现有应用程序迁移到新集群（根据 SLA 从优先级最低的应用程序开始反向启动）。

  3.  关闭之前的集群（如果您不再需要计算资源：走向绿色）。


  这是一份最佳实践清单，因为 Spark 应用程序及其运行的集群会进行更新，以处理新版本的 Apache Spark、Java、Scala 以及其他 Python
  或系统依赖项，同时修补应用程序配置或 Master、Worker 和 Driver 上的全局设置。最好了解这些更改如何影响性能，因此，在您对此过程感到得心应手之前，请使用“矿井中的金丝雀”技巧，优先迁移最低公共分母（风险最低）的应用程序。


  接下来，您将了解可用于监控 Spark 应用程序性能和行为的事件监听器。


  ### 关于容器和 Spark Standalone


  Spark Standalone 可以使用容器运行，但这超出了本书的涵盖范围。本质上，您可以使用来自第 11 章中运行 Kafka 集群的 Zookeeper
  容器（应已缓存）。然后，您必须修改 Spark Master 和 Worker 的环境变量（`spark-env.sh`），为每个组件分配一个唯一的主机名（例如
  `spark-master1`、`spark-master2`、`spark-worker1`、`spark-worker2`、`spark-worker3`），或者重用
  Docker 网络（`mde`），或者创建一个名为 `spark` 的新网络。这将实现 Spark 集群组件与 Spark Driver 应用程序之间的跨集群通信。


  Apache Spark 官方文档涵盖了“为网络安全配置端口”，可用于查看端口需求以配置防火墙规则。例如，Spark Driver 应用程序需要对 7077 端口的
  Spark Master 进行入站访问，以提交（部署）应用程序。Spark Master 还暴露了一个可选的基于 REST 的服务，该服务在端口 6066 上运行，可用于接受在集群中运行的远程作业。对于
  Spark Master，其用户界面（UI）默认在端口 8080 上运行；Spark Worker 在端口 8081 上公开 UI；每个 Driver 应用程序在端口
  4040 上运行一个 UI。Driver 端口可以通过设置 `spark.ui.enabled: false` 来关闭，以节省 Driver 的处理开销，或限制用户访问应用程序日志的方式。


  ## 托管 Spark


  本章讨论了用于构建 Spark 集群以及接入 Apache Spark 应用程序操作指标的架构组件和 Spark 类。您可能想知道为什么没有讨论使用 [Apache
  Spark on Amazon EMR](https://aws.amazon.com/emr/features/spark/) 或 [Databricks](https://databricks.com/)
  来简化运行 Spark 应用程序的过程，从而避免所有麻烦。使用任一平台都可以大大减少启动和运行所需的工作量，应在您的短期和长期业务规划中予以考虑。本书采用开源方法（从各方面来看）作为揭开其神秘面纱的一种方式。目标是让任何人都能免费了解
  Spark 并学习现代数据平台的支柱（不包括笔记本电脑和书籍）。


  ## 总结


  Spark Standalone 集群更常见的是使用传统的 Linux 部署和 DevOps 模式来运行，包括用于创建和布局文件系统的引导脚本，以及使用 Yum
  和 Apt-Get 等 Linux 包管理器来搭建运行时环境。在没有明确划分应用程序进程、CPU 分配和内存限制（又名 cgroups）的情况下运行多租户服务器环境各有利弊——主要是您可以绕过容器，依靠传统的
  RPM 包来管理运行时安装的内容。


  根据您平台支持的应用程序的要求，通常存在一些叠加挑战，与运行多个版本的 Java（支持 Java 8 和 Java 11）、多个版本的 Scala（2.12、2.13）、处理
  PySpark 的原生需求，或者在无容器环境下调试性能下降时哪个进程是罪魁祸首有关。


  最后一点，虽然在同一台机器上支持多个版本的 Spark 也是可能的，但这可能是一场管理噩梦。更简单的做法是使用将在集群中运行的工作负载的共同依赖项运行一个 Standalone
  集群，并根据性能特征和可伸缩性（扇出、扇入）需求，为将在集群中运行的工作负载划分出隔离的集群。如果这听起来需要很多工作，确实可能如此，但您也可以使用 [Chef](https://chef.io/)
  或 [Terraform](https://www.terraform.io/) 等框架自动化许多细微差别。


  考虑到本书主要采用容器驱动的方法编写，并且考虑到容器从操作角度提供了延续到 Spark 运行时的一致性和可靠性，我们旅程的终点最有可能是将 Spark 应用程序部署到
  Kubernetes 上。（*实际上，您从第* 7 *章开始构建的应用程序都可以使用 Spark on Kubernetes 运行。*）我们将在剩下的时间里学习如何在
  Kubernetes 上运行关键任务应用程序。




  '
- '# 15. 在 Kubernetes 上部署关键任务型 Spark 应用


  在深入探讨什么是 *Kubernetes* (K8s) 以及 *Apache Spark* 如何融入分布式 K8s 生态系统之前，有必要先简单明确一点：*Kubernetes
  使得 Apache Spark 应用能够在隔离环境中运行，它将弹性可扩展性与容器的运行时一致性相结合，共同部署在称为* *pods*（你很快就会了解）的独立微环境中。最终，你可以依赖一致的运行时环境，而无需处理在共享一切生态系统中多租户带来的烦恼和诸多困难。相反，可以想象每个应用程序都在自己独立的世界中运行，从高层次上看，这类似于你使用
  `docker-compose` 在本书一直在构建的本地数据平台上运行 Spark 应用所使用的本地环境。


  细节中常常隐藏着魔鬼，但许多源于在生产集群中运行 Apache Spark 应用的常见痛点（我们在上一章中看到过），例如集群范围内资源竞争的问题、大型多租户集群的（向上或向下）扩展问题，或者从更高层面看，甚至运行一个或多个物理
  Spark 集群的问题，都简单消失了。取而代之的是，每个 Spark 应用都被部署并自动连接，即搭建（并运行）其完全独立的 Spark 集群（按需），这些集群由编排在支撑你
  Kubernetes 集群的物理节点之上的 pods 组成。通过移除运行独立集群和管理其中运行的应用所需的众多活动部件，你可以转而关注每个应用的独立需求，并将其余部分通用化。


  Kubernetes，在 *Apache Spark Kubernetes 资源管理器* 的支持下，为你的关键任务型 Spark 应用提供动力。


  在本章中，你将学习如何在 Kubernetes 上部署 Spark 应用。此外，你还将看到如何利用 K8s 部署提供的固有幂等性，并结合资源请求与限制（例如 CPU
  和内存分配）。你还将学习 Spark 的动态分配如何发挥作用，为你自组装的 Apache Spark 应用增添超能力。到本章结束时，你将亲眼目睹 Apache
  Spark on Kubernetes 如何协同工作以满足任何数据平台的各种需求，以及 Kubernetes 如何融入现代数据生态系统。让我们开始吧。


  ## Kubernetes 入门


  用他们自己的话说，“Kubernetes 是一个用于自动化部署、扩展和管理生产级容器化应用的开源系统。”简而言之，Kubernetes 是一个可靠的编排框架，它提供分布式计算和资源调度即服务，建立在隔离性、一致性和可靠性这些首要原则之上。它还恰好拥有丰富的
  API，在规模化运营应用和服务时，可以利用这些 API 实现更智能的决策和灵活性。


  本书在教你架构和构建使用 Apache Spark 的容器化应用时，已逐渐将你引入容器的世界。你学会了如何使用 Docker、Docker Compose 和
  Docker 网络来运行应用并编排本地工作流。每个工作流都需要设置和引导定制的、特定于应用的环境，以支持书中处理的众多数据工程用例。这些用例范围从常见的数据处理工作流（如
  ETL/ELT），到作业调度和编排，再到架构和构建可插拔（可组合）、配置驱动的 Spark 流水线应用。


  此前的每一章都像是这段旅程中的向导，深入探讨数据工程生态系统的特定方面，引导你沿着一条精选路径，了解最重要的（需要掌握的）工具和技术、思维模型以及架构，为你提供优雅且巧妙地解决流式处理问题所需的技能。所有前面的章节都在为这里做准备，作为通往
  K8s 革命旅程中的进化步骤，以及我们一起度过的最后一章。


  这最后一章分为两个主要部分。在第一部分中，你将在本地开始[Kubernetes](https://kubernetes.io/)入门。你将在构建环境的同时，动手学习常用的组件和资源
  API。之后，在第二部分中，你将学习如何在 K8s 上部署你的 Apache Spark 结构化流式处理应用。本章以后续步骤和建议作为总结，让你能够将本地学到的所有内容应用到云端，并从此继续前进。


  练习材料


  第 15 章的练习材料位于 [`https://github.com/newfront/spark-moderndataengineering/tree/main/ch-15`](https://github.com/newfront/spark-moderndataengineering/tree/main/ch-15)。


  ## 第一部分：在 Kubernetes 上启动并运行


  你可以在不到一小时内开始在本地使用 Kubernetes。要全面拥抱整个生态系统并学习众多的 API 和最佳实践可能需要更长的时间，但有许多书籍（以及在线教程和视频）可以在更低的层次上引导你了解核心
  API。我们将转而介绍入门所需的基本知识，涉及绝对需要了解的结构、概念和范式。让我们开始并运行起来。




  '
- "# 使用 Minikube 驱动本地 Kubernetes\n\nMinikube 是一个易于使用的环境（及 Shell），能在虚拟机（Mac/Windows/Linux）中本地运行一个小型专用\
  \ Kubernetes 集群。安装说明可在线查阅[`https://minikube.sigs.k8s.io/docs/start/`](https://minikube.sigs.k8s.io/docs/start/)，若使用\
  \ macOS 系统，亦可运行`brew install minikube`进行安装。以下侧边栏提供了 minikube 基础命令的补充概览。若想深入了解，可稍后返回本节内容；否则，直接运行`minikube\
  \ start`即可启动运行。\n\n## Minikube 基础\n\n安装完成后，仅需少量命令即可高效操作 minikube。以下命令可在您选择的终端中运行。\n\
  \n### `minikube start`\n\n该命令会启动一个本地单节点 Kubernetes 集群，并自动下载安装所有额外依赖项。\n\n```\nminikube\
  \ start\n```\n\n默认情况下，minikube 虚拟机配备两个（CPU）核心和 2GB（RAM）内存。您可通过多种选项自定义安装并指定 K8s 集群的运行方式。例如，可选择\
  \ K8s 版本、分配给虚拟机的总内存以及 CPU 核心数。\n\n```\nminikube start \\\n--kubernetes-version v1.21.2\
  \ \\\n--memory 16g \\\n--cpus 4 \\\n--disk-size 80g\n```\n\n准备停止工作时，您可以选择保持虚拟机运行，仅暂停\
  \ k8s 集群中的进程；也可以选择完全停止集群并回收系统资源。\n\n### `minikube pause`\n\n暂停（Pause）是 minikube\
  \ 的一项创新功能。您不必完全关闭集群，而是可以选择暂停（冻结）特定资源（由命名空间管理）或暂停所有运行中的内容。暂停特定资源（如本地 Kafka 或 Redis）有助于观察应用程序在服务丢失时的行为表现。\n\
  \n```\nminikube pause -A\nminikube pause -n kafka,redis\n```\n\n### `minikube unpause`\n\
  \n此前暂停的所有容器均可取消暂停。\n\n```\nminikube unpause -n kafka, redis\n```\n\n若本地系统资源有限，使用`pause`和`unpause`可以成为救命稻草；此外，它们还提供了一种简单机制，可让您恢复至特定的环境配置。这与使用`docker\
  \ compose`确保 Spark 应用运行所需系统服务可用的方式类似。\n\n### `minikube stop`\n\n当您决定完全停止所有内容并关闭物理虚拟机时，只需使用`stop`命令。\n\
  \n```\nminikube stop\n```\n\n### `minikube status`\n\n您将不时需要检查 minikube 虚拟机的状态。只需运行`status`命令即可查看环境状态。\n\
  \n```\nminikube status\n```\n\n至此，minikube 基础速览结束。如需回顾任何基本命令，可返回本节查看。\n\n拥有了本地（单节点）Kubernetes\
  \ 集群，您即可开始搭建运行 Spark 应用所需的基础框架。\n\n## Kubernetes API 实践之旅\n\n使用任何新工具时，首要目标是理解或至少熟悉其核心运行部件。就\
  \ Kubernetes 而言，这意味着理解核心服务、概念和组件。在本节中，您将使用 minikube 安装的`kubectl`直接与 Kubernetes API\
  \ 交互。\n\n> **提示**\n>\n> 若需在笔记本电脑上支持多个版本的`kubectl`（用于测试或其他目的），可使用`minikube kubectl\
  \ --`将命令转发至 minikube 虚拟机内部的`kubectl`。\n\n让我们从核心概念——*节点*开始。\n\n## 节点\n\n[节点](https://kubernetes.io/docs/concepts/architecture/nodes/)是\
  \ Kubernetes 集群中可扩展性的核心单元。节点通过集群管理器（K8s 主节点）独立注册并加入集群。新加入的节点通过扩展总可调度资源（CPU 核心和内存）来提升集群的水平扩展能力。同样，退出集群的节点（关闭或故障）会减少集群的总资源，从而实现松耦合的弹性扩展。\n\
  \n## 常见节点服务与职责\n\n集群中的每个节点至少包含三个组件：*kubelet*、*kube-proxy*和*容器运行时*。\n\n### `kubelet`\n\
  \n`kubelet`是一个代理程序（运行在每个节点本地），负责确保节点能够执行其主要目标——保证所有容器在其各自的 Pod 中持续运行。\n\n### `kube-proxy`\n\
  \n`kube-proxy`是一个代理进程，运行在集群的每个节点上。它负责维护网络规则，用于转发进出由`kubelet`管理的 Pod 的数据包。这一关键服务实现了节点级别应用程序与服务之间的集群范围通信，并参与服务层，使外部请求能够被转发至\
  \ Pod 中运行的容器。\n\n### 容器运行时\n\n*容器运行时*是一个可插拔接口，扩展了*Kubernetes 容器运行时接口*（CRI）。它支持 Docker\
  \ 及其他流行的容器运行时。这三个组件——`kubelet`、`kube-proxy`和*容器运行时*——协同工作，支撑集群中的工作负载。它们通过确保每个节点与集群保持松耦合，并主要关注本地的隔离问题（而非集群范围的问题）来实现这一点。\n\
  \n## 查看所有集群节点\n\n要列出集群中的所有可用节点（使用 minikube 时默认有一个节点），可通过`kubectl`对*节点资源*使用`get`动词。\n\
  \n```\n% kubectl get nodes\nNAME       STATUS   ROLES                  AGE   VERSION\n\
  minikube   Ready    control-plane,master   64m   v1.21.2\n```\n\n获取到指定节点的唯一节点*名称*后，使用`describe`*动词*查看该节点的元数据。\n\
  \n```\n% kubectl describe node minikube\n```\n\n`describe node`命令的结果会提供该节点的所有可用信息，包括节点\
  \ IP 地址（主机名）、标签（可视为标签）、注解，以及可用和已使用的节点资源（核心/内存等）。我建议当集群中运行更多服务时，再次使用此命令。毕竟，集群中只有一个本地节点时，所有\
  \ Pod 和进程都将被调度到该节点上。接下来是*命名空间*。\n\n## 命名空间\n\n命名空间发挥着至关重要的作用：它能够保护并隔离服务组，防止用户误操作；在多团队（多人）于单个联邦\
  \ Kubernetes 集群中运行多种工作负载时，实现关注点分离；并可控制对受保护资源（如命名空间范围内的密钥、计算和存储分配）的访问，防止资源枯竭。\n\n\
  根据团队或公司的需求，您可以决定如何管理生产集群。不过，在运行本地开发集群时，我发现按上下文和所有权分离服务非常有用。例如，数据库和其他数据服务位于`data-services`命名空间，而\
  \ Spark 应用程序则位于另一个命名空间。通过这种方式，您可以有效隔离运行 Spark 应用程序所需的依赖服务，使其与 Spark 应用运行的命名空间分开。\n\
  \n> **提示**\n>\n> 在 minikube 中，命名空间还可用于暂停或取消暂停该命名空间中的所有 Pod：`minikube pause -n data-services`。使用此技术可观察\
  \ Spark 应用程序的容错能力。\n\n接下来，您将创建`data-services`命名空间。\n\n\n\n### 创建命名空间\n\n在创建命名空间（以及\
  \ Kubernetes 中的大多数资源和服务）时，你有两种选择。你可以直接使用 `kubectl`，也可以提供一个可应用的外部资源配置文件。\n\n使用命令行，执行以下\
  \ `create` 命令。\n\n```\n% kubectl create namespace data-services\n```\n\n成功执行。你应该会看到\
  \ `data-services` 命名空间已被创建。你可以通过对 `namespaces (ns)` 资源使用 `get` 动词来检查可用的命名空间，以确认这一假设。\n\
  \n```\n% kubectl get namespaces\n```\n\n结果将返回所有活跃命名空间的有序列表。现在，让我们删除刚刚创建的命名空间，以便稍后使用资源文件重新创建它。\n\
  \n### 删除命名空间\n\n通过 Kubernetes API 创建的资源，可以使用相应资源上的 `delete` 动词来销毁。\n\n```\n% kubectl\
  \ delete namespace data-services\n```\n\n接下来你将重新创建 `data-services` 命名空间，但这是一个重要的步骤，能让你学会以一种无压力的方式管理资源，因为一切都可以重新构建。\n\
  \n### 使用 Apply 创建 Kubernetes 资源\n\n打开你喜欢的文本编辑器（或 IDE），创建一个名为 `namespace.yaml` 的文件，如列表\
  \ 15-1 所示。\n\n```\napiVersion: v1\nkind: Namespace\nmetadata:\n  labels:\n    kubernetes.io/metadata.name:\
  \ data-services\n  name: data-services\nListing 15-1\nnamespace.yaml\n```\n\n现在，可以一致地使用\
  \ `kubectl` 的 `apply` 动词来创建该命名空间。\n\n```\n% kubectl apply -f namespace.yaml\n```\n\
  \n### 删除基于文件的资源\n\n任何使用 `apply -f {file}` 创建的资源，都可以使用同一个文件来删除。\n\n```\nkubectl delete\
  \ -f namespace.yaml\n```\n\n现在你已经看到了使用 `kubectl` 创建和删除资源的两种不同方式。\n\n> **注意**\n>\
  \ 你可能会想，既然命令行更快（也更简单），为什么有人会选择使用文件呢？这个决定可以归结为一致性。如果你希望在实现系统和服务的良好可移植性的同时，维护一个既能在本地轻松运行，也能在云端运行的生态系统，那么你需要一种*简单*的方法来重建（搭建）一个完整的工作环境，而这个过程始于一个持久的蓝图。\n\
  \n接下来，你将学习如何使用新创建的 `data-services` 命名空间，将 Redis 部署到你的 minikube 集群中。\n\n### Pod、容器和部署\n\
  \n我们将从一个关于 Pod 的快速介绍开始，然后进行练习。你将亲身体验 Pod 部署是如何工作的，并且作为副产品，你将了解什么是 Pod，以及容器是如何融入其中的。在此过程中，你将学会在容器级别管理集群资源。更棒的是，你还将了解如何使用持久卷来实现有状态（持久）存储。\n\
  \n在你着手将第一个 Spark Structured Streaming 应用部署到 Kubernetes 的过程中，所有这些步骤都是必要的。正如你将在本章第\
  \ 2 部分中发现的，Spark 为你做了很多神奇的事情，但如果不了解其组成部分，这种简单性可能会反过来困扰你。\n\n### 什么是 Pod？\n\nPod\
  \ 的名称源于自然。比如豆荚中的一颗豌豆，或者一群鲸鱼。在 Kubernetes 中，Pod 是最小的可部署计算单元。将 Pod 视为一个结构，它为一组一个或多个容器封装了一个隔离的环境，这组容器为底层组的共享资源提供运行时保护（可以想象成保护豌豆的豆荚壳）。这些共享资源包括本地网络（Pod\
  \ 内部网络，即 `localhost/127.0.0.1`）的共享，以及对共享存储（卷/磁盘空间）的本地访问。所有这些都有一个运行时保证：只有当所有资源请求（CPU/内存/存储）和其他特殊需求在所有容器上都完全满足时，Pod\
  \ 才会被成功调度。这是 Pod 被认为处于健康状态的必要条件。Pod 与节点的关系如图 15-1 所示。通用组件（本章前面已介绍）包括节点、kubelet、容器运行时和\
  \ `kube-proxy`，它们协同工作，运行 Pod，并将流量路由到 Pod 内的容器以及从这些容器路由出来。\n\n![](img/505711_1_En_15_Fig1_HTML.png)\n\
  \n**图 15-1** Pod 被调度到一个或多个节点上运行，并在物理节点上分配资源，由 kubelet 进程控制。\n\n由于每个 Pod 都有自己的本地范围，因此许多\
  \ Pod 可以被调度到同一个底层节点上运行，而无需担心在可寻址网络空间内发生冲突。此外，对全局用户空间中共享密钥或受限文件的节点级访问问题，可以在 Pod 级别进行管理，从而使安全性和关注点分离变得更加容易。Pod\
  \ 通过分离跨共享集群以及同一物理节点上运行的工作负载，引入了一种很好的范式。\n\n根据设计，在 Pod 中运行的容器不能打破隔离，也不能触及在同一节点上运行的其他\
  \ Pod。这从安全角度来看会引发担忧，而且也会破坏松耦合的概念，因为 Pod 首先需要知道其他 Pod 的存在。好的，这听起来很棒，但为了真正理解 Pod，我们将创建一个\
  \ Pod 规范来运行 Redis。\n\n### 创建 Redis Pod 规范\n\n在第 10 章中，你了解了通过 `docker compose` 运行\
  \ Redis。让我们重新回顾一下该章练习中 `docker-compose.yaml` 文件的 Redis 服务，然后将该配置转换为 Kubernetes Pod\
  \ 规范。列表 15-2 提供了第 10 章中的 Redis 服务。\n\n```\nservices:\n  redis:\n    image: redis:6.2\n\
  \    container_name: redis\n    hostname: redis\n    ports:\n      - 6379:6379\n\
  \    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval:\
  \ 5s\n      timeout: 30s\n      retries: 50\n    restart: always\nListing 15-2\n\
  基于 Docker Compose 的 Redis 服务\n```\n\n以 `docker compose` 服务配置为思维模型，让我们创建一个简单的 Redis\
  \ `PodSpec`，然后启动该 Redis Pod。列表 15-3 提供了所需的配置。打开你喜欢的编辑器，创建一个名为 `redis-pod-basic.yaml`\
  \ 的新文件，并添加列表 15-3 中的内容。\n\n```\napiVersion: v1\nkind: Pod\nmetadata:\n  name: redis-basic\n\
  \  namespace: data-services\n  labels:\n    app: redis\n    type: basic\nspec:\n\
  \  restartPolicy: OnFailure\n  containers:\n    - name: redis\n      image: redis:6.2\n\
  \      imagePullPolicy: Always\n      ports:\n        - containerPort: 6379\n  \
  \        protocol: TCP\n      resources:\n        limits:\n          memory: \"\
  1G\"\n          cpu: \"2000m\"\n        requests:\n          memory: \"500Mi\"\n\
  \          cpu: \"1000m\"\nListing 15-3\n用于配置和启动 Redis 的基本 PodSpec (`redis-pod-basic.yaml`)\n\
  ```\n\n列表 15-3 中的 Redis `PodSpec` 创建了一个具有唯一名称的 Pod 模板。我们之所以称之为 `PodTemplate`，是因为它可以用来启动一个或多个\
  \ Pod。从顶部开始，我们首先为我们的 *Pod 资源*（`kind: Pod`）指定 K8s `apiVersion`。通过声明 API，Kubernetes\
  \ 可以自由地支持或弃用旧版 API，而无需强制收敛。\n\n#### 元数据\n\n接下来，使用 `metadata` 属性为我们的 Pod 分配一个唯一名称（`redis-basic`），并添加可用于调度和定位我们\
  \ Pod 的配置。在本例中，我们分配了 `data-services` 命名空间，并添加了一些标签，我们以后可以使用这些标签来定位特定的 Pod 子集，或者在命名空间内隔离单个\
  \ Pod。\n\n\n\n"
- "# spec\n\n接下来讨论最重要的配置：Pod 规范（`spec`）块本身。如前所述，Pod 为一个或多个容器封装了隔离环境，因此 `PodSpec` 被拆分为多个部分，以便对共享资源进行通用配置，同时包含容器特定的配置。你会在清单\
  \ 15-2 的 `docker-compose.yaml` 和清单 15-3 的 Redis Pod 规范中看到容器规范中的一些重叠之处。最大的区别在于资源请求和限制的精细控制，以及端口配置。\n\
  \n现在让这个 Pod 投入使用吧。\n\n## 调度 Redis Pod\n\n使用 `kubectl` 我们可以应用 `redis-pod-basic.yaml`，让\
  \ Kubernetes 调度我们的 Pod。然后我们最终能够达到与理想世界状态的一致。\n\n```\n% kubectl apply -f redis-pod-basic.yaml\n\
  ```\n\n如果一切顺利，你会看到 `kubectl` 输出 `pod/redis-basic` 已创建的消息。接下来让我们找到我们的 Pod。\n\n##\
  \ 列出、描述和定位 Pod\n\n在命令行中，对 `pods` 资源调用 `get` 命令。\n\n```\n% kubectl get pods\n```\n\
  \n此时你可能感到困惑，为什么没有显示任何结果（在默认命名空间中未找到任何资源）。这是因为 Kubernetes（默认情况下）只会列出来自单个命名空间的资源，而这个命名空间恰好是默认命名空间。通过添加\
  \ `explicit` 命名空间或包含 `--all-namespaces` 标志，你可以获得期望的结果。\n\n```\n% kubectl get pods\
  \ -n data-services\nNAME           READY   STATUS    RESTARTS   AGE\nredis-basic\
  \    1/1     Running   0          44m\n```\n\n现在你可以找到你的 Pod，还可以通过对 Pod 资源使用 Pod\
  \ 名称并调用 `describe` 动词来获取有关 Pod 本身的更多信息。\n\n```\n% kubectl describe pod/redis-basic\n\
  ```\n\n调用 `describe` 的结果可用于获取有关 Pod 本身的详细信息，包括启动日期、容器、节点、IP 地址、当前观测到的 Pod 状态等。\n\
  \n最后，在未来你可能运行了许多 Pod 的情况下，并且想要找到一个特定的 Pod（或一组 Pod），你可以依靠 Pod 资源的元数据标签来找到你要找的内容（跨一个或多个命名空间）。清单\
  \ 15-4 在所有命名空间中执行通用搜索，以找到任何具有匹配标签（`app=redis`）且类型不是 `pv`（`type!=pv`）的 Pod。\n\n```\n\
  % kubectl get pods \\\n--all-namespaces \\\n-l app=redis,type!=pv\n清单 15-4\n使用标签选择器跨所有命名空间定位\
  \ Pod\n```\n\n清单 15-4 中的查询将返回所有匹配的 Pod。在我们的案例中，目前只有一个。\n\n```\nNAMESPACE      NAME\
  \          READY   STATUS    RESTARTS   AGE\ndata-services  redis-basic   1/1  \
  \   Running   0          78s\n```\n\n我们的下一个任务就是简单地进入新的 Redis Pod，并使用 `redis-cli`\
  \ 执行几个命令。\n\n## 在 Redis Pod 上执行命令\n\n就像你已经习惯于使用 `docker exec` 命令一样，你可以直接将你的技能迁移到\
  \ Kubernetes 和 `kubectl` 上。清单 15-5 中的命令将连接到 `redis-basic` Pod 并启动 `redis-cli`。\n\
  \n```\n% kubectl exec \\\n-n data-services \\\n-it redis-basic \\\n-- redis-cli\n\
  清单 15-5\n使用 kubectl exec 连接到正在运行的 Pod\n```\n\n设置并获取一个键，以确保 Redis 按预期工作。\n\n```\n\
  127.0.0.1:6379> set app redis-basic\nOK\n127.0.0.1:6379> get app\n\"redis-basic\"\
  \n```\n\n退出进程（Command+C），这样我们就可以删除 Pod。\n\n## 删除 Redis Pod\n\n你可能已经知道需要什么命令。就像命名空间一样，你可以简单地对\
  \ Pod 资源使用 `delete` 动词，通过名称删除 Pod。\n\n```\n% kubectl delete -n data-services pod/redis-basic\n\
  ```\n\n那么为什么要费劲做所有这些工作，最后却要删除呢？答案在于我们对特定服务的期望。在现实世界中，考虑到 Pod 几乎可能随时被杀死（由于任何云原生基础设施的正常生命周期），你最终需要一个可靠的机制来确保你的所有服务（包括\
  \ Spark 应用程序）能够以一致的方式部署、监控和恢复，且只需有限或无需人工干预。\n\n接下来我们将研究 Kubernetes 的部署资源，学习如何创建一致且可靠的部署。\n\
  \n## 部署与处理故障时自动恢复\n\n在上一节中，你学会了如何配置 Pod 规范。使用简单的 Pod 模板，你可以在 `data-services` 命名空间中调度和运行\
  \ Pod。通过这个过程，你学习了如何使用 Pod 的元数据装饰 Pod（使用标签进行标签选择），以及如何配置一个简单的单容器规范。利用你运行 `redis-basic`\
  \ Pod 所学到的技能，接下来你将学习如何使用 Kubernetes 的部署资源创建受管部署。\n\n### 创建 Kubernetes 部署\n\n*部署*是一种特殊的\
  \ K8s 资源，它引入了针对给定 Pod 规范管理和运行可靠部署的扩展能力。作为一项服务管理可靠性，Kubernetes 集群将监督部署中配置和包含的资源，确保诸如节点故障等常见问题不会导致你的服务停滞不前。\n\
  \n创建一个名为 `deploy-redis-memory.yaml` 的新文件，并将清单 15-6 中的部署配置内容添加到文件中。然后保存它。\n\n```\n\
  apiVersion: apps/v1\nkind: Deployment\nmetadata:\nname: redis-memory\nnamespace:\
  \ data-services\nlabels:\napp: redis-memory\ntype: canary\nspec:\nreplicas: 1\n\
  strategy:\nrollingUpdate:\nmaxUnavailable: 100%\ntype: RollingUpdate\nselector:\n\
  matchLabels:\napp: redis\ntype: memory\ntemplate:\nmetadata:\nlabels:\napp: redis\n\
  type: memory\nspec:\ncontainers:\n- name: redis\nimage: redis:6.2\nvolumeMounts:\n\
  - name: redis-storage\nmountPath: /data\nimagePullPolicy: Always\nports:\n- containerPort:\
  \ 6379\nprotocol: TCP\nresources:\nlimits:\nmemory: \"1G\"\ncpu: \"2000m\"\nrequests:\n\
  memory: \"500Mi\"\ncpu: \"1000m\"\nvolumes:\n- name: redis-storage\nemptyDir:\n\
  medium: Memory\n清单 15-6\n部署为基于 Pod 的服务提供运行时一致的行为，包括故障时自动恢复，以及处理复制服务滚动更新的开箱即用能力\n\
  ```\n\n你会注意到，清单 15-6 中的初始部署配置包装了清单 15-3 中引入的 Pod 规范，并做了两个小改动以引入基于 Pod 的本地*卷*存储。*卷*是\
  \ Pod 中的共享资源，但不是立即可用于所有容器，每个容器必须使用 `volumeMounts` 声明式地添加卷。将卷挂载（或附加）到容器还带来了额外的好处，即允许每个容器创建自定义挂载路径。\n\
  \n```\nvolumeMounts:\n- name: redis-storage\nmountPath: /data\n```\n\n稍后我们将介绍 `volumes`\
  \ 和 `volumeMounts`，但现在请注意，`volumes` 规范是在与 `containers` 规范同级的级别上配置的，而 `volumeMounts`\
  \ 是在每个容器的基础上配置的。现在让我们创建部署。\n\n\n\n### 部署与资源管理\n\n使用清单 15-6 中的部署配置，通过应用配置来创建并启动您的部署。\n\
  \n```\n% kubectl apply -f deploy-redis-memory.yaml\n```\n\n现在部署已经创建成功，让我们来点有趣的尝试。与其详细解析所有部署细节，不如通过以下四个步骤来探究部署：定位、连接、观察和删除。\n\
  \n#### 定位新部署的 Pod\n\n使用本章学到的任意技术，找到您新部署的`redis-memory` pod。定位后，您会注意到该 pod 的名称比之前更长。例如，我创建的\
  \ pod 名称为`redis-memory-78d89d7c87-zchc2`。如果您想了解原因，可以查看部署元数据。\n\n```\n% kubectl get\
  \ deployment/redis-memory -n data-services\n```\n\n现在，连接到被管理的 pod。\n\n#### 连接到被管理的\
  \ Pod\n\n连接到被管理的 Redis pod，并重复清单 15-5 中的步骤。在断开与 pod 的连接前，请记得检查键是否已保存。\n\n#### 观察\
  \ Pod 状态与行为\n\n在第二个终端窗口（最好与当前终端会话并排显示）中，运行以下命令。\n\n```\n% kubectl get pods -n data-services\
  \ --watch\n```\n\n通过观察 pod，您将能够实时查看目标命名空间中所有 pod 的状态变化。\n\n#### 删除被管理的 Pod\n\n回到第一个终端窗口，删除\
  \ Redis pod。\n\n```\n% kubectl delete -n data-services pod/redis-memory-78d89d7c87-zchc2\n\
  ```\n\n会发生什么？\n\n您会观察到，在删除被管理 pod 的瞬间，几乎实时就会有一个新 pod 被调度来替换已删除的 pod。\n\n清单 15-7\
  \ 中的输出显示了我集群上观察到的状态变化消息。输出显示了我的初始 pod（`redis-memory-78d89d7c87-zchc2`）从 `Running`\
  \ 状态变为 `Terminating` 状态。同时，一个新 pod 被创建，以确保我们始终至少有一个副本，因为我们的部署声明了期望副本数：1。替换的 pod\
  \ 最初处于 `Pending` 状态，然后变为 `ContainerCreating`，最后变为 `Running`。所有这些过程在本地环境下不到五秒内完成。除非删除部署，否则\
  \ Kubernetes 将确保您的 pod 永远运行。\n\n```\nNAME                            READY   STATUS\
  \              RESTARTS   AGE\nredis-memory-78d89d7c87-zchc2   1/1     Running \
  \            0          35m\nredis-memory-78d89d7c87-zchc2   1/1     Terminating\
  \         0          36m\nredis-memory-78d89d7c87-p4hzl   0/1     Pending      \
  \       0          0s\nredis-memory-78d89d7c87-p4hzl   0/1     Pending         \
  \    0          0s\nredis-memory-78d89d7c87-p4hzl   0/1     ContainerCreating  \
  \ 0          0s\nredis-memory-78d89d7c87-zchc2   0/1     Terminating         0 \
  \         36m\nredis-memory-78d89d7c87-p4hzl   1/1     Running             0   \
  \       4s\nredis-memory-78d89d7c87-zchc2   0/1     Terminating         0      \
  \    36m\nredis-memory-78d89d7c87-zchc2   0/1     Terminating         0        \
  \  36m\n清单 15-7\n当被管理的 Pod（位于有状态副本集之后）终止时观察到的状态变化\n```\n\n现在来说说坏消息。虽然部署控制器能够恢复已删除的\
  \ pod，但您会发现 Redis 数据库中没有任何键。您可以使用`redis-cli`自行验证。这是为什么呢？Pod 不应该是一致的和可靠的吗？\n\n事实上，这完全是设计使然。为了声明每个部署是幂等的，并一致地支持运行时容错，pod\
  \ 及其底层容器必须使用*不可变约定*。否则，当 pod 终止或遭遇不可恢复故障时，对任何 pod 本地资源（例如向 Redis 数据库添加新键）的运行时更改（变更）将会丢失。鉴于按照约定，pod\
  \ 需要能够在集群中快速移动，因此最佳实践是由 Kubernetes 管理外部配置、密钥以及存储，以确保一致性。\n\n让我们通过学习如何在部署之间持久化数据，来完成\
  \ Kubernetes 的实践之旅。然后，我们将动手实践 Apache Spark 的 Kubernetes 资源管理器。\n\n### 在部署之间持久化数据\n\
  \nKubernetes 基于`volumes`和`volumeMounts`的概念，为文件系统（和内存）存储提供了丰富的抽象层。在上一节（清单 15-6）中您已经了解了这两个概念，现在您将学习如何启用能够抵御\
  \ pod 故障的持久化存储。\n\n首先，我们将使用节点级存储，它在 Kubernetes 节点上持久存在，并在 pod 终止时防止数据丢失。值得注意的是，如果您删除\
  \ minikube 虚拟机，节点级数据也会随之丢失。在命令行中，通过`ssh`登录到 minikube，然后创建一个位于`/mnt/data`的空目录。\n\n\
  ```\n% minikube ssh\n$ sudo mkdir -p /mnt/data\n```\n\n完成此步骤后，我们可以继续创建持久卷资源。\n\n\
  警告\n\n在托管的生成环境 Kubernetes 集群（如 EKS/AKS/GKE）中，通常不需要`ssh`访问。请考虑限制`ssh`访问或完全关闭它，以防止恶意行为者干扰您的\
  \ Kubernetes 集群。\n\n## 持久卷（PV）\n\n容器在运行时进行的本地更改，会在 pod 因正常生命周期事件（如全新部署）而终止、失败或以其他方式被替换（重新调度）时消失。正如您所见，这还包括添加到本地\
  \ pod 环境中的任何数据库记录。\n\n幸运的是，可以使用底层 Kubernetes 节点的本地文件系统存储，或采用更松耦合的实践，即附加托管的云网络文件系统存储，来为\
  \ Kubernetes 集群配置可靠的存储。以主流云厂商的产品为例：亚马逊的[弹性块存储](https://aws.amazon.com/ebs/)、微软的[AzureFile](https://docs.microsoft.com/en-us/azure/storage/files/)/[AzureDisk](https://azure.microsoft.com/en-us/services/storage/disks/)以及谷歌的[持久磁盘](https://cloud.google.com/persistent-disk)。持久卷将存储提供者与实际消费者隔离开来，使得应用能够请求存储，并由\
  \ Kubernetes 负责查找并声明与存储请求匹配的资源。\n\n\n\n#### 配置持久卷（PV）\n\n创建一个名为 `persistent-volume.yaml`\
  \ 的文件，并添加清单 15-8 所示的 `PersistentVolume` 资源配置。随后，可将此模板应用于 Kubernetes 集群，以在 minikube\
  \ 集群的单个节点上物理创建一个持久卷。\n\n```\napiVersion: v1\nkind: PersistentVolume\nmetadata:\n\
  \  name: general-pv-volume\n  namespace: data-services\n  labels:\n    type: local\n\
  spec:\n  storageClassName: manual\n  capacity:\n    storage: 2Gi\n  accessModes:\n\
  \    - ReadWriteOnce\n  hostPath:\n    path: \"/mnt/data\"\n清单 15-8\n为 Redis 创建\
  \ PersistentVolume (persistent-volume.yaml)\n```\n\n清单 15-8 中的资源配置会在 minikube 节点的\
  \ `/mnt/data` 目录下创建一个容量为 2GB 的卷（并将其隔离）。应用此配置以创建新资源，然后使用 `persistentvolume (pv)`\
  \ 资源类型的 `get` 和 `describe` 命令查看已创建的资源，深入了解这一新的资源类型。\n\n##### 创建持久卷\n\n```\n% kubectl\
  \ apply -f persistent-volume.yaml\n```\n\n##### 查看持久卷\n\n```\n% kubectl get pv general-pv-volume\n\
  NAME               CAPACITY   ACCESS MODES   RECLAIM POLICY\ngeneral-pv-volume \
  \ 2Gi        RWO            Retain\n```\n\n##### 描述持久卷的详细信息\n\n```\n% kubectl describe\
  \ pv general-pv-volume\n```\n\n有了 `general-pv-volume` 后，下一步是创建一个声明策略，通过 `PersistentVolumeClaims`\
  \ 资源来管理对卷的读写访问。\n\n## 持久卷声明（PVC）\n\nPV 是集群中特定于存储的资源。PVC 作为一种资源，用于声明 PV 的一部分（或全部）。正如一个节点可以被分割以运行不同规模的工作负载（由\
  \ Pod 规范控制），涉及 CPU 核心和内存一样，PVC 代表了一种对特定存储空间的请求，并带有特定的访问模式，以管理对底层存储资源的独占或共享读写访问。\n\
  \n#### 配置持久卷声明（PVC）\n\n使用清单 15-9 中的配置，创建一个名为 `persistent-volume-claim.yaml` 的新文件。\n\
  \n```\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: redis-pv-claim\n\
  \  namespace: data-services\nspec:\n  storageClassName: manual\n  accessModes:\n\
  \    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 500Mi\n清单 15-9\n\
  创建 PersistentVolumeClaim (persistent-volume-claim.yaml)\n```\n\n清单 15-9 中的 PVC 配置了一个名为\
  \ `redis-pv-claim` 的声明，请求至少 500 Mi（兆字节）的存储空间，并采用 `ReadWriteOnce` 访问模式。此访问模式允许一个\
  \ Pod 声明对绑定的 PV 进行独占访问，这符合 Redis 服务所需的正确访问模式。你可能也注意到，PVC 完全未提及实际的 PV（这是因为存储供应和存储消费是松耦合的；具体细节被抽象化了）。接下来，创建\
  \ PVC 资源，然后使用 `persistentvolumeclaim (pvc)` 资源类型的 `get` 和 `describe` 命令进一步了解你所创建的内容。\n\
  \n##### 创建持久卷声明（PVC）\n\n```\n% kubectl apply -f persistent-volume-claim.yaml\n```\n\
  \n##### 使用 Get 查看 PVC\n\n检查 PVC 的状态，可以查看声明是否已绑定到某个 PV，包括绑定卷的名称。\n\n```\n% kubectl\
  \ get pvc -n data-services\nNAME             STATUS   VOLUME              CAPACITY\n\
  redis-pv-claim   Bound    general-pv-volume   2Gi\n```\n\n##### 查看 PV\n\n由于 PV 与\
  \ PVC 的关系是双向的，你也可以通过 PV 来发现 PVC 声明及其状态（引用）。\n\n```\n% kubectl get pv redis-pv-volume\n\
  NAME              RECLAIM STATUS CLAIM\ngeneral-pv-volume Retain  Bound  data-services/redis-pv-claim\n\
  ```\n\n**提示：** Kubernetes 会使用 PVC 中的 `resources:requests:storage` 值来尝试找到匹配的 PV。在我们的例子中，尽管我们只请求了\
  \ 500Mi，但实际上声明了 2Gi。如果你感兴趣，我建议你进一步了解 PV 的动态供应。\n\n#### 使用数据持久化增强 Redis 部署\n\n现在，让我们将\
  \ PV 和 PVC 付诸实践，并修改之前清单 15-6 中的 Redis 部署。结果发现，我们只需要修改 Pod 规范中的卷配置即可。打开你之前的部署配置文件，将卷类型从\
  \ `emptyDir` 修改为 `persistentVolumeClaim`（如清单 15-10 所示）。\n\n```\napiVersion: apps/v1\n\
  kind: Deployment\n...\nspec:\n  template:\n    spec:\n      volumes:\n        -\
  \ name: redis-storage\n          persistentVolumeClaim:\n            claimName:\
  \ redis-pv-claim\n清单 15-10\n使用持久卷声明来持久化数据\n```\n\n保存部署的更改并应用更新后的部署。你的 Redis 数据库中保存的任何数据（流对象、键等）都将以有状态且一致的方式在多次部署之间持久保留。按照清单\
  \ 15-6 的流程执行一遍，然后删除你的 Pod。观察你的 Redis 服务是否在你离开时的状态下重新启动。\n\n### Kubernetes 服务与 DNS\n\
  \n作为最后一步，让我们为 Redis Pod 部署添加一个 Service 定义。Kubernetes 中的服务支持在单个命名空间范围内（默认情况下）进行服务发现，例如，允许你在\
  \ `data-services` 命名空间内使用 Redis，该命名空间可用来支持 Airflow 或作为 MySQL 的缓存层。\n\n### 创建服务\n\
  \n创建一个名为 `redis-service.yaml` 的文件，并添加清单 15-11 中的以下 Service 配置。然后使用 `kubectl apply\
  \ -f` 应用该配置。\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n  name: redis-service\n\
  \  namespace: data-services\nspec:\n  selector:\n    app: redis\n    type: memory\n\
  \  type: ClusterIP\n  ports:\n    - name: tcp-port\n      port: 6379\n      targetPort:\
  \ 6379\n      protocol: TCP\n清单 15-11\n为 Redis 定义 Kubernetes Service 资源\n```\n\n\
  清单 15-11 中的 Redis 服务定义创建了一个动态服务，指向与 `Service` 选择器（`app=redis,type=memory`）匹配的零个或多个\
  \ Pod 组上的端口 6379。这种抽象使你能够定义一个松耦合的服务，该服务依靠 Kubernetes 使用选择器动态填充端点。绑定的端点是与选择条件匹配的\
  \ Pod 子集的 Pod IP 地址。\n\n### 查看服务（SVC）\n\n```\nkubectl get services -n data-services\n\
  NAME            TYPE        CLUSTER-IP     PORT(S)    AGE\nredis-service   ClusterIP\
  \   10.106.24.62   6379/TCP   8d\n```\n\n我们将在第 2 部分中再次讨论服务。现在，让我们先回顾一下我们所学的内容。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文，并严格保留所有格式标记。\n\n\n### 第一部分：总结\n\
  \n本章上半部分向你介绍了在 Kubernetes 上运行云原生应用所需的许多核心组件、概念和 API。如前所述，在 Kubernetes 上运行 Apache\
  \ Spark（使用官方的 [Spark Kubernetes 资源管理器](http://spark.apache.org/docs/latest/running-on-kubernetes.html)）能够抽象化（并保护你免受）启动\
  \ K8s 所需的大量运行时细节和复杂性的影响。然而，当从概念验证转向生产环境时，始终有必要不仅为工具，而且为其运行的环境建立坚实的基础。这就是我们逐步讲解如何设置和配置持久化\
  \ Redis 部署的原因。\n\n作为后续练习，请将 MySQL 和 MinIO 引入你的本地 Kubernetes 集群，以测试你在本章前半部分学到的内容。你可以参考本书前面的课程，查阅你所需的一切，包括使用\
  \ `docker-compose` 文件和初始化步骤。发挥你的创造力来解决这些问题，并在构建心智模型的过程中，通过这个过程更仔细地审视哪些方法有效，哪些无效。\n\
  \n现在，我们期待已久的时刻到了——是时候学习如何在 Kubernetes 上部署你的 Apache Spark 应用了。\n\n## 第二部分：在 Kubernetes\
  \ 上部署 Spark Structured Streaming 应用\n\n在你的 Kubernetes 集群启动并运行，并且你已划分出 `data-services`\
  \ 命名空间后，我们将深入探讨为我们的 Apache Spark 环境提供支持所需的额外 Kubernetes 资源。\n\n**动手实践内容**\n\n本章第二部分的章节材料位于\
  \ `ch-15/spark-on-kubernetes` 目录下。完整的操作指南可在 `README` 文件中找到。在 `data-services` 命名空间中运行\
  \ MinIO 和 MySQL 的完整解决方案可以为你接下来的探索做好准备。\n\n### Spark 命名空间、应用环境和基于角色的访问控制\n\n要使你的\
  \ Apache Spark 应用能够运行，需要一些基础资源。在本节中，我们将定义 `spark-apps` 命名空间，然后向你介绍角色、角色绑定和服务账户。\n\
  \n#### 定义 Spark 应用命名空间\n\n清单 15-12 中的命令为我们的 Spark 应用创建了一个名为 `spark-apps` 的新命名空间。创建此命名空间。\n\
  \n```sh\ncat <<EOF | kubectl apply -f -\napiVersion: v1\nkind: Namespace\nmetadata:\n\
  labels:\nkubernetes.io/metadata.name: spark-apps\nname: spark-apps\nEOF\n```\n\n\
  *清单 15-12：定义 Spark 应用命名空间*\n\n定义了 `spark-apps` 命名空间后，下一步是建立一些规则来管理我们 Spark 应用的运行时能力。就像在现实世界中，你不会把你家的钥匙随便给一个陌生人一样，这在\
  \ Kubernetes 世界中也是如此。Pod 具有已知的身份，这些身份由不可伪造的、基于 Pod 与 Kubernetes API 之间令牌/证书交换来控制认证和授权的双向\
  \ TLS 管理。Pod 可以承担特定的身份，并获得由服务账户、角色和角色绑定资源管理的特殊资源和访问权限。\n\n#### 基于角色的访问控制 (RBAC)\n\
  \n就像在 SQL 系统中使用 `GRANT` 和 `REVOKE` 来建立权限一样，基于角色的访问控制 (RBAC) 用于为你的 Pod 以及访问你 K8s\
  \ 集群的真实用户定义通用能力和权限。\n\n##### 角色\n\nKubernetes 中的角色用于在 API 级别定义通用权限（例如创建、修改或销毁资源）。\n\
  \n```sh\n% kubectl get roles -n {namespace}\n```\n\n角色定义了一系列规则，这些规则在特定命名空间内对资源进行管理，并且是动词级别的。\n\
  \n**注意：** 你也可以定义管理集群级别（而不仅仅是特定命名空间）访问权限的规则。这些被称为 `clusterroles`：`% kubectl get clusterroles`\n\
  \n## 服务账户\n\n服务账户在 Kubernetes API 中提供了一种身份机制。这相当于在 Amazon Web Services 上使用 IAM 权限。服务账户为特定资源提供基于令牌的授权访问。默认情况下，每个命名空间都会生成一个名为\
  \ `default` 的通用服务账户。除非指定了不同的服务账户，否则此默认身份将自动与在每个命名空间中创建的任何 Pod 关联。\n\n```sh\n% kubectl\
  \ get sa -n {namespace}\n```\n\n## 角色绑定\n\n角色绑定将用户、组或服务账户连接到一个特定的角色。\n\n```sh\n\
  % kubectl get rolebindings -n {namespace}\n```\n\n现在，我们来设置 `spark-controller` 服务账户，以及相关联的角色和角色绑定。\n\
  \n#### 创建 Spark Controller 服务账户、角色和角色绑定\n\n考虑到 Pod 在命名空间内运行，并且我们希望我们的 Spark Structured\
  \ Streaming 应用能够自我管理——在必要时添加和移除执行器 Pod——我们需要创建一个特殊的服务账户（`spark-controller`），该账户可以绑定到我们的\
  \ Spark 应用的 Pod 上。这将授予 Pod 自我创建和销毁以及管理命名空间内其他资源的能力（这样我们就不必操心了）。\n\n清单 15-13 中的多部分资源定义在\
  \ `spark-apps` 命名空间内生成三个新资源。角色（`spark-app-controller`）、服务账户（`spark-controller`）和角色绑定（`spark-app-controller-binding`）。\n\
  \n```yaml\ncat <<EOF | kubectl apply -f -\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: Role\nmetadata:\nnamespace: spark-apps\nname: spark-app-controller\nrules:\n\
  - apiGroups:\n- \"\"\nresources:\n- pods\n- services\n- configmaps\nverbs:\n- list\n\
  - create\n- delete\n- get\n- list\n- patch\n- update\n- watch\n\napiVersion: v1\n\
  kind: ServiceAccount\nmetadata:\nname: spark-controller\nnamespace: spark-apps\n\
  \napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata:\nname:\
  \ spark-app-controller-binding\nnamespace: spark-apps\nsubjects:\n- apiGroup: \"\
  \"\nkind: ServiceAccount\nname: spark-controller\nroleRef:\napiGroup: rbac.authorization.k8s.io\n\
  kind: Role\nname: spark-app-controller\nEOF\n```\n\n*清单 15-13：使用多部分 `---` 分隔符可以创建多个\
  \ K8s 资源*\n\n清单 15-13 中的技术使你能够提供一个声明了一组资源的单一文件。依赖多部分资源定义模式可确保每个隔离部署的不同需求都能以一致的方式得到满足。\n\
  \n**提示：** 对于复杂部署，或用于引导整个环境，你可以依赖多资源配置，如 Spark 引导配置（清单 15-13）。这样做，你可以确保所有部署依赖项（资源）在部署之前都可用，并以正确的顺序应用到\
  \ K8s 集群中。关键在于一致性。K8s 社区已经采用了两种流行的解决方案——[helm](https://helm.sh/) 和 [kustomize](https://kustomize.io/)——来简化部署复杂性的管理。Helm\
  \ 就像 K8s 的包管理器，使得复杂部署可以通过命令行轻松安装和更新。而 Kustomize 则是一个无模板的配置管理器，可以轻松地将特定环境的配置合并（覆盖）到通用部署资源之上。该解决方案使你能够为开发、预发布和生产环境配置部署，同时重用通用配置以防止配置漂移的问题。\n\
  \n现在，你已经应用了环境脚手架，是时候重新审视第 13 章中的通用 Structured Streaming 应用，并为其在 K8s 集群中的部署做准备。\n\
  \n\n\n### Redis Streams Kubernetes 应用\n\n在第十章 10 中，你了解了如何将 Redis Streams 与 Structured\
  \ Streaming 结合使用，将其作为一种轻量级（低开销）的流式数据源。最初构建该应用是为了向你展示如何可靠地读取无界的 `CoffeeOrder` 事件流，控制应用触发过程（作为有状态批处理或流式微批处理），并使用检查点维护应用状态。最终成果是一个简单但一致的流式应用，它能够将\
  \ `CoffeeOrder` 对象读取并写入数据仓库（MinIO）的分布式表中。\n\n在第十三章 13 中，我们利用 Spark Structured Streaming\
  \ 生成基于时间（窗口化）的聚合，从而简化了创建可靠流式分析数据的复杂流程。我们将基于第十三章中的通用聚合应用进行构建，并创建一个可在 `minikube` 集群内部署和管理的新容器。\n\
  \n首先，在你喜欢的 IDE 中打开 `ch-15/applications/redis-streams-k8s` 应用，或者直接打开源代码以便跟随学习。\n\n\
  ### 构建 Redis Streams 应用\n\n我们不会修改应用的源代码；它已经准备好进行构建。从容器化的角度来看，只有少数几个小的调整值得指出。\n\n\
  首先，`Dockerfile` 已被调整，用于将 `user_jars` 目录的内容复制到最终容器中，如清单 15-14 所示。这样做是为了保持一致性，确保没有意外缺失的依赖项或运行时问题。\n\
  \n```dockerfile\nFROM newfrontdocker/${spark_base_version}\nARG app_jar\nUSER 1000\n\
  # 复制并重命名\nCOPY --chown=1000 ${app_jar} /opt/spark/app/jars/redis-streams-k8s.jar\n\
  # 复制应用配置\nCOPY --chown=1000 conf /opt/spark/app/conf\nCOPY --chown=1000 user_jars\
  \ /opt/spark/app/user_jars\n```\n\n*清单 15-14：修改 Dockerfile 以打包任何额外的运行时 JAR 和基础应用配置*\n\
  \n如前所述，修改 `Dockerfile` 是为了生成一个一致的容器，其中包含所有必需的运行时 JAR 和通用的基线配置。容器中附带的基线配置包括来自第十三章\
  \ 13 的 `TypeSafe` 配置、`fairscheduler.xml` 文件（在上一章中介绍）以及两个可执行文件（`spark-submit.sh`\
  \ 和 `spark-submit-lite.sh`），用于在 Kubernetes 集群内部提交应用。\n\n> **提示：** 如果你需要类似的通用依赖项，可以将它们打包到你的基础\
  \ Spark 容器镜像中。这样，每个应用就不必重复执行自备 JAR 的过程。只需确保添加通用场景所需的依赖，以便镜像体积尽可能小。\n\n### 构建应用容器\n\
  \n第二个更改是针对容器构建过程。你需要使用 `minikube` Docker 环境构建本地应用镜像。如清单 15-15 所示，这里增加了一个小步骤，本质上就是一个单行的\
  \ `eval` 语句。\n\n```bash\n1.   sbt clean assembly\n2.   eval $(minikube docker-env)\n\
  3.   docker build . -t mde/redis-streams-k8s:1.0.0\n```\n\n*清单 15-15：构建容器以在 minikube\
  \ 环境中使用*\n\n现在你已经构建好了容器，下一步就是部署它。\n\n> **提示：** 在本地测试时，使用清单 15-15 中的技巧可以更快地迭代你的应用。另一种方式是将镜像构建并推送到\
  \ DockerHub 或亚马逊 ECR 等其他容器注册服务。\n\n### 在 Kubernetes 上部署 Redis Streams 应用\n\n回顾整本书中运行各种\
  \ Spark 应用的过程，我们经常通过 `docker-compose` 使用挂载的配置和运行时资源（JAR、`hive-site.xml` 中的密钥以及配置）来增强运行时环境。为了实现特定容器间的通信，我们还使用了内部\
  \ Docker 网络（`mde`）。将类似的策略应用于 Kubernetes 上的 Spark 应用是完全合理的。\n\n在本章前面，你了解了*服务*和*卷*（持久卷和临时卷）。为准备部署，你将添加一种新的服务类型，以简化与\
  \ `data-services` 命名空间中运行服务的跨命名空间 DNS 解析。你还将学习如何外部化环境变量、部署特定配置以及密钥，例如 `hive-site.xml`\
  \ 和 MinIO 的访问/密钥。我们将把注意力转向使用超越传统文件存储（目录和单个文件）的卷。\n\n**运行代码**\n\n在终端中，将你的工作目录切换到\
  \ `ch-15/spark-on-kubernetes`。\n\n#### 外部化依赖管理\n\n有两种重要的资源类型，它们的作用类似于卷（并且可以挂载到 Pod\
  \ 上），但提供了额外的专门功能。它们分别称为 `ConfigMap` 和 `Secret`，你将在部署中依赖它们。\n\n#### 使用 ConfigMap\
  \ 进行外部配置\n\n`ConfigMap` 资源提供了一种解决方案，用于存储在命名空间范围内、具有唯一标识的数据集合（文件、二进制数据等）。`ConfigMap`\
  \ 对象通常用于提供共享的环境变量（例如，用于 `dev`、`stage` 和 `production` 环境），以及提供隔离的（特定于部署）的应用资源。\n\n\
  让我们创建一个 `ConfigMap`，它可以用作我们的默认 Spark 应用配置（`spark-defaults.conf`）。在你的终端中（在 `spark-on-kubernetes`\
  \ 目录内），运行以下命令：\n\n```bash\nkubectl create configmap spark-redis-streams-conf \\\n\
  --from-file=spark-redis-streams/config \\\n-n spark-apps\n```\n\n神奇的是，`config/spark-defaults.conf`\
  \ 文件的内容会被编码到你的 `spark-redis-streams-conf` 资源中。要查看内容，你可以运行以下命令：\n\n```bash\nkubectl\
  \ get configmap spark-redis-streams-conf \\\n-n spark-apps \\\n-o yaml\n```\n\n\
  输出结果实质上只是向你展示了 `spark-defaults.conf` 的内容。\n\n#### Secrets\n\n众所周知，你不应该将用户名、密码或敏感数据提交到\
  \ Git（或你正在使用的任何版本控制系统）中，否则你可能会无意中泄露敏感数据。`Secret` 资源类型允许你（在你的命名空间内）存储敏感数据，这些数据保证通过加密（HTTPS）通道传输，并在内部存储为\
  \ base-64 编码的字符串。\n\n\n\n### 安全存储 Hive Metastore 配置\n\n清单 15-16 中的命令对我们一直用于访问基于\
  \ MySQL 的 Hive Metastore 的 `hive-site.xml` 文件进行了编码，并将其封装到一个名为 `hivesite-admin` 的密钥资源中，该资源可以在运行时安全地挂载到我们的\
  \ Spark 应用 Pod 上。\n\n```\ncat \n\njavax.jdo.option.ConnectionURL\njdbc:mysql://mysql-service.spark-apps.svc.cluster.local:3306/metastore\n\
  \njavax.jdo.option.ConnectionDriverName\norg.mariadb.jdbc.Driver\n\njavax.jdo.option.ConnectionUserName\n\
  dataeng\n\njavax.jdo.option.ConnectionPassword\ndataengineering_user\n\nEOF\n清单\
  \ 15-16\n将 hive-site.xml 封装为密钥，用于应用部署\n```\n\n你会注意到 `hive-site.xml` 存储在 `stringData`\
  \ 块中。对于像 `hive-site.xml` 和 `spark-defaults.conf` 这样的二进制文件，你不能使用简单的键/值对，这使得资源定义的长度更长。\n\
  \n在此处，也值得指出的是，`hive-site.xml` 中的 `ConnectionURL` 指向的服务域名目前并不存在于 `spark-apps` 命名空间中。\n\
  \n```\njdbc:mysql://mysql-service.spark-apps.svc.cluster.local:3306/metastore\n\
  ```\n\n我们稍后将添加一个 `ExternalService` 资源，为 `data-services` MySQL 服务提供别名。\n\n**提示：**\
  \ 如果你尚未尝试过在 K8s 上设置 MySQL 并希望获得解决方案，请使用 `ch-15/spark-on-kubernetes/data-services/README.md`\
  \ 进行设置。\n\n现在我们已经将 `hive-site.xml` 编码为密钥，我们一直在处理的另一个敏感信息是 MinIO 的访问密钥和秘密密钥。幸运的是，这是一个更简单的定义，使用了键/值对。\n\
  \n### 安全存储 MinIO 访问参数\n\n清单 15-17 中的资源定义对管理用户名和密码信息进行了编码。创建 `minio-access` 资源。请记住，密钥是在你的应用程序源代码之外管理的，因此你不必担心意外将密钥提交到\
  \ GitHub。只需引用已知的密钥并将其挂载到你的 Pod 上，以便在容器中使用即可。\n\n```\ncat <<EOF | kubectl apply -f\
  \ -\napiVersion: v1\nkind: Secret\nmetadata:\nname: minio-access\nnamespace: spark-apps\n\
  type: Opaque\nstringData:\naccess: minio\nsecret: minio_admin\nEOF\n清单 15-17\n创建\
  \ minio-access 键/值对密钥，用于 Spark 应用部署\n```\n\n创建好这两个密钥后，你现在可以使用 `volumes` 和 `volumeMounts`\
  \ 将它们用于你的部署规范中。\n\n### 查看命名空间中的密钥\n\n如果你想查看已编码的密钥，可以使用以下命令：\n\n```\n% kubectl get\
  \ secrets -n {namespace}\n% kubectl get secret/{name} -n {namespace} -o yaml\n```\n\
  \n接下来要做的事情是添加运行 Spark Structured Streaming 应用所需的 `ExternalService` 配置。\n\n### 跨命名空间\
  \ DNS 和网络策略\n\n有趣的事实：命名空间为跨命名空间通信提供了天然的保护屏障。要实现命名空间之间的交互，例如在实际的生产 Kubernetes 集群中，你需要使用一种名为\
  \ `ExternalName` 的特殊服务配置以及 `NetworkPolicy` 来创建策略。这两者结合使用，可以使在隔离命名空间中运行的应用能够向另一个命名空间中运行的服务发出请求。例如，使你的\
  \ Spark 应用能够与 `data-services` 命名空间通信。\n\n当在 minikube 上运行时，我们在这里走个流程，因为网络在我们的单节点上是共享的。让我们定义指向\
  \ `data-services` MySQL 服务的服务指针（如清单 15-18 所示）。\n\n```\ncat <<EOF | kubectl apply\
  \ -f -\nkind: Service\napiVersion: v1\nmetadata:\nname: mysql-service\nnamespace:\
  \ spark-apps\nspec:\ntype: ExternalName\nexternalName: mysql-service.data-services.svc.cluster.local\n\
  ports:\n- port: 3306\nname: tcp-port\nEOF\n清单 15-18\nExternalName 服务为你的命名空间内部提供了一个本地完全限定域名（FQDN），该域名解析到另一个命名空间中的外部服务\n\
  ```\n\n为什么要使用这个呢？随着时间的推移，内部管理的服务经常会跨团队转移所有权。如果新团队接手某些服务的所有权并切换命名空间，你可以更新单个资源并迁移你的应用，或者在不同命名空间之间链接\
  \ `ExternalName` 资源。\n\n最终，随着规模的扩大，你会发现自己最终会迁移到像 Istio 这样的服务网格，但由于你刚开始接触，请记住保持简单（已经有太多新组件和服务需要理清了）。\n\
  \n作为后续练习，请遵循清单 15-18 的模式，为 Redis 和 MinIO 创建额外的策略。准备好后，就可以进行部署了。\n\n\n\n"
- '# 使用跳板 Pod 控制部署


  首先，您将通过一个简单的"跳板"（jump）Pod 中的 `mde/redis-streams-k8s:1.0.0` 容器来部署 Spark 应用程序。如果一开始就全速推进，很容易遗漏某些内容并陷入所谓的"崩溃循环"（crash
  loop）。您可能会发现，在首次采用任何新的部署模式后，对后续几个应用重复这种缓慢、受控的部署流程是必要的。此过程在调试应用时也很有帮助，因为在将所有内容自动化到正式的有状态部署之前，您可以先检查常见的故障点，例如缺失的配置。


  从 `ch-15/spark-on-kubernetes/spark-redis-streams` 目录下，打开 `deployment-manual.yaml`（如列表
  15-19 所示）查看 Pod 规范。请特别关注 `volumes` 和 `volumeMounts` 环境变量，以了解 `Secrets` 和 `ConfigMap`
  是如何注入到 Pod 中的，以及外部 DNS 值是如何注入到规范中的。


  ```

  apiVersion: v1

  kind: Pod

  metadata:

  name: spark-redis-streams-app

  namespace: spark-apps

  labels:

  app: spark-redis-streams

  type: canary

  version: "1.0.0"

  spec:

  restartPolicy: OnFailure

  # 跳板 Pod 以 root 身份运行

  securityContext:

  runAsUser: 0

  runAsGroup: 0

  serviceAccountName: spark-controller

  volumes:

  - name: spark-submit-conf

  configMap:

  name: spark-redis-streams-conf

  - name: hive

  secret:

  secretName: hivesite-admin

  containers:

  - name: redis-streams-app

  env:

  - name: SPARK_CONTAINER_IMAGE

  value: mde/redis-streams-k8s:1.0.0

  - name: REDIS_SERVICE_HOST

  value: redis-service.spark-apps.svc.cluster.local

  - name: REDIS_SERVICE_PORT

  value: "6379"

  - name: MINIO_SERVICE_HOST

  value: minio-service.spark-apps.svc.cluster.local

  - name: MINIO_SERVICE_PORT

  value: "9000"

  - name: MINIO_ACCESS_KEY

  valueFrom:

  secretKeyRef:

  name: minio-access

  key: access

  - name: MINIO_SECRET_KEY

  valueFrom:

  secretKeyRef:

  name: minio-access

  key: secret

  volumeMounts:

  - mountPath: /opt/spark/conf/spark-defaults.conf

  name: spark-submit-conf

  subPath: spark-defaults.conf

  readOnly: false

  - mountPath: /opt/spark/conf/hive-site.xml

  name: hive

  subPath: hive-site.xml

  readOnly: true

  image: mde/redis-streams-k8s:1.0.0

  imagePullPolicy: Never

  command: ["tail", "-f", "/dev/null"]

  resources:

  limits:

  memory: "2000Mi"

  cpu: "500m"

  requests:

  memory: "1000Mi"

  cpu: "250m"

  列表 15-19

  Spark 跳板 Pod（spark-redis-streams-app）规范

  ```


  列表 15-20 中的 Pod 规范安全地挂载了您应用到 `spark-apps` 命名空间的密钥和配置。我们使用挂起的 `tail` 命令来保持 Pod 运行（例如在本章第一部分与
  Redis 服务交互时）。这允许您 `exec` 进入 `redis-streams-app` 容器进程并运行应用程序。


  通过执行以下命令创建（并调度）Pod：


  ```

  % kubectl apply -f deployment-manual.yaml

  ```


  一个 `pod/spark-redis-streams-app` 即被创建。现在，我们可以 `exec` 进入 Pod 并触发应用程序。


  ## 从跳板 Pod 触发 Spark Submit


  使用 `exec` 命令跳转到跳板 Pod，以启动实际的 Spark 应用程序。为了便于理解，可以将跳板 Pod 视为驻留在 K8s 集群中的一个经过身份验证的进程，从而允许用户（使用
  `spark-controller` 服务账户）部署应用程序。


  ```

  % kubectl exec --stdin --tty pod/spark-redis-streams-app \

  -n spark-apps \

  -- bash

  ```


  从 `exec` 进程中，您可以使用我们预先打包在容器内的 `spark-submit.sh` 可执行文件，将应用程序提交到 Kubernetes 集群。它位于以下路径：`/opt/spark/app/conf/spark-submit.sh`。


  **提示**


  在您首次启动应用程序之前，我始终建议您打开第二个终端窗口，以观察 `spark-submit` 进程如何生成 Pod。您也可以使用 `spark-submit`
  进程生成的日志来观察 Spark Kubernetes 资源管理器的操作。


  `kubectl get pods -n spark-apps --watch`


  在 `spark-redis-streams-app` Pod 的 `exec` 进程中，运行以下命令。


  ```

  % /opt/spark/app/conf/spark-submit.sh

  ```


  当应用程序启动并切换到 `Running` 状态时，您刚刚触发的 `spark-submit` 进程将定期调用 K8s API 来检查驱动状态（本质上与您通过
  `kubectl` 进程观察命名空间内 Pod 的行为相同）。


  有趣的是：这是您第一次使用您的服务账户，它使您能够即时创建新资源。这允许您将控制权委托给驱动程序应用程序进程。要查看您创建的资源，请调用 `kubectl get
  pods -n spark-apps`。


  ```

  NAME                                                 READY  STATUS    RESTARTS  AGE

  spark-redis-stream-aggs-app-cf14ec7d5490f37d-exec-1  1/1    Running   0         29m

  spark-redis-stream-aggs-app-cf14ec7d5490f37d-exec-2  1/1    Running   0         29m

  spark-redis-streams-app                              1/1    Running   0         33m

  spark-redis-streams-app-driver                       1/1    Running   0         29m

  ```


  您随时可以退出该进程。由于 `spark-submit.sh` 创建的是基于集群的部署，您将返回到 `exec` 进程。（我们在第 14 章中讨论过集群部署，但作为复习，这意味着驱动程序应用程序进程与执行器一起在集群中运行，而不是作为外部资源进行控制。）


  **注意**


  在 `spark-redis-streams-app` Pod 上运行 `ls -l /opt/spark/app/conf`，您会注意到存在第二个 `spark-submit*`
  文件，名为 `spark-submit-lite.sh`。这第二个配置文件提供了运行聚合应用程序所需的最简配置示例。由于第二个示例不可执行（缺少 `-x` 权限），您可以使用
  `bash /opt/spark/app/conf/spark-submit-lite.sh` 来运行该应用程序。


  ## 连接部署的各个点


  由环境变量控制的 `spark-submit.sh` 可执行文件如列表 15-20 所示。您会看到重要的配置设置（仅基于 Pod 规范的覆盖项），这些设置通常用于修改应用程序在不同
  K8s 集群（非生产环境与生产环境）中运行时的配置。您使用新的 `checkpointLocation` 和输出路径来运行应用程序，这样在部署替换应用程序（或金丝雀版本）时，就不会破坏应用程序的状态。


  ```

  #!/usr/bin/env bash

  K8S_MASTER=${K8S_MASTER:-k8s://https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}}

  ...

  $SPARK_HOME/bin/spark-submit \

  --master ${K8S_MASTER} \

  --deploy-mode cluster \

  --class "com.coffeeco.data.SparkStatefulAggregationsApp" \

  --conf "spark.kubernetes.driver.pod.name=${SPARK_APP_NAME}-driver" \

  --conf "spark.kubernetes.authenticate.driver.serviceAccountName=${K8S_SERVICE_ACCOUNT_NAME}"
  \

  --conf "spark.redis.host=${REDIS_SERVICE_HOST}" \

  --conf "spark.redis.port=${REDIS_SERVICE_PORT}" \

  --conf "spark.hadoop.fs.s3a.endpoint=${MINIO_SERVICE_HOST}:${MINIO_SERVICE_PORT}"
  \

  --conf "spark.hadoop.fs.s3a.access.key=${MINIO_ACCESS_KEY}" \

  --conf "spark.hadoop.fs.s3a.secret.key=${MINIO_SECRET_KEY}" \

  --conf "spark.kubernetes.container.image=${SPARK_CONTAINER_IMAGE}" \

  --conf "spark.kubernetes.container.image.pullPolicy=${SPARK_CONTAINER_PULL_POLICY}"
  \

  --conf "spark.sql.warehouse.dir=${S3_BASE_PATH}/warehouse" \

  --conf "spark.app.sink.options.checkpointLocation=${S3_BASE_PATH}/apps/spark-redis-streams-app/1.0.0"
  \

