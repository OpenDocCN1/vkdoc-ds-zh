  [info] 测试：成功 4，失败 0，取消 0，忽略 0，挂起 0

  [info] 所有测试通过。

  ```


  ## 练习 7-3：总结


  这第一个批处理应用是许多层次微妙之处以及多年编写 Apache Spark 应用经验教训的入门。虽然目前这个应用做的事情不多，但它做得非常好的一点是为你将来的成功打下了基础。随着我们在后续章节中进入有状态批处理和
  Spark Structured Streaming，我们将继续依赖在构建这个第一个批处理应用中学到的经验教训。


  接下来你将学到的，很可能是 Spark 应用开发生命周期中最重要的一步。就像传统软件开发一样，测试你的代码不仅仅是“锦上添花”，而是工作的要求。此外，对于 Spark
  应用来说，测试你的代码可以确保你不会在运行时浪费宝贵的时间和金钱来调试代码。我还发现，像你在练习 7-4 中将要进行的那样编写测试是极其宝贵的，因为你将在测试环境中运行
  Apache Spark 来驱动你的单元测试，这将为快速应用开发、更好的可调试性以及最终构建值得信赖且运行稳定的应用打开大门。


