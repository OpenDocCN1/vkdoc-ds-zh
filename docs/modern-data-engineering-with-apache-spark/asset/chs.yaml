  ## 你的第一个 Spark ETL


  在本章中，你学习了如何读取、转换和查看数据。要构建一个正式的 ETL，你需要将转换结果写入一个可靠的位置。


  打开完整的 ETL 示例（在 Zeppelin 主页上，位于“3-4_EndToEndETL”下）。


  ### 练习 3-4：一个端到端的 Spark ETL


  加载笔记后，你会看到我们定义了 `coffeeSchema`（从练习 3-2 复制而来），并且有一个包含代码清单 3-15 中代码的主段落。


  ```

  %spark

  spark

  .read

  .option("inferSchema", "false")

  .schema(coffeeSchema)

  .csv("file:///learn/raw-coffee.txt")

  .write

  .format("parquet")

  .mode("overwrite")

  .save("file:///learn/coffee.parquet")

  代码清单 3-15

  完整的 ETL 作业

  ```


  ETL 作业的前半部分应该与练习 3-2 类似。加粗部分包含了 `write` 流程，其中引入了 `DataFrameWriter`。


  #### 写入结构化数据


  一旦我们将数据加载到 `DataFrame` 中，我们的数据处理故事就开始了。每个项目、功能或用例都会驱动 Spark 应用程序所需的步骤和期望的数据结果。以代码清单
  3-15 中的 ETL 作业为例，除了以某种格式写入干净、结构化的数据以便于下游处理之外，并没有太多其他操作。在这个例子中，作业的最终输出是将 Parquet
  数据写入文件系统，这是一个简单的过程，将半结构化的 CSV 数据转换为完全结构化的 Parquet 数据。


  #### Parquet 数据


  Parquet 数据是一种完全结构化的列式数据格式。这意味着无需推断任何类型，因为模式本身已编码在文件中。这意味着你可以直接读取 Parquet 文件，Spark
  会自动将模式应用于生成的 `DataFrame`。


  #### 读取 Parquet 数据


  使用代码清单 3-15 中 ETL 作业的结果就像引用文件位置一样简单。此过程如代码清单 3-16 所示。


  ```

  %spark

  spark.read

  .parquet("file:///learn/coffee.parquet")

  .createOrReplaceTempView("coffee")

  代码清单 3-16

  Spark 原生支持使用 DataFrameReader 读取 Parquet

  ```


  因为你已经付出了努力来清理、转换并将最终转换结果写为完全结构化的 Parquet 格式（`coffee.parquet`），所以这减少了将来任何需要使用相同数据集的人的工作量。虽然本章的练习很简单，但还有一个值得指出的有趣副作用。你在
  ETL 中生成的 Parquet 文件继承了 `StructType` 的所有元数据，包括字段级别的注释。你可以向笔记中添加另一个段落，并简单地描述咖啡表（基于代码清单
  3-16 中替换的临时视图）。


  ```

  %spark

  spark.sql("desc coffee").show(false)

  +--------+---------+-------------------------+

  |col_name|data_type|comment                  |

  +--------+---------+-------------------------+

  |name    |string   |咖啡品牌名称             |

  |roast   |double   |咖啡烘焙度 (1-10)        |

  +--------+---------+-------------------------+

  ```


  即使你将数据写出为 Parquet 格式，你的字段级别描述仍被编码并保留下来，这是一个有效的交付方式。它确保任何使用此数据（假定已写入你的数据湖）的人都能轻松理解每个字段的含义。


  #### 练习 3-4：总结


  最后一个练习旨在巩固你在本章中学到的内容。最终，通过一点前期的努力，不仅可以有效地提取、转换和加载数据，还可以减少数据管道下游任何人的工作量。


  ## 总结


  本章涵盖了很多内容。它向你介绍了作为数据工程师使用 Apache Spark 的实用示例，并希望向你介绍一种新的工作方式，即使用 Notebooks 按程序处理数据。我发现本章介绍的技术在教学以及我的实际日常工作中都非常有用。Zeppelin
  和 Docker 相结合，可以让你快速进行初步检查并测试想法，从而节省大量时间和金钱。能够共享完全可用的环境和应用程序（只需几个简单步骤即可启动并运行）的额外好处可能是无价的，尤其是在远程工作时（就像我们许多人在疫情期间所做的那样）。


  本章介绍了一些在 Apache Spark 生态系统中处理数据的有用模式。这里的意图仅仅是开始向你展示如何做某事，然后介绍如何改进早期解决方案的方法。我们本可以从本章末尾开始读取
  Parquet 数据，但那样我们就错过了学习读取纯文本和手动转换 `DataFrame` 的机会。在了解核心 Spark 类和处理数据的方法的同时思考如何解决问题，可以帮助你为未来几年打下坚实的基础。


  下一章将介绍数据转换。这是对前三章所建立基础的延续，重点介绍 Spark 中可用于结构化数据集的核心函数和操作。




