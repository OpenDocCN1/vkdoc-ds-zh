  ## 引言


  我是在 COVID-19 疫情的不确定性中开始撰写这本书的。那段时间，我们作为人类，越来越多地待在室内（如果可能的话），通过增加数字连接和娱乐来分散对外部世界的注意力。在现实生活中社交互动的地方，我们转向了线上。通过
  Zoom 与朋友和家人通话成为了常态，我们专注于对我们最重要的人和事。我们以唯一可能的方式分享我们的生活与世界：数字化。快进到今天，一年多过去了，虽然疫情仍在，但希望已经出现。我满怀希望。


  这绝对不是我想象中开始我第一本书的方式——以回顾过去为开端。但当我们展望未来时，很难不看到过去两年（2020-2022 年）对人类与世界互动方式的持久影响。随着越来越多的体验转向虚拟世界，越来越多的协作在线进行，我们需要从根本上改变构建下一代平台、框架和技术的方式。系统规模和计算能力的量级变化需要进化思维、革命性的数据平台和以数据为中心的生态系统来推动这一数字未来。超连接和智能自动化将以惊人的规模驱动实时、一致的数据系统，而今天仅仅是个开始。


  这本书并非关于未来，而是教你如何在当下构建可靠的数据系统，利用 Apache Spark 的强大能力，由你——现代数据工程师——从现代数据生态系统的基本构建块出发，编排一致且可扩展的流式应用程序。通过动手实践的方法，你将学习运用许多在数据工程这一激动人心的领域取得成功所必需的最佳实践和解决问题的技能。


  ## 关于本书


  本书是使用 Apache Spark 构建一致、“关键任务”流式应用程序的入门指南。你不会从第一页就开始编写流式应用程序，而是会动手实践，使用 Spark 和一系列工具解决小问题，逐步推进。每一章都会介绍一个关键基础，以及你数据工程工具箱中的一个新工具。随着书籍的深入，你将接触到许多与
  Apache Spark 配合良好的常见数据系统和服务。到本书结束时，你将编写并在 Kubernetes 上部署一个经过全面测试的 Spark Structured
  Streaming 应用程序。你将拥有一个完整的容器化本地数据平台，可以将本书涵盖的想法和实现带到你的下一个项目中。对于某些读者来说，本书所学内容可能是一次复习；对于其他人来说，接下来的课程可能感觉像是窥见了数据的未来。无论如何，这段探索之旅都将是值得的。


  ## 谁应该阅读本书？


  如果你是一名软件工程师，希望将职业转向数据工程，或者你是一名数据科学家或分析师，希望快速上手使用 Apache Spark，那么你应该阅读本书。本书教你 Spark
  的核心 API 和常用组件，重点在于使用 Spark SQL 和编写可重用的编译应用程序。本书也温和地介绍了如何编写 Scala 来构建可靠的 Apache Spark
  应用程序。数据平台工程师或软件架构师可以将本书作为资源，了解如何使用开源软件构建可靠的流式系统，并作为构建可组合分布式数据系统的入门指南。最后，本书是一段动手实践之旅，任何对数据系统感兴趣的人，只要有一台电脑并好奇学习新事物，都可以体验。


  ## 动手实践材料与设置


  本书包含从第 3 章到第 15 章的动手练习。要跟随学习并充分利用本书，你需要从 GitHub 下载本书材料。下载材料后，各章节将变得更有趣，互动性也更强。


