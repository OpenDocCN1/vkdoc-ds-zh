  \ JAR 文件（已在本地编译）并定义一个要暴露的端口。\n\n提示\n\n思考一下如何通过复用容器来创建可堆叠的环境。在清单 10-5 的示例中，堆栈从 `apache-spark-base`\
  \ 开始，然后通过添加应用程序 JAR 来扩展堆栈。\n\n现在，你已经准备好运行应用程序并消费 Redis Stream。\n\n\n\n### 运行应用\n\
  \n该应用的功能类似于一个简单的回声服务器。当您向 Redis Stream 添加新事件时，应用将（几乎）立即处理该事件并输出格式化后的 DataFrame 和批处理标识符（微批次）。这个应用代表了我们进行的初次尝试，目的是确保所有组件正确连接。请务必牢记：始终从简单的部分开始，然后逐步构建。\n\
  \n此时，`redis-cli` 监视器（来自代码清单 10-2）开始变得有趣。如果您的屏幕空间足够，请同时打开 `redis-cli` 窗口和 `redis-cli`\
  \ 监视器窗口（来自代码清单 10-1 和 10-2），然后再打开第三个终端窗口来运行应用。\n\n执行代码清单 10-7 中的命令来启动容器并触发 Spark\
  \ 应用运行。\n\n```\ndocker run \\\n-p 4040:4040 \\\n--hostname spark-redis-test \\\n\
  --network mde \\\n-v ~/dataengineering/spark/conf:/opt/spark/conf \\\n-v ~/dataengineering/spark/jars:/opt/spark/user_jars\
  \ \\\n-it `whoami`/spark-redis-streams:latest \\\n/opt/spark/bin/spark-submit \\\
  \n--master \"local[*]\" \\\n--class \"com.coffeeco.data.SparkRedisStreamsApp\" \\\
  \n--deploy-mode \"client\" \\\n--jars /opt/spark/user_jars/mariadb-java-client-2.7.2.jar\
  \ \\\n--driver-class-path /opt/spark/user_jars/mariadb-java-client-2.7.2.jar \\\n\
  --conf \"spark.sql.warehouse.dir=s3a://com.coffeeco.data/warehouse\" \\\n--conf\
  \ \"spark.app.source.stream=com:coffeeco:coffee:v1:orders\" \\\n/opt/spark/app/spark-redis-streams.jar\n\
  代码清单 10-7\n用于启动运行于本地数据平台的 Spark Redis Streams 应用（容器内）的 docker run 命令\n```\n\nDocker\
  \ 容器将使用您之前编译并封装进容器的 `SparkRedisStreamApp` JAR 包启动。检查日志时，您会注意到许多来自 Spark 的信息级别（info-level）日志。您始终可以通过\
  \ log4j（将根级别日志记录更改为 `WARN` 或 `ERROR`，或仅选择应用日志）来减少这些无关信息。目前，这些日志可以帮助您更深入地了解其运行机制。\n\
  \n### Redis Streams 消费者组与偏移量\n\n应用启动时，它将连接到 `spark.app.source.stream` 配置值中指定的 Redis\
  \ Stream 标识符。您可以在输出日志中看到此过程。只需查找以下输出。\n\n```\nINFO RedisSource: Getting batch...\n\
  start: None\nend: {\"offsets\":{\"com:coffeeco:coffee:v1:orders\":{\"groupName\"\
  :\"spark-source\",\"offset\":\"1626552490734-0\"}}}\n```\n\n在此过程中，Spark 与 Redis\
  \ 之间会发生一次快速握手，您可以使用 `redis-cli` 监视器来观察。您将在监视器中看到以下输出。\n\n```\n\"XGROUP\" \"create\"\
  \ \"com:coffeeco:coffee:v1:orders\" \"spark-source\" \"$\" \"mkstream\"\n\"XINFO\"\
  \ \"STREAM\" \"com:coffeeco:coffee:v1:orders\"\n\"XREADGROUP\" \"group\" \"spark-source\"\
  \ \"consumer-1\" \"count\" \"100\" \"block\" \"500\" \"noack\" \"streams\" \"com:coffeeco:coffee:v1:orders\"\
  \ \">\"\n\"XINFO\" \"STREAM\" \"com:coffeeco:coffee:v1:orders\"\n```\n\n这些命令是应用在无先前状态启动时的握手过程的一部分。（您将在练习\
  \ 10-3 中学习如何通过检查点来存储应用状态。）这个信息收集流程会查询流并为应用创建新的消费者组。\n\n### 消费者组\n\n为了追踪流的位置并将 Spark\
  \ 应用与特定组关联，使用了 `XGROUP` 命令。鉴于该应用之前从未运行过，首先会创建一个新组，然后查询流（`XINFO`）以获取与流相关的所有元数据，以便\
  \ Spark 能够开始接收新事件。\n\n您可以在 `redis-cli` 中运行 `xinfo` 命令来查看返回的数据。\n\n```\nxinfo STREAM\
  \ com:coffeeco:coffee:v1:orders\n```\n\n然后，使用 `XREADGROUP` 命令，应用会创建一个初始位置来阻塞并等待新事件。\n\
  \n现在，应用已经了解了其初始状态，便可以继续执行并开始工作。这是任何 Structured Streaming 应用的关键第一步。实际上，您会发现这个过程也会创建第一个批次。\n\
  \n```\n\nBatch: 0\n\n+---------+-------+-------+----------+--------+-----+\n|timestamp|orderId|storeId|customerId|numItems|price|\n\
  +---------+-------+-------+----------+--------+-----+\n+---------+-------+-------+----------+--------+-----+\n\
  ```\n\n此过程现在仅在有新数据从 Redis Stream 到来时才会重复执行。让我们添加另一个事件。\n\n### 创建下一个批次\n\n您可以从步骤\
  \ 3 复制 `XADD` 命令并将其粘贴到 `redis-cli` 中，以触发一个新批次。\n\n```\nxadd com:coffeeco:coffee:v1:orders\
  \  * timestamp 1625766472513 orderId ord126 storeId st1 customerId ca183 numItems\
  \ 6 price 48.00\n```\n\n在 Spark 应用容器中，您将看到应用对事件做出响应并进行处理。从日志中，重要的输出部分是批次的确认以及批次格式化后的输出。\n\
  \n```\n\nBatch: 1\n\n+-------------+-------+-------+----------+--------+-----+\n\
  |    timestamp|orderId|storeId|customerId|numItems|price|\n+-------------+-------+-------+----------+--------+-----+\n\
  |1625766472513| ord126|    st1|     ca183|       6| 48.0|\n+-------------+-------+-------+----------+--------+-----+\n\
  ```\n\n尝试将以下事件粘贴到 `redis-cli` 中。您会注意到应用的运行行为有何特点？\n\n```\n> xadd com:coffeeco:coffee:v1:orders\
  \  * timestamp 1625766472503 orderId ord124 storeId st1 customerId ca153 numItems\
  \ 1 price 10.00\n> xadd com:coffeeco:coffee:v1:orders  * timestamp 1625766472513\
  \ orderId ord125 storeId st1 customerId ca173 numItems 2 price 7.00\n> xadd com:coffeeco:coffee:v1:orders\
  \  * timestamp 1625766472513 orderId ord126 storeId st1 customerId ca183 numItems\
  \ 6 price 48.00\n> xadd com:coffeeco:coffee:v1:orders  * timestamp 1625766472613\
  \ orderId ord127 storeId st1 customerId ca184 numItems 1 price 3.80\n```\n\n您会注意到应用会将每个事件放在其自己的批次中处理。好吧，您可能会问，这是为什么呢？这似乎与我们预期的微批次行为不太一致，我们期望其更具连续性。确实如此，这种行为可以通过在应用的控制路径中添加触发器来控制。\n\
  \n现在，您可以停止 docker 进程（^+C）或直接退出其运行的窗口。\n\n我们将在练习 10-2 中深入探讨应用代码本身，以了解构成此应用运行机制的各个组件。在此过程中，您将学到一些有助于简化应用编写的技巧。\n\
  \n### 练习 10-1：总结\n\n第一个练习从宏观层面教您了解了 Redis Streams 的工作原理。您学会了使用 `redis-cli`，弄清楚了\
  \ `redis-cli` 监视器的用途，并掌握了如何驾驭这些新的流处理方式。最后，您预览了 Spark Redis Streams 应用，接下来将学习其具体内容。\n\
  \n\n\n### 练习 10-2：解析 Redis 流应用\n\n你在练习 10-1 中运行的应用是一个不完整的结构化流应用。这是因为该应用尚未跟踪自身状态（因此它是无状态的），也没有对消费的事件进行任何有效处理。不过这都是有意为之；该应用的当前状态如图\
  \ 10-6 所示。\n\n![](img/505711_1_En_10_Fig6_HTML.png)\n\n图 10-6\n\n结构化流的起点。它连接到 Redis\
  \ 并持续轮询新事件\n\n图 10-6 展示了你刚在练习 10-1 中运行的应用。以此逻辑模型为基础，在你喜欢的 IDE 中打开 `redis-streams`\
  \ 项目，并导航到位于 `/ch-10/applications/redis-streams/SparkRedisStreamsApp.scala` 的文件。\n\
  \n你会注意到我们再次使用了在第 7 章介绍的 `SparkApplication` 特质。\n\n```scala\nobject SparkRedisStreamsApp\
  \ extends SparkApplication\n```\n\n作为回顾，这个特质的用途是为应用提供 `SparkSession`、应用名称句柄以及不可变的\
  \ `SparkConf`，这样在设置每个新应用时能大幅减少模板代码。\n\n### DataStreamReader\n\n参考上图，我们从 `DataStreamReader`\
  \ 开始。这是核心的结构化流接口之一，它提供了一种通用方式来将流式数据集加载到 Spark 中。在应用中，你会找到以下代码块。\n\n```scala\nlazy\
  \ val inputStream: DataStreamReader = {\nsparkSession.readStream\n.format(\"redis\"\
  )\n.option(\"stream.keys\", inputStreamName)\n.schema(streamStruct)\n}\n```\n\n\
  与批处理应用类似，我们使用 `SparkSession` 作为接口来配置数据源并生成新的读取器（即入口）。唯一区别在于，这里我们通过使用 `readStream`\
  \ 而非 `read` 来将数据源指定为流式数据源。\n\n**扩展 Spark**\n\n你可能也是第一次见到自定义数据源格式。Spark 是一个可插拔平台，它明白\
  \ `format(\"redis\")` 将通过 `spark-redis` 库（借助 `DataSourceRegister` 和 `StreamSourceProvider`\
  \ 接口）提供。你可以创建自己的源和接收器格式，为 Spark 添加新功能，而无需重复造轮子。\n\n然后我们填充数据源所需的配置。在本例中，只需提供流的名称（流的键名）以及该数据源期望的\
  \ schema。\n\n#### Schema 是必需的吗？\n\n对于大多数流式数据源，*schema* 是必需的。JSON 数据源可以推断 schema，但它是通过采样来完成的，这可能导致不一致性。这意味着在事件数据稀疏（例如可选字段）的情况下，你无法获得确定的\
  \ schema。为了省心，最好基于上游数据契约提供 schema。这样，你的应用就能建立在明确的预期之上。\n\n在练习的介绍部分，你已经了解了订单事件格式。以下\
  \ `struct` 是该应用的正式结构化数据契约。\n\n**OrderEvent 的 Schema**\n\n```scala\nlazy val streamStruct\
  \ = new StructType()\n.add(StructField(\"timestamp\", LongType, false))\n.add(StructField(\"\
  orderId\", StringType, false))\n.add(StructField(\"storeId\", StringType, false))\n\
  .add(StructField(\"customerId\", StringType, false))\n.add(StructField(\"numItems\"\
  , IntegerType, false))\n.add(StructField(\"price\", FloatType, false))\n```\n\n\
  值得一提的是，`DataStreamReader` 的 `schema` 构建方法既可以接受完全格式化的 `StructType`（如上所示），也可以接受 DDL\
  \ 字符串。Spark 会解析 DDL 字符串并为你组装好相应结构。\n\n**通过 DDL 字符串生成 StructType。这等价于调用 `StructType.fromDDL(streamStruct.toDDL)`**\n\
  \n```scala\nStructType.fromDDL(\"\"\"\n`timestamp` BIGINT,\n`orderId` STRING,\n\
  `storeId` STRING,\n`customerId` STRING,\n`numItems` INT,\n`price` FLOAT\"\"\")\n\
  ```\n\n这种灵活性使你能够编写丰富的、可配置驱动的流式应用，同时仍遵循严格的数据契约。\n\n以上就是应用如何知道连接到哪里以及期望上游提供什么 schema\
  \ 的方式。鉴于第一个流式应用较为简单，我们将直接进入 `DataStreamWriter`。\n\n### DataStreamWriter\n\n`DataStreamWriter`\
  \ 是用于将流式数据集写入 Spark 外部存储的核心接口。该接口提供的方法集比其批处理模式的对等体 `DataFrameWriter` 更少。我们将在练习 10-3\
  \ 中介绍 `outputMode`、`partitionBy` 和 `trigger` 的使用。查看 `run` 方法将向你展示实际用法。\n\n**来自 `SparkApplication`\
  \ 特质的 `run` 方法的流式实现**\n\n```scala\noverride def run(): Unit = {\n...\nval writer:\
  \ DataStreamWriter[Row] = SparkRedisStreams(sparkSession)\n.transform(inputStream.load())\n\
  .writeStream\n.queryName(\"orders\")\n.format(\"console\")\nstartAndAwaitApp(writer.start())\n\
  }\n```\n\n`run` 方法利用了一些可能不易察觉的简单应用设计模式。接下来我们将介绍懒加载调用和依赖注入的精妙用法。这些技术与第 7 章介绍的 Spark\
  \ 委派模式协同工作。\n\n#### 懒加载调用\n\n`run` 方法依赖 Scala 伴生类构造和懒加载依赖注入，以降低 Spark 读取此应用意图并生成执行计划的复杂度。\n\
  \n```scala\nSparkRedisStreams(sparkSession)\n.transform(...)\n```\n\n传递给 `transform`\
  \ 方法的 DataFrame 是对我们的 `DataStreamReader` 调用 `load` 方法的结果。\n\n```scala\n.transform(inputStream.load())\n\
  ```\n\n这个 `inputStream` 是一个懒加载单例，它充当一个承诺：在未来的某个时间点生成一个 DataFrame。这正是 Spark 在此时需要了解的全部信息。\n\
  \n\n\n### 依赖依赖注入\n\n顺便提一下，这种模式还能让你利用依赖注入为`transform`方法提供`DataFrame`。这使测试更简单，并为上游数据源提供了灵活性。目前应用连接的是\
  \ Redis，但你同样可以轻松接入 Kafka，且除了上游配置外，应用本身无需更改。由于接口绑定的是`DataFrame`而非`DataStreamReader`，这种模式还允许你针对批处理或流式数据源复用同一个应用。\n\
  \n至此，我们已接近拼图的最后一块。要构建一个结构化流应用，你需要同时具备数据源和数据接收端。我们已经介绍了上游数据源 Redis。快速回顾一下：这个流式数据源是通过\
  \ Spark Session 的`readStream`方法生成的，该方法返回一个`DataStreamReader`。现在，要满足最后一个需求，我们只需要一个接收端。\n\
  \n### 写入流式数据\n\n`writeStream`方法是`Dataset`类的成员。`DataFrame`本质上就是一个`Dataset[Row]`，而应用的`transform`方法返回一个`DataFrame`。因此，当我们调用`writeStream`时，实际上是将我们的`DataFrame`转换为`DataStreamWriter`。\n\
  \n在应用中，使用的输出格式是`\"console\"`。这是一个特殊的接收端，可用于观察应用的输出，因为它不会将任何数据写入可靠的数据存储。\n\n```\n\
  .writeStream\n.queryName(\"orders\")\n.format(\"console\")\n```\n\n当完整的应用链路（数据源\
  \ → 转换 → 接收端）搭建完毕后，剩下的就是启动应用。`DataStreamWriter`的`start`方法会创建一个`StreamingQuery`。\n\
  \n```\nstartAndAwaitApp(writer.start())\n```\n\n#### 流式查询\n\n[`StreamingQuery`](https://spark.apache.org/docs/latest/api/java/org/apache/spark/sql/streaming/StreamingQuery.html)接口封装了端到端的结构化流。它提供了在\
  \ Spark 应用中运行时对查询进行内省的方法。该接口还是线程安全的，因此你可以从驱动器的任何位置观察流。在本应用通过第 11 章的测试进行扩展和强化时，你将直接使用这个接口。\n\
  \n目前，你只需关注一个方法：`awaitTermination`。\n\n```\ndef startAndAwaitApp(query: StreamingQuery):\
  \ Unit = {\nstreamingQuery.awaitTermination()\n}\n```\n\n当你在流式查询上调用`awaitTermination`时，应用将持续运行，直到抛出无法恢复的异常，或进程被退出（例如停止\
  \ Docker 容器或发送终止信号）。\n\n这个端到端过程全部由应用入口点内的`run()`调用启动。\n\n### 应用入口点\n\n应用入口点是提供`main`方法的类。该应用扩展了`SparkApplication`特质，而后者又扩展了\
  \ Scala 的`App`特质。因此，当你之前运行此应用时，本质上是在调用`SparkRedisStreamsApp`的 main 方法，该方法会调用`run()`。\n\
  \n```\n/opt/spark/bin/spark-submit \\\n--master \"local[*]\" \\\n--class \"com.coffeeco.data.SparkRedisStreamsApp\"\
  \ \\\n...\n/opt/spark/app/spark-redis-streams.jar\n```\n\n现在你已经了解了初始应用的工作原理，我们可以更进一步，对应用进行二次迭代。在练习\
  \ 10-3 中，你将学习使用检查点使应用具备状态管理能力。\n\n### 练习 10-2：总结\n\n在练习 10-2 中，你学习了练习 10-1 中介绍的应用如何工作。你逐步了解了如何将流式数据源连接到流式数据写入器，并学习了接收的事件（跨每个批次）如何从源头流向接收端。这个简单的练习向你介绍了\
  \ Structured Streaming 的核心 Spark 接口：`DataStreamReader`、`DataStreamWriter`和`StreamingQuery`接口。最后，你学习了如何分层使用懒调用和依赖注入来创建易于理解和维护的\
  \ Spark 应用。\n\n在下一个练习中，你将学习为此应用添加检查点。\n\n### 练习 10-3：使用检查点进行可靠的有状态流处理\n\n在练习 10-1\
  \ 中，应用启动时 Spark 和 Redis 之间发生了一次握手。这个过程为我们有状态的应用生成了初始状态。不幸的是，当你终止进程时，所有这些临时状态基本上都被清除了。这意味着应用在离线期间会跳过处理所有添加到\
  \ Redis Stream 的数据。\n\n你可能已经猜到我要说什么了。是的，这并非理想情况，而且确实无助于建立对应用的信心。\n\n#### 为什么检查点很重要\n\
  \n检查点为你提供了一个保存点。就像任何经典电子游戏一样，这为你提供了一个安全的地方，在失败时可以回到这里。现在，对于我们的应用来说，如果它失败了，我们需要能够从精确的断点处重新开始。\n\
  \n#### 可靠的检查点\n\n可靠的检查点始于一致性和持久性的概念。这应该会让你想到容错性，而且将其与原子性联系起来也并不困难。Apache Spark 通过依赖分布式文件系统（即\
  \ HDFS）的基础，将应用检查点（状态）存储在外部，从而实现了可靠的检查点功能。这样，即使应用运行的机器宕机，应用也能被重新启动。\n\n#### 启用可靠的检查点\n\
  \n打开`StatefulSparkRedisStreamsApp`。此应用在引入可靠检查点时几乎无需改动。实际上，只有两个明显的变更。\n\n第一个变更体现在`run`方法中。\n\
  \n*向 DataStreamWriter 添加 checkpointLocation*\n\n```\nSparkRedisStreams(sparkSession)\n\
  .transform(inputStream.load())\n.writeStream\n.queryName(\"orders\")\n.option(\"\
  checkpointLocation\", appCheckpointLocation)\n.format(\"console\")\n```\n\n传入此参数的值通过`SparkConf`传递给应用。\n\
  \n```\nlazy val appCheckpointLocation: String = sparkConf.get(\"spark.app.checkpoint.location\"\
  )\n```\n\n现在让我们运行这个应用。\n\n#### 运行有状态应用\n\n你可以通过在练习 10-1 中使用的 Docker `run`脚本上进行轻微修改来测试此应用。\n\
  \n```\ndocker run \\\n...\n--class \"com.coffeeco.data.StatefulSparkRedisStreamsApp\"\
  \ \\\n--conf \"spark.sql.warehouse.dir=s3a://com.coffeeco.data/warehouse\" \\\n\
  --conf \"spark.app.source.stream=com:coffeeco:coffee:v1:orders\" \\\n--conf \"spark.app.checkpoint.location=s3a://com.coffeeco.data/apps/spark-redis-streams-app/1.0.0/simple\"\
  \ \\\n/opt/spark/app/spark-redis-streams.jar\n```\n\n两处高亮显示的变更分别对应应用入口点以及提供应用检查点位置所需的新增配置。\n\
  \n\n\n#### 观察有状态行为\n\n在应用运行状态下，打开你的 `redis-cli`（如果已关闭），并粘贴一个练习 10-1 中的 `OrderEvents`\
  \ 示例。\n\n```\n> xadd com:coffeeco:coffee:v1:orders  * timestamp 1625766472503 orderId\
  \ ord124 storeId st1 customerId ca153 numItems 1 price 10.00\n```\n\n这将触发批次处理，其行为与之前相同。接下来是激动人心的部分：停止\
  \ Spark 应用（按 Control+C）。在重新启动应用之前，向 Redis 流中再添加三个事件。\n\n```\n> xadd com:coffeeco:coffee:v1:orders\
  \  * timestamp 1625766472503 orderId ord124 storeId st1 customerId ca153 numItems\
  \ 1 price 10.00\n> xadd com:coffeeco:coffee:v1:orders  * timestamp 1625766472613\
  \ orderId ord127 storeId st1 customerId ca184 numItems 1 price 3.80\n> xadd com:coffeeco:coffee:v1:orders\
  \  * timestamp 1625766472513 orderId ord125 storeId st1 customerId ca173 numItems\
  \ 2 price 7.00\n```\n\n重新启动 Spark 应用。你可能首先观察到的（如果扫描日志）是，Redis Source 输出现在包含一个起始参数。\n\
  \n```\nINFO RedisSource: 正在获取批次...\nstart: Some({\"offsets\":{\"com:coffeeco:coffee:v1:orders\"\
  :{\"groupName\":\"spark-source\",\"offset\":\"1626658307940-0\"}}})\nend: {\"offsets\"\
  :{\"com:coffeeco:coffee:v1:orders\":{\"groupName\":\"spark-source\",\"offset\":\"\
  1626658362223-0\"}}}\n```\n\n你还会发现应用能无缝衔接，仿佛从未离线过。与重新从批次 `0` 开始不同，你会看到下一个批次是非零的。例如：\n\
  \n```\n批次: 2\n\n+-------------+-------+-------+----------+--------+-----+\n|   \
  \ timestamp|orderId|storeId|customerId|numItems|price|\n+-------------+-------+-------+----------+--------+-----+\n\
  |1625766472503| ord124|    st1|     ca153|       1| 10.0|\n|1625766472613| ord127|\
  \    st1|     ca184|       1|  3.8|\n|1625766472513| ord125|    st1|     ca173|\
  \       2|  7.0|\n+-------------+-------+-------+----------+--------+-----+\n```\n\
  \n这意味着你现在可以在应用宕机后无缝恢复，不会遗漏任何数据处理。\n\n#### 检查点的工作原理\n\n对于每个批次，流数据源会将用于该批次的显式偏移量写入可靠存储（即分布式文件系统），这被称为**预写式日志**。在每个成功批次完成后，会以提交的形式将确认信息写入可靠存储。你可以从图\
  \ 10-7 中了解此过程。\n\n![](img/505711_1_En_10_Fig7_HTML.png)\n\n图 10-7\n\n检查点处理流程\n\n\
  每个批次都会重复此过程。这意味着批次中的故障不会“移动”游标，你的应用将从上一个成功的保存点重新启动。\n\n你可以通过 MinIO 浏览器 [`http://127.0.0.1:9000/minio/com.coffeeco.data/apps/spark-redis-streams-app/1.0.0/simple/`](http://127.0.0.1:9000/minio/com.coffeeco.data/apps/spark-redis-streams-app/1.0.0/simple/)\
  \ 或文件系统下的 `~/dataengineering/minio/` 路径检查应用检查点。\n\n#### 删除检查点\n\n仅当应用生命周期结束，或应用正在更新且底层\
  \ DAG 发生变化时，才需要删除检查点。当你更改数据源或数据接收器，或向表中添加更多数据源（例如来自多个上游的流式连接）时，DAG 会发生更改。\n\n###\
  \ 练习 10-3：总结\n\n第三个练习向你介绍了使 Structured Streaming 可靠的关键机制——检查点。你了解到每个批次都通过预写式日志（WAL）进行控制，每个成功批次都通过提交标记为完成。即使运行应用的物理服务器或机器发生致命故障，这个简单的过程也能跟踪你的应用状态。\n\
  \n在本章的最后一个练习中，你将学习如何通过添加处理触发器来控制应用的运行时行为。\n\n### 练习 10-4：使用触发器控制应用运行时行为\n\n触发器可用于控制\
  \ Structured Streaming 应用的行为。在本练习中，你将学习在增强应用的同时应用三种不同类型的触发器。更改内容如图 10-8 所示。\n\n\
  ![](img/505711_1_En_10_Fig8_HTML.png)\n\n图 10-8\n\n对 Redis Streams 应用进行的最终更新。此更改将写入通过\
  \ Redis Streams 读取的数据内容，然后将这些事件写出到持久的分布式表中。\n\n打开名为 `TriggeredStatefulSparkRedisStreamsApp`\
  \ 的文件。你将在此文件中找到几个新方法、新配置以及对 `run` 方法的更新。直接跳转到 `outputStream` 方法，因为我们将从这里开始。此方法负责构建一个部分的\
  \ `DataStreamWriter`。\n\n```\nlazy val outputStream: DataStreamWriter[Row] = {\n\
  SparkRedisStreams(sparkSession)\n.transform(inputStream.load())\n.writeStream\n\
  .queryName(\"orders\")\n.format(\"parquet\")\n.partitionBy(\"storeId\")\n.option(\"\
  path\", streamingSinkLocation)\n.outputMode(OutputMode.Append())\n}\n```\n\n流式接收器的输出格式是\
  \ *parquet*。这意味着应用正在将从 Redis 流中读取的数据转换为 parquet 格式，然后将这些事件按 `storeId` 分区写出到由 `streamingSinkLocation`\
  \ 定义的路径中。当你使用 `partitionBy` 写入时，本质上是在创建键/值命名的目录。\n\n```\n/tables/coffee.order.events/storeId={storeId}/\n\
  ```\n\n**提示**：根据经验法则，你应该在低基数列上对表进行分区。通常的做法是使用日期（date=YYYY-mm-dd）和年份部分（year=YYYY/month=mm/day=dd）。为了增加多样性，你可以包含与你将要执行的查询相关的列。在本练习中，该列是\
  \ `storeId`。\n\n最后，我们将输出格式更改为仅追加模式：`OutputMode.Append()`。这只会让流式 DataFrame/dataset\
  \ 中的新行写入接收器。当我们下一章研究使用聚合时，输出模式会更有意义，因为它们有助于减少有状态聚合和其他分析处理的输出量。我们现在来看看触发器。\n\n\n\n\
  ### 更新后的触发式运行方法\n\n`run` 方法现在会利用提供的触发器配置，对 `outputStream` 方法生成的 `DataStreamWriter`\
  \ 进行进一步定制。让我们来看看这两个配置值。\n\n```\nlazy val triggerEnabled: Boolean = sparkConf.getBoolean(\n\
  \"spark.app.stream.trigger.enabled\", true)\n```\n\n为什么你需要启用或禁用触发功能？在应用恢复或重放场景中，触发器可能会阻碍应用达到最大吞吐量。例如，`ProcessingTime`\
  \ 触发器能让 Spark 应用基于一个时间间隔（如 30 秒、5 分钟或 1 小时）来执行。每次应用触发时，它会运行至完成所需的时间，然后计时器开始倒计时，直到下一次可以触发下一个批次。如果你希望应用快速处理，能够为这类特殊用例切换开关并短路触发机制就非常有用。\n\
  \n```\nlazy val triggerType: String = sparkConf.get(\n\"spark.app.stream.trigger.type\"\
  , \"processing\")\n```\n\n触发器类型与 `processing`、`once` 或 `continuous` 这些值相关联。这三种类型的触发器在\
  \ Spark Structured Streaming 中均可使用。\n\n让我们看看这两个配置如何协同工作，以控制用于在 `run` 方法中生成最终 `StreamingQuery`\
  \ 的配置项。\n\n```\noverride def run(): Unit = {\nsuper.run()\nval writer: DataStreamWriter[Row]\
  \ = triggerType match {\ncase \"continuous\" if triggerEnabled =>\nval checkpointInterval\
  \ = \"30 seconds\"\noutputStream\n.option(\"checkpointLocation\",  s\"$appCheckpointLocation/trigger/continuously/\"\
  )\n.trigger(Trigger.Continuous(checkpointInterval))\ncase \"once\" if triggerEnabled\
  \ =>\noutputStream\n.option(\"checkpointLocation\",\ns\"$appCheckpointLocation/trigger/once/\"\
  )\n.trigger(Trigger.Once())\ncase \"processing\" if triggerEnabled =>\noutputStream\n\
  .option(\"checkpointLocation\", s\"$appCheckpointLocation/trigger/processing/\"\
  )\n.trigger(Trigger.ProcessingTime(\"10 seconds\"))\ncase _ => outputStream\n.option(\"\
  checkpointLocation\",\ns\"$appCheckpointLocation/trigger/none/\")\n}\nstartAndAwaitApp(writer.toTable(streamingTableName))\n\
  }\n```\n\n我们已经介绍过 `DataStreamWriter` 接口的作用。这里我们只是使用了一种更函数式的方法，通过 `triggerType` 的模式匹配来生成最终的\
  \ writer。\n\n```\ntriggerType match {\ncase \"continuous\" if triggerEnabled =>\n\
  case \"once\" if triggerEnabled =>\ncase \"processing\" if triggerEnabled =>\ncase\
  \ _ =>\n}\n```\n\n模式匹配使得检查 `triggerType` 是否等于 `continuous`、`once` 或 `processing`\
  \ 变得更容易。否则，应用将回退到默认的无触发器的微批处理模式。在每个代码块内部，都发生着一些有趣的事情。现在让我们来逐一分析。\n\n### 持续处理模式\n\
  \n本章前面部分我们介绍了什么是持续处理模式。本质上，它会对来自数据源的每个事件进行处理直到完成，并异步提交，而不关心其他任何事件的状态（因为没有批次这个概念）。\n\
  \n```\nTrigger.Continuous(checkpointInterval)\n```\n\n不幸的是，我们只能在使用 Kafka 作为数据源时使用这种执行模式，因此我们必须等到下一章再介绍。（你可以使用第\
  \ 11 章中的环境进行测试，作为后续探索。）\n\n### 周期处理\n\n有时候，你会发现需要控制应用触发每个微批次的频率。例如，你需要每分钟运行一次作业，但又不想使用\
  \ Airflow 来实现。\n\n你可以使用这个触发器来替代 Airflow 调度器，每五分钟运行一个新批次：`Trigger.ProcessingTime(\"\
  5 minute\")`。\n\n```\ncase \"processing\" if triggerEnabled =>\noutputStream\n.option(\"\
  checkpointLocation\", s\"$appCheckpointLocation/trigger/processing/\")\n.trigger(Trigger.ProcessingTime(\"\
  10 seconds\"))\n```\n\n在这个应用中，该时间间隔被固定为十秒。你可以轻松地添加一个配置参数，以更动态的方式控制触发器。\n\n### 有状态批处理作业\n\
  \n回到第 7 章，你了解了有状态批处理作业。好的，现在我们就在这里，你正在查看用于将应用从持续有状态 Structured Streaming 应用转变为有状态批处理应用的控制器。虽然从技术上讲，这仍然是一个\
  \ Structured Streaming 应用，但它在首次运行后不会继续执行，这一事实给了我们将其称之为有状态批处理应用的空间。\n\n```\ncase\
  \ \"once\" if triggerEnabled =>\noutputStream\n.option(\"checkpointLocation\",\n\
  s\"$appCheckpointLocation/trigger/once/\")\n.trigger(Trigger.Once())\n```\n\n###\
  \ 流式表写入器\n\n在测试应用之前的最后一项任务，是简要讨论一下对 `run` 方法末尾所做的更改。\n\n```\nstartAndAwaitApp(\n\
  writer.toTable(streamingTableName)\n)\n```\n\n`DataStreamWriter` 有一个名为 `toTable`\
  \ 的方法。这个方法，就像你之前看到的 `start` 方法一样，会生成一个 `StreamingQuery`。其背后的原理是，表的元数据现在被写入 Hive\
  \ Metastore（正如你在第 6 章中所学的），而物理分区的 parquet 文件的其余部分则被写入分布式文件系统。\n\n`streamingTableName`\
  \ 存储在 `sparkConf` 中，具体配置项为 `spark.app.streaming.table.name`。在本例中，它被命名为 `coffee_orders`。\n\
  \n\n\n#### 使用触发器运行有状态应用\n\n接下来只需运行应用即可。你需要打开 `redis-cli`，并准备好订单事件，以便在应用启动后立即开始输入。\n\
  \n##### 使用一次性触发器运行\n\n必要的配置如下所示。你可以直接从应用目录中的 `README` 获取完整命令，或者对练习 10-1 中展示的原始完整`docker\
  \ run`命令进行必要的调整。\n\n```\ndocker run \\\n...\n--class \"com.coffeeco.data.TriggeredStatefulSparkRedisStreamsApp\"\
  \ \\\n--conf \"spark.sql.warehouse.dir=s3a://com.coffeeco.data/warehouse\" \\\n\
  --conf \"spark.app.source.stream=com:coffeeco:coffee:v1:orders\" \\\n--conf \"spark.app.stream.trigger.enabled=true\"\
  \ \\\n--conf \"spark.app.stream.trigger.type=once\" \\\n--conf \"spark.app.checkpoint.location=s3a://com.coffeeco.data/apps/spark-redis-streams-app/canary/\"\
  \ \\\n--conf \"spark.app.streaming.sink.path=s3a://com.coffeeco.data/tables/coffee.order.events/\"\
  \ \\\n--conf \"spark.app.streaming.table.name=coffee_orders\" \\\n/opt/spark/app/spark-redis-streams.jar\n\
  ```\n\n应用将启动。如果没有检查点，它将创建初始的批次 0，然后应用完成。然而，就像练习 10-3 中的有状态应用示例一样，你可以向 Redis 流中添加任意数量的事件，然后重新启动应用。它会处理所有事件，然后再次停止运行。其美妙之处在于，你可以使用\
  \ Docker 操作符从 Airflow 运行此应用，从而执行完全一致、可靠的、有状态的批处理作业。很简洁。\n\n##### 使用处理时间触发器运行\n\n\
  这将启动应用，并为其提供全新的检查点。然后，你可以自由添加任意数量的新事件，并观察应用的行为。它会在每次运行之间暂停十秒钟。\n\n```\ndocker run\
  \ \\\n...\n--class \"com.coffeeco.data.TriggeredStatefulSparkRedisStreamsApp\" \\\
  \n--conf \"spark.sql.warehouse.dir=s3a://com.coffeeco.data/warehouse\" \\\n--conf\
  \ \"spark.app.source.stream=com:coffeeco:coffee:v1:orders\" \\\n--conf \"spark.app.stream.trigger.enabled=true\"\
  \ \\\n--conf \"spark.app.stream.trigger.type=processing\" \\\n--conf \"spark.app.checkpoint.location=s3a://com.coffeeco.data/apps/spark-redis-streams-app/canary/\"\
  \ \\\n--conf \"spark.app.streaming.sink.path=s3a://com.coffeeco.data/tables/other.coffee.order.events/\"\
  \ \\\n--conf \"spark.app.streaming.table.name=other_coffee_orders\" \\\n/opt/spark/app/spark-redis-streams.jar\n\
  ```\n\n#### 持续运行\n\n目前我们还无法以持续模式运行。我们需要将 Kafka 引入其中，这将在下一章进行。\n\n#### 查看结果\n\n你可以通过跳转到运行\
  \ MySQL 的 Docker 实例并直接查询 Hive Metastore 来检查其中存储的值。\n\n```\ndocker exec -it mysql\
  \ bash\nmysql -u dataeng -p\nuse metastore;\nselect * from TABLE_PARAMS\nwhere TBL_ID\
  \ =(\nselect TBL_ID from TBLS\nwhere TBL_NAME = \"coffee_orders\"\n);\n```\n\n该输出将是与\
  \ `coffee_orders` 表相关的元数据。\n\n*使用 DataStreamWriter 上的 toTable 方法生成的 Hive Metastore\
  \ 记录*\n\n```\n+------------------------------------------------------------+\n|\
  \ TBL_ID | PARAM_KEY                            | PARAM_VALUE|\n+--------+--------------------------------------+------------+\n\
  |     16 | EXTERNAL                             | TRUE       |\n|     16 | spark.sql.create.version\
  \             | 3.1.2      |\n|     16 | spark.sql.partitionProvider          |\
  \ catalog    |\n|     16 | spark.sql.sources.provider           | parquet    |\n\
  |     16 | spark.sql.sources.schema.numPartCols | 1          |\n|     16 | spark.sql.sources.schema.numParts\
  \    | 1          |\n|     16 | spark.sql.sources.schema.part.0      | {schema}\
  \   |\n|     16 | spark.sql.sources.schema.partCol.0   | storeId    |\n|     16\
  \ | transient_lastDdlTime                | 1626675149 |\n+--------+--------------------------------------+------------+\n\
  ```\n\n你会看到该表是一个外部表。这意味着你可以从 Spark 目录中删除该表，但仍保留位于分布式文件系统中的物理表。\n\n### 练习 10-4：总结\n\
  \n这个最后的练习教你如何在应用程序中连接多种执行模式，并使用由配置驱动的特性标志来改变应用程序的行为。虽然你可以将这些示例进一步扩展，但这已经是使用 Apache\
  \ Spark Structured Streaming 的一个很好的入门介绍了。\n\n## 本章总结\n\n本章我们涵盖了很多内容。你了解了 Spark Structured\
  \ Streaming 的核心处理原则。\n\n-   执行/处理模式（微批处理或持续处理模式）\n-   触发器（有效的处理窗口/边界）\n-   增量查询（跨时间的渐进式数据处理）\n\
  -   流式输出模式（完整模式、更新模式和追加模式）\n\n你学习了如何使用触发器在微批处理执行模式和持续执行模式之间切换。虽然当前没有可用的正确组件（即 Kafka），但你仍然有一个可插入的应用程序以应对该用例（这即将到来）。你使用了仅追加输出模式，这意味着只有\
  \ Spark 之前未见过的数据才会通过接收器写入。你将在下一章学习如何使用其他模式。最后，你拥有一整套可用的工具，包括在将 Apache Spark 应用容器化方面的新技能。\n\
  \n在下一章中，我们将继续 Structured Streaming 的学习，重点放在更高级的数据处理上，从流式连接到聚合以及其他分析处理。你还将亲自使用 Kafka，将其纳入你庞大的数据工程工具集。我们开始吧。\n\
  \n# 11. Apache Kafka 与 Spark Structured Streaming\n\n上一章介绍了如何使用 Apache Spark Structured\
  \ Streaming。你了解了如何使用流行的 Redis 数据库来创建结构化的内存事件流，并探讨了如何编写有状态的流式应用程序。\n\n本章将扩展上一章学到的技能，包括：如何使用核心的\
  \ Structured Streaming API——`DataStreamReader` 和 `DataStreamWriter`；如何利用应用程序检查点创建能够处理容错和重启的有状态流式应用；如何使用触发器控制应用处理频率和运行风格；以及最后，有状态流和有状态批处理中应用的流程如何工作。你将通过重点学习如何使用\
  \ Apache Kafka 作为 Spark 与其余数据生态系统之间的管道，继续探索 Structured Streaming 的工作原理。\n\n## Apache\
  \ Kafka 简介\n\nApache Kafka 在第 1 章中介绍过，它是当今应用最广泛的事件和数据流处理框架。Kafka 在数据工程生态系统中的主导地位与其提供的稳定功能有关。它介入并解决了与分布式系统和服务间通信相关的常见问题。\n\
  \n\n\n### 异步通信\n\nAPI 及其他 HTTP 服务要求所有依赖的系统和服务均处于运行状态，才能以同步方式处理请求。后端服务通常会实现不同级别的重试机制，以便在遇到无响应的系统或服务时进行退避，并在多次尝试后放弃并向调用方返回错误。第\
  \ 9 章介绍了“惊群效应”问题以及资源稀缺如何在进程争相弥补损失时间时引发麻烦。Kafka 能够使（可处理异步请求的）系统摆脱传统的请求/响应周期，转变为一种新的模式：可以查询请求标识符以获取完成状态，或者通过使用\
  \ webhook 或回调来通知该 API 请求所封装操作的最终成功或失败状态。\n\n### 水平可扩展性\n\nKafka 能够高效处理因主题（用于存储一组相关事件/类型的持久化存储机制）的消费者（读取者）、生产者（写入者）或两者数量增加而给系统带来的常见负载问题。其实现方式是支持集群中服务器数量向外扩展（水平扩展），而非单纯扩展服务器本身的规模（CPU/内存/磁盘）。\n\
  \n与可能因单台服务器资源有限而饱受过多连接困扰的传统数据库不同，Kafka 的代理节点可以横向扩展，从而整体提升整个集群的吞吐能力。\n\n代理节点是一种服务器端（集群成员）服务，负责处理集群中所有分布式请求的一部分。每个代理节点都被分配并负责一个或多个分布式主题分区（数据文件）的一部分，其角色可以是分区领导者（分区的主要所有者），也可以是副本（当前领导者分区的冗余备份）。通过增加代理节点数量，可以在集群中更均匀地分担读取、写入或冗余恢复等更高负载。这使得平台能够扩展以满足主题的数据需求，同时也能管理分布式系统在可用性和一致性方面带来的各种问题。\n\
  \n### 高服务可用性与一致性\n\n你在第 1 章中了解了 CAP 定理，鉴于 Kafka 是一个分布式、网络连接的服务，一致性、可用性和网络分区容错性问题至关重要。该定理指出，为了维持分布式一致性，服务在处理网络分区（集群中的盲点）时无法保持完全可用。因此，Kafka\
  \ 在主题内部使用分区复制来实现高可用性和一致性。为确保在担任分区领导者的代理节点（服务器）离线（或服务器关机/宕机）时，有不止一个完整的同步副本（ISR）可用于冗余，每次写入都会持久化地写入预写日志并向写入者（生产者）确认。Kafka\
  \ 集群可以利用 ISR 协议来可靠地选择丢失分区的下一个可用 ISR（冗余副本），并将该代理节点提升为新的主题分区领导者。每当代理节点离线时，此循环就会重复，以在最大程度上减少对给定主题的消费者和生产者的影响，恢复主题的一致性和可用性。\n\
  \n与 Kafka 将主题内容分布到多个分区的方式相同，代理节点本身也可用于在节点之间传播主题级别的命令。例如，为了以零停机方式增加主题的分区数量，可以使用任何代理节点来进行消息传播（类似流言协议）。主题级别的配置也可以在实时、零停机的情况下进行调整，以应对因生成的有效负载（事件）规模增大而导致的数据需求增加，或因生产和消费的记录数量增长而带来的需求变化。为何要进行横向扩展？这个概念让我们回到大数定律。所有系统在单进程内需要处理的负载越大，速度就会越慢。因此，拆分主题的分区（例如，增加封装整个主题的分区数量）是应对大数据系统规模需求的一种方式。\n\
  \n### 灾难恢复\n\n通过允许应用程序从更早的时间点重放事件（数据），系统和服务可以应对一定的停机或服务中断情况，并从原本可能导致数据丢失的场景中恢复过来。这对于数据管道尤为重要，因为丢失一个事件就等于数据丢失，而具有恢复选项的降级服务最终仍能达到最终一致性。\n\
  \n### 事件流与数据管道生态系统\n\nApache Kafka 解决了一个类似于*数据湖*（在第 1 章中介绍）的问题。请记住，数据湖为来自整个组织的原始、未处理数据提供了一个统一、弹性可扩展的单一真实来源，它充当一个中心化暂存区域，以便数据可以在稍后时间点被可靠地重新读取、重新处理和转换为可用数据。这个中心化数据暂存区域解决了一个与数据管道以及过早进行有损数据转换有关的问题。如果你无法追溯到事件的原始真实来源，那么损坏的数据就会简单地向下游流动。\n\
  \n另一方面，Apache Kafka 提供了一个统一的事件流解决方案，它将事件数据组织成*主题*，其作用类似于支撑数据湖的分区式分布式文件系统。主题支持构建由编码二进制数据组成的数据管道，这些管道可以被接入以生成丰富的数据网络。数据湖与\
  \ Kafka 之间的关键区别在于时间，特别是最小化数据生成（写入主题）与数据可被下游消费（读取）之间的时间差。\n\nKafka 使连接的客户端能够在分配给某个主题的服务器端代理节点组（仲裁）提交并确认收到来自已连接数据生产者发布的事件（记录）后，立即（近实时地）消费数据。连接的客户端只需按预定时间间隔轮询一个主题，以记录（事件）集合的形式获取任何新数据。Kafka\
  \ 有意最小化事件创建与事件可被处理之间的时间差（增量），这对于实时事件流处理以及实时数据处理至关重要。\n\n在本章中，你将会学习以下内容：\n\n- 使用\
  \ Docker 配置并运行一个 Kafka 集群\n- 创建和修改 Kafka 主题\n- 连接并配置 Spark Kafka 库\n- 使用 Kafka 数据源\n\
  - 将来自 Kafka 的二进制数据转换为 DataFrame 和数据集\n- 使用 Kafka 数据接收器\n\n**练习材料**\n\n第 11 章的练习材料位于\
  \ `https://github.com/newfront/spark-moderndataengineering/tree/main/ch-11`。每个练习中的\
  \ `README` 文件将为你提供有关任何额外安装或注意事项的更多背景信息。\n\n\n\n## 章节练习\n\n以下练习将帮助你继续探索 Spark 结构化流框架的特性与功能。首先，你将使用\
  \ `docker-compose` 在本地启动 Kafka。在深入探讨如何充分利用 Kafka 丰富流生态系统的模式之前，这也是一个熟悉 Kafka 各种架构组件运行原理的机会。\n\
  \n## 练习 11-1：启动并运行 Apache Kafka\n\n打开章节材料，导航至名为 `ch-11` 的目录，开始进行练习。\n\n### 练习 11-1：材料\n\
  \n练习材料位于 `ch-11` 目录下。\n\n```\nch-11\n├── docker\n│   └── kafka\n│       ├── README.md\n\
  │       └── docker-compose.yaml\n└── exercises\n    └── 01_kafka_up_and_running\n\
  ```\n\n### 启动本地环境\n\n使用 `docker/kafka` 目录下提供的 `docker-compose` 文件开始操作。按照 `README.md`\
  \ 文件中的步骤，将 Kafka 纳入你的数据工程工具箱。现在，你可以使用 `docker compose` 命令启动一个完整的 Kafka 集群，运行 Zookeeper（有状态元数据存储）和三个\
  \ Kafka 代理。\n\n```\ndocker compose \\\n-f ~/dataengineering/kafka/docker-compose.yaml\
  \ \\\nup -d --remove-orphans\n```\n\n`docker-compose` 文件配置了一个功能完整的 Kafka 集群（使用前几章的\
  \ `mde` Docker 网络），从而允许从你的笔记本电脑和 Docker 运行时内部进行访问。现在，你可以从你的 Spark 应用程序连接到该 Kafka\
  \ 集群。\n\n运行 Kafka 集群的容器可以使用以下 `docker ps` 命令查看。这将过滤出名字匹配 `kafka_` 前缀的运行中容器。\n\n\
  ```\ndocker ps \\\n--filter \"name=kafka_*\" \\\n--filter \"network=mde\" \\\n--format\
  \ \"table {{.Names}}\\t{{.Mounts}}\\t{{.Networks}}\" \\\n-s\n```\n\n输出将显示运行你全新 Kafka\
  \ 集群的四个容器。\n\n```\nNAMES               MOUNTS              NETWORKS\nkafka_kafka-2_1\
  \     kafka_kafka_2_...   mde\nkafka_kafka-1_1     kafka_kafka_1_...   mde\nkafka_kafka-0_1\
  \     kafka_kafka_0_...   mde\nkafka_zookeeper_1   kafka_zookeepe...   mde\n```\n\
  \n三个容器代表集群代理，第四个容器是 Apache Zookeeper。Zookeeper 负责存储 Kafka 集群元数据（状态），包括代理标识符、分区领导者以及每个主题在集群中的副本位置。接下来你将了解更多关于主题如何工作的信息，并创建你的第一个主题。\n\
  \n### 创建你的第一个 Kafka 主题\n\n现在你的 Kafka 集群已经启动并运行，你可以创建你的第一个*主题*了，但在创建之前，让我们先了解一些与\
  \ Kafka 主题相关的更多特性或行为。然后你就可以开始创建你的第一个主题了。\n\n#### 主题的行为方式\n\n从高层次来看，主题的行为类似于数据库中的表，但更像是一个分布式提交日志，用于存储结构化的键/值对记录。\n\
  \n从 Spark 的角度来看，基于键/值的 Kafka 记录的一般结构如列表 11-1 所示。Kafka 记录（`StructType`）的格式至少包含一个名为\
  \ `value` 的列，该列在静态存储时被编码为字节数组（二进制），以及数据被读取的 `topic`、记录静态所在的分区 `partition`，以及单个记录的\
  \ `offset`（可以将其视为指向主题分区内行位置的指针）。\n\n```\nroot\n|\n- key \n- value \n- topic \n-\
  \ partition \n- offset \n- timestamp \n- timestampType \n- headers >\n列表 11-1\n\
  Kafka 记录结构数据格式\n```\n\nKafka 记录被分片（或简单地分布）在关联主题的总分区数上。由于记录键列对每条 Kafka 记录是可选的，对于空键的默认分区机制是以轮询方式插入记录，这意味着每条生产记录的最终分区分配是非确定性的。这最终意味着在相同数据集上重复运行时，数据无法保证落在相同的分区上。然而，通过为每个记录键提供一个非空值，Kafka\
  \ 将使用提供的键作为分区机制（哈希分区），使得每条记录能够确定性地路由到给定主题的特定分区。\n\n**提示**\n\n对于事件流，事件数据要么依赖于流中的其他事件来讲述发生了什么（或正在发生什么），要么每个事件可以独立存在，自行讲述完整的故事。第\
  \ 9 章介绍了相互依赖和独立事件数据的概念，你可以利用 Kafka 来优化事件在每个主题分区内的发出方式，从而针对相互依赖或独立事件的用例进行优化。\n\n\
  我们已经确定主题是一种集合机制，它像导管或通道一样用于事件流，但我们尚未涵盖是什么让 Kafka 如此出色。每条已发布的记录在插入时都会被打上代理端的时间戳（以毫秒为单位），并且仅在成功写入（提交）后才得到确认。伴随确认而来的保证是，主题将在逐个分区的基础上维护时间同步的插入顺序，本质上是为你提供一组按插入时间排序的记录。\n\
  \n由于插入顺序的保证仅在分区级别上，这使得 Kafka 能够在一个非分布式的、隔离的主题子集上管理其他情况下复杂的分布式插入排序任务。基于分区的主题架构，在较低层面上，实际上更像是一个分布式文件系统，并且像任何文件系统一样，独立的\
  \ Kafka 不会强制为记录中的每个值应用显式的记录模式。\n\n通过移除模式强制，Kafka 主题可以变得非常灵活，但灵活性也带来了可能意外将损坏或错误的数据流向下游的风险。因此，一种常见的做法是为每个主题关联一个特定的、二进制编码的事件类型（或多个类型）。\n\
  \n#### 创建 Kafka 主题\n\n可以使用 Kafka 附带的 admin shell 脚本来创建主题。执行列表 11-2 中的命令来创建你的第一个主题。\n\
  \n```\ndocker exec \\\n-it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-topics.sh\
  \ \\\n--create \\\n--if-not-exists \\\n--topic com.coffeeco.coffee.v1.orders \\\n\
  --bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092 \\\n--partitions 4 \\\n\
  --replication-factor 2\n列表 11-2\n使用 Kafka 开箱即用的命令行工具创建 Kafka 主题\n```\n\n运行该命令的结果是创建一个名为\
  \ `com.coffeeco.coffee.v1.orders` 的新 Kafka 主题。该主题将在集群中有条件地创建（`if-not-exists`），并配置有四个分区。为了提高可用性，每个主题分区都被复制两次。你将在下一节中了解有关修改主题的更多信息。\n\
  \n**可选**\n\n既然你已经创建了第一个主题，我猜你一定想继续对它进行更多操作。你可以随意跳到练习 11-2。你随时可以回到这里，了解更多关于 Kafka\
  \ 如何处理主题管理和安全性的信息。\n\n### Kafka 主题管理\n\n管理 Kafka 主题归根结底就是理解系统行为以及学会使用 Kafka 附带的\
  \ admin 工具。本节将向你介绍一些操作 Kafka 所需的常用命令和必要技能。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将下列英文文本翻译成中文。\n\
  \n\n#### 列出 Kafka 主题\n\n列出集群中可用的主题是发现主题的关键。您可以通过在 `kafka-topics.sh` 脚本上使用 `--list`\
  \ 操作来实现，如清单 11-3 所示。\n\n```\ndocker exec \\\n-it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-topics.sh\
  \ \\\n--list \\\n--bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092\n清单 11-3\n\
  列出 Kafka 主题返回一个简单的主题列表\n```\n\n`list` 操作将打印集群中所有可用主题的名称。\n\n#### 描述一个主题\n\n不时检查与给定主题相关的元数据是很有帮助的。这有助于调试您在将\
  \ Kafka 作为日常职责的一部分进行运维时，不可避免地会遇到的问题。执行清单 11-4 中的命令将返回与分区相关的元数据以及每个代理所扮演的角色，从而维护主题的一致性和可用性。\n\
  \n```\ndocker exec \\\n-it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-topics.sh\
  \ \\\n--describe \\\n--topic com.coffeeco.coffee.v1.orders \\\n--bootstrap-server\
  \ kafka_0:9092,kafka_1:9092,kafka_2:9092\n清单 11-4\n描述一个主题\n```\n\n`describe` 命令的输出与下面显示的输出会略有不同，因为您的集群会有不同的指定主题领导者和分区副本位置。以下是我环境中的修改后的输出：\n\
  \n```\nTopic: com.coffeeco.coffee.v1.orders\nTopicId: eENgTy01QUWOAe2gJzi_rw\nPartitionCount:\
  \ 4\nReplicationFactor: 2\nConfigs: segment.bytes=1073741824\nTopic: com.coffeeco.coffee.v1.orders\n\
  Partition: 0    Leader: 2    Replicas: 2,1    Isr: 1,2\nPartition: 1    Leader:\
  \ 1    Replicas: 1,0    Isr: 1,0\nPartition: 2    Leader: 0    Replicas: 0,2   \
  \ Isr: 0,2\nPartition: 3    Leader: 2    Replicas: 2,0    Isr: 0,2\n```\n\n`describe`\
  \ 命令的元数据揭示了每个分区是如何分布在这三个代理上的。代理 ID 分别为 0、1 和 2。您可以看到，对于每个分区，都有一个领导者负责存储该分区的一份副本，以及一个与领导者同步的副本。这种能力允许分区领导者丢失，而由同步中的副本无缝地接管成为新的领导者。\n\
  \n#### 修改一个主题\n\nKafka 主题的配置并非一次性设置后就置之不理。在大多数情况下，初始配置仅是对给定主题所需总分区数和条件配置需求的预估。幸运的是，动态修改（或更改）主题是可行的，而不会中断连接到该主题的客户端。\n\
  \n您可以通过增加被视为健康所需的最小主题副本数来修改之前创建的主题，以提高其一致性和可用性或整体容错能力。`min.insync.replicas` 的默认值是\
  \ `1`，我们将把它增加到 `2`。\n\n#### 更改主题配置\n\n要在初始创建后修改主题，您可以使用 `kafka-configs.sh` 脚本来添加或删除（移除）主题的配置属性。执行清单\
  \ 11-5 中的命令来更改最小同步主题副本数。\n\n```\ndocker exec \\\n-it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-configs.sh\
  \ \\\n--alter \\\n--bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092 \\\n\
  --entity-type topics \\\n--entity-name com.coffeeco.coffee.v1.orders \\\n--add-config\
  \ min.insync.replicas=2\n清单 11-5\n修改现有主题的配置\n```\n\n重新配置您的主题后，每个分区现在需要两个同步副本。您能看到这里可能存在的问题吗？也许与主题复制因子有关？如果一个代理丢失（离线/无法访问/宕机），集群将承受额外的压力，因为可用的代理需要为分配给丢失代理的任何主题的分区恢复丢失的分区。二级代理需要复制丢失的主题分区，以恢复到与这些分区的领导者同步（一致）的状态。这可能导致大量的文件传输，从而增加整个集群的网络\
  \ IO 和 CPU 负载，并降低受影响主题的可用性。这进而可能导致写入该主题的生产者在恢复一致、可用状态时进行客户端退避。\n\n为了确保您的集群能够处理代理丢失，您可以将主题的复制因子从\
  \ `2` 改为 `3`。这样，您就可以处理单个代理丢失的情况，而无需手忙脚乱。在创建主题时，通过添加 `--replication-factor 3` 来执行此操作更容易，而不是像您接下来要做的那样使用手动副本分配。\n\
  \n#### 增加主题分区副本\n\n为了确保在丢失一个代理时，您的集群仍能保持健康，并且至少拥有两个同步副本，您需要创建一个副本重新分配 JSON 文件。可以使用\
  \ `describe topic` 命令中的信息来生成此文件。只需获取当前分配，并在 `replicas` 数组中添加另一个代理 ID。这将作为 Kafka\
  \ 的模板，用于将主题的复制因子从 `2` 增加到 `3`。清单 11-6 中的示例展示了副本重新分配的 JSON 格式。\n\n```\n{\n\"version\"\
  : 1,\n\"partitions\": [\n{\n\"topic\": \"com.coffeeco.coffee.v1.orders\",\n\"partition\"\
  : 0,\n\"replicas\": [2,1,0]\n},\n{\n\"topic\": \"com.coffeeco.coffee.v1.orders\"\
  ,\n\"partition\": 1,\n\"replicas\": [1,0,2]\n},\n{\n\"topic\": \"com.coffeeco.coffee.v1.orders\"\
  ,\n\"partition\": 2,\n\"replicas\": [0,2,1]\n},\n{\n\"topic\": \"com.coffeeco.coffee.v1.orders\"\
  ,\n\"partition\": 3,\n\"replicas\": [2, 0, 1]\n}\n]\n}\n清单 11-6\nKafka 主题副本重分配（replication-reassignments.json）文件格式\n\
  \n有了这个副本文件，您需要将其复制到您的某个 Kafka 代理中，以便能够从该代理运行 `kafka-reassign-partitions.sh` 脚本。复制命令如清单\
  \ 11-7 所示。\n\n```\ndocker cp \\\n./exercises/01_kafka_up_and_running/replication-reassignments.json\
  \ \\\nkafka_kafka-0_1:/opt/replication-reassignments.json\n清单 11-7\n用于将 replication-reassignments.json\
  \ 上传到 Kafka 代理的 Docker 复制命令\n```\n\n现在代理上有了 `replication-reassignments.json` 文件，您就可以运行重新分配分区的脚本了。使用您上传\
  \ `replication-reassignments.json` 文件的同一个代理，并执行清单 11-8 中的命令。\n\n```\ndocker exec\
  \ \\\n-it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-reassign-partitions.sh\
  \ \\\n--bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092 \\\n--reassignment-json-file\
  \ /opt/replication-reassignments.json \\\n--execute\n清单 11-8\n运行 kafka-reassign-partitions.sh\
  \ 脚本以增加主题复制\n```\n\n作为运行副本重新分配的结果，您现在可以处理 Kafka 集群中丢失一个代理的情况，而不会对集群的行为造成重大中断。在非生产场景中，有时简单地删除主题并从头开始更容易，但理解如何修改主题的行为可以帮助您学会务实地解决问题。\n\
  \n提示\n\n分区重新分配的另一个用例是 Kafka 代理倾斜的情况。这种情况出现在一个或多个代理因承载了某个主题的过多分区而过载时。这可能会减慢连接到该代理（作为其主题分区的领导者）的生产者和消费者，因为更多的数据和更多的连接不均衡地分布在代理之间。\n\
  \n\n\n"
- '# 截断主题


  Kafka 中的主题（Topic）只会保留达到配置保留毫秒数的记录。了解这一点后，你可以通过修改主题配置来截断（清除所有记录）一个主题。你需要先缩短主题（记录）的保留期限，这样
  Kafka 才会开始清理主题记录。等待一两分钟后，Kafka 不会立即删除这些记录，因此只需为你的主题重新添加一个合理的保留期限（常见为一天或七天）。


  ## 缩短主题保留期限


  第一步使用 `--alter` 命令，将主题的 `retention.ms` 值设置为 1 秒（1000 毫秒）。执行清单 11-9 中的命令来修改主题保留期限。


  ```

  docker exec -it kafka_kafka-0_1 \

  /opt/bitnami/kafka/bin/kafka-configs.sh \

  --bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092 \

  --entity-type topics \

  --alter \

  --entity-name com.coffeeco.coffee.v1.orders \

  --add-config retention.ms=1000

  清单 11-9

  截断 Kafka 主题以清除所有记录

  ```


  现在主题正在被清理，等待一两分钟，然后恢复主题的保留期限。


  ## 增加主题保留期限


  既然主题已经清理完毕（假设你已经等待了一段时间），现在你可以将主题保留配置改回一天的保留期限（参见清单 11-10）。


  ```

  docker exec -it kafka_kafka-0_1 \

  /opt/bitnami/kafka/bin/kafka-configs.sh \

  --bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092 \

  --entity-type topics \

  --alter \

  --entity-name com.coffeeco.coffee.v1.orders \

  --add-config retention.ms=86400000

  清单 11-10

  为 Kafka 主题添加一天的保留期限

  ```


  当你需要清除主题内的所有记录时，可以使用此技术。在练习 11-2 中创建 `CoffeeOrder` 生成器后，你可能想在测试完毕后清理该主题。这也可以用于测试
  Kafka 的不同故障模式。


  '
- "# 删除 Kafka 主题\n\nKafka 主题只应在两种情况下被删除。第一种原因是主题已终止生命周期，且没有生产者和消费者使用该主题。第二种原因是你在非生产环境中，并且没有其他团队（或服务）依赖此主题。事实上，Kafka\
  \ 代理默认配置为不允许删除主题。这是因为意外删除主题可能对依赖流数据源访问的数据管道网络造成灾难性影响。\n\n在强调完这些限制和警告之后，你可以通过执行清单\
  \ 11-11 中的 `delete` 命令来测试删除你的主题。\n\n```\ndocker exec \\\n-it kafka_kafka-0_1 \\\n\
  /opt/bitnami/kafka/bin/kafka-topics.sh \\\n--delete \\\n--topic com.coffeeco.coffee.v1.orders\
  \ \\\n--bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092\n清单 11-11\n可以使用\
  \ kafka-topics.sh 来删除 Kafka 主题\n```\n\n`delete` 命令会执行软删除（仅在 Zookeeper 中标记），除非 Kafka\
  \ 代理配置了 `delete.topic.enable=true`。你可以通过更新用于启动集群的 `docker-compose.yaml` 文件，将你的 Kafka\
  \ 集群修改为使用此危险配置。找到 Kafka 代理的环境配置部分，并添加清单 11-12 中的环境变量。\n\n```\nservices:\nkafka-0:\n\
  environment:\n...\n- KAFKA_CFG_DELETE_TOPIC_ENABLE=true\n清单 11-12\n在 Kafka 代理上使用\
  \ `delete.topic.enable=true` 标志启用主题删除功能\n\n这个例子展示了如何为三个代理中的一个修改 `docker-compose.yaml`\
  \ 文件中的代理配置。你可以修改其他两个代理配置，然后重启你的 Kafka 集群以使这些更改生效。现在你可以执行不可逆的删除操作，但这并不推荐。\n\n# 保护对主题的访问\n\
  \n[保护对 Kafka 的访问](https://kafka.apache.org/documentation/%2523security)以及相关的集群元数据、主题和底层物理数据似乎是理所当然的事情。然而，就像生活中的许多事情一样，安全有时会被遗漏，成为待解决的问题。简而言之，有几种方法可以保护对\
  \ Kafka 集群的访问，从基本的防火墙规则开始，到访问控制列表（ACL），最后使用 SSL/TLS 实现全加密的端到端传输。\n\n## 防火墙规则\n\n\
  防火墙规则使用 Linux 风格的 [iptables](https://en.wikipedia.org/wiki/Iptables) 或安全的基于云的访问，在托管中心或虚拟私有云（VPC）内的主机之间建立点对点连接。这包括\
  \ AWS 安全组，它管理跨 IP 地址和开放端口之间的入站和出站连接及数据传输。这相当于在夜间锁好你的门。它可以防止恶意行为者进入你的系统，除非他们找到撬锁的方法。\n\
  \n## 访问控制列表\n\nApache Kafka 自带了一个名为 [Authorizer](https://kafka.apache.org/documentation/%2523security_authz)\
  \ 的、开箱即用的 ACL 实现。它可用于在防火墙规则之外，使用访问控制列表（ACL）进一步保护 Kafka。默认情况下，ACL 规则存储在 Zookeeper\
  \ 中。ACL 用于授权和管理用户（称为主体）对一个或多个主题或集群本身的操作访问。Kafka 中的 ACL 类似于 SQL 数据控制语言（DCL），用于授予特定的基于集群的操作集合，限制读取、写入、更新和删除能力。\n\
  \n启用 ACL 需要在每个代理上进行操作，这可以通过 `docker-compose.yaml` 完成。就像启用主题删除一样，你可以从环境配置中打开 Authorizer（如清单\
  \ 11-13 所示）。\n\n```\nservices:\nkafka-0:\nenvironment:\n...\n- KAFKA_CFG_AUTHORIZER_CLASS_NAME=kafka.security.authorizer.AclAuthorizer\n\
  清单 11-13\n启用代理 ACL\n```\n\n一旦 Authorizer 被打开（这需要重启每个代理），你就可以使用 Kafka 命令行添加 ACL。执行清单\
  \ 11-14 中的命令，为你的主题添加基于用户的访问控制。\n\n```\ndocker exec -it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-acls.sh\
  \ \\\n--bootstrap-server :9092 \\\n--add \\\n--allow-principal User:dataengineering\
  \ \\\n--operation read \\\n--operation write \\\n--topic com.coffeeco.coffee.v1.orders\n\
  清单 11-14\n为 Kafka 主题级别的授权添加 ACL\n```\n\n防火墙规则配合维护良好的 ACL，可以大大加强你的 Kafka 集群的安全性。如果对系统范围的访问进行审查以保持规范性，并且不向不安全的客户端软件授予管理超级用户或“上帝模式”访问权限，那么你应该能够顺利运行。\n\
  \n## 使用双向 TLS 的端到端加密\n\nApache Kafka 支持端到端的 SSL/TLS 加密，以处理传输中的加密数据。这需要一个共享证书和私钥对，可以在\
  \ SSL/TLS 握手期间进行验证，以确保来自连接两端（客户端或服务器）的数据流免受恶意行为者的侵害。\n\n\n\n### 练习 11-1：总结\n\n在第一个练习中，你了解了运行本地\
  \ Kafka 集群的方方面面。本练习旨在介绍 Kafka 本身的术语和组件，并让你熟悉和掌握操作 Kafka 集群的方法。虽然我们仅仅触及了各种代理配置、管理/实用命令行操作以及常规安全加固的皮毛，但现在你已经拥有了一个可用的\
  \ Kafka 集群，可以与 Structured Streaming 结合使用。\n\n在下一个练习中，你将学习如何在 Apache Spark 内部使用二进制结构化数据（protobuf）来生产和消费数据，这是对上一章从\
  \ Redis Streams 读取 `OrderEvent` 数据的后续练习。\n\n## 练习 11-2：使用 Spark 生成二进制可序列化事件数据并发布到\
  \ Kafka\n\n在本练习中，你将学习如何在 Apache Spark 内部生成二进制序列化的结构化数据。对于专注于与数据平台生态系统之外的系统进行互操作的数据工程师来说，这是一项基本技能。你在第\
  \ 9 章中了解了如何设计更具弹性的数据系统，并了解到数据在通过各种 API 网关发出之前，通常会被编码为二进制 Avro 或 Protobuf 格式。这种技术有助于减少带宽开销（由于传输二进制数据），并且网关作为路由事件数据（负载）到各个\
  \ Kafka 主题的安全且受控的途径。这一简单的操作使得下游消费者能够在数据进入数据网络时*可靠地*获取原始事件数据，因为他们知道已经完成了一些检查与平衡（即初始授权和数据验证）。\n\
  \n### 练习 11-2：准备工作材料\n\n本练习包含一个 Spark 应用程序以及用于运行该应用程序的 Docker 环境。\n\n```\nch-11\n\
  ├── applications\n│   └── spark-kafka-coffee-orders\n└── exercises\n    └── 02_binary_serialization_in_spark\n\
  ```\n\n在本练习中，你将学习编写一个可以生成任意数量 `CoffeeOrders` 的事件生成器，这些订单将使用 Google 的 Protocol Buffers（protobuf）进行编码。我们首先查看\
  \ `CoffeeOrder` protobuf 定义，然后进入生成器部分。本练习的最后，你将运行生成器，同时使用 Kafka 的简单控制台消费者来观察数据到达情况。本练习展示了使用\
  \ Apache Spark 进行事件生产与事件消费之间的区别。\n\n### CoffeeOrder 事件格式\n\n`CoffeeOrder` protobuf\
  \ 定义看起来可能很熟悉。它本质上是在第 10 章中用于从 `com:coffeeco:coffee:v1:orders` 读取数据的 `StructType`。\n\
  \n`CoffeeOrder` protobuf 定义如代码清单 11-15 所示。\n\n```\nmessage CoffeeOrder {\n  uint64\
  \ timestamp  = 1;\n  string order_id   = 2;\n  string store_id   = 3;\n  string\
  \ customer_id = 4;\n  uint32 num_items  = 5;\n  float  price      = 6;\n}\n代码清单\
  \ 11-15\nCoffeeOrder Protobuf 数据定义\n```\n\n`CoffeeOrder` 消息提供了跟踪 CoffeeCo 咖啡订单所需的所有事件信息。这设置了\
  \ protobuf 记录所表示的底层二进制数据结构。Apache Spark DataSource API 与 Apache Kafka 之间的互操作需要三个步骤：\n\
  \n1.  你需要使用 `scalapbc` 编译器将 protobuf 数据定义编译成 Scala 样例类。\n2.  你需要在 `build.sbt` 应用程序中包含\
  \ `scalapb-spark` ScalaPB Spark 库。该库提供了互操作类，用于处理 protobuf 原生二进制格式与 Spark 原生二进制格式（Catalyst\
  \ Rows）之间的转换。\n3.  你需要包含名为 `spark-sql-kafka-0-10` 的 Apache Kafka Spark SQL 库。\n\n\
  在构建 `CoffeeOrder` 事件生成器时，我们将逐步完成这三个步骤。\n\n### 编译 Protobuf 消息\n\n接下来，让我们编译 protobuf。这可以使用独立的\
  \ [ScalaPB](https://scalapb.github.io/docs/scalapbc/) 编译器来完成。编译器的位置可以添加到你的 `PATH`\
  \ 环境变量中，或者作为一个简单的环境变量导出，例如命名为 `SCALAPBC`。\n\n提示\n\n在 protobuf 目录的 `README` 文件中有一组更详细的说明，包括如何下载和链接独立的\
  \ ScalaPB 编译器。请查看 `/ch-11/applications/spark-kafka-coffee-orders/data/protobuf/README.md`\
  \ 目录。\n\n编译命令如代码清单 11-16 所示。编译器使用输入路径 `--proto_path`（这是存放 protobuf 定义文件的目录）和输出路径\
  \ `--scala_out`（这是你希望放置编译后 Scala 代码的目录）。以 `/ch-11/applications/spark-kafka-coffee-orders`\
  \ 作为工作目录，执行代码清单 11-16 中的命令。\n\n```\n$SCALAPBC/bin/scalapbc -v3.11.1 \\\n  --proto_path=./data/protobuf/\
  \ \\\n  --scala_out=./src/main/scala \\\n  coffee.common.proto\n代码清单 11-16\n编译 CoffeeOrder\
  \ Protobuf\n```\n\n编译器将解析名为 `coffee.common.proto` 的文件，并生成 Scala 样例类，以及在每个类实例的内部\
  \ JVM 对象表示与二进制 protobuf（线格式）表示之间进行转换所需的反序列化器和序列化器。由于 protobuf 可以跨平台编译，相同的 `coffee.common.proto`\
  \ 文件可以使用特定语言的编译器进行编译，以实现 Node.js、Python、C++、Go、Scala、Java 等众多语言之间的互操作性。\n\n注意\n\n\
  在第 9 章中，你学习了 GRPC，以及该框架如何通过使用通用的二进制数据协议（即 Google Protocol Buffers (protobuf)）实现跨语言互操作性。这些二进制消息与所有\
  \ gRPC 组件原生互通。对于已经采用 gRPC 技术栈的公司来说，说服他们使用相同的技术支持数据传输系统和摄取服务并非难事。如果有丰富的结构化数据能够进入\
  \ Kafka 主题和其他数据流，那么每个人都将受益。\n\n生成了 Scala 类之后，我们可以进入练习的核心部分，学习如何将 Kafka 用作 Apache\
  \ Spark 的传输工具。你将使用 Spark 作为事件生成的通道，并使用 Kafka DataFrameWriter 写入这些记录。由于我们需要生产数据才能消费数据，我们将先完成这个过程，然后在练习\
  \ 11-3 中再转向消费这些记录。\n\n### Protobuf 消息与 Spark 和 Kafka 的互操作性\n\n在上一章中，你学会了使用 Redis\
  \ 命令行生成新的咖啡订单。你将构建一个 `CoffeeOrder` 生成器来处理生成随机订单并编码这些记录的过程，然后将它们发布到新的 Kafka 主题。你很可能没有多少手动编码二进制数据的经验。这不是大多数人需要做的事情，因此你可以借助一些简单的代码来完成这项工作。\n\
  \n生成器是数据工具箱中一个有用的工具，它可以用于多种目的，从生成压力测试和发现性能瓶颈，到生成好数据和坏数据以理解应用程序行为，甚至帮助复现事件或调查期间暴露的\
  \ bug。\n\n\n\n#### 添加 `Protobuf` 和 `Kafka` Spark 依赖项\n\n在你喜欢的 IDE 中打开名为 `spark-kafka-coffee-orders`\
  \ 的应用。该应用的设置方式与第 7 章和第 10 章中的应用相同，因此在你学习旅程的这个阶段，其布局应该开始显得熟悉。\n\n在本节前面，我提到使用 protobuf\
  \ 需要三步流程。第一步是编译消息定义，第二步包含名为 `sparksql-scalapb` 的 Spark 扩展库，第三步包含 `spark-sql-kafka`\
  \ 库依赖项。打开应用目录根目录下的 `build.sbt`，你还会看到这些 Spark 依赖项被包含在 `libraryDependencies` 中。\n\n\
  ```\n\"org.apache.spark\" %% \"spark-sql-kafka-0-10\" % sparkVersion\n\"com.thesamet.scalapb\"\
  \ %% \"sparksql-scalapb\" % scalaPbVersion\n```\n\n清单 11-17  \n额外的应用库依赖项，用于实现 Protobuf\
  \ 与 Apache Spark 的互操作性，并支持读写 Apache Kafka\n\n在 `build.sbt` 的底部，你会看到应用 `sbt` 中的两个新代码块。这两个代码块是\
  \ `assemblyMergeStrategy` 和 `assemblyShadeRules`。\n\n#### 逃离 JAR 地狱\n\n在构建 Spark\
  \ 应用时，你有时会发现自己陷入了所谓的 JAR 地狱。这实际上是一个试图弄清楚应用为何无法编译的循环过程。为了解决不同库依赖项之间的冲突，你可以借助合并策略（如清单\
  \ 11-18 所示）来控制 JAR 的构建方式、添加哪些类文件，以及哪些文件会被去重、删除或重命名。\n\n```\nassembly / assemblyMergeStrategy\
  \ := {\n...\ncase _ =>\nMergeStrategy.deduplicate\n}\n```\n\n清单 11-18  \n合并规则包括在构建胖\
  \ JAR 时选择如何解决冲突的能力。\n\n合并几乎能让你完全脱离 JAR 地狱；然而，有时会出现你无法控制的问题，这时阴影化就派上了用场。\n\n以 Apache\
  \ Spark 为例。当运行 Spark 应用时，已经有一个正在运行的进程（其实就是 Spark），它包含自己的类依赖项。由于这些类在 Spark 启动时被加载，你的应用依赖项有可能被覆盖，因为你的应用是加载到\
  \ Spark 运行时中的。你可以使用阴影化过程（如清单 11-19 所示）通过重命名冲突类来解决类版本冲突的问题。这反过来将解决运行时问题。`NoClassDefFoundError`\
  \ 问题是需要警惕的众多警告信号之一，它源于应用类路径中的冲突。\n\n```\nassembly / assemblyShadeRules := Seq(\n\
  ShadeRule.rename(\"com.google.protobuf.**\" -> \"shadeproto.@1\").inAll,\nShadeRule.rename(\"\
  scala.collection.compat.**\" -> \"scalacompat.@1\").inAll\n)\n```\n\n清单 11-19  \n\
  阴影化可用于重命名那些可能在运行时引入冲突的类。\n\n当结合使用时，这两种技术共同确保你的 Spark 应用能够顺利部署，避免 JAR 地狱带来的麻烦。现在，你可以继续学习生成器。\n\
  \n#### 编写 `CoffeeOrderGenerator`\n\n本章材料中生成器的包提供了一个可正常工作的 `CoffeeOrderGenerator`\
  \ 实现。本质上，生成器需要完成三件事才算成功。生成器需要：\n\n1.  生成一个或多个 `CoffeeOrder` 事件的序列。\n\n2.  以 Spark\
  \ 能理解的格式对序列事件进行编码。\n\n3.  连接到 Kafka 并将事件写入一个主题。\n\n打开名为 `CoffeeOrderGenerator.scala`\
  \ 的文件。这个单例类扩展了本书前面介绍的 `SparkApplication` 特质，使我们能够为这个新的 Spark 应用创建一个入口点。事实上，我们将复用它的一些应用辅助功能，从而让应用也能生成\
  \ `SparkConf` 和 `SparkSession`。这意味着应用唯一需要做的就是遵循前面三个步骤。查看生成器的基本接口（如清单 11-20 所示），你会发现内容并不多。\n\
  \n```\nobject CoffeeOrderGenerator extends SparkApplication {\n...\ndef generateCoffeeOrder(\n\
  from: Instant,\nto: Instant,\ntotalRecords: Int = TotalRecords,\nindexOffset: Int\
  \ = IndexOffset): Seq[CoffeeOrder]\noverride def run(): Unit\n}\n```\n\n清单 11-20\
  \  \n`CoffeeOrderGenerator` 的核心接口\n\n`generateCoffeeOrder` 方法是生成器的核心（见清单 11-21）。它负责生成实际的\
  \ `CoffeeOrder`。该方法参数提供了一种简单的方式来声明生成订单事件的时间窗口。使用 `from` 和 `to` 来指定窗口边界，生成的 `CoffeeOrders`\
  \ 将分布在这个范围内。可以这样理解：“我想生成特定总数（`totalRecords`）的订单事件，这些事件分布在由 from 和 to 界定的时间范围内。”\n\
  \n```\ndef generateCoffeeOrder(...): Seq[CoffeeOrder] = {\nval random = new Random(totalRecords)\n\
  val stepSize = (to.toEpochMilli - from.toEpochMilli)/1000\n(0 to totalRecords).map\
  \ { index =>\nCoffeeOrder(\nfrom.plusMillis(index*stepSize).toEpochMilli,\ns\"orderId${indexOffset+index+1}\"\
  ,\ns\"store${random.nextInt(4)+1}\",\ns\"cust${random.nextInt(100)+1}\",\nBoundRandom.nextInt(20)+1,\n\
  BoundRandom.nextFloat()+1.0f\n)\n}\n}\n```\n\n清单 11-21  \n`CoffeeOrderGenerator`\
  \ 的核心功能是创建任意数量的订单，并只需用户提供最少的可覆盖参数\n\n清单 11-21 中的方法使用 `totalRecords` 的值作为随机数生成器的种子。这使得应用能够为特定的种子生成相同的伪随机数序列。这意味着如果\
  \ `totalRecords` 的值为 15，你可以两次生成相同的序列。\n\n然后，该方法使用 `to` 和 `from` 值之间的秒数差作为 `stepSize`。`stepSize`\
  \ 用于将生成的订单均匀分布在提供给该方法的时间范围内。你可以在 `Range` 迭代器（`0 to totalRecords`）内的 lambda 函数中看到这一点。每次迭代，都会使用循环索引、可选的索引偏移量以及随机数生成器（`random`\
  \ 和 `BoundRandom`）生成一个新的 `CoffeeOrder`。\n\n**注意：** 请注意，随机数也是限定范围的。例如，`random.nextInt(4)+1`\
  \ 将选择一个介于 0（包含）和指定值（4，不包含）之间的随机数。\n\n该方法返回一个 `Seq[CoffeeOrder]`。这满足了生成器的第一个要求（生成\
  \ `CoffeeOrder` 事件）。生成器本身在 `run` 方法中被调用。清单 11-22 展示了生成器是如何融入 `run` 方法的。\n\n\n\n\
  ```scala\noverride def run(): Unit = {\nval until = LocalDateTime...\nval orders:\
  \ Seq[CoffeeOrder] = CoffeeOrderGenerator\n.generateCoffeeOrder(\nfrom = until.minusHours(8).toInstant(ZoneOffset.UTC),\n\
  to = until.toInstant(ZoneOffset.UTC))\n...\n}\n```\n*代码清单 11-22*  \n`CoffeeOrderGenerator`\
  \ 调用 `generateCoffeeOrder` 生成任意数量的 `CoffeeOrder`，这些订单可发送至 Kafka。\n\n`run` 方法依赖 `TotalRecords`\
  \ 配置来限制生成的订单数量。\n\n```scala\nlazy val TotalRecords = sparkConf.getInt(\"spark.data.generator.totalRecords\"\
  , 10)\n```\n\n这个简单的配置让你能够控制应用运行时生成的咖啡订单数量。默认情况下，生成器设置为在八小时的时间窗口内创建记录，以当前时间（运行生成器时）的毫秒数作为结束时间。作为后续优化，你可以添加另一个值来修改时间窗口，甚至可以为特定时刻指定\
  \ `from` 和 `to` 的值。\n\n生成订单序列后，`run` 方法使用 `SparkSession`（由 `SparkApplication` 特质提供）创建一个\
  \ `Dataset[CoffeeOrder]`（参见代码清单 11-23）。这正是 ScalaPB 库发挥魔力的地方。生成器顶部有一个特殊的 `import`，即\
  \ `import scalapb.spark.Implicits._`，这些 `implicit` 提供了在原生 protobuf 与 Spark 的 catalyst\
  \ 行之间进行转换的互操作函数。\n\n```scala\nval orderEvents = sparkSession.createDatasetCoffeeOrder\n\
  .map { order =>\nKafkaRecord(ByteString.copyFrom(order.orderId.getBytes),\norder.toByteString,\
  \ KafkaTopic)\n}\n```\n*代码清单 11-23*  \n在原生 protobuf 与 Spark 的 catalyst 引擎之间优雅地生成和转换\
  \ `CoffeeOrder`。\n\n生成数据集后，立即执行 `map` 操作。`map` 函数用于遍历数据集中的每一行，并将每条记录转换为写入这些事件作为\
  \ Kafka 记录所需的二进制格式。`KafkaRecord` 是另一种 protobuf 消息类型，它与 `CoffeeOrder` 消息一起打包在 `coffee.common.proto`\
  \ 中。\n\n```protobuf\nmessage KafkaRecord {\nbytes  key   = 1;\nbytes  value = 2;\n\
  string topic = 3;\n}\n```\n\n`KafkaRecord` 消息格式提供了 Kafka 生产流程的最后一块拼图，即必要的 API 契约，用于将序列化的\
  \ `CoffeeOrder` 导入 Kafka 生态系统。\n\n> **注意**  \n> 在幕后，Spark 正在执行一些繁重的工作。当在数据集上调用 `map`\
  \ 时，每条记录的值会从本机内存（Tungsten）传输，每一行都会被转换回 JVM 对象。代码中的这一行会生成一个新的 protobuf 消息，名为 `KafkaRecord`。由于我们同时使用了\
  \ protobuf 和 Spark 的 Dataset API，因此我们只是将 `CoffeeOrder` protobuf 映射（转换）为另一个名为 `KafkaRecord`\
  \ 的 protobuf。此功能会消耗更多内存，因为 Spark 引擎需要为值的序列化和反序列化分配内存。这是因为 Spark 无法直接优化从 `CoffeeOrder`\
  \ 到 `KafkaRecord` 的转换。可以通过创建 Spark SQL UDF 来优化这一过程。这在第 13 章中有所介绍。\n\n现在，我们已经生成了订单，并将其转换为从\
  \ Spark 向 Kafka 发布记录所需的二进制格式，剩下的工作就是写入这些记录。由于 `orderEvents` 封装的数据是类型化的数据集而非 DataFrame，我们需要对\
  \ `orderEvents` 调用 `select` 来提取 Kafka DataFrameWriter 所需的列。这一转换过程如代码清单 11-24 所示。\n\
  \n```scala\norderEvents\n.select($\"key\",$\"value\",$\"topic\")\n.write\n.format(\"\
  kafka\")\n.option(\"kafka.bootstrap.servers\", KafkaBootstrapServers)\n.save()\n\
  ```\n*代码清单 11-24*  \n使用 Spark 结构化 API 中的 `DataFrameReader` 接口，即可将生成的 `CoffeeOrder`\
  \ 写入 Kafka。\n\n现在，生成器的所有要求都已满足，剩下的就是编译应用程序并运行生成器。\n\n### 运行生成器\n\n你可以先编译 Spark 应用程序，构建\
  \ Docker 容器，最后运行生成器。\n\n> **注意**  \n> 要运行端到端示例，你需要启动 Kafka 集群。请按照 `ch-11/exercises/02_binary_serialization_in_spark`\
  \ 下的 `README` 文件获取详细指引。\n\n编译应用程序并创建一个名为 `spark-kafka-coffee-orders` 的新 Docker 容器，以便运行生成器。\n\
  \n```\nsbt clean assembly &&\ndocker build . -t `whoami`/spark-kafka-coffee-orders:latest\n\
  ```\n\n要查看端到端示例，你需要打开两个终端窗口。第一个窗口将运行 Kafka 控制台消费者。这是一个随 Kafka 附带的命令行应用程序。它会等待新数据到达\
  \ Kafka 主题，并打印每条记录的值。你可以通过执行代码清单 11-25 中的命令来启动 Kafka 控制台消费者应用程序。\n\n```\ndocker\
  \ exec -it kafka_kafka-0_1 \\\n/opt/bitnami/kafka/bin/kafka-console-consumer.sh\
  \ \\\n--bootstrap-server kafka_0:9092,kafka_1:9092,kafka_2:9092 \\\n--topic com.coffeeco.coffee.v1.orders\n\
  ```\n*代码清单 11-25*  \n运行 Kafka 控制台消费者应用程序。\n\n在一个终端窗口中运行 Kafka 控制台消费者，然后打开另一个终端窗口，在其中运行\
  \ Spark `CoffeeOrder` 生成器。执行代码清单 11-26 中的 `docker run` 命令来运行生成器。\n\n```\ndocker\
  \ run \\\n-p 4040:4040 \\\n--hostname spark-kafka \\\n--network mde \\\n-v ~/dataengineering/spark/conf:/opt/spark/conf\
  \ \\\n-v ~/dataengineering/spark/jars:/opt/spark/user_jars \\\n-it `whoami`/spark-kafka-coffee-orders:latest\
  \ \\\n/opt/spark/bin/spark-submit \\\n--master \"local[*]\" \\\n--class \"com.coffeeco.data.generators.CoffeeOrderGenerator\"\
  \ \\\n--deploy-mode \"client\" \\\n--jars /opt/spark/user_jars/mariadb-java-client-2.7.2.jar\
  \ \\\n--driver-class-path /opt/spark/user_jars/mariadb-java-client-2.7.2.jar \\\n\
  --conf \"spark.sql.warehouse.dir=s3a://com.coffeeco.data/warehouse\" \\\n--conf\
  \ \"spark.app.sink.option.kafka.bootstrap.servers=kafka_0:9092,kafka_1:9092,kafka_2:9092\"\
  \ \\\n--conf \"spark.app.sink.kafka.topic=com.coffeeco.coffee.v1.orders\" \\\n--conf\
  \ \"spark.data.generator.totalRecords=100\" \\\n/opt/spark/app/spark-kafka-coffee-orders.jar\n\
  ```\n*代码清单 11-26*  \n运行生成器以生成基于 protobuf 的 `CoffeeOrder`，并将其写入 Kafka。\n\n生成器将启动并生成新的咖啡订单。如果你正在运行\
  \ Kafka 控制台消费者，你会看到每个订单的二进制表示形式打印在终端窗口中。你将在 Kafka 控制台消费者应用程序中看到 `CoffeeOrder` 行的二进制表示形式（参见代码清单\
  \ 11-27）。\n\n```\n???orderId5store4\"cust15(5,!??\n?????orderId8store3\"cust815?H??\n\
  ?????orderId11store1\"cust10(5????\n```\n*代码清单 11-27*  \n使用 `kafka-console-consumer`\
  \ 可以实时查看发布到 Kafka 的二进制序列化记录。\n\n现在可以给自己一点掌声。你现在已经拥有一个使用 Apache Spark 编写未来事件生成器（当然也包括当前这个）的可行方案。剩下的就是串联各个部分，学习如何消费订单事件。\n\
  \n\n\n### 练习 11-2：总结\n\n你刚刚学会了如何在 100 行代码内组装一个功能完备的事件生成器。虽然这是一个很酷的练习，但其目的是传授一个重要经验：使用\
  \ Spark 作为数据生产者，以互操作的方式编写严格类型化（强类型）的事件。在本章的最后一个练习中，你将学习如何复用在本练习中学到的所有知识，快速搭建一个事件消费者，用于将这些\
  \ `CoffeeOrder` 转换为 Parquet 数据，并存储到你的数据湖或数据仓库中。\n\n### 练习 11-3：使用 Spark 消费可序列化结构化数据流\n\
  \n在对 Kafka 和 Spark 进行 360 度深入探讨的最后一块拼图，是读取（消费）练习 11-2 中生成的序列化 `CoffeeOrder`。你将重新进入熟悉的领域，使用\
  \ Spark 的 Structured Streaming 核心 API，并学习如何利用 `spark-sql-kafka-0-10` 库提供的 Kafka\
  \ 支持来使用 `DataStreamReader`。\n\n#### 练习 11-3：材料\n\n本练习接续练习 11-2。要运行端到端应用，你需要运行本地\
  \ Kafka 集群、MySQL（Hive Metastore）和 MinIO（分布式数据湖）。\n\n本练习是第 10 章应用程序的修改版。还记得那个从 Redis\
  \ 消费订单数据并写入 MinIO 数据湖中分布式表的应用程序吗？练习 11-3 的修改后应用流程如图 11-1 所示。\n\n![](img/505711_1_En_11_Fig1_HTML.png)\n\
  \n**图 11-1** Spark 应用程序（练习 11-3）用 Kafka 替换了 Redis；应用程序的其余部分与第 10 章中的相同\n\n该应用程序通过订阅一个主题（在本例中为\
  \ `com.coffeeco.coffee.v1.orders`）从 Kafka 流式消费源数据。源主题分布在四个物理分区上（我们在清单 11-2 中进行了配置）。这意味着支持\
  \ Kafka `DataFrame` 的 RDD 源中的默认分区数也将是四个。Spark 保留了来自源的分区信息，以便更容易地将数据沿袭追溯回特定的绝对分区。这对于恢复在\
  \ Spark 应用程序失败期间丢失的数据，在起始偏移量和结束偏移量之间读取的所有数据非常有用。当 Spark 集群中的执行器（节点）离线时，这种恢复是必要的。应用程序必须恢复封装分布式计算状态的所有数据。有状态应用程序使用\
  \ Kafka 操作的方式如图 11-2 所示。\n\n![](img/505711_1_En_11_Fig2_HTML.png)\n\n**图 11-2**\
  \ Structured Streaming 应用程序中每个微批处理的流程\n\n对于每个微批处理，Spark 应用程序驱动程序（1）查询 Kafka 以确定是否有任何新数据需要消费。如果有新数据，则预先将每个主题分区要分配的起始和结束偏移量写入（2）应用程序检查点目录。此过程使应用程序能够在发生处理故障时从\
  \ Kafka 主题的精确位置恢复。预写日志（WAL）对于确保所有数据都被处理并且以确定性方式完成恢复至关重要。然后，主题偏移量范围作为主题分配传递给应用程序执行器（3）。这使得执行器能够通过为\
  \ Spark 应用程序中的特定微批处理进行显式分配，以分布式方式获取数据。然后，应用程序将 Kafka 二进制数据转换为数据集并处理数据。处理完成后，结果被写入（4）分布式表，并将成功写入输出的结果提交回检查点目录（5）。这种使用\
  \ WAL、处理和提交的端到端过程构成了一个完整的微批处理。现在，让我们来看看构建此过程的方法。\n\n#### 从 Apache Kafka 消费二进制数据\n\
  \n打开与 `CoffeeOrderGenerator` 位于同一项目中的 `SparkKafkaCoffeeOrdersApp`。让我们从 Kafka `DataStreamReader`\
  \ 开始，然后从那里反向推导。\n\n与 Redis Streams 应用程序一样，我们使用 `inputStream` 块（如清单 11-28 所示）来配置和引导\
  \ `DataStreamReader` 实例。\n\n```\nlazy val inputStream: DataStreamReader = {\n  sparkSession\n\
  \    .readStream\n    .format(inputStreamFormat)\n    .options(sparkConf\n     \
  \ .getAllWithPrefix(\n        s\"$StreamConfigSourcePrefix.option.\").toMap)\n}\n\
  ```\n\n**清单 11-28** 创建通用的配置驱动型 `DataStreamReader`\n\n调用 `inputStream` 的结果确实为我们的\
  \ Kafka 连接引导了一个 `DataStreamReader` 实例。这是一个使用纯配置驱动方法使用 Spark 核心 API 的示例。例如，清单 11-29\
  \ 中的设置使应用程序能够从 Docker 网络内连接到 Kafka 集群（只要容器正在运行），并订阅 `com.coffeeco.coffee.v1.orders`\
  \ 主题，从主题内每个分区可用的最早偏移量开始。\n\n```\n--conf \"spark.app.source.format=kafka\" \\\n--conf\
  \ \"spark.app.source.option.subscribe=com.coffeeco.coffee.v1.orders\" \\\n--conf\
  \ \"spark.app.source.option.kafka.bootstrap.servers=kafka_0:9092\" \\\n--conf \"\
  spark.app.source.option.startingOffsets=earliest\"\n```\n\n**清单 11-29** 配置 Kafka\
  \ `DataStreamReader` 的最小配置\n\n一旦将配置应用于 `inputStream`，生成的对象（如清单 11-30 所示）就被设计为连接到\
  \ Kafka，但它足够灵活，可以处理任何额外的配置以自定义 Kafka 连接或行为。\n\n```\nsparkSession\n  .readStream\n\
  \  .format(\"kafka\")\n  .option(\"kafka.bootstrap.servers\", \"kafka_0:9092\")\n\
  \  .option(\"subscribe\",\"com.coffeeco.coffee.v1.orders\")\n  .option(\"startingOffsets\"\
  ,\"earliest\")\n```\n\n**清单 11-30** 通过读取外部应用配置创建的 `InputStream` 对象\n\n其工作方式完全依赖于\
  \ `SparkConf` 上的一个特殊方法。使用 `sparkConf.getAllWithPrefix` 方法的美妙之处在于，你无需为了每个微小的更改而回到源代码，即可修改\
  \ `DataStreamReader` 的行为。我们将在第 13 章再次讨论这种模式。\n\n接下来展示的是常见的 Kafka 主题属性。\n\n#####\
  \ 主题订阅\n\n例如，你可以同时订阅多个主题（使你的应用程序能够从多个位置读取数据）。这种技术可以用于处理多个事件流，而无需为每个流运行一个应用程序。只需在逗号分隔的列表中传入一个或多个主题名称即可。\n\
  \n```\n.option(\"subscribe\",\n  \"com.coffeeco.coffee.v1.orders,\n  com.coffeeco.customers.v1.events\"\
  )\n```\n\n或者，你可以订阅一个主题模式。这种技术使你的应用程序能够订阅所有匹配基于前缀的正则表达式的主题。例如：\n\n```\n.option(\"\
  subscribePattern\",\"com.coffeeco.coffee.v1.*\")\n```\n\n你可以使用 `subscribe`、`subscribePattern`\
  \ 或 `assign`，我们接下来将介绍 `assign`。\n\n\n\n### 主题分配\n\n订阅为你的应用程序分担了大量繁重工作。这包括在 Spark\
  \ 应用程序生命周期内的操作过程中，确定哪些分区可用，以及需要哪些偏移量来分配给任务。有时，你可能希望将特定主题分区分配给一个应用程序，而不是订阅所有主题分区。我们不会直接介绍这个用例，但值得了解它的存在。例如，某些主题分区可能成为热点，因为发布到\
  \ Kafka 的上游应用程序意外地使用空字符串作为记录键来发布记录。这将导致所有使用空字符串作为键的记录被路由到同一个分区，从而可能形成热点。你可以通过强制使用非空字符串来主动缓解此问题，但由于系统中的常见行为，你也可能会遇到热点。\n\
  \n### Kafka 限流\n\n我们在第 10 章使用了 `stream.read.batch.size` 配置来控制 Spark 应用程序从 Redis\
  \ Stream 读取（消费）数据的速率。对于 Kafka 源，你可以通过为每个微批次提供要读取的最大记录数来限制速率。这是通过 `maxOffsetsPerTrigger`\
  \ 选项完成的。\n\n```\n\"spark.app.source.options.maxOffsetsPerTrigger=1000\"\n```\n\n\
  此数字针对整个批次（跨所有分区）。\n\n### 处理故障\n\n故障总会发生。如何处理取决于应用程序。Kafka 源提供了一个选项来处理此问题。当应用程序期望从上一次成功的批次中继续处理，但数据（主题分区的偏移量）恰好丢失（超时或损坏）时，Spark\
  \ 应用程序可以简单地失败，而不是在数据存在缺口的情况下继续处理。使用 `failOnDataLoss` 选项来控制此行为。\n\n```\n--conf \"\
  spark.app.source.options.failOnDataLoss=false\"\n```\n\n### 拆分分区\n\n如果你有四个分区，例如\
  \ `com.coffeeco.coffee.v1.orders` 主题，但希望进一步划分 Spark 应用程序正在处理的数据集，则可以使用 `minPartitions`\
  \ 设置。这意味着你可以分而治之，将工作负载分布到可变数量的执行器（或处理线程）上，并为你的 Spark 应用程序实现更高的吞吐率。\n\n```\n--conf\
  \ \"spark.app.source.options.minPartitions=8\"\n```\n\n这将使默认分区数加倍（针对我们的四个分区主题）。\n\
  \n在完成后续练习后，你将有机会使用这些额外的配置。现在回到源代码。\n\n### 从 Kafka 行到数据集\n\n`KafkaOrderTransformer`\
  \ 类负责反序列化来自 Kafka DataFrame 的字节数组（值），并将其转换为 `CoffeeOrder`。这与之前构建 `CoffeeOrderGenerator`\
  \ 时所经历的过程相反。该类如代码清单 11-31 所示。\n\n```scala\nclass KafkaOrderTransformer(spark: SparkSession)\n\
  extends DatasetTransformer[CoffeeOrder]\nwith Serializable {\nimport scalapb.spark.Implicits._\n\
  override val encoder = typedEncoderToEncoder[CoffeeOrder]\noverride def transform(df:\
  \ DataFrame): Dataset[CoffeeOrder] =  df\n.map(_.getAs[Array[Byte]](\"value\"))\n\
  .map(CoffeeOrder.parseFrom)\n.as[CoffeeOrder]\n}\n```\n\n*代码清单 11-31: 将 Kafka DataFrame\
  \ 转换为类型化数据集*\n\n此转换器继承自第 7 章和第 10 章中 `DataFrameTransformer` 的类型化版本。\n\n```scala\n\
  trait DatasetTransformer[T] {\nval encoder: Encoder[T]\ndef transform(df: DataFrame):\
  \ Dataset[T]\n}\n```\n\n这随后提供了粘合剂，用于告知 Spark 如何处理来自转换器的数据，在本例中即为 `CoffeeOrder` 本身。\n\
  \n转到主应用程序代码清单 11-32 中的 `run` 方法，你将看到 `inputStream` 和 `KafkaOrderTransformer` 如何协同工作以生成\
  \ `streamingQuery` 的输入。\n\n```scala\noverride def run(): Unit = {\nimport scalapb.spark.Implicits._\n\
  super.run()\nval inputSourceStream = KafkaOrderTransformer(sparkSession)\n.transform(inputStream.load())\n\
  val writer = outputStream(inputSourceStream)\nstartAndAwaitApp(writer.start())\n\
  }\n```\n\n*代码清单 11-32: 使用 Apache Spark 消费来自 Kafka 的可序列化结构化数据*\n\n这里剩下的唯一内容是查看 `outputStream`\
  \ 方法。`startAndAwaitApp` 方法来自第 10 章。`outputStream` 方法使用了前面 `inputStream` 方法（代码清单\
  \ 11-23）中展示的配置模式，并如代码清单 11-33 所示。\n\n```scala\ndef outputStream(ds: Dataset[CoffeeOrder]):\
  \ DataStreamWriter[Row] = {\n...\nval streamOptions = sparkConf\n.getAllWithPrefix(\"\
  $StreamConfigSinkPrefix.option.\")\nval dataStream = ds\n.withColumn(\"date\", to_date(\n\
  to_timestamp($\"timestamp\".divide(1000).cast(LongType)))\n)\n.writeStream\n.format(outputStreamFormat)\n\
  .queryName(outputStreamQueryName)\n.outputMode(outputStreamMode)\n.partitionBy(\"\
  date\")\n.options(streamOptions)\ntriggerType match {\ncase \"continuous\" if triggerEnabled\
  \ =>\ndataStream.trigger(\nTrigger.Continuous(processingInterval))\ncase \"once\"\
  \ if triggerEnabled =>\ndataStream.trigger(Trigger.Once())\ncase \"processing\"\
  \ if triggerEnabled =>\ndataStream.trigger(\nTrigger.ProcessingTime(processingInterval))\n\
  case _ =>\ndataStream\n}\n}\n```\n\n*代码清单 11-33: 将 CoffeeOrders 转换为按日期分区的 Parquet\
  \ 数据*\n\n这里的最后一块拼图是将 `Dataset[CoffeeOrder]` 转换为 `DataStreamWriter`，后者会将所有可用的数据行写入数据湖，实现与第\
  \ 10 章应用程序类似的结果。现在只剩下运行应用程序了。\n\n\n\n### 运行消费者应用程序\n\n现在您已经有机会浏览了应用程序，如果做了任何修改，可以编译该应用程序。否则，构建应用程序和创建\
  \ Docker 容器的输出将与之前相同，因此如果您一直跟随练习操作，应该已经编译并容器化了消费者应用程序。\n\n```\ndocker run \\\n-p\
  \ 4040:4040 \\\n--hostname spark-kafka-coffee-consumer \\\n--network mde \\\n-v\
  \ ~/dataengineering/spark/conf/hive-site.xml:/opt/spark/conf/hive-site.xml \\\n\
  -v ~/dataengineering/spark/jars:/opt/spark/user_jars \\\n-it `whoami`/spark-kafka-coffee-orders:latest\
  \ \\\n/opt/spark/bin/spark-submit \\\n--master \"local[*]\" \\\n--class \"com.coffeeco.data.SparkKafkaCoffeeOrdersApp\"\
  \ \\\n--deploy-mode \"client\" \\\n--jars /opt/spark/user_jars/mariadb-java-client-2.7.2.jar\
  \ \\\n--driver-class-path /opt/spark/user_jars/mariadb-java-client-2.7.2.jar \\\n\
  --driver-java-options \"-Dconfig.file=/opt/spark/app/conf/coffee_orders_consumer.conf\"\
  \ \\\n--conf \"spark.sql.streaming.kafka.useDeprecatedOffsetFetching=false\" \\\n\
  --conf \"spark.app.source.option.startingOffsets=earliest\" \\\n--conf \"spark.app.stream.trigger.type=once\"\
  \ \\\n/opt/spark/app/spark-kafka-coffee-orders.jar\n清单 11-34\n运行 CoffeeOrder 消费者应用程序\n\
  ```\n\n`spark-kafka-coffee-orders` 应用程序根目录中提供的 `README.md` 文件提供了一个更完整的 `run` 命令版本，其中包含了所有配置覆盖项。命令（11-34）还使用了应用程序的替代配置，这是通过\
  \ Spark Submit 上的 `driver-java-options` 实现的。虽然 Configuration 助手一直能够读取替代配置（得益于 `TypeSafe`\
  \ 配置库），但这是第一个在工作中使用我称之为`自带配置`模式的示例。\n\n```\n--driver-java-options \"-Dconfig.file=/opt/spark/app/conf/coffee_orders_consumer.conf\"\
  \n```\n\n这种替代配置在容器内部的可用方式是通过对 Dockerfile 进行一个小的更改实现的。\n\n```\nFROM newfrontdocker/apache-spark-base:spark-3.1.2-jre-11-scala-2.12\n\
  COPY target/scala-2.12/spark-kafka-coffee-orders-assembly-0.1-SNAPSHOT.jar /opt/spark/app/spark-kafka-coffee-orders.jar\n"
