  ### 练习 5-1：总结\n\n到目前为止，本练习向你展示了使用 Docker 启动、连接和操作 MySQL 是多么简单。这个过程使你能够在本地构建一致的环境，从而在部署后避免意外问题。这意味着你可以运行完整性检查、测试或尝试新事物，而无需启动和维护一个永久环境。\n\
  \n在下一个练习中，你将学习如何使用 Apache Spark 和 Java 数据库连接（JDBC）连接到 MySQL、获取表（结构）定义、读取、查询和写入数据。\n\
  \n## 将 RDBMS 与 Spark SQL 和 JDBC 结合使用\n\n从 Spark 连接到关系数据库管理系统（RDBMS）需要两样东西：*一个 JDBC\
  \ 兼容的驱动程序*和*数据库属性*。为简单起见，我可能会互换使用 RDBMS 和数据库这两个术语。\n\nJDBC SQL 驱动程序（JAR）可以直接添加到你的应用程序中（编译时），或者放入\
  \ Spark 的 JARs 目录（作为自定义发行版的一部分，需要管理员支持），或者按需获取。数据库属性包括主机名（`mysql`）、RDBMS 监听端口（`3306`）、数据库名称（`default`）和凭据（`user/pw`）。有了这些，Apache\
  \ Spark 可以轻松处理存储在外部数据库中的数据。\n\n管理应用程序依赖关系的过程可以在编译时处理，甚至可以在运行时更新或覆盖。例如，以下是处理 Spark\
  \ 依赖关系的三种常见方法：\n\n1.  使用 [maven](https://maven.apache.org/what-is-maven.html) 或\
  \ [sbt](https://www.scala-sbt.org/) 将必要的 JAR 作为直接依赖项提供给应用程序，并与应用程序 JAR 一起编译（这可以称为构建一个*胖*\
  \ JAR）。\n\n2.  在运行时使用 Spark 内置的运行时依赖支持下载所需的包。这意味着在提交应用程序或启动 `spark-shell` 时使用 `--packages`\
  \ 选项。\n\n3.  在提交应用程序或启动 `spark-shell` 时，使用 `--jars` 选项引用一个本地或远程位置，应用程序可以在该位置找到额外的依赖项。\n\
  \n在下一节中，我们将研究如何管理依赖项以及为 `spark-shell` 提供额外配置。你可以使用这些部署模式来增强应用程序在运行时的行为。在此过程中，你将学习如何处理依赖项、增强配置，以及更重要的是，这些技术如何用于创建*复合命令行应用程序*。\n\
  \n### 管理依赖项\n\n到目前为止，我们还没有在本地构建或编译过 Spark 应用程序。相反，我们依赖 `spark-shell` 和 Apache Zeppelin\
  \ 笔记本环境来动态编译和运行这些部分应用程序。在后面的章节中，你将使用 Scala 构建工具（`sbt`）来构建、打包和管理 Spark 应用程序的依赖项，但我们现在不进行长篇的题外话，而是通过一个练习来查看\
  \ Spark 中内置的其他选项，该练习将从 `spark-shell` 连接到你的本地 MySQL。\n\n**注意**\n\nMySQL 应该在 localhost\
  \ 的 `3306` 端口上运行。你可以使用终端中的网络连接（`nc`）命令测试 `3306` 端口是否处于活动状态。\n\n`> nc -z localhost\
  \ 3306`\n\n`Connection to localhost port 3306 [tcp/mysql] succeeded!`\n\n在运行时为 Spark\
  \ 应用程序提供额外的 JAR 可能非常有益。你将学习这种能力如何使你通过混合额外的依赖项来增强应用程序的行为。虽然对应用程序进行运行时修改可能导致行为不一致，但这是一种常用于测试和调试的策略，因为你无需重新编译和重新发布应用程序即可更改某些行为。你将了解到这个过程值得深入研究，因此我们将在下一节中就此展开讨论。\n\
  \n\n\n### 练习 5-2：基于配置驱动的 Spark Shell 与 JDBC 开发\n\n假设我们被要求编写一个通用应用程序，该应用原则上依赖用户或环境提供的配置，以可靠的方式连接远程数据库，用于执行按需的临时数据库查询。在研究过程中，我们发现\
  \ Apache Spark 已包含此基本功能，并且只要包含相应的依赖项，就可以连接到任何兼容 JDBC 的数据库。\n\n我们制定了以下行动计划：\n\n1.\
  \  定义我们的配置参数名称。这将创建一个可在文档中共享的通用配置接口。\n2.  提供应用程序中常用的、受支持的数据库驱动程序（连接器）。这些驱动程序可以自动引入，无需其他工程师担心额外的依赖管理。不过，如果他们希望自带连接器，也可以在启动应用程序时使用\
  \ `--packages` 选项来实现。\n3.  通过处理所有其他必要步骤来准备和保护应用程序，帮助其他人无需成为 Spark 专家即可轻松使用该工具。\n\
  \n**提示** 我坚信“循序渐进”的学习方法。就像学走路时，我们常常会绊倒摔跤，但我们可以从沿途的错误中学习。构建可靠的模块或共享库也是如此。如果你提供的护栏不会造成障碍，而是提供流畅的体验，并且库的用户在必要时可以进行调整，那么所有参与者都会感到满意。例如，你可以为代码添加合理的默认值，以方便他人。\n\
  \n我们将研究如何将此行为构建到简单的 `spark-shell` 流程中。我们将确定所需的配置，编写一个简单的 Scala 文件（填充层），并研究如何为我们的\
  \ MySQL 连接器使用本地和远程依赖管理。我们将使用的两个 MySQL 连接器已添加到练习材料中，方便地存放在章节练习材料的 `/ch-05/docker/spark/jars/`\
  \ 目录下的 `jars` 文件夹中。\n\n#### Spark Shell 中的配置、依赖管理和运行时文件解释\n\n首先，让我们仔细看看 `spark-shell`，并了解可用于修改此动态\
  \ Apache Spark 应用程序运行时行为的选项。鉴于我们以 `spark-shell` 作为此练习的起点，在启动此 Spark 应用程序时，你可以利用以下参数，包括用于增强运行时配置、远程和本地依赖管理以及动态类编译和解释的参数。\n\
  \n## 运行时配置\n\n在 Spark Shell 中使用运行时属性 `--conf \"key=value\"` 会将额外的配置推入不可变的 `SparkConf`\
  \ 中，供应用程序在运行时使用。使用运行时配置属性添加的任何配置的值都将覆盖所提供的任何键的值。因此，请务必小心，并记录可用的运行时覆盖项。\n\n#####\
  \ 本地依赖管理\n\n使用 `--jars \"<file.jar>,<file.jar>\"` 会在启动时将额外的 JAR 包添加到应用程序类路径中。这些\
  \ JAR 包应位于本地文件系统上，或者可以从 `s3a` 或 `HDFS` 获取。\n\n##### 运行时包管理\n\n使用 `--packages \"\
  <groupId:artifactId:version>,\"` 属性为 Spark 提供 Ivy 参数，以便在运行时下载一个或多个依赖项。你可以使用运行时包管理器即时获取库。请记住，并非所有包在你需要时都可用，因此当可靠性不是首要任务时再使用此技巧，因为它可能导致生产环境中的承诺落空。\n\
  \n\n\n### 动态类编译与加载\n\n使用 `-i <file>` 参数可以在将 `spark-shell` 的控制权交还给你之前，将任何 Scala 文件解释并加载到会话上下文中。此选项直接存在于\
  \ Scala REPL 中，因此由于 Spark REPL 扩展了默认的 Scala REPL，它也是 `spark-shell` 的一部分。\n\n现在，假设你希望从\
  \ Spark 内部连接到 MySQL，你需要根据 Spark JDBC 连接器属性创建一些额外的配置选项，以便在运行时传递给 shell 程序。\n\nSpark\
