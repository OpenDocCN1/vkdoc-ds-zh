  \n让我们开始吧。\n\n## 练习 13-1：店铺收入聚合\n\n在你喜欢的 IDE 中打开位于 `/ch-13/applications/stateful-stream-aggs/`\
  \ 的应用程序。第一个涉及的应用程序是一个有状态 Structured Streaming 应用程序的示例，它自动在基于时间的窗口中聚合 `CoffeeOrder`\
  \ 事件，以生成店铺绩效指标桶。\n\n首先打开 `SparkStatefulAggregationsApp`，查看 `object` 签名。\n\n```scala\n\
  object SparkStatefulAggregationsApp extends SparkStructuredStreamingApplication[DataFrame,\
  \ Row]\n```\n\n你会注意到本章引入了一个新的应用程序特质，名为 `SparkStructuredStreamingApplication`。该特质提供了在构建\
  \ Structured Streaming 应用程序时使用的额外方法。让我们先看看这个新特质，然后再回到应用程序。\n\n\n\n### Structured\
  \ Streaming 应用特质\n\n这一新特质如下所示，它扩展了第 7 章介绍的 `SparkApplication` 特质。该特质新增了几个值得关注的便捷方法，旨在加速构建流式应用，如代码清单\
  \ 13-5 所示。该接口提供了一个可复用的框架，以简化使用核心 Spark 类 `DataStreamReader`、`DataStreamWriter` 和\
  \ `StreamingQuery` 编写 Structured Streaming 应用程序的过程。\n\n```\ntrait SparkStructuredStreamingApplication[T,\
  \ U]\nextends SparkApplication {\ndef streamReader: DataStreamReader\nlazy val inputStream:\
  \ DataStreamReader = streamReader\ndef outputStream(writer: DataStreamWriter[U])(implicit\
  \ sparkSession: SparkSession): DataStreamWriter[U]\ndef runApp(): StreamingQuery\n\
  def awaitTermination(query: StreamingQuery): Unit\ndef awaitAnyTermination(): Unit\n\
  }\n```\n\n**代码清单 13-5** `SparkStructuredStreamingApplication` 特质接口方法\n\n作为回顾，Structured\
  \ Streaming 应用通过组装一个查询计划来构建，该计划始于流式数据源，终于流式数据接收器。在每个有状态处理周期中，应用持续读取新的流式数据批次，对每个批次进行转换和处理，并将结果发送到下游或可靠的存储中（用于聚合操作）。\n\
  \n新特质将流读取器和写入器（`DataStreamReader`、`DataStreamWriter`）封装成可复用的函数，从而提供了额外的机制来采用配置驱动的方法，这种方法非常有利于测试端到端的应用程序（你将在本章后面看到）。\n\
  \n接下来，让我们更仔细地研究一下 `streamReader` 和 `outputStream` 函数，因为它们是对前几章中使用的 `inputStream`\
  \ 和 `outputStream` 概念的演进式阶跃变化。\n\n#### 流读取器\n\n`streamReader` 方法使用 Spark 配置中前缀为\
  \ `spark.app.source.*` 的设置，在动态构建新的 `DataStreamReader` 实例时使用这些配置。\n\n```\ndef streamReader:\
  \ DataStreamReader = sparkSession\n.readStream\n.format(sparkConf.get(sourceFormat,\
  \ sourceFormatDefault))\n.options(sparkConf.getAllWithPrefix(\nsparkConf.get(sourceStreamOptions)).toMap)\n\
  ```\n\n这种技术使你的应用能够轻松切换由 `DataStreamReader` 使用的上游数据源。例如，用于重新生成最终数据集的恢复或重播任务，可能会使用与实时应用不同的上游数据源，比如选择\
  \ S3 而不是 Kafka 进行恢复。此外，此策略可作为强制函数，防止在应用程序源代码中硬编码值。但要注意不要让应用的灵活性过度降低。这就是为什么该特质提供了可由扩展类使用并进一步装饰的方法。\n\
  \n#### 输出流装饰器\n\n`outputStream` 方法如代码清单 13-6 所示，用于为 `DataStreamWriter` 装饰常见行为，如触发和分区。它简化了\
  \ Structured Streaming 应用在配置 `outputStreams` 时涉及 `outputMode`、列式分区和触发的方式。\n\n```\n\
  def outputStream(writer: DataStreamWriter[U])(implicit sparkSession: SparkSession):\
  \ DataStreamWriter[U] = {\nimport appConfig._\nval conf = sparkSession.conf\n...\n\
  Seq(OutputModeOption, PartitionByOption, TriggerOption)\n.foldLeft[DataStreamWriter[U]](writer)((w,\
  \ config) => {\n...\n})\n.format(SinkFormat)\n.queryName(QueryName)\n}\n```\n\n\
  **代码清单 13-6** `outputStream` `DataStreamWriter` 装饰器\n\n简而言之，代码清单 13-6 中的 `outputStream`\
  \ 方法使用 Spark 运行时配置来装饰输入的 `DataStreamWriter`。通过选择使用 `DataStreamWriter` 接口，`outputStream`\
  \ 方法无需关心数据血缘问题，因为那是应用程序的职责。该方法需要做的所有事情就是在提供的写入器之上添加格式、`queryName`、`outputMode`，以及可选的触发器和输出分区。\n\
  \n#### 条件对象装饰\n\n像 Scala 这样的函数式编程语言本质上是不可变的，旨在减少按引用传递语言常见的意外副作用。因此，我们使用 `foldLeft`\
  \ 操作来有条件地装饰 `DataStreamWriter` 接口。`foldLeft` 操作会遍历配置项列表，以可靠地生成写入器配置。\n\n查看代码清单 13-7\
  \ 中 `outputStream` 方法的内联函数，你会看到来自初始序列的每个配置值（`outputMode`、`partitionBy` 和 trigger）都用于有条件地装饰输入写入器对象（`w`），然后传递到下一个值并进行下一轮检查。\n\
  \n```\n(w, config) => {  config match {\ncase OutputModeOption => w.outputMode(sinkOutputMode)\n\
  case PartitionByOption if sinkPartitionBy.nonEmpty =>\nval partitionColumns = SinkPartitionBy\n\
  .split(SinkPartitionBySeparator).map(_.trim)\nif (partitionColumns.nonEmpty)   w.partitionBy(partitionColumns:_*)\
  \ else w\ncase TriggerOption if triggerEnabled => triggerType match {\ncase TriggerProcessingTime\
  \ =>          w.trigger(Trigger.ProcessingTime(ProcessTimeInterval))\ncase TriggerOnce\
  \ => w.trigger(Trigger.Once())\ncase TriggerContinuous if sinkFormat.equals(\"kafka\"\
  ) =>\nw.trigger(\nTrigger.Continuous(processTimeInterval))\ncase _ => w\n}\n}}\n\
  ```\n\n**代码清单 13-7** `outputStream` 的 `foldLeft` 内联函数\n\n代码清单 13-6 和 13-7 中的代码块共同创建了一个可扩展的\
  \ `DataStreamWriter` 装饰器。\n\n现在，让我们回到应用代码，看看这个特质是如何实际运用的。\n\n\n\n### Spark 状态聚合应用\n\
  \n现在你已经了解了该特质的运作方式，接下来可以看看应用如何利用该特质的新功能。切换回 `SparkStatefulAggregationsApp` 源代码，观察底层架构如何简化应用结构。\n\
  \n让我们从代码清单 13-8 中的 `runApp` 方法开始，逐步深入应用内部。\n\n```\noverride def runApp(): StreamingQuery\
  \ = {\nval conf = sparkSession.conf\nval processor = StoreRevenueAggregates(sparkSession)\n\
  val pipeline: Dataset[Row] = processor\n.transform(inputStream.load())\n.transform(processor.process)\n\
  val w = outputStream(pipeline.writeStream)\nconf.get(sinkToTableName, \"\") match\
  \ {\ncase tableName if tableName.nonEmpty =>\nw.toTable(tableName)\ncase _ => w.start()\n\
  }\n}\n代码清单 13-8\nrunApp 方法返回一个 StreamingQuery\n```\n\n代码清单 13-8 中的 `runApp` 方法使用\
  \ `StoreRevenueAggregates` 类的实例作为代理类，负责转换和处理输入数据流。\n\n```\nval pipeline: Dataset[Row]\
  \ = processor\n.transform(inputStream.load()) // DataFrame\n.transform(processor.process)\
  \ // Dataset[Row]\n```\n\n我们来拆解聚合管道的步骤：\n\n1.  `processor.transform(inputStream.load)`。第一个转换接收一个\
  \ `DataFrame` 并返回一个 `DataFrame`。在底层，此转换将时间戳列从 UNIX 纪元毫秒转换为 `TimestampType`。\n\n\
  2.  `DataFrame.transform(processor.process)`。第二个 `transform` 方法将步骤 1 转换后的 `DataFrame`\
  \ 通过函数式 DataFrame 转换传入 `StoreRevenueAggregates` 类的 `process` 方法。这是我们添加 `watermark`、`groupBy`、`window`\
  \ 和 `agg` 操作以实现聚合流的地方。\n\n管道的结果是一个 `DataFrame`（即 `Dataset[Row]`），可与 `outputStream`\
  \ 装饰器函数配合使用。然后根据应用配置，通过 `toTable` 或直接使用 `DataStreamWriter` 条件性地启动输出流。\n\n接下来，我们拆解\
  \ `StoreRevenueAggregates` 类，看看这个应用到底做了什么。\n\n### 流式聚合\n\n打开位于 `processors` 包中的\
  \ `StoreRevenueAggregates` 类。代码清单 13-9 中的类仅包含 `transform` 和 `process` 方法，这是 `DataFrameTransformer`\
  \ 和 `WindowedDataFrameProcessor` 特质所要求的。\n\n```\nclass StoreRevenueAggregates(val\
  \ spark: SparkSession) extends DataFrameTransformer with WindowedDataFrameProcessor\
  \ with Serializable {\noverride def transform(df: DataFrame): DataFrame = df\n.withColumn(timestampColumn,\
  \ to_timestamp(\ncol(timestampColumn).divide(lit(1000))\n.cast(TimestampType)))\n\
  override def process(df: DataFrame): DataFrame = {\nimport spark.implicits._\ndf\n\
  .dropDuplicates(\"orderId\")\n.withWatermark(timestampColumn, watermarkDuration)\n\
  .groupBy($\"storeId\", groupingWindow())\n.agg(\ncount($\"orderId\") as \"totalOrders\"\
  ,\nsum($\"numItems\") as \"totalItems\",\nsum($\"price\") as \"totalRevenue\",\n\
  percentile_approx($\"numItems\", lit(0.95), lit(95))\nas \"numItemsP95\",\navg($\"\
  numItems\") as \"averageNumItems\"\n)\n}\n}\n代码清单 13-9\nStoreRevenueAggregates 类\n\
  ```\n\n代码清单 13-9 中的类实现简单明了。我们先从 `transform` 方法开始，然后介绍 `process` 方法。\n\n#### Transform\
  \ 方法\n\n`transform` 方法接收一个表示 `CoffeeOrder` 的输入 `DataFrame`，并将输入时间戳列的值从 `BigInteger`\
  \ 转换为 `TimestampType`。此操作是必要的，可以在将值转换为 Spark 窗口和水印可用的时间戳之前，移除多余的精度（`divide(1000)`）。如果不进行除法操作，时间戳将会翻转，变得不可用。\n\
  \n#### Process 方法\n\n`process` 方法承载了应用的大部分核心逻辑。\n\n我们首先使用 `dropDuplicates` 方法在 `orderId`\
  \ 列上删除任何重复行。此过程确保每个唯 `orderId` 仅第一行被纳入最终聚合结果。需要指出的是，`dropDuplicates` 方法仅在聚合数据驻留内存时有效。\n\
  \n接下来，我们添加一个*水印*，确保流查询会忽略 `timestampColumn` 定义的延迟数据。*请记住，水印列必须与窗口时间戳列一致，水印才能生效*。基于此，我们应用上一章熟悉的\
  \ `groupBy` 运算符，并结合本章前面介绍的新窗口函数，生成一个流式分组集。随后，我们将第 12 章介绍的聚合函数应用于流数据集。\n\n就是这样。现在可以配置应用，使用窗口创建任意基于时间的聚合。在练习\
  \ 13-2 中，我们将使用 `KeyValueGroupedDataset` 提供的强大类型安全 `FlatMapGroupsWithState` 功能重新创建聚合，从而解析\
  \ Spark 在后台的运作方式。\n\n### 练习 13-1：总结\n\n第一个练习带你完成了构建端到端应用的过程，该应用用于可靠处理流数据并生成有状态的窗口聚合。接下来，我们将探讨如何使用任意状态计算编写应用，这是一组低级运算符，用于将分组数据的状态处理扩展为类型化的用户自定义函数（UDF）。\n\
  \n## 类型化任意状态计算\n\nApache Spark 为流数据集提供了一组丰富的低级功能。这些功能旨在解决比单独使用 Spark SQL 操作和 DataFrame\
  \ DSL 更复杂的问题。\n\n回想一下上一章创建的*用户自定义函数（UDF）*。这些函数按行工作，使用一个或多个列作为 `DataFrame` UDF 的输入来创建新列。任意状态计算通过增加托管状态和分组特定超时的额外功能，将基本\
  \ UDF 功能提升到新水平。所有这些行为都隐藏在 `KeyValueGroupedDataset` 背后。\n\n### KeyValueGroupedDataset\n\
  \n回想一下，只有在 `DataFrame` 上调用 `groupBy` 后，才能使用 `RelationalGroupedDataset` 的 `agg` 运算符。数据集也有额外的运算符，只有在\
  \ `KeyValueGroupedDataset` 上调用 `groupByKey` 后才能使用。\n\n例如，代码清单 13-10 将 `inputStream`\
  \ 转换为一个按订单的 `storeId` 分组的 `KeyValueGroupedDataset`。\n\n```\nimport spark.implicits._\n\
  val encoder = Encoders.product[CoffeeOrder]\nval groupedDS: KeyValueGroupedDataset[\n\
  String, CoffeeOrder] = inputStream.load().as[CoffeeOrder].groupByKey(_.storeId)\n\
  代码清单 13-10\n将数据集转换为 KeyValueGroupedDataset 以暴露任意状态计算运算符\n```\n\n上面的示例使用 `as[CoffeeOrder]`\
  \ 将 `DataFrame` 转换为特定的数据集，为任意状态处理做好准备。下一步是使用 `mapGroupsWithState` 或 `flatMapGroupsWithState`\
  \ 运算符。我们现在来了解一下这两个运算符。\n\n\n\n### 使用 `mapGroupsWithState` 进行迭代计算\n\n`mapGroupsWithState`\
  \ 和 `flatMapGroupsWithState` 方法接受一个 UDF 函数，并定义一个键和输入值的类型。它们还需定义所存储状态的数据类型，以及任意计算得出的最终输出数据类型。同时，它们也接收用于管理状态的数据类型编码器和最终输出类型的参数。最后一个参数\
  \ `timeoutConf` 描述了 Spark 应如何管理这些迭代计算的内部状态。\n\n```\ndef [flat]mapGroupsWithStateS,\
  \ U: [Dataset[U]|U]\n```\n\n接下来是您传递给这些操作符的函数的签名。\n\n#### MapGroupsWithState 函数\n\
  \n```\ndef func(key: K, values: Iterator[V], state: GroupState[S]): U\n```\n\n`mapGroupsWithState`\
  \ 的 UDF 函数为您提供一个 `key` 和一个值的迭代器（`Iterator[V]`），可以用来创建初始状态记录，或者更新状态存储中先前保存的某一行。该函数的输出是将一个或多个输入行（`V`）缩减为一个单独的输出行（`U`）。\n\
  \n#### FlatMapGroupsWithState 函数\n\n`flatMapGroupsWithState` 函数与 `mapGroupsWithState`\
  \ 几乎相同。唯一的区别在于输出类型，从单个 `U` 实例变成了 `Iterator[U]`。\n\n```\ndef func(key: K, values:\
  \ Iterator[V], state: GroupState[S]): Iterator[U]\n```\n\n您的状态函数提供给 `*mapGroupsWithState`\
  \ 操作符的 UDF 函数会在每个微批次中被调用。可以保证所有可用的行都会根据分组键拆分后提供给您的函数。这使得您能够使用提供的匹配行值（`V`）的迭代器来创建新的状态存储记录，或者以迭代方式将新值合并到先前状态中。\n\
  \n练习 13-2 将展示一个实际示例。\n\n## 练习 13-2：对类型化数据集进行任意有状态计算\n\n打开 `SparkTypedStatefulAggregationsApp`。此应用程序的实现使用了与练习\
  \ 13-1 中 `SparkStatefulAggregationsApp` 应用程序相同的特质。\n\n### SparkTypedStatefulAggregationsApp\n\
  \n本章的第二个应用程序产生了与第一个相似的结果。您将随时间推移生成门店收入聚合。这一次的不同之处在于，您将使用 `flatMapGroupsWithState`\
  \ 操作符，并定义自己的分组键，以取代第一个练习中的 `groupBy(col, window(...))` 功能。完整的包装应用程序如代码清单 13-11 所示。\n\
  \n```\nobject SparkTypedStatefulAggregationsApp\nextends SparkStructuredStreamingApplication[\n\
  Dataset[CoffeeOrderForAnalysis], CoffeeOrderStats] {\n...\noverride def runApp():\
  \ StreamingQuery = {\nimport sparkSession.implicits._\nval conf = sparkSession.conf\n\
  val processor = TypedRevenueAggregates(sparkSession)\nval pipeline = processor\n\
  .transform(inputStream.load().as[CoffeeOrder])\n.transform(processor.process)\n\
  conf.get(sinkToTableName, \"\") match {\ncase tableName if tableName.nonEmpty =>\n\
  outputStream(pipeline.writeStream)\n.toTable(tableName)\ncase _ => outputStream(pipeline.writeStream).start()\n\
  }\n}\nrun()\n}\n代码清单 13-11\nSparkTypedStatefulAggregationsApp\n```\n\n再次从 `runApp`\
  \ 方法开始，您会发现除了代理类 `TypedRevenueAggregates` 以及 transform 方法接受类型化的 `CoffeeOrder`（而非\
  \ `DataFrame`）之外，该应用程序与练习 13-1 中的应用程序没有太大区别。主要区别在于聚合行为本身的运作机制，因此让我们打开 `processors`\
  \ 包中的 `TypedRevenueAggregates` 类，并开始逐步浏览代码。\n\n### TypedRevenueAggregates\n\n应用程序中有相当多的样板代码，但让我们先来看一下\
  \ `transform` 方法，该方法在代码清单 13-12 中呈现。该方法接受一个 `CoffeeOrder` 数据集，并将其转换为 `CoffeeOrderForAnalysis`\
  \ 数据集。\n\n```\noverride def transform(ds: Dataset[CoffeeOrder]): Dataset[CoffeeOrderForAnalysis]\
  \ = {\nds\n.withColumn(timestampColumn,\nto_timestamp(\ncol(timestampColumn).divide(lit(1000)).cast(TimestampType)))\n\
  .withColumn(\"window\", groupingWindow())\n.withColumn(\"key\", sha1(bin(hash(col(\"\
  storeId\"),col(\"window.start\"), col(\"window.end\")))))\n.as[CoffeeOrderForAnalysis]\n\
  }\n代码清单 13-12\n为任意有状态计算作准备，将一个数据集转换为另一个数据集\n```\n\n这个函数中包含了许多操作。首先，我们复用了练习 13-1\
  \ 中的时间戳转换技术，以及同练习中首次出现的 `groupingWindow` 方法。不过，我们并没有将窗口函数添加到 `groupBy` 中，而是直接将窗口添加到数据集上。最后，我们对当前已变为\
  \ `DataFrame` 中的数据集的 `storeId`、`window.start` 和 `window.end` 列计算了一个强哈希函数。这为我们提供了一个强组合键，我们可以将其与\
  \ `groupByKey` 一起使用来处理流式数据集。\n\n用于编码转换后数据集的样例类如下所示。\n\n\n\n#### `CoffeeOrderForAnalysis`\n\
  \n```\ncase class CoffeeOrderForAnalysis(\ntimestamp: java.sql.Timestamp ,\nwindow:\
  \ Window,\nkey: String,\norderId: String,\nstoreId: String,\ncustomerId: String,\n\
  numItems: Int,\nprice: Float\n) extends Serializable\n```\n\n由于 `transform` 方法添加了时间戳、窗口和键列，我们可以使用\
  \ `.as[CoffeeOrderForAnalysis]` 转换更新后的数据集。\n\n清单 13-13 展示了 `process` 方法并解读了它的作用。\n\
  \n```\noverride def process(ds: Dataset[CoffeeOrderForAnalysis]): Dataset[CoffeeOrderStats]\
  \ = {\nds\n.dropDuplicates(\"orderId\")\n.withWatermark(timestampColumn, watermarkDuration)\n\
  .groupByKey(_.key)\n.flatMapGroupsWithStateCoffeeOrderStats, CoffeeOrderStats, GroupStateTimeout.EventTimeTimeout)(stateFunc)\n\
  }\n```\n\n`process` 方法是我们为任意有状态计算设置逻辑计划的地方。我们首先基于咖啡订单的 `orderId` 进行去重。这样一来，我们就不必担心上游为同一订单（这种情况确实存在）发出第二个或第三个事件而导致错误聚合。我们将水印应用于在类的\
  \ `transform` 方法中添加的时间戳列，与练习 13-1 不同的是，我们无需将水印中使用的时间戳列与窗口中使用的列保持一致。\n\n这是因为 Spark\
  \ 允许我们的应用程序通过状态超时配置 `GroupStateTimeout.EventTimeTimeout` 接管状态管理。由于水印与 `flatMapGroupsWithState`\
  \ 配合使用的方式，我们只能选择使用 `Append` 模式（这并不一定阻止我们的应用程序在 `update` 模式下运行；稍后你会明白原因）。\n\n###\
  \ 使用 `GroupStateTimeout` 配置状态存储\n\nSpark 提供了三种可靠管理分组状态的选项。这些选项包括 `ProcessingTimeTimeout`、`EventTimeTimeout`\
  \ 和 `NoTimeout`。\n\n#### `ProcessingTimeTimeout`\n\n`ProcessingTimeTimeout` 基于 Spark\
  \ 自身的内部时钟设置状态超时。你的 UDF 函数必须在每次状态更新时设置 `GroupedState` 的超时时间，以进行初始设置或延长超时时间。\n\n```\n\
  state.update(storedValue)\nstate.setTimeoutDuration(\"5 minutes\")\n```\n\n此示例将基于\
  \ Spark 内部时钟时间，为更新后的状态添加五分钟的超时时间。\n\n#### `EventTimeTimeout`\n\n`EventTimeTimeout`\
  \ 基于相对于 `StateStore` 当前全局水印的 `eventTime` 设置状态超时。此选项需要 `withWatermark` 算子才能工作，并且要求\
  \ `StreamingQuery` 使用追加模式。\n\n```\nstate.update(storedValue)\nstate.setTimeoutTimestamp(state.getCurrentWatermarkMs(),\
  \ \"30 minutes\")\n```\n\n此示例将给予存储在该特定分组状态中的所有数据额外的 30 分钟时间，之后才会超时。\n\n#### `NoTimeout`\n\
  \n此配置不设置超时。此选项可用于持续更新状态。需要注意的是，随着每个新的唯一键添加到状态存储中，托管状态将持续增长。在某个时刻，由于支持状态的大小，你的应用程序可能会停止正常运行。\n\
  \n现在，让我们看看传递给 `flatMapGroupsWithState` 算子的状态函数（`stateFunc`）。\n\n### 类型化商店收入聚合状态函数\n\
  \n`stateFunc` 方法如清单 13-14 所示。这是在 Spark 应用程序中实现对数据任意处理的核心例程。我们现在就来看一下状态函数的主要部分，然后深入探讨细节。\n\
  \n```\ndef stateFunc(\nkey: String,\norders: Iterator[CoffeeOrderForAnalysis],\n\
  state: GroupState[CoffeeOrderStats]): Iterator[CoffeeOrderStats] = {\nif (state.hasTimedOut)\
  \ {\nval result = state.getOption\nstate.remove()\nif (result.isDefined) Iterator(result.get)\n\
  else Iterator.empty\n} else {\nval stats = ordersStats(orders)\nval stateHolder\
  \ = state.getOption match {\ncase Some(prior: CoffeeOrderStats) =>\nval avgNumItems\
  \ = prior.averageNumItems/priorState.totalItems + stats.averageNumItems/stats.totalItems\n\
  CoffeeOrderStats(stats.storeId, stats.window,\nstats.totalItems+prior.totalItems,\n\
  stats.totalOrders+prior.totalOrders,\nstats.totalRevenue+prior.totalRevenue,\navgNumItems)\n\
  case None => stats }\nstate.update(stateHolder)\nval timeout = stateHolder.window.end\n\
  .toInstant.toEpochMilli\nstate.setTimeoutTimestamp(timeout, \"30 seconds\")\nIterator.empty\n\
  }\n}\n```\n\n从清单 13-14 所示函数的顶部开始，我们检查状态的状态，看它是否已经超时。每当一个微批次处理周期完成时，`StateStore`\
  \ 会标记那些在下一个处理周期中即将超时的记录。下一个周期开始时，任何标记为 `timedOut` 的状态行将最后一次通过 `flatMapGroupsWithState`\
  \ 函数。让我们在清单 13-15 中更详细地查看超时操作。\n\n```\nif (state.hasTimedOut) {\nval result = state.getOption\n\
  state.remove()\nIterator(result.isDefined) Iterator(result.get)\nelse Iterator.empty\n\
  }\n```\n\n需要注意的重要一点是，如果你跳过从 `StateStore` 中移除状态，Spark 不会替你移除。这会导致孤立的状态行堆积，造成严重的内存泄漏。永远记得检查你的状态是否确实已经超时。接下来，当你的状态尚未超时的情况下，你需要决定如何处理当前的订单。这就是\
  \ `ordersStats` 方法的用武之地。\n\n```\nval stats = ordersStats(orders)\n```\n\n`orderStats`\
  \ 方法将一个 `Iterator[CoffeeOrderForAnalysis]` 缩减为单个 `CoffeeOrderStats` 对象。我们来分解一下清单\
  \ 13-16 所示方法中发生的事情。\n\n```\ndef orderStats(orders: Iterator[CoffeeOrderForAnalysis]):\
  \ CoffeeOrderStats = {\nval head = orders.next()\nval first = (head.storeId, head.window,\
  \ 1, head.numItems, head.price, head.numItems.toFloat)\nval reduced =  orders.map(o\
  \ => (o.numItems, o.price))\n.foldLeft(String,Window,Int,Int,Float,Float)(\n(orderStats,\
  \ order) => {\nval totalOrders = orderStats._3 + 1\nval totalItems = orderStats._4\
  \ + order._1\n(orderStats._1, // storeId\norderStats._2, // window\ntotalOrders,\
  \ // totalOrders\ntotalItems, // totalItems\norderStats._5+order._2, //totalRevenue\n\
  (orderStats._6+order._1.toFloat)/2) // averageNumItems\n})\nCoffeeOrderStats(reduced._1,\
  \ reduced._2, reduced._3, reduced._4, reduced._5, reduced._6)\n}\n```\n\n\n\n\n\
  `reduce`操作使用`foldLeft`过程，将任意数量的订单缩减为单个合并记录，并使用订单迭代器中的第一个项作为迭代的基础对象。在每次增量通过折叠功能时，先前的统计数据会与每组新统计数据合并。最终，当折叠操作返回时，我们得到一个元组（`String,\
  \ Window, Int, Int, Float, Float`），该元组封装了`CoffeeOrderStats`对象。\n\n> *折叠可能不是你进行迭代处理的首选，但我强烈推荐它们，因为它们在解决各种问题时具有灵活性。*\n\
  \n**注意**\n\n在`orderStats`方法中，函数式`foldLeft`操作的迭代处理是一个很好的思维模型，可用于思考 Spark 如何跨有状态批次处理聚合。你基本上会获取多个迭代器（每个有状态批次对应一个），并将这些值折叠在一起，为每个批次创建单个记录。根据所使用的聚合策略，会保留足够多的数据，以便在聚合生命周期内合并每次`reduce`操作的值。\n\
  \n这就引出了最后一部分：跨现有状态的合并功能，如清单 13-17 所示。`stateHolder`变量负责测试`GroupState`对象并查找之前的状态。如果之前没有状态（`None`），我们只需返回由`orderStats`调用生成的`stats`对象。然而，如果存在之前的状态，则需要将其合并到我们的最新状态中。\n\
  \n```\nval stats = orderStats(orders)\nval stateHolder = state.getOption match {\n\
  case Some(currentState: CoffeeOrderStats) =>\nCoffeeOrderStats(stats.storeId, stats.window,\n\
  stats.totalItems + currentState.totalItems,\nstats.totalOrders + currentState.totalOrders,\n\
  stats.totalRevenue + currentState.totalRevenue,\ncurrentState.averageNumItems/currentState.totalItems\
  \ +\nstats.averageNumItems/stats.totalItems\n)\ncase None => stats\n}\n```\n*清单\
  \ 13-17 将聚合的先前状态与当前批次更新合并*\n\n与`orderStats`方法将订单迭代器缩减为单个合并的`CoffeeOrderStats`对象的方式类似，合并过程本质上是通过加法创建总数，并计算平均值的平均值，以确保每个订单售出项的平均数量保持有效。\n\
  \n#### 平均值的平均值\n\n这里唯一棘手的问题是跨合并批次保持平均项数量的准确性。但利用一些基础数学知识，我们可以计算平均值的平均值，并在多次合并后保持相当准确的平均值。\n\
  \n```\ncurrentState.averageNumItems/currentState.totalItems +\nstats.averageNumItems/stats.totalItems\n\
  ```\n\n技巧在于将两侧平均值的平均值相加。\n\n现在你已经了解了`TypedStoreRevenueAggregates`如何处理跨任意有状态计算的窗口聚合，让我们来看一下练习\
  \ 13-2 的示例输出。\n\n*最终聚合：窗口值已隐去以适配屏幕*\n\n```\n+-------+-----------+-----------+----------+----------------+\n\
  |storeId|totalOrders|totalItems|totalRevenue|averageNumItems|\n+-------+-----------+----------+------------+---------------+\n\
  |storeA |4          |8         |36.96       |2.25           |\n|storeB |6      \
  \    |3         |23.97       |1.5            |\n|storeC |1          |1         |2.99\
  \        |1.0            |\n|storeA |4          |2         |9.98        |2.0   \
  \         |\n|storeB |2          |2         |9.98        |2.0            |\n|storeC\
  \ |7          |2         |35.55       |2.0            |\n|storeB |1          |2\
  \         |3.99        |2.0            |\n|storeD |1          |9         |39.99\
  \       |9.0            |\n|storeA |1          |1         |2.99        |1.0    \
  \        |\n|storeF |2          |12        |115.979996  |6.0            |\n+-------+-----------+----------+------------+---------------+\n\
  ```\n\n### 练习 13-2：总结\n\n你了解了 Spark Structured Streaming 的任意有状态计算。你学会了如何使用`flatMapGroupsWithState`为存储在状态存储中的数据集提供底层增量处理。你学会了如何使用`GroupStateTimeout.EventTimeout`，并了解了其他选项：`GroupStateTimeout.ProcessingTimeTimeout`和`GroupStateTimeout.NoTimeout`。同时，你还了解了水印如何影响状态存储基于事件时间和`OutputMode.Append`记录超时的方式。\n\
  \n虽然在过去两章中你已经学到了很多关于如何处理分析数据的知识，但你还未学习如何对这些复杂操作进行单元测试。这最后一次简要介绍将为你提供一个功能完整的测试配置。\n\
  \n## 练习 13-3：测试结构化流式应用\n\n与任何软件一样，你的结构化流式应用只有在能够证明逻辑按预期工作后才算完成。这可能是一个棘手的情况，尤其是在确保代码质量和性能的同时运行本地化单元测试时。我现在将向你介绍`MemoryStream`和`MemorySink`的概念，这将在测试查询如何运行时为你带来巨大优势。\n\
  \n\n\n\n### MemoryStream\n\n`MemoryStream`来自`org.apache.spark.sql.execution.streaming`包，旨在用于本地测试。\n\
  \n```\ncase class MemoryStreamA : Encoder\n```\n\n使用内存流而非连接传统测试容器或本地环境的好处在于，可以在应用程序逻辑开始的地方测试代码。如果你使用`Kafka\
  \ DataSource`，通常无需确保`Kafka`工作正常，而应更关注`Kafka`为`Apache Spark`应用程序处理所发出的数据。清单 13-18\
  \ 展示了练习 13-1 的端到端单元测试。\n\n```\nclass SparkStatefulAggregationsAppSpec extends StreamingAggregateTestBase\
  \ {\n\"StoreRevenueAggregates\" should \" produce windowed statistics\" in {\nimplicit\
  \ val testSession: SparkSession = SparkStatefulAggregationsApp\n.sparkSession.newSession()\n\
  import testSession.implicits._\nimport org.apache.spark.sql.functions._\nimplicit\
  \ val sqlContext: SQLContext = testSession.sqlContext\ntestSession.conf.set(AppConfig.sinkQueryName,\
  \ outputQueryName)\nval outputQueryName = \"order_aggs\"\n// Group the iterator\
  \ into groups every 6 events\nval coffeeOrders = TestHelper\n.coffeeOrderData()\n\
  .grouped(6)\nval coffeeOrderStream = MemoryStream[CoffeeOrder]\ncoffeeOrderStream.addData(coffeeOrders.next())\n\
  val processor = StoreRevenueAggregates(testSession)\nval pipeline = processor\n\
  .transform(coffeeOrderStream.toDF())\n.transform(processor.process)\nval streamingQuery\
  \ = SparkStatefulAggregationsApp\n.outputStream(pipeline.writeStream)\n.start()\n\
  // queue up all the data for processing\ncoffeeOrders.foreach(orders =>\ncoffeeOrderStream.addData(orders))\n\
  // tell Spark to trigger everything available\nstreamingQuery.processAllAvailable()\n\
  val row = result\n.where($\"store_id\".equalTo(\"storeA\"))\n.sort(desc(\"orders\"\
  ))\n.collect().head\nrow.getDouble(row.fieldIndex(\"avg_items\")) shouldBe 2.0d\n\
  row.getInt(row.fieldIndex(\"p95_items\")) shouldBe 4d\nrow.getDouble(row.fieldIndex(\"\
  revenue\")) shouldBe 36.96d\nstreamingQuery.stop()\n}\n}\n清单 13-18\n使用 MemoryStream\
  \ 测试端到端结构化流式应用程序\n```\n\n分解该单元测试，我们从读取测试包中`TestHelper`对象添加的一些`CoffeeOrders`开始。这是一系列为测试而调整的订单，用于通过练习\
  \ 13-1 的传统`groupBy/window`聚合以及练习 13-2 的`flatMapGroupsWithState`聚合运行相同数据。这样，我们可以并排测试两者的行为。下面来看内存流：\n\
  \n```\nval coffeeOrderStream = MemoryStream[CoffeeOrder]\ncoffeeOrderStream.addData(coffeeOrders.next())\n\
  val processor = StoreRevenueAggregates(testSession)\nval pipeline = processor\n\
  .transform(coffeeOrderStream.toDF())\n.transform(processor.process)\n```\n\n关于`MemoryStream`，你会注意到的巧妙之处在于，可以使用`addData`方法向流中添加另一批数据。这是控制每个伪`Structured\
  \ Streaming`测试处理记录数的方式。你还可以通过调用`coffeeOrderStream`上的`toDF()`轻松生成正确的“流式”数据帧。这省去了仅为了单元测试而设置和集成诸如`Redis`或`Kafka`等工具的麻烦。接着，我们添加更多批次数据并强制`Spark`处理所有可用数据。\n\
  \n```\ncoffeeOrders.foreach(orders =>\ncoffeeOrderStream.addData(orders))\nstreamingQuery.processAllAvailable()\n\
  ```\n\n这将强制完成完整的处理周期、预写日志记录以及最终状态的提交。现在来看测试部分：\n\n```\nval row = result\n.where($\"\
  store_id\".equalTo(\"storeA\"))\n.sort(desc(\"orders\"))\n.collect().head\nrow.getDouble(row.fieldIndex(\"\
  avg_items\")) shouldBe 2.0d\nrow.getInt(row.fieldIndex(\"p95_items\")) shouldBe\
  \ 4\nrow.getDouble(row.fieldIndex(\"revenue\")) shouldBe 36.96d\n```\n\n测试本身很简单。我在测试`storeA`特定记录聚合结果中，`avg_items`、`p95_items`和`revenue`列的值分别为`2.0d`、`4d`和`36.96d`。测试`Spark`应用程序时还可以做更多事情，从测试运行时配置的预期，到确保应用程序经得起考验的复杂事件场景。最后，我们停止流式查询并让测试完成。\n\
  \n```\nstreamingQuery.stop()\n```\n\n欢迎运行单元测试，观察应用程序如何处理数据并计算你在本章中设置的聚合。\n\n###\
  \ 练习 13-3：总结\n\n编写能够 99.9% 捕获错误的单元测试是一门艺术。在按下按钮将应用程序部署到生产环境前，对应用程序能力充满信心总是令人愉悦的。我发现比编写优秀单元测试更令人满足的是，能够调试并了解`Spark`引擎中驱动转换和聚合的众多工作类。最后，单元测试是使用`MemoryStreams`测试端到端想法的好方法，并且可以在深入探索某个遥远概念之前快速组合一个粗略的测试应用。记住，你编写单元测试是为了自己、为了应用程序，也是为了未来的你或任何在你离开后必须维护你代码的人。请编写能够紧密覆盖和包装应用程序的测试，以便快速捕获错误，这样在你转向新项目后，你的应用程序仍能持续运行。\n\
  \n## 总结\n\n本章涵盖了广泛的内容，涉及分析和流式状态聚合的许多有趣领域。你学习了`RelationalGroupedDatasets`的魔法窗口表达式，它与水印配合，为复杂流式聚合提供了恰好一次语义。你还研究了使用任意状态处理来创建类似练习\
  \ 13-1 中带窗口表达式能力的分组集合系统。主要区别在于，你手动实现了状态函数中与`sum(col)`和`avg(col)`方法等效的功能。\n\n尽管`mapGroupsWithState`和`flatMapGroupsWithState`可以处理任何类型的数据，并用于跟踪人员进出咖啡店或判断哪个店铺更拥挤（基于订单下单与接收之间的差值，以及进入但未离开咖啡店的人数），但我认为展示如何以困难的方式创建窗口聚合会很有趣。你可以利用新知识创建以下任一系统：\n\
  \n-   跟踪人员进出咖啡店，以计算任意时刻店内总人数。\n-   根据当前店内人数以及订单下单与接收之间的平均差值，跟踪店铺拥挤程度。\n\n这些项目可以使用本章构建的框架完成。接下来两章将探讨部署、监控以及一些调优过程。让我们准备好将应用程序发布到生产环境中。\n\
  \n\n\n"
