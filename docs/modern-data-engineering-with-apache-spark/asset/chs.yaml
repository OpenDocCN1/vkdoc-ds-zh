  - 提供一个已知的主机（端点），用于连接 driver 应用以查看 Spark UI 或生成监控指标。\n\n## 集群模式\n\n在集群模式下部署 Driver\
  \ 程序，本质上意味着该应用将在 Spark 集群内部远程运行，并接受接收了传入 `spark-submit` 命令的 Spark 主节点的监管。例如，清单 14-2\
  \ 中的配置是对清单 14-1 的修订。它替换了部署模式的值，同时指定了运行时资源（driver 和执行器）以及特殊的 `supervise` 标志。\n\n\
