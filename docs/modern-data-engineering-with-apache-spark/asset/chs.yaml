  清单 14-2\n部署由集群管理的 Spark Driver 应用\n```\n\n如前所述，当向集群部署应用时，Driver 程序会*共同部署*在集群内部的某个\
  \ worker 上。图 14-3 展示了 Driver 应用如何与集群内其他程序共存，并占用所分配 worker 上可用总资源的一部分。\n\n![](img/505711_1_En_14_Fig3_HTML.png)\n\
  \n图 14-3\n\n以集群模式运行的 Spark Driver 应用\n\n考虑到在集群内运行的 Driver 应用的服务等级协议，了解每个共存应用在多租户集群中运行的开销是一个需要牢记的重要事实。如果没有资源来运行\
  \ Driver 程序（在发生故障后或因首次部署），那么 Driver 将处于 `Queued` 状态。\n\n正如将 driver 程序运行在集群之外有好处一样，将\
