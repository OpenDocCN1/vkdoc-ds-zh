- "# 创建基于时间窗口的聚合\n\n假设你有一个无限数据流的数据源，例如 Redis Stream 或 Kafka 主题，并且希望使用 Spark Structured\
  \ Streaming 来可靠地获取并持续分析该数据源中流经的数据。你清楚无法将所有数据永远储存在内存中，同时你也希望能够获得一定的处理能力与准确性保障。那么，你该如何应对呢？\n\
  \n首先，你可以将一种名为*窗口计算*的技术与 Spark Structured Streaming 结合使用。窗口计算允许你根据基于时间的间隔（例如每 15\
  \ 分钟），自动将静态或流式数据集切分成多个数据桶。简单来说，数据会被自动分组到由起始时间和结束时间定义的时间桶内。窗口计算，或称基于时间的分组，与我们上一章讨论的分析窗口函数不同。最大的区别在于，分析窗口函数会保留数据集中的所有行，并根据聚合函数新增一列；而窗口聚合则是基于时间窗口定义的分组集，逐步合并指定列的聚合结果。图\
  \ 13-1 展示了关于随时间变化的咖啡订单总数的有界数据（窗口 1-3）。请注意，这些窗口是不重叠的，这意味着在每个 15 分钟窗口内产生的订单对于该窗口来说是互斥的。这样一来，每个订单都只被计算一次。\n\
  \n![](img/505711_1_En_13_Fig1_HTML.png)\n\n图 13-1\n\n使用窗口来表示咖啡订单随时间变化的动态 `groupBy`\
  \ 函数\n\n让我们通过一个具体例子来进一步探讨这个想法。\n\n## 窗口函数与窗口计算\n\n在上一章中，你了解了如何使用分析窗口函数来处理列式数据。你学会了创造性地使用行号、计算累计运行平均值，甚至根据分析表达式的结果进行聚合运算。为了便于参考，清单\
  \ 13-1 来自第 12 章。回顾一下，窗口函数通过为所有行添加一个新列来转换输入数据集，该列代表特定分析函数的结果。例如，你曾使用这些函数计算累计运行总和。\n\
  \n```\ndf.withColumn(\"running_total\"),\nsum($\"num_items\").over(Window\n.partitionBy(\"\
  store_id\",\"date\",\"hour\")\n.orderBy(asc(\"timestamp\"))))\n清单 13-1\n第 12 章清单\
  \ 12-32 中的列式窗口函数\n```\n\n窗口计算是一种列式分组技术，它与分析窗口函数有一些共通之处，但在底层实现上有所不同。虽然两者名称相同（窗口），并且都致力于根据条件边界对数据集进行分区，但它们有一个核心区别。主要区别在于，窗口表达式是作为参数传递给\
  \ `groupBy` 操作符，以增强分组操作符的能力。现在，数据将根据数据集中的一个通用时间戳列（`TimestampType`）自动划分到基于时间的桶中。\n\
  \n让我们来看看实际运行中的窗口计算。清单 13-2 创建了一个*滚动*窗口聚合。每个窗口都有一个包含性起始时间和一个排他性结束时间。这意味着数据将根据特定的时间边界进行分割，就像传送带上移动的盒子一样，在向传送带末端移动的过程中被填满。清单\
  \ 13-2 中的示例可以直接在 `spark-shell` 或 Zeppelin 笔记本中运行。\n\n```\nimport spark.implicits._\n\
  import org.apache.spark.sql.functions.{col, window}\nspark\n.sql(\"SELECT timestamp('2021-09-25\
  \ 10:00:00' as ts, 200 as total, 'storeA' as storeId\")\n.groupBy($\"storeId\",\
  \ window($\"ts\",\"30 minutes\"))\n.sum(\"total\")\n.select(\n$\"storeId\", $\"\
  window.start\".as(\"start\"),\n$\"window.end\".as(\"end\"), $\"sum(total)\".as(\"\
  total\"))\n.show(truncate=false)\n清单 13-2\n使用窗口函数作为分组列来自动创建窗口聚合\n```\n\n清单 13-2\
  \ 中的聚合按 `storeId` 分组，并借助事件数据的时间戳列 (`ts`) 和*窗口表达式*自动聚合到 30 分钟的窗口中。\n\n下面展示了窗口聚合的参考输出结果。对于每个互斥的\
  \ 30 分钟窗口，订单总额会根据不同 `storeId` 的总数进行累加。\n\n```\n+-------+-------------------+-------------------+-----+\n\
  |storeId|start              |end                |total|\n+-------+-------------------+-------------------+-----+\n\
  |storeA |2021-09-25 10:00:00|2021-09-25 10:30:00|200  |\n|storeB |2021-09-25 10:00:00|2021-09-25\
  \ 10:30:00|120  |\n|storeA |2021-09-25 10:30:00|2021-09-25 11:00:00|350  |\n|storeB\
  \ |2021-09-25 10:30:00|2021-09-25 11:00:00|220  |\n+-------+-------------------+-------------------+-----+\n\
  ```\n\n清单 13-2 中使用的 `window` 函数是一个列式表达式，它将一个时间戳列转换成一个派生列，用于 `groupBy` 操作中。这使我们能够自动将数据落入特定的基于时间的数据桶中进行聚合。\n\
  \n## 使用 `window` 函数\n\n`window` 函数增强了 `RelationalGroupedDataset` 操作符的工作方式，支持通过使用*滚动*、*滑动*和*延迟*窗口功能，自动进行基于时间聚合的数据分桶。\n\
  \n*来自 `org.apache.spark.sql.functions` 包的 `window` 函数*\n\n\n\n```scala\ndef window(\n\
  \  timeColumn: Column,\n  windowDuration: String,\n  slideDuration: String,\n  startTime:\
  \ String): Column = {\n  withExpr {\n    TimeWindow(timeColumn.expr, windowDuration,\
  \ slideDuration, startTime)\n  }\n}.as(\"window\")\n```\n\n该函数接受四个参数（`timeColumn`、`windowDuration`、`slideDuration`\
  \ 和 `startTime`），为你提供了在时间维度上滑动和切分数据的新方法。之前你已经了解了滚动窗口，现在让我们来看一下滑动窗口和延迟窗口。\n\n## 滑动窗口\n\
  \n`window` 函数的 `slideDuration` 参数支持创建滑动窗口。滑动窗口本质上是按特定增量（例如每 15 分钟评估一次 30 分钟窗口）计算的、相互重叠的基于时间的窗口。与滚动窗口不同，每一行数据可以同时属于多个重叠的窗口。\n\
  \n例如，将示例 13-2 中的 `groupBy` 窗口表达式改为包含 15 分钟的滑动间隔，你将创建两个基于时间的桶，而非一个。\n\n```scala\n\
  groupBy($\"storeId\", window($\"ts\",\"30 minutes\", \"15 minutes\"))\n```\n\n现在，单个输入行将产生两行聚合结果，而非一行。\n\
  \n```\n+-------+-------------------+-------------------+-----+\n|storeId|start \
  \             |end                |total|\n+-------+-------------------+-------------------+-----+\n\
  |storeA |2021-09-25 09:45:00|2021-09-25 10:15:00|200  |\n|storeA |2021-09-25 10:00:00|2021-09-25\
  \ 10:30:00|200  |\n+-------+-------------------+-------------------+-----+\n```\n\
  \n由于输入行的时间戳是 `10:00:00`，该数据落入了两个重叠的 30 分钟滑动窗口中。第一个窗口从 `09:45` 开始，到 `10:15` 结束。第二个窗口从\
  \ `10:00` 开始，到 `10:30` 结束。这也被称为*交错*窗口。\n\n## 延迟窗口\n\n窗口的 `startTime` 参数允许你延迟计算派生窗口。将示例\
  \ 13-2 中的 `groupBy` 改为以下形式。\n\n```scala\n.groupBy($\"storeId\",\n  window($\"ts\"\
  ,\"30 minutes\", \"15 minutes\", \"5 minutes\"))\n```\n\n这将每次聚合的起始偏移量推迟了五分钟，然后每\
  \ 15 分钟创建一个滑动窗口。\n\n```\n+-------+-------------------+-------------------+-----+\n\
  |storeId|start              |end                |total|\n+-------+-------------------+-------------------+-----+\n\
  |storeA |2021-09-25 09:35:00|2021-09-25 10:05:00|200  |\n|storeA |2021-09-25 09:50:00|2021-09-25\
  \ 10:20:00|200  |\n+-------+-------------------+-------------------+-----+\n```\n\
  \n现在你已经理解了*窗口化*的机制，接下来我们看一个更完整的示例。\n\n## 窗口化与输出控制\n\n既然你已经了解了窗口化过程的工作原理，合乎逻辑的下一步就是考察如何将此技术应用于流式数据集。考虑到流式数据的无界特性，了解那些告知\
  \ Apache Spark 聚合操作何时完成的控制过程也同样明智。\n\n例如，假设你需要创建一个流式应用程序，该程序持续摄取 `CoffeeOrder` 数据，每\
  \ 30 分钟计算一次滚动店铺性能指标。示例 13-3 建立了 `StreamingQuery` 的基本模块。你创建了一个 `DataStreamReader`（Redis），它通过\
  \ `groupBy` + `agg` 聚合店铺（`storeId`）的性能，聚合指标包括订单总数（`count`）、售出商品总数（`sum`）、总收入（基于订单成本的\
  \ `sum`）以及窗口内平均售出商品数（`average`）。\n\n```scala\nspark\n  .readStream\n  .format(\"\
  redis\")\n  ...\n  .groupBy($\"storeId\", window($\"timestamp\", \"30 minutes\"\
  ))\n  .agg(\n    count($\"orderId\") as \"totalOrders\",\n    sum($\"numItems\"\
  ) as \"totalItems\",\n    sum($\"price\") as \"totalRevenue\",\n    avg($\"numItems\"\
  ) as \"averageNumItems\"\n  )\n  .writeStream\n  ...\n  .start()\n// 示例 13-3\n//\
  \ 创建有状态的流式聚合\n```\n\n将这个示例视为有状态聚合应用的蓝图。数据从 Redis（第 10 章）流入，然后你将输入流数据转换为分组聚合（第 12\
  \ 章）。分组集现在也通过本章所学的窗口化技术得到了增强。\n\n基本上，创建这个流式应用所需的大部分要素都已就绪，除了*两个至关重要的缺失部分*——它们控制着\
  \ Spark 如何输出这些窗口聚合结果。首先，`DataStreamWriter`（`writeStream`）上缺少一个输出模式（output mode），该模式定义了聚合后的窗口数据将如何向下游发送；其次，没有告知\
  \ Spark 何时停止聚合数据的处理的方法（即水印）。没有输出模式和水印，Spark 无法定义传送带的终点，你的滚动窗口将一直在内存中运行，直到内存耗尽。\n\
  \n现在，我们来看这两个重要的过程。\n\n## 流式输出模式\n\n结构化流应用的输出行为由流式 sink（`DataStreamWriter`）上的输出模式设置控制。有三种可用的值：`complete`、`update`\
  \ 和 `append`。\n\n### Complete\n\n每次有更新时，流式 DataFrame/dataset 中的所有行都会被写入 sink。此模式通常用于本地运行测试，配合\
  \ `ConsoleSink`（在第 10 章中介绍）或 `MemorySink` 使用，你将在本章末尾了解更多关于 `MemorySink` 的信息。\n\n\
  ### Update\n\n只有被更新的行才会被写入 sink。如果查询不包含任何聚合，`update` 模式的行为类似于 append。当编写新的流式聚合时，能够看到每个批次在与先前状态合并（更新）后的最终结果会很有帮助。或者对于需要将每个重大更新（对数据集）向下游发送的系统，你可以使用此操作模式，在记录发生变更时发送其多个版本。\n\
  \n### Append\n\n只有新行会被写入 sink。此模式与结构化流基于状态的检查点、预写日志以及阶段级提交协同工作。具体到有状态聚合，`append`\
  \ 模式控制着关于流式聚合何时被认为完成、并可以有效地向下游发送的精确一次语义（当数据从基于状态的传送带上滚落到下游 sink 时）。\n\n\n\n####\
  \ 追加输出模式\n\n修改清单 13-3 中的示例代码，我们可以增强 `writeStream` 以使用仅追加模式。\n\n```\n.writeStream\n\
  .format(\"parquet\")\n.options(...)\n.outputMode(OutputMode.Append)\n.start()\n\
  ```\n\n现在，流聚合仅在每次聚合完成后才输出数据。但 Spark 如何判断聚合何时完成？如果你使用输出模式 `Append` 运行这段代码，将会看到以下异常抛出。\n\
  \n```\norg.apache.spark.sql.AnalysisException: Append output mode not supported\
  \ when there are streaming aggregations on streaming DataFrames/DataSets without\
  \ watermark;\n```\n\n水印到底是什么？\n\n#### 结账与水印\n\n数据行业中有一个概念叫做“结账”。鉴于流式数据只有在有限的时间窗口内才被视为*新鲜*并可被处理，因此存在一个阈值（水印）。在该阈值内，处理事件流的应用程序（Spark\
  \ Structured Streaming 或其他）可以接收并处理新数据，之后则停止处理并丢弃（或忽略）任何延迟到达的数据。水印处理过程也被称为“关账”，因为它是系统输出最终处理状态（针对窗口聚合）并发送聚合结果以供下游进一步处理、写入可靠存储、分布式表或其他位置的时间点。\n\
  \n水印过程如图 13-2 所示。从概念上讲，如果你考虑到正在接收和处理无界数据流，那么对于每个微批次，Spark 引擎将根据时间戳列计算最小值、最大值、平均值和水印值。在生成统计信息时，会考虑聚合的整个状态的汇总统计信息，并且每个新的微批次会在决定丢弃被视为延迟的数据之前，先考虑水印阈值。\n\
  \n![](img/505711_1_En_13_Fig2_HTML.png)\n\n图 13-2\n\n水印过程可以被视为创建一种基于时间的统计边界的方法。接收到的新事件数据如果小于当前水印（延迟数据），则会根据窗口间隔加上水印间隔被丢弃。\n\
  \n例如，用于近实时监控分布式系统的现有进程不能等待延迟数据，而必须依据可用数据所定义的*可用视图*来采取行动。由于流系统处理来自许多分布式上游进程的数据，数据可能会像人们在排队点单或取咖啡时被拦住一样，或者在日常通勤中因随机交通模式而受阻。\n\
  \n指标数据通常在几秒内（在源系统/物理服务器等上）聚合，并以 5-10 秒的间隔发出以供处理。然后，每个单独的聚合与其他数据合并和连接，以计算分布式系统的统计视图。鉴于告警系统使用规则来确定何时以及如何向团队告警或向另一个自治系统发送事件，水印使这些系统能够忽略那些不再相关且可能触发误报的数据（例如，由于网络故障或其他问题而导致数据延迟\
  \ 30 分钟才出现的情况）。\n\n### 流式数据的水印\n\n你刚刚了解了结账和水印。我们生活在一个充满规则和法规的世界中，Spark 亦是如此。为了使我们的流聚合能够正确地发出新的*翻滚窗口*聚合结果，我们需要使用与数据集中物理时间戳直接关联的水印（清单\
  \ 13-4）来标记我们自己的结账点。\n\nSpark 将忽略延迟数据（基于预定义的时间戳列），自动将其丢弃。在许多使用案例中，丢弃延迟数据是可用的最佳选择，而不是创建一个新的桶来聚合可能只有少量延迟记录的数据，但更糟糕的是，延迟数据可能会破坏\
  \ Spark 的 `append` 输出模式的*精确一次语义*。\n\n让我们看看如何将水印添加到清单 13-3 的示例中。我们将水印添加到输入流中，清单 13-4\
  \ 展示了如何向 Redis 输入流添加一个 30 分钟的水印。\n\n```scala\nspark\n.readStream\n.format(\"redis\"\
  )\n...\n.withWatermark(\"timestamp\", \"30 minutes\")\n.groupBy($\"storeId\", window($\"\
  timestamp\", \"30 minutes\"))\n...\n```\n\n清单 13-4 将有状态聚合示例应用水印\n\nSpark 利用水印（30\
  \ 分钟）和翻滚窗口（30 分钟）之间的关系，以精确一次语义控制 `append` 输出模式过程。本质上，结账将在第一个事件到达后的一小时（30 分钟窗口 +\
  \ 30 分钟水印）发生，从而建立聚合桶。\n\n接下来，让我们将刚刚涵盖的理论概念与窗口技术相结合，在练习 13-1 中完成一个完整的端到端有状态流聚合应用程序。\n\
  \n## 章节练习概览\n\n本章的练习重用了前面章节中的 `CoffeeOrder` 事件。你将学习读取订单流并生成店铺收入聚合结果，这些聚合结果本质上是跨可变长度窗口（示例中为五分钟）的店铺绩效数据。\n\
  \n将无界的 `CoffeeOrders` 流读入应用程序后，你将学习将此输入数据集转换为可以随时间聚合的格式。这将产生一个表示翻滚窗口聚合结果的新数据集。\n\
  \n### 输入数据格式 (CoffeeOrder)\n\n```\n+-------------+-------+-------+----------+--------+-----+\n\
  |    timestamp|orderId|storeId|customerId|numItems|price|\n+-------------+-------+-------+----------+--------+-----+\n\
  |1632549600000| order1| storeA|     custA|       2| 9.99|\n|1632549660000| order2|\
  \ storeA|     custB|       1| 4.99|\n|1632549720000| order3| storeA|     custC|\
  \       3|14.99|\n|1632549730000| order4| storeB|     custD|       1| 3.99|\n|1632549740000|\
  \ order5| storeA|     custE|       2| 6.99|\n+-------------+-------+-------+----------+--------+-----+\n\
  ```\n\n### 输出的窗口化店铺收入聚合结果\n\n```\n+--------+---------------+------+---+-------+-------+-------+\n\
  |store_id|         window|orders|its|revenue|p95_its|avg_its|\n+--------+---------------+------+---+-------+-------+-------+\n\
  |  storeA|{2021-... 06:00|     4|  8|  36.96|      3|    2.0|\n|  storeB|{2021-...\
  \ 06:00|     4|  7|  29.96|      3|   1.75|\n|  storeA|{2021-... 06:05|     2| \
  \ 4|   9.98|      2|    2.0|\n|  storeB|{2021-... 06:05|     1|  1|   3.99|    \
