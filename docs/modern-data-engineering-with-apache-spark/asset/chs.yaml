  \n![](img/505711_1_En_14_Fig2_HTML.png)\n\n图 14-2\n\n以客户端模式运行的 Spark Driver 应用\n\
  \n将 Driver 运行在 Spark 集群之外有许多原因。其中最主要的三点原因是：\n\n- 保护您的 Spark 应用并将其与集群内“吵闹的邻居”或其他不良行为造成的干扰隔离开来。\n\
