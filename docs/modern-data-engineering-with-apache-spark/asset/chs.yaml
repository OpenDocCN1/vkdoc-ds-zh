  ### 环境搭建


  再次重申，我们将依赖老伙计 Apache Zeppelin，不过这次你将构建一个名为 `zeppelin-spark` 的 Zeppelin 容器。你可能会想，为什么需要创建一个不同的容器呢？很高兴你能这么问。


  在整本书中，你一直需要使用*卷挂载*和*环境变量*，在运行时将本地 Apache Spark 接入 Zeppelin 容器。在第 10 章中，你应该还记得，我们迁移到了使用基础的
  Spark 容器来构建一致的容器化 Spark 应用程序。鉴于本地数据平台的复杂性日益增加，并且要确保应用程序在运行时拥有一致的环境，这一步是必要的。到目前为止，Zeppelin
  要求你自带 Spark，但这个新容器将把官方 Zeppelin 容器与你过去几章一直在使用的基础 Spark 容器结合起来。


  *Zeppelin-Spark 目录布局和容器依赖*


  ```

  ch-12

  ├── docker

  │   ├── README.md

  │   └── zeppelin-spark

  │       ├── Dockerfile

  │       ├── conf

  │       │   ├── interpreter.json

  │       │   └── zeppelin-env.sh

