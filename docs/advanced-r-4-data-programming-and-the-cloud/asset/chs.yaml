  \n```\n## [1] TRUE\n```\n\n在此阶段，有必要稍微提一下数据结构间的“战争”。\n\n从历史上看，许多研究人员使用的主要数据结构是数据框，用于组织行/列或*表格*类型的数据。随着数据在列宽和行数上的增长，R\
  \ 语言的基础结构已无法满足所有人的需求。`data.table` 包/库源于与一些大型数据库相同的 SQL 数据控制思维，如今已能适应多核处理器和高效的内存操作，并在底层使用了比\
  \ R 更高效的语言。对于大型数据集以及有 SQL 或其他编程语言背景的人来说，数据表非常高效且直观。并非所有初学 R 的人都有编程背景（这其实是一件好事）。另一种竞争性的数据结构——*tibble*，是所谓\
