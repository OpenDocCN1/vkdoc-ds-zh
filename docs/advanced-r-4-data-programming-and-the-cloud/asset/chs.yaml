  ##     0     1     2     3     4     5     6     7     8 \n## 77432 17068  4630\
  \  2018   820   278    84    20     3\n```\n\n我们计算每个受访者缺失响应的数量，选择缺失数量等于总变量数的行，并将这些行设置为缺失。再次注意，当替换\
  \ `data.table` 中变量的一个子集值时，缺失值的类型应与变量的类型匹配（例如，整数型用 `NA_integer_`，数值型用 `NA_real_`，字符型用\
