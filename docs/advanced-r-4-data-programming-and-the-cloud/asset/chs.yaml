  \ IT 专业人士或至少是一位 IT 高级用户合作。\n\n## 第 14 章 Shiny 仪表板示例\n\n最后，我们希望您和我们一样喜欢本章及其成果。请务必探索“总结”部分中的链接。您将找到有价值的信息，包括额外函数、一整套图标、第二个完整的图标库，以及关于\
  \ `shiny` 和 `shinydashboard` 包的最新信息。这些包更新相当频繁，新功能通常能带来令人惊叹的效果。\n\n### 14.3 完整示例代码\n\
  \n在查看以下代码时，请记住将其与您在本章前面学到的内容进行对比和比较。观察各个小部分如何协同工作以构成一个整体。此外，虽然在本示例中我们将所有代码保留在单个\
  \ `app.R` 文件中，但 `shiny` 的全局、服务器和用户界面部分可以拆分为三个文件（事实上，在 RStudio 中创建新的 *Shiny web app*\
  \ 时，这是可选项之一）。这对于分割更大的仪表板（例如您可能创建的仪表板）非常有帮助：\n\n```r\nlibrary(shiny)\nlibrary(shinydashboard)\n\
  \n# 运行一次代码\nslider_data <- read.csv(\"slider_data.csv\", header = TRUE, sep = \"\
  ,\")\nPhase1 <- slider_data[, 2]\nPhase2 <- slider_data[, 3]\nPhase3 <- slider_data[,\
  \ 4]\nPhase4 <- slider_data[, 5]\nstartYear <- 2013\nendYear <- 2016\n\n# 定义仪表板的\
  \ UI\nui <- dashboardPage(\n  dashboardHeader(title = \"数据编程与云端\"),\n  dashboardSidebar(\n\
  \    sidebarMenu(\n      menuItem(\n        \"饼图！\",\n        tabName = \"PieChart_Time\"\
  ,\n        icon = icon(\"pie-chart\")\n      ),\n      menuItem(\n        \"使用滑块\"\
  ,\n        tabName = \"slider_time\",\n        icon = icon(\"sliders\"),\n     \
  \   badgeLabel = \"新\"\n      ),\n      menuItem(\n        \"上传直方图文件\",\n      \
  \  tabName = \"Upload_hist\",\n        icon = icon(\"bar-chart\"),\n        badgeLabel\
  \ = \"上线\"\n      )\n    ),\n    img(\n      src = \"R4_DataProgandCloud.JPG\",\n\
  \      height = 200,\n      width = 150\n    )\n  ),\n  dashboardBody(tabItems(\n\
  \    # PieChart_Time 内容\n    tabItem(tabName = \"PieChart_Time\",\n      fluidRow(\n\
  \        box(\n          title = \"PieChart_Time\",\n          status = \"warning\"\
  ,\n          numericInput(\n            \"pie\",\n            \"饼图百分比\",\n     \
  \       min = 0,\n            max = 100,\n            value = 50\n          ),\n\
  \          textInput(\n            \"pietext\",\n            \"文本输入\",\n       \
  \     value = \"默认标题\",\n            placeholder = \"在此输入您的标题\"\n          ),\n\
  \          checkboxInput(\"pieChoice\",\n            \"我希望使用饼图。\",\n           \
  \ value = FALSE)\n        ),\n        box(\n          title = \"图形输出\",\n      \
  \    solidHeader = TRUE,\n          status = \"warning\",\n          plotOutput(\"\
  piePlot\")\n        )\n      )),\n    # 滑块选项卡内容\n    tabItem(\n      tabName = \"\
  slider_time\",\n      h2(\"培训项目结果\"),\n      fluidRow(\n        box(\n         \
  \ title = \"控制学年\",\n          status = \"primary\",\n          solidHeader = TRUE,\n\
  \          sliderInput(\n            \"ayear\",\n            \"学年：\",\n        \
  \    min = 2014,\n            max = 2017,\n            value = 2014,\n         \
  \   step = 1,\n            animate = animationOptions(interval = 600, loop = T)\n\
  \          )\n        ),\n        box(plotOutput(\"barPlot\"))\n      ),\n     \
  \ fluidRow(\n        valueBox(\n          endYear - startYear,\n          \"数据年份数\"\
  ,\n          icon = icon(\"band-aid\"),\n          width = 2\n        )\n      )\n\
  \    ),\n    # 根据上传的 CSV 生成直方图\n    tabItem(tabName = \"Upload_hist\",\n      fluidRow(\n\
  \        box(title = \"文件输入\",\n          # 复制下面一行以创建文件上传管理器\n          fileInput(\n\
  \            \"file\",\n            label = h3(\"直方图数据文件输入\"),\n            multiple\
  \ = FALSE\n          )),\n        box(\n          title = \"来自文件输入的数据\",\n     \
  \     collapsible = TRUE,\n          tableOutput(\"tabledf\")\n        )\n     \
  \ ),\n      fluidRow(\n        box(tableOutput(\"tabledf2\")),\n        box(background\
  \ = \"blue\",\n          plotOutput(\"histPlot1\"))\n      ))\n  )),\n  title =\
  \ \"仪表板示例\",\n  skin = \"yellow\"\n)\n\n#################### 定义绘制直方图所需的服务器逻辑\nserver\
  \ <- shinyServer(function(input, output) {\n  output$piePlot <- renderPlot({\n \
  \   # 根据用户输入的 input$pie 生成饼图比例\n    y <- c(input$pie, 100 - input$pie)\n    # 使用指定的比例和标签绘制饼图或条形图\n\
  \    if (input$pieChoice == FALSE) {\n      barplot(y,\n        ylim = c(0, 100),\n\
  \        names.arg = c(input$pietext, paste0(input$pietext, \"的补集\")))\n    } else{\n\
  \      pie(y, labels = c(input$pietext, paste0(input$pietext, \"的补集\")))\n    }\n\
  \  })\n  output$barPlot <- renderPlot({\n    # 统计每个阶段中匹配正确日期的数量。\n    cap <- input$ayear\
  \ * 100\n    x <- c(sum(Phase1 < cap),\n      sum(Phase2 < cap),\n      sum(Phase3\
  \ < cap),\n      sum(Phase4 < cap))\n    # 为正确的年份绘制条形图。\n    barplot(\n      x,\n\
  \      names.arg = c(\"阶段 I\", \"阶段 II\", \"阶段 III\", \"研究员\"),\n      col = c(\"\
  deeppink1\", \"deeppink2\", \"deeppink3\", \"deeppink4\"),\n      ylim = c(0, 50)\n\
  \    )\n  })\n  ####这里是文件输入发生的地方\n  output$tabledf <- renderTable({\n    input$file\n\
  \  })\n  histData <- reactive({\n    file1 <- input$file\n    read.csv(file1$datapath,\
  \ header = TRUE , sep = \",\")\n  })\n  output$tabledf2 <- renderTable({\n    histData()\n\
  \  })\n  output$histPlot1 <- renderPlot({\n    hist(as.numeric(histData()$X1))\n\
  \  })\n  ##############服务器结束####################\n})\n```\n\n\n\n"
