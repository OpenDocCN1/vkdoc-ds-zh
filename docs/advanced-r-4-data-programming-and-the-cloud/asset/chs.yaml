  )\nprint(d)\n```\n\n## x y labels\n## 1 1 1 First\n## 2 3 2 Second\n\n\n\n"
- "# 3 5 4 Third\n\n## 第 5 章 编写类和方法\n\n在 S3 系统中，没有正式的方法来创建特定类的对象。\n\n然而，创建特定类对象最常见的方式是作为函数的输出。可以编写专用函数来创建特定类的对象，也可以编写执行操作并以特定类对象形式输出结果的函数。在\
  \ R 语言中使用 S3 系统时，后一种方法更为典型。\n\n当您创建新类时，所需的某些特征或元素可能已存在于现有类中。如果是这种情况，那么在现有类的基础上进行构建或扩展可能是合理的。例如，数据框是在列表的基础上构建的，要求列表的每个元素都是长度相同的向量。同样，我们之前创建的\
  \ `textplot` 类是在数据框的基础上构建的，需要三个分别名为 `x`、`y` 和 `labels` 的元素。在这种情况下，我们说 `textplot`\
  \ *继承* 自 `data.frame`。也就是说，`textplot` 是父类 `data.frame` 的子类（注意，父类也被称为*超类*或*基类*）。\n\
  \n如果一个类仅继承自另一个类，则称为单继承（即只有一个父类）。如果一个类继承自多个类，则称为多继承（即拥有多个父类）。如果一个类继承自另一个类，它可能继承数据的存储特征，也可能继承方法，即对特定类对象进行操作的函数。继承方法对于避免重复工作尤其有用。\n\
  \n**注意**：继承是指在现有类的特征和方法基础上创建新类。新类称为子类，而派生新类的类称为父类或超类。\n\n子类既可以继承父类的特征，也可以使用父类的方法。\n\
  \n在下一个示例中，我们编写一个函数，利用公式接口从数据框构建一个 `textplot` 对象。该函数有两个参数：一个名为 `f` 的公式，以及一个名为 `d`\
  \ 的数据。代码的第一部分使用第 4 章介绍的 `stopifnot()` 函数来检查传递给函数的对象类是否与预期相符。为了测试类，我们使用 `inherits()`\
  \ 函数，该函数评估特定对象是否属于指定类，或是否继承自指定类。例如，我们的 `textplot` 类其次是一个 `data.frame`，因此使用 `inherits(object,\
  \ \"data.frame\")` 进行测试会返回 `TRUE`。当我们构建 S4 类时，会看到更正式的类继承定义和系统。函数的下一部分按顺序从指定的数据框中获取公式中的所有变量，重命名列，应用我们的\
  \ `textplot` 类，并返回该对象：\n\n```r\ntextplot_data <- function(f, d) {\n  stopifnot(inherits(d,\
  \ \"data.frame\"))\n  stopifnot(inherits(f, \"formula\"))\n  newdata <- get_all_vars(formula\
  \ = f, data = d)\n  colnames(newdata) <- c(\"y\", \"x\", \"labels\")\n  class(newdata)\
  \ <- c(\"textplot\", \"data.frame\")\n  return(newdata)\n}\n\ntextplot_data(f =\
  \ mpg ~ hp | cyl, d = mtcars[1:10, ])\n##                    y  x labels\n## Mazda\
  \ RX4         21 110      6\n## Mazda RX4 Wag     21 110      6\n## Datsun 710 \
  \       23  93      4\n## Hornet 4 Drive    21 110      6\n## Hornet Sportabout\
  \ 19 175      8\n## Valiant           18 105      6\n## Duster 360        14 245\
  \      8\n## Merc 240D         24  62      4\n## Merc 230          23  95      4\n\
  ## Merc 280          19 123      6\n```\n\n这些示例展示了使用 S3 系统创建类是多么容易。接下来，我们将探讨如何为现有类或新类编写方法。\n\
  \n### S3 方法\n\n方法是可以对特定类对象执行的函数或操作。\n\n即使您不编写自己的类，也可以编写自己的方法。编写 S3 方法就像我们在第 4 章中编写函数一样。唯一的区别是\
  \ S3 方法有特殊的命名约定，并且需要一个供用户使用的泛型函数，该函数负责将调用分派到适当的方法。\n\n**注意**：S3 方法是遵循特定命名约定的常规 R\
  \ 函数：`FunctionVerb.classname()`。用户调用泛型函数 `FunctionVerb()`，该函数根据作为参数传入的对象的类，将调用分派到适当的方法。如果不存在泛型函数，则必须编写一个包含对\
  \ `UseMethods()` 调用的泛型函数，后者处理实际的方法分派。\n\n首先，我们为我们开发的 `textplot` 对象类编写一个简单的绘图方法。为了创建\
  \ S3 绘图方法，我们使用函数动词 `plot`，后跟类名 `textplot`，在本例中即为 `plot.textplot()`。只要我们的函数以此方式命名，并且存在一个泛型\
  \ `plot()` 函数（我们稍后将讨论此主题），它就能作为 S3 方法工作。\n\n我们的绘图函数如下代码所示。调用 `par()` 函数来调整图形的默认边距，以减少图形顶部和右侧的多余空白区域。结果存储在对象\
  \ `op` 中，因为它保存了原始的图形参数。然后，在函数退出时，可以通过调用 `par(op)` 来恢复用户原始的图形参数状态，这是您在第 4 章中学到的函数。接下来，我们通过调用\
  \ `plot.new()` 创建一个新的绘图区域，并通过调用 `plot.window()` 来设置新绘图的尺寸，其 `x` 和 `y` 的限制由数据的 `range`\
  \ 决定。\n\n然后，我们使用 `text()` 函数绘制标签，该函数接收坐标和标签。最后，我们在底部（`side = 1`）和左侧（`side = 2`）添加坐标轴。原始的\
  \ `textplot` 数据对象在函数末尾以不可见的方式返回：\n\n```r\n#### S3 System - Methods ####\n\nplot.textplot\
  \ <- function(d) {\n  ## adjust the margins through a call to the\n  ## graphical\
  \ parameters, and store old parameters in op\n  op <- par(mar = c(4, 4, 1, 1))\n\
  \  ## ensure graphing parameters restored to what\n  ## they were when function\
  \ completes\n  on.exit(par(op))\n  ## create a new plot area\n  plot.new()\n  ##\
  \ size the plot appropriate for the data\n  plot.window(xlim = range(d$x, na.rm\
  \ = TRUE),\n              ylim = range(d$y, na.rm = TRUE))\n  ## add the text to\
  \ the plot\n  text(d$x, d$y, labels = d$labels)\n  ## create some axes to show the\
  \ limits of the data\n  axis(side = 1, range(d$x, na.rm = TRUE))\n  axis(side =\
  \ 2, range(d$y, na.rm = TRUE))\n}\n```\n\n\n\n## 隐式返回对象`invisible(d)`\n\n接下来，我们需要生成一些数据并用`plot()`绘图。注意，由于这是一种方法，我们无需通过完整的函数名称`plot.textplot()`来调用它，只需直接调用`plot()`，R\
  \ 便会根据对象类`textplot`自动将数据对象分派到正确的方法。结果如图 5-1 所示，代码如下：\n\n```\ndat <- textplot_data(f\
  \ = mpg ~ hp | cyl, d = mtcars[1:10, ])\nplot(dat)\n```\n\n此示例展示了使用 S3 系统是多么简单。几乎不需要特殊函数或额外的工作。只需按照你的意愿创建一个常规的\
  \ R 对象，添加自定义类标签，编写一个函数，并为其指定一个特殊的名称即可。这基本上就是所有需要做的。不过，S3 方法确实有一些特殊的函数和工具。首先，我们来看看查看`plot()`的源代码时会发生什么。这个泛型函数只包含三个参数。\n\
  \n**第 5 章 编写类和方法**\n\n.424 4\n\n.314\n\n***图 5-1.** 在特定坐标上绘制文本标签，演示了为自定义类使用自定义方法*\n\
  \n函数体仅包含对`UseMethod()`的调用，该调用告诉 R 检查参数类并分派到合适的方法。如果你在编写方法，而泛型函数尚不存在，那么你也需要编写该泛型函数。\n\
  \n在 S3 系统中编写泛型函数是一项直接的任务，只需要考虑包含默认参数即可：\n\n```\nplot\n```\n\n## [1] 5\n\n要查看可用的方法，我们使用`methods()`函数。结果显示`plot()`有许多特定方法可用，包括我们新编写的`plot.textplot`：\n\
  \n```\nmethods(plot)\n```\n\n## [1] plot,ANY-method plot,color-method\n## [3] plot.aareg*\
