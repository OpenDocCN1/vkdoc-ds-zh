  \    3    6\n```\n\n```\nis.vector(x2)\n## [1] FALSE\n```\n\n```\nis.matrix(x2)\n\
  ## [1] TRUE\n```\n\n访问和子集化列表可能稍微复杂一些，但对于后续技术而言，学习和掌握它却更为重要。单个方括号中的单个索引会返回该位置处的整个元素（回顾一下：对于列表，每个元素可能是一个向量或只是一个单独的对象）。使用双括号会返回该列表元素内部的对象——仅此而已。\n\
  \n因此，以下代码实际上是一个包含元素 `a` 的向量。再次强调，使用数据类型检查函数有助于学习如何解释各种代码片段：\n\n```\n## 对于列表，使用单个方括号\n\
  ## 返回一个包含一个元素的列表\ny <- list(\n  c(\"a\"),\n  c(1:3))\ny[1]\n## [[1]]\n## [1] \"\
  a\"\n```\n\n```\nis.vector(y[1])\n## [1] TRUE\n```\n\n```\nis.list(y[1])\n## [1]\
  \ TRUE\n```\n\n```\nis.character(y[1])\n## [1] FALSE\n```\n\n将其与以下代码进行对比，后者只是元素\
  \ `a`：\n\n```\n## 使用双括号返回该列表元素内部的对象，\n## 仅此而已\ny[[1]]\n## [1] \"a\"\n```\n\n```\n\
  is.vector(y[[1]])\n## [1] TRUE\n```\n\n```\nis.list(y[[1]])\n## [1] FALSE\n```\n\
  \n```\nis.character(y[[1]])\n## [1] TRUE\n```\n\n实际上，你可以将方括号链接起来使用，因此可以访问列表的第二个元素（一个包含数字\
  \ 1–3 的向量），然后在该向量内部访问第三个元素：\n\n```\n## 可以链接方括号\ny[[2]][3] ## 列表的第二个元素，向量的第三个元素\n\
  ## [1] 3\n```\n\n方括号几乎总是有效，具体取决于对象的类型，但可能还有其他访问组件的方式。具有名称的数据框和列表可以使用 `$` 运算符。请注意在以下代码中方括号或美元符号最终是如何等效的：\n\
  \n```\nx3 <- data.frame(\n  A = 1:3,\n  B = 4:6)\ny2 <- list(\n  C = c(\"a\"),\n\
  \  D = c(1, 2, 3))\n```\n\n```\nx3$A\n## [1] 1 2 3\n```\n\n```\ny2$C\n## [1] \"\
  a\"\n```\n\n```\n## 这些等效于\nx3[[\"A\"]]\n## [1] 1 2 3\n```\n\n```\ny2[[\"C\"]]\n\
  ## [1] \"a\"\n```\n\n请注意，虽然数据框和列表都是列表，但它们都不是矩阵：\n\n```\nis.list(x3)\n## [1] TRUE\n\
  ```\n\n```\nis.list(y2)\n## [1] TRUE\n```\n\n```\nis.matrix(x3)\n## [1] FALSE\n\
  ```\n\n```\nis.matrix(y2)\n## [1] FALSE\n```\n\n此外，尽管不是矩阵，但由于其特殊的性质（即所有元素长度相等），数据框和数据表可以类似矩阵那样进行索引：\n\
  \n```\nx3[1, 1]\n## [1] 1\n```\n\n```\nx3[1, ]\n##   A B\n## 1 1 4\n```\n\n```\n\
  x3[, 1]\n## [1] 1 2 3\n```\n\n任何具有名称的对象都可以使用名称而不是位置编号来进行索引，前提是这些名称已被设置：\n\n```\n\
  x3[1, \"A\"]\n## [1] 1\n```\n\n```\nx3[, \"A\"]\n## [1] 1 2 3\n```\n\n对于数据框，这同样适用于列名和行名，并且这些名称可以在构建矩阵后建立：\n\
  \n```\nrownames(x3) <- c(\"first\", \"second\", \"third\")\nx3[\"second\", \"B\"\
  ]\n## [1] 5\n```\n\n数据表使用略有不同的方法。虽然我们将在后面的两章中专门讨论数据表的使用，但现在我们先提几个要点。选择行的方式几乎完全相同，但选择列时不需要引号。此外，您可以使用\
  \ `.()` 运算符按名称选择多个列而无需引号。如果需要使用引号，可以通过使用 `with = FALSE` 选项来访问数据表，如下所示：\n\n```\n\
  x4 <- data.table(\n  A = 1:3,\n  B = 4:6)\n```\n\n```\nx4[1, ]\n##    A B\n## 1:\
  \ 1 4\n```\n\n```\nx4[, A] # 在 data.table 中，列名不需要引号\n## [1] 1 2 3\n```\n\n```\n\
  x4[1, A]\n## [1] 1\n```\n\n```\nx4[1:2, .(A, B)]\n##    A B\n## 1: 1 4\n## 2: 2\
