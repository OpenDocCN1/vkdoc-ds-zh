  ```\n\n```\n'[['(y, 2)\n## [1] 1 2 3\n```\n\n当然，在实际应用中，几乎从不这样使用。之所以需要提及这一点，是为了让你理解可以为任何函数自定义其含义（我们有一章专门讲解如何编写自己的函数）。实际上，从概念上讲，这就是\
