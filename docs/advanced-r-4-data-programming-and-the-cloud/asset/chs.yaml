- "# `$rsId`\n\n## `list()`\n\n我们刚刚建立的连接将 R 实例链接到了数据库。目前，这个数据库恰好是空的。如果你的角色是分析师，你可能有一个已存满数据的真实数据库。另一方面，你也可能拥有自己的数据，并希望将其迁移到正式的数据库系统中。无论哪种情况，我们都会探讨如何将数据推送到服务器以及从服务器拉取数据。\n\
  \n无论是执行拉取操作还是推送操作，我们需要保持一个活跃的连接处于打开状态。\n\n然而，在我们准备探索这一过程之前，需要简要考虑一些数据库设计理念。因此，现在我们暂时关闭这个连接。这需要两个步骤，因为我们既要断开与\
  \ PostgreSQL 的连接，还要卸载允许 DBI 连接到我们特定类型数据库的驱动程序。如果操作成功，`dbDisconnect()` 和 `dbUnloadDriver()`\
  \ 都会返回 `TRUE`。即使它们返回真值，相关信息仍会保留在*全局环境*中。因此，我们还需要使用 `rm()` 来清理环境：\n\n`dbDisconnect(conSuper)`\n\
  \n## `[1] TRUE`\n\n`dbUnloadDriver(drv)`\n\n\n\n## [1] TRUE\n\n`rm(conSuper)`\n\n\
  `rm(drv)`\n\n如果上述所有步骤均成功执行，你现在已在本地机器上拥有了一个功能完备的 PostgreSQL 数据库服务器。同时，你也具备了将 R 连接至该服务器以及断开连接的能力。在讨论使用\
  \ SQL 和 R 的具体技术之前，我们先简要探讨一下数据库的理论基础。\n\n## 第 10 章 读取大数据\n\n### 10.3 数据库理论基础\n\n\
  虽然本书的宗旨既不是教授通用数据库知识，也不是专门讲解 SQL 数据库，但了解此类数据存储方式的高层概念仍然很有价值。我们使用的数据库 PostgreSQL 属于\
  \ SQL 数据库，它属于*关系型*数据库。其核心理念是：每一组*相关*的数据都应当存放在一个*表*中。现在，让我们思考一下这些表之间的关联方式。\n\n假设有一个你在本科期间可能参与过（或正在设计）的研究项目。项目可能需要参与者的姓名和联系方式。因此，这些信息应当存放在一个\
  \ `ADDRESS` 表（地址表）中。类似地，可能还收集了参与者的某些基本人口统计数据（例如，生理性别、出生日期、社会经济地位、教育水平等）。这些数据可能存放在一个\
  \ `DEMOGRAPHICS` 表（人口统计表）中。\n\n最后，可能还有定期的时序测量数据（例如，一天中不同时间的压力水平或每晚的睡眠时长），这些数据可以存放在\
  \ `TIMEMETRICS` 表（时间度量表）中。\n\n这些表各自相对独立。`ADDRESS` 表包含数字和文本数据；它可能不需要频繁更新。同样，`DEMOGRAPHICS`\
  \ 表中的初始注册信息虽然数据类型略有不同，但主要用来建立基线。相比之下，`TIMEMETRICS` 表中的日常或夜间时序测量数据则可能需要频繁变动。\n\n\
  将这些相关但又不同的数据拆分存储有什么好处呢？为什么不直接存储在一个 CSV 文件中？主要有三个原因：数据大小、保密性和可靠性。\n\n总体而言，大多数操作系统对单个文件的大小都有限制。而\
  \ SQL 数据库（特别是 PostgreSQL）拥有独立的数据存储文件*以及*数据管理进程。因此，PostgreSQL 在硬盘上的大小可以显著增大（例如，可能是\
  \ 1 GB 与 64 TB 之间的差异）。虽然通过多个 CSV 文件也能容纳如此大的数据量，但这些文件的管理需要依靠人工努力，而不是更自动化的数据库方法和标准。\n\
  \n大多数共享文件夹的权限设置数量有限。因此，一个包含 CSV 文件的文件夹通常对所有用户开放相同的访问权限。相比之下，PostgreSQL 可以以定制的方式创建多种角色和用户。因此，某些用户可能只具有对部分数据表的只读权限。在我们的人体受试者研究项目中，这意味着只有首席研究员可以访问\
  \ `ADDRESS` 表，而多个研究人员则可能需要访问 `TIMEMETRICS` 表。\n\n同样，类似于文件大小的问题，并非不存在其他通过文件共享实现的替代方案。更准确地说，问题在于“如果这一切都通过标准协议进行管理，会不会更简单？”\n\
  \n此外，对于某些涉及频繁数据写入或操作的使用场景，并非所有文件都能妥善应对数据移动过程中的故障。PostgreSQL 所实现的数据库标准包含了对断电或写入错误等意外情况的应对措施。按照这些更高标准存储的数据，在面对不理想事件时，存活下来的可能性更高。\n\
  \n那么，获得这三个特性的代价是什么呢？简而言之，每一个独立的表不仅需要包含其所存储的具体原始数据，还必须通过某种连接*键*来存储每一行数据。这个键允许将表 A\
  \ 中的数据与表 B 中的数据进行关联。在我们的示例中，连接各个表的键就是 `UserID`（用户 ID）。\n\n每个表至少需要一个键，在某些情况下，可能需要不止一个键列。以我们示例中的\
  \ `TIMEMETRICS` 表为例，该表就包含多个列共同组成键（作为每行的唯一标识符）。由于每个用户每天有多个度量数据，因此还需要包含 `SurveyDay`（调查日）和可能的\
  \ `SurveyStartTime`（调查开始时间）信息才能唯一标识每一行。\n\n由于每个表都需要一个唯一键，使用数据库的代价就是需要在某种程度上提前规划表结构，以确保整个数据库以正确的方式运行。此外，从多个表访问数据需要通过键将所需表中的数据*连接*起来。这确实为数据获取增加了一层复杂性。话虽如此，大多数大型数据系统都采用这种方法进行存储。\n\
  \n在下一节中，我们将使用本书其中一位作者研究项目中的模拟数据，并用这些信息来填充我们的 PostgreSQL 数据库。这种数据填充遵循了前述的理论基础，旨在作为一个示例或样本，而非一个完整的解决方案。\n\
  \n### 10.4 向 PostgreSQL 添加数据\n\n使用 `JWileymisc` 包中的 `aces_daily` 数据，我们将平面数据拆分为 `ADDRESS`、`DEMOGRAPHICS`、`THRICEDAILYMETRICS`\
  \ 和 `DAILYMETRICS` 表。由于这些数据是基于真实研究的模拟数据，`ADDRESS` 表进一步简化为只有一列，即一个模拟的邮政编码。为了确保你的模拟结果与我们一致，我们使用\
  \ `set.seed(42020)` 来保证数据相同。在本例中，我们实际上不会直接使用这些伪位置数据进行任何分析。我们还将所有表的列名转换为小写。PostgreSQL\
  \ 对变量中的大写字母可能有点挑剔：\n\n```\naces_daily <- as.data.table(aces_daily)\n\nADDRESS <-\
  \ aces_daily[, .(UserID)]\nADDRESS <- unique(ADDRESS)\n\nset.seed(42020)\nADDRESS$PostalCode\
  \ <- round(rnorm(nrow(ADDRESS), mean = 4000, sd = 300), 0) \ncolnames(ADDRESS) <-\
  \ tolower(colnames(ADDRESS))\n\nDEMOGRAPHICS <- aces_daily[, .(UserID, Age, BornAUS,\
  \ SES_1, EDU)]\nDEMOGRAPHICS <- unique(DEMOGRAPHICS)\nDEMOGRAPHICS[, SurrogateID\
  \ := seq_len(.N)]\nDEMOGRAPHICS <- DEMOGRAPHICS[, .(UserID, SurrogateID, Age, BornAUS,\
  \ SES_1, EDU)]\ncolnames(DEMOGRAPHICS) <- tolower(colnames(DEMOGRAPHICS))\n\nTHRICEDAILYMETRICS\
  \ <- aces_daily[, .(UserID, SurveyInteger,\n                                   \
  \  SurveyStartTimec11, STRESS, PosAff, NegAff)]\ncolnames(THRICEDAILYMETRICS) <-\
  \ tolower(colnames(THRICEDAILYMETRICS))\n\nDAILYMETRICS <- aces_daily[, .(UserID,\
  \ SurveyDay,\n                               SOLs, WASONs, SUPPORT,\n          \
  \                     COPEPrb, COPEPrc, COPEExp, COPEDis)]\ncolnames(DAILYMETRICS)\
  \ <- tolower(colnames(DAILYMETRICS))\n\nrm(aces_daily)\n```\n\n现在我们已经有了样本研究数据，是时候将这些数据保存到数据库中了。要建立数据库，我们必须将表保存其中。回想一下数据库的名称（`dbname\
  \ = \"postgres\"`），我们使用超级用户凭证连接数据库：\n\n```\ndrv <- dbDriver(\"PostgreSQL\")\nconSuper\
  \ <- dbConnect(drv, dbname = \"postgres\", host = \"localhost\",\n             \
  \         port = 5432, user = \"postgres\", password = \"advancedr\")\n```\n\n连接激活后，我们使用一个新函数\
  \ `dbWriteTable()` 将我们的四个表推送到 SQL 服务器。为简单起见，我们让 SQL 表的名称与所写入的值保持一致。每写入一个表，都会返回一个布尔值，表明写入是否成功。将四个数据表写入\
  \ SQL 服务器后，我们从本地 R 环境中移除它们。\n\n需要注意的一点是：PostgreSQL 的表名最好全部使用小写。因此，虽然使用这个约定可以更方便地区分表是在\
  \ R 中还是在 PostgreSQL 中，但严格遵守这个约定同样重要。如果你需要在服务器端使用大写表名，也有变通的方法。不过，由于本书主要不是关于 SQL 的，因此简单地遵循这个全小写的约定似乎更简单：\n\
  \n```\ndbWriteTable(conn = conSuper, name = \"address\", value = ADDRESS)\n```\n\
  \n\n\n## 1 TRUE\n\n`dbWriteTable(conn = conSuper, name = \"demographics\", value\
  \ = DEMOGRAPHICS)`\n\n## 1 TRUE\n\n`dbWriteTable(conn = conSuper, name = \"thricedailymetrics\"\
  , value = THRICEDAILYMETRICS)`\n\n## 1 TRUE\n\n`dbWriteTable(conn = conSuper, name\
  \ = \"dailymetrics\", value = DAILYMETRICS)`\n\n## 1 TRUE\n\n`rm(ADDRESS, DEMOGRAPHICS,\
  \ THRICEDAILYMETRICS, DAILYMETRICS)`\n\n要确认写入服务器的表确实已存储在那里，可以使用 `dbListTables()`\
  \ 函数。注意该函数接受的参数是连接到整个数据库的连接（`conSuper`）。除了确认表已上传，这个有用的函数还能帮助我们提醒数据库中包含了哪些表：\n\n\
  `dbListTables(conSuper)`\n\n## 1 \"address\" \"demographics\" \"thricedailymetrics\"\
  \n\n## 4 \"dailymetrics\"\n\n这就是将数据从 R 添加到数据库所需的全部步骤。一次处理一个表，我们可以安全地将信息存储在服务器上。\n\
  \n"
- '# 第 10 章 读取大数据


  ### 10.5 创建具有特定权限的用户


  数据的保密性是我们提到运行数据库的三个好处之一。虽然密码保护访问是保密性的一方面，但保密性不仅仅只有密码。添加一个以上的用户可以为精确信息保护增加一个有用的层级。每个用户只能被授予特定表的特定类型的访问权限。因此，除了移除不再需要任何访问权限的用户之外，还可以微调用户的*权限*以促进数据保密性。


  创建新用户需要*超级*用户的权限。请记住 PostgreSQL 是 SQL 语言生态系统的一部分。因此，除了少数 DBI 特有功能外，更高级或更精细的命令必须使用
  SQL。这些 SQL 代码的通用 DBI 封装器是 `dbGetQuery()`。此函数接受两个参数。第一个是经过身份验证的连接，第二个是包裹在引号中的 SQL
  代码，作为一个文本字符串。该函数既会将文本字符串发送到数据库进行处理，也会收集并将任何生成的输出返回到 R 中。


  为了避免深入讨论 SQL，我们重点分享创建新用户并赋予该用户特定权限的格式。要创建新用户，格式为 `CREATE USER 用户名 WITH PASSWORD
  ''单引号内的文本''`。我们将采用 SQL 惯例：SQL 命令大写，变量小写。


  这里，我们创建三个新的研究生用户来协助我们的研究项目。第一个用户我们只授予*读取*权限（并且只在某个特定表上）。第二个用户将获得*插入*权限（并且只在某个特定表上）。我们的第三个用户能够*更新*和读取一个表。当然，在实际生活中，你可以授予单个用户对任何表组合更多或更少的访问权限。这里，我们将保持用户权限相当简单：


  `dbGetQuery(conSuper, "CREATE USER gradstudentr WITH PASSWORD ''s3cur3''")`


  ## 数据框，0 列 0 行


  `dbGetQuery(conSuper, "CREATE USER gradstudenti WITH PASSWORD ''saf3''")`


  ## 数据框，0 列 0 行


  `dbGetQuery(conSuper, "CREATE USER gradstudentu WITH PASSWORD ''sur3''")`


  ## 数据框，0 列 0 行


  '
- '# 第 10 章 读取大数据


  一旦你创建了一个或多个用户，就该将特定权限 `GRANT`（授予）给特定表上的特定用户。权限或权利选项包括用于只读访问的 `SELECT`，以及用于两种不同写入访问类型的
  `UPDATE` 或 `INSERT`。`INSERT` 授予向现有表中添加新行的能力。`UPDATE` 授予更改表中现有行中值的能力。然而，因为通常只需要更新某些行，`SELECT`
  权限会有所帮助：


  `dbGetQuery(conSuper, "GRANT SELECT ON dailymetrics TO gradstudentr;")`


  ## 数据框，0 列 0 行


  `dbGetQuery(conSuper, "GRANT INSERT ON address TO gradstudenti;")`


  ## 数据框，0 列 0 行


  `dbGetQuery(conSuper, "GRANT SELECT, UPDATE ON address TO gradstudentu;")`


  ## 数据框，0 列 0 行


  关于前面代码中的 SQL 结构，有一种语法需要注意。布局是 `GRANT **权限** ON **表名** TO **用户名**`。SQL 允许使用逗号，`权限`的选项可以是
  `SELECT`、`UPDATE` 或 `INSERT` 的任意组合。


  现在我们有了三个新用户，必须将它们连接到我们的数据库。在实际生活中，在单个 R 实例中，很少（即使有过）会拥有超过一个到同一数据库的连接。相反，每个用户通常代表一个具有不同数据需求/角色的不同人员。请注意在前面的两个代码块中，可以
  `CREATE` 任意用户组合，并且可以在任何表组合上 `GRANT` 任何权限组合。`GRANT` 不是一次性事件——随着时间的推移，用户可能会根据具体情况获得或失去访问权限。在我们大学研究实验室的例子中，新学生可能只有对少数几个表的只读访问权限。随着研究的深入，学生可能需要访问研究的更多领域，甚至在执行自己的工作时需要写入权限。


  话虽如此，用户权限的最佳实践是基于*角色*，而非资历。无论如何，我们将两个新连接命名为 `conRead` 和 `conWrite`。在你继续阅读本节剩余部分时，请仔细注意使用的是*哪个*用户的连接：


  '
