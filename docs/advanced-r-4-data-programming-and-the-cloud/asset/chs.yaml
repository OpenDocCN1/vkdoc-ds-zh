  \ `icon`（图标），尽管默认值是 `NULL`。这些盒子默认颜色为 `aqua`，并且相当短小，默认 `width` 仅为 4。最后，`valueBox()`\
  \ 还接受一个 `href` 值，默认值为 `NULL`。以下是我们示例中的数值框所使用的代码：\n\n```r\nvalueBox(\n  endYear -\
