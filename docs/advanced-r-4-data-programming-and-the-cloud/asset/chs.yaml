- "# 第 5 章 编写类和方法\n\n让一个函数根据传入对象类型的不同而表现不同，这通常很有帮助。例如，在汇总一个变量时，为数值数据或字符串数据创建不同的汇总是有意义的。可以为每种对象类型编写不同的函数，但这样用户就需要记住很多函数名，并且为了保持唯一性，函数名可能会变长。面向对象编程（OOP）基于对象，并通过使用两个概念在\
  \ R 中实现（与大多数编程语言一样）：类和方法。类定义了一个模板或蓝图，描述对象的变量和特性，并确定哪些方法对其适用。例如，一栋房子可以被定义为有地板、四面墙、一个屋顶和一扇门。具体数据代表这些属性，比如每面墙的尺寸和颜色。方法是可以在特定对象类型上执行的行为或动作。例如，房子可以被粉刷，这会改变它的颜色，但房子不能被吃掉。R\
  \ 有三种面向对象系统：S3、S4 和 R5。本章介绍最常用的 S3 和 S4 系统。\n\n在本章中，我们使用 `ggplot2` 包 [25]。以下代码加载\
  \ `ggplot2` 包并设置一些文本显示选项：\n\n```\noptions(width = 70, digits = 2)\nlibrary(ggplot2)\n\
  ```\n\n© Matt Wiley and Joshua F. Wiley 2020  \nM. Wiley and J. F. Wiley, *Advanced\
  \ R 4 Data Programming and the Cloud*，[`doi.org/10.1007/978-1-4842-5973-3_5`](https://doi.org/10.1007/978-1-4842-5973-3_5#DOI)\n\
  \n## 5.1 S3 系统\n\nS3 系统是最常见的面向对象系统。它也是最容易开始使用且最简单的系统。S3 系统易于使用，部分原因是它相当非正式，并且大部分重点放在函数或方法上。这些优点同时也是缺点，因为\
  \ S3 系统没有提供正式的框架来确保对象满足某个类的要求。有关使用 S3 系统进行 R 编程的更深入指南，请参阅 *S Programming*，作者 W.\
  \ N. Venables 和 B. D. Ripley（Springer，2004 年）。\n\n### S3 类\n\n在 R 中，某些类型或类的对象默认可用，几乎所有对象都可以被视为向量或泛型向量。例如，矩阵和数组本质上是带有指示维度属性的向量。列表是泛型向量，其中的每个元素可以包含另一个向量。数据框是列表，其中每个项目都是一个向量，但所有向量的长度相等，因此具有表格格式。向量可以保存特定类型的数据，例如逻辑型、整型、数值型（实数）或字符串。这些基础对象和类由基础包提供。S3\
  \ 类是通过构建在基础包提供的对象和类之上来创建的。\n\n**注意** S3 类是通过使用常规 R 对象（例如向量或列表）和类（例如逻辑型或数值型）来创建的。S3\
  \ 类通过 `class(object) <- \"class name\"` 设置类名来定义。S3 对象的元素通常使用 `$`、`[` 或 `[[` 来访问。\n\
  \n实际创建 S3 类很简单。首先，创建一个满足类要求或特性的 R 对象，然后通过用类名标记该对象来定义 S3 类。因为 S3 类与其他 R 对象的区别仅在于具有特殊的名称或属性，所以它们可以像其他基础\
  \ R 对象一样，使用 `$`、`[` 或 `[[` 进行访问和操作。要检查对象的类，我们可以使用 `class()` 函数。在以下示例中，查询 `mtcars`\
  \ 对象以确定它具有 `data.frame` 类：\n\n\n\n"
