  设置，并将 *Auto-assign Public IP* 设置为 *Enable*。


  虽然你始终可以选择 *Review and Launch*，但我们暂时继续通过向导操作，选择 *Next*。截至撰写本文时，最多可免费使用 30 GiB。直接给自己分配
  30 GiB。对于标签，一个好名字仍然是 `AdvancedR`（诚然，这个名字有点用得太频繁了，但它仍然有效）。另外，对于*安全组*，请务必在最终点击 *Review
