- "# 第 13 章：每朵云都有一层闪亮的内衬\n\n当向公众提供数据时，便捷的访问和交互式信息能显著提升理解效果。在本章中，我们的目标是为一个较新的应用程序——Shiny\
  \ [6]——提供访问途径和一些有趣的使用方法。\n\nShiny 是 R 的一个 Web 应用程序框架。它的作用是让信息消费者能够与 R 中的实时数据和分析进行交互。该框架不需要任何\
  \ Web 语言的知识。尽管如此，你仍可以发布异常复杂且交互式的数据模型给你的客户、决策者或消费者。\n\n你是否有数据需要客户探索？是否有将静态指标转换为动态后能更好地辅助你向董事会或老板汇报的绩效指标？你的用户是否需要上传数据并更好地理解它们？你是否希望轻松地将下一季度的数据更新到一个通用的仪表板中？所有这些问题都可以通过\
  \ Shiny Server 得到解答。如果我们可以将 Shiny 部署到云端，那么任何人都能从 R 的强大功能中受益。\n\n现在，为了简洁起见，本章我们几乎完全在\
  \ Windows 操作系统内的 RStudio 中进行操作。在最后，我们将一些独立的 Shiny 应用程序托管到我们的服务器上。在下一章中，我们将把本章中的所有构建块整合到一个由云端托管的仪表板中。\n\
  \n你需要确保本地计算机上安装了 Shiny [6]，如有需要可使用 `install.packages(\"shiny\")` 命令：\n\n```\noptions(width\
  \ = 70, digits = 2)\nlibrary(knitr)\nlibrary(shiny)\n```\n\n© Matt Wiley 和 Joshua\
  \ F. Wiley 2020  \nM. Wiley 和 J. F. Wiley, *Advanced R 4 Data Programming and the\
  \ Cloud*,  \n<https://doi.org/10.1007/978-1-4842-5973-3_13>\n\n### 13.1 Shiny 基础\n\
  \n可以把 Shiny 看作是 R 代码的一个 Web 界面。只要你能用 R 实现，Shiny 就能将这些结果推送到一个漂亮的、可以通过互联网浏览器查看的页面上。更酷的是，如果数据消费者想要与信息进行交互，他们的*输入*可以被整合到\
  \ R 代码中。\n\n在 RStudio 中，选择 *文件*、*新建文件*、*Shiny Web 应用程序*。将文件命名为 `PieChart_Time`，并在“应用程序”下选择单个文件选项（`app.R`）。删除所有代码并输入以下代码（或者从本书的代码仓库/Apress\
  \ 网站下载）。在输入代码时，你需要注意三点。第一，代码中有一个用户界面部分。第二，代码中有一个服务器端。最后，应用程序必须运行起来。\n\n另一个需要注意的地方是（这也是我们建议手动输入所有代码的原因）用户端和服务器端的各个部分是如何衔接的。事实上，在我们的代码中，恰好有四个地方发生了这种衔接。从用户端来看，一个介于\
  \ 0 到 100 之间的数字变量、一个文本字符串和一个复选框是*输入*。服务器接收这些值并创建图表。然后服务器将这些图表放入*输出*中。用户端在 `mainPanel()`\
  \ 中获取该输出：\n\n```r\nlibrary(shiny)\n\n# 绘制饼图的用户界面\nui <- shinyUI(fluidPage(\n  \n\
  \  # 页面标题\n  titlePanel(\"用户控制图表\"),\n  \n  # 带有用户控制的数字、文本和复选框输入的侧边栏\n  sidebarLayout(\n\
  \    sidebarPanel(\n      numericInput(\"pie\",\n                   \"饼图百分比\",\n\
  \                   min = 0,\n                   max = 100,\n                  \
  \ value = 50),\n      textInput(\"pietext\", \"文本输入\", value = \"默认标题\", placeholder\
  \ = \"在此输入您的标题\"),\n      checkboxInput(\"pieChoice\",\n                    \" 我想要一个饼图。\"\
  , value = FALSE)\n    ),\n    \n    # 显示图表\n    mainPanel(\n      plotOutput(\"\
  piePlot\")\n    )\n  )\n))\n\n# 创建饼图或条形图（对用户隐藏）的服务器端 R 代码\nserver <- shinyServer(function(input,\
  \ output) {\n  \n  output$piePlot <- renderPlot({\n    \n    # 根据用户输入 input$pie\
  \ 生成饼图比例\n    y <- c(input$pie, 100 - input$pie)\n    \n    # 绘制具有指定比例和标签的饼图或条形图\n\
  \    if(input$pieChoice == FALSE){\n      barplot(y, ylim = c(0, 100),\n       \
  \       names.arg = c(input$pietext, paste0(input$pietext, \"的互补部分\")))\n    } else\
  \ {\n      pie(y, labels = c(input$pietext, paste0(input$pietext, \"的互补部分\")))\n\
  \    }\n  })\n})\n```\n\n\n\n"
- "# 运行应用程序\n\n`shinyApp(ui = ui, server = server)`\n\n现在，打开你精心输入代码的 `app.R` 文件，并一块运行该代码。\n\
  \n在代码区域右上角附近应该会有一个*运行应用*的播放按钮。无论哪种方式，都会出现类似图 13-1 的界面。\n\n## 第 13 章 每朵云都有闪亮的内衬\n\
  \n尽管输入各种数字和文本值。试用 Shiny，看看它能做什么。在此过程中，你会认识到 Shiny 所做的是为你和 R 之间提供一个交互界面。现在，这个特定的运行实例由你本地机器上的\
  \ RStudio 托管。\n\n注意控制台中显示了“正在监听”，并且你可能需要先点击*停止*按钮才能输入任何新代码。\n\n那么发生了什么？假设你将*饼图百分比*的数字修改为\
  \ 75。\n\n`numericInput()` 是一个反应式值。当你更改它时，后台会发送一个信号，通知服务器 `input$pie` 已更改。服务器随后会通知所有使用\
  \ `input$pie` 的反应式函数，告知其内容已发生变化。在我们的例子中，`renderPlot()` 是一个反应式函数。它现在知道 `input$pie`\
  \ 发生了变化，于是会查询该值，获取新值，并重新运行其所有代码。由于这是一个*输出*值，因此整个循环会通过 `output$piePlot` 反向重复，最终用户端的\
  \ `plotOutput()` 随之刷新。\n\n关于这一切，有几点重要的地方需要注意。我们刚才描述的过程会重新运行 `renderPlot()` 内部的所有代码——全部代码。在同等条件下，我们无需再去查找\
  \ `input$pietext` 和 `input$pieChoice`。我们的反应式函数知道这些变量的值，因为它们是最新的，虽然它们被再次使用，但不会再次被调用。尽管如此，如果我们在\
  \ `renderPlot()` 内部有比减法和绘制图形更复杂的操作，那么任何更改都可能会导致相对较高的性能开销。虽然这段代码非常紧凑，但你仍然可以看到三个可能放置\
  \ R 代码的位置。一个是 `library(shiny)` 所在的位置。这位于我们的 `shinyServer()` 外部。这里放的代码（例如我们的库调用）在每个会话中**仅运行一次**。一个会话可以允许多个用户与之交互（尽管目前这有点深奥）。不过，每个新用户至少会执行\
  \ `shinyServer()` 内的所有代码一次。最后，正如我们刚才所见，`renderPlot()` 等反应式函数内部的代码，会在任何一个关联的反应式输入值更新时运行一次。这意味着，为了提高效率，应尽可能将代码放在反应式函数外部。此外，如果你预计用户流量很大，也应尽可能将代码放在服务器外部。\n\
  \n![图 228](img/index-368_1.png)\n\n### 第 13 章 每朵云都有闪亮的内衬\n\n***图 13-1。** 一个本地托管的\
  \ Shiny 应用，用来了解我们正在实现的功能*\n\n现在，我们来介绍一些新函数。请记住，有用户输入端、服务器端以及整个 Shiny 应用。深入来看，Shiny\
  \ 实际上就由这三个部分组成。事实上，这里有一个非常基础的应用骨架：\n\n```r\nlibrary(shiny)\n\n# 定义用户界面\nui <- shinyUI(fluidPage())\n\
  \n# 定义服务器\nserver <- shinyServer(function(input, output) {})\n\n# 运行应用程序\nshinyApp(ui\
