  ## 2.5 输出


  与输入类似，输出也有多种形式。可能由于与其他研究人员或合作伙伴的合作，常常需要适配其他软件系统。同样，R 可以轻松输出为多种文件类型。通常，除了单纯的文件格式转换外，更主要的兴趣在于将特定的控制台输出写入某些文件。这样，一台机器就可以查看在另一台计算机上运行的分析结果。在本节中，我们将演示如何将数据输出为
  SPSS、Stata 和 Excel 格式。然后，我们将处理控制台输出。请您记住，还有许多其他创建文件的方式和类型，并且在更大型的示例中，我们会演示包括各类文档文件和图形在内的多种类型。


  除了前缀 `write` 之外，这些函数调用与前文“输入”部分高度相似：


  ```

  write_xlsx(countiesTxCSV, "data/ch02/Output1.xlsx")  # Excel

  write_sav(countiesTxCSV, "data/ch02/Output2.sav")    # SPSS

  write_dta(countiesTxCSV, "data/ch02/Output3.dta")    # Stata

  ```


  `sink()` 函数接收控制台输出并将其定向到文件。因此，R 进程的结果可以保存下来供日后查看，或保存到共享驱动器供他人查阅。控制台仅将输出发送到文件，而非输入。调用不带文件参数的该函数将关闭与文件的连接。请仔细观察以下代码与图
  2-2 所示的 `Output4.txt` 截图之间的区别：


  ```

  sink("data/ch02/Output4.txt", append = TRUE, split = TRUE)

  x <- 10

  xSquared <- xˆ2

  x

  ## [1] 10

  xSquared

  ## [1] 100

  sink()

  ```


