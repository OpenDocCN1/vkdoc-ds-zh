- '# 第 9 章 其他数据管理包


  ## 9.4 数据计算与创建变量


  既然你已经对如何在 tidyverse 中管理原始数据有了很好的了解，我们将重点关注如何从旧数据创建新数据。为简单起见，我们从原始 `iris` 数据集重新创建我们的
  `diris` 数据集。然后我们使用 `mutate()` 函数创建或替换列。该函数将常规的第一个参数，而后面的形式参数则表达如何创建新列。无论是创建一个还是多个，只需创建表达式让
  tidyverse 知道要追加到 tibble 中什么内容。请注意，在这里我们没有将这种变异重新赋值回 `diris`。因此，这个变异不会被保存下来。在探索性分析中，从控制台运行此类变异以便理解数据特征是很方便的：


  ```

  diris <- as_tibble(iris)

  diris %>% mutate(V0 = 0, X1 = 1L, X2 = 2L)

  ```


  ```

  ## # A tibble: 150 x 8

  ##    Sepal.Length Sepal.Width Petal.Length Petal.Width Species    V0

  ##           <dbl>       <dbl>        <dbl>       <dbl> <chr>   <dbl>

  ## 1          5.1         3.5          1.4         0.2 setosa      0

  ## 2          4.9         3            1.4         0.2 setosa      0

  ## 3          4.7         3.2          1.3         0.2 setosa      0

  ## 4          4.6         3.1          1.5         0.2 setosa      0

  ## 5          5           3.6          1.4         0.2 setosa      0

  ## # ... with 145 more rows, and 2 more variables: X1 <int>, X2 <int>

  ```


  当然，新数据可能并不全是创建全新的列。相反，我们也可以基于现有信息创建新的计算列。也许我们想要一个名为 `V` 的新列，它是 `Petal.Length` 和
  `Petal.Width` 的乘积：


  ```

  diris <- mutate(diris, V = Petal.Length * Petal.Width)

  diris

  ```


  ```

  ## # A tibble: 150 x 6

  ##    Sepal.Length Sepal.Width Petal.Length Petal.Width Species     V

  ##           <dbl>       <dbl>        <dbl>       <dbl> <chr>   <dbl>

  ## 1          5.1         3.5          1.4         0.2 setosa  0.280

  ## 2          4.9         3            1.4         0.2 setosa  0.280

  ## 3          4.7         3.2          1.3         0.2 setosa  0.26

  ```


  '
- '# 第 9 章 其他数据管理包


  ```

  ## 4          4.6         3.1          1.5         0.2 setosa  0.3

  ## 5          5           3.6          1.4         0.2 setosa  0.280

  ## # ... with 145 more rows

  ```


  更复杂的计算仅在满足某些条件时执行。在这种情况下，`if_else()` 需要三个参数。第一个是要测试 if/else 语句的逻辑条件。第二个和第三个形式参数指示在
  `if` 或 `else` 情况下要执行的操作。此外，`mutate()` 不仅允许我们创建包含数据的列，还可以更改现有列的数据。因此，如果我们第一次创建列 `V2`
  时，仅对 setosa 物种计算花瓣宽度和长度之间的乘法关系还不够，我们可以将其扩展到对 virginica 物种进行平方根运算。为了确保我们看到每个物种的一个样本，我们使用
  `slice()` 函数查看三个特定的行：


  ```

  diris <- diris %>% mutate(V2 = if_else(Species == "setosa", Petal.Length * Petal.Width,
  NA_real_))

  diris <- diris %>% mutate(V2 = if_else(Species == "virginica", sqrt(Petal.Length
  * Petal.Width), V2))

  diris %>% slice(c(1, 51, 101))

  ```


  ```

  ## # A tibble: 3 x 7

  ##   Sepal.Length Sepal.Width Petal.Length Petal.Width Species     V    V2

  ##          <dbl>       <dbl>        <dbl>       <dbl> <chr>   <dbl> <dbl>

  ## 1          5.1         3.5          1.4         0.2 setosa  0.280 0.280

  ## 2          7           3.2          4.7         1.4 versic˜ 6.58  2.56

  ## 3          6.3         3.3          6           2.5 virgin˜15     3.87

  ```


  并非必须创建新列；也可以直接使用 `summarise()` 函数计算表格上的信息。第一个形式参数一如既往地告诉函数使用哪个数据（尽管由于管道符的使用而隐藏了），其余参数用于保存各个计算结果。请注意，可以编码一个或多个计算。在这里，我们演示了算术均值
  `mean()` 和标准差 `sd()` 的两种计算：


  ```

  ## summarise 中的计算允许进行多项操作

  diris %>% summarise(M = mean(Sepal.Width), SD = sd(Sepal.Width))

  ```


  '
- "# 第 9 章 其他数据管理包\n\n```\n## # A tibble: 1 x 2\n##       M    SD\n##   <dbl> <dbl>\n\
  ## 1  3.06 0.436\n```\n\n假设我们想要获取数据，仅使用 virginica 物种，并计算萼片宽度的平均值。结果应该是一个仅包含一个变量的\
  \ tibble，即我们所需的均值。这就是管道运算符开始展现其优势的地方，因为这段代码非常易读。实际上，即使是非编程人员也可能理解这段代码的含义：\n\n```\n\
  diris %>% filter(Species == \"virginica\") %>% summarise(M = mean(Sepal.Width))\n\
  ```\n\n```\n## # A tibble: 1 x 1\n##       M\n##   <dbl>\n## 1  3.06\n```\n\n\n\n\
  ## 1 2.97\n\n这种一次一步的思路经过调整，可以管理各种数据处理操作。回顾我们对 `data.table` 的研究，其第三个形式参数 `by =` 允许我们按列元素进行分组。对于\
  \ `tidyverse`，我们使用 `group_by()` 对列名进行操作，即可完成同样的任务。将我们的均值计算示例扩展到所有三个物种，现在我们得到一个两列的\
  \ tibble，每个物种占一行。我们还可以计算原始数据中多个列的均值：\n\n```\ndiris %>%\n  group_by(Species) %>%\n\
  \  summarise(\n    mSW = mean(Sepal.Width),\n    mPW = mean(Petal.Width))\n```\n\
  \n```\n## # A tibble: 3 x 3\n##   Species     mSW   mPW\n##   <chr>     <dbl> <dbl>\n\
  ## 1 setosa     3.43 0.246\n## 2 versicolor 2.77 1.33\n## 3 virginica  2.97 2.03\n\
  ```\n\n## 第 9 章 其他数据管理包\n\n这种链式结构，就像 data.table 的链式结构一样，可以无限（或近乎无限）地进行下去。为了找到前面数据中的相关性，我们只需在链的末尾添加一个使用\
  \ `cor()` 函数的步骤：\n\n```\ndiris %>%\n  group_by(Species) %>%\n  summarise(\n    mSW\
  \ = mean(Sepal.Width),\n    mPW = mean(Petal.Width)) %>%\n  summarise(r = cor(mSW,\
  \ mPW))\n```\n\n```\n## # A tibble: 1 x 1\n##       r\n##   <dbl>\n## 1 -0.759\n\
  ```\n\n变量也可以创建其他变量。我们根据花瓣宽度是否大于或小于该物种的花瓣宽度中位数，创建一个新的布尔变量：\n\n```\ndiris <- diris\
  \ %>%\n  group_by(Species) %>%\n  mutate(MedPW = Petal.Width > median(Petal.Width))\n\
  diris\n```\n\n```\n## # A tibble: 150 x 8\n## # Groups:   Species [3]\n##    Sepal.Length\
  \ Sepal.Width Petal.Length Petal.Width Species     V\n##          <dbl>       <dbl>\
  \        <dbl>       <dbl> <chr>   <dbl>\n##  1          5.1         3.5       \
  \   1.4         0.2 setosa  0.280\n##  2          4.9         3            1.4 \
  \        0.2 setosa  0.280\n##  3          4.7         3.2          1.3        \
  \ 0.2 setosa  0.26\n##  4          4.6         3.1          1.5         0.2 setosa\
  \  0.3\n##  5          5           3.6          1.4         0.2 setosa  0.280\n\
  ## # ... with 145 more rows, and 2 more variables: V2 <dbl>, MedPW <lgl>\n```\n\n\
  ## 第 9 章 其他数据管理包\n\n按多个变量分组也很容易。同时按物种和中位数花瓣宽度布尔值分组，我们重新计算花萼宽度和花瓣宽度的均值：\n\n```\n\
  diris %>%\n  group_by(Species, MedPW) %>%\n  summarise(\n    mSW = mean(Sepal.Width),\n\
  \    mPW = mean(Petal.Width))\n```\n\n```\n## # A tibble: 6 x 4\n## # Groups:  \
  \ Species [3]\n##   Species    MedPW   mSW   mPW\n##   <chr>      <lgl> <dbl> <dbl>\n\
  ## 1 setosa     FALSE  3.38 0.185\n## 2 setosa     TRUE   3.54 0.375\n## 3 versicolor\
  \ FALSE  2.62 1.19\n## 4 versicolor TRUE   2.96 1.50\n## 5 virginica  FALSE  2.84\
  \ 1.81\n## 6 virginica  TRUE   3.13 2.27\n```\n\n再次强调，我们总是可以链式添加更多操作：\n\n```\ndiris\
  \ %>%\n  group_by(Species, MedPW) %>%\n  summarise(\n    mSW = mean(Sepal.Width),\n\
  \    mPW = mean(Petal.Width)) %>%\n  group_by(MedPW) %>%\n  summarise(r = cor(mSW,\
  \ mPW))\n```\n\n```\n## # A tibble: 2 x 2\n##   MedPW      r\n##   <lgl>  <dbl>\n\
  ## 1 FALSE -0.778\n## 2 TRUE  -0.760\n```\n\n## 第 9 章 其他数据管理包\n\n### 9.5 数据合并与重塑\n\
  \n不再重复我们在第 7 章中关于合并和重塑数据的讨论，我们注意到 `merge()` 函数在一定程度上仍然有效。由于 tibble 是建立在数据框之上的，所以它能够工作。然而，当合并发生时，它们会失去\
  \ tibble 的状态。因此，我们还要介绍 `*join()` 函数，它们更接近一些传统的数据库语言。\n\n我们首先运行一小段代码来创建四个独立的数据对象。请注意，在实际应用中这很可能不是必需的，因为我们的数据通常来自不同的数据库：\n\
  \n```\n# 数据集一\ndiris <- diris %>%\n  group_by(Species) %>%\n  select(Species, Sepal.Width)\
  \ %>%\n  slice(1:3)\ndiris\n```\n\n```\n## # A tibble: 9 x 2\n## # Groups:   Species\
  \ [3]\n##   Species    Sepal.Width\n##   <chr>            <dbl>\n## 1 setosa   \
  \          3.5\n## 2 setosa             3\n## 3 setosa             3.2\n## 4 versicolor\
  \         3.2\n## 5 versicolor         3.2\n## 6 versicolor         3.1\n## 7 virginica\
  \          3.3\n## 8 virginica          2.7\n## 9 virginica          3\n```\n\n\
  ```\n# 数据集二\ndiris2 <- diris %>% slice(c(1, 4, 7))\ndiris2\n```\n\n```\n## # A tibble:\
  \ 3 x 2\n## # Groups:   Species [3]\n##   Species    Sepal.Width\n##   <chr>   \
  \         <dbl>\n## 1 setosa             3.5\n## 2 versicolor         3.2\n## 3\
  \ virginica          3.3\n```\n\n```\n# 数据集三\ndalt1 <- tibble(\n  Species = c(\"\
  setosa\", \"setosa\", \"versicolor\", \"versicolor\",\n              \"virginica\"\
  , \"virginica\", \"other\", \"other\"),\n  Type = c(\"wide\", \"wide\", \"wide\"\
  , \"wide\",\n           \"narrow\", \"narrow\", \"moderate\", \"moderate\"),\n \
  \ MedPW = c(TRUE, FALSE, TRUE, FALSE, TRUE, FALSE, TRUE, FALSE))\ndalt1\n```\n\n\
  ```\n## # A tibble: 8 x 3\n##   Species    Type     MedPW\n##   <chr>      <chr>\
  \    <lgl>\n## 1 setosa     wide     TRUE\n## 2 setosa     wide     FALSE\n## 3\
  \ versicolor wide     TRUE\n## 4 versicolor wide     FALSE\n## 5 virginica  narrow\
  \   TRUE\n## 6 virginica  narrow   FALSE\n## 7 other      moderate TRUE\n## 8 other\
  \      moderate FALSE\n```\n\n```\n# 数据集四\ndalt2 <- dalt1 %>% slice(c(1, 3))\ndalt2\n\
  ```\n\n```\n## # A tibble: 2 x 3\n##   Species    Type  MedPW\n##   <chr>      <chr>\
  \ <lgl>\n## 1 setosa     wide  TRUE\n## 2 versicolor wide  TRUE\n```\n\n## 第 9 章\
  \ 其他数据管理包\n\n`merge()` 函数对两个数据集进行操作。对于像 `diris2` 和 `dalt2` 这样的一对一数据，默认的合并只保留两个数据集中都匹配的行。我们可以看到，对于这两个对象，`diris2`\
  \ 中的 `virginica` 行被丢弃了：\n\n```\ndiris2 %>% merge(dalt2)\n```\n\n```\n##   Species\
  \ Sepal.Width Type MedPW\n## 1 setosa          3.5 wide  TRUE\n## 2 versicolor \
  \     3.2 wide  TRUE\n```\n\n如果我们希望保留 `diris2` 的所有三行，那么合并后就会有一些缺失数据。在这种情况下，由于我们任意选择\
  \ `diris2` 作为第一个形式参数，`all.x = TRUE` 会保留 `diris2` 的所有行：\n\n```\ndiris2 %>% merge(dalt2,\
  \ all.x = TRUE)\n```\n\n```\n##   Species Sepal.Width Type MedPW\n## 1 setosa  \
  \        3.5 wide  TRUE\n## 2 versicolor      3.2 wide  TRUE\n## 3 virginica   \
  \    3.3 <NA>    NA\n```\n\n也可以设置第二个参数，即 `all.y = TRUE`，不过在本例中这样做没有明显区别。根据两个特定表的匹配程度，可能会产生不同的缺失变量模式。类似地，我们也可以设置保留所有表的所有行。这可能会产生最多的缺失数据位置；在我们的示例中，这样的合并与前面示例中显示的三行完全相同：\n\
  \n```\ndiris2 %>% merge(dalt2, all.y = TRUE)\n```\n\n```\n##   Species Sepal.Width\
  \ Type MedPW\n## 1 setosa          3.5 wide  TRUE\n## 2 versicolor      3.2 wide\
  \  TRUE\n```\n\n```\ndiris2 %>% merge(dalt2, all = TRUE)\n```\n\n```\n##   Species\
  \ Sepal.Width Type MedPW\n## 1 setosa          3.5 wide  TRUE\n## 2 versicolor \
  \     3.2 wide  TRUE\n## 3 virginica       3.3 <NA>    NA\n```\n\n## 第 9 章 其他数据管理包\n\
  \n如前所述，这些结果不是 tibble。如果我们希望合并后再强制转换回 tibble，可以用 `as_tibble()` 包装它们。然而，`tidyverse`\
  \ 也可以操作数据库风格的对象，正如你在第 10 章中将看到的。特别是，*结构化查询语言*（SQL）可以通过 `dplyr` 访问。SQL 有连接操作，我们现在考虑四种连接类型。\n\
  \n`left_join()` 会返回第一个对象的所有行，以及第一个和第二个对象的所有列。由于这是一个 `dplyr` 函数调用，我们得到一个 tibble 类作为返回输出：\n\
  \n```\ndiris2 %>% left_join(dalt2)\n```\n\n```\n## Joining, by = \"Species\"\n##\
  \ # A tibble: 3 x 4\n## # Groups:   Species [3]\n##   Species    Sepal.Width Type\
  \  MedPW\n##   <chr>            <dbl> <chr> <lgl>\n## 1 setosa             3.5 wide\
  \  TRUE\n## 2 versicolor         3.2 wide  TRUE\n## 3 virginica          3.3 NA\
  \    NA\n```\n\n\n\n## 3 维吉尼亚鸢尾花 3.3 <NA> NA\n\n`right_join()` 返回一个包含两个对象所有列以及*第二个*对象所有行的\
  \ tibble。互联网上的许多图表声称它们揭示了连接操作如何工作的真相。根据我们的经验，这些解释的准确性可能时好时坏。至少，大多数人会觉得许多此类图表令人困惑。我们的建议是，拿几个小的数据表，或者像我们这里一样自己创建一些数据。然后开始尝试连接操作。这就是“学骑自行车”的方法。与其讨论双轮运动的物理学，不如多练习，不要害怕在这个过程中擦伤膝盖：`diris2\
  \ %>% right_join(dalt2)`\n\n## Joining, by = \"Species\"\n\n## # A tibble: 2 x 4\n\
  \n## # Groups: Species [2]\n\n## Species Sepal.Width Type MedPW\n\n## <chr> <dbl>\
  \ <chr> <lgl>\n\n## 1 setosa 3.5 wide TRUE\n\n## 2 versicolor 3.2 wide TRUE\n\n\
  第 9 章 其他数据管理包\n\n在这种情况下，`inner_join()` 函数产生的结果与之前的右连接相同。但是，它只返回两个对象中都匹配的行。也许最奇怪的连接是\
  \ `anti_join()`，它返回第一个数据库中与第二个数据对象中的值不匹配的所有行。至于列，它只返回第一个对象的列：`diris2 %>% inner_join(dalt2)`\n\
  \n## Joining, by = \"Species\"\n\n## # A tibble: 2 x 4\n\n## # Groups: Species [2]\n\
  \n## Species Sepal.Width Type MedPW\n\n## <chr> <dbl> <chr> <lgl>\n\n## 1 setosa\
  \ 3.5 wide TRUE\n\n## 2 versicolor 3.2 wide TRUE\n\n`diris2 %>% anti_join(dalt2)`\n\
  \n## Joining, by = \"Species\"\n\n## # A tibble: 1 x 2\n\n## # Groups: Species [1]\n\
  \n## Species Sepal.Width\n\n## <chr> <dbl>\n\n## 1 virginica 3.3\n\n在连接和合并之间，有多种将数据组合到单个对象中的选项。请记住，您的目标是最终获得分析所需的数据。\n\
  \n有时，先将一个或多个数据集合合并到一个表中，然后使用本章前面介绍的技术将其缩减为您想要的数据集是有意义的。当然，如果您更熟悉合并操作，它们通常也能很好地工作。\n\
  \n如果您确实需要使用 tidyverse，`as_tibble()` 始终可以作为包装函数，将您的对象强制转换回它应有的样子。毕竟，`data.table`\
  \ 和 tidyverse 的 tibbles 都是数据框的扩展。\n\n我们的最后一个目标是数据重塑，如果每行有一个唯一的 ID，效果会更好。我们首先再次刷新我们的数据集。然后，我们引入\
  \ `n()`，这是一种引用行数的特殊方式，很像数据表中的 `.N`：\n\n```r\ndiris <- as_tibble(iris)\ndiris <-\
  \ diris %>% mutate(ID = 1:n())\ndiris\n```\n\n## # A tibble: 150 x 6\n\n## Sepal.Length\
  \ Sepal.Width Petal.Length Petal.Width Species ID\n\n## <dbl> <dbl> <dbl> <dbl>\
  \ <chr> <int>\n\n## 1 5.1 3.5 1.4 0.2 setosa 1\n\n## 2 4.9 3 1.4 0.2 setosa 2\n\n\
  ## 3 4.7 3.2 1.3 0.2 setosa 3\n\n## 4 4.6 3.1 1.5 0.2 setosa 4\n\n## 5 5 3.6 1.4\
  \ 0.2 setosa 5\n\n## # ... with 145 **更多** 行\n\n为了将数据变长，我们使用 tidyr 函数 `pivot_longer()`。此函数接受我们数据中要修改为新格式的列列表。\n\
  \n在这种情况下，它指的是我们的花萼和花瓣变量。`names_to` 参数使用一个特殊命令 `.value` 来指示我们希望新列包含旧列的值。相比之下，下一个元素\
  \ `Type` 将包含指示数据来自哪一列的信息。因为我们在 `names_to` 中有*两个*条目，所以我们的 `names_pattern` 期望有两个部分。使用正则表达式，我们用\
  \ `|` 表示逻辑*或*来指示变量部分：\n\n```r\ndiris.long <-\n  diris %>% pivot_longer(\n    cols\
  \ = c(Sepal.Length, Sepal.Width, Petal.Length, Petal.Width),\n    names_to = c(\"\
  .value\", \"Type\"),\n    names_pattern = \"(Sepal|Petal).(Width|Length)\"\n  )\n\
  diris.long\n```\n\n## # A tibble: 300 x 5\n\n## Species ID Type Sepal Petal\n\n\
  ## <chr> <int> <chr> <dbl> <dbl>\n\n## 1 setosa 1 Length 5.1 1.4\n\n## 2 setosa\
  \ 1 Width 3.5 0.2\n\n## 3 setosa 2 Length 4.9 1.4\n\n## 4 setosa 2 Width 3 0.2\n\
  \n## 5 setosa 3 Length 4.7 1.3\n\n## # ... with 295 **更多** 行\n\n我们将宽数据变长了。现在我们通过使用\
  \ `pivot_wider()` 来逆转这个过程。`names_from` 指示更宽的列名将从哪里来。分隔符默认为 `_`，因此我们将其改为句点。最后，`values_from`\
  \ 包含我们数据值的列：\n\n```r\ndiris.wide <- diris.long %>% pivot_wider(\n  names_from =\
  \ Type,\n  names_sep = \".\",\n  values_from = c(Sepal, Petal)\n)\ndiris.wide\n\
  ```\n\n## # A tibble: 150 x 6\n\n## Species ID Sepal.Length Sepal.Width Petal.Length\
  \ Petal.Width\n\n## <chr> <int> <dbl> <dbl> <dbl> <dbl>\n\n## 1 setosa 1 5.1 3.5\
  \ 1.4 0.2\n\n## 2 setosa 2 4.9 3 1.4 0.2\n\n## 3 setosa 3 4.7 3.2 1.3 0.2\n\n##\
  \ 4 setosa 4 4.6 3.1 1.5 0.2\n\n## 5 setosa 5 5 3.6 1.4 0.2\n\n\n\n"
- "# ……还有 145 **多**行\n\n### 9.6 小结\n\n`dplyr`、`tibble` 和 `tidyr` 包能让数据处理更具可读性。通过将对数据的操作与数据本身分离，我们可以学习相对有限的操作，并将其应用于任何数据。在幕后，tidyverse\
  \ 会翻译这些函数调用来修改数据。在下一章中，你将看到这如何使我们能够快速访问大数据。表 9-1 描述了本章使用的关键函数。\n\n### 第 9 章 其他数据管理包\n\
  \n**表 9-1.** 本章所述关键函数及功能摘要\n\n| **函数** | **功能** |\n|---|---|\n| `as_tibble()` |\
  \ 将数据对象（例如数据框）转换为 tibble。 |\n| `arrange()` | 按指定列升序排列，若在列名上使用`desc()`则降序排列。 |\n\
  | `distinct()` | 这是 dplyr 对 `unique()` 的回应。它只返回不重复的行。 |\n| `slice()` | 从 tibble\
  \ 中切出指定的行。 |\n| `filter()` | 根据匹配的特征过滤行。 |\n| `select()` | 根据名称选择特定列。可通过辅助函数扩展功能：`one_of()`、`starts_with()`、`ends_with()`、`contains()`、`matches()`、`num_range()`\
  \ 和 `everything()`。 |\n| `rename()` | 重命名列。 |\n| `mutate()` | 允许对现有 tibble 进行更改或变动。添加/删除/修改列数据是常见的用途。\
  \ |\n| `summarise()` | 基于原始 tibble 的计算结果创建新的 tibble。 |\n| `%>%` | 管道操作符避免函数嵌套，允许更简洁的代码来串联多个函数。\
  \ |\n| `group_by()` | 允许按列分组。 |\n| `left_join()` | 连接是处理数据的 SQL 方式。左连接保留第一个对象的所有行。\
  \ |\n| `right_join()` | 保留第二个对象的所有行。 |\n| `inner_join()` | 返回两个变量的所有列，以及第一个对象中与第二个数据对象匹配的所有行。\
  \ |\n| `anti_join()` | 仅返回第一个数据对象中唯一、无法关联的部分。如果第二个对象旨在扩展第一个对象的信息，这将非常有用，因为它提供了一种快速查看剩余内容的方法。\
  \ |\n| `pivot_longer()` | 将宽数据熔化变长。 |\n| `pivot_wider()` | 将长数据转换为宽格式。 |\n\n## 第\
  \ 10 章\n\n## 读取大数据\n\n既然你已经具备操作数据的能力，现在是时候花点时间考虑数据存储在哪里了。R 在内存（随机存取存储器，RAM）中工作，而不是硬盘。快速检查你的系统设置应该能显示你拥有的内存大小。我们（作者）在真实系统中使用\
  \ 16 到 128 GB 的内存，更大的数字是一种昂贵但方便的习惯。R 不能分析超过可用 RAM 的数据。当考虑到现代研究中遇到的越来越大的文件大小时，这一点变得尤为重要。RAM\
  \ 中数据过多会导致 R 和你的计算机系统停止工作。因此，必须确保恰好合适的数据进入 RAM。\n\n数据如何进入 RAM？较小的数据通常以逗号分隔值（CSV）文件或易于转换为\
  \ CSV 的文件形式存在。然而，较大的数据通常位于称为数据库的其他地方。虽然大多数数据库都有将文件导出为 CSV 的能力，但这并不总是方便。能够直接从数据库访问数据，并且（潜在地）能够将数据从\
  \ R 写入数据库，是成功分析更大数据的关键技能。\n\n为简化复杂性，本章我们在本地机器上安装并托管一个数据库服务器。也就是说，大多数云计算解决方案都提供了在\
  \ Web 上托管数据库的选项。除了安装/设置过程之外，无论数据库的具体位置如何，连接和对接 R 与数据库的机制都是相同的。\n\n我们将使用的数据库是 PostgreSQL，它既开源又流行。这个高级数据库内部理解\
  \ 30 多种数据类型。我们推荐 Neil Matthew 和 Richard Stones 所著的《Beginning Databases with PostgreSQL》（Apress,\
  \ 2005）。我们将引导你在本地机器上安装一个实践版本。我们的目标是让你尽快能够在此数据库中对数据使用 R。\n\n更高级的数据库操作很可能不应在 R 中完成。\n\
  \n© Matt Wiley 和 Joshua F. Wiley 2020  \nM. Wiley 和 J. F. Wiley，《Advanced R 4 Data\
  \ Programming and the Cloud》，  \n[`doi.org/10.1007/978-1-4842-5973-3_10`](https://doi.org/10.1007/978-1-4842-5973-3_10#DOI)\n\
  \n### 第 10 章 读取大数据\n\nPostgreSQL 集成了许多非常有用的数据库特性，包括数据可靠性措施和不同级别的用户访问控制。虽然本书主要侧重于\
  \ R，但我们将在专门章节中简要介绍足够的数据库管理信息，供希望自行搭建数据库的读者参考。尽管如此，我们的重点是练习足够的关键技能，使你能够访问和分析数据库数据。\n\
  \n本章需要以下包：`DBI`、`RPostgreSQL`、`data.table`、`keyring` 和 `JWileymisc`。\n\n```r\nlibrary(RPostgreSQL)\n\
  library(DBI)\nlibrary(data.table)\nlibrary(JWileymisc)\nlibrary(keyring)\n\noptions(width\
  \ = 70,\n        stringsAsFactors = FALSE,\n        datatable.print.nrows = 20,\
  \  ## 如果超过 20 行\n        datatable.print.topn = 3,    ## 打印前 3 行和后 3 行\n       \
  \ digits = 2)                  ## 减少 R 打印的小数位数\n```\n\n### 10.1 在 Windows 上安装 PostgreSQL\n\
  \n访问 PostgreSQL 网站 [www.postgresql.org/download/windows/](http://www.postgresql.org/download/windows/)\
  \ 并选择其中一个安装程序选项。我们选择了 64 位架构和版本 12.2（这是撰写本书时的最新版本）的安装程序。下载后，你应该会得到一个名为 `postgresql-12.2-2-windows-x64.exe`\
  \ 的文件，这就是你的安装程序。当然，你的版本号可能高于 12.2。较新的版本很可能不会对你跟上本章内容产生重大影响。\n\n继续安装程序，根据需要点击*下一步*按钮，并接受安装目录的默认设置。安装程序会要求为名为\
  \ `postgres` 的数据库超级用户设置密码，我们将其设置为 `advancedr`。如果你选择了不同的密码，请务必安全地记录下来。顺便提一下，这也会创建一个与超级用户同名的数据库。PostgreSQL\
  \ 默认使用端口 5432，如果没有显示为默认选项，你可能已经在计算机上运行了另一个版本的 PostgreSQL。再点击几次*下一步*，接受默认设置，应该就会进入安装环节。在最后一步，可能会询问有关*堆栈生成器*的问题；**不**需要它，你可以在点击*完成*前*取消勾选*该选项。\n\
  \n至此，PostgreSQL 安装完成，并已在你的计算机上运行。如果你熟悉这个数据库，你可以直接向其中添加数据（并且可能不需要这个入门指南）。我们通过 R 添加数据，并快速开始访问这些数据的子集。\n\
  \n### 10.2 对接 R 和 PostgreSQL\n\n我们的第一个任务是连接到数据库。这需要使用 `DBI` 包来建立与我们刚刚安装的数据库的连接。`dbDriver()`\
  \ 函数是一个 DBI 函数，用于设置默认的接口指令。在这里，我们需要一个 PostgreSQL 驱动程序，它由 `RPostgreSQL` 提供。这一点值得注意，因为\
  \ DBI 是一个适用于多种数据库类型的包装器。除了 PostgreSQL，还有其他选择，其中许多都可以通过 DBI 函数进行访问。因此，无论使用何种数据库，本章的大部分内容都是通用的。对于需要与多种不同数据库交互的读者来说，通过留在\
  \ RStudio 环境中并主要使用 R 函数，可以大大减轻认知负担。实际上，在不同数据库之间切换并几乎察觉不到变化，是非常流畅的体验。`dbDriver()`\
  \ 的结果被赋值给一个变量，我们称之为 `drv`。\n\n有了正确的接口机制或驱动程序，就可以具体连接到我们的数据库了。安装 PostgreSQL 时，我们创建了一个名为\
  \ `postgres` 的超级用户，密码为 `advancedr`。此外，安装过程还创建了第一个数据库，其名称与我们的超级用户相同，即 `postgres`。这个超级用户帐户拥有数据库中所有表的完全权限。我们稍后将更深入地讨论用户权限。\n\
  \n要连接到这个名为 `postgres` 的数据库，我们将使用驱动程序，并且必须指定主机位置。由于我们在本地机器上安装了服务器，我们将使用 `host = \"\
  localhost\"`。但是，如果你选择使用云服务（我们将在后续章节中更深入地介绍），你只需在引号内输入你的服务器网址。设置端口也很重要，你可能还记得这是安装过程的一部分。这些必须匹配，在安装过程中，我们保留了默认端口\
  \ 5432。如果你使用云服务，你的端口可能也不同。最后，我们使用安装过程中设置的用户名和密码。\n\n所有这些信息都用于 `dbConnect()` 函数，以建立到我们数据库服务器的连接。在此，我们将其命名为\
  \ `conSuper`，代表“超级用户的连接”。这将使用我们超级用户的用户名和密码创建的连接。\n\n我们*首次*连接过程的最后一步是使用 `dbGetInfo()`\
  \ 确认我们已成功连接到数据库。并非每次连接都需要使用此函数。我们在此使用它来验证所有系统是否正常运行。假设你的输出与我们的输出大致匹配，你就知道安装过程成功了：\n\
  \n```r\ndrv <- dbDriver(\"PostgreSQL\")\nconSuper <- dbConnect(drv,\n          \
  \            dbname = \"postgres\",\n                      host = \"localhost\"\
  ,\n                      port = 5432,\n                      user = \"postgres\"\
  ,\n                      password = \"advancedr\")\ndbGetInfo(conSuper)\n```\n\n\
  \n\n"
