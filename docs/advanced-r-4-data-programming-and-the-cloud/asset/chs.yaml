  \ R 社区很大一部分人的喜爱，是现代 R 的重要组成部分。在实践中，数据表仍然更快，并且通常能用更少的代码行完成作者认为最常见的任务。这两种较新的结构各有优势，在\
  \ R 的宇宙中都有其位置（实际上，第 7 章和第 8 章专注于数据表，而第 9 章则重点介绍了 tibble）。尽管如此，本书将主要使用数据表。\n\n在探索了几种对象类型之后，我们将注意力转向使用运算符和函数来操作这些对象的方法。\n\
  \n## 1.4 基本运算符和函数\n\n仅有对象不足以构成一门语言；名词虽好，但也需要动作。运算符和函数就是编程世界中的动词。我们从赋值开始，赋值有两种方式。就像书面语言一样，更优雅的措辞比简单的表述更有帮助。因此，虽然\
  \ `=` 和 `<-` 都是赋值运算符且功能相同，但由于 `=` 在函数内用于设置参数，我们建议出于清晰起见，在一般赋值中使用 `<-`。尽管如此，我们仍会演示这两种赋值技巧。赋值允许为对象赋予有意义的名称；这可以显著提高代码的可读性（对未来的你以及其他用户都是如此）。\n\
  \n除了为变量赋值，你还可以使用函数来检查具体细节。R 中的函数采用通用格式：函数名后跟括号，括号内输入参数，然后 R 提供输出。示例如下：\n\n`x <-\
  \ 5`\n\n`y = 3`\n\n`x`\n\n```\n## [1] 5\n```\n\n`y`\n\n```\n## [1] 3\n```\n\n`is.integer(x)`\n\
  \n```\n## [1] FALSE\n```\n\n`is.double(y)`\n\n```\n## [1] TRUE\n```\n\n`is.vector(x)`\n\
  \n```\n## [1] TRUE\n```\n\n能够读出并说出这些代码行会有所帮助（而这正是我们偏爱 `<-` 的核心原因，它读作“被赋值为”）。上面这段代码可以理解为“变量\
  \ `x` 被赋值为整数值 5”。相比之下，尽管 `y` 这行代码在底层执行了完全相同的操作，但说“`y` 等于 3”可能不太清楚到底是在讨论 `y` 的固有属性还是在执行赋值操作。\n\
  \n一旦对象被赋值，你可以使用方括号访问特定的对象元素。大多数计算机语言的索引从 0 或 1 开始。R 的索引从 1 开始。另外，请注意你可以毫无困难且无需警告地更改旧的赋值；因此明智的做法是谨慎地使用名称并仔细编写代码注释：\n\
  \n`x <- c(\"a\", \"b\", \"c\")`\n\n`x[1]`\n\n```\n## [1] \"a\"\n```\n\n`is.vector(x)`\n\
  \n```\n## [1] TRUE\n```\n\n`is.vector(x[1])`\n\n```\n## [1] TRUE\n```\n\n`is.character(x[1])`\n\
  \n```\n## [1] TRUE\n```\n\n“谨慎使用名称”是什么意思？我们之前把向量命名为 `x`，这不是一个很有趣的名字。很难记住 `x` 包含了字母表的前三个字母。相反，我们可以选择一个更好的变量名，将难以记忆的\
  \ `x` 替换为 `passingLetterGrades`。更好的是，当说出这个变量名时它是有意义的，并且以后也很容易改进，比如如果我们想添加有时代表通过的字母等级\
  \ D 或代表及格/不及格的通过等级 S：\n\n`passingLetterGrades <- c(\"A\", \"B\", \"C\")`\n\n`passingLetterGrades[2]`\n\
  \n\n\n"
- "# 1 “B”\n\n向量可能只接受单个索引，但更复杂的结构需要更多索引。对于你之前遇到的矩阵，第一个索引是行，第二个是列位置。请注意，在构建并赋值矩阵后，有多种方法可以访问元素的各种组合。这种仅访问部分元素的过程有时被称为*子集化*：\n\
  \n```\nx2 <- matrix(c(1, 2, 3, 4, 5, 6), nrow = 3, ncol = 2)\n```\n\n`x2` ## **打印**\
