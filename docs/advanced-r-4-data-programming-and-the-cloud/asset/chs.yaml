- '# 6: 中型地铁


  在 R 中，函数接收*输入*并使用它们来创建所需的精确*输出*。


  当最初构建时，程序员会指定参数的数量、这些参数的预期顺序以及参数的名称。在前面的示例中，`fread()`依赖于第一个参数的*预期顺序*。换句话说，文件位置和名称被*预期*作为**第一个**输入。然而，接下来的两个输入——我们确保文本的第一行将成为我们的列名并强制分隔符为逗号——实际上*不是按顺序*的。因为我们为这两个参数使用了预期的变量名，R
  仍然正确地解析了该函数，并且正确的事情发生了。这个函数原本会期望先输入分隔符。此外，默认值为`sep = "auto"`，它执行一些可能有效也可能无效的魔法来检测分隔字符。通过将其明确改为逗号，我们确保文件被正确读取。此外，默认值也是`header
  = "auto"`。对于许多读取输入的函数，默认值是`TRUE`。


  取决于`fread()`自动处理过程的构成，这可能做出也可能不做出正确的选择。在撰写本文时，如果第一行仅包含字符数据，自动处理过程会假定第一行是列名。


  现在，前面我们提到这个函数还有两个特性值得注意，但我们保留了默认设置。其中一个特性是默认选择`stringsAsFactors = FALSE`。因子，如第 1
  章所述，是一种强制分类数据具有数值顺序的方式。然而，在输入时，进行排序的默认方式是“按数据读取的顺序”。这可能不是正确的顺序（例如，在大多数情况下，将“强烈同意”编码为
  1，“中立”编码为 2，“同意”编码为 3 是不好的）。与许多默认将字符串转换为因子的基础 R 读取 CSV 输入的函数不同，`fread()`默认**不进行因子化**。


  最后一个特性非常不错，并且随着我们更深入地探索数据表，它会变得更好。与一些仅将数据读取为数据框的函数不同，`fread()`默认将数据读取为数据表：


  ```

  is.data.table(countiesTxCSV)

  ```


  ```

  ## [1] TRUE

  ```


  在处理数据时，虽然逗号分隔值很常见，但通常还有其他格式需要读入内存。*Stata*就是其中一种格式，此类文件格式可以通过文件后缀`.dta`来识别，而函数`read_dta()`来自`haven`包。请记住，许多更新版本的
  R 数据结构以数据框作为其底层格式，并在此基础上增加了一些额外功能，值得注意的是，从技术上讲，这个输入是一个`tibble`。正如第 1 章所述，我们将在第 9
  章更详细地讨论这些内容。目前，它可以当作任何数据框处理。在这种情况下，虽然我们保留了默认的不跳过设置，但我们明确展示了`skip = 0`选项，该选项可用于跳过任意数量的顶部行（例如，`skip
  = 2`将跳过前两行）：


  ```

  countiesTxDTA <- read_dta("data/ch02/Counties_in_Texas.dta", skip = 0)

  tail(countiesTxDTA)

  ```


