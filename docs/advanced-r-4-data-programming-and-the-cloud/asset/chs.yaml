- '# 第 6 章 编写包


  `check()` 函数包含多个步骤。它首先确保文档是最新的，然后构建一个源代码压缩包，最后在其上运行 `Rcmd check`。我们可以看到，检查捕捉到了不少问题。所有这些问题基本上都归结为没有精确地告诉
  R 导入或需要哪些函数或包。大多数问题的出现是因为包和交互式 R 工作方式之间的差异。在交互式会话期间，`base`、`methods`、`graphics`、`utils`
  和 `stats` 包默认会被加载，即使没有调用 `library(stats)` 之类。这意味着在交互式会话中，默认情况下搜索路径上有许多可用的函数。在包中，R
  在最近的版本中变得更加严格，并且要求明确导入 `base` 包之外的所需函数。这些检查甚至建议了我们可以在命名空间中添加什么。我们使用 `roxygen2` 包，因此我们不是将这些添加到命名空间，而是将它们添加到
  R 代码文件中。具体来说，在 `AdvancedRPkg/R/plot_functions.R` 中，紧跟在 `@export` roxygen2 语句之后，我们为
  `meanPlot()` 添加以下内容：


  ```r

  ##'' @importFrom graphics plot points

  ##'' @importFrom stats formula

  ```


  并且在同一个文件中为 `ggplot.lm()` 方法添加以下内容：


  ```r

  ##'' @importFrom stats predict qnorm

  ```


  在 `AdvancedRPkg/R/textplot.R` 中，紧跟在 `@param object` roxygen2 语句之后，我们为 `show()` 方法添加以下内容：


  ```r

  ##'' @importFrom utils head

  ```


  此外，还有一个类似的问题是关于某些全局变量的绑定不可见。这源于 `ggplot.lm()` 方法；因为它使用了 `within()`，R 无法判断这些变量是否已被定义，即使它们是在包含这些变量的数据框环境中进行查找。虽然这只是一个有点虚假的提示，但最好还是消除所有提示。一个解决方案是在我们的
  R 文件中的某处添加对 `globalVariables()` 的调用。在 `AdvancedRPkg/R/plot_functions.R` 文件的顶部，我们添加以下内容：


  ```r

  globalVariables(c("fit", "se.fit"))

  ```


  注意到的最后一个问题是，在其中一个示例中找不到 `ggplot()`。因为我们的包导入了 `ggplot2` 包，所以 `ggplot()` 函数对于包内的代码是可用的。但是，如果用户只加载了我们的包，`ggplot2`
  函数并不会加载到用户的搜索路径中。函数的示例是作为用户来运行的，因此该函数不可用，R 会抛出一个错误。这里的最佳路径比较复杂。


  我们可以省略这个示例，但那样文档的帮助性就会降低。我们可以将 `ggplot2` 从 `DESCRIPTION` 文件的 `Imports` 字段移动到 `Depends`
  字段。被依赖的包会在加载包之前加载。这种方法的缺点是迫使用户在加载我们的包时必须加载 `ggplot2`。这会增加用户函数被屏蔽的几率，因为它强制加载了许多包。我们也可以确保代码不被运行。最后，我们可以通过添加
  `ggplot2::function()` 来显式地指向 `ggplot2` 包。这样做很繁琐，因为我们在那个示例中使用了几个 `ggplot2` 函数，并且需要在各处添加。然而，这确保了示例能够正常工作，并且避免将
  `ggplot2` 加载到用户的搜索路径上。当然，如果用户愿意，他们可以通过自己显式调用 `library(ggplot2)` 来加载 `ggplot2`。在
  `AdvancedRPkg/R/plot_functions.R` 文件中，我们编辑 `ggplot.lm()` 示例的 roxygen2 代码，如下所示：


  ```r

  ##'' @examples

  ##'' ggplot2::ggplot(

  ##'' lm(mpg ˜ hp * qsec, data = mtcars),

  ##'' ggplot2::aes(hp, mpg, linetype = factor(qsec)),

  ##'' vars = list(

  ##'' hp = min(mtcars$hp):max(mtcars$hp),

  ##'' qsec = round(mean(mtcars$qsec) + c(-1, 1) * sd(mtcars$qsec)), 1)) +

  ##'' ggplot2::geom_ribbon(ggplot2::aes(ymin = LL, ymax = UL), alpha = .2) +

  ##'' ggplot2::geom_line() +

  ##'' ggplot2::theme_bw()

  ```


  接下来，我们重新运行 `check()` 函数：


  ```r

  check(cran = TRUE)

  ```


