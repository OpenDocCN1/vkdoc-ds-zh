  ## 第 13 章：每一朵云都有闪亮的一面


  请注意，在这段代码中，我们没有关注侧面板或主面板之类的区分；相反，我们将用户界面侧（包括请求的输入和生成的输出）都混在了一起。值得注意的是，如果你有侧面板，则需要一个主面板来容纳侧面板未管理的任何输出。


  ### 13.4 在云端托管 Shiny


  最后一项任务是将文件从本地机器传输到云实例。记住，在前面的章节中，我们不仅使用了 PuTTY 在云端安装 Shiny Server，还使用了 WinSCP 将文件上传到云端。我们启动
  WinSCP，重新连接，并确保左侧本地目录位于 Shiny 应用程序文件夹中，而右侧云服务器目录位于 `/home/ubuntu` 下。该过程的结果如图 13-6
  所示。


  接下来，我们访问 PuTTY 并在命令行中依次运行以下代码：


  ```

  $ sudo cp -R ~/PieChart_Time /srv/shiny-server/

  $ sudo cp -R ~/slider_time /srv/shiny-server/

  $ sudo cp -R ~/Upload_hist /srv/shiny-server/

  ```


  这样就剩最后一步了。回想一下，当我们最初设置云实例时，我们小心翼翼地只允许少数端口为少数 IP 地址工作。那时我们为 Shiny 服务器添加了一个条目。你的本地机器
  IP 地址可能已经改变。因此，如果前面的步骤不起作用，请记得进入 AWS *EC2* *控制面板* 并更新你的*安全组*（特别是你的 *AdvancedR 组*）。结果如图
  13-7 所示。


  现在，你可以通过在任意浏览器中输入以下 URL 来验证你的应用程序是否正常工作：


  • [`你的实例.IP.地址:3838/PieChart_Time/`](http://your.instance.ip.address:3838/PieChart_Time/)

  • [`你的实例.IP.地址:3838/slider_time/`](http://your.instance.ip.address:3838/slider_time/)

  • [`你的实例.IP.地址:3838/Upload_hist/`](http://your.instance.ip.address:3838/Upload_hist/)


  如果你希望允许其他人或整个世界访问你的应用程序，请将*入站*源 IP 地址更改为 `0.0.0.0/0`，仅**针对**端口 3838。出于安全考虑，**不要**允许外界访问你的
  *SSH* 端口。当然，如果你现在托管了一个对全世界开放的 3838 端口，你的服务器位置是可见且已知的。因此，不难猜到该地址存在一个 *SSH* 端口。


  如果你希望既能方便地托管面向公众的交互式仪表盘，又能使用 AWS 进行大型计算操作，一种可能的方案是使用两个位于不同安全组的云服务器。一个可以是价格相对较高、拥有众多处理器和大量
  RAM 的实例。你可以对其安全设置进行严格限制，甚至在不进行运算时将其关闭以节省成本。


  另一方面，对于仅向公众提供 Shiny 应用程序服务的需求，可以将其部署在一台始终运行且硬盘上不存储机密数据的低功耗机器上。


  ### 13.5 总结


  使用 Shiny 生态系统，可以让对技术入门门槛较低的用户以互动方式共享 R 分析结果和可视化内容。只要你的用户和消费者熟悉网页浏览器，他们就有机会以超越静态
  PDF 的方式探索你的 R 研究。Shiny 生态系统在不断改进，因此在线查看最近的 vignettes 可能会为你提供所需的新功能，以提升有效传达数据的能力。尽管如此，Shiny
  的基础框架（如本章所示）自本书第一版以来基本保持稳定。因此，根据需要逐步添加和改进你的 Shiny 应用程序是很容易的。在表 13-1 中，我们列出了本章描述的一些关键函数。


  **表 13-1.** 本章描述的关键函数及其功能总结


  | 函数 | 功能 |

  | --- | --- |

  | `shinyApp.R` | Shiny 服务器的单文件模板 |

  | `titlePanel()` | 设置 HTML 页面标题 |

  | `sidebarLayout()` | 开始侧边栏布局 |

  | `sidebarPanel` | 实际的侧边栏面板 |

  | `mainPanel()` | 包含用户的主界面（通常用于显示可视化内容） |

  | `shinyApp()` | 被调用时从 R 运行实际的 Shiny 应用程序 |

  | `numericInput()` | 从用户处收集数字输入并传递给服务器端 |

  | `textInput()` | 从用户处收集文本输入并传递给服务器端 |

  | `checkboxInput()` | 从用户处收集复选框输入并传递给服务器端 |

  | `sliderInput()` | 从用户处收集滑块刻度输入并传递给服务器端 |

  | `fileInput()` | 从用户处收集上传的文件输入并传递给服务器端 |

  | `plotOutput()` | 用户端用于显示图形 |

  | `renderPlot` | 服务器端用于响应式创建图形 |

  | `tableOutput` | 用户端用于显示表格 |

  | `renderTable()` | 服务器端用于响应式创建表格 |

  | `reactive()` | 服务器端用于通用操作的响应式创建器 |


  ## 第 14 章：Shiny 仪表盘示例


  理解本书其他章节并不需要本章内容。虽然我们介绍了一些新技术，但这里的主要内容是一个完整的仪表盘示例，可供修改以满足你的需求。


  这个示例到底有什么作用？它将前一章中使用的应用程序以引人入胜的交互式格式呈现出来。需要记住的是，虽然我们通常以图形输出形式展示这些应用程序，但任何 R 处理过程都可以应用于这些数据。其目的是让信息消费者能够自然地与实时数据进行交互，无论这些消费者是研究评审员、更高层的总监还是董事会成员。


  与前一章类似，我们在 Windows 系统的 RStudio [20] 中介绍这部分内容。我们提供了理解此仪表盘的框架以及一些专业提示。请将这个示例视作一种创意孵化器，而非权威指南。我们希望你能从中找到自己喜欢的内容，更重要的是，意识到如何以最佳方式展示你的数据。


  我们从仪表盘的基本结构开始：


  ```r

  options(width = 70, digits = 2)

  library(knitr)

  library(shiny)

  library(shinydashboard)

  ```


  ### 14.1 仪表盘的基本框架


  回顾一下前一章中我们最小的 Shiny [6] 应用程序：


  ```r

  library(shiny)


  # Define user interface

  ui <- shinyUI(fluidPage())


  # Define server

  server <- shinyServer(function(input, output) {})

  ```


