  \ 3            c\n```\n\n由于计算速度更优，在本书中我们主要使用 R 语言 `data.table` 包 [9] 中的*数据表*对象。数据表与数据框类似，但其设计旨在提高内存效率和运行速度（主要归功于底层更多的\
  \ C++ 代码）。尽管我们推荐使用数据表，但我们也会展示一些使用数据框的例子，因为在使用 R 时，许多历史代码都包含数据框，而且数据表也确实从数据框继承了许多方法（请注意下面最后一行代码显示的是\
  \ `TRUE`）：\n\n## 如果尚未安装，请在需要时运行以下代码行。\n\n`#install.packages(\"data.table\")`\n\n\
  `library(data.table)`\n\n```\n## data.table 1.12.8 using 6 threads (see ?getDTthreads).\
