  \ <bytecode: 0x000002ac901d97f8>\n## <environment: namespace:graphics>\n\n除了为新类编写方法外，有时为现有类编写方法也很有帮助。例如，流行的`ggplot2`包没有用于处理线性模型或回归对象的默认方法。首先，我们使用`mtcars`数据建立一个简单的回归模型。然后，我们通过调用`factor()`预测`mpg`，预测变量包括`hp`、`vs`、它们的交互项（由`hp\
  \ * vs`生成，展开后包括两个主效应及其交互项或乘积项），以及虚拟编码的`cyl`。下面对该对象调用`summary()`显示结果：\n\n```\nm <-\
  \ lm(mpg ~ hp * vs + factor(cyl), data = mtcars)\nsummary(m)\n```\n\n##\n## Call:\n\
  ## lm(formula = mpg ~ hp * vs + factor(cyl), data = mtcars)\n##\n## Residuals:\n\
  ## Min 1Q Median 3Q Max\n## -4.76 -1.44 -0.17 1.59 6.94\n##\n## Coefficients:\n\
  ## Estimate Std. Error t value Pr(>|t|)\n## (Intercept) 26.9291 2.7176 9.91 2.6e-10\
