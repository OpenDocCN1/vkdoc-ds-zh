  \ R 中有对应的功能。另一些则更偏向操作系统层面，而非特定程序。我们在 R 中使用的许多文件管理技巧，都可以通过命令行更快、更自然地完成。\n\n在本节中，我们将探索一些常见且实用的命令，帮助您了解和掌握它们。\n\
  \n您现在是在 `PuTTY` 中，界面看起来大致如图 12-1 所示，屏幕上堆满了文字。\n\n![Image 223](img/index-337_1.png)\n\
  \n***图 12-1.** 初始屏幕显示七项安全更新*\n\n第一个有用的命令是 `clear`，相当于 R 中的 `Ctrl+L`。它可以清空您的当前屏幕，让您轻松查看当前命令及其结果。我们将此命令与\
