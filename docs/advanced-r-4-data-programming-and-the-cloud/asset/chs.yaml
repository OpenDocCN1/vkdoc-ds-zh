  ## 第 11 章 获取你的云服务器


  虽然完整的 CIDR 课程超出了本书的范围，但在此掌握一点相关知识是很有必要的。在“现实生活”中，互联网并不使用像 `joshuawiley.com` 这样的文字地址。相反，它使用一系列
  32 位数字。计算机使用二进制数字而非十进制；它们将我们的网站视为 `01001000.00010010.10011010.00011011`。该唯一地址将我们连接到一台特定的机器（恰好是
  32 个字符长）。`/32` 告诉 AWS 只允许那台机器访问；所有 32 位都是固定的。


  相比之下，对于出站规则，我们需要我们的实例能够自由浏览网络。因此，我们使用 `/0` 来告知其没有固定任何位。如果你处于公司或大学环境中，并希望一些同事能够访问你的实例，请咨询你的
  IT 部门以了解你的地址空间大小。如果我们发现 IP 地址频繁变动，我们可以尝试 `72.18.154.0/24`，这将允许 `72.18.154.0` 到 `72.18.154.255`
  范围内的地址（并且能很好地包含 `.27`）。


  另一个选择是添加一些“重复的”入站规则。换句话说，如果你经常从家里和工作地访问网络，那么你可以添加两个版本的 SSH 端口规则，每个 IP 地址对应一个。


