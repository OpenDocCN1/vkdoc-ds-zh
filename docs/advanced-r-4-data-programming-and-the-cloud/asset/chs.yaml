  \ R 命令组合成一个易于调用且可泛化的函数。函数是 R 的基础。要成为更高级的 R 用户或开发者，深入理解函数是什么以及如何编写它们是至关重要的。广义上讲，函数接收一个或多个输入，对其进行处理，并产生和返回输出。\n\
  \n并非每个编程任务都适合转换成函数。但是，当你发现自己第三次复制粘贴某一行代码时，你就该考虑编写一个函数了。另一个“毫无疑问”需要编写函数的时机，是你的代码超过\
  \ 100 行左右的时候。长段的代码块几乎变得无法阅读和理解。相反，我们编写具有良好、描述性名称的函数，使我们的代码更具可读性。然后，在另一步中，我们使用这些函数来编写代码。这种系统的美妙之处在于，在每个函数内部编写专注于解决挑战中特定部分的代码变得更加容易。这种方法的另一个好处是，如果需要更高的效率，就可以确定哪些函数消耗了最多的处理能力或花费了最长的时间来完成。然后，可以研究如何使该特定阶段更高效。\n\
  \n在本章中，我们使用 Hmisc [10] R 包：\n\n```r\n#install.packages(\"Hmisc\")\nlibrary(Hmisc)\n\
  options(width = 70, digits = 2)\n```\n\n© Matt Wiley and Joshua F. Wiley 2020\n\
  M. Wiley and J. F. Wiley, *高级 R 4 数据编程与云计算*,\n[`doi.org/10.1007/978-1-4842-5973-3_4`](https://doi.org/10.1007/978-1-4842-5973-3_4#DOI)\n\
  \n### 4.1 函数的组成部分\n\n除了一些例外情况，R 中的大多数函数都有三个组成部分：\n\n*   **形式参数**：函数的参数或输入\n*   **函数体**：处理输入的命令\n\
  *   **环境**：函数的位置或上下文，它决定了函数在哪里查找变量\n\n每一个部分都可以使用专用的函数进行检查。首先，我们编写一个示例函数：\n\n```r\n\
  f <- function(x, y = 5) {\n  x + y\n}\n```\n\n该函数接受两个参数：`x` 和 `y`。第一个参数 `x` 没有默认值，但第二个参数\
  \ `y` 默认值为 5。虽然这两个变量很容易看到（部分原因是我们刚编写了这个函数），但可以使用 `formals()` 和 `args()` 函数来检查函数的*形式参数*或参数：\n\
  \n```r\nformals(f)\n## $x\n## \n## \n## $y\n## [1] 5\n\nargs(f)\n## function (x,\
  \ y = 5) \n## NULL\n```\n\n然后，要查看用于处理形式参数的实际 R 代码或命令，我们使用 `body()` 函数：\n\n```r\n\
  body(f)\n## {\n##   x + y\n## }\n```\n\n这些命令总是包含在开括号和闭括号中。在这个例子里，R 代码仅仅是 `x + y`。然而，有些函数有数百行代码。函数的最后一个关键部分是它的环境。函数的环境决定了它在哪里查找变量或对象，这可以包括数据和函数。要查看函数的环境，我们使用\
  \ `environment()` 函数：\n\n```r\nenvironment(f)\n## <environment: R_GlobalEnv>\n```\n\
  \n在这个例子中，该函数位于全局环境中，也就是我们创建函数的地方。对于其他函数，情况会有所不同。例如，如果我们查看 `plot()` 函数的环境，它是 R 默认包含的\
  \ graphics [16] 包的命名空间：\n\n```r\nenvironment(plot)\n```\n```\n\n\n## `<environment:\
  \ namespace:base>`\n\n*译者注：此标题为 R 语言环境标识，保留原文不翻译。*\n\n这为讨论 R 语言函数提供了一个通用语言。在本章的剩余部分，我们将深入探讨如何编写函数，以及可与函数一起使用的特殊代码和工具。\n\
  \n### 4.2 作用域\n\n在 R 语言中，**作用域**决定了在何处查找特定变量。例如，当我们输入 `plot` 时，R 如何解释该代码？它会在哪里查找这个变量？\n\
  \n作用域是 R 语言对**上下文**这一语言概念的实现。如果说“我买了一个新球棒”，你很可能会想到板球棒，而不是一只会飞的哺乳动物。对于 R 来说，上下文来源于作用域和环境。因此，不同的环境可能导致不同的结果。\n\
  \n编写 R 函数的大部分方面与交互式使用 R 并无区别。\n\n但有一个区别：函数拥有自己的环境。此外，函数通常位于**各种**环境中。例如，当交互式使用 R\
  \ 时，几乎所有命令都在全局环境中执行。相比之下，许多函数是作为 R 包的一部分编写的，在这种情况下，函数的环境由该 R 包定义。因此，在开始编写函数之前，理解作用域是很有帮助的。请看以下两个示例：\n\
  \n**plot**\n\n```\n## function (x, y, ...)\n## UseMethod(\"plot\")\n## <bytecode:\
  \ 0x000002ac822a6798>\n## <environment: namespace:base>\n```\n\n```\nplot <- 5\n\
  plot\n```\n\n```\n## [1] 5\n```\n\n在第一个示例中，R 在 `graphics` 包中找到了 `plot`。在第二个示例中，R\
  \ 在全局环境中找到了 `plot`。将 `5` 赋给变量 `plot` 并不会覆盖 `plot()` 函数，而是创建了另一个与该函数同名的 R 变量对象。创建新变量后，当我们在控制台输入\
  \ `plot` 时，R 返回的是数值而非函数，因为赋值操作 `plot <- 5` 发生在全局环境中，而 R 在检查不同包的环境之前会先搜索全局环境。`search()`\
  \ 函数会按照 R 的搜索顺序返回这些环境。您的环境可能有所不同，但可能会存在一些相似之处：\n\n```\nsearch()\n```\n\n```\n##\
  \ [1] \".GlobalEnv\"          \"package:Hmisc\"       \"package:ggplot2\"\n## [4]\
  \ \"package:Formula\"     \"package:survival\"    \"package:lattice\"\n## [7] \"\
  package:writexl\"     \"package:readxl\"      \"package:haven\"\n## [10] \"package:data.table\"\
  \  \"package:knitr\"       \"tools:rstudio\"\n## [13] \"package:stats\"       \"\
  package:graphics\"    \"package:grDevices\"\n## [16] \"package:utils\"       \"\
  package:datasets\"    \"package:methods\"\n## [19] \"Autoloads\"           \"package:base\"\
  \n```\n\n从输出中可以看到，R 首先查找全局环境 `.GlobalEnv`，然后是 `Hmisc` 包，依此类推，直到基础包。我们可以再次使用 `environment()`\
  \ 函数来查看当前环境。R 总是从当前环境或局部环境开始查找，然后逐步推进到父环境。我们可以使用 `parent.env()` 函数来查找给定环境的父环境：\n\
  \n```\nenvironment()\n```\n\n```\n## <environment: R_GlobalEnv>\n```\n\n```\nparent.env(.GlobalEnv)\n\
  ```\n\n```\n## <environment: package:Hmisc>\n## attr(,\"name\")\n## [1] \"package:Hmisc\"\
  \n## attr(,\"path\")\n## [1] \"C:/.../R/win-library/4.0/Hmisc\"\n```\n\n回到函数的话题，每个函数都有其局部环境，同时函数本身也位于某个环境中。以下代码展示了函数的局部环境及其父环境。我们可以粗略地将函数中的变量分为三类：\n\
  \n-   形式参数\n-   函数内部定义的局部变量\n-   既非形式参数也非局部变量的自由变量或其他变量\n\n以下代码依次演示了每种变量：\n\n```\n\
  a <- \"free variable\"\nf <- function(x = \"formal variable\") {\n  y <- \"local\
  \ variable\"\n  e <- environment()\n  print(e)\n  print(parent.env(e))\n  print(a)\n\
  \  print(x)\n  print(y)\n}\nf()\n```\n\n```\n## <environment: 0x000002ac9061f258>\n\
  ## <environment: R_GlobalEnv>\n```\n\n```\n## [1] \"free variable\"\n## [1] \"formal\
  \ variable\"\n## [1] \"local variable\"\n```\n\n变量 `x` 是一个形式参数，其默认值为 `\"formal variable\"\
  `；`y` 是一个在函数体中定义的局部变量；`a` 则是在函数父环境中定义的变量。虽然函数可以依赖搜索路径中的对象，而不是在形式参数或局部变量中定义它，但这并非明智之举。依赖函数父环境或搜索路径进行编码，可能会导致非常棘手的错误和意外行为。这会给用户或将来的自己制造混乱，当环境中某个看似与函数无关的对象被更改时，即使函数的代码和输入看起来没有变化，输出结果也可能突然变得不同。\n\
  \n尽管到目前为止的例子相对简单，但使用嵌套函数调用时，作用域会变得更加棘手。在下面的代码中，预测每段评估代码的结果可能会更难。接下来的示例设置了两个函数，然后使用全局环境中的三个不同变量来调用这些函数：\n\
  \n```\nf1 <- function(y = \"f1 var\") {\n  x <- y\n  a1 <- f2(x)\n  rm(x)\n  a2\
  \ <- f2(x)\n}\nf2 <- function(x) {\n  if (nchar(x) < 10) {\n    x <- \"f2 local\
  \ var\"\n  }\n  print(x)\n  return(x)\n}\nx <- \"global var\"\nf1()\n```\n\n```\n\
  ## [1] \"f2 local var\"\n```\n\n```\n## [1] \"global var\"\n```\n\n```\nx <- \"\
  g var\"\nf1()\n```\n\n```\n## [1] \"f2 local var\"\n## [1] \"f2 local var\"\n```\n\
  \n```\nrm(x)\nf1()\n```\n\n```\n## [1] \"f2 local var\"\n## Error in f2(x): object\
  \ 'x' not found\n```\n\n值得花时间进行作用域的实验，直到理解其原理，因为这是确保找到正确对象的必要条件。在编写和开发一个包，或者使用出现在多个包中的函数时，这可能会是一个特别的挑战。\n\
  \n### 4.3 用于函数的函数\n\n除了编写函数时可以在函数内部使用的常规 R 代码和函数外，还存在一些特殊函数。这些函数通常仅主要用于其他函数内部。即使您是经验丰富的\
  \ R 用户，如果您之前没有编写过函数，这些可能也会让您感到不熟悉。\n\n`match.arg()` 函数可用于对参数进行模糊匹配。这样做还有一个好处：如果一个参数不匹配任何有效选项（因此无效），它会抛出一个错误。以下代码展示了两个相似的函数，其中一个使用了\
  \ `match.arg()` 函数。这些示例演示了模糊匹配以及当使用无效参数时会发生什么：\n\n```\nf1 <- function(type = c(\"\
  first\", \"second\")) {\n  type\n}\nf2 <- function(type = c(\"first\", \"second\"\
  )) {\n  type <- match.arg(type)\n  type\n}\nf1(\"fi\")\n```\n\n```\n## [1] \"fi\"\
  \n```\n\n```\nf2(\"fi\")\n```\n\n```\n## [1] \"first\"\n```\n\n```\nf1(\"test\"\
  )\n```\n\n```\n## [1] \"test\"\n```\n\n```\n\nf2(\"test\")\n```\n\n```\n## Error\
  \ in match.arg(type): 'arg' should be one of \"first\", \"second\"\n```\n\n参数匹配也有助于确保：当传递一个文本字符串时，只使用一个有效的选项；如果未使用有效选项，则会抛出一个信息量丰富的错误。以下代码扩展了我们之前未使用\
  \ `match.arg()` 构建的函数，该函数在 `type = \"first\"` 时计算均值，在 `type = \"second\"` 时计算标准差。但是，当向\
  \ `type` 参数传递一个无效选项时，我们会得到一个相对难以理解的错误消息，提示找不到 `x`：\n\n```\nf1b <- function(type\
  \ = c(\"first\", \"second\")) {\n  if (type == \"first\") {\n    x <- mean(1:5)\n\
  \  } else if (type == \"second\") {\n    x <- sd(1:5)\n  }\n  return(x)\n}\nf1b(\"\
  test\")\n```\n\n\n\n"
- "# 在 `f1b(\"test\")` 中出错：未找到对象 `'x'`\n\n另一个专门用于函数参数的函数是 `missing()`。它返回一个逻辑值，用于指示函数调用中是否缺少某个特定参数。这在编写可能以不同方式使用的函数时很有帮助。下面是一个计算*科恩\
  \ d* 效应量的函数示例。对于单组数据，科恩 d 定义为变量的均值除以标准差。科恩 d 也可以用于重复测量数据，例如在干预前后对同一组进行测量。其计算方法为先计算两个变量的差值，然后按之前的步骤进行。我们使用\
  \ `missing()` 函数来判断用户传递的是单个变量 `x`，还是两个变量 `x` 和 `y`，这样我们的函数就能优雅地处理单样本和重复测量数据的科恩 d\
  \ 计算：\n\n```\ncohend <- function(x, y) {\n  if (!missing(y)) {\n    x <- y - x\n\
  \  }\n  mean(x) / sd(x)\n}\n```\n\n```\ncohend(x = c(0.61, 0.99, 1.47, 1.52, 0.45,\
  \ 3.34, 1.05, -1.47, 1.3, 0.33),\n       y = c(-0.69, 1.6, 0.44, 1, 0.88, 1.17,\
  \ 2.4, 1.21, 0.87, 2.15))\n## [1] 0.095\n```\n\n```\ncohend(x = c(0.61, 0.99, 1.47,\
  \ 1.52, 0.45, 3.34, 1.05, -1.47, 1.3, 0.33))\n## [1] 0.8\n```\n\n与确定函数调用特性相关的另一个函数是\
  \ `match.call()`。`missing()` 确定特定参数是否缺失，`match.arg()` 确定参数是否匹配有效选项之一，而 `match.call()`\
  \ 则捕获整个函数调用。这可能演示起来比解释更容易。下面这个小型函数计算变异系数，即样本标准差除以样本均值。它还通过使用 `match.call()` 捕获并返回函数调用：\n\
  \n```\ncv <- function(x, na.rm = FALSE) {\n  fcall <- match.call()\n  est <- sd(x,\
  \ na.rm = na.rm) / mean(x, na.rm = na.rm)\n  return(list(CV = est, Call = fcall))\n\
  }\n```\n\n```\ncv(1:5)\n## $CV\n## [1] 0.53\n##\n## $Call\n## cv(x = 1:5)\n```\n\
  \n```\ncv(1:8, na.rm = TRUE)\n## $CV\n## [1] 0.54\n##\n## $Call\n## cv(x = 1:8,\
  \ na.rm = TRUE)\n```\n\n在这两个示例的输出中，`match.call()` 精确地捕获了对函数的调用，尽管它添加了显式的参数名称。这对于记录生成特定输出的确切调用有时非常有用。也许最常见的应用场景是在\
  \ R 语言回归模型的输出中。\n\n例如，以下代码展示了一个线性模型，其输出中会回显函数调用，这是通过使用 `match.call()` 实现的：\n\n```\n\
  lm(formula = mpg ~ hp, data = mtcars)\n##\n## Call:\n## lm(formula = mpg ~ hp, data\
  \ = mtcars)\n##\n## Coefficients:\n## (Intercept)         hp\n##    30.0989    \
  \ -0.0682\n```\n\n`return()` 函数通常用于函数末尾以返回特定对象，正如你在之前的一些示例中已经看到的那样，尽管没有明确讨论。然而，`return()`\
  \ 也可以用于从函数内部的任何点返回值，从而终止函数的执行。下面的函数包含一个 `if` 语句，当条件为 TRUE 时，会导致函数提前终止。请注意，当条件不为真时，最终结果甚至没有用\
  \ `return()` 包裹。R 默认返回函数中的最后一个对象，因此并非严格需要显式调用 `return()`：\n\n```\nf <- function(x)\
  \ {\n  if (x < 4) return(\"结束了！\")\n  paste(x, \"- 完成！\")\n}\n```\n\n```\nf(10)\n\
  ## [1] \"10 - 完成！\"\n```\n\n```\nf(3)\n## [1] \"结束了！\"\n```\n\n尽管你可以在函数早期使用 `return()`，但不鼓励这样做，因为这可能会让用户以及其他任何阅读或调试代码的人感到意外。上述代码的效果可以通过使用流程控制来实现：\n\
  \n```\nf <- function(x) {\n  if (x < 4) {\n    \"结束了！\"\n  } else {\n    paste(x,\
  \ \"- 完成！\")\n  }\n}\n```\n\n```\nf(10)\n## [1] \"10 - 完成！\"\n```\n\n```\nf(3)\n\
  ## [1] \"结束了！\"\n```\n\n除了不在函数中途使用 `return()` 之外，有些人认为也不应该在函数末尾使用显式的 `return()`\
  \ 调用，因为它不是必需的。这仍属于个人偏好问题，因为使用它可以有助于提醒注意函数末尾到底返回了什么。\n\n虽然并非专用于函数，但 `invisible()`\
  \ 函数经常与函数返回的对象一起使用。之前我们创建了一个计算变异系数并返回函数调用的函数。我们可以修改该函数，使其打印变异系数并不可见地返回其余部分，如下代码所示。使用\
  \ `invisible()` 意味着，即使函数返回了与之前相同的对象，该对象也不会显示。`invisible()` 函数可能最常用于旨在创建美观输出的函数中，例如对\
  \ `summary()` 或绘图函数的调用。函数的主要目的是显示摘要或图形，但以防有人需要或想要编辑该对象，实际的对象会被不可见地返回，因此可以被捕获并保存以备后用：\n\
  \n```\ncv <- function(x, na.rm = FALSE) {\n  fcall <- match.call()\n  est <- sd(x,\
  \ na.rm = na.rm) / mean(x, na.rm = na.rm)\n  print(est)\n  return(invisible(list(CV\
  \ = est, Call = fcall)))\n}\n```\n\n```\ncv(1:8, na.rm = TRUE)\n## [1] 0.54\n```\n\
  \n```\nres <- cv(1:8, na.rm = TRUE)\n## [1] 0.54\n```\n\n```\nres$Call\n## cv(x\
  \ = 1:8, na.rm = TRUE)\n```\n\n`on.exit()` 函数可用于保证在函数退出或完成时执行一组特定的命令。即使函数发生错误或未按预期正常完成，`on.exit()`\
  \ 中的表达式也会被执行。下面的代码中的这个小函数的下一个用例展示了这一点。一个错误导致函数终止，一旦发生这种情况，`on.exit()` 中的表达式就会被执行。当函数修改其自身之外的任何值时，使用\
  \ `on.exit()` 尤其有价值。例如，有时绘图函数会修改默认绘图参数，并在完成时将它们恢复到原始状态。使用 `on.exit()` 可以确保即使出现问题且函数失败或出错，用户仍然拥有所有原始设置：\n\
  \n```\nf <- function(x) {\n  on.exit(print(\"游戏结束\"))\n  x + 5\n}\n```\n\n```\n\
  f(3)\n## [1] \"游戏结束\"\n## [1] 8\n```\n\n```\nf(\"a\")\n## Error in x + 5: non-numeric\
  \ argument to binary operator\n```\n\n\n\n## [1] \"游戏结束\"\n\n我们介绍的最后一组特定功能函数与向软件或用户发送信号有关。按严重程度排序，它们分别是\
  \ `stop()`、`warning()` 和 `message()`。接下来的例子稍微更贴近实际，它会计算一个变量的均值，该均值既可以在原始尺度上计算，也可以在转换后的尺度上计算，然后再反向转换回均值。对数尺度对异常值的抵抗力相对更强。如果使用了对数变换，示例代码会通过\
  \ `stop()` 函数检查变量是否包含任何负值，这些负值未定义且会导致完全错误。传递给 `stop()` 的参数是要显示的错误信息。`warning()`\
  \ 的处理过程类似，同样需要传递要在警告中显示的信息。警告与错误不同。通过 `stop()` 触发的错误会导致函数停止评估并终止。警告则在函数结束时发出，但函数仍允许继续评估。最后，`message()`\
  \ 可用于向用户发送消息或信号，但与警告不同，它不表示存在真实或潜在的问题。虽然未在示例中展示，但有一个相关的便捷函数 `stopifnot()`，它允许传入一个逻辑表达式，如果表达式计算结果不为真，则会发出错误。尽管此选项具有节省代码量的优点，但缺点是您无法编写自定义错误信息来明确指出具体出了什么问题。\n\
  \n使用警告或消息，而不仅仅是调用 `print()` 或 `cat()` 让函数打印消息，是有益的，原因之一是警告和消息可以通过使用命名恰当的函数 `suppressWarnings()`\
  \ 和 `suppressMessages()` 来（可选地）抑制。所有这些函数均在紧随其后的代码中演示：\n\n```\nf <- function(x, trans\
  \ = c(\"identity\", \"log\")) {\n  trans <- match.arg(trans)\n  if (trans == \"\
  log\") {\n    if (any(x < 0)) stop(\"Log is not defined for negative values\")\n\
  \    if (any(x < 1e-16)) warning(\"Some x values close or equal to zero, results\
  \ may be unstable\")\n    x <- log(x)\n    message(\"x successfully log transformed\"\
  )\n    exp(mean(x))\n  } else {\n    mean(x)\n  }\n}\n```\n\n```\nf(c(1, 2, 100))\n\
  ## [1] 34\n```\n\n```\nf(c(1, 2, 100), trans = \"log\")\n## x successfully log transformed\n\
  ## [1] 5.8\n```\n\n```\nsuppressMessages(f(c(1, 2, 100), trans = \"log\"))\n## [1]\
  \ 5.8\n```\n\n```\nf(c(0, 1, 2, 100), trans = \"log\")\n## Warning in f(c(0, 1,\
  \ 2, 100), trans = \"log\"): Some x values close or equal to zero, results may be\n\
  ## x successfully log transformed\n## [1] 0\n```\n\n```\nsuppressWarnings(f(c(0,\
  \ 1, 2, 100), trans = \"log\"))\n## x successfully log transformed\n## [1] 0\n```\n\
  \n```\nf(c(-1, 1, 2, 100), trans = \"log\")\n## Error in f(c(-1, 1, 2, 100), trans\
  \ = \"log\"): Log is not defined for negative values\n```\n\n\n\n## `f(c(-1, 1,\
  \ 2, 100), trans = \"log\")` 中的错误：负数无法计算对数\n\n### 4.4 调试\n\n到目前为止演示的函数要么运行正常，要么包含易于发现的刻意错误。有时，查找错误（即调试所写代码和函数）的过程会花费更长时间。幸运的是，有一些工具可以帮助我们进行调试，也有一些实践方法可以缩小问题范围。\n\
  \n虽然调试适用于任何代码而不仅仅是函数，但如果没有额外的工具，函数调试可能会特别棘手，因为通常情况下，函数的所有代码都会不间断地执行，我们无法中途查看正在发生的事情。\n\
  \n在本节中，我们将编写一个函数，该函数使用一个公式，通过 `tapply()`（你在第 3 章中学习过）来计算一个变量在另一个变量不同水平上的均值；然后，该函数使用以下代码绘制原始数据，并用更大的点表示均值，如图\
  \ 4-1 所示。\n\n```\nmeanPlot <- function(formula, d) {\n  v <- all.vars(formula)\n\
  \  m <- tapply(d[, v[1]], d[, v[2]],\n              FUN = mean, na.rm = TRUE)\n\
  \  plot(formula, data = d, type = \"p\")\n  points(x = unique(d[, v[2]]), y = m,\n\
  \         col = \"blue\", pch = 16, cex = 2)\n}\nmeanPlot(mpg ~ cyl, d = mtcars)\n\
  ```\n\n**图 4-1.** 尚未完善的 `meanPlot()`\n\n这些均值看起来有些不正确。当 `cyl = 8` 时，点的均值看起来没问题；然而，其他两个均值似乎落在了极端值上。`debug()`\
  \ 函数允许我们调试一个函数，并单步执行每一行代码。\n\n要使用它，我们首先在要调试的函数上调用 `debug()`：\n\n```\ndebug(meanPlot)\n\
  ```\n\n然后，当我们使用原始函数时，它会触发 R 进入调试模式。在第一步，R 会通过进入调试模式告知我们正在调试的函数调用及其位置。这会将控制台从 `>`\
  \ 变为 `Browse[2]>`，调试命令包括使用 `ENTER`（或 `RETURN`）键逐步执行，或使用 `Q` 退出调试（这在调试较长的函数时很有帮助）。此外，由于调试是一次一步地执行函数的操作，我们可以在控制台运行代码来查看变量在不同阶段的状态。由于\
  \ `debug` 的交互特性，最好在自己的计算机上实时操作——不过我们会在这里解释你会看到什么。我们确实在图 4-2 中包含了一个你可能看到的输出示例。\n\n\
  运行以下代码行 `meanPlot(mpg ~ cyl, d = mtcars)` 后，调试模式启动，如图 4-2 中阶段 1 所示，由 `debug at #1`\
  \ 指示。此外，在 RStudio 中，环境窗口会聚焦于 `meanPlot()`。继续在 `Browse[2]>` 处按 `ENTER` 或 `RETURN`，直到到达阶段\
  \ 7 或附近，此时出现 `debug at #7: points(x = unique(d[, v[2]]), y = m, col = \"blue\",\
  \ pch = 16, cex = 2)` —— 这就是均值点添加到图中的步骤。在该阶段，检查传入点图的变量。通过运行 `Browse[2]> unique(d[,\
  \ v[2]])` 来完成此操作。这表明 `x` 轴变量的顺序是错误的！在看到函数代码中的这个错误后，在调试浏览器中输入大写 `Q` 以退出调试模式：\n\n\
  **图 4-2.** `debug()` 的截图\n\n```\nmeanPlot(mpg ~ cyl, d = mtcars)\n```\n\n我们现在知道问题出在哪里，并通过\
  \ `Q` + `ENTER` 退出了调试模式。我们通过首先对数据进行排序来修复函数，以便 `tapply()` 和 `unique()` 以相同的顺序给出结果。代码如下所示，结果如图\
  \ 4-3 所示。\n\n```\nmeanPlot <- function(formula, d) {\n  v <- all.vars(formula)\n\
  \  d <- d[order(d[, v[2]]), ] # 此行通过先排序进行了修复！\n  m <- tapply(d[, v[1]], d[, v[2]],\n\
  \              FUN = mean, na.rm = TRUE)\n  plot(formula, data = d, type = \"p\"\
  )\n  points(x = unique(d[, v[2]]), y = m,\n         col = \"blue\", pch = 16, cex\
  \ = 2)\n}\nmeanPlot(mpg ~ cyl, d = mtcars)\n```\n\n如果你在调试函数时不想单步执行每一行代码，可以将 `browser()`\
  \ 函数插入到函数代码中。然后，当函数执行到该点时，会调用一个浏览器，你可以检查函数局部环境中变量的当前状态。在以下示例代码中，我们在函数中添加了对 `browser()`\
  \ 的调用。运行 `meanPlot(mpg ~ cyl, d = mtcars)` 后，在随后出现的浏览器中，我们按一次 `ENTER`，然后使用 `ls()`\
  \ 检查当前可用的对象，接着查看对象 `v` 的内容，最后输入大写 `Q` 退出调试。由于浏览器是交互式的，我们在图 4-4 中显示了控制台的大致输出。\n\n\
  ```\nmeanPlot <- function(formula, d) {\n  v <- all.vars(formula)\n  d <- d[order(d[,\
  \ v[2]]), ] ## 先排序\n  m <- tapply(d[, v[1]], d[, v[2]],\n              FUN = mean,\
  \ na.rm = TRUE)\n  browser()\n  plot(formula, data = d, type = \"p\")\n  points(x\
  \ = unique(d[, v[2]]), y = m,\n         col = \"blue\", pch = 16, cex = 2)\n}\n\
  meanPlot(mpg ~ cyl, d = mtcars)\n```\n\n**图 4-3.** 现已完善的 `meanPlot()`\n\n**图 4-4.**\
  \ `browser()` 的截图\n\n在交互式调试时，一个有用的函数是 `traceback()`。例如，如果你调用一个函数（如 `lm()`）然后收到一条错误消息，有时很难确切知道错误发生的位置或原因。该错误通常甚至不是直接来自你调用的函数，因为你经常使用的函数可能会在内部调用许多其他函数。以下示例展示了如何在导致错误的代码之后立即使用\
  \ `traceback()` 来做到这一点。输出显示了调用堆栈，追踪了从初始调用到生成错误的最终代码的路径。如果你需要查看代码以确定错误发生的原因，这些信息可能很有用：\n\
  \n```\nlm(mpg ~ jack, data = mtcars)\n## Error in eval(predvars, data, env): object\
  \ 'jack' not found\n\ntraceback()\n## 7: eval(predvars, data, env)\n## 6: eval(predvars,\
  \ data, env)\n## 5: model.frame.default(formula = mpg ~ jack, data = mtcars, drop.unused.levels\
  \ = TRUE)\n## 4: stats::model.frame(formula = mpg ~ jack, data = mtcars, drop.unused.levels\
  \ = TRUE)\n## 3: eval(mf, parent.frame())\n## 2: eval(mf, parent.frame())\n```\n\
  \n\n\n### 1： `lm(mpg ˜ jack, data = mtcars)`\n\n在这个例子中，错误产生的原因是 `jack` 不是 `mtcars`\
  \ 数据框的列名。\n\n## 第 4 章 编写函数\n\n最后，有时代码中的错误并不在你自己的代码里，而在于你使用的其他代码，例如来自另一个 R 包。虽然在官方推荐的\
  \ R 包中发现错误的情况很少见，但在成千上万个其他 R 包中，这种情况则更为普遍。此外，有时问题本身并非真正的 bug，而是你使用函数的方式与原始作者设想的使用方式之间存在差异。尽管\
  \ CRAN 上所有 R 包的源代码都公开可下载和编辑，但为了验证仅仅修改某个函数中的一个小细节能否解决问题，就去下载整个包的源代码、进行编辑并重新安装，这可能会非常麻烦。\n\
  \n请思考下面的挑战。假设你使用的数据中，出于某些原因偶尔会包含无穷值，而你想只保留有限值的情况。下面的代码展示了使用 `Hmisc` 包中的 `wtd.quantile()`\
  \ 函数的一个示例：\n\n```\nwtd.quantile(c(1, 2, 3, Inf, NA),\n             weights = c(.6,\
  \ .9, .4, .2, .6))\n```\n\n## *0% 25% 50% 75% 100%*\n\n## **NaN Inf Inf Inf Inf**\n\
  \n查看 `wtd.quantile()` 的代码，我们发现其主要计算由另一个函数 `wtd.table()` 完成，如下所示：\n\n```\nwtd.quantile\n\
  ## function (x, weights = NULL, probs = c(0, 0.25, 0.5, 0.75, 1),\n##          \
  \ type = c(\"quantile\", \"(i-1)/(n-1)\", \"i/(n+1)\", \"i/n\"), normwt = FALSE,\n\
  ##           na.rm = TRUE)\n## {\n##     if (!length(weights))\n##         return(quantile(x,\
  \ probs = probs, na.rm = na.rm))\n##     type <- match.arg(type)\n##     if (any(probs\
  \ < 0 | probs > 1))\n##         stop(\"Probabilities must be between 0 and 1 inclusive\"\
  )\n##     nams <- paste(format(round(probs * 100, if (length(probs) >\n##      \
  \   1) 2 - log10(diff(range(probs))) else 2)), \"%\", sep = \"\")\n##     i <- is.na(weights)\
  \ | weights == 0\n##     if (any(i)) {\n##         x <- x[!i]\n##         weights\
  \ <- weights[!i]\n##     }\n##     if (type == \"quantile\") {\n##         w <-\
  \ wtd.table(x, weights, na.rm = na.rm, normwt = normwt,\n##             type = \"\
  list\")\n##         x <- w$x\n##         wts <- w$sum.of.weights\n##         n <-\
  \ sum(wts)\n##         order <- 1 + (n - 1) * probs\n##         low <- pmax(floor(order),\
  \ 1)\n##         high <- pmin(low + 1, n)\n##         order <- order%%1\n##    \
  \     allq <- approx(cumsum(wts), x, xout = c(low, high), method = \"constant\"\
  ,\n##             f = 1, rule = 2)$y\n##         k <- length(probs)\n##        \
  \ quantiles <- (1 - order) * allq[1:k] + order * allq[-(1:k)]\n##         names(quantiles)\
  \ <- nams\n##         return(quantiles)\n##     }\n##     w <- wtd.Ecdf(x, weights,\
  \ na.rm = na.rm, type = type, normwt = normwt)\n##     structure(approx(w$ecdf,\
  \ w$x, xout = probs, rule = 2)$y,\n##         names = nams)\n## }\n## <bytecode:\
  \ 0x000002ac904e4750>\n## <environment: namespace:Hmisc>\n```\n\n采用同样的方法，我们来检查 `wtd.table()`\
  \ 函数。在检查过程中，我们发现虽然它能自动移除缺失值，但对于非有限值却没有检查或移除的方法：\n\n```\nwtd.table\n## function (x,\
  \ weights = NULL, type = c(\"list\", \"table\"), normwt = FALSE,\n##     na.rm =\
  \ TRUE)\n## {\n##     type <- match.arg(type)\n##     if (!length(weights))\n##\
  \         weights <- rep(1, length(x))\n##     isdate <- testDateTime(x)\n##   \
  \  ax <- attributes(x)\n##     ax$names <- NULL\n##     if (is.character(x))\n##\
  \         x <- as.factor(x)\n##     lev <- levels(x)\n##     x <- unclass(x)\n##\
  \     if (na.rm) {\n##         s <- !is.na(x + weights)\n##         x <- x[s, drop\
  \ = FALSE]\n##         weights <- weights[s]\n##     }\n##     n <- length(x)\n\
  ##     if (normwt)\n##         weights <- weights * length(x)/sum(weights)\n## \
  \    i <- order(x)\n##     x <- x[i]\n##     weights <- weights[i]\n##     if (anyDuplicated(x))\
  \ {\n##         weights <- tapply(weights, x, sum)\n##         if (length(lev))\
  \ {\n##             levused <- lev[sort(unique(x))]\n##             if ((length(weights)\
  \ > length(levused)) && any(is.na(weights)))\n##                 weights <- weights[!is.na(weights)]\n\
  ##             if (length(weights) != length(levused))\n##                 stop(\"\
  program logic error\")\n##             names(weights) <- levused\n##         }\n\
  ##         if (!length(names(weights)))\n##             stop(\"program logic error\"\
  )\n##         if (type == \"table\")\n##             return(weights)\n##       \
  \  x <- all.is.numeric(names(weights), \"vector\") 86\n##         if (isdate)\n\
  ##             attributes(x) <- c(attributes(x), ax)\n##         names(weights)\
  \ <- NULL\n##         return(list(x = x, sum.of.weights = weights))\n##     }\n\
  ##     xx <- x\n##     if (isdate)\n##         attributes(xx) <- c(attributes(xx),\
  \ ax)\n##     if (type == \"list\")\n##         list(x = if (length(lev)) lev[x]\
  \ else xx, sum.of.weights = weights)\n##     else {\n##         names(weights) <-\
  \ if (length(lev))\n##             lev[x]\n##         else xx\n##         weights\n\
  ##     }\n## }\n## <bytecode: 0x000002ac904f2cc8>\n## <environment: namespace:Hmisc>\n\
  ```\n\n也许直接修改数据看起来更简单，但有时数据是自动生成并传递过来的，因此修改函数可能比修改数据更简便。我们可以直接将 `wtd.table()` 的代码复制粘贴到编辑器中并进行修改，如下所示：\n\
  \n```\nrevised.wtd.table <- function (x, weights = NULL, type = c(\"list\",\n  \
  \  \"table\"), normwt = FALSE, na.rm = TRUE)\n{\n    type <- match.arg(type)\n \
  \   if (!length(weights))\n        weights <- rep(1, length(x))\n    isdate <- testDateTime(x)\n\
  \    ax <- attributes(x)\n    ax$names <- NULL\n    if (is.character(x))\n     \
  \   x <- as.factor(x)\n    lev <- levels(x)\n    x <- unclass(x)\n    if (na.rm)\
  \ {\n        s <- !is.na(x + weights) & is.finite(x + weights) ##此处为修复点\n      \
  \  x <- x[s, drop = FALSE]\n        weights <- weights[s]\n    }\n    n <- length(x)\n\
  \    if (normwt)\n        weights <- weights * length(x)/sum(weights)\n    i <-\
  \ order(x)\n    x <- x[i]\n    weights <- weights[i]\n    if (anyDuplicated(x))\
  \ {\n        weights <- tapply(weights, x, sum)\n        if (length(lev)) {\n  \
  \          levused <- lev[sort(unique(x))]\n            if ((length(weights) > length(levused))\
  \ && any(is.na(weights)))\n                weights <- weights[!is.na(weights)]\n\
  \            if (length(weights) != length(levused))\n                stop(\"program\
  \ logic error\")\n            names(weights) <- levused\n        }\n        if (!length(names(weights)))\n\
  \            stop(\"program logic error\")\n        if (type == \"table\")\n   \
  \         return(weights)\n        x <- all.is.numeric(names(weights), \"vector\"\
  )\n        if (isdate)\n            attributes(x) <- c(attributes(x), ax)\n    \
  \    names(weights) <- NULL\n        return(list(x = x, sum.of.weights = weights))\n\
  \    }\n    xx <- x\n    if (isdate)\n        attributes(xx) <- c(attributes(xx),\
  \ ax)\n    if (type == \"list\")\n        list(x = if (length(lev)) lev[x] else\
  \ xx, sum.of.weights = weights)\n    else {\n        names(weights) <- if (length(lev))\n\
  \            lev[x]\n        else xx\n        weights\n    }\n}\n```\n\n与原始的 `wtd.table()`\
  \ 函数不同，修改后的函数完全按照我们的预期工作：\n\n```\nwtd.table(c(1, 2, 3, Inf, NA),\n          weights\
  \ = c(.6, .9, .4, .2, .6))\n## $x\n## [1] 1 2 3 Inf\n##\n## $sum.of.weights\n##\
  \ [1] 0.6 0.9 0.4 0.2\n\nrevised.wtd.table(c(1, 2, 3, Inf, NA),\n              \
  \    weights = c(.6, .9, .4, .2, .6))\n## $x\n## [1] 1 2 3\n##\n## $sum.of.weights\n\
  ```\n\n\n\n## [1] 0.6 0.9 0.4\n\n然而，挑战在于`wtd.quantile()`函数；而其他使用`wtd.table()`的 Hmisc\
  \ 函数仍然无法按预期工作，因为它们并未调用我们修改后的函数。在全局环境中将函数赋值给`wtd.table()`这一名称是不够的，因为作用域规则意味着 Hmisc\
  \ 函数会优先从 Hmisc 环境（而非我们的全局环境）中查找`wtd.table()`函数。这就像你的电脑上有两个同名文件，但位于不同文件夹中。为了使所有使用`wtd.table()`的\
  \ Hmisc 函数都能调用我们修改后的函数，我们不仅需要正确命名它，还需要将其放置在正确的位置。我们可以通过`assignInNamespace()`函数将对象分配到特定命名空间：\n\
  \n## 第 4 章 编写函数\n\n```\nassignInNamespace(x = \"wtd.table\", #使用其他所有 Hmisc 函数中预期的名称\n\
  \                  value = revised.wtd.table, #强制使用我们修改后的函数\n                  ns\
  \ = \"Hmisc\") #在 Hmisc 的命名空间中\n```\n\n```\nwtd.quantile(c(1, 2, 3, Inf, NA),\n\
  \             weights = c(.6, .9, .4, .2, .6))\n```\n\n## *0% 25% 50% 75% 100%*\n\
  \n## 2.0 2.2 2.4 2.7 2.9\n\n```\nwtd.Ecdf(c(1, 2, 3, Inf, NA),\n         weights\
  \ = c(.6, .9, .4, .2, .6))\n```\n\n## $x\n\n## [1] 1 1 2 3\n\n##\n\n## $ecdf\n\n\
  \n\n[1] 0.00 0.32 0.79 1.00\n\n尽管 `assignInNamespace()` 函数没有输出，但我们可以发现，在此之后，`wtd.quantile()`\
  \ 函数以及依赖 `wtd.table()` 的其他函数（如 `wtd.Ecdf()`）都按我们预期的方式正常运行了。关于 `assignInNamespace()`\
  \ 有一个注意事项：你不能将任何对象分配给该命名空间中尚不存在的对象（即，你只能覆盖已存在的对象）。此外，在任何你可能想要提交到 CRAN 的包中，都不允许使用\
  \ `assignInNamespace()`（更多内容见第 6 章）。即使这种方法有时很方便，但如果大家都将其作为常规做法，就会造成混乱。如果出现这种情况，包\
  \ A 中函数的定义将取决于你是否加载了包 B，因为包 B 可以覆盖（不仅仅是屏蔽）包 A 中的函数定义。请注意，你通过这种方式所做的任何更改都是临时性的，当你重启\
  \ R 时会消失。然而，这可以成为调试现有包的一个有用技术，因为这是一种相对简单的方法，可以确保使用 `wtd.quantile()` 时遇到的问题确实通过建议对\
  \ `wtd.table()` 的修改而得到了“修复”。此时，如果这确实是一个错误，或者仅仅是一个期望的功能，你可以自信地给包维护者发送邮件，建议进行修改，因为你的建议代码是可行的。若要查看当前的包维护者，运行\
  \ `maintainer(\"Hmisc\")`，并将 `Hmisc` 替换为你感兴趣的包名称即可。\n\n"
- '# 第 4 章 编写函数


  ## 4.5 小结


  本章我们涉及了许多函数以及与函数相关的诸多内容！如果你需要复习任何特定函数，表 4-1 列出了本章介绍的关键函数，并提供了每个函数的简要说明。当然，你可以在官方帮助文件中查找更多信息。


  虽然函数各个部分的正式名称并非至关重要，但学习如何高效地使用和编写函数，可能是你在学习 R 过程中做出的最好投资之一。编写函数提供了一种摆脱编写重复代码的方法。虽然没有严格的规则，但如果你发现自己经常执行相同的任务，那么很值得为此编写一个函数。这可能是一项涉及多个步骤的大任务，也可能是一项小任务。例如，在心理学中，通常会报告连续变量的“高”值和“低”值，这些值通常定义为均值加减
  1 个标准差。在 R 中，使用 `mean()` 和 `sd()` 函数很容易实现这一点。如果你经常这样做，那么编写一个简短的单行函数可能是值得的，这样你就不需要输入
  `mean(x) + sd(x)`，而只需输入 `msd(x)` 或你给函数起的任何名字。如果你在玩转函数和编写自己的函数方面还不熟练，那么在进入第 5 章和第
  6 章之前最好多加练习，因为这两章假设你对函数已经驾轻就熟。


  ### 表 4-1. 本章所述关键函数及其功能总结


  | **函数** | **功能** |

  | --- | --- |

  | `formals()` | 允许你查看构建的函数的形式参数。 |

  | `args()` | 显示已创建函数参数的默认值和名称。 |

  | `body()` | 显示函数体。 |

  | `environment()` | 显示函数所在的环境（目前为止，通常是全局环境）。 |

  | `search()` | 显示函数的搜索顺序。请记住，其他人可能已经使用了你的函数名！ |

  | `parent.env()` | 接受一个环境，并向上追踪一级。 |

  | `match.arg()` | 允许对函数参数进行模糊匹配。 |

  | `missing()` | 测试是否有值传递给函数。请注意，在 `match.arg()` 之后，此函数将返回 `false`。 |

  | `match.call()` | 捕获整个函数调用；常用于回归分析。 |

  | `return()` | 不是必需的，可能有些争议，如果使用，务必作为新函数的最后一部分。 |

  | `invisible()` | 抑制输出。 |

  | `on.exit()` | 无论函数执行成功还是失败，都会执行其参数。 |

  | `stop()`、`stopifnot()`、`warning()`、`message()` | 这些是不同严重级别的错误，从完全停止并报错，到较温和的警告，再到基本上礼貌的消息。
  |

  | `suppressWarnings()`、`suppressMessages()` | 这两个函数的作用正如其名。一旦你熟悉了一个函数，警告或消息可能会变得冗余或可以被安全忽略。
  |

  | `debug()` | 使用此函数开始调试工作不正常的函数。 |

  | `browser()` | 此函数进入函数体，正好在你想要调试的部分之前。 |

  | `traceback()` | 提供导致错误来源的表达式列表。 |

  | `assignInNamespace()` | 允许用本地编写的函数临时替换一个函数。 |

  | `maintainer()` | 在包上调用，显示用于故障排除的联系人姓名和电子邮件。 |


