  \ `rowMeans()` 函数。我们利用逻辑值存储为 `FALSE = 0` 和 `TRUE = 1` 这一事实。因此，我们测试字符数据是否等于 `1 -\
  \ YES`，这会返回一个布尔值，然后取这些逻辑值的行均值。我们通过设置 `na.rm = TRUE` 来忽略（剔除）缺失值：\n\n```\nd[, HealthConditions\
  \ := rowMeans(d[, v.health, with = FALSE] == \"1 - YES\", na.rm = TRUE)]\n```\n\n\
  ```\ntable(round(d$HealthConditions, 2),\n      useNA = 'ifany')\n## \n##     0\
  \  0.11  0.12  0.14  0.17   0.2  0.22  0.25  0.29  0.33  0.38 \n## 77426 16116 \
  \  239    20     5   676  4386   156    11  1933    75 \n##   0.4  0.43  0.44  \
  \ 0.5  0.56  0.57   0.6  0.62  0.67  0.71  0.75 \n##    81    12   768    51   264\
  \     3     3    13    80     1     5 \n##  0.78  0.88  0.89   NaN \n##    19  \
  \   1     3     6\n```\n\n我们可以遵循类似的过程来获取行计数。然而，查看计数时，发现出现了一些状况：没有缺失值了！这是因为在使用 `rowSums()`\
  \ 时，当 `na.rm = TRUE` 且某行没有有效数据时，其和为零，而非缺失值。为了纠正这一点，我们需要手动将所有值都缺失的行/案例设置为缺失：\n\n\
  ```\nd[, NHealthConditions := rowSums(d[, v.health, with = FALSE] == \"1 - YES\"\
