- "# 第 1 章：编程基础\n\n与大多数语言一样，要成为高级用户，需要对底层结构或规则有额外的理解。通过 R 进行数据科学非常强大，本章将讨论此类编程基础，包括`对象`、`运算符`和`函数`。\n\
  \n在深入探讨 R 之前，遵循一些通用原则或许正合时宜。首先，动手实验是好的。亲自动手学习远比仅仅阅读更有效。请下载本书附带的源文件，并尝试新事物！\n\n其次，熟悉`?`函数会大有裨益。只需在\
  \ R 控制台中输入`?`，紧接着输入文本，即可调出某种帮助——例如，`?sum`。我们稍后会详细介绍函数，但这个功能太有用了，不能等到那时才了解。使用你最喜欢的搜索引擎也是明智之举（例如搜索字符串：`R\
  \ sum na`）。虽然记住一些东西可能有所帮助，但编程很大程度上在于掌握有效搜索的技能。\n\n最后，在我们真正切入你购买本书的初衷之前，有一点提醒：这是一本应用型书籍。我们的目标是让你尽快掌握一些实用技能并上手操作。对大多数这些主题（甚至尤其本章中的概念）进行严格深入的探讨是值得的，但这超出了本书的范围。\n\
  \n## 1.1 软件选择与可重复性\n\n本书面向 R 语言经验较为丰富的用户，我们假定读者熟悉 R 的安装。为完整起见，我们在表 1-1 中列出了本书通篇使用的主要软件。各个\
  \ R 包将在需要使用的章节中介绍。有关设置亚马逊云计算实例的具体细节，也将在相关云计算章节中逐步说明。\n\n© Matt Wiley 和 Joshua F.\
  \ Wiley 2020\nM. Wiley 和 J. F. Wiley，《高级 R 4 数据编程与云计算》，\n[`doi.org/10.1007/978-1-4842-5973-3_1`](https://doi.org/10.1007/978-1-4842-5973-3_1#DOI)\n\
  \n**表 1-1.** 高级 R 技术栈\n\n| 软件            | 网址                                  \
  \                         |\n|----------------|----------------------------------------------------------------|\n\
  | R 4.0.0        | [`cran.r-project.org/`](https://cran.r-project.org/)     |\n\
  | RStudio 1.3.959| [`rstudio.com/products/rstudio/download/`](https://rstudio.com/products/rstudio/download/)\
  \ |\n| Windows 10     | [www.microsoft.com/](http://www.microsoft.com/)        \
  \        |\n| Java 14        | [www.oracle.com/technetwork/java/javase/overview/index.html](http://www.oracle.com/technetwork/java/javase/overview/index.html)\
  \ |\n| Amazon Cloud   | [`aws.amazon.com/`](https://aws.amazon.com/)           \
  \  |\n| Ubuntu         | [`ubuntu.com/download`](https://ubuntu.com/download)  \
  \   |\n\n如需在 Windows 或 Macintosh 系统上完整了解如何安装 R 和 RStudio，请参阅我们的《*初学 R*》[37]一书。\n\
  \n## 1.2 复现结果\n\nR 的一个有用特性是拥有大量由全球专家编写的包。但这也可能成为使用 R 的致命弱点：从 R 本身的版本到特定包的版本，大量代码的具体细节都在不断变化。你的代码都有可能无法日复一日正常工作，更不用说我们在本书出版前数周甚至数月前编写的代码了。\n\
  \n后续章节中使用的所有代码都将托管在 GitHub 上。那里的代码可能比本书印刷的内容更新。如果书中的代码因包版本变化或 R 基础版本变化而无法运行，请访问本书的\
  \ GitHub 站点：\n\n```r\noptions(\n  width = 70,\n  stringsAsFactors = FALSE,\n  digits\
  \ = 2)\n```\n\n## 1.3 对象类型\n\n首先，我们需要一些元素来构建我们的语言，在 R 中，这些元素被称为对象。我们从五种非常常见的对象类型开始。\n\
  \n`逻辑型`对象只取两个值：`TRUE` 或 `FALSE`。计算机是二进制机器，数据常常可以在一个“全有或全无”的世界中进行记录和建模。这些逻辑值可能很有用，其中\
  \ `TRUE` 的值为 1，`FALSE` 的值为 0。\n\n提醒一下，`#`（例如井号或话题标签）是代码*注释*的指示符。`#` 后面的单词不会被 R 处理，旨在帮助读者理解：\n\
  \n```r\nTRUE  ## 逻辑型\n## [1] TRUE\n\nFALSE ## 逻辑型\n## [1] FALSE\n```\n\n正如你可能从大学代数老师快速嘟囔的评论中记得的那样，数字有许多种。包括零和负值的整数被称为*整型*。在集合表示法中，也就是\
  \ ... , -2, -1, 0, 1, 2, ... ，这些数字对于人数计算或其他索引非常有用。在 R 中，整型有一个大写字母 `L` 后缀。如果需要小数，则需要使用双精度浮点型对象。这些数字适用于比率数据类型。复数也具有有用的性质，并且你可以完全按预期理解它们，在虚数部分加上\
  \ `i` 后缀。R 在使用所有这些数字时非常友好，你只需输入所需的数字（记得在需要时加上 `L` 或 `i` 后缀）：\n\n```r\n42L    ##\
  \ 整型\n## [1] 42\n\n1.5    ## 双精度浮点型\n## [1] 1.5\n\n2+3i   ## 复数\n## [1] 2+3i\n```\n\
  \n定类数据可以通过字符类存储，并用引号指定：\n\n```r\n\"a\"    ## 字符型\n## [1] \"a\"\n```\n\n当然，数值数据可能包含缺失值。这些缺失值的类型与该数据集中其余数据的类型一致（我们稍后讨论数据存储）。尽管如此，了解如何手动编写逻辑型、整型、双精度浮点型、复数或字符型的缺失值仍会有帮助：\n\
  \n```r\nNA              ## 逻辑型\n## [1] NA\n\nNA_integer_     ## 整型\n## [1] NA\n\n\
  NA_real_        ## 双精度浮点型/数值型\n## [1] NA\n\nNA_character_   ## 字符型\n## [1] NA\n\n\
  NA_complex_     ## 复数型\n## [1] NA\n```\n\n`因子型`是一种特殊的对象，在通用编程中不太常用，但在统计学中使用频率相当高。因子变量指示该变量应被视为离散值。因子以整数形式存储，并附带标签来指示原始值：\n\
  \n```r\nfactor(1:3)\n## [1] 1 2 3\n## 水平: 1 2 3\n\nfactor(c(\"alice\", \"bob\",\
  \ \"charlie\"))\n## [1] alice bob charlie\n## 水平: alice bob charlie\n\nfactor(letters[1:3])\n\
  ## [1] a b c\n## 水平: a b c\n```\n\n我们现在转向数据结构，它可以存储我们已讨论过（当然还有更多）类型的对象。*向量*是一种相对简单的数据存储对象。创建向量的一种简单方法是使用连接函数\
  \ `c()`：\n\n```r\n## 向量\nc(1, 2, 3)\n```\n\n\n\n"
- "# 1 2 3\n\n如同数学中，*标量*就是长度为 1 的向量。而在连续谱系的另一端，*矩阵*则是一个同时拥有行和列维度的向量。\n\n请注意矩阵填充数字\
  \ 1 至 6 的方式，是按列逐次填充的：\n\n## 标量只是一个**长度**为 1 的向量\n\n`c(1)`\n\n```\n## [1] 1\n```\n\
  \n## 矩阵是一个带有维度的向量\n\n`matrix(c(1:6), nrow = 3, ncol = 2)`\n\n```\n##      [,1] [,2]\n\
  ## [1,]    1    4\n## [2,]    2    5\n## [3,]    3    6\n```\n\n所有向量，无论是标量、向量还是矩阵，都只能包含一种数据类型（例如，整数型、逻辑型或复数型）。如果需要存储多种类型的数据，那么将数据存放在列表中可能更合适。列表是一个对象向量，其中的每一个元素可以是不同类型。在下面的例子中，我们构建了一个包含字符型、向量型和矩阵型元素的列表：\n\
  \n## 向量和矩阵只能有一种**类型**的数据（例如，整数型、逻辑型等）\n\n## 列表是一个对象向量\n\n## 列表的每个元素可以包含不同**类型**的对象\n\
  \n`list(\n  c(\"a\"),\n  c(1, 2, 3),\n  matrix(c(1:6), nrow = 3, ncol = 2)\n)`\n\
  \n```\n## [[1]]\n## [1] \"a\"\n##\n## [[2]]\n## [1] 1 2 3\n##\n## [[3]]\n##    \
  \  [,1] [,2]\n## [1,]    1    4\n## [2,]    2    5\n## [3,]    3    6\n```\n\n一种特殊的列表是*数据框*，其中列表的每一个元素**长度**相同（尽管对象类型不必相同）。借助更简单对象的基础构件，可以演化出更复杂的结构。请看下面带有输出的说明性示例：\n\
  \n## 数据框是列表的一种特殊**类型**\n\n## 其中列表的每个元素**长度**相同\n\n`data.frame(1:3, 4:6)`\n\n```\n\
