  table\"\n\n分配多个类的价值在于提供一种回退机制，主要针对方法而言。例如，如果你创建了一个新类，它是表格或数据框的变体，你可以为打印行为编写专门的方法，但对于其他函数（如绘图或汇总），则可以依赖原始类的方法。\n\
  \n你可以编写的类类型几乎是无穷无尽的。一个简单的起点是创建现有类的特殊或增强版本。在下面的例子中，我们创建了一个 `data.frame` 的特殊情况，它包含\
  \ `x` 和 `y` 坐标以及文本标签，称为 `textplot`。“创建”这个类最简单的方法是先创建一个 `data.frame`，然后更改其类。如果我们只使用新的类标签，调用\
  \ `print()` 函数将使用默认方法；但如果我们同时将其标记为新的 `textplot` 标签并次要地标记为 `data.frame`，那么调用 `print()`\
  \ 会回退到 `data.frame` 的方法：\n\n```\nd <- data.frame(\n  x = c(1, 3, 5),\n  y = c(1,\
