  \n**第 6 章 编写 R 包**\n\n编写包可能是一个复杂的过程。熟悉最终产品可能会有所帮助，该产品可在 [`github.com/JWiley/AdvancedRPkg`](https://github.com/JWiley/AdvancedRPkg)\
  \ 在线获取。您也可以在 [`joshuawiley.com/AdvancedRPkg`](http://joshuawiley.com/AdvancedRPkg)\
  \ 查看自动生成的包网站。当您阅读本章时，如果不确定某个文件是否放置在正确的位置或设置正确，我们也建议参考我们在 GitHub 上包的官方记录：\n\n```\n\
  options(width = 70, digits = 2)\nlibrary(testthat)\nlibrary(devtools)\nlibrary(covr)\n\
  library(pkgdown)\nlibrary(ggplot2)\n```\n\n## 6.1 准备工作\n\n本章涵盖了编写 R 包的一些基础知识，并介绍了一些辅助工具，这些工具不在官方手册\"\
  Writing R Extensions\"（在线获取地址：[`cran.r-project.org/doc/manuals/R-exts.html`](https://cran.r-project.org/doc/manuals/R-exts.html)）中。该手册可能技术性很强，但它是权威指南。如果您计划向\
  \ CRAN 提交 R 包，这是必读材料；即使您只是计划为自己或公司、实验室小组等较小用户群体开发包，也建议阅读。\n\n许多 R 包包含其他编程语言（如 C、C++、Fortran\
  \ 或 Java）的代码。这通常是因为像 C 这样的语言可以被编译和优化，运行速度远快于 R，因此包开发者可能会选择将代码中计算密集的部分用编译型且高效的编程语言编写。然而，在本章中，我们只讨论如何编写包含纯\
  \ R 代码或数据的 R 包，因为其过程几乎相同，大多数差异仅在于所包含的编程语言（例如 makefile 文件）。\n\n开发 R 包之前，需要一些工具。实际上，对于不习惯软件开发的人来说，编写\
  \ R 包可能需要一套相当令人生畏的工具链。如果您使用的是 Linux 系统，很可能已经安装了其中的许多工具，或者可以轻松安装。在 Windows 和 Mac\
  \ OS 系统中，设置起来可能需要更多步骤。无论使用何种系统，工具都需要能够被访问到，这意味着需要将它们添加到系统路径中，以便从命令行调用时可以找到它们。\n\n\
  如果使用 Windows，所需的主要工具（一些命令行工具以及编译器）可以从 [`cran.r-project.org/bin/windows/Rtools/`](https://cran.r-project.org/bin/windows/Rtools/)\
  \ 的二进制安装程序获取。在安装程序到达最后的\"下一步\"之前，有两个复选框，其中一个可能未被选中，其功能是将这些工具添加到系统路径中。请同时勾选这两个复选框。关于所需\
  \ Windows 工具链的更多详细信息，请参阅 R 手册：[`cran.r-project.org/doc/manuals/R-admin.html#The-Windows-toolset`](https://cran.r-project.org/doc/manuals/R-admin.html#The-Windows-toolset)。\n\
  \n另外，您还需要 LaTeX，一个排版系统。MiKTeX [21] 是一个流行的选择（[www.miktex.org/](http://www.miktex.org/)）；如果您的系统是\
