  \ ] ## 第 1 行的所有元素\n## [1] 1 4\n```\n\n```\nx2[, 1] ## 第 1 列的所有元素\n## [1] 1 2 3\n\
  ```\n\n```\n## 也可以一次性抓取多个元素\nx2[c(1, 2), ] ## 第 1 行和第 2 行\n##      [,1] [,2]\n##\
  \ [1,]    1    4\n## [2,]    2    5\n```\n\n```\nx2[c(1, 3), ] ## 第 1 行和第 3 行\n\
  ##      [,1] [,2]\n## [1,]    1    4\n## [2,]    3    6\n```\n\n```\n## 可以使用负值来丢弃某个元素\n\
