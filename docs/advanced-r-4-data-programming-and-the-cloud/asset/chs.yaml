  \n```\n$ pwd\n/home/ubuntu\n$ mkdir MyFolder\n$ cd MyFolder\n~/MyFolder$ pwd\n/home/ubuntu/MyFolder\n\
  ~/MyFolder$ cd ..\n```\n\n**第 12 章 Cloud ubuntu for WindoWs users**\n\n讨论完创建和导航目录之后，我们把注意力转向删除文件。要删除文件，我们使用`rm`命令。我们继续对上传的文本文件执行此操作；除了作为示例文件外，它从来没有任何用处。我们在下面的代码中展示了删除过程，以及用户文件夹的完整视图。\n\
  \n通过完整视图显示我们的`ls`命令，我们可以看出在前后对比中，我们的文本文件已被删除：\n\n```\n$ ls -hl\ntotal 8.0K\n-rw-rw-r--\
  \ 1 ubuntu ubuntu 31 Mar 5 02:30 ch02_text.txt\ndrwxrwxr-x 2 ubuntu ubuntu 4.0K\
  \ Apr 11 21:21 MyFolder\nrm ch02_link.txt\nls -hl\ntotal 4.0K\ndrwxrwxr-x 2 ubuntu\
  \ ubuntu 4.0K Apr 11 21:21 MyFolder\n```\n\n这些访问权限的值是可以修改的。`chmod`命令在其后接受三个数字输入，模式为`chmod\
  \ ogp`。我们创建一个文件，并为用户、用户组和公共用户授予三个级别的访问权限。执行权限由`1`表示，写入权限由`2`表示，读取权限由`4`表示。此外，数字可以相加以授予更多权限。请参见以下示例：`7\
  \ = 1 + 2 + 4`为用户提供完全访问权限，`6 = 2 + 4`为组提供仅读取和写入访问权限。最后，公共用户只有写入权限。\n\n由于我们的数据库中没有文件（我们刚刚删除了文本文件），我们可以使用`touch`命令创建一个新文件。我们将新文件命名为`permissionsFile`：\n\
  \n```\n$ touch permissionsFile\n$ ls -hl\ntotal 4.0K\ndrwxrwxr-x 2 ubuntu ubuntu\
  \ 4.0K Apr 11 21:21 MyFolder\n-rw-rw-r-- 1 ubuntu ubuntu 0 Apr 11 21:26 permissionsFile\n\
  $ chmod 762 permissionsFile\n$ ls -hl\ntotal 4.0K\ndrwxrwxr-x 2 ubuntu ubuntu 4.0K\
  \ Apr 11 21:21 MyFolder\n-rwxrw--w- 1 ubuntu ubuntu 0 Apr 11 21:26 permissionsFile\n\
  ```\n\n**第 12 章 Cloud ubuntu for WindoWs users**\n\n我们以讨论两个终端命令`sudo`和`whoami`来结束本节。在下一节中，我们将开始更新和维护我们的操作系统。\n\
  \n这需要根级别权限。为了安全起见，我们的 Ubuntu 实例并没有一个永久的根用户。相反，当我们需要提升权限时，我们通过在命令前加上`sudo`来将这些权限授予我们的`ubuntu`用户。此命令代表*超级用户执行（super\
  \ user do）*，并且后面总是跟着另一个命令。系统会为随后的命令临时提升权限。\n\n请注意，在第一部分中，系统认为我们是默认用户。但是，当使用`sudo`时，系统认为我们是根用户：\n\
  \n```\n$ whoami\nubuntu\n$ sudo whoami\nroot\n```\n\n现在我们能够以*根*用户身份运行各种命令，我们进入下一节，确保我们的云实例具有最新的补丁和软件包。\n\
  \n## 12.3 超级用户与安全\n\n与任何操作系统和软件套件一样，经常需要进行更新。有些更新可能添加新的或改进的功能，而其他更新则可能更侧重于安全性。\n\
  \n虽然全面的云和服务器安全性远远超出了本文的讨论范围，但直接执行一些步骤是合理的。查看图 12-1，很明显我们有一些工作要做。\n\n更新过程包括三个步骤。我们首先运行`sudo\
  \ apt-get update`，其输出代码缩写如下（我们用`...`表示截断）：\n\n```\n$ sudo apt-get update\n....\n\
  Fetched 3,451 kB in 3s (1,097 kB/s)\nReading package lists... Done\n```\n\n接下来，我们升级当前文件，以便在需要时准备好安装新文件。这需要一些时间，因为我们要下载很多文件！再次，我们缩写了一些输出。值得注意的是，当询问时，我们确实输入了`Y`同意继续。\n\
  \n**第 12 章 Cloud ubuntu for WindoWs users**\n\n几乎可以肯定，您的具体升级数量和软件包将与这里所示的不同。但是，用于更新云实例的命令将保持不变：\n\
  \n```\n$ sudo apt-get upgrade\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nCalculating upgrade... Done\n....\n62\
  \ upgraded, 0 newly installed, 0 to remove and 4 not upgraded.\nNeed to get 23.5\
  \ MB of archives.\nAfter this operation, 209 kB of additional disk space will be\
  \ used.\nDo you want to continue? [Y/n] Y\n...\n```\n\n现在文件已升级，我们可以安装新的软件包。我们在命令行运行`sudo\
  \ apt-get dist-upgrade`命令，并在提示时同意。虽然不是必需的，但我们也会重启系统。这会让我们退出当前会话，并且我们必须通过 PuTTY 重新访问云。我们展示了执行这些命令的缩写代码以及图\
  \ 12-2 的截图，表明没有更多可用的更新：\n\n```\n$ sudo apt-get dist-upgrade\n...\n$ sudo reboot\n\
  ...\nThe system is going down for reboot NOW!\n```\n\n![Image 224](img/index-342_1.png)\n\
  \n**第 12 章 Cloud ubuntu for WindoWs users**\n\n***图 12-2.** Ubuntu 启动画面，显示没有需要进行的更新或升级*\n\
  \n取决于您阅读此书的时间，AWS 可能已经或可能尚未将 Ubuntu 版本从 18.04 更新。不升级也是可以的。事实上，通常更便捷的做法是等到亚马逊在其初始实例设置中处理这些事情。\n\
  \n但是，如果您希望运行最新版本，请依次运行命令`sudo apt install update-manager-core`和`sudo do-release-upgrade`。截至撰写本文时，虽然\
  \ Ubuntu 20.04 已作为长期稳定版本发布，但它尚未完全准备好可在 AWS 上轻松安装。很可能在本书出版时，这种情况会有所改变。\n\n我们还应注意，截至本书发布时，R\
  \ 4.0.0*并非*完全支持 Ubuntu 20.04。虽然它很可能可以正常工作，但要使所有功能正常运行，还需要额外付出一些努力。\n\n\n\n"
- "# 12 Cloud Ubuntu for Windows 用户使用指南\n\n若您坚持升级，系统将警告不建议通过远程访问进行升级，并且会针对通常不对外开放的端口运行额外的\
  \ SSH 访问脚本。特别是，我们的安全设置会阻止对此备用访问端口的访问。由于您刚刚创建此实例，且可通过 AWS 网站随时终止，因此无需设置此类备用访问路径。通常，我们会在可用时运行此类更新，在系统询问时通过输入`y\
  \ + ENTER`同意所有选项，按`ENTER`保留本地版本，最后重启。当然，所谓\"可用时运行\"意味着我们建议预留连续数日来应对可能需要的修复工作。虽然多数情况下无需修复，但在更新操作系统前预留时间是值得的。\n\
  \n如果您选择升级发行版，请务必在获取新操作系统版本后，最后一次执行前述命令中的`sudo update`和`upgrade`操作。\n\n现在，我们的实例（或至少实例中的软件包）已更新完毕，并且我们对如何在\
  \ Ubuntu 文件系统中导航有了更好的理解，接下来可将注意力转向在云服务器上安装 R。\n\n## 12.4 安装与使用 R\n\n到目前为止，上一章和本章的主要目标是准备一台能为我们托管\
  \ R 的服务器。我们已接近目标，只需再完成几个步骤即可。第一步是修改软件包源列表，使 Ubuntu 操作系统知道在哪里找到 R。\n\n首先查看您的 Ubuntu\
  \ 版本会有所帮助。请注意，在编写本书时，我们使用的版本是 18.04，代码名为 \"bionic\"：\n\n```\n$ lsb_release –a\n\
  No LSB modules are available.\nDistributor ID: Ubuntu\nDescription: Ubuntu 18.04.4\
  \ LTS\nRelease: 18.04\nCodename: bionic\n```\n\n要允许系统找到 R，需要切换到 `/etc/apt/` 目录并编辑\
  \ `sources.list` 文件。与 PC 拥有文本编辑器或 Microsoft Word 类似，Unix 风格的操作系统也有文本编辑器。其中一种称为 \"\
  nano\"。\n\n由于 `sources.list` 列出了 Ubuntu 获取软件包和应用程序的源，因此它是一个需要保护的文件。因此，需要调用 `sudo`\
  \ 来将您的权限从普通用户提升到管理员级别：\n\n```\n$ cd /etc/apt/\n/etc/apt$ ls\napt.conf.d    sources.list\
  \    trusted.gpg\npreferences.d sources.list.d  trusted.gpg.d\n$ sudo nano sources.list\n\
  ```\n\n打开 `nano` 文本编辑器后，向下箭头键移动至文件末尾，按 `ENTER` 添加新行，然后输入**一行**下列代码。接着按 `Ctrl+O`\
  \ 保存；您会看到文件名，然后按 `Enter`/`Return` 键。之后，按 `Ctrl+X` 退出到命令行。请注意，*bionic* 和 *xenial*\
  \ 分别是 Ubuntu 18 版和 16 版的名称。\n\n接下来这两个选项至关重要！您必须根据您的 Ubuntu 版本**仅选择一个**选项。此外，随着本书出版后\
  \ Ubuntu 新稳定版本的发布（这当然会发生），该配置可能会失效。您应访问 [`cran.r-project.org/bin/linux/ubuntu/`](https://cran.r-project.org/bin/linux/ubuntu/)\
  \ 并检查 R 和 Ubuntu 最新版本对应的最新*代码名*，然后对以下文本进行相应修改以添加到您的源文件中。我们提供最近两个版本供您参考，以便您在未来需要根据软件版本进行修改时能够了解其模式：\n\
  \n**如果您升级到 Ubuntu 18.04（或从 AWS 直接创建该版本）：** 代码名：bionic-cran35\n\n```\n##添加 R 文件服务器\n\
  deb https://cloud.r-project.org/bin/linux/ubuntu bionic-cran40/\n```\n\n**如果您保留\
  \ Ubuntu 16.04：** 代码名：xenial-cran35\n\n```\n##添加 R 文件服务器\ndeb https://cloud.r-project.org/bin/linux/ubuntu\
  \ xenial-cran40/\n```\n\n记得使用 `Ctrl+O` 和 `Enter` 保存，然后按 `Ctrl+X` 退出，我们返回主目录。下一步是为我们的软件包管理器添加\
  \ R 的签名密钥：\n\n`E298A3A825C0D65DFD57CBB651716619E084DAB9`\n\n这使我们能够确认下载的软件包是安全的，可以放心安装。请注意，此签名密钥也可能随\
  \ R 版本的变化而改变。检查更新或排查步骤的好去处是 [`cran.r-project.org/bin/linux/ubuntu/`](https://cran.r-project.org/bin/linux/ubuntu/)。如果您的安装出现任何错误，请优先检查此网站并核实源文件地址是否正确，务必仔细确认。\n\
  \n签名密钥应位于*一行*内。为了在书中排版，我们在 `--recv-keys` 后面的空格处进行了换行。下面展示您应输入的命令以及预期输出：\n\n```\n\
  $ cd /home/ubuntu\n$ sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys\n\
  E298A3A825C0D65DFD57CBB651716619E084DAB9\nExecuting: /tmp/apt-key-gpghome.rOCEL7Je1U/gpg.1.sh\
  \ --keyserver keyserver.\nubuntu.com --recv-keys\ngpg: key 51716619E084DAB9: public\
  \ key \"Michael Rutter <marutter@gmail.com>\"\nimported\ngpg: Total number processed:\
  \ 1\ngpg: imported: 1\n```\n\n至此，安装 R 通常很简单。实际上只需两条命令。我们更新软件包列表，然后安装基础版 R。在安装过程中，您需要同意一到两次选项。如果安装成功，您会看到一屏文本滚动而过。如果滚动停止，请检查是否被要求输入\
  \ `y + ENTER` 表示同意某项内容。否则，让安装继续完成：\n\n```\n$ sudo apt-get update\n$ sudo apt-get\
  \ install r-base\n...\n```\n\n现在，我们已在云服务器上安装了 R，接下来运行 R 看看效果。我们使用命令 `R` 启动程序。然后运行第\
  \ 1 章中的一个脚本来观察结果。以下代码展示了 R 的启动界面以及我们运行代码的熟悉结果：\n\n```\n$ R\nR version 4.0.0 (2020-04-24)\
  \ -- \"Arbor Day\"\nCopyright (C) 2016 The R Foundation for Statistical Computing\n\
  Platform: x86_64-pc-linux-gnu (64-bit)\nR is free software and comes with ABSOLUTELY\
  \ NO WARRANTY.\nYou are welcome to redistribute it under certain conditions.\nType\
  \ 'license()' or 'licence()' for distribution details.\nR is a collaborative project\
  \ with many contributors.\nType 'contributors()' for more information and\n'citation()'\
  \ on how to cite R or R packages in publications.\nType 'demo()' for some demos,\
  \ 'help()' for on-line help, or\n'help.start()' for an HTML browser interface to\
  \ help.\nType 'q()' to quit R.\n> x <- c(\"a\", \"b\", \"c\")\n> x[1]\n[1] \"a\"\
  \n> is.vector(x)\n[1] TRUE\n> is.vector(x[1])\n[1] TRUE\n> is.character(x[1])\n\
  [1] TRUE\n> q()\n```\n\n#### 使用 R\n\n在 R 环境中，我们常用的所有命令都能正常工作。我们可以安装软件包或运行代码。不过，我们希望在三个方面进行改进。第一，我们目前以普通用户（即\
  \ ubuntu 用户）身份运行 R。我们可能希望服务器上的其他用户无需 `sudo` 或 `root` 权限也能使用 R。在这种情况下，将软件包不仅安装给当前用户，而是安装到整个机器上会更有帮助。\n\
  \n第二，能够运行我们在本地机器上创建的文件中的代码会很方便。第三，我们与服务器的连接依赖于网络的稳定性。如果出现网络故障，我们的工作就会丢失。因此，如果能够实现从命令行运行\
  \ R 命令，即使我们断开连接，服务器仍能继续运算，那就非常方便了。如果您利用此设置来为并行处理器驱动的模型构建一个高性能计算环境，这一点尤其有用。\n\n\n\
  \n若要仅为特定用户安装包，可像往常一样在 R 控制台中使用 `install.packages(\"\")` 函数。然而，若要为任何用户（包括将来可能邀请到云端的用户）安装包，请使用以下命令。你需要做的是从命令行向\
  \ R 传递一条命令。我们还必须以 root 身份运行此命令（以便为所有用户安装），并且需要 root 权限才能执行此操作，而 `sudo` 和 `su -`\
  \ 可以提供这些权限。`-c` 选项会执行紧随其后的代码。最后，我们调用 R 并让它安装该包：\n\n```\n$ sudo su - -c \"R -e \\\
  \"install.packages('pscore')\\\"\"\n```\n\n假设你想在本地机器上编写一些代码，然后在云服务器上运行这些代码。回到本地机器，我们继续启动\
  \ RStudio：`options(width = 70, digits = 2)`\n\n然后，我们可能会保存一个名为 `ch12_loopTest.R`\
  \ 的新文件，其中仅包含以下这段代码：\n\n```\nx <- 1:1000\n\nfor(i in 1:length(x)){\n\nx[i] <- x[i]ˆ3\n\
  \n}\n\nhead(x)\n```\n\n\n\n### [1] 1 8 27 64 125 216\n\n我们当然知道预期的结果；之前在章节中已经基本看到过。\n\
  \n接下来，我们进入 WinSCP，用它连接我们的 Ubuntu 服务器（保持 PuTTY 打开也没问题）。连接服务器后，在 WinSCP 左侧或*本地*区域，找到已保存的文件\
  \ `ch12_loopTest.R`，并将其拖拽到右侧或*云实例*区域。\n\n现在，返回 PuTTY，输入 `ls`：\n\n```\n$ ls\n```\n\
  \n`ch12_loopTest.R MyFolder permissionsFile`\n\n我们的文件已经在那里了！要运行已创建的代码，我们使用 `R CMD\
  \ BATCH` 命令。要运行并查看文件结果，只需使用这个新命令：\n\n```\n$ R CMD BATCH ch12_loopTest.R\n```\n\n\
  ```\n$ ls\n```\n\n`ch12_loopTest.R ch12_loopTest.Rout MyFolder permissionsFile`\n\
  \n我们可以在 `ch12_loopTest.Rout` 文件中看到输出，并使用本章前面用过的 `nano` 编辑器来查看。记住 `Ctrl+X` 可以退出该编辑器。下面同时展示了打开文件的命令和简化的输出，以证明代码成功运行：\n\
  \n```\n$ nano ch12_loopTest.Rout\n....\n> head(x)\n[1] 1 8 27 64 125 216\n>\n> proc.time()\n\
  \   user  system elapsed\n  0.156   0.038   0.201\n```\n\n现在，我们可以在实例上随意运行 R 命令了。这包括你想要的任何并行处理技术（请记住，免费套餐在这方面可能帮助不大）。只要我们的代码构建时不需要用户输入，就可以让它直接运行。我们通过\
  \ `screen` 命令来实现这一点。本质上，这会打开另一个终端，我们可以从中分离出来。这样，即使我们的 PuTTY 终端会话结束（无论是因为我们希望它结束，还是因为网络波动迫使如此），该终端也能继续运行。我们还可以查看进程何时运行完毕。我们在\
  \ `screen` 命令后加上修饰符运行的命令大家都很熟悉；如果你想要更多关于 `screen` 的细节，`man screen` 命令会提供大量信息：\n\n\
  ```\n$ screen -A -d -m R CMD BATCH ch12_loopTest.R\n$ screen -ls\nThere is a screen\
  \ on:\n\tip-10-0-0-244 (03/17/2020 04:43:40 AM)\t(Detached)\n1 Socket in /var/run/screen/S-ubuntu.\n\
  $ screen -ls\nNo Sockets found in /var/run/screen/S-ubuntu.\n```\n\n从第二次列表可以看出，没有更多的进程在运行了。因此，可以安全地访问我们的输出文件来查看结果。值得注意的是，对于像这样较短的运行，你很*可能*不会看到第一个分离的屏幕。它只会结束得太快。对于一个需要更长时间运行的进程，与其输入\
  \ `screen -ls` 来检查，我们可能只需输入 `exit`，然后在现实世界中各忙各的。该进程会在云端继续运行。对于在较昂贵实例上运行的进程，可以设置\
  \ AWS，当处理器使用率低于某个阈值时，通过电子邮件发送警报。我们经常使用 10% 左右。一旦收到几封警报邮件，说明进程使用率持续低于 10%，你就知道值得登录检查了。\n\
  \n我们现在已经在服务器实例上安装了 R，可以设置所有用户都能访问的包，并且可以在不保持稳定网络连接的情况下运行文件。如果在一台机器上设计的代码运行时间过长，我们可以将这些文件上传到更强大的机器上运行。不过，我们仍然在使用命令行。在下一节中，我们将在实例上安装\
  \ RStudio，这样我们就可以在利用云实例强大功能的同时，使用熟悉的 RStudio 外观和感觉。\n\n### 12.5 安装并使用 RStudio Server\n\
  \n虽然我们已经展示了将本地机器上运行过慢的文件上传到云实例的方法相对直接，但这种格式仍有改进空间。RStudio [20] 是一个极好的、直观的 R 编程环境，我们可以获得相同的图形界面。而且，这可以通过浏览器访问，而不是通过命令行。这非常方便，因为几乎任何带有浏览器的可上网设备都可以访问你的实例并使用\
  \ R。在紧急情况下，我们曾有一次通过智能手机来运行 R。\n\n当然，风险在于一些安全问题。RStudio Server 仅由一个密码保护，而不是密钥文件。回想之前的章节，R\
  \ 可以执行许多系统管理任务，比如文件移动和删除。访问 RStudio Server 可能会让一个有决心的攻击者获得比你预期更多的系统访问权限。当然，我们继续在\
  \ AWS 上设置安全组，只允许来自我们本机 IP 地址的连接，尽管这在一定程度上限制了从任何设备使用 R 的承诺。我们再次提醒你，数据安全值得比我们此处介绍的更深入的关注。在我们提到的使用智能手机的例子中，我们必须首先访问\
  \ AWS，更新安全组以允许来自手机 IP 地址的各种连接，然后才能让事情重新运行起来。如果没有其他安全措施，那并不是最安全的做法。另一方面，安全性与可用性往往是一种权衡。\n\
  \n由于我们已经安装了 R，只需要在通过 PuTTY 再次访问命令行后做一些工作。为了确保包的正确认证，进行更新会有所帮助，就像我们安装系统和安全更新时一样。在以下每个\
  \ `apt-get` 命令之后，控制台会打印大量文本，并且可能会提示你同意使用一些磁盘空间：\n\n```\n$ sudo apt-get update\n\
  ...\n$ sudo apt-get install gdebi-core\n...\n```\n\n继续将 RStudio 的密钥添加到你的机器上。RStudio\
  \ 随时可能更改他们的密钥。请访问 [`rstudio.com/code-signing/`](https://rstudio.com/code-signing/)\
  \ 以验证 `3F32EE77E331692F` 是否仍然正确。此外，我们安装 `dpkg-sig` 来帮助我们验证安装：\n\n```\n$ gpg --keyserver\
  \ keys.gnupg.net --recv-keys 3F32EE77E331692F\n...\n$ sudo apt install dpkg-sig\n\
  ```\n\n一旦你能够安装服务器，就需要从网络上下载它。运行以下命令，预计会下载一个大约 40 MB 的文件。我们在下面展示了代码和一些输出；请务必记下保存的文件名以及下载是否完整。另外，请确保为你的\
  \ Ubuntu 版本安装正确的版本。我们再次展示代号以帮助你了解模式，因为很可能在你阅读本文时，至少 Ubuntu 或 RStudio Server（可能两者）会有更新的版本。请访问\
  \ [`rstudio.com/products/rstudio/download-server/debian-ubuntu/`](https://rstudio.com/products/rstudio/download-server/debian-ubuntu/)\
  \ 获取最新详情。\n\n**如果你升级到了 Ubuntu 18.04（或者从 AWS 开始就使用这个版本）：** 代号：`bionic`\n```\n$ wget\
  \ https://download2.rstudio.org/server/bionic/amd64/rstudio-server-1.2.5042-amd64.deb\n\
  ...\n$ dpkg-sig --verify rstudio-server-1.2.5042-amd64.deb\nProcessing rstudio-server-1.2.5042-amd64.deb...\n\
  GOODSIG _gpgbuilder FE8564CFF1AB93F1728645193F32EE77E331692F 1585759224\n```\n\n\
  **如果你使用的是 Ubuntu 16.04：** 代号：`xenial` / (`trusty` 是一个更老的版本)\n```\n$ wget https://download2.rstudio.org/server/trusty/amd64/rstudio-server-1.2.5033-amd64.deb\n\
  ...\n$ dpkg-sig --verify rstudio-server-1.2.5033-amd64.deb\nProcessing rstudio-server-1.2.5033-amd64.deb...\n\
  GOODSIG _gpgbuilder FE8564CFF1AB93F1728645193F32EE77E331692F 1575443526\n```\n\n\
  无论哪种情况，你都得到了 `GOODSIG`，因此你的下载更安全。\n\n现在我们来安装服务器。在安装过程中，可能需要同意一次：\n\n```\n$ sudo\
  \ gdebi rstudio-server-1.2.5042-amd64.deb\nReading package lists... Done\n...\n\
  Do you want to install the software package? [y/N]: y\n...\nActive: active (running)\
  \ since Sun 2020-04-26 18:07:02 UTC; 1s ago\nProcess: 26414 ExecStart=/usr/lib/rstudio-server/bin/rserver\
  \ (code=exited, status=0/SUCCESS)\nMain PID: 26420 (rserver)\nTasks: 3 (limit: 1152)\n\
  CGroup: /system.slice/rstudio-server.service\n       |--26420 /usr/lib/rstudio-server/bin/rserver\n\
  Apr 26 18:07:02 ip-10-0-0- systemd[1]: Starting RStudio Server...\nApr 26 18:07:02\
  \ ip-10-0-0- systemd[1]: Started RStudio Server.\n...\n```\n\n![图片 225](img/index-352_1.png)\n\
  \n现在 RStudio Server 正在运行，我们想确认它是否工作正常。记得在上一章中，我们设置了安全组以允许访问端口 8787 上的 RStudio Server。在本地计算机上打开一个\
  \ web 浏览器，访问你的服务器在所需端口上的 web 地址，即 `54.201.117.64:8787`（或者对于你来说，是 `YOUR_INSTANCE_IP_HERE:8787`）。\n\
  \n正如你在图 12-3 中看到的，服务器在视觉上确实看起来是工作的。如果它似乎对你不起作用，请记得在 AWS 网站上检查你*当前*的 IP 地址是否与你安全组入站规则中的\
  \ IP 地址相同。详情在第 11 章中概述。\n\n***图 12-3.** RStudio Server*\n\n我们需要一个用户名和密码来进一步访问。该用户也是你\
  \ Ubuntu 服务器的一个用户，并且有一个密码。明智的做法是默认禁用密码登录服务器，而我们的实例实际上已经这样做了。我们用来创建新用户的命令是 `adduser`，它会运行显示的脚本。我们需要在命令行中键入这些命令。除了用户名和密码，不必为新用户填写信息。你可以直接按\
  \ `ENTER` 跳到下一行。另外，请注意密码字段会抑制击键，因此那里不会显示任何内容。选择你喜欢的任何安全密码，尽管我们建议你以某种方式存储它。我们使用了*不*安全的密码：`secure`。不要这样做！请确保你的密码安全（我们觉得很安全，因为本书中使用的是一个玩具实例，很快就会被删除）。\n\
  \n我们回到 PuTTY 终端并输入 `adduser` 命令：\n\n```\n$ sudo adduser advancedr\nAdding user 'advancedr'\
  \ ...\nAdding new group 'advancedr' (1001) ...\nAdding new user 'advancedr' (1001)\
  \ with group 'advancedr' ...\nCreating home directory '/home/advancedr' ...\nCopying\
  \ files from '/etc/skel' ...\nEnter new UNIX password:\nRetype new UNIX password:\n\
  passwd: password updated successfully\nChanging the user information for advancedr\n\
  Enter the new value, or press ENTER for the default\n\tFull Name []: Advanced R\n\
  \tRoom Number []: RStudio Server\n\tWork Phone []:\n\tHome Phone []:\n\tOther []:\n\
  Is the information correct? [Y/n] Y\n```\n\n回到浏览器，我们使用新的用户名和密码访问 RStudio Server。输入刚刚创建的用户名和密码，如图\
  \ 12-4 所示，你应该就能进入网页版的 RStudio 了。\n\n![图片 226](img/index-354_1.png)\n![图片 227](img/index-354_2.png)\n\
  ***图 12-4.** 登录 RStudio*\n\n这应该感觉就像我们一直在使用的 RStudio，如图 12-5. 所示。\n\n***图 12-5.**\
  \ 云端上的 RStudio*\n\nRStudio 现在存在于你的云实例上。虽然这对于以更直观的方式使用 R 很有帮助，但能够更原生地使用和查看图形输出是我们作者非常欣赏的一点。这样的输出可以很容易地保存为\
  \ `.pdf` 文件，并通过 WinSCP 从 `/home/advancedr` 文件夹下载。更一般地，`/home/YOUR_USERNAME` 可以访问特定的\
  \ RStudio 用户文件夹。\n\n这样就完成了我们的 RStudio Server 设置。还可以做更多，但这对于入门来说已经足够了。你现在已经可以使用一个功能强大的系统了，而且如果你愿意，实际上可以自由地拥有多个这样的系统副本。在\
  \ AWS 上，可以设置警告，当实例的 CPU 使用率低于某个阈值时通过电子邮件提醒你。因此，可以配置 R 进程运行，并且实例空间的付费不会超过实际使用时间太多。我们的最后建议是，如果你打算不止偶尔使用\
  \ RStudio Server，可以花些时间阅读它的文档。那里有一些有用的自定义设置、方便的功能和值得了解的注意事项。我们在本章的参考文献部分包含了链接。\n\
  \n### 12.6 安装 Java\n\n接下来，我们安装 Java。这非常简单；只需在命令行中逐行运行以下三行代码。在需要时用 `y + ENTER` 同意相关操作：\n\
  \n```\n$ sudo apt-get update\n...\n$ sudo apt-get install default-jre\n...\n$ sudo\
  \ apt-get install default-jdk\n...\n```\n\n### 12.7 在云上安装 Shiny\n\n将统计信息带给信息消费者是\
  \ Shiny 的主要用途。因为我们现在处于安装模式，我们将继续在云实例上安装托管 Shiny 应用程序所需的资源。\n\n要安装 Shiny，我们需要运行以下代码。需要同意确认安装，我们抑制了系统在命令行的输出。逐行运行每条命令。\n\
  \n这一行将 `shiny` 包 [6] 安装到 R 中。我们还安装了 `httpuv` [44] 和 `shinydashboard` [5]。你注意到，在内括号之间，有一些对\
  \ R 用户来说非常有意义的命令。然而，在这种情况下，我们特意从命令行运行 R，以便我们可以用管理权限执行该进程，从而使任何 Ubuntu 用户帐户（而不仅仅是主用户帐户）都能访问这些库。当\
  \ Shiny 服务器托管应用程序时，它会使用 `shiny` 这个用户名来托管。因此，以下几行代码为所有用户安装了这些包：\n\n```\n$ sudo su\
  \ - -c \"R -e \\\"install.packages('httpuv')\\\"\"\n...\n$ sudo su - -c \"R -e \\\
  \"install.packages('shiny')\\\"\"\n...\n$ sudo su - -c \"R -e \\\"install.packages('shinydashboard')\\\
  \"\"\n...\n```\n\n一个警告说明：在 Ubuntu 微型实例上，这个最新版本的 R 似乎并不总能按预期安装包。你在尝试安装前述的某个包时，可能会发现系统死机了。如果是这种情况，可能需要在\
  \ AWS EC2 仪表盘中强制重启你的实例。在启动实例的位置附近，有一个 *Actions*（操作）下拉菜单。首先选中你的实例，然后选择 *Actions*（操作），接着是\
  \ *Instance State*（实例状态），最后选择 *Reboot*（重启），你的实例应该会重启。如果该方法无效，你可能需要 *Stop*（停止）然后再\
  \ *Start*（启动）你的实例。在这种情况下，请注意你的实例的 IP 地址会改变，因此 PuTTY 需要使用新的 IP 地址进行更新。\n\n成功重启后，使用\
  \ PuTTY 回到命令行，你可能会发现某个或多个包上有一个*锁*。切换到你的 R 目录，使用 `ls` 查看是否列出了任何格式为 `00LOCK-rPackageHere`\
  \ 的文件夹。下面展示了可能的情况：\n\n```\n$ cd /usr/local/lib/R/site-library/\n$ ls\n00LOCK-httpuv\n\
  ```\n\n如果你确实看到这样的文件锁，可以使用以下命令删除该文件：\n\n```\n$ sudo rm -r 00LOCK-httpuv/\n```\n\n\
  使用此命令时要小心。你**必须**确保准确输入；递归删除命令很容易删除过多的文件。删除所有以 `00LOCK-` 为前缀的文件夹后，你就可以回到主目录并重试了。一个可以帮助你更好地重试的技巧是研究\
  \ CRAN 上的包依赖关系。例如，`httpuv` 是 `shiny` 依赖的一个包。因为我们发现该包在微型的 Ubuntu 实例上特别脆弱，所以我们提前让你单独安装了它：\n\
  \n```\ncd /home/ubuntu/\n```\n\n从这里开始，既然 R 本身可以使用 Shiny，我们就安装服务器，这样我们的云实例就可以向互联网提供\
  \ Shiny 应用程序服务了。我们需要使用 `wget` 命令下载一个文件，然后安装下载的文件。我们用以下代码行来执行此操作，并且有一些安装声明。此外，我们还展示了一个\
  \ `dpkg-sig` 显示无签名的示例。即使是良好的安全努力，偶尔也会失败：\n\n```\n$ wget https://download3.rstudio.org/ubuntu-14.04/x86_64/shiny-server-1.5.13.944-amd64.deb\n\
  . . .\n$ dpkg-sig --verify shiny-server-1.5.13.944-amd64.deb\n$ sudo gdebi shiny-server-1.5.13.944-amd64.deb\n\
  ...\nDo you want to install the software package? [y/N]:y\n...\n. shiny-server.service\
  \ - ShinyServer\n   Loaded: loaded (/etc/systemd/system/shiny-server.service; enabled;\
  \ vendor preset: enabled)\n   Active: active (running) since Sun 2020-04-12 22:39:18\
  \ UTC; 67ms ago\n Main PID: 18780 (shiny-server)\n   Tasks: 1 (limit: 1151)\n  \
  \ CGroup: /system.slice/shiny-server.service\n       |--18780 /opt/shiny-server/ext/node/bin/shiny-server\
  \ /opt/shiny-server/lib/main.js\nApr 12 22:39:18 ip-10-0-0- systemd[1]: Started\
  \ ShinyServer.\n```\n\nShiny Server 现在应该也在运行了。\n\n### 12.8 PostgreSQL\n\n之前，我们学习了如何在本地机器上安装和运行\
  \ PostgreSQL 数据库服务器。虽然这对于以有组织的方式从 R 存储大量数据来说可能足够有用，但这并没有充分利用数据库服务器的社区级应用。特别是，我们的例子中提到了创建几个研究生。运行以下命令（现在看起来应该相当熟悉了），并在询问你是否要继续时同意。这将把你的\
  \ EC2 实例上安装 PostgreSQL：\n\n```\n$ sudo apt update\n$ sudo apt install postgresql\
  \ postgresql-contrib\n```\n\n默认情况下，PostgreSQL 只在本地机器上运行。虽然这听起来有点老生常谈（我们保证在本章之后不再说这类话），但还是要重复一遍：让数据库通过互联网向世界开放是在自找麻烦。花时间探索保护云安全的方法绝对值得。我们已经并将采取一些初步措施，这些措施可能和通过电子邮件发送信息一样安全（甚至更安全一点）。因为每个用例都不同（也因为本书旨在聚焦于\
  \ R 并让你练习该软件），如果你的数据需要更高的敏感性，你的首要任务应该是探索数据库和云网络安全。\n\n为了允许 PostgreSQL 连接到互联网，我们需要在配置文件中添加一行。使用\
  \ `nano` 打开配置文件，用箭头键向下滚动到 *CONNECTIONS AND AUTHENTICATION*（连接和认证）部分。然后，添加 `listen_addresses\
  \ = '*'`。这是一个通配符，将监听*所有* web 地址。但是，这个数据库服务器位于你的 EC2 实例上，并受你的安全组入站过滤器设置保护，该设置（目前）只允许你的\
  \ IP 地址（或伪造/冒用该确切地址的人）访问信息。因此，这里的通配符、全开放选择并不像看起来那么危险。我们还在旁边添加了一条注释。同样，使用 `Ctrl+O`\
  \ 保存，然后按 `ENTER`。最后，使用 `Ctrl+X` 退出 `nano`：\n\n```\n$ sudo nano /etc/postgresql/10/main/postgresql.conf\n\
  ...\n#-------------------------------------------------------------------------\n\
  ```\n\n\n\n"
- "# 连接与身份验证\n\n## 第 12 章 面向 Windows 用户的 Cloud Ubuntu\n\n### 连接设置\n\n`listen_addresses\
  \ = 'localhost'` # 监听的 IP 地址；`listen_addresses = '*'` # 为网页访问添加；通过 AWS 进行 IP 过滤！\n\
  \n接下来，我们创建一个名为`adminaws`的拥有完全权限的新用户。请记住，PostgreSQL 默认会创建一个名为`postgres`的超级用户。但是，由于该用户没有设置密码，我们强制该用户只能通过`sudo`从\
  \ Ubuntu 命令行连接。这种方式通过您的密钥进行身份验证，因此暴力破解难度要大得多。\n\n安全始终遵循最小权限原则。允许特定用户实现其目标所需的最低访问权限是多少？这是在便利性之间取得平衡。由于我们的目标是教您如何使用\
  \ R 连接 SQL 数据库，我们需要大多数事情在第一次尝试时就能轻松运行，而不是在处理细节时出现问题。因此，这个新用户将拥有许多权限，包括密码（P）、创建新角色的能力（r）和超级用户权限（s）。我们也保留了`advancedr`密码：\n\
  \n`$ sudo su - postgres -c \"createuser -Prs adminaws\"`\n\n为新角色输入密码：\n\n再次输入：\n\
  \n接下来，我们在服务器上创建一个名为`advancedrdb`的数据库：\n\n`$ sudo su - postgres -c \"createdb advancedrdb\"\
  `\n\n有了新用户和新数据库，我们必须授予该新用户对该数据库的访问权限。为此，我们首先需要使用`sudo`从 Ubuntu 命令行直接访问 SQL 数据库（请记住我们的默认用户没有密码）。进入\
  \ PostgreSQL 控制台后，我们使用一段熟悉的老式 SQL 代码来`GRANT`访问权限。然后使用一段新代码`\\q`退出 PostgreSQL：\n\n\
  ```\n$ sudo -u postgres psql\n\npsql (10.12 (Ubuntu 10.12-0ubuntu0.18.04.1))\n\n\
  输入 \"help\" 获取帮助。\n\npostgres=# grant all privileges on database advancedrdb to\
  \ adminaws;\npostgres=# \\q\n```\n\n我们向您保证，您距离了解如何访问云 SQL 数据库已经非常接近了！请坚持住。\n\n最后需要做的是在另一个配置文件中授予对数据库的访问权限。再次使用`nano`，我们向下移动光标浏览文件。我们现在打算在文件末尾添加一行。\n\
  \n我们要添加的一行是`host all all 0.0.0.0/0 password`。\n\n请注意，通过添加更多行，我们可以更具体地指定哪些数据库（例如，仅限`advancedrdb`）、哪些用户（例如，仅限`gradstudentr`）或者\
  \ IP 地址可以不向整个世界开放。目前，考虑到 IP 地址已经受到限制（而且我们只有少量用户），这样设置可能足够安全：\n\n```\n$ sudo nano\
  \ /etc/postgresql/10/main/pg_hba.conf\n\n...\n\n# TYPE  DATABASE  USER  ADDRESS\
  \  METHOD\n# 所有用户可以从所有位置通过密码访问所有数据库。\nhost  all  all  0.0.0.0/0  password\n```\n\
  \n完成所有这些配置文件更改后，我们最好重启 PostgreSQL 服务器。通常，服务器需要重启才能使更改生效：\n\n`$ sudo service postgresql\
  \ restart`\n\n虽然我们这里没有重复第 10 章的全部内容，但我们展示的内容足以让您确信，现在可以练习通过 R 连接到基于云的 SQL 服务器：\n\
  \n```\nlibrary(RPostgreSQL)\nlibrary(DBI)\n\ndrv <- dbDriver(\"PostgreSQL\")\nconSuper\
  \ <- dbConnect(\n  drv,\n  dbname = \"advancedrdb\",\n  host = \"52.13.47.153\"\
  ,\n  port = 5432,\n  user = \"adminaws\",\n  password = \"advancedr\"\n)\n\ndbGetInfo(conSuper)\n\
  \n## $host\n## [1] \"52.13.47.153\"\n##\n## $port\n## [1] \"5432\"\n##\n## $user\n\
  ## [1] \"adminaws\"\n##\n## $dbname\n## [1] \"advancedrdb\"\n##\n## $serverVersion\n\
  ## [1] \"10.0.12\"\n##\n## $protocolVersion\n## [1] 3\n##\n## $backendPId\n## [1]\
  \ 1643\n##\n## $rsId\n## list()\n\ndbDisconnect(conSuper)\n```\n\n\n\n"
