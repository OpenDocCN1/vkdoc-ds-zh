  \n`numericInput(inputId, label, value, min = NA, max = NA, step = NA, width = NULL)`\n\
  `textInput(inputId, label, value = \"\", width = NULL, placeholder = NULL)`\n`checkboxInput(inputId,\
  \ label, value = FALSE, width = NULL)`\n\n接下来，为我们的代码填充一些具体内容，我们可以为每个输入项设置一个有用的标识变量，以便稍后在服务器代码中使用。既然我们计划构建一个饼图（亲爱的读者们，请不要因为我们这个选择而讨厌我们），那么将数字输入限制在\
  \ 0 到 100 之间是合理的。由于服务器代码在启动时会运行一次，因此为数字输入甚至文本输入提供默认值也是合理的。在我们不断扩展的用户界面代码基础上，现在我们有如下代码：\n\
  \n```r\n# 绘制饼图的用户界面\nui <- shinyUI(fluidPage(\n```\n\n\n\n"
