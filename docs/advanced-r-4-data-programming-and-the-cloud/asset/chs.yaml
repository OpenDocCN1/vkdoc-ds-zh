  \ `fluidPage()` 函数调用，我们将所有面向用户的文本都放在其内部。这部分代码是 Shiny 中最不熟悉的部分，因为这段代码会生成用户看到的 HTML。在参考部分，我们提供了所有\
  \ Shiny UI 函数的链接。不过，本章我们将专注于一个基本布局，该布局位于一个能自动调整（即自适应）的页面内，具体取决于浏览器的显示区域。请注意，这是一个\
  \ R 函数，而 R 函数接受的参数用逗号分隔。我们不断扩展的应用的每一个方面都包含在这个包装函数中，它负责将一切转换为 web 就绪的标记语言。\n\n359\n\
  \n![Image 229](img/index-369_1.png)\n\n![Image 230](img/index-369_2.png)\n\n###\
  \ 第 13 章 每朵云都有闪亮的内衬\n\n对于图 13-1 中的第一个应用，我们使用了侧边栏布局。这个函数需要两个参数：用于控制应用的侧边栏面板，以及用于展示内容的主面板。编辑我们的用户界面，可以得到如下代码：\n\
  \n```r\n# 定义用户界面\nui <- shinyUI(fluidPage(\n  sidebarLayout(\n    sidebarPanel(),\n\
  \    mainPanel()\n  )\n))\n```\n\n这段代码是数学上函数组合概念强大威力的一个极好示例。我们的目标最终是要让用户向我们的 R 代码输入一些内容，例如图\
  \ 13-1 示例中的文本或复选框。\n\n***图 13-2。** 一个几乎空白的 Shiny 应用，带有 `sidebarPanel()`*\n\n***图\
  \ 13-3。** 用户界面基本完成，侧边栏中的输入部分确实已完成*\n\n用户将这些值输入到尚未命名的函数中，这些函数会产生视觉输出。该输出又作为输入传递给\
  \ `sidebarPanel()` 函数，该函数提供 web 输出，该输出再作为输入传递给 `fluidPage()`，最终输出完整的 web 用户界面。\n\
  \n我们可以在图 13-2 中看到结果，虽然它们还是空白。\n\n### 第 13 章 每朵云都有闪亮的内衬\n\n从这一点出发，我们可以使用三个输入函数快速构建用户的输入项。每个输入函数都遵循特定的格式，即：`blank\
