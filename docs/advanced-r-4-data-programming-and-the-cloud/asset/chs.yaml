  我们已经知道如何使用正则表达式和 `grep()` 来清理这类变量。清理完成后，我们使用参数 `useNA = \"ifany\"` 在表中检查所有响应，包括`NA`值。需要注意的是，尽管为了适应书籍排版，正则表达式进行了换行，但在实际编写时，它应该是一个单行，并且在\
