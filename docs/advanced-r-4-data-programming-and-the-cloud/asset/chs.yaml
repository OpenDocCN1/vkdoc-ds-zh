  第 15 章 动态报告


  ### 15.1 所需软件


  我们已经拥有了大部分所需的软件，即 R、Shiny 包 [6]、PuTTY 以及基于 Ubuntu 的云实例。我们还需要安装一些新的包——无论是在本地机器上还是在云服务器上。




  #### 本地机器


  首先，在你的 R 控制台中，独立于任何 R 文件运行以下代码很重要：


  ```R

  install.packages("rmarkdown")

  install.packages("tufte")

  install.packages("knitr")

  install.packages("evaluate")

  install.packages("ltm")

  install.packages("formatR")

  library(knitr)

  ```


  ### LaTeX 产品


  使用 R 生成 PDF 时，最好只让计算机上安装一个 LaTeX 引擎来完成工作。正如前一章所述，LaTeX 有很多选择，包括 `tinytex`（来自 CRAN）和
  MiKTeX [21]。如果你已经安装了某个 LaTeX 产品，它应该能与 RStudio 配合使用（至少在 Windows 上如此，你可能需要确保你的 LaTeX
  解决方案在全局或用户 `environment PATH` 中）。


  如果你还没有这样的系统，MiKTeX 是一个很好的选择，其默认设置和安装选项在大多数配置上通常“可以直接使用”。如果你确实遇到了无法生成 PDF 的情况，根据我们的经验，搜索输出的错误信息通常能找到一些可行的建议。


  要安装 MiKTeX 来创建 PDF 文件，请访问 MiKTeX 网站（[`miktex.org/`](http://miktex.org/download)）获取推荐的基础安装程序（32
  位）或其他基础安装程序（64 位）。我们在自己的系统上使用 64 位版本，尽管在本章中，不同版本之间可能不会有重大差异。下载后，在安装过程中接受所有默认设置。安装完成后，MiKTeX
  软件包可能会有更新。要执行这些更新，请进入你的开始菜单。


  在名为 MiKTeX 的文件夹中，你会找到*MiKTeX 控制台*的选项。其中有一个名为*检查更新*的按钮，你应该点击并运行它。虽然可能不是必须的，但我们建议在此安装后重新启动电脑。


  #### 云实例


  使用 PuTTY，访问你的云实例控制台。我们需要在控制台中逐行运行以下代码。回想一下前一章的内容，这些代码是为该服务器的所有用户安装软件包，而不仅仅是你的用户。这是允许
  Shiny 服务器访问正确软件包的关键：


  ```bash

  $ sudo su - -c "R -e \"install.packages(''knitr'')\""

  $ sudo su - -c "R -e \"install.packages(''rmarkdown'')\""

  $ sudo su - -c "R -e \"install.packages(''tufte'')\""

  $ sudo su - -c "R -e \"install.packages(''ltm'')\""

  $ sudo su - -c "R -e \"install.packages(''formatR'')\""

  $ sudo su - -c "R -e \"install.packages(''data.table'')\""

  $ sudo su - -c "R -e \"install.packages(''evaluate'')\""

  ```


  上述代码不会花很长时间。但是，安装 `texlive`（Ubuntu 上用来替代 MiKTeX 的 LaTeX 解决方案）可能需要一些时间。它也需要相当大的磁盘空间，所以请确保你有足够的空间。在我们的试验中，需要安装完整版本。在云服务器上，就像在你的本地机器上一样，最好不要安装超过一个版本的
  LaTeX。因此，如果你使用的云实例还用于其他用途，并且你已经安装了 `tinytex` 软件包，你可能需要试验一下是否可以不使用 `texlive`：


  ```bash

  $ sudo apt-get install texlive-full

  $ sudo reboot

  ```


  在此之后，我们建议执行 `sudo reboot` 来重启你的云实例。这是一个执行重启的好时机，然后暂时关闭 PuTTY。在你的服务器重启期间，你可以使用本地机器来探索动态文档。


  ### 15.2 动态文档


  动态文档不一定非要与互联网连接。实际上，大多数报告可能是内部使用的。在 RStudio 中，选择*文件*、*新建文件*、*R Markdown* 会打开一个向导。注意，有用于文档（例如，HTML、PDF
  或 Word）以及演示文稿（例如，HTML 或 PDF）的选项。通常需要填写标题和作者。当然，RStudio 并不是必需的；在 R 中创建一个后缀名为 `.Rmd`
  的新文件就足够了。


  我们打算采用一种混合方式来介绍动态文档。也就是说，我们首先给出一个直接且信息丰富的示例，展示这类代码的样子，然后对代码的每个部分进行更深入的分析。我们从一个名为
  `ch15_html.Rmd` 的新文件开始，并用以下代码填充它：


  ```yaml

  title: "ch15_html"

  author: "Matt & Joshua Wiley"

  date: "29 April 2020"

  output: html_document

  ```


