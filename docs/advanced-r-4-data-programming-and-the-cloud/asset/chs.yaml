  = "gradstudentr", password = "s3cur3" )


  conInsert <- dbConnect(drv, dbname = "postgres", host = "localhost",port = 5432,
  user = "gradstudenti", password = "saf3" )


  conUpdate <- dbConnect(drv, dbname = "postgres", host = "localhost",port = 5432,
  user = "gradstudentu", password = "sur3" )

  ```


  现在这三个新的连接（具有不同级别的访问权限）已建立，我们的首要任务是了解每个用户能做什么。与我们的超级用户类似，所有用户都可以使用 `dbListTables()`
  来查看数据库中的所有表。这可能看起来有悖常理，因为这些用户*只*被授予了每个表上的特定权限。在我们创建的通用数据库结构中，任何用户都能看到数据库中的表名：


  `dbListTables(conRead)`


  ## 1 "demographics" "thricedailymetrics" "dailymetrics"


  ## 4 "address"


  `dbListTables(conInsert)`


  ## 1 "demographics" "thricedailymetrics" "dailymetrics"


  ## 4 "address"


  `dbListTables(conUpdate)`


  ## 1 "demographics" "thricedailymetrics" "dailymetrics"




  ## [4] "address"（地址表）


  尽管我们的用户能够*查看*表名，但他们并**没有**超级用户那样的权限。他们无法删除表。虽然我们这里还没有为超级用户演示这一点，但请放心，`dbRemoveTable()`
  对该用户是有效的。现在，我们完全有理由认为，仅拥有只读权限且作用域仅限于 `dailymetrics` 表的 `gradstudentr` 用户，无法删除表。


  然而，请特别注意我们的 `gradstudenti` 和 `gradstudentu` 用户，他们虽然对 `address` 表拥有 `UPDATE` 或 `INSERT`
  权限，但同样无法删除该表。这很可能是一个很好的实践范例，说明为什么数据库可能比平面表格文件（例如 CSV）更优越。


  虽然这些用户拥有一定程度的访问权限，但他们进行大规模更改（无论是意外的还是故意的）的能力是受限的：


  ```

  dbRemoveTable(conRead, "address")

  ## Error in postgresqlExecStatement(conn, statement, ...) :

  ## RS-DBI driver: (could not Retrieve the result : ERROR: must be owner of table
  address

  ## )

  ## Warning in postgresqlQuickSQL(conn, statement, ...): Could not create

  execute: DROP TABLE "address"

  ## [1] TRUE

  ```


  ```

  dbRemoveTable(conInsert, "address")

  ## Error in postgresqlExecStatement(conn, statement, ...) :

  ## RS-DBI driver: (could not Retrieve the result : ERROR: must be owner of table
  address

  ## )

  ## Warning in postgresqlQuickSQL(conn, statement, ...): Could not create

  execute: DROP TABLE "address"

  ## [1] TRUE

  ```


  ```

  dbRemoveTable(conUpdate, "address")

  ## Error in postgresqlExecStatement(conn, statement, ...) :

  ## RS-DBI driver: (could not Retrieve the result : ERROR: must be owner of table
  address

  ## )

  ## Warning in postgresqlQuickSQL(conn, statement, ...): Could not create

  execute: DROP TABLE "address"

  ## [1] TRUE

  ```


  我们的用户能够列出所有数据库表的*名称*，但不能删除任何表。到目前为止一切顺利。不过，这些功能并不那么激动人心。实际的表访问权限如何呢？请记住，每个用户拥有一项或多项能力：`SELECT`（查询）、`UPDATE`（更新）或
  `INSERT`（插入）。是时候学习一点 SQL 了。我们将在本节的后面再次讨论这些结构的具体细节。然而，SQL 是一种非常直白的语言，因此即使我们还没有讨论确切含义，通过这些简单命令所发生的事情也应该是可以理解的。


  我们的 `gradstudentr` 用户对 `dailymetrics` 表拥有 `SELECT` 权限。使用我们的 R 封装函数 `dbGetQuery()`，我们向数据库服务器发送了两条略有不同的
  SQL 语句。每条语句的唯一区别在于所操作的表。请注意，一条语句生效了，而另一条没有。原因正是在于我们的 `conRead` 连接仅拥有 `gradstudentr`
  的权限，而这些权限只对 `dailymetrics` 表有效。`*` 是表示列名的通配符。因此，被允许的表的所有列名都会被显示出来。


  此命令将不会生效。我们的用户没有从 `demographics` 表进行查询的权限：


