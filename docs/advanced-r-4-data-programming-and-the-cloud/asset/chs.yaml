  此选项在以后会变得非常有用，当我们想要根据计算结果提供不同的叙述性文本时。\n\n### 15.3 动态文档与 Shiny\n\n现在，我们将注意力转向不仅提供动态文档，而且提供一个其他人可以通过动态输入进行控制的文档。我们要构建的是一个简单的\
  \ Shiny 环境，允许用户上传一个包含学生测验分数数据的 CSV 文件。\n\n数据编码如下：列代表测验中的具体问题；行代表每个学生；测验为多项选择，正确选项编码为\
  \ 1，错误选项编码为 0。\n\n与上一节类似，我们查看实现此功能所需的三个文件中每个文件的全部代码。然后，我们逐行分解这些代码。对于已经熟悉 Shiny 的读者，请随意跳到最后的章节。我们将这些代码构建在一个名为\
  \ `15_DynamicReports` 的文件夹中。之后，当我们将代码上传到 Ubuntu 服务器时，我们会上传整个文件夹。\n\n## `server.R`\n\
  \n在 Shiny 服务器端，我们调用库，然后构建上传 CSV 文件所需的系统，为用户提供文件已上传的确认，将该文件读入 R，将所需信息传递给我们的标记文档，然后允许我们的用户将该文档下载为\
  \ PDF 格式。这只需要以下 55 行代码：404\n\n## 动态报告与云\n\n```\nlibrary(shiny)\nlibrary(ltm)\nlibrary(data.table)\n\
  library(rmarkdown)\nlibrary(tufte)\nlibrary(formatR)\nlibrary(knitr)\nlibrary(evaluate)\n\
  \nfunction(input, output) {\n  output$contents <- renderTable({\n    inFile <- input$file1\n\
  \    if (is.null(inFile))\n      return(NULL)\n    read.csv(\n      inFile$datapath,\n\
  \      header = input$header,\n      sep = input$sep,\n      quote = input$quote\n\
  \    )\n  })\n\n  scores <- reactive({\n    inFile <- input$file1\n    if (is.null(inFile))\n\
  \      return(NULL)\n    read.csv(\n      inFile$datapath,\n      header = input$header,\n\
  \      sep = input$sep,\n      quote = input$quote\n    )\n  })\n\n  output$downloadReport\
  \ <- downloadHandler(\n    filename = function() {\n      paste('测验报告', sep = '.',\
  \ 'pdf')\n    },\n    content = function(file) {\n```\n\n\n\n`src <- normalizePath('report.Rmd')`\n\
  \n`owd <- setwd(tempdir())`\n\n`on.exit(setwd(owd))`\n\n`file.copy(src, 'report.Rmd',\
  \ overwrite = TRUE)`\n\n`knitr::opts_chunk$set(tidy = FALSE, cache.extra = packageVersion('tufte'))`\n\
  \n`options(htmltools.dir.version = FALSE)`\n\n`out <- render('report.Rmd')`\n\n\
  `file.rename(out, file)`\n\n前面的代码首先调用了所有我们所需的库，然后迅速进入了 Shiny 的 `function(input,\
  \ output) {}` 服务器端封装。之后，主要分为三个代码块。我们将逐一审视它们，首先从 `renderTable({})` 调用开始。这部分代码生成了用户界面端使用的输出，具体来说，它创建了一个表格。这是一个交互式函数，当用户在界面端上传文件时，Shiny\
  \ 会通知该函数其某个输入发生了变化，从而触发代码的运行。从输入端来看，`input$datapath` 是服务器上 Shiny 存储上传文件的位置。如果确实有文件存在，`read.csv()`\
  \ 可以访问该文件的数据路径，并获取数据是否包含表头、使用了何种分隔符以及用户设置的其他信息。实际上，还可以向用户询问更多信息，以实现更定制化的分析。这里，我们保持示例简洁而有效。读取的结果创建了一个表格，并将该表格存储到名为\
  \ `contents` 的输出变量中。这会产生一个效果，即 Shiny 会通知用户界面端有可用的输出。我们将在本章后续部分看到该输出的去向：\n\n`output$contents\
  \ <- renderTable({`\n\n`inFile <- input$file1`\n\n`if (is.null(inFile))`\n\n`return(NULL)`\n\
  \n`read.csv(inFile$datapath, header = input$header,`\n\n`sep = input$sep, quote\
  \ = input$quote)`\n\n`})`\n\n除了创建一个表格，以便用户能立即查看文件上传是否成功（我们设想在实际场景中，或许可以在用户界面添加注释，让用户发现上传失败的情况），我们还必须以某种格式读取数据，使我们的\
  \ markdown 文件能够使用这些数据。我们将数据读入一个名为 `scores` 的变量中。这是一个通用的、由我们创建的 `reactive({})` 函数，它会始终关注相关输入变量（此例中即文件的上传）的变化。\n\
  \n这是 Shiny 高度可定制的原因之一。尽管你已经见过一些响应式函数，但它们都有特定的用途（并因此命名）。\n\n而此函数则不同。它仅仅是响应式的，其全部行为完全由我们编写的代码决定：\n\
  \n```\nscores <- reactive({\n\ninFile <- input$file1\n\nif (is.null(inFile))\n\n\
  return(NULL)\n\nread.csv(inFile$datapath, header = input$header,\n\nsep = input$sep,\
  \ quote = input$quote)\n\n})\n```\n\n服务器端的最后一部分是最复杂的。它控制着用户可下载的文件。该代码块的第一部分控制用户下载的报告名称。我们将其命名为\
  \ `quiz-report.pdf`，这看起来只是有些复杂。这段代码为未来可能调整报告的类型或性质提供了灵活性；修改文件类型或名称变得十分容易。请注意，如果使用\
  \ RStudio 的内部浏览器，下载的报告会使用不同的名称。接下来，我们在 markdown 文件上调用 `normalizePath()`，它会返回当前工作目录的文件路径，并在路径末尾追加参数中的文件名。具体来说，它根据代码所在的操作系统环境返回路径。这很重要，原因有二：首先，它使代码能够在\
  \ Windows 和 Ubuntu（或任何操作系统）之间移植。其次，我们即将更改当前工作目录。因此，直接调用 `report.Rmd` 将不再有效。\n\n\
  更改当前工作目录至关重要，因为我们即将生成一个新的 PDF 文件。\n\n\n\n`file`。现在，在我们拥有并具有管理员权限的本地机器上，创建一个新文件完全没有问题。然而，我们的目标是上传到云端，而我们并不能保证所有服务器都有这样的权限。因此，我们将工作目录更改为服务器的临时目录。在\
  \ R 中，`setwd(tempdir())` 执行两个操作：它既复制并返回当前工作目录；然后，在此之后，它将目录更改为参数指定的目录。因此，`owd` 是旧的工作目录（*o*ld\
  \ *w*orking *d*irectory）。我们设置了一个 `on.exit()` 参数，以便一旦 `downloadHandler` 完成，工作目录会返回到它应该所在的位置，从而确保我们的\
  \ Shiny 网站不会出错。\n\n现在，我们将 Markdown 文件从其原始位置（在旧的工作目录中）复制到我们的临时区域，从而允许它在临时目录中运行并生成\
  \ PDF。我们还为 `knitr`（它负责创建 Markdown PDF）设置了一些环境选项，使其能够使用 tufte 格式（以 Edward Tufte 命名，[`rmarkdown.rstudio.com/tufte_handout_format.html`](http://rmarkdown.rstudio.com/tufte_handout_format.html)）。剩下的就是\
  \ `render()` 我们的 Markdown 文档，并将文件重命名为我们想要的名字：\n\n```\noutput$downloadReport <- downloadHandler(\n\
  \n  filename = function() {\n    paste('quiz-report', sep = '.', 'pdf')\n  },\n\n\
  \  content = function(file) {\n    src <- normalizePath('report.Rmd')\n    owd <-\
  \ setwd(tempdir())\n    on.exit(setwd(owd))\n    file.copy(src, 'report.Rmd', overwrite\
  \ = TRUE)\n\n    knitr::opts_chunk$set(tidy = FALSE, cache.extra =\n      packageVersion('tufte'))\n\
  \    options(htmltools.dir.version = FALSE)\n    out <- render('report.Rmd')\n \
  \   file.rename(out, file)\n  }\n)\n```\n\n我们所看到的是，Shiny 服务器端需要能够读取用户上传的文件，并附带适当的输入信息（例如是否存在标题行），然后负责启动\
  \ R Markdown 处理过程。诚然，要让这个过程（以及一个 Shiny 服务器）在任何计算机上都能工作，需要更改工作目录，并对布局和格式选项进行一些调整。我们以指出一个简单的\
  \ PDF 会更容易设置（尽管我们承认我们更喜欢更简洁的 tufte 布局）来结束本节。现在，我们将注意力转向用户界面。\n\n**`ui.R`**\n\n对于这个非常简单的\
  \ Shiny 应用程序，用户拥有一个相当清晰的视图。仅用 40 行代码（实际上您可以删除几个选项），用户就可以上传 CSV 文件、查看该文件渲染出的表格，并下载对该文件的分析结果。和之前一样，我们首先给出完整的代码，然后依次描述每个代码块：\n\
  \n```\n# Dynamic Reports and the Cloud User Interface\n\nshinyUI(fluidPage(title\
  \ = 'Score Control Panel',\n\n  sidebarLayout(\n    sidebarPanel(\n      helpText(\n\
  \        \"Upload a wide CSV file where\n        each column is 0 or 1 based on\
  \ whether the student\n        got that question incorrect or correct.\"\n     \
  \ ),\n\n      fileInput(\n        'file1',\n        'Choose file to upload',\n \
  \       accept = c(\n          'text/csv',\n          'text/comma-separated-values',\n\
  \          'text/tab-separated-values',\n          'text/plain',\n          '.csv',\n\
  \          '.tsv'\n        )\n      ),\n\n      tags$hr(),\n      checkboxInput('header',\
  \ 'Header', TRUE),\n      radioButtons('sep', 'Separator',\n        c(\n       \
  \   Comma = ',',\n          Semicolon = ';',\n          Tab = '\\t'\n        ),\n\
  \        ','),\n      radioButtons(\n        'quote',\n        'Quote',\n      \
  \  c(\n          None = \"\",\n          'Double Quote' = '\"',\n          'Single\
  \ Quote' = \"'\"\n        ),\n        '\"'\n      ),\n      tags$hr(),\n      helpText(\"\
  This is where helpertext goes\"),\n      downloadButton('downloadReport')\n    ),\n\
  \n    mainPanel(tableOutput('contents'))\n  ))\n)\n```\n\n和用户界面通常的情况一样，我们使用了 `fluidPage()`，以及\
  \ `sidebarPanel()` 和 `mainPanel()`。主要事件发生在侧边栏内，我们先来看那里。\n\n`fileInput()` 函数接收用户的输入文件。我们可以控制接受的文件类型，并将自己限制为逗号分隔值或制表符分隔值。我们将上传文件命名为\
  \ `file1`，回想在服务器端，我们使用 `input$file1` 来读取文件：\n\n```\nfileInput('file1', 'Choose file\
  \ to upload',\n  accept = c(\n    'text/csv',\n    'text/comma-separated-values',\n\
  \    'text/tab-separated-values',\n    'text/plain',\n    '.csv',\n    '.tsv'\n\
  \  )\n),\n```\n\n另一个我们主要感兴趣的代码行是下载区域。理解起来并不特别复杂：\n\n```\ndownloadButton('downloadReport')\n\
  ```\n\n虽然有一些帮助文本块向用户解释，并且我们确实建议在实际使用中设置示例布局，以便您的用户理解可接受的输入，但我们选择了尽可能精简这个用户界面。在我们将注意力转向实际的报告文件之前，我们将在图\
  \ 15-2 中展示上传了我们的 `scores.csv` 文件（该文件可在 Apress 网站和/或本书的 GitHub 上找到）后的 Shiny 应用程序。\n\
  \n![Image 243](img/index-419_1.png)\n\n**Figure 15-2.** Shiny user interface, live\
  \ on a locally hosted website\n\n---\n\n**`report.Rmd`**\n\n这份报告是关于一次测验或其他测试中每个问题的学生得分。我们的目标是获取图\
  \ 15-2 中显示的输入，并将其转换为关于问题和测试有效性的可操作的、概括性的信息。在阅读完所有代码的首次展示之前，花点时间将这段代码与一个独立的 Markdown\
  \ 文件进行比较和对照。没有重大差异。事实上，要知道这个文件是从 Shiny 应用程序渲染的，唯一方法就是这一行代码：\n\n`scores <- scores()`.\n\
  \n```\n---\ntitle: \"Example Scoring Report\"\nsubtitle: \"Item-Level Analysis\"\
  \ndate: \"`r Sys.Date()`\"\noutput:\n  tufte::tufte_handout: default\n---\n\n# Raw\
  \ Data\n\nHere is a sample of the data uploaded including the first few and last\n\
  rows, and first few and last columns:\n\n```{r echo=FALSE, include = FALSE}\nscores\
  \ <- scores()\nscores <- as.data.table(scores)\nsetnames(scores, 1, \"Student\"\
  )\n```\n\n```{r, echo = FALSE, results = 'asis'}\nif (nrow(scores) > 6) {\n  row.index\
  \ <- c(1:3, (nrow(scores)-2):nrow(scores))\n}\nif (ncol(scores) > 6) {\n  col.index\
  \ <- c(1:3, (ncol(scores)-2):ncol(scores))\n}\nkable(scores[row.index, col.index,\
  \ with = FALSE])\n```\n\n```{r, include = FALSE}\nitems <- names(scores)[-1]\nscores[,\
  \ SUM := rowSums(scores[, items, with = FALSE])]\n\n## now calculate biserial correlations\n\
  ## first melt data to be long\nscores.long <- melt(scores, id.vars = c(\"Student\"\
  , \"SUM\"))\n\n## calculate biserial correlation, by item\n## order from high to\
  \ low\nbiserial.results <- scores.long[, .(\n  r = round(biserial.cor(SUM, value,\
  \ level = 2), 3),\n  Correct = round(mean(value) * 100, 1)\n), by = variable][order(r,\
  \ decreasing = TRUE)]\n\nalpha.results <- cronbach.alpha(scores[, !c(\"Student\"\
  , \"SUM\"), with=FALSE])\nrasch.results <- rasch(scores[,!c(\"Student\", \"SUM\"\
  ), with=FALSE])\n```\n\nThe test overall had `r ifelse(alpha.results$alpha > .6,\
  \ \"acceptable reliability\", \"low reliability\")` of\nalpha = `r format(alpha.results$alpha,\
  \ FALSE, 2, 2)`.^[Alpha ranges from 0 to 1, with one indicating a perfectly reliable\
  \ test.]\n\nThe graph shows the measurement error by level of\nability.^[Higher\
  \ values indicate more measurement error,\nindicating the test is less reliable\
  \ at very low and very high ability\nlevels (scores).]\n\n```{r, echo = FALSE, fig.width\
  \ = 5, fig.height = 4}\n## The Standard Error of Measurement can be plotted by\n\
  vals <- plot(rasch.results, type = \"IIC\", items = 0, plot = FALSE)\nplot(vals[,\
  \ \"z\"], 1 / sqrt(vals[, \"info\"]), type = \"l\", lwd = 2,\n  xlab = \"Ability\"\
  , ylab = \"Standard Error\",\n  main = \"Standard Error of Measurement\")\n```\n\
  \n\n\n# 项目分析\n\n各**项**目的结果如下表所示。`r` 表示项目与总分的点二列相关。*Correct* 表示某个项目的正确回答百分比。项目按相关度从高到低排序。\n\
  \n## 第 15 章 动态报告\n\n```\n{r, echo = FALSE, results = 'asis'}\nkable(biserial.results)\n\
  ```\n\n我们现在逐块解析这个 Markdown 文件的每一部分。这个标题比第一个稍微高级一些。请注意，我们使用内联 R 代码将日期设置为当前日期。此外，我们的输出不再仅仅是`pdf_document`。相反，我们使用了默认的`tufte_handout`样式（这是一种带有样式信息的\
  \ PDF 格式）。我们通过其包来正式调用该样式（回想一下，`library(tufte)`存在于服务端）：\n\n**title**: \"示例评分报告\"\n\
  **subtitle**: \"项目层面分析\"\n**date**: `` `r Sys.Date()'``\n**output**:\n  `tufte::tufte_handout`:\
  \ default\n\n接下来是将我们的评分数据读入 Markdown 文件。我们已熟悉`echo=FALSE`，它用于阻止代码显示。然而，我们还设置了`include=FALSE`，它用于阻止代码的任何输出显示。如前所述，我们使用来自\
  \ Shiny 服务端的变量`scores()`，这是在服务端通过`read.csv()`读取评分数据的地方。\n\n回想一下，在 Shiny 服务端，我们只是将变量命名为`scores`。但在\
  \ rmarkdown 文件中，我们将其作为*函数*来调用（毕竟它会动态更新）。为了避免一直将变量作为函数调用，我们在此处使用一个同名的本地环境变量`scores`来重新命名它。这看起来有点奇怪，但完全与作用域和环境有关：\n\
  \n```\n{r echo=FALSE, include = FALSE}\nscores <- scores()\nscores <- as.data.table(scores)\n\
  setnames(scores, 1, \"Student\")\n```\n\n我们的下一个代码块包含了`results='asis'`，以防止对我们的 *k*\
  \ nitr *t* able（称为`kable`）进行进一步处理。此外，这段代码将输出前 3 行和最后 2 行的部分行列数据，形成一个小示例的 kable 表格。只有当行数或列数超过\
  \ 6 行或列时，才会执行此操作。\n\n## 第 15 章 动态报告\n\n虽然随意展示用户数据的`head()`和`tail()`看起来有些随机，但主要的观察点是，逻辑判断可以存在于\
  \ rmarkdown 文档内部。对于某些报告，我们甚至可以根据结果是否达到显著性水平（或任何其他标准）来扩展解释性文本：\n\n```\n{r, echo =\
  \ FALSE, results = 'asis'}\nif (nrow(scores) > 6) {\n  row.index <- c(1:3, (nrow(scores)-2):nrow(scores))\n\
  }\nif (ncol(scores) > 6) {\n  col.index <- c(1:3, (ncol(scores)-2):ncol(scores))\n\
  }\nkable(scores[row.index, col.index, with = FALSE])\n```\n\n从这里开始，我们使用`ltm`包计算测试或问题的多个信度指标。点二列相关使用了更常见的皮尔逊相关，并根据测验问题为二元数据这一事实进行了调整。它能够比较学生在特定问题上的表现与他们在整个测验中的表现（因此我们将其与`rowSums()`进行比较）。通过将这些数据从高到低排序，我们可以找出得分最低的测验问题。这些问题可能没有衡量出我们测验的主旨（诚然，这是一个非常简化的说法——心理测量学是一门远超本文范围的科学）。此外，我们还计算了克隆巴赫α系数和\
  \ Rasch 模型，供后续使用。同样，我们目前并不打算将这些结果直接包含在动态文档中。但是，我们可以在需要时访问它们，以备后用：\n\n```\n{r, include\
  \ = FALSE}\nitems <- names(scores)[-1]\nscores[, SUM := rowSums(scores[, items,\
  \ with = FALSE])]\n## 现在计算双列相关\n## 首先将数据融为长格式\nscores.long <- melt(scores, id.vars\
  \ = c(\"Student\", \"SUM\"))\n## 按项目计算双列相关\n## 从高到低排序\nbiserial.results <- scores.long[,\
  \ .(\n  r = round(biserial.cor(SUM, value, level = 2), 3),\n  Correct = round(mean(value)\
  \ * 100, 1)\n), by = variable][order(r, decreasing = TRUE)]\nalpha.results <- cronbach.alpha(scores[,\
  \ !c(\"Student\", \"SUM\"), with=FALSE])\nrasch.results <- rasch(scores[,!c(\"Student\"\
  , \"SUM\"), with=FALSE])\n```\n\n并非所有代码都必须放在正式的代码块中；代码也可以内联于文档的文本中。这很有用，因为我们可以设定分数线（本例中半随意地设为\
  \ 0.6），并根据这些分数在最终报告中生成不同的文本。`tufte`包允许通过`^[]`指定侧边栏注释：本次测验整体的α系数 = `` `r format(alpha.results$alpha,\
  \ FALSE, 2, 2)` ``，表现为 `` `r ifelse(alpha.results$alpha > .6, \"可接受的信度\", \"低信度\"\
  )` ``。`[α系数取值范围为 0 到 1，1 表示测验完全可靠。]`\n\n该图显示了按能力水平划分的测量**误差**。`[数值越高表示测量**误差**越大，说明测验在能力水平极低和极高（分数）时信度较低。]`\n\
  \n回想一下我们之前的讨论，图形大小可以在代码块中控制。在此，我们绘制了 Rasch 模型，并看到高绩效和低绩效学生的测量精度较低：\n\n```\n{r, echo\
  \ = FALSE, fig.width = 5, fig.height = 4}\n```\n\n\n\n## 测量标准误可通过以下方式绘制\n\n```r\n\
  vals <- plot(rasch.results, type = \"IIC\", items = 0, plot = FALSE)\nplot(vals[,\
  \ \"z\"], 1 / sqrt(vals[, \"info\"]), type = \"l\", lwd = 2, xlab = \"能力值\", ylab\
  \ = \"标准误\", main = \"测量标准误\")\n```\n\n代码最后以一行 `kable` 结尾，但我们已经见过这个用法，无需赘述。图 15-3\
  \ 展示的是下载后的最终结果。\n\n# 第 15 章 动态报告\n\n请注意，所有被隐藏的代码都不会显示。同时，注意数据的样本量，因为从图 15-2 可知，数据行数或列数远不止六行。最后，请注意自动编号的侧边注释，它们提供了更多细节。这些注释是通过在文档文本区域内使用\
  \ `^[]` 代码生成的。这种写法能非常方便地提供更详细、但非必需的信息。\n\n### 15.4 上传至云端\n\n最后一项任务是将文件从本地机器上传至云端实例。请记住，在前面的章节中，我们不仅使用\
  \ `PuTTY` 在云端安装了 Shiny Server，还使用 `WinSCP` 将文件上传至云端。我们启动 `WinSCP`，重新连接，并确保左侧本地路径位于\
  \ Shiny 应用程序文件夹，右侧云端服务器路径位于 `/home/ubuntu`。图 14-5 回顾了这一操作的结果。\n\n接着，我们访问 `PuTTY`，并在命令行中运行以下代码：\n\
  \n```bash\nsudo cp -R ~/15_DynamicReports /srv/shiny-server/\n```\n\n请记住，在前面的章节中，我们调整了实例配置，允许从特定地址访问特定端口。现在，你可以通过在浏览器中输入以下\
  \ URL 来验证应用程序是否正常工作：\n\n`http://你的.实例.IP.地址:3838/15_DynamicReports/`\n\n### 15.5\
  \ 总结\n\n在最后一章中，我们构建了一个动态文档，它可以根据新数据快速更新。这种更新甚至可以扩展到图形和行内 `if`/`else` 语句，从而使报告叙述本身也能根据新数据变化。此外，我们还构建了一个\
  \ Shiny 应用程序，允许有互联网连接的用户上传文件，为这类报告提供新数据。此类报告可以下载为多种格式，不过我们选择了 PDF。本节使用的关键函数列于表 15-1。\n\
  \n在全书内容中，我们提供了高级数据管理技术，包括如何连接各种数据库。这些技术与动态文档以及将数据仓库中的信息轻松转化为可执行情报的能力相得益彰。我们最后的观点是：随着数据日益庞大，成功筛选并呈现有用数据的能力，将成为任何领域中愈发重要的技能。\n\
