- "# 运行应用\n\n```r\nshinyApp(ui = ui, server = server)\n```\n\n仪表盘的主体中可以放置许多项目。然而，如果我们想使用之前在侧边栏部分编码的选项卡，我们需要通过\
  \ `tabItems()` 进行全局调用。该函数不接受除单个 `tabItem()` 函数调用之外的任何参数；每个 `tabItem()` 都需要拥有一个唯一的\
  \ `tabName`，**与**`sidebarMenu()` 中唯一的 `tabName` **匹配**。\n\n## 第 14 章 Shiny 仪表盘示例\n\
  \n每个 `tabItem()` 内部包含什么？与 Shiny 一样，将布局设计得足够灵活，以使仪表盘能够适应各种尺寸的浏览器窗口（例如，移动端与桌面端平台）是非常有益的。因此，常见的\
  \ `fluidRow()` 函数再次出现。回想一下，`fluidRow()` 的行宽最多被设置为 12 个单位。记住这一点，请密切关注我们将要讨论的用于填充这些行的三个盒子对象的默认宽度。当然，并非只有这三种对象；再次强调，我们的目标是让您能够快速上手，从而通过云将数据提供给您的用户或利益相关者。\n\
  \n行中最基本的输入元素是 `box()`。在这个函数内部，我们可以放置前一章中使用的任何应用代码，无论是用于向用户征求输入还是输出响应式内容。然而，`box()`\
  \ 也接受九个特定的参数。\n\n自然地，每个 `box()` 都可以包含一个 `title` 值，这是一个用户定义的文本字符串，用于简洁地描述盒子的内容或所需操作。在盒子的底部，有一个\
  \ `footer`，它也可以接受一个文本字符串。盒子还有一个 `status`，可以设置为 `primary`、`success`、`info`、`warning`\
  \ 或 `danger`。每个状态值都有一个关联的颜色，这是默认层叠样式表结构的一部分，使 `shinydashboard` 看起来相当美观。这些颜色相当一致，尽管它们可能会因您为整个仪表盘选择的颜色而略有差异。`solidHeader`\
  \ 的默认值是 `FALSE`，当然，这可以更改为 `TRUE`。选择该选项会增强状态的颜色，使其成为标题文本的窄横幅背景。如果您希望盒子的主体区域具有特定颜色，可以从大约\
  \ 15 种有效的颜色选项中设置 `background`。顾名思义，输入和输出代码的显示视觉上会出现在该背景之上。盒子的默认 `width` 是 6，因此除非您采取措施缩小它们，否则两个盒子会填满一行。忘记保持\
  \ `fluidRow()` 总宽度为 12 可能会导致一些奇特的布局。盒子的 `height` 也可以设置为固定高度。如果您需要非常整齐的行，这可能会很有帮助。最后，盒子是\
  \ `collapsible`（可折叠）的，并且可能已经 `collapsed`（折叠），尽管这两个选项的默认值都是 `FALSE`。图 14-4 展示了这些不同设置的一些结果：\n\
  \n```r\nformals(box)\n```\n\n```\n## $...\n##\n##\n## $title\n## NULL\n##\n## $footer\n\
  ## NULL\n##\n## $status\n## NULL\n##\n## $solidHeader\n## [1] FALSE\n##\n## $background\n\
  ## NULL\n##\n## $width\n## [1] 6\n##\n## $height\n## NULL\n##\n## $collapsible\n\
  ## [1] FALSE\n##\n## $collapsed\n## [1] FALSE\n```\n\n另一种类型的盒子是 `valueBox()`，它接受六个形式参数。第一个是\
