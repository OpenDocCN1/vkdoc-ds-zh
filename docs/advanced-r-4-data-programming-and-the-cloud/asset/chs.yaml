  \ 下载数据，这里我们选择了 *Stata* 格式。我们将文件夹放置在工作目录中的 `data/ch08/` 文件夹下，并使用 `read.dta()` 将数据导入\
  \ `R`。将其转换为数据表后，我们将键设置为识别号列 `IDNUMR`：\n\n```r\nd <- read.dta(\"data/ch08/ICPSR_04691/DS0001/04691-0001-Data.dta\"\
