  \ PostgreSQL（以及硬盘）中的空间。现在，有了所有可用的额外空间，向数据库写入新数据不会占用更多磁盘空间。但是，如果我们需要强制清理“死”字节，SQL\
  \ 有一个`VACUUM FULL`操作，可以将数据库缩减到仅包含活动数据。在我们的案例中，这不会花太长时间。我们的结构很简单。更复杂的数据库和服务器可能会发现此操作的代价较高。因此，这是一种数据库维护操作，可能仅定期或根据需要执行：\n\
  \n第 10 章 读取大数据\n\n```\ndbGetQuery(conSuper, \"VACUUM FULL\")\n```\n\n```\n## data\
  \ frame with 0 columns and 0 rows\n```\n\n至此，我们已经学习了很多关于在 R 中使用 SQL 数据库的知识。虽然 SQL\
  \ 本身是一种语言，但这足以让高级 R 用户开始进行数据分析和数据维护了。\n\n我们加入这倒数第二段代码仅为了完整性。通过从 SQL 数据库中删除这些表，你现在可以重新运行之前的所有代码并获得相同结果。否则，尝试写入一张表（就像我们在本章早期填充数据库时所做的那样）会导致错误：\n\
  \n```\ndbRemoveTable(conSuper, \"address\")\n```\n\n```\n## [1] TRUE\n```\n\n```\n\
  dbRemoveTable(conSuper, \"demographics\")\n```\n\n```\n## [1] TRUE\n```\n\n```\n\
  dbRemoveTable(conSuper, \"thricedailymetrics\")\n```\n\n```\n## [1] TRUE\n```\n\n\
  ```\ndbRemoveTable(conSuper, \"dailymetrics\")\n```\n\n```\n## [1] TRUE\n```\n\n\
  ```\ndbRemoveTable(conSuper, \"iris\")\n```\n\n```\n## [1] TRUE\n```\n\n```\ndbGetQuery(conSuper,\
  \ \"VACUUM FULL\")\n```\n\n```\n## data frame with 0 columns and 0 rows\n```\n\n\
  要关闭此连接，需要两步而不是一步，因为我们必须断开与 PostgreSQL 的连接并卸载允许 DBI 建立该连接的驱动程序。如果成功，两者都将返回`TRUE`：\n\
  \n第 10 章 读取大数据\n\n```\ndbDisconnect(conSuper)\n```\n\n```\n## [1] TRUE\n```\n\n\
  ```\ndbUnloadDriver(drv)\n```\n\n\n\n### 1. TRUE\n\n`rm(conSuper, drv, query)`\n\
  \n至此，我们完成了 PostgreSQL 的演示。真正让您目前掌握的知识发挥更大作用的方法，是进一步深入 SQL 语法，在更复杂的查询中使用 `dbGetQuery()`。不过，就目前而言，一个足够小的数据量应该能够读入\
  \ R 中，以便进行一些分析。\n\n### 10.8 小结\n\n本章介绍了如何使用 R 直接访问 SQL 数据库。虽然许多功能并非为数据整理而设计，但 R\
  \ 仍然提供了一种快速处理大数据的方法。这类数据集似乎变得越来越常见，虽然让研究人员熟悉每一个数据库可能不切实际，但这并非必需。\n\n使用 R，完全有可能提取出包含所有感兴趣项目且足够小（能放入工作内存）的数据子集。熟练的\
  \ R 用户（例如本书的读者）可以进一步在 R 本身中精简数据，并据此执行所需的分析。\n\n表 10-1 总结了本章的关键函数和短语。\n\n**第 10 章\
