  \ factor(cyl)6 -4.2112 1.9389 -2.17 0.0392 *\n## factor(cyl)8 -8.6510 2.6974 -3.21\
  \ 0.0035 **\n## hp:vs -0.0910 0.0436 -2.09 0.0469 *\n## ---\n## Signif. codes: 0\
  \ '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n##\n## Residual standard error:\
  \ 3 on 26 degrees of freedom\n## Multiple R-squared: 0.791, Adjusted R-squared:\
  \ 0.751\n## F-statistic: 19.7 on 5 and 26 DF, p-value: 4.18e-08\n\n我们可以使用以下代码检查对象的类，并确认当前没有`ggplot()`方法：\n\
  \n```\nclass(m)\n```\n\n## [1] \"lm\"\n\n```\nmethods(ggplot)\n```\n\n## [1] ggplot.default*\
  \ ggplot.function* ggplot.summaryP*\n## [4] ggplot.transcan*\n\n\n\n## 查看 `?methods`\
  \ **以访问帮助和源代码**\n\n尽管 `fortify()` 函数为线性模型提供了一个方法，可以创建适用于 `ggplot()` 的数据框，但它只提取原始数据、拟合值和残差。为了展示模型的效果，将预测值作为某个变量的函数（同时将其他变量保持在特定值）绘制出来是很有帮助的。下文所述的方法实现了一个实现此功能的系统。\n\
  \n该方法采用与 `ggplot()` 相同的基本参数，但增加了 `vars` 参数，并且模型中使用的每个变量都传递一组特定的值，以便在预测时将其保持在该值。通过使用\
  \ `do.call()` 函数将这些列表作为参数传递给 `expand.grid()` 函数，可以创建这些值的所有可能组合。然后，从模型公式中提取因变量（即\
  \ `yvar`），并将其转换为字符。生成新的预测值以及预测值的标准误差。基于拟合值或预测值以及正态分位数乘以拟合值的标准误差，生成一个 95% 的置信区间，其中包含下限\
  \ `LL` 和上限 `UL`。最后，列名从 `fit` 更改为因变量的实际名称，然后将预测数据和预测值合并到一个新的数据框中。该数据框被传递给 `ggplot()`，后者会分派到数据框的\
  \ `ggplot()` 方法：\n\n```r\nggplot.lm <- function(data, mapping, vars, ...) {\n  newdat\
  \ <- do.call(expand.grid, vars)\n  yvar <- as.character(formula(data)[[2]])\n  d\
  \ <- as.data.frame(predict(data, newdata = newdat, se.fit = TRUE))\n  d <- within(d,\
  \ {\n    LL <- fit + qnorm(.025) * se.fit\n    UL <- fit + qnorm(.975) * se.fit\n\
  \  })\n  colnames(d)[1] <- yvar\n  data <- cbind(newdat, d[, c(yvar, \"LL\", \"\
  UL\")])\n  ggplot(data = data, mapping = mapping, ...)\n}\n```\n\n有了这个方法，我们可以轻松地从线性回归模型创建一些图表。以下代码使用了我们的新方法，指定了预测变量的确切值，通过\
  \ `geom_line()` 添加了一条线，并使用 `theme_bw()` 应用了黑白主题。结果如图 5-2 所示，代码如下：\n\n```r\nggplot(m,\
  \ aes(hp, mpg), vars = list(\n  hp = min(mtcars$hp):max(mtcars$hp),\n  vs = mean(mtcars$vs),\n\
  \  cyl = 8)) +\n  geom_line(size=2) +\n  theme_bw()\n```\n\n**图 5-2.** 使用 `ggplot.lm()`\
  \ 方法从模型得到的预测回归线\n\n由于我们的方法中使用 `expand.grid()` 创建了预测变量值的所有可能组合，我们可以绘制多条预测线，例如将 `vs`\
  \ 保持在 0 和 1 时，如以下示例代码和图 5-3 所示。\n\n```r\nggplot(m, aes(hp, mpg, linetype = factor(vs),\
  \ group = factor(vs)), vars =\n  list(\n    hp = min(mtcars$hp):max(mtcars$hp),\n\
  \    vs = c(0, 1),\n    cyl = 8)) +\n  geom_ribbon(aes(ymin = LL, ymax = UL), alpha\
  \ = .25) +\n  geom_line(size=2) +\n  theme_bw()\n```\n\n**图 5-3.** 使用 `ggplot.lm()`\
  \ 方法从模型得到的带置信区间的预测回归线\n\n这些例子简单介绍了编写新类和新方法，或扩展现有类和方法时可以做些什么。由于 S3 系统是 R 中最常用的系统，它可能是需要学习的最重要的系统；它可以被广泛使用，并能扩展许多对象类。\n\
  \n## 5.2 S4 系统\n\n与 S3 系统相比，S4 系统是一个形式化的系统。这种形式化的好处是能够更好地保证特定类的对象完全包含预期的内容。形式化的缺点是复杂性更高：设置类和方法需要更多的函数，并且编程要求更严格。\n\
  \nS3 系统允许编写快速而粗糙的代码，而 S4 系统需要更周密的规划，并且开销更高。\n\n对象有三个组成部分：类、槽和方法。对象的名称和结构（即对象包含的内容）是类。存储在对象中的变量或其他对象是槽。最后，可以对对象操作的函数是它的方法。在本节中，我们将逐一介绍这些组成部分。关于\
  \ S4 系统的进一步阅读，John Chambers 的《*Software for Data Analysis: Programming with R*》（Springer，2010）是一本极好的指南。\n\
  \n### S4 类\n\n由于 S4 类更具形式化，在编写新类之前需要规划。与 S3 类不同，在 S4 中，必须指定要包含的每个变量的名称和类型。之前我们使用\
  \ S3 系统定义了一个名为 `textplot` 的类。我们可以使用 S4 系统定义相同的类。`x` 和 `y` 参数都应为数值类型，`labels` 参数应为字符串。我们还知道所有参数的长度应该相同。最后，我们可能希望断言，虽然允许缺少标签，但不允许空白标签。所有这些都需要提前考虑和指定，因为虽然在\
  \ S3 系统中无法控制这些，但在 S4 系统中我们可以在创建类时定义一切。\n\n为了创建第一个 S4 类，我们使用 `setClass()` 函数，如下例所示。并非每个参数都是必需的，但通常认为在定义新类时尽可能明确是一种好的实践。\n\
  \n**注意** S4 类通过调用 `setClass()` 创建。`Class` 和 `slots` 参数是必需的。类名称指定为字符串，槽（持有变量）定义为一个命名字符向量；名称对应槽名称，值对应每个槽的类。可以使用\
  \ `prototype` 参数指定一个“空”对象，并且可以通过向 `validity` 参数传递一个函数来设置有效性检查。\n\n第一个参数 `Class`\
  \ 提供了类的名称。接下来，使用一个命名字典来定义槽，其中名称表示槽名称，值表示每个槽的类型。`prototype` 参数不是必需的，但定义它很有帮助，因为它决定了如何创建一个“空”对象，或者当未指定具体数据时如何创建该类的一个对象。`validity`\
  \ 参数也不是必需的，但允许进行显式检查，以确保对象符合预期。R 默认情况下确保适当类型的对象被传递到槽中，但可以添加许多其他测试和有效性检查，以减少创建不按预期工作的对象的可能性。以下是\
  \ `setClass()` 的示例：\n\n```r\nsetClass(\n  Class = \"textplot\",\n  slots = c(\n\
  \    x = \"numeric\",\n    y = \"numeric\",\n    labels = \"character\"\n  ),\n\
  \  prototype = list(\n    x = numeric(),\n    y = numeric(),\n    labels = character()\n\
  \  ),\n  validity = function(object) {\n    if (length(object@x) != length(object@y))\
  \ {\n      stop(\"Lengths of x and y must match\")\n    }\n    if (length(object@x)\
  \ != length(object@labels)) {\n      stop(\"Lengths of x, y and labels must match\"\
  )\n    }\n    if (any(object@labels == \"\")) {\n      stop(\"Blank labels are not\
  \ allowed\")\n    }\n    return(TRUE)\n  }\n)\n```\n\n\n\n#### S4 系统 - 类 ####\n\n\
  `setClass`(\nClass = \"textplot\",\nslots = c(\nx = \"numeric\",\ny = \"numeric\"\
  ,\nlabels = \"character\"),\nprototype = list(\nx = numeric(0),\ny = numeric(0),\n\
  labels = character(0)),\nvalidity = `function`(object) {\nstopifnot(\n`length`(object@x)\
  \ == `length`(object@y),\n`length`(object@x) == `length`(object@labels))\n`if` (!\
  \ `all`(nchar(object@labels) > 0, na.rm = TRUE)) {\nstop(\"所有标签必须缺失或为非零长度字符\")\n\
  }\n`return`(TRUE)\n}\n)\n\n要在 S4 系统中创建特定类的对象，我们使用`new()`函数。在接下来的代码中，我们将检查三次创建新对象的尝试。首先，我们创建一个正确且有效的对象。然后，我们观察如果尝试使用错误类型的参数会发生什么。最后，我们来看一个测试我们创建的验证函数的示例：\n\
  \n`new(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2, 4),\nlabels = c(\"First\", \"\
  Second\", \"Third\"))`\n\n```\n## 一个类为\"textplot\"的对象\n## 槽 \"x\":\n## [1] 1 3 5\n\
  ```\n\n```\n## \n## 槽 \"y\":\n## [1] 1 2 4\n## \n## 槽 \"labels\":\n## [1] \"First\"\
  \ \"Second\" \"Third\"\n```\n\n`new(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2,\
  \ 4),\nlabels = 1:3)`\n\n```\n## Error in validObject(.Object): invalid class \"\
  textplot\" object: invalid object for slot \"labels\"\n```\n\n`new(\"textplot\"\
  ,\nx = c(1, 3, 5),\ny = c(1, 2, 4),\nlabels = c(\"First\", \"Second\", \"\"))`\n\
  \n```\n## Error in validityMethod(object): All labels must be missing or non zero\
  \ length characters\n```\n\n如果我们使用 S3 系统来定义类，这些错误就不会发生，因为 S3 系统没有类型检查或验证检查。在前面的例子中，每次尝试创建新对象时最多只有一个错误。下一个例子有两个错误：传递给`y`槽的向量与其他两个长度不同，并且有一个零长度的字符标签。然而，按照当前的编写方式，只有第一个错误会被捕获，因为验证函数一旦遇到任何问题就会停止：\n\
  \n```\n## 多个错误\nnew(\"textplot\",\nx = c(1, 3, 5),\ny = c(1, 2),\nlabels = c(\"\
  First\", \"Second\", \"\"))\n## Error in validityMethod(object): length(object@x)\
  \ == length(object@y) is not TRUE\n```\n\n另一种编写验证函数的方式是，不针对任何问题立即抛出错误，而是收集所有错误并在最后全部返回。在修改验证函数的同时，我们还可以考虑如何让错误信息更具信息量。目前来看，问题是什么相当直观，但可能无法确切了解问题所在。例如，显然长度不相等，但到底是`x`太长还是`y`太短？这一点在用于定义类的修订代码中得到了实现。\n\
  \n然而，在深入改进验证函数之前，我们需要简要了解一下在 R 中创建和格式化字符串的方法。首先，在编写文本时，可以通过包含特殊字符`\\n`来插入换行符。为了查看示例，我们使用`cat()`函数，它代表拼接和打印，并将文本输出到\
  \ R 控制台（如果指定了文件，则输出到其他位置）。以下两个示例除了第二个示例中`a`和`b`之间的换行符外，完全相同：\n\n```\n## 关于格式化文本字符串的简短说明\n\
  cat(\"ab\", fill = TRUE)\n## ab\ncat(\"a\\nb\", fill = TRUE)\n## a\n## b\n```\n\n\
  一个常用的函数是`paste()`，它可以组合向量或将其合并。第一个示例展示了组合操作。两个向量通过分隔符（在我们的例子中是空字符串）进行组合，分隔符由`sep`参数定义。在第二个示例中，一个包含多个元素的向量被合并成一个单一的字符串。向量元素如何组合成一个字符串由`collapse`参数决定，在我们的例子中，这个参数是换行符：\n\
  \n`paste(c(\"a\", \"b\"), c(1, 2), sep = \"\")`\n```\n## [1] \"a1\" \"b2\"\n```\n\
  \n`paste(c(\"a\", \"b\"), collapse = \"\\n\")`\n```\n## [1] \"a\\nb\"\n```\n\n这些函数在编写验证函数时非常有用，因为它们允许我们根据需要将多个错误用换行符组合成一个字符串。我们使用的另一个关键函数是`sprintf()`。它的第一个参数是用户自定义的字符串，其中包含特殊符号（总是以百分号`%`开头），用于表示需要替换的值。后续参数是要替换的值。用一个例子来展示可能最清晰。这里，`%d`用于指示要替换一个整数，然后\
  \ R 会依次替换为`98`、`80`和`75`。替换的顺序就是出现的顺序：`sprintf(\"First (%d), Second (%d), Third\
  \ (%d)\", 98, 80, 75)`\n\n```\n## [1] \"First (98), Second (80), Third (75)\"\n\
  ```\n\n常用的格式化替换选项包括：`%d`用于整数，`%f`用于定点小数，`%s`用于字符串，`%%`用于字面百分号。每个选项都在下一个示例中演示，更多文档可在帮助页面`?sprintf`中找到。\n\
  \n对于数值，我们使用`0.2`来指定数字应四舍五入到小数点后两位：\n\n`sprintf(\"Integer %d, Numeric %0.2f, String\
  \ %s, They won by 58%%\", 5, 3.141593, \"some text\")`\n```\n## [1] \"Integer 5,\
  \ Numeric 3.14, String some text, They won by 58%\"\n```\n\n掌握了`paste()`和`sprintf()`之后，我们可以继续修改`textplot`类的验证函数，以提供更具信息量的错误信息，并运行所有检查，在过程中收集错误，最后全部返回。最后一点：之前我们使用`new(\"\
  classname\", arguments)`这个惯用法来创建特定类的新对象。虽然这完全可以接受，但有一种快捷方式。调用`setClass()`主要是为了定义新类的副作用，但它也会不可见地返回一个构造函数。如果我们保存`setClass()`调用的结果（按照惯例，保存在与类同名的对象中），我们就可以使用结果对象来创建该类的新对象：\n\
  \n```\n## 修订版，以捕获多个错误并提供更多信息\ntextplot <- setClass(\n  Class = \"textplot\",\n \
  \ slots = c(\n    x = \"numeric\",\n    y = \"numeric\",\n    labels = \"character\"\
  ),\n  prototype = list(\n    x = numeric(0),\n    y = numeric(0),\n    labels =\
  \ character(0)),\n  validity = function(object) {\n    errors <- character()\n \
  \   if (length(object@x) != length(object@y)) {\n      errors <- c(errors,\n   \
  \               sprintf(\"x (长度为 %d) 和 y (长度为 %d) 不相等\", length(object@x), length(object@y)))\n\
  \    }\n    if (length(object@x) != length(object@labels)) {\n      errors <- c(errors,\n\
  \                  sprintf(\"x (长度为 %d) 和 labels (长度为 %d) 不相等\", length(object@x),\
  \ length(object@labels)))\n    }\n    if (! all(nchar(object@labels) > 0, na.rm\
  \ = TRUE)) {\n      errors <- c(errors, sprintf(\n        \"有 %d 个标签长度为零。所有标签必须缺失或为非零长度\"\
  ,\n        sum(nchar(object@labels) == 0, na.rm = TRUE)))\n    }\n    if (length(errors))\
  \ {\n      stop(paste(c(\"\\n\", errors), collapse = \"\\n\"))\n    } else {\n \
  \     return(TRUE)\n    }\n  }\n)\n```\n\n现在，当我们创建同一个具有多个问题的对象时，我们会得到更多信息，并且节省了一些按键操作。我们可以看到`x`和`y`的长度，还能知道标签存在问题：\n\
  \n```\n## 多个错误，信息更丰富\ntextplot(\n  x = c(1, 3, 5),\n  y = c(1, 2),\n  labels = c(\"\
  First\", \"Second\", \"\"))\n## Error in validityMethod(object):\n##\n## x (长度为\
  \ 3) 和 y (长度为 2) 不相等\n```\n\n\n\n"
- "# 有 1 个标签的长度为**零**。所有标签必须缺失或具有非零**长度**\n\n### S4 类继承\n\n到目前为止，你已经了解了如何定义新的 S4 类。这可能仍然让人觉得，使用\
  \ S4 系统比 S3 系统需要更多的工作，而且除了更正式的数据验证和错误检查之外，好处甚微。S4 系统的一个强大特性是继承。\n\n**注意**：S4 类可以通过调用\
  \ `setClass()` 并附加参数 `contains = \"要继承的 S4 类\"` 来继承现有的 S4 类。现有的槽位、原型和有效性检查都会被继承。在新的\
  \ `setClass()` 调用中，只需要指定新的槽位以及相应的原型和有效性检查。\n\n我们之前创建了一个简单的 `textplot` 类。现在假设，虽然有时我们的简单类已经足够，但其他时候我们可能需要更多功能。例如，有时我们可能希望深入数据，并根据某个分组变量为数据的不同子集创建一个面板图。为此，我们需要一个\
  \ `groupedtextplot` 类。然而，我们额外需要的数据只是一个新的槽位。一种选择是复制和粘贴我们旧的代码，然后根据需要修改它。在本节中，我们将探讨如何使用继承来重用和扩展现有的类。当一个类继承自另一个类时，前一个类的所有槽位以及有效性检查都会被继承。接下来，我们创建\
  \ `groupedtextplot` 类。这类似于创建一个新类，但我们只定义新的槽位，然后通过使用 `contains` 参数来指定继承关系。由于有效性检查也被继承，我们只需要为新的槽位指定有效性检查：\n\
  \n```r\n# 修订版：捕获多个错误并提供更详细的信息\ngroupedtextplot <- setClass(\n  Class = \"groupedtextplot\"\
  ,\n  slots = c(\n    group = \"factor\"),\n  prototype = list(\n    group = factor()),\n\
  \  contains = \"textplot\",\n  validity = function(object) {\n    if (length(object@x)\
  \ != length(object@group)) {\n      stop(sprintf(\"x (长度为 %d) 和 group (长度为 %d) 不相等\"\
  , length(object@x), length(object@group)))\n    }\n    return(TRUE)\n  }\n)\n```\n\
  \n只需这么一小段代码，我们就可以使用新类了。在以下两个示例中，第一个示例演示了正确创建的新对象，第二个示例则展示了当我们尝试创建无效对象时熟悉的错误信息：\n\
  \n```r\ngdat <- groupedtextplot(\n  group = factor(c(1, 1, 1, 1, 2, 2, 2, 2)),\n\
  \  x = 1:8,\n  y = c(1, 3, 4, 2, 6, 8, 7, 10),\n  labels = letters[1:8])\n```\n\n\
  ```\n## 一个 \"groupedtextplot\" 类的对象\n## 槽位 \"group\":\n## [1] 1 1 1 1 2 2 2 2\n\
  ## 层级: 1 2\n##\n## 槽位 \"x\":\n## [1] 1 2 3 4 5 6 7 8\n##\n## 槽位 \"y\":\n## [1] 1\
  \ 3 4 2 6 8 7 10\n##\n## 槽位 \"labels\":\n## [1] \"a\" \"b\" \"c\" \"d\" \"e\" \"\
  f\" \"g\" \"h\"\n```\n\n```r\ngroupedtextplot(\n  group = factor(c(1, 1, 1, 1, 2,\
  \ 2, 2, 2)),\n  x = 1:8,\n  y = c(1, 3, 4, 2, 6, 8, 7),\n  labels = c(letters[1:7],\
  \ \"\"))\n```\n\n```\n## Error in validityMethod(as(object, superClass)):\n##\n\
  ## x (长度为 8) 和 y (长度为 7) 不相等\n## 有 1 个标签的长度为零。所有标签必须缺失或具有非零长度\n```\n\n在这个例子中，`textplot`\
  \ 被称为父类，而 `groupedtextplot` 被称为子类。这种关系可以用图来表示（有时对于复杂的继承关系，绘图是很有帮助的）。按照惯例，这种关系在图形上用箭头表示，从子类指向父类，例如\
  \ `textplot <- groupedtextplot`。同时按照惯例，父类通常位于左侧，或者如果从上到下绘图则位于上方。虽然本书仅涉及单一父类的继承，但类可以继承自多个父类，而这些父类又可以继承自其他父类，以此类推。正是在这些情况下，可视化图表特别有用。\n\
  \n与编写一个全新的类相比，使用继承的另一个好处是方法也会被继承。这意味着我们可以重用父类的槽位和为父类编写的方法，我们将在下一节讨论这个主题。\n\n###\
  \ S4 方法\n\n除了你之前看到的 `methods()` 函数用于显示给定函数可用的方法之外，在 S4 系统中，我们可以通过使用 `showMethods()`\
  \ 来查找方法。由于更正式的类系统，可以使用 `showMethods()` 来显示特定函数的所有方法，或者通过使用 `classes = \"类名\"` 参数来显示特定类（对于任何函数）的所有方法。如果你正在使用一个新类并想知道哪些方法已经被编写并且可用，这会很有帮助。\n\
  \n**注意**：可以通过使用 `showMethods(\"泛型函数\")` 来检查 S4 方法。新的 S4 方法通过调用 `setMethod()` 来定义。主要的三个参数是\
  \ `f`、`signature` 和 `definition`，它们分别包含泛型函数的名称（字符串）、将分派到此方法的 S4 类名称（字符串），以及作为实际方法的函数。\n\
  \n要在 S3 系统中编写新方法，我们只需使用特殊的命名约定编写函数。要定义 S4 方法，我们使用函数 `setMethod()`。当然，我们可以为现有的类编写新方法，也可以为新类编写方法。对于一个新类，需要一个用于\
  \ `show()` 的方法。当对象被简单地在控制台中输入时，R 通过调用 `show()` 来显示它。如果没有为新类定义 `show()` 方法，默认的打印效果会很糟糕，正如你在我们之前的示例中看到的那样。\n\
  \n在下面的代码中，我们为 `textplot` 类定义了一个新方法。第一个参数是我们为其创建方法的函数名。下一个参数，即签名，是类的名称。在这种情况下，因为\
  \ `show()` 只接受一个参数，所以只需要指定一个类名。对于具有多个参数的函数，签名可能会变得更复杂，根据多个参数的类来定义不同的方法。最后，我们编写函数，即方法的定义。代码相对简单，使用\
  \ `cat()` 函数来显示值。参数 `fill = TRUE` 的效果是添加换行符，使得每一行都以 `X:` 或变量标签开头，然后是值。`head()` 函数用于获取最多前五个值，如果值少于五个则获取全部：\n\
  \n```r\nsetMethod(\n  f = \"show\",\n  signature = \"textplot\",\n  definition =\
  \ function(object) {\n    cat(\" X: \")\n    cat(head(object@x, 5), fill = TRUE)\n\
  \    cat(\" Y: \")\n    cat(head(object@y, 5), fill = TRUE)\n    cat(\"Labels: \"\
  )\n    cat(head(object@labels, 5), fill = TRUE)\n  })\n```\n\nR 会回显我们刚刚为其创建方法的泛型函数的名称\
  \ `show()`。现在，当我们创建一个 `textplot` 类对象时，我们得到了更漂亮的输出：\n\n```r\ndat <- textplot(\n \
  \ x = 1:4,\n  y = c(1, 3, 5, 2),\n  labels = letters[1:4])\n```\n\n```\n## X: 1\
  \ 2 3 4\n## Y: 1 3 5 2\n## Labels: a b c d\n```\n\n一旦我们开始定义方法，类继承的好处就变得更加明显。因为 `groupedtextplot`\
  \ 继承自 `textplot`，如果没有为 `groupedtextplot` 定义方法，它会回退使用 `textplot` 的方法（如果可用）。虽然并不完美，因为分组信息没有显示出来，但这仍然比默认的输出要好：\n\
  \n```\n## X: 1 2 3 4 5\n## Y: 1 3 4 2 6\n```\n\n\n\n"
- "# 标签：a b c d\n\n接下来，我们为 `[` 函数定义一个方法，该方法用于对数据进行子集选取。这个函数更为复杂，因为我们必须构建一个逻辑树，以支持参数的多种可能组合。函数的第一个参数\
  \ `x` 代表要进行子集选取的对象。按照惯例，`i` 指代行或观测值，`j` 指代列或变量。如果只有 `i` 非缺失（即指定了行或观测值），通常包含所有变量。如果只有\
  \ `j`（变量）非缺失，通常包含所有观测值。如果两者都指定，则只包含选定的变量和观测值。这是通过使用一系列 `if` 和 `else if` 语句实现的。这里有三个新函数：\n\
  \n- `validObject()` 是一个泛型函数，用于对特定对象类执行有效性检查（如果存在）。\n- `slotNames()` 返回一个字符向量，给出每个槽位的名称。\n\
  - `slot()` 的工作方式与 `@` 运算符类似，但可以使用字符串按名称提取槽位。\n\n第 5 章 编写类和方法\n\n```\nsetMethod(\n\
  \  f = \"[\",\n  signature = \"textplot\",\n  definition = function(x, i, j, drop)\
  \ {\n    if (missing(i) & missing(j)) {\n      out <- x\n      validObject(out)\n\
  \    } else if (!missing(i) & missing(j)) {\n      out <- textplot(\n        x =\
  \ x@x[i],\n        y = x@y[i],\n        labels = x@labels[i])\n      validObject(out)\n\
  \    } else if (!missing(j)) {\n      if (missing(i)) {\n        i <- seq_along(x@x)\n\
  \      }\n      if (is.character(j)) {\n        out <- lapply(j, function(n) {\n\
  \          slot(x, n)[i]\n        })\n        names(out) <- j\n      } else if (is.numeric(j))\
  \ {\n        n <- slotNames(x)\n        out <- lapply(j, function(k) {\n       \
  \   slot(x, n[j])[i]\n        })\n        names(out) <- n[j]\n      } else {\n \
  \       stop(\"j is not a valid type\")\n      }\n    }\n    return(out)\n  }\n\
  )\n```\n\n现在方法已设定，下面展示几个使用示例：\n\n```\ndat[]\n```\n\n```\n## X: 1 2 3 4\n## Y: 1\
  \ 3 5 2\n## 标签: a b c d\n```\n\n```\ndat[i = 1:2]\n```\n\n```\n## X: 1 2\n## Y:\
  \ 1 3\n## 标签: a b\n```\n\n```\ndat[j = 1]\n```\n\n```\n## $x\n## [1] 1 2 3 4\n```\n\
  \n```\ndat[j = \"y\"]\n```\n\n```\n## $y\n## [1] 1 3 5 2\n```\n\n```\ndat[i = 1:2,\
  \ j = c(\"x\", \"y\")]\n```\n\n```\n## $x\n## [1] 1 2\n##\n## $y\n## [1] 1 3\n```\n\
  \n通过为 `textplot` 类定义 `show` 方法和子集选取方法，我们可以按组循环遍历对象、选取子集并显示每个子集，从而轻松地为 `groupedtextplot`\
  \ 类创建 `show` 方法：\n\n```\nsetMethod(\n  f = \"show\",\n  signature = \"groupedtextplot\"\
  ,\n  definition = function(object) {\n    n <- unique(object@group)\n    i <- lapply(n,\
  \ function(index) {\n      cat(\"组: \", index, fill = TRUE)\n      show(object[which(object@group\
  \ == index)])\n    })\n  }\n)\n```\n\n```\ngdat\n```\n\n```\n## 组: 1\n## X: 1 2\
  \ 3 4\n## Y: 1 3 4 2\n## 标签: a b c d\n## 组: 2\n## X: 5 6 7 8\n## Y: 6 8 7 10\n```\n\
  \n\n\n"
- "# 标签：e f g h\n\n## 5.3 本章小结\n\n本章介绍了 R 语言中用于开发新类和方法（method）的 S3 和 S4 系统。特别是 S4\
  \ 系统可能相当复杂，它涉及从多个父类继承，以及针对多个参数类别进行特化的方法。即使您使用并开发 R 语言，也可能很少需要开发新类，因为大多数数据类型都已存在相应的类。然而，开发或扩展现有方法通常是有益的，至少，理解类和方法的运作方式能让您更轻松地使用现有功能。\n\
  \n希望本章的内容足以让您入门并了解这些系统的能力。表 5-1 描述了本章涵盖的关键函数。在第 6 章中，我们将把函数、类和方法整合在一起，构建我们自己的 R\
  \ 包。\n\n本章的重点是制作 R 包，因此您不需要对类和方法非常精通。如果您的工作需要用到 S4 系统，可以查阅 John Chambers 的\"How\
  \ S4 Methods Work\"（在线获取地址：[`developer.r-project.org/howMethodsWork.pdf`](http://developer.r-project.org/howMethodsWork.pdf)）以获得更深入的介绍。如果您打算使用\
  \ S4 系统并进行深入研究，我们推荐《Software for Data Analysis: Programming with R》一书。另一本更侧重于通用\
  \ R 编程和较旧的 S3 系统的优秀书籍是《S Programming》。\n\n**第 5 章 编写类和方法**\n\n***表 5-1.** 本章描述的关键函数及其功能摘要*\n\
  \n| **函数** | **功能** |\n|--------------|------------------|\n| `class()` | 返回对象的类（S3\
  \ 或 S4）。 |\n| `inherits()` | 检查对象是否属于某个特定类或继承自该类。 |\n| `methods()` | 返回给定函数所有可用方法的列表。\
  \ |\n| `showMethods()` | 返回给定函数的所有可用方法列表；如果使用了`classes`参数，则返回给定类所有可用的方法（适用于任何函数）。\
  \ |\n| `:::` | 运算符，允许访问包中未导出（非公开）的函数。 |\n| `class()` | 命名 S3 方法的通用方案：使用函数名，后跟句点，再跟应应用该方法的对象类。\
  \ |\n| `setClass()` | 定义一个新的 S4 类。 |\n| `setMethod()` | 为特定 S4 类的特定函数定义方法。 |\n|\
  \ `@` | 在 S4 系统中按名称访问对象槽位的底层方式，类似于其他 R 对象或 S3 类对象的`$`。 |\n| `new()` | 创建特定类的新 S4\
  \ 对象。 |\n| `paste()` | 拼接字符串。可以操作多个向量，或将单个向量的所有元素合并在一起。 |\n| `sprintf()` | 格式化字符串，并允许将数字和其他字符串替换到定义的模板中。用于生成信息丰富的错误消息或其他用户消息。\
  \ |\n| `show()` | 显示 R 对象的通用函数。也是在 R 控制台键入对象名称时调用的默认函数。 |\n| `'['()` | 用于子集数据或访问特定变量/行的运算符/通用函数。在\
  \ S4 系统中，对于新类，必须定义方法，否则该函数无法使用。 |\n| `head()` | 列出对象的前几个元素或前几行。 |\n| `validObject()`\
  \ | 使用类创建时指定的有效性检查（如果有的话）来检查 S4 类对象是否有效的通用函数。创建对象时默认调用，但也可以在修改对象后显式调用以检查其是否仍然有效。\
  \ |\n| `slotNames()` | 返回 S4 类对象的所有槽位名称，类似于其他 R 对象或 S3 类对象的`names()`。 |\n| `slot()`\
  \ | 可用于访问 S4 对象的特定槽位。 |\n\n## 第 6 章 编写 R 包\n\n包是记录、共享和分发 R 代码与数据的基本方式。我们的目标是编写自己的包。预先说明，本章特别复杂，因为在\
  \ R 包开发过程中会用到许多软件工具。\n\n本章中，我们将使用几个包。`devtools`包[32]提供了帮助设置、记录和管理 R 包开发过程的函数。而`devtools`包本身会安装并加载一整套用于开发的其他实用包。`roxygen2`包[28]通过允许使用注释将函数文档内联地写在函数旁边，极大地简化了\
  \ R 包文档的编写过程。`testthat`包[24]并非必需，但它提供了一些函数，通过测试函数是否返回预期值来实现质量控制。当编写包时，这是一种良好的实践，有助于确保代码按预期工作，并快速识别因\
  \ R 语言、您使用的其他包或您自身修改而可能引入的任何错误。`usethis`包有助于自动化测试（以及其它事项）[43]。类似地，`covr`包[11]通过测试包代码被测试执行的百分比（覆盖率）来促进质量控制。理想情况下，100%的代码应被测试覆盖，但实际上，许多\
  \ R 包根本没有测试，因此任何覆盖率都比平均水平要好。在包中，我们使用了第 5 章中针对`ggplot2`的方法之一，因此我们也包含了大家熟悉的`ggplot2`[25]包。最后，为了帮助共享和记录包，我们使用了`pkgdown`包[31]。这个包允许我们基于包文档、文件以及任何插页（vignettes）自动创建一个网页。由于\
  \ GitHub 可以托管网页，如果我们把包托管在一个公共的 GitHub 仓库中，代码不仅可以通过版本控制方便地获取，而且使用`pkgdown`我们还能为其获得一个漂亮的网页。\n\
