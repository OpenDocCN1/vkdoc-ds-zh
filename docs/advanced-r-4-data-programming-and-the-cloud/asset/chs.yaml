  execute: SELECT * FROM demographics;

  ## NULL

  ```


  此命令将会生效。我们的用户确实有权限从 `dailymetrics` 表进行查询。为了节省文本空间，我们将结果赋值给变量 `query`，然后仅显示前几行：


