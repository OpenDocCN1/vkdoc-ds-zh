  ## 3 3 1 2017-02-25 NA NA NA NA NA

  ## 4 4 1 2017-02-25 NA NA NA NA NA

  ## 5 5 1 2017-02-25 6.9 0 6.2 NA NA

  ## 6 6 1 2017-02-26 NA NA NA NA NA

  ## copeexp copedis

  ## 1 NA NA

  ## 2 2.4 2.2

  ## 3 NA NA

  ## 4 NA NA

  ## 5 2.0 NA

  ## 6 NA NA

  ```


  我们的 `gradstudenti` 用户仅对 `address` 表拥有 `INSERT` 权限；而 `gradstudentu` 用户对 `address`
  表同时拥有 `SELECT` 和 `UPDATE` 权限。


  使用我们的 R 封装函数 `dbGetQuery()`，我们向数据库服务器发送了两条相同的 SQL 语句。每条语句的唯一区别在于用户。请注意，一条语句生效了，而另一条没有。原因正是在于我们的
  `conInsert` 连接拥有 `gradstudenti` 的权限，这些权限仅适用于在 `address` 表中添加一行或*插入*数据。该用户没有 `SELECT`
  权限。


  虽然这些不同的用户权限在此例中略有编造成分，但它们展示了不同级别的访问权限。通过利用权限的不同组合，您很可能能够找到适合您需求的可行的安全与访问级别。


  此命令将不会生效。我们的用户仅拥有对 `address` 表执行 `INSERT`（例如，将新行绑定到表的末尾）的权限：


  ```

  dbGetQuery(conInsert, "SELECT * FROM address;")

  ## Error in postgresqlExecStatement(conn, statement, ...) :

  ## RS-DBI driver: (could not Retrieve the result : ERROR: permission denied for
  table address

  ## )

  ## Warning in postgresqlQuickSQL(conn, statement, ...): Could not create

  execute: SELECT * FROM address;

  ## NULL

  ```


  此命令将会生效。`gradstudentu` 用户拥有对 `address` 表执行 `SELECT` 和 `UPDATE` 的权限。为了节省文本空间，我们将结果赋值给变量
  `query`，然后仅显示最后几行：


  ```

  query <- dbGetQuery(conUpdate, "SELECT * FROM address;")

  tail(query)

  ## row.names userid postalcode

  ## 186 186 186 3807

  ## 187 187 187 4118

  ## 188 188 188 3843

  ## 189 189 189 3952

  ## 190 190 190 4181

  ## 191 191 191 4582

  ```


  那么 `gradstudenti` 究竟*可以*做什么呢？他们可以向 `address` 表执行 `INSERT`（插入）操作。命令是 `INSERT INTO
  table VALUES (list, values, here, separated, by, commas, one, value, for, each column)`。因为我们的
  `gradstudenti` 用户无法查询和查看表中的内容，我们使用超级用户来查看更新后的表值：


  ```

  dbGetQuery(conInsert, "INSERT INTO address VALUES (200, 200, 9999)")

  ## data frame with 0 columns and 0 rows


  query <- dbGetQuery(conSuper, "SELECT * FROM address")

  tail(query)

  ## row.names userid postalcode

  ## 187 187 187 4118

  ## 188 188 188 3843

  ## 189 189 189 3952

  ## 190 190 190 4181

  ## 191 191 191 4582

  ## 192 200 200 9999

  ```


  请注意，我们的表现在有 192 行，而不只是 191 行。


  那么 `gradstudentu` 用户究竟*可以*向表中写入什么呢？他们可以对 `address` 表执行 `SELECT` 或 `UPDATE` 操作。


  请记住，`address` 表包含 `userid` 和 `postalcode` 列。这些 `userid` 对应的是我们的研究参与者。假设第一个参与者更改了地址。为了便于可视化，假设他们的邮政编码变为了
  `1111`。


  这里，我们在 SQL 语句中添加了一个额外的短语：`WHERE userid = 1`。这允许我们只显示关于第一个参与者的行。虽然这对于我们的 `SELECT`
  语句来说是一个有用的节省空间的手段，但对于我们的 `UPDATE` 语句来说则是至关重要的（否则，**所有**行的 `postalcode` 都会被更新为 `1111`）：


  ```

  dbGetQuery(conUpdate, "SELECT * FROM address WHERE userid = 1")

  ## row.names userid postalcode

  ## 1 1 1 4112


  dbGetQuery(conUpdate, "UPDATE address SET postalcode = 1111 WHERE userid = 1")

  ## data frame with 0 columns and 0 rows


  dbGetQuery(conUpdate, "SELECT * FROM address WHERE userid = 1")

  ## row.names userid postalcode

  ## 1 1 1 1111

  ```


  在展示了具有不同权限的用户的一些细微差别之后，我们通过演示如何撤销用户的访问权限来结束本节。在完全删除或 `DROP`（移除）一个用户之前，必须先撤销其所有访问权限。然而，请注意，`REVOKE`（撤销）语句与
  `GRANT`（授予）语句非常相似，可以进行自定义。换句话说，可以根据任何给定时间点的具体需求，定期修改用户的权限。


  首先，我们使用 `dbDisconnect()` 断开三个用户的连接，并从全局环境中清除这些变量：


  ```

  dbDisconnect(conRead)

  ## [1] TRUE


  dbDisconnect(conInsert)

  ## [1] TRUE


  dbDisconnect(conUpdate)

  ```




