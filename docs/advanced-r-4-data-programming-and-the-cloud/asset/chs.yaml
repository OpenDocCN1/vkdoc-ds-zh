  ## 注意 ''echo=FALSE''

  ## 这意味着下面的代码永远不会出现在我们编织生成的 html 中

  library(data.table)

  diris <- as.data.table(iris)

  ## 然而，代码仍然会被运行，因此我们仍然可以访问它。

  ```


