- '# 动态报告


  在前面的章节中，你已经了解了 Shiny 如何基于动态数据提供交互式环境。动态报告与实时仪表盘有许多相似之处。另一方面，本章由于最终报告是 PDF 格式，因此交互性较弱。


  在许多领域，报告是日常工作中不可或缺的一部分，利益相关者通常需要时间点的快照，而非完全交互式的环境。通过 `knitr` 和 `rmarkdown` 包，我们可以基于数据输入创建文档（例如
  PDF、HTML 或 Microsoft Word）。对于基于持续变化的数据构建、但总体结构相同的定期报告，这能极大地节省时间。


  `rmarkdown` 包 [42] 增加了将 R 进程嵌入此类文档的能力，实现一键式分析，并使用多种样式进行精美排版。LaTeX 接口几乎可以实现任何所需的格式，当然除了
  PDF 之外还有其他选项。无论是从学生信息系统数据库实时提取数据进行董事会的注册人数报告，还是根据关键绩效指标生成战略计划行动表，当可变输入需要被塑造成标准化输出时，动态报告效果最佳。`knitr`
  [38] 和 `formatR` [39] 包也为此提供了便利。


  此外，在本章中，我们还使用了 `evaluate` 包 [34] 和 `tufte` 包 [41]。这些包使我们能够更优雅地组织数据的布局和格式。我们还使用了
  `ltm` 包 [19] 进行心理测量测试。


  本章的目标是：增强我们在本地和云端机器上的软件环境，使动态文档能够编译；探索独立 `rmarkdown` 的结构；开发一个允许用户上传数据并下载 PDF 报告的
  Shiny 页面；最后将所有内容推送至我们的云实例。我们从所需的软件开始：


  ```

  options(width = 70, digits = 2)

  ```


