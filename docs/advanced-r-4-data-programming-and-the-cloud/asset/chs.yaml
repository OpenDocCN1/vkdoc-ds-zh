  \ x 轴上，将 `mpg` 绘制在 y 轴上，如图 3-2 所示。\n\n`plot(mtcars$cyl, mtcars$mpg)`\n\n## 第 3 章\
  \ 编程自动化\n\n要使用 `tapply()`，我们需要指定函数所应用的数据、这些数据的索引以及要应用的函数。在此例中，我们希望更好地理解三种类型汽车各自的算术平均值。结合图\
  \ 3-2，我们应当能大致预期哪些类型的汽车油耗表现最佳：\n\n```\ntapply(\n  X = mtcars$mpg,\n  INDEX = mtcars$cyl,\n\
  \  FUN = mean)\n```\n\n## 4 6 8\n\n## 27 20 15\n\n当我们的数据结构是数据框、矩阵或数组时，`apply()`\
  \ 函数通常是一个不错的选择。因为这些结构往往维度更多，所以该函数需要更多关于函数将使用哪些数据作为输入的信息。在第二个形式参数（名为 `MARGIN`）中，输入值\
  \ 1 指定*行*，而输入值 2 指定*列*。对于像 `mtcars` 这样的数据框，大多数计算只有按列进行才有意义，因此使用了 `MARGIN = 2`。在此例中，我们不使用均值，而是使用标准差函数\
  \ `sd()`：\n\n```\napply(mtcars, MARGIN = 2, FUN = sd)\n```\n\n`mtcars$cyl`\n\n***图\
  \ 3-2.** cyl 与 mpg 数据的可视化*\n\n## 第 3 章 编程自动化\n\n## mpg cyl `disp` hp drat wt qsec\
  \ vs am gear\n\n## 6.03 1.79 123.94 68.56 0.53 0.98 1.79 0.50 0.50 0.74\n\n## carb\n\
  \n## 1.62\n\n当需要对多个数据集应用同一个函数时，就需要用到多元 apply 函数 `mapply()`。与之前的示例不同，该函数将函数作为第一个变量，然后接受提供的任意数量的数据输入。在此例中，不必重复调用函数，而是可以一次完成整个计算。\n\
  \n首先，考虑使用 `cor.test()` 函数将 `mpg` 与 `cyl` 进行比较的单次相关性检验：\n\n```\ncor.test(mtcars$mpg,\
  \ mtcars$cyl)\n```\n\n结果显示出相当强的负相关性证据。现在，假设除了这个比较之外，我们还希望测试 `hp` 和 `disp` 之间的关系。与其一次一次地执行两次检验，`mapply()`\
  \ 函数可以处理这个计算。注意，我们测试的是相同的两对数据。换句话说，我们现在有了表 3-1。我们的函数 `mapply()` 分别对表中的第一列和第二列计算\
  \ `cor.test()`。可以通过 `MoreArgs =` 变量向 `cor.test()` 提供额外的参数，该变量接受一个列表。在此例中，虽然我们明确展示了这些输入，但我们将它们保留为默认值：\n\
  \n```\nmapply(cor.test,\n       mtcars[, c(\"mpg\", \"hp\")],\n       mtcars[, c(\"\
  cyl\", \"disp\")],\n       MoreArgs = list(method = \"pearson\", alternative = \"\
  two.sided\"))\n```\n\n***表 3-1.** mapply() 网格*\n\n**第一组** | **第二组**\n--- | ---\n\
  mpg (1,1) | hp (1,2)\ncyl (2,1) | disp (2,2)\n\n\n\n```markdown\n## conf.int 数值型，2\n\
  \n结果中有一个部分确实让人有点摸不着头脑，那就是 `data.name` 这一行。不过，回顾一下表 3-1 应该会让你更清楚。需要留意的是，`mapply`\
  \ 函数将被调用的函数应用于输入数据每一“行”中的第一个条目。\n\n# 第 3 章：编程自动化\n\n### 3.4 本章小结\n\n你已经了解了几种强大的自动化工具，从控制重复操作（实际上是重复次数）的各种循环，到更专业的、专为处理我们可能遇到的数据集中常见情况而设计的工具。\n\
