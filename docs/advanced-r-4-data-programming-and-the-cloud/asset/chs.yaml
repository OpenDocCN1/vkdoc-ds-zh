  \n现在让我们将注意力转向数学和逻辑运算符及函数。\n\n## 1.5 数学运算符和函数\n\n有几个运算符可用于比较。这些在后续我们学习循环和构建自己的函数时会很有帮助。同样有用的是符号逻辑形式。我们从一些基本比较开始，并且承认对手数字\
  \ 4 有一种奇怪的偏爱：\n\n```\n####################数学################################\n######\
  \ 比较和逻辑运算\n4 > 4\n## [1] FALSE\n```\n\n```\n4 >= 4\n## [1] TRUE\n```\n\n```\n4 <\
