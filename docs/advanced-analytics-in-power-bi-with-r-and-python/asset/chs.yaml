  ### 步骤 2：在 SQL Server 中创建日志表


  数据库中应该已经存在一个名为 `dbo.LoadHistoryLog` 的日志表。如果您需要重新创建它，可以在 SQL Server Management Studio
  (SSMS) 中执行以下代码：


  ```

  USE AdventureWorksDW_StarSchema

  CREATE TABLE dbo.[LoadHistoryLog] (

  DATESTAMP DATETIME,

  TABLENAME VARCHAR(25),

  NUM_RECORDS INT

  )

  ```


  要在 SSMS 中执行代码，请复制上述代码，然后点击菜单栏中的 `新建查询` 按钮。此时应出现一个编辑器。将代码粘贴到编辑器中，然后点击菜单栏中的 `执行` 按钮来执行代码。




  ### 步骤 3：开始开发用于加载 `DimDate` 的 R 脚本


  返回 R Studio 开始开发 R 脚本。此脚本中将使用的包是 `RODBC` 和 `lubridate`。`RODBC` 包用于与 SQL Server 交互，而
  `lubridate` 包则用于简化一些与日期相关的任务。以下是加载这些包所需的代码：


  ```

  library(RODBC)

  library(lubridate)

  ```


  ### 步骤 4：创建一个变量来保存要导入的表的名称


  将要读入 Power BI 数据模型的表名称会在脚本中的多个地方使用。使用变量而不是在整个脚本中硬编码该值，可以使脚本更易于维护和重用：


  ```

  table_name <- "DimDate"

  ```


  ### 步骤 5：创建一个变量来保存用于返回表的 SQL 语句


  以下代码用于创建 SQL 语句，该语句将用于从 `DimDate` 表中读取数据到 Power BI：


  ```

  sql <- paste0(

  "SELECT * FROM dbo.",

  table_name)

  ```


  上述代码使用了 `paste0()` 函数来将 `"SELECT * FROM dbo."` 与 `table_name` 变量拼接起来。`paste0()`
  函数与 `paste()` 函数类似。两者的区别在于，你可以在 `paste()` 函数中指定分隔符，而 `paste0()` 函数则默认在拼接字符串时不使用分隔符。


  ### 步骤 6：创建与 SQL Server 的连接


  使用以下代码创建与数据库的连接：


  ```

  conn <- odbcConnect(dsn = "SQLServer2017")

  ```


  如你所见，使用 DSN 可以非常轻松地连接到数据库。你使用 `RODBC` 包中的 `odbcConnect` 函数来建立连接，唯一需要的参数是 `dsn` 参数。将该参数设置为你**在步骤
  1** 中配置的 `DSN` 名称。


  ### 步骤 7：从 SQL Server 检索数据并将其存储在数据框中


  `RODBC` 包中的 `sqlQuery()` 函数使你能够使用 `conn` 连接向数据库提交查询，并将结果存储在一个数据框中。执行此操作的代码如下：


  ```

  df_read <- sqlQuery(channel = conn, query = sql)

  ```


  查询结果存储在 `df_read` 数据框中。这些数据将被提供给 Power BI。


  ### 步骤 8：获取当前时间


  现在你需要开始计算要记录的关于加载过程的信息。你想要记录的信息包括：加载发生的时间、加载的表名称以及加载的记录数量。


  要获取加载时间，请使用 `lubridate` 包中的 `now()` 函数，并将其赋值给 `datestamp` 变量，代码如下：


  ```

  datestamp <- now()

  ```


  ### 步骤 9：获取已读取的记录数量


  你想要记录从 `DimDate` 表加载的记录数量。使用基础 R 中的 `nrow()` 函数来获取该信息。使用以下代码将 `DimDate` 中的记录数量存储到
  `num_records` 变量中：


  ```

  num_records <- nrow(df_read)

  ```


  ### 步骤 10：创建一个包含要记录信息的单行 R 数据框


  你已经计算出了要记录的信息；现在需要将其塑形，以便能够将信息插入到日志表中。数据需要被塑形为一个数据框。首先，使用你创建的、包含要记录信息的变量来创建一个*命名列表*。


  *命名列表* 就是一个为列表中每个元素都指定了名称的列表。将信息放入命名列表可以方便地将其转换为数据框。本步骤中的代码描述了如何构建这样一个列表。


  你使用的代码如下：


  ```

  list_insert = list("DATESTAMP" = datestamp,

  "TABLENAME" = table_name,

  "NUM_RECORDS" = num_records

  )

  ```


  上述代码构建了一个*命名列表*，其中包含了 `datestamp`、`table_name` 和 `num_records` 这些标量，并分别将它们命名为 `DATESTAMP`、`TABLENAME`
  和 `NUM_RECORDS`。


  标量是长度为 1 的向量。


  接下来，使用以下代码将命名列表转换为数据框：


  ```

  df_insert = as_data_frame(list_insert)

  ```


  上述代码使用 `as_data_frame()` 函数将命名列表转换为数据框，并将结果赋值给 `df_insert` 数据框。命名列表中的名称被用作列标题。


  ### 步骤 11：将在步骤 10 中收集的信息插入到历史日志表中


  现在，要记录的数据已经在一个数据框中，你可以使用 `RODBC` 包中的 `sqlSave()` 函数将其插入到 `LoadHistoryLog` 表中。操作代码如下：


  ```

  sqlSave(

  channel = conn,

  dat = df_insert,

  tablename = "LoadHistoryLog",

  append = TRUE,

  rownames=FALSE

  )

  ```


  `sqlSave()` 函数中的 `channel` 参数使用了我们之前创建的连接。它将 `df_insert` 数据框插入到 `LoadHistoryLog`
  表中。将 `append` 参数设置为 `TRUE` 非常重要，这样 `sqlSave()` 就知道要将数据插入到一个已存在的表中。如果设置为 `FALSE`，它会尝试创建一个已存在的表，从而导致错误。同样，将
  `rownames` 设置为 `FALSE` 也很重要，因为如果不这样做，将会创建一个包含数据框行名的列，而这些信息是不需要的。


  ### 步骤 12：关闭连接


  接下来，你需要使用 `RODBC` 包中的 `odbcClose()` 函数来关闭连接。操作代码如下：


  ```

  odbcClose(conn)

  ```


  ### 步骤 13：将脚本复制到 Power BI


  以下是完整的脚本：


  ```

  library(tidyverse)

  library(RODBC)

  library(lubridate)

  table_name <- "DimDate"

  sql <- paste0(

  "SELECT * FROM dbo.",

  table_name)

  conn <- odbcConnect(dsn = "SQLServer2017")

  df_read <- sqlQuery(channel = conn, query = sql)

  datestamp <- now()

  num_records <- nrow(df_read)

  list_insert <- list(

  "DATESTAMP" = datestamp,

  "TABLENAME" = table_name,

  "NUM_RECORDS" = num_records)

  df_insert <- as_data_frame(list_insert)

  sqlSave(

  channel = conn,

  dat = df_insert,

  tablename = "LoadHistoryLog",

  append = TRUE,

  rownames=FALSE)

  odbcClose(conn)

  ```


  与本书前面的示例一样，通过 `GetData` 将 R 代码复制到 Power BI 中。脚本中产生了两个数据框：`df_read` 和 `df_insert`，因此你需要告诉
  Power BI 你想要加载哪一个到 Power BI 数据模型中。你想要加载 `df_read`，所以选中它，然后点击 `Edit` 按钮。现在你需要更改查询的名称。在
  `PROPERTIES` 部分，将查询名称从 `df_read` 重命名为 `DimDate`。点击 `Close & Apply` 将数据加载到 Power
  BI 数据模型中。




  ### 步骤 14：基于 `ReadLog_DimDate.R` 脚本创建加载 `DimProduct` 的脚本


  你需要为另外四个表重复上述步骤。通过复制 `ReadLog_DimDate.R` 脚本，然后对复制的脚本做一处小修改，即可轻松为每个表重复这些步骤。需要修改的是
  `tablename` 变量设置的值。在此步骤中，你将针对 `DimProduct` 表执行此操作。创建 `ReadLog_DimDate.R` 脚本的副本，并将
  `table_name` 变量的值从 `DimDate` 改为 `DimProduct`。接下来，执行步骤 13，但需将查询重命名为 `DimProduct`。修改后的代码如下所示：


  ```

