- "# 直方图与几何对象\n\n你可能已经猜到，直方图可视化的基础是使用`geom_histogram()`几何对象。请注意，它使用了一个参数，即`binwidth`，因为其他必需的参数是从`ggplot()`函数继承而来的。该参数允许你定义分箱的宽度。建议你尝试调整这个参数，因为默认设置通常不会创建最佳数量的分箱。请注意，直方图的基础仅由以下两行代码创建，如下所示：\n\
  \n```\nggplot(plot.data, aes(linemen_weights)) +\ngeom_histogram(binwidth = 20)\n\
  ```\n\n此后的代码用于美化功能。\n\n## `geom_line()`\n\n`geom_line()`几何对象用于创建折线图。折线图非常适合展示随时间变化的趋势。以下清单\
  \ 1-17 中的代码将用于生成折线图示例。\n\n```\nlibrary(tidyverse)\nlibrary(lubridate)\nplayers <-\
  \ c(\"Kobe Bryant\", \"Pau Gasol\", \"Lamar Odom\", \"Andrew Bynum\", \"Derek Fisher\"\
  )\nplot.data <- lakers %>%\n  filter(\n    result == \"made\" & team == \"LAL\"\
  \ & player %in% players\n  ) %>%\n  mutate(date = ymd(date)) %>%\n  group_by(player,\
  \ date) %>%\n  summarize(points = sum(points))\nggplot(plot.data, aes(x=date, y=points,\
  \ color=player)) +\n  geom_line() +\n  labs(title = \"geom_line\") +\n  theme_minimal()\n\
  Listing 1-17\ngeom_line() example\n```\n\n上述代码的输出如图 1-14 所示。\n\n![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig14_HTML.jpg](img/480677_1_En_1_Fig14_HTML.jpg)\n\
  \nFigure 1-14\n\n`geom_line()`几何对象\n\n与之前的示例一样，代码的第一部分构建数据集，并为你提供在环境中重新创建可视化所需的一切。此可视化使用了`lubridate`包附带的`lakers`数据集。`lakers`数据集包含\
  \ 2008 赛季的逐回合比赛信息。\n\n请注意，颜色美学映射是如何用于创建多条线的。`ggplot2`会根据颜色美学映射中指定的字段中的每个唯一项创建一条线。就像之前的示例一样，只需要两行代码即可创建可视化基础：一行是初始化`ggplot()`函数，另一行是定义几何对象图层。\n\
  \n## `geom_point()`和`geom_smooth()`\n\n此示例说明了如何在`ggplot2`中创建具有多个图层的图表。该示例展示了如何向散点图添加回归线。`ggplot2`允许你用不同类型的趋势线覆盖散点图。它不限于线性回归线。`ggplot2`还允许你按自己选择的置信水平向线条添加置信区间。在撰写本文时，这些功能在原生\
  \ Power BI 中尚不可用。\n\n以下清单 1-18 中的代码用于说明如何创建散点图并用回归线覆盖它。\n\n```\nlibrary(tidyverse)\n\
  set.seed(1)\nplot.data <- diamonds %>%\n  filter(color == \"D\") %>%\n  sample_n(200)\n\
  ggplot(plot.data, aes(x=carat, y=price)) +\n  geom_point() +\n  geom_smooth(method\
  \ = \"lm\") +\n  labs(title = \"geom_point & geom_smooth\") +\n  theme_minimal()\n\
  Listing 1-18\ngeom_point() and geom_smooth() example\n```\n\n图 1-15 显示了代码生成的结果。\n\
  \n![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig15_HTML.jpg](img/480677_1_En_1_Fig15_HTML.jpg)\n\
  \nFigure 1-15\n\n`geom_point()`和`geom_smooth()`几何对象\n\n上述图表基于多个图层：`geom_point()`和`geom_smooth()`。`geom_point()`几何对象用于创建散点图，而`geom_smooth()`几何对象用于添加带有置信区间的回归线。置信区间的默认值为\
  \ 95%。你可以通过修改`se`参数来更改它。将`method`参数设置为`lm`会使`geom_smooth()`几何对象生成回归线。\n\n"
- "# 使用标度控制美学映射\n\n你之前了解到，数据到美学映射的描述是使用`aes()`函数完成的。然而，底层过程是由标度函数控制的。在本节中，你将了解这是如何发生的。\n\
  \n首先介绍标度的背景。图表中的每个美学映射（x 坐标、y 坐标、颜色等）都需要一个标度。它决定了数据在可视化中的“缩放”方式。你不需要显式定义它们。如果你不定义它们，`ggplot2`将使用默认值。让我们以清单\
  \ 1-19 中的代码片段为例。\n\n```\nggplot(plot.data, aes(x = carat, y = price)) +\n  geom_point(aes(color\
  \ = clarity))\nListing 1-19\nggplot2 code minus the underlying helper code\n```\n\
  \n在此示例中，没有显式定义任何标度。上述代码会被`ggplot2`转换为以下清单 1-20 中的代码。\n\n```\nggplot(plot.data, aes(x\
  \ = carat, y = price)) +\n  geom_point(aes(color = clarity)) +\n  scale_x_continuous()\
  \ +\n  scale_y_continuous() +\n  scale_color_discrete()\nListing 1-20\nggplot2 code\
  \ with helper code that defines the scales\n```\n\n`ggplot2`为这三个标度中的每一个都使用了默认值。\n\
  \n敏锐的读者可能已经注意到标度命名约定中的模式。标度函数使用三部分命名约定。标度函数以单词“scale”开头，后跟它所属的美学映射名称，最后以标度类型结尾。这三部分用下划线分隔。\n\
  \n因此，如果你使用刚刚概述的命名约定查看上述脚本中的前两个标度，你会注意到它们分别用于 x 和 y 美学映射。它们都使用`continuous`标度类型，因为映射到\
  \ x 和 y 美学映射的数据是连续数字。最后一个标度用于`color`美学映射。映射到此美学映射的数据是`clarity`字段。该字段包含一系列离散值，这就是标度类型为`discrete`的原因。\n\
  \n如果你对`ggplot2`生成的结果满意，则无需定义标度。你可以使用默认值。但如果你想覆盖`ggplot2`生成的结果，则需要使用适当的标度来实现。\n\n\
  回想一下清单 1-9 中生成图 1-8 的以下代码：\n\n```\nlibrary(tidyverse)\nlibrary(scales)\nplot.data\
  \ <- diamonds %>%\n  filter(color == \"D\") %>%\n  sample_n(200)\nggplot(plot.data,\
  \ aes(x = carat, y = price)) +\n  geom_point(aes(color = clarity)) +\n  labs(\n\
  \    title = \"Chart Title\",\n    subtitle = \"Chart Subtitle\",\n    caption =\
  \ \"Chart Caption\"\n  ) +\n  scale_x_continuous(name = \"Size in Carats\") +\n\
  \  scale_y_continuous(\n    name = \"Price ($)\",\n    labels = dollar_format()\n\
  \  )\n```\n\n请注意，使用`scale_x_continuous()`更改了 x 美学映射的名称，并使用`scale_y_continuous()`更改了\
  \ y 美学映射的标签格式和名称。你将在下一章中看到更多使用标度修改美学映射的示例。\n\n\n\n"
- '# ggplot2 内置主题


  `ggplot2` 自带一系列主题，可轻松更改图表中非数据元素的显示效果。以下是该软件包作者 Hadley Wickham 描述的可用的主题列表：^(²)


  * `theme_bw()`：`theme_gray()` 的变体，使用白色背景和细灰色网格线

  * `theme_linedraw()`：一种仅在白色背景上使用各种宽度的黑色线条的主题，类似于线条画

  * `theme_light()`：与 `theme_linedraw()` 类似，但使用浅灰色线条和坐标轴，以便将更多注意力引向数据

  * `theme_dark()`：`theme_light()` 的深色版本，线条粗细相似，但背景为深色。有助于突出细彩色线条

  * `theme_minimal()`：一种极简主题，无背景注释

  * `theme_classic()`：经典外观主题，带有 x 轴和 y 轴线条，无网格线

  * `theme_void()`：完全空白的主题


  ## 在 Power BI 服务中使用 R 可视化效果


  当您将 R 可视化效果部署到 Power BI 服务时，必须确保使用的是该服务中可用的软件包版本。以下 URL 包含服务器上可用软件包及其版本的列表：[`https://docs.microsoft.com/en-us/power-bi/connect-data/service-r-packages-support`](https://docs.microsoft.com/en-us/power-bi/connect-data/service-r-packages-support)。


  ## ggplot2 的辅助包


  `ggplot2` 是一个功能丰富的软件包，包含处理大多数数据可视化需求所需的工具。但有时您需要执行一些操作，例如在创建可视化之前整理 Power BI 传递给
  R 的数据集，以基础 R 或 `ggplot2` 中不可用的方式格式化数据，或使用不属于 `ggplot2` 包的主题。


  幸运的是，在开发 R 可视化效果时，您并不局限于 `ggplot2` 包。以下是一些在 Power BI 中与 `ggplot2` 完美互补的软件包。此列表并非详尽无遗：


  * `tidyverse`：一个元包，包含一系列共享相同框架的流行 R 包。它包括 `ggplot` 和 `dplyr` 等包。`tidyverse` 包集合有助于在
  R 中进行数据科学。有关 `tidyverse` 的更多信息，请访问此 URL：[`www.tidyverse.org/`](http://www.tidyverse.org/)。

  * `ggthemes`：`ggplot2` 的辅助包，包含额外的比例尺、几何对象和主题。其中两个值得注意的主题是 `theme_few()` 和 `theme_tufte()`。这两个主题基于两位非常流行的数据可视化专家
  Stephen Few 和 Edward Tufte 的最佳实践。有关 `ggthemes` 包的更多信息，请访问此 URL：[`https://cran.r-project.org/web/packages/ggthemes/ggthemes.pdf`](https://cran.r-project.org/web/packages/ggthemes/ggthemes.pdf)。

  * `scales`：`scales` 包提供了 `ggplot2` 的内部缩放基础设施，以及许多用于数据转换和数据格式化的函数。您可以在以下 URL 找到有关
  `scales` 包的更多信息：[`https://cran.r-project.org/web/packages/scales/scales.pdf`](https://cran.r-project.org/web/packages/scales/scales.pdf)。

  * `ggrepel`：`ggrepel` 包提供了重新定位标签以最小化标签重叠的 `几何对象`。当您想要向散点图添加标签时，此包非常有用。您可以在以下 URL
  找到有关 `ggrepel` 包的更多信息：[`https://cran.r-project.org/web/packages/ggthemes/ggthemes.pdf`](https://cran.r-project.org/web/packages/ggthemes/ggthemes.pdf)。


  ## 总结


  在本章中，您了解了


  * 向 Power BI 添加 R 可视化效果时使用的框架

  * `ggplot2` 所基于的`图形分层语法`

  * 如何使用几何对象向可视化效果添加图层

  * 如何使用比例尺函数修改图表美学

  * 如何使用完整主题和 `theme()` 函数修改图表的非数据元素


  本章的目标是向您介绍一些关于 `ggplot2` 的重要概念，以便您更容易理解如何构建将在下一章学习的更高级图形。既然您已经了解了如何使用 `ggplot2`
  在 Power BI 中创建 R 可视化效果的基础知识，那么让我们更进一步，开发能够帮助您在 Power BI 中讲述精彩数据故事的 R 可视化效果！


