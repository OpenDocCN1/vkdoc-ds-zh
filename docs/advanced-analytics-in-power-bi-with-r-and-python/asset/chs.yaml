- '# 9. 将机器学习与人工智能应用于你的 Power BI 数据模型


  拥有成熟的企业级商业智能解决方案已成为许多组织的常态。相当多的公司拥有治理良好的企业数据仓库（EDW），这些仓库通过复杂的 ETL 流程进行更新。他们使用 SQL
  Server Report Services（SSRS）和 Power BI 等报告工具，帮助业务部门获得有价值的业务洞察。属于这一类的组织在利用 BI 方面做得非常出色，并且他们已经准备好将*人工智能（AI）*引入其数据战略。以下是
  AI 可用于增强成熟商业智能系统的几种方式：


  -   一家自行车店可以使用*逻辑回归*模型，为其客户维度表添加一个属性，以识别未来一年内可能购买自行车的客户。

  -   一家零售公司可以使用*k-means 聚类*算法，为其客户维度表添加一个属性，用于营销目的对客户进行细分。

  -   一家在线零售商可以使用*逻辑回归*模型，为其客户维度表添加一个属性，用于识别可能流失的客户。

  -   一家餐厅可以使用*情感分析*，根据客户的评论为其客户维度表添加一个情感属性。


  这些由 AI 生成的属性可能非常有价值，并且不易通过传统方式计算。一旦将这些 AI 生成的属性添加到你的数据模型中，它们就可以像维度表中的任何其他属性一样被使用。它们可以在你的
  Power BI 可视化对象、表格和矩阵中使用。


  在本章中，你将学习如何在 Power BI 数据模型中利用 AI。本章侧重于自助服务方法，但在本书后面，你将学习如何在不依赖 Power BI Premium
  的情况下，大规模地将你的 AI 模型投入运营。


  Power BI Premium 有一个名为 *AI Insights*（AI 洞察）的功能，可以方便地将 AI 应用于你的 Power BI 数据模型。本书不会介绍
  *AI Insights*，因为它涉及相关费用。本书中的所有示例都可以在不使用 Premium 容量（premium compacity）的情况下完成。


  本章将向你介绍多种将 AI 应用于 Power BI 数据的方法。你将学习：


  -   如何使用在 R 和 Python 中构建的*自定义机器学习*模型对 Power BI 数据进行评分

  -   如何使用 *Microsoft 认知服务*将情感分析应用于你的 Power BI 数据模型

  -   如何使用 *IBM Watson 自然语言理解*将语调分析应用于你的 Power BI 数据模型


  本章侧重于自助服务方法，但在本书后面，你将学习如何将本章概述的一些技术用于企业级解决方案。让我们开始使用在 R 和 Python 中构建的自定义模型对你的数据进行评分吧！




