  ### 步骤 5：定义标题、副标题和说明文字


  以下是可用于向可视化图形添加标题的代码，见代码清单 1-7。


  ```

  ggplot(plot.data, aes(x = carat, y = price)) +

  geom_point(aes(color = clarity))+

  labs(

  title = "图表标题",

  subtitle = "图表副标题",

  caption = "图表说明"

  )

  代码清单 1-7

  添加标题和说明文字

  ```


  `ggplot2` 通过 `labs()` 函数可以轻松地向图表添加标题、副标题和说明文字。`labs()` 函数名是 labels（标签）的缩写。可视化图形的标题可以基于静态字符串或动态生成的字符串。你将在下一章中看到基于动态生成字符串的标题示例。图
  1-6 显示了添加标题后图表的外观。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig6_HTML.jpg](img/480677_1_En_1_Fig6_HTML.jpg)


  图 1-6


  添加了标题的图表


  ### 步骤 6：对 x 轴和 y 轴进行必要的修改


  `ggplot2` 提供的 `x` 和 `y` 坐标的默认标签通常足够使用，无需更改。但如果你对默认值不满意，可以使用 `scale` 函数轻松更改。


  让我们花点时间看看你到目前为止构建的 `ggplot2` 代码，见代码清单 1-8。


  ```

  library(tidyverse)

  library(scales)

  plot.data <- plot.data %>%

  filter(color == "D") %>%

  sample_n(200)

  ggplot(plot.data, aes(carat, price)) +

  geom_point(aes(color = clarity)) +

  labs(

  title = "图表标题",

  subtitle = "图表副标题",

  caption = "图表说明"

  )

  代码清单 1-8

  修改 x 轴和 y 轴的代码

  ```


  上述代码生成了图 1-6 中的图表。该图表包含一些你想要覆盖的默认设置。你想要更改的默认设置包括：


  -   x 轴名称

  -   y 轴名称

  -   y 轴上数字的格式


  你可以使用 `scale_x_continuous()` 和 `scale_y_continuous()` 函数来更改这些默认设置，如代码清单 1-9 所示。


  ```

  library(tidyverse)

  library(scales)

  plot.data <- plot.data %>%

  filter(color == "D") %>%

  sample_n(200)

  ggplot(plot.data, aes(x = carat, y = price)) +

  geom_point(aes(color = clarity)) +

  labs(

  title = "图表标题",

  subtitle = "图表副标题",

  caption = "图表说明"

  ) +

  scale_x_continuous(name = "克拉大小") +

  scale_y_continuous(

  name = "价格（美元）",

  labels = dollar_format()

  )

  代码清单 1-9

  修改 x 轴和 y 轴的代码

  ```


  执行上述代码后得到的结果如图 1-7 所示。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig7_HTML.jpg](img/480677_1_En_1_Fig7_HTML.jpg)


  图 1-7


  覆盖部分图表默认设置


  如你所见，`scale_x_continuous()` 和 `scale_y_continuous()` 函数使得进行所需的更改相对容易。


  请注意，你向可视化图形添加比例尺的方式与添加图层的方式相同。需要特别注意的是，比例尺函数用于覆盖默认的比例尺，但它们不会向图表添加图层。


  由于 `x` 轴和 `y` 轴都基于连续数据，因此使用了 `x` 和 `y` 轴的连续版本的比例尺。对于 `x` 轴，你只想更改名称，可以看到使用 `name`
  参数可以轻松实现。对于 `y` 轴，你不仅要更改名称，还要更改轴上数字的格式。名称更改通过 `name` 参数完成。格式设置通过 `labels` 参数完成。`scales`
  包中的 `dollar_format()` 函数用于将数字格式化为美元格式。`dollar_format()` 函数继承了脚本第一行中定义的 `ggplot()`
  函数的 `y` 值，因此无需在函数中显式定义。




  ### 第 7 步：按需应用主题


  `ggplot2` 内置了预定义的主题，用于格式化图表中非数据相关的方面。非数据方面包括诸如标题在图表上的位置、图表的背景颜色以及标题中使用的字体大小等属性。为你的可视化图表应用一个预定义主题非常简单。添加主题的方式与添加图层和修改标度相同。你只需输入
  `+` 号，后跟代表你想要添加的主题的函数，如代码清单 1-10 中最后两行所示。


  ```

  ggplot(plot.data, aes(x = carat, y = price)) +

  geom_point(aes(color = clarity)) +

  labs(

  title = "Chart Title",

  subtitle = "Chart Subtitle",

  caption = "Chart Caption"

  ) +

  scale_x_continuous(name = "Size in Carats") +

  scale_y_continuous(

  name = "Price ($)",

  labels = dollar_format()

  ) +

  theme_minimal()

  Listing 1-10

  应用 theme_minimal() 主题

  ```


  生成的可视化图表如图 1-8 所示。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig8_HTML.jpg](img/480677_1_En_1_Fig8_HTML.jpg)


  图 1-8


  基于 R 脚本的主题默认设置


  你在上面的可视化图表中使用了 `theme_minimal()` 主题。在数据分析中，一个良好的实践是仅在绝对必要时才向可视化图表添加元素。图表中的空白区域被认为是有益的。`theme_minimal()`
  主题正是基于这一原则。`ggplot2` 中可用的主题列表将在后续的“`ggplot2` 内置主题”一节中介绍。


  ### 第 8 步：使用 `theme()` 函数更改任何特定的非数据元素


  如果你对应用于可视化图表的主题效果不完全满意，可以使用 `theme()` 函数进一步调整结果。代码清单 1-11 中的代码使用 `theme()` 函数来格式化标题。


  ```

  ggplot(plot.data, aes(carat, price)) +

  geom_point(aes(color = clarity)) +

  labs(

  title = "Chart Title",

  subtitle = "Chart Subtitle",

  caption = "Chart Caption"

  ) +

  scale_x_continuous(name = "Size in Carats") +

  scale_y_continuous(

  name = "Price ($)",

  labels = dollar_format()

  ) +

  theme_minimal() +

  theme(

  plot.title = element_text(hjust = 0.5),

  plot.subtitle = element_text(hjust = 0.5),

  plot.caption = element_text(hjust = 1)

  )

  Listing 1-11

  使用 theme() 函数更改非数据元素

  ```


  该代码生成图 1-9 中的可视化图表。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig9_HTML.jpg](img/480677_1_En_1_Fig9_HTML.jpg)


  图 1-9


  使用 `theme()` 函数重新定位标题


  `theme()` 函数允许你访问超过 80 个可修改的图表元素。其中大部分元素都关联一个用于进行修改的元素函数。


  在上面的代码中，我们修改了图表标题、图表副标题和图表说明文字的位置。正如你在代码中所见，与图表标题关联的元素是 `plot.title`，与图表副标题关联的元素是
  `plot.subtitle`，与图表说明文字关联的元素是 `plot.caption`。这三个元素都使用 `element_text()` 函数进行修改。图表标题和副标题通过
  `element_text()` 函数中的 `hjust` 参数实现居中。`hjust` 参数表示文本的水平位置，它接受一个介于 0 和 1 之间的值。如果将
  `hjust` 设置为 0，文本将左对齐；设置为 0.5，文本将居中对齐；设置为 1，文本将右对齐。


  代码清单 1-12 展示了元素函数及其可用选项。


  ```

  element_blank()

  element_rect(fill = NULL, colour = NULL, size = NULL, linetype = NULL, color = NULL,
  inherit.blank = FALSE)

  element_line(colour = NULL, size = NULL, linetype = NULL,

  lineend = NULL, color = NULL, arrow = NULL, inherit.blank = FALSE)

  element_text(family = NULL, face = NULL, colour = NULL, size = NULL, hjust = NULL,
  vjust = NULL, angle = NULL, lineheight = NULL, color = NULL, margin = NULL, debug
  = NULL, inherit.blank = FALSE)

  Listing 1-12

  元素函数及其可用选项

  ```


  此 URL [`https://bit.ly/34EaWtr`](https://bit.ly/34EaWtr) 包含了关于 `theme()` 函数的完整文档。


