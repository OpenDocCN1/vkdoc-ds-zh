- "# 使用预构建的 AI 模型增强 Power BI 数据模型\n\n开发 `AI 模型`并非易事。开发一个能够良好泛化真实数据的模型，可能需要耗费大量资源和时间。这通常需要一个由数据科学家和数据工程师组成的团队才能完成。幸运的是，像\
  \ `Microsoft` 和 `IBM` 这样的大型软件供应商已经开发出了复杂的 `AI 模型`，这些模型可以通过 `API 调用`轻松访问。这些模型基于多年的研究成果，你很难自行复制。\n\
  \n在本节中，你将学习如何使用这些模型来增强你的 Power BI 数据模型。你将学习如何使用 `Microsoft 认知服务`来执行`情感分析`。\n\n情感分析用于检测一段文本（句子、段落、推文等）的情感是积极还是消极。在\
  \ `Microsoft 认知服务`中，这是通过分配一个介于 0 和 1 之间的数值分数来完成的。分数越接近 0，文本越消极；分数越接近 1，文本越积极。\n\n\
  你可以使用`情感分析`来增强 Power BI 数据模型，方法是为维度表添加属性。例如，如果你是一家餐厅，客户评论的平均情感分数可以作为客户维度表中某个属性的基础。这样的属性可用于发现诸如`情感`与客户流失之间的关联。以餐厅为例，你可能会发现大多数低情感分数与购买特定菜单项的客户相关。\n\
  \n让我们来了解一下使用 `Microsoft 认知服务`将`情感分析`添加到 Power BI 模型所需的步骤。本示例将仅使用 Python 完成，因为目前不支持\
  \ R。你也可以通过 `Power BI 数据流`使用 `AI Insights` 来执行此任务，但这需要 `Power BI Premium`，它相对昂贵，超出了许多\
  \ Power BI 用户的价格范围。\n\n## 在 Azure 中设置认知服务\n\n在 Power BI 中使用 `Microsoft 认知服务`之前，你必须在\
  \ `Azure` 中对其进行配置。如果你按照本书引言中的步骤创建了 `Azure 账户`，那么你将拥有一个。如果你是 `Azure` 新手，我强烈建议你注册一个免费账户。在撰写本文时，Microsoft\
  \ 为第一个月提供了 200 美元的免费额度！如果你在服务的第一个月内完成本书中所有与 `Azure` 相关的活动，这些额度绰绰有余。如果你没有 `Azure\
  \ 账户`，请前往本书引言获取注册说明。\n\n如果你已有 `Azure 账户`，则需要登录 `Azure 门户`。你可以通过访问 [`portal.azure.com`](https://portal.azure.com)\
  \ 来登录。登录你的 `Azure 账户`后，点击页面左上角的 `创建资源` 按钮。接下来点击 `AI + 机器学习` ➤ `文本分析`。这些操作将带你进入一个需要填写的表单，以设置\
  \ `文本分析` 服务。在 `名称` 文本框中为资源指定一个有意义的名称，在 `订阅` 文本框中附加一个订阅，在 `位置` 文本框中将位置设置为离你最近的区域，在\
  \ `定价层` 文本框中选择适合你需求的定价层，并在 `资源组` 文本框中将资源附加到现有资源组或创建一个新的资源组。如果你仍在第一个月内，则包含 200 美元额度的订阅将作为订阅选项提供给你。\n\
  \n## 数据科学虚拟机 (DSVM)\n\n如前所述，本示例将仅使用 Python 完成，因为不支持 R。除了仅使用 Python 之外，本示例还将在 `Microsoft\
  \ 数据科学虚拟机 (DSVM)` 中完成。推荐使用 `DSVM` 的原因是它预配置了数据科学所需的大部分工具。它预装了 Python 的 `Anaconda`\
  \ 发行版、`Power BI`、`SQL Server`、`Jupyter Lab` 和 `Azure Data Studio` 等。自行配置这样的环境会很困难，但使用\
  \ `DSVM`，你可以按需快速启动一个。\n\n在继续之前，你需要在 `DSVM` 中完成一些操作来配置你的环境。你需要为 Microsoft 认知服务安装一些包。以下是需要执行的步骤：\n\
  \n1. `启动你的 DSVM`：你可以在个人桌面上进行开发，但我强烈建议你使用 `DSVM`。如果你选择自行操作，请从你选择的环境开始。\n\n2. `打开\
  \ conda 提示符`：要打开 conda 提示符，请在 Windows 搜索栏中键入 `anaconda prompt` 进行搜索。你应该会看到它出现在搜索列表中。右键单击它，然后以管理员身份启动。\n\
  \n3. `激活用于 Azure 开发的 Python 环境`：建议使用 `DSVM` 中预装的 `AzureML` 环境。要激活 `AzureML` 环境，请在\
  \ conda 提示符中键入以下内容：\n\n    ```\n    conda activate AzureML\n    ```\n\n    如果你在自己的环境中操作，并且不知道应该使用哪个环境，请在\
  \ conda 提示符中键入 `conda env list` 以获取可用环境列表。\n\n4. `键入以下代码以安装库`：确保通过使用步骤 3 中的代码激活所需环境，在正确的环境中安装库。\n\
  \n    ```\n    pip install azure-cognitiveservices-language-textanalytics\n    ```\n\
  \n## 通过 Python 在 Microsoft 认知服务中执行情感分析\n\n在本练习中，你将使用来自 Kaggle 的免费 Yelp 评论数据集。以下是你需要获取数据并在\
  \ Power BI 中对其进行评分的步骤。\n\n### 步骤 1：从 Kaggle 获取 Yelp 评论数据\n\n在撰写本文时，该数据集可通过以下 URL\
  \ 获取：[`www.kaggle.com/yelp-dataset/yelp-dataset/version/4`](http://www.kaggle.com/yelp-dataset/yelp-dataset/version/4)。请确保为本示例下载\
  \ `yelp_review` 数据集的 `csv` 版本。该数据集将作为 zip 文件下载。解压 `yelp_review.csv` 文件，并将其保存到仓库中本章的\
  \ `Data` 文件夹中。\n\n`yelp_review.csv` 数据集很大。它包含近 530 万条评论。本练习不需要那么多样本，*强烈*建议你使用样本以将成本降至最低。以下脚本从\
  \ `yelp_review.csv` 数据集中随机抽取 100 条评论，并将其保存为 `yelp_review_sample.csv` 文件：\n\n```\n\
  import pandas as pd\nimport numpy as np\nimport os\nos.chdir(\"set to your working\
  \ directory\")\ndfYelpReviews = pd.read_csv(\"yelp_review.csv\")\ndfYelpReviewsSample\
  \ = dfYelpReviews.sample(100, random_state = 1)\ndfYelpReviewsSample[\"id\"] = np.arange(len(dfYelpReviewsSample))\n\
  dfYelpReviewsSample = dfYelpReviewsSample[[\"id\",\"text\"]]\ndfYelpReviewsSample.to_csv(\n\
  \"yelp_review_sample.csv\", index = False)\n```\n\n脚本的工作原理如下：\n\n1. `加载所需的库`：`Pandas`\
  \ 用于一些基本的数据处理，`numpy` 中的 `arange` 函数用于创建行号列，`os` 用于设置工作目录。\n\n2. `读取 yelp_review\
  \ 数据集`：通过使用 `pandas` 的 `read_csv()` 方法完成。\n\n3. `使用 dfYelpReviewsSample 数据框的 sample\
  \ 方法创建数据集的样本`：你仅使用两个参数创建了样本。第一个参数是样本大小，在本例中为 100。第二个参数是 `random_state` 参数。如果你像之前一样将该参数设置为\
  \ 1，那么你的样本将返回与本书作者使用的相同数据集。\n\n\n\n### 步骤 2：导入脚本所需的库、模块和函数\n\n此步骤是脚本开发的起点。您将从以下所示的导入语句开始：\n\
  \n```python\nimport pandas as pd\nimport ast\nimport os\nfrom azure.cognitiveservices.language.textanalytics\
  \ import TextAnalyticsClient\nfrom msrest.authentication import CognitiveServicesCredentials\n\
  ```\n\n您已经了解前三个库中的两个。`ast` 库是新的。该库中的 `literal_eval()` 函数用于评估表示 Python 表达式的字符串。此功能将在本脚本中使用，并在后续步骤中进行说明。`TextAnalyticsClient`\
  \ 和 `CognitiveServicesCredentials` 函数用于在下一步与 Microsoft 认知服务进行通信。\n\n### 步骤 3：为脚本中使用的变量赋值\n\
  \n变量的值通过以下代码在脚本中设置：\n\n```python\napi_key = \"\"\nendpoint = \\\n\"https://rwtextanalyticsapi.cognitiveservices.azure.com/\"\
  \ncredentials = CognitiveServicesCredentials(subscription_key)\ntext_analytics =\
  \ TextAnalyticsClient(\nendpoint=endpoint, credentials=credentials)\n```\n\n您可以通过在\
  \ Azure 中访问文本分析资源来找到 API 密钥和端点的值。两者都可以在“概述”页面中找到。您可以通过单击右上角的“概述”选项卡进入该页面。API 密钥用于创建\
  \ `CognitiveServicesCredentials` 的实例。`credentials` 和 `endpoint` 变量一起用于创建 `TextAnalyticsClient`\
  \ 的实例，该实例被赋值给 `text_analytics` 变量。`text_analytics` 变量将是执行情感分析的主力。\n\n### 步骤 4：将\
  \ Yelp 评论数据样本读入 Python\n\n以下代码将样本读入 pandas 数据框。**务必使用样本数据集，而不是整个数据集。** 整个数据集包含近\
  \ 530 万条评论，这可能会导致您产生不必要的费用。样本数据集中的 100 条观测值足以用于练习。您之前创建的样本数据集包含两个字段：`id` 字段用于标识每条评论，`text`\
  \ 字段包含将要分析的评论内容。添加了语言字段，以便 Microsoft 认知服务知道使用哪种语言。您使用 `en`，因为这是英语的代码，而评论的语言正是英语。\n\
  \n```python\ndf = pd.read_csv(\"\")\ndf[\"language\"] = \"en\"\n```\n\n### 步骤 5：将数据框转换为\
  \ Microsoft 认知服务所需的格式\n\nMicrosoft 认知服务要求发送给它的情感分析数据是一个字典列表。以下是字典列表的示例：\n\n```python\n\
  documents = [\n{\"id\": \"1\",\n\"language\": \"en\",\n\"text\": \"Football is great\
  \ sport.\"},\n{\"id\": \"1\",\n\"language\": \"en\",\n\"text\": \"Lamar Jackson\
  \ is the best quarterback.\"},\n{\"id\": \"1\",\n\"language\": \"en\",\n\"text\"\
  : \"UK football sucks!!! \"}\n]\n```\n\npandas 数据框的 `to_json()` 方法可用于将 `df` 数据框重新格式化为该格式。为此，您需要将\
  \ `orient` 参数设置为 `records`，如下列代码所示：\n\n```python\ndocuments = df.to_json(orient='records')\n\
  ```\n\n输出被格式化为字典列表，但 Python 并不这样看待它。Python 仅将其视为一个字符串。您需要明确告诉 Python 将 `df.to_json(orient='records')`\
  \ 的输出评估为 Python 表达式。您可以通过使用 `ast` 库中的 `literal_eval()` 函数来实现这一点，如下列代码所示：\n\n```python\n\
  documents = ast.literal_eval(documents)\n```\n\n现在，`documents` 变量以正确的格式包含了 Microsoft\
  \ 认知服务所需的信息。传递给 Microsoft 认知服务的列表中的每个字典都包含三个键/值对。这三个键是：用于唯一标识您正在执行情感分析的每条评论的 `id`、表示您要分析的文本的\
  \ `text`，以及您希望进行情感分析所使用的 `language`。\n\n### 步骤 6：使用 text_analytics 对象的情感分析方法对评论进行评分\n\
  \n用于对评论进行评分的代码如下：\n\n```python\nresponse = text_analytics.sentiment(documents=documents,\
  \ raw = False)\n```\n\n它返回一个列表，其中包含传递给 `sentiment()` 方法的每条评论的批处理结果项。每个批处理结果项都包含保存评论信息的属性。您感兴趣的两个属性是\
  \ `id` 属性和 `score` 属性。您将在下一步中使用这两个属性来构建包含情感分数的数据框。\n\n### 步骤 7：创建一个数据框来保存情感数据\n\n\
  您已经能够对评论进行评分，并以批处理结果项列表的形式获取返回的信息。如前所述，该列表包含发送给 Microsoft 认知服务的每条评论的批处理结果项。每个批处理结果项都包含公开评论信息的属性。您感兴趣的两个属性是评论的\
  \ `id` 和情感分数。\n\n以下是脚本中使用 Microsoft 认知服务返回的每个对象的 `id` 和 `score` 属性来创建数据框的部分：\n\n\
  ```python\nlistSentiments = []\nfor document in response.documents:\n    id = document.id\n\
  \    score = document.score\n    listSentiments.append([id, score])\ndfSentiments\
  \ = pd.DataFrame(\n    listSentiments, columns=['ID','Score'])\ndfSentiments\n```\n\
  \n以下是按步骤分解的脚本说明：\n\n1. **创建一个空列表并将其命名为 `listSentiments`**：第一行创建一个名为 `listSentiments`\
  \ 的空列表。此列表将填充从 Microsoft 认知服务检索到的输出，并最终在后续步骤中转换为数据框。\n\n2. **使用 `for` 循环遍历 `response.documents`\
  \ 中的每个文档**：`for` 循环用于遍历 `response.documents` 中的每个文档，以访问情感信息。\n\n3. **获取每个文档的 `id`\
  \ 和 `score`**：每次迭代返回的文档都包含 `id` 和 `score` 属性。您使用以下代码获取这些值并将其放入各自的变量中：\n\n    ```python\n\
  \    id = document.id\n    score = document.score\n    ```\n\n4. **将当前文档的值追加到 `listSentiments`\
  \ 列表中**：在此步骤中，您通过列表的 `append()` 方法，使用步骤 3 中创建的变量来填充 `listSentiments` 列表。`append()`\
  \ 方法使用基于这两个变量的列表来追加信息。\n\n5. **创建 `dfSentiments` 数据框**：使用 pandas 的 `DataFrame()`\
  \ 方法将 `listSentiments` 列表转换为数据框。将包含所需列名的列表传递给 `DataFrame()` 方法的 `columns` 参数，以命名数据框中的列。\n\
  \n\n\n### 步骤 8：将数据添加到 Power BI\n\n完整的脚本见代码清单 9-3。\n\n```python\nimport pandas as\
  \ pd\nimport json\nimport ast\nfrom pandas.io.json import json_normalize\nfrom azure.cognitiveservices.language.textanalytics\
  \ import (\nTextAnalyticsClient)\nfrom msrest.authentication import CognitiveServicesCredentials\n\
  api_key = \"\"\nendpoint = \\\n\"https://rwtextanalyticsapi.cognitiveservices.azure.com/\"\
  \ncredentials = CognitiveServicesCredentials(api_key)\ntext_analytics = TextAnalyticsClient(\n\
  endpoint=endpoint, credentials=credentials)\ndf = pd.read_csv(\"\")\ndf[\"language\"\
  ] = \"en\"\ndocuments = df.to_json(orient='records')\ndocuments = ast.literal_eval(documents)\n\
  response = text_analytics.sentiment(\ndocuments=documents, raw = False)\nlistSentiments\
  \ = []\nfor document in response.documents:\nid = document.id\nscore = document.score\n\
  listSentiments.append([id, score])\ndfSentiments = pd.DataFrame(\nlistSentiments,\
  \ columns=['ID','Score'])\nListing 9-3\nPython script that uses Microsoft Cognitive\
  \ Services to perform sentiment analysis\n```\n\n将代码复制并粘贴到 Power BI 的 *Python 编辑器*中。这样做会将\
  \ `dfSentiments` 数据框暴露给 Power BI 数据模型。\n\n## 使用 Microsoft 认知服务以外的服务将 AI 应用于 Power\
  \ BI 数据模型\n\n*Microsoft 认知服务* 提供了丰富的 AI 模型供您利用，但它们并不能覆盖所有情况。幸运的是，IBM 和 Google 等其他供应商提供的服务功能极其强大，可以帮助填补这一空白。您会发现，某些服务（如*情感分析*）是所有供应商共有的，但也有一些服务可能为特定供应商所独有。其中一项服务就是\
  \ *IBM Watson Natural Language Understanding* 提供的 *Tone Analyzer*。\n\n在本章中，您将学习如何利用\
  \ *IBM Watson Natural Language Understanding* 在 Power BI 中使用其 *Tone Analyzer API*。*Tone\
  \ Analyzer* 用于返回文本的语气。它可以检测到的语气包括快乐、悲伤、兴奋等。本练习将仅使用 Python 完成，因为在撰写本文时，*IBM Watson*\
  \ 尚不支持 R。下一节将介绍如何在 *IBM Watson Natural Language Understanding* 中设置您的账户，随后一节将介绍如何在\
  \ Power BI 中通过 Python 脚本使用该服务。\n\n### 在 IBM Watson 中配置 Tone Analyzer 服务\n\n与 Azure\
  \ 类似，您需要先获取一个账户，然后设置 *Tone Analyzer* 服务。以下是具体步骤。\n\n#### 步骤 1：注册 IBM Cloud 账户\n\n\
