- '# 第三部分：使用 R 和 Python 转换数据


  '
- "# 7. 高级字符串操作与模式匹配\n\n基本的字符串操作和模式匹配任务可以使用 Power Query 中预装的众多字符串函数之一来处理。你可以通过图形界面访问其中的许多函数，它们也可用于自定义列。这些函数在简单情况下效果很好，但在更高级的场景中则不够用。幸运的是，R\
  \ 和 Python 拥有高级工具，使你能够执行超出 Power Query 能力范围的高级字符串操作和模式匹配任务。\n\n在本书的这一部分，你将学习如何利用\
  \ R 和 Python 进行高级字符串操作和模式匹配。重点将放在*正则表达式*的使用上。正则表达式（有时简称为 regex）是用于描述搜索模式的文本字符串。它们非常强大，能够让你执行需要高级业务逻辑的字符串操作和模式匹配，而这些是使用\
  \ Power Query 中的基本匹配方法无法实现的。\n\n在本章中，你将学习如何：\n\n-   屏蔽敏感数据\n-   统计备注字段中的单词数和句子数\n\
  -   清洗格式不正确的名称\n-   测试字符串中是否存在某种模式\n\n你将通过可能在业务中遇到的场景来学习这些方法。首先，我们来学习如何屏蔽敏感数据。\n\
  \n## 屏蔽敏感数据\n\n许多公司收集客户的个人数据，这使得公司及其客户都容易受到安全漏洞的影响。大多数公司都有严格的指导方针来最小化这种风险。但有时公司需要与外部供应商共享数据，以便更深入地了解其数据。在这种情况下，他们需要确保任何敏感数据都被屏蔽，以保护客户。\n\
  \n在此场景中，催收部门副总裁 Marc Lovejoy 正与 IT 部门副总裁 Didi Costas 合作，使用 Power BI 开发一个分析报告系统。该分析系统的要求之一是对催收员在与债务人每次通话后创建的备注进行情感分析。部分备注包含社会安全号码和电话号码。他们希望使用\
  \ *Microsoft 认知服务*，但在将备注发送给 Microsoft 认知服务进行情感分析之前，需要屏蔽其中的社会安全号码和电话号码。\n\nMicrosoft\
  \ 认知服务是一组由 Microsoft 构建的机器学习算法，旨在帮助解决某些需要人工智能的问题。你将在后续章节中学习如何在 Power BI 中进行情感分析。\n\
  \n他们将需求分享给了分析师 Tank Wade，他提出了两种解决方案：一种使用 R，另一种使用 Python。以下是使用 R 的解决方案。\n\n### 在\
  \ Power BI 中使用 R 屏蔽敏感数据\n\n我们将在接下来的步骤中说明如何利用正则表达式通过 R 在 Power BI 中屏蔽数据。使用 Power\
  \ Query 原生功能来完成此任务即使不是不可能，也会极其困难。让我们来看看所需的步骤！\n\n#### 步骤 1：导入 tidyverse 和 stringr\n\
  \n像往常一样，你从加载包开始。你将加载的第一个包是 `tidyverse`。你将使用 `tidyverse` 中的 `dplyr` 包向数据集添加新字段，并使用\
  \ `tidyverse` 中的 `readr` 包将数据读入数据框。`stringr` 包将在此脚本中承担主要工作。你将利用 `str_replace` 函数结合正则表达式来屏蔽敏感数据。以下是加载所需包的代码：\n\
  \n```r\nlibrary(tidyverse)\nlibrary(stringr)\n```\n\n\n\n#### 步骤 2：创建数据脱敏函数\n\n\
  使用 R 语言的一个优点在于，可以轻松构建自定义函数并在后续脚本中复用。本脚本中的自定义函数将接收文本，使用正则表达式搜索 SSN 和电话号码，对找到的 SSN\
  \ 和电话号码进行脱敏处理，并返回脱敏后的数据。以下是创建该函数所需的步骤：\n\n1.  按如下所示创建函数框架：\n\n    ```\n    mask_text\
  \ <- function(unmask_text){\n    }\n    ```\n\n    函数名称为 `mask_text`，该函数接受一个名为 `unmask_text`\
  \ 的参数。\n\n2.  创建一个匹配美国电话号码模式的正则表达式，并将其赋值给名为 `phone_pattern` 的变量：\n\n    ```\n  \
  \  phone_pattern = \"([2-9][0-9]{2})- .- .\"\n    ```\n\n    上述正则表达式是用于匹配电话号码的常见表达式。此类正则表达式可通过必应搜索轻松找到。\n\
  \n3.  创建一个匹配 SSN 模式的正则表达式，并将其赋值给名为 `ssn_pattern` 的变量：\n\n    ```\n    ssn_pattern\
  \ = \"\\\\d{3}-\\\\d{2}-\\\\d{4}\"\n    ```\n\n    与电话号码示例类似，你很可能通过互联网搜索找到能够有效匹配有效\
  \ SSN 格式的正则表达式。但在此示例中，我想展示开发一个匹配 SSN 模式的正则表达式是多么简单。\n\n    你可以使用 `\\d` 字符组合在正则表达式中识别数字。由于\
  \ `\\` 在正则表达式中是特殊字符，你需要通过添加另一个 `\\` 来转义 `\\d` 中的反斜杠。\n\n    像 `\\` 和 `.` 这样的字符在正则表达式中具有特殊含义，这些字符被称为*元字符*。如果你想在正则表达式中使用这些字符的字面表示，需要用*反斜杠（`\\\
  `）* 对它们进行转义。因此，如果你想在字符串中搜索*句点（`.`）*，需要在它前面加上 `\\`，以告诉正则表达式你要精确搜索句点。由于 `\\` 本身也是一个元字符，你还需要对它进行转义。也就是说，如果你想向正则表达式引擎发送\
  \ `\\.`，你需要发送字符串 `\"\\\\.\"`。\n\n    既然你已经知道如何在正则表达式中识别数字，那么让我们来构建 SSN 的基本模式。SSN\
  \ 的基本模式是三位数字，后跟一个短横线，再跟两位数字，再跟另一个短横线，最后以四位数字结尾。`ssn_pattern` 中保存的正则表达式模式通过结合使用 `\\\
  \\d` 和 `{}` 来模拟该模式。`\\\\d` 告诉正则表达式你要匹配一个数字，而 `{}` 中的数字则告诉正则表达式你要匹配的数字出现次数。正则表达式中的短横线放置在\
  \ SSN 中预期出现的位置。\n\n4.  使用以下代码对电话号码进行脱敏处理：\n\n    ```\n    cleanned_text <- str_replace(\n\
  \    unmask_text, pattern = phone_pattern,\n    replacement = \"XXX-XXX-XXXX\")\n\
  \    ```\n\n    在上述代码中，`str_replace` 函数用于对文本中找到的任何电话号码进行脱敏处理。该函数与 Power Query 中的\
  \ `Text.Replace` 函数的不同之处在于，你可以在 `str_replace` 中使用正则表达式，但不能在 `Text.Replace` 函数中使用。你可以在\
  \ Power Query 中进行非常基本的模式匹配，但无法像使用正则表达式那样进行复杂匹配。上述 `str_replace` 函数接收传入的字符串，并搜索它是否与传入的正则表达式模式匹配。如果找到该字符串，则将其替换为\
  \ `replacement` 参数中定义的脱敏字符串。因此，如果向该函数传入字符串“Ryan’s phone number is 555-852-6301 and\
  \ his SSN is 123-45-6789”，将返回“Ryan’s phone number is XXX-XXX-XXXX and his SSN is\
  \ 123-45-6789”。\n\n5.  使用以下代码对评论中的 SSN 进行脱敏处理：\n\n    ```\n    cleanned_text <-\
  \ str_replace(\n    cleanned_text, pattern = ssn_pattern,\n    replacement = \"\
  XXX-XX-XXXX\")\n    ```\n\n    上述代码接收电话号码脱敏处理的结果，并应用类似的技术，使用 `ssn_pattern` 对 SSN\
  \ 进行脱敏处理。因此，如果向该函数传入字符串“Ryan’s phone number is XXX-XXX-XXXX and his SSN is 123-45-6789”，将返回“Ryan’s\
  \ phone number is XXX-XXX-XXXX and his SSN is XXX-XX-XXXX”。\n\n6.  函数的最后一行使用 `return`\
  \ 函数返回 SSN 和电话号码脱敏处理的结果。\n\n    以下是该函数的完整代码：\n\n    ```\n    mask_text <- function(unmask_text){\n\
  \    phone_pattern = \"([2-9][0-9]{2})- .- .\"\n    ssn_pattern = \"\\\\d{3}-\\\\\
  d{2}-\\\\d{4}\"\n    cleanned_text <- str_replace(\n    unmask_text, pattern = phone_pattern,\n\
  \    replacement = \"XXX-XXX-XXXX\")\n    cleanned_text <- str_replace(\n    cleanned_text,\
  \ pattern = ssn_pattern,\n    replacement = \"XXX-XX-XXXX\")\n    return(cleanned_text)\n\
  \    }\n    ```\n\n执行 SSN 和电话号码脱敏处理所需的逻辑被封装在 `mask_text` 函数中。因此，当我们需要执行 SSN 和电话号码脱敏处理时，只需通过简单的函数调用即可完成。将业务逻辑封装在函数中，使代码更具可读性，并且更容易复用复杂的业务逻辑，而无需重写代码。\n\
  \n#### 步骤 3：将评论读入数据框\n\n使用以下代码将 `Comments.csv` 文件的内容读入数据框，并将其存储在 `df` 变量中：\n\n```\n\
  df <- read_csv(\"Comments.csv\")\n```\n\n如果你好奇读取的数据长什么样，可以在控制台中输入以下代码，返回一个将数据框显示为格式化表格数据集的视图：\n\
  \n`View(df)`\n\n#### 步骤 4：对评论字段中的电话号码和 SSN 进行脱敏处理\n\n在此步骤中，你将把 `mask_text` 函数应用于\
  \ `Comment` 字段。我们通过 `dplyr` 包中的 `mutate()` 函数来实现，该函数允许我们对 `Comment` 字段进行内联修改。以下是执行此任务的代码：\n\
  \n```\ndf % \nmutate(Comment = mask_text(Comment))\n```\n\n#### 步骤 5：将脚本复制到 Power\
  \ BI\n\n在最后一步中，你将复制整个脚本并将其粘贴到 `GetData` 中的 R 脚本编辑器中。以下是完整的脚本：\n\n```\nlibrary(tidyverse)\n\
  library(stringr)\nsetwd(\"\")\nmask_text <- function(unmask_text){\nphone_pattern\
  \ = \"([2-9][0-9]{2})- .- .\"\nssn_pattern = \"\\\\d{3}-\\\\d{2}-\\\\d{4}\"\ncleanned_text\
  \ <- str_replace(\nunmask_text, pattern = phone_pattern,\nreplacement = \"XXX-XXX-XXXX\"\
  )\ncleanned_text <- str_replace(\ncleanned_text, pattern = ssn_pattern,\nreplacement\
  \ = \"XXX-XX-XXXX\")\nreturn(cleanned_text)\n}\ndf <- read_csv(\"Comments.csv\"\
  )\ndf % \nmutate(Comment = mask_text(Comment))\n```\n\n包含脱敏数据的最终数据框将作为数据集暴露给 Power\
  \ BI，你可以将其添加到 Power BI 数据模型中。这些信息可用于增强你的 Power BI 数据模型，从而创建更丰富的可视化效果。\n\n### 使用\
  \ Python 在 Power BI 中对敏感数据进行脱敏处理\n\n在前面的示例中，我们使用 R 语言对评论中的 SSN 和电话号码进行了脱敏处理。我们可以使用\
  \ Python 通过类似的逻辑（只是编程语言不同）来完成相同的任务。你会发现，在许多情况下，使用 R 或 Python 都能同样出色地完成任务。使用哪种语言通常取决于个人偏好。现在，让我们来看看如何使用\
  \ Python 执行刚才用 R 完成的脱敏处理。\n\n#### 步骤 1：导入 pandas、os 和 re 库\n\n与往常一样，首先加载库。第一个要加载的库是\
  \ `pandas`，你将使用它来读取数据并对 `Comment` 字段进行脱敏处理。你还需要加载 `os` 包来处理一些简单的文件系统任务，而 `re` 包将用于处理本脚本中的正则表达式需求。以下是加载必要库的代码：\n\
  \n```\nimport pandas as pd\nimport re\nimport os\n```\n\n\n\n#### 步骤 2：创建 `mask_text`\
  \ 函数\n\n接下来，你需要构建一个自定义函数来屏蔽 `Comment` 字段中的电话号码和社会安全号码（SSN）。此脚本中的函数将接收 `Comment`\
  \ 字段中的文本，根据正则表达式模式匹配查找其中的 SSN 和电话号码，对其进行屏蔽，然后返回带有屏蔽数据的文本。以下是创建该函数的步骤：\n\n1.  按如下所示创建函数框架：\n\
  \n    ```\n    def mask_text (unmask_text):\n    ```\n\n    函数名称为 `mask_text`。该函数接受一个名为\
  \ `unmask_text` 的参数。\n\n2.  创建一个匹配美国电话号码模式的正则表达式，并将其值赋给名为 `phone_pattern` 的变量：\n\
  \n    ```\n    phone_pattern = r\"([2-9][0-9]{2})- .- .\"\n    ```\n\n    上述正则表达式是用于匹配电话号码的常见表达式。许多常见模式（例如匹配电话号码和\
  \ SSN 的模式）都可以通过必应或谷歌搜索轻松找到。\n\n    请注意正则表达式前使用了 `r`。在 Python 中（但在 4.0.0 版本之前的 R\
  \ 语言中不行），你可以在字符串前加上 `r` 来告诉 Python 你想将该字符串视为原始字符串。这样做时，反斜杠会被视为其字面表示，而不是特殊的元字符。这可以避免你转义反斜杠。\n\
  \n3.  创建一个匹配 SSN 模式的正则表达式，并将其值赋给名为 `ssn_pattern` 的变量：\n\n    ```\n    ssn_pattern\
  \ = r\"\\d{3}-\\d{2}-\\d{4}\"\n    ```\n\n    SSN 的模式是三位数字，后跟一个短横线，再跟两位数字，再跟一个短横线，最后以四位数字结尾。在上述正则表达式中，你使用\
  \ `\\d` 来标识数字，并使用 `{n}` 来告诉正则表达式你想要匹配前面模式的次数。因此，正则表达式中的 `\\d{3}` 表示你想要匹配三个连续的数字。\n\
  \n    此示例中的正则表达式比较宽松，会导致许多误报匹配，因为只有特定的数字组合才能用于 SSN。你可以使用更复杂的正则表达式来减少误报数量，但更高的复杂度可能会使其更难阅读。在使用正则表达式时，你必须权衡准确性和可解释性。\n\
  \n4.  使用以下代码屏蔽电话号码：\n\n    ```\n    cleanned_text = re.sub(\n    phone_pattern,\
  \ \"XXX-XXX-XXXX\", unmask_text)\n    ```\n\n    在上述代码中，`re.sub` 函数用于将文本中找到的任何电话号码替换为\
  \ X。此函数与 Power Query 中的 `Text.Replace` 函数的不同之处在于，你可以在此函数中使用正则表达式。\n\n5.  使用以下代码屏蔽评论中的\
  \ SSN：\n\n    ```\n    cleanned_text = re.sub(\n    ssn_pattern, \"XXX-XX-XXXX\"\
  , cleanned_text)\n    ```\n\n    上述代码获取电话号码屏蔽的结果，并使用 `ssn_pattern` 模式应用类似的技术。\n\n\
  6.  函数的最后一行使用 `return` 语句返回 SSN 和电话号码屏蔽的结果。\n\n以下是创建该函数所需的完整代码：\n\n```\ndef mask_text\
  \ (unmask_text):\nphone_pattern = \\\nr\"([2-9][0-9]{2})- .- .\"\nssn_pattern =\
  \ r\"\\d{3}-\\d{2}-\\d{4}\"\ncleanned_text = re.sub(\nphone_pattern, \"XXX-XXX-XXXX\"\
  , unmask_text)\ncleanned_text = re.sub(\nssn_pattern, \"XXX-XX-XXXX\", cleanned_text)\n\
  return cleanned_text\n```\n\n执行 SSN 和电话号码屏蔽所需的逻辑被抽象在 `mask_text` 函数中。因此，当你需要屏蔽 SSN\
  \ 和电话号码时，只需进行一次简单的函数调用即可。将业务逻辑抽象到函数中使代码更具可读性，并使业务逻辑更易于重用。\n\n#### 步骤 3：设置工作目录\n\n\
  使用以下代码将工作目录设置为 `Comments.csv` 文件所在的位置：\n\n```\nos.chdir(\"<path to folder that contains\
  \ the Comments.csv file\")\n```\n\n#### 步骤 4：将评论读入数据框\n\n使用 `pandas` 将 `Comments.csv`\
  \ 文件的内容读入数据框，并使用以下代码将数据框赋给名为 `df` 的变量：\n\n```\ndf = pd.read_csv(\"Comments.csv\"\
  )\n```\n\n#### 步骤 5：屏蔽电话号码和 SSN\n\n以下代码通过该字段的 `apply()` 方法将 `mask_text()` 函数应用于\
  \ `Comment` 字段，从而对该字段进行内联更新：\n\n```\ndf.Comment = df.Comment.apply(mask_text)\n\
  ```\n\n### 步骤 6：将脚本复制到 Power BI\n\n在最后一步中，你将复制整个脚本并将其粘贴到 `GetData` 中的 Python 脚本编辑器中。以下是完整的脚本：\n\
  \n```\nimport pandas as pd\nimport re\nimport os\ndef mask_text (unmask_text):\n\
  phone_pattern = \\\nr\"([2-9][0-9]{2})- .- .\"\nssn_pattern = r\"\\d{3}-\\d{2}-\\\
  d{4}\"\ncleanned_text = re.sub(\nphone_pattern, \"XXX-XXX-XXXX\", unmask_text)\n\
  cleanned_text = re.sub(\nssn_pattern, \"XXX-XX-XXXX\", cleanned_text)\nreturn cleanned_text\n\
  os.chdir(\"<path to folder that contains the Comments.csv file\")\ndf = pd.read_csv(\"\
  Comments.csv\")\ndf.Comment = df.Comment.apply(mask_text)\ndf\n```\n\n生成的包含屏蔽数据的数据框将作为数据集暴露给\
  \ Power BI，你可以将其添加到 Power BI 模型中。添加的数据可用于帮助你讲述更好的数据故事。\n\n## 统计评论中的单词数和句子数\n\n当许多人想到数据科学时，他们会想到预测数值结果或事件发生概率的算法。他们几乎不知道你并不局限于在数据科学中进行这类预测。数据科学的一个子集包括处理非结构化文本的技术。这个数据科学领域被称为自然语言处理（NLP）。NLP\
  \ 中使用的技术，如情感分析或主题分析，相当高级且难以构建。在下一章中，我们将利用 Microsoft 认知服务在 Power BI 中执行这些类型的任务。但也有一些更简单的\
  \ NLP 技术，我们无需调用像 Microsoft 认知服务这样的 API 即可使用。本章将介绍其中两种技术。我们将介绍的两种技术是统计文本语料库中的单词数和句子数。让我们通过一个例子来说明。\n\
  \nSarah 是 Yelp 的数据分析师。她的任务是为 Yelp 提供给客户的报告添加额外信息。该报告包含客户评论，Sarah 的老板 Jessica 希望她添加一列包含每条评论的单词数，以及一列包含每条评论的句子数。她能够在\
  \ R 中实现这两个要求，但在 Python 中只能进行单词计数。以下是她用 R 执行该任务所使用的步骤。\n\n\n\n### 使用 R 在 Power BI\
  \ 中统计评论的字数和句子数\n\n在本示例中，我们将使用 R 来计算 Yelp 评论中的单词数以及评论中的句子数。与之前一样，我们将借助 `tidyverse`\
  \ 中的工具来完成此任务。\n\n#### 步骤 1：导入 `tidyverse` 和 `stringr`\n\n此脚本中将使用的两个包是 `tidyverse`\
  \ 元包和 `stringr`。`tidyverse` 中的 `dplyr` 包将用于向数据集中添加一个包含字数的列，以及另一个包含句子数的列。`stringr`\
  \ 包中的 `str_count` 函数在此脚本中承担了主要工作：\n\n```r\nlibrary(tidyverse)\nlibrary(stringr)\n\
  ```\n\n#### 步骤 2：将工作目录更改为文件所在位置\n\n与往常一样，您使用 `setwd()` 函数将工作目录设置为数据所在的位置。在本示例中，您使用以下代码将其设置为\
  \ `Yelp` 数据所在的位置：\n\n```r\nsetwd(\"\")\n```\n\n#### 步骤 3：读取 Yelp 数据\n\n使用 `readr`\
  \ 中的 `read_csv` 函数将 Yelp 数据读入 R 数据框。使用以下代码将数据框分配给 `df` 变量：\n\n```r\ndf <- read_csv(\"\
  yelp_training_set_review_sample.csv\")\n```\n\n#### 步骤 4：子集化列\n\nYelp 数据集非常宽泛。它包含许多列，而您只对其中的一部分感兴趣。因此，您需要创建一个工作流，从\
  \ `df` 数据框开始，然后将其子集化为仅包含您感兴趣的列。这通过以下代码片段完成：\n\n```r\ndf %>%\nselect(id, business_categories,\
  \ business_review_count,\nbusiness_stars, business_state, business_type,\nstars,text)\n\
  ```\n\n#### 步骤 5：添加字数列和句子数列\n\n现在您需要向数据框添加两列，一列名为 `word_count`，另一列名为 `sent_count`。`word_count`\
  \ 字段将存储评论中的单词数，`sent_count` 字段将包含评论中的句子数。您将使用 `stringr` 中的 `str_count` 函数完成这两项任务，如下列代码所示：\n\
  \n```r\nmutate(word_count =\nstr_count(text, boundary(\"word\"))\n,sent_count =\
  \ str_count(text, boundary(\"sentence\"))\n)\n```\n\n`str_count` 函数使用 `boundary`\
  \ 函数来指定您想要进行的计数类型。请注意，进行字数和句子计数是多么容易！这只是一个简单的函数调用！在 Power Query 中执行句子计数是不可行的，但在\
  \ R 中只是一个简单的函数调用。\n\n### 步骤 6：将脚本复制到 Power BI\n\n以下是完整的脚本：\n\n```r\nlibrary(tidyverse)\n\
  library(stringr)\nsetwd(\"\")\ndf %>%\nselect(\nid\n,business_categories\n,business_review_count\n\
  ,business_stars\n,business_state\n,business_type,stars,text) %>%\nmutate(\nword_count\
  \ = str_count(text, boundary(\"word\"))\n,sent_count = str_count(text, boundary(\"\
  sentence\"))\n)\n```\n\n复制整个脚本并将其粘贴到 `GetData` 中的 R 脚本编辑器中，以便您可以将生成的数据框添加到 Power\
  \ BI 数据模型中。现在，该数据集可用于增强您的 Power BI 数据模型，使您能够更有效地讲述您的数据故事。\n\n### 使用 Python 在 Power\
  \ BI 中统计评论的字数\n\n在本示例中，您将使用 Python 来计算 Yelp 评论中的单词数。对于许多任务，R 和 Python 都同样适用，但在某些情况下，一种语言比另一种语言更适合执行任务。这里就是这种情况。在\
  \ Python 中计算评论句子数的解决方案不如在 R 中那么明显，因此我们将只关注字数统计。以下是可用于进行字数统计的步骤。\n\n#### 步骤 1：导入\
  \ `pandas` 和 `os`\n\n您在此脚本中将使用的两个库是 `pandas` 和 `os`。`pandas` 库将用于从 `Yelp` 文件读取数据，并计算评论中的\
  \ `words` 数量。`os` 包将用于一些文件系统任务。以下是导入这两个包的代码：\n\n```python\nimport pandas as pd\n\
  import os\n```\n\n#### 步骤 2：将工作目录更改为文件所在位置\n\n使用 `os.chdir()` 函数将工作目录设置为 Yelp 文件所在的位置。以下是执行此任务所需的代码：\n\
  \n```python\nos.chdir(r\"\")\n```\n\n您可以使用传统的文件路径约定，因为您在文件路径字符串前加了 `r`，以告诉 Python\
  \ 您想要字符串的原始版本。像 `C:\\Users\\Public` 这样的路径将有效，因为您不需要转义反斜杠。这是 Python 中已经存在一段时间的功能，但直到\
  \ 4.0.0 版本才在 R 中可用。\n\n#### 步骤 3：将 Yelp 数据读入 Python\n\n通过 `pandas` 的 `read_csv()`\
  \ 方法将 Yelp 文件的内容读入 Python，并使用以下代码将其分配给变量 `df`：\n\n```python\ndf = pd.read_csv(\"\
  yelp_training_set_review_sample.csv\")\n```\n\n#### 步骤 4：创建 `word_count` 列\n\n此步骤通过以下代码完成：\n\
  \n```python\ndf[\"word_count\"] = df[\"text\"].str.split().apply(len)\n```\n\n代码非常简洁，但做了很多事情。让我们来拆解一下。首先，pandas\
  \ 使用 `str` 类的 `split()` 方法将文本中的单词拆分并放入一个 pandas 列表中。因此，如果 `text` 字段中的内容是“The cat\
  \ in the hat.”，`split` 函数将拆分文本并将其放入一个包含五个元素的列表中，如下所示：`[The, cat, in, the, hat.]`。`split`\
  \ 函数的默认分隔符是空格，这正是您在这种情况下所需要的。如果您停在这里，您将得到一个数据框，其中有一个名为 `word_count` 的列，该列填充了基于 `text`\
  \ 字段的一系列列表。\n\n您将 `text` 字段转换为列表的原因是为了利用特定的列表属性。您可以对列表使用 `len` 函数来获取其中的元素数量。在这里，列表中的每个元素代表文本中的一个单词，因此对其应用\
  \ `len` 函数的结果将是字数的良好近似值。后者通过使用 `apply()` 方法将 `len` 函数应用于由 `split()` 函数创建的列表来完成。\n\
  \n#### 步骤 5：将脚本复制到 Power BI\n\n完整的脚本如下所示：\n\n```python\nimport pandas as pd\nimport\
  \ os\nos.chdir(r\"\")\ndf = pd.read_csv(\"yelp_training_set_review_sample.csv\"\
  )\ndf[\"word_count\"] = df[\"text\"].str.split().apply(len)\n```\n\n您需要复制此脚本并将其粘贴到\
  \ Power BI 的 Python 编辑器中。生成的数据框将可用于添加到 Power BI 数据模型中。\n\n## 删除格式无效的名称\n\n源系统中的数据通常杂乱且格式不佳。在许多情况下，数据在用于报告之前需要进行清理。下面的示例就是这种情况。\n\
  \n在此场景中，SQLWeave 的顾问 Jonathan 负责 ETL，他需要在将数据加载到 Power BI 之前，从 `DimEmployees` 维度表中清除格式无效的名称。只有符合\
  \ FN MI LN 或 FN LN 格式的名称才会被接受，其中 FN 代表*名字*，MI 代表*中间名首字母*，LN 代表*姓氏*。Jonathan 开发了一个\
  \ R 和 Python 脚本来处理此任务。以下是他在 R 中执行此任务所使用的步骤。\n\n### 使用 R 在 Power BI 中删除格式无效的名称\n\n\
  以下是使用 R 清理名称所需的步骤。我们将使用 `tidyverse` 中提供的工具来完成此任务。以下是具体步骤。\n\n\n\n#### 步骤 1：导入 `tidyverse`\
  \ 和 `stringr`\n\n在本脚本中，你将使用 `tidyverse` 元包和 `stringr`。`tidyverse` 中的 `readr` 包用于将\
  \ `DimEmployee.csv` 文件中的数据读入 R 数据框，而 `tidyverse` 中的 `dplyr` 用于对 `Name` 字段进行内联修改。该修改将利用\
  \ `stringr` 包中的 `str_extract()` 函数。以下代码导入所需的包：\n\n```\nlibrary(tidyverse)\nlibrary(stringr)\n\
  ```\n\n#### 步骤 2：将工作目录更改为 `DimEmployee.csv` 文件所在位置\n\n`setwd()` 函数用于将工作目录设置为包含该文件的路径：\n\
  \n```\nsetwd(\"\")\n```\n\n#### 步骤 3：创建正则表达式以匹配有效名称\n\n此处定义了用于匹配正确名称的正则表达式，并将其赋值给\
  \ `nameWithOrWithoutMiddleInitial` 变量：\n\n```\nnameWithOrWithoutMiddleInitial =\
  \ \"(^[A-Z][a-z]{1,10}\\\\s[a-zA-Z]\\\\s[A-Z][a-z]{1,10}$)|(^[A-Z][a-z]{1,10}\\\\\
  s[A-Z][a-z]{1,10}$)\"\n```\n\n这个正则表达式看起来可能很复杂，但实际上相当简单。让我们逐步分解：\n\n1.  该正则表达式匹配两种名称模式：一种格式为\
  \ `FN MI LN`，另一种格式为 `FN LN`，其中 `FN` 是名，`MI` 是中间名首字母，`LN` 是姓。两种模式用竖线分隔，竖线代表逻辑“或”。正则表达式中\
  \ `FN MI LN` 模式以蓝色显示，`FN LN` 模式以红色显示：\n\n    ![../images/480677_1_En_7_Chapter/480677_1_En_7_Figa_HTML.png](img/480677_1_En_7_Figa_HTML.png)\n\
  \n2.  现在我们来分解蓝色部分。回想一下，蓝色部分匹配的是 `FN MN LN` 模式。我们首先关注 `FN` 部分。正则表达式使用以下代码来识别 `FN`：`^[A-Z][a-z]{1,10}`。`^`\
  \ 告诉正则表达式你从字符串的开头开始匹配。`^` 后面跟着 `[A-Z]`，这告诉正则表达式第一个字符必须是大写字母 A 到 Z 中的一个。接下来是 `[a-z]{1,10}`。这个组合告诉正则表达式接下来的\
  \ 1 到 10 个字符应该是小写字母 a 到 z。这为正则表达式提供了灵活性，可以匹配长度为 2 到 11 个字母的名字。\n\n3.  正则表达式蓝色部分中的\
  \ `MI` 使用以下代码进行匹配：`\\\\s[a-zA-Z]\\\\s`。`\\\\s` 在正则表达式中用于匹配空白字符。回想一下，`\\` 是一个特殊的元字符，因此如果你想在正则表达式中直接使用反斜杠，你需要用另一个反斜杠对其进行转义。`MI`\
  \ 需要是单个大写或小写字母，`[a-zA-Z]` 匹配这种情况。`MI` 和 `LN` 之间需要一个空白字符，因此使用 `\\\\s` 来匹配该条件。\n\n\
  4.  最后，我们需要匹配蓝色部分的姓氏。这是使用以下模式完成的：`[A-Z][a-z]{1,10}$`。`[A-Z]` 告诉正则表达式 `LN` 中的第一个字母需要大写。`[a-z]{1,10}`\
  \ 组合告诉正则表达式姓氏中后续的字母必须是小写，而 `{1,10}` 表示可以有 1 到 10 个小写字母。正则表达式中的 `$` 终止匹配。\n\n5. \
  \ `FN LN` 匹配以红色显示。唯一的区别是去掉了 `\\\\s[a-zA-Z]\\\\s`，因为你试图匹配一个没有中间名首字母的名称。\n\n#### 步骤\
  \ 4：将数据读入数据框\n\n使用以下代码将 `DimEmployee.csv` 文件的内容读入 R 数据框，并将其赋值给 `df` 变量：\n\n```\n\
  df <- read_csv(\"DimEmployee.csv\")\n```\n\n#### 步骤 5：对 `Name` 列进行内联更新\n\n执行此步骤的代码如下所示：\n\
  \n```\ndf <- df %>%\nmutate(Name = str_extract(Name,nameWithOrWithoutMiddleInitial))\n\
  ```\n\n`mutate()` 函数用于执行内联更新。`stringr` 中的 `str_extract()` 函数测试 `Name` 字段，看它是否与 `nameWithOrWithoutMiddleInitial`\
  \ 变量中定义的正则表达式模式匹配。如果找到匹配项，它将从 `Name` 字段中提取与模式匹配的文本。否则，它不返回任何内容。\n\n### 步骤 6：将脚本复制到\
  \ Power BI\n\n在最后一步中，你复制整个脚本并将其粘贴到 `GetData` 中的 R 脚本编辑器中。以下是完整的脚本：\n\n```\nlibrary(tidyverse)\n\
  library(stringr)\nsetwd(\"C:/Users/rwade/Downloads/Chapter5/Chapter5\")\nnameWithOrWithoutMiddleInitial\
  \ = \"(^[A-Z][a-z]{1,10}\\\\s[a-zA-Z]\\\\s[A-Z][a-z]{1,10}$)|(^[A-Z][a-z]{1,10}\\\
  \\s[A-Z][a-z]{1,10}$)\"\ndf <- df %>%\nmutate(Name = str_extract(Name,nameWithOrWithoutMiddleInitial))\n\
  ```\n\n生成的包含掩码数据的数据框将作为数据集暴露给 Power BI，你可以将其添加到 Power BI 模型中。\n\n### 使用 Python 在\
  \ Power BI 中删除格式无效的名称\n\n以下是使用 Python 清洗名称所需的步骤。我们将使用 `pandas`、`re` 和 `os` 来完成此任务。具体步骤如下。\n\
  \n#### 步骤 1：导入 `pandas`、`re` 和 `os` 库\n\n在本脚本中，你将使用 `pandas`、`re` 和 `os`。`pandas`\
  \ 库用于将 `DimEmployee.csv` 文件中的数据读入 Python 数据框，并用于对 `Name` 字段进行内联修改。该修改将利用 `re` 库中的一些函数来执行一些正则表达式任务。它还将使用\
  \ `os` 包来处理文件系统任务。以下是导入这些库的代码：\n\n```\nimport pandas as pd\nimport re\nimport os\n\
  ```\n\n#### 步骤 2：将工作目录更改为 `DimEmployee.csv` 文件所在位置\n\n脚本使用 `os.chdir()` 将工作目录更改为存放\
  \ `DimEmployee.csv` 文件的位置，代码如下：\n\n```\nos.chdir(r\"\")\n```\n\n#### 步骤 3：将 `DimEmployee`\
  \ 数据读入 R 数据框\n\n使用 `pandas` 包中的 `read_csv()` 方法将 `DimEmployee.csv` 文件的内容读入 pandas\
  \ 数据框，并将其赋值给 `df` 变量，代码如下：\n\n```\ndf = pd.read_csv(\"DimEmployee.csv\")\n```\n\n\
  \n\n#### 第 4 步：创建匹配有效姓名的正则表达式\n\n用于匹配正确姓名的正则表达式定义如下：\n\n```\nr'([A-Z][a-z]{1,10}\\\
  s[a-zA-Z]\\s[A-Z][a-z]{1,10})|' \\\nr'([A-Z][a-z]{1,10}\\s[A-Z][a-z]{1,10})'\n```\n\
  \n该正则表达式使用 `re` 包中的 `compile()` 方法进行编译，并赋值给 `nameWithOrWithoutMiddleInitial` 变量。这个正则表达式看起来可能很复杂，但实际上相当简单。让我们逐步分解：\n\
  \n1.  该正则表达式匹配两种姓名模式：一种格式为 `名 中间名首字母 姓`，另一种格式为 `名 姓`，其中 `FN` 代表名，`MI` 代表中间名首字母，`LN`\
  \ 代表姓。两种模式用竖线分隔，竖线代表逻辑“或”。正则表达式中 `名 中间名首字母 姓` 部分用蓝色表示，`名 姓` 部分用红色表示。表达式以 `r` 开头，这告诉\
  \ Python 将该字符串视为*原始*字符串。原始字符串会按字面意思解释反斜杠，而不是将其视为特殊字符，因此原始字符串中的反斜杠无需转义：\n\n   ![../images/480677_1_En_7_Chapter/480677_1_En_7_Figb_HTML.png](img/480677_1_En_7_Figb_HTML.png)\n\
  \n2.  现在我们来分解蓝色部分。回顾一下，蓝色部分匹配的是 `名 中间名 姓` 模式。我们首先关注 `名` 部分。正则表达式使用以下代码来识别 `名`：`[A-Z][a-z]{1,10}`。其中\
  \ `[A-Z]` 表示模式中的第一个字符应匹配 A 到 Z 之间的大写字母。接下来是 `[a-z]{1,10}`。这组字符告诉正则表达式，接下来的 1 到 10\
  \ 个字符应为 a 到 z 之间的小写字母。这为正则表达式提供了灵活性，可以匹配长度为 2 到 11 个字符的名字。\n\n3.  正则表达式蓝色部分中的 `MI`\
  \ 使用以下代码进行匹配：`\\s[a-zA-Z]\\s`。`\\s` 在正则表达式中用于匹配空白字符。`MI` 需要是一个大写或小写的单个字母，`[a-zA-Z]`\
  \ 正好匹配这种情况。`MI` 和 `LN` 之间需要一个空白字符，因此使用 `\\s` 来满足该条件。你不需要使用反斜杠来转义反斜杠，因为正则表达式字符串已被转换为原始字符串，所以反斜杠不会被解释为特殊字符。\n\
  \n4.  接下来，你需要匹配姓氏。这通过以下模式完成：`[A-Z][a-z]{1,10}`。`[A-Z]` 告诉正则表达式 `LN` 的第一个字母必须大写。`[a-z]{1,10}`\
  \ 组合告诉正则表达式姓氏中后续的字母必须是小写，而 `{1,10}` 表示可以有 1 到 10 个小写字母。正则表达式中的 `$` 用于终止表达式。\n\n\
  5.  `名 姓` 匹配部分用红色表示。唯一的区别是去掉了 `\\s[a-zA-Z]\\s`，因为我们不需要匹配中间名首字母。\n\n以上五个步骤说明了正则表达式是多么简单，以及使用它们匹配模式是多么容易。我们之前使用的模式很简单，但正则表达式有许多特性，可以让你匹配一些复杂的模式。它们非常强大，是数据分析师工具箱中的必备工具。\n\
  \n#### 第 5 步：编译正则表达式\n\n执行此步骤所需的代码如下：\n\n```\nnamepattern = \\\nr'([A-Z][a-z]{1,10}\\\
  s[a-zA-Z]\\s[A-Z][a-z]{1,10})|' \\\nr'([A-Z][a-z]{1,10}\\s[A-Z][a-z]{1,10})'\nnameWithOrWithoutMiddleInitial\
  \ = re.compile(namepattern)\n```\n\n首先，我们将第 4 步中创建的正则表达式赋值给一个名为 `namepattern` 的变量。然后，我们使用\
  \ `re` 中的 `compile()` 方法创建一个名为 `nameWithOrWithoutMiddleInitial` 的模式对象。该对象将用于在后续步骤中执行模式匹配。\n\
  \n#### 第 6 步：定义执行姓名测试的函数\n\n执行清洗操作的函数名为 `scrubName`。代码如下：\n\n```\ndef scrubName(name):\n\
  \    m = nameWithOrWithoutMiddleInitial.fullmatch(name)\n    if m:\n        return\
  \ m.group(0)\n    else:\n        return None\n```\n\n该函数接受一个参数，即你想要清洗的姓名。函数中的第一行代码使用了\
  \ `nameWithOrWithoutMiddleInitial` 正则表达式对象的 `fullmatch()` 方法。该方法接受传递给函数的 `name`\
  \ 参数，并测试该姓名是否完全匹配 `nameWithOrWithoutMiddleInitial` 中定义的模式。请注意，你不需要使用 `^` 或 `$` 来定义模式的开始和结束，因为你正在进行的是完全匹配。\n\
  \n结果存储在 `m` 中。如果匹配成功，则返回一个*匹配对象*；否则，返回 `None`，这是 Python 中与 `null` 等价的值。匹配对象有许多不同的方法。你将使用的是\
  \ `group()` 方法。让我们用一个简单的正则表达式来说明：\n\n```\nimport re\np = re.compile(\"(Ryan)\\\\\
  s(Wade)\")\nm = p.fullmatch(\"Ryan Wade\")\nm.group(0)\nm.group(1)\nm.group(2)\n\
  ```\n\n这里使用的正则表达式是一个字面表达式，用于匹配我的名字。我的名和姓被放在括号中分组。因此，如果我将字符串 \"Ryan Wade\" 传递给 `p`，`fullmatch()`\
  \ 显然会找到匹配项，并将匹配结果分成三组。如果我想返回完全匹配的字符串 \"Ryan Wade\"，则使用 `m.group(0)`，因为 0 返回完整匹配。如果我只想返回\
  \ \"Ryan\"，则使用 `m.group(1)`；如果我只想返回 \"Wade\"，则使用 `m.group(2)`。\n\n那么，让我们回到 `scrubName`\
  \ 函数。如果找到匹配项，你想要返回整个字符串。你可以使用 group 0 来检索完整匹配。如果未找到匹配项，则返回 `None`。\n\n#### 第 7 步：将函数应用于列以清洗姓名\n\
  \n使用以下代码进行原地更新：\n\n```\ndf[\"Name\"] = df.Name.apply(scrubName)\n```\n\n`Name` 字段的\
  \ `apply()` 方法用于将 `scrubName` 函数应用于 `Name` 字段。\n\n#### 第 8 步：将脚本复制到 Power BI\n\n\
  在最后一步中，你将整个脚本复制并粘贴到 *获取数据* 中的 Python 脚本编辑器中。以下是完整的脚本：\n\n```\nimport pandas as pd\n\
  import re\nimport os\nos.chdir(r\"\")\ndf = pd.read_csv(\"DimEmployee.csv\")\nnamepattern\
  \ = \\\nr'([A-Z][a-z]{1,10}\\s[a-zA-Z]\\s[A-Z][a-z]{1,10})|' \\\nr'([A-Z][a-z]{1,10}\\\
  s[A-Z][a-z]{1,10})'\nnameWithOrWithoutMiddleInitial = re.compile(namepattern)\n\
  def scrubName(name):\n    m = nameWithOrWithoutMiddleInitial.fullmatch(name)\n \
  \   if m:\n        return m.group(0)\n    else:\n        return None\ndf[\"Name\"\
  ] = df.Name.apply(scrubName)\n```\n\n生成的数据框将可供 Power BI 数据模型使用。\n\n\n\n"
- "# 基于条件逻辑识别字符串中的模式\n\n大多数字符串解析函数都可以通过 Power Query 的原生功能相对轻松地处理。但当你的字符串解析基于条件逻辑时，代码可能会变得冗长且难以理解。幸运的是，许多需要基于条件逻辑进行字符串解析的情况，可以通过\
  \ R 和 Python 中的正则表达式更简洁地处理。让我们通过虚构公司 MC Diesel 如何利用基于条件业务逻辑的正则表达式解析字符串来解决业务问题的例子来说明这一点。\n\
  \nRodney 是 MC Diesel 的执行董事。他知道 MC Diesel 过去在制造的两个零件上出现过问题。这两个零件是燃油泵（零件号 #561769）和燃油喷射器（零件号\
  \ #561394）。问题集中在 AL、LA 和 OH 的工厂，并且只发生在 A 型和 B 型中。\n\nRodney 委托他的数据科学家 Annie Su 开发一个具有向下钻取功能的仪表板，以帮助他进一步诊断和监控问题。Annie\
  \ 能够获得的唯一数据是一份报告，其中包含表 7-1 中列出的信息。\n\n表 7-1\n\n零件报告\n\n| 日期键 | SKU | 班次 | 门店 ID\
  \ | 已召回 |\n| --- | --- | --- | --- | --- |\n| 20190813 | 75197726D3 | 3 | 263 |\
  \ 否 |\n| 20191211 | 70136522D1 | 1 | 221 | 否 |\n| 20190401 | 70195609A3 | 3 | 92\
  \ | 否 |\n| 20191228 | 75102709B1 | 1 | 91 | 否 |\n| 20190304 | 70162016C3 | 3 | 161\
  \ | 是 |\n| 20191218 | 70136526D2 | 2 | 263 | 否 |\n| 20190322 | 70162029D1 | 1 |\
  \ 291 | 否 |\n| 20191012 | 70136539C2 | 2 | 395 | 否 |\n| 20190318 | 56176926B2 |\
  \ 2 | 262 | 否 |\n\n报告似乎不包含任何标识仓库位置或零件号的信息，而这些信息是分析所必需的。Annie 非常聪明，她记得 SKU 编号并非随意数字。她知道编号的每个部分都有含义。她知道前六位数字代表零件号，第\
  \ 7 和第 8 位数字是产品制造仓库所在州的 FIPS 代码，第 9 位的字符代表型号，第 10 位的数字代表产品制造的班次。因此，一个 SKU 为 `56176922A2`\
  \ 的物品代表以下含义：\n\n-   燃油泵，因为前六位数字 `561769` 是燃油泵的产品编号\n-   在路易斯安那州制造，因为第 7 和第 8 位数字\
  \ `22` 是路易斯安那州的 FIPS 代码\n-   型号类型为 A，因为第 9 位的字符是 \"A\"\n-   在第二班次制造，因为第 10 位的数字是\
  \ 2\n\nAnnie 需要创建一个计算列，在满足以下条件时从 SKU 中返回*零件号*：\n\n-   是在 AL、LA 或 OH 制造的型号为 A 或 B\
  \ 的燃油泵。\n-   是在 AL、LA 或 OH 制造的型号为 A 或 B 的燃油喷射器。\n\n如果她使用 Power Query 执行此任务，生成的代码将非常冗长，但使用\
  \ R 或 Python 则会简洁得多。以下步骤说明了 Annie 如何使用 R 创建解决方案。\n\n## 在 Power BI 中使用 R 基于条件逻辑识别字符串中的模式\n\
  \n我们将利用正则表达式，根据之前定义的条件来匹配产品。此示例将说明我们能够多么简洁地描述查找所需 SKU 所需的逻辑。如果必须使用 M 代码，同样的条件在 Power\
  \ Query 中会非常冗长。让我们逐步了解这些步骤。\n\n### 步骤 1：导入 tidyverse 和 stringr 包\n\n第一步是导入所需的包。`tidyverse`\
  \ 中的 `readr` 用于将 `ProductionOrders.csv` 文件的内容读入 R 数据框。`dplyr` 包用于处理数据框操作任务，`stringr`\
  \ 包用于处理字符串操作任务。以下是导入上述包的代码：\n\n```\nlibrary(tidyverse)\nlibrary(stringr)\n```\n\n\
  #### 步骤 2：更改工作目录\n\n使用 `setwd()` 函数将工作目录更改为包含 `ProductionOrders.csv` 文件的路径，如下代码所示：\n\
  \n```\nsetwd(\"\")\n```\n\n### 步骤 3：创建识别产品的函数\n\n处理此任务的函数名为 `monitoredProducts`。以下是创建该函数的步骤：\n\
  \n1.  使用以下代码创建函数外壳：\n\n    ```\n    monitoredProducts <- function(sku){\n    }\n\
  \    ```\n\n    `monitoredProducts` 函数只需要一个参数 `sku.number`。\n\n2.  接下来，您需要定义一个正则表达式，用于查找在\
  \ AL、LA 或 OH 制造且型号为 A 或 B 的所有燃油泵 (`561769`) 和燃油喷射器 (`561394`)。您还希望仅返回 SKU 的产品编号部分，而不是整个\
  \ SKU 编号。您可以通过在正则表达式中使用*正向先行断言*来实现这一点。\n\n    网站 [`www.rexegg.com`](http://www.rexegg.com)\
  \ 指出，正向先行断言断言字符串中当前位置之后的内容正是您要查找的模式。让我们查看此脚本中的正则表达式并分解该语句的含义。以下是相关的正则表达式：\n\n  \
  \  ```\n    pattern = \"^(561769|561394)(?=(01|22|39)(A|B))\n    ```\n\n    上述正则表达式的正向先行断言部分是\
  \ `(?=(01|22|39)(A|B))`。正向先行断言的结构是一个以 `?=` 开头的括号分组正则表达式。`?=` 之后的模式是必须位于前一个模式之后才能使匹配通过的模式。\n\
  \n    因此，`pattern` 变量中定义的正则表达式将在 SKU 编号中找到匹配项，如果它：\n    -   以 `561769` 或 `561394`\
  \ 开头\n    -   前面是 AL、LA 或 OH 的州 FIPS 代码\n    -   型号类型为 A 或 B\n\n    当您在步骤 5 的函数中使用它时，这将更有意义。\n\
  \n3.  在此步骤中，您使用以下代码提取与正则表达式模式匹配的 SKU 部分：\n\n    ```\n    mp = str_extract(sku, pattern\
  \ = pattern)\n    ```\n\n4.  该代码使用 `str_extract()` 函数提取与您在步骤 2 中定义的正则表达式匹配的字符串。如果匹配，它将仅返回字符串的产品代码部分。让我们通过一个例子来说明它是如何工作的。如果您将\
  \ `56176939A2` 传递给上述函数，R 将返回 `561769`。这是因为该字符串不仅通过了第一个条件（以 `561769` 开头），而且还通过了正向先行断言测试，因为字符串的第\
  \ 7-8 位是 `39`，这是可接受的州 FIPS 代码之一，并且第 9 位是 `A`，这是可接受的型号之一。相反，`56176910D2` 返回 `NA`，因为正向先行断言失败。州\
  \ FIPS 代码 `10` 不是您要查找的 FIPS 代码之一。型号也是如此，因为型号 D 不是您要查找的型号。\n\n### 步骤 4：将 ProductionOrders.csv\
  \ 文件中的数据读入 R 数据框\n\n使用 `readr` 包，通过以下代码将 `ProductionOrders.csv` 文件的内容读入 R 并存储在 `df`\
  \ 变量中：\n\n```\ndf <- read_csv(\"ProductionOrders.csv\")\n```\n\n### 步骤 5：向 df 添加名为“受监控产品”的列\n\
  \n接下来，您编写代码，使用 dplyr 包中的 `mutate()` 函数执行一个简单的工作流程：向数据框添加一个名为 `Monitored Products`\
  \ 的新列。以下是执行该操作所需的代码：\n\n```\ndf %\nmutate(`Monitored Products` = monitoredProducts(SKU))\n\
  ```\n\n上述代码使用 dplyr 中的 `mutate()` 动词创建 `Monitored Products` 列，该列基于将自定义函数 `monitoredProducts()`\
  \ 应用于 SKU 列的结果。\n\n\n\n### 步骤 6：将脚本复制到 Power BI\n\n以下是完整的脚本：\n\n```\nlibrary(tidyverse)\n\
  library(stringr)\nsetwd(\"\")\nmonitoredProducts <- function(SKU) {\n  str_detect(SKU,\
  \ \"^(561769|561394)(?=(01|22|39)(A|B)\\\\d{1}$)\")\n}\ndf <- monitoredProducts\
  \ %>%\n  mutate(`Monitored Products` = vmonitoredProducts(SKU))\n```\n\n此脚本创建了一个名为\
  \ `df` 的数据框，可通过 `GetData` 中的 `R script` 编辑器将其添加到 Power BI 数据模型中。\n\n### 在 Power\
  \ BI 中使用 Python 基于条件逻辑识别字符串模式\n\n在本节中，我们将使用 Python 完成刚才在 R 中执行的任务。与 R 示例类似，主要工具仍是正则表达式。你将在此示例中看到，Python\
  \ 中正则表达式的实现方式与 R 不同。以下是在 Python 中执行该任务所需的步骤。\n\n#### 步骤 1：导入 pandas、re 和 os 库\n\n\
  此脚本中使用的三个库是 `pandas`、`re` 和 `os`。`pandas` 包用于将数据读入脚本，并用于向数据框添加新列。`re` 包用于利用正则表达式，而\
  \ `os` 包用于文件系统任务。用于执行导入的代码如下所示：\n\n```\nimport pandas as pd\nimport re\nimport os\n\
  ```\n\n#### 步骤 2：更改工作目录\n\n接下来，你需要使用 `os` 中的 `chdir()` 函数，将工作目录更改为计算机上 `ProductionOrders.csv`\
  \ 文件所在的位置。以下代码片段展示了代码的样式：\n\n```\nos.chdir(\"\")\n```\n\n#### 步骤 3：编译所需的正则表达式\n\n\
  接下来，你需要定义一个正则表达式，用于查找所有在 AL、LA 或 OH 创建且型号为 A 或 B 的燃油泵（561769）和喷油器（561394）。你还希望仅返回\
  \ SKU 的产品编号部分，而非整个 SKU 编号。你可以通过使用*正向先行断言*在正则表达式中实现这一点。\n\n网站 [`www.rexegg.com`](http://www.rexegg.com)\
  \ 指出，正向先行断言断言字符串中当前位置之后的内容正是你要查找的模式。让我们查看此脚本中的正则表达式，以分解该语句的含义。以下是使用*正向先行断言*的相关正则表达式：\n\
  \n```\npattern = \"^(561769|561394)(?=(01|22|39)(A|B))\n```\n\n上述正则表达式的正向先行断言部分是\
  \ `(?=(01|22|39)(A|B))`。正向先行断言的结构是一个用括号分组并以 `?=` 开头的正则表达式。`?=` 之后的模式是必须跟在前面模式之后才能使匹配通过的模式。\n\
  \n因此，`pattern` 变量中标识的正则表达式在满足以下条件时将通过：\n\n*   以 561769 或 561394 开头\n*   前面是 AL、LA\
  \ 或 OH 的州 FIPS 代码\n*   型号为 A 或 B\n\n当你在步骤 5 的函数中使用它时，这一点会更加清晰。定义正则表达式后，你通过使用 `re`\
  \ 包中的 `compile()` 函数编译它，创建一个名为 `pattern` 的正则表达式对象。这一切通过以下代码完成：\n\n```\npattern =\
  \ re.compile(r\"^(561769|561394)(?=(01|22|39)(A|B)\\d{1}$)\")\n```\n\n#### 步骤 4：定义返回受监控产品的函数\n\
  \n你将创建的用于识别受监控产品的自定义函数名为 `monitoredProducts`。以下是创建该函数的步骤：\n\n1.  首先，你需要创建接受 SKU\
  \ 作为其唯一参数的函数外壳。你可以使用以下代码实现：\n\n    ```\n    def monitoredProducts(sku):\n    ```\n\
  \n2.  接下来，你尝试使用之前定义的 pattern 对象创建一个匹配对象，使用以下代码：\n\n    ```\n    m = pattern.match(sku)\n\
  \    ```\n\n    如果传递给它的 SKU 与 `pattern` 对象中编译的正则表达式匹配，则返回一个匹配组。如果传递给它的 SKU 未通过测试，则返回\
  \ `None`，这是 Python 中 null 的等价物。\n\n3.  接下来，如果存在匹配，你从传递给步骤 2 中匹配函数的 SKU 编号中提取模式。你可以使用以下代码实现：\n\
  \n    ```\n    if m == True:\n    return m.group(0)\n    else:\n    return \"Not\
  \ Monitored\"\n    ```\n\n    如步骤 2 所述，当步骤 2 中的代码找到匹配时，会返回一个布尔值为 `True` 的匹配对象。否则，返回关键字\
  \ `None`。上述 `if` 语句用于检查是否返回了匹配对象。如果返回了，则获取位置 0 的组，该组代表完整匹配。如果未返回，则函数返回“Not Monitored”。\n\
  \n#### 步骤 5：将数据读入 Pandas 数据框\n\n在此步骤中，你使用以下代码将 `ProductionOrders.csv` 的内容读入名为 `df`\
  \ 的数据框：\n\n```\ndf = pd.read_csv(\"ProductionOrders.csv\")\n```\n\n#### 步骤 6：创建一个名为“Monitored\
  \ Products”的新列\n\n在此步骤中，你使用以下代码添加一个名为 `Monitored Products` 的列：\n\n```\ndf[\"Monitored\
  \ Products\"] = df[\"SKU\"].apply(monitoredProducts)\n```\n\n上述代码将你创建的 `monitoredProducts()`\
  \ 自定义函数应用于 SKU 列，并将结果分配给名为 `Monitored Products` 的新列。\n\n#### 步骤 7：将脚本复制到 Power BI\n\
  \n以下是完整的脚本：\n\n```\nimport pandas as pd\nimport re\nimport os\nos.chdir(\"\")\n\
  pattern = re.compile(r\"^(561769|561394)(?=(01|22|39)(A|B)\\d{1}$)\")\ndef monitoredProducts(sku):\n\
  m = pattern.match(sku)\nif m == True:\nreturn m.group(0)\nelse:\nreturn \"Not Monitored\"\
  \ndf = pd.read_csv(\"ProductionOrders.csv\")\ndf[\"Monitored Products\"] = df[\"\
  sku\"].apply(monitoredProducts)\n```\n\n复制上述脚本，并通过 Power BI 中的 `GetData` 将其粘贴到 `Python\
  \ editor` 中，以便将其添加到 Power BI 数据模型中。\n\n## 总结\n\n在本章中，我们介绍了通过 R 和 Python 在 Power\
  \ BI 中可用的几种不同字符串操作方法。所涵盖的示例可能不会直接与你数据整理任务中遇到的情况相关，但我相信通过对代码进行少量修改，你可以找到将其中一些技术应用于你实际情况的方法。\n\
  \n\n\n"
- "# 8. 使用 R 和 Python 创建计算列\n\n在 Power Query 中，一项困难的任务是添加基于复杂数学公式的计算列。但在 R 或 Python\
  \ 中，这个问题并不存在。R 由统计学家构建，因此它被设计用于执行复杂的统计和数学计算。Python 也是如此。Python 不仅用于数据科学，还用于其他计算密集型领域，如工程和物理学。与\
  \ R 类似，Python 经过优化，能够执行在 Power Query 中使用 M 语言无法实现的计算。因此，当您需要在 Power BI 中基于复杂计算添加计算列时，应考虑利用\
  \ R 或 Python。您不仅会受益于 R 和 Python 能更好地处理复杂计算这一事实，而且在许多情况下，您可能会发现 R 和/或 Python 拥有一个预构建的函数，可以为您完成繁重的工作。\n\
  \n让我们用一个场景来说明这一点。假设您是 Gee's Trucking, Inc. 的高级分析师。Gee's Trucking, Inc. 最近收购了另一家卡车运输公司，现在他们拥有超过\
  \ 100 名司机，在印第安纳州印第安纳波利斯市区的三个枢纽站工作。\n\n老板 Gee Troll 想要计算每位员工上班的通勤距离，以估算平均通勤距离。最终，他想知道如果他的司机更换枢纽站，是否有人可以缩短通勤距离。您知道，您可以使用大学学到的*哈弗辛*公式轻松估算两个地理位置之间的距离。\n\
  \n*哈弗辛*公式可用于根据两点的经度和纬度估算地球表面两点之间的距离。该公式之所以有效，是因为地球的形状类似于球体。\n\n您向经理提出了四种解决方案：两种使用\
  \ R，两种使用 Python。两种 R 解决方案包括一个自定义解决方案和一个利用预构建函数的解决方案。Python 的两种解决方案也是如此。所有四种解决方案都需要对地址进行地理编码。\n\
  \n地理编码是将地址转换为由纬度和经度值组成的地理坐标的过程。纬度测量一个地理位置距离赤道有多北或多南，经度测量一个地理位置距离本初子午线有多东或多西。\n\n\
  以下是该过程的基本步骤：\n\n1.  生成一个 Google API 密钥，用于与 *Google Geocoding API* 通信。\n2.  在 R 和\
  \ Python 中使用 *Google Geocoding API* 对地址进行地理编码。\n3.  使用 R 和 Python 中的自定义函数计算每位员工家庭地址与其工作枢纽站之间的距离。\n\
  4.  使用 R 和 Python 中的预构建函数计算每位员工家庭地址与其工作枢纽站之间的距离。\n\n让我们从生成您的 Google API 密钥开始。\n\n\
  ## 创建 Google Geocoding API 密钥\n\n### 步骤 1：登录 Google 控制台\n\n通过访问以下 URL 登录 Google\
  \ 控制台：[`https://console.cloud.google.com/`](https://console.cloud.google.com/)。如果您没有\
  \ Google 帐户，则需要创建一个；否则，您应该能够使用您的凭据登录控制台。\n\n### 步骤 2：设置结算帐户\n\n为了使用 Google API，您的帐户需要关联一种付款方式。在撰写本文时，Google\
  \ 提供 300 美元的赠金用于测试其 API，这足以完成此演示。如果您超出了免费分配的赠金额度，Google 将使用您提供的付款方式来确保付款。要设置您的付款方式，请按图\
  \ 8-1 所示，在菜单中选择 *导航菜单* ➤ *结算* ➤ *付款方式*。\n\n![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig1_HTML.jpg](img/480677_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n设置 Google 付款方式\n\n### 步骤 3：添加新项目\n\n接下来，您需要创建一个启用了地理编码的项目。执行以下菜单选择来创建项目：*导航菜单*\
  \ ➤ *IAM 与管理* ➤ *管理资源*。菜单选择如图 8-2 所示。\n\n![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig2_HTML.jpg](img/480677_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n导航至管理资源\n\n点击屏幕右上角的 *创建项目* 按钮，如图 8-3 所示。\n\n![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig3_HTML.jpg](img/480677_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n创建新的 Google 项目\n\n填写表单以创建项目。\n\n### 步骤 4：启用 Geocoding API\n\n执行以下步骤以在您的项目中启用地理编码：\n\
  \n1.  选择 *导航菜单* ➤ *API 和服务* ➤ *库*，如图 8-4 所示。\n\n    ![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig4_HTML.jpg](img/480677_1_En_8_Fig4_HTML.jpg)\n\
  \n    图 8-4\n\n    导航至库\n\n2.  在 *搜索 API 和服务* 文本框中搜索 *Geocoding API*，如图 8-5 所示。\n\
  \n    ![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig5_HTML.jpg](img/480677_1_En_8_Fig5_HTML.jpg)\n\
  \n    图 8-5\n\n    搜索 Geocoding API\n\n3.  点击 *启用* 按钮启用 *Geocoding API*。\n\n4. \
  \ 通过执行以下步骤创建凭据：\n    *   在菜单栏中选择 *导航菜单* ➤ *API 和服务* ➤ *凭据*。\n    *   点击 *创建凭据* 并选择\
  \ *API 密钥*，如图 8-6 所示。\n\n      ![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig6_HTML.jpg](img/480677_1_En_8_Fig6_HTML.jpg)\n\
  \n      图 8-6\n\n      生成 API 密钥\n\n    *   应该会出现一个 API 密钥，并且您会收到限制该 API 密钥的选项。您希望对\
  \ API 密钥添加限制，以帮助防止未经授权的使用。点击 *限制密钥* 来设置您的限制。您将看到图 8-7 中的 Web 表单。对于此练习，我建议仅接受来自您\
  \ IP 地址的请求，并将密钥限制为仅用于 *Geocoding API*。您可以使用图 8-7 中的配置来完成此操作。完成配置后，点击 *保存* 按钮进行保存。\n\
  \n      ![../images/480677_1_En_8_Chapter/480677_1_En_8_Fig7_HTML.jpg](img/480677_1_En_8_Fig7_HTML.jpg)\n\
  \n      图 8-7\n\n      配置 API 限制\n\n5.  现在您已拥有一个配置了限制的 API 密钥。将您的密钥保存在安全的地方。如果您丢失了它，可以返回\
  \ Google 控制台获取您的 API 密钥副本。\n\n\n\n## 使用 R 对地址进行地理编码\n\n现在你已经配置好 Google API 密钥，可以使用\
  \ R 来调用该 API，对 `EmployeeList.csv` 文件中的地址进行地理编码。地理编码过程会将每个地址转换为一个坐标点，该坐标点由 `经度` 和\
  \ `纬度` 值定义，代表地球上的一个位置。`经度` 值表示你位于 `本初子午线` 以东或以西多远，而 `纬度` 值表示你位于 `赤道` 以北或以南多远。将地址转换为这种格式，使得执行\
  \ `空间分析` 成为可能。在本练习中，你将执行的空间分析类型是估算两个地址之间的距离。清单 8-1 中的脚本展示了如何通过利用 `Google API` 在\
  \ R 中对地址进行地理编码。\n\n```\nlibrary(tidyverse)\nlibrary(ggmap)\nregister_google(key\
  \ = \"\")\nsetwd(\"\")\nEmployeeList <- read_csv(\"EmployeeList.csv\")\nEmployeeList\
  \ <- EmployeeList %>% \n  mutate_geocode(EmployeeAddress, sensor = FALSE) %>%\n\
  \  rename(lon_EmployeeAddress = lon, lat_EmployeeAddress = lat) %>%\n  mutate_geocode(TerminalAddress,\
  \ sensor = FALSE) %>%\n  rename(lon_TerminalAddress = lon, lat_TerminalAddress =\
  \ lat)\nwrite_csv(EmployeeList, \"EmployeeList.csv\")\n清单 8-1\n使用 R 通过 Google API\
  \ 对地址进行地理编码\n```\n\n在本书的这个阶段，你已经对 R 有了相当不错的理解，因此我不会像本书早期那样对解释过于详尽。以下是对脚本按逻辑步骤进行的简洁说明：\n\
  \n1. 首先导入所需的包。本脚本引入了一个新包 `ggmap`。`ggmap` 包的主要用途是可视化空间数据，但在这里你将用它来对地址进行地理编码。\n\n\
  2. 你使用 Google 地理编码 API 服务来对地址进行地理编码。为此，你需要使用 `register_google()` 函数注册你的 API 密钥。\n\
  \n3. 接下来，你读取 `Employee.csv` 文件。\n\n4. 接着，你使用 `dplyr` 和来自 `ggmap` 的 `mutate_geocode()`\
  \ 动词，将地理编码信息添加到你的数据集中。与 `dplyr` 中的 `mutate()` 动词类似，`mutate_geocode()` 用于向数据框添加或投影新列。`mutate_geocode()`\
  \ 专门用于添加传递给它的地址的坐标。它会添加一个名为 `lon` 的列（包含传递给它的地址的经度）和一个名为 `lat` 的列（包含传递给它的地址的纬度）。\n\
  \n5. 然后，你使用 `dplyr` 中的 `rename()` 动词为 `lon` 和 `lat` 列赋予更有意义的名称。\n\n   使用 `dplyr`\
  \ 重命名列有两种选择：`rename()` 和 `select()`。`rename()` 与 `select()` 的不同之处在于，`rename()` 会保留数据集中的所有其他列，而不仅仅是正在重命名的列；而\
  \ `select()` 只保留你在 select 动词中指定的列，无论这些列是你正在重命名的列，还是你从数据框中选择的列。\n\n6. 你对 `TerminalAddress`\
  \ 重复步骤 4 和 5。\n\n在本练习中，你能够通过 R 与 `Google API` 通信，对地址进行地理编码。当你不处于高级容量时，使用 Power Query\
  \ 进行 API 调用并不容易。如果你使用的是 `Power BI Premium`，你可以选择使用 `Microsoft 认知服务`，但也仅此而已。使用 R\
  \ 和 Python，则没有这个限制。在这个例子中，我们使用了 `Google API` 来对地址进行地理编码，但在本书后面，我们将展示如何利用其他 API，例如\
  \ `IBM Watson 自然语言理解`。在下一节中，你将学习如何在 Python 中对地址进行地理编码。\n\n## 使用 Python 对地址进行地理编码\n\
  \n在上一节中，你通过 R 使用 `Google API` 对地址进行了地理编码。在本节中，你将使用 Python 完成同样的操作。如上一节所述，在 Power\
  \ Query 中使用 API 要困难得多，除非你使用的是相对昂贵的 `Power BI Premium`。以下清单 8-2 中的脚本展示了如何通过利用 `Google\
  \ API` 在 Python 中对地址进行地理编码。\n\n```\nimport pandas as pd\nimport os\nfrom geopy import\
  \ geocoders\ng_api_key = \"\"\ng = geocoders.GoogleV3(g_api_key)\nos.chdir(\"\"\
  )\nEmployeeList = pd.read_csv(\"EmployeeList.csv\")\nEmployeeList[\"EmployeeAddressGC\"\
  ] = \\\nEmployeeList[\"EmployeeAddress\"].apply(g.geocode)\nEmployeeList[\"lat_EmployeeAddress\"\
  ] = \\\nEmployeeList[\"EmployeeAddressGC\"].apply(lambda x: x.latitude)\nEmployeeList[\"\
  lon_EmployeeAddress\"] = \\\nEmployeeList[\"EmployeeAddressGC\"].apply(lambda x:\
  \ x.longitude)\nEmployeeList[\"TerminalAddressGC\"] = \\\nEmployeeList[\"TerminalAddress\"\
  ].apply(g.geocode)\nEmployeeList[\"lat_TerminalAddressGC\"] = \\\nEmployeeList[\"\
  TerminalAddressGC\"].apply(lambda x: x.latitude)\nEmployeeList[\"lon_TerminalAddress\"\
  ] = \\\nEmployeeList[\"TerminalAddressGC\"].apply(lambda x: x.longitude)\ncols =\
  \ [\"EmployeeAddressGC\", \"TerminalAddressGC\"]\nEmployeeList.drop(cols, inplace=True)\n\
  EmployeeList.to_csv(\"EmployeeList.csv\", index = False)\n清单 8-2\n使用 Python 通过 Google\
  \ API 对地址进行地理编码\n```\n\n由于在本书的这个阶段，你应该已经对 Python 有了很好的理解，因此代码解释不会像本书早期那样冗长。以下是对上述\
  \ Python 脚本按逻辑步骤进行的说明：\n\n1. 首先导入所需的库。本脚本中使用的新模块是来自 `geopy` 库的 `geocoders` 模块。该模块用于处理地理编码。\n\
  \n2. 接下来，你创建一个基于 `Google API` 类 `GoogleV3` 的对象 `g`。该对象将用于查询 `GoogleV3` API 类，以对地址进行地理编码。\n\
  \n3. 然后，你读取 `Employee.csv` 文件。\n\n4. 数据集中包含两个需要地理编码的地址：`EmployeeAddress` 地址和 `TerminalAddress`\
  \ 地址。首先，通过使用 `EmployeeAddress` 列的 `apply` 方法，应用对象 `g` 的 `geocode` 函数，对 `EmployeeAddress`\
  \ 进行地理编码，代码如下：\n\n```\n    EmployeeList[\"EmployeeAddressGC\"] = EmployeeList[\"\
  EmployeeAddress\"].apply(g.geocode)\n```\n\n上述代码行创建了一个 `location.Location` 对象，其中包含你需要的地理编码信息以及其他内容。该对象存储在\
  \ `EmployeeList[\"EmployeeAddressGC\"]` 字段中。你将在后续步骤中从该对象中提取信息。\n\n5. 接下来，通过从步骤 4\
  \ 中创建的 `EmployeeAddressGC` 列提取信息，创建 `lat_EmployeeAddress` 列。如前所述，如果 Google 成功对你发送的地址进行了地理编码，Google\
  \ 将向你发送一个包含地址、纬度和经度的 `location.Location` 对象。你感兴趣的是纬度和经度。你可以通过对 `EmployeeAddressGC`\
  \ 字段应用 `lambda` 函数，从 `location.Location` 中提取这些信息。\n\n   `lambda` 函数是一个只有单个表达式的匿名函数。它们通过关键字\
  \ `lambda` 标识，后跟参数，再后跟表达式，如下所示：`lambda arguments: <expression>`。它们提供了一种简洁的方式，将函数应用于\
  \ `pandas` 数据框。\n\n   使用以下 lambda 函数从 `EmployeeAddressGC` 中提取纬度：`lambda x: x.latitude`。lambda\
  \ 函数中的 `x` 代表 `EmployeeAddressGC` 字段。代码 `x.latitude` 使你能够访问 `x` 中的纬度属性。\n\n6. 接下来，使用与步骤\
  \ 5 相同的步骤创建 `lon_EmployeeAddress` 列，但将纬度替换为经度。\n\n\n\n7. 接下来，对`TerminalAddress`字段重复步骤\
  \ 4、5 和 6。\n\n8. 接下来，从数据框中移除不需要的列。你只需要`EmployeeAddressGC`和`TerminalAddressGC`来提取员工地址和终端地址的经纬度。这些字段不再需要，因此可以移除。一个简单的方法是使用`EmployeeList`数据框的`drop`方法。通过以下代码实现：\n\
  \n```\ncols = [\"EmployeeAddressGC\", \"TerminalAddressGC\"]\nEmployeeList.drop(cols,\
  \ inplace=True)\n```\n\n`cols`变量包含要删除的列列表。默认情况下，`drop`方法不会直接作用于数据框。如果你希望它直接作用于数据框并永久删除指定列，需要将`inplace`参数设置为`True`。\n\
  \n在本练习中，你通过 Python 与 Google API 通信，对地址进行了地理编码。你能够在 Python 中相对轻松地完成一项在 Power Query\
  \ 中会困难得多的任务。在下一节中，你将学习如何使用 R 构建的自定义函数，利用地理编码信息估算以英里为单位的距离。\n\n## 使用 R 中的自定义函数计算距离\n\
  \n在之前的练习中，你设置了地理编码 API 并对地址进行了地理编码。现在数据已处于合适的格式，可以计算距离了。清单 8-3 是 R 脚本，用于计算员工地址与其终端之间的英里距离。\n\
  \n```\nlibrary(tidyverse)\nComputeDist \")\nEmployeeList %>%\nmutate(\n`Custom Distance\
  \ Function Results` =\nround(\nComputeDist(\nlon_EmployeeAddress,\nlat_EmployeeAddress,\n\
  lon_TerminalAddress,\nlat_TerminalAddress\n),1\n)\n)\nListing 8-3\nCalculating distance\
  \ in R using a custom function\n```\n\n该代码分解为以下逻辑步骤：\n\n1. 首先，需要加载所需的包。此脚本中唯一需要的是`tidyverse`元包，因为所需的大部分功能已包含在基础\
  \ R 中。\n\n2. 接下来，创建一个名为`ComputeDist`的自定义函数来计算距离。`ComputeDist`自定义函数需要四个参数：分别是员工地址和终端地址的纬度和经度。\n\
  \n   注意计算过程相当复杂。在 Power Query 中使用 M 语言进行此类数学运算会更加困难，且性能不如 R。我不会解释此计算的工作原理，因为它超出了本书的范围。此示例的目的是展示\
  \ R 在执行密集型数学计算方面比 M 更出色。\n\n3. 接下来，加载`EmployeeList.csv`文件。\n\n4. 接下来，使用`dplyr`中的`mutate()`动词向`EmployeeList`数据框添加一个名为`Custom\
  \ Distance Function Results`的新列。使用名称`Custom Distance Function Results`是为了明确表明使用了自定义函数来计算距离。将所需的四个参数传递给函数，并使用`round()`函数将返回值四舍五入到一位小数。\n\
  \n5. 最后要做的是复制整个脚本，并通过`GetData`中的 R 脚本编辑器将其添加到 Power BI 数据模型中。\n\n在本练习中，你通过五个简单的步骤，基于自定义函数创建了一个计算列。使用自定义函数的好处在于，你能够将执行计算所需的数学复杂性抽象到自定义函数中，并在需要时调用它。这样得到的代码更易读且更易于维护。\n\
  \n## 使用 Python 中的自定义函数计算距离\n\n在之前的步骤中，你使用 Google 地理编码 API 对地址进行了地理编码。现在数据已处于合适的格式，可以计算距离了。清单\
  \ 8-4 是 Python 脚本，用于估算员工地址与其终端之间的英里距离。\n\n```\nimport pandas as pd\nimport numpy\
  \ as np\nimport os\nfrom math import cos, sin, atan2, pi, sqrt, pow\ndef ComputeDist(row):\n\
  R = 6371 / 1.609344 #radius in mile\ndelta_lat = row[\"lat_TerminalAddressGC\"]\
  \ -\nrow[\"lat_EmployeeAddress\"]\ndelta_lon = row[\"lon_TerminalAddress\"] -\n\
  row[\"lon_EmployeeAddress\"]\ndegrees_to_radians = pi / 180.0\na1 = sin(delta_lat\
  \ / 2 * degrees_to_radians)\na2 = pow(a1,2)\na3 = cos(row[\"lat_EmployeeAddress\"\
  ] * degrees_to_radians)\na4 = cos(row[\"lat_TerminalAddress\"] * degrees_to_radians)\n\
  a5 = sin(delta_lon / 2 * degrees_to_radians)\na6 = pow(a5,2)\na = a2 + a3 * a4 *\
  \ a6\nc = 2 * atan2(sqrt(a), sqrt(1 - a))\nd = R * c\nreturn d\nos.chdir(\"\")\n\
  EmployeeList = pd.read_csv(\"EmployeeList_Python.csv\")\nEmployeeList[\"Custom Function\"\
  ] = \\\nEmployeeList.apply(lambda row: ComputeDist(row), axis=1)\nListing 8-4\n\
  Calculating distance in Python using a custom function\n```\n\n让我们将上述代码分解为逻辑步骤：\n\
  \n1. 首先，需要加载所需的库。此脚本中新增的是来自`math`库的一些函数。这些函数用于计算距离。\n\n2. 接下来，创建一个名为`ComputeDist()`的自定义函数，用于估算两个地理点之间的英里距离。该函数需要一个参数，即数据框中的整行。你将从中提取执行计算所需的信息。计算过程非常复杂，在\
  \ Power Query 中使用 M 语言进行此类数学运算会更加困难，且性能不如 Python。我不会解释此计算的工作原理，因为它超出了本书的范围。目的是展示\
  \ Python 在执行密集型数学计算方面比 M 更出色。\n\n3. 接下来，加载`EmployeeList.csv`文件。\n\n4. 接下来，使用`apply`方法在`EmployeeList`数据框上应用一个`lambda`函数。完整的代码行如下：\n\
  \n```\nEmployeeList[\"Custom Function\"] = (\nEmployeeList.apply(lambda row: ComputeDist(row),\
  \ axis=1))\n```\n\n上述代码中使用括号可以让你在后续行继续编写代码，使代码更易读。后续行必须遵循`PEP8`中定义的缩进规则。`PEP8`概述了格式化\
  \ Python 代码的规则。你可以通过此 URL 了解更多关于`PEP8`的信息：[`https://realpython.com/python-pep8/`](https://realpython.com/python-pep8/)。\n\
  \n你在本章前面已经接触过`lambda`函数。之前使用的`lambda`函数应用于数据框中的特定列，但此示例中的`lambda`函数应用于整个数据框。当你将`lambda`函数应用于数据框时，你可以选择告诉\
  \ pandas 是将其应用于`0 轴`还是`1 轴`。如果应用于`0 轴`，则`lambda`函数将从上到下应用；但如果应用于`1 轴`，则从左到右应用。让我们通过一个示例来简化说明。\n\
  \n让我们用下面的代码创建一个小的数据框，以说明如何将`lambda`函数应用于数据框：\n\n```\ndf = pd.DataFrame((\n{'A':[10,\
  \ 20, 30], 'B':[15, 5, 10]}))\n```\n\n上述代码生成以下数据框：\n\n|   | **A** | **B** |\n|---|-------|-------|\n\
  | 0 | 10    | 15    |\n| 1 | 20    | 5     |\n| 2 | 30    | 10    |\n\n如果你想获取每列的总和，需要沿着`0\
  \ 轴`操作，以便从上到下进行。使用以下代码实现：\n\n```\ndf.apply(sum, axis = 0)\n```\n\n该代码产生以下输出：\n\n\
  | A | 60 |\n|---|----|\n| B | 30 |\n\n\n\n通过将`axis`设置为`0`，代码将沿每一列“自上而下”工作，并对每一列中的所有元素求和。如果将`axis`设置为`1`，它将从左到右对每一行工作，并对每一行中的所有元素求和。因此，如果将`axis`更改为`1`，如下代码所示：\n\
  \n```\ndf.apply(sum, axis = 1)\n```\n\n将产生以下输出：\n\n|   | 0  | 1  | 2  |\n|---|----|----|----|\n\
  | 0 | 25 | 25 | 40 |\n\n现在您已经理解了`lambda`函数在应用于数据帧时的工作原理。让我们回顾一下原始脚本中这一步的代码。代码如下：\n\
  \n```\nEmployeeList[\"Custom Function\"] = (\n    EmployeeList.apply(lambda row:\
  \ ComputeDist(row),\n    axis=1))\n```\n\n上述代码将`lambda`函数应用于`1`轴。换句话说，它从左到右对每一行工作。整行被传递给`ComputeDist()`函数。`ComputeDist()`函数从传递给它的行对象中提取计算所需的信息。请注意，当您对数据帧使用`apply`方法时，并不局限于聚合函数。\n\
  \n5. 将上述清单 8-4 中的脚本复制到 Power BI 的*Python 脚本编辑器*（位于*获取数据*中），以将脚本生成的数据帧添加到 Power BI\
  \ 数据模型中。\n\n与之前的 R 练习类似，您通过五个简单步骤，基于自定义函数创建了一个计算列。与 R 一样，当您在 Power BI 中使用 Python\
  \ 通过自定义函数创建计算列时，您能够获得代码更易读、更易维护的好处。\n\n## 在 Power BI 中使用 R 通过预构建函数计算距离\n\n在前两节中，您学习了如何在\
  \ R 和 Python 中开发自定义函数，以高效执行数学密集型计算。尽管实现一个数学密集型自定义函数并不困难，但通常存在更简单的解决方案。在撰写本文时，R 编程语言拥有超过\
  \ 15,000 个包，Python 编程语言拥有超过 110,000 个库。通常，您可以在 R 和 Python 各自提供的众多包和库中找到问题的解决方案。\n\
  \n计算两个地理点之间的距离就是这种情况。您无需在 R 代码或 Python 代码中重构数学公式，而是可以利用预构建的函数。在本练习中，您将学习如何利用 R 中的`geosphere`包来执行距离计算。您将使用的完整脚本见清单\
  \ 8-5。\n\n```\nlibrary(tidyverse)\nlibrary(geosphere)\nsetwd(\"\")\nEmployeeList\
  \ <- read_csv(\"EmployeeList.csv\")\nEmployeeList <- EmployeeList %>%\n  rowwise()\
  \ %>%\n  mutate(\n    `Geosphere Function Result` =\n      distHaversine(\n    \
  \    c(lon_EmployeeAddress, lat_EmployeeAddress),\n        c(lon_TerminalAddress,\
  \ lat_TerminalAddress)\n      ) / 1609.34\n  )\n```\n\n**清单 8-5** 使用 R 中的预构建函数计算距离\n\
  \n让我们将代码分解为逻辑步骤：\n\n1. 首先，加载所需的包。此脚本中的新包是`geosphere`包。您将利用此包执行空间计算。\n\n2. 接下来，将`EmployeeList.csv`文件的内容加载到`EmployeeList`数据帧中。\n\
  \n3. 接下来，向`EmployeeList`数据帧添加一个名为`Geosphere Function`的新列。您正在使用`dplyr`中的链式方法创建一个工作流，该工作流向数据帧添加一列，用于基于`distHaversine`函数计算距离。工作流的第一步告诉`dplyr`您从原始数据帧开始。工作流的第二步将数据帧传递给`rowwise()`函数。`rowwise()`函数是必需的，因为后续步骤中使用的`distHaversine()`函数不是向量化的。\n\
  \n    *向量化*函数同时作用于整个向量。数据帧中的列就是向量。当您对向量应用*向量化*函数时，无需实现循环逻辑。\n\n    `rowwise()`函数告诉工作流中的所有后续任务，在计算中仅考虑当前行中的元素。最后一步使用`geosphere`包中的`distHaversine()`函数执行计算。`distHaversine()`函数返回以米为单位的距离，因此将结果乘以`0.000621371`可将值转换为英里。\n\
  \n4. 与往常一样，您需要将清单 8-5 中的整个脚本复制到 Power BI 的 Python 编辑器中，以便将生成的数据集添加到 Power BI 数据模型中。\n\
  \n在本练习中，您能够利用`geosphere`包中的预构建函数，该函数为您抽象了计算的复杂性。所使用的函数是`distHaversine()`函数。您只需向该函数传递所需的参数，它就会为您执行计算。在下一个练习中，您将在\
  \ Python 中使用类似的功能。\n\n\n\n## 在 Power BI 中使用 Python 预置函数计算距离\n\n以下 Python 脚本（清单 8-6）使用预置函数来计算距离。\n\
  \n```python\nimport pandas as pd\nimport os\nfrom haversine import haversine\nos.chdir(r\"\
  \")\nEmployeeList = pd.read_csv(\"EmployeeList.csv\")\ndef useHaversine(row):\n\
  point_one = \\\n(row[\"lat_EmployeeAddress\"], row[\"lon_EmployeeAddress\"])\npoint_two\
  \ = \\\n(row[\"lat_TerminalAddress\"], row[\"lon_TerminalAddress\"])\nreturn haversine(point_one,\
  \ point_two, unit=\"mi\")\nEmployeeList[\"Haversine Function Result\"] = \\\nEmployeeList.apply(lambda\
  \ row: useHaversine(row), axis=1)\n```\n\n让我们将上述代码分解为逻辑步骤：\n\n1. 首先，你需要加载所需的库。本脚本中的新库是\
  \ `haversine` 库。该库用于执行空间计算。\n2. 接着，将 `EmployeeList.csv` 文件的内容加载到 `EmployeeList`\
  \ 数据框中。\n3. 然后，定义 `useHaversine()` 函数。该函数接受整行作为输入。使用你已经学过的方法，可以轻松地从传递给函数的行中提取信息。本例中的\
  \ `useHaversine()` 自定义函数使用 `haversine` 库中的 `haversine()` 函数来计算距离。你需要向 `haversine()`\
  \ 函数传递三个参数：`location_one` 的坐标、`location_two` 的坐标以及你希望距离使用的单位。`location_one` 和 `location_two`\
  \ 变量需要以 `tuple`（元组）的形式存在，元组的第一个元素是 `latitude`（纬度），第二个元素是 `longitude`（经度）。\n\n  \
  \ 将 `Haversine` 库中的 `Haversine()` 函数封装在 `useHaversine()` 自定义函数中的原因是，`Haversine()`\
  \ 函数并非向量化函数。如果 `Haversine()` 函数是向量化的，它就能并行处理数据框中的所有行，但由于它不是，它一次只能处理一行。这就是为什么需要将单行传递给\
  \ `useHaversine()` 函数。\n\n4. 接下来，使用以下代码创建一个名为 `Haversine Function Result` 的列，该列将包含员工地址与终端之间的距离：\n\
  \n   `EmployeeList[\"Haversine Function Result\"] = EmployeeList.apply(lambda row:\
  \ useHaversine(row), axis=1)`\n\n   一个 `lambda` 函数被应用于 `EmployeeList` 数据框的 `axis\
  \ 1`（轴 1）。正如你在之前的自定义函数示例中学到的，这使你能够将整行传递给 `useHaversine()` 函数。\n\n5. 最后但同样重要的是，复制该脚本并将其粘贴到\
  \ Power BI 的 Python 编辑器中，以便将生成的数据框添加到 Power BI 数据模型中。\n\n在本练习中，你成功利用了 `Haversine`\
  \ 库中的预置函数，该函数为你抽象了使用 `Haversine` 公式进行计算的复杂性。所使用的函数是 `Haversine()` 函数。就像在 R 中一样，你能够利用一个预置函数，通过\
  \ Python 为你执行数学计算。你所需要做的只是调用一个函数。\n\n## 总结\n\n本章阐述了两项非常重要的技术。第一项技术是如何使用 R 和 Python\
  \ 基于复杂的数学公式创建计算列。本章的示例展示了 R 和 Python 在处理复杂数学运算方面比 Power Query 中的 M 语言要优秀得多。在大多数场景下，将\
  \ R 和 Python 与 DAX 进行比较时，情况也是如此。第二项技术展示了如何分别使用 R 和 Python 中众多包和库里的预置函数。该练习使用了基于\
  \ `Haversine` 公式的 R 和 Python 预置函数，但很可能在 15,000 多个 R 包和 110,000 多个 Python 库中，存在一个预置函数，你可以用它来为你抽象距离计算的复杂性，满足你绝大部分的计算需求。\n\
  \n在 Power BI 中使用 R 和 Python 创建计算列的能力，可以用来克服 Power Query 的许多其他限制。除了执行复杂计算，你还可以使用\
  \ R 或 Python 来：\n\n-   创建基于算法的计算列，用于填补缺失数据点的值，这些算法比使用均值或众数等常见方法更准确\n-   如你在第 7 章所学，创建基于复杂字符串操作的计算列\n\
  -   创建基于机器学习算法的计算列，你将在第 9 章学习该算法\n-   以及更多其他用途\n\n可能性是无限的！\n\n"
- '# 第四部分：在 Power BI 中使用 R 和 Python 进行机器学习与人工智能


