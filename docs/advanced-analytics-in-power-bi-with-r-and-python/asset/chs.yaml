  ## 使用 Python 读取 SQL Server 数据


  在本节中，你将使用 Python 执行刚才在 R 中执行的相同任务。逻辑类似，但你可以用更少的步骤完成任务。让我们从步骤 1 开始。


  ### 步骤 1：为 SQL Server 数据库创建 DSN


  如果你已经完成了 R 示例，那么你已经创建了 `DSN`，可以直接进入下一步。如果没有，则必须先完成 R 示例中的步骤 1，然后再继续下一步。`DSN` 独立于
  R 和 Python，因此你可以对两者使用同一个。


  ### 步骤 2：在 SQL Server 中创建日志表


  数据库中应已存在名为 `dbo.LoadHistoryLog` 的日志表。如果需要创建 `dbo.LoadHistoryLog` 表，请在 `SQL Server
  Management Studio (SSMS)` 中执行以下代码：


  ```

  USE AdventureWorksDW_StarSchema

  CREATE TABLE dbo.[LoadHistoryLog] (

  DATESTAMP DATETIME,

  TABLENAME VARCHAR(25),

  NUM_RECORDS INT

  )

  ```


  要在 SSMS 中执行代码，你需要：


  1. 复制上述代码

  2. 在 SSMS 中展开 `Database` 文件夹，然后选择 `AdventureWorksDW_StarSchema` 数据库

  3. 单击菜单栏中的 `New Query` 按钮

  4. 将剪贴板中复制的代码粘贴到编辑器中，然后单击菜单栏中的 `Execute` 按钮执行代码


  ### 步骤 3：开始创建加载 `DimDate` 表的脚本


  你将在本脚本中使用三个库。你将使用的库是 `pandas`、`sqlalchemy` 和 `datetime`。`Pandas` 将是主力包，因为它将用于读取要加载到
  Power BI 数据模型中的数据，并将要记录的信息写回 SQL Server。`sqlalchemy` 库中的 `create_engine()` 函数用于创建到
  SQL Server 数据库的连接对象，而 `datetime` 库中的 `datetime` 模块将用于其日期函数。以下代码用于加载前面提到的库、函数和模块：


  ```

  import pandas as pd

  from sqlalchemy import create_engine

  from datetime import datetime

  ```


  ### 步骤 4：创建一个变量，用于保存要读取到 Power BI 的表名


  将要读取到 Power BI 数据模型中的表名将在脚本中的多个位置使用。使用变量而不是硬编码表名。这使得维护脚本并使其可重用于其他表变得更加容易。以下是用于创建保存表名的变量的代码：


  ```

  tablename = "DimDate"

  ```


  ### 步骤 5：使用 `sqlalchemy` 创建数据库连接


  使用以下代码创建到 SQL Server 数据库的连接：


  ```

  con = create_engine("mssql+pyodbc://SQLServer2017")

  ```


  与 R 示例一样，使用 DSN 可以非常轻松地连接到数据库。这里使用 `sqlalchemy` 库中的 `create_engine()` 函数来建立连接。在
  `sqlalchemy` 中为 SQL Server 构建连接字符串的语法是 `"mssql+pyodbc://<DSN>"`，因此在这种情况下，它是 `"mssql+pyodbc://SQLServer2017"`。


  ### 步骤 6：读取 `DimDate` 表的内容并将其存储为 `df_read` 变量中的数据框


  你将使用 pandas 的 `read_sql_table()` 方法读取 `DimDate` 表的内容，并将其存储在名为 `df_read` 的数据框中。`read_sql_table()`
  方法使用两个参数：要读取的 SQL 表名和数据库连接。代码如下：


  ```

  df_read = pd.read_sql_table(tablename, conn)

  ```




  ### 步骤 7：获取当前日期和时间，并将信息存储到 `datestamp` 变量中


  使用以下代码执行此任务：


  ```

  datestamp = datetime.now().strftime(''%Y-%m-%d %H:%M:%S'')

  ```


  你使用 `datetime` 模块中的 `now()` 方法来获取加载的时间。不幸的是，`now` 函数返回的日期格式不能被 SQL Server 使用，因此需要重新格式化。该函数返回的日期格式为
  `datetime.datetime(YYYY, M, D, H, M, SS, MS)`。例如，2019 年 1 月 1 日晚上 10:00 将返回为 `datetime.datetime(2019,
  1, 1, 22, 0, 0, 0)`。你使用 `strftime()` 方法并应用以下格式字符串 `''%Y-%m-%d %H:%M:%S''` 来重新格式化该输出，使其变为
  `YYYY-MM-DD HH:MM:SS` 格式。此操作将 `datetime.datetime(2019, 1, 1, 22, 0, 0, 0)` 重新格式化为
  `''2019-04-14 22:05:24''`。现在，你拥有了一个 SQL Server 可用的 `datestamp` 格式。


  ### 步骤 8：计算 `DimDate` 表中的记录数


  你需要记录从 `DimDate` 表加载的记录数。要获取该信息，请使用 pandas 中的 `shape` 方法，如下代码所示：


  ```

  num_records = df.shape[0]

  ```


  `shape` 方法返回一个包含两个元素的元组。第一个元素包含数据框中的行数，第二个元素包含列数。你只需要行数，因此可以使用 `[0]` 对 `shape` 方法进行子集化以获取该信息。


  `tuple` 是一种 Python 数据结构，表示一个不可变对象的序列。它们与列表类似，区别在于创建后不能更改。


  ### 步骤 9：创建一个包含你想要记录的信息的单记录 pandas 数据框


  使用以下代码分两步完成此操作：


  ```

  dict_insert = {

  "DATESTAMP":[datestamp],

  "TABLENAME":[tablename],

  "NUM_RECORDS":[num_records]}

  df_insert = pd.DataFrame.from_dict(dict_insert)

  ```


  代码的第一部分创建了一个 `键/值` 对的 `字典`。`键` 是一个硬编码的值，将成为列名。值是一个 `列表`，`列表` 中的元素将填充该列。在这种情况下，每个
  `列表` 只包含一个元素。


  代码的第二部分使用 pandas `DataFrame` 类的 `from_dict` 方法创建一个数据框。将 `dict_insert` 字典传递给它，结果就是
  `df_insert` 数据框。


  ### 步骤 10：将你在步骤 9 中收集的信息插入到历史日志表中


  要将数据从 `df_insert` 数据框插入到 `LoadHistoryLog` 表中，请使用 `df_insert` 数据框的 `to_sql` 方法，如下所示：


  ```

  df_insert.to_sql(

  name=''LoadHistoryLog'',

  con=conn,

  index=False,

  if_exists = ''append''

  )

  ```


  表的名称为 `LoadHistoryLog`，你之前创建的 `conn` 对象用于 `con` 参数，`index` 属性设置为 `False` 以防止 pandas
  尝试在插入中包含索引值，`if_exists` 设置为 `append`，以便 pandas 知道如果表已存在，则将数据作为插入添加。


  ### 步骤 11：将脚本复制到 Power BI


  以下是完整的脚本：


  ```

  import pandas as pd

  from sqlalchemy import create_engine

  from datetime import datetime

  tablename = "DimDate"

  conn = create_engine("mssql+pyodbc://SQLServer2017")

  df_read = pd.read_sql_table(tablename, conn)

  datestamp = datetime.now().strftime(''%Y-%m-%d %H:%M:%S'')

  num_records = df_read.shape[0]

  dict_insert = {

  "DATESTAMP":[datestamp],

  "TABLENAME":[tablename],

  "NUM_RECORDS":[num_records]}

  df_insert = pd.DataFrame.from_dict(dict_insert)

  df_insert.to_sql(

  name=''LoadHistoryLog'',

  con=conn,

  index=False,

  if_exists = ''append''

  )

  ```


  与之前的示例一样，通过 `GetData` 将 Python 代码复制到 Power BI 中。脚本中产生了两个数据框 `df_read` 和 `df_insert`，因此你需要告诉
  Power BI 你想要将哪一个加载到 Power BI 数据模型中。你想要加载 `df_read`，因此选择它，然后单击 `Edit` 按钮。接下来，在 `PROPERTIES`
  部分将查询名称从 `df_read` 更改为 `DimDate`。单击 `Close & Apply` 将数据加载到 Power BI 数据模型中。


