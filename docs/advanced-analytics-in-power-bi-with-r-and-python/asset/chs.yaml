- "# 2. 在 Power BI 中使用 ggplot2 创建 R 自定义可视化效果\n\n在上一章中，您了解了 `ggplot2` 包，并获得了在 Power\
  \ BI 中创建可视化效果的基本模板。在本章中，您将获得一些示例，这些示例展示了当您利用 `ggplot2` 在 Power BI 中创建 R 自定义可视化效果时，可以多么富有表现力。本章包含创建以下图表的示例：\n\
  \n* 一个带有动态标题和注释的`标注图`\n* 一个带有动态标题、显示五个数据维度的`气泡图`\n* 一个详细的`预测可视化`，预测 Lamar Jackson\
  \ 和 Deshaun Watson 的维基百科页面浏览量\n* 一个`折线图`，显示按年份划分的 GDP，并根据该时间点的执政政党添加`背景阴影`\n* 一个`地图`可视化，显示所选州，并根据该县所在的人口五分位数对该州的县进行着色\n\
  * 一个`四象限图`，比较洛杉矶湖人队篮球运动员在 2008-2009 赛季的总得分和篮板数\n* 一个美国女性平均体重与身高的`散点图`，并叠加了`回归线`\n\
  \n您可以对这些示例进行微小修改以用于您的数据。您也可以发挥创意，从每个可视化效果中汲取一点灵感，创建满足您特定需求的自定义可视化效果。`ggplot2` 包非常丰富，以至于很难限制您的创造力。让我们从创建一个`标注图`开始。\n\
  \n## 标注图\n\n`水平条形图`是一种非常常见的可视化效果。它非常适合根据指标对分类数据进行排名。Power BI 中的默认可视化效果之一是条形图，但其本质相当基础。您可以进行一些基本的增强，例如通过高亮来强调某个条形，但如果不使用笨拙的技巧，就无法进一步添加诸如`动态副标题`、`说明文字`和`动态注释`等功能。幸运的是，这对于\
  \ `ggplot2` 来说不是限制！\n\n在本节中，您将创建图 2-1 中列出的`水平条形图`。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig1_HTML.jpg](img/480677_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n带有标注条和注释的水平条形图\n\n上图根据政府教育支出占总支出的百分比对前 7 个国家进行排名。它包含一个`动态注释`，将排名第一的国家与排名第七的国家进行比较。最后，它包含一个说明文字，告诉您数据来源。让我们来看看开发此可视化效果所需的代码。\n\
  \n\n\n### 步骤 1：获取必要数据\n\n本示例使用的数据集来自*世界银行开放数据*。该数据集代表了世界各国政府教育支出占总支出的百分比。执行以下步骤获取数据集：\n\
  \n| 列名 | 数据类型 |\n| --- | --- |\n| 国家 | 文本 |\n| 国家代码 | 文本 |\n| 年份 | 整数 |\n| 总支出百分比\
  \ | 小数 |\n\n1. 访问 `data.worldbank.org`。\n2. 在页面中上部的搜索栏中输入*“Government expenditure\
  \ on education, total (% of government expenditure)”*。按下回车键后，将出现一个可能的选项列表，其中应有一个与您输入的内容完全一致。选择它，您将进入一个专门介绍该主题的页面。\n\
  3. 在页面右侧，您会看到一个下载区域，提供 *csv*、*xml* 或 *Excel* 格式的下载选项。点击 *csv* 选项。\n4. 上一步操作将下载一个\
  \ zip 文件到您的计算机。截至撰写本文时，该 zip 文件包含三个文件：一个数据文件、一个包含国家信息的元数据文件，以及一个包含指标信息的元数据文件。本练习所需文件是数据文件。在撰写本文时，该文件名为\
  \ `API_SE.XPD.TOTL.GB.ZS_DS2_en_csv_v2_715566.csv`。请注意，生成这些数据集的政府机构可能会在未事先通知的情况下更改其格式，因此未来格式可能会发生变化。\n\
  5. 现在，您需要将数据集导入 Power BI，并将其整理成可视化所需的形状。Power BI 中的 `GetData` 功能将用于执行此任务。要将内容加载到\
  \ Power BI，请转到*主页*选项卡，然后点击 `GetData` ➤ `Text/CSV`，接着导航到数据文件所在的位置。请记住，本示例使用的数据文件名为\
  \ `API_SE.XPD.TOTL.GB.ZS_DS2_en_csv_v2_715566.csv`，它是 zip 文件中三个文件中最大的一个。该文件也位于本章的代码仓库中。\n\
  6. 接下来，您需要使用 `GetData (Power Query)` 对数据进行必要的转换，使其达到可视化所需的形状。最终输出需要包含以下列及其关联的数据类型：\n\
  \n您将在本章的代码仓库中获得一个 `pbix` 文件，其中包含将数据整理成上述形状所需的 Power Query 步骤。您只需更改源文件即可。请注意，如果生成数据集的政府实体决定更改格式，这些步骤将来可能需要更改。\n\
  \n### 步骤 2：在“筛选器”窗格中基于年份创建切片器\n\n将切片器图标拖到报表画布的右上角。切片器图标如图 2-2 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig2_HTML.jpg](img/480677_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n切片器视觉对象图像\n\n放置好切片器后，将 `Year` 字段从 `ExpenditureOnEducationByCountryByYear`\
  \ 数据集拖到“字段”窗格，如图 2-3 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig3_HTML.jpg](img/480677_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n“字段”窗格图像\n\n### 步骤 3：在 Power BI 中配置 R 视觉对象\n\n转到可视化窗格，将一个 R 视觉对象拖到报表画布上。将视觉对象调整到所需大小。将\
  \ `EducationExpenditures` 表中的 `Country`、`Total Expend %` 和 `Year` 字段拖到“字段”窗格。如果“字段”窗格未显示，请在报表画布上选择\
  \ R 视觉对象，它应该会显示出来。\n\n### 步骤 4：将数据导出到 R Studio 进行开发\n\n选择 R 视觉对象以显示 `R 脚本编辑器`。您会在\
  \ R 视觉对象的底部看到它。如果它没有完全展开，请点击位于 `R 脚本编辑器` 最右侧的向上箭头。展开后，您应该会看到以下代码（图 2-4）。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig4_HTML.jpg](img/480677_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n带有默认注释的 Power BI R 脚本编辑器\n\n这些注释告诉您，R 获取了您通过“字段”窗格在 Power BI 中创建的数据集，并将其分配给了名为\
  \ `dataset` 的 R 对象，该对象是一个 `data frame`。`data frame` 是一个具有特殊属性的二维数据集。`data frame`\
  \ 在上述代码的第 3 行创建。Power BI 只允许将具有唯一行的数据集传递给 R，并通过第 4 行中的 `unique()` 函数确保 `dataset`\
  \ 数据框具有唯一行。\n\n上述编辑器并非理想的开发环境。幸运的是，Microsoft 让您可以轻松地在更理想的环境（如 `R Studio`）中进行开发。要将开发工作转移到\
  \ `R Studio`，请点击 45° 箭头。该箭头在图 2-5 中突出显示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig5_HTML.jpg](img/480677_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n点击突出显示的箭头将启动您首选的 IDE，以获得更愉悦的开发环境\n\n点击箭头将打开 `R Studio`，并将传递给 R 视觉对象的数据集保存到计算机上的临时位置。它还会生成代码，创建代表传递给\
  \ Power BI 中 R 视觉对象的数据框的 `dataset` 变量。最后，脚本中的任何 R 代码也将传递给 `R Studio`。清单 1-1 显示了将传递给\
  \ R Studio 的内容。\n\n```\n# 输入加载。请勿更改 #\n`dataset` =\nread.csv('',\ncheck.names =\
  \ FALSE,\nencoding = \"UTF-8\",\nblank.lines.skip = FALSE\n);\n# 原始脚本。请在此处更新您的脚本内容\n\
  # 完成后将以下部分复制回原始\n# 编辑窗口。以下用于创建数据框和\n# 删除重复行的代码始终会执行，并作为\n# 脚本的前言：\n# dataset <-\n\
  #   data.frame(\n#     Country Name,\n#     `Percent Education Expenditure Ranking`\n\
  #   )\n# dataset <- unique(dataset)\n# 在此粘贴或输入您的脚本代码：\n清单 1-1\n从 Power BI 传递给 R\
  \ Studio 的代码\n```\n\n代码已重新格式化，以便在页面上更好地显示。第 2-7 行将显示在一行上，用于将保存到磁盘的数据集读取到 R 数据框中。该数据框将被命名为\
  \ `dataset`。请注意，这与 Power BI 中使用的名称相同。这是有意为之。使用相同的名称使您能够将在 `R Studio` 中开发的代码直接用于\
  \ Power BI，而无需进行任何重构。\n\n### 步骤 5：加载所需的包\n\n本示例中使用的三个包是 `tidyverse`、`scales` 和 `ggthemes`。`tidyverse`\
  \ 中的 `dplyr` 包用于执行一些数据整理操作，`tidyverse` 中的 `ggplot2` 用于创建可视化，`tidyverse` 中的 `forcats`\
  \ 用于定义一些排序规则，`scales` 包中的一些函数用于数字格式化，而 `ggthemes` 包提供了 `theme_few()` 主题。以下是加载这些包的代码：\n\
  \n```\nlibrary(tidyverse)\nlibrary(scales)\nlibrary(ggthemes)\n```\n\n\n\n### 第\
  \ 6 步：创建数据验证测试所需的变量\n\n以下代码用于创建数据验证测试：\n\n```\ncurrentColumns <- sort(colnames(dataset))\n\
  requiredColumns <- c(\"Country\", \"Total Expend %\", \"Year\")\ncolumnTest <- isTRUE(all.equal(currentColumns,\
  \ requiredColumns))\nreportYear <- unique(dataset$Year)\n```\n\n你需要确保传递给 R 的数据满足可视化的要求。前面执行了两个测试来检查是否满足要求。首先，测试确保预期的列已传递给\
  \ R。其次，测试确保数据集仅代表一个年份。\n\n基于列名的测试在前三行代码中完成。第一行代码创建了一个名为 `currentColumns` 的字符向量，其中包含\
  \ `dataset` 数据框中按字母顺序排序的列名。它使用 `colnames()` 函数从 `dataset` 数据框中获取列名。`sort()` 函数用于将返回的列名按字母顺序排序。为了进行比较，需要按字母顺序排列。下一行代码创建了一个名为\
  \ `requiredColumns` 的字符向量，其中包含可视化所期望的列名。列名也必须按字母顺序提供。\n\n为了测试它们是否相等，它们不仅需要包含相同的元素，而且元素的顺序也必须相同。为了测试相等性，使用了基础\
  \ R 中的 `all.equal()` 函数。如果两个字符向量相等，则返回 `TRUE`；否则，返回关于它们为何不相等的信息。你需要返回一个 `Boolean`\
  \ 值。你可以通过将 `all.equal()` 函数包装在 `isTRUE()` 函数中来确保返回布尔值。前面代码中的最后一行获取了 `dataset` 数据框中包含的唯一年份。该信息将在下一步中使用。\n\
  \n### 第 7 步：创建数据验证测试\n\n以下是验证测试的框架：\n\n```\nif (length(reportYear) == 1 & columnTest)\
  \ {\n\n} else {\nplot.new()\ntitle(\"The data supplied did not meet the requirements\
  \ of the\nchart.\")\n}\n```\n\n如果 `dataset` 数据框仅包含一个年份，并且 `columnTest` 评估为 `TRUE`，则执行创建可视化的代码。否则，显示一个空白图表，并显示消息“提供的数据不满足图表的要求”。\n\
  \n### 第 8 步：为自定义 R 可视化所需的数据集添加额外的列\n\n现在你需要开始开发在满足要求时创建可视化的脚本。你需要使用额外的列来增强 `dataset`\
  \ 数据框，以便创建所需的可视化。用于增强 `dataset` 数据框的代码如下所示：\n\n```\nplotdata %\nmutate(\nrank =\
  \ dense_rank(desc(`Total Expend %`)),\ncallout = ifelse(rank == 1, TRUE, FALSE)\n\
  Country = fct_reorder(Country, rank, .desc = TRUE),\n) %>%\nfilter(rank <= 7)\n\
  ```\n\n此代码将放在第 7 步所示模板中的 `<code to produce visual>` 位置。前面的代码使用 `tidyverse` 中的 `dplyr`\
  \ 包来添加所需的列。第一行代码将后续代码的结果分配给一个名为 `plotdata` 的变量。第二行代码表示你从 `dataset` 数据框开始，并通过使用管道（`%>%`）运算符将其作为\
  \ `mutate()` 函数的第一个参数传递。\n\n管道运算符 `%>%` 来自 `magrittr` 包，该包随 `dplyr` 预加载。它将表达式的结果或值传递给后续函数。它使涉及链式操作的代码更具可读性。\n\
  \n`mutate()` 函数用于投影两个新列 `rank` 和 `callout`，并更改 `Country` 列的默认排序顺序。rank 列使用 `dplyr`\
  \ 中的 `dense_rank()` 窗口函数，根据 `Total Expend %` 按降序对每一行进行排名。\n\n`callout` 列用于标识排名第一的国家。它使用\
  \ `ifelse()` 函数，如果 rank 列等于 1，则返回 `TRUE`，否则返回 `FALSE`。`Country` 列使用 `forcats` 中的\
  \ `fct_reorder()` 函数，根据 `rank` 列确定其排序顺序。之所以能够这样做，是因为 `Country` 列的数据类型是 `factor`。\n\
  \n`factor` 是 R 中用于分类数据的一种特殊数据类型。它有许多很好的属性，其中之一就是能够根据另一列对因子列进行排序。\n\n`Country` 字段将根据其排名进行排序。定义的排序顺序将用于可视化。\n\
  \n最后，使用 `filter()` 函数过滤 `dataset` 数据框。对 `rank` 列应用过滤器，以将 `dataset` 数据框限制为仅包含排名前\
  \ 7 的国家。\n\n\n\n### 步骤 9：创建用于图表动态部分的变量\n\nR 语言中有一个 Power BI 不具备的功能，即能够动态地向图表添加注释。你不仅可以动态创建要在图表上显示的文本，还可以动态控制文本放置的位置。在此步骤中，你将创建用于生成动态注释的变量，并定义动态注释的位置。你还需要创建用于图表主标题、副标题和图表说明的变量。以下是相关代码：\n\
  \n```\ncountryToAnnotate <- plotdata$`Country`[plotdata$rank == 1]\nminExpenditure\
  \ <- min(plotdata$`Total Expend %`)\nmaxExpenditure <- max(plotdata$`Total Expend\
  \ %`)\nminCountry <-\nplotdata$`Country`[\nwhich(plotdata$`Total Expend %` == minExpenditure)\n\
  ]\nminCountry <- paste(minCountry, collapse = \" & \")\nmaxCountry <- plotdata$`Country`[\n\
  which(plotdata$`Total Expend %` == maxExpenditure)\n]\nmaxCountry <- paste(maxCountry,\
  \ collapse = \" & \")\nmainTitle <- \"% of Government Expenditure on Education\"\
  \nsubTitle <-\npaste(\n\"The top 7 ranked countries in\",\nreportYear,\nsep = \"\
  \ \"\n)\ncaption <- \"Source:  https://databank.worldbank.org/source/world-development-indicators\"\
  \nlabel_val <-\nstr_wrap(\npaste(\nmaxCountry,\n\"spent\",\npercent((maxExpenditure/minExpenditure-1)),\n\
  \"more of their expenditures on education than\",\nminCountry,\nsep = \" \"\n),\n\
  width = 35\n)\n```\n\n以下是每个变量的说明：\n\n- `countryToAnnotate`：这是排名第一的国家。它将是你将要注释的国家。\n\
  \n- `minExpenditure`：此变量保存使用 `min()` 函数获取 `Total Expend %` 列最小值的结果。此信息稍后将用于识别支出最低的国家。\n\
  \n- `maxExpenditure`：此变量保存使用 `max()` 函数获取 `Total Expend %` 列最大值的结果。此信息稍后将用于识别支出最高的国家。\n\
  \n- `minCountry`：你在 `minExpenditure` 变量中确定了前 7 个国家中的最低支出百分比。现在你需要找出哪些国家与之相关。你通过将\
  \ `plotdata` 数据框中的 `Country` 列子集化，仅包含 `Total Expend %` 等于 `minExpenditure` 的国家来获取该信息。你使用\
  \ `which()` 函数来协助完成此任务。`which()` 函数返回 `TRUE` 索引，可用于告知 R 要返回的 `Country` 列的索引。`plotdata`\
  \ 数据框可能包含并列情况，需要处理。这将在下一行完成。并列的国家使用 `paste()` 函数合并为一个标量字符向量。新合并的标量字符向量中的元素用 `&`\
  \ 符号分隔。如果你在 Power BI 报表中选择日历年份 2005，可以看到并列情况的示例。\n\n- `maxCountry`：`which()` 函数也用于帮助我们获取最高支出国家的名称。这里它被用来获取\
  \ `rank` 列等于 1 的索引。在此数据集中，第一名没有并列情况，因此你实际上不需要处理它们。\n\n- `mainTitle`：此变量保存一个静态字符串的值，该字符串将用于图表标题。\n\
  \n- `subtitle`：此变量保存一个动态创建字符串的值，该字符串将根据报表用户选择的年份用于图表的副标题。\n\n- `caption`：此变量存储源数据来源的网站\
  \ URL。\n\n- `label_val`：此变量包含动态创建的图表注释的结果。该注释将政府教育支出占比最高的国家与排名第七的国家进行了比较。它使用 `paste()`\
  \ 函数，通过组合 `maxCountry` 和 `minCountry` 变量以及百分比计算结果来动态构建注释。\n\n该注释相对较长，如果显示为一行，将无法在视觉对象中容纳。通过使用\
  \ `stringr` 包中的 `str_wrap()` 函数解决了这个问题。该函数提供了丰富的格式化选项，其中之一是控制行最大宽度的能力。在此示例中，你将此参数设置为\
  \ 35，以确保注释能够适应图表。\n\n### 步骤 10：通过定义 `ggplot()` 函数开始构建图表\n\n`ggplot()` 函数定义如下：\n\n\
  ```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y = `Total Expend %`, fill\
  \ = callout,\nlabel = percent(`Total Expend %`)\n)\n)\n```\n\n`x` 和 `y` 美学映射的目的不言自明。`fill`\
  \ 美学映射告诉 `ggplot()` 你想要基于哪一列（变量）来设置条形图的颜色，而 `label` 美学映射则告诉 R 将使用哪一列来向图表添加标签。\n\n\
  ### 步骤 11：向 R 视觉对象添加柱状图层\n\n在此步骤中，你使用 `geom_col()` 几何对象向图表添加第一个图层，即柱状图。你可以选择使用此几何对象或\
  \ `geom_bar()` 几何对象。你选择了 `geom_col()`，因为 `stat` 参数的默认值是 `stat_identity`，因此将显示 `y`\
  \ 美学映射的真实值，而不是 `y` 中元素数量的计数。如果我们使用 `geom_bar()`，则必须明确告诉 `ggplot()` 你想要将 `stat` 参数设置为\
  \ `stat_identity`：\n\n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y\
  \ = `Total Expend %`, fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\n\
  geom_col()\n```\n\n### 步骤 12：向 R 视觉对象添加文本图层\n\n以下代码获取了截至步骤 11 构建的内容，并为图表添加了一个标签图层：\n\
  \n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y = `Total Expend %`,\
  \ fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\ngeom_bar(stat=\"identity\"\
  , aes(fill = callout)) +\ngeom_text(nudge_y = -0.05)\n```\n\n在此步骤中，你向图表添加了另一个图层。你使用\
  \ `geom_text()` 几何对象向图表添加标签。`geom_text()` 几何对象必需的参数是 `x`、`y` 和 `label`。这三个参数都继承自在\
  \ `ggplot()` 函数中定义的美学映射。`x` 和 `y` 参数用于定义标签的位置，`label` 参数用于定义显示的内容。在此示例中，你显示的是格式化为百分比的\
  \ `Total Expend %` 列。标签的自然位置部分位于图表柱状图的末端之外。你需要将它们完全包含在柱状图中，这样标签就不会与稍后添加的注释重叠。你通过\
  \ `nudge_y` 参数将标签从部分位于柱状图外部移动到完全位于柱状图内部。图 2-6 显示了未使用 `nudge_y` 参数时标签的显示效果。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig6_HTML.jpg](img/480677_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n带有数据标签的标注柱状图\n\n图 2-7 显示了将 `nudge_y` 设置为 –0.05 时标签的外观。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig7_HTML.jpg](img/480677_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7\n\n数据标签位于条形内部的标注柱状图\n\n\n\n### 步骤 13：修改 y 轴\n\n以下代码使用 `scale_y_continuous()`\
  \ 标度对 `y` 轴进行修改：\n\n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y =\
  \ `Total Expend %`, fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\n\
  geom_bar(stat=\"identity\", aes(fill = callout)) +\ngeom_text(nudge_y = -0.05) +\n\
  scale_y_continuous(\nlimits = c(0,0.75),\nlabels = NULL,\nbreaks = NULL\n)\n```\n\
  \n你明确将 `y` 轴的显示范围设置为 0 到 0.75。这样做是为了给报告用户提供一致的体验。默认情况下，与许多可视化工具一样，`ggplot2` 会根据数据自动调整标度。这可能会在视觉上错误地呈现数据在不同年份之间的重要差异。因此，你通过明确定义范围来防止重新缩放。`labels`\
  \ 和 `breaks` 参数用于帮助报告用户解读图表中各列的值。由于你已经明确提供了这些值，因此不需要标签和刻度线。所以，通过将 `labels` 和 `breaks`\
  \ 参数设置为 `NULL` 来移除它们。\n\n### 步骤 14：将图表从垂直柱状图转换为水平条形图\n\n此操作通过向脚本的下一行添加 `coord_flip()`\
  \ 函数来完成，如下所示：\n\n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y = `Total\
  \ Expend %`, fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\ngeom_bar(stat=\"\
  identity\", aes(fill = callout)) +\ngeom_text(nudge_y = -0.05) +\nscale_y_continuous(\n\
  limits = c(0,0.75),\nlabels = NULL,\nbreaks = NULL\n) +\ncoord_flip()\n```\n\n`coord_flip()`\
  \ 函数会使 `x` 轴变成 `y` 轴，`y` 轴变成 `x` 轴。结果是一个水平条形图，如图 2-8 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig8_HTML.jpg](img/480677_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\n之前的柱状图转换为水平条形图\n\n### 步骤 15：为 R 可视化添加动态注释\n\n你使用 `annotate()` 函数为图表添加一个注释层，如下所示：\n\
  \n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y = `Total Expend %`,\
  \ fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\ngeom_bar(stat=\"identity\"\
  , aes(fill = callout)) +\ngeom_text(nudge_y = -0.05) +\nscale_y_continuous(\nlimits\
  \ = c(0,0.75),\nlabels = NULL,\nbreaks = NULL\n) +\ncoord_flip() +\nannotate(\n\"\
  text\",\nlabel = label_val,\nx = countryToAnnotate[1],\ny = maxExpenditure + 0.12\n\
  )\n```\n\n你想向图表添加一个文本注释，因此第一个参数设置为 `\"text\"`。接下来，你将 `label_val` 变量赋值给 `label` 参数，因为该变量包含注释的文本。最后，你使用\
  \ `x` 和 `y` 参数定义注释的位置。你将 `x` 设置为你想要注释的国家名称。将 `x` 设置为国家名称，可以将注释对齐到该指定国家所在的 `x 轴`\
  \ 位置。你将 `y` 轴上的位置设置为比该国家支出值高几个单位的位置，这样注释就不会覆盖该国家的柱形。请注意，因为你之前使用了 `coord_flip()`\
  \ 函数，所以看起来你是在处理 `x 轴`，但实际上你是在处理 `y 轴`，反之亦然。添加注释层的结果如图 2-9 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig9_HTML.jpg](img/480677_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9\n\n带有注释的水平条形图\n\n### 步骤 16：为 R 可视化添加动态标题和说明文字\n\n接下来，你使用 `labs()` 函数以及 `mainTitle`、`subTitle`\
  \ 和 `caption` 变量，为图表添加`图表标题`、`副标题`和`说明文字`，如下列代码所示：\n\n```\np <-\nggplot(\ndata =\
  \ plotdata,\naes(x = `Country`, y = `Total Expend %`, fill = callout,\nlabel = percent(`Total\
  \ Expend %`)\n)\n) +\ngeom_bar(stat=\"identity\", aes(fill = callout)) +\ngeom_text(nudge_y\
  \ = -0.05) +\nscale_y_continuous(\nlimits = c(0,0.75),\nlabels = NULL,\nbreaks =\
  \ NULL\n) +\ncoord_flip() +\nannotate(\n\"text\",\nlabel = label_val,\nx = countryToAnnotate[1],\n\
  y = maxExpenditure + 0.12\n) +\nlabs(\ntitle = mainTitle,\nsubtitle = subTitle,\n\
  caption = caption\n)\n```\n\n设置 `labs` 函数的作用不言自明，因此无需解释。\n\n### 步骤 17：移除 x 轴和 y\
  \ 轴的标签\n\n由于你已向图表添加了标签，因此无需显式定义 `x` 和 `y` 轴。你通过将 `xlab()` 和 `ylab()` 函数中的 `label`\
  \ 参数设置为 `NULL` 来移除 `x` 和 `y` 轴的标签，如下列代码的最后一行所示：\n\n```\np <-\nggplot(\ndata = plotdata,\n\
  aes(x = `Country`, y = `Total Expend %`, fill = callout,\nlabel = percent(`Total\
  \ Expend %`)\n)\n) +\ngeom_bar(stat=\"identity\", aes(fill = callout)) +\ngeom_text(nudge_y\
  \ = -0.05) +\nscale_y_continuous(\nlimits = c(0,0.75),\nlabels = NULL,\nbreaks =\
  \ NULL\n) +\ncoord_flip() +\nannotate(\n\"text\",\nlabel = label_val,\nx = countryToAnnotate[1],\n\
  y = maxExpenditure + 0.12\n) +\nlabs(\ntitle = mainTitle,\nsubtitle = subTitle,\n\
  caption = caption\n) +\nxlab(label = NULL) +\nylab(label = NULL)\n```\n\n### 步骤\
  \ 18：移除图例\n\n如果你回头参考图 2-10，你会注意到一个关于 `callout` 的图例。`callout` 列与 `fill` 参数相关联，该参数用于确定柱形的颜色。你用它来将排名第一的国家与其他国家区分开来。不需要图例来解释颜色，因此将其移除。你通过将\
  \ `guides()` 函数中的 `fill` 参数设置为 `FALSE` 来实现。这样做会从图表中移除图例，因为该图例是针对 `fill` 标度的。用于执行此任务的代码位于以下脚本的最后一行：\n\
  \n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y = `Total Expend %`,\
  \ fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\ngeom_bar(stat=\"identity\"\
  , aes(fill = callout)) +\ngeom_text(nudge_y = -0.05) +\nscale_y_continuous(\nlimits\
  \ = c(0,0.75),\nlabels = NULL,\nbreaks = NULL\n) +\ncoord_flip() +\nannotate(\n\"\
  text\",\nlabel = label_val,\nx = countryToAnnotate[1],\ny = maxExpenditure + 0.12\n\
  ) +\nlabs(\ntitle = mainTitle,\nsubtitle = subTitle,\ncaption = caption\n) +\nxlab(label\
  \ = NULL) +\nylab(label = NULL) +\nguides(fill=FALSE)\n```\n\n### 步骤 19：使用 `theme_few()`\
  \ 更改可视化的外观和风格\n\n接下来，你通过使用 `ggthemes` 包中的 `theme_few()` 主题，应用数据可视化专家 Stephen Few\
  \ 的原则来更改图表的外观，如下列代码的最后一行所示：\n\n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`,\
  \ y = `Total Expend %`, fill = callout,\nlabel = percent(`Total Expend %`)\n)\n\
  ) +\ngeom_bar(stat=\"identity\", aes(fill = callout)) +\ngeom_text(nudge_y = -0.05)\
  \ +\nscale_y_continuous(\nlimits = c(0,0.75),\nlabels = NULL,\nbreaks = NULL\n)\
  \ +\ncoord_flip() +\nannotate(\n\"text\",\nlabel = label_val,\nx = countryToAnnotate[1],\n\
  y = maxExpenditure + 0.12\n) +\nlabs(\ntitle = mainTitle,\nsubtitle = subTitle,\n\
  caption = caption\n) +\nxlab(label = NULL) +\nylab(label = NULL) +\nguides(fill=FALSE)\
  \ +\ntheme_few()\n```\n\n\n\n### 步骤 20：标题居中对齐\n\n以下代码的最后一行使用了 `theme()` 函数来处理此任务：\n\
  \n```\np <-\nggplot(\ndata = plotdata,\naes(x = `Country`, y = `Total Expend %`,\
  \ fill = callout,\nlabel = percent(`Total Expend %`)\n)\n) +\ngeom_bar(stat=\"identity\"\
  , aes(fill = callout)) +\ngeom_text(nudge_y = -0.05) +\nscale_y_continuous(\nlimits\
  \ = c(0,0.75),\nlabels = NULL,\nbreaks = NULL\n) +\ncoord_flip() +\nannotate(\n\"\
  text\",\nlabel = label_val,\nx = countryToAnnotate[1],\ny = maxExpenditure + 0.12\n\
  ) +\nlabs(\ntitle = mainTitle,\nsubtitle = subTitle,\ncaption = caption\n) +\nxlab(label\
  \ = NULL) +\nylab(label = NULL) +\nguides(fill=FALSE) +\ntheme_few() +\ntheme(\n\
  plot.title = element_text(hjust = 0.5),\nplot.subtitle = element_text(hjust = 0.5)\n\
  )\n```\n\n`theme()` 函数用于修改图表主题的各个组件。图表主题代表图表中非数据部分的组件。你可以在控制台中输入 `?theme()` 来访问\
  \ `theme()` 的帮助文件，查看哪些组件可供修改以及与之关联的元素函数。`element_text()` 函数是与 `plot.title` 和 `plot.subtitle`\
  \ 组件关联的元素函数。将 `element_text()` 的 `hjust` 参数设置为 0.5 即可使文本居中对齐。\n\n### 步骤 21：将代码添加到\
  \ Power BI\n\n完整的 R 脚本见代码清单 2-2。复制代码并将其粘贴到 Power BI 中与此视觉对象关联的 R 脚本编辑器中。如果你正确遵循了步骤，则无需重构。\n\
  \n```\nlibrary(tidyverse)\nlibrary(scales)\nlibrary(ggthemes)\ncurrentColumns <-\n\
  \  c(\"Country\", \"Year\", \"Total Expend %\", \"callout\")\nif (all(currentColumns\
  \ %in% names(dataset))) {\n  plotdata <- dataset %>%\n    mutate(\n      rank =\
  \ dense_rank(desc(`Total Expend %`)),\n      `Country` = fct_reorder(`Country`,\
  \ rank, .desc = TRUE),\n      callout = ifelse(rank == 1, TRUE, FALSE)\n    ) %>%\n\
  \    filter(rank <= 7)\n  countryToAnnotate <- plotdata$`Country`[plotdata$rank\
  \ == 1]\n  minExpenditure <- min(plotdata$`Total Expend %`)\n  maxExpenditure <-\
  \ max(plotdata$`Total Expend %`)\n  minCountry <-\n    plotdata$`Country`[\n   \
  \   which(plotdata$`Total Expend %` == minExpenditure)]\n  minCountry <- paste(minCountry,\
  \ collapse = \" & \")\n  maxCountry <-\n    plotdata$`Country`[\n      which(plotdata$`Total\
  \ Expend %` == maxExpenditure)]\n  maxCountry <- paste(maxCountry, collapse = \"\
  \ & \")\n  mainTitle = \"% of Government Expenditure on Education\"\n  subTitle\
  \ =\n    paste(\n      \"The top 7 ranked countries in\",\n      reportYear,\n \
  \     sep = \" \")\n  caption =\n    \"Source: https://databank.worldbank.org/source/world-development-indicators\"\
  \n  label_val <-\n    str_wrap(\n      paste(maxCountry, \"spent\",\n          \
  \  percent((maxExpenditure/minExpenditure-1)),\n            \"more than\", minCountry,\
  \ sep = \" \"),\n      width = 25\n    )\n  p <-\n    ggplot(\n      data = plotdata,\n\
  \      aes(x = `Country`, y = `Total Expend %`, fill = callout,\n          label\
  \ = percent(`Total Expend %`))\n    ) +\n    geom_bar(stat=\"identity\", aes(fill\
  \ = callout)) +\n    geom_text(nudge_y = -0.05) +\n    scale_y_continuous(\n   \
  \   limits = c(0,0.75), labels = NULL, breaks = NULL) +\n    coord_flip() +\n  \
  \  annotate(\n      \"text\",\n      label = label_val,\n      x = countryToAnnotate[1],\n\
  \      y = maxExpenditure + 0.1) +\n    labs(\n      title = mainTitle,\n      subtitle\
  \ = subTitle,\n      caption = caption\n    ) +\n    xlab(label = NULL) +\n    ylab(label\
  \ = NULL) +\n    guides(fill=FALSE) +\n    theme_few() +\n    theme(\n      plot.title\
  \ = element_text(hjust = 0.5),\n      plot.subtitle = element_text(hjust = 0.5))\n\
  \  p\n} else {\n  plot.new()\n  title(\"The data supplied did not meet the requirements\
  \ of the chart.\")\n}\n代码清单 2-2\n标注图 R 脚本\n```\n\n## 气泡图\n\n`气泡图`是另一种流行的图表类型。你可以将其视为散点图，但增加了一个属性，即使用大小来表示另一个数据维度。因此，使用传统的`气泡图`，你最多可以展示五个维度的数据：\n\
  \n*   每个气泡的 `x` 和 `y` 代表两个维度。\n*   `fill`（气泡内部的颜色）代表一个维度。\n*   `size` 代表一个维度。\n\
  *   `labels` 代表一个维度。\n\n使用 `ggplot2`，你可以将事情提升到一个新的水平。你可以为气泡添加边框颜色，从而在你的`气泡图`中展示六个维度的数据！在本示例中，你将使用一个虚构的职业橄榄球联盟的数据，该数据在六个维度上绘制跑卫的信息：`name`、`height`、`weight`、`total\
  \ rushing yards`、`conference` 和 `division`。你将在本练习中创建的图表如图 2-11 所示。让我们逐步了解创建该图表的步骤。\n\
  \n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig10_HTML.jpg](img/480677_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10\n\n一个展示六个数据维度的气泡图\n\n### 步骤 1：获取必要的数据\n\n本示例中使用的数据集是一个虚构的职业橄榄球联盟的模拟数据集。该联盟有两个联盟：`AL（美国联盟）`和`USL（美国联盟）`。每个联盟包含四个分区：`North`、`South`、`East`\
  \ 和 `West`。该数据集包含该虚构联盟中跑卫的姓名、身高、体重、冲球码数、联盟和分区信息。包含该数据集的文件名是 `FakeFootballLeagueData.csv`，可以在本章的代码仓库中找到。\n\
  \n### 步骤 2：将数据加载到 Power BI\n\n使用 `GetData` 将数据加载到 Power BI 数据模型中。下表显示了每列应具有的数据类型：\n\
  \n| 列名 | 列数据类型 |\n| --- | --- |\n| ID | 整数 |\n| Year | 整数 |\n| Key | 整数 |\n| FN\
  \ | 文本 |\n| LN | 文本 |\n| Weight | 整数 |\n| Height | 整数 |\n| Rushing Yards | 整数 |\n\
  | Division | 文本 |\n| Conference | 文本 |\n\n将数据转换为上述格式所需的转换步骤包含在 `PBI_FakeFootballLeague.pbix`\
  \ 文件中。\n\n### 步骤 3：基于年份创建筛选切片器\n\n首先将 `Year` 字段拖到报表画布上，然后在`可视化`窗格中选择`切片器`视觉对象，从而基于年份字段创建一个报表切片器。确保你拖动的\
  \ `Year` 字段在选中`切片器`视觉对象之前处于高亮状态，以便将其转换为切片器。切片器视觉对象是图像中包含筛选器图标的那个。\n\n### 步骤 4：进行初始\
  \ R 视觉对象配置\n\n转到可视化窗格，将一个 R 视觉对象拖到报表画布上。将视觉对象调整到所需大小。将 `FakeFootballLeague` 表中的\
  \ `ID`、`Year`、`FN`、`LN`、`Weight`、`Height`、`Rushing Yards`、`Division` 和 `Conference`\
  \ 字段拖到`字段`窗格中。如果`字段`窗格未显示，请选中 R 视觉对象，它应该会出现。\n\n### 步骤 5：将数据导出到 R Studio 进行开发\n\n\
  单击 `R 脚本编辑器`标题栏上的 45° 箭头。此操作会将传递给 R 的数据框以及 R 起始代码导出到 `R Studio`。如果需要更详细的说明，请参考“标注图”部分中的步骤\
  \ 4。\n\n### 步骤 6：加载所需的包\n\n以下代码用于加载所需的包：\n\n```\nlibrary(tidyverse)\nlibrary(ggrepel)\n\
  library(ggthemes)\n```\n\n本脚本中使用了 `tidyverse` 中的 `dplyr` 和 `ggplot2` 包。`dplyr` 包用于将\
  \ Power BI 传递给 R 的数据整理成所需的形状，而 `ggplot2` 用于创建视觉对象。`ggrepel` 包用于在视觉格式中重新定位数据点的标签，`ggthemes`\
  \ 包用于更改视觉对象非数据组件的显示。\n\n\n\n### 步骤 7：创建数据验证测试所需的变量\n\n```\ncurrentColumns <- sort(colnames(dataset))\n\
  requiredColumns <- c(\"Conference\", \"Division\", \"FN\", \"Height\",\n\"ID\",\
  \ \"LN\", \"Rusing Yards\", \"Weight\",\n\"Year\")\ncolumnTest <- isTRUE(all.equal(currentColumns,\
  \ requiredColumns))\nreportYear <- unique(dataset$Year)\n```\n\n`currentColumns`\
  \ 变量用于保存从 Power BI 传递给 R 的数据框的列名。这些名称按字母顺序排序，以便进行比较。`requiredColumns` 变量用于保存所需列的名称。它们也按字母顺序列出，以便进行比较。`columnTest`\
  \ 变量保存比较测试的结果。它使用 `all.equal()` 函数来比较 `currentColumns` 变量和 `requiredColumns` 变量是否相等。如果这两个变量相等，则返回\
  \ `TRUE`；否则，返回关于两个变量之间哪些部分不相等的信息。你需要一个布尔响应，因此将 `all.equal()` 函数包裹在 `isTRUE()` 函数中，当\
  \ `all.equal()` 返回 `TRUE` 时，`isTRUE()` 将返回 `TRUE`；当 `all.equal()` 返回非 `TRUE` 值时，`isTRUE()`\
  \ 将返回 `FALSE`。接下来，使用 `unique()` 函数从 `Year` 列中获取唯一元素列表。\n\n### 步骤 8：创建数据验证测试\n\n\
  用于执行验证的模板如下：\n\n```\nif(length(reportYear) == 1 & columnTest) {\n\n} else{\nplot.new()\n\
  title(\"The data supplied did not meet the requirements of the\nchart.\")\n}\n```\n\
  \n`if` 语句执行两个测试。首先，它测试 `reportYear` 向量的长度是否等于 1。其次，它测试 `columnTest` 变量是否评估为 `TRUE`。如果这两个条件都满足，则执行创建可视化的代码。否则，执行创建空白图表的代码，并附带一条消息，告知用户为何未返回预期的可视化结果。\n\
  \n### 步骤 9：为会议和会议分区定义颜色\n\n`ggplot2` 的一个有用特性是，`ggplot2` 可以轻松自定义图表中想要使用的颜色。你可以使用\
  \ `ggplot2` 识别的颜色名称来定义图表，或者如果你知道颜色的十六进制表示，也可以使用它。在这里，你使用后者，通过命名字符向量来定义颜色。你使用命名字符向量来定义分区和会议的颜色。命名字符向量中元素的名称代表分区或会议，而命名字符向量中元素的值是代表你想要使用的颜色的十六进制数。以下是用于定义分区和会议颜色的代码：\n\
  \n```\ndivisionColors <- c(\"East\"=\"#56B4E9\", \"West\"=\"#33FAFF\",\n\"North\"\
  =\"#F0E442\", \"South\"=\"#8B8D8D\")\nconferenceColors <- c(\"USL\"=\"#000000\"\
  , \"AL\"=\"#FC4E07\")\n```\n\n这是一个网站的 URL，你可以用它来获取各种颜色的十六进制数：[`www.hexcolortool.com/#010328`](http://www.hexcolortool.com/%2523010328)。当你想要在原生\
  \ Power BI 可视化中使用某种颜色并需要其十六进制值时，也可以使用此网站。\n\n### 步骤 10：动态定义图表标题\n\n以下是创建图表标题的代码：\n\
  \n```\nchartTitle <- paste(\"Runningback Quad Chart for\",\nreportYear,\nsep = \"\
  \ \"\n)\n```\n\n该代码将字符串“Runningback Quad Chart for”与报告用户选择的报告年份连接起来，以动态创建图表标题。\n\
  \n### 步骤 11：创建图表的数据集\n\n传递给 Power BI 的数据集尚未完全准备好用于图表。你想为图表中每个跑卫的数据点添加一个标签。如果同时使用他们的名和姓，标签会太长，因此你需要一种方法来缩短它们。一个好方法是取名的首字母，并将其与姓连接起来。这在以下代码中实现：\n\
  \n```\nchartData %\nmutate(Name = paste0(str_sub(FN,1,1),\". \", LN))\n```\n\n上述代码从\
  \ `dataset` 数据框开始，然后向其投影一个名为 `Name` 的新列。它基于使用 `paste0` 函数连接三个字符串。第一个字符串使用 `stringr`\
  \ 包中的 `str_sub()` 函数从 `FN` 列中提取第一个字符。第二个字符串是 `\". \"`，第三个字符串是 `LN`。因此，如果 `FN` 是\
  \ John，`LN` 是 Doe，结果将是 `J. Doe`。\n\n### 步骤 12：通过定义 ggplot 函数开始创建图表\n\n你正在创建的气泡图将有六个维度。这六个维度是：\n\
  \n*   图表的 x 坐标，表示跑卫的体重\n*   y 坐标，表示跑卫的身高\n*   气泡的大小，表示跑卫的总冲球码数\n*   图表的填充（内部颜色），表示跑卫所在的分区\n\
  *   颜色（气泡边框），表示跑卫所在的会议\n*   标签，表示跑卫的名字\n\n你可以使用 `ggplot()` 函数中的 `aes()` 函数来设置这些维度，如下所示：\n\
  \n```\np <- ggplot(\nchartData,\naes(\nx = Weight, y = Height, size = `Rusing Yards`,\n\
  color = Conference, fill = Division, stroke = 2,\nlabel = Name\n)\n)\n```\n\n###\
  \ 步骤 13：使用 geom_point 几何对象为气泡图添加图层\n\n在 `geom_point()` 几何对象中，你可以使用 26 种形状。图 2-11\
  \ 是一个展示它们的可视化图。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig11_HTML.jpg](img/480677_1_En_2_Fig11_HTML.jpg)\n\
  \n**图 2-11** 展示了 `geom_point()` 中可用的形状。该可视化图是使用 `ggplot` 包创建的。\n\n有三种形状可用于创建气泡图。它们是形状\
  \ `1`、`16` 和 `21`。只有形状 `21` 允许你同时控制点的颜色（圆的边框）和填充（内部阴影）。形状 `1` 仅提供颜色，形状 `16` 仅提供填充。以下是使用形状\
  \ `21` 将 `geom_point()` 图层添加到可视化中的代码：\n\n```\np <- ggplot(\nchartData,\naes(\nx\
  \ = Weight, y = Height, size = `Rusing Yards`,\ncolor = Conference, fill = Division,\
  \ stroke = 2,\nlabel = Name\n)\n) +\ngeom_point(shape = 21)\n```\n\n结果如图 2-12 所示。\n\
  \n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig12_HTML.jpg](img/480677_1_En_2_Fig12_HTML.jpg)\n\
  \n**图 2-12** 使用形状 `21` 的初始气泡图。\n\n你已经构建了气泡图的基础。请注意，`geom_point()` 几何对象继承了 `ggplot()`\
  \ 函数的美学映射，因此你无需显式定义它们。现在，你需要进行一些外观上的调整，以使图表在视觉上更具吸引力。\n\n\n\n### 步骤 14：为气泡图添加标签\n\
  \n图表上散布着气泡，但你不知道每个气泡代表哪位运动员。你可以使用 `ggrepel` 包中的 `geom_text_repel()` 几何对象为可视化图表添加文本。`geom_text_repel()`\
  \ 几何对象在添加标签时会尽量避免重叠。以下是添加了 `geom_text_repel()` 层的代码：\n\n```\np <- ggplot(\nchartData,\n\
  aes(\nx = Weight, y = Height, size = `Rusing Yards`,\ncolor = Conference, fill =\
  \ Division, stroke = 2,\nlabel = Name\n)\n) +\ngeom_point(shape = 21) +\ngeom_text_repel(size\
  \ = 5)\n```\n\n添加 `geom_text_repel()` 层的结果如图 2-13 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig13_HTML.jpg](img/480677_1_En_2_Fig13_HTML.jpg)\n\
  \n图 2-13\n\n添加了标签的气泡图\n\n请注意，我们能够通过 `size` 参数控制标签的文本大小。如果没有添加 `size` 参数，标签的字体大小会根据气泡的大小而变化。\n\
  \n### 步骤 15：更改气泡边框颜色和气泡填充颜色\n\n接下来，你使用 `conferenceColors` 命名字符向量中的预定义颜色来更改气泡的颜色。具体做法是将\
  \ `conferenceColors` 设置为 `scale_color_manual()` 标度中 `values` 参数的值。你还需要使用 `divisionColors`\
  \ 变量中的预定义颜色来设置 `fill`。具体做法是将 `divisionColors` 设置为 `scale_fill_manual()` 标度中 `values`\
  \ 参数的值。包含这两个新标度的代码如下所示：\n\n```\np <- ggplot(\nchartData,\naes(\nx = Weight, y =\
  \ Height, size = `Rusing Yards`,\ncolor = Conference, fill = Division, stroke =\
  \ 2,\nlabel = Name\n)\n) +\ngeom_point(shape = 21) +\ngeom_text_repel(size = 5)\
  \ +\nscale_color_manual(values = conferenceColors) +\nscale_fill_manual(values =\
  \ divisionColors)\n```\n\n生成的可视化图表如图 2-14 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig14_HTML.jpg](img/480677_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14\n\n使用自定义颜色的气泡图\n\n### 步骤 16：创建 ggtitle\n\n你将 `chartTitle` 变量传递给 `ggtitle()`\
  \ 函数，为图表添加标题，如下面代码的最后一行所示：\n\n```\np <- ggplot(\nchartData,\naes(\nx = Weight, y\
  \ = Height, size = `Rusing Yards`,\ncolor = Conference, fill = Division, stroke\
  \ = 2,\nlabel = Name\n)\n) +\ngeom_point(shape = 21) +\ngeom_text_repel(size = 5)\
  \ +\nscale_color_manual(values = conferenceColors) +\nscale_fill_manual(values =\
  \ divisionColors) +\nggtitle(chartTitle)\n```\n\n### 步骤 17：设置主题\n\n在下面的代码中，你将可视化图表的主题设置为\
  \ `ggthemes` 包中的 `theme_few()` 主题：\n\n```\np <- ggplot(\nchartData,\naes(\nx = Weight,\
  \ y = Height, size = `Rusing Yards`,\ncolor = Conference, fill = Division, stroke\
  \ = 2,\nlabel = Name\n)\n) +\ngeom_point(shape = 21) +\ngeom_text_repel(size = 5)\
  \ +\nscale_color_manual(values = conferenceColors) +\nscale_fill_manual(values =\
  \ divisionColors) +\nggtitle(chartTitle) +\ntheme_few()\n```\n\n### 步骤 18：将代码添加到\
  \ Power BI\n\n现在你有了一个能生成所需可视化图表的可用脚本。完整的脚本如下。将清单 2-3 中的脚本添加到 Power BI 中与该可视化图表关联的\
  \ `R 脚本编辑器` 中。该可视化图表将对报表中使用的 `Year` 筛选器做出响应。\n\n```\nlibrary(tidyverse)\nlibrary(ggrepel)\n\
  library(ggthemes)\ncurrentColumns <- c(\"FN\", \"LN\", \"Weight\", \"Height\", \"\
  Rusing Yards\", \"Conference\", \"Division\", \"Year\")\nif (all(currentColumns\
  \ %in% colnames(dataset))) {\nchartData <- dataset %>%\nfilter(Year == reportYear)\
  \ %>%\nmutate(Name = paste0(substring(FN,1,1),\". \", LN))\ndivisionColors <-\n\
  c(\"East\"=\"#56B4E9\", \"West\"=\"#009E73\", \"North\"=\"#F0E442\",\n\"South\"\
  =\"#0072B2\")\nconferenceColors <- c(\"USL\"=\"#000000\", \"AL\"=\"#FC4E07\")\n\
  chartTitle <-\npaste(\"Runningback Quad Chart for\", reportYear, sep = \" \")\n\
  p <- ggplot(\nchartData,\naes(\nx = Weight, y = Height, size = `Rusing Yards`,\n\
  color = Conference, fill = Division, stroke = 2,\nlabel = Name\n)\n) +\ngeom_point(shape\
  \ = 21) +\ngeom_text_repel(size = 5) +\nscale_color_manual(values = conferenceColors)\
  \ +\nscale_fill_manual(values = divisionColors) +\nggtitle(chartTitle) +\ntheme_few()\n\
  p\n} else{\nplot.new()\ntitle(\"The data supplied did not meet the requirements\
  \ of the\nchart.\")\n}\n```\n\n清单 2-3\n\n气泡图 R 脚本\n\n## 预测\n\n预测业务结果是一种被公司使用多年的技术。许多商业智能工具都提供了预测可视化功能，你可以将其添加到仪表板中显示预测结果，但这些功能提供的信息量非常有限。它们之所以有限，是因为通常只显示预测结果，而忽略了影响预测的重要组件。这些组件包括`趋势`和`季节性`。预测的`趋势`用于显示数据在长期内是下降还是上升。预测的`季节性`用于显示由发生时间引起的数据变化。幸运的是，Facebook\
  \ 的数据科学团队为 R 语言开发了一个名为 `Prophet` 的包，它不仅使你能够创建强大的预测可视化图表，还能让你创建可视化图表，从而获得关于构成预测的不同组件的宝贵信息。\n\
  \n在本练习中，你将构建一个受 `Prophet` 文档中示例启发的可视化图表。`Prophet` 中的示例创建了一个预测佩顿·曼宁维基百科页面浏览量的可视化图表。佩顿是前\
  \ NFL 四分卫。你将在 `Prophet` 示例的基础上进行扩展，构建一个交互式可视化图表，使你能够在两位现役 NFL 四分卫拉马尔·杰克逊和德肖恩·沃森之间切换。该可视化图表不仅包含预测图表，还包含显示预测趋势的图表，以及显示周度和年度季节性的图表。该可视化图表的图像如图\
  \ 2-15 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig15_HTML.jpg](img/480677_1_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15\n\n使用 Prophet 和 ggplot2 生成的预测可视化图表\n\n让我们来看看创建这个自定义 R 可视化图表所需的步骤！\n\n\n\
  \n### 步骤 1：获取必要数据\n\n你需要获取包含拉马尔·杰克逊和德肖恩·沃森每日维基百科浏览量的数据。以下是获取数据所需执行的步骤。请注意，你需要将这些步骤执行两次，一次针对拉马尔·杰克逊，一次针对德肖恩·沃森：\n\
  \n1.  访问 [`https://en.wikipedia.org/wiki/Wikipedia:Web_statistics_tool`](https://en.wikipedia.org/wiki/Wikipedia:Web_statistics_tool)\
  \ 以打开 *维基百科网络统计工具*。\n2.  点击 *当前工具* 部分中的 [toollabs:​pageviews](https://tools.wmflabs.org/pageviews)\
  \ 链接。\n3.  点击搜索栏上方的 *X 清除* 以清空页面名称，然后输入你想要测试的页面名称。第一次迭代使用 *Lamar Jackson*，第二次迭代使用\
  \ *Deshaun Watson*。\n4.  点击 *日期* 文本框，然后选择自定义范围。\n5.  选择一个至少包含 2 年时间跨度的数据范围。此要求是为了让\
  \ *Prophet* 包有足够的信息来检测年度季节性趋势。在本示例中，我选择 2018 年 1 月 1 日作为开始日期，2019 年 12 月 31 日作为结束日期。\n\
  6.  点击 *页面* 文本框下方 *下载* 按钮中的向下箭头，然后选择 *CSV* 选项。该操作将启动下载过程，并将查询结果以 *csv* 格式保存到你的计算机上。默认文件名不会提供关于查询主题的信息。请将文件重命名为能代表文件内容的名称。我为每个文件添加了主题的姓名首字母作为前缀。拉马尔·杰克逊使用\
  \ *lj*，德肖恩·沃森使用 *dw*。\n7.  接下来，你需要将拉马尔·杰克逊和德肖恩·沃森的数据集加载到 Power BI 中，进行可视化所需的一些数据转换，然后将它们合并成一个数据集。这将使用\
  \ Power Query 来完成。最终的数据集需要包含以下字段及其对应的数据类型：\n\n| 列名 | 数据类型 |\n| --- | --- |\n| 日期\
  \ | 文本 |\n| 页面浏览量 | 整数 |\n| 四分卫 | 文本 |\n| 页面浏览量（Log10） | 小数 |\n\n使用 Power Query\
  \ 进行转换以获取上述格式数据的具体步骤，可在本章代码仓库中的 *pbix* 文件中找到。\n\n### 步骤 2：基于四分卫创建切片器\n\n将 *四分卫*\
  \ 字段拖到报表画布的右上方。接下来，转到右上角的 *可视化* 窗格，将可视化效果更改为 *切片器* 可视化对象。*切片器* 可视化对象是 Power BI 中预装的，其图标包含一个筛选器图片。\n\
  \n### 步骤 3：配置 R 可视化对象\n\n转到可视化窗格，将一个 R 可视化对象拖到报表画布上。将可视化对象调整到所需大小。将 *WikipediaPageViews*\
  \ 表中的 *日期*、*页面浏览量*、*页面浏览量（Log10）* 和 *四分卫* 字段拖放到 *字段* 窗格中。如果字段窗格未显示，请选中 *R 可视化对象*，它应该就会出现。\n\
  \n### 步骤 4：将数据导出到 R Studio 进行开发\n\n点击 *R 脚本编辑器* 标题栏上的 45° 箭头。此操作会将传递给 *R 可视化对象*\
  \ 的数据框以及 R 起始代码导出到 *R Studio*。如果需要更详细的解释，请参考“*标注图*”部分中的步骤 4。\n\n### 步骤 5：将所需包加载到脚本中\n\
  \n以下是加载脚本所需包的代码：\n\n```\nlibrary(tidyverse)\nlibrary(prophet)\nlibrary(ggthemes)\n\
  library(gridExtra)\nlibrary(lubridate)\n```\n\n来自 `tidyverse` 的 `dplyr` 包用于执行一些数据整理任务，来自\
  \ `tidyverse` 的 `ggplot2` 包用于创建可视化，`prophet` 包用于执行预测并帮助创建可视化，`gridExtra` 包用于在单个可视化对象中实现多图表显示，`lubridate`\
  \ 包用于执行一些日期操作任务。\n\n### 步骤 6：创建数据验证测试所需的变量\n\n用于创建验证变量的代码如下所示：\n\n```\ncurrentColumns\
  \ <- sort(colnames(dataset))\nrequiredColumns <- c(\"Date\", \"Page Views\", \"\
  Page Views (Log10)\",\n\"Quarterback\")\ncolumnTest <- isTRUE(all.equal(currentColumns,\
  \ requiredColumns))\nqb <- unique(dataset$Quarterback)\n```\n\n`currentColumns`\
  \ 字符向量变量用于保存从 Power BI 传递给 R 的数据框的列名。这些名称按字母顺序排序以便比较。`requiredColumns` 字符向量变量用于保存所需列的名称。它们也按字母顺序列出以便比较。`columnTest`\
  \ 变量保存比较测试的结果。它使用 `all.equal()` 函数比较 `currentColumns` 变量和 `requiredColumns` 变量是否相等。如果这两个变量相等，则返回\
  \ `TRUE`；否则，返回关于两个变量之间哪些内容不相等的信息。你需要一个布尔响应，因此将 `all.equal()` 函数包裹在 `isTRUE()` 函数中，当\
  \ `all.equal()` 返回 `TRUE` 时，`isTRUE()` 将返回 `TRUE`，当 `all.equal()` 返回非 `TRUE` 值时，`isTRUE()`\
  \ 将返回 `FALSE`。最后要做的是获取 *四分卫* 列中的所有唯一元素，并将结果赋值给 `qb` 变量。\n\n### 步骤 7：创建数据验证测试\n\n\
  用于执行验证测试的模板如下：\n\n```\nif (length(qb) == 1 & columnTest) {\n\n} else {\nplot.new()\n\
  title(\"提供的数据不符合图表的要求。\")\n}\n```\n\n该可视化对象需要一个仅包含一名四分卫且具有所需列的数据集。第一个测试检查 `qb` 变量的长度是否为\
  \ 1。如果等于 1，则表示数据集中只有一名四分卫，因此该测试通过。第二个测试检查从 Power BI 传递的数据框是否包含所需的列。如果 `columnTest`\
  \ 变量等于 `TRUE`，则该测试通过。如果两个测试结果都为 `TRUE`，则 R 将尝试执行创建可视化对象的代码。否则，将执行创建空白图表的代码，并附带一条消息，说明为何未创建预期的可视化对象。\n\
  \n### 步骤 8：创建动态图表标题\n\n以下代码创建一个变量，用于保存基于四分卫姓名动态创建的图表标题：\n\n```\nchartTitle <-\n\
  paste0(qb, \" 的维基百科页面浏览量预测分析\")\n```\n\n它将四分卫的姓名与字符串“ 的维基百科页面浏览量预测分析”连接起来，中间不使用任何分隔符。`paste0()`\
  \ 函数与 `paste()` 函数类似。它用于在不需要分隔符的情况下连接字符串。\n\n### 步骤 9：创建生成预测所需的数据集\n\n```\ndfPageViews\
  \ %\ntransmute(\nQuarterback,\nds = ymd(Date),\ny = `Page Views (Log10)`\n)\n```\n\
  \n`prophet` 包只需要两个变量：`ds` 和 `y`。`ds` 变量用于日期。日期应该是连续的，并且至少跨越 2 年的时间段。`y` 变量代表你想要预测的结果，即\
  \ *页面浏览量* 的对数。\n\n请注意，你使用的是页面浏览量的对数，而不是实际的页面浏览量。这是一种常见的技术，适用于像本示例中数据分散度较高的情况。使用页面浏览量的对数可以减少分散度，使数据更易于可视化。在构建数据科学模型时，使用对数变换也是特征工程中常用的一种技术。\n\
  \n\n\n### 步骤 10：生成预测\n\n以下三行代码用于生成预测：\n\n```\nm <- prophet(dfPageViews)\nfuture\
  \ <- make_future_dataframe(\nm,\nperiods = 365,\nfreq = \"day\",\ninclude_history\
  \ = TRUE\n)\nforecast <- predict(m, future)\n```\n\n第一行基于 `dfPageViews` 数据框生成一个预测模型对象。第二行代码创建一个数据框，该数据框在\
  \ `dfPageViews` 数据框的日期末尾添加了 `periods` 参数中指定的周期数。周期的频率由 `freq` 参数定义，如果将 `include_history`\
  \ 参数设置为 `TRUE`，则历史日期也会包含在数据框中。第三行通过 `predict()` 函数，使用第一行创建的模型和 `future` 数据框生成预测。\n\
  \n### 步骤 11：生成图表\n\n在此步骤中，您将生成四个图表。这四个图表分别是：\n\n-   预测图\n-   显示基础数据趋势的图\n-   显示周季节性的图\n\
  -   显示年季节性的图\n\n用于创建这些图表的代码如下所示：\n\n```\np1 <- plot(m, forecast) + ggtitle(chartTitle)\
  \ + theme_few()\np <- prophet_plot_components(m, forecast)\np2 <- p[[1]] + theme_few()\n\
  p3 <- p[[2]] + theme_few()\np4 <- p[[3]] + theme_few()\np5 <- grid.arrange(p1, p2,\
  \ p3, p4, nrow =4)\np5\n```\n\n生成的视觉效果已在图 2-15 中展示。图 2-15 中的视觉效果非常有价值，因为您不仅拥有预测的视觉效果，还拥有影响预测的各个组件的视觉效果。您可以通过\
  \ `trend` 图查看数据的趋势，通过 `weekly` 图查看数据在一周内的典型变化，以及通过 `yearly` 图查看数据在一年内的典型变化。\n\n\
  您需要做的第一件事是分别定义每个图表。以下是每个图表如何单独定义的说明：\n\n-   `p1` 用于保存实际预测的视觉效果。它是使用 `Prophet` 包中的\
  \ `plot()` 函数构建的，该函数底层基于 `ggplot` 构建。因此，您可以对其应用 `theme_few()` 主题。\n-   `p` 用于保存由\
  \ `Prophet` 通过 `prophet_plot_components()` 函数生成的组件图表。此函数返回一个 `ggplot` 图表列表，代表预测的不同组件。在本例中，它是一个趋势图、一个周季节性图和一个年季节性图。\n\
  -   `p2`、`p3` 和 `p4` 保存由 `p` 生成的三个单独的组件图表。如前所述，`p` 是一个 `ggplot` 图表列表。您需要将每个图表作为\
  \ `ggplot` 图表从 `p` 中提取出来。这可以通过使用双方括号 `[[` 来实现。当您在 R 中使用单方括号 `[` 从列表中提取对象时，返回的项目是一个包含一个元素的列表，而不是底层元素实际数据类型的单个对象。因此，在此示例中，`p[1]`\
  \ 不会返回一个 `ggplot` 图表，而是返回一个包含一个项目的列表，该项目是一个 `ggplot` 图表。如果您想显式地以其真实数据类型返回该项目，则需要像前面代码中那样使用双方括号\
  \ `[` 进行提取。请注意，由于每个图表都是作为 `ggplot` 图表提取的，因此您可以对它们每个应用 `theme_few()` 主题。\n\n现在，您已将预测视觉效果保存为\
  \ `ggplot` 对象，并将每个预测组件的视觉效果保存为 `ggplot` 对象，您可以使用 `gridExtra` 包中的 `grid.arrange()`\
  \ 函数将它们组合成一个视觉效果。这在前面的代码的第 6 行中完成。您希望图表彼此堆叠。通过将 `nrow` 参数设置为 4 来完成此任务。您可以使用此参数控制视觉效果在屏幕上的显示方式。例如，如果将该参数设置为\
  \ 2，则会将图表组合成两行，每行两个图表。\n\n### 步骤 12：将代码添加到 Power BI\n\n用于创建预测视觉效果的完整脚本位于清单 [2-4\
  \ 中。将其复制并粘贴到 Power BI 的 `R 脚本编辑器` 中。该视觉效果将对 Quarterback 切片器完全响应。\n\n```\nlibrary(tidyverse)\n\
  library(prophet)\nlibrary(ggthemes)\nlibrary(gridExtra)\nlibrary(lubridate)\nlibrary(rlang)\n\
  # 我需要加载 rlang。请查看此包。\ncurrentColumns <- dfPageViews %>%\n  mutate(Date = ymd(Date))\
  \ %>%\n  rename(ds = Date, y = `Page Views (Log10)`)\nm <- prophet(dfPageViews,\
  \ yearly.seasonality=TRUE)\nfuture <- make_future_dataframe(m, periods = 365)\n\
  forecast <- predict(m, future)\np1 <- plot(m, forecast) + ggtitle(chartTitle) +\
  \ theme_few()\np <- prophet_plot_components(m, forecast)\np2 <- p[[1]] + theme_few()\n\
  p3 <- p[[2]] + theme_few()\np4 <- p[[3]] + theme_few()\np5 <- grid.arrange(p1, p2,\
  \ p3, p4, nrow =4)\np5\n} else {\nplot.new()\ntitle(\"提供的数据不符合图表要求。\")\n}\n清单 2-4\n\
  生成预测图表的 R 脚本\n```\n\n## 带阴影的折线图\n\n折线图可以说是数据可视化中最流行的图表之一。它非常适合绘制跨越一段时间的数据。由于其使用广泛，所有\
  \ BI 工具都原生支持它。\n\n在本练习中，您将学习如何使用 R 在 Power BI 中创建折线图。此折线图将不是您典型的折线图。它将包含截至撰写本文时\
  \ Power BI 中尚不可用的增强功能。您将创建的 R 自定义视觉效果灵感来自 Hadley Wickham 在他的书 *Ggplot2: Elegant\
  \ Graphics for Data Analysis*（第 2 版，第 44 页）中创建的视觉效果。他在书中创建的视觉效果使用背景阴影技术来识别图表中特定时间点在职的总统。您将在\
  \ Power BI 中创建一个交互式 R 自定义视觉效果，该视觉效果将执行类似的操作，但有所增强。您将创建的视觉效果如图 2-16 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig16_HTML.jpg](img/480677_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16\n\n折线图显示 GDP 百分比变化，背景阴影基于阴影时间段内执政的政党\n\nR 自定义视觉效果绘制了从 1947 日历年到 2018 日历年的\
  \ `GDP 百分比变化`。此图表的独特之处在于，背景阴影显示了给定时间点总统所属的政党。您利用 Power BI 的交互性进一步增强视觉效果。除了总统所属政党的视图外，您还让最终用户能够更改背景，以显示在给定时间点代表美国参议院多数席位的政党、代表美国众议院多数席位的政党以及总体多数党。除此之外，您还将让最终用户能够在显示\
  \ `实际 GDP` 和 `GDP 百分比变化` 之间切换。下图 2-17 显示了实际 GDP 的总体多数党视图。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig17_HTML.jpg](img/480677_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17\n\n折线图显示实际 GDP，背景阴影基于阴影时间段内总体执政的政党\n\n现在您已经看到了 R 自定义视觉效果，让我们来看看在 Power\
  \ BI 中创建该视觉效果必须采取的步骤！\n\n\n\n### 步骤 1：获取必要数据\n\n1.  访问 [`https://fred.stlouisfed.org/series/GDP`](https://fred.stlouisfed.org/series/GDP)，该链接将跳转至圣路易斯联储官网中专门展示历史\
  \ GDP 信息的页面。点击 `EDIT GRAPH` 按钮，将 `Modify frequency` 组合框中的值更改为 `Annual`，并将 `Aggregation\
  \ method` 更改为 `End of Period`。点击弹出表单右上角的 `X` 关闭表单。\n\n2.  点击 `DOWNLOAD` 按钮，选择 `CSV`\
  \ 格式。在撰写本文时，此操作会将一个名为 `GDP.csv` 的 `csv` 文件下载到我的电脑上。\n\n3.  进入本示例的代码仓库，找到 `PoliticalInfoWithGDP.xlsx`\
  \ 工作簿。该工作簿包含用于创建本示例中 `PoliticalInfoWithGDP` 数据集的数据集和 Power Query 查询。`PoliticalInfoWithGDP`\
  \ 是本练习中将要生成的视觉对象的数据源。大部分工作已为您完成，但您可以检查工作簿，了解如何将以下数据集合并以生成 `PoliticalInfoWithGDP`\
  \ 数据集。以下是在 `PoliticalInfoWithGDP.xlsx` 工作簿中使用 Power Query 开发的每个查询的描述：\n    1.  `GDP`：此查询导入步骤\
  \ 2 中下载的 GDP 数据，并在数据集中添加一个 `% GDP Change` 列。\n    2.  `Presidents`：此查询构建了一个数据集，列出了分析期间内的所有美国总统，并附带一列显示其政治派别。\n\
  \    3.  `Political Info`：此查询从以下 URL 的维基百科文章中获取信息：[`https://en.wikipedia.org/wiki/Party_divisions_of_United_States_Congresses`](https://en.wikipedia.org/wiki/Party_divisions_of_United_States_Congresses)。该\
  \ URL 的信息用于获取 `Senate` 和 `House of Representative` 的多数党以及当时的在任总统。使用 `Power Query`\
  \ 重塑数据以用于可视化。您可以按照 `Power Query` 中的步骤查看具体操作。\n        > `Power Query` 是一种内置于多种 Microsoft\
  \ 技术（如 Microsoft Excel、Power BI、Power BI Dataflows 和 SQL Server Analysis Services）中的数据整理工具。它拥有图形用户界面，能大幅缩短执行简单数据整理所需的时间。我强烈推荐不熟悉\
  \ Microsoft 生态系统的 R 和 Python 开发者了解一下这个出色的工具！\n    4.  `PoliticalInfoWithGDP`：合并上述数据集，并通过\
  \ `Power Query` 将结果整理成本示例可视化所需的形状。\n\n4.  如前所述，`PoliticalInfoWithGDP` 数据集是用于可视化的数据集，并已通过上述\
  \ Power Query 构建完成。它已保存为名为 `PoliticalInfoWithGDP.csv` 的 `csv` 文件。您可以在本示例的代码仓库中找到该文件。\n\
  \n### 步骤 2：将数据加载到 Power BI\n\n通过选择 `Home` ➤ `GetData` ➤ `Text/CSV`，将 `PoliticalInfoWithGDP.csv`\
  \ 加载到 Power BI，然后浏览到您保存文件的位置。点击 `Transform Data` 按钮进入 Power Query 编辑器。检查并确保字段具有以下数据类型：\n\
  \n| 列 | 数据类型 |\n| --- | --- |\n| Index | 整数 |\n| Year | 整数 |\n| GDP | 小数 |\n| %\
  \ GDP Change | 小数 |\n| Senate Majority | 文本 |\n| House Majority | 文本 |\n| President’s\
  \ Majority | 文本 |\n| Overall Majority | 文本 |\n\n如果列不具备上述数据类型，请将其更改为相应的数据类型。更改数据类型最简单的方法是右键单击相关列，然后选择\
  \ `Change Type`。将出现可用数据类型列表。选择适用于该列的数据类型。确认数据类型正确后，点击 `Close & Apply` 将数据加载到 Power\
  \ BI 数据模型中。\n\n转到表格，确保 `Year` 和 `Index` 的默认行为设置为 `Do Not Summarize`。为此，请在 `Fields`\
  \ 窗格中选择该字段，然后转到 `Modeling` ➤ `Default Summarization`（位于 `Properties` 部分），并选择 `Don’t\
  \ Summarize`。\n\n### 步骤 3：创建报表切片器\n\n报表有两个切片器。一个切片器用于让最终用户选择政治视图（`House`、`Senate`、`President`\
  \ 或 `Overall`），另一个切片器用于选择用户想要显示的 GDP 统计指标（`Actual GDP` 或 `GDP % Change`）。此步骤的工作已在您可以在本示例代码仓库中找到的入门\
  \ `pbix` 模板中为您完成。\n\n### 步骤 4：配置 R 视觉对象\n\n转到 `Visualization pane`，将 `R visual`\
  \ 拖到报表画布上。R 视觉对象图标位于 `Visualization` 窗格的右下部分。将视觉对象调整到所需大小。将 `Year`、`GetPoliticalLevel`、`GetPoliticalLevelName`、`GetGDPStat`\
  \ 和 `GetGDPStatName` 添加到位于 `Visualization` 窗格下方的 `Fields` 窗格中。有时 Microsoft Power\
  \ BI 会默认对数字字段应用聚合函数。检查它是否尝试对 `Year` 字段执行此操作。如果应用了聚合函数，请点击 `Fields` 窗格中该字段的下拉箭头，然后选择\
  \ `Don’t Summarize` 将其移除。\n\n### 步骤 5：将数据导出到 R Studio 进行开发\n\n点击 `R script editor`\
  \ 标题栏上的 45° 箭头。此操作会将传递给 R 的数据框和 R 入门代码导出到 `R Studio`。如果您需要更详细的说明，请参阅“标注图”部分中的步骤\
  \ 4。\n\n### 步骤 6：将所需包加载到脚本中\n\n加载所需包所需的代码如下所示：\n\n```\nlibrary(tidyverse)\nlibrary(ggthemes)\n\
  library(scales)\n```\n\n来自 `tidyverse` 的 `dplyr` 包将用于执行一些数据整理任务，来自 `tidyverse` 的\
  \ `ggplot2` 包将用于创建可视化，来自 `ggthemes` 包的 `economist` 主题用于格式化图表的非数据部分，而 `scales` 包中的一些函数将用于数字格式化。\n\
  \n\n\n### 第 7 步：创建数据验证测试所需的变量\n\n以下是验证测试的代码：\n\n```\ncurrentColumns <- sort(colnames(dataset))\n\
  requiredColumns <-\nc(\"GetGDPStat\", \"GetGDPStatName\", \"GetPoliticalLevel\"\
  ,\n\"GetPoliticalLevelName\", \"Year\")\ncolumnTest <- isTRUE(all.equal(currentColumns,\
  \ requiredColumns))\npoliticalLevelName <- unique(dataset$GetPoliticalLevelName)\n\
  gdpStatName <- unique(dataset$GetGDPStatName)\n```\n\n将执行以下三项测试：\n\n-   一项测试，确保传递给可视化的数据集包含必要的字段\n\
  -   一项测试，确保数据集中仅包含一种政治观点\n-   一项测试，确保数据集中仅包含一项 GDP 统计数据\n\n我们来详细讲解第一个测试中使用的代码。代码如下：\n\
  \n```\ncurrentColumns <- sort(colnames(dataset))\nrequiredColumns <-\nc(\"GetGDPStat\"\
  , \"GetGDPStatName\", \"GetPoliticalLevel\",\n\"GetPoliticalLevelName\", \"Year\"\
  )\ncolumnTest <- isTRUE(all.equal(currentColumns, requiredColumns))\n```\n\n第一行代码从传递给\
  \ R 的数据集中获取列名，并将其赋值给一个名为 `currentColumns` 的字符向量。`sort()` 函数用于按字母顺序对列名进行排序。下一行代码创建了一个包含所需字段的字符向量，并将其命名为\
  \ `requiredColumns`。请注意，这些名称是按字母顺序提供的。这样做是为了确保可以直接与 `currentColumns` 字符向量进行比较。第三行代码通过使用\
  \ `all.equal()` 函数比较 `currentColumns` 字符向量和 `requiredColumns` 字符向量来执行测试。当 `currentColumns`\
  \ 等于 `requiredColumns` 时，返回 `TRUE`。否则，会返回试图解释它们为何不匹配的信息。你需要一个布尔响应，因此使用 `isTRUE()`\
  \ 函数包裹 `all.equal()`。这样做后，当 `all.equal()` 返回 `TRUE` 时，将返回 `TRUE`；否则，将返回 `FALSE`。\n\
  \n接下来，使用以下代码创建两个字符向量，分别用于存储 `GetPoliticalLevelName` 字段和 `GetGDPStatName` 字段中的唯一元素：\n\
  \n```\npoliticalLevelName <- unique(dataset$GetPoliticalLevelName)\ngdpStatName\
  \ <- unique(dataset$GetGDPStatName)\n```\n\n理想情况下，两者都只包含一个元素，这将在下一步中进行测试。\n\n###\
  \ 第 8 步：创建数据验证测试\n\n验证所使用的模板如下：\n\n```\nif(length(politicalLevelName) == 1 &\nlength(gdpStatName)\
  \ == 1 & columnTest) {\n\n} else {\nplot.new()\ntitle(\"提供的数据不符合图表要求。\")\n}\n```\n\
  \n如果 `GetPoliticalLevelName` 字段中只有一个值，`GetGDPStatName` 字段中只有一个值，并且 `columnTest`\
  \ 评估为 TRUE，则前面的 `if` 语句将执行构建可视化所需的代码。\n\n### 第 9 步：基于 `dataset` 数据框创建一个新的数据框\n\n\
  最佳实践是不修改从 Power BI 传递给 R 的 `dataset` 数据框。为了避免修改该数据框，你需要基于 `dataset` 数据框创建一个新的数据框，然后修改这个新数据框。以下是用于创建新数据框的代码：\n\
  \n```\ndfPI <- dataset\n```\n\n### 第 10 步：创建将用于图表动态部分的变量\n\n以下是定义这些变量所需的代码：\n\n\
  ```\npoliticalLevelName <- unique(dfPI$GetPoliticalLevelName)\ngdpStatName <- unique(dfPI$GetGDPStatName)\n\
  yAxisName <-\npaste(\ngdpStatName,\nifelse(gdpStatName == \"Actual GDP\",\"(单位：十亿)\"\
  ,\"\"),\nsep = \" \"\n)\nchartTitle <- paste(gdpStatName, \"分析\", sep = \" \")\n\
  chartSubtitle <- paste(politicalLevelName, \"视图\", sep = \" \")\n```\n\n前面的代码动态生成了\
  \ `y` 轴的标签、图表标题和图表副标题。前两行获取 `政治级别` 和 `GDP 统计数据`，并将信息存储起来供后续使用。下一行代码（由于格式原因，在前面的代码片段中实际为六行）用于创建\
  \ `y` 轴的标签。它使用 `paste()` 函数将 `gdpStatName` 变量的值与字符串 `(单位：十亿)` 组合起来（如果所使用的 GDP 统计数据是\
  \ `实际 GDP`）。结果赋值给 `yAxisName` 变量。第四行代码通过使用空格分隔符连接 `gdpStatName` 变量的值和单词“分析”，动态构建主图表标题。最后一行代码通过使用空格分隔符连接\
  \ `politicalLevelName` 变量的值和单词“视图”，动态创建图表副标题。\n\n\n\n### 步骤 11：创建背景阴影所需的数据集\n\n\
  在此步骤中，你将使用 `dfPI` 数据框中的数据，并将其转换为可视化背景阴影部分所需的数据集。首先，让我们快速查看一下图 2-18 中的数据框。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig18_HTML.jpg](img/480677_1_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18  \n`dfPI` 数据框预览\n\n你需要使用上述数据创建一个数据集，该数据集包含每个连续政党执政期的开始时间和结束时间。你需要获取上述数据框，并编写代码将其转换为图\
  \ 2-19 中的数据框格式。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig19_HTML.jpg](img/480677_1_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19  \n所需的数据框格式\n\n为了实现这种转换，你需要能够唯一标识每个连续的政党执政期。目前，每个政党执政期没有唯一的标识符，因此你需要添加一个。一旦添加完成，你就可以使用传统的聚合方法来获取每个执政期的开始和结束年份。让我们先来了解一下添加唯一标识符（你将其命名为\
  \ `group_id`）所需的步骤。生成 `group_id` 信息的代码如下所示：\n\n```\ndfPI$GetPoliticalLevel <- as.character(dfPI$GetPoliticalLevel)\n\
  runs <- rle(dfPI$GetPoliticalLevel)\ngroup_id <- rep(seq_along(runs$lengths), runs$lengths)\n\
  ```\n\n第 1 行首先进行的是数据类型转换。在 R 语言中，对于 R 4.0 之前的版本，包含字符串的数据框列的默认数据类型是 `factor`（因子）。\n\
  \n在撰写本书时，Power BI 服务尚未更新到 R 4.0 版本。如果你在练习时仍处于这种情况，那么你也需要进行转换。如果 Power BI 服务已更新到\
  \ R 4.0 或更高版本，则无需执行转换步骤。\n\n由于 `GetPoliticalLevel` 列中的数据都是字符串，R 语言已将其转换为 `factor`\
  \ 数据类型。为了执行此步骤所需的数据处理，你需要将 `GetPoliticalLevel` 转换为字符数据类型。该数据类型与 DAX 中的 `Text` 数据类型类似。这通过第一行代码完成。接下来，你要使用基础\
  \ R 中的 `rle()` 函数来定义 `GetPoliticalLevel` 列中的分组。`rle()` 函数中的 “rle” 代表*游程编码*。当你将 `GetPoliticalLevel`\
  \ 列传递给 `rle()` 函数时，会得到如图 2-20 所示的输出结果。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig20_HTML.jpg](img/480677_1_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20  \n`rle()` 函数的输出结果\n\n`rle()` 函数返回了一个包含两个向量的列表。第一个向量名为 `lengths`，在此示例中，它包含每个执政期的长度。第二个向量名为\
  \ `values`，在此示例中，它包含每个执政期执政的政党。`rle()` 函数返回的信息保存在 `runs` 变量中。\n\n`runs` 变量中包含的信息用于通过以下代码创建\
  \ `group_id` 向量：\n\n```\ngroup_id <- rep(seq_along(runs$lengths), runs$lengths)\n\
  ```\n\n首先，使用 `seq_along()` 函数生成一个整数序列，该序列将代表 `group_id`。由于 `runs$length` 的长度为 9，因此将返回一个包含数字\
  \ 1 到 9 的整数向量。该表达式作为第一个参数放入 `rep()` 函数中，而向量 `runs$length` 作为第二个参数放入。由于两个参数都包含长度相同的向量，`rep`\
  \ 函数将取 `seq_along()` 函数生成的第一个元素（在本例中为数字 1），并按照第二个整数向量中表示的次数（在本例中为 3）重复它。因此，数字 1\
  \ 将被重复三次。接下来，数字 2 将被重复四次，因为 `runs$lengths` 中第二个元素的值为 4。此逻辑对 `runs$lengths` 中的每个元素重复执行，最终输出结果如图\
  \ 2-21 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig21_HTML.jpg](img/480677_1_En_2_Fig21_HTML.jpg)\n\
  \n图 2-21  \n`group_id` 变量的输出结果\n\n接下来，你使用以下代码创建用于可视化的数据集：\n\n```\ndfShadeInfo <-\
  \ cbind(dfPI, group_id) %>%\n  transmute(group_id, Year, Party = GetPoliticalLevel)\
  \ %>%\n  group_by(group_id, Party) %>%\n  summarize(start = min(Year), end = max(Year)+0.99)\
  \ %>%\n  ungroup()\n```\n\n上述代码首先使用 `cbind()` 函数将 `group_id` 向量作为新列追加到 `dfPI` 数据框中，其中\
  \ `cbind()` 中的 `c` 代表列（column）。接下来，使用管道操作符 `%>%` 将生成的数据框作为第一个参数传递给下一行的 `transmute()`\
  \ 函数。\n\n`transmute()` 动词类似于 `dplyr` 中的 `mutate()` 动词，用于投影新列，但 `transmute()` 函数的不同之处在于，它创建的数据框仅基于函数中定义的列。\n\
  \n上述 `transmute()` 动词将生成一个包含三列的数据框，分别名为 `group_id`、`Year` 和 `Party`。图 2-22 展示了前九行的预览，以显示上述代码中使用\
  \ `transmute()` 动词的结果。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig22_HTML.jpg](img/480677_1_En_2_Fig22_HTML.jpg)\n\
  \n图 2-22  \n使用 `transmute()` 动词的结果\n\n请注意，现在每个执政期都有了唯一的标识符！现在你可以使用传统的聚合函数来获取每个执政期的开始和结束时间。再次使用管道操作符将\
  \ `transmute()` 动词创建的数据框作为第一个参数传递给下一行的 `group_by()` 动词。`group_by()` 动词将根据 `group_id`\
  \ 和 `Party` 列对传递给它的数据框进行分组。`group_by()` 的结果将作为第一个参数传递给下一行的 `summarize()` 动词。`summarize()`\
  \ 动词允许你根据分组对数据集应用聚合函数。因此，你可以创建一个名为 `start` 的列，表示基于分组中最小年份的政党执政期开始时间；还可以创建一个名为 `end`\
  \ 的列，表示基于分组中最大年份的政党执政期结束时间。将值 0.99 添加到 `end` 列，以最小化旧执政期结束与新执政期开始之间的间隙。\n\n### 步骤\
  \ 12：创建折线图所需的数据集\n\n用于创建折线图数据集的代码如下：\n\n```\ndfLineChartInfo <- dfPI %>%\n  transmute(Year,\
  \ GetGDPStat)\n```\n\n目标是开发一个折线图，显示所选 GDP 统计量按年份的变化，其时间跨度覆盖整个数据集。为此，我们需要为数据集提供两列数据，即\
  \ `Year` 和 `GetGDPStat`。你可以通过使用 `transmute()` 函数从 `dfPI` 数据框中提取这些列来创建所需的数据集。\n\n\
  \n\n### 步骤 13：创建一个用于为阴影区域着色的命名字符向量\n\n```\npartyColors = c(\"Republican\"=\"red\"\
  , \"Democrat\"=\"blue\",\n\"Tie\" = \"white\")\n```\n\n共和党的颜色是红色，民主党的颜色是蓝色。你可以通过命名字符向量\
  \ `partyColors` 强制可视化工具为各党派使用这些颜色。`partyColors` 命名字符向量将在脚本后续部分被使用，以强制可视化工具在共和党执政期间将背景渲染为红色，在民主党执政期间将背景渲染为蓝色。\n\
  \n### 步骤 14：通过定义 ggplot 函数开始创建图表\n\n前面的步骤专注于数据准备。这些数据准备步骤展示了 Power BI 中 R 可视化的一项优秀特性。如果传递给可视化工具的数据集格式不正确，你可以使用\
  \ R 来重塑数据集，使其达到所需格式。\n\n在此步骤中，你将通过以下代码设置 `ggplot()` 函数来开始创建图表：\n\n```\np <- ggplot()\n\
  ```\n\n你可能已经注意到，你是在不传递任何参数的情况下，通过 `ggplot()` 函数来初始化图表的。你这样做的原因是你的图表将包含两个图层，每个图层都有独立的数据源和美学映射，因此它们将在图层级别进行设置。\n\
  \n### 步骤 15：添加图层以创建背景阴影\n\n这通过以下代码实现：\n\n```\ngeom_rect(\ndata = dfShadeInfo,\n\
  aes(xmin = start, xmax = end, fill = Party),\nymin = -Inf, ymax = Inf, alpha = 0.4,\
  \ color = NA\n)\n```\n\n该图层的数据源是 `dfShadeInfo` 数据框。图 2-23 展示了当选择*总体*政治观点时的效果。\n\n\
  ![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig23_HTML.jpg](img/480677_1_En_2_Fig23_HTML.jpg)\n\
  \n图 2-23\n`dfShadeInfo` 数据框\n\n上图显示了九个政治统治时期，因此 `geom_rect()` 函数将使用上述数据框，根据每个政治统治时期执政党的颜色来为背景着色。每个政治统治时期的起点和终点通过在\
  \ `aes()` 函数中将 `start` 列设置为 `xmin` 参数，并将 `end` 列设置为 `xmax` 参数来定义。上边界通过将 `ymax` 参数设置为\
  \ `Inf` 来定义，下边界通过将 `ymin` 设置为 `-Inf` 来定义。使用无穷大作为上下边界可确保阴影区域在垂直方向上填满。每个统治时期都会绘制阴影，最终结果如图\
  \ 2-24 所示的带阴影背景。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig24_HTML.jpg](img/480677_1_En_2_Fig24_HTML.jpg)\n\
  \n图 2-24\n由 `geom_rect()` 几何对象生成的背景阴影\n\n请注意，阴影区域与每个统治时期的时间段相对应。各党派使用的颜色将在脚本后续部分进行更改。\n\
  \n### 步骤 16：根据所选统计指标添加折线图\n\n以下代码用于创建可视化的折线图层：\n\n`geom_line(data = dfLineChartInfo,\
  \ aes(x = Year, y = GetGDPStat))`\n\n`geom_line()` 几何对象用于创建折线图。它所基于的数据框是 `dfLineChartInfo`\
  \ 数据框，该数据框中用于 x 轴的列是 `Year` 列，用于 y 轴的列是 `GetGDPStat` 列。\n\n### 步骤 17：使用基于党派的预定义颜色重新为背景着色\n\
  \n这通过以下代码完成：\n\n```\nscale_fill_manual(values=partyColors)\n```\n\n`scale_fill_manual()`\
  \ 函数可用于覆盖 `ggplot2` 使用的默认颜色。之前，你在 `partyColors` 命名字符向量中定义了要为每个党派使用的颜色。通过将 `values`\
  \ 参数设置为 `partyColors` 变量，`ggplot2` 将使用 `partyColors` 中指定的颜色为背景着色。\n\n### 步骤 18：根据所选统计指标格式化\
  \ y 轴\n\n接下来，你根据所选的 GDP 统计指标，使用以下代码格式化 y 轴：\n\n```\nscale_y_continuous(labels=\n\
  ifelse(gdpStatName == \"ActualGDP\",\ncomma_format(),\npercent_format()\n)\n) +\n\
  ```\n\n如果选择返回实际 GDP，则 y 轴将使用 `comma_format()` 进行格式化，因为 `ActualGDP` 需要格式化为数字。否则，y\
  \ 轴将使用 `percent_format()` 格式化为百分比，因为图表将显示 GDP 的百分比变化。`comma_format()` 和 `percent_format()`\
  \ 函数都来自 `scales` 包。\n\n### 步骤 19：为 x 轴和 y 轴添加标签\n\n以下代码为 y 轴添加动态创建的标签，为 x 轴添加固定标签：\n\
  \n```\nylab(yAxisName) +\nxlab(\"Year\")\n```\n\n### 步骤 20：为自定义 R 可视化添加动态标题和说明文字\n\
  \n`ggtitle()` 函数用于通过以下代码动态创建图表标题和副标题：\n\n```\nggtitle(chartTitle, subtitle = chartSubtitle)\n\
  ```\n\n### 步骤 21：应用基于《经济学人》出版物的主题\n\n由于你正在可视化经济数据，你将使用 `ggthemes` 包中的 `theme_economist()`\
  \ 主题来格式化你的可视化。`theme_economist()` 主题使用了《经济学人》出版物所使用的格式化规则。你通过将这行代码添加到脚本中来将 `theme_economist()`\
  \ 主题应用于你的可视化：\n\n```\ntheme_economist()\n```\n\n### 步骤 22：将代码添加到 Power BI\n\n本练习中生成可视化的完整脚本列在代码清单\
  \ 2-5 中。该脚本是功能完整的，因此你可以将其复制并粘贴到 Power BI 中。请确保将其粘贴到 Power BI `R 脚本编辑器` 中注释部分之后。\n\
  \n```\nlibrary(tidyverse)\nlibrary(ggthemes)\nlibrary(scales)\ncurrentColumns %\
  \ \ntransmute(group_id, Year, Party = GetPoliticalLevel) %>%\ngroup_by(group_id,\
  \ Party) %>%\nsummarize(start = min(Year), end = max(Year)+0.99) %>%\nungroup()\n\
  #创建折线图层的数据集\ndfLineChartInfo % \ntransmute(Year, GetGDPStat)\n#定义阴影颜色\npartyColors\
  \ = c(\"Republican\"=\"red\", \"Democrat\"=\"blue\", \"Tie\" = \"white\")\n#创建可视化\n\
  p <- ggplot() +\ngeom_rect(\ndata = dfShadeInfo,\naes(xmin = start, xmax = end,\
  \ fill = Party),\nymin = -Inf, ymax = Inf, alpha = 0.4, color = NA\n) +\ngeom_line(data\
  \ = dfLineChartInfo, aes(x = Year, y = GetGDPStat)) +\nscale_fill_manual(values=partyColors)\
  \ +\nscale_y_continuous(\nlabels=ifelse(gdpStatName == \"Actual GDP\", comma_format(),percent_format())\n\
  ) +\nylab(yAxisName) +\nxlab(\"Year\") +\nggtitle(chartTitle, subtitle = chartSubtitle)\
  \ +\ntheme_economist()\np\n} else {\nplot.new()\ntitle(\"提供的数据不符合图表的要求。\")\n}\n\
  代码清单 2-5\n生成带阴影折线图的 R 脚本\n```\n\n\n\n"
- "# 地图\n\n近年来，*空间分析*变得越来越重要。在商业领域，一种流行的空间分析形式是*基于地理的空间分析*。Power BI 提供了内置的地图功能，在大多数情况下都能很好地工作。但在这个示例中，我将展示如何使用\
  \ R 来构建自定义地图。您将绘制的可视化效果是一张*州热力图*，它根据该县所在的人口五分位数对州内的县进行着色。颜色越深，表示该县人口越多。图 2-25 是选择印第安纳州时您将创建的可视化效果示例。\n\
  \n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig25_HTML.jpg](img/480677_1_En_2_Fig25_HTML.jpg)\n\
  \n图 2-25\n\n选择印第安纳州时使用 `ggplot2` 生成的地图可视化效果\n\n该可视化效果是使用一个包含定义美国本土各县边界坐标的数据集创建的。当选择一个州时，`ggplot2`\
  \ 会使用这些地理坐标来绘制地图。各县填充了不同深浅的蓝色，人口较多的县颜色较深，人口较少的县颜色较浅。您可以利用 Power BI 的交互功能轻松地在各州之间切换。如果将切片器从印第安纳州更改为肯塔基州，则会显示下图\
  \ 2-26 中的可视化效果。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig26_HTML.jpg](img/480677_1_En_2_Fig26_HTML.jpg)\n\
  \n图 2-26\n\n选择肯塔基州时使用 `ggplot2` 生成的地图可视化效果\n\n这种可视化效果的一个出色特性是，它将地理范围限制在所选的地理区域。因此，它不会在其他地理区域上浪费宝贵的图表空间。许多地图可视化效果除了关注的地理区域外，通常还会包含其他地理区域。此外，由于它是使用\
  \ `ggplot2` 创建的，因此您可以添加其他动态功能，例如动态*图表标题*、动态*图表副标题*和动态*图表说明*。让我们来看看创建这个令人惊叹的可视化效果所需的步骤！\n\
  \n### 步骤 1：获取必要的数据\n\n1.  获取一个数据集，其中列出各州的完整名称和缩写名称。所使用的数据集来自 [`https://en.wikipedia.org/wiki/List_of_U.S._state_abbreviations`](https://en.wikipedia.org/wiki/List_of_U.S._state_abbreviations)，可以在\
  \ *DataWrangling.xlsx* 工作簿的 *Abbreviations* 选项卡中找到。\n\n2.  构建一个包含可视化效果所需的县信息的数据集。用于创建该数据集的信息来自\
  \ [`www.nrcs.usda.gov/wps/portal/nrcs/detail/national/home/?cid=nrcs143_013697`](http://www.nrcs.usda.gov/wps/portal/nrcs/detail/national/home/%253Fcid%253Dnrcs143_013697)，可以在\
  \ *DataWrangling.xlsx* 工作簿的 *County FIPS Codes* 选项卡中找到。\n\n3.  从人口普查局获取一个按县列出人口的数据集。该数据集可以在\
  \ *DataWrangling.xlsx* 工作簿的 *PopulationInfo* 选项卡中找到，同时还有用于获取该数据集的 Python 脚本。\n\n\
  4.  创建一个包含缺失的 *FIPS 代码* 的数据集。一些缺失的 *FIPS 代码* 是由于映射问题造成的，另一些则是因为它们不在 *County FIPS\
  \ Codes* 数据集中。该数据集将用于纠正此问题。它可以在 *DataWrangling.xlsx* 工作簿的 *TheMissingInfo* 工作表中找到。\n\
  \n5.  从 `ggplot2` 包中获取一个包含美国本土各县边界信息的数据集。该信息存储在 *DataWrangling.xlsx* 工作簿的 *Map Info*\
  \ 选项卡中，以下是用于获取该数据集的代码：\n\n    ```\n    library(tidyverse)\n    us_counties ”\n \
  \   write_csv(us_counties, path)\n    ```\n\n6.  使用 *Power Query* 将前面数据集中的信息合并成可视化所需的形式。该数据集可以在\
  \ *DataWrangling.xlsx* 工作簿的 *ChartData* 选项卡中找到。用于创建该数据集的查询也名为 *ChartData*，您可以查看该查询以了解创建数据集所用的步骤。这是\
  \ Power BI 将用于创建 R 可视化效果的数据集。\n\n7.  将数据保存到工作簿的 *ChartData* 选项卡中。该数据也保存到了一个名为 `chartdata.csv`\
  \ 的 `csv` 文件中。\n\n与大多数可视化项目和一般的数据科学项目一样，项目中最耗时的部分通常是获取、清理和整理数据。在本练习中，我为您完成了这些艰巨的工作，以便您可以专注于数据可视化方面。您可以查看本练习的代码仓库中的材料，了解我整理数据所采取的步骤。对于有\
  \ R 和/或 Python 背景的人来说，这样做是熟悉 *Power Query* 的好方法。\n\n## 步骤 2：将数据加载到 Power BI 中\n\n\
  您需要将 `chartdata.csv` 文件导入 Power BI，然后在将其加载到数据模型之前对数据集进行一些小的调整。您可以参考此示例的 `pbix` 文件来查看这些转换。\n\
  \n## 步骤 3：在筛选器窗格中基于州创建切片器\n\n首先将 *State* 列拖到报表画布上，基于 *State* 列创建一个切片器。完成此操作后，您需要将可视化类型更改为*切片器*可视化，从而将该可视化效果更改为切片器。*切片器*是其图标中包含漏斗图像的可视化效果。\n\
  \n## 步骤 4：配置 R 可视化效果\n\n转到可视化效果窗格，将一个 R 可视化效果拖到报表画布上。将可视化效果调整到所需大小。将 `chartdata`\
  \ 表中的 `index`、`lat`、`long`、`County`、`Total Population` 和 `State` 字段拖放到*字段*窗格中。如果字段窗格未显示，请选择\
  \ R 可视化效果，它应该会出现。\n\n### 步骤 5：将数据导出到 R Studio 进行开发\n\n单击 *R 脚本编辑器* 标题栏上的 45° 箭头。此操作会将传递给\
  \ R 的数据框和 R 起始代码导出到 *R Studio*。如果您需要更详细的说明，请参考“标注图”部分中的步骤 4。\n\n### 步骤 6：加载所需的包\n\
  \n此脚本将使用的包如下所示：\n\n```\nlibrary(tidyverse)\nlibrary(ggthemes)\n```\n\n来自 `tidyverse`\
  \ 的 `dplyr` 包将用于一些数据整理，来自 `tidyverse` 的 `stringr` 包用于重新格式化一些标题，来自 `tidyverse` 的\
  \ `ggplot2` 包将用于创建地图可视化效果。来自 `ggthemes` 包的 `theme_map()` 主题将用于格式化地图可视化效果的非数据元素。\n\
  \n### 步骤 7：创建数据验证测试所需的变量\n\n以下是创建验证测试变量的代码：\n\n```\ncurrentColumns <- sort(colnames(dataset))\n\
  requiredColumns <- c(\"County\", \"Index\", \"lat\", \"long\", \"State\", \"Total\
  \ Population\")\ncolumnTest <- isTRUE(all.equal(currentColumns, requiredColumns))\n\
  state <- str_to_title(unique(dataset$State))\n```\n\n第一行从传递给 R 的数据集中获取列名，并按字母顺序排序，然后将结果放入\
  \ `currentColumns` 字符向量变量中。第二行创建一个字符向量，其中包含可视化效果期望的列名（按字母顺序），并将其分配给名为 `requiredColumns`\
  \ 的字符向量。第三行执行一个测试，将 `currentColumns` 字符向量中的列名与 `requiredColumns` 字符向量中的列名进行比较。如果它们匹配，则返回\
  \ `TRUE`；否则，返回 `FALSE`。第四行获取 `dataset` 数据框的 `State` 列中的所有唯一元素，并使用 `stringr` 包中的\
  \ `str_to_title()` 函数将州名转换为正确的名称格式。\n\n\n\n### 第 8 步：创建数据验证测试\n\n数据验证的框架如下：\n\n\
  ```\nif (length(state) == 1 & columnTest) {\n\n} else {\nplot.new()\ntitle(\"提供的数据不符合图表要求。\"\
  )\n}\n```\n\n可视化的源数据框只需包含一个州，并且需要包含所需的列。上述 `if` 语句用于测试数据框中是否只有一个州，以及数据框是否通过了列测试。如果两个条件都满足，则继续执行创建地图可视化的代码；否则，将生成一个空白可视化，并附带一条消息，告知您\
  \ R 没有足够的信息，无法创建可视化。\n\n### 第 9 步：创建图表标题变量\n\n以下是创建图表标题所需的代码：\n\n```\nchartTitle\
  \ <- paste0(state, \"的县人口分析\")\nsubTitle <- \"(颜色越深，人口越多)\"\n```\n\n主图表标题通过将所选州与字符串\
  \ `\"的县人口分析\"` 拼接而成，并赋值给 `chartTitle` 变量。字符串 `\"(颜色越深，人口越多)\"` 用作副标题，并赋值给 `subTitle`\
  \ 变量。\n\n### 第 10 步：向数据集添加五分位数列\n\n如果您还记得，此可视化的目标是根据人口数量将每个州的县按五分位数分组。您可以使用 `dplyr`\
  \ 中的 `ntile()` 函数将州内的县按五分位数分组，如下列代码所示：\n\n```\nchartdata <- dataset %>%\nmutate(quintile\
  \ = factor(ntile(`总人口`, 5)))\n```\n\n该代码从 `dataset` 数据框开始，创建一个名为 `chartdata` 的新数据框，然后使用\
  \ `dplyr` 的管道操作符将其作为第一个参数传递给下一行的 `mutate()` 动词。`mutate()` 动词用于投影一个名为 `quintile`\
  \ 的新列，该列将使用 `ntile()` 函数创建。`ntile()` 函数被包裹在 factor 函数中，以将五分位数转换为因子数据类型。此操作的效果类似于\
  \ Power BI 中的 *不汇总*。将五分位数转换为因子后，它们将被视为分类数据，而非数值数据。\n\n### 第 11 步：定义用于地图着色的颜色\n\n\
  您将使用不同深浅的蓝色来为所选州的县着色。您将使用以下命名字符向量中列出的五种不同深浅的蓝色：\n\n```\nquintileColors <-\nc(\n\"\
  1\" = \"dodgerblue\",\n\"2\" = \"dodgerblue1\",\n\"3\" = \"dodgerblue2\",\n\"4\"\
  \ = \"dodgerblue3\",\n\"5\" = \"dodgerblue4\"\n)\n```\n\n为 `五分位数 1` 列出的 `dodgerblue`\
  \ 是列表中最浅的蓝色，而为 `五分位数 5` 列出的 `dodgerblue4` 是最深的蓝色。这里，您使用颜色名称而非十六进制值来定义它们。请访问以下网站，了解\
  \ `ggplot2` 中可用的更多颜色：[`www.stat.columbia.edu/~tzheng/files/Rcolor.pdf`](http://www.stat.columbia.edu/%257Etzheng/files/Rcolor.pdf)。您将看到可用于引用特定颜色的可用名称。\n\
  \n### 第 12 步：定义 `ggplot()` 函数\n\n首先，使用以下代码定义 `ggplot()` 函数：\n\n```\nggplot(chartdata,\
  \ aes(long, lat, group = County,\nfill = quintile))\n```\n\n您使用 `chartdata` 数据框作为图表的数据源。接下来，您配置\
  \ `aes()` 函数，将 `long` 列设置为 `x` 坐标，将 `lat` 列设置为 `y` 坐标，将 `County` 设置为 `group` 美学映射，将\
  \ `quintile` 设置为 `fill` 美学映射。这是我们第一次使用 `group` 美学映射，因为在此示例之前，我们一直使用的是 *单个几何对象*，而\
  \ `geom_polygon()` 几何对象被称为 *集合几何对象*。\n\n*单个* 几何对象仅依赖于一行数据，但 *集合* 几何对象依赖于多行数据。此示例将使用\
  \ `geom_polygon()` 几何对象，它是一个 *集合* 几何对象，并将使用多行数据来定义将要创建的多边形可视化的边界。\n\n此示例中的 `geom_polygon()`\
  \ 使用数据集中每个 `group`（在此示例中为数据集中的 `County`）的纬度和经度点绘制多边形。`fill` 属性用于告诉 `ggplot2` 您希望如何为每个县的内部着色。在这里，您将根据每个县所在的五分位数为其内部着色。\n\
  \n您能够使用 *笛卡尔坐标系*（在此示例中，是基于 x 轴和 y 轴的坐标系）来表示您的空间数据，因为您查看的是地球上一个相对较小的区域。尽管地球是球体形状，但当您查看一个相对较小的地理区域时，您可以使用与分析平面相同的技术来分析它，并获得相对较好的结果。\n\
  \n### 第 13 步：添加地图图层\n\n以下是添加地图图层的代码：\n\n```\ngeom_polygon(show.legend = FALSE, color\
  \ = \"black\")\n```\n\n您已经在 `ggplot()` 函数中定义了地图所需的美学映射。它们将延续到 `geom_polygon()` 几何对象，因为在\
  \ `ggplot()` 函数中定义的任何内容都可用于所有后续图层。此可视化中不需要图例，因此您将 `show.legend` 参数设置为 `FALSE`。您希望边框颜色为黑色。通过将\
  \ color 参数设置为 black 来使其变为黑色。\n\n请注意，当您想要将图表属性设置为特定颜色时，需要在不使用 `aes()` 函数的情况下进行。原因已在第\
  \ 1 章中详细解释。\n\n### 第 14 步：格式化 x 轴和 y 轴\n\n以下代码用于重新格式化 `x` 轴和 `y` 轴：\n\n```\nscale_x_continuous(name\
  \ = NULL, labels = NULL, breaks = NULL) +\nscale_y_continuous(name = NULL, labels\
  \ = NULL, breaks = NULL)\n```\n\n您通过将名称、标签和刻度标记设置为 `NULL` 来移除它们。这样做是因为您正在可视化地图，不需要这些信息。\n\
  \n### 第 15 步：根据五分位数对县进行着色\n\n以下代码将用于对县进行着色：\n\n```\nscale_fill_manual(values = quintileColors)\n\
  ```\n\n`ggplot2` 包具有很好的默认设置，这也是该包如此出色的原因之一。更棒的是，您可以轻松覆盖这些默认设置。如果使用 `ggplot2` 的默认设置，地图将如图\
  \ 2-27 所示进行着色。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig27_HTML.jpg](img/480677_1_En_2_Fig27_HTML.jpg)\n\
  \n图 2-27\n\n选择佛罗里达州时，使用默认颜色生成的地图可视化\n\n图 2-28 是您通过 `scale_fill_manual()` 函数使用自定义颜色后地图的外观。\n\
  \n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig28_HTML.jpg](img/480677_1_En_2_Fig28_HTML.jpg)\n\
  \n图 2-28\n\n选择佛罗里达州时，使用自定义颜色生成的地图可视化\n\n第二个版本使报告用户能够根据颜色深浅轻松判断哪些县人口较少，哪些县人口较多。\n\
  \n### 第 16 步：改进所选州的近似显示\n\n以下代码用于基于 *墨卡托地图* 投影进行快速宽高比近似：\n\n```\ncoord_quickmap()\n\
  ```\n\n`geom_polygon()` 在创建地图方面做得很好，但使用上述代码可以快速使地图显示得更精确一些。\n\n\n\n### 步骤 17：为自定义\
  \ R 视觉对象添加动态标题和说明文字\n\n以下代码使用 `ggtitle()` 函数以及存储图表标题和副标题信息的变量来添加动态标题：\n\n```\nggtitle(chartTitle,\
  \ subtitle = subTitle)\n```\n\n### 步骤 18：应用 `theme_map()` 主题\n\n您可以使用 `ggthemes`\
  \ 包中的 `theme_map()` 主题来进一步增强地图的视觉吸引力。\n\n### 步骤 19：将代码添加到 Power BI\n\n完整的脚本见代码清单\
  \ 2-6。将其复制并粘贴到 Power BI 的 `R 脚本编辑器` 中。该 R 视觉对象将完全响应 Power BI 报表中的 `state` 切片器。\n\
  \n```\nlibrary(tidyverse)\nlibrary(ggthemes)\ncurrentColumns <- chartdata %>%\n\
  \  mutate(quintile = factor(ntile(`Total Population`, 5)))\nquintileColors <-\n\
  \  c(\n    \"1\" = \"dodgerblue\",\n    \"2\" = \"dodgerblue1\",\n    \"3\" = \"\
  dodgerblue2\",\n    \"4\" = \"dodgerblue3\",\n    \"5\" = \"dodgerblue4\"\n  )\n\
  ggplot(chartdata, aes(long, lat, group = County,\n                      fill = quintile))\
  \ +\n  geom_polygon(show.legend = FALSE, color = \"black\") +\n  scale_x_continuous(name=NULL,\
  \ labels=NULL, breaks=NULL) +\n  scale_y_continuous(name=NULL, labels=NULL, breaks=NULL)\
  \ +\n  scale_fill_manual(values = quintileColors) +\n  coord_quickmap() +\n  ggtitle(chartTitle,\
  \ subtitle = subTitle) +\n  theme_map()\n} else {\n  plot.new()\n  title(\"提供的数据不符合图表要求。\"\
  )\n}\n代码清单 2-6\n生成地图图表的 R 脚本\n```\n\n## 四象限图\n\n作为 Microsoft 数据专业人士，您一定很熟悉 Gartner\
  \ 生成的图 2-29 中的视觉对象。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig29_HTML.jpg](img/480677_1_En_2_Fig29_HTML.jpg)\n\
  \n图 2-29\n\n2020 年 Gartner 魔力象限图\n\nMicrosoft 在 `商业智能` 领域相比竞争对手表现出色，Gartner 也对此予以认可。Microsoft\
  \ 一直使用像 `Gartner 魔力象限图` 这样的行业对比来宣传其在行业中的地位。\n\nGartner 使用的视觉对象——`四象限图`，在基于两个指标比较不同实体时非常有效。在此案例中，Gartner\
  \ 根据各 BI 供应商的 `执行能力` 和 `愿景完整性` 进行比较。Gartner 通过添加一些细节使图表更具视觉吸引力。其中一些细节包括：\n\n-  \
  \ 为象限添加标签\n-   为象限 2 和 3 添加背景阴影\n-   为 x 轴和 y 轴使用非传统标签\n-   添加图表说明文字\n\n在 Power\
  \ BI 中创建这些细微之处并不容易，但在 R 中使用 `ggplot2` 则很简单。\n\n在本节中，我将使用基于 2008-2009 赛季洛杉矶湖人队“逐回合”数据的数据集来说明我的观点。这些信息将用于创建图\
  \ 2-30 中的四象限图，该图根据 `总得分` 和 `总篮板数` 对球员进行比较。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig30_HTML.jpg](img/480677_1_En_2_Fig30_HTML.jpg)\n\
  \n图 2-30\n\n基于篮板和得分比较洛杉矶湖人队球员的四象限图\n\n与之前的可视化类似，您将利用 Power BI 的交互功能，为视觉对象添加切片器，以便查看不同场景下的情况。将有一个用于比赛类型（主场或客场）的筛选器，以及一个用于比赛时段的筛选器。图\
  \ 2-31 中的视觉对象显示了仅考虑客场比赛时的比较情况。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig31_HTML.jpg](img/480677_1_En_2_Fig31_HTML.jpg)\n\
  \n图 2-31\n\n基于客场比赛的四象限图\n\n让我们来看看创建这个精美可视化所需的步骤！\n\n### 步骤 1：获取必要的数据\n\n本例中使用的数据集来自\
  \ R 中的 `lubridate` 包。获取该数据集的代码如下：\n\n```\nlibrary(tidyverse)\nlibrary(lubridate)\n\
  chartData <- playbyplay %>%\n  filter(\n    (player != \"\" & team == \"LAL\" &\n\
  \       result == \"made\" &\n       etype %in% c(\"shot\",\"free throw\")\n   \
  \ ) |\n      (player != \"\" &\n         team == \"LAL\" &\n         etype == \"\
  rebound\")\n  ) %>%\n  mutate(\n    rebound = ifelse(etype == \"rebound\",1,0)\n\
  \  ) %>%\n  group_by(game_type, period, player) %>%\n  summarize(\n    `Total Points`\
  \ = sum(points),\n    Rebounds = sum(rebound)\n  ) %>%\n  rename(\n    `Game Type`\
  \ = game_type,\n    Period = period,\n    Player = player\n  )\npath <- \"lakers.csv\"\
  \nwrite_csv(chartdata, path)\n```\n\n输出结果保存为一个 `csv` 文件，因为这种格式便于 Power BI 使用。如果您不理解上述代码，请不要担心，您将在本书后面学习到所使用的技术。现在，您只需知道，如果需要重新创建此可视化中使用的数据集，可以通过运行上述\
  \ R 脚本来实现。\n\n### 步骤 2：将数据加载到 Power BI\n\n使用 `获取数据` 从步骤 1 创建的 `csv` 文件中将数据加载到 Power\
  \ BI。加载后，每个列的数据类型应如下表所示：\n\n| 列名 | 数据类型 |\n| --- | --- |\n| 比赛类型 | 文本 |\n| 时段 |\
  \ 整数 |\n| 球员 | 文本 |\n| 总得分 | 整数 |\n| 篮板 | 整数 |\n\n该文件已加载到代码仓库中本例文件夹内的 `pbix` 文件中。您可以查看\
  \ Power Query 步骤以了解应用了哪些转换。\n\n### 步骤 3：为比赛类型和时段创建切片器\n\n基于 `比赛类型` 字段创建报表切片器：首先将\
  \ `比赛类型` 字段拖到报表画布上，然后在 `可视化` 窗格中选择 `切片器` 视觉对象。在将 `切片器` 视觉对象转换为切片器之前，请确保添加到画布上的字段处于高亮状态。切片器视觉对象是图像中包含筛选器图标的那个。对\
  \ `时段` 字段执行相同操作。\n\n### 步骤 4：在报表画布上配置 R 视觉对象\n\n转到可视化窗格，将 R 视觉对象拖到报表画布上。将视觉对象调整到所需大小。将\
  \ `chartData` 表中的 `球员`、`篮板` 和 `总得分` 字段拖到 `字段` 窗格中。如果 `字段` 窗格未显示，请选择 R 视觉对象，它应该会显示出来。\n\
  \n### 步骤 5：将数据导出到 R Studio 进行开发\n\n单击 `R 脚本编辑器` 标题栏上的 45 度箭头。此操作会将传递给 R 的数据框以及 R\
  \ 起始代码导出到 `R Studio`。如果需要更详细的说明，请参阅“标注图”部分中的步骤 4。\n\n### 步骤 6：加载所需的包\n\n此脚本所需的包如下：\n\
  \n```\nlibrary(tidyverse)\nlibrary(ggrepel)\nlibrary(ggthemes)\nlibrary(scales)\n\
  ```\n\n`tidyverse` 中的 `dplyr` 包用于执行一些数据整理任务，`tidyverse` 中的 `ggplot2` 用于创建可视化，`ggrepel`\
  \ 包用于向可视化中的数据点添加标签，`ggthemes` 包中的 `theme_tufte()` 主题用于格式化视觉对象的非数据元素，`scales` 包中的\
  \ `rescale()` 函数用于重新缩放部分数据。\n\n\n\n### 第 7 步：创建数据验证测试所需的变量\n\n验证测试所需的变量通过以下代码定义：\n\
  \n```\ncurrentColumns <- sort(colnames(dataset))\nrequiredColumns <- c(\"Player\"\
  , \"Rebounds\", \"Total Points\")\ncolumnTest <- isTRUE(all.equal(currentColumns,\
  \ requiredColumns))\nnoPlayerDups <-\nlength(unique(dataset$Player)) == length(dataset$Player)\n\
  ```\n\n以下是对上述代码片段中每一行作用的说明：\n\n-   第一行代码基于`dataset`数据框的列名创建了一个名为`currentColumns`的字符向量变量，这些列名按字母顺序排序。\n\
  -   第二行代码创建了一个名为`requiredColumns`的字符向量变量，其中包含四象限图所需的列，并按字母顺序排列。\n-   第三行代码使用基础 R\
  \ 语言中的`all.equal()`函数来测试`currentColumns`变量和`requiredColumns`变量是否等价。如果它们相等，则`all.equal()`返回`TRUE`；否则，它会返回关于为何不相等的信息。我们使用`isTRUE()`包裹`all.equal()`以获取布尔值响应。\n\
  -   第四行代码（由于格式原因实际为两行）使用`noPlayerDups`变量来保存检查数据集中是否存在重复球员的测试结果。它通过比较`Players`列中唯一元素的数量与`Players`列的长度来实现。如果两者相等，则说明没有重复的球员。\n\
  \n### 第 8 步：创建数据验证测试\n\n验证测试的模板如下所示：\n\n```\nif (noPlayerDups & columnTest) {\n\n\
  } else {\nplot.new()\ntitle(\"The data supplied did not meet the requirements of\
  \ the\nchart.\")\n}\n```\n\n验证测试执行两个测试：`noPlayerDups`测试和`columnTest`测试。如果两个测试结果都为`TRUE`，则执行创建图表的代码。否则，会创建一个空白图表，并显示关于`ggplot2`为何无法创建图表的信息。\n\
  \n### 第 9 步：创建图表标题\n\n本例中，图表标题、副标题和说明文字均使用静态字符串。它们通过以下代码定义：\n\n```\nchart.title\
  \ <- \"LA Lakers player comparison\"\nchartsubtitle <- \"(2008 - 2009 Season)\"\n\
  chart_source <- \"Source:  lubridate package\"\n```\n\n### 第 10 步：向数据集添加额外列\n\n\
  您正在创建一个四象限图，用于根据篮板和得分比较洛杉矶湖人队的篮球运动员。篮板和得分处于两个不同的量级，因为得分的可能取值范围远高于篮板。四象限图要求它们处于同一量级。这一步通过以下代码实现：\n\
  \n```\ngraph_data %>%\nmutate(\nScaled.Rebounds =\nround(rescale(Rebounds, to =\
  \ c(-10, 10)), 1)\n,Scaled.TotalPoints =\nround(rescale(`Total Points`, to = c(-10,\
  \ 10)), 1)\n)\n```\n\n在这一步中，使用`mutate`动词向数据框添加了两个新列：`Scaled.Rebounds`和`Scaled.TotalPoints`。这两列使用`scales`包中的`rescale()`函数将它们都缩放到-10\
  \ 到+10 之间。这些新列将在可视化中用于表示每位球员的篮板和总得分。\n\n### 第 11 步：通过定义 ggplot 函数开始创建图表\n\n以下代码用于定义`ggplot()`函数：\n\
  \n```\np <- ggplot(graph_data,\naes(x = Scaled.Rebounds, y = Scaled.TotalPoints)\n\
  )\n```\n\n此可视化中使用的数据集是`graph_data`数据框，并且在`ggplot()`函数中仅定义了两个美学映射，即`x`和`y`美学映射。\n\
  \n### 第 12 步：使用 geom_point()几何对象在图表上绘制球员点\n\n接下来，您向图表添加点来表示球员。点的位置基于给定球员的篮板数和总得分的缩放版本。这通过向代码添加`geom_point()`几何对象来实现，如下所示：\n\
  \n```\np <- ggplot(\ngraph_data,\naes(x = Scaled.Rebounds, y = Scaled.TotalPoints)\n\
  ) +\ngeom_point()\n```\n\n`geom_point()`几何对象继承了`ggplot()`函数的美学映射，因此无需在`geom_point()`图层中定义所需的`x`和`y`美学映射。\n\
  \n### 第 13 步：为每个象限添加标签\n\n接下来，您向可视化添加一层标签，用于标识点所代表的球员名称。这通过使用`geom_label_repel()`几何对象来实现，如下列代码所示：\n\
  \n```\nggplot(graph_data,\naes(x = Scaled.Rebounds,\ny = Scaled.TotalPoints)\n)\
  \ +\ngeom_point() +\ngeom_label_repel(aes(\nlabel = Player),\nsize = 4, show.legend\
  \ = FALSE\n)\n```\n\n`geom_label_repel()`几何对象继承了`ggplot()`函数的`x`和`y`参数，因此您无需定义这两个美学映射。唯一需要定义的美学映射是`label`美学映射，您将其设置为`Player`列。该列中的值将用于用球员姓名标记其对应的点。您在`aes()`函数外部设置`size`参数，因为您希望所有标签具有相同的字体大小。此外，默认情况下，`ggplot2`会为添加到`x`和`y`比例尺之外的每个比例尺创建一个图例。`label`不需要图例，因此为了防止显示图例，您将`show.legend`属性设置为`FALSE`。\n\
  \n### 第 14 步：在 x 轴和 y 轴上绘制垂直和水平线\n\n可视化需要为`x`轴和`y`轴绘制清晰的线条。以下代码中的最后两行添加了所需的水平线和垂直线：\n\
  \n```\np <- ggplot(\ngraph_data,\naes(x = Scaled.Rebounds,\ny = Scaled.TotalPoints)\n\
  ) +\ngeom_point() +\ngeom_label_repel(\naes(label = Player),\nsize = 4,\nshow.legend\
  \ = FALSE\n) +\ngeom_hline(yintercept = 0) +\ngeom_vline(xintercept = 0)\n```\n\n\
  使用`geom_hline()`和`geom_vline()`几何对象来绘制线条。将`geom_hline()`函数中的`yintercept`设置为 0，可以绘制一条穿过\
  \ y 轴 0 点的水平线；将`geom_vline()`函数中的`xintercept`设置为 0，可以绘制一条穿过 x 轴 0 点的垂直线。\n\n\n\n\
  ### 步骤 15：为图表添加象限标签\n\n图 2-32 展示了执行前述步骤后的视觉效果。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig32_HTML.jpg](img/480677_1_En_2_Fig32_HTML.jpg)\n\
  \n**图 2-32** 象限图的雏形\n\n图表进展顺利，你正朝着最终目标稳步前进。在此步骤中，你将使用以下代码为每个象限添加标签：\n\n```\nannotate(\"\
  text\", x = -5, y = 11, label = \"High Scorer\",\nalpha = 0.2, size = 6) +\nannotate(\"\
  rect\", xmin = -3.5, xmax = -6.5, ymin = 10.5,\nymax = 11.5, alpha = .2) +\nannotate(\"\
  text\", x = 5, y = 11, label = \"Beast Mode\",\nalpha = 0.2, size = 6) +\nannotate(\"\
  rect\", xmin = 3.5, xmax = 6.5, ymin = 10.5,\nymax = 11.5, alpha = .2)\nannotate(\"\
  text\", x = -5, y = -11, label = \"Average\",\nalpha = 0.2, size = 6) +\nannotate(\"\
  rect\", xmin = -3.5, xmax = -6.5, ymin = -11.5,\nymax = -10.5, alpha = .2) +\nannotate(\"\
  text\", x = 5, y = -11, label = \"High Rebounder\",\nalpha = 0.2, size = 6) +\n\
  annotate(\"rect\", xmin = 3.5, xmax = 6.5, ymin = -11.5,\nymax = -10.5, alpha =\
  \ .2) +\n```\n\n上述代码为象限图中的每个象限构建了带边框的标签。左上角的第一个象限标记为*高分得分手*，因为该组球员得分排名高但篮板排名低；右上角的第二个象限命名为*野兽模式*，因为该象限球员在篮板和得分方面均排名靠前；左下角的第三个象限标记为*普通球员*，因为该象限球员在篮板和得分方面均相对较低；右下角的第四个象限标记为*篮板高手*，因为该象限球员篮板排名高但得分排名低。\n\
  \n象限标签的文本和边框均使用 `annotate()` 函数创建。`annotate()` 函数的第一个参数用于指定注释所使用的几何对象类型。本示例中创建象限标签所使用的几何对象类型是\
  \ `text` 和 `rect`。在上述代码中，相应象限的标签文本通过 `text` 几何对象创建，然后使用 `rect` 几何对象在文本周围放置矩形边框。首先，我们来了解\
  \ `text` 注释的工作原理，然后再介绍 `rect` 注释。\n\n如前所述，创建 `text` 注释时，需将 `annotate()` 函数的第一个参数值设置为\
  \ `text`。`x` 和 `y` 参数用于确定“文本”的位置。在此可视化图表中，`text` 注释的 `x` 值位于各自象限的中心，而 `y` 值则位于可能数据点区域之外。这样做是为了尽量减少球员数据与象限标签的重叠。每个文本注释的\
  \ `alpha` 参数设置为 0.2，以确保即使球员姓名与标签位置重合，也能显示在标签之上。\n\n`alpha` 参数用于设置图表中几何对象的透明度。数值越接近零，元素越透明；数值越接近一，元素越不透明。\n\
  \n使用 `text` 注释为给定象限创建象限标签后，再使用 `rect` 注释创建标签的边框。这通过将 `annotate()` 函数的第一个参数设置为 `rect`\
  \ 来实现。要绘制的矩形通过 `xmin`、`xmax`、`ymin` 和 `ymax` 参数定义。以下是各参数用途的说明：\n\n- `xmin` 参数用于确定左上角和左下角的\
  \ `x` 位置。\n- `xmax` 参数用于确定右上角和右下角的 `x` 位置。\n- `ymin` 参数用于确定左下角和右下角的 `y` 位置。\n- `ymax`\
  \ 参数用于确定左上角和右上角的 `y` 位置。\n\n定义好角点后，`annotate()` 函数会用线条连接这些点，最终在标签周围形成一个矩形边框。\n\n\
  ### 步骤 16：为 X 轴和 Y 轴添加标签\n\n以下是用于为 X 轴和 Y 轴标签名称添加箭头的代码：\n\n```\nxlab(bquote(\"Rebounding\"\
  \ ~ symbol('\\256'))) +\nylab(bquote(\"Scoring\" ~ symbol('\\256'))) +\n```\n\n\
  这是一种技巧，我使用了通常用于在 R 中创建数学表达式的 `bquote()` 函数。在此示例中，你并非用它来创建数学表达式，而是为标签添加箭头符号。这通过 `xlab()`\
  \ 和 `ylab()` 函数实现。`xlab()` 函数用于重命名 X 轴标签，`ylab()` 函数用于重命名 Y 轴标签。代码 `symbol('\\256')`\
  \ 是绘制箭头所需的代码。\n\n### 步骤 17：为自定义 R 可视化添加动态标题和说明\n\n使用 `labs()` 函数，通过以下代码为可视化添加图表标题、副标题和图表来源：\n\
  \n```\nlabs(\ntitle = chart.title,\nsubtitle = chartsubtitle,\ncaption = chart_source\n\
  )\n```\n\n### 步骤 18：添加主题\n\n图表的主题通过 `ggthemes` 包中的 `theme_tufte()` 主题，运用爱德华·塔夫特的可视化原则进行更改。这通过将以下代码添加到脚本中来实现：\n\
  \n```\ntheme_tufte() +\n```\n\n\n\n### 步骤 19：执行最后的清理工作\n\n执行前面的步骤将得到图 2-33 中的可视化效果。\n\
  \n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig33_HTML.jpg](img/480677_1_En_2_Fig33_HTML.jpg)\n\
  \n图 2-33\n\n执行最后清理前的四象限图\n\n您需要重新格式化图表标题和坐标轴标签，使其看起来像下面的可视化效果。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig34_HTML.jpg](img/480677_1_En_2_Fig34_HTML.jpg)\n\
  \n图 2-34\n\n四象限图的最终版本\n\n您可以使用以下代码来实现：\n\n```\ntheme(\nplot.title = element_text(hjust\
  \ = 0.5, size = 25)\n, plot.subtitle = element_text(hjust = 0.5, size = 20)\n, panel.border\
  \ = element_rect(\ncolour = \"black\",\nsize = 2,\nfill = NA)\n, axis.title.x =\
  \ element_text(hjust = 0.1, size = 18)\n, axis.title.y = element_text(hjust = 0.1,\
  \ size = 18)\n) +\nscale_x_continuous(labels = NULL, breaks = NULL) +\nscale_y_continuous(labels\
  \ = NULL, breaks = NULL)\n```\n\n让我们详细分析一下前面的代码。如您所见，大部分所需的更改都是通过 `theme()` 函数处理的。以下是此步骤中由\
  \ `theme()` 函数修改的组件列表，以及它们是如何被修改的描述：\n\n- `plot.title`：此组件用于控制图表标题，并通过 `element_text()`\
  \ 函数实现。`element_text()` 函数的 `hjust` 参数用于控制文本的水平位置，它接受 0 到 1 之间的值。值为 0 表示文本左对齐，值为\
  \ 0.5 表示文本居中，值为 1 表示文本靠右对齐。您使用了值 0.5，因为您希望文本居中。您使用 `size` 参数将字体大小增加到 25。\n\n- `plot.subtitle`：此组件用于控制图表副标题，同样通过\
  \ `element_text()` 函数实现。`hjust` 参数的设置方式与 `plot.title` 组件中的相同，因为您希望像处理 `plot.title`\
  \ 组件一样将文本居中。您希望副标题比主标题小，因此将其设置为较小的数值 20。\n\n- `panel.border`：此组件用于控制可视化周围的边框，并通过\
  \ `element_rect()` 函数实现。`colour` 参数用于设置边框的颜色，`size` 参数用于设置边框的粗细。\n\n- `axis.title.x`：此组件用于控制\
  \ x 轴的标签，并通过 `element_text()` 函数实现。您希望标签位于 x 轴的左侧，因此将 `hjust` 参数的值设置为 0.1。您使用 `size`\
  \ 参数将文本的字体大小更改为 18。\n\n- `axis.title.y`：此组件用于控制 y 轴的标签，其配置方式与 `axis.title.x` 类似。不同之处在于定位是在垂直线上而不是水平线上。因此，值越接近\
  \ 0，其在 Y 轴上的位置越低；值越接近 1，其在 Y 轴上的位置越高。您使用了值 0.1，以便将 Y 轴标签定位在靠近原点处。\n\n最后，使用 `scale_x_continuous()`\
  \ 和 `scale_y_continuous()` 比例尺来重新格式化坐标轴。两个比例函数中的 `labels` 和 `breaks` 都设置为 `NULL`，以将它们从图表中移除。这些操作的结果已在之前的图\
  \ 2-34 中展示。\n\n### 步骤 20：将代码添加到 Power BI\n\n生成该可视化效果的完整脚本见代码清单 2-7。\n\n```\nlibrary(tidyverse)\n\
  library(ggrepel)\nlibrary(ggthemes)\nlibrary(scales)\ncurrentColumns %\nmutate(\n\
  Scaled.Rebounds =\nround(rescale(Rebounds, to = c(-10, 10)), 1)\n,Scaled.TotalPoints\
  \ =\nround(rescale(`Total Points`, to = c(-10, 10)), 1)\n)\np <- ggplot(graph_data,\
  \ aes(x = Scaled.Rebounds, y = Scaled.TotalPoints)) +\ngeom_point() +\ngeom_label_repel(aes(label\
  \ = Player), size = 4, show.legend = FALSE) +\ngeom_hline(yintercept = 0) +\ngeom_vline(xintercept\
  \ = 0) +\n# quad 1\nannotate(\"text\", x = -5, y = 11, label = \"High Scorer\",\
  \ alpha = 0.2, size = 6) +\nannotate(\"rect\", xmin = -3.5, xmax = -6.5, ymin =\
  \ 10.5, ymax = 11.5, alpha = .2) +\n# quad 2\nannotate(\"text\", x = 5, y = 11,\
  \ label = \"Beast Mode\", alpha = 0.2, size = 6) +\nannotate(\"rect\", xmin = 3.5,\
  \ xmax = 6.5, ymin = 10.5, ymax = 11.5, alpha = .2) +\n# quad 3\nannotate(\"text\"\
  , x = -5, y = -11, label = \"Average\", alpha = 0.2, size = 6) +\nannotate(\"rect\"\
  , xmin = -3.5, xmax = -6.5, ymin = -11.5, ymax = -10.5, alpha = .2) +\n# quad 4\n\
  annotate(\"text\", x = 5, y = -11, label = \"High Rebounder\", alpha = 0.2, size\
  \ = 6) +\nannotate(\"rect\", xmin = 3.5, xmax = 6.5, ymin = -11.5, ymax = -10.5,\
  \ alpha = .2) +\n# Shade lower left quadrant\nannotate(\"rect\", xmin = -Inf, xmax\
  \ = 0.0, ymin = -Inf, ymax = 0, alpha = 0.1, fill = \"lightskyblue\") +\n# Shade\
  \ upper right quadrant\nannotate(\"rect\", xmin = 0.0, xmax = Inf, ymin = 0.0, ymax\
  \ = Inf, alpha = 0.1, fill = \"lightskyblue\") +\n# Titles\nxlab(bquote(\"Rebounding\"\
  \ ~ symbol('\\256'))) +\nylab(bquote(\"Scoring\" ~ symbol('\\256'))) +\nlabs(title\
  \ = chart.title, subtitle = chartsubtitle, caption = chart_source) +\n# Prettying\
  \ things up\ntheme_tufte() +\ntheme(\nplot.title = element_text(hjust = 0.5, size\
  \ = 25)\n, plot.subtitle = element_text(hjust = 0.5, size = 20)\n, panel.border\
  \ = element_rect(colour = \"black\", size = 2, fill = NA)\n, axis.title.x = element_text(hjust\
  \ = 0.1, size = 18)\n, axis.title.y = element_text(hjust = 0.1, size = 18)\n) +\n\
  scale_x_continuous(labels = NULL, breaks = NULL) +\nscale_y_continuous(labels =\
  \ NULL, breaks = NULL)\np\n} else {\nplot.new()\ntitle(\"The data supplied did not\
  \ meet the requirements of the chart.\")\n}\n代码清单 2-7\n生成四象限图的 R 脚本\n```\n\n复制该脚本，然后将其粘贴到此可视化效果关联的\
  \ `R 脚本编辑器` 中。生成的 R 可视化效果将完全响应报表中的筛选器。\n\n## 添加回归线\n\n数据分析师最常为其散点图添加的增强功能之一是趋势线。使用\
  \ `ggplot2` 在 R 中为散点图添加趋势线非常简单，而且您拥有的配置选项通常比其他可视化工具更多。例如，您可以选择：\n\n- 为趋势线使用线性模型、广义线性模型、广义加性模型以及其他一些模型\n\
  - 确定您想要的置信水平\n- 为趋势线使用您自己的公式\n- 使用更多可配置的选项，数量多到无法一一列举\n\n在本节中，您将使用一个基于 R 中预装数据集的简单示例。该数据集名为\
  \ `women`，它显示的是美国女性按身高的平均体重。您将使用散点图绘制这些信息，然后在散点图上叠加一条基于线性回归模型的趋势线。生成的可视化效果见图 2-35。\n\
  \n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig35_HTML.jpg](img/480677_1_En_2_Fig35_HTML.jpg)\n\
  \n图 2-35\n\n添加了线性回归线的散点图\n\n让我们逐步了解如何生成此可视化效果！\n\n### 步骤 1：获取必要的数据\n\n本示例中使用的代码是基础\
  \ R 预装的数据集之一。以下是用于创建作为本示例源数据的 `csv` 文件的 R 代码：\n\n```\nlibrary(tidyverse)\ndata(women)\n\
  setwd(\"\")\nwrite_csv(women, \"women.csv\")\n```\n\n运行上述代码将生成一个名为 `women.csv` 的文件，该文件将在下一步中作为\
  \ Power BI 的数据源。\n\n\n\n### 步骤 2：将数据加载到 Power BI\n\n使用 `GetData` 将数据读取到 Power BI。为此，请单击\
  \ Power BI 中的 `Home` 选项卡，然后单击 `GetData` ➤ `Text/CSV`。接下来，浏览到您保存 `women.csv` 文件的位置。加载数据时，请确保\
  \ `height` 和 `weight` 列均为数字格式。\n\n### 步骤 3：配置 R 可视化对象\n\n转到可视化窗格，将一个 R 可视化对象拖到报表画布上。将可视化对象调整到所需大小。将\
  \ `women` 表中的 `height` 和 `weight` 列拖放到 `Fields` 窗格中。如果 `Fields` 窗格未显示，请选中 R 可视化对象，它应该会出现。\n\
  \n### 步骤 4：将数据导出到 R Studio 进行开发\n\n单击 `R script editor` 标题栏上的 45° 箭头。此操作会将传递给 R\
  \ 的数据框和 R 起始代码导出到 `R Studio`。如果您需要更详细的说明，请参考“标注图”部分中的步骤 4。\n\n### 步骤 5：加载所需的包\n\n\
  此脚本中将使用的 R 包是 `tidyverse` 和 `ggthemes`。来自 `tidyverse` 的 `ggplot` 包用于创建可视化，来自 `tidyverse`\
  \ 的 `dplyr` 包用于为可视化塑造数据。`ggthemes` 包提供了 `theme_tufte()` 主题，该主题将用于更改图表的主题。\n\n###\
  \ 步骤 6：创建数据验证测试所需的变量\n\n以下代码用于创建数据验证测试的变量：\n\n```\ncurrentColumns <- sort(colnames(dataset))\n\
  requiredColumns <- c(\"height\", \"weight\")\ncolumnTest <- isTRUE(all.equal(currentColumns,\
  \ requiredColumns))\n```\n\n您需要确保从 Power BI 传递给 R 的数据集具有正确的结构，并且需要准备好处理结构不正确的情况。在此示例中执行的测试是一个确保传递给\
  \ R 的数据集仅包含 R 可视化所需列的测试。\n\n为此，您首先获取 `dataset` 数据框中列的名称，并将其分配给一个名为 `currentColumns`\
  \ 的字符向量变量。该变量中的元素按字母顺序排序。下一行代码创建另一个字符向量，其中包含创建 R 可视化所需的列。它们也按字母顺序提供。代码片段中的最后一行使用\
  \ `all.equal()` 函数执行测试，以查看 `currentColumns` 和 `requiredColumns` 字符向量是否相等。`all.equal()`\
  \ 函数用于比较两个 R 对象是否相等。如果它们相等，则返回 TRUE；否则，返回试图解释它们为何不相等的信息。在此示例中，您只关心 `currentColumns`\
  \ 和 `requiredColumns` 变量是否相等。您只需要一个布尔响应。您可以通过使用 `isTRUE()` 函数包装 `all.equal()` 来获得它。\n\
  \n### 步骤 7：创建数据验证测试\n\n以下是数据验证测试的框架：\n\n```\nif (columnTest) {\n\n} else {\nplot.new()\n\
  title(\"提供的数据不符合图表的要求。\")\n}\n```\n\n回想一下，`columnTest` 变量基于一个返回布尔值的测试。如果 `columnTest`\
  \ 变量的值为 TRUE，则将执行代码以构建可视化；否则，将执行 `else` 块中的代码。`else` 块中的代码使用 `plot.new()` 函数生成一个空白图，并向空白图添加文本，向报表用户解释为何未创建所需的图表。\n\
  \n### 步骤 8：通过初始化 ggplot 函数开始创建图表\n\n以下是此步骤中使用的代码：\n\n```\nchartdata <- dataset\n\
  ggplot(chartdata, aes(x = weight, y = height)) +\n```\n\n首先，您通过将 `dataset` 数据框分配给一个名为\
  \ `chartdata` 的变量来复制它。接下来，您定义 `ggplot()` 函数。第一个参数是可视化将使用的数据集。第二个参数使用 `aes()` 函数定义一些视觉美学。正在定义的美学是\
  \ `x` 和 `y` 坐标。\n\n### 步骤 9：向 R 可视化对象添加散点图层\n\n通过使用 `geom_point()` 几何对象添加散点图层。`x`\
  \ 和 `y` 参数的值继承自 `ggplot()` 函数，并用于确定散点图中每个点的位置。以下是用于添加几何对象的代码：\n\n```\ngeom_point()\
  \ +\n```\n\n将 `geom_point()` 几何对象添加到图表的结果如图 2-36 所示。\n\n![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig36_HTML.jpg](img/480677_1_En_2_Fig36_HTML.jpg)\n\
  \n图 2-36\n\n使用基础 R 自带的“women”数据集绘制的美国女性平均体重与身高的散点图\n\n### 步骤 10：向 R 可视化对象添加回归线图层\n\
  \n在此步骤中，您使用 `geom_smooth()` 几何对象添加回归线图层。用于添加该图层的代码如下：\n\n```\ngeom_smooth(method='lm')\
  \ +\n```\n\n上述代码将根据散点图中的数据向图表添加一条线性回归线。此函数之所以特别，是因为它非常可配置。`geom_smooth()` 函数使您能够：\n\
  \n- 指定您自己的线性回归公式\n- 为您的线性回归线添加置信区间\n- 选择您要使用的置信区间水平\n- 使用其他平滑方法，例如 `广义线性回归 (glm)`、`局部回归\
  \ (loess)`、`稳健线性模型 (rlm)` 和 `广义加性模型 (gam)`\n\n以下图 2-37 中的可视化显示了添加回归线后图表的外观。\n\n\
  ![../images/480677_1_En_2_Chapter/480677_1_En_2_Fig37_HTML.jpg](img/480677_1_En_2_Fig37_HTML.jpg)\n\
  \n图 2-37\n\n添加了回归线的散点图\n\n### 步骤 11：为图表添加标题\n\n使用 `ggtitle()` 函数添加图表标题和副标题，如下所示：\n\
  \n```\nggtitle(\n\"美国女性身高与平均体重\",\nsubtitle = \"(添加了回归线和置信区间)\"\n) +\n```\n\n请注意，`ggtitle()`\
  \ 函数是 `labs()` 函数的替代方案，但它具有此示例所需的功能。\n\n### 步骤 12：更改图表的主题\n\n您希望使用 Stephen Few 的原则来更改图表的外观和感觉。您可以使用以下代码将\
  \ `theme_tufte()` 主题添加到图表中：\n\n```\ntheme_tufte() +\n```\n\n### 步骤 13：进行最后的清理工作\n\
  \n`theme()` 函数用于更改图表标题、副标题和轴标签的字体大小。图表标题的字体使用 `plot.title` 组件更改，图表的副标题使用 `plot.subtitle`\
  \ 组件更改，轴标签使用 `axis.title` 组件更改。所有三个组件都使用 `element_text()` 函数进行更改：\n\n```\ntheme(\n\
  axis.title = element_text(size = 20),\nplot.title = element_text(size = 30),\nplot.subtitle\
  \ = element_text(size = 20)\n)\n```\n\n\n\n### 步骤 14：向 Power BI 添加代码\n\n完整的脚本如代码清单\
  \ 2-8 所示。复制该脚本并将其粘贴到 Power BI 的 *R 脚本编辑器*中。\n\n```\nlibrary(tidyverse)\nlibrary(ggthemes)\n\
  currentColumns <- sort(colnames(dataset))\nrequiredColumns <- c(\"height\",\"weight\"\
  )\ncolumnTest <- isTRUE(all.equal(currentColumns, requiredColumns))\nif (columnTest)\
  \ {\nchartdata <- dataset\nggplot(chartdata, aes(x = weight, y = height)) +\ngeom_point()\
  \ +\ngeom_smooth(method='lm') +\nggtitle(\n\"美国女性身高对应的平均体重\",\nsubtitle = \"（附回归线与置信区间）\"\
  \n) +\ntheme_tufte() +\ntheme(\naxis.title = element_text(size = 20),\nplot.title\
  \ = element_text(size = 30),\nplot.subtitle = element_text(size = 20)\n)\n} else\
  \ {\nplot.new()\ntitle(\"提供的数据不符合图表要求。\")\n}\n代码清单 2-8\n生成带回归线的散点图的 R 脚本\n```\n\n\
  在本章中，你学习了几个示例，展示了如何通过 `ggplot2` 包在 Power BI 中实现富有表现力的可视化。你可以轻松修改这些示例以满足自身需求，或将其作为灵感来源，创建完全不同的可视化效果。`ggplot2`\
  \ 包及其辅助包提供了一个出色的框架，让你能够以相对低代码的方式为 Power BI 构建 R 可视化。`ggplot2` 包是 Power BI 的绝佳搭档！\n\
  \n"
- '# 第三部分：使用 R 和 Python 将数据导入 Power BI 数据模型


  '
- "# 3. 读取 CSV 文件\n\nPower BI 是一款出色的数据可视化工具，已被公认为该领域的顶级工具之一。然而，在创建 Power BI 闻名遐迩的卓越可视化之前，你首先需要将数据导入\
  \ Power BI 数据模型。\n\nPower BI 自带一个名为 Power Query 的工具，它能处理你在将数据导入 Power BI 数据模型时遇到的大多数情况。Power\
  \ Query 的图形用户界面直观易用，但在某些高级场景下，Power Query 会显得力不从心。\n\n幸运的是，随着 Power BI 中 R 和 Python\
  \ 的加入，许多“难以完成”的任务变得相对容易处理。在本章中，你将学习如何使用 R 和 Python 动态选择文件夹中要合并的文件，并根据需要高级字符串匹配技术的字符串模式来筛选行。让我们从动态合并文件开始。\n\
  \n## 动态合并文件\n\n在将数据导入 Power BI 数据模型之前，将文件夹中的多个文件合并成一个数据集是一项常见任务，但在 Power Query 中使用复杂的筛选逻辑动态选择这些文件可能颇具挑战性。本节将展示如何通过使用\
  \ R 和 Python 来简化此任务。\n\n如果你要合并特定文件夹中所有结构相同的文件，在 Power Query 中合并文件是直接了当的。如果你使用简单的选择规则来挑选要合并的文件，将文件夹中的文件合并成一个数据集也并非难事。但是，当你需要应用涉及复杂逻辑的选择规则时，在\
  \ Power Query 中完成该任务即使不是不可能，也会非常困难。而使用 R 和 Python 则能让任务变得更容易执行，即使选择标准很复杂。\n\n###\
  \ 示例场景\n\n场景如下：假设现在是 2014 年 2 月 5 日，你是一家大型小部件销售公司的财务分析师。你有一个文件夹，里面存放着从 2010 年 12\
  \ 月 1 日到 2014 年 1 月 1 日的月度销售报告。每个月的报告都相当大，由于 Power BI 的限制，你无法加载所有历史报告。你需要将加载范围限制在滚动\
  \ 24 个月内。\n\n以下是一些额外的技术细节：\n\n- 报告为 `csv` 文件类型。\n- 文件名的命名规则为 `YYYY-MM-DD.csv`。\n\
  - 所有报告具有相同的结构布局。\n\n在 Power Query 中创建一个能够动态选择滚动 24 个月内文件的工作流将非常困难。该任务需要高级 Power\
  \ Query 技能和使用自定义 M 代码。执行此任务所需的底层 M 代码会很复杂，并且不如使用 R 或 Python 编写的代码直观。让我们首先使用 R 执行此任务，然后使用\
  \ Python 执行相同的任务。这样，你就能看到使用这两种语言编写的代码是多么直观和简洁。\n\n### 使用 R 选择滚动 24 个月的数据\n\nR 用户自\
  \ 20 世纪 90 年代初就开始进行*数据整理*。数据整理是将原始数据转换为适合分析的数据集的过程。将相似文件合并成一个数据集是一项常见的数据整理任务。多年来，R\
  \ 社区开发了许多包，使得此类任务变得更加容易。你将在本例中看到这一点。让我们逐步了解在 R 中执行所述任务所需的步骤。\n\n#### 步骤 1：加载脚本所需的\
  \ R 包\n\n在本例中，你将使用 `tidyverse` 中的四个包。这些包是 `readr`、`lubridate`、`purrr` 和 `stringr`。`readr`\
  \ 包提供了便于将平面文件读入 R 的功能，`lubridate` 包提供了简化 R 中日期处理的函数，`purrr` 包以一致的方式在 R 中实现函数式编程技术，而\
  \ `stringr` 包则提供了一些方便的字符串操作函数。\n\n`readr` 和 `purrr` 包包含在 `tidyverse` 加载中，因此你无需显式加载它们。但是，你需要加载\
  \ `lubridate` 和 `stringr`，因为它们不属于 `tidyverse` 加载中包含的核心包。以下是加载这些包所需的代码：\n\n```\n\
  library(tidyverse)\nlibrary(lubridate)\nlibrary(stringr)\n```\n\n你可能会想，如果一个脚本需要使用四个\
  \ R 包，这实际上会让情况变得更复杂，因为在 Power Query 中你不需要加载额外的包。Power Query 中所需的一切都已内置。请跟随我的思路，你会发现能够访问\
  \ R 中大量的包是一个巨大的优势。通过利用 R 包，你将能够用非常少的代码执行一些复杂的任务。\n\n\n\n#### 步骤 2：将工作目录更改为包含销售数据集的文件夹\n\
  \nR 中的*工作目录*是脚本和数据所在的根目录。建议使用工作目录，因为它能让你将所有任务所需的项目集中存放在一个中心位置。它还能让你利用*相对文件路径引用*。*相对文件路径引用*使你能够引用相对于工作目录的文件，而无需提供完整的文件路径。本示例的工作目录应设置为名为\
  \ `R_Code` 的文件夹，该文件夹是仓库中 `Chapter03` 部分的一个子文件夹。`R_Code` 文件夹包含在本书的代码下载中。因此，如果你将配套代码保存到了\
  \ `Documents` 文件夹，那么你可以使用类似于以下代码的代码来设置工作目录：\n\n```\nsetwd(\"C:/Users//Documents/AdvancedAnalyticsPowerBI/Chapter03/R_Code\"\
  )\n```\n\n`setwd()` 函数会根据你传递给它的文件路径，将工作目录设置到一个新位置。\n\n如果你想将工作目录设置到相对于当前工作目录的位置，可以通过以句点（“\
  \ . ”）开头文件路径字符串来实现。我们用一个例子来说明。下面的代码假设你的工作目录是 `Documents` 文件夹，并且你想使用正斜杠将其更改为 `R_Code`\
  \ 文件夹：\n\n```\nsetwd(\"./AdvancedAnalyticsPowerBI/R_Code \")\n```\n\n上述代码通过使用句点，告诉\
  \ R 从 `Documents` 文件夹（即你的工作目录）开始。从那里，你可以使用“/”后跟文件夹名称，遍历到你想要设置为新工作目录的文件夹。你也可以使用“\\\
  ”，但如果这样做，你需要使用两个反斜杠，因为“\\”是一个需要被*转义*的特殊字符。\n\n当你确实想使用一个同时也是特殊字符的字符时，你需要通过使用“\\”对其进行转义，来告诉\
  \ R 和 Python 你想使用它的字面版本。一些需要转义的常用特殊字符包括“*”和“.”。\n\n#### 步骤 3：将文件名读入一个字符向量\n\n如果你想选择应包含在滚动\
  \ 24 个月内的文件，你需要能够分析文件名以确定它们是否应被包含在内。为此，你可以使用 `list.files()` 函数。`list.files()` 函数会获取传递给它的文件路径中的所有文件名，并将其放入一个*字符向量*中，如下列代码所示：\n\
  \n```\nmonthly_reports <- list.files(\"./Data/SalesData/\")\n```\n\n*字符向量*是一个数据向量，其元素属于*字符*数据类型。R\
  \ 中的*字符*数据类型类似于 DAX 中的*字符串*数据类型和 M 中的*文本*数据类型。\n\n在上述代码中，R 首先获取指定目录中的所有文件名，并将它们放入一个*字符向量*中。然后，它将生成的字符向量赋值给一个名为\
  \ `monthly_reports` 的变量。\n\n`<-` 是一个赋值运算符，用于将值赋给 R 变量。\n\n以下是存储在 `monthly_reports`\
  \ 变量中的信息打印输出：\n\n```\n> monthly_reports\n[1] \"2010-12-01.csv\" \"2011-01-01.csv\"\
  \ \"2011-02-01.csv\"\n[4] \"2011-03-01.csv\" \"2011-04-01.csv\" \"2011-05-01.csv\"\
  \n[7] \"2011-06-01.csv\" \"2011-07-01.csv\" \"2011-08-01.csv\"\n[10] \"2011-09-01.csv\"\
  \ \"2011-10-01.csv\" \"2011-11-01.csv\"\n[13] \"2011-12-01.csv\" \"2012-01-01.csv\"\
  \ \"2012-02-01.csv\"\n[16] \"2012-03-01.csv\" \"2012-04-01.csv\" \"2012-05-01.csv\"\
  \n[19] \"2012-06-01.csv\" \"2012-07-01.csv\" \"2012-08-01.csv\"\n[22] \"2012-09-01.csv\"\
  \ \"2012-10-01.csv\" \"2012-11-01.csv\"\n[25] \"2012-12-01.csv\" \"2013-01-01.csv\"\
  \ \"2013-02-01.csv\"\n[28] \"2013-03-01.csv\" \"2013-04-01.csv\" \"2013-05-01.csv\"\
  \n[31] \"2013-06-01.csv\" \"2013-07-01.csv\" \"2013-08-01.csv\"\n[34] \"2013-09-01.csv\"\
  \ \"2013-10-01.csv\" \"2013-11-01.csv\"\n[37] \"2013-12-01.csv\" \"2014-01-01.csv\"\
  \n```\n\n#### 步骤 4：创建一个日期向量\n\n现在创建一个向量，其中包含每个文件名的日期表示形式。为了能够确定滚动 24 个月，你需要将文件名转换为日期格式。这可以通过两个步骤完成。第一步，移除“.csv”，这样你就得到一个可以解析为日期的字符串。为此，你可以使用\
  \ `stringr` 包中的 `str_replace()` 函数，并将输出赋值给一个名为 `date_format` 的字符向量。代码如下：\n\n```\n\
  date_format <- stringr::str_replace(monthly_reports, \".csv\",\"\")\n```\n\n`str_replace()`\
  \ 函数需要三个参数：你想要更改的字符串、你想要替换的字符串中的模式，以及你想要用作替换的字符串。以下是之前创建的 `date_format` 变量中存储内容的打印输出：\n\
  \n```\n> date_format\n[1] \"2010-12-01\" \"2011-01-01\" \"2011-02-01\" \"2011-03-01\"\
  \n[5] \"2011-04-01\" \"2011-05-01\" \"2011-06-01\" \"2011-07-01\"\n[9] \"2011-08-01\"\
  \ \"2011-09-01\" \"2011-10-01\" \"2011-11-01\"\n[13] \"2011-12-01\" \"2012-01-01\"\
  \ \"2012-02-01\" \"2012-03-01\"\n[17] \"2012-04-01\" \"2012-05-01\" \"2012-06-01\"\
  \ \"2012-07-01\"\n[21] \"2012-08-01\" \"2012-09-01\" \"2012-10-01\" \"2012-11-01\"\
  \n[25] \"2012-12-01\" \"2013-01-01\" \"2013-02-01\" \"2013-03-01\"\n[29] \"2013-04-01\"\
  \ \"2013-05-01\" \"2013-06-01\" \"2013-07-01\"\n[33] \"2013-08-01\" \"2013-09-01\"\
  \ \"2013-10-01\" \"2013-11-01\"\n[37] \"2013-12-01\" \"2014-01-01\"\n```\n\n请注意，`str_replace()`\
  \ 函数前面的 `stringr::` 并非必需。它只是为了明确该函数来自哪个包。\n\n接下来你需要做的是将字符串解析为日期。你可以使用 `lubridate`\
  \ 包中的 `ymd()` 函数来实现。以下是执行此操作所需的代码：\n\n```\ndate_format <- lubridate::ymd(date_format)\n\
  ```\n\n`ymd()` 函数是一个非常巧妙的函数！它可以将年-月-日格式的字符串解析为日期，并且非常宽容。它能很好地解析那些其他编程语言（如 Power\
  \ Query 中的 M）难以解析的日期字符串。你将生成的日期向量赋值给 `date_format` 变量。以下是 `date_format` 变量中存储内容的显示：\n\
  \n```\n> date_format\n[1] \"2010-12-01\" \"2011-01-01\" \"2011-02-01\" \"2011-03-01\"\
  \n[5] \"2011-04-01\" \"2011-05-01\" \"2011-06-01\" \"2011-07-01\"\n[9] \"2011-08-01\"\
  \ \"2011-09-01\" \"2011-10-01\" \"2011-11-01\"\n[13] \"2011-12-01\" \"2012-01-01\"\
  \ \"2012-02-01\" \"2012-03-01\"\n[17] \"2012-04-01\" \"2012-05-01\" \"2012-06-01\"\
  \ \"2012-07-01\"\n[21] \"2012-08-01\" \"2012-09-01\" \"2012-10-01\" \"2012-11-01\"\
  \n[25] \"2012-12-01\" \"2013-01-01\" \"2013-02-01\" \"2013-03-01\"\n[29] \"2013-04-01\"\
  \ \"2013-05-01\" \"2013-06-01\" \"2013-07-01\"\n[33] \"2013-08-01\" \"2013-09-01\"\
  \ \"2013-10-01\" \"2013-11-01\"\n[37] \"2013-12-01\" \"2014-01-01\"\n```\n\n输出看起来与应用\
  \ `ymd()` 函数之前相同，但实际上并非如此。你可以使用 `str()` 函数来检查它，从而证明这一点。`str()` 函数用于显示 R 对象的结构。如果你将\
  \ `date_format` 变量传递给 `str()` 函数，你将得到以下结果，证明它是一个*日期*数据类型：\n\n```\n> str(date_format)\n\
  Date[1:38], format: \"2010-12-01\" \"2011-01-01\" \"2011-02-01\"\n```\n\n建议你在 *R\
  \ 控制台* 中进行测试，而不是在 R Studio 的 R 脚本*编辑器*中进行，以防止将不应存在的代码添加到你的脚本中。\n\n\n\n#### 步骤 5：使用两个向量创建数据框\n\
  \n你希望将信息放入数据框中，因为将数据置于数据框内能极大简化分析过程。R 语言的数据框是一种二维表格对象，由可包含不同数据类型的变量（列）构成。它在某些方面类似于\
  \ *Microsoft Excel* 表格和 SQL Server 表格，但它是专门为数据分析而设计的。将 `monthly_reports` 变量和 `date_format`\
  \ 变量转换为数据框所需的代码如下所示：\n\n```\ndf <- tibbles::data_frame(monthly_reports, date_format)\n\
  ```\n\n你使用 `tibble` 包中的 `data_frame()` 函数，而不是基础 R 中的 `data.frame()` 函数，因为 `data.frame()`\
  \ 存在一些不良副作用。`data_frame()` 函数创建的对象类型称为 `tibble`，可以将其视为数据框的现代版本。我发现使用 tibble 更加理想。\n\
  \n我喜欢 `tibbles` 的一个特性是它们在屏幕上的打印方式。当你打印一个 `tibble` 时，只会输出前 10 行，并且只显示适合屏幕宽度的列。当你打印一个常规数据框时，R\
  \ 会显示更多信息，如果你处理的是大数据集，这可能会成为一个问题。你还可以从 tibble 中获取每列的数据类型，这是非常有价值的信息。以下是我打印 `df`\
  \ 数据框时的输出结果：\n\n```\n> df\n# A tibble: 38 x 2\nmonthly_reports date_format\n\n1\
  \ 2010-12-01.csv  2010-12-01\n2 2011-01-01.csv  2011-01-01\n3 2011-02-01.csv  2011-02-01\n\
  4 2011-03-01.csv  2011-03-01\n5 2011-04-01.csv  2011-04-01\n6 2011-05-01.csv  2011-05-01\n\
  7 2011-06-01.csv  2011-06-01\n8 2011-07-01.csv  2011-07-01\n9 2011-08-01.csv  2011-08-01\n\
  10 2011-09-01.csv  2011-09-01\n# ... with 28 more rows\n```\n\n#### 步骤 6：获取所需日期范围的上限和下限\n\
  \n你需要一个滚动 24 个月的窗口。因此，你需要计算定义该窗口所需的日期范围的上限和下限。你可以使用以下代码来实现：\n\n```\nmax_month <-\
  \ max(df$date_format)\nmin_month <- max_month %m+% lubridate::months(-23)\n```\n\
  \n你使用 `max()` 函数作用于 `df` 数据框中的 `date_format` 列来获取最大月份，并将结果赋值给 `max_month` 变量。接着，你获取\
  \ `max_month` 变量并从中减去 23 个月以得到最小月份，这是通过调用 `lubridate` 包中的 `%m+%` 运算符实现的。该运算符专门用于添加月份。在此示例中，你添加的是\
  \ -23 个月。结果值被赋值给 `min_month` 变量。\n\n#### 步骤 7：对数据框进行子集筛选，仅包含所需月份\n\n在此步骤中，你应用一个筛选条件，返回包含你想要合并的文件的向量。你通过应用一个筛选条件来实现，该条件仅返回月份大于或等于最小月份的文件。代码如下：\n\
  \n```\nreports_to_read <- df[df$date_format >= min_month, ]$monthly_reports\n```\n\
  \n在 R 中，你可以使用上述方法对数据框中的列进行筛选。方括号内的代码 `df$date_format >= min_month` 返回一个称为 `Boolean`\
  \ 向量的 R 对象。在该表达式中，`date_format` 列中的每个元素都与 `min_month` 变量进行比较，当列中的元素大于或等于 `min_month`\
  \ 时返回 `True`，否则返回 `False`。只有计算结果为 `True` 的行才会被保留。\n\n你只需要 `reports_to_read` 列。你通过使用\
  \ `df$monthly_reports` 语法在 `df` 数据框中对该列进行子集筛选。如果你想返回数据框中的所有列，你可以使用以下代码实现：\n\n```\n\
  reports_to_read <- df[df$date_format >= min_month, ]\n```\n\n这是一种依赖于基础 R 功能的子集筛选方法，在简单情况下效果很好。你将在本书后面学习更直观的方法，这些方法可用于更复杂的子集筛选场景。`reports_to_read`\
  \ 变量的内容如下所示：\n\n```\n> reports_to_read\n[1] \"2013-01-01.csv\" \"2013-02-01.csv\"\
  \ \"2013-03-01.csv\"\n[4] \"2013-04-01.csv\" \"2013-05-01.csv\" \"2013-06-01.csv\"\
  \n[7] \"2013-07-01.csv\" \"2013-08-01.csv\" \"2013-09-01.csv\"\n[10] \"2013-10-01.csv\"\
  \ \"2013-11-01.csv\" \"2013-12-01.csv\"\n[13] \"2014-01-01.csv\"\n```\n\n#### 步骤\
  \ 8：创建一个基于所有文件并集的数据框\n\n现在，你已将想要合并成一个数据框的文件列表保存在 `reports_to_read` 变量中。是时候实际进行合并了。你可以使用\
  \ R 中 `purrr` 包的 `map_df()` 函数，仅用一行代码就能轻松合并这些文件。代码如下：\n\n```\ndf_output <- purrr::map_df(reports_to_read,\
  \ read_csv)\n```\n\n这行代码使用 `map_df()` 函数将 `reports_to_read` 变量中的每个元素映射到 `readr`\
  \ 包中的 `read_csv()` 函数。函数名中的 `_df` 部分告诉你，该函数的结果将是一个包含所有文件数据的 R 数据框。以下是结果数据框的输出示例：\n\
  \n```\n> df_output\n# A tibble: 54,771 x 9\nCategory OrderDate           DueDate\n\
  \n1 Bikes    2013-01-01 05:00:00 2013-01-13 05:00:00\n2 Accesso~ 2013-01-01 05:00:00\
  \ 2013-01-13 05:00:00\n3 Accesso~ 2013-01-01 05:00:00 2013-01-13 05:00:00\n4 Bikes\
  \    2013-01-01 05:00:00 2013-01-13 05:00:00\n5 Bikes    2013-01-01 05:00:00 2013-01-13\
  \ 05:00:00\n6 Accesso~ 2013-01-01 05:00:00 2013-01-13 05:00:00\n7 Accesso~ 2013-01-01\
  \ 05:00:00 2013-01-13 05:00:00\n8 Bikes    2013-01-01 05:00:00 2013-01-13 05:00:00\n\
  9 Accesso~ 2013-01-01 05:00:00 2013-01-13 05:00:00\n10 Accesso~ 2013-01-01 05:00:00\
  \ 2013-01-13 05:00:00\n# ... with 54,761 more rows, and 6 more variables:\n#   ShipDate\
  \ , OrderQuantity , UnitPrice ,\n#   SalesAmount , TaxAmt , `Order Month` \n```\n\
  \n请注意信息打印得多么整洁。tibble 包只打印了适合屏幕显示的信息，并提供了未显示列（变量）的相关信息。\n\n#### 步骤 9：将代码合并到一个脚本中并粘贴到\
  \ Power BI 的 R 编辑器中\n\n现在，是时候将前面步骤中的所有代码片段整合起来，创建一个完整的脚本，以便你可以在 Power BI 中执行它。该脚本如代码清单\
  \ 3-1 所示，你现在可以将其粘贴到 Power BI 的 R 编辑器中。\n\n```\nlibrary(tidyverse)\nlibrary(lubridate)\n\
  library(stringr)\nsetwd(\"./Data/SalesData\")\nmonthly_reports <- list.files(pattern\
  \ = \"*.csv\")\ndate_format <- lubridate::ymd(gsub(\".csv\", \"\", monthly_reports))\n\
  df <- tibble::data_frame(monthly_reports, date_format)\nmax_month <- max(df$date_format)\n\
  min_month <- max_month %m+% lubridate::months(-23)\nreports_to_read <- df[df$date_format\
  \ >= min_month, ]$monthly_reports\ndf_output <- purrr::map_df(reports_to_read, read_csv)\n\
  代码清单 3-1\n合并文件所需的完整 R 脚本\n```\n\n复制 R 脚本中的代码，并打开此解决方案的 pbix 文件。接下来，点击 `获取数据` ➤ `更多`\
  \ ➤ `其他` 以打开连接器选项菜单。然后点击该菜单右侧的 `R 脚本`，如图 3-1 所示。\n\n![../images/480677_1_En_3_Chapter/480677_1_En_3_Fig1_HTML.jpg](img/480677_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n进入 R 脚本编辑器\n\n点击 `R 脚本` 后，Power BI 中的 R 编辑器将会出现，如图 3-2 所示。\n\n![../images/480677_1_En_3_Chapter/480677_1_En_3_Fig2_HTML.jpg](img/480677_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\nR 脚本编辑器\n\n现在，将代码清单 [1-1](https://doi.org/10.1007/978-1-4842-5829-3_1Listing#1)\
  \ 中的 R 脚本粘贴到编辑器中，然后点击 `确定`。现在，你就可以像处理导入 Power BI 的任何其他数据集一样处理生成的数据集了。你可以使用 Power\
  \ Query 对其进行进一步转换，或者直接将其加载到 Power BI 数据模型中。\n\n\n\n### 使用 Python 选取滚动 24 个月的数据\n\
  \n与 R 语言一样，Python 自 20 世纪 90 年代初就已存在。它也拥有许多工具和库，使得在滚动时间段内合并文件的任务相对容易。以下是使用 Python\
  \ 选取滚动 24 个月内文件的步骤。\n\n#### 步骤 1：创建 Python 脚本并加载必要的库\n\n你需要做的第一件事是加载脚本中将要使用的库和函数。你可以使用以下代码来完成：\n\
  \n```\nimport os\nimport pandas as pd\nfrom dateutil.relativedelta import relativedelta\n\
  ```\n\n这段代码加载了两个库（`os` 和 `pandas`）以及一个函数（`relativedelta`）。`os` 库用于与文件系统交互，`pandas`\
  \ 库用于简化数据分析，而来自 `dateutil` 库的 `relativedelta()` 函数则用于辅助日期操作。\n\n#### 步骤 2：将工作目录更改为\
  \ Python_Code 文件夹\n\n你使用 `os` 库中的 `chdir()` 函数，方式与你之前在 R 中使用 `setwd()` 函数相同。要设置工作目录，你需要向该函数提供一个文件路径，遵循我们在\
  \ R 中使用的相同规则。假设你将配套代码保存到了 `Documents` 文件夹，以下代码会将工作目录设置为 `Python_Code` 文件夹：\n\n```\n\
  os.chdir(\"C:/Users//Documents/AdvancedAnalyticsPowerBI/Python_Code\")\n```\n\n\
  现在，你的脚本可以使用相对文件路径来访问 `SalesData` 文件夹中的内容了。\n\n#### 步骤 3：将文件名读取到 Python 列表中\n\n现在，你将\
  \ `SalesData` 文件夹中的文件名读取到一个列表中。如果你想选择应包含在滚动 24 个月内的文件，你需要能够分析文件名以确定哪些文件应被包含。为此，你将使用\
  \ `os` 库中的 `os.listdir()` 函数，将 `SalesData` 文件夹中所有文件的名称获取到一个 Python 列表中。以下是执行此任务所需的代码：\n\
  \n```\nmonthly_reports = os.listdir(\"./Data/SalesData/\")\n```\n\n以下代码告诉 Python\
  \ 将 `SalesData` 文件夹中的所有文件名读取到一个 Python 列表中，并将该列表赋值给一个名为 `monthly_reports` 的变量。以下是\
  \ `monthly_reports` 变量中包含内容的打印输出：\n\n```\n>>> monthly_reports\n['2010-12-01.csv',\
  \ '2011-01-01.csv', '2011-02-01.csv',\n'2011-03-01.csv', '2011-04-01.csv', '2011-05-01.csv',\n\
  '2011-06-01.csv', '2011-07-01.csv', '2011-08-01.csv',\n'2011-09-01.csv', '2011-10-01.csv',\
  \ '2011-11-01.csv',\n'2011-12-01.csv', '2012-01-01.csv', '2012-02-01.csv',\n'2012-03-01.csv',\
  \ '2012-04-01.csv', '2012-05-01.csv',\n'2012-06-01.csv', '2012-07-01.csv', '2012-08-01.csv',\n\
  '2012-09-01.csv', '2012-10-01.csv', '2012-11-01.csv',\n'2012-12-01.csv', '2013-01-01.csv',\
  \ '2013-02-01.csv',\n'2013-03-01.csv', '2013-04-01.csv', '2013-05-01.csv',\n'2013-06-01.csv',\
  \ '2013-07-01.csv', '2013-08-01.csv',\n'2013-09-01.csv', '2013-10-01.csv', '2013-11-01.csv',\n\
  '2013-12-01.csv', '2014-01-01.csv']\n```\n\n#### 步骤 4：创建一个 pandas 数据框，用于保存待合并文件的信息\n\
  \n`pandas` 数据框是一种类似于 R 语言数据框的数据结构。你将利用 pandas 数据框来完成此任务。手动创建 pandas 数据框最简单的方法之一是将\
  \ Python 字典转换为数据框。你可以将字典视为一种包含一个或多个键/值对的 Python 数据结构。\n\n你将创建一个包含一个键/值对的字典，命名为 `d`，它将基于\
  \ `monthly_reports` 变量。你将使用的代码如下：\n\n```\nd = {'monthly_reports': monthly_reports}\n\
  ```\n\n接下来，你使用以下代码将字典转换为 pandas 数据框：\n\n```\ndf = pd.DataFrame(d)\n```\n\n上述代码接收字典\
  \ `d`，并使用它创建一个单列数据框。字典 `d` 中的键用作列名，字典 `d` 中的值包含将填充行的项目。\n\n#### 步骤 5：创建一个新列，从 monthly_reports\
  \ 列中提取日期信息\n\n现在你需要一个仅包含日期信息的新列。你使用以下代码创建该新列：\n\n```\ndf[\"date_format\"] =pd.to_datetime(\n\
  df.monthly_reports.str.replace(\".csv\",\"\")\n)\n```\n\n这段代码首先从 `monthly_reports`\
  \ 列的文件名中去除字符串 `.csv`。这样做之后，你会得到一个有效的日期，但它是字符串格式。为了获得日期格式的值，你使用 `pandas` 库中的 `to_datetime()`\
  \ 函数将字符串解析为日期格式。\n\n#### 步骤 6：获取日期范围的上限和下限\n\n现在，你可以获取所需日期范围的上限和下限了。你的目标是滚动 24 个月的范围。你可以使用以下代码生成所需的月份范围：\n\
  \n```\nmin_month = df.date_format.max() - relativedelta(months=23)\n```\n\n计算 `min_month`\
  \ 的逻辑是，首先通过获取 `date_format` 列的最大值来找到文件夹中文件的最大月份。请注意，你是通过使用点符号访问 `date_format` 列的\
  \ `max()` 方法来完成的。\n\npandas 数据框中的每一列都是 `series` 对象类型。`series` 对象类型包含内置方法，你可以根据 `series`\
  \ 的数据类型来使用这些方法。对于 `datetime` 数据类型的 `series` 对象，可用的方法之一是 `max()` 方法。\n\n现在你已经有了报告文件的最大日期，你可以计算比最大日期早\
  \ 24 个月的日期。你通过使用 `dateutil` 库中的 `relativedelta()` 函数并传递 `months=23` 作为参数来实现这一点。使用\
  \ `relativedelta()` 函数的结果是，将从 `date_format` 列的最大日期中减去 23 个月。\n\n#### 步骤 7：对数据框进行子集化\n\
  \n现在你已经知道了日期范围，你可以对 `df` 数据框进行子集化，使其仅包含代表该范围内数据的行。你使用以下代码来实现：\n\n```\nreports_to_read\
  \ = df[df[\"date_format\"]>=min_month]\n```\n\n方括号中的代码基于 `date_format` 列中的给定日期是否大于\
  \ `min_month` 变量，创建了一个布尔值序列。Python 使用 `True` 值对 `df` 数据框进行子集化，并将结果赋值给 `reports_to_read`\
  \ 变量。以下是 `reports_to_read` 变量内容的打印输出：\n\n```\n>>> reports_to_read\nmonthly_reports\
  \ date_format\n14  2012-02-01.csv  2012-02-01\n15  2012-03-01.csv  2012-03-01\n\
  16  2012-04-01.csv  2012-04-01\n17  2012-05-01.csv  2012-05-01\n18  2012-06-01.csv\
  \  2012-06-01\n19  2012-07-01.csv  2012-07-01\n20  2012-08-01.csv  2012-08-01\n\
  21  2012-09-01.csv  2012-09-01\n22  2012-10-01.csv  2012-10-01\n23  2012-11-01.csv\
  \  2012-11-01\n24  2012-12-01.csv  2012-12-01\n25  2013-01-01.csv  2013-01-01\n\
  26  2013-02-01.csv  2013-02-01\n27  2013-03-01.csv  2013-03-01\n28  2013-04-01.csv\
  \  2013-04-01\n29  2013-05-01.csv  2013-05-01\n30  2013-06-01.csv  2013-06-01\n\
  31  2013-07-01.csv  2013-07-01\n32  2013-08-01.csv  2013-08-01\n33  2013-09-01.csv\
  \  2013-09-01\n34  2013-10-01.csv  2013-10-01\n35  2013-11-01.csv  2013-11-01\n\
  36  2013-12-01.csv  2013-12-01\n37  2014-01-01.csv  2014-01-01\n```\n\n\n\n### 第\
  \ 8 步：将文件合并为一个数据框\n\n你需要创建一个基于滚动 24 个月时间段内所有文件并集的数据框。可以通过以下代码实现：\n\n```\ndf_output\
  \ = pd.concat(\nmap(\npd.read_csv,\n\"./Data/SalesData/\"+reports_to_read[\"monthly_reports\"\
  ]))\n```\n\n这段代码使用了 `map()` 函数，其用法与你之前在 R 语言中使用的 `purrr` 包中的 `map_df()` 函数类似。上述代码中的\
  \ `map` 函数将 pandas 中的 `read_csv()` 函数映射到 `monthly_reports` 序列的每个元素上，从而生成一个数据框列表。接着，使用\
  \ `pandas` 中的 `concat()` 函数将该数据框列表合并为一个数据框。\n\n### 第 9 步：将代码添加到 Power BI\n\n此任务的完整代码如代码清单\
  \ 3-2 所示。\n\n```\nimport os\nimport pandas as pd\nfrom dateutil.relativedelta import\
  \ relativedelta\nos.chdir(\"\")\nmonthly_reports = os.listdir(\"./Data/SalesData\"\
  )\nd = {'monthly_reports': monthly_reports}\ndf = pd.DataFrame(d)\ndf[\"date_format\"\
  ] = pd.to_datetime(\ndf.monthly_reports.str.replace(\".csv\",\"\"))\nmin_month =\
  \ df.date_format.max() - relativedelta(months=23)\nreports_to_read = df[df[\"date_format\"\
  ]>=min_month]\ndf_output = pd.concat(\nmap(\npd.read_csv,\n\"./Data/SalesData/\"\
  +reports_to_read[\"monthly_reports\"]))\n```\n\n**代码清单 3-2** 合并文件所需的完整 Python 脚本\n\
  \n复制 Python 脚本中的代码，然后打开本例的 `pbix` 文件。接下来，依次点击 *获取数据* ➤ *更多* ➤ *其他*，并在右侧选择 *Python\
  \ 脚本*。图 3-3 展示了找到 Python 脚本编辑器的界面。\n\n![../images/480677_1_En_3_Chapter/480677_1_En_3_Fig3_HTML.jpg](img/480677_1_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** 查找 Python 脚本编辑器的位置\n\n执行该操作后，Power BI 的 Python 编辑器将如图 3-4 所示。\n\n![../images/480677_1_En_3_Chapter/480677_1_En_3_Fig4_HTML.jpg](img/480677_1_En_3_Fig4_HTML.jpg)\n\
  \n**图 3-4** Python 脚本编辑器\n\n将你的 Python 脚本粘贴到该编辑器中，然后点击 *确定*。现在，你可以像处理导入 Power BI\
  \ 的任何其他数据集一样处理生成的数据集。你可以使用 Power Query 对其进行进一步转换，也可以直接将其加载到数据模型中。\n\n在本节中，我们学习了如何利用\
  \ R 和 Python 中文件名包含的信息，确定滚动 24 个月时间段内的文件。完成此任务所需的代码比实现相同功能的 M 代码更直接、更直观。\n\n你可能永远不需要执行这个确切的任务，但你可以根据需求修改本节所学的内容。我希望你打开思路，探索\
  \ R 和 Python 在 Power BI 中提供的各种可能性。你刚刚了解到，使用 R 和 Python 与文件系统中的文件交互是多么简单。随着本书的深入，你还会学到\
  \ R 和 Python 中其他强大的功能。接下来，你将学习如何利用 R 和 Python 中的正则表达式来过滤 `csv` 文件中的行。\n\n## 基于正则表达式过滤行\n\
  \n在大多数情况下，Power BI 可以让你轻松删除不希望加载到数据模型中的记录。但在某些情况下，使用 Power BI 原生工具无法实现过滤数据所需的逻辑。一个例子是，需要根据只能通过*正则表达式*匹配的字符串模式来过滤数据集中的记录。你无法在\
  \ Power Query 中使用*正则表达式*，但在 R 和 Python 中都可以。\n\n在接下来的场景中，假设你是一个政治竞选活动的首席分析师。你有一个包含潜在选民名单的文件，需要为一次电子邮件活动进行分析。你只想在基于\
  \ Power BI 的分析中包含那些拥有格式正确电子邮件地址的选民。你将使用*正则表达式*来检测数据集中的电子邮件地址格式是否正确。因此，在分析中，电子邮件地址为\
  \ `johndoe@email` 的记录将被丢弃，而电子邮件地址为 `janedoe@email.com` 的记录将被保留。清洗后的结果将是一个仅包含格式正确电子邮件地址的数据集，该数据集将被加载到\
  \ Power BI 数据模型中。\n\n\n\n### 通过 R 语言利用正则表达式\n\n在撰写本书时，此任务无法使用 Power Query 完成，因为\
  \ Power Query 中不提供*正则表达式*。但在 R 语言中情况并非如此，因为*正则表达式*在该编程语言中是“一等公民”。用 R 语言完成此任务所需的代码简洁直观。以下是具体步骤。\n\
  \n#### 步骤 1：加载所需包\n\n你需要做的第一件事是加载所需的包，以便在 R 中执行任务。所需的两个包是 `tidyverse` 和 `stringr`。使用以下代码导入所需包：\n\
  \n```\nlibrary(tidyverse)\nlibrary(stringr)\n```\n\n请注意，`stringr` 是 `tidyverse`\
  \ 的一部分，但它不属于加载 `tidyverse` 元包时加载的核心包，因此你需要显式加载它。\n\n#### 步骤 2：将包含潜在选民的文件加载到 R 中\n\
  \n使用以下代码完成此任务：\n\n```\nsetwd(\"path to where the R_Code folder is located\")\ngoodemails_raw\
  \ <- read_csv(\"./Data/EmailAddresses.csv\")\n```\n\n这段代码很直接。首先，使用 `setwd()` 函数将工作目录设置为\
  \ `R_Code` 文件夹。接着，使用*相对文件路径引用*导航到 `EmailAddresses.csv` 文件。\n\n#### 步骤 3：定义正则表达式\n\
  \n使用以下代码定义所需的正则表达式：\n\n```\nemail_pattern <- \"^([a-zA-Z][\\\\w\\\\_]{4,20})\\\\\
  @([a-zA-Z0-9.-]+)\\\\.([a-zA-Z]{2,3})$\"\n```\n\n上述正则表达式将用于匹配格式良好的电子邮件地址的模式。请注意，上述正则表达式代表一行代码，但由于页面宽度限制，它占据了两行。不要为正则表达式的复杂性感到惊慌。你通常可以通过必应搜索找到给定任务所需的正则表达式。记住，*“优秀的程序员写优秀的代码；伟大的程序员窃取优秀的代码”*（佚名）。不过，我不会将通过互联网搜索找到的正则表达式称为“窃取”，因为许多开发者的利他天性使他们愿意与社区分享知识。\n\
  \n#### 步骤 4：从数据集中移除无效的电子邮件地址\n\n你将使用以下代码完成此操作：\n\n```\ngoodemails <- goodemails_raw\
  \ %>%\n  filter(str_detect(Email, email_pattern) == TRUE)\n```\n\n该代码使用 `dplyr`\
  \ 包中的 `filter()` 函数来过滤 `goodemails_raw` 数据框。过滤操作通过 `stringr` 包中的 `str_detect()`\
  \ 函数完成。`str_detect()` 函数使你能够测试字符串是否匹配正则表达式模式。如果匹配传递给它的正则表达式模式，则返回 `TRUE`；否则返回 `FALSE`。`filter()`\
  \ 函数将仅保留 `str_detect()` 函数评估为 `TRUE` 的行。\n\n#### 步骤 5：将上述代码合并为一个脚本并粘贴到 Power BI\
  \ 的 R 编辑器中\n\n完整脚本见代码清单 3-3。\n\n```\nlibrary(tidyverse)\nlibrary(stringr)\nsetwd(\"\
  \")\ngoodemails_raw <- read_csv(\"./Data/EmailAddresses.csv\")\nemail_pattern <-\
  \ \"^([a-zA-Z][\\\\w\\\\_]{4,20})\\\\@([a-zA-Z0-9.-]+)\\\\.([a-zA-Z]{2,3})$\"\n\
  goodemails <- goodemails_raw %>%\n  filter(str_detect(Email, email_pattern) == TRUE)\n\
  代码清单 3-3\n用于清理无效电子邮件的完整 R 脚本\n```\n\n复制 R 脚本中的代码，然后打开此解决方案的 `pbix` 文件。接下来，点击 *获取数据*\
  \ ➤ *更多* ➤ *其他*，然后在右侧选择 *R 脚本*。将代码粘贴到 Power BI 的 *R 编辑器* 中后，点击 *确定*。生成的数据集将被添加到\
  \ Power BI 数据模型中。\n\n### 通过 Python 利用正则表达式\n\n在本练习中，你将使用 Python 在 Power BI 中利用*正则表达式*。与\
  \ R 一样，完成此任务所需的 Python 代码简洁直观。以下是具体步骤。\n\n#### 步骤 1：加载所需库\n\n你需要做的第一件事是加载任务所需的库。我们需要的两个库是\
  \ `os` 和 `pandas`。使用以下代码加载库：\n\n```\nimport os\nimport pandas as pd\n```\n\n####\
  \ 步骤 2：将包含潜在选民的文件加载到 Python 中，并将内容分配给 Pandas 数据框\n\n使用以下代码完成此任务：\n\n```\nos.chdir(\"\
  \")\ngoodemails_raw = pd.read_csv(\"\")\n```\n\n首先，将工作目录更改为 `Python_Code` 文件夹，然后将\
  \ `EmailAddresses.csv` 文件的内容读入 pandas 数据框，并将结果分配给 `goodemails_raw` 变量。\n\n#### 步骤\
  \ 3：定义匹配格式良好的电子邮件地址模式的正则表达式\n\n使用以下代码完成此操作：\n\n```\nemail_pattern <- \"^([a-zA-Z][\\\
  \\w\\\\_]{4,20})\\\\@([a-zA-Z0-9.-]+)\\\\.([a-zA-Z]{2,3})$\"\n```\n\n上述正则表达式用于测试电子邮件地址。代码被分成两行，但实际上只代表一行代码。由于本书的宽度限制，它被分成两行。请注意，你在\
  \ R 中使用的相同正则表达式在 Python 中同样有效。不要为正则表达式的复杂性感到惊慌。你通常可以通过必应搜索找到给定任务所需的正则表达式。\n\n####\
  \ 步骤 4：从数据集中移除无效的电子邮件地址\n\n你将使用以下代码移除包含无效电子邮件地址的行：\n\n```\ngoodemails = goodemails_raw[\n\
  goodemails_raw[\"Email\"].str.match(email_pattern)]\n```\n\n该代码的工作原理是：首先使用位于开闭括号之间的\
  \ `goodemails[\"Email\"].str.match(email_pattern)` 代码创建一个布尔型 pandas 序列。然后使用该布尔序列过滤数据框，仅保留代码评估为\
  \ `True` 的行。\n\n#### 步骤 5：将上述代码合并为一个脚本并粘贴到 Power BI 的 Python 编辑器中\n\n完整脚本见代码清单 3-4。\n\
  \n```\nimport os\nimport pandas as pd\nos.chdir(\"C:/Users/ryanwade44/Downloads/Advanced\
  \ Analytics in Power BI with R and Python/Chapterx03/R_Code\")\ngoodemails_raw =\
  \ pd.read_csv(\"./Data/EmailAddresses.csv\")\nemail_pattern = \"^([a-zA-Z][\\\\\
  w\\\\_]{4,20})\\\\@([a-zA-Z0-9.-]+)\\\\.([a-zA-Z]{2,3})$\"\ngoodemails = goodemails_raw[\n\
  goodemails_raw[\"Email\"].str.match(email_pattern)]\n代码清单 3-4\n完整的 Python 脚本\n```\n\
  \n现在，复制代码清单 3-4 中的代码，并打开此解决方案的 `pbix` 文件。接下来，点击 *获取数据* ➤ *更多* ➤ *其他*，然后在右侧选择 *Python\
  \ 脚本*。之后，将代码粘贴到 *Python 编辑器* 中，然后点击 *确定*，这会将数据集添加到 Power BI 数据模型中。\n\n如本例所示，正则表达式在字符串模式匹配方面极其有用。它们是所有数据分析师工具箱中非常有价值的工具。它们在\
  \ Power Query 中不可用，但幸运的是，它们在 Python 和 R 中可用。这只是一个例子，说明正则表达式如何帮助你完成使用 Power Query\
  \ 字符串函数无法实现的模式匹配任务。请继续阅读，你将在本书后面看到更多关于如何使用*正则表达式*的示例。接下来，我们将学习如何将 MS Excel 文件读取到\
  \ Power BI 数据模型中。\n\n\n\n"
- "# 4. 读取 Excel 文件\n\nPower BI 内置了可让您将 Microsoft Excel 文件读取到 Power BI 数据模型中的工具。对于简单的工作流程，这些内置功能直观且易于使用，但当工作流程变得复杂时，事情可能会变得不必要的困难。许多使用原生\
  \ Power BI 工具难以完成的工作流程，使用 R 或 Python 则相对容易。我们将通过一个示例来说明。\n\n场景如下：\n\n-   假设现在是 2014\
  \ 年 2 月 2 日，您是 Contoso International 的首席财务官。\n-   您通过 IT 部门提供的 MS Excel 工作簿按年接收销售数据，并将数据保存在名为\
  \ `ExcelFiles` 的文件夹中。\n-   每个工作簿按年份拆分，工作簿中的每个月都有对应的工作表。\n-   `ExcelFiles` 文件夹总共包含五个工作簿。2010\
  \ 日历年的工作簿仅包含该年 12 月的销售数据，2011–2013 日历年的工作簿包含全年的数据，而 2014 日历年的工作簿仅包含该年 1 月的数据。\n\
  -   每个月初，工作簿中会添加一个新工作表，其中包含上个月的销售数据。\n-   每年 2 月初，您会收到一个当前年份的新工作簿，其更新方式与之前的工作簿相同。\n\
  \n您需要合并这些文件，以便执行所需的财务分析。您曾尝试使用 Power Query 自动执行此操作，但未能成功，因为它需要难以理解的高级 Power Query\
  \ 技术，因此您决定尝试使用 R 和 Python 开发解决方案。您的朋友 Tyrone 精通 R 和 Python，他能够帮助您。他为您提供了如何使用 R 和\
  \ Python 完成此任务的步骤。我们将先介绍 R 示例。\n\n## 使用 R 读取 Excel 文件\n\n在此示例中，您将创建一个工作流程，该流程：\n\
  \n1.  循环遍历 `ExcelFiles` 文件夹中的每个工作簿\n2.  将工作簿中每个工作表的数据合并到一个数据框中\n3.  将步骤 2 中创建的数据框追加到主数据框中，该主数据框将在工作流程完成后存储来自所有工作簿的数据\n\
  \n图 4-1 中的图像直观地展示了这些步骤。\n\n![../images/480677_1_En_4_Chapter/480677_1_En_4_Fig1_HTML.jpg](img/480677_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1：在 R 数据框中合并总销售额的工作流程\n\n现在，让我们来看看将上述工作流程转换为 R 代码所需的步骤。\n\n### 步骤 1：导入 tidyverse\
  \ 和 readxl 包\n\n此工作流程使用的包是 `tidyverse` 和 `readxl`。您已经熟悉 `tidyverse`。`readxl` 包类似于\
  \ `readr` 包，但专门设计用于处理 Microsoft Excel 工作簿。以下是加载这些包所需的代码：\n\n```\nlibrary(tidyverse)\n\
  library(readxl)\n```\n\n### 步骤 2：创建 combine_sheets 函数的框架\n\n在此步骤中，您将创建一个函数的开头，该函数将读取指定工作簿的工作表中包含的数据，并将它们合并到一个数据框中。您要操作的\
  \ Excel 工作簿的文件路径将传递给该函数。以下是该函数的框架：\n\n```\ncombine_sheets \nreturn()\n}\n```\n\n\
  ### 步骤 3：从指定的 Excel 工作簿中获取需要合并的工作表名称\n\n现在，您需要开始定义函数的主体。您的函数需要识别工作簿中需要合并的工作表。它将使用以下代码来实现：\n\
  \n```\ndf %>%\n  excel_sheets()\n```\n\n上述代码使用包含在 `excel_file_path` 变量中的 Excel 工作簿的文件路径启动一个工作流程。该路径下的工作簿包含您要合并的工作表。`excel_file_path`\
  \ 变量通过管道（`%>%`）运算符传递给 `readxl` 包中的 `excel_sheets()` 函数。`excel_sheets()` 函数返回一个字符向量，其中包含位于\
  \ `excel_file_path` 变量指定路径下的工作簿中所有工作表的名称。此函数严重依赖 `%>%` 运算符。如果您需要解释其含义及使用方法，请参考本书的引言。\n\
  \n### 步骤 4：将步骤 3 中构建的字符向量转换为命名字符向量\n\n您将步骤 3 中创建的字符向量转换为*命名字符向量*。*命名字符向量*的 name\
  \ 属性将用于标识此示例中生成的结果数据框的行来自哪个工作表。*命名字符向量*使用以下代码创建：\n\n```\ndf %>%\n  excel_sheets()\
  \ %>%\n  set_names() %>%\n```\n\n上述代码获取由 `excel_sheets()` 函数创建的字符向量，并将其传递给 `purrr`\
  \ 包中的 `set_names()` 函数。此函数将字符向量中每个元素的名称设置为其自身。通过检查应用 `set_names()` 函数前后的 `df` 变量，您可以更好地理解此函数。以下是应用\
  \ `set_names()` 之前 `df` 变量的内容：\n\n```\n> df\n[1] \"Jan\" \"Feb\" \"Mar\" \"Apr\"\
  \ \"May\" \"Jun\" \"Jul\" \"Aug\" \"Sep\" \"Oct\" \"Nov\" \"Dec\"\n```\n\n以下是应用\
  \ `set_names()` 函数之后 `df` 变量的内容：\n\n```\n> df\nJan   Feb   Mar   Apr   May   Jun\
  \   Jul   Aug   Sep   Oct   Nov   Dec\n\"Jan\" \"Feb\" \"Mar\" \"Apr\" \"May\" \"\
  Jun\" \"Jul\" \"Aug\" \"Sep\" \"Oct\" \"Nov\" \"Dec\"\n```\n\n请注意，字符向量中的每个元素都被赋予了与其值相等的名称。您将在下一步中利用此属性。\n\
  \n您不限于将字符向量命名为其自身。您可以传递一个长度相同的字符向量，其中包含您想要使用的名称，或者，在名称已存在且您希望根据某些规则修改它的情况下，传递一个函数。\n\
  \n\n\n### 步骤 5：使用 `mapr_df` 函数将多个工作表合并为一个数据框\n\n在此步骤中，你只需在工作流中添加一行代码，但这行代码包含了许多需要拆解的内容。添加额外代码后的工作流如下所示：\n\
  \n```\ndf % \n  excel_sheets() %>% \n  set_names() %>% \n  map_dfr(.f = ~read_excel(path\
  \ = excel_file_path, sheet = ..1)\n          ,.id = \"sheet\"\n  )\n```\n\n我们来解释一下最后一行代码的作用：\n\
  \n-   上一步创建的命名字符向量作为第一个参数传递给 `map_dfr()` 函数。\n-   `.f` 参数用于告诉 `map_dfr()` 你想要应用于所传递的命名字符向量的函数。此处的函数是\
  \ `read_excel()`。你通过一个*公式*来描述如何使用 `read_excel()` 函数。该*公式*以 `~` 开头，后跟 `read_excel()`\
  \ 函数及其参数。它使用的参数是 `path` 和 `sheet`。包含要合并的工作表的工作簿文件路径被赋值给 `path` 参数，而命名字符向量中的值被赋值给\
  \ `sheet` 参数。赋值给该参数的值是 `..1`。这种方法用于根据位置获取我们想要使用的参数。命名字符向量通过 `set_names()` 作为第一个参数传递给\
  \ `map_dfr()` 函数，这就是我们使用 `..1` 的原因。如果它在第 *n* 个位置，那么我们会将值设置为 `..n`。\n-   `map_dfr()`\
  \ 函数将为工作簿中每个工作表创建的数据框合并，并折叠成一个数据框。你可以向生成的数据框中添加一个字段，以便确定记录来自哪个工作表。你可以使用 `.id` 参数来实现这一点。如果使用此选项，则会添加一个列，该列使用*命名字符向量*中的名称来填充。如果你没有使用命名字符向量，则会使用字符向量中工作表名称的位置。你赋予此参数的值将用作列名。\n\
  \n### 步骤 6：返回数据框\n\n你希望函数返回创建的数据框。为此，你使用 `return` 语句和你创建的 `df` 数据框。完成此操作后，函数的完整定义如下所示：\n\
  \n```\ncombine_sheets <- function(excel_file_path) {\n  df % \n    excel_sheets()\
  \ %>% \n    set_names() %>% \n    map_df(.f = ~read_excel(path = excel_file_path,\
  \ sheet = ..1)\n           ,.id = \"sheet\"\n    )\n  return(df)\n}\n```\n\n###\
  \ 步骤 7：将工作目录设置为 Excel 文件所在的位置\n\n现在你已经定义了函数，困难的部分已经完成。你需要编写代码，利用自定义的 `combine_sheets()`\
  \ 函数来合并 `ExcelFiles` 文件夹中工作簿的数据。你需要做的第一件事是设置工作目录，以便 Power BI 知道要使用哪个文件夹。你可以使用以下代码来实现：\n\
  \n```\nsetwd(\"\")\n```\n\n### 步骤 8：将文件名赋值给 `excel_file_paths` 变量\n\n你使用 `list.files()`\
  \ 函数获取当前目录中的文件名，并使用以下代码将其赋值给名为 `excel_file_paths` 的变量：\n\n```\nexcel_file_paths\
  \ <- list.files(\".\")\n```\n\n传递给 `list.files()` 函数的 `\".\"` 告诉它你想要返回当前工作目录中的所有文件。你可以通过\
  \ `\"./<嵌套文件夹名称>\"` 的方式指定一个嵌套文件夹。`list.files()` 函数也接受一个包含一个或多个要检查的路径的完整路径名的字符向量。\n\
  \n### 步骤 9：使用 `map_dfr` 函数将 `combine_sheets` 函数应用于工作目录中的每个文件\n\n现在你到了将所有工作簿中的数据合并到一个数据框的步骤。所需的代码如下：\n\
  \n```\ncombine_workbooks <- map_dfr(excel_file_paths, combine_sheets)\n```\n\n`map_dfr()`\
  \ 函数将自定义函数 `combine_sheets()` 应用于 `excel_file_paths` 字符向量中包含的 Excel 文件名。这样做的结果是一个数据框列表。`map_dfr()`\
  \ 函数将该数据框列表折叠成一个数据框，并将该数据框命名为 `combine_workbooks`。\n\n### 步骤 10：复制 R 脚本并通过 Power\
  \ BI 中的“获取数据”将其粘贴到 R 编辑器中\n\n前面步骤生成的脚本如下：\n\n```\nlibrary(tidyverse)\nlibrary(readxl)\n\
  combine_sheets <- function(excel_file_path) {\n  df % \n    excel_sheets() %>% \n\
  \    set_names() %>% \n    map_dfr(.f = ~read_excel(path = excel_file_path, sheet\
  \ = ..1)\n            ,.id = \"sheet\"\n    )\n  return(df)\n}\nsetwd(\"\")\nexcel_file_paths\
  \ <- list.files(\".\")\ncombine_workbooks <- map_dfr(excel_file_paths, combine_sheets)\n\
  ```\n\n将代码粘贴到 Power BI 的 R 编辑器后，生成的数据集将像导入 Power BI 的任何其他数据集一样向你公开。\n\n## 使用 Python\
  \ 读取 Excel 文件\n\n现在你将使用 Python 执行相同的任务。工作流将类似，但执行方式会略有不同。图 4-2 中的图像直观地描述了将在 Python\
  \ 中使用的工作流。\n\n![../images/480677_1_En_4_Chapter/480677_1_En_4_Fig2_HTML.jpg](img/480677_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2 在 Pandas 数据框中合并总销售额的工作流\n\n### 步骤 1：导入 `os` 和 `pandas` 库\n\n此工作流使用的库是 `os`\
  \ 和 `pandas`。`os` 库用于与文件系统交互，`pandas` 用于将 Excel 中的数据读取到 Python 中。\n\n### 步骤 2：创建\
  \ `combine_sheets` 函数的框架\n\n你需要创建一个自定义函数，用于读取 Excel 工作簿中工作表的内容，并将它们合并到一个数据框中。你需要向该函数传递包含要合并的工作表的\
  \ Excel 工作簿的文件路径。以下是用于执行此任务的自定义函数的框架：\n\n```\ndef combine_sheets(excel_file_path):\n\
  \n    return \n```\n\n### 步骤 3：基于 `excel_file_path` 变量中指定路径的工作簿创建一个 Excel 对象\n\n\
  你已经定义了函数的框架；现在让我们开始编写将放入函数主体中的代码。你首先使用以下代码创建一个 Excel 对象：\n\n```\nxlsx_file = pd.ExcelFile(excel_file_path)\n\
  ```\n\n该代码使用 `pandas` 中的 `ExcelFile` 类来创建对象。它只需要 Excel 工作簿的文件路径。\n\n### 步骤 4：创建\
  \ `excel_file_path` 变量指定的工作簿中的工作表名称列表\n\n该函数需要知道要合并哪些工作表。你可以使用在*步骤 3* 中创建的 `xlsx_file`\
  \ 对象的 `sheet_names` 属性来获取该信息。你可以使用以下代码来实现：\n\n```\nws = xlsx_file.sheet_names\n\
  ```\n\n该代码从 `xlsx_file` 的 `sheet_names` 属性中获取工作表名称，并将它们存储在 `ws` 变量中。\n\n\n\n###\
  \ 步骤 5：使用 `pandas` 的 `read_excel` 方法将每个工作表中的数据读取到一个数据框中\n\n你可以通过以下代码行完成*步骤 5*：\n\
  \n```\ndf = pd.concat(pd.read_excel(xlsx_file, sheet_name=ws))\n```\n\n这段代码中发生了两个主要任务，因此将其拆解为多个步骤会更易于理解。首先，`pandas`\
  \ 使用 `pd.read_excel(xlsx_file, sheet_name=ws)` 从工作簿的工作表中读取数据，并将它们放入单独的数据框中。第一个参数未命名，但它是\
  \ `io` 参数。在此处，你需要指定要读取的 MS Excel 文件。第二个参数是 `sheet_name` 参数，用于告诉 `read_excel()` 方法要从指定工作簿中读取哪些工作表。`ws`\
  \ 变量用于向 `read_excel()` 提供该信息。其次，`pandas` 通过 `concat()` 方法（来自 `pandas`）将使用 `read_excel()`\
  \ 方法创建的各个数据框合并为一个数据框。最终的数据框被赋值给名为 `df` 的变量。\n\n### 步骤 6：将 `df` 中保存的数据框作为 `combine_sheets`\
  \ 函数的输出返回\n\n这通过 `return` 语句完成，如下所示：\n\n```\nreturn df\n```\n\n### 步骤 7：将工作目录设置为包含要合并的\
  \ Excel 数据的位置\n\n现在，你已经完整定义了 `combine_sheets()` 自定义函数。接下来，你需要编写代码，使用该函数将 `ExcelFiles`\
  \ 文件夹中工作簿的工作表合并到一个数据框中。首先，你需要将工作目录设置为包含 Excel 工作簿的位置。你可以使用以下代码完成此操作：\n\n```\nos.chdir(\"\
  \")\n```\n\n### 步骤 8：获取当前工作目录中的文件名列表，并将其赋值给 `excel_file_paths` 变量\n\n你的脚本需要知道要合并的\
  \ MS Excel 工作簿的名称。你可以使用 `listdir()` 函数获取工作簿的名称，如下列代码所示：\n\n```\nexcel_file_paths\
  \ = os.listdir(\".\")\n```\n\n该代码假设当前文件夹中只包含你想要合并的 Excel 文件。在运行脚本之前，需要验证这一点。\n\n\
  ### 步骤 9：创建一个空数据框并将其命名为 `combined_workbooks`\n\n在此步骤中，你创建一个名为 `combined_workbooks`\
  \ 的空数据框，它将作为主数据框，存储来自所有工作簿的数据。创建空数据框所需的代码如下：\n\n```\ncombined_workbooks = pd.DataFrame()\n\
  ```\n\n使用 `combined_sheets` 函数为每个工作簿创建的数据框将被追加到此数据框中。\n\n### 步骤 10：创建 `for` 循环的框架\n\
  \nPython 中的 `for` 循环使你能够遍历一个序列。在本例中，要遍历的序列是 `excel_file_paths` 列表。脚本使用以下代码遍历 `excel_file_paths`\
  \ 列表：\n\n```\nfor excel_file_path in excel_file_paths:\n```\n\n你将在 Python 中大量使用\
  \ `for` 循环，因此让我们花些时间来解释其结构。`for` 循环可以使用以下模板来描述：\n\n```\nfor <variable> in <sequence>:\n\
  ```\n\n保存当前迭代值的变量可以任意命名。通常，该名称是序列对象名称的单数形式。序列对象是你正在迭代的对象。在此脚本中，它是 `excel_file_paths`\
  \ 列表。让我们逐步解释其运作方式。\n\n如果你打印出 `excel_file_paths` 的内容，你会看到以下数据：\n\n`['2010.xlsx',\
  \ '2011.xlsx', '2012.xlsx', '2013.xlsx', '2014.xlsx']`\n\n你可以看到 `excel_file_paths`\
  \ 是一个包含五个元素的列表。脚本中的 `for` 循环遍历此列表，并在第一次迭代后将值 `'2010.xlsx'` 赋值给 `excel_file_path`\
  \ 变量，第二次迭代后将值 `'2011.xlsx'` 赋值给 `excel_file_path` 变量，并继续对列表中的每个元素执行此操作，直到遍历完所有元素。\n\
  \n### 步骤 11：使用 `combine_sheets` 函数将每个工作表中的所有数据合并到一个数据框中\n\n以下代码获取 `excel_file_path`\
  \ 变量中的文件路径，并将其传递给 `combine_function()`：\n\n```\ncombined_workbook = combine_sheets(excel_file_path)\n\
  ```\n\n`combine_sheets()` 自定义函数将位于传递的文件路径中的工作簿中的工作表合并，并将它们放入一个数据框中。该数据框存储在 `combined_workbook`\
  \ 变量中。\n\n### 步骤 12：将 `combined_workbook` 数据框追加到 `combined_workbooks` 数据框\n\n执行此任务所需的代码如下：\n\
  \n```\ncombined_workbooks = combined_workbooks.append(combined_workbook,\nignore_index=True)\n\
  ```\n\n该代码使用 `combined_workbooks` 数据框的 `append` 方法将 `combine_workbook` 数据框追加到其中。`ignore_index`\
  \ 参数设置为 `True`，因为你希望忽略 `combined_workbook` 数据框中的索引，并使用 `combined_workbooks` 中的索引。\n\
  \n### 步骤 13：复制 Python 脚本并通过 Power BI 中的 GetData 将其粘贴到 Python 编辑器中\n\n以下是完整的脚本：\n\
  \n```\nimport os\nimport pandas as pd\ndef combine_sheets(excel_file_path):\nxlsx_file\
  \ = pd.ExcelFile(excel_file_path)\nws = xlsx_file.sheet_names\ndf = pd.concat(pd.read_excel(xlsx_file,\
  \ sheet_name=ws))\nreturn df\nos.chdir(\"<full path to SalesData_WorkbookFormat\"\
  )\nexcel_file_paths = os.listdir(\".\")\ncombined_workbooks = pd.DataFrame()\nfor\
  \ excel_file_path in excel_file_paths:\ncombined_workbook = combine_sheets(excel_file_path)\n\
  combined_workbooks = combined_workbooks.append(\ncombined_workbook, ignore_index=True)\n\
  ```\n\n如果你复制该脚本并通过 `GetData` 将其粘贴到 Power BI 的 Python 编辑器中，你将获得一个可以添加到 Power BI 数据模型的数据集。\n\
  \n在本章中，你实现了一个使用 Power Query 和 M 语言很难完成的工作流。完成该工作流所需的 R 和 Python 代码比执行相同任务所需的 M 代码更简洁且更易于理解。你还学习了如何使用\
  \ R 和 Python 将函数中重复多次的逻辑抽象出来，以提高代码效率和可读性。在下一章中，你将学习如何通过 R 和 Python 在 Power BI 中与\
  \ `SQL Server` 进行交互。\n\n"
- '# 5. 读取 SQL Server 数据


  Power BI 的内置 ETL 工具 Power Query 能够将存储在各种格式中的数据读取到内存中，在内存中对数据进行转换，并将转换后的数据加载到 Power
  BI 数据模型中。它在处理这些类型的任务方面表现出色，因为它可以处理大多数 ETL 情况。


  然而，如果你想记录有关 Power BI 数据加载的信息，Power BI 就力不从心了。Power Query 旨在读取数据，而不是写入数据。幸运的是，R 和
  Python 的情况并非如此。R 和 Python 分别拥有使数据记录相对容易的包和库。R 和 Python 都可以写入从平面文件到数据库的多种数据源。在此示例中，你将使用
  R 和 Python 将有关数据加载的信息记录到 SQL Server 数据库中。




  '
- '# 将 AdventureWorksDW_StarSchema 数据库添加到您的 SQL Server 实例中


  本章的示例需要将 `AdventureWorksDW_StarSchema` 数据库作为数据源。该数据库是微软开发的 `AdventureWorksDW` 数据库的一个子集。请执行以下步骤，将该数据库还原到您的
  SQL Server 实例中：


  1.  前往本书的代码仓库，然后导航至第 5 章的 `Data` 文件夹。您会在此位置找到 `AdventureWorksDW_StarSchema.bak`
  文件的压缩版本。解压 `AdventureWorksDW_StarSchema.zip` 文件，以获取 `AdventureWorksDW_StarSchema.bak`
  文件。


  2.  将 `AdventureWorksDW_StarSchema.bak` 文件复制到 SQL Server 的 `Backup` 文件夹中。在 `数据科学虚拟机
  (DSVM)` 中，该文件夹的位置是 `C:\Program Files\Microsoft SQL Server\MSSQL15.MSSQLSERVER\MSSQL\Backup`。


  3.  打开 `SQL Server Management Studio` (SSMS)，右键点击 `Databases` 文件夹，然后选择 `Restore
  Databases…`。


  4.  此时会弹出 `Restore Database` 表单。请确保您位于 `General` 页面选项卡上。在 `Source` 部分，选中 `Device`
  单选按钮。


  5.  点击省略号按钮（即带有三个点的按钮），然后点击 `Add` 按钮。接下来，浏览到 `AdventureWorksDW_StarSchema.bak` 文件所在的位置。


  6.  选择 `AdventureWorksDW_StarSchema.bak` 文件，然后点击 `OK` 按钮关闭 `Locate Backup File`
  表单。


  7.  点击 `OK` 关闭 `Select backup devices` 表单。


  8.  点击 `OK` 关闭 `Restore Database` 表单。执行此操作将添加该数据库。


  ## 使用 R 语言将 SQL Server 数据读取到 Power BI 中


  场景如下：您是 `Clothing R Us` 公司的一名分析师。该公司的 IT 部门规模较小，数据库管理员 Vihaan 同时兼任系统工程师。公司没有专门的商业智能人员。您向首席财务官
  Adaugo 阐述了商业智能的优势，以及它如何能帮助公司基于自身经验做出明智的决策。她同意让 Vihaan 围绕互联网销售构建一个小型数据集市。该数据集市包含一个事实表和四个维度表。所有维度表都是类型
  1 维度，并且每次加载数据仓库都是“先清空再填充”。Vihaan 开发了一个 ETL 流程，但该 ETL 流程没有包含任何日志记录来监控加载到数据集市中的数据量。这个概念验证
  (POC) 的成功对您至关重要，因此您主动承担起开发一个日志系统的任务，将其作为一种完整性检查手段，以确保加载到 Power BI 中的数据是合理的。


  在类型 1 缓慢变化维度 (SCD) 中，新信息会覆盖原始信息，因此不会保留历史记录。在类型 2 SCD 中，会向表中添加一条新记录来表示新信息。原始记录和新记录都将存在。


  您知道 Power Query 旨在将数据读取到 Power BI 中，但它并非为写入数据而设计。您的同事 Sarah 告诉您，使用 R 或 Python 可以相对容易地将数据写回数据库。您向她分享了需要记录哪些信息，她为您提供了
  R 和 Python 两种语言的说明。以下是 R 语言的说明。


  ### 步骤 1：为 SQL Server 数据库创建一个 DSN


  您需要向 SQL Server 提供身份验证信息，以便能够连接到数据库。有多种方法可以实现这一点，但您将使用的是 DSN（数据源名称）方法。在 Windows
  10 中，DSN 的创建和配置相对容易。具体步骤如下：


  1.  转到位于任务栏左侧、`Windows` 图标旁边的 `Cortana 搜索栏`，然后输入 `管理工具`。


  2.  您将看到一个管理工具快捷方式的列表。搜索 `ODBC 数据源 (64 位)` 并双击它。


  3.  此时应弹出一个包含多个选项卡的 `ODBC 数据源管理器 (64 位)` 对话框。点击 `系统 DSN` 选项卡。使用此选项卡可以确保您计算机上的所有用户都能访问此
  DSN。如果您只希望当前用户有权访问该 DSN，则可以停留在 `用户 DSN` 选项卡上。


  4.  点击 `添加` 按钮。


  5.  您将看到一个可供选择的驱动程序列表，其中包含 SQL Server。选择 `SQL Server`，然后点击 `完成` 按钮。


  6.  接下来，将弹出 `创建到 SQL Server 的新数据源` 对话框。这是您配置 DSN 的地方。`名称` 是 R 语言用来引用此 DSN 的名称，`描述`
  可以是您用来描述此 DSN 的任何内容，`服务器` 是托管您要连接的数据库的 SQL Server 的名称。


  将 `名称` 设置为 `SQLServer2019`，将 `描述` 也设置为 `SQLServer2019`。如果您使用的不是 SQL Server 2019，请使用一个能标识您所用
  SQL Server 版本的名称。下图显示了一个使用 SQL Server 2017 的示例。接下来，您需要检索要使用的 SQL Server 实例的名称。要获取服务器名称，请打开
  `SQL Server Management Studio` 并连接到该 SQL Server 实例。`服务器名称` 组合框中显示的名称，就是您需要在 `创建到
  SQL Server 的新数据源` 表单的 `服务器` 组合框中使用的名称。复制该服务器名称并粘贴到 `服务器` 组合框中。填写完表单后，它应该看起来像图 5-1
  所示。如果一切看起来正确，请点击 `下一步`。


